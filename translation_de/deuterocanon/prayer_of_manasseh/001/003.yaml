  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der das Meer durch das Wort deines Befehls gebändigt hat“. Das griechische Bild bedeutet wörtlicher „gebunden“ oder „gefesselt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πεδήσας
  choice: der … gebunden hat
  rationale: Das substantivierte Aoristpartizip bezeichnet den, der etwas gebunden oder gefesselt hat. „Gebunden“ bewahrt das konkrete griechische Bild und klingt im Deutschen natürlicher als „gefesselt“ in Verbindung mit dem Meer.
- source_word: τὴν θάλασσαν
  choice: das Meer
  rationale: θάλασσα bezeichnet hier unmittelbar das Meer; eine Wiedergabe als „Wasser“ wäre weiter als der griechische Wortlaut.
- source_word: τῷ λόγῳ
  choice: durch das Wort
  rationale: λόγος meint hier das wirksame, autoritative Wort. „Durch das Wort“ gibt den instrumentalen Dativ wieder und wahrt den Bezug auf göttliches Sprechen.
- source_word: τοῦ προστάγματός σου
  choice: deines Befehls
  rationale: πρόσταγμα bezeichnet eine verbindliche Anordnung oder einen Befehl. Die Genitivverbindung wird bewusst eng als „das Wort deines Befehls“ wiedergegeben.
theological_decisions:
- issue: Göttliche Herrschaft über das Meer im Bild des Bindens
  choice: Das konkrete Bild „das Meer … gebunden“ wird beibehalten.
  alternative: „das Meer … gebändigt“ oder „dem Meer Grenzen gesetzt“
  rationale: Der griechische Text schildert Gottes Herrschaft mit einem anschaulichen Ausdruck für Binden oder Fesseln. Eine glättende Deutung als Begrenzung würde eine Erklärung in den Haupttext eintragen und die Bildkraft abschwächen.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die leicht feierliche Genitivfügung „das Wort deines Befehls“ folgt dem griechischen Ausdruck und bewahrt dessen theologische Dichte.
