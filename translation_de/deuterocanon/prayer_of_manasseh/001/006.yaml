translation:
  language: de
  text: und das Erbarmen deiner Verheißung ist unermesslich und unergründlich;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein verheißenes Erbarmen“ oder „das in deiner Verheißung erwiesene Erbarmen“. Der griechische Genitiv lässt mehrere eng verwandte Deutungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμέτρητόν
  choice: unermesslich
  rationale: Das Adjektiv bezeichnet etwas, das sich nicht messen lässt. „Unermesslich“ bewahrt die quantitative Aussage und klingt im heutigen Deutsch natürlich und würdig.
- source_word: ἀνεξιχνίαστον
  choice: unergründlich
  rationale: Das Wort bezeichnet etwas, das sich nicht aufspüren oder vollständig erforschen lässt. „Unergründlich“ gibt diesen Sinn im Deutschen idiomatisch wieder und bildet mit „unermesslich“ ein passendes Begriffspaar.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: ἔλεος bezeichnet Erbarmen oder Barmherzigkeit. „Erbarmen“ ist hier knapp, verständlich und dem Gebets- und Bußkontext angemessen.
- source_word: ἐπαγγελίας
  choice: Verheißung
  rationale: ἐπαγγελία bedeutet Zusage oder Verheißung. „Verheißung“ bewahrt den feierlichen, auf Gottes Zusage bezogenen Klang, ohne die Genitivbeziehung näher festzulegen.
- source_word: τε καὶ
  choice: und
  rationale: Die Partikeln verbinden und verstärken die beiden Prädikatsadjektive. Das einfache „und“ gibt die Verbindung in natürlichem Deutsch angemessen wieder.
theological_decisions:
- issue: Verhältnis von „Erbarmen“ und „Verheißung“ in τὸ ἔλεος τῆς ἐπαγγελίας σου
  choice: „das Erbarmen deiner Verheißung“
  alternative: „dein verheißenes Erbarmen“ oder „das in deiner Verheißung erwiesene Erbarmen“
  rationale: Die gewählte Form bewahrt die griechische Genitivkonstruktion und lässt offen, ob das Erbarmen verheißen ist, sich in der Verheißung zeigt oder zu ihr gehört. Eine glattere deutsche Formulierung würde diese Beziehung stärker festlegen, als es der griechische Wortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. „Erbarmen“ ist allgemein verständlich und für ein Bußgebet angemessen; die Genitivfügung bleibt bewusst leicht ungewohnt, um die echte Mehrdeutigkeit des Ausgangstextes zu erhalten.
