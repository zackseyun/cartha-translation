  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/008.yaml
  text: So you[a], Lord, God of the righteous, did not appoint repentance for the righteous—for Abraham and Isaac and Jacob, who did not sin against you—but you appointed repentance for me, the sinner,
translation:
  language: de
  text: So hast du, Herr, Gott der Gerechten, für die Gerechten keine Umkehr vorgesehen[a] – für Abraham, Isaak und Jakob, die nicht gegen dich gesündigt haben –, sondern für mich, den Sünder, hast du Umkehr vorgesehen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Gerechten keine Umkehr bestimmt“. Das Verb kann „setzen“, „festlegen“ oder „vorsehen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ οὖν
  choice: So hast du
  rationale: οὖν kennzeichnet einen folgernden oder wiederaufnehmenden Übergang. „So hast du“ gibt diesen Zusammenhang in natürlichem Deutsch wieder und hebt zugleich das angesprochene „du“ hervor.
- source_word: κύριε
  choice: Herr
  rationale: Die übliche und dem Gebetsstil angemessene Wiedergabe der direkten Anrede κύριε ist „Herr“.
- source_word: ὁ θεὸς τῶν δικαίων
  choice: Gott der Gerechten
  rationale: Die Genitivverbindung wird knapp und nah am griechischen Wortlaut wiedergegeben; die Formulierung bewahrt zudem die Verbindung zum folgenden „den Gerechten“.
- source_word: οὐκ ἔθου μετάνοιαν
  choice: hast ... keine Umkehr bestimmt
  rationale: τίθημι bedeutet hier „setzen“ oder „bestimmen“, während μετάνοια eine Umkehr beziehungsweise Sinnesänderung bezeichnet. „Umkehr bestimmen“ bewahrt die Aussage vom bewussten göttlichen Handeln, ohne den Begriff zu einer bloßen Gelegenheit zum Bereuen abzuschwächen.
- source_word: δικαίοις
  choice: den Gerechten
  rationale: Der Dativ wird direkt beibehalten. „Die Gerechten“ wahrt den wiederholten δικαιος-Wortlaut und den Gegensatz zu „dem Sünder“.
- source_word: τῷ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Abraham, Isaak und Jakob
  rationale: Die Namen stehen als nähere Bestimmung zu „den Gerechten“ und werden deshalb im Deutschen als Apposition wiedergegeben.
- source_word: τοῖς οὐχ ἡμαρτηκόσιν σοι
  choice: die nicht gegen dich gesündigt haben
  rationale: Das griechische Perfektpartizip wird mit dem deutschen Perfekt wiedergegeben. „Gegen dich“ bezeichnet Gott als den von der Sünde Betroffenen.
- source_word: ἀλλ᾽ ἔθου μετάνοιαν ἐμοὶ
  choice: sondern mir ... hast du Umkehr bestimmt
  rationale: „Sondern“ bildet den scharfen Gegensatz nach der vorausgehenden Verneinung ab. Die Wiederholung von „Umkehr bestimmt“ erhält den Parallelismus des griechischen Satzes.
- source_word: τῷ ἁμαρτωλῷ
  choice: dem Sünder
  rationale: Der bestimmte Artikel und die Apposition zu ἐμοί werden bewahrt. Die Formulierung trägt den selbsterniedrigenden Gegensatz zu „den Gerechten“.
theological_decisions:
- issue: Die Aussage, Abraham, Isaak und Jakob hätten nicht gegen Gott gesündigt, steht in Spannung zu anderen biblischen Darstellungen der Erzväter.
  choice: „die nicht gegen dich gesündigt haben“ bleibt ohne Einschränkung stehen.
  alternative: Mögliche harmonisierende Zusätze wären „die nicht schwer gegen dich gesündigt haben“, „die vor dir nicht als Sünder galten“ oder „die darin nicht gegen dich gesündigt haben“.
  rationale: Der griechische Text sagt ausdrücklich οὐχ ἡμαρτηκόσιν σοι und enthält keine solche Einschränkung. Die rhetorische und theologische Spannung des Gebets darf nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Der Gedankenstrich kennzeichnet die lange Apposition mit den Namen der Erzväter und hält den Hauptgegensatz zwischen „den Gerechten“ und „mir, dem Sünder“ verständlich. Das abschließende Komma bleibt erhalten, weil der Vers syntaktisch in den folgenden Zusammenhang weiterführt.
