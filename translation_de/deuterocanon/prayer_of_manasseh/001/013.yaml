base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/013.yaml
  text: 'I beg you[a], pleading with you: forgive me, Lord, forgive me, and do not destroy me along with my lawless deeds, nor, being angry forever, keep my evils against me, nor condemn me in the lowest parts of the earth; for you, Lord[b], are the God of those who repent[c],'
translation:
  language: de
  text: 'Ich bitte dich und flehe dich an: Vergib mir, Herr, vergib mir! Vernichte mich nicht zusammen mit meinen gesetzlosen Taten. Halte mir meine bösen Taten nicht für immer im Zorn vor[a], und verurteile mich nicht in den tiefsten Bereichen der Erde[b]. Denn du, Herr, bist der Gott derer, die umkehren[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Rechne mir meine bösen Taten nicht für immer im Zorn an.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in den Tiefen der Erde“. Gemeint sind die untersten Bereiche unter der Erde.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die bereuen“ beziehungsweise „Buße tun“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτοῦμαι δεόμενός σου
  choice: Ich bitte dich und flehe dich an
  rationale: Die Verbindung der beiden Verben verstärkt die eindringliche Bitte. Die deutsche Doppelwendung gibt diese Steigerung natürlich und würdig wieder.
- source_word: ἄνες μοι
  choice: Vergib mir
  rationale: Das Verb bezeichnet hier im Bußgebet das Erlassen von Schuld; „vergib mir“ ist die klare und kontextgemäße Wiedergabe.
- source_word: συναπολέσῃς με ταῖς ἀνομίαις μου
  choice: Vernichte mich nicht zusammen mit meinen gesetzlosen Taten
  rationale: „Zusammen mit“ erhält die Mitbedeutung des Präfixes συν-, während „gesetzlose Taten“ die stärkere Nuance von ἀνομία gegenüber dem allgemeinen „Sünden“ bewahrt.
- source_word: μηνίσας ... εἰς τὸν αἰῶνα
  choice: auf ewig zornig
  rationale: Die Formulierung lässt offen, ob die zeitliche Bestimmung besonders den Zorn oder das Aufbewahren der bösen Taten prägt, und bildet die griechische Spannung knapp ab.
- source_word: τηρήσῃς τὰ κακά μοι
  choice: meine bösen Taten aufbewahren
  rationale: τηρέω bezeichnet ein Bewahren oder Behalten; im Zusammenhang ist gemeint, dass die Verfehlungen dem Beter weiterhin entgegengehalten werden.
- source_word: ἐν τοῖς κατωτάτοις τῆς γῆς
  choice: in den tiefsten Bereichen der Erde
  rationale: Die Wiedergabe erhält sowohl die lokale Präposition ἐν als auch den Superlativ κατωτάτοις und bleibt im Deutschen verständlich.
- source_word: τῶν μετανοούντων
  choice: derer, die umkehren
  rationale: „Umkehren“ bewahrt die aktive, richtungsändernde Bedeutung des Partizips und vermeidet eine unnötige Festlegung auf bloß inneres Bedauern.
- source_word: κύριε
  choice: Herr
  rationale: „Herr“ ist die eingebürgerte und angemessene deutsche Anrede Gottes für κύριε.
theological_decisions:
- issue: Bedeutung von ἀνομία
  choice: gesetzlose Taten
  alternative: Sünden
  rationale: Die konkretere Wiedergabe bewahrt das Motiv der Gesetzlosigkeit und schwächt die moralische Schwere nicht zu einem allgemeineren Sündenbegriff ab.
- issue: Bedeutung von μετανοούντων
  choice: die umkehren
  alternative: die bereuen / die Buße tun
  rationale: „Umkehren“ wahrt die dynamische Bedeutung, ohne die Aussage konfessionell oder ritualistisch einzuengen.
- issue: Ort beziehungsweise Ziel der Verurteilung bei ἐν τοῖς κατωτάτοις τῆς γῆς
  choice: in den tiefsten Bereichen der Erde
  alternative: in die Tiefen der Erde
  rationale: Das griechische ἐν wird lokal wiedergegeben. Eine zielgerichtete Übersetzung mit „in die“ wäre idiomatisch möglich, legte die Konstruktion jedoch stärker aus.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die Wiederholung „Vergib mir“ und die eindringliche Doppelbitte am Anfang bleiben erhalten. Der lange griechische Satz wird zur besseren Verständlichkeit behutsam gegliedert; das abschließende Komma signalisiert, dass der Gedanke im folgenden Vers weitergeht.
