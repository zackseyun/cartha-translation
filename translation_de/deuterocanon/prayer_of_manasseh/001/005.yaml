translation:
  language: de
  text: Vor ihm erschauert und zittert alles angesichts deiner Macht[a]; denn die Erhabenheit deiner Herrlichkeit ist nicht auszuhalten[b], und der Zorn deiner Drohung gegen die Sünder ist unerträglich[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Angesicht deiner Macht her“; auch: „vor der Gegenwart deiner Macht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Der Erhabenheit deiner Herrlichkeit kann niemand standhalten.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Der Zorn deiner Drohung gegen die Sünder ist nicht zu ertragen“ oder: „… kann nicht standgehalten werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν πάντα φρίσσει καὶ τρέμει
  choice: Vor ihm erschauert und zittert alles
  rationale: Das Relativpronomen bezieht sich auf Gott im vorausgehenden Zusammenhang. „Vor ihm“ gibt die Reaktion in seiner Gegenwart natürlich wieder; das neutrale πάντα bezeichnet umfassend „alles“. „Erschauert und zittert“ bewahrt die intensive, poetische Doppelung.
- source_word: ἀπὸ προσώπου τῆς δυνάμεώς σου
  choice: angesichts deiner Macht
  rationale: ἀπὸ προσώπου bedeutet wörtlich „vom Angesicht/der Gegenwart her“. „Angesichts deiner Macht“ bewahrt das Gegenwartsmotiv in idiomatischem Deutsch und bezeichnet die göttliche Macht als Anlass des Erschauerns.
- source_word: ἄστεκτος
  choice: nicht auszuhalten
  rationale: Das Wort bezeichnet etwas, dem man nicht standhalten kann oder das nicht zu ertragen ist. Die Formulierung ist verständlich und lässt beide Nuancen anklingen.
- source_word: μεγαλοπρεπία τῆς δόξης σου
  choice: die Erhabenheit deiner Herrlichkeit
  rationale: μεγαλοπρεπία bezeichnet majestätische Größe oder Pracht; „Erhabenheit“ verbindet sich im Deutschen würdig und natürlich mit „Herrlichkeit“.
- source_word: ἀνυπόστατος
  choice: unerträglich
  rationale: Das Adjektiv bezeichnet etwas, das nicht getragen, ausgehalten oder abgewehrt werden kann. „Unerträglich“ wahrt die Parallelität zu ἄστεκτος, ohne dieselbe Wendung zu wiederholen.
- source_word: ἡ ὀργὴ τῆς ἐπὶ ἁμαρτωλοὺς ἀπειλῆς σου
  choice: der Zorn deiner Drohung gegen die Sünder
  rationale: Die genitivische Fügung wird formal bewahrt, statt sie eindeutig als „angedrohter Zorn“ aufzulösen. ἐπὶ ἁμαρτωλούς gibt die Ausrichtung gegen die Sünder an.
theological_decisions:
- issue: Personale Rede von Gottes Zorn und Drohung
  choice: der Zorn deiner Drohung gegen die Sünder
  alternative: der den Sündern angedrohte Zorn
  rationale: Der griechische Text nennt ausdrücklich Zorn und Drohung und verbindet sie in einer mehrdeutigen Genitivkonstruktion. Die Übersetzung erhält diese starke personale und gerichtliche Sprache sowie die Spannung der Konstruktion, ohne sie dogmatisch auszuformen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit liturgischem Klang. Die parallelen Verben und die zwei nahezu synonymen Aussagen über das Nicht-aushalten-Können bleiben erkennbar, ohne unnötig altertümliche Ausdrücke zu verwenden.
