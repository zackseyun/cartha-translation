base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/015.yaml
  text: And I will praise you continually all the days of my life[a], for all the host of the heavens sings praise to you, and yours is the glory forever[c][b]. Amen.
translation:
  language: de
  text: Und ich werde dich allezeit preisen, solange ich lebe; denn die ganze Heerschar der Himmel[a] singt dir Lob, und dein ist die Herrlichkeit in Ewigkeit. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Macht der Himmel“; auch die gesamte Macht der Himmel kann gemeint sein. Der griechische Ausdruck kann die himmlischen Mächte beziehungsweise Wesen als Heerschar bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνέσω
  choice: ich werde … preisen
  rationale: Das Futur von αἰνέω bezeichnet hier das künftige beziehungsweise entschlossene Loben; die deutsche Formulierung bewahrt diesen Sinn klar und natürlich.
- source_word: διὰ παντὸς ἐν ταῖς ἡμέραις τῆς ζωῆς μου
  choice: allezeit …, solange ich lebe
  rationale: „Allezeit“ gibt das idiomatische διὰ παντός wieder; „solange ich lebe“ überträgt die Zeitspanne von ἐν ταῖς ἡμέραις τῆς ζωῆς μου natürlich, ohne ein im Griechischen nicht vorhandenes πάσαις ausdrücklich mit „an allen Tagen“ nachzubilden.
- source_word: ὑμνεῖ
  choice: singt … Lob
  rationale: ὑμνέω bezeichnet Lob, häufig ausdrücklich gesungenes Lob. Die Wendung erhält diese musikalisch-liturgische Nuance.
- source_word: πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: die ganze Heerschar der Himmel
  rationale: δύναμις kann im jüdisch-griechischen Sprachgebrauch in himmlischem Zusammenhang kollektiv die himmlischen Mächte oder das Himmelsheer bezeichnen. „Heerschar“ wahrt den wahrscheinlich personalen und kollektiven Sinn, ohne die Wesen näher zu bestimmen.
- source_word: σοῦ ἐστιν ἡ δόξα
  choice: dein ist die Herrlichkeit
  rationale: Die vorangestellte Besitzangabe wird durch die doxologisch geprägte und im Deutschen verständliche Wortstellung angemessen hervorgehoben.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die Wendung ist eine übliche doxologische Bezeichnung unbegrenzter Dauer; „in Ewigkeit“ entspricht dem würdigen Gebetsregister.
- source_word: ἀμήν
  choice: Amen
  rationale: Die traditionelle liturgische Transliteration wird im Deutschen beibehalten.
theological_decisions:
- issue: Deutung von πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: kollektive Bezeichnung der himmlischen Heerschar
  alternative: die gesamte Macht der Himmel oder jede himmlische Macht
  rationale: Der doxologische Zusammenhang und der biblisch-griechische Gebrauch von δύναμις sprechen für himmlische Wesen beziehungsweise Mächte. Die Fußnote bewahrt jedoch die lexikalisch mögliche Deutung als „Macht“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit liturgischem Klang. Die Formulierungen bleiben allgemein verständlich; „dein ist die Herrlichkeit“ ist bewusst doxologisch, ohne konfessionelle Sonderprägung.
