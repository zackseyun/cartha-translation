  source_fidelity: 'Die Übersetzung gibt sämtliche Elemente des griechischen Textes zutreffend wieder: καὶ νῦν als „Und nun“, κλίνω γόνυ καρδίας als bewusst bildhaftes „beuge ich das Knie meines Herzens“, δεόμενος als „flehe“ und τῆς παρὰ σοῦ χρηστότητος als Bitte um die von Gott kommende „Güte“. Die Umformung des griechischen Partizips in eine koordinierte finite Verbform ist im Deutschen idiomatisch und bedeutungstreu.'
  naturalness: „Und nun beuge ich das Knie meines Herzens und flehe um die Güte, die von dir kommt“ ist würdiges, verständliches modernes Standarddeutsch. Die ungewohnte Metapher ist absichtlich quellennah erhalten und wird nicht unnötig geglättet.
  terminology: „Güte“ ist für χρηστότης eine geeignete, theologisch nicht einengende Wiedergabe. Die Anrede „dir“ wahrt den Gebetscharakter. Die Fußnoten erläutern sowohl die Metapher als auch die Herkunftsnuance von παρὰ σοῦ angemessen; ihre Marker sind korrekt verankert.
