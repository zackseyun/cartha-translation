  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/011.yaml
  text: And now I bend the knee of my heart[a], imploring the kindness from you[b];
translation:
  language: de
  text: Und nun beuge ich das Knie meines Herzens[a] und flehe um die Güte, die von dir kommt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „neige ich das Knie meines Herzens“. Das Griechische bewahrt das anschauliche Bild eines inneren Kniens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um deine Güte“. Wörtlich steht „die Güte von dir“; die Formulierung betont, dass diese Güte von Gott ausgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von καί als auch den unmittelbaren zeitlichen Übergang durch νῦν.
- source_word: κλίνω
  choice: beuge ich
  rationale: Gibt das konkrete Beugen oder Neigen wieder und verbindet sich im Deutschen natürlich mit „das Knie“.
- source_word: γόνυ καρδίας
  choice: das Knie meines Herzens
  rationale: Bewahrt den auffälligen Singular und das anschauliche Bild einer inneren, demütigen Kniebeugung, ohne es erklärend aufzulösen.
- source_word: δεόμενος
  choice: und flehe
  rationale: Das griechische Partizip bezeichnet eine eindringliche, demütige Bitte. Die finite Beiordnung ist im Deutschen natürlich und erhält die Intensität.
- source_word: τῆς παρὰ σοῦ χρηστότητος
  choice: um die Güte, die von dir kommt
  rationale: „Güte“ deckt die Bedeutung von χρηστότης angemessen ab; der Relativsatz macht παρὰ σοῦ ausdrücklich sichtbar und vermeidet die unnatürliche Formulierung „die Güte von dir“.
theological_decisions:
- issue: Bildhafte Wendung γόνυ καρδίας
  choice: Das Bild als „das Knie meines Herzens“ beibehalten.
  alternative: „mein Herz in Demut beugen“
  rationale: Die Reue und Demut werden im Ausgangstext durch das Bild eines inneren Kniens ausgedrückt. Die wörtliche Bildstruktur bewahrt diese rhetorische und geistliche Spannung, ohne sie interpretierend einzuebnen.
- issue: Herkunft der χρηστότης in παρὰ σοῦ
  choice: „die Güte, die von dir kommt“
  alternative: „deine Güte“ oder „um Güte von dir“
  rationale: Die gewählte Fassung hält ausdrücklich fest, dass die erbetene Güte von Gott ausgeht, ohne näher zu bestimmen, ob primär eine Eigenschaft Gottes oder eine von ihm gewährte Wohltat gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ungewöhnliche Herzensbild bleibt bewusst erhalten; „flehe“ trägt den ernsten Gebetston, ohne altertümlich zu wirken.
