base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/014.yaml
  text: and in me you will show your kindness[a]; for you will save me, though I am unworthy, according to your abundant mercy[b],
translation:
  language: de
  text: Und an mir wirst du deine Güte zeigen[a]; denn obwohl ich unwürdig bin, wirst du mich retten nach deinem großen Erbarmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in mir“; auch möglich: „mir gegenüber“ oder „durch mich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach deiner großen Barmherzigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δείξεις
  choice: wirst du zeigen
  rationale: Das Futur Aktiv von δείκνυμι wird direkt und natürlich mit „zeigen“ wiedergegeben.
- source_word: ἐν ἐμοί
  choice: an mir
  rationale: Das griechische ἐν bedeutet wörtlich „in“, bezeichnet hier aber idiomatisch die Person bzw. den Fall, an dem Gottes Güte sichtbar wird. „An mir“ bewahrt diesen Gedanken im natürlichen Deutschen; die wörtliche Fassung und weitere mögliche Nuancen stehen in der Fußnote.
- source_word: χρηστότητά
  choice: Güte
  rationale: χρηστότης kann Güte oder Freundlichkeit bezeichnen. „Güte“ ist würdig und breit genug und erhält den lexikalischen Bezug zu demselben Begriff in Vers 11.
- source_word: ἀνάξιον ὄντα
  choice: obwohl ich unwürdig bin
  rationale: Die Partizipialwendung bedeutet wörtlich „unwürdig seiend“; die konzessive Wiedergabe macht den im Zusammenhang liegenden Gegensatz zu Gottes rettendem Handeln idiomatisch deutlich.
- source_word: σώσεις
  choice: wirst du mich retten
  rationale: σῴζω umfasst Retten, Befreien und Heil; „retten“ bewahrt diese Bedeutungsbreite im Deutschen.
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: nach deinem großen Erbarmen
  rationale: κατά mit Akkusativ bezeichnet hier Maßstab oder Entsprechung. „Nach“ bildet dies knapp ab; πολὺ bezeichnet die Größe bzw. Fülle des Erbarmens.
theological_decisions:
- issue: Wie ἐν ἐμοί wiederzugeben ist
  choice: an mir
  alternative: in mir; mir gegenüber; durch mich
  rationale: „An mir“ lässt Gottes Güte im Fall des betenden Manasse sichtbar werden, ohne festzulegen, ob der Schwerpunkt auf ihrem inneren Wirken, ihrer Zuwendung zu ihm oder ihrer öffentlichen Erweisung durch sein Beispiel liegt.
- issue: Verhältnis von Unwürdigkeit und Rettung
  choice: 'konzessiv: „obwohl ich unwürdig bin“'
  alternative: 'formal-partizipial: „da ich unwürdig bin“ bzw. „als Unwürdigen“'
  rationale: Der Zusammenhang legt einen Gegensatz zwischen menschlicher Unwürdigkeit und göttlichem Erbarmen nahe. Die Fassung macht diesen Gegensatz deutlich, ohne die Rettung als Verdienst darzustellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, während „an mir“ und der konzessive Nebensatz natürliches Deutsch gewährleisten. „Güte“ hält die begriffliche Verbindung zu χρηστότης in Vers 11 aufrecht.
