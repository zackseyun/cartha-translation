  source_fidelity: 'Der deutsche Text gibt den griechischen Satz vollständig und sachgerecht wieder: δείξεις als Futur („wirst du … zeigen“), ἐν ἐμοί idiomatisch und zugleich offen als „an mir“, χρηστότης als „Güte“, ἀνάξιον ὄντα treffend konzessiv, σώσεις als „wirst du mich retten“ sowie κατὰ τὸ πολὺ ἔλεός σου als „nach deinem großen Erbarmen“. Die Stellung von „obwohl ich unwürdig bin“ ist im Deutschen natürlich und erhält den Kontrast des Partizips zur Rettung.'
  naturalness: Modernes, würdiges Standarddeutsch. „An mir wirst du deine Güte zeigen“ ist eine natürliche, für Gebetssprache passende Formulierung und vermeidet die im Deutschen weniger idiomatische, zu stark innerlich verstandene Wendung „in mir“.
  terminology: „Güte“ ist für χρηστότης angemessen und bewahrt, wie im Audit Trail vermerkt, die begriffliche Verbindung zu Vers 11. „Erbarmen“ ist eine gute Wiedergabe von ἔλεος; die Fußnotenalternative „Barmherzigkeit“ ist ebenfalls legitim. „Retten“ wahrt die theologisch und semantisch offene Reichweite von σῴζω.
