lexical_decisions:
- source_word: ὁ κλείσας
  choice: der ... verschlossen ... hat
  rationale: Das substantivierte Partizip beschreibt den angeredeten Gott innerhalb einer Folge von Aussagen. „Verschlossen“ bewahrt die konkrete Bedeutung von κλείω und passt zur Vorstellung, dass der Abgrund eingeschlossen wird.
- source_word: τὴν ἄβυσσον
  choice: den Abgrund
  rationale: ἄβυσσος bezeichnet im biblischen Griechisch häufig die unergründliche beziehungsweise kosmische Tiefe. „Abgrund“ ist im Deutschen natürlich und bewahrt diese Resonanz.
- source_word: σφραγισάμενος
  choice: versiegelt hat
  rationale: Das Medium bezeichnet hier das sichere Versiegeln. Die koordinierte Perfektform ergibt zusammen mit dem vorausgehenden Partizip einen natürlichen deutschen Relativsatz.
- source_word: αὐτὴν
  choice: ihn
  rationale: Das Pronomen verweist auf den im Deutschen maskulinen „Abgrund“ zurück.
- source_word: τῷ ... ὀνόματί σου
  choice: mit deinem ... Namen
  rationale: Der instrumentale Dativ bezeichnet das Mittel der Versiegelung und wird daher mit „mit“ wiedergegeben.
- source_word: φοβερῷ
  choice: furchtgebietenden
  rationale: φοβερός kann „Furcht einflößend“ oder „Ehrfurcht erweckend“ bedeuten. „Furchtgebietend“ ist im modernen Deutschen würdig und vermeidet das mögliche Missverständnis, Gott selbst sei furchtsam.
- source_word: ἐνδόξῳ
  choice: herrlichen
  rationale: „Herrlich“ gibt Ehre, Glanz und Hoheit wieder und fügt sich natürlich in die feierliche Gebetssprache ein.
theological_decisions:
- issue: Wiedergabe von φοβερῷ als Eigenschaft des Namens Gottes
  choice: furchtgebietenden
  alternative: Ehrfurcht erweckenden
  rationale: Der Ausdruck bewahrt die Aussage, dass Gottes Name Furcht beziehungsweise ehrfürchtiges Erschauern hervorruft, ohne die Spannung einseitig auf bloße Bewunderung zu reduzieren. Die semantisch mögliche Betonung der Ehrfurcht wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Der Relativsatz führt die griechische Partizipialkonstruktion natürlich fort; „furchtgebietend“ wahrt die feierliche und theologisch gewichtige Mehrdeutigkeit von φοβερός.
