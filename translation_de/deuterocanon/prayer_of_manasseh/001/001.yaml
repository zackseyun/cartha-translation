  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/001.yaml
  text: Lord Almighty[a], God of our fathers, of Abraham and Isaac and Jacob and of their righteous offspring,
translation:
  language: de
  text: Herr, allmächtiger Gott unserer Väter, Abrahams und Isaaks und Jakobs und ihrer gerechten Nachkommenschaft[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ihres gerechten Samens“. Das griechische Wort kann besonders in Zusammenhängen von Bund und Abstammung „Same“ bedeuten.'
    reason: lexikalische Alternative und Bundeskonnotation
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος ist hier eine unmittelbare Anrede Gottes. „Herr“ ist die natürliche und traditionsreiche deutsche Wiedergabe.
- source_word: παντοκράτωρ
  choice: Allmächtiger
  rationale: Das substantivierte Adjektiv bewahrt die direkte Anrede und gibt den geläufigen biblischen Gottestitel würdig und verständlich wieder.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Gott unserer Väter
  rationale: Die Formulierung erhält die feste biblische Bundesformel und gibt das ausdrücklich männliche πατέρων präzise wieder.
- source_word: τοῦ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: Abrahams und Isaaks und Jakobs
  rationale: Die Genitivreihe wird direkt an „Gott“ angeschlossen. Das wiederholte „und“ wahrt den feierlichen Rhythmus des Griechischen.
- source_word: σπέρματος
  choice: Nachkommenschaft
  rationale: Im Zusammenhang bezeichnet σπέρμα die Abstammungslinie. „Nachkommenschaft“ bewahrt den kollektiven Singular besser als der Plural „Nachkommen“, während die wörtlichere Möglichkeit „Same“ in der Fußnote erhalten bleibt.
- source_word: αὐτῶν
  choice: ihrer
  rationale: Das Pronomen bezieht sich grammatisch am natürlichsten auf die zuvor genannten drei Erzväter.
- source_word: τοῦ δικαίου
  choice: gerechten
  rationale: Das Adjektiv stimmt im Griechischen mit dem kollektiven Singular σπέρματος überein. „Gerecht“ ist die übliche biblische Wiedergabe der Wortfamilie δίκαιος.
theological_decisions:
- issue: Geschlechtsspezifische Bundessprache in τῶν πατέρων ἡμῶν
  choice: unserer Väter
  alternative: unserer Vorfahren
  rationale: Der griechische Text nennt ausdrücklich die „Väter“, und die Wendung ist eine feste biblische Bundesformel. Eine Neutralisierung würde diese sprachliche Gestalt abschwächen.
- issue: Wiedergabe von σπέρμα im Zusammenhang der Abstammungslinie
  choice: Nachkommenschaft
  alternative: Same; Nachkommen
  rationale: „Nachkommenschaft“ vermittelt im modernen Deutsch die kollektive Abstammungslinie, ohne die im Deutschen leicht missverständliche wörtliche Form „Same“ in den Haupttext zu setzen. Die Bundes- und Abstammungsresonanz der wörtlichen Alternative wird durch die Fußnote sichtbar gehalten.
- issue: Bezug und Zahl von αὐτῶν
  choice: ihrer, auf Abraham, Isaak und Jakob bezogen
  alternative: seiner, auf Abraham bezogen
  rationale: Die unmittelbare griechische Bezugsstruktur legt den pluralischen Rückbezug auf die drei genannten Erzväter nahe. Ein ausschließlich auf Abraham bezogener Singular würde den Text stärker festlegen, als es die vorliegende Form erlaubt.
translation_notes:
  register: Feierliche, aber verständliche Gebetssprache. Die knappe Reihung und das wiederholte „und“ spiegeln den würdevollen Rhythmus der griechischen Anrufung; das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeht.
