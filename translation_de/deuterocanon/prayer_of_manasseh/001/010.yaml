base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/010.yaml
  text: I am bent down with many iron bonds[a], so that I cannot lift up my head, and there is no relief for me; because I provoked your wrath and did what is evil before you[b], setting up abominations and multiplying offenses.
translation:
  language: de
  text: 'Ich bin durch eine schwere eiserne Fessel niedergebeugt, sodass ich mich nicht wieder aufrichten kann[a], und es gibt keine Erleichterung für mich; denn ich habe deinen Zorn gereizt und das Böse vor deinen Augen getan: Ich habe Gräuel aufgestellt[b] und Abscheulichkeiten vermehrt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass ich nicht wieder aufblicken kann“ oder „sodass ich mich nicht erholen kann“. Das griechische Verb kann körperliches Aufrichten beziehungsweise Aufblicken oder ein Sich-Erholen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Gräuel“ sind wahrscheinlich verabscheuungswürdige kultische Gegenstände oder Handlungen gemeint, besonders im Zusammenhang mit Götzendienst.
    reason: cultural_note
lexical_decisions:
- source_word: κατακαμπτόμενος
  choice: Ich bin niedergedrückt
  rationale: Das Partizip beschreibt ein Niedergebeugtsein unter einer Last. „Niedergedrückt“ wahrt das körperliche Bild und klingt im Deutschen natürlich und würdig.
- source_word: πολλῷ δεσμῷ σιδηρῷ
  choice: von schweren eisernen Fesseln
  rationale: δεσμός kann Fessel, Band oder Kette bedeuten; πολλῷ bezeichnet hier eher das große bzw. schwere Maß der Bindung als eindeutig eine Vielzahl. Der deutsche Plural „Fesseln“ gibt die konkrete Gefangenschaft idiomatisch wieder, während „schweren“ die Intensität bewahrt.
- source_word: εἰς τὸ ἀνανεῦσαί με
  choice: sodass ich mein Haupt nicht erheben kann
  rationale: ἀνανεύω kann das Wiederaufrichten, Aufblicken oder Sich-Erholen bezeichnen. Im Zusammenhang mit dem Niedergebeugtsein erhält „mein Haupt erheben“ das körperliche Bild; die im Kontext vorausgesetzte Unmöglichkeit wird ausdrücklich gemacht.
- source_word: ἄνεσις
  choice: Erleichterung
  rationale: ἄνεσις bezeichnet Lockerung, Entlastung oder Erleichterung. „Erleichterung“ umfasst hier sowohl die körperliche Bedrängnis als auch die innere Not.
- source_word: παρώργισα τὸν θυμόν σου
  choice: ich habe deinen Zorn herausgefordert
  rationale: 'παροργίζω hat eine verursachende Bedeutung: zum Zorn reizen bzw. Zorn hervorrufen. „Herausgefordert“ bewahrt diese Nuance und die Ernsthaftigkeit des göttlichen Zorns.'
- source_word: τὸ πονηρὸν ἐνώπιόν σου ἐποίησα
  choice: getan, was böse ist vor dir
  rationale: Die Formulierung bewahrt den biblischen Ausdruck ἐνώπιόν σου und gibt das substantivierte πονηρόν verständlich wieder.
- source_word: στήσας βδελύγματα
  choice: abscheuliche Dinge aufgestellt
  rationale: στήσας bezeichnet ein Aufstellen oder Errichten; βδελύγματα sind verabscheuungswürdige Dinge, häufig mit götzendienerischem Bezug. Die Übersetzung wahrt diesen wahrscheinlichen kultischen Bezug, ohne ihn enger festzulegen als der Wortlaut.
- source_word: πληθύνας προσοχθίσματα
  choice: die Anstöße vermehrt
  rationale: Das seltene προσοχθίσματα bezeichnet Dinge oder Taten, die Widerwillen und Missfallen hervorrufen. „Anstöße“ hält diese aktive Provokationswirkung offen; „vermehrt“ bildet πληθύνας direkt ab.
theological_decisions:
- issue: Sprache vom göttlichen Zorn
  choice: deinen Zorn herausgefordert
  alternative: deinen Unwillen erregt
  rationale: θυμός benennt ausdrücklich Gottes Zorn. Die gewählte Fassung erhält die Schwere des göttlichen Gerichts, ohne zusätzliche dogmatische Kategorien einzuführen.
- issue: Deutung von εἰς τὸ ἀνανεῦσαί με
  choice: sodass ich mein Haupt nicht erheben kann
  alternative: sodass ich mich nicht wieder aufrichten kann
  rationale: Der unmittelbare Zusammenhang beschreibt den Sprecher als unter eisernen Fesseln niedergebeugt. Das körperliche Bild wird im Haupttext bewahrt, während die mögliche Bedeutung des Sich-Erholens in der Fußnote genannt wird.
- issue: Kultischer Bezug von βδελύγματα
  choice: abscheuliche Dinge
  alternative: Götzenbilder
  rationale: Ein götzendienerischer Bezug ist wahrscheinlich, doch βδελύγματα ist lexikalisch weiter. Die Übersetzung vermeidet daher eine eindeutige Festlegung auf Götzenbilder und erläutert den wahrscheinlichen Bezug in der Fußnote.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gebetsnahem Ton. Die Satzstruktur bleibt dem griechischen Bekenntnisgang eng verbunden, wird aber durch Doppelpunkt und natürliche deutsche Wortstellung lesbar gestaltet. Seltene oder mehrdeutige Begriffe werden nicht konfessionell verengt.
