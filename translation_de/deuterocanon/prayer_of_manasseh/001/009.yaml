base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/009.yaml
  text: For I have sinned beyond the number of the sand of the sea. My lawless deeds have multiplied[a], Lord; my lawless deeds have multiplied, and I am not worthy to look up and see the height of heaven because of the multitude of my unrighteous acts.
translation:
  language: de
  text: Denn ich habe mehr gesündigt, als es Sand am Meer gibt. Meine gesetzlosen Taten haben sich gemehrt, Herr, meine gesetzlosen Taten haben sich gemehrt. Wegen meiner vielen ungerechten Taten bin ich es nicht wert, aufzublicken[a] und die Höhe des Himmels zu sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unverwandt hinzusehen“. Das griechische Verb kann einen festen, eindringlichen Blick bezeichnen und nicht nur die Richtung nach oben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥμαρτον
  choice: ich habe … gesündigt
  rationale: Das deutsche Perfekt gibt den Aorist im gegenwärtigen Bekenntniszusammenhang natürlich wieder und lässt die fortwirkende Bedeutung der Schuld erkennen.
- source_word: ὑπὲρ ἀριθμὸν ψάμμου θαλάσσης
  choice: mehr …, als es Sand am Meer gibt
  rationale: Die natürliche deutsche Vergleichsform bewahrt den Sinn einer Menge, die selbst die unzählbaren Sandkörner am Meer übersteigt.
- source_word: ἐπλήθυναν
  choice: haben sich gemehrt
  rationale: Die Wendung gibt das Zahlreichwerden wieder, wahrt den feierlichen Ton und trägt die bewusste Wiederholung des griechischen Textes.
- source_word: ἀνομίαι
  choice: gesetzlose Taten
  rationale: Die Formulierung macht den Bezug auf die Übertretung göttlicher Ordnung verständlich, ohne den Ausdruck mit dem allgemeineren Wort „Sünden“ einzuebnen.
- source_word: κύριε
  choice: Herr
  rationale: Die direkte Anrede wird in modernem, würdigem Deutsch ohne das altertümlich wirkende „o“ wiedergegeben.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: ich bin es nicht wert
  rationale: Dies ist eine natürliche und zugleich gewichtige Wiedergabe der persönlichen Unwürdigkeit.
- source_word: ἀτενίσαι
  choice: aufzublicken
  rationale: Im Zusammenhang mit der Höhe des Himmels bezeichnet die Formulierung das schuldbehaftete Unvermögen, den Blick zum Himmel zu erheben; die mögliche Betonung eines festen, unverwandten Blicks wird in der Fußnote bewahrt.
- source_word: ἰδεῖν
  choice: zu sehen
  rationale: Das schlichte deutsche Verb entspricht dem gewöhnlichen Sinn des griechischen Verbs und vermeidet archaisches Sprachgut.
- source_word: τὸ ὕψος τοῦ οὐρανοῦ
  choice: die Höhe des Himmels
  rationale: Die wörtlich-nahe Wiedergabe erhält den Singular und das Bild der erhabenen Himmelshöhe.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἀδικιῶν μου
  choice: wegen meiner vielen ungerechten Taten
  rationale: „Wegen“ gibt ἀπό hier kausal wieder; „viele“ überträgt πλήθος idiomatisch, und „ungerechte Taten“ hält ἀδικίαι von ἀνομίαι unterscheidbar.
theological_decisions:
- issue: Unterscheidung von ἀνομίαι und ἀδικιῶν innerhalb desselben Sündenbekenntnisses
  choice: ἀνομίαι als „gesetzlose Taten“ und ἀδικιῶν als „ungerechte Taten“ wiedergeben
  alternative: Beide Ausdrücke einheitlich mit „Sünden“ oder „Missetaten“ übersetzen
  rationale: Der griechische Text verwendet zwei verwandte, aber verschiedene moralische Begriffe. Die differenzierte Wiedergabe bewahrt die rhetorische und begriffliche Fülle, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Wiedergabe der Gottesbezeichnung κύριε in direkter Anrede
  choice: Herr
  alternative: o Herr
  rationale: „Herr“ erhält die unmittelbare Gottesadresse in würdigem modernem Deutsch; ein zusätzliches „o“ ist für die vokativische Funktion nicht erforderlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die zweimalige Aussage über die gesetzlosen Taten bleibt als bewusstes rhetorisches Element erhalten; unnötig archaische Wörter werden vermieden.
