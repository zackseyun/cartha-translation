  text: And his heart was lifted up[a], and he intended to seize control of the country, and he was plotting deceitfully against Simon and against his sons[b], to remove them.
translation:
  language: de
  text: Da wurde er hochmütig[a] und fasste den Plan, die Herrschaft über das Land an sich zu reißen. Heimtückisch schmiedete er Pläne gegen Simon und seine Söhne, um sie zu beseitigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sein Herz wurde erhöht.« Gemeint ist, dass er hochmütig wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um sie wegzuschaffen«. Das griechische Wort bedeutet wörtlich »wegnehmen« oder »entfernen« und deutet in diesem Zusammenhang wahrscheinlich auf eine gewaltsame Beseitigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑψώθη ἡ καρδία αὐτοῦ
  choice: Da wurde er hochmütig
  rationale: Die griechische Wendung bedeutet wörtlich, dass sein Herz erhöht wurde, und bezeichnet hier Selbstüberhebung oder Hochmut. Die natürliche deutsche Wiedergabe nennt die Bedeutung; die Fußnote bewahrt das Bild.
- source_word: ἐβουλήθη
  choice: fasste den Plan
  rationale: Das Verb bezeichnet einen gefassten Willen oder eine bewusste Absicht. „Fasste den Plan“ gibt den überlegten Vorsatz idiomatisch wieder, ohne bereits die Ausführung zu behaupten.
- source_word: κατακρατῆσαι τῆς χώρας
  choice: die Herrschaft über das Land an sich zu reißen
  rationale: κατακρατέω mit dem Genitiv bezeichnet das Erlangen beziehungsweise Ausüben von Gewalt über etwas. Die Formulierung macht den politischen Machtanspruch im Deutschen deutlich.
- source_word: ἐβούλευετο
  choice: schmiedete er Pläne
  rationale: Im Zusammenhang mit δόλῳ und dem Vorgehen gegen Simon und seine Söhne hat das Verb den Sinn eines fortgesetzten feindlichen Planens.
- source_word: δόλῳ
  choice: Heimtückisch
  rationale: Der Dativ bezeichnet Mittel oder Art und Weise. „Heimtückisch“ verbindet Täuschung mit dem verräterischen Charakter des geplanten Vorgehens.
- source_word: ἆραι αὐτούς
  choice: um sie zu beseitigen
  rationale: αἴρω bedeutet grundsätzlich „wegnehmen“ oder „entfernen“. Im feindlichen Kontext legt die Wendung eine gewaltsame Ausschaltung nahe; „beseitigen“ erhält dennoch eine gewisse Unbestimmtheit.
- source_word: χώρα
  choice: Land
  rationale: χώρα bezeichnet hier ein politisch beherrschtes Gebiet. „Land“ ist im Deutschen natürlich und lässt den genauen territorialen Status offen.
