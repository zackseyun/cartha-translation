lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Das gewöhnliche deutsche Erzählverb gibt den wiederholten griechischen Sendungsbegriff würdig und natürlich wieder.
- source_word: ἑτέρους
  choice: andere
  rationale: Bewahrt die Ellipse des Griechischen, ohne unnötig »Männer« hinzuzufügen.
- source_word: Γάζαρα
  choice: Gazara
  rationale: Gibt die griechische Namensform des Quellenzeugnisses wieder; die bekanntere Form Gezer wird in der Fußnote genannt.
- source_word: ἄραι
  choice: wegzuschaffen
  rationale: αἴρω kann hier wegnehmen, beseitigen oder fortschaffen bedeuten. »Wegzuschaffen« lässt die genaue Art der feindlichen Maßnahme offen.
- source_word: τοῖς χιλιάρχοις
  choice: den Anführern über Tausend
  rationale: Gibt den militärischen Rang wörtlich verständlich wieder, ohne den weniger geläufigen Fachausdruck »Chiliarchen« zu verwenden.
- source_word: ἐπιστολάς
  choice: Briefe
  rationale: Entspricht der normalen Bedeutung; der folgende Infinitiv macht den auffordernden Inhalt deutlich.
- source_word: παραγενέσθαι πρὸς αὐτόν
  choice: mit der Aufforderung, zu ihm zu kommen
  rationale: Macht im Deutschen klar, dass die Briefe die Adressaten zum Kommen veranlassen sollten, ohne daraus förmliche Befehle zu machen.
- source_word: ὅπως δῷ αὐτοῖς
  choice: damit er ihnen ... gebe
  rationale: Bewahrt den finalen Sinn von ὅπως mit dem Konjunktiv.
- source_word: ἀργύριον καὶ χρυσίον
  choice: Silber, Gold
  rationale: Die konkrete, traditionelle Paarung bleibt erhalten.
- source_word: δόματα
  choice: Geschenke
  rationale: Ist die breite und natürliche deutsche Entsprechung für gewährte Gaben.
