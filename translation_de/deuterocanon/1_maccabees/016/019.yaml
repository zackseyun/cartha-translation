  text: And he sent others to Gazara to take John[a], and to the commanders of thousands he sent letters to come to him[b], so that he might give them silver and gold and gifts.
translation:
  language: de
  text: Und er sandte andere nach Gazara, um Johannes wegzunehmen[a]. Den Obersten über Tausend sandte er Briefe, sie sollten zu ihm kommen, damit er ihnen Silber, Gold und Geschenke gebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um Johannes fortzunehmen«. Das griechische Verb bezeichnet ein Wegnehmen oder Fortbringen. Der Zusammenhang lässt eine feindliche Absicht erkennen, bestimmt jedoch nicht näher, was mit Johannes geschehen sollte.'
