  text: And Ptolemy wrote these things and sent word to the king that he should send him forces as help, and hand over their country and the cities.
translation:
  language: de
  text: Und Ptolemäus schrieb dies und sandte es an den König, damit dieser ihm Truppen zur Unterstützung schicke und ihm ihr Land und die Städte übergebe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν ταῦτα
  choice: schrieb dies
  rationale: Gibt die griechische Formulierung knapp und natürlich wieder, ohne über den Inhalt des Schreibens hinauszugehen.
- source_word: δυνάμεις
  choice: Truppen
  rationale: Im militärischen Kontext bezeichnet das Wort bewaffnete Kräfte; „Truppen“ ist im modernen Deutschen klar und idiomatisch.
- source_word: εἰς βοήθειαν
  choice: zur Unterstützung
  rationale: Drückt Zweck und Funktion der erbetenen Truppen natürlich aus.
- source_word: τὴν χώραν αὐτῶν καὶ τὰς πόλεις
  choice: ihr Land und die Städte
  rationale: Bewahrt die unterschiedliche Bestimmtheit des griechischen Ausdrucks sowie den nicht ausdrücklich bezeichneten Bezug von „ihr“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Dieser“ verdeutlicht, dass der König Subjekt der beiden Verben im Zwecksatz ist. Das zweite „ihm“ ist im Deutschen zur eindeutigen und natürlichen Wiedergabe des impliziten Empfängers bei „übergeben“ ergänzt.
