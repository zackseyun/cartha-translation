  text: καὶ ἐκάλεσεν Α Σίμων τοὺς δύο υἱοὺς αὐτοῦ τοὺς πρεσβυτέρους Ἰούδαν καὶ Ἰωάννην, καὶ εἶπεν αὐτοῖς Ἐγὼ καὶ οἱ ἀδελφοί μου καὶ ὁ οἶκος τοῦ πατρός μου ἐπολεμήσαμεν τοὺς πολέμους Ἰσραὴλ ἀπὸ νεότητος ἕως τῆς σήμερον ἡμέρας, καὶ εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν ῥύσασθαι τὸν Ἰσραὴλ πλεονάκις.
