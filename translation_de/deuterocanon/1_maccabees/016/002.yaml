base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/002.yaml
  text: And Simon called his two older sons, Judas and John, and said to them, “I and my brothers and my father’s house have fought the wars of Israel from youth until this day, and it has prospered in our hands to deliver Israel many times.”
translation:
  language: de
  text: 'Und Simon rief seine beiden älteren Söhne, Judas und Johannes, zu sich und sagte zu ihnen: »Ich, meine Brüder und das Haus meines Vaters haben von unserer Jugend an bis zum heutigen Tag die Kriege Israels geführt, und es ist uns gelungen, Israel viele Male zu befreien.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »und es war in unseren Händen erfolgreich, Israel viele Male zu befreien«.'
    reason: Die Fußnote bewahrt die ungewöhnliche griechische Erfolgsformel εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν, ohne durch ein Plusquamperfekt eine im Grundtext nicht enthaltene Vorzeitigkeit einzuführen.
lexical_decisions:
- source_word: τοὺς δύο υἱοὺς αὐτοῦ τοὺς πρεσβυτέρους
  choice: seine beiden älteren Söhne
  rationale: Der Komparativ πρεσβυτέρους bedeutet „älteren“. Die Formulierung lässt offen, ob Simon neben diesen beiden noch weitere Söhne hatte.
- source_word: ἐπολεμήσαμεν τοὺς πολέμους Ἰσραήλ
  choice: haben … die Kriege Israels geführt
  rationale: 'Die Wendung bewahrt den nicht näher bestimmten Genitiv: Es können Israels eigene oder für Israel geführte Kriege gemeint sein. Das Perfekt gibt die bis zur Gegenwart reichende Rückschau natürlich wieder.'
- source_word: ἀπὸ νεότητος ἕως τῆς σήμερον ἡμέρας
  choice: von unserer Jugend an bis zum heutigen Tag
  rationale: Das ergänzte Possessivpronomen macht den Bezug auf Simon, seine Brüder und sein Vaterhaus im Deutschen verständlich, ohne den zeitlichen Sinn zu verändern.
- source_word: εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν
  choice: es ist uns gelungen
  rationale: Die griechische Erfolgsformel lautet wörtlich ungefähr „es hatte in unseren Händen Erfolg“. Die idiomatische deutsche Wiedergabe vermittelt denselben Sinn; die Bildsprache wird in der Fußnote dokumentiert.
- source_word: ῥύσασθαι
  choice: zu befreien
  rationale: Im militärischen Zusammenhang bezeichnet das Verb die Rettung beziehungsweise Befreiung aus Bedrängnis. „Befreien“ ist hier klar und vermeidet eine unnötig soteriologische Zuspitzung.
- source_word: πλεονάκις
  choice: viele Male
  rationale: Die Formulierung bewahrt die Betonung wiederholter Befreiungsvorgänge.
theological_decisions:
- issue: Handlungsträgerschaft bei Israels Befreiung
  choice: Die Familie wird als menschlicher Handlungsträger genannt; ein göttlicher Handlungsträger wird nicht ergänzt.
  alternative: Die Erfolgsformel könnte als indirekter Hinweis auf göttliches Gelingen verstanden oder entsprechend explizit wiedergegeben werden.
  rationale: Der griechische Text nennt Gott an dieser Stelle nicht. Die Übersetzung bewahrt daher die menschliche Handlungsträgerschaft und lässt eine mögliche Vorstellung providenziellen Gelingens unausgesprochen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Johannes“ folgt der üblichen deutschen Namensform für Ἰωάννης; „Judas“ unterscheidet sich klar vom Volksnamen Israel. Die direkte Rede ist flüssig, während „die Kriege Israels“ die Mehrdeutigkeit des griechischen Genitivs erhält.
