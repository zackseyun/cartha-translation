  text: And the rest of the accounts concerning John, and his wars, and his mighty deeds that he did, and the building of the walls that he built, and his acts—
translation:
  language: de
  text: Und was sonst noch über Johannes zu berichten ist, über seine Kriege und die Heldentaten, die er vollbrachte, über den Bau der Mauern, die er errichtete, und über seine Taten –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ λοιπὰ τῶν λόγων Ἰωάννου
  choice: was sonst noch über Johannes zu berichten ist
  rationale: Die griechische historiografische Schlussformel bezeichnet die übrigen Berichte beziehungsweise Angelegenheiten aus Johannes’ Leben. Die gewählte Formulierung ist im modernen Deutschen natürlich und bewahrt den Verweis auf nicht weiter ausgeführtes Material.
- source_word: πολέμων
  choice: Kriege
  rationale: Der Plural bezeichnet Johannes’ militärische Auseinandersetzungen in umfassendem Sinn; „Kriege“ gibt diesen Umfang genauer wieder als „Schlachten“.
- source_word: ἀνδραγαθιῶν ... ἠνδραγάθησεν
  choice: Heldentaten, die er vollbrachte
  rationale: Substantiv und verwandtes Verb betonen tapferes, ruhmreiches Handeln. „Heldentaten“ erhält die anerkennende Bedeutung, während „vollbrachte“ eine im Deutschen schwerfällige etymologische Wiederholung vermeidet.
- source_word: οἰκοδομῆς τῶν τειχέων ὧν ᾠκοδόμησεν
  choice: Bau der Mauern, die er errichtete
  rationale: Die Wiedergabe erhält sowohl das Substantiv als auch das verwandte Verb der griechischen Formulierung in natürlichem Deutsch; „Mauern“ bezeichnet hier aus dem Zusammenhang ersichtlich Befestigungsmauern.
- source_word: πράξεων
  choice: Taten
  rationale: Der allgemeine Schlussbegriff umfasst Johannes’ sonstige Handlungen und Unternehmungen. „Taten“ ist würdig, verständlich und lässt die Breite des Ausdrucks bestehen.
