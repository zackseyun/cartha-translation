  text: And he committed a great act of treachery[a], and repaid evil for good.
translation:
  language: de
  text: Und er beging einen großen Treuebruch[a] und vergalt Gutes mit Bösem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große Treulosigkeit“; auch „einen schweren Verrat“. Das griechische Wort bezeichnet die Verletzung von Treue, Vertrauen oder einer Verpflichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: beging
  rationale: In Verbindung mit ἀθεσίαν bezeichnet das Verb idiomatisch das Begehen einer verwerflichen Tat; „beging“ ist im Deutschen natürlich und wahrt die moralische Schwere.
- source_word: ἀθεσίαν
  choice: Treuebruch
  rationale: Das Substantiv bezeichnet die Verletzung von Treue, Vertrauen oder Verpflichtung. „Treuebruch“ gibt den konkreten Verrat im Erzählzusammenhang wieder, ohne den Begriff auf abstrakte Gesetzlosigkeit zu verengen.
- source_word: μεγάλην
  choice: großen
  rationale: Das Adjektiv hebt das Ausmaß und die Schwere des Treuebruchs hervor und wird quellennah wiedergegeben.
- source_word: ἀνταπέδωκεν
  choice: vergalt
  rationale: Das Verb bezeichnet eine entsprechende Erwiderung oder Vergeltung. „Vergalt“ verbindet sich im Deutschen idiomatisch mit der Konstruktion „Gutes mit Bösem“.
- source_word: κακὰ ἀντὶ ἀγαθῶν
  choice: Gutes mit Bösem
  rationale: Die deutsche Wendung gibt die reziproke Gegenüberstellung prägnant und natürlich wieder. Die gegenüber der griechischen Wortfolge umgestellte Reihenfolge ist durch die deutsche Konstruktion „etwas mit etwas vergelten“ bedingt.
theological_decisions:
- issue: Moralische Charakterisierung von ἀθεσία
  choice: Als relationaler „Treuebruch“ wiedergegeben.
  alternative: „große Treulosigkeit“, „schwerer Verrat“ oder „große Gesetzlosigkeit“
  rationale: Im Zusammenhang geht es um eine konkrete Verletzung von Vertrauen und Verpflichtung. „Treuebruch“ bewahrt diese ethische und relationale Bedeutung, ohne eine spätere technische theologische Kategorie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste Wendung „Gutes mit Bösem vergelten“ ist verständlich und bewahrt den scharfen moralischen Gegensatz des griechischen Textes.
