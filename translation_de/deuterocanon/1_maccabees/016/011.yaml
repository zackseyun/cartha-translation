base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/011.yaml
  text: And Ptolemy son of Abubus had been appointed governor over the plain of Jericho[a], and he had much silver and gold;
translation:
  language: de
  text: Und Ptolemäus, der Sohn des Abubus, war als Statthalter[a] über die Ebene von Jericho eingesetzt worden und besaß viel Silber und Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort στρατηγός kann einen militärischen Befehlshaber oder einen Amtsträger mit regionaler Zuständigkeit bezeichnen. Mit »Statthalter« wird hier die Zuständigkeit für die Ebene wiedergegeben; die genaue Ausgestaltung des Amtes bleibt offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Erzählung fort, ohne eine im Griechischen nicht ausdrücklich bezeichnete zeitliche Nuance hinzuzufügen.
- source_word: Πτολεμαῖος ὁ τοῦ Ἀβούβου
  choice: Ptolemäus, der Sohn des Abubus
  rationale: Die Genitivverbindung bezeichnet die Abstammung; die ausdrückliche Wiedergabe als Sohn ist im Deutschen klar und natürlich.
- source_word: ἦν καθεστημένος
  choice: war … eingesetzt worden
  rationale: Die periphrastische Konstruktion bezeichnet einen bestehenden Zustand als Ergebnis einer vorherigen Einsetzung.
- source_word: στρατηγὸς
  choice: Statthalter
  rationale: Im Zusammenhang mit der Zuständigkeit für ein Gebiet bezeichnet das Wort ein militärisch-administratives Amt; »Statthalter« passt hier besser als das rein militärisch klingende »General«.
- source_word: εἰς τὸ πεδίον Ἰεριχώ
  choice: über die Ebene von Jericho
  rationale: In Verbindung mit dem Amt bezeichnet εἰς den Zuständigkeitsbereich; πεδίον bleibt konkret als »Ebene« erhalten.
- source_word: εἶχεν ἀργύριον καὶ χρυσίον πολύ
  choice: besaß viel Silber und Gold
  rationale: »Besaß« gibt in diesem Vermögenszusammenhang εἶχεν idiomatisch wieder; »viel Silber und Gold« bewahrt die direkte Aussage des Griechischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählsyntax. Die militärisch-administrative Bedeutungsbreite von στρατηγός wird im Haupttext kontextgerecht wiedergegeben und in der Fußnote offengehalten.
