  text: And he himself and his people encamped opposite them; and when he saw the people afraid to cross the wadi[a], he crossed first, and the men saw him and crossed after him.
translation:
  language: de
  text: Er selbst und sein Volk schlugen ihnen gegenüber ihr Lager auf. Als er sah, dass das Volk sich fürchtete, das Wadi[a] zu überqueren, ging er als Erster hinüber. Die Männer sahen ihn und gingen hinter ihm hinüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den reißenden Bach« beziehungsweise »das Bachbett«; das griechische Wort bezeichnet einen saisonalen Wasserlauf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: schlugen ... ihr Lager auf
  rationale: Das Verb bezeichnet im militärischen Zusammenhang das Lagern; die deutsche Wendung ist natürlich und bewahrt den militärischen Kontext.
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: ihnen gegenüber
  rationale: Die Wendung bezeichnet die Stellung vor beziehungsweise gegenüber der anderen Partei.
- source_word: δειλούμενον
  choice: sich fürchtete
  rationale: Das Partizip beschreibt hier konkrete Furcht oder Ängstlichkeit, ohne zwingend ein moralisches Urteil wie »feige« auszudrücken.
- source_word: διαπερᾶσαι
  choice: zu überqueren
  rationale: Im Zusammenhang mit dem Wasserlauf bezeichnet das Verb das Hinübergelangen auf die andere Seite.
- source_word: τὸν χειμάρρουν
  choice: das Wadi
  rationale: Der Ausdruck bezeichnet einen saisonalen Wasserlauf beziehungsweise dessen Bett; »Wadi« gibt die geografische Gegebenheit knapp und präzise wieder.
- source_word: διεπέρασεν πρῶτος
  choice: ging er als Erster hinüber
  rationale: Die Formulierung betont seine vorangehende, beispielgebende Handlung und klingt im Deutschen idiomatisch.
- source_word: οἱ ἄνδρες
  choice: Die Männer
  rationale: Der griechische Text enthält weder ein ausdrückliches Possessivpronomen noch die genauere Bezeichnung »Soldaten«.
- source_word: κατόπισθεν αὐτοῦ
  choice: folgten ihm hinüber
  rationale: Die kontextgerechte Wendung drückt aus, dass die Männer hinter ihm denselben Übergang vollzogen.
