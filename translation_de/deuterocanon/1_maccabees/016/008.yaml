  text: And they sounded the trumpets[a], and Cendebeus and his camp were thrown into confusion, and many of them fell wounded[b]; but those who were left fled into the stronghold.
translation:
  language: de
  text: Sie bliesen die Trompeten. Da gerieten Kendebäus und sein Heer[a] in Verwirrung[b], und viele von ihnen fielen verwundet zu Boden[c]. Die Übriggebliebenen aber flohen in die Festung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Lager“. Das griechische Wort kann sowohl ein Heerlager als auch die dort befindliche Streitmacht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurden in die Flucht geschlagen“ oder „wurden zurückgedrängt“. Das griechische Militärverb kann eine Niederlage mit anschließender Flucht bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich nahe am Griechischen: „fielen als Verwundete“. Die Formulierung besagt nicht zwingend, dass alle Getroffenen starben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: bliesen sie die Trompeten
  rationale: Die Verbindung bezeichnet das Blasen beziehungsweise Erschallenlassen von Trompeten als militärisches Signal. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt das konkrete Bild.
- source_word: ἐτροπώθη
  choice: wurden in die Flucht geschlagen
  rationale: Das Passiv von τρέπω bezeichnet im militärischen Zusammenhang häufig das Zurückwerfen oder Aufreiben eines Gegners. Die Formulierung gibt diesen kräftigen Sinn wieder; die mögliche schwächere Bedeutung wird in einer Fußnote offengehalten.
- source_word: παρεμβολὴ
  choice: Heer
  rationale: παρεμβολή kann sowohl das Lager als auch die dort versammelte Streitmacht bezeichnen. Da von Verwundeten und Flüchtenden die Rede ist, steht hier die Truppe im Vordergrund; die konkrete Alternative „Lager“ wird in der Fußnote genannt.
- source_word: ἔπεσον ... τραυματίαι πολλοί
  choice: viele von ihnen gingen verwundet zu Boden
  rationale: Die Wiedergabe bewahrt sowohl das Fallen im Kampf als auch die ausdrückliche Bezeichnung als Verwundete, ohne stillschweigend zu behaupten, alle seien getötet worden.
- source_word: οἱ ... καταλειφθέντες
  choice: die Übriggebliebenen
  rationale: Die substantivierte Partizipialform bezeichnet diejenigen, die noch übrig waren. „Die Übriggebliebenen“ bleibt näher am Griechischen als das stärker deutende „die Überlebenden“.
- source_word: ὀχύρωμα
  choice: Festung
  rationale: Das Substantiv bezeichnet einen befestigten, geschützten Ort. „Festung“ ist eine natürliche und im militärischen Zusammenhang passende deutsche Entsprechung.
