  text: And when he heard, he was greatly alarmed, and he seized the men who had come to destroy him and killed them, for he knew that they were seeking to destroy him.
translation:
  language: de
  text: Als er davon hörte, geriet er in große Bestürzung. Er ergriff die Männer, die gekommen waren, um ihn umzubringen, und tötete sie; denn er wusste, dass sie ihn umzubringen suchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Als er davon hörte
  rationale: Das aoristische Partizip bezeichnet hier natürlich den zeitlichen Anlass. „Davon“ stellt im Deutschen idiomatisch den Bezug zur zuvor gemeldeten Gefahr her, ohne neue Sachinformation einzuführen.
- source_word: ἐξέστη σφόδρα
  choice: geriet er in große Bestürzung
  rationale: ἐξίστημι bezeichnet hier angesichts des Mordplans ein starkes Erschrecken beziehungsweise eine emotionale Erschütterung; σφόδρα verstärkt dies. Die Formulierung wahrt zugleich die mögliche Nuance des Außer-sich-Geratenseins.
- source_word: συνέλαβεν
  choice: er ergriff
  rationale: Das Verb bedeutet ergreifen oder festnehmen. „Ergriff“ bleibt breit genug und setzt kein förmliches Rechtsverfahren voraus.
- source_word: τοὺς ἄνδρας
  choice: die Männer
  rationale: Die ausdrücklich maskuline Bezeichnung wird sachgerecht beibehalten.
- source_word: τοὺς ἐλθόντας ἀπολέσαι αὐτόν
  choice: die gekommen waren, um ihn umzubringen
  rationale: Im Zusammenhang eines Anschlags bedeutet ἀπόλλυμι konkret töten. „Umbringen“ ist klares, modernes Deutsch und wird auch bei der Wiederholung desselben griechischen Verbs beibehalten.
- source_word: ἀπέκτεινεν
  choice: tötete sie
  rationale: ἀποκτείνω bezeichnet eindeutig das Töten; „tötete“ ist präzise, würdig und gegenwärtig.
- source_word: ἔγνω
  choice: er wusste
  rationale: Die Aussage begründet sein Handeln mit seiner sicheren Kenntnis ihrer Absicht. „Wusste“ gibt dies direkt wieder; „erkannte“ wäre ebenfalls möglich, würde aber den punktuellen Erkenntnisvorgang stärker betonen.
- source_word: ἐζήτουν αὐτὸν ἀπολέσαι
  choice: sie ihn umzubringen suchten
  rationale: ζητέω mit Infinitiv drückt hier eine verfolgte Absicht aus. „Suchten“ bewahrt die Verlaufsnuance des Imperfekts und die Wiederholung von ἀπολέσαι wird mit „umzubringen“ sichtbar gehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der semantische Unterschied zwischen ἀπόλλυμι („umbringen“) und ἀποκτείνω („töten“) bleibt erkennbar, während die zweimalige Verwendung von ἀπολέσαι einheitlich wiedergegeben wird. Keine Fußnote erforderlich.
