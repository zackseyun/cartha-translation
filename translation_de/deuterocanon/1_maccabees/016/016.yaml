review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Kerngehalt des griechischen Textes zuverlässig wieder: Simon und seine Söhne werden betrunken, Ptolemäus und die bei ihm sind stehen auf, nehmen Waffen, dringen in das Gastmahl ein und töten Simon, seine Söhne sowie einige junge Diener. „Betrunken geworden waren“ bildet den ingressiven aoristischen Ausdruck angemessen ab. „Junge Diener“ ist für παιδάρια im gegebenen Kontext eine vertretbare, nicht überbestimmende Wiedergabe.'
  naturalness: 'Der Satz ist insgesamt modernes, verständliches Standarddeutsch. Nur „drangen zu Simon in das Festmahl ein“ ist idiomatisch etwas unglücklich: „zu Simon“ klingt hier wie eine bloße Zielbewegung und verbindet sich weniger natürlich mit „in das Festmahl ein“. „Bei Simon in das Festmahl“ gibt den Personenbezug und die feindselige Eintrittsbewegung flüssiger wieder.'
  terminology: „Festmahl“ ist eine sachgerechte Hauptwiedergabe von συμπόσιον. Die Fußnote mit „Trinkgelage“ bewahrt die spezifischere sympotische Nuance. „Töteten“ vermeidet die nicht ausdrücklich lexikalisch markierte Wertung von „ermordeten“. Namen und sonstige Begriffe sind korrekt.
  issues:
