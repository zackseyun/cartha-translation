  text: And when Simon and his sons became drunk[a], Ptolemy and those with him rose up and took their weapons, and entered the banquet against Simon, and killed him and his sons, and some of his young servants.
translation:
  language: de
  text: Als Simon und seine Söhne betrunken geworden waren, erhoben sich Ptolemäus und seine Begleiter, nahmen ihre Waffen und drangen bei Simon in das Festmahl[a] ein. Sie töteten ihn, seine Söhne und einige seiner jungen Diener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Trinkgelage“; das griechische Wort kann besonders ein gemeinsames Fest mit reichlichem Trinken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμεθύσθη
  choice: betrunken geworden waren
  rationale: Der Aorist von μεθύσκω bezeichnet hier das Eintreten in den Zustand der Trunkenheit. Das deutsche Plusquamperfekt gibt sowohl diesen ingressiven Sinn als auch das zeitliche Verhältnis zum folgenden Angriff natürlich wieder.
- source_word: ἐξανέστη
  choice: erhoben sich
  rationale: Die Formulierung bewahrt den entschlossenen Beginn des Angriffs und den leicht gehobenen Erzählton.
- source_word: οἱ μετʼ αὐτοῦ
  choice: seine Begleiter
  rationale: Die Wendung bezeichnet unspezifisch die Personen bei Ptolemäus. „Begleiter“ ist im Deutschen natürlich, ohne sie ausdrücklich als Soldaten oder Diener festzulegen.
- source_word: ἔλαβον τὰ ὅπλα αὐτῶν
  choice: nahmen ihre Waffen
  rationale: Die Wiedergabe bleibt beim Grundsinn und legt nicht unnötig fest, ob sie die Waffen lediglich ergriffen oder sich förmlich bewaffneten.
- source_word: ἐπεισῆλθοσαν τῷ Σίμωνι εἰς τὸ συμπόσιον
  choice: drangen zu Simon in das Festmahl ein
  rationale: „Drangen … ein“ gibt die feindselige Bewegung des zusammengesetzten Verbs wieder; „zu Simon“ wahrt den Personenbezug des Dativs, ohne einen zusätzlichen Angriffsausdruck einzuführen.
- source_word: συμπόσιον
  choice: Festmahl
  rationale: „Festmahl“ ist verständlich und dem erzählten gesellschaftlichen Rahmen angemessen. Die speziellere Bedeutung „Trinkgelage“ bleibt in der Fußnote erhalten.
- source_word: ἀπέκτειναν
  choice: töteten
  rationale: Dies entspricht dem neutralen lexikalischen Grundsinn, ohne die im Kontext erkennbare Heimtücke zusätzlich durch „ermordeten“ auszudeuten.
- source_word: παιδαρίων
  choice: jungen Diener
  rationale: παιδάριον kann einen Jungen oder einen jungen Diener beziehungsweise Gehilfen bezeichnen. Im höfischen Zusammenhang wahrt „junge Diener“ sowohl den Alters- als auch den Dienstaspekt.
