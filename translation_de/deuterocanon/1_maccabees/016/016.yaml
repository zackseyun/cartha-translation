    issue: Unnatürliche Anbindung von „zu Simon“ an „in das Festmahl ein“
    rationale: Das griechische Dativobjekt bei ἐπεισῆλθοσαν bezeichnet Simon als die Person, gegen die beziehungsweise bei der sie in das Gastmahl eindrangen. Deutsch ist „bei Simon in das Festmahl eindringen“ in diesem Kontext idiomatischer als „zu Simon … eindringen“ und erhält die Bedeutung ohne zusätzliche Deutung.
  revised_text: Als Simon und seine Söhne betrunken geworden waren, erhoben sich Ptolemäus und seine Begleiter, nahmen ihre Waffen und drangen bei Simon in das Festmahl[a] ein. Sie töteten ihn, seine Söhne und einige seiner jungen Diener.
