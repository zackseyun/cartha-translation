  yaml_path: translation/deuterocanon/1_maccabees/016/014.yaml
  text: Simon was making a circuit of the cities in the country and taking care of their administration[a], and he went down to Jericho, he and Mattathias and Judas his sons, in the one hundred seventy-seventh year, in the eleventh month—that is, the month Shebat.
translation:
  language: de
  text: Simon bereiste die Städte im Land und kümmerte sich um ihre Verwaltung. Er zog mit seinen Söhnen Mattathias und Judas nach Jericho hinab, im hundertsiebenundsiebzigsten Jahr, im elften Monat – das ist der Monat Schebat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Sabat«; »Schebat« ist die gebräuchliche deutsche Form des Monatsnamens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοδεύων
  choice: bereiste
  rationale: Das Partizip bezeichnet Simons fortlaufende Reise durch die Städte. »Bereiste« gibt diese Bewegung natürlich wieder, ohne eine förmliche Inspektionsrunde ausdrücklich vorauszusetzen.
- source_word: τὰς πόλεις τὰς ἐν τῇ χώρᾳ
  choice: die Städte im Land
  rationale: χώρα bezeichnet hier das umliegende Land beziehungsweise Herrschaftsgebiet; »im Land« ist knapp und idiomatisch.
- source_word: φροντίζω τὰς ἐπιμελίας αὐτῶν
  choice: kümmerte sich um ihre Verwaltung
  rationale: Die textlich beziehungsweise grammatisch schwierige Wendung verbindet fürsorgliche Aufmerksamkeit mit der Sorge für die Angelegenheiten der Städte. »Verwaltung« wahrt den administrativen Sinn von ἐπιμέλεια.
- source_word: κατέβη εἰς Ἰεριχώ
  choice: zog … nach Jericho hinab
  rationale: »Hinabziehen« bewahrt die Richtungsangabe von καταβαίνω und klingt in einem Reisebericht würdig und natürlich.
- source_word: αὐτὸς καὶ Ματταθίας καὶ Ἰούδας καὶ οἱ υἱοὶ αὐτοῦ
  choice: er mit seinen Söhnen Mattathias und Judas
  rationale: Die griechische Reihung nennt Simon und anschließend Mattathias und Judas als seine Söhne. Die deutsche Fassung macht diese Zuordnung eindeutig, ohne zusätzliche Information einzuführen.
- source_word: ἔτους ἑβδόμου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: im hundertsiebenundsiebzigsten Jahr
  rationale: Die additive griechische Zahlform bezeichnet das 177. Jahr; die ausgeschriebene deutsche Ordinalzahl ist klar und dem erzählerischen Register angemessen.
- source_word: μηνὶ ἐνδεκάτῳ
  choice: im elften Monat
  rationale: Direkte und natürliche Wiedergabe der Monatsangabe.
- source_word: Σαβάτ
  choice: Schebat
  rationale: »Schebat« ist eine im Deutschen etablierte Wiedergabe des semitischen Monatsnamens, den die griechische Vorlage als Σαβάτ transkribiert.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem historischem Erzählton. Das einleitende δέ wird nicht eigens mit »aber« wiedergegeben, da hier kein deutlicher Gegensatz vorliegt; der Fortgang wird durch die Satzfolge und »Dann« natürlich markiert. Der Fußnotenmarker steht beim Monatsnamen, auf den sich die Anmerkung bezieht.
