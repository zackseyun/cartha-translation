  text: And he selected from the country twenty thousand fighting men and horsemen[a], and they marched against Kendebaios, and camped in Modein.
translation:
  language: de
  text: Und er wählte aus dem Land zwanzigtausend Kämpfer und Reiter aus. Sie zogen gegen Kendebaios und schlugen in Modeïn ihr Nachtlager auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „sie schliefen in Modeïn“; im militärischen Zusammenhang ist wohl gemeint, dass sie dort für die Nacht lagerten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν ἐκ τῆς χώρας
  choice: er wählte aus dem Land … aus
  rationale: Die Formulierung gibt die gezielte Auswahl aus einem größeren Gebiet wieder. „Land“ ist im Deutschen natürlich und lässt offen, ob das ganze Herrschaftsgebiet oder das Umland gemeint ist.
- source_word: εἴκοσι χιλιάδας ἀνδρῶν πολεμιστῶν
  choice: zwanzigtausend kampffähige Männer
  rationale: ἀνδρῶν bezeichnet ausdrücklich Männer, πολεμιστῶν kennzeichnet sie als für den Kampf bestimmte Männer. „Kampffähig“ ist hier idiomatisch und vermeidet das altertümliche „Krieger“.
- source_word: ἱππεῖς
  choice: Reiter
  rationale: „Reiter“ bildet die konkrete Bezeichnung für berittene Männer enger ab als das abstrakte Kollektivwort „Kavallerie“.
- source_word: ἐπορεύθησαν ἐπὶ τὸν Κενδεβαῖον
  choice: Sie zogen gegen Kendebaios
  rationale: Im militärischen Zusammenhang bezeichnet πορεύομαι den Zug beziehungsweise Vormarsch; ἐπί mit Akkusativ drückt hier die feindliche Ausrichtung gegen Kendebaios aus.
- source_word: ἐκοιμήθησαν
  choice: schlugen … ihr Nachtlager auf
  rationale: Das Verb bedeutet wörtlich „sie schliefen/legten sich schlafen“. Im Feldzugsbericht ist ein Übernachten im Lager gemeint; „ihr Nachtlager aufschlagen“ bewahrt diesen zeitlichen Aspekt deutlicher als bloßes „lagern“.
- source_word: Μωδαείμ
  choice: Modeïn
  rationale: Die Form gibt den Ortsnamen in einer im Deutschen verständlichen, am griechischen Namen orientierten Umschrift wieder; das Trema verhindert, dass „ei“ als deutscher Diphthong gelesen wird.
