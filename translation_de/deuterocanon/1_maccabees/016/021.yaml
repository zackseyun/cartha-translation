  text: And he ran on ahead and reported to John in Gazara that his father and his brothers had perished[a], and that he had sent men to kill you also.
translation:
  language: de
  text: Er lief voraus und berichtete Johannes in Geser, dass dessen Vater und seine Brüder ums Leben gekommen seien und dass er Leute[a] ausgesandt habe, um auch Johannes zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und dass er ausgesandt hat, um auch dich zu töten“. Im Griechischen bleibt unausgesprochen, wen er ausgesandt hat; „Leute“ ist zur Verdeutlichung ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν
  choice: lief voraus
  rationale: Das Partizip bezeichnet ein hastiges Vorauslaufen; „lief voraus“ bewahrt sowohl die Bewegung als auch die Dringlichkeit.
- source_word: ἀπήγγειλεν
  choice: meldete
  rationale: Das Verb bezeichnet das Überbringen einer Nachricht. „Meldete“ passt natürlich zum Botenbericht.
- source_word: εἰς Γάζαρα
  choice: in Geser
  rationale: 'Die Ortsangabe wird im Deutschen idiomatisch auf den Aufenthaltsort des Johannes bezogen: Er erhielt die Meldung in Geser.'
- source_word: ἀπώλετο
  choice: seien ums Leben gekommen
  rationale: Die Form kann ein gewaltsames Sterben bezeichnen, ohne die Todesart im Verb selbst genauer festzulegen. Der Konjunktiv kennzeichnet die indirekte Rede.
- source_word: Ἀπέσταλκεν
  choice: habe Leute ausgesandt
  rationale: Das Perfekt bezeichnet eine bereits vollzogene, weiterhin relevante Aussendung. Das im Griechischen unausgesprochene Objekt wird für idiomatisches Deutsch als „Leute“ ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: καὶ σὲ ἀποκτεῖναι
  choice: um auch ihn zu töten
  rationale: „Töten“ gibt ἀποκτεῖναι direkt wieder; „auch“ bewahrt die Hervorhebung, dass Johannes ebenso zum Ziel geworden ist. In der deutschen indirekten Rede wird das griechische „dich“ idiomatisch als „ihn“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt leitet den in indirekter Rede wiedergegebenen Inhalt der Meldung ein; dadurch bleibt der berichtende Charakter erhalten, ohne eine direkte Rede in den griechischen Text hineinzutragen.
