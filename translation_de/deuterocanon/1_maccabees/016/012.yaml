- source_word: γαμβρὸς
  choice: Schwiegersohn
  rationale: γαμβρός kann allgemein einen Verwandten durch Heirat bezeichnen; im Kontext ist „Schwiegersohn“ die wahrscheinlichste konkrete Bedeutung.
- source_word: τοῦ ἀρχιερέως
