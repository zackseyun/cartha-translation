  yaml_path: translation/deuterocanon/1_maccabees/016/015.yaml
  text: And the son of Abubus welcomed them into the stronghold called Dok with deceit[a], which he had built, and he gave them a great banquet; and he had men hidden there.
translation:
  language: de
  text: Der Sohn des Abubus empfing sie mit List in der Festung namens Dok, die er erbaut hatte, und veranstaltete für sie ein großes Festmahl[a]; dort verbarg er Männer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein großes Trinkgelage“. Das griechische Wort πότος hebt das Trinken hervor, kann im Zusammenhang aber ein üppiges Gastmahl bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδέξατο
  choice: empfing
  rationale: Das Verb bezeichnet hier die Aufnahme von Gästen. „Empfing“ ist natürlich und lässt den gastlichen Anschein erkennen, ohne die unmittelbar genannte Arglist vorwegzunehmen.
- source_word: ὁ τοῦ Ἀβουβον
  choice: der Sohn des Abubus
  rationale: Die elliptische patronymische Wendung bezeichnet im Kontext den Sohn des Abubus. Der Vers nennt seinen Eigennamen nicht, daher wird er auch in der Übersetzung nicht ergänzt.
- source_word: εἰς τὸ ὀχύρωματιν
  choice: in der Festung
  rationale: Trotz der auffälligen griechischen Form ist ein befestigter Ort gemeint. „Festung“ ist im Deutschen klar und dem militärischen Zusammenhang angemessen.
- source_word: τὸ καλούμενον Δὼκ
  choice: namens Dok
  rationale: Dies gibt die Benennungsformel knapp und natürlich wieder; Δώκ wird als „Dok“ transliteriert.
- source_word: μετὰ δόλου
  choice: in arglistiger Absicht
  rationale: Die Formulierung bewahrt den nominalen Gedanken der Täuschung und macht deutlich, dass der Empfang Teil eines geplanten Verrats war, ohne zusätzliche Einzelheiten einzutragen.
- source_word: ὃ ᾠκοδόμησεν
  choice: die er erbaut hatte
  rationale: Das Relativpronomen bezieht sich auf die Festung. Das Plusquamperfekt verdeutlicht natürlich, dass ihr Bau dem Empfang vorausging.
- source_word: ἐποίησεν αὐτοῖς πότον μέγαν
  choice: er veranstaltete für sie ein großes Festmahl
  rationale: πότος hebt wörtlich das Trinken hervor, kann aber ein Trinkgelage oder Gastmahl bezeichnen. „Festmahl“ vermittelt im Haupttext die üppige Bewirtung; die engere wörtliche Nuance wird in der Fußnote bewahrt.
- source_word: ἐνέκρυψεν ἐκεῖ ἄνδρας
  choice: hatte dort Männer versteckt
  rationale: Das Plusquamperfekt bringt im Deutschen passend zum Ausdruck, dass die Männer bereits als Teil des vorbereiteten Hinterhalts verborgen waren.
