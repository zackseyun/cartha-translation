  text: And he divided the people and the horsemen among the foot soldiers; but the cavalry of the enemy was very numerous.
translation:
  language: de
  text: Er verteilte das Volk und die Reiter mitten unter den Fußsoldaten; die Reiterei der Gegner aber war sehr zahlreich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεῖλεν
  choice: teilte … auf / verteilte
  rationale: Das Verb bezeichnet ein Teilen oder Verteilen. Die variierte Wiedergabe macht die militärische Gliederung und die Einordnung der Reiter in die Fußtruppen im Deutschen verständlich, ohne eine genauere Formation vorauszusetzen.
- source_word: τὸν λαόν
  choice: das Volk
  rationale: Dies entspricht dem griechischen Wortlaut. Im militärischen Zusammenhang sind damit die unter seinem Befehl stehenden Leute gemeint; die wörtliche Wiedergabe bewahrt jedoch die Ausdrucksweise des Textes.
- source_word: τοὺς ἱππεῖς
  choice: die Reiter
  rationale: Das Substantiv bezeichnet berittene Soldaten; „Reiter“ ist die direkte und im Zusammenhang klare deutsche Entsprechung.
- source_word: ἐν μέσῳ τῶν πεζῶν
  choice: unter den Fußsoldaten
  rationale: Die Wendung beschreibt die Platzierung inmitten der zu Fuß kämpfenden Soldaten. „Unter den Fußsoldaten“ ist natürliches modernes Deutsch und legt keine speziellere taktische Anordnung fest.
- source_word: ἡ δὲ ἵππος
  choice: die Reiterei aber
  rationale: ἵππος steht hier kollektiv für die berittene Streitmacht. „Reiterei“ gibt diesen militärischen Kollektivsinn idiomatisch wieder; „aber“ bildet δέ ab.
- source_word: τῶν ὑπεναντίων
  choice: der Gegner
  rationale: Das Wort bezeichnet die feindlich Gegenüberstehenden. „Gegner“ ist im militärischen Kontext klar und entspricht dem griechischen Plural.
- source_word: πολλὴ σφόδρα
  choice: sehr zahlreich
  rationale: Die intensivierte Mengenangabe bezieht sich auf die Stärke der gegnerischen Reiterei. „Sehr zahlreich“ gibt dies in natürlichem Deutsch präzise wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Terminologie. Die Satzstellung mit „aber“ bewahrt den kontrastierenden Charakter des zweiten Teils. Die elliptische griechische Konstruktion wird durch die Wiederaufnahme „verteilte“ verständlich gemacht, ohne die taktische Anordnung weiter auszudeuten.
