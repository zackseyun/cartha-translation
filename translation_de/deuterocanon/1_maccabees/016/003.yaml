base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/003.yaml
  text: But now I have grown old[a], and you also, by mercy, are mature in years. Become my replacements, and my brother’s, and go out and fight on behalf of our nation[c][b], and may the help from heaven be with you.
translation:
  language: de
  text: Nun aber bin ich alt geworden, und auch ihr habt durch Erbarmen[a] ein ausreichendes Alter erreicht. Tretet an meine Stelle und an die meines Bruders[b], zieht hinaus und kämpft für unser Volk. Die Hilfe vom Himmel[c] sei mit euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dank des Erbarmens“. Im Griechischen wird nicht ausdrücklich gesagt, wessen Erbarmen gemeint ist; der Zusammenhang legt Gottes Erbarmen nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Werdet anstelle von mir und meinem Bruder.“ Gemeint ist, dass sie an die Stelle beider treten sollen.'
    reason: alternative_reading
  - marker: c
    text: „Hilfe vom Himmel“ ist eine ehrfürchtig indirekte Bezeichnung für göttliche Hilfe, ohne Gott ausdrücklich zu nennen.
    reason: cultural_note
lexical_decisions:
- source_word: γεγήρακα
  choice: bin ich alt geworden
  rationale: Das Perfekt bezeichnet den gegenwärtigen Zustand als Ergebnis des Alterns. „Bin alt geworden“ gibt sowohl den Vorgang als auch den erreichten Zustand natürlich wieder.
- source_word: ἐν τῷ ἐλέει
  choice: durch Erbarmen
  rationale: Die Wendung nennt nicht ausdrücklich, wessen Erbarmen gemeint ist. „Durch Erbarmen“ bewahrt diese Offenheit und drückt zugleich aus, dass ihr Heranwachsen barmherziger Zuwendung zu verdanken ist.
- source_word: ἱκανοί ἐστε ἐν τοῖς ἔτεσιν
  choice: seid ... alt genug
  rationale: ἱκανός bezeichnet hier ausreichendes Alter beziehungsweise Eignung aufgrund des Alters. „Alt genug“ ist im Deutschen klar und natürlich, ohne den Söhnen hohes Alter zuzuschreiben.
- source_word: γίνεσθε ἀντʼ ἐμοῦ καὶ τοῦ ἀδελφοῦ μου
  choice: Tretet an meine Stelle und an die meines Bruders
  rationale: ἀντί mit dem Genitiv drückt Stellvertretung aus. Die deutsche Wendung gibt diesen Gedanken idiomatisch und präzise wieder.
- source_word: ὑπερμαχεῖτε ὑπὲρ τοῦ ἔθνους ἡμῶν
  choice: kämpft für unser Volk
  rationale: Das Verb bezeichnet den Kampf zugunsten beziehungsweise zur Verteidigung eines anderen. Im makkabäischen Zusammenhang meint ἔθνος die jüdische Volksgemeinschaft; „Volk“ klingt im Deutschen natürlicher und weniger staatsrechtlich als „Nation“.
- source_word: ἡ ... ἐκ τοῦ οὐρανοῦ βοήθεια
  choice: Die Hilfe vom Himmel
  rationale: Die Formulierung bewahrt das Bild vom Himmel als Ursprung der Hilfe und lässt den ehrfürchtig indirekten Gottesbezug bestehen.
- source_word: ἤτω μεθʼ ὑμῶν
  choice: sei mit euch
  rationale: Der Imperativ der dritten Person hat hier den Charakter eines Segenswunsches. „Sei mit euch“ ist eine natürliche, würdevolle deutsche Wiedergabe.
theological_decisions:
- issue: Unausgesprochener Gottesbezug bei „Erbarmen“ und „Hilfe vom Himmel“
  choice: Der Gottesbezug bleibt im Haupttext indirekt; „Gott“ wird nicht ergänzt.
  alternative: „durch Gottes Erbarmen“ beziehungsweise „Gottes Hilfe vom Himmel“
  rationale: Der Zusammenhang legt göttliches Erbarmen und göttliche Hilfe nahe, doch der griechische Text nennt Gott an diesen Stellen nicht ausdrücklich. Die Übersetzung bewahrt diese ehrfürchtige Indirektheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, klare Aufforderungen bewahren den Charakter einer militärischen Übergabe und eines abschließenden Segenswunsches. „Volk“ ist für die jüdische Gemeinschaft im Deutschen kontextgemäßer als das stärker staatsrechtlich klingende „Nation“.
