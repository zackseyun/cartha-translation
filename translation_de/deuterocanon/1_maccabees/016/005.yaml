  text: And when they rose early in the morning[a], they went into the plain; and behold, a large force came to meet them, infantry and cavalry, and a wadi was between them.
translation:
  language: de
  text: Als sie am Morgen aufgestanden waren, zogen sie in die Ebene. Und siehe, eine große Streitmacht aus Fußsoldaten und Reitern kam ihnen entgegen; zwischen ihnen lag ein Winterbach[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Wildbach«, »ein zeitweise wasserführender Bach« oder »ein Bachbett«. Das griechische Wort bezeichnet einen Wasserlauf, der besonders im Winter beziehungsweise in der Regenzeit Wasser führt, und kann sowohl den Bach selbst als auch sein Bett meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες τὸ πρωὶ
  choice: Als sie am Morgen aufgestanden waren
  rationale: Das temporale Partizip bezeichnet die dem Aufbruch vorausgehende Handlung. Die Formulierung ist natürlich und gibt die zeitliche Abfolge wieder, ohne ein im Griechischen nicht ausdrücklich enthaltenes »früh« hinzuzufügen.
- source_word: ἐπορεύοντο
  choice: zogen sie
  rationale: Der narrative Imperfekt beschreibt ihre Bewegung in die Ebene. »zogen« ist im militärischen Zusammenhang idiomatisch, ohne das ausdrücklichere »marschierten« zu wählen.
- source_word: τὸ πεδίον
  choice: die Ebene
  rationale: πεδίον bezeichnet hier offenes, ebenes Gelände und nicht speziell ein landwirtschaftliches Feld.
- source_word: δύναμις πολλὴ
  choice: eine große Streitmacht
  rationale: δύναμις bezeichnet im militärischen Erzählzusammenhang eine bewaffnete Truppe; »Streitmacht« wahrt dies, ohne zwingend eine formell organisierte Armee vorauszusetzen.
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: kam ihnen entgegen
  rationale: Die Wendung bezeichnet eine Bewegung auf die andere Gruppe zu. Der Zusammenhang ist feindlich, doch die Übersetzung verschärft die Formulierung nicht unnötig zu »griff sie an«.
- source_word: πεζικοὶ καὶ ἱππεῖς
  choice: Fußsoldaten und Reiter
  rationale: Die konkrete deutsche Benennung ist allgemein verständlich und erhält den Gegensatz zwischen Truppen zu Fuß und zu Pferd.
- source_word: χειμάρρους
  choice: Winterbach
  rationale: Das Wort bezeichnet einen vor allem in der Regenzeit wasserführenden Bach beziehungsweise dessen Bett. »Winterbach« bewahrt den saisonalen Charakter besser als das möglicherweise dauerhaft klingende »Bach« und ist verständlicher als »Wadi«.
- source_word: ἦν ἀνὰ μέσον αὐτῶν
  choice: zwischen ihnen lag
  rationale: Die Formulierung beschreibt anschaulich und idiomatisch das Gelände, das die beiden Gruppen voneinander trennte.
