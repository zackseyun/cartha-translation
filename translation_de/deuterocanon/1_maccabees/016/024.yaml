  text: Behold[a], these things are written in the book of the days of his high priesthood, from the time when he became high priest after his father.
translation:
  language: de
  text: Siehe, dies alles ist im Buch der Tage seines Hohenpriestertums[a] niedergeschrieben, von der Zeit an, als er nach seinem Vater Hoherpriester wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäßer: »in den Jahrbüchern seines Hohenpriestertums«. Wörtlicher lautet das Griechische: »im Buch der Tage seines Hohenpriestertums«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Siehe
  rationale: Bewahrt die aufmerksamkeitslenkende Funktion des griechischen Ausdrucks und passt zum abschließenden Hinweis auf eine schriftliche Quelle.
- source_word: ταῦτα
  choice: dies alles
  rationale: Gibt den rückverweisenden Neutrum-Plural natürlich wieder und bezieht sich umfassend auf die zuvor berichteten Ereignisse.
- source_word: γέγραπται
  choice: ist … niedergeschrieben
  rationale: 'Bringt den resultativen Sinn des griechischen Perfekts zum Ausdruck: Das Berichtete wurde aufgezeichnet und liegt schriftlich vor.'
- source_word: ἐπὶ βιβλίῳ
  choice: im Buch
  rationale: In diesem dokumentarischen Zusammenhang bezeichnet die Präposition den Ort innerhalb einer schriftlichen Aufzeichnung; »im Buch« ist im Deutschen idiomatisch.
- source_word: ἡμερῶν ἀρχιερωσύνης αὐτοῦ
  choice: der Tage seines Hohenpriestertums
  rationale: Bewahrt die konkrete griechische Formulierung, die wahrscheinlich den annalistischen Charakter oder Titel der Quelle widerspiegelt; die sinngemäße Deutung wird in der Fußnote genannt.
- source_word: ἀφʼ οὗ
  choice: von der Zeit an, als
  rationale: Kennzeichnet klar den zeitlichen Ausgangspunkt der schriftlichen Aufzeichnung.
- source_word: ἐγενήθη ἀρχιερεύς
  choice: Hoherpriester wurde
  rationale: Gibt den Amtsantritt natürlich wieder, ohne einen im Griechischen nicht genannten Einsetzenden vorauszusetzen.
- source_word: μετὰ τὸν πατέρα αὐτοῦ
  choice: nach seinem Vater
  rationale: Bewahrt die knappe Formulierung und ihren naheliegenden Bezug auf die Nachfolge im Amt.
