translation_notes:
  register: Moderne, würdige Erzählsprache. Der Satz wurde zur besseren deutschen Lesbarkeit gegliedert. „Er aber“ macht den im Griechischen nur durch die Verbform angezeigten Subjektwechsel verständlich. Die Mehrdeutigkeit des femininen Singularpronomens wird nicht durch eine ausdrücklich ergänzte Bezugsgröße aufgelöst.
