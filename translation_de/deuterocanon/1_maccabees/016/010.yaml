  - severity: medium
    issue: „Unbehelligt“ ist für μετʼ εἰρήνης zu spezifisch.
    rationale: Das Wort kann eine sichere Rückkehr nahelegen, fügt aber den Gedanken fehlender Belästigung hinzu. „In Frieden“ bewahrt die offenere griechische Wendung.
