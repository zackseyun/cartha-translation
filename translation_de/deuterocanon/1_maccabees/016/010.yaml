revisions:
- from: Und sie flohen in die Türme auf den Feldern von Azotus[a]. Er aber steckte sie in Brand[b]. Von ihnen fielen etwa tausend Mann[c], und er kehrte unbehelligt nach Judäa zurück.
  to: Und sie flohen in die Türme auf den Feldern von Azotus[a]. Er aber setzte die Befestigung in Brand[b]. Etwa tausend Mann von ihnen fielen[c], und er kehrte in Frieden nach Judäa zurück.
  rationale: Die Übersetzung ersetzt das mit dem griechischen Singular unvereinbare deutsche Pluralpronomen durch eine explizit kollektive, in der Fußnote als Auslegung gekennzeichnete Bezugsgröße. Außerdem wird μετʼ εἰρήνης ohne die zusätzliche Nuance von „unbehelligt“ als „in Frieden“ wiedergegeben. Die übrigen Entscheidungen bleiben erhalten.
