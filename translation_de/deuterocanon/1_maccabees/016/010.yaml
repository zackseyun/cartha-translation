  text: And they fled into the towers in the fields of Azotus[a], and he burned it with fire; and about a thousand men fell from among them[c][b], and he returned to Judea in peace.
translation:
  language: de
  text: Und sie flohen in die Türme auf den Feldern von Azotus[a]. Er aber setzte die Befestigung in Brand[b]. Etwa tausend Mann von ihnen fielen[c], und er kehrte in Frieden nach Judäa zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azotus ist der griechische Name von Aschdod.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er verbrannte sie mit Feuer.“ Das griechische Pronomen steht im Singular; sein genauer Bezug bleibt unklar. Es kann das befestigte Gebiet als Ganzes meinen, nicht unbedingt jeden einzelnen der zuvor genannten Türme.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „tausend Mann“. Die griechische Formulierung kann eine ungefähre Gesamtzahl bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγον
  choice: sie flohen
  rationale: Gibt das Verb im militärischen Rückzugskontext direkt und natürlich wieder.
- source_word: πύργους
  choice: Türme
  rationale: Bewahrt das konkrete Bild befestigter Türme, ohne sie verallgemeinernd als Festungen zu deuten.
- source_word: ἐν τοῖς ἀγροῖς
  choice: auf den Feldern
  rationale: Entspricht der konkreten Ortsangabe; „auf“ ist im Deutschen bei Feldern idiomatisch.
- source_word: Ἀζώτου
  choice: Azotus
  rationale: Bewahrt die griechische Namensform des Ausgangstextes; die bekannte Entsprechung Aschdod wird in der Fußnote genannt.
- source_word: ἐνεπύρισεν αὐτὴν ἐν πυρί
  choice: er steckte sie in Brand
  rationale: Gibt die Verbrennung idiomatisch wieder und bewahrt mit „sie“ den femininen Singular des griechischen Pronomens, dessen Bezug im Deutschen jedoch mehrdeutig bleibt.
- source_word: ἔπεσον ἐξ αὐτῶν
  choice: von ihnen fielen
  rationale: Bewahrt sowohl den militärischen Ausdruck „fielen“ als auch den partitiven Sinn von ἐξ αὐτῶν.
- source_word: εἰς ἄνδρας χιλίους
  choice: etwa tausend Mann
  rationale: Die ungewöhnliche Konstruktion bezeichnet hier wahrscheinlich eine ungefähre Zahl; „Mann“ ist als Zählausdruck natürlich.
- source_word: ἀπέστρεψεν
  choice: er kehrte zurück
  rationale: Natürliche Wiedergabe des abschließenden Rückkehrmotivs.
- source_word: μετ’ εἰρήνης
  choice: unbehelligt
  rationale: Im militärischen Erzählzusammenhang bezeichnet die Wendung eine sichere, ungestörte Rückkehr und nicht notwendig einen Friedensschluss.
