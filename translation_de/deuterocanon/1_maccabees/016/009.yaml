revisions:
- from: Damals wurde Judas, der Bruder des Johannes, verwundet. Johannes aber verfolgte sie, bis er nach Kedron kam,[a] das er erbaut hatte.[b]
  to: Damals wurde Judas, der Bruder des Johannes, verwundet. Johannes aber verfolgte sie bis nach Kedron,[a] das zuvor erbaut worden war.[b]
  rationale: Die Revision erhält die knappe Erzählweise und alle expliziten Aussagen des griechischen Textes. Sie beseitigt zugleich die im Deutschen durch „er“ entstehende scheinbare Festlegung auf Johannes und korrigiert die Fußnotenbeschreibung auf die Bedeutung „erbauen“. Die Anmerkungen dokumentieren die sprachlichen und kontextuellen Möglichkeiten, ohne eine davon als Textinhalt zu erzwingen.
