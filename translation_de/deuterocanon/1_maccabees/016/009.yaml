  source_fidelity: Der Entwurf gibt τότε, die Verwundung des Judas und die Verfolgung durch Johannes zutreffend wieder. Die beiden im Griechischen nicht ausdrücklich bezeichneten Bezüge (Subjekt bei ἐλθεῖν und besonders bei οἰκοδόμησεν) sollten im deutschen Haupttext jedoch nicht durch die maskuline Form „er“ scheinbar entschieden werden. Die passive Umschreibung bei der zweiten Relativkonstruktion bewahrt die offene Zuordnung, ohne einen historischen Akteur einzutragen.
  naturalness: „Johannes aber verfolgte sie bis nach Kedron“ ist modernes, idiomatisches Deutsch und lässt offen, ob der Endpunkt als Ankunft des Johannes oder der Verfolgten formuliert wird. „das zuvor erbaut worden war“ ist in diesem knappen erzählerischen Register natürlich und vermeidet einen im Deutschen sonst nahezu unausweichlichen Bezug von „er“ auf Johannes.
  terminology: „Judas“, „Johannes“ und „Kedron“ sind angemessene moderne biblische Namensformen. „verwundet“, „verfolgte“ und „erbaut“ treffen die griechischen Ausdrücke ohne unnötige Ausschmückung. Die Fußnote soll „befestigen“ nicht als Sinn von οἰκοδόμησεν ausgeben; das Verb bedeutet hier bauen/erbauen.
  issues:
