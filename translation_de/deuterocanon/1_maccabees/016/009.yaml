base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/009.yaml
  text: Then Judas[a], the brother of John, was wounded; but John pursued them until he came to Kedron[b], which he had built.
translation:
  language: de
  text: Damals wurde Judas, der Bruder des Johannes, verwundet. Johannes aber verfolgte sie bis nach Kedron,[a] das zuvor erbaut worden war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Infinitiv nennt nicht ausdrücklich, wer nach Kedron kam. Am nächsten liegt Johannes als Subjekt des übergeordneten Verbs; dem Satzbau nach ist jedoch auch möglich, dass die Verfolgten Kedron erreichten.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „das er erbaut hatte“. Das Subjekt von „erbaut hatte“ bleibt im Griechischen unausgesprochen. Der unmittelbare Satzbau kann Johannes nahelegen; im Erzählzusammenhang wird auch Kendebäus als Erbauer von Kedron verstanden.'
    reason: ambiguity
lexical_decisions:
- source_word: τότε
  choice: Damals
  rationale: Kennzeichnet den Zeitpunkt innerhalb der fortlaufenden Erzählung; „damals“ klingt im Deutschen natürlicher als ein rein folgerndes „dann“.
- source_word: ἐτραυματίσθη
  choice: wurde … verwundet
  rationale: Das Aoristpassiv bezeichnet hier eine im Kampf erlittene Verwundung.
- source_word: ὁ ἀδελφὸς Ἰωάννου
  choice: der Bruder des Johannes
  rationale: Die Apposition wird eng und eindeutig an Judas angeschlossen; die eingedeutschte Namensform „Johannes“ entspricht dem üblichen biblischen Sprachgebrauch.
- source_word: κατεδίωξεν
  choice: verfolgte
  rationale: Das Verb bezeichnet die entschlossene Verfolgung fliehender Gegner und wird ohne zusätzliche Bedeutungsnuance wiedergegeben.
- source_word: ἕως ἐλθεῖν εἰς Κεδρών
  choice: bis er nach Kedron kam
  rationale: Der Infinitiv bezeichnet die Grenze der Verfolgung. Als unausgesprochenes Subjekt liegt zunächst Johannes, das Subjekt des übergeordneten Verbs, nahe; die syntaktische Offenheit wird in einer Fußnote vermerkt.
- source_word: Κεδρών
  choice: Kedron
  rationale: Die Form gibt den griechischen Ortsnamen Κεδρών unmittelbar mit K wieder.
- source_word: οἰκοδόμησεν
  choice: erbaut hatte
  rationale: Das Verb bedeutet grundsätzlich „bauen/erbauen“. Das Plusquamperfekt macht deutlich, dass der Bau vor der hier erzählten Verfolgung lag, ohne die nicht ausdrücklich genannte Bedeutung „befestigen“ in den Text einzutragen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von οἰκοδόμησεν
  choice: Im Haupttext bleibt „er“ stehen; eine Fußnote erläutert den möglichen Bezug auf Kendebäus.
  alternative: Den Namen „Kendebäus“ ausdrücklich in den Haupttext einsetzen oder „von Johannes erbaut“ schreiben.
  rationale: Das griechische Verb nennt sein Subjekt nicht. Der unmittelbare Satzbau kann einen Bezug auf Johannes nahelegen, während der weitere Erzählzusammenhang auf Kendebäus weist, der Kedron zuvor ausbauen beziehungsweise befestigen ließ. Die Übersetzung soll diese Spannung nicht stillschweigend entscheiden.
translation_notes:
  register: Moderne, würdige Erzählsprache mit kurzen, klaren Sätzen. „Johannes aber“ bewahrt den leichten Gegensatz des griechischen δέ. Der Ortsname wird als „Kedron“ transliteriert; konfessionell geprägte oder historisch ergänzende Deutungen werden nicht in den Haupttext aufgenommen.
