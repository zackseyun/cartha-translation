    rationale: οἰκοδόμησεν hat im griechischen Text kein ausgedrücktes Subjekt. Zwar kann der Satzanschluss Johannes nahelegen, doch der erzählerische Zusammenhang wird auch auf Kendebäus bezogen. Eine deutsche Aktivform mit maskulinem Pronomen verwischt diese überlieferte Offenheit.
