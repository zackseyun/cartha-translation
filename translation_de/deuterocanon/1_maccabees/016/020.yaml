lexical_decisions:
- source_word: ἑτέρους
  choice: andere
  rationale: Der unbestimmte Plural bezeichnet weitere Beauftragte, die von den zuvor Genannten unterschieden sind; »andere« ist knapp und natürlich.
- source_word: ἀπέστειλεν
  choice: sandte ... aus
  rationale: Das Verb bezeichnet hier das Entsenden von Personen mit einem bestimmten Auftrag; »sandte ... aus« gibt diesen zielgerichteten Sinn idiomatisch wieder.
- source_word: καταλαβέσθαι
  choice: einzunehmen
  rationale: Im militärisch-politischen Zusammenhang geht es darum, Orte unter die eigene Kontrolle zu bringen. »Einzunehmen« wahrt diesen Sinn, ohne die Art des Vorgehens näher festzulegen.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: den Tempelberg
  rationale: Wörtlich steht »der Berg des Heiligtums«. »Tempelberg« ist im Deutschen die natürliche und sachlich passende Bezeichnung für die Anhöhe des Tempelbezirks; die wörtliche Struktur wird in der Fußnote kenntlich gemacht.
