translation:
  language: de
  text: Und er sandte andere aus, um Jerusalem und den Tempelberg[a] einzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Berg des Heiligtums«; auch: »die Anhöhe des Tempels«.'
