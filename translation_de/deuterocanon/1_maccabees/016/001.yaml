  yaml_path: translation/deuterocanon/1_maccabees/016/001.yaml
  text: And John came up from Gazara and reported to Simon his father what Cendebeus was doing[a].
translation:
  language: de
  text: Johannes kam von Gazara herauf und berichtete seinem Vater Simon, was Kendebäus unternahm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was Kendebäus ausführte« beziehungsweise »betrieb«. Das griechische Verb kann eine fortdauernde Tätigkeit oder die Ausführung eines Vorhabens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: kam … herauf
  rationale: Die Wendung gibt die gerichtete Aufwärtsbewegung von ἀναβαίνω natürlich wieder; das griechische Verb kann je nach Erzählperspektive auch mit »zog hinauf« wiedergegeben werden.
- source_word: Γαζάρων
  choice: Gazara
  rationale: Die deutsche Form folgt dem griechischen Ortsnamen; das griechische Zeugnis steht formal im Plural, bezeichnet hier aber den als Gazara bekannten Ort.
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: ἀπαγγέλλω bezeichnet hier das Überbringen einer Nachricht und passt als »berichtete« zum militärisch-politischen Zusammenhang.
- source_word: συνετέλει
  choice: unternahm
  rationale: Das Imperfekt bezeichnet eine im Verlauf befindliche Tätigkeit; »unternahm« ist im Deutschen natürlich und lässt offen, ob konkrete Handlungen oder die Ausführung eines Plans gemeint sind.
- source_word: Κενδεβαῖος
  choice: Kendebäus
  rationale: Die Form entspricht einer im Deutschen gut lesbaren Transliteration des griechischen Personennamens.
