translation:
  language: de
  text: und seinen Anordnungen zu folgen; denn deswegen entfremdeten sich diejenigen aus unserem Volk von uns, ausgenommen diejenigen, die bei uns anzutreffen waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist in der Schlussklausel knapp und syntaktisch ungewöhnlich: wörtlich etwa „ausgenommen, so viele sich von uns fanden“. Das abschließende „von uns“ kann Zugehörigkeit bzw. Parteinahme andeuten; möglich ist daher auch: „ausgenommen diejenigen, die auf unserer Seite waren“.'
