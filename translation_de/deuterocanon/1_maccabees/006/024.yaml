lexical_decisions:
- source_word: κατακολουθεῖν
  choice: zu folgen
  rationale: Das Verb bezeichnet hier in Verbindung mit dem Dativ der Anordnungen das Befolgen bzw. Gehorchen; „folgen“ bewahrt die Ausdrucksweise des Griechischen und ist im Deutschen natürlich.
- source_word: προστάγμασιν
  choice: Anordnungen
  rationale: Das Wort bezeichnet verbindliche Weisungen einer Autorität. „Anordnungen“ passt zum persönlichen Possessivpronomen und vermeidet eine unnötige Festlegung auf gesetzliche „Gebote“ oder königliche „Erlasse“.
- source_word: οἱ τοῦ λαοῦ ἡμῶν
  choice: diejenigen aus unserem Volk
  rationale: Die elliptische griechische Formulierung lautet wörtlich etwa „die aus unserem Volk“. Die gewählte Fassung erhält diese Teilmengenbezeichnung, ohne „Männer“ hinzuzufügen.
- source_word: χάριν τούτου
  choice: deswegen
  rationale: Die nachgestellte Präpositionalkonstruktion gibt den Grund an. „Deswegen“ ist knapp, gegenwärtig und stellt den Bezug auf das zuvor Genannte klar her.
- source_word: ἠλλοτριοῦντο
  choice: entfremdeten sich
  rationale: Der Imperfekt und die mediale bzw. passive Form bezeichnen einen fortschreitenden Vorgang des Fremd- oder Fernwerdens. „Entfremdeten sich“ gibt die soziale und politische Distanzierung wieder, ohne ihre Ursache näher auszudeuten.
- source_word: ἀφʼ ἡμῶν
  choice: von uns
  rationale: Die Präposition ἀπό bezeichnet hier Trennung oder Entfernung; „von uns“ ist die direkte und idiomatische Wiedergabe.
- source_word: πλὴν ὅσοι εὑρίσκοντο ἀφʼ ἡμῶν
  choice: ausgenommen diejenigen, die sich bei uns fanden
  rationale: πλήν leitet eine Ausnahme ein, während εὑρίσκοντο wörtlich „gefunden wurden/sich fanden“ bedeutet. Das zweite ἀφʼ ἡμῶν ist syntaktisch auffällig; „bei uns“ bewahrt die mögliche Zugehörigkeits- oder Seitenbedeutung, ohne sie eindeutig festzulegen.
