  yaml_path: translation/deuterocanon/1_maccabees/006/030.yaml
  text: And the number of his forces was one hundred thousand foot soldiers[a], and twenty thousand horsemen[b], and thirty-two elephants trained for war.
translation:
  language: de
  text: Die Zahl seiner Streitkräfte betrug hunderttausend Fußsoldaten, zwanzigtausend Reiter[a] und zweiunddreißig für den Krieg abgerichtete Elefanten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwanzigtausend Pferde“; wahrscheinlich sind damit die berittenen Truppen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Elefanten, die den Krieg kannten“; gemeint sind für den Krieg ausgebildete oder im Kampf erfahrene Elefanten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς
  choice: Zahl
  rationale: Die direkte und im Zusammenhang einer Truppenaufstellung natürliche Entsprechung.
- source_word: δυνάμεων
  choice: Streitkräfte
  rationale: Bezeichnet hier die militärischen Kräfte insgesamt und schließt die verschiedenen Truppengattungen ein.
- source_word: πεζῶν
  choice: Fußsoldaten
  rationale: Gibt die Soldaten zu Fuß im Gegensatz zu den berittenen Truppen klar und allgemein verständlich wieder.
- source_word: ἵππων
  choice: Reiter
  rationale: Wörtlich steht „Pferde“; in der militärischen Aufzählung ist dies wahrscheinlich eine metonymische Bezeichnung für berittene Truppen.
- source_word: ἐλέφαντες
  choice: Elefanten
  rationale: Direkte lexikalische Entsprechung.
- source_word: εἰδότες πόλεμον
  choice: für den Krieg abgerichtete
  rationale: Die wörtliche Wendung „den Krieg kennend“ beschreibt hier Elefanten, die für den Krieg ausgebildet beziehungsweise kampferprobt waren. „Abgerichtet“ ist bei Tieren natürlich und lässt offen, ob vor allem Ausbildung oder Erfahrung gemeint ist.
