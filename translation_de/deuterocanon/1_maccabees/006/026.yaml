base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/026.yaml
  text: And behold[a], today they have encamped against the citadel in Jerusalem, to capture it and the sanctuary, and they have fortified Beth-zur.
translation:
  language: de
  text: 'Und sieh: heute haben sie ihr Lager gegen die Zitadelle in Jerusalem aufgeschlagen, um sie und das Heiligtum einzunehmen, und Bet-Zur haben sie befestigt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Und sieh
  rationale: ἰδού lenkt als lebendiger Redemarker die Aufmerksamkeit auf die nun gemeldete Lage. „Und sieh“ wahrt diesen Impuls in knapper, würdiger Sprache.
- source_word: παρεμβεβλήκασιν ἐπὶ
  choice: haben … vor … ihr Lager aufgeschlagen
  rationale: παρεμβάλλω bezeichnet hier das militärische Beziehen einer Lagerstellung gegen einen Ort. Die Formulierung gibt dies natürlich wieder, ohne ausdrücklich eine vollständige Belagerung zu behaupten.
- source_word: σήμερον
  choice: heute
  rationale: Direkte und natürliche Wiedergabe des Zeitadverbs.
- source_word: τὴν ἄκραν
  choice: die Festung
  rationale: ἄκρα bezeichnet eine befestigte Höhe beziehungsweise Zitadelle; „Festung“ ist im Deutschen klar und passt zum Jerusalemer Kontext. Der mögliche Eigenname „Akra“ wird in der Fußnote bewahrt.
- source_word: τοῦ καταλαβέσθαι αὐτὴν
  choice: um sie … einzunehmen
  rationale: Der artikulierte Infinitiv bezeichnet den Zweck; καταλαμβάνω meint hier die militärische Einnahme. Das Pronomen bezieht sich grammatisch auf die Festung.
- source_word: τὸ ἁγίασμα
  choice: das Heiligtum
  rationale: ἁγίασμα bezeichnet den heiligen Bereich beziehungsweise das Heiligtum; „Heiligtum“ ist präzise, knapp und im Deutschen geläufig.
- source_word: τὴν Βεθσούραν
  choice: Bet-Zur
  rationale: Der Ortsname wird in einer im Deutschen transparenten, an der semitischen Namensform orientierten Schreibweise wiedergegeben.
- source_word: ὠχύρωσαν
  choice: haben … befestigt
  rationale: ὀχυρόω bedeutet, einen Ort militärisch zu sichern oder zu befestigen; „befestigt“ ist die direkte deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Doppelpunkt nach „Und sieh“ lässt den Aufmerksamkeitsruf natürlich in die Meldung übergehen; das Semikolon bildet den letzten, eigenständigen Berichtsteil klar ab.
