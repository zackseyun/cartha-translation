  text: And Lysias learned that the king had died[a], and he installed Antiochus his son to reign in his place, whom he had reared from youth, and
translation:
  language: de
  text: Als Lysias erfuhr, dass der König gestorben war, setzte er Antiochus, dessen Sohn, an dessen Stelle als König ein; ihn hatte er erzogen, als er noch jung war, und[a]
