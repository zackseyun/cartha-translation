lexical_decisions:
- source_word: ἐπέγνω
  choice: erfuhr
  rationale: Der Aorist bezeichnet hier, dass Lysias von einem Sachverhalt Kenntnis erhielt. „Erfuhr“ ist im modernen deutschen Erzählstil natürlich und präzise.
- source_word: τέθνηκεν
  choice: gestorben war
  rationale: Das Perfekt bezeichnet den eingetretenen Tod mit fortbestehendem Ergebnis. Im abhängigen Satz nach einem Erzählverb der Vergangenheit gibt das Plusquamperfekt die zeitliche Vorzeitigkeit angemessen wieder.
- source_word: κατέστησεν βασιλεύειν
  choice: setzte … als König ein
  rationale: Die Verbindung bezeichnet, dass Antiochus in die königliche Stellung gebracht wurde. Die deutsche Wendung ist idiomatisch und bewahrt sowohl den veranlassenden Sinn von κατέστησεν als auch die königliche Funktion von βασιλεύειν.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: dessen Sohn
  rationale: Das Pronomen bezieht sich im Zusammenhang auf den verstorbenen König. „Dessen“ macht den syntaktischen Bezug im Deutschen verständlich, ohne einen Namen zu ergänzen.
- source_word: ἀντʼ αὐτοῦ
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die Nachfolge des verstorbenen Königs und wird mit einer geläufigen deutschen Entsprechung wiedergegeben.
- source_word: ἐξέθρεψεν νεώτερον
  choice: von Jugend an erzogen hatte
  rationale: ἐκτρέφω bezeichnet das Aufziehen beziehungsweise Erziehen; νεώτερον weist auf Antiochus’ jüngere Lebenszeit. „Von Jugend an“ ist knapp, würdig und vermeidet eine unnötig genaue Altersangabe.
