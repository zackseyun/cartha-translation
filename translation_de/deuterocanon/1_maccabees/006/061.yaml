  text: And the king and the rulers swore this to them[a]; then he came out from the stronghold[b],
translation:
  language: de
  text: Und der König und die Oberen schworen ihnen dies[a]; dann kam er aus der Festung heraus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schworen ihnen unter diesen Bedingungen«; der Eid bezog sich auf die zuvor genannten Vereinbarungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht das Verb im Singular (»kam er heraus«), doch aus dem unmittelbaren Zusammenhang kann auch ein gemeinschaftliches Subjekt verstanden werden: »kamen sie heraus«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: schworen
  rationale: Der Aorist von ὄμνυμι bezeichnet das Ablegen eines Eides. Im Deutschen verlangt das zusammengesetzte Subjekt »der König und die führenden Männer« den Plural.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Direkte und natürliche Wiedergabe der Herrscherbezeichnung im historischen Bericht.
- source_word: οἱ ἄρχοντες
  choice: die führenden Männer
  rationale: ἄρχοντες bezeichnet hier die maßgeblichen politischen beziehungsweise militärischen Führungspersonen. Die Formulierung ist allgemein genug, um die genaue Amtsstellung nicht festzulegen.
- source_word: ἐπὶ τούτοις
  choice: dies
  rationale: Die Wendung verweist auf die zuvor genannten Bedingungen. »Dies« bewahrt den Rückbezug knapp; die ausdrückliche Deutung »unter diesen Bedingungen« steht in der Fußnote.
- source_word: ἐξῆλθεν
  choice: kam er ... heraus
  rationale: Die griechische Verbform ist Singular und lässt das Subjekt unausgesprochen. Die Übersetzung wahrt diese grammatische Form, ohne den möglichen Bezug eigenmächtig festzulegen.
- source_word: τοῦ ὀχυρώματος
  choice: aus der Festung
  rationale: ὀχύρωμα bezeichnet einen befestigten Ort. »Festung« ist im militärisch-politischen Zusammenhang natürlich und präzise.
