  yaml_path: translation/deuterocanon/1_maccabees/006/009.yaml
  text: And he remained there for many days[a], because great grief came over him, and he thought that he was dying.
translation:
  language: de
  text: Und er blieb viele Tage dort, denn großer Kummer überkam ihn von Neuem[a], und er dachte, er liege im Sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „denn großer Kummer wurde über ihm erneuert.“ Das griechische Verb betont, dass sein Kummer wiederkehrte oder neu auflebte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: er blieb dort
  rationale: Die Verbindung von εἰμί mit der Ortsangabe bezeichnet hier im erzählerischen Zusammenhang einen andauernden Aufenthalt; „blieb dort“ gibt dies natürlich wieder.
- source_word: ἡμέρας πλείους
  choice: viele Tage
  rationale: Die Wendung bezeichnet eine längere Zeitspanne. „Viele Tage“ entspricht dem griechischen Ausdruck direkt und ist im Deutschen idiomatisch.
- source_word: ἀνεκαινίσθη
  choice: überkam … von Neuem
  rationale: Das Passiv bezeichnet die Erneuerung oder das Wiederaufleben des Kummers. Die Formulierung wahrt diesen Wiederholungsaspekt, ohne unnatürlich wörtlich zu klingen.
- source_word: ἐπ᾽ αὐτόν
  choice: ihn
  rationale: Beim deutschen Verb „überkommen“ wird die von der griechischen Präposition ausgedrückte Belastung idiomatisch durch das Akkusativobjekt wiedergegeben.
- source_word: λύπη μεγάλη
  choice: großer Kummer
  rationale: λύπη bezeichnet Kummer, Trauer oder Schmerz; „großer Kummer“ bewahrt die substantivische und gewichtige Ausdrucksweise.
- source_word: ἐλογίσατο
  choice: er dachte
  rationale: Das Verb kann „erwägen“, „rechnen“ oder „meinen“ bedeuten. „Er dachte“ ist hier eine klare, nicht überdeutende Wiedergabe seiner Einschätzung.
- source_word: ὅτι ἀποθνήσκει
  choice: er liege im Sterben
  rationale: Der griechische Präsens stellt das Sterben als gegenwärtigen Vorgang dar. „Im Sterben liegen“ bewahrt diese Verlaufsbedeutung besser als eine bloße Zukunftsaussage.
