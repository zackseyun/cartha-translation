  source_fidelity: 'Die Übersetzung gibt die erhaltene griechische Textgestalt genau wieder: καὶ bleibt als einleitendes „und“ erhalten; διάδημα, στολή, δακτύλιος sowie das ausdrücklich nur bei στολή stehende Possessivpronomen sind angemessen abgebildet. Die finale Konstruktion τοῦ ἀγαγεῖν wird mit „damit ... herbeiführe“ sachgerecht wiedergegeben. Der Satzabbruch nach καὶ („und“) wird nicht ergänzt.'
