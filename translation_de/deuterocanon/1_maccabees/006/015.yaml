  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier vorliegende griechische Text bricht mitten im Satz nach „und“ ab. Die Übersetzung bewahrt diesen unvollständigen Wortlaut und ergänzt die Fortsetzung nicht aus dem Zusammenhang.
    reason: textual_variant
lexical_decisions:
- source_word: διάδημα
  choice: Diadem
  rationale: Bezeichnet das königliche Stirnband beziehungsweise Herrschaftszeichen. „Diadem“ gibt das konkrete Insigne genauer wieder als das allgemeinere „Krone“ und ist im Deutschen verständlich.
- source_word: στολή
  choice: Gewand
  rationale: Bezeichnet hier im königlichen Zusammenhang ein besonderes, ranggemäßes Kleidungsstück. „Gewand“ bewahrt den feierlichen Registerton, ohne „Staatsgewand“ oder „Königsgewand“ ausdrücklich in den Text einzutragen.
- source_word: δακτύλιος
  choice: Ring
  rationale: Das griechische Wort bezeichnet einen Ring. Obwohl im Zusammenhang ein Siegelring gemeint sein kann, wird diese Funktion lexikalisch nicht ausdrücklich bezeichnet.
- source_word: τοῦ ἀγαγεῖν
  choice: damit er … herbeiführe
  rationale: Der artikulierte Infinitiv im Genitiv drückt hier einen Zweck aus. „Herbeiführen“ lässt sowohl das Bringen als auch das Vorführen des Sohnes im Zusammenhang der Nachfolge offen.
- source_word: τὸ διάδημα καὶ τὴν στολὴν αὐτοῦ καὶ τὸν δακτύλιον
  choice: das Diadem, sein Gewand und den Ring
  rationale: Die drei Herrschaftsgegenstände bleiben als gesonderte Glieder erhalten. Das Possessivpronomen bezieht sich grammatisch ausdrücklich auf das Gewand; beim Ring wird daher kein nicht ausgedrücktes „sein“ ergänzt.
