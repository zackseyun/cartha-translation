translation:
  language: de
  text: Und sie sahen die Stärke des Königreichs und den Ansturm[a] der Streitkräfte und wandten sich von ihnen ab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Angriff der Truppen“. Das griechische Wort bezeichnet eine kraftvolle Vorwärtsbewegung im Kampf.'
