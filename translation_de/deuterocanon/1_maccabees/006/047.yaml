  source_fidelity: Die Wiedergabe von ἰσχὺς, βασιλεία, ὁρμήμα und δυνάμεις ist treffend und bewahrt die militärisch-politische Bildlichkeit. „Vor ihnen zurückweichen“ legt jedoch stärker als das griechische ἐξέκλιναν ἀπʼ αὐτῶν nahe, dass sie durch die Streitkräfte zurückgedrängt wurden. Das Griechische sagt zurückhaltender, dass sie sich von ihnen abwandten bzw. sich von ihnen zurückzogen.
  naturalness: „Und sie sahen … und wandten sich von ihnen ab“ ist modernes, gut verständliches Standarddeutsch und wahrt die knappe koordinierte Satzstruktur. Es vermeidet die zusätzliche kausale Nuance von „vor ihnen zurückweichen“.
  terminology: „Stärke des Königreichs“, „Ansturm“ und „Streitkräfte“ sind angemessene, registergerechte Entsprechungen. Die Fußnote zu ὁρμήμα sollte am Wort „Ansturm“ verankert sein. Die Erläuterung zu ἀπʼ αὐτῶν bleibt sinnvoll, sollte aber die Übersetzung „wandten sich von ihnen ab“ erklären.
