- from: Und sie sahen die Stärke des Königreichs und den Ansturm der Streitkräfte[a] und wichen vor ihnen zurück.[b]
  to: Und sie sahen die Stärke des Königreichs und den Ansturm[a] der Streitkräfte und wandten sich von ihnen ab.[b]
  rationale: Die Revision gibt ἐξέκλιναν ἀπʼ αὐτῶν mit „wandten sich von ihnen ab“ näher wieder und vermeidet die nicht ausdrücklich im Griechischen enthaltene Vorstellung, dass sie „vor“ den Streitkräften zurückweichen mussten. Die übrigen Schlüsselbegriffe bleiben erhalten; der Fußnotenanker zu ὁρμήμα wird an die passende Stelle gesetzt.
