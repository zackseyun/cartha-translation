lexical_decisions:
- source_word: ἰσχὺν
  choice: Stärke
  rationale: Das Wort bezeichnet Stärke oder Macht; „Stärke“ wahrt den konkreten militärisch-politischen Klang.
- source_word: βασιλείας
  choice: Königreichs
  rationale: βασιλεία kann Königtum, Herrschaft oder Königreich bedeuten. „Königreich“ ist hier natürlich und lässt den Bezug auf die königliche Macht offen.
- source_word: ὁρμήμα
  choice: Ansturm
  rationale: Das Substantiv bezeichnet eine heftige Vorwärtsbewegung oder einen Angriff; „Ansturm“ gibt das militärische Bild knapp und idiomatisch wieder.
- source_word: δυνάμεων
  choice: Streitkräfte
  rationale: Im militärischen Zusammenhang bezeichnet δυνάμεις Truppen oder Streitkräfte; die gewählte Wiedergabe bleibt allgemein wie das Griechische.
- source_word: ἐξέκλιναν
  choice: wichen ... zurück
  rationale: ἐκκλίνω bedeutet abweichen, sich abwenden oder ausweichen. Im Kampfzusammenhang drückt „zurückweichen“ die Bewegung natürlich aus, ohne eine vollständige Flucht zu behaupten.
- source_word: ἀπʼ αὐτῶν
  choice: vor ihnen
  rationale: Das pluralische Pronomen wird beibehalten und bezieht sich am ehesten auf die unmittelbar zuvor genannten Streitkräfte; „vor ihnen zurückweichen“ ist im Deutschen idiomatisch.
