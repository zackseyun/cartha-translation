  yaml_path: translation/deuterocanon/1_maccabees/006/045.yaml
  text: And he charged boldly into the middle of the phalanx[a], and kept killing right and left, and they were split apart before him on both sides.
translation:
  language: de
  text: Und mutig stürmte er auf ihn zu, mitten in die Phalanx[a] hinein; dabei tötete er rechts und links, und die Reihen wichen vor ihm nach beiden Seiten auseinander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schlachtreihe“ beziehungsweise „Kampfformation“.'
    reason: Der griechische Ausdruck φάλαγξ bezeichnet eine geschlossene militärische Formation; das Lehnwort „Phalanx“ bewahrt das konkrete Bild, kann aber erklärungsbedürftig sein.
lexical_decisions:
- source_word: ἐπέδραμεν
  choice: stürmte … hinein
  rationale: Das Verb bezeichnet hier einen kraftvollen, angriffsartigen Vorstoß und nicht bloß ein Hinlaufen.
- source_word: θράσει
  choice: mutig
  rationale: Der Dativ beschreibt die Art und Weise des Angriffs; „mutig“ ist natürlich und bewahrt den Gedanken des kühnen Vorgehens.
- source_word: εἰς μέσον τῆς φάλαγγος
  choice: mitten in die Phalanx hinein
  rationale: φάλαγξ bezeichnet eine geschlossene militärische Formation. „Phalanx“ erhält das konkrete militärische Bild.
- source_word: ἐθανάτου
  choice: tötete
  rationale: Der Imperfekt schildert die fortdauernde beziehungsweise wiederholte Handlung während des Vorstoßes; im Deutschen ergibt sich dieser Verlauf natürlich aus der Satzfolge und der Wendung „rechts und links“.
- source_word: δεξιὰ καὶ εὐώνυμα
  choice: rechts und links
  rationale: Die knappe deutsche Wendung gibt die idiomatische Bezeichnung beider Seiten treffend wieder.
- source_word: ἐσχίζοντο
  choice: die Reihen teilten sich
  rationale: Das passive Imperfekt beschreibt, wie die geschlossene Formation bei seinem Vordringen auseinanderwich. Das ergänzte „die Reihen“ macht den militärischen Bezug im Deutschen klar, ohne den Vorgang unnötig festzulegen.
- source_word: ἀπʼ αὐτοῦ
  choice: vor ihm
  rationale: Im Zusammenhang bezeichnet die Wendung das Auseinanderweichen der Formation angesichts seines Vorstoßes.
- source_word: ἔνθα καὶ ἔνθα
  choice: nach beiden Seiten
  rationale: Die Formulierung beschreibt hier eine Teilung beziehungsweise Bewegung in die eine und die andere Richtung; „nach beiden Seiten“ passt zum militärischen Zusammenhang.
