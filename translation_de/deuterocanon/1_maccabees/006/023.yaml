translation:
  language: de
  text: Recht[a] – und wirst du unsere Brüder rächen?[b] Wir sind bereit, deinem Vater zu dienen und nach dem zu leben, was er sagt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier überlieferte griechische Text setzt mitten im Satz ein; „Recht“ führt vermutlich einen Gedanken aus dem vorhergehenden Satzteil fort.
    reason: textual_variant
  - marker: b
    text: 'Oder: „und wirst unseren Brüdern Recht verschaffen?“ Das griechische Verb kann sowohl Vergeltung als auch das Durchsetzen von Recht bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und nach dem zu gehen, was von ihm gesagt wird“; gemeint ist, das eigene Leben danach auszurichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσιν
  choice: Recht
  rationale: Der überlieferte Text setzt mitten im Satz ein. „Recht“ bewahrt die mögliche gerichtliche Bedeutung von κρίσις, ohne die syntaktisch unvollständige Aussage unnötig zu ergänzen.
- source_word: ἐκδικήσεις
  choice: wirst … Vergeltung üben
  rationale: Das Verb bezeichnet das Durchsetzen von Recht beziehungsweise das Rächen erlittenen Unrechts. Die Wendung lässt den vergeltenden Aspekt erkennen, ohne eine rein private Rachehandlung zu unterstellen.
- source_word: τοὺς ἀδελφοὺς ἡμῶν
  choice: unsere Brüder
  rationale: Die konkrete Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung wird beibehalten; im Zusammenhang kann sie zugleich jüdische Volksgenossen oder Kampfgefährten meinen.
- source_word: εὐδοκοῦμεν
  choice: Wir sind bereit
  rationale: Im Zusammenhang drückt εὐδοκοῦμεν zustimmende Bereitschaft aus. „Wir sind bereit“ ist im modernen Deutschen natürlicher als „es gefällt uns“ und vermeidet die übermäßig emotionale Färbung von „wir dienen gern“.
- source_word: δουλεύειν
  choice: zu dienen
  rationale: Hier geht es um politische Unterordnung und Loyalität gegenüber einem Herrscher. „Dienen“ trifft den Zusammenhang, ohne die mögliche Grundbedeutung versklavter Abhängigkeit in den Vordergrund zu stellen.
- source_word: τῷ πατρί σου
  choice: deinem Vater
  rationale: Wörtliche und im Deutschen natürliche Wiedergabe des Dativobjekts.
- source_word: πορεύεσθαι
  choice: zu leben
  rationale: In Verbindung mit dem folgenden Dativ bezeichnet πορεύεσθαι die Lebensführung beziehungsweise das Verhalten nach bestimmten Vorgaben. „Leben“ gibt das Idiom im heutigen Deutsch verständlich wieder; die Wegmetapher wird in der Fußnote kenntlich gemacht.
- source_word: τοῖς ὑπʼ αὐτοῦ λεγομένοις
  choice: nach dem, was er sagt
  rationale: Die Formulierung bleibt nahe bei „den von ihm gesagten Dingen“, klingt aber natürlich. „Seinen Befehlen“ wäre enger und stärker als der griechische Wortlaut.
theological_decisions:
- issue: Bedeutung von ἐκδικέω
  choice: Vergeltung für unsere Brüder üben
  alternative: unseren Brüdern Recht verschaffen
  rationale: Das Griechische hält Vergeltung und Rechtverschaffung zusammen. Der Haupttext wahrt die kräftigere vergeltende Bedeutung, während die Fußnote die rechtliche Alternative ausdrücklich erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Versanfang bleibt bewusst unergänzt. „Nach dem leben, was er sagt“ vermittelt das griechische Wegmotiv idiomatisch; die wörtlichere Ausdrucksweise steht in der Fußnote.
