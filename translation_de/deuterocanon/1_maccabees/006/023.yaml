  naturalness: „Recht und wirst für unsere Brüder Vergeltung üben?“ ist im Deutschen wegen des fehlenden Subjekts und der unverbundenen Satzfragmente unnötig schwer lesbar. Ein Gedankenstrich zeigt den überlieferten Bruch an; „wirst du“ ergibt eine natürliche deutsche Fragesyntax. „Nach dem zu leben, was er sagt“ ist modernes, angemessen würdiges Deutsch.
  terminology: „Recht“, „unsere Brüder“, „bereit“, „dienen“ und „deinem Vater“ sind treffend. Die Fußnote zu ἐκδικέω bewahrt sachgerecht die Alternative „Recht verschaffen“ und legt keine konfessionelle oder übermäßig spezifische Deutung fest.
