  text: And the king was enraged when he heard it, and he gathered all his Friends, the commanders of his forces, and those over the reins.
translation:
  language: de
  text: Als der König davon hörte, wurde er zornig. Er versammelte alle seine Freunde[a], die Befehlshaber seiner Streitmacht und die, die über die Zügel gesetzt waren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit „Freunde“ ist hier wahrscheinlich ein offizieller Rang am königlichen Hof gemeint: besonders vertraute Ratgeber und Würdenträger des Königs.'
    reason: Verhindert, dass die Bezeichnung lediglich als private Freundschaft verstanden wird, ohne den Rang im Haupttext interpretierend festzulegen.
  - marker: b
    text: 'Wörtlich: „die über den Zügeln“. Gemeint sind wahrscheinlich Verantwortliche für Wagen und/oder eine berittene Abteilung; die genaue militärische Funktion bleibt unsicher.'
    reason: Bewahrt die konkrete Bildsprache des griechischen Ausdrucks und vermeidet eine nicht gesicherte Festlegung auf die Reiterei.
lexical_decisions:
- source_word: ὠργίσθη
  choice: wurde er zornig
  rationale: Gibt den ingressiven bzw. passivisch formulierten Sinn natürlich und würdig wieder, ohne die Stärke des Zorns unnötig zu steigern.
- source_word: τοὺς φίλους αὐτοῦ
  choice: seine Freunde
  rationale: „Freunde“ bezeichnet hier wahrscheinlich einen offiziellen Kreis königlicher Vertrauter; die wörtliche Benennung bleibt im Text erhalten und wird in einer Fußnote erläutert.
- source_word: ἄρχοντας δυνάμεως αὐτοῦ
  choice: die Befehlshaber seiner Streitmacht
  rationale: ἄρχοντες sind hier militärische Führer; δύναμις bezeichnet im Kontext die bewaffnete Streitmacht.
- source_word: τοὺς ἐπὶ τῶν ἡνιῶν
  choice: die Verantwortlichen für die Reiterei
  rationale: Die griechische Wendung lautet wörtlich „die über den Zügeln“. Im militärischen Zusammenhang ist wahrscheinlich die berittene Truppe gemeint; eine Fußnote bewahrt das konkrete Bild und die verbleibende Unsicherheit.
