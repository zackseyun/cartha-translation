  text: And they showed the elephants the blood of grapes and mulberries[a], to provoke them for battle.
translation:
  language: de
  text: Und sie zeigten den Elefanten den Saft von Weintrauben und Maulbeeren[a], um sie für den Kampf zu reizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Blut der Weintraube und der Maulbeeren«; gemeint ist ihr roter Saft.'
    reason: Die Fußnote bewahrt die anschauliche Metapher des griechischen Textes, während der Haupttext ihren konkreten Sinn verständlich wiedergibt.
lexical_decisions:
- source_word: ἔδειξαν
  choice: sie zeigten
  rationale: Das Verb bezeichnet hier schlicht das Vorzeigen; die Dativgruppe nennt die Elefanten als Empfänger.
- source_word: τοῖς ἐλέφασιν
  choice: den Elefanten
  rationale: Der griechische Dativ Plural lässt sich im Deutschen unmittelbar mit dem Dativ wiedergeben.
- source_word: αἷμα σταφυλῆς καὶ μόρων
  choice: den Saft von Weintrauben und Maulbeeren
  rationale: Wörtlich steht »Blut der Weintraube und der Maulbeeren«. Im Zusammenhang ist der rote Fruchtsaft gemeint. »Saft« macht den Sachbezug im Haupttext verständlich; die auffällige Blutmetapher bleibt in der Fußnote erhalten.
- source_word: τοῦ παραστῆσαι
  choice: um sie … zu reizen
  rationale: Der substantivierte Infinitiv mit τοῦ bezeichnet den Zweck. Im militärischen Zusammenhang geht es darum, die Elefanten anzuregen beziehungsweise kampfbereit zu machen.
- source_word: εἰς τὸν πόλεμον
  choice: für den Kampf
  rationale: Die Wendung bezeichnet hier die Ausrichtung auf den bevorstehenden Kampf und wird idiomatisch wiedergegeben.
