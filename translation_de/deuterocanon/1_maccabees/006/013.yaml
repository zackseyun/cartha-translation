  text: I know that because of these things these evils have come upon me[a], and
translation:
  language: de
  text: Ich habe erkannt, dass mich wegen dieser Dinge diese Übel getroffen haben, und[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der für diesen Vers bereitgestellte griechische Text ist unvollständig und endet mit „und“. Deshalb bleibt auch die Übersetzung an dieser Stelle unvollendet, ohne fehlende Wörter zu ergänzen.
