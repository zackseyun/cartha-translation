lexical_decisions:
- source_word: ἔδωκεν ἑαυτόν
  choice: gab sich selbst hin
  rationale: Gibt die freiwillige Selbsthingabe des griechischen Ausdrucks natürlich und würdig wieder.
- source_word: τοῦ σῶσαι
  choice: um … zu retten
  rationale: Der artikulierte Infinitiv bezeichnet hier den Zweck der Selbsthingabe.
- source_word: περιποιῆσαι αὐτῷ
  choice: sich … zu erwerben
  rationale: Bewahrt den Sinn von erlangen bzw. für sich gewinnen und gibt das rückbezügliche αὐτῷ im Deutschen idiomatisch wieder.
- source_word: ὄνομα αἰώνιον
  choice: einen ewigen Namen
  rationale: Nahe Wiedergabe des griechischen Ausdrucks für bleibenden Ruhm bzw. ein unvergängliches Andenken, ohne die Bildsprache aufzulösen.
theological_decisions:
- issue: Mögliche heilsgeschichtliche Anklänge der Selbsthingabe
  choice: Die Formulierung „gab sich selbst hin“ bleibt erhalten.
  alternative: „setzte sein Leben ein“
  rationale: Der griechische Wortlaut spricht ausdrücklich von Selbsthingabe; mögliche Anklänge werden weder verstärkt noch abgeschwächt.
