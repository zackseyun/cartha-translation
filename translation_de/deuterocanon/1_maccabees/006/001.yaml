base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/001.yaml
  text: And King Antiochus was traveling through the upper regions[a], and he heard that in Elymais, in Persia, there was a city renowned for wealth, silver, and gold;
translation:
  language: de
  text: König Antiochus zog durch die oberen Gebiete. Da hörte er, dass es in Elymaïs, in Persis,[a] eine Stadt gab, die wegen ihres Reichtums, ihres Silbers und ihres Goldes berühmt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Persien“. „Persis“ bezeichnet genauer die persische Landschaft beziehungsweise Provinz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: zog durch
  rationale: Das Imperfekt bezeichnet eine im Verlauf befindliche Bewegung durch ein Gebiet. „Zog durch“ gibt dies knapp und natürlich wieder.
- source_word: τὰς ἐπάνω χώρας
  choice: die oberen Gebiete
  rationale: Die räumliche Bezeichnung wird bewusst wörtlich bewahrt, ohne sie deutend als Binnenland, Hochland oder Osten festzulegen.
- source_word: Ἐλυμαΐς
  choice: Elymaïs
  rationale: Der griechische geografische Eigenname wird in einer im Deutschen verständlichen Transliteration wiedergegeben; das Trema zeigt die getrennte Aussprache der Vokale an.
- source_word: ἐν τῇ Περσίδι
  choice: in Persis
  rationale: Περσίς kann die historische Landschaft beziehungsweise Provinz Persis bezeichnen. Die spezifischere Form vermeidet eine vorschnelle Ausweitung auf ganz Persien.
- source_word: πόλις ἔνδοξος
  choice: eine Stadt … berühmt
  rationale: ἔνδοξος bezeichnet hier Bekanntheit oder Ansehen; „berühmt“ ist gegenwärtiges, klares Deutsch und vermeidet die moralische Nebenbedeutung von „ruhmreich“.
- source_word: πλούτῳ, ἀργυρίῳ, καὶ χρυσίῳ
  choice: für ihren Reichtum an Silber und Gold
  rationale: Die Dative nennen, wofür die Stadt bekannt war. Im Deutschen verbindet „Reichtum an Silber und Gold“ die allgemeine Wohlhabenheit idiomatisch mit den ausdrücklich genannten Edelmetallen, ohne eine unnatürliche Dreierliste zu erzeugen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht den fortlaufenden Erzählstil gut lesbar. Die geografisch offene Wendung „obere Gebiete“ bleibt erhalten; „Persis“ wird wegen der historischen Genauigkeit im Text verwendet und in der Fußnote erläutert.
