  text: And they also made engines against their engines[a], and they fought for many days.
translation:
  language: de
  text: Auch sie bauten Kriegsmaschinen[a] gegen deren Kriegsmaschinen und kämpften viele Tage lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Belagerungsmaschinen«. Das griechische Wort bezeichnet mechanische Vorrichtungen für den Krieg, besonders im Zusammenhang mit einer Belagerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηχανὰς
  choice: Kriegsmaschinen
  rationale: Im militärischen und belagerungstechnischen Zusammenhang bezeichnet μηχανή mechanische Vorrichtungen für den Kampf. »Kriegsmaschinen« ist im modernen Deutschen verständlich und bewahrt die Breite des griechischen Ausdrucks, ohne ihn auf einen bestimmten Gerätetyp festzulegen.
- source_word: πρὸς
  choice: um sie gegen … einzusetzen
  rationale: πρός mit Akkusativ drückt hier feindliche Ausrichtung aus. Die leicht entfaltete Formulierung vermeidet das im Deutschen schwerfällige »Maschinen gegen Maschinen machen« und erhält den Sinn der Gegenmaßnahme.
- source_word: ἐπολέμησαν
  choice: sie kämpften
  rationale: Die schlichte Wiedergabe entspricht dem erzählenden Aorist und dem allgemeinen Sinn des Verbs, ohne Art oder Umfang des Kampfes näher festzulegen.
- source_word: ἡμέρας πολλάς
  choice: viele Tage lang
  rationale: Der Akkusativ bezeichnet die Zeitdauer; »viele Tage lang« ist die natürliche deutsche Entsprechung.
- source_word: καὶ αὐτοὶ
  choice: Auch sie
  rationale: Die Wendung zeigt an, dass diese Seite ihrerseits entsprechende Geräte baute. »Auch sie« gibt die additive und leicht kontrastive Wirkung knapp wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion mit »um … einzusetzen« entfaltet die knappe griechische Gegenüberstellung nur so weit, wie es für einen natürlichen und eindeutigen deutschen Satz nötig ist.
