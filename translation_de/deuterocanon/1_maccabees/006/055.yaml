base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/055.yaml
  text: And Lysias heard that Philip[a], whom King Antiochus had appointed while he was still alive to bring up Antiochus his son so that he might reign,
translation:
  language: de
  text: Und Lysias erfuhr, dass Philippus, den König Antiochus noch zu seinen Lebzeiten dazu eingesetzt hatte, seinen Sohn Antiochus aufzuziehen, damit dieser als König herrschen sollte,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit dieser König werden sollte“. Das griechische βασιλεῦσαι kann sowohl das Herrschen als König als auch den Antritt der Königsherrschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: erfuhr
  rationale: Im Zusammenhang führt ἀκούω eine erhaltene Nachricht ein. „Erfuhr“ ist im modernen Deutschen natürlicher als das wörtlichere „hörte“ und bleibt sachlich zurückhaltend.
- source_word: κατέστησεν
  choice: dazu eingesetzt hatte
  rationale: καθίστημι bezeichnet hier die förmliche Übertragung einer Aufgabe. Das Plusquamperfekt macht deutlich, dass die Einsetzung dem Erfahren des Lysias vorausging.
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: noch zu seinen Lebzeiten
  rationale: Der Genitivus absolutus bezeichnet die Zeit, in der König Antiochus noch lebte. Die Formulierung ist knapp, gegenwärtig und ordnet den Bezug natürlich dem König zu.
- source_word: ἐκθρέψαι
  choice: aufzuziehen
  rationale: Das Verb bezeichnet das Großziehen beziehungsweise Erziehen eines Kindes, ohne Philipps Aufgabe unnötig auf Unterricht oder amtliche Vormundschaft festzulegen.
- source_word: εἰς τὸ βασιλεῦσαι αὐτόν
  choice: damit dieser als König herrschen sollte
  rationale: Die Konstruktion drückt Ziel oder beabsichtigtes Ergebnis aus. „Dieser“ beseitigt im Deutschen eine störende Pronomenmehrdeutigkeit, während „als König herrschen“ die Grundbedeutung von βασιλεύω wahrt.
- source_word: ὁ βασιλεὺς Ἀντίοχος
  choice: König Antiochus
  rationale: Die deutsche Titelform vor dem Eigennamen gibt die griechische Bezeichnung natürlich wieder.
