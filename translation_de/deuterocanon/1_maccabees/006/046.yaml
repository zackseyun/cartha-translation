  yaml_path: translation/deuterocanon/1_maccabees/006/046.yaml
  text: And he slipped in under the elephant[a], struck it from beneath, and killed it; and it fell to the ground on top of him, and he died there.
translation:
  language: de
  text: Er schlüpfte unter den Elefanten, griff ihn von unten an[a] und tötete ihn. Da stürzte der Elefant zu Boden und fiel auf ihn, und er starb dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stach ihn von unten“. Die griechische Wendung ὑπέθηκεν αὐτῷ ist hier nicht eindeutig; der Haupttext bezeichnet den von unten geführten Angriff, ohne die Art des Angriffs genauer festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσέδυσεν
  choice: schlüpfte
  rationale: Das Verb bezeichnet ein Hineingleiten oder Eindringen in einen engen Bereich. „Schlüpfte“ gibt die schnelle, gezielte Bewegung unter den Elefanten anschaulich und natürlich wieder.
- source_word: ὑπὸ τὸν ἐλέφαντα
  choice: unter den Elefanten
  rationale: Die räumliche Richtungsangabe wird unmittelbar und idiomatisch wiedergegeben.
- source_word: ὑπέθηκεν αὐτῷ
  choice: griff ihn von unten an
  rationale: Die idiomatische und textlich schwierige Wendung beschreibt im Zusammenhang einen von unten geführten Angriff. Die Übersetzung bewahrt diese Richtung, ohne eine im griechischen Wortlaut nicht ausdrücklich genannte Waffe festzulegen.
- source_word: ἀνεῖλεν αὐτόν
  choice: tötete ihn
  rationale: ἀναιρέω bedeutet hier eindeutig „töten“. Die moderne Formulierung ist klar und vermeidet altertümliches Deutsch.
- source_word: ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ
  choice: Da stürzte der Elefant über ihm zu Boden
  rationale: Die Wiedergabe erfasst sowohl den Sturz auf den Boden als auch die Lage über dem Mann. Das Subjekt „der Elefant“ wird zur eindeutigen Zuordnung wiederholt.
- source_word: ἀπέθανεν ἐκεῖ
  choice: er starb dort
  rationale: Die schlichte Schlussaussage folgt eng dem griechischen Text, ohne die zusätzliche Betonung „auf der Stelle“ einzutragen.
