  yaml_path: translation/deuterocanon/1_maccabees/006/041.yaml
  text: And all who heard the sound of their multitude, and the marching of the multitude, and the clashing of the weapons, were shaken; for the camp was exceedingly great and strong.
translation:
  language: de
  text: Alle, die das Getöse ihrer Menge, den Marsch der Menge und das Klirren der Waffen hörten, wurden erschüttert; denn das Heerlager war überaus groß und mächtig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσαλεύοντο
  choice: erbebten
  rationale: Das Imperfekt gibt die anhaltende Wirkung wieder; „erbebten“ bewahrt die starke körperlich-emotionale Erschütterung, ohne sie ausdrücklich als Angst oder Schrecken festzulegen.
- source_word: φωνῆς πλήθους αὐτῶν
  choice: das Getöse ihrer Menge
  rationale: φωνή bezeichnet hier den hörbaren Laut der großen Menschenmasse. „Getöse“ passt zum militärischen Zusammenhang und zur überwältigenden Geräuschkulisse.
- source_word: ὁδοιπορίας τοῦ πλήθους
  choice: das Marschieren der Truppen
  rationale: ὁδοιπορία bedeutet grundsätzlich Fortbewegung oder Reise, bezeichnet hier jedoch die Bewegung einer militärischen Menge. „Truppen“ macht den kontextuell eindeutigen Bezug natürlich verständlich.
- source_word: συγκρουσμοὺς τῶν ὅπλων
  choice: das Klirren der Waffen
  rationale: συγκρουσμός bezeichnet das Aneinanderschlagen. „Klirren“ gibt das dabei entstehende metallische Geräusch idiomatisch wieder; ὅπλα wird im militärischen Kontext mit „Waffen“ übersetzt.
- source_word: παρεμβολή
  choice: Heerlager
  rationale: Der Ausdruck kann „Lager“, „Heerlager“ oder auch die gelagerte Streitmacht bezeichnen. „Heerlager“ bewahrt den militärischen Sinn und lässt die mögliche Mitbedeutung der Streitmacht anklingen.
- source_word: μεγάλη σφόδρα καὶ ἰσχυρά
  choice: überaus groß und mächtig
  rationale: „Überaus“ gibt die Verstärkung durch σφόδρα wieder; „groß und mächtig“ bewahrt sowohl den gewaltigen Umfang als auch die Stärke des Heerlagers.
