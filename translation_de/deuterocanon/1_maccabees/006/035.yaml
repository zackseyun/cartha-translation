  text: And they divided the beasts among the units, and beside each elephant they stationed a thousand men in coats of mail, with bronze helmets on their heads, and five hundred picked horsemen assigned to each beast.
translation:
  language: de
  text: Und sie verteilten die Tiere[b] auf die Abteilungen[a]. Bei jedem Elefanten[c] stellten sie tausend Männer auf, die mit Kettenpanzern gerüstet waren und bronzene Helme auf dem Kopf trugen; außerdem waren jedem Tier fünfhundert ausgewählte Reiter zugeteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf die Formationen« beziehungsweise »auf die Einheiten«. Der griechische Ausdruck ist hier schwierig; im Zusammenhang ist wahrscheinlich eine militärische Bedeutung gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Tiere«; aus dem Zusammenhang geht hervor, dass Elefanten gemeint sind.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »für jeden Elefanten« beziehungsweise »an jedem Elefanten«. Die griechische Präposition lässt hier mehrere Deutungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεῖλον
  choice: sie verteilten
  rationale: Das Aoristverb bezeichnet hier das Aufteilen beziehungsweise taktische Verteilen der Tiere auf militärische Formationen.
- source_word: τὰ θηρία
  choice: die Tiere
  rationale: Dies gibt den griechischen Ausdruck wieder, ohne ihn vorzeitig mit »Elefanten« gleichzusetzen; der folgende Satzteil benennt die Tiere ausdrücklich als Elefanten.
- source_word: εἰς τὰς φάραγγας
  choice: auf die Abteilungen
  rationale: Der Ausdruck ist an dieser Stelle schwierig. Im militärischen Zusammenhang liegt eine Bedeutung wie Formationen oder Abteilungen nahe; »Abteilungen« ist verständlich und vermeidet einen möglicherweise zu technischen Begriff.
- source_word: παρέστησαν
  choice: stellten sie … auf
  rationale: Die Form bezeichnet im militärischen Zusammenhang das Aufstellen oder Stationieren von Männern.
- source_word: ἐφʼ ἑκάστῳ ἐλέφαντι
  choice: bei jedem Elefanten
  rationale: ἐπί mit Dativ kann unter anderem »bei«, »an« oder »auf« bedeuten. »Bei« passt zur beschriebenen taktischen Zuordnung, ohne zu unterstellen, die tausend Männer hätten sich auf dem Elefanten befunden.
- source_word: χιλίους ἄνδρας τεθωρακισμένους ἐν ἁλυσιδωτοῖς
  choice: tausend Männer …, die mit Kettenpanzern gerüstet waren
  rationale: Die Wiedergabe verbindet das allgemeine Gerüstetsein mit der ausdrücklich genannten kettenartigen Rüstung und klingt im Deutschen natürlich.
- source_word: περικεφαλαῖαι χαλκαῖ
  choice: bronzene Helme
  rationale: Direkte und im modernen Deutschen klare Bezeichnung der genannten Schutzausrüstung.
- source_word: διατεταγμένοι
  choice: zugeteilt
  rationale: Das Partizip beschreibt die geordnete taktische Zuordnung der Reiter zu jedem Tier.
- source_word: ἐκλελεγμένοι
  choice: ausgewählte
  rationale: Das Perfektpartizip bezeichnet eigens ausgewählte Reiter; »ausgewählte« ist präzise und idiomatisch.
