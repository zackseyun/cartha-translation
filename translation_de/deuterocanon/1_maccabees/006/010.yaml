base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/010.yaml
  text: And he called all his friends and said to them[a], “Sleep departs from my eyes[c][b], and my heart faints from anxiety.”
translation:
  language: de
  text: 'Und er rief alle seine Freunde[a] zusammen und sagte zu ihnen: »Der Schlaf weicht von meinen Augen[b], und vor Sorge sinkt mir das Herz[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle seine Vertrauten«; das griechische Wort für »Freunde« kann auch Angehörige des engeren Kreises eines Herrschers bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Bild kann auch wiedergegeben werden: »Der Schlaf ist von meinen Augen gewichen.«'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »und vor Sorge breche ich innerlich zusammen«; die griechische Wendung beschreibt ein Niedersinken oder Versagen im Herzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: rief … zusammen
  rationale: Das Verb kann »rufen« oder »zusammenrufen« bedeuten. Im Zusammenhang einer Ansprache an die gesamte Gruppe gibt »rief … zusammen« den Vorgang im natürlichen Deutschen klar wieder.
- source_word: πάντας τοὺς φίλους αὐτοῦ
  choice: alle seine Freunde
  rationale: φίλοι bedeutet unmittelbar »Freunde«, kann im hellenistischen Herrscherumfeld aber auch enge Vertraute oder Angehörige des inneren Kreises bezeichnen. Der Haupttext bewahrt die einfache Bezeichnung.
- source_word: Ἀφίσταται ἀπὸ τῶν ὀφθαλμῶν μου ὁ ὕπνος
  choice: Der Schlaf weicht von meinen Augen
  rationale: Die Wiedergabe erhält das anschauliche Bild und den Präsensaspekt von ἀφίσταται. Trotz ihres leicht gehobenen Klangs ist die Formulierung im Deutschen verständlich.
- source_word: συνέπεπτον τῇ καρδίᾳ
  choice: sinkt mir das Herz
  rationale: Die griechische Wendung bezeichnet ein inneres Niedersinken beziehungsweise Versagen des Herzens. »Mir sinkt das Herz« ist eine natürliche deutsche Entsprechung, die das Herzbild und die Niedergeschlagenheit bewahrt.
- source_word: ἀπὸ τῆς μερίμνης
  choice: vor Sorge
  rationale: μέριμνα bezeichnet Sorge, Bekümmernis oder Angst. In Verbindung mit dem sinkenden Herzen ist »vor Sorge« idiomatisch und gibt die Ursache wieder.
