  text: And he encamped against the sanctuary for many days[a], and there he set up missile-launchers and engines and fire-throwers and stone-throwers and scorpions, to shoot arrows and slingstones.
translation:
  language: de
  text: Und er schlug viele Tage lang sein Lager gegen das Heiligtum auf. Dort stellte er Geschosswerfer, Maschinen, Feuerwerfer, Steinwerfer und Skorpione[a] auf, um Pfeile und Schleudersteine abzuschießen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Skorpiongeschütze“; damit sind kleine militärische Geschosswerfer gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ τὸ ἁγίασμα
  choice: schlug … sein Lager gegen das Heiligtum auf
  rationale: παρεμβάλλω bezeichnet zunächst das Aufschlagen beziehungsweise Beziehen eines Lagers; ἐπί mit Akkusativ markiert hier die feindliche Ausrichtung auf das Heiligtum. Die Formulierung bewahrt sowohl die konkrete Lagerhandlung als auch den Belagerungskontext, ohne ein ausdrückliches Belagerungsverb einzuführen.
- source_word: ἡμέρας πολλάς
  choice: viele Tage lang
  rationale: Der temporale Akkusativ bezeichnet die Dauer; diese Wendung ist im modernen Deutschen natürlich.
- source_word: ἔστησεν
  choice: stellte … auf
  rationale: Das Verb bezeichnet hier das Aufstellen beziehungsweise Einrichten militärischer Geräte.
- source_word: βελοστασίσεις
  choice: Geschosswerfer
  rationale: Der seltene militärtechnische Ausdruck bezeichnet Vorrichtungen zum Abschießen von βέλη. „Geschosswerfer“ bleibt weiter als „Pfeilwerfer“ und legt die genaue Bauart nicht fest.
- source_word: μηχανὰς
  choice: Maschinen
  rationale: Der allgemeine Ausdruck für mechanische Vorrichtungen bleibt bewusst allgemein, wie im Griechischen.
- source_word: πυροβόλα
  choice: Feuerwerfer
  rationale: Die transparente Wiedergabe des Kompositums bezeichnet Geräte, die Feuer schleudern, ohne eine spätere Waffentechnik anzunehmen.
- source_word: λιθοβόλα
  choice: Steinwerfer
  rationale: Die wörtliche und verständliche Wiedergabe vermeidet eine unnötige Festlegung auf eine bestimmte Katapultbauart.
- source_word: σκορπίδια
  choice: Skorpione
  rationale: Der historische militärische Fachname wird beibehalten; eine Fußnote erklärt, dass kleine Geschützmaschinen gemeint sind.
- source_word: εἰς τὸ βάλλεσθαι
  choice: um … abzuschießen
  rationale: Die Konstruktion mit substantiviertem Infinitiv drückt den Zweck aus. Das Passiv beziehungsweise Medium wird im Deutschen zweckgemäß und natürlich aktiv wiedergegeben.
- source_word: βέλη
  choice: Pfeile
  rationale: βέλος kann allgemein ein Geschoss bezeichnen, meint in dieser Verbindung aber wahrscheinlich Pfeile oder Bolzen; „Pfeile“ ist die zugänglichste konkrete Wiedergabe.
- source_word: σφενδόνας
  choice: Schleudersteine
  rationale: Im Zusammenhang mit den abzuschießenden Gegenständen ist die Bedeutung „Schleudergeschosse/Schleudersteine“ wahrscheinlicher als „Schleudern“. Die konkrete Wiedergabe passt zur syntaktischen Funktion als Objekt.
