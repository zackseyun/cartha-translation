  text: And a few men were left in the sanctuary[a], because the famine had overpowered them; and they were scattered, each to his own place.
translation:
  language: de
  text: Und im Heiligtum[a] blieben nur wenige Männer zurück, denn der Hunger hatte sie überwältigt; und sie wurden zerstreut, jeder an seinen eigenen Ort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an der heiligen Stätte“ oder „in den heiligen Bezirken“. Wörtlich steht im Griechischen „in den heiligen [Dingen/Orten]“, eine auf den Tempel bezogene Bezeichnung für den heiligen Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθησαν
  choice: blieben … zurück
  rationale: Die passive Form bezeichnet den verbliebenen Rest. Im Deutschen gibt „blieben … zurück“ den Ergebnissinn natürlich wieder, ohne einen ausdrücklich handelnden Verursacher einzuführen.
- source_word: ἐν τοῖς ἁγίοις
  choice: im Heiligtum
  rationale: Der substantivierte Plural bezeichnet hier räumlich den heiligen Tempelbereich. „Im Heiligtum“ ist im Deutschen klar und idiomatisch; die wörtlichere Mehrzahl und mögliche räumliche Alternativen werden in der Fußnote bewahrt.
- source_word: ἄνδρες ὀλίγοι
  choice: nur wenige Männer
  rationale: „Männer“ erhält die ausdrücklich männliche Bezeichnung ἄνδρες; „nur wenige“ bringt die geringe Zahl und den Restgedanken natürlich zum Ausdruck.
- source_word: κατεκράτησεν αὐτῶν ὁ λιμός
  choice: der Hunger hatte sie überwältigt
  rationale: κατακρατέω bezeichnet das Erlangen von Gewalt oder Oberhand. „Überwältigt“ bewahrt die starke Personifikation; „Hunger“ passt hier besser als „Hungersnot“, da unmittelbar die geschwächten Männer betroffen sind.
- source_word: ἐσκορπίσθησαν
  choice: zerstreuten sie sich
  rationale: Die griechische Passivform beschreibt ihre Zerstreuung. Das reflexive deutsche Verb klingt in Verbindung mit den jeweils eigenen Zielen natürlich und lässt offen, ob äußerer Druck oder eigenes Fortgehen im Vordergrund steht.
- source_word: ἕκαστος εἰς τὸν τόπον αὐτοῦ
  choice: jeder an seinen eigenen Ort
  rationale: „Ort“ bleibt beim weiten Sinn von τόπος; „nach Hause“ würde das Ziel unnötig festlegen. „Seinen eigenen“ bewahrt die distributive Zuordnung.
theological_decisions:
- issue: Räumliche Bedeutung von ἐν τοῖς ἁγίοις
  choice: im Heiligtum
  alternative: an der heiligen Stätte / in den heiligen Bezirken
  rationale: Im militärischen Tempelkontext ist die Wendung räumlich und kultisch zu verstehen. Der Haupttext nennt verständlich das Heiligtum, während die Fußnote die grammatische Mehrdeutigkeit des substantivierten Plurals offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit; „So“ macht die im Kontext naheliegende Folge deutlich, ohne eine zusätzliche theologische Deutung einzutragen. Der Personenbezug bleibt ausdrücklich männlich, und das Ziel der Zerstreuung wird nicht zu „Heimat“ oder „Haus“ präzisiert.
