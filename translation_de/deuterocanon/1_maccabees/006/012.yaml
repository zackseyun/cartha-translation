base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/012.yaml
  text: 'But now I remember the evils that I did in Jerusalem: I took all the silver vessels and the gold vessels that were in it[a], and I sent orders to wipe out the inhabitants of Judah for nothing.'
translation:
  language: de
  text: 'Jetzt aber erinnere ich mich an die bösen Taten, die ich in Jerusalem begangen habe: Ich nahm alle silbernen und goldenen Geräte, die sich dort befanden, und gab den Befehl, die Bewohner von Judäa ohne Grund[a] auszurotten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „grundlos“; die griechische Wendung bezeichnet ein Handeln ohne hinreichenden Anlass oder Rechtfertigungsgrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμνήσκομαι
  choice: ich erinnere mich
  rationale: Das griechische Präsens bezeichnet die gegenwärtige Erinnerung; die deutsche Wendung ist natürlich und bewahrt den nachdenklichen Ton des Eingeständnisses.
- source_word: τῶν κακῶν ὧν ἐποίησα
  choice: an die bösen Taten, die ich … begangen habe
  rationale: κακά bezeichnet hier moralisch verwerfliche Handlungen. „Böse Taten“ gibt diesen ethischen Gehalt klarer wieder als das mögliche, aber schwächere „Unheil“.
- source_word: σκεύη
  choice: Geräte
  rationale: Im Zusammenhang mit der Plünderung des Tempels bezeichnet das Wort kultische Gegenstände beziehungsweise Gerätschaften. „Geräte“ ist im Deutschen dafür geläufig und konkret.
- source_word: τὰ ἀργυρᾶ καὶ τὰ χρυσᾶ
  choice: alle silbernen und goldenen Geräte
  rationale: Die koordinierten Adjektive beschreiben die aus Silber und Gold bestehenden Geräte; die zusammengezogene deutsche Form ist eindeutig und vermeidet schwerfällige Wiederholung.
- source_word: ἐξαπέστειλα τοῦ ἐξᾶραι
  choice: gab den Befehl, … auszurotten
  rationale: Das Verb des Aussendens mit dem finalen Infinitiv bezeichnet hier eine veranlasste Vernichtungsaktion. Die idiomatische deutsche Fassung macht den Befehlscharakter deutlich, ohne den Sprecher selbst als unmittelbaren Täter darzustellen.
- source_word: τοὺς κατοικοῦντας Ἰούδα
  choice: die Bewohner Judas
  rationale: Der substantivierte Partizipialausdruck bezeichnet die in der Landschaft Juda lebenden Menschen. „Bewohner Judas“ ist knapp und entspricht der regionalen Bezeichnung des griechischen Textes.
- source_word: διὰ κενῆς
  choice: ohne Grund
  rationale: Die idiomatische Wendung bezeichnet ein Handeln ohne hinreichenden Anlass oder Rechtfertigungsgrund. „Ohne Grund“ ist im heutigen Deutsch klarer als eine wörtliche Wiedergabe mit „Leere“ oder „vergeblich“.
theological_decisions:
- issue: Moralische Bewertung der Taten des Antiochus in seiner eigenen Rede
  choice: κακά wird als „böse Taten“ wiedergegeben.
  alternative: „Unrecht“ oder „schlimme Dinge“
  rationale: Der Sprecher erkennt nicht nur nachteilige Folgen oder politische Fehler, sondern die moralische Verwerflichkeit seines Handelns an. Die Übersetzung bewahrt dieses Gewicht, ohne darüber hinaus eine bestimmte Lehre über Reue oder Vergebung einzutragen.
- issue: Stärke der angedrohten Beseitigung der Bevölkerung
  choice: ἐξᾶραι wird mit „auszurotten“ wiedergegeben.
  alternative: „zu vertreiben“ oder „zu beseitigen“
  rationale: Im Zusammenhang mit den Bewohnern Judas bezeichnet das Verb eine vollständige, gewaltsame Entfernung. „Ausrotten“ erhält die Schärfe der Aussage, ohne sie abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem berichtenden Bekenntniston der griechischen Rede; kultische „Geräte“ und das starke Verb „ausrotten“ bewahren den konkreten historischen und moralischen Ernst.
