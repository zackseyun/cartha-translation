  yaml_path: translation/deuterocanon/1_maccabees/006/019.yaml
  text: And Judas decided to root them out[a], and he assembled all the people to besiege them.
translation:
  language: de
  text: Judas beschloss, sie zu beseitigen, und versammelte das ganze Volk, um sie zu belagern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „um sich rings um sie zu lagern“; die Wendung bezeichnet eine Belagerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογίσατο
  choice: beschloss
  rationale: Das Medium von λογίζομαι bezeichnet hier eine überlegte, gefasste Absicht; „beschloss“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: ἐξᾶραι
  choice: zu beseitigen
  rationale: ἐξαίρω bezeichnet hier das gewaltsame Entfernen der betreffenden Gegner. „Beseitigen“ bewahrt den feindseligen Sinn, ohne die Art oder das vollständige Ausmaß ihrer Vernichtung stärker festzulegen, als es der griechische Ausdruck tut.
- source_word: ἐξεκκλησίασεν
  choice: versammelte
  rationale: Das Verb bedeutet, Menschen zu einer Versammlung zusammenzurufen. Mit „das ganze Volk“ als Objekt ist „versammelte“ idiomatisch und präzise.
- source_word: πάντα τὸν λαόν
  choice: das ganze Volk
  rationale: Dies entspricht dem griechischen Wortlaut. Obwohl im Zusammenhang wohl die zum Kampf aufgebotene Gemeinschaft gemeint ist, wird λαός nicht auf „Heer“ verengt.
- source_word: τοῦ περικαθίσαι ἐπʼ αὐτούς
  choice: um sie zu belagern
  rationale: Der substantivierte Infinitiv bezeichnet den Zweck des Versammelns. Das wörtliche Sich-ringsum-Niederlassen ist hier ein militärischer Ausdruck für eine Belagerung.
