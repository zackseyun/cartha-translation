    text: 'Wörtlich: „sein Inder“. Gemeint ist wahrscheinlich der indische Führer oder Treiber des jeweiligen Elefanten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πύργοι ξύλινοι ὀχυροὶ
  choice: feste Holztürme
  rationale: πύργοι ξύλινοι bezeichnet hölzerne Turmaufbauten; ὀχυροί hebt ihre Festigkeit beziehungsweise Wehrhaftigkeit hervor. „Feste Holztürme“ ist verständlich und überbestimmt die Bauart nicht.
- source_word: σκεπαζόμενοι
  choice: überdacht
  rationale: Das Partizip bezeichnet ein Bedeckt- oder Überdachtsein. „Überdacht“ gibt dies bei turmartigen Aufbauten natürlich wieder, ohne eine genauere Konstruktion vorauszusetzen.
- source_word: ἐφʼ ἑκάστου θηρίου
  choice: je einer auf jedem Tier
  rationale: θηρίον ist hier wörtlich „Tier“; der Zusammenhang bezeichnet Kriegselefanten. Die Übersetzung bewahrt die generische Ausdrucksweise des Verses.
- source_word: ἐζωσμένοι ἐπʼ αὐτοῖς μηχαναῖς
  choice: die mit Vorrichtungen ausgerüstet waren
  rationale: ἐζωσμένοι kann ein Umgeben-, Befestigt- oder Ausgerüstetsein ausdrücken; μηχαναί sind technische beziehungsweise militärische Vorrichtungen. Die Formulierung wahrt die Unbestimmtheit der konkreten Geräte.
- source_word: ἄνδρες δύο καὶ τριάκοντα οἱ πολεμοῦντες
  choice: zweiunddreißig kämpfende Männer
  rationale: Die griechische Zahl lautet zweiunddreißig; das substantivierte Partizip kennzeichnet die Männer als Kämpfer.
- source_word: ὁ Ἰνδὸς αὐτοῦ
  choice: der dazugehörige Inder
  rationale: Wörtlich steht „sein/der zu ihm gehörende Inder“. Die Hauptübersetzung bewahrt diese auffällige Kürze; eine Fußnote erläutert die im Zusammenhang naheliegende Funktion als Elefantenführer.
