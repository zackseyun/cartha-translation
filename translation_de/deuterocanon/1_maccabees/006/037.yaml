translation:
  language: de
  text: Auf ihnen befanden sich feste, überdachte Holztürme, je einer auf jedem Tier; sie waren mit Vorrichtungen versehen. Auf jedem Tier befanden sich zweiunddreißig kämpfende Männer und sein Inder.[a]
