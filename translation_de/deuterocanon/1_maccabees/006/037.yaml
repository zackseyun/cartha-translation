  register: Moderne, würdige Standardsprache. Die Satzstruktur wurde für gutes Deutsch leicht gegliedert. „Tier“ bleibt entsprechend dem griechischen Wortlaut stehen; aus dem Zusammenhang sind Elefanten gemeint. Die ungewöhnliche Bezeichnung „der dazugehörige Inder“ wird nicht stillschweigend funktional aufgelöst, sondern in der Fußnote erläutert.
