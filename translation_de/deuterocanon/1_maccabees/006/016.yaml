  source_fidelity: Die Wiedergabe von ἐκθρέψαι als „aufzuziehen“ und von ἀπέθανεν/ἐκεῖ als „starb dort“ ist treffend. βασιλεύειν bezeichnet jedoch das Herrschen bzw. Regieren als König, nicht primär das Königwerden; „damit er König würde“ verschiebt den Sinn leicht auf den Erwerb des Königstitels.
  naturalness: „ihn aufzuziehen, damit er als König herrsche“ ist modernes, gut lesbares Standarddeutsch und lässt den fragmentarischen Anschluss an den vorigen Vers bestehen. „König Antiochus starb dort im hundertneunundvierzigsten Jahr“ ist natürlich und würdevoll.
  terminology: „König“ und „herrsche“ geben die königliche Terminologie angemessen wieder. Die Jahresangabe ist korrekt als Seleukidenjahr wiedergegeben, ohne eine im griechischen Text nicht ausdrücklich vorhandene Ärenbezeichnung einzutragen.
