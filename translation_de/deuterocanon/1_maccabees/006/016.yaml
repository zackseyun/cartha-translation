lexical_decisions:
- source_word: ἐκθρέψαι
  choice: aufzuziehen
  rationale: Das Verb bezeichnet hier das Aufziehen beziehungsweise Erziehen eines jungen Nachfolgers. „Aufzuziehen“ ist im Deutschen natürlich und bleibt nah am griechischen Ausdruck.
- source_word: βασιλεύειν
  choice: damit er König würde
  rationale: Das Verb bezeichnet das Königsein beziehungsweise königliche Herrschen. Die finale Formulierung gibt die knappe griechische Verbindung im Deutschen verständlich wieder, ohne über die Thronfolge hinaus zusätzliche Aussagen einzutragen.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Die schlichte Todesaussage wird direkt und ohne beschönigenden Ausdruck wiedergegeben.
- source_word: ἐκεῖ
  choice: dort
  rationale: Direkte und natürliche Wiedergabe des Ortsadverbs.
- source_word: ἔτους ἐνάτου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: im hundertneunundvierzigsten Jahr
  rationale: Die griechische Ordnungszahl wird als chronologische Jahresangabe klar und idiomatisch wiedergegeben.
