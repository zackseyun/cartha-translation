  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich, ohne das archaische »Siehe« zu verwenden. Die Übersetzung wahrt bei ἀπόλλυμαι die Spannung zwischen allgemeinem Zugrundegehen und konkretem Sterben; die mögliche höfische Fachbedeutung von φίλος wird nicht in den Haupttext eingetragen, sondern sachlich erläutert.
