base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/014.yaml
  text: Look[a], I am perishing in great grief in a foreign land. And he called Philip, one of his friends[b], and appointed him over all his kingdom.
translation:
  language: de
  text: »Sieh! Ich gehe in großer Trauer in einem fremden Land zugrunde.«[a] Und er rief Philippus, einen seiner Freunde,[b] und setzte ihn über sein ganzes Königreich ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sieh! Ich sterbe in großer Trauer in einem fremden Land.« Das griechische Wort kann sowohl »zugrunde gehen« als auch »sterben« bedeuten; der Ausdruck für »Trauer« kann auch mit »Kummer« oder »Bedrängnis« wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: »Einer seiner Freunde« kann hier auch einen höfischen Titel für einen königlichen Vertrauten oder Hofbeamten bezeichnen, nicht nur einen persönlichen Freund.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sieh doch
  rationale: Die Wendung bewahrt den eindringlichen Hinweischarakter, klingt im modernen Deutschen jedoch natürlicher als das altertümliche »Siehe«.
- source_word: ἀπόλλυμαι
  choice: ich gehe … zugrunde
  rationale: Die Form kann Untergang oder Sterben bezeichnen. »Zugrunde gehen« erhält diese Bedeutungsbreite, während der Zusammenhang den nahenden Tod erkennen lässt.
- source_word: λύπῃ μεγάλῃ
  choice: in großer Trauer
  rationale: Die Wiedergabe folgt der Dativkonstruktion und bringt die starke seelische Betrübnis zum Ausdruck, ohne sie als eindeutige Ursache des Sterbens festzulegen.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: in einem fremden Land
  rationale: Dies ist eine klare, idiomatische Wiedergabe des Aufenthalts außerhalb des eigenen Landes und bewahrt den Beiklang der Fremde.
- source_word: ἐκάλεσεν
  choice: rief
  rationale: Das Verb bezeichnet hier, dass Philippus herbeigerufen wurde; »rief« bleibt nah am Griechischen, ohne zusätzliche zeremonielle Einzelheiten einzutragen.
- source_word: Φίλιππον
  choice: Philippus
  rationale: Der griechische Personenname wird in der im Deutschen für biblisch-hellenistische Namen üblichen Form wiedergegeben.
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: einen seiner Freunde
  rationale: Die Grundbedeutung von φίλος bleibt im Haupttext erhalten; eine mögliche Verwendung als höfischer Rangtitel wird in einer Fußnote erläutert.
- source_word: κατέστησεν
  choice: setzte … ein
  rationale: Im Zusammenhang bezeichnet das Verb die formelle Übertragung einer Leitungsstellung. »Einsetzen« ist natürlich und bildet den offiziellen Vorgang angemessen ab.
- source_word: ἐπὶ πάσης τῆς βασιλείας αὐτοῦ
  choice: über sein ganzes Königreich
  rationale: Die Formulierung bezeichnet Zuständigkeit oder Autorität über das gesamte Reich und entspricht der griechischen Konstruktion knapp und verständlich.
