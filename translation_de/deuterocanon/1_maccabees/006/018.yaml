    issue: „trachteten ihm unablässig nach Bösem“
    rationale: Diese Wendung ist im heutigen Standarddeutsch unidiomatisch und missverständlich. ζητοῦντες κακὰ bezeichnet das fortgesetzte Anstreben bzw. Zufügen von Unheil; „suchten ihm ... Böses zuzufügen“ erhält diese Bedeutung klar.
