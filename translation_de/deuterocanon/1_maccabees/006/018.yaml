  yaml_path: translation/deuterocanon/1_maccabees/006/018.yaml
  text: He named him Eupator[a]. And those from the citadel were hemming Israel in around the sanctuary[b], seeking evil continually and serving as a support to the nations.
translation:
  language: de
  text: Er gab ihm den Namen Eupator. Diejenigen aus der Zitadelle hielten Israel rings um das Heiligtum[a] eingeschlossen, suchten ihm fortwährend Böses zuzufügen und waren den Völkern[b] eine Stütze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rings um die heiligen Stätten“. Das Griechische hat wörtlich den Plural „die heiligen Dinge/Stätten“ und meint wahrscheinlich den Bereich des Heiligtums.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Heiden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ
  choice: Er gab ihm den Namen
  rationale: Die griechische Namensformel wird idiomatisch und zugleich bedeutungsnah wiedergegeben.
- source_word: Εὐπάτωρ
  choice: Eupator
  rationale: Der Personenname beziehungsweise Beiname wird in gebräuchlicher deutscher Form transliteriert.
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: die Leute aus der Zitadelle
  rationale: ἄκρα bezeichnet hier die befestigte Zitadelle Jerusalems; „Leute“ gibt die nicht näher bestimmte Personengruppe ohne unnötige Geschlechtsfestlegung wieder.
- source_word: συγκλείοντες ... κύκλῳ
  choice: hielten ... rings ... eingeschlossen
  rationale: Die Formulierung bewahrt sowohl das Umschließen beziehungsweise Bedrängen als auch die räumliche Angabe „ringsum“.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Der kollektive Singular des griechischen Textes bleibt erhalten.
- source_word: κύκλῳ τῶν ἁγίων
  choice: rings um das Heiligtum
  rationale: Im Kontext bezeichnet τὰ ἅγια wahrscheinlich den Tempel- oder Heiligtumsbereich; eine Fußnote hält die Mehrdeutigkeit des substantivierten Plurals offen.
- source_word: ζητοῦντες κακὰ
  choice: trachteten ihm ... nach Bösem
  rationale: Die Wendung bringt die anhaltende feindliche Absicht zum Ausdruck und ist im Deutschen verständlich, ohne den Inhalt des Bösen näher festzulegen.
- source_word: διʼ ὅλου
  choice: unablässig
  rationale: Das Idiom bezeichnet ein fortwährendes, beharrliches Handeln.
- source_word: στήριγμα τοῖς ἔθνεσιν
  choice: waren den Völkern eine Stütze
  rationale: στήριγμα bedeutet Stütze oder Rückhalt; der Dativ wird natürlich mit „den Völkern“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von ἔθνεσιν
  choice: Völkern
  alternative: Heiden
  rationale: Der Ausdruck ist hier vor allem ethnisch-politisch auf die fremden Mächte bezogen. „Völker“ bewahrt den breiteren Sinn, während „Heiden“ als mögliche kontextuelle Deutung in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Fortgang, wird aber durch finite Verben natürlich lesbar gemacht. Die räumliche und lexikalische Mehrdeutigkeit von τῶν ἁγίων sowie die mögliche Wiedergabe von ἔθνεσιν werden nicht stillschweigend vereindeutigt.
