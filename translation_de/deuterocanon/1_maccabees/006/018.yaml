  source_fidelity: 'Die Wiedergabe trifft den griechischen Sinn im Wesentlichen. Allerdings ist „trachteten ihm ... nach Bösem“ keine natürliche oder semantisch klare deutsche Entsprechung von ζητοῦντες κακὰ: Das Dativpronomen „ihm“ ist im Griechischen nicht ausgedrückt, und die deutsche Konstruktion lässt „Böses“ fälschlich wie das erstrebte Ziel statt wie beabsichtigtes Unheil wirken. „suchten ihm fortwährend Böses zuzufügen“ gibt die feindliche Absicht klar und ohne sachliche Erweiterung wieder.'
  naturalness: Der übrige Text ist modernes, würdiges Standarddeutsch. „Die Leute aus der Zitadelle“ ist verständlich, aber „Diejenigen aus der Zitadelle“ ist etwas textnäher und im Register eines historischen Erzähltexts angemessener. Die revidierte Formulierung verbindet die Partizipien flüssig.
  terminology: „Eupator“, „Zitadelle“, „Israel“, „Heiligtum“ und „Völkern“ sind sachgerecht. Die Fußnote zu τῶν ἁγίων bewahrt die Plural- und Bereichsbedeutung angemessen; die Fußnote zu ἔθνεσιν bietet „Heiden“ lediglich als Alternative an und legt keine theologische Deutung fest.
  issues:
