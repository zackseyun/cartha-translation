  text: And Judas and his camp advanced into battle formation, and six thousand men from the king’s camp fell.
translation:
  language: de
  text: Und Judas und sein Heer rückten in Schlachtordnung heran, und aus dem Heer des Königs fielen sechstausend Mann.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισεν
  choice: rückten … heran
  rationale: Das Verb bedeutet wörtlich „sich nähern/herankommen“. Zusammen mit εἰς παράταξιν gibt „in Schlachtordnung heranrücken“ die militärische Bewegung in natürlichem Deutsch wieder.
- source_word: παρεμβολὴ
  choice: Heer
  rationale: παρεμβολή kann ein Lager oder, metonymisch, die dort versammelte Streitmacht bezeichnen. Da Judas und die Seinen in Schlachtordnung heranrücken und auf beiden Seiten Gefallene genannt werden, ist „Heer“ im Deutschen hier idiomatischer als „Lager“.
- source_word: εἰς παράταξιν
  choice: in Schlachtordnung
  rationale: Die Wendung bezeichnet die geordnete Aufstellung zum Kampf. „In Schlachtordnung“ bewahrt den konkreten militärischen Sinn.
- source_word: ἔπεσαν
  choice: fielen
  rationale: „Fielen“ erhält das griechische Kampfidiom und legt den Tod der Männer nicht ausdrücklicher fest als der Ausgangstext.
- source_word: ἑξακισχίλιοι ἄνδρες
  choice: sechstausend Mann
  rationale: Die feste deutsche Mengenangabe „sechstausend Mann“ entspricht dem griechischen Ausdruck und passt zum militärischen Zusammenhang, ohne ausdrücklich „Soldaten“ einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper militärischer Erzählweise. Der zweimalige Gebrauch von παρεμβολή wird einheitlich mit „Heer“ wiedergegeben; die Koordination des griechischen Satzes bleibt erhalten.
