base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/040.yaml
  text: And part of the king’s camp spread out over the high mountains[a], and some over the lowlands; and they advanced securely and in formation.
translation:
  language: de
  text: Ein Teil des Heereslagers des Königs breitete sich über die hohen Berge aus, andere Truppen über das tiefer gelegene Gelände[a]. Sie rückten sicher und in geordneter Formation vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „andere über die niedrigen Stellen“. Das Griechische stellt die hohen Berge dem tiefer gelegenen Gelände gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάθη
  choice: breitete sich … aus
  rationale: Das passive Aoristverb bezeichnet hier die räumliche Ausdehnung beziehungsweise Aufstellung eines Truppenteils über das Gelände; die deutsche Wendung ist natürlich und bewahrt dieses Bild.
- source_word: μέρος τι
  choice: ein Teil
  rationale: Die Verbindung bezeichnet einen nicht näher bestimmten Anteil und wird im Deutschen knapp und idiomatisch wiedergegeben.
- source_word: παρεμβολῆς
  choice: Heereslager
  rationale: Im militärischen Zusammenhang kann das Wort sowohl das Lager als auch die dort versammelte Streitmacht bezeichnen. „Heereslager“ wahrt den Grundsinn und lässt erkennen, dass die Truppen gemeint sind.
- source_word: ἐπὶ τὰ ὑψηλὰ ὄρη
  choice: über die hohen Berge
  rationale: ἐπί mit Akkusativ beschreibt hier die Ausdehnung über ein Gelände; „hohe Berge“ entspricht der ausdrücklichen topografischen Bezeichnung.
- source_word: τινες ἐπὶ τὰ ταπεινά
  choice: andere Truppen über das tiefer gelegene Gelände
  rationale: Das substantivierte ταπεινά bezeichnet im Gegensatz zu den hohen Bergen niedrigere Stellen oder tieferes Gelände. „Andere Truppen“ macht den elliptischen Personenbezug im Deutschen verständlich.
- source_word: ἤρχοντο
  choice: sie rückten … vor
  rationale: Im militärischen Erzählzusammenhang bezeichnet das Imperfekt die fortschreitende Bewegung der Streitkräfte; „vorrücken“ ist dafür idiomatisch.
- source_word: ἀσφαλῶς
  choice: sicher
  rationale: Das Adverb bezeichnet ein gesichertes, ungefährdetes oder zuverlässiges Vorgehen, ohne zwischen diesen Nuancen unnötig zu entscheiden.
- source_word: τεταγμένως
  choice: in geordneter Formation
  rationale: Das Adverb beschreibt militärisch geordnetes Vorgehen. Die Formulierung verbindet die Idee der Ordnung mit der konkreten Truppenaufstellung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Heereslager“ hält die Verbindung zum griechischen Ausdruck für Lager beziehungsweise Heeresmacht aufrecht; „andere Truppen“ löst die griechische Ellipse nur so weit auf, wie es für klares Deutsch nötig ist.
