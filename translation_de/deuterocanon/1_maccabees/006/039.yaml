  yaml_path: translation/deuterocanon/1_maccabees/006/039.yaml
  text: And when the sun flashed on the golden shields, the mountains flashed from them and shone like torches of fire.
translation:
  language: de
  text: Als nun die Sonne auf den goldenen Schilden funkelte, erglänzten davon die Berge und leuchteten wie Feuerfackeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιλβεν
  choice: funkelte / erglänzten
  rationale: Das Verb bezeichnet helles Glänzen oder Funkeln. Im Deutschen vermeidet die leichte Variation eine schwerfällige Wiederholung, während das wiederholte griechische Bild gewahrt bleibt.
- source_word: χρυσᾶς ἀσπίδας
  choice: goldenen Schilden
  rationale: Die direkte und natürliche Wiedergabe lässt wie das Griechische offen, ob die Schilde massiv golden oder lediglich mit Gold versehen waren.
- source_word: τὰ ὄρη
  choice: die Berge
  rationale: ὄρη bezeichnet hier am unmittelbarsten Berge und bewahrt die Größe des Landschaftsbildes.
- source_word: ἀπʼ αὐτῶν
  choice: davon
  rationale: Das knappe deutsche Wort gibt wieder, dass der Glanz der Berge von den Schilden ausging, ohne den Vorgang ausdrücklich als Reflexion auszudeuten.
- source_word: κατήγαζεν
  choice: leuchteten
  rationale: Das Verb beschreibt ein Ausstrahlen oder Leuchten; der Plural richtet sich im natürlichen deutschen Satz weiterhin auf die Berge.
- source_word: ὡς λαμπάδες πυρός
  choice: wie Feuerfackeln
  rationale: Die kompakte Zusammensetzung ist anschaulich und in modernem Deutsch natürlicher als das semitisch klingende „Fackeln aus Feuer“.
