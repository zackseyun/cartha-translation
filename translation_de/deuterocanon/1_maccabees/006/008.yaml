  yaml_path: translation/deuterocanon/1_maccabees/006/008.yaml
  text: And it happened that when the king heard these words[a], he was astonished and greatly shaken; and he fell upon his bed and became sick from grief, because it had not happened for him as he had planned.
translation:
  language: de
  text: Als der König diese Worte hörte, war er bestürzt und zutiefst erschüttert. Er fiel auf sein Lager und wurde vor Kummer krank, weil es für ihn nicht so gekommen war, wie er es beabsichtigt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie er es sich gedacht hatte“.'
    reason: Lexikalische Alternative für ἐνεθυμεῖτο; die Wendung kann sowohl eine Absicht als auch eine Erwartung oder innere Vorstellung bezeichnen.
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσεν
  choice: 'Und es geschah: Als … hörte'
  rationale: Die erzählerische Übergangsformel bleibt erkennbar, während der Doppelpunkt die semitisch geprägte Wendung in natürlichem modernem Deutsch lesbar macht.
- source_word: ἐθαμβήθη
  choice: war er bestürzt
  rationale: Das Verb bezeichnet ein starkes Erstaunen oder Erschrecken. Im Zusammenhang mit der schlechten Nachricht gibt „bestürzt“ den schockartigen Eindruck wieder, ohne ausdrücklich Entsetzen vorauszusetzen.
- source_word: ἐσαλεύθη σφόδρα
  choice: zutiefst erschüttert
  rationale: Die bildliche innere Erschütterung von σαλεύω und die Verstärkung durch σφόδρα werden in einer natürlichen deutschen Wendung bewahrt.
- source_word: ἔπεσεν ἐπὶ τὴν κοίτην
  choice: Er fiel auf sein Lager
  rationale: Die konkrete Bewegung des griechischen Textes bleibt erhalten. „Lager“ ist würdevoll und kann Bett oder Ruheplatz bezeichnen, ohne die Szene unnötig festzulegen.
- source_word: ἐνέπεσεν εἰς ἀρρωστίαν
  choice: wurde … krank
  rationale: Die griechische Wendung beschreibt den Eintritt in einen Krankheitszustand; die deutsche Formulierung gibt dies klar und idiomatisch wieder.
- source_word: ἀπὸ τῆς λύπης
  choice: vor Kummer
  rationale: ἀπό hat hier kausale Bedeutung. „Vor Kummer krank werden“ ist im Deutschen natürlich und bewahrt den Zusammenhang zwischen seelischem Leid und Krankheit.
- source_word: οὐκ ἐγένετο αὐτῷ
  choice: es für ihn nicht so gekommen war
  rationale: Die unpersönliche Struktur des Griechischen bleibt weitgehend erhalten und klingt zugleich idiomatisch.
- source_word: καθὼς ἐνεθυμεῖτο
  choice: wie er es beabsichtigt hatte
  rationale: ἐνθυμέομαι kann hier das im Sinn Gehabte, Beabsichtigte oder Geplante ausdrücken. „Beabsichtigt“ bewahrt diese Bedeutungsbreite besser als das stärker festlegende „geplant“.
