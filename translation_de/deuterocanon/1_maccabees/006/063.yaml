  text: And he departed in haste and returned to Antioch, and he found Philip in control of the city, and he fought against him and took the city by force.
translation:
  language: de
  text: Und er brach in aller Eile auf und kehrte nach Antiochia zurück. Dort fand er Philippus über die Stadt herrschen. Er kämpfte gegen ihn und nahm die Stadt mit Gewalt ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν κατὰ σπουδήν
  choice: brach in aller Eile auf
  rationale: ἀπῆρεν bezeichnet den Aufbruch vom bisherigen Ort; κατὰ σπουδήν fügt Eile und Dringlichkeit hinzu. Die deutsche Wendung gibt beides natürlich und prägnant wieder.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: kehrte nach Antiochia zurück
  rationale: Die Verbindung bezeichnet die Rückkehr nach Antiochia; „zurückkehren“ wahrt die Richtungs- und Rückkehrbedeutung idiomatisch.
- source_word: εὗρεν Φίλιππον κυριεύοντα τῆς πόλεως
  choice: fand er Philippus als Herrn der Stadt vor
  rationale: κυριεύω bezeichnet hier tatsächliche Herrschaft oder Verfügungsgewalt über die Stadt. „als Herrn der Stadt“ bleibt nahe an der Herrschaftsaussage, ohne Philippus ausdrücklich einen Königstitel zuzuschreiben.
- source_word: ἐπολέμησεν πρὸς αὐτόν
  choice: Er kämpfte gegen ihn
  rationale: πολεμέω bezeichnet bewaffneten Kampf oder Kriegführung; die schlichte Formulierung passt zum knappen Erzählstil.
- source_word: κατελάβετο τὴν πόλιν βίᾳ
  choice: nahm die Stadt mit Gewalt ein
  rationale: καταλαμβάνω hat im militärischen Zusammenhang den Sinn des Einnehmens oder Eroberns; βίᾳ nennt ausdrücklich den Einsatz von Gewalt.
