base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/056.yaml
  text: he turned back from Persia and Media[a], and the forces that had gone with the king are with him, and that he is seeking to take over the conduct of affairs;
translation:
  language: de
  text: dass er aus Persien und Medien zurückgekehrt war und dass die Truppen, die mit dem König gezogen waren, bei ihm sind[a], und dass er danach strebt, die Führung der Staatsgeschäfte zu übernehmen;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut dieses Satzteils ist syntaktisch schwierig, besonders die Verbindung von „die Truppen, die mit dem König gezogen waren“ und „bei ihm“. Die Übersetzung bleibt nahe beim Wortlaut der Swete-Ausgabe nach dem Codex Vaticanus und glättet die Unklarheit nicht über den Textbefund hinaus.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: zurückgekehrt war
  rationale: Das Verb bezeichnet hier die Rückkehr aus einem Gebiet. Das deutsche Plusquamperfekt fügt sich in den berichteten Zusammenhang ein, in dem von einer zuvor erfolgten Rückkehr die Rede ist.
- source_word: ἀπὸ τῆς Περσίδος καὶ Μηδίας
  choice: aus Persien und Medien
  rationale: ἀπό bezeichnet den Ausgangspunkt der Rückkehr; „aus“ ist bei Ländern und Regionen die natürliche deutsche Entsprechung.
- source_word: αἱ δυνάμεις
  choice: die Truppen
  rationale: Im militärischen Erzählzusammenhang bezeichnet δυνάμεις die Streitkräfte; „Truppen“ ist präzise und allgemein verständlich.
- source_word: αἱ πορευθεῖσαι τῷ βασιλεῖ μετʼ αὐτοῦ
  choice: die mit dem König gezogen waren, bei ihm waren
  rationale: Die überlieferte Wortfolge mit τῷ βασιλεῖ und μετʼ αὐτοῦ ist syntaktisch schwierig. Die Wiedergabe erhält sowohl die Verbindung zum König als auch die Aussage, dass die Truppen bei dem genannten Mann waren, ohne die genaue Beziehung stärker festzulegen, als der Text erlaubt.
- source_word: ζητεῖ
  choice: danach strebte
  rationale: Das Präsens beschreibt ein fortdauerndes Bestreben; wegen der abhängigen vergangenen Erzählung steht im Deutschen idiomatisch das Präteritum.
- source_word: παραλαβεῖν
  choice: zu übernehmen
  rationale: Im politischen Zusammenhang bedeutet das Verb, die Verantwortung oder Kontrolle an sich zu nehmen, nicht lediglich etwas zu empfangen.
- source_word: τὰ τῶν πραγμάτων
  choice: die Führung der Staatsgeschäfte
  rationale: Die Wendung bezeichnet die Leitung der öffentlichen beziehungsweise politischen Angelegenheiten. „Führung der Staatsgeschäfte“ gibt diesen Sinn in natürlichem, würdigem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist als abhängiger Satzteil wiedergegeben, entsprechend dem einleitenden ὅτι des größeren Zusammenhangs. Die schwer verständliche Truppenklausel wurde nur so weit ergänzt, wie es für einen grammatischen deutschen Satz nötig ist; ihre echte syntaktische Unschärfe wird in der Fußnote offengelegt.
