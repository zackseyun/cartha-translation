  yaml_path: translation/deuterocanon/1_maccabees/006/036.yaml
  text: These were there beforehand[a], wherever the beast might be; and wherever it went, they went with it and did not leave it.
translation:
  language: de
  text: Diese waren im Voraus dort, wo immer sich das Tier[a] befand; und wohin es auch ging, gingen sie mit und wichen nicht von seiner Seite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das wilde Tier“; im Zusammenhang ist ein Elefant gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Diese
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten Männer. „Diese“ erhält die knappe Ausdrucksweise des Griechischen, ohne ein nicht ausdrücklich genanntes Substantiv einzufügen.
- source_word: πρὸ καιροῦ
  choice: im Voraus
  rationale: Die Wendung bezeichnet eine vorherige Positionierung oder Bereitschaft. „Im Voraus“ gibt den zeitlichen Sinn natürlich und prägnant wieder.
- source_word: οὗ ἂν ᾖ
  choice: wo immer sich … befand
  rationale: Die Verbindung mit ἄν bildet einen unbestimmten Relativsatz. „Wo immer“ bewahrt den offenen, wiederholten Sinn; das deutsche Präteritum fügt sich in die Erzählzeit ein.
- source_word: τὸ θηρίον
  choice: das Tier
  rationale: θηρίον bezeichnet hier das Tier, das nach dem Zusammenhang ein Elefant ist. „Tier“ bleibt nahe am griechischen Ausdruck, ohne den konkreten Bezug in den Haupttext einzutragen.
- source_word: ἐπορεύετο … ἐπορεύοντο ἅμα
  choice: wohin es auch ging, gingen sie mit
  rationale: Die wiederholte, koordinierte Bewegung wird in natürlichem Deutsch wiedergegeben. „Mitgehen“ erfasst ἅμα, ohne die militärisch stärker gefärbte Bedeutung „marschieren“ hinzuzufügen.
- source_word: οὐκ ἀφίσταντο ἐπʼ αὐτοῦ
  choice: wichen nicht von seiner Seite
  rationale: Die Formulierung drückt aus, dass die Männer beim Tier blieben und sich nicht von ihm entfernten. Die deutsche Wendung ist idiomatisch und bewahrt diesen räumlichen Sinn.
