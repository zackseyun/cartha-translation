  yaml_path: translation/deuterocanon/1_maccabees/006/006.yaml
  text: And Lysias marched at first with a strong force[a], but was driven back before them, and they grew strong by means of the weapons that they had taken from the camps they had cut down.
translation:
  language: de
  text: Und Lysias zog zunächst mit einer starken Streitmacht aus, wurde aber von ihnen zurückgeschlagen. Sie erstarkten durch die Waffen, die sie aus den Lagern genommen hatten, die sie vernichtet hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie behaupteten sich mit den Waffen, die sie aus den Lagern genommen hatten, die sie zerschlagen hatten.“ Das griechische Verb kann sowohl „erstarken“ als auch „sich behaupten/obsiegen“ bedeuten. Auch der letzte Relativsatz ist in militärischer Sprache stark verkürzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: zog … aus
  rationale: Im militärischen Zusammenhang bezeichnet das Verb den Aufbruch beziehungsweise Vormarsch mit einer Streitmacht; „zog aus“ ist im Deutschen natürlich und wahrt den erzählerischen Charakter.
- source_word: δυνάμει ἰσχυρᾷ
  choice: mit einer starken Streitmacht
  rationale: δύναμις bezeichnet hier eine militärische Truppe oder Streitmacht, nicht bloß abstrakte Macht.
- source_word: ἐν πρώτοις
  choice: zunächst
  rationale: Die Wendung kennzeichnet die anfängliche Phase des berichteten Feldzugs und bereitet den Gegensatz zum folgenden Rückschlag vor.
- source_word: ἀνετράπη ἀπὸ προσώπου αὐτῶν
  choice: wurde aber vor ihnen zurückgeschlagen
  rationale: Die passive Verbform beschreibt im Kampf ein Zurückwerfen oder Vertreiben; „vor ihnen“ erhält zugleich das räumliche Bild von ἀπὸ προσώπου αὐτῶν.
- source_word: ἴσχυσαν
  choice: sie erstarkten
  rationale: Das Verb kann sowohl ein Erstarken als auch ein Obsiegen bezeichnen. „Erstarkten“ passt zum instrumentalen Dativ der erbeuteten Waffen, ohne die mögliche Erfolgsbedeutung völlig auszuschließen.
- source_word: ὅπλοις
  choice: durch die Waffen
  rationale: Der instrumentale Dativ bezeichnet die Waffen als Mittel ihres Erstarkens.
- source_word: παρεμβολῶν
  choice: Lagern
  rationale: παρεμβολή bezeichnet in diesem militärischen Zusammenhang Heerlager beziehungsweise Feldlager.
- source_word: ἐξέκοψαν
  choice: vernichtet hatten
  rationale: Das Verb bedeutet wörtlich „herausschneiden/abhauen“ und kann militärisch das Niedermachen oder Vernichten bezeichnen. Da sich das Relativpronomen grammatisch auf die Lager bezieht, ist „vernichtet“ im Deutschen verständlich, während die gedrängte Ausdrucksweise in der Fußnote erläutert wird.
