translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem historischem Erzählton. Das einleitende „im“ und das Semikolon bewahren den fragmentarischen Anschluss an den vorausgehenden Satz; die militärischen Fachbegriffe bleiben anschaulich, ohne den griechischen Text unnötig zu präzisieren.
