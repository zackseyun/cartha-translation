lexical_decisions:
- source_word: ἔτους πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: im hundertfünfzigsten Jahr
  rationale: Die griechische Genitivformel bezeichnet idiomatisch das 150. Jahr; die ausgeschriebene Ordinalzahl passt zum würdevollen Erzählstil.
- source_word: ἐποίησεν
  choice: er baute
  rationale: ποιέω bedeutet allgemein „machen“ oder „herstellen“; bei Kriegsgeräten ist „baute“ im Deutschen natürlich und sachlich passend.
- source_word: ἐπʼ αὐτούς
  choice: gegen sie
  rationale: ἐπί mit Akkusativ bezeichnet hier im feindlichen militärischen Zusammenhang die Ausrichtung gegen die Belagerten.
- source_word: βελοστασίεις
  choice: Wurfgeschütze
  rationale: Das Wort bezeichnet Vorrichtungen zum Abschießen von Geschossen, ohne zwingend einen einzelnen Geschütztyp festzulegen. „Wurfgeschütze“ ist verständlich und vermeidet die Überpräzisierung „Katapulte“.
- source_word: μηχανάς
  choice: Belagerungsmaschinen
  rationale: Das allgemeinere μηχαναί bezeichnet im gegebenen militärischen Zusammenhang technische Geräte für eine Belagerung.
