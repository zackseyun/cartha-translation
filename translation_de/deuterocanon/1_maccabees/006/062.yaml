  text: And the king entered Mount Zion[a], and when he saw the fortification of the place[b], he broke the oath that he had sworn and gave orders to tear down the wall all around.
translation:
  language: de
  text: Und der König zog auf den Berg Zion. Als er die Befestigungsanlage des Ortes sah, brach er den Eid, den er geschworen hatte,[a] und befahl, die Mauer ringsum niederzureißen, und riss sie nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „setzte er den Eid, den er geschworen hatte, außer Kraft“; das griechische Verb kann das Aufheben, Missachten oder Verletzen einer bindenden Verpflichtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: zog auf
  rationale: Bei einem Berg bezeichnet εἰσέρχομαι hier das Hinein- bzw. Hinaufziehen in das Gebiet; „zog auf den Berg Zion“ ist im Deutschen natürlich und wahrt die erzählerische Bewegung.
- source_word: τὸ ὄρος Σιών
  choice: den Berg Zion
  rationale: Die etablierte deutsche geografische Bezeichnung für ὄρος Σιών.
- source_word: τὸ ὀχύρωμα τοῦ τόπου
  choice: die Befestigungsanlage des Ortes
  rationale: ὀχύρωμα bezeichnet eine befestigte Anlage oder ein Bollwerk. „Befestigungsanlage“ gibt den militärisch-baulichen Sinn wieder, ohne eine bestimmte Bauform vorauszusetzen.
- source_word: ἠθέτησεν
  choice: brach
  rationale: In Verbindung mit einem geschworenen Eid bezeichnet das Verb dessen Missachtung oder Verletzung; „den Eid brechen“ ist die klare und idiomatische deutsche Wendung.
- source_word: τὸν ὁρκισμὸν ὃν ὤμοσεν
  choice: den Eid, den er geschworen hatte
  rationale: Bewahrt sowohl das Substantiv als auch den Relativsatz; das Plusquamperfekt macht die zeitliche Vorordnung im Deutschen deutlich.
- source_word: ἐνετείλατο καὶ καθεῖλεν
  choice: befahl, … niederzureißen
  rationale: Die koordinierte griechische Formulierung beschreibt in diesem Zusammenhang den angeordneten Abriss. Die deutsche Infinitivkonstruktion gibt dies natürlich wieder, ohne zu behaupten, der König habe die Mauer eigenhändig abgerissen.
- source_word: τὸ τεῖχος κυκλόθεν
  choice: die Mauer ringsum
  rationale: τεῖχος ist die Mauer; κυκλόθεν bezeichnet ihren Umfang beziehungsweise die Zerstörung ringsherum.
theological_decisions:
- issue: Moralische Tragweite von ἠθέτησεν beim Eid
  choice: brach er den Eid
  alternative: setzte er den Eid außer Kraft / missachtete er den Eid
  rationale: „Den Eid brechen“ erhält die ethische Schwere der Verletzung einer bindenden Zusage, ohne zusätzliche theologische Wertung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem historischem Erzählstil. Die Satzteilung vermeidet eine schwerfällige Reihung; sachliche und moralische Spannung des griechischen Textes bleiben erhalten.
