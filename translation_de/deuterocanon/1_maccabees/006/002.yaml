  yaml_path: translation/deuterocanon/1_maccabees/006/002.yaml
  text: and that the temple in it was exceedingly rich[a], and that there were gold coverings there, and breastplates and weapons, which Alexander son of Philip, the Macedonian king, who first reigned over the Greeks, had left there.
translation:
  language: de
  text: und dass der Tempel in ihr überaus reich war und sich dort goldene Überzüge[a], Brustpanzer und Waffen befanden, die Alexander, der Sohn Philipps, der makedonische König, der als Erster über die Griechen herrschte, dort zurückgelassen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „goldene Bedeckungen“. Das griechische Wort bezeichnet lediglich Gegenstände aus Gold, die etwas bedecken, ohne ihre genaue Form anzugeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: Tempel
  rationale: Hier bezeichnet das Wort den Tempel beziehungsweise das Heiligtum in der Stadt; „Tempel“ ist im Deutschen die natürliche und kontextgerechte Wiedergabe.
- source_word: πλούσιον σφόδρα
  choice: überaus reich
  rationale: Die Wiedergabe bewahrt die starke Intensivierung durch σφόδρα und klingt zugleich würdig und natürlich.
- source_word: καλύμματα χρυσᾶ
  choice: goldene Überzüge
  rationale: καλύμματα bezeichnet allgemein Gegenstände, die etwas bedecken. „Überzüge“ wahrt diese Unbestimmtheit, ohne eine konkrete Form wie Vorhänge oder Schleier vorauszusetzen.
- source_word: θώρακες
  choice: Brustpanzer
  rationale: Das Wort bezeichnet konkret den den Oberkörper schützenden Teil einer Rüstung; „Brustpanzer“ ist präziser als das allgemeinere „Rüstungen“.
- source_word: ὅπλα
  choice: Waffen
  rationale: Im Zusammenhang mit Brustpanzern bezeichnet ὅπλα militärische Ausrüstung, hier verständlich und knapp als „Waffen“ wiedergegeben.
- source_word: κατέλειπεν
  choice: zurückgelassen hatte
  rationale: Das Plusquamperfekt fügt Alexanders frühere Handlung natürlich in den berichteten Zusammenhang ein; „zurückgelassen“ gibt das Verb klar wieder.
- source_word: Ἀλέξανδρος ὁ τοῦ Φιλίππου
  choice: Alexander, der Sohn Philipps
  rationale: Die griechische patronymische Wendung wird in natürlichem modernem Deutsch ausdrücklich als Abstammungsangabe wiedergegeben.
- source_word: ὁ βασιλεὺς ὁ Μακεδών
  choice: der makedonische König
  rationale: Die appositionelle Bezeichnung identifiziert Alexander sowohl als König als auch als Makedonen; die gewählte Form ist idiomatisch.
- source_word: ὃς ἐβασίλευσεν τοῖς Ἕλλησι πρῶτος
  choice: der als Erster über die Griechen herrschte
  rationale: Die Wendung wahrt den Dativ als Herrschaftsbezug und gibt πρῶτος ausdrücklich wieder, ohne die historische Aussage zu erklären oder abzuschwächen.
