revisions:
- from: Die übrige Reiterei stellte er auf beiden Seiten an den beiden Flanken des Heerlagers auf. Die Reiter schwangen drohend ihre Waffen[a] und schirmten sich in den Schlachtreihen ab.[b]
  to: Die übrige Reiterei stellte er auf beiden Seiten an den beiden Flanken des Heerlagers auf, wobei sie drohend ihre Waffen schwangen[a] und sich in den Phalangen zusammenschlossen.[b]
  rationale: Die Revision ersetzt die zu spezifische Schutzhandlung durch eine im militärischen Kontext naheliegende, aber nicht übermäßig technische Formationsbeschreibung. Zugleich wird φάλαγξ mit „Phalangen“ beibehalten und die verbleibende lexikalische Unsicherheit in einer sachlich formulierten Fußnote offengelegt. Die Ergänzung „Waffen“ bleibt als aus dem Kontext erschlossene, ausdrücklich markierte Verdeutlichung erhalten.
