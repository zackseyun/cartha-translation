translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste lange griechische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert; „Die Reiter“ nimmt den kollektiven Ausdruck „die Reiterei“ auf. Die schwierigen Partizipien werden handlungsbezogen wiedergegeben, ihre genuine Unsicherheit aber in den Fußnoten offengelegt.
