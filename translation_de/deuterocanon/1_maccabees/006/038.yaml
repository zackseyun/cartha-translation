  yaml_path: translation/deuterocanon/1_maccabees/006/038.yaml
  text: And he stationed the remaining cavalry on both sides[a], at the two flanks of the camp[b], brandishing and fully armed in the phalanxes.
translation:
  language: de
  text: Die übrige Reiterei stellte er auf beiden Seiten an den beiden Flanken des Heerlagers auf, wobei sie drohend ihre Waffen schwangen[a] und sich in den Phalangen zusammenschlossen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht kein Gegenstand dabei: „drohend schwingend“. Gemeint sein können ihre Waffen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort ist an dieser Stelle schwierig. Es kann das Schließen oder Ordnen der Formation bezeichnen; auch Deutungen im Sinn von Bewaffnen, Schützen oder Verbarrikadieren wurden erwogen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἐπίλοιπον ἵππον
  choice: die übrige Reiterei
  rationale: ἵππος bezeichnet im militärischen Zusammenhang kollektiv die Reiter beziehungsweise die Reiterei; die kollektive Wiedergabe ist im Deutschen natürlich.
- source_word: ἔνθεν καὶ ἔνθεν
  choice: auf beiden Seiten
  rationale: Die Wendung bezeichnet hier die Verteilung auf die eine und die andere Seite.
- source_word: ἐπὶ τὰ δύο μέρη τῆς παρεμβολῆς
  choice: an den beiden Flanken des Heerlagers
  rationale: παρεμβολή kann ein Heerlager oder ein Heer bezeichnen. Im Zusammenhang der Aufstellung gibt „Heerlager“ den räumlichen Bezug wieder; τὰ δύο μέρη wird militärisch sinnvoll als „die beiden Flanken“ gefasst.
- source_word: κατασείοντες
  choice: schwangen drohend ihre Waffen
  rationale: Das Partizip bezeichnet ein heftiges oder drohendes Schwingen; der im Griechischen unausgesprochene Gegenstand wird aus dem militärischen Zusammenhang als „Waffen“ ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: καταφρασσόμενοι
  choice: schirmten sich ab
  rationale: Die mediale Form kann das Sichdecken, Sichschützen oder Verbarrikadieren ausdrücken. Hier passt eine Schutzhandlung innerhalb der Schlachtreihen, ohne das schwierige Wort auf bloßes Bewaffnetsein festzulegen.
- source_word: ἐν ταῖς φάλαγξιν
  choice: in den Schlachtreihen
  rationale: φάλαγγες bezeichnet die geschlossenen militärischen Formationen. „Schlachtreihen“ ist verständlich und bewahrt den Formationsbezug.
