  source_fidelity: Die Aufstellung der übrigen Reiterei auf beiden Seiten an den zwei Seiten des Heerlagers ist zutreffend wiedergegeben. „schirmten sich ab“ legt für καταφρασσόμενοι jedoch eine Schutz- bzw. Deckungshandlung fest, die der schwierige militärische Ausdruck nicht sicher verlangt; im Kontext ist das Schließen bzw. Verdichten der Formation näherliegend. Die implizite Ergänzung „ihre Waffen“ zu κατασείοντες ist als idiomatische Verdeutlichung vertretbar, sofern sie kenntlich bleibt.
  naturalness: „Die Reiter“ nach „die übrige Reiterei“ ist verständlich, aber die Aufteilung in zwei Sätze lockert die enge Verknüpfung der griechischen Partizipien mit der Aufstellung. Ein Satz mit „wobei“ ist im modernen Standarddeutsch natürlich und bildet den Zusammenhang klarer ab. „in den Phalangen“ ist als militärischer Fachausdruck verständlich und genauer als das allgemeinere „in den Schlachtreihen“.
  terminology: „Reiterei“ und „Heerlager“ passen zum militärischen Kontext. „Phalangen“ bewahrt den technischen Charakter von φάλαγξ. Für καταφρασσόμενοι sollte keine bestimmte Deutung wie Schutzsuchen oder volles Bewaffnetsein als Haupttext festgelegt werden; „sich in den Phalangen zusammenschließend“ gibt die kontextuell naheliegende Formationshandlung wieder und lässt die Unsicherheit in der Anmerkung transparent.
