lexical_decisions:
- source_word: ἀπαγγέλλων
  choice: berichtete
  rationale: Das Partizip bezeichnet das Überbringen einer Nachricht; im Deutschen ergibt die finite koordinierte Form einen natürlichen, klaren Satz.
- source_word: εἰς τὴν Περσίδα
  choice: nach Persien
  rationale: 'Die Richtungsangabe gehört am natürlichsten zum Kommen des Boten: Er kam zu ihm nach Persien.'
- source_word: παρεμβολαί
  choice: Heerlager
  rationale: Das Wort kann militärische Lager und metonymisch die dort versammelten Streitkräfte bezeichnen. „Heerlager“ bewahrt das konkrete griechische Bild, ohne es vorschnell zu „Truppen“ zu verallgemeinern.
- source_word: τετρόπωνται
  choice: geschlagen worden waren
  rationale: Das Perfekt Passiv von τροπόω bezeichnet eine militärische Niederlage bzw. Flucht. „Geschlagen“ ist im Deutschen idiomatisch und wahrt den militärischen Sinn.
- source_word: γῆν Ἰούδα
  choice: das Land Juda
  rationale: Die Formulierung gibt den territorialen Bezug des Eigennamens Juda unmittelbar wieder.
