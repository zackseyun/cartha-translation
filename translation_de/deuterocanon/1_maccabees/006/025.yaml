base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/025.yaml
  text: They were being put to death[a], and our inheritances were being plundered. And they stretched out their hand not only against us, but also against all their territories.
translation:
  language: de
  text: Sie wurden getötet, und unsere Erbgüter wurden geplündert. Sie streckten ihre Hand nicht nur gegen uns aus, sondern auch gegen alle ihre Gebiete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen alle ihre Grenzen« beziehungsweise »gegen alle ihre Grenzgebiete«. Das griechische Wort kann sowohl Grenzlinien als auch die von ihnen umschlossenen Gebiete bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθανατοῦντο
  choice: sie wurden getötet
  rationale: Das Imperfekt Passiv bezeichnet ein andauerndes oder wiederholtes Geschehen in der Vergangenheit. Die deutsche Passivform bewahrt die Perspektive des griechischen Textes, ohne durch einen Zusatz wie »fortwährend« stärker zu präzisieren als die Vorlage.
- source_word: κληρονομίαι
  choice: Erbgüter
  rationale: »Erbgüter« bezeichnet ererbten Besitz und bewahrt damit den familiären beziehungsweise angestammten Sinn von κληρονομίαι besser als das allgemeinere »Besitzungen«.
- source_word: διηρπάζοντο
  choice: wurden geplündert
  rationale: Das Verb bezeichnet gewaltsames Rauben oder Plündern. Die Passivform gibt Form und Verlauf des griechischen Imperfekts angemessen wieder.
- source_word: ἐξέτειναν χεῖρα
  choice: streckten ihre Hand … aus
  rationale: Die weitgehend formale Wiedergabe erhält das Bild feindseligen Handelns; die Verbindung mit »gegen« macht die Bedeutung im Deutschen verständlich.
- source_word: ὅρια
  choice: Gebiete
  rationale: ὅρια kann sowohl Grenzlinien als auch die durch sie bestimmten Gebiete bezeichnen. »Gebiete« ist im Satz natürlich und vermeidet die sachlich mögliche, hier aber weniger klare Vorstellung eines Angriffs auf bloße Grenzlinien.
- source_word: αὐτῶν
  choice: ihre
  rationale: Das Possessivpronomen gibt den Plural αὐτῶν formal wieder. Da sein genauer Bezug im vorliegenden Satzausschnitt nicht eindeutig ist, wird er nicht erläuternd aufgelöst.
