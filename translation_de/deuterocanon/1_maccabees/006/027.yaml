base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/027.yaml
  text: And if he does not get ahead of them quickly[a], they will do greater things than these[b], and he will not be able to restrain them.
translation:
  language: de
  text: Und wenn er ihnen nicht rasch zuvorkommt[a], werden sie Größeres tun als dies[b], und er wird sie nicht zurückhalten können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie nicht rasch überholt“ oder „ihnen nicht rasch zuvor handelt“; das griechische Verb bezeichnet ein Handeln, durch das man anderen zuvorkommt oder sie überholt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Größeres als dies“; im Zusammenhang können schwerwiegendere oder umfangreichere Taten gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλάβῃ
  choice: ihnen … zuvorkommt
  rationale: Das Verb bezeichnet hier ein vorzeitiges Eingreifen, durch das man anderen zuvorkommt oder ihre Pläne vereitelt. „Zuvorkommen“ bewahrt diesen Gedanken, ohne eine bloße Verfolgung oder ein bestimmtes militärisches Manöver vorauszusetzen.
- source_word: διὰ τάχους
  choice: rasch
  rationale: Die Wendung drückt Eile und unverzügliches Handeln aus; „rasch“ ist knapp, natürlich und würdig.
- source_word: μείζονα τούτων
  choice: noch Größeres … als dies
  rationale: Die Übersetzung bewahrt den wörtlichen Vergleich mit „größer“, während der Zusammenhang offenlässt, ob schwerwiegendere oder umfangreichere Taten gemeint sind.
- source_word: κατασχεῖν
  choice: in Schach halten
  rationale: Der Infinitiv bezeichnet hier das Zurückhalten beziehungsweise Unter-Kontrolle-Halten. „In Schach halten“ passt zum politisch-militärischen Zusammenhang und klingt im modernen Deutsch natürlich.
- source_word: αὐτῶν
  choice: sie
  rationale: Der griechische Genitiv hängt von κατασχεῖν ab und wird im Deutschen idiomatisch als Akkusativobjekt wiedergegeben.
- source_word: οὐ δυνήσεται
  choice: er wird … nicht mehr … können
  rationale: Der Futur drückt eine kommende Unfähigkeit aus. Das kontextuell naheliegende „mehr“ verdeutlicht die dann verlorene Möglichkeit, ohne die Grundbedeutung zu verändern.
