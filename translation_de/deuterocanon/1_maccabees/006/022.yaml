  source_fidelity: 'Die Übersetzung gibt den überlieferten griechischen Wortlaut vollständig wieder: καὶ ἐπορεύθησαν πρὸς τὸν βασιλέα („Sie gingen zum König“) und die unvollständige direkte Frage Ἕως πότε οὐ ποιήσεις. „Wie lange willst du nichts unternehmen?“ bildet die vorwurfsvolle, auf ausbleibendes Handeln zielende Frage idiomatisch ab, ohne ein im vorliegenden Text nicht erhaltenes Objekt zu ergänzen. Die Auslassungspunkte bewahren den textlichen Abbruch.'
