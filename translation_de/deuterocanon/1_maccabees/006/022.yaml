  text: And they went to the king and said[b][a], “How long will you not act…?”
translation:
  language: de
  text: 'Sie gingen zum König und sagten: „Wie lange willst du nichts unternehmen …?“[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier vorliegende griechische Text dieses Verses bricht nach der Frage „Wie lange willst du nichts unternehmen …?“ ab. Die Auslassungspunkte kennzeichnen diesen Abbruch der Textgrundlage.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: „Wie lange wirst du nicht tun …?“ Das griechische Verb kann allgemein „tun“ oder „handeln“ bedeuten; wegen des abgebrochenen Satzes bleibt offen, was der König tun soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: gingen
  rationale: Der Aorist von πορεύομαι bezeichnet hier schlicht die Bewegung zum König; „gingen“ ist im erzählenden Zusammenhang natürlich und genau.
- source_word: πρὸς τὸν βασιλέα
  choice: zum König
  rationale: πρός mit Akkusativ bezeichnet die Bewegung zu einer Person hin, hier offenbar zur Audienz oder Beschwerde.
- source_word: Ἕως πότε
  choice: Wie lange
  rationale: Die feste Wendung drückt eine dringliche Klage über anhaltendes Ausbleiben aus; „Wie lange“ ist die natürliche deutsche Entsprechung.
- source_word: οὐ ποιήσεις
  choice: willst du nichts unternehmen
  rationale: ποιέω ist breit und kann „tun“ oder „handeln“ bedeuten. Da im vorliegenden Text kein Objekt folgt, gibt „etwas unternehmen“ den Ruf nach Eingreifen idiomatisch wieder, ohne dessen Inhalt festzulegen; wegen der deutschen Verneinungsstellung lautet die natürliche Form „nichts unternehmen“.
