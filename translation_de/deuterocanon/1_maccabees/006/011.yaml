base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/011.yaml
  text: And I said in my heart, ‘Into what distress I have come, and into a great סער? now I am in it—though I was kind and beloved.’
translation:
  language: de
  text: 'Und ich sagte mir: »In welche Bedrängnis bin ich geraten und in welch gewaltigen Sturm, in dem ich mich jetzt befinde! Denn ich war gütig und geliebt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ
  choice: ich sagte mir
  rationale: Die griechische Wendung lautet wörtlich »ich sagte zum Herzen«; die gewählte deutsche Form gibt den idiomatischen Sinn als inneres Selbstgespräch natürlich wieder.
- source_word: ἕως τίνος θλίψεως ἦλθον
  choice: in welche Bedrängnis bin ich geraten
  rationale: Bewahrt den Ausruf über das erreichte Ausmaß der Not und klingt im modernen Deutschen natürlich.
- source_word: κλύδωνος μεγάλου
  choice: welch gewaltigen Sturm
  rationale: κλύδων bezeichnet eine heftige Woge, Brandung oder einen Sturm und wird hier bildlich für die überwältigende Not gebraucht.
- source_word: χρηστὸς
  choice: gütig
  rationale: Gibt die hier auf eine Person bezogene Bedeutung »gut, freundlich, wohlwollend« wieder, ohne sie unnötig zu spezifizieren.
- source_word: ἀγαπώμενος
  choice: beliebt
  rationale: Das Partizip bedeutet »geliebt«; im Zusammenhang einer öffentlichen Person bringt »beliebt« den sozialen Sinn idiomatisch zum Ausdruck.
theological_decisions:
- issue: Verhältnis des letzten Satzes zur gegenwärtigen Not
  choice: Denn ich war gütig und beliebt.
  alternative: Obwohl ich gütig und beliebt war.
  rationale: ὅτι ist regulär kausal und wird daher mit »denn« wiedergegeben. Die mögliche Spannung zwischen der behaupteten früheren Güte und der gegenwärtigen Not wird nicht durch eine konzessive Umdeutung aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das innere Selbstgespräch wird idiomatisch formuliert; die Sturmmetapher und die kausale Spannung des griechischen Textes bleiben erhalten.
