revisions:
- from: Und er einigte sich mit den Leuten in Bet-Zur, und sie zogen aus der Stadt aus, denn sie hatten dort keinen Proviant, um darin eingeschlossen zu bleiben, weil das Land ein Sabbatjahr hatte.[a]
