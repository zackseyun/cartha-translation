    text: 'Wörtlich: »weil für das Land Sabbat war«; gemeint ist das Sabbatjahr, in dem das Land brachlag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν μετὰ τῶν ἐκ Βεθσούρων
  choice: er einigte sich mit den Leuten in Bet-Zur
  rationale: Die Wendung bezeichnet im militärischen Zusammenhang eine Einigung beziehungsweise Vereinbarung. „Einigte sich mit“ ist natürlich und vermeidet das unbestimmte „verfuhr mit“.
- source_word: ἐξῆλθε ἐκ τῆς πόλεως
  choice: sie zogen aus der Stadt aus
  rationale: Obwohl das griechische Verb formal im Singular steht, bezieht sich der Vorgang dem Zusammenhang und dem folgenden Pluralpronomen zufolge auf die Einwohner beziehungsweise Verteidiger von Bet-Zur. Die deutsche Pluralform macht diesen naheliegenden Bezug verständlich, ohne eine Kapitulation ausdrücklich hineinzulesen.
- source_word: διατροφή
  choice: Proviant
  rationale: Im Kontext einer Belagerung bezeichnet das Wort die zum Unterhalt nötigen Vorräte, besonders Nahrung. „Proviant“ trifft diesen praktischen Sinn prägnant.
- source_word: τοῦ συνκλεισθαι ἐν αὐτῇ
  choice: um darin eingeschlossen zu bleiben
  rationale: Die Formulierung gibt den fortdauernden Zustand des Eingeschlossenseins in der belagerten Stadt wieder.
- source_word: σάββατον ἦν τῇ γῇ
  choice: weil das Land ein Sabbatjahr hatte
  rationale: Gemeint ist der Ruhezeitraum des Landes im siebten Jahr. „Sabbatjahr“ verhindert eine Verwechslung mit dem wöchentlichen Sabbat; die wörtliche Bildsprache wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Deutung von σάββατον ἦν τῇ γῇ
  choice: das Land hatte ein Sabbatjahr
  alternative: es war Sabbat für das Land
  rationale: Der Zusammenhang erklärt den Mangel an Vorräten durch das landwirtschaftliche Ruhejahr. Die Übersetzung macht den wahrscheinlichen historischen Bezug verständlich, während die Fußnote die wörtlichere Form bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ortsname wird in der im Deutschen gebräuchlichen biblischen Form „Bet-Zur“ wiedergegeben. Die Syntax bleibt nah am griechischen Begründungsgefüge, wird aber für heutige Leser geglättet.
