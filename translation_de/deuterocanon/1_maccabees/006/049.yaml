  source_fidelity: 'Die Pluralisierung von ἐξῆλθε („sie zogen aus“) ist nicht quellentreu: Der griechische Text hat sowohl bei ἐποίησεν als auch bei ἐξῆλθε Singular. Auch wenn der anschließende Plural αὐτοῖς die Bewohner von Bet-Zur meint und der Satz dadurch knapp bzw. syntaktisch gespannt wirkt, sollte die Übersetzung den Singular nicht ohne Kennzeichnung in einen Plural umformen. „Leute aus Bet-Zur“ gibt ἐκ Βεθσούρων genauer wieder als „Leute in Bet-Zur“; die inhaltliche Bezugnahme auf die Stadt bleibt durch den Kontext verständlich.'
  naturalness: Der revidierte Satz ist modernes, verständliches Standarddeutsch. „Mit den Bewohnern von Bet-Zur eine Vereinbarung treffen“ ist im Belagerungskontext idiomatisch. Die Wiederholung von „weil/denn“ entspricht dem griechischen Begründungsgefüge und ist hier gut lesbar.
  terminology: „Bet-Zur“ ist eine geeignete deutsche Namensform. „Vorräte“ deckt διατροφή im Kontext hinreichend weit ab; „Proviant“ wäre ebenfalls möglich. „Sabbatjahr“ macht den gemeinten landwirtschaftlichen Ruhezeitraum klar. Die Fußnote wahrt die knappere griechische Formulierung.
