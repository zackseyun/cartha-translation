  yaml_path: translation/deuterocanon/1_maccabees/006/049.yaml
  text: And he came to terms with those in Bethsura and went out from the city[a], because they had no provisions there to remain shut up in it, because it was a sabbath year for the land.
translation:
  language: de
  text: Und er traf mit den Bewohnern von Bet-Zur eine Vereinbarung und verließ die Stadt, denn sie hatten dort keine Vorräte, um eingeschlossen zu bleiben, weil es für das Land ein Sabbatjahr war.[a]
  philosophy: optimal-equivalence
  footnotes:
