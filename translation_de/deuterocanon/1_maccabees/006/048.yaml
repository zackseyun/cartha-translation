  yaml_path: translation/deuterocanon/1_maccabees/006/048.yaml
  text: And from the king’s camp they went up to meet them at Jerusalem[a], and the king encamped in Judea and at Mount Zion.
translation:
  language: de
  text: Und aus dem Heerlager des Königs zogen sie hinauf nach Jerusalem, um ihnen entgegenzutreten. Der König schlug sein Lager in Judäa und auf dem Berg Zion auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολῆς
  choice: Heerlager
  rationale: Der militärische Zusammenhang spricht für ein Feld- bzw. Heerlager; „Heerlager“ macht diesen Sinn im Deutschen klar.
- source_word: ἀνέβησαν
  choice: zogen sie hinauf
  rationale: Die Wendung bewahrt sowohl die topografische Aufwärtsbewegung nach Jerusalem als auch den militärischen Erzählzusammenhang, ohne die Marschform weiter festzulegen.
- source_word: εἰς συνάντησιν αὐτῶν
  choice: um ihnen … entgegenzutreten
  rationale: Die Formulierung gibt die Bewegung zur Begegnung wieder und lässt im militärischen Kontext erkennen, dass es sich um ein Entgegentreten handelt.
- source_word: παρενέβαλεν
  choice: schlug sein Lager … auf
  rationale: Dies ist eine natürliche, gegenwärtige deutsche Wiedergabe des militärischen Verbs „lagern/sein Lager aufschlagen“.
- source_word: Ἰουδαίαν
  choice: Judäa
  rationale: Gemeint ist die geografisch-politische Region Judäa.
- source_word: ὄρος Σιών
  choice: Berg Zion
  rationale: Die traditionelle und transparente deutsche Wiedergabe der Ortsbezeichnung.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger historischer Erzählstil. Der griechische Wechsel vom Plural („sie zogen hinauf“) zum Singular („der König schlug sein Lager auf“) bleibt erhalten. Die Wiederholung von παρεμβολή/παρεμβάλλω wird im Deutschen idiomatisch mit „Heerlager“ und „sein Lager aufschlagen“ wiedergegeben.
