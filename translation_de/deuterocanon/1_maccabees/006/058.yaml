  yaml_path: translation/deuterocanon/1_maccabees/006/058.yaml
  text: Now then[a], let us give our right hand to these men, and let us make peace with them and with their whole nation;
translation:
  language: de
  text: 'Nun also: Reichen wir diesen Männern die rechte Hand[a] und schließen wir Frieden mit ihnen und ihrem ganzen Volk.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die rechte Hand geben«; eine Geste, mit der Frieden, Bündnistreue oder eine verbindliche Zusage angeboten wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun also
  rationale: Die Wendung kennzeichnet einen folgernden Übergang und drängt zugleich zum gegenwärtigen Handeln. »Nun also« gibt beides in natürlichem Deutsch wieder.
- source_word: δῶμεν δεξιὰν
  choice: Reichen wir … die rechte Hand
  rationale: Wörtlich steht »die rechte Hand geben«. Gemeint ist eine verbindliche Friedens- oder Bündniszusage. »Die rechte Hand reichen« bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: diesen Männern
  rationale: ἄνθρωποι bezeichnet hier im militärisch-politischen Zusammenhang eine bestimmte Gruppe von Männern; die konkrete Wiedergabe entspricht dem Kontext.
- source_word: ποιήσωμεν … εἰρήνην
  choice: schließen wir Frieden
  rationale: Die griechische Wendung bezeichnet das Herstellen friedlicher Beziehungen. »Frieden schließen« ist die geläufige deutsche Formulierung für den Abschluss einer Friedensvereinbarung.
- source_word: μετʼ αὐτῶν
  choice: mit ihnen
  rationale: Die Präpositionalphrase bezeichnet unmittelbar die Parteien, mit denen Frieden geschlossen werden soll.
- source_word: μετὰ παντὸς ἔθνους αὐτῶν
  choice: mit ihrem ganzen Volk
  rationale: ἔθνος meint hier die gesamte Volksgemeinschaft, zu der die genannten Männer gehören. »Ihr ganzes Volk« gibt den umfassenden Sinn von παντός klar wieder.
