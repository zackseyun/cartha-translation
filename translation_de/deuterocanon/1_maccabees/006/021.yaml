  yaml_path: translation/deuterocanon/1_maccabees/006/021.yaml
  text: And they came out from it[a], from the confinement, and some of the ungodly from Israel joined them.
translation:
  language: de
  text: Und sie kamen daraus hervor, aus der Einschließung[a], und einige der Gottlosen aus Israel schlossen sich ihnen an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Belagerung“ oder „aus dem Eingeschlossensein“; das griechische Wort betont das Ein- beziehungsweise Abgeschlossensein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐξ αὐτοῦ
  choice: sie kamen daraus hervor
  rationale: „Daraus hervor“ gibt die Bewegung aus einem zuvor genannten, hier aber nicht ausdrücklich bezeichneten Ort wieder, ohne den Bezug des Pronomens unnötig festzulegen.
- source_word: συγκλεισμοῦ
  choice: Einschließung
  rationale: Das Wort bezeichnet das Ein- oder Abgeschlossensein. „Einschließung“ bewahrt diesen Grundsinn, ohne die militärische Deutung „Belagerung“ im Haupttext festzuschreiben.
- source_word: ἐκολλήθησαν αὐτοῖς
  choice: schlossen sich ihnen an
  rationale: Die idiomatische deutsche Wendung gibt das Sichverbinden beziehungsweise den Anschluss an eine Gruppe natürlich und präzise wieder.
- source_word: τινες τῶν ἀσεβῶν
  choice: einige der Gottlosen
  rationale: „Einige“ wahrt die unbestimmte Teilmenge; „Gottlose“ erhält den religiös-moralischen Gehalt von ἀσεβής deutlicher als das allgemeinere „Böse“.
- source_word: ἐξ Ἰσραήλ
  choice: aus Israel
  rationale: Die Wendung bezeichnet ihre Herkunft beziehungsweise Zugehörigkeit innerhalb Israels und wird direkt wiedergegeben.
theological_decisions:
- issue: Religiös-moralische Kennzeichnung durch ἀσεβῶν
  choice: Gottlosen
  alternative: Frevler; Gottesverächter; Ruchlosen
  rationale: „Gottlosen“ bewahrt die ausdrücklich religiöse Dimension des griechischen Ausdrucks und bleibt zugleich verständlich, ohne die Personen nur allgemein als moralisch böse zu bezeichnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme „daraus … aus der Einschließung“ spiegelt die doppelte griechische Aus-diesem-Konstruktion, während „daraus“ den im Vers selbst nicht ausdrücklich genannten Bezugsort offenlässt.
