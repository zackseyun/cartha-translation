translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der parataktische Charakter des griechischen Berichts bleibt erkennbar, wird aber durch Satzteilung für heutige Leser übersichtlich gestaltet. Die Bezugnahme des Pronomens in „steckten sie in Brand“ bleibt wie im Griechischen formal offen, wobei die Belagerungsmaschinen der nächstliegende Bezug sind.
