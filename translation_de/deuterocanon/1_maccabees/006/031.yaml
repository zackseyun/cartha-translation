base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/031.yaml
  text: And they came through Idumea and encamped against Bethsura[a], and they fought for many days, and they made siege engines; but they came out and burned them with fire[b], and fought bravely.
translation:
  language: de
  text: Und sie zogen durch Idumäa und schlugen ihr Lager vor Bet-Zur auf. Sie kämpften viele Tage lang und bauten Belagerungsmaschinen. Da rückten die Verteidiger aus[a], steckten sie in Brand und kämpften tapfer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „rückte aus“ im Singular, nachdem zuvor Verben im Plural gebraucht wurden. Wahrscheinlich ist das Verb kollektiv zu verstehen und bezieht sich auf die Verteidiger Bet-Zurs, die einen Ausfall machten.
    reason: textual_variant
  - marker: b
    text: 'Oder: „kämpften heldenhaft“. Das griechische Adverb bedeutet wörtlich „auf männliche Weise“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς Ἰδουμαίας
  choice: durch Idumäa
  rationale: διά mit dem Genitiv bezeichnet hier die Bewegung durch ein Gebiet; „Idumäa“ ist die geläufige deutsche Namensform.
- source_word: παρενεβάλοσαν ἐπὶ Βεθσουρᾷ
  choice: schlugen ihr Lager vor Bet-Zur auf
  rationale: παρεμβάλλω bezeichnet das Lagern eines Heeres; ἐπί mit Dativ hat im Belagerungszusammenhang feindliche Ausrichtung. „Vor Bet-Zur“ klingt im Deutschen natürlich und bezeichnet die Stellung vor der befestigten Stadt.
- source_word: ἐπολέμησαν ἐπʼ ἡμέρας πολλάς
  choice: sie kämpften viele Tage lang
  rationale: Die Wendung bezeichnet eine Zeitdauer; die Übersetzung ist klar, modern und nah am griechischen Ausdruck.
- source_word: μηχανὰς
  choice: Belagerungsmaschinen
  rationale: Im militärischen Zusammenhang sind μηχαναί technische Vorrichtungen für eine Belagerung, nicht Maschinen im allgemeinen modernen Sinn.
- source_word: ἔξηλθεν
  choice: die Verteidiger rückten aus
  rationale: Das überlieferte Verb steht im Singular, doch der Zusammenhang legt einen kollektiven Bezug auf die Verteidiger Bet-Zurs nahe. „Ausrücken“ gibt den militärischen Sinn eines Ausfalls wieder, ohne Einzelheiten hinzuzufügen.
- source_word: ἐνεπύρισαν αὐτοὺς ἐν πυρί
  choice: steckten sie in Brand
  rationale: Das Pronomen bleibt erhalten und bezieht sich am natürlichsten auf die zuvor genannten Belagerungsmaschinen. Die deutsche Wendung gibt das Verb samt der Feuerangabe idiomatisch wieder.
- source_word: ἀνδρωδῶς
  choice: tapfer
  rationale: Das Adverb bedeutet wörtlich „auf männliche Weise“, bezeichnet hier aber mutiges, entschlossenes Kämpfen. „Tapfer“ bewahrt diese wertende Bedeutung in natürlichem modernem Deutsch.
