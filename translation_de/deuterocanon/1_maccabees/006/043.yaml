  source_fidelity: 'Der Text gibt die griechische Abfolge und Aussage zuverlässig wieder: Eleasar sieht eines der Tiere, dessen königliche Panzerung hervorgehoben wird; dieses überragt die übrigen; schließlich wird die Anwesenheit des Königs lediglich als Anschein dargestellt. „Auf ihm“ ist im Kontext eines Kriegselefanten idiomatisch und sachlich vertretbar, obwohl ἐν αὐτῷ wörtlicher auch anders gefasst werden könnte.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem Erzählton. „Mit königlichen Brustpanzern gerüstet“ ist etwas bildhaft und wegen der griechischen Wiederholung von Rüstungsverb und -substantiv leicht markiert, aber klar, natürlich genug und quellentreu.
