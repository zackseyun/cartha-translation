translation_notes:
  register: Moderne, würdige Standardsprache. Der Haupttext folgt der Tierbezeichnung des Griechischen und erläutert den militärischen Zusammenhang in der Fußnote. Die Konstruktion mit „als sei“ bewahrt ausdrücklich die Unsicherheit der Wahrnehmung.
