base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/043.yaml
  text: And Eleazar the Avaran saw one of the beasts armored with royal breastplates[a], and it towered above all the beasts[b], and it appeared that the king was on it.
translation:
  language: de
  text: Eleasar Awaran sah eines der Tiere[a], das mit königlichen Brustpanzern gerüstet war. Es überragte alle anderen Tiere, und es hatte den Anschein, als sei der König auf ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „eines der Tiere“; im Zusammenhang handelt es sich bei diesen Tieren um Kriegselefanten.
    reason: cultural_note
  - marker: b
    text: 'Oder: „und es schien, dass der König auf ihm war.“ Der griechische Wortlaut bezeichnet einen Anschein, keine Gewissheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεάζαρ ὁ Σαυαρὰν
  choice: Eleasar Awaran
  rationale: Die im Deutschen geläufigen Namensformen „Eleasar“ und „Awaran“ bewahren den Charakter der griechischen Bezeichnung als Eigenname beziehungsweise Beiname, ohne ihr eine unsichere Bedeutung zuzuschreiben.
- source_word: ἐν τῶν θηρίων
  choice: eines der Tiere
  rationale: θηρίον bezeichnet wörtlich ein Tier. Der militärische Zusammenhang identifiziert die Tiere als Kriegselefanten; diese Kontextinformation wird in einer Fußnote gegeben, statt sie in den Haupttext einzutragen.
- source_word: τεθωρακισμένον θώραξιν βασιλικοῖς
  choice: mit königlichen Brustpanzern gerüstet
  rationale: Die Formulierung gibt sowohl das Verb θωρακίζω als auch das verwandte Substantiv θώραξ wieder und wahrt den Plural des griechischen Textes, ohne die im Deutschen schwerfällige Wiederholung „mit Brustpanzern gepanzert“ zu verwenden.
- source_word: ὑπεράγον
  choice: überragte
  rationale: Das Verb bezeichnet hier die auffällige Überlegenheit beziehungsweise Höhe des Tieres gegenüber den übrigen; „überragte“ lässt offen, ob vor allem Größe, Höhe oder allgemeine Hervorhebung gemeint ist.
- source_word: ὤφθη ὅτι ἐν αὐτῷ ἐστιν ὁ βασιλεύς
  choice: es hatte den Anschein, als sei der König auf ihm
  rationale: ὤφθη drückt einen Anschein und keine feststehende Tatsache aus. Die unpersönliche deutsche Wendung entspricht der griechischen Perspektive; „auf ihm“ ist bei einem Reittier idiomatisch, während ἐν αὐτῷ je nach Zusammenhang auch wörtlicher als „in ihm“ verstanden werden kann.
