  yaml_path: translation/deuterocanon/1_maccabees/006/033.yaml
  text: And the king rose early in the morning and moved the camp out in full force on the road to Beth-zachariah[a], and the forces drew up for battle[b], and they sounded the trumpets.
translation:
  language: de
  text: Und der König stand früh am Morgen auf und ließ das Heerlager in voller Stärke auf der Straße nach Bet-Sacharja[a] aufbrechen. Die Streitkräfte stellten sich zum Kampf auf, und man blies die Trompeten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf dem Weg über Bet-Sacharja«. Der griechische Ausdruck kann eine Bewegung entlang der dorthin führenden Route bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρισεν
  choice: stand früh am Morgen auf
  rationale: Das Verb bezeichnet frühes Aufstehen oder Tätigwerden in der Morgenfrühe; die Wiedergabe bewahrt sowohl Handlung als auch Zeitangabe.
- source_word: ἀπῆρεν τὴν παρεμβολὴν
  choice: ließ das Heerlager ... aufbrechen
  rationale: ἀπαίρω bezeichnet hier das Aufheben bzw. In-Bewegung-Setzen des Lagers; im Deutschen gibt »das Heerlager aufbrechen lassen« den organisierten Abmarsch natürlich wieder.
- source_word: ἐν ὁρμήματι αὐτῆς
  choice: mit seiner ganzen Wucht
  rationale: ὅρμημα kann Ansturm, Schwung oder kraftvolle Bewegung bezeichnen. Die Formulierung erhält die militärische Dynamik, ohne sie eindeutig als Angriff festzulegen.
- source_word: κατὰ τὴν ὁδὸν Βεθζαχαριά
  choice: auf der Straße nach Bet-Sacharja
  rationale: κατά mit ὁδός bezeichnet eine Bewegung entlang einer Route; »nach« gibt die naheliegende Zielrichtung wieder, während die Fußnote die mögliche Lesart »über den Weg von« offenhält.
- source_word: διετάξαντο αἱ δυνάμεις εἰς τὸν πόλεμον
  choice: Die Streitkräfte stellten sich zum Kampf auf
  rationale: διατάσσω bezeichnet im militärischen Zusammenhang das Ordnen oder Aufstellen in Schlachtordnung.
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: man blies die Trompeten
  rationale: Die griechische Verbindung von Verb und Instrument bezeichnet ein militärisches Trompetensignal; das unpersönliche »man« lässt wie das Griechische den handelnden Personenkreis unausgesprochen.
- source_word: Βεθζαχαριά
  choice: Bet-Sacharja
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren, quellennahen Form transliteriert.
