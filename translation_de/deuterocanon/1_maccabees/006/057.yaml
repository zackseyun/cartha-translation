base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/057.yaml
  text: And they kept urging and pressing to depart[a]. And he said to the king and the leaders of the army and the men, “We are growing weaker day by day, and our food is scant, and the place where we are encamped is strong[b], and the affairs of the kingdom are pressing upon us.”
translation:
  language: de
  text: 'Und sie drängten und bestanden darauf aufzubrechen. Da sagte er zum König, zu den Heerführern und zu den Männern: »Unsere Kräfte schwinden Tag für Tag[a], und wir haben nur wenig zu essen. Der Ort, an dem wir lagern, ist stark befestigt, und die Angelegenheiten des Königreichs lasten auf uns.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Wir werden Tag für Tag weniger« oder »Wir sind Tag für Tag mehr erschöpft.« Das griechische Verb kann ein Schwinden, Nachlassen oder Erschöpftwerden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέσπευδον καὶ ἐπενύοντο
  choice: sie drängten und bestanden darauf
  rationale: Die beiden Imperfektformen bezeichnen anhaltendes Drängen und nachdrückliches Bestehen. Die Doppelung bleibt in natürlichem Deutsch erkennbar.
- source_word: τοῦ ἀπελθεῖν
  choice: aufzubrechen
  rationale: Der Infinitiv bezeichnet hier das Fortgehen beziehungsweise den militärischen Abzug; „aufzubrechen“ ist im Zusammenhang idiomatisch, ohne die Art des Abzugs näher festzulegen.
- source_word: Ἐκλείπομεν
  choice: Unsere Kräfte schwinden
  rationale: ἐκλείπω kann ein Nachlassen, Schwinden oder Erschöpftwerden bezeichnen. Die Formulierung gibt den fortschreitenden Kräfteverlust im Belagerungskontext natürlich wieder, während die Fußnote die mögliche weitere Bedeutung offenhält.
- source_word: ἡ τροφὴ ἡμῖν ὀλίγη
  choice: wir haben nur noch wenig zu essen
  rationale: τροφὴ bezeichnet Nahrung oder Verpflegung; die idiomatische deutsche Wendung vermittelt die bestehende Knappheit klar.
- source_word: ὁ τόπος, οὗ παρεμβάλλομεν
  choice: der Ort, an dem wir unser Lager aufgeschlagen haben
  rationale: παρεμβάλλω ist hier militärisch vom Lagern zu verstehen. Das deutsche Perfekt beschreibt den daraus bestehenden gegenwärtigen Lagerzustand natürlich.
- source_word: ὀχυρός
  choice: stark befestigt
  rationale: Das Adjektiv bezeichnet einen militärisch starken beziehungsweise befestigten Ort. „Stark befestigt“ macht den im Kontext naheliegenden Sinn deutlich.
- source_word: ἐπίκειται ἡμῖν τὰ τῆς βασιλείας
  choice: die Angelegenheiten des Königreichs lasten auf uns
  rationale: Die Wendung bezeichnet die dringliche Belastung durch die Belange des Königreichs; „lasten auf uns“ bewahrt das Bild und die politische Dringlichkeit.
