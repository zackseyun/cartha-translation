base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/059.yaml
  text: and let us establish for them to walk according to their own laws[a], as before; for it was because of their laws, which we set aside[b], that they became angry and did all these things.
translation:
  language: de
  text: Lasst uns ihnen wieder gestatten, wie früher nach ihren eigenen Gesetzen[a] zu leben. Denn wegen ihrer Gesetze, die wir außer Kraft gesetzt[b] haben, wurden sie zornig und taten dies alles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren eigenen Satzungen und Bräuchen“. Das griechische Wort kann sowohl Gesetze als auch verbindliche überlieferte Bräuche bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich hat das Verb die Bedeutung „zerstreuen“; hier meint es, ihre Gesetze und die damit verbundenen Lebensformen zu zerschlagen oder zu unterdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσωμεν
  choice: wir wollen ihnen zugestehen
  rationale: Der hortative Aorist Konjunktiv formuliert einen Vorschlag. Im Zusammenhang bezeichnet das Verb die verbindliche Wiederherstellung der Erlaubnis; „zugestehen“ ist im Deutschen natürlicher als ein wörtliches „aufstellen“.
- source_word: τοῦ πορεύεσθαι
  choice: zu leben
  rationale: 'Wörtlich „zu gehen“, idiomatisch mit Gesetzen jedoch: sein Leben danach ausrichten. „Nach … zu leben“ gibt diesen Sinn klar und natürlich wieder.'
- source_word: τοῖς νομίμοις αὐτῶν
  choice: nach ihren eigenen Gesetzen
  rationale: νόμιμα kann Gesetze, Satzungen oder überlieferte Bräuche bezeichnen. Im Kontext der unterdrückten jüdischen Lebensordnung ist „Gesetze“ die klarste Hauptwiedergabe, ohne den möglichen Brauchcharakter auszuschließen.
- source_word: ὡς τὸ πρότερον
  choice: wieder wie früher
  rationale: Die Formulierung bezeichnet die Rückkehr zum früheren Zustand; „wieder“ macht diese Wiederherstellung im Deutschen deutlich.
- source_word: χάριν
  choice: wegen
  rationale: χάριν mit Genitiv bezeichnet hier den Grund ihres Zorns, nicht einen Nutzen oder Zweck.
- source_word: διεσκεδάσαμεν
  choice: außer Kraft gesetzt
  rationale: Das Verb bedeutet grundlegend „zerstreuen“ und hier übertragen das Zerschlagen oder Aufheben der geltenden Rechts- und Lebensordnung. „Außer Kraft gesetzt“ trifft die kontextuelle Wirkung, ohne die Bildbedeutung als wörtliche Aussage auszugeben.
- source_word: ὠργίσθησαν
  choice: wurden sie zornig
  rationale: Die Form bezeichnet das Zornigwerden; die Wiedergabe ist würdig und wahrt den griechischen Zustandswechsel.
- source_word: ἐποίησαν ταῦτα πάντα
  choice: taten dies alles
  rationale: Die Wendung fasst die zuvor geschilderten Handlungen umfassend zusammen und lässt sich im Deutschen natürlich mit „dies alles“ wiedergeben.
