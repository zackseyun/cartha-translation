translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz wird als politischer Vorschlag formuliert; „nach … leben“ gibt die griechische Weg-Metapher idiomatisch wieder. Die beiden Fußnoten bewahren die Bedeutungsbreite von νόμιμα und die bildhafte Grundbedeutung von διασκεδάζω.
