translation:
  language: de
  text: Und sie rissen den Gräuel nieder, den er auf dem Altar in Jerusalem errichtet hatte[a]. Das Heiligtum umgaben sie wie früher mit hohen Mauern und ebenso Bet-Zur, seine Stadt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Abscheuliche“. Das griechische Wort bezeichnet hier etwas, das im Gottesdienst als anstößig und verwerflich gilt.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung „Bet-Zur, seine Stadt“ ist knapp. Der Bezug von „seine“ ist im griechischen Text nicht eindeutig.
    reason: alternative_reading
lexical_decisions:
- source_word: καθεῖλαν
  choice: sie rissen ... nieder
  rationale: Der Aorist von καθαιρέω bezeichnet hier die gewaltsame Beseitigung einer baulichen oder kultischen Anlage. „Niederreißen“ bewahrt den konkreten, kräftigen Sinn.
- source_word: τὸ βδέλυγμα
  choice: den Gräuel
  rationale: βδέλυγμα bezeichnet etwas Abscheuliches und ist hier kultisch aufgeladen. „Gräuel“ bewahrt diese biblisch-kultische Bedeutung, ohne die im Vers nicht stehende Ergänzung „der Verwüstung“ einzuführen.
- source_word: ᾠκοδόμησεν
  choice: errichtet hatte
  rationale: Das Verb bedeutet wörtlich „bauen“. Bei einer kultischen Anlage klingt „errichten“ im Deutschen natürlich; das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: auf dem Altar
  rationale: ἐπί mit Akkusativ bezeichnet hier die Lage auf dem Altar. Die schlichte Formulierung ist im modernen Deutschen präzise und natürlich.
- source_word: τὸ ἁγίασμα
  choice: das Heiligtum
  rationale: ἁγίασμα bezeichnet in diesem Tempelzusammenhang den heiligen Ort beziehungsweise Bezirk; „Heiligtum“ ist idiomatisch und hinreichend genau.
- source_word: καθὼς τὸ πρότερον
  choice: wie früher
  rationale: Die Wendung verweist auf die Wiederherstellung eines früheren Zustands. „Wie früher“ ist knapp und verständlich.
- source_word: ἐκύκλωσαν τείχεσιν ὑψηλοῖς
  choice: umgaben sie ... mit hohen Mauern
  rationale: Das Verb bezeichnet das Umgeben oder Umschließen; der instrumentale Dativ wird durch „mit hohen Mauern“ wiedergegeben. Die Übersetzung vermeidet das stärker deutende „befestigten“.
- source_word: τὴν Βεθσουρὰ πόλιν αὐτοῦ
  choice: ebenso Bet-Zur, seine Stadt
  rationale: Bet-Zur ist ein weiteres Objekt zu ἐκύκλωσαν. Die knappe griechische Fügung und das mehrdeutige Pronomen αὐτοῦ werden möglichst direkt bewahrt.
theological_decisions:
- issue: Wiedergabe von βδέλυγμα im kultisch-polemischen Zusammenhang
  choice: der Gräuel
  alternative: das Abscheuliche
  rationale: „Gräuel“ erhält die kultische und schriftsprachliche Resonanz des griechischen Ausdrucks. Die traditionelle Erweiterung „Gräuel der Verwüstung“ wird nicht aufgenommen, da sie hier nicht im Ausgangstext steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit, ohne die syntaktischen Beziehungen des griechischen Textes aufzulösen. Der Ortsname Βεθσουρά wird in der im Deutschen transparenten Form „Bet-Zur“ wiedergegeben.
