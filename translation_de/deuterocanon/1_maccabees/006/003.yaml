  source_fidelity: „Sein Vorhaben“ legt λόγος stärker als der griechische Text auf einen konkreten Plan fest. λόγος kann hier zwar das Vorhaben bezeichnen, bleibt aber semantisch weiter („Sache“, „Nachricht“, „Bericht“). Eine neutralere Wiedergabe bewahrt diese Offenheit besser. Die übrigen Satzglieder geben καταλαβεῖν, προνομεῦσαι, οὐκ ἠδυνάσθη und τοῖς ἐκ τῆς πόλεως sachgerecht wieder.
  naturalness: Der Entwurf ist insgesamt flüssiges modernes Standarddeutsch. „Die Sache wurde den Bewohnern der Stadt bekannt“ ist in diesem erzählerischen Kontext natürlich genug und vermeidet eine unnötige Konkretisierung. „Plündern“ ist idiomatischer und weniger intensiv als „ausplündern“.
  terminology: „Einnehmen“ ist für καταλαβεῖν im militärischen Kontext treffend. „Plündern“ gibt προνομεῦσαι angemessen wieder. „Bewohnern der Stadt“ ist eine natürliche kontextuelle Entfaltung von τοῖς ἐκ τῆς πόλεως.
