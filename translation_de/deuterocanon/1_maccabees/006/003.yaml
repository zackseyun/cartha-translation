  text: And he came and sought to take the city and plunder it[a], but he was not able, because the plan became known to those from the city.
translation:
  language: de
  text: Und er kam und versuchte, die Stadt einzunehmen und zu plündern. Doch es gelang ihm nicht, denn die Sache[a] wurde den Bewohnern der Stadt bekannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Plan; die Nachricht. Das griechische Wort λόγος kann unter anderem ein Wort, eine Nachricht, eine Sache oder einen Plan bezeichnen. Hier kann die beabsichtigte Einnahme und Plünderung gemeint sein, ohne dass dies ausdrücklich festgelegt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβεῖν
  choice: einzunehmen
  rationale: Im militärischen Zusammenhang bezeichnet das Verb die Eroberung beziehungsweise das Erlangen der Kontrolle über die Stadt. „Einnehmen“ ist dafür die natürliche deutsche Wendung.
- source_word: προνομεῦσαι
  choice: auszuplündern
  rationale: Das Verb bezeichnet das Erbeuten und Plündern. „Ausplündern“ gibt hier sowohl die Handlung als auch die Ausrichtung auf Beute klar wieder.
- source_word: ἐζήτει
  choice: versuchte
  rationale: Wörtlich bedeutet die Form „er suchte“. In Verbindung mit den Infinitiven drückt sie hier ein Bestreben oder einen Versuch aus; „versuchte“ ist im Deutschen natürlich und wahrt den Sinn.
- source_word: οὐκ ἠδυνάσθη
  choice: es gelang ihm nicht
  rationale: Die Wendung drückt aus, dass er dazu nicht imstande war. „Es gelang ihm nicht“ vermeidet im Deutschen eine schwerfällige Wiederholung der Infinitive und bewahrt die Aussage seines Scheiterns.
- source_word: ἐγνώσθη
  choice: wurde … bekannt
  rationale: Die passive Form besagt, dass etwas bekannt wurde, ohne zu bestimmen, auf welchem Weg die Information weitergegeben wurde.
- source_word: ὁ λόγος
  choice: sein Vorhaben
  rationale: λόγος kann Wort, Nachricht, Sache oder Plan bedeuten. Im Zusammenhang ist offenbar die beabsichtigte Einnahme und Plünderung gemeint; „Vorhaben“ passt zur Erzählfolge, ohne die mögliche Bedeutungsbreite zu verschweigen.
- source_word: τοῖς ἐκ τῆς πόλεως
  choice: den Bewohnern der Stadt
  rationale: Die griechische Wendung lautet wörtlich „denen aus der Stadt“ und bezeichnet hier natürlich die zur Stadt gehörenden Menschen. „Den Bewohnern der Stadt“ ist klares, idiomatisches Deutsch.
