  yaml_path: translation/deuterocanon/1_maccabees/006/053.yaml
  text: But there was no food in the holy place[a], because it was the seventh year[b], and those who had escaped into Judea from the nations had eaten up the remnant of the supplies.
translation:
  language: de
  text: Doch im Heiligtum gab es keine Lebensmittel, weil es das siebte Jahr war[a]; und die aus den Völkern[b] nach Judäa entkommen waren, hatten den Rest der Vorräte aufgezehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das siebte Jahr des Sabbatjahrzyklus, in dem die landwirtschaftliche Nutzung eingeschränkt war; das erklärt den Mangel an Lebensmitteln.
    reason: cultural_note
  - marker: b
    text: '„Aus den Völkern“ kann hier auch bedeuten: aus den Gebieten der nichtjüdischen Völker; traditionell wird die Wendung mit „von den Heiden“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: Lebensmittel
  rationale: Der Plural bezeichnet allgemein Essbares beziehungsweise Nahrungsvorräte. „Lebensmittel“ ist im Zusammenhang einer Belagerung natürlich und hinreichend breit.
- source_word: ἐν τοῖς ἁγίοις
  choice: im Heiligtum
  rationale: Die substantivierte neutrale Pluralform bedeutet wörtlich „in den heiligen [Bereichen]“ und bezeichnet hier den Tempel beziehungsweise dessen heiligen Bezirk. „Im Heiligtum“ gibt den örtlichen und sakralen Bezug knapp wieder.
- source_word: διὰ τὸ ἕβδομον ἔτος εἶναι
  choice: weil es das siebte Jahr war
  rationale: Dies folgt der ausdrücklichen griechischen Formulierung und lässt die sachlich naheliegende Deutung als Sabbatjahr in der Fußnote erläutern.
- source_word: οἱ ἀνασωζόμενοι
  choice: diejenigen, die sich … gerettet hatten
  rationale: Das Partizip bezeichnet hier Menschen, die sicher entkommen und nach Judäa gelangt waren. Die reflexive Formulierung ist im Deutschen idiomatisch, ohne eine besondere Art ihrer Rettung festzulegen.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: nach Judäa
  rationale: εἰς bezeichnet die Bewegung in das Gebiet hinein; im Deutschen ist bei einem Ländernamen „nach Judäa“ die natürliche Entsprechung.
- source_word: ἀπὸ τῶν ἐθνῶν
  choice: aus den Völkern
  rationale: Die Wendung bewahrt die jüdisch-griechische Redeweise und kann die nichtjüdischen Völker beziehungsweise deren Gebiete bezeichnen, ohne vorschnell auf „Heiden“ festgelegt zu werden.
- source_word: κατέφαγον
  choice: hatten … aufgezehrt
  rationale: Das intensive Verb bezeichnet vollständigen Verbrauch. Das Plusquamperfekt verdeutlicht, dass die Vorräte bereits verbraucht waren.
- source_word: τὸ ὑπόλιμμα τῆς παραθέσεως
  choice: den Rest der Vorräte
  rationale: ὑπόλιμμα ist das Verbliebene; παράθεσις bezeichnet in diesem Kontext plausibel bereitgelegte oder gelagerte Vorräte. Die deutsche Wendung ist klar und vermeidet eine unpassende kultische Überdeutung.
theological_decisions:
- issue: Ob das „siebte Jahr“ im Haupttext ausdrücklich als Sabbatjahr bezeichnet werden soll
  choice: Im Haupttext bleibt „das siebte Jahr“ stehen.
  alternative: „das Sabbatjahr“
  rationale: Der historische Bezug auf das Sabbatjahr erklärt sehr wahrscheinlich die Knappheit, doch der griechische Text selbst sagt nur „das siebte Jahr“. Die Erläuterung gehört daher in eine Fußnote.
- issue: Bedeutung von ἐθνῶν im jüdischen historischen Kontext
  choice: „aus den Völkern“
  alternative: „von den Heiden“ oder „aus den Gebieten der fremden Völker“
  rationale: „Völker“ erhält die Ausdrucksweise des griechischen Textes und lässt offen, ob primär die nichtjüdischen Menschen oder ihre Gebiete gemeint sind. „Heiden“ wäre stärker theologisch gefärbt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Begründungszusammenhang, wird aber durch Semikolon und idiomatische Wortwahl gut lesbar. Die Fußnotenmarker stehen jeweils unmittelbar bei der erläuterten Wendung.
