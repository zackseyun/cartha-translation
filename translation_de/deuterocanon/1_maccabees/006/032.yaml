  source_fidelity: Die Übersetzung gibt die Abfolge und die militärisch-räumliche Relation des griechischen Textes zutreffend wieder. »brach … auf«, »schlug … sein Lager auf« und »dem Lager des Königs gegenüber« entsprechen dem Sinn von ἀπῆρεν, παρενέβαλεν und ἀπέναντι τῆς παρεμβολῆς τοῦ βασιλέως. Die Wiedergabe von εἰς Βεθζαχαριά mit »bei Bet-Sacharja« ist jedoch etwas weniger bestimmt als die Ziel-/Ortsangabe des Griechischen; »in Bet-Sacharja« wahrt diese Angabe besser.
