  yaml_path: translation/deuterocanon/1_maccabees/006/032.yaml
  text: And Judas moved away from the citadel and encamped at Beth-zachariah[a], opposite the king’s camp.
translation:
  language: de
  text: Und Judas brach von der Zitadelle[a] auf und schlug in Bet-Sacharja sein Lager auf, dem Lager des Königs gegenüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Akra«; gemeint ist die befestigte Zitadelle in Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: brach … auf
  rationale: Das Verb bezeichnet das Aufbrechen bzw. Fortziehen von einem Ort, ohne einen militärischen Rückzug als Motiv nahezulegen.
- source_word: ἄκρας
  choice: der Zitadelle
  rationale: ἄκρα bezeichnet hier die befestigte Hochburg in Jerusalem; »Zitadelle« ist verständlich und wahrt den Festungscharakter.
- source_word: παρενέβαλεν
  choice: schlug … sein Lager auf
  rationale: Die militärische Wendung gibt das Aufschlagen eines Lagers natürlich und präzise wieder.
- source_word: εἰς Βεθζαχαριά
  choice: bei Bet-Sacharja
  rationale: Nach dem Verb des Lagerns bezeichnet εἰς den Ziel- und Lagerort; »bei« ist im Deutschen für eine Ortslage bei einer Siedlung idiomatisch.
- source_word: ἀπέναντι
  choice: gegenüber
  rationale: Das Wort bezeichnet eine räumliche Position auf der gegenüberliegenden Seite bzw. im Angesicht des anderen Lagers.
- source_word: παρεμβολῆς
  choice: Lager
  rationale: Das Substantiv bezeichnet in diesem militärischen Zusammenhang ein Heerlager.
- source_word: τοῦ βασιλέως
  choice: des Königs
  rationale: Der deutsche Genitiv bildet die Zugehörigkeit knapp und formal entsprechend dem Griechischen ab.
