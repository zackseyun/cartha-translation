  text: And the proposal pleased the king and the rulers[a], and he sent to them to make peace[c][b], and they accepted.
translation:
  language: de
  text: Und der Vorschlag fand die Zustimmung des Königs und der Obersten[a]. Da sandte er zu ihnen, um Frieden zu schließen[b], und sie nahmen den Vorschlag an[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Das Wort“ oder „die Sache fand die Zustimmung des Königs und der Obersten.“ Das griechische λόγος kann den ausgesprochenen Vorschlag oder die besprochene Angelegenheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er sandte zu ihnen, um Frieden zu schließen.“ Im Griechischen bleibt offen, ob er Boten oder eine Botschaft sandte.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Verb bedeutet „sie nahmen an“ oder „sie akzeptierten“. Der Gegenstand ist nicht ausdrücklich genannt und wird hier aus dem zuvor erwähnten Vorschlag erschlossen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρεσεν
  choice: fand die Zustimmung
  rationale: Die Wendung gibt idiomatisch wieder, dass die Sache dem König und den führenden Männern gefiel beziehungsweise von ihnen gebilligt wurde.
- source_word: ὁ λόγος
  choice: der Vorschlag
  rationale: Im diplomatischen Zusammenhang bezeichnet λόγος hier am ehesten den Inhalt des zuvor Gesagten oder Vorgeschlagenen; „Vorschlag“ ist verständlich, ohne die mögliche Bedeutung „Wort“ oder „Sache“ zu verschweigen.
- source_word: ἐναντίον τοῦ βασιλέως καὶ τῶν ἀρχόντων
  choice: des Königs und der führenden Männer
  rationale: ἐναντίον bedeutet wörtlich „vor/in Gegenwart von“; zusammen mit ἤρεσεν bezeichnet es idiomatisch die Zustimmung dieser Personen. ἄρχοντες sind Autoritätsträger, deren genaue Ämter hier nicht genannt werden.
- source_word: ἀπέστειλεν πρὸς αὐτούς
  choice: sandte er zu ihnen
  rationale: Das Griechische nennt weder ausdrücklich Boten noch eine Botschaft. Die knappe deutsche Form bewahrt diese Unbestimmtheit.
- source_word: εἰρηνεῦσαι
  choice: um Frieden zu schließen
  rationale: Der Infinitiv bezeichnet den Zweck des Sendens. „Frieden schließen“ passt natürlich zum diplomatischen Kontext, ohne einen förmlichen Vertrag ausdrücklich vorauszusetzen.
- source_word: ἐπεδέξαντο
  choice: sie nahmen das Angebot an
  rationale: Das implizite Objekt ist im Zusammenhang das Friedensangebot beziehungsweise die Friedensbedingungen. Die Ergänzung „das Angebot“ sorgt im Deutschen für Klarheit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die diplomatische Sprache ist klar und natürlich; die vom Griechischen offengelassene Art des Sendens bleibt im Haupttext unbestimmt. „Führende Männer“ vermeidet eine zu konkrete Amtsbezeichnung für ἄρχοντες.
