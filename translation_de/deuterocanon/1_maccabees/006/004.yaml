  text: Und sie zogen gegen ihn in den Krieg. Da floh er und brach von dort mit großer Trauer auf, um nach Babylon zurückzukehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστησαν αὐτῷ εἰς πόλεμον
  choice: sie zogen gegen ihn in den Krieg
  rationale: Die Wendung bezeichnet, dass sie sich ihm feindlich zum Kampf entgegenstellten. „Gegen ihn in den Krieg ziehen“ gibt den militärischen Vorgang im modernen Deutschen natürlich wieder.
- source_word: ἔφυγεν
  choice: da floh er
  rationale: Das Verb bedeutet unmittelbar „fliehen“; „da“ verbindet die Reaktion flüssig mit dem vorausgehenden Angriff, ohne eine zusätzliche Ursache einzutragen.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: brach von dort ... auf
  rationale: Die Formulierung wahrt sowohl das Fortgehen als auch den ausdrücklichen örtlichen Bezug von ἐκεῖθεν und klingt im Deutschen idiomatisch.
- source_word: μετὰ λύπης μεγάλης
  choice: mit großer Trauer
  rationale: λύπη kann Trauer, Kummer oder Betrübnis bezeichnen. „Große Trauer“ bleibt nah am Wortlaut und legt den Anlass des Gefühls nicht näher fest.
- source_word: ἀποστρέψαι εἰς Βαβυλῶνα
  choice: um nach Babylon zurückzukehren
  rationale: Der Infinitiv lässt sich im Zusammenhang am besten als Absicht seines Aufbruchs verstehen; „zurückkehren“ bewahrt die Bedeutung der Rückwendung nach Babylon.
