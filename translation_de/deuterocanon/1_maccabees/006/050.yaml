  text: And the king captured Bethsura[b][a], and he stationed a garrison there to guard it.
translation:
  language: de
  text: Und der König nahm Betsura ein[a] und stationierte dort eine Besatzung[b], die es bewachen sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „brachte Betsura in seine Gewalt“ oder „besetzte Betsura“. Das griechische Verb kann allgemeiner die Besitzergreifung des Ortes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „stellte dort eine Wache auf“. Gemeint ist eine militärische Einheit, die den Ort sichern sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελάβετο
  choice: nahm … ein
  rationale: Das mediale Verb bezeichnet im militärischen Zusammenhang die Einnahme beziehungsweise Besitzergreifung eines Ortes. „nahm … ein“ ist dafür im Deutschen natürlich und präzise.
- source_word: ὁ βασιλεύς
  choice: der König
  rationale: Die Herrscherbezeichnung wird entsprechend dem griechischen Text wiedergegeben, ohne den Namen aus dem Kontext einzusetzen.
- source_word: τὴν Βεθσούραν
  choice: Betsura
  rationale: Der Ortsname wird nach der griechischen Form Βεθσούρα transliteriert und nicht an die hebräische Namensform Bet-Zur angeglichen.
- source_word: ἐπέταξεν
  choice: stationierte
  rationale: In Verbindung mit φρουράν bezeichnet das Verb hier die Zuweisung beziehungsweise Aufstellung einer militärischen Besatzung. „stationierte“ gibt diesen kontextuellen Sinn idiomatisch wieder.
- source_word: φρουράν
  choice: eine Besatzung
  rationale: Im Zusammenhang mit einer eingenommenen befestigten Stadt ist eine dort zurückgelassene militärische Besatzung gemeint.
- source_word: τηρεῖν αὐτήν
  choice: die es bewachen sollte
  rationale: Der Infinitiv bezeichnet den Auftrag der Besatzung, den Ort zu bewachen beziehungsweise zu sichern. Das feminine Pronomen bezieht sich auf die Stadt Betsura; im Deutschen steht beim Ortsnamen idiomatisch „es“.
