  yaml_path: translation/deuterocanon/1_maccabees/002/054.yaml
  text: Phinehas our father[a], because he was zealous with zeal, received a covenant of holy priesthood.
translation:
  language: de
  text: Pinhas, unser Vater, empfing, weil er voller Eifer war[a], einen Bund heiligen Priestertums.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „indem er mit Eifer eiferte“. Die griechische Wendung betont seinen Eifer und kann auch zeitlich verstanden werden: „als er Eifer zeigte“.'
    reason: Bewahrt die stammverwandte Wiederholung und die grammatische Mehrdeutigkeit von ἐν τῷ ζηλῶσαι ζῆλον.
lexical_decisions:
- source_word: Φινεὲς
  choice: Pinhas
  rationale: Die im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: ὁ πατὴρ ἡμῶν
  choice: unser Vater
  rationale: Bewahrt die wörtliche Verwandtschaftsbezeichnung und ihren ehrenden Klang; gemeint ist hier der Vorfahr Pinhas.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  choice: weil er voller Eifer war
  rationale: Gibt die emphatische Verbindung des Verbs ζηλόω mit dem stammverwandten Substantiv ζῆλος in natürlichem Deutsch wieder. Die wörtliche Wiederholung und die mögliche zeitliche Nuance werden in der Fußnote dokumentiert.
- source_word: ἔλαβε
  choice: empfing
  rationale: Passt zum Empfang einer von Gott gewährten Bundeszusage und ist im Deutschen würdig und prägnant.
- source_word: διαθήκην
  choice: einen Bund
  rationale: Bewahrt den biblisch-theologischen Schlüsselbegriff und den Bezug auf die Pinhasüberlieferung.
- source_word: ἱερωσύνης ἁγίας
  choice: heiligen Priestertums
  rationale: Der attributive Genitiv wird formal bewahrt; „heilig“ gibt ἁγία unmittelbar wieder, ohne zusätzliche Deutung.
theological_decisions:
- issue: Verhältnis des Eifers zum Empfang des Bundes
  choice: Die Wendung wird im Haupttext begründend mit „weil“ wiedergegeben.
  alternative: 'Zeitlich oder modal: „als er voller Eifer war“ beziehungsweise „indem er Eifer zeigte“.'
  rationale: Im Zusammenhang bezeichnet die Wendung den Eifer als Anlass für den Empfang des Bundes. Da ἐν τῷ mit Infinitiv zugleich zeitlich oder modal gehört werden kann, wird diese Offenheit in der Fußnote ausdrücklich erhalten.
- issue: Bezeichnung des Priestertums
  choice: „einen Bund heiligen Priestertums“
  alternative: „einen Bund über ein heiliges Priestertum“ oder „den Bund eines heiligen Priestertums“
  rationale: Die knappe Genitivverbindung des Griechischen bleibt erhalten, ohne näher festzulegen, ob der Bund das Priestertum gewährt, sich darauf bezieht oder dessen Fortbestand zusichert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich knappe Formulierung „Bund heiligen Priestertums“ spiegelt bewusst die dichte griechische Genitivverbindung; die emphatische, im Deutschen schwer nachzubildende Eiferformel wird natürlich wiedergegeben und in der Fußnote formal erläutert.
