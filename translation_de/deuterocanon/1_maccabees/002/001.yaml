base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/001.yaml
  text: In those days Mattathias son of John, son of Simeon, a priest of the sons of Joarib, rose up from Jerusalem and settled in Modein.
translation:
  language: de
  text: In jenen Tagen trat Mattatias, ein Priester aus der Priesterfamilie Jojaribs, Sohn des Johannes, des Sohnes Simeons, aus Jerusalem hervor und ließ sich in Modeïn nieder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστη
  choice: trat … auf
  rationale: Gibt das erzählerische Auftreten beziehungsweise Sich-Erheben natürlich wieder, ohne die mögliche Konnotation entschlossenen Handelns ganz einzuebnen.
- source_word: τῶν υἱῶν Ἰωαρίβ
  choice: aus den Nachkommen Jojaribs
  rationale: „Söhne“ bezeichnet hier eine priesterliche Abstammungs- beziehungsweise Sippenlinie; „Nachkommen“ ist im modernen Deutschen klarer.
- source_word: ἀπὸ Ἱερουσαλήμ
  choice: stammte aus Jerusalem
  rationale: Bewahrt die Herkunftsangabe. Der griechische Anschluss lässt sich auch bewegungsbezogen verstehen; in Verbindung mit dem folgenden Niederlassen ist „stammte aus“ idiomatisch und vermeidet die unnatürliche Formulierung „trat aus Jerusalem auf“.
- source_word: ἐκάθισεν
  choice: ließ sich … nieder
  rationale: Der Kontext verlangt nicht das wörtliche „setzte sich“, sondern das Wohnen beziehungsweise Ansiedeln an einem Ort.
- source_word: Μωδεείν
  choice: Modeïn
  rationale: Deutsche Umschrift des Ortsnamens; das Trema kennzeichnet, dass e und i getrennt gesprochen werden.
theological_decisions:
- issue: Zugehörigkeit zur Priestergruppe Jojarib
  choice: Priester aus den Nachkommen Jojaribs
  alternative: Priester von den Söhnen Jojaribs
  rationale: Die genealogisch-priesterliche Zugehörigkeit bleibt erhalten, ohne „Söhne“ irreführend auf unmittelbare leibliche Söhne zu beschränken.
- issue: Bedeutung von ἀνέστη
  choice: trat … auf
  alternative: stand auf / erhob sich
  rationale: Die Wendung markiert den Eintritt Mattatias’ in die Erzählung und kann zugleich Initiative andeuten. „Trat auf“ bewahrt diese Offenheit besser als eine rein körperliche Handlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; Genealogie, Priesterzugehörigkeit, Herkunft und Niederlassung bleiben vollständig erhalten.
