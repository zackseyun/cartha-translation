  yaml_path: translation/deuterocanon/1_maccabees/002/062.yaml
  text: And do not fear the word of a sinful man[a], for his glory is for dung and worms.
translation:
  language: de
  text: Und fürchtet euch nicht vor dem Wort eines sündigen Mannes[a]; denn seine Herrlichkeit endet in Kot und Würmern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürchtet euch nicht vor dem, was ein sündiger Mann sagt.“ Wörtlich steht im Griechischen: „von dem Wort eines sündigen Mannes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγου
  choice: Wort
  rationale: λόγος bezeichnet hier die Äußerung des sündigen Mannes. „Wort“ bewahrt den konkreten Singular; die Fußnote nennt die im Deutschen natürlichere Sinnwiedergabe.
- source_word: ἀνδρὸς ἁμαρτωλοῦ
  choice: eines sündigen Mannes
  rationale: ἀνήρ ist ausdrücklich maskulin und ἁμαρτωλός adjektivisch; die Wiedergabe erhält Form und Ton des Griechischen.
- source_word: μὴ φοβηθῆτε
  choice: fürchtet euch nicht vor
  rationale: Die Wendung gibt den verneinten Aorist-Konjunktiv als Aufforderung wieder und bildet zugleich die ungewöhnliche griechische Konstruktion mit ἀπό idiomatisch ab.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: δόξα kann Ehre, Ansehen oder Herrlichkeit bezeichnen. „Herrlichkeit“ erhält den gehobenen und zugleich ironischen Kontrast zum folgenden Verfall.
- source_word: εἰς κόπρια
  choice: endet in Kot
  rationale: εἰς bezeichnet hier das Ziel beziehungsweise Ergebnis. „endet in“ macht diese Richtung natürlich verständlich; „Kot“ bewahrt die schroffe, erniedrigende Bildsprache.
- source_word: σκώληκας
  choice: Würmern
  rationale: σκώληξ bezeichnet Würmer, im Verwesungskontext möglicherweise auch Maden. „Würmer“ wahrt die Breite des Ausdrucks, ohne ihn unnötig einzuengen.
theological_decisions:
- issue: Ist ἀνήρ allgemeinmenschlich oder spezifisch männlich wiederzugeben?
  choice: 'spezifisch männlich: „Mann“'
  alternative: Mensch; Sünder
  rationale: Der griechische Text verwendet ἀνήρ und nicht ἄνθρωπος; daher bleibt die maskuline Einzahl erhalten.
- issue: Wie konkret soll das Bild des Verfalls bleiben?
  choice: „seine Herrlichkeit endet in Kot und Würmern“
  alternative: seine Ehre vergeht in Schmutz und Verwesung
  rationale: Die drastischen Bilder tragen die Aussage über Vergänglichkeit und Erniedrigung. Eine abstraktere Fassung würde die rhetorische Kraft abschwächen.
- issue: Wie ist εἰς in der Schlusswendung zu verstehen?
  choice: 'als Ziel oder Ausgang: „endet in“'
  alternative: 'formal: „ist für Kot und Würmer bestimmt“'
  rationale: Das Griechische lässt eine knappe Zielaussage erkennen. „endet in“ ist im Deutschen natürlich, ohne die Aussage auf eine bestimmte Lehre über Tod oder Gericht festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht entsprechend dem griechischen Plural in der Ihr-Form. Die schroffe Verfallsmetaphorik wird bewusst nicht geglättet.
