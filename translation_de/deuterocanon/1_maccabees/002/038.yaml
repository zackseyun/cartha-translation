  yaml_path: translation/deuterocanon/1_maccabees/002/038.yaml
  text: And they rose up against them in battle on the Sabbath[a], and they died—they and their wives and their children and their livestock—about a thousand persons.
translation:
  language: de
  text: Und sie erhoben sich am Sabbat zum Kampf gegen sie. Da starben sie samt ihren Frauen, ihren Kindern und ihrem Vieh – bis zu tausend Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwa tausend Menschen“. Der griechische Ausdruck kann eine ungefähre Obergrenze bezeichnen und muss keine exakte Zählung wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστησαν ἐπʼ αὐτοὺς
  choice: sie erhoben sich … gegen sie
  rationale: Die Wendung mit ἀνίστημι und ἐπί bezeichnet ein feindliches Vorgehen. „Sich gegen jemanden erheben“ bewahrt das Bild und die feindliche Stoßrichtung, ohne die Art des Angriffs näher festzulegen.
- source_word: ἐν τῷ πολέμῳ
  choice: zum Kampf
  rationale: Im Zusammenhang bezeichnet die Wendung die konkrete bewaffnete Auseinandersetzung. Mit „zum Kampf“ verbindet sie sich im Deutschen natürlich mit „sich gegen sie erheben“.
- source_word: τοῖς σάββασιν
  choice: am Sabbat
  rationale: Obwohl die griechische Form pluralisch ist, bezeichnet sie idiomatisch den Sabbattag, an dem dieser konkrete Angriff stattfand.
- source_word: ἀπέθανον
  choice: da starben sie
  rationale: Das intransitive Verb bedeutet wörtlich „sie starben“. Der Zusammenhang macht die gewaltsame Todesursache deutlich, ohne dass sie durch „wurden getötet“ ausdrücklich in den Text eingetragen werden muss.
- source_word: τὰ κτήνη αὐτῶν
  choice: ihr Vieh
  rationale: κτήνη bezeichnet gehaltene Nutz- beziehungsweise Besitztiere. „Vieh“ ist dafür eine knappe und natürliche deutsche Entsprechung.
- source_word: ἕως χιλίων ψυχῶν ἀνθρώπων
  choice: bis zu tausend Menschen
  rationale: ἕως mit einer Zahl kann eine Obergrenze angeben; ψυχαί ἀνθρώπων zählt menschliche Personen beziehungsweise Leben. „Bis zu tausend Menschen“ bewahrt diese mögliche Grenzbedeutung.
