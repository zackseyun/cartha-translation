  - severity: low
    issue: „emporgehoben“ ist im Deutschen potenziell zu körperlich und weniger idiomatisch
    rationale: Das griechische ἐπαρθήσεται bewahrt zwar ein Aufwärtsbild, bezeichnet hier aber plausibel Erhöhung bzw. Hervorgehobenwerden. „Erhöht“ ist natürlich und bleibt ausreichend offen.
  - severity: low
