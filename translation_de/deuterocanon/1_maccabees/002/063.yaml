  naturalness: „Heute wird er erhöht“ ist in moderner Standardsprache klarer und idiomatischer als „emporgehoben“. „Sein Denken ist dahin“ ist eine verständliche, knappe und würdige Wiedergabe, die weniger altertümlich wirkt als das substantivierte „Sinnen“.
  terminology: „Erhöht“ wahrt die bildhafte wie auch die übertragene Bedeutungsbreite von ἐπαρθήσεται. „Denken“ gibt διαλογισμός als Vorgang bzw. Inhalt des Überlegens wieder, ohne die Aussage auf einzelne Pläne einzuengen oder eine anthropologische Lehre hineinzulesen.
