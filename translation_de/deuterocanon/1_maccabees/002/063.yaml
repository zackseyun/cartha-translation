base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/063.yaml
  text: Today he will be exalted[a], and he will surely not be found, because he has returned to his dust[b], and his plans have perished.
translation:
  language: de
  text: Heute wird er erhöht[a], und er wird gewiss nicht zu finden sein; denn er ist zum Staub zurückgekehrt, und sein Denken ist dahin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „emporgehoben“. Das griechische Wort bezeichnet wörtlich ein Emporheben und kann hier auch eine Erhöhung an Rang oder Ansehen meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „sein Gedanke“, „seine Überlegung“ oder „sein Plan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: Heute
  rationale: Gibt die unmittelbare Zeitangabe knapp und natürlich wieder.
- source_word: ἐπαρθήσεται
  choice: wird emporgehoben
  rationale: Bewahrt das Bild des griechischen Passivs von einem Emporheben, ohne es ausschließlich als gesellschaftliche Erhöhung auszulegen.
- source_word: οὐ μὴ εὑρεθῇ
  choice: wird ganz gewiss nicht mehr zu finden sein
  rationale: Die verstärkte Verneinung οὐ μή wird durch „ganz gewiss nicht“ ausgedrückt; „mehr“ verdeutlicht im Deutschen das endgültige Verschwinden im Tod.
- source_word: ἐπέστρεψεν
  choice: ist zurückgekehrt
  rationale: Das Perfekt klingt im Deutschen nach der begründenden Konjunktion natürlich und bezeichnet eine vollzogene Rückkehr.
- source_word: εἰς τὸν χοῦν αὐτοῦ
  choice: zu seinem Staub
  rationale: Bewahrt die auffällige Formulierung des Griechischen und den Anklang an die menschliche Sterblichkeit.
- source_word: διαλογισμὸς
  choice: Sinnen
  rationale: Das substantivierte „Sinnen“ hält die Einzahl fest und bleibt weit genug für Gedanken, Überlegungen oder Pläne.
- source_word: ἀπώλετο
  choice: ist vergangen
  rationale: Gibt das Aufhören beziehungsweise Zugrundegehen des Sinnens in würdiger, idiomatischer Sprache wieder.
theological_decisions:
- issue: Anthropologische Aussage über διαλογισμός beim Tod
  choice: „sein Sinnen ist vergangen“
  alternative: „sein Plan ist zunichtegeworden“ oder „seine Gedanken sind vergangen“
  rationale: Die Übersetzung spricht vom Ende des Sinnens, ohne daraus eine weitergehende Aussage über Seele, Bewusstsein oder die endgültige Existenz der Person abzuleiten.
- issue: Bedeutung von ἐπαρθήσεται
  choice: Bildhaft „emporgehoben“
  alternative: Deutender „erhöht“ oder „zu Ansehen gebracht“
  rationale: Die Bildsprache bleibt erhalten, während die mögliche Bedeutung eines Aufstiegs an Rang oder Ansehen in der Fußnote genannt wird.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrter Bildsprache. Die emphatische Verneinung wird klar ausgedrückt; die Einzahl und Bedeutungsweite von διαλογισμός bleiben erhalten.
