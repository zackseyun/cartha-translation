base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/061.yaml
  text: And so consider[a], from generation to generation[b], that all who hope in him will not grow weak.
translation:
  language: de
  text: Und so bedenkt[a] von Generation zu Generation, dass alle, die auf ihn hoffen, nicht schwach werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „erkennt“ oder „nehmt euch zu Herzen“.
    reason: lexical_alternative
  - marker: b
    text: Oder „nicht schwach sein“; das Griechische kann weiter gefasst auch „nicht versagen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐννοήθητε
  choice: bedenkt
  rationale: Der Aorist-Imperativ Plural fordert zu einer bewussten, nachdenklichen Einsicht auf. „Bedenkt“ ist im Deutschen natürlich, würdevoll und bewahrt den auffordernden Charakter.
- source_word: κατὰ γενεὰν
  choice: von Generation zu Generation
  rationale: Die Wendung richtet den Blick auf die Abfolge der Generationen und damit auf das durchgängige Zeugnis der Geschichte Israels.
- source_word: ἐλπίζοντες
  choice: die ... hoffen
  rationale: „Hoffen“ gibt ἐλπίζω unmittelbar wieder und lässt den Sinn zuversichtlicher Erwartung und des Vertrauens auf Gott bestehen.
- source_word: ἐπʼ αὐτόν
  choice: auf ihn
  rationale: Im Deutschen lautet die idiomatische Verbindung „auf jemanden hoffen“. Das Pronomen bleibt wie im Griechischen erhalten; sein Bezug auf Gott ergibt sich aus dem Zusammenhang.
- source_word: ἀσθενήσουσιν
  choice: nicht schwach werden
  rationale: Diese Wiedergabe wahrt den verbalen und möglicherweise inchoativen Sinn von ἀσθενέω, ohne ihn vorschnell zum umfassenderen „scheitern“ zu erweitern.
theological_decisions:
- issue: Bezug von αὐτόν („ihn“)
  choice: Das Pronomen bleibt stehen; Gott ist im Zusammenhang der implizite Bezug.
  alternative: Den Bezug ausdrücklich mit „Gott“ wiederzugeben oder ihn als unbestimmt zu verstehen.
  rationale: Der unmittelbare Kontext erinnert an Gottes Treue gegenüber den Vorfahren. Die Beibehaltung des Pronomens folgt der griechischen Form und vermeidet zugleich eine unnötige Explizierung.
- issue: Tragweite von ἀσθενήσουσιν
  choice: „nicht schwach werden“
  alternative: „nicht scheitern“ oder „nicht versagen“
  rationale: Die engere Wiedergabe erhält die Spannung, dass die Aussage Kraftlosigkeit verneint, ohne ausdrücklich jeden möglichen äußeren Misserfolg auszuschließen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Aufforderungston. Die Satzstellung bleibt nahe am Griechischen, ohne unnatürlich zu wirken; echte lexikalische Mehrdeutigkeit wird in den Fußnoten bewahrt.
