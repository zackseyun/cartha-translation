  yaml_path: translation/deuterocanon/1_maccabees/002/052.yaml
  text: Was not Abraham found faithful in testing[b][a], and was it counted to him as righteousness?
translation:
  language: de
  text: Wurde Abraham nicht in der Prüfung[a] als treu befunden, und wurde ihm das als Gerechtigkeit angerechnet?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Erprobung“. Das griechische Wort kann auch „Versuchung“ bedeuten; hier bezeichnet es Abrahams Prüfung.'
    reason: lexical_alternative
  - marker: b
    text: Anspielung auf Genesis 15,6, hier mit Abrahams Prüfung verbunden.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀβραάμ
  choice: Abraham
  rationale: Die im Deutschen übliche Namensform des Erzvaters.
- source_word: πειρασμῷ
  choice: in der Prüfung
  rationale: πειρασμός kann Prüfung, Erprobung oder Versuchung bezeichnen. Hier geht es um Abrahams Erprobung und nicht um eine Verlockung zum Bösen.
- source_word: εὑρέθη πιστός
  choice: als treu befunden
  rationale: Die passive Form mit dem Prädikatsadjektiv wird eng am Griechischen wiedergegeben und bringt zum Ausdruck, dass Abraham sich in der Prüfung als treu erwies.
- source_word: ἐλογίσθη αὐτῷ
  choice: wurde ihm ... angerechnet
  rationale: Die Formulierung bewahrt den Anklang an Genesis 15,6 und den rechnenden beziehungsweise zusprechenden Sinn des Verbs, ohne ihn dogmatisch näher festzulegen.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: Dies ist die natürliche deutsche Entsprechung und passt zum biblischen Anklang an Genesis 15,6.
theological_decisions:
- issue: Verhältnis zwischen Abrahams Prüfung und der Anrechnung als Gerechtigkeit
  choice: Beide Aussagen werden unmittelbar miteinander verbunden, ohne ihr zeitliches oder theologisches Verhältnis zu erklären.
  alternative: Den Vers ausdrücklich als Zusammenfassung von Genesis 22 und Genesis 15,6 auslegen oder Abrahams Glauben ergänzend nennen.
  rationale: Der griechische Text verbindet die Prüfung Abrahams mit der Anrechnung als Gerechtigkeit in einer rhetorischen Frage. Die Übersetzung wahrt diese Spannung, ohne eine Harmonisierung einzutragen.
- issue: Wiedergabe von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ entspricht dem etablierten biblischen Sprachgebrauch und lässt den deklarativen, ethischen und beziehungsbezogenen Sinn des griechischen Begriffs offen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Frage und die Wiederholung der Passivkonstruktion werden bewahrt. Die Stellung der Fußnoten folgt jeweils dem Ausdruck, auf den sie sich beziehen.
