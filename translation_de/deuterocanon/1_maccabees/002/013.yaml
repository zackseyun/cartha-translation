  text: Why should we still live?[a]
translation:
  language: de
  text: Warum sollen wir noch leben?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Warum ist es noch an uns zu leben?“ Die griechische Formulierung ist eine idiomatische Klagefrage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα τί
  choice: Warum sollen
  rationale: Die idiomatische Frage ἵνα τί bedeutet im Koine-Griechischen „warum?“ beziehungsweise „wozu?“. Zusammen mit ζῇν gibt „Warum sollen … leben?“ den klagenden, erwägenden Ton natürlich wieder.
- source_word: ἡμῖν
  choice: wir
  rationale: Der Dativ gehört zur Wendung ἡμῖν … ζῆν, wörtlich etwa „für uns zu leben“. Im modernen Deutschen wird dies idiomatisch mit dem Subjekt „wir“ ausgedrückt.
- source_word: ἔτι
  choice: noch
  rationale: ἔτι bezeichnet das Fortdauern. „noch“ bewahrt knapp und natürlich den Gedanken des weiteren Lebens.
- source_word: ζῇν
  choice: leben
  rationale: Der Präsensinfinitiv bezeichnet das Leben beziehungsweise Weiterleben. „leben“ ist präzise und lässt die im Zusammenhang liegende Fortdauer durch „noch“ erkennen.
