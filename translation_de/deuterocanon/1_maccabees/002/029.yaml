lexical_decisions:
- source_word: Τότε
  choice: Damals
  rationale: Kennzeichnet den zeitlichen Fortgang der Erzählung; „Damals“ ist im Deutschen natürlich und knapp.
- source_word: κατέβησαν
  choice: zogen … hinab
  rationale: Bewahrt die im griechischen Verb ausdrücklich enthaltene Abwärtsbewegung und klingt zugleich erzählerisch natürlich.
- source_word: πολλοὶ
  choice: viele
  rationale: Direkte und idiomatische Wiedergabe der Mengenangabe.
- source_word: ζητοῦντες
  choice: die … suchten
  rationale: Der präsentische Partizipialausdruck beschreibt ihr anhaltendes beziehungsweise kennzeichnendes Streben.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Gibt die moralisch-religiöse Dimension des Begriffs wieder, ohne ihn auf einen rein juristischen Sinn zu verengen.
- source_word: καὶ κρίμα
  choice: und Recht
  rationale: „Recht“ erfasst hier den rechtlichen und urteilenden Bedeutungsbereich von κρίμα und bewahrt neben „Gerechtigkeit“ zwei verwandte, aber nicht völlig gleiche Leitbegriffe.
- source_word: εἰς τὴν ἔρημον
  choice: in die Wüste
  rationale: Übliche biblische Wiedergabe für ein unbewohntes, abgelegenes Gebiet; sie setzt nicht zwingend eine Sandwüste voraus.
- source_word: καθίσαι ἐκεῖ
  choice: um sich dort niederzulassen
  rationale: Der Infinitiv bezeichnet in diesem Zusammenhang das Bleiben beziehungsweise Ansiedeln, nicht bloß ein wörtliches Sitzen.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη und κρίμα als Begriffspaar
  choice: Gerechtigkeit und Recht
  alternative: Gerechtigkeit und Urteil
  rationale: Die gewählte Fassung lässt die ethische und die rechtlich-urteilende Seite nebeneinanderstehen, ohne die teilweise Bedeutungsüberschneidung aufzulösen. Die mögliche engere Bedeutung „Urteil“ wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die biblisch vertrauten Ausdrücke „Gerechtigkeit“, „Recht“ und „Wüste“ bleiben verständlich, ohne die Mehrdeutigkeit des griechischen Begriffspaars einzuebnen.
