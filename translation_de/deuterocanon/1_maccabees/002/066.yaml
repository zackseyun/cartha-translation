  yaml_path: translation/deuterocanon/1_maccabees/002/066.yaml
  text: And Judas Maccabeus himself, strong in might from his youth, shall be your commander of the army, and you shall fight the battle against the nations.
translation:
  language: de
  text: Und Judas Makkabäus selbst, der seit seiner Jugend große Kraft besitzt[a], soll euer Heerführer sein; und ihr sollt den Krieg gegen die Völker führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet hier wörtlich ungefähr: „stark an Kraft, von ihm her, von seiner Jugend an“. Die Formulierung ist schwierig; gemeint ist offenbar, dass Judas seit seiner Jugend große Kraft besitzt.'
    reason: Schwieriger überlieferter Wortlaut
lexical_decisions:
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: Judas der Makkabäer
  rationale: Die im Deutschen eingebürgerte Namensform und Bezeichnung wahrt sowohl den Eigennamen Ἰούδας als auch den Beinamen ὁ Μακκαβαῖος.
- source_word: ἰσχυρὸς δυνάμει
  choice: über große Kraft verfügt
  rationale: Die Wendung gibt die nachdrückliche Verbindung von ἰσχυρός und δύναμις in natürlichem, würdigem Deutsch wieder, ohne die griechische Bedeutungsdopplung hölzern nachzubilden.
- source_word: ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: von Jugend an
  rationale: Die überlieferte Formulierung ist schwierig; ἐκ νεότητος αὐτοῦ bezeichnet erkennbar die Jugend als Ausgangspunkt beziehungsweise Zeitraum. Das zusätzliche ἐκ αὐτοῦ wird wegen seiner Unklarheit nicht spekulativ ausgedeutet, sondern in der Fußnote offengelegt.
- source_word: ἄρχοντα στρατιᾶς
  choice: Heerführer
  rationale: ἄρχων bezeichnet hier den militärischen Führer, στρατιά das Heer. „Heerführer“ ist prägnant, verständlich und dem historischen Register angemessen.
- source_word: πολεμήσετε πόλεμον
  choice: den Krieg … führen
  rationale: Diese idiomatische deutsche Wendung gibt die griechische figura etymologica aus πολεμέω und πόλεμος natürlich wieder.
- source_word: λαῶν
  choice: gegen die Völker
  rationale: Der Genitiv bezeichnet im Zusammenhang die gegnerischen Völker. „Völker“ wahrt die lexikalische Breite von λαοί und vermeidet die stärker theologisch geprägte Festlegung auf „Heiden“.
theological_decisions:
- issue: Deutung der schwierigen Wendung ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: Im Haupttext wird der erkennbare Sinn „von Jugend an“ wiedergegeben; die Schwierigkeit des Wortlauts wird in einer Fußnote kenntlich gemacht.
  alternative: Eine wörtlichere, aber kaum verständliche Wiedergabe wie „von ihm her, von seiner Jugend an“.
  rationale: Der überlieferte griechische Wortlaut ist syntaktisch auffällig. Da seine genaue Erklärung unsicher bleibt, soll der Haupttext weder dunkel klingen noch durch eine Vermutung mehr Eindeutigkeit vorspiegeln, als die Quelle bietet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heerführer“ und „den Krieg führen“ passen zum militärischen Zusammenhang, bleiben aber für heutige Leser unmittelbar verständlich. Das Semikolon bildet den Übergang von Judas’ Einsetzung zum anschließenden Kampfauftrag ab.
