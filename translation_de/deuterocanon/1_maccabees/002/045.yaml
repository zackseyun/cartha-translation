- from: Und Mattatias und seine Söhne zogen umher und rissen ihre Altäre nieder.
  to: Und Mattatias und seine Söhne zogen umher und rissen die Altäre jener nieder.
  rationale: Die Revision beseitigt die im Deutschen naheliegende Fehlzuordnung des Possessivpronomens zu Mattatias und seinen Söhnen. „Jener“ verweist, entsprechend αὐτῶν und dem Kontext, auf die zuvor genannte Gegenseite, ohne deren Identität oder die Art ihrer Altäre weiter auszudeuten.
