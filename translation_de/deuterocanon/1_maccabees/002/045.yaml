review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt ἐκύκλωσεν im erzählerischen Kontext treffend als Bewegung durch das Gebiet wieder und übersetzt καθεῖλον sowie βωμούς sachgerecht. Das Possessivpronomen αὐτῶν bezieht sich kontextuell auf die gegnerische beziehungsweise kultisch abweichende Gruppe, nicht auf Mattatias und seine Söhne.
  naturalness: „Zogen umher“ und „rissen … nieder“ sind natürliches, modernes Standarddeutsch. In der vorliegenden Satzfassung kann „ihre Altäre“ jedoch leicht und unmittelbar auf „Mattatias und seine Söhne“ bezogen werden. Dadurch entsteht eine missverständliche, dem Kontext widersprechende Lesart.
  terminology: „Mattatias“ ist eine gebräuchliche deutsche Namensform. „Altäre“ ist die unmittelbare und angemessene Wiedergabe von βωμούς. Die Fassung „die Altäre jener“ erhält den possessiven und kontextuellen Bezug, ohne die Altäre zusätzlich als „heidnisch“ zu klassifizieren.
  issues:
