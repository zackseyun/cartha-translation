    issue: Mehrdeutiger Bezug von „ihre Altäre“
    rationale: Nach dem unmittelbar vorausgehenden Subjekt „Mattatias und seine Söhne“ wird das deutsche Possessivpronomen naheliegend auf diese Gruppe bezogen. αὐτῶν verweist im erzählerischen Kontext dagegen auf die zuvor genannte Gegenseite. Eine geringfügige Umstellung klärt den Bezug, ohne über den griechischen Text hinauszugehen.
