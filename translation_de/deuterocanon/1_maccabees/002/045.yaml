  text: And Mattathias and his sons went around and tore down their altars,
translation:
  language: de
  text: Und Mattatias und seine Söhne zogen umher und rissen die Altäre jener nieder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: zogen umher
  rationale: Das Verb bezeichnet hier ein Umherziehen beziehungsweise eine Bewegung durch das Gebiet. Die deutsche Wendung gibt den Zusammenhang natürlich wieder, ohne eine militärische Einkesselung anzudeuten. Das griechische Singularverb bei einem zusammengesetzten Subjekt wird im Deutschen regulär im Plural wiedergegeben.
- source_word: καθεῖλον
  choice: rissen … nieder
  rationale: Das Verb bezeichnet das Herabnehmen oder Zerstören eines Bauwerks. „niederreißen“ ist für die gewaltsame Beseitigung von Altären idiomatisch und anschaulich.
- source_word: βωμοὺς
  choice: Altäre
  rationale: βωμός bezeichnet unmittelbar einen Altar; „Höhenheiligtümer“ würde einen anderen kultischen Begriff eintragen.
- source_word: αὐτῶν
  choice: ihre
  rationale: Das Possessivpronomen bleibt bewusst ohne nähere Bestimmung seines Bezugs und bewahrt damit die Ausdrucksweise des griechischen Textes.
- source_word: Ματταθίας
  choice: Mattatias
  rationale: „Mattatias“ ist eine gebräuchliche deutsche Namensform und entspricht der griechischen Namensgestalt.
theological_decisions:
- issue: Kultischer Bezug der zerstörten Altäre
  choice: „ihre Altäre“
  alternative: „die Altäre“ oder ausdrücklich „die heidnischen Altäre“
  rationale: Der Possessivbezug des Ausgangstextes wird erhalten. So werden die Altäre der zuvor genannten Gegenseite zugeordnet, ohne ihre Art durch einen im Vers nicht ausdrücklich vorhandenen Zusatz näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Satzstruktur des Griechischen bleibt erhalten; „zogen umher“ klingt natürlich und vermeidet den möglichen Belagerungssinn von „umzingelten“.
