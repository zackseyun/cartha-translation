  yaml_path: translation/deuterocanon/1_maccabees/002/017.yaml
  text: And those from the king answered and said to Mattathias[a], saying, “You are a ruler, honored and great in this city[b], and supported by sons and brothers.”
translation:
  language: de
  text: 'Da antworteten die Abgesandten des Königs[a] und sagten zu Mattatias: »Du bist ein Anführer, angesehen und bedeutend in dieser Stadt und bist durch Söhne und Brüder gestützt.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die vom König«; gemeint sind seine Beauftragten oder Vertreter.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und bist durch Söhne und Brüder fest etabliert«. Das Griechische kann sowohl den Rückhalt durch seine Familie als auch seine durch sie gefestigte Stellung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: die Abgesandten des Königs
  rationale: Wörtlich bezeichnet die Wendung »die vom König«; im Zusammenhang sind damit seine Beauftragten oder Vertreter gemeint. »Abgesandte des Königs« gibt diese Funktion natürlich und präzise wieder.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν ... λέγοντες
  choice: antworteten ... und sagten
  rationale: Die beiden finiten Verben werden als erzählerische Formel bewahrt; das zusätzliche Partizip λέγοντες wird im Deutschen durch den nachfolgenden Doppelpunkt hinreichend ausgedrückt und nicht schwerfällig verdreifacht.
- source_word: Ἄρχων
  choice: ein führender ... Mann
  rationale: Ἄρχων bezeichnet hier einen Mann mit anerkannter Autorität und hervorgehobener Stellung. »Führender Mann« klingt im modernen Deutschen natürlicher als »Herrscher«, ohne den sozialen Rang abzuschwächen.
- source_word: ἔνδοξος
  choice: angesehen
  rationale: Im gesellschaftlichen Zusammenhang bezeichnet das Wort öffentliches Ansehen oder Ehre; »angesehen« trifft diesen Sinn idiomatisch.
- source_word: μέγας
  choice: bedeutend
  rationale: Gemeint ist hier gesellschaftliche Größe beziehungsweise Wichtigkeit. »Bedeutend« vermeidet das im Deutschen missverständliche »groß« und bewahrt den gehobenen Ton.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: in dieser Stadt
  rationale: Dies ist die direkte und übliche Wiedergabe von πόλις in diesem Zusammenhang.
- source_word: ἐστηριγμένος ἐν υἱοῖς καὶ ἀδελφοῖς
  choice: wirst von Söhnen und Brüdern gestützt
  rationale: Das passive Partizip bezeichnet eine gefestigte oder gestützte Stellung. Die Präposition ἐν kann hier die familiäre Grundlage dieses Rückhalts ausdrücken; die Übersetzung bewahrt sowohl das passive Bild als auch den Familienbezug.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte Doppelung »antworteten und sagten« bleibt erhalten, während das zusätzliche λέγοντες durch den Doppelpunkt wiedergegeben wird. Die Anrede wird idiomatisch als Beschreibung eines gesellschaftlich führenden Mannes formuliert.
