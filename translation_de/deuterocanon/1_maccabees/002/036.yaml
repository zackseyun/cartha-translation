  text: And they did not answer them[a], nor did they hurl a stone at them, nor did they block up the hiding places,
translation:
  language: de
  text: Und sie antworteten ihnen nicht, schleuderten keinen Stein nach ihnen und versperrten auch die Verstecke[a] nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die verborgenen Orte“ beziehungsweise „die geheimen Orte“. Der griechische Ausdruck meint wahrscheinlich Orte, an denen man sich verbergen kann, nicht verborgene Personen.'
