lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: antworteten
  rationale: Das Verb bedeutet gewöhnlich „antworten“ oder „erwidern“; „antworteten ihnen nicht“ gibt die direkte Konfrontation schlicht und quellennah wieder.
- source_word: λίθον
  choice: einen Stein
  rationale: Der Singular des griechischen Textes bleibt erhalten und ist auch im Deutschen als Objekt zu „schleudern“ natürlich.
- source_word: ἐνετίναξαν
  choice: schleuderten
  rationale: Das Verb bezeichnet ein kraftvolles Werfen; „schleuderten“ vermittelt die mögliche Gewalthandlung deutlicher als das allgemeinere „warfen“.
- source_word: ἐνέφραξαν
  choice: versperrten
  rationale: Das Verb kann „absperren“, „verstopfen“ oder „verschließen“ bedeuten. „Versperrten“ passt zu räumlichen Zufluchtsorten, ohne eine bestimmte Art der Blockade festzulegen.
- source_word: τοὺς κρυφούς
  choice: die Verstecke
  rationale: Die substantivierte Form bezeichnet hier wahrscheinlich verborgene Orte. „Verstecke“ ist verständlich und wahrt den räumlichen Sinn; die mögliche wörtlichere Wiedergabe wird in der Fußnote genannt.
