translation:
  language: de
  text: Und er segnete sie; er wurde zu seinen Vätern versammelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wurde seinen Vätern hinzugefügt“; eine traditionelle Umschreibung für den Tod.'
