lexical_decisions:
- source_word: ηὐλόγησεν
  choice: segnete
  rationale: Das Aoristverb εὐλογέω bezeichnet hier den Segen, den Mattatias den Anwesenden erteilt; „segnete“ ist die natürliche und genaue deutsche Wiedergabe.
- source_word: προσετέθη
  choice: wurde versammelt
  rationale: Das Passiv von προστίθημι bedeutet wörtlich „wurde hinzugefügt“. In der festen biblischen Todesformel mit „zu seinen Vätern“ gibt „wurde versammelt“ den Sinn im Deutschen verständlich und traditionsnah wieder; die wörtliche Form wird in der Fußnote bewahrt.
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: zu seinen Vätern
  rationale: Die Wendung bezeichnet in traditioneller biblischer Sprache den Tod und die Verbindung mit den verstorbenen Vorfahren. „Zu seinen Vätern“ erhält das Bild des griechischen Textes, ohne eine bestimmte Aussage über den Zustand nach dem Tod hinzuzufügen.
theological_decisions:
- issue: Wiedergabe der Todesformel προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: wurde zu seinen Vätern versammelt
  alternative: wurde seinen Vätern hinzugefügt
  rationale: Die gewählte Form ist im Deutschen als biblische Todesformel verständlicher, bewahrt aber das überlieferte Bild. Sie deutet nicht näher aus, was mit dem Verstorbenen nach dem Tod geschieht; die wörtliche Bedeutung des Verbs steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener biblischer Todesformel. Das Semikolon bildet den engen Zusammenhang der beiden abschließenden Handlungen ab; „dann“ macht die zeitliche Folge natürlich verständlich.
