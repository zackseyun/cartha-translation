lexical_decisions:
- source_word: ἔφυγον αὐτὸς καὶ οἱ υἱοὶ αὐτοῦ
  choice: er floh mit seinen Söhnen
  rationale: Gibt die gemeinsame Flucht natürlich auf Deutsch wieder; das singularische »er floh« bewahrt zugleich den hervorgehobenen Bezug auf ihn als Hauptfigur.
- source_word: εἰς τὰ ὄρη
  choice: in die Berge
  rationale: Entspricht der Richtungsangabe mit εἰς und ist im Deutschen idiomatisch.
- source_word: ἐγκατέλιπον
  choice: ließen … zurück
  rationale: Bewahrt den sachlichen Sinn des Zurücklassens, ohne die stärkere wertende Färbung von »gaben auf« oder »verließen endgültig« einzutragen.
- source_word: ὅσα εἶχον ἐν τῇ πόλει
  choice: alles, was sie in der Stadt besaßen
  rationale: ὅσα bezeichnet hier die Gesamtheit ihres dortigen Besitzes; »besaßen« macht den besitzbezogenen Sinn von εἶχον in diesem Zusammenhang klar.
