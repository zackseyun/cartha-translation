  text: But I and my sons and my brothers will walk in the covenant of our fathers[a].
translation:
  language: de
  text: Doch ich, meine Söhne und meine Brüder werden nach dem Bund unserer Väter leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »werden im Bund unserer Väter gehen«. Gemeint ist wahrscheinlich, das Leben in Treue zum Bund zu führen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: Doch ich
  rationale: Die Krasis aus καί und ἐγώ verbindet den Satz mit dem Vorhergehenden und hebt zugleich den entschiedenen Gegensatz zu denen hervor, die dem königlichen Befehl folgen.
- source_word: οἱ υἱοί μου
  choice: meine Söhne
  rationale: υἱοί bezeichnet hier konkret die Söhne des Mattatias; die geschlechtsspezifische Familienbezeichnung bleibt erhalten.
- source_word: οἱ ἀδελφοί μου
  choice: meine Brüder
  rationale: ἀδελφοί wird in seiner naheliegenden Bedeutung wiedergegeben. Eine weitere Bedeutung wie »Verwandte« ist möglich, wird vom unmittelbaren Wortlaut aber nicht verlangt.
- source_word: πορευσόμεθα
  choice: werden … leben
  rationale: Das Verb bedeutet wörtlich »gehen«, bezeichnet zusammen mit ἐν διαθήκῃ jedoch die Lebensführung in Bindung an den Bund. »leben« gibt diesen idiomatischen Sinn in natürlichem modernem Deutsch wieder.
- source_word: ἐν διαθήκῃ
  choice: nach dem Bund
  rationale: διαθήκη bezeichnet hier den Bund. »nach dem Bund leben« drückt die normgebende und verpflichtende Bindung idiomatisch aus; die wörtlichere Präposition wird in der Fußnote dokumentiert.
- source_word: πατέρων ἡμῶν
  choice: unserer Väter
  rationale: Die konkrete, traditionsreiche Familien- und Bundesbezeichnung des griechischen Textes wird bewahrt und nicht zu »Vorfahren« verallgemeinert.
theological_decisions:
- issue: Bundesidiom πορευσόμεθα ἐν διαθήκῃ
  choice: werden nach dem Bund unserer Väter leben
  alternative: werden im Bund unserer Väter gehen / wandeln
  rationale: Die Formulierung beschreibt nicht bloß eine Bewegung, sondern eine Lebensführung in Bundestreue. Die gewählte Fassung ist gegenwärtiges, verständliches Deutsch, ohne die Verpflichtung des Bundes auf eine bestimmte konfessionelle Deutung festzulegen; die formale Bildlichkeit bleibt als Alternative in der Fußnote sichtbar.
- issue: Männliche Verwandtschaftsbezeichnungen
  choice: meine Söhne … meine Brüder … unsere Väter
  alternative: meine Kinder … meine Angehörigen … unsere Vorfahren
  rationale: Der griechische Text verwendet ausdrücklich männliche Verwandtschaftsbegriffe. Ihre historische und familiäre Konkretheit wird nicht neutralisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Doch« trägt den kontextuellen Gegensatz, während »nach dem Bund … leben« den griechischen Bundesidiom natürlich wiedergibt. Die wörtlichere, im Deutschen ungewohnte Wendung wird in der Fußnote bewahrt.
