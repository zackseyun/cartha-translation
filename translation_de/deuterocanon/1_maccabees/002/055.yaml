  text: Josua wurde, als er das Wort[b] erfüllte[a], Richter in Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem er das Wort erfüllte“ beziehungsweise „durch die Erfüllung des Wortes“. Die griechische Formulierung kann zeitlich oder instrumental verstanden werden.'
