lexical_decisions:
- source_word: Ἰησοῦς
  choice: Josua
  rationale: Gemeint ist in diesem geschichtlichen Rückblick Josua, der Sohn Nuns. Die im Deutschen übliche Namensform unterscheidet ihn von Jesus von Nazaret.
- source_word: ἐν τῷ πληρῶσαι
  choice: als er … erfüllte
  rationale: Die Verbindung aus ἐν und substantiviertem Infinitiv kann zeitlich oder instrumental verstanden werden. Die zeitliche Wiedergabe ist natürliches Deutsch; die instrumentale Möglichkeit wird in der Fußnote offengehalten.
- source_word: λόγον
  choice: das Wort
  rationale: λόγος bleibt hier unbestimmt. „Das Wort“ bewahrt diese Offenheit besser als die deutenderen Möglichkeiten „Gebot“, „Verheißung“ oder „Auftrag“.
- source_word: ἐγένετο
  choice: wurde
  rationale: ἐγένετο bezeichnet hier den Eintritt in die anschließend genannte Stellung; „wurde“ ist dafür die natürliche deutsche Entsprechung.
- source_word: κριτὴς
  choice: Richter
  rationale: κριτής bedeutet direkt „Richter“. Die Wiedergabe bewahrt die biblisch-geschichtliche Bezeichnung, ohne sie allgemein zu „Anführer“ auszuweiten.
- source_word: ἐν Ἰσραήλ
  choice: in Israel
  rationale: Dies gibt ἐν unmittelbar wieder und vermeidet die stärkere Deutung „über Israel“.
theological_decisions:
- issue: Worauf sich „das Wort“ bezieht
  choice: Die allgemeine Formulierung „das Wort“ bleibt stehen.
  alternative: „das Gebot“, „die Verheißung“, „der Auftrag“ oder „die Sache“
  rationale: Der griechische Ausdruck λόγον legt nicht eindeutig fest, ob ein göttliches Gebot, eine Verheißung oder eine andere Angelegenheit gemeint ist. Die Übersetzung wahrt diese inhaltliche Offenheit.
- issue: Verhältnis zwischen der Erfüllung des Wortes und Josuas Richteramt
  choice: 'Im Haupttext zeitlich: „als er … erfüllte“'
  alternative: 'Instrumental: „indem er … erfüllte“ oder „durch die Erfüllung …“'
  rationale: Die griechische Konstruktion kann den Zeitpunkt oder das Mittel bezeichnen. Der Haupttext wählt eine natürliche zeitliche Formulierung, während die Fußnote die instrumentale Lesart ausdrücklich erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist klar und knapp. Beide Fußnotenmarker stehen im Haupttext; [a] erläutert die mehrdeutige Infinitivkonstruktion, [b] die Bedeutungsbreite von λόγος.
