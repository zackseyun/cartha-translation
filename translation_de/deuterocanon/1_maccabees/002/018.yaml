base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/018.yaml
  text: Now then[a], come forward first and carry out the king’s command, as all the nations have done, and the rulers of Judah, and those left in Jerusalem; and you and your house will be among the king’s Friends[b], and you and your sons will be honored with silver and gold and many gifts.
translation:
  language: de
  text: Nun tritt als Erster vor und führe den Befehl des Königs aus, wie es alle Völker getan haben, ebenso die führenden Männer in Juda und die, die in Jerusalem zurückgeblieben sind. Du wirst mit deinem Haus zu den Freunden des Königs[a] gehören, und du und deine Söhne werdet mit Silber, Gold und vielen Zuwendungen[b] geehrt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Freunde des Königs“ kann hier auch eine anerkannte Hofbezeichnung oder einen Hofrang am hellenistischen Königshof meinen.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann königliche Vergünstigungen, Zuteilungen oder andere Belohnungen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσελθε πρῶτος
  choice: tritt als Erster vor
  rationale: 'Die Formulierung verbindet die öffentliche Aufforderung zum Vortreten mit dem verlangten Vorrang: Mattatias soll den anderen als Beispiel vorangehen.'
- source_word: ποίησον τὸ πρόσταγμα τοῦ βασιλέως
  choice: führe den Befehl des Königs aus
  rationale: πρόσταγμα bezeichnet eine verbindliche Anordnung; „ausführen“ ist im Deutschen idiomatisch und wahrt den amtlichen Ton.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: „Völker“ bewahrt die breite ethnisch-politische Bezeichnung des Griechischen, ohne sie vorschnell auf den theologischen Fachbegriff „Heiden“ festzulegen.
- source_word: οἱ ἄρχοντες Ἰούδα
  choice: die führenden Männer Judas
  rationale: ἄρχοντες meint Personen in leitender oder herrschender Stellung. Die Wendung ist natürlich und lässt offen, ob konkrete Amtsträger oder allgemein maßgebliche Führungspersonen gemeint sind.
- source_word: οἱ καταλειφθέντες ἐν Ἰερουσαλήμ
  choice: die, die in Jerusalem zurückgeblieben sind
  rationale: Die Übersetzung gibt den passivischen Gedanken des Verbleibens beziehungsweise Zurückgelassenseins wieder, ohne „Überlebende“ einzutragen.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: zu den Freunden des Königs
  rationale: Die wörtliche Wiedergabe bleibt verständlich; eine Fußnote weist darauf hin, dass φίλοι zugleich einen hellenistischen Hoftitel bezeichnen kann.
- source_word: δοξασθήσεσθε
  choice: werdet … geehrt werden
  rationale: Im Zusammenhang königlicher Belohnungen bezeichnet das Verb gesellschaftliche Auszeichnung und Ehre, nicht göttliche Verherrlichung.
- source_word: ἀποστολαῖς πολλαῖς
  choice: vielen Zuwendungen
  rationale: Neben Silber und Gold sind wahrscheinlich zusätzliche königliche Vergünstigungen oder Zuteilungen gemeint. „Zuwendungen“ bewahrt diese Breite besser als das engere „Geschenke“.
theological_decisions:
- issue: Hofrang in φίλοι τοῦ βασιλέως
  choice: „Freunde des Königs“ im Text, mit Hinweis auf einen möglichen Hoftitel
  alternative: „königliche Freunde“ oder „Mitglieder des Hofrangs der Freunde des Königs“
  rationale: Die Hauptübersetzung bewahrt den Wortlaut und seine zwischenmenschliche Bedeutung; die Fußnote erhält zugleich die wahrscheinliche politische Fachbedeutung, ohne sie im Text allein verbindlich zu machen.
- issue: Bedeutungsumfang von ἔθνη
  choice: „Völker“
  alternative: „Heiden“
  rationale: Der Kontext erlaubt eine ethnisch-religiöse Färbung, spricht jedoch unmittelbar von einer politischen Vergleichsgruppe. „Völker“ wahrt diese Spannung und vermeidet eine unnötige theologische Verengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer öffentlicher und politischer Redeweise. „Judas“ ist als Gebietsname beziehungsweise Bezeichnung für Juda im griechischen Text verstanden. Die Satzfolge wurde für natürliche deutsche Lesbarkeit leicht gegliedert, ohne die Argumentationsstruktur zu verändern.
