  yaml_path: translation/deuterocanon/1_maccabees/002/010.yaml
  text: What nation has not inherited a kingdom and taken hold of its spoils?[a]
translation:
  language: de
  text: Welches Volk hat nicht ein Königreich geerbt und sich seiner Beute bemächtigt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Kriegsbeute“ beziehungsweise „seiner Siegesbeute“. Das griechische Wort bezeichnet Beute, die bei Eroberung oder im Krieg gewonnen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῖον ἔθνος
  choice: Welches Volk
  rationale: Die Wendung leitet eine rhetorische Frage ein. „Volk“ gibt ἔθνος hier als politische Gemeinschaft natürlich wieder; „Nation“ wäre möglich, klingt in diesem antiken Zusammenhang jedoch moderner und staatsrechtlicher.
- source_word: ἐκληρονόμησεν
  choice: hat … geerbt
  rationale: Die Übersetzung bewahrt das Bild des Erbens beziehungsweise des als Erbteil empfangenen Besitzes, ohne es zu „in Besitz genommen“ abzuflachen.
- source_word: βασιλείαν
  choice: ein Königreich
  rationale: Im Zusammenhang mit Erben und Kriegsbeute ist die konkrete politische Bedeutung am wahrscheinlichsten. Die ebenfalls möglichen Bedeutungen „Königsherrschaft“ und „Königtum“ werden nicht in den Haupttext aufgenommen.
- source_word: ἐκράτησεν
  choice: hat sich … bemächtigt
  rationale: κρατέω bezeichnet hier das Ergreifen oder Erlangen von Gewalt über etwas. „Sich bemächtigen“ ist im Deutschen knapp, natürlich und lässt den gewaltsamen Hintergrund erkennen, ohne ihn übermäßig auszudeuten.
- source_word: τῶν σκύλων αὐτῆς
  choice: seiner Beute
  rationale: σκῦλα bezeichnet im Krieg errungene Beute. Das feminine αὐτῆς bezieht sich grammatisch am ehesten auf βασιλείαν; im Deutschen ist wegen „Königreich“ die Form „seiner“ erforderlich. Die mögliche Bezugsspannung bleibt sachlich bestehen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Zuspitzung und das Erbmotiv des griechischen Textes bleiben erhalten; „sich bemächtigen“ verbindet natürliche deutsche Ausdrucksweise mit der kräftigen Bedeutung von κρατέω.
