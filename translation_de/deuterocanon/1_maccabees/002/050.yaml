base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/050.yaml
  text: And now[a], children, be zealous for the law[b], and give your lives for the covenant of our fathers.
translation:
  language: de
  text: Und nun, Kinder[a], eifert für das Gesetz und gebt euer Leben hin für den Bund unserer Väter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Söhne«. Das griechische Wort ist eine familiäre Anrede für Nachkommen; im unmittelbaren Zusammenhang spricht Mattatias seine Söhne an.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um des Bundes unserer Väter willen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Kinder
  rationale: Der Vokativ bezeichnet die Angeredeten als Nachkommen und bewahrt die familiäre, väterliche Anrede, ohne das grammatische Geschlecht gegenüber dem griechischen Ausdruck unnötig einzuengen.
- source_word: ζηλώσατε τῷ νόμῳ
  choice: eifert für das Gesetz
  rationale: Der Aoristimperativ fordert zu entschlossenem, leidenschaftlichem Einsatz auf. „Für das Gesetz eifern“ gibt die religiöse Intensität und den Dativbezug natürlich wieder.
- source_word: δότε τὰς ψυχὰς ὑμῶν
  choice: gebt euer Leben hin
  rationale: ψυχή bezeichnet hier im Zusammenhang der Selbsthingabe das Leben, nicht eigens eine vom Körper unterschiedene Seele. Die deutsche Wendung macht den geforderten Lebenseinsatz verständlich.
- source_word: ὑπὲρ διαθήκης
  choice: für den Bund
  rationale: ὑπέρ bezeichnet hier den Grund beziehungsweise das Ziel der Selbsthingabe. „Für“ ist knapp und idiomatisch; „um … willen“ bleibt als mögliche Verdeutlichung erhalten.
- source_word: πατέρων ἡμῶν
  choice: unserer Väter
  rationale: Die ausdrücklich männliche Bezeichnung der israelitischen Vorväter und ihre bundestheologische Prägung werden bewahrt.
theological_decisions:
- issue: Bedeutung von ψυχή im Aufruf zur Selbsthingabe
  choice: Leben
  alternative: Seele; sich selbst
  rationale: Der Kontext verlangt die Bereitschaft, das eigene Leben für den Bund hinzugeben. „Seele“ könnte eine anthropologische Unterscheidung nahelegen, die der Vers nicht aussagt.
- issue: Geschlechtsspezifische Ahnensprache in πατέρων ἡμῶν
  choice: unserer Väter
  alternative: unserer Vorfahren
  rationale: Die Formulierung bewahrt die ausdrückliche Rede von den Vätern Israels, ohne sie zu verallgemeinern.
- issue: Reichweite von τέκνα in der direkten Anrede
  choice: Kinder
  alternative: Söhne
  rationale: Obwohl Mattatias unmittelbar seine Söhne anspricht, ist τέκνα als Verwandtschaftsbezeichnung weiter als das spezifische griechische Wort für „Söhne“. Die Fußnote hält die kontextuelle Alternative offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Eifert“ bewahrt die eindringliche religiöse Sprache, während „gebt euer Leben hin“ die geforderte Selbsthingabe klar und natürlich ausdrückt.
