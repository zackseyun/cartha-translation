  source_fidelity: 'Der Entwurf gibt die zentralen griechischen Ausdrücke treffend wieder: τέκνα als familiäre Anrede („Kinder“), ζηλώσατε τῷ νόμῳ als eindringlichen Aufruf zum Einsatz für das Gesetz, ψυχάς im Sinn des Lebens und ὑπὲρ διαθήκης πατέρων ἡμῶν als Hingabe für den Bund der Väter. Die bestimmte Form „der Bund“ ist im Makkabäerkontext sachgemäß, ohne eine zusätzliche theologische Festlegung einzutragen.'
