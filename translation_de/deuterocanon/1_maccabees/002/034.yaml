  text: And they said, “We will not come out, nor will we do the king’s word, to profane the Sabbath day.”
translation:
  language: de
  text: 'Und sie sagten: »Wir werden weder herauskommen noch den Befehl des Königs ausführen, den Sabbattag zu entweihen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελευσόμεθα
  choice: wir werden herauskommen
  rationale: Das Futur von ἐξέρχομαι bezeichnet hier das Herauskommen aus dem Versteck. „Herauskommen“ ist im Deutschen natürlich und entspricht der räumlichen Perspektive der Auffordernden.
- source_word: ποιήσομεν τὸν λόγον τοῦ βασιλέως
  choice: den Befehl des Königs ausführen
  rationale: Wörtlich steht „das Wort des Königs tun“. Im Kontext bezeichnet λόγος eine königliche Anordnung; „den Befehl … ausführen“ gibt die idiomatische Bedeutung wieder und bewahrt durch „ausführen“ den Handlungsaspekt von ποιέω.
- source_word: βεβηλῶσαι
  choice: zu entweihen
  rationale: Das Verb bezeichnet, etwas Heiliges profan beziehungsweise gemein zu machen. „Entweihen“ bewahrt den kultisch-religiösen Sinn und ist in modernem Deutsch verständlich.
- source_word: ἡμέραν τῶν σαββάτων
  choice: den Sabbattag
  rationale: Die formal pluralische Wendung ist eine gebräuchliche Bezeichnung für den einzelnen Sabbat. „Sabbattag“ ist eindeutig und gibt den Bezug auf den geheiligten Tag natürlich wieder.
theological_decisions:
- issue: Wiedergabe der Heiligkeitsvorstellung in βεβηλῶσαι τὴν ἡμέραν τῶν σαββάτων
  choice: den Sabbattag zu entweihen
  alternative: den Sabbattag zu entheiligen
  rationale: „Entweihen“ lässt erkennen, dass es um die Verletzung der Heiligkeit des Sabbats geht, nicht bloß um den Verstoß gegen eine religiöse Regel. Zugleich wird keine weitergehende konfessionelle Deutung eingeführt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Paarung „weder … noch“ bildet οὐκ … οὐδὲ knapp und natürlich ab. Der Infinitiv „zu entweihen“ bleibt als inhaltliche Bestimmung des königlichen Befehls erhalten.
