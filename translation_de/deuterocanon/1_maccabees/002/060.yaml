  terminology: „Daniel“ ist die übliche deutsche Namensform. „Lauterkeit“ trifft den positiven ethischen Sinn von ἁπλότης, ohne die mögliche Bedeutungsspanne von Aufrichtigkeit, Einfachheit und ungeteilter Haltung auszuschließen; die Fußnote sichert diese ab.
