translation:
  language: de
  text: Daniel wurde in seiner Lauterkeit[a] aus dem Rachen der Löwen gerettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aufrichtigkeit“, „Einfachheit“ oder „ungeteilte Haltung“. Das griechische Wort kann Aufrichtigkeit, Ungeteiltsein und moralische Integrität bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δανιήλ
  choice: Daniel
  rationale: Die im Deutschen übliche Form des Namens.
- source_word: ἐν τῇ ἁπλότητι αὐτοῦ
  choice: wegen seiner Lauterkeit
  rationale: ἁπλότης bezeichnet hier im anerkennenden Rückblick auf Daniel am ehesten Aufrichtigkeit, ungeteilte Treue und charakterliche Integrität. Die mit ἐν bezeichnete Eigenschaft wird im Zusammenhang als Grund beziehungsweise kennzeichnender Umstand seiner Rettung verstanden; „wegen“ macht diesen Sinn natürlich verständlich.
- source_word: ἐρύσθη
  choice: wurde … gerettet
  rationale: Der passive Aorist bezeichnet die Befreiung aus einer konkreten tödlichen Gefahr; „gerettet“ ist im modernen Deutsch klar und idiomatisch.
- source_word: ἐκ στόματος λεόντων
  choice: aus dem Rachen der Löwen
  rationale: Die griechische Wendung hat wörtlich den Singular „aus dem Mund von Löwen“. „Aus dem Rachen der Löwen“ bewahrt das anschauliche Bild und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung von ἁπλότης bei der Würdigung Daniels
  choice: Lauterkeit
  alternative: Einfachheit; Aufrichtigkeit; ungeteilte Treue
  rationale: „Lauterkeit“ gibt den ethisch positiven Sinn wieder, ohne Daniels Verhalten auf bloße Schlichtheit zu reduzieren. Die Fußnote wahrt die semantische Breite des griechischen Ausdrucks.
- issue: Verhältnis von Daniels Haltung zu seiner Rettung
  choice: wegen seiner Lauterkeit
  alternative: in seiner Lauterkeit
  rationale: Das griechische ἐν kann sowohl einen begleitenden Umstand als auch eine begründende Beziehung ausdrücken. Im Kontext der Reihe vorbildlicher Glaubenstaten liegt eine begründende Nuance nahe; eine dogmatisch weitergehende Aussage über Verdienst ist damit nicht beabsichtigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lauterkeit“ ist leicht gehoben, aber verständlich und entspricht dem knappen, exemplarischen Ton des Verses. Das kräftige Bild „Rachen der Löwen“ vermeidet eine hölzerne Wiedergabe des griechischen Singulars.
