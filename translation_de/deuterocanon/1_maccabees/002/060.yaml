  source_fidelity: Die Wiedergabe von ἁπλότης als „Lauterkeit“ ist im Kontext gut vertretbar und die Rettung „aus dem Rachen der Löwen“ gibt das Bild von ἐκ στόματος λεόντων treffend wieder. „Wegen seiner“ legt jedoch eine eindeutig kausale bzw. verdienstbegründende Beziehung fest, während ἐν τῇ ἁπλότητι αὐτοῦ zunächst die Haltung bzw. den Umstand bezeichnet und die genaue Nuance offenlässt.
