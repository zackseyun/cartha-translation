  yaml_path: translation/deuterocanon/1_maccabees/002/053.yaml
  text: Joseph[a], in the time of his distress, kept the commandment, and became lord of Egypt.
translation:
  language: de
  text: Josef hielt in der Zeit seiner Bedrängnis das Gebot[a] und wurde Herr über Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein Gebot“ oder „den Befehl“. Im Griechischen wird nicht näher bestimmt, welches Gebot gemeint ist; die Formulierung kann Josefs Gehorsam allgemein zusammenfassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν καιρῷ στενοχωρίας αὐτοῦ
  choice: in der Zeit seiner Bedrängnis
  rationale: Die Wendung bewahrt den zeitlichen Bezug und gibt στενοχωρία als bedrängende Notlage wieder, ohne die Aussage auf eine bestimmte einzelne Prüfung einzuengen.
- source_word: ἐφύλαξε
  choice: hielt
  rationale: In Verbindung mit Gebot ist „hielt“ eine natürliche und prägnante deutsche Wiedergabe für treuen Gehorsam.
- source_word: ἐντολήν
  choice: das Gebot
  rationale: Der artikellose griechische Singular nennt kein bestimmtes Gebot. „Das Gebot“ bewahrt den religiös-ethischen Sinn; eine Fußnote weist auf die grammatisch möglichen Alternativen hin.
- source_word: κύριος Αἰγύπτου
  choice: Herr über Ägypten
  rationale: κύριος bezeichnet hier Josefs hohe Autorität, nicht den Gottesnamen. „Herr über Ägypten“ klingt im heutigen Deutsch natürlicher und verdeutlicht den Herrschaftsbereich, ohne den Rang genauer festzulegen.
theological_decisions:
- issue: Bezug von Josefs Gehorsam
  choice: Allgemeine Aussage, dass Josef in seiner Bedrängnis Gottes Gebot treu blieb
  alternative: Konkreter Hinweis auf Josefs Zurückweisung der Frau Potifars als Gehorsam gegenüber einem bestimmten Gebot
  rationale: Der griechische Text bestimmt das Gebot nicht näher. Daher wird die mögliche Anspielung auf Genesis 39 nicht ausdrücklich in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des griechischen Satzes bleibt erhalten; „Herr über Ägypten“ vermeidet eine Verwechslung von κύριος mit einem göttlichen Titel.
