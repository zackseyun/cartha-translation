  terminology: „Völkern“, „Vergeltung“, „Gebote“ und „Gesetz“ sind kontextgerecht. Die Fußnote erklärt die griechische Kognatverbindung, ohne mit „was sie getan haben“ einen nicht ausgedrückten Gegenstand einzuführen.
