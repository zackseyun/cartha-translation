translation:
  language: de
  text: Zahlt den Völkern Vergeltung heim[a] und achtet auf die Gebote des Gesetzes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Erstattet den Völkern Vergeltung.“ Im Griechischen stehen ein Verb und ein stammverwandtes Substantiv nebeneinander und verstärken die Aufforderung. „Völker“ kann hier die umliegenden nichtjüdischen Völker bezeichnen.'
    reason: Die Anmerkung dokumentiert die emphatische Kognatverbindung ἀνταποδίδοτε ἀνταπόδομα sowie den möglichen Kontextumfang von ἔθνη, ohne einen im griechischen Text nicht genannten Gegenstand der Vergeltung hinzuzufügen.
lexical_decisions:
- source_word: ἀνταποδίδοτε ἀνταπόδομα
  choice: Vergeltet …, was sie getan haben
  rationale: Die Verbindung aus Verb und stammverwandtem Objekt fordert eine entsprechende Gegenleistung bzw. Vergeltung. Die natürliche deutsche Wendung bewahrt den wechselseitigen und im Konfliktzusammenhang auch strafenden Sinn, ohne das schwerfällige „vergeltet Vergeltung“ nachzubilden.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: ἔθνη bezeichnet hier die nichtjüdischen Völker im ethnisch-politischen Sinn. „Völker“ wahrt die Breite des griechischen Ausdrucks; „Heiden“ wäre enger und stärker religiös geprägt.
- source_word: προσέχετε εἰς
  choice: richtet euch nach
  rationale: Die Wendung bezeichnet aufmerksame Beachtung. Im Bezug auf Gebote drückt „sich nach etwas richten“ verständlich aus, dass diese ernst genommen und befolgt werden sollen.
- source_word: προστάγματα
  choice: Geboten
  rationale: πρόσταγμα meint Anordnungen oder Befehle. „Gebote“ ist im Gesetzeskontext natürlich, würdig und allgemein verständlich.
- source_word: τοῦ νόμου
  choice: des Gesetzes
  rationale: Gemeint ist das Gesetz Israels, die Tora. Die bestimmte Formulierung „des Gesetzes“ macht diesen Bezug im Kontext hinreichend deutlich.
theological_decisions:
- issue: Wiedergabe von τοῖς ἔθνεσιν
  choice: den Völkern
  alternative: den Heiden
  rationale: „Völker“ erhält sowohl die ethnische als auch die politische Dimension und legt den Ausdruck nicht ausschließlich religiös aus.
- issue: Stärke und Form der Vergeltungsaussage
  choice: Vergeltet den Völkern, was sie getan haben
  alternative: Zahlt den Völkern ihre Vergeltung heim
  rationale: Der gewählte Text wahrt die Aufforderung zur entsprechenden Gegenleistung im kriegerischen Zusammenhang, ohne ἀνταπόδομα durch eine ausdrücklich strafrechtliche oder übermäßig verschärfte Formulierung festzulegen.
- issue: Bedeutung von προσέχετε im Verhältnis zum Gesetz
  choice: richtet euch nach
  alternative: achtet auf
  rationale: „Richtet euch nach“ macht die praktische Verbindlichkeit der Gebote deutlich. Die Fußnote hält die formal nähere Bedeutung „achtet auf“ präsent, weil das griechische Verb zunächst Aufmerksamkeit bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext vermeidet sowohl das veraltete „Heiden“ als auch die unnatürliche Nachbildung der griechischen Kognatverbindung; die Fußnote macht beides transparent.
