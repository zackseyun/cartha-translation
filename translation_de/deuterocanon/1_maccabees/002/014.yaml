base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/014.yaml
  text: And Mattathias and his sons tore their clothes[a], put on sackcloth, and mourned greatly.
translation:
  language: de
  text: Und Mattatias und seine Söhne zerrissen ihre Kleider, legten Sacktuch[a] an und trauerten sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „Säcke“ im Plural; im Deutschen ist „Sacktuch“ als Bezeichnung dieser Trauerkleidung üblich.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέρρηξεν
  choice: zerrissen
  rationale: Das Verb bezeichnet hier das Zerreißen der Kleidung als sichtbares Zeichen von Trauer oder Empörung. Das natürliche deutsche Präteritum im Plural gibt den zusammengesetzten Satzgegenstand wieder, obwohl das Griechische ein Verb im Singular verwendet.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: ihre Kleider
  rationale: Ἱμάτια bezeichnet Kleidung beziehungsweise Gewänder. „Ihre Kleider“ ist im heutigen Deutsch klar und bewahrt den traditionellen Trauergestus.
- source_word: περιεβάλοντο σάκκους
  choice: legten Trauergewänder aus Sacktuch an
  rationale: Wörtliches „umwarfen sich Säcke“ wäre missverständlich. Die Formulierung macht die aus grobem Sacktuch bestehende Trauerkleidung deutlich, ohne anzunehmen, dass sie gewöhnliche Säcke anzogen.
- source_word: ἐπένθησαν
  choice: trauerten
  rationale: Das Verb bezeichnet Trauer beziehungsweise rituelles Klagen; „trauerten“ passt zum Zusammenhang von zerrissenen Kleidern und Sacktuch.
- source_word: σφόδρα
  choice: sehr
  rationale: Das Adverb verstärkt die Aussage, ohne eine nicht ausdrücklich genannte emotionale Färbung wie „bitterlich“ hinzuzufügen.
- source_word: Ματταθίας
  choice: Mattatias
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Namensform gibt den griechischen Eigennamen angemessen wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der drei Trauerhandlungen bleibt erhalten. „Trauergewänder aus Sacktuch“ vermeidet die im Deutschen missverständliche wörtliche Wiedergabe des griechischen Plurals σάκκους.
