base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/007.yaml
  text: And he said[a], “Alas! Why was I born to see the ruin of my people and the ruin of the holy city, and to sit there while it was given into the hand of enemies[b], and the sanctuary into the hand of foreigners?”
translation:
  language: de
  text: 'Und er sagte: „Weh mir! Warum bin ich geboren worden, um den Untergang[a] meines Volkes und die Zerstörung der heiligen Stadt mitanzusehen und dort zu wohnen, während sie in die Hand von Feinden gegeben wurde[b] und das Heiligtum in die Hand von Fremden?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „die Zerschlagungen“, „die Trümmer“ oder „die Verwüstungen meines Volkes“; im Griechischen steht hier eine Pluralform, die das Ausmaß der Verwüstung hervorheben kann.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „in die Hand von Feinden … in die Hand von Fremden“; dies ist eine biblische Wendung für die Auslieferung an ihre Macht.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴμοι
  choice: Weh mir!
  rationale: Die klagende Interjektion wird mit einer im Deutschen verständlichen, würdevollen und emotional gewichtigen Wendung wiedergegeben.
- source_word: ἵνα τί
  choice: Warum
  rationale: Die idiomatische Frage nach Grund oder Zweck lässt sich im Deutschen am natürlichsten mit „Warum“ ausdrücken.
- source_word: ἐγενήθην
  choice: bin ich geboren worden
  rationale: Im Zusammenhang dieser Lebensklage bezeichnet der Aorist von γίνομαι das Ins-Dasein-Kommen; „geboren worden“ gibt den Sinn und die emotionale Kraft wieder.
- source_word: ἰδεῖν
  choice: mitanzusehen
  rationale: „Mitanzusehen“ bewahrt den Sinn von „sehen“ und bringt im Deutschen zugleich die schmerzliche Zeugenschaft zum Ausdruck, ohne eine Erklärung hinzuzufügen.
- source_word: τὰ συντρίμματα τοῦ λαοῦ μου
  choice: den Untergang meines Volkes
  rationale: Das griechische Substantiv bezeichnet Zerschlagung, Trümmer oder Verwüstung. Beim Bezug auf ein Volk ist „Untergang“ natürlich und bezeichnet dessen verheerenden Zustand; die auffällige Pluralform wird in einer Fußnote vermerkt.
- source_word: τὸ σύντριμμα τῆς πόλεως τῆς ἁγίας
  choice: die Zerstörung der heiligen Stadt
  rationale: Bei einer Stadt bezeichnet σύντριμμα ihre Zerschlagung oder Verwüstung. „Zerstörung“ ist hier klares, natürliches Deutsch; „heilige Stadt“ bewahrt die nicht näher erläuterte Bezeichnung des Ausgangstextes.
- source_word: καθίσαι ἐκεῖ
  choice: dort zu sitzen
  rationale: Die konkrete Körperhaltung und das Bild des hilflosen Verharrens bleiben erhalten, ohne Letzteres ausdrücklich in den Text hineinzutragen.
- source_word: ἐν τῷ δοθῆναι αὐτὴν
  choice: während sie ... gegeben wurde
  rationale: Die Konstruktion mit artikuliertem Infinitiv bezeichnet einen gleichzeitigen Umstand. Die passive Form und der Bezug auf die heilige Stadt bleiben erhalten.
- source_word: ἐν χειρὶ ἐχθρῶν
  choice: in die Hand von Feinden
  rationale: Die biblische Macht- und Auslieferungsmetapher wird sichtbar bewahrt statt lediglich mit „unter die Gewalt“ aufgelöst zu werden.
- source_word: τὸ ἁγίασμα
  choice: das Heiligtum
  rationale: Der Ausdruck bezeichnet den geheiligten Ort beziehungsweise Tempelbezirk und wird mit dem geläufigen deutschen Begriff wiedergegeben.
- source_word: ἐν χειρὶ ἀλλοτρίων
  choice: in die Hand von Fremden
  rationale: Die parallele Formulierung des Griechischen wird erhalten; ἀλλότριοι bezeichnet hier Außenstehende beziehungsweise Fremde, ohne dass ihre Identität weiter bestimmt wird.
theological_decisions:
- issue: Bundes- und nationaltheologische Bezeichnungen in der Klage
  choice: „mein Volk“ und „die heilige Stadt“ ohne erläuternde Erweiterung
  alternative: „meine Nation“ beziehungsweise die ausdrückliche Einfügung „Jerusalem“
  rationale: Die griechischen Bezeichnungen tragen bereits theologisches Gewicht. Ihre offene Form wird bewahrt, ohne einen im Ausgangstext nicht genannten Eigennamen oder eine modern-politische Kategorie einzuführen.
- issue: Verhältnis zwischen heiliger Stadt und Heiligtum
  choice: Beide Größen werden entsprechend der elliptischen griechischen Parallelkonstruktion unterschieden
  alternative: Das Heiligtum als bloße nähere Erklärung der Stadt behandeln
  rationale: Der Text beklagt parallel die Übergabe der Stadt an Feinde und die des Heiligtums an Fremde. Diese Spannung und Steigerung soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem erhöhten Klageruf „Weh mir!“. Der Satzbau folgt der langen, sich steigernden Klage des Griechischen, bleibt aber verständlich. Die Hand-Metapher und die parallele Nennung von Stadt und Heiligtum werden bewusst bewahrt.
