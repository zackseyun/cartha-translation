  text: sie selbst, ihre Söhne, ihre Frauen und ihr Vieh; denn die Nöte[a] lasteten schwer auf ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Denn die Übel waren hart über ihnen geworden“; gemeint sind Nöte, Bedrängnisse oder Unheil.'
    reason: Die Fußnote bewahrt die konkrete, ungewöhnliche Ausdrucksweise des Griechischen und nennt den Bedeutungsumfang von τὰ κακά.
lexical_decisions:
- source_word: αὐτοὶ
  choice: sie selbst
  rationale: Das selbstständige αὐτοί nimmt die im vorherigen Zusammenhang genannten Personen wieder auf; „sie selbst“ bewahrt die leichte Hervorhebung.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: ihre Söhne
  rationale: υἱοί bezeichnet ausdrücklich die Söhne und wird nicht verallgemeinernd als „Kinder“ wiedergegeben.
- source_word: αἱ γυναῖκες αὐτῶν
  choice: ihre Frauen
  rationale: Im Haushaltszusammenhang sind die Ehefrauen gemeint; „ihre Frauen“ ist im modernen Deutschen natürlich und ausreichend eindeutig.
- source_word: τὰ κτήνη αὐτῶν
  choice: ihr Vieh
  rationale: κτήνη bezeichnet hier den Bestand an domestizierten Nutztieren; „Vieh“ ist knapp, idiomatisch und umfassend.
- source_word: ἐσκληρύνθη ἐπʼ αὐτοὺς
  choice: lasteten schwer auf ihnen
  rationale: Die wörtliche Vorstellung des Hart- oder Schwerwerdens wird im Deutschen idiomatisch als drückende Belastung ausgedrückt.
- source_word: τὰ κακά
  choice: die Nöte
  rationale: τὰ κακά bezeichnet in diesem Kontext widerfahrene Übel, Bedrängnisse oder Notlagen, nicht notwendig moralisch böse Taten.
