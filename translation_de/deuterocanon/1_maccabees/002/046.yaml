  text: And they circumcised the uncircumcised boys[a], as many as they found within the borders of Israel[b], by force.
translation:
  language: de
  text: Und sie beschnitten alle unbeschnittenen Jungen, die sie im Gebiet Israels[a] fanden, mit Gewalt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „innerhalb der Grenzen Israels“ oder „in den Landstrichen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit Stärke“ oder „mit Macht“; hier ist gewaltsames beziehungsweise erzwungenes Handeln gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέτεμον
  choice: sie beschnitten
  rationale: Der Aorist von περιτέμνω bezeichnet hier eindeutig die Durchführung der Beschneidung; „beschneiden“ ist die natürliche und präzise deutsche Entsprechung.
- source_word: τὰ παιδάρια τὰ ἀπερίτμητα
  choice: alle unbeschnittenen Jungen
  rationale: παιδάριον kann ein Kind oder einen jungen Knaben bezeichnen. Im Zusammenhang mit der Beschneidung ist „Jungen“ treffend, ohne ein genaueres Alter festzulegen. Das substantivierte Attribut ἀπερίτμητα wird natürlich als „unbeschnittenen“ wiedergegeben.
- source_word: ὅσα εὗρεν
  choice: die sie … fanden
  rationale: Das neutrale Pluralpronomen ὅσα umfasst sämtliche entsprechenden Jungen. Obwohl Swetes Text das Verb εὗρεν im Singular bietet, verlangt der unmittelbare Zusammenhang mit dem pluralischen περιέτεμον im Deutschen die natürliche kollektive Wiedergabe „sie fanden“.
- source_word: ἐν ὁρίοις Ἰσραήλ
  choice: im Gebiet Israels
  rationale: ὅρια kann Grenzen, Gebiet oder Landstriche bezeichnen. „Im Gebiet Israels“ bewahrt den territorialen Sinn und klingt im modernen Deutsch natürlich; die möglichen engeren Wiedergaben werden in der Fußnote genannt.
- source_word: ἐν ἰσχύϊ
  choice: mit Gewalt
  rationale: Wörtlich bezeichnet die Wendung Stärke oder Macht; in diesem Handlungskontext drückt sie den gewaltsamen beziehungsweise erzwungenen Vollzug aus. „Mit Gewalt“ macht diesen Sinn deutlich, ohne die Handlung zusätzlich zu bewerten.
theological_decisions:
- issue: Moralische und theologische Wertung der beschriebenen Handlung
  choice: Die Handlung wird nüchtern und ungemildert mit „mit Gewalt“ beschrieben.
  alternative: „mit Kraft“ oder „machtvoll“
  rationale: Die Übersetzung soll den Zwangscharakter von ἐν ἰσχύϊ nicht abschwächen, zugleich aber weder Zustimmung noch Verurteilung hinzufügen, die über die Aussage des Textes hinausginge.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Erzählweise des griechischen Textes bleibt erhalten; der Zwangscharakter der Handlung wird nicht beschönigt.
