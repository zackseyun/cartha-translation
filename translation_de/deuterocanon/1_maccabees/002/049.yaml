base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/049.yaml
  text: And the days drew near for Mattathias to die[a], and he said to his sons, “Now arrogance and reproach have grown strong[b], and it is a time of ruin and furious wrath.”
translation:
  language: de
  text: 'Als nun für Mattatias die Zeit zu sterben nahte, sagte er zu seinen Söhnen: »Jetzt haben sich Hochmut und Schmach festgesetzt[a]; es ist eine Zeit des Verderbens und des Zornes voller Wut[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sind stark geworden« beziehungsweise »haben sich fest etabliert«.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich stehen hier zwei eng verwandte griechische Wörter für Zorn und Wut. Der Text sagt nicht, wessen Zorn gemeint ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν αἱ ἡμέραι τοῦ Ματταθίου ἀποθανεῖν
  choice: Als nun für Mattatias die Zeit zu sterben nahte
  rationale: Gibt die griechische Zeitformel natürlich und würdevoll wieder, bewahrt aber das Bild der nahenden Todeszeit.
- source_word: ἐστηρίχθη
  choice: haben sich ... festgesetzt
  rationale: Der Aorist Passiv bezeichnet hier einen eingetretenen, nun bestehenden Zustand; »festgesetzt« lässt das feste Etabliertsein der genannten Übel erkennen.
- source_word: ὑπερηφανία
  choice: Hochmut
  rationale: Bezeichnet überheblichen, moralisch verwerflichen Stolz und ist im Deutschen klar und bibelsprachlich vertraut.
- source_word: ἔλεγμος
  choice: Schmach
  rationale: Im Zusammenhang bezeichnet das Wort eher einen Zustand öffentlicher Schande oder Entehrung als einen korrigierenden Tadel.
- source_word: καιρὸς καταστροφῆς
  choice: eine Zeit des Verderbens
  rationale: »Zeit« gibt καιρός in diesem Krisenzusammenhang angemessen wieder; »Verderben« bewahrt den bedrohlichen Sinn von καταστροφή, ohne den Vorgang unnötig festzulegen.
- source_word: ὀργὴ θυμοῦ
  choice: Zorn voller Wut
  rationale: Die Verbindung zweier eng verwandter Zornbegriffe wird bewusst hörbar gehalten, statt sie auf ein einziges Adjektiv zu reduzieren.
theological_decisions:
- issue: Wessen Zorn mit ὀργὴ θυμοῦ gemeint ist
  choice: Kein Urheber des Zorns wird genannt.
  alternative: Den Ausdruck ausdrücklich als Gottes Zorn oder als menschliche Wut deuten.
  rationale: Der griechische Text lässt offen, ob göttlicher Zorn, menschliche Raserei oder allgemeiner Zorn in der Krisenzeit gemeint ist; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Zeitformel ist idiomatisch geglättet; die markante Häufung der Zornbegriffe und die Uneindeutigkeit ihres Urhebers bleiben erhalten.
