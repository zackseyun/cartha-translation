  text: And seeing the blasphemies being committed in Judah and in Jerusalem,
translation:
  language: de
  text: Und als er die Lästerungen sah, die in Juda[a] und Jerusalem begangen wurden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Judäa.'
    reason: Ἰούδα kann hier sowohl traditionsnah mit „Juda“ als auch als geografische Gebietsbezeichnung mit „Judäa“ wiedergegeben werden.
lexical_decisions:
- source_word: ἰδών
  choice: als er … sah
  rationale: Der Aoristpartizip von ὁράω wird als natürlicher deutscher Temporalsatz wiedergegeben. Die Form wahrt die Verknüpfung mit der im Kontext folgenden Reaktion, ohne eine weitergehende zeitliche Abstufung einzutragen.
- source_word: βλασφημίας
  choice: Lästerungen
  rationale: Die direkte Entsprechung bewahrt den religiösen Ernst des griechischen Ausdrucks. „Freveltaten“ oder „Heiligtumsschändungen“ wären im Kontext möglich, würden die Bedeutung aber stärker auslegen und verengen.
- source_word: τὰς γινομένας
  choice: die … begangen wurden
  rationale: Das Präsenspartizip beschreibt die dort stattfindenden Handlungen. Bei schuldhaften Taten ist „begangen wurden“ im Deutschen idiomatischer als das wörtliche „geschahen“.
- source_word: ἐν Ἰούδᾳ
  choice: in Juda
  rationale: „Juda“ bewahrt die traditionelle territoriale und ethnische Resonanz der griechischen Namensform; die geografische Wiedergabe „Judäa“ bleibt möglich und wird in einer Fußnote genannt.
- source_word: ἐν Ἱερουσαλήμ
  choice: in Jerusalem
  rationale: Übliche deutsche Wiedergabe des Ortsnamens; eine bedeutungsrelevante Mehrdeutigkeit liegt nicht vor.
theological_decisions:
- issue: Wiedergabe von βλασφημίας im Zusammenhang religiöser Entweihung
  choice: Lästerungen
  alternative: Freveltaten; Heiligtumsschändungen
  rationale: „Lästerungen“ erhält den ausdrücklichen religiösen Charakter des Vergehens, ohne den Oberbegriff auf eine bestimmte Form der Entweihung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt entsprechend dem griechischen Satzbau als mit dem folgenden Kontext verbundener Nebensatz offen und endet daher mit einem Komma.
