translation:
  language: de
  text: Und ihr, Kinder, seid stark und zeigt euch als Männer[b] in eurem Gesetz, denn in ihm werdet ihr verherrlicht werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werdet ihr geehrt werden« oder »werdet ihr Ruhm erlangen«.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich verwendet das Griechische ein männliches Bild: »zeigt euch als Männer«; sinngemäß: »seid mutig«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Kinder
  rationale: Das allgemeine Wort bezeichnet Kinder bzw. Nachkommen und ist nicht auf Söhne verengt.
- source_word: ἰσχύετε
  choice: seid stark
  rationale: Der Imperativ fordert zu anhaltender Stärke und Standhaftigkeit auf; die Wendung ist im Deutschen natürlich.
- source_word: ἀνδρίζεσθε
  choice: zeigt euch als Männer
  rationale: Die Wiedergabe bewahrt das ausdrücklich männliche Bild des griechischen Verbs und zugleich seinen Aufruf zu mutigem Handeln.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: in eurem Gesetz
  rationale: Die Formulierung erhält sowohl die durch ἐν bezeichnete Sphäre als auch das ausdrücklich gesetzte Possessivpronomen.
- source_word: δοξασθήσεσθε
  choice: werdet ihr verherrlicht werden
  rationale: Die passive Zukunftsform und der Bezug auf Herrlichkeit bleiben erhalten, ohne den nicht genannten Handelnden oder die Art der Ehrung festzulegen.
theological_decisions:
- issue: Männliche Bildsprache in ἀνδρίζεσθε
  choice: zeigt euch als Männer
  alternative: seid mutig
  rationale: Die ausdrückliche männliche Metaphorik des Ausgangstextes wird nicht eingeebnet; die idiomatische Bedeutung wird in einer Fußnote erläutert.
- issue: Bedeutung und Agens von δοξασθήσεσθε
  choice: werdet ihr verherrlicht werden
  alternative: werdet ihr geehrt werden / werdet ihr Ruhm erlangen
  rationale: Das Passiv lässt offen, von wem und in welcher Weise die Verherrlichung oder Ehrung erfolgt, und bewahrt damit die theologische Spannung.
- issue: Bezug von ἐν αὐτῷ
  choice: durch dieses
  alternative: in ihm
  rationale: Das Pronomen bezieht sich grammatisch auf das Gesetz. Die instrumentale deutsche Wiedergabe gibt den wahrscheinlichen Sinn verständlich wieder, ohne die Ursache näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede »Kinder« und das Possessiv »euer« bleiben erhalten. Die ungewöhnliche männliche Bildsprache wird im Haupttext bewusst bewahrt und erläutert.
