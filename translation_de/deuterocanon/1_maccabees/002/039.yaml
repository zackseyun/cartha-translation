  text: And Mattathias and his friends learned of it, and they mourned for them very greatly.
translation:
  language: de
  text: Als Mattatias und seine Freunde davon erfuhren, trauerten sie sehr um sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: davon erfuhren
  rationale: Der Aorist von γινώσκω bezeichnet hier das Bekanntwerden des unmittelbar zuvor berichteten Geschehens. „Davon erfuhren“ gibt diesen ingressiven Sinn im Deutschen natürlich wieder.
- source_word: οἱ φίλοι αὐτοῦ
  choice: seine Freunde
  rationale: φίλοι kann Freunde oder enge Gefährten bezeichnen. „Seine Freunde“ ist die direkte, kontextgerechte Wiedergabe, ohne den Kreis genauer festzulegen als der griechische Text.
- source_word: ἐπένθησαν
  choice: trauerten
  rationale: Das Verb bezeichnet Trauer, besonders angesichts von Todesfällen. „Trauerten“ trifft hier sowohl Bedeutung als auch Erzählkontext.
- source_word: ἐπʼ αὐτούς
  choice: um sie
  rationale: ἐπί mit Akkusativ bezeichnet bei einem Verb des Trauerns die Personen, denen die Trauer gilt. Die idiomatische deutsche Verbindung lautet „um sie trauern“.
- source_word: ἕως σφόδρα
  choice: sehr
  rationale: Die ungewöhnlich starke griechische Intensivierung hebt das Ausmaß der Trauer hervor. „Sehr“ klingt in modernem Deutsch würdig und natürlich; schwerfälligere Formulierungen wie „überaus sehr“ würden die Form stärker spiegeln, aber den Stil beeinträchtigen.
