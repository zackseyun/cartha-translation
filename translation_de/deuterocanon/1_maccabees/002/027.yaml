  naturalness: „Mit lauter Stimme“ und „am Bund festhält“ sind idiomatisch und dem feierlich-aufrufenden Register angemessen. „Soll mir nach hinausziehen“ ist verständlich, aber weniger natürlich als eine Formulierung mit „folgen“ und „nach draußen“.
  terminology: „Gesetz“ und „Bund“ geben νόμος und διαθήκη im jüdischen Kontext präzise und ohne konfessionelle Überdeutung wieder. „Für das Gesetz eifert“ bewahrt die Intensität von ζηλῶν.
