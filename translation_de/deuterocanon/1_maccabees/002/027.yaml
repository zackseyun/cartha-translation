  yaml_path: translation/deuterocanon/1_maccabees/002/027.yaml
  text: And Mattathias cried out in the city with a loud voice, saying, “Everyone who is zealous for the law and upholds the covenant, let him come out after me.”
translation:
  language: de
  text: 'Und Mattatias rief in der Stadt mit lauter Stimme: »Jeder, der für das Gesetz eifert und am Bund festhält, soll mir nach draußen folgen!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκραξεν
  choice: rief
  rationale: Das Verb bezeichnet einen kräftigen öffentlichen Ausruf. Im Deutschen vermittelt „rief“ zusammen mit „mit lauter Stimme“ die Intensität natürlich, ohne sie durch ein zusätzliches „schrie“ zu überzeichnen.
- source_word: ἐν τῇ πόλει
  choice: in der Stadt
  rationale: Die Wendung ist örtlich zu verstehen und wird unmittelbar wiedergegeben.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die konkrete Ausdrucksweise des griechischen Dativs bleibt in einer geläufigen deutschen Wendung erhalten.
- source_word: Πᾶς ὁ ζηλῶν τῷ νόμῳ
  choice: Jeder, der für das Gesetz eifert
  rationale: „Für das Gesetz eifern“ gibt die leidenschaftliche Bindung wieder, die ζηλόω mit dem Dativ ausdrückt, und bewahrt den religiös-bundestheologischen Klang.
- source_word: νόμῳ
  choice: das Gesetz
  rationale: Gemeint ist die Tora beziehungsweise das Gesetz Israels. Die Großschreibung kennzeichnet im Deutschen diesen bestimmten religiösen Bezug.
- source_word: ἱστῶν διαθήκην
  choice: am Bund festhält
  rationale: Das Partizip von ἵστημι bezeichnet hier das Aufrechterhalten beziehungsweise treue Festhalten am bereits bestehenden Bund, nicht dessen erstmalige Stiftung.
- source_word: διαθήκην
  choice: am Bund
  rationale: Obwohl im Griechischen kein Artikel steht, ist aus dem Zusammenhang der Bund Israels mit Gott gemeint; die bestimmte Form ist im Deutschen sachgerecht.
- source_word: ἐξελθέτω ὀπίσω μου
  choice: soll mir nach hinausziehen
  rationale: „Hinausziehen“ bewahrt den konkreten Bewegungssinn von ἐξέρχομαι, während „mir nach“ ὀπίσω μου eng wiedergibt und zugleich Mattatias’ Aufruf zum gemeinsamen Aufbruch natürlich formuliert.
theological_decisions:
- issue: Wiedergabe von διαθήκη im jüdischen Bundeskontext
  choice: der Bund
  alternative: ein Bund / Bund
  rationale: Der Kontext verweist auf Israels bestehenden Bund mit Gott. Die bestimmte Form macht diesen Bezug deutlich, ohne zusätzliche dogmatische Festlegungen einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit öffentlichem Aufrufcharakter. Die Satzstruktur bleibt nahe am Griechischen, wird aber im Deutschen idiomatisch gestrafft. „Hinausziehen“ erhält sowohl das tatsächliche Verlassen der Stadt als auch den gemeinschaftlichen Aufbruch, ohne das Verb auf ein bloßes „folgen“ zu reduzieren.
