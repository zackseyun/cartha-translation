  to: 'Und Mattatias antwortete und sagte mit lauter Stimme: »Auch wenn alle Völker im Herrschaftsbereich des Königs[a] auf ihn hören[b], jeder sich vom Gottesdienst seiner Vorfahren abwendet, und sie sich für seine Gebote entschieden haben,«'
