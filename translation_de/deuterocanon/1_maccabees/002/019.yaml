  yaml_path: translation/deuterocanon/1_maccabees/002/019.yaml
  text: And Mattathias answered and said with a loud voice[a], “Even if all the nations in the kingdom of the king listen to him, each one turning away from the worship of his fathers[b], and have chosen his commandments,”
translation:
  language: de
  text: 'Und Mattatias antwortete und sagte mit lauter Stimme: »Auch wenn alle Völker im Herrschaftsbereich des Königs[a] auf ihn hören[b], jeder sich vom Gottesdienst seiner Vorfahren abwendet, und sie sich für seine Gebote entschieden haben,«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »im Haus des Königreichs des Königs«. Die griechische Wendung ist ungewöhnlich formuliert und kann den Herrschaftsbereich des Königs bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihm gehorchen«. Im Griechischen steht wörtlicher »auf ihn hören«; der Zusammenhang schließt Gehorsam ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die Wendung gibt das griechische Idiom anschaulich und zugleich natürlich im Deutschen wieder.
- source_word: ἔθνη
  choice: Völker
  rationale: Gemeint sind die verschiedenen Völker unter der Herrschaft des Königs; „Völker“ ist hier sachlich und vermeidet die enger religiös gefärbte Wiedergabe „Heiden“.
- source_word: οἴκῳ τῆς βασιλείας τοῦ βασιλέως
  choice: im Herrschaftsbereich des Königs
  rationale: Die ungewöhnliche griechische Wortfolge bezeichnet offenbar den vom König beherrschten Bereich. Die Wiedergabe ist verständlich, ohne sie auf die Dynastie oder den königlichen Haushalt einzuengen.
- source_word: ἀκούουσιν αὐτοῦ
  choice: auf ihn hören
  rationale: Dies bewahrt die Grundbedeutung „hören/auf jemanden hören“; dass damit Gehorsam verbunden ist, ergibt sich aus dem Zusammenhang.
- source_word: ἀποστῆναι
  choice: sich … abwendet
  rationale: Die Formulierung bezeichnet das Verlassen der bisherigen religiösen Praxis, ohne den späteren theologischen Fachbegriff „abfallen“ aufzudrängen.
- source_word: λατρίας πατέρων αὐτοῦ
  choice: von der Gottesverehrung seiner Vorfahren
  rationale: λατρεία bezeichnet hier kultischen beziehungsweise religiösen Dienst. „Gottesverehrung“ gibt diesen Sinn klarer wieder als das allgemeinere „Dienst“.
- source_word: ᾑρετίσαντο ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: sie sich für seine Gebote entschieden haben
  rationale: Die Wiedergabe erhält den Gedanken bewusster Wahl und lässt zugleich erkennen, dass die königlichen Anordnungen angenommen werden.
theological_decisions:
- issue: Bedeutung von ἀκούουσιν im Verhältnis von Hören und Gehorchen
  choice: auf ihn hören
  alternative: ihm gehorchen
  rationale: Der Zusammenhang schließt Gehorsam ein, doch das griechische Verb bezeichnet zunächst das Hören. Die gewählte Formulierung bewahrt beide Ebenen.
- issue: Wiedergabe der Abkehr von der λατρεία der Vorfahren
  choice: sich von der Gottesverehrung seiner Vorfahren abwendet
  alternative: vom Glauben seiner Vorfahren abfällt
  rationale: Der Ausgangstext spricht konkret von kultischer Verehrung, nicht ausdrücklich vom umfassenderen Begriff „Glauben“. Die Übersetzung vermeidet daher eine theologische Ausweitung.
- issue: Ungewöhnliche Bezeichnung des königlichen Herrschaftsgebiets
  choice: im Herrschaftsbereich des Königs
  alternative: im Haus des Königreichs des Königs
  rationale: Eine wörtliche Nachbildung wäre im Deutschen kaum verständlich und könnte fälschlich an ein Gebäude oder eine Dynastie denken lassen. Eine Fußnote macht die auffällige Form des Griechischen transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als mit „auch wenn“ eingeleiteter und noch nicht abgeschlossener Bedingungssatz offen, da die Antwort im folgenden Vers weitergeht. Der Wechsel von „jeder“ zum pluralischen „sie“ folgt der auffälligen Numerusbewegung des griechischen Textes.
