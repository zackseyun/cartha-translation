  text: in die Stadt[a], um Opfer darzubringen. Und viele aus Israel kamen zu ihnen[b], und Mattatias und seine Söhne versammelten sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte griechische Text dieses Verses setzt mitten im Satz ein. „In die Stadt“ führt daher den vorhergehenden Satzteil weiter und ist kein eigenständiger Satzanfang.
    reason: textual_variant
