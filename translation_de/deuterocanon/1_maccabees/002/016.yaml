    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν πόλιν
  choice: in die Stadt
  rationale: Der Akkusativ bezeichnet nach dem vorangehenden, hier nicht mitgelieferten Satzteil das Ziel einer Bewegung. Das deutsche „in die Stadt“ gibt diese Richtung natürlich wieder, ohne den fehlenden Satzanfang zu rekonstruieren.
- source_word: ἵνα θυσιάσωσιν
  choice: damit sie Opfer darbrächten
  rationale: ἵνα mit Konjunktiv bezeichnet den Zweck. „Opfer darbringen“ trifft den kultischen Sinn von θυσιάζω; der Konjunktiv „darbrächten“ bindet den Zweckssatz an die vergangene Erzählung.
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: viele aus Israel
  rationale: Die Formulierung bleibt nahe an der Herkunfts- bzw. Zugehörigkeitsangabe mit ἀπό und vermeidet eine weitergehende Präzisierung.
- source_word: πρὸς αὐτοὺς προσῆλθαν
  choice: kamen zu ihnen
  rationale: Die Wendung bezeichnet zunächst eine Bewegung auf Personen zu. Im Zusammenhang kann sie zugleich eine Hinwendung zu ihrer Seite andeuten; die Hauptübersetzung lässt diese Bedeutungsbreite bestehen.
- source_word: συνήχθησαν
  choice: wurden versammelt
  rationale: Die passive Form wird ausdrücklich bewahrt. So wird nicht entschieden, ob lediglich ein Zusammenkommen oder ein Versammeltwerden durch andere im Vordergrund steht.
theological_decisions:
- issue: Politisch-religiöse Parteinahme in πρὸς αὐτοὺς προσῆλθαν
  choice: kamen zu ihnen
  alternative: schlossen sich ihnen an / gingen zu ihnen über
  rationale: Der Kontext legt eine Parteinahme für die königlichen Beauftragten nahe, doch die griechische Wendung benennt wörtlich eine Bewegung zu ihnen hin. Die zurückhaltende Wiedergabe bewahrt die Spannung, ohne eine ausdrückliche Loyalitätserklärung in den Text einzutragen.
- issue: Handlungsträger bei συνήχθησαν
  choice: wurden versammelt
  alternative: versammelten sich / kamen zusammen
  rationale: Die passive Gestalt des griechischen Verbs bleibt sichtbar. Damit wird ein möglicher äußerer Handlungsträger weder behauptet noch durch eine reflexive Form ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Anfang des bereitgestellten griechischen Zeugnisses wird beibehalten. Die kultische Sprache bleibt mit „Opfer darbringen“ klar und geläufig; interpretative Zuspitzungen bei der Parteinahme werden in die Fußnote verwiesen.
