base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/070.yaml
  text: And he died in the one hundred forty-sixth year[a], and his sons buried him in the tombs of his fathers at Modein, and all Israel mourned for him with great mourning.
translation:
  language: de
  text: Und er starb im hundertsechsundvierzigsten Jahr[a]. Seine Söhne begruben ihn in den Gräbern seiner Väter in Modeïn, und ganz Israel hielt große Totenklage um ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich das hundertsechsundvierzigste Jahr der seleukidischen Ära.
    reason: Historische Erläuterung der im griechischen Text nicht ausdrücklich benannten Zeitrechnung.
lexical_decisions:
- source_word: ἀπέθανεν
  choice: starb
  rationale: Die schlichte, direkte Wiedergabe entspricht dem griechischen Aorist und vermeidet einen nicht vorhandenen Euphemismus.
- source_word: ἐν τῷ ἕκτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: im hundertsechsundvierzigsten Jahr
  rationale: Die deutsche Ordinalzahl gibt die griechische Datierungsformel natürlich und vollständig wieder, ohne die im Text nicht genannte Ära zu ergänzen.
- source_word: ἔθαψαν
  choice: begruben
  rationale: Dies ist die genaue und geläufige deutsche Entsprechung des gewöhnlichen Verbs für eine Bestattung.
- source_word: ἐν τάφοις πατέρων αὐτοῦ
  choice: in den Gräbern seiner Väter
  rationale: Die Formulierung bewahrt sowohl den Plural τάφοις als auch die konkrete Verwandtschaftsbezeichnung πατέρων, die hier die Vorfahren einschließen kann.
- source_word: Μωδεείν
  choice: Modeïn
  rationale: Die Form folgt einer im Deutschen gebräuchlichen Wiedergabe des Ortsnamens; das Trema verdeutlicht, dass die beiden Vokale getrennt gesprochen werden.
- source_word: ἐκόψαντο … κοπετὸν μέγαν
  choice: hielt große Totenklage
  rationale: Die Verbindung aus Verb und stammverwandtem Akkusativ bezeichnet nachdrückliche, möglicherweise rituelle Trauer. „Totenklage halten“ ist im Deutschen idiomatisch und bewahrt diesen konkreteren Sinn, ohne eine einzelne Trauergeste festzulegen.
- source_word: πᾶς Ἰσραήλ
  choice: ganz Israel
  rationale: Die geläufige kollektive Wendung bezeichnet Israel als Ganzes und entspricht der knappen Ausdrucksweise des Griechischen.
theological_decisions:
- issue: Bezug der chronologischen Angabe
  choice: Die Datierung steht im Haupttext nur als „im hundertsechsundvierzigsten Jahr“.
  alternative: „im hundertsechsundvierzigsten Jahr der seleukidischen Ära“
  rationale: Der griechische Text nennt die Ära nicht. Die historisch wahrscheinliche Einordnung wird deshalb als Erläuterung in die Fußnote gesetzt, statt sie in den Bibeltext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aussage „starb“ vermeidet Beschönigung; „Totenklage“ hält den historischen Trauerkontext erkennbar. Die langen griechischen Satzreihen werden zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
