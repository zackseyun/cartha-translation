  text: Caleb[a], when he testified before the assembly, received the land as an inheritance.
translation:
  language: de
  text: Kaleb erhielt, als er vor der Versammlung Zeugnis ablegte[a], das Land als Erbbesitz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: als er der Versammlung gegenüber Zeugnis ablegte.'
    reason: Die Dativkonstruktion kann stärker als Angabe des Adressaten wiedergegeben werden; „vor der Versammlung“ hebt dagegen den öffentlichen Rahmen hervor.
lexical_decisions:
- source_word: Χαλὲβ
  choice: Kaleb
  rationale: Der Eigenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: ἐν τῷ ἐπιμαρτυρῆσαι
  choice: als er … Zeugnis ablegte
  rationale: Die Verbindung aus ἐν und substantiviertem Aoristinfinitiv bezeichnet hier natürlich einen zeitlichen Begleitumstand. „Zeugnis ablegen“ bewahrt den Sinn des Bezeugens, ohne unnötig juristisch zu klingen.
- source_word: τῇ ἐκκλησίᾳ
  choice: vor der Versammlung
  rationale: Gemeint ist die versammelte Gemeinschaft Israels. „Vor der Versammlung“ gibt den Adressaten beziehungsweise den öffentlichen Rahmen des Zeugnisses in natürlichem Deutsch wieder.
- source_word: ἔλαβε
  choice: erhielt
  rationale: Das Verb bezeichnet hier, dass Kaleb in den Besitz des zugeteilten Landes kam; „erhielt“ passt zum folgenden Erbwort besser als „nahm“.
- source_word: γῆν
  choice: das Land
  rationale: Obwohl das griechische Substantiv ohne Artikel steht, ist das verheißene und Kaleb zugeteilte Land gemeint; der bestimmte Artikel ist im Deutschen idiomatisch.
- source_word: κληρονομίαν
  choice: als Erbbesitz
  rationale: „Erbbesitz“ bezeichnet ein als Erbe oder bleibendes Erbteil zugeteiltes Gut und gibt den prädikativen Sinn knapp wieder.
theological_decisions:
- issue: Bedeutung von ἐκκλησία im jüdischen geschichtlichen Kontext
  choice: Versammlung
  alternative: Gemeinde; Kirche
  rationale: Hier bezeichnet ἐκκλησία die versammelte Gemeinschaft Israels. „Versammlung“ vermeidet die anachronistische Einengung auf die christliche Kirche und lässt zugleich den Gemeinschaftsbezug bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt den engen Zusammenhang zwischen Kalebs Zeugnis und dem Empfang des Landes, ohne den zeitlichen Ausdruck ausdrücklich kausal umzudeuten.
