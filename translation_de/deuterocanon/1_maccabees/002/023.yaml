  yaml_path: translation/deuterocanon/1_maccabees/002/023.yaml
  text: And as soon as he had finished speaking these words[a], a Jewish man came forward in the sight of all to offer sacrifice on the altar in Modein, according to the king's command.
translation:
  language: de
  text: Als er diese Worte zu Ende gesprochen hatte, trat vor den Augen aller ein jüdischer Mann[a] heran, um auf dem Altar in Modeïn nach dem Befehl des Königs zu opfern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Jude« beziehungsweise »ein judäischer Mann«. Das griechische Wort Ἰουδαῖος kann die jüdische Zugehörigkeit oder die Herkunft aus Judäa bezeichnen; im Zusammenhang ist wahrscheinlich die jüdische Zugehörigkeit gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐπαύσατο λαλῶν τοὺς λόγους τούτους
  choice: Als er diese Worte zu Ende gesprochen hatte
  rationale: Die Formulierung gibt die zeitliche Abfolge und das Beenden des Redens in natürlichem, würdigem Deutsch wieder, ohne ὡς unnötig auf ein ausdrücklich betontes »sobald« festzulegen.
- source_word: προσῆλθεν
  choice: trat … heran
  rationale: Das Verb bezeichnet hier das öffentliche Herantreten des Mannes zum Altar und in die sichtbare Handlung hinein.
- source_word: ἀνὴρ Ἰουδαῖος
  choice: ein jüdischer Mann
  rationale: Die Wiedergabe bewahrt das männliche Singularwort ἀνήρ und versteht Ἰουδαῖος im Zusammenhang vornehmlich als Bezeichnung jüdischer Zugehörigkeit; die mögliche regionale Nuance wird in einer Fußnote offengehalten.
- source_word: ἐν ὀφθαλμοῖς πάντων
  choice: vor den Augen aller
  rationale: Die idiomatische Wendung bewahrt das anschauliche Bild des griechischen Ausdrucks und macht die Öffentlichkeit der Handlung deutlich.
- source_word: θυσιάσαι ἐπὶ τοῦ βωμοῦ
  choice: um auf dem Altar … zu opfern
  rationale: Der finale Infinitiv wird als Zweckangabe wiedergegeben; »opfern« bezeichnet die kultische Handlung knapp und eindeutig.
- source_word: ἐν Μωδεείμ
  choice: in Modeïn
  rationale: Die Ortsbezeichnung folgt einer im Deutschen gebräuchlichen, an der griechischen Form orientierten Schreibweise.
- source_word: κατὰ τὸ πρόσταγμα τοῦ βασιλέως
  choice: nach dem Befehl des Königs
  rationale: πρόσταγμα bezeichnet eine verbindliche königliche Anordnung; »Befehl« gibt deren autoritativen Charakter klar wieder.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαῖος
  choice: jüdischer Mann
  alternative: Jude beziehungsweise judäischer Mann
  rationale: Im Zusammenhang steht die ethnisch-religiöse und gemeinschaftliche Zugehörigkeit unter königlichem Druck im Vordergrund. Da Ἰουδαῖος zugleich eine Herkunft aus Judäa bezeichnen kann, wird diese echte lexikalische Mehrdeutigkeit nicht verschwiegen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die bildhafte Wendung »vor den Augen aller« bleibt erhalten; Satzbau und Wortwahl sind natürlich, ohne die kultische und politische Aussage des griechischen Textes abzuschwächen.
