  text: Elijah[a], in his zeal for the law, was taken up into heaven.
translation:
  language: de
  text: Elija trat mit Eifer für das Gesetz ein und wurde gleichsam[a] in den Himmel aufgenommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Himmel“. Das griechische Wort ὡς („wie“, „gleichsam“) kann die Aussage abschwächen oder die Art des Geschehens kennzeichnen.'
    reason: Alternative Wiedergabe der vergleichenden Nuance von ὡς.
lexical_decisions:
- source_word: Ἠλίας
  choice: Elija
  rationale: Übliche moderne deutsche Namensform für den Propheten.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον νόμου
  choice: trat mit Eifer für das Gesetz ein
  rationale: Die Formulierung gibt den Umstand des Eiferns natürlich wieder und lässt das verstärkende Zusammenspiel von ζηλῶσαι und ζῆλον durch „mit Eifer … eintreten“ erkennen, ohne die Beziehung ausdrücklich als Ursache festzulegen.
- source_word: νόμου
  choice: für das Gesetz
  rationale: Im makkabäischen Zusammenhang ist das jüdische Gesetz, die Tora, gemeint. Die Kleinschreibung wird vom Griechischen nicht entschieden.
- source_word: ἀνελήμφθη
  choice: wurde … aufgenommen
  rationale: Das Passiv von ἀναλαμβάνω bezeichnet hier ein Aufgenommen- beziehungsweise Hinaufgenommenwerden; die Zielangabe vermittelt bereits die Aufwärtsbewegung.
- source_word: ὡς εἰς τὸν οὐρανόν
  choice: gleichsam in den Himmel
  rationale: „Gleichsam“ bildet ὡς ausdrücklich ab und bewahrt dessen vergleichende oder charakterisierende Nuance, ohne es zu einem irrealen „als ob“ zu verstärken.
theological_decisions:
- issue: Wie ὡς bei der Aufnahme Elijas wiederzugeben ist
  choice: Die vergleichende Nuance wird mit „gleichsam“ im Haupttext bewahrt.
  alternative: „in den Himmel“ ohne Wiedergabe von ὡς
  rationale: Das griechische ὡς kann die Aussage abschwächen oder charakterisieren. Seine ausdrückliche Wiedergabe wahrt die genuine Unbestimmtheit, statt das Ziel uneingeschränkt festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Trat mit Eifer … ein“ ist verständlicher als eine wörtliche Nachbildung des griechischen verwandten Verbs und Substantivs; „gleichsam“ erhält zugleich die auffällige Einschränkung des Ausgangstextes.
