  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes zuverlässig wieder: Elija als Subjekt, seinen Eifer für das Gesetz als begleitenden Umstand, das passive Aufgenommenwerden und die durch ὡς markierte vergleichende bzw. abschwächende Nuance. „Gleichsam“ ist eine vertretbare ausdrückliche Wiedergabe von ὡς und legt keine weitergehende Deutung fest.'
