  yaml_path: translation/deuterocanon/1_maccabees/002/041.yaml
  text: And on that day they decided, saying, “If any man comes against us for battle on the Sabbath day, we will fight against him, and we will certainly not all die as our brothers died in the hiding places.”
translation:
  language: de
  text: 'An jenem Tag fassten sie folgenden Beschluss: »Wenn jemand am Sabbat gegen uns zum Kampf anrückt, werden wir gegen ihn kämpfen, und wir werden gewiss nicht alle sterben, wie unsere Brüder in den Verstecken gestorben sind.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: fassten sie folgenden Beschluss
  rationale: Gibt die gemeinsame Beratung mit ihrem verbindlichen Ergebnis in natürlichem, würdigem Deutsch wieder.
- source_word: Πᾶς ἄνθρωπος ὃς ἐὰν ἔλθῃ
  choice: Wenn jemand … zieht
  rationale: Die griechische verallgemeinernde Bedingung wird idiomatisch als offener Bedingungssatz wiedergegeben; das generische ἄνθρωπος erfordert im Deutschen kein geschlechtsspezifisches »Mann«.
- source_word: εἰς πόλεμον
  choice: in den Kampf
  rationale: Bezeichnet hier das feindliche Vorgehen mit Kampfabsicht, nicht allgemein einen länger dauernden Krieg.
- source_word: πολεμήσομεν κατέναντι αὐτοῦ
  choice: werden wir gegen ihn kämpfen
  rationale: Bewahrt die entschlossene Reaktion und die Ausrichtung gegen den Angreifer.
- source_word: οὐ μὴ ἀποθάνωμεν πάντες
  choice: Wir wollen nicht alle sterben
  rationale: Gibt die starke Verneinung im Zusammenhang eines gefassten Beschlusses idiomatisch wieder, ohne sie als bloße Vorhersage zu verengen.
- source_word: ἐν τοῖς κρυφοῖς
  choice: in den Verstecken
  rationale: Bewahrt die konkrete Ortsangabe; der Kontext meint verborgene Zufluchtsorte.
theological_decisions:
- issue: Kampf am Sabbat
  choice: Die Aussage wird als ausdrücklicher gemeinschaftlicher Beschluss zur Gegenwehr übersetzt.
  alternative: Eine allgemeine Aufhebung oder Neuordnung des Sabbatgebots sprachlich anzudeuten.
  rationale: Der griechische Text formuliert eine konkrete Reaktion auf einen Angriff am Sabbat und erklärt keine umfassende Lehre über den Sabbat.
- issue: Stärke der abschließenden Verneinung
  choice: »Wir wollen nicht alle sterben«
  alternative: »Wir werden gewiss nicht alle sterben«
  rationale: οὐ μή ist stark, steht hier aber mit einem deliberativ-voluntativen Aoristkonjunktiv nach dem Beschluss. Die gewählte Form bewahrt Entschlossenheit, ohne einen theologischen Erfolgsgaranten einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Direkte Rede klar und knapp; keine konfessionelle Zusatzdeutung. »Sabbat« folgt dem etablierten biblischen Sprachgebrauch.
