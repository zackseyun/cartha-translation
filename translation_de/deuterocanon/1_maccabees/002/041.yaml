  source_fidelity: Der Entschluss zur Gegenwehr am Sabbat und die Bezugnahme auf die in Verstecken gestorbenen Brüder sind zutreffend wiedergegeben. »Wenn jemand ... gegen uns in den Kampf zieht« ist jedoch weniger präzise als das griechische ἔλθῃ πρὸς ἡμᾶς εἰς πόλεμον, das einen Angreifer beschreibt, der gegen sie zum Kampf anrückt. Die starke Verneinung οὐ μὴ ... ἀποθάνωμεν ist besser als entschiedene Zukunftsaussage wiederzugeben als mit dem voluntativen »wir wollen nicht«.
