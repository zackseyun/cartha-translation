  text: Und sie beeilten sich, gegen sie Krieg zu führen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und sie gingen eilig zum Angriff auf sie über.“ Wörtlich und knapp: „Und sie beschleunigten den Krieg gegen sie.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάχυναν
  choice: sie beeilten sich
  rationale: Der Aorist von ταχύνω bezeichnet hier das beschleunigte Vorgehen. „Sie beeilten sich“ bewahrt diese verbale Bedeutung, ohne eine bestimmte militärische Maßnahme vorauszusetzen.
- source_word: πόλεμον
  choice: Krieg zu führen
  rationale: πόλεμος bedeutet wörtlich „Krieg“. Die idiomatische deutsche Verbindung „Krieg führen“ gibt den knappen griechischen Ausdruck verständlich wieder und hält dessen lexikalischen Gehalt fest.
- source_word: ἐπʼ αὐτούς
  choice: gegen sie
  rationale: ἐπί mit Akkusativ bezeichnet im Zusammenhang feindlicher Handlungen die Zielrichtung und wird natürlich mit „gegen sie“ wiedergegeben.
