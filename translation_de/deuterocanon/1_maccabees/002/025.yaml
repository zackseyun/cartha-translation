  yaml_path: translation/deuterocanon/1_maccabees/002/025.yaml
  text: And he killed the king’s man who was compelling them to sacrifice at that time[a], and he tore down the altar,
translation:
  language: de
  text: Und den Mann des Königs[a], der zum Opfern zwang, tötete er zu jener Zeit; auch den Altar riss er nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Mann des Königs“; gemeint sein kann ein königlicher Beamter oder Beauftragter.'
    reason: Die wörtliche Wendung lässt die genaue Funktion des Mannes offen; die Fußnote erläutert die wahrscheinliche amtliche Bedeutung, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: τὸν ἄνδρα τοῦ βασιλέως
  choice: den Mann des Königs
  rationale: Die wörtliche, im Deutschen verständliche Wendung bewahrt die Zuordnung zum König, ohne die nicht ausdrücklich genannte Amtsstellung als „Beamter“ oder „Beauftragter“ festzulegen.
- source_word: τὸν ἀναγκάζοντα θύειν
  choice: der zum Opfern zwang
  rationale: ἀναγκάζω bezeichnet wirklichen Zwang; die objektlose deutsche Form entspricht der griechischen Auslassung und vermeidet es, den nicht genannten Betroffenen festzulegen.
- source_word: ἀπέκτεινεν
  choice: tötete er
  rationale: Eine klare und moderne Wiedergabe des Aorists von ἀποκτείνω; „erschlug“ wäre stilistisch markierter.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: zu jener Zeit
  rationale: Gibt die zeitliche Wendung eng und idiomatisch wieder, ohne sie stärker auf einen einzelnen Augenblick einzuengen.
- source_word: τὸν βωμὸν καθεῖλεν
  choice: den Altar riss er nieder
  rationale: „Altar“ ist die übliche Entsprechung für βωμός; „niederreißen“ gibt die gewaltsame Beseitigung durch καθαιρέω treffend wieder.
theological_decisions:
- issue: Nicht genanntes Objekt bei „zum Opfern zwingen“
  choice: der zum Opfern zwang
  alternative: der sie zum Opfern zwang
  rationale: Der griechische Text nennt kein Objekt zu ἀναγκάζοντα θύειν. Die objektlose deutsche Form bleibt natürlich und bewahrt offen, ob die örtliche Bevölkerung allgemein oder bestimmte Anwesende gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Syntax. Die Wortstellung hebt entsprechend dem Griechischen zunächst den Mann des Königs hervor; das Semikolon gliedert die beiden eng verbundenen Gewalthandlungen klar.
