    issue: »die fremden Völker« für τὰ ἔθνη
    rationale: »Fremd« ist keine ausdrückliche lexikalische Komponente des griechischen Wortes und kann räumlich oder national verstanden werden. »Die Völker« ist die neutralere Grundübersetzung; die kontextuelle Bedeutung »nichtjüdische Völker« gehört in die Fußnote.
  - severity: low
    issue: »einer zum anderen« für ἀνὴρ πρὸς τὸν πλησίον αὐτοῦ
    rationale: Die idiomatische Form ist verständlich, lässt aber sowohl den ausdrücklich genannten Mann als auch den Bezug auf seinen Nachbarn weniger deutlich erkennen.
  - severity: low
    issue: »vertilgen« für ὀλεθρεύσουσιν
    rationale: Die Bedeutung ist grundsätzlich tragfähig, wirkt im modernen Standarddeutsch bei menschlichen Gegnern jedoch weniger natürlich. »Vernichten« gibt die starke Drohung klar und zeitgemäß wieder.
