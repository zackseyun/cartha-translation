revisions:
- from: 'Da sagte einer zum anderen: »Wenn wir alle so handeln, wie unsere Brüder gehandelt haben, und nicht gegen die fremden Völker[a] um unser Leben und unsere Rechte[b] kämpfen, werden sie uns sehr bald aus dem Land vertilgen.«'
  to: 'Da sagte ein Mann zu seinem Nachbarn: »Wenn wir alle so handeln, wie unsere Brüder gehandelt haben, und nicht gegen die Völker[a] um unser Leben und unsere Rechte[b] kämpfen, werden sie uns bald aus dem Land vernichten.«'
  rationale: Die Revision entfernt die nicht ausdrücklich im griechischen Wortlaut enthaltene Nuance von »fremd«, erhält sie aber als vorsichtige Kontextangabe in der Fußnote. Außerdem präzisiert sie Sprecher und Adressaten und verwendet mit »vernichten« eine natürliche moderne Entsprechung für das starke Zerstörungsverb. »Bald« gibt die Dringlichkeit von τάχιον idiomatisch wieder; νῦν kann in diesem konditionalen Schluss als situationsbezogene bzw. folgernde Nuance unausgedrückt bleiben.
