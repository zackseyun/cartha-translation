base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/040.yaml
  text: And one man said to his neighbor[a], “If we all do as our brothers did, and do not fight against the Gentiles for our lives and our rights[b], they will quickly destroy us from the land.”
translation:
  language: de
  text: 'Da sagte ein Mann zu seinem Nachbarn: »Wenn wir alle so handeln, wie unsere Brüder gehandelt haben, und nicht gegen die Völker[a] um unser Leben und unsere Rechte[b] kämpfen, werden sie uns bald aus dem Land vernichten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Völker«; im jüdischen Sprachgebrauch sind damit hier wahrscheinlich die nichtjüdischen Völker gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unsere Satzungen«, »unsere Rechtsordnungen« beziehungsweise »unsere Rechtsansprüche«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ πρὸς τὸν πλησίον αὐτοῦ
  choice: einer zum anderen
  rationale: Die griechische Wendung bezeichnet wörtlich einen Mann, der zu seinem Nächsten spricht. Die idiomatische deutsche Form gibt den wechselseitigen Austausch innerhalb der Gruppe natürlich wieder, ohne den Sprecher zu verallgemeinern.
- source_word: ἀδελφοὶ
  choice: Brüder
  rationale: Das maskuline Pluralwort verweist im Kontext auf die zuvor genannten jüdischen Glaubens- und Volksgenossen; »Brüder« bewahrt die Form und den Gemeinschaftsbezug.
- source_word: πολεμήσωμεν
  choice: kämpfen
  rationale: Das Verb bezeichnet hier bewaffneten Widerstand. »kämpfen« ist im modernen Deutsch klar und weniger schwerfällig als »Krieg führen«.
- source_word: τὰ ἔθνη
  choice: die fremden Völker
  rationale: ἔθνη bedeutet grundsätzlich »Völker«, bezeichnet in jüdischem Kontext jedoch häufig die nichtjüdischen Völker. »fremde Völker« wahrt den Völkerbegriff und macht den Gegensatz verständlich, ohne eine moderne nationale Kategorie einzutragen.
- source_word: ὑπὲρ τῆς ψυχῆς ἡμῶν
  choice: um unser Leben
  rationale: ψυχή meint hier das zu bewahrende Leben, nicht die Seele als abstrakten Bestandteil des Menschen. Der griechische Kollektivsingular lässt sich im Deutschen natürlich mit »unser Leben« wiedergeben.
- source_word: δικαιωμάτων
  choice: Rechte
  rationale: Das Wort kann rechtliche Ansprüche, Satzungen oder feststehende Rechtsordnungen bezeichnen. Im Zusammenhang der Verteidigung der Gemeinschaft ist »Rechte« die klarste Haupttextform; die Bedeutungsbreite wird in einer Fußnote erhalten.
- source_word: νῦν τάχιον
  choice: sehr bald
  rationale: νῦν verankert die drohende Folge in der gegenwärtigen Lage, während τάχιον als Komparativ Dringlichkeit ausdrückt. »sehr bald« gibt beides idiomatisch wieder.
- source_word: ὀλεθρεύσουσιν
  choice: vertilgen
  rationale: Das starke Verb bezeichnet vollständige oder vernichtende Zerstörung. »vertilgen« bewahrt die Schärfe und passt zum biblisch-dignifizierten Register, ohne über »vernichten« hinauszugehen.
- source_word: ἀπὸ τῆς γῆς
  choice: aus dem Land
  rationale: γῆ bezeichnet hier am ehesten das bewohnte Heimatland und nicht die gesamte Erde. Die Präposition wird mit »aus« idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezeichnung der nichtjüdischen Gegner mit τὰ ἔθνη
  choice: die fremden Völker
  alternative: die Völker; die Heiden
  rationale: Der Kontext legt nichtjüdische Völker als Referenz nahe. »die fremden Völker« bewahrt zugleich die lexikalische Grundbedeutung und den kontextuellen Gegensatz. »Heiden« könnte den Ausdruck unnötig auf Religion verengen.
- issue: Bedeutungsumfang von δικαιωμάτων
  choice: Rechte
  alternative: Satzungen; Rechtsansprüche; Rechtsordnungen
  rationale: Die Aussage verbindet das Überleben der Gemeinschaft mit dem Schutz ihrer anerkannten Ordnungen und Ansprüche. »Rechte« ist verständlich, während die Fußnote die mögliche kultisch-rechtliche Bedeutung offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und dringlich. »vertilgen« setzt bewusst einen kräftigen, leicht biblischen Akzent; die mehrdeutigen Begriffe ἔθνη und δικαιώματα werden im Haupttext lesbar wiedergegeben und in Fußnoten offengehalten.
