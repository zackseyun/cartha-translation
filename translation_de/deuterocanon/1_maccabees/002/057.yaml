  text: David[a], because of his mercy, inherited the throne of an everlasting kingdom.
translation:
  language: de
  text: David erbte wegen seiner Barmherzigkeit[a] den Thron eines ewigen Königreichs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „David erbte durch Gottes Barmherzigkeit den Thron eines ewigen Königreichs.“ Das Pronomen „seiner“ kann sich statt auf David auch auf Gott beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Δαυεὶδ
  choice: David
  rationale: Die im Deutschen übliche Form des Eigennamens.
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: wegen seiner Barmherzigkeit
  rationale: ἐν mit dem Dativ kann hier einen Grund oder ein Mittel bezeichnen. Die Wiedergabe ist im heutigen Deutsch natürlich und lässt das Pronomen zunächst auf David zurückweisen.
- source_word: ἐκληρονόμησεν
  choice: erbte
  rationale: Bewahrt die Bedeutung des Empfangens als Erbe und damit den dynastischen Anklang.
- source_word: θρόνον
  choice: den Thron
  rationale: Der bestimmte Artikel entspricht im Kontext dem bekannten Königsthron Davids.
- source_word: βασιλείας αἰωνίας
  choice: eines ewigen Königreichs
  rationale: Gibt die Genitivverbindung würdig und verständlich wieder; αἰωνίας bezeichnet hier eine bleibende, fortdauernde Herrschaft.
theological_decisions:
- issue: Bezug von αὐτοῦ in ἐν τῷ ἐλέει αὐτοῦ
  choice: 'Das Pronomen wird im Haupttext auf David bezogen: „wegen seiner Barmherzigkeit“.'
  alternative: „durch Gottes Barmherzigkeit“; dabei bezieht sich das Pronomen auf Gott.
  rationale: Der nächstliegende grammatische Bezug ist David, und der Zusammenhang rühmt beispielhafte Personen aufgrund ihrer kennzeichnenden Eigenschaften. Da ein Bezug auf Gottes Barmherzigkeit sprachlich und theologisch möglich bleibt, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Lobspruchform und der dynastische Klang von „erbte den Thron“ bleiben erhalten; die Mehrdeutigkeit des griechischen Pronomens wird nicht stillschweigend aufgelöst.
