  text: All her glory was taken away; instead of being free[a], she became a servant.
translation:
  language: de
  text: Ihre ganze Pracht wurde ihr genommen; statt eine Freie zu sein, wurde sie zur Sklavin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ κόσμος αὐτῆς
  choice: all ihre Pracht
  rationale: κόσμος bezeichnet hier nicht die Welt, sondern Schmuck, Zier oder daraus folgend Pracht und Herrlichkeit. „All ihre Pracht“ gibt den kollektiven Sinn von πᾶς natürlich wieder.
- source_word: ἀφηρέθη
  choice: wurde ihr genommen
  rationale: Der Aorist Passiv bezeichnet den vollständigen Entzug durch eine nicht genannte äußere Macht. Das im Griechischen enthaltene αὐτῆς wird im Deutschen idiomatisch durch „ihr“ aufgenommen.
- source_word: ἀντὶ ἐλευθέρας
  choice: statt einer Freien
  rationale: ἀντί bezeichnet den Austausch beziehungsweise die Umkehr eines Zustands. Die substantivierte feminine Form bewahrt zugleich die Personifikation der Stadt als Frau.
- source_word: ἐγενήθη εἰς δούλην
  choice: wurde sie zur Sklavin
  rationale: Die Konstruktion bezeichnet das Eintreten in einen neuen Zustand. „Sklavin“ erhält den scharfen Gegensatz zu „Freien“ und gibt den Verlust der Freiheit deutlicher wieder als „Dienerin“.
theological_decisions:
- issue: Gegensatz zwischen ἐλευθέρα und δούλη
  choice: Freie – Sklavin
  alternative: frei – Dienerin
  rationale: Der griechische Wortlaut stellt rechtlich-soziale Freiheit und Versklavung einander gegenüber. Die gewählte Form bewahrt sowohl diesen Statusgegensatz als auch die weibliche Personifikation, ohne ihn konfessionell auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Parallelstruktur und die Personifikation Jerusalems werden bewahrt; „Pracht“ vermeidet die hier falsche Bedeutung „Welt“ von κόσμος.
