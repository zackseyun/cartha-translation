  source_fidelity: 'Die Aufforderung und die Wiedergabe der Taten der Väter sind zutreffend. Jedoch wiederholt der griechische Text δόξαν ausdrücklich: „δόξαν μεγάλην καὶ δόξαν αἰώνιον“. Die Zusammenziehung zu „große und ewige Herrlichkeit“ gibt zwar die Attribute wieder, nivelliert aber die rhetorisch und lexikalisch markierte Wiederholung. Zudem ist „empfangt“ für δέξασθε unmittelbarer und wahrt besser die offene Nuance des Empfangens gegenüber dem stärker ergebnisorientierten „erlangt“.'
