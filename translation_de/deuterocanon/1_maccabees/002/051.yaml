  - severity: low
    issue: „Erlangt“ ist gegenüber δέξασθε interpretierend enger.
    rationale: δέξασθε bedeutet primär „empfangt/nehmt an“. „Erlangt“ legt stärker ein eigenes Erreichen nahe, während „empfangt“ die im Griechischen mögliche Gabe- bzw. Empfangsnuance offenlässt.
