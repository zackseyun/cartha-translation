  terminology: „Väter“ gibt πατέρων angemessen wieder; „Taten“ und „Herrlichkeit“ passen zum Kontext und Register. „Zu ihrer Zeit“ ist eine idiomatische, hinreichend offene Wiedergabe von ταῖς γενεαῖς αὐτῶν.
