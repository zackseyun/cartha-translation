  text: Remember the deeds of our fathers[a], which they did in their generations, and receive great glory and everlasting glory.
translation:
  language: de
  text: Erinnert euch an die Taten unserer Väter, die sie zu ihrer Zeit vollbracht haben, und empfangt große Herrlichkeit und ewige Herrlichkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνήσθητε
  choice: Erinnert euch
  rationale: Der Aoristimperativ fordert nachdrücklich dazu auf, sich die Taten der Vorfahren bewusst vor Augen zu führen.
- source_word: τῶν πατέρων ἡμῶν
  choice: unserer Väter
  rationale: Bewahrt den ausdrücklich männlichen Verwandtschaftsbegriff und den biblischen Klang; gemeint sind Israels Vorväter.
- source_word: ἔργα ἃ ἐποίησαν
  choice: die Taten …, die sie … vollbracht haben
  rationale: „Taten“ bezeichnet hier bemerkenswerte Handlungen; „vollbracht“ gibt ἐποίησαν in natürlichem, würdigem Deutsch wieder.
- source_word: ταῖς γενεαῖς αὐτῶν
  choice: zu ihrer Zeit
  rationale: Die wörtliche Wendung „in ihren Generationen“ ist im Deutschen unnatürlich; gemeint sind die jeweiligen Lebenszeiten beziehungsweise geschichtlichen Epochen der Väter.
- source_word: δέξασθε
  choice: erlangt
  rationale: δέχομαι bedeutet grundsätzlich „empfangen“ oder „annehmen“; in Verbindung mit Herrlichkeit bezeichnet der Imperativ hier idiomatisch das Erlangen der verheißenen Ehre.
- source_word: δόξαν μεγάλην καὶ δόξαν αἰώνιον
  choice: große und ewige Herrlichkeit
  rationale: Die koordinierte deutsche Form wahrt beide Attribute und vermeidet eine schwerfällige Wiederholung von „Herrlichkeit“, ohne den semantischen Gehalt der wiederholten δόξα zu verändern.
theological_decisions:
- issue: Masculine Bezeichnung der Vorfahren
  choice: unserer Väter
  alternative: unserer Vorfahren
  rationale: πατέρων ist ausdrücklich maskulin. „Väter“ erhält die sprachliche Form und den biblischen Bezug, ohne den Referentenkreis eigenmächtig zu neutralisieren.
- issue: Bedeutung und Wiederholung von δόξα
  choice: große und ewige Herrlichkeit
  alternative: große Herrlichkeit und ewigen Ruhm
  rationale: δóξα kann Herrlichkeit, Ehre oder Ruhm bedeuten. Die einheitliche Wiedergabe als „Herrlichkeit“ bewahrt die lexikalische Wiederholung in verdichteter deutscher Syntax und lässt offen, ob himmlische Herrlichkeit oder bleibende Ehre im Vordergrund steht.
- issue: Kraft von δέξασθε
  choice: erlangt
  alternative: empfangt
  rationale: „Erlangt“ passt im Deutschen natürlich zum Ergebnis des vorbildlichen Handelns. Die alternative Wiedergabe „empfangt“ würde stärker den Gabecharakter betonen, den der griechische Ausdruck ebenfalls zulässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und mahnend; „zu ihrer Zeit“ gibt die griechische Generationsformel verständlich wieder. Keine Fußnote ist nötig, da keine für den Haupttext wesentliche Mehrdeutigkeit ausgeblendet wird.
