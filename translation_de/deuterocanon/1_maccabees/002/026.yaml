  text: And he was zealous for the law[a], just as Phinehas was against Zambri son of Salom.
translation:
  language: de
  text: Und er eiferte für das Gesetz, wie Pinhas gegen Sambri, den Sohn Saloms, handelte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Namensformen lauten hier Sambri und Salom; aus Numeri 25 sind dieselben Personen meist als Simri, der Sohn Salus, bekannt.
