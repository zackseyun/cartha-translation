lexical_decisions:
- source_word: ἐζήλωσεν
  choice: eiferte
  rationale: Das Verb bezeichnet hier einen leidenschaftlichen Eifer, der sich in entschlossenem Handeln äußert. „Eiferte“ bewahrt die Intensität und den Zusammenhang mit dem folgenden Vergleich, ohne die Handlung zusätzlich auszudeuten.
- source_word: τῷ νόμῳ
  choice: für das Gesetz
  rationale: Der Dativ bezeichnet das, worauf sich der Eifer richtet. „Für das Gesetz“ ist im Deutschen natürlich und verweist im jüdischen Kontext auf die Tora.
- source_word: καθὼς
  choice: wie
  rationale: Leitet den ausdrücklichen Vergleich mit Pinhas ein; das schlichte „wie“ gibt diesen Zusammenhang klar und idiomatisch wieder.
- source_word: ἐποίησεν
  choice: es … getan hatte
  rationale: Das allgemein gehaltene ποιέω wird ebenso allgemein wiedergegeben. Das Pronomen „es“ lässt die konkrete, aus der Erzählung bekannte Tat unausgesprochen, wie es auch der griechische Text tut.
- source_word: Φινεὲς
  choice: Pinhas
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Namensform für die Gestalt aus Numeri 25.
- source_word: τῷ Ζαμβρὶ
  choice: an Sambri
  rationale: Der Dativ bezeichnet im historischen Vergleich die Person, an der Pinhas handelte. „An Sambri“ wahrt die knappe, leicht elliptische Ausdrucksweise und legt die Art der Handlung nicht stärker fest als der griechische Wortlaut.
- source_word: υἱῷ Σαλώμ
  choice: dem Sohn Saloms
  rationale: Die Namen werden nach den im griechischen Ausgangstext bezeugten Formen wiedergegeben; die geläufigeren Namensformen aus Numeri 25 werden in der Fußnote genannt.
theological_decisions:
- issue: Darstellung von Mattatias’ Nachahmung des Pinhas in einem Kontext gewaltsamen Eifers
  choice: Den Vergleich direkt und ohne Abschwächung oder erläuternde Erweiterung wiedergeben
  alternative: Die Anspielung ausdeuten oder die Eifersprache abschwächen
  rationale: Der griechische Text zieht ausdrücklich die Parallele zur Tat des Pinhas in Numeri 25. Die Übersetzung bewahrt diese narrative und theologische Spannung, ohne über die Aussage des Textes hinaus eine Bewertung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eiferte“ ist bewusst etwas gehoben, bleibt aber verständlich und entspricht der knappen, eindringlichen Sprache des Ausgangstextes. Die elliptische Wendung „es an Sambri getan hatte“ erhält die Zurückhaltung des Griechischen hinsichtlich der konkreten Tat.
