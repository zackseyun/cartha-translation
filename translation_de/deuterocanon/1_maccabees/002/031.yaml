base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/031.yaml
  text: And it was reported to the king’s men and to the forces that were in Jerusalem[a], the city of David, that men who had scattered because of the king’s command had gone down into the hidden places in the wilderness.
translation:
  language: de
  text: Und den Männern des Königs und den Streitkräften, die sich in Jerusalem, der Stadt Davids, befanden, wurde gemeldet, dass Männer, die sich wegen des Befehls des Königs zerstreut hatten, in die Verstecke in der Wüste hinabgezogen waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass Männer, die den Befehl des Königs missachtet hatten, in die Verstecke in der Wüste hinabgezogen waren.“ Die griechische Wendung ist gedrängt und ungewöhnlich; sie kann entweder die Zerstreuung infolge des Befehls oder dessen Missachtung bezeichnen.'
    reason: Alternative Deutung einer syntaktisch und lexikalisch schwierigen griechischen Wendung.
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: wurde gemeldet
  rationale: Die unpersönliche Passivform gibt die griechische Berichtsformel klar und idiomatisch wieder.
- source_word: τοῖς ἀνδράσιν τοῦ βασιλέως
  choice: den Männern des Königs
  rationale: Die wörtliche Bezeichnung lässt offen, ob Beamte, Gefolgsleute oder Soldaten gemeint sind.
- source_word: ταῖς δυνάμεσιν
  choice: den Streitkräften
  rationale: Im militärischen Zusammenhang bezeichnet δυνάμεις bewaffnete Kräfte, ohne eine bestimmte Einheit festzulegen.
- source_word: ἐν Ἰερουσαλὴμ πόλει Δαυείδ
  choice: in Jerusalem, der Stadt Davids
  rationale: Die appositionelle Formulierung bewahrt beide Ortsbezeichnungen in natürlichem Deutsch.
- source_word: κατέβησαν
  choice: hinabgezogen waren
  rationale: Das Plusquamperfekt drückt aus, dass dieses Hinabziehen der Meldung zeitlich vorausging; „hinabziehen“ bewahrt die räumliche Perspektive des griechischen Verbs.
- source_word: διεσκέδασαν
  choice: sich … zerstreut hatten
  rationale: Die Grundbedeutung des Verbs ist „zerstreuen“ oder „auseinandergehen“. Die reflexive deutsche Form ergibt im Zusammenhang einen verständlichen Sinn, ohne die alternative Deutung als Missachtung des Befehls zu verschweigen.
- source_word: τὴν ἐντολὴν τοῦ βασιλέως
  choice: wegen des Befehls des Königs
  rationale: „Befehl“ entspricht ἐντολή; „wegen“ stellt im Haupttext den kontextuell naheliegenden Zusammenhang zwischen königlichem Befehl und Flucht her.
- source_word: εἰς τοὺς κρυφοὺς
  choice: in die Verstecke
  rationale: Das substantivierte Adjektiv bezeichnet verborgene Orte; „Verstecke“ ist im Deutschen natürlich und konkret.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: „Wüste“ ist eine geläufige biblische Wiedergabe von ἔρημος und bezeichnet hier unbewohntes, abgelegenes Land.
theological_decisions:
- issue: Deutung von διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως
  choice: Die Männer hatten sich wegen des Befehls des Königs zerstreut.
  alternative: Die Männer hatten den Befehl des Königs missachtet und waren in die Verstecke hinabgezogen.
  rationale: Die griechische Verbindung ist ungewöhnlich, weil διεσκέδασαν gewöhnlich „zerstreuten“ bedeutet, hier aber „den Befehl des Königs“ als Akkusativobjekt folgt. Der Haupttext erhält die lexikalische Grundbedeutung und erschließt aus dem Zusammenhang die kausale Beziehung; die mögliche Bedeutung „missachten“ wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem griechischen Berichtsstil nahe, ohne unnatürlich zu wirken; die genaue Stellung der königlichen Männer bleibt bewusst offen.
