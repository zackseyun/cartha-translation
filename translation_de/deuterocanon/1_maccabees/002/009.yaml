  text: The vessels of her glory were carried away captive[a]; her infants were slain in her streets[b], her young men by the enemy’s sword.
translation:
  language: de
  text: Die Gefäße ihrer Herrlichkeit wurden in die Gefangenschaft weggeführt[a]; ihre kleinen Kinder wurden auf ihren Straßen getötet[b], ihre jungen Männer durch das Schwert des Feindes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden als Gefangene weggeführt“. Das Griechische beschreibt das Wegführen der Gefäße mit der Sprache der Gefangenschaft.'
    reason: lexical_alternative
  - marker: b
    text: Die wiederholten femininen Fürwörter beziehen sich auf die im Zusammenhang als Frau dargestellte Stadt, wahrscheinlich Jerusalem beziehungsweise Zion.
    reason: cross_reference
lexical_decisions:
- source_word: σκεύη
  choice: Gefäße
  rationale: σκεύη bezeichnet Gefäße, Geräte oder Ausstattungsgegenstände. „Gefäße“ bewahrt den wahrscheinlichen Bezug auf kostbare, möglicherweise zum Heiligtum gehörende Gegenstände, ohne ihn im Text näher festzulegen.
- source_word: δόξης
  choice: Herrlichkeit
  rationale: δόξα kann hier Herrlichkeit, Glanz oder Pracht bezeichnen. „Herrlichkeit“ erhält den gehobenen Klagecharakter und die mögliche religiöse Bedeutung.
- source_word: αἰχμάλωτα ἀπήχθη
  choice: wurden in die Gefangenschaft weggeführt
  rationale: Die Verbindung bezeichnet gewaltsames Wegführen als Gefangene beziehungsweise Beute. Die deutsche Fassung erhält das Bild der Gefangenschaft, obwohl es ungewöhnlich auf Gegenstände angewandt wird.
- source_word: νήπια
  choice: kleinen Kinder
  rationale: νήπια meint sehr junge, noch unmündige Kinder. „Kleine Kinder“ ist im heutigen Deutsch natürlicher und lässt die genaue Altersstufe offen, die das griechische Wort nicht eindeutig festlegt.
- source_word: ἀπεκτάθη
  choice: wurden getötet
  rationale: Das Verb bezeichnet das Töten. „Getötet“ ist klar, ernst und modern; das stärker stilisierte „erschlagen“ würde eine bestimmte Tötungsweise nahelegen.
- source_word: πλατείαις
  choice: Straßen
  rationale: πλατεῖαι bezeichnet breite Straßen oder öffentliche Freiflächen einer Stadt. „Straßen“ ist hier natürlich und vermeidet eine unbelegte Festlegung auf Plätze.
- source_word: νεανίσκοι
  choice: jungen Männer
  rationale: νεανίσκοι bezeichnet junge Männer beziehungsweise männliche Jugendliche. „Junge Männer“ gibt die Altersgruppe natürlich wieder und unterscheidet sie von den kleinen Kindern.
- source_word: ῥομφαίᾳ
  choice: Schwert
  rationale: ῥομφαία bezeichnet ein Schwert, teils eine große Klinge. „Schwert“ ist die klare und kontextuell ausreichende Wiedergabe.
- source_word: ἐχθροῦ
  choice: des Feindes
  rationale: Der singularische Genitiv bezeichnet hier den feindlichen Urheber beziehungsweise die feindliche Macht. „Des Feindes“ wahrt Form und feierlichen Ton.
theological_decisions:
- issue: Bezug der wiederholten femininen Possessivpronomen
  choice: Die Pronomen werden als „ihrer/ihre/ihren“ beibehalten, ohne den Bezug im Vers ausdrücklich zu benennen.
  alternative: Den Bezug ausdrücklich als Jerusalem oder Zion bestimmen.
  rationale: Das Griechische setzt den femininen Bezug aus dem Zusammenhang voraus. Die offene pronominale Form bewahrt die Personifikation und vermeidet eine über diesen Vers hinausgehende Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Klagesyntax. Die ungewöhnliche Personifikation der weggeführten Gefäße sowie der nicht ausdrücklich genannte feminine Bezug bleiben erhalten.
