  text: Hananiah[a], Azariah, and Mishael, having believed[b], were saved from the flame.
translation:
  language: de
  text: Hananja[a], Asarja und Mischaël glaubten[b] und wurden aus der Flamme gerettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Ananias, Azarias und Misaël“. Die Übersetzung verwendet die geläufigeren hebräischen Namensformen der drei Männer aus Daniel 3.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Weil sie glaubten, wurden sie aus der Flamme gerettet“ oder „Nachdem sie geglaubt hatten, wurden sie aus der Flamme gerettet“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνανίας, Ἀζαρίας, Μισαήλ
  choice: Hananja, Asarja und Mischaël
  rationale: Die geläufigen hebräischen Namensformen identifizieren die drei Männer aus Daniel 3 klar; die griechischen Formen lauten Ananias, Azarias und Misaël.
- source_word: πιστεύσαντες
  choice: vertrauten auf Gott
  rationale: Das Aoristpartizip von πιστεύω bezeichnet hier ihr gläubiges Vertrauen. Die finite Wiedergabe ist im Deutschen natürlich; „auf Gott“ macht das im Kontext vorausgesetzte Ziel des Vertrauens deutlich, ohne „Glaube“ als Substantiv einzuführen.
- source_word: ἐσώθησαν
  choice: wurden gerettet
  rationale: Das Passiv von σῴζω bezeichnet in diesem konkreten Gefahrenzusammenhang Rettung beziehungsweise Bewahrung vor dem Tod.
- source_word: ἐκ φλογός
  choice: aus der Flamme
  rationale: Die Einzahl φλόξ wird bildkräftig mit „Flamme“ wiedergegeben; ἐκ bezeichnet die Rettung aus ihr heraus.
theological_decisions:
- issue: Verhältnis von πιστεύσαντες zu ἐσώθησαν
  choice: 'Koordinierte Wiedergabe: „vertrauten auf Gott und wurden … gerettet“'
  alternative: „Weil sie glaubten, wurden sie … gerettet“; „Nachdem sie geglaubt hatten, wurden sie … gerettet“
  rationale: Das griechische Aoristpartizip verbindet ihr Vertrauen eng mit ihrer Rettung, legt die genaue logische Beziehung jedoch nicht eindeutig fest. Die koordinierte deutsche Form wahrt diese Offenheit besser als eine ausdrücklich kausale oder zeitliche Unterordnung.
translation_notes:
  register: Modernes, verständliches und würdevolles Standarddeutsch. Die Satzteilung durch Koordination vermeidet das im Deutschen schwerfällige Partizip Perfekt und bewahrt zugleich die Mehrdeutigkeit der griechischen Partizipialkonstruktion.
