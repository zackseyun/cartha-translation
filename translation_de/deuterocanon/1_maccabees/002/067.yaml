  source_fidelity: 'Die Grundbedeutung ist zutreffend: προσάξετε πρὸς ὑμᾶς fordert dazu auf, die Gesetzestreuen zur eigenen Gruppe zu ziehen bzw. um sich zu sammeln; πάντας τοὺς ποιητὰς τοῦ νόμου bezeichnet alle, die das Gesetz tun/befolgen; und ἐκδικήσατε ἐκδίκησιν enthält ausdrücklich einen verstärkten Aufruf zur Vergeltung zugunsten des eigenen Volkes. Die vorgeschlagene Umstellung beseitigt eine im Deutschen missverständliche Satztrennung, ohne den Sinn zu verändern.'
  naturalness: „Schart alle um euch, die das Gesetz befolgen“ ist wegen der nachgestellten restriktiven Relativgruppe und der Kommasetzung holprig. „Sammelt alle, die das Gesetz befolgen, um euch“ ist modernes, würdiges Standarddeutsch und macht den Bezug eindeutig.
  terminology: „Das Gesetz“ ist im makkabäischen jüdischen Kontext angemessen und wahrt die Terminologie des griechischen νόμος. „Rache nehmen“ gibt die harte Vergeltungssprache wieder. In der Fußnote sollte „Täter des Gesetzes“ vermieden werden, da „Täter“ im heutigen Deutsch überwiegend kriminell konnotiert ist und ποιηταί hier nicht präzise vermittelt.
  issues:
  - severity: medium
    issue: Unnatürliche und potenziell missverständliche Wortstellung im ersten Gebot
    rationale: Die Fassung „schart alle um euch, die das Gesetz befolgen“ trennt „alle“ unnötig von seiner einschränkenden Relativgruppe. Die Relativgruppe kann beim Lesen zudem wie ein Nachtrag wirken. Eine Umstellung stellt eindeutig klar, dass alle Gesetzesbefolger gesammelt werden sollen.
  - severity: medium
    issue: Irreführende wörtliche Umschreibung „Täter des Gesetzes“ in Fußnote a
    rationale: Obwohl „Täter“ eine formale Möglichkeit zu ποιηταί sein kann, trägt es im modernen Deutschen vorrangig die Bedeutung einer Person, die eine Straftat begangen hat. „Die, die das Gesetz tun“ bewahrt die wörtliche Bildlichkeit ohne diese falsche Konnotation.
  - severity: low
    issue: Fußnote b kann die griechische Konstruktion präziser erklären
    rationale: „Rächt die Rache eures Volkes“ ist keine hilfreiche deutsche wörtliche Wiedergabe und kann so wirken, als sei die Rache selbst zu rächen. Die Fußnote sollte die wörtliche cognate Konstruktion erläutern und den Genitiv als Bezug auf das Volk verständlich ausweisen.
  revised_text: Und ihr, sammelt alle, die das Gesetz befolgen, um euch,[a] und nehmt Rache für euer Volk.[b]
