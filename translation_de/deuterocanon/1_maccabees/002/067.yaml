  yaml_path: translation/deuterocanon/1_maccabees/002/067.yaml
  text: And you[a], gather to yourselves all who practice the law[b], and take vengeance for your people.
translation:
  language: de
  text: Und ihr, sammelt alle, die das Gesetz befolgen, um euch,[a] und nehmt Rache für euer Volk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „alle, die das Gesetz tun“. Das griechische Wort bezeichnet hier Menschen, die das Gesetz praktisch befolgen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht eine Verbindung stammverwandter Wörter, etwa „übt Vergeltung, die euer Volk betrifft“. Sie verstärkt den Aufruf zur Vergeltung.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσάξετε πρὸς ὑμᾶς
  choice: schart … um euch
  rationale: Die Wendung fordert dazu auf, Menschen zur eigenen Gemeinschaft beziehungsweise auf die eigene Seite zu ziehen. „Um euch scharen“ ist im Deutschen natürlich und bewahrt den Gedanken des Sammelns von Mitstreitern.
- source_word: πάντας τοὺς ποιητὰς τοῦ νόμου
  choice: alle, die das Gesetz befolgen
  rationale: ποιητής bezeichnet hier Menschen, die etwas tun oder praktizieren, nicht Verfasser. „Das Gesetz befolgen“ gibt die aktive Gesetzestreue verständlich und idiomatisch wieder.
- source_word: ἐκδικήσατε ἐκδίκησιν
  choice: nehmt Rache
  rationale: Die griechische Verbindung aus stammverwandtem Verb und Substantiv verstärkt den Aufruf zur Vergeltung. „Rache nehmen“ ist eine natürliche und kraftvolle deutsche Entsprechung.
- source_word: τοῦ λαοῦ ὑμῶν
  choice: für euer Volk
  rationale: Der Genitiv bezeichnet hier das Volk, für das Vergeltung geübt werden soll. Die Präposition „für“ drückt diesen Bezug im Deutschen klar aus.
theological_decisions:
- issue: Wiedergabe von νόμος im jüdischen Kontext der Makkabäerzeit
  choice: das Gesetz
  alternative: die Tora
  rationale: Im Kontext ist das überlieferte göttliche Gesetz Israels gemeint. „Das Gesetz“ bleibt eng am griechischen Wortlaut und vermeidet eine zusätzliche terminologische Festlegung.
- issue: Gewaltsprache in ἐκδικήσατε ἐκδίκησιν
  choice: nehmt Rache
  alternative: verschafft eurem Volk Recht
  rationale: Der Wortlaut enthält ausdrücklich den Gedanken der Vergeltung. Eine Abschwächung zu bloßer Rechtshilfe würde die Härte und theologische Spannung des Befehls verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schart … um euch“ bewahrt den aufrufenden Ton; „nehmt Rache“ gibt die bewusst starke Gewaltsprache unverharmlost wieder. Sämtliche Fußnotenmarker stehen an den jeweils erläuterten Textstellen.
