- from: Und ihr, schart alle um euch, die das Gesetz befolgen,[a] und nehmt Rache für euer Volk.[b]
  to: Und ihr, sammelt alle, die das Gesetz befolgen, um euch,[a] und nehmt Rache für euer Volk.[b]
