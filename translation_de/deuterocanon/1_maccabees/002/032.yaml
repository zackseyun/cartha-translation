base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/032.yaml
  text: And many ran after them[a], and when they caught up with them, they encamped against them and joined battle with them on the Sabbath day.
translation:
  language: de
  text: Und viele liefen ihnen nach. Als sie sie eingeholt hatten, schlugen sie ihnen gegenüber ihr Lager auf und nahmen am Sabbattag[a] den Kampf mit ihnen auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Tag der Sabbate“; dies ist eine idiomatische Bezeichnung für den Sabbattag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδραμον ὀπίσω αὐτῶν
  choice: liefen ihnen nach
  rationale: Die Wendung bezeichnet eine Verfolgung. „Liefen ihnen nach“ bewahrt sowohl die Anschaulichkeit des Verbs als auch den natürlichen deutschen Ausdruck.
- source_word: πολλοί
  choice: viele
  rationale: Schlichte und genaue Wiedergabe der unbestimmten großen Zahl.
- source_word: καταλαβόντες αὐτούς
  choice: als sie sie eingeholt hatten
  rationale: Im Zusammenhang einer Verfolgung bedeutet καταλαμβάνω hier „einholen“ und nicht zwingend „ergreifen“ oder „festnehmen“.
- source_word: παρενέβαλον ἐπʼ αὐτούς
  choice: schlugen sie ihnen gegenüber ihr Lager auf
  rationale: Das Verb hat hier einen militärischen Sinn. Die Formulierung gibt das Aufschlagen eines gegen die Verfolgten gerichteten Lagers wieder, ohne vorschnell einen unmittelbaren Angriff daraus zu machen.
- source_word: συνεστείλαντο πρὸς αὐτοὺς πόλεμον
  choice: nahmen den Kampf mit ihnen auf
  rationale: Die seltene militärische Wendung bezeichnet das Eingehen beziehungsweise Eröffnen des Kampfes. „Den Kampf aufnehmen“ ist im Deutschen natürlich und wahrt den unmittelbaren kriegerischen Zusammenhang.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: am Sabbattag
  rationale: Der formal pluralische griechische Ausdruck ist eine semitisch geprägte Bezeichnung für den einzelnen Sabbat. „Am Sabbattag“ ist klar, würdig und hält den Tagesbezug ausdrücklich fest.
theological_decisions:
- issue: Wiedergabe von σαββάτων in der jüdischen Kalenderformel
  choice: am Sabbattag
  alternative: am Tag der Sabbate
  rationale: Der griechische Plural ist in dieser idiomatischen Wendung nicht als Hinweis auf mehrere Sabbate zu verstehen. Die singularische Wiedergabe vermittelt den üblichen Sinn, während die Fußnote die Form des Ausgangstextes transparent macht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Satzteilung vermeidet eine schwerfällige Kette, während Reihenfolge und militärische Bildsprache des Griechischen erhalten bleiben.
