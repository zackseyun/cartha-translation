  text: And they pursued the sons of arrogance[b][a], and the work prospered in their hands.
translation:
  language: de
  text: Sie verfolgten die Söhne des Hochmuts[a], und das Werk gelang ihnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Hochmütigen“. Wörtlich steht im Griechischen: „die Söhne des Hochmuts“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und das Werk hatte Erfolg in ihrer Hand“. Die Wendung bezeichnet den Erfolg bei bzw. durch sie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξαν
  choice: verfolgten
  rationale: Das Verb bezeichnet hier ein aktives, feindliches Nachsetzen. „Verfolgten“ wahrt diese Aussage, ohne Vertreibung oder Tötung als Ergebnis festzulegen.
- source_word: τοὺς υἱοὺς τῆς ὑπερηφανίας
  choice: die Söhne des Hochmuts
  rationale: Die wörtliche, semitisch geprägte Wendung bleibt erhalten; sie ist im Deutschen verständlich und bewahrt die rhetorische Schärfe des griechischen Ausdrucks.
- source_word: ὑπερηφανίας
  choice: Hochmut
  rationale: „Hochmut“ gibt die eindeutig negative Bedeutung von überheblichem Stolz im Deutschen prägnant wieder.
- source_word: κατευωδώθη
  choice: kam … voran
  rationale: Die passive Verbform beschreibt, dass das Unternehmen einen erfolgreichen Verlauf nahm. „Kam voran“ ist natürliches modernes Deutsch und gibt den günstigen Fortgang wieder, ohne einen endgültigen Abschluss zu behaupten.
- source_word: τὸ ἔργον
  choice: das Werk
  rationale: „Werk“ ist die direkte und hinreichend offene Wiedergabe für das gemeinsame Handeln im Aufstand.
- source_word: ἐν χειρὶ αὐτῶν
  choice: unter ihrer Führung
  rationale: Die griechische Hand-Wendung bezeichnet hier Verfügungsgewalt, Leitung oder tätige Verantwortung. „Unter ihrer Führung“ vermittelt diese Funktion in natürlichem Deutsch; die wörtliche Form wird in der Fußnote genannt.
