  text: And the king’s agents, who were compelling apostasy, came to Modein
translation:
  language: de
  text: Und die Beauftragten des Königs, die zum Abfall vom Glauben zwangen, kamen nach Modeïn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ παρὰ τοῦ Βασιλέως
  choice: die Beauftragten des Königs
  rationale: Die Wendung bedeutet wörtlich »die vom König«. Im Zusammenhang sind damit Personen gemeint, die in königlichem Auftrag und mit entsprechender Vollmacht handelten. »Beauftragte des Königs« gibt diese Funktion natürlich wieder, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: καταναγκάζοντες
  choice: die ... zwangen
  rationale: Das Partizip bezeichnet starken, auferlegten Zwang. »Zwingen« bringt diese Gewalt deutlicher und natürlicher zum Ausdruck als das im heutigen Deutsch weniger konkrete »nötigen«.
- source_word: τὴν ἀποστασίαν
  choice: zum Abfall vom Glauben
  rationale: ἀποστασία kann Abfall, Abkehr oder Auflehnung bedeuten. Im unmittelbaren Zusammenhang geht es um die erzwungene Aufgabe jüdischen Glaubens und jüdischer Lebenspraxis. Die Formulierung ist für heutige Leser verständlich und bewahrt den religiösen Sinn.
- source_word: εἰς Μωδεείν
  choice: nach Modeïn
  rationale: Bei einer Bewegung zu einem Ort wird εἰς im Deutschen idiomatisch mit »nach« wiedergegeben. »Modeïn« bildet die griechische Namensform Μωδεείν transparent ab.
- source_word: Καὶ ἦλθον
  choice: Und ... kamen
  rationale: »Und« bewahrt die einfache erzählerische Verknüpfung des griechischen Textes; »kamen« entspricht der Bewegungsform ἦλθον.
theological_decisions:
- issue: Bedeutung von ἀποστασία im Verfolgungskontext
  choice: Abfall vom Glauben im religiösen Sinn
  alternative: politische Auflehnung oder allgemeine Abkehr
  rationale: Der Kontext des 1. Makkabäerbuches beschreibt den Zwang, die überlieferte jüdische Glaubenspraxis aufzugeben und fremde Riten anzunehmen. Der religiöse Sinn steht daher im Vordergrund; »Abfall vom Glauben« legt jedoch nicht fest, welche einzelne Handlung den Abfall vollzieht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am knappen griechischen Erzählstil. »Beauftragte« ist allgemeinverständlich und vermeidet eine unbelegte genauere Amtsbezeichnung; »Abfall vom Glauben« vermittelt die theologische Tragweite verständlicher als das fachsprachliche Fremdwort »Apostasie«.
