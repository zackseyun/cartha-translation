base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/065.yaml
  text: And look, Simeon your brother—I know that he is a man of counsel. Listen to him all your days; he will be a father to you.
translation:
  language: de
  text: 'Und seht: Euer Bruder Simeon – ich weiß, dass er ein verständiger Ratgeber ist. Hört allezeit auf ihn; er wird euch ein Vater sein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: seht
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf natürlich und würdevoll wieder, ohne das heute altertümlich wirkende „siehe“.
- source_word: ἀνὴρ βουλῆς
  choice: ein Mann mit gutem Rat
  rationale: Bewahrt den Gedanken eines Mannes, der verständigen Rat geben kann; „Mann des Rates“ wäre im Deutschen unnatürlich und potenziell missverständlich.
- source_word: αὐτοῦ ἀκούετε
  choice: Hört ... auf ihn
  rationale: Die deutsche Wendung bezeichnet hier nicht nur akustisches Hören, sondern das Befolgen seines Rates.
- source_word: πάσας τὰς ἡμέρας
  choice: allezeit
  rationale: Gibt die dauerhafte Geltung der Weisung knapp und idiomatisch wieder.
- source_word: εἰς πατέρα
  choice: ein Vater
  rationale: Erhält das väterliche Leitungs- und Fürsorgebild ohne zusätzliche Ausdeutung.
theological_decisions:
- issue: Art und Umfang von Simeons väterlicher Rolle
  choice: „er soll euch ein Vater sein“
  alternative: „er wird euch zum Vater sein“
  rationale: Das futurische ἔσται kann Vorhersage oder beauftragende Bestimmung ausdrücken. Im Kontext der letzten Weisungen des Mattatias bringt „soll“ die übertragene Leitungsrolle natürlich zum Ausdruck, ohne eine leibliche Vaterschaft anzudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Vers folgt der direkten Anrede und bewahrt die knappe, testamentarische Satzstruktur.
