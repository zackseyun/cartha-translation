lexical_decisions:
- source_word: πάντες
  choice: alle
  rationale: Das substantivisch gebrauchte πάντες bezeichnet umfassend die ganze betreffende Gruppe.
- source_word: οἱ φυγαδεύοντες
  choice: die … flohen
  rationale: Das artikulierte Präsenspartizip bezeichnet diejenigen, die auf der Flucht sind. Im Deutschen gibt ein Relativsatz dies natürlich wieder; „flohen“ vermeidet die heute oft strafrechtlich klingende Bezeichnung „Flüchtige“, ohne einen erreichten Zufluchtsort vorauszusetzen.
- source_word: ἀπὸ
  choice: vor
  rationale: Bei „fliehen“ bezeichnet ἀπό das, wovon man sich entfernt; idiomatisches Deutsch verwendet dafür „vor“.
- source_word: τῶν κακῶν
  choice: den Übeln
  rationale: Der substantivierte neutrale Plural kann böse Taten, bedrückende Missstände oder anderes Unheil bezeichnen. „den Übeln“ bewahrt diese Bedeutungsbreite, ohne den Bezug vorschnell einzuengen.
