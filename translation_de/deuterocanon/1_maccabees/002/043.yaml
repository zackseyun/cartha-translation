  text: und alle, die vor den Übeln fliehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der vorliegende griechische Textzeuge enthält hier nur diesen Satzteil: „und alle, die vor den Übeln fliehen“. Für sich genommen ist der Satz unvollständig und wird vermutlich im folgenden Text fortgesetzt.'
