base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/037.yaml
  text: saying[a], “Let us all die in our innocence; heaven and earth testify against you concerning us[b], that you are destroying us unjustly.”
translation:
  language: de
  text: 'und sagten: „Lasst uns alle in unserer Unschuld[a] sterben! Himmel und Erde bezeugen für uns, dass ihr uns ohne Urteil[b] vernichtet.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in unserer Lauterkeit“, „in unserer Schlichtheit“ oder „in unserer Einfalt“. Das griechische Wort kann eine ungeteilte, aufrichtige Haltung bezeichnen; hier ist wahrscheinlich schuldlose Lauterkeit gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ohne Urteil“ oder „ohne Prüfung“; gemeint sein kann, dass sie ohne Gerichtsverfahren und damit ungerecht getötet werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Partizip führt die direkte Rede ein; im Deutschen gibt eine finite, koordinierte Form den Erzählfluss natürlich wieder.
- source_word: Ἀποθάνωμεν οἱ πάντες
  choice: Lasst uns alle … sterben
  rationale: Der Aorist Konjunktiv der ersten Person Plural ist hortativ; „Lasst uns“ bewahrt diesen auffordernden Entschluss.
- source_word: ἐν τῇ ἁπλότητι ἡμῶν
  choice: in unserer Unschuld
  rationale: ἁπλότης bezeichnet wörtlich Schlichtheit, Lauterkeit oder Einfalt; im Zusammenhang betont es wahrscheinlich die schuldlose, nicht angreifende Haltung der Sprecher.
- source_word: μαρτυρεῖ ἐφʼ ἡμᾶς ὁ οὐρανὸς καὶ ἡ γῆ
  choice: Himmel und Erde bezeugen für uns
  rationale: Die kosmischen Zeugen bestätigen den Anspruch der Verfolgten. „Für uns“ wahrt die gerichtliche Bildsprache, ohne die mehrdeutige Präposition unnötig gegen die Angreifer auszudeuten.
- source_word: ἀκρίτως
  choice: ohne Urteil
  rationale: Die Wiedergabe hält die konkrete gerichtliche Bedeutung „ohne Beurteilung/Verfahren“ fest; zugleich impliziert sie die Ungerechtigkeit des Vorgehens.
- source_word: ἀπόλλυτε
  choice: ihr … vernichtet
  rationale: Das Präsens richtet sich unmittelbar an die Angreifer; „vernichtet“ bewahrt den weiteren Sinn des Verbs im tödlichen Kontext.
theological_decisions:
- issue: Bedeutung von ἁπλότης im Martyriumskontext
  choice: Unschuld
  alternative: Schlichtheit, Lauterkeit oder Einfalt
  rationale: Der Kontext legt moralische Schuldlosigkeit und Gewaltlosigkeit nahe, doch die wörtlicheren Bedeutungsnuancen werden in der Fußnote offengehalten.
- issue: Gerichtliche Ausrichtung von μαρτυρεῖ ἐφʼ ἡμᾶς
  choice: bezeugen für uns
  alternative: gegen euch Zeugnis ablegen, was uns betrifft
  rationale: ἐπί mit Akkusativ kann kontextabhängig unterschiedlich gefasst werden. Die Aussage stellt Himmel und Erde als Zeugen zugunsten der Sterbenden dar; eine ausdrückliche Ergänzung „gegen euch“ steht nicht im griechischen Text.
- issue: Bedeutung von ἀκρίτως
  choice: ohne Urteil
  alternative: ungerecht, ohne Gerichtsverfahren oder ohne Prüfung
  rationale: 'Die formnahe Wiedergabe bewahrt die rechtliche Spannung: Die Betroffenen werden ohne Prüfung beziehungsweise Rechtsspruch getötet, wodurch zugleich die Ungerechtigkeit bezeichnet wird.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist eindringlich, aber nicht archaisch. Die Fußnoten bewahren die echte Bedeutungsbreite von ἁπλότης und ἀκρίτως.
