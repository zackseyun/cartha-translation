  text: And they said to them[a], “Until now—come out and do according to the word of the king[b], and you will live.”
translation:
  language: de
  text: 'Und sie sagten zu ihnen: „Bis jetzt[a]: Kommt heraus, handelt nach dem Wort des Königs[b], dann werdet ihr leben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Bis jetzt ist es noch nicht zu spät.“ Der griechische Satzanfang ist sehr knapp und kann eine letzte Gelegenheit zum Einlenken anzeigen.'
    reason: lexical_alternative
  - marker: b
    text: „Nach dem Wort des Königs“ kann auch mit „nach dem Befehl des Königs“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕως τοῦ νῦν
  choice: Bis jetzt
  rationale: Die knappe Zeitangabe bewahrt die abrupte Formulierung des Griechischen und lässt offen, ob damit eine zeitliche Grenze oder eine letzte Gelegenheit zum Einlenken bezeichnet wird.
- source_word: ἐξέλθοντες
  choice: kommt heraus
  rationale: Das Partizip steht in einer Aufforderungsfolge und wird im natürlichen Deutschen imperativisch wiedergegeben. Im Kontext werden Menschen angesprochen, die sich zurückgezogen haben.
- source_word: ποιήσατε
  choice: handelt
  rationale: Der Imperativ fordert dazu auf, sich nach der königlichen Anordnung zu richten. „Handelt“ ist hier natürlicher als das isolierte „tut“, ohne den Sinn enger festzulegen.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: nach dem Wort des Königs
  rationale: Die Wiedergabe bleibt nahe an λόγος und bewahrt dessen Bedeutungsspielraum zwischen „Wort“, „Anordnung“ und „Befehl“.
- source_word: ζήσεσθε
  choice: dann werdet ihr leben
  rationale: Die wörtliche Aussage lässt sowohl das Weiterleben als auch die darin liegende Zusage der Verschonung erkennen. „Dann“ macht den im Satz angelegten Zusammenhang im Deutschen deutlich.
