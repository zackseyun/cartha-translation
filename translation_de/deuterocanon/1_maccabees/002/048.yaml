revisions:
- from: Und sie entrissen das Gesetz der Hand der Völker und der Hand der Könige, und sie verliehen dem Sünder keine Macht.[a]
  to: Und sie entrissen das Gesetz aus der Hand der Völker und aus der Hand der Könige, und sie gaben dem Sünder keine Macht.[a]
  rationale: Die Revision ergänzt die im Deutschen notwendige und im Griechischen zweimal vorhandene Präposition „aus“ bei „entreißen“. Sie ersetzt außerdem „verliehen“ durch das direktere „gaben“, während „Macht“ als verständliche Wiedergabe des Hornbildes und die dokumentierende Fußnote beibehalten werden.
