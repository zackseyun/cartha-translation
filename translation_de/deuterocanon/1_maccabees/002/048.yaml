  text: And they rescued the law from the hand of the nations and from the hand of the kings[a], and they did not give a horn to the sinner.
translation:
  language: de
  text: Und sie entrissen das Gesetz aus der Hand der Völker und aus der Hand der Könige, und sie gaben dem Sünder keine Macht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie gaben dem Sünder kein Horn.“ Das Horn ist in der Bibel ein Bild für Macht, Stärke oder Erhöhung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβοντο
  choice: entrissen
  rationale: Das Medium von ἀντιλαμβάνομαι kann ein unterstützendes Ergreifen, Helfen oder Retten bezeichnen. Mit dem Gesetz als Objekt und den feindlichen Mächten, aus deren Hand es genommen wird, gibt „entrissen“ die aktive Befreiung natürlich und anschaulich wieder.
- source_word: τοῦ νόμου
  choice: das Gesetz
  rationale: νόμος bezeichnet hier im makkabäischen Zusammenhang das jüdische Gesetz, die Tora. Die Großschreibung ist im Deutschen grammatisch erforderlich und legt darüber hinaus keine zusätzliche Deutung fest.
- source_word: ἐκ χειρὸς
  choice: der Hand
  rationale: Die Wendung bewahrt das konkrete biblische Bild von Gewalt, Verfügungsgewalt oder Besitz; nach „entreißen“ ist im Deutschen der Dativ idiomatisch.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: ἔθνη bedeutet wörtlich „Völker“ und bezeichnet hier nichtjüdische Völker. Diese Wiedergabe vermeidet die stärker deutenden Begriffe „Heiden“ oder „Nichtjuden“.
- source_word: τῶν βασιλέων
  choice: der Könige
  rationale: βασιλεῖς bedeutet eindeutig „Könige“; eine Verallgemeinerung zu „Herrschern“ ist nicht erforderlich.
- source_word: οὐκ ἔδωκαν κέρας
  choice: sie verliehen ... keine Macht
  rationale: κέρας heißt wörtlich „Horn“, ist hier aber ein biblisches Bild für Macht, Stärke oder Erhöhung. „Macht verleihen“ gibt den Sinn im modernen Deutschen verständlich wieder; das ursprüngliche Bild wird in der Fußnote dokumentiert.
- source_word: τῷ ἁμαρτωλῷ
  choice: dem Sünder
  rationale: Das substantivierte Adjektiv steht im Singular und bedeutet unmittelbar „dem Sünder“; die stärker wertende Wiedergabe „dem Frevler“ ist nicht nötig.
theological_decisions:
- issue: Bildhafte Bedeutung von „Horn“ im Schlusssatz
  choice: Im Haupttext die funktionale Bedeutung „Macht“ wiedergeben und das Hornbild in einer Fußnote bewahren
  alternative: „sie gaben dem Sünder kein Horn“
  rationale: Die wörtliche Formulierung wäre im heutigen Deutschen schwer verständlich und könnte wie eine gegenständliche Aussage wirken. „Macht“ vermittelt die etablierte biblische Metapher, während die Fußnote das konkrete Bild und dessen mögliche Nuancen von Stärke und Erhöhung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entrissen“ bewahrt die energische Befreiungsvorstellung und verbindet sich idiomatisch mit „der Hand“. Die Wiederholung „der Hand“ folgt bewusst der parallelen Struktur des Griechischen. Der Fußnotenmarker steht unmittelbar nach der von ihm erläuterten Schlussaussage.
