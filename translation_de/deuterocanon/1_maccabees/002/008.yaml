  text: Her sanctuary became like a man of honor;[a]
translation:
  language: de
  text: Ihr Heiligtum wurde wie ein angesehener Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Tempel wurde wie ein ruhmreicher Mann.“ Das griechische Wort ναός kann „Tempel“ oder „Heiligtum“ bedeuten; ἔνδοξος kann „angesehen“, „geehrt“ oder „ruhmreich“ heißen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: wurde
  rationale: Der Aorist von γίνομαι bezeichnet hier einen Zustandswechsel; „wurde“ gibt diesen knapp und natürlich wieder.
- source_word: ὁ ναὸς
  choice: das Heiligtum
  rationale: ναός kann den Tempel oder enger das Heiligtum bezeichnen. „Heiligtum“ bewahrt den sakralen Sinn, ohne ausdrücklich den gesamten Tempelbezirk zu meinen.
- source_word: αὐτῆς
  choice: ihr
  rationale: Das feminine Pronomen bezieht sich auf das personifizierte Jerusalem; „ihr“ erhält diese Personifikation.
- source_word: ὡς ἀνὴρ ἔνδοξος
  choice: wie ein angesehener Mann
  rationale: „Wie“ wahrt den ausdrücklichen Vergleich; ἀνήρ bleibt als „Mann“ erhalten. „Angesehen“ gibt ἔνδοξος idiomatisch als gesellschaftliche Ehre beziehungsweise Ansehen wieder, ohne die mögliche Bedeutung „ruhmreich“ auszuschließen.
theological_decisions:
- issue: Die positive Bezeichnung ἔνδοξος innerhalb eines Klagezusammenhangs
  choice: Der überlieferte positive Ausdruck wird als „angesehen“ beibehalten.
  alternative: Den Ausdruck aufgrund des Zusammenhangs negativ deuten oder ergänzen, etwa „ohne Ehre“.
  rationale: Der angegebene griechische Quelltext lautet eindeutig ἔνδοξος. Die Spannung zum Klagezusammenhang darf nicht durch eine unbelegte Negation beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildform des griechischen Textes und ihre Spannung zum Klagezusammenhang bleiben erhalten.
