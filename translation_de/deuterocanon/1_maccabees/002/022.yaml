  yaml_path: translation/deuterocanon/1_maccabees/002/022.yaml
  text: We will not obey the king’s decree by turning aside from our worship, to the right or to the left.
translation:
  language: de
  text: Wir werden dem Gesetz des Königs nicht gehorchen und von unserem Gottesdienst weder nach rechts noch nach links abweichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir werden nicht auf das Gesetz des Königs hören und von unserem Gottesdienst weder nach rechts noch nach links abweichen.“'
    reason: Die Fußnote bewahrt die wörtlichere Bedeutung von ἀκούω („hören/auf etwas hören“), während „abweichen“ die Richtungsformel und die Bedeutung von παρελθεῖν idiomatisch wiedergibt.
lexical_decisions:
- source_word: ἀκουσόμεθα
  choice: werden … nicht gehorchen
  rationale: Das Verb bedeutet zunächst „hören/auf etwas hören“, bezeichnet bei einer verbindlichen Anordnung mit Genitiv aber natürlicherweise das Gehorchen.
- source_word: νόμον τοῦ βασιλέως
  choice: dem Gesetz des Königs
  rationale: „Gesetz“ gibt νόμος direkt wieder und bewahrt die bewusste Gegenüberstellung zwischen der königlichen Vorschrift und dem überlieferten Gottesdienst.
- source_word: παρελθεῖν
  choice: abweichen
  rationale: Das Verb bezeichnet hier das Verlassen beziehungsweise Überschreiten des bisherigen Weges; „abweichen“ verbindet sich im Deutschen natürlich mit der folgenden Richtungsformel.
- source_word: λατρίαν ἡμῶν
  choice: von unserem Gottesdienst
  rationale: λατρεία meint den religiösen Dienst beziehungsweise die kultische Verehrung. „Gottesdienst“ ist würdig und verständlich und umfasst hier mehr als eine einzelne Feier.
- source_word: δεξιὰν ἢ ἀριστεράν
  choice: weder nach rechts noch nach links
  rationale: Die bildhafte feste Wendung für jede Abweichung vom richtigen Weg wird erhalten.
theological_decisions:
- issue: Bedeutung und Stellung des königlichen νόμος
  choice: „Gesetz des Königs“
  alternative: „Erlass des Königs“ oder „Befehl des Königs“
  rationale: Die wörtliche Wiedergabe vermeidet es, dem Ausdruck vorab einen engeren verwaltungsrechtlichen Sinn zuzuweisen. Der Kontext macht deutlich, dass es sich um eine königliche, dem jüdischen Gottesdienst entgegenstehende Vorschrift handelt.
- issue: Syntaktisches Verhältnis des Infinitivs παρελθεῖν
  choice: mit „und … abweichen“ als inhaltlich verbundene zweite Verweigerung wiedergegeben
  alternative: „indem wir … abweichen“ beziehungsweise „um … abzuweichen“
  rationale: Der knappe griechische Infinitiv lässt das genaue Verhältnis offen. Die koordinierte deutsche Fassung bewahrt den Sinn der Weigerung, ohne Abweichung vom Gottesdienst als Mittel des Gehorsams übermäßig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblische Richtungsformel bleibt erhalten; „Gottesdienst“ bezeichnet hier umfassend den religiösen Dienst und nicht nur eine gottesdienstliche Veranstaltung.
