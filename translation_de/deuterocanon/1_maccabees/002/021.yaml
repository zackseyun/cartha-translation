  text: Far be it from us to abandon the law and the ordinances[a].
translation:
  language: de
  text: Es sei ferne von uns, das Gesetz und die Rechtsbestimmungen aufzugeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher ließe sich die Wendung auf Gnade oder Verschonung beziehen; im Griechischen ist sie hier jedoch eine nachdrückliche Zurückweisung: „Es sei ferne von uns.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵλεως ἡμῖν
  choice: Es sei ferne von uns
  rationale: Die Verbindung mit dem Infinitiv ist eine nachdrückliche Zurückweisung. Die im Deutschen geläufige, würdige Wendung bewahrt diese Kraft, ohne das griechische Idiom hölzern wiederzugeben.
- source_word: καταλεῖπειν
  choice: aufzugeben
  rationale: Bezeichnet hier das bewusste Verlassen der bindenden Weisung. „Aufzugeben“ ist gegenwärtiges Standarddeutsch und bringt den entschiedenen Treuebruch klar zum Ausdruck.
- source_word: νόμον
  choice: das Gesetz
  rationale: Im Zusammenhang ist die bestimmte Größe der Tora beziehungsweise der überlieferten Weisung Israels gemeint; daher ist der bestimmte Artikel im Deutschen sachgerecht.
- source_word: δικαιώματα
  choice: die Rechtsbestimmungen
  rationale: Das Wort bezeichnet festgesetzte rechtliche oder kultische Vorschriften. „Rechtsbestimmungen“ ist verständlich und wahrt die rechtliche Bedeutung, ohne den Umfang auf einen einzelnen Bereich einzuengen.
theological_decisions:
- issue: Bundesbezogene Bedeutung von νόμον καὶ δικαιώματα
  choice: das Gesetz und die Rechtsbestimmungen
  alternative: das Gesetz und die Satzungen
  rationale: Die Formulierung bewahrt den Bezug auf Israels verbindliche, überlieferte Gottesordnung, ohne spätere konfessionelle Kategorien einzutragen.
- issue: Deutung von ἵλεως ἡμῖν
  choice: als idiomatische, starke Zurückweisung
  alternative: als wörtliche Bitte um Gnade oder Verschonung
  rationale: Die Konstruktion mit dem Infinitiv trägt idiomatisch den Sinn „Es sei ferne von uns“. Eine rein wörtliche Wiedergabe würde die Aussage im Deutschen verdunkeln; die formale Bildlichkeit wird deshalb in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung „Es sei ferne von uns“ ist weiterhin verständlich und entspricht der feierlichen, entschiedenen Ablehnung. „Rechtsbestimmungen“ vermeidet das heute teils altertümliche „Satzungen“.
