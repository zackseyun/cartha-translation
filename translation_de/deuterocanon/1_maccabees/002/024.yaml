base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/024.yaml
  text: And Mattathias saw it and was zealous, and his inward parts trembled, and he brought up wrath according to the judgment, and running up he slaughtered him on the altar.
translation:
  language: de
  text: Und Mattatias sah es und wurde von Eifer ergriffen. Sein Innerstes erbebte[a], und er ließ seinem Zorn freien Lauf, dem Urteil entsprechend[b]. Dann lief er hin und schlachtete ihn auf dem Altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Seine Nieren erbebten“ – eine semitisch geprägte Wendung für tiefste innere Erregung oder Gemütsbewegung.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „wie es das Recht verlangte“ oder „gemäß der Satzung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: wurde von Eifer ergriffen
  rationale: Gibt den aufkommenden, von Empörung geprägten Eifer natürlich wieder und bewahrt zugleich das Motiv des Eifers für Gottes Gesetz, ohne bloße Eifersucht auszudrücken.
- source_word: οἱ νεφροὶ αὐτοῦ
  choice: sein Innerstes
  rationale: Das Griechische nennt wörtlich die Nieren als Sitz tiefster Regungen. „Sein Innerstes“ erhält die körperlich-emotionale Bildhaftigkeit, ohne im Haupttext anatomisch befremdlich zu wirken.
- source_word: ἀνήνεγκεν θυμόν
  choice: er ließ seinem Zorn freien Lauf
  rationale: Die Wendung vermittelt, dass der aufsteigende Zorn in entschlossenes Handeln übergeht. Diese idiomatische deutsche Formulierung ist verständlich, ohne die Heftigkeit abzuschwächen.
- source_word: κατὰ τὸ κρίμα
  choice: dem Urteil entsprechend
  rationale: Bewahrt den gerichtlichen Sinn von κρίμα und lässt offen, ob ein göttliches Rechtsurteil, eine Satzung oder der Vollzug von Recht gemeint ist.
- source_word: δραμὼν
  choice: dann lief er hin
  rationale: Gibt die unverzügliche, schnelle Bewegung auf den Mann und den Altar zu in natürlichem Deutsch wieder.
- source_word: ἔσφαξεν
  choice: schlachtete
  rationale: Bewahrt die Härte von σφάζω und dessen möglichen Opferklang; „tötete“ wäre weniger eindringlich.
- source_word: ἐπὶ τὸν βωμόν
  choice: auf dem Altar
  rationale: Macht entsprechend der naheliegenden räumlichen Bedeutung ausdrücklich, dass die Tötung auf dem Altar geschah.
theological_decisions:
- issue: Eifer, Rechtsurteil und gewaltsame Tötung
  choice: Die Begriffe „Eifer“, „Urteil“ und „schlachtete“ bleiben ausdrücklich stehen, ohne die Tat zu mildern oder zusätzlich zu rechtfertigen.
  alternative: 'Deutend übersetzen: „Er geriet in Wut und vollstreckte an ihm das Gesetz.“'
  rationale: Der griechische Text verbindet gesetzestreuen Eifer, gerichtliche Sprache und drastische Gewalt. Die Übersetzung bewahrt diese theologische und ethische Spannung, statt sie durch Erklärung oder konfessionelle Deutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze halten das schnelle Erzähltempo aufrecht; die drastische Wortwahl des griechischen Textes wird nicht geglättet.
