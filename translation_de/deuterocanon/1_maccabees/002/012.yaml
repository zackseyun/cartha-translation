  text: And look—our holy things, our beauty, and our glory have been laid waste, and the nations have defiled them.
translation:
  language: de
  text: 'Und sieh: unsere heiligen Dinge[a], unsere Schönheit und unsere Herrlichkeit sind verwüstet worden, und die Völker haben sie entweiht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unser Heiligtum. Das griechische Wort steht im Plural und kann heilige Dinge ebenso wie den Heiligtumsbereich als Gesamtheit bezeichnen.'
    reason: Bewahrt die im griechischen τὰ ἅγια angelegte Referenzoffenheit, ohne die kontextnahe Deutung „Heiligtum“ auszuschließen.
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf knapp und würdig wieder.
- source_word: τὰ ἅγια ἡμῶν
  choice: unser Heiligtum
  rationale: Der substantivierte Plural bezeichnet im Zusammenhang wahrscheinlich die heilige Stätte beziehungsweise den Tempelbereich; der deutsche Singular ist natürlich und passt zum singularischen Prädikat ἠρημώθη.
- source_word: ἡ καλλονὴ ἡμῶν
  choice: unsere Schönheit
  rationale: Bewahrt das konkrete und zugleich poetische Bild des griechischen Ausdrucks.
- source_word: ἡ δόξα ἡμῶν
  choice: unsere Herrlichkeit
  rationale: Erhält die religiöse und öffentliche Bedeutungsweite von δόξα, ohne sie auf Ruhm oder Ehre einzuengen.
- source_word: ἠρημώθη
  choice: sind verwüstet
  rationale: Gibt den resultativen Passivgedanken idiomatisch wieder; im Deutschen wird das zusammengesetzte Subjekt im Plural aufgenommen.
- source_word: ἔθνη
  choice: die Völker
  rationale: Entspricht dem üblichen Sinn von ἔθνη und vermeidet die kontextuell mögliche, aber stärker wertende Wiedergabe „Heiden“.
- source_word: ἐβεβήλωσαν
  choice: haben entweiht
  rationale: Trifft den kultischen Sinn der Profanierung unmittelbar.
theological_decisions:
- issue: Bezug von τὰ ἅγια
  choice: unser Heiligtum
  alternative: unsere heiligen Dinge
  rationale: Der Kontext der Tempelentweihung legt die heilige Stätte nahe. Die Alternative wäre formaler, klingt im Deutschen jedoch unbestimmt und weniger natürlich.
- issue: Wiedergabe von ἔθνη
  choice: die Völker
  alternative: die Heiden
  rationale: „Völker“ bewahrt die lexikalische Breite und importiert keine zusätzliche konfessionelle oder abwertende Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Dreierfolge. Der Doppelpunkt nach „sieh“ bewahrt die deiktische Dringlichkeit; das Semikolon verbindet Verwüstung und Entweihung eng, ohne den griechischen Satzbau künstlich nachzuahmen.
