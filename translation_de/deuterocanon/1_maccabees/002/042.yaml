base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/042.yaml
  text: Then a company of Hasideans gathered to them[a], mighty in strength from Israel, everyone who willingly devoted himself to the law.
translation:
  language: de
  text: 'Da schloss sich ihnen eine Schar Asidäer[a] an, eine starke Gruppe aus Israel: alle, die sich freiwillig dem Gesetz verpflichtet hatten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Chassidim“ oder „Assidäer“; Bezeichnung einer jüdischen Gruppe, die für ihren Eifer für das Gesetz bekannt war.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτούς
  choice: versammelte sich bei ihnen
  rationale: Die Wendung bezeichnet eine Bewegung hin zu der zuvor genannten Gruppe und den Anschluss an sie, ohne eine förmliche Rekrutierung vorauszusetzen.
- source_word: συναγωγὴ
  choice: eine Schar
  rationale: Das Wort meint hier eine versammelte Gruppe. „Schar“ ist natürlich und vermeidet die späteren institutionellen Assoziationen von „Synagoge“.
- source_word: Ἀσιδαίων
  choice: Asidäern
  rationale: Der Ausdruck wird als historischer Gruppenname transliteriert und nicht deutend mit „Fromme“ wiedergegeben.
- source_word: ἰσχυρὰ δυνάμει
  choice: eine starke Streitmacht
  rationale: δύναμις kann in diesem erzählerisch-militärischen Zusammenhang eine Streitmacht bezeichnen; „starke“ bewahrt die nachdrückliche Aussage von ἰσχυρά.
- source_word: ἀπὸ Ἰσραήλ
  choice: aus Israel
  rationale: ἀπό bezeichnet Herkunft oder Ursprung; die Formulierung lässt die genaue soziale beziehungsweise nationale Zuordnung offen.
- source_word: πᾶς ὁ ἑκουσιαζόμενος τῷ νόμῳ
  choice: alle, die sich freiwillig dem Gesetz verschrieben hatten
  rationale: Die Wiedergabe bringt sowohl die Freiwilligkeit als auch die persönliche Bindung an das Gesetz zum Ausdruck, ohne den Ausdruck auf bloße Gesetzesbefolgung oder militärische Freiwilligenmeldung zu verengen.
theological_decisions:
- issue: Wiedergabe des Gruppennamens Ἀσιδαίων
  choice: Asidäer
  alternative: Chassidim; Assidäer; die Frommen
  rationale: Da der Ausdruck eine bestimmte historische Gruppe bezeichnet, bleibt er als Name erhalten. Eine Übersetzung mit „die Frommen“ würde Gruppenbezeichnung und Charakterisierung vorschnell gleichsetzen.
- issue: Bedeutung von ἑκουσιαζόμενος τῷ νόμῳ
  choice: sich freiwillig dem Gesetz verschreiben
  alternative: sich freiwillig für das Gesetz melden; dem Gesetz aus freien Stücken ergeben sein
  rationale: Die Formulierung wahrt die freiwillige, aktive Hingabe an das Gesetz, ohne eindeutig festzulegen, ob vor allem religiöse Treue oder konkreter kämpferischer Einsatz gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schar“ und „Streitmacht“ passen zum erzählerischen und konfliktgeprägten Kontext; der Doppelpunkt macht deutlich, dass der letzte Satzteil die Zusammensetzung der Gruppe näher beschreibt.
