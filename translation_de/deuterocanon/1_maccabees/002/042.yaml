  source_fidelity: 'Die Grundstruktur ist zutreffend erfasst: Eine Gruppe der Asidäer schließt sich der zuvor genannten Gruppe an, und ihre freiwillige Bindung an das Gesetz wird wiedergegeben. „Streitmacht“ legt jedoch stärker als der griechische Text fest, dass συναγωγή/δύναμις eine militärische Einheit bezeichnet. Der Text beschreibt eine versammelte Gruppe, die „stark an Kraft“ ist; der militärische Kontext erlaubt diese Nuance, verlangt aber nicht die terminologische Festlegung „Streitmacht“.'
  naturalness: „Da schloss sich ihnen ... an“ gibt die Bewegung und den Anschluss, die πρὸς αὐτούς nahelegt, im modernen Deutsch natürlicher wieder als „versammelte sich bei ihnen“. Die appositionelle Formulierung mit Doppelpunkt bleibt klar und würdig.
  terminology: „Asidäer“ ist als eingedeutschte Transkription eines historischen Gruppennamens vertretbar. Die Fußnote bietet nachvollziehbare Varianten. „Gesetz“ ist hier als Bezeichnung für die Tora passend; eine konfessionell interpretierende Zuspitzung wird vermieden.
