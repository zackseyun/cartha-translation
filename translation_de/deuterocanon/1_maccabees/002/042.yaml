    rationale: πρὸς αὐτούς bezeichnet die Hinwendung zu der zuvor genannten Gruppe. „Schloss sich ihnen an“ bringt diesen Zusammenhang idiomatisch und ohne zusätzliche Deutung zur Geltung.
