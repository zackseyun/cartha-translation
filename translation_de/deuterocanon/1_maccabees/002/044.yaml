base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/044.yaml
  text: They joined them and became a support for them[a]. They also formed a force and struck down sinners in their anger, and lawless men in their wrath[b]; and the rest fled to the nations to save themselves.
translation:
  language: de
  text: Sie schlossen sich ihnen an und wurden ihnen zur Stütze.[a] Sie stellten auch eine Streitmacht auf und schlugen in ihrem Zorn die Sünder nieder und in ihrem Grimm die gesetzlosen Männer. Die Übrigen flohen zu den Völkern,[b] um sich zu retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie wurden ihnen hinzugefügt.“ Das griechische Verb kann den Anschluss an die Gruppe auch förmlicher ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Mit den „Völkern“ sind wahrscheinlich umliegende nichtjüdische Völker oder deren Gebiete gemeint; sinngemäß auch: „zu den Nichtjuden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετέθησαν
  choice: schlossen sich ihnen an
  rationale: Das Passiv von προστίθημι bezeichnet hier den Anschluss an eine Gruppe. Die Formulierung ist im Deutschen natürlich und bewahrt den Gedanken des Hinzukommens.
- source_word: εἰς στήριγμα
  choice: zur Stütze
  rationale: στήριγμα bezeichnet Halt oder Unterstützung. „Zur Stütze“ gibt die prädikative Konstruktion ἐγένοντο ... εἰς knapp und konkret wieder.
- source_word: συνεστήσαντο δύναμιν
  choice: stellten eine Streitmacht auf
  rationale: Die Wendung beschreibt das Organisieren militärischer Stärke. „Eine Streitmacht aufstellen“ ist idiomatisches modernes Deutsch, ohne δύναμις zwingend als reguläres Heer festzulegen.
- source_word: ἐπάταξαν
  choice: schlugen ... nieder
  rationale: πατάσσω bezeichnet ein gewaltsames Schlagen, im Kampf häufig mit tödlicher Folge. „Niederschlagen“ erhält diese Stärke, ohne ausdrücklich mehr als das Verb selbst zu behaupten.
- source_word: ἁμαρτωλούς
  choice: die Sünder
  rationale: Die moralisch-religiöse Wertung des griechischen Ausdrucks wird direkt beibehalten.
- source_word: ἐν ὀργῇ αὐτῶν
  choice: in ihrem Zorn
  rationale: ὀργή wird als „Zorn“ wiedergegeben; dadurch bleibt die Parallelität mit θυμός erhalten, ohne beide Begriffe völlig gleichzusetzen.
- source_word: ἄνδρας ἀνόμους
  choice: die gesetzlosen Männer
  rationale: ἀνόμους bedeutet „gesetzlos“, und ἄνδρας ist ausdrücklich männlich. Die Übersetzung bewahrt beides.
- source_word: ἐν θυμῷ αὐτῶν
  choice: in ihrem Grimm
  rationale: θυμός bezeichnet hier heftige, aufflammende Wut. „Grimm“ wahrt die Intensität und variiert gegenüber ὀργή („Zorn“).
- source_word: οἱ λοιποί
  choice: die Übrigen
  rationale: Die Formulierung bezeichnet die verbleibenden Angehörigen der gegnerischen Gruppe.
- source_word: εἰς τὰ ἔθνη
  choice: zu den Völkern
  rationale: ἔθνη verweist in diesem jüdisch-makkabäischen Zusammenhang wahrscheinlich auf umliegende nichtjüdische Völker oder deren Gebiete. „Zu den Völkern“ bleibt formal nah und lässt diese Bedeutungsbreite bestehen.
- source_word: σωθῆναι
  choice: um sich zu retten
  rationale: Der passive Infinitiv nach dem Verb der Bewegung drückt das Ziel der Flucht aus. Die reflexive deutsche Wendung gibt den praktischen Sinn idiomatisch wieder.
theological_decisions:
- issue: Moralische Bezeichnungen im militärischen Zusammenhang
  choice: „Sünder“ und „gesetzlose Männer“ als Wertungen des Textes beibehalten
  alternative: „Übeltäter“ und „Gesetzesbrecher“
  rationale: Der griechische Text deutet den Konflikt ausdrücklich in moralisch-religiösen Kategorien. Diese Wertung darf nicht zu einer rein politischen Beschreibung abgeschwächt werden.
- issue: Geschlechtsspezifische Wiedergabe von ἄνδρας
  choice: „Männer“
  alternative: „Menschen“ oder „Leute“
  rationale: Das griechische Substantiv ist ausdrücklich männlich; die Übersetzung bildet diese Angabe ab.
- issue: Bezug von ἔθνη
  choice: „Völker“ mit erläuternder Fußnote
  alternative: „Heiden“ oder „Nichtjuden“
  rationale: Der Kontext legt nichtjüdische Völker beziehungsweise deren Gebiete nahe, doch die formalere Wiedergabe wahrt die lexikalische Offenheit und vermeidet eine unnötig konfessionell oder abwertend klingende Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Gewalt und die moralischen Kategorien des Ausgangstextes bleiben ungeschönt erhalten. Die parallelen Ausdrücke ὀργή und θυμός werden mit „Zorn“ und „Grimm“ unterschieden. Der Fußnotenmarker [b] steht bei „Völkern“, auf das sich die Erläuterung tatsächlich bezieht.
