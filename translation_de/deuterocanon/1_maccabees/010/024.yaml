  text: I too will write to them words of encouragement and honor and gifts,[a]
translation:
  language: de
  text: Auch ich will ihnen Worte der Ermutigung, der Ehrung und der Geschenke schreiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische lautet wörtlich „Worte der Ermutigung, der Erhebung und der Geschenke“. Das Wort für „Ehrung“ bedeutet eigentlich „Höhe“ oder „Erhebung“ und kann eine Ehrerweisung oder Erhöhung des Ranges bezeichnen. Die genaue syntaktische Beziehung von „Geschenke“ zu „Worte“ bzw. „schreiben“ bleibt knapp; möglich sind etwa Worte über Geschenke oder eine Verbindung von ehrenden Worten und Gaben.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψω
  choice: will … schreiben
  rationale: Der Futur Indikativ Aktiv bezeichnet die beabsichtigte nächste Handlung des Sprechers.
- source_word: κἀγώ
  choice: Auch ich
  rationale: Die Krasis aus καί und ἐγώ hat einen additiven, leicht betonten Sinn, den „Auch ich“ natürlich wiedergibt.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet bei γράψω die Empfänger des Schreibens.
- source_word: λόγους
  choice: Worte
  rationale: Die allgemeine Bezeichnung führt Art oder Inhalt des angekündigten Schreibens ein und bleibt in der Übersetzung bewusst breit.
- source_word: παρακλήσεως
  choice: der Ermutigung
  rationale: παράκλησις kann Ermutigung, Zuspruch oder Aufforderung bedeuten; im diplomatisch-politischen Zusammenhang passt positiver Zuspruch, ohne den Sinn unnötig einzuengen.
- source_word: ὕψους
  choice: der Auszeichnung
  rationale: Das Wort bedeutet wörtlich „Höhe/Erhebung“ und kann hier gesellschaftliche Erhöhung, Rang oder Ehrung bezeichnen. „Auszeichnung“ bewahrt diesen politischen Sinn besser als das abstraktere „Ehre“.
- source_word: δομάτων
  choice: Geschenke versprechen
  rationale: δόματα sind Gaben oder Geschenke. Da man Geschenke nicht im wörtlichen Sinn „schreibt“, macht die idiomatische Ergänzung „versprechen“ die elliptische Zuordnung zu λόγους verständlich, ohne die Gaben selbst zu bloßen Worten zu machen.
