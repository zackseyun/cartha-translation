  text: And each one left his place and went away to his own land.
translation:
  language: de
  text: Und jeder verließ seinen Ort und ging in sein Land.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν
  choice: verließ
  rationale: Der Aorist von καταλείπω bezeichnet hier das Zurücklassen eines Ortes. „Verließ“ gibt den schlichten erzählerischen Sinn wieder, ohne ihn durch „gab auf“ zu verstärken.
- source_word: ἕκαστος
  choice: jeder
  rationale: ἕκαστος hebt die einzelne, jeweils für sich handelnde Person hervor. Das generische „jeder“ bewahrt diese distributive Bedeutung im natürlichen Deutschen.
- source_word: τὸν τόπον αὐτοῦ
  choice: seinen Ort
  rationale: τόπος bedeutet grundsätzlich „Ort“ oder „Platz“. Obwohl der Zusammenhang auch eine Stellung oder einen Posten nahelegen könnte, bewahrt „seinen Ort“ die Breite des griechischen Ausdrucks.
- source_word: ἀπῆλθεν
  choice: kehrte … zurück
  rationale: ἀπέρχομαι bezeichnet das Weggehen. In Verbindung mit dem Ziel „in sein eigenes Land“ drückt das idiomatische „kehrte … zurück“ die Bewegung fort vom bisherigen Ort hin zum eigenen Land natürlich aus.
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: in sein eigenes Land
  rationale: γῆ bezeichnet hier das jeweilige Heimatgebiet. „Sein eigenes Land“ gibt den possessiven Bezug klar wieder, ohne den modernen nationalstaatlichen Beiklang von „Staat“ einzutragen.
