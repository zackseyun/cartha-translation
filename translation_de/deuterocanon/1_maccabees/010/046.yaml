base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/046.yaml
  text: But when Jonathan and the people heard these words[a], they did not believe them or accept them, because they remembered the great evil that he had done in Israel[b], and how he had oppressed them severely.
translation:
  language: de
  text: Als aber Jonathan und das Volk diese Worte hörten, glaubten sie ihnen nicht und nahmen sie auch nicht an.[a] Denn sie erinnerten sich an das große Unrecht, das er in Israel[b] begangen hatte, und daran, wie schwer er sie bedrängt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie vertrauten ihnen nicht und nahmen sie nicht auf.« Das Griechische unterscheidet zwischen dem Nichtglauben und dem Nichtannehmen der Worte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »an Israel« beziehungsweise »gegen Israel«. Wörtlich steht im Griechischen »in Israel«; gemeint sein kann Unrecht, das innerhalb Israels oder gegen Israel als Volk verübt wurde.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐπίστευσαν αὐτοῖς
  choice: sie glaubten ihnen nicht
  rationale: Das Verb bezeichnet hier, dass Jonathan und das Volk den Worten keinen Glauben schenkten. Das Pronomen wird im Deutschen natürlich auf »diese Worte« bezogen.
- source_word: οὐδὲ ἐπεδέξαντο
  choice: und nahmen sie auch nicht an
  rationale: Die Formulierung wahrt den Unterschied zwischen dem inneren Glauben an die Botschaft und ihrer zustimmenden Annahme.
- source_word: ἐμνήσθησαν
  choice: sie erinnerten sich
  rationale: Die einfache narrative Wiedergabe erhält die Begründungsfunktion des Erinnerns.
- source_word: τῆς κακίας τῆς μεγάλης
  choice: an das große Unrecht
  rationale: »Unrecht« bezeichnet hier schweres schuldhaftes Handeln, ohne den Ausdruck auf eine bloße innere Bosheit oder ausschließlich auf den entstandenen Schaden zu verengen.
- source_word: ἧς ἐποίησεν ἐν Ἰσραήλ
  choice: das er in Israel begangen hatte
  rationale: »Begangen« ist im Deutschen idiomatisch mit »Unrecht«; »in Israel« bildet die griechische Präposition ἐν unmittelbar ab und lässt deren Beziehung offen.
- source_word: ἔθλιψεν αὐτοὺς σφόδρα
  choice: wie schwer er sie bedrängt hatte
  rationale: »Bedrängt« gibt das Zufügen großen Drucks und Leids wieder; »schwer« erhält die starke adverbiale Intensivierung durch σφόδρα.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts der früheren feindlichen Taten
  choice: Singular »er«
  alternative: Ein kollektives »sie« aufgrund des weiteren politischen Zusammenhangs
  rationale: Die griechischen Verbformen ἐποίησεν und ἔθλιψεν stehen im Singular. Die Übersetzung bewahrt diesen grammatischen Bezug, ohne den historischen Referenten weiter auszudeuten.
- issue: Bedeutung von ἐν in der Wendung ἐν Ἰσραήλ
  choice: »in Israel«
  alternative: »an Israel« oder »gegen Israel«
  rationale: Die formale Ortsangabe kann Unrecht innerhalb Israels bezeichnen, während der Zusammenhang zugleich eine gegen Israel gerichtete Handlung nahelegen kann. Der Haupttext erhält die griechische Offenheit; die alternative Deutung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt narrativ klar; »großes Unrecht« und »schwer bedrängt« sind verständlich und gewichtig, ohne die semantische und theologische Offenheit des griechischen Textes unnötig festzulegen.
