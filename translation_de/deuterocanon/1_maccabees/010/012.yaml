  text: And the foreigners who were in the strongholds that Bacchides had built fled.
translation:
  language: de
  text: Und die Fremden, die sich in den Festungen befanden, die Bakchides gebaut hatte, flohen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφυγον
  choice: flohen
  rationale: Der Aorist von φεύγω bezeichnet hier die Flucht; „flohen“ ist knapp, natürlich und fügt dem Vorgang keine unbelegte Nuance hinzu.
- source_word: ἀλλογενεῖς
  choice: die Fremden
  rationale: Das Wort bezeichnet Menschen aus einem anderen Volk. „Die Fremden“ bewahrt in diesem militärisch-historischen Zusammenhang den Sinn ethnischer Außenstehender, ohne die möglichen theologischen Nebenbedeutungen von „Heiden“ einzutragen.
- source_word: ὀχυρώμασιν
  choice: Festungen
  rationale: ὀχύρωμα bezeichnet einen befestigten Ort oder eine Befestigungsanlage; „Festungen“ ist im Deutschen natürlich und passt zum militärischen Zusammenhang.
- source_word: οἱ ὄντες ἐν
  choice: die sich ... befanden
  rationale: Die partizipiale Wendung wird als natürlicher deutscher Relativsatz wiedergegeben und bezeichnet den damaligen Aufenthaltsort der Fremden.
- source_word: οἷς οἰκοδόμησεν
  choice: die ... hatte bauen lassen
  rationale: Das Relativpronomen bezieht sich auf die Festungen. Das Plusquamperfekt macht deutlich, dass ihre Errichtung der Flucht vorausging. „Bauen lassen“ entspricht im historischen Kontext natürlichem Deutsch und lässt offen, ob Bakchides persönlich baute oder den Bau veranlasste.
- source_word: Βακχίδης
  choice: Bakchides
  rationale: Der Personenname wird entsprechend seiner griechischen Form ins Deutsche transliteriert; „Bakchides“ ist eine gebräuchliche deutsche Wiedergabe.
