base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/082.yaml
  text: And Simon deployed his force and joined battle with the phalanx[a], for the cavalry had been thrown into disorder[c][b]; and they were crushed by him and fled.
translation:
  language: de
  text: Und Simon setzte seine Streitmacht in Bewegung und nahm den Kampf mit der Phalanx auf. Denn die Reiterei[a] hatte sich aufgelöst[b]; sie wurden von ihm zerschlagen und flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „das Pferd“; gemeint ist die Reiterei.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „war auseinandergebrochen“; gemeint ist der Verlust ihres Zusammenhalts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλυσεν
  choice: setzte … in Bewegung
  rationale: Das Verb bezeichnet hier im militärischen Zusammenhang das Freisetzen beziehungsweise In-Gang-Setzen der eigenen Streitmacht. Die Formulierung ist verständlich, ohne eine bestimmte taktische Aufstellung hinzuzufügen.
- source_word: τὴν δύναμιν αὐτοῦ
  choice: seine Streitmacht
  rationale: δύναμις bezeichnet hier kollektiv Simons militärische Kräfte; „Streitmacht“ bewahrt den Singular und ist nicht so eng wie „Heer“.
- source_word: συνῆψεν πρὸς τὴν φάλαγγα
  choice: nahm den Kampf mit der Phalanx auf
  rationale: Die Wendung bezeichnet den Eintritt in den Kampf gegen die gegnerische Formation. Diese Wiedergabe ist im Deutschen natürlich und macht die Gegenrichtung von πρός deutlich.
- source_word: φάλαγγα
  choice: Phalanx
  rationale: Der historische Fachbegriff erhält die konkrete hellenistische Gefechtsformation des griechischen Textes.
- source_word: ἡ ἵππος
  choice: die Reiterei
  rationale: Wörtlich steht das kollektiv gebrauchte „Pferd“; im militärischen Zusammenhang ist damit die Kavallerie gemeint.
- source_word: ἐξελύθη
  choice: hatte sich aufgelöst
  rationale: Der Aorist Passiv beschreibt den Verlust des Zusammenhalts der Reiterei. Das Plusquamperfekt bildet die im Kontext vorausliegende Ursache ab, ohne bereits die anschließend ausdrücklich genannte Flucht vorwegzunehmen.
- source_word: συνετρίβησαν
  choice: wurden … zerschlagen
  rationale: Das Verb bezeichnet eine vernichtende Niederlage beziehungsweise das Zerbrechen einer Kampfformation und wird mit einer im Deutschen üblichen militärischen Wendung wiedergegeben.
- source_word: ἀπʼ αὐτοῦ
  choice: von ihm
  rationale: Die Präposition kann hier Simon als den Urheber der Niederlage kennzeichnen. „Von ihm“ gibt diese naheliegende agentive Lesart knapp wieder.
