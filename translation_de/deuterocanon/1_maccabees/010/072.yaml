review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt die Imperative ἐρώτησον καὶ μάθε als direkte Aufforderung zutreffend wieder. Die Verbindung von λοιποί und βοηθοῦντες ist mit „die Übrigen ..., die uns helfen“ vollständig erfasst. „Sie sagen“ bewahrt den griechischen Präsens sowie das nicht ausdrücklich bestimmte Pluralsubjekt. „Ihr könnt uns nicht standhalten“ ist eine natürliche kontextgerechte Wiedergabe des idiomatischen στάσις ποδὸς κατὰ πρόσωπον ἡμῶν; die Fußnote dokumentiert das konkrete Bild. δὶς ἐτροπώθησαν ist mit „wurden zweimal ... in die Flucht geschlagen“ treffend militärisch wiedergegeben. Der Wechsel von pluralischem „ihr/euch“ zu singularischem „deine“ entspricht dem griechischen Text und wurde zu Recht nicht geglättet.
  naturalness: Die Formulierung ist modernes, gut lesbares Standarddeutsch und wahrt den herausfordernden Ton. „Frag nach und erfahre“ und „in die Flucht geschlagen“ sind idiomatisch. Die Satztrennung vor „Sie sagen“ ist im Deutschen flüssig und verändert weder die Aussage noch die offene Referenz des griechischen Plurals.
  terminology: Keine theologisch oder historisch problematische Terminologie. „Väter“ bleibt als rhetorisch markierte, quellennähere Bezeichnung angemessen. Die Fußnote erklärt das Bild ohne eine weitergehende Deutung oder konfessionelle Festlegung.
