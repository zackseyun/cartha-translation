base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/072.yaml
  text: Ask and learn who I am and who the rest are who are helping us; and they say[a], ‘You have no place to stand before us, because your fathers were routed twice in their own land.’
translation:
  language: de
  text: 'Frag nach und erfahre, wer ich bin und wer die Übrigen sind, die uns helfen. Sie sagen: »Ihr könnt uns nicht standhalten[a], denn deine Väter wurden zweimal in ihrem eigenen Land in die Flucht geschlagen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Für euch gibt es vor unserem Angesicht keinen Stand des Fußes.« Gemeint ist, dass sie dem Gegner nicht standhalten können.'
    reason: Die Fußnote bewahrt das konkrete Fuß-Motiv und die ungewöhnliche Ausdrucksweise des griechischen Idioms.
lexical_decisions:
- source_word: ἐρώτησον καὶ μάθε
  choice: Frag nach und erfahre
  rationale: Die beiden Imperative bleiben als Abfolge von Erkundigung und gewonnener Kenntnis erhalten; die Formulierung ist zugleich natürlich und direkt.
- source_word: οἱ λοιποὶ οἱ βοηθοῦντές ἡμῖν
  choice: die Übrigen, die uns helfen
  rationale: „Die Übrigen“ gibt λοιποί wieder, während „uns helfen“ die aktive, nicht unnötig militarisierte Bedeutung von βοηθοῦντες bewahrt.
- source_word: λέγουσιν
  choice: Sie sagen
  rationale: Der griechische Präsens Indikativ und das nicht näher bestimmte Pluralsubjekt werden formal bewahrt; weder Zukunft noch ein zusätzliches indirektes Objekt werden ergänzt.
- source_word: Οὐκ ἔστιν ὑμῖν στάσις ποδὸς κατὰ πρόσωπον ἡμῶν
  choice: Ihr könnt uns nicht standhalten
  rationale: Die deutsche Wendung vermittelt im militärischen Zusammenhang, dass die Angeredeten vor dem Gegner keinen festen Stand behaupten können. Das zugrunde liegende Fuß-Motiv wird in der Fußnote offengelegt.
- source_word: δὶς ἐτροπώθησαν
  choice: wurden zweimal in die Flucht geschlagen
  rationale: „In die Flucht geschlagen“ bringt den passiven, militärischen Sinn von ἐτροπώθησαν präziser zum Ausdruck als das allgemeinere „besiegt“.
- source_word: οἱ πατέρες σου
  choice: deine Väter
  rationale: Die wörtliche und rhetorisch zugespitzte Bezeichnung der Vorfahren bleibt erhalten; ebenso bleibt der auffällige Wechsel vom pluralischen „ihr“ zum singularischen „deine“ bestehen.
- source_word: ἐν τῇ γῇ αὐτῶν
  choice: in ihrem eigenen Land
  rationale: „Eigenen“ verdeutlicht idiomatisch den possessiven Nachdruck von αὐτῶν und verstärkt die im Satz enthaltene Schmähung.
