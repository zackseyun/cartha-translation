base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/061.yaml
  text: And pestilent men from Israel gathered against him[a], lawless men, to bring charges against him[b]; but the king paid no attention to them.
translation:
  language: de
  text: Es versammelten sich gegen ihn üble Männer aus Israel, gesetzlose Männer, um gegen ihn Beschwerde zu führen.[a] Doch der König schenkte ihnen kein Gehör.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »um gegen ihn vorstellig zu werden«. Die Wendung kann eine Beschwerde oder Anschuldigung gegen ihn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν ἐπʼ αὐτόν
  choice: rotteten sich … gegen ihn zusammen
  rationale: Die Form bezeichnet ein Zusammenkommen; der feindliche Zusammenhang gibt ἐπί adversative Bedeutung. „Sich zusammenrotten“ gibt die organisierte feindselige Versammlung natürlich und kräftig wieder.
- source_word: ἄνδρες λοιμοί
  choice: üble Männer
  rationale: λοιμός bezeichnet wörtlich eine Seuche und übertragen einen verderblichen Menschen oder Unruhestifter. „Üble Männer“ ist verständlich und bewahrt den starken Tadel, während die ungewöhnliche Bildlichkeit in der Fußnote sichtbar bleibt.
- source_word: ἐξ Ἰσραήλ
  choice: aus Israel
  rationale: Die Wendung bezeichnet ihre Herkunft beziehungsweise Zugehörigkeit.
- source_word: ἄνδρες παράνομοι
  choice: gesetzlose Männer
  rationale: παράνομος bedeutet dem Gesetz zuwider oder gesetzlos; die formale und wertende Aussage bleibt erhalten.
- source_word: ἐντυχεῖν κατʼ αὐτοῦ
  choice: um ihn anzuklagen
  rationale: ἐντυγχάνω mit κατά kann im administrativen oder gerichtlichen Zusammenhang bedeuten, gegen jemanden vorstellig zu werden oder Beschwerde zu führen. „Anklagen“ gibt den Sinn knapp wieder, ohne die genaue Verfahrensform festzulegen.
- source_word: οὐ προσέσχεν αὐτοῖς
  choice: schenkte ihnen kein Gehör
  rationale: προσέχω bezeichnet hier das Beachten oder Anhören. Die deutsche Wendung passt besonders zum Zusammenhang einer vorgebrachten Beschwerde.
- source_word: ὁ βασιλεύς
  choice: der König
  rationale: Die übliche und kontextgerechte Wiedergabe des Titels.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich zusammenrotten“ und „kein Gehör schenken“ vermitteln den feindseligen beziehungsweise administrativ-rechtlichen Zusammenhang idiomatisch; die starke Metapher von λοιμοί und die Bedeutungsbreite von ἐντυχεῖν κατά werden durch Fußnoten bewahrt.
