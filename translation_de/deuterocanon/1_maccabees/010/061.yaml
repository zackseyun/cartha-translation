- from: Da rotteten sich üble Männer aus Israel gegen ihn zusammen,[a] gesetzlose Männer, um ihn anzuklagen.[b] Doch der König schenkte ihnen kein Gehör.
  to: Es versammelten sich gegen ihn üble Männer aus Israel, gesetzlose Männer, um gegen ihn Beschwerde zu führen.[a] Doch der König schenkte ihnen kein Gehör.
