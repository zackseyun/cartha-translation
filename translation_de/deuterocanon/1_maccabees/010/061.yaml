  naturalness: Die vorgeschlagene Fassung ist überwiegend idiomatisch. »Es versammelten sich« ist hier modernes, natürliches Deutsch und vermeidet die zusätzliche Konnotation von »sich zusammenrotten«. »Gegen ihn Beschwerde zu führen« ist im politischen bzw. administrativen Kontext verständlich und hält die Handlung weiter als eine gerichtliche Anklage.
  terminology: »Gesetzlose Männer« gibt παράνομοι angemessen wieder. »Üble Männer« ist als Wiedergabe der scharfen Metapher λοιμοί etwas abgeschwächt, kann aber mit einer präziseren Fußnote vertreten werden. Die Fußnote soll die metaphorische Plagen-Bildlichkeit erläutern, ohne eine einzige Deutung als Bedeutung festzuschreiben.
