translation_notes:
  register: Moderne, würdevolle Verwaltungssprache. Die wiederholten Befreiungsverben des Griechischen bleiben erkennbar, werden aber durch die kontextuell impliziten „Verpflichtungen“ verständlich gemacht. Die historischen Fachausdrücke werden im Text knapp wiedergegeben und in Fußnoten erläutert.
