  text: And we will grant you many remissions[a], and we will give you gifts. And now I release you and exempt all the Jews from the taxes, from the salt duty[c][b], and from the crown levies.
translation:
  language: de
  text: Und wir werden euch viele Erlasse[a] gewähren und euch Geschenke geben. Nun entlasse ich euch und befreie alle Juden von den Steuern, von der Salzabgabe[b] und von den Kranzabgaben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „viele Befreiungen“. Gemeint sind in diesem Zusammenhang Erlasse fiskalischer Verpflichtungen.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung kann wörtlich auch „Preis des Salzes“ bedeuten; in dieser Aufzählung ist wahrscheinlich eine Steuer oder festgesetzte Abgabe auf Salz gemeint.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „Kränzen“. Gemeint sind vermutlich dem König als Ehrenkränze dargebrachte Leistungen oder deren Geldwert.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀφήσομεν … ἀφέματα πολλά
  choice: wir werden … viele Erlasse gewähren
  rationale: Die Verbindung bezeichnet im königlich-fiskalischen Zusammenhang die Gewährung zahlreicher Erlasse oder Befreiungen. „Gewähren“ gibt die idiomatische Funktion der etymologisch verwandten griechischen Wörter natürlich wieder.
- source_word: δόματα
  choice: Geschenke
  rationale: Das Wort bezeichnet allgemein Gaben, die der König gewährt; „Geschenke“ ist klar und lässt die genaue Art offen.
- source_word: ἀπολύω ὑμᾶς
  choice: ich entlasse euch aus euren Verpflichtungen
  rationale: Das Verb bezeichnet hier im Zusammenhang mit den folgenden Abgaben keine Befreiung aus Gefangenschaft, sondern eine rechtliche Entlassung aus Verpflichtungen. Die Ergänzung macht den im Kontext implizierten Bezug verständlich.
- source_word: ἀφίημι πάντας τοὺς Ἰουδαίους ἀπὸ τῶν φόρων
  choice: ich befreie alle Juden von den Steuern
  rationale: Mit ἀπό und fiskalischen Forderungen bedeutet das Verb, jemanden von Abgaben freizustellen.
- source_word: φόρων
  choice: Steuern
  rationale: Der moderne Oberbegriff bezeichnet die verpflichtenden staatlichen Zahlungen verständlich und sachgerecht.
- source_word: τιμῆς τοῦ ἁλός
  choice: Salzabgabe
  rationale: τιμή kann eine festgesetzte Zahlung bezeichnen. Innerhalb dieser Abgabenliste ist eine mit Salz verbundene Steuer oder Gebühr wahrscheinlicher als der gewöhnliche Kaufpreis von Salz.
- source_word: στεφάνων
  choice: Kranzabgaben
  rationale: Wörtlich sind „Kränze“ gemeint; im hellenistischen Finanzwesen konnte dies Ehrenkränze für den Herrscher oder entsprechende Geldleistungen bezeichnen. „Kranzabgaben“ bewahrt das Bild und signalisiert zugleich den fiskalischen Sinn.
