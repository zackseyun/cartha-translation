  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die einleitende Erzählformel bleibt erhalten; die schwerfällige wörtliche Konstruktion »fügte hinzu, Jonatan zu ehren« wird idiomatisch als gesteigerte Ehrung wiedergegeben, während die mögliche Fortsetzungsbedeutung in der Fußnote erhalten bleibt.
