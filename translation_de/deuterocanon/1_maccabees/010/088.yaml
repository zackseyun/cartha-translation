  text: And it happened that when Alexander the king heard these words[a], he added to honoring Jonathan.
translation:
  language: de
  text: 'Und es geschah: Als König Alexander diese Worte hörte, erwies er Jonatan noch größere Ehre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »fuhr er fort, Jonatan zu ehren«. Die griechische Wendung kann sowohl fortgesetzte als auch gesteigerte Ehrung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  choice: 'Und es geschah: Als'
  rationale: Die erzählerische Übergangsformel wird sichtbar bewahrt; der Doppelpunkt macht die griechische Konstruktion in natürlichem, würdigem Deutsch lesbar.
- source_word: ἤκουσεν
  choice: hörte
  rationale: Das Verb bezeichnet hier unmittelbar das Hören der berichteten Worte; »erfuhr« wäre stärker deutend.
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: König Alexander
  rationale: Die im Deutschen übliche Stellung von Titel und Eigenname gibt die griechische Bezeichnung natürlich wieder.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Die formnahe Wiedergabe erhält den Bezug auf das zuvor Gesagte; »diese Nachricht« wäre interpretierender.
- source_word: προσέθετο δοξάσαι
  choice: erwies … noch größere Ehre
  rationale: Die Wendung mit προστίθημι und Infinitiv drückt ein Hinzufügen, Fortsetzen oder Steigern aus. Im königlich-politischen Zusammenhang bezeichnet δοξάζω das Ehren, nicht ein theologisch geprägtes »Verherrlichen«. Die gewählte Formulierung ist idiomatisch und macht die Steigerung ausdrücklich.
- source_word: τὸν Ἰωναθάν
  choice: Jonatan
  rationale: Der Personenname wird in der im modernen deutschen Bibelgebrauch geläufigen Form wiedergegeben; der griechische Artikel wird nicht eigens abgebildet.
