  text: And they were greatly afraid when they heard that the king had given them authority to gather forces[a].
translation:
  language: de
  text: Da bekamen sie große Angst, als sie hörten, dass der König ihnen die Vollmacht gegeben hatte, Streitkräfte zusammenzuziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: bekamen sie große Angst
  rationale: Der stammverwandte Akkusativ verstärkt die Aussage wörtlich als »sie fürchteten eine große Furcht«. Die gewählte natürliche deutsche Wendung bewahrt diese Intensität.
- source_word: ὅτε ἤκουσαν
  choice: als sie hörten
  rationale: Die temporale Verknüpfung wird direkt und erzählerisch flüssig wiedergegeben.
- source_word: ἔδωκεν αὐτοῖς
  choice: ihnen ... gegeben hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass die Erteilung der Vollmacht dem Hören vorausging und den Inhalt der Nachricht bildet.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Dies ist die übliche und kontextgemäße Wiedergabe im historischen Bericht.
- source_word: ἐξουσίαν
  choice: die Vollmacht
  rationale: Das Wort bezeichnet hier eine vom König übertragene Befugnis beziehungsweise offizielle Ermächtigung; »Vollmacht« bringt den delegierten Charakter klar zum Ausdruck.
- source_word: συναγαγεῖν δυνάμεις
  choice: Streitkräfte zusammenzuziehen
  rationale: Im militärischen Zusammenhang bezeichnet δυνάμεις bewaffnete Kräfte. »Zusammenziehen« bildet συναγαγεῖν treffend ab und klingt im Deutschen natürlich.
