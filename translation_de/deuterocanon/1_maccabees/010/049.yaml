base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/049.yaml
  text: And the two kings joined battle[a], and Demetrius's camp fled, and Alexander pursued him and prevailed over them.
translation:
  language: de
  text: Da traten die beiden Könige gegeneinander zum Kampf an. Das Lager des Demetrius floh, und Alexander verfolgte ihn und gewann die Oberhand über sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen wechselt die Aussage vom Singular („ihn“) zum Plural („sie“). Gemeint ist wahrscheinlich, dass Alexander Demetrius als Befehlshaber verfolgte und über dessen Truppen die Oberhand gewann.
    reason: Der auffällige Numeruswechsel des Ausgangstextes wird im Haupttext bewahrt und für heutige Leser erläutert, ohne die Mehrdeutigkeit stillschweigend aufzulösen.
lexical_decisions:
- source_word: συνῆψαν πόλεμον
  choice: traten ... gegeneinander zum Kampf an
  rationale: Die griechische Wendung bezeichnet den Eintritt in den Kampf. Die deutsche Formulierung ist natürlich, militärisch eindeutig und bewahrt den gegenseitigen Bezug der beiden Könige.
- source_word: οἱ δύο βασιλεῖς
  choice: die beiden Könige
  rationale: Gibt das ausdrückliche Subjekt knapp und idiomatisch wieder.
- source_word: ἡ παρεμβολὴ Δημητρίου
  choice: das Lager des Demetrius
  rationale: παρεμβολή bedeutet unmittelbar »Lager«, kann im Kampfzusammenhang jedoch metonymisch die dort versammelten Truppen bezeichnen. »Lager« bewahrt die Bildlichkeit und vermeidet die interpretierende Festlegung auf »Heer«.
- source_word: ἔφυγεν
  choice: floh
  rationale: Entspricht der schlichten Aussage des Verbs, ohne wie »wurde geschlagen« oder »wurde in die Flucht getrieben« zusätzliche Ursache oder Deutung einzutragen.
- source_word: ἐδίωξεν αὐτόν
  choice: verfolgte ihn
  rationale: Bewahrt das männliche Singularpronomen des griechischen Textes, das sich am natürlichsten auf Demetrius als Befehlshaber bezieht.
- source_word: ἴσχυσεν ἐπʼ αὐτούς
  choice: gewann die Oberhand über sie
  rationale: Drückt militärische Überlegenheit aus, ohne den weitergehenden Gedanken einer vollständigen Vernichtung oder endgültigen Niederlage einzutragen; zugleich bleibt der Wechsel zum Plural erhalten.
