base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/064.yaml
  text: And it happened that[a], when those who met him saw his splendor, as it had been proclaimed, and that he was clothed in linen[b], they all fled.
translation:
  language: de
  text: 'Und es geschah: Als die, die ihm begegneten,[a] seinen Glanz[b] sahen, wie er verkündet worden war, und ihn in Leinen gekleidet sahen,[c] flohen alle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die bei ihm vorstellig wurden«. Das griechische Wort kann sowohl eine Begegnung als auch das Herantreten mit einem Anliegen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seine Herrlichkeit«. Gemeint ist hier wahrscheinlich seine sichtbare königliche Pracht beziehungsweise sein öffentliches Ansehen.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort bezeichnet ein Leinentuch oder ein Kleidungsstück aus Leinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: 'Und es geschah: Als'
  rationale: Bewahrt die erzählerische Übergangsformel und ihren zeitlichen Anschluss, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: οἱ ἐντυγχάνοντες
  choice: diejenigen, die ihm begegneten
  rationale: Gibt den partizipialen Ausdruck in seinem naheliegenden Sinn einer persönlichen Begegnung wieder; die kontextuell mögliche Bedeutung des Vorstelligwerdens wird in einer Fußnote offengehalten.
- source_word: τὴν δόξαν αὐτοῦ
  choice: seinen Glanz
  rationale: Im königlich-öffentlichen Zusammenhang bezeichnet δόξα wahrscheinlich die sichtbare Pracht oder das eindrucksvolle Ansehen Jonatans. „Glanz“ wahrt zugleich den gehobenen Ton und die Bedeutungsnähe zu „Herrlichkeit“.
- source_word: καθὼς ἐκήρυξεν
  choice: wie er ausgerufen worden war
  rationale: Natürliches Deutsch für den öffentlichen Ausruf; die ungenannte handelnde Instanz wird nicht spekulativ als bestimmte Person identifiziert. Die Formulierung bezieht sich am ehesten auf den zuvor genannten Glanz beziehungsweise Ehrenrang.
- source_word: περιβεβλημένον αὐτὸν σινδόνα
  choice: dass er in Leinen gekleidet war
  rationale: περιβάλλω bezeichnet hier das Bekleiden oder Umhüllen, σινδών ein Tuch beziehungsweise Kleidungsstück aus Leinen. Die Wiedergabe bleibt beim ausdrücklich genannten Material und fügt „fein“ nicht hinzu.
- source_word: ἔφυγον πάντες
  choice: flohen sie alle
  rationale: Gibt die knappe und nachdrückliche Aussage des Aorists mit πάντες unmittelbar wieder.
theological_decisions:
- issue: Bedeutung von δόξα im königlichen Kontext
  choice: Glanz
  alternative: Herrlichkeit
  rationale: Der Zusammenhang spricht für sichtbare königliche Pracht oder öffentliches Ansehen, ohne die weiter gefasste Bedeutung des griechischen Wortes auszuschließen. Die Alternative wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eröffnende Formel behält den biblisch-erzählerischen Ton, während Satzbau und Wortwahl für heutige Leser verständlich bleiben. Echte lexikalische Mehrdeutigkeiten werden in Fußnoten ausgewiesen.
