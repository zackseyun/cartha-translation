base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/083.yaml
  text: And the cavalry was scattered in the plain[a], and they fled to Azotus and entered Beth-dagon, their idol temple, to save themselves.
translation:
  language: de
  text: Und die Reiterei wurde in der Ebene zerstreut. Sie flohen nach Aschdod und gingen in Bet-Dagon, das Heiligtum ihres Götzenbildes,[a] hinein, um sich zu retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher bei der Apposition: »Bet-Dagon, ihr Götzenbild«. Die griechische Apposition ist stark gerafft; gemeint ist offenbar die mit ihrem Götzenbild verbundene Kultstätte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἵππος
  choice: die Reiterei
  rationale: Der formal singularische Ausdruck bezeichnet im militärischen Zusammenhang kollektiv die berittenen Truppen. »Die Reiterei« gibt diesen Sinn im Deutschen klar wieder.
- source_word: ἐσκορπίσθη
  choice: wurde zerstreut
  rationale: Das Passiv beschreibt, dass der Truppenverband auseinandergetrieben wurde. Die formnahe Wiedergabe ist zugleich natürliches Deutsch.
- source_word: ἐν τῷ πεδίῳ
  choice: in der Ebene
  rationale: πεδίον bezeichnet hier das offene, ebene Gelände des Kampfgeschehens; »Ebene« ist geografisch präziser als das allgemeinere »Feld«.
- source_word: ἔφυγον εἰς Ἄζωτον
  choice: sie flohen nach Aschdod
  rationale: Ἄζωτος ist die griechische Namensform der bekannten Stadt Aschdod. Die im modernen Deutschen gebräuchliche biblische Ortsnamensform macht den Ort unmittelbar erkennbar, ohne den Referenten zu verändern.
- source_word: Βηθδαγὼν
  choice: Bet-Dagon
  rationale: Der kultische Orts- beziehungsweise Heiligtumsname wird transliteriert; der Bindestrich macht seine Zusammensetzung lesbar.
- source_word: τὸ εἴδωλον αὐτῶν
  choice: das Heiligtum ihres Götzenbildes
  rationale: Wörtlich steht »ihr Götzenbild«. Da man in Bet-Dagon hineingeht, bezeichnet die stark geraffte Apposition kontextuell die mit dem Götzenbild verbundene Kultstätte. »Götzenbild« bewahrt dabei die abwertende Färbung von εἴδωλον; eine Fußnote dokumentiert die wörtliche Form.
- source_word: τοῦ σωθῆναι
  choice: um sich zu retten
  rationale: Der artikulierte Infinitiv bezeichnet den Zweck. Im Zusammenhang suchen die Fliehenden selbst Schutz; die reflexive deutsche Form gibt diesen praktischen Sinn idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von εἴδωλον im philistäischen Kultzusammenhang
  choice: Götzenbild
  alternative: 'Götze; Kultbild; neutral: Heiligtum'
  rationale: εἴδωλον ist keine neutrale Bezeichnung einer Gottheit, sondern trägt eine negative Wertung. »Götzenbild« erhält diese Wertung, ohne über die Aussage des griechischen Textes hinaus eine konfessionelle Deutung einzuführen.
- issue: Verhältnis von Bet-Dagon und τὸ εἴδωλον αὐτῶν
  choice: Bet-Dagon als das mit ihrem Götzenbild verbundene Heiligtum erläutern
  alternative: Die Apposition streng wörtlich als »Bet-Dagon, ihr Götzenbild« wiedergeben
  rationale: Die Handlung des Hineingehens verlangt einen betretbaren Ort, während der griechische Wortlaut in geraffter Apposition unmittelbar »ihr Götzenbild« setzt. Der Haupttext macht den kontextuellen Sinn verständlich; die Fußnote bewahrt die formale Spannung und verhindert, dass die Auslegung als eindeutig ausgegeben wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer und räumlicher Sprache. Der Vers wird zur besseren Lesbarkeit in zwei Sätze gegliedert. Die kultkritische Färbung des griechischen εἴδωλον bleibt erhalten, während die ungewöhnlich komprimierte Apposition durch eine gekennzeichnete Erläuterung verständlich gemacht wird.
