base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/032.yaml
  text: I also relinquish the authority over the citadel in Jerusalem[a], and I give it to the high priest, so that he may appoint in it men whom he himself chooses to guard it.
translation:
  language: de
  text: Auch die Verfügungsgewalt über die Zitadelle in Jerusalem[a] gebe ich auf und übertrage sie dem Hohepriester, damit er dort Männer einsetzt, die er selbst auswählt, um die Zitadelle zu bewachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Akra in Jerusalem«; »Akra« ist die traditionelle Bezeichnung dieser befestigten Anlage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίημι
  choice: gebe ich auf
  rationale: Im administrativen Zusammenhang bezeichnet das Verb das Aufgeben eines Anspruchs beziehungsweise der bisherigen Verfügungsgewalt, nicht Vergebung.
- source_word: ἐξουσίαν
  choice: die Verfügungsgewalt über
  rationale: Die Wendung gibt das rechtlich-administrative Recht zur Kontrolle und Leitung wieder und passt zur anschließenden Übertragung.
- source_word: ἄκρας
  choice: die Zitadelle
  rationale: Gemeint ist die befestigte städtische Anlage in Jerusalem; „Zitadelle“ ist im Deutschen verständlich und historisch passend. Die traditionelle Bezeichnung „Akra“ steht in der Fußnote.
- source_word: δίδωμι
  choice: übertrage sie
  rationale: Das einfache δίδωμι bezeichnet hier im Zusammenhang eine formelle Übertragung an den Hohepriester; „übertragen“ macht den Bezug auf die Verfügungsgewalt natürlich deutlich.
- source_word: ἀρχιερεῖ
  choice: dem Hohepriester
  rationale: Dies ist die übliche deutsche Bezeichnung für das jüdische kultische und politische Amt.
- source_word: ὅπως ἂν καταστῇ
  choice: damit er dort … einsetzt
  rationale: καθίστημι bedeutet hier, Männer für eine bestimmte Aufgabe einzusetzen beziehungsweise zu stationieren.
- source_word: ἄνδρας
  choice: Männer
  rationale: Der griechische Ausdruck ist ausdrücklich maskulin und bezeichnet in diesem militärischen Zusammenhang wahrscheinlich männliche Wachleute.
- source_word: οὓς ἂν ἐκλέξηται αὐτός
  choice: die er selbst auswählt
  rationale: „selbst“ bewahrt die Betonung von αὐτός und damit die persönliche Entscheidungsfreiheit des Hohepriesters.
- source_word: τοῦ φυλάσσειν αὐτήν
  choice: um sie zu bewachen
  rationale: Der finale Genitiv des Infinitivs bezeichnet den Zweck der Einsetzung; φυλάσσω meint hier das militärische Bewachen der Zitadelle.
theological_decisions:
- issue: ἄκρα als Gattungsbezeichnung oder historischer Eigenname
  choice: die Zitadelle
  alternative: die Akra
  rationale: Die gemeinsprachliche Übersetzung vermittelt die Bedeutung unmittelbar, während die historisch traditionelle Transliteration in einer Fußnote erhalten bleibt; eine konfessionelle Festlegung ist damit nicht verbunden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt den administrativen Ton des Erlasses. „Verfügungsgewalt“ vermeidet die mögliche Überdehnung von „Macht“, während „gebe ich auf und übertrage sie“ die beiden griechischen Verben und den Übergang der Zuständigkeit klar wiedergibt.
