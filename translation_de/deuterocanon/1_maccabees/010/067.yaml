  yaml_path: translation/deuterocanon/1_maccabees/010/067.yaml
  text: And in the one hundred sixty-fifth year[a], Demetrius the son of Demetrius came from Crete into the land of his fathers.
translation:
  language: de
  text: Und im 165. Jahr kam Demetrius, der Sohn des Demetrius, von Kreta in das Land seiner Vorfahren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἔτει πέμπτῳ καὶ ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: im 165. Jahr
  rationale: Die additive griechische Zahlform wird in natürlichem modernem Deutsch als Ordinalzahl wiedergegeben; gemeint ist die Jahresangabe nach der seleukidischen Ära.
- source_word: ἦλθεν
  choice: kam
  rationale: Das gewöhnliche griechische Bewegungsverb wird schlicht und erzählerisch passend wiedergegeben; „traf ein“ wäre stärker ausdeutend.
- source_word: Δημήτριος ὁ υἱὸς Δημητρίου
  choice: Demetrius, der Sohn des Demetrius
  rationale: Die Namen werden in der geläufigen deutschen Form wiedergegeben; die Apposition wird transparent und natürlich formuliert.
- source_word: ἐκ Κρήτης
  choice: von Kreta
  rationale: ἐκ bezeichnet hier den Ausgangspunkt der Bewegung; „von Kreta“ ist die natürliche deutsche Entsprechung.
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: in das Land seiner Vorfahren
  rationale: „Land“ bewahrt den territorialen Sinn von γῆ, während „seiner Vorfahren“ den idiomatischen Bezug von πατέρων natürlich ausdrückt, ohne ihn auf „Vaterland“ zu verengen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit enger Bindung an den griechischen Wortlaut. Die historische Ärenzählung wird nicht erklärend ergänzt, da der Vers selbst nur das Jahr nennt. Für „Land seiner Vorfahren“ ist keine Fußnote nötig, weil die deutsche Formulierung den Sinn unmittelbar verständlich wiedergibt.
