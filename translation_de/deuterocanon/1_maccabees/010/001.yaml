base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/001.yaml
  text: And in the one hundred sixtieth year[a], Alexander, the son of Antiochus Epiphanes, came up and took Ptolemais, and they received him[c][b], and he reigned there.
translation:
  language: de
  text: Im hundertsechzigsten Jahr zog Alexander, der Sohn des Antiochus Epiphanes, herauf und nahm Ptolemaïs ein. Man nahm ihn auf, und er wurde dort König.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und herrschte dort als König“. Das griechische Verb kann hier entweder den Beginn seiner Königsherrschaft oder deren Ausübung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: Im hundertsechzigsten Jahr
  rationale: Gibt die griechische Datierungsformel in natürlichem, präzisem Deutsch wieder.
- source_word: ἀνέβη
  choice: zog ... herauf
  rationale: Bewahrt die konventionelle Richtungsangabe des griechischen Verbs und lässt zugleich im historischen Zusammenhang eine militärische Bewegung erkennen.
- source_word: ὁ τοῦ Ἀντιόχου ὁ Ἐπιφανής
  choice: Alexander, der Sohn des Antiochus Epiphanes
  rationale: Die Artikel-Genitiv-Konstruktion bezeichnet hier idiomatisch die Abstammung. Der etablierte Herrscherbeiname Epiphanes bleibt unübersetzt.
- source_word: κατελάβετο Πτολεμαΐδα
  choice: nahm Ptolemaïs ein
  rationale: Drückt die Übernahme der Stadt im militärisch-politischen Kontext natürlich aus, ohne die Gewaltkomponente unnötig zu verstärken.
- source_word: ἐπεδέξαντο αὐτόν
  choice: Die Einwohner nahmen ihn auf
  rationale: Das unbestimmte griechische Subjekt wird aus dem Stadtbezug erschlossen und im Deutschen zur Verständlichkeit benannt; „nahmen ihn auf“ wahrt die Offenheit zwischen Empfang und politischer Anerkennung.
- source_word: ἐβασίλευσεν ἐκεῖ
  choice: er wurde dort König
  rationale: Der Aorist kann hier nach Alexanders Aufnahme in der Stadt ingressiv seine Thronbesteigung bezeichnen.
