  rationale: Die einzige sichere Korrektur ist die Tilgung der nicht ausdrücklich im griechischen Text genannten „Einwohner“. Die übrigen Formulierungen sind quellentreu, idiomatisch und im angemessenen historischen Register gehalten. Die Fußnotenverankerung bleibt unmittelbar bei der mehrdeutigen Verbform.
