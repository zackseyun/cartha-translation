review_pass:
  verdict: revise
  source_fidelity: 'Die wesentlichen Satzglieder sind zutreffend wiedergegeben: Datierung, Alexanders Abstammung, die Aufwärtsbewegung, die Einnahme von Ptolemaïs und die anschließende Königsherrschaft. Das griechische Subjekt von ἐπεδέξαντο bleibt jedoch unbestimmt („sie“); „die Einwohner“ ist eine plausible historische Erschließung, aber keine ausdrückliche Angabe des Textes und sollte nicht in die Übersetzung aufgenommen werden.'
  naturalness: Die Übersetzung ist insgesamt klar und modern. „Man nahm ihn auf“ ist hier idiomatisch und gibt das unbestimmte Subjekt ohne unnötige Ergänzung wieder. Die Reihung mit Semikolon bewahrt den knappen erzählerischen Duktus bei gutem deutschem Satzfluss.
  terminology: „Antiochus Epiphanes“ und „Ptolemaïs“ sind angemessene deutsche Namensformen. „Nahm ... ein“ gibt κατελάβετο im militärisch-politischen Zusammenhang sachgerecht wieder. „Wurde dort König“ bewahrt die mögliche ingressive Nuance von ἐβασίλευσεν; die Fußnote nennt die ebenfalls mögliche Lesart als Ausübung der Königsherrschaft.
  issues:
