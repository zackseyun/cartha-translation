  yaml_path: translation/deuterocanon/1_maccabees/010/052.yaml
  text: After I returned to my kingdom and sat on the throne of my fathers[a], and took control of the rule, and crushed Demetrius and gained control of our land,
translation:
  language: de
  text: Nachdem ich in mein Königreich zurückkehrte, auf dem Thron meiner Väter[a] Platz nahm, die Herrschaft übernahm, Demetrius vernichtend schlug und die Herrschaft über unser Land erlangte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meiner Vorfahren“. Wörtlich heißt es im Griechischen „meiner Väter“; dies ist eine dynastische Wendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Nachdem
  rationale: Die Konjunktion leitet hier die vorausgehenden Umstände ein; zusammen mit dem Plusquamperfekt gibt „Nachdem“ die zeitliche Folge im Deutschen klar wieder, ohne den begründenden Zusammenhang auszuschließen.
- source_word: ἀνέστρεψα εἰς τὴν βασιλείαν μου
  choice: ich in mein Königreich zurückgekehrt war
  rationale: ἀναστρέφω bezeichnet mit εἰς die Rückkehr in den eigenen Herrschaftsbereich; „Königreich“ wahrt den territorial-politischen Sinn von βασιλεία.
- source_word: ἐκάθισα ἐπὶ θρόνου πατέρων μου
  choice: mich auf den Thron meiner Väter gesetzt
  rationale: Die Formulierung bewahrt das dynastische Bild des griechischen Textes und klingt zugleich natürlich auf Deutsch.
- source_word: ἐκράτησα τῆς ἀρχῆς
  choice: die Herrschaft an mich gebracht
  rationale: κρατέω mit Genitiv bezeichnet das Erlangen beziehungsweise Ausüben der Gewalt über etwas. Die Wendung drückt die Übernahme der Regierungsgewalt aus, ohne unnötig eine unrechtmäßige Machtergreifung zu behaupten.
- source_word: συνέτριψα τὸν Δημήτριον
  choice: Demetrius vernichtend geschlagen
  rationale: συντρίβω ist ein starkes kriegerisches Verb. „Vernichtend geschlagen“ wahrt seine Intensität und ist bei einer besiegten Person idiomatischer als das wörtlichere „zerschmettert“.
- source_word: ἐπεκράτησα τῆς χώρας ἡμῶν
  choice: unser Land unter meine Kontrolle gebracht
  rationale: ἐπικρατέω bezeichnet hier errungene politische und militärische Vorherrschaft. „Land“ vermeidet moderne nationalstaatliche Nebenbedeutungen von „Staat“.
theological_decisions:
- issue: Dynastische Wendung πατέρων μου
  choice: meiner Väter
  alternative: meiner Vorfahren
  rationale: „Väter“ entspricht dem griechischen Wortlaut und bewahrt den männlich-dynastischen Anspruch; eine Fußnote erläutert den idiomatischen Sinn.
translation_notes:
  register: Gehobene, aber gegenwärtige Sprache eines königlichen Schreibens. Die Satzperiode bleibt wegen des im Folgevers fortgesetzten Gedankens offen; koordinierte griechische Aoriste werden im Deutschen zu einer idiomatischen Nachdem-Konstruktion mit Plusquamperfekt verbunden.
