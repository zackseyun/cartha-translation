revisions:
- from: Nachdem ich in mein Königreich zurückgekehrt war, mich auf den Thron meiner Väter[a] gesetzt, die Herrschaft an mich gebracht, Demetrius vernichtend geschlagen und unser Land unter meine Kontrolle gebracht hatte,
  to: Nachdem ich in mein Königreich zurückkehrte, auf dem Thron meiner Väter[a] Platz nahm, die Herrschaft übernahm, Demetrius vernichtend schlug und die Herrschaft über unser Land erlangte,
  rationale: Die Revision behebt die fehlerhafte Mischung der Hilfsverben durch eine einheitliche, dem griechischen Aorist entsprechende Präteritumreihe. „Auf dem Thron ... Platz nahm“ gibt ἐκάθισα ἐπὶ θρόνου idiomatisch wieder. Die Wiederholung von „Herrschaft“ macht den Unterschied zwischen ἀρχή (Regierungsgewalt) und der Kontrolle über χώρα (Land) verständlich, ohne den griechischen Sinn zu verändern. Das abschließende Komma bleibt erhalten, weil der Satz im folgenden Vers fortgesetzt wird.
