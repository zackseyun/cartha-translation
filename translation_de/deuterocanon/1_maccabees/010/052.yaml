  verdict: revise
  source_fidelity: 'Die inhaltlichen Entsprechungen sind überwiegend treffend: Rückkehr in das Königreich, dynastischer Thron, Erlangen der Herrschaft, die Niederlage des Demetrius und die Kontrolle über das Land werden korrekt wiedergegeben. Die Stärke von συνέτριψα wird mit „vernichtend schlug“ angemessen bewahrt.'
  naturalness: 'Die vorliegende Plusquamperfekt-Konstruktion ist grammatisch nicht tragfähig: Auf „zurückgekehrt war“ folgen Partizipien von Verben, die das Hilfsverb „hatte“ verlangen; das abschließende „hatte“ kann nicht zugleich die mit „war“ gebildete Rückkehr und die übrigen Verben regieren. Eine einheitliche Präteritumreihe ist in diesem gehobenen Briefregister natürlich und bildet die griechischen Aoriste klar ab.'
  terminology: „Königreich“, „Herrschaft“, „Demetrius“ und „Land“ sind angemessen. „Thron meiner Väter“ bewahrt die dynastische Formulierung; die Fußnote erläutert idiomatisch und ohne eine zusätzliche Auslegung aufzudrängen.
  issues:
