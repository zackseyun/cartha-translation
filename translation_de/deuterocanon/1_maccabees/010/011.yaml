lexical_decisions:
- source_word: τοὺς ποιοῦντας τὰ ἔργα
  choice: den Arbeitern
  rationale: Die substantivierte Umschreibung bezeichnet idiomatisch diejenigen, die die Bauarbeiten ausführten.
- source_word: τὸ ὄρος Σιὼν
  choice: den Berg Zion
  rationale: Gibt ὄρος ausdrücklich als „Berg“ wieder und bewahrt die geografisch-theologische Bezeichnung Zion.
- source_word: ἐκ λίθων τετραγώνων
  choice: mit behauenen Steinen
  rationale: τετράγωνος bezeichnet hier für den Mauerbau zugerichtete, kantig beziehungsweise rechtwinklig behauene Steine; „behauen“ ist im Deutschen natürlich und sachgerecht.
- source_word: εἰς ὀχύρωσιν
  choice: zur Befestigung
  rationale: Bewahrt die Zweckangabe des griechischen Ausdrucks knapp und direkt.
- source_word: οἰκοδομεῖν
  choice: auszubauen
  rationale: Bei bereits genannten Mauern und dem Berg Zion bezeichnet das Verb bauliches Errichten beziehungsweise Verstärken; „ausbauen“ vermeidet die missverständliche Vorstellung, der Berg selbst werde erbaut.
theological_decisions:
- issue: Wiedergabe von τὸ ὄρος Σιὼν
  choice: Berg Zion
  alternative: Zionsberg
  rationale: „Berg Zion“ folgt der griechischen Form transparent und lässt sowohl die geografische als auch die symbolische Bedeutung unverengt bestehen.
translation_notes:
  register: Moderne, würdevolle Standardsprache; der Satzbau bleibt nah am griechischen Ablauf, während „den Arbeitern“ und „auszubauen“ für natürliche Verständlichkeit sorgen.
