  source_fidelity: Der Entwurf gibt die Satzglieder und die Zweckangabe insgesamt zutreffend wieder. „Ausbauen“ ist jedoch für οἰκοδομεῖν zu interpretierend und legt eine Erweiterung nahe; zudem klingt es mit „den Berg Zion“ als Objekt unnatürlich. „Befestigen“ gibt den baulichen Sinn im Zusammenhang mit εἰς ὀχύρωσιν klar wieder, ohne eine nähere, im Griechischen nicht ausgedrückte Bauweise zu behaupten.
