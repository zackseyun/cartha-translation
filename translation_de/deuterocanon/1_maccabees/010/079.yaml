lexical_decisions:
- source_word: ἀπέλειπεν
  choice: ließ … zurück
  rationale: Gibt das imperfektische Verb natürlich und sachlich wieder; im erzählenden Deutschen bezeichnet das Präteritum die Handlung, ohne zusätzliche zeitliche Deutung.
- source_word: χιλίαν ἵππον
  choice: tausend Reiter
  rationale: ἵππος steht hier kollektiv für Reiterei beziehungsweise berittene Soldaten; „Reiter“ ist im Deutschen klarer als das wörtliche „Pferde“.
- source_word: κρυπτῶς
  choice: heimlich
  rationale: Bewahrt die adverbiale Aussage, dass das Zurücklassen verborgen beziehungsweise unbemerkt geschah.
- source_word: κατόπισθεν αὐτῶν
  choice: hinter ihnen
  rationale: Entspricht der räumlichen Angabe knapp und idiomatisch; der Bezug des Pronomens bleibt wie im Griechischen kontextabhängig.
