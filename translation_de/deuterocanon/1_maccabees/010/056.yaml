translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bewegungsrichtung von εἰς und der wörtliche Sinn von „einander sehen“ bleiben erhalten. Der seltenere dynastische Sachverhalt wird im Haupttext verständlich, aber nicht übermäßig konkret wiedergegeben; die alternative Formulierung steht in der Fußnote.
