  yaml_path: translation/deuterocanon/1_maccabees/010/056.yaml
  text: And now I will do for you what you wrote; but meet me at Ptolemais[a], so that we may see one another, and I will become related by marriage to you, just as you said.
translation:
  language: de
  text: Und nun werde ich für dich tun, was du geschrieben hast. Doch komm nach Ptolemaïs, damit wir einander sehen, und ich werde mich mit dir durch Heirat verbinden,[a] wie du gesagt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde mit dir ein Heiratsbündnis schließen.“ Das griechische Verb bezeichnet die Herstellung einer verwandtschaftlichen Beziehung durch Heirat; aus dem weiteren Zusammenhang geht hervor, dass eine dynastische Heirat gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσω
  choice: werde ich für dich tun
  rationale: Die Formulierung gibt das angekündigte Erfüllen des schriftlich vorgetragenen Anliegens direkt wieder, ohne dessen Inhalt näher festzulegen.
- source_word: ἃ ἔγραψας
  choice: was du geschrieben hast
  rationale: Die Wendung verweist schlicht auf den Inhalt des vorausgegangenen Schreibens und ist im Deutschen natürlich.
- source_word: ἀπάντησον
  choice: komm mir … entgegen
  rationale: ἀπαντάω bezeichnet hier das Entgegenkommen zu einer Begegnung. Mit „mir“ wird das im Kontext vorausgesetzte Gegenüber idiomatisch ausgedrückt.
- source_word: εἰς Πτολεμαΐδα
  choice: nach Ptolemaïs
  rationale: εἰς bezeichnet die Bewegung auf die Stadt zu; „nach“ bewahrt diese Richtungsangabe im Deutschen.
- source_word: ὅπως ἰδωμεν ἀλλήλους
  choice: damit wir einander sehen
  rationale: Die Übersetzung bewahrt sowohl den Zwecksatz als auch das konkrete Verb „sehen“, ohne es zu „treffen“ umzudeuten.
- source_word: ἐπιγαμβρεύσω
  choice: werde ich mich mit dir durch Heirat verbinden
  rationale: Das Verb bezeichnet das Herstellen einer verwandtschaftlichen Verbindung durch Heirat. Die Wiedergabe wahrt diesen Sinn, ohne die in diesem Vers nicht ausdrücklich genannte Tochter als Objekt einzufügen.
- source_word: καθὼς εἴρηκας
  choice: wie du gesagt hast
  rationale: Die natürliche deutsche Formulierung verweist auf den zuvor geäußerten Vorschlag, ohne das schlichte λέγω unnötig zu spezifizieren.
