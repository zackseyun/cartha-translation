base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/004.yaml
  text: For he said[a], “Let us get ahead of him by making peace with him, before he makes common cause with Alexander against us.”
translation:
  language: de
  text: 'Denn er sagte: »Kommen wir ihm zuvor und schließen Frieden mit ihm, bevor er sich mit Alexander gegen uns verbündet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προφθάσωμεν
  choice: Kommen wir ihm zuvor
  rationale: Der hortative Aorist-Konjunktiv von προφθάνω fordert dazu auf, vor dem anderen zu handeln. Die Wendung ist im Deutschen natürlich und bewahrt den strategischen Sinn.
- source_word: τοῦ εἰρηνεῦσαι μετʼ αὐτοῦ
  choice: und schließen Frieden mit ihm
  rationale: Der artikulierte Infinitiv bezeichnet die Handlung, in der man Jonathan zuvorkommen will. Im Deutschen verbindet »und« die beiden eng zusammengehörigen Handlungselemente idiomatisch.
- source_word: πρὶν ἢ
  choice: bevor
  rationale: Die Konjunktion leitet die Handlung ein, der man zuvorkommen will.
- source_word: θεῖναι αὐτὸν μετὰ Ἀλεξάνδρου
  choice: er sich mit Alexander verbündet
  rationale: Das wörtliche »ihn mit Alexander stellen« bezeichnet im politischen Zusammenhang eine Parteinahme oder ein Bündnis. »Sich verbünden« gibt dies klar und knapp wieder.
- source_word: καθʼ ἡμῶν
  choice: gegen uns
  rationale: κατά mit Genitiv bezeichnet hier die feindliche Ausrichtung gegen die Sprecherseite.
