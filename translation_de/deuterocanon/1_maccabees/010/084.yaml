base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/084.yaml
  text: And Jonathan set Azotus and the cities around it on fire[a], and he took their spoil[b]; and he burned the temple of Dagon and its shrines with fire.
translation:
  language: de
  text: Und Jonatan steckte Azotos und die Städte ringsum in Brand[a] und nahm ihre Beute an sich; auch das Heiligtum Dagons und ihr Heiligtum verbrannte er mit Feuer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azotos ist die griechische Namensform von Aschdod.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text wiederholt im Singular „Heiligtum“: wörtlich „das Heiligtum Dagons und ihr Heiligtum“. Der genaue Bezug der zweiten Wendung bleibt offen.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐνεπύρισεν
  choice: steckte … in Brand / verbrannte … mit Feuer
  rationale: Das Verb bezeichnet das Inbrandsetzen oder Verbrennen. Die beiden Wiedergaben entsprechen den unterschiedlichen Objekten und bewahren beim zweiten Vorkommen die ausdrückliche Ergänzung ἐν πυρί.
- source_word: Ἄζωτον
  choice: Azotos
  rationale: Die griechische Namensform wird im Haupttext beibehalten; die geläufigere hebräische Form Aschdod wird in einer Fußnote genannt.
- source_word: τὰς πόλεις τὰς κύκλῳ αὐτῆς
  choice: die Städte ringsum
  rationale: κύκλῳ mit Genitiv bezeichnet die umliegenden Städte. Die knappe deutsche Form ist natürlich und eindeutig.
- source_word: τὰ σκῦλα αὐτῶν
  choice: ihre Beute
  rationale: σκῦλα bezeichnet im Krieg erbeutetes Gut; das Possessivpronomen gibt αὐτῶν wieder.
- source_word: τὸ ἱερὸν Δαγὼν
  choice: das Heiligtum Dagons
  rationale: ἱερόν kann Tempel oder Heiligtum samt Bezirk bezeichnen. „Heiligtum“ bewahrt diesen Bedeutungsumfang.
- source_word: τὸ ἱερὸν αὐτῆς
  choice: ihr Heiligtum
  rationale: Der griechische Text wiederholt ἱερόν im Singular und verwendet das feminine αὐτῆς, das sich grammatisch auf die Stadt Azotos beziehen kann. Die auffällige Wiederholung wird nicht zu einem Plural geglättet.
- source_word: ἐν πυρί
  choice: mit Feuer
  rationale: Die Wendung bezeichnet hier das Mittel des Verbrennens und verstärkt die bereits im Verb enthaltene Aussage.
