  text: Als König Alexander davon hörte, war er tief betrübt und kehrte nach Antiochia zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: davon hörte
  rationale: Das ergänzte „davon“ macht den im griechischen Erzählzusammenhang vorausgesetzten Inhalt im Deutschen natürlich deutlich, ohne ihn näher festzulegen.
- source_word: ἐλυπήθη σφόδρα
  choice: war tief betrübt
  rationale: „Tief betrübt“ gibt den passiven Gefühlszustand von λυπέω und die starke Intensivierung durch σφόδρα in würdigem, heutigem Deutsch wieder.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: kehrte nach Antiochia zurück
  rationale: Die Wendung bezeichnet hier die Rückkehr an einen Ort; „nach Antiochia zurückkehren“ ist die natürliche deutsche Entsprechung.
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: König Alexander
  rationale: Die im Griechischen nachgestellte Apposition wird in der üblichen und natürlichen deutschen Titelform wiedergegeben.
