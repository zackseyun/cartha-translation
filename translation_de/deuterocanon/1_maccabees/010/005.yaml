base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/005.yaml
  text: For he will remember all the wrongs that we committed against him, and against his brothers, and against his nation.
translation:
  language: de
  text: Denn er wird sich an all das Unrecht erinnern, das wir ihm, seinen Brüdern und seinem Volk angetan haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησθήσεται
  choice: wird sich erinnern
  rationale: Gibt das futurische Medium des Verbs natürlich und genau wieder.
- source_word: πάντων τῶν κακῶν
  choice: an all das Unrecht
  rationale: κακά bezeichnet hier im Zusammenhang die gegen Personen und ein Volk begangenen Übeltaten; „Unrecht“ ist im modernen Deutschen idiomatischer als das abstraktere „Böse“.
- source_word: ὧν συνετελέσαμεν
  choice: das wir … angetan haben
  rationale: συντελέω bezeichnet hier begangene beziehungsweise vollbrachte Taten. Die deutsche Wendung stellt den negativen, gegen die Genannten gerichteten Sinn klar, ohne Einzelheiten hinzuzufügen.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: seinen Brüdern
  rationale: Bewahrt die unmittelbare Bedeutung von ἀδελφοί; ob leibliche Brüder oder Volksgenossen gemeint sind, wird nicht interpretierend festgelegt.
- source_word: τὸ ἔθνος αὐτοῦ
  choice: seinem Volk
  rationale: „Volk“ ist hier die natürliche deutsche Entsprechung für ἔθνος und vermeidet den im Deutschen unpassenden Beiklang von „Nation“.
theological_decisions:
- issue: Bedeutungsumfang von κακά
  choice: Unrecht
  alternative: Böses / Übeltaten
  rationale: „Unrecht“ bezeichnet schuldhaftes Handeln gegen die genannten Betroffenen, ohne die Aussage konfessionell oder dogmatisch zuzuspitzen.
- issue: Referenz von ἀδελφοί
  choice: Brüder
  alternative: Volksgenossen
  rationale: Die wörtliche Wiedergabe erhält die mögliche familiäre wie auch weitere gemeinschaftliche Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache griechische Präpositionalstruktur wird im Deutschen zu einer flüssigen Aufzählung zusammengezogen; sämtliche Betroffenen bleiben klar als Objekte des angetanen Unrechts erkennbar.
