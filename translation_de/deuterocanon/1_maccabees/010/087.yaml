  text: And Jonathan returned with those who were with him[a], carrying much plunder.
translation:
  language: de
  text: Und Jonatan kehrte mit seinen Begleitern zurück; sie führten viel Beute mit sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet Güter, die im Kampf erbeutet wurden.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: kehrte zurück
  rationale: Das Aoristverb bezeichnet hier Jonatans Rückkehr vom Kampfgeschehen, ohne die Richtung näher zu bestimmen.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: mit seinen Begleitern
  rationale: Die idiomatische Wendung meint die Menschen, die bei Jonatan waren. „Seine Begleiter“ ist natürlich und vermeidet die im Griechischen nicht ausdrücklich enthaltene militärische Festlegung „seine Männer“.
- source_word: ἔχοντες
  choice: sie führten … mit sich
  rationale: Das Partizip steht im Plural und bezieht Jonatan und seine Begleiter ein. Die finite Wiedergabe bildet diesen Bezug klar und idiomatisch ab.
- source_word: σκῦλα
  choice: Beute
  rationale: Der Begriff bezeichnet im Kampf erbeutete Güter. „Beute“ ist im heutigen Deutsch klar und sachlich.
- source_word: πολλά
  choice: reiche
  rationale: Beim kollektiven Substantiv „Beute“ gibt „reiche Beute“ die große Menge natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Erzählregister. Der Wechsel vom singularischen Hauptverb zum pluralischen Partizip wird durch einen Semikolonanschluss mit „sie“ transparent gemacht.
