  text: And let Jerusalem be holy and set apart[a], along with its territory, its tithes[c][b], and its taxes.
translation:
  language: de
  text: Und Jerusalem soll heilig und frei sein[a], ebenso ihr Gebiet[b], ihre Zehnten und ihre Abgaben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: befreit, ausgenommen oder von Abgaben entbunden. Das griechische Wort bezeichnet hier wahrscheinlich einen rechtlichen Status der Freiheit oder Befreiung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: ihre Grenzen. Das griechische Wort kann sowohl die Grenzlinien als auch das zu Jerusalem gehörende Gebiet bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: Steuern, Zölle oder Gebühren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤτω
  choice: soll … sein
  rationale: Der Imperativ der dritten Person hat in dem königlichen Erlass anordnende Kraft; „soll … sein“ gibt dies im Deutschen natürlich und würdig wieder.
- source_word: ἁγία
  choice: heilig
  rationale: „Heilig“ bewahrt die religiös-kultische Bedeutung des griechischen Adjektivs und ist die geläufige deutsche Entsprechung.
- source_word: ἀφιεμένη
  choice: freigestellt
  rationale: Das passive Partizip von ἀφίημι bezeichnet hier im Zusammenhang fiskalischer Vorrechte wahrscheinlich eine Befreiung beziehungsweise Freistellung. Die Formulierung lässt offen, wovon genau Jerusalem freigestellt ist; die ebenfalls mögliche kultische Deutung wird in der Fußnote genannt.
- source_word: τὰ ὅρια αὐτῆς
  choice: ihr Gebiet
  rationale: ὅρια kann Grenzlinien oder das von ihnen umschlossene beziehungsweise zugehörige Gebiet bezeichnen. Im administrativen Zusammenhang ist „Gebiet“ natürlich, ohne die Bedeutung durch „Umland“ unnötig auszuweiten.
- source_word: αἱ δεκάται
  choice: die Zehnten
  rationale: Der bestimmte Artikel bezeichnet die mit Jerusalem und seinem Gebiet verbundenen Zehntabgaben. „Die Zehnten“ erhält die fiskalisch-religiöse Sachbedeutung.
- source_word: τὰ τέλη
  choice: die Abgaben
  rationale: τέλη ist ein weiter Ausdruck für Steuern, Zölle oder sonstige Gebühren. „Abgaben“ wahrt diese Breite besser als das enger gefasste „Steuern“ oder „Zölle“.
theological_decisions:
- issue: Verhältnis von ἁγία und ἀφιεμένη
  choice: Beide Aussagen werden getrennt als „heilig und freigestellt“ wiedergegeben.
  alternative: „heilig und geweiht/ausgesondert“
  rationale: Der griechische Text koordiniert zwei verschiedene Bezeichnungen. Im Kontext eines Erlasses über fiskalische Rechte liegt für ἀφιεμένη eine rechtlich-wirtschaftliche Freistellung näher; die mögliche kultische Nuance wird jedoch nicht verschwiegen.
- issue: Umfang von τὰ ὅρια αὐτῆς
  choice: „ihr Gebiet“
  alternative: „ihre Grenzen“
  rationale: Die Wendung kann sowohl Grenzen als auch das innerhalb beziehungsweise bei ihnen liegende Gebiet meinen. Der administrative Zusammenhang begünstigt „Gebiet“, doch die echte lexikalische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
- issue: Syntaktische Einbeziehung von Gebiet, Zehnten und Abgaben
  choice: Die nachgestellten Größen werden mit „ebenso“ in die Verfügung einbezogen.
  alternative: Nur Jerusalem ausdrücklich als heilig und freigestellt bezeichnen und die übrigen Größen unverbunden aufzählen.
  rationale: Die griechische Kurzform reiht Gebiet, Zehnten und Abgaben an die Aussage über Jerusalem an. „Ebenso“ macht diese elliptische Zuordnung verständlich, ohne eine nicht ausdrücklich genannte Rechtsfolge wie „sollen ihr überlassen werden“ einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung folgt der knappen Sprache eines königlichen Erlasses, löst die elliptische griechische Aufzählung mit „ebenso“ behutsam auf und bewahrt die Mehrdeutigkeit der zentralen Verwaltungsbegriffe in Fußnoten.
