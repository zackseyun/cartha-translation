base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/073.yaml
  text: And now you will not be able to withstand the cavalry and so great a force in the plain[a], where there is neither stone nor pebble nor a place to flee.
translation:
  language: de
  text: Und nun wirst du der Reiterei und einer so großen Streitmacht in der Ebene nicht standhalten können; dort gibt es weder Stein noch Kiesel noch einen Ort zur Flucht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δυνήσῃ
  choice: wirst du … nicht … können
  rationale: Das Futur von δύναμαι bezeichnet eine künftig behauptete Unfähigkeit; die deutsche Futurkonstruktion gibt dies unmittelbar wieder.
- source_word: ὑποστῆναι
  choice: standhalten
  rationale: Im militärischen Zusammenhang meint das Verb, einer angreifenden Macht Widerstand zu leisten; „standhalten“ bewahrt das Bild des Bestehens gegen den Gegner.
- source_word: τὴν ἵππον
  choice: der Reiterei
  rationale: Der griechische kollektive Singular „das Pferd“ bezeichnet hier die berittenen Truppen als militärische Einheit. „Reiterei“ ist im Deutschen idiomatisch und präzise.
- source_word: δύναμιν τοσαύτην
  choice: einer so großen Streitmacht
  rationale: δύναμις bezeichnet hier eine militärische Macht, nicht abstrakte Kraft. „Streitmacht“ bleibt umfassend und bewahrt mit „so groß“ die Stärke von τοσαύτην.
- source_word: ἐν τῷ πεδίῳ
  choice: in der Ebene
  rationale: πέδιον bezeichnet flaches, offenes Gelände; „Ebene“ erhält den für die militärische Lage wichtigen Geländegegensatz.
- source_word: λίθος
  choice: Stein
  rationale: Die einfache, unbestimmte Wiedergabe wahrt den Gegensatz zum folgenden kleineren Gestein, ohne eine nicht ausdrücklich genannte Funktion als Deckung einzutragen.
- source_word: κόχλας
  choice: Kiesel
  rationale: Das Wort bezeichnet kleine, rundliche Steine. „Kiesel“ unterscheidet sie knapp und verständlich von λίθος („Stein“).
- source_word: τόπος τοῦ φυγεῖν
  choice: ein Ort zur Flucht
  rationale: Die Verbindung mit dem substantivierten Infinitiv bezeichnet einen Ort beziehungsweise eine Möglichkeit zum Fliehen; die knappe deutsche Form bleibt nah am Griechischen.
