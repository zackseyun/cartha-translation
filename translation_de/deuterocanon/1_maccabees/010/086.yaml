translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge des griechischen Textes zu verändern. Der militärische Zug bleibt durch ‚sein Lager aufschlagen‘ erkennbar; die Bedeutungsbreite von δόξα wird in der Fußnote bewahrt.
