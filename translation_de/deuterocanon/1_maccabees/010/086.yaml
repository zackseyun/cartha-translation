base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/086.yaml
  text: And Jonathan departed from there and encamped at Ashkelon[a], and the people of the city came out to meet him with great honor.
translation:
  language: de
  text: Jonatan brach von dort auf und schlug in Aschkelon sein Lager auf. Die Einwohner der Stadt zogen aus der Stadt heraus, um ihn mit großem Pomp[a] zu empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit großen Ehren“ oder „mit großem Glanz“. Der griechische Ausdruck bezeichnet die besondere Pracht und Ehrerweisung dieses Empfangs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: brach … auf
  rationale: Das Verb bezeichnet hier den Aufbruch vom bisherigen Ort; die deutsche Wendung ist natürlich und bewahrt den erzählerischen Bewegungssinn.
- source_word: παρενέβαλεν
  choice: schlug … sein Lager auf
  rationale: Das Verb bezeichnet im militärischen beziehungsweise reisebezogenen Zusammenhang das Lagern; die Wendung gibt diesen Sinn klar und idiomatisch wieder.
- source_word: Ἀσκάλωνα
  choice: Aschkelon
  rationale: Dies ist die im modernen Deutschen gebräuchliche Form des Ortsnamens.
- source_word: ἐξῆλθον
  choice: kamen … entgegen
  rationale: Zusammen mit εἰς συνάντησιν αὐτῷ bezeichnet das Verb das Herauskommen aus der Stadt, um Jonatan zu begegnen; ‚entgegenkommen‘ gibt die gesamte Bewegung natürlich wieder.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: die Einwohner der Stadt
  rationale: Die substantivierte Wendung meint allgemein die aus der Stadt kommenden Menschen und legt keine ausschließlich männliche Gruppe fest.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: kamen ihm … entgegen
  rationale: Die feste Wendung bedeutet, jemandem zur Begegnung entgegenzugehen.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: mit großen Ehren
  rationale: δόξα kann Ehre, Herrlichkeit oder Glanz bezeichnen. Im Zusammenhang einer öffentlichen Begrüßung steht die ehrenvolle Aufnahme im Vordergrund; der Plural ‚mit großen Ehren‘ ist im Deutschen idiomatisch, während die Fußnote die Bildbreite offenhält.
