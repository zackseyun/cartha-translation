base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/033.yaml
  text: And every Jewish person who has been taken captive from the land of Judah into any part of my kingdom I release as free[a], without payment; and let all also remit the taxes on them and on their livestock.
translation:
  language: de
  text: Und jeden Menschen aus dem jüdischen Volk, der aus dem Land Juda in irgendeinen Teil meines Königreichs verschleppt worden ist, setze ich unentgeltlich in Freiheit. Alle sollen ihnen die Steuern erlassen, auch die auf ihr Vieh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut am Satzende ist knapp und syntaktisch schwierig. Er kann als Erlass der Steuern für die Betroffenen einschließlich der auf ihr Vieh erhobenen Steuern verstanden werden; wörtlich steht nach „die Steuern“ lediglich „und ihres Viehs“.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν ψυχὴν Ἰουδαίων
  choice: jeden Menschen aus dem jüdischen Volk
  rationale: ψυχή bezeichnet hier im verwaltungsrechtlichen Zusammenhang eine Person, nicht die innere Seele. Die Formulierung bewahrt die verteilende Kraft von πᾶσαν und vermeidet eine unnötige Einengung auf Männer.
- source_word: τὴν αἰχμαλωτισθεῖσαν
  choice: der … verschleppt worden ist
  rationale: Das Partizip bezeichnet jemanden, der gefangen genommen und aus seiner Heimat weggeführt wurde. „Verschleppt“ bringt in diesem Zusammenhang beides knapp und natürlich zum Ausdruck.
- source_word: ἀπὸ γῆς Ἰούδα
  choice: aus dem Land Juda
  rationale: γῆ bedeutet hier „Land“; „Juda“ gibt die griechische Benennung genauer wieder als das interpretierende „Judäa“.
- source_word: εἰς πᾶσαν βασιλείαν μου
  choice: in irgendeinen Teil meines Königreichs
  rationale: Gemeint ist die Verschleppung an jeden beliebigen Ort innerhalb des Herrschaftsgebiets. Diese Formulierung gibt den räumlichen und distributiven Sinn idiomatisch wieder.
- source_word: ἀφίημι ἐλευθέραν δωρεάν
  choice: setze ich unentgeltlich in Freiheit
  rationale: ἀφίημι mit ἐλευθέραν bezeichnet die Freilassung; δωρεάν stellt klar, dass dafür weder Lösegeld noch Gebühr zu entrichten ist.
- source_word: πάντες ἀφιέτωσαν
  choice: Alle sollen … erlassen
  rationale: Der Imperativ richtet sich an alle zuständigen Personen im königlichen Machtbereich und fordert sie auf, finanzielle Forderungen aufzuheben.
- source_word: τοὺς φόρους
  choice: die Steuern
  rationale: φόροι bezeichnet Steuern, Tribute oder Abgaben. „Steuern“ ist im Kontext des königlichen Erlasses die klarste moderne Entsprechung.
- source_word: κτηνῶν αὐτῶν
  choice: die Abgaben auf ihr Vieh
  rationale: κτῆνος bezeichnet Nutz- oder Lasttiere. Im fiskalischen Zusammenhang liegt eine Abgabe nahe, die auf den Tieren beziehungsweise dem Viehbestand lag.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem Ton eines königlichen Verwaltungserlasses. „Menschen aus dem jüdischen Volk“ ist bewusst inklusiv und gibt ψυχή als Person wieder; „unentgeltlich in Freiheit setzen“ wahrt den rechtlichen Charakter der Freilassung.
