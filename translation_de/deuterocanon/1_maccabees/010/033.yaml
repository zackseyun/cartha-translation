  to: Und jeden Menschen aus dem jüdischen Volk, der aus dem Land Juda in irgendeinen Teil meines Königreichs verschleppt worden ist, setze ich unentgeltlich in Freiheit. Alle sollen ihnen die Steuern erlassen, auch die auf ihr Vieh.[a]
