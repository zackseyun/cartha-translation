  yaml_path: translation/deuterocanon/1_maccabees/010/036.yaml
  text: And let up to thirty thousand men from the Jews be enrolled in the king’s forces[a], and provisions shall be given to them, as is fitting for all the king’s forces.
translation:
  language: de
  text: Und bis zu dreißigtausend Männer aus den Reihen der Juden sollen in die Streitkräfte des Königs aufgenommen werden. Sie sollen Versorgung[a] erhalten, wie sie allen Streitkräften des Königs zusteht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verpflegung“, „Unterhalt“; wörtlicher: „Gastfreundschaft“. Das griechische Wort ξενιά bezeichnet hier die Versorgung, die Soldaten gewährt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προγραφήθήτωσαν
  choice: sollen ... aufgenommen werden
  rationale: Der passive Imperativ bezeichnet die amtliche Erfassung für den Militärdienst. „In die Streitkräfte ... aufgenommen werden“ gibt im Deutschen sowohl den Verwaltungsvorgang als auch die Eingliederung natürlich wieder.
- source_word: τῶν Ἰουδαίων
  choice: aus den Reihen der Juden
  rationale: 'Der Ausdruck ist hier partitiv: Die Männer werden aus der jüdischen Bevölkerung ausgewählt.'
- source_word: εἰς τὰς δυνάμεις τοῦ βασιλέως
  choice: in die Streitkräfte des Königs
  rationale: δυνάμεις bezeichnet in diesem Zusammenhang militärische Verbände; „Streitkräfte“ vermeidet die unnötige Festlegung auf mehrere getrennte Heere.
- source_word: εἰς τριάκοντα χιλιάδας ἀνδρῶν
  choice: bis zu dreißigtausend Männer
  rationale: εἰς bei der Zahl bezeichnet hier eine Obergrenze beziehungsweise Zielstärke; ἀνδρῶν meint im militärischen Zusammenhang Männer.
- source_word: δοθήσεται
  choice: Sie sollen ... erhalten
  rationale: Der Futur Passiv gehört zum Verordnungston des Erlasses. Die deutsche Soll-Formulierung wahrt diesen administrativen Charakter idiomatisch.
- source_word: ξενιά
  choice: Versorgung
  rationale: Im militärischen Kontext bezeichnet ξενιά die den Truppen gewährte Verpflegung beziehungsweise ihren Unterhalt. „Versorgung“ ist breit genug, ohne den Sinn auf Essensrationen zu verengen.
- source_word: ὡς καθῆκει
  choice: wie sie ... zusteht
  rationale: καθῆκει kann das Angemessene, Übliche oder Geschuldete ausdrücken. „Zusteht“ passt zur zugesagten regulären Truppenversorgung, ohne deren genaue rechtliche Form näher festzulegen.
- source_word: πάσαις ταῖς δυνάμεσιν τοῦ βασιλέως
  choice: allen Streitkräften des Königs
  rationale: Der Dativ bezeichnet diejenigen, für die diese übliche Versorgung gilt.
