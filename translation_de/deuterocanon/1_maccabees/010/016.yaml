  text: And he said[b][a], “Will we find one man like this? And now let us make him our friend and ally.”
translation:
  language: de
  text: 'Und er sagte: „Werden wir einen einzigen Mann wie diesen finden?[a] Und nun wollen wir ihn zu unserem Freund[b] und Verbündeten machen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ausführlicher: „Wir werden doch keinen Mann wie diesen finden, oder?“ Die griechische rhetorische Frage erwartet die Antwort „Nein“.'
    reason: lexical_alternative
  - marker: b
    text: „Freund“ kann hier im hellenistischen politischen und höfischen Sprachgebrauch eine offizielle Stellung bezeichnen, nicht nur persönliche Zuneigung.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ εὑρήσομεν
  choice: Werden wir … finden?
  rationale: Die Verbindung von μή mit dem Futur formuliert eine rhetorische Frage, auf die eine verneinende Antwort erwartet wird. Die deutsche Frageform bewahrt diese indirekte Wirkung; die Fußnote verdeutlicht sie.
- source_word: ἄνδρα τοιοῦτον ἕνα
  choice: einen einzigen Mann wie diesen
  rationale: „Mann“ gibt das ausdrücklich maskuline ἄνδρα wieder, „wie diesen“ die hinweisende Bedeutung von τοιοῦτον. „Einen einzigen“ erhält den Nachdruck des Zahlworts ἕνα und betont die Einzigartigkeit.
- source_word: ποιήσωμεν
  choice: wollen wir … machen
  rationale: Der hortative Konjunktiv wird als gemeinsamer Vorschlag wiedergegeben. „Zu unserem … machen“ bildet die politische Ernennung oder Anerkennung verständlich und zugleich quellennah ab.
- source_word: φίλον
  choice: Freund
  rationale: Das Wort bezeichnet einen Freund, kann im hellenistischen Hof- und Politikgebrauch jedoch auch einen anerkannten politischen Rang oder Status meinen. „Freund“ hält es vom folgenden „Verbündeten“ unterschieden.
- source_word: σύμμαχον
  choice: Verbündeten
  rationale: Der Ausdruck bezeichnet einen politisch oder militärisch in einem Bündnis Verbundenen; „Verbündeter“ ist die klare heutige Entsprechung.
- source_word: ἡμῶν
  choice: unserem
  rationale: Der griechische Genitiv des Personalpronomens wird idiomatisch durch das deutsche Possessivwort wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, während „wollen wir“ den auffordernden Konjunktiv natürlich wiedergibt. Die rhetorische Offenheit der Frage bleibt im Haupttext erhalten und wird nicht stillschweigend zu einer Aussage umgeformt.
