  yaml_path: translation/deuterocanon/1_maccabees/010/065.yaml
  text: And the king honored him[a], and enrolled him among the first friends[b], and appointed him general and governor of a district.
translation:
  language: de
  text: Und der König erwies ihm Ehre, nahm ihn in die Reihe der Ersten Freunde[a] auf und ernannte ihn zum Heerführer und zum Statthalter eines Bezirks[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die »Ersten Freunde« waren wahrscheinlich eine offizielle Ranggruppe am Königshof. Möglich ist auch: »die vornehmsten Freunde«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet den Verwalter oder Herrscher über einen territorialen Teilbereich.
    reason: cultural_note
lexical_decisions:
- source_word: ἐδόξασεν
  choice: erwies ihm Ehre
  rationale: Im höfisch-politischen Zusammenhang bezeichnet das Verb die Verleihung von Ehre und Rang, nicht theologisches Verherrlichen.
- source_word: ἔγραψεν αὐτὸν τῶν πρώτων φίλων
  choice: nahm ihn in die Reihe der Ersten Freunde auf
  rationale: γράφω hat hier den Sinn einer offiziellen Aufnahme beziehungsweise Eintragung in eine Ranggruppe. Die Formulierung gibt den Vorgang idiomatisch wieder.
- source_word: τῶν πρώτων φίλων
  choice: der Ersten Freunde
  rationale: Die Wendung bezeichnet wahrscheinlich einen offiziellen höfischen Rang. Die Großschreibung macht den Titelcharakter sichtbar, ohne ihn durch eine stärker deutende Amtsbezeichnung zu ersetzen.
- source_word: στρατηγὸν
  choice: Heerführer
  rationale: Der militärische Sinn ist hier vorrangig und wird dadurch klar vom nachfolgenden Verwaltungsamt unterschieden.
- source_word: μεριδάρχην
  choice: Statthalter eines Bezirks
  rationale: Das Wort bezeichnet einen Amtsträger über einen territorialen Teilbereich. Die Wiedergabe ist verständlich, ohne die genaue hellenistische Verwaltungsstruktur übermäßig festzulegen.
