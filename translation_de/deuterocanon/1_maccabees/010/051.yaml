  text: And Alexander sent ambassadors to Ptolemy king of Egypt with these words, saying,
translation:
  language: de
  text: 'Und Alexander sandte Gesandte zu Ptolemäus, dem König von Ägypten, mit folgenden Worten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Der Aorist von ἀποστέλλω bezeichnet im erzählenden Zusammenhang schlicht das Entsenden; „sandte“ ist natürlich und würdig.
- source_word: πρὸς Πτολεμαῖον βασιλέα Αἰγύπτου
  choice: zu Ptolemäus, dem König von Ägypten
  rationale: πρός mit Akkusativ bezeichnet bei einem Verb des Sendens den Adressaten; βασιλέα Αἰγύπτου steht als Apposition zu Ptolemäus.
- source_word: πρέσβεις
  choice: Gesandte
  rationale: Das Wort bezeichnet offizielle diplomatische Vertreter. „Gesandte“ trifft den historischen Kontext natürlich und vermeidet die modern-ständige Amtskonnotation von „Botschafter“.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: Folgendes
  rationale: Die Wendung kündigt den Wortlaut der unmittelbar folgenden Botschaft an; „Folgendes“ gibt diese Funktion in aktuellem Deutsch knapp und idiomatisch wieder.
- source_word: λέγων
  choice: und ließ ihm … sagen
  rationale: Das präsentische Partizip führt den Inhalt der übermittelten Botschaft ein. Im Deutschen bildet „ließ ihm Folgendes sagen“ die mittelbare Übermittlung durch die Gesandten natürlich ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Erzähldeutsch. Der Doppel-Ausdruck κατὰ τοὺς λόγους τούτους λέγων wird idiomatisch gebündelt, ohne den Sinn zu verkürzen; der Doppelpunkt hält den Satz für die folgende direkte Rede offen.
