translation:
  language: de
  text: Auch sollen die Mauern Jerusalems wieder aufgebaut und ringsum befestigt werden. Die Kosten werden aus dem königlichen Haushalt getragen,[a] ebenso sollen die Mauern in Judäa wieder aufgebaut werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „auf Anordnung des Königs“. Der griechische Ausdruck kann entweder einen finanziell-administrativen Sinn (etwa Rechnungs- oder Haushaltsposten) oder den Gedanken eines königlichen Erlasses haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι / οἰκοδομῆσαι
  choice: wieder aufgebaut / Wiederaufbau
  rationale: Die Verben bezeichnen das Bauen; bei bereits bestehenden bzw. zerstörten Befestigungsmauern gibt „wieder aufbauen“ den Zusammenhang natürlich und präzise wieder.
- source_word: τὰ τείχη
  choice: die Mauern
  rationale: τείχη bezeichnet besonders Stadt- oder Befestigungsmauern. „Mauern“ bleibt nah am Griechischen, ohne den Ausdruck unnötig auszuweiten.
- source_word: ὀχυρῶσαι
  choice: befestigt werden
  rationale: Das Verb bedeutet, etwas stark und verteidigungsfähig zu machen; „befestigen“ ist dafür im Deutschen der übliche Ausdruck.
- source_word: κυκλόθεν
  choice: ringsum
  rationale: Das Adverb bezeichnet die vollständige räumliche Umfassung. „Ringsum“ ist knapp, modern und bewahrt diese Bedeutung.
- source_word: ἡ δαπάνη δοθήσεται
  choice: Die Kosten dafür werden … getragen
  rationale: Wörtlich wird der Aufwand „gegeben“. Im Zusammenhang mit der Finanzierung von Bauarbeiten drückt „die Kosten werden getragen“ den Sinn idiomatisch aus.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: aus der Kasse des Königs
  rationale: λόγος kann hier im administrativen Zusammenhang eine Abrechnung oder einen Haushaltsposten bezeichnen. „Aus der Kasse des Königs“ macht die im Kontext naheliegende Finanzierungsquelle verständlich, während die alternative Lesart in der Fußnote erhalten bleibt.
- source_word: Ἰουδαίᾳ
  choice: Judäa
  rationale: Die hellenistische Gebietsbezeichnung wird im Deutschen üblich mit „Judäa“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Standardstil. Die sperrige Reihung griechischer Infinitivkonstruktionen wird in klare deutsche Sätze überführt; das einleitende καί wird mit „Auch“ aufgenommen. Der letzte Satzteil wird als weitere Kostenübernahme verstanden, ohne die lexikalische Mehrdeutigkeit von λόγος im Haupttext zu überfrachten.
