base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/062.yaml
  text: And the king gave orders to them[a], and they stripped Jonathan of his garments and clothed him in purple[b]; and they did so.
translation:
  language: de
  text: Der König befahl ihnen, Jonatan seine Gewänder auszuziehen und ihn in Purpur zu kleiden.[a][b] Und sie taten es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen stehen nach „er befahl ihnen“ die Verben für das Ausziehen und Bekleiden in der Einzahl, während der abschließende Satz „sie taten es“ im Plural steht. Der Zusammenhang legt nahe, dass die Angesprochenen den Befehl ausführten; die Singularformen können jedoch auch den König als Handelnden fortführen.
    reason: textual_variant
  - marker: b
    text: Purpur war in diesem höfischen Zusammenhang ein Zeichen königlicher oder sonst hoher Würde.
    reason: cultural_note
lexical_decisions:
- source_word: προσέταξεν αὐτοῖς
  choice: befahl ihnen
  rationale: Die Wendung bezeichnet einen verbindlichen königlichen Befehl und wird im Deutschen knapp und natürlich wiedergegeben.
- source_word: ἐξέδυσεν Ἰωνάθαν τὰ ἱμάτια αὐτοῦ
  choice: Jonatan seine Gewänder auszuziehen
  rationale: Der indeklinable Name Ἰωνάθαν kann hier als Objekt verstanden werden; zusammen mit dem ausdrücklichen Plural im Rahmen („ihnen“, „sie taten es“) ergibt sich, dass die Angesprochenen Jonatans bisherige Kleidung entfernen sollten. „Gewänder“ wahrt den gehobenen höfischen Zusammenhang, ohne die Art der Kleidung näher festzulegen.
- source_word: ἐνέδυσεν αὐτὸν πορφύραν
  choice: ihn in Purpur zu kleiden
  rationale: „In Purpur kleiden“ bewahrt die knappe Ausdrucksweise des Griechischen und den zeremoniellen Charakter, ohne πορφύρα unnötig auf ein bestimmtes Kleidungsstück festzulegen.
- source_word: ἐποίησαν οὕτως
  choice: Und sie taten es
  rationale: Die schlichte Abschlussformel bringt die Ausführung des königlichen Befehls idiomatisch zum Ausdruck.
