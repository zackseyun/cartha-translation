  yaml_path: translation/deuterocanon/1_maccabees/010/075.yaml
  text: And he encamped against Joppa[a], and those from the city shut him out, because a garrison of Apollonius was in Joppa[b]; and they fought against it.
translation:
  language: de
  text: Er schlug sein Lager vor Joppe auf, und die Leute aus der Stadt verweigerten ihm den Einlass, denn in Joppe lag eine Besatzung des Apollonius; und sie kämpften gegen die Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt von „sie kämpften“ wird im Griechischen nicht ausdrücklich genannt. Das griechische Objekt ist feminin Singular und bezieht sich wahrscheinlich auf Joppe, also die Stadt.
    reason: referential_ambiguity
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Ἰόππην
  choice: schlug sein Lager vor Joppe auf
  rationale: παρεμβάλλω bezeichnet hier im militärischen Zusammenhang das Aufschlagen eines Lagers; ἐπί mit dem Ortsnamen weist auf die feindliche Ausrichtung gegen die Stadt hin. „Vor Joppe“ klingt im Deutschen natürlich und bewahrt den militärischen Sinn.
- source_word: ἀπέκλεισαν αὐτόν
  choice: verweigerten ihm den Einlass
  rationale: ἀποκλείω bedeutet „ausschließen, aussperren“. Die gewählte Formulierung gibt im Zusammenhang einer befestigten Stadt natürlich wieder, dass ihm der Zugang verwehrt wurde, ohne ausdrücklich Tore in den Text einzutragen.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: die Leute aus der Stadt
  rationale: Die Wendung bedeutet wörtlich „die aus der Stadt“. „Die Leute aus der Stadt“ ist geschlechtsneutral, verständlich und legt ihre genauere militärische oder politische Stellung nicht fest.
- source_word: φρουρὰ Ἀπολλωνίου
  choice: eine Besatzung des Apollonius
  rationale: φρουρά bezeichnet hier eine militärische Besatzung. Der Genitiv kann Zugehörigkeit oder Unterstellung ausdrücken; „des Apollonius“ bewahrt diese Offenheit.
- source_word: ἐπολέμησαν αὐτήν
  choice: sie kämpften gegen die Stadt
  rationale: πολεμέω bedeutet „kämpfen gegen“ oder „Krieg führen gegen“. Das feminine Singularpronomen αὐτήν bezieht sich grammatisch am ehesten auf die als Stadt verstandene Ortsbezeichnung Joppe; „die Stadt“ macht diesen Bezug im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die wiederholte Verknüpfung mit „und“ folgt der griechischen Satzfolge, während „verweigerten ihm den Einlass“ und „lag eine Besatzung“ idiomatisches heutiges Deutsch bieten. Die Unbestimmtheit des Subjekts im letzten Satzteil wird im Haupttext beibehalten und in der Fußnote erläutert.
