base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/002.yaml
  text: And King Demetrius heard, and he gathered very many forces, and went out to meet him in battle.
translation:
  language: de
  text: König Demetrius hörte davon, zog sehr viele Truppen zusammen und rückte aus, um ihm zum Kampf entgegenzutreten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: davon hörte
  rationale: Das Verb bezeichnet hier das Hören der zuvor berichteten Nachricht. „Davon hörte“ stellt den notwendigen Rückbezug im Deutschen natürlich her, ohne stärker deutend „erfuhr“ zu wählen.
- source_word: συνήγαγεν
  choice: zog … zusammen
  rationale: Die Wendung gibt das Zusammenbringen von Truppen unmittelbar und in natürlichem modernem Deutsch wieder; „mobilisierte“ würde den militärischen Vorgang stärker präzisieren als der griechische Text.
- source_word: δυνάμεις
  choice: Truppen
  rationale: Im militärischen Zusammenhang bezeichnet der Plural bewaffnete Kräfte. „Truppen“ ist im Deutschen idiomatischer als „Streitkräfte“ und bewahrt den Plural.
- source_word: πολλὰς σφόδρα
  choice: sehr viele
  rationale: Die Formulierung bildet sowohl die große Zahl als auch ihre Verstärkung direkt ab.
- source_word: ἐξῆλθεν
  choice: rückte aus
  rationale: Im militärischen Kontext ist „rückte aus“ eine natürliche Wiedergabe von „ging hinaus“, ohne ein bestimmtes Marschverfahren vorauszusetzen.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: um ihm … entgegenzutreten
  rationale: Die Zweckrichtung des griechischen Ausdrucks und die feindliche Begegnung werden im Deutschen klar und idiomatisch wiedergegeben.
- source_word: εἰς πόλεμον
  choice: im Kampf
  rationale: Die Wendung kennzeichnet den kriegerischen Zweck beziehungsweise Rahmen der Begegnung. „Im Kampf“ ist knapp und vermeidet die im Deutschen schwerfällige Formulierung „zum Krieg“.
