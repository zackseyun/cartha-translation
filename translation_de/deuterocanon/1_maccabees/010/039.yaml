    rationale: Auch das zweite ἁγίοις ist Dativ Plural. Der schwierige Zusammenhang erlaubt keine sichere Gleichsetzung mit einem singulären Heiligtum; eine Übersetzung mit Bezug auf die Heiligen und eine erläuternde Fußnote wahrt die Mehrdeutigkeit besser.
