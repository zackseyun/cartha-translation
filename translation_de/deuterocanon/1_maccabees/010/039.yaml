  naturalness: Die vorgeschlagene Fassung ist flüssig, doch „dem Heiligtum … zum Geschenk gemacht“ verstellt die plurale Personenbezeichnung. „Als Geschenk gegeben“ und „vorgesehene Ausgaben für die Heiligen“ sind modernes, verständliches Deutsch und bewahren den Urkundencharakter.
  terminology: „Heilige“ gibt ἅγιοι sachgerecht und ohne die engere kirchliche Prägung von „Saints“ wieder. „Ptolemaïs“ ist als deutscher Ortsname passend. Die Wendung zu den Ausgaben bleibt wegen der ungewöhnlichen griechischen Syntax bewusst zurückhaltend.
