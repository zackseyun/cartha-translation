  yaml_path: translation/deuterocanon/1_maccabees/010/039.yaml
  text: Ptolemais and the territory adjoining it I have given as a gift to the holy ones in Jerusalem[b][a], for the expenses that come first for the holy place.
translation:
  language: de
  text: Ptolemaïs und das zu ihr gehörende Gebiet[a] habe ich den Heiligen in Jerusalem als Geschenk gegeben, für die vorgesehenen Ausgaben für die Heiligen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das an sie angrenzende Gebiet“ oder „das ihr angegliederte Gebiet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Schlusssatz ist ungewöhnlich. Auch möglich: „für die vorrangigen“, „für die festgesetzten“ oder „für die notwendigen Ausgaben für die Heiligen“. Das abschließende griechische Wort kann im Tempelkontext möglicherweise auch auf Heiliges beziehungsweise das Heiligtum bezogen werden; der Wortlaut lautet jedoch Dativ Plural.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πτολεμαΐδα
  choice: Ptolemaïs
  rationale: Der Ortsname wird in seiner im Deutschen geläufigen griechischen Form wiedergegeben.
- source_word: τὴν προσκυροῦσαν αὐτῇ
  choice: das zu ihr gehörende Gebiet
  rationale: Der substantivierte feminine Partizipialausdruck bezeichnet das der Stadt angegliederte oder angrenzende Umland; „Gebiet“ ergänzt das im Griechischen vorausgesetzte Bezugswort natürlich.
- source_word: δέδωκα
  choice: habe ich … gemacht
  rationale: Das griechische Perfekt bezeichnet eine vollzogene Schenkung mit fortbestehender Geltung; das deutsche Perfekt gibt dies im Zusammenhang eines Erlasses angemessen wieder.
- source_word: δόμι
  choice: zum Geschenk
  rationale: Die ungewöhnlich überlieferte Form gehört offenbar zur Wortgruppe des Gebens beziehungsweise der Gabe. „zum Geschenk gemacht“ bewahrt den Sinn einer unentgeltlichen Zuwendung, ohne die Textform übermäßig zu präzisieren.
- source_word: τοῖς ἁγίοις τοῖς ἐν Ἰερουσαλήμ
  choice: dem Heiligtum in Jerusalem
  rationale: Die Form ἁγίοις kann grammatisch ein substantiviertes Neutrum im Plural sein und die heiligen Stätten beziehungsweise den Tempelbezirk bezeichnen. Der unmittelbar folgende Hinweis auf dessen Ausgaben und der tempeladministrative Kontext sprechen hier für „Heiligtum“.
- source_word: εἰς τὴν προκαθήκουσαν δαπάνην
  choice: für die vorrangigen Ausgaben
  rationale: Die überlieferte Wendung ist ungewöhnlich. προκαθήκουσαν bezeichnet wahrscheinlich eine vorgeordnete, festgesetzte oder notwendige Ausgabe; „vorrangigen“ bleibt nahe an dieser Bedeutung, ohne eine nicht sichere Regelmäßigkeit zu behaupten.
- source_word: τοῖς ἁγίοις
  choice: des Heiligtums
  rationale: Der Dativ bezeichnet hier am natürlichsten den Bereich, dem die Ausgaben gelten. Im Deutschen wird diese Zugehörigkeit idiomatisch mit dem Genitiv ausgedrückt.
theological_decisions:
- issue: Bezug von τοῖς ἁγίοις im tempeladministrativen Zusammenhang
  choice: Beide Vorkommen werden auf das Heiligtum beziehungsweise den Tempelbereich bezogen.
  alternative: Das erste oder beide Vorkommen können formal auch „den Heiligen“ beziehungsweise „für die Heiligen“ bedeuten.
  rationale: ἁγίοις ist morphologisch sowohl als maskuliner als auch als neutraler Dativ Plural möglich. Die Schenkung von Stadtgebiet zur Deckung heiliger Ausgaben und die parallele Wiederholung des Ausdrucks begünstigen den sachlichen Bezug auf das Jerusalemer Heiligtum; die Personenlesart bleibt als echte grammatische Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdevolle Verwaltungssprache. Die Satzstellung lässt den Charakter einer königlichen Schenkungsurkunde erkennen, bleibt aber im Deutschen gut verständlich. „Heiligtum“ vermeidet eine unnötige Festlegung auf einzelne Amtsträger und entspricht dem unmittelbaren Finanz- und Tempelkontext.
