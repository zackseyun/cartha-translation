  text: But the people stood as Jonathan had commanded[a], and their horses grew weary.
translation:
  language: de
  text: Doch das Volk stand, wie Jonatan befohlen hatte, und ihre Pferde wurden müde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht lediglich „ihre Pferde“. Im Zusammenhang sind wahrscheinlich die Pferde der feindlichen Reiterei gemeint, die müde wurden, während Jonatans Leute ihre Stellung hielten.
    reason: Mehrdeutiger Bezug des Possessivpronomens
lexical_decisions:
- source_word: ὁ δὲ λαός
  choice: Doch das Volk
  rationale: λαός bezeichnet hier Jonatans Leute als geschlossene Gruppe. δέ wird mit „Doch“ wiedergegeben, weil der Kontext einen leichten Gegensatz zum vorausgehenden Kampfgeschehen nahelegt.
- source_word: ἱστήκει
  choice: blieb stehen
  rationale: Die Form beschreibt einen fortdauernden Zustand. „Blieb stehen“ vermittelt im Deutschen natürlich, dass das Volk die befohlene Stellung hielt.
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: wie Jonatan befohlen hatte
  rationale: ἐπιτάσσω bedeutet „befehlen“ oder „anordnen“. Das Plusquamperfekt macht deutlich, dass der Befehl dem beschriebenen Standhalten vorausging.
- source_word: ἐκοπίασαν
  choice: wurden müde
  rationale: κοπιάω bezeichnet hier das Ermüden infolge von Anstrengung, ohne notwendig völlige Erschöpfung auszudrücken.
- source_word: οἱ ἵπποι αὐτῶν
  choice: ihre Pferde
  rationale: Die direkte Wiedergabe bewahrt den mehrdeutigen Bezug des griechischen Possessivpronomens, statt die im Kontext wahrscheinlichen feindlichen Reiter ausdrücklich einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Blieb stehen“ ist verständlicher und kontextgerechter als das wörtlich knappere „stand“, ohne die militärische Deutung „hielt die Stellung“ ausdrücklich in den Haupttext einzutragen.
