  text: And Alexander the king gathered great forces and encamped opposite Demetrius.
translation:
  language: de
  text: Und König Alexander zog ein großes Heer zusammen und schlug gegenüber von Demetrius sein Lager auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: zog … zusammen
  rationale: Der Aorist von συνάγω bezeichnet hier das Zusammenführen militärischer Kräfte; die deutsche Wendung ist natürlich und bewahrt den Vorgang.
- source_word: δυνάμεις μεγάλας
  choice: ein großes Heer
  rationale: δυνάμεις bezeichnet im militärischen Erzählzusammenhang Truppen oder Streitkräfte. Im Deutschen gibt »ein großes Heer« die quantitative Aussage idiomatisch wieder, auch wenn die griechische Form im Plural steht.
- source_word: παρενέβαλεν
  choice: schlug … sein Lager auf
  rationale: παρεμβάλλω bedeutet im militärischen Kontext, ein Lager zu beziehen oder aufzuschlagen; die gewählte Wendung ist klar, gegenwärtig und erzählerisch angemessen.
- source_word: ἐξ ἐναντίας
  choice: gegenüber von
  rationale: Die Wendung bezeichnet zunächst die räumliche Gegenüberstellung und wird nicht vorschnell als Angriff gedeutet.
- source_word: Δημητρίῳ
  choice: Demetrius
  rationale: Übliche deutsche Namensform für Δημήτριος.
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: König Alexander
  rationale: Die im Deutschen natürliche Titelform gibt die griechische Apposition präzise wieder.
