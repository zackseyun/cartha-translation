  yaml_path: translation/deuterocanon/1_maccabees/010/021.yaml
  text: And Jonathan put on the holy robe in the seventh month[a], in the one hundred sixtieth year, at the feast of Booths, and he gathered forces and made many weapons.
translation:
  language: de
  text: Und Jonatan legte im siebten Monat des 160. Jahres, am Laubhüttenfest[a], das heilige Gewand an. Er sammelte Truppen und fertigte viele Waffen an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Fest des Hüttenbauens.'
    reason: Die Fußnote macht die konkrete Bedeutung des griechischen Festnamens σκηνοπηγία sichtbar, während der Haupttext die geläufige deutsche Bezeichnung verwendet.
lexical_decisions:
- source_word: ἐνεδύσατο
  choice: legte … an
  rationale: Das griechische Medium bezeichnet hier das Anlegen eines Kleidungsstücks; die deutsche Wendung ist natürlich und gibt die konkrete Handlung genau wieder.
- source_word: τὴν ἁγίαν στολήν
  choice: das heilige Gewand
  rationale: στολή bezeichnet ein besonderes, hier geweihtes Kleidungsstück. „Gewand“ wahrt den feierlichen Ton, ohne die Art der priesterlichen Kleidung über den griechischen Wortlaut hinaus festzulegen.
- source_word: τῷ ἑβδόμῳ μηνὶ
  choice: im siebten Monat
  rationale: Der Dativ hat zeitliche Bedeutung und wird im Deutschen idiomatisch mit „im“ wiedergegeben.
- source_word: ἔτους ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: des 160. Jahres
  rationale: Die griechische Ordinalkonstruktion bezeichnet das 160. Jahr; die Ziffernschreibung ist im modernen Deutschen übersichtlich.
- source_word: ἐν ἑορτῇ σκηνοπηγίας
  choice: am Laubhüttenfest
  rationale: σκηνοπηγία bezeichnet das jüdische Fest des Hüttenbaus. „Laubhüttenfest“ ist die etablierte, verständliche deutsche Bezeichnung.
- source_word: συνήγαγεν δυνάμεις
  choice: sammelte Truppen
  rationale: δυνάμεις meint in diesem Zusammenhang militärische Kräfte; „Truppen“ macht den militärischen Sinn natürlich und knapp deutlich.
- source_word: κατεσκεύασεν ὅπλα πολλά
  choice: stellte viele Waffen bereit
  rationale: κατασκευάζω kann sowohl das Herstellen als auch das Herrichten oder Bereitstellen bezeichnen. Die gewählte Formulierung bewahrt diese Bedeutungsspanne besser als das engere „stellte her“.
