translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am Griechischen; der lange griechische Satz wird zur besseren Lesbarkeit in zwei Sätze gegliedert. Das am Anfang der bereitgestellten Quellenzeile stehende Fragment gehört zum vorausgehenden Satz und wurde entsprechend der Versabgrenzung nicht aufgenommen.
