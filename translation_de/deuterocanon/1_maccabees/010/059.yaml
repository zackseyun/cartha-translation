translation:
  language: de
  text: Und König Alexander schrieb an Jonatan, er solle zu einer Zusammenkunft mit ihm kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Der Aorist von γράφω bedeutet hier schlicht „schrieb“. „Ließ ausrichten“ wäre stärker deutend, „schrieb einen Brief“ würde ein im Griechischen nicht ausdrücklich genanntes Objekt ergänzen.
- source_word: ὁ βασιλεὺς Ἀλέξανδρος
  choice: König Alexander
  rationale: Diese Wortstellung entspricht natürlichem modernem Deutsch und bewahrt Titel und Namen.
- source_word: Ἰωνάθῃ
  choice: Jonatan
  rationale: Der Dativ bezeichnet den Empfänger des Schreibens. „Jonatan“ ist die im Deutschen geläufige biblische Namensform; die Empfängerfunktion wird durch die Konstruktion „schrieb Jonatan“ ausgedrückt.
- source_word: ἐλθεῖν
  choice: er solle kommen
  rationale: Der Infinitiv hängt inhaltlich von „schrieb“ ab und gibt die Aufforderung des Schreibens wieder. Im Deutschen ist dafür eine indirekte Aufforderung mit „solle“ natürlich und präzise; „kommen“ bewahrt die deiktische Perspektive des Königs.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: und ihm begegnen
  rationale: Die Wendung bezeichnet das Kommen zu einer Begegnung mit Alexander. „Ihm begegnen“ gibt den griechischen Dativ αὐτῷ wieder und klingt im Zusammenhang mit „kommen“ natürlich und würdig.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die indirekte Aufforderung vermeidet einen im Deutschen schwerfälligen Infinitivanschluss und fügt keinen ausdrücklich genannten Brief als Objekt hinzu.
