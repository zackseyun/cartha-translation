  text: Since you have kept faith with us in the treaties[a], and have remained in our friendship and have not joined our enemies, we have heard[b], and
translation:
  language: de
  text: Weil ihr uns in den Verträgen die Treue gehalten habt[a], in unserer Freundschaft geblieben seid und euch nicht unseren Feinden angeschlossen habt, haben wir gehört[b], und
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weil ihr euch uns gegenüber in den Verträgen als treu erwiesen habt«. Das griechische Wort πίστις kann in diesem diplomatischen Zusammenhang Treue, Verlässlichkeit oder Loyalität bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hier überlieferte griechische Text endet mit »haben wir gehört, und«; der Satz wird im nächsten Vers fortgesetzt und bleibt an dieser Versgrenze unvollständig.
    reason: textual_boundary
lexical_decisions:
- source_word: ἐπεὶ
  choice: Weil
  rationale: Leitet den Grund für die im Folgenden angekündigte Reaktion ein und gibt den kausalen Sinn natürlich wieder.
- source_word: συνετηρήσατε πίστιν πρὸς ἡμᾶς
  choice: ihr uns … die Treue gehalten habt
  rationale: συντηρέω bezeichnet das Bewahren oder Aufrechterhalten; πίστις meint im diplomatischen Zusammenhang Verlässlichkeit, Treue oder Loyalität. Die deutsche Wendung „jemandem die Treue halten“ ist idiomatisch und bewahrt diesen Sinn.
- source_word: συνθήκας
  choice: in den Verträgen
  rationale: Das Wort bezeichnet hier förmliche politische Vereinbarungen; „Verträge“ entspricht dem diplomatischen Kontext besser als das theologisch stärker geprägte „Bund“.
- source_word: ἐνεμείνατε τῇ φιλία ἡμῶν
  choice: in unserer Freundschaft geblieben seid
  rationale: Die Formulierung bleibt eng am Griechischen und lässt zugleich den politischen Unterton einer freundschaftlichen Bündnisbeziehung erkennen.
- source_word: οὐ προσεχωρήσατε τοῖς ἐχθροῖς ἡμῶν
  choice: euch nicht unseren Feinden angeschlossen habt
  rationale: Das Verb beschreibt den Anschluss an eine Partei oder Seite; die reflexive deutsche Formulierung gibt dies klar wieder.
- source_word: ἠκούσαμεν
  choice: haben wir davon erfahren
  rationale: Im brieflichen Zusammenhang bedeutet das Hören hier, dass die Nachricht den Absender erreicht hat. „Davon erfahren“ ist im Deutschen natürlicher als das wörtliche „gehört“.
theological_decisions:
- issue: Bedeutung von πίστις im politisch-diplomatischen Zusammenhang
  choice: Treue
  alternative: Glaube; Loyalität; Zuverlässigkeit
  rationale: Hier geht es nicht um Glauben im religiösen Sinn, sondern um verlässliches Festhalten an Verträgen und Freundschaft. „Treue“ wahrt die Bedeutungsbreite von πίστις und ist in der deutschen Wendung idiomatisch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die diplomatische Sprache bleibt erkennbar, ohne unnötig altertümlich zu wirken. Die auffällige Unvollständigkeit am Versende wird im Haupttext bewahrt und in der Fußnote erklärt.
