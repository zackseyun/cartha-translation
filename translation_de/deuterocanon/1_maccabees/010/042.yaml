base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/042.yaml
  text: And in addition to these things[a], the five thousand shekels of silver that they used to take from the revenues, as in former years, from the sanctuary account each year, these also are remitted, because they belong to the priests who minister.
translation:
  language: de
  text: Und zusätzlich dazu werden auch die fünftausend Schekel Silber erlassen, die man wie in früheren Jahren jedes Jahr aus den Einnahmen des Heiligtums nach der Abrechnung[a] einzog; denn sie stehen den Priestern zu, die ihren Dienst tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der jährlichen Abrechnung des Heiligtums“ beziehungsweise „nach der jährlichen Rechnungsführung des Heiligtums“. Die griechische Wendung mit λόγος ist verwaltungssprachlich und stark verkürzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεντακισχιλίους σίκλους ἀργυρίου
  choice: fünftausend Schekel Silber
  rationale: Bewahrt die antike Gewicht- und Währungseinheit und gibt die griechische Mengenangabe natürlich wieder.
- source_word: ἐλάμβανον
  choice: man … einzog
  rationale: Der Imperfekt bezeichnet eine wiederkehrende frühere Praxis; im fiskalischen Zusammenhang ist „einziehen“ treffend.
- source_word: ἀπὸ τῶν χρειῶν
  choice: aus den Einnahmen
  rationale: χρεῖαι bezeichnet hier im administrativen Zusammenhang finanzielle Einkünfte beziehungsweise Erträge.
- source_word: ὡς ἐν τοῖς πρώτοις ἔτεσιν
  choice: wie in früheren Jahren
  rationale: Gibt den Vergleich mit der bisherigen Praxis in natürlichem Deutsch wieder.
- source_word: τοῦ ἁγίου
  choice: des Heiligtums
  rationale: Bezeichnet im Zusammenhang mit Tempelfinanzen und Priesterdienst das Heiligtum, ohne einen engeren Tempelbereich festzulegen.
- source_word: ἀπὸ τοῦ λόγου κατʼ ἐνιαυτόν
  choice: jedes Jahr … nach der Abrechnung
  rationale: λόγος hat hier eine administrative Bedeutung wie Abrechnung oder Rechnungsführung; die gedrängte griechische Konstruktion bleibt durch die Fußnote als mehrdeutig erkennbar.
- source_word: ἀφίεται
  choice: werden … erlassen
  rationale: Im fiskalischen Kontext bezeichnet das Verb den Erlass einer Abgabe oder Forderung.
- source_word: διὰ τὸ ἀνήκειν αὐτὰ
  choice: denn sie stehen … zu
  rationale: ἀνήκειν drückt hier rechtmäßige Zugehörigkeit beziehungsweise Anspruch aus.
- source_word: τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν
  choice: den Priestern …, die dort ihren Dienst tun
  rationale: Gibt den kultischen Dienst der amtierenden Priester klar und natürlich wieder.
