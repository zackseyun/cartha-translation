  yaml_path: translation/deuterocanon/1_maccabees/010/014.yaml
  text: But in Bethsura some of those who had abandoned the law and the commandments were left behind, for it was a refuge for them.
translation:
  language: de
  text: Doch in Bet-Zur blieben einige von denen zurück, die das Gesetz und die Gebote verlassen hatten; denn die Stadt war für sie ein Zufluchtsort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Gibt den einschränkenden Gegensatz zum vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: Βεθσούροις
  choice: Bet-Zur
  rationale: Verwendet die im modernen Deutschen geläufige, dem hebräischen Ortsnamen angenäherte Form.
- source_word: ὑπελείφθησάν
  choice: blieben … zurück
  rationale: Bewahrt den passivischen beziehungsweise intransitiven Sinn des Zurückbleibens, ohne unnötig anzudeuten, wer sie zurückließ.
- source_word: τῶν καταλειπόντων
  choice: von denen …, die … verlassen hatten
  rationale: Gibt das Partizip als Zugehörigkeit zu der Gruppe wieder, die Gesetz und Gebote aufgegeben hatte.
- source_word: τὸν νόμον καὶ τὰ προστάγματα
  choice: das Gesetz und die Gebote
  rationale: „Gesetz“ und „Gebote“ sind verständliche und sachlich passende Entsprechungen; die Mehrzahl von προστάγματα bleibt erhalten.
- source_word: φυγαδευτήριον
  choice: Zufluchtsort
  rationale: Bezeichnet einen Ort, an den man flieht beziehungsweise an dem man Schutz findet.
