  source_fidelity: Die Übersetzung gibt κατεδίωξεν, εἰς Ἄζωτον, αἱ παρεμβολαί und συνῆψαν … εἰς πόλεμον insgesamt treffend wieder. „Aschdod“ ist als gebräuchliche deutsche biblische Namensform für Ἄζωτος angemessen. Die wiederholte Wendung ὀπίσω αὐτοῦ sollte jedoch nicht durch die Fußnote mit einer über den Text hinausgehenden Situierung („dort“) oder einer Festlegung auf den Verfolgten erläutert werden; sie kann räumlich („hinter ihm“) oder im Sinn von „nach ihm“ verstanden werden.
  naturalness: „Die Heerlager trafen hinter ihm zur Schlacht aufeinander“ ist in moderner, sachlich-würdiger Erzählsprache verständlich. Die Verbindung der beiden griechischen Hauptsätze mit „und“ bildet den knappen Erzählfluss unmittelbarer nach als ein Semikolon.
  terminology: „Heerlager“ bewahrt die konkrete Bildlichkeit von παρεμβολαί, ohne die metonymische Bedeutung als dort versammelte Truppen auszuschließen. „Zur Schlacht aufeinandertrafen“ gibt den militärischen Sinn von συνῆψαν … εἰς πόλεμον idiomatisch wieder und vermeidet eine doktrinäre oder unnötig spezifizierende Deutung.
