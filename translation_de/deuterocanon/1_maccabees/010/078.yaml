  text: And he pursued him to Azotus[a], and the camps joined battle behind him.
translation:
  language: de
  text: Und er verfolgte ihn bis nach Aschdod, und die Heerlager trafen hinter ihm zur Schlacht aufeinander.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „und die Heerlager schlossen sich hinter/nach ihm zum Kampf zusammen“. Die wiederholte griechische Wendung ὀπίσω αὐτοῦ kann räumlich („hinter ihm“) oder, je nach Zusammenhang, im Sinn von „nach ihm“ verstanden werden.'
    reason: Die Wendung ist im Deutschen nicht ohne sprachliche Härte nachzubilden; die Anmerkung bewahrt ihre mögliche Mehrdeutigkeit, ohne den Bezug des Pronomens weiter festzulegen.
lexical_decisions:
- source_word: κατεδίωξεν ὀπίσω αὐτοῦ
  choice: er verfolgte ihn
  rationale: Das Verb bezeichnet im militärischen Zusammenhang eine entschlossene Verfolgung. Die Verbindung mit ὀπίσω αὐτοῦ wird im Deutschen idiomatisch durch das Akkusativobjekt „ihn“ wiedergegeben.
- source_word: εἰς Ἄζωτον
  choice: bis nach Aschdod
  rationale: εἰς bezeichnet hier das Ziel beziehungsweise die Reichweite der Verfolgung. „Aschdod“ ist die im Deutschen gebräuchliche biblische Form des Ortsnamens Ἄζωτος; „bis nach“ macht den Verlauf der Verfolgung natürlich verständlich.
- source_word: συνῆψαν … εἰς πόλεμον
  choice: trafen … zur Schlacht aufeinander
  rationale: Die Wendung bezeichnet das Zusammentreffen gegnerischer Verbände zum Kampf. Die deutsche Formulierung bewahrt den militärischen Sinn, ohne bloß ein friedliches Zusammenkommen anzudeuten.
- source_word: αἱ παρεμβολαί
  choice: die Heerlager
  rationale: παρεμβολή bezeichnet zunächst ein Lager oder Heerlager und kann metonymisch für die dort versammelten Streitkräfte stehen. „Heerlager“ bewahrt das Bild des griechischen Textes.
- source_word: ὀπίσω αὐτοῦ
  choice: hinter ihm
  rationale: 'Die zweite Verwendung der Wendung wird räumlich wiedergegeben und bewahrt so die Abfolge: Verfolgung bis Aschdod und Kampf im Rücken beziehungsweise im Gefolge des Verfolgten.'
