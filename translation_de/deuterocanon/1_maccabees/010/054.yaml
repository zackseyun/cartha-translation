  yaml_path: translation/deuterocanon/1_maccabees/010/054.yaml
  text: and let us establish friendship with him[a]. And now, give me your daughter as a wife, and I will become related by marriage to you[b], and I will give gifts to you and to her worthy of you.
translation:
  language: de
  text: Und lasst uns Freundschaft mit ihm schließen.[a] Nun gib mir deine Tochter zur Frau; dann werde ich dein Schwiegersohn,[b] und ich werde dir und ihr Geschenke machen, die deiner würdig sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lasst uns ein Bündnis mit ihm schließen.“ Das griechische Wort bedeutet wörtlich „Freundschaft“, kann in diesem königlichen Zusammenhang aber auch diplomatische Bündnisbeziehungen einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dann werde ich mich mit dir verschwägern“. Das griechische Verb bezeichnet den Eintritt in ein Verwandtschaftsverhältnis durch Heirat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνστήσωμεν
  choice: lasst uns … schließen
  rationale: Der auffordernde Konjunktiv bezeichnet einen gemeinsamen Vorschlag. Im Deutschen ist „Freundschaft schließen“ die natürliche Verbindung und gibt das Herstellen der Beziehung treffend wieder.
- source_word: φιλίαν
  choice: Freundschaft
  rationale: Die Grundbedeutung ist „Freundschaft“. Der königlich-diplomatische Zusammenhang lässt zugleich an ein politisches Bündnis denken, ohne dass das griechische Substantiv selbst ausdrücklich ein Bündnis bezeichnet.
- source_word: δός μοι τὴν θυγατέρα σου εἰς γυναῖκα
  choice: gib mir deine Tochter zur Frau
  rationale: Die Formulierung bewahrt den dynastischen und transaktionalen Ton der griechischen Heiratsformel und ist zugleich in modernem Deutsch klar verständlich.
- source_word: ἐπιγαμβρεύσω σοι
  choice: dann werde ich dein Schwiegersohn
  rationale: Das Verb bezeichnet das Eingehen eines durch Heirat entstehenden Verwandtschaftsverhältnisses. Im unmittelbaren Zusammenhang mit der Tochter gibt „dein Schwiegersohn werden“ die konkrete Beziehung knapp und natürlich wieder.
- source_word: δόματα
  choice: Geschenke
  rationale: Das Substantiv bezeichnet allgemein Gaben oder Geschenke. Der Zusammenhang legt Hochzeitsgeschenke nahe, doch wird diese Einschränkung im Griechischen nicht ausdrücklich vorgenommen.
- source_word: ἄξιά σου
  choice: die deiner würdig sind
  rationale: Die Wendung bezeichnet Geschenke, die dem Rang und der Würde des Angesprochenen entsprechen, und bewahrt den persönlichen Bezug des griechischen Ausdrucks.
