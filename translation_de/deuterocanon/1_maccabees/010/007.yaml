base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/007.yaml
  text: And Jonathan came to Jerusalem[a], and read the letters in the hearing of all the people and those in the citadel.
translation:
  language: de
  text: Und Jonatan kam nach Jerusalem und las die Briefe dem ganzen Volk und denen aus der Zitadelle[a] vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: denen aus der Akra, der befestigten Burganlage in Jerusalem.'
    reason: Die griechische Bezeichnung ἄκρα kann allgemein „Zitadelle“ bedeuten, bezeichnet im 1. Makkabäerbuch aber häufig speziell die als Akra bekannte Festung in Jerusalem.
lexical_decisions:
- source_word: ἦλθεν Ἰωναθὰν ἐν Ἱερουσαλήμ
  choice: Jonatan kam nach Jerusalem
  rationale: Das aoristische ἦλθεν wird im fortlaufenden Bericht schlicht mit „kam“ wiedergegeben. Obwohl der griechische Text ἐν („in“) hat, bezeichnet die Wendung hier das Eintreffen in Jerusalem; „nach Jerusalem“ ist dafür idiomatisches Deutsch.
- source_word: ἀνέγνω
  choice: las … vor
  rationale: ἀναγινώσκω bedeutet „lesen“. Die anschließende Wendung εἰς τὰ ὦτα zeigt, dass öffentlich und hörbar gelesen wurde; daher gibt „vorlesen“ die Situation natürlich wieder, ohne zusätzliche Öffentlichkeit in den Text einzutragen.
- source_word: τὰς ἐπιστολάς
  choice: die Briefe
  rationale: ἐπιστολή bezeichnet gewöhnlich einen Brief oder eine schriftliche Mitteilung. „Briefe“ ist hier die direkte und kontextgemäße Wiedergabe.
- source_word: εἰς τὰ ὦτα παντὸς τοῦ λαοῦ
  choice: dem ganzen Volk … vor
  rationale: Die wörtliche Formulierung „in die Ohren des ganzen Volkes“ ist im Deutschen unnatürlich. Die Konstruktion mit „vorlesen“ bewahrt den Sinn einer hörbaren Verlesung vor der gesamten versammelten Öffentlichkeit.
- source_word: τῶν ἐκ τῆς ἄκρας
  choice: denen aus der Zitadelle
  rationale: 'ἐκ bezeichnet zunächst Herkunft oder Zugehörigkeit: „die aus der Zitadelle“. Das substantivierte „denen“ vermeidet eine unbegründete Festlegung auf Männer, Soldaten oder Bewohner. „Zitadelle“ gibt ἄκρα verständlich wieder; der mögliche Eigenname „Akra“ wird in der Fußnote bewahrt.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Erzählregister. „Jonatan“ folgt der gebräuchlichen deutschen Namensform. Die Satzstellung mit dem trennbaren Verb „vorlesen“ ist natürlich und macht die öffentliche Verlesung klar; zugleich bleibt die Herkunftsformulierung „aus der Zitadelle“ nahe am griechischen ἐκ.
