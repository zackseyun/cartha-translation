base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/069.yaml
  text: And Demetrius appointed Apollonius[a], who was over Coele-Syria, and he gathered a great force and encamped in Jamnia;
translation:
  language: de
  text: Demetrius setzte Apollonius ein, der über Koilesyrien eingesetzt war, und er zog eine große Streitmacht[a] zusammen und schlug in Jamnia sein Lager auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein großes Heer“. Das griechische Wort kann allgemein eine militärische Streitmacht bezeichnen und muss nicht ein formal gegliedertes Heer meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέστησεν
  choice: setzte … ein
  rationale: Das Verb bezeichnet hier die Einsetzung in eine amtliche oder militärische Funktion. „Setzte … ein“ bewahrt diesen Sinn, ohne eine im Griechischen nicht ausdrücklich genannte Amtsbezeichnung zu ergänzen.
- source_word: τὸν ὄντα ἐπὶ Κοίλης Συρίας
  choice: der über Koilesyrien stand
  rationale: Die Wendung kennzeichnet Apollonius durch seine leitende Stellung über der Region. „Über … stand“ bildet den Autoritätssinn von ἐπί knapp ab; „Koilesyrien“ ist die gebräuchliche deutsche Form des antiken Regionsnamens.
- source_word: συνήγαγεν
  choice: zog … zusammen
  rationale: Das Verb bedeutet „zusammenbringen, versammeln“. Mit „Streitmacht“ ergibt sich eine natürliche militärische Formulierung, ohne den Vorgang näher als Aushebung oder Musterung festzulegen.
- source_word: δύναμιν μεγάλην
  choice: eine große Streitmacht
  rationale: δύναμις bezeichnet im militärischen Zusammenhang bewaffnete Kräfte, muss aber kein formal gegliedertes Heer meinen. „Streitmacht“ erhält diese semantische Breite.
- source_word: παρενέβαλεν
  choice: schlug … sein Lager auf
  rationale: Das Verb ist ein geläufiger militärischer Ausdruck für das Beziehen beziehungsweise Aufschlagen eines Lagers. Die deutsche Wendung ist idiomatisch und bewahrt den militärischen Erzählton.
- source_word: ἐν Ἰαμνείᾳ
  choice: in Jamnia
  rationale: „In“ entspricht unmittelbar der Präposition ἐν und ist bei der Ortsangabe im Deutschen natürlich.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts bei συνήγαγεν und παρενέβαλεν
  choice: „Er“ ohne namentliche Wiederholung
  alternative: „Apollonius“ oder „Demetrius“ ausdrücklich wiederholen
  rationale: Das Griechische nennt bei den folgenden Verben kein neues Subjekt. Im unmittelbaren Zusammenhang liegt Apollonius als Handelnder nahe, doch eine ausdrückliche Namensnennung würde die grammatische Mehrdeutigkeit stärker auflösen als die Vorlage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem militärischem Erzählstil. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung „Streitmacht“; die im englischen Konsultationstext abweichende Platzierung nach „Apollonius“ wurde nicht übernommen.
