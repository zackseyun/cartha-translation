base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/071.yaml
  text: Now then[a], if you trust in your forces, come down to us in the plain, and let us meet there[b], because with me is the strength of the cities.
translation:
  language: de
  text: Nun denn, wenn du auf deine Streitkräfte vertraust, komm zu uns in die Ebene hinab, und dort wollen wir uns miteinander messen[a]; denn bei mir ist die Streitmacht der Städte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dort wollen wir gegeneinander antreten“. Der griechische Ausdruck kann in diesem Zusammenhang eine unmittelbare Konfrontation bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Stärke der Städte“. Die griechische Wendung kann zusammenfassend die militärische Unterstützung aus den Städten meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθας
  choice: du auf … vertraust
  rationale: Das Perfekt von πείθω bezeichnet hier ein gefestigtes Vertrauen; die Präposition ἐπί wird natürlich mit „auf“ wiedergegeben.
- source_word: δυνάμεσίν σου
  choice: deine Streitkräfte
  rationale: Der Plural δυνάμεις bezeichnet im militärischen Zusammenhang am ehesten Truppen beziehungsweise bewaffnete Kräfte.
- source_word: κατάβηθι πρὸς ἡμᾶς εἰς τὸ πεδίον
  choice: komm zu uns in die Ebene hinab
  rationale: Die Wiedergabe bewahrt sowohl die räumliche Bewegung des Verbs κατάβηθι als auch πεδίον als ebenes, offenes Gelände.
- source_word: συγκριθῶμεν ἑαυτοῖς
  choice: wollen wir uns miteinander messen
  rationale: Die deutsche Wendung bezeichnet in diesem Zusammenhang eine direkte Konfrontation, ohne den im Griechischen nicht ausdrücklich genannten Kampf unnötig festzuschreiben.
- source_word: δύναμις τῶν πόλεων
  choice: die Streitmacht der Städte
  rationale: Der Singular δύναμις kann eine kollektiv verstandene militärische Macht bezeichnen; der Genitiv lässt offen, ob sie aus den Städten stammt oder ihnen zugeordnet ist.
- source_word: μετʼ ἐμοῦ ἐστιν
  choice: mir steht … zur Seite
  rationale: Die idiomatische deutsche Formulierung gibt wieder, dass die genannte Streitmacht beim Sprecher ist und ihn unterstützt.
theological_decisions: []
