lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: kehrte … zurück
  rationale: Mit εἰς Ἱερουσαλήμ bezeichnet das Verb die Rückkehr an einen Ort. „kehrte … zurück“ ist im Deutschen natürlich und gibt die Bewegungsrichtung klar wieder.
- source_word: Ἰωνάθαν
  choice: Jonatan
  rationale: Im modernen deutschen Bibelgebrauch übliche Form des Personennamens.
- source_word: εἰς Ἱερουσαλήμ
  choice: nach Jerusalem
  rationale: Die Präposition εἰς bezeichnet hier das Ziel der Bewegung; vor einem Städtenamen ist „nach“ die natürliche deutsche Entsprechung.
- source_word: μετʼ εἰρήνης
  choice: in Frieden
  rationale: μετά mit dem Genitiv bedeutet wörtlich „mit“. Die idiomatische deutsche Wendung „in Frieden“ vermittelt hier den Zustand einer sicheren, ungestörten Rückkehr, ohne den Sinn zu erweitern.
- source_word: εὐφροσύνης
  choice: Freude
  rationale: Das Substantiv bezeichnet Freude oder Frohsinn. „Freude“ ist gegenwärtig, würdig und bildet mit „Frieden“ ein natürliches Paar.
theological_decisions: []
translation_notes:
  register: Kurzer, flüssiger Erzählsatz in modernem Standarddeutsch. Die koordinierte Verbindung von Frieden und Freude bleibt erhalten; die deutsche Wortstellung setzt das Ziel vor die Rückkehrformel, um einen natürlichen Satzrhythmus zu schaffen.
