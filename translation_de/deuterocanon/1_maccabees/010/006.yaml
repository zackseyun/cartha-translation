lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ἐξουσίαν
  choice: gab ihm die Vollmacht
  rationale: ἐξουσία bezeichnet hier eine offiziell verliehene Befugnis. „Vollmacht“ gibt diesen politischen Rechtsakt präzise und idiomatisch wieder.
- source_word: συναγαγεῖν δυνάμεις
  choice: Truppen aufzustellen
  rationale: δυνάμεις meint im Zusammenhang militärische Kräfte; „Truppen aufstellen“ entspricht dem Sinn von sammeln beziehungsweise mobilisieren und klingt im Deutschen natürlich.
- source_word: κατασκευάζειν ὅπλα
  choice: Waffen herzustellen
  rationale: κατασκευάζειν kann vorbereiten, ausrüsten oder herstellen bedeuten. Mit ὅπλα bezeichnet es hier am klarsten die Herstellung beziehungsweise Bereitstellung von Waffen.
- source_word: εἶναι αὐτῷ σύμμαχον αὐτόν
  choice: sein Verbündeter zu sein
  rationale: Die komprimierte Infinitivkonstruktion bezeichnet Jonatan als Verbündeten des Vollmachtgebers. Die deutsche Form wahrt die Pronomenbezüge des Zusammenhangs, ohne zusätzliche Deutung einzutragen.
- source_word: τὰ ὅμηρα
  choice: die Geiseln
  rationale: ὅμηρα sind hier Personen, die als Sicherheit festgehalten werden; „Geiseln“ ist die historisch und sprachlich passende Wiedergabe.
- source_word: ἡ ἄκρα
  choice: die Zitadelle
  rationale: ἄκρα bezeichnet eine befestigte Burganlage und kann in 1 Makkabäer speziell die Akra in Jerusalem meinen. „Zitadelle“ übersetzt den Ausdruck verständlich; die mögliche Eigenbezeichnung wird in der Fußnote erhalten.
- source_word: εἶπεν παραδοῦναι αὐτῷ
  choice: ordnete er an, ihm … zu übergeben
  rationale: Der Infinitiv nach εἶπεν hat hier anordnenden Charakter. „Ordnete … an“ macht diese Direktive in natürlichem Deutsch deutlich, während „ihm“ den griechischen Dativ bewahrt.
