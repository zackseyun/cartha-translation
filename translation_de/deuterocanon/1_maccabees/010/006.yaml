  text: And he gave him authority to gather forces[a], and to make weapons, and for him to be his ally, and he said that the hostages in the citadel should be handed over to him.
translation:
  language: de
  text: Und er gab ihm die Vollmacht, Truppen aufzustellen, Waffen herzustellen und ihm als Verbündeter zur Seite zu stehen. Auch ordnete er an, ihm die Geiseln in der Zitadelle[a] zu übergeben.
