  text: And Jonathan realized that there was an ambush behind him.
translation:
  language: de
  text: Und Jonatan erkannte, dass sich hinter ihm ein Hinterhalt befand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: erkannte
  rationale: Der Aorist von γινώσκω bezeichnet hier, dass Jonatan in der Kampfsituation etwas wahrnimmt und sich dessen bewusst wird. „Erkannte“ gibt diesen punktuellen Erkenntnisvorgang natürlich und quellennah wieder.
- source_word: ἔνεδρον
  choice: ein Hinterhalt
  rationale: ἔνεδρον bezeichnet einen Hinterhalt beziehungsweise eine Gruppe, die im Hinterhalt liegt. „Ein Hinterhalt“ bewahrt die kollektive Offenheit des griechischen Ausdrucks und ist im modernen Deutschen idiomatisch.
- source_word: κατόπισθεν αὐτοῦ
  choice: hinter ihm
  rationale: Die Wendung bezeichnet die Stellung in Jonatans Rücken. „Hinter ihm“ ist die direkte und allgemein verständliche Wiedergabe.
- source_word: καὶ
  choice: Und
  rationale: Die Konjunktion verbindet den Satz schlicht mit dem vorangehenden Erzählverlauf, ohne eine zusätzliche zeitliche oder kausale Deutung einzutragen.
- source_word: ἐστιν
  choice: sich … befand
  rationale: Das Präsens von εἰμί stellt das Vorhandensein beziehungsweise die Lage des Hinterhalts fest. Im deutschen Vergangenheitsnarrativ gibt „befand“ dies natürlich wieder.
