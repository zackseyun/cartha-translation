  naturalness: Der Entwurf ist insgesamt klar und modern. Die Verbindung „Tage der Abgabenfreiheit und Befreiung“ wirkt jedoch semantisch doppelt und stilistisch weniger präzise. „Tage der Abgabenfreiheit und des Erlasses“ ist im Verwaltungszusammenhang idiomatischer und wahrt die offene Bedeutung von ἀφέσεως.
