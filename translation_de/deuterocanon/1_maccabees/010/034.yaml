base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/034.yaml
  text: And let all the festivals and the Sabbaths and the new moons and the appointed days[a], and the three days before a festival and the three days after a festival, all be days of tax exemption and release for all the Jews who are in all my kingdom.
translation:
  language: de
  text: Und alle Feste, Sabbate, Neumondtage und festgesetzten Tage sowie die drei Tage vor einem Fest und die drei Tage nach einem Fest sollen für alle Juden, die sich überall in meinem Königreich befinden, Tage der Abgabenfreiheit und des Erlasses[a] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Befreiung“, „Freilassung“ oder „Begnadigung“. Das griechische Wort kann das Loslassen oder den Erlass einer Verpflichtung bezeichnen und meint hier wahrscheinlich eine behördlich gewährte Entlastung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑορταὶ
  choice: Feste
  rationale: Bezeichnet festliche, insbesondere religiöse Feiertage; »Feste« ist im Deutschen natürlich und würdig.
- source_word: σάββατα
  choice: Sabbate
  rationale: Gibt den griechischen Plural direkt wieder und bewahrt den jüdischen kalendarischen Bezug.
- source_word: νουμηνίαι
  choice: Neumondtage
  rationale: Bezeichnet die am Neumond begangenen Tage; »Neumondtage« macht den kalendarischen Charakter im Deutschen deutlich.
- source_word: ἡμέραι ἀποδεδειγμέναι
  choice: festgesetzte Tage
  rationale: Das Partizip bezeichnet offiziell bestimmte oder ausgewiesene Tage; »festgesetzt« wahrt diesen Sinn ohne zusätzliche Deutung.
- source_word: ἔστωσαν
  choice: sollen ... sein
  rationale: Gibt den gebietenden Charakter des königlichen Erlasses in natürlichem deutschem Verwaltungsstil wieder.
- source_word: ἀτελείας
  choice: Abgabenfreiheit
  rationale: Das Wort bezeichnet die Befreiung von Steuern, Zöllen oder sonstigen Abgaben; »Abgabenfreiheit« ist etwas umfassender als bloße Steuerfreiheit und passt zum administrativen Kontext.
- source_word: ἀφέσεως
  choice: Befreiung
  rationale: Im Zusammenhang des königlichen Erlasses ist eine Entbindung von Verpflichtungen oder Lasten gemeint. Die offene Bezeichnung »Befreiung« vermeidet eine unangebrachte Verengung auf Sündenvergebung.
- source_word: πᾶσι τοῖς Ἰουδαίοις
  choice: für alle Juden
  rationale: Der Dativ bezeichnet die Begünstigten der angeordneten Freistellung.
- source_word: τοῖς οὖσιν ἐν πάσῃ τῇ βασιλείᾳ μου
  choice: in meinem ganzen Königreich
  rationale: Gibt den räumlichen Geltungsbereich knapp und idiomatisch wieder; die Zugehörigkeit zu »alle Juden« bleibt eindeutig.
theological_decisions:
- issue: Bedeutung von ἀφέσεως im königlich-administrativen Zusammenhang
  choice: Befreiung
  alternative: Erlass oder Begnadigung
  rationale: Der Vers behandelt staatlich gewährte Vorrechte an heiligen Tagen, nicht ausdrücklich die Vergebung von Sünden. Zugleich bleibt die Breite des griechischen Ausdrucks durch eine Fußnote sichtbar.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit dem formellen Ton eines königlichen Erlasses. Die Aufzählung bleibt eng am griechischen Satzbau, wird aber durch Kommas und »sowie« lesbar gegliedert. Der Fußnotenmarker steht bei »Befreiung«, da sich die lexikalische Alternative auf ἀφέσεως bezieht.
