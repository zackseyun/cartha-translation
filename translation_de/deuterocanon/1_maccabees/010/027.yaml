  text: We rejoiced[a]. And now continue still to keep faith with us,
translation:
  language: de
  text: Wir haben uns gefreut. Und nun bleibt auch weiterhin dabei, uns die Treue zu halten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder knapper: „Und nun haltet uns auch weiterhin die Treue.“'
    reason: Die alternative Fassung gibt die Aufforderung idiomatischer wieder, bildet das in μένω liegende „Bleiben/Beharren“ jedoch weniger ausdrücklich ab.
lexical_decisions:
- source_word: ἐχάρημεν
  choice: Wir haben uns gefreut
  rationale: Der Aorist von χαίρω bezeichnet hier eine in der Vergangenheit eingetretene Freude. Das deutsche Perfekt klingt in heutiger brieflicher Rede natürlich und bewahrt den schlichten Aussagegehalt.
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Die Verbindung führt von der vorausgehenden Feststellung zur gegenwärtigen Aufforderung über und entspricht dem Aufbau des Schreibens.
- source_word: ἐμείνατε
  choice: bleibt … dabei
  rationale: Die Form wird im Zusammenhang als Aufforderung verstanden. μένω bezeichnet ein Verbleiben oder Beharren; „bleibt dabei“ verbindet diese Bedeutung natürlich mit dem folgenden Infinitiv.
- source_word: ἔτι
  choice: auch weiterhin
  rationale: Das Adverb hebt die Fortdauer eines bereits bestehenden loyalen Verhaltens hervor.
- source_word: τοῦ συντηρῆσαι
  choice: zu halten
  rationale: Der artikulierte Aoristinfinitiv beschreibt, worin das geforderte Beharren besteht. Mit „Treue“ ist „die Treue halten“ im Deutschen idiomatisch; die Grundbedeutung des Bewahrens bleibt dabei erhalten.
- source_word: πρὸς ἡμᾶς
  choice: uns
  rationale: In Verbindung mit „die Treue halten“ wird die durch πρός bezeichnete Ausrichtung im Deutschen idiomatisch durch den Dativ ausgedrückt.
- source_word: πίστιν
  choice: Treue
  rationale: Im diplomatisch-politischen Zusammenhang bezeichnet πίστις verlässliche Loyalität gegenüber einem Bündnispartner, nicht primär religiösen Glauben. „Treue“ gibt diesen Sinn im Deutschen präzise und würdig wieder.
theological_decisions:
- issue: Bedeutung von πίστις im politischen Bündniskontext
  choice: Treue
  alternative: Glaube; Verlässlichkeit; Loyalität
  rationale: Der unmittelbare Zusammenhang handelt von fortdauernder Bindung an die königliche Seite. Daher ist „Treue“ die kontextuell tragfähige Wiedergabe. „Glaube“ wäre zwar eine häufige Entsprechung von πίστις, würde hier im modernen Deutschen jedoch leicht eine religiöse Bedeutung nahelegen, die der Satz nicht verlangt.
translation_notes:
  register: Moderne, würdige Standardsprache im Ton eines königlichen Schreibens. „Bleibt dabei“ bewahrt den Gedanken des Beharrens, während „uns die Treue halten“ den politischen Sinn von πίστις natürlich ausdrückt.
