base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/040.yaml
  text: And I also give, year by year, fifteen thousand shekels of silver from the king’s account, from the places that belong to him.
translation:
  language: de
  text: Und auch ich gebe Jahr für Jahr fünfzehntausend Schekel Silber aus den Einkünften des Königs[a], aus den ihm gehörenden Orten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus der Rechnung/Abrechnung des Königs“; die Wendung kann hier auch die königlichen Einnahmen oder die königliche Kasse meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlusswendung bezeichnet möglicherweise Bezirke oder Orte, aus deren Einnahmen das Geld genommen wird; wörtlich: „aus den Orten, die dazugehören/ihm gehören“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Und auch ich
  rationale: Die Krasis aus καί und ἐγώ verbindet den Satz mit dem Vorhergehenden und hebt zugleich den Sprecher hervor.
- source_word: δίδωμι
  choice: gebe
  rationale: Die Grundbedeutung „geben“ wahrt, anders als „zahlen“ oder „gewähren“, die Offenheit hinsichtlich der genauen Art der königlichen Zuwendung.
- source_word: κατʼ ἐνιαυτόν
  choice: Jahr für Jahr
  rationale: Die idiomatische Wendung bezeichnet eine wiederkehrende jährliche Leistung; „Jahr für Jahr“ gibt den distributiven Sinn natürlich wieder.
- source_word: δέκα πέντε χιλιάδας σίκλων ἀργυρίου
  choice: fünfzehntausend Schekel Silber
  rationale: „Schekel“ bewahrt das antike Gewichts- beziehungsweise Geldmaß; „Silber“ gibt ἀργυρίου ausdrücklich wieder.
- source_word: ἀπὸ τοῦ λόγου τοῦ βασιλέως
  choice: aus den Einkünften des Königs
  rationale: λόγος kann „Rechnung“, „Abrechnung“ oder im fiskalischen Zusammenhang den verbuchten Ertrag bezeichnen. „Einkünfte“ ist im Kontext einer jährlich aus bestimmten Gebieten aufzubringenden Geldleistung verständlich, ohne eine moderne institutionelle „Staatskasse“ vorauszusetzen.
- source_word: ἀπὸ τῶν τόπων τῶν ἀνηκόντων
  choice: und zwar aus den ihm gehörenden Gebieten
  rationale: τόποι bezeichnet hier wahrscheinlich örtliche Verwaltungs- oder Einnahmegebiete. Das im Griechischen unausgesprochene Bezugswort zu ἀνηκόντων wird aus dem Zusammenhang als „ihm“, also dem König, ergänzt; „und zwar“ verdeutlicht, dass die zweite Herkunftsangabe die erste näher bestimmt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht administrativem Klang. Die alte Maßeinheit „Schekel“ bleibt erhalten. Beide Fußnotenmarker stehen unmittelbar bei den mehrdeutigen fiskalischen und geografischen Wendungen.
