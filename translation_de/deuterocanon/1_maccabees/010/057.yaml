  yaml_path: translation/deuterocanon/1_maccabees/010/057.yaml
  text: And Ptolemy went out from Egypt[a], he and Cleopatra his daughter, and came to Ptolemais in the one hundred sixty-second year.
translation:
  language: de
  text: Ptolemäus selbst brach mit seiner Tochter Kleopatra aus Ägypten auf und kam im 162. Jahr[a] nach Ptolemaïs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: im Jahr 162 der seleukidischen Zeitrechnung.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zog … aus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet hier das Aufbrechen aus Ägypten. „zog … aus“ bewahrt die Ausgangsvorstellung und passt zu einer Reiseerzählung.
- source_word: αὐτὸς καὶ Κλεοπάτρα ἡ θυγάτηρ αὐτοῦ
  choice: er selbst und seine Tochter Kleopatra
  rationale: αὐτός hebt Ptolemäus als persönlich Mitreisenden hervor; die koordinierte Formulierung und das Verwandtschaftsverhältnis bleiben ausdrücklich erhalten.
- source_word: ἦλθεν
  choice: kam
  rationale: ἔρχομαι wird gemäß der erzählerischen Perspektive direkt mit „kam“ wiedergegeben.
- source_word: εἰς Πτολεμαΐδα
  choice: nach Ptolemaïs
  rationale: Bei Städtenamen wird εἰς im Deutschen idiomatisch mit „nach“ wiedergegeben.
- source_word: ἔτους δευτέρου καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: im 162. Jahr
  rationale: Die additive griechische Ordinalformel bezeichnet das hundertsechzigzweite Jahr; die Ziffernform ist im modernen Deutschen klar und knapp.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die leichte Emphase von αὐτός wird mit „er selbst“ bewahrt; Eigennamen folgen den im Deutschen gebräuchlichen biblisch-historischen Formen.
