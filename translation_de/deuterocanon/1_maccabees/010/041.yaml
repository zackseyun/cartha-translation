  yaml_path: translation/deuterocanon/1_maccabees/010/041.yaml
  text: And all the surplus that they did not pay from the revenues[a], as in the former years[b], from now on they shall give for the works of the house.
translation:
  language: de
  text: Und den ganzen Überschuss[a], den sie in den früheren Jahren nicht aus den Mitteln abgeführt haben, sollen sie von nun an für die Arbeiten des Hauses[b] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den ganzen Rest«; gemeint ist, was über den Bedarf hinaus übrig bleibt.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Tempel; »Haus« gibt den griechischen Ausdruck wörtlich wieder.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶν τὸ πλεονάζον
  choice: den ganzen Überschuss
  rationale: Die substantivierte Form bezeichnet das, was über den gewöhnlichen Bedarf hinaus übrig bleibt. „Überschuss“ passt zum administrativ-finanziellen Zusammenhang, ohne die Art der Mittel näher festzulegen.
- source_word: ἀπέδωσαν
  choice: abgeführt haben
  rationale: Im fiskalischen Zusammenhang bezeichnet das Verb die pflichtgemäße Weitergabe oder Ablieferung von Geldern. „Abführen“ ist im Deutschen dafür natürlicher und genauer als das allgemeinere „geben“.
- source_word: ἀπὸ τῶν χρειῶν
  choice: aus den Mitteln
  rationale: χρεία kann Bedarf, Aufwendungen oder verfügbare Ressourcen bezeichnen. „Mittel“ bewahrt die sachliche Weite der schwierigen Wendung und vermeidet die nicht eindeutig belegte Festlegung auf „Einnahmen“.
- source_word: ἐν τοῖς πρώτοις ἔτεσιν
  choice: in den früheren Jahren
  rationale: πρῶτος verweist hier im Vergleich mit der neuen Regelung auf vorausliegende Jahre; „früheren“ ist im Deutschen idiomatischer als das möglicherweise missverständliche „ersten“.
- source_word: τὰ ἔργα
  choice: die Arbeiten
  rationale: Der Plural bezeichnet die am Heiligtum auszuführenden Arbeiten oder Vorhaben. „Arbeiten“ wahrt den Plural, ohne unbelegt auf Bau oder Reparaturen einzuengen.
- source_word: τοῦ οἴκου
  choice: am Haus
  rationale: „Haus“ gibt die griechische Bezeichnung wörtlich wieder; im Kontext ist damit der Tempel gemeint. Die Verbindung „Arbeiten am Haus“ ist natürliches Deutsch.
theological_decisions:
- issue: Bezeichnung des Tempels als „Haus“
  choice: Haus mit erläuternder Fußnote
  alternative: Tempel im Haupttext
  rationale: Die traditionelle, ehrerbietige Bezeichnung des Heiligtums als „Haus“ bleibt erhalten, während die Fußnote den historischen Bezug eindeutig macht.
translation_notes:
  register: Modernes, würdiges Verwaltungsdeutsch. Die schwer bestimmbare Wendung ἀπὸ τῶν χρειῶν wird bewusst mit dem offenen Ausdruck „aus den Mitteln“ wiedergegeben. Die Fußnotenmarker wurden den tatsächlich erläuterten Ausdrücken zugeordnet.
