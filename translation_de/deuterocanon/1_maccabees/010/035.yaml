  verdict: approve
  source_fidelity: Die Übersetzung gibt die Satzglieder und den rechtlich-schützenden Charakter des griechischen Erlasses zuverlässig wieder. „Soll befugt sein“ bildet οὐχ ἕξει ἐξουσίαν in einem passenden normativen Erlassstil ab. „Gegen einen von ihnen vorzugehen“ ist für das in diesem Kontext weit gefasste πρᾶξαι eine sachgerechte, nicht übermäßig spezifizierende Wiedergabe; „belästigen“ trifft παρενοχλεῖν. „In irgendeiner Angelegenheit“ entspricht περὶ παντὸς πράγματος umfassend.
  naturalness: Der Satz ist klares, modernes Standarddeutsch mit angemessen würdigem juristisch-administrativem Register. Die Koordination „gegen einen von ihnen vorzugehen oder ihn ... zu belästigen“ ist idiomatisch und die Pronomenreferenz eindeutig.
  terminology: „Befugt“, „vorgehen“, „belästigen“ und „Angelegenheit“ sind im gegebenen Erlasskontext treffend. Es liegen keine Namen, theologischen Fachbegriffe oder Fußnotenanker vor, die zu prüfen oder anzupassen wären.
