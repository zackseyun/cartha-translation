  yaml_path: translation/deuterocanon/1_maccabees/010/035.yaml
  text: And no one will have authority to act against or harass any of them in any matter.
translation:
  language: de
  text: Und niemand soll befugt sein, gegen einen von ihnen vorzugehen oder ihn in irgendeiner Angelegenheit zu belästigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ ἕξει ἐξουσίαν
  choice: soll befugt sein
  rationale: Die Wendung bezeichnet im Zusammenhang des königlichen Erlasses rechtliche Befugnis. Das deutsche „soll ... befugt sein“ gibt zugleich den zukunftsbezogenen Wortlaut und die normative Kraft der Bestimmung natürlich wieder.
- source_word: οὐδεὶς
  choice: niemand
  rationale: Direkte und idiomatische Wiedergabe der uneingeschränkten Verneinung.
- source_word: πρᾶξαι
  choice: gegen ... vorzugehen
  rationale: πράσσω ist für sich genommen weit gefasst, bezeichnet hier aber zusammen mit παρενοχλεῖν und einem persönlichen Objekt ein belastendes Tätigwerden gegen die geschützten Personen. „Vorgehen“ bewahrt den rechtlich-administrativen Ton, ohne eine bestimmte Maßnahme festzulegen.
- source_word: παρενοχλεῖν
  choice: zu belästigen
  rationale: Das Verb bezeichnet störendes, bedrängendes oder schikanierendes Eingreifen. „Belästigen“ ist verständlich und breit genug, ohne die Intensität unnötig zu erhöhen.
- source_word: τινα αὐτῶν
  choice: einen von ihnen ... ihn
  rationale: Die Formulierung schützt jedes einzelne Mitglied der zuvor genannten Gruppe. Die Wiederaufnahme durch „ihn“ ist im Deutschen für die beiden koordinierten Infinitive klar und natürlich.
- source_word: περὶ παντὸς πράγματος
  choice: in irgendeiner Angelegenheit
  rationale: Die Wendung umfasst jede Sache, Angelegenheit oder Rechtssache. „In irgendeiner Angelegenheit“ erhält diesen umfassenden Geltungsbereich.
