  yaml_path: translation/deuterocanon/1_maccabees/010/015.yaml
  text: And King Alexander heard the promises that Demetrius had sent to Jonathan, and they told him about the wars and the brave deeds that he and his brothers had done, and the hardships they had endured.
translation:
  language: de
  text: König Alexander hörte von den Versprechen, die Demetrius Jonatan gesandt hatte. Man berichtete ihm auch von den Kriegen, von den mutigen Taten, die Jonatan und seine Brüder vollbracht hatten, und von den Strapazen, die sie erduldet hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: Versprechen
  rationale: Das Wort bezeichnet hier politische Zusagen oder verbindliche Zusicherungen des Demetrius an Jonatan. „Versprechen“ ist im modernen Deutsch natürlich und wahrt den Aussageumfang.
- source_word: ἀπέστειλεν
  choice: hatte übermitteln lassen
  rationale: Wörtlich bedeutet das Verb „sandte“. Da die Versprechen als Botschaft an Jonatan gelangten, gibt „übermitteln lassen“ den politischen Kommunikationsvorgang idiomatisch wieder, ohne einen persönlichen Versand durch Demetrius vorauszusetzen.
- source_word: διηγήσαντο
  choice: berichtete man
  rationale: Das Verb bezeichnet ein ausführliches Erzählen oder Darlegen. Die ungenannten Handelnden werden im Deutschen natürlich mit dem unpersönlichen „man“ wiedergegeben.
- source_word: πολέμους
  choice: Kriegen
  rationale: Der Plural entspricht dem griechischen Wortlaut und ist weiter gefasst als „Schlachten“ oder „Feldzüge“.
- source_word: ἀνδραγαθίας
  choice: mutigen Taten
  rationale: Der Ausdruck bezeichnet konkrete Beweise von Tapferkeit. „Mutige Taten“ ist verständlich, würdig und weniger stilistisch überhöht als „Heldentaten“.
- source_word: κόπους
  choice: Mühen
  rationale: Das Wort umfasst Anstrengungen, Strapazen und belastende Erfahrungen. „Mühen“ bewahrt diese Breite, ohne ausschließlich Leiden oder Not zu bezeichnen.
- source_word: ἔσχοσαν
  choice: auf sich genommen hatten
  rationale: In Verbindung mit κόπους bezeichnet das Verb das Erfahren beziehungsweise Tragen von Mühen. Die deutsche Wendung gibt dieses aktive Erdulden natürlich wieder.
- source_word: ἀδελφοὶ
  choice: Brüder
  rationale: Gemeint sind Jonatans leibliche Brüder aus der makkabäischen Familie; daher ist die konkrete Wiedergabe „Brüder“ sachgerecht.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die lange griechische Satzperiode wurde zur besseren Lesbarkeit in zwei Sätze gegliedert. Das Pronomen αὐτός wurde durch „Jonatan“ verdeutlicht, da ein deutsches „er“ nach der Nennung mehrerer männlicher Personen missverständlich wäre.
