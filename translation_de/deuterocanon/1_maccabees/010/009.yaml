  text: And those from the citadel handed over the hostages to Jonathan[a], and he returned them to their parents.
translation:
  language: de
  text: Und die Leute aus der Zitadelle[a] übergaben Jonatan die Geiseln, und er gab sie ihren Eltern zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet die befestigte Zitadelle, die traditionell „Akra“ genannt wird.
    reason: cultural_note
lexical_decisions:
- source_word: παρέδωκαν
  choice: übergaben
  rationale: Das Verb bezeichnet hier die Übergabe von Personen; „übergaben“ ist im Deutschen natürlich und wahrt den sachlichen Erzählton.
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: die Leute aus der Zitadelle
  rationale: Die Wendung bezeichnet die nicht näher bestimmte Personengruppe aus der befestigten Zitadelle. „Leute“ vermeidet eine unnötige Festlegung auf Soldaten oder eine ausdrücklich männliche Gruppe.
- source_word: Ἰωναθὰν
  choice: Jonatan
  rationale: Gebräuchliche moderne deutsche Namensform.
- source_word: τὰ ὅμηρα
  choice: die Geiseln
  rationale: ὅμηρα bezeichnet hier als Sicherheit festgehaltene Menschen; der folgende Satzteil bestätigt dies durch ihre Rückgabe an die Eltern.
- source_word: ἀπέδωκαν
  choice: gab … zurück
  rationale: Das Verb bedeutet, etwas oder jemanden zurückzugeben. Die idiomatische deutsche Verbklammer gibt den Vorgang klar wieder.
- source_word: τοῖς γονεῦσιν αὐτῶν
  choice: ihren Eltern
  rationale: γονεῖς bedeutet „Eltern“; eine Wiedergabe mit „Familien“ wäre weiter als der griechische Ausdruck.
