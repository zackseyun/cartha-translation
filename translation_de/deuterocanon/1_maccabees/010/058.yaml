base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/058.yaml
  text: And King Alexander met him and gave him Cleopatra his daughter[a], and he held her wedding in Ptolemais, as kings do[b], with great splendor.
translation:
  language: de
  text: Und König Alexander kam ihm entgegen und gab ihm seine Tochter Kleopatra zur Frau. Ihre Hochzeit feierte er in Ptolemaïs nach Art der Könige[a] mit großer Pracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie es bei Königen üblich ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήντησεν
  choice: kam ihm entgegen
  rationale: Das Verb bezeichnet gewöhnlich ein Begegnen beziehungsweise Entgegengehen. „Kam ihm entgegen“ gibt sowohl die Begegnung als auch die im griechischen Verb mögliche Bewegung natürlich wieder.
- source_word: ἐξέδοτο αὐτῷ Κλεοπάτραν τὴν θυγατέρα αὐτοῦ
  choice: gab ihm seine Tochter Kleopatra zur Frau
  rationale: ἐκδίδωμι hat in diesem Heiratszusammenhang ausdrücklich den Sinn, eine Tochter einem Mann zur Ehe zu geben. Die deutsche Formulierung macht diesen Sinn klar und vermeidet das missverständliche bloße „gab“.
- source_word: ἐποίησεν τὸν γάμον αὐτῆς
  choice: Ihre Hochzeit feierte er
  rationale: ποιέω mit γάμος bezeichnet das Ausrichten oder Feiern einer Hochzeit. „Die Hochzeit feiern“ ist gegenwärtiges, würdevolles Deutsch und hält den Ereignischarakter fest.
- source_word: ἐν Πτολεμαΐδι
  choice: in Ptolemaïs
  rationale: Der gebräuchliche deutsche Name der antiken Stadt wird mit Trema geschrieben, damit die getrennte Aussprache der Vokale erkennbar bleibt.
- source_word: καθὼς οἱ βασιλεῖς
  choice: nach Art der Könige
  rationale: Die knappe Vergleichsformel beschreibt die für Könige typische Weise. Diese Wiedergabe bewahrt die leichte Offenheit zwischen königlicher Sitte und königlichem Stil.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: mit großer Pracht
  rationale: δόξα bezeichnet hier die öffentlich sichtbare Herrlichkeit, Ehre und Festlichkeit der königlichen Hochzeit, nicht spezifisch göttliche Herrlichkeit. „Pracht“ trifft den zeremoniellen Zusammenhang.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Heiratsbedeutung von ἐξέδοτο wird im Haupttext ausdrücklich gemacht; die knappe und leicht mehrdeutige Vergleichsformel καθὼς οἱ βασιλεῖς wird bewahrt und in der Fußnote alternativ erläutert.
