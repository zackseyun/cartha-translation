lexical_decisions:
- source_word: ἐστερέωσεν πόλεμον σφόδρα
  choice: der Kampf tobte heftig
  rationale: Die griechische Wendung bezeichnet hier die starke Zuspitzung bzw. das heftige Andauern des Kampfes. Die natürliche deutsche Formulierung gibt die Intensität wieder, ohne den ungebräuchlichen griechischen Ausdruck wörtlich nachzubilden.
- source_word: ἕως ἔδυ ὁ ἥλιος
  choice: bis die Sonne unterging
  rationale: Direkte und idiomatische Wiedergabe der zeitlichen Angabe.
- source_word: ἔπεσεν
  choice: fiel
  rationale: Bewahrt die knappe militärische Ausdrucksweise des Griechischen und lässt im Kontext erkennen, dass Demetrius im Kampf ums Leben kam.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: an jenem Tag
  rationale: Formnahe und natürliche Wiedergabe der griechischen Zeitangabe.
