base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/030.yaml
  text: And instead of the third of the seed-sowing[a], and instead of the half of the fruit of the trees that falls to me to receive, I release it from this day and onward, from being taken from the land of Judah and from the three districts added to it from Samaria and Galilee[c][b], from this day and for all time.
translation:
  language: de
  text: Und auf das Drittel der Aussaat[a] und die Hälfte der Baumfrüchte, die mir als Abgabe zustehen,[b] verzichte ich von heute an. Sie sollen im Land Juda und in den drei Bezirken[c], die ihm aus Samaria und Galiläa angegliedert wurden, nicht mehr erhoben werden – von diesem Tag an und für alle Zeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der königliche Anteil am Ertrag der Aussaat, also ein Drittel der Feldfrüchte.
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: der Anteil beziehungsweise die Steuerabgabe, die sonst dem König zustand.'
    reason: cultural_note
  - marker: c
    text: Das griechische Wort bezeichnet hier Verwaltungsbezirke; fachsprachlich werden sie auch „Nomen“ genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ τρίτου τῆς σπορᾶς
  choice: auf das Drittel der Aussaat … verzichte ich
  rationale: Die Konstruktion bezeichnet im fiskalischen Zusammenhang den bisher beanspruchten Anteil, den der König nun aufgibt. „Aussaat“ bewahrt die konkrete griechische Ausdrucksweise; eine Fußnote erläutert den gemeinten Ernteanteil.
- source_word: τοῦ ἡμίσους τοῦ καρποῦ τοῦ ξυλίνου
  choice: die Hälfte der Baumfrüchte
  rationale: Gibt den Ertrag von Bäumen prägnant und natürlich wieder, ohne das missverständliche wörtliche „hölzerne Frucht“.
- source_word: τοῦ ἐπιβάλλοντός μοι λαβεῖν
  choice: die mir als Abgabe zustehen
  rationale: Im fiskalischen Kontext geht es um den Anteil, den der König beanspruchen beziehungsweise einziehen darf. „Als Abgabe zustehen“ macht diesen Bezug verständlich, ohne die Art der Steuer näher festzulegen.
- source_word: ἀφίημι
  choice: verzichte ich
  rationale: Bezeichnet hier das Aufgeben eines königlichen Einnahmeanspruchs. „Verzichten“ ist in modernem Deutsch zugänglicher als „erlassen“, dessen Objekt sonst eher die Abgabe oder Schuld als der Anteil wäre.
- source_word: τοῦ λαβεῖν
  choice: sollen … nicht mehr erhoben werden
  rationale: Der verneinte Erhebungssinn wird im Deutschen als Folge des Verzichts klar ausgedrückt; „erheben“ ist der übliche Ausdruck für das Einziehen von Abgaben.
- source_word: γῆς Ἰούδα
  choice: Land Juda
  rationale: Nahe und geläufige Wiedergabe der geografischen Bezeichnung, ohne sie interpretierend durch „Judäa“ zu ersetzen.
- source_word: τῶν τριῶν νομῶν
  choice: die drei Bezirke
  rationale: νομοί sind hier Verwaltungsbezirke. „Bezirke“ ist verständlich und vermeidet den fachsprachlichen Fremdausdruck „Nomen“.
- source_word: τῶν προστιθεμένων αὐτῇ
  choice: die ihm … angegliedert wurden
  rationale: Gibt die administrative Zuordnung der drei Gebiete zu Juda natürlich wieder.
- source_word: ἀπὸ τῆς Σαμαρίτιδος καὶ Γαλιλαίας
  choice: aus Samaria und Galiläa
  rationale: Bezeichnet die Regionen, aus denen die drei Bezirke Juda angegliedert wurden.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: für alle Zeit
  rationale: Bewahrt den ausdrücklichen, dauerhaften Geltungsanspruch des Erlasses in würdigem, aktuellem Deutsch.
