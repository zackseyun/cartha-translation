  to: Einige von ihnen sollen in den großen Festungen des Königs eingesetzt werden. Aus ihnen sollen einige eingesetzt werden, die mit den Belangen des Königreichs[a] betraut sind und zuverlässig sind. Auch ihre Vorgesetzten und die Herrscher sollen aus ihren Reihen stammen. Sie sollen nach ihren eigenen Gesetzen leben[b], wie es der König auch im Land Juda angeordnet hat.
  rationale: Die Revision beseitigt die nicht im griechischen Text ausgedrückte Spezifizierung „Männer“, verdeutlicht die administrative Zuständigkeit bei ἐπὶ χρειῶν und ersetzt eine unidiomatische Formulierung durch modernes Standarddeutsch. Die knappe und nicht näher bestimmte Unterscheidung zwischen Vorgesetzten und Herrschern bleibt erhalten.
