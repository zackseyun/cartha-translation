base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/037.yaml
  text: And some of them shall be appointed in the king’s great strongholds[a], and from among them some shall be appointed over the needs of the kingdom, being trustworthy; and let those over them and the rulers be from among them, and let them live by their own laws[b], just as the king commanded in the land of Judah.
translation:
  language: de
  text: Einige von ihnen sollen in den großen Festungen des Königs eingesetzt werden. Aus ihnen sollen einige eingesetzt werden, die mit den Belangen des Königreichs[a] betraut sind und zuverlässig sind. Auch ihre Vorgesetzten und die Herrscher sollen aus ihren Reihen stammen. Sie sollen nach ihren eigenen Gesetzen leben[b], wie es der König auch im Land Juda angeordnet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „über die Bedürfnisse des Königreichs“. Gemeint sein können allgemein dessen Aufgaben, Angelegenheiten oder Geschäfte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „nach ihren Gesetzen gehen“. Die griechische Wendung meint, das Leben nach diesen Gesetzen auszurichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασταθήσεται
  choice: sollen … eingesetzt werden
  rationale: Das Futur Passiv von καθίστημι bezeichnet hier die Einsetzung in einen militärischen oder administrativen Dienst. Die griechische Singularform wird ihrem kollektiven beziehungsweise unpersönlichen Sinn entsprechend im Deutschen pluralisch wiedergegeben.
- source_word: ὀχυρώμασιν τοῖς μεγάλοις
  choice: in den großen Festungen
  rationale: ὀχύρωμα bezeichnet einen befestigten militärischen Ort; „Festungen“ ist im Deutschen klar und sachlich, während „großen“ die nicht näher bestimmte Wertung des griechischen Adjektivs bewahrt.
- source_word: ἐπὶ χρειῶν τῆς βασιλείας
  choice: für die Belange des Königreichs
  rationale: χρεῖαι kann Bedürfnisse, Aufgaben, Geschäfte oder Angelegenheiten bezeichnen. „Belange“ passt zum administrativen Zusammenhang, ohne den Aufgabenbereich unnötig einzuengen.
- source_word: οὖσιν εἰς πίστιν
  choice: zuverlässige Männer
  rationale: Die Wendung beschreibt hier die Eignung für den königlichen Dienst aufgrund von Vertrauenswürdigkeit, nicht den theologischen Begriff des Glaubens. „Zuverlässig“ gibt die administrative Bedeutung natürlich wieder.
- source_word: οἱ ἐπʼ αὐτῶν
  choice: die über sie Gesetzten
  rationale: Die komprimierte griechische Wendung bezeichnet Personen, die über den zuvor Genannten stehen. Diese Wiedergabe bewahrt die relationale Aussage, ohne ein bestimmtes Amt hinzuzufügen.
- source_word: οἱ ἄρχοντες
  choice: die führenden Männer
  rationale: ἄρχοντες bezeichnet Personen mit Leitungs- oder Herrschaftsgewalt. „Führende Männer“ hält die Bezeichnung breit und unterscheidet sie von den unmittelbar zuvor genannten Vorgesetzten.
- source_word: πορευέσθωσαν τοῖς νόμοις αὐτῶν
  choice: Sie sollen nach ihren eigenen Gesetzen leben
  rationale: πορεύομαι wird mit den Gesetzen idiomatisch für die Lebensführung nach ihnen gebraucht. „Nach ihren eigenen Gesetzen leben“ ist natürliches modernes Deutsch und erhält den rechtlich-ethischen Sinn.
- source_word: καθὰ καὶ προσέταξεν
  choice: wie es … auch … angeordnet hat
  rationale: προστάσσω bezeichnet im königlichen Erlass ein verbindliches Anordnen. Die Formulierung gibt sowohl den Vergleich als auch das καί wieder.
- source_word: ἐν γῇ Ἰούδα
  choice: im Land Juda
  rationale: Diese Wiedergabe folgt der griechischen Formulierung wörtlicher als „in Judäa“ und lässt offen, ob Juda ethnisch, territorial oder administrativ verstanden wird.
theological_decisions:
- issue: Bedeutung der πίστις-Wortgruppe im administrativen Zusammenhang
  choice: zuverlässige Männer
  alternative: treue Männer
  rationale: εἰς πίστιν kennzeichnet hier Menschen als vertrauenswürdig für königliche Aufgaben. Eine Wiedergabe mit „Glauben“ würde einen theologischen Sinn eintragen, den der Zusammenhang nicht verlangt.
translation_notes:
  register: Moderner, würdiger Erlassstil. Die Wiederholung von „eingesetzt werden“ spiegelt die parallele Struktur des Griechischen. „Die über sie Gesetzten“ und „die führenden Männer“ bleiben als zwei unterscheidbare Gruppen erhalten; die Vorlage bestimmt ihre Ämter nicht genauer.
