base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/044.yaml
  text: And for the rebuilding and the renovation of the works of the sanctuary[b][a], the expense will be given by order of the king.
translation:
  language: de
  text: Auch für den Wiederaufbau und die Erneuerung der Bauarbeiten am Heiligtum[a] werden die Kosten auf Rechnung des Königs[b] bereitgestellt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „der heiligen Dinge“ oder „der heiligen Stätten“; gemeint ist hier der heilige Tempelbereich.
    reason: lexical_alternative
  - marker: b
    text: Oder „auf Anordnung des Königs“. Die griechische Wendung kann sich auf eine königliche Rechnung beziehungsweise Abrechnung oder auf einen Erlass des Königs beziehen; der finanzielle Zusammenhang spricht eher für „auf Rechnung des Königs“.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι
  choice: Wiederaufbau
  rationale: Der substantivierte Aoristinfinitiv bezeichnet das Bauvorhaben. Im Zusammenhang der Wiederherstellung des Tempels gibt „Wiederaufbau“ den Sinn genauer wieder als das allgemeinere „Bau“.
- source_word: ἐπικαινισθῆναι
  choice: Erneuerung
  rationale: Das Verb bezeichnet das erneute Instandsetzen oder Erneuern. „Erneuerung“ bewahrt die sachliche Bedeutung, ohne eine kultische Neuweihe vorauszusetzen.
- source_word: τὰ ἔργα
  choice: Anlagen
  rationale: Der Plural kann die Bauwerke beziehungsweise baulichen Anlagen des heiligen Bezirks bezeichnen. „Anlagen“ ist im Deutschen natürlich und lässt den Umfang offen.
- source_word: τῶν ἁγίων
  choice: des Heiligtums
  rationale: Der substantivierte Plural τὰ ἅγια bezeichnet in diesem Tempelkontext den heiligen Bereich beziehungsweise den Tempelkomplex.
- source_word: ἡ δαπάνη δοθήσεται
  choice: werden die Kosten … bereitgestellt
  rationale: Die singularische Kollektivangabe für den finanziellen Aufwand wird im Deutschen idiomatisch mit dem Plural „Kosten“ wiedergegeben; „bereitgestellt“ wahrt den passiven Finanzierungssinn.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: auf Rechnung des Königs
  rationale: λόγος kann im Verwaltungs- und Finanzgebrauch „Rechnung“ oder „Abrechnung“ bezeichnen. Die Formulierung passt zur Kostenzusage, ohne ausdrücklich eine nicht genannte Schatzkammer oder Einnahmequelle einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform wahrt den Anschlusscharakter des einleitenden καί („Auch“), während die griechischen substantivierten Infinitive als klare deutsche Nominalgruppen erscheinen. Die administrative Mehrdeutigkeit von λόγος wird in einer Fußnote offengehalten.
