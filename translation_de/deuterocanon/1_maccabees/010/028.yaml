  text: And we will repay you with good things for what you are doing with us.
translation:
  language: de
  text: Und wir werden euch für das, was ihr mit uns tut, Gutes vergelten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das, was ihr für uns tut“ oder „wie ihr an uns handelt“. Wörtlich steht im Griechischen „mit uns“; gemeint sein können Zusammenarbeit oder ein wohlwollendes Verhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποδώσομεν
  choice: wir werden … vergelten
  rationale: Das Futur Aktiv bezeichnet eine erwidernde Gegenleistung. „Vergelten“ bewahrt diesen wechselseitigen Sinn und ist in Verbindung mit „Gutes“ natürlich und würdevoll.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Empfänger der angekündigten Gegenleistung.
- source_word: ἀγαθὰ
  choice: Gutes
  rationale: Das substantivierte Neutrum Plural bezeichnet nicht näher bestimmte gute Gaben oder Wohltaten. Das deutsche Kollektiv „Gutes“ gibt diese Offenheit idiomatisch wieder, ohne sie auf konkrete Vorteile einzuengen.
- source_word: ἀνθʼ ὧν
  choice: für das, was
  rationale: Die Wendung bezeichnet den Grund beziehungsweise die Gegenleistung und wird im Deutschen knapp und natürlich mit „für das, was“ wiedergegeben.
- source_word: ποιεῖτε
  choice: ihr … tut
  rationale: Das griechische Präsens wird hier durch das natürliche deutsche Präsens wiedergegeben; es kann gegenwärtiges oder fortdauerndes Handeln bezeichnen.
- source_word: μεθʼ ἡμῶν
  choice: mit uns
  rationale: μετά mit Genitiv bedeutet grundsätzlich „mit“. Die wörtliche Wiedergabe bewahrt offen, ob Zusammenarbeit oder allgemein ein günstiges Verhalten gegenüber der Sprecherseite gemeint ist.
