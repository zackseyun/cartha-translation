base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/063.yaml
  text: And the king seated him with himself[a], and said to his officials, “Go out with him into the middle of the city, and proclaim that no one is to bring a complaint against him about any matter, and let no one trouble him for any reason.”
translation:
  language: de
  text: 'Und der König ließ ihn neben sich Platz nehmen und sagte zu seinen Amtsträgern: »Geht mit ihm hinaus in die Mitte der Stadt und ruft aus, dass niemand wegen irgendeiner Angelegenheit Klage gegen ihn erheben und niemand ihn aus irgendeinem Grund behelligen soll.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν αὐτὸν ὁ βασιλεὺς μετʼ αὑτοῦ
  choice: der König ließ ihn neben sich Platz nehmen
  rationale: 'Die Form von καθίζω ist kausativ: Der König weist ihm einen Sitzplatz zu. »Neben sich« macht die ehrende Nähe zum König im Deutschen natürlich deutlich.'
- source_word: τοῖς ἄρχουσιν
  choice: zu seinen Amtsträgern
  rationale: ἄρχοντες bezeichnet hier Personen mit Amtsgewalt am königlichen Hof; »Amtsträger« bleibt hinsichtlich ihrer genauen zivilen oder militärischen Funktion angemessen offen.
- source_word: Ἐξέλθατε μετʼ αὐτοῦ εἰς μέσον τῆς πόλεως
  choice: Geht mit ihm hinaus mitten in die Stadt
  rationale: Die Wendung bewahrt sowohl das Hinausgehen als auch den zentralen, öffentlichen Ort der folgenden Bekanntmachung, ohne den Text zu einer ausdrücklichen Eskorte umzudeuten.
- source_word: κηρύξατε
  choice: lasst ausrufen
  rationale: κηρύσσω bezeichnet eine öffentliche Bekanntmachung durch einen Herold. »Lasst ausrufen« gibt den amtlichen und öffentlichen Charakter idiomatisch wieder.
- source_word: τοῦ μηδένα ἐντυγχάνειν κατὰ τούτου περὶ μηδενὸς πράγματος
  choice: dass niemand wegen irgendeiner Angelegenheit Klage gegen ihn erheben soll
  rationale: ἐντυγχάνω mit κατά kann in diesem amtlich-rechtlichen Zusammenhang eine gegen jemanden gerichtete Eingabe oder Beschwerde bezeichnen. »Klage erheben« vermittelt diesen Sinn, ohne ein bestimmtes modernes Gerichtsverfahren vorauszusetzen.
- source_word: μηδεὶς αὐτῷ ἐνοχλείτω
  choice: niemand ihn behelligen soll
  rationale: ἐνοχλέω bedeutet belästigen, bedrängen oder Schwierigkeiten bereiten. »Behelligen« ist würdig, verständlich und hält die Aussage bewusst weit.
- source_word: περὶ παντὸς λόγου
  choice: aus irgendeinem Grund
  rationale: λόγος hat hier den Sinn von Grund, Anlass oder Sache. Die Wiedergabe vermeidet eine schwerfällige Wiederholung von »Angelegenheit« und bewahrt den umfassenden Charakter des Verbots.
