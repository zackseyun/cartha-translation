base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/055.yaml
  text: And King Ptolemy answered, saying, “A good day is this, on which you returned to the land of your fathers and sat on the throne of their kingdom.”
translation:
  language: de
  text: 'Und König Ptolemäus antwortete: „Ein guter Tag ist der, an dem du in das Land deiner Väter zurückgekehrt bist und den Thron ihres Königreichs bestiegen hast.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεκρίθη … λέγων
  choice: antwortete
  rationale: Gibt die griechische Antwortformel natürlich und vollständig wieder; das redundante Partizip λέγων muss im modernen Deutschen nicht eigens mit „und sagte“ abgebildet werden.
- source_word: Ἀγαθὴ ἡμέρα
  choice: Ein guter Tag ist dies
  rationale: Bewahrt die hervorgehobene, nominale Formulierung und die feierliche Wortstellung des Griechischen.
- source_word: ἀνέστρεψας
  choice: zurückgekehrt bist
  rationale: Im Kontext bezeichnet das Verb die Rückkehr in das angestammte Land.
- source_word: γῆν πατέρων σου
  choice: das Land deiner Väter
  rationale: Formnahe und im Deutschen verständliche Wiedergabe der Herkunfts- und Abstammungsformel.
- source_word: ἐκάθισας ἐπὶ θρόνου
  choice: dich auf den Thron … gesetzt hast
  rationale: Bildet den konkreten griechischen Ausdruck ab und lässt zugleich seine Bedeutung als Herrschaftsantritt erkennen.
- source_word: βασιλείας αὐτῶν
  choice: ihres Königreichs
  rationale: Bewahrt den pluralischen Rückbezug von αὐτῶν auf die Väter, ohne ihn interpretierend aufzulösen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Aussage „Ein guter Tag ist dies“ bewahrt die feierliche Hervorhebung des Ausgangstextes; keine konfessionellen oder anderweitig theologischen Präzisierungen wurden ergänzt.
