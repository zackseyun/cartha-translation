  - severity: low
    issue: „dich auf den Thron ... gesetzt hast“
    rationale: Die reflexive Formulierung ist möglich, kann aber ein aktives Sich-selbst-Setzen nahelegen. „den Thron ... bestiegen hast“ ist im monarchischen Kontext idiomatisch und gibt ἐκάθισας ἐπὶ θρόνου präzise wieder.
