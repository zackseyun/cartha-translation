lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Das einfache Präteritum gibt den Aorist im erzählenden Zusammenhang natürlich wieder.
- source_word: ἐπιστολὰς
  choice: Briefe
  rationale: Der griechische Akkusativ Plural bezeichnet mehrere Briefe oder schriftliche Mitteilungen.
- source_word: λόγοις εἰρηνικοῖς
  choice: mit friedlichen Worten
  rationale: Die Formulierung bewahrt sowohl λόγοις als auch εἰρηνικοῖς und beschreibt Inhalt beziehungsweise Ton der Briefe.
- source_word: ὥστε
  choice: um
  rationale: Mit dem Infinitiv bezeichnet ὥστε hier im Zusammenhang am ehesten die Absicht; die deutsche Infinitivkonstruktion ist knapp und natürlich.
- source_word: μεγαλῦναι
  choice: zu ehren
  rationale: Wörtlich bedeutet das Verb hier »groß zu machen«; im politischen Zusammenhang ist gemeint, Jonatan Ansehen zu verleihen beziehungsweise ihn herauszustellen.
- source_word: Ἰωναθὰν
  choice: Jonatan
  rationale: Die Namensform entspricht der im modernen deutschen Bibelgebrauch üblichen Schreibweise.
