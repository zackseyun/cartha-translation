  text: And Demetrius sent letters to Jonathan with peaceful words[b][a], so as to honor him.
translation:
  language: de
  text: Und Demetrius sandte Jonatan Briefe mit friedlichen Worten[a], um ihn zu ehren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »mit Worten des Friedens«.'
