base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/043.yaml
  text: And as for any who flee to the sanctuary in Jerusalem and in all its borders[a], owing royal taxes or any other obligation, let them be released[b], along with everything that belongs to them in my kingdom.
translation:
  language: de
  text: Und alle, die in das Heiligtum in Jerusalem und in sein gesamtes Gebiet[a] fliehen und königliche Abgaben oder irgendeine andere Verpflichtung schulden, sollen freigestellt sein, ebenso alles, was ihnen in meinem Königreich gehört[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Tempel in Jerusalem und in dessen gesamtes Gebiet“. Die griechischen Wörter können den Tempelbezirk oder ein ihm beziehungsweise Jerusalem zugeordnetes Gebiet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „die königliche Abgaben und jede Angelegenheit schulden, sollen freigelassen sein, ebenso alles, was ihnen in meinem Königreich gehört“. Gemeint sein können Steuern, Schulden oder andere rechtliche Forderungen; der Erlass schließt auch ihren Besitz im Königreich ein.'
    reason: alternative_reading
lexical_decisions:
- source_word: φύγωσιν
  choice: fliehen
  rationale: Bewahrt die Bewegungsbedeutung von φεύγω; dass die Betreffenden dort Zuflucht suchen, ergibt sich aus dem Ziel, dem Heiligtum.
- source_word: ἱερὸν
  choice: Heiligtum
  rationale: Kann den Tempel samt seinem heiligen Bezirk bezeichnen und ist daher weniger eng als „Tempelgebäude“.
- source_word: ὁρίοις
  choice: Gebiet
  rationale: ὅρια kann Grenzen oder das von ihnen umschlossene Gebiet bezeichnen. „Gebiet“ ist hier im Deutschen natürlich, ohne den genauen verwaltungsmäßigen Umfang festzulegen.
- source_word: βασιλικὰ
  choice: königliche Abgaben
  rationale: Bezeichnet im Zusammenhang Verpflichtungen gegenüber der Krone; „Abgaben“ lässt Steuern und sonstige königliche Forderungen zu.
- source_word: πᾶν πρᾶγμα
  choice: irgendeine andere Verpflichtung
  rationale: Die wörtliche Wendung „jede Angelegenheit“ wird durch ὀφείλων als etwas Geschuldetes oder rechtlich Gefordertes bestimmt, bleibt aber breiter als bloße Geldschuld.
- source_word: ἀπολελύσθωσαν
  choice: sollen davon befreit sein
  rationale: Gibt den perfektischen passiven Imperativ als verfügte, wirksame Befreiung von den genannten Verpflichtungen wieder.
- source_word: πάντα ὅσα ἐστὶν αὐτοῖς
  choice: alles, was ihnen gehört
  rationale: Bewahrt den umfassenden Ausdruck, ohne ihn vorschnell auf bestimmte Arten von Eigentum einzuengen.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: in meinem Königreich
  rationale: Direkte und verständliche Wiedergabe des Herrschaftsgebiets des Königs.
theological_decisions:
- issue: Umfang des mit dem Jerusalemer Heiligtum verbundenen Asyls und Schuldenerlasses
  choice: Der Erlass befreit diejenigen, die zum Heiligtum fliehen, von königlichen Abgaben und anderen Verpflichtungen und schützt zugleich ihr Eigentum im Königreich.
  alternative: πᾶν πρᾶγμα könnte allgemeiner „jede Angelegenheit“ oder enger eine finanzielle beziehungsweise rechtliche Forderung meinen; außerdem kann sich „sein gesamtes Gebiet“ auf das Heiligtum oder weiter auf Jerusalem beziehen.
  rationale: Die Verbindung von ὀφείλων mit βασιλικὰ und πᾶν πρᾶγμα weist auf bestehende Verbindlichkeiten. Die Übersetzung lässt deren genaue Art sowie den räumlichen Umfang bewusst offen.
translation_notes:
  register: Moderner, würdevoller Erlassstil. „Königliche Abgaben“ und „Verpflichtung“ halten die rechtlich-finanzielle Aussage verständlich, ohne den griechischen Ausdruck unnötig zu verengen.
