  to: Und alle, die in das Heiligtum in Jerusalem und in sein gesamtes Gebiet[a] fliehen und königliche Abgaben oder irgendeine andere Verpflichtung schulden, sollen freigestellt sein, ebenso alles, was ihnen in meinem Königreich gehört[b].
