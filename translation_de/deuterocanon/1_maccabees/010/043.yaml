  source_fidelity: Die Grundbedeutung ist gut getroffen. Die kausale Einleitung „weil“ verschiebt jedoch den griechischen Partizipialsatz zu stark in eine Begründung der Flucht. Außerdem steht das abschließende „alles, was ihnen … gehört“ im Griechischen mit unter dem Erlass und sollte nicht lediglich mit dem missverständlichen „ebenso“ angehängt werden.
  naturalness: Der Erlassstil ist grundsätzlich natürlich. „Sollen davon befreit sein, ebenso alles“ ist im Deutschen syntaktisch und semantisch uneinheitlich, da sich „davon“ bei Sachen nicht ohne Weiteres auf geschuldete Abgaben oder Verpflichtungen beziehen lässt.
  terminology: „Heiligtum“, „königliche Abgaben“, „Verpflichtung“ und „Königreich“ sind angemessen. „Freigestellt“ gibt hier den verfügenden Charakter von ἀπολελύσθωσαν idiomatischer wieder als eine rein kausale Befreiungsformel und lässt den rechtlich-finanziellen Kontext erkennen.
