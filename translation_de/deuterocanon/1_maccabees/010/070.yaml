base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/070.yaml
  text: And he sent to Jonathan the high priest[a], saying, “You alone are lifting yourself up against us, while I have become an object of ridicule and reproach because of you[c][b]; and why do you exercise authority over us in the mountains?”
translation:
  language: de
  text: 'Und er sandte zu Jonatan, dem Hohepriester, und ließ ihm sagen: »Du allein erhebst dich gegen uns, ich aber bin deinetwegen zum Gespött und zur Schande geworden. Warum übst du im Bergland[a] Macht über uns aus?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Bergen«. Das griechische Wort kann sowohl Berge als auch eine gebirgige Landschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν πρὸς … λέγων
  choice: sandte zu … und ließ ihm sagen
  rationale: Die Formulierung gibt den griechischen Sende- und Redeakt natürlich wieder, ohne festzulegen, ob ein Bote oder eine schriftliche Nachricht übermittelt wurde.
- source_word: τὸν ἀρχιερέα
  choice: dem Hohen Priester
  rationale: Dies ist die übliche deutsche Amtsbezeichnung im jüdischen kultischen und politischen Zusammenhang.
- source_word: Σὺ μονώτατος
  choice: Du allein
  rationale: Die Wendung bewahrt die nachdrückliche Ausschließlichkeit des Superlativs μονώτατος.
- source_word: ἐπαίρῃ ἐφʼ ἡμᾶς
  choice: erhebst dich gegen uns
  rationale: Die Wiedergabe erhält sowohl das Bild des Sich-Erhebens als auch die feindselige Ausrichtung gegen die Angesprochenen, ohne die Stelle einseitig als Stolz oder militärischen Aufstand festzulegen.
- source_word: ἐγενήθην εἰς καταγέλωτα καὶ ὀνειδισμόν
  choice: bin … zum Gespött und zur Schande geworden
  rationale: Die beiden Substantive werden in einer natürlichen deutschen Ergebnisformulierung wiedergegeben; »Gespött« bezeichnet öffentliche Lächerlichkeit, »Schande« die mit ὀνειδισμός verbundene Beschämung.
- source_word: διὰ σέ
  choice: deinetwegen
  rationale: Die knappe deutsche Formulierung gibt die kausale Bedeutung von διά mit Akkusativ klar wieder.
- source_word: ἐξουσιάζῃ ἐφʼ ἡμᾶς
  choice: übst du … Macht über uns aus
  rationale: Dies wahrt den Sinn tatsächlicher Herrschafts- oder Verfügungsgewalt und vermeidet die stärkere Wertung von »unterdrücken« oder »beherrschen«.
- source_word: ἐν τοῖς ὄρεσιν
  choice: im Bergland
  rationale: Der Plural ὄρη kann neben einzelnen Bergen auch eine gebirgige Region oder das Hügelland bezeichnen; im Kontext ist »Bergland« natürlich und geografisch offen.
