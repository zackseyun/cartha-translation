  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt anklagend und knapp. Das etwas förmliche »Hoher Priester« entspricht dem historischen Amt; »erhebst dich gegen uns« bewahrt die Mehrdeutigkeit zwischen Selbstüberhebung und feindlichem Auftreten.
