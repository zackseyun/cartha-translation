base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/077.yaml
  text: And Apollonius heard[a], and he encamped with three thousand cavalry and a large force, and went to Azotus as though passing through, and at the same time advanced into the plain[b], because he had a multitude of cavalry and trusted in it.
translation:
  language: de
  text: Apollonius hörte davon und schlug mit dreitausend Reitern und einer großen Streitmacht sein Lager auf. Er zog nach Aschdod, als zöge er nur hindurch,[a] und rückte zugleich in die Ebene vor; denn er hatte eine große Zahl von Reitern[b] und verließ sich auf sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »wie einer, der hindurchzieht«. Die griechische Formulierung kann einen bloßen Durchzug beschreiben oder den Anschein eines solchen andeuten.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen »Pferd« in kollektivem Sinn; gemeint sind berittene Truppen.
    reason: cultural_note
lexical_decisions:
- source_word: παρενέβαλεν
  choice: lagerte er sich
  rationale: Das Verb bezeichnet im militärischen Zusammenhang das Aufschlagen eines Lagers. Die Formulierung mit »mit« bindet die genannten Truppen natürlich ein.
- source_word: τρισχιλίαν ἵππον
  choice: dreitausend Reiter
  rationale: ἵππος wird hier kollektiv für berittene Truppen gebraucht. »Reiter« ist im modernen Deutschen klarer und natürlicher als das fachsprachliche »Kavallerie« nach einer Zahl.
- source_word: δύναμιν πολλήν
  choice: eine große Streitmacht
  rationale: δύναμις bezeichnet hier eine militärische Truppe, nicht abstrakte Macht.
- source_word: Ἄζωτον
  choice: Aschdod
  rationale: »Aschdod« ist die im Deutschen geläufige biblische Form des Ortsnamens, den die griechische Quelle als Ἄζωτος wiedergibt.
- source_word: ὡς διοδεύων
  choice: als zöge er nur hindurch
  rationale: Die Wendung bewahrt den Anschein eines bloßen Durchzugs, ohne ausdrücklich zu behaupten, dass eine Täuschung beabsichtigt war.
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: rückte zugleich in die Ebene vor
  rationale: ἅμα drückt Gleichzeitigkeit aus; προσάγω hat hier einen militärischen Bewegungssinn.
- source_word: πλῆθος ἵππου
  choice: eine große Zahl von Reitern
  rationale: Die kollektive Verwendung von ἵππος bezeichnet zahlreiche berittene Truppen; die deutsche Formulierung bleibt verständlich und nah am Mengenbegriff πλῆθος.
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: verließ sich auf sie
  rationale: Der perfekte Infinitiv bezeichnet gefestigtes Vertrauen. Das Pronomen verweist am ehesten auf die zuvor genannte Reiterei beziehungsweise die Reiter.
