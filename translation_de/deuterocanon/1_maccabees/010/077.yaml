  naturalness: Der Text ist insgesamt klares modernes Standarddeutsch. „sein Lager aufschlagen“ ist die idiomatischere militärische Formulierung als „sich lagern“ und bindet die Truppenangabe ohne Bedeutungsverschiebung ein.
  terminology: „Aschdod“ ist die etablierte deutsche Namensform für Ἄζωτος. „Reiter“ und „große Streitmacht“ geben die kollektiv verwendete ἵππος und δύναμις angemessen wieder. Das pluralische „sie“ ist als deutscher Bezug auf „Reiter“ natürlich, obwohl das griechische Kollektivum ein Singularpronomen hat.
