revisions:
- from: Als Apollonius davon hörte, lagerte er sich mit dreitausend Reitern und einer großen Streitmacht. Er zog nach Aschdod, als zöge er nur hindurch,[a] und rückte zugleich in die Ebene vor; denn er hatte eine große Zahl von Reitern[b] und verließ sich auf sie.
  to: Apollonius hörte davon und schlug mit dreitausend Reitern und einer großen Streitmacht sein Lager auf. Er zog nach Aschdod, als zöge er nur hindurch,[a] und rückte zugleich in die Ebene vor; denn er hatte eine große Zahl von Reitern[b] und verließ sich auf sie.
  rationale: Die Revision ersetzt nur die unnötig unterordnende Einleitung durch eine dem griechischen καί entsprechende Reihung und verwendet für παρενέβαλεν die idiomatische militärische Wendung „sein Lager aufschlagen“. Die Ambiguität von ὡς διοδεύων bleibt erhalten; Namen, Truppenbezeichnungen, Begründungszusammenhang und beide Fußnotenanker bleiben sachgerecht.
