base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/074.yaml
  text: But when Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem, and Simon his brother met him to help him.
translation:
  language: de
  text: Als Jonatan aber die Worte des Apollonius hörte, wurde er innerlich bewegt[a]. Er wählte zehntausend Männer aus und verließ Jerusalem. Sein Bruder Simon traf ihn, um ihm zu helfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde er innerlich aufgewühlt«; möglicherweise auch: »wurde er innerlich gereizt«. Das Griechische bezeichnet eine innere Bewegung oder Erregung, ohne die genaue Emotion festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Als ... aber ... hörte
  rationale: ὡς mit dem Aorist bezeichnet hier den Zeitpunkt; δέ führt die Erzählung mit einem leichten Übergang fort. Die deutsche Wortstellung ist natürlich und bewahrt beide Funktionen.
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: die Worte des Apollonius
  rationale: λόγοι bezieht sich auf die zuvor geäußerten Worte beziehungsweise die Herausforderung des Apollonius. Die Wiedergabe bleibt nah am Griechischen, ohne den Inhalt als bloße Nachricht umzudeuten.
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: wurde er innerlich aufgewühlt
  rationale: Die Passivform von κινέω mit τῇ διανοίᾳ beschreibt eine innere Bewegung oder Erregung. »Innerlich aufgewühlt« ist im heutigen Deutsch verständlich, legt die genaue Emotion aber nicht auf Zorn, Kränkung oder Sorge fest.
- source_word: ἐπέλεξεν
  choice: wählte ... aus
  rationale: ἐπιλέγω bezeichnet ein gezieltes Auswählen; die trennbare deutsche Verbform passt natürlich zum militärischen Zusammenhang.
- source_word: δέκα χιλιάδας ἀνδρῶν
  choice: zehntausend Männer
  rationale: Die Übersetzung gibt Zahl und Substantiv direkt wieder. Dass es sich im Zusammenhang um kampffähige Männer handelt, muss nicht durch den Zusatz »Soldaten« festgelegt werden.
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: zog aus Jerusalem hinaus
  rationale: »Zog ... hinaus« ist eine natürliche deutsche Bewegungsangabe für den Aufbruch einer größeren Gruppe und bewahrt ausdrücklich den Ausgangspunkt Jerusalem.
- source_word: συνήντησεν αὐτῷ
  choice: kam zu ihm
  rationale: συναντάω bezeichnet das Zusammentreffen mit jemandem. »Kam zu ihm« vermeidet das im Deutschen missverständliche »traf ihn« und legt nicht unnötig fest, dass Simon ihm aus der Gegenrichtung entgegenkam.
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: um ihm zu helfen
  rationale: Die Wendung bezeichnet den Zweck von Simons Kommen. Der deutsche Infinitivsatz gibt dies klar und idiomatisch wieder.
