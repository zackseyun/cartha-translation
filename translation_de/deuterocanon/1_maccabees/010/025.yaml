translation:
  language: de
  text: 'damit sie mir Beistand leisten. Und König Demetrius sandte ihnen folgende Botschaft: »König Demetrius grüßt das Volk der Juden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς βοήθειαν
  choice: mir Beistand leisten
  rationale: Gibt den Zweck beziehungsweise die unterstützende Funktion im natürlichen modernen Deutsch wieder, ohne die Aussage näher zu bestimmen.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: folgende Botschaft
  rationale: Eine idiomatische Wiedergabe der Einleitung zum anschließend wörtlich mitgeteilten Wortlaut.
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: das Volk der Juden
  rationale: Bewahrt den kollektiven Sinn von ἔθνος; der deutsche Akkusativ ergibt sich aus der idiomatischen Wiedergabe der Grußformel.
- source_word: χαίρειν
  choice: grüßt
  rationale: Entspricht der konventionellen griechischen Briefgrußformel und lässt sich in der deutschen Absender-Empfänger-Formel klar und würdig wiedergeben.
