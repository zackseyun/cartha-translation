  source_fidelity: Der Sinn wird insgesamt gut getroffen. Die Anredeformel χαίρειν ist angemessen als „grüßt“ wiedergegeben, und „ihnen“ entspricht αὐτοῖς. Der griechische Text nennt jedoch König Demetrius ausdrücklich als Subjekt des Sendens; das bloße „er“ schwächt diese explizite Nennung unnötig ab.
