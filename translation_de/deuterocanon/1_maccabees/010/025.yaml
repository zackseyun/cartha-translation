  terminology: „Beistand leisten“ gibt εἰς βοήθειαν passend wieder. „Volk der Juden“ bewahrt den kollektiven Bezug von τὸ ἔθνος τῶν Ἰουδαίων; „Juden“ ist hier eine historische Selbst- bzw. Gruppenbezeichnung und neutral zu behandeln.
