  yaml_path: translation/deuterocanon/1_maccabees/010/076.yaml
  text: And those in the city[a], being afraid, opened the gates, and Jonathan took control of Joppa.
translation:
  language: de
  text: Als die Bewohner der Stadt Angst bekamen, öffneten sie die Tore[a], und Jonatan brachte Joppe unter seine Kontrolle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch steht nur: „öffneten“; dass die Tore gemeint sind, ist aus dem Zusammenhang wahrscheinlich zu erschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθέντες
  choice: Da bekamen … Angst
  rationale: Das aoristische Partizip bezeichnet hier den vorausgehenden beziehungsweise ursächlichen Umstand. Die finite Wiedergabe ist im modernen Deutschen natürlich und legt die Stärke der Furcht nicht näher fest.
- source_word: ἤνοιξαν
  choice: öffneten die Tore
  rationale: Das griechische Verb bedeutet lediglich „öffneten“ und nennt kein Objekt. Im Zusammenhang mit einer befestigten Stadt sind die Tore sehr wahrscheinlich gemeint; die Ergänzung wird deshalb durch eine Fußnote kenntlich gemacht.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: die Menschen in der Stadt
  rationale: Die griechische Wendung bezeichnet die aus beziehungsweise zu der Stadt gehörende Gruppe. Im Kontext ist „in der Stadt“ im Deutschen eindeutig und natürlich; „Menschen“ vermeidet eine unbegründete Beschränkung auf Männer.
- source_word: ἐκυρίευσεν
  choice: brachte … unter seine Kontrolle
  rationale: κυριεύω bezeichnet das Erlangen von Herrschaft oder Verfügungsgewalt. Die Formulierung passt zum militärisch-politischen Zusammenhang, ohne das Geschehen enger als bloße Eroberung zu bestimmen.
- source_word: Ἰόππης
  choice: Joppe
  rationale: „Joppe“ ist die im Deutschen gebräuchliche biblische Form des Ortsnamens Ἰόππη.
