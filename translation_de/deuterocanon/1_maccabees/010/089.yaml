base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/089.yaml
  text: And he sent him a gold clasp[a], as is the custom to give to the king’s kinsmen; and he gave him Accaron and all its territory as an inheritance.
translation:
  language: de
  text: Und er sandte ihm eine goldene Spange, wie es üblich ist, den Verwandten von Königen zu geben; und er gab ihm Akkaron[a] und sein ganzes Gebiet zum Erbbesitz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akkaron ist die griechische Form des Ortsnamens, der nach der hebräischen Namensform gewöhnlich als Ekron bekannt ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόρπην χρυσῆν
  choice: eine goldene Spange
  rationale: πόρπη bezeichnet eine Spange, Brosche oder einen anderen Schmuckverschluss. „Goldene Spange“ ist natürlich und konkret, ohne die genaue Form des Gegenstands festzulegen.
- source_word: ὡς ἔθος ἐστὶν διδόσθαι
  choice: wie sie … üblicherweise verliehen wird
  rationale: Die Wendung beschreibt einen üblichen höfischen Brauch. Das Passiv entspricht διδόσθαι; „verliehen“ gibt den Charakter einer königlichen Auszeichnung im Deutschen natürlich wieder.
- source_word: τοῖς συγγενεῦσιν τῶν βασιλέων
  choice: den Verwandten der Könige
  rationale: Die Übersetzung bewahrt den Plural und die formale Aussage des Griechischen, ohne sie auf die Angehörigen nur eines bestimmten Königs einzuengen.
- source_word: Ἀκκαρὼν
  choice: Akkaron
  rationale: „Akkaron“ gibt die Namensform der griechischen Vorlage deutsch transliteriert wieder; die geläufigere, aus dem Hebräischen abgeleitete Form „Ekron“ wird in einer Fußnote genannt.
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: mit seinem ganzen Gebiet
  rationale: ὅρια kann Grenzen und metonymisch das von ihnen umschlossene Gebiet bezeichnen. Im Zusammenhang einer Landübertragung ist „ganzes Gebiet“ im Deutschen klarer und idiomatischer als „alle Grenzen“.
- source_word: εἰς κληρονομίαν
  choice: zum Erbbesitz
  rationale: „Erbbesitz“ bewahrt sowohl den Gedanken des Erbes als auch den rechtlichen Sinn eines dauerhaft übertragenen Besitzes.
