base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/023.yaml
  text: He was grieved and said[a], “What is this that we have done, that Alexander has gotten ahead of us in securing friendship with the Jews for support?”
translation:
  language: de
  text: 'Da wurde er betrübt und sagte: »Was haben wir da getan! Alexander ist uns zuvorgekommen und hat die Freundschaft der Juden gewonnen, um sich Rückhalt zu verschaffen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλυπήθη
  choice: Da wurde er betrübt
  rationale: Das Aoristpassiv bezeichnet hier Kummer oder Bestürzung über die politische Entwicklung. „Wurde betrübt“ bewahrt den Ernst und knüpft erzählerisch an den vorausgehenden Zusammenhang an.
- source_word: Τί τοῦτο ἐποιήσαμεν
  choice: Was haben wir da getan!
  rationale: Das idiomatische „da“ greift τοῦτο auf und bringt den selbstanklagenden, bestürzten Ausruf in natürlichem modernem Deutsch zum Ausdruck.
- source_word: προέφθακεν ἡμᾶς
  choice: ist uns zuvorgekommen
  rationale: προφθάνω bedeutet, jemandem zuvorzukommen oder ihn zu überholen. „Uns zuvorgekommen“ ist im politischen Kontext präzise und idiomatisch.
- source_word: φιλίαν καταλαβέσθαι τοῖς Ἰουδαίοις
  choice: hat die Freundschaft der Juden gewonnen
  rationale: καταλαμβάνομαι bezeichnet hier das Erlangen oder Gewinnen; der Dativ τοῖς Ἰουδαίοις lässt sich bei φιλία als Zugehörigkeit beziehungsweise Beziehung verstehen. Die Formulierung wahrt den unmittelbaren Sinn von φιλία und lässt dessen diplomatische Tragweite aus dem Kontext hervorgehen.
- source_word: εἰς στήριγμα
  choice: um sich Rückhalt zu verschaffen
  rationale: στήριγμα bezeichnet Stütze oder Festigung und meint hier wahrscheinlich politischen Rückhalt. Die finale Formulierung gibt εἰς natürlich wieder und macht den Bezug auf Alexanders beabsichtigte Stärkung deutlich.
