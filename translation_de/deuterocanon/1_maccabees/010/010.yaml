lexical_decisions:
- source_word: ᾤκησεν
  choice: ließ sich … nieder
  rationale: Das aoristische οἰκέω bezeichnet hier Jonatans Wohnsitznahme in Jerusalem; die deutsche Wendung gibt dies natürlicher und kontextuell präziser wieder als das bloße „wohnte“.
- source_word: οἰκοδομεῖν
  choice: aufzubauen
  rationale: Bewahrt den baulichen Sinn und lässt offen, ob Neubau, Wiederaufbau oder Ausbau gemeint ist.
- source_word: καινίζειν
  choice: zu erneuern
  rationale: Entspricht der Grundbedeutung „neu machen/erneuern“ und vermeidet eine unnötige Einengung auf bloße Wiederherstellung.
