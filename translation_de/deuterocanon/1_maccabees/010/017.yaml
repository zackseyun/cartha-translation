lexical_decisions:
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Der Aorist von γράφω bezeichnet hier schlicht das Schreiben; „schrieb“ ist präzise und im Deutschen natürlich.
- source_word: ἐπιστολὰς
  choice: Briefe
  rationale: Der griechische Akkusativ Plural bezeichnet ausdrücklich mehrere Briefe. „Briefe“ ist die natürliche moderne Wiedergabe.
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Der Aorist von ἀποστέλλω bedeutet hier „sandte“. Diese Form ist knapp, würdig und bewahrt die einfache Erzählweise.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen wird entsprechend dem Griechischen als Pronomen wiedergegeben; der Name des Bezugsträgers wird nicht ergänzend in den Haupttext eingefügt.
