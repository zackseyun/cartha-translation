base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/047.yaml
  text: And they were pleased with Alexander[a], because he had become for them the initiator of peaceful terms, and they fought alongside him all the days.
translation:
  language: de
  text: Und sie waren Alexander[a] wohlgesonnen, weil er für sie zum Urheber von Friedensvorschlägen geworden war; und sie kämpften die ganze Zeit an seiner Seite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie fanden Gefallen an Alexander.“ Die griechische Wendung lautet wörtlich etwa: „weil er für sie zum Anführer von Friedensworten geworden war“; gemeint können Friedensvorschläge oder versöhnliche Botschaften sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν ἐν Ἀλεξάνδρῳ
  choice: sie fanden Gefallen an Alexander
  rationale: Die Wendung bezeichnet eine positive Haltung oder Billigung gegenüber Alexander. „Gefallen finden an“ gibt die Konstruktion mit ἐν idiomatisch und würdevoll wieder.
- source_word: ἐγένετο
  choice: war ... geworden
  rationale: Der Aorist bezeichnet hier das vorausliegende Eintreten in eine Rolle; das Plusquamperfekt passt zum begründenden ὅτι-Satz.
- source_word: ἀρχηγὸς
  choice: Urheber
  rationale: Das Wort bezeichnet jemanden, von dem etwas ausgeht oder der darin die Führung übernimmt. „Urheber“ bewahrt diese aktive Ausgangsfunktion, ohne Alexander allgemein als Anführer zu bezeichnen.
- source_word: λόγων εἰρηνικῶν
  choice: friedlicher Verhandlungen
  rationale: Wörtlich steht „friedlicher Worte“. Im diplomatischen Kontext sind damit wahrscheinlich versöhnliche Gespräche, Vorschläge oder Friedensbedingungen gemeint; „Verhandlungen“ macht diesen Zusammenhang natürlich verständlich.
- source_word: συνεμάχουν αὐτῷ
  choice: sie kämpften ... an seiner Seite
  rationale: Das Verb bezeichnet gemeinsames militärisches Kämpfen als Verbündete; die Formulierung hält den militärischen Sinn ausdrücklich fest.
- source_word: πάσας τὰς ἡμέρας
  choice: die ganze Zeit
  rationale: Die griechische Zeitformel bedeutet wörtlich „alle Tage“ und bezeichnet hier die fortdauernde Unterstützung. „Die ganze Zeit“ ist im modernen Deutschen natürlich.
