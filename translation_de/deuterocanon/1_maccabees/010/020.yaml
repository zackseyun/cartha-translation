base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/020.yaml
  text: And now today we have appointed you high priest of your nation[c][b][a], and to be called the king’s Friend—and they sent him a purple robe and a crown of gold—and to take our side and maintain friendship with us.
translation:
  language: de
  text: Und nun haben wir dich heute zum Hohepriester deines Volkes eingesetzt; du sollst »Freund des Königs« genannt werden[a] – und sie sandten ihm ein Purpurgewand und einen goldenen Kranz[b] –; du sollst für unsere Interessen eintreten[c] und die Freundschaft mit uns bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Freund des Königs« kann ein offizieller Hoftitel im hellenistischen Sprachgebrauch sein.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text wechselt hier von der königlichen Rede in der ersten Person (»wir haben … eingesetzt«) unvermittelt zur Erzählung in der dritten Person (»sie sandten ihm«). Dieser Wechsel ist in der Übersetzung beibehalten.
    reason: textual_variant
  - marker: c
    text: 'Wörtlich: »das Unsere denken«; gemeint ist, die eigenen Interessen zu unterstützen oder für die eigene Seite Partei zu ergreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεστάκαμέν
  choice: haben wir … eingesetzt
  rationale: Das Perfekt von καθίστημι bezeichnet hier die förmliche Einsetzung in ein Amt; »eingesetzt« ist im Deutschen sachgerecht und idiomatisch.
- source_word: ἀρχιερέα
  choice: Hohepriester
  rationale: Die etablierte deutsche Bezeichnung für das oberste jüdische Priesteramt.
- source_word: τοῦ ἔθνους σου
  choice: deines Volkes
  rationale: ἔθνος bezeichnet hier das jüdische Volk als politisch-korporative Gemeinschaft; »Volk« klingt im modernen Deutschen natürlicher als »Nation«, ohne diesen Sinn auszuschließen.
- source_word: φίλον βασιλέως
  choice: »Freund des Königs«
  rationale: Die Wendung ist wahrscheinlich ein hellenistischer Hoftitel. Anführungszeichen machen den titulären Charakter sichtbar, ohne mehr festzulegen, als der griechische Wortlaut erlaubt.
- source_word: καλεῖσθαι
  choice: sollst … genannt werden
  rationale: Der griechische Infinitiv hängt von der Einsetzungsformel ab. Die Soll-Konstruktion gibt die amtliche Bestimmung in natürlichem Deutsch wieder.
- source_word: πορφύραν
  choice: ein Purpurgewand
  rationale: πορφύρα kann Purpurstoff oder ein Purpurgewand bezeichnen; im Zusammenhang der verliehenen Ehrenzeichen ist ein Gewand naheliegend.
- source_word: στέφανον χρυσοῦν
  choice: einen goldenen Kranz
  rationale: στέφανος bezeichnet primär einen Kranz und kann funktional auch als Krone verstanden werden. »Goldener Kranz« wahrt die konkrete griechische Bildsprache.
- source_word: φρονεῖν τὰ ἡμῶν
  choice: für unsere Interessen eintreten
  rationale: Wörtlich geht es darum, »das Unsere zu denken«; idiomatisch ist politische Parteinahme zugunsten der königlichen Interessen gemeint.
- source_word: συντηρεῖν φιλίαν πρὸς ἡμᾶς
  choice: die Freundschaft mit uns bewahren
  rationale: Die Formulierung bezeichnet das Fortbestehen eines diplomatisch-politischen Freundschaftsverhältnisses.
- source_word: ἀπέστειλαν αὐτῷ
  choice: sie sandten ihm
  rationale: Der überlieferte Text wechselt unvermittelt von der ersten Person Plural zur dritten Person Plural; dieser Wechsel wird nicht harmonisiert.
theological_decisions:
- issue: Der mögliche Hoftitel φίλον βασιλέως
  choice: »Freund des Königs« als erkennbarer Titel
  alternative: ein Freund des Königs; königlicher Freund
  rationale: Der Ausdruck dürfte einen offiziellen Rang am hellenistischen Hof bezeichnen. Die Übersetzung lässt diese historische Funktion erkennen, ohne eine persönliche Freundschaft auszuschließen.
- issue: Personwechsel bei ἀπέστειλαν αὐτῷ
  choice: Die dritte Person »sie sandten ihm« bleibt im Haupttext erhalten.
  alternative: 'Harmonisierend: »wir sandten dir« oder »wir sandten ihm«'
  rationale: Der vorgelegte griechische Text wechselt innerhalb der königlichen Rede die Person. Da keine sichere Grundlage für eine Glättung vorliegt, bleibt diese Spannung sichtbar.
- issue: Verknüpfung der Infinitive καλεῖσθαι, φρονεῖν und συντηρεῖν
  choice: Als amtliche Bestimmungen mit »du sollst« wiedergegeben
  alternative: 'Formaler, aber im Deutschen schwerfälliger: »und genannt zu werden … und einzutreten … und zu bewahren«'
  rationale: Die deutsche Soll-Konstruktion macht die Abhängigkeit von der Einsetzungsformel verständlich, ohne die einzelnen Forderungen in selbstständige Tatsachenbehauptungen umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die königliche Verfügung wird klar und gut lesbar formuliert; der auffällige Personenwechsel und die politische Mehrdeutigkeit des Hoftitels bleiben sichtbar.
