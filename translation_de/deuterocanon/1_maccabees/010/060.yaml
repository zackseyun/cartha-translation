base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/060.yaml
  text: And he went with splendor to Ptolemais[a], and met the two kings; and he gave them silver and gold, and many gifts to their friends[c][b], and found favor before them.
translation:
  language: de
  text: Und er zog in Pracht[a] nach Ptolemaïs und traf die beiden Könige. Er gab ihnen Silber und Gold und ihren Freunden[b] viele Geschenke und fand Gunst bei ihnen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Herrlichkeit“ beziehungsweise „mit Pracht“. Die griechische Wendung bezeichnet eine von Ehre und äußerer Pracht geprägte Ankunft.'
    reason: lexical_alternative
  - marker: b
    text: „Freunde“ kann im hellenistischen Hofmilieu auch königliche Vertraute oder Hofleute bezeichnen.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: „fand Gunst vor ihnen“; sinngemäß auch: „gewann ihre Gunst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: zog
  rationale: Das erzählende Bewegungsverb wird im Zusammenhang einer repräsentativen Reise mit „zog“ natürlich und würdig wiedergegeben.
- source_word: μετὰ δόξης
  choice: mit großem Gepränge
  rationale: Die Wendung bezeichnet hier sichtbar entfaltete Ehre und Pracht. „Gepränge“ vermeidet einen unnötig theologischen Beiklang von „Herrlichkeit“ und passt zur öffentlichen Ankunft.
- source_word: Πτολεμαΐδα
  choice: Ptolemaïs
  rationale: Der Ortsname wird in der im Deutschen üblichen griechischen Form wiedergegeben.
- source_word: ἀπήντησεν
  choice: traf
  rationale: Das Verb kann das Entgegengehen oder Zusammentreffen bezeichnen; „traf“ ist knapp und lässt die genaue Art der Begegnung offen.
- source_word: τοῖς δυσὶν βασιλεῦσιν
  choice: die beiden Könige
  rationale: Die bestimmte, bereits bekannte Zweiergruppe wird im Deutschen idiomatisch mit „die beiden Könige“ bezeichnet.
- source_word: ἔδωκεν
  choice: gab
  rationale: Das einfache und unmittelbare „gab“ entspricht dem häufigen griechischen Verb, ohne die förmliche Art der Übergabe zusätzlich festzulegen.
- source_word: ἀργύριον καὶ χρυσίον
  choice: Silber und Gold
  rationale: Direkte Wiedergabe der beiden Wertmaterialien.
- source_word: τοῖς φίλοις αὐτῶν
  choice: ihren Freunden
  rationale: „Freunde“ bewahrt den Grundsinn von φίλοι; eine Fußnote weist auf die mögliche höfische Bedeutung als Vertraute oder Hofleute hin.
- source_word: δόματα πολλά
  choice: viele Geschenke
  rationale: Natürliche und genaue Wiedergabe der Nominalgruppe im diplomatischen Zusammenhang.
- source_word: εὗρεν χάριν ἐναντίον αὐτῶν
  choice: fand Gunst bei ihnen
  rationale: Die geläufige deutsche Wendung gibt das Idiom verständlich wieder; die wörtlichere räumliche Formulierung wird in einer Fußnote bewahrt.
