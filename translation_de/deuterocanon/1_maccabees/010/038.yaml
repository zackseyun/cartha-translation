  naturalness: Der Satz ist verständlich und im modernen Standarddeutsch angemessen. „Damit sie als eine Einheit gelten und keiner anderen Autorität als der des Hohen Priesters unterstehen“ ist sowohl idiomatisch als auch näher an der zielgerichteten Satzführung des Griechischen.
  terminology: „Bezirke“, „Gebiet Samarias“ und „Hoher Priester“ sind passend. „Autorität“ ist als direkte, breite Entsprechung von ἐξουσία vorzuziehen; „Amtsgewalt“ wäre zwar möglich, kann aber stärker nach einer spezifisch modernen Amtskompetenz klingen.
