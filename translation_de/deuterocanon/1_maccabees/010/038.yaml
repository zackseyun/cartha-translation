base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/038.yaml
  text: And the three districts added to Judea from the territory of Samaria[a], let them be attached to Judea, so as to be reckoned as one[b], so as not to obey any other authority except that of the high priest.
translation:
  language: de
  text: Und die drei Bezirke, die aus dem Gebiet Samarias Judäa hinzugefügt worden sind, sollen Judäa angegliedert werden, damit sie als eine Einheit gelten[a] und keiner anderen Autorität als der des Hohen Priesters unterstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „damit sie gerechnet werden, um unter einem zu werden“. Die knappe Formulierung bezeichnet eine einheitliche Zuordnung oder Unterstellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοὺς
  choice: Bezirke
  rationale: νόμος bezeichnet hier im hellenistischen Verwaltungsgebrauch einen territorialen Verwaltungsbezirk, nicht ein Gesetz. „Bezirke“ ist im modernen Deutschen klar und sachgerecht.
- source_word: προστεθέντας / προστεθήτω
  choice: hinzugefügt worden sind / sollen … angegliedert werden
  rationale: Die erste Form beschreibt die bereits erfolgte Zuordnung, die zweite die verfügte feste Angliederung. Die unterschiedlichen deutschen Verben geben diesen Zusammenhang natürlich wieder.
- source_word: χώρας
  choice: Gebiet
  rationale: χώρα bezeichnet hier das territoriale Gebiet Samarias; „Gebiet“ passt zum administrativen Zusammenhang.
- source_word: πρὸς τὸ λογισθῆναι
  choice: sodass sie … gelten
  rationale: Die Zweck- beziehungsweise Folgekonstruktion wird verständlich wiedergegeben; λογίζομαι hat hier den amtlichen Sinn „gerechnet/angesehen werden“.
- source_word: τοῦ γενέσθαι ὑφʼ ἕνα
  choice: als eine Einheit
  rationale: Die komprimierte Wendung lautet wörtlich etwa „unter einem zu werden“. Im Kontext ist die Zusammenfassung unter einer Verwaltung gemeint; die Fußnote bewahrt die wörtliche Unschärfe.
- source_word: ὑπακοῦσαι
  choice: unterstehen
  rationale: Im verwaltungsrechtlichen Kontext gibt „unterstehen“ das Gehorchen beziehungsweise Unterstelltsein natürlicher wieder als das persönliche „gehorchen“.
- source_word: ἄλλης ἐξουσίας
  choice: keiner anderen Amtsgewalt
  rationale: ἐξουσία meint hier ausübende Autorität oder Zuständigkeit. „Amtsgewalt“ wahrt den institutionellen Charakter.
- source_word: ἀλλʼ ἢ τοῦ ἀρχιερέως
  choice: als der des Hohen Priesters
  rationale: Der Genitiv bezieht sich sinngemäß auf ἐξουσία. Die Formulierung macht deutlich, dass es um die Amtsgewalt des Hohen Priesters geht.
theological_decisions:
- issue: Reichweite der Stellung des Hohen Priesters
  choice: Die Aussage wird als territorial-administrative Unterstellung wiedergegeben.
  alternative: Man könnte sie als umfassenden religiösen und politischen Gehorsam gegenüber dem Hohen Priester verstehen.
  rationale: Der Zusammenhang handelt von der Angliederung von Bezirken und ihrer Amtsgewalt. Die Übersetzung beschränkt die Aussage nicht dogmatisch, vermeidet aber, über den ausdrücklich administrativen Zusammenhang hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-administrativem Ton. Die lange griechische Satzfügung wurde maßvoll geglättet, ohne die beiden Zielaussagen – einheitliche Zuordnung und ausschließliche Unterstellung – voneinander zu lösen.
