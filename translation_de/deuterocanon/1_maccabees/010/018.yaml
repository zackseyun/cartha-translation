  - marker: a
    text: Der für diesen Vers vorliegende griechische Text ist offenbar unvollständig und wirkt wie der Anfang einer Brief- oder Zitatüberschrift, nicht wie ein vollständiger Satz. Die Übersetzung bleibt deshalb eng beim erhaltenen Wortlaut und ergänzt kein fehlendes Material.
