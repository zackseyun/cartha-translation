lexical_decisions:
- source_word: κατὰ τοὺς λόγους τούτους
  choice: mit folgendem Wortlaut
  rationale: Die Wendung bezeichnet hier am natürlichsten die nun folgende wörtliche Mitteilung. »Mit folgendem Wortlaut« gibt die briefliche Einleitungsformel idiomatisch wieder, ohne über den überlieferten Text hinauszugehen.
- source_word: λέγων
  choice: ':'
  rationale: Das Partizip leitet den Wortlaut des Schreibens ein. Im modernen Deutschen übernimmt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige »indem er sagte«.
- source_word: Βασιλεὺς Ἀλέξανδρος
  choice: König Alexander
  rationale: Diese Wortstellung entspricht dem natürlichen deutschen Gebrauch und bewahrt Titel und Namen vollständig.
- source_word: τῷ ἀδελφῷ
  choice: an seinen Bruder
  rationale: Der Dativ bezeichnet den Empfänger des Schreibens. Der Possessivartikel ist im Deutschen idiomatisch; »Bruder« kann dabei die diplomatische Anrede unter Herrschern bezeichnen, ohne dass dies im Haupttext festgelegt werden muss.
