  source_fidelity: Die militärische Wendung „zum Kampf antreten“ gibt συνῆψα … μάχην treffend wieder, und „zerschmettert“ wahrt die Stärke von συνετρίβη. „Heer“ legt jedoch die bei παρεμβολή mögliche Bedeutung „Streitmacht“ fest, während die Grundbedeutung im Kontext auch „Lager“ ist; „Lager“ erhält diese Nähe zur Vorlage besser. Die griechische Singularform bei zusammengesetztem Subjekt muss im Deutschen nicht nachgebildet werden; der Plural ist idiomatisch.
  naturalness: '„Wir setzten uns auf den Thron seines Königreichs“ ist verständlich, aber stilistisch und semantisch weniger präzise: Die Präposition ἐπί mit Genitiv bezeichnet hier die Position auf dem Thron. „Nahmen auf dem Thron seines Reiches Platz“ ist modernes, würdiges Deutsch und bildet die Aussage des Thronbesteigens beziehungsweise -sitzens natürlich ab.'
  terminology: „Reich“ ist in dieser Verbindung natürlicher als „Königreich“ und gibt βασιλεία angemessen wieder. „Lager“ für παρεμβολή vermeidet eine unnötige Festlegung auf „Heer“ und entspricht dem englischen Audit-Trail („camp“).
