base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/053.yaml
  text: And I joined battle with him[a], and he and his camp were crushed by us, and we sat on the throne of his kingdom;
translation:
  language: de
  text: Und ich trat gegen ihn zum Kampf an, und er und sein Lager wurden von uns zerschmettert, und wir nahmen auf dem Thron seines Reiches Platz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆψα πρὸς αὐτὸν μάχην
  choice: ich trat gegen ihn zum Kampf an
  rationale: Die Wendung gibt das militärische Idiom συνάπτω μάχην natürlich und zugleich quellennah wieder; πρὸς αὐτόν wird mit „gegen ihn“ ausdrücklich abgebildet.
- source_word: συνετρίβη
  choice: wurden zerschmettert
  rationale: „Zerschmettert“ bewahrt die starke Bildwirkung von συντρίβω. Obwohl das griechische Verb im Singular steht, verlangt das zusammengesetzte Subjekt im Deutschen den Plural.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: sein Heer
  rationale: παρεμβολή kann im militärischen Zusammenhang sowohl das Lager als auch die dort versammelte Streitmacht bezeichnen. Zusammen mit dem besiegten Herrscher ist „Heer“ im Deutschen am klarsten und natürlichsten.
- source_word: ὑφʼ ἡμῶν
  choice: von uns
  rationale: Die schlichte Agensangabe bewahrt die Wir-Perspektive des Sprechers ohne erläuternde Erweiterung.
- source_word: ἐκαθίσαμεν
  choice: wir setzten uns
  rationale: Die mediale deutsche Formulierung entspricht dem konkreten Bild des Sichsetzens; der folgende Thronbezug macht die Herrschaftsübernahme deutlich.
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: auf den Thron seines Königreichs
  rationale: Die Wiedergabe erhält sowohl θρόνος als auch βασιλεία und lässt den Bezug von αὐτοῦ auf den besiegten Gegner bestehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar militärisch-königlichem Ton. Das starke „zerschmettert“ wahrt die Bildkraft der Vorlage; „Heer“ vermeidet das im Deutschen mögliche Missverständnis, lediglich ein Feldlager sei zerstört worden.
