lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Die einfache Konjunktion bewahrt den parataktischen Erzählfluss des Griechischen.
- source_word: ἤκουσεν
  choice: hörte
  rationale: Der Aorist von ἀκούω bezeichnet hier, dass Demetrius die zuvor berichteten Worte vernahm; „hörte“ gibt den schlichten Erzählsinn wieder.
- source_word: Δημήτριος
  choice: Demetrius
  rationale: Der Personenname wird gemäß der im Deutschen üblichen Form wiedergegeben.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: λόγοι kann „Worte“, „Aussagen“ oder „Botschaft“ bedeuten. „Diese Worte“ ist hier natürlich und bleibt nahe an der griechischen Formulierung.
- source_word: καὶ
  choice: und
  rationale: Der bereitgestellte griechische Text bricht nach dieser Konjunktion ab. Das abschließende „und“ wird beibehalten, statt den fehlenden Satzteil zu ergänzen.
