  yaml_path: translation/deuterocanon/1_maccabees/004/019.yaml
  text: While Judas was still saying these things in a low voice[a], a certain part appeared, coming out from the mountain.
translation:
  language: de
  text: Noch während Judas dies mit gedämpfter Stimme sagte, wurde ein Teil[a] sichtbar, der vom Berg her auftauchte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier nur „ein Teil“; wahrscheinlich ist ein Teil des gegnerischen Heeres gemeint.
    reason: Die griechische Formulierung μέρος τι lässt den Bezug ausdrücklich offen, während der militärische Zusammenhang eine Streitmacht als Referenten nahelegt.
lexical_decisions:
- source_word: ἔτι ὑποφθεγγομένου Ἰούδου ταῦτα
  choice: Noch während Judas dies mit gedämpfter Stimme sagte
  rationale: Die Wendung bezeichnet eine noch andauernde, leise Äußerung des Judas. „Mit gedämpfter Stimme“ bewahrt die Nuance von ὑποφθεγγομένου, ohne das möglicherweise negativ klingende „murmeln“ zu verwenden.
- source_word: ὤφθη
  choice: wurde ... sichtbar
  rationale: Das Passiv hat hier den natürlichen Sinn „erschien“ beziehungsweise „kam in Sicht“. „Wurde sichtbar“ hebt den Wahrnehmungsvorgang hervor, ohne eine handelnde Person zu ergänzen.
- source_word: μέρος τι
  choice: ein Teil
  rationale: Die knappe, unbestimmte Formulierung des Griechischen bleibt erhalten. Der Kontext legt einen Teil der gegnerischen Streitmacht nahe, doch dieser Bezug wird nicht stillschweigend in den Haupttext eingefügt.
- source_word: ἐκκύπτον ἐκ τοῦ ὄρους
  choice: der vom Berg her auftauchte
  rationale: ἐκκύπτον bezeichnet hier das Hervortreten beziehungsweise Sichtbarwerden. „Vom Berg her“ gibt ἐκ τοῦ ὄρους idiomatisch wieder, ohne fälschlich ein Hervorkommen aus dem Inneren des Berges nahezulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur macht die zeitliche Überschneidung klar und bewahrt zugleich die auffällige Unbestimmtheit von μέρος τι.
