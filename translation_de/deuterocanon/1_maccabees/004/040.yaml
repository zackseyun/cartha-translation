  yaml_path: translation/deuterocanon/1_maccabees/004/040.yaml
  text: And they fell facedown on the ground[a], and they sounded the signal trumpets, and they cried out to heaven.
translation:
  language: de
  text: Und sie warfen sich mit dem Gesicht zur Erde nieder, bliesen die Signaltrompeten[a] und schrien zum Himmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Trompeten der Signale“. Gemeint sind wahrscheinlich Trompeten zur Signalgebung; σημαιῶν kann jedoch auch „Feldzeichen“ oder „Standarten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσον ἐπὶ πρόσωπον ἐπὶ τὴν γῆν
  choice: warfen sich mit dem Gesicht zur Erde nieder
  rationale: Die Formulierung gibt die konkrete Körperhaltung des griechischen Idioms natürlich und anschaulich wieder, ohne sie lediglich als allgemeine Anbetungshandlung zu deuten.
- source_word: ἐσάλπισαν
  choice: bliesen
  rationale: Das Verb bezeichnet das Blasen einer Trompete; „bliesen“ ist im Deutschen die natürliche Verbindung mit „Trompeten“.
- source_word: ταῖς σάλπιγξιν τῶν σημαιῶν
  choice: die Signaltrompeten
  rationale: 'Der Genitiv bezeichnet hier wahrscheinlich die Funktion der Trompeten: Sie wurden zur Signalgebung verwendet. Die echte Mehrdeutigkeit von σημαιῶν wird in der Fußnote bewahrt.'
- source_word: ἐβόησαν εἰς οὐρανόν
  choice: schrien zum Himmel
  rationale: „Schrien“ bewahrt die Intensität von ἐβόησαν, während „zum Himmel“ die Richtungsangabe εἰς οὐρανόν knapp und idiomatisch wiedergibt.
theological_decisions:
- issue: Adressat des Rufens zum Himmel
  choice: zum Himmel
  alternative: zu Gott
  rationale: Der griechische Text nennt ausdrücklich den Himmel und nicht Gott. Die Übersetzung wahrt diese Ausdrucksweise und löst die mögliche metonymische Bedeutung nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Satzfolge bleibt knapp und handlungsbetont; „sich niederwerfen“ vermittelt die körperliche Haltung verständlich, ohne eine bestimmte kultische Deutung hinzuzufügen.
