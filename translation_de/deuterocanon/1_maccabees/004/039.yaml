  text: And they tore their garments[a], and made great lamentation, and put ashes on their heads.
translation:
  language: de
  text: Da zerrissen sie ihre Gewänder[a], erhoben eine große Klage und legten Asche auf ihre Köpfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zerreißen der Gewänder, die Klage und das Auflegen von Asche auf den Kopf sind in der biblischen Welt herkömmliche Zeichen von Trauer.
    reason: cultural_note
lexical_decisions:
- source_word: διέρρηξαν
  choice: zerrissen
  rationale: Das Verb bezeichnet das Zerreißen von Stoff; im Zusammenhang ist die herkömmliche Trauergeste gemeint.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: ihre Gewänder
  rationale: Ἱμάτια bezeichnet allgemein Kleidung beziehungsweise Gewänder. „Gewänder“ wahrt den würdigen Erzählton.
- source_word: ἐκόψαντο κοπετὸν μέγαν
  choice: hielten eine große Totenklage
  rationale: Die Verbindung aus stammverwandtem Verb und Substantiv bezeichnet eine ausgeprägte, rituelle Klage. „Totenklage halten“ gibt den idiomatischen Sinn wieder, ohne eine nicht ausdrücklich genannte Körpergebärde hinzuzufügen.
- source_word: σποδὸν
  choice: Asche
  rationale: Das kollektive Singularwort bezeichnet Asche; im Deutschen steht es in dieser Trauerhandlung natürlich im Singular.
- source_word: ἐπέθεντο … ἐπὶ τὴν κεφαλὴν αὐτῶν
  choice: streuten sich … auf den Kopf
  rationale: Wörtlich wird die Asche auf den Kopf gelegt. „Streuten sich Asche auf den Kopf“ ist die natürliche deutsche Formulierung für die konkrete Handlung; der Singular „den Kopf“ wird distributiv auf die Mehrzahl bezogen.
