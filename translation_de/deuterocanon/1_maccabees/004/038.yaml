base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/038.yaml
  text: And they saw our sanctuary laid waste[a], and the altar defiled, and the gates burned down, and in the courts plants growing as in a thicket or as on one of the mountains[b], and the chambers torn down.
translation:
  language: de
  text: Und sie sahen, dass unser Heiligtum verwüstet, der Altar entweiht und die Tore niedergebrannt waren, dass in den Höfen Pflanzen wuchsen wie in einem Dickicht oder auf einem der Berge und dass die Kammern[a] niedergerissen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Kammern« sind Räume gemeint, die zum Tempelkomplex gehörten; ihre genaue Lage und Funktion sind nicht sicher.
    reason: cultural_note
lexical_decisions:
- source_word: ἁγίασμα
  choice: Heiligtum
  rationale: Im Zusammenhang des Tempels bezeichnet das Wort den heiligen Bezirk beziehungsweise die heilige Stätte; »Heiligtum« ist dafür die natürliche und kultisch passende deutsche Wiedergabe.
- source_word: ἠρημωμένον
  choice: verwüstet
  rationale: Das Partizip beschreibt einen zerstörten und verödeten Zustand; »verwüstet« gibt diesen Ergebniszustand knapp und idiomatisch wieder.
- source_word: θυσιαστήριον
  choice: Altar
  rationale: Die übliche und eindeutige Wiedergabe des kultischen Begriffs.
- source_word: βεβηλωμένον
  choice: entweiht
  rationale: Das Wort bezeichnet die Schändung beziehungsweise Profanierung dessen, was heilig ist; »entweiht« erhält den kultischen Sinn.
- source_word: πύλας κατακεκαυμένας
  choice: Tore niedergebrannt
  rationale: Das Perfektpartizip mit Präfix bezeichnet die vollendete Zerstörung durch Feuer; »niedergebrannt« drückt den resultierenden Zustand natürlich aus.
- source_word: αὐλαῖς
  choice: Vorhöfen
  rationale: Gemeint sind die Höfe des Tempelkomplexes; »Vorhöfe« ist im Deutschen eine geläufige Bezeichnung dafür.
- source_word: φυτὰ πεφυκότα
  choice: Pflanzen wuchsen
  rationale: Die schlichte Formulierung bewahrt das Bild unkontrollierter Vegetation, ohne bestimmte Pflanzenarten vorauszusetzen.
- source_word: δρυμῷ
  choice: Dickicht
  rationale: Das Vergleichsbild ist dichter, wilder Bewuchs; »Dickicht« gibt dies im Kontext anschaulich wieder.
- source_word: παστοφόρια
  choice: Kammern
  rationale: Der Ausdruck bezeichnet Räume im Zusammenhang mit dem Tempelkomplex, doch ihre genaue Lage oder Funktion ist nicht sicher; »Kammern« vermeidet eine unbelegte Präzisierung.
- source_word: καθῃρημένα
  choice: niedergerissen
  rationale: Das Partizip bezeichnet den Zustand nach Abbruch oder Zerstörung und wird mit »niedergerissen« anschaulich und genau wiedergegeben.
