  text: Da kehrten Judas und die Streitmacht um und brachen die Verfolgung ab,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: kehrten … um
  rationale: Das Verb bezeichnet hier im militärischen Handlungsablauf einen Richtungswechsel. Wegen des zusammengesetzten Subjekts steht das deutsche Verb im Plural.
- source_word: ἡ δύναμις
  choice: die Streitmacht
  rationale: δύναμις bezeichnet in diesem militärischen Zusammenhang eine bewaffnete Truppe. „Streitmacht“ bleibt nah am Griechischen, ohne den höheren Organisationsgrad anzunehmen, den „Armee“ nahelegen könnte.
- source_word: ἀπὸ τοῦ διώκειν
  choice: brachen die Verfolgung ab
  rationale: Die Verbindung aus ἀπό und substantiviertem Infinitiv drückt das Aufhören mit einer Tätigkeit aus. Die deutsche Wendung gibt dies klar und idiomatisch wieder.
- source_word: ὀπίσθεν αὐτῶν
  choice: die Verfolgung
  rationale: Im Zusammenhang ist das räumliche „hinter ihnen her“ bereits im Begriff der Verfolgung enthalten. Eine zusätzliche Wiedergabe als „hinter ihnen her“ wäre im Deutschen unnötig schwerfällig.
