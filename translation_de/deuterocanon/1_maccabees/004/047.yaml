  yaml_path: translation/deuterocanon/1_maccabees/004/047.yaml
  text: And they took whole stones according to the law[b][a], and built a new altar as before.
translation:
  language: de
  text: Und sie nahmen unversehrte Steine, wie es das Gesetz vorschreibt,[a] und bauten einen neuen Altar wie zuvor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unbehauene Steine“. Wörtlich steht im Griechischen „ganze/unversehrte Steine“; der Hinweis auf das Gesetz spielt wahrscheinlich auf die Vorschriften für Altarsteine an.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „nach dem früheren Vorbild“ oder, mit Bezug auf den früheren Altar: „wie den früheren Altar“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: sie nahmen
  rationale: Der Aorist von λαμβάνω bezeichnet hier das konkrete Nehmen beziehungsweise Beschaffen des Baumaterials.
- source_word: λίθους ὁλοκλήρους
  choice: unversehrte Steine
  rationale: ὁλόκληρος bedeutet ganz, vollständig oder unversehrt. „Unversehrt“ wahrt den griechischen Wortlaut, ohne die aus dem Gesetz erschlossene Bedeutung „unbehauen“ direkt in den Haupttext einzutragen.
- source_word: κατὰ τὸν νόμον
  choice: wie es das Gesetz vorschreibt
  rationale: Die Wendung bezeichnet Übereinstimmung mit der gesetzlichen Vorschrift. Diese Formulierung klingt im modernen Deutschen natürlich und hält den ausdrücklichen Bezug auf das Gesetz fest.
- source_word: ᾠκοδόμησαν
  choice: bauten
  rationale: Das Verb bedeutet bauen oder errichten. „Wiederaufbauen“ würde den Kontext stärker ausdeuten, als es der griechische Wortlaut selbst tut.
- source_word: θυσιαστήριον καινὸν
  choice: einen neuen Altar
  rationale: Direkte und idiomatische Wiedergabe von θυσιαστήριον und καινός.
- source_word: κατὰ τὸ πρότερον
  choice: wie den früheren
  rationale: Die substantivierte Form τὸ πρότερον kann auf das Frühere beziehungsweise den früheren Altar bezogen werden. Die knappe deutsche Vergleichsform bewahrt diesen Bezug, ohne ein bestimmtes Baumuster ausdrücklich vorauszusetzen.
theological_decisions:
- issue: Soll der Tora-Hintergrund in der Beschreibung der Steine ausdrücklich gemacht werden?
  choice: Im Haupttext steht „unversehrte Steine“; die mögliche Bedeutung „unbehauene Steine“ wird in einer Fußnote genannt.
  alternative: Im Haupttext „unbehauene Steine“ schreiben.
  rationale: Der griechische Text sagt ausdrücklich „ganze/unversehrte Steine“ und fügt den Gesetzesbezug gesondert hinzu. „Unbehauen“ ist aufgrund der Altargesetze wahrscheinlich gemeint, bleibt hier aber eine kontextuelle Folgerung.
- issue: Bezug von κατὰ τὸ πρότερον
  choice: „wie den früheren“ als Vergleich mit dem früheren Altar.
  alternative: „wie zuvor“ oder „nach dem früheren Vorbild“.
  rationale: Die griechische Formulierung lässt sowohl eine allgemein adverbiale als auch eine auf den früheren Altar bezogene Deutung zu. Der Haupttext gibt den naheliegenden Gegenstandsbezug wieder; die Fußnote bewahrt die Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unversehrt“ ist verständlicher als das hier ungebräuchliche „ganz“ und weniger ausdeutend als „unbehauen“. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Wendung.
