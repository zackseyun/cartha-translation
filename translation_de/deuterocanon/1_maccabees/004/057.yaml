  yaml_path: translation/deuterocanon/1_maccabees/004/057.yaml
  text: And they adorned the front of the temple with golden crowns and small shields[a], and they renewed the gates and the side chambers, and they fitted them with doors.
translation:
  language: de
  text: Und sie schmückten die Vorderseite des Tempels mit goldenen Kränzen[a] und kleinen Schilden. Auch erneuerten sie die Tore und die Seitenkammern und versahen sie mit Türen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »goldenen Kronen« beziehungsweise »goldenen Girlanden«; das griechische Wort kann sowohl Schmuckkränze als auch Kronen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκόσμησαν
  choice: schmückten
  rationale: Das Verb bezeichnet das Ausschmücken oder Verzieren; »schmückten« ist natürlich, gegenwärtig und gibt den dekorativen Sinn präzise wieder.
- source_word: τὸ κατὰ πρόσωπον τοῦ ναοῦ
  choice: die Vorderseite des Tempels
  rationale: Die Wendung bezeichnet den vorderen beziehungsweise zugewandten Teil des Tempels. »Vorderseite« ist verständlich und vermeidet den fachsprachlicheren Ausdruck »Fassade«.
- source_word: στεφάνοις χρυσοῖς
  choice: goldenen Kränzen
  rationale: στέφανος kann Kranz oder Krone bedeuten. Im Zusammenhang architektonischen Schmucks ist »Kränze« besonders naheliegend, ohne die andere mögliche Bedeutung auszuschließen.
- source_word: ἀσπιδίσκαις
  choice: kleinen Schilden
  rationale: Die Verkleinerungsform bezeichnet kleine, hier wohl als Schmuck dienende Schilde. Die gewählte Wiedergabe ist klarer als ein seltener Fachausdruck.
- source_word: ἐνεκαίνισαν
  choice: erneuerten
  rationale: Das Verb kann erneuern, neu einweihen oder wiederherstellen bedeuten. Da Tore und Seitenkammern die Objekte sind, passt hier das sachlich offene »erneuerten«.
- source_word: πύλας
  choice: Tore
  rationale: πύλαι bezeichnet gewöhnlich Tore oder Toranlagen. »Tore« wahrt zudem die Unterscheidung von den anschließend genannten Türen.
- source_word: παστοφόρια
  choice: Seitenkammern
  rationale: Das Wort bezeichnet zum Heiligtumskomplex gehörende Räume. »Seitenkammern« beschreibt ihre bauliche Zuordnung, ohne eine nicht ausdrücklich genannte Nutzung festzulegen.
- source_word: ἐθύρωσαν αὐτά
  choice: versahen sie mit Türen
  rationale: Das Verb bedeutet, etwas mit Türen auszustatten. Diese Formulierung ist idiomatisch und lässt das Pronomen wie im Griechischen auf die zuvor genannten baulichen Elemente zurückweisen.
