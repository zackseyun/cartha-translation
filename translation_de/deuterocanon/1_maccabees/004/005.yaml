  text: And Gorgias came to the camp of Judas by night, and found no one; and he was looking for them in the mountains, because he said, “These men are fleeing from us.”
translation:
  language: de
  text: 'Gorgias kam in der Nacht zum Lager des Judas, fand aber niemanden. Darauf suchte er sie in den Bergen, denn er sagte: »Diese Männer fliehen vor uns.«'
