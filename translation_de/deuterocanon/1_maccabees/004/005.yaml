- source_word: ἐζήτει
  choice: suchte
  rationale: Gibt die fortdauernde Suche natürlich und präzise wieder.
- source_word: ἐν τοῖς ὄρεσιν
  choice: in den Bergen
  rationale: Entspricht der räumlichen Angabe des griechischen Textes ohne unnötige Präzisierung.
- source_word: Φεύγουσιν
  choice: fliehen
  rationale: Das Präsens bewahrt die unmittelbare Einschätzung des Gorgias.
