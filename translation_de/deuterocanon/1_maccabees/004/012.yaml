  yaml_path: translation/deuterocanon/1_maccabees/004/012.yaml
  text: And the foreigners lifted up their eyes and saw them encamped opposite them,[a]
translation:
  language: de
  text: Da erhoben die Fremden ihre Augen und sahen sie ihnen gegenüber stehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihnen gegenüber aufgestellt“ oder „ihnen gegenüber in Stellung“. Das griechische Partizip kann bezeichnen, dass sie sich dort befanden oder dort aufgestellt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλόφυλοι
  choice: die Fremden
  rationale: Das Wort bezeichnet hier allgemein die nichtjüdischen gegnerischen Kräfte, nicht speziell die Philister. „Die Fremden“ bewahrt die ethnische Außenseiterperspektive, ohne die Referenz zu verengen.
- source_word: ἦραν ... τοὺς ὀφθαλμοὺς αὐτῶν
  choice: erhoben ... ihre Augen
  rationale: Die anschauliche biblische Wendung bleibt erhalten und ist im Deutschen verständlich; gemeint ist, dass sie aufblickten.
- source_word: ἶδαν
  choice: sahen
  rationale: Die einfache Vergangenheitsform gibt den Aorist in der fortlaufenden Erzählung direkt wieder.
- source_word: ἐχομένους
  choice: sich ... aufstellen
  rationale: Im militärischen Zusammenhang beschreibt das Partizip wahrscheinlich, dass die Gegner eine Stellung einnahmen oder sich formierten. Die Formulierung wahrt stärker als „lagern“ den möglichen dynamischen Sinn.
- source_word: ἐξ ἐναντίας
  choice: ihnen gegenüber
  rationale: Die Wendung bezeichnet eine Position auf der gegenüberliegenden Seite beziehungsweise mit Blickrichtung auf sie, ohne zusätzliche Einzelheiten zur Kampfhandlung einzutragen.
