  text: Sie flohen alle in das Land der Fremden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Land der anderen Völker“. Das griechische Wort bezeichnet Menschen, die einem anderen Volk angehören, und meint hier wahrscheinlich allgemein fremde Völker, nicht speziell die Philister.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγον
  choice: flohen
  rationale: Der Aorist von φεύγω bezeichnet hier die Flucht aus einer militärischen Gefahr; „flohen“ ist knapp, natürlich und wahrt den Rückzugssinn.
- source_word: πάντες
  choice: sie … alle
  rationale: Das substantivisch gebrauchte πάντες bezeichnet die Gesamtheit der zuvor genannten Personen. Die geteilte Formulierung „Sie flohen alle“ ist im Deutschen idiomatisch.
- source_word: γῆν
  choice: Land
  rationale: γῆ bezeichnet in diesem geografisch-militärischen Zusammenhang ein Land oder Gebiet; „Land“ ist die direkte und am wenigsten deutende Wiedergabe.
- source_word: ἀλλοφύλων
  choice: der Fremden
  rationale: ἀλλόφυλος bezeichnet Angehörige eines anderen Volkes. „der Fremden“ erhält die allgemeine ethnische Bezeichnung, ohne sie hier vorschnell auf die Philister zu verengen.
