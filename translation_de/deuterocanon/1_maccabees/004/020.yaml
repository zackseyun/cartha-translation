  text: And he saw that they had been routed[a], and that they were setting the camp on fire; for the smoke that was visible made what had happened clear.
translation:
  language: de
  text: Und er sah, dass sie in die Flucht geschlagen worden waren[a] und das Lager in Brand setzten; denn der sichtbare Rauch machte deutlich, was geschehen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass sie zurückgewichen waren“ beziehungsweise „dass sie zurückgeschlagen worden waren“; das griechische Verb kann im militärischen Zusammenhang bedeuten, dass jemand zum Rückzug gezwungen oder in die Flucht geschlagen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδεν
  choice: er sah
  rationale: Der Aorist von ὁράω bezeichnet hier die unmittelbare Wahrnehmung dessen, was auf dem Schlachtfeld zu erkennen war.
- source_word: τετρόπωται
  choice: sie in die Flucht geschlagen worden waren
  rationale: Die Perfektform von τρέπω beschreibt im militärischen Zusammenhang eine bereits eingetretene Flucht oder Zurückdrängung; die deutsche Wendung gibt Ergebnis und Passivbedeutung natürlich wieder.
- source_word: ἐνπυρίζουσιν
  choice: man ... in Brand setzte
  rationale: Das Verb bezeichnet das Anzünden oder In-Brand-Setzen. Das unbestimmte „man“ wahrt, dass im griechischen Satz kein ausdrückliches Subjekt genannt wird.
- source_word: τὴν παρεμβολήν
  choice: das Lager
  rationale: παρεμβολή ist der übliche militärische Ausdruck für ein Heerlager; „Lager“ ist im Deutschen klar und natürlich.
- source_word: ὁ καπνὸς ὁ θεωρούμενος
  choice: der sichtbare Rauch
  rationale: Die attributive Partizipialkonstruktion hebt hervor, dass der Rauch wahrnehmbar war; „sichtbar“ gibt dies idiomatisch und knapp wieder.
- source_word: ἐνεφάνιζε
  choice: machte deutlich
  rationale: Das Imperfekt bezeichnet hier, dass der Rauch den Sachverhalt erkennen ließ; „machte deutlich“ bewahrt den offenbarenden beziehungsweise erschließenden Sinn.
- source_word: τὸ γεγονός
  choice: was geschehen war
  rationale: Das substantivierte Perfektpartizip verweist auf das bereits eingetretene Geschehen; die gewählte Formulierung ist natürlich und erhält den resultativen Aspekt.
