  yaml_path: translation/deuterocanon/1_maccabees/004/034.yaml
  text: And they engaged one another in battle[a], and about five thousand men from the camp of Lysias fell[b], and they fell before them.
translation:
  language: de
  text: Da trafen sie im Kampf aufeinander, und aus dem Lager des Lysias fielen etwa fünftausend Mann[a]; sie fielen ihnen gegenüber[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fünftausend Mann“; die griechische Formulierung kann eine ungefähre Zahl oder eine erreichte Gesamtzahl bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor ihnen“ beziehungsweise „ihnen direkt gegenüber“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλον ἀλλήλοις
  choice: sie trafen im Kampf aufeinander
  rationale: Die militärische Bedeutung von συμβάλλω wird natürlich wiedergegeben; „aufeinander“ bewahrt den wechselseitigen Sinn von ἀλλήλοις.
- source_word: ἔπεσον
  choice: fielen
  rationale: „Fielen“ ist im Kampfbericht sowohl wörtlich als auch idiomatisch und lässt die im Griechischen nur angedeutete Todesfolge unausgesprochen.
- source_word: ἐκ τῆς παρεμβολῆς Λυσίου
  choice: aus dem Lager des Lysias
  rationale: παρεμβολή bezeichnet hier das militärische Lager beziehungsweise die dort versammelte Streitmacht; die knappe Formulierung erhält die griechische Genitivverbindung.
- source_word: εἰς πεντακισχιλίους ἄνδρας
  choice: etwa fünftausend Mann
  rationale: εἰς kann bei Zahlen einen ungefähren Umfang oder eine erreichte Gesamtzahl ausdrücken. „Etwa“ gibt diese mögliche Nuance verständlich wieder.
- source_word: ἐξ ἐναντίας αὐτῶν
  choice: ihnen gegenüber
  rationale: Die Wendung bezeichnet eine Position gegenüber der anderen Seite. Die bewusst knappe Wiedergabe erhält die räumliche Aussage und die Wiederholung von ἔπεσαν.
