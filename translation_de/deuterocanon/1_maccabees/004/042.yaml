  yaml_path: translation/deuterocanon/1_maccabees/004/042.yaml
  text: And he chose blameless priests[a], devoted to the law.
translation:
  language: de
  text: Und er wählte untadelige Priester aus, die dem Gesetz ergeben waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Priester ohne Makel, die für das Gesetz eiferten.“ Das Griechische kann sowohl Mangelfreiheit als auch entschiedene Hingabe hervorheben.'
    reason: Lexikalische Alternativen zu ἀμώμους und θελητὰς sowie die damit verbundene Bedeutungsbreite.
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: wählte … aus
  rationale: Der Aorist von ἐπιλέγω bezeichnet eine bewusste Auswahl; „wählte … aus“ ist im modernen Deutsch natürlich und gibt den zielgerichteten Vorgang wieder.
- source_word: ἱερεῖς
  choice: Priester
  rationale: Im jüdischen Tempelkontext ist dies die sachlich eindeutige und übliche Wiedergabe von ἱερεῖς.
- source_word: ἀμώμους
  choice: untadelige
  rationale: ἀμώμους kann sowohl Schuldlosigkeit als auch Mangelfreiheit bezeichnen. „Untadelig“ ist verständlich und lässt die sittliche wie auch die kultische Eignung anklingen.
- source_word: θελητὰς
  choice: die … ergeben waren
  rationale: θελητής bezeichnet jemanden, der etwas will oder erstrebt. Im Zusammenhang mit νόμου drückt „ergeben“ eine positive, willentliche Bindung aus, ohne den Ausdruck einseitig als Eifer zu deuten.
- source_word: νόμου
  choice: dem Gesetz
  rationale: Obwohl der Artikel im Griechischen fehlt, bezeichnet νόμος hier sehr wahrscheinlich das bekannte jüdische Gesetz, die Tora. Im Deutschen macht der bestimmte Artikel diesen Bezug natürlich deutlich.
theological_decisions:
- issue: Ob νόμου allgemein als „Gesetz“ oder konkret als „dem Gesetz“ wiederzugeben ist
  choice: dem Gesetz
  alternative: Gesetz
  rationale: Im Erzählzusammenhang des 1. Makkabäerbuches ist das überlieferte jüdische Gesetz gemeint, nicht Gesetz im abstrakten Sinn. Der bestimmte Artikel verdeutlicht dies, ohne eine zusätzliche Lehrdeutung einzuführen.
- issue: Ob ἀμώμους vorwiegend moralisch oder kultisch zu verstehen ist
  choice: untadelige
  alternative: Priester ohne Makel
  rationale: Der griechische Ausdruck kann moralische Unbescholtenheit und kultische Mangelfreiheit bezeichnen. Die Hauptübersetzung wahrt diese Bedeutungsbreite; die stärker kultisch gefärbte Alternative wird in der Fußnote genannt.
- issue: Ob θελητὰς Hingabe oder besonderen Eifer bezeichnet
  choice: die dem Gesetz ergeben waren
  alternative: die für das Gesetz eiferten
  rationale: θελητής betont Wollen oder Verlangen. „Ergeben“ gibt die willentliche Bindung wieder, während „eiferten“ eine mögliche, aber stärkere Deutung darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Relativsatz vermeidet die schwerfällige Reihung mehrerer attributiver Adjektive und macht die willentliche Bindung an das Gesetz klar, ohne die Mehrdeutigkeit der griechischen Begriffe aufzulösen.
