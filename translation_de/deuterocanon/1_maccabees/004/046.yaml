  yaml_path: translation/deuterocanon/1_maccabees/004/046.yaml
  text: And they set the stones aside on the temple hill in a suitable place[a], until a prophet should come to give an answer concerning them.
translation:
  language: de
  text: Und sie legten die Steine an einem geeigneten Ort auf dem Tempelberg[a] beiseite, bis ein Prophet käme, um über sie Auskunft zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf dem Berg des Hauses“, das heißt auf dem Tempelberg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθεντο
  choice: legten … beiseite
  rationale: Die mediale Form bezeichnet hier das Verwahren für eine spätere Entscheidung. „Beiseitelegen“ ist natürlich und bewahrt den vorläufigen Charakter.
- source_word: τοὺς λίθους
  choice: die Steine
  rationale: Der Ausdruck verweist im Zusammenhang auf die zuvor entfernten Steine, nennt sie hier aber nur „die Steine“; die Übersetzung fügt daher „vom Altar“ nicht ein.
- source_word: ἐν τῷ ὄρει τοῦ οἴκου
  choice: auf dem Tempelberg
  rationale: Wörtlich steht „auf dem Berg des Hauses“. Gemeint ist der Berg beziehungsweise die Anhöhe des Tempels; „Tempelberg“ gibt dies im Deutschen klar und knapp wieder.
- source_word: ἐν τόπῳ ἐπιτηδείῳ
  choice: an einem geeigneten Ort
  rationale: ἐπιτήδειος bezeichnet einen passenden oder zweckmäßigen Ort. „Geeignet“ ist idiomatisch und semantisch zurückhaltend.
- source_word: μέχρι τοῦ παραγενηθῆναι
  choice: bis … käme
  rationale: Die Konstruktion bezeichnet einen aus Sicht der Erzählung noch erwarteten Zeitpunkt. Der Konjunktiv „käme“ bringt diese Zukunftsperspektive natürlich zum Ausdruck.
- source_word: προφήτην
  choice: ein Prophet
  rationale: Das artikellose Substantiv bezeichnet hier keinen ausdrücklich identifizierten Propheten. Die unbestimmte Wiedergabe wahrt diese Offenheit.
- source_word: τοῦ ἀποκριθῆναι περὶ αὐτῶν
  choice: der ihnen darüber Auskunft geben sollte
  rationale: ἀποκρίνομαι bedeutet „antworten“, hier im Sinn einer erbetenen maßgeblichen Auskunft; περὶ αὐτῶν bezieht sich auf die Steine. Die Formulierung vermeidet die stärkere Festlegung auf einen formellen Rechtsspruch.
theological_decisions:
- issue: Rolle des erwarteten Propheten
  choice: Ein künftig auftretender Prophet soll maßgebliche Auskunft über die Steine geben.
  alternative: Der Prophet soll ein förmliches Rechtsurteil über die Steine fällen; oder die Wendung bezeichnet nur einen unbestimmten Aufschub.
  rationale: Der griechische Text erwartet einen Propheten, der hinsichtlich der Steine antwortet. Die Übersetzung bewahrt diese Erwartung prophetischer Weisung, ohne Amt, Zeitpunkt oder rechtliches Verfahren näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt eng am Griechischen, ist jedoch idiomatisch; ungesagte Einzelheiten wie „Altarsteine“ werden nicht ergänzt.
