  terminology: „Tempelberg“, „geeigneter Ort“, „ein Prophet“ und „Auskunft“ sind passende, registergerechte Wiedergaben. Die Fußnote erläutert die idiomatische Wiedergabe von ἐν τῷ ὄρει τοῦ οἴκου zutreffend. Die revidierte Formulierung bewahrt die offene, nicht notwendig juristische Bedeutung von ἀποκριθῆναι περὶ αὐτῶν.
