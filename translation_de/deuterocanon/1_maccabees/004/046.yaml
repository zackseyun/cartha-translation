  source_fidelity: 'Der Entwurf gibt die Abfolge und den Inhalt des griechischen Textes insgesamt treffend wieder: Die Steine werden vorläufig an einem geeigneten Ort auf dem Tempelberg verwahrt, bis ein unbestimmter Prophet kommt, um hinsichtlich dieser Steine Auskunft zu geben. Die unbestimmte Wiedergabe von προφήτην und die zurückhaltende Wiedergabe von ἀποκριθῆναι sind angemessen.'
