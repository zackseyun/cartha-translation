  text: And they rose early in the morning on the twenty-fifth day of the ninth month—that is[b][a], the month Chislev—in the one hundred and forty-eighth year.
translation:
  language: de
  text: Am fünfundzwanzigsten Tag des neunten Monats – das ist der Monat Kislew – im hundertachtundvierzigsten Jahr standen sie früh am Morgen auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das hundertachtundvierzigste Jahr der seleukidischen Zeitrechnung.
    reason: cultural_note
lexical_decisions:
- source_word: ὤρθρισαν
  choice: standen sie früh auf
  rationale: Das Verb bezeichnet frühes Aufstehen bzw. Tätigwerden in der Frühe. „standen sie früh … auf“ ist natürliches modernes Deutsch und bewahrt den zeitlichen Akzent.
- source_word: τὸ πρωὶ
  choice: am Morgen
  rationale: Die Wendung verstärkt die bereits in ὤρθρισαν enthaltene frühe Tageszeit. „früh am Morgen“ gibt die leichte griechische Redundanz verständlich wieder.
- source_word: τῇ πέμπτῃ καὶ εἰκάδι
  choice: am fünfundzwanzigsten Tag
  rationale: Dies ist die übliche griechische Ausdrucksweise für den fünfundzwanzigsten Monatstag.
- source_word: τοῦ μηνὸς τοῦ ἐνάτου
  choice: des neunten Monats
  rationale: Die direkte Wiedergabe der Datumsangabe ist im Deutschen klar und idiomatisch.
- source_word: Χασελεὺ
  choice: Kislew
  rationale: Die im Deutschen gebräuchliche Form des jüdischen Monatsnamens ist „Kislew“; sie entspricht dem griechischen Χασελεύ.
- source_word: τοῦ ὀγδόου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ ἔτους
  choice: im hundertachtundvierzigsten Jahr
  rationale: Die Formulierung gibt die Jahreszahl idiomatisch wieder, ohne die im griechischen Vers nicht ausdrücklich genannte Ära in den Haupttext einzufügen.
theological_decisions:
- issue: Bezug der Jahreszählung
  choice: Die Datierung bleibt im Haupttext schlicht „im hundertachtundvierzigsten Jahr“.
  alternative: „im hundertachtundvierzigsten Jahr der seleukidischen Zeitrechnung“
  rationale: Der griechische Text nennt nur das Jahr; dass die seleukidische Ära gemeint ist, ergibt sich historisch aus dem Kontext und wird deshalb in einer Fußnote erläutert, nicht in den Text eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Datumsfolge wird beibehalten; der Satzbau wird für flüssiges Deutsch so geordnet, dass das Prädikat nach der vollständigen Datumsangabe steht. Die Wiederholung von frühem Aufstehen und Morgenzeit bleibt als „früh am Morgen“ erkennbar.
