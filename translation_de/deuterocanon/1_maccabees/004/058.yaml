revisions:
- from: Und im Volk herrschte überaus großer Jubel, und die Schmach der Völker[a] wurde abgewendet.
  to: Und im Volk herrschte überaus großer Jubel, und die durch die Völker zugefügte Schmach wurde abgewendet.[a]
  rationale: Die Revision löst den Genitiv entsprechend dem erzählerischen Kontext als von den Völkern zugefügte Schmach und entfernt die irreführende Gegenlesart. Das Passiv „wurde abgewendet“ bewahrt weiterhin die Offenheit des griechischen Textes hinsichtlich des Handelnden. Die Fußnote übernimmt stattdessen die vom englischen Audit-Trail belegte lexikalische Alternative zu ἀπεστράφη.
