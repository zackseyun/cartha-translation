lexical_decisions:
- source_word: ἐγενήθη
  choice: herrschte
  rationale: Die idiomatische deutsche Wendung gibt die erzählende Existenzformel natürlich wieder, ohne einen zusätzlichen Handelnden einzuführen.
- source_word: εὐφροσύνη μεγάλη … σφόδρα
  choice: überaus großer Jubel
  rationale: „Jubel“ bringt die gemeinschaftlich geäußerte, festliche Freude zum Ausdruck; „überaus groß“ bewahrt die starke Intensivierung durch μεγάλη und σφόδρα.
- source_word: ἐν τῷ λαῷ
  choice: im Volk
  rationale: Die Formulierung bezeichnet die im ganzen Volk verbreitete Freude und bleibt zugleich knapp und quellennah.
- source_word: ἀπεστράφη
  choice: wurde abgewendet
  rationale: Das Passiv bewahrt das Bild des Wegwendens und nennt keinen Handelnden, da auch der griechische Text keinen ausdrücklich nennt.
- source_word: ὀνειδὸς
  choice: Schmach
  rationale: „Schmach“ bezeichnet öffentliche Entehrung und entspricht dem biblisch-historischen Zusammenhang besser als ein bloß inneres Schamgefühl.
- source_word: ἐθνῶν
  choice: der Völker
  rationale: „Völker“ ist die unmittelbare und konfessionell wenig vorgeprägte Wiedergabe; gemeint sind im Kontext die nichtjüdischen Völker.
theological_decisions:
- issue: Bezug von „Volk“ und „Völker“
  choice: Die traditionelle Gegenüberstellung „Volk“ und „Völker“ bleibt im Text erhalten.
  alternative: Israel beziehungsweise das jüdische Volk und die nichtjüdischen Völker ausdrücklich benennen.
  rationale: Der historische Kontext legt diese Bezüge nahe, doch die Übersetzung soll die knappe Ausdrucksweise des griechischen Textes nicht durch erklärende Zusätze ersetzen.
- issue: Genitiv in ὀνειδὸς ἐθνῶν
  choice: „Schmach der Völker“ bewahrt die formale Mehrdeutigkeit.
  alternative: „die von den Völkern zugefügte Schmach“ oder „die auf den Völkern liegende Schmach“.
  rationale: Der Genitiv kann die Völker als Urheber oder als Träger der Schmach kennzeichnen. Der Zusammenhang begünstigt die erste Deutung, zwingt aber grammatisch nicht zu einer eindeutigen Auflösung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jubel“ ist anschaulich und gemeinschaftsbezogen; die passivische Wendung „wurde abgewendet“ wahrt den leicht biblischen Ton und die Offenheit hinsichtlich des Handelnden.
