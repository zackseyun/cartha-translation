  text: And there was very great rejoicing among the people[a], and the reproach of the nations was turned away.
translation:
  language: de
  text: Und im Volk herrschte überaus großer Jubel, und die durch die Völker zugefügte Schmach wurde abgewendet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
