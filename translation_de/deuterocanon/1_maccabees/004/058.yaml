review_pass:
  verdict: revise
  source_fidelity: Der Satz gibt die griechische Existenzformel, die starke Intensivierung der Freude und das ungenannte Passiv von ἀπεστράφη insgesamt treffend wieder. Bei ὀνειδὸς ἐθνῶν legt jedoch der unmittelbare historische Zusammenhang nahe, dass die Völker die Schmach zufügen bzw. Israel damit verhöhnen; die Lesart einer Schmach, die auf den Völkern selbst liegt, ist hier nicht gleichrangig.
  naturalness: „Und im Volk herrschte überaus großer Jubel“ ist modernes, würdiges Deutsch. Die klarere Umschreibung des Genitivs ist ebenfalls natürlich und vermeidet eine im Deutschen unnötig irreführende Mehrdeutigkeit.
  terminology: „Volk“, „Völker“, „Jubel“ und „Schmach“ sind registergerecht und dem biblisch-historischen Kontext angemessen. „Durch die Völker“ gibt die im Kontext naheliegende Rolle der Völker wieder, ohne sie näher zu identifizieren oder einen göttlichen bzw. menschlichen Handelnden für das Abwenden zu ergänzen.
  issues:
  - severity: medium
    issue: Die Fußnote behandelt zwei Deutungen von „Schmach der Völker“ als gleichwertig.
    rationale: Zwar lässt der Genitiv formal verschiedene Beziehungen zu, doch im Kontext der Wiederherstellung des Kultes bezeichnet die Wendung die von den fremden Völkern über das Volk gebrachte Schmach. Die Alternative „auf ihnen liegende Schmach“ verkehrt den kontextuellen Bezug und sollte nicht als gleichberechtigte Auslegung angeboten werden.
  - severity: low
    issue: Die Fußnote entspricht nicht dem englischen Audit-Trail.
    rationale: Die englische Anmerkung dokumentiert die lexikalische Alternative „was removed“, nicht eine Genitivambiguität. Eine deutsche Anmerkung sollte daher entweder dieselbe Übersetzungsalternative bieten oder entfallen.
  revised_text: Und im Volk herrschte überaus großer Jubel, und die durch die Völker zugefügte Schmach wurde abgewendet.[a]
  revised_footnotes:
  - marker: a
    text: 'Oder: „wurde beseitigt“.'
