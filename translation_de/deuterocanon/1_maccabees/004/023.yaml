  yaml_path: translation/deuterocanon/1_maccabees/004/023.yaml
  text: And Judas returned to the plunder of the camp[a], and took much gold and silver, and blue cloth and purple cloth and sea goods[b], and great wealth.
translation:
  language: de
  text: Und Judas kehrte zur Beute des Lagers zurück und nahm viel Gold und Silber, blauen Stoff und Purpurstoff, Meereswaren[a] und großen Reichtum an sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „meerfarbenen Stoff“ oder „marinen Purpurstoff“. Das griechische Wort bedeutet wörtlich „zum Meer gehörig“; was damit in dieser Liste von Wertgegenständen genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: kehrte … zurück
  rationale: Das Verb bezeichnet hier die Rückkehr beziehungsweise das Umkehren zum zuvor verlassenen Lager.
- source_word: σκυλίαν τῆς παρεμβολῆς
  choice: Beute des Lagers
  rationale: σκυλία bezeichnet erbeutete Gegenstände; παρεμβολή meint im militärischen Zusammenhang das Lager.
- source_word: ἔλαβε
  choice: nahm … an sich
  rationale: Die Übersetzung bewahrt den grammatischen Singular und damit Judas als handelndes Subjekt; zugleich passt die Wendung natürlich zur Inbesitznahme von Beute.
- source_word: χρυσίον καὶ ἀργύριον πολὺ
  choice: viel Gold und Silber
  rationale: Die Mengenangabe πολὺ bezieht sich sinngemäß auf beide Edelmetalle und wird im Deutschen knapp und natürlich wiedergegeben.
- source_word: ὑάκινθον
  choice: blauen Stoff
  rationale: Das Wort kann eine blau bis blauviolett gefärbte kostbare Textilie bezeichnen; „Stoff“ verdeutlicht den sachlichen Zusammenhang der Wertgegenstände.
- source_word: πορφύραν
  choice: Purpurstoff
  rationale: πορφύρα bezeichnet Purpur beziehungsweise purpurgefärbten Luxusstoff; im Inventar ist die textile Bedeutung wahrscheinlich.
- source_word: θαλασσίαν
  choice: Güter aus dem Meer
  rationale: Das substantivierte feminine Adjektiv bedeutet wörtlich „zum Meer gehörig“ beziehungsweise „aus dem Meer“. Da der genaue Gegenstand unsicher ist, bleibt die Wiedergabe bewusst allgemein und wird durch eine Fußnote abgesichert.
- source_word: πλοῦτον μέγαν
  choice: großen Reichtum
  rationale: Die formnahe Wendung fasst den hohen Wert und Umfang der Beute zusammen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der Satzbau folgt der knappen Aufzählung des Griechischen, während „nahm … an sich“ im Deutschen die Aneignung der Beute idiomatisch ausdrückt. Die Unsicherheit bei θαλασσίαν wird nicht im Haupttext aufgelöst, sondern transparent in der Fußnote bewahrt.
