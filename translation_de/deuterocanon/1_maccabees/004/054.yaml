base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/054.yaml
  text: At the time[a], on the very day when the nations had defiled it[b], on that very day it was rededicated with songs and lyres and harps and cymbals.
translation:
  language: de
  text: Zu der Zeit, an genau dem Tag, an dem die Völker es entweiht hatten, wurde es an eben diesem Tag mit Liedern, Leiern, Harfen[a] und Zimbeln neu geweiht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Harfen“ wiedergegebene Wort bezeichnet ein Saiteninstrument, dessen genaue Bauart unsicher ist.
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸν καιρὸν κατὰ τὴν ἡμέραν
  choice: Zur selben Zeit, an genau dem Tag
  rationale: Die doppelte Zeitangabe bezeichnet die genaue zeitliche Entsprechung. Die deutsche Formulierung bewahrt die Wiederholung und den Nachdruck, ohne unnatürlich wörtlich zu klingen.
- source_word: ἐβεβήλωσαν
  choice: entweiht hatten
  rationale: Das Verb bezeichnet im sakralen Zusammenhang, dass etwas profan gemacht oder geschändet wird. „Entweihen“ ist im Deutschen präzise, verständlich und passt zum Heiligtumskontext.
- source_word: αὐτό
  choice: es
  rationale: Der griechische Text verwendet ein Pronomen, dessen Bezug aus dem Zusammenhang hervorgeht. „Es“ vermeidet eine im Vers selbst nicht ausdrücklich genannte Festlegung auf Heiligtum oder Altar.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Dies entspricht der Grundbedeutung und bewahrt die griechische Ausdrucksweise, ohne mit „Heiden“ eine stärker wertende oder altertümliche Bezeichnung einzuführen.
- source_word: ἐν ἐκείνῃ
  choice: wurde es
  rationale: Der Bezug auf denselben Tag wird bereits durch „an genau dem Tag“ unmittelbar vor dem Relativsatz eindeutig und betont ausgedrückt; die deutsche Satzführung kann danach ohne eine schwerfällige zweite volle Zeitangabe fortgesetzt werden.
- source_word: ἐνεκαινίσθη
  choice: neu geweiht
  rationale: Im kultischen Zusammenhang bezeichnet das Verb Erneuerung beziehungsweise erneute Weihe. „Neu geweiht“ ist idiomatisches modernes Deutsch und wahrt den Zusammenhang mit der Wiederherstellung des Gottesdienstes.
- source_word: ἐν ᾠδαῖς
  choice: mit Liedern
  rationale: Das instrumentale „mit“ ist im Deutschen natürlich. „Lieder“ bleibt so allgemein wie das griechische Wort und legt nicht ausdrücklich Hymnen fest.
- source_word: κιθάραις
  choice: Leiern
  rationale: κιθάρα bezeichnet ein Instrument vom Leiertyp; „Leiern“ unterscheidet es von dem folgenden, nicht sicher identifizierbaren Saiteninstrument.
- source_word: κινύραις
  choice: Harfen
  rationale: „Harfen“ ist eine herkömmliche, brauchbare Wiedergabe, doch die genaue Identifikation des antiken Instruments bleibt unsicher und wird daher in einer Fußnote kenntlich gemacht.
- source_word: κυμβάλοις
  choice: Zimbeln
  rationale: „Zimbeln“ ist die präzise und im biblisch-musikalischen Kontext geläufige deutsche Bezeichnung für das Schlaginstrument.
theological_decisions:
- issue: Kultischer Ausdruck für die Wiederherstellung nach der Entweihung
  choice: neu geweiht
  alternative: erneuert
  rationale: Die Erzählung handelt nicht bloß von baulicher Erneuerung, sondern von der Wiederherstellung des kultischen Gebrauchs. „Neu geweiht“ gibt diesen Sinn wieder, ohne über den griechischen Ausdruck hinaus eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genaue zeitliche Entsprechung von Entweihung und neuer Weihe wird hervorgehoben; das Pronomen „es“ bewahrt die im Einzelvers vorhandene Offenheit des Bezugs.
