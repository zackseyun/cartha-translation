  yaml_path: translation/deuterocanon/1_maccabees/004/031.yaml
  text: Hand over this camp into the hands of your people Israel, and let them be put to shame because of their army and their cavalry.
translation:
  language: de
  text: Liefere dieses Heerlager in die Hände deines Volkes Israel aus[a], und sie sollen wegen ihrer Macht und ihrer Reiterei zuschanden werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann wörtlicher „einschließen“ oder „einsperren“ bedeuten; hier ist gemeint, dass Gott das Heerlager Israel ausliefert.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „angesichts ihrer Macht und ihrer Reiterei“. Die griechische Wendung lässt das genaue Verhältnis offen; „Macht“ kann hier militärische Stärke bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: Liefere … aus
  rationale: Der Imperativ bedeutet wörtlich etwa „schließe ein“ oder „schließe zusammen“. Im Gebets- und Kampfkontext bezeichnet er hier die Auslieferung der feindlichen Streitmacht in Israels Gewalt. „Liefere … aus“ gibt diesen Sinn natürlich und würdig wieder.
- source_word: παρεμβολήν
  choice: Heerlager
  rationale: παρεμβολή kann sowohl ein Lager als auch die dort versammelte Streitmacht bezeichnen. „Heerlager“ bewahrt das konkrete Bild und macht zugleich den militärischen Zusammenhang deutlich.
- source_word: εἰς χεῖρας
  choice: in die Hände
  rationale: Die Wendung ist ein geläufiges biblisches Bild für die Übergabe in die Gewalt oder Verfügungsgewalt eines anderen und ist auch im modernen Deutschen verständlich.
- source_word: λαοῦ σου Ἰσραήλ
  choice: deines Volkes Israel
  rationale: Israel wird als Gottes Volk bezeichnet; die knappe deutsche Fügung erhält diese Zuordnung ohne erklärenden Zusatz.
- source_word: αἰσχυνθήτωσαν
  choice: sie sollen zuschanden werden
  rationale: Die jussivische Passivform zielt auf die durch Niederlage eintretende Beschämung, nicht nur auf ein inneres Schamgefühl. „Zuschanden werden“ wahrt den würdigen biblischen Ton.
- source_word: ἐπὶ τῇ δυνάμει
  choice: trotz ihrer Stärke
  rationale: ἐπί mit Dativ lässt hier mehr als eine Deutung zu. Im Zusammenhang ist wahrscheinlich gemeint, dass ihre eigene militärische Macht ihre Niederlage nicht verhindert. „Trotz“ macht diesen Zusammenhang idiomatisch deutlich, ohne δύναμις vorschnell auf „Heer“ zu verengen.
- source_word: τῇ ἵππῳ αὐτῶν
  choice: ihrer Reiterei
  rationale: ἵππος steht im militärischen Zusammenhang kollektiv für Pferde beziehungsweise berittene Truppen. „Reiterei“ ist die klare, natürliche Wiedergabe.
theological_decisions:
- issue: Gebet um die Auslieferung der feindlichen Streitmacht an Israel
  choice: Liefere dieses Heerlager in die Hände deines Volkes Israel aus
  alternative: Schließe dieses Heerlager in die Hände deines Volkes Israel ein
  rationale: Die Übersetzung bewahrt Gottes Handeln als erbetene Ursache des Sieges, gibt aber den griechischen Ausdruck in verständlichem Deutsch wieder. Die wörtlichere Alternative wäre im Deutschen missverständlich.
- issue: Verhältnis der Beschämung zur feindlichen Macht
  choice: zuschanden werden trotz ihrer Stärke und ihrer Reiterei
  alternative: zuschanden werden wegen ihrer Stärke und ihrer Reiterei
  rationale: 'Das griechische ἐπί mit Dativ ist semantisch offen. „Trotz“ passt zum Gebetszusammenhang: Die Gegner sollen ungeachtet ihrer militärischen Überlegenheit scheitern. Die mögliche kausale oder bezügliche Lesart wird in der Fußnote bewahrt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache („in die Hände“). „Heerlager“ hält die konkrete und kollektive Bedeutung von παρεμβολή zusammen. Die schwer festzulegende Präpositionalfügung ἐπὶ τῇ δυνάμει wird im Haupttext kontextgemäß und in der Fußnote mit ihren Alternativen wiedergegeben.
