  yaml_path: translation/deuterocanon/1_maccabees/004/011.yaml
  text: And all the nations will know that there is one who redeems and saves Israel[a].
translation:
  language: de
  text: Und alle Völker werden erkennen, dass es einen gibt, der Israel erlöst und rettet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass er es ist, der Israel erlöst und rettet«. Im Griechischen bleibt das Subjekt unausgesprochen.'
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσονται
  choice: werden erkennen
  rationale: Das Futur von γινώσκω bezeichnet hier das Erlangen einer Erkenntnis. »Werden erkennen« gibt sowohl den zukünftigen als auch den dynamischen Sinn natürlich wieder.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: Die Wendung bezeichnet sämtliche ethnisch-politischen Gemeinschaften. »Alle Völker« wahrt die universale Weite, ohne den Ausdruck vorschnell auf »Heiden« einzuengen.
- source_word: ὅτι ἔστιν
  choice: dass es einen gibt
  rationale: Vor den substantivierten Partizipien steht kein ausdrücklich genanntes Subjekt. Die existentielle Wiedergabe ist im Deutschen verständlich und vermeidet es, den Bezug im Haupttext genauer festzulegen als der griechische Wortlaut.
- source_word: ὁ λυτρούμενος
  choice: der … erlöst
  rationale: Das artikulierte Präsenspartizip bezeichnet denjenigen, dessen kennzeichnendes Handeln das Erlösen oder Befreien ist. »Erlöst« bewahrt das griechische Erlösungsvokabular und klingt in Verbindung mit »rettet« natürlich.
- source_word: σώζων
  choice: rettet
  rationale: Das Präsenspartizip von σῴζω bezeichnet hier rettendes beziehungsweise befreiendes Handeln. »Rettet« ist klar, prägnant und wahrt die mögliche theologische Resonanz.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Der Eigenname wird direkt wiedergegeben; der griechische Artikel erfordert im Deutschen keine Erweiterung zu »das Volk Israel«.
theological_decisions:
- issue: Unausgesprochenes Subjekt der substantivierten Partizipien
  choice: 'Existentiell: »dass es einen gibt, der Israel erlöst und rettet«'
  alternative: »dass er es ist, der Israel erlöst und rettet«
  rationale: Im Zusammenhang ist Gott der naheliegende Bezug, doch der griechische Satz nennt das Subjekt nicht ausdrücklich. Die Hauptfassung wahrt diese Zurückhaltung; die Fußnote dokumentiert die ebenfalls mögliche anaphorische Auffassung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität von »erlöst und rettet« bleibt erhalten; die Satzstruktur ist klar und für heutige Leserinnen und Leser unmittelbar verständlich.
