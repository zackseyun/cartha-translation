base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/027.yaml
  text: But when he heard all this[a], he was confounded and lost heart, because what had happened to Israel was not what he wanted, and what the king had commanded him had not come about.
translation:
  language: de
  text: Als er aber alles hörte, geriet er in Bestürzung und verlor den Mut[a], denn Israel war nicht das widerfahren, was er wollte, und es war nicht eingetreten, was der König ihm befohlen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde völlig verwirrt und war niedergeschlagen«.'
    reason: Lexikalische Alternative für συνεχύθη und ἤθυμει; beide Verben können stärker als innere Verwirrung und anhaltende Niedergeschlagenheit wiedergegeben werden.
lexical_decisions:
- source_word: συνεχύθη
  choice: geriet er in Bestürzung
  rationale: Das Passiv bezeichnet ein Versetztwerden in Verwirrung oder starke innere Unruhe. »Geriet in Bestürzung« gibt die emotionale und geistige Erschütterung in natürlichem, würdevollem Deutsch wieder.
- source_word: ἤθυμει
  choice: verlor den Mut
  rationale: Das Imperfekt beschreibt den anhaltenden Zustand der Entmutigung. Die deutsche Wendung ist geläufig und bewahrt den Sinn des Verzagens.
- source_word: οὐχ οἷα ἤθελεν
  choice: nicht das, was er gewollt hatte
  rationale: Die Formulierung stellt das tatsächliche Geschehen dem Willen oder Wunsch des Betreffenden gegenüber, ohne seine Absicht näher auszudeuten.
- source_word: γέγονεν τῷ Ἰσραήλ
  choice: Israel war … widerfahren
  rationale: Das Perfekt von γίνομαι bezeichnet hier das eingetretene Geschehen mit seinen Folgen für Israel. »Widerfahren« gibt den Dativ τῷ Ἰσραήλ knapp und idiomatisch wieder.
- source_word: ἐνετείλατο αὐτῷ ὁ βασιλεύς
  choice: wie der König es ihm befohlen hatte
  rationale: ἐντέλλομαι bezeichnet einen verbindlichen, autoritativen Auftrag; »befohlen« bewahrt die königliche Befehlsgewalt.
- source_word: ἐξέβη
  choice: es war nicht so ausgegangen
  rationale: ἐκβαίνω bezeichnet hier den Ausgang oder das Ergebnis der Ereignisse. Die Übersetzung vermeidet die stärkere Festlegung, der Befehl sei schlicht nicht ausgeführt worden.
