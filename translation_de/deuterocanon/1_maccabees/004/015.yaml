base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/015.yaml
  text: But all the rear guard fell by the sword[a], and they pursued them as far as Gazara and as far as the plains of Judea and Azotus and Jamnia[c][b], and about three thousand of them fell.
translation:
  language: de
  text: Doch alle, die ganz hinten waren, fielen unter dem Schwert. Die Juden verfolgten sie bis Geser, bis zu den Ebenen Judäas sowie bis nach Aschdod und Jamnia.[a][b] Von ihnen fielen etwa dreitausend Mann.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht die Namensform Gazara; der Ort wird allgemein mit Geser identifiziert.
    reason: cross_reference
  - marker: b
    text: Aschdod heißt im Griechischen Azotos; Jamnia wird gewöhnlich mit Jabne/Javne identifiziert.
    reason: cross_reference
  - marker: c
    text: 'Auch möglich: „Von ihnen fielen dreitausend Mann.“ Die griechische Zählformel kann als ungefähre Angabe verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔσχατοι πάντες
  choice: Doch alle, die ganz hinten waren
  rationale: ἔσχατοι bezeichnet wörtlich die Letzten beziehungsweise die am weitesten hinten Befindlichen. Die Formulierung wahrt diese Bedeutung, ohne mit „Nachhut“ eine möglicherweise organisierte militärische Einheit vorauszusetzen.
- source_word: ἔπεσαν ἐν ῥομφαίᾳ
  choice: fielen durch das Schwert
  rationale: Die geläufige Kampfformel wird bildnah und in würdigem, verständlichem Deutsch wiedergegeben.
- source_word: ἐδίωξαν αὐτούς
  choice: Die Juden verfolgten sie
  rationale: ἐδίωξαν bedeutet hier militärisch „verfolgten“. Das im Griechischen unausgesprochene Subjekt wird zur eindeutigen Bezugnahme aus dem Zusammenhang als „die Juden“ benannt.
- source_word: ἕως Γαζήρων
  choice: bis Geser
  rationale: Γαζηρα wird allgemein mit dem biblischen Ort Geser identifiziert. Die im Deutschen etablierte Namensform ist verständlicher; die griechische Form wird in einer Fußnote genannt.
- source_word: τῶν πεδίων τῆς Ἰουδαίας
  choice: in die Ebenen von Judäa
  rationale: πεδία bezeichnet offene, ebene Landschaften. Nach „bis“ macht „in die Ebenen“ die räumliche Bewegungsrichtung im Deutschen natürlich deutlich.
- source_word: Ἀζώτου
  choice: Aschdod
  rationale: Ἄζωτος ist die griechische Namensform des als Aschdod bekannten Ortes. Die geläufige deutsche biblische Form steht im Text; die griechische Form wird in der Fußnote dokumentiert.
- source_word: Ἰαννείας
  choice: Jamnia
  rationale: Jamnia ist die im Deutschen gebräuchliche Form für den in der griechischen Überlieferung genannten und mit Jabne/Javne identifizierten Ort.
- source_word: ἔπεσαν ἐξ αὐτῶν εἰς ἄνδρας τρισχιλίους
  choice: Von ihnen fielen etwa dreitausend Mann
  rationale: Die Verbindung εἰς ἄνδρας mit der Zahl gibt idiomatisch eine ungefähre Zahl der Gefallenen an. „Mann“ bewahrt zugleich den ausdrücklich männlichen Zählbegriff ἄνδρας.
