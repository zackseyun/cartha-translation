  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Textes insgesamt zutreffend wieder: die am weitesten hinten Befindlichen fallen, die gegnerische Seite wird verfolgt, und die Zahl der Gefallenen beträgt ungefähr dreitausend. Die explizite Subjektsnennung „Die Juden“ ist aus dem Kontext erschließbar und klärt im Deutschen den sonst mehrdeutigen Pronomenbezug.'
  naturalness: „Durch das Schwert fielen“ ist im modernen Deutsch weniger idiomatisch als „unter dem Schwert fielen“. Außerdem kann „in die Ebenen von Judäa, Aschdod und Jamnia“ die drei Ortsangaben fälschlich als gemeinsame Ergänzung zu „Ebenen von“ verbinden. Eine koordinierende Formulierung macht die geographische Reihung des Griechischen klar.
  terminology: Die gewählten deutschen Ortsnamen Geser und Aschdod sind mit den erläuternden Fußnoten vertretbar. „Mann“ gibt ἄνδρας angemessen wieder. Die Wiedergabe von οἱ ἔσχατοι als „alle, die ganz hinten waren“ bewahrt die offene Formulierung des Griechischen, ohne eine formell organisierte Nachhut zu unterstellen.
