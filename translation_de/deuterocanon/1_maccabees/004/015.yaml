translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die wahrscheinlich militärische Bedeutung von ἔσχατοι wird nicht durch den spezifischeren Fachausdruck „Nachhut“ überbestimmt. Geläufige deutsche Ortsnamen stehen im Haupttext, während die griechischen Namensformen beziehungsweise Identifizierungen in den Fußnoten erhalten bleiben.
