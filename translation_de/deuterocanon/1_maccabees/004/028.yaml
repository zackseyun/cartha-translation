base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/028.yaml
  text: And in the following year he assembled sixty thousand chosen men and five thousand cavalry[b][a], so as to make war against them.
translation:
  language: de
  text: Und im folgenden Jahr zog er 60.000 ausgewählte Männer und 5.000 Reiter zusammen, um gegen sie Krieg zu führen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ἐρχομένῳ ἐνιαυτῷ
  choice: im folgenden Jahr
  rationale: Wörtlich steht »im kommenden Jahr«; im Erzählzusammenhang gibt »im folgenden Jahr« den zeitlichen Bezug auf die zuvor berichteten Ereignisse natürlich und genau wieder.
- source_word: συνελόχησεν
  choice: zog ... zusammen
  rationale: Das Verb bezeichnet hier das Sammeln beziehungsweise Aufstellen von Truppen. »zog ... zusammen« ist im Deutschen idiomatisch und bleibt hinsichtlich der genauen Art der Mobilmachung zurückhaltend.
- source_word: ἀνδρῶν ἐπιλέκτων
  choice: ausgewählte Männer
  rationale: ἐπίλεκτος bezeichnet eigens ausgewählte oder erlesene Männer. Die Wiedergabe bewahrt den Auswahlaspekt, ohne mit »Elitetruppen« zusätzliche militärische Spezialisierung anzudeuten.
- source_word: ἑξήκοντα χιλιάδας
  choice: '60.000'
  rationale: Direkte Wiedergabe der Truppenzahl in moderner deutscher Zahlenschreibung.
- source_word: πεντακισχιλίαν ἵππον
  choice: 5.000 Reiter
  rationale: ἵππος steht im militärischen Zusammenhang kollektiv für berittene Soldaten. »Reiter« ist im Deutschen präziser und natürlicher als eine wörtliche Wiedergabe mit »Pferd«.
- source_word: ὥστε ἐκπολεμῆσαι αὐτούς
  choice: um gegen sie Krieg zu führen
  rationale: ὥστε mit dem Infinitiv drückt hier Zweck beziehungsweise beabsichtigte Folge aus; ἐκπολεμέω bezeichnet ein kriegerisches Vorgehen gegen jemanden. Die Formulierung erhält die stärkere militärische Bedeutung gegenüber dem allgemeineren »kämpfen«.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die Satzstruktur folgt dem griechischen Erzählgang, klingt aber natürlich deutsch. Da »im folgenden Jahr« und »Reiter« die kontextuelle Bedeutung ohne nennenswerten Bedeutungsverlust wiedergeben, sind keine Fußnoten erforderlich.
