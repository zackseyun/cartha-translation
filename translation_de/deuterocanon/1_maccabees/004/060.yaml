base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/060.yaml
  text: And at that time they built up Mount Zion with high walls all around and strong towers[a], lest the nations come and trample it, as they had done before.
translation:
  language: de
  text: Und zu jener Zeit bauten sie den Berg Zion mit hohen Mauern ringsum und starken Türmen aus, damit die Völker[a] nicht kämen und ihn niederträten, wie sie es zuvor getan hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Heiden“. Das griechische Wort kann „die Völker“ oder „die Heiden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: bauten … aus
  rationale: Das Verb bedeutet grundlegend „bauen“. Zusammen mit den hohen Mauern und starken Türmen bezeichnet es hier den Ausbau zur Befestigung; „bauten … aus“ bewahrt sowohl den konkreten Bauvorgang als auch den defensiven Zusammenhang.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: zu jener Zeit
  rationale: Eine natürliche und würdige Wiedergabe der zeitlichen Erzählformel.
- source_word: τὸ ὄρος Σιὼν
  choice: den Berg Zion
  rationale: Die im Deutschen übliche biblische Bezeichnung für ὄρος Σιὼν.
- source_word: κυκλόθεν
  choice: ringsum
  rationale: Gibt knapp und idiomatisch an, dass die Befestigungsanlagen den Ort umgaben.
- source_word: τείχη ὑψηλά
  choice: hohen Mauern
  rationale: Direkte und natürliche Wiedergabe der Höhe der Befestigungsmauern.
- source_word: πύργους ἰσχυρούς
  choice: starken Türmen
  rationale: ἰσχυρός betont die Stärke beziehungsweise Widerstandsfähigkeit der Türme, nicht ausdrücklich ihre Größe.
- source_word: μή ποτε
  choice: damit … nicht
  rationale: Leitet eine vorbeugende Zweck- beziehungsweise Befürchtungsklausel ein und klingt im modernen Deutschen natürlicher als „auf dass nicht“.
- source_word: παραγενηθέντα τὰ ἔθνη
  choice: die Völker … kämen
  rationale: Das substantivierte Partizip wird im Deutschen als finites Verb wiedergegeben. τὰ ἔθνη kann „die Völker“ oder kontextuell „die Heiden“ bedeuten; die Grundbedeutung bleibt im Haupttext erhalten.
- source_word: καταπατήσωσιν
  choice: ihn niederträten
  rationale: Bewahrt das konkrete Bild des Zertretens. Der Singular bezieht sich idiomatisch auf den Berg Zion als befestigten Ort, obwohl das griechische Pronomen formal im Plural steht.
- source_word: ὡς ἐποίησαν τὸ πρότερον
  choice: wie sie es zuvor getan hatten
  rationale: Gibt den Rückverweis auf das frühere Vorgehen der feindlichen Völker natürlich und zeitlich klar wieder.
theological_decisions:
- issue: Wiedergabe von τὰ ἔθνη im jüdisch-hellenistischen Geschichtskontext
  choice: die Völker
  alternative: die Heiden
  rationale: „Die Völker“ entspricht der Grundbedeutung des griechischen Ausdrucks und vermeidet eine unnötige konfessionelle oder spätere theologische Einengung. Da im Kontext nichtjüdische feindliche Gruppen gemeint sind, wird „die Heiden“ als echte Alternative in der Fußnote bewahrt.
- issue: Bezugswort des pluralischen αὐτά
  choice: ihn, bezogen auf den Berg Zion als befestigten Ort
  alternative: sie, bezogen auf die Befestigungsanlagen
  rationale: Das griechische Pronomen ist pluralisch und kann auf die unmittelbar genannten Mauern und Türme beziehungsweise die Anlagen insgesamt weisen. Im Deutschen ist der singularische Rückbezug auf den befestigten Berg Zion natürlicher; die Aussageabsicht bleibt erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Zu jener Zeit“ und der Konjunktiv „kämen/niederträten“ erhalten den historischen Stil, ohne altertümlich zu wirken. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Bezeichnung.
