  source_fidelity: 'Der Satz gibt die griechische Struktur und die wesentlichen Aussagen zutreffend wieder: ein starkes Heerlager der Völker, die es umgebende berittene Truppe und deren Ausbildung für den Krieg. Die kollektive Bedeutung von ἵππος ist mit „Reiter“ möglich; der pluralische Rückverweis bezieht sich nachvollziehbar auf sie. „Mit Rüstungen ausgestattetes Heerlager“ ist jedoch im Deutschen semantisch und idiomatisch weniger passend, da τεθωρακισμένην hier den gerüsteten Zustand des Lagers bzw. seiner Streitkräfte bezeichnet, nicht einen Bestand an einzelnen Rüstungen.'
