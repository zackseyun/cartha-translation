  terminology: „Heerlager“ trifft παρεμβολή im militärischen Kontext. „Völker“ ist als nahe, nicht konfessionell vorgeprägte Wiedergabe von ἐθνῶν geeignet; die Fußnote nennt „Heiden“ als kontextuelle Alternative. „Reiter“ ist für die kollektiv verwendete ἵππος vertretbar; „für den Krieg ausgebildet“ gibt διδακτοὶ πολέμου präzise wieder.
