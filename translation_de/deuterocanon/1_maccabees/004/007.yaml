  yaml_path: translation/deuterocanon/1_maccabees/004/007.yaml
  text: And they saw a strong camp of the nations[a], armored, and cavalry surrounding it, and these were trained for war.
translation:
  language: de
  text: Und sie sahen ein starkes, gerüstetes Heerlager der Völker[a] und Reiter, die es ringsum umgaben; diese waren für den Krieg ausgebildet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Heiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴν
  choice: Heerlager
  rationale: Das Wort bezeichnet hier ein militärisches Lager. „Heerlager“ gibt diesen Sinn knapp und eindeutig wieder.
- source_word: ἐθνῶν
  choice: der Völker
  rationale: Die Wendung meint im Kontext die nichtjüdischen Völker. „Der Völker“ bleibt nahe am Griechischen und bewahrt gegenüber „Heiden“ die lexikalische Offenheit.
- source_word: ἰσχυρὰν
  choice: starkes
  rationale: „Stark“ entspricht der Grundbedeutung und beschreibt das Heerlager als militärisch überlegen beziehungsweise schwer zu bezwingen, ohne den Ausdruck zu übersteigern.
- source_word: τεθωρακισμένην
  choice: mit Rüstungen ausgestattetes
  rationale: Das Perfektpartizip bezeichnet einen mit Rüstung versehenen Zustand. Da ein „gepanzertes Heerlager“ im Deutschen missverständlich wäre, macht diese Formulierung deutlich, dass das Lager beziehungsweise seine Truppen gerüstet waren.
- source_word: ἵππον
  choice: Reiter
  rationale: Der Singular wird kollektiv für die berittene Truppe gebraucht. „Reiter“ macht zugleich verständlich, warum das folgende οὗτοι im Griechischen im Plural steht.
- source_word: κυκλοῦσαν
  choice: die es ringsum umgaben
  rationale: Die Form bezeichnet ein Umgeben oder Umringen des Heerlagers. „Ringsum umgaben“ gibt die räumliche Anordnung natürlich wieder.
- source_word: διδακτοὶ πολέμου
  choice: für den Krieg ausgebildet
  rationale: Die Wendung bezeichnet in der Kriegführung unterwiesene beziehungsweise trainierte Männer. „Für den Krieg ausgebildet“ ist präzise und in modernem Deutsch verständlich.
theological_decisions:
- issue: Bedeutung von ἐθνῶν
  choice: Völker
  alternative: Heiden
  rationale: Im makkabäischen Zusammenhang sind nichtjüdische Völker gemeint. Der Haupttext wahrt mit „Völker“ die griechische Ausdrucksweise; die Fußnote nennt die kontextuell mögliche traditionelle Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Terminologie. Die griechische Satzfolge wird weitgehend bewahrt, während „Reiter“ den kollektiven Gebrauch von ἵππον und den pluralischen Rückverweis οὗτοι im Deutschen verständlich macht.
