lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: bauten … wieder auf
  rationale: οἰκοδομέω bedeutet grundsätzlich „bauen“; im Zusammenhang der Wiederherstellung des entweihten Tempels gibt „wieder aufbauen“ die gemeinte Bautätigkeit natürlich und präzise wieder.
- source_word: τὰ ἅγια
  choice: das Heiligtum
  rationale: Der substantivierte Plural bezeichnet im Tempelzusammenhang am ehesten den heiligen Tempelbereich. „Heiligtum“ ist im modernen Deutschen verständlich und bewahrt die räumliche Bedeutung.
- source_word: τὰ ἐντὸς τοῦ οἴκου
  choice: das Innere des Tempelgebäudes
  rationale: Die Wendung meint räumlich das, was sich innerhalb des Hauses befindet. „Das Innere“ ist natürliches Deutsch; „Tempelgebäude“ verdeutlicht den Bezug von οἶκος, ohne einen missverständlichen gewöhnlichen Wohnbau anzunehmen.
- source_word: οἴκου
  choice: Tempelgebäudes
  rationale: οἶκος heißt wörtlich „Haus“, bezeichnet hier aber eindeutig das eigentliche Tempelgebäude. Die Wiedergabe macht diesen architektonischen Bezug für heutige Leser unmittelbar klar.
- source_word: τὰς αὐλάς
  choice: die Vorhöfe
  rationale: αὐλαί bezeichnet die Höfe des Tempelbezirks. „Vorhöfe“ ist im deutschen Tempelwortschatz geläufig und grenzt sie vom inneren Tempelgebäude ab.
- source_word: ἡγίασαν
  choice: weihten
  rationale: ἁγιάζω bezeichnet hier das rituelle Heiligen beziehungsweise Absondern für den heiligen Gebrauch. „Weihen“ ist knapp, würdig und allgemein verständlich.
theological_decisions:
- issue: Bezeichnung des heiligen Tempelbereichs
  choice: τὰ ἅγια wird als „das Heiligtum“ wiedergegeben und vom „Inneren des Tempelgebäudes“ unterschieden.
  alternative: „das Heilige“, „die heiligen Stätten“ oder „die heiligen Dinge“
  rationale: Die Aufzählung betrifft bauliche beziehungsweise räumliche Bereiche des Tempels. Eine lokale Deutung passt daher besser als die Deutung auf heilige Gegenstände; die genaue Abgrenzung der genannten Innenbereiche bleibt dabei offen.
- issue: Bedeutung von οἶκος im Tempelkontext
  choice: „Tempelgebäude“
  alternative: „Haus“
  rationale: Das griechische „Haus“ ist hier eine Tempelbezeichnung. „Tempelgebäude“ macht den Referenten klar und vermeidet, eine besondere theologische Nuance über die Architektur hinaus einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der knappen griechischen Aufzählung, während „wieder aufbauen“ den Wiederherstellungskontext sichtbar macht. Die Fußnotenmarkierung steht unmittelbar bei „Tempelgebäudes“.
