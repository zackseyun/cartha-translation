  text: And they rebuilt the sanctuary and the interior of the house[b][a], and they consecrated the courts.
translation:
  language: de
  text: Und sie bauten das Heiligtum und das Innere des Tempelgebäudes[a] wieder auf und weihten die Höfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „des Hauses“; gemeint ist das Tempelgebäude.'
