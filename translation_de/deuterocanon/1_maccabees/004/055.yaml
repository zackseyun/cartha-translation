  source_fidelity: 'Die Übersetzung gibt die griechische Aussage vollständig und sachgerecht wieder: πᾶς ὁ λαός als „das ganze Volk“, die Niederwerfung ἐπὶ πρόσωπον als „mit dem Gesicht zu Boden“, die kultische Verehrung durch προσεκύνησαν sowie das indirekte substantivierte Partizip τὸν εὐοδώσαντα αὐτούς. Die indirekte Gottesbezeichnung bleibt erhalten. „Zum Himmel hin“ bewahrt die Richtungsnuance von εἰς οὐρανόν und entscheidet die mögliche ehrfürchtige Umschreibung nicht unnötig.'
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Verbindung „segneten zum Himmel hin den“ ist bewusst quellennah und im biblisch-religiösen Register noch gut verständlich. Der Wechsel von dem Kollektivsingular „das ganze Volk“ zu „Sie“ ist semantisch klar, da die einzelnen Angehörigen des Volkes handeln.
  terminology: „Beteten an“ trifft im gegebenen Kultzusammenhang προσεκύνησαν angemessen. „Segneten“ bewahrt bei ηὐλόγησαν die biblisch etablierte Ausdrucksweise des Gotteslobes, ohne sie interpretierend zu „priesen“ umzudeuten. „Gelingen geschenkt“ gibt εὐοδώσαντα idiomatisch wieder und vermeidet eine unangemessen materielle Verengung auf Wohlstand.
