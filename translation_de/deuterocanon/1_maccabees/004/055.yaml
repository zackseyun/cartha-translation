base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/055.yaml
  text: And all the people fell on their faces[b][a], and they worshiped and blessed toward heaven the one who had prospered them.
translation:
  language: de
  text: Da fiel das ganze Volk mit dem Gesicht zu Boden. Sie beteten an und segneten zum Himmel hin[a] den, der ihnen Gelingen geschenkt hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Himmel“; das Griechische kann eine Richtung angeben oder mit „Himmel“ ehrfürchtig auf Gott im Himmel Bezug nehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der ihnen Erfolg gegeben hatte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπεσον πᾶς ὁ λαὸς ἐπὶ πρόσωπον
  choice: Da fiel das ganze Volk mit dem Gesicht zu Boden
  rationale: Die Formulierung gibt die Niederwerfung natürlich und anschaulich wieder. Der grammatisch singularische Kollektivausdruck πᾶς ὁ λαός bleibt als „das ganze Volk“ erhalten.
- source_word: προσεκύνησαν
  choice: sie beteten an
  rationale: Im kultischen Zusammenhang der Altarweihe bezeichnet das Verb gottesdienstliche Verehrung und nicht nur eine körperliche Verbeugung.
- source_word: ηὐλόγησαν
  choice: segneten
  rationale: „Segneten“ bewahrt die Grundbedeutung des Verbs und die biblisch geläufige Vorstellung, Gott zu segnen; „priesen“ wäre eine natürlichere, aber stärker deutende Wiedergabe.
- source_word: εἰς οὐρανὸν
  choice: zum Himmel hin
  rationale: Die Formulierung erhält die Richtungsbedeutung von εἰς und lässt zugleich offen, ob „Himmel“ als ehrfürchtige Umschreibung für Gott beziehungsweise seinen Aufenthaltsort dient.
- source_word: τὸν εὐοδώσαντα αὐτούς
  choice: den, der ihnen Gelingen geschenkt hatte
  rationale: Das substantivierte Partizip bezeichnet Gott indirekt. „Gelingen geschenkt“ gibt das Bewirken von Erfolg idiomatisch wieder, ohne materiellen Wohlstand anzudeuten.
theological_decisions:
- issue: Bezug von „den, der ihnen Gelingen geschenkt hatte“
  choice: Der Gottesbezug bleibt wie im Griechischen unausgesprochen und wird durch das substantivierte Partizip vermittelt.
  alternative: „Gott, der ihnen Gelingen geschenkt hatte“
  rationale: Eine ausdrückliche Nennung Gottes würde den eindeutigen Sachbezug erklären, aber die ehrfürchtige indirekte Ausdrucksweise des Ausgangstextes beseitigen.
- issue: Funktion von εἰς οὐρανόν
  choice: „zum Himmel hin“ als Richtungsangabe
  alternative: „zum Himmel“ als indirekte Bezeichnung Gottes
  rationale: Die griechische Wendung kann räumliche Ausrichtung ausdrücken und zugleich als ehrfürchtige Umschreibung auf Gott im Himmel verweisen. Der Haupttext entscheidet nicht unnötig zwischen beiden Nuancen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mit dem Gesicht zu Boden fallen“ ist gegenwärtig verständlich; „segnen“ bewahrt bewusst die biblische Ausdrucksweise für das Preisen Gottes. Die indirekte Gottesbezeichnung und die Mehrdeutigkeit von „zum Himmel hin“ bleiben erhalten.
