base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/035.yaml
  text: But when Lysias saw the rout that had happened to his own force[a], and the boldness that had arisen in Judas’s men, and how they were ready either to live or to die nobly, he departed for Antioch, and recruited foreign troops, intending, after becoming stronger in number[b], to come again into Judea.
translation:
  language: de
  text: Als Lysias aber sah, dass seine eigene Streitmacht in die Flucht geschlagen worden war, welchen Mut die Männer des Judas gefasst hatten[a] und dass sie bereit waren, entweder zu leben oder tapfer zu sterben, zog er nach Antiochia ab und warb ausländische Soldaten an[b], um mit einer zahlenmäßig stärkeren Streitmacht erneut nach Judäa zu kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Mut des Judas“. Der folgende Plural („sie waren bereit“) legt nahe, dass die Männer oder die Seite des Judas gemeint sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „warb Söldner an“. Das griechische Verb hebt hervor, dass Fremde angeworben wurden; ob sie ausdrücklich als Söldner zu verstehen sind, bleibt offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: τροπή
  choice: in die Flucht geschlagen
  rationale: Im militärischen Zusammenhang bezeichnet τροπή eine Flucht beziehungsweise vernichtende Wendung der Schlacht. Die verbale Formulierung ist im modernen Deutschen natürlicher als das Substantiv „Flucht“ oder „Niederlage“.
- source_word: σύνταξις
  choice: Streitmacht
  rationale: Das Wort kann die geordnete Aufstellung oder Formation von Truppen bezeichnen. Hier steht die betroffene Truppe als Ganze im Vordergrund; „Streitmacht“ ist daher natürlich und bewahrt den militärischen Sinn.
- source_word: θάρσος
  choice: Mut
  rationale: θάρσος bezeichnet Mut, Zuversicht oder Kühnheit. „Mut“ passt zum folgenden Hinweis auf ihre Bereitschaft zu leben oder tapfer zu sterben.
- source_word: τῆς δὲ Ἰούδα τὸ γεγενημένον θάρσος
  choice: welchen Mut die Männer des Judas gefasst hatten
  rationale: Der griechische Ausdruck lautet knapp „der entstandene Mut des Judas“. Der anschließende Plural zeigt, dass die Seite beziehungsweise die Männer des Judas gemeint sind. Die Fußnote bewahrt die formale Mehrdeutigkeit.
- source_word: ἕτοιμοι εἶεν ἢ ζῆν ἢ τεθνάναι γενναίως
  choice: dass sie bereit waren, entweder zu leben oder tapfer zu sterben
  rationale: Die ausgewogene Gegenüberstellung der beiden Infinitive bleibt erhalten. „Tapfer“ gibt den ehrenbezogenen Sinn von γενναίως in verständlichem modernem Deutsch wieder.
- source_word: ἀπῆρεν
  choice: zog ... ab
  rationale: Das Verb bezeichnet das Weggehen oder Aufbrechen. Im militärischen Zusammenhang ist „abziehen“ idiomatisch, ohne mehr als einen Rückzug auszusagen.
- source_word: ἐξενολόγει
  choice: warb ... ausländische Soldaten an
  rationale: Das Verb betont das Anwerben von Fremden. Dass es sich ausdrücklich um bezahlte Söldner handelte, ist möglich, aber nicht zwingend im Wort selbst enthalten.
- source_word: πλεοναστὸν πάλιν γενηθέντα
  choice: mit einer zahlenmäßig stärkeren Streitmacht erneut
  rationale: Die Formulierung bezeichnet eine zahlenmäßige Verstärkung vor dem erneuten Feldzug. Die deutsche Wiedergabe macht den militärischen Bezug deutlich, ohne eine konkrete Truppenzahl einzuführen.
- source_word: παραγίνεσθαι εἰς τὴν Ἰουδαίαν
  choice: nach Judäa zu kommen
  rationale: Der Infinitiv drückt die beabsichtigte Ankunft beziehungsweise den erneuten Zug nach Judäa aus.
