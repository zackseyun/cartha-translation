  yaml_path: translation/deuterocanon/1_maccabees/004/033.yaml
  text: Strike them down with the sword of those who love you, and let all who know your name praise you with hymns.
translation:
  language: de
  text: Schlag sie nieder mit dem Schwert derer, die dich lieben, und alle, die deinen Namen kennen, sollen dich mit Lobgesängen preisen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατάβαλε
  choice: Stürze sie nieder
  rationale: Gibt den kräftigen Imperativ mit dem Sinn von Niederwerfen oder Zu-Fall-Bringen wieder, ohne die Todesfolge über den griechischen Wortlaut hinaus ausdrücklich festzulegen.
- source_word: ῥομφαίᾳ
  choice: durch das Schwert
  rationale: Der Dativ bezeichnet hier am natürlichsten das Mittel; „Schwert“ ist die klare und traditionelle deutsche Entsprechung.
- source_word: ἀγαπώντων σε
  choice: derer, die dich lieben
  rationale: Bewahrt das substantivierte Partizip und seinen direkten Bezug auf Gott.
- source_word: οἱ εἰδότες τὸ ὄνομά σου
  choice: die deinen Namen kennen
  rationale: Gibt εἰδότες formal und verständlich wieder und bewahrt die biblische Rede vom Kennen des göttlichen Namens.
- source_word: ἐν ὕμνοις
  choice: mit Lobgesängen
  rationale: Drückt den instrumentalen beziehungsweise modalen Sinn natürlich aus; „Lobgesänge“ macht den religiösen Charakter von ὕμνοις deutlich.
theological_decisions:
- issue: Handelnde beim Schwertgericht
  choice: „durch das Schwert derer, die dich lieben“ bewahrt die Liebenden als Träger beziehungsweise Besitzer des Schwertes.
  alternative: „mit dem Schwert für die, die dich lieben“ oder eine Verallgemeinerung göttlichen Eingreifens
  rationale: Die Genitivfügung ἀγαπώντων σε hängt unmittelbar von ῥομφαίᾳ ab. Die Übersetzung erhält die Spannung zwischen göttlichem Handeln und menschlichem Vollzug, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Dignitatives, modernes Standarddeutsch mit gebetsartigem Ton. Die Satzstruktur bleibt nahe am Griechischen, klingt aber idiomatisch; keine konfessionell geprägte Terminologie.
