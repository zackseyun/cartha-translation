lexical_decisions:
- source_word: ἐγενήθη
  choice: wurde … zuteil
  rationale: Die Wendung gibt das Eintreten eines für Israel günstigen Ergebnisses idiomatisch wieder und bewahrt zugleich den Ereignischarakter des Aorists.
- source_word: σωτηρία
  choice: Rettung
  rationale: Im militärisch-historischen Zusammenhang bezeichnet das Wort konkrete Befreiung beziehungsweise Bewahrung; „Rettung“ ist weiter als „Sieg“ und vermeidet eine ausschließlich geistliche Verengung.
- source_word: μεγάλη
  choice: große
  rationale: Das Adjektiv verstärkt das Ausmaß der Rettung unmittelbar und natürlich.
- source_word: τῷ Ἰσραήλ
  choice: Israel … zuteil
  rationale: Der Dativ bezeichnet Israel als Empfänger beziehungsweise Begünstigten; der Kollektivname „Israel“ bleibt erhalten.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: an jenem Tag
  rationale: Dies ist eine natürliche deutsche Wiedergabe der bestimmten Zeitangabe und erhält den demonstrativen Nachdruck von ἐκείνῃ.
