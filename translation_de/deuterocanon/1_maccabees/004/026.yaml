  text: Diejenigen von den Fremden aber, die entkommen waren, berichteten Lysias nach ihrer Ankunft alles, was geschehen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοφύλων
  choice: Fremdvölker
  rationale: Bezeichnet hier die nichtjüdischen gegnerischen Völker beziehungsweise deren Angehörige; „Fremdvölker“ bewahrt den ethnisch-politischen Sinn besser als das heute oft rechtlich verstandene „Ausländer“.
- source_word: διεσώθησαν
  choice: entkommen waren
  rationale: Gibt die erfolgreiche Rettung beziehungsweise Flucht aus der Niederlage im natürlichen deutschen Erzählstil wieder.
- source_word: παραγενηθέντες
  choice: kamen zu Lysias
  rationale: Das Partizip bezeichnet ihr Eintreffen; das Ziel Lysias ergibt sich aus dem folgenden Dativ und wird im Deutschen natürlich in denselben Satz eingebunden.
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Entspricht dem sachlichen Überbringen einer Nachricht oder Meldung.
- source_word: πάντα τὰ συμβεβηκότα
  choice: alles, was geschehen war
  rationale: Bewahrt Umfang und vorzeitigen Charakter des griechischen Ausdrucks idiomatisch.
