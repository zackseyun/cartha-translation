base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/045.yaml
  text: And it seemed to them a good plan to tear it down[a], lest it become a reproach to them because the nations had defiled it; so they tore down the altar.
translation:
  language: de
  text: Sie hielten es für gut, ihn niederzureißen, damit er ihnen nicht zur Schande würde, weil die Völker[a] ihn entweiht hatten. Und sie rissen den Altar nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Heiden«. Das griechische τὰ ἔθνη kann »die Völker« bedeuten und bezeichnet in diesem jüdischen Zusammenhang die nichtjüdischen Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν αὐτοῖς βουλὴ ἀγαθή
  choice: Da kamen sie zu dem guten Entschluss
  rationale: Die griechische Wendung lautet wörtlich etwa »ein guter Rat fiel ihnen zu«. Die gewählte idiomatische Wiedergabe bezeichnet eine gemeinsam gefasste, als gut beurteilte Entscheidung und passt zum beratenden Zusammenhang.
- source_word: καθελεῖν / καθεῖλον
  choice: niederzureißen / rissen … nieder
  rationale: Das Verb bezeichnet hier das physische Abtragen des Altars. »Niederreißen« ist gegenwärtiges, klares Deutsch und wahrt durch die Wiederholung die lexikalische Verbindung zwischen Entschluss und Ausführung.
- source_word: μή ποτε γένηται αὐτοῖς εἰς ὄνειδος
  choice: damit er ihnen nicht zur Schande würde
  rationale: ὄνειδος umfasst Schande, Schmach und öffentlichen Vorwurf. »Zur Schande« ist natürlich und würdevoll und bewahrt die Dimension verletzter öffentlicher Ehre.
- source_word: ἐμίαναν
  choice: entweiht hatten
  rationale: μιαίνω bezeichnet besonders in kultischem Zusammenhang Verunreinigung oder Befleckung. Beim Altar vermittelt »entweihen« im Deutschen die religiös-kultische Verletzung am klarsten, ohne sie als bloße materielle Verschmutzung erscheinen zu lassen.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Die wörtliche Wiedergabe bewahrt den Ausdruck des Ausgangstextes und vermeidet eine unnötig vorentscheidende Deutung; im jüdischen Kontext sind die nichtjüdischen Völker gemeint. Die mögliche Wiedergabe »die Heiden« wird in einer Fußnote genannt.
- source_word: τὸ θυσιαστήριον
  choice: den Altar
  rationale: »Altar« ist die eindeutige und geläufige deutsche Entsprechung für θυσιαστήριον.
theological_decisions:
- issue: Kultische Verunreinigung des Altars
  choice: entweiht
  alternative: verunreinigt
  rationale: Der Zusammenhang betrifft einen für den Opferdienst bestimmten Altar, der durch fremden Kultgebrauch unbrauchbar geworden war. »Entweiht« bewahrt diese kultische Dimension, ohne eine spätere konfessionelle Lehre einzutragen.
- issue: Identität von τὰ ἔθνη
  choice: die Völker
  alternative: die Heiden
  rationale: Die Hauptfassung folgt der offenen lexikalischen Form des Griechischen. Die kontextuell zutreffende Einschränkung auf nichtjüdische Völker wird als Übersetzungsalternative kenntlich gemacht, nicht stillschweigend in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt gut lesbar, während der kausale Zusammenhang und die Wiederholung des Niederreißens aus dem Griechischen erhalten bleiben.
