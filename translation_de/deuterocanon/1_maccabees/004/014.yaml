  text: And they joined battle[a], and the nations were crushed, and they fled into the plain.
translation:
  language: de
  text: Da trafen sie im Kampf aufeinander, und die Völker[a] wurden zerschmettert und flohen in die Ebene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Heiden«. In diesem Zusammenhang kann »die Völker« speziell die nichtjüdischen Völker oder ihre Truppen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆψαν
  choice: trafen sie im Kampf aufeinander
  rationale: Das Verb συνάπτω bezeichnet hier im militärischen Zusammenhang das Zusammentreffen beziehungsweise den Beginn des Kampfes. Die Formulierung gibt diesen Sinn in natürlichem modernem Deutsch wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt einzufügen.
- source_word: συνετρίβησαν
  choice: wurden zerschmettert
  rationale: Das Passiv von συντρίβω bedeutet wörtlich, zerbrochen oder zerschmettert zu werden. „Wurden zerschmettert“ bewahrt die bildhafte Stärke des griechischen Ausdrucks besser als das sachlichere „wurden besiegt“.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Die Wiedergabe folgt dem allgemeinen Wortsinn von ἔθνη und wahrt die mögliche Mehrdeutigkeit zwischen Völkern im allgemeinen Sinn und nichtjüdischen Völkern beziehungsweise Truppen im Kontext.
- source_word: τὸ πεδίον
  choice: die Ebene
  rationale: πεδίον bezeichnet flaches, offenes Gelände. „Die Ebene“ ist knapp, idiomatisch und für den militärischen Rückzug räumlich passend.
theological_decisions:
- issue: Bedeutung von τὰ ἔθνη
  choice: die Völker
  alternative: die Heiden
  rationale: Der Kontext kann nichtjüdische Völker oder Truppen meinen; die allgemeinere Wiedergabe erhält jedoch den Wortlaut und legt die religiös-ethnische Nuance nicht zwingend fest. Die Fußnote nennt die engere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und die anschauliche Gewalt des griechischen Textes bleiben erhalten; zugleich wird der militärische Sinn von συνῆψαν idiomatisch ausgedrückt.
