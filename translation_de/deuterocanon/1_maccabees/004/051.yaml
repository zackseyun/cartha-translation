  yaml_path: translation/deuterocanon/1_maccabees/004/051.yaml
  text: And they placed loaves on the table[a], and they spread out the curtains[b]; and they completed all the works that they had done.
translation:
  language: de
  text: Und sie legten Brote auf den Tisch[a] und breiteten die Vorhänge aus[b]; und sie vollendeten alle Arbeiten, die sie ausgeführt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische steht im Plural: „Brote“.'
    reason: lexical_clarification
  - marker: b
    text: 'Oder: „Schleier“; das Wort kann Vorhänge oder Schleier im Heiligtum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: legten … auf
  rationale: Der Aorist von ἐπιτίθημι bezeichnet hier das Auflegen auf den Tisch; die deutsche Verbklammer gibt die Konstruktion natürlich und genau wieder.
- source_word: τὴν τράπεζαν
  choice: den Tisch
  rationale: Das griechische Substantiv bedeutet schlicht „Tisch“. Der Heiligtumskontext identifiziert den Gegenstand hinreichend, ohne dass eine technische Ergänzung nötig wäre.
- source_word: ἄρτους
  choice: Brote
  rationale: Die Pluralform wird bewahrt. „Brote“ ist im Deutschen verständlich und entspricht den einzelnen aufgelegten Broten besser als der Singular „Brot“.
- source_word: ἐξεπέτασαν
  choice: breiteten … aus
  rationale: Das Verb bezeichnet das Ausbreiten oder Entfalten; die Formulierung passt zur Handhabung von Vorhängen im Heiligtum.
- source_word: τὰ καταπετάσματα
  choice: die Vorhänge
  rationale: καταπέτασμα kann im Heiligtum einen Vorhang oder Schleier bezeichnen. „Vorhänge“ ist gegenwärtiges, klares Deutsch; „Schleier“ bleibt als Alternative in der Fußnote erhalten.
- source_word: ἐτέλεσαν
  choice: vollendeten
  rationale: Das Verb bezeichnet das vollständige Zu-Ende-Führen. „Vollendeten“ bewahrt diesen Aspekt und den würdigen Erzählton.
- source_word: πάντα τὰ ἔργα
  choice: alle Arbeiten
  rationale: „Arbeiten“ gibt den Plural idiomatisch wieder und bezeichnet die verschiedenen Tätigkeiten bei der Wiederherstellung.
- source_word: ἃ ἐποίησαν
  choice: die sie ausgeführt hatten
  rationale: ἐποίησαν bedeutet wörtlich „sie taten/machten“. Im Bezug auf ἔργα ist „Arbeiten ausführen“ idiomatisches Deutsch und bleibt näher am Wortlaut als die stärker deutende Wiedergabe „in Angriff genommen“.
theological_decisions:
- issue: Kultische Bezeichnungen für die Ausstattung des Heiligtums
  choice: Im Haupttext stehen die gewöhnlichen Wörter „Tisch“, „Brote“ und „Vorhänge“.
  alternative: Ausführlichere technische Bezeichnungen wie „Schaubrottisch“ oder die Wiedergabe „Schleier“.
  rationale: Der griechische Vers selbst enthält keine erklärenden kultischen Zusätze. Die schlichte Wiedergabe vermeidet eine Überbestimmung, während der Heiligtumskontext und die Fußnoten die möglichen Bedeutungsnuancen erkennen lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einem leicht gehobenen biblischen Erzählton. Das einleitende „Und“ und die Abfolge der Handlungen bleiben erhalten; „so“ vor „vollendeten“ macht den abschließenden Sinn im Deutschen deutlich, ohne den Inhalt zu erweitern.
