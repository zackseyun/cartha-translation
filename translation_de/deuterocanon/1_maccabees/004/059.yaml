base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/059.yaml
  text: And Judas and his brothers and all the assembly of Israel decreed that the days of the dedication of the altar should be observed at their appointed times[a], year by year, for eight days, from the twenty-fifth day of the month Chislev, with gladness and joy.
translation:
  language: de
  text: Und Judas und seine Brüder und die ganze Versammlung Israels beschlossen, dass die Tage der Altarweihe jedes Jahr zu den dafür festgesetzten Zeiten acht Tage lang gefeiert werden sollten, vom fünfundzwanzigsten Tag des Monats Kislew[a] an, mit Jubel und Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Χασελεύ gibt den jüdischen Monatsnamen wieder, der im Deutschen auch „Kislev“ geschrieben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: beschlossen
  rationale: Mit dem folgenden ἵνα-Satz bezeichnet das Verb hier die verbindliche Festlegung einer wiederkehrenden Feier. „Beschlossen“ ist im Deutschen natürlich und bewahrt den gemeinschaftlich-rechtlichen Charakter.
- source_word: ἐκκλησία
  choice: Versammlung
  rationale: Im jüdischen Kontext bezeichnet das Wort die versammelte Gemeinschaft Israels; „Versammlung“ vermeidet einen anachronistischen Bezug auf die christliche Kirche.
- source_word: ἵνα ἄγωνται
  choice: dass … gefeiert werden sollten
  rationale: Die Konstruktion bezeichnet die regelmäßige Begehung von Festtagen. „Gefeiert“ passt besonders zum ausdrücklich genannten Jubel und zur Freude.
- source_word: ἐγκαινισμοῦ τοῦ θυσιαστηρίου
  choice: Altarweihe
  rationale: Das zusammengesetzte deutsche Wort gibt die kultische Einweihung beziehungsweise erneute Weihe des Altars knapp und verständlich wieder.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: zur festgesetzten Zeit
  rationale: Die Wendung verweist auf den bestimmten kalendarischen Termin der jährlich wiederkehrenden Feier.
- source_word: ἐνιαυτὸν κατʼ ἐνιαυτὸν
  choice: jedes Jahr
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der jährlichen Wiederholung.
- source_word: ἡμέρας ὀκτώ
  choice: acht Tage lang
  rationale: Die Formulierung drückt die Dauer der Feier idiomatisch aus.
- source_word: ἀπὸ τῆς πέμπτης καὶ εἰκάδος
  choice: vom fünfundzwanzigsten Tag … an
  rationale: ἀπό bezeichnet den zeitlichen Ausgangspunkt; „vom … an“ bildet diesen ausdrücklich und eng am Griechischen ab.
- source_word: τοῦ μηνὸς Χασελεὺ
  choice: des Monats Kislew
  rationale: „Kislew“ ist die im Deutschen geläufige Form des jüdischen Monatsnamens, den die griechische Schreibweise Χασελεύ wiedergibt.
- source_word: μετʼ εὐφροσύνης καὶ χαρᾶς
  choice: mit Jubel und Freude
  rationale: Die beiden Substantive verstärken den festlichen Charakter. „Jubel und Freude“ bewahrt die Doppelung in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία im jüdischen Kontext
  choice: Versammlung
  alternative: Gemeinde
  rationale: Gemeint ist die versammelte Gemeinschaft Israels vor der christlichen Zeit. „Versammlung“ erhält diesen Sinn, ohne spätere kirchliche Vorstellungen einzutragen.
- issue: Charakter der Altarfeier
  choice: Altarweihe
  alternative: Erneuerung des Altars
  rationale: ἐγκαινισμός kann Einweihung oder Erneuerung bezeichnen. Im unmittelbaren kultischen Zusammenhang ist „Altarweihe“ eine natürliche Wiedergabe, ohne über den Vorgang hinaus eine konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem historischem Ton. Die Satzstruktur wurde gegenüber dem Griechischen leicht geglättet; die jährliche Wiederkehr, Dauer, der Beginntermin und die festliche Doppelung bleiben ausdrücklich erhalten.
