base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/010.yaml
  text: And now let us cry out to heaven; if he is willing toward us[a], he will remember the covenant of our fathers and crush this camp before us today.
translation:
  language: de
  text: Und nun lasst uns zum Himmel rufen! Wenn er Gefallen an uns hat,[a] wird er an den Bund unserer Väter denken und dieses Heerlager heute vor unseren Augen zerschmettern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wenn er uns will“; auch möglich: „wenn er uns wohlgesinnt ist“ oder „wenn er Gefallen an uns findet“. Das Griechische beschreibt Gottes wohlwollende Haltung mit einem ungewöhnlichen persönlichen Objekt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βοήσωμεν
  choice: lasst uns … rufen
  rationale: Der Aorist Konjunktiv ist hortativ. „Rufen“ vermittelt den dringenden Hilferuf in der militärischen Notlage; „schreien“ würde zu stark die Lautstärke betonen.
- source_word: εἰς οὐρανόν
  choice: zum Himmel
  rationale: Bewahrt die griechische Umschreibung für den an Gott gerichteten Hilferuf, ohne „Himmel“ ausdrücklich durch „Gott“ zu ersetzen.
- source_word: εἰ θελήσει ἡμᾶς
  choice: Wenn er Gefallen an uns hat
  rationale: θέλω steht ungewöhnlich mit einem persönlichen Objekt und bezeichnet hier Gottes wohlwollende Hinwendung. Die Formulierung gibt diesen Sinn natürlich wieder, ohne die Bedingung aufzulösen.
- source_word: μνησθήσεται
  choice: wird er … denken
  rationale: „An den Bund denken“ ist natürliches Deutsch und bewahrt den bundestheologischen Sinn des göttlichen Erinnerns, das zum Handeln führt.
- source_word: διαθήκης πατέρων
  choice: den Bund unserer Väter
  rationale: Der Genitiv bezeichnet den mit den Vorfahren verbundenen angestammten Bund. Die Wiedergabe erhält die Mehrdeutigkeit zwischen Zugehörigkeit und Bundesbeziehung.
- source_word: συντρίψει
  choice: zerschmettern
  rationale: Das kräftige Verb entspricht dem militärischen Kontext und der Intensität von συντρίβω besser als „zerbrechen“.
- source_word: τὴν παρεμβολὴν ταύτην
  choice: dieses Heerlager
  rationale: παρεμβολή kann sowohl das Lager als auch das dort versammelte Heer bezeichnen. „Heerlager“ bewahrt das konkrete Bild und lässt den militärischen Bezug erkennen.
- source_word: κατὰ πρόσωπον ἡμῶν
  choice: vor unseren Augen
  rationale: Idiomatiche Wiedergabe der Wendung mit dem Sinn „vor uns/in unserer Gegenwart“; sie erhält den anschaulichen Bezug auf das unmittelbar gegenüberstehende Lager.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben nach dem Ruf zum Himmel
  choice: Das Subjekt wird mit „er“ wiedergegeben und bezieht sich implizit auf Gott.
  alternative: Den Gottesbezug ausdrücklich mit „Gott“ benennen.
  rationale: Die Einzahl der Verben und der Ruf „zum Himmel“ weisen auf Gott. Das Pronomen bewahrt zugleich die indirekte Ausdrucksweise des Griechischen.
- issue: Bedeutung von εἰ θελήσει ἡμᾶς
  choice: „Wenn er Gefallen an uns hat“
  alternative: „wenn er uns wohlgesinnt ist“ oder formal näher „wenn er uns will“
  rationale: Die markierte Konstruktion mit persönlichem Objekt bezeichnet wahrscheinlich Gottes günstige Willenshaltung beziehungsweise Wohlgefallen. Die Fußnote dokumentiert die ungewöhnlichere wörtliche Form.
- issue: Beziehung in διαθήκης πατέρων
  choice: „den Bund unserer Väter“
  alternative: „den Bund mit unseren Vätern“
  rationale: Der griechische Genitiv legt die genaue Beziehung nicht ausdrücklich fest. Der Haupttext bewahrt diese Offenheit, während die Alternative die Bundespartner deutlicher bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf nach dem ersten Satzteil unterstreicht den dringenden Aufruf, während der folgende Konditionalsatz klar bleibt. „Heerlager“ und „zerschmettern“ erhalten das konkrete, kraftvolle Bild des militärischen Zusammenhangs.
