translation:
  language: de
  text: Und Judas hörte davon; da brach er mit den starken Männern auf, um die Streitmacht des Königs, die sich in Emmaus befand, anzugreifen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte davon
  rationale: Das Verb kann sowohl das unmittelbare Hören als auch das Erfahren einer Nachricht bezeichnen. „Hörte davon“ lässt den im Griechischen unausgesprochenen Gegenstand offen und klingt im militärischen Erzählzusammenhang natürlich.
- source_word: ἀπῆρεν
  choice: brach … auf
  rationale: Die Wendung bezeichnet hier den zielgerichteten Aufbruch. „Brach auf“ gibt dies idiomatisch wieder, ohne eine Marschordnung oder eine bestimmte Geländerichtung hinzuzufügen.
- source_word: οἱ δυνατοὶ
  choice: die starken Männer
  rationale: Die substantivierte Bezeichnung meint wörtlich die Starken oder Mächtigen und hat hier einen militärischen Bezug. „Die starken Männer“ wahrt die lexikalische Bildlichkeit, ohne durch „seine Krieger“ einen im Griechischen nicht ausgedrückten Besitzbezug einzuführen.
- source_word: πατάξαι
  choice: anzugreifen
  rationale: Der Infinitiv bezeichnet die beabsichtigte feindliche Handlung. „Anzugreifen“ ist im modernen Deutschen natürlich und legt anders als „zu besiegen“ den Ausgang noch nicht fest; „zu schlagen“ könnte hier bereits als siegreicher Abschluss verstanden werden.
- source_word: τὴν δύναμιν
  choice: die Streitmacht
  rationale: δύναμις bezeichnet in diesem Zusammenhang eine militärische Truppe. „Streitmacht“ ist präzise und lässt offen, ob es sich um ein formal organisiertes Heer handelt.
- source_word: τοῦ βασιλέως
  choice: des Königs
  rationale: Der Genitiv bezeichnet die Zugehörigkeit der Streitmacht zum König und wird formal entsprechend wiedergegeben.
- source_word: τὴν ἐν Ἐμμαούμ
  choice: die sich bei Emmaus befand
  rationale: Die attributive Präpositionalfügung bestimmt die Streitmacht nach ihrem Standort. „Bei Emmaus“ gibt ἐν bei einem Ortsnamen im militärischen Kontext natürlich wieder, ohne ausdrücklich zu behaupten, sie sei dort dauerhaft stationiert gewesen.
