  text: And Judas said to the men with him[a], “Do not fear their multitude[b], and do not be terrified by their attack.”
translation:
  language: de
  text: 'Und Judas sagte zu den Männern, die bei ihm waren: „Fürchtet euch nicht vor ihrer großen Zahl und verliert nicht den Mut vor ihrem Ansturm[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Angriff“ oder „Vorstoß“ (τὸ ὅρμημα αὐτῶν).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: Fürchtet euch nicht vor
  rationale: Die direkte Verneinung des Imperativs von φοβέομαι wird in natürlichem, würdigem Deutsch als klare Aufforderung wiedergegeben.
- source_word: τὸ πλῆθος αὐτῶν
  choice: ihre große Zahl
  rationale: πλῆθος bezeichnet hier die zahlenmäßige Überlegenheit des gegnerischen Heeres. „Große Zahl“ ist im modernen Deutsch natürlicher als „Menge“ oder „Vielzahl“.
- source_word: τὸ ὅρμημα αὐτῶν
  choice: ihr Ansturm
  rationale: ὅρμημα kann einen heftigen Vorstoß, Ansturm oder Angriff bezeichnen. „Ansturm“ bewahrt die dynamische Bildlichkeit des griechischen Ausdrucks und passt zum militärischen Zusammenhang.
- source_word: μὴ δειλωθῆτε
  choice: lasst euch nicht entmutigen
  rationale: Die Form bezeichnet ein Ängstlich- oder Mutloswerden. „Lasst euch nicht entmutigen“ vermeidet den moralisierenden Klang von „seid nicht feige“ und gibt die Aufforderung in idiomatischem Deutsch wieder.
- source_word: τοῖς ἀνδράσιν τοῖς μετʼ αὐτοῦ
  choice: zu den Männern, die bei ihm waren
  rationale: ἀνδράσιν bezeichnet ausdrücklich Männer; der Relativsatz gibt τοῖς μετʼ αὐτοῦ klar und vollständig wieder.
