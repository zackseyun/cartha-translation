  text: And they went out from the camp for battle[a], and those with Judas sounded the trumpets.
translation:
  language: de
  text: Und sie zogen aus dem Lager in den Kampf, und die Männer, die bei Judas waren, bliesen die Trompeten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθαν
  choice: zogen sie aus
  rationale: Das Verb bezeichnet das Herausgehen aus einem Ort. „Zogen … aus“ klingt im militärischen Zusammenhang natürlich, ohne die Art der Bewegung übermäßig auszumalen.
- source_word: παρεμβολῆς
  choice: Lager
  rationale: παρεμβολή bezeichnet hier das militärische Lager; „Lager“ ist die klare und übliche deutsche Wiedergabe.
- source_word: εἰς πόλεμον
  choice: in den Kampf
  rationale: Die Wendung bezieht sich auf den unmittelbar bevorstehenden Kampf, nicht allgemein auf einen länger dauernden Krieg.
- source_word: οἱ παρὰ Ἰούδου
  choice: die Männer bei Judas
  rationale: Die Formulierung bezeichnet die bei Judas befindliche bzw. ihn begleitende Gruppe. „Bei Judas“ wahrt diese Zuordnung, ohne ein stärker formalisiertes Befehlsverhältnis auszudrücken.
- source_word: ἐσάλπισαν
  choice: bliesen die Trompeten
  rationale: Das Verb bedeutet, Trompete zu blasen bzw. ein Trompetensignal zu geben. Im Deutschen wird das im Griechischen nur mitgedachte Instrument zweckmäßig ergänzt.
- source_word: Ἰούδου
  choice: Judas
  rationale: „Judas“ ist die im Deutschen etablierte Namensform für Judas Makkabäus.
