lexical_decisions:
- source_word: συνήχθη
  choice: versammelte sich
  rationale: Der Aorist Passiv von συνάγω bezeichnet hier idiomatisch das Zusammenkommen der gesamten Gruppe; die reflexive deutsche Form ist natürlich und bewahrt den kollektiven Vorgang.
- source_word: ἡ παρεμβολὴ πᾶσα
  choice: das ganze Lager
  rationale: παρεμβολή bezeichnet im militärischen Zusammenhang das Lager, wobei metonymisch auch die dort versammelte Truppe gemeint sein kann. „Das ganze Lager“ erhält die knappe Ausdrucksweise und gibt πᾶσα ausdrücklich wieder.
- source_word: ἀνέβησαν
  choice: sie zogen … hinauf
  rationale: ἀναβαίνω bezeichnet eine Aufwärtsbewegung. „zogen … hinauf“ klingt in diesem erzählenden und militärischen Zusammenhang natürlich, ohne die Art der Bewegung als Marsch näher festzulegen.
- source_word: εἰς ὄρος Σιών
  choice: zum Berg Zion
  rationale: εἰς bezeichnet das Ziel der Bewegung, und ὄρος Σιών wird im modernen Standarddeutsch klar und traditionsgemäß mit „Berg Zion“ wiedergegeben.
