translation:
  language: de
  text: solange die Streitkräfte noch außerhalb des Lagers zerstreut waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, weniger idiomatisch: „bis die Streitkräfte noch außerhalb des Lagers zerstreut waren“. Die griechische Verbindung ἕως ἔτι ist knapp formuliert; sie wird hier als Zeitangabe im Sinn von „solange … noch“ verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι
  choice: solange … noch
  rationale: 'Die gedrängte Verbindung wird als temporale Angabe verstanden: Der betreffende Zustand bestand noch fort. „Solange … noch“ bewahrt sowohl die zeitliche Begrenzung von ἕως als auch die Fortdauer durch ἔτι.'
- source_word: αἱ δυνάμεις
  choice: die Streitkräfte
  rationale: Im militärischen Zusammenhang bezeichnet der Plural die bewaffneten Kräfte; „Streitkräfte“ gibt dies wieder, ohne eine bestimmte Gliederung vorauszusetzen.
- source_word: ἐσκορπισμέναι
  choice: zerstreut
  rationale: Das Partizip beschreibt die Streitkräfte als räumlich verteilt und nicht gesammelt.
- source_word: ἀπὸ τῆς παρεμβολῆς
  choice: außerhalb des Lagers
  rationale: παρεμβολή bezeichnet hier das Heerlager. In Verbindung mit ἀπό drückt die Wendung eine räumliche Trennung vom Lager aus; idiomatisches Deutsch gibt dies mit „außerhalb des Lagers“ wieder.
