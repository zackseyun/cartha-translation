base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/041.yaml
  text: Then Judas ordered men to fight those in the citadel until he had cleansed the sanctuary[a].
translation:
  language: de
  text: Dann befahl Judas Männern, gegen die in der Zitadelle[a] zu kämpfen, bis er das Heiligtum gereinigt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen die in der Akra«. Die Akra war vermutlich die befestigte Zitadelle in Jerusalem.'
    reason: Bewahrt die mögliche Wiedergabe von ἄκρα als historischem Namen und gibt die vollständige alternative Satzkonstruktion wieder.
lexical_decisions:
- source_word: ἐπέταξεν
  choice: befahl
  rationale: Das Verb bezeichnet eine verbindliche Anordnung. „Befahl“ gibt die autoritative Kraft knapp und in natürlichem Deutsch wieder.
- source_word: ἀνδράσιν
  choice: einigen Männern
  rationale: Der Dativ Plural bedeutet wörtlich „Männern“. „Einigen“ macht im Deutschen idiomatisch deutlich, dass Judas Männer mit dieser Aufgabe betraute, ohne das im Griechischen nicht ausdrücklich genannte „Soldaten“ einzuführen.
- source_word: πολεμεῖν
  choice: zu kämpfen
  rationale: Der Infinitiv nennt die angeordnete Handlung; „zu kämpfen“ ist prägnant und bewahrt den militärischen Sinn.
- source_word: τοὺς ἐν τῇ ἄκρᾳ
  choice: gegen die Leute in der Zitadelle
  rationale: ἄκρα bezeichnet eine befestigte Höhe beziehungsweise Zitadelle und meint hier wahrscheinlich die Jerusalemer Akra. Die beschreibende Wiedergabe bleibt im Haupttext allgemein verständlich; der historische Name steht in der Fußnote.
- source_word: ἕως
  choice: bis
  rationale: ἕως markiert hier die zeitliche Grenze beziehungsweise den vorgesehenen Endpunkt des Kampfauftrags.
- source_word: καθαρίσῃ
  choice: bis er ... gereinigt hatte
  rationale: Der Aorist Konjunktiv nach ἕως bezeichnet in der vergangenen Erzählung den erst noch zu erreichenden Abschluss. Das Plusquamperfekt ist nach dem einleitenden Präteritum idiomatisch und lässt Judas als natürlichen Bezug des singularischen Verbs bestehen.
- source_word: τὰ ἅγια
  choice: das Heiligtum
  rationale: Der substantivierte neutrale Plural bezeichnet in diesem Tempelzusammenhang den heiligen Tempelbereich. „Das Heiligtum“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Referenz von ἄκρα
  choice: Im Haupttext beschreibend mit „Zitadelle“, in der Fußnote mit dem historischen Namen „Akra“ wiedergegeben.
  alternative: „die Akra“ oder „die Festung“
  rationale: Die Entscheidung ist historisch-geografisch, nicht konfessionell. Der griechische Ausdruck ist formal ein bestimmtes Gattungswort, bezeichnet im makkabäischen Zusammenhang aber wahrscheinlich die befestigte Jerusalemer Anlage, die als Akra bekannt ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der griechischen Abfolge eng, vermeidet jedoch unnötige Fachsprache. Die Formulierung „einigen Männern“ klingt natürlicher als das isolierte „Männern“, ohne sie ausdrücklich als Soldaten zu bestimmen.
