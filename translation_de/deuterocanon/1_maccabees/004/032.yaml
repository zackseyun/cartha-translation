  yaml_path: translation/deuterocanon/1_maccabees/004/032.yaml
  text: Give them cowardice[a], and melt the boldness of their strength, and let them be shaken by their own crushing.
translation:
  language: de
  text: Gib ihnen Feigheit, lass die Kühnheit ihrer Stärke dahinschmelzen und lass sie bei ihrer Zerschmetterung[a] ins Wanken geraten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei ihrem Untergang“. συντριβή kann sowohl die konkrete Zerschmetterung als auch allgemeiner Zusammenbruch, Vernichtung oder Untergang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς αὐτοῖς
  choice: Gib ihnen
  rationale: Der direkte Imperativ bewahrt die schlichte, eindringliche Form der Bitte.
- source_word: δειλίαν
  choice: Feigheit
  rationale: δειλία bezeichnet nicht bloß Furcht, sondern feige Mutlosigkeit; „Feigheit“ erhält den zugespitzten militärischen Sinn.
- source_word: τῆξον
  choice: lass … dahinschmelzen
  rationale: Die bildhafte Bedeutung des Verbs („schmelzen lassen“) bleibt erhalten und wird zugleich natürlich deutsch ausgedrückt.
- source_word: θράσος
  choice: Kühnheit
  rationale: θράσος kann Kühnheit, Dreistigkeit oder Übermut bedeuten. „Kühnheit“ wahrt die mögliche Neutralität des Wortes, ohne die feindliche Angriffslust zu verharmlosen.
- source_word: ἰσχύος αὐτῶν
  choice: ihrer Stärke
  rationale: 'Die Genitivverbindung wird eng am Griechischen wiedergegeben, auch wenn ihre genaue Beziehung offenbleibt: Es kann um die Kühnheit gehen, die ihre Stärke kennzeichnet oder aus ihr erwächst.'
- source_word: σαλευθήτωσαν
  choice: lass sie … ins Wanken geraten
  rationale: Die passive Aufforderung bezeichnet ein Erschüttert- oder Ins-Wanken-Geraten; die gewählte Wendung ist anschaulich und im Deutschen idiomatisch.
- source_word: τῇ συντριβῇ αὐτῶν
  choice: bei ihrer Zerschmetterung
  rationale: „Zerschmetterung“ bewahrt die konkrete Gewalt von συντριβή; „bei“ lässt die genaue Funktion des Dativs offen, der Anlass, Begleitumstand oder Mittel bezeichnen kann.
theological_decisions:
- issue: Unheil erflehende Gebetssprache
  choice: Die direkten Bitten um Feigheit, schwindende Kühnheit und das Wanken der Feinde werden ungemildert beibehalten.
  alternative: Die Aussage zu einer allgemeinen Bitte um Niederlage oder Schutz abschwächen.
  rationale: Der griechische Text bittet Gott ausdrücklich, feindliche Kräfte innerlich und äußerlich zu erschüttern. Eine Abschwächung würde die rhetorische und theologische Spannung des Gebets beseitigen.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die kräftigen Bilder und die dreifache Aufforderungsstruktur des Griechischen bleiben erhalten; ungewöhnliche, aber verständliche Genitivbeziehungen werden nicht vorschnell aufgelöst.
