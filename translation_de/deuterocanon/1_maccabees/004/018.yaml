base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/018.yaml
  text: And Gorgias and the force are in the hill country near us[a]. But now stand against our enemies and fight them[b], and after this take the spoils with boldness.
translation:
  language: de
  text: Gorgias und die Streitmacht sind im Bergland nahe bei uns.[a] Doch stellt euch jetzt unseren Feinden entgegen und kämpft gegen sie. Danach nehmt die Beute voll Zuversicht an euch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf dem Berg nahe bei uns«. Der griechische Ausdruck kann einen bestimmten Berg oder allgemeiner das Bergland bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unerschrocken«. Gemeint ist ein furchtloses, zuversichtliches Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμις
  choice: Streitmacht
  rationale: Im militärischen Zusammenhang bezeichnet das Wort eine bewaffnete Truppe, ohne deren Größe oder Gliederung genauer festzulegen. „Streitmacht“ ist im Deutschen präzise und würdevoll.
- source_word: ἐν τῷ ὄρει
  choice: im Bergland
  rationale: Der griechische Singular kann sowohl einen bestimmten Berg als auch eine gebirgige Gegend bezeichnen. „Im Bergland“ ergibt hier eine natürliche militärisch-geografische Aussage, ohne die mögliche engere Bedeutung zu verschweigen.
- source_word: ἐγγὺς ἡμῶν
  choice: ganz in unserer Nähe
  rationale: Die Wendung gibt die räumliche Nähe und damit die unmittelbare Bedrohung wieder.
- source_word: στῆτε … ἐναντίον
  choice: stellt euch … entgegen
  rationale: Die Formulierung bewahrt den befehlenden Ton und drückt entschlossenen Widerstand im Kampf aus.
- source_word: πολεμήσατε αὐτούς
  choice: kämpft gegen sie
  rationale: Dies ist die direkte und natürliche deutsche Wiedergabe des militärischen Befehls.
- source_word: σκῦλα
  choice: die Beute
  rationale: Gemeint sind die nach einem Sieg erbeuteten Gegenstände. „Beute“ ist im modernen Deutschen klarer und natürlicher als „Kriegsbeute“, das den Ausdruck stärker spezifizieren würde.
- source_word: μετὰ παρρησίας
  choice: unerschrocken
  rationale: Im Zusammenhang bezeichnet παρρησία ein furchtloses, zuversichtliches Handeln. „Unerschrocken“ gibt diesen Sinn idiomatisch wieder; möglich ist auch „voller Zuversicht“.
- source_word: Γοργίας
  choice: Gorgias
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die knappen Imperative des griechischen Textes bleiben erhalten. „Seine Streitmacht“ macht die im militärischen Zusammenhang naheliegende Zugehörigkeit der Truppe zu Gorgias im Deutschen natürlich verständlich.
