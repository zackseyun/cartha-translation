translation:
  language: de
  text: um das Lager der Juden zu überfallen und sie plötzlich zu schlagen; und die Männer der Zitadelle dienten ihm als Führer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne der Zitadelle«. Im Griechischen steht Akra, die häufig verwendete Bezeichnung für die befestigte Zitadelle in Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: um … zu
  rationale: Die Konstruktion mit Infinitiven bezeichnet hier im Zusammenhang mit der vorausgehenden Truppenbewegung den beabsichtigten Zweck; die deutsche Infinitivgruppe gibt dies natürlich wieder.
- source_word: ἐπιβαλεῖν ἐπὶ
  choice: überfallen
  rationale: Das Verb mit ἐπὶ beschreibt ein gewaltsames Vorgehen gegen ein Ziel. „Überfallen“ bewahrt den anschaulichen militärischen Sinn und passt zur beabsichtigten Überraschung.
- source_word: παρεμβολή
  choice: Lager
  rationale: Im militärischen Zusammenhang bezeichnet das Wort das Heerlager; „Lager“ ist knapp und idiomatisch.
- source_word: πατάξαι
  choice: schlagen
  rationale: πατάσσω bezeichnet das Schlagen beziehungsweise gewaltsame Angreifen, ohne für sich genommen zwingend den Tod der Betroffenen auszusagen.
- source_word: ἄφνω
  choice: plötzlich
  rationale: Das Adverb bezeichnet unmittelbar die Plötzlichkeit; eine Wiedergabe mit „überraschend“ wäre ebenfalls möglich, würde den Überfallcharakter jedoch stärker ausdeuten.
- source_word: οἱ υἱοὶ τῆς ἄκρας
  choice: die Männer der Zitadelle
  rationale: Wörtlich steht „die Söhne der Zitadelle“. Die Wendung bezeichnet hier keine biologische Abstammung, sondern die mit der Festung verbundenen Männer; die idiomatische Wiedergabe vermeidet ein missverständliches Deutsch.
- source_word: ἄκρα
  choice: Zitadelle
  rationale: ἄκρα bezeichnet die befestigte Hochburg, hier wahrscheinlich die als Akra bekannte Festung in Jerusalem. „Zitadelle“ gibt die Bedeutung direkt wieder.
- source_word: ὁδηγοί
  choice: Wegführer
  rationale: Das Wort bezeichnet Personen, die den Weg weisen. „Wegführer“ macht in diesem militärischen Kontext ihre konkrete Funktion deutlicher als das mehrdeutige „Führer“.
