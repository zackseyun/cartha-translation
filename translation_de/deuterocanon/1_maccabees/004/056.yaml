base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/056.yaml
  text: And they celebrated the dedication of the altar for eight days, and they offered whole burnt offerings with gladness, and they sacrificed a sacrifice of deliverance and praise.
translation:
  language: de
  text: Und sie feierten acht Tage lang die Einweihung des Altars. Voll Freude brachten sie Ganzbrandopfer dar und opferten ein Heils- und Lobopfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Friedensopfer und Lobopfer; das griechische Wort kann Heil, Rettung oder Wohlergehen bezeichnen.'
    reason: Bewahrt die kultische und lexikalische Mehrdeutigkeit von σωτηρίου.
lexical_decisions:
- source_word: ἐποίησαν τὸν ἐγκαινισμὸν
  choice: sie feierten … die Einweihung
  rationale: Die Verbindung bezeichnet das Vollziehen einer Einweihungsfeier; „feierten“ gibt die Wendung natürlich wieder, während „Einweihung“ den kultischen Vorgang klar benennt.
- source_word: ἡμέρας ὀκτώ
  choice: acht Tage lang
  rationale: Der Akkusativ drückt die Dauer aus; diese Formulierung ist im Deutschen idiomatisch und genau.
- source_word: θυσιαστηρίου
  choice: des Altars
  rationale: Direkte und geläufige Wiedergabe des kultischen Begriffs.
- source_word: προσήνεγκαν ὁλοκαυτώματα
  choice: brachten sie Ganzbrandopfer dar
  rationale: „Darbringen“ ist im Opferzusammenhang idiomatisch; „Ganzbrandopfer“ verdeutlicht, dass das Opfer vollständig verbrannt wurde.
- source_word: μετʼ εὐφροσύνης
  choice: Voll Freude
  rationale: Gibt die freudige Begleitung der Opferhandlung in natürlichem, würdigem Deutsch wieder.
- source_word: ἔθυσαν
  choice: opferten
  rationale: Bewahrt die ausdrückliche Opferhandlung und unterscheidet sie sprachlich vom vorherigen Darbringen.
- source_word: θυσίαν σωτηρίου καὶ αἰνέσεως
  choice: ein Heils- und Lobopfer
  rationale: „Heilsopfer“ bewahrt die Bedeutungsweite von σωτήριον zwischen Heil, Rettung und Wohlergehen; „Lobopfer“ gibt αἰνέσεως knapp und kultisch passend wieder.
theological_decisions:
- issue: Kultische Bedeutung von θυσίαν σωτηρίου
  choice: Heilsopfer
  alternative: Friedensopfer; Rettungsopfer
  rationale: „Heilsopfer“ bleibt nahe am griechischen Ausdruck und lässt dessen Bezug auf Heil, Rettung und Wohlergehen offen. Die technische Wiedergabe „Friedensopfer“ ist traditionsgeschichtlich möglich, würde die griechische Bedeutungsbreite jedoch stärker festlegen.
- issue: Verhältnis der Genitive σωτηρίου und αἰνέσεως zu θυσίαν
  choice: ein Heils- und Lobopfer
  alternative: ein Opfer des Heils und des Lobes
  rationale: Die deutsche Zusammensetzung bewahrt beide Bestimmungen des einen griechischen Opferbegriffs, ohne die kultische Sprache unnötig schwerfällig zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Begriffe bleiben sichtbar, werden aber durch geläufige deutsche Zusammensetzungen verständlich gehalten.
