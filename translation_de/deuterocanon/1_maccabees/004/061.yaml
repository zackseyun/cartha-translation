base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/061.yaml
  text: And they stationed a force there to guard it[a], and they fortified it to guard Bethsura[b], so that the people might have a stronghold facing Idumea.
translation:
  language: de
  text: Und sie stationierten dort eine Streitmacht, die es bewachen sollte[a], und sie befestigten es, um Bet-Sur[b] zu bewachen, damit das Volk eine Festung Idumäa gegenüber haben konnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie befahlen dort einer Streitmacht, es zu bewachen.“ Das griechische Verb kann „befehlen“ oder „beauftragen“ bedeuten; im Zusammenhang ist wohl die Stationierung von Truppen zum Wachdienst gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Bet-Sur war ein befestigter Ort südlich von Jerusalem und lag strategisch in Richtung Idumäa.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέταξαν
  choice: stationierten
  rationale: Das Verb bedeutet grundsätzlich „anordnen“ oder „beauftragen“; mit δύναμιν und dem Infinitiv τηρεῖν bezeichnet es hier die Zuweisung einer Streitmacht zu einem Wachposten. „Stationierten“ gibt den militärischen Zusammenhang natürlich wieder.
- source_word: δύναμιν
  choice: eine Streitmacht
  rationale: Das Substantiv kann militärische Stärke oder einen Truppenverband bezeichnen. „Streitmacht“ wahrt den kollektiven militärischen Sinn, ohne die Größe näher festzulegen.
- source_word: τηρεῖν
  choice: bewachen
  rationale: Im militärischen Zusammenhang bezeichnet das Verb das Hüten oder Bewachen eines Ortes; dieselbe Wiedergabe wird bei beiden Vorkommen beibehalten.
- source_word: ὠχύρωσαν
  choice: befestigten
  rationale: Das Verb bezeichnet das militärische Sichern beziehungsweise Ausbauen zu einem befestigten Ort.
- source_word: τὴν Βαιθσουρά
  choice: Bet-Sur
  rationale: Die etablierte deutschsprachige Form des Ortsnamens ist gut verständlich und entspricht dem semitischen Namen hinter der griechischen Form Βαιθσουρά.
- source_word: τοῦ ἔχειν
  choice: damit … hätte
  rationale: Der mit τοῦ gebildete substantivierte Infinitiv drückt hier einen Zweck aus. Der deutsche Finalsatz gibt diese Funktion klar wieder.
- source_word: ὀχύρωμα
  choice: eine Festung
  rationale: Das Wort bezeichnet einen befestigten, der Verteidigung dienenden Ort. „Festung“ ist im Deutschen prägnant und kontextgerecht.
- source_word: κατὰ πρόσωπον τῆς Ἰδουμαίας
  choice: gegenüber von Idumäa
  rationale: Die Wendung bezeichnet eine räumliche Ausrichtung oder Lage vor beziehungsweise gegenüber dem Gebiet Idumäas; „gegenüber von“ bewahrt diesen räumlichen Sinn.
theological_decisions:
- issue: Bezug des zweiten αὐτό in „ὠχύρωσαν αὐτὸ τηρεῖν τὴν Βαιθσουρά“
  choice: Das Pronomen wird als „es“ wiedergegeben, ohne seinen Bezug zu präzisieren.
  alternative: Den Bezug durch „diesen Ort“ oder einen ausdrücklich genannten Ort auflösen.
  rationale: Der vorgelegte griechische Wortlaut enthält ein sächliches Pronomen, dessen Bezug im Vers nicht eindeutig ist. Eine ausdrückliche Identifizierung würde die im Ausgangstext vorhandene Unbestimmtheit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Terminologie. Die Wiederholung von „es“ bewahrt die im vorgelegten griechischen Wortlaut vorhandene Unbestimmtheit, während zwei Sätze die lange Koordination lesbarer machen.
