  text: And at daybreak Judas appeared in the plain with three thousand men; but they did not have armor and a sword as they wished.
translation:
  language: de
  text: Bei Tagesanbruch erschien Judas mit dreitausend Männern in der Ebene; doch verfügten sie nicht über Rüstungen und ein Schwert, wie sie es sich wünschten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅμα ἡμέρᾳ
  choice: Bei Tagesanbruch
  rationale: Die Wendung bezeichnet den Beginn des Tages und wird im Deutschen natürlich und präzise wiedergegeben.
- source_word: ὤφθη
  choice: erschien
  rationale: Die passive Form bedeutet wörtlich „wurde gesehen“, kann hier aber idiomatisch das Sichtbarwerden beziehungsweise Auftreten des Judas bezeichnen.
- source_word: ἐν τῷ πεδίῳ
  choice: in der Ebene
  rationale: πεδίον bezeichnet offenes, ebenes Gelände beziehungsweise eine Ebene.
- source_word: καλύμματα
  choice: Rüstungen
  rationale: Das Grundwort bedeutet „Bedeckungen“; im militärischen Zusammenhang sind schützende Ausrüstungsstücke beziehungsweise Rüstungen gemeint.
- source_word: μάχαιραν
  choice: Schwertern
  rationale: Der griechische Singular kann hier generisch oder kollektiv verstanden werden. Der deutsche Plural passt zum mehrzahligen Trägerkreis und bezeichnet die benötigten Waffen, ohne einen einzelnen Gegenstand zu behaupten.
- source_word: καθὼς ἠβούλοντο
  choice: wie sie es sich wünschten
  rationale: Bewahrt den offenen Vergleich des Griechischen, ohne festzulegen, ob Menge, Qualität oder Vollständigkeit der Ausrüstung unzureichend war.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Formulierung „nicht so ... ausgestattet“ gibt die im Griechischen knappe Aussage natürlich wieder und lässt offen, in welcher Hinsicht Rüstungen und Schwerter nicht ihren Wünschen entsprachen.
