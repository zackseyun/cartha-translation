  source_fidelity: 'Die Grundbedeutung wird gut getroffen: συνιδόντες bezeichnet Wahrnehmen/Erkennen, ἐδειλώθησαν σφόδρα starke Furcht bzw. Entmutigung, und die militärische Bereitschaft von εἰς παράταξιν ist berücksichtigt. „Völlig“ ist jedoch stärker und absoluter als σφόδρα („sehr, äußerst“). Zudem ist „das Lager … bereit, sich … aufzustellen“ im Deutschen semantisch und syntaktisch unglücklich, weil ein Lager sich nicht selbst aufstellt. „Zur Schlachtordnung bereitstand“ gibt die militärische Aussage präzise wieder, ohne die im griechischen παρεμβολή mögliche Nähe von Lager und Heeresmacht aufzulösen.'
