  text: But when they saw these things[a], they were greatly terrified; and when they also saw Judas's camp in the plain, ready for battle,
translation:
  language: de
  text: Als sie dies sahen, wurden sie sehr entmutigt; und als sie auch Judas’ Lager in der Ebene sahen, das zur Schlachtordnung bereitstand,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνιδόντες
  choice: als sie das erkannten / als sie … sahen
  rationale: Das zweimalige συνιδόντες bezeichnet ein wahrnehmendes Erfassen. Beim ersten Vorkommen klingt „erkannten“ im Deutschen natürlich und schließt die Folgerung aus dem Gesehenen ein; beim zweiten steht wegen des sichtbaren Lagers „sahen“.
- source_word: ἐδειλώθησαν σφόδρα
  choice: verloren sie völlig den Mut
  rationale: Das Verb bezeichnet nicht nur Furcht, sondern ein Verzagen beziehungsweise den Verlust des Mutes; σφόδρα verstärkt dies. Die Wendung ist idiomatisch und passt zur militärischen Lage.
- source_word: παρεμβολή
  choice: Lager
  rationale: Im militärischen Zusammenhang bezeichnet παρεμβολή ein Lager oder Heerlager. „Lager“ bewahrt die konkrete Bedeutung, ohne ausdrücklich „Truppen“ in den Text einzutragen.
- source_word: ἐν τῷ πεδίῳ
  choice: in der Ebene
  rationale: πεδίον bezeichnet hier offenes, ebenes Gelände; „in der Ebene“ gibt den räumlichen Sinn präzise und natürlich wieder.
- source_word: ἑτοίμην εἰς παράταξιν
  choice: bereit, sich zum Kampf aufzustellen
  rationale: ἑτοίμην bedeutet „bereit“, während παράταξις die militärische Aufstellung beziehungsweise Schlachtordnung bezeichnet. Die Formulierung macht den spezifischen militärischen Sinn verständlich, ohne lediglich allgemein „kampfbereit“ zu sagen.
