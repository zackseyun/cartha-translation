base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/044.yaml
  text: And they deliberated concerning the defiled altar of burnt offering[a], what they should do with it.
translation:
  language: de
  text: Und sie berieten über den entweihten Brandopferaltar[a], was sie mit ihm tun sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verunreinigten Brandopferaltar“; auch: „geschändeten Brandopferaltar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: sie berieten
  rationale: Das mediale Verb bezeichnet hier gemeinsames Beratschlagen und nicht schon eine abschließende Entscheidung. „Sie berieten“ gibt dies natürlich und präzise wieder.
- source_word: θυσιαστηρίου
  choice: Altar
  rationale: Die Grundbedeutung ist „Altar“; seine kultische Funktion wird durch den folgenden Genitiv näher bestimmt.
- source_word: ὁλοκαυτώσεως
  choice: Brandopferaltar
  rationale: Das deutsche Kompositum bezeichnet knapp und idiomatisch den für Brandopfer bestimmten Altar.
- source_word: βεβηλωμένου
  choice: entweihten
  rationale: Das Partizip beschreibt eine bereits erfolgte kultische Profanierung. „Entweiht“ bewahrt diesen religiös-kultischen Sinn, ohne die Art der Verunreinigung näher festzulegen.
- source_word: τί αὐτῷ ποιήσωσιν
  choice: was sie mit ihm tun sollten
  rationale: Die Wendung bezeichnet die erwogene Vorgehensweise hinsichtlich des Altars. „Mit ihm“ ist im Deutschen natürlich und vermeidet die unnötige Festlegung auf eine gegen ihn gerichtete Handlung.
theological_decisions:
- issue: Kultische Beschreibung des Zustands des Altars
  choice: entweihter Brandopferaltar
  alternative: verunreinigter oder geschändeter Brandopferaltar
  rationale: βεβηλωμένου bezeichnet eine kultische Verletzung beziehungsweise Profanierung. „Entweiht“ bringt diesen Aspekt klar zum Ausdruck; „verunreinigt“ und „geschändet“ bleiben mögliche kontextuelle Wiedergaben, setzen jedoch jeweils etwas andere Akzente.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sie berieten“ wahrt den gemeinsamen Beratungsvorgang; „Brandopferaltar“ ist knapp, verständlich und im biblisch-kultischen Zusammenhang etabliert.
