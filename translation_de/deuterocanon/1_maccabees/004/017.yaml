  text: And he said to the people[a], “Do not desire the spoils[b], for the battle is before us,”
translation:
  language: de
  text: 'Und er sagte zum Volk: „Verlangt nicht nach der Beute,[a] denn der Kampf steht uns bevor.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid nicht begierig auf die Beute.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn der Kampf steht uns gegenüber“; auch möglich: „Denn der Kampf richtet sich gegen uns“.'
