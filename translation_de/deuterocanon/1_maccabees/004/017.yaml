lexical_decisions:
- source_word: ἐπιθυμήσητε
  choice: verlangt … nach
  rationale: Das Verb bezeichnet ein starkes Begehren oder Verlangen. „Verlangt nicht nach“ klingt im heutigen Deutsch natürlich und gibt die Warnung wieder, ohne ausdrücklich den engeren moralischen Beiklang von „begehren“ festzulegen.
- source_word: σκύλων
  choice: Beute
  rationale: Der Plural bezeichnet hier im Krieg erbeutete Güter. „Beute“ ist im Deutschen klar, geläufig und dem würdigen Erzählstil angemessen.
- source_word: πόλεμος
  choice: Kampf
  rationale: Obwohl das Wort auch „Krieg“ bedeuten kann, geht es hier um die unmittelbar bevorstehende militärische Auseinandersetzung; daher passt „Kampf“ besser.
- source_word: ἐξ ἐναντίας ἡμῶν
  choice: steht uns bevor
  rationale: Die griechische Wendung bezeichnet etwas, das einem gegenüberliegt oder entgegentritt. Im Zusammenhang gibt „steht uns bevor“ die unmittelbar anstehende Konfrontation natürlich wieder; die mögliche Bedeutung „gegen uns“ wird in einer Fußnote bewahrt.
- source_word: λαόν
  choice: Volk
  rationale: Der griechische Text verwendet den umfassenden Ausdruck „Volk“. Obwohl hier die versammelten Kämpfer angesprochen sind, wird er nicht interpretierend zu „Truppen“ oder „Heer“ verengt.
