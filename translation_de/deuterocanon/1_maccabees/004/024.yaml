  source_fidelity: 'Das temporale Aoristpartizip ἐπιστρέψαντες, die zwei Lobpreisverben und die Richtungsangabe εἰς οὐρανόν werden grundsätzlich getroffen. »Umgekehrt waren« ist jedoch im heutigen Deutsch semantisch unnötig mehrdeutig (auch: seine Gesinnung ändern) und stilistisch schwerfällig. Die Konstruktion »den Himmel preisen« macht den Himmel eher zum direkten Gegenstand des Lobes, während εἰς die Richtung des Lobpreises markiert.'
  naturalness: »Als sie zurückkehrten« ist modernes, klares Standarddeutsch und gibt den zeitlichen Bewegungsbezug wieder. »Zum Himmel hin priesen« macht die im Griechischen ausgedrückte Ausrichtung idiomatisch genug sichtbar, ohne »Gott« in den Haupttext einzusetzen.
  terminology: »Loblieder«, »Barmherzigkeit« und die persönliche Wiedergabe »er ist gut« sind angemessen. Die Fußnote zur möglichen unpersönlichen Deutung von καλόν bewahrt die formale Mehrdeutigkeit. Die kulturelle Fußnote erläutert zutreffend den ehrfürchtigen Bezug von »Himmel« auf Gott.
