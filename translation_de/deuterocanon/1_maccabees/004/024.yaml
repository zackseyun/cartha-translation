  yaml_path: translation/deuterocanon/1_maccabees/004/024.yaml
  text: 'And when they turned back, they sang hymns and gave praise to heaven: “For he is good; his mercy endures forever.”'
translation:
  language: de
  text: Als sie zurückkehrten, sangen sie Loblieder und priesen zum Himmel hin:[a] »Denn er ist gut; seine Barmherzigkeit bleibt für immer.«[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zum Himmel«; damit ist der Lobpreis ehrfürchtig an Gott gerichtet.'
    reason: cultural_note
  - marker: b
    text: 'Oder wörtlicher: »Denn es ist gut; seine Barmherzigkeit ist für immer.« Der Haupttext gibt den wahrscheinlich gemeinten persönlichen Sinn der liturgischen Formel wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: als sie umgekehrt waren
  rationale: Das Aoristpartizip wird temporal wiedergegeben und bewahrt die Bewegungsbedeutung, ohne ein Ziel des Zurückkehrens hinzuzufügen.
- source_word: ὕμνουν
  choice: sangen sie Loblieder
  rationale: ὑμνέω bezeichnet das Singen von Preis- oder Lobliedern; die Wiedergabe erhält den musikalisch-liturgischen Sinn.
- source_word: ᾐνοῦν
  choice: priesen
  rationale: αἰνέω bedeutet »preisen«. Ein eigenes Verb bewahrt die Paarung mit ὕμνουν, ohne sie unnötig schwerfällig zu machen.
- source_word: εἰς οὐρανόν
  choice: den Himmel
  rationale: Die Präposition bezeichnet hier Ziel oder Ausrichtung des Lobpreises. »Den Himmel preisen« wahrt die ehrfürchtige Umschreibung für Gott, ohne den Gottesnamen in den Haupttext einzutragen.
- source_word: ὅτι καλὸν
  choice: Denn er ist gut
  rationale: Obwohl καλόν grammatisch auch unpersönlich verstanden werden kann, legt die liturgische Formel zusammen mit »seine Barmherzigkeit« den persönlichen Bezug auf Gott nahe.
- source_word: εἰς τὸν αἰῶνα
  choice: bleibt für immer
  rationale: Die Wendung bezeichnet bleibende Dauer. »Bleibt für immer« ist im Deutschen natürlich und fügt gegenüber dem knappen griechischen Nominalsatz nur das nötige Verb hinzu.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: seine Barmherzigkeit
  rationale: ἔλεος bezeichnet Erbarmen oder barmherzige Zuwendung. »Barmherzigkeit« ist direkt, würdig und theologisch nicht überbestimmt.
theological_decisions:
- issue: Unausgesprochenes Subjekt in der Lobpreisformel
  choice: 'Persönlich auf Gott bezogen: »Denn er ist gut«'
  alternative: 'Unpersönlich: »Denn es ist gut«'
  rationale: Die Formulierung klingt an biblische Dank- und Lobpreisformeln an; außerdem macht »seine Barmherzigkeit« den persönlichen Bezug wahrscheinlich. Die formale Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
- issue: »Himmel« als ehrfürchtige Umschreibung
  choice: Die griechische Formulierung »den Himmel« im Haupttext bewahren
  alternative: Den impliziten Bezug ausdrücklich als »Gott« wiedergeben
  rationale: Der Text richtet den Lobpreis wörtlich an den Himmel und verwendet dies ehrfürchtig für Gott. Die direkte Form bewahrt Ausdruck und kulturelle Färbung; eine Fußnote erklärt den Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Verben des Lobpreises bleiben unterscheidbar; die ehrfürchtige Umschreibung »Himmel« sowie die formale Mehrdeutigkeit von καλόν werden nicht stillschweigend beseitigt.
