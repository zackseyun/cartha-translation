    rationale: Die Formulierung ist im modernen Deutsch unnatürlich und kann neben der gemeinten Rückkehr auch eine Umkehr im Sinn von Sinneswandel oder Bekehrung bedeuten. »Als sie zurückkehrten« ist eindeutig und kontextgerecht.
  - severity: medium
    issue: »priesen den Himmel«
    rationale: Das Akkusativobjekt verschiebt die griechische Präposition εἰς von einer Richtungsangabe zu einem unmittelbaren Objekt des Preisens. »priesen zum Himmel hin« erhält die Ausrichtung des Lobpreises und die ehrfürchtige Umschreibung.
