  yaml_path: translation/deuterocanon/1_maccabees/004/009.yaml
  text: Remember how our fathers were saved in the Red Sea when Pharaoh pursued them with force[a].
translation:
  language: de
  text: Denkt daran, wie unsere Väter im Roten Meer gerettet wurden, als der Pharao sie mit Macht verfolgte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνήσθητε
  choice: Denkt daran
  rationale: Der Aoristimperativ fordert zu einer bewussten, gemeinsamen Erinnerung auf. „Denkt daran“ ist im modernen Deutschen natürlich und unmittelbar.
- source_word: ἐσώθησαν
  choice: gerettet wurden
  rationale: Die Passivform von σῴζω bezeichnet hier die Rettung aus geschichtlicher Gefahr und bewahrt zugleich den biblischen Klang der Rettungssprache.
- source_word: οἱ πατέρες ἡμῶν
  choice: unsere Väter
  rationale: Die Wiedergabe folgt der ausdrücklich maskulinen griechischen Form und der traditionellen Bezeichnung der israelitischen Vorväter.
- source_word: ἐν θαλάσσῃ ἐρυθρᾷ
  choice: im Roten Meer
  rationale: Dies entspricht eng dem griechischen ἐν und der gewöhnlichen Bedeutung von ἐρυθρὰ θάλασσα im biblischen Griechisch.
- source_word: ἐδίωξεν
  choice: verfolgte
  rationale: „Verfolgte“ ist die übliche und angemessen würdevolle Wiedergabe im militärisch-erzählenden Zusammenhang.
- source_word: ἐν δυνάμει
  choice: mit großer Macht
  rationale: δύναμις kann Macht, Stärke oder militärische Streitmacht bezeichnen. Die Formulierung bewahrt die allgemeinere Aussage des Griechischen, ohne ausdrücklich „Heer“ einzusetzen; „großer“ macht die im Deutschen sonst unnatürliche Wendung idiomatisch.
theological_decisions:
- issue: Rettungssprache in einem geschichtlichen Befreiungsgeschehen
  choice: gerettet wurden
  alternative: befreit wurden; errettet wurden
  rationale: „Gerettet“ gibt σῴζω unmittelbar wieder und erhält dessen biblische Resonanz, ohne dem Vers eine spätere dogmatische Bedeutung aufzuzwingen.
- issue: Geschlechtsspezifische Bezeichnung der Vorfahren
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die Übersetzung bewahrt die maskuline Form des Ausgangstextes, statt sie stillschweigend zu neutralisieren.
- issue: Art der Macht, mit der der Pharao verfolgte
  choice: mit großer Macht
  alternative: mit einem Heer; mit Heeresmacht
  rationale: Der Kontext lässt militärische Macht naheliegen, doch ἐν δυνάμει nennt nicht ausdrücklich ein Heer. Daher bleibt die Übersetzung bewusst allgemeiner.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Ausgangstext; eine Fußnote ist nicht nötig, da „Rotes Meer“ den vorliegenden griechischen Text direkt wiedergibt und „Schilfmeer“ lediglich den hebräischen Traditionshintergrund betrifft.
