  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes zuverlässig wieder: das kultische Darbringen eines Opfers (ἀνήνεγκαν θυσίαν), die Ausführung gemäß dem Gesetz (κατὰ τὸν νόμον), den neuen Brandopferaltar sowie den von ihnen zuvor errichteten Altar (ὃ ἐποίησαν). Die deutsche Vorvergangenheit „errichtet hatten“ ist als natürliche Einordnung der vorherigen Errichtung gegenüber dem anschließenden Opferdarbringen vertretbar.'
