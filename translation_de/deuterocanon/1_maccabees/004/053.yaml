base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/053.yaml
  text: And they offered sacrifice according to the law on the new altar of burnt offering that they had made[a].
translation:
  language: de
  text: Und sie brachten nach dem Gesetz auf dem neuen Brandopferaltar, den sie errichtet hatten, ein Opfer dar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem neuen Altar für Brandopfer, den sie errichtet hatten“.'
    reason: Lexikalische Alternative zur kompakten Wiedergabe „Brandopferaltar“; der griechische Genitiv kann als Zweckbestimmung ausgedrückt werden.
lexical_decisions:
- source_word: ἀνήνεγκαν
  choice: brachten … dar
  rationale: Im kultischen Zusammenhang bezeichnet ἀναφέρω das Darbringen eines Opfers. „brachten … dar“ ist im Deutschen natürlich und bewahrt den sakralen Sinn.
- source_word: θυσίαν
  choice: ein Opfer
  rationale: θυσία bezeichnet ein Opfer beziehungsweise die Opfergabe. „ein Opfer“ passt als direktes Objekt und erhält die kultische Ausdrucksweise.
- source_word: κατὰ τὸν νόμον
  choice: nach dem Gesetz
  rationale: Die Wendung bezeichnet die Übereinstimmung mit den gesetzlichen Vorschriften; „nach dem Gesetz“ ist knapp, idiomatisch und lässt den ausdrücklichen Gesetzesbezug bestehen.
- source_word: θυσιαστήριον τῶν ὁλοκαυτωμάτων
  choice: Brandopferaltar
  rationale: Der Genitiv bezeichnet den für Ganzbrandopfer bestimmten Altar. „Brandopferaltar“ ist die etablierte, verständliche deutsche Kultbezeichnung.
- source_word: τὸ καινόν
  choice: neuen
  rationale: Das Adjektiv kennzeichnet den Altar gegenüber dem entweihten früheren Altar schlicht als neu.
- source_word: ὃ ἐποίησαν
  choice: den sie errichtet hatten
  rationale: ποιέω meint hier die Herstellung beziehungsweise den Bau des Altars. „errichtet hatten“ gibt den sachlichen Sinn und die zeitliche Vorordnung natürlich wieder.
theological_decisions:
- issue: Kultische Terminologie des Tempeldienstes
  choice: Die ausdrückliche Opfersprache bleibt mit „ein Opfer darbringen“ und „Brandopferaltar“ erhalten.
  alternative: Verallgemeinerte Gottesdienstsprache wie „eine Gabe bringen“ oder lediglich „auf dem Altar“.
  rationale: Der Vers handelt konkret von der Wiederaufnahme des gesetzmäßigen Tempelopfers; allgemeinere Formulierungen würden den kultischen und gesetzlichen Akzent abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung rückt die Gesetzmäßigkeit und den neuen Altar hervor, während das trennbare Verb „darbringen“ idiomatisch abgeschlossen wird.
