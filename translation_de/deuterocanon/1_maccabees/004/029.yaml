base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/029.yaml
  text: And they came into Idumea and encamped at Beth-zur[a], and Judas met them with ten thousand men.
translation:
  language: de
  text: Und sie kamen nach Idumäa und schlugen bei Bet-Zur[a] ihr Lager auf. Judas zog ihnen mit zehntausend Mann entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Βηθορούς; die Ortsbezeichnung wird teils auch als Bet-Horon wiedergegeben.
    reason: Die griechische Namensform ist textlich eindeutig, ihre Zuordnung zum semitischen Ortsnamen jedoch umstritten. Der Zusammenhang mit Idumäa spricht für Bet-Zur, während eine traditionelle Wiedergabe Bet-Horon lautet.
lexical_decisions:
- source_word: ἦλθον εἰς τὴν Ἰδουμαίαν
  choice: sie kamen nach Idumäa
  rationale: Die schlichte aoristische Bewegungsangabe wird natürlich wiedergegeben; »nach« bezeichnet den Eintritt in die Region, ohne eine im Deutschen unklare Perspektive durch »hinein« festzulegen.
- source_word: παρεμβάλον
  choice: schlugen … ihr Lager auf
  rationale: Das Verb bezeichnet im militärischen Zusammenhang das Beziehen eines Lagers; die deutsche Wendung ist gegenwärtig, würdig und idiomatisch.
- source_word: ἐν Βηθορούς
  choice: bei Bet-Zur
  rationale: Βηθορούς ist hier am plausibelsten als griechische Form von Bet-Zur zu verstehen; der Kontext eines Feldzugs nach Idumäa stützt diese Identifizierung. »bei« lässt offen, ob das Lager innerhalb oder in der Nähe des Ortes lag.
- source_word: συνήντησεν αὐτοῖς
  choice: zog ihnen … entgegen
  rationale: Das Verb mit Dativ bezeichnet hier das Entgegentreten beziehungsweise die Begegnung mit der feindlichen Streitmacht; diese Wiedergabe macht die militärische Bewegung natürlich verständlich, ohne den Ausgang der Begegnung vorwegzunehmen.
- source_word: ἐν δέκα χιλιάσιν ἀνδρῶν
  choice: mit zehntausend Mann
  rationale: Das instrumentale beziehungsweise begleitende ἐν bezeichnet die Stärke der Truppe. »Mann« bleibt nahe an ἀνδρῶν und ist im Deutschen die übliche Angabe einer Truppenstärke.
