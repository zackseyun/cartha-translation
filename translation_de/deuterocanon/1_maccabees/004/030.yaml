base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/030.yaml
  text: And when he saw that the camp was strong[a], he prayed and said, “Blessed are you, O Savior of Israel, who crushed the assault of the mighty one by the hand of your servant David[b], and gave the camp of the foreigners into the hands of Jonathan son of Saul and of the one who carried his armor.”
translation:
  language: de
  text: 'Als er sah, dass das Heerlager stark war, betete er und sagte: »Gepriesen seist du, Retter Israels! Du hast den Ansturm des Mächtigen durch die Hand deines Knechtes David[a] zerschmettert und das Heerlager der Fremden in die Hände Jonatans, des Sohnes Sauls, und seines Waffenträgers gegeben.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann δοῦλος auch »Sklave« heißen: »deines Sklaven David«.'
    reason: lexical_alternative
  - marker: b
    text: Das Gebet spielt auf Davids Sieg über Goliat und auf Jonatans Kampf zusammen mit seinem Waffenträger an. Im Griechischen stehen jedoch allgemein »der Mächtige« und »die Fremden«; die Namen Goliat und Philister werden nicht ausdrücklich genannt.
    reason: cross_reference
lexical_decisions:
- source_word: παρεμβολή
  choice: Heerlager
  rationale: Der militärische Zusammenhang verlangt mehr als das allgemeine »Lager«; »Heerlager« kann sowohl den befestigten Lagerplatz als auch die dort versammelte Streitmacht bezeichnen.
- source_word: ἰσχυράν
  choice: stark
  rationale: »Stark« gibt die militärische Überlegenheit knapp und unmittelbar wieder, ohne den Ausdruck unnötig zu steigern.
- source_word: σωτήρ
  choice: Retter
  rationale: »Retter« ist im modernen Deutschen natürlich, würdig und bewahrt den theologischen Titel für Gott.
- source_word: συντρίψας
  choice: zerschmettert
  rationale: Das Verb bezeichnet eine gewaltsame, entscheidende Niederlage; »zerschmettert« erhält die kraftvolle Bildsprache.
- source_word: ὅρμημα
  choice: Ansturm
  rationale: »Ansturm« bildet die Bedeutung eines heftigen Vorstoßes genauer ab als das allgemeinere »Angriff«.
- source_word: τοῦ δυνατοῦ
  choice: des Mächtigen
  rationale: Die substantivierte Einzahl bleibt erhalten und lässt die Anspielung auf Goliat erkennen, ohne ihn im Haupttext ausdrücklich zu nennen.
- source_word: ἐν χειρὶ
  choice: durch die Hand
  rationale: Die biblische Wendung für Vermittlung bzw. Wirksamkeit wird bewusst bewahrt.
- source_word: δούλου
  choice: Knecht
  rationale: Im Gebets- und Schriftregister bezeichnet »Knecht« Davids Zugehörigkeit und Unterordnung gegenüber Gott, ohne im heutigen Deutschen vorrangig die rechtliche Institution der Sklaverei aufzurufen; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: ἀλλοφύλων
  choice: Fremden
  rationale: Die allgemeine griechische Bezeichnung wird beibehalten; »Philister« wäre zwar der historische Bezug, würde aber eine im Vers nicht ausdrücklich genannte Identifikation in den Haupttext eintragen.
- source_word: τοῦ αἴροντος τὰ σκεύη αὐτοῦ
  choice: seines Waffenträgers
  rationale: Die feste deutsche Bezeichnung gibt die Person, die Jonatans Waffen beziehungsweise Ausrüstung trug, natürlich und prägnant wieder.
theological_decisions:
- issue: Wiedergabe von δοῦλος als Bezeichnung Davids
  choice: deines Knechtes David
  alternative: deines Sklaven David
  rationale: »Knecht« bewahrt in diesem Gebetskontext Unterordnung und Zugehörigkeit und entspricht dem würdigen deutschen Bibelregister. Da δοῦλος auch »Sklave« bedeuten kann, wird diese echte lexikalische Alternative ausdrücklich vermerkt.
- issue: Explizite Benennung von Goliat und den Philistern
  choice: Die allgemeinen Ausdrücke »der Mächtige« und »die Fremden« bleiben im Haupttext erhalten.
  alternative: »Goliat« und »die Philister« ausdrücklich nennen
  rationale: Die Anspielungen sind deutlich, doch der griechische Text nennt diese Namen nicht. Die Übersetzung wahrt daher die Ausdrucksweise und indirekte Spannung der Vorlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer biblischer Sprachprägung. Der Satzbau bleibt nahe an der griechischen Gebetsform, wird aber durch Ausruf und klare Zuordnung des Waffenträgers im Deutschen flüssig gestaltet.
