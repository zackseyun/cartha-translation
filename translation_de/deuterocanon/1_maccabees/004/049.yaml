  text: And they made new holy vessels[b][a], and they brought the lampstand and the altar of burnt offerings and of incense and the table into the temple.
translation:
  language: de
  text: Und sie fertigten neue heilige Geräte an. Sie brachten den Leuchter, den Altar für Brandopfer und Räucherwerk[a] sowie den Tisch in das Heiligtum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text nennt grammatisch nur einen „Altar“ und bezieht sowohl „Brandopfer“ als auch „Räucherwerk“ darauf. Gemeint sein können jedoch die beiden bekannten Altäre: der Brandopferaltar und der Räucheraltar.'
    reason: lexical_alternative
  - marker: b
    text: „Heiligtum“ bezeichnet hier das eigentliche Tempelgebäude, nicht den gesamten Tempelbezirk.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: sie fertigten … an
  rationale: Im Zusammenhang mit neu hergestellten Tempelgeräten bezeichnet ποιέω das Anfertigen. Die Formulierung ist natürlich und bringt den handwerklichen Vorgang zum Ausdruck, ohne ihn näher auszumalen.
- source_word: τὰ σκεύη τὰ ἅγια καινά
  choice: neue heilige Geräte
  rationale: σκευή bezeichnet hier die für den Kult bestimmten Gegenstände insgesamt. „Geräte“ umfasst auch Leuchter und Tisch besser als das engere „Gefäße“; „heilig“ und „neu“ geben ἅγια und καινά unmittelbar wieder.
- source_word: εἰσήνεγκαν
  choice: sie brachten … in
  rationale: Das Verb bezeichnet eine Bewegung nach innen; zusammen mit εἰς τὸν ναόν ist „in das Heiligtum bringen“ die klare deutsche Entsprechung.
- source_word: τὴν λυχνίαν
  choice: den Leuchter
  rationale: Im Kontext der Tempelausstattung bezeichnet λυχνία den Lampenständer beziehungsweise Leuchter, nicht bloß eine einzelne Lampe.
- source_word: τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων καὶ θυμιαμάτων
  choice: den Altar für Brandopfer und Räucherwerk
  rationale: Die Übersetzung bewahrt den Singular „Altar“ und ordnet ihm wie im Griechischen beide Genitive zu. Da sachlich wahrscheinlich die beiden bekannten Altäre gemeint sind, wird diese Spannung in einer Fußnote offengelegt.
- source_word: τὴν τράπεζαν
  choice: den Tisch
  rationale: Der griechische Text nennt lediglich den Tisch. Eine Ergänzung wie „für die Schaubrote“ wäre sachlich erklärend, steht aber nicht ausdrücklich im Vers.
- source_word: εἰς τὸν ναόν
  choice: in das Heiligtum
  rationale: ναός bezeichnet hier das eigentliche Heiligtumsgebäude und nicht den gesamten Tempelbezirk. „Heiligtum“ gibt diese räumliche Eingrenzung im Deutschen präzise wieder.
theological_decisions:
- issue: Zuordnung von Brandopfern und Räucherwerk zu einem oder zwei Altären
  choice: 'Den grammatischen Singular beibehalten: „den Altar für Brandopfer und Räucherwerk“'
  alternative: „den Brandopferaltar und den Räucheraltar“
  rationale: Der überlieferte griechische Satz hat nur ein θυσιαστήριον und stellt beide Genitive dazu. Der historische Tempelkontext legt jedoch die bekannten zwei Altäre nahe. Der Haupttext bewahrt deshalb die sprachliche Spannung, während die Fußnote die sachlich naheliegende Alternative nennt.
- issue: Nähere Bestimmung des Tisches
  choice: Nur „den Tisch“
  alternative: „den Tisch für die Schaubrote“
  rationale: Die Funktion des Tisches ist im Tempelkontext zwar bekannt, wird in diesem Vers aber nicht ausdrücklich genannt. Eine Erweiterung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heilige Geräte“ ist als Sammelbezeichnung allgemein verständlich und für die verschiedenartigen Kultgegenstände geeignet. Die Aufteilung in zwei Sätze vermeidet eine schwerfällige Häufung von „und“, ohne die Reihenfolge oder den Inhalt des griechischen Textes zu verändern.
