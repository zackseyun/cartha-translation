  yaml_path: translation/deuterocanon/1_maccabees/004/036.yaml
  text: Then Judas and his brothers said[a], “Look, our enemies have been crushed[b]. Let us go up to cleanse the sanctuary and dedicate it.”
translation:
  language: de
  text: 'Da sagten Judas und seine Brüder: »Seht, unsere Feinde sind zerschmettert. Lasst uns hinaufziehen, um das Heiligtum zu reinigen und einzuweihen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δὲ Ἰούδας καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: Da sagten Judas und seine Brüder
  rationale: Das singularische Prädikat vor dem zusammengesetzten Subjekt wird im natürlichen Deutschen pluralisch wiedergegeben. δέ führt die Erzählung mit »Da« weiter; ἀδελφοί bezeichnet hier die leiblichen Brüder.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Der Aufmerksamkeit weckende Imperativ wird würdig und gegenwärtig wiedergegeben; der Plural passt zur angesprochenen Gruppe.
- source_word: συνετρίβησαν
  choice: sind zerschmettert
  rationale: Der Aorist Passiv von συντρίβω bezeichnet eine entschiedene Niederlage. Das deutsche resultative Perfekt wahrt den nun vorliegenden Zustand.
- source_word: ἀναβῶμεν
  choice: Lasst uns hinaufziehen
  rationale: Der hortative Konjunktiv wird als gemeinsame Aufforderung wiedergegeben. »Hinaufziehen« bewahrt die räumliche Bewegung nach Jerusalem beziehungsweise zum Tempelberg.
- source_word: καθαρίσαι τὰ ἅγια
  choice: das Heiligtum zu reinigen
  rationale: Im Zusammenhang der Tempelentweihung bezeichnet τὰ ἅγια den heiligen Tempelbereich; »reinigen« bewahrt sowohl den konkreten als auch den kultischen Sinn.
- source_word: ἐγκαινίσαι
  choice: neu einzuweihen
  rationale: Das Verb kann »einweihen« oder »erneuern« bezeichnen. Da ein bereits bestehendes, entweihtes Heiligtum wieder für den Gottesdienst bestimmt wird, gibt »neu einweihen« die kontextuelle Erneuerung wieder, ohne sie im Haupttext unerklärt vorauszusetzen.
theological_decisions:
- issue: Referenz und kultischer Gehalt von τὰ ἅγια
  choice: das Heiligtum zu reinigen
  alternative: die heiligen Stätten zu reinigen / das Heiligtum zu läutern
  rationale: Der unmittelbare Zusammenhang zielt auf den Jerusalemer Tempel als heiligen Bereich. »Heiligtum« ist im Deutschen klar und lässt den kultischen Charakter der Reinigung erkennen.
- issue: Bedeutung von ἐγκαινίσαι nach der Entweihung des Tempels
  choice: neu einzuweihen
  alternative: einzuweihen / wieder einzuweihen
  rationale: Der griechische Ausdruck benennt Einweihung beziehungsweise Erneuerung, während der Kontext eine erneute Weihe verlangt. Die Fußnote hält die lexikalische Alternative offen und vermeidet eine konfessionelle Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Seht« und »Lasst uns hinaufziehen« bewahren die unmittelbare, gemeinschaftliche Rede, ohne archaisch zu wirken. Der einzige Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Wiedergabe.
