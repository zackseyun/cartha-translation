  text: And they cleansed the sanctuary, and carried the stones of defilement to an unclean place.
translation:
  language: de
  text: Und sie reinigten das Heiligtum und brachten die Steine der Verunreinigung an einen unreinen Ort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαθάρισαν
  choice: reinigten
  rationale: Das Verb bezeichnet hier im Zusammenhang mit dem Tempel sowohl die tatsächliche Säuberung als auch die kultische Reinigung. „Reinigten“ bewahrt beide Aspekte.
- source_word: τὰ ἅγια
  choice: das Heiligtum
  rationale: Der substantivierte neutrale Plural bezeichnet in diesem Kontext den heiligen Tempelbereich. „Das Heiligtum“ ist im Deutschen idiomatisch und sachlich klar.
- source_word: ἦραν
  choice: brachten
  rationale: αἴρω kann „aufheben“, „wegnehmen“ oder „forttragen“ bedeuten. Da die Steine zu einem anderen Ort verbracht werden, gibt „brachten“ die konkrete Bewegung natürlich wieder.
- source_word: τοὺς λίθους τοῦ μιασμοῦ
  choice: die Steine der Verunreinigung
  rationale: Die Genitivverbindung ordnet die Steine der kultischen Verunreinigung zu, die durch die Entweihung entstanden war. Die nominale Formulierung hält sich eng an den griechischen Ausdruck und lässt dessen genaue Beziehung offen.
- source_word: εἰς τόπον ἀκάθαρτον
  choice: an einen unreinen Ort
  rationale: ἀκάθαρτος gehört zur kultischen Reinheitssprache. „Unrein“ bewahrt diesen biblischen Sinn; „an“ ist bei der zielgerichteten Bewegung zu einem Ort natürliches Deutsch.
theological_decisions:
- issue: Kultische Reinheitssprache bei der Wiederherstellung des Tempels
  choice: Die Reinheitsbegriffe ausdrücklich mit „reinigten“, „Verunreinigung“ und „unrein“ wiedergeben.
  alternative: Allgemeine Ausdrücke wie „säuberten“, „Verschmutzung“ oder „schmutziger Ort“ verwenden.
  rationale: Der Vers beschreibt nicht nur eine materielle Säuberung, sondern die Wiederherstellung eines entweihten Heiligtums. Daher darf die kultische Bedeutung des griechischen Wortfeldes nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper narrativer Satzstruktur. Die Wiederholung des Wortstamms „rein“ entspricht dem griechischen Reinheitswortfeld und ist hier sachlich gewollt.
