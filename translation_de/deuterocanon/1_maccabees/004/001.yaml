base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/001.yaml
  text: And Gorgias took five thousand men and one thousand chosen horsemen[a], and the camp set out by night,
translation:
  language: de
  text: Und Gorgias nahm fünftausend Mann und tausend ausgewählte Reiter mit sich, und das Lager[a] brach bei Nacht auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Truppe. Das griechische Wort für „Lager“ kann auch kollektiv die dort lagernden Truppen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: nahm … mit sich
  rationale: Im militärischen Zusammenhang bezeichnet das Verb, dass Gorgias die genannten Männer und Reiter mitnahm beziehungsweise übernahm. „Nahm … mit sich“ gibt die Bewegung natürlich wieder, ohne ausdrücklich eine Kommandoübernahme zu behaupten.
- source_word: πεντακισχιλίους ἄνδρας
  choice: fünftausend Mann
  rationale: ἄνδρας bedeutet wörtlich „Männer“ und bezeichnet hier Männer im Kriegsdienst. Die feste deutsche Mengenangabe „fünftausend Mann“ ist zugleich quellennah und idiomatisch.
- source_word: χιλίαν ἵππον ἐκλεκτήν
  choice: tausend ausgewählte Reiter
  rationale: ἵππον steht kollektiv für Reiterei beziehungsweise Reiter; ἐκλεκτήν kennzeichnet sie als ausgewählt. „Ausgewählte Reiter“ bewahrt sowohl den personalen militärischen Sinn als auch die Qualitätsangabe.
- source_word: ἀπῆρεν
  choice: brach … auf
  rationale: Das Verb bedeutet „fortgehen“ oder „aufbrechen“. „Brach … auf“ passt zur erzählten Truppenbewegung, ohne die Art der Bewegung näher festzulegen.
- source_word: ἡ παρεμβολή
  choice: das Lager
  rationale: παρεμβολή bezeichnet zunächst das Lager und kann metonymisch die dort lagernde Truppe meinen. „Das Lager“ erhält das Bild des griechischen Textes; die mögliche kollektive Bedeutung wird in der Fußnote genannt.
- source_word: νυκτός
  choice: bei Nacht
  rationale: Der Genitiv wird temporal-adverbial gebraucht. „Bei Nacht“ ist eine natürliche, leicht gehobene Wiedergabe und fügt keine ausdrückliche Aussage über Heimlichkeit hinzu.
