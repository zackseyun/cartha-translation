base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/050.yaml
  text: And they burned incense on the altar[a], and they lit the lamps that were on the lampstand[b], and they shone in the temple.
translation:
  language: de
  text: Und sie verbrannten Räucherwerk auf dem Altar und zündeten die Lampen auf dem Leuchter an; sie leuchteten im Heiligtum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel“. Das griechische Wort bezeichnet hier wahrscheinlich genauer den eigentlichen Heiligtumsbereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθυμίασαν
  choice: sie verbrannten Räucherwerk
  rationale: θυμιάω bezeichnet das Verbrennen von Räucherwerk und bewahrt so die konkrete kultische Handlung.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: auf dem Altar
  rationale: ἐπί mit Akkusativ bezeichnet hier das Aufbringen des Räucherwerks auf den Altar; die deutsche Formulierung ist natürlich und sachlich.
- source_word: ἐξῆψαν
  choice: sie zündeten … an
  rationale: Das Verb bezeichnet das Entzünden; „anzünden“ ist im Zusammenhang mit Lampen modernes, klares Deutsch.
- source_word: τοὺς λύχνους
  choice: die Lampen
  rationale: λύχνος bezeichnet konkrete Lampen, nicht abstrakt das Licht.
- source_word: τῆς λυχνίας
  choice: dem Leuchter
  rationale: λυχνία ist der Träger der Lampen. „Leuchter“ ist im deutschen Tempelwortschatz transparent und idiomatisch.
- source_word: ἐφαίνοντο
  choice: sie leuchteten
  rationale: Die Imperfektform beschreibt das andauernde Leuchten der zuvor genannten Lampen; das Pronomen lässt diesen Bezug im Deutschen natürlich erkennen.
- source_word: ἐν τῷ ναῷ
  choice: im Heiligtum
  rationale: ναός bezeichnet hier im Zusammenhang der inneren Tempelausstattung genauer den eigentlichen Heiligtumsbereich als den gesamten Tempelkomplex.
theological_decisions:
- issue: Konkrete Kultsprache bei der Wiederherstellung des Tempeldienstes
  choice: Räucherwerk, Altar, Lampen, Leuchter und Heiligtum werden als konkrete kultische Gegenstände und Handlungen wiedergegeben.
  alternative: Die Vorgänge verallgemeinernd als Gottesdienst oder Opferhandlung beschreiben.
  rationale: Der griechische Text schildert bestimmte Handlungen und Ausstattungsstücke; eine verallgemeinernde Wiedergabe würde die erzählerische und kultische Genauigkeit abschwächen.
- issue: Bezugswort des abschließenden Verbs
  choice: „sie leuchteten“ bezieht sich grammatisch auf die Lampen.
  alternative: Unpersönlich „es wurde hell“ oder kausativ „sie erleuchteten das Heiligtum“.
  rationale: Das pluralische ἐφαίνοντο greift am natürlichsten τοὺς λύχνους auf und beschreibt ihr Leuchten, ohne eine stärkere kausative Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit konkreter Kultsprache. Das Semikolon verdeutlicht, dass das abschließende „sie“ auf die Lampen zurückweist.
