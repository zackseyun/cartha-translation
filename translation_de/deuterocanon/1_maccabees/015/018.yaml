translation:
  language: de
  text: Und sie brachten einen goldenen Schild im Wert von fünftausend Minen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen goldenen Schild von fünftausend Minen“. Die griechische Wendung lässt sich so wörtlicher wiedergeben, bezeichnet hier aber wahrscheinlich den Wert des Schildes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: sie brachten
  rationale: Der Aorist von φέρω bezeichnet hier schlicht das Herbeibringen des diplomatischen Geschenks; „brachten“ ist natürlich und vermeidet die stärkere Deutung „überreichten“.
- source_word: ἀσπίδα χρυσῆν
  choice: einen goldenen Schild
  rationale: ἀσπίς bedeutet gewöhnlich „Schild“; χρυσῆν beschreibt ihn als golden beziehungsweise aus Gold, ohne eine bestimmte Schildform vorauszusetzen.
- source_word: ἀπὸ μνῶν πεντακισχιλίων
  choice: im Wert von fünftausend Minen
  rationale: Die Verbindung von ἀπό mit der Geld- oder Gewichtssumme bezeichnet in diesem Geschenkkontext wahrscheinlich den Wert des Schildes. Die sinngemäße Wiedergabe ist im modernen Deutsch klarer als eine formale Nachbildung.
- source_word: μνῶν
  choice: Minen
  rationale: Die antike Gewichts- und Geldeinheit wird historisch genau beibehalten, statt durch einen ungenauen modernen Wert ersetzt zu werden.
theological_decisions: []
