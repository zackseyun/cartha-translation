base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/031.yaml
  text: But if not[a], give five hundred talents of silver in place of them, and another five hundred talents for the destruction that you have caused and for the taxes of the cities. But if not[b], they will come and make war against you.
translation:
  language: de
  text: Wenn aber nicht, gebt an ihrer Stelle fünfhundert Talente Silber und weitere fünfhundert Talente für die Verwüstung, die ihr angerichtet habt, und für die Abgaben der Städte.[b][a] Wenn aber nicht, werden sie kommen und Krieg gegen euch führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In der Wortstellung des Griechischen: „und für die Verwüstung, die ihr angerichtet habt, und für die Abgaben der Städte weitere fünfhundert Talente“. Der griechische Satz ist gedrängt formuliert; die Übersetzung versteht die zweite Summe als zusätzliche Zahlung für beides.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für den Tribut der Städte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: Wenn aber nicht
  rationale: Bewahrt bei beiden Vorkommen die nachdrückliche, wiederholte Ultimatumsform des Griechischen.
- source_word: δότε
  choice: gebt
  rationale: Entspricht dem allgemeinen Sinn des Imperativs und bleibt auch bei einer Geldforderung natürlich; „zahlt“ wäre kontextuell ebenfalls möglich, aber enger.
- source_word: ἀντʼ αὐτῶν
  choice: an ihrer Stelle
  rationale: Gibt den Gedanken des Ersatzes wieder, ohne den Bezug von „ihrer“ über den Kontext hinaus festzulegen.
- source_word: πεντακόσια τάλαντα ἀργυρίου
  choice: fünfhundert Talente Silber
  rationale: Behält die antike Gewichtungs- und Geldeinheit bei und formuliert den Betrag idiomatisch.
- source_word: τῆς καταφθορᾶς ἧς κατεφθάρατε
  choice: für die Verwüstung, die ihr angerichtet habt
  rationale: Vermeidet eine unnatürliche Wiedergabe des griechischen Wortspiels mit Substantiv und stammverwandtem Verb, wahrt aber Schwere und Verantwortungszuweisung.
- source_word: τῶν φόρων τῶν πόλεων
  choice: für die Abgaben der Städte
  rationale: „Abgaben“ lässt offen, ob φόροι hier Steuern oder politisch auferlegten Tribut bezeichnet.
- source_word: ἀλλὰ τάλαντα πεντακόσια
  choice: weitere fünfhundert Talente
  rationale: Versteht die gedrängte Formulierung als Forderung einer zusätzlichen zweiten Summe und gibt dies im Deutschen klar wieder.
- source_word: παραγενόμενοι
  choice: werden sie kommen
  rationale: Das vorangestellte Partizip wird als erste Handlung einer natürlichen deutschen Verbfolge wiedergegeben.
- source_word: ἐκπολεμήσουσιν ὑμᾶς
  choice: Krieg gegen euch führen
  rationale: Gibt die militärische Drohung würdig und präzise wieder.
