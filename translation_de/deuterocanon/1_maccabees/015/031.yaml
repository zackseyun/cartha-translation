translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Wenn aber nicht“ erhält den scharfen Ultimatumscharakter. „Abgaben“ wahrt die Bedeutungsbreite von φόροι; die ungewöhnliche griechische Wortstellung wird im Haupttext zugunsten klarer deutscher Syntax umgestellt und in einer Fußnote dokumentiert.
