base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/017.yaml
  text: The envoys of the Jews came to us as our friends and allies[a], renewing the friendship and alliance from the beginning, having been sent by Simon the high priest and by the people of the Jews[b];
translation:
  language: de
  text: Die Gesandten der Juden kamen zu uns als unsere Freunde und Verbündeten. Sie erneuerten die von Anfang an bestehende Freundschaft und das Bündnis und waren von Simon, dem Hohepriester, und vom Volk der Juden[a] gesandt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier auch die Bürgerschaft oder die Volksversammlung der Juden als politische Körperschaft bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβευταὶ
  choice: Gesandten
  rationale: Bezeichnet offizielle diplomatische Vertreter; »Gesandte« ist im modernen Deutschen natürlich und wahrt den amtlichen Charakter.
- source_word: φίλοι καὶ σύμμαχοι
  choice: Freunde und Verbündete
  rationale: Gibt sowohl die ausdrückliche Freundschaft als auch das politisch-militärische Bündnis direkt wieder.
- source_word: ἀνανεούμενοι
  choice: Sie erneuerten
  rationale: Das Partizip beschreibt den Zweck beziehungsweise den begleitenden Vorgang ihres Kommens; die Auflösung als Hauptsatz ist klar und natürlich.
- source_word: τὴν ἐξ ἀρχῆς φιλίαν καὶ συμμαχίαν
  choice: die von Anfang an bestehende Freundschaft und das Bündnis
  rationale: »Von Anfang an bestehend« bezieht ἐξ ἀρχῆς verständlich auf beide Beziehungen und vermeidet die missverständliche Vorstellung, sie würden erst jetzt beginnen.
- source_word: ἀπεσταλμένοι ἀπὸ
  choice: waren ... gesandt worden
  rationale: Bewahrt den passiven, vorzeitigen Sinn des Partizips und gibt ἀπό hier idiomatisch als handelnden Ausgangspunkt wieder.
- source_word: Σιμωνος τοῦ ἀρχιερέως
  choice: Simon, dem Hohepriester
  rationale: ἀρχιερεύς wird traditionsgemäß und sachlich zutreffend mit »Hohepriester« wiedergegeben.
- source_word: τοῦ δήμου τῶν Ἰουδαίων
  choice: vom Volk der Juden
  rationale: δῆμος kann das Volk als politische Körperschaft bezeichnen; die Übersetzung bleibt verständlich, während eine Fußnote die mögliche staatsbürgerliche Nuance festhält.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die diplomatische Sprache und die Beziehung der Partizipien bleiben erhalten.
