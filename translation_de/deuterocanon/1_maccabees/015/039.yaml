  yaml_path: translation/deuterocanon/1_maccabees/015/039.yaml
  text: And he commanded him to encamp opposite Judea[a]; and he commanded him to build Kedron and fortify the cities, and to fight against the people[b]. But the king was pursuing Tryphon.
translation:
  language: de
  text: Und er befahl ihm, gegenüber von Judäa[a] ein Lager aufzuschlagen. Er befahl ihm auch, Kedron zu erbauen[b], die Städte zu befestigen und gegen das Volk Krieg zu führen. Der König aber verfolgte Tryphon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor Judäa«. Die griechische Wendung bezeichnet eine räumliche Lage gegenüber oder vor Judäa.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Kedron aufzubauen« beziehungsweise »wieder aufzubauen«. Das griechische Verb sagt nicht ausdrücklich, ob der Ort neu errichtet oder wiederhergestellt werden sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: er befahl ihm
  rationale: Die Wendung gibt den verbindlichen militärischen Befehl natürlich und mit angemessener Autorität wieder.
- source_word: παρεμβάλλειν
  choice: ein Lager aufzuschlagen
  rationale: Im militärischen Zusammenhang bezeichnet das Verb das Beziehen oder Errichten eines Lagers; die deutsche Wendung ist klar und idiomatisch.
- source_word: κατὰ πρόσωπον τῆς Ἰουδαίας
  choice: gegenüber von Judäa
  rationale: Die räumliche Bedeutung ‚gegenüber/vor‘ bleibt erhalten, ohne bereits hier eine feindliche Stoßrichtung in die Präposition hineinzulesen.
- source_word: οἰκοδομῆσαι τὴν Κεδρὼν
  choice: Kedron zu erbauen
  rationale: οἰκοδομέω bezeichnet das Bauen oder Errichten. ‚Erbauen‘ lässt offen, ob die Anlage neu errichtet oder wiederhergestellt wurde.
- source_word: ὀχυρῶσαι τὰς πόλεις
  choice: die Städte zu befestigen
  rationale: Die Übersetzung trifft die militärische Bedeutung des Verstärkens und S Wehrhaftmachens von Orten präzise.
- source_word: ὅπως πολεμῇ τὸν λαόν
  choice: gegen das Volk Krieg zu führen
  rationale: Die Formulierung bringt den mit ὅπως ausgedrückten Zweck sowie die militärische Feindseligkeit von πολεμέω deutlich zum Ausdruck.
- source_word: ἐδίωκε
  choice: verfolgte
  rationale: Das deutsche Präteritum bezeichnet hier im Erzählzusammenhang die gleichzeitig fortdauernde Verfolgung; der Kontrast mit δέ bleibt durch ‚aber‘ erhalten.
- source_word: Τρύφωνα
  choice: Tryphon
  rationale: Der Personenname wird nach seiner griechischen Form transliteriert.
