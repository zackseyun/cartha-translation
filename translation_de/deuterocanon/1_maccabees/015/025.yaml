  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzfolge wurde für Klarheit gegliedert. Eigennamen folgen der im Deutschen üblichen Form; die Stadt wird feminin als »die Stadt« aufgenommen. Die Fußnoten bewahren die sprachliche Ungewöhnlichkeit und Unsicherheit der griechischen Wendungen.
