    text: Die Wendung kann formnäher auch anders verstanden werden, etwa als Hinweis auf einen zweiten Abschnitt oder Zeitpunkt; im militärischen Zusammenhang liegt »zum zweiten Mal« am nächsten.
    reason: alternative_reading
