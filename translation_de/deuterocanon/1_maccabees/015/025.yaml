  text: But King Antiochus encamped against Dora a second time[a], continually bringing his forces against it and constructing siege engines[b], and he shut Tryphon in so that he could neither go in nor go out.
translation:
  language: de
  text: König Antiochos aber schlug zum zweiten Mal[a] sein Lager vor Dora auf. Unablässig führte er seine Truppen gegen die Stadt und baute Belagerungsmaschinen[b]. So schloss er Tryphon ein, sodass dieser weder hinein- noch hinausgelangen konnte.
