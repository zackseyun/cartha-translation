lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Δωρὰ
  choice: schlug sein Lager vor Dora auf
  rationale: παρεμβάλλω bezeichnet im militärischen Zusammenhang das Aufschlagen eines Lagers; ἐπί zeigt hier die feindliche Ausrichtung gegen die belagerte Stadt an. »Vor Dora« klingt im Deutschen natürlich und vermittelt die Belagerungssituation.
- source_word: ἐν τῇ δευτέρᾳ
  choice: zum zweiten Mal
  rationale: Die elliptische Wendung wird im militärischen Erzählzusammenhang am plausibelsten als Wiederholung des Vorgehens verstanden. Die mögliche formnähere beziehungsweise abweichende Deutung bleibt in der Fußnote sichtbar.
- source_word: προσάγων διὰ παντὸς αὐτῇ τὰς χεῖρας
  choice: Unablässig führte er seine Truppen gegen die Stadt
  rationale: Wörtlich steht hier ein Heranführen der »Hände«. Im Belagerungskontext bezeichnet dies anhaltenden militärischen Einsatz oder Druck. »Truppen« gibt den idiomatischen Sinn verständlich wieder, während »unablässig« διὰ παντός abbildet.
- source_word: μηχανὰς ποιούμενος
  choice: ließ Belagerungsmaschinen bauen
  rationale: μηχαναί sind hier militärische Vorrichtungen für eine Belagerung. Die mediale Partizipform kann ein Veranlassen beziehungsweise Bereitstellen für den eigenen Einsatz ausdrücken; »ließ ... bauen« ist daher natürlich und kontextgerecht.
- source_word: συνέκλεισεν
  choice: schloss er Tryphon ein
  rationale: Das Verb bezeichnet das Umschließen oder Einschließen und passt zur vollständigen Blockade.
- source_word: τοῦ εἰσπορεύεσθαι καὶ ἐκπορεύεσθαι
  choice: sodass dieser weder hinein- noch hinausgelangen konnte
  rationale: Die artikulierten Infinitive bezeichnen hier die wirksame Verhinderung beider Bewegungsrichtungen. Die deutsche Fassung gibt den resultierenden vollständigen Einschluss idiomatisch wieder.
