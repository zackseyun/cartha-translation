  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Aussagen des Griechischen zuverlässig wieder: ᾔδει als „wusste“, die gegen ihn gerichteten κακά als „Unheil“ und αἱ δυνάμεις im militärischen Sinn als „Truppen“. Die Plusquamperfekta passen im Deutschen zur rückblickenden Perspektive nach „wusste“.'
  naturalness: „Sich zusammenballen“ ist bei dem abstrakten, kollektiven „Unheil“ zwar verständlich, aber weniger idiomatisch als „sich ansammeln“. „Sich angesammelt hatte“ ist modernes, natürliches Deutsch und wahrt den im Präfix ἐπισυν- liegenden Gedanken einer gebündelten Ansammlung.
  terminology: „Unheil“ ist als kollektive Wiedergabe des pluralischen κακά angemessen und vermeidet die falsche moralische Einengung von „Böses“. „Truppen“ trifft δυνάμεις im vorliegenden militärischen Kontext. Die Anmerkung zu den Truppen sollte keine zeitliche Angabe („bis dahin“) ergänzen, die im griechischen Text nicht steht.
