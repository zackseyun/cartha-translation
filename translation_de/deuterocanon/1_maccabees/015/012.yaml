  text: For he knew that troubles had gathered against him[b][a], and the forces had abandoned him.
translation:
  language: de
  text: Denn er wusste, dass sich Unheil gegen ihn angesammelt hatte[a] und die Truppen ihn verlassen hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass sich schlimme Ereignisse gegen ihn angesammelt hatten“. Das griechische Verb bezeichnet eine gebündelte Ansammlung gegen ihn.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „die Streitkräfte“. Gemeint sind wahrscheinlich bewaffnete Verbände, die ihn unterstützten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: er wusste
  rationale: Die Form von οἶδα bezeichnet hier einen in der Vergangenheit bestehenden Wissenszustand; das deutsche Präteritum gibt ihn natürlich und genau wieder.
- source_word: ἐπισυνῆκται
  choice: hatte sich zusammengeballt
  rationale: Das Perfekt von ἐπισυνάγω beschreibt einen bereits eingetretenen Zustand konzentrierter Ansammlung. „Sich zusammenballen“ bewahrt sowohl die Bündelung als auch den bedrohlichen Zusammenhang.
- source_word: ἐπʼ αὐτόν
  choice: gegen ihn
  rationale: Bei κακά und dem Verb des Ansammelns bezeichnet ἐπί mit Akkusativ hier die feindliche Ausrichtung.
- source_word: κακά
  choice: Unheil
  rationale: κακά meint in diesem Zusammenhang nicht moralisch Böses, sondern drohendes Unglück oder widrige Ereignisse. „Unheil“ ist weit genug und passt zum militärisch-politischen Kontext.
- source_word: ἀφῆκαν
  choice: hatten verlassen
  rationale: Der Aorist von ἀφίημι bedeutet hier, jemanden zurückzulassen beziehungsweise ihm die Unterstützung zu entziehen. Das Plusquamperfekt bildet die zeitliche Perspektive im Deutschen natürlich ab.
- source_word: αἱ δυνάμεις
  choice: die Truppen
  rationale: δυνάμεις ist in militärischen Erzählungen eine übliche Bezeichnung für bewaffnete Einheiten. „Truppen“ ist im modernen Deutsch klarer als das wörtlichere „Streitkräfte“; ein nicht ausdrücklich vorhandenes Possessivpronomen wird vermieden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zusammengeballt“ hält die im Griechischen ausgedrückte bedrohliche Konzentration fest; „Truppen“ wahrt den militärischen Sinn, ohne den im Ausgangstext nur implizierten Besitz durch „seine“ ausdrücklich zu machen.
