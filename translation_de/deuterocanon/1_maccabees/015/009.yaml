base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/009.yaml
  text: And when we establish our kingdom[a], we will honor you and your nation and the sanctuary with great glory[c][b], so that your glory may become evident in all the earth.
translation:
  language: de
  text: Sobald wir unser Königreich errichtet haben, werden wir dir und deinem Volk sowie dem Heiligtum[b] große Ehre erweisen[a], sodass euer Ansehen auf der ganzen Erde[c] sichtbar wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „verherrlichen … mit großer Herrlichkeit … eure Herrlichkeit“. Im Griechischen stehen durchgehend verwandte Formen von δόξα und δοξάζω; im politischen Zusammenhang ist damit öffentliche Ehre und hohes Ansehen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: „Das Heiligtum“ kann auch mit „der Tempel“ wiedergegeben werden; ἱερόν kann den heiligen Tempelbezirk bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: „Auf der ganzen Erde“ kann je nach geografischem Umfang auch „im ganzen Land“ oder „in der ganzen Welt“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστήσωμεν
  choice: gefestigt haben
  rationale: Das Verb bezeichnet hier die künftige Herstellung einer gesicherten, geordneten Königsherrschaft. „Gefestigt haben“ passt zum politischen Zusammenhang, ohne den Vorgang auf eine militärische Eroberung zu verengen.
- source_word: βασιλείαν
  choice: Königreich
  rationale: Im königlichen Schreiben bezeichnet βασιλεία die Herrschaft beziehungsweise das Reich des Sprechers. „Königreich“ gibt den institutionell-politischen Sinn natürlich wieder.
- source_word: δοξάσωμεν … δόξῃ μεγάλῃ
  choice: große Ehre erweisen
  rationale: Im diplomatischen Zusammenhang meint die Wendung die öffentliche Auszeichnung und Ehrung der Genannten. Die deutsche Formulierung ist natürlich und bewahrt den Gedanken der verliehenen Ehre, auch wenn sie das griechische Wortspiel nicht vollständig nachbildet.
- source_word: ἔθνος
  choice: Volk
  rationale: Gemeint ist das jüdische Volk als gemeinschaftliche und politische Größe. Im Deutschen ist „Volk“ hier natürlicher und weniger modern-staatsrechtlich festgelegt als „Nation“.
- source_word: ἱερόν
  choice: Heiligtum
  rationale: ἱερόν kann den Tempel oder den gesamten heiligen Tempelbezirk bezeichnen. „Heiligtum“ lässt diesen Umfang offen.
- source_word: φανερὰν γενέσθαι
  choice: sichtbar wird
  rationale: Die Ergebniswendung mit ὥστε beschreibt, dass das Ansehen öffentlich erkennbar werden soll. „Sichtbar wird“ ist klar und idiomatisch.
- source_word: τὴν δόξαν ὑμῶν
  choice: euer Ansehen
  rationale: Im politischen Kontext bezeichnet δόξα den öffentlich wahrnehmbaren Ruhm, Rang oder das Ansehen der Angeredeten. „Euer“ bewahrt den Plural des griechischen ὑμῶν.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: auf der ganzen Erde
  rationale: Die weitreichende königliche Aussage wird mit „auf der ganzen Erde“ wiedergegeben; γῆ kann je nach Kontext auch „Land“ oder „Welt“ bedeuten.
theological_decisions:
- issue: Wiedergabe der Wortgruppe δόξα/δοξάζω
  choice: Politisch-diplomatisch als „Ehre erweisen“ und „Ansehen“
  alternative: „verherrlichen“, „Herrlichkeit“ beziehungsweise „Ruhm“
  rationale: Der Kontext ist ein königliches Versprechen öffentlicher Auszeichnung, nicht ausdrücklich eine theologische Aussage. Die Alternative bleibt wegen der bewussten griechischen Wortwiederholung in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch im Register eines königlichen Schreibens. Die Satzstruktur bleibt eng am Griechischen, während „große Ehre erweisen“ und „Ansehen“ im Deutschen natürlicher klingen als eine durchgehend wörtliche Wiedergabe der δόξα-Wortgruppe.
