  text: And Cendebeus came to Jamnia[b][a], and began to provoke the people and to invade Judea and to take the people captive and to kill them.
translation:
  language: de
  text: Und Kendebaios kam nach Jamnia. Er begann, das Volk zu reizen, in Judäa einzufallen[a], das Volk gefangen zu nehmen und zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Judäa hineinzugehen“. Das griechische Verb kann wörtlicher wiedergegeben werden; der Zusammenhang weist jedoch auf einen feindlichen militärischen Einfall hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγενήθη
  choice: kam
  rationale: Der Aorist von παραγίνομαι bezeichnet hier das Eintreffen an einem Ort; „kam nach“ ist im Deutschen natürlich und erzählerisch passend.
- source_word: Κενδεβαῖος
  choice: Kendebäus
  rationale: Die eingedeutschte Form gibt den griechischen Personennamen in einer im deutschen Bibelgebrauch geläufigen Gestalt wieder.
- source_word: Ἰαμνείαν
  choice: Jamnia
  rationale: „Jamnia“ ist die gebräuchliche deutsche Form des Ortsnamens.
- source_word: ἤρξατο τοῦ ἐρεθίζειν
  choice: begann, das Volk zu reizen
  rationale: Die Konstruktion bezeichnet den Beginn einer Handlung. „reizen“ bewahrt die mögliche Bedeutung von provozieren oder feindselig bedrängen, ohne eine bestimmte Art der Aufwiegelung vorauszusetzen.
- source_word: τὸν λαόν
  choice: das Volk
  rationale: λαός bezeichnet kollektiv das Volk beziehungsweise die betroffene Bevölkerung; die schlichte Wiedergabe wahrt diese kollektive Bedeutung.
- source_word: ἐμβατεύειν εἰς τὴν Ἰουδαίαν
  choice: in Judäa einzufallen
  rationale: Das Verb kann wörtlicher ein Hineingehen bezeichnen; im Zusammenhang mit Gefangennahme und Tötung ist jedoch ein feindlicher militärischer Einfall gemeint.
- source_word: αἰχμαλωτίζειν
  choice: gefangen zu nehmen
  rationale: Das Verb bezeichnet insbesondere die Gefangennahme von Menschen im Krieg.
- source_word: φονεύειν
  choice: zu töten
  rationale: Die Wiedergabe ist direkt und vermeidet eine zusätzliche rechtliche oder moralische Nuance, die „ermorden“ eintragen könnte.
