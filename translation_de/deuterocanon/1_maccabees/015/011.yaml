lexical_decisions:
- source_word: ἐδίωξεν
  choice: verfolgte
  rationale: Das Verb bezeichnet hier eine aktive Verfolgung im militärisch-politischen Zusammenhang; „verfolgte“ gibt dies präzise und natürlich wieder.
- source_word: Ἀντίοχος ὁ βασιλεύς
  choice: König Antiochus
  rationale: Die im Deutschen übliche Stellung des Titels vor dem Namen entspricht dem Sinn der griechischen Wortgruppe.
- source_word: ἦλθεν εἰς Δῶρα
  choice: er kam … nach Dora
  rationale: ἔρχομαι bezeichnet hier die Bewegung zum Ortsziel; bei Städtenamen ist „nach Dora kommen“ idiomatisches Deutsch.
- source_word: φεύγων
  choice: auf seiner Flucht
  rationale: Die Wendung gibt das gleichzeitige, die Bewegung begleitende Partizip φεύγων natürlich wieder.
- source_word: τὴν ἐπὶ τὴν θάλασσαν
  choice: das am Meer liegt
  rationale: Die elliptische griechische Ortsangabe hebt Doras Lage am Meer hervor. Der Relativsatz macht diesen Bezug im Deutschen verständlich, ohne Dora als bloßes Durchgangsziel zur Küste misszuverstehen.
