base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/003.yaml
  text: Since certain pestilent men seized control of the kingdom of our fathers[a], and I want to reclaim the kingdom so that I may restore it as it was before, I have enlisted a multitude of forces and equipped warships[c][b];
translation:
  language: de
  text: Da einige niederträchtige Männer die Herrschaft über das Reich unserer Vorfahren an sich gerissen haben[a] und ich Anspruch auf das Reich erheben will, um es wiederherzustellen, wie es früher war, habe ich zahlreiche Truppen angeworben[b] und Kriegsschiffe ausgerüstet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich könnte es heißen: „Einige Seuchen haben sich des Reiches unserer Vorfahren bemächtigt.“ Das griechische Wort λοιμοί („Seuchen“, „Plagen“) wird hier bildlich und abwertend für verderbliche Menschen gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann besonders das Anwerben fremder oder besoldeter Truppen bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Kriegsschiffe vorbereitet“ beziehungsweise „Kriegsschiffe gebaut“; das griechische Verb kann sowohl das Herrichten und Ausrüsten als auch das Herstellen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Da
  rationale: Leitet den Grund für das angekündigte Vorgehen ein und klingt im Deutschen natürlich.
- source_word: τινες λοιμοὶ
  choice: einige niederträchtige Männer
  rationale: λοιμοί bezeichnet wörtlich Seuchen, wird hier aber als scharfes, abwertendes Bild für verderbliche Menschen gebraucht; die Fußnote bewahrt das Bild.
- source_word: κατεκράτησαν τῆς βασιλείας
  choice: die Herrschaft über das Reich ... an sich gerissen haben
  rationale: Gibt den gewaltsamen Erwerb der Kontrolle wieder und unterscheidet zugleich politische Herrschaft und Reich.
- source_word: τῶν πατέρων ἡμῶν
  choice: unserer Vorfahren
  rationale: Im dynastischen Zusammenhang bezeichnet πατέρες die Ahnen beziehungsweise Vorfahren; die moderne Formulierung ist klar und würdig.
- source_word: βούλομαι δὲ ἀντιποιήσασθαι τῆς βασιλείας
  choice: und ich das Reich zurückfordern will
  rationale: ἀντιποιεῖσθαι mit Genitiv bezeichnet das Erheben beziehungsweise Geltendmachen eines Anspruchs; „zurückfordern“ bewahrt im Zusammenhang des ererbten Reiches Anspruch und Rückgewinnung, ohne den Erfolg vorwegzunehmen.
- source_word: ὅπως ἀποκαταστήσω αὐτὴν ὡς ἦν τὸ πρότερον
  choice: um es wieder soherzustellen, wie es früher war
  rationale: Gibt Zweck und Wiederherstellung des früheren Zustands unmittelbar wieder.
- source_word: ἐξενολόγησα πλῆθος δυνάμεων
  choice: habe ich zahlreiche Truppen angeworben
  rationale: Das Verb bezeichnet militärische Anwerbung und kann besonders fremde oder besoldete Truppen meinen; πλῆθος δυνάμεων wird idiomatisch als große Truppenzahl wiedergegeben.
- source_word: κατεσκεύασα πλοῖα πολεμικά
  choice: Kriegsschiffe ausgerüstet
  rationale: κατασκευάζω kann vorbereiten, ausrüsten oder bauen bedeuten; „ausgerüstet“ passt zum militärischen Kontext, ohne den Bau der Schiffe zwingend zu behaupten.
