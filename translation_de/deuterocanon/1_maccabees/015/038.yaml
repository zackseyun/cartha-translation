  text: And the king appointed Cendebaeus commander of the coastal region, and gave him infantry and cavalry forces.
translation:
  language: de
  text: Und der König setzte Kendebäus zum Befehlshaber des Küstengebiets ein und gab ihm Fußtruppen und Reiterei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: setzte … ein
  rationale: Im administrativen Zusammenhang bezeichnet das Verb die Einsetzung in ein Amt. „setzte … ein“ ist natürliches, würdevolles Deutsch und gibt den amtlichen Vorgang wieder.
- source_word: Κενδεβαῖον
  choice: Kendebäus
  rationale: Die Namensform folgt einer im Deutschen verständlichen, griechenahen Umschrift.
- source_word: ἐπιστράτηγον
  choice: Oberbefehlshaber
  rationale: Der Ausdruck bezeichnet einen übergeordneten militärischen Amtsträger mit regionaler Zuständigkeit. „Oberbefehlshaber“ bewahrt den militärischen Rang, ohne das Amt als zivile Statthalterschaft festzulegen.
- source_word: τῆς παραλίας
  choice: über das Küstengebiet
  rationale: παραλία kann die Küste beziehungsweise den Küstenbezirk bezeichnen. Mit „über das Küstengebiet“ wird die territoriale Zuständigkeit des Amtes klar ausgedrückt.
- source_word: δυνάμεις πεζικὰς
  choice: Fußtruppen
  rationale: Die Wendung bezeichnet militärische Kräfte zu Fuß. „Fußtruppen“ ist präzise und bildet zusammen mit „Reiterei“ ein natürliches Begriffspaar.
- source_word: ἱππικὰς
  choice: Reiterei
  rationale: Das Adjektiv bezeichnet berittene Streitkräfte. „Reiterei“ ist eine klare und für den historischen Kontext passende deutsche Entsprechung.
- source_word: ἔδωκεν αὐτῷ
  choice: gab ihm
  rationale: Die schlichte Wiedergabe folgt eng dem griechischen Wortlaut; der militärische Gegenstand macht deutlich, dass ihm Truppen unterstellt beziehungsweise zur Verfügung gestellt wurden.
