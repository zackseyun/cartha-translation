base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/002.yaml
  text: 'And they contained this form: “King Antiochus to Simon the high priest and ethnarch[a], and to the nation of the Jews[b], greetings.”'
translation:
  language: de
  text: 'Und sie hatten folgenden Wortlaut: »König Antiochos an Simon, den Hohepriester und Ethnarchen[a], und an das Volk der Juden[b]: Grüße!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Ethnarch ist ein Herrscher oder politischer Führer eines Volkes beziehungsweise einer Volksgruppe.
    reason: historical_term
  - marker: b
    text: 'Oder: „das Volk der Judäer“. Das griechische Wort kann sowohl Juden als Volk als auch Judäer im geografischen Sinn bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν περιέχουσαι τὸν τρόπον τοῦτον
  choice: sie hatten folgenden Wortlaut
  rationale: Die Wendung gibt die fortlaufende Konstruktion des Griechischen natürlich und zugleich dokumentarisch genau wieder. Wörtlicheres „sie enthielten diese Form“ wäre im Deutschen steif; „sie lauteten folgendermaßen“ wäre ebenfalls möglich.
- source_word: ἱερεῖ μεγάλῳ
  choice: den Hohepriester
  rationale: „Hohepriester“ ist die etablierte deutsche Bezeichnung für dieses jüdische Amt.
- source_word: ἐθνάρχῃ
  choice: Ethnarchen
  rationale: Der spezifische hellenistische Herrschertitel bleibt erhalten, statt durch eine allgemeinere Bezeichnung wie „Volksführer“ eingeebnet zu werden.
- source_word: ἔθνει Ἰουδαίων
  choice: das Volk der Juden
  rationale: ἔθνος bezeichnet hier das Kollektiv als Volk. „Juden“ gibt den ethnisch-religiösen Bezug im Kontext am ehesten wieder, ohne die mögliche geografische Nuance zu verschweigen.
- source_word: χαίρειν
  choice: Grüße!
  rationale: In der Briefformel ist χαίρειν ein konventioneller Gruß. Die substantivische Wiedergabe bewahrt den förmlichen Aufbau der Anschrift.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαίων
  choice: Juden
  alternative: Judäer
  rationale: Der königliche Brief richtet sich an das gesamte ἔθνος und damit vorrangig an die kollektive Volksgruppe. Das griechische Wort kann jedoch auch geografisch „Judäer“ bedeuten; diese echte Mehrdeutigkeit wird in der Fußnote bewahrt.
- issue: Wiedergabe des politischen Titels ἐθνάρχης
  choice: Ethnarch
  alternative: Herrscher des Volkes
  rationale: Die Transliteration erhält den historisch bestimmten Amtstitel und vermeidet eine interpretierende Festlegung seiner genauen Befugnisse.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit förmlichem Urkundenklang. Die einleitende Wendung ist idiomatisch, während Anrede und Grußformel die Struktur des griechischen Briefpräskripts sichtbar halten.
