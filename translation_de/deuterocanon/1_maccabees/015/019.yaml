base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/019.yaml
  text: It therefore seemed good to us to write to the kings and the countries[a], that they should not seek harm against them, and should not make war against them and their cities and their countries[b], and that they should not join in alliance with those who are making war against them.
translation:
  language: de
  text: Darum hielten wir es für gut, den Königen und den Ländern[a] zu schreiben, dass sie nicht darauf aus sein sollen, ihnen zu schaden, und weder gegen sie noch gegen ihre Städte[b] und ihre Gebiete Krieg führen noch sich mit denen verbünden sollen, die gegen sie Krieg führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort χώρα bezeichnet hier die Empfänger des Schreibens und später die Gebiete der Juden. Je nach Zusammenhang sind auch „Länder“, „Gebiete“ oder „Territorien“ möglich.
    reason: lexical_alternative
  - marker: b
    text: Im gedruckten Swete-Text steht vor „Städte“ ein einzelnes „A“, offenbar aufgrund eines Editions- oder Übertragungsfehlers. Der Zusammenhang verlangt „ihre Städte“.
    reason: textual_variant
lexical_decisions:
- source_word: ἤρεσεν οὖν ἡμῖν
  choice: Darum hielten wir es für gut
  rationale: Bewahrt die förmliche Beratungs- und Beschlussformel, ohne sie auf das knappere „wir beschlossen“ zu verengen.
- source_word: γράψαι τοῖς βασιλεῦσιν καὶ ταῖς χώραις
  choice: den Königen und den Ländern zu schreiben
  rationale: „Schreiben“ entspricht unmittelbar γράψαι; „Länder“ gibt χώρα als politisch-geografische Einheit und als Empfängerin des Schreibens verständlich wieder.
- source_word: μὴ ἐκζητήσωσιν αὐτοῖς κακά
  choice: dass sie nicht darauf aus sein sollen, ihnen zu schaden
  rationale: Gibt das aktive Aussein auf Böses idiomatisch wieder, ohne die stärker spezifizierende Bedeutung „gegen sie planen“ einzutragen.
- source_word: μὴ πολεμήσωσιν αὐτοὺς καὶ τὰς πόλεις αὐτῶν καὶ τὰς χώρας αὐτῶν
  choice: weder gegen sie noch gegen ihre Städte und ihre Gebiete Krieg führen
  rationale: Die deutsche Korrelativkonstruktion macht deutlich, dass Personen, Städte und Gebiete gemeinsam Gegenstand kriegerischer Handlungen sind. Beim zweiten χώρα ist „Gebiete“ im Besitz- und Herrschaftszusammenhang natürlicher als „Länder“.
- source_word: ἵνα μὴ συμμαχώσιν
  choice: noch sich mit denen verbünden sollen
  rationale: συμμαχέω bezeichnet das Handeln als Bundesgenosse; „sich verbünden“ wahrt den politischen und militärischen Sinn in natürlichem Deutsch.
- source_word: τοῖς πολεμοῦσιν αὐτούς
  choice: die gegen sie Krieg führen
  rationale: Das präsentische Partizip bezeichnet die tatsächlich oder fortdauernd Kriegführenden; die Formulierung bewahrt diesen aktiven Sinn.
theological_decisions: []
translation_notes:
  register: Förmlicher, aber heutiger Verwaltungs- und Diplomatiestil. Die Satzstruktur bleibt übersichtlich, während die dreifache Untersagung des griechischen Textes und die Wiederholung von „Krieg führen“ erhalten bleiben.
