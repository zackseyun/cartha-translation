  text: ἤρεσεν οὖν ἡμῖν γράψαι τοῖς βασιλεῦσιν καὶ ταῖς χώραις, ὅπως μὴ ἐκζητήσωσιν αὐτοῖς κακά, καὶ μὴ πολεμήσωσιν αὐτοὺς καὶ τὰς Α πόλεις αὐτῶν καὶ τὰς χώρας αὐτῶν, καὶ ἵνα μὴ συμμαχώσιν τοῖς πολεμοῦσιν αὐτούς.
