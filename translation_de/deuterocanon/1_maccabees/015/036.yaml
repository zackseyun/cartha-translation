  text: But he turned back to the king in anger[a], and reported to him these words and the splendor of Simon and everything that he had seen; and the king became very angry.
translation:
  language: de
  text: Doch er kehrte voller Zorn zum König zurück und berichtete ihm diese Worte, die Pracht Simons[a] und alles, was er gesehen hatte; und der König geriet in großen Zorn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Herrlichkeit Simons« beziehungsweise »das Ansehen Simons«. Das griechische Wort δόξα kann Ehre, Herrlichkeit oder sichtbare Pracht bezeichnen; hier ist wahrscheinlich der beeindruckende äußere Glanz um Simon gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: kehrte … zurück
  rationale: Das Verb bezeichnet hier die Rückkehr zum König; die deutsche Wendung gibt die Bewegungsrichtung natürlich wieder.
- source_word: μετὰ θυμοῦ
  choice: voller Zorn
  rationale: Die Wendung beschreibt die Gemütslage bei der Rückkehr und bewahrt die starke emotionale Färbung.
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: Das Verb bezeichnet das Überbringen beziehungsweise Weitergeben einer Nachricht an den König.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Die konkrete Formulierung bewahrt den unmittelbaren Bezug auf das zuvor Gesagte.
- source_word: τὴν δόξαν Σίμωνος
  choice: die Pracht Simons
  rationale: δόξα kann Ehre, Herrlichkeit oder sichtbare Pracht bezeichnen; im erzählerischen Zusammenhang liegt Simons beeindruckendes Auftreten beziehungsweise seine äußere Machtentfaltung nahe.
- source_word: πάντα ὅσα εἶδεν
  choice: alles, was er gesehen hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass das Sehen dem Bericht vorausging.
- source_word: ὠργίσθη ὁ βασιλεὺς ὀργὴν μεγάλην
  choice: Da geriet der König in großen Zorn
  rationale: Diese Wiedergabe lässt die griechische Verstärkung durch Verb und stammverwandtes Substantiv anklingen, ohne unnatürlich zu wirken.
