  yaml_path: translation/deuterocanon/1_maccabees/015/026.yaml
  text: And Simon sent him two thousand chosen men to fight alongside him[b][a], and silver and gold and sufficient equipment.
translation:
  language: de
  text: Und Simon sandte ihm zweitausend ausgewählte Männer, um an seiner Seite zu kämpfen[a], dazu Silber und Gold und genügend Ausrüstung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um ihm als Verbündete beizustehen« beziehungsweise »um ihm beizustehen«. Das griechische Verb kann allgemein verbündete Unterstützung bezeichnen; der Zusammenhang legt hier militärische Hilfe nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »genügend Vorräte«. Das griechische Wort ist weit gefasst und kann je nach Zusammenhang Ausrüstung, Gerät oder Vorräte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Die übliche und dem gehobenen Erzählstil angemessene Wiedergabe des Verbs für »senden«.
- source_word: διαχιλίους ἄνδρας
  choice: zweitausend Männer
  rationale: Gibt Zahlwort und Substantiv unmittelbar wieder; »Soldaten« wäre im Zusammenhang naheliegend, steht aber nicht ausdrücklich im Griechischen.
- source_word: ἐκλεκτούς
  choice: ausgewählte
  rationale: Bezeichnet eigens ausgewählte Männer, ohne darüber hinaus einen formalen Elitestatus vorauszusetzen.
- source_word: συμμαχῆσαι αὐτῷ
  choice: um an seiner Seite zu kämpfen
  rationale: Das Verb bezeichnet verbündete Unterstützung und hat hier einen klar militärischen Zusammenhang; die Formulierung gibt diese praktische Bedeutung natürlich wieder, ohne die allgemeinere Bedeutung zu verschweigen.
- source_word: ἀργύριον
  choice: Silber
  rationale: Bewahrt die konkrete Grundbedeutung; die Verbindung mit Gold spricht hier gegen die verengende Wiedergabe »Geld«.
- source_word: χρυσίον
  choice: Gold
  rationale: Direkte und natürliche Entsprechung.
- source_word: σκεύη ἱκανά
  choice: genügend Ausrüstung
  rationale: σκεύη ist ein weiter Begriff für Geräte, Ausrüstung oder Bedarf; im militärischen Zusammenhang passt »Ausrüstung«, während ἱκανά die ausreichende Menge bezeichnet.
