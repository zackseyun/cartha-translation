  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. »Männer« bewahrt die Ausdrucksweise der Quelle; »dazu« verbindet die weiteren Unterstützungsleistungen natürlich mit dem vorangehenden Satzteil.
