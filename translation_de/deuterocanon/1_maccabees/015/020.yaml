  text: And it seemed good to us to receive the shield from them[a].
translation:
  language: de
  text: Und wir hielten es für gut, den Schild von ihnen anzunehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Schild von ihnen entgegenzunehmen«. In diesem diplomatischen Zusammenhang kann mit dem Schild ein Ehrengeschenk gemeint sein, das traditionell als goldener Schild verstanden wird; im griechischen Text steht jedoch nur »Schild«.'
    reason: Bewahrt die Bedeutungsbreite von δέξασθαι und erläutert die mögliche historische Bedeutung von ἀσπίς, ohne »golden« in den Haupttext einzutragen.
lexical_decisions:
- source_word: ἔδοξεν δὲ ἡμῖν
  choice: Und wir hielten es für gut
  rationale: Die unpersönliche Wendung mit dem Dativ bezeichnet, was der sprechenden Gruppe gut oder angemessen erschien. Die deutsche Formulierung bewahrt den förmlichen diplomatischen Ton, ohne sie stärker als ausdrücklichen Beschluss wiederzugeben.
- source_word: δέξασθαι
  choice: anzunehmen
  rationale: δέχομαι kann sowohl »empfangen« als auch »annehmen« bedeuten. Bei einem diplomatischen Geschenk klingt »annehmen« im Deutschen natürlich und schließt dessen bewusste Annahme ein.
- source_word: τὴν ἀσπίδα
  choice: den Schild
  rationale: ἀσπίς bezeichnet einen Schild. Obwohl hier wahrscheinlich ein Ehrengeschenk, traditionell ein goldener Schild, gemeint ist, nennt der griechische Vers weder Material noch Funktion ausdrücklich.
- source_word: παρʼ αὐτῶν
  choice: von ihnen
  rationale: παρά mit Genitiv bezeichnet die Herkunft oder Quelle; »von ihnen« gibt dies knapp und eindeutig wieder.
