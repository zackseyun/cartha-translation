  text: Now therefore I confirm for you all the remissions that the kings before me granted you[b][a], and whatever other remissions they granted you.
translation:
  language: de
  text: Daher bestätige ich dir nun alle Nachlässe[a], die dir die Könige vor mir gewährten, sowie alle sonstigen Nachlässe, die er dir gewährte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Nachlässen“ sind königliche Erleichterungen bei Abgaben oder anderen geschuldeten Leistungen gemeint; das Wort muss keine vollständige Befreiung von allen Verpflichtungen bezeichnen.
    reason: cultural_note
  - marker: b
    text: Im griechischen Text steht am Ende ein Verb im Singular („er gewährte“), obwohl zuvor von den „Königen vor mir“ im Plural die Rede ist. Die Übersetzung bewahrt diese auffällige überlieferte Formulierung; sinngemäß wäre auch „die sie dir gewährten“ möglich.
    reason: textual_variant
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun … daher
  rationale: Gibt sowohl den zeitlichen Übergang als auch die folgernde Kraft der beiden Partikeln in natürlichem, gehobenem Deutsch wieder.
- source_word: ἵστημί
  choice: bestätige
  rationale: Im Zusammenhang eines königlichen Erlasses bezeichnet das Verb das rechtswirksame Aufrechterhalten oder Bekräftigen früherer Zugeständnisse, nicht ein körperliches Hinstellen.
- source_word: σοι
  choice: dir
  rationale: Bewahrt den Dativ des Begünstigten knapp und idiomatisch.
- source_word: πάντα τὰ ἀφαιρέματα
  choice: alle Nachlässe
  rationale: „Nachlässe“ deckt Erlass, Minderung oder Abzug von Abgaben ab, ohne eine vollständige Befreiung von sämtlichen Pflichten vorauszusetzen.
- source_word: ἃ ἀφῆκάν σοι
  choice: die dir … gewährten
  rationale: Im administrativen Zusammenhang meint ἀφίημι die Gewährung beziehungsweise Einräumung der genannten Nachlässe; „gewährten“ vermeidet eine schwerfällige Wiederholung von „erließen“.
- source_word: οἱ πρὸ ἐμοῦ βασιλεῖς
  choice: die Könige vor mir
  rationale: Direkte und natürliche Wiedergabe der zeitlichen Wendung im Zusammenhang königlicher Nachfolge.
- source_word: καὶ ὅσα ἄλλα ἀφαιρέματα
  choice: sowie alle weiteren Nachlässe
  rationale: Gibt den offenen Umfang zusätzlicher, nicht einzeln genannter Vergünstigungen flüssig wieder.
- source_word: ἀφῆκέν σοι
  choice: die er dir gewährte
  rationale: Bewahrt bewusst die auffällige Singularform des überlieferten griechischen Textes, statt sie stillschweigend an den vorhergehenden Plural „Könige“ anzugleichen.
