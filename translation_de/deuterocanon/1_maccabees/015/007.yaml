  yaml_path: translation/deuterocanon/1_maccabees/015/007.yaml
  text: But Jerusalem and the holy places are to be free; and all the weapons that you have made[a], and the strongholds that you have built, which you hold, shall remain yours.
translation:
  language: de
  text: Jerusalem aber und die heiligen Stätten[a] sollen frei sein. Und alle Waffen, die du angefertigt hast, sowie die Befestigungen, die du gebaut hast und in deiner Gewalt hast, sollen dir bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Heiligtum“ oder „die heiligen Dinge“. Der griechische Plural τὰ ἅγια kann heilige Bezirke, das Heiligtum oder heilige Gegenstände bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: τὰ ἅγια
  choice: die heiligen Stätten
  rationale: Der substantivierte sächliche Plural kann heilige Bezirke, das Heiligtum oder heilige Dinge bezeichnen. Im Zusammenhang mit Jerusalem und politischen Besitzrechten passt die räumliche Wiedergabe, ohne den Ausdruck auf ein einzelnes Gebäude zu verengen.
- source_word: ἐλεύθερα
  choice: frei
  rationale: Gibt die zugesicherte Freiheit von Eingriffen oder Verpflichtungen unmittelbar wieder und bewahrt die Breite des griechischen Ausdrucks.
- source_word: ὅπλα
  choice: Waffen
  rationale: Natürliche moderne Bezeichnung für militärische Ausrüstung in diesem Kontext.
- source_word: κατεσκεύασας
  choice: angefertigt hast
  rationale: Das Verb kann ‚herstellen‘ oder ‚vorbereiten‘ bedeuten; bei Waffen ist ‚angefertigt‘ präzise und natürlich.
- source_word: ὀχυρώματα
  choice: Befestigungen
  rationale: Bezeichnet befestigte Anlagen; ‚Befestigungen‘ ist breit genug für Festungen und andere militärisch gesicherte Orte.
- source_word: ᾠκοδόμησας
  choice: gebaut hast
  rationale: Direkte und idiomatische Wiedergabe des Bauens befestigter Anlagen.
- source_word: ὧν κρατεῖς
  choice: die du … in deiner Gewalt hast
  rationale: κρατέω bezeichnet hier tatsächliche Herrschaft oder Kontrolle; die Formulierung macht den Bezug auf die Befestigungen im Deutschen deutlich.
- source_word: μενέτω σοι
  choice: sollen dir bleiben
  rationale: Der Imperativ der dritten Person hat hier den Ton einer rechtlichen Zusicherung. Der Singular im Griechischen fasst die vorausgehenden sächlichen Plurale kollektiv zusammen; im Deutschen ist der Plural idiomatisch.
