base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/033.yaml
  text: And Simon answered and said to him[a], “We have neither taken foreign land nor seized what belongs to others, but only the inheritance of our fathers[b], which at one time was unjustly taken over by our enemies.”
translation:
  language: de
  text: 'Simon antwortete ihm: „Wir haben weder fremdes Land[a] an uns genommen noch uns fremden Besitz angeeignet, sondern das Erbe unserer Väter, das einst von unseren Feinden zu Unrecht[b] in Besitz genommen wurde.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Land, das anderen gehört“. „Fremd“ meint hier nicht zwingend „ausländisch“, sondern kann den Besitz anderer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ohne rechtmäßiges Urteil“ beziehungsweise „willkürlich“. Das griechische Wort kann neben allgemeinem Unrecht besonders das Fehlen eines ordentlichen Urteils oder Verfahrens betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν ἀλλοτρίαν
  choice: fremdes Land
  rationale: Die Wendung bezeichnet Land, das anderen gehört. „Fremdes Land“ ist knapp und wahrt die Wiederholung des Fremdheitsmotivs, kann im Deutschen jedoch auch als ausländisches Gebiet verstanden werden; deshalb wird die genauere Nuance in einer Fußnote genannt.
- source_word: εἴλημμεν
  choice: an uns genommen
  rationale: Das Perfekt von λαμβάνω bezeichnet hier eine vollzogene Aneignung mit fortbestehendem Besitz; „an uns genommen“ passt zur bestrittenen unrechtmäßigen Landnahme.
- source_word: ἀλλοτρίων
  choice: fremden Besitz
  rationale: Der substantivierte Genitiv Plural meint das, was anderen gehört. „Fremden Besitz“ macht die Ellipse im Deutschen verständlich, ohne den Bezug unnötig auf Land zu verengen.
- source_word: κεκρατήκαμεν
  choice: uns … angeeignet
  rationale: κρατέω kann ergreifen, festhalten oder beherrschen bedeuten. Im Zusammenhang einer bestrittenen territorialen Aneignung gibt „sich aneignen“ die resultative Bedeutung des Perfekts natürlich wieder.
- source_word: κληρονομίας τῶν πατέρων ἡμῶν
  choice: das Erbe unserer Väter
  rationale: Die Formulierung bewahrt sowohl den konkreten Erbbesitz als auch den ausdrücklichen Bezug auf die Väter, ohne eine weitergehende theologische Begründung hinzuzufügen.
- source_word: ἀκρίτως
  choice: zu Unrecht
  rationale: Das Adverb kann „ohne Urteil“, „ohne gehörige Prüfung“ oder allgemein „ungerecht“ bedeuten. „Zu Unrecht“ ist im Deutschen idiomatisch und lässt sowohl rechtliche als auch moralische Unrechtmäßigkeit anklingen.
- source_word: ἐν τινι καιρῷ
  choice: einst
  rationale: Die Wendung verweist unbestimmt auf einen früheren Zeitpunkt. „Einst“ ist natürlich und vermeidet die nicht zwingend vorliegende Deutung als Zeitdauer.
- source_word: κατεκρατήθη
  choice: in Besitz genommen wurde
  rationale: Das Passiv von κατακρατέω bezeichnet hier die gewaltsame Erlangung oder Beherrschung des Erbes. „In Besitz genommen“ passt zum territorialen Zusammenhang und spiegelt den Gegensatz zu Simons eigener bestrittenen Aneignung.
theological_decisions:
- issue: Anspruch auf das väterliche Erbe
  choice: sondern das Erbe unserer Väter
  alternative: sondern unser angestammtes Erbe
  rationale: Die Übersetzung erhält den konkreten familiären Erbanspruch des griechischen Textes, ohne ihn durch zusätzliche bundes- oder nationaltheologische Aussagen zu erweitern.
- issue: Wiedergabe von πατέρων
  choice: unserer Väter
  alternative: unserer Vorfahren
  rationale: „Väter“ entspricht der ausdrücklich maskulinen Bezeichnung und bewahrt die traditionelle Abstammungsformel; der Kontext verlangt keine Neutralisierung.
- issue: Rechtliche oder allgemein moralische Nuance von ἀκρίτως
  choice: zu Unrecht
  alternative: ohne rechtmäßiges Urteil
  rationale: Der griechische Ausdruck lässt offen, ob besonders ein fehlendes ordentliches Urteil oder allgemeine Ungerechtigkeit betont wird. Der Haupttext entscheidet diese Spannung nicht enger als nötig; die Fußnote nennt die rechtliche Möglichkeit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die einleitende griechische Doppelwendung „antwortete und sagte“ wird idiomatisch als „antwortete ihm“ wiedergegeben. Die beiden Verben der Aneignung werden im Deutschen unterschieden, während der parallele Gedankengang erhalten bleibt.
