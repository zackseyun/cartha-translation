  text: Tryphon aber ging an Bord eines Schiffes und floh nach Orthosia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τρύφων
  choice: Tryphon
  rationale: Der Personenname wird nach gängiger deutscher Konvention transliteriert.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten erzählerischen Übergang mit kontrastierendem Unterton; „aber“ gibt diese Wendung natürlich wieder.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: ging an Bord eines Schiffes
  rationale: Das Aoristpartizip von ἐμβαίνω bezeichnet zusammen mit εἰς πλοῖον das Besteigen eines Schiffes. Die finite Beiordnung mit „und“ ist im modernen Deutsch natürlich und wahrt die zeitliche Abfolge.
- source_word: ἔφυγεν
  choice: floh
  rationale: φεύγω bezeichnet hier die Flucht beziehungsweise den eiligen Rückzug; „floh“ erhält diese Bedeutung prägnant.
- source_word: εἰς Ὀρθωσίαν
  choice: nach Orthosia
  rationale: Bei einer Bewegung zu einer Stadt wird εἰς im Deutschen idiomatisch mit „nach“ wiedergegeben; der Ortsname wird als „Orthosia“ transliteriert.
