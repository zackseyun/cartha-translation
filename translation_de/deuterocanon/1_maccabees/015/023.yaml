base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/023.yaml
  text: and to all the regions[a], and to Sampsame, and to the Spartans[b], and to Delos and to Myndus and to Sicyon and to Caria and to Samos and to Pamphylia and Lycia and to Halicarnassus and to Cos and to Side and to Aradus and to Rhodes and to Phaselis and Gortyna and Cnidus and Cyprus and Cyrene.
translation:
  language: de
  text: und an alle Gebiete und an Sampsame[a] und an die Spartaner und an Delos und an Myndos und an Sikyon und an Karien und an Samos und an Pamphylien und Lykien und an Halikarnassos und an Kos[b] und an Side und an Arados und an Rhodos und an Phaselis und Gortyna und Knidos und Zypern und Kyrene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Identifizierung und die deutsche Namensform von Sampsame sind unsicher; die Wiedergabe folgt der griechischen Form eng.
    reason: cultural_note
  - marker: b
    text: Manche Ortsnamen werden auch in latinisierten Schreibungen wiedergegeben, zum Beispiel Cos statt Kos und Cnidus statt Knidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς χώρας
  choice: alle Gebiete
  rationale: χώρα kann Gebiet, Land oder Region bezeichnen. „Gebiete“ ist in einer Liste politischer und geografischer Empfänger weit genug und vermeidet den modernen Beiklang von Nationalstaaten.
- source_word: Σαμψάμῃ
  choice: Sampsame
  rationale: Der Dativ bezeichnet einen Ortsnamen. Die Wiedergabe folgt der griechischen Form eng, da die Identifizierung und eine feste deutsche Namensform unsicher sind.
- source_word: Σπαρτιάταις
  choice: die Spartaner
  rationale: Der ethnische Plural bezeichnet die Menschen von Sparta, nicht nur den Ort.
- source_word: καὶ εἰς …
  choice: und an …
  rationale: εἰς bezeichnet hier idiomatisch die Adressaten beziehungsweise Zielorte eines Schreibens. Das wiederholte „und an“ bewahrt den aufzählenden Stil des Griechischen.
- source_word: τὴν Καρίδα
  choice: Karien
  rationale: Im geografischen Zusammenhang ist die kleinasiatische Landschaft Karien gemeint; die etablierte deutsche Form ist „Karien“.
- source_word: τὴν Παμφυλίαν καὶ Λυκίαν
  choice: Pamphylien und Lykien
  rationale: Beide Namen bezeichnen Landschaften; verwendet werden die geläufigen deutschen Formen.
- source_word: Κῶ
  choice: Kos
  rationale: „Kos“ ist die etablierte deutsche Schreibung der griechischen Insel Κῶς.
- source_word: Ἄραδον
  choice: Arados
  rationale: Die Form gibt den griechischen Stadtnamen Ἄραδος nach deutscher Transliterationsweise wieder.
- source_word: τὴν Φασηλίδα
  choice: Phaselis
  rationale: Der griechische Akkusativ gehört zum Ortsnamen Phaselis, der im Deutschen in dieser Form gebräuchlich ist.
- source_word: Κνίδον
  choice: Knidos
  rationale: „Knidos“ ist eine direkte und im Deutschen geläufige Umschrift des griechischen Stadtnamens.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Standardwortschatz. Die häufige Verbindung mit „und an“ wurde bewusst beibehalten, um den administrativen Listencharakter und die polysyndetische Struktur des griechischen Textes erkennen zu lassen; wo εἰς mehrere Namen gemeinsam regiert, bleibt dies auch im Deutschen sichtbar.
