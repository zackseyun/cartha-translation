  source_fidelity: Die Übersetzung bildet die griechische Adressatenliste vollständig und in der richtigen Reihenfolge ab. Die wiederholte Wiedergabe von εἰς mit „an“ ist im Kontext eines Schreibens angemessen; bei den gemeinsam regierten Namen bleibt sie entsprechend aus. „die Spartaner“ gibt den ethnischen Plural Σπαρτιάταις zutreffend wieder.
