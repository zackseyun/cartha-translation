  text: And he fortified Kedron and stationed there cavalry and forces[a], so that by going out they might patrol the roads of Judea[c][b], just as the king had ordered him.
translation:
  language: de
  text: Und er befestigte Kedron[a] und stationierte dort Reiter[b] und Truppen, damit sie ausrücken und die Straßen Judäas überwachen[c] konnten, wie der König es ihm befohlen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „baute Kedron aus“. Das griechische Verb bedeutet wörtlich „baute“ oder „baute auf“; der militärische Zusammenhang legt eine Befestigung nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kavallerie“.'
    reason: lexical_alternative
  - marker: c
    text: Das mit „überwachen“ wiedergegebene Verb kann auch das Ziehen auf oder entlang der Straßen im Sinn militärischer Kontrolle bezeichnen; der Zusammenhang kann dabei auch Streifzüge einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: befestigte
  rationale: Das Verb bedeutet wörtlich „baute (auf)“. Der militärische Zusammenhang und die anschließende Stationierung von Truppen legen hier den Sinn „befestigte“ nahe; die wörtlichere Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: τὴν Κεδρὼν
  choice: Kedron
  rationale: Der Ortsname wird entsprechend der griechischen Form Κεδρών als „Kedron“ wiedergegeben.
- source_word: ἔταξεν
  choice: stationierte
  rationale: Bei Reitern und Truppen bezeichnet das Verb ihre militärische Zuweisung zu einem Standort.
- source_word: ἵππεις
  choice: Reiter
  rationale: Der Plural bezeichnet berittene Soldaten. „Reiter“ ist im Deutschen anschaulich und wahrt gegenüber „Kavallerie“ die personale Form des griechischen Substantivs.
- source_word: δυνάμεις
  choice: Truppen
  rationale: Im militärischen Zusammenhang bezeichnet δυνάμεις Streitkräfte, ohne eine bestimmte Truppengattung festzulegen.
- source_word: ὅπως
  choice: Sie sollten
  rationale: Die selbstständige deutsche Zweckkonstruktion gibt den durch ὅπως eingeleiteten Zweck natürlich und klar wieder.
- source_word: ἐκπορευόμενοι
  choice: von dort ausziehen
  rationale: Das Partizip beschreibt das Herausziehen vom befestigten Standort als Begleitumstand der folgenden militärischen Tätigkeit.
- source_word: ἐξοδεύωσιν
  choice: die Straßen … überwachen
  rationale: Das seltene Verb bezeichnet hier offenbar militärische Bewegung auf beziehungsweise entlang den Straßen. „Überwachen“ passt zum strategischen Zusammenhang, ohne mögliche Nuancen von Kontrolle, Streifzügen oder Überfällen endgültig festzulegen; diese werden in der Fußnote genannt.
- source_word: τὰς ὁδοὺς τῆς Ἰουδαίας
  choice: die Straßen Judäas
  rationale: Die Formulierung bildet den geographischen Genitiv knapp und natürlich ab.
- source_word: καθὰ συνετέταξεν αὐτῷ ὁ βασιλεύς
  choice: wie der König es ihm befohlen hatte
  rationale: Das Verb bezeichnet eine verbindliche Anordnung; das Plusquamperfekt verdeutlicht im Deutschen, dass der Befehl vorausging.
