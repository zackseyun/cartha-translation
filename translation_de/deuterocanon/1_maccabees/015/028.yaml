translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede behält durch „in eurer Gewalt“ ihren politischen und anklagenden Nachdruck. Die mögliche Amtsbezeichnung „Freunde“ wird nicht typografisch festgelegt, damit die im Griechischen bestehende Mehrdeutigkeit zwischen persönlicher Beziehung und Hoftitel erhalten bleibt.
