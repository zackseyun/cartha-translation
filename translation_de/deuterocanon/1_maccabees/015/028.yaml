base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/028.yaml
  text: And he sent to him Athenobius[a], one of his Friends, to confer with him, saying, “You are holding Joppa and Gazara and the citadel in Jerusalem[b], cities of my kingdom.”
translation:
  language: de
  text: 'Und er sandte Athenobios, einen seiner Freunde, zu ihm, um mit ihm zu sprechen, mit den Worten: »Ihr habt Joppe, Gazara[a] und die Burg in Jerusalem[b] in eurer Gewalt – Städte meines Königreichs.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara ist die griechische Namensform; der Ort wird gewöhnlich mit Geser gleichgesetzt.
    reason: cross_reference
  - marker: b
    text: 'Oder: »die Akra in Jerusalem«. Das griechische Wort bedeutet »Burg« oder »Zitadelle«, kann hier aber auch als fester Name der seleukidischen Festung Jerusalems gebraucht sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Das übliche deutsche Erzählverb gibt den schlichten Aorist natürlich und würdig wieder.
- source_word: Ἀθηνόβιον
  choice: Athenobios
  rationale: Der griechische Personenname wird in einer im Deutschen üblichen griechischen Umschrift wiedergegeben.
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: einen seiner Freunde
  rationale: Die Formulierung wahrt sowohl den gewöhnlichen Sinn als auch die mögliche Bedeutung eines hellenistischen Hoftitels, ohne diese im Haupttext festzulegen.
- source_word: κοινολογησόμενον αὐτῷ
  choice: um mit ihm zu sprechen
  rationale: Die Wendung bezeichnet eine gemeinsame Aussprache oder Beratung. Die breite Formulierung vermeidet die zu enge Festlegung auf förmliche Verhandlungen.
- source_word: κατακρατεῖτε
  choice: habt … in eurer Gewalt
  rationale: Die deutsche Wendung bringt das Ausüben tatsächlicher Kontrolle zum Ausdruck und erhält den anklagenden Ton, ohne ausdrücklich eine militärische Besetzung hinzuzufügen.
- source_word: Ἰόππης
  choice: Joppe
  rationale: Joppe ist die geläufige deutsche Namensform der Hafenstadt.
- source_word: Γαζάρων
  choice: Gazara
  rationale: Die Übersetzung folgt der im griechischen Text bezeugten Namensform; die verbreitete Identifizierung mit Geser wird in einer Fußnote genannt.
- source_word: τῆς ἄκρας ἐν Ἰερουσαλήμ
  choice: die Burg in Jerusalem
  rationale: ἄκρα bezeichnet eine Burg oder Zitadelle. „Burg“ ist verständliches, natürliches Deutsch; zugleich kann das Wort hier als Eigenbezeichnung der seleukidischen Akra verstanden werden.
- source_word: πόλεις τῆς βασιλείας μου
  choice: Städte meines Königreichs
  rationale: Die knappe Genitivverbindung des Griechischen bleibt erhalten, einschließlich der sachlichen Spannung, dass auch die Jerusalemer Burg in die Aufzählung einbezogen ist.
