  text: But[a], since we have the opportunity[b], we are holding fast to the inheritance of us and of our fathers.
translation:
  language: de
  text: Wir aber halten, da wir die Gelegenheit dazu haben[a], an dem Erbe[b] fest, das uns und unseren Vätern gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „solange wir die günstige Gelegenheit haben“. Das griechische Wort bezeichnet einen passenden oder günstigen Zeitpunkt, nicht Zeit im Allgemeinen.'
    reason: lexical_alternative
  - marker: b
    text: „Erbe“ kann hier auch „Erbbesitz“ oder „angestammter Besitz“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Wir aber
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten; „aber“ gibt die kontrastierende Kraft von δέ wieder.
- source_word: καιρὸν ἔχοντες
  choice: da wir die Gelegenheit dazu haben
  rationale: καιρός bezeichnet hier eine passende oder günstige Gelegenheit, nicht bloß Zeit im chronologischen Sinn. Die kausale Wiedergabe des Partizips passt zum Zusammenhang, ohne den zeitlichen Situationsbezug aufzugeben.
- source_word: ἀντεχόμεθα
  choice: halten … fest
  rationale: Das mediale Verb bezeichnet beharrliches Festhalten beziehungsweise die entschiedene Wahrung eines Besitzes; „festhalten an“ bewahrt diese Bedeutung, ohne sie auf einen rein juristischen Anspruch zu verengen.
- source_word: τῆς κληρονομίας
  choice: an dem Erbe
  rationale: „Erbe“ ist die verständlichste deutsche Entsprechung und kann hier zugleich den konkreten ererbten Besitz beziehungsweise das angestammte Gebiet bezeichnen.
- source_word: ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: das uns und unseren Vätern gehört
  rationale: Die Formulierung lässt beide Genitive von dem einen Substantiv κληρονομία abhängen und vermeidet den Eindruck zweier verschiedener Erbschaften.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „Wir aber“ erhält den im Griechischen hervorgehobenen Gegensatz; die Relativkonstruktion macht die gemeinsame Zuordnung des einen Erbes zu den Sprechern und ihren Vätern natürlich verständlich.
