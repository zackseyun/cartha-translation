  text: And Athenobius, the king’s friend, came to Jerusalem, and he saw the splendor of Simon, and a display of gold and silver vessels, and an impressive retinue; and he was astonished, and reported to him the king’s words.
translation:
  language: de
  text: Und Athenobius, der Freund des Königs, kam nach Jerusalem. Als er Simons Pracht sah, eine Auslage mit Gegenständen aus Gold und Silber[a] und das ansehnliche Gefolge, staunte er. Dann richtete er ihm die Worte des Königs aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort κυλίκιον ist selten und schwer zu deuten. Es kann genauer eine Ausstattung mit Trinkgeschirr, einen Schanktisch oder eine repräsentative Aufstellung kostbarer Gegenstände bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος τοῦ βασιλέως
  choice: der Freund des Königs
  rationale: Die formale Wiedergabe bewahrt die mögliche Bedeutung als höfischer Titel, ohne ihn durch eine spezifische Amtsbezeichnung wie „Höfling“ festzulegen.
- source_word: δόξαν
  choice: Pracht
  rationale: Im erzählerischen Zusammenhang bezeichnet das Wort Simons sichtbaren Glanz und seine repräsentative Stellung, nicht ausdrücklich theologische Herrlichkeit.
- source_word: κυλίκιον μετὰ χρυσωμάτων καὶ ἀργυρωμάτων
  choice: die Auslage goldener und silberner Gefäße
  rationale: Das seltene und schwierige κυλίκιον weist wahrscheinlich auf eine repräsentative Aufstellung beziehungsweise Ausstattung mit kostbarem Trink- oder Tafelgerät. „Auslage“ hält die genaue Art der Einrichtung offen; „Gefäße“ passt zum wahrscheinlichen Sachzusammenhang.
- source_word: παράστασιν ἱκανήν
  choice: das ansehnliche Gefolge
  rationale: Die Wendung bezeichnet wahrscheinlich die beträchtliche Zahl der Simon umgebenden Bediensteten oder Begleiter und zugleich deren eindrucksvolle Wirkung.
- source_word: ἐξίστατο
  choice: geriet er ins Staunen
  rationale: Die Formulierung gibt die starke Verwunderung idiomatisch wieder, ohne den im Deutschen missverständlichen Literalismus „geriet außer sich“ zu verwenden.
- source_word: ἀπήγγειλεν αὐτῷ τοὺς λόγους τοῦ βασιλέως
  choice: richtete er ihm die Worte des Königs aus
  rationale: „Ausrichten“ entspricht dem Überbringen einer königlichen Botschaft und bewahrt mit „Worte“ die konkrete Ausdrucksweise des Griechischen.
