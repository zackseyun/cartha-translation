  text: And he encircled the city[a], and the ships closed in from the sea; and he pressed the city from the land and from the sea[b], and he allowed no one to go out or to come in.
translation:
  language: de
  text: Und er umzingelte die Stadt[a], und die Schiffe rückten von der Seeseite her an[b]; und er bedrängte die Stadt vom Land und vom Meer her und ließ niemanden hinaus- oder hineingehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schloss die Stadt ringsum ein«. Das griechische Verb beschreibt wörtlich ein kreisförmiges Umschließen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann ein Zusammenfügen, Zusammentreffen oder Herandrängen bezeichnen. Hier beschreibt es das Vorgehen der Schiffe gegen die Stadt von der Seeseite her.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: umzingelte
  rationale: Das Verb bezeichnet ein ringsum Einschließen. »Umzingelte« bewahrt das konkrete militärische Bild, ohne den umfassenderen Begriff »belagerte« in den Text einzutragen.
- source_word: συνῆψαν
  choice: rückten … dicht heran
  rationale: Bei den Schiffen als Subjekt bezeichnet das Verb hier ihr Zusammenrücken beziehungsweise ihr Herandrängen an die Stadt von der Seeseite; die Formulierung bleibt anschaulich, ohne ausdrücklich einen Kampf zu behaupten.
- source_word: συνέθλιβεν
  choice: setzte … schwer zu
  rationale: Die Wendung gibt die starke, anhaltende Bedrängung durch das Imperfekt natürlich wieder. Ein wörtlicheres »zermalmte« wäre im Deutschen in diesem Belagerungskontext missverständlich.
- source_word: ἀπὸ τῆς γῆς καὶ ἀπὸ τῆς θαλάσσης
  choice: vom Land und vom Meer her
  rationale: Die wiederholte Richtungsperspektive des Griechischen bleibt erhalten und zeigt den Druck von beiden Seiten.
- source_word: οὐκ εἴασεν οὐδένα
  choice: ließ niemanden
  rationale: Dies ist eine klare, idiomatische Wiedergabe des verneinten Erlaubens.
- source_word: ἐκπορεύεσθαι καὶ εἰσπορεύεσθαι
  choice: hinaus- oder hineingehen
  rationale: Das deutsche Gegensatzpaar bildet die beiden Bewegungsrichtungen knapp ab; das in der Verneinung natürliche »oder« macht die vollständige Abriegelung deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte griechische Satzfolge wird leicht gegliedert; »während« verdeutlicht das gleichzeitige Vorgehen zu Land und zu Wasser, ohne den Sachgehalt zu verändern. Die fortdauernde Belagerungslage des Imperfekts wird durch »setzte … schwer zu« im Kontext vermittelt.
