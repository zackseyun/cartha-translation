  text: And he wrote these things to Demetrius the king[a], and to Attalus, and to Ariarathes, and to Arsaces,
translation:
  language: de
  text: Und dies schrieb er an König Demetrios, an Attalos, an Ariarathes[a] und an Arsakes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Namensform Ἀράθῃ bezieht sich wahrscheinlich auf Ariarathes; näher an der überlieferten Form könnte man auch »Arathes« wiedergeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der übliche erzählerische Anschluss wahrt den parataktischen Stil des Griechischen.
- source_word: ταῦτα
  choice: dies
  rationale: Das substantivierte Demonstrativpronomen bezieht sich auf den zuvor genannten Inhalt; »dies« gibt den griechischen Plural im Deutschen idiomatisch als Gesamtinhalt wieder.
- source_word: ἔγραψεν
  choice: schrieb er
  rationale: Der Aorist von γράφω bezeichnet hier schlicht eine abgeschlossene schriftliche Mitteilung.
- source_word: Δημητρίῳ τῷ βασιλεῖ
  choice: an König Demetrius
  rationale: Der Dativ bezeichnet den Empfänger; τῷ βασιλεῖ steht appositionell bei Demetrius. Die deutsche Titelfügung »König Demetrius« ist natürlich und präzise.
- source_word: Ἀττάλῳ
  choice: an Attalus
  rationale: Konventionelle deutsche Form des Eigennamens; die Präposition macht die Dativfunktion im Deutschen deutlich.
- source_word: Ἀράθῃ
  choice: an Ariarathes[a]
  rationale: Die im griechischen Text stehende Namensform wird wahrscheinlich auf den historisch bekannten König Ariarathes bezogen; die Fußnote bewahrt die abweichende unmittelbare Wiedergabemöglichkeit.
- source_word: Ἀρσάκῃ
  choice: an Arsakes
  rationale: »Arsakes« ist die im Deutschen übliche gräzisierende Form des Königsnamens; die Präposition gibt den griechischen Dativ wieder.
