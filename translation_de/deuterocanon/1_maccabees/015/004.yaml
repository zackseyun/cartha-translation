  yaml_path: translation/deuterocanon/1_maccabees/015/004.yaml
  text: But I want to go out into the country[a], so that I may pursue those who have devastated our country and laid waste many cities in the kingdom[b];
translation:
  language: de
  text: Doch ich will durch das Land ziehen[a], um diejenigen zu verfolgen[b], die unser Land verwüstet und viele Städte im Königreich verheert haben;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Land umherziehen«; die griechische Wendung kann allgemein eine Bewegung durch das Gebiet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gegen diejenigen vorzugehen« beziehungsweise »diejenigen zur Rechenschaft zu ziehen«; das griechische Verb bezeichnet hier ein feindliches Nachsetzen und kann auch das Ahnden des Unrechts einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βούλομαι
  choice: ich will
  rationale: Gibt den persönlichen Willen beziehungsweise die Absicht des Sprechers direkt, natürlich und dem griechischen Präsens entsprechend wieder.
- source_word: ἐκβῆναι κατὰ τὴν χώραν
  choice: durch das Land ziehen
  rationale: ἐκβῆναι bezeichnet das Hinaus- oder Aufbrechen; κατά mit Akkusativ kann bei Bewegung den Weg durch ein Gebiet bezeichnen. Die Formulierung lässt den militärischen Zusammenhang erkennen, ohne ihn durch »ins Feld ziehen« stärker auszudeuten.
- source_word: ὅπως μετέλθω
  choice: um … zu verfolgen
  rationale: Die deutsche Infinitivkonstruktion gibt den finalen Sinn von ὅπως idiomatisch wieder. μετέρχομαι bezeichnet hier feindliches Nachsetzen oder Vorgehen gegen Schuldige; »verfolgen« bewahrt diesen Sinn, ohne ausdrücklich eine Bestrafung festzulegen.
- source_word: τοὺς κατεφθαρκότας τὴν χώραν ἡμῶν
  choice: die unser Land verwüstet … haben
  rationale: καταφθείρω bezeichnet das Zugrunderichten oder schwere Schädigen. »verwüstet« passt zum betroffenen Land und wahrt die starke, aber nicht zwingend totale Zerstörung.
- source_word: τοὺς ἠρημωκότας πόλεις πολλὰς
  choice: und viele Städte … verheert haben
  rationale: ἐρημόω bedeutet öde machen oder verwüsten. »verheert« ist im Deutschen bei Städten klar und kräftig und vermeidet die unmittelbare Wiederholung von »verwüstet«.
- source_word: ἐν τῇ βασιλείᾳ
  choice: im Königreich
  rationale: Bewahrt den bestimmten Ausdruck ohne den im Griechischen nicht ausdrücklich vorhandenen Zusatz »meinem«.
theological_decisions: []
