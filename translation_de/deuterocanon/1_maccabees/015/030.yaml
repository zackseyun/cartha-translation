lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun also
  rationale: Die Wendung verbindet eine folgernde Überleitung mit unmittelbarem Nachdruck; „Nun also“ gibt beides in natürlichem, würdigem Deutsch wieder.
- source_word: παράδοτε
  choice: gebt … heraus
  rationale: Der Imperativ fordert die Übergabe von Besitz oder Verfügungsgewalt. „Herausgeben“ ist direkt, ohne ausdrücklich Kapitulation oder Rückgabe an einen früheren Eigentümer vorauszusetzen.
- source_word: τὰς πόλεις ἃς κατελάβετε
  choice: die Städte, die ihr eingenommen habt
  rationale: καταλαμβάνω bezeichnet hier die gewaltsame Einnahme beziehungsweise Inbesitznahme; „eingenommen“ passt besonders gut zu Städten.
- source_word: τοὺς φόρους
  choice: die Abgaben
  rationale: φόροι kann Steuern oder Tributzahlungen bezeichnen. „Abgaben“ bewahrt diese Spannweite besser als das engere „Steuern“.
- source_word: τῶν τόπων
  choice: aus den Gebieten
  rationale: τόποι ist allgemein und muss keine amtlichen Verwaltungsbezirke bezeichnen. „Gebiete“ ist im politischen Zusammenhang natürlicher als „Orte“.
- source_word: ὧν κατεκυριεύσατε
  choice: über die ihr die Herrschaft erlangt habt
  rationale: κατακυριεύω bezeichnet das Erlangen von Herrschaft oder Vorherrschaft; die Formulierung erhält die politische Stärke des Verbs.
- source_word: τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: jenseits der Grenzen Judäas
  rationale: Die griechische Grenzformel ist stark verdichtet. Im Zusammenhang liegt der räumliche Sinn von Gebieten außerhalb beziehungsweise jenseits der Grenzen Judäas nahe; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Deutung der verdichteten Grenzformel τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: jenseits der Grenzen Judäas
  alternative: von den Grenzen Judäas her / aus dem Grenzgebiet Judäas
  rationale: Die Frage ist eher historisch-geografisch als lehrmäßig. Der Kontext stützt die Deutung, dass Städte und Abgaben außerhalb Judäas gemeint sind; da die griechische Konstruktion jedoch mehrdeutig beziehungsweise elliptisch ist, wird die formal nähere Alternative in einer Fußnote genannt.
