  yaml_path: translation/deuterocanon/1_maccabees/015/008.yaml
  text: And let every royal debt[a], and the royal revenues yet to come, from now on and for all time, be remitted to you.
translation:
  language: de
  text: Und alle dem König geschuldeten Beträge sowie die künftig anfallenden königlichen Einkünfte seien dir von jetzt an für alle Zeit erlassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν ὀφείλημα βασιλικὸν
  choice: jede königliche Schuld
  rationale: Der Singular mit πᾶν hat distributiven Sinn. „Schuld“ gibt das im fiskalischen Zusammenhang Geschuldete knapp wieder, ohne eine bestimmte Abgabenart festzulegen.
- source_word: τὰ ἐσόμενα βασιλικά
  choice: die künftigen königlichen Einkünfte
  rationale: Das substantivierte neutrale Plural mit künftigem Partizip bezeichnet Beträge, die künftig dem König beziehungsweise der königlichen Kasse zufallen; „Einkünfte“ wahrt die sachliche Unbestimmtheit.
- source_word: ἀπὸ τοῦ νῦν
  choice: von jetzt an
  rationale: Natürliche moderne Wiedergabe der zeitlichen Wendung.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: für alle Zeit
  rationale: Bewahrt den umfassenden und dauerhaften Geltungsanspruch des Erlasses in würdigem, geläufigem Deutsch.
- source_word: ἀφέσθω σοι
  choice: sollen dir … erlassen sein
  rationale: Der Imperativ von ἀφίημι bezeichnet hier einen rechtlich-fiskalischen Erlass. Die deutsche Formulierung gibt sowohl den Verfügungscharakter als auch den Begünstigten wieder.
theological_decisions: []
