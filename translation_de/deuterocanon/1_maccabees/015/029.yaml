  text: You have laid waste their borders[a], and you have inflicted a great blow on the land[c][b], and you have gained control of many places in my kingdom.
translation:
  language: de
  text: Ihr habt ihre Grenzgebiete verwüstet[a], dem Land einen schweren Schlag versetzt[b] und viele Orte in meinem Königreich unter eure Herrschaft gebracht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Grenzen verwüstet“; das griechische Wort kann Grenzen, Grenzgebiete oder ein abgegrenztes Territorium bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Land schweren Schaden zugefügt“; das griechische Wort kann je nach Zusammenhang auch Schlag, Wunde oder Plage bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „über viele Orte in meinem Königreich geherrscht“; das griechische Verb bezeichnet das Erlangen oder Ausüben von Herrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὅρια αὐτῶν
  choice: ihr Grenzgebiet
  rationale: ὅρια kann Grenzen, Grenzgebiete oder ein abgegrenztes Territorium bezeichnen. Im Zusammenhang mit der Verwüstung ist „Grenzgebiet“ im Deutschen natürlicher als das konkret-plurale „ihre Grenzen“ und bewahrt den territorialen Sinn.
- source_word: ἠρημώσατε
  choice: habt … verwüstet
  rationale: Das Verb bezeichnet das Verödenlassen oder Verwüsten eines Gebietes. „Verwüstet“ gibt die verursachte Zerstörung klar und idiomatisch wieder.
- source_word: πληγὴν μεγάλην
  choice: schweren Schaden
  rationale: πληγή kann Schlag, Wunde, Plage oder Schädigung bedeuten. In dieser militärisch-politischen Klage gibt „schweren Schaden“ die Wirkung wieder, ohne Krankheit oder einen einzelnen körperlichen Schlag nahezulegen.
- source_word: ἐπὶ τῆς γῆς
  choice: dem Land
  rationale: γῆ bezeichnet hier das betroffene Land beziehungsweise Territorium, nicht die gesamte Erde. Die Verbindung „dem Land … zugefügt“ bildet die griechische Aussage in natürlichem Deutsch ab.
- source_word: ἐκυριεύσατε
  choice: unter eure Herrschaft gebracht
  rationale: Das Verb bezeichnet das Erlangen oder Ausüben von Herrschaft. Die Formulierung wahrt diesen Herrschaftsaspekt und passt zur territorialen Inbesitznahme.
- source_word: τόπων πολλῶν
  choice: viele Orte
  rationale: τόποι ist eine allgemeine Bezeichnung für Orte oder Örtlichkeiten. „Viele Orte“ übersetzt sie direkt, ohne bestimmte Verwaltungseinheiten vorauszusetzen.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: in meinem Königreich
  rationale: βασιλεία bezeichnet hier den Herrschaftsbereich des Königs. „Königreich“ ist die klare und kontextgerechte Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Anklagefolge des griechischen Satzes bleibt erhalten; idiomatische Verbverbindungen vermeiden unnötig steife Wörtlichkeit. Die Anrede „ihr/eure“ ist pluralisch und wird kleingeschrieben.
