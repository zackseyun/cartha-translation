  yaml_path: translation/deuterocanon/1_maccabees/015/027.yaml
  text: And he was not willing to accept them[a], but rejected everything that he had previously agreed to with him[b], and became estranged from him.
translation:
  language: de
  text: Und er wollte sie nicht annehmen, sondern verwarf alles, was er zuvor mit ihm vereinbart hatte, und entfremdete sich ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und verhielt sich ihm gegenüber wie ein Fremder.“'
