lexical_decisions:
- source_word: οὐκ ἠβούλετο αὐτὰ δέξασθαι
  choice: er wollte sie nicht annehmen
  rationale: Die Verbindung aus dem imperfektischen ἠβούλετο und dem Infinitiv δέξασθαι bezeichnet seine anhaltende Weigerung, die zuvor genannten Dinge anzunehmen; „sie“ lässt den Rückbezug wie im Griechischen offen.
- source_word: ἠθέτησεν
  choice: verwarf
  rationale: ἀθετέω bezeichnet hier das Verwerfen beziehungsweise Außerkraftsetzen früherer Vereinbarungen. „Verwarf“ ist verständlich, ohne eine engere juristische Deutung festzulegen.
- source_word: πάντα ὅσα συνέθετο αὐτῷ τὸ πρότερον
  choice: alles, was er zuvor mit ihm vereinbart hatte
  rationale: Das mediale συντίθημι bezeichnet eine gegenseitige Vereinbarung; „mit ihm vereinbart hatte“ gibt sowohl den diplomatischen Sinn als auch den zeitlichen Rückbezug von τὸ πρότερον natürlich wieder.
- source_word: ἠλλοτριοῦτο αὐτῷ
  choice: entfremdete sich ihm
  rationale: Das Imperfekt beschreibt eine sich vollziehende beziehungsweise andauernde Entfremdung. Der Dativ wird mit der idiomatischen deutschen Fügung „sich jemandem entfremden“ bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe diplomatisch-politische Ton des griechischen Textes bleibt erhalten; die ungewöhnlichere Formulierung „entfremdete sich ihm“ bewahrt die relationale Spannung, während die Fußnote die bildnähere Alternative nennt.
