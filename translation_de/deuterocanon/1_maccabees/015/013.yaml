base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/013.yaml
  text: And Antiochus encamped against Dora[c][b][a], and with him were twelve myriads of fighting men and eight thousand cavalry.
translation:
  language: de
  text: Und Antiochus schlug vor Dora[a] sein Lager auf; bei ihm waren zwölf Myriaden[b] Krieger und achttausend Reiter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname lautet im Griechischen „Dora“; auch die Form „Dor“ ist gebräuchlich.
    reason: alternative_reading
  - marker: b
    text: Das sind 120.000 Krieger. Eine Myriade ist eine Einheit von zehntausend.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Griechischen „achttausend Pferd“; „Pferd“ ist hier ein Sammelbegriff für die Reiterei.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Δῶρα
  choice: schlug vor Dora sein Lager auf
  rationale: παρεμβάλλω bezeichnet im militärischen Zusammenhang das Aufschlagen eines Lagers. Mit ἐπί und dem Ortsnamen beschreibt die Wendung hier eine feindliche Stellung vor der Stadt; „vor Dora“ klingt im Deutschen natürlich und lässt den Belagerungskontext erkennen.
- source_word: Δῶρα
  choice: Dora
  rationale: „Dora“ gibt die Namensform des zugrunde gelegten griechischen Textes unmittelbar wieder; „Dor“ ist eine verbreitete alternative Namensform.
- source_word: δώδεκα μυριάδες
  choice: zwölf Myriaden
  rationale: Die Wiedergabe bewahrt die antike griechische Zahleneinheit; eine Myriade entspricht zehntausend. Die Fußnote nennt den heutigen Zahlenwert.
- source_word: ἀνδρῶν πολεμιστῶν
  choice: Krieger
  rationale: Die Wendung bezeichnet Männer, die als Kämpfer zum Heer gehören. „Krieger“ ist knapp, verständlich und bewahrt den militärischen Sinn.
- source_word: ὀκτακισχίλια ἵππος
  choice: achttausend Reiter
  rationale: ἵππος bedeutet wörtlich „Pferd“, wird hier aber als militärischer Sammelbegriff für berittene Truppen gebraucht. „Reiter“ ist im Deutschen bei einer zahlenmäßigen Heeresangabe idiomatisch.
theological_decisions: []
