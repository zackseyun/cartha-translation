  yaml_path: translation/deuterocanon/1_maccabees/015/010.yaml
  text: In the one hundred seventy-fourth year, Antiochus went out into the land of his fathers, and all the forces gathered to him, so that only a few were left with Tryphon.
translation:
  language: de
  text: Im hundertvierundsiebzigsten Jahr zog Antiochus in das Land seiner Vorfahren, und alle Streitkräfte schlossen sich ihm an, sodass nur wenige bei Tryphon waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτους τετάρτου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: Im hundertvierundsiebzigsten Jahr
  rationale: Die griechische Datierungsformel wird in natürlichem Deutsch als Zeitangabe wiedergegeben; die Zählung bleibt unverändert und wird nicht ausdrücklich als seleukidische Ära erläutert.
- source_word: ἐξῆλθεν
  choice: zog
  rationale: Im militärisch-historischen Zusammenhang bezeichnet das Verb ein Ausziehen beziehungsweise Aufbrechen. „zog“ ist natürlich und wahrt die Bewegung, ohne ausdrücklich einen Feldzug zu behaupten.
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: in das Land seiner Vorfahren
  rationale: „Land“ gibt γῆ wieder; „seiner Vorfahren“ vermittelt den angestammten Bezug von τῶν πατέρων αὐτοῦ in verständlichem modernem Deutsch.
- source_word: συνῆλθον πρὸς αὐτόν
  choice: schlossen sich ihm an
  rationale: Die Wendung bezeichnet hier nicht bloß räumliches Zusammenkommen, sondern den Anschluss der Streitkräfte an Antiochus. Die deutsche Formulierung bringt diesen kontextuellen Sinn natürlich zum Ausdruck.
- source_word: πᾶσαι αἱ δυνάμεις
  choice: alle Streitkräfte
  rationale: δυνάμεις bezeichnet im militärischen Erzählzusammenhang die bewaffneten Kräfte; „Streitkräfte“ ist präzise, ohne sie als mehrere eigenständige Heere festzulegen.
- source_word: ὥστε ὀλίγους εἶναι σὺν Τρύφωνι
  choice: sodass nur wenige bei Tryphon blieben
  rationale: ὥστε drückt die Folge aus. Das griechische „wenige bei Tryphon sein“ wird idiomatisch als Verbleiben bei ihm wiedergegeben; „nur“ entspricht der einschränkenden Aussage von ὀλίγους im Kontext.
