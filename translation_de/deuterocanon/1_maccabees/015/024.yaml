lexical_decisions:
- source_word: ἀντίγραφον
  choice: Abschrift
  rationale: Das Substantiv bezeichnet die Abschrift beziehungsweise Kopie eines Schriftstücks; „Abschrift“ passt zum amtlichen Kontext und klingt im Deutschen natürlich.
- source_word: αὐτῶν
  choice: davon
  rationale: Das formal plurale Pronomen verweist im Zusammenhang auf den zuvor genannten Schriftinhalt beziehungsweise das Dokument als Ganzes. „Davon“ bewahrt den Rückbezug, ohne im Deutschen eine unnatürliche Mehrzahl zu erzwingen.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Die einfache Grundbedeutung ist „schrieb“. Der Vers sagt nicht ausdrücklich, dass er die Abschrift sandte.
- source_word: ἀρχιερεῖ
  choice: Hohen Priester
  rationale: „Hoher Priester“ ist die etablierte und sachlich passende Bezeichnung für ἀρχιερεύς im jüdischen kultischen und politischen Zusammenhang.
- source_word: Σίμωνι
  choice: Simon
  rationale: „Simon“ ist die im Deutschen übliche Namensform für Σίμων in diesem historischen Zusammenhang.
theological_decisions: []
translation_notes:
