  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes zuverlässig wieder: Numenius und die ihn Begleitenden kommen aus Rom, führen Briefe für Könige und Länder mit sich, und anschließend wird deren Wortlaut eingeleitet. „kehrten ... zurück“ ist nicht die engste lexikalische Wiedergabe von ἦλθεν („kam“), wird jedoch durch den unmittelbaren Kontext der Rückkehr von der Gesandtschaft gedeckt und ist durch die Fußnote transparent gemacht.'
