  text: 'And Numenius and those with him came back from Rome[a], bringing letters to the kings and the countries, in which these things had been written:'
translation:
  language: de
  text: 'Und Numenius und seine Begleiter kehrten aus Rom zurück[a] und brachten Briefe an die Könige und die Länder mit. Darin stand Folgendes geschrieben:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen: „kamen … aus Rom“. Aus dem Zusammenhang geht hervor, dass sie von ihrer Gesandtschaft dorthin zurückkehrten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: kehrten … zurück
  rationale: Das Verb bedeutet grundsätzlich „kam“, doch der Zusammenhang beschreibt die Rückkehr des Numenius und seiner Begleiter von ihrer Gesandtschaft nach Rom. Der deutsche Plural folgt dem zusammengesetzten Subjekt.
- source_word: οἱ παρʼ αὐτοῦ
  choice: seine Begleiter
  rationale: Die Wendung bezeichnet die Personen, die bei Numenius waren beziehungsweise ihn begleiteten. „Seine Begleiter“ ist knapp, natürlich und legt ihre genaue Funktion nicht näher fest.
- source_word: ἐκ Ῥώμης
  choice: aus Rom
  rationale: Natürliche deutsche Wiedergabe der Herkunftsangabe mit ἐκ.
- source_word: ἔχοντες ἐπιστολάς
  choice: brachten Briefe … mit
  rationale: 'Das Partizip bezeichnet einen begleitenden Umstand: Bei ihrer Ankunft führten sie die Briefe mit sich. Die gewählte Formulierung ist im Deutschen idiomatischer als „hatten Briefe“.'
- source_word: τοῖς βασιλεῦσι καὶ ταῖς χώραις
  choice: an die Könige und die Länder
  rationale: Die Dative bezeichnen am ehesten die Adressaten der Briefe. χώρα meint hier politische oder geografische Gebiete; „Länder“ ist eine klare, moderne Entsprechung.
- source_word: ἐν αἷς ἐγέγραπτο τάδε
  choice: Darin stand Folgendes geschrieben
  rationale: Die Formulierung leitet den Inhalt der Briefe ein. „Darin“ bezieht sich eindeutig auf die Briefe; „Folgendes“ gibt das vorausweisende τάδε in natürlichem Deutsch wieder.
