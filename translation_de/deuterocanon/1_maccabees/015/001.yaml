  source_fidelity: 'Der Text gibt alle Satzglieder des griechischen Ausgangstextes korrekt wieder: Antiochus als Sohn des Königs Demetrius, das Senden mehrerer Briefe, die Herkunftsangabe, Simon als Priester und Ethnarch der Juden sowie die zusätzliche Adressierung an das ganze Volk. Die Reihenfolge und Zuordnung der Empfänger bleiben klar.'
  naturalness: „Und Antiochus, der Sohn des Königs Demetrius, sandte von den Inseln des Meeres Briefe an Simon, den Priester und Ethnarchen der Juden, und an das ganze Volk“ ist würdiges, gut verständliches modernes Standarddeutsch. Das Präteritum passt zum erzählenden Kontext. Die etwas formelhafte geographische Wendung bewahrt angemessen die Bildlichkeit und Unbestimmtheit des Griechischen.
  terminology: „Ethnarch“ bewahrt den historischen Amtstitel, ohne dessen genaue verfassungsrechtliche Reichweite vorwegzunehmen; die Anmerkung erläutert ihn sachlich. „Juden“ ist in diesem Zusammenhang eine tragfähige Wiedergabe von Ἰουδαῖοι, während die Fußnote die mögliche Wiedergabe „Judäer“ transparent macht. „Volk“ gibt ἔθνος hier idiomatisch und mit kollektiv-politischer Nuance wieder.
