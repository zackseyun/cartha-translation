base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/001.yaml
  text: And Antiochus son of King Demetrius sent letters from the islands of the sea to Simon[a], priest and ethnarch of the Jews[b], and to all the nation.
translation:
  language: de
  text: Und Antiochus, der Sohn des Königs Demetrius, sandte von den Inseln des Meeres Briefe an Simon, den Priester und Ethnarchen[a] der Juden[b], und an das ganze Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Ethnarch war der Herrscher oder politische Leiter eines Volkes beziehungsweise einer Volksgruppe.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Judäer“. Das griechische Wort kann je nach Zusammenhang das jüdische Volk in ethnisch-religiösem oder in regional-politischem Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Das einfache Präteritum gibt den griechischen Aorist in erzählendem Deutsch natürlich wieder und passt idiomatisch zum Objekt „Briefe“.
- source_word: ἐπιστολάς
  choice: Briefe
  rationale: Der griechische Akkusativ Plural bezeichnet mehrere schriftliche Mitteilungen; „Briefe“ ist präzise und allgemein verständlich.
- source_word: ἀπὸ τῶν νήσων τῆς θαλάσσης
  choice: von den Inseln des Meeres
  rationale: Die Wiedergabe bleibt nahe an der Genitivverbindung und lässt offen, welche Inseln konkret gemeint sind.
- source_word: ἱερεῖ
  choice: den Priester
  rationale: Der Dativ steht als Apposition zu Simon. Im Deutschen ist der bestimmte Artikel in dieser appositionellen Reihung natürlich, ohne einen zusätzlichen Rang zu behaupten.
- source_word: ἐθνάρχῃ
  choice: Ethnarchen
  rationale: Der historische Amtstitel wird bewahrt, damit keine modernere oder enger bestimmte Verfassungsform wie „Gouverneur“ eingetragen wird; eine Fußnote erklärt ihn.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Hier bezeichnet der Ausdruck das jüdische Volk in ethnisch-politischem Zusammenhang. „Judäer“ bleibt als kontextuell mögliche Alternative in der Fußnote sichtbar.
- source_word: παντὶ τῷ ἔθνει
  choice: das ganze Volk
  rationale: „Volk“ ist im Deutschen natürlicher als „Nation“ und bewahrt hier den kollektiven politisch-ethnischen Sinn von ἔθνος.
- source_word: τοῦ βασιλέως
  choice: des Königs
  rationale: Der Genitiv wird ausdrücklich wiedergegeben; „der Sohn des Königs Demetrius“ ist würdiges, klares Standarddeutsch.
theological_decisions:
- issue: Wiedergabe des politischen Titels ἐθνάρχης
  choice: Ethnarch
  alternative: Herrscher des Volkes; Statthalter
  rationale: Die Transliteration bewahrt den formalen historischen Titel und vermeidet, Simons Amt durch eine moderne oder zu eng festgelegte Amtsbezeichnung umzudeuten.
- issue: Bedeutungsumfang von Ἰουδαῖοι
  choice: Juden
  alternative: Judäer
  rationale: Der Zusammenhang betrifft das gesamte von Simon geführte Volk, sodass „Juden“ naheliegt. Die mögliche regional-politische Nuance „Judäer“ wird jedoch nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Der seltene historische Titel „Ethnarch“ bleibt erhalten und wird erklärt; unnötig altertümliche Formulierungen werden vermieden.
