revisions:
- from: Was aber Joppe und Geser betrifft, so forderst du sie. Diese Städte haben dem Volk und unserem Land schweren Schaden zugefügt. Für sie werden wir hundert Talente geben. Doch er gab ihm keine Antwort.
  to: 'Was aber Joppe und Geser betrifft: Du forderst sie. Diese fügten dem Volk und unserem Land schweren Schaden zu. Für sie werden wir hundert Talente geben. Und er erwiderte ihm kein Wort.'
