  text: But concerning Joppa and Gazara, you ask for them. These were inflicting great harm on the people and on our land. For these we will give one hundred talents. And he answered him not a word.
translation:
  language: de
  text: 'Was aber Joppe und Geser betrifft: Du forderst sie. Diese fügten dem Volk und unserem Land schweren Schaden zu. Für sie werden wir hundert Talente geben. Und er erwiderte ihm kein Wort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰόππης
  choice: Joppe
  rationale: Die im Deutschen geläufige biblische Namensform für die Hafenstadt.
- source_word: Γαζαρηνῶν
  choice: Geser
  rationale: Im Zusammenhang sind die beiden Städte Joppe und Geser gemeint; αὗται nimmt sie anschließend als weibliche Ortsbezeichnungen wieder auf. „Geser“ ist die geläufige deutsche Namensform.
- source_word: αἰτεῖς
  choice: forderst du sie
  rationale: Gibt das nachdrückliche Verlangen im politischen Verhandlungskontext wieder, ohne das im Griechischen nicht ausdrücklich vorhandene „zurück“ einzufügen.
- source_word: πληγὴν μεγάλην
  choice: schweren Schaden
  rationale: Die Wendung bezeichnet hier eine schwere Schädigung; eine wörtliche Wiedergabe als „großen Schlag“ wäre im Deutschen missverständlich.
- source_word: τάλαντα ἑκατόν
  choice: hundert Talente
  rationale: Bewahrt die antike Gewichts- und Geldeinheit ohne spekulative Umrechnung.
- source_word: οὐκ ἀπεκρίθη αὐτῷ λόγον
  choice: er gab ihm keine Antwort
  rationale: Natürliche deutsche Wiedergabe der idiomatischen Aussage, dass überhaupt keine Antwort erfolgte.
