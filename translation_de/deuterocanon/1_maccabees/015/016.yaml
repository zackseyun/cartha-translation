lexical_decisions:
- source_word: Λεύκιος
  choice: Lucius
  rationale: Der Personenname wird in seiner geläufigen lateinisch-deutschen Form wiedergegeben.
- source_word: ὕπατος
  choice: Konsul
  rationale: Das Wort bezeichnet hier präzise das römische Amt des Konsuls.
- source_word: Ῥωμαίων
  choice: der Römer
  rationale: Der Genitiv Plural wird ausdrücklich bewahrt und bezeichnet das Volk beziehungsweise Gemeinwesen, dessen Konsul Lucius ist.
- source_word: Πτολεμαίῳ
  choice: König Ptolemäus
  rationale: Der Dativ kennzeichnet den Adressaten; der Königsname erscheint in der üblichen deutschen Form, zusammen mit seinem appositionellen Titel.
- source_word: βασιλεῖ
  choice: König
  rationale: Der Titel wird unmittelbar vor dem Namen wiedergegeben, wie es im Deutschen natürlich ist.
- source_word: χαίρειν
  choice: grüßt
  rationale: In Briefanfängen ist χαίρειν eine feste Grußformel. Die verbale Wiedergabe ergibt im Deutschen eine natürliche und zugleich formnahe Absender-Adressen-Formel.
