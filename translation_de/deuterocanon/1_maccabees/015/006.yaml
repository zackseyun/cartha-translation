translation:
  language: de
  text: dein eigenes Münzgeld als Währung deines Landes zu prägen;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein eigenes Münzgeld als Zahlungsmittel deines Landes herzustellen“. Das Griechische verwendet ein allgemeines Verb („machen“, „herstellen“) sowie Begriffe für geprägtes Geld und geltende Währung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: zu prägen
  rationale: Das Verb bedeutet allgemein „machen/herstellen“; zusammen mit κόμμα bezeichnet es idiomatisch das Prägen von Münzgeld. Im Deutschen wäre „Münzgeld zu machen“ unnatürlich.
- source_word: κόμμα
  choice: Münzgeld
  rationale: Hier bezeichnet κόμμα geprägtes Geld beziehungsweise eine Münzprägung. „Münzgeld“ wahrt den kollektiven und administrativen Sinn besser als der Singular „Münze“.
- source_word: ἴδιον
  choice: dein eigenes
  rationale: ἴδιον kennzeichnet das dem Angesprochenen eigentümlich Zugehörige; „dein eigenes“ gibt Besitz und eigenständige Ausgabe natürlich wieder.
- source_word: νόμισμα
  choice: als Währung
  rationale: νόμισμα bezeichnet geltendes beziehungsweise umlaufendes Geld. „Als Währung“ hält es von κόμμα unterscheidbar und gibt die Funktion des geprägten Geldes wieder.
- source_word: τῆς χώρας σου
  choice: für dein Land
  rationale: χώρα bezeichnet hier das politische Gebiet des Angesprochenen. „Land“ ist im Deutschen natürlich und vermeidet die mögliche moderne Engführung von „Staat“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Verwaltungssprache. Die idiomatische Wendung „Münzgeld prägen“ konkretisiert das allgemeine griechische Verb durch seinen Geldkontext; „als Währung“ bewahrt zugleich den ausdrücklich genannten Funktionsbegriff νόμισμα.
