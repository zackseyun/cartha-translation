  yaml_path: translation/deuterocanon/1_maccabees/015/021.yaml
  text: If[a], then, any pestilent men have escaped from their land to us, hand them over to Simon the high priest[b], so that he may punish them according to their law.
translation:
  language: de
  text: Wenn also einige Unheilstifter aus ihrem Land zu uns entkommen sind, liefert sie dem Hohen Priester Simon aus, damit er sie nach ihrem Gesetz zur Rechenschaft zieht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „pestartige Menschen“, „Verderbliche“ oder „Unruhestifter“. Das griechische λοιμοί ist eine scharfe, bildhafte Bezeichnung für gefährliche oder schädliche Menschen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann auch „an ihnen Recht üben“, „sie bestrafen“ oder „sich an ihnen rächen“ bedeuten. Die Wendung „nach ihrem Gesetz“ spricht hier für einen Rechtsvollzug.
    reason: alternative_reading
lexical_decisions:
- source_word: λοιμοὶ
  choice: Unheilstifter
  rationale: Das Wort bezeichnet bei Personen in scharf abwertender Weise gefährliche, verderbliche oder Unheil stiftende Menschen. „Unheilstifter“ bewahrt die Härte, ohne die im Deutschen missverständliche wörtliche Wiedergabe „Pestmenschen“ zu verwenden.
- source_word: διαπεφεύγασιν
  choice: entkommen sind
  rationale: Das Perfekt bezeichnet eine vollzogene Flucht mit fortbestehendem Ergebnis; „entkommen sind“ ist im Zusammenhang einer Auslieferungsforderung natürlich und genau.
- source_word: χώρας
  choice: Land
  rationale: χώρα kann Land, Gebiet oder Territorium bedeuten. „Land“ erhält die geografisch-politische Bedeutung, ohne sie unnötig einzuengen.
- source_word: παράδοτε
  choice: liefert ... aus
  rationale: Der Imperativ fordert die Übergabe von Entkommenen an Simons Gerichtsbarkeit. „Ausliefern“ ist im rechtlich-politischen Zusammenhang die präzise moderne Formulierung.
- source_word: ἀρχιερεῖ
  choice: Hohen Priester
  rationale: ἀρχιερεύς ist die übliche Bezeichnung für den jüdischen Hohen Priester.
- source_word: ἐκδικήσει
  choice: zur Rechenschaft zieht
  rationale: Das Verb kann rächen, Recht verschaffen oder bestrafen bedeuten. Zusammen mit „nach ihrem Gesetz“ steht hier die gerichtliche Ahndung im Vordergrund; die Formulierung wahrt den juridischen Sinn, ohne persönliche Rache anzudeuten.
- source_word: κατὰ τὸν νόμον αὐτῶν
  choice: nach ihrem Gesetz
  rationale: Das griechische Pronomen steht im Plural und wird deshalb als „ihrem“ beibehalten. Der mögliche Bezug auf die Rechtsordnung der Betroffenen beziehungsweise ihres Volkes wird nicht stillschweigend vereindeutigt.
theological_decisions:
- issue: Bedeutung von ἐκδικήσει im rechtlich-politischen Zusammenhang
  choice: gerichtliche Ahndung („zur Rechenschaft zieht“)
  alternative: „sich an ihnen rächt“ oder „sie bestraft“
  rationale: Die anschließende Wendung „nach ihrem Gesetz“ rahmt die Handlung als Rechtsvollzug. Die Übersetzung vermeidet daher den Eindruck persönlicher Vergeltung, ohne die Schärfe des geforderten Vorgehens abzuschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Unheilstifter“ gibt die scharfe Abwertung von λοιμοί verständlich wieder; „liefert ... aus“ entspricht dem politischen und rechtlichen Kontext. Die Mehrdeutigkeit des pluralischen „ihrem Gesetz“ bleibt erhalten.
