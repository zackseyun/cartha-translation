base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/045.yaml
  text: And now send them away to their homes, but choose for yourself a few men who will be with you; and come with me to Ptolemais, and I will hand it over to you, along with the rest of the strongholds and the large forces and all those in charge of affairs, and then I will depart after turning back; for this is why I have come.
translation:
  language: de
  text: Und nun schick sie nach Hause. Wähle dir aber wenige Männer aus, die bei dir sein werden. Dann komm mit mir nach Ptolemaïs, und ich werde dir die Stadt übergeben, ebenso die übrigen Festungen, die zahlreichen Truppen und alle, die für die Angelegenheiten zuständig sind.[a] Dann werde ich, nachdem ich umgekehrt bin, fortgehen;[b] denn dazu bin ich gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Amtsträger“. Wörtlich bezeichnet der griechische Ausdruck alle, die über die anfallenden Angelegenheiten oder Aufgaben gesetzt sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Formulierung ist knapp: Zuerst wird ein Umkehren oder Zurückkehren, danach das Fortgehen genannt; wohin die Umkehr führt, bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστειλον αὐτοὺς εἰς τοὺς οἴκους αὐτῶν
  choice: schick sie nach Hause
  rationale: Die Wendung bezeichnet idiomatisch die Entsendung an den jeweiligen Wohnort; „nach Hause“ ist im Deutschen natürlicher als „in ihre Häuser“.
- source_word: ἐπίλεξαι δὲ σεαυτῷ ἄνδρας ὀλίγους
  choice: Wähle dir aber einige wenige Männer aus
  rationale: „dir … aus“ gibt den medialen Sinn von ἐπίλεξαι wieder; „Männer“ bewahrt die nicht ausdrücklich auf Soldaten eingeengte Bezeichnung.
- source_word: οἵτινες ἔσονται μετὰ σοῦ
  choice: die bei dir bleiben sollen
  rationale: Wörtlich werden sie „bei dir sein“; im Zusammenhang des Wegschickens der übrigen Männer bringt „bleiben sollen“ die beabsichtigte Funktion natürlich zum Ausdruck.
- source_word: δεῦρο μετ’ ἐμοῦ εἰς Πτολεμαΐδα
  choice: Dann komm mit mir nach Ptolemaïs
  rationale: δεῦρο dient hier als Aufforderung zum Mitkommen; „dann“ stellt im Deutschen den Handlungsablauf klar, ohne eine zusätzliche inhaltliche Festlegung einzuführen.
- source_word: παραδώσω σοι αὐτήν
  choice: ich werde dir die Stadt übergeben
  rationale: Das feminine Pronomen bezieht sich auf Ptolemaïs. „Die Stadt“ macht den Bezug im Deutschen eindeutig, und „übergeben“ bezeichnet die Übertragung der Kontrolle.
- source_word: τὰ λοιπὰ ὀχυρώματα
  choice: die übrigen Festungen
  rationale: ὀχυρώματα bezeichnet befestigte militärische Orte; „Festungen“ ist präzise und geläufig.
- source_word: τὰς δυνάμεις τὰς πολλὰς
  choice: die zahlreichen Truppen
  rationale: δυνάμεις hat im militärischen Zusammenhang den Sinn von Streitkräften; „zahlreiche Truppen“ gibt zugleich den quantitativen Akzent von πολλὰς wieder.
- source_word: πάντας τοὺς ἐπὶ τῶν χρειῶν
  choice: alle, die für die Angelegenheiten zuständig sind
  rationale: Die griechische Wendung bezeichnet Personen, die über Aufgaben, Bedürfnisse oder Geschäfte gesetzt sind, ohne ihre Ämter näher zu bestimmen.
- source_word: ἐπιστρέψας ἀπελεύσομαι
  choice: Danach werde ich umkehren und fortgehen
  rationale: Die Übersetzung bewahrt die Abfolge von ἐπιστρέψας und ἀπελεύσομαι, ohne ein im Griechischen nicht genanntes Ziel der Umkehr oder Rückkehr einzusetzen.
- source_word: τούτου γὰρ χάριν πάρειμι
  choice: denn dazu bin ich gekommen
  rationale: Die idiomatische deutsche Formulierung gibt den Zweck der Anwesenheit wieder und entspricht dem präsentischen πάρειμι im gegebenen Zusammenhang.
