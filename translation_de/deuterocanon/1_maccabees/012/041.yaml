  text: And Jonathan went out to meet him with forty thousand chosen men for battle[a], and he came to Beth-shan.
translation:
  language: de
  text: Und Jonatan zog ihm mit vierzigtausend ausgewählten Männern entgegen, die für die Schlachtordnung bestimmt waren, und kam nach Bet-Schean.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zog
  rationale: Im militärischen Zusammenhang gibt „zog“ die erzählte Bewegung natürlich wieder, ohne die Aussage unnötig zu verstärken.
- source_word: εἰς ἀπάντησιν αὐτῷ
  choice: ihm entgegen
  rationale: Die Wendung bezeichnet das Hinausgehen beziehungsweise Ziehen, um jemandem zu begegnen; „ihm entgegen“ ist im Deutschen knapp und idiomatisch.
- source_word: ἐν τεσσεράκοντα χιλιάσιν ἀνδρῶν
  choice: mit vierzigtausend Männern
  rationale: ἐν bezeichnet hier die begleitende Streitmacht. „Männern“ bewahrt die ausdrückliche Wortwahl ἀνδρῶν, während der Kontext ihre militärische Funktion erkennen lässt.
- source_word: ἐπιλεγμέναις
  choice: ausgewählten
  rationale: Das Wort bezeichnet eigens ausgesuchte Männer; „ausgewählten“ ist präzise und in gehobenem modernem Deutsch natürlich.
- source_word: εἰς παρατάξιν
  choice: die für den Kampf aufgestellt waren
  rationale: παράταξις bezeichnet das Aufstellen beziehungsweise die Aufstellung in Schlachtordnung. Die Formulierung bewahrt sowohl den Kampfbezug als auch das konkrete Bild der Formation.
- source_word: ἦλθεν εἰς Βεθσάν
  choice: kam nach Bet-Schean
  rationale: „Kam nach“ folgt der Bewegungsangabe des Griechischen. „Bet-Schean“ ist eine im Deutschen geläufige Wiedergabe des Ortsnamens.
