- from: Und Jonatan zog ihm mit vierzigtausend ausgewählten Männern entgegen, die für den Kampf aufgestellt waren[a], und kam nach Bet-Schean.
  to: Und Jonatan zog ihm mit vierzigtausend ausgewählten Männern entgegen, die für die Schlachtordnung bestimmt waren, und kam nach Bet-Schean.
  rationale: Die Revision ersetzt die zuständliche Aussage „aufgestellt waren“ durch eine Zweckbestimmung und bewahrt damit die Nuance von εἰς παρατάξιν. Der übrige Wortlaut bleibt unverändert, einschließlich der natürlichen militärischen Bewegungsbeschreibung und der Namensform.
