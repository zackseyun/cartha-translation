base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/053.yaml
  text: And all the nations around them sought to wipe them out[a], for they said, “They have no man to rule and help them. Now then[c][b], let us make war against them and remove their memory from among men.”
translation:
  language: de
  text: 'Und alle Völker rings um sie suchten sie auszurotten[a], denn sie sagten: »Sie haben keinen Mann, der über sie herrscht und ihnen hilft[b]. Darum wollen wir sie jetzt bekriegen und die Erinnerung an sie unter den Menschen auslöschen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie vollständig zu vernichten“; das griechische Verb bezeichnet eine vollständige Beseitigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Sie haben keinen Mann, der herrscht und hilft“; möglich ist auch: „keinen Herrscher, der sie führt und ihnen hilft“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihr Andenken aus der Menschheit tilgen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησαν
  choice: suchten
  rationale: Das Aoristverb mit folgendem Infinitiv bezeichnet hier ein zielgerichtetes Streben; „suchten … auszurotten“ bewahrt die formale Struktur und die Absicht.
- source_word: πάντα τὰ ἔθνη τὰ κύκλῳ αὐτῶν
  choice: alle Völker rings um sie
  rationale: ἔθνη bezeichnet hier die umliegenden Völker; „Völker“ ist neutraler als „Heiden“ und „rings um sie“ gibt κύκλῳ natürlich wieder.
- source_word: ἐκτρῖψαι
  choice: auszurotten
  rationale: Das Verb bezeichnet vollständige Beseitigung oder Vernichtung. „Ausrotten“ bewahrt die starke Aussage im Deutschen.
- source_word: ἄνδρα ἄρχοντα
  choice: keinen Mann, der über sie herrscht
  rationale: Die ausdrücklich männliche Bezeichnung ἄνδρα bleibt erhalten; der Relativsatz gibt das Partizip ἄρχοντα in natürlichem Deutsch wieder.
- source_word: βοηθοῦντα
  choice: ihnen hilft
  rationale: Das mit ἄρχοντα koordinierte Partizip bezeichnet tätige Hilfe oder Beistand und wird knapp und verständlich wiedergegeben.
- source_word: πολεμήσωμεν
  choice: wollen wir sie jetzt bekriegen
  rationale: Der hortative Konjunktiv ruft zu kriegerischem Vorgehen auf. „Bekriegen“ ist idiomatisch und bewahrt den militärischen Sinn.
- source_word: ἐξαροῦμεν ἐξ ἀνθρώπων τὸ μνημόσυνον αὐτῶν
  choice: die Erinnerung an sie unter den Menschen auslöschen
  rationale: μνημόσυνον meint Erinnerung oder Gedenken; die Formulierung drückt die vollständige Tilgung ihres Andenkens aus. ἀνθρώπων ist hier generisch und wird im modernen Deutsch mit „Menschen“ wiedergegeben.
theological_decisions:
- issue: Geschlechtsspezifische und generische Personenbezeichnungen
  choice: „Mann“ für ἄνδρα, aber „Menschen“ für das generische ἀνθρώπων
  alternative: „Herrscher“ beziehungsweise „unter den Männern“
  rationale: ἄνδρα ist im Kontext ausdrücklich männlich und bleibt deshalb sichtbar. ἀνθρώπων bezeichnet dagegen die Menschheit allgemein; „Menschen“ gibt diesen generischen Umfang im heutigen Deutsch genauer wieder.
- issue: Art der fehlenden Führung
  choice: „der über sie herrscht und ihnen hilft“
  alternative: „der sie führt und ihnen beisteht“
  rationale: Die Wiedergabe erhält sowohl den Herrschaftsaspekt von ἄρχοντα als auch den Beistandsaspekt von βοηθοῦντα, ohne beide zu einem allgemeinen Begriff wie „Anführer“ zu verschmelzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt entschlossen und bedrohlich; die Parallelität von Herrschen und Helfen sowie die starke Auslöschungssprache des griechischen Textes werden bewahrt.
