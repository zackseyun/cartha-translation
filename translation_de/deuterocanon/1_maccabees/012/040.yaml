base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/040.yaml
  text: And he became afraid that Jonathan might not permit him and might make war against him[a], and he was seeking a way to seize him and kill him; and he set out and came to Beth-shan.
translation:
  language: de
  text: Und er fürchtete, Jonatan könnte ihm keine Erlaubnis geben und gegen ihn Krieg führen[a]. Er suchte nach einer Möglichkeit, ihn zu ergreifen und zu töten. Dann brach er auf und kam nach Bet-Schan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jonatan könnte ihn nicht erlauben/zulassen.“ Welche Handlung Jonatan ihm nicht erlauben würde, bleibt im Griechischen unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐλαβήθη
  choice: bekam Angst
  rationale: Das Verb bezeichnet hier Furcht oder Besorgnis; der Aorist wird als einsetzende Reaktion wiedergegeben, ohne einen an anderer Stelle möglichen Frömmigkeitssinn einzutragen.
- source_word: μὴ ποτε οὐκ ἐάσῃ αὐτὸν
  choice: könnte ihn nicht gewähren lassen
  rationale: Das griechische αὐτόν bezeichnet Tryphon als Objekt von ἐάσῃ, während die konkrete Handlung, die Jonatan nicht zulassen könnte, unausgesprochen bleibt. Die deutsche Wendung bewahrt diese Ellipse möglichst verständlich.
- source_word: πολεμήσῃ πρὸς αὐτόν
  choice: gegen ihn Krieg führen
  rationale: Die Formulierung wahrt den militärischen Gehalt des Verbs stärker als das allgemeinere „gegen ihn kämpfen“.
- source_word: ἐζήτει πόρον
  choice: suchte nach einer Möglichkeit
  rationale: πόρος kann Weg, Mittel oder Gelegenheit bezeichnen; im Zusammenhang geht es um eine praktikable Möglichkeit zur Ausführung des Anschlags.
- source_word: τοῦ συλλαβεῖν αὐτὸν τοῦ ἀποκτεῖναι
  choice: ihn zu ergreifen und zu töten
  rationale: Die beiden substantivierten Infinitive bezeichnen den Zweck. „Ergreifen“ vermeidet die bei „verhaften“ mitschwingende Vorstellung eines rechtmäßigen Verfahrens.
- source_word: ἀπάρας
  choice: brach auf
  rationale: Das Partizip bezeichnet den Aufbruch vor der Ankunft, ohne zwingend einen militärischen Lagerabbruch vorauszusetzen.
- source_word: Βεθσά
  choice: Bet-Schan
  rationale: Die griechische Ortsform wird mit dem im Deutschen üblichen biblischen Namen Bet-Schan wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die lange griechische Satzfolge ist zur besseren Verständlichkeit in drei Sätze gegliedert; die inhaltlichen Beziehungen bleiben erhalten. Die ungeklärte Ergänzung nach „lassen“ wird nicht stillschweigend festgelegt.
