revisions:
- from: Und er bekam Angst, Jonatan könnte ihn nicht gewähren lassen[a] und gegen ihn Krieg führen. Deshalb suchte er nach einer Möglichkeit, ihn zu ergreifen und zu töten. Dann brach er auf und kam nach Bet-Schan.
  to: Und er fürchtete, Jonatan könnte ihm keine Erlaubnis geben und gegen ihn Krieg führen[a]. Er suchte nach einer Möglichkeit, ihn zu ergreifen und zu töten. Dann brach er auf und kam nach Bet-Schan.
  rationale: Die Revision ersetzt die missverständliche Wendung „ihn gewähren lassen“ durch eine natürliche deutsche Formulierung, die das personale Objekt („ihm“) und die im Griechischen unausgesprochene Handlung bewahrt. Die Fußnote erläutert diese Ellipse. „Deshalb“ wird entfernt, damit keine über den Wortlaut hinausgehende Kausalverknüpfung entsteht.
