  source_fidelity: 'Der Sinn des griechischen Idioms περὶ ψυχῆς ἐστιν αὐτοῖς wird zutreffend wiedergegeben: Die Verfolger erkannten, dass sie selbst in akuter Lebensgefahr waren. „Als … sahen“ gibt das vorzeitige Aoristpartizip idiomatisch wieder; „kehrten sie um“ entspricht ἐπέστρεψαν im Kontext einer abgebrochenen Verfolgung. Die im Griechischen auffällige singularische Partizipform bei pluralischem Bezug verlangt im Deutschen keine künstliche Nachbildung.'
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und wahrt einen angemessen würdigen narrativen Registerton. „Für sie um Leben und Tod ging“ ist eine etablierte deutsche Wendung; die Vergangenheitsform fügt sich natürlich in die Erzählung ein.
  terminology: „Verfolger“ ist für οἱ διώκοντες präzise und kontextgerecht. „Leben“ für ψυχή vermeidet zu Recht die hier unpassende Lesart „Seele“. Die Fußnote erläutert die idiomatische Bedeutung, ohne eine theologische Deutung einzutragen.
