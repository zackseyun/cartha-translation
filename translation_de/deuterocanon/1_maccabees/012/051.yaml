  yaml_path: translation/deuterocanon/1_maccabees/012/051.yaml
  text: And when the pursuers saw that it was a matter of life and death for them[a], they turned back.
translation:
  language: de
  text: Als die Verfolger sahen, dass es für sie um Leben und Tod ging[a], kehrten sie um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich im Griechischen: „dass es für sie um das Leben geht“; gemeint ist, dass ihr Leben auf dem Spiel stand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Als … sahen
  rationale: Der Aoristpartizip wird im Erzählzusammenhang natürlich temporal wiedergegeben. Obwohl die überlieferte Form im Singular steht, bezieht sie sich syntaktisch auf das pluralische οἱ διώκοντες; die deutsche Übersetzung verwendet daher den Plural.
- source_word: οἱ διώκοντες
  choice: die Verfolger
  rationale: Das substantivierte Präsenspartizip bezeichnet die Gruppe, die die Fliehenden verfolgt; „die Verfolger“ ist knapp und im militärischen Erzählzusammenhang natürlich.
- source_word: ὅτι περὶ ψυχῆς ἐστιν αὐτοῖς
  choice: dass es für sie um Leben und Tod ging
  rationale: Die Wendung περὶ ψυχῆς bezeichnet eine Lage, in der das Leben auf dem Spiel steht. Die deutsche Redewendung gibt diesen Sinn klar und idiomatisch wieder.
- source_word: ψυχῆς
  choice: Leben
  rationale: ψυχή meint in dieser Wendung das leibliche Leben, nicht eine vom Körper unterschiedene Seele.
- source_word: ἐπέστρεψαν
  choice: kehrten sie um
  rationale: Im Zusammenhang einer Verfolgung bezeichnet das Verb die Umkehr beziehungsweise das Abbrechen der Verfolgung.
theological_decisions: []
