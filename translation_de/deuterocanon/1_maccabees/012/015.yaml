base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/015.yaml
  text: Therefore we continually remember you at all times[a], at the festivals and on the other appointed days, when we offer sacrifices and in our prayers[b], as it is right and fitting to remember brothers.
translation:
  language: de
  text: 'Darum gedenken wir euer zu jeder Zeit ohne Unterlass: bei den Festen und an den übrigen dazu bestimmten Tagen[a], bei den Opfern, die wir darbringen[b], und in unseren Gebeten, wie es recht und angemessen ist, der Brüder zu gedenken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an den übrigen gebührenden Tagen“; gemeint sind weitere für die Begehung bestimmte Tage.'
    reason: Erläutert die kultisch-kalendarische Bedeutung von καθηκούσαις ἡμέραις, ohne „vorgeschrieben“ zu stark festzulegen.
  - marker: b
    text: 'Oder: „an denen wir Opfer darbringen“. Der griechische Satzbau ist ungewöhnlich und kann die Opfer enger mit den zuvor genannten Tagen verbinden.'
    reason: Bewahrt die syntaktische Mehrdeutigkeit von ἐφʼ ὧν προσφέρομεν θυσίων.
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ ἀδιαλείπτως
  choice: zu jeder Zeit ohne Unterlass
  rationale: Gibt sowohl die umfassende Zeitangabe als auch die beharrliche Regelmäßigkeit des Gedenkens wieder und bewahrt die nachdrückliche Doppelung des Griechischen.
- source_word: ἑορταῖς
  choice: Festen
  rationale: Bezeichnet hier religiöse Festtage; „Feste“ ist im modernen Deutschen klar, natürlich und dem kultischen Zusammenhang angemessen.
- source_word: καθηκούσαις ἡμέραις
  choice: vorgeschriebenen Tagen
  rationale: καθήκω bezeichnet das, was gebührt oder ordnungsgemäß vorgesehen ist. Im Festkalender sind damit Tage gemeint, deren Begehung als vorgeschrieben oder angemessen gilt.
- source_word: μνημονεύομεν ὑμῶν
  choice: denken wir … an euch
  rationale: Natürliches modernes Deutsch, das sowohl das Erinnern als auch das liturgische Erwähnen bei Opfer und Gebet offenhält.
- source_word: ἐφʼ ὧν προσφέρομεν θυσίων
  choice: bei den Opfern, die wir darbringen
  rationale: Der ungewöhnliche griechische Satzbau lässt sich als Voranstellung beziehungsweise Attraktion des Relativpronomens zu θυσίων verstehen. Die Wiedergabe verbindet das Gedenken unmittelbar mit den dargebrachten Opfern.
- source_word: προσευχαῖς
  choice: Gebeten
  rationale: Entspricht dem Plural und verweist auf wiederkehrende liturgische Gebete.
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: wie es recht und angemessen ist
  rationale: Bewahrt die beiden Aspekte sittlicher Verpflichtung und passender, gebührender Praxis in idiomatischem Deutsch.
- source_word: ἀδελφῶν
  choice: Brüder
  rationale: Bewahrt die maskuline Mehrzahl und die in diesem diplomatisch-religiösen Zusammenhang gemeinte brüderliche Verbundenheit der angesprochenen Gemeinschaften.
theological_decisions:
- issue: Verwandtschaftsbezeichnung ἀδελφῶν
  choice: Brüder
  alternative: Verwandte; Brüder und Schwestern
  rationale: Das Wort dient hier als gemeinschaftliche beziehungsweise ethnisch-religiöse Verwandtschaftsbezeichnung. Da der Ausgangstext ausdrücklich die maskuline Mehrzahl verwendet und der Zusammenhang keine inklusive Erweiterung verlangt, bleibt „Brüder“ stehen.
- issue: Bezug von ἐφʼ ὧν im Opferzusammenhang
  choice: Das Gedenken geschieht bei den dargebrachten Opfern
  alternative: Die Opfer werden an den zuvor genannten Fest- und vorgeschriebenen Tagen dargebracht
  rationale: Die ungewöhnliche Konstruktion mit dem Genitiv θυσίων spricht für eine Relativsatzverbindung mit „Opfern“, doch ein zeitlicher Rückbezug auf die genannten Tage ist syntaktisch beziehungsweise inhaltlich möglich. Die Fußnote erhält diese Unsicherheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung „zu jeder Zeit ohne Unterlass“ erhält den Nachdruck des griechischen Ausdrucks. Kultische Begriffe werden klar, aber nicht konfessionell geprägt wiedergegeben.
