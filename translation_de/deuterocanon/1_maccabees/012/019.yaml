  text: Therefore we did not wish to trouble you and the rest of our allies and friends in these wars[a].
translation:
  language: de
  text: Darum wollten wir euch und unsere übrigen Verbündeten und Freunde in diesen Kriegen nicht belasten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… nicht behelligen“ oder „… nicht stören“. Das griechische Verb kann „stören“, „belästigen“ oder „jemandem etwas zumuten“ bedeuten; hier ist wahrscheinlich eine diplomatische oder militärische Belastung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἠβουλόμεθα
  choice: wollten wir … nicht
  rationale: Der Imperfekt von βούλομαι bezeichnet hier einen in der Vergangenheit bestehenden Willen beziehungsweise Entschluss; die deutsche Formulierung ist natürlich und bewahrt den bewussten Verzicht.
- source_word: οὖν
  choice: Darum
  rationale: Die Folgerung aus dem vorher Gesagten wird in klarem, modernem Deutsch ausgedrückt.
- source_word: παρενοχλεῖν
  choice: behelligen
  rationale: Das Verb kann stören, belästigen oder jemandem etwas zumuten bedeuten. „Behelligen“ passt zum diplomatisch-militärischen Zusammenhang, ohne persönliche Verärgerung oder offene Schikane zu unterstellen.
- source_word: ὑμῖν καὶ τοὺς λοιποὺς συμμάχους καὶ φίλους ἡμῶν
  choice: euch und unsere übrigen Verbündeten und Freunde
  rationale: Die Adressaten werden zusammen mit den weiteren Bündnispartnern und Freunden genannt. „Verbündete“ gibt den politisch-militärischen Sinn von σύμμαχοι wieder; „Freunde“ bewahrt die breitere, diplomatisch gefärbte Bezeichnung φίλοι.
- source_word: ἐν τοῖς πολέμοις τούτοις
  choice: in diesen Kriegen
  rationale: Die Wendung bezeichnet den Bereich beziehungsweise die Umstände der Belastung und bewahrt den Plural von πόλεμοι.
