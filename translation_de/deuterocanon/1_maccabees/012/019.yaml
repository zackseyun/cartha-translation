translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Behelligen“ hält die diplomatische Zurückhaltung des Satzes fest; die Fußnote macht die mögliche Bedeutung „belasten“ transparent. Der etwas auffällige Kasuswechsel im Griechischen wird im Deutschen nicht eigens markiert, da „euch“ formal sowohl Dativ als auch Akkusativ sein kann und die koordinierte Aussage klar bleibt.
