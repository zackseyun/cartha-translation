base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/044.yaml
  text: And he said to Jonathan[a], “Why have you cut down all this people, when no war is pressing upon us?”
translation:
  language: de
  text: 'Und er sagte zu Jonatan[a]: »Warum hast du dieses ganze Volk niedergeschlagen, da uns kein Krieg bedroht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch etwa: »Warum hast du dieses ganze Volk niedergeschlagen, da uns kein Krieg gegenwärtig ist?« Der griechische Wortlaut ist an dieser Stelle ungewöhnlich abrupt. Das Verb kann wörtlich auch „hauen“ oder „abschneiden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνα τί
  choice: Warum
  rationale: Die überlieferte griechische Frageform ist auffällig und abrupt. Im Zusammenhang fragt sie nach dem Grund; »Warum« gibt diese Funktion verständlich wieder, ohne die sprachliche Unebenheit künstlich nachzuahmen.
- source_word: ἔκοψας
  choice: hast du … niedergeschlagen
  rationale: Der Aorist von κόπτω bedeutet wörtlich »schlagen, hauen, abschneiden« und kann bei Menschen das Niederhauen oder Niederschlagen bezeichnen. »Niedergeschlagen« bewahrt das kräftige Bild, ohne ausdrücklich vollständige Vernichtung zu behaupten.
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: dieses ganze Volk
  rationale: λαός bezeichnet gewöhnlich ein Volk oder eine Volksmenge, nicht eigens ein Heer. Die Formulierung gibt die Gesamtheit und das Demonstrativpronomen eng am Griechischen wieder.
- source_word: πολέμου μὴ ἐνεστῶτος ἡμῖν
  choice: obwohl uns kein Krieg bedrängt
  rationale: Das Partizip von ἐνίστημι kann etwas Gegenwärtiges, Herangetretenes oder Bedrängendes bezeichnen. »Uns kein Krieg bedrängt« wahrt das Bild eines gegenwärtig auf ihnen lastenden Krieges und klingt im Deutschen natürlich.
- source_word: τῷ Ἰωναθάν
  choice: zu Jonatan
  rationale: Der Dativ bezeichnet den Adressaten. »Jonatan« ist die geläufige deutsche Namensform.
