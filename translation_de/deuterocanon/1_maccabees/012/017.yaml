lexical_decisions:
- source_word: ἡμᾶς
  choice: uns
  rationale: Direktes Objekt in der ersten Person Plural.
- source_word: δὲ
  choice: Doch
  rationale: Gibt den kontrastierenden Anschluss an den vorausgehenden Zusammenhang natürlich und würdevoll wieder.
- source_word: ἐκύκλωσαν
  choice: umgaben
  rationale: Bewahrt das Bild des Ringsum-Eingeschlossenseins und gibt den griechischen Aorist ohne unnötige Festlegung auf einen bis in die Gegenwart reichenden Zustand wieder.
- source_word: πολλαὶ θλίψεις
  choice: viele Bedrängnisse
  rationale: „Bedrängnisse“ erfasst äußeren Druck, Not und Bedrückung, ohne eine spätere theologische Fachbedeutung aufzudrängen.
- source_word: καὶ πόλεμοι πολλοί
  choice: und viele Kriege
  rationale: πόλεμοι bezeichnet Kriege beziehungsweise bewaffnete Konflikte, nicht bloß einzelne Schlachten; die Wiederholung von „viele“ erhält die Betonung des Griechischen.
