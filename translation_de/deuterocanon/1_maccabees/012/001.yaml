  - severity: low
    issue: „mit den Römern“ statt „mit ihnen“
    rationale: αὐτούς nimmt auf die Römer Bezug, ist im griechischen Text aber ein Pronomen. „Mit ihnen“ ist im Deutschen eindeutig, da Rom unmittelbar vorausgeht, und bildet den Wortlaut genauer ab.
