base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/001.yaml
  text: And when Jonathan saw that the time was favorable to him[b][a], he chose men and sent them to Rome to establish and renew the friendship with them.
translation:
  language: de
  text: Und als Jonatan sah, dass die Umstände für ihn günstig waren,[a] wählte er Männer aus und sandte sie nach Rom, um die Freundschaft mit ihnen[b] zu begründen und zu erneuern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dass die Zeit mit ihm zusammenwirkte“. Gemeint ist, dass die damalige Lage oder Gelegenheit Jonatan begünstigte.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Freundschaft“ sind hier wahrscheinlich offizielle diplomatische Beziehungen gemeint, nicht nur persönliche Verbundenheit.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν
  choice: als … sah
  rationale: Das Aoristpartizip bezeichnet den zeitlichen Umstand der folgenden Handlungen; die finite deutsche Konstruktion ist natürlich und bewahrt diesen Zusammenhang.
- source_word: ὁ καιρὸς αὐτῷ συνεργεῖ
  choice: dass die Umstände für ihn günstig waren
  rationale: καιρός bezeichnet hier die günstige Gelegenheit oder Lage, während συνεργεῖ wörtlich ein Mitwirken ausdrückt. Die idiomatische Wiedergabe vermittelt, dass die damalige Lage Jonatan zugutekam.
- source_word: ἐπέλεξεν ἄνδρας
  choice: wählte er Männer aus
  rationale: Die Formulierung gibt sowohl den Auswahlvorgang als auch das ausdrücklich männliche Substantiv ἄνδρας wieder.
- source_word: ἀπέστειλεν εἰς Ῥώμην
  choice: sandte sie nach Rom
  rationale: Eine direkte und im diplomatischen Zusammenhang angemessene Wiedergabe.
- source_word: στῆσαι
  choice: zu festigen
  rationale: Das Verb bedeutet grundlegend, etwas aufzustellen oder festen Bestand gewinnen zu lassen. Da die bereits bestehende Freundschaft zugleich erneuert werden soll, passt „festigen“ besser als „begründen“.
- source_word: ἀνανεῶσαι
  choice: zu erneuern
  rationale: Das Verb bezeichnet, etwas erneut frisch oder wirksam zu machen; „erneuern“ ist die übliche diplomatische Entsprechung.
- source_word: τὴν πρὸς αὐτοὺς φιλίαν
  choice: die Freundschaft mit den Römern
  rationale: φιλία bleibt als „Freundschaft“ erkennbar, während das Pronomen αὐτούς zur Klarheit mit seinem Bezugswort „den Römern“ wiedergegeben wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Handlungsablauf, gibt die idiomatische Wendung über den günstigen καιρός jedoch natürlich wieder. Die diplomatische Bedeutung von „Freundschaft“ wird nicht in den Haupttext eingetragen, sondern in einer Fußnote erläutert.
