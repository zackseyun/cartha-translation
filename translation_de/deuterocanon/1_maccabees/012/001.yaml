revisions:
- from: Und als Jonatan sah, dass die Umstände für ihn günstig waren,[a] wählte er Männer aus und sandte sie nach Rom, um die Freundschaft mit den Römern[b] zu festigen und zu erneuern.
  to: Und als Jonatan sah, dass die Umstände für ihn günstig waren,[a] wählte er Männer aus und sandte sie nach Rom, um die Freundschaft mit ihnen[b] zu begründen und zu erneuern.
  rationale: Die Revision ersetzt bei στῆσαι das interpretierendere „festigen“ durch „begründen“, um die Bedeutung des griechischen Verbs neben „erneuern“ sichtbar zu halten. „Mit ihnen“ bewahrt die pronominale Form des Grundtexts, ohne die Referenz auf Rom unklar zu machen. Fußnotenanker und Fußnoten bleiben vollständig und passend erhalten.
