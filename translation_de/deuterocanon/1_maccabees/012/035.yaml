  text: Jonatan kehrte zurück, rief die Ältesten des Volkes zusammen und beriet sich mit ihnen darüber, in Judäa Festungen zu bauen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: kehrte zurück
  rationale: Das Verb bezeichnet hier die körperliche Rückkehr; die deutsche Wendung ist natürlich und vermeidet eine religiöse Deutung im Sinn von Umkehr.
- source_word: ἐξεκκλησίασεν
  choice: rief … zusammen
  rationale: Die Form bezeichnet das Einberufen oder Versammeln einer Gruppe. „Rief … zusammen“ gibt den gezielten, öffentlichen Vorgang im modernen Deutsch klar wieder.
- source_word: πρεσβυτέρους τοῦ λαοῦ
  choice: die Ältesten des Volkes
  rationale: Gemeint sind anerkannte führende Vertreter des Volkes, nicht lediglich ältere Männer.
- source_word: ἐβουλεύσατο μετ’ αὐτῶν
  choice: beriet sich mit ihnen
  rationale: Die mediale Form drückt gemeinsames Beraten beziehungsweise Rücksprache aus; diese Wendung bewahrt den gegenseitigen Charakter.
- source_word: οἰκοδομῆσαι
  choice: zu bauen
  rationale: Der Infinitiv nennt den Inhalt beziehungsweise das Ziel der Beratung; „bauen“ ist präzise und idiomatisch.
- source_word: ὀχυρώματα
  choice: Festungen
  rationale: Das Substantiv bezeichnet befestigte Verteidigungsanlagen oder befestigte Plätze. „Festungen“ ist konkret und im Kontext natürlich.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: in Judäa
  rationale: Die Präpositionalphrase bezeichnet das Gebiet, in dem die Festungen errichtet werden sollten; „Judäa“ ist die übliche deutsche Namensform.
