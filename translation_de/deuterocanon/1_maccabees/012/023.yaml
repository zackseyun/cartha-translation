base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/023.yaml
  text: 'And we also write back to you: Your livestock and your possessions are ours[a], and ours are yours[c][b]. Therefore we are giving orders that they report this to you accordingly.'
translation:
  language: de
  text: 'Auch wir schreiben euch zurück: Euer Vieh und euer Besitz gehören uns, und was uns gehört, gehört euch.[a] Darum weisen wir an, dass sie euch dies ebenfalls mitteilen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Euer Vieh und euer Besitz sind unser, und das Unsere ist euer.“ Dies ist eine diplomatische Formel für Bündnistreue und gegenseitige Verbundenheit; sie hebt rechtliche Eigentumsverhältnisse nicht unbedingt auf.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „damit sie euch dasselbe berichten“ beziehungsweise „damit sie euch in diesem Sinne unterrichten“. Im Griechischen bleibt unausgesprochen, was genau mitgeteilt werden soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιγράφομεν
  choice: schreiben … zurück
  rationale: Im brieflichen Zusammenhang bezeichnet das Verb eine schriftliche Antwort; die Wiedergabe bewahrt den wechselseitigen Sinn und klingt im modernen Deutschen natürlich.
- source_word: κτήνη
  choice: Vieh
  rationale: Gemeint sind domestizierte Nutztiere als Vermögensbestand; „Vieh“ ist knapp und sachgerecht.
- source_word: ὕπαρξις
  choice: Besitz
  rationale: Das Wort bezeichnet hier den materiellen Besitz beziehungsweise das vorhandene Vermögen und ergänzt „Vieh“ als weiter gefassten Begriff.
- source_word: ἐντελλόμεθα
  choice: geben wir Anweisung
  rationale: Die Wendung erhält den amtlich-diplomatischen Ton, ohne unnötig schroff oder altertümlich zu wirken.
- source_word: ἀπαγγείλωσιν
  choice: mitzuteilen
  rationale: Das Verb bedeutet, eine Nachricht zu überbringen oder Bericht zu erstatten. Das unbestimmte Subjekt der dritten Person Plural bleibt im deutschen Infinitivsatz unausgedrückt.
- source_word: κατὰ τὰ αὐτά
  choice: entsprechend
  rationale: Die Formulierung verweist auf das zuvor Gesagte und kann idiomatisch „entsprechend“ beziehungsweise „in diesem Sinne“ bedeuten.
