    issue: „entsprechend“ ist für κατὰ τὰ αὐτά weniger präzise als „ebenfalls“.
    rationale: Die Wendung bezeichnet hier, dass die Empfänger dieselbe Mitteilung ebenfalls erhalten sollen. „Ebenfalls“ macht diesen Bezug im Deutschen unmittelbar deutlich.
