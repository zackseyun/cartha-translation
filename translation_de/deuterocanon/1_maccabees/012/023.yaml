  source_fidelity: 'Die Besitzformel ist sachgerecht und idiomatisch wiedergegeben. Im zweiten Satz sollte jedoch das im griechischen Verb ἀπαγγείλωσιν enthaltene Subjekt der dritten Person Plural erhalten bleiben: Der Infinitivsatz „euch dies ... mitzuteilen“ lässt im Deutschen offen bzw. missverständlich werden, wer die Mitteilung ausführen soll. κατὰ τὰ αὐτά ist hier treffender mit „ebenfalls“ wiederzugeben.'
  naturalness: Der Text hat einen angemessen würdigen, modernen diplomatischen Ton. „Wir weisen an, dass sie ... mitteilen“ ist klarer und natürlicher als „wir geben Anweisung, ... mitzuteilen“.
  terminology: „Vieh“, „Besitz“ und „gehören“ geben κτήνη, ὕπαρξις und die wechselseitige Besitzformel passend wieder. Die Fußnote erklärt zutreffend, dass die Formel nicht zwingend eine Aufhebung rechtlichen Eigentums bezeichnet.
