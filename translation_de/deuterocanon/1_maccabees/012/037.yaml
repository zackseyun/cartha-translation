  text: And they gathered to build[a], and the wall of the wadi on the east side fell[b], and he repaired what is called Chaphenatha.
translation:
  language: de
  text: Und sie kamen zusammen, um zu bauen. Ein Teil der Mauer am Wildbachbett auf der Ostseite stürzte ein,[a] und er setzte das, was Chaphenatha genannt wird, instand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung ist stark verkürzt. χείμαρρος kann einen saisonalen Wasserlauf, dessen Bett oder eine Schlucht bezeichnen; auch die genaue Zuordnung von „auf der Ostseite“ bleibt offen.
    reason: lexical_alternative
  - marker: b
    text: Chaphenatha ist ein transkribierter Eigenname. Der griechische Text sagt nicht genauer, ob damit ein Ort oder ein bestimmtes Bauwerk gemeint ist.
    reason: cultural_note
lexical_decisions:
- source_word: συνήχθησαν
  choice: sie kamen zusammen
  rationale: 'Die Aoristform wird hier intransitiv gebraucht: Die Gruppe versammelte sich zu einem bestimmten Zweck. „Kamen zusammen“ ist natürliches modernes Deutsch.'
- source_word: τοῦ οἰκοδομεῖν
  choice: um zu bauen
  rationale: Der artikulierte Infinitiv mit τοῦ bezeichnet hier den Zweck. „Zu bauen“ bleibt bei der nicht näher bestimmten Aussage des Griechischen und ergänzt nicht „wieder“.
- source_word: ἔπεσεν τοῦ τείχους
  choice: ein Teil der Mauer … stürzte ein
  rationale: 'Der Genitiv τοῦ τείχους lässt sich partitiv verstehen: Ein nicht näher bezeichneter Abschnitt der Mauer fiel. Bei einer Mauer gibt „stürzte ein“ den Vorgang im Deutschen idiomatisch wieder.'
- source_word: τοῦ χειμάρρου
  choice: am Wildbachbett
  rationale: χείμαρρος kann einen saisonalen Wasserlauf, sein Bett oder die dazugehörige Schlucht bezeichnen. „Wildbachbett“ macht den landschaftlichen Bezug verständlich, ohne einen ständig Wasser führenden Bach vorauszusetzen.
- source_word: τοῦ ἐξ ἀπηλιώτου
  choice: auf der Ostseite
  rationale: ἀπηλιώτης bezeichnet den Osten beziehungsweise den Ostwind. Die Wendung ist räumlich komprimiert; „auf der Ostseite“ gibt die wahrscheinlich gemeinte Lage wieder.
- source_word: ἐπεσκεύασεν
  choice: setzte … instand
  rationale: Das Verb bezeichnet Reparieren oder Wiederherstellen. „Instand setzen“ vermeidet die stärkere, nicht ausdrücklich belegte Aussage, etwas vollständig neu aufgebaut zu haben.
- source_word: τὸ καλούμενον Χαφεναθά
  choice: das sogenannte Chafenata
  rationale: Der substantivierte neutrale Ausdruck nennt weder die Art des Ortes noch die des Bauwerks. „Das sogenannte“ bewahrt diese Unbestimmtheit; Χαφεναθά wird als Eigenname transliteriert.
