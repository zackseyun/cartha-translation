  text: And Jonathan turned aside against the Arabs called the Zabadeans, and struck them, and took their spoils.
translation:
  language: de
  text: Und Jonatan wandte sich gegen die Araber, die Zabadaier genannt wurden, schlug sie und nahm ihre Beute an sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: wandte sich gegen
  rationale: Das Verb bezeichnet ein Abwenden oder Einschwenken. Im militärischen Zusammenhang drückt „wandte sich gegen“ natürlich aus, dass Jonatan seine Bewegung auf einen Angriff gegen diese Gruppe richtete, ohne das stärker deutende „zog in den Kampf“ einzutragen.
- source_word: Ἀράβας
  choice: Araber
  rationale: Die moderne deutsche Bezeichnung gibt den Akkusativ Plural der Volks- beziehungsweise Gruppenbezeichnung unmittelbar wieder.
- source_word: τοὺς καλουμένους
  choice: die … genannt wurden
  rationale: Die passive Formulierung bildet das griechische Partizip präzise und in natürlichem Deutsch ab.
- source_word: Ζαβαδαίους
  choice: Zabadaier
  rationale: Die Form ist eine lesbare deutsche Wiedergabe des griechischen Gruppen- oder Volksnamens Ζαβαδαῖοι.
- source_word: ἐπάταξεν
  choice: schlug
  rationale: „Schlug“ bewahrt die direkte Bedeutung des Verbs im militärischen Kontext. „Besiegte“ würde den Ausgang ausdrücklicher festlegen, als es das einzelne griechische Verb verlangt.
- source_word: σκῦλα
  choice: Beute
  rationale: „Beute“ ist die geläufige moderne deutsche Bezeichnung für im Krieg erbeutete Güter und passt würdig in den Erzählstil.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die knappe Reihung der drei Handlungen im griechischen Text bleibt erhalten; „an sich“ macht die deutsche Wendung „Beute nehmen“ idiomatisch, ohne den Sinn zu erweitern.
