base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/036.yaml
  text: and to fortify the walls of Jerusalem[a], and to raise a great barrier between the citadel and the city so as to separate it from the city, so that it might stand by itself, in order that they might neither buy nor sell.
translation:
  language: de
  text: und die Mauern Jerusalems weiter zu befestigen und zwischen der Zitadelle[a] und der Stadt eine hohe Barriere zu errichten, um sie von der Stadt abzutrennen, damit sie für sich allein wäre und dort weder gekauft noch verkauft werden könnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Akra«, die befestigte Hochburg in Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφυῶσαι
  choice: weiter zu befestigen
  rationale: Das seltene Verb bezeichnet hier wahrscheinlich eine zusätzliche Verstärkung oder den Ausbau der Verteidigungsanlagen. »Weiter zu befestigen« gibt diesen Gedanken wieder, ohne eine bestimmte Bautechnik vorauszusetzen.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: die Mauern Jerusalems
  rationale: τείχη bezeichnet unmittelbar die Stadt- beziehungsweise Befestigungsmauern; der Genitiv wird im Deutschen natürlich mit »Jerusalems« wiedergegeben.
- source_word: ὑψῶσαι ὕψος μέγα
  choice: eine hohe Barriere zu errichten
  rationale: Wörtlich steht eine betonte Wendung wie »eine große Höhe aufrichten«. Im Zusammenhang ist eine hohe Trennanlage gemeint; »Barriere« wahrt, anders als »Mauer«, dass das griechische Substantiv die Bauart nicht ausdrücklich nennt.
- source_word: ἄκρας
  choice: der Zitadelle
  rationale: ἄκρα bezeichnet hier die befestigte Hochburg in Jerusalem. »Zitadelle« ist im Haupttext verständlich; die historische Bezeichnung »Akra« wird in der Fußnote dokumentiert.
- source_word: εἰς τὸ διαχωρίσαι αὐτὴν τῆς πόλεως
  choice: um sie von der Stadt abzutrennen
  rationale: Die Konstruktion bezeichnet einen Zweck; das feminine Pronomen bezieht sich am natürlichsten auf die ebenfalls feminine ἄκρα, die Zitadelle.
- source_word: κατὰ μόνας
  choice: für sich allein
  rationale: Die Wendung hebt die beabsichtigte räumliche und wirtschaftliche Isolierung der Zitadelle hervor.
- source_word: ὅπως μήτε ἀγοράζωσιν μήτε πωλῶσιν
  choice: sodass die Menschen dort weder kaufen noch verkaufen könnten
  rationale: Das griechische Verb hat ein unausgesprochenes pluralisches Subjekt. »Die Menschen dort« macht den Bezug auf die Personen in der isolierten Zitadelle verständlich, ohne eine genauere Gruppe festzulegen.
theological_decisions:
- issue: Historische Bezeichnung ἄκρα
  choice: Im Haupttext funktional als »Zitadelle« wiedergegeben
  alternative: »Akra« oder »Festung«
  rationale: Der Ausdruck ist historisch spezifisch, aber nicht lehrmäßig strittig. »Zitadelle« ist für heutige Leser unmittelbar verständlich; »Akra« bleibt als fachsprachliche Alternative in der Fußnote erhalten.
- issue: Ungenanntes Subjekt beim Kaufen und Verkaufen
  choice: Neutral als »die Menschen dort« verdeutlicht
  alternative: 'Wörtlicher und mehrdeutiger: »damit sie weder kauften noch verkauften«'
  rationale: Der griechische Plural meint die in der Zitadelle befindlichen Personen, benennt sie aber nicht näher. Die Übersetzung vermeidet deshalb eine historische oder theologische Präzisierung ihrer Identität.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang mit »und« bleibt erhalten, weil der Vers syntaktisch an den vorherigen Kontext anschließt. Die ungewöhnliche griechische Formulierung ὑψῶσαι ὕψος μέγα wird sinngemäß, aber ohne die nicht ausdrücklich genannte Bauart »Mauer« wiedergegeben.
