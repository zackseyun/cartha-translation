  text: For he heard that they intended to hand over the stronghold to those on Demetrius's side, and he stationed a garrison there so that they might guard it.
translation:
  language: de
  text: Denn er hatte gehört, dass sie die Festung den Anhängern des Demetrius übergeben wollten. Deshalb stationierte er dort eine Besatzung, damit deren Soldaten die Festung bewachten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: er hatte gehört
  rationale: Der Aorist nennt den vorausliegenden Anlass für die anschließende Maßnahme. Das deutsche Plusquamperfekt macht diese zeitliche Beziehung im Zusammenhang natürlich deutlich, ohne den Sinn zu erweitern.
- source_word: βούλονται
  choice: sie ... übergeben wollten
  rationale: βούλομαι bezeichnet hier Absicht oder Vorhaben. „Wollten“ ist idiomatisches modernes Deutsch und lässt offen, wie weit der Plan bereits gediehen war.
- source_word: τὸ ὀχύρωμα
  choice: die Festung
  rationale: ὀχύρωμα bezeichnet einen befestigten Ort oder eine Verteidigungsanlage. „Festung“ ist im militärischen Kontext klar und geläufig.
- source_word: παραδοῦναι
  choice: übergeben
  rationale: Das Verb bezeichnet die Übertragung der Kontrolle an eine andere Partei. „Übergeben“ bildet dies neutraler ab als das stärker deutende „ausliefern“ oder „kapitulieren“.
- source_word: τοῖς παρὰ Δημητρίου
  choice: den Anhängern des Demetrius
  rationale: Die Wendung bezeichnet die mit Demetrius verbundenen beziehungsweise auf seiner Seite stehenden Personen, ohne sie ausdrücklich auf Soldaten zu beschränken.
- source_word: ἔθετο
  choice: stationierte
  rationale: In Verbindung mit φρουράν bedeutet das Verb, eine Wach- oder Truppeneinheit an einem Ort einzusetzen. „Stationierte“ ist die natürliche militärische Wiedergabe.
- source_word: φρουράν
  choice: eine Besatzung
  rationale: φρουρά bezeichnet hier eine zum Schutz zurückgelassene militärische Einheit. „Besatzung“ passt idiomatisch zu einer Festung und wahrt den kollektiven Sinn.
- source_word: ὅπως φυλάσσωσιν αὐτήν
  choice: damit sie die Festung bewachte
  rationale: ὅπως mit Konjunktiv bezeichnet den Zweck. Das singularische „sie“ greift die grammatisch feminine Kollektivbezeichnung „Besatzung“ auf; die Wiederholung von „die Festung“ vermeidet eine mögliche Verwechslung der Pronomen.
