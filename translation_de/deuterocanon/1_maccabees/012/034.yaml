translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärisch-politischer Terminologie. Die griechische kausale Verknüpfung wird durch „Denn“ bewahrt; die zweite Satzverbindung wird zur natürlichen deutschen Gliederung mit „Deshalb“ verdeutlicht. Keine Fußnoten erforderlich.
