  naturalness: Der Satz ist insgesamt verständlich und dem diplomatischen Register angemessen. „Viele Zeiträume“ wirkt jedoch technisch, und die elliptische Schlussformulierung ist im heutigen Standarddeutsch zu holprig. „Etwas zu senden“ bewahrt die offene Objektstelle und bleibt natürlich.
  terminology: „Brüderliche Verbundenheit und Freundschaft“ gibt ἀδελφότης καὶ φιλία sachgerecht und ohne konfessionelle Überladung wieder. „Von euch entfremdet werden“ gibt die relationale passive Form angemessen wieder.
