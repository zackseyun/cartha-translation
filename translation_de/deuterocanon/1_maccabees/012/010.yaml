base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/010.yaml
  text: We have tried to renew the brotherhood and friendship with you by sending word[a], so that we might not become estranged from you; for many times have passed since you sent to us.
translation:
  language: de
  text: Wir haben uns bemüht, etwas zu euch zu senden, um die brüderliche Verbundenheit und Freundschaft mit euch zu erneuern, damit wir nicht von euch entfremdet werden. Denn viel Zeit ist vergangen, seit ihr etwas zu uns gesandt habt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische lässt offen, wen oder was sie sandten; möglich ist auch: „seit ihr uns eine Nachricht geschickt habt“.'
    reason: Die Leerstelle beim Verb „senden“ ist im Ausgangstext echt und sollte nicht stillschweigend auf eine Nachricht oder auf Boten festgelegt werden.
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: Wir haben uns bemüht
  rationale: Die Form bezeichnet einen unternommenen Versuch beziehungsweise ein ernsthaftes Bemühen, ohne den Erfolg ausdrücklich festzustellen.
- source_word: ἀποστεῖλαι
  choice: durch eine Botschaft
  rationale: Das Verb bedeutet „senden“. Im diplomatischen Zusammenhang ist eine Mitteilung gemeint; die Wiedergabe macht den kommunikativen Vorgang idiomatisch deutlich, ohne einen bestimmten Boten festzulegen.
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: die brüderliche Verbundenheit und Freundschaft mit euch
  rationale: „Brüderliche Verbundenheit“ gibt ἀδελφότης im diplomatischen Beziehungskontext natürlicher wieder als das institutionell klingende „Bruderschaft“; φιλία wird unmittelbar mit „Freundschaft“ übersetzt.
- source_word: ἀνανεώσασθαι
  choice: zu erneuern
  rationale: Das Verb bezeichnet die Erneuerung einer bereits bestehenden Beziehung.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: damit wir euch nicht fremd werden
  rationale: Die Zweckkonstruktion und die relationale Bedeutung des Fremd- beziehungsweise Entfremdetwerdens bleiben erhalten.
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: Denn viele Zeiträume sind vergangen
  rationale: Die Wiedergabe bewahrt den Plural und versteht καιροί allgemein als Zeitabschnitte, nicht zwingend als Jahreszeiten.
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: seit ihr zu uns gesandt habt
  rationale: Die knappe Formulierung bewahrt, dass das Griechische nicht ausdrücklich sagt, wen oder was die Adressaten sandten.
