  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. Die örtlichen Adressaten werden zur Auflösung der gedrängten griechischen Pronomen ausdrücklich benannt; die Fußnoten bewahren die möglichen Nuancen von κατὰ τόπον und προπέμπω.
