  text: And they gave them letters to the people in each place[b][a], so that they might send them on to the land of Judah in peace.
translation:
  language: de
  text: Und sie gaben ihnen Briefe an die Leute an jedem Ort[a], damit diese sie in Frieden ins Land Juda weitergeleiten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Ort für Ort«; gemeint sind Schreiben an die jeweiligen Leute oder Amtsträger entlang des Reisewegs.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »weiterbegleiten«; das griechische Verb kann auch bedeuten, Reisende zu begleiten und ihnen bei der Weiterreise zu helfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν
  choice: sie gaben
  rationale: Die schlichte Vergangenheitsform gibt δίδωμι im erzählenden Zusammenhang direkt wieder.
- source_word: ἐπιστολὰς
  choice: Briefe
  rationale: ἐπιστολή bezeichnet gewöhnlich einen Brief beziehungsweise ein schriftliches Mitteilungsschreiben.
- source_word: αὐτοῖς ... πρὸς αὐτοὺς
  choice: ihnen ... an die Leute
  rationale: Die gedrängte Folge der Pronomen unterscheidet die Reisenden als Empfänger der ausgehändigten Briefe von den örtlichen Adressaten; die Verdeutlichung vermeidet im Deutschen ein missverständliches doppeltes »ihnen«.
- source_word: κατὰ τόπον
  choice: in den einzelnen Orten
  rationale: 'Die Wendung hat distributiven Sinn: Ort für Ort beziehungsweise an den jeweiligen Stationen des Reisewegs.'
- source_word: ὅπως
  choice: damit
  rationale: »Damit« bewahrt klar den finalen Sinn der Konjunktion.
- source_word: προπέμπωσιν
  choice: weitergeleiteten
  rationale: Das Verb kann das Weiterschicken, Begleiten oder unterstützende Geleit von Reisenden bezeichnen. »Weiterleiten« hält diese Bandbreite im Reisekontext weitgehend offen.
- source_word: εἰς γῆν Ἰούδα
  choice: bis ins Land Juda
  rationale: εἰς bezeichnet hier das Ziel der Reise; »Land Juda« folgt der griechischen Formulierung näher als das geografisch konventionellere »Judäa«.
- source_word: μετʼ εἰρήνης
  choice: in Frieden
  rationale: Die wörtliche Wendung lässt im Reisekontext zugleich eine sichere und ungehinderte Ankunft anklingen.
theological_decisions: []
