revisions:
- from: Und sie gaben ihnen Briefe an die Leute in den einzelnen Orten[a], damit diese sie in Frieden bis ins Land Juda weitergeleiteten.[b]
  to: Und sie gaben ihnen Briefe an die Leute an jedem Ort[a], damit diese sie in Frieden ins Land Juda weitergeleiten.[b]
  rationale: Die Revision behebt die grammatisch notwendige Verbform, formuliert die distributive Ortsangabe idiomatischer und gibt die bloße Zielrichtung von εἰς ohne die zusätzliche Nuance von »bis« wieder. Die Fußnoten bleiben inhaltlich erhalten; die zweite wird an die verwendete Infinitivform angepasst.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Bedeutungen zutreffend wieder: Briefe werden den Reisenden für örtliche Empfänger mitgegeben, damit diese die Reisenden friedlich in das Land Juda weiterbefördern. »In Frieden« bewahrt μετʼ εἰρήνης angemessen. »Bis ins« ist jedoch gegenüber εἰς unnötig stärker, und die Verbform ist grammatisch fehlerhaft.'
  naturalness: »Leute in den einzelnen Orten« ist verständlich, aber »Leute an jedem Ort« ist im modernen Standarddeutsch idiomatischer. Nach »damit« muss »weitergeleiten« stehen, nicht »weitergeleiteten«.
  terminology: »Briefe«, »Land Juda« und »in Frieden« sind passend. »Weitergeleiten« kann die Bedeutung von προπέμπωσιν als Weiterbeförderung umfassen; die Fußnote sichert die mögliche Nuance des Begleitens.
  issues:
