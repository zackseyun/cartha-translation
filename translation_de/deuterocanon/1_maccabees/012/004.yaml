    issue: Falsche Verbform nach »damit«
    rationale: »Damit diese sie … weitergeleiteten« ist grammatisch nicht möglich. Der finale Nebensatz verlangt hier den Infinitiv »weitergeleiten« am Satzende.
  - severity: low
    issue: »bis ins Land Juda« verstärkt die Zielangabe
    rationale: εἰς γῆν Ἰούδα bezeichnet schlicht das Reiseziel. »Ins Land Juda« ist genauer und vermeidet die zusätzliche Endpunktnuance von »bis«.
  - severity: low
    issue: Unidiomatische Ortsformulierung
    rationale: »an die Leute an jedem Ort« drückt den distributiven Sinn von κατὰ τόπον natürlicher aus als »in den einzelnen Orten«.
