  text: And he sent scouts into their camp[a], and they returned and reported to him, “Thus they are arraying themselves to fall upon them by night.”
translation:
  language: de
  text: 'Und er schickte Kundschafter in ihr Lager. Sie kehrten zurück und meldeten ihm: „So stellen sie sich auf[a], um sie in der Nacht anzugreifen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So sind sie aufgestellt, um sie in der Nacht anzugreifen.“ Das griechische Wort kann das Aufstellen oder Formieren von Truppen bezeichnen, nicht nur die Vorbereitung eines Angriffs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Der narrative Aorist von ἀποστέλλω wird im modernen Deutschen natürlich und präzise mit „schickte“ wiedergegeben.
- source_word: κατασκόπους
  choice: Kundschafter
  rationale: Das Wort bezeichnet Personen, die zur Erkundung einer feindlichen Stellung ausgesandt werden. „Kundschafter“ bewahrt den militärischen Zusammenhang, ohne unnötig die verdeckte Tätigkeit von „Spionen“ hervorzuheben.
- source_word: παρεμβολήν
  choice: Lager
  rationale: Im militärischen Kontext bezeichnet παρεμβολή ein Heerlager; „Lager“ ist knapp, geläufig und kontextuell eindeutig.
- source_word: ἀπήγγειλαν
  choice: meldeten
  rationale: Das Verb beschreibt das Überbringen eines Berichts. „Meldeten“ passt zur militärischen Erkundung und klingt im Deutschen natürlicher als „berichteten ihm“.
- source_word: Οὕτως τάσσονται
  choice: So stellen sie sich auf
  rationale: τάσσονται kann das Sich-Aufstellen oder Formieren bezeichnen. Die Wiedergabe bewahrt den präsentischen Vorgang und die taktische Bedeutung, ohne ihn bloß als Plan oder Absicht auszulegen.
- source_word: ἐπιπεσεῖν
  choice: zu überfallen
  rationale: ἐπιπίπτω bezeichnet hier einen feindlichen Angriff. „Überfallen“ gibt die Plötzlichkeit und den nächtlichen militärischen Charakter idiomatisch wieder.
- source_word: τὴν νύκτα
  choice: in der Nacht
  rationale: Der Akkusativ der Zeit bezeichnet den Zeitraum des geplanten Angriffs; „in der Nacht“ ist in modernem Standarddeutsch natürlich.
