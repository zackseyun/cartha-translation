base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/039.yaml
  text: And Tryphon sought to rule over Asia[a], to put on the crown[b], and to lay hands on Antiochus the king.
translation:
  language: de
  text: Und Tryphon strebte danach, über Asien[a] zu herrschen, sich das Diadem aufzusetzen und die Hände gegen König Antiochus auszustrecken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Asien“ ist hier das betreffende hellenistische Herrschaftsgebiet gemeint, nicht der heutige Kontinent.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „die Hände gegen König Antiochus auszustrecken“; gemeint ist feindliches Vorgehen, etwa ein Angriff.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησεν
  choice: strebte danach
  rationale: Das Aoristverb bezeichnet hier Tryphons Absicht und politisches Bestreben, nicht eine Suche im engeren Sinn. „Strebte danach“ gibt diese Zielgerichtetheit wieder, ohne die erfolgreiche Ausführung vorwegzunehmen.
- source_word: βασιλεῦσαι
  choice: zu herrschen
  rationale: Das Verb kann „König sein“, „König werden“ oder „herrschen“ bedeuten. „Zu herrschen“ passt zum Gebiet „Asien“ und vermeidet eine unnötige Wiederholung der anschließend durch die Königskrone ausgedrückten Thronbesteigung.
- source_word: τῆς Ἀσίας
  choice: über Asien
  rationale: Der überlieferte geografisch-politische Name wird beibehalten. „Über“ entspricht im Deutschen der natürlichen Verbindung mit „herrschen“; eine Fußnote grenzt die antike Bedeutung vom heutigen Kontinent ab.
- source_word: περιθέσθαι τὸ διάδημα
  choice: sich die Königskrone aufzusetzen
  rationale: Das Medium περιθέσθαι bezeichnet das Aufsetzen auf sich selbst; διάδημα ist das Zeichen königlicher Herrschaft. „Königskrone“ ist für heutige Leser unmittelbar verständlich, während die konkrete Handlung erhalten bleibt.
- source_word: ἐκτεῖναι χεῖρας ἐπ’ Ἀντίοχον
  choice: die Hände gegen König Antiochus auszustrecken
  rationale: Die bildhafte griechische Wendung wird eng wiedergegeben und lässt wie der Ausgangstext offen, welche konkrete feindliche Handlung Tryphon plante. Eine Fußnote erläutert ihren Sinn.
- source_word: τὸν βασιλέα
  choice: König Antiochus
  rationale: Der ausdrücklich genannte Königstitel bleibt erhalten; die im Deutschen natürliche Stellung vor dem Namen vermeidet eine schwerfällige Apposition.
