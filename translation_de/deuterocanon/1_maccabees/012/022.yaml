  yaml_path: translation/deuterocanon/1_maccabees/012/022.yaml
  text: And now[a], since we have learned these things, you will do well to write to us concerning your peace.
translation:
  language: de
  text: Und nun, da wir dies erfahren haben, werdet ihr gut daran tun, uns über euren Frieden[a] zu schreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über euer Wohlergehen“. Das griechische Wort für „Frieden“ kann auch Wohlergehen und gutes Ergehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorausgehenden Gedankengang als auch den zeitlichen Übergang.
- source_word: ἀφʼ οὗ ἔγνωμεν ταῦτα
  choice: da wir dies erfahren haben
  rationale: ἀφʼ οὗ hat hier einen kausal-temporalen Sinn; das deutsche Perfekt gibt das erfolgte Bekanntwerden mit gegenwärtiger Relevanz natürlich wieder. Das singularische „dies“ fasst die zuvor genannten Sachverhalte idiomatisch zusammen.
- source_word: καλῶς ποιήσετε
  choice: tut ihr gut daran
  rationale: Gängige deutsche Entsprechung der brieflichen Wendung, die eine erbetene Handlung höflich empfiehlt.
- source_word: γράφοντες ἡμῖν
  choice: uns … zu schreiben
  rationale: Der begleitende Partizipialsatz bezeichnet, worin das Gut-Tun besteht; die deutsche Infinitivkonstruktion gibt dies klar und natürlich wieder.
- source_word: περὶ τῆς εἰρήνης ὑμῶν
  choice: über euren Frieden
  rationale: „Frieden“ ist die direkte Entsprechung von εἰρήνη und passt in den diplomatischen Zusammenhang; zugleich kann das Wort hier das Wohlergehen bezeichnen, weshalb die Alternative in einer Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht brieflichem Ton. Die Formulierung bleibt nahe am Griechischen, ohne unnatürliche Satzstrukturen zu übernehmen; die Bedeutungsbreite von εἰρήνη wird nicht stillschweigend aufgelöst.
