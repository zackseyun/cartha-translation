  text: And after breaking camp, he came to Damascus and traveled through the whole region.
translation:
  language: de
  text: Und er brach das Lager ab, kam nach Damaskus und zog durch die ganze Gegend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζεύξας
  choice: er brach das Lager ab
  rationale: Das Partizip bezeichnet im Reise- und Militärkontext das Aufbrechen beziehungsweise den Abmarsch nach dem Abbau des Lagers. „Er brach das Lager ab“ bewahrt diese konkrete Nuance und fügt sich natürlich in die Erzählung ein.
- source_word: ἦλθεν
  choice: kam
  rationale: Mit εἰς Δαμασκόν bezeichnet ἔρχομαι die Bewegung nach Damaskus. „Kam nach Damaskus“ ist im Deutschen idiomatisch und wahrt die im Griechischen mögliche Erzählperspektive.
- source_word: διώδευσεν
  choice: zog durch
  rationale: Das Verb bezeichnet das Durchqueren oder Bereisen eines Gebiets. „Zog durch“ passt zum militärischen Reiseumfeld und ist zugleich knapp und erzählerisch natürlich.
- source_word: ἐν πάσῃ τῇ χώρᾳ
  choice: durch die ganze Gegend
  rationale: χώρα meint hier ein Gebiet beziehungsweise die umliegende Landschaft. „Gegend“ vermeidet die moderne staatspolitische Bedeutung von „Land“ und lässt den genauen territorialen Umfang offen.
- source_word: καὶ ... καὶ
  choice: Und ... und
  rationale: Die wiederholten καί verbinden die aufeinanderfolgenden Handlungen schlicht miteinander. Der erste Anschluss wird als „Und“ bewahrt; die deutsche Reihung bleibt flüssig.
