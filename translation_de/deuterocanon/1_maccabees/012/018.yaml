  text: Und die Könige rings um uns führten Krieg gegen uns.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kämpften gegen uns“. Das griechische Verb kann sowohl das Kämpfen als auch umfassender das Führen eines Krieges bezeichnen.'
