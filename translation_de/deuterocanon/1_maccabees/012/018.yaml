lexical_decisions:
- source_word: ἐπολέμησαν
  choice: führten Krieg gegen
  rationale: Der Aorist von πολεμέω bezeichnet militärische Auseinandersetzung beziehungsweise Kriegführung. „führten Krieg gegen“ gibt den umfassenden militärischen Sinn und die gegen ἡμᾶς gerichtete Feindseligkeit klar wieder.
- source_word: οἱ βασιλεῖς
  choice: die Könige
  rationale: Der bestimmte Artikel wird beibehalten, da eine im Zusammenhang identifizierbare Gruppe von Königen gemeint ist.
- source_word: οἱ κύκλῳ ἡμῶν
  choice: rings um uns
  rationale: κύκλῳ mit dem Genitiv bezeichnet die Lage im Umkreis. „rings um uns“ ist natürlich, knapp und kann hier auch den geopolitischen Sinn benachbarter Herrscher tragen.
