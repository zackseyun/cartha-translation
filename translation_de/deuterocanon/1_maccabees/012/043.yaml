base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/043.yaml
  text: And he received him honorably[a], introduced him to all his friends, gave him gifts[b], and commanded his friends and his forces likewise to obey him.
translation:
  language: de
  text: Und er empfing ihn ehrenvoll, stellte ihn[a] allen seinen Freunden[b] vor, gab ihm Geschenke und befahl seinen Freunden und seinen Streitkräften, ihm ebenso zu gehorchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „präsentierte ihn“. Das griechische Verb kann das Vorstellen oder öffentliche Präsentieren einer Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Freunde“ kann im hellenistischen Hofmilieu einen politischen Sinn haben und Angehörige des engeren Kreises eines Herrschers bezeichnen, nicht nur persönliche Freunde.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: empfing
  rationale: Das Verb bezeichnet hier die ehrenvolle Aufnahme einer Person. „Empfing“ entspricht dem förmlichen, höfischen Zusammenhang, ohne mehr als der griechische Text auszusagen.
- source_word: ἐνδόξως
  choice: ehrenvoll
  rationale: Das Adverb beschreibt eine von Ehre und Ansehen geprägte Behandlung. „Ehrenvoll“ ist im modernen Deutschen klar und dem höfischen Kontext angemessen.
- source_word: συνέστησεν
  choice: stellte … vor
  rationale: In Verbindung mit einer Person und einem Kreis von Bekannten bezeichnet das Verb hier das Vorstellen oder öffentliche Präsentieren. „Stellte … vor“ ist natürliches modernes Deutsch.
- source_word: φίλοις
  choice: Freunden
  rationale: Die wörtliche Bedeutung wird beibehalten. Da „Freunde“ im hellenistischen Hofmilieu auch Angehörige des engeren Herrscherkreises bezeichnen kann, wird dieser mögliche politische Sinn in einer Fußnote erläutert.
- source_word: δόματα
  choice: Geschenke
  rationale: Eine direkte und idiomatische Wiedergabe des Plurals für Gaben oder Geschenke.
- source_word: δυνάμεσιν
  choice: Streitkräften
  rationale: Der Plural bezeichnet in diesem Zusammenhang die militärischen Kräfte unter seinem Befehl. „Streitkräfte“ macht diesen konkreten Sinn deutlich.
- source_word: ὑπακούειν
  choice: zu gehorchen
  rationale: Im Zusammenhang eines ausdrücklichen Befehls gibt „gehorchen“ die Bedeutung präzise wieder.
- source_word: ὡσαύτως
  choice: ebenso
  rationale: Das Adverb drückt Gleichartigkeit aus. „Ebenso“ bewahrt diesen Bezug knapp und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht förmlichem Ton, passend zur höfisch-politischen Szene. Die wiederholten Bezüge auf „seine Freunde“ und die militärische Bedeutung von δυνάμεις bleiben erhalten.
