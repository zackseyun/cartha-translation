  yaml_path: translation/deuterocanon/1_maccabees/012/028.yaml
  text: And when the adversaries heard that Jonathan and those with him were prepared for war[a], they were afraid and lost heart, and they lit fires in their camp.
translation:
  language: de
  text: Als die Gegner hörten, dass Jonatan und seine Leute zum Kampf bereit waren, fürchteten sie sich und verloren den Mut; sie entzündeten in ihrem Lager Feuer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Sie machten ihr Herz starr.“ Gemeint ist, dass sie den Mut verloren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὑπεναντίοι
  choice: die Gegner
  rationale: Bezeichnet diejenigen, die Jonatan entgegenstehen; „Gegner“ ist im modernen Deutschen natürlich und lässt den militärischen Kontext den Grad der Feindschaft bestimmen.
- source_word: ἡτοίμασται
  choice: bereit waren
  rationale: Die Perfektform bezeichnet den erreichten Zustand der Bereitschaft; im Deutschen ist die pluralische Form wegen des zusammengesetzten Subjekts erforderlich.
- source_word: Ἰωναθὰν καὶ οἱ παρʼ αὐτοῦ
  choice: Jonatan und seine Leute
  rationale: οἱ παρʼ αὐτοῦ meint die bei ihm befindliche Gefolgschaft. „Seine Leute“ ist natürlich und kontextgerecht, ohne ihre genaue militärische Funktion festzulegen.
- source_word: εἰς πόλεμον
  choice: zum Kampf
  rationale: Im unmittelbaren militärischen Zusammenhang bezeichnet die Wendung die Bereitschaft zur bewaffneten Auseinandersetzung; „zum Kampf“ klingt im Deutschen natürlicher als „zum Krieg“.
- source_word: ἐφοβήθησαν
  choice: bekamen sie Angst
  rationale: Gibt den Eintritt der Furcht, den der Aorist ausdrückt, in natürlichem modernem Deutsch wieder.
- source_word: ἔπηξαν τὴν καρδίαν αὐτῶν
  choice: verloren den Mut
  rationale: Die wörtliche Wendung vom fest oder starr werdenden Herzen ist ein Bild für Entmutigung beziehungsweise den Verlust der Tapferkeit; die idiomatische Bedeutung wird im Haupttext klar wiedergegeben und das Bild in der Fußnote bewahrt.
- source_word: ἀνέκαυσαν πυρὰς
  choice: zündeten sie ... Feuer an
  rationale: Gibt das Entfachen mehrerer Feuer direkt und idiomatisch wieder.
- source_word: ἐν τῇ παρεμβολῇ αὐτῶν
  choice: in ihrem Lager
  rationale: παρεμβολή bezeichnet hier eindeutig ein militärisches Lager.
