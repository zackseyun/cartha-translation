lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: wir freuen uns
  rationale: Die medial-passive Form bezeichnet hier gegenwärtige Freude. „Wir freuen uns“ ist im heutigen Deutsch natürlich und gibt den Sinn ohne Verstärkung wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet einen leichten Gegensatz oder Übergang. „Aber“ bewahrt diese verbindende Kontrastwirkung, ohne sie stark hervorzuheben.
- source_word: ἐπὶ
  choice: über
  rationale: ἐπί mit dem Dativ bezeichnet hier den Anlass oder Grund der Freude. Im Deutschen ist „sich über etwas freuen“ die natürliche Entsprechung.
- source_word: τῇ δόξῃ
  choice: euer Ansehen
  rationale: δόξα bezeichnet in diesem Zusammenhang wahrscheinlich die Ehre, den guten Ruf oder die angesehene Stellung der Adressaten. „Ansehen“ ist idiomatisch und vermeidet die im Deutschen leicht religiös oder prachtbezogen verstandene Wiedergabe „Herrlichkeit“.
- source_word: ὑμῶν
  choice: euer
  rationale: Das Pronomen ist Genitiv der zweiten Person Plural und bezieht sich kollektiv auf die Adressaten.
