  yaml_path: translation/deuterocanon/1_maccabees/012/033.yaml
  text: And Simon went out and passed through as far as Ashkelon and the nearby strongholds[a], and he turned aside to Joppa and took it beforehand.
translation:
  language: de
  text: Und Simon zog aus und durchquerte das Gebiet bis nach Aschkelon und zu den Festungen in der Umgebung. Dann wandte er sich nach Joppe und nahm sie vorab in Besitz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »besetzte sie vorab« oder »nahm sie vorbeugend ein«. Das griechische Verb bezeichnet eine Inbesitznahme, durch die man jemand anderem zuvorkommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διώδευσεν
  choice: durchquerte das Gebiet
  rationale: Das Verb bezeichnet das Durchziehen eines Gebiets oder entlang einer Route. Die Ergänzung „das Gebiet“ ergibt im Deutschen einen natürlichen Satz, ohne einen ausdrücklich militärischen Marsch zu behaupten.
- source_word: ἕως Ἀσκάλωνος
  choice: bis nach Aschkelon
  rationale: ἕως bezeichnet die räumliche Ausdehnung bis zu einem Endpunkt; „bis nach“ gibt diese Grenznuance idiomatisch wieder.
- source_word: τὰ πλησίον ὀχυρώματα
  choice: die Festungen in der Umgebung
  rationale: ὀχυρώματα sind befestigte Orte oder Festungen; πλησίον bezeichnet ihre Nähe zu Aschkelon. Diese Wiedergabe ist klar und vermeidet das im heutigen Deutsch teils übertragene „Hochburgen“.
- source_word: ἐξέκλινεν εἰς Ἰόππην
  choice: wandte er sich nach Joppe
  rationale: ἐκκλίνω bezeichnet hier eine Richtungsänderung oder ein Abweichen von der bisherigen Route. „Sich nach Joppe wenden“ klingt natürlich und bewahrt diesen Sinn.
- source_word: προκατελάβετο
  choice: nahm ... zuvor in Besitz
  rationale: Das zusammengesetzte Verb bezeichnet eine vorzeitige oder vorbeugende Inbesitznahme. Die Formulierung bewahrt die zeitliche Nuance, ohne genauer festzulegen, wem Simon zuvorkam.
- source_word: αὐτήν
  choice: die Stadt
  rationale: Das Pronomen bezieht sich auf das grammatisch feminine Ἰόππην. Die explizite Wiedergabe „die Stadt“ ist im Deutschen eindeutig und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsnamen folgen den im Deutschen geläufigen Formen „Aschkelon“ und „Joppe“. Der längere griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die Abfolge der Handlungen bleibt erhalten.
