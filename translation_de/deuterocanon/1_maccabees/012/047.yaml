  yaml_path: translation/deuterocanon/1_maccabees/012/047.yaml
  text: But he left three thousand men with himself[a]; about two thousand he left in Galilee[b], and a thousand went with him.
translation:
  language: de
  text: Doch er behielt dreitausend Männer bei sich[a]. Etwa zweitausend ließ er in Galiläa zurück, und tausend zogen mit ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ließ dreitausend Männer bei sich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kamen mit ihm zusammen“; das griechische Verb bezeichnet wörtlicher ein Zusammenkommen mit jemandem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν … μεθʼ ἑαυτοῦ
  choice: behielt … bei sich
  rationale: καταλείπω bezeichnet ein Zurücklassen oder Verbleibenlassen. Zusammen mit μεθʼ ἑαυτοῦ gibt „behielt … bei sich“ den Sinn im Deutschen natürlich wieder; die ungewöhnlichere wörtliche Ausdrucksweise wird in einer Fußnote vermerkt.
- source_word: ἄνδρας τρισχιλίους
  choice: dreitausend Männer
  rationale: ἄνδρας bedeutet wörtlich „Männer“. Der militärische Zusammenhang ist erkennbar, ohne das stärker deutende „Soldaten“ in den Text einzutragen.
- source_word: ὡς δισχιλίους
  choice: etwa zweitausend
  rationale: ὡς kennzeichnet bei einer Zahl häufig eine ungefähre Angabe; „etwa“ bewahrt diese Nuance.
- source_word: ἀφῆκεν
  choice: ließ … zurück
  rationale: ἀφίημι kann hier bedeuten, jemanden an einem Ort zurück- oder verbleiben zu lassen. „Zurücklassen“ ist idiomatisch und vermeidet die zusätzliche militärische Deutung „stationieren“.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: in Galiläa
  rationale: Dies ist die übliche deutsche Wiedergabe der lokalen Präpositionalphrase.
- source_word: χίλιοι δὲ συνῆλθον αὐτῷ
  choice: und tausend zogen mit ihm
  rationale: συνέρχομαι mit dem Dativ kann das Zusammenkommen beziehungsweise Mitgehen mit jemandem bezeichnen. „Zogen mit ihm“ passt zum erzählerischen Bewegungskontext, ohne ein förmliches Sich-Anschließen zu behaupten.
