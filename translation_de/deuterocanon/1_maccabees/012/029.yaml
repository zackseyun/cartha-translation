  text: But Jonathan and those with him did not know until morning[a], for they saw the fires burning.
translation:
  language: de
  text: Jonatan aber und seine Begleiter wussten es bis zum Morgen nicht, denn sie sahen die Feuer brennen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die brennenden Lichter“. Im Zusammenhang sind wahrscheinlich Feuer gemeint, die im Lager weiterbrannten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: bemerkten es nicht
  rationale: Im Zusammenhang geht es darum, dass Jonatan und seine Begleiter den Abzug des Gegners nicht bemerkten. Das Pronomen „es“ ist im Deutschen für den absoluten Gebrauch natürlicher, ohne den Sachverhalt näher festzulegen.
- source_word: ἕως πρωί
  choice: bis zum Morgen
  rationale: Gibt die zeitliche Grenze ihrer Unkenntnis direkt und idiomatisch wieder.
- source_word: ἔβλεπον
  choice: sie sahen
  rationale: Das Imperfekt liefert den erklärenden Hintergrund. Das deutsche Präteritum ist hier natürlich; die andauernde Wahrnehmung ergibt sich aus „brennen“ und dem Zusammenhang.
- source_word: τὰ φῶτα
  choice: die Feuer
  rationale: Wörtlich bezeichnet der Ausdruck „die Lichter“. Im nächtlichen Heerlager sind damit wahrscheinlich sichtbare Feuer gemeint; „Feuer“ ist verständlich, ohne die zusätzliche Festlegung auf „Lagerfeuer“.
- source_word: καιόμενα
  choice: brennen
  rationale: Das präsentische Partizip beschreibt den fortdauernden sichtbaren Zustand der Feuer.
- source_word: οἱ παρʼ αὐτοῦ
  choice: seine Begleiter
  rationale: Bezeichnet die bei Jonatan befindliche Gruppe. „Begleiter“ ist natürlich und vermeidet die im Griechischen nicht ausdrücklich enthaltene militärische Verengung auf „seine Männer“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit „aber“ bewahrt den griechischen Übergang, während „bemerkten es“ den Zusammenhang im Deutschen natürlich ausdrückt. Der Fußnotenmarker steht unmittelbar nach der Aussage, auf deren irreführenden Anschein die folgende Begründung verweist.
