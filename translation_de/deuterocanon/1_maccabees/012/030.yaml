base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/030.yaml
  text: And he pursued after them, but did not overtake them, for they had crossed the Eleutherus River.
translation:
  language: de
  text: Er verfolgte sie, holte sie aber nicht ein; denn sie hatten den Fluss Eleutherus überquert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωξεν
  choice: verfolgte
  rationale: Der Aorist von καταδιώκω bezeichnet hier die aktive Verfolgung der Fliehenden; »verfolgte« ist im militärischen Erzählzusammenhang natürlich und präzise.
- source_word: ὀπίσω αὐτῶν
  choice: sie
  rationale: Im Deutschen enthält »jemanden verfolgen« bereits den Sinn von »hinter jemandem her sein«; eine zusätzliche Wiedergabe mit »hinter ihnen her« wäre möglich, aber unnötig schwerfällig.
- source_word: οὐκ ἐκατέλαβεν αὐτούς
  choice: holte sie aber nicht ein
  rationale: καταλαμβάνω bedeutet in diesem Verfolgungskontext, die Fliehenden einzuholen. Die adversative Verbindung mit »aber« gibt καί vor der Verneinung im Deutschen sinngerecht wieder.
- source_word: διέβησαν
  choice: hatten … überquert
  rationale: Das Plusquamperfekt macht verständlich, dass die Überquerung dem erfolglosen Einholen vorauslag und als dessen Grund genannt wird.
- source_word: τὸν Ἐλεύθερον ποταμόν
  choice: den Fluss Eleutherus
  rationale: Ἐλεύθερος ist hier der Eigenname des Flusses. Die Form »Fluss Eleutherus« bewahrt den Namen durch Transliteration und entspricht natürlichem deutschem Karten- und Erzählstil.
