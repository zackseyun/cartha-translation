  yaml_path: translation/deuterocanon/1_maccabees/012/009.yaml
  text: And so we also[a], though having no need of these things, have the holy books that are in our hands as encouragement[b],
translation:
  language: de
  text: So sind auch wir auf diese Dinge nicht angewiesen, denn die heiligen Bücher, die wir in Händen haben,[b] dienen uns zur Ermutigung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Trost“ oder „zum Zuspruch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die heiligen Bücher, die in unseren Händen sind“. Gemeint sind wahrscheinlich Israels heilige Schriften, die ihnen vorlagen.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀπροσδεεῖς
  choice: nicht angewiesen
  rationale: Das Adjektiv bezeichnet Menschen, die etwas nicht benötigen. „Auf diese Dinge nicht angewiesen“ ist im Deutschen natürlich und bewahrt den Gedanken der Unabhängigkeit, ohne völlige Bedürfnislosigkeit zu behaupten.
- source_word: τούτων
  choice: diese Dinge
  rationale: Das sächliche Pluralpronomen verweist allgemein auf das zuvor Erwähnte. Die offene Formulierung wird beibehalten.
- source_word: παράκλησιν
  choice: Ermutigung
  rationale: Das Wort kann Ermutigung, Zuspruch oder Trost bezeichnen. „Ermutigung“ gibt hier die stärkende Wirkung der heiligen Bücher wieder, ohne den Sinn unnötig auf Trost einzuengen.
- source_word: τὰ βιβλία τὰ ἅγια
  choice: die heiligen Bücher
  rationale: Dies entspricht der konkreten griechischen Formulierung und passt in den jüdischen Kontext der Zeit, ohne den Ausdruck bereits deutend mit „Heilige Schrift“ gleichzusetzen.
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: die wir in Händen haben
  rationale: Die deutsche Wendung bewahrt das Bild des griechischen Ausdrucks und bezeichnet verständlich Besitz beziehungsweise unmittelbaren Zugang.
theological_decisions:
- issue: Bezug der „heiligen Bücher“
  choice: Die Übersetzung lässt den Ausdruck als „die heiligen Bücher“ stehen und legt damit Israels heilige Schriften nahe, ohne sie ausdrücklich näher zu bestimmen.
  alternative: Ausdrückliche Wiedergabe als „die Heiligen Schriften“ oder allgemeiner als „heilige Dokumente“.
  rationale: Im Kontext sind sehr wahrscheinlich Israels heilige Schriften gemeint. Der griechische Wortlaut selbst sagt jedoch „die heiligen Bücher“; diese Breite bleibt erhalten.
- issue: Bedeutungsumfang von παράκλησις
  choice: Ermutigung
  alternative: Trost, Zuspruch oder Ermahnung
  rationale: Der Zusammenhang beschreibt die stärkende Hilfe, die aus den heiligen Büchern gewonnen wird. „Ermutigung“ wahrt diesen Sinn, während eine Fußnote die echte lexikalische Spannweite kenntlich macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverknüpfung mit „denn“ macht den begründenden Zusammenhang idiomatisch deutlich; „dienen uns zur Ermutigung“ gibt die prädikative Konstruktion natürlich wieder. Beide Fußnotenzeichen stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
