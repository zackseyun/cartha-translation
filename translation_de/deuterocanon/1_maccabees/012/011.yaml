base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/011.yaml
  text: Therefore[a], at all times we continually remember you at the festivals and on the other appointed days, when we offer sacrifices and in our prayers, as it is right and fitting to remember brothers.
translation:
  language: de
  text: 'Darum denken wir jederzeit und ohne Unterlass an euch: an den Festen und an den übrigen dafür vorgesehenen Tagen[a], an denen wir Opfer darbringen, und auch in den Gebeten, wie es sich gehört und angemessen ist, an Brüder zu denken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den übrigen gebührenden/üblichen Tagen“; das griechische Wort kann Tage bezeichnen, die passend, herkömmlich oder zur Begehung bestimmt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: ohne Unterlass
  rationale: Bewahrt den Nachdruck des griechischen Ausdrucks und ergänzt „jederzeit“, ohne die Aussage abzuschwächen.
- source_word: ἑορταῖς
  choice: Festen
  rationale: Bezeichnet religiöse Festtage und ist im Deutschen natürlich und kultisch passend.
- source_word: λοιπαῖς καθηκούσαις ἡμέραις
  choice: den übrigen dafür vorgesehenen Tagen
  rationale: Gibt die kontextuelle Bedeutung von Tagen wieder, die für eine entsprechende religiöse Begehung passend, üblich oder bestimmt sind, ohne eine formelle Vorschrift zu behaupten.
- source_word: μιμνησκόμεθα ὑμῶν
  choice: denken wir ... an euch
  rationale: Natürliche deutsche Wiedergabe des Verbs mit Genitivobjekt; der Zusammenhang schließt kultisches Gedenken in Opfer und Gebet ein.
- source_word: ἐφʼ ὧν
  choice: an denen
  rationale: Behält den temporalen Rückbezug auf die genannten Fest- und Gedenktage bei.
- source_word: προσφέρομεν θυσιῶν
  choice: wir Opfer darbringen
  rationale: Genaue und im kultischen Zusammenhang idiomatische Wiedergabe.
- source_word: ἐν ταῖς προσευχαῖς
  choice: in den Gebeten
  rationale: Folgt dem bestimmten Artikel des Griechischen, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: wie es sich gehört und angemessen ist
  rationale: Erhält die doppelte Aussage von Verpflichtung und Angemessenheit in würdigem, gegenwärtigem Deutsch.
- source_word: ἀδελφῶν
  choice: Brüder
  rationale: Bewahrt die grammatisch maskuline und politisch-familiäre Ausdrucksweise des griechischen Textes.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung ἀδελφῶν
  choice: Brüder
  alternative: Geschwister; Verwandte
  rationale: Das Griechische verwendet die maskuline Form als familiär-politische Bezeichnung. Eine Neutralisierung würde diese rhetorische Gestalt des Textes verändern.
- issue: Kultische Sprache von Opfern und Gebeten
  choice: Opfer ausdrücklich beibehalten
  alternative: Opfergaben; Gottesdienst
  rationale: Der Ausgangstext nennt ausdrücklich Opfer und Gebete. Eine Verallgemeinerung zu Gottesdienst würde den tempelkultischen Zusammenhang verwischen.
- issue: Bezug von ἐφʼ ὧν
  choice: temporaler Bezug auf die genannten Tage
  alternative: 'allgemein: bei welchen Gelegenheiten'
  rationale: Das Relativpronomen kann sich natürlich auf die unmittelbar zuvor genannten Fest- und sonstigen Tage beziehen; die Übersetzung lässt diese zeitliche Verknüpfung sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Präzision und die nachdrückliche Doppelung „jederzeit und ohne Unterlass“ bleiben erhalten; der Satzbau wurde nur so weit geglättet, dass die Beziehungen im Deutschen verständlich bleiben.
