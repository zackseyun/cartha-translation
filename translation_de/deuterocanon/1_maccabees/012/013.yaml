  text: But we[a], though having no need of these things, have as encouragement the holy books that are in our hands[b],
translation:
  language: de
  text: Wir aber sind auf diese Dinge nicht angewiesen; als Ermutigung[a] haben wir die heiligen Bücher, die wir in Händen halten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Trost“ beziehungsweise „Zuspruch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die in unseren Händen sind“; die Wendung kann auch „die sich in unserem Besitz befinden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρόσδεοι
  choice: nicht angewiesen
  rationale: Das Adjektiv bezeichnet jemanden, der etwas nicht nötig hat. „Auf diese Dinge nicht angewiesen“ ist im modernen Deutschen idiomatisch und vermeidet die stärkere Aussage völliger Unabhängigkeit.
- source_word: τούτων
  choice: auf diese Dinge
  rationale: Das Pronomen verweist auf die zuvor genannten äußeren Hilfen oder Beziehungen. „Diese Dinge“ erhält den offenen Rückbezug des Griechischen.
- source_word: παράκλησιν
  choice: Ermutigung
  rationale: Gemeint ist hier stärkender Zuspruch oder innerer Halt. „Ermutigung“ gibt diesen Sinn wieder, ohne ihn auf emotionalen Trost oder ausdrückliche Ermahnung zu verengen.
- source_word: τὰ βιβλία τὰ ἅγια
  choice: die heiligen Bücher
  rationale: Dies entspricht der konkreten griechischen Formulierung und legt keine später definierte kanonische Abgrenzung in den Text hinein.
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: die wir in Händen halten
  rationale: Die anschauliche Wendung des Griechischen bleibt erhalten und kann zugleich Besitz, Verwahrung oder unmittelbare Verfügbarkeit ausdrücken.
theological_decisions:
- issue: Bezug und Umfang der „heiligen Bücher“
  choice: die heiligen Bücher
  alternative: die Heilige Schrift; die heiligen Schriften
  rationale: Der griechische Text spricht von heiligen Büchern, bestimmt aber weder ihren genauen Umfang noch eine spätere kanonische Kategorie. Die konkrete, offene Bezeichnung wird daher beibehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Semikolon-Satz bewahrt die knappe Gegenüberstellung des griechischen Textes; „als Ermutigung haben wir“ bleibt bewusst nahe an dessen Aussageform.
