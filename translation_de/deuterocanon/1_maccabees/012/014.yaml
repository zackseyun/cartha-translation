base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/014.yaml
  text: We have tried to send to you and renew the brotherhood and friendship[a], so that we might not become estranged from you; for many years have passed since you sent to us.
translation:
  language: de
  text: Wir haben versucht, zu euch zu senden und die brüderliche Verbundenheit und Freundschaft mit euch zu erneuern, um uns nicht von euch zu entfremden. Denn seit ihr zu uns gesandt habt, ist lange Zeit vergangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „viele Zeiten“ oder „viele Zeitabschnitte sind vergangen“. Das griechische καιροί steht im Plural.'
    reason: „Lange Zeit“ ist im Deutschen die natürliche idiomatische Wiedergabe, während die Fußnote die pluralische Form der Vorlage sichtbar macht.
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: Wir haben uns bemüht
  rationale: Die Form bezeichnet einen bewussten Versuch beziehungsweise ein ernsthaftes Bemühen. „Wir haben uns bemüht“ ist natürliches Deutsch und legt nicht unnötig nahe, der Versuch sei gescheitert.
- source_word: ἀποστεῖλαι
  choice: Abgesandte zu euch zu schicken
  rationale: ἀποστέλλω bedeutet „senden, entsenden“. Da im Griechischen das Gesandte nicht ausdrücklich genannt wird, ergänzt die Übersetzung aus dem diplomatischen Zusammenhang „Abgesandte“ und kennzeichnet diese Ergänzung in einer Fußnote.
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: die brüderliche Verbundenheit und Freundschaft mit euch
  rationale: ἀδελφότης bezeichnet hier die als brüderlich beziehungsweise verwandtschaftlich verstandene Verbindung; „brüderliche Verbundenheit“ klingt im heutigen Deutsch natürlicher als „Bruderschaft“ und bleibt vom danebenstehenden „Freundschaft“ unterscheidbar. πρὸς ὑμᾶς wird relational mit „mit euch“ wiedergegeben.
- source_word: ἀνανεώσασθαι
  choice: zu erneuern
  rationale: Das Verb bezeichnet die Erneuerung oder Wiederbelebung einer schon bestehenden diplomatischen Beziehung.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: damit wir euch nicht fremd würden
  rationale: Die Konstruktion drückt einen Zweck aus. Die idiomatische Formulierung bewahrt den Gedanken, dass zwischen den Parteien Entfremdung eintreten könnte.
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: Denn … ist lange Zeit vergangen
  rationale: Im Zusammenhang bezeichnet der Plural καιροί mehrere Zeitabschnitte beziehungsweise eine lange verstrichene Zeit. Die singularische deutsche Wendung ist natürlich; der griechische Plural wird in der Fußnote offengelegt.
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: seit ihr Abgesandte zu uns geschickt habt
  rationale: Auch hier nennt der griechische Text nicht ausdrücklich, was oder wen die Empfänger sandten. Die kontextuelle Ergänzung „Abgesandte“ schafft lesbares Deutsch, ohne die andere Möglichkeit einer Botschaft oder eines Schreibens zu verschweigen.
