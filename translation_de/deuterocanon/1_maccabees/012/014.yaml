  naturalness: Die revidierte Fassung ist modernes, würdiges Deutsch. Das objektlose „zu euch / zu uns zu senden“ ist bewusst leicht formell, bewahrt aber die Auslassung der Vorlage besser als eine konkrete Ergänzung. „Lange Zeit“ ist im Deutschen idiomatisch; die pluralische Form καιροί wird in der Fußnote dokumentiert.
  terminology: „Brüderliche Verbundenheit und Freundschaft mit euch“ gibt ἀδελφότης καὶ φιλία mit relationalem πρὸς ὑμᾶς angemessen wieder. Es werden keine konfessionell geprägten Begriffe eingeführt.
