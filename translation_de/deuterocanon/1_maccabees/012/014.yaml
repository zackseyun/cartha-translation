translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht diplomatischem Ton. Der lange griechische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert. Unausgesprochene Objekte von ἀποστέλλω werden kontextuell ergänzt und jeweils in Fußnoten als textlich offen ausgewiesen.
