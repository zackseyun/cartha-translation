  text: And trusting him, he did as he said, and sent out the forces, and they went away into the land of Judah.
translation:
  language: de
  text: Und weil er ihm vertraute, tat er, wie er gesagt hatte. Er schickte die Truppen fort, und sie zogen ins Land Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Land Juda“.'
    reason: Die Präposition εἰς kann in diesem Bewegungskontext sowohl das Hineingehen als auch allgemein das Ziel bezeichnen.
lexical_decisions:
- source_word: ἐμπιστεύσας αὐτῷ
  choice: weil er ihm vertraute
  rationale: Das Aoristpartizip bezeichnet hier das Vertrauen, das zu der folgenden Handlung führt. Die kausale Wiedergabe ist im Deutschen natürlich und macht diesen naheliegenden Zusammenhang sichtbar, ohne dem Verb mehr als Vertrauen zuzuweisen.
- source_word: ἐποίησεν καθὼς εἶπεν
  choice: tat er, wie er gesagt hatte
  rationale: Die Formulierung bleibt eng am Griechischen. Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass das Sagen der Ausführung vorausging; das nicht ausdrücklich genannte Subjekt von „gesagt hatte“ bleibt wie im Ausgangstext aus dem Zusammenhang zu erschließen.
- source_word: ἐξαπέστειλεν τὰς δυνάμεις
  choice: Er schickte die Truppen fort
  rationale: Im militärischen Zusammenhang bezeichnet δυνάμεις die Truppen. „fortschicken“ erfasst ἐξαποστέλλω und passt dazu, dass sie anschließend das Gebiet verlassen.
- source_word: ἀπῆλθον
  choice: sie zogen
  rationale: Für die Bewegung von Truppen ist „ziehen“ natürlich und würdevoll; zusammen mit „fortschickte“ bringt es den Aufbruch zum Ausdruck, ohne das Deutsche durch „gingen weg“ zu belasten.
- source_word: εἰς γῆν Ἰούδα
  choice: ins Land Juda
  rationale: Die Wendung gibt das Ziel einer Bewegung an. „Land Juda“ bildet γῆ Ἰούδα transparent ab und vermeidet die stärker geografisch standardisierte Wiedergabe „Judäa“.
