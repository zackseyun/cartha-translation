lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: wir freuen uns
  rationale: Die mittelpassive Form bezeichnet Freude oder Frohsein. „Wir freuen uns“ ist im heutigen Deutsch natürlich und bewahrt den verbalen Ausdruck.
- source_word: δὲ
  choice: doch
  rationale: δέ kennzeichnet hier einen milden Gegensatz oder Übergang. „Doch“ gibt diese verbindende und leicht kontrastierende Funktion knapp wieder.
- source_word: ἐπὶ
  choice: über
  rationale: ἐπί mit dem Dativ kann den Anlass oder Grund der Freude bezeichnen. Im Deutschen ist „sich über etwas freuen“ die natürliche Entsprechung.
- source_word: τῇ δόξῃ
  choice: euer Ansehen
  rationale: δόξα bezeichnet hier wahrscheinlich die ehrenvolle Stellung oder den guten Ruf der Adressaten. „Ansehen“ gibt diesen Sinn im modernen Deutsch klarer wieder als das möglicherweise theologisch oder auf sichtbaren Glanz bezogene „Herrlichkeit“.
- source_word: ὑμῶν
  choice: euer
  rationale: Direkte Wiedergabe des Genitivs der zweiten Person Plural; er bestimmt δόξα.
