base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/008.yaml
  text: And Onias received the man who had been sent with honor[a], and he received the letters[b], in which an alliance and friendship were explained.
translation:
  language: de
  text: Und Onias empfing den abgesandten Mann ehrenvoll[a] und nahm die Briefe entgegen, in denen Bündnis und Freundschaft dargelegt wurden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hieß den Gesandten ehrenvoll willkommen«. Wörtlicher lautet das Griechische: »empfing den Mann, der abgesandt worden war, ehrenvoll«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in denen Bündnis und Freundschaft erläutert wurden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: empfing
  rationale: Das Verb bezeichnet das Empfangen oder Willkommenheißen einer Person. »Empfing« passt zum förmlichen diplomatischen Zusammenhang und lässt die Art des Empfangs durch ἐνδόξως bestimmen.
- source_word: ἐνδόξως
  choice: ehrenvoll
  rationale: Das Adverb beschreibt einen ehrenvollen, würdigen Empfang. »Ehrenvoll« ist im Deutschen natürlich und vermeidet die irreführende Wiedergabe »ruhmreich«.
- source_word: τὸν ἄνδρα τὸν ἀπεσταλμένον
  choice: den abgesandten Mann
  rationale: Die Wiedergabe bleibt nahe an der beschreibenden griechischen Formulierung »den Mann, den abgesandten«. Kontextuell ist ein Gesandter gemeint, doch der Ausgangstext verwendet keinen ausdrücklichen Amtstitel.
- source_word: ἔλαβε τὰς ἐπιστολάς
  choice: nahm die Briefe entgegen
  rationale: Im Zusammenhang eines diplomatischen Austauschs gibt »entgegennehmen« den kontextuellen Sinn von λαμβάνω idiomatisch wieder und vermeidet im Deutschen die unmittelbare Wiederholung von »empfing«.
- source_word: διεσάφειτο
  choice: dargelegt wurden
  rationale: Die passive Form bezeichnet, dass die betreffenden Inhalte in den Briefen erläutert beziehungsweise klar ausgeführt wurden. »Dargelegt wurden« bewahrt das Passiv und passt zum förmlichen Kontext.
- source_word: συμμαχίας
  choice: ein Bündnis
  rationale: Das Substantiv bezeichnet ein politisches oder militärisches Bündnis. Der unbestimmte Artikel ergibt im Deutschen in dieser Satzkonstruktion eine natürliche Formulierung.
- source_word: φιλίας
  choice: Freundschaft
  rationale: Der Begriff bezeichnet hier Freundschaft im diplomatisch-politischen Sinn. Die direkte Wiedergabe bewahrt die Verbindung mit »Bündnis«, ohne sie zu »freundschaftlichen Beziehungen« auszudeuten.
