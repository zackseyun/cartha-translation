  source_fidelity: 'Die Übersetzung gibt den griechischen Ablauf genau wieder: Jonatans Eintritt in Ptolemaïs, das Schließen der Tore durch die Einwohner, seine Ergreifung und die Tötung aller seiner Begleiter mit dem Schwert. Das deutsche Plusquamperfekt in „Als … hineingegangen war“ ist in diesem temporalen Erzählzusammenhang idiomatisch und verändert die aoristische Vorzeitigkeit nicht. „Alle, die mit ihm gekommen waren“ gibt πάντας τοὺς συνελθόντας μετʼ αὐτοῦ sachgerecht wieder, ohne die im Griechischen nicht ausdrücklich formulierte lokale Nuance zusätzlich festzulegen.'
