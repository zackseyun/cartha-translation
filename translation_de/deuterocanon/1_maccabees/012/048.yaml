base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/048.yaml
  text: But when Jonathan entered Ptolemais[a], the men of Ptolemais shut the gates and seized him, and they killed with the sword all who had come with him.
translation:
  language: de
  text: Als Jonatan aber nach Ptolemaïs hineingegangen war, schlossen die Einwohner von Ptolemaïs die Tore, ergriffen ihn und töteten alle, die mit ihm gekommen waren, mit dem Schwert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als … aber
  rationale: Gibt sowohl den zeitlichen Übergang als auch die adversative Wendung der Handlung natürlich wieder.
- source_word: εἰσῆλθεν
  choice: hineingegangen war
  rationale: Bezeichnet die Bewegung in die Stadt hinein; das Plusquamperfekt fügt sich im Deutschen natürlich in den mit „als“ eingeleiteten temporalen Nebensatz.
- source_word: Πτολεμαΐδα
  choice: Ptolemaïs
  rationale: Im Deutschen gebräuchliche, quellennah transliterierte Form des Ortsnamens.
- source_word: ἀπέκλεισαν
  choice: schlossen
  rationale: Im Zusammenhang mit „die Tore“ eine klare und idiomatische Wiedergabe, ohne ein zusätzliches Verriegeln ausdrücklich einzutragen.
- source_word: οἱ Πτολεμαεῖται
  choice: die Einwohner von Ptolemaïs
  rationale: Das Ethnikon bezeichnet die Menschen beziehungsweise Bürger der Stadt; „Einwohner“ ist verständlich und geschlechtsübergreifend.
- source_word: συνέλαβον
  choice: ergriffen
  rationale: Bewahrt den Sinn des gewaltsamen Sichbemächtigens, ohne einen förmlichen Rechtsvorgang wie bei „verhafteten“ vorauszusetzen.
- source_word: πάντας τοὺς συνελθόντας μετʼ αὐτοῦ
  choice: alle, die mit ihm gekommen waren
  rationale: Gibt das substantivierte Partizip und μετʼ αὐτοῦ direkt wieder. Ein ausdrückliches „hineingekommen“ wird nicht ergänzt, da die lokale Beziehung aus dem Kontext hervorgeht.
- source_word: ἀπέκτειναν ἐν ῥομφαίᾳ
  choice: töteten … mit dem Schwert
  rationale: Klare, moderne Wiedergabe des griechischen Ausdrucks für gewaltsames Töten durch die Schwertwaffe.
