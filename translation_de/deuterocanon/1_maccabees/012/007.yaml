base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/007.yaml
  text: Even earlier[a], letters were sent to Onias the high priest from Areus, who was ruling among you, saying, ‘You are our brothers,’ as the copy laid out here shows.
translation:
  language: de
  text: 'Schon früher wurden von Areus, der bei euch herrschte, Briefe an den Hohepriester Onias gesandt. Darin hieß es: »Ihr seid unsere Brüder«, wie die nachstehende Abschrift zeigt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die hier beigefügte Abschrift zeigt“. Der griechische Ausdruck besagt, dass eine Abschrift des früheren Schreibens nachfolgend oder als Anlage wiedergegeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι πρότερον
  choice: Schon früher
  rationale: Die Wendung bezeichnet betont einen Zeitpunkt vor dem gegenwärtigen Briefwechsel. „Schon früher“ gibt sowohl den zeitlichen Vergleich als auch die verstärkende Wirkung von ἔτι natürlich wieder.
- source_word: ἀπεστάλησαν ἐπιστολαὶ
  choice: Briefe wurden … gesandt
  rationale: Der griechische Plural wird bewahrt; „gesandt“ entspricht dem würdevollen historischen Erzählregister.
- source_word: πρὸς Ὀνίαν τὸν ἀρχιερέα
  choice: an den Hohepriester Onias
  rationale: πρός bezeichnet hier das Ziel der Sendung; Titel und Name werden in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: παρὰ δʼ Ἀρείου
  choice: von Areus
  rationale: παρά mit Genitiv kennzeichnet die Herkunft beziehungsweise den Absender der Briefe.
- source_word: τοῦ βασιλεύοντος ἐν ὑμῖν
  choice: der bei euch herrschte
  rationale: Die Formulierung bewahrt den verbalen Charakter des Partizips und gibt ἐν ὑμῖν mit „bei euch“ wieder, ohne das Verhältnis durch „über euch“ unnötig zu präzisieren.
- source_word: ὅτι ἐστὲ ἀδελφοὶ ἡμῶν
  choice: 'Darin hieß es: »Ihr seid unsere Brüder«'
  rationale: ὅτι leitet hier den Inhalt der Briefe ein. Direkte Rede ist im Deutschen klar und natürlich; „Brüder“ bewahrt die konkrete Verwandtschaftsbehauptung von ἀδελφοί.
- source_word: ὡς τὸ ἀντίγραφον ὑπόκειται
  choice: wie die nachstehende Abschrift zeigt
  rationale: ἀντίγραφον bezeichnet eine Abschrift oder dokumentarische Kopie. ὑπόκειται weist darauf hin, dass sie im Anschluss vorgelegt beziehungsweise wiedergegeben wird.
