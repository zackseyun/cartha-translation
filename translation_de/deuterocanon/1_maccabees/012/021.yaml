  yaml_path: translation/deuterocanon/1_maccabees/012/021.yaml
  text: It was found in a writing concerning both the Spartans and the Jews that they are brothers and that they are of the family line of Abraham[a][b].
translation:
  language: de
  text: Es fand sich in einer Schrift, die sowohl die Spartaner als auch die Juden betrifft, dass sie Brüder sind und von Abraham abstammen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einer Urkunde« oder »in einer Aufzeichnung«. Das griechische Wort bezeichnet hier eine schriftliche Quelle und meint nicht notwendig die Heilige Schrift.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die in der angeführten Schrift behauptete gemeinsame Abstammung von Abraham.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρέθη
  choice: wurde gefunden
  rationale: Der Aorist Passiv wird als schlichtes erzählendes Präteritum wiedergegeben; die unpersönliche Passivform bleibt erhalten.
- source_word: ἐν γραφῇ
  choice: in einer Schrift
  rationale: γραφή bezeichnet hier eine schriftliche Quelle, Urkunde oder Aufzeichnung und nicht notwendig die Heilige Schrift. „Schrift“ bewahrt die Breite des Ausdrucks; die Fußnote klärt die mögliche Bedeutung.
- source_word: περὶ τε τῶν Σπαρτιατῶν καὶ Ἰουδαίων
  choice: über die Spartaner und die Juden
  rationale: περί mit Genitiv bedeutet „über/betreffend“. Die koordinierende Verbindung τε … καί wird im natürlichen Deutschen durch „und“ wiedergegeben.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die maskuline Pluralform bezeichnet hier die behauptete verwandtschaftliche Verbundenheit zweier Völker. „Brüder“ erhält die konkrete Bildsprache und schwächt sie nicht zu bloßer politischer Freundschaft ab.
- source_word: ἐκ γένους Ἀβραάμ
  choice: von Abraham abstammen
  rationale: γένος bezeichnet Herkunft oder Abstammung. Die verbale Wiedergabe ist im modernen Deutschen natürlicher als „aus dem Geschlecht Abrahams“, ohne den Sinn zu verändern.
theological_decisions:
- issue: Art der behaupteten Beziehung zwischen Spartanern und Juden
  choice: Die Aussage wird als behauptete Bruderschaft und gemeinsame Abstammung wiedergegeben.
  alternative: Die Beziehung als politische Freundschaft oder Bündnisgemeinschaft umschreiben.
  rationale: Der griechische Text spricht ausdrücklich von „Brüdern“ und von der Herkunft aus Abrahams Geschlecht. Die Übersetzung bewahrt diese Behauptung, ohne ihre historische Richtigkeit selbst zu bestätigen; die Distanz ergibt sich aus der Einbettung als Fund in einer Schrift.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Text relativ eng, wird jedoch bei ἐκ γένους idiomatisch als „von Abraham abstammen“ formuliert. Die Fußnotenmarker stehen beide im Haupttext.
