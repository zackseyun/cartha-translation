  text: Arius[a], der König der Spartaner, grüßt den Hohepriester Onias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Ἄρης (Ares); in diesem historischen Zusammenhang wird der Name des spartanischen Königs gewöhnlich als Arius wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρης
  choice: Arius
  rationale: Der Personenname wird in diesem historischen Zusammenhang nach der üblichen Namensform für den spartanischen König wiedergegeben. Die griechische Form lautet wörtlich Ares; diese echte Namensvariante wird in einer Fußnote kenntlich gemacht.
- source_word: βασιλεὺς Σπαρτιατῶν
  choice: der König der Spartaner
  rationale: Der Genitiv Plural bezeichnet ausdrücklich das Volk der Spartaner, nicht lediglich die Stadt Sparta.
- source_word: Ὀνείᾳ ἱερεῖ μεγάλῳ
  choice: den Hohepriester Onias
  rationale: In der Briefanschrift bezeichnet der Dativ den Empfänger. ἱερεὺς μέγας ist die feste Amtsbezeichnung »Hohepriester«.
- source_word: χαίρειν
  choice: grüßt
  rationale: In der antiken Briefformel dient χαίρειν als Gruß. Die deutsche Formulierung bildet die knappe Absender-Empfänger-Formel natürlich ab.
theological_decisions: []
