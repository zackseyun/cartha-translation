  yaml_path: translation/deuterocanon/1_maccabees/012/024.yaml
  text: And Jonathan heard that Demetrius’s commanders had returned with a much larger force than before to make war against him.
translation:
  language: de
  text: Und Jonatan hörte, dass die Heerführer des Demetrius mit einer viel größeren Streitmacht als zuvor zurückgekehrt waren, um gegen ihn Krieg zu führen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte
  rationale: Das schlichte narrative Aoristverb bezeichnet hier, dass Jonatan eine Nachricht erhielt; „hörte“ bleibt natürlich und legt die Art der Übermittlung nicht näher fest.
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: die Heerführer des Demetrius
  rationale: ἄρχοντες kann Herrscher, Anführer oder Amtsträger bezeichnen. Im Zusammenhang einer zurückkehrenden Streitmacht gibt „Heerführer“ die militärische Funktion treffend wieder, ohne ihnen eigenständige Herrschergewalt zuzuschreiben.
- source_word: ἐπέστρεψαν
  choice: zurückgekehrt waren
  rationale: Das Verb bezeichnet die Rückkehr. Das Plusquamperfekt ordnet diese Handlung im Deutschen natürlich vor Jonatans Hören ein.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: mit einer viel größeren Streitmacht
  rationale: δύναμις bezeichnet im militärischen Kontext eine Truppenmacht. Zusammen mit ὑπὲρ τὸ πρότερον wird die größere Stärke gegenüber früher idiomatisch ausgedrückt.
- source_word: ὑπὲρ τὸ πρότερον
  choice: als zuvor
  rationale: Die Wendung stellt einen Vergleich mit der früheren Streitmacht her; „als zuvor“ ist knapp und natürlich.
- source_word: τοῦ πολεμῆσαι πρὸς αὐτόν
  choice: um gegen ihn Krieg zu führen
  rationale: Der artikulierte Infinitiv drückt den Zweck aus. „Krieg führen“ bewahrt die umfassendere militärische Bedeutung von πολεμέω gegenüber einem bloßen Einzelgefecht.
