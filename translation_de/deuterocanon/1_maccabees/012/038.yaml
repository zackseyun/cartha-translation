  yaml_path: translation/deuterocanon/1_maccabees/012/038.yaml
  text: And Simon rebuilt Adida in the Shephelah[b][a], and fortified it with gates and bars.
translation:
  language: de
  text: Und Simon baute Adida in der Schefela[a] wieder auf[b] und befestigte sie mit Toren und Riegeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Schefela ist das Hügelland zwischen dem judäischen Bergland und der Küstenebene; auch: „in der Niederung“.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „baute Adida auf“; das griechische Verb kann je nach Zusammenhang „bauen“ oder „wieder aufbauen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: baute … wieder auf
  rationale: Das Verb kann sowohl „bauen“ als auch kontextabhängig „wieder aufbauen“ bezeichnen. Da Adida als bestehender Ort vorausgesetzt ist und der Zusammenhang militärische Sicherungsmaßnahmen schildert, ist „wieder aufbauen“ hier natürlich; die allgemeinere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: τὴν Ἀδιδὰ
  choice: Adida
  rationale: Der Ortsname wird in einer dem griechischen Ἀδιδά entsprechenden deutschen Form wiedergegeben.
- source_word: ἐν τῇ σεφηλά
  choice: in der Schefela
  rationale: σεφηλά bezeichnet die als Schefela bekannte Hügelland- beziehungsweise Niederungsregion Judas. Der geografische Eigenname ist präziser als eine verallgemeinernde Übersetzung.
- source_word: ὠχύρωσεν
  choice: befestigte
  rationale: Das Verb bezeichnet das Wehrhaft- oder Verteidigungsfähig-Machen eines Ortes; „befestigte“ ist dafür der natürliche militärische Ausdruck.
- source_word: θύρας
  choice: Toren
  rationale: Im Zusammenhang einer Stadtbefestigung sind Stadttore, nicht gewöhnliche Türen, gemeint.
- source_word: μοχλούς
  choice: Riegeln
  rationale: Gemeint sind massive Verschlussriegel zur Sicherung der Tore; „Riegel“ bewahrt das konkrete Befestigungsbild.
