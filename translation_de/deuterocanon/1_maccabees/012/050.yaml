  yaml_path: translation/deuterocanon/1_maccabees/012/050.yaml
  text: And they learned that he had been captured and had perished[a], and those with him; and they encouraged one another and went on in close formation, ready for battle.
translation:
  language: de
  text: Und sie erfuhren, dass er gefangen genommen worden und umgekommen war, ebenso die, die bei ihm waren. Da machten sie einander Mut[a] und zogen in geschlossener Formation weiter, zum Kampf bereit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie fassten Mut«. Wörtlich steht im Griechischen: »sie ermutigten sich selbst«; bei einer Gruppe kann dies gegenseitige Stärkung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: sie erfuhren
  rationale: Das Verb bezeichnet hier das Erlangen beziehungsweise Erkennen einer Nachricht; »sie erfuhren« ist im erzählenden Zusammenhang natürlich.
- source_word: συνελήμφθη
  choice: gefangen genommen worden
  rationale: Der Aorist Passiv von συλλαμβάνω bezeichnet in diesem militärischen Zusammenhang am ehesten eine Gefangennahme.
- source_word: ἀπώλωλεν
  choice: umgekommen war
  rationale: Das Perfekt von ἀπόλλυμι besagt, dass er zugrunde gegangen beziehungsweise tot war, ohne die Todesart näher festzulegen.
- source_word: οἱ μετʼ αὐτοῦ
  choice: seine Begleiter
  rationale: Die knappe griechische Wendung meint diejenigen, die bei ihm waren. »Seine Begleiter« bleibt allgemein und ist im Deutschen flüssiger als eine wörtliche Nachbildung.
- source_word: παρεκάλεσαν ἑαυτούς
  choice: sie machten einander Mut
  rationale: Die reflexive Form bezeichnet bei einer Gruppe eine gegenseitige Stärkung. Die gewählte Formulierung ist idiomatisch und bewahrt diesen wechselseitigen Sinn.
- source_word: ἐπορεύοντο
  choice: zogen … weiter
  rationale: Das gewöhnliche Bewegungsverb erhält hier durch den militärischen Kontext die passende, aber nicht übermäßig spezifizierende Wiedergabe »zogen weiter«.
- source_word: συνεστραμμένοι
  choice: in geschlossener Formation
  rationale: Das Partizip beschreibt ein enges Zusammenschließen; im militärischen Zusammenhang gibt »in geschlossener Formation« den Sinn klar wieder.
- source_word: ἕτοιμοι εἰς πόλεμον
  choice: zum Kampf bereit
  rationale: Die Wendung bezeichnet unmittelbare Kampfbereitschaft; »Kampf« passt hier besser zur konkreten Lage als das weiter gefasste »Krieg«.
