base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/049.yaml
  text: And Tryphon sent forces and cavalry into Galilee[a], into the great plain, to destroy all those who were with Jonathan.
translation:
  language: de
  text: Und Tryphon schickte Truppen und Reiterei nach Galiläa, in die große Ebene, um alle zu vernichten, die bei Jonatan waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die auf Jonatans Seite standen«. Wörtlich: »die bei Jonatan waren«; gemeint sind wahrscheinlich seine Anhänger oder seine Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Das Aoristverb bezeichnet hier das Entsenden militärischer Kräfte. »Schickte« ist im modernen Deutsch natürlich und gibt den Vorgang ohne unnötige Spezifizierung wieder.
- source_word: δυνάμεις
  choice: Truppen
  rationale: Der Plural bezeichnet in diesem Zusammenhang militärische Einheiten, nicht abstrakte »Mächte«. »Truppen« ist klar und legt keine bestimmte Waffengattung fest.
- source_word: ἵππον
  choice: Reiterei
  rationale: Der formal singularische Ausdruck wird kollektiv für berittene Truppen gebraucht. »Reiterei« bildet diesen kollektiven militärischen Sinn idiomatisch ab.
- source_word: εἰς Γαλιλαίαν
  choice: nach Galiläa
  rationale: Bei geografischen Zielangaben ist »nach Galiläa« die natürliche deutsche Entsprechung für die durch εἰς bezeichnete Bewegung.
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: in die große Ebene
  rationale: Das wiederholte εἰς bezeichnet erneut das Ziel; πεδίον bedeutet »Ebene«, und τὸ μέγα ist attributiv. Die geografische Bezeichnung bleibt bewusst wörtlich.
- source_word: τοῦ ἀπολέσαι
  choice: um … zu vernichten
  rationale: Der artikulierte Infinitiv drückt den Zweck aus. »Vernichten« bewahrt die starke, militärisch-tödliche Bedeutung, ohne sie auf eine einzelne Handlungsweise einzuengen.
- source_word: πάντας τοὺς παρὰ Ἰωνάθου
  choice: alle …, die bei Jonatan waren
  rationale: παρά mit dem Personennamen bezeichnet hier Nähe, Zugehörigkeit oder Gefolgschaft. Die Formulierung bewahrt diese Bedeutungsbreite und legt sich nicht ausschließlich auf Anhänger oder Soldaten fest.
