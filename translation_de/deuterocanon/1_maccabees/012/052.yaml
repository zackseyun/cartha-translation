base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/052.yaml
  text: And they all came in peace into the land of Judah[a], and they mourned for Jonathan and those with him, and they were greatly afraid; and Israel mourned with great mourning.
translation:
  language: de
  text: Sie kamen alle wohlbehalten ins Land Juda und trauerten um Jonatan und die, die bei ihm waren; sie fürchteten sich sehr. Israel trauerte in großer Trauer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Israel trauerte eine große Trauer.“ Das Griechische verstärkt die Aussage durch die Verbindung von Verb und Substantiv desselben Wortstamms.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πάντες
  choice: sie kamen alle
  rationale: Bewahrt sowohl die erzählerische Bewegung als auch die ausdrückliche Gesamtheit der Zurückkehrenden.
- source_word: μετʼ εἰρήνης
  choice: wohlbehalten
  rationale: Die Wendung bezeichnet hier im Zusammenhang die sichere, unbehelligte Rückkehr. „Wohlbehalten“ gibt diesen idiomatischen Sinn im heutigen Deutsch natürlicher wieder als das missverständliche „in Frieden“.
- source_word: εἰς γῆν Ἰούδα
  choice: ins Land Juda
  rationale: Gibt γῆ ausdrücklich wieder und bewahrt „Juda“ als traditionelle Gebietsbezeichnung, ohne die spätere römische Provinzbezeichnung „Judäa“ einzutragen.
- source_word: ἐπένθησαν τὸν Ἰωνάθαν
  choice: trauerten sie um Jonatan
  rationale: „Um jemanden trauern“ ist die natürliche deutsche Entsprechung für die Trauer um einen vermissten oder für tot gehaltenen Menschen.
- source_word: τοὺς μετʼ αὐτοῦ
  choice: seine Begleiter
  rationale: Eine knappe, natürliche Wiedergabe der Personen, die bei Jonatan waren, ohne ihren genaueren Status festzulegen.
- source_word: ἐφοβήθησαν σφόδρα
  choice: fürchteten sich sehr
  rationale: Bewahrt das starke Verb und den ausdrücklichen Intensivierer σφόδρα in schlichtem, würdigem Deutsch.
- source_word: ἐπένθησεν Ἰσραὴλ πένθος μέγα
  choice: Israel hielt große Trauer
  rationale: Gibt die nachdrückliche Verbindung des verwandten Verbs und Substantivs verständlich und feierlich wieder; die ungewöhnliche griechische Ausdrucksform wird in der Fußnote offengelegt.
