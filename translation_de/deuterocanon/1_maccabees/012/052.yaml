  naturalness: Der Text ist modernes, gut verständliches Standarddeutsch. „Wohlbehalten“ ist für μετʼ εἰρήνης im erzählerischen Zusammenhang eine vertretbare idiomatische Wiedergabe. „Israel trauerte in großer Trauer“ ist zwar leicht feierlich, bleibt aber verständlich und bildet die griechische Nachdrücklichkeit besser ab als „hielt große Trauer“.
