base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/003.yaml
  text: And they went to Rome[a], and they entered the council chamber, and said, “Jonathan the high priest and the nation of the Jews have sent us to renew with them the alliance as before.”
translation:
  language: de
  text: 'Sie gingen nach Rom, betraten den Ratssaal[a] und sagten: »Jonatan, der Hohepriester, und das Volk der Juden haben uns gesandt, um mit ihnen das Bündnis wie zuvor zu erneuern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Sitzungssaal des Rates«; das griechische Wort bezeichnet den Versammlungsort des regierenden Rates, ohne ausdrücklich den formalen römischen Institutionstitel »Senat« zu verwenden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: gingen
  rationale: Das Verb bezeichnet hier schlicht die Fortbewegung beziehungsweise Reise. »Gingen« ist natürlich und gibt die zweimalige griechische Form durch zwei aufeinanderfolgende Handlungen wieder, ohne den Stil unnötig anzuheben.
- source_word: βουλευτήριον
  choice: Ratssaal
  rationale: Das Wort bezeichnet konkret den Versammlungsort eines regierenden Rates. »Ratssaal« wahrt diesen örtlichen Sinn und legt nicht vorschnell den formalen römischen Institutionstitel »Senat« fest.
- source_word: Ἰωναθὰν ὁ ἀρχιερεύς
  choice: der Hohe Priester Jonatan
  rationale: ἀρχιερεύς ist die übliche Bezeichnung für den Hohen Priester. Die deutsche Wortstellung ist würdig und gut verständlich.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: das Volk der Juden
  rationale: ἔθνος bezeichnet hier die Juden als politisch-gesellschaftliche Gemeinschaft. »Volk« klingt im Deutschen natürlicher als »Nation«, ohne den kollektiven Sinn abzuschwächen.
- source_word: ἀπέστειλαν ἡμῖς
  choice: haben uns gesandt
  rationale: Die präsentische Relevanz des erteilten Auftrags lässt sich in der direkten Rede idiomatisch mit dem Perfekt ausdrücken. Das überlieferte ἡμῖς steht formal für »uns« und wird entsprechend wiedergegeben.
- source_word: ἀνανεώσασθαι
  choice: zu erneuern
  rationale: Das Verb bedeutet, etwas wieder neu beziehungsweise erneut gültig zu machen; »erneuern« ist im diplomatischen Zusammenhang präzise und geläufig.
- source_word: συμμαχίαν
  choice: Bündnis
  rationale: συμμαχία bezeichnet eine politische oder militärische Bündnisbeziehung. »Bündnis« ist klar und vermeidet die engere Festlegung auf einen bestimmten Vertragstyp.
- source_word: κατὰ τὸ πρότερον
  choice: wie zuvor
  rationale: Die Wendung verweist auf den früheren Zustand der Beziehungen. »Wie zuvor« ist knapp, idiomatisch und bewahrt diesen Rückbezug.
theological_decisions:
- issue: Bezug und Funktion von αὐτοῖς
  choice: mit ihnen
  alternative: für sie / in ihrem Namen
  rationale: Der Dativ kann im diplomatischen Zusammenhang eine wechselseitige Beziehung oder ein Handeln zugunsten der Entsender ausdrücken. Die Wiedergabe »mit ihnen« folgt der naheliegenden Verbindung mit »Bündnis«, bewahrt jedoch die auffällige dritte Person und löst den Bezug nicht stillschweigend in »mit euch« auf.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper erzählerischer Syntax. Die Wiederholung des griechischen Bewegungsverbs wird im Deutschen durch die Abfolge »gingen …, betraten …« natürlich geglättet. »Auch« gibt das additive καί vor τὴν συμμαχίαν wieder, ohne ein im vorliegenden Vers nicht genanntes weiteres Abkommen zu ergänzen.
