lexical_decisions:
- source_word: ἀντίγραφον
  choice: eine Abschrift
  rationale: Das Substantiv bezeichnet eine schriftliche Kopie oder Abschrift. „Abschrift“ passt zum dokumentarischen Zusammenhang und klingt im Deutschen natürlich.
- source_word: ἐπιστολῶν
  choice: der Briefe
  rationale: Die griechische Form steht im Plural. Dieser wird beibehalten, auch wenn der folgende Zusammenhang eine einzelne konkrete Mitteilung wiedergibt.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Das Verb bedeutet hier unmittelbar „schreiben“; eine deutendere Wiedergabe wie „sandte“ ist nicht erforderlich.
- source_word: Ἰωνάθαν
  choice: Jonatan
  rationale: Die im modernen deutschen Bibelgebrauch übliche Form des Personennamens.
- source_word: Σπαρτιάταις
  choice: an die Spartaner
  rationale: Der Dativ bezeichnet die Empfänger; „an die Spartaner“ ist die direkte und idiomatische deutsche Wiedergabe.
