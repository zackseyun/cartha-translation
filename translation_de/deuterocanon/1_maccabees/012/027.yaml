review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft Ablauf, militärischen Kontext und die Aufstellung von Wachen zutreffend. »Ihre Waffen bereitzuhalten« gibt εἶναι ἐπὶ τοῖς ὅπλοις jedoch nicht ganz präzise wieder: Die Wendung bezeichnet den Zustand, unter Waffen bzw. bei den Waffen zu stehen, nicht primär das Bereithalten der Waffen als Handlung.'
  naturalness: Der Text ist insgesamt natürliches modernes Standarddeutsch. Die Folge »ihre Waffen bereitzuhalten, um ... bereit zu sein« wirkt jedoch semantisch doppelt und verschiebt die Koordination der drei Infinitive. Eine parallele Infinitivreihe ist klarer und näher am Griechischen.
  terminology: »Jonatan«, »Lager«, »Wachposten« und »Kampf« sind angemessen. »Unter Waffen zu stehen« ist eine verständliche, sachlich-militärische Wiedergabe der griechischen Idiomatik.
  issues:
  - severity: medium
    issue: Die Wiedergabe von εἶναι ἐπὶ τοῖς ὅπλοις als »ihre Waffen bereitzuhalten«
    rationale: Das Griechische meint, dass die Männer unter Waffen bzw. bei ihren Waffen sein sollten. Die deutsche Formulierung legt stärker eine Tätigkeit des Bereithaltens der Waffen nahe und führt zudem zu einer unnötigen Verdoppelung mit »zum Kampf bereit zu sein«.
  revised_text: Als die Sonne untergegangen war, befahl Jonatan denen, die bei ihm waren, wach zu bleiben, unter Waffen zu stehen und sich die ganze Nacht hindurch zum Kampf bereitzuhalten. Und er stellte rings um das Lager Wachposten auf.
  revised_footnotes: []
  revision_rationale: Die Änderung stellt die drei griechischen Infinitive als koordinierte Befehlsinhalte dar und gibt die militärische Wendung εἶναι ἐπὶ τοῖς ὅπλοις mit »unter Waffen zu stehen« idiomatisch und genauer wieder. »Und« bewahrt den schlichten Anschluss von καί ohne zusätzliche Nuance.
