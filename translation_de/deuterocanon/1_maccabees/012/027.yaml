revisions:
- from: Als die Sonne untergegangen war, befahl Jonatan denen, die bei ihm waren, wach zu bleiben und ihre Waffen bereitzuhalten, um die ganze Nacht hindurch zum Kampf bereit zu sein. Außerdem stellte er rings um das Lager Wachposten auf.
  to: Als die Sonne untergegangen war, befahl Jonatan denen, die bei ihm waren, wach zu bleiben, unter Waffen zu stehen und sich die ganze Nacht hindurch zum Kampf bereitzuhalten. Und er stellte rings um das Lager Wachposten auf.
  rationale: Die Änderung stellt die drei griechischen Infinitive als koordinierte Befehlsinhalte dar und gibt die militärische Wendung εἶναι ἐπὶ τοῖς ὅπλοις mit »unter Waffen zu stehen« idiomatisch und genauer wieder. »Und« bewahrt den schlichten Anschluss von καί ohne zusätzliche Nuance.
