  yaml_path: translation/deuterocanon/1_maccabees/012/027.yaml
  text: When the sun had set, Jonathan commanded those with him to stay awake and remain at their weapons, to be ready for battle through the whole night; and he posted sentries around the camp.
translation:
  language: de
  text: Als die Sonne untergegangen war, befahl Jonatan denen, die bei ihm waren, wach zu bleiben, unter Waffen zu stehen und sich die ganze Nacht hindurch zum Kampf bereitzuhalten. Und er stellte rings um das Lager Wachposten auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἔδυ ὁ ἥλιος
  choice: Als die Sonne untergegangen war
  rationale: Die Formulierung gibt den Aorist als abgeschlossenes Untergehen wieder und markiert natürlich den Zeitpunkt des anschließenden Befehls.
- source_word: ἐπέταξεν
  choice: befahl
  rationale: Das Verb bezeichnet hier einen verbindlichen militärischen Befehl.
- source_word: τοῖς παρʼ αὐτοῦ
  choice: denen, die bei ihm waren
  rationale: Dies bleibt nahe an der wörtlichen Bedeutung und vermeidet die stärker deutende Eingrenzung auf »seine Männer«.
- source_word: γρηγορεῖν
  choice: wach zu bleiben
  rationale: Der Grundsinn der Wachheit bleibt erhalten; zugleich wird der Ausdruck nicht mit den anschließend eigens aufgestellten Wachposten gleichgesetzt.
- source_word: εἶναι ἐπὶ τοῖς ὅπλοις
  choice: ihre Waffen bereitzuhalten
  rationale: Die griechische militärische Wendung bezeichnet unmittelbare Einsatzbereitschaft mit griffbereiten Waffen; die deutsche Formulierung ist konkret und natürlich.
- source_word: ἑτοιμάζεσθαι εἰς πόλεμον
  choice: zum Kampf bereit zu sein
  rationale: Im unmittelbaren taktischen Zusammenhang ist »Kampf« passender als das weiter gefasste »Krieg«.
- source_word: διʼ ὅλης τῆς νυκτός
  choice: die ganze Nacht hindurch
  rationale: Die Wendung bewahrt die Betonung der vollständigen Dauer.
- source_word: ἐξέβαλεν προφύλακας
  choice: stellte ... Wachposten auf
  rationale: Das wörtliche »hinausschicken« beziehungsweise »hinausstellen« ist eine militärische Wendung für das Stationieren vorgeschobener Wachen; »Wachposten aufstellen« ist idiomatisch.
- source_word: κύκλῳ τῆς παρεμβολῆς
  choice: rings um das Lager
  rationale: παρεμβολή bezeichnet hier das Heerlager, während κύκλῳ dessen vollständige Umfassung ausdrückt.
