  yaml_path: translation/deuterocanon/1_maccabees/012/002.yaml
  text: And he sent letters to the Spartans and to other places in the same terms[a].
translation:
  language: de
  text: Auch an die Spartaner und an andere Orte sandte er Schreiben mit demselben Inhalt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in gleicher Weise“ beziehungsweise „entsprechende Schreiben“; die griechische Wendung besagt, dass diese Schreiben dem zuvor erwähnten inhaltlich entsprachen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte er
  rationale: Der Aorist Aktiv von ἀποστέλλω bezeichnet schlicht das Senden; „sandte er“ ist natürlich, würdevoll und wahrt die Erzählform.
- source_word: ἐπιστολὰς
  choice: Schreiben
  rationale: Der Akkusativ Plural bezeichnet mehrere Briefe beziehungsweise schriftliche Mitteilungen. „Schreiben“ gibt den Plural wieder und passt idiomatisch zu mehreren Empfängern.
- source_word: πρὸς Σπαρτιάτας
  choice: an die Spartaner
  rationale: πρός bezeichnet beim Senden die Adressaten; im Deutschen ist „an die Spartaner“ die natürliche Entsprechung.
- source_word: τόπους ἑτέρους
  choice: an andere Orte
  rationale: Die Wendung bedeutet wörtlich „andere Orte“. Eine genauere politische oder geografische Bestimmung wäre im griechischen Text nicht ausdrücklich gegeben.
- source_word: κατὰ ταὐτά
  choice: mit demselben Inhalt
  rationale: Die Wendung verweist auf eine Übereinstimmung mit dem zuvor erwähnten Schreiben. „Mit demselben Inhalt“ bringt den inhaltlichen Bezug klar zum Ausdruck, ohne völlige Wortgleichheit zwingend zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. „Schreiben“ vermeidet die im Deutschen etwas schwerfällige Verbindung „Briefe mit demselben Inhalt“, während die Fußnote die mögliche Spannweite von κατὰ ταὐτά bewahrt.
