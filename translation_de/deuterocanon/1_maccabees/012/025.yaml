  text: And he set out from Jerusalem and met them in the land of Hamath, for he gave them no respite to enter his land.
translation:
  language: de
  text: Da brach er von Jerusalem auf und zog ihnen bis ins Gebiet von Hamat entgegen; denn er ließ ihnen keine Zeit, in sein Land einzudringen.
