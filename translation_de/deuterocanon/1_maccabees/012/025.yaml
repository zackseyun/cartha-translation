lexical_decisions:
- source_word: ἀπῆρεν ἐξ Ἰερουσαλήμ
  choice: brach er von Jerusalem auf
  rationale: Gibt den militärisch-reisebezogenen Aufbruch natürlich und quellennah wieder.
- source_word: ἀπήντησεν αὐτοῖς
  choice: zog ihnen … entgegen
  rationale: Drückt eine gezielte entgegenkommende Bewegung aus und passt zum militärischen Zusammenhang.
- source_word: εἰς τὴν Ἀμαθεῖτιν χώραν
  choice: bis ins Gebiet von Hamat
  rationale: Χώρα bezeichnet hier das Gebiet bzw. Land um Hamat; „bis ins“ macht idiomatisch deutlich, wo er ihnen entgegentrat.
- source_word: ἀνοχὴν
  choice: keine Zeit
  rationale: Bezeichnet hier einen Aufschub oder Spielraum; im Deutschen vermittelt „keine Zeit lassen“ klar, dass er sofort handelte.
- source_word: ἐμβατεῦσαι
  choice: einzudringen
  rationale: Im militärischen Kontext ist das Betreten feindlichen Territoriums als Eindringen gemeint.
