  yaml_path: translation/deuterocanon/1_maccabees/012/042.yaml
  text: And Tryphon saw that he had come with a large force[a], and he was afraid to stretch out his hands against him.
translation:
  language: de
  text: Als Tryphon sah, dass Jonatan mit einer großen Streitmacht gekommen war, fürchtete er sich, Hand an ihn zu legen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Hände gegen ihn auszustrecken“; die griechische Wendung kann allgemein ein feindseliges Vorgehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: gekommen war
  rationale: Der Aorist von παρίστημι bezeichnet hier im erzählerischen Zusammenhang Jonatans Eintreffen mit Truppen. „Gekommen war“ gibt dies natürlich wieder, ohne den Vorgang unnötig genauer zu bestimmen.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: mit einer großen Streitmacht
  rationale: δύναμις bezeichnet in diesem militärischen Zusammenhang eine Truppenmacht, nicht bloß abstrakte Kraft. „Streitmacht“ wahrt den militärischen Sinn, ohne sie ausdrücklich als Heer einzuordnen.
- source_word: ἐκτείνειν χεῖρας ἐπʼ αὐτόν
  choice: Hand an ihn zu legen
  rationale: Die griechische Wendung lautet wörtlich „die Hände gegen ihn auszustrecken“ und bezeichnet feindseliges Vorgehen. Die deutsche Wendung ist verständlich und lässt offen, ob Ergreifen, Gewaltanwendung oder ein Angriff gemeint ist; der Wortlaut wird in der Fußnote bewahrt.
- source_word: ηὐλαβήθη
  choice: scheute er sich
  rationale: Das Verb verbindet Furcht mit vorsichtigem Zurückschrecken. „Scheute er sich“ passt zum unmittelbaren militärischen Anlass und bewahrt diese Bedeutungsbreite besser als eine rein emotionale Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Jonatan wird zur eindeutigen Zuordnung des im Griechischen nur in der Verbform enthaltenen Subjekts ausdrücklich genannt; dadurch werden die im Deutschen sonst missverständlichen Pronomen vermieden.
