base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/006.yaml
  text: Jonathan the high priest of the nation[a], and the council of elders, and the priests, and the rest of the people of the Jews, to their Spartan brothers[b], greetings.
translation:
  language: de
  text: 'Jonathan, der Hohepriester des Volkes, der Ältestenrat, die Priester und das übrige Volk der Juden an die spartanischen Brüder: Gruß.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ ist hier Sprache diplomatischer Verbundenheit und muss keine buchstäbliche Geschwisterschaft bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχιερεὺς τοῦ ἔθνους
  choice: der Hohepriester des Volkes
  rationale: Bewahrt die ausdrückliche Zugehörigkeitsangabe τοῦ ἔθνους und gibt ἔθνος hier als das jüdische Gemeinwesen wieder; „Volk“ klingt im Deutschen natürlicher als „Nation“, ohne den politisch-kollektiven Sinn auszuschließen.
- source_word: ἡ γερουσία
  choice: der Ältestenrat
  rationale: Bezeichnet das leitende Gremium der Ältesten und ist für heutige Leser transparenter als „Senat“.
- source_word: ὁ λοιπὸς δῆμος τῶν Ἰουδαίων
  choice: das übrige Volk der Juden
  rationale: Erhält die Unterscheidung zwischen den zuvor genannten Amtsträgern und dem übrigen jüdischen Gemeinwesen; die etwas markierte Formulierung folgt der Struktur des Griechischen.
- source_word: Σπαρτιάταις
  choice: spartanischen
  rationale: Die übliche und klare deutsche Bezeichnung für die Adressaten aus Sparta.
- source_word: τοῖς ἀδελφοῖς
  choice: Brüder
  rationale: Gibt die ausdrückliche diplomatische Verwandtschaftssprache des Griechischen wieder, ohne sie zu verallgemeinern oder abzuschwächen.
- source_word: χαίρειν
  choice: grüßen
  rationale: Gibt die konventionelle hellenistische Briefformel in einer natürlichen deutschen Satzkonstruktion wieder.
theological_decisions:
- issue: Bedeutung von „Brüder“ in der diplomatischen Anrede
  choice: Die Spartaner werden als „Brüder“ bezeichnet.
  alternative: Verwandte; Freunde
  rationale: Der Wortlaut behauptet eine diplomatische oder ethnische Verbundenheit. Die Übersetzung wahrt diese Aussage, ohne buchstäbliche Geschwisterschaft vorauszusetzen oder die historische Behauptung zu bewerten.
- issue: Wiedergabe von Ἰουδαίων
  choice: Juden
  alternative: Judäer
  rationale: Der Ausdruck kann ethnische, politische und religiöse Zugehörigkeit verbinden. „Juden“ ist im Deutschen hier die natürliche kollektive Bezeichnung; die mögliche judäische Nuance wird nicht dogmatisch eingeengt.
translation_notes:
  register: Moderne, würdevolle Briefsprache. Die griechische Absenderformel wird als natürlicher deutscher Satz mit „grüßen“ gestaltet. Die Aufzählung der Absender und die ausdrücklich genannte Zugehörigkeit des Hohenpriesters zum Volk bleiben erhalten.
