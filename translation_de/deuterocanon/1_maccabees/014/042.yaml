base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/042.yaml
  text: and that he should be their commander[a], and that he should take thought for the sanctuary, and appoint men over their works and over the country and over the weapons and over the strongholds.
translation:
  language: de
  text: und dass er ihr Heerführer sein und für das Heiligtum[a] Sorge tragen sollte und Männer über ihre Arbeiten, über das Land, über die Waffen und über die Festungen einsetzen sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: für die heiligen Dinge oder für den heiligen Ort; der überlieferte griechische Wortlaut ist hier schwierig.'
    reason: alternative_reading
lexical_decisions:
- source_word: στρατηγόν
  choice: Heerführer
  rationale: στρατηγός bezeichnet hier einen militärischen Befehlshaber. „Heerführer“ bewahrt den militärischen Sinn, ohne einen bestimmten modernen Dienstrang vorauszusetzen.
- source_word: μέλῃ αὐτῷ περὶ
  choice: für … Sorge tragen sollte
  rationale: Die Wendung bezeichnet verantwortliche Fürsorge und passt in den feierlich-amtlichen Stil des Beschlusses.
- source_word: τῶν Α ἅγιον
  choice: das Heiligtum
  rationale: Im Zusammenhang liegt ein Bezug auf den heiligen Bereich beziehungsweise das Heiligtum nahe. Da der überlieferte griechische Wortlaut schwierig ist, wird die mögliche allgemeinere Bedeutung in einer Fußnote erhalten.
- source_word: καθιστάναι
  choice: Männer … einsetzen
  rationale: Das Verb bedeutet hier, Personen mit Aufsichtsfunktionen zu betrauen. „Männer“ wird als im Deutschen notwendiges Objekt aus dem administrativen Zusammenhang ergänzt.
- source_word: τῶν ἔργων αὐτῶν
  choice: ihre Arbeiten
  rationale: Die Wiedergabe bleibt nahe bei ἔργα und lässt offen, ob konkrete Arbeiten, Vorhaben oder Amtsgeschäfte gemeint sind.
- source_word: χώρας
  choice: das Land
  rationale: χώρα bezeichnet hier das unterstellte Land beziehungsweise Gebiet; „Land“ ist natürlich und wahrt die Breite des Ausdrucks.
- source_word: ὅπλων
  choice: die Waffen
  rationale: ὅπλα bezeichnet Waffen beziehungsweise militärische Ausrüstung; „Waffen“ ist die klare heutige Entsprechung.
- source_word: ὀχυρωμάτων
  choice: die Festungen
  rationale: ὀχυρώματα sind befestigte militärische Plätze; „Festungen“ gibt dies knapp und verständlich wieder.
theological_decisions:
- issue: Bezug der schwierigen Wortfolge τῶν Α ἅγιον
  choice: Im Haupttext steht „das Heiligtum“.
  alternative: „die heiligen Dinge“ oder „der heilige Ort“
  rationale: Die überlieferte griechische Form ist nicht glatt. Der Kontext begünstigt „Heiligtum“, doch die allgemeinere sakrale Bedeutung darf nicht stillschweigend ausgeschlossen werden und wird daher in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem amtlichen Ton eines Beschlusses. Die wiederholten Präpositionalgruppen bilden die administrative Aufzählung des Griechischen ab; „Heerführer“ vermeidet einen anachronistisch präzisen modernen Rangtitel.
