  text: For it was heard that the Jews are called friends and allies and brothers by the Romans[a], and that they received Simon’s envoys honorably.
translation:
  language: de
  text: Denn man hatte gehört, dass die Juden von den Römern Freunde, Verbündete und Brüder genannt werden und dass die Römer Simons Gesandte ehrenvoll empfangen hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Simons Gesandten ehrenvoll entgegengekommen waren“. Im Zusammenhang ist damit ein offizieller diplomatischer Empfang gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσθη
  choice: es war bekannt geworden
  rationale: Die unpersönliche Passivform besagt, dass die Nachricht vernommen worden und öffentlich bekannt geworden war. Diese Wiedergabe ist im modernen Deutschen natürlicher als das wörtliche „es wurde gehört“.
- source_word: προσηγορεῦνται
  choice: genannt werden
  rationale: Das Verb bezeichnet die Benennung oder Anrede mit einem Titel; „genannt werden“ bewahrt sowohl die Form als auch den diplomatisch-formellen Sinn.
- source_word: φίλοι
  choice: Freunde
  rationale: „Freunde“ gibt den direkten Sinn wieder und lässt zugleich den möglichen Charakter eines diplomatischen Ehrentitels erkennen.
- source_word: σύμμαχοι
  choice: Verbündete
  rationale: Dies ist die natürliche moderne Bezeichnung für Partner eines politischen oder militärischen Bündnisses.
- source_word: οἱ ἀδελφοί
  choice: Brüder
  rationale: Die ausdrücklich maskuline Bezeichnung wird beibehalten; im Zusammenhang bezeichnet sie ein brüderliches Verhältnis in diplomatischer Sprache.
- source_word: ἀπήντησαν
  choice: empfangen hatten
  rationale: Das Verb bedeutet wörtlich „begegneten“ oder „kamen entgegen“, bezeichnet hier aber im Zusammenhang mit Gesandten deren offizielle Aufnahme. Das Plusquamperfekt macht im Deutschen die zeitliche Vorordnung zur bekannt gewordenen Nachricht deutlich.
- source_word: πρεσβευταῖς
  choice: Gesandte
  rationale: Der Ausdruck bezeichnet offizielle Vertreter. „Gesandte“ ist präzise, würdig und im Deutschen idiomatisch.
- source_word: ἐνδόξως
  choice: ehrenvoll
  rationale: Das Adverb beschreibt eine ehrenvolle beziehungsweise angesehene Art der Aufnahme; „ehrenvoll“ ist knapp und kontextgerecht.
theological_decisions:
- issue: Wiedergabe von οἱ ἀδελφοί in einer diplomatischen Formel
  choice: Brüder
  alternative: Verwandte; Brüder und Schwestern
  rationale: Der griechische Ausdruck ist grammatisch maskulin und dient hier als formelle relationale Bezeichnung. Eine inklusive Erweiterung oder die Abschwächung zu „Verwandte“ würde die konkrete Form des Ausgangstextes verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die diplomatischen Titel bleiben direkt und formal. Das unpersönliche ἠκούσθη wird idiomatisch wiedergegeben; bei ἀπήντησαν erläutert die Fußnote die wörtlichere Lesart.
