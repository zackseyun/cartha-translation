  text: And all the people approved that Simon should act according to these words[a].
translation:
  language: de
  text: Und das ganze Volk beschloss, Simon zu beauftragen, nach diesen Worten[a] zu handeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach diesen Bestimmungen“. Wörtlich steht im Griechischen „nach diesen Worten“; gemeint sind wahrscheinlich die zuvor genannten Festlegungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησεν
  choice: stimmte zu
  rationale: Das Verb bezeichnet hier die gemeinsame Billigung beziehungsweise Zustimmung des Volkes. „Stimmte zu“ gibt den öffentlichen Beschluss natürlich wieder, ohne eine bloß emotionale Freude auszudrücken.
- source_word: πᾶς ὁ λαός
  choice: das ganze Volk
  rationale: Diese Wiedergabe bewahrt sowohl πᾶς als auch λαός und ist im Deutschen natürlicher als „alle Leute“.
- source_word: θέσθαι Σίμωνι ποιῆσαι
  choice: dass Simon … handeln sollte
  rationale: Die griechische Infinitivkonstruktion ist knapp und bezeichnet, was das Volk hinsichtlich Simons billigte. Der deutsche Nebensatz gibt dies verständlich wieder, ohne θέσθαι als ausdrückliche Ernennung zu überdeuten.
- source_word: ποιῆσαι
  choice: handeln
  rationale: Im politischen und administrativen Zusammenhang meint ποιέω die praktische Umsetzung des zuvor Festgelegten; „handeln“ ist hier präziser und natürlicher als das allgemeinere „tun“.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: nach diesen Worten
  rationale: Die Formulierung bleibt eng am griechischen Wortlaut und bewahrt, dass λόγοι wörtlich „Worte“ heißt, auch wenn damit wahrscheinlich die zuvor genannten Bestimmungen gemeint sind.
