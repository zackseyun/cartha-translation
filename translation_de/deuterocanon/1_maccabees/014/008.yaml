  yaml_path: translation/deuterocanon/1_maccabees/014/008.yaml
  text: And they were cultivating their land in peace[a], and the land was yielding its produce, and the trees of the fields their fruit.
translation:
  language: de
  text: Und sie bestellten ihr Land in Frieden, und das Land brachte seinen Ertrag hervor und die Bäume der Felder[a] ihre Früchte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Ebenen«; das griechische Wort kann Ebenen oder allgemeiner offenes Feldland bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοῦντες
  choice: bestellten
  rationale: Das Verb bezeichnet die fortdauernde landwirtschaftliche Bearbeitung des Landes; »bestellten« ist im Deutschen präzise und idiomatisch.
- source_word: γῆν
  choice: Land
  rationale: Gemeint ist hier ihr landwirtschaftlich genutztes Gebiet, nicht die Erde im Allgemeinen.
- source_word: μετʼ εἰρήνης
  choice: in Frieden
  rationale: Die substantivische Wendung bewahrt sowohl den Gedanken ungestörter Ruhe als auch den der Sicherheit.
- source_word: ἐδίδου
  choice: brachte … hervor
  rationale: Die Form im Imperfekt beschreibt einen fortdauernden oder regelmäßig wiederkehrenden Ertrag; die deutsche Präteritalform passt zum erzählenden Zusammenhang.
- source_word: γενήματα
  choice: Ertrag
  rationale: Der Ausdruck bezeichnet allgemein das, was der Boden hervorbringt, und unterscheidet sich dadurch passend von den anschließend genannten Früchten der Bäume.
- source_word: ξύλα
  choice: Bäume
  rationale: Wegen der ihnen zugeschriebenen Früchte sind lebende Bäume gemeint, nicht Holz.
- source_word: πεδίων
  choice: auf den Feldern
  rationale: πέδιον kann Ebenen oder allgemein offenes Feldland bezeichnen. »Auf den Feldern« ist in diesem landwirtschaftlichen Zusammenhang natürlich, ohne die mögliche geografische Nuance in der Fußnote zu verschweigen.
- source_word: καρπὸν
  choice: Früchte
  rationale: Bei Bäumen ist »Früchte« die unmittelbarste und natürlichste Wiedergabe.
theological_decisions: []
translation_notes:
