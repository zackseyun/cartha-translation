  terminology: „Land“, „in Frieden“, „Ertrag“, „Bäume“ und „Früchte“ sind sachgerecht. Die Fußnote sollte die Genitivverbindung ebenfalls korrekt abbilden und die mögliche Bedeutung „Ebenen“ als Alternative zu „Feldern“ nennen.
