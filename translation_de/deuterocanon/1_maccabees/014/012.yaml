  yaml_path: translation/deuterocanon/1_maccabees/014/012.yaml
  text: And each sat under his own vine and his own fig tree[a], and there was no one to frighten them.
translation:
  language: de
  text: Und jeder saß unter seinem Weinstock und seinem Feigenbaum[a], und niemand jagte ihnen Angst ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Formulierung greift eine biblische Bildrede für Frieden und Sicherheit auf; vergleiche 1. Könige 5,5 und Micha 4,4.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκάθισεν
  choice: saß
  rationale: Der Aorist bewahrt hier das konkrete Bild des Sitzens in unbedrohter Ruhe; „saß“ gibt dieses Bild knapp und natürlich wieder.
- source_word: ἕκαστος
  choice: jeder
  rationale: Das distributive „jeder“ entspricht dem griechischen Ausdruck, ohne eine im Ausgangstext nicht ausdrücklich bezeichnete männliche Personengruppe einzuführen.
- source_word: ὑπὸ
  choice: unter
  rationale: Die Präposition bezeichnet die räumliche Lage und gehört zugleich zur vertrauten biblischen Bildsprache für Frieden und Sicherheit.
- source_word: ἄμπελον
  choice: Weinstock
  rationale: „Weinstock“ ist die präzise und in biblischer Sprache geläufige deutsche Bezeichnung und erhält das agrarische Bild.
- source_word: συκῆν
  choice: Feigenbaum
  rationale: Das Substantiv bezeichnet den Baum; „Feigenbaum“ ist die genaue und idiomatisch etablierte Wiedergabe.
- source_word: οὐκ ἦν ὁ ἐκφοβῶν
  choice: niemand war da, der ihnen Angst machte
  rationale: Das substantivierte Partizip bezeichnet jemanden, der Furcht hervorruft. Die Formulierung ist modernes, natürliches Deutsch und bewahrt den verursachenden Sinn.
- source_word: αὐτούς
  choice: ihnen
  rationale: Das Pronomen nimmt die Menschen als Gruppe wieder auf; im Deutschen verlangt „Angst machen“ den Dativ.
theological_decisions:
- issue: Intertextuelle Friedensformel („unter seinem Weinstock und seinem Feigenbaum“)
  choice: Das konkrete landwirtschaftliche Bild bleibt im Haupttext erhalten.
  alternative: Eine verallgemeinernde Umschreibung als Frieden, Wohlstand oder Sicherheit.
  rationale: Die Formulierung ist eine erkennbare biblische Bildrede für Frieden und Sicherheit. Ihre wörtliche Bewahrung erhält die intertextuellen Bezüge, ohne eine bestimmte theologische Deutung aufzuzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Parallelismus. Bei der Königsstelle folgt die deutsche Verszählung 1. Könige 5,5; in Zählungen nach der englischen Tradition entspricht dies 1. Könige 4,25.
