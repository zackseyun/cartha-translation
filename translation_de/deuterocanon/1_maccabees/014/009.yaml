base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/009.yaml
  text: The elders sat in the public squares; all of them talked together about good things[a], and the young men put on splendid garments and armor.
translation:
  language: de
  text: Die Ältesten saßen auf den öffentlichen Plätzen und unterhielten sich alle miteinander über gute Dinge. Die jungen Männer legten prächtigen Schmuck und Kriegsgewänder an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: „Herrlichkeiten und Gewänder des Krieges“. Gemeint sind wahrscheinlich prächtiger oder ehrenvoller Schmuck und militärische Kleidung beziehungsweise Ausrüstung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: die Ältesten
  rationale: Im öffentlichen, gemeinschaftlichen Zusammenhang bezeichnet das Wort die angesehenen älteren Männer beziehungsweise Ältesten des Ortes, ohne zwingend ein förmliches Amt festzulegen.
- source_word: ἐν ταῖς πλατείαις
  choice: auf den öffentlichen Plätzen
  rationale: πλατεῖαι kann breite Straßen oder offene Plätze bezeichnen. „Öffentliche Plätze“ gibt den städtischen Gemeinschaftsraum natürlich wieder.
- source_word: ἐκάθηντο
  choice: saßen
  rationale: Der Imperfekt zeichnet die friedliche Szene; das deutsche Präteritum gibt dies knapp und natürlich wieder.
- source_word: πάντες περὶ ἀγαθῶν ἐκοινολόγουν
  choice: unterhielten sich alle miteinander über gute Dinge
  rationale: Die Formulierung bewahrt sowohl die gemeinschaftliche Bedeutung des Verbs als auch die inhaltliche Offenheit von ἀγαθῶν, das gute Dinge, erfreuliche Angelegenheiten oder Wohlergehen meinen kann.
- source_word: οἱ νεανίσκοι
  choice: die jungen Männer
  rationale: Dies ist eine klare und geschlechtsgenaue Wiedergabe der jüngeren männlichen Mitglieder der Gemeinschaft.
- source_word: ἐνεδύσαντο
  choice: legten … an
  rationale: Das Medium bezeichnet das eigene Ankleiden; „anlegen“ passt im Deutschen sowohl zu Schmuck als auch zu besonderer Kleidung.
- source_word: δόξας
  choice: prächtigen Schmuck
  rationale: Wörtlich steht der Plural „Herrlichkeiten“. Im Kleidungskontext bezeichnet er wahrscheinlich sichtbare Pracht, ehrenvollen Schmuck oder festliche Ausstattung; „prächtiger Schmuck“ ist verständlich, ohne die Bildlichkeit völlig einzuebnen.
- source_word: στολὰς πολέμου
  choice: Kriegsgewänder
  rationale: Die Wendung bedeutet wörtlich „Gewänder des Krieges“ und kann militärische Kleidung oder Ausrüstung bezeichnen. „Kriegsgewänder“ bewahrt das konkrete Kleidungsbild, statt es enger als „Rüstung“ festzulegen.
