  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Bildgehalt des Griechischen zuverlässig wieder: πρεσβύτεροι als „Ältesten“, πλατεῖαι als öffentliche Plätze, die gemeinsame Unterhaltung über ἀγαθά sowie das Anlegen von δόξαι und στολαὶ πολέμου. „Prächtigen Schmuck“ ist für δόξας eine vertretbare kontextuelle Wiedergabe; die Fußnote legt die wörtliche, semantisch ungewöhnliche Formulierung offen und markiert die Deutung angemessen als wahrscheinlich.'
