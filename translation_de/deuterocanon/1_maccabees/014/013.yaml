lexical_decisions:
- source_word: ἐξέλιπεν πολεμῶν αὐτούς
  choice: es gab niemanden mehr, der gegen sie Krieg führte
  rationale: Die Verbindung von ἐκλείπω mit dem substantivisch verstandenen Partizip πολεμῶν bezeichnet hier am ehesten, dass kein Kämpfer gegen sie mehr vorhanden war. Diese Wiedergabe ist im Deutschen natürlich und passt zum vorausgehenden Bild ungestörter Sicherheit, ohne die abweichend mögliche Analyse zu verschweigen.
- source_word: ἐπὶ τῆς γῆς
  choice: im Land
  rationale: γῆ bezeichnet im geschichtlich-politischen Zusammenhang das betreffende Land oder Gebiet. Die Präposition ἐπί mit Genitiv lässt zwar eine räumlich wörtlichere Wiedergabe wie „auf der Erde“ zu, doch „im Land“ trifft hier den wahrscheinlichen Sinn.
- source_word: οἱ βασιλεῖς αὐτῶν
  choice: ihre Könige
  rationale: Der Genitiv αὐτῶν wird direkt als Zugehörigkeitsangabe wiedergegeben und bezieht sich auf die zuvor genannten Gegner.
- source_word: συνετρίβησαν
  choice: wurden zerschmettert
  rationale: Das Passiv von συντρίβω bezeichnet ein gewaltsames Zerbrechen und im militärischen Zusammenhang eine vernichtende Niederlage. „Zerschmettert“ bewahrt die Bildkraft des griechischen Ausdrucks.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: in jenen Tagen
  rationale: Formnahe und im gehobenen modernen Deutsch verständliche Wiedergabe der geläufigen Zeitangabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Krieg führte“ wahrt den militärischen Gehalt von πολεμέω; „zerschmettert“ erhält die starke Bildsprache des Passivs. Die syntaktische Mehrdeutigkeit des ersten Satzteils wird im Haupttext kontextgerecht wiedergegeben und in der Fußnote ausdrücklich bewahrt.
