  register: Moderne, würdevolle Standardsprache. Die Ortsnamen folgen geläufigen deutschen biblischen Formen; die griechische Form Gazara wird transparent ausgewiesen. Der lange griechische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Mehrdeutigkeit des Bezugs von τούτων bleibt durch eine Fußnote erhalten.
