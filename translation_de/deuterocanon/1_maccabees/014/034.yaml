  naturalness: Die überarbeitete Fassung ist modernes, flüssiges Standarddeutsch. Die Satzteilung bleibt gut lesbar; „brachte dorthin alles“ ist natürlicher als ein Ausstatten von Orten und vermeidet einen missverständlichen Bezug auf die unmittelbar zuvor genannten Juden.
  terminology: „Joppe“, „Aschdod“, „Juden“, „befestigte“ und „Wiederherstellung“ sind angemessen. „Gazara“ bewahrt die griechische Namensform; die mögliche Identifikation mit Geser gehört in eine vorsichtig formulierte Fußnote.
