  yaml_path: translation/deuterocanon/1_maccabees/014/034.yaml
  text: And he fortified Joppa[a], which is by the sea, and Gazara, which is on the borders of Azotus, where the enemies had formerly lived; and he settled Jews there[b], and placed in them whatever was needed for their restoration.
translation:
  language: de
  text: Und er befestigte Joppe am Meer und Gazara[a] im Grenzgebiet von Aschdod, wo früher die Feinde gewohnt hatten. Dort siedelte er Juden an und brachte dorthin alles, was zu ihrer Wiederherstellung[b] nötig war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: Gazara; möglicherweise ist der Ort gemeint, der auch als Geser bekannt ist.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische „zu ihrer Wiederherstellung“ kann sich auf die Wiederherstellung der beiden Orte oder auf die dort angesiedelten jüdischen Gemeinschaften beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: befestigte
  rationale: Das Verb bezeichnet die militärische Sicherung eines Ortes durch Befestigungsanlagen; „befestigte“ ist im Deutschen präzise und natürlich.
- source_word: Ἰόππην
  choice: Joppe
  rationale: „Joppe“ ist die geläufige deutsche biblische Namensform für das griechische Ἰόππη.
- source_word: τὴν ἐπὶ τῆς θαλάσσης
  choice: am Meer
  rationale: Die knappe Ortsangabe gibt die Lage an der Küste idiomatisch wieder, ohne über den griechischen Text hinauszugehen.
- source_word: Γάζαραν
  choice: Geser
  rationale: Der griechische Name Γάζαρα bezeichnet das aus dem hebräischen Bibeltext als Geser bekannte Gebiet; die geläufige deutsche Ortsnamensform erleichtert die Identifikation, während die griechische Form in der Fußnote vermerkt wird.
- source_word: τὴν ἐπὶ τῶν ὁρίων Ἀζώτου
  choice: an der Grenze des Gebiets von Aschdod
  rationale: ὅρια kann Grenzen oder Grenzgebiet bezeichnen. Die Formulierung ist im Deutschen verständlich und bewahrt den geografischen Bezug; „Aschdod“ ist die geläufige deutsche Namensform von Ἄζωτος.
- source_word: οἱ πολέμιοι τὸ πρότερον
  choice: zuvor die Feinde
  rationale: „Feinde“ gibt den substantivierten Ausdruck direkt wieder; „zuvor“ bezeichnet die frühere Besiedlung knapp und natürlich.
- source_word: κατῴκισεν ἐκεῖ Ἰουδαίους
  choice: Dort siedelte er Juden an
  rationale: Das Verb ist kausativ und bedeutet, Menschen an einem Ort wohnen zu lassen beziehungsweise anzusiedeln.
- source_word: ὅσα ἐπιτήδεια
  choice: alles, was … nötig war
  rationale: ἐπιτήδεια umfasst allgemein notwendige oder zweckdienliche Dinge und wird nicht unnötig auf Vorräte verengt.
- source_word: πρὸς τὴν τούτων ἐπανόρθωσιν
  choice: zu ihrer Wiederherstellung
  rationale: ἐπανόρθωσις bezeichnet Wiederherstellung oder erneute Instandsetzung. Das Pronomen bleibt semantisch offen; die mögliche Beziehung auf Orte oder angesiedelte Gemeinschaften wird in der Fußnote erklärt.
- source_word: ἔθετο ἐν αὐτοῖς
  choice: stattete beide Orte … aus
  rationale: Wörtlich steht „legte/setzte in ihnen“. Die idiomatische deutsche Wiedergabe bezieht das maskuline Pluralpronomen auf die beiden genannten Orte und vermittelt das Ausstatten mit dem Nötigen.
