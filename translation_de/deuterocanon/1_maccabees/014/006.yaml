  text: And he enlarged the borders of his nation, and gained control of the country.
translation:
  language: de
  text: Und er erweiterte die Grenzen seines Volkes und gewann die Herrschaft über das Land.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλάτυνεν
  choice: erweiterte
  rationale: Das Verb bedeutet wörtlich »weitete aus« oder »machte breit«. Bei territorialen Grenzen gibt »erweiterte« den Sinn im modernen Deutschen natürlich und präzise wieder.
- source_word: τὰ ὅρια
  choice: die Grenzen
  rationale: ὅρια bezeichnet Grenzlinien oder Gebietsgrenzen. »Die Grenzen« bewahrt das konkrete geopolitische Bild.
- source_word: τῷ ἔθνει αὐτοῦ
  choice: seines Volkes
  rationale: ἔθνος kann »Volk« oder »Nation« bedeuten. »Seines Volkes« klingt im historischen Kontext natürlich; zusammen mit »die Grenzen« drückt der deutsche Genitiv idiomatisch aus, dass das erweiterte Gebiet seinem Volk zugutekam.
- source_word: ἐκράτησεν
  choice: gewann die Herrschaft über
  rationale: κρατέω mit Genitiv bezeichnet hier das Erlangen oder Ausüben von Gewalt beziehungsweise Herrschaft. Die Formulierung gibt den Machtgewinn wieder, ohne rechtmäßigen Besitz zu unterstellen.
- source_word: τῆς χώρας
  choice: das Land
  rationale: χώρα kann Land, Gebiet oder Region bedeuten. »Das Land« ist hier knapp, würdig und vermeidet eine unnötig verwaltungssprachliche Färbung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die parallele Satzstruktur des Griechischen bleibt erhalten; zugleich werden schwerfällige Wendungen wie »die Grenzen für sein Volk« vermieden.
