base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/010.yaml
  text: He supplied the cities with provisions[a], and equipped them with implements of fortification[b], until the name of his glory was named to the end of the earth.
translation:
  language: de
  text: Er versorgte die Städte mit Vorräten und stattete sie mit Ausrüstung zur Befestigung aus[a], bis sein ruhmvoller Name bis ans Ende der Erde bekannt wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann allgemein Ausrüstung oder Mittel bezeichnen, mit denen die Städte befestigt und verteidigungsbereit gemacht wurden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „bis der Name seines Ruhmes bis ans Ende der Erde genannt wurde“. Gemeint ist, dass sein ruhmvoller Name weithin bekannt wurde.'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐχορήγησεν
  choice: versorgte
  rationale: Das Verb bezeichnet das Bereitstellen dessen, was benötigt wird, oft auf eigene Kosten. „Versorgte“ passt natürlich zum Verwaltungshandeln gegenüber den Städten.
- source_word: βρώματα
  choice: Vorräten
  rationale: Wörtlich sind Nahrungsmittel gemeint; im Zusammenhang befestigter Städte bezeichnet „Vorräte“ passend die für ihre Versorgung bereitgestellten Lebensmittel.
- source_word: ἔταξεν
  choice: stattete … aus
  rationale: Das Grundverb bedeutet „ordnen, hinstellen, einsetzen“. Mit den Städten als Objekt und der folgenden Ausrüstungsangabe beschreibt es hier, dass sie in einen entsprechend befestigten beziehungsweise verteidigungsbereiten Zustand versetzt wurden.
- source_word: σκεύεσιν ὀχυρώσεως
  choice: mit Ausrüstung zur Befestigung
  rationale: σκεύεσιν bezeichnet Geräte, Mittel oder Ausrüstung; ὀχυρώσεως bestimmt ihren Zweck als Befestigung oder Verteidigung. Die Wiedergabe bleibt bewusst allgemein und legt sich nicht ausschließlich auf Waffen oder Baugerät fest.
- source_word: τὸ ὄνομα τῆς δόξης αὐτοῦ
  choice: sein ruhmvoller Name
  rationale: Die natürliche deutsche Wendung gibt den gewichtigen griechischen Genitiv „der Name seines Ruhmes“ sinngemäß wieder, ohne den Bezug auf seinen Ruhm abzuschwächen.
- source_word: ὠνομάσθη
  choice: bekannt wurde
  rationale: Wörtlich bedeutet das Passiv „wurde genannt“. In Verbindung mit der weltweiten Ausdehnung drückt es idiomatisch aus, dass sein Name weithin bekannt beziehungsweise berühmt wurde.
- source_word: ἕως ἄκρου γῆς
  choice: bis ans Ende der Erde
  rationale: Die Einzahl und die räumliche Reichweite des griechischen Ausdrucks werden eng nachgebildet.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwerfällige griechische Ruhmesformel wird im Haupttext idiomatisch wiedergegeben, während die Fußnote ihre wörtliche Gestalt dokumentiert. Die militärisch-technische Wendung bleibt absichtlich breit und wird nicht auf Waffen eingeengt.
