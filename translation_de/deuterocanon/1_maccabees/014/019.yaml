lexical_decisions:
- source_word: ἀνεγνώσθησαν
  choice: wurden verlesen
  rationale: Der Aorist Passiv von ἀναγινώσκω bezeichnet hier das laute Vorlesen von Schriftstücken. „Verlesen“ gibt diesen öffentlichen, dokumentbezogenen Vorgang im Deutschen knapp und natürlich wieder.
- source_word: ἐνώπιον
  choice: vor
  rationale: Die Präposition bezeichnet das Geschehen in Gegenwart einer Gruppe; „vor“ ist die direkte und idiomatische deutsche Entsprechung.
- source_word: ἐκκλησίας
  choice: Versammlung
  rationale: Im jüdischen öffentlich-religiösen Kontext dieser Stelle bezeichnet ἐκκλησία die versammelte Gemeinschaft und nicht anachronistisch die christliche „Kirche“.
- source_word: ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Die Ortsangabe wird unmittelbar und idiomatisch wiedergegeben.
