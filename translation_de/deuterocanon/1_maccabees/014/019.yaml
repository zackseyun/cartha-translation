translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des griechischen Textes bleibt erhalten; „verlesen“ macht ohne erklärenden Zusatz deutlich, dass Schriftstücke der Versammlung laut vorgelesen wurden.
