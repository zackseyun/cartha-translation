  yaml_path: translation/deuterocanon/1_maccabees/014/033.yaml
  text: And he fortified the cities of Judea[a], and Bethsura on the borders of Judea, where formerly the weapons of the enemies had been, and he stationed there a garrison of Jewish men.
translation:
  language: de
  text: Und er befestigte die Städte Judäas sowie Bet-Zur, das am Grenzgebiet Judäas lag, wo sich früher die Waffen der Feinde befunden hatten. Dort stationierte er eine Besatzung aus jüdischen Männern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „judäischen Männern“. Das griechische Wort kann hier sowohl die jüdische Zugehörigkeit als auch die Herkunft aus Judäa bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: befestigte
  rationale: Das Verb bezeichnet die militärische Sicherung durch Befestigungsmaßnahmen; „befestigte“ ist im Deutschen präzise und natürlich.
- source_word: τὰς πόλεις
  choice: die Städte
  rationale: πόλις bezeichnet Städte beziehungsweise städtische Zentren; „Städte“ passt zum administrativen und militärischen Zusammenhang.
- source_word: Βαιθσουράμ
  choice: Bet-Zur
  rationale: Die im Deutschen gebräuchliche biblische Namensform gibt den bekannten judäischen Grenzort klar wieder.
- source_word: ἐπὶ τῶν ὁρίων
  choice: an der Grenze
  rationale: Die griechische Pluralform bezeichnet hier das Grenzgebiet. Das idiomatische deutsche „an der Grenze“ bewahrt die räumliche Aussage ohne unnatürlichen Plural.
- source_word: ὅπλα
  choice: Waffen
  rationale: „Waffen“ ist die direkte und allgemein verständliche Wiedergabe für militärische Ausrüstung in diesem Kontext.
- source_word: τῶν πολεμίων
  choice: der Feinde
  rationale: Der Genitiv bezeichnet die Zugehörigkeit der Waffen; „der Feinde“ entspricht dem griechischen Ausdruck unmittelbar.
- source_word: τὸ πρότερον
  choice: früher
  rationale: Die Wendung verweist knapp auf den vorherigen Zustand des Ortes.
- source_word: ἔθετο ἐκεῖ φρουράν
  choice: Dort stationierte er eine Besatzung
  rationale: Im militärischen Kontext bezeichnet die Formulierung das Einsetzen beziehungsweise Stationieren einer Truppe zur Sicherung des Ortes.
- source_word: ἄνδρας Ἰουδαίους
  choice: aus jüdischen Männern
  rationale: ἄνδρας bezeichnet ausdrücklich Männer. Ἰουδαίους kann ethnisch-religiös „jüdisch“ oder regional-politisch „judäisch“ bedeuten; die Hauptübersetzung wählt die breitere Bezeichnung und dokumentiert die Alternative.
theological_decisions:
- issue: Bedeutung von Ἰουδαίους
  choice: jüdischen Männern
  alternative: judäischen Männern
  rationale: Der Ausdruck kann in der hellenistischen Zeit sowohl die jüdische Zugehörigkeit als auch die Herkunft aus Judäa bezeichnen. Der Kontext entscheidet nicht eindeutig; deshalb bleibt die regionale Lesart in einer Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Erzählsprache. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert. „Besatzung“ bewahrt den militärischen Sinn, ohne die Männer ausdrücklich als „Soldaten“ zu bezeichnen, was der griechische Text nur impliziert.
