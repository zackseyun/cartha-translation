  terminology: „Volk“, „Heiligtum“ und „Gesetz“ sind kontextgerecht. Die Fußnote zu „Heiligtum“ bewahrt sachgerecht die Pluralmehrdeutigkeit von τὰ ἅγια. „Bestand hätten“ gibt σταθῇ idiomatisch und ausreichend offen wieder.
