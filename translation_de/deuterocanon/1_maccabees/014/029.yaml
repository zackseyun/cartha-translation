base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/029.yaml
  text: Since wars had often arisen in the land[a], Simon son of Mattathias, one of the sons of Joarib, and his brothers gave themselves to danger and stood against the adversaries of their nation, so that their sanctuary and the law might stand[c][b], and they glorified their nation with great glory.
translation:
  language: de
  text: Weil es im Land immer wieder zu Kriegen gekommen war, setzten Simon, der Sohn des Mattatias und einer der Söhne Joaribs, und seine Brüder sich selbst der Gefahr aus[a] und leisteten den Gegnern ihres Volkes Widerstand, damit ihr Heiligtum[b] und das Gesetz Bestand hätten, und verschafften ihrem Volk große Ehre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gaben sich selbst der Gefahr hin“; gemeint ist, dass sie sich freiwillig der Gefahr aussetzten.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort steht im Plural und kann auch „ihre heiligen Stätten“ oder „ihre heiligen Dinge“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Sie verherrlichten ihr Volk mit großer Herrlichkeit.“ Gemeint ist, dass sie ihm große Ehre verschafften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ πολλάκις ἐγενήθησαν πόλεμοι ἐν τῇ χώρᾳ
  choice: Weil es im Land immer wieder zu Kriegen gekommen war
  rationale: Die kausale Verknüpfung von ἐπεὶ bleibt erhalten; „immer wieder“ gibt πολλάκις natürlich wieder, und das Plusquamperfekt bildet den vorausliegenden Hintergrund ab.
- source_word: Σίμων ... ὁ υἱὸς τῶν υἱῶν Ἰωαρίβ
  choice: Simon ... aus dem Geschlecht Joaribs
  rationale: Die wörtlich schwerfällige Abstammungsformel „einer von den Söhnen Joaribs“ bezeichnet hier die Zugehörigkeit zur joaribitischen Sippe beziehungsweise Priesterabteilung; „aus dem Geschlecht“ ist im Deutschen klar und zurückhaltend.
- source_word: ἔδωκαν ἑαυτοὺς τῷ κινδύνῳ
  choice: setzten ... sich selbst der Gefahr aus
  rationale: Bewahrt die freiwillige Selbstgefährdung des griechischen Idioms und klingt natürlicher als „gaben sich der Gefahr hin“.
- source_word: ἀντέστησαν τοῖς ὑπεναντίοις
  choice: leisteten den Feinden ... Widerstand
  rationale: Gibt die aktive Gegenwehr von ἀντέστησαν idiomatisch wieder; „Feinde“ passt zum kriegerischen Kontext, während die Grundbedeutung auch „Gegner“ zulässt.
- source_word: τοῦ ἔθνους αὐτῶν
  choice: ihres Volkes
  rationale: ἔθνος bezeichnet hier die jüdische Gemeinschaft als kollektive Größe. „Volk“ ist im modernen Deutschen natürlicher und vermeidet mögliche moderne nationalstaatliche Nebenbedeutungen von „Nation“.
- source_word: ὅπως σταθῇ
  choice: damit ... Bestand hätten
  rationale: Drückt das Fortbestehen und die Sicherung aus, die mit dem intransitiv-passiven σταθῇ gemeint sind, ohne das Bild unnatürlich mit „stehen“ nachzubilden.
- source_word: τὰ ἅγια αὐτῶν
  choice: ihr Heiligtum
  rationale: Der substantivierte Plural kann die heiligen Dinge, Stätten oder den gesamten Heiligtumsbereich bezeichnen; im Kontext ist „Heiligtum“ die klarste kollektive Wiedergabe.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Gemeint ist das jüdische Gesetz beziehungsweise die Tora. Die bestimmte Form des Griechischen wird bewahrt.
- source_word: δόξῃ μεγάλῃ ἐδόξασαν τὸ ἔθνος αὐτῶν
  choice: So brachten sie ihrem Volk große Ehre
  rationale: Gibt den emphatischen gleichstämmigen Ausdruck δόξῃ ... ἐδόξασαν in natürlichem, würdigem Deutsch wieder; eine formale Nachbildung mit „Herrlichkeit verherrlichen“ wäre hier missverständlich.
theological_decisions:
- issue: Bezug von τὰ ἅγια αὐτῶν
  choice: ihr Heiligtum
  alternative: ihre heiligen Stätten / ihre heiligen Dinge
  rationale: Der griechische Plural bleibt mehrdeutig, doch der Zusammenhang von Tempelverteidigung und Gesetz legt den Heiligtumsbereich als kollektiven Bezug nahe. Die Fußnote bewahrt die echte lexikalische Spannweite.
- issue: Wiedergabe von ἔθνος im jüdischen Gemeinschaftskontext
  choice: Volk
  alternative: Nation
  rationale: „Volk“ bewahrt den korporativen ethnisch-politischen Sinn, ohne einen modernen Nationalstaat vorauszusetzen.
- issue: Sinn von ὅπως σταθῇ bei Heiligtum und Gesetz
  choice: damit ... Bestand hätten
  alternative: damit ... feststünden / erhalten blieben
  rationale: Die Form kann Aufrichtung, Festigkeit oder Fortbestand ausdrücken. „Bestand hätten“ lässt offen, ob Schutz, Wiederherstellung oder dauerhafte Geltung im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Satzführung. Der lange griechische Periodensatz wurde am letzten Glied geteilt. Die Formulierung wahrt den öffentlichen, inschriftartigen Ton, vermeidet aber unnatürliche Lehnsyntax. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
