revisions:
- from: Weil es im Land immer wieder zu Kriegen gekommen war, setzten Simon, der Sohn des Mattatias aus dem Geschlecht Joaribs, und seine Brüder sich selbst der Gefahr aus[a] und leisteten den Feinden ihres Volkes Widerstand, damit ihr Heiligtum[b] und das Gesetz Bestand hätten. So brachten sie ihrem Volk große Ehre[c].
  to: Weil es im Land immer wieder zu Kriegen gekommen war, setzten Simon, der Sohn des Mattatias und einer der Söhne Joaribs, und seine Brüder sich selbst der Gefahr aus[a] und leisteten den Gegnern ihres Volkes Widerstand, damit ihr Heiligtum[b] und das Gesetz Bestand hätten, und verschafften ihrem Volk große Ehre[c].
  rationale: 'Die Revision korrigiert ausschließlich zwei semantische Einengungen: Die genealogische Beziehung zu Joarib wird quellennäher als „einer der Söhne Joaribs“ wiedergegeben, und „Gegner“ bewahrt die Offenheit von ὑπεναντίοις. Die übrige idiomatische und sachlich treffende Gestaltung bleibt erhalten. Die Schlusskoordination wird mit „und“ verbunden, entsprechend dem griechischen καί.'
  reviewer_model: gpt-5.6-terra
