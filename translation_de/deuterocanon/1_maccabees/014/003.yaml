  yaml_path: translation/deuterocanon/1_maccabees/014/003.yaml
  text: And he went and struck the camp of Demetrius, and captured him, and brought him to Arsaces, and put him in prison.
translation:
  language: de
  text: Und er zog los, schlug das Lager des Demetrius und nahm ihn gefangen. Dann brachte er ihn zu Arsakes und ließ ihn gefangen setzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: zog los
  rationale: Der Aorist von πορεύομαι bezeichnet hier die Bewegung zum militärischen Unternehmen. »Zog los« klingt im erzählenden Zusammenhang natürlich, ohne ein bestimmtes Marschgeschehen auszumalen.
- source_word: ἐπάταξεν
  choice: schlug
  rationale: πάτασσω bedeutet grundlegend »schlagen«. Die Wiedergabe bewahrt die knappe Ausdrucksweise und legt nicht ausdrücklich den im Verb allein nicht zwingend enthaltenen vollständigen Sieg fest.
- source_word: παρεμβολὴν
  choice: Lager
  rationale: παρεμβολή bezeichnet in diesem militärischen Zusammenhang ein Heerlager; »Lager« ist knapp und im Kontext eindeutig.
- source_word: συνέλαβεν
  choice: nahm ihn gefangen
  rationale: συλλαμβάνω bezeichnet hier das Ergreifen eines Gegners. »nahm ihn gefangen« entspricht dem militärischen Kontext und vermeidet den modernen rechtlichen Beiklang von »verhaftete«.
- source_word: ἤγαγεν
  choice: brachte
  rationale: ἄγω bezeichnet hier das Hinführen einer Person zu einer anderen; »brachte« ist im Deutschen die natürliche Wiedergabe.
- source_word: Ἀρσάκην
  choice: Arsakes
  rationale: »Arsakes« gibt den griechischen Namen Ἀρσάκης in einer im Deutschen gebräuchlichen, quellenahen Form wieder.
- source_word: ἔθετο αὐτὸν ἐν φυλακῇ
  choice: setzte ihn gefangen
  rationale: Die Verbindung von τίθημι mit ἐν φυλακῇ bezeichnet die Versetzung in Gefangenschaft. »setzte ihn gefangen« ist würdig und verständlich und vermeidet die mögliche Zusatzannahme eines bestimmten Gefängnisgebäudes.
