  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησεν
  choice: bestätigte
  rationale: Im politischen und administrativen Zusammenhang bezeichnet das Verb die Bekräftigung beziehungsweise Feststellung Simons in seinem bereits bestehenden Amt. „Bestätigte“ vermeidet den Eindruck, Demetrius habe das Hohepriesteramt erstmals geschaffen.
- source_word: ἀρχιερωσύνην
  choice: das Hohepriesteramt
  rationale: Das Substantiv bezeichnet das Amt beziehungsweise die Würde des Hohenpriesters. „Hohepriesteramt“ ist im Deutschen natürlich, präzise und würdevoll.
- source_word: κατὰ ταῦτα
  choice: dementsprechend
  rationale: Die Wendung verweist auf die zuvor genannten Regelungen oder Umstände zurück. „Dementsprechend“ gibt diese rückbezügliche Bedeutung knapp und idiomatisch wieder, ohne den Bezug enger festzulegen, als es der griechische Text tut.
- source_word: βασιλεὺς Δημήτριος
  choice: König Demetrius
  rationale: Die im Deutschen übliche Reihenfolge von Titel und Name bewahrt die königliche Amtsbezeichnung.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet die Person, der das Amt bestätigt wird; „ihm“ entspricht dieser grammatischen Beziehung unmittelbar.
