  yaml_path: translation/deuterocanon/1_maccabees/014/027.yaml
  text: 'And this is the copy of the writing: On the eighteenth of Elul[a], in the one hundred seventy-second year, and this was the third year under Simon the high priest,'
translation:
  language: de
  text: 'Und dies ist die Abschrift des Dokuments: Am achtzehnten Elul[a], im hundertzweiundsiebzigsten Jahr, und dies war das dritte Jahr unter Simon, dem Hohepriester,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elul ist ein Monat des jüdischen Kalenders.
    reason: Die kurze Erläuterung macht die fremde Monatsbezeichnung verständlich, ohne sie durch eine unsichere moderne Kalenderentsprechung zu ersetzen.
lexical_decisions:
- source_word: ἀντίγραφον
  choice: Abschrift
  rationale: Das Wort bezeichnet eine Kopie beziehungsweise ein Duplikat eines geschriebenen Textes; »Abschrift« passt natürlich zur folgenden Wiedergabe eines amtlichen Dokuments.
- source_word: γραφῆς
  choice: Dokument
  rationale: Im rechtlich-amtlichen Zusammenhang bezeichnet γραφή hier ein schriftliches Dokument, nicht die Heilige Schrift. »Dokument« macht diese Funktion im heutigen Deutsch klar.
- source_word: Ὀκτωκαιδεκάτῃ Ἐλοὺλ
  choice: am achtzehnten Elul
  rationale: Der feminine Dativ des Ordinalzahlworts bildet zusammen mit dem Monatsnamen die Datumsangabe; im Deutschen ist »am achtzehnten Elul« idiomatisch.
- source_word: ἔτους δευτέρου ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: im hundertzweiundsiebzigsten Jahr
  rationale: Die griechische Ordinalkonstruktion wird als Jahresangabe ebenso ordinal wiedergegeben.
- source_word: τοῦτο τρίτον ἔτος
  choice: dies war das dritte Jahr
  rationale: Eine finite Formulierung gibt die erläuternde Datierung natürlich und quellennah wieder.
- source_word: ἐπὶ Σίμωνος
  choice: unter Simon
  rationale: ἐπί mit Genitiv bezeichnet in Datierungsformeln die Amtszeit einer Person; »unter Simon« ist knapp und sachgerecht.
- source_word: τοῦ ἀρχιερέως
  choice: dem Hohepriester
  rationale: ἀρχιερεύς ist die übliche Bezeichnung für den jüdischen Hohepriester; der Titel steht im Deutschen vor dem Namen.
theological_decisions:
- issue: Bedeutung von γραφή in diesem Zusammenhang
  choice: Dokument
  alternative: Schriftstück; Schrift
  rationale: Der rechtlich-historische Zusammenhang weist auf eine amtliche Urkunde beziehungsweise Niederschrift. »Dokument« vermeidet eine unbeabsichtigte Deutung als Heilige Schrift.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der dokumentarische Einleitungssatz und seine fortlaufende Syntax bleiben erhalten; Gedankenstriche kennzeichnen die eingeschobene Erläuterung zur Amtszeit Simons.
