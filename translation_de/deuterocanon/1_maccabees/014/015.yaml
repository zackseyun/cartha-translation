  text: He honored the holy things and increased the vessels of the sanctuary[a][b].
translation:
  language: de
  text: Er ehrte die heiligen Dinge[a] und vermehrte die Geräte des Heiligtums[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er verherrlichte das Heiligtum“ oder „Er ehrte das Heilige“. Der griechische Ausdruck kann sowohl heilige Dinge als auch im erweiterten Sinn das Heiligtum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die heiligen Gefäße und sonstigen Geräte, die im Heiligtum verwendet wurden.
    reason: cultural_note
lexical_decisions:
- source_word: τὰ ἅγια
  choice: die heiligen Dinge
  rationale: Der substantivierte neutrale Plural kann heilige Dinge oder erweitert das Heiligtum bezeichnen. Die Wiedergabe wahrt hier die weitere Bedeutung, während der folgende Ausdruck ausdrücklich auf das Heiligtum verweist.
- source_word: ἐδόξασεν
  choice: ehrte
  rationale: Das Verb bezeichnet das Verleihen von Ehre oder Herrlichkeit. Im historischen Zusammenhang drückt „ehrte“ natürlich aus, dass den heiligen Dingen besondere Würde und Achtung erwiesen wurde.
- source_word: ἐπλήθυνεν
  choice: vermehrte
  rationale: Das Verb bedeutet, etwas zahlreicher zu machen. „Vermehrte“ gibt den Sinn prägnant und quellenah wieder.
- source_word: τὰ σκεύη
  choice: die Geräte
  rationale: Im kultischen Zusammenhang sind damit Gefäße, Gerätschaften oder sonstige für den Gottesdienst bestimmte Gegenstände gemeint. „Geräte“ ist im Deutschen umfassend und verständlich.
- source_word: τῶν ἁγίων
  choice: des Heiligtums
  rationale: Der Genitiv bezeichnet hier wahrscheinlich den heiligen Bereich, zu dem die Geräte gehören. „Des Heiligtums“ ist im kultischen Zusammenhang klar und idiomatisch.
theological_decisions:
- issue: Bezug von τὰ ἅγια im ersten Satzglied
  choice: die heiligen Dinge
  alternative: das Heiligtum
  rationale: Die griechische Form lässt beide Deutungen zu. Der Haupttext bewahrt den breiteren gegenständlichen Sinn; die echte Mehrdeutigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des griechischen Textes bleibt erhalten; kultische Begriffe werden verständlich wiedergegeben, ohne die Mehrdeutigkeit von τὰ ἅγια aufzulösen.
