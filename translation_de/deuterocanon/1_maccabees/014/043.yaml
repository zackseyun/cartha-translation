  text: and that he should have charge of the holy things[a], and that he should be obeyed by all, and that all documents in the country should be written in his name[d][c][b], and that he should wear purple and gold.
translation:
  language: de
  text: und dass er für die heiligen Dinge[a] zuständig sein sollte, dass alle ihm gehorchen sollten[b], dass sämtliche Urkunden im Land in seinem Namen ausgestellt werden sollten[c] und dass er Purpur und Gold tragen sollte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „für das Heiligtum“ oder „für die heiligen Angelegenheiten“. Das Griechische sagt wörtlich „die heiligen Dinge“ und lässt den Umfang der Zuständigkeit offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von allen gehört werden“. Im Zusammenhang ist gemeint, dass alle seine Autorität beachten und seinen Anordnungen Folge leisten sollten.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: Die amtlichen Urkunden im Land sollten unter seiner Autorität ausgefertigt werden.'
    reason: cultural_note
  - marker: d
    text: Purpur und Gold waren Zeichen hohen Ranges und amtlicher Würde.
    reason: cultural_note
lexical_decisions:
- source_word: μέλῃ ... περὶ
  choice: für ... verantwortlich sein
  rationale: Die Wendung bezeichnet Sorge oder Zuständigkeit. Im Zusammenhang des amtlichen Beschlusses gibt „verantwortlich sein“ die übertragene Aufsicht natürlich wieder, ohne bloß persönliche Besorgnis auszudrücken.
- source_word: τῶν ἁγίων
  choice: die heiligen Dinge
  rationale: Der substantivierte neutrale Plural ist bewusst weit gefasst und kann heilige Dinge oder Angelegenheiten, insbesondere im Tempelbereich, bezeichnen. Die Übersetzung bewahrt diese Breite.
- source_word: ἀκούηται
  choice: bei allen Gehör finden
  rationale: Das Passiv bedeutet wörtlich, dass Simon von allen gehört werden soll; im amtlichen Zusammenhang ist gemeint, dass seine Weisungen beachtet werden. „Gehör finden“ erhält die Bildlichkeit, klingt natürlich und legt die Aussage nicht unnötig auf „gehorchen“ fest.
- source_word: συγγραφαὶ
  choice: Urkunden
  rationale: Das Wort bezeichnet hier schriftliche, rechtlich oder amtlich relevante Dokumente. „Urkunden“ passt zum administrativen Zusammenhang und ist präziser als das sehr allgemeine „Schriften“.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: in seinem Namen
  rationale: Die idiomatische Wendung bezeichnet Ausstellung unter Simons Namen und damit unter seiner amtlichen Autorität.
- source_word: πορφύραν
  choice: Purpur tragen
  rationale: Der griechische Text nennt den kostbaren Purpurstoff als Rangzeichen, ohne ein bestimmtes Kleidungsstück zu benennen.
- source_word: χρυσοφορῇ
  choice: Gold tragen
  rationale: Das Verb bedeutet, Gold beziehungsweise goldenen Schmuck zu tragen. Die knappe Wiedergabe wahrt die Parallele zu „Purpur tragen“, ohne die Form des Goldes näher festzulegen.
theological_decisions:
- issue: Umfang von τῶν ἁγίων
  choice: die heiligen Dinge
  alternative: das Heiligtum; die heiligen Angelegenheiten
  rationale: Obwohl der Zusammenhang eine Zuständigkeit für Tempelangelegenheiten nahelegt, steht im Griechischen ein weiter gefasster Plural. Die Übersetzung engt ihn weder auf das Gebäude noch ausschließlich auf Verwaltungssachen ein.
- issue: Stärke von ἀκούηται
  choice: bei allen Gehör finden
  alternative: von allen gehört werden; von allen befolgt werden; alle sollen ihm gehorchen
  rationale: Im Kontext verliehener Amtsbefugnisse schließt die Wendung verbindliche Beachtung ein. Die gewählte Form bewahrt jedoch den griechischen Ausdruck und vermeidet, den möglichen Sinn eigenmächtig bis zum uneingeschränkten Gehorsam zu verstärken.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem Satzbau eines amtlichen Beschlusses. Die wiederholten dass-Sätze bilden die griechischen ὅπως-Klauseln klar ab. „Sämtliche“ vermeidet die mögliche Fehlbeziehung von „alle“ und hält den administrativen Ton.
