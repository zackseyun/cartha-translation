  yaml_path: translation/deuterocanon/1_maccabees/014/021.yaml
  text: The envoys who had been sent to our people reported to us about your glory and honor[a], and we rejoiced at their arrival.
translation:
  language: de
  text: Die Gesandten, die zu unserem Volk geschickt worden waren, berichteten uns von eurem Ruhm und eurer Ehre[a], und wir freuten uns über ihre Ankunft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Gesandtschaft, die zu unserem Volk geschickt worden war, berichtete uns …“ Das griechische οἱ πρεσβεῖαι kann entweder die diplomatische Mission selbst oder die Gesandten als Personen bezeichnen. Für Letzteres spricht im Haupttext die anschließende Formulierung „ihre Ankunft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πρεσβεῖαι
  choice: die Gesandten
  rationale: Die griechische Form kann diplomatische Missionen oder deren personelle Vertreter bezeichnen. Der anschließende Verweis auf „ihre Ankunft“ legt im Deutschen die personale Wiedergabe „Gesandten“ nahe.
- source_word: οἱ ἀποσταλέντες
  choice: die ... geschickt worden waren
  rationale: Das substantivisch bezogene Aoristpartizip bezeichnet eine der Berichterstattung vorausgehende Entsendung; das Plusquamperfekt bildet diese zeitliche Beziehung natürlich ab.
- source_word: πρὸς τὸν δῆμον ἡμῶν
  choice: zu unserem Volk
  rationale: δῆμος bezeichnet hier das Volk als politische Gemeinschaft. „Volk“ ist verständlich und wahrt den öffentlichen, diplomatischen Zusammenhang.
- source_word: ἀπήγγειλαν ἡμῖν
  choice: berichteten uns
  rationale: Die Formulierung gibt den förmlichen Charakter der diplomatischen Mitteilung prägnant wieder.
- source_word: περὶ τῆς δόξης ὑμῶν καὶ τιμῆς
  choice: von eurem Ruhm und eurer Ehre
  rationale: δόξα bezeichnet hier öffentliches Ansehen beziehungsweise Ruhm, τιμή die erwiesene oder anerkannte Ehre. Die Paarung klingt im modernen Deutschen würdig und natürlich.
- source_word: ηὐφράνθημεν
  choice: wir freuten uns
  rationale: Die Wendung drückt deutliche Freude aus; „wir freuten uns“ ist modern und natürlich, ohne den diplomatischen Ton unnötig zu steigern.
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: über ihre Ankunft
  rationale: ἔφοδος kann Herankommen, Ankunft oder Besuch bedeuten. Im Zusammenhang bezeichnet „Ankunft“ am natürlichsten das Eintreffen der Gesandten, die Bericht erstatteten.
