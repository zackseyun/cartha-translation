  text: And with all his glory he took Joppa as a harbor[a], and made it an access point to the islands of the sea.
translation:
  language: de
  text: Und mit all seiner Herrlichkeit nahm er Joppe als Hafen ein und schuf einen Zugang zu den Inseln des Meeres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und machte einen Eingang für die Inseln des Meeres“. Der griechische Ausdruck kann wörtlicher wiedergegeben werden; εἴσοδος kann „Eingang“ oder „Zugang“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πάσης τῆς δόξης αὐτοῦ
  choice: in all seinem Ruhm
  rationale: δόξα kann Ruhm, Ehre oder Glanz bezeichnen. „In all seinem Ruhm“ bewahrt den gehobenen Ton des Lobabschnitts und lässt sowohl Ansehen als auch Pracht anklingen.
- source_word: ἔλαβεν
  choice: nahm … ein
  rationale: λαμβάνω bedeutet allgemein „nehmen“. Im Zusammenhang mit einer Stadt gibt „nahm … ein“ den Erwerb bzw. die Besetzung natürlich wieder, ohne die Art des Vorgehens näher festzulegen.
- source_word: τὴν Ἰόππην
  choice: Joppe
  rationale: „Joppe“ ist die in deutschen Bibelübersetzungen geläufige Form des Ortsnamens Ἰόππη.
- source_word: εἰς λιμένα
  choice: als Hafen
  rationale: 'εἰς bezeichnet hier wahrscheinlich Zweck oder Ergebnis: Joppe wurde eingenommen, damit es als Hafen diente. „Als Hafen“ ist im Deutschen knapp und idiomatisch.'
- source_word: ἐποίησεν εἴσοδον
  choice: machte es zum Zugang
  rationale: ποιέω mit εἴσοδος bezeichnet das Schaffen eines Eingangs oder Zugangs. Das ergänzte „es“ bezieht sich aus dem Zusammenhang eindeutig auf Joppe.
- source_word: ταῖς νήσοις τῆς θαλάσσης
  choice: zu den Inseln des Meeres
  rationale: Der Dativ kann die Beziehung bzw. Zielrichtung des Zugangs ausdrücken. „Zu den Inseln des Meeres“ ist natürlich und bewahrt die gehobene Genitivwendung des Griechischen.
