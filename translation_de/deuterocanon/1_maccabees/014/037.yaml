  text: And he settled Jewish men in it, and fortified it for the security of the country and the city, and raised the walls of Jerusalem.
translation:
  language: de
  text: Und er siedelte darin jüdische Männer an, befestigte den Ort zur Sicherung des Landes und der Stadt und erhöhte die Mauern Jerusalems.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῴκισεν
  choice: siedelte … an
  rationale: 'Die Wendung gibt den kausativen Sinn wieder: Er ließ Menschen dort als Bewohner ansässig werden. Sie ist im modernen Deutschen natürlich und vermeidet die politisch stärker aufgeladene Formulierung „kolonisierte“.'
- source_word: ἐν αὐτῇ
  choice: darin
  rationale: „Darin“ nimmt den vorausgehenden Ort natürlich auf, ohne im Deutschen ein grammatisches Geschlecht hervorzuheben, das allein von der übersetzten Bezeichnung des Ortes abhinge.
- source_word: ἄνδρας Ἰουδαίους
  choice: jüdische Männer
  rationale: Die Übersetzung macht sowohl das ausdrücklich männliche ἄνδρας als auch die jüdische Zugehörigkeit sichtbar. Das bloße „Juden“ ließe den ersten Bestandteil unausgedrückt.
- source_word: ὠχύρωσεν
  choice: befestigte
  rationale: Das Verb bezeichnet hier die militärische Sicherung beziehungsweise Befestigung eines Ortes; „befestigte“ ist präzise und im historischen Zusammenhang idiomatisch.
- source_word: πρὸς ἀσφάλειαν
  choice: zur Sicherung
  rationale: Die Formulierung drückt den Zweck aus und passt zum militärisch-administrativen Zusammenhang.
- source_word: τῆς χώρας
  choice: des Landes
  rationale: χώρα bezeichnet das größere Gebiet im Gegensatz zur Stadt. „Land“ ist im Deutschen knapp und natürlich, ohne die Bedeutung unnötig auf „Staat“ oder „Landschaft“ festzulegen.
- source_word: τῆς πόλεως
  choice: der Stadt
  rationale: πόλις bedeutet hier „Stadt“ und steht dem weiteren Land beziehungsweise Gebiet gegenüber.
- source_word: ὕψωσεν
  choice: erhöhte
  rationale: Das Verb bedeutet, etwas höher zu machen. „Erhöhte“ bewahrt diese Aussage, ohne festzulegen, ob die Mauern vollständig neu gebaut oder lediglich aufgestockt wurden.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: die Mauern Jerusalems
  rationale: Die Formulierung bildet den griechischen Genitiv natürlich ab und wahrt den Plural.
