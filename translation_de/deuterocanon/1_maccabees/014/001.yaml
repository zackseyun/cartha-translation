  yaml_path: translation/deuterocanon/1_maccabees/014/001.yaml
  text: And in the one hundred seventy-second year[a], King Demetrius gathered his forces and went into Media[b], to obtain help for himself so that he might make war against Tryphon.
translation:
  language: de
  text: Und im 172. Jahr[a] sammelte König Demetrius seine Streitkräfte und zog nach Medien, um Unterstützung für sich zu gewinnen, um gegen Tryphon Krieg zu führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Jahresangabe wird gewöhnlich nach der seleukidischen Zeitrechnung verstanden; wörtlich: „im zweiten und siebzigsten und hundertsten Jahr“.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἔτει δευτέρῳ καὶ ἑβδομηκοστῷ καὶ ἑκατοστῷ
  choice: im 172. Jahr
  rationale: Die additive griechische Zahlformel wird im modernen Deutschen idiomatisch als Ordinalzahl wiedergegeben; der Bezug auf die seleukidische Zeitrechnung wird in der Fußnote erläutert.
- source_word: συνήγαγεν ... τὰς δυνάμεις αὐτοῦ
  choice: sammelte ... seine Streitkräfte
  rationale: συνάγω bezeichnet hier das Zusammenziehen militärischer Kräfte; „Streitkräfte“ wahrt den militärischen Sinn und den Plural von δυνάμεις.
- source_word: ἐπορεύθη εἰς Μηδίαν
  choice: zog nach Medien
  rationale: ἐπορεύθη bezeichnet das Sichbegeben oder Ziehen an einen Ort. „zog nach“ ist in diesem militärischen Erzählzusammenhang natürlich, ohne ausdrücklich einen Marsch zu behaupten.
- source_word: τοῦ ἐπισπάσθαι βοήθειαν ἑαυτῷ
  choice: um Unterstützung für sich zu gewinnen
  rationale: Der Genitiv des substantivierten Infinitivs drückt den Zweck aus. Das Medium ἐπισπάσθαι hat die Nuance, Hilfe an sich zu ziehen oder für sich zu gewinnen; „Unterstützung gewinnen“ gibt dies natürlich wieder.
- source_word: ὅπως πολεμήσῃ τὸν Τρύφωνα
  choice: damit er gegen Tryphon Krieg führen konnte
  rationale: ὅπως mit dem Konjunktiv bezeichnet die beabsichtigte Folge. „Krieg führen“ bildet πολεμέω als umfassendere militärische Handlung ab; „konnte“ bezeichnet hier Ziel beziehungsweise beabsichtigte Möglichkeit, nicht bloß feststehende Folge.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe historische Erzählweise und die Zweckabfolge des Griechischen bleiben erhalten; „Unterstützung für sich zu gewinnen“ bewahrt die aktive Nuance des Heranziehens von Hilfe.
