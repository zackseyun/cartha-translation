base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/036.yaml
  text: And in his days it prospered in his hands to remove the nations from their land[a], and those in the city of David in Jerusalem who had made for themselves a citadel, from which they would go out and defile the area around the sanctuary, and they inflicted great damage on its purity.
translation:
  language: de
  text: Und in seinen Tagen gelang es ihm, die Völker aus ihrem Land zu vertreiben und die Bewohner der Stadt Davids in Jerusalem, die sich eine Festung[a] gebaut hatten. Von dort zogen sie aus, verunreinigten die Umgebung des Heiligtums und fügten seiner Reinheit großen Schaden zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Zitadelle“. Wahrscheinlich ist die befestigte Anlage in Jerusalem gemeint, die als Akra bekannt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδώθη ἐν ταῖς χερσὶν αὐτοῦ
  choice: gelang es durch seine Hand
  rationale: Die unpersönliche passive Wendung bezeichnet das Gelingen seiner Unternehmungen. „Durch seine Hand“ bewahrt das griechische Bild und bezeichnet zugleich seine wirksame Vermittlung.
- source_word: τοῦ ἐξαρθῆναι
  choice: zu vertreiben
  rationale: Das Verb bezeichnet hier die erfolgreiche Beseitigung feindlicher Gruppen aus einem Gebiet. „Vertreiben“ ist im Zusammenhang natürlicher als „entfernen“, ohne eine vollständige Vernichtung zu behaupten.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Die Wiedergabe bleibt nahe am Grundsinn und legt nicht ausdrücklich „Heiden“ fest, obwohl nichtjüdische Mächte gemeint sein können.
- source_word: ἐκ τῆς χώρας αὐτῶν
  choice: aus ihrem Land
  rationale: „Land“ gibt χώρα breit und natürlich wieder; das Pronomen bleibt wie im Griechischen erhalten, ohne seinen Bezug stillschweigend zu vereindeutigen.
- source_word: ἄκραν
  choice: eine Festung
  rationale: ἄκρα bezeichnet eine befestigte Zitadelle. „Festung“ ist allgemein verständlich; die mögliche Bezeichnung der Jerusalemer Akra wird in der Fußnote genannt.
- source_word: ἐμίανον
  choice: verunreinigten
  rationale: Das Wort bezeichnet kultische Verunreinigung und wahrt hier den Bezug zum Heiligtum.
- source_word: κύκλῳ τῶν ἁγίων
  choice: die Umgebung des Heiligtums
  rationale: Die gedrängte griechische Formulierung meint im Tempelzusammenhang wahrscheinlich den Bereich rings um das Heilige beziehungsweise Heiligtum.
- source_word: πληγὴν μεγάλην ἐν τῇ ἁγνείᾳ
  choice: fügten seiner Reinheit großen Schaden zu
  rationale: Die bildhafte „große Wunde“ wird idiomatisch als schwerer Schaden wiedergegeben; ἁγνεία bezeichnet die kultische Reinheit.
theological_decisions:
- issue: Kultische Sprache im Umfeld des Tempels
  choice: „verunreinigten“, „Heiligtum“ und „Reinheit“
  alternative: Allgemeinere Ausdrücke wie „entweihten“, „heiliger Ort“ oder „Heiligkeit“
  rationale: Die Wortwahl des griechischen Textes hebt kultische Verunreinigung und Reinheit hervor. Die Übersetzung bewahrt diesen Tempelbezug, ohne eine konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde zur besseren Verständlichkeit nach „gebaut hatten“ geteilt; das Subjekt des folgenden Relativzusammenhangs bleibt dabei eindeutig. Das ungewöhnliche Hand-Bild des Ausgangstextes wurde bewusst bewahrt.
