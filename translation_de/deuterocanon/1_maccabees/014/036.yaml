  to: Und in seinen Tagen gelang es ihm, die Völker aus ihrem Land zu vertreiben und die Bewohner der Stadt Davids in Jerusalem, die sich eine Festung[a] gebaut hatten. Von dort zogen sie aus, verunreinigten die Umgebung des Heiligtums und fügten seiner Reinheit großen Schaden zu.
  rationale: Die Revision verbessert idiomatisches modernes Deutsch und verwendet die geläufige Ortsbezeichnung „Stadt Davids“. Sie hält die syntaktische Zweiteilung bei, sodass die aus der Festung ausziehenden Bewohner eindeutig als Subjekt der folgenden Verben verstanden werden. Die kultische Terminologie und die vorsichtige, nicht überbestimmende Wiedergabe der umstrittenen Akra-Identifikation bleiben erhalten.
