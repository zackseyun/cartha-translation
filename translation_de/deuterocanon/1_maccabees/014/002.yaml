base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/002.yaml
  text: And Arsaces, the king of Persia and Media, heard that Demetrius had come into his territory, and he sent one of his commanders to capture him alive.
translation:
  language: de
  text: Als Arsakes, der König von Persien und Medien, hörte, dass Demetrius in sein Herrschaftsgebiet gekommen war, sandte er einen seiner Befehlshaber aus, um ihn lebend gefangen zu nehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte
  rationale: Die direkte Wiedergabe wahrt den berichtenden Charakter des Aorists, ohne die Art der Nachrichtenübermittlung näher festzulegen.
- source_word: Ἀρσάκης
  choice: Arsakes
  rationale: Die im Deutschen übliche, am Griechischen orientierte Namensform wird verwendet.
- source_word: ὁ βασιλεὺς Περσίδος καὶ Μηδίας
  choice: der König von Persien und Medien
  rationale: Die vertrauten deutschen Ländernamen geben die geografische Bezeichnung klar und idiomatisch wieder.
- source_word: ἦλθεν
  choice: gekommen war
  rationale: Das Plusquamperfekt macht deutlich, dass Demetrius bereits vor der Reaktion des Arsakes eingetroffen war.
- source_word: τὰ ὅρια αὐτοῦ
  choice: sein Herrschaftsgebiet
  rationale: Der Plural bezeichnet wörtlich Grenzen beziehungsweise Grenzgebiete, meint hier aber naheliegend das Gebiet unter seiner Herrschaft.
- source_word: ἀπέστειλεν
  choice: sandte ... aus
  rationale: Die trennbare deutsche Wendung passt natürlich zur Beauftragung eines Untergebenen mit einer Mission.
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ
  choice: einen seiner Befehlshaber
  rationale: ἄρχων ist allgemein ein führender Amtsträger; im Zusammenhang einer Gefangennahme passt Befehlshaber, ohne einen präzisen militärischen Rang zu behaupten.
- source_word: συλλαβεῖν αὐτὸν ζῶντα
  choice: um ihn lebend gefangen zu nehmen
  rationale: Die Formulierung gibt sowohl die beabsichtigte Ergreifung als auch die ausdrückliche Vorgabe wieder, Demetrius am Leben zu lassen.
