  source_fidelity: Der Entwurf gibt den griechischen Satz vollständig und in der richtigen Handlungsfolge wieder. Das Plusquamperfekt „gekommen war“ ist im Deutschen nach „hörte, dass“ idiomatisch und markiert zutreffend die vorausliegende Ankunft des Demetrius. „Herrschaftsgebiet“ gibt τὰ ὅρια αὐτοῦ kontextgerecht wieder, und „lebend gefangen zu nehmen“ bewahrt die ausdrückliche Bestimmung ζῶντα.
  naturalness: Die Formulierung ist modernes, flüssiges Standarddeutsch mit angemessen sachlich-historischem Register. Die Konstruktion mit „Als“ und der anschließende Hauptsatz sind natürlich; „sandte ... aus“ passt zur beauftragten Mission.
  terminology: „Arsakes“, „Demetrius“, „König von Persien und Medien“ sowie „Befehlshaber“ sind angemessene Wiedergaben. „Befehlshaber“ konkretisiert ἄρχων im unmittelbaren Kontext einer Gefangennahme nicht unzulässig und stimmt mit der englischen Audit-Entscheidung „commander“ überein. Es gibt keine theologischen Fachbegriffe und keine Fußnotenanker zu prüfen.
