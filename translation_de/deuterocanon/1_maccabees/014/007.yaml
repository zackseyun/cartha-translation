  text: καὶ συνήγαγεν αἰχμαλωσίαν πολλήν, καὶ ἐκυρίευσεν Γαζάρων καὶ Βαιθσούρων καὶ τῆς ἄκρας καὶ ἐξῆρεν τὰς ἀκαθαρσίας ἐξ αὐτῆς, καὶ οὐκ ἦν ὁ ἀντικείμενος αὐτῷ.
