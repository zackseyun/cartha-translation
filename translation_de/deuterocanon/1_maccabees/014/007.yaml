base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/007.yaml
  text: And he gathered many captives[a], and he took control of Gezer and Beth-zur and the citadel, and he removed the uncleanness from it, and there was no one opposing him.
translation:
  language: de
  text: Und er führte viele Gefangene zusammen und brachte Geser, Bet-Zur und die Zitadelle[a] unter seine Herrschaft. Er entfernte die Verunreinigungen aus ihr, und niemand leistete ihm Widerstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Akra, die besondere befestigte Anlage in Jerusalem.'
    reason: Alternative Deutung von ἄκρα als Eigenname statt als Gattungsbezeichnung.
lexical_decisions:
- source_word: συνήγαγεν αἰχμαλωσίαν πολλήν
  choice: führte viele Gefangene zusammen
  rationale: Die Wendung bezeichnet hier das Zusammenbringen zahlreicher Kriegsgefangener. Die Übersetzung bleibt dem konkreten Bild von συνάγω nahe und gibt αἰχμαλωσία idiomatisch als gefangene Personen wieder.
- source_word: ἐκυρίευσεν
  choice: brachte … unter seine Herrschaft
  rationale: Das Verb bezeichnet das Erlangen von Gewalt oder Herrschaft über Orte. Diese Wiedergabe umfasst militärische Einnahme und tatsächliche Kontrolle, ohne eine dauerhafte Königsherrschaft vorauszusetzen.
- source_word: Γαζάρων
  choice: Geser
  rationale: Geser ist die im Deutschen geläufige Form des bekannten Ortsnamens.
- source_word: Βαιθσούρων
  choice: Bet-Zur
  rationale: Bet-Zur folgt einer geläufigen modernen deutschen Wiedergabe des semitischen Ortsnamens.
- source_word: τῆς ἄκρας
  choice: die Zitadelle
  rationale: ἄκρα kann als Gattungsbezeichnung für eine befestigte Zitadelle verstanden werden; im makkabäischen Zusammenhang kann zugleich die bestimmte Jerusalemer Akra gemeint sein. Diese Möglichkeit wird in der Fußnote bewahrt.
- source_word: ἐξῆρεν τὰς ἀκαθαρσίας ἐξ αὐτῆς
  choice: Er entfernte die Verunreinigungen aus ihr
  rationale: „Verunreinigungen“ bewahrt den Plural und lässt den kultisch-religiösen Sinn von ἀκαθαρσίαι erkennen. Das feminine Pronomen „ihr“ nimmt entsprechend dem Griechischen die Zitadelle auf.
- source_word: οὐκ ἦν ὁ ἀντικείμενος αὐτῷ
  choice: niemand leistete ihm Widerstand
  rationale: Die natürliche deutsche Formulierung gibt das Fehlen eines Gegners beziehungsweise aktiven Widerstands wieder, ohne die Aussage weiter auszudeuten.
theological_decisions:
- issue: Kultische Bedeutung von τὰς ἀκαθαρσίας
  choice: Verunreinigungen
  alternative: Unreinheiten; Befleckungen; unreine Dinge
  rationale: „Verunreinigungen“ ist verständliches modernes Deutsch, bewahrt den Plural und lässt sowohl kultische als auch konkrete Verunreinigung zu, ohne deren genaue Art festzulegen.
- issue: ἄκρα als Gattungsbezeichnung oder Eigenname
  choice: Zitadelle im Haupttext
  alternative: Akra als Eigenname
  rationale: Der Haupttext vermittelt die lexikalische Bedeutung unmittelbar; die Fußnote hält die historisch konkrete Identifizierung mit der Jerusalemer Akra offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge der griechischen Aussagen zu verändern. Militärische und kultische Begriffe bleiben erkennbar, werden aber nicht konfessionell präzisiert.
