review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die drei aoristischen Aussagen sowie die unterschiedlichen Bezüge von αὐτῶν („ihr“) und αὐτοῦ („sein“) sachgerecht wieder. „Führte … zusammen“ ist für ἠθροισεν vertretbar; „Hohepriester“ entspricht ἀρχιερεύς. Die Todesumschreibung wird nicht überdeutet.
  naturalness: „Wurde seinem Volk hinzugefügt“ ist im heutigen Deutsch wegen der Verbindung von „hinzugefügt“ mit einem Dativ unidiomatisch. Mit „zu seinem Volk hinzugefügt“ wird die durch πρὸς ausgedrückte Richtung aufgenommen und zugleich eine verständlichere, dennoch eng am griechischen Bild bleibende Formulierung erreicht.
  terminology: „Volk“ ist für sowohl ἔθνος als auch λαός im Kontext angemessen. Die bewusste Wiederaufnahme mit verschiedenen Possessivformen („ihr Volk“ / „seinem Volk“) wahrt den griechischen Text. „Hohepriester“ ist der etablierte deutsche Fachausdruck.
  issues:
