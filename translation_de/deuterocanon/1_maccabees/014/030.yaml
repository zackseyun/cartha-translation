    issue: Unidiomatische Rektion bei „seinem Volk hinzugefügt“
    rationale: Das deutsche Verb „hinzufügen“ wird hier natürlicher mit „zu“ konstruiert. Die Änderung zu „zu seinem Volk hinzugefügt“ verbessert die Sprachlichkeit und bildet πρὸς genauer ab, ohne die idiomatische Todesbedeutung im Haupttext festzulegen.
