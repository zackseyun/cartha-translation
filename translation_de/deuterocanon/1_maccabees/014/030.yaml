  text: And Jonathan gathered their nation[a], and became their high priest, and was added to his people.
translation:
  language: de
  text: Und Jonatan führte ihr Volk zusammen, wurde ihr Hohepriester und wurde zu seinem Volk hinzugefügt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde zu seinem Volk versammelt«; eine geläufige biblische Umschreibung für den Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθροισεν
  choice: führte … zusammen
  rationale: Der Aorist von ἀθροίζω bezeichnet das Sammeln oder Zusammenführen. »Führte … zusammen« klingt im modernen Deutschen natürlich und gibt die aktive Handlung wieder.
- source_word: τὸ ἔθνος αὐτῶν
  choice: ihr Volk
  rationale: ἔθνος bezeichnet hier das politische und gemeinschaftliche Kollektiv. »Volk« ist im Deutschen natürlicher und historisch weniger missverständlich als »Nation«, das leicht einen modernen Nationalstaat nahelegt.
- source_word: ἐγενήθη αὐτοῖς ἀρχιερεύς
  choice: wurde ihr Hohepriester
  rationale: ἐγενήθη mit einem Prädikatsnomen wird sachgerecht mit »wurde« wiedergegeben; αὐτοῖς erscheint idiomatisch als Possessivpronomen »ihr«.
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: wurde seinem Volk hinzugefügt
  rationale: Die Formulierung bildet das griechische Bild eng nach und bewahrt zugleich den biblischen idiomatischen Bezug auf den Tod, ohne ihn im Haupttext ausdrücklich auszudeuten.
- source_word: λαός
  choice: Volk
  rationale: λαός bedeutet hier die Gemeinschaft, zu der Jonatan gehört. »Volk« ist die übliche, würdevolle deutsche Entsprechung.
theological_decisions:
- issue: Biblische Todesumschreibung in προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: wurde seinem Volk hinzugefügt
  alternative: wurde zu seinem Volk versammelt
  rationale: Der Haupttext wahrt die konkrete Bildsprache von προσετέθη (»wurde hinzugefügt«). Die Fußnote nennt die vertrautere biblische Formulierung und erläutert, dass die Wendung den Tod bezeichnet, ohne weitergehende Aussagen über den Zustand nach dem Tod einzutragen.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die koordinierte Satzstruktur des griechischen Textes bleibt erhalten; unnötig altertümliche Formulierungen werden vermieden.
