base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/041.yaml
  text: and that the Jews and the priests were pleased that Simon should be their leader and high priest forever[a], until a trustworthy prophet should arise.
translation:
  language: de
  text: und dass die Juden und die Priester es gut fanden, dass Simon ihr Anführer und Hoher Priester für immer[a] sein sollte, bis ein vertrauenswürdiger Prophet aufträte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „in Ewigkeit“. Die folgende Aussage „bis ein vertrauenswürdiger Prophet aufträte“ nennt zugleich einen Endpunkt. „Vertrauenswürdig“ kann auch „treu“ oder „wahrhaftig“ bedeuten.
    reason: Die Dauerformel, ihre Spannung zur Bis-Klausel und die lexikalische Offenheit von πιστός sollen sichtbar bleiben.
lexical_decisions:
- source_word: εὐδόκησαν
  choice: beschlossen
  rationale: Das Verb bezeichnet hier zustimmende Billigung; im Zusammenhang eines förmlichen politischen und priesterlichen Beschlusses gibt „beschlossen“ den Sinn im Deutschen natürlich wieder.
- source_word: ἡγούμενον
  choice: Anführer
  rationale: Die substantivierte Form bezeichnet Simons leitende politische Stellung, ohne ein genaueres Amt wie „Statthalter“ oder „Herrscher“ festzulegen.
- source_word: ἀρχιερέα
  choice: Hoher Priester
  rationale: Die geläufige deutsche Bezeichnung für das hier gemeinte anerkannte priesterliche Amt.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die Wendung bezeichnet eine dauerhafte, zeitlich offene Einsetzung. Die nachfolgende Bis-Klausel bleibt als ausdrückliche Spannung erhalten.
- source_word: ἕως τοῦ ἀναστῆναι
  choice: bis … aufträte
  rationale: Die Konstruktion markiert den erwarteten Endpunkt von Simons Amtsstellung; „aufträte“ gibt das künftige Erscheinen eines Propheten idiomatisch wieder.
- source_word: προφήτην πιστόν
  choice: ein vertrauenswürdiger Prophet
  rationale: πιστός kann „treu“, „vertrauenswürdig“ oder „zuverlässig“ bedeuten. Hier liegt die Vertrauenswürdigkeit beziehungsweise Anerkennbarkeit des Propheten nahe, ohne die anderen Bedeutungsnuancen auszuschließen.
theological_decisions:
- issue: Geltungsdauer von Simons Amt angesichts von εἰς τὸν αἰῶνα und der folgenden ἕως-Klausel
  choice: „für immer“, unmittelbar qualifiziert durch „bis ein vertrauenswürdiger Prophet aufträte“
  alternative: „auf Dauer“ oder eine Harmonisierung, die entweder die Dauerformel oder die Begrenzung abschwächt
  rationale: Der griechische Text stellt eine scheinbar dauerhafte Einsetzung und zugleich einen möglichen Endpunkt nebeneinander. Die Übersetzung bewahrt diese Spannung, statt sie aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Anführer“ ist bewusst weiter als „Herrscher“ oder „Statthalter“; „Hoher Priester“ folgt dem etablierten biblischen Sprachgebrauch.
