  text: καὶ ὅτι οἱ Ἰουδαῖοι καὶ οἱ ἱερεῖς εὐδόκησαν τοῦ εἶναι αὐτῶν Σίμωνα ἡγούμενον καὶ ἀρχιερέα εἰς τὸν αἰῶνα, ἕως τοῦ ἀναστῆναι προφήτην πιστόν·
