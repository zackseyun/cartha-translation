  source_fidelity: Die Orts- und Versammlungsangabe sowie die Reihenfolge der genannten Gruppen entsprechen dem griechischen Text. Die Formel ἐγνώσθη ἡμῖν wird mit „wurde uns Folgendes bekannt“ angemessen passiv und amtlich wiedergegeben. Die vorhandene Fußnotenalternative „Bei Saramel“ ist jedoch keine gleichwertige Wiedergabe von ἐν Σαραμέλ, da sie im heutigen Deutsch eher die Nähe zu einem Ort als den Ort der Versammlung selbst ausdrückt.
