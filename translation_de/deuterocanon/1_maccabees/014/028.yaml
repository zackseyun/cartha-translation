  text: 'At Saramel[a], in a great assembly of the priests and the people and the leaders of the nation and the elders of the country[b], it was made known to us:'
translation:
  language: de
  text: 'In Saramel, in einer großen Versammlung der Priester, des Volkes, der führenden Männer des Volkes und der Ältesten des Landes, wurde uns Folgendes bekannt:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Σαραμέλ
  choice: In Saramel
  rationale: ἐν bezeichnet mit einem Ortsnamen den Ort des Geschehens; im Deutschen ist „in“ die natürliche Wiedergabe. Der Ortsname wird transliteriert.
- source_word: συναγωγῆς μεγάλης
  choice: in einer großen Versammlung
  rationale: συναγωγή bezeichnet hier eine öffentliche Zusammenkunft, nicht ein Synagogengebäude. „Groß“ bewahrt sowohl den möglichen Umfang als auch den feierlich-offiziellen Ton.
- source_word: τῶν ἱερέων καὶ λαοῦ καὶ ἀρχόντων ἔθνους καὶ τῶν πρεσβυτέρων τῆς χώρας
  choice: der Priester, des Volkes, der führenden Männer des Volkes und der Ältesten des Landes
  rationale: Die koordinierte Genitivfolge bleibt erhalten. ἄρχοντες wird verständlich und ohne Überbetonung eines formalen Herrscheramtes als „führende Männer“ wiedergegeben. ἔθνος meint hier das jüdische Volk; χώρα dessen Land bzw. Gebiet.
- source_word: ἐγνώσθη ἡμῖν
  choice: wurde uns Folgendes bekannt gegeben
  rationale: Die passive, amtlich klingende Formulierung wird bewahrt. „Folgendes“ macht im Deutschen natürlich kenntlich, dass die anschließende Inschrift bzw. Erklärung eingeführt wird.
