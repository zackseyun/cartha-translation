revisions:
- from: Und das Volk sah Simons Treue und die Ehre, die er seinem Volk verschaffen wollte. Darum setzten sie ihn zu ihrem Führer und Hohen Priester ein, weil er all dies getan und seinem Volk gegenüber Gerechtigkeit[a] und Treue bewahrt hatte und weil er auf jede Weise danach gestrebt hatte, sein Volk zu erhöhen.
  to: Und das Volk sah Simons Treue und die Ehre, die er seinem Volk verschaffen wollte, und sie setzten ihn als ihren Anführer und Hohenpriester ein, weil er all dies getan und seinem Volk gegenüber Gerechtigkeit[a] und Treue bewahrt hatte und weil er auf jede Weise danach gestrebt hatte, sein Volk zu erhöhen.
  rationale: Die Revision ersetzt die interpretierend verstärkende Konjunktion „Darum“ durch das dem griechischen καί entsprechende „und“ und vermeidet die im modernen Deutschen belastete Bezeichnung „Führer“. Im Übrigen bleibt die kontextgerechte Wiedergabe der wiederholten πίστις als „Treue“ sowie die Fußnotenalternative zu δικαιοσύνη erhalten.
