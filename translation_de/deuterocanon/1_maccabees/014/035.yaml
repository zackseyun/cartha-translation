  yaml_path: translation/deuterocanon/1_maccabees/014/035.yaml
  text: And the people saw the faithfulness of Simon and the glory that he had purposed to bring about for his nation[a], and they appointed him as their leader and high priest, because he had done all these things, and because of the righteousness and the faithfulness that he had maintained for his nation[b], and because he had sought in every way to exalt his people.
translation:
  language: de
  text: Und das Volk sah Simons Treue und die Ehre, die er seinem Volk verschaffen wollte, und sie setzten ihn als ihren Anführer und Hohenpriester ein, weil er all dies getan und seinem Volk gegenüber Gerechtigkeit[a] und Treue bewahrt hatte und weil er auf jede Weise danach gestrebt hatte, sein Volk zu erhöhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Rechtschaffenheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν / πίστιν
  choice: Treue
  rationale: Im historischen und politischen Zusammenhang bezeichnet πίστις Simons erwiesene Zuverlässigkeit und Loyalität gegenüber seinem Volk. „Treue“ gibt beide Vorkommen natürlich und kontextgerecht wieder.
- source_word: δόξαν
  choice: Ehre
  rationale: δόξα meint hier am ehesten Ansehen, ehrenvolle Stellung oder Ruhm, den Simon seinem Volk verschaffen wollte. „Ehre“ bewahrt die gehobene Sprache, ohne einen ausschließlich religiösen Sinn nahezulegen.
- source_word: ἐβουλεύσατο ποιῆσαι
  choice: verschaffen wollte
  rationale: Die Wendung bezeichnet einen überlegten Vorsatz. Im Deutschen bringt „verschaffen wollte“ die auf das Volk gerichtete Absicht idiomatisch zum Ausdruck.
- source_word: ἔθνει
  choice: Volk
  rationale: ἔθνος bezeichnet hier die eigene nationale Gemeinschaft Simons. „Volk“ ist im Deutschen natürlich und vermeidet die mögliche moderne staatsrechtliche Verengung von „Nation“.
- source_word: ἔθεντο
  choice: setzten ... ein
  rationale: Das Verb beschreibt hier die förmliche Bestellung in leitende Ämter. „Einsetzen“ ist dafür die passende idiomatische Wiedergabe.
- source_word: ἡγούμενον
  choice: Führer
  rationale: Der Ausdruck bezeichnet allgemein einen leitenden oder regierenden Mann, ohne ein bestimmtes politisches Amt festzulegen.
- source_word: ἀρχιερέα
  choice: Hohen Priester
  rationale: Dies ist die etablierte deutsche Bezeichnung für das höchste jüdische Priesteramt.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: δικαιοσύνη kann hier gerechtes, rechtschaffenes Handeln gegenüber dem Volk bezeichnen. „Gerechtigkeit“ erhält die ethische und öffentliche Bedeutungsbreite.
- source_word: συνετήρησεν
  choice: bewahrt hatte
  rationale: Das Kompositum bezeichnet fortgesetztes Bewahren oder Aufrechterhalten. „Bewahrt hatte“ lässt die ungewöhnliche Verbindung mit Gerechtigkeit und Treue stehen, ohne sie stärker auszudeuten.
- source_word: ἐζήτησεν παντὶ τρόπῳ
  choice: auf jede Weise danach gestrebt hatte
  rationale: Die Formulierung hebt umfassendes, zielgerichtetes Bemühen hervor und klingt im Deutschen natürlich.
- source_word: ὑψῶσαι
  choice: zu erhöhen
  rationale: Gemeint ist die Erhöhung des Ansehens oder der Stellung des Volkes. „Erhöhen“ bewahrt das Bild und den gehobenen Ton.
- source_word: λαὸν
  choice: Volk
  rationale: λαός bezeichnet das Volk als gemeinschaftlichen Verband. Die Wiederholung von „Volk“ ist im Deutschen klar und entspricht dem kollektiven Bezug.
theological_decisions:
- issue: Bedeutung von πίστις als Charakterisierung Simons
  choice: Treue
  alternative: Glaube
  rationale: Der Zusammenhang nennt Simons nachgewiesenes Verhalten und seine Loyalität gegenüber dem Volk; daher ist „Treue“ hier semantisch näher als „Glaube“. Die mögliche Grundbedeutung darf nicht zu einer kontextfremden theologischen Aussage über Simons Glauben führen.
- issue: Bedeutung von δικαιοσύνη im politisch-geschichtlichen Zusammenhang
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der Begriff kann sowohl persönliche Rechtschaffenheit als auch gerechtes öffentliches Handeln bezeichnen. „Gerechtigkeit“ wahrt diese Spannung; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die langen griechischen Satzglieder wurden durch einen Satzschluss nach dem Vorsatz Simons übersichtlich gegliedert. „Darum“ macht die im griechischen καί anschließende Folgerung idiomatisch deutlich, ohne einen neuen Sachgehalt einzuführen.
