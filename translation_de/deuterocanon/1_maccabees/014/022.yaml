  register: Modernes, würdiges Standarddeutsch mit urkundlich-diplomatischem Ton. Die griechischen Personennamen werden in eingedeutschter Transkription wiedergegeben. Die syntaktische Spannung des einleitenden Partizips bleibt durch den vorzeitigen Nebensatz erhalten; die mögliche Bandbreite von βουλαί und φιλία wird nicht im Haupttext vereindeutigt, sondern in Fußnoten offengelegt.
