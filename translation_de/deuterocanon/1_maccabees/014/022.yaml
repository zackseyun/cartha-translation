  yaml_path: translation/deuterocanon/1_maccabees/014/022.yaml
  text: 'And after recording in the public records what had been said by them[a], thus: “Numenius son of Antiochus and Antipater son of Jason, ambassadors of the Jews[c][b], came to us renewing their friendship with us.”'
translation:
  language: de
  text: 'Und nachdem sie das, was diese gesagt hatten, in den Beschlüssen des Volkes[a] verzeichnet hatten, wie folgt: »Numenios, der Sohn des Antiochos, und Antipatros, der Sohn Jasons, Gesandte der Juden[b], kamen zu uns, um die Freundschaft mit uns[c] zu erneuern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Beratungen des Volkes« beziehungsweise »in den amtlichen Aufzeichnungen des Volkes«. Der griechische Ausdruck kann Beschlüsse oder Beratungen der Volksversammlung bezeichnen und bezieht sich hier wahrscheinlich auf deren amtliche Dokumentation.'
    reason: lexical_alternative
  - marker: b
    text: Vor »Juden« steht im überlieferten griechischen Text ein einzelnes Alpha (Α), das wahrscheinlich ein Schreib- oder Überlieferungsfehler ist und keinen erkennbaren Sinn ergibt.
    reason: textual_variant
  - marker: c
    text: »Freundschaft« ist hier ein diplomatischer Ausdruck und kann offizielle freundschaftliche Beziehungen, möglicherweise auch ein Bündnis, bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγραψάμενοι
  choice: nachdem sie … hatten festhalten lassen
  rationale: Das Partizip bezeichnet die schriftliche Eintragung beziehungsweise amtliche Aufzeichnung. Die deutsche Formulierung gibt sowohl den vorzeitigen Ablauf als auch den offiziellen Charakter des Vorgangs natürlich wieder.
- source_word: τὰ ὑπ’ αὐτῶν εἰρημένα
  choice: das, was diese gesagt hatten
  rationale: Die Formulierung bewahrt den Rückbezug auf die zuvor genannten Gesandten und die Vorzeitigkeit ihrer Äußerungen.
- source_word: ἐν ταῖς βουλαῖς τοῦ δήμου
  choice: in den Beschlüssen des Volkes
  rationale: βουλαί kann hier Beratungen oder Beschlüsse eines politischen Gemeinwesens bezeichnen. Im urkundlichen Zusammenhang ist »Beschlüsse des Volkes« sachgerecht, ohne den Ausdruck vorschnell mit »öffentliche Akten« gleichzusetzen.
- source_word: οὕτως
  choice: und zwar folgendermaßen
  rationale: Der Ausdruck leitet den genauen Wortlaut der amtlichen Eintragung ein.
- source_word: πρεσβευταί
  choice: Gesandte
  rationale: Das Wort bezeichnet offizielle diplomatische Vertreter. »Gesandte« ist im Deutschen präzise, würdig und weniger an moderne ständige Botschaften gebunden als »Botschafter«.
- source_word: Α Ἰουδαίων
  choice: der Juden
  rationale: Das isolierte Alpha im überlieferten Text ergibt hier keinen erkennbaren syntaktischen Sinn; die klare Lesart ist »Gesandte der Juden«.
- source_word: ἀνανεούμενοι
  choice: um … zu erneuern
  rationale: Das Partizip bezeichnet die Erneuerung einer bereits bestehenden Beziehung und lässt sich im Deutschen als Zweck der Reise natürlich ausdrücken.
- source_word: τὴν πρὸς ἡμᾶς φιλίαν
  choice: die Freundschaft mit uns
  rationale: Die Wiedergabe bleibt beim Grundsinn von φιλία, während der diplomatische Kontext durch eine Fußnote erläutert wird, statt unmittelbar »Bündnis« in den Text einzutragen.
