  yaml_path: translation/deuterocanon/1_maccabees/014/011.yaml
  text: He made peace upon the land, and Israel rejoiced with great joy.
translation:
  language: de
  text: Er schuf Frieden im Land[a], und Israel freute sich mit großer Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf der Erde«; wörtlich: »auf dem Land/der Erde«.'
    reason: Das griechische γῆ kann »Land« oder »Erde« bedeuten; ἐπί mit Genitiv lautet formal »auf«, während »im Land« hier das natürlichere Deutsche ist.
lexical_decisions:
- source_word: ἐποίησεν
  choice: Er schuf
  rationale: Der Aorist von ποιέω hat hier »Frieden« zum Objekt. »Schuf« gibt die einfache und wirksame Handlung knapp wieder, ohne sie durch »stellte her« oder »sorgte für« auszudeuten.
- source_word: τὴν εἰρήνην
  choice: Frieden
  rationale: Der bestimmte Artikel muss im Deutschen in dieser Verbindung nicht wiedergegeben werden. Gemeint ist ein Zustand öffentlichen Friedens.
- source_word: ἐπὶ τῆς γῆς
  choice: im Land
  rationale: γῆ bezeichnet im Kontext eher das Land beziehungsweise Herrschaftsgebiet als die ganze Erde. »Im Land« ist im modernen Deutschen natürlich; das formal nähere »auf dem Land« könnte fälschlich als Gegensatz zur Stadt verstanden werden.
- source_word: ηὐφράνθη
  choice: freute sich
  rationale: Die passive beziehungsweise deponentische Form bezeichnet Israels freudige Reaktion. »Freute sich« ist idiomatisch und wahrt den Sinn.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Die übliche deutsche Namensform; hier bezeichnet sie das Volk.
- source_word: εὐφροσύνην μεγάλην
  choice: mit großer Freude
  rationale: Der Akkusativ verstärkt die Aussage des Verbs. Die bewusste Wiederholung der Freude bleibt erhalten, obwohl sie im Deutschen leicht feierlich klingt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung in »freute sich mit großer Freude« wurde als Stilmerkmal des griechischen Textes bewusst bewahrt.
