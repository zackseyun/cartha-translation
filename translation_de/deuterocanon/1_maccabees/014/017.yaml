  yaml_path: translation/deuterocanon/1_maccabees/014/017.yaml
  text: But when they heard that Simon his brother had become high priest in his place and was ruling over the country and the cities in it,
translation:
  language: de
  text: Als sie aber hörten, dass sein Bruder Simon an seiner Stelle Hoher Priester geworden war und über das Land und die darin liegenden Städte herrschte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Als sie aber hörten
  rationale: ὡς mit dem Aorist leitet hier einen temporalen Nebensatz ein; δέ markiert den Fortgang der Erzählung mit leichter Gegenüberstellung. „Als sie aber hörten“ bildet beides natürlich ab.
- source_word: Σίμων ὁ ἀδελφὸς αὐτοῦ
  choice: sein Bruder Simon
  rationale: Die Apposition bezeichnet Simon als Bruder der zuvor erwähnten Person. Diese Wortfolge ist im Deutschen natürlich und eindeutig.
- source_word: γέγονεν
  choice: geworden war
  rationale: Das Perfekt bezeichnet einen eingetretenen und fortbestehenden Zustand. Das Plusquamperfekt macht deutlich, dass Simons Amtsantritt dem Hören vorausging.
- source_word: ἀντ' αὐτοῦ
  choice: an seiner Stelle
  rationale: ἀντί bezeichnet hier Nachfolge beziehungsweise Ersetzung im Amt; „an seiner Stelle“ gibt dies idiomatisch wieder.
- source_word: ἀρχιερεὺς
  choice: Hoher Priester
  rationale: Dies ist die etablierte deutsche Bezeichnung für das jüdische Amt und bleibt zugleich allgemein verständlich.
- source_word: ἐπικρατεῖ
  choice: herrschte über
  rationale: ἐπικρατέω bezeichnet hier wirksame politische Kontrolle oder Herrschaft. „herrschte über“ wahrt diese Kraft, ohne zusätzliche institutionelle Einzelheiten einzutragen.
- source_word: τῆς χώρας
  choice: das Land
  rationale: χώρα meint hier das Gebiet als Ganzes. „Land“ ist im historischen Zusammenhang natürlich und lässt die genaue politische Gebietsform offen.
- source_word: τῶν πόλεων τῶν ἐν αὐτῇ
  choice: die darin liegenden Städte
  rationale: Die Formulierung bewahrt die ausdrückliche räumliche Beziehung zwischen dem Land und den Städten.
theological_decisions:
- issue: Politische Aussagekraft von ἐπικρατεῖ
  choice: herrschte über
  alternative: hatte die Kontrolle über
  rationale: Der Ausdruck beschreibt territoriale und städtische Macht in einer historischen Erzählung. „herrschte über“ vermittelt politische Autorität, ohne eine besondere spätere Amts- oder Herrschaftslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt entsprechend dem griechischen Ausgangstext syntaktisch offen und endet mit einem Komma, da der Satz im folgenden Vers fortgesetzt wird.
