  yaml_path: translation/deuterocanon/1_maccabees/014/004.yaml
  text: And the land was at rest all the days of Simon, and he sought good for his nation; and his authority and his glory were pleasing to them all his days.
translation:
  language: de
  text: Und solange Simon lebte, hatte das Land Ruhe. Er suchte das Wohl seines Volkes, und seine Herrschaft und sein Ruhm gefielen ihnen sein Leben lang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ
  choice: das Land hatte Ruhe
  rationale: Die Formulierung gibt den ruhigen, gefestigten Zustand des Landes wieder, ohne ausdrücklich einen Friedensvertrag oder eine göttliche Verursachung anzunehmen.
- source_word: πάσας τὰς ἡμέρας Σίμωνος
  choice: während der ganzen Zeit Simons
  rationale: Dies bewahrt die zeitliche Gesamtaussage des Griechischen in natürlichem modernem Deutsch, ohne die ungewöhnliche Wendung „alle Tage Simons“ nachzuahmen.
- source_word: ἐζήτησεν ἀγαθὰ
  choice: suchte das Wohl
  rationale: „Das Wohl suchen“ drückt das aktive Streben nach Gutem zugunsten des Volkes idiomatisch und ohne unnötige Ausdeutung aus.
- source_word: τῷ ἔθνει αὐτοῦ
  choice: seines Volkes
  rationale: Im historischen Zusammenhang bezeichnet ἔθνος das jüdische Volk als ethnisch-politische Gemeinschaft. „Volk“ ist im Deutschen natürlicher und weniger an den modernen Nationalstaat gebunden als „Nation“.
- source_word: ἡ ἐξουσία αὐτοῦ
  choice: seine Herrschaft
  rationale: Im politischen Kontext bezeichnet ἐξουσία Simons ausgeübte Leitungs- und Regierungsgewalt. „Herrschaft“ ist hier konkreter als „Autorität“, ohne ein Königtum zu behaupten.
- source_word: ἡ δόξα αὐτοῦ
  choice: sein Ruhm
  rationale: „Ruhm“ wahrt den gehobenen Ton und die öffentliche Anerkennung, die δόξα in diesem politischen Lob ausdrücken kann.
- source_word: ἤρεσεν αὐτοῖς
  choice: gefielen ihnen
  rationale: Die Wiedergabe bleibt nahe am wertenden Sinn des griechischen Verbs und bezieht sowohl Simons Herrschaft als auch seinen Ruhm auf die Zustimmung des Volkes.
- source_word: πάσας τὰς ἡμέρας
  choice: während seiner ganzen Zeit
  rationale: Die Wiederholung der Zeitangabe wird wie im Griechischen beibehalten; zugleich bleibt offen, ob vor allem Simons Amtszeit oder seine Lebenszeit gemeint ist.
theological_decisions:
- issue: Politisches Lob der Führung Simons
  choice: Der Vers wird als historische Würdigung seiner Regierungszeit wiedergegeben.
  alternative: Die Ruhe des Landes ausdrücklich als von Gott geschenkten Frieden oder als messianisches Motiv deuten.
  rationale: Der griechische Text nennt weder Gott als Handelnden noch kennzeichnet er Simon messianisch. Daher fügt die Übersetzung keine solche theologische Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweifache Zeitangabe des Ausgangstextes bleibt erhalten. „Während seiner ganzen Zeit“ wahrt die mögliche Spannung zwischen Lebenszeit und Herrschaftszeit, während „Volk“ den historischen Gemeinschaftsbezug natürlicher ausdrückt als das modern-staatlich klingende „Nation“.
