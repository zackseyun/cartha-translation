  yaml_path: translation/deuterocanon/1_maccabees/014/024.yaml
  text: After these things Simon sent Numenius to Rome[a], carrying a large gold shield weighing a thousand minas, to establish the alliance with them.
translation:
  language: de
  text: Danach sandte Simon Numenius nach Rom; er hatte einen großen goldenen Schild bei sich, der tausend Minen[a] wog, um das Bündnis mit ihnen zu schließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Mine war eine antike Gewichtseinheit; die Angabe bezeichnet einen außergewöhnlich schweren und wertvollen diplomatischen Geschenkgegenstand.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Gibt den zeitlichen Übergang und die Anknüpfung an die vorausgehenden Ereignisse natürlich und prägnant wieder.
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Direkte und im würdevollen Erzählstil natürliche Wiedergabe des Aorists.
- source_word: Νουμήνιον
  choice: Numenius
  rationale: Der Personenname wird nach geläufiger deutscher Tradition transliteriert.
- source_word: εἰς Ῥώμην
  choice: nach Rom
  rationale: Bei Städten wird die durch εἰς bezeichnete Richtung im Deutschen idiomatisch mit „nach“ ausgedrückt.
- source_word: ἔχοντα
  choice: Er führte … mit sich
  rationale: Das Partizip beschreibt, was Numenius auf seiner Gesandtschaft mitnahm; die Auflösung in einen zweiten Satz vermeidet eine schwerfällige deutsche Partizipialkonstruktion.
- source_word: ἀσπίδα χρυσῆν μεγάλην
  choice: einen großen goldenen Schild
  rationale: ἀσπίς bezeichnet einen Schild, χρυσῆν das Material und μεγάλην dessen Größe.
- source_word: ὁλκὴν μνῶν χιλίων
  choice: der tausend Minen wog
  rationale: ὁλκή bezeichnet hier das Gewicht; die Relativsatzkonstruktion ist im modernen Deutsch klar und natürlich.
- source_word: εἰς τὸ στῆσαι
  choice: um … zu festigen
  rationale: Die Konstruktion bezeichnet den Zweck. „Festigen“ bewahrt im diplomatischen Zusammenhang die Möglichkeit, dass das Bündnis förmlich hergestellt oder bestätigt werden sollte.
- source_word: πρὸς αὐτοὺς
  choice: mit ihnen
  rationale: Die Präposition bezeichnet hier die Beziehung zu den Römern.
- source_word: τὴν συμμαχίαν
  choice: das Bündnis
  rationale: συμμαχία bezeichnet ein politisches oder militärisches Bündnis; „Bündnis“ ist die direkte und kontextgerechte Wiedergabe.
