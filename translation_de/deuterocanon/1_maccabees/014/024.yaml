- from: Danach sandte Simon Numenius nach Rom. Er führte einen großen goldenen Schild mit sich, der tausend Minen[a] wog, um das Bündnis mit ihnen zu festigen.
  to: Danach sandte Simon Numenius nach Rom; er hatte einen großen goldenen Schild bei sich, der tausend Minen[a] wog, um das Bündnis mit ihnen zu schließen.
  rationale: Die Revision ersetzt „festigen“ durch „schließen“, um den zielgerichteten Sinn von στῆσαι τὴν συμμαχίαν genauer wiederzugeben, und bindet den Schild enger an Numenius als Träger. Die pronominale Bezugnahme auf die Römer bleibt wie im griechischen Text erhalten.
