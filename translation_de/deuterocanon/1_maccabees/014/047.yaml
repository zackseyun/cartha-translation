base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/047.yaml
  text: And Simon accepted it[a], and agreed to be high priest and to be commander and ethnarch of the Jews and priests[c][b], and to be over them all.
translation:
  language: de
  text: Und Simon nahm dies an und erklärte sich bereit, als Hoher Priester zu amtieren, Heerführer und Ethnarch[a] der Juden[b] und der Priester zu sein und ihnen allen vorzustehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ethnarch“ ist ein historischer politischer Titel und bezeichnet ungefähr den Herrscher oder Leiter eines Volkes.
    reason: cultural_note
  - marker: b
    text: 'Oder: „der Judäer“. Das griechische Wort kann Juden als Volk oder Judäer im geografisch-ethnischen Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „allem vorzustehen“. Das Griechische kann sich auf alle zuvor Genannten oder allgemeiner auf alles beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: nahm dies an
  rationale: Das Medium bezeichnet hier Simons Annahme der zuvor beschriebenen Regelung beziehungsweise Ämter; „dies“ macht den im Griechischen unausgesprochenen Bezug natürlich deutlich.
- source_word: εὐδόκησεν
  choice: erklärte sich bereit
  rationale: Im Zusammenhang drückt das Verb Simons willige Zustimmung zur Übernahme der genannten Ämter aus. Die Formulierung ist im Deutschen natürlicher und genauer als ein missverständliches „hatte Gefallen daran“.
- source_word: ἀρχιερατεύσαι
  choice: als Hoher Priester zu amtieren
  rationale: Der Verbinfinitiv bezeichnet die Ausübung des hohepriesterlichen Amtes, nicht nur das Tragen eines Titels.
- source_word: στρατηγός
  choice: Heerführer
  rationale: Die Bezeichnung meint einen militärischen Befehlshaber; „Heerführer“ bewahrt den historischen Charakter und bleibt allgemein verständlich.
- source_word: ἐθνάρχης
  choice: Ethnarch
  rationale: Der historische politische Amtstitel wird beibehalten, damit seine besondere, nicht völlig sicher bestimmbare verfassungsrechtliche Bedeutung nicht auf einen allgemeinen Herrschertitel reduziert wird.
- source_word: Ἰουδαίων
  choice: der Juden
  rationale: Der Ausdruck kann ethnisch „Juden“ oder geoethnisch „Judäer“ bedeuten. Im nationalpolitischen Zusammenhang ist „Juden“ eine natürliche Wiedergabe; die andere Möglichkeit wird in einer Fußnote genannt.
- source_word: ἱερέων
  choice: der Priester
  rationale: Direkte Wiedergabe des Plurals; der bestimmte Artikel macht die genitivische Zuordnung im Deutschen klar.
- source_word: προστῆσαι
  choice: vorzustehen
  rationale: Das Verb bezeichnet, über anderen zu stehen, sie zu leiten oder ihnen vorzustehen. „Vorzustehen“ bewahrt den Leitungsaspekt in würdigem, verständlichem Deutsch.
- source_word: ἁπάντων
  choice: ihnen allen
  rationale: Der Genitiv Plural wird auf die zuvor genannten Menschen beziehungsweise Gruppen bezogen. Das Pronomen stellt diesen Bezug im Deutschen idiomatisch her, ohne die mögliche allgemeinere Lesart zu verschweigen.
theological_decisions:
- issue: Wiedergabe des politischen Titels ἐθνάρχης
  choice: Ethnarch
  alternative: Volksführer; Herrscher des Volkes
  rationale: Die Transliteration erhält die historische Eigenart des Amtes und vermeidet eine zu genaue Festlegung seiner politischen Befugnisse.
- issue: Bedeutungsumfang von Ἰουδαίων
  choice: der Juden
  alternative: der Judäer
  rationale: Das griechische Wort kann das jüdische Volk oder die Menschen aus Judäa bezeichnen. Der Kontext einer nationalen Leitungsfunktion spricht eher für die Volksbezeichnung, doch die geoethnische Lesart bleibt möglich.
- issue: Bezug von ἁπάντων
  choice: ihnen allen
  alternative: allem vorzustehen; über alles gesetzt zu sein
  rationale: Die Form kann sich auf alle zuvor genannten Personen beziehungsweise Gruppen beziehen, möglicherweise aber allgemeiner auf alles. Die Hauptfassung folgt dem wahrscheinlichsten persönlichen Bezug und hält die weitere Möglichkeit in der Fußnote offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Als Hoher Priester zu amtieren“ gibt den aktiven Amtsvollzug wieder; „Heerführer“ und „vorzustehen“ bewahren den historischen Ton, ohne unnötig altertümlich zu wirken. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erklärten Formulierung.
