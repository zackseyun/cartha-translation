  text: And he strengthened all the humble of his people[a]; he sought out the law[b], and removed every lawless and evil thing.
translation:
  language: de
  text: Und er stärkte alle Niedrigen seines Volkes[a]; er suchte eifrig nach dem Gesetz[b] und beseitigte alles Gesetzlose und Böse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Demütigen seines Volkes“. Das griechische Wort kann sowohl Menschen in niedriger gesellschaftlicher Stellung als auch demütige Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit „dem Gesetz“ ist wahrscheinlich das überlieferte jüdische Gesetz gemeint, also die Tora.
    reason: cultural_note
lexical_decisions:
- source_word: ἐστήρισεν
  choice: stärkte
  rationale: Das Verb bezeichnet ein Festigen oder Stärken. „Stärkte“ wahrt den konkreten Sinn und passt natürlich zu Simons Handeln an den Niedrigen seines Volkes.
- source_word: πάντας τοὺς ταπεινοὺς
  choice: alle Niedrigen
  rationale: ταπεινός kann Menschen in niedriger gesellschaftlicher Stellung ebenso wie demütige Menschen bezeichnen. „Niedrigen“ hält die soziale und charakterliche Nuance offen; „Armen“ wäre zu eng.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: seines Volkes
  rationale: Die Formulierung gibt die Genitivverbindung und den possessiven Bezug knapp und natürlich wieder.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Gemeint ist im Kontext wahrscheinlich das überlieferte jüdische Gesetz, also die Tora. „Das Gesetz“ ist verständlich, ohne mehr festzulegen, als der griechische Text ausdrücklich sagt.
- source_word: ἐξεζήτησεν
  choice: suchte eifrig nach
  rationale: Das zusammengesetzte Verb drückt ein nachdrückliches, zielgerichtetes Suchen aus. „Suchte eifrig nach“ bringt diese Intensivierung im Deutschen klar zum Ausdruck.
- source_word: ἐξῆρεν
  choice: beseitigte
  rationale: Das Verb bedeutet wegnehmen oder entfernen. „Beseitigte“ lässt offen, ob Personen, Praktiken oder Zustände gemeint sind.
- source_word: πάντα ἄνομον καὶ πονηρόν
  choice: alles Gesetzlose und Böse
  rationale: Die substantivierten sächlichen Adjektive werden idiomatisch mit „alles Gesetzlose und Böse“ wiedergegeben. „Gesetzlose“ bewahrt zugleich den sprachlichen Bezug auf „das Gesetz“.
theological_decisions:
- issue: Ob νόμος ausdrücklich als Tora beziehungsweise durch besondere Großschreibung gekennzeichnet werden soll
  choice: das Gesetz
  alternative: die Tora
  rationale: Der Zusammenhang weist deutlich auf das überlieferte jüdische Gesetz hin, doch νόμος selbst nennt nicht ausdrücklich „Tora“. Die Hauptübersetzung bleibt daher nah am Wortlaut; die Fußnote erläutert den wahrscheinlichen kulturellen Bezug.
- issue: Ob ταπεινοὺς vor allem sozial oder charakterlich zu verstehen ist
  choice: die Niedrigen
  alternative: die Demütigen
  rationale: Der Ausdruck kann sowohl Menschen von niedrigem gesellschaftlichem Rang als auch Demütige bezeichnen. „Niedrigen“ bewahrt diese Spannung besser, während die Fußnote die charakterliche Lesart nennt.
- issue: Ob πάντα ἄνομον καὶ πονηρόν Personen, Handlungen oder Zustände bezeichnet
  choice: alles Gesetzlose und Böse
  alternative: jeden Gesetzlosen und Bösen
  rationale: Die griechischen Formen sind sächlich und lassen einen umfassenden Bezug auf gesetzlose und böse Dinge, Praktiken oder Zustände zu. Die sächliche deutsche Wiedergabe wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Satzbau, jedoch natürlicher deutscher Wortstellung. Die wiederholte Gesetzes-Terminologie wird durch „Gesetz“ und „Gesetzlose“ bewusst bewahrt.
