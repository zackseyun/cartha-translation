  yaml_path: translation/deuterocanon/1_maccabees/014/018.yaml
  text: And they wrote to him on bronze tablets to renew with him the friendship and the alliance that they had established with Judas and Jonathan his brothers[a].
translation:
  language: de
  text: Und sie schrieben ihm auf Bronzetafeln, um mit ihm die Freundschaft und das Bündnis zu erneuern, die sie mit Judas und Jonatan, seinen Brüdern, geschlossen hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bronzeplatten“. Das Griechische bezeichnet beschriftete Tafeln aus Bronze, vermutlich als dauerhafte öffentliche oder diplomatische Urkunde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψαν πρὸς αὐτὸν δέλτους χαλκᾶς
  choice: sie ließen für ihn auf Bronzetafeln schreiben
  rationale: Die Formulierung bewahrt den allgemeinen Sinn von ἔγραψαν und macht zugleich idiomatisch deutlich, dass der Text auf bronzenen Schreibtafeln festgehalten und an ihn gerichtet wurde. Das Deutsche vermeidet die missverständliche Vorstellung, man habe die Tafeln selbst verfasst.
- source_word: τοῦ ἀνανεώσασθαι
  choice: um … zu erneuern
  rationale: Der artikulierte Infinitiv bezeichnet hier den Zweck; die deutsche Konstruktion mit „um … zu“ gibt dies natürlich wieder.
- source_word: φιλίαν
  choice: die Freundschaft
  rationale: „Freundschaft“ erhält sowohl den gewöhnlichen Wortsinn als auch den diplomatischen Charakter förmlicher freundschaftlicher Beziehungen.
- source_word: συμμαχίαν
  choice: das Bündnis
  rationale: „Bündnis“ ist die geläufige deutsche Bezeichnung für eine politische oder militärische Allianz.
- source_word: ἔστησαν
  choice: geschlossen hatten
  rationale: Bei einem Bündnis oder einer förmlichen Freundschaft bezeichnet ἔστησαν deren Begründung; „geschlossen hatten“ ist im Deutschen idiomatisch und kennzeichnet die zeitliche Vorordnung.
- source_word: Ἰούδαν καὶ Ἰωνάθαν τοὺς ἀδελφοὺς αὐτοῦ
  choice: mit seinen Brüdern Judas und Jonatan
  rationale: Die deutsche Wortstellung identifiziert Judas und Jonatan eindeutig als seine Brüder und klingt natürlicher als ein nachgestelltes „seinen Brüdern“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die diplomatischen Begriffe „Freundschaft“ und „Bündnis“ bleiben erhalten; die Formulierung ist zugleich für heutige Leser verständlich.
