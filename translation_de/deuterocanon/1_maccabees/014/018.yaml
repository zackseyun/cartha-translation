review_pass:
  verdict: revise
  source_fidelity: Die kausative Wiedergabe „sie ließen ... schreiben“ gibt das aktivische ἔγραψαν („sie schrieben“) nicht angemessen wieder. Auch „für ihn“ verschiebt πρὸς αὐτόν, das hier „an ihn/ihm“ im Sinn eines diplomatischen Schreibens an Simon bedeutet. Die übrigen Beziehungen – Zweck der Erneuerung sowie die frühere Vereinbarung mit Judas und Jonatan, seinen Brüdern – sind zutreffend erfasst.
  naturalness: „Sie schrieben ihm auf Bronzetafeln“ ist modernes, verständliches Standarddeutsch und wahrt zugleich die knappe Form des griechischen Satzes. „Freundschaft und Bündnis“ klingt in diesem diplomatischen Kontext natürlich und würdig.
  terminology: „Bronzetafeln“, „Freundschaft“ und „Bündnis“ entsprechen δέλτους χαλκᾶς, φιλία und συμμαχία gut. Die Fußnote sollte die lexikalische Alternative bei δέλτους bieten, statt die unzutreffend spezifischere Handlungsweise „eingravieren“ als Alternative zur gesamten Formulierung nahezulegen.
  issues:
  - severity: medium
    issue: „ließen für ihn ... schreiben“
    rationale: Das Griechische hat das Aktiv ἔγραψαν, nicht eine Veranlassungskonstruktion. „Für ihn“ bedeutet zudem etwas anderes als πρὸς αὐτόν („an ihn/ihm“).
  - severity: low
    issue: Fußnotenalternative „auf Bronzetafeln eingravieren“
    rationale: ἐγράφω bedeutet hier grundsätzlich „schreiben“; eine Gravur kann durch das Material nahegelegt sein, wird aber nicht ausdrücklich bezeichnet. Eine Alternative zu δέλτους ist „Bronzeplatten“.
