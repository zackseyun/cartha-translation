  yaml_path: translation/deuterocanon/1_maccabees/014/045.yaml
  text: But if anyone does anything contrary to these things[a], or sets aside any of them, he shall be liable.
translation:
  language: de
  text: Wer aber gegen diese Bestimmungen handelt oder eine davon außer Kraft setzt, macht sich schuldig[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist haftbar“. Der griechische Ausdruck kann rechtliche Haftbarkeit oder Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα
  choice: gegen diese Bestimmungen
  rationale: παρά mit Akkusativ bezeichnet zusammen mit ποιέω hier einen Verstoß gegen die zuvor beschlossenen Regelungen. „Bestimmungen“ macht den rechtlichen Bezug im Deutschen natürlich deutlich.
- source_word: ποιήσῃ
  choice: handelt
  rationale: Das allgemein gebrauchte ποιέω beschreibt hier ein den Bestimmungen zuwiderlaufendes Tun. „handelt“ ergibt mit „gegen“ eine knappe, idiomatische Rechtsformulierung.
- source_word: ἀθετήσῃ
  choice: außer Kraft setzt
  rationale: ἀθετέω kann im rechtlichen Zusammenhang das Aufheben oder Unwirksammachen einer Regelung bezeichnen. „außer Kraft setzt“ wahrt diese juristische Aussage, ohne bloßes Nichtbeachten daraus zu machen.
- source_word: τι τούτων
  choice: eine davon
  rationale: Der partitive Ausdruck bezeichnet irgendeine einzelne der zuvor genannten Bestimmungen; „eine davon“ ist im Deutschen eindeutig und natürlich.
- source_word: ἔνοχος ἔσται
  choice: macht sich schuldig
  rationale: ἔνοχος bezeichnet Schuld beziehungsweise rechtliche Haftbarkeit. Die deutsche Wendung ist in diesem Dekretkontext verständlich und bewahrt die im Griechischen vorhandene rechtlich-schuldbezogene Bedeutung.
