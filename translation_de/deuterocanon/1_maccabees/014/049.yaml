  text: And copies of them were to be placed in the treasury[a], so that Simon and his sons might have them.
translation:
  language: de
  text: Abschriften davon sollten in der Schatzkammer[a] hinterlegt werden, damit Simon und seine Söhne sie haben sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „im Schatzhaus“ oder „im Verwahrraum“. Das griechische Wort bezeichnet einen Raum zur Aufbewahrung von Schätzen oder Wertgegenständen und kann hier der sicheren Verwahrung von Urkunden dienen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφα
  choice: Abschriften
  rationale: Das Wort bezeichnet dokumentarische Kopien oder Zweitschriften. „Abschriften“ ist im Zusammenhang mit einer amtlichen Urkunde natürlich und hinreichend genau.
- source_word: θέσθαι
  choice: sollten … hinterlegt werden
  rationale: Der Infinitiv gibt den Inhalt der vorausgehenden Anordnung wieder. „Sollten … hinterlegt werden“ bringt sowohl deren Weisungscharakter als auch die dauerhafte Verwahrung idiomatisch zum Ausdruck.
- source_word: γαζοφυλακίῳ
  choice: Schatzkammer
  rationale: Das Wort bezeichnet eine Schatzkammer beziehungsweise einen Raum zur sicheren Verwahrung. „Schatzkammer“ bewahrt den konkreten räumlichen Sinn und passt zum Urkundenarchiv.
- source_word: ὅπως
  choice: damit
  rationale: Die Konjunktion leitet einen Zwecksatz ein; „damit“ gibt diese Funktion knapp und natürlich wieder.
- source_word: ἔχῃ
  choice: sie zur Verfügung hätten
  rationale: Das im Griechischen unausgesprochene Objekt bezieht sich auf die Abschriften. „Zur Verfügung hätten“ verdeutlicht im Deutschen den Zweck ihrer Aufbewahrung, ohne Eigentum oder bloßen körperlichen Besitz festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passive Sollkonstruktion setzt den im Kontext vorausgehenden Beschluss fort. „Hinterlegt“ entspricht dem amtlich-dokumentarischen Zusammenhang; der Zweck wird mit einem natürlichen deutschen Konjunktiv wiedergegeben.
