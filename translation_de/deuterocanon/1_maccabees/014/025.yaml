  text: When the people heard these words[a], they said, “What favor shall we repay to Simon and to his sons?”
translation:
  language: de
  text: 'Als das Volk diese Worte hörte, sagte es: »Welchen Dank können wir Simon und seinen Söhnen erweisen?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie können wir Simon und seinen Söhnen ihre Gunst vergelten?« Das griechische χάρις kann »Gunst«, »Dank« oder »Dankbarkeit« bedeuten; mit ἀποδώσομεν (»zurückgeben«, »erwidern«) ist eine angemessene Erwiderung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Als
  rationale: Leitet den zeitlichen Umstand der folgenden Reaktion natürlich ein; δέ muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: ἤκουσεν
  choice: hörte
  rationale: Der Aorist von ἀκούω bezeichnet hier im Erzählverlauf schlicht das Hören.
- source_word: ὁ δῆμος
  choice: das Volk
  rationale: Bezeichnet die Gemeinschaft als kollektiv handelnde Öffentlichkeit; der Singular wird durch »sagte es« aufgenommen.
- source_word: τῶν λόγων τούτων
  choice: diese Worte
  rationale: Gibt den unmittelbaren Rückbezug auf das zuvor Gesagte formal und idiomatisch wieder.
- source_word: Τίνα χάριν
  choice: wie … unsere Dankbarkeit
  rationale: χάρις kann Gunst, Dank oder Dankbarkeit bezeichnen. In Verbindung mit ἀποδίδωμι ist im Deutschen »Dankbarkeit vergelten« die natürliche reziproke Wendung; das interrogative τίνα wird idiomatisch mit »wie« wiedergegeben.
- source_word: ἀποδώσομεν
  choice: können wir … vergelten
  rationale: Das Futur hat hier deliberative Bedeutung. Deutsch drückt die Frage nach einer angemessenen Gegenleistung natürlich mit »Wie können wir … vergelten?« aus.
- source_word: Σίμωνι
  choice: Simon
  rationale: Übliche deutsche Form des Namens Σίμων.
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: seinen Söhnen
  rationale: Bewahrt die spezifische Bedeutung »Söhne« und gibt die Dativkonstruktion wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive Einzahl »das Volk … sagte es« folgt der griechischen Grammatik, ohne eine formelle Versammlung vorauszusetzen. Die Hauptfassung priorisiert idiomatisches Deutsch, während die Fußnote die lexikalische Spannweite von χάρις und die formal nähere Alternative bewahrt.
