  yaml_path: translation/deuterocanon/1_maccabees/014/016.yaml
  text: And in Rome[a], and even as far as Sparta, they heard that Jonathan had died, and they were deeply grieved.
translation:
  language: de
  text: Auch in Rom[a] und bis nach Sparta hörte man, dass Jonatan gestorben war, und die Menschen dort waren tief betrübt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „hörte“ im Singular, danach aber „sie waren betrübt“ im Plural. Gemeint sind offenbar die Menschen in Rom und bis nach Sparta, zu denen die Nachricht gelangte.
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte man
  rationale: Die überlieferte griechische Verbform steht im Singular, während anschließend ein Verb im Plural folgt. Das unpersönliche deutsche „hörte man“ wahrt den Singular und gibt zugleich den kollektiven Sinn natürlich wieder.
- source_word: ἐν Ῥώμῃ
  choice: in Rom
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe mit ἐν.
- source_word: καὶ ἕως Σπάρτης
  choice: und bis nach Sparta
  rationale: ἕως mit Genitiv bezeichnet die räumliche Ausdehnung der Nachricht. „Bis nach Sparta“ ist im modernen Deutschen natürlich und erhält diesen Gedanken.
- source_word: ἀπέθανεν
  choice: gestorben war
  rationale: Das Plusquamperfekt verdeutlicht, dass Jonatans Tod der Nachricht und der Trauer zeitlich vorausging.
- source_word: ἐλυπήθησαν σφόδρα
  choice: die Menschen dort waren tief betrübt
  rationale: Das ausdrücklich ergänzte Subjekt macht den Wechsel zum griechischen Plural im Deutschen verständlich; „tief betrübt“ bewahrt die Intensität von σφόδρα.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die unpersönliche Form „hörte man“ bewahrt die auffällige Singularform des griechischen Textes, während „die Menschen dort“ den anschließenden Plural transparent macht.
