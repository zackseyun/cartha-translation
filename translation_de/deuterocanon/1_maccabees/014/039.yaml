  text: and he made him one of his Friends[a], and he honored him with great honor.
translation:
  language: de
  text: Und er machte ihn zu einem seiner Freunde[a] und ehrte ihn mit großer Ehre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann persönliche Freunde meinen, bezeichnet hier aber wahrscheinlich einen anerkannten höfischen Rang unter den „Freunden“ des Königs.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησεν
  choice: machte
  rationale: ποιέω bezeichnet mit dieser Ergänzung, dass jemand in eine Stellung oder Gruppe aufgenommen wird. „Machte ihn zu“ folgt dem griechischen Ausdruck und ist im Deutschen natürlich.
- source_word: τῶν φίλων αὐτοῦ
  choice: zu einem seiner Freunde
  rationale: Der Genitiv Plural bezeichnet hier die Zugehörigkeit zu einer Gruppe. Im hellenistischen Hofgebrauch konnte „Freunde“ einen anerkannten Rang im Umfeld des Königs bezeichnen; die Fußnote bewahrt zugleich die mögliche allgemein-persönliche Bedeutung.
- source_word: ἐδόξασεν
  choice: ehrte
  rationale: Im königlich-politischen Zusammenhang bedeutet δοξάζω, jemandem Ehre oder Auszeichnung zu verleihen. „Ehrte“ vermeidet eine unpassende theologische Verengung auf „verherrlichte“.
- source_word: δόξῃ μεγάλῃ
  choice: mit großer Ehre
  rationale: Der instrumentale Dativ bezeichnet Art oder Mittel der Ehrung. „Mit großer Ehre“ gibt die politische und gesellschaftliche Bedeutung von δόξα eng und verständlich wieder.
theological_decisions:
- issue: Ob φίλοι eine persönliche Beziehung oder einen höfischen Rang bezeichnet
  choice: Im Haupttext „Freunde“, ergänzt durch eine erklärende Fußnote zum möglichen Hoftitel
  alternative: „Freunde“ ausschließlich im Sinn persönlicher Freundschaft oder ausdrücklich „königliche Vertraute“
  rationale: Der hellenistische Sprachgebrauch spricht hier wahrscheinlich für einen offiziellen Kreis am Königshof. Da der griechische Ausdruck jedoch auch gewöhnliche Freunde bezeichnen kann und deutsche Großschreibung keinen Titel eindeutig markiert, wahrt die Fußnote beide Möglichkeiten, ohne den Rang überdeutlich in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusste Wiederholung „ehrte … mit großer Ehre“ bewahrt die Wortfigur ἐδόξασεν … δόξῃ und bleibt verständlich.
