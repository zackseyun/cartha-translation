base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/026.yaml
  text: For he and his brothers and his father's house stood firm[a], and they fought the enemies of Israel away from them, and established freedom for him, and recorded it on bronze tablets, and set them on a pillar on Mount Zion.
translation:
  language: de
  text: Denn er selbst, seine Brüder und das Haus seines Vaters hielten stand. Sie wehrten die Feinde Israels von ihnen ab, sicherten ihm[a] die Freiheit, hielten dies auf Bronzetafeln fest und stellten sie auf einer Stele auf dem Berg Zion auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „ihm“ ist wahrscheinlich Israel als Volk gemeint; möglich ist auch ein Bezug auf Simon persönlich. Im Griechischen steht ein männliches Pronomen im Singular.
    reason: Bewahrt die Mehrdeutigkeit des Bezugs von αὐτῷ.
lexical_decisions:
- source_word: ἐστήρισεν
  choice: hielten stand
  rationale: Das Verb kann „fest machen“, „stärken“ oder intransitiv „standhalten“ bedeuten. Mit dem nachgestellten zusammengesetzten Subjekt bezeichnet es hier am natürlichsten die Standhaftigkeit Simons und seiner Familie.
- source_word: ὁ οἶκος τοῦ πατρὸς αὐτοῦ
  choice: das Haus seines Vaters
  rationale: Die semitisch geprägte Wendung bezeichnet die väterliche Großfamilie bzw. Sippe. Die formnahe Wiedergabe bleibt im Deutschen verständlich und würdevoll.
- source_word: ἐπολέμησαν τοὺς ἐχθροὺς Ἰσραὴλ ἀπʼ αὐτῶν
  choice: wehrten die Feinde Israels von ihnen ab
  rationale: „Abwehren“ verbindet den Kampf mit dem durch ἀπό ausgedrückten Fernhalten. Das Pronomen bleibt wie im Griechischen stehen, ohne seinen Bezug unnötig festzulegen.
- source_word: ἔστησαν αὐτῷ ἐλευθερίαν
  choice: sicherten ihm die Freiheit
  rationale: „Die Freiheit sichern“ gibt die politische Wirkung idiomatisch wieder. Das maskuline Singularpronomen αὐτῷ bleibt als „ihm“ erhalten, sodass sein möglicher Bezug auf das personifizierte Israel oder auf Simon nicht im Haupttext entschieden wird.
- source_word: κατέγραψαν ἐν δέλτοις χαλκαῖς
  choice: hielten dies auf Bronzetafeln fest
  rationale: καταγράφω bezeichnet das schriftliche Aufzeichnen; die Bronzetafeln sind ausdrücklich das Beschreibmaterial. „Festhalten“ vermeidet eine schwerfällige Wiederholung und passt zu einem öffentlichen Beschluss.
- source_word: ἔθεντο ἐν στήλῃ
  choice: brachten sie an einer Säule an
  rationale: στήλη kann eine Stele oder Denksäule bezeichnen. Da die Bronzetafeln daran befestigt werden, ist „an einer Säule anbringen“ im Deutschen anschaulich und sachgerecht.
- source_word: ἐν ὄρει Σιών
  choice: auf dem Berg Zion
  rationale: Dies ist die übliche deutsche Wiedergabe der Ortsangabe bei einem benannten Berg.
theological_decisions:
- issue: Bezug von αὐτῷ in ἔστησαν αὐτῷ ἐλευθερίαν
  choice: Das maskuline Singularpronomen wird als „ihm“ bewahrt und kann auf das personifiziert gedachte Israel bzw. Volk weisen.
  alternative: Das Pronomen kann Simon persönlich bezeichnen; sinngemäß ließe sich bei nationalem Bezug auch „ihm, dem Volk Israel“ oder „ihm, Israel“ formulieren.
  rationale: Der unmittelbare Zusammenhang nennt die Feinde Israels und legt daher nationale Freiheit nahe. Die griechische Form bleibt jedoch grammatisch maskulin und singular, weshalb die Übersetzung die mögliche Spannung nicht stillschweigend auflöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Erzählfolge wurde in zwei Sätze gegliedert, um den langen griechischen Satz gut lesbar wiederzugeben. Familien- und Inschriftensprache bleibt quellennah, ohne unnötig altertümlich zu wirken.
