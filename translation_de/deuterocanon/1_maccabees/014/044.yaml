base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/044.yaml
  text: And it is not permitted for anyone of the people or of the priests to set aside any of these things, or to contradict what is said by him, or to convene an assembly in the country without him, or to put on purple and wear a gold clasp.
translation:
  language: de
  text: Und keinem aus dem Volk oder aus der Priesterschaft ist es erlaubt, irgendetwas davon außer Kraft zu setzen, dem zu widersprechen, was er künftig sagen wird, ohne ihn im Land eine Versammlung einzuberufen[a] oder Purpurgewänder anzulegen und eine goldene Spange zu tragen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „ohne ihn im Land eine Partei zu bilden“. Das griechische Wort kann eine Versammlung, einen Zusammenschluss oder auch eine aufrührerische Gruppierung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Purpurkleidung und eine goldene Spange waren Zeichen von Rang oder amtlicher Würde.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔξεστιν
  choice: ist es erlaubt
  rationale: In Verbindung mit „niemandem“ gibt die Formulierung das förmliche Verbot klar und in natürlichem modernem Deutsch wieder.
- source_word: ἀθετῆσαί τι τούτων
  choice: etwas davon außer Kraft zu setzen
  rationale: ἀθετέω bezeichnet hier das Aufheben, Missachten oder Ungültigmachen der zuvor beschlossenen Regelungen; „außer Kraft setzen“ passt zum rechtlich-politischen Zusammenhang.
- source_word: ἀντειπεῖν τοῖς ὑπʼ αὐτοῦ ῥηθησομένοις
  choice: den Anordnungen zu widersprechen, die er erlassen wird
  rationale: Das zukünftige Passivpartizip wird zeitlich bewahrt. „Anordnungen“ erschließt den sachlichen Bezug der von ihm künftig gesprochenen Worte, ohne darüber hinaus einen theologischen Anspruch einzutragen.
- source_word: ἐπιστρέψαι συστροφὴν
  choice: eine Versammlung einzuberufen
  rationale: Die schwierige Wendung bezeichnet das Organisieren beziehungsweise Zusammenbringen einer Gruppe. Die neutrale Wiedergabe wahrt den politischen Kontext; die mögliche negative Bedeutung wird in der Fußnote erhalten.
- source_word: ἐν τῇ χώρᾳ
  choice: im Land
  rationale: χώρα bezeichnet hier das beherrschte Gebiet; „Land“ ist im Deutschen natürlich und historisch passend.
- source_word: περιβαλέσθαι πορφύραν
  choice: Purpur anzulegen
  rationale: Die knappe Form bewahrt Purpur als Statussymbol und entspricht dem reflexiven Verb des Bekleidens.
- source_word: ἐνπορποῦσθαι πόρπην χρυσῆν
  choice: eine goldene Spange zu tragen
  rationale: Verb und Substantiv bezeichnen das Anlegen beziehungsweise Tragen einer goldenen Gewandspange; „Spange“ ist verständlich und lässt die genaue Schmuckform offen.
theological_decisions:
- issue: Charakter des Verbots im öffentlichen Beschluss
  choice: Als rechtlich-politische Einschränkung zugunsten von Simons ausschließlicher Amtsgewalt wiedergegeben.
  alternative: Die Wendung mit συστροφή ausdrücklich als Verbot einer aufrührerischen Partei oder Verschwörung wiederzugeben.
  rationale: Der Zusammenhang handelt von einem öffentlichen Beschluss über Simons Stellung. Der griechische Wortlaut rechtfertigt hier keine zusätzliche moralische oder theologische Wertung; die mögliche negative Nuance von συστροφή bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem Ton eines förmlichen öffentlichen Beschlusses. Die Reihung der Verbote folgt eng dem Griechischen; die unklare Wendung mit συστροφή wird im Haupttext neutral und in der Fußnote mit ihrer möglichen negativen Nuance wiedergegeben.
