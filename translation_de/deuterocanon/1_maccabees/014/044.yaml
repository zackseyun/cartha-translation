  to: Und keinem aus dem Volk oder aus der Priesterschaft ist es erlaubt, irgendetwas davon außer Kraft zu setzen, dem zu widersprechen, was er künftig sagen wird, ohne ihn im Land eine Versammlung einzuberufen[a] oder Purpurgewänder anzulegen und eine goldene Spange zu tragen[b].
