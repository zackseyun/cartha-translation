  text: And their enemies planned to invade their land[a], to destroy their land and to stretch out their hands against their holy places.
translation:
  language: de
  text: Und ihre Feinde fassten den Plan, in ihr Land einzudringen, ihr Land zu vernichten und ihre Hände gegen ihre Heiligtümer[a] auszustrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Heiligtum“ oder „ihre heiligen Dinge“; im Griechischen steht der Plural τὰ ἅγια.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλήθησαν
  choice: fassten den Plan
  rationale: Gibt die bewusste feindliche Planung bzw. Absicht natürlich und würdig wieder, ohne einen förmlichen Beschluss vorauszusetzen.
- source_word: ἐμβατεῦσαι
  choice: einzudringen
  rationale: Im militärisch-feindlichen Zusammenhang bezeichnet das Verb nicht bloßes Betreten, sondern ein Eindringen in fremdes Land.
- source_word: χώραν
  choice: Land
  rationale: Die Wiederholung des griechischen Wortes wird in beiden Satzteilen bewahrt; „Land“ ist im Deutschen natürlich und semantisch weit genug.
- source_word: τοῦ ἐκτρῖψαι
  choice: zu vernichten
  rationale: Der artikulierte Infinitiv bezeichnet hier den Zweck. „Vernichten“ gibt die starke Bedeutung von ἐκτρίβω in einem gehobenen, aber allgemein verständlichen Register wieder.
- source_word: ἐκτεῖναι τὰς χεῖρας ἐπὶ
  choice: ihre Hände gegen … auszustrecken
  rationale: Die körperliche Bildsprache des griechischen Ausdrucks bleibt erhalten; „gegen“ macht seine feindliche Richtung deutlich, ohne die Art des Angriffs näher festzulegen.
- source_word: τὰ ἅγια
  choice: ihre Heiligtümer
  rationale: „Heiligtümer“ bewahrt den griechischen Plural und passt zum kultischen Zusammenhang, ohne den Ausdruck vorschnell auf ein einziges Heiligtum oder ausschließlich auf heilige Gegenstände einzuengen.
theological_decisions:
- issue: Deutung von τὰ ἅγια im kultischen Zusammenhang
  choice: ihre Heiligtümer
  alternative: ihr Heiligtum; ihre heiligen Dinge
  rationale: Der griechische Neutrum-Plural kann heilige Stätten, den Heiligtumsbereich oder heilige Dinge bezeichnen. Der Haupttext wahrt mit „Heiligtümer“ den Plural; die Fußnote dokumentiert die echte Bedeutungsbreite.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem historischem Ton. Die griechische Wiederholung von „ihr Land“ und die bildhafte Wendung „die Hände … ausstrecken“ wurden bewusst beibehalten.
