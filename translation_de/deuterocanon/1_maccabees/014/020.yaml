base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/020.yaml
  text: And this is the copy of the letter that the Spartans sent—the rulers of the Spartans and the city—to Simon the high priest[a], and to the elders and the priests and the rest of the people of the Jews, their brothers[b], greetings.
translation:
  language: de
  text: 'Und dies ist die Abschrift der Schreiben, die die Spartaner – die Herrscher der Spartaner und die Stadt – an Simon, den Hohepriester, an die Ältesten, die Priester und das übrige Volk der Juden, ihre Brüder, sandten: Grüße.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: Abschrift
  rationale: Bezeichnet die schriftliche Wiedergabe eines Dokuments und passt zum amtlichen Briefkontext.
- source_word: ἐπιστολῶν
  choice: Schreiben
  rationale: Der griechische Plural wird bewahrt; „Schreiben“ ist im Deutschen zugleich idiomatisch und für amtliche Korrespondenz angemessen.
- source_word: οἱ Σπαρτιᾶται Σπαρτιατῶν ἄρχοντες καὶ ἡ πόλις
  choice: 'die Spartaner sandten: »Die Herrscher der Spartaner und die Stadt …«'
  rationale: Die gedrängte, appositionelle Formulierung des Griechischen wird so verständlich wiedergegeben, ohne die offiziellen Absender mit den Spartanern allgemein gleichzusetzen.
- source_word: ἱερεῖ μεγάλῳ
  choice: Hohepriester
  rationale: Dies ist die etablierte deutsche Bezeichnung des jüdischen Amtes.
- source_word: πρεσβυτέροις
  choice: Ältesten
  rationale: Gemeint sind anerkannte Leitungs- oder Amtsträger, nicht lediglich ältere Menschen.
- source_word: τῷ λοιπῷ δήμῳ τῶν Ἰουδαίων
  choice: dem übrigen Volk der Juden
  rationale: Bewahrt sowohl λοιπῷ als auch die genitivische Konstruktion und bleibt im Deutschen verständlich.
- source_word: ἀδελφοῖς
  choice: ihre Brüder
  rationale: Die Bezeichnung drückt die in der diplomatischen Korrespondenz behauptete brüderliche Verbundenheit zwischen Spartanern und Juden aus.
- source_word: χαίρειν
  choice: grüßen
  rationale: Der übliche briefliche Gruß wird in eine natürliche deutsche Grußformel eingebettet.
theological_decisions:
- issue: Amtstitel ἱερεῖ μεγάλῳ
  choice: Hohepriester
  alternative: großer Priester
  rationale: „Hohepriester“ bezeichnet das jüdische Amt präzise und idiomatisch; „großer Priester“ wäre im modernen Deutschen missverständlich.
- issue: Beziehungsbezeichnung ἀδελφοῖς
  choice: ihre Brüder
  alternative: Brüder
  rationale: Das Possessivpronomen verdeutlicht die diplomatische Verwandtschaftsbehauptung, ohne sie theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der griechische Plural „Schreiben“ bleibt erhalten. Die eigentliche Grußformel wird durch Anführungszeichen als Inhalt der überlieferten Korrespondenz kenntlich gemacht; die diplomatische und amtliche Sprache bleibt knapp.
