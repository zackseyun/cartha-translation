  text: καὶ τοῦτο τὸ ἀντίγραφον τῶν ἐπιστολῶν ὧν ἀπέστειλαν οἱ Σπαρτιᾶται Σπαρτιατῶν ἄρχοντες καὶ ἡ πόλις Σίμωνι ἱερεῖ μεγάλῳ καὶ τοῖς πρεσβυτέροις καὶ τοῖς ἱερεῦσι καὶ τῷ λοιπῷ δήμῳ τῶν Ἰουδαίων ἀδελφοῖς χαίρειν.
