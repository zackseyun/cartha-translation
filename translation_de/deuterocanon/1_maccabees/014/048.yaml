  text: And they said that this document should be put on bronze tablets and set up in the court of the sanctuary, in a secure place.
translation:
  language: de
  text: Und sie beschlossen, diese Urkunde auf Bronzetafeln anzubringen und sie im Vorhof des Heiligtums an einem sicheren Ort aufzustellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν θέσθαι
  choice: sie beschlossen, … anzubringen
  rationale: Wörtlich »sie sagten, … anzubringen«; im Zusammenhang gibt die Wendung einen förmlichen Beschluss wieder. »Anzubringen« bewahrt, anders als »einzugravieren«, die Offenheit darüber, wie die Urkunde auf den Tafeln befestigt oder ausgeführt wurde.
- source_word: τὴν γραφὴν ταύτην
  choice: diese Urkunde
  rationale: γραφή bezeichnet hier das zuvor wiedergegebene offizielle Schriftstück; »Urkunde« ist im Deutschen natürlich und dem amtlichen Kontext angemessen.
- source_word: ἐν δέλτοις χαλκαῖς
  choice: auf Bronzetafeln
  rationale: δέλτοι sind Schreib- bzw. Inschrifttafeln; χαλκαῖς bezeichnet Tafeln aus Bronze beziehungsweise Kupfer. »Bronzetafeln« entspricht dem historischen und deutschen Sprachgebrauch.
- source_word: ἐν περιβόλῳ τῶν ἁγίων
  choice: im Vorhof des Heiligtums
  rationale: περίβολος bezeichnet den umfriedeten Bezirk oder Hof; τὰ ἅγια meint hier den heiligen Tempelbereich. Die Formulierung gibt den räumlichen Sinn natürlich wieder.
- source_word: ἐν τόπῳ πιστῷ
  choice: an einem sicheren Ort
  rationale: πιστός bedeutet hier im räumlich-praktischen Zusammenhang »zuverlässig, sicher«, also einen Ort, an dem die Tafeln geschützt und dauerhaft verwahrt beziehungsweise sichtbar waren.
