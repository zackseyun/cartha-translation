base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/032.yaml
  text: Then Simon rose up and fought for his nation[a], and spent much of his own money, and armed the men of his nation's forces[b], and gave them wages.
translation:
  language: de
  text: Da erhob sich[b] Simon und kämpfte für sein Volk[a]. Er gab viel eigenes Geld aus, bewaffnete die Männer der Streitmacht seines Volkes und zahlte ihnen Sold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ἔθνος kann hier auch mit „Nation“ wiedergegeben werden; gemeint ist das jüdische Volk als politisches Gemeinwesen.
    reason: lexical_alternative
  - marker: b
    text: Die gedruckte griechische Form ἀνέστησενσεν enthält offenbar eine versehentliche Wiederholung der Endung. Gemeint ist dem Zusammenhang nach, dass Simon sich erhob beziehungsweise auftrat.
    reason: textual_variant
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Gibt den zeitlichen und erzählerischen Fortgang im modernen Deutschen knapp und natürlich wieder.
- source_word: ἀνέστησενσεν
  choice: erhob sich
  rationale: Der überlieferte Drucktext ist offenbar fehlerhaft; aus Zusammenhang und Satzbau ergibt sich der Sinn, dass Simon aufstand beziehungsweise handelnd hervortrat. „Erhob sich“ bewahrt das Bewegungsbild, ohne es zur bloßen Initiative umzudeuten.
- source_word: ἐπολέμησεν περὶ τοῦ ἔθνους αὐτοῦ
  choice: kämpfte für sein Volk
  rationale: περί bezeichnet hier den Einsatz zugunsten beziehungsweise zur Verteidigung des eigenen Gemeinwesens. „Volk“ bezeichnet im Deutschen natürlich den jüdischen Volksverband und vermeidet moderne nationalstaatliche Nebenbedeutungen.
- source_word: ἐδαπάνησεν χρήματα πολλὰ τῶν ἑαυτοῦ
  choice: gab viel eigenes Geld aus
  rationale: Eine direkte, gegenwärtige Wiedergabe von ἐδαπάνησεν und χρήματα, wobei τῶν ἑαυτοῦ durch „eigenes“ erhalten bleibt.
- source_word: ὡπλοδότησεν
  choice: bewaffnete
  rationale: Das Verb bedeutet, jemanden mit Waffen auszurüsten; „bewaffnete“ ist präzise und knapp.
- source_word: τοὺς ἄνδρας τῆς δυνάμεως τοῦ ἔθνους αὐτοῦ
  choice: die Männer der Streitmacht seines Volkes
  rationale: „Männer“ bewahrt das ausdrücklich männliche ἄνδρας; „Streitmacht“ gibt die militärische Bedeutung von δύναμις wieder, ohne vorschnell eine bestimmte Heeresorganisation anzunehmen.
- source_word: ὀψώνια
  choice: Sold
  rationale: Im militärischen Zusammenhang bezeichnet ὀψώνια die Versorgung beziehungsweise Bezahlung von Soldaten. „Sold“ ist im Deutschen die genaueste und idiomatischste Wiedergabe.
theological_decisions:
- issue: Wiedergabe von ἔθνος im jüdischen politisch-kollektiven Zusammenhang
  choice: Volk
  alternative: Nation
  rationale: „Volk“ bewahrt die kollektive und politische Dimension, klingt im heutigen Deutschen hier jedoch natürlicher als „Nation“ und legt keinen modernen Nationalstaat nahe. Die mögliche Wiedergabe „Nation“ wird in der Fußnote offengehalten.
- issue: Geschlechtsspezifische Bezeichnung τοὺς ἄνδρας
  choice: die Männer
  alternative: die Soldaten
  rationale: Der griechische Text bezeichnet ausdrücklich Männer. Diese Angabe wird nicht durch eine geschlechtsneutrale Funktionsbezeichnung ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Terminologie. Der Satz wurde nach dem ersten Teilsatz geteilt, um die längere Reihung natürlich lesbar zu machen. „Sold“ ist präziser als das allgemeinere „Lohn“, während „Streitmacht“ die Breite von δύναμις wahrt.
