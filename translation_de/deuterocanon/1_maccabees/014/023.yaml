  text: And it pleased the people to receive the men with honor[a], and to place a copy of their words in the public records of the people, so that the people of the Spartans might have a memorial of them[b]; and they wrote a copy of these things to Simon the high priest.
translation:
  language: de
  text: Und das Volk beschloss, die Männer ehrenvoll zu empfangen und eine Abschrift ihrer Worte in den für das Volk bestimmten Büchern[a] niederzulegen, damit das Volk der Spartaner eine Erinnerung daran habe. Eine Abschrift davon aber schrieben sie an Simon, den Hohepriester.
