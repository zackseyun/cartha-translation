translation_notes:
  register: Modernes, würdiges Standarddeutsch mit förmlichem staatsbürgerlichem Ton. Der erste griechische Satz wird zur besseren Lesbarkeit syntaktisch gestrafft, ohne seine Beschlussform oder den archivalischen Zweck aufzugeben. Die leicht altertümlich-feierliche Wortstellung im letzten Satz spiegelt den dokumentarischen Stil, bleibt aber verständlich.
