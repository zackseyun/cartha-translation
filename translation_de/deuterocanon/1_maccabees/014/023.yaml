  source_fidelity: Die Übersetzung gibt den Beschluss der Bürgerschaft, den ehrenvollen Empfang, die Hinterlegung einer Abschrift in amtlichen Büchern und den Zweck des Erinnerns insgesamt zuverlässig wieder. „Das Volk beschloss“ ist für ἤρεσεν τῷ δήμῳ als idiomatische Wiedergabe eines öffentlichen Zustimmungsbeschlusses vertretbar. Der Akkusativ mit Infinitiv bei τοῦ μνημόσυνον ἔχειν wird zutreffend als „damit das Volk der Spartaner … habe“ verstanden.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. Die Verbindung „schrieben sie dem Hohepriester Simon“ ist jedoch im Deutschen weniger idiomatisch als eine Empfängerangabe mit „an“ und die appositionelle Stellung des Titels nach dem Namen.
  terminology: „Abschrift“, „Bücher“, „Volk der Spartaner“ und „Hohepriester“ sind terminologisch angemessen. Die Anmerkung sollte nicht mit „städtisch“ enger festlegen, was der griechische Text allgemeiner als für den δήμος bestimmte bzw. öffentliche amtliche Bücher bezeichnet.
