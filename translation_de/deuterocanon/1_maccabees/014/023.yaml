lexical_decisions:
- source_word: ἤρεσεν τῷ δήμῳ
  choice: das Volk beschloss
  rationale: Die unpersönliche Wendung bedeutet wörtlich „es gefiel dem Volk“ beziehungsweise „es schien dem Volk gut“. Im Zusammenhang bezeichnet sie einen förmlichen Beschluss der Bürgerschaft; „beschloss“ gibt diesen öffentlichen Entscheidungscharakter in natürlichem Deutsch wieder.
- source_word: ἐπιδέξασθαι τοὺς ἄνδρας ἐνδόξως
  choice: die Männer ehrenvoll zu empfangen
  rationale: „Männer“ bewahrt die ausdrückliche Bezeichnung ἄνδρας, ohne sie deutend als Gesandte zu benennen. ἐνδόξως bezeichnet einen Empfang mit öffentlicher Ehre und Würde.
- source_word: τὸ ἀντίγραφον τῶν λόγων αὐτῶν
  choice: eine Abschrift ihrer Worte
  rationale: ἀντίγραφον ist eine Abschrift oder Kopie; λόγοι bleibt mit „Worte“ bewusst weiter als die stärker deutenden Möglichkeiten „Botschaft“ oder „Erklärung“.
- source_word: ἐν τοῖς ἀποδεδειγμένοις τῷ δήμῳ βιβλίοις
  choice: in den für das Volk bestimmten Büchern
  rationale: Die Übersetzung folgt der griechischen Formulierung relativ eng. Gemeint sind offiziell bestimmte öffentliche Bücher beziehungsweise Register; die Fußnote erläutert diese institutionelle Funktion.
- source_word: τοῦ μνημόσυνον ἔχειν
  choice: damit … eine Erinnerung daran habe
  rationale: Der substantivierte Infinitiv bezeichnet den Zweck. μνημόσυνον kann ein Erinnerungszeichen, ein Andenken oder eine bleibende Erinnerung meinen; „Erinnerung“ wahrt den kommemorativen Sinn, ohne bloß einen Aktenvermerk daraus zu machen.
- source_word: τὸν δῆμον τῶν Σπαρτιατῶν
  choice: das Volk der Spartaner
  rationale: Die Formulierung bewahrt sowohl δῆμος („Volk“, besonders als politische Bürgerschaft) als auch den Genitiv „der Spartaner“ und damit den förmlichen staatsbürgerlichen Ton.
- source_word: τὸ δὲ ἀντίγραφον τούτων ἔγραψαν Σίμωνι τῷ ἀρχιερεῖ
  choice: Eine Abschrift davon aber schrieben sie dem Hohepriester Simon
  rationale: Die Wiedergabe hält sich an das Verb „schreiben“ und behandelt den Dativ als Empfängerangabe. Sie vermeidet das inhaltlich naheliegende, aber im Verb nicht ausdrücklich enthaltene „senden“.
