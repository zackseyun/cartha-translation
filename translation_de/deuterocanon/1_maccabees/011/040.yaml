base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/040.yaml
  text: And he stayed close to him[a], so that he might hand him over to him, so that he might reign in place of his father. And they reported to him all that Demetrius had done, and the hostility with which his forces were hostile to him; and he remained there many days.
translation:
  language: de
  text: Und er blieb eng bei ihm, damit dieser ihn ihm ausliefere, damit er anstelle seines Vaters König werde. Und man berichtete ihm alles, was Demetrius getan hatte, sowie von der Feindschaft, die seine Streitkräfte ihm entgegenbrachten; und er blieb viele Tage dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήδρευσεν αὐτῷ
  choice: er hielt sich eng an ihn
  rationale: Das Verb bezeichnet ein nahes Verweilen beziehungsweise ein enges Anschließen. Die Wiedergabe wahrt die körperlich-soziale Nähe, ohne als Motiv ausdrücklich Schmeichelei oder Gunstwerbung einzutragen.
- source_word: παραδοῖ αὐτὸν αὐτῷ
  choice: damit dieser ihn ihm ausliefere
  rationale: „Ausliefern“ gibt den politischen Sinn von παραδίδωμι prägnant wieder. „Dieser“ verdeutlicht im Deutschen lediglich das Subjekt des griechischen Verbs, während die mehrdeutigen männlichen Pronomen nicht durch Eigennamen aufgelöst werden.
- source_word: βασιλεύσῃ ἀντὶ τοῦ πατρὸς αὐτοῦ
  choice: und er anstelle seines Vaters König werde
  rationale: Die Formulierung bewahrt ἀντί als Stellvertretung beziehungsweise Nachfolge und gibt βασιλεύω in natürlichem Deutsch wieder.
- source_word: ἀπήγγειλαν αὐτῷ
  choice: man berichtete ihm
  rationale: Der griechische Plural hat kein ausdrücklich genanntes Subjekt. Das unpersönliche „man“ ist im modernen Deutschen natürlicher als ein isoliertes „sie“ und vermeidet eine unbelegte Identifizierung.
- source_word: ὅσα συνετέλεσεν Δημήτριος
  choice: alles, was Demetrius getan hatte
  rationale: Die breite Formulierung umfasst sämtliche gemeinten Handlungen, ohne Erfolg, Vollendung oder Wertung zusätzlich zu behaupten.
- source_word: τὴν ἔχθραν ἣν ἐχθραίνονσιν αὐτῷ αἱ δυνάμεις αὐτοῦ
  choice: von der Feindschaft, mit der seine eigenen Streitkräfte ihm begegneten
  rationale: „Feindschaft“ wahrt die aktive politische und militärische Gegnerschaft. „Begegneten“ vermeidet im Deutschen eine unnatürliche Wiederholung, während „seine eigenen“ den wichtigen Gegensatz festhält, dass die Streitkräfte des Demetrius gegen ihn standen.
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: seine eigenen Streitkräfte
  rationale: Im militärischen Erzählzusammenhang bezeichnet δυνάμεις bewaffnete Kräfte. „Eigene“ macht den im Possessivpronomen liegenden Gegensatz idiomatisch deutlich.
- source_word: ἔμεινεν ἐκεῖ ἡμέρας πολλάς
  choice: er blieb viele Tage dort
  rationale: Eine nahe, klare Wiedergabe der abschließenden Zeitangabe.
