  naturalness: „Blieb eng bei ihm“ ist für προσήδρευσεν natürlicher und weniger motivdeutend als „hielt sich eng an ihn“. Die Formulierung „alles ..., und von der Feindschaft“ wird mit „sowie von“ syntaktisch glatt und idiomatisch.
  terminology: „Ausliefern“, „König werden“, „Demetrius“ und „Streitkräfte“ sind angemessen. „Seine eigenen“ ist nicht nötig, da das Possessivpronomen im Deutschen den Bezug bereits hinreichend ausdrückt.
