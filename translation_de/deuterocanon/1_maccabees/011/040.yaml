translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte Pronomenfolge des Griechischen bleibt in ihrer referenziellen Offenheit erhalten, wird aber durch „dieser“ grammatisch lesbar gemacht. Die auffällige figura etymologica von ἔχθραν/ἐχθραίνονσιν wird zugunsten natürlichen Deutschen leicht geglättet; ihr Sinn aktiver Feindschaft bleibt erhalten.
