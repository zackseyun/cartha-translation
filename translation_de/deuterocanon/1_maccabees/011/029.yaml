  yaml_path: translation/deuterocanon/1_maccabees/011/029.yaml
  text: 'And the king approved[a], and wrote letters to Jonathan concerning all these things, having this form:'
translation:
  language: de
  text: Der König stimmte zu und schrieb Jonatan über all diese Angelegenheiten Briefe in folgender Form:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die diese Form hatten“.'
    reason: Die Fußnote dokumentiert die konkrete griechische Konstruktion hinter der idiomatischen Wiedergabe „in folgender Form“.
lexical_decisions:
- source_word: εὐδόκησεν
  choice: stimmte zu
  rationale: Das Verb bezeichnet hier die günstige Annahme der zuvor vorgebrachten Bitte. „Stimmte zu“ gibt den administrativen Zusammenhang natürlich wieder, ohne eine bloß emotionale Freude auszudrücken.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Direkte Wiedergabe des Aorists; mit dem ausdrücklichen Objekt „Briefe“ ist „schrieb“ im Deutschen idiomatisch.
- source_word: ἐπιστολάς
  choice: Briefe
  rationale: Der griechische Plural wird bewahrt. „Briefe“ ist für amtliche schriftliche Mitteilungen klar und angemessen.
- source_word: περὶ πάντων τούτων
  choice: über all diese Angelegenheiten
  rationale: Die Wendung verweist auf die zuvor behandelten Bitten und Regelungen. „Angelegenheiten“ ist im amtlichen Kontext natürlicher als das wörtlichere „Dinge“.
- source_word: ἔχουσας τὸν τρόπον τοῦτον
  choice: in folgender Form
  rationale: Die idiomatische Formulierung kündigt den unmittelbar folgenden Wortlaut an und bewahrt zugleich den Gedanken der griechischen Wendung „diese Form habend“.
theological_decisions: []
