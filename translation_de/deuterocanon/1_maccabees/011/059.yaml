  yaml_path: translation/deuterocanon/1_maccabees/011/059.yaml
  text: And he appointed Simon his brother as commander from the Ladder of Tyre as far as the borders of Egypt[a][b].
translation:
  language: de
  text: Und er ernannte seinen Bruder Simon zum Befehlshaber[a] von der Leiter von Tyrus[b] bis zu den Grenzen Ägyptens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heerführer“ beziehungsweise „Feldherr“. Das griechische Wort bezeichnet einen militärischen Führer, ohne hier zwingend einen genau bestimmten Rang zu benennen.'
    reason: lexical_alternative
  - marker: b
    text: Die „Leiter von Tyrus“ ist ein Ortsname. Gemeint ist wahrscheinlich ein Küstenpass oder Steilhang bei Tyrus, nicht eine Leiter im wörtlichen Sinn.
    reason: cultural_note
lexical_decisions:
- source_word: κατέστησεν
  choice: setzte … ein
  rationale: Das Verb bezeichnet hier die Einsetzung in ein Amt. „setzte … ein“ ist im modernen Deutschen natürlich und bewahrt den offiziellen Sinn.
- source_word: στρατηγὸν
  choice: Befehlshaber
  rationale: Der Ausdruck bezeichnet einen militärischen Führer. „Befehlshaber“ gibt die Funktion klar wieder, ohne einen bestimmten späteren militärischen Rang vorauszusetzen.
- source_word: ἀπὸ τῆς κλίμακος Τύρου
  choice: von der Leiter von Tyrus
  rationale: κλίμαξ bedeutet wörtlich „Leiter“ oder „Treppe“, dient hier jedoch als Ortsname. Die Wiedergabe erhält den überlieferten Toponym.
- source_word: ἕως τῶν ὁρίων Αἰγύπτου
  choice: bis an die Grenze Ägyptens
  rationale: ὅρια kann Grenzen oder Grenzgebiete bezeichnen. Der Singular „Grenze“ ist im Deutschen für die territoriale Ausdehnung idiomatisch, ohne die Aussage unnötig zu präzisieren.
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder Simon
  rationale: Die deutsche Wortstellung identifiziert Simon flüssig und eindeutig als Bruder des handelnden Mannes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „über das Gebiet“ macht deutlich, dass die folgende Ortsangabe den Zuständigkeitsbereich des Befehlshabers bezeichnet; dies ist im Griechischen knapp durch die Verbindung von Amt und räumlicher Ausdehnung ausgedrückt.
