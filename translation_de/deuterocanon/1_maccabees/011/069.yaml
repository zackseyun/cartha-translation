  source_fidelity: 'Die Übersetzung gibt den griechischen Satzbau und die wesentlichen Aussagen zuverlässig wieder: τὰ ἔνεδρα wird sachgerecht als die im Hinterhalt befindlichen Kämpfer verstanden; ἐξανέστησαν, ἐκ τῶν τόπων ἑαυτῶν, συνῆψαν πόλεμον und πάντες sind vollständig abgedeckt. Das einleitende »Doch« ist für δέ angemessen. Das deutsche »da« verbindet die anschließende Flucht idiomatisch, ohne eine über das Griechische hinausgehende Kausalität festzulegen.'
  naturalness: Modernes Standarddeutsch, knapp und gut lesbar. »Truppen im Hinterhalt« und »nahmen den Kampf auf« sind in diesem erzählenden militärischen Kontext natürlich und würdevoll. Das Semikolon gliedert die rasch aufeinanderfolgenden Ereignisse sinnvoll.
  terminology: »Jonatan« entspricht der im Deutschen üblichen biblischen Namensform. »Truppen im Hinterhalt« ist gegenüber dem wörtlichen, im Deutschen unnatürlichen »Hinterhalte« eine sichere metonymische Entfaltung. Die Fußnote dokumentiert diese Entscheidung transparent und korrekt.
