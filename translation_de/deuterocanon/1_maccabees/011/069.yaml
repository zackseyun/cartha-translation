  yaml_path: translation/deuterocanon/1_maccabees/011/069.yaml
  text: But the ambushes rose up from their places and joined battle[a], and all those with Jonathan fled.
translation:
  language: de
  text: Doch die Truppen im Hinterhalt[a] erhoben sich von ihren Plätzen und nahmen den Kampf auf; da flohen alle, die bei Jonatan waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Hinterhalte«; gemeint sind die dort verborgenen Kämpfer.'
    reason: Die griechische Sachbezeichnung wird hier metonymisch für die handelnden Personen gebraucht.
lexical_decisions:
- source_word: τὰ ἔνεδρα
  choice: die Truppen im Hinterhalt
  rationale: Das sächliche Pluralwort bezeichnet wörtlich die »Hinterhalte«, meint hier wegen des persönlichen Handelns aber metonymisch die dort verborgenen Kämpfer. Die Wiedergabe ist im Deutschen natürlich und macht den Bezug deutlich, ohne eine bestimmte Truppengattung einzuführen.
- source_word: ἐξανέστησαν
  choice: erhoben sich
  rationale: Die Form beschreibt, wie die verborgenen Kämpfer aus ihrer bisherigen Lage heraus aufstehen beziehungsweise hervortreten. »Erhoben sich« bleibt nahe am griechischen Ausdruck und passt zur anschließenden Ortsangabe.
- source_word: ἐκ τῶν τόπων ἑαυτῶν
  choice: von ihren Plätzen
  rationale: Die schlichte Wiedergabe bewahrt sowohl die räumliche Bedeutung als auch den möglichen militärischen Sinn von »Stellungen«, ohne diesen stärker auszudeuten.
- source_word: συνῆψαν πόλεμον
  choice: nahmen den Kampf auf
  rationale: Diese geläufige deutsche Wendung gibt das griechische Idiom für das Beginnen beziehungsweise Eingehen eines Kampfes prägnant wieder.
- source_word: οἱ παρὰ Ἰωνάθαν πάντες
  choice: alle, die bei Jonatan waren
  rationale: Die Formulierung gibt die Zugehörigkeit beziehungsweise Begleitung wieder, ohne durch »Jonatans Männer« ein stärkeres Besitz- oder Befehlsverhältnis einzutragen; πάντες bleibt ausdrücklich als »alle« erhalten.
