  to: Als er sich Aschdod näherte, zeigten sie ihm den niedergebrannten Tempel Dagons, das zerstörte Aschdod und die zerstörten Ortschaften in seinem Umland[a], die umhergeworfenen Leichen und die Verbrannten, die er im Krieg verbrannt hatte; denn sie hatten entlang seines Weges Haufen aus ihnen aufgeschichtet[b].
