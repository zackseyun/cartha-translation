base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/004.yaml
  text: But when he came near Ashdod[a], they showed him the temple of Dagon burned down, and Ashdod and its surrounding villages torn down, and the bodies thrown about[b], and those burned in the war—for they had made heaps of them along his route.
translation:
  language: de
  text: Als er sich Aschdod näherte, zeigten sie ihm den niedergebrannten Tempel Dagons, das zerstörte Aschdod und die zerstörten Ortschaften in seinem Umland[a], die umhergeworfenen Leichen und die Verbrannten, die er im Krieg verbrannt hatte; denn sie hatten entlang seines Weges Haufen aus ihnen aufgeschichtet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Vororte“ beziehungsweise „die Außenbezirke“ (τὰ περιπόλια αὐτῆς).'
    reason: lexical_alternative
  - marker: b
    text: Das seltene Wort βωμίας ist in seiner genauen Bedeutung unsicher; möglich sind „Haufen“, „Hügel“ oder vielleicht „Scheiterhaufen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: sich näherte
  rationale: Gibt die Bewegung auf die Stadt zu in natürlichem, modernem Deutsch wieder.
- source_word: Ἄζωτον
  choice: Aschdod
  rationale: Verwendet die im Deutschen übliche biblische Form des bekannten Ortsnamens statt der griechisch-lateinischen Form Azotus.
- source_word: ἱερὸν Δαγὼν
  choice: Tempel Dagons
  rationale: ἱερόν bezeichnet hier klar das Heiligtum einer Gottheit; „Tempel“ ist die verständlichste Wiedergabe.
- source_word: ἐνεπυρισμένον
  choice: niedergebrannten
  rationale: Bezeichnet den durch Feuer herbeigeführten, sichtbar zerstörten Zustand des Tempels.
- source_word: τὰ περιπόλια αὐτῆς
  choice: die Ortschaften im Umland
  rationale: Erfasst die zur Stadt gehörenden umliegenden Siedlungen oder Außenbezirke, ohne das moderne Stadtbild von „Vororten“ vorauszusetzen.
- source_word: καθῃρημένα
  choice: zerstörten
  rationale: Gibt den Zustand des Niedergerissenseins klar wieder und lässt offen, welche Art von Bebauung betroffen war.
- source_word: τὰ σώματα ἐρριμμένα
  choice: die umhergeworfenen Leichen
  rationale: Im Zusammenhang sind mit σώματα tote Körper gemeint; „umhergeworfen“ bewahrt die gewaltsame und ungeordnete Bildsprache.
- source_word: τοὺς ἐμπεπυρισμένους
  choice: die Verbrannten
  rationale: Bewahrt die substantivische Personenbezeichnung und den resultativen Sinn des Perfektpartizips.
- source_word: οὓς ἐνεπύρισε ἐν τῷ πολέμῳ
  choice: die er im Krieg hatte verbrennen lassen
  rationale: Bewahrt den ausdrücklich genannten handelnden Bezug von ἐνεπύρισε und gibt den zeitlich vorausliegenden Vorgang idiomatisch wieder; der kausative deutsche Ausdruck passt dazu, dass der Betreffende als militärischer Befehlshaber handelte.
- source_word: βωμίας
  choice: Haufen
  rationale: Der seltene und in seiner Nuance unsichere Ausdruck bezeichnet im Kontext wahrscheinlich Aufschichtungen; „Haufen“ vermeidet die nicht gesicherte Festlegung auf Scheiterhaufen.
- source_word: ἐν τῇ ὁδῷ αὐτοῦ
  choice: entlang seines Weges
  rationale: Bezeichnet den Weg beziehungsweise die Route, auf der er an den Überresten vorbeikam.
