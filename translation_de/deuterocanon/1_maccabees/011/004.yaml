  source_fidelity: 'Der Entwurf gibt den Satz im Wesentlichen angemessen wieder, verfehlt jedoch bei καθῃρημένα die gemeinsame Prädikation für Aschdod und sein Umland: In der vorliegenden deutschen Wortstellung ist nur von den Ortschaften ausdrücklich gesagt, dass sie zerstört sind. Außerdem ist „hatte verbrennen lassen“ gegenüber dem aktiven ἐνεπύρισε unnötig kausativ. Die Schlusswendung bleibt wegen βωμίας und der nicht ausdrücklich aufgelösten Bezüge absichtlich vorsichtig.'
  naturalness: Modernes, gut lesbares Standarddeutsch. Die Überarbeitung verdeutlicht die syntaktische Reichweite von „zerstört“, ohne den knappen, aufzählenden Charakter des griechischen Satzes aufzugeben.
  terminology: „Aschdod“, „Tempel Dagons“, „Leichen“ und „Verbrannten“ sind passend. „Haufen“ ist bei βωμίας als zurückhaltende Wiedergabe vertretbar, sofern die Fußnote die Unsicherheit wahrt.
  issues:
