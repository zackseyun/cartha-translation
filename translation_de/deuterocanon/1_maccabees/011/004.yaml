    issue: Die Zerstörung wird nicht eindeutig auch von Aschdod selbst ausgesagt.
    rationale: καθῃρημένα steht im Griechischen bei „Aschdod und seine περιπόλια“. Der Entwurf lautet dagegen „Aschdod und die zerstörten Ortschaften“, wodurch „zerstört“ grammatisch nur die Ortschaften bestimmt.
  - severity: medium
    issue: „hatte verbrennen lassen“ fügt eine kausative Nuance ein.
    rationale: 'ἐνεπύρισε ist aktiv: Er verbrannte sie. Eine Befehls- oder Veranlassungsnuance ist im Wortlaut nicht markiert und sollte nicht ergänzt werden.'
  - severity: low
    issue: Der Schluss kann die Bezugsunsicherheit etwas transparenter abbilden.
    rationale: βωμίας und αὐτῶν sind im Kontext schwierig. „Haufen aus ihnen“ gibt den Bezug von αὐτῶν wieder, ohne „Scheiterhaufen“ als gesicherte Bedeutung festzulegen.
