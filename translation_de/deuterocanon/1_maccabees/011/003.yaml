  verdict: revise
  source_fidelity: Die militärische Handlung und die distributive Angabe („in jeder Stadt“) sind zutreffend wiedergegeben. Die Haupttextform „des Ptolemäus“ ersetzt jedoch den im vorliegenden griechischen Text stehenden Namen Πτολεμαΐς (Ptolemais) durch Πτοlemaios/Ptolemäus. Die komprimierte und textlich bzw. syntaktisch schwierige Ortsbezeichnung sollte nicht im Haupttext zugunsten einer bestimmten historischen Deutung aufgelöst werden.
  naturalness: Der Satz ist in modernem Standarddeutsch flüssig und angemessen knapp. „Truppen als Besatzung stationieren“ ist idiomatisch; „stellte ... als Besatzung auf“ ist ebenso natürlich und macht die militärische Funktion klar.
  terminology: „Truppen“ für δυνάμεις und „Besatzung“ für φρουράν sind passend. Der Eigenname muss als „Ptolemais“ wiedergegeben werden; eine Deutung auf Ptolemäus kann allenfalls erläuternd und ausdrücklich als unsicher in der Fußnote erscheinen.
  issues:
  - severity: high
    issue: Der Eigenname Πτολεμαΐς wird im Haupttext zu „Ptolemäus“ umgedeutet.
    rationale: Πτολεμαΐς und Πτολεμαῖος sind unterschiedliche griechische Namensformen. Da die Konstruktion im zugrunde gelegten Text komprimiert und ihre genaue Referenz unsicher ist, darf der Haupttext die Deutung „Städte des Ptolemäus“ nicht als gesichert ausgeben.
  - severity: medium
    issue: Die Fußnote behauptet eine konkrete Zuordnung zu Ptolemäus beziehungsweise dessen Herrschaftsgebiet.
    rationale: Dies kann als mögliche kontextuelle Erklärung genannt werden, muss aber als Deutung gekennzeichnet werden; die griechische Form selbst lautet Ptolemais.
  revised_text: Als er nun in die Städte von Ptolemais einzog, stellte er in jeder Stadt Truppen als Besatzung auf.
  revised_footnotes:
