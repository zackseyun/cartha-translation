    text: 'Wörtlich steht im Griechischen: „in die Städte Ptolemais“. Die Verbindung ist syntaktisch verkürzt. „Ptolemais“ kann Städte bezeichnen, die mit Ptolemais verbunden waren; eine Bezugnahme auf Städte unter der Herrschaft eines Ptolemäus ist eine mögliche, aber nicht sichere Deutung.'
    reason: lexical_alternative
