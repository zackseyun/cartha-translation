  yaml_path: translation/deuterocanon/1_maccabees/011/003.yaml
  text: And as he entered into the cities of Ptolemais[a], he stationed forces as a garrison in each city.
translation:
  language: de
  text: Als er nun in die Städte von Ptolemais einzog, stellte er in jeder Stadt Truppen als Besatzung auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als er nun
  rationale: Kennzeichnet den zeitlichen Übergang der Erzählung; „als“ gibt den temporalen Sinn wieder, während „nun“ den weiterführenden Charakter von δέ natürlich ausdrückt.
- source_word: εἰσεπορεύετο
  choice: einzog
  rationale: Das Imperfekt beschreibt den fortschreitenden beziehungsweise wiederholten Einzug in mehrere Städte. „Einzog“ ist im militärisch-politischen Zusammenhang natürlich und wahrt die durch εἰς bezeichnete Richtung.
- source_word: εἰς τὰς πόλεις Πτολεμαΐς
  choice: in die Städte des Ptolemäus
  rationale: Die griechische Wortverbindung ist syntaktisch stark verkürzt. Im Zusammenhang liegt eine Bezeichnung der zu Ptolemäus gehörenden beziehungsweise von ihm kontrollierten Städte näher als die einzelne Stadt Ptolemais; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: ἀπετάσσε
  choice: stationierte
  rationale: Das Verb bezeichnet hier das militärische Aufstellen oder Zuweisen von Truppen an feste Orte.
- source_word: τὰς δυνάμεις
  choice: Truppen
  rationale: Im Kontext sind organisierte Streitkräfte gemeint; „Truppen“ ist im Deutschen konkreter und natürlicher als „Kräfte“, ohne mehrere vollständige Heere vorauszusetzen.
- source_word: φρουράν
  choice: als Besatzung
  rationale: Der prädikative Akkusativ bezeichnet die Aufgabe der stationierten Truppen. „Besatzung“ meint hier eine militärische Garnison.
- source_word: ἐν ἑκάστῃ πόλει
  choice: in jeder Stadt
  rationale: Gibt die distributive und individualisierende Bedeutung von ἑκάστῃ unmittelbar wieder.
