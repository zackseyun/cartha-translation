base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/024.yaml
  text: And he took silver and gold and clothing and many other gifts[a], and went to the king at Ptolemais, and found favor before him.
translation:
  language: de
  text: Er nahm Silber, Gold, Gewänder und viele weitere Geschenke mit, ging zum König nach Ptolemaïs und fand Gunst bei ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »fand Gunst vor ihm«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: nahm … mit
  rationale: Das Aoristpartizip leitet eine Begleithandlung ein. Die finite Form gibt die Handlungsfolge im Deutschen natürlich wieder; „mitnehmen“ verdeutlicht, dass die genannten Dinge zum König gebracht wurden.
- source_word: ἀργύριον καὶ χρυσίον
  choice: Silber, Gold
  rationale: Die konkreten Materialbezeichnungen entsprechen dem griechischen Wortlaut; durch die Paarung mit Gold liegt bei ἀργύριον eher „Silber“ als das metonymische „Geld“ nahe.
- source_word: ἱματισμόν
  choice: Gewänder
  rationale: Das Wort bezeichnet Kleidung als wertvolles Gut beziehungsweise Geschenk. „Gewänder“ ist im historischen Zusammenhang verständlich und würdevoll.
- source_word: ἕτερα ξένια πλείονα
  choice: viele weitere Geschenke
  rationale: ξένια bezeichnet Gast- oder Ehrengeschenke und hier diplomatische Gaben. ἕτερα kennzeichnet zusätzliche, πλείονα zahlreiche beziehungsweise weitere Gaben.
- source_word: ἐπορεύθη πρὸς τὸν βασιλέα εἰς Πτολεμαΐδα
  choice: ging zum König nach Ptolemaïs
  rationale: Die Formulierung bewahrt sowohl die Bewegung zum König als auch das Reiseziel Ptolemaïs und klingt im Deutschen natürlich.
- source_word: εὗρεν χάριν ἐναντίον αὐτοῦ
  choice: fand Gunst bei ihm
  rationale: Dies gibt die biblische Wendung idiomatisch und verständlich wieder. Das Pronomen bezieht sich auf den König; die wörtlichere räumliche Ausdrucksweise wird in der Fußnote festgehalten.
