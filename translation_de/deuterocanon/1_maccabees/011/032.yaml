  text: König Demetrius grüßt Lasthenes, seinen Vater.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die griechische Briefformel: »König Demetrius, Lasthenes, seinem Vater, sich freuen.«'
    reason: lexical_alternative
  - marker: b
    text: Die Bezeichnung »seinen Vater« ist hier wahrscheinlich eine Ehrenbezeichnung oder eine höfische Anrede und muss kein leibliches Verwandtschaftsverhältnis bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεὺς Δημήτριος
  choice: König Demetrius
  rationale: Der Königstitel steht im griechischen Briefkopf unmittelbar beim Namen des Absenders; die artikellose deutsche Titelform ist hier natürlich.
- source_word: Λασθένει
  choice: Lasthenes
  rationale: Der Dativ bezeichnet den Empfänger des Schreibens; der Personenname wird in seiner etablierten Form wiedergegeben.
- source_word: τῷ πατρὶ
  choice: seinen Vater
  rationale: Die Apposition zu Lasthenes wird formal bewahrt. Das Possessivpronomen macht im Deutschen die auf Demetrius bezogene Relation verständlich, ohne festzulegen, ob sie biologisch oder ehrenhalber gemeint ist.
- source_word: χαίρειν
  choice: grüßt
  rationale: Der Infinitiv gehört zur geläufigen griechischen Briefformel. „Grüßt“ gibt deren Funktion in einem knappen, natürlichen deutschen Briefkopf wieder.
