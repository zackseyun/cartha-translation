  text: And he turned back against them in battle[a], and routed them, and they fled.
translation:
  language: de
  text: Da kehrte er um, um gegen sie zu kämpfen[a], schlug sie in die Flucht, und sie flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich etwa: „Er kehrte zu ihnen Krieg um.“ Die knappe Formulierung bedeutet: „Er kehrte um, um gegen sie zu kämpfen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: wandte er sich wieder
  rationale: Das Verb bezeichnet hier ein erneutes Sichwenden bzw. Umkehren gegen den Feind; die Formulierung bewahrt sowohl die Richtungsänderung als auch die Wiederaufnahme des Kampfes.
- source_word: πρὸς αὐτοὺς πόλεμον
  choice: gegen sie zum Kampf
  rationale: Die knappe griechische Verbindung wird im Deutschen idiomatisch wiedergegeben, ohne über den ausdrücklich genannten Kampf hinauszugehen.
- source_word: ἐτροπώσατο
  choice: schlug sie in die Flucht
  rationale: Das Verb bezeichnet militärisch das Zurückschlagen oder In-die-Flucht-Schlagen des Gegners. Diese Wiedergabe macht den Zusammenhang mit dem folgenden tatsächlichen Fliehen deutlich.
- source_word: ἔφυγον
  choice: sie flohen
  rationale: Die schlichte Erzählform gibt den griechischen Aorist knapp, präzise und in angemessenem Register wieder.
