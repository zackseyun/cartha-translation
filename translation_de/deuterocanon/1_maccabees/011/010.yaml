translation:
  language: de
  text: Denn ich bereue, ihm meine Tochter gegeben zu haben; denn er versuchte, mich zu töten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er suchte mich zu töten“. Das griechische Verb kann mit Infinitiv sowohl „suchen“ als auch „versuchen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταμεμέλημαι
  choice: ich bereue
  rationale: Das Perfekt bezeichnet ein gegenwärtiges Bedauern über eine frühere Handlung. „Ich bereue“ ist im politischen Zusammenhang natürlich und lässt offen, ob damit eine moralische Umkehr verbunden ist.
- source_word: δοὺς αὐτῷ τὴν θυγατέρα μου
  choice: ihm meine Tochter gegeben zu haben
  rationale: Die Konstruktion mit Infinitiv schließt sich im Deutschen natürlich an „bereue“ an und gibt die abgeschlossene Handlung des griechischen Aoristpartizips wieder.
- source_word: ἐζήτησεν
  choice: er hat versucht
  rationale: ζητέω mit folgendem Infinitiv kann sowohl „suchen/trachten“ als auch „versuchen“ bedeuten. Im modernen Deutschen drückt „versucht“ die beabsichtigte Tötung natürlich aus; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: ἀποκτεῖναί με
  choice: mich zu töten
  rationale: „Töten“ gibt den Infinitiv direkt und ohne die zusätzliche rechtliche oder moralische Wertung von „ermorden“ wieder.
