  source_fidelity: 'Die Übersetzung gibt alle Satzelemente des Griechischen zutreffend wieder: Jonatan begleitet den König bis zum Fluss namens Eleutherus und kehrt anschließend nach Jerusalem zurück. „Dann“ ist jedoch keine ausdrückliche Entsprechung von καί und kann ohne Verlust der erzählerischen Abfolge entfallen.'
  naturalness: „Bis zum Fluss“ ist im modernen Standarddeutsch idiomatischer als „bis zu dem Fluss“. Die knappe Reihung mit „und“ entspricht zudem dem schlichten griechischen Erzählstil besser als die Gliederung mit Semikolon und „dann“.
  terminology: „Jonatan“, „König“, „Eleutherus“ und „Jerusalem“ sind angemessen. Der Flussname wird korrekt als Eigenname behandelt. Die Fußnote ist sachlich und erklärt den Namen, ohne den Textsinn einzuengen.
