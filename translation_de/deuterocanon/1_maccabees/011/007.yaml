  yaml_path: translation/deuterocanon/1_maccabees/011/007.yaml
  text: And Jonathan went with the king as far as the river called Eleutherus[a], and he returned to Jerusalem.
translation:
  language: de
  text: Und Jonatan zog mit dem König bis zum Fluss, der Eleutherus[a] genannt wird, und kehrte nach Jerusalem zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eleutherus ist der Eigenname eines Flusses in einer nördlichen Grenzregion; der griechische Text sagt wörtlich: „der Fluss, der Eleutherus genannt wird“.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπορεύθη
  choice: zog
  rationale: Der Aorist von πορεύομαι bezeichnet hier eine Reisebewegung. „zog“ ist in historischer Erzählung natürlich und würdevoll, ohne einen zusätzlichen Sinn einzutragen.
- source_word: μετὰ τοῦ βασιλέως
  choice: mit dem König
  rationale: μετά mit Genitiv bezeichnet Begleitung; die direkte deutsche Entsprechung ist „mit dem König“.
- source_word: ἕως τοῦ ποταμοῦ
  choice: bis zu dem Fluss
  rationale: ἕως bezeichnet die räumliche Grenze der Begleitung. „bis zu“ bewahrt diesen Endpunkt klar.
- source_word: τοῦ καλουμένου Ἐλευθέρου
  choice: der Eleutherus genannt wird
  rationale: Das Partizip καλουμένου bedeutet „genannt“. Der geografische Eigenname Ἐλευθέρου wird in der etablierten lateinischen Form „Eleutherus“ wiedergegeben und nicht übersetzt.
- source_word: ἐπέστρεψεν
  choice: kehrte er … zurück
  rationale: ἐπιστρέφω bezeichnet hier die Rückkehr nach dem zuvor genannten Begleitweg; „zurückkehren“ ist im Deutschen präzise und idiomatisch.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: εἰς bezeichnet Bewegung zu einem Ziel. Bei Städtenamen ist „nach Jerusalem“ die natürliche deutsche Form.
