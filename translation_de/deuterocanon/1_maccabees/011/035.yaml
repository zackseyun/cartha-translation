  source_fidelity: 'Der deutsche Text gibt die Struktur und sämtliche wiederholten Besitz-/Anspruchsmarkierungen des Griechischen zuverlässig wieder: die übrigen königlichen Ansprüche, die Geltung „von nun an“, Zehnten, Abgaben, Salzseen und Kronen sowie die abschließende Gewährung an „sie“. „Zustehen“ trifft den rechtlich-fiskalischen Sinn von ἀνήκειν gut; „gewähren“ ist im Kontext der königlichen Überlassung für ἐπαρκέσομεν vertretbar.'
  naturalness: Die Formulierung ist modernes, gut verständliches Standarddeutsch mit angemessen förmlichem Verwaltungsregister. Die Gedankenstriche strukturieren die lange, im Griechischen ebenfalls stark verschachtelte Aufzählung sinnvoll. Die Wiederholung von „uns zustehen“ ist stilistisch leicht schwer, aber quellentreu und in diesem Erlassstil natürlich genug.
  terminology: „Zehnten“ und „Abgaben“ sind treffend. „Salzseen“ bewahrt bewusst die wörtliche und sachlich nicht völlig sichere Bedeutung von λίμνας; die Alternativen sind sachgerecht in der Fußnote vermerkt. „Kronen“ erhält die wörtliche Bedeutung von στεφάνους, während die Fußnote den möglichen fiskalischen Gebrauch vorsichtig, ohne Festlegung, erklärt. Die Fußnotenanker stehen jeweils bei den erläuterten Ausdrücken.
