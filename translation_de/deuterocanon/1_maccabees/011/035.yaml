base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/035.yaml
  text: And the other things belonging to us from now on—the tithes and the taxes belonging to us[a], and the salt lakes[b], and the crowns belonging to us—we will grant all these to them.
translation:
  language: de
  text: Und auch alles andere, was uns von nun an zusteht – die Zehnten und die Abgaben, die uns zustehen, die Salzseen[a] und die Kronen, die uns zustehen[b] –, werden wir ihnen alles gewähren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Salzpfannen“ beziehungsweise „Salinen“. Wörtlich steht im Griechischen „Salzseen“; wahrscheinlich sind Einrichtungen oder Gebiete zur Salzgewinnung oder deren Einkünfte gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Kronen“. In diesem fiskalischen Zusammenhang kann damit eine herkömmliche Kronenabgabe oder eine dem König geschuldete Ehrengabe gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄλλα
  choice: alles andere
  rationale: Die offene Sammelbezeichnung leitet weitere königliche Einnahmen und Rechte ein, ohne sie über die folgende Aufzählung hinaus festzulegen.
- source_word: ἀνήκοντα ἡμῖν / τῶν ἀνηκόντων ἡμῖν / τοὺς ἀνήκοντας ἡμῖν
  choice: was uns zusteht / die uns zustehen
  rationale: „Zustehen“ bewahrt den rechtlich-fiskalischen Sinn von Einnahmen oder Vorrechten, auf die der König Anspruch erhebt, und gibt die Wiederholung des griechischen Ausdrucks wieder.
- source_word: ἀπὸ τοῦ νῦν
  choice: von nun an
  rationale: Die geläufige deutsche Wendung bezeichnet den sofortigen Beginn und die künftige Geltung der Verfügung.
- source_word: δεκατῶν
  choice: Zehnten
  rationale: „Zehnten“ ist die übliche Bezeichnung für Abgaben in Höhe eines Zehntels und passt zum fiskalischen Zusammenhang.
- source_word: τελῶν
  choice: Abgaben
  rationale: Der Ausdruck kann Steuern, Zölle oder andere öffentlich erhobene Leistungen bezeichnen. „Abgaben“ lässt diesen Umfang offen.
- source_word: τὰς τῶν ἁλῶν λίμνας
  choice: Salzseen
  rationale: Dies entspricht wörtlich den „Seen des Salzes“ und bewahrt die Möglichkeit, dass Salzgewässer, Salzgewinnungsstätten oder die damit verbundenen Einkünfte gemeint sind.
- source_word: στεφάνους
  choice: Kronen
  rationale: Die wörtliche Bedeutung wird im Haupttext bewahrt; der mögliche fiskalische Fachsinn wird in der Fußnote erläutert.
- source_word: πάντα ἐπαρκέσομεν αὐτοῖς
  choice: werden wir ihnen alles gewähren
  rationale: Im Zusammenhang eines königlichen Erlasses bezeichnet die Wendung die Gewährung beziehungsweise Überlassung der genannten Rechte und Einkünfte. „Gewähren“ ist verständlich, ohne die Art der Zuwendung enger festzulegen.
