base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/062.yaml
  text: And the men from Gaza asked terms of Jonathan[a], and he gave them pledges; and he took the sons of their rulers as hostages and sent them to Jerusalem[b]. And he passed through the country as far as Damascus.
translation:
  language: de
  text: Die Leute aus Gaza richteten eine Bitte an Jonatan, und er gab ihnen Zusicherungen[b]. Die Söhne ihrer Herrscher nahm er als Geiseln und schickte sie nach Jerusalem.[a] Dann zog er durch das Land bis nach Damaskus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Textzeuge enthält nach »Jerusalem« noch das isolierte Wort »Asalim« (Ἀσαλήμ). Da es sich nicht sinnvoll in den Satz einfügt, könnte hier eine Textverderbnis oder ein versehentlich eingedrungener Ortsname vorliegen.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: »er gab ihnen rechte Hände«; dies ist eine Wendung für verbindliche Zusagen oder Unterpfänder guten Willens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν οἱ ἀπὸ Γάζης Ἰωνάθαν
  choice: Die Leute aus Gaza richteten eine Bitte an Jonatan
  rationale: Das Verb bezeichnet hier eine an Jonatan gerichtete Bitte oder ein Ersuchen, nennt deren Inhalt im überlieferten griechischen Satz aber nicht ausdrücklich. Die Wiedergabe bewahrt diese Offenheit, statt Frieden oder konkrete Bedingungen in den Haupttext einzutragen.
- source_word: ἔδωκεν αὐτοῖς δεξιάς
  choice: er gab ihnen Zusicherungen
  rationale: Wörtlich ist von »rechten Händen« die Rede; im diplomatischen Zusammenhang bezeichnet die Wendung verbindliche Zusagen oder Unterpfänder guten Willens. »Zusicherungen« gibt den idiomatischen Sinn natürlich wieder, ohne ausdrücklich Frieden hinzuzufügen.
- source_word: τοὺς υἱοὺς τῶν ἀρχόντων αὐτῶν
  choice: die Söhne ihrer Herrscher
  rationale: ἄρχοντες sind die politisch führenden oder regierenden Männer. »Herrscher« wahrt den formellen politischen Sinn.
- source_word: εἰς ὅμηρα
  choice: als Geiseln
  rationale: Die Präpositionalfügung bezeichnet die Rolle, in der die Söhne mitgenommen wurden; »als Geiseln« ist im Deutschen eindeutig und idiomatisch.
- source_word: διῆλθεν τὴν χώραν
  choice: zog er durch das Land
  rationale: διέρχομαι bezeichnet das Durchziehen oder Durchqueren; χώρα meint hier das umliegende Land beziehungsweise Gebiet. »zog ... durch das Land« passt zum militärisch-reisebezogenen Erzählzusammenhang.
- source_word: ἕως Δαμασκοῦ
  choice: bis nach Damaskus
  rationale: Dies ist die natürliche deutsche Richtungsangabe für die Bewegung bis zu diesem Ziel.
- source_word: Ἀσαλήμ
  choice: nicht in den Haupttext aufgenommen; in Fußnote [a] dokumentiert
  rationale: Das isolierte Wort steht im angegebenen Zeugen nach »Jerusalem«, lässt sich dort jedoch weder syntaktisch noch erzählerisch sicher einordnen. Es wird daher nicht deutend in den Satz eingebaut, sondern textkritisch ausgewiesen.
