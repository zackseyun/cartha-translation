  rationale: Die Revision ersetzt allein die missverständliche Formulierung „ließ ihn … zählen“ durch eine natürliche deutsche Konstruktion, die die amtliche Zurechnung zu einem Hofrang wiedergibt. „Innegehabt“ passt bei Ehrenstellungen besser als „besessen“, ohne den Sinn zu verändern.
