  yaml_path: translation/deuterocanon/1_maccabees/011/027.yaml
  text: And he confirmed for him the high priesthood[a], and whatever other honors he had formerly held, and he made him rank among the first friends.
translation:
  language: de
  text: Und er bestätigte ihm das Hohepriesteramt und alle anderen Ehren, die er zuvor innegehabt hatte, und machte ihn zu einem der ersten Freunde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem der führenden Freunde“. Das Griechische bezeichnet wahrscheinlich einen förmlichen Hofrang in der seleukidischen Verwaltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστήρισεν
  choice: bestätigte
  rationale: Im politisch-administrativen Zusammenhang bezeichnet das Verb die förmliche Sicherung beziehungsweise Bestätigung eines bereits verliehenen Amtes, nicht eine erstmalige Einsetzung.
- source_word: ἀρχιερωσύνην
  choice: das Hohepriesteramt
  rationale: Das Substantiv bezeichnet Amt und Würde des Hohepriesters. „Hohepriesteramt“ ist im modernen Deutsch klarer und natürlicher als das abstraktere „Hohepriestertum“.
- source_word: τίμια
  choice: Ehren
  rationale: Das substantivierte Adjektiv meint hier Ehrenstellungen oder Auszeichnungen im Rahmen königlicher Begünstigung, nicht wertvolle Gegenstände.
- source_word: τὸ πρότερον
  choice: zuvor
  rationale: Die adverbiale Wendung verweist knapp und idiomatisch auf die Ehren, die Jonathan bereits früher besessen hatte.
- source_word: τῶν πρώτων φίλων
  choice: zu den Ersten Freunden
  rationale: Die relativ formale Wiedergabe bewahrt den wahrscheinlichen seleukidischen Hoftitel und vermeidet, den genauen Rang durch eine freiere Übersetzung vorschnell festzulegen.
- source_word: ἡγεῖσθαι
  choice: zählen
  rationale: In der Konstruktion mit ποιεῖν bezeichnet das Verb die Zurechnung zu einer Ranggruppe. „Ließ ihn … zählen“ gibt diesen Statuswechsel idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Erste Freunde“ wird als wahrscheinlicher Hoftitel großgeschrieben; die Fußnote erklärt die ungewohnte Formulierung, ohne die historische Rangbezeichnung zu überdeuten.
