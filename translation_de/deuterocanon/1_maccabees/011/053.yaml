  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt die Folge der griechischen Aussagen, wird aber durch ein Semikolon lesbarer gegliedert. »Jonatan« folgt der heute üblichen deutschen Namensform.
