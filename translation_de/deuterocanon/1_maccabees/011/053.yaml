  yaml_path: translation/deuterocanon/1_maccabees/011/053.yaml
  text: And he proved false in everything that he said[a], and became estranged from Jonathan, and did not repay the favors that Jonathan had shown him, and he oppressed him severely.
translation:
  language: de
  text: Und in allem, was er gesagt hatte, erwies er sich als falsch[a]; er wandte sich von Jonatan ab, vergalt ihm die Wohltaten nicht, die Jonatan ihm als Gegenleistung erwiesen hatte,[b] und bedrängte ihn sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »log er bei allem, was er sagte«; auch möglich: »handelte er bei allem, was er sagte, betrügerisch«. Das griechische Verb kann eine Lüge in der Rede oder allgemeiner betrügerisches Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die er ihm vergolten hatte«. Das Subjekt im Relativsatz wird im Griechischen nicht genannt; aus dem Zusammenhang ist Jonatan naheliegend. Das Verb bezeichnet eine Erwiderung bzw. Gegenleistung.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἐψεύσατο
  choice: erwies er sich als falsch
  rationale: Die Form kann sowohl das Lügen in der Rede als auch treuloses beziehungsweise betrügerisches Handeln bezeichnen. Die gewählte Wendung bewahrt diese Bedeutungsbreite und passt zur Ergänzung »in allem, was er gesagt hatte«.
- source_word: πάντα ὅσα εἶπεν
  choice: in allem, was er gesagt hatte
  rationale: Die Formulierung gibt den umfassenden Sinn von πάντα ὅσα wieder; das Plusquamperfekt ordnet die früheren Aussagen im deutschen Erzählzusammenhang natürlich ein.
- source_word: ἠλλοτριώθη τῷ Ἰωνάθαν
  choice: er entfremdete sich Jonatan
  rationale: Das reflexive deutsche Verb bildet das griechische Passiv und den Dativ idiomatisch ab, ohne die Beziehungsstörung vorschnell als offene Feindschaft zu deuten.
- source_word: οὐκ ἀνταπέδωκεν τὰς εὐνοίας
  choice: vergalt ihm die Wohltaten nicht
  rationale: ἀνταποδίδωμι bezeichnet eine entsprechende Gegenleistung oder Erwiderung; εὔνοια steht hier im politischen Zusammenhang für erwiesene Gunst beziehungsweise konkrete Wohltaten.
- source_word: ἃς ἀνταπέδωκεν αὐτῷ
  choice: die Jonatan ihm erwiesen hatte
  rationale: Jonatan wird als im Kontext naheliegendes Subjekt ausdrücklich genannt. »Erwiesen hatte« ist im Deutschen bei Wohltaten natürlich und vermeidet die missverständliche Vorstellung, Jonatan habe lediglich eine Schuld zurückgezahlt.
- source_word: ἔθλιψεν αὐτὸν σφόδρα
  choice: bedrängte ihn schwer
  rationale: θλίβω bezeichnet starken Druck, Bedrängnis oder Unterdrückung. »Schwer bedrängen« bewahrt die Intensität von σφόδρα, ohne eine bestimmte Form der Bedrückung festzulegen.
