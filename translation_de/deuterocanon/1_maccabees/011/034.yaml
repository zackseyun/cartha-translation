base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/034.yaml
  text: Therefore we have confirmed for them the borders of Judea and the three districts—Aphairema and Lydda and Ramathaim—which were added to Judea from Samaria[a], and all that adjoins them, for all who offer sacrifice in Jerusalem[c][b], instead of the royal taxes that the king formerly received from them each year from the produce of the land and the fruit trees.
translation:
  language: de
  text: Darum haben wir ihnen die Grenzen Judäas sowie die drei Bezirke[a] – Aphairema, Lydda und Ramathaim –, die von Samaria zu Judäa hinzugefügt wurden, samt allem, was zu ihnen gehört[b], bestätigt, und zwar für alle, die in Jerusalem Opfer darbringen, anstelle der königlichen Abgaben, die der König früher jedes Jahr von ihnen aus den Erträgen des Landes und den Baumfrüchten[c] bezog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet hier Verwaltungsbezirke; in älterer Fachliteratur werden sie auch „Nomen“ genannt.
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung ist weit gefasst und kann zugehörige Dörfer, Ländereien oder andere Bestandteile der drei Bezirke einschließen.
    reason: lexical_ambiguity
  - marker: c
    text: Das griechische Wort kann allgemein Erzeugnisse von Bäumen bezeichnen, darunter Früchte und Nüsse.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐστήκαμεν
  choice: haben wir … bestätigt
  rationale: Das Perfekt von ἵστημι bezeichnet hier im Zusammenhang eines königlichen Erlasses die verbindliche Festsetzung beziehungsweise Bestätigung einer Regelung.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: die Grenzen Judäas
  rationale: ὅρια bezeichnet politische oder territoriale Grenzen; die knappe Formulierung ist im Deutschen natürlich.
- source_word: τοὺς τρεῖς νομοὺς
  choice: die drei Bezirke
  rationale: νομός bezeichnet im hellenistischen Verwaltungsgebrauch einen Verwaltungsbezirk. „Bezirke“ vermittelt dies verständlich, ohne den Fachausdruck „Nomen“ in den Haupttext zu übernehmen.
- source_word: Ἀφαίρεμα καὶ Λυδδὰ καὶ Ραμαθείμ
  choice: Aphairema, Lydda und Ramathaim
  rationale: Die Ortsnamen werden in einer dem griechischen Text nahen, im Deutschen lesbaren Form wiedergegeben.
- source_word: προσετέθησαν τῇ Ἰουδαίᾳ ἀπὸ τῆς Σαμαρίτιδος
  choice: die von Samaria zu Judäa hinzugefügt wurden
  rationale: Die passive Form bezeichnet die administrative Übertragung der Bezirke aus Samaria an Judäa, ohne die politische Art dieses Vorgangs näher festzulegen.
- source_word: πάντα τὰ συγκυροῦντα αὐτοῖς
  choice: samt allem, was zu ihnen gehört
  rationale: Die breite griechische Wendung kann zugehörige Orte, Ländereien oder sonstige Bestandteile umfassen; die Übersetzung bewahrt diese Offenheit.
- source_word: πᾶσιν τοῖς θυσιάζουσιν εἰς Ἰερουσαλήμ
  choice: für alle, die in Jerusalem Opfer darbringen
  rationale: θυσιάζω meint konkret das Darbringen von Opfern. Die Dativgruppe bezeichnet am ehesten die Begünstigten der Verfügung.
- source_word: ἀντὶ τῶν βασιλικῶν
  choice: anstelle der königlichen Abgaben
  rationale: Das substantivierte τὰ βασιλικά bezeichnet hier aufgrund des anschließenden fiskalischen Zusammenhangs königliche Einkünfte oder Abgaben.
- source_word: ὧν ἐλάμβανεν ὁ βασιλεὺς παρʼ αὐτῶν τὸ πρότερον κατʼ ἐνιαυτόν
  choice: die der König früher jedes Jahr von ihnen … bezog
  rationale: Imperfekt und τὸ πρότερον beschreiben die frühere regelmäßige Erhebung; „bezog“ passt zu Einnahmen aus Abgaben.
- source_word: τῶν γενημάτων τῆς γῆς
  choice: aus den Erträgen des Landes
  rationale: γενήματα umfasst die landwirtschaftlichen Erzeugnisse beziehungsweise den Bodenertrag allgemein.
- source_word: τῶν ἀκροδρύων
  choice: den Baumfrüchten
  rationale: ἀκρόδρυα bezeichnet Erzeugnisse von Bäumen, darunter Früchte und je nach Gebrauch auch Nüsse; „Baumfrüchte“ bewahrt diesen Bezug besser als „Obstbäume“.
