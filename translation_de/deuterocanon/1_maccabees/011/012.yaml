  yaml_path: translation/deuterocanon/1_maccabees/011/012.yaml
  text: And after taking his daughter away from him[a], he gave her to Demetrius; and Alexander’s attitude changed, and their hostility became evident.
translation:
  language: de
  text: Nachdem er ihm seine Tochter weggenommen hatte, gab er sie Demetrius. Da veränderte sich Alexanders Miene[a], und ihre Feindschaft trat offen zutage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Alexanders Gesicht veränderte sich.“ Gemeint sein kann eine Veränderung seiner Haltung oder seines sichtbaren Auftretens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφελόμενος αὐτοῦ τὴν θυγατέρα
  choice: Nachdem er ihm seine Tochter weggenommen hatte
  rationale: Das Aoristpartizip bezeichnet eine vorausgehende Handlung; ἀφαιρέω drückt hier das Wegnehmen von Alexander aus. Die deutsche Konstruktion macht zugleich deutlich, dass es sich um die Tochter des handelnden Königs handelt.
- source_word: ἔδωκεν αὐτὴν τῷ Δημητρίῳ
  choice: gab er sie Demetrius
  rationale: Die schlichte Wiedergabe folgt dem griechischen ἔδωκεν, ohne den im Zusammenhang naheliegenden, aber nicht ausdrücklich genannten Zusatz „zur Frau“ einzufügen.
- source_word: ἠλλοιώθη τὸ πρόσωπον Ἀλεξάνδρου
  choice: Alexanders Miene veränderte sich
  rationale: Die Wendung lautet wörtlich, dass Alexanders Gesicht verändert wurde. „Miene“ bewahrt das körperlich sichtbare Bild und lässt zugleich eine Veränderung seiner Stimmung oder Haltung erkennen.
- source_word: ἐφάνη ἡ ἔχθρα αὐτῶν
  choice: ihre Feindschaft trat offen zutage
  rationale: ἐφάνη bezeichnet das Sichtbar- oder Offenbarwerden; die Formulierung gibt wieder, dass die Feindschaft zwischen beiden nun erkennbar hervortrat.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Miene“ erhält das Bild des griechischen Ausdrucks, ohne es auf eine rein körperliche Veränderung zu verengen; „trat offen zutage“ gibt das öffentliche Sichtbarwerden der Feindschaft idiomatisch wieder.
