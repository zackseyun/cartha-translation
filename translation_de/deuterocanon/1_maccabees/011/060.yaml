revisions:
- from: Jonatan zog aus und reiste auf die andere Seite des Flusses[a] und durch die Städte. Alle Streitkräfte Syriens versammelten sich bei ihm, um sich mit ihm zu verbünden.[b] Dann kam er nach Aschkelon, und die Bewohner der Stadt kamen ihm ehrenvoll entgegen.
  to: Jonatan zog aus und reiste jenseits des Flusses[a] durch die Städte. Alle Streitkräfte Syriens versammelten sich bei ihm als Verbündete.[b] Dann kam er nach Aschkelon, und die Bewohner der Stadt kamen ihm ehrenvoll entgegen.
  rationale: Die räumliche Wendung wurde von einer implizierten Flussüberquerung zu der quellennäheren, weiterhin natürlichen Angabe „jenseits des Flusses“ geändert. Die Bündnisformulierung wurde gestrafft, damit sie weder Absicht noch rechtliche Form des Bündnisses überbestimmt. Die vorhandenen Fußnoten bleiben inhaltlich und in ihrer Verankerung passend.
