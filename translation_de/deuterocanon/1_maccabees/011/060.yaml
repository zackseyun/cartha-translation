  naturalness: Der Stil ist modernes, gut lesbares Standarddeutsch. Die leicht gegliederte Satzfolge ist angemessen. „Jenseits des Flusses durch die Städte“ ist zugleich natürlich und näher am räumlichen Ausdruck des Griechischen.
