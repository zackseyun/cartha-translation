base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/060.yaml
  text: And Jonathan went out[a], and he traveled beyond the river and through the cities, and all the forces of Syria gathered to him as allies, and he came to Ashkelon[b], and the men of the city met him with honor.
translation:
  language: de
  text: Jonatan zog aus und reiste jenseits des Flusses[a] durch die Städte. Alle Streitkräfte Syriens versammelten sich bei ihm als Verbündete.[b] Dann kam er nach Aschkelon, und die Bewohner der Stadt kamen ihm ehrenvoll entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Fluss wird im griechischen Text nicht näher bezeichnet; in diesem geschichtlichen Zusammenhang ist wahrscheinlich der Euphrat gemeint.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „zu einem Bündnis“ oder „in ein Bündnis hinein“. Die griechische Wendung εἰς συμμαχίαν beschreibt, dass die syrischen Streitkräfte sich Jonatan zur Unterstützung anschlossen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλεν
  choice: zog aus
  rationale: Die militärisch geprägte Wendung gibt den schlichten Erzählfortschritt wieder, ohne einen bestimmten Feldzug ausdrücklich vorauszusetzen.
- source_word: διεπορεύετο
  choice: reiste
  rationale: Das Imperfekt bezeichnet eine fortdauernde Bewegung; „reiste“ ist im Deutschen natürlich und lässt die genaue Art des Vorankommens offen.
- source_word: πέραν τοῦ ποταμοῦ
  choice: auf die andere Seite des Flusses
  rationale: Die Wiedergabe bewahrt, dass der Fluss im Griechischen nicht namentlich genannt wird, und drückt die Bewegung über ihn hinweg aus.
- source_word: ἐν ταῖς πόλεσιν
  choice: durch die Städte
  rationale: Im Zusammenhang mit dem Verb der Fortbewegung ist „durch die Städte“ eine natürliche kontextuelle Wiedergabe von ἐν.
- source_word: ἠθροίσθησαν
  choice: versammelten sich
  rationale: Die Form beschreibt das Zusammenkommen der syrischen Streitkräfte bei Jonatan.
- source_word: δυνάμεις
  choice: Streitkräfte
  rationale: Im militärischen Kontext bezeichnet δυνάμεις bewaffnete Verbände; „Streitkräfte“ bleibt umfassender als „Heere“ oder „Truppen“.
- source_word: εἰς συμμαχίαν
  choice: um sich mit ihm zu verbünden
  rationale: Die Formulierung gibt Ziel beziehungsweise Ergebnis des Zusammenkommens idiomatisch wieder, ohne die griechische Verhältnisbestimmung unnötig festzulegen.
- source_word: Ἀσκαλῶνα
  choice: Aschkelon
  rationale: Dies ist die im modernen Deutschen gebräuchliche Form des Ortsnamens.
- source_word: ἀπήντησαν αὐτῷ
  choice: kamen ihm entgegen
  rationale: Das Verb kann ausdrücklich das Entgegengehen zu einer Begegnung bezeichnen; diese Nuance passt zur förmlichen Aufnahme durch die Stadt.
- source_word: ἐνδόξως
  choice: ehrenvoll
  rationale: Das Adverb bezeichnet hier eine ehrenvolle, angesehene oder prächtige Aufnahme; „ehrenvoll“ ist würdig und nicht übersteigert.
