base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/016.yaml
  text: And Alexander fled to Arabia[a], that he might be sheltered there[b]; but King Ptolemy was exalted.
translation:
  language: de
  text: Und Alexander floh nach Arabien, um dort Schutz zu finden[a]; König Ptolemäus aber wurde erhöht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um dort verborgen zu werden« beziehungsweise »um dort beschützt zu werden«. Der griechische Zweckausdruck kann Zuflucht, Verbergen oder Schutz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wurde emporgehoben« beziehungsweise »gelangte zu großer Macht«. Wörtlich heißt es im Griechischen: »wurde erhöht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: floh
  rationale: Der Aorist von φεύγω bezeichnet hier im militärisch-politischen Zusammenhang eine Flucht; »floh« gibt dies knapp und natürlich wieder.
- source_word: Ἀραβίαν
  choice: Arabien
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: τοῦ σκεπασθῆναι αὐτὸν ἐκεῖ
  choice: um dort Schutz zu finden
  rationale: Der artikulierte Infinitiv mit τοῦ drückt den Zweck aus. Obwohl σκεπασθῆναι formal passiv ist, gibt »Schutz zu finden« den Sinn von Zuflucht und Bewahrung im Deutschen natürlich wieder, ohne ihn allein auf Verbergen einzuengen.
- source_word: ὁ δὲ βασιλεὺς Πτολεμαῖος
  choice: König Ptolemäus aber
  rationale: Das nachgestellte »aber« bildet den Gegensatz zwischen Alexanders Flucht und Ptolemäus’ Aufstieg ab und entspricht zugleich einem würdigen deutschen Erzählstil.
- source_word: ὑψώθη
  choice: wurde erhöht
  rationale: Die passive Form wahrt die bildhafte und mehrdeutige Bedeutung von ὑψόω; sie lässt offen, ob politische Macht, Rang, Ansehen oder Erfolg im Vordergrund steht.
theological_decisions:
- issue: Wiedergabe von ὑψώθη im königlich-politischen Zusammenhang
  choice: wurde erhöht
  alternative: stieg zu großer Macht auf
  rationale: Die wörtlichere Form bewahrt die mögliche politische und ehrende Resonanz des Verbs, statt sie auf bloßen Machtzuwachs festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Zweckkonstruktion wird idiomatisch wiedergegeben; bei ὑψώθη bleibt die echte Bedeutungsweite durch eine formnahe Übersetzung und eine Fußnote erhalten.
