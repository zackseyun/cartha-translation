  text: Und er tadelte ihn, weil dieser nach dessen Königreich verlangte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… weil dieser dessen Königreich begehrte.“ Das griechische Verb für „verlangte“ kann in diesem Zusammenhang auch den stärkeren Sinn „begehrte“ haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψόγισεν
  choice: tadelte
  rationale: ψογίζω bezeichnet das Tadeln, Rügen oder Vorwerfen. „Tadelte“ bewahrt die persönliche, vorwurfsvolle Aussage, ohne sie zu einer förmlichen Verurteilung zu steigern.
- source_word: χάριν τοῦ
  choice: weil
  rationale: χάριν mit artikuliertem Infinitiv gibt hier den Grund an. „Weil“ drückt diesen Zusammenhang in natürlichem modernem Deutsch aus.
- source_word: ἐπιθυμῆσαι
  choice: nach … verlangte
  rationale: ἐπιθυμέω kann sowohl neutrales Verlangen als auch missbilligendes Begehren ausdrücken. „Nach … verlangte“ hält die Grundbedeutung offen; die stärkere mögliche Nuance wird in der Fußnote genannt.
- source_word: τῆς βασιλείας
  choice: seinem Königreich
  rationale: βασιλεία kann Königreich, Königsherrschaft oder Königtum bezeichnen. Hier ist „Königreich“ die unmittelbarste und allgemein verständliche Wiedergabe der Herrschaftssphäre, auf die sich das Verlangen richtet.
- source_word: αὐτὸν … αὐτοῦ
  choice: ihn … seinem
  rationale: Die wiederholten griechischen Pronomen werden knapp wiedergegeben, ohne ihren Bezug ausdrücklich aufzulösen. Die naheliegende Lesart ist, dass jemand einen anderen tadelt, weil dieser nach dem Königreich des Tadelnden verlangt.
