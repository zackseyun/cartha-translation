  text: King Demetrius to Jonathan his brother[a], greetings, and to the nation of the Jews.
translation:
  language: de
  text: König Demetrius grüßt Jonatan, seinen Bruder, und das Volk der Juden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Volk der Judäer“. Das griechische Ἰουδαίων kann je nach Betonung ethnisch als „Juden“ oder mit stärkerer territorialer Zuordnung als „Judäer“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βασιλεὺς Δημήτριος
  choice: König Demetrius
  rationale: Der Königstitel steht im griechischen Briefkopf unmittelbar vor dem Namen; diese Form ist auch im Deutschen natürlich und würdevoll.
- source_word: Ἰωνάθαν
  choice: Jonatan
  rationale: Gebräuchliche deutsche biblische Namensform.
- source_word: τῷ ἀδελφῷ
  choice: seinen Bruder
  rationale: Der Dativ bezeichnet den Empfänger. Das Possessivpronomen ist im Deutschen idiomatisch; „Bruder“ wahrt die diplomatische Ehrenbezeichnung, ohne sie als leibliche Verwandtschaft auszudeuten.
- source_word: χαίρειν
  choice: grüßt
  rationale: χαίρειν ist die übliche hellenistische Briefformel. Die verbale Wiedergabe verbindet im Deutschen beide Empfängergruppen klar und natürlich.
- source_word: ἔθνει
  choice: Volk
  rationale: ἔθνος bezeichnet hier die politisch und ethnisch verstandene Gemeinschaft. „Volk“ ist im modernen Deutschen natürlicher als „Nation“ und bewahrt den kollektiven Sinn.
- source_word: Ἰουδαίων
  choice: der Juden
  rationale: Die Genitivverbindung bestimmt das angesprochene Volk. „Juden“ ist die geläufige Wiedergabe; die mögliche geografisch-ethnische Nuance „Judäer“ wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von ἀδελφός in königlicher Korrespondenz
  choice: Die Anrede „Bruder“ bleibt im Haupttext erhalten.
  alternative: Als bloße Bezeichnung für einen Verbündeten oder Vertrauten umschreiben.
  rationale: Der griechische Text nennt Jonatan ausdrücklich „Bruder“. Im diplomatischen Kontext ist dies wahrscheinlich eine Ehren- und Gleichrangigkeitsbezeichnung, doch die Übersetzung soll weder das Wort tilgen noch leibliche Verwandtschaft behaupten.
translation_notes:
  register: Moderner, würdevoller Briefstil. Die griechische Absender-Empfänger-Formel wird als natürlicher deutscher Satz wiedergegeben; die Reihenfolge und beide Adressaten bleiben erhalten.
