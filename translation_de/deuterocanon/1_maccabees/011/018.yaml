  text: And King Ptolemy died on the third day[a], and those who were in his strongholds were destroyed by those in the strongholds.
translation:
  language: de
  text: Und König Ptolemäus starb am dritten Tag, und die in seinen Festungen waren, wurden von denen in den Festungen vernichtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen wird die Wendung wiederholt: zunächst „in seinen Festungen“, dann „in den Festungen“. Die Formulierung unterscheidet offenbar zwei Gruppen; ihr genaues Verhältnis zueinander bleibt im knappen griechischen Wortlaut unklar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: starb
  rationale: Das Verb bezeichnet direkt den Tod; „starb“ ist die klare, sachliche deutsche Entsprechung ohne Euphemismus.
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: am dritten Tag
  rationale: Die Wendung wird im Deutschen natürlich so wiedergegeben. Der im Erzählzusammenhang vorausgesetzte Ausgangspunkt wird nicht ausdrücklich ergänzt.
- source_word: οἱ ὄντες
  choice: diejenigen, die … waren
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein die dort befindlichen Personen, ohne sie näher als Männer oder Soldaten zu bestimmen.
- source_word: ὀχυρώμασιν
  choice: Festungen
  rationale: ὀχύρωμα bezeichnet befestigte Orte oder militärische Befestigungen. „Festungen“ ist verständlich und bewahrt den konkreten militärischen Sinn.
- source_word: ἀπώλοντο
  choice: wurden … vernichtet
  rationale: Die Form beschreibt ihren Untergang unter Einwirkung einer ausdrücklich mit ὑπό genannten Gruppe. „Vernichtet“ erhält diese Agensbeziehung, ohne den Vorgang enger als bloßes Töten zu bestimmen.
- source_word: ὑπὸ τῶν ἐν τοῖς ὀχυρώμασιν
  choice: von denen in den Festungen
  rationale: ὑπό mit Genitiv bezeichnet hier die handelnde Gruppe. Die knappe Wiederholung des griechischen Wortlauts bleibt sichtbar, ohne das unklare Verhältnis der beiden Gruppen auszudeuten.
