  yaml_path: translation/deuterocanon/1_maccabees/011/005.yaml
  text: And they reported to the king what Jonathan had done[a], in order to accuse him; but the king kept silent.
translation:
  language: de
  text: Und sie berichteten dem König, was Jonatan getan hatte, um ihn anzuklagen[a]; doch der König schwieg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihn zu tadeln“ oder „um ihn herabzusetzen“. Das griechische Verb kann sowohl Tadel und Herabsetzung als auch eine Anklage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: berichteten
  rationale: Das Verb bezeichnet ein ausführliches Erzählen oder Darlegen. Im höfischen Zusammenhang mit τῷ βασιλεῖ gibt „berichteten“ den Sinn natürlich wieder, ohne den Umfang des Berichts zu überzeichnen.
- source_word: ἃ ἐποίησεν Ἰωνάθαν
  choice: was Jonatan getan hatte
  rationale: Die Relativkonstruktion bezieht sich auf Jonatans Handlungen; das Plusquamperfekt ordnet sie vor dem Bericht an den König ein.
- source_word: εἰς τὸ ψογίσαι αὐτόν
  choice: um ihn anzuklagen
  rationale: ψογίζω kann tadeln, beschuldigen oder herabsetzen bedeuten. „Anklagen“ passt zur feindseligen Darstellung vor dem König; die weiteren Bedeutungsnuancen bleiben in der Fußnote erhalten.
- source_word: ἐσίγησεν
  choice: schwieg
  rationale: Der Aorist schildert die ausbleibende Reaktion des Königs knapp als Ereignis. „Schwieg“ ist im Deutschen natürlich und lässt offen, ob das Schweigen bewusst oder lediglich faktisch war.
- source_word: ὁ βασιλεύς
  choice: der König
  rationale: Die übliche und kontextgerechte Wiedergabe des Herrschertitels.
