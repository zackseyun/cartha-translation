base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/013.yaml
  text: And Ptolemy entered Antioch and put on the crown of Asia[a], and he put two crowns on his head, that of Asia and Egypt.
translation:
  language: de
  text: Und Ptolemäus zog in Antiochia ein und setzte sich das Diadem Asiens[a] auf und setzte sich zwei Diademe auf den Kopf, das Asiens und das Ägyptens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Krone Asiens. Das griechische Wort bezeichnet ein königliches Stirnband als Herrschaftszeichen und steht anschließend erneut bei den „zwei Diademen“ Asiens und Ägyptens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: zog … ein
  rationale: Der narrative Aorist bezeichnet das Hineingehen in die Stadt; „zog in Antiochia ein“ ist im historischen Erzählstil natürlich und kann zugleich den öffentlichen Charakter des Einzugs wiedergeben, ohne ihn auszudeuten.
- source_word: περιέθετο
  choice: setzte sich … auf / trug
  rationale: Die mediale Form bezeichnet das Anlegen am eigenen Körper. Beim ersten Vorkommen bewahrt „setzte sich … auf“ die konkrete Handlung; beim zweiten gibt „trug“ idiomatisch den resultierenden Zustand wieder.
- source_word: διάδημα
  choice: Diadem
  rationale: Das griechische Wort bezeichnet das königliche Stirnband als Herrschaftszeichen. „Diadem“ erhält die historische Eigenart genauer als das allgemeinere „Krone“ und lässt sich natürlich im Deutschen verwenden.
- source_word: τῆς Ἀσίας
  choice: Asiens / von Asien
  rationale: Der Text nennt schlicht „Asien“. Eine Präzisierung als Seleukidenreich oder Kleinasien würde die geografisch-politische Bezeichnung interpretierend verengen.
- source_word: δύο διαδήματα
  choice: zwei Diademe
  rationale: Zahlwort und wiederholtes Substantiv heben hervor, dass Ptolemäus die Herrschaftszeichen beider Reiche zugleich trägt.
- source_word: περὶ τὴν κεφαλὴν αὐτοῦ
  choice: auf seinem Kopf
  rationale: Obwohl περί wörtlich „um“ bedeuten kann, ist „auf seinem Kopf“ bei einer königlichen Kopfbedeckung idiomatisches modernes Deutsch.
theological_decisions:
- issue: Symbolische Bedeutung der zwei Diademe
  choice: Die konkrete Handlung des Anlegens und Tragens zweier Diademe wiedergeben
  alternative: Ausdeutend formulieren, Ptolemäus habe die Herrschaft über Asien und Ägypten beansprucht
  rationale: Der politische Herrschaftsanspruch liegt nahe, doch der griechische Text schildert ihn durch eine konkrete symbolische Handlung. Die Übersetzung bewahrt dieses Bild, ohne seine Bedeutung im Haupttext festzulegen.
translation_notes:
  register: Moderne, würdige historische Erzählsprache. „Ptolemäus“ und „Antiochia“ folgen den im Deutschen üblichen Namensformen. Der zweite Satz glättet die griechische Wiederholung leicht, bewahrt aber die konkrete Doppelung der königlichen Herrschaftszeichen.
