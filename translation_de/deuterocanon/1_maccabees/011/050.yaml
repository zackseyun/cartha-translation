base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/050.yaml
  text: Give us your right hands[a], and let the Jews stop fighting against us and the city.
translation:
  language: de
  text: Reich uns die rechte Hand[a], und die Juden sollen aufhören, gegen uns und die Stadt zu kämpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gib uns rechte Hände.“ Das Reichen der rechten Hand war ein Zeichen des Friedens, eines Bündnisses oder der Zusicherung guten Willens.'
    reason: cultural_note
lexical_decisions:
- source_word: Δὸς
  choice: Reiche
  rationale: Der Aoristimperativ von δίδωμι richtet eine unmittelbare Aufforderung an eine einzelne Person. Im Deutschen verbindet sich mit „die Hand“ idiomatisch eher „reichen“ als das wörtliche „geben“.
- source_word: δεξιάς
  choice: die Hand
  rationale: Wörtlich steht der Plural „rechte Hände“. Gemeint ist die konkrete Geste, mit der Frieden, Bündnistreue oder guter Wille zugesichert wird. „Die Hand reichen“ bewahrt dieses Bild in natürlichem modernem Deutsch; Zahl und genauere kulturelle Bedeutung werden in der Fußnote erläutert.
- source_word: παυσάσθωσαν
  choice: sollen aufhören
  rationale: Der Imperativ der dritten Person fordert, dass die Juden ihre fortdauernde Kampfhandlung beenden. „Sollen aufhören“ gibt diese Aufforderung klar und idiomatisch wieder.
- source_word: πολεμοῦντες
  choice: zu kämpfen
  rationale: Das Präsenspartizip bezeichnet eine andauernde feindliche Handlung. Zusammen mit „gegen“ entspricht „kämpfen“ dem Sinn von πολεμέω in natürlichem Deutsch.
- source_word: τὴν πόλιν
  choice: die Stadt
  rationale: Der griechische Text enthält den bestimmten Artikel, aber kein Possessivpronomen. Daher wird nicht ergänzend „unsere Stadt“ übersetzt.
