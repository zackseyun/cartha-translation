base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/047.yaml
  text: And the king called the Jews to his aid[a], and they all gathered to him together; and they spread out in the city, and on that day they killed ten thousand in the city.
translation:
  language: de
  text: Und der König rief die Juden zu Hilfe. Da kamen sie alle zugleich bei ihm zusammen, verteilten sich in der Stadt[a] und töteten an jenem Tag zehntausend Menschen in der Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wurden in der Stadt zerstreut“; gemeint ist hier wahrscheinlich, dass sie sich zum Kampf in der Stadt verteilten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν ... εἰς βοήθειαν
  choice: rief ... zu Hilfe
  rationale: 'Die Wendung bezeichnet den Zweck des Rufens: Der König zog die Juden als Helfer heran. „Zu Hilfe rufen“ ist im Deutschen natürlich und inhaltlich präzise.'
- source_word: ἐπισυνήχθησαν πρὸς αὐτὸν πάντες ἅμα
  choice: da kamen sie alle zugleich bei ihm zusammen
  rationale: „Zusammenkommen“ gibt den passivisch-mittleren Sinn des Verbs wieder; „alle zugleich“ bewahrt die Betonung durch πάντες ἅμα.
- source_word: διεσπάρησαν ἐν τῇ πόλει
  choice: verteilten sich in der Stadt
  rationale: Das Verb bedeutet wörtlich „zerstreut werden/sich zerstreuen“, bezeichnet im militärischen Zusammenhang aber wahrscheinlich das räumliche Ausschwärmen beziehungsweise Verteilen innerhalb der Stadt.
- source_word: ἀπέκτειναν
  choice: töteten
  rationale: Schlichte, moderne Wiedergabe ohne archaische oder wertende Zusätze.
- source_word: εἰς μυριάδας δέκα
  choice: zehntausend Menschen
  rationale: Die griechische Zahlform bezeichnet hier eine Gesamtzahl von zehntausend. „Menschen“ verdeutlicht das im Deutschen notwendige Bezugswort, ohne die Opfer näher zu bestimmen.
