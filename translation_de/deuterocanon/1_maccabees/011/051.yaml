base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/051.yaml
  text: And they threw down their weapons and made peace. And the Jews were honored before the king and before all those in his kingdom, and they returned to Jerusalem with much plunder.
translation:
  language: de
  text: Sie warfen ihre Waffen nieder und schlossen Frieden. Die Juden wurden in den Augen des Königs und aller in seinem Reich geehrt. Dann kehrten sie mit reicher Beute nach Jerusalem zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρριψαν τὰ ὅπλα
  choice: warfen sie ihre Waffen nieder
  rationale: Gibt das bildhafte Verb ἔρριψαν und den Sinn der Entwaffnung beziehungsweise Aufgabe natürlich und quellennah wieder.
- source_word: ἐποίησαν εἰρήνην
  choice: schlossen Frieden
  rationale: Eine geläufige deutsche Wendung für den Abschluss von Frieden; entsprechend dem Griechischen wird kein ausdrückliches Gegenüber ergänzt.
- source_word: ἐδοξάσθησαν
  choice: kamen zu hohem Ansehen
  rationale: Im historischen Zusammenhang bezeichnet das Passiv öffentliche Ehre und Wertschätzung, nicht eine theologische Verherrlichung.
- source_word: ἐναντίον τοῦ βασιλέως
  choice: beim König
  rationale: Drückt idiomatisch aus, dass die Juden in den Augen beziehungsweise in der Einschätzung des Königs Ansehen gewannen.
- source_word: ἐνώπιον πάντων τῶν ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: bei allen Menschen in seinem Reich
  rationale: Gibt den umfassenden Kreis der öffentlichen Anerkennung klar wieder; „Menschen“ verdeutlicht das substantivierte griechische Ausdrucksmuster, ohne dessen Umfang einzuschränken.
- source_word: ἐπέστρεψαν εἰς Ἰερουσαλήμ
  choice: kehrten sie nach Jerusalem zurück
  rationale: Natürliche und genaue Wiedergabe der erzählenden Rückkehrformulierung.
- source_word: σκῦλα πολλά
  choice: mit reicher Beute
  rationale: σκῦλα meint Kriegsbeute; „reiche Beute“ ist modernes, würdevolles Deutsch und gibt die große Menge idiomatisch wieder.
