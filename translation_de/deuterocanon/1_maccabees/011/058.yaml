base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/058.yaml
  text: And he sent him gold vessels and table service[c][b][a], and gave him authority to drink from gold vessels and to be clothed in purple and to wear a gold clasp.
translation:
  language: de
  text: Und er sandte ihm goldene Gefäße[a] und Tafelgerät[b] und verlieh ihm das Recht, aus goldenen Gefäßen zu trinken, Purpur zu tragen und eine goldene Spange[c] zu tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „goldene Gegenstände“ beziehungsweise „Goldgerät“. Das griechische Wort χρυσώματα wird im Vers zweimal gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „Tafelgerät“ wiedergegebene Wort kann auch den Dienst bei Tisch oder möglicherweise eine Dienerschaft bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „einen goldenen Gewandverschluss“ beziehungsweise „eine goldene Brosche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρυσώματα
  choice: goldene Gefäße
  rationale: Der Plural bezeichnet Gegenstände aus Gold. Da dieselbe Bezeichnung unmittelbar darauf für Trinkgefäße verwendet wird, gibt „goldene Gefäße“ den Zusammenhang treffend wieder, ohne die Form auf Becher einzuengen.
- source_word: διακονίαν
  choice: Tafelgerät
  rationale: In der Verbindung mit goldenen Gefäßen und den höfischen Vorrechten liegt eine Ausstattung für den Dienst bei Tisch nahe. Eine Bedeutung wie „Bedienung“ oder „Dienerschaft“ bleibt jedoch möglich und wird in der Fußnote genannt.
- source_word: ἐξουσίαν
  choice: das Recht
  rationale: Gemeint ist eine vom Herrscher gewährte Befugnis beziehungsweise ein höfisches Vorrecht. „Das Recht“ ist im Deutschen natürlich und wahrt den Gedanken der förmlichen Ermächtigung.
- source_word: πίνειν ἐν χρυσώμασιν
  choice: aus goldenen Gefäßen zu trinken
  rationale: Die Wendung bezeichnet das Trinken unter Verwendung goldener Trinkgefäße. „Aus“ gibt den griechischen Gebrauch idiomatisch auf Deutsch wieder.
- source_word: εἶναι ἐν πορφύρᾳ
  choice: Purpur zu tragen
  rationale: Die griechische Wendung meint das Tragen purpurfarbener, rangbezeichnender Kleidung. Die knappe Formulierung ist im Deutschen klar und bewahrt die höfische Symbolik.
- source_word: πόρπην χρυσῆν
  choice: eine goldene Spange
  rationale: πόρπη bezeichnet einen Verschluss oder eine Schmuckspange für ein Gewand. „Spange“ ist historisch und sachlich passend, ohne die genaue Form als Schnalle oder Brosche festzulegen.
