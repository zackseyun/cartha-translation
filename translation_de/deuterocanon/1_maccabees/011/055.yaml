  yaml_path: translation/deuterocanon/1_maccabees/011/055.yaml
  text: And all the forces that Demetrius had dismissed gathered to him[a], and they fought against him; and he fled and was routed.
translation:
  language: de
  text: Da sammelten sich alle Truppen, die Demetrios entlassen hatte,[a] bei Jonatan. Sie kämpften gegen Demetrios, und er floh und wurde in die Flucht geschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weggeschickt hatte“ oder „aus dem Dienst entlassen hatte“. Das griechische Verb kann bedeuten, Truppen aus dem Dienst zu entlassen oder sie aus der eigenen Gegenwart wegzuschicken; der Zusammenhang spricht für eine militärische Entlassung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: sammelten sich … bei ihm
  rationale: Der Aorist Passiv mit πρὸς αὐτόν beschreibt, dass die Truppen bei der zuvor genannten Person zusammenkamen und sich ihr anschlossen. Die deutsche Formulierung ist natürlich und bewahrt den militärischen Zusammenhang.
- source_word: δυνάμεις
  choice: Truppen
  rationale: Im militärischen Kontext bezeichnet δυνάμεις bewaffnete Verbände. „Truppen“ ist im Deutschen genauer und natürlicher als das mehrdeutige „Kräfte“ und weniger weitreichend als „Heere“.
- source_word: ἀπεκρόακεν
  choice: entlassen hatte
  rationale: Das Verb bezeichnet hier wahrscheinlich, dass Demetrios die Truppen aus seinem Dienst beziehungsweise aus seiner Gegenwart entlassen hatte. Das Plusquamperfekt gibt die gegenüber dem Sammeln vorausliegende Handlung wieder.
- source_word: ἐπολέμησαν πρὸς αὐτόν
  choice: Sie kämpften gegen Demetrios
  rationale: πρὸς ist hier adversativ. Die Wiederaufnahme des Namens beseitigt im Deutschen eine missverständliche Folge mehrerer Pronomen, ohne den Bezug inhaltlich zu verändern.
- source_word: ἔφυγεν
  choice: er floh
  rationale: Die knappe Erzählform entspricht dem einfachen Aorist und passt zum Bericht einer Schlacht.
- source_word: ἐτροπώθη
  choice: wurde in die Flucht geschlagen
  rationale: Der militärische Passivgebrauch bezeichnet das Zurückwerfen beziehungsweise die Flucht infolge einer Niederlage. Die Formulierung bewahrt diese spezifische Bedeutung besser als das allgemeinere „wurde besiegt“.
