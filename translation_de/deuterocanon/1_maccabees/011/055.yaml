translation_notes:
  register: 'Moderne, würdige Erzählsprache. „Demetrios“ wird im zweiten Satz statt eines weiteren „ihm“ ausdrücklich genannt, damit der Wechsel des Bezugspunkts klar bleibt: Die entlassenen Truppen sammeln sich bei der zuvor genannten Person, kämpfen dann gegen Demetrios, der flieht und geschlagen wird.'
