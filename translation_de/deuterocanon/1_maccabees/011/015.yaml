base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/015.yaml
  text: And Alexander heard[a], and came against him in war; and Ptolemy marched out and met him with a strong force, and routed him.
translation:
  language: de
  text: Als Alexander davon hörte, zog er gegen ihn zum Kampf. Ptolemäus rückte aus, trat ihm mit starker Streitmacht[a] entgegen und schlug ihn in die Flucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit starker Hand«; eine militärische Redewendung für machtvolles Vorgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: davon hörte
  rationale: Das Verb hat im Griechischen kein ausdrückliches Objekt; im Deutschen verweist „davon“ natürlich auf die zuvor berichteten Ereignisse, ohne deren Inhalt näher festzulegen.
- source_word: ἦλθεν ἐπʼ αὐτὸν ἐν πολέμῳ
  choice: zog er gegen ihn in den Krieg
  rationale: Die Wiedergabe bewahrt sowohl die feindliche Bewegung gegen Ptolemäus als auch den ausdrücklich militärischen Zusammenhang.
- source_word: ἐξήγαγεν
  choice: rückte aus
  rationale: Das Verb bedeutet wörtlich „führte hinaus“; da kein Objekt genannt ist und der Zusammenhang militärisch ist, gibt „rückte aus“ den Vorgang knapp und idiomatisch wieder.
- source_word: ἀπήντησεν αὐτῷ
  choice: trat ihm entgegen
  rationale: Die Formulierung gibt das bewusste Entgegenziehen zur Begegnung wieder und passt natürlich zum militärischen Kontext.
- source_word: ἐν χειρὶ ἰσχυρᾷ
  choice: mit starker Streitmacht
  rationale: Die wörtliche Wendung „mit starker Hand“ ist hier ein Macht- beziehungsweise Militäridiom. „Mit starker Streitmacht“ vermittelt den Sinn im modernen Deutschen, während die Fußnote das griechische Bild bewahrt.
- source_word: ἐτροπώσατο αὐτόν
  choice: schlug ihn in die Flucht
  rationale: Das Verb bezeichnet im Kampf das Zurückwerfen beziehungsweise In-die-Flucht-Schlagen und ist daher genauer als das allgemeinere „besiegte ihn“.
