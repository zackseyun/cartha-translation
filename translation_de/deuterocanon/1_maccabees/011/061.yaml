base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/061.yaml
  text: And he went from there to Gaza[a], and the men of Gaza shut him out; and he encamped around it, and burned its outlying parts with fire[b], and plundered them.
translation:
  language: de
  text: Und er zog von dort nach Gaza, und die Leute von Gaza versperrten ihm den Zugang. Er schlug rings um sie sein Lager auf, steckte die Gebiete rings um sie in Brand[a] und plünderte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck ist schwierig. Er kann Gebiete im Umland, Vororte oder andere Bereiche rings um Gaza bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: zog
  rationale: Der narrative Aorist bezeichnet die Weiterreise; „zog“ ist in einem militärisch geprägten Bericht natürlich und würdevoll.
- source_word: ἀπέκλεισαν
  choice: verschlossen ihm die Tore
  rationale: Das Verb bedeutet, den Zugang zu versperren oder jemanden auszuschließen. Die idiomatische Formulierung verdeutlicht den Vorgang, ohne den Sinn auf eine förmliche Belagerung zu verengen.
- source_word: οἱ ἀπὸ Γάζης
  choice: die Leute von Gaza
  rationale: Wörtlich „die aus Gaza“. Die inklusive und natürliche Formulierung lässt offen, ob speziell die Verteidiger oder allgemein die Einwohner gemeint sind.
- source_word: περιεκάθισεν περὶ αὐτήν
  choice: lagerte er sich rings um die Stadt
  rationale: Die Wendung beschreibt wörtlich ein Sich-Niederlassen rings um die Stadt und deutet im Kontext eine Belagerung an, ohne diese Deutung an die Stelle des griechischen Bildes zu setzen.
- source_word: τὰ περίπολα αὐτῆς
  choice: ihre Außenbezirke
  rationale: Der schwierige Ausdruck bezeichnet hier wahrscheinlich außerhalb oder rings um Gaza gelegene Bereiche. „Außenbezirke“ ist verständlich und bewahrt die räumliche Unbestimmtheit annähernd.
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: steckte ... in Brand
  rationale: Natürliches modernes Deutsch für die emphatische griechische Feuerformel; eine wörtliche Doppelung mit „Feuer“ wäre im Deutschen unnötig schwerfällig.
- source_word: ἐσκύλευσεν
  choice: plünderte
  rationale: Ein geläufiger militärischer Ausdruck für das Erbeuten und Ausrauben nach einem Angriff.
