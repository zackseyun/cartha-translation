  text: And those in the city saw that the Jews had gained control of the city as they wished, and they lost heart, and they cried out to the king with a plea, saying,
translation:
  language: de
  text: 'Und die Leute in der Stadt sahen, dass die Juden die Stadt nach ihrem Willen unter ihre Kontrolle gebracht hatten. Sie verloren den Mut und riefen den König flehentlich an:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ὑπὸ τῆς πόλεως
  choice: die Bewohner der Stadt
  rationale: Die ungewöhnliche Wendung bezeichnet im Zusammenhang die Menschen beziehungsweise die Partei innerhalb der Stadt; die deutsche Wiedergabe benennt den Referenten natürlich, ohne das ὑπό räumlich als „unter“ misszuverstehen.
- source_word: κατεκράτησαν ... τῆς πόλεως
  choice: die Stadt ... unter ihre Kontrolle gebracht hatten
  rationale: κρατέω mit Genitiv bezeichnet hier das Erlangen beziehungsweise Ausüben von Herrschaft über die Stadt. Die resultative Bedeutung wird im Deutschen idiomatisch wiedergegeben, ohne zusätzliche Gewalt anzudeuten.
- source_word: ὡς ἠβούλοντο
  choice: ganz nach ihrem Willen
  rationale: Die Wendung besagt, dass die Juden die Kontrolle in dem von ihnen beabsichtigten Maß erlangt hatten. „Ganz“ vermittelt in diesem Kontext die erfolgreiche Verwirklichung ihres Willens.
- source_word: ἠσθένησαν ταῖς διανοίαις αὐτῶν
  choice: Da verloren sie den Mut
  rationale: Wörtlich wurden sie „in ihren Gedanken/Gesinnungen schwach“. Die idiomatische deutsche Formulierung bewahrt den Sinn eines inneren Zusammenbruchs oder schwindenden Widerstandswillens.
- source_word: ἐκέκραξαν πρὸς τὸν βασιλέα μετὰ δεήσεως
  choice: riefen den König flehentlich an
  rationale: κράζω bewahrt die Intensität des Rufens, während „flehentlich“ die Art des Rufes gemäß μετὰ δεήσεως ausdrückt. „Anrufen“ ist hier im gewöhnlichen Sinn eines dringenden Appells gemeint.
- source_word: λέγοντες
  choice: ':'
  rationale: Das Partizip leitet die im nächsten Vers folgende direkte Rede ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion knapper als „und sagten“.
