base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/028.yaml
  text: And Jonathan asked the king to make Judea[a], the three toparchies, and Samaria tax-free, and he promised him three hundred talents.
translation:
  language: de
  text: Und Jonatan bat den König, Judäa, die drei Toparchien[a] und Samaria von Steuern zu befreien, und versprach ihm dreihundert Talente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Toparchie war ein Verwaltungsbezirk. Das Griechische verwendet hier einen technischen Begriff für ein Gebiet mit eigener Verwaltung.
    reason: cultural_note
lexical_decisions:
- source_word: ἠξίωσεν
  choice: bat
  rationale: Das Verb bezeichnet hier eine förmliche Bitte an den König. „Bat“ ist natürlich und wahrt den Abstand zu dem stärkeren „forderte“.
- source_word: ποιῆσαι … ἀφορολόγητον
  choice: von Steuern zu befreien
  rationale: Die idiomatische deutsche Wendung gibt den bewirkten Status der Steuerfreiheit präzise wieder.
- source_word: τὰς τρεῖς τοπαρχίας
  choice: die drei Toparchien
  rationale: Der technische antike Verwaltungsbegriff bleibt erhalten und wird in einer Fußnote knapp erklärt.
- source_word: τὴν Σαμαρῖτιν
  choice: Samaria
  rationale: „Samaria“ ist die geläufige deutsche Bezeichnung für das hier gemeinte Gebiet.
- source_word: ἐπηγγείλατο
  choice: versprach
  rationale: Die mediale Verbform bezeichnet eine Zusage beziehungsweise Verpflichtung; „versprach“ ist im Kontext klar und idiomatisch.
- source_word: τάλαντα τριακόσια
  choice: dreihundert Talente
  rationale: Die antike Gewichts- und Geldeinheit wird beibehalten, da eine Umrechnung in moderne Währung spekulativ wäre.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am griechischen Zusammenhang, wird aber mit der idiomatischen Wendung „von Steuern befreien“ natürlich formuliert. Der technische Begriff „Toparchie“ wird nicht zu dem allgemeineren „Bezirk“ eingeebnet.
