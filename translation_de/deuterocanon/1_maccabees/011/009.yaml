base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/009.yaml
  text: And he sent envoys to King Demetrius[a], saying, “Come, let us make a covenant with one another, and I will give you my daughter whom Alexander has[b], and you will reign over your father's kingdom.”
translation:
  language: de
  text: 'Und er sandte Gesandte zu König Demetrius und ließ ihm sagen: »Komm, lass uns miteinander einen Bund[a] schließen. Ich werde dir meine Tochter geben, die Alexander hat[b], und du wirst über das Königreich deines Vaters herrschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »miteinander einen Vertrag schließen«. Das griechische Wort διαθήκη bezeichnet einen formellen Pakt und wird häufig mit »Bund« übersetzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »meine Tochter, die Alexander hat«. Gemeint ist im Zusammenhang die Tochter, die Alexander als Ehefrau hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Der narrative Aorist wird im Deutschen natürlich mit dem Präteritum wiedergegeben.
- source_word: πρέσβεις
  choice: Gesandte
  rationale: Das Wort bezeichnet hier offizielle diplomatische Vertreter, nicht bloß gewöhnliche Boten.
- source_word: λέγων
  choice: und ließ ihm sagen
  rationale: Die deutsche Konstruktion gibt idiomatisch wieder, dass die Gesandten die folgende Botschaft in seinem Auftrag übermitteln.
- source_word: συνθώμεθα ... διαθήκην
  choice: wir wollen ... einen Bund schließen
  rationale: Die feste Verbindung bezeichnet den Abschluss eines formellen Pakts. »Bund« bewahrt das Gewicht von διαθήκη; »Vertrag« ist im politischen Zusammenhang ebenfalls möglich.
- source_word: πρὸς ἑαυτούς
  choice: miteinander
  rationale: Dies gibt den reziproken Sinn knapp und in natürlichem modernem Deutsch wieder.
- source_word: δώσω σοι τὴν θυγατέρα μου
  choice: Ich werde dir meine Tochter geben
  rationale: Die direkte Formulierung bewahrt den Charakter einer dynastischen Heiratsvereinbarung, ohne zusätzliche Erläuterungen in den Text einzufügen.
- source_word: ἣν ἔχει Ἀλέξανδρος
  choice: die Alexander hat
  rationale: Die Übersetzung bleibt bei der bewusst knappen Formulierung des Griechischen. Der Zusammenhang zeigt, dass Alexander sie gegenwärtig als seine Frau hat.
- source_word: βασιλεύσεις
  choice: du wirst ... herrschen
  rationale: Das Futur bezeichnet die Ausübung der Königsherrschaft; »herrschen« ist im Deutschen natürlich und verbindet sich gut mit »über«.
- source_word: τῆς βασιλείας τοῦ πατρός σου
  choice: über das Königreich deines Vaters
  rationale: Der Genitiv bei βασιλεύω wird idiomatisch durch »über« wiedergegeben; βασιλεία bezeichnet hier das ererbte Herrschaftsgebiet.
