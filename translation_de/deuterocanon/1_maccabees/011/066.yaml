  text: And they asked him to receive pledges from them[a], and he gave them; then he drove them out from there and took the city, and stationed a garrison in it.
translation:
  language: de
  text: Und sie baten ihn, ihre verbindlichen Zusicherungen anzunehmen[a], und er gab ihnen seinerseits solche Zusicherungen. Dann vertrieb er sie von dort, nahm die Stadt ein und stationierte eine Besatzung in ihr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „rechte Hände anzunehmen“. Die Wendung bezeichnet das Austauschen verbindlicher Zusicherungen des Friedens oder der Treue, wahrscheinlich bekräftigt durch das Reichen der rechten Hand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν
  choice: sie baten
  rationale: Im Zusammenhang mit dem ergänzenden Infinitiv bezeichnet das Verb eine Bitte oder ein Ersuchen; „baten“ gibt den Ton wieder, ohne die stärkere Bedeutung „forderten“ einzutragen.
- source_word: δεξιὰς λαβεῖν
  choice: ihre Treueversprechen anzunehmen
  rationale: Wörtlich geht es um das „Nehmen rechter Hände“. Die feste Wendung bezeichnet die Entgegennahme verbindlicher Zusicherungen, vermutlich durch das Reichen der rechten Hand. Die idiomatische Wiedergabe bleibt durch eine Fußnote transparent.
- source_word: ἔδωκεν αὐτοῖς
  choice: er gab sie ihnen
  rationale: Die knappe Ellipse des Griechischen wird bewahrt; das Pronomen greift die zuvor genannten Treueversprechen auf.
- source_word: ἐξέβαλεν
  choice: vertrieb er sie
  rationale: „Vertreiben“ gibt die gewaltsame Entfernung natürlich und mit der nötigen Stärke wieder.
- source_word: κατελάβετο
  choice: nahm die Stadt ein
  rationale: Das Medium bezeichnet hier die Inbesitznahme der Stadt; „nahm … ein“ ist im militärischen Erzählzusammenhang prägnant und idiomatisch.
- source_word: φρουράν
  choice: eine Besatzung
  rationale: Im militärischen Zusammenhang bezeichnet φρουρά eine zur Sicherung stationierte Truppe; „Besatzung“ ist dafür im Deutschen treffend.
- source_word: ἔθετο ἐπʼ αὐτὴν
  choice: legte … hinein
  rationale: Die Formulierung gibt das Stationieren einer Besatzung in beziehungsweise über der Stadt in natürlichem Deutsch wieder, ohne zusätzliche Einzelheiten einzutragen.
