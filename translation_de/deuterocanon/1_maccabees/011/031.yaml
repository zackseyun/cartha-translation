  text: We have also written to you a copy of the letter that Lasthenes wrote to our kinsman concerning you[a], so that you may see it.
translation:
  language: de
  text: Eine Abschrift des Briefes, den Lasthenes unserem Verwandten[a] über euch schrieb, haben wir auch euch schriftlich zukommen lassen, damit ihr sie einsehen könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseren Angehörigen“. Das griechische Wort kann einen leiblichen Verwandten bezeichnen, in höfisch-diplomatischer Sprache aber auch einen besonders verbundenen oder geehrten Angehörigen beziehungsweise Genossen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀντίγραφον τῆς ἐπιστολῆς
  choice: Eine Abschrift des Briefes
  rationale: ἀντίγραφον bezeichnet eine Abschrift oder Kopie eines Schriftstücks. „Abschrift“ passt zum amtlich-diplomatischen Zusammenhang und gibt die Verbindung mit τῆς ἐπιστολῆς natürlich wieder.
- source_word: ἧς ἔγραψεν Λασθένεις
  choice: den Lasthenes … schrieb
  rationale: Das Relativpronomen bezieht sich grammatisch auf ἐπιστολῆς; im Deutschen wird der Brief als Bezugswort aufgenommen. ἔγραψεν bedeutet schlicht „schrieb“.
- source_word: τῷ συγγενεῖ ἡμῶν
  choice: an unseren Verwandten[a]
  rationale: συγγενής kann einen leiblichen Verwandten, einen Angehörigen oder in höfisch-diplomatischer Sprache einen besonders verbundenen beziehungsweise geehrten Gefährten bezeichnen. „Verwandten“ bewahrt die Grundbedeutung, während die Fußnote die kontextuelle Weite offenhält.
- source_word: περὶ ὑμῶν
  choice: über euch
  rationale: περί mit Genitiv bedeutet hier am unmittelbarsten „über euch“ beziehungsweise „euch betreffend“, ohne die stärkere Deutung „zu euren Gunsten“ einzutragen.
- source_word: γεγράφαμεν καὶ πρὸς ὑμᾶς
  choice: haben wir auch euch geschickt
  rationale: Wörtlich steht „haben wir auch an euch geschrieben“. Da das Objekt eine Abschrift ist, bezeichnet die Wendung idiomatisch deren schriftliche Ausfertigung und Übermittlung. „geschickt“ ergibt im Deutschen den natürlichen dokumentarischen Sinn.
- source_word: ὅπως ἰδῆτε
  choice: damit ihr ihn einsehen könnt
  rationale: Die Konstruktion drückt einen Zweck aus. „einsehen“ bewahrt den visuellen Bezug von ἰδῆτε und passt dazu, dass die Empfänger den beigefügten Brief zur Kenntnis nehmen sollen; „ihn“ bezieht sich auf den Brief.
