lexical_decisions:
- source_word: Ἀλέξανδρος δὲ ὁ βασιλεὺς
  choice: König Alexander aber
  rationale: Gibt Namen, Titel und die weiterführend-kontrastive Partikel δέ in natürlicher deutscher Wortstellung wieder.
- source_word: ἦν ἐν Κιλικίᾳ
  choice: hielt sich in Kilikien auf
  rationale: Drückt den örtlichen Aufenthalt idiomatischer aus als das formal mögliche „war in Kilikien“.
- source_word: κατὰ τοὺς καιροὺς ἐκείνους
  choice: zu jener Zeit
  rationale: Natürliche deutsche Zeitangabe; der griechische Plural bezeichnet hier den damaligen Zeitraum, ohne dass im Deutschen ein Plural erforderlich ist.
- source_word: ὅτι
  choice: weil
  rationale: Kennzeichnet klar den im griechischen Text angegebenen Grund für Alexanders Aufenthalt.
- source_word: οἱ ἀπὸ τῶν τόπων ἐκείνων
  choice: die Menschen aus jenen Gegenden
  rationale: Gibt die substantivierte Personenbezeichnung verständlich wieder und bewahrt den geografischen Bezug sowie den Plural.
- source_word: ἀπεστάτουν
  choice: lehnten sich auf
  rationale: Erfasst den fortdauernden Vorgang des Abfalls beziehungsweise der Rebellion im Imperfekt, ohne die politische Bedeutung unnötig zu präzisieren.
