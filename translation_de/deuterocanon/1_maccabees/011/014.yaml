  source_fidelity: Der Text gibt den griechischen Satz vollständig und zutreffend wieder. „König Alexander aber“ bildet Ἀλέξανδρος δὲ ὁ βασιλεύς natürlich ab; „hielt sich ... auf“ ist für ἦν ἐν idiomatisch und sachlich angemessen. „Weil“ gibt ὅτι als kausale Begründung wieder, und „sich ... auflehnten“ wahrt den imperfektischen, fortdauernden Charakter von ἀπεστάτουν, ohne eine nicht im Text stehende Zielinstanz zu ergänzen.
  naturalness: Modernes, flüssiges Standarddeutsch mit würdigem, erzählendem Register. „Zu jener Zeit“ ist eine natürliche deutsche Wiedergabe des griechischen temporalen Plurals; ein deutscher Plural wäre hier unnötig schwerfällig.
  terminology: „Kilikien“ und „König Alexander“ sind etablierte deutsche Formen. „Menschen aus jenen Gegenden“ macht die im Griechischen substantivierte Personenbezeichnung verständlich, ohne den Ortsbezug aufzugeben. Die Fußnote hält die wörtlichere, elliptische Ausdrucksweise transparent fest.
