  text: And Jonathan met the king at Joppa with honor, and they greeted one another, and they spent the night there.
translation:
  language: de
  text: Und Jonatan traf den König in Joppe mit Ehren; sie begrüßten einander und übernachteten dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήντησεν
  choice: traf
  rationale: Der Aorist bezeichnet hier das Zusammentreffen Jonatans mit dem König; „traf“ ist natürlich und legt nicht unnötig fest, wer die Begegnung veranlasste.
- source_word: εἰς Ἰόππην
  choice: in Joppe
  rationale: Bei einem Verb der Begegnung bezeichnet εἰς mit dem Ortsnamen hier idiomatisch den Ort des Zusammentreffens.
- source_word: μετὰ δόξης
  choice: mit Ehren
  rationale: δόξα kann Herrlichkeit, Glanz oder Ehre bezeichnen. Im diplomatischen Zusammenhang liegt eine ehrenvolle, feierliche Aufnahme nahe; die feste deutsche Wendung „mit Ehren“ gibt dies knapp wieder.
- source_word: ἠσπάσαντο ἀλλήλους
  choice: sie begrüßten einander
  rationale: ἀσπάζομαι bezeichnet gewöhnlich das Grüßen oder Willkommenheißen; „begrüßten einander“ bewahrt die Gegenseitigkeit, ohne eine Umarmung vorauszusetzen.
- source_word: ἐκοιμήθησαν
  choice: übernachteten
  rationale: Das wörtliche „sie schliefen“ bezeichnet im Reisebericht idiomatisch das Verbringen der Nacht; „übernachteten“ ist im Deutschen präzise und natürlich.
