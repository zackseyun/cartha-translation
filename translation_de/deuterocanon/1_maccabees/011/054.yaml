base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/054.yaml
  text: After these things Tryphon returned[a], and Antiochus with him, a younger boy[b]; and he became king and put on the crown.
translation:
  language: de
  text: Danach kehrte Tryphon zurück, und Antiochus mit ihm, ein jüngerer Knabe[a]. Er wurde König und setzte sich die Krone[b] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »ein sehr junger Knabe« oder »ein jüngeres Kind«. Der griechische Ausdruck παιδάριον νεώτερον betont die Jugend des Antiochus; νεώτερον ist formal ein Komparativ.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Diadem«. Gemeint ist das königliche Stirnband als Zeichen der Herrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Danach
  rationale: Eine natürliche deutsche Zeitangabe, die den erzählerischen Übergang knapp und vollständig wiedergibt.
- source_word: ἀπέστρεψεν
  choice: kehrte … zurück
  rationale: Gibt die übliche Bedeutung „umkehren, zurückkehren“ idiomatisch wieder.
- source_word: παιδάριον νεώτερον
  choice: ein noch sehr junger Knabe
  rationale: „Knabe“ bezeichnet das männliche Kind; „noch sehr jung“ gibt die hervorgehobene Jugend wieder, ohne ein genaues Alter festzulegen. Die formal vergleichende Bedeutung von νεώτερον bleibt in der Fußnote sichtbar.
- source_word: ἐβασίλευσεν
  choice: Er wurde König
  rationale: Im Zusammenhang mit dem anschließenden Aufsetzen der Krone bezeichnet der Aorist hier am ehesten den Antritt der Königsherrschaft.
- source_word: ἐπέθετο διάδημα
  choice: setzte sich die Krone auf
  rationale: Die reflexive Form gibt den medialen Sinn von ἐπέθετο wieder. „Krone“ ist im heutigen Deutsch verständlicher als „Diadem“; die genauere Sachbezeichnung wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von ἐβασίλευσεν im Kontext
  choice: Er wurde König
  alternative: Er herrschte als König
  rationale: Das Verb kann sowohl das Herrschen als auch den Beginn der Königsherrschaft bezeichnen. Die Abfolge mit dem Aufsetzen der Krone spricht hier für die ingressiv verstandene Wiedergabe, ohne den Herrschaftsanspruch darüber hinaus zu bewerten.
- issue: Königliches Insigne διάδημα
  choice: Krone
  alternative: Diadem
  rationale: „Krone“ vermittelt heutigen Lesern unmittelbar die königliche Funktion. „Diadem“ ist lexikalisch genauer, kann im modernen Deutsch jedoch bloß an ein Schmuckstück denken lassen; deshalb wird es in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzfolge wurde zur besseren Verständlichkeit in drei kurze Sätze gegliedert. „Knabe“ wahrt den historischen Erzählton, während die Fußnote die Mehrdeutigkeit der Altersangabe offenlegt.
