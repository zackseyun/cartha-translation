base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/037.yaml
  text: Now then[a], take care to make a copy of these things, and let it be given to Jonathan, and let it be placed on the holy mountain in a prominent place.
translation:
  language: de
  text: Sorgt nun dafür, dass eine Abschrift davon angefertigt und Jonatan übergeben wird. Sie soll auf dem heiligen Berg an einem hervorgehobenen Ort[a] aufgestellt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an einem gut sichtbaren Ort«. Der griechische Ausdruck kann einen auffälligen, öffentlich wahrnehmbaren oder besonders gekennzeichneten Ort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: nun
  rationale: Die Verbindung leitet aus dem Vorangehenden eine konkrete Anweisung ab. „Nun“ gibt diesen Übergang im Deutschen natürlich wieder; der Folgerungscharakter wird durch den Satz- und Handlungskontext mitgetragen.
- source_word: ἐπιμελεῖσθε τοῦ ποιῆσαι
  choice: Sorgt dafür, dass … angefertigt wird
  rationale: Der Imperativ fordert sorgfältige Veranlassung, nicht zwingend eigenhändige Ausführung. Diese Formulierung ist idiomatisch, klar und wahrt den amtlichen Weisungston.
- source_word: τούτων
  choice: davon
  rationale: Das Pronomen verweist auf den zuvor genannten schriftlichen Inhalt. „Davon“ bewahrt den Rückbezug, ohne den Gegenstand enger als der griechische Text zu bestimmen.
- source_word: ἀντίγραφον
  choice: eine Abschrift
  rationale: Im administrativen Zusammenhang bezeichnet das Wort eine schriftliche Kopie. „Abschrift“ ist präziser als das allgemeinere „Kopie“ und in modernem Deutsch weiterhin geläufig.
- source_word: δοθήτω Ἰωνάθαν
  choice: Jonatan übergeben wird
  rationale: Der passive Imperativ bezeichnet die förmliche Aushändigung an Jonatan. Die koordinierte deutsche Passivkonstruktion erhält den Anweisungscharakter.
- source_word: τεθήτω
  choice: soll … aufgestellt werden
  rationale: Der passive Imperativ verlangt die offizielle Platzierung der Abschrift. „Aufgestellt“ passt zu einem öffentlich sichtbaren Dokument, ohne dessen genaue materielle Form festzulegen.
- source_word: ἐν ὄρει τῷ ἁγίῳ
  choice: auf dem heiligen Berg
  rationale: Bei einer topografischen Ortsangabe wird ἐν im Deutschen idiomatisch mit „auf“ wiedergegeben. Die Übersetzung lässt die im Kontext naheliegende nähere Identifikation unausgesprochen.
- source_word: ἐν τόπῳ ἐπισήμῳ
  choice: an einem hervorgehobenen Ort
  rationale: ἐπίσημος kann einen auffälligen, kenntlich gemachten oder bedeutenden Ort bezeichnen. „Hervorgehoben“ bewahrt diese Bedeutungsbreite besser als eine ausschließlich auf Sichtbarkeit festgelegte Wiedergabe.
