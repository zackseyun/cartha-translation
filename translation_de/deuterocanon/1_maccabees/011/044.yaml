  yaml_path: translation/deuterocanon/1_maccabees/011/044.yaml
  text: And Jonathan sent three thousand men, mighty in their strength, to Antioch, and they came to the king, and the king rejoiced at their arrival.
translation:
  language: de
  text: Und Jonatan sandte dreitausend Männer von großer Stärke nach Antiochia. Sie kamen zum König, und der König freute sich über ihre Ankunft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über ihr Herankommen“ oder „darüber, dass sie kamen“. Das griechische Wort kann ein Herankommen oder Anrücken bezeichnen; hier ist wahrscheinlich die Ankunft von Jonatans Männern beim König gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Die übliche und natürliche deutsche Wiedergabe des erzählenden Verbs für das Aussenden von Personen.
- source_word: ἄνδρας τρισχιλίους
  choice: dreitausend Männer
  rationale: Gibt den griechischen Ausdruck unmittelbar wieder; der militärische Zusammenhang rechtfertigt nicht, das allgemeinere ἄνδρας ausdrücklich zu „Soldaten“ zu verengen.
- source_word: δυνατοὺς ἰσχύι αὐτῶν
  choice: die durch ihre Kraft stark waren
  rationale: Bewahrt die betonte, im Griechischen leicht redundante Verbindung von Fähigkeit beziehungsweise Stärke und Kraft, bleibt dabei aber in modernem Deutsch verständlich.
- source_word: εἰς Ἀντιοχίαν
  choice: nach Antiochia
  rationale: Bei einer Bewegung zu einer Stadt ist „nach“ die idiomatische deutsche Entsprechung.
- source_word: ἦλθοσαν πρὸς τὸν βασιλέα
  choice: Sie kamen zum König
  rationale: Direkte und natürliche Wiedergabe der Bewegung auf den König zu.
- source_word: ηὐφράνθη
  choice: freute sich
  rationale: Gibt die bezeichnete Freude in natürlichem, würdigem Gegenwartsdeutsch wieder.
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: über ihre Ankunft
  rationale: Im Zusammenhang bezeichnet ἔφοδος am ehesten das Herankommen beziehungsweise Eintreffen der Männer, nicht einen Angriff.
