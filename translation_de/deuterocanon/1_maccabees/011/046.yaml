base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/046.yaml
  text: And the king fled into the court[b][a], and the men of the city seized the passages of the city and began to fight.
translation:
  language: de
  text: Und der König floh in den Hof[a], und die Leute aus der Stadt nahmen die Durchgänge der Stadt[b] ein und begannen zu kämpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Innenhof“. Das griechische Wort kann den Hofbereich eines Palastes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Zugänge“ oder „die Verkehrswege der Stadt“. Das griechische Wort kann Durchgänge, Wege oder Zugangsstellen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: floh
  rationale: Der Aorist von φεύγω bezeichnet hier die Flucht aus einer Gefahr; „floh“ ist knapp, natürlich und gibt die Dringlichkeit wieder.
- source_word: αὐλήν
  choice: Palasthof
  rationale: αὐλή kann einen Hof beziehungsweise Innenhof bezeichnen und im königlichen Zusammenhang den Hofbereich des Palastes meinen. „Palasthof“ vermeidet die im Deutschen mögliche institutionelle Bedeutung von „Hof“.
- source_word: κατελάβοντο
  choice: brachten … unter ihre Kontrolle
  rationale: Die mediale Form bezeichnet hier das Inbesitznehmen oder Besetzen. Diese Wiedergabe ist im militärischen Zusammenhang klar und lässt offen, ob die Wege erobert oder lediglich besetzt wurden.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: die Leute aus der Stadt
  rationale: Die Formulierung bedeutet wörtlich „die aus der Stadt“. „Die Leute aus der Stadt“ bleibt geschlechtsneutral und behauptet nicht ausdrücklich, dass ausschließlich Männer handelten.
- source_word: τὰς διόδους τῆς πόλεως
  choice: die Zugänge der Stadt
  rationale: δίοδος kann Durchgänge, Verkehrswege oder Zugangswege bezeichnen. „Zugänge“ passt zum militärischen Kontext, ohne die Stellen ausdrücklich als Tore festzulegen; die Bedeutungsbreite wird in einer Fußnote kenntlich gemacht.
- source_word: ἤρξαντο ἐκπολεμεῖν
  choice: begannen zu kämpfen
  rationale: Die Konstruktion bezeichnet den Beginn bewaffneter Kampfhandlungen. „Begannen zu kämpfen“ ist natürliches modernes Deutsch und bewahrt die knappe Aussage.
