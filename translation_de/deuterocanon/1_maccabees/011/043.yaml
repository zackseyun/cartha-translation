base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/043.yaml
  text: Now then[a], you will do well to send us men who will fight alongside me, because all my forces have deserted.
translation:
  language: de
  text: Nun denn, du wirst gut daran tun, uns Männer zu schicken, die an meiner Seite kämpfen,[a] denn alle meine Streitkräfte sind von mir abgefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die mit mir als Verbündete kämpfen“; das griechische Verb kann militärische Unterstützung im Bündnis bezeichnen und ist hier als Kampf an der Seite des Sprechers wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun also
  rationale: Die Verbindung kennzeichnet sowohl den Übergang als auch die Folgerung und leitet die dringliche Aufforderung natürlich ein.
- source_word: ὀρθῶς ποιήσεις
  choice: wirst du gut daran tun
  rationale: Die idiomatische Wendung empfiehlt eine konkrete Handlung; diese deutsche Formulierung wahrt den höflich-auffordernden Ton.
- source_word: ἀποστείλας ἡμῖν
  choice: uns … zu schicken
  rationale: Das Aoristpartizip bezeichnet hier die Handlung, mit der der Adressat gut handeln wird; der Dativ ἡμῖν wird als indirektes Objekt wiedergegeben.
- source_word: ἄνδρας
  choice: Männer
  rationale: Der griechische Text verwendet den allgemeinen Ausdruck für Männer, nicht ausdrücklich einen militärischen Fachbegriff; ihre Aufgabe folgt im Relativsatz.
- source_word: οἳ συμμαχήσουσίν μοι
  choice: die an meiner Seite kämpfen
  rationale: Das Verb bezeichnet militärische Unterstützung als Verbündete. Die Formulierung gibt den konkreten Zusammenhang natürlich wieder, ohne die mögliche Bündnisnuance zu verschweigen.
- source_word: ἀπέστησαν
  choice: sind von mir abgefallen
  rationale: Das Verb beschreibt, dass sich die Streitkräfte vom Sprecher losgesagt beziehungsweise ihn verlassen haben. „Abgefallen“ bewahrt die Breite zwischen Abwendung, Desertion und Aufstand.
- source_word: πᾶσαι αἱ δυνάμεις μου
  choice: alle meine Streitkräfte
  rationale: δυνάμεις bezeichnet im Zusammenhang die militärischen Kräfte des Sprechers; „Streitkräfte“ wahrt die Breite des Ausdrucks.
