base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/033.yaml
  text: To the nation of the Jews[a], our friends, who also maintain what is right toward us, we have decided to do good, because of their goodwill toward us.
translation:
  language: de
  text: Dem Volk der Juden, unseren Freunden, die auch das uns gegenüber Rechte wahren,[a] haben wir beschlossen, Gutes zu tun, weil sie uns wohlgesinnt sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die auch ihre Verpflichtungen uns gegenüber einhalten«. Wörtlich lautet die griechische Wendung: »die das uns gegenüber Gerechte wahren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: dem Volk der Juden
  rationale: Der Dativ bezeichnet den Empfänger des beschlossenen Wohltuns. »Volk« gibt ἔθνος in diesem politischen Zusammenhang natürlich wieder; »der Juden« bewahrt die griechische Genitivkonstruktion.
- source_word: φίλοις ἡμῶν
  choice: unseren Freunden
  rationale: Die appositionelle Bezeichnung wird direkt und idiomatisch wiedergegeben.
- source_word: συντηροῦσι
  choice: die auch … wahren
  rationale: Das Partizip bezeichnet fortdauerndes Einhalten oder Bewahren. »Wahren« passt zu dem moralisch-rechtlichen Objekt und gibt den anhaltenden Charakter wieder.
- source_word: τὰ πρὸς ἡμᾶς δίκαια
  choice: das uns gegenüber Rechte
  rationale: Die Formulierung hält die ungewöhnlich offene Bedeutung von »die gerechten/rechten Dinge in Bezug auf uns« fest, ohne sie eindeutig auf vertragliche Pflichten zu verengen.
- source_word: ἐκρίναμεν
  choice: haben wir beschlossen
  rationale: Im Stil eines königlichen Schreibens bezeichnet das Verb eine offizielle Entscheidung; »beschlossen« ist würdig und präzise.
- source_word: ἀγαθοποιῆσαι
  choice: Gutes zu tun
  rationale: Die breite Bedeutung des Infinitivs bleibt erhalten, ohne die konkrete Art der Begünstigung vorwegzunehmen.
- source_word: χάριν
  choice: weil
  rationale: Die Präposition leitet hier den Grund der Entscheidung ein. Die kausale Nebensatzkonstruktion klingt im modernen Deutschen natürlicher als eine substantivische Wendung.
- source_word: τῆς ἑαυτῶν εὐνοίας πρὸς ἡμᾶς
  choice: sie uns wohlgesinnt sind
  rationale: Die verbale Formulierung gibt εὔνοια als wohlwollende beziehungsweise loyale Haltung natürlich wieder und vermeidet das schwerfällige »wegen ihres Wohlwollens uns gegenüber«.
