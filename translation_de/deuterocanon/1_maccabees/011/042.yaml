base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/042.yaml
  text: And Demetrius sent to Jonathan[a], saying, “Not only will I do these things for you and for your nation, but I will greatly honor you and your nation, if I find a suitable opportunity.”
translation:
  language: de
  text: 'Und Demetrius sandte Jonatan die Botschaft: »Nicht nur das werde ich für dich und dein Volk tun, sondern ich werde dich und dein Volk mit großen Ehren auszeichnen,[a] wenn sich mir eine günstige Gelegenheit bietet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »mit Ehre ehren«; eine nachdrückliche Ausdrucksweise.'
    reason: Die griechische Verbindung δόξῃ δοξάσω verwendet verwandte Wörter, deren Wiederholung im Deutschen erklärungsbedürftig ist.
lexical_decisions:
- source_word: ἀπέστειλεν Δημήτριος πρὸς Ἰωνάθαν λέγων
  choice: Demetrius sandte Jonatan die Botschaft
  rationale: Die Formulierung gibt das im Griechischen elliptisch ausgedrückte Senden einer Mitteilung in natürlichem Deutsch wieder; λέγων leitet ihren Wortlaut ein.
- source_word: Οὐ μόνον ταῦτα ποιήσω σοι καὶ τῷ ἔθνει σου
  choice: Nicht nur das werde ich für dich und dein Volk tun
  rationale: Bewahrt die hervorgehobene Satzstellung und gibt ἔθνος im Kontext der jüdischen Volksgemeinschaft natürlich mit „Volk“ wieder.
- source_word: ἀλλʼ ἢ δόξῃ δοξάσω
  choice: sondern ich werde … mit großen Ehren auszeichnen
  rationale: Die Verbindung aus dem verwandten Substantiv und Verb ist eine emphatische Ausdrucksweise. „Mit großen Ehren auszeichnen“ wahrt sowohl den Ehrbegriff als auch die Verstärkung, ohne im Deutschen unnatürlich zu klingen.
- source_word: σε καὶ τὸ ἔθνος σου
  choice: dich und dein Volk
  rationale: Erhält den Parallelismus und den gemeinschaftlich-politischen Sinn von ἔθνος.
- source_word: ἐὰν εὐκαιρίας τύχω
  choice: wenn sich mir eine günstige Gelegenheit bietet
  rationale: τύχω mit Genitiv bezeichnet das Erlangen oder Antreffen einer Gelegenheit; die deutsche Wendung gibt εὐκαιρία und den bedingten Charakter idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und feierlich; „Volk“ ist für die angesprochene nationale Gemeinschaft natürlicher als „Nation“. Der Fußnotenmarker steht unmittelbar bei der idiomatisch wiedergegebenen emphatischen Wendung.
