  text: Und an jenem Tag fielen dreitausend Mann aus den Reihen der Fremdvölker; Jonatan kehrte nach Jerusalem zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσον
  choice: fielen
  rationale: Das Verb bedeutet wörtlich „fielen“ und dient hier als übliche Wendung für Gefallene im Kampf. Die Wiedergabe bewahrt den militärischen Ton, ohne die genaue Todesart näher zu bestimmen.
- source_word: ἐκ τῶν ἀλλοφύλων
  choice: aus den Reihen der Fremdvölker
  rationale: ἀλλόφυλοι bezeichnet Menschen anderer Volkszugehörigkeit. Im vorliegenden Kontext sind allgemein die nichtjüdischen Gegner gemeint; „Fremdvölker“ vermeidet die unbegründete Einengung auf die Philister, während „aus den Reihen“ die partitive Konstruktion natürlich wiedergibt.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: an jenem Tag
  rationale: Natürliche und zugleich würdevolle deutsche Wiedergabe der zeitlichen Angabe.
- source_word: εἰς ἄνδρας τρισχιλίους
  choice: etwa dreitausend Mann
  rationale: Die Konstruktion mit εἰς vor einer Zahlenangabe kann einen erreichten Umfang oder eine ungefähre Gesamtzahl bezeichnen. „Etwa“ bewahrt diese mögliche Unschärfe; „Mann“ ist im Deutschen die idiomatische Zähleinheit für Kämpfer.
- source_word: ἐπέστρεψεν
  choice: kehrte zurück
  rationale: Im Zusammenhang einer Ortsbewegung bezeichnet das Verb die Rückkehr an einen Ort.
- source_word: Ἰωναθάν
  choice: Jonatan
  rationale: Gebräuchliche deutsche Form des biblischen Namens.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
