base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/023.yaml
  text: But when Jonathan heard, he ordered them to be surrounded; and he chose some of the elders of Israel and some of the priests, and put himself in danger.
translation:
  language: de
  text: Als Jonatan davon hörte, befahl er, die Belagerung fortzusetzen. Dann wählte er einige von den Ältesten Israels und von den Priestern aus und setzte sich selbst der Gefahr aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und gab ihn der Gefahr preis“. Das griechische Pronomen lautet „ihn“; wahrscheinlich ist gemeint, dass Jonatan sich selbst der Gefahr aussetzte.'
    reason: textual_variant
lexical_decisions:
- source_word: περικαθίσθαι
  choice: die Belagerung fortzusetzen
  rationale: Das Verb bezeichnet im militärischen Zusammenhang das Umzingeln beziehungsweise Belagern. Aus dem unmittelbaren Kontext ist die bereits laufende Belagerung als Gegenstand des Befehls zu erschließen; die deutsche Wiedergabe macht diesen Zusammenhang natürlich verständlich, ohne ein neues Objekt einzuführen.
- source_word: ἐπέλεξεν τῶν πρεσβυτέρων Ἰσραὴλ καὶ τῶν ἱερέων
  choice: wählte einige von den Ältesten Israels und von den Priestern aus
  rationale: 'Die Genitive nach ἐπέλεξεν sind partitiv: Jonatan wählte Personen aus beiden Gruppen aus, nicht notwendig sämtliche Ältesten und Priester.'
- source_word: ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: setzte sich selbst der Gefahr aus
  rationale: Die Verbindung von δίδωμι mit dem Dativ τῷ κινδύνῳ drückt ein Ausliefern beziehungsweise Aussetzen gegenüber der Gefahr aus. Im Erzählzusammenhang ist am ehesten Jonatans eigenes Wagnis gemeint; die schwierige Form αὐτόν wird in der Fußnote offengelegt.
theological_decisions:
- issue: Unklare Beziehung des Pronomens αὐτόν in ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: als Selbstgefährdung Jonatans wiedergegeben
  alternative: „setzte ihn der Gefahr aus“ beziehungsweise wörtlicher „gab ihn der Gefahr preis“
  rationale: Der überlieferte griechische Akkusativ bedeutet formal „ihn“, hat hier aber keinen eindeutigen singularischen Bezug. Da Jonatan Subjekt der fortlaufenden Handlung ist und sich anschließend persönlich zum König begibt, ist die reflexive Deutung im Zusammenhang am plausibelsten. Die grammatische Spannung bleibt durch eine Fußnote sichtbar.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Davon“ nimmt den vorausgehenden Bericht auf. „Die Belagerung fortzusetzen“ stellt den militärischen Zusammenhang idiomatisch her; die partitive Auswahl aus Ältesten und Priestern bleibt ausdrücklich erhalten.
