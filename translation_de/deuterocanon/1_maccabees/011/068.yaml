base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/068.yaml
  text: And behold[a], a camp of foreigners met him in the plain, and they set an ambush against him in the mountains, while they themselves advanced from the front.
translation:
  language: de
  text: 'Und siehe: In der Ebene trat ihm ein Heerlager von Fremden entgegen. In den Bergen legten sie einen Hinterhalt gegen ihn, sie selbst aber traten ihm von der Gegenseite entgegen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie selbst aber begegneten [ihm] von gegenüber.“ Auch möglich: „Sie selbst aber traten ihm frontal entgegen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ
  choice: Heer
  rationale: Das Wort bezeichnet zunächst ein militärisches Lager, kann aber metonymisch auch die dort versammelte Streitmacht meinen. Da diese Jonathan entgegentritt, ist im Deutschen „Heer“ sachlich und natürlich.
- source_word: ἀλλοφύλων
  choice: von Fremden
  rationale: Der Ausdruck bezeichnet Menschen eines anderen Volkes. Hier sind allgemein nichtjüdische feindliche Truppen gemeint; „Fremde“ vermeidet die unbegründete Eingrenzung auf die Philister.
- source_word: ἀπήντα αὐτῷ
  choice: rückte ihm … entgegen
  rationale: Das Verb bedeutet „begegnen, entgegenkommen“. In der militärischen Szene gibt „entgegenrücken“ die Bewegung idiomatisch wieder.
- source_word: ἐν τῷ πεδίῳ
  choice: in der Ebene
  rationale: πεδίον bezeichnet hier flaches, offenes Gelände und steht im räumlichen Gegensatz zu den Bergen.
- source_word: ἐξέβαλον ἔνεδρον
  choice: legten … einen Hinterhalt
  rationale: Die Wendung bedeutet, einen Hinterhalt zu postieren oder zu legen. Die gewählte Formulierung ist im modernen Deutschen geläufig.
- source_word: ἐπʼ αὐτόν
  choice: gegen ihn
  rationale: Die Präposition bezeichnet in diesem Zusammenhang die feindliche Ausrichtung des Hinterhalts.
- source_word: ἐν τοῖς ὄρεσιν
  choice: in den Bergen
  rationale: Die wörtliche Ortsangabe bewahrt den Gegensatz zwischen Ebene und Berggelände.
- source_word: αὐτοὶ δὲ ἀπήντησαν ἐξ ἐναντίας
  choice: während sie selbst ihm von vorn entgegenzogen
  rationale: Das betonte αὐτοί unterscheidet die Haupttruppe von den im Hinterhalt postierten Kräften. ἐξ ἐναντίας bezeichnet die gegenüberliegende beziehungsweise frontale Richtung; die Übersetzung wahrt die taktische Aussage, ohne sie stärker festzulegen als der griechische Text.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Und sieh da“ erhält das aufmerksamkeitslenkende καὶ ἰδού; die kurzen Hauptsätze geben die rasche militärische Bewegung wieder. Die Fußnote bewahrt die räumliche Mehrdeutigkeit des Schlusses.
