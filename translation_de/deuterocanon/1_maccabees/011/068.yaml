    issue: παρεμβολή ist mit „Heer“ wiedergegeben.
    rationale: Der Grundsinn ist „Lager/Heerlager“. Zwar kann das Wort metonymisch eine Truppenformation bezeichnen, doch der Text und die englische Audit-Spur setzen hier „camp“ an; „Heerlager“ ist die nähere und im Deutschen noch natürliche Wiedergabe.
  - severity: low
    issue: „Sieh da“ ist als Anrede formuliert.
    rationale: „Und siehe“ gibt die präsentierende Partikel καὶ ἰδού in einer modernen, würdigen Erzählsprache unmittelbarer wieder.
