  - severity: low
    issue: Fußnotenalternative „Truppenheer“
    rationale: „Truppenheer“ ist im modernen Standarddeutsch kaum idiomatisch und kann den Eindruck eines feststehenden militärischen Fachbegriffs erwecken. Eine erläuternde Fußnote kann die Doppelung ohne diese künstliche Alternative darstellen.
