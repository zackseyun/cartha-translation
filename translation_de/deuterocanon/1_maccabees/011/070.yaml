  verdict: revise
  source_fidelity: Der Satz gibt οὐδὲ εἷς κατελείφθη ἀπʼ αὐτῶν und die Ausnahme mit πλὴν zutreffend wieder. Auch die militärische Doppelbezeichnung wird grundsätzlich bewahrt. Die Namensform „Chalfis“ sollte jedoch an die griechische Schreibung Χαλφεί und die im Deutschen übliche Umschrift „Chalphi“ angepasst werden.
  naturalness: Der Haupttext ist verständlich und im angemessen würdigen modernen Standarddeutsch gehalten. „Truppen des Heeres“ ist zwar möglich, doch „Streitkräfte des Heeres“ bildet die doppelte militärische Formulierung etwas klarer ab. Die Fußnotenalternative „Truppenheer“ ist im heutigen Deutsch unnötig ungebräuchlich.
  terminology: „Befehlshaber“ ist für ἄρχοντες im militärischen Kontext treffend. „Mattatias“ und „Judas“ sind geeignete deutsche Namensformen; für Χαλφεί ist „Chalphi“ vorzuziehen. Die beiden militärischen Begriffe στρατιά und δυνάμεις sollen nicht zu einem einzigen Ausdruck verschmolzen werden.
