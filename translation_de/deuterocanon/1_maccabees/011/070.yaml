base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/070.yaml
  text: Not one of them was left[a], except Mattathias son of Absalom and Judas son of Chalphi, commanders of the forces of the army.
translation:
  language: de
  text: Keiner von ihnen blieb übrig außer Mattatias, dem Sohn Absaloms, und Judas, dem Sohn Chalphis, den Befehlshabern der Streitkräfte des Heeres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text verbindet zwei militärische Begriffe (στρατιά und δυνάμεις); ihr genaues Verhältnis zueinander ist nicht eindeutig.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ εἷς κατελείφθη ἀπʼ αὐτῶν
  choice: Keiner von ihnen blieb übrig
  rationale: Die Formulierung gibt die nachdrückliche Aussage wieder, dass aus der genannten Gruppe niemand verblieb. Das passive κατελείφθη lässt sich im Deutschen hier natürlich mit „blieb übrig“ ausdrücken, ohne ein bewusstes Zurücklassen anzudeuten.
- source_word: πλὴν
  choice: außer
  rationale: Die Präposition gibt den ausnehmenden Sinn klar und idiomatisch wieder.
- source_word: Ματταθίας ὁ τοῦ Ἀψαλώμου
  choice: Mattatias, dem Sohn Absaloms
  rationale: Die Konstruktion mit Artikel und Genitiv bezeichnet die Abstammung beziehungsweise familiäre Zuordnung; „Sohn Absaloms“ ist dafür die übliche deutsche Wiedergabe.
- source_word: Ἰούδας ὁ τοῦ Χαλφεί
  choice: Judas, dem Sohn Chalfis
  rationale: Wie bei Mattatias dient der Genitiv der Identifizierung durch den Vater beziehungsweise die Familie.
- source_word: ἄρχοντες
  choice: Befehlshabern
  rationale: Im militärischen Zusammenhang bezeichnet ἄρχοντες Personen mit Leitungs- und Befehlsgewalt; „Befehlshaber“ ist präzise und allgemein verständlich.
- source_word: τῆς στρατιᾶς τῶν δυνάμεων
  choice: der Truppen des Heeres
  rationale: Die Wiedergabe bewahrt beide militärischen Begriffe und folgt der griechischen Genitivfolge, ohne sie im Deutschen zu einer schwer verständlichen Wortverbindung zu verdichten.
