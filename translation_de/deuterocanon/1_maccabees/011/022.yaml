  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die doppelte Aussage des Hörens und die ungewöhnliche, ebenfalls doppelte Formulierung der Begegnung werden soweit möglich bewahrt. Der historische Ortsname erscheint als „Ptolemaïs“, der Personenname als „Jonatan“.
