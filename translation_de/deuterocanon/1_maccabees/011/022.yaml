  naturalness: Der Text ist insgesamt gut verständliches modernes Standarddeutsch. „Sobald er es erfahren hatte“ wirkt nach dem vorangehenden Präteritum leicht verschoben; „sobald er es hörte“ ist unmittelbarer und bewahrt die Wiederholung. Die koordinierte Infinitivkonstruktion lässt sich mit „dass ... und ... solle“ natürlich und präzise ausdrücken.
  terminology: „Ptolemaïs“ und „Jonatan“ sind passende deutsche Namensformen. „Die Belagerung nicht weiterführen“ gibt den militärischen Kontext von περικαθῆσθαι idiomatisch wieder. „Entgegenkommen“ für ἀπαντῆσαι und „zusammenzutreffen“ für συνμίσγειν bewahren die im Griechischen auffällige doppelte Begegnungsformulierung, ohne eine Beratung als Zweck zu ergänzen.
