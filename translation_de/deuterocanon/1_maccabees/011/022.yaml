  yaml_path: translation/deuterocanon/1_maccabees/011/022.yaml
  text: And when he heard it, he was angry. As soon as he heard, he immediately broke camp and came to Ptolemais, and he wrote to Jonathan not to continue the siege, but to meet him for a conference in Ptolemais as quickly as possible.
translation:
  language: de
  text: Als er davon hörte, wurde er zornig. Doch sobald er es hörte, brach er unverzüglich auf und kam nach Ptolemaïs. Er schrieb Jonatan, dass er die Belagerung nicht weiterführen und ihm so schnell wie möglich in Ptolemaïs entgegenkommen solle, um mit ihm zusammenzutreffen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht ringsum sitzen“ oder „nicht ringsum bleiben“; hier ist damit gemeint, die Belagerung aufrechtzuerhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Satz über die Begegnung ist sprachlich ungewöhnlich und lautet wörtlich etwa: „ihm zu begegnen, mit ihm zusammenzukommen“.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀκούσας / ἤκουσεν
  choice: als er davon hörte / sobald er es erfahren hatte
  rationale: Die Wiederholung des griechischen Hörverbs bleibt erhalten; die leichte Variation klingt im Deutschen natürlich und hebt beim zweiten Vorkommen die unmittelbare Reaktion hervor.
- source_word: ὠργίσθη
  choice: wurde er zornig
  rationale: Gibt den Eintritt des Zorns klar und würdig wieder, ohne die Intensität durch „geriet in Wut“ zu steigern.
- source_word: εὐθέως ἀναζεύξας
  choice: brach er unverzüglich auf
  rationale: ἀναζεύω bezeichnet im Reise- und Militärkontext das Aufbrechen beziehungsweise Abmarschieren; „aufbrechen“ ist natürlich, während εὐθέως durch „unverzüglich“ ausdrücklich wiedergegeben wird.
- source_word: ἦλθεν εἰς Πτολεμαΐδα
  choice: kam nach Ptolemaïs
  rationale: Direkte Wiedergabe der Bewegung zum Zielort; die traditionelle deutsche Namensform wird beibehalten.
- source_word: ἔγραψεν Ἰωναθὰν
  choice: schrieb er Jonatan
  rationale: Der Name steht als Adressat des Schreibens; diese Konstruktion ist im modernen Deutschen knapp und eindeutig.
- source_word: τοῦ μὴ περικαθῆσθαι
  choice: er solle die Belagerung nicht fortsetzen
  rationale: Wörtlich geht es um das Verweilen beziehungsweise Lagern ringsum. Im militärischen Zusammenhang bezeichnet dies die fortdauernde Belagerung; eine Fußnote bewahrt die konkrete Ausdrucksweise.
- source_word: ἀπαντῆσαι
  choice: ihm entgegenkommen
  rationale: Bewahrt den üblichen Bewegungssinn von ἀπαντάω besser als das allgemeinere „sich treffen“.
- source_word: αὐτὸν αὐτῷ συνμίσγειν
  choice: um mit ihm zusammenzutreffen
  rationale: Die überlieferte Konstruktion ist syntaktisch unbeholfen und scheint das Zusammentreffen nochmals auszudrücken. Die Übersetzung erhält diese Wiederholung in lesbarer Form, ohne den nicht ausdrücklich genannten Begriff „Beratung“ einzuführen.
- source_word: τὴν ταχίστην
  choice: so schnell wie möglich
  rationale: Natürliche deutsche Wiedergabe der adverbial gebrauchten Superlativform, die äußerste Eile bezeichnet.
