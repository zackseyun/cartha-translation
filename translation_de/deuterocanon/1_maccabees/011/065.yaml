base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/065.yaml
  text: And Simon encamped at Bethsura[a], and fought against it for many days, and shut it in.
translation:
  language: de
  text: Simon schlug bei Bet-Zur sein Lager auf, kämpfte viele Tage lang gegen die Stadt und schloss sie ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „riegelte sie ab“ beziehungsweise „umzingelte sie“. Das griechische Verb bedeutet, jemanden oder etwas einzuschließen; hier ist wahrscheinlich die militärische Abriegelung während einer Belagerung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβάλλεν
  choice: schlug … sein Lager auf
  rationale: Das Verb bezeichnet hier das Aufschlagen eines Lagers beziehungsweise das Beziehen einer militärischen Stellung. Die fortlaufenden Kampf- und Belagerungshandlungen werden erst durch die folgenden Verben ausgedrückt.
- source_word: Βεθσούρᾳ
  choice: Bet-Zur
  rationale: Die im Deutschen geläufige, an die semitische Namensform angelehnte Wiedergabe des Ortsnamens ist verständlich und würdig, ohne den Namen zu übersetzen.
- source_word: ἐπολέμει
  choice: kämpfte … gegen
  rationale: Der Imperfekt beschreibt eine andauernde militärische Auseinandersetzung. „Kämpfte gegen“ wahrt dies, ohne einen einzelnen Angriff zu unterstellen.
- source_word: ἡμέρας πολλὰς
  choice: viele Tage lang
  rationale: Die Akkusativverbindung bezeichnet die Dauer und wird im Deutschen natürlich mit „viele Tage lang“ wiedergegeben.
- source_word: συνέκλεισεν
  choice: schloss sie ein
  rationale: Das Verb bedeutet einschließen oder ringsum abschließen. Im Zusammenhang bezeichnet es die militärische Einschließung der Stadt, lässt aber die konkrete Form der Belagerung offen.
theological_decisions: []
translation_notes:
  register: Modernes, standarddeutsches und erzählerisch knappes Register. „Die Stadt“ verdeutlicht den Bezug des griechischen femininen Pronomens auf Bet-Zur; der anschließende Rückbezug „sie“ bleibt natürlich. Der Fußnotenmarker steht unmittelbar nach der betroffenen Wendung.
