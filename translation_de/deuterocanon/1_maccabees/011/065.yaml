  source_fidelity: 'Die Übersetzung gibt die Abfolge der griechischen Verben treffend wieder: Simon schlägt sein Lager bei Bet-Zur auf, führt über viele Tage Kampfhandlungen und schließt den Ort ein. „Viele Tage lang“ bildet die Dauerangabe ἡμέρας πολλὰς idiomatisch ab. „Schloss sie ein“ bleibt für συνέκλεισεν angemessen offen und legt weder eine bestimmte Belagerungstechnik noch eine vollständige Blockade fest.'
