  yaml_path: translation/deuterocanon/1_maccabees/011/064.yaml
  text: And he went to meet them[a], but he left his brother Simon in the country.
translation:
  language: de
  text: Und er ging ihnen entgegen[a], seinen Bruder Simon aber ließ er im Land[b] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „traf sie“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Gebiet“ oder „in der Region“. Das griechische χώρα kann ein Gebiet in weiterem Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήντησεν
  choice: zog ihnen entgegen
  rationale: Das Verb bezeichnet hier das Entgegengehen bzw. Entgegenziehen. Im militärisch-geografischen Zusammenhang gibt „zog ihnen entgegen“ die gerichtete Bewegung natürlich und präzise wieder.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der griechische Dativ Plural verlangt einen pluralischen Bezug; „ihnen“ bewahrt diese Form eindeutig.
- source_word: κατέλιπεν
  choice: ließ … zurück
  rationale: Das Verb bedeutet „zurücklassen“. Die deutsche Wendung macht deutlich, dass Simon nicht mit ihm zog, ohne eine darüber hinausgehende militärische Beauftragung einzutragen.
- source_word: ἐν τῇ χώρᾳ
  choice: im Land
  rationale: χώρα kann Land, Gebiet oder Region bezeichnen. „Im Land“ ist würdig und natürlich, lässt den genauen räumlichen Umfang aber offen.
- source_word: ἀδελφὸν αὐτοῦ Σίμωνα
  choice: seinen Bruder Simon
  rationale: Diese Wortstellung gibt Verwandtschaftsbeziehung und Eigennamen in klarem modernem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Zog“ entspricht dem militärischen Kontext, während die Fußnote die allgemeinere Wiedergabe der Bewegungsrichtung festhält. Die adversative Stellung von δέ wird durch „aber“ bewahrt.
