  yaml_path: translation/deuterocanon/1_maccabees/011/052.yaml
  text: And King Demetrius sat on the throne of his kingdom, and the land was quiet before him.
translation:
  language: de
  text: Und König Demetrius setzte sich auf den Thron seines Königreichs, und das Land kam vor ihm zur Ruhe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: setzte sich
  rationale: Der Aorist von καθίζω bezeichnet hier das Einnehmen des königlichen Throns. „Setzte sich“ bewahrt das konkrete Bild und kann im Zusammenhang zugleich die Thronbesteigung ausdrücken.
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: den Thron seines Königreichs
  rationale: Die genitivische Konstruktion wird eng am Griechischen wiedergegeben, ohne βασιλεία auf ein bloßes Adjektiv zu verkürzen.
- source_word: ἡσύχασεν
  choice: kam zur Ruhe
  rationale: Die Wendung gibt das Eintreten eines ruhigen, ungestörten Zustands wieder, ohne den stärkeren Begriff vollständigen Friedens einzutragen.
- source_word: ἡ γῆ
  choice: das Land
  rationale: Im historischen Zusammenhang bezeichnet γῆ das Herrschaftsgebiet und nicht die gesamte Erde.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor ihm
  rationale: Die räumlich-politische Wendung bleibt bewusst wörtlich und erhält ihre mögliche Bedeutung in Bezug auf seine Gegenwart oder Herrschaft.
- source_word: ὁ βασιλεὺς Δημήτριος
  choice: König Demetrius
  rationale: Die im Deutschen übliche Stellung des Titels vor dem Namen gibt den griechischen Ausdruck natürlich und präzise wieder.
