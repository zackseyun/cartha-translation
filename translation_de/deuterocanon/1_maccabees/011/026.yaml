base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/026.yaml
  text: And the king dealt with him as those before him had dealt with him[a], and he exalted him above all his friends.
translation:
  language: de
  text: Und der König behandelte ihn ebenso, wie seine Vorgänger ihn behandelt hatten, und erhob ihn vor allen seinen Freunden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und erhob ihn über alle seine Freunde«. Die griechische Wendung kann eine öffentliche Erhöhung in Gegenwart des königlichen Hofkreises bezeichnen; im Zusammenhang ist auch eine Erhöhung im Rang über sie möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν αὐτῷ
  choice: behandelte ihn
  rationale: Die Verbindung von ποιέω mit dem Dativ bezeichnet hier idiomatisch das Handeln des Königs an Jonathan beziehungsweise seinen Umgang mit ihm. »Behandelte ihn« ist im Deutschen natürlich und lässt die politische Ausgestaltung offen.
- source_word: καθὼς ἐποίησαν αὐτῷ οἱ πρὸ αὐτοῦ
  choice: ebenso, wie seine Vorgänger ihn behandelt hatten
  rationale: οἱ πρὸ αὐτοῦ meint in diesem Zusammenhang die früheren Könige. »Seine Vorgänger« macht diesen Bezug knapp und eindeutig; das Plusquamperfekt gibt das zeitliche Verhältnis natürlich wieder.
- source_word: ὕψωσεν
  choice: erhob
  rationale: ὑψόω bezeichnet ein Erhöhen an Rang oder Ehre. »Erhob« bewahrt die feierliche, politisch-höfische Bedeutung, ohne die konkrete Form der Auszeichnung festzulegen.
- source_word: ἐναντίον πάντων τῶν φίλων αὐτοῦ
  choice: über alle seine Freunde
  rationale: Zusammen mit ὕψωσεν kann die Wendung eine Erhöhung über die anderen Angehörigen des königlichen Hofkreises bezeichnen. Da ἐναντίον jedoch gewöhnlich auch »vor« oder »in Gegenwart von« bedeuten kann, wird diese echte Mehrdeutigkeit in der Fußnote erhalten. φίλοι wird als »Freunde« wiedergegeben und kann hier zugleich den hellenistischen höfischen Rangkreis bezeichnen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »behandelte« entspricht der parallelen griechischen Formulierung; »Vorgänger« vermeidet eine im Deutschen schwerfällige wörtliche Wiedergabe von »die vor ihm«.
