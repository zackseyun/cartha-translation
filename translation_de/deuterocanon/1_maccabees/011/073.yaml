  - marker: a
    text: 'Wörtlich nur: „sahen“; das nicht genannte Objekt bezieht sich auf das zuvor Geschehene.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ φυγόντες παρ᾽ αὐτοῦ
  choice: die Männer, die von ihm geflohen waren
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet diejenigen, die zuvor von ihm geflohen waren. „Die Männer“ macht die deutsche Formulierung natürlich, ohne sie als dauerhafte „Flüchtlinge“ zu kennzeichnen.
- source_word: ἴδον
  choice: das sahen
  rationale: Im Griechischen bleibt das Objekt unausgesprochen und verweist auf das zuvor Geschehene. Deutsch verlangt hier idiomatisch ein Demonstrativpronomen; „das“ hält den Bezug offen.
- source_word: ἐπέστρεψαν πρὸς αὐτόν
  choice: kehrten sie zu ihm zurück
  rationale: Die Wiedergabe bezeichnet klar die Umkehr ihrer Flucht und ihre Rückkehr zu ihm.
- source_word: ἐδίωκον μετ᾽ αὐτοῦ
  choice: Gemeinsam mit ihm verfolgten sie die Feinde
  rationale: Der Imperfekt beschreibt die fortdauernde Verfolgung. Das im Griechischen nicht eigens genannte Objekt wird im Deutschen aus dem militärischen Zusammenhang als „die Feinde“ ergänzt, damit der Satz natürlich und verständlich ist.
- source_word: ἕως Κάδης
  choice: bis nach Kadesch
  rationale: ἕως bezeichnet das räumliche Ziel beziehungsweise die Grenze der Verfolgung; „Kadesch“ ist die etablierte deutsche Namensform.
- source_word: ἕως τῆς παρεμβολῆς αὐτῶν
  choice: bis zu deren Lager
  rationale: παρεμβολή bezeichnet hier ein Heerlager. „Deren“ bewahrt den pronominalen Ausdruck und weist im Deutschen am natürlichsten auf die verfolgten Feinde zurück, ohne diese Zuordnung im Haupttext vollständig auszudeuten.
- source_word: παρενέβαλον ἐκεῖ
  choice: dort schlugen sie ihr Lager auf
  rationale: Die idiomatische deutsche Wendung gibt das militärische Lagern wieder und bewahrt die Wortverbindung mit „Lager“.
