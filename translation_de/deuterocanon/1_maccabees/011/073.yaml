    rationale: αὐτῶν bezeichnet grammatisch nur „ihr/deren“; die wahrscheinlichste Zuordnung kann in einer Anmerkung erläutert werden, sollte aber nicht durch eine zusätzliche explizite Bezugsgruppe im Haupttext festgeschrieben werden.
