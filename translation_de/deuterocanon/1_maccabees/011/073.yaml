  source_fidelity: Die Ergänzung „die Feinde“ bei ἐδίωκον ist im griechischen Satz nicht ausgedrückt und legt zugleich den anschließend mit αὐτῶν offen gelassenen Bezug fest. Die Verfolgung selbst und die Ortsangaben sind sonst zutreffend wiedergegeben.
  naturalness: Der Entwurf ist flüssiges modernes Standarddeutsch. Die revidierte Fassung bleibt idiomatisch, ohne ein nicht genanntes Objekt der Verfolgung einzutragen.
  terminology: „Kadesch“ und „Lager aufschlagen“ sind angemessen. „Ihr Lager“ bewahrt die pronominale Offenheit des griechischen αὐτῶν besser als „deren Lager“, das im Entwurf durch die ergänzten „Feinde“ bereits festgelegt wird.
