base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/073.yaml
  text: And those who had fled from him saw it[a], and they returned to him, and with him they pursued as far as Kadesh, as far as their camp[b], and they encamped there.
translation:
  language: de
  text: Als die Männer, die von ihm geflohen waren, das sahen,[a] kehrten sie zu ihm zurück und verfolgten mit ihm bis nach Kadesch, bis zu ihrem Lager; dort schlugen sie ihr Lager auf.
  philosophy: optimal-equivalence
