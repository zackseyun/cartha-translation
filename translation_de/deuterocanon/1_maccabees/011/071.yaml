translation:
  language: de
  text: Und Jonathan zerriss seine Kleider, legte Erde[a][b] auf seinen Kopf und betete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Erde auf den Kopf zu legen war ein übliches Zeichen von Trauer, Bedrängnis oder Klage.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Staub“. Das griechische Wort bedeutet wörtlich „Erde“ oder „Boden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέρρηξεν
  choice: zerriss
  rationale: Der Aorist von διαρρήγνυμι bezeichnet hier das Zerreißen von Kleidung als Ausdruck von Trauer oder großer Bedrängnis. „Zerriss“ ist präzise und in modernem Deutsch natürlich.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: seine Kleider
  rationale: Ἱμάτια bezeichnet allgemein Kleidungsstücke. „Seine Kleider“ gibt dies verständlich und ohne unbegründete Verengung auf besondere Gewänder wieder.
- source_word: ἐπέθετο γῆν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: streute sich Erde auf den Kopf
  rationale: Wörtlich setzte oder legte Jonathan Erde auf seinen Kopf. „Streute sich Erde auf den Kopf“ bezeichnet die Handlung im Deutschen natürlich, während „Erde“ die konkrete Wortwahl γῆ bewahrt.
- source_word: προσηύξατο
  choice: betete
  rationale: Der Aorist von προσεύχομαι wird schlicht und treffend mit „betete“ wiedergegeben.
- source_word: Ἰωνάθαν
  choice: Jonathan
  rationale: „Jonathan“ ist die etablierte deutsche Namensform.
theological_decisions:
- issue: Deutung der Trauerhandlung
  choice: Die Handlungen werden im Haupttext ohne deutende Erweiterung wiedergegeben.
  alternative: Im Haupttext ausdrücklich von Trauer, Klage oder Verzweiflung sprechen.
  rationale: Der griechische Text berichtet das Zerreißen der Kleider, die Erde auf dem Kopf und das Gebet, benennt aber den inneren Zustand nicht ausdrücklich. Die kulturelle Bedeutung wird daher in einer Fußnote erklärt, ohne sie in den Haupttext einzutragen.
- issue: Erde oder Staub
  choice: Erde
  alternative: Staub
  rationale: γῆ bedeutet hier wörtlich „Erde“ oder „Boden“. „Staub“ entspricht zwar einer geläufigen biblischen Trauerformel, würde aber die konkrete griechische Wortwahl stärker konventionalisieren.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt knapp und folgt der Abfolge der drei griechischen Verben. Beide Fußnotenmarker stehen unmittelbar bei „Erde“, da sich sowohl die kulturelle Erklärung als auch die lexikalische Alternative darauf beziehen.
