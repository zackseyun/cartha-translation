lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: wurde … König
  rationale: Der Aorist von βασιλεύω bezeichnet hier im Zusammenhang der chronologischen Notiz den Regierungsantritt des Demetrius. „Wurde König“ gibt diesen punktuellen Sinn im Deutschen natürlicher wieder als „regierte“, das eher eine Dauer ausdrückt.
- source_word: Δημήτριος
  choice: Demetrius
  rationale: Der Personenname wird gemäß der im Deutschen üblichen Form wiedergegeben.
- source_word: ἔτους ἑβδομοῦ καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: im 167. Jahr
  rationale: Die Genitivfügung ist eine Datierungsformel; die griechische Zahlenfolge bedeutet wörtlich das siebte, sechzigste und hundertste Jahr, also das 167. Jahr. Die Ziffernschreibung ist klar und entspricht modernem deutschem Gebrauch.
