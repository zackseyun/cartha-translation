base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/021.yaml
  text: And some lawless men[a], who hated their own nation, went to the king and reported to him that Jonathan was besieging the citadel.
translation:
  language: de
  text: Einige gesetzlose Männer, die ihr eigenes Volk hassten, gingen zum König und berichteten ihm, Jonatan belagere die Zitadelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Akra“, die befestigte Zitadelle in Jerusalem.'
    reason: 'Lexikalische und historische Alternative: ἄκρα kann als Gattungsbezeichnung „Zitadelle“ oder als Eigenname der Jerusalemer Festung verstanden werden.'
lexical_decisions:
- source_word: ἐπορεύθησάν
  choice: gingen
  rationale: Das schlichte Erzählverb gibt die Bewegung natürlich wieder, ohne den Aorist zu überdeuten.
- source_word: τινες
  choice: einige
  rationale: Bewahrt den unbestimmten Bezug auf eine nicht näher bezeichnete Gruppe.
- source_word: μισοῦντες
  choice: die … hassten
  rationale: Ein Relativsatz gibt das beschreibende Partizip in natürlichem Deutsch wieder.
- source_word: τὸ ἔθνος αὐτῶν
  choice: ihr eigenes Volk
  rationale: Gemeint ist hier die eigene jüdische Volksgemeinschaft; „Volk“ klingt im Deutschen natürlicher als „Nation“ und wahrt den ethnisch-politischen Sinn.
- source_word: ἄνδρες παράνομοι
  choice: gesetzlose Männer
  rationale: Bewahrt die moralisch-rechtliche Wertung von παράνομοι, ohne sie auf bloßen Verbrecherstatus zu verengen.
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Passt zur Übermittlung einer Meldung an den König und entspricht dem höfisch-politischen Kontext.
- source_word: περικάθηται
  choice: belagere
  rationale: Im militärischen Zusammenhang bezeichnet das Verb das Umschließen einer befestigten Anlage; der Konjunktiv I kennzeichnet die indirekte Rede und wahrt die Gleichzeitigkeit.
- source_word: τὴν ἄκραν
  choice: die Zitadelle
  rationale: Gibt die allgemeine Bedeutung unmittelbar wieder; die mögliche historische Eigenbezeichnung „Akra“ wird in der Fußnote erhalten.
