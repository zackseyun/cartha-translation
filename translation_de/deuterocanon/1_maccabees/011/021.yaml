  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: die unbestimmte Gruppe, ihre Feindschaft gegen das eigene Volk, die Charakterisierung als παράνομοι, den Gang zum König, die Meldung und Jonatans Belagerung der ἄκρα. Der Konjunktiv I in der indirekten Rede ist angemessen; die Gleichzeitigkeit von περικάθηται wird sachgerecht vermittelt.'
