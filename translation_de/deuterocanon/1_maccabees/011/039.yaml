base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/039.yaml
  text: Tryphon had formerly been among those with Alexander[a], and seeing that all the forces were grumbling against Demetrius, he went to Simmakoues the Arab, who was rearing Antiochus, the little child of Alexander.
translation:
  language: de
  text: Tryphon hatte früher zu den Leuten Alexanders gehört. Als er sah, dass alle Truppen gegen Demetrius murrten, ging er zu dem Araber Simmakues, der Antiochus, den kleinen Sohn Alexanders, aufzog.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν παρὰ Ἀλεξάνδρου
  choice: zu den Leuten Alexanders gehört
  rationale: Die Wendung bezeichnet Zugehörigkeit zu Alexanders Gefolgschaft oder Partei, ohne Tryphons Rang näher festzulegen.
- source_word: τὸ πρότερον
  choice: früher
  rationale: Das adverbiale Akkusativgefüge verweist knapp und natürlich auf eine frühere Zugehörigkeit.
- source_word: πᾶσαι αἱ δυνάμεις
  choice: alle Truppen
  rationale: Im militärischen Zusammenhang bezeichnet δυνάμεις die Streitkräfte; „Truppen“ ist im modernen Deutschen klar und idiomatisch.
- source_word: καταγογγύζουσιν κατὰ τοῦ Δημητρίου
  choice: gegen Demetrius murrten
  rationale: Das Verb bezeichnet unzufriedenes, widerstrebendes Murren; κατά mit Genitiv richtet dieses gegen Demetrius.
- source_word: Σιμμάκουην τὸν Ἄραβα
  choice: dem Araber Simmakues
  rationale: Der Personenname wird aus der griechischen Form transliteriert; die ethnische Bezeichnung wird als natürliche deutsche Apposition wiedergegeben.
- source_word: ἔτρεφεν
  choice: aufzog
  rationale: τρέφω bezeichnet hier die Versorgung und Erziehung des königlichen Kindes; „aufzog“ erfasst beides natürlich.
- source_word: τὸ παιδάριον τὸ τοῦ Ἀλεξάνδρου
  choice: den kleinen Sohn Alexanders
  rationale: παιδάριον hebt das geringe Alter hervor; das elliptische τὸ τοῦ Ἀλεξάνδρου bezeichnet im Zusammenhang Alexanders Sohn. Die explizite Wiedergabe ist im Deutschen klarer und sachlich eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert; das anknüpfende δέ wird nicht eigens wiedergegeben, da ein einleitendes „Nun“ im Deutschen eine nicht vorhandene Zeitangabe nahelegen könnte.
