base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/001.yaml
  text: And the king of Egypt gathered many forces[a], like the sand by the seashore, and many ships; and he sought to gain control of Alexander’s kingdom by deceit, and to add it to his own kingdom.
translation:
  language: de
  text: Und der König von Ägypten zog so zahlreiche Streitkräfte wie den Sand am Meeresufer und viele Schiffe zusammen. Er suchte, Alexanders Reich durch List in seine Gewalt zu bringen[a] und es seinem eigenen Reich hinzuzufügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alexanders Reich durch List zu überwältigen“ oder „die Herrschaft über Alexanders Reich durch List zu gewinnen“. Das griechische Verb kann bedeuten, die Oberhand über etwas zu gewinnen oder etwas unter seine Kontrolle zu bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθροισεν
  choice: zog … zusammen
  rationale: Das Verb ἀθροίζω bezeichnet das Sammeln oder Zusammenbringen. Im militärischen Zusammenhang ist „Streitkräfte zusammenziehen“ natürlich und präzise, ohne eine förmliche Aushebung vorauszusetzen.
- source_word: δυνάμεις πολλὰς
  choice: viele Streitkräfte
  rationale: δυνάμεις bezeichnet hier militärische Kräfte. „Streitkräfte“ wahrt die Breite des Ausdrucks besser als „Truppen“ oder „Heere“.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: zahlreich wie der Sand am Meeresufer
  rationale: Die bekannte biblische Vergleichsformel drückt eine unübersehbare Menge aus. Die Ergänzung „zahlreich“ macht den Bezug auf die Streitkräfte im Deutschen klar und bewahrt das Bild.
- source_word: πλοῖα πολλά
  choice: viele Schiffe
  rationale: Direkte und natürliche Wiedergabe der griechischen Wortgruppe.
- source_word: ἐζήτησεν
  choice: er suchte
  rationale: ζητέω bezeichnet hier ein zielgerichtetes Streben oder Trachten. „Suchte“ erhält den literarischen Ton und legt den Erfolg nicht vorweg.
- source_word: κατακρατῆσαι
  choice: in seine Gewalt zu bringen
  rationale: κατακρατέω kann das Überwältigen, Beherrschen oder Erlangen der Kontrolle bezeichnen. „In seine Gewalt bringen“ gibt diese politische und machtbezogene Bedeutung idiomatisch wieder.
- source_word: τῆς βασιλείας Ἀλεξάνδρου
  choice: Alexanders Königreich
  rationale: βασιλεία bezeichnet in diesem Zusammenhang das Reich beziehungsweise Herrschaftsgebiet, nicht primär das abstrakte Königtum.
- source_word: δόλῳ
  choice: durch List
  rationale: δόλος umfasst List, Täuschung und Arglist. „Durch List“ ist würdevoll und lässt die genaue Stärke der negativen Wertung offen.
- source_word: προσθεῖναι αὐτὴν τῇ βασιλείᾳ αὐτοῦ
  choice: es seinem eigenen Königreich hinzuzufügen
  rationale: Die Formulierung bildet das griechische „hinzufügen“ ab und gibt zugleich den politischen Sinn verständlich wieder, ohne den moderneren Fachbegriff „annektieren“ einzuführen.
