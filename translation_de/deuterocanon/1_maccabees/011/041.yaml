  text: And Jonathan sent to Demetrius the king[a], asking that he drive out those in the citadel from Jerusalem, and those in the strongholds; for they were making war against Israel.
translation:
  language: de
  text: Und Jonatan sandte zu König Demetrius und bat ihn, diejenigen in der Zitadelle[a] aus Jerusalem zu vertreiben, ebenso diejenigen in den Festungen; denn sie führten Krieg gegen Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: diejenigen aus der Akra, der seleukidischen Zitadelle in Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν ... πρὸς Δημήτριον τὸν βασιλέα
  choice: sandte zu König Demetrius
  rationale: Die Formulierung bleibt nahe am griechischen Sendeverb und gibt die nachgestellte Königsbezeichnung in natürlichem modernem Deutsch wieder. Das nicht ausdrücklich genannte Objekt des Sendens wird nicht ergänzt.
- source_word: ἵνα ἐκβάλῃ
  choice: und bat ihn, ... zu vertreiben
  rationale: Nach dem Verb des Sendens bezeichnet ἵνα hier den Zweck beziehungsweise die erbetene Handlung. „Vertreiben“ bewahrt den nachdrücklichen Sinn gewaltsamer Entfernung.
- source_word: τοὺς ἐκ τῆς ἄκρας
  choice: die Männer in der Zitadelle
  rationale: Gemeint sind Personen, die zur Jerusalemer Akra gehören. „In der Zitadelle“ vermeidet im Deutschen das missverständliche „aus der Zitadelle“, weil das folgende ἐξ Ἱερουσαλήμ den Ort bezeichnet, aus dem sie vertrieben werden sollen.
- source_word: ἐξ Ἱερουσαλήμ
  choice: aus Jerusalem
  rationale: Die räumliche Ausgangsangabe und der Gedanke der Vertreibung werden direkt bewahrt.
- source_word: τοὺς ἐν τοῖς ὀχυρώμασιν
  choice: die Männer in den Festungen
  rationale: ὀχύρωμα bezeichnet befestigte Orte. „Festungen“ ist knapp, konkret und im militärischen Zusammenhang natürlich.
- source_word: ἦσαν γὰρ πολεμοῦντες
  choice: denn sie führten Krieg
  rationale: Die umschreibende griechische Verbform bezeichnet fortdauernde organisierte Feindseligkeit; „führten Krieg“ gibt dies idiomatisch und gewichtiger als bloßes „kämpften“ wieder.
- source_word: τὸν Ἰσραήλ
  choice: gegen Israel
  rationale: Der Akkusativ bei πολεμέω bezeichnet die angegriffene Gegenpartei; „gegen Israel“ gibt die feindliche Ausrichtung eindeutig wieder.
