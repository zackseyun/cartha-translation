    issue: „die Männer“ ergänzt ein nicht im Ausgangstext enthaltenes Geschlechtsmerkmal.
    rationale: τούς ist hier als substantiviertes maskulines Pluralwort generisch und bezeichnet die betreffenden Personen bzw. Angehörigen der Zitadelle und Festungen. „diejenigen“ bewahrt diese Offenheit.
  - severity: low
    issue: Die Fußnote formuliert die Akra-Alternative mit „in der Akra“, obwohl der griechische Ausdruck wörtlich „aus der Akra“ lautet und die Hauptfassung bereits kontextuell „in der Zitadelle“ wiedergibt.
    rationale: Eine Fußnote mit „diejenigen aus der Akra“ dokumentiert die lexikalisch nähere Alternative präziser, ohne die gut lesbare Hauptfassung unnötig zu verkomplizieren.
  revised_text: Und Jonatan sandte zu König Demetrius und bat ihn, diejenigen in der Zitadelle[a] aus Jerusalem zu vertreiben, ebenso diejenigen in den Festungen; denn sie führten Krieg gegen Israel.
