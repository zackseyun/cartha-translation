  terminology: Die Namensformen „Gennesar“ und „Nasor“ folgen dem vorliegenden griechischen Text. Die Fußnote zu Gennesar ist sachlich, verständlich und korrekt verankert. Es liegen keine theologischen Fachbegriffe vor.
