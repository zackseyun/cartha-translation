  source_fidelity: 'Der Text gibt die Aussage des Griechischen zuverlässig wieder: Jonatan und die bei ihm befindliche militärische Gruppe lagern am Wasser von Gennesar und brechen früh am Morgen zur Ebene von Nasor auf. „Heer“ ist für παρεμβολή im militärischen Zusammenhang vertretbar, auch wenn „Lager“ eine mögliche, stärker wörtliche Alternative wäre. Die Zielrichtung von εἰς wird mit „zur Ebene“ angemessen wiedergegeben.'
