base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/067.yaml
  text: And Jonathan and his camp encamped by the water of Gennesar, and they rose early in the morning for the plain of Nasor.
translation:
  language: de
  text: Jonatan und sein Heer lagerten am Wasser von Gennesar,[a] und früh am Morgen brachen sie zur Ebene von Nasor auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gennesar ist die Namensform des griechischen Textes an dieser Stelle; geläufiger ist auch Gennesaret.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεμβολὴ
  choice: Heer
  rationale: Im militärischen Erzählzusammenhang bezeichnet παρεμβολή hier am natürlichsten die bei Jonatan befindliche Truppe. „Heer“ vermeidet im Deutschen die schwerfällige Wiederholung „sein Lager lagerte“.
- source_word: παρενέβαλον
  choice: lagerten
  rationale: Das Verb bezeichnet das Aufschlagen eines Lagers. „lagerten“ ist eine direkte und im Kontext natürliche Wiedergabe.
- source_word: ἐπὶ τὸ ὕδωρ
  choice: am Wasser
  rationale: Bei einem Lagerplatz bezeichnet die Wendung die Lage am Ufer beziehungsweise beim Gewässer; „am Wasser“ bewahrt die allgemein gehaltene Ausdrucksweise des Griechischen.
- source_word: τοῦ Γεννησάρ
  choice: von Gennesar
  rationale: Die Namensform folgt Γεννησάρ im vorliegenden griechischen Text und wird nicht an das geläufigere „Gennesaret“ angeglichen.
- source_word: ὤρθρισαν τὸ πρωὶ
  choice: früh am Morgen brachen sie auf
  rationale: ὤρθρισαν bezeichnet frühes Aufstehen beziehungsweise frühes Tätigwerden; zusammen mit εἰς und dem Zielausdruck ist im Deutschen „brachen sie ... auf“ natürlich und macht die im Griechischen implizierte Bewegung kenntlich.
- source_word: εἰς τὸ πεδίον Νασώρ
  choice: zur Ebene von Nasor
  rationale: εἰς bezeichnet die Bewegung auf ein Ziel hin. „zur Ebene“ gibt dies idiomatisch wieder; „Nasor“ folgt der griechischen Namensform Νασώρ.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die syntaktisch ungewöhnliche Verbindung von „früh aufstehen“ mit einer Zielangabe wird zugunsten natürlichen Deutschen als „früh am Morgen aufbrechen“ wiedergegeben, ohne zusätzliche Einzelhandlung einzuführen.
