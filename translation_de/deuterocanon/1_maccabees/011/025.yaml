  yaml_path: translation/deuterocanon/1_maccabees/011/025.yaml
  text: And some lawless men from the nation were making accusations against him[a].
translation:
  language: de
  text: Und einige gesetzlose Männer aus dem Volk brachten Klage gegen ihn vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „richteten eine Eingabe gegen ihn“, das heißt, sie brachten bei der zuständigen Autorität eine Beschwerde vor. Das griechische Verb kann eine Eingabe oder ein Ersuchen bezeichnen; durch „gegen ihn“ ist es hier feindlich gemeint.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἐνετύγχανον
  choice: brachten Klage vor
  rationale: Das Verb bezeichnet hier mit κατʼ αὐτοῦ eine feindlich gegen jemanden gerichtete Eingabe bei einer Autorität. „Klage vorbringen“ gibt diesen Vorgang natürlich wieder; die durative Bedeutung des Imperfekts bleibt im Kontext erkennbar.
- source_word: κατʼ αὐτοῦ
  choice: gegen ihn
  rationale: κατά mit Genitiv drückt hier die gegen die betreffende Person gerichtete Opposition aus.
- source_word: τινες
  choice: einige
  rationale: Die unbestimmte Teilmenge wird im modernen Deutschen knapp und genau mit „einige“ wiedergegeben.
- source_word: ἄνομοι
  choice: gesetzlose Männer
  rationale: Das substantivierte maskuline Adjektiv bezeichnet Männer, die sich über das Gesetz hinwegsetzen. „Gesetzlos“ bewahrt sowohl den rechtlichen als auch den moralischen Wertungsgehalt.
- source_word: τῶν ἐκ τοῦ ἔθνους
  choice: aus dem Volk
  rationale: ἔθνος bezeichnet hier das eigene jüdische Volk in ethnisch-politischem Sinn. „Volk“ klingt im Deutschen natürlicher als „Nation“ und vermeidet die irreführende Wiedergabe „Heiden“.
theological_decisions:
- issue: Wiedergabe von ἄνομοι
  choice: gesetzlose Männer
  alternative: frevlerische Männer
  rationale: Der Ausdruck hat hier einen rechtlich-moralischen Sinn und ist kein technischer theologischer Titel. „Gesetzlos“ erhält die unmittelbare Wertung des griechischen Textes.
- issue: Bezug von τῶν ἐκ τοῦ ἔθνους
  choice: aus dem Volk
  alternative: aus ihrer eigenen Nation
  rationale: Gemeint sind Angehörige des jüdischen Volkes. Die knappe Form wahrt den griechischen Wortlaut, ohne das im Deutschen unnötig erklärende „eigenen“ einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Klage vorbringen“ ist verständlich und bildet den administrativ-rechtlichen Vorgang ab; die Fußnote bewahrt die weitere Bedeutungsspanne des griechischen Verbs.
