  text: Und sie steckten die Stadt in Brand, machten an jenem Tag viel Beute und retteten den König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: steckten … in Brand
  rationale: Die Wendung gibt das kausative Anzünden der Stadt idiomatisch und präzise wieder.
- source_word: τὴν πόλιν
  choice: die Stadt
  rationale: πόλις bezeichnet hier ohne weiteren einschränkenden Hinweis die Stadt.
- source_word: ἐλάβοσαν σκῦλα πολλὰ
  choice: machten … reiche Beute
  rationale: σκῦλα meint Kriegsbeute; die feste deutsche Wendung „reiche Beute machen“ gibt auch πολλὰ natürlich wieder.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: an jenem Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der temporalen Bestimmung.
- source_word: ἔσωσαν
  choice: retteten
  rationale: Im Zusammenhang einer unmittelbaren Gefahr bezeichnet σῴζω konkret das Retten des Königs.
- source_word: τὸν βασιλέα
  choice: den König
  rationale: Direkte und kontextgemäße Wiedergabe des bestimmten Akkusativobjekts.
