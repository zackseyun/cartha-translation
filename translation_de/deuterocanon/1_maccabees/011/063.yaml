base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/063.yaml
  text: And Jonathan heard that Demetrius’s commanders had come to Kedesh in Galilee with a large force[a], intending to remove him from office.
translation:
  language: de
  text: Und Jonatan hörte, dass die Befehlshaber des Demetrius mit einer großen Streitmacht nach Kedesch in Galiläa gekommen waren, um ihn seines Amtes zu entheben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um ihn aus seiner Stellung zu entfernen«. Der griechische Ausdruck kann bedeuten, jemanden seiner übertragenen Aufgabe oder seines Amtes zu entheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte
  rationale: Die direkte Wiedergabe bewahrt den Charakter einer Nachricht, die Jonatan zu Ohren kam.
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: die Befehlshaber des Demetrius
  rationale: ἄρχοντες bezeichnet führende Amtsträger; der militärische Zusammenhang mit einer großen Streitmacht legt hier »Befehlshaber« nahe.
- source_word: παρῆσαν
  choice: waren ... gekommen
  rationale: Das Verb bezeichnet ihr Eingetroffensein und ihre nunmehrige Anwesenheit; das Plusquamperfekt ordnet dies zeitlich vor Jonatans Nachricht ein.
- source_word: Κῆδες τὴν ἐν τῇ Γαλιλαίᾳ
  choice: Kedesch in Galiläa
  rationale: Die Ortsangabe identifiziert dieses Kedesch durch seine Lage in Galiläa; »Kedesch« folgt der im Deutschen geläufigen biblischen Namensform.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: mit einer großen Streitmacht
  rationale: δύναμις bezeichnet im militärischen Erzählzusammenhang eine Truppenmacht; »Streitmacht« ist präzise, ohne die Formation näher festzulegen.
- source_word: βουλόμενοι
  choice: um ... zu
  rationale: Das Partizip drückt hier die Absicht der Befehlshaber aus und wird im Deutschen natürlich durch einen finalen Infinitivsatz wiedergegeben.
- source_word: μεταστῆσαι αὐτὸν τῆς χρείας
  choice: ihn seines Amtes zu entheben
  rationale: μεθίστημι mit dem Genitiv kann Entfernung aus einer Stellung bezeichnen; χρεία meint hier wahrscheinlich die übertragene Funktion oder Amtsstellung. Die Formulierung gibt den politischen Sinn knapp wieder.
theological_decisions: []
