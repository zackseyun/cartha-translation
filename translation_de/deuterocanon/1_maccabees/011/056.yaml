  yaml_path: translation/deuterocanon/1_maccabees/011/056.yaml
  text: And Tryphon took the elephants and gained control of Antioch[a].
translation:
  language: de
  text: Und Tryphon nahm die Elefanten[a] und brachte Antiochia unter seine Kontrolle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Tiere“; im militärischen Zusammenhang sind Kriegselefanten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: nahm
  rationale: Der Aorist von λαμβάνω bezeichnet hier im militärisch-politischen Erzählzusammenhang am ehesten, dass Tryphon die Tiere an sich nahm. „Nahm“ bleibt nahe am Griechischen, ohne ausdrücklich eine Gefangennahme zu behaupten.
- source_word: Τρύφων
  choice: Tryphon
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: τὰ θηρία
  choice: die Elefanten
  rationale: Wörtlich bedeutet der Ausdruck „die Tiere“ beziehungsweise „die wilden Tiere“; im hellenistischen militärischen Kontext sind damit Kriegselefanten gemeint. Die konkrete Wiedergabe verhindert ein missverständliches deutsches Verständnis.
- source_word: κατεκράτησεν
  choice: brachte … unter seine Kontrolle
  rationale: κατακρατέω mit dem Genitiv bezeichnet hier das Erlangen beziehungsweise Ausüben von Herrschaft über die Stadt. Die Formulierung gibt den politisch-militärischen Sinn natürlich wieder, ohne einen bestimmten Ablauf der Einnahme vorauszusetzen.
- source_word: Ἀντιοχίας
  choice: Antiochia
  rationale: Der Genitiv steht als Ergänzung zu κατακρατέω; „Antiochia“ ist die übliche deutsche Namensform der Stadt.
