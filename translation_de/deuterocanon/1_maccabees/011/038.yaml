base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/038.yaml
  text: And King Demetrius saw that the land was quiet before him and that nothing opposed him[a], so he dismissed all his forces, each to his own place, except for the foreign forces that he had recruited from the islands of the nations[b]; and all the forces from his fathers became hostile to him.
translation:
  language: de
  text: Und als König Demetrius sah, dass im Land unter seiner Herrschaft Ruhe herrschte und ihm nichts Widerstand leistete, entließ er alle seine Truppen, jede an ihren eigenen Ort, mit Ausnahme der ausländischen Truppen[a], die er von den Inseln der Völker angeworben hatte. Da wurden ihm alle Truppen seiner Väter feindlich gesinnt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Söldnertruppen“. Das griechische Wort bezeichnet ausländische, nicht einheimische Truppen und kann angeworbene Söldner meinen.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung ist knapp und kann die herkömmlichen Truppen bezeichnen, die aus der Herrschaft seiner Vorfahren übernommen worden waren, im Unterschied zu den ausländischen Truppen, die Demetrius behielt.
    reason: cultural_note
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: das Land unter seiner Herrschaft Ruhe hatte
  rationale: ἡσύχασεν bezeichnet politische und militärische Ruhe, ohne zwingend einen umfassenden Frieden auszudrücken. Das idiomatische deutsche „unter seiner Herrschaft“ gibt ἐνώπιον αὐτοῦ kontextgerecht wieder.
- source_word: οὐθὲν αὐτῷ ἀνθεστήκει
  choice: ihm nichts Widerstand leistete
  rationale: Die Form bezeichnet das Ausbleiben fortdauernden Widerstands; die deutsche Wendung ist natürlich und bewahrt den militärisch-politischen Sinn.
- source_word: ἀπέλυσεν πάσας τὰς δυνάμεις αὐτοῦ
  choice: entließ er alle seine Truppen
  rationale: ἀπέλυσεν meint hier die Entlassung beziehungsweise Heimschickung aus dem Militärdienst. „Truppen“ gibt δυνάμεις in diesem Zusammenhang klar wieder.
- source_word: ἕκαστον εἰς τὸν ἴδιον τόπον
  choice: jeden an seinen eigenen Ort
  rationale: Die distributive Einzahl des Griechischen bleibt erhalten; τόπος wird bewusst nicht auf Heimat, Garnison oder Region verengt.
- source_word: ξένων δυνάμεων
  choice: fremden Truppen
  rationale: ξένος bezeichnet nicht einheimische Truppen und kann Söldner einschließen. Die Hauptübersetzung bewahrt die allgemeinere Bedeutung; die mögliche Söldnernuance steht in der Fußnote.
- source_word: ἐξενολόγησεν
  choice: angeworben hatte
  rationale: Das Verb bezeichnet das Anwerben ausländischer Soldaten. „Angeworben“ ist genauer als bloßes „rekrutiert“, legt aber eine konkrete Form der Bezahlung nicht fest.
- source_word: ἀπὸ τῶν νήσων τῶν ἐθνῶν
  choice: von den Inseln der Völker
  rationale: Die Wiedergabe folgt der griechischen Formulierung eng und vermeidet die interpretierende Verengung auf „fremde Inseln“.
- source_word: ἠχθρασαν αὐτῷ
  choice: wurden ihm … feindlich gesinnt
  rationale: Die Form drückt das Entstehen einer feindlichen Haltung aus; „wurden“ bewahrt diesen ingressiven Zug.
- source_word: πᾶσαι αἱ δυνάμεις αἱ ἀπὸ τῶν πατέρων
  choice: alle Truppen, die von seinen Vätern her stammten
  rationale: Die komprimierte griechische Wendung wird bewusst nicht eindeutig als zeitlich, erblich oder institutionell aufgelöst. Gemeint sind wahrscheinlich die herkömmlichen, aus der Herrschaft seiner Vorfahren übernommenen Truppen.
