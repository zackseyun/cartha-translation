revisions:
- from: Und als König Demetrius sah, dass das Land unter seiner Herrschaft Ruhe hatte und ihm nichts Widerstand leistete, entließ er alle seine Truppen, jeden an seinen eigenen Ort, mit Ausnahme der fremden Truppen[a], die er von den Inseln der Völker angeworben hatte. Da wurden ihm alle Truppen, die von seinen Vätern her stammten, feindlich gesinnt.[b]
  to: Und als König Demetrius sah, dass im Land unter seiner Herrschaft Ruhe herrschte und ihm nichts Widerstand leistete, entließ er alle seine Truppen, jede an ihren eigenen Ort, mit Ausnahme der ausländischen Truppen[a], die er von den Inseln der Völker angeworben hatte. Da wurden ihm alle Truppen seiner Väter feindlich gesinnt.[b]
  rationale: Die Revision korrigiert die distributive Bezugsform bei der Entlassung der Truppen und ersetzt eine im Deutschen zu stark herkunftsbezogene Wiedergabe der knappen Wendung αἱ ἀπὸ τῶν πατέρων. „Ausländisch“ macht die geographisch-politische Bedeutung von ξένος klar, während die Fußnote die mögliche Söldnernuance ausdrücklich offenhält. Die Mehrdeutigkeit der Schlusswendung bleibt im Haupttext gewahrt und wird nur in der Fußnote erläutert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den militärisch-politischen Sinn des griechischen Textes insgesamt zuverlässig wieder: Ruhe im Land, fehlender Widerstand, Entlassung der regulären Kräfte, Beibehaltung ausländischer Angeworbener und die anschließende Feindschaft der väterlichen/angestammten Truppen. „Von seinen Vätern her stammten“ legt jedoch eine Herkunftsbeziehung nahe, die für αἱ ἀπὸ τῶν πατέρων weniger treffend und im Deutschen unnötig konkret ist.'
  naturalness: Der Satz ist gut lesbar. „Alle seine Truppen, jeden an seinen eigenen Ort“ weist allerdings eine unstimmige Bezugsform auf, da „Truppen“ hier pluralisch ist. Die distributive Aussage lässt sich idiomatisch mit „jede an ihren eigenen Ort“ wiedergeben. „Truppen seiner Väter“ ist zudem natürlicher als „Truppen, die von seinen Vätern her stammten“.
  terminology: „Ausländische Truppen“ ist im modernen Standarddeutsch eindeutiger als „fremde Truppen“ und entspricht ξέναι δυνάμεις unmittelbar, ohne die mögliche Söldnerbedeutung im Haupttext festzulegen. Die Fußnoten erläutern die beiden relevanten Mehrdeutigkeiten angemessen.
  issues:
  - severity: medium
    issue: „jeden an seinen eigenen Ort“
    rationale: Nach „alle seine Truppen“ ist der maskuline Singular „jeden“ grammatisch und referenziell unklar. Das griechische ἕκαστον ist distributiv; deutsch ist „jede an ihren eigenen Ort“ bei „Truppen“ als Einheiten natürlich und präzise.
  - severity: medium
    issue: „die von seinen Vätern her stammten“
    rationale: Die Formulierung suggeriert, die Truppen seien unmittelbar von seinen Vätern hervorgebracht oder abstammend. αἱ ἀπὸ τῶν πατέρων ist komprimiert und bezeichnet eher die mit seinen Vätern beziehungsweise Vorfahren verbundenen, angestammten Truppen. „Truppen seiner Väter“ bewahrt diese Offenheit besser.
