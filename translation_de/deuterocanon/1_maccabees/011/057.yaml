base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/057.yaml
  text: And Antiochus the younger wrote to Jonathan[a], saying, “I appoint you to the high priesthood, and I appoint you over the four districts, and that you are to be among the king’s Friends.”
translation:
  language: de
  text: 'Und Antiochus der Jüngere schrieb an Jonatan: »Ich setze dich in das Hohepriesteramt ein, setze dich über die vier Bezirke und nehme dich in den Kreis der Freunde des Königs[a] auf.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Freunden des Königs« ist wahrscheinlich ein offizieller Rang am hellenistischen Königshof gemeint, nicht bloß eine persönliche Freundschaft mit dem König.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Das Aoristverb bezeichnet unmittelbar den Schreibakt; »schrieb« gibt dies knapp wieder, während der folgende Inhalt den Briefcharakter erkennen lässt.
- source_word: ὁ νεώτερος
  choice: der Jüngere
  rationale: Der Beiname unterscheidet diesen Antiochus von einem älteren Namensträger und klingt im Deutschen natürlich.
- source_word: Ἵστημί σοι τὴν ἀρχιερωσύνην
  choice: Ich bestätige dir das Hohepriesteramt
  rationale: ἵστημι mit Dativ und Amtsbezeichnung hat hier administrativ-rechtliche Kraft. Da Jonatan das Hohepriesteramt bereits innehatte, bringt »bestätige« die Fortgeltung der Ernennung im Kontext präziser zum Ausdruck als eine erstmalige Einsetzung.
- source_word: καθίστημί σε ἐπὶ
  choice: setze dich über … ein
  rationale: καθίστημι bezeichnet hier die förmliche Übertragung von Leitungsgewalt; die Wendung bewahrt sowohl den Amtscharakter als auch die Konstruktion mit ἐπί.
- source_word: τῶν τεσσάρων νομῶν
  choice: die vier Bezirke
  rationale: νομός bezeichnet hier Verwaltungseinheiten. »Bezirke« ist verständlich und vermeidet die möglicherweise zu großräumige Vorstellung von Provinzen.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: den Freunden des Königs
  rationale: Die Wendung bezeichnet wahrscheinlich einen Rang am hellenistischen Königshof. Die natürliche deutsche Formulierung bleibt im Haupttext erhalten; eine Fußnote erläutert den fachsprachlichen Sinn.
theological_decisions:
- issue: Status der Freunde des Königs
  choice: Freunde des Königs mit erläuternder Fußnote als Hofrang
  alternative: persönliche Freunde oder Gefährten des Königs
  rationale: Der Ausdruck ist historisch-politisch, nicht primär theologisch. Die Übersetzung bewahrt die mögliche Alltagbedeutung, während die Fußnote auf den wahrscheinlich titulären Gebrauch hinweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist administrativ und förmlich formuliert. »Hohepriesteramt« ist verständlicher und institutionell genauer als das abstraktere »Hohepriestertum«; »bestätige« berücksichtigt den erzählerischen Kontext einer bereits bestehenden Amtsstellung.
