  source_fidelity: 'Die Wiedergabe von ἔγραψεν, ὁ νεώτερος, καθίστημί und den vier Verwaltungsbezirken ist im Wesentlichen zutreffend. »bestätige« für ἵστημί σοι τὴν ἀρχιερωσύνην ist jedoch keine sichere Übersetzung des Wortlauts: Das Verb bezeichnet hier die amtliche Einsetzung bzw. Verleihung. Eine bloße Bestätigung wird erst aus dem weiteren Kontext erschlossen und sollte nicht in den Text eingetragen werden.'
