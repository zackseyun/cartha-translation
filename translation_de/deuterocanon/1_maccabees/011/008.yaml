base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/008.yaml
  text: But King Ptolemy gained control of the cities of the coast as far as Seleucia-by-the-Sea[a], and he was devising evil plans against Alexander.
translation:
  language: de
  text: König Ptolemäus aber brachte die Städte an der Küste bis hin zu Seleukia am Meer unter seine Herrschaft und schmiedete böse Pläne gegen Alexander.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hegte böse Pläne betreffs Alexander“. Das griechische περὶ Ἀλεξάνδρου kann „über Alexander“ oder „Alexander betreffend“ bedeuten; im Zusammenhang mit den bösen Plänen liegt jedoch eine gegen ihn gerichtete Absicht nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκυρίευσεν
  choice: brachte … unter seine Herrschaft
  rationale: Das Verb bezeichnet das Erlangen bzw. Ausüben von Herrschaft oder Verfügungsgewalt. Die Formulierung passt zum militärisch-politischen Zusammenhang, ohne eine dauerhaft gefestigte Königsherrschaft zu behaupten.
- source_word: τῶν πόλεων τῆς παραλίας
  choice: die Städte an der Küste
  rationale: Die Wiedergabe ist im modernen Deutsch natürlich und bewahrt den geografischen Sinn der griechischen Genitivverbindung.
- source_word: ἕως Σελευκίας τῆς παραθαλασσίας
  choice: bis hin zu Seleukia am Meer
  rationale: Der Zusatz unterscheidet dieses Seleukia von gleichnamigen Orten. „Am Meer“ gibt παραθαλασσίας klar und knapp wieder.
- source_word: διελογίζετο
  choice: schmiedete
  rationale: Der Imperfekt bezeichnet ein andauerndes Erwägen oder Ausarbeiten. Zusammen mit „böse Pläne“ bringt „schmiedete“ die feindselige Planung idiomatisch zum Ausdruck.
- source_word: λογισμοὺς πονηρούς
  choice: böse Pläne
  rationale: λογισμοί kann Überlegungen, Absichten oder Pläne bezeichnen; πονηρούς kennzeichnet sie moralisch als böse. Die Wendung ist verständlich und bewahrt diese Wertung.
- source_word: περὶ Ἀλεξάνδρου
  choice: gegen Alexander
  rationale: περί bedeutet wörtlich „über/betreffs“. Im Zusammenhang mit bösen Plänen ist die Ausrichtung feindselig; „gegen“ gibt diesen kontextuellen Sinn im Deutschen natürlich wieder, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit „aber“ nach dem Subjekt lehnt sich leicht an den erzählenden biblischen Ton an, bleibt jedoch gut verständlich. Der Name wird in der im Deutschen etablierten Form „Ptolemäus“ wiedergegeben.
