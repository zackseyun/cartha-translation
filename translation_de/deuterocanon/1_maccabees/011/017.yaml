  yaml_path: translation/deuterocanon/1_maccabees/011/017.yaml
  text: And Zabdiel the Arab cut off Alexander’s head and sent it to Ptolemy.
translation:
  language: de
  text: Und Zabdiel, der Araber, schlug Alexander den Kopf ab und schickte ihn Ptolemäus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφεῖλεν
  choice: schlug … ab
  rationale: Mit »den Kopf« als direktem Objekt bezeichnet das Verb hier die Enthauptung. »den Kopf abschlagen« ist im Deutschen natürlich und eindeutig.
- source_word: Ζαβδιὴλ
  choice: Zabdiel
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: ὁ Ἀραβ
  choice: der Araber
  rationale: Die substantivierte ethnische Bezeichnung steht als Apposition zu Zabdiel; »der Araber« ist die direkte und idiomatische deutsche Wiedergabe.
- source_word: τὴν κεφαλὴν Ἀλεξάνδρου
  choice: Alexander den Kopf
  rationale: Die deutsche Konstruktion »jemandem den Kopf abschlagen« gibt das griechische Besitzverhältnis natürlich wieder, ohne den Sinn zu verändern.
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Das schlichte narrative Verb entspricht dem griechischen Ausdruck und passt zur Übersendung des Kopfes.
- source_word: τῷ Πτολεμαίῳ
  choice: Ptolemäus
  rationale: Der Dativ bezeichnet den Empfänger. Ein Königstitel wird nicht ergänzt, da er im griechischen Text fehlt.
