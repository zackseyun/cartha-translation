base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/036.yaml
  text: And none of these things shall be set aside from now on for all time.
translation:
  language: de
  text: Und nichts davon soll von jetzt an für alle Zeit aufgehoben werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετήσεται
  choice: soll aufgehoben werden
  rationale: Das Futur Passiv bezeichnet hier, dass die zuvor genannten Bestimmungen nicht außer Kraft gesetzt oder für ungültig erklärt werden sollen. „Aufgehoben werden“ ist im Deutschen natürlich, wahrt den passiven und rechtlich-administrativen Sinn und ist weniger schwerfällig als „annulliert werden“.
- source_word: οὐδὲν τούτων
  choice: nichts davon
  rationale: Die Wendung verweist gesammelt auf die zuvor genannten Zugeständnisse oder Bestimmungen. „Nichts davon“ ist idiomatisches modernes Deutsch und erhält den umfassenden negativen Bezug.
- source_word: ἀπὸ τοῦ νῦν
  choice: von jetzt an
  rationale: Diese Formulierung gibt den zeitlichen Ausgangspunkt klar und gegenwärtig wieder, ohne das altertümlichere „hinfort“ zu verwenden.
- source_word: ἐπὶ τὸν ἅπαντα χρόνον
  choice: für alle Zeit
  rationale: Die Formulierung bewahrt den ausdrücklich umfassenden zeitlichen Geltungsanspruch des Griechischen. „Für immer“ wäre möglich, klänge jedoch idiomatisch absoluter und weniger nah an der zeitlichen Ausdrucksweise der Vorlage.
