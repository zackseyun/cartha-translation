  - marker: b
    text: 'Das heißt: Ptolemäus war der Schwiegervater Alexanders; deshalb hatte Alexander den Städten befohlen, ihn freundlich zu empfangen und ihm entgegenzugehen.'
    reason: referent_clarification
lexical_decisions:
- source_word: ἐξῆλθεν εἰς Συρίαν
  choice: zog … nach Syrien
  rationale: Die Wendung gibt die gerichtete Bewegung idiomatisch wieder. „Zog“ passt zum Reise- und Heereskontext, ohne zusätzliche Absichten auszudrücken.
- source_word: λόγοις εἰρηνικοῖς
  choice: mit friedlichen Worten
  rationale: Die konkrete Redeweise des griechischen Ausdrucks bleibt erhalten und bezeichnet friedliche beziehungsweise diplomatische Zusicherungen, nicht nur ein friedliches Auftreten.
- source_word: ἤνοιγον αὐτῷ
  choice: öffneten ihm
  rationale: Das griechische Verb nennt nicht ausdrücklich, was geöffnet wurde. Die Ellipse bleibt im Haupttext erhalten; die wahrscheinliche Bedeutung wird in der Fußnote erläutert.
- source_word: οἱ ἀπὸ τῶν πόλεων
  choice: die Männer aus den Städten
  rationale: Der substantivierte maskuline Ausdruck bezeichnet Männer beziehungsweise Vertreter aus den Städten. Die Wiedergabe bleibt nah an der Form und passt zum Zusammenhang städtischer Abordnungen.
- source_word: συνήντων αὐτῷ
  choice: kamen ihm entgegen
  rationale: Die Wendung bezeichnet das Entgegenkommen zur Begrüßung oder zum Empfang und klingt im Deutschen natürlicher als ein bloßes „trafen ihn“.
- source_word: ἐντολὴ ἦν Ἀλεξάνδρου τοῦ βασιλέως
  choice: König Alexander hatte den Befehl gegeben
  rationale: Die besitzanzeigende griechische Konstruktion wird als königliche Anordnung idiomatisch und mit ihrer Autorität wiedergegeben.
- source_word: συναντᾷν αὐτῷ
  choice: ihm entgegenzugehen
  rationale: Der Infinitiv nennt den Inhalt des Befehls und nimmt die vorausgehende Begegnungsformulierung auf.
- source_word: διὰ τὸ πενθερὸν αὐτοῦ εἶναι
  choice: weil er sein Schwiegervater war
  rationale: πενθερός bedeutet spezifisch „Schwiegervater“. Die im Griechischen vorhandene pronominale Form bleibt im Haupttext erhalten; aus dem Zusammenhang ist Ptolemäus als Alexanders Schwiegervater gemeint.
