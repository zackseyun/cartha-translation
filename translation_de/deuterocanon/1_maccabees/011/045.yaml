base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/045.yaml
  text: And those from the city gathered in the middle of the city[a], about one hundred twenty thousand men, and they wanted to kill the king.
translation:
  language: de
  text: Und die Einwohner der Stadt versammelten sich im Zentrum der Stadt; es waren 120.000 Männer,[a] und sie wollten den König töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „zwölf Myriaden Männer“, das heißt 120.000 Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνώχθησαν
  choice: versammelten sich
  rationale: Das Verb bezeichnet das Zusammenkommen zu einer Gruppe. „Versammelten sich“ ist natürlich und gibt die gemeinsame Handlung treffend wieder.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: die Bewohner der Stadt
  rationale: Wörtlich steht „die aus der Stadt“. Im Zusammenhang bezeichnet die Wendung die dortige Bevölkerung beziehungsweise deren handelnde Gruppe; „Bewohner der Stadt“ ist im Deutschen klar, ohne vorzeitig ein Geschlecht festzulegen.
- source_word: εἰς τὸ μέσον τῆς πόλεως
  choice: mitten in der Stadt
  rationale: Die räumliche Wendung bezeichnet das Innere beziehungsweise die Mitte der Stadt. „Mitten in der Stadt“ ist idiomatisches, heutiges Deutsch.
- source_word: εἰς ἄνδρας δώδεκα μυριάδας
  choice: etwa hundertzwanzigtausend Männer
  rationale: δώδεκα μυριάδας bedeutet wörtlich „zwölf Myriaden“, also 120.000; ἄνδρας bezeichnet ausdrücklich Männer. εἰς drückt hier eine Größenordnung beziehungsweise Gesamtzahl aus, die idiomatisch mit „etwa“ wiedergegeben wird.
- source_word: ἠβούλοντο
  choice: sie wollten
  rationale: Der Imperfekt von βούλομαι drückt hier anhaltenden Willen oder eine Absicht aus. „Sie wollten“ bewahrt die schlichte Aussage, ohne sie zu „waren entschlossen“ zu verstärken.
- source_word: ἀνελεῖν
  choice: töten
  rationale: ἀναιρέω bedeutet in diesem Zusammenhang, jemandem das Leben zu nehmen. „Töten“ ist direkt, modern und sachlich.
