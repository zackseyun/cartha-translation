translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Ablauf; das Semikolon trennt Sammlung und Angriffsvorbereitung. „Zitadelle“ ist verständlich, während die historische Bezeichnung „Akra“ in der Fußnote erhalten bleibt.
