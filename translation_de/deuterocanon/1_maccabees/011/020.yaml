base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/020.yaml
  text: In those days Jonathan gathered those from Judea to make war against the citadel in Jerusalem[a], and they built many siege engines against it.
translation:
  language: de
  text: In jenen Tagen versammelte Jonatan die Leute aus Judäa, um die Zitadelle in Jerusalem[a] zu bekriegen; und sie bauten viele Belagerungsmaschinen gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Akra“, die befestigte Hochburg in Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: versammelte
  rationale: Der Aorist von συνάγω bezeichnet hier das Zusammenbringen von Menschen zu einem militärischen Zweck; „versammelte“ ist im Deutschen natürlich und nicht unnötig spezifizierend.
- source_word: τοὺς ἐκ τῆς Ἰουδαίας
  choice: die Leute aus Judäa
  rationale: Die griechische Wendung ist elliptisch. „Die Leute aus Judäa“ bewahrt die Herkunftsangabe, ohne das im Text nicht ausdrücklich stehende „Männer“ einzufügen.
- source_word: τοῦ ἐκπολεμῆσαι
  choice: um … zu bekriegen
  rationale: Der artikulierte Infinitiv drückt den Zweck aus. „Bekriegen“ gibt die gezielte militärische Feindhandlung stärker wieder als ein allgemeines „kämpfen“.
- source_word: τὴν ἄκραν
  choice: die Zitadelle
  rationale: Ἄκρα bezeichnet eine befestigte Höhe oder Zitadelle und hier konkret die seleukidische Festung in Jerusalem. Die Sachbezeichnung steht lesefreundlich im Haupttext; der mögliche Eigenname wird in der Fußnote genannt.
- source_word: μηχανὰς πολλάς
  choice: viele Belagerungsmaschinen
  rationale: Im Zusammenhang mit dem Angriff auf eine Festung meint μηχανή militärische Belagerungsgeräte, nicht Maschinen im modernen allgemeinen Sinn.
- source_word: ἐποίησαν ἐπʼ αὐτὴν
  choice: sie bauten … gegen sie
  rationale: Ποιέω bezeichnet hier die Herstellung der Belagerungsgeräte; „bauten“ ist dafür idiomatisch. „Gegen sie“ gibt die feindliche Ausrichtung von ἐπʼ αὐτήν wieder und bezieht sich grammatisch auf die Zitadelle.
