  text: And he sent the young men and the hundred talents[a], but he broke his word and did not release Jonathan.
translation:
  language: de
  text: Da schickte Simon die Jungen[a] und die hundert Talente. Tryphon aber hielt sein Wort nicht[b] und ließ Jonatan nicht frei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die jungen Diener“. Gemeint sind im Zusammenhang die zuvor als Geiseln verlangten Söhne.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „täuschte ihn“ oder „handelte treulos“. Das griechische Verb kann allgemein Täuschung oder falsches Handeln bezeichnen; hier geht es darum, dass Tryphon die zugesagten Bedingungen nach Erhalt der Zahlung und der Geiseln nicht erfüllte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλε
  choice: schickte
  rationale: Der narrative Aorist von ἀποστέλλω wird im modernen Deutsch natürlich mit „schickte“ wiedergegeben.
- source_word: τὰ παιδάρια
  choice: die jungen Männer
  rationale: παιδάριον kann Jungen, junge Männer oder junge Diener bezeichnen. Hier verweist der Ausdruck im Zusammenhang auf die zuvor als Geiseln verlangten Söhne; „junge Männer“ bewahrt den Altersbezug, ohne sie unbegründet als Diener zu bestimmen.
- source_word: τὰ ἑκατὸν τάλαντα
  choice: die hundert Talente
  rationale: Die bestimmte Mengenangabe wird direkt und idiomatisch wiedergegeben; „Talente“ bezeichnet hier eine Gewichts- beziehungsweise Geldsumme.
- source_word: διεψεύσατο
  choice: hielt sein Wort nicht
  rationale: Das Verb kann allgemein täuschen oder sich als falsch beziehungsweise treulos erweisen bedeuten. Im unmittelbaren Zusammenhang geht es darum, dass Tryphon trotz erhaltener Zahlung und Geiseln die zugesagte Freilassung verweigerte.
- source_word: οὐκ ἀφῆκεν
  choice: ließ … nicht frei
  rationale: Da Jonatan gefangen gehalten wird, gibt „freilassen“ die kontextuelle Bedeutung von ἀφίημι präzise wieder.
- source_word: τὸν Ἰωναθάν
  choice: Jonatan
  rationale: Gebräuchliche deutsche Form des biblischen Namens.
theological_decisions: []
translation_notes:
  register: Natürliches, gegenwärtiges Standarddeutsch mit würdigem Erzählton. Die im Griechischen nur impliziten Subjekte werden als Simon und Tryphon benannt, weil innerhalb des Verses ein sachlich notwendiger Subjektwechsel stattfindet; die Namen ergeben sich unmittelbar aus dem Kontext und verhindern im Deutschen eine irreführende Zuordnung. Die lexikalische Spannweite von παιδάρια und διεψεύσατο bleibt in den Fußnoten sichtbar.
