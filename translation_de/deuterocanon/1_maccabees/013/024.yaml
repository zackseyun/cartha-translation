  text: Da kehrte Tryphon um und zog fort in sein Land.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: kehrte um
  rationale: Das Verb bezeichnet hier im Erzählverlauf eine Richtungsänderung beziehungsweise die Rückkehr. »Kehrte um« bewahrt diese konkrete Bewegungsnuance und klingt im modernen Deutsch natürlich.
- source_word: ἀπῆλθεν
  choice: zog fort
  rationale: Das Verb markiert das Verlassen des Schauplatzes. »Zog fort« gibt dies knapp und erzählerisch angemessen wieder, ohne die vorangehende Richtungsänderung zu wiederholen.
- source_word: γῆν
  choice: Land
  rationale: γῆ kann »Land«, »Landesgebiet« oder »Gebiet« bedeuten. »Land« ist hier die weiteste und am wenigsten politisch festlegende Wiedergabe.
- source_word: αὐτοῦ
  choice: sein
  rationale: Das Possessivpronomen bezieht sich auf Tryphon. Im Deutschen ist »in sein Land« natürlich und gibt die Zugehörigkeit wieder, ohne durch »eigenes« eine im Griechischen nicht eigens markierte Betonung hinzuzufügen.
- source_word: Τρύφων
  choice: Tryphon
  rationale: Der Personenname wird nach etablierter deutscher Form als »Tryphon« wiedergegeben.
theological_decisions: []
translation_notes:
  register: 'Knappes, würdiges modernes Erzählregister. Die beiden aufeinanderfolgenden Bewegungsverben bleiben unterscheidbar: zuerst die Umkehr, dann das Fortziehen. Keine Fußnoten erforderlich.'
