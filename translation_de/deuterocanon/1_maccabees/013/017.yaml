  text: And Simon recognized that they were speaking deceitfully to him[a], yet he sent the money and the boys[b], lest he stir up great hostility against the people.
translation:
  language: de
  text: Und Simon erkannte, dass sie hinterlistig mit ihm redeten. Dennoch schickte er das Geld[a] und die Jungen, um nicht etwa große Feindschaft mit dem Volk[b] hervorzurufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Silber“. Das griechische Wort ἀργύριον kann Silber als Metall oder Geld beziehungsweise eine Geldzahlung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „gegen das Volk“ oder „beim Volk“. Die griechische Wendung πρὸς τὸν λαόν bezeichnet eine Beziehung oder Ausrichtung, legt hier aber nicht eindeutig fest, von welcher Seite die Feindschaft ausgeht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: erkannte
  rationale: Der Aorist von γινώσκω bezeichnet hier Simons Einsicht in die Täuschungsabsicht, nicht bloß vorhandenes Wissen.
- source_word: δόλῳ
  choice: hinterlistig
  rationale: 'Der Dativ beschreibt die Art und Weise des Redens: mit Täuschung beziehungsweise Arglist.'
- source_word: λαλοῦσιν πρὸς αὐτόν
  choice: sie … mit ihm redeten
  rationale: Die Formulierung gibt die an Simon gerichtete, im indirekten Aussagesatz als andauernd dargestellte Rede natürlich wieder.
- source_word: πέμπει
  choice: schickte er
  rationale: Das historische Präsens wird dem üblichen deutschen Erzählstil entsprechend als Präteritum wiedergegeben.
- source_word: τὸ ἀργύριον
  choice: das Geld
  rationale: ἀργύριον kann Silber oder Geld bezeichnen; im Zusammenhang einer geforderten Zahlung ist „Geld“ die klarste Wiedergabe.
- source_word: τὰ παιδάρια
  choice: die Jungen
  rationale: Das Diminutiv bezeichnet Jungen beziehungsweise junge Söhne; „Jungen“ ist direkt und legt kein Kleinkindalter fest.
- source_word: μή ποτε
  choice: damit … nicht etwa
  rationale: Die Wendung bezeichnet einen befürchteten und zu vermeidenden Ausgang; „nicht etwa“ bewahrt das vorsichtige Moment von ποτε.
- source_word: ἔχθραν ἄρῃ μεγάλην
  choice: große Feindschaft … hervorrief
  rationale: Die bildhafte Verbindung „Feindschaft erheben“ wird im Deutschen idiomatisch als das Hervorrufen großer Feindschaft ausgedrückt.
- source_word: πρὸς τὸν λαόν
  choice: mit dem Volk
  rationale: πρός bezeichnet hier die relationale Ausrichtung der Feindschaft. „Mit dem Volk“ bewahrt diese Beziehung, ohne eindeutig festzulegen, von welcher Seite die Feindschaft ausgeht.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Das einleitende καί wird mit „Und“ bewahrt; das zweite καί wird wegen des sachlichen Gegensatzes idiomatisch mit „Dennoch“ wiedergegeben. Die relationale Mehrdeutigkeit am Versende bleibt im Haupttext und in der Fußnote erkennbar.
