  text: And he encouraged them and said to them[a], “You yourselves know what I and my brothers and my father’s house have done for the laws and the holy things, and the wars and the distresses.”
translation:
  language: de
  text: 'Und er machte ihnen Mut und sagte zu ihnen: »Ihr selbst wisst, was ich, meine Brüder und das Haus meines Vaters für die Gesetze und die heiligen Dinge[a] getan haben, und ihr kennt die Kriege und die Bedrängnisse.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Heiligtum«. Wörtlich steht im Griechischen »die heiligen Dinge«; damit können das Heiligtum und weitere heilige Dinge oder Angelegenheiten gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: machte ihnen Mut
  rationale: Im Zusammenhang stärkt Simon die Menschen für die bevorstehende Lage. Die Wendung ist natürliches modernes Deutsch und lässt den ermutigenden Sinn von παρακαλέω hervortreten, ohne eine förmliche Ermahnung vorauszusetzen.
- source_word: Αὐτοὶ οἴδατε
  choice: Ihr selbst wisst
  rationale: Das ausdrücklich gesetzte αὐτοὶ betont die Angesprochenen; „selbst“ bewahrt diesen Nachdruck.
- source_word: οἶκος τοῦ πατρός μου
  choice: das Haus meines Vaters
  rationale: Die Formulierung erhält das griechische Familien- und Sippenbild, bleibt im biblisch-historischen Zusammenhang aber verständlich.
- source_word: περὶ τῶν νόμων καὶ τῶν ἁγίων
  choice: für die Gesetze und die heiligen Dinge
  rationale: „Für“ gibt den Einsatz zugunsten der genannten Größen wieder. Der Plural „Gesetze“ wird bewahrt, und „die heiligen Dinge“ hält den möglichen weiteren Bezug von τὰ ἅγια offen.
- source_word: τοὺς πολέμους καὶ τὰς στενοχωρίας
  choice: die Kriege und die Bedrängnisse
  rationale: Beide Akkusative gehören als weitere Gegenstände zu οἴδατε. Das wiederaufgenommene „ihr kennt“ macht diese syntaktische Beziehung im Deutschen deutlich, ohne die nicht ausdrücklich genannte Deutung „die wir erduldet haben“ einzufügen.
- source_word: ἐποιήσαμεν
  choice: getan haben
  rationale: Die schlichte, umfassende Wiedergabe entspricht dem breiten Bedeutungsfeld von ποιέω und passt zum rückblickenden Appell.
theological_decisions:
- issue: Bedeutungsumfang von τῶν ἁγίων
  choice: die heiligen Dinge
  alternative: das Heiligtum
  rationale: Das substantivierte Neutrum Plural kann das Heiligtum, heilige Gegenstände oder heilige Angelegenheiten insgesamt bezeichnen. Der Haupttext wahrt diese Mehrdeutigkeit, statt den Bezug auf das Heiligtum einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und mündlich verständlich; das historisch-familiäre Bild „Haus meines Vaters“ sowie die Mehrdeutigkeit von „die heiligen Dinge“ bleiben erhalten.
