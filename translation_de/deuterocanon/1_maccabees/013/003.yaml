  source_fidelity: Der Text gibt die griechische Syntax und den Sinn sorgfältig wieder. „Ihr selbst wisst“ bewahrt den Nachdruck von αὐτοὶ οἴδατε; „was ich, meine Brüder und das Haus meines Vaters ... getan haben“ entspricht ὅσα ... ἐποιήσαμεν. Die gesonderte deutsche Wendung „und ihr kennt die Kriege und die Bedrängnisse“ macht die im Griechischen elliptisch angeschlossene Akkusativgruppe verständlich, ohne ein nicht ausgedrücktes „erlitten/erduldet“ einzutragen.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Machte ihnen Mut“ passt im Kontext zu παρεκάλεσεν. Die Wiederaufnahme von „ihr kennt“ ist eine natürliche deutsche Ausformung der knappen griechischen Koordination.
  terminology: „Gesetze“ erhält den griechischen Plural νόμων. „Haus meines Vaters“ bewahrt das familiär-dynastische Bild von οἶκος τοῦ πατρός μου. „Die heiligen Dinge“ wahrt den weiteren, nicht eindeutig auf das Heiligtum begrenzten Umfang von τῶν ἁγίων; die Fußnote benennt „das Heiligtum“ angemessen als mögliche, aber nicht erzwungene Alternative.
