  text: and the spirit of his people was rekindled when they heard these words;
translation:
  language: de
  text: Da lebte der Geist seines Volkes wieder auf, als sie diese Worte hörten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεζωπύρισεν
  choice: lebte … wieder auf
  rationale: Das Verb bezeichnet ein erneutes Aufflammen oder Wiederaufleben. Die deutsche Wendung gibt hier natürlich wieder, dass die innere Kraft und Entschlossenheit des Volkes neu belebt wurde.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Die wörtliche Wiedergabe bewahrt das Bild für die innere Haltung und Lebenskraft des Volkes, ohne es einengend nur als »Mut« oder »Kampfgeist« auszulegen.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: seines Volkes
  rationale: Der Genitiv mit αὐτοῦ ist possessiv und bezeichnet die persönliche Zugehörigkeit des Volkes zu der im Zusammenhang genannten Person.
- source_word: ἀκοῦσαι
  choice: als sie … hörten
  rationale: Der Infinitiv bezeichnet hier den Anlass beziehungsweise Zeitpunkt des Wiederauflebens. Das pluralische »sie« bezieht sich sinngemäß auf die Menschen des kollektivischen »Volkes«.
- source_word: τῶν λόγων τούτων
  choice: diese Worte
  rationale: λόγοι verweist auf die unmittelbar zuvor gesprochenen Worte; »diese Worte« ist direkt, idiomatisch und registergerecht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Geist-Metapher des Griechischen bleibt erhalten; der Satzbau ist für heutige Leser natürlich, und der pluralische Rückbezug macht deutlich, dass die Angehörigen des Volkes die Worte hörten.
