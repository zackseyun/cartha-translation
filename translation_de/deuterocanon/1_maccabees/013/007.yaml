  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Satzes zuverlässig wieder: καὶ mit dem anschließenden erzählenden „Da“, ἀνεζωπύρισεν als erneutes Aufleben, τὸ πνεῦμα als „der Geist“, τοῦ λαοῦ αὐτοῦ als „seines Volkes“ sowie den anlassbezogenen Infinitiv ἀκοῦσαι als „als sie diese Worte hörten“. Die Metapher des neu belebten inneren Zustands bleibt erhalten, ohne sie auf Mut oder Kampfgeist zu verengen.'
