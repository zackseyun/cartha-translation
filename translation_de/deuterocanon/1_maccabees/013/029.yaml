  text: And he made these as devices, setting up great pillars; and on the pillars he made suits of armor for an everlasting memorial, and beside the armor, ships engraved, to be seen by all who sail the sea.
translation:
  language: de
  text: Und er gestaltete sie als kunstvolle Anlagen[a], indem er ringsum große Säulen aufstellte. Auf den Säulen ließ er vollständige Rüstungen anbringen, zu ewigem Gedenken, und neben den Rüstungen Schiffe einmeißeln, damit sie von allen gesehen würden, die das Meer befuhren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: als kunstvolle Vorrichtungen; das griechische Wort bezeichnet etwas planvoll oder kunstreich Hergestelltes.'
    reason: Die genaue Art der mit μηχανήματα bezeichneten Ausgestaltung bleibt im Griechischen offen.
lexical_decisions:
- source_word: μηχανήματα
  choice: kunstvolle Anlagen
  rationale: Das Wort bezeichnet hier offenbar kunstreich entworfene bauliche oder dekorative Vorrichtungen. „Anlagen“ passt zum Grabmalzusammenhang, während „kunstvoll“ den Gedanken planvoller Ausgestaltung wiedergibt, ohne die konkrete Form übermäßig festzulegen.
- source_word: περιθεὶς στύλους μεγάλους
  choice: indem er ringsum hohe Säulen aufstellte
  rationale: περιτίθημι bezeichnet ein Umgeben oder ringsum Anordnen; μεγάλος wird bei Säulen idiomatisch als „hoch“ wiedergegeben.
- source_word: πανοπλίας
  choice: vollständige Rüstungen
  rationale: πανοπλία meint eine vollständige Waffenrüstung, nicht bloß einzelne Waffenstücke.
- source_word: εἰς ὄνομα αἰώνιον
  choice: zu ewigem Gedenken
  rationale: Die Wendung lautet wörtlich „zu einem ewigen Namen“, bezeichnet im monumentalen Kontext jedoch den bleibenden Nachruhm beziehungsweise das dauerhafte Andenken.
- source_word: πλοῖα ἐγγεγλυμμένα
  choice: eingravierte Schiffe
  rationale: Die passive Partizipialform beschreibt Schiffe, die als eingeschnittene oder eingemeißelte Darstellungen angebracht waren.
