  text: But when he came near to Baskama, he killed Jonathan, and he was buried there.
translation:
  language: de
  text: Als er sich aber Baskama näherte, tötete er Jonatan, und dieser wurde dort begraben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als ... aber
  rationale: Leitet das nächste Ereignis erzählerisch mit leichter Gegenüberstellung beziehungsweise Fortführung ein; die geteilte deutsche Konstruktion klingt natürlich.
- source_word: ἤγγισεν
  choice: er sich ... näherte
  rationale: Das Aoristverb ἐγγίζω bezeichnet das Herannahen an einen Ort; „sich näherte“ gibt die Bewegung klar und idiomatisch wieder.
- source_word: τῆς Βασκαμά
  choice: Baskama
  rationale: Der Ortsname wird in enger Anlehnung an die griechische Form transliteriert.
- source_word: ἀπέκτεινεν
  choice: tötete er
  rationale: Die direkte Wiedergabe bewahrt den schlichten Aussagegehalt, ohne eine förmliche Hinrichtung vorauszusetzen.
- source_word: τὸν Ἰωναθάν
  choice: Jonatan
  rationale: Verwendet die im modernen Deutschen übliche biblische Namensform.
- source_word: ἐτάφη
  choice: dieser wurde ... begraben
  rationale: Gibt den passiven Aorist von θάπτω schlicht wieder; „dieser“ macht den grammatisch gemeinten Bezug auf Jonatan im Deutschen eindeutig.
- source_word: ἐκεῖ
  choice: dort
  rationale: Natürliche und genaue Wiedergabe des Ortsadverbs.
theological_decisions: []
