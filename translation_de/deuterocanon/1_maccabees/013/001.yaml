  yaml_path: translation/deuterocanon/1_maccabees/013/001.yaml
  text: And Simon heard that Tryphon was gathering a large force to come into the land of Judah and destroy it[a].
translation:
  language: de
  text: Und Simon hörte, dass Tryphon eine große Streitmacht zusammenzog, um in das Land Juda zu kommen und es zu vernichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land Judäa“. Im Griechischen steht „das Land Juda“; damit kann das historisch mit Juda verbundene Gebiet gemeint sein und nicht eine spätere administrative Bezeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte
  rationale: Die Aoristform von ἀκούω führt hier eine erhaltene Nachricht ein. „Hörte“ gibt dies unmittelbar wieder, ohne den Informationsweg näher auszudeuten.
- source_word: συνῆγεν
  choice: zog … zusammen
  rationale: Der Imperfekt bezeichnet einen noch andauernden Vorgang. „Eine Streitmacht zusammenziehen“ ist im Deutschen eine natürliche militärische Wendung und bewahrt diesen Verlaufsaspekt.
- source_word: δύναμιν πολλὴν
  choice: eine große Streitmacht
  rationale: δύναμις bezeichnet im militärischen Zusammenhang bewaffnete Kräfte. „Streitmacht“ ist präzise, ohne eine formale Heeresstruktur vorauszusetzen.
- source_word: τοῦ ἐλθεῖν εἰς
  choice: um … einzufallen
  rationale: Der artikulierte Infinitiv bezeichnet hier die Absicht. In Verbindung mit dem feindlichen Vorgehen gegen ein Land gibt „einfallen“ die gerichtete Bewegung idiomatisch wieder; die Zweckbeziehung bleibt durch „um“ ausdrücklich erhalten.
- source_word: γῆν Ἰούδα
  choice: das Land Juda
  rationale: Die Formulierung folgt dem griechischen γῆν Ἰούδα eng und wahrt den historisch-geografischen Bezug auf Juda, ohne die spätere Verwaltungsterminologie „Judäa“ in den Haupttext einzutragen.
- source_word: τοῦ ἐκτρῖψαι αὐτήν
  choice: und es zu vernichten
  rationale: Der zweite artikulierte Infinitiv bezeichnet ebenfalls Tryphons Absicht. ἐκτρίβω drückt hier vollständige Zerstörung aus; „vernichten“ bewahrt die Stärke des Ausdrucks. Das Pronomen „es“ bezieht sich grammatisch auf „das Land“.
