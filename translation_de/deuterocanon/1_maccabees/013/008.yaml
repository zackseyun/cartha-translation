  text: And they answered with a loud voice, saying, “You are our leader in place of Judas and Jonathan your brother.”
translation:
  language: de
  text: 'Und sie antworteten mit lauter Stimme: »Du bist unser Anführer anstelle von Judas und deinem Bruder Jonatan.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: sie antworteten
  rationale: Direkte und natürliche Wiedergabe des erzählenden Aorists von ἀποκρίνομαι.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Bewahrt den konkreten Ausdruck der griechischen Dativverbindung und klingt im Deutschen würdig und natürlich.
- source_word: ἡγούμενος
  choice: Anführer
  rationale: Bezeichnet hier denjenigen, der das Volk politisch und militärisch führt, ohne ein engeres förmliches Amt wie Herrscher, Statthalter oder Befehlshaber festzulegen.
- source_word: ἀντί
  choice: anstelle von
  rationale: Drückt Stellvertretung beziehungsweise Nachfolge aus, ohne die Nachfolgeregelung näher zu bestimmen.
- source_word: Ἰούδου
  choice: Judas
  rationale: Die im Deutschen für Judas Makkabäus gebräuchliche Namensform.
- source_word: Ἰωνάθου
  choice: Jonatan
  rationale: Gängige moderne deutsche Form des biblischen Personennamens.
- source_word: τοῦ ἀδελφοῦ σου
  choice: deinem Bruder
  rationale: Die Genitiv-Apposition bezieht die Bezeichnung ‚dein Bruder‘ ausdrücklich auf Jonatan; die deutsche Kasusfügung folgt ‚anstelle von‘.
theological_decisions:
- issue: Art von Simons Stellung, bezeichnet durch ἡγούμενος
  choice: Anführer
  alternative: Herrscher; Statthalter; Befehlshaber
  rationale: Der Vers erkennt Simons umfassende Führungsrolle nach Judas und Jonatan an. Der griechische Ausdruck legt jedoch weder ein königliches Amt noch ausschließlich militärische Befehlsgewalt fest.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählstil. Die einleitende Partizipialform λέγοντες wird im Deutschen idiomatisch durch den Doppelpunkt wiedergegeben. Keine Fußnoten erforderlich.
