  text: In those days he encamped against Gaza and surrounded it with encampments[a], and he made a siege engine and brought it up to the city, and he struck one tower and captured it.
translation:
  language: de
  text: In jenen Tagen schlug er sein Lager gegen Gaza auf und umgab die Stadt mit Heerlagern. Er baute eine Belagerungsmaschine[a], brachte sie an die Stadt heran, griff einen Turm an und nahm ihn ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet genauer eine Helepolis, eine Belagerungsmaschine zum Angriff auf befestigte Städte; ihre genaue Bauart bleibt hier offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Γάζαν
  choice: schlug er sein Lager gegen Gaza auf
  rationale: Die Formulierung gibt den militärischen Sinn von παρεμβάλλω und die feindliche Ausrichtung von ἐπί wieder, ohne das Verb zum allgemeineren „zog gegen“ abzuschwächen.
- source_word: ἐκύκλωσεν αὐτὴν παρεμβολαῖς
  choice: umgab die Stadt mit Heerlagern
  rationale: „Umgab“ bewahrt die räumliche Bedeutung von ἐκύκλωσεν; „Heerlager“ kennzeichnet die παρεμβολαί als militärische Lager. „Die Stadt“ ersetzt das im Deutschen potenziell missverständliche Pronomen, ohne einen neuen Referenten einzuführen.
- source_word: ἑλέπολιν
  choice: Belagerungsmaschine
  rationale: ἑλέπολις bezeichnet eine zum Angriff auf befestigte Städte bestimmte Maschine. „Belagerungsmaschine“ ist verständlich und präzise genug, ohne eine technisch nicht sicher bestimmbare Bauart festzulegen.
- source_word: προσήγαγεν τῇ πόλει
  choice: brachte sie an die Stadt heran
  rationale: Dies gibt die gerichtete Annäherung der Maschine an die Stadt in natürlichem modernem Deutsch wieder.
- source_word: ἐπάταξεν πύργον ἕνα
  choice: schlug gegen einen Turm
  rationale: „Schlug gegen“ wahrt die konkrete Gewalteinwirkung von πατάσσω und vermeidet die unbelegte Ergänzung, der Turm sei dabei eingestürzt.
- source_word: κατελάβετο
  choice: nahm ihn ein
  rationale: Im militärischen Zusammenhang bedeutet das Verb, etwas in Besitz zu nehmen. Das maskuline Pronomen bezieht sich im fortlaufenden deutschen Satz am natürlichsten auf den zuvor genannten Turm, während eine Fußnote die im Griechischen mögliche implizite Ergänzung erläutert.
