  terminology: „Heerlager“ und „Belagerungsmaschine“ sind angemessen. Die Anmerkung zu ἑλέπολις wahrt zutreffend, dass der griechische Begriff spezifischer ist, ohne eine unsichere technische Identifikation vorzuschreiben. Für κατελάβετο ist der Turm aufgrund des unmittelbaren Kontextes der naheliegende implizite Bezug; eine Fußnote, die die Einnahme der ganzen Stadt als gleichwertige Möglichkeit hervorhebt, ist daher nicht erforderlich.
