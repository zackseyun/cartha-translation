  source_fidelity: 'Die Hauptabweichung betrifft ἐκύκλωσεν ὁδὸν τὴν εἰς Ἄδωρά: „zog auf einem Umweg über die Straße“ gibt weder das Umkreisen/Umzingeln noch die Straße als Objekt wieder und führt eine nicht gesicherte Bewegungsroute ein. Die übrigen Aussagen sind grundsätzlich quellentreu. Die Gegenbewegung Simons sollte ohne Festlegung auf eine konkrete Seitenposition wiedergegeben werden.'
  naturalness: Die bisherige Formulierung „hielten ihm … auf der gegenüberliegenden Seite Schritt“ ist verständlich, aber schwerfällig und legt eine räumliche Anordnung stärker fest, als der griechische Ausdruck erfordert. Die Revision bleibt idiomatisches modernes Standarddeutsch und bewahrt die militärisch-narrative Kürze.
  terminology: „in die Stadt einzudringen“, „vernichten“, „Heer“ und die Namensform „Tryphon“/„Adora“ sind vertretbar. „Umzingelte die Straße“ ist absichtlich nah am ungewöhnlichen griechischen Bild; die Fußnote erläutert die mögliche militärische Funktion, ohne sie als sichere Deutung auszugeben.
  issues:
