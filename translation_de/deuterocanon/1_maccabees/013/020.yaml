    issue: Die Wiedergabe von ἐκύκλωσεν ὁδὸν als „Er zog auf einem Umweg über die Straße nach Adora“ ist nicht quellentreu.
    rationale: ἐκύκλωσεν hat hier „umkreisen/umzingeln“ als Grundbedeutung, während „auf einem Umweg über“ eine eigenständige, im Text nicht ausgesagte Interpretation der Route ist. Die Straße nach Adora ist grammatisch Objekt des Verbs, nicht ausdrücklich die von Tryphon benutzte Wegstrecke.
  - severity: medium
    issue: „auf der gegenüberliegenden Seite Schritt halten“ überbestimmt ἀντιπαρῆγεν.
    rationale: Der Ausdruck bezeichnet eine entsprechende Gegen- bzw. Parallelbewegung, doch der griechische Text nennt keine bestimmte „gegenüberliegende Seite“. Eine Formulierung mit „entgegenziehen“ bewahrt die Opposition, ohne die taktische Geometrie festzulegen.
