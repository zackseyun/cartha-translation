  text: And after these things Tryphon came to enter the city and wipe it out[a], and he encircled the road to Adora[b]; and Simon and his camp marched opposite him to every place where he went.
translation:
  language: de
  text: Danach kam Tryphon, um in die Stadt einzudringen und sie zu vernichten. Er umzingelte die Straße nach Adora[a]. Simon aber und sein Heer zogen ihm zu jedem Ort entgegen, wohin er zog[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er umzingelte die Straße nach Adora.“ Dies kann ein militärisches Manöver bezeichnen, das den Zugang über diese Straße abschnitt oder kontrollierte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zogen parallel zu ihm“ oder „bewegten sich ihm gegenüber“. Das griechische Verb bezeichnet eine entsprechende Gegenbewegung; die genaue taktische Anordnung bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Danach
  rationale: Gibt den zeitlichen Übergang knapp und natürlich wieder.
- source_word: τοῦ ἐμβατεῦσαι εἰς τὴν πόλιν
  choice: um in die Stadt einzudringen
  rationale: Der Infinitiv mit τοῦ bezeichnet hier den Zweck. „Eindringen“ wahrt das Betreten der Stadt und lässt im militärischen Zusammenhang die feindliche Absicht erkennen.
- source_word: ἐκτρῖψαι αὐτήν
  choice: sie zu vernichten
  rationale: ἐκτρίβω bezeichnet in diesem militärischen Kontext die vollständige Zerstörung; „vernichten“ bewahrt diese Stärke in würdigem, modernem Deutsch.
- source_word: ἐκύκλωσεν ὁδὸν τὴν εἰς Ἄδωρά
  choice: Er zog auf einem Umweg über die Straße nach Adora
  rationale: Die ungewöhnliche Verbindung von ἐκύκλωσεν mit ὁδόν beschreibt wahrscheinlich eine kreisende beziehungsweise ausweichende Wegführung. Die Fußnote bewahrt die wörtlichere Möglichkeit.
- source_word: Ἄδωρά
  choice: Adora
  rationale: Der griechische Ortsname wird direkt transkribiert.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: sein Heer
  rationale: παρεμβολή kann sowohl das Lager als auch die dort versammelte Streitmacht bezeichnen; da diese marschiert, ist „Heer“ im Deutschen klarer und natürlicher.
- source_word: ἀντιπαρῆγεν αὐτῷ
  choice: hielten ihm … auf der gegenüberliegenden Seite Schritt
  rationale: Die Formulierung gibt die taktisch parallele Gegenbewegung wieder, ohne einen unmittelbaren Angriff zu behaupten.
- source_word: εἰς πάντα τόπον οὗ ἐπορεύετο
  choice: überall, wohin er zog
  rationale: Natürliches Deutsch für das wiederholte Nachvollziehen von Tryphons Bewegungen; „zog“ passt zum militärischen Zusammenhang.
