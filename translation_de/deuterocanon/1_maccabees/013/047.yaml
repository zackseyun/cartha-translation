base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/047.yaml
  text: And Simon came to terms with them and did not fight against them[a]. He drove them out of the city and cleansed the houses in which the idols were[b], and so he entered it with hymns and blessings.
translation:
  language: de
  text: Simon kam mit ihnen überein und kämpfte nicht gegen sie.[a] Er vertrieb sie aus der Stadt und reinigte die Häuser, in denen sich die Götzenbilder befanden.[b] So zog er unter Lobgesängen und Segensrufen in die Stadt ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Simon traf eine Vereinbarung mit ihnen.“ Das griechische Partizip bezeichnet hier wahrscheinlich eine Verständigung, durch die ein Kampf vermieden wurde.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Häuser, in denen Götzenbilder aufgestellt oder aufbewahrt waren. Die Reinigung war daher wohl religiös und nicht nur äußerlich.
    reason: cultural_note
lexical_decisions:
- source_word: συνευδὼν
  choice: kam mit ihnen überein
  rationale: Das Partizip bezeichnet im Zusammenhang eine Verständigung oder praktische Übereinkunft mit den Bewohnern. Die Formulierung wahrt diesen versöhnlichen Zug, ohne eine förmliche Vertragsform zu behaupten.
- source_word: ἐπολέμησεν
  choice: kämpfte ... gegen
  rationale: Die Wendung gibt den militärischen Sinn des Verbs in natürlichem modernem Deutsch wieder.
- source_word: ἐξέβαλεν
  choice: vertrieb
  rationale: Das Verb bezeichnet ein nachdrückliches Hinaustreiben; „vertrieb“ passt zum militärisch-politischen Zusammenhang.
- source_word: ἐκαθάρισεν
  choice: reinigte
  rationale: Wegen der erwähnten Götzenbilder hat die Reinigung neben der gegenständlichen auch eine religiöse Dimension.
- source_word: τὰ εἴδωλα
  choice: die Götzenbilder
  rationale: Gemeint sind heidnische Kultbilder. „Götzenbilder“ ist genauer als das allgemeinere „Bilder“ und bezeichnet konkrete Gegenstände.
- source_word: ὑμνῶν
  choice: unter Lobgesängen
  rationale: Die Wiedergabe bewahrt den festlichen und liturgischen Charakter des singenden Lobens und beschreibt idiomatisch die Art seines Einzugs.
- source_word: εὐλογῶν
  choice: unter ... Segensrufen
  rationale: „Segensrufe“ bewahrt die Bedeutung des Segnens beziehungsweise Preisens, ohne das im Griechischen unausgesprochene Objekt ausdrücklich als Gott festzulegen.
theological_decisions:
- issue: Religiöse Bedeutung der Reinigung von Häusern mit Götzenbildern
  choice: ἐκαθάρισεν wird mit „reinigte“ wiedergegeben.
  alternative: säuberte; machte rein
  rationale: Der Zusammenhang deutet auf die Beseitigung götzendienerischer Verunreinigung, ohne dass der Text einen näher bestimmten späteren Reinigungsritus nennt.
- issue: Unausgesprochenes Objekt von εὐλογῶν
  choice: Die objektneutrale Formulierung „Segensrufe“ wird verwendet.
  alternative: Gott preisend; Gott segnend
  rationale: Das Preisen Gottes liegt im festlichen Zusammenhang nahe, doch nennt der griechische Text kein Objekt. Die Übersetzung soll diese Offenheit nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kam mit ihnen überein“ hält den erzählerischen Ton und die mögliche Bandbreite zwischen Verständigung und Vereinbarung offen. „Unter Lobgesängen und Segensrufen“ gibt die beiden griechischen Partizipien parallel und festlich wieder, ohne ein nicht genanntes Objekt zu ergänzen.
