  text: And those in the siege tower went out into the city[a], and there was a great commotion in the city.
translation:
  language: de
  text: Da sprangen die Männer im Belagerungsturm in die Stadt hinein, und in der Stadt entstand große Unruhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »große Aufregung«, »großer Aufruhr«; das griechische Wort kann allgemein eine Bewegung, Erregung oder Unruhe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήλοντο
  choice: sprangen … hinein
  rationale: Die Form gehört zu ἐξάλλομαι und bezeichnet hier eine rasche, sprungartige Bewegung aus dem Belagerungsturm in die Stadt. „Sprangen … hinein“ gibt diese gegenüber einem bloßen „gingen hinaus“ stärkere Bedeutung wieder.
- source_word: οἱ ἐν τῇ ἑλεπόλει
  choice: die Männer im Belagerungsturm
  rationale: ἑλέπολις bezeichnet eine Belagerungsmaschine, besonders einen Belagerungsturm. „Die Männer“ ist im militärischen Zusammenhang eine natürliche Wiedergabe der substantivierten Wendung οἱ ἐν.
- source_word: εἰς τὴν πόλιν
  choice: in die Stadt hinein
  rationale: Die Präposition εἰς bezeichnet die Bewegung in die Stadt. „Hinein“ macht die von „sprangen“ abhängige Richtung im Deutschen eindeutig.
- source_word: ἐγένετο κίνημα μέγα
  choice: entstand große Unruhe
  rationale: κίνημα kann Bewegung, Erregung oder Unruhe bezeichnen. Im erzählerischen Zusammenhang meint es wahrscheinlich eine heftige allgemeine Unruhe, ohne Art oder Ursache genauer festzulegen.
