base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/034.yaml
  text: And Simon chose men and sent them to Demetrius the king to grant remission to the land[a], because all the acts of Tryphon were acts of plundering.
translation:
  language: de
  text: Simon wählte Männer aus und sandte sie zu König Demetrius, damit er dem Land Erlass gewähre[a]; denn alle Taten Tryphons waren Plünderungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann Freilassung, Befreiung oder Erlass bedeuten. Hier ist wahrscheinlich ein administrativer oder fiskalischer Erlass gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελέξατο
  choice: wählte … aus
  rationale: Die mediale Form bedeutet hier schlicht „auswählen“; die deutsche Verbklammer gibt dies natürlich und präzise wieder.
- source_word: ἄνδρας
  choice: Männer
  rationale: Der griechische Ausdruck bezeichnet ausdrücklich erwachsene männliche Personen, die offenbar als Abgesandte dienen.
- source_word: ἀπέστειλεν πρὸς Δημήτριον τὸν βασιλέα
  choice: sandte sie zu König Demetrius
  rationale: Das im Deutschen nötige Objekt „sie“ ergibt sich aus den zuvor ausgewählten Männern; „König Demetrius“ ist die natürliche deutsche Titelform.
- source_word: τοῦ ποιῆσαι ἄφεσιν τῇ χώρᾳ
  choice: damit er dem Land die Abgaben erlasse
  rationale: ἄφεσις bezeichnet Erlass oder Befreiung. Im politischen und fiskalischen Zusammenhang ist ein Erlass von Abgaben wahrscheinlich; die Ergänzung wird durch eine Fußnote als kontextuelle Deutung kenntlich gemacht.
- source_word: χώρᾳ
  choice: dem Land
  rationale: χώρα bezeichnet hier das beherrschte Land beziehungsweise Gebiet; „Land“ passt zum politischen Zusammenhang und bleibt allgemein.
- source_word: πᾶσαι αἱ πράξεις Τρύφωνος
  choice: alle Maßnahmen Tryphons
  rationale: πράξεις kann Taten, Handlungen oder Vorgehensweisen bezeichnen. „Maßnahmen“ passt zum administrativ-politischen Zusammenhang, ohne die folgende negative Bewertung vorwegzunehmen.
- source_word: ἦσαν ἁρπασίαι
  choice: waren Plünderungen
  rationale: ἁρπασίαι bezeichnet gewaltsame Wegnahme, Raub oder Plünderung; „Plünderungen“ ist klar, würdig und bewahrt den pluralischen Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fiskalische Deutung von ἄφεσις wird im Text verständlich ausgedrückt, aber wegen der allgemeineren Bedeutung des griechischen Wortes in der Fußnote transparent gemacht.
