  text: 'And King Demetrius sent to him according to these words[a], and answered him, and wrote to him a letter like this:'
translation:
  language: de
  text: 'Und König Demetrius ließ ihm eine Antwort zukommen und schrieb ihm folgenden Brief:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν αὐτῷ
  choice: ließ ihm … zukommen
  rationale: Gibt das Senden an den genannten Empfänger in natürlichem, modernem Deutsch wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt festzulegen.
- source_word: Δημήτριος ὁ βασιλεύς
  choice: König Demetrius
  rationale: Die im Deutschen übliche Stellung des Herrschertitels vor dem Namen bewahrt Bedeutung und Erzählstil.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: in dieser Angelegenheit
  rationale: λόγοι kann hier auf die zuvor vorgebrachten Worte beziehungsweise das darin formulierte Anliegen verweisen. Die Wendung gibt den kontextuellen Bezug wieder, ohne sie fälschlich als Beginn des nachfolgenden Briefwortlauts zu behandeln.
- source_word: ἀπεκρίθη αὐτῷ
  choice: eine Antwort
  rationale: Das substantivische Deutsch verbindet das Antworten idiomatisch mit ἀπέστειλεν, während der folgende Satzteil ausdrücklich erklärt, dass die Antwort schriftlich erfolgte.
- source_word: ἔγραψεν αὐτῷ ἐπιστολήν
  choice: schrieb ihm … Brief
  rationale: Direkte und natürliche Wiedergabe der griechischen Empfängerkonstruktion und des ausdrücklich genannten Briefes.
- source_word: τοιαύτην
  choice: folgenden
  rationale: Leitet idiomatisch den unmittelbar anschließenden Wortlaut des Briefes ein.
