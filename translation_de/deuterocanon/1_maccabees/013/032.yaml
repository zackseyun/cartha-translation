  text: And he reigned in his place[a], and put on the crown of Asia[b], and inflicted a great blow on the land.
translation:
  language: de
  text: Und er wurde an seiner Stelle König, setzte sich das Diadem Asiens auf und richtete im Land großen Schaden an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »versetzte dem Land einen schweren Schlag«; die griechische Wendung bezeichnet schwere Schädigung oder Verwüstung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  choice: wurde an seiner Stelle König
  rationale: Die Formulierung gibt sowohl das Königtum als auch die durch ἀντί ausgedrückte Nachfolge beziehungsweise Ersetzung natürlich wieder, ohne bloß eine zeitliche Abfolge zu behaupten.
- source_word: περιέθετο
  choice: setzte sich ... auf
  rationale: Das Medium bezeichnet hier konkret, dass er sich selbst das königliche Zeichen anlegte; die deutsche Wendung bewahrt dieses Bild.
- source_word: τὸ διάδημα
  choice: das Diadem
  rationale: „Diadem“ bezeichnet genauer als „Krone“ das königliche Stirnband beziehungsweise Herrschaftszeichen und ist im Deutschen verständlich.
- source_word: τῆς Ἀσίας
  choice: Asiens
  rationale: Die knappe Genitivverbindung entspricht dem Griechischen und vermeidet eine über den Wortlaut hinausgehende Festlegung auf Kleinasien oder das Seleukidenreich.
- source_word: ἐποίησεν πληγὴν μεγάλην
  choice: richtete ... großen Schaden an
  rationale: Die idiomatische Wiedergabe bezeichnet schwere Schädigung oder Verwüstung, ohne πληγή unnötig als Seuche oder als einzelnen militärischen Schlag festzulegen.
- source_word: ἐπὶ τῆς γῆς
  choice: im Land
  rationale: Im politischen und militärischen Zusammenhang ist die regionale Bedeutung von γῆ wahrscheinlicher als „Erde“; „im Land“ ist natürliches modernes Deutsch.
theological_decisions: []
