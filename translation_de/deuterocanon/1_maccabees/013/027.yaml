  yaml_path: translation/deuterocanon/1_maccabees/013/027.yaml
  text: And Simon built over the tomb of his father and his brothers[a], and he raised it high to be seen[b], with dressed stone at the back and at the front.
translation:
  language: de
  text: Und Simon baute über dem Grab seines Vaters und seiner Brüder und ließ es hoch aufragen, sodass es ins Auge fiel[a], mit bearbeitetem Stein[b] an der Rückseite und an der Vorderseite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seiner Erscheinung“. Die griechische Wendung kann das Grabmal als weithin sichtbar oder als besonders eindrucksvoll beschreiben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit geglättetem Stein“ beziehungsweise „mit poliertem Stein“. Das griechische Wort bezeichnet Stein, der glatt geschabt oder sonst sorgfältig bearbeitet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: baute
  rationale: Das gewöhnliche deutsche Verb gibt den Aorist von οἰκοδομέω schlicht und unmittelbar wieder.
- source_word: ἐπὶ τὸν τάφον
  choice: über dem Grab
  rationale: ἐπί mit Akkusativ bezeichnet hier die Errichtung eines Grabmals über beziehungsweise auf der Grabstätte.
- source_word: ὕψωσεν αὐτόν
  choice: ließ es hoch aufragen
  rationale: Die Formulierung bewahrt den konkreten räumlichen Sinn von ὑψόω und klingt bei einem Grabmonument natürlich.
- source_word: τῇ ὁράσει
  choice: sodass es ins Auge fiel
  rationale: Die Wendung beschreibt wahrscheinlich die sichtbare, auffällige Erscheinung des erhöhten Bauwerks, ohne den knappen griechischen Ausdruck als bloße Höhenangabe zu behandeln.
- source_word: λίθῳ ξυστῷ
  choice: mit behauenem Stein
  rationale: ξυστός bezeichnet geglätteten beziehungsweise sorgfältig bearbeiteten Stein; „behauen“ ist im Deutschen eine geläufige architektonische Bezeichnung und behauptet keine glänzende Politur.
- source_word: ἐκ τῶν ὄπισθεν καὶ ἐκ τῶν ἔμπροσθεν
  choice: an der Rückseite und an der Vorderseite
  rationale: Die paarige Ortsangabe wird klar und vollständig wiedergegeben; die Wiederholung von „an der“ wahrt die beidseitige Beschreibung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Parataxenstil; „ins Auge fiel“ macht die visuelle Wirkung verständlich, während die Fußnote die genuine Mehrdeutigkeit von τῇ ὁράσει offenhält.
