base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/053.yaml
  text: And Simon saw that John his son was a man[a], and he appointed him commander over all the forces; and he lived in Gazara.
translation:
  language: de
  text: Und Simon sah, dass sein Sohn Johannes ein Mann war, und setzte ihn als Befehlshaber über alle Truppen ein; und er wohnte in Gazara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara ist die griechische Namensform des Ortes, der gewöhnlich als Gezer bekannt ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: ein Mann
  rationale: Die Formulierung bewahrt den griechischen Wortlaut und kann sowohl das erreichte Mannesalter als auch erwiesene Reife und Tüchtigkeit bezeichnen; die anschließende Ernennung verdeutlicht die praktische Folge.
- source_word: ἔθετο
  choice: setzte ihn ... ein
  rationale: Im Zusammenhang mit der Übertragung eines militärischen Amtes gibt diese idiomatische deutsche Wendung den Sinn natürlicher wieder als ein wörtliches „stellte“ oder „setzte“.
- source_word: ἡγούμενον
  choice: Befehlshaber
  rationale: In Verbindung mit „allen Truppen“ bezeichnet das Partizip eindeutig eine militärische Führungsstellung.
- source_word: τῶν δυνάμεων πάσων
  choice: über alle Truppen
  rationale: δυνάμεις meint hier die militärischen Streitkräfte; „Truppen“ ist im Deutschen klar und natürlich.
- source_word: ᾤκει
  choice: er wohnte
  rationale: Der Imperfekt bezeichnet einen fortdauernden Aufenthalt. Das Pronomen lässt wie im Griechischen offen, ob Simon oder Johannes gemeint ist.
- source_word: ἐν Γαζάροις
  choice: in Gazara
  rationale: Der Ortsname wird nach seiner griechischen Form wiedergegeben; die geläufigere Bezeichnung Gezer steht in der Fußnote.
