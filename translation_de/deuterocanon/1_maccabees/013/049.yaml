  yaml_path: translation/deuterocanon/1_maccabees/013/049.yaml
  text: But those in the citadel at Jerusalem were prevented from going out into the country and from buying and selling[a]; and they became very hungry[b], and many of them perished from famine.
translation:
  language: de
  text: Diejenigen in der Zitadelle von Jerusalem[a] wurden jedoch daran gehindert, ins Umland hinauszugehen sowie zu kaufen und zu verkaufen.[b] Sie litten sehr unter Hunger, und viele von ihnen kamen durch die Hungersnot um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Akra von Jerusalem“. Das griechische Wort ἄκρα kann als Gattungsbezeichnung („Zitadelle“) oder als Name der seleukidischen Festung in Jerusalem verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Im griechischen Text steht vor „kaufen und verkaufen“ zweimal „und“ (καὶ καὶ). Der Sinn ist dennoch klar; wahrscheinlich handelt es sich um eine Abschreib- oder Überlieferungswiederholung.
    reason: textual_variant
lexical_decisions:
- source_word: ἄκρας
  choice: Zitadelle
  rationale: ἄκρα bezeichnet hier die befestigte Anhöhe beziehungsweise seleukidische Festung in Jerusalem. „Zitadelle“ gibt die Funktion im Haupttext verständlich wieder; die mögliche Auffassung als Eigenname „Akra“ bleibt in der Fußnote erhalten.
- source_word: ἐκωλύοντο
  choice: wurden daran gehindert
  rationale: Die passive Imperfektform beschreibt eine fortdauernde äußere Behinderung beziehungsweise Abriegelung.
- source_word: ἐκπορεύεσθαι εἰς τὴν χώραν
  choice: ins Umland hinauszugehen
  rationale: χώρα meint in diesem Zusammenhang das Gebiet beziehungsweise Land außerhalb der Stadt. „Umland“ macht den räumlichen Bezug natürlich und präzise deutlich.
- source_word: ἀγοράζειν καὶ πωλεῖν
  choice: zu kaufen und zu verkaufen
  rationale: Die beiden konkreten Handelstätigkeiten werden entsprechend dem Griechischen einzeln wiedergegeben und nicht zum allgemeineren „Handel treiben“ zusammengezogen.
- source_word: ἐπείνασαν σφόδρα
  choice: litten sie großen Hunger
  rationale: Die Formulierung gibt die erhebliche Intensität von σφόδρα idiomatisch wieder, ohne über die Aussage hinauszugehen.
- source_word: ἱκανοὶ
  choice: eine beträchtliche Zahl
  rationale: ἱκανοί bezeichnet hier eine erhebliche, aber unbestimmte Anzahl. Diese Wiedergabe bewahrt diese Abstufung genauer als das schlichte „viele“.
- source_word: ἀπώλοντο ... τῷ λιμῷ
  choice: kam durch die Hungersnot um
  rationale: Im Zusammenhang bezeichnet ἀπόλλυμαι den Tod; λιμός benennt die durch die Abriegelung entstandene Hungersnot.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle historische Prosa. „Umland“ ist für heutige Leser natürlicher als „Land“ und bezeichnet hier die Umgebung außerhalb Jerusalems. Die Wiederholung καὶ καὶ wird nicht in den Haupttext übernommen, sondern transparent in einer Fußnote dokumentiert.
