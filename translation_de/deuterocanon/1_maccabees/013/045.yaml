  footnotes:
  - marker: a
    text: 'Wörtlich: »ihnen rechte Hände zu geben«. Gemeint ist eine verbindliche Zusage, möglicherweise eine Friedensvereinbarung oder sicheres Geleit.'
    reason: lexical_alternative
  - marker: b
    text: Das Zerreißen der Kleider war ein Zeichen von Trauer, Bedrängnis oder dringlichem Flehen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν οἱ ἐν τῇ πόλει
  choice: Da stiegen die Menschen in der Stadt ... auf die Mauer
  rationale: Das Verb bezeichnet eine Aufwärtsbewegung; die substantivische Wendung wird im Deutschen natürlich kollektiv mit „die Menschen in der Stadt“ wiedergegeben.
- source_word: σὺν ταῖς γυναιξὶ καὶ τοῖς τέκνοις
  choice: mit ihren Frauen und Kindern
  rationale: Im Belagerungskontext liegt der relationale Sinn „ihre Frauen und Kinder“ nahe; „Frauen“ bewahrt zugleich die mögliche Bedeutung „Ehefrauen“ ohne unnötige Festlegung.
- source_word: διερρωχότες τὰ ἱμάτια αὐτῶν
  choice: Sie hatten ihre Kleider zerrissen
  rationale: Das Perfektpartizip beschreibt den aus dem Zerreißen hervorgegangenen Zustand. Ein eigener deutscher Satz ist klar und bewahrt die zeitliche Vorordnung.
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: riefen laut
  rationale: Dies gibt die emphatische griechische Wendung in natürlichem, würdigem Gegenwartsdeutsch wieder.
- source_word: ἀξιοῦντες
  choice: Sie baten
  rationale: Im Kontext handelt es sich um eine eindringliche Bitte; „baten“ vermeidet sowohl die Abschwächung zu bloßem Fragen als auch die Übersteigerung zu einer Forderung.
- source_word: δεξιὰς αὐτοῖς δοῦναι
  choice: ihnen die rechte Hand zu geben
  rationale: Die konkrete Bildsprache des griechischen Idioms bleibt im Haupttext sichtbar; sein Sinn als Zusage, Gewähr oder Friedensangebot wird in der Fußnote erläutert.
theological_decisions:
- issue: Bedeutung des Idioms δεξιὰς ... δοῦναι im Zusammenhang einer militärischen Übergabe
  choice: Das wörtliche Bild „ihnen die rechte Hand zu geben“ bleibt im Haupttext erhalten.
  alternative: ihnen eine Zusicherung zu geben; ihnen Frieden zuzusichern; ihnen Friedensbedingungen zu gewähren
  rationale: Das Griechische verwendet den Plural „rechte Hände“ idiomatisch für eine verbindliche Zusage beziehungsweise friedliche Vereinbarung. Da die genaue Reichweite zwischen Treueversprechen, sicherem Geleit und Friedensbedingungen offenbleibt, wird sie nicht stillschweigend verengt.
