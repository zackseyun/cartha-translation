translation:
  language: de
  text: Da stiegen die Menschen in der Stadt mit ihren Frauen und Kindern auf die Mauer. Sie hatten ihre Kleider zerrissen[b] und riefen laut. Sie baten Simon, ihnen die rechten Hände zu reichen.[a]
