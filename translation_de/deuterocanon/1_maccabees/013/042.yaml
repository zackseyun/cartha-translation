  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Satzbau und die wesentlichen Elemente des griechischen Textes zutreffend wieder: den Beginn einer Praxis, die Schriftstücke und Verträge sowie die knappe Datierungsformel mit Simons drei Titeln. Die Wiedergabe von ἐπὶ Σίμωνος als „Simons“ ist in einer Datierungsformel möglich und bewahrt deren Kürze.'
  naturalness: „Volk Israel“, „Urkunden und Verträgen“ und die vorangestellte Datierungsformel sind natürliches, würdiges modernes Standarddeutsch. Die Personenbezeichnung „Führer“ ist jedoch im heutigen Deutschen wegen ihrer stark belasteten politischen Konnotation nicht die unmarkierte natürliche Wiedergabe von ἡγούμενος.
  terminology: ἀρχιερεύς sollte als Substantiv „Hohepriester“ erscheinen; μεγάλου qualifiziert diesen Titel daher als „großen Hohepriesters“. Für ἡγούμενος ist „Anführer“ eine sachliche, nicht institutionell überpräzisierende Wiedergabe. Die Fußnote zu „Juden/Judäer“ wahrt die lexikalische Alternative angemessen.
  issues:
