base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/042.yaml
  text: And the people of Israel began to write in documents and contracts[a], “Year one of Simon, the great high priest and general and leader of the Jews.”
translation:
  language: de
  text: 'Und das Volk Israel begann, in Urkunden und Verträgen zu schreiben: »Im ersten Jahr Simons, des großen Hohepriesters, Heerführers und Anführers der Juden[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Judäer«. Das griechische Ethnonym kann sowohl die Juden im weiteren Sinn als auch die Menschen aus Judäa im engeren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: begann
  rationale: Der Aorist markiert den Beginn einer neuen Praxis; „begann“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: ὁ λαὸς Ἰσραήλ
  choice: das Volk Israel
  rationale: Bewahrt die ausdrückliche kollektive Bezeichnung und klingt im modernen biblischen Deutsch natürlich.
- source_word: γράφειν
  choice: zu schreiben
  rationale: Gibt den Infinitiv formal wieder; der folgende Wortlaut zeigt, dass es um eine Datierungsformel geht.
- source_word: ἐν ταῖς συγγραφαῖς
  choice: in Urkunden
  rationale: συγγραφή bezeichnet hier amtliche oder rechtlich relevante Schriftstücke; „Urkunden“ passt zum administrativen Zusammenhang.
- source_word: καὶ συναλλάγμασιν
  choice: und Verträgen
  rationale: συνάλλαγμα kann eine vertragliche Vereinbarung oder geschäftliche Abmachung bezeichnen; „Verträge“ ist präzise und verständlich.
- source_word: Ἔτους πρώτου
  choice: Im ersten Jahr
  rationale: Gibt die knappe amtliche Datierungsformel idiomatisch im Deutschen wieder.
- source_word: ἐπὶ Σίμωνος
  choice: Simons
  rationale: Der Genitiv in der Datierungsformel bezeichnet die nach Simon benannte Amts- oder Regierungszeit; „im ersten Jahr Simons“ bewahrt die formelhafte Kürze.
- source_word: ἀρχιερέως μεγάλου
  choice: des großen Hohenpriesters
  rationale: Beide Bestandteile des griechischen Titels werden ausdrücklich wiedergegeben.
- source_word: στρατηγοῦ
  choice: Heerführers
  rationale: Bezeichnet Simons militärische Führungsstellung; „Heerführer“ ist würdig und weniger an moderne Dienstgrade gebunden als „General“.
- source_word: ἡγουμένου
  choice: Führers
  rationale: Bewahrt die allgemeine Bedeutung einer leitenden oder regierenden Person, ohne ein bestimmtes Verfassungsamt vorauszusetzen.
- source_word: Ἰουδαίων
  choice: der Juden
  rationale: Das Ethnonym bezeichnet hier wahrscheinlich das jüdische Volk als politisches Kollektiv; die geografisch-politische Alternative „Judäer“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von Ἰουδαίων in Simons Titel
  choice: der Juden
  alternative: der Judäer
  rationale: „Juden“ ist im Deutschen die natürliche Bezeichnung für das Volk als religiös-ethnisches und politisches Kollektiv. Da das griechische Ethnonym auch geografisch auf Judäer bezogen werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die amtliche Datierungsformel bleibt knapp; „Urkunden und Verträge“ macht den administrativ-rechtlichen Zusammenhang verständlich. Die Häufung der Titel wird entsprechend dem griechischen Text beibehalten.
