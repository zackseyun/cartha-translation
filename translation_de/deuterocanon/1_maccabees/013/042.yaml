    issue: „Hohenpriesters“ statt „Hohepriesters“
    rationale: Das deutsche Substantiv für ἀρχιερεύς lautet „Hohepriester“. Die vorliegende Form kann die Struktur des griechischen Titels unnötig verwischen; „großen Hohepriesters“ gibt klar wieder, dass μέγας den Titel qualifiziert.
  - severity: medium
    issue: „Führers“ für ἡγουμένου
    rationale: Obwohl die Grundbedeutung formal getroffen wird, ist „Führer“ im modernen Standarddeutschen stark historisch-politisch belastet. „Anführer“ gibt die allgemeine leitende Funktion wieder, ohne ein bestimmtes Amt oder eine ideologische Konnotation einzutragen.
