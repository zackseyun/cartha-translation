- from: 'Und das Volk Israel begann, in Urkunden und Verträgen zu schreiben: »Im ersten Jahr Simons, des großen Hohenpriesters, Heerführers und Führers der Juden[a].«'
  to: 'Und das Volk Israel begann, in Urkunden und Verträgen zu schreiben: »Im ersten Jahr Simons, des großen Hohepriesters, Heerführers und Anführers der Juden[a].«'
  rationale: Die Revision korrigiert die deutsche Titelform „Hohepriester“ und ersetzt das im heutigen Deutsch belastete „Führer“ durch „Anführer“. Die Datierungsformel, die Abfolge der Titel, die administrative Aussage und die belegte Mehrdeutigkeit von Ἰουδαῖοι bleiben unverändert.
