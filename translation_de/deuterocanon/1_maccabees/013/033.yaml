  text: And Simon built up the stronghold of Judea[a], and he surrounded it with high towers and great walls and gates and bars[b], and he placed provisions in the strongholds.
translation:
  language: de
  text: Und Simon baute die Festung Judäas und umgab sie mit hohen Türmen, mächtigen Mauern, Türmen[a], Toren und Riegeln. In den befestigten Anlagen lagerte er Vorräte[b] ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text werden die Türme in der Aufzählung zweimal genannt.
    reason: textual_form
  - marker: b
    text: 'Wörtlich: Nahrungsmittel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: baute … aus
  rationale: οἰκοδομέω bedeutet grundsätzlich „bauen“. „Ausbauen“ passt zum militärischen Zusammenhang und lässt offen, ob Simon neu baute oder eine bestehende Anlage verstärkte.
- source_word: τὸ ὀχύρωμα τῆς Ἰουδαίας
  choice: die Festung Judäas
  rationale: ὀχύρωμα bezeichnet einen befestigten Ort oder eine Festung. Der Singular und der Genitiv des griechischen Textes bleiben erhalten.
- source_word: περιετείχισεν
  choice: umgab sie
  rationale: Das Verb bezeichnet das Ummauern oder befestigte Umschließen; die folgenden Dative nennen die einzelnen Befestigungselemente.
- source_word: πύργοις ὑψηλοῖς
  choice: mit hohen Türmen
  rationale: Direkte und natürliche Wiedergabe der militärischen Architektur.
- source_word: τείχεσιν μεγάλοις
  choice: mächtigen Mauern
  rationale: τεῖχος bezeichnet besonders eine Schutz- oder Stadtmauer. „Mächtig“ gibt μέγας hier idiomatisch als Hinweis auf Größe und Stärke wieder.
- source_word: πύργοις καὶ πύλαις καὶ μοχλοῖς
  choice: Türmen, Toren und Riegeln
  rationale: Die erneute Nennung von πύργοις wird entsprechend dem überlieferten griechischen Text bewahrt. μοχλοί sind die Balken oder Riegel, mit denen Tore gesichert wurden.
- source_word: ἔθετο βρώματα
  choice: lagerte … Vorräte ein
  rationale: βρώματα bedeutet wörtlich „Speisen/Nahrungsmittel“. Im militärischen Zusammenhang bezeichnet es Lebensmittelvorräte; „einlagern“ gibt die beabsichtigte Aufbewahrung idiomatisch wieder.
- source_word: ἐν τοῖς ὀχυρώμασιν
  choice: in den befestigten Anlagen
  rationale: Der Plural des griechischen Textes wird bewahrt, ohne ihn an die eingangs genannte einzelne Festung anzugleichen.
