  text: And he gathered all the fighting men, and hastened to finish the walls of Jerusalem, and fortified it all around.
translation:
  language: de
  text: Und er versammelte alle kämpfenden Männer, beeilte sich, die Mauern Jerusalems fertigzustellen, und befestigte die Stadt ringsum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: versammelte
  rationale: Der Aorist von συνάγω bezeichnet hier das Zusammenrufen bzw. Zusammenführen von Männern zu einem militärischen Zweck; „versammelte“ ist natürlich und quellennah.
- source_word: πάντας τοὺς ἄνδρας τοὺς πολεμιστάς
  choice: alle kampffähigen Männer
  rationale: Die griechische Wendung ist ausdrücklich männlich und militärisch. „Kampffähige Männer“ gibt sowohl ἄνδρας als auch die attributive Bestimmung πολεμιστάς in verständlichem modernem Deutsch wieder.
- source_word: ἐτάχυνεν τοῦ τελέσαι
  choice: beeilte sich, … fertigzustellen
  rationale: ἐτάχυνεν drückt Eile aus; der artikulierte Infinitiv bezeichnet hier das rasch angestrebte Vollenden. Die deutsche Konstruktion ist idiomatisch und bewahrt den Handlungsdruck.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: die Mauern Jerusalems
  rationale: Die Genitivverbindung wird direkt wiedergegeben; „Mauern“ bezeichnet im Kontext die städtischen Befestigungsmauern.
- source_word: ὠχύρωσεν
  choice: befestigte
  rationale: Das Verb bezeichnet das militärische Sichern beziehungsweise Befestigen einer Stadt; „befestigte“ bewahrt diesen fachlichen Sinn.
- source_word: αὐτὴν κυκλόθεν
  choice: die Stadt ringsum
  rationale: Das feminine Pronomen bezieht sich auf Jerusalem. Die Wiederaufnahme mit „die Stadt“ vermeidet im Deutschen einen unklaren Bezug auf die unmittelbar zuvor genannten Mauern; „ringsum“ entspricht κυκλόθεν.
theological_decisions:
- issue: Geschlechtsspezifische militärische Bezeichnung
  choice: alle kampffähigen Männer
  alternative: alle Krieger / alle Soldaten
  rationale: ἄνδρας ist ausdrücklich männlich. Die Übersetzung bewahrt diesen Bezug, ohne mit „Soldaten“ einen möglicherweise stärker institutionalisierten Status einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. „Die Stadt“ dient der eindeutigen Rückbindung des femininen αὐτήν an Jerusalem.
