  text: And he set up seven pyramids[a], one opposite the other, for his father and mother and four brothers.
translation:
  language: de
  text: Und er errichtete sieben Pyramiden, jeweils eine der anderen gegenüber,[a] für seinen Vater und seine Mutter und für seine vier Brüder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „eine der anderen zugewandt“. Der griechische Ausdruck beschreibt, dass die Denkmäler einander gegenüber angeordnet waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: errichtete
  rationale: Im Zusammenhang mit Grab- oder Denkmälern bezeichnet das Verb das Aufstellen beziehungsweise bauliche Errichten; „errichtete“ ist hier natürlich und konkret.
- source_word: ἑπτὰ πυραμίδας
  choice: sieben Pyramiden
  rationale: πυραμίς bezeichnet gewöhnlich eine Pyramide. Die direkte Wiedergabe bewahrt die architektonische Aussage, ohne die genaue Form der Gedenkbauten näher festzulegen.
- source_word: μίαν κατέναντι τῆς μιᾶς
  choice: jeweils eine der anderen gegenüber
  rationale: Die Formulierung beschreibt die wechselseitige Anordnung der Bauwerke. „Jeweils“ macht den distributiven Sinn im Deutschen verständlich, ohne ein bestimmtes räumliches Muster zu ergänzen.
- source_word: τῷ πατρὶ καὶ τῇ μητρὶ
  choice: für seinen Vater und seine Mutter
  rationale: Die Dative bezeichnen hier am ehesten Widmung oder Bestimmung. Das Possessivpronomen ergibt sich aus dem Zusammenhang.
- source_word: τέσσαρσιν ἀδελφοῖς
  choice: für seine vier Brüder
  rationale: ἀδελφοῖς bezeichnet in diesem Zusammenhang Simons vier männliche Geschwister; die wiederholte Präposition sorgt im Deutschen für Klarheit.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Pyramiden“ bleibt als direkte architektonische Bezeichnung erhalten; die ungewöhnliche Zahl von sieben wird nicht erklärend harmonisiert.
