  source_fidelity: Die Übersetzung gibt ἔστησεν angemessen mit „errichtete“ wieder und bewahrt πυραμίδας als „Pyramiden“ ohne architektonische Überdeutung. „jeweils eine der anderen gegenüber“ bildet die knappe und hinsichtlich der genauen räumlichen Anordnung nicht weiter erläuterte Wendung μίαν κατέναντι τῆς μιᾶς sachgerecht ab. Die Dative der Begünstigten bzw. Geehrten sind mit „für“ natürlich wiedergegeben; „seinen“ bzw. „seine“ ist aus dem Kontext legitim ergänzt.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch und hat einen passenden würdigen Erzählregister. Die etwas markierte Formulierung zur gegenseitigen Anordnung ist angesichts der im Griechischen selbst knappen und ungewöhnlichen Beschreibung vertretbar.
  terminology: „Pyramiden“, „Vater“, „Mutter“ und „vier Brüder“ sind terminologisch präzise. Die Fußnote bietet eine echte lexikalisch-stilistische Alternative und erklärt zurückhaltend die räumliche Aussage, ohne eine nicht belegte Bauform oder Anordnung festzulegen.
