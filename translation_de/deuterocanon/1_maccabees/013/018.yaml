  text: 'und sagten: »Weil ich ihm das Silber und die Jungen[a] nicht geschickt habe, ist er umgekommen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die jungen Diener« beziehungsweise »die jungen Begleiter«. Das griechische Wort kann Jungen oder junge Diener bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ist er zugrunde gegangen« beziehungsweise »ist er vernichtet worden«. Das griechische Wort bezeichnet sein Verderben, ohne hier die genaue Art näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Partizip führt die direkte Rede ein und schließt an den vorhergehenden Satz an. Die finite Form ist im Deutschen natürlicher.
- source_word: Ὅτι
  choice: Weil
  rationale: Ὅτι leitet hier die als Begründung formulierte Aussage ein.
- source_word: οὐκ ἀπέστειλα
  choice: ich … nicht geschickt habe
  rationale: Das Perfekt gibt den griechischen Aorist in der direkten Rede idiomatisch wieder und bewahrt die erste Person.
- source_word: τὸ ἀργύριον
  choice: das Silber
  rationale: Die konkrete Bedeutung „Silber“ passt zum im Kontext verlangten Zahlungsmittel und bleibt näher am griechischen Ausdruck als „Geld“.
- source_word: τὰ παιδάρια
  choice: die Jungen
  rationale: παιδάρια kann Jungen, junge Menschen oder junge Diener bezeichnen. „Die Jungen“ bewahrt sowohl den Altersbezug als auch die im unmittelbaren Ausdruck bestehende Unbestimmtheit ihrer Rolle.
- source_word: ἀπώλετο
  choice: ist er umgekommen
  rationale: Die Form bezeichnet hier, dass jemand zugrunde ging bzw. vernichtet wurde. „Ist umgekommen“ gibt die Aussage klar wieder, ohne ausdrücklich einen Täter zu benennen.
theological_decisions: []
