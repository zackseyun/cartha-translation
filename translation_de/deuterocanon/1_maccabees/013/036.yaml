lexical_decisions:
- source_word: Βασιλεὺς Δημήτριος
  choice: König Demetrius
  rationale: Der artikellose Herrschertitel bildet mit dem Eigennamen den Absender der brieflichen Anschrift; im Deutschen steht der Titel natürlich vor dem Namen.
- source_word: Σίμωνι
  choice: an Simon
  rationale: Der Dativ bezeichnet in der Anschrift den Empfänger; modernes Deutsch gibt dies idiomatisch mit „an“ wieder. „Simon“ ist die geläufige deutsche Namensform in diesem historischen Zusammenhang.
- source_word: ἀρχιερεῖ
  choice: den Hohepriester
  rationale: Die Amtsbezeichnung steht als Apposition zu Simon. Nach „an“ verlangt die gewählte deutsche Konstruktion den Akkusativ.
- source_word: καὶ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet die beiden Bezeichnungen Simons.
- source_word: φίλῳ βασιλέων
  choice: Freund von Königen
  rationale: Die Wiedergabe bewahrt den unbestimmten Plural βασιλέων und den Charakter eines höfischen Ehrentitels, ohne ihn deutend zu „königlicher Freund“ umzuformen.
