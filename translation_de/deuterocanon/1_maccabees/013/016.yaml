lexical_decisions:
- source_word: ἀργυρίου ἑκατὸν τάλαντα
  choice: hundert Talente Silber
  rationale: Gibt Betrag und Material in natürlichem Deutsch wieder und bewahrt die antike Gewichtseinheit.
- source_word: ὅμηρα
  choice: als Geiseln
  rationale: Bezeichnet hier Personen, die als Sicherheit gestellt werden.
- source_word: ἀποστατήσῃ ἀφʼ ἡμῶν
  choice: sich von uns lossagt
  rationale: Bewahrt den politischen Sinn des Abfalls beziehungsweise der Aufkündigung der Gefolgschaft, ohne ihn unnötig religiös zu färben.
- source_word: ἀφεθεὶς
  choice: nach seiner Freilassung
  rationale: Das aoristische Passivpartizip bezeichnet den der möglichen Lossagung vorausgehenden Zustand; die Formulierung wahrt diesen zeitlichen Zusammenhang.
