  text: But those in the citadel kept sending envoys and urgently pressing him to come to them through the wilderness and to send them provisions[a].
translation:
  language: de
  text: Die Besatzung der Zitadelle aber sandte immer wieder Gesandte zu ihm und drängte ihn eindringlich, durch die Wüste zu ihnen[a] zu kommen und ihnen Vorräte zu schicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „zu ihm“; der Zusammenhang legt den kollektiven Sinn „zu ihnen“ nahe, bezogen auf die Besatzung der Zitadelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῆς ἄκρας
  choice: Die Besatzung der Zitadelle aber
  rationale: ἄκρα bezeichnet hier die befestigte Zitadelle Jerusalems. Die kollektive Wiedergabe „Besatzung“ bezeichnet natürlich die dort befindliche Partei, ohne ἐκ räumlich übergenau mit „aus“ wiederzugeben.
- source_word: ἀπέστελλον πρεσβεύτας
  choice: sandte immer wieder Gesandte
  rationale: Das Imperfekt ἀπέστελλον drückt einen wiederholten oder andauernden Vorgang aus; πρεσβευταί sind offizielle Abgesandte.
- source_word: κατεσπούδαζον
  choice: drängte ihn eindringlich
  rationale: Die Form bezeichnet nachdrückliches, eifriges Betreiben; das Imperfekt steht zusammen mit dem fortgesetzten Senden der Gesandten.
- source_word: αὐτὸν τοῦ ἐλθεῖν ... πρὸς αὐτόν
  choice: ihn ... zu ihnen zu kommen
  rationale: Im Kontext ist die Besatzung der Zitadelle das Ziel des Kommens. Die im edierten griechischen Text stehende Singularform αὐτόν wird wegen ihrer echten formalen Abweichung in einer Fußnote dokumentiert.
- source_word: διὰ τῆς ἐρήμου
  choice: durch die Wüste
  rationale: διά mit Genitiv bezeichnet den Weg durch ein Gebiet; ἐρῆμος kann Wüste oder unbewohntes Land bedeuten. „Wüste“ ist hier eine natürliche, nicht übermäßig spezifizierende Wiedergabe.
- source_word: ἀποστεῖλαι αὐτοῖς τροφάς
  choice: ihnen Vorräte zu schicken
  rationale: τροφαί meint im militärischen Zusammenhang Lebensmittel beziehungsweise Verpflegungsvorräte; „Vorräte“ ist knapp und idiomatisch.
