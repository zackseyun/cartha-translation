  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Aussagen des Griechischen zuverlässig wieder: Tryphon erfährt von Simons Hervortreten an Jonatans Stelle und von dessen bevorstehendem bewaffneten Vorgehen gegen ihn; anschließend entsendet er diplomatische Vertreter. Der Bezug von »seines Bruders Jonatan« auf Simon ist korrekt. »ließ ihm sagen« gibt die durch Gesandte vermittelte, von Tryphon ausgehende Rede sachgerecht wieder.'
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. »an die Stelle ... getreten war«, »im Begriff stand« und »gegen ihn Krieg zu führen« sind idiomatisch. Der Doppelpunkt bildet die offen in den folgenden Vers führende Redeeinleitung klar ab.
  terminology: »Gesandte« trifft πρέσβεις im diplomatischen Kontext gut. Die Fußnoten markieren angemessen die Bildlichkeit bzw. Nachfolgekonnotation von ἀνέστη und die militärische Bedeutung der Wendung συνάπτειν ... εἰς πόλεμον, ohne eine über das Griechische hinausgehende Deutung festzulegen.
