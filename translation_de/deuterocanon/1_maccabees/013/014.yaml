base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/014.yaml
  text: And Tryphon learned that Simon had arisen in place of Jonathan his brother, and that he was about to engage him in war; and he sent envoys to him, saying,
translation:
  language: de
  text: 'Und Tryphon erfuhr, dass Simon an die Stelle seines Bruders Jonatan getreten war[a] und im Begriff stand, gegen ihn Krieg zu führen[b]. Da sandte er Gesandte zu ihm und ließ ihm sagen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »sich anstelle seines Bruders Jonatan erhoben hatte«. Gemeint sein kann, dass Simon als dessen Nachfolger hervortrat.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sich anschickte, mit ihm den Kampf aufzunehmen«. Die griechische Wendung bezeichnet den Eintritt in einen bewaffneten Konflikt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: erfuhr
  rationale: Der Aorist bezeichnet hier Tryphons Erlangen der Kenntnis; »erfuhr« gibt diesen ereignishaften Sinn natürlich wieder.
- source_word: ἀνέστη ... ἀντὶ Ἰωνάθου
  choice: war an die Stelle ... getreten
  rationale: Die Verbindung bezeichnet im politischen Zusammenhang Simons Hervortreten als Nachfolger Jonatans. Die deutsche Wendung ist idiomatisch und bewahrt den Gedanken des Eintretens an dessen Stelle.
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: seines Bruders
  rationale: Das Possessivpronomen bezieht sich auf Simon; die natürliche deutsche Wortstellung verbindet die Verwandtschaftsangabe unmittelbar mit Jonatan.
- source_word: συνάπτειν αὐτῷ ... εἰς πόλεμον
  choice: gegen ihn Krieg zu führen
  rationale: Die griechische Wendung bezeichnet das Eintreten in einen bewaffneten Konflikt mit Tryphon. »Gegen ihn Krieg zu führen« ist klares, heutiges Deutsch.
- source_word: μέλλει
  choice: im Begriff stand
  rationale: Die Formulierung wahrt den möglichen Sinn von bevorstehender oder beabsichtigter Handlung, ohne deren Verwirklichung vorwegzunehmen.
- source_word: ἀπέστειλεν ... πρέσβεις
  choice: sandte ... Gesandte
  rationale: πρέσβεις bezeichnet diplomatische Abgesandte, nicht bloß gewöhnliche Boten.
- source_word: λέγων
  choice: ließ ihm sagen
  rationale: Das singularische Partizip bezieht sich grammatisch auf Tryphon, während die Gesandten die Botschaft übermitteln. Die deutsche Wendung führt natürlich in die folgende direkte Rede.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Einleitung der im nächsten Vers folgenden Botschaft offen; der Doppelpunkt macht diese Funktion im Deutschen deutlich.
