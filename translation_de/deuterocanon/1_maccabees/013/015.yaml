base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/015.yaml
  text: As for the silver that your brother Jonathan owed to the royal treasury because of the needs he had[b][a], we have held him liable for it.
translation:
  language: de
  text: 'Was das Silber betrifft, das dein Bruder Jonatan der königlichen Schatzkammer wegen seiner Bedürfnisse schuldete: Wir halten ihn deswegen fest.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann „festhalten“, „zurückhalten“ oder „bedrängen“ bedeuten. Gemeint sein kann, dass Jonatan deswegen in Gewahrsam gehalten oder unter Druck gesetzt wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ ἀργυρίου
  choice: Was das Silber betrifft
  rationale: Περί leitet ein Thema ein; ἀργύριον bezeichnet wörtlich Silber und im finanziellen Zusammenhang Geld beziehungsweise Silbergeld.
- source_word: ὤφειλεν
  choice: schuldete
  rationale: Gibt die finanzielle Verpflichtung unmittelbar und idiomatisch wieder.
- source_word: εἰς τὸ βασιλικόν
  choice: der königlichen Schatzkammer
  rationale: Das substantivierte βασιλικόν bezeichnet hier im fiskalischen Zusammenhang den königlichen Bereich, am natürlichsten die königliche Schatzkammer.
- source_word: διʼ ἃς εἶχεν χρείας
  choice: wegen der Verpflichtungen, die er hatte
  rationale: χρεία kann Bedürfnisse, Geschäfte, Aufgaben oder Verpflichtungen bezeichnen. „Verpflichtungen“ bewahrt die administrative Möglichkeit, ohne die weniger sichere Bedeutung „Ämter“ festzuschreiben.
- source_word: συνέχομεν αὐτόν
  choice: Wir hielten ihn deswegen fest
  rationale: συνέχω bedeutet gewöhnlich festhalten, zurückhalten oder bedrängen. Die Übersetzung folgt dem belegten Wortsinn und lässt offen, ob physische Haft oder bindender Druck gemeint ist; eine Bedeutung „von der Schuld freistellen“ ist lexikalisch nicht hinreichend gesichert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fiskalisch-administrative Sprache bleibt verständlich; die Mehrdeutigkeit von χρεία und συνέχω wird nicht durch eine kontextuell vermutete Schuldenerlassformel aufgelöst.
