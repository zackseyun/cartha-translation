base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/039.yaml
  text: But we forgive you the oversights and the sins up to this present day[a], and the crown tax that you owed; and if anything else was being levied in Jerusalem[b], let it no longer be levied.
translation:
  language: de
  text: Wir erlassen euch jedoch die Verfehlungen aus Unwissenheit[a] und die Sünden bis zum heutigen Tag sowie die Kranzabgabe[b], die ihr schuldig wart; und wenn in Jerusalem irgendeine andere Abgabe erhoben wurde, soll sie nicht länger erhoben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Versehen; gemeint sind Verfehlungen, die aus Unwissenheit oder ohne Absicht begangen wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: Kranz; wahrscheinlich eine dem Herrscher beziehungsweise der Krone geschuldete Abgabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίεμεν
  choice: wir erlassen
  rationale: „Erlassen“ umfasst im Deutschen sowohl die Vergebung von Verfehlungen als auch die Aufhebung einer geschuldeten Abgabe und wahrt so die moralisch-rechtliche Breite des griechischen Verbs.
- source_word: ἀγνοήματα
  choice: Verfehlungen aus Unwissenheit
  rationale: Die Formulierung gibt ausdrücklich wieder, dass es um aus Unkenntnis oder ohne Absicht begangene Fehler geht, und unterscheidet sie von den anschließend genannten Sünden.
- source_word: ἁμαρτήματα
  choice: Sünden
  rationale: „Sünden“ bewahrt die moralische Aussage des gewöhnlichen griechischen Begriffs, ohne ihn im politischen Zusammenhang auf bloße Verwaltungsverstöße zu verengen.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: bis zum heutigen Tag
  rationale: Diese natürliche, würdige Formulierung gibt die zeitliche Grenze des Erlasses genau wieder.
- source_word: στέφανον
  choice: Kranzabgabe
  rationale: Wörtlich bedeutet das Wort „Kranz“, bezeichnet hier aber im hellenistischen Verwaltungszusammenhang eine der Krone beziehungsweise dem Herrscher geschuldete Abgabe. „Kranzabgabe“ erhält das Bild und verdeutlicht zugleich den fiskalischen Sinn.
- source_word: ὠφείλετε
  choice: die ihr schuldig wart
  rationale: Die Formulierung gibt die fortbestehende Verpflichtung des griechischen Imperfekts in natürlichem Deutsch wieder.
- source_word: εἴ τι ἄλλο
  choice: wenn noch irgendeine andere Abgabe
  rationale: Die Wendung eröffnet eine zusätzliche, nicht näher bestimmte Kategorie von Abgaben; „noch irgendeine andere“ bewahrt diese Offenheit.
- source_word: ἐτελωνεῖτο
  choice: erhoben wurde
  rationale: Das Verb bezeichnet die Erhebung oder Einziehung von Steuern und Abgaben. Im Deutschen passt „erheben“ idiomatisch zu der aus dem Zusammenhang ergänzten „Abgabe“.
- source_word: μηκέτι τελωνιζέσθω
  choice: soll sie nicht länger erhoben werden
  rationale: Die Formulierung wahrt den passiven Charakter und den verbindlichen Ton des königlichen Erlasses.
theological_decisions:
- issue: Moralisch-religiöse oder rein verwaltungsrechtliche Wiedergabe von ἁμαρτήματα
  choice: Sünden
  alternative: Vergehen; Verfehlungen
  rationale: Obwohl der Zusammenhang politisch und fiskalisch ist, verwendet der Text einen üblichen moralischen Begriff und stellt ihn neben ἀγνοήματα. „Sünden“ erhält diese Spannung, statt sie verwaltungsrechtlich aufzulösen.
- issue: Wörtliche oder fiskalisch deutende Wiedergabe von στέφανον
  choice: Kranzabgabe
  alternative: Kranz; Tribut; königliche Abgabe
  rationale: Das isolierte „Kranz“ wäre im Deutschen in diesem Zusammenhang missverständlich. „Kranzabgabe“ bewahrt den Wortlaut erkennbar und macht zugleich den durch Schulden und Abgabenerhebung geforderten fiskalischen Sinn deutlich.
translation_notes:
  register: Moderner, würdiger Verordnungsstil. „Erlassen“ verbindet bewusst den moralischen und den fiskalischen Bereich. Die wiederholte Passivform „erhoben wurde / erhoben werden“ spiegelt den amtlichen Charakter des griechischen Textes, ohne unnötig altertümlich zu klingen.
