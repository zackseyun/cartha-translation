base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/037.yaml
  text: And to the elders and the nation of the Jews[a], greetings. We have received the gold crown and the palm branch that you sent[b], and we are ready to make great peace with you and to write to the officials in charge to grant you remissions.
translation:
  language: de
  text: 'Und den Ältesten und dem Volk der Juden: Grüße! Wir haben den goldenen Kranz und den Palmzweig[a], den ihr gesandt habt, erhalten. Wir sind bereit, einen umfassenden Frieden mit euch zu schließen und den zuständigen Amtsträgern zu schreiben, euch Erlasse zu gewähren.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Palmwedel«; der griechische Ausdruck bezeichnet einen Palmzweig, der vermutlich zeremoniell oder als Ehrenzeichen verwendet wurde.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Erlassen« sind wahrscheinlich Abgaben- oder andere verwaltungsmäßige Vergünstigungen gemeint; welche Art von Erlass vorliegt, sagt der griechische Text nicht ausdrücklich.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβυτέροις
  choice: den Ältesten
  rationale: Im politisch-diplomatischen Zusammenhang bezeichnet der Ausdruck anerkannte führende Vertreter der Gemeinschaft, nicht lediglich ältere Männer.
- source_word: ἔθνει Ἰουδαίων
  choice: dem Volk der Juden
  rationale: ἔθνος bezeichnet hier die Juden als politisch-korporative Gemeinschaft. »Volk« ist im modernen Deutschen natürlich und bewahrt den förmlichen Charakter.
- source_word: χαίρειν
  choice: Grüße!
  rationale: Der Infinitiv ist die übliche briefliche Grußformel; eine wörtliche Wiedergabe mit »sich freuen« wäre im Deutschen irreführend.
- source_word: στέφανον τὸν χρυσοῦν
  choice: den goldenen Kranz
  rationale: στέφανος bezeichnet primär einen Kranz, hier ein diplomatisches Ehrengeschenk; »Krone« wäre möglich, könnte aber eine Herrscherkrone nahelegen.
- source_word: βαΐν
  choice: den Palmzweig
  rationale: Das seltene Wort bezeichnet einen Palmzweig beziehungsweise Palmwedel, wahrscheinlich mit zeremonieller oder ehrender Funktion.
- source_word: κεκομίσμεθα
  choice: haben … erhalten
  rationale: Das Perfekt bezeichnet den vollzogenen Empfang der übersandten Geschenke.
- source_word: ποιεῖν ὑμῖν εἰρήνην μεγάλην
  choice: einen umfassenden Frieden mit euch zu schließen
  rationale: Die idiomatische deutsche Formulierung gibt μεγάλην als weitreichende oder volle Friedensregelung wieder, ohne die semitisch gefärbte griechische Wendung unnatürlich nachzubilden.
- source_word: τοῖς ἐπὶ τῶν χρειῶν
  choice: den zuständigen Amtsträgern
  rationale: Die Wendung meint Personen, die mit den einschlägigen Amtsgeschäften betraut sind, ohne ein genaueres Amt zu nennen.
- source_word: ἀφεῖναι ὑμῖν ἀφέματα
  choice: euch Erlasse zu gewähren
  rationale: Die Verbindung aus stammverwandtem Verb und Substantiv bezeichnet gewährte Nachlässe, Befreiungen oder Erlasse. »Erlasse« bewahrt die sachliche Offenheit des Griechischen.
theological_decisions: []
translation_notes:
  register: Förmlicher diplomatischer Briefstil in modernem, gut verständlichem Standarddeutsch. Die Anrede setzt den aus dem vorherigen Vers fortlaufenden Satz voraus. »Umfassenden Frieden« vermittelt die Intensivierung durch μεγάλην natürlicher als das im Deutschen ungewöhnliche »großen Frieden«.
