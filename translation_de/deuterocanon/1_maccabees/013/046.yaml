  text: And they said, “Do not deal with us according to our wickedness, but according to your mercy.”
translation:
  language: de
  text: 'Und sie sagten: »Behandle uns nicht nach unseren bösen Taten, sondern nach deiner Barmherzigkeit.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρήσῃ
  choice: Behandle
  rationale: Das mediale χράομαι bezeichnet hier mit Dativ und κατά-Fügung das Verhalten gegenüber jemandem. »Behandle uns« ist im Deutschen natürlich und gibt den relationalen Sinn präzise wieder.
- source_word: κατὰ τὰς πονηρίας ἡμῶν
  choice: nach unseren bösen Taten
  rationale: Der Plural πονηρίας weist auf konkrete Äußerungen bösen Handelns. »Böse Taten« bewahrt den moralischen Ernst und gibt den griechischen Plural natürlicher wieder als das abstrakte »Bosheit«.
- source_word: ἔλεός
  choice: Barmherzigkeit
  rationale: ἔλεος bezeichnet Erbarmen oder Barmherzigkeit. »Barmherzigkeit« ist hier eine klare, würdige und biblisch vertraute Entsprechung im Gegensatz zur verdienten Vergeltung.
- source_word: Μὴ ἡμῖν χρήσῃ
  choice: Behandle uns nicht
  rationale: Die verneinte Bitte wird als unmittelbare flehentliche Aufforderung wiedergegeben; die deutsche Wortstellung ist idiomatisch und bewahrt den Sinn.
theological_decisions:
- issue: Bußfertiger Gegensatz zwischen verdienter Vergeltung und Barmherzigkeit
  choice: Die Bitte wird unmittelbar als Gegensatz zwischen den eigenen bösen Taten und der Barmherzigkeit des Angesprochenen wiedergegeben.
  alternative: Den Angesprochenen ausdrücklich als Gott benennen oder zusätzliche Bundes- bzw. Gnadensprache einfügen.
  rationale: Der griechische Text nennt in diesem Satz Gott nicht ausdrücklich und entfaltet keine weitergehende Lehre. Die Übersetzung bewahrt daher die theologische Spannung, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, leicht verständlichem Erzähl- und Bittregister. Die direkte Rede bleibt knapp und eindringlich; keine Fußnoten erforderlich.
