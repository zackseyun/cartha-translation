lexical_decisions:
- source_word: παρενέβαλεν
  choice: schlug sein Lager auf
  rationale: Das Verb παρεμβάλλω bezeichnet hier im militärischen Zusammenhang das Aufschlagen eines Lagers. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den militärischen Sinn.
- source_word: ἐν Ἀδείδοις
  choice: bei Adida
  rationale: ἐν bezeichnet hier den Standort bei einem Ort. „Bei Adida“ gibt die militärisch-geografische Lage im Deutschen idiomatisch wieder; der Ortsname folgt der vorgegebenen Transliteration.
- source_word: κατὰ πρόσωπον
  choice: gegenüber
  rationale: Die Wendung hat hier räumliche Bedeutung und beschreibt eine Position, die der Ebene zugewandt beziehungsweise ihr gegenüberliegt.
- source_word: τοῦ πεδίου
  choice: der Ebene
  rationale: πεδίον bezeichnet flaches, offenes Land; im geografischen Zusammenhang ist „Ebene“ die treffende deutsche Wiedergabe.
- source_word: δὲ
  choice: aber
  rationale: δὲ markiert einen leichten erzählerischen Übergang oder Kontrast. „Aber“ bewahrt diese Funktion, ohne einen starken Gegensatz zu erzwingen.
