lexical_decisions:
- source_word: τούτου χάριν
  choice: Aus diesem Grund
  rationale: Gibt die kausale Wendung klar und natürlich wieder.
- source_word: ἀπώλοντο
  choice: wurden … vernichtet
  rationale: Bewahrt gegenüber dem bloß intransitiven „kamen um“ die mögliche passive bzw. gewaltsame Nuance der griechischen Form im Kontext.
- source_word: χάριν τοῦ Ἰσραήλ
  choice: um Israels willen
  rationale: Entspricht der wiederholten Präposition χάριν und bringt den Einsatz zugunsten Israels in würdiger, geläufiger Sprache zum Ausdruck.
- source_word: κατελείφθην ἐγὼ μόνος
  choice: ich allein bin übrig geblieben
  rationale: Gibt den resultativen Sinn des Aoristpassivs idiomatisch wieder und betont durch „ich allein“ die Isolation des Sprechers.
