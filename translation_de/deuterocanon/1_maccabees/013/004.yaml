  source_fidelity: Das griechische ἀπώλοντο ist hier die intransitive Form von ἀπόλλυμι („kamen um/gingen zugrunde“). Die Form benennt keinen Handelnden; „wurden vernichtet“ fügt daher eine passive Täterperspektive hinzu, die der Wortlaut nicht ausdrücklich trägt. Die übrigen Satzglieder sind zutreffend wiedergegeben.
  naturalness: „Darum kamen alle meine Brüder um Israels willen ums Leben, und ich allein blieb übrig“ ist modernes, würdiges Standarddeutsch und hält die knappe, nachdrückliche Satzführung ein.
  terminology: „Um Israels willen“ gibt χάριν τοῦ Ἰσραήλ idiomatisch und registergerecht wieder. „Blieb übrig“ bildet den resultativen Sinn von κατελείφθην idiomatisch ab, ohne einen nicht genannten Akteur zu ergänzen.
  issues:
