    issue: „wurden … vernichtet“ für ἀπώλοντο
    rationale: Die deutsche Passivform legt nahe, dass die Brüder von einem ausdrücklich mitgedachten Täter vernichtet wurden. Das griechische ἀπώλοντο ist hier intransitiv („kamen um“); die gewaltsame oder kriegsbedingte Ursache kann der Kontext nahelegen, wird aber in diesem Satz nicht grammatisch bezeichnet.
