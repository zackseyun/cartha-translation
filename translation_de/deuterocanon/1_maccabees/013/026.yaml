  text: And all Israel made great mourning for him[a], and they mourned for him many days.
translation:
  language: de
  text: Und ganz Israel erhob über ihn eine große Totenklage[a], und sie trauerten viele Tage um ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stimmte über ihn eine große Klage an“. Im Griechischen steht eine feste Wendung für öffentliche Trauer und Totenklage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκοψαντο … κοπετὸν μέγαν
  choice: hielt … eine große Totenklage
  rationale: Die Verbindung aus κόπτομαι und κοπετός bezeichnet idiomatisch eine öffentliche, intensive Trauerklage. „Totenklage halten“ ist im Deutschen natürlich und gibt den Bestattungskontext wieder, ohne eine bestimmte körperliche Geste festzulegen.
- source_word: πᾶς Ἰσραήλ
  choice: ganz Israel
  rationale: Gibt den kollektiven Ausdruck für das Volk als Ganzes knapp und idiomatisch wieder.
- source_word: ἐπένθησαν
  choice: sie trauerten
  rationale: πενθέω bezeichnet besonders die Trauer um einen Verstorbenen; „trauerten“ unterscheidet die fortdauernde Trauer passend von der zuvor genannten öffentlichen Totenklage.
- source_word: ἡμέρας πολλὰς
  choice: viele Tage
  rationale: Der Akkusativ bezeichnet die Dauer. Im Deutschen ist „viele Tage“ in Verbindung mit „trauerten“ klar und natürlich.
