  text: And Tryphon prepared all his cavalry to come; but on that night there was a very great snowfall[a], and he did not come because of the snow. So he broke camp and went into the Gilead region.
translation:
  language: de
  text: Und Tryphon machte seine gesamte Reiterei bereit, zu kommen. Doch in jener Nacht fiel sehr viel Schnee, und wegen des Schnees kam er nicht. So brach er auf und zog in die Landschaft Gilead.[a]
  philosophy: optimal-equivalence
