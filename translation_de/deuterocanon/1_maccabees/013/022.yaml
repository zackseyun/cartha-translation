revisions:
- from: Und Tryphon machte seine gesamte Reiterei zum Aufbruch bereit. Doch in jener Nacht fiel sehr viel Schnee, und wegen des Schnees kam er nicht. So brach er auf und zog in die Landschaft Gilead.[a]
  to: Und Tryphon machte seine gesamte Reiterei bereit, zu kommen. Doch in jener Nacht fiel sehr viel Schnee, und wegen des Schnees kam er nicht. So brach er auf und zog in die Landschaft Gilead.[a]
  rationale: Die erste Bewegungsangabe wird von „zum Aufbruch“ zu „zu kommen“ korrigiert, damit ἐλθεῖν und die folgende Negation οὐκ ἦλθεν im Deutschen ebenso aufeinander bezogen bleiben wie im Griechischen. Alle übrigen Formulierungen einschließlich der Fußnote können unverändert bleiben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:57Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von πᾶσαν τὴν ἵππον αὐτοῦ als „seine gesamte Reiterei“ und von χιών πολλὴ σφόδρα als „sehr viel Schnee“ ist zutreffend. „zum Aufbruch bereit“ verschiebt jedoch ἐλθεῖν („zu kommen“) zu einem bloßen Weggehen/Aufbrechen. Gerade die anschließende Wiederaufnahme „kam er nicht“ sollte im Deutschen erkennbar bleiben. ἀπῆρεν ist danach angemessen mit „brach ... auf“ wiedergegeben.
  naturalness: Der Text ist insgesamt flüssiges modernes Standarddeutsch. „bereit, zu kommen“ ist etwas formeller als „zum Aufbruch bereit“, bewahrt aber die absichtliche Verbentsprechung des griechischen Textes und bleibt im erzählenden Register verständlich.
  terminology: „Reiterei“ ist eine passende militärische Kollektivbezeichnung. „Gilead“ ist als Regionenname etabliert; die Fußnote erklärt die griechische Gebietsform sachgerecht und ist korrekt an der Ortsbezeichnung verankert.
  issues:
  - severity: medium
    issue: „zum Aufbruch bereit“ für ἐλθεῖν
    rationale: Der griechische Infinitiv bedeutet hier „zu kommen“ und wird im folgenden Satz durch οὐκ ἦλθεν („kam nicht“) bewusst wiederaufgenommen. „Zum Aufbruch“ ersetzt dies durch eine nicht ausdrücklich genannte Perspektive des Weggehens.
  revised_text: Und Tryphon machte seine gesamte Reiterei bereit, zu kommen. Doch in jener Nacht fiel sehr viel Schnee, und wegen des Schnees kam er nicht. So brach er auf und zog in die Landschaft Gilead.[a]
  revised_footnotes:
  - marker: a
    text: 'Griechisch: „in die Galaaditis“, das heißt in das Gebiet von Gilead.'
    reason: lexical_alternative
  revision_rationale: Die erste Bewegungsangabe wird von „zum Aufbruch“ zu „zu kommen“ korrigiert, damit ἐλθεῖν und die folgende Negation οὐκ ἦλθεν im Deutschen ebenso aufeinander bezogen bleiben wie im Griechischen. Alle übrigen Formulierungen einschließlich der Fußnote können unverändert bleiben.
