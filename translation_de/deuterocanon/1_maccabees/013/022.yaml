lexical_decisions:
- source_word: ἡτοίμασεν
  choice: machte … bereit
  rationale: Gibt die militärische Vorbereitung schlicht und ohne zusätzliche Deutung wieder.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: seine gesamte Reiterei
  rationale: ἵππος bezeichnet hier kollektiv die berittenen Truppen; „Reiterei“ ist im Deutschen natürlich und militärisch präzise.
- source_word: ἐλθεῖν
  choice: zum Aufbruch
  rationale: Das wörtliche „zu kommen“ wäre nach Tryphons Standort im Deutschen unnatürlich. „Zum Aufbruch bereitmachen“ gibt die beabsichtigte Bewegung idiomatisch wieder, ohne ein Angriffsziel hinzuzufügen.
- source_word: χιών πολλὴ σφόδρα
  choice: fiel sehr viel Schnee
  rationale: Bewahrt die starke Mengenangabe des Griechischen in natürlichem modernem Deutsch.
- source_word: οὐκ ἦλθεν διὰ τὴν χιόνα
  choice: wegen des Schnees kam er nicht
  rationale: Erhält sowohl die ausdrücklich festgestellte Nichtankunft als auch den mit διά genannten Grund; „konnte nicht kommen“ würde Unmöglichkeit stärker behaupten als der Text.
- source_word: ἀπῆρεν
  choice: brach er auf
  rationale: Passt zum militärischen Reisebericht und gibt das Fortziehen wieder, ohne das im Verb nicht ausdrücklich genannte Abbrechen eines Lagers vorauszusetzen.
- source_word: Γαλααδῖτιν
  choice: die Landschaft Gilead
  rationale: Die griechische Gebietsbezeichnung wird als allgemein verständlicher Name der Region wiedergegeben.
