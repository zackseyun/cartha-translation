  source_fidelity: 'Die Übersetzung gibt die Abfolge des griechischen Textes zuverlässig wieder: Simon sendet aus, die Gebeine Jonatans werden geholt, und Jonatan wird in Modeïn bestattet. „ließ ... holen“ macht die im Griechischen bei ἀπέστειλεν und ἔλαβεν mitgedachte Beauftragung im idiomatischen Deutschen sichtbar, ohne eine konkrete Personengruppe zu ergänzen. Der Wechsel von „Gebeine“ zu dem singularischen „ihn“ entspricht dem griechischen αὐτόν, das Jonatan meint.'
