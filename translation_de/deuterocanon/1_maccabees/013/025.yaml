  text: And Simon sent and took the bones of Jonathan his brother[a], and buried him in Modein, the city of his fathers.
translation:
  language: de
  text: Da sandte Simon hin und ließ die Gebeine seines Bruders Jonatan holen. Er begrub ihn in Modeïn, der Stadt seiner Vorfahren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte hin
  rationale: Das Verb bezeichnet ein Senden, ohne die entsandten Personen ausdrücklich zu nennen. „sandte hin“ bewahrt diese Offenheit und klingt im Deutschen vollständiger als das alleinstehende „sandte“.
- source_word: ἔλαβεν
  choice: ließ … holen
  rationale: Wörtlich bedeutet das Verb „nahm“. Zusammen mit dem vorausgehenden „sandte“ bezeichnet es hier jedoch idiomatisch, dass Simon die Gebeine durch Entsandte holen ließ; diese Wiedergabe vermeidet die unnatürliche Vorstellung, er habe sie persönlich genommen.
- source_word: τὰ ὀστᾶ
  choice: die Gebeine
  rationale: „Gebeine“ gibt die konkrete Bedeutung „Knochen“ in einem würdigen Bestattungskontext wieder, ohne sie zum allgemeineren „Überreste“ abzuschwächen.
- source_word: Ἰωναθὰν
  choice: Jonatan
  rationale: Gebräuchliche deutsche Form des biblischen Personennamens.
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: seines Bruders
  rationale: Direkte und natürliche Wiedergabe des griechischen Genitivs.
- source_word: ἔθαψεν αὐτόν
  choice: Er begrub ihn
  rationale: Das maskuline Pronomen bezieht sich grammatisch auf Jonatan, nicht auf das neutrale Pluralwort „Gebeine“. Ein neuer Satz macht diesen Personenbezug im Deutschen klar, ohne ihn umzudeuten.
- source_word: ἐν Μωδεεὶμ
  choice: in Modeïn
  rationale: „in“ entspricht ἐν; „Modeïn“ gibt die griechische Ortsnamensform in einer im Deutschen gut lesbaren Umschrift wieder.
- source_word: πόλει τῶν πατέρων αὐτοῦ
  choice: der Stadt seiner Vorfahren
  rationale: Wörtlich steht „der Stadt seiner Väter“. „Vorfahren“ vermittelt hier natürlich den genealogischen und heimatlichen Sinn und vermeidet ein mögliches Missverständnis, als seien mehrere unmittelbare Väter gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Rede von den Gebeinen bleibt erhalten; die elliptische griechische Verbindung „sandte und nahm“ wird als deutsches „sandte hin und ließ … holen“ idiomatisch wiedergegeben. Die Übersetzung wahrt den Wechsel von den pluralischen Gebeinen zum singularischen Personenbezug auf Jonatan.
