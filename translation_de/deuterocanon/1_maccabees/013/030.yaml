  text: This is the tomb that he made in Modein, to this day.
translation:
  language: de
  text: Das ist das Grabmal, das er in Modeïn errichtete, und es steht bis zum heutigen Tag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάφος
  choice: Grabmal
  rationale: τάφος kann eine Grabstätte oder ein Grabmonument bezeichnen. Im Kontext des zuvor beschriebenen monumentalen Familiengrabs trifft „Grabmal“ den Sinn genauer als das allgemeinere „Grab“.
- source_word: ἐποίησεν
  choice: errichtete
  rationale: ποιέω bedeutet grundsätzlich „machen“ oder „tun“; bei einem Bauwerk ist „errichten“ im Deutschen natürlich und gibt die kontextuelle Bedeutung präzise wieder.
- source_word: ἐν Μωδεεὶμ
  choice: in Modeïn
  rationale: ἐν wird örtlich mit „in“ wiedergegeben. „Modeïn“ folgt der griechischen Namensform und nutzt den Trema zur eindeutigen Silbentrennung.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: es steht noch heute
  rationale: Die Wendung bezeichnet das Fortbestehen bis zur Zeit der Erzählstimme. Im Deutschen macht „es steht noch heute“ den im Kontext gemeinten Fortbestand des Grabmals natürlich und klar.
- source_word: οὗτος
  choice: Das ist
  rationale: Der Demonstrativausdruck identifiziert das zuvor beschriebene Bauwerk. Das im griechischen Nominalsatz fehlende Verb wird im Deutschen durch „ist“ ergänzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe identifizierende Aussage des griechischen Textes bleibt erhalten; die idiomatische Schlusswendung verdeutlicht ohne Fußnote den fortdauernden Bestand des Grabmals.
