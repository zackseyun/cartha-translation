  yaml_path: translation/deuterocanon/1_maccabees/013/012.yaml
  text: And Tryphon set out from Ptolemais with a large force to enter the land of Judah[a], and Jonathan was with him in custody;
translation:
  language: de
  text: Und Tryphon brach mit einer großen Streitmacht von Ptolemaïs auf, um in das Land Juda zu ziehen; und Jonatan war bei ihm unter Bewachung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in Gewahrsam; möglicherweise auch: im Gefängnis (griechisch: ἐν φυλακῇ).'
    reason: Die griechische Wendung kann Bewachung, Gewahrsam oder Gefangenschaft bezeichnen; der Zusammenhang legt nicht zwingend ein Gefängnisgebäude nahe.
lexical_decisions:
- source_word: ἀπῆρεν
  choice: brach … auf
  rationale: Das Verb bezeichnet hier den Aufbruch von einem Ort und passt natürlich zur anschließenden militärischen Bewegung.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: mit einer großen Streitmacht
  rationale: δύναμις bezeichnet im militärischen Erzählzusammenhang eine Truppenmacht, nicht abstrakte Kraft.
- source_word: εἰσελθεῖν εἰς γῆν Ἰούδα
  choice: um in das Land Juda zu ziehen
  rationale: Der Infinitiv gibt den Zweck des Aufbruchs an. „Zu ziehen“ wahrt den schlichten Bewegungssinn, ohne die im Kontext mögliche feindliche Absicht durch „einzufallen“ ausdrücklich in den Wortlaut einzutragen.
- source_word: γῆν Ἰούδα
  choice: das Land Juda
  rationale: Die Formulierung bildet die geografische Wendung des Griechischen unmittelbar ab und vermeidet die stärker konventionalisierte Bezeichnung „Judäa“.
- source_word: καὶ Ἰωνάθαν μετʼ αὐτοῦ ἐν φυλακῇ
  choice: Jonatan führte er unter Bewachung mit sich
  rationale: Die idiomatische deutsche Fassung macht deutlich, dass Jonatan als bewachter Gefangener mit Tryphon unterwegs war, ohne ein festes Gefängnis vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Situation wird klar wiedergegeben, während „zu ziehen“ die gegenüber „einzufallen“ neutralere Ausdrucksweise des griechischen Verbs bewahrt.
