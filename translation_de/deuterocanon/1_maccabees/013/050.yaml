  text: And they cried out to Simon to receive pledges of good faith[a], and he gave them to them, and he drove them out from there[b], and he cleansed the citadel from its defilements.
translation:
  language: de
  text: Da riefen sie Simon zu und baten ihn um verbindliche Zusicherungen[a]. Er gewährte sie ihnen, vertrieb sie von dort und reinigte die Zitadelle[b] von den Verunreinigungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „rechte Hände annehmen“; eine Redewendung für das Empfangen oder Gewähren verbindlicher Zusicherungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Akra“, die befestigte Zitadelle in Jerusalem.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβόησαν πρὸς Σίμωνα
  choice: Da riefen sie Simon zu
  rationale: Das Verb bezeichnet lautes, dringliches Rufen. „Riefen … zu“ bewahrt die hörbare Dringlichkeit und klingt im Deutschen natürlicher als eine rein sachliche Wiedergabe mit „baten“.
- source_word: δεξιὰς λαβεῖν
  choice: er solle ihre Zusicherung annehmen
  rationale: Wörtlich steht „rechte Hände annehmen“. Gemeint ist idiomatisch die Annahme einer verbindlichen Zusicherung beziehungsweise eines Treue- oder Sicherheitsversprechens. „Zusicherung“ wahrt die Offenheit hinsichtlich ihres genauen Inhalts.
- source_word: ἔδωκεν αὐτοῖς
  choice: Er gewährte sie ihnen
  rationale: Das ausgelassene Objekt ergibt sich aus der vorhergehenden Wendung. Das feminine Pronomen nimmt „Zusicherung“ auf; „gewährte“ gibt den Sinn wieder, ohne den Inhalt der Zusicherung näher festzulegen.
- source_word: ἐξέβαλεν αὐτοὺς ἐκεῖθεν
  choice: vertrieb sie von dort
  rationale: ἐκβάλλω bezeichnet eine nachdrückliche Entfernung. „Vertrieb“ passt zum militärisch-politischen Zusammenhang und bewahrt die Stärke des Verbs.
- source_word: τὴν ἄκραν
  choice: die Zitadelle
  rationale: ἄκρα bezeichnet eine befestigte Zitadelle und kann hier zugleich die als Akra bekannte Festung in Jerusalem meinen. Der Haupttext übersetzt den verständlichen Gattungsbegriff; die mögliche Namensfunktion wird in der Fußnote bewahrt.
- source_word: ἀπὸ τῶν μιασμάτων
  choice: von den Verunreinigungen
  rationale: μίασμα bezeichnet Verunreinigung oder Befleckung, häufig mit kultischem Beiklang. Der Plural wird erhalten; „Verunreinigungen“ ist verständlich und lässt die kultische Dimension offen.
theological_decisions:
- issue: Wörtliche oder idiomatische Wiedergabe von δεξιὰς λαβεῖν
  choice: 'idiomatisch: „ihre Zusicherung annehmen“'
  alternative: 'wörtlich: „rechte Hände annehmen“; stärker ausdeutend: „Sicherheitsgarantien annehmen“'
  rationale: Die wörtliche Form wäre für heutige Leserinnen und Leser undurchsichtig. „Zusicherung“ vermittelt den verbindlichen Charakter, ohne festzulegen, ob primär freies Geleit, Sicherheit oder allgemeine Vertragstreue gemeint ist.
- issue: Gattungsbezeichnung oder Eigenname bei τὴν ἄκραν
  choice: im Haupttext „die Zitadelle“
  alternative: „die Akra“
  rationale: Der griechische Ausdruck kann als gewöhnliches Substantiv und im Kontext als Bezeichnung der Jerusalemer Akra verstanden werden. Die Übersetzung hält den Haupttext unmittelbar verständlich und nennt die historische Alternative in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die idiomatische Wendung wird verständlich wiedergegeben, während die wörtliche Bildsprache in der Fußnote erhalten bleibt. Die kultische oder religiöse Färbung von μίασμα wird nicht durch eine engere Deutung überbestimmt.
