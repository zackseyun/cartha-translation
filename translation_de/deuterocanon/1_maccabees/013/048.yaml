  yaml_path: translation/deuterocanon/1_maccabees/013/048.yaml
  text: And he drove out from it every impurity[a], and settled in it men who practice the law, and fortified it[b], and built for himself a residence in it.
translation:
  language: de
  text: Und er entfernte daraus alles Unreine[a], siedelte darin Männer an, die das Gesetz befolgen, befestigte sie[b] und baute sich darin eine Wohnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Unreinheit“ oder „jede Verunreinigung“. Das griechische Wort kann Unreinheit im weiteren Sinn bezeichnen, auch rituelle oder moralische Verunreinigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „befestigte sie zusätzlich“. Die zusammengesetzte Verbform kann eine zusätzliche Verstärkung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλεν
  choice: entfernte
  rationale: Das Verb bezeichnet ein entschiedenes Herauswerfen oder Beseitigen. Im Zusammenhang mit ἀκαθαρσία ist „entfernte“ im Deutschen natürlich und lässt offen, ob Personen, Gegenstände oder kultische Verunreinigung gemeint sind.
- source_word: ἀκαθαρσίαν
  choice: alles Unreine
  rationale: Die substantivierte Wendung gibt den umfassenden Sinn wieder, ohne die Verunreinigung ausschließlich rituell oder moralisch zu bestimmen.
- source_word: κατῴκισεν
  choice: siedelte … an
  rationale: Die kausative Bedeutung ist, dass Simon Bewohner dort ansiedelte; „ansiedeln“ ist dafür die natürliche deutsche Entsprechung.
- source_word: ἄνδρας
  choice: Männer
  rationale: Das griechische Wort ist ausdrücklich maskulin und bezeichnet hier die angesiedelten Männer.
- source_word: οἵτινες τὸν νόμον ποιοῦσιν
  choice: die das Gesetz befolgen
  rationale: Die Wendung meint, das Gesetz praktisch zu halten beziehungsweise danach zu handeln. „Befolgen“ ist idiomatisch und bewahrt den fortdauernden Verhaltensaspekt.
- source_word: προσοχύρωσεν
  choice: befestigte … zusätzlich
  rationale: Das Präfix προσ- kann eine weitere oder zusätzliche Verstärkung ausdrücken; die Fußnote hält die schlichtere Wiedergabe ohne diesen Aspekt offen.
- source_word: ᾠκοδόμησεν ἑαυτῷ … οἴκησιν
  choice: baute sich dort eine Wohnung
  rationale: Die Formulierung bezeichnet einen für ihn selbst errichteten Wohnort. „Wohnung“ ist hier würdig und natürlich, ohne unnötig ein repräsentatives Gebäude vorauszusetzen.
theological_decisions:
- issue: Bedeutungsumfang von ἀκαθαρσία im Reinigungskontext
  choice: alles Unreine
  alternative: jede Unreinheit / jede Verunreinigung
  rationale: Der Text legt nicht fest, ob vor allem rituelle, moralische oder kultisch-politische Verunreinigung gemeint ist. Die breite Formulierung erhält diese Offenheit.
- issue: Geschlechtsspezifische Wiedergabe von ἄνδρας
  choice: Männer
  alternative: Menschen / Leute
  rationale: Die Vorlage verwendet einen ausdrücklich männlichen Ausdruck; der historische Zusammenhang erzwingt keine Neutralisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Stadt“ verdeutlicht den weiblichen Rückbezug von αὐτήν im Deutschen und vermeidet einen unklaren Pronomenbezug; „dort“ gibt ἐν αὐτῇ idiomatisch wieder.
