lexical_decisions:
- source_word: πολέμησον τὸν πόλεμον ἡμῶν
  choice: Kämpfe unseren Kampf
  rationale: Der aoristische Imperativ fordert zu unmittelbarem militärischem Handeln auf. Die Verbindung von »kämpfen« und »Kampf« bildet den griechischen figura-etymologica-Ausdruck formal nach und bewahrt durch »unseren« die persönliche Betroffenheit der Sprecher.
- source_word: πάντα ὅσα ἐὰν εἴπῃς ἡμῖν
  choice: alles, was du uns sagst
  rationale: Die Formulierung gibt die umfassende Bereitschaft wieder, künftige Anweisungen zu befolgen. Das Präsens »sagst« ist im Deutschen nach »alles, was« natürlich und trägt hier den zukunftsoffenen Sinn des griechischen Konjunktivs.
- source_word: ποιήσομεν
  choice: werden wir tun
  rationale: Das Futur von ποιέω bezeichnet hier die zugesagte Ausführung der Anweisungen. »Tun« bleibt direkt und vermeidet eine unnötige interpretierende Erweiterung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung »Kämpfe unseren Kampf« wurde trotz ihrer leichten Ungewöhnlichkeit bewahrt, weil sie die griechische Wortfigur und den knappen, eindringlichen Appell wiedergibt.
