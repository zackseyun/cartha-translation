base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/040.yaml
  text: And if any of you are fit to be enrolled among our people[a], let them be enrolled, and let there be peace between us.
translation:
  language: de
  text: Und wenn einige von euch geeignet sind, unter den Unsrigen[a] eingetragen zu werden, sollen sie eingetragen werden; und zwischen uns soll Frieden herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unter denen, die um uns sind«; die Wendung meint wahrscheinlich die Zugehörigkeit zur Gemeinschaft oder Partei des Sprechers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτήδειοι
  choice: geeignet
  rationale: Das Adjektiv bezeichnet hier die Eignung beziehungsweise Zulässigkeit im Zusammenhang mit der anschließenden förmlichen Eintragung, ohne einen genauer bestimmten Rechtsstatus vorauszusetzen.
- source_word: γράφηναι
  choice: aufgenommen zu werden
  rationale: Der Infinitiv steht in einem administrativen Zusammenhang. Die Wiedergabe bezeichnet die beabsichtigte Aufnahme in den Kreis, während das folgende ἐγγραφέσθωσαν die eigentliche Eintragung ausdrücklich benennt.
- source_word: τοὺς περὶ ἡμᾶς
  choice: in den Kreis der Unseren
  rationale: Wörtlich meint die Wendung »die um uns«. Im politischen Kontext bezeichnet sie wahrscheinlich die Gemeinschaft oder Partei des Sprechers; »der Kreis der Unseren« wahrt diese Offenheit besser als eine eindeutige ethnische Festlegung.
- source_word: ἐγγραφέσθωσαν
  choice: sollen sie eingetragen werden
  rationale: Das Verb bezeichnet die förmliche Registrierung oder Einschreibung und bewahrt so den administrativen Charakter der Aussage.
- source_word: γενέσθω ἀνὰ μέσον ἡμῶν εἰρήνη
  choice: zwischen uns soll Frieden herrschen
  rationale: Die natürliche deutsche Friedensformel gibt den wechselseitigen politischen Sinn von ἀνὰ μέσον ἡμῶν klar und würdig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der administrative Ton von Eintragung und Aufnahme bleibt erhalten; die politisch-soziale Bedeutung von τοὺς περὶ ἡμᾶς wird nicht unnötig auf »Volk« oder einen bestimmten Rechtsstatus verengt.
