  terminology: „Geeignet“ und „eingetragen“ sind für ἐπιτήδειοι bzw. γράφηναι/ἐγγραφέσθωσαν angemessen. „Die Unsrigen“ bewahrt die offene politische oder gemeinschaftliche Referenz von τοὺς περὶ ἡμᾶς, ohne sie als ethnisches „Volk“ festzulegen. Die Fußnote sollte die wörtliche Wendung idiomatisch genauer als „unter denen, die um uns sind“ angeben.
