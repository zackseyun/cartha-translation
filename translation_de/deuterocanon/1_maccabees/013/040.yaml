  source_fidelity: 'Die Grundbedeutung wird getroffen: Eignung, Zugehörigkeit zum Kreis der Sprechenden, förmliche Eintragung und Frieden zwischen den Parteien sind erhalten. Doch γράφηναι bezeichnet ebenso wie das nachfolgende ἐγγραφέσθωσαν die Einschreibung/Registrierung. Die Formulierung „aufgenommen zu werden“ verschiebt den ersten Ausdruck zu einer allgemeinen Aufnahme und schwächt die im Griechischen bewusst wiederholte administrative Terminologie ab.'
