  yaml_path: translation/deuterocanon/1_maccabees/013/031.yaml
  text: But Tryphon was acting deceitfully with Antiochus the younger king[a], and he killed him,
translation:
  language: de
  text: Tryphon aber ging mit Antiochus, dem jüngeren König, hinterlistig[a] um und tötete ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit List.'
    reason: Der griechische Dativ δόλῳ kann die Art und Weise („hinterlistig“) oder das Mittel („mit List“) ausdrücken.
lexical_decisions:
- source_word: ἐπορεύετο
  choice: ging … um
  rationale: Das Imperfekt bezeichnet ein fortdauerndes Verhalten in der Vergangenheit. Zusammen mit δόλῳ und μετά wird es im Deutschen natürlich mit „ging … mit … um“ wiedergegeben, ohne die im Kontext erkennbare Hinterlist zu verstärken.
- source_word: δόλῳ
  choice: hinterlistig
  rationale: Der Dativ kann die Art und Weise oder das Mittel bezeichnen. „Hinterlistig“ ist idiomatisch und gibt den Gedanken von Täuschung beziehungsweise List wieder.
- source_word: μετὰ Ἀντιόχου
  choice: mit … Antiochus
  rationale: μετά mit dem Genitiv bedeutet hier „mit“. Die Übersetzung deutet die Beziehung nicht gegen den Wortlaut als „gegen Antiochus“ um.
- source_word: τοῦ βασιλέως τοῦ νεωτέρου
  choice: dem jüngeren König Antiochus
  rationale: νεώτερος ist ein Komparativ und bezeichnet Antiochus als den jüngeren König. Die deutsche Wortstellung ist natürlich und bewahrt diese Unterscheidung.
- source_word: ἀπέκτεινεν
  choice: tötete
  rationale: Das Verb bedeutet schlicht „töten“. „Ermordete“ würde eine rechtliche oder moralische Wertung ausdrücklich machen, die das Verb selbst nicht zwingend enthält.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „ging … mit … um“ gibt den fortdauernden Charakter des griechischen Imperfekts idiomatisch wieder; der abschließende Satz bleibt bewusst knapp.
