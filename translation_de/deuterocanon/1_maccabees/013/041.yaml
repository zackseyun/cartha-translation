lexical_decisions:
- source_word: Ἔτους ἑκατοστοῦ ἑβδομηκοστοῦ πρώτῃ
  choice: Im 171. Jahr
  rationale: Die griechische Wendung ist eine Datierungsformel. Die knappe deutsche Ordinalschreibweise gibt sie natürlich und genau wieder.
- source_word: ὁ ζυγὸς
  choice: das Joch
  rationale: ζυγός bezeichnet wörtlich ein Joch und bildlich Fremdherrschaft oder Unterdrückung. „Joch“ bewahrt das anschauliche Bild und dessen geschichtlich-theologisches Gewicht.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: ἔθνη kann allgemein „Völker“ und im jüdischen Sprachgebrauch „Heiden“ bedeuten. „Der Völker“ ist quellennah und lässt die mögliche Nuance offen.
- source_word: ἀπὸ τοῦ Ἰσραήλ
  choice: von Israel
  rationale: ἀπό bezeichnet hier Trennung beziehungsweise Entfernung. „Von Israel genommen“ ist im Deutschen idiomatisch und drückt das Ende der Fremdherrschaft aus.
theological_decisions:
- issue: Ob τῶν ἐθνῶν als „der Völker“ oder als „der Heiden“ wiederzugeben ist
  choice: der Völker
  alternative: der Heiden
  rationale: Der Vers feiert das Ende ausländischer Herrschaft über Israel. „Heiden“ ist im jüdischen Kontext möglich, würde die religiöse Abgrenzung jedoch stärker hervorheben. „Völker“ bleibt näher am allgemeinen Bedeutungsumfang des griechischen Wortes; die Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Metapher „Joch“ bleibt erhalten; der passive Satzbau entspricht dem knappen chronikalischen Stil des griechischen Textes.
