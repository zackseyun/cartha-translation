  text: In the one hundred seventy-first year[a], the yoke of the nations was removed from Israel.
translation:
  language: de
  text: Im 171. Jahr[a] wurde Israel das Joch der Völker abgenommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde Israel das Joch der Heiden abgenommen“. Das griechische Wort kann allgemein „Völker“ oder im jüdischen Sprachgebrauch „Heiden“ bedeuten.'
