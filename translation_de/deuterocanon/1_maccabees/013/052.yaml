  text: And he established it as a yearly observance to celebrate this day. And he fortified the hill of the sanctuary beside the citadel[a], and he lived there, he and those with him.
translation:
  language: de
  text: Und er bestimmte, dass dieser Tag jedes Jahr gefeiert werden sollte. Dann befestigte er den Berg des Heiligtums bei der Zitadelle[a]. Dort wohnten er selbst und die, die bei ihm waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei der Akra«; das griechische Wort ἄκρα kann die seleukidische Festung in Jerusalem bezeichnen, aber auch allgemein eine Zitadelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν κατʼ ἐνιαυτόν τοῦ ἄγειν
  choice: bestimmte, dass … jedes Jahr gefeiert werden sollte
  rationale: Die Formulierung gibt die Einsetzung einer dauerhaft jährlich wiederkehrenden Feier natürlich wieder, ohne einen kirchlich-technischen Begriff einzuführen.
- source_word: τὴν ἡμέραν ταύτην
  choice: dieser Tag
  rationale: Der Demonstrativbezug auf den zuvor genannten Gedenktag bleibt erhalten.
- source_word: προσωχύρωσεν
  choice: befestigte
  rationale: Das Verb bezeichnet die zusätzliche militärische Sicherung beziehungsweise Verstärkung der Anlage; „befestigte“ ist präzise und idiomatisch.
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: den Berg des Heiligtums
  rationale: Die Wiedergabe bleibt nahe an ὄρος und ἱερόν und vermeidet, den später geläufigen Fachausdruck „Tempelberg“ in den Text einzutragen.
- source_word: τὸ παρὰ τὴν ἄκραν
  choice: neben der Zitadelle
  rationale: ἄκρα kann als Gattungsbezeichnung für eine Zitadelle verstanden werden; die mögliche Bezeichnung der konkreten seleukidischen Festung wird in der Fußnote bewahrt.
- source_word: ᾤκει
  choice: wohnte
  rationale: Das Imperfekt bezeichnet einen andauernden Aufenthalt; „wohnte“ ist im modernen Deutsch natürlich.
- source_word: οἱ παρʼ αὐτοῦ
  choice: seine Leute
  rationale: Die Wendung bezeichnet die zu Simons unmittelbarem Umfeld gehörenden Personen, ohne genauer festzulegen, ob Haushalt, Gefolge oder Begleiter gemeint sind.
