  text: And whatever we established with you stands[a], and the strongholds that you built shall remain yours.
translation:
  language: de
  text: Und alles, was wir mit euch festgesetzt haben, bleibt bestehen[a], und die Festungen, die ihr gebaut habt, sollen euch gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bleibt in Kraft“. Der griechische Text nennt nicht ausdrücklich, was festgesetzt wurde; im diplomatischen Zusammenhang sind Vereinbarungen oder Bestimmungen gemeint.'
    reason: lexikalische Alternative und im Ausgangstext unausgesprochenes Bezugswort
lexical_decisions:
- source_word: ὅσα
  choice: alles, was
  rationale: Das substantivisch gebrauchte Neutrum Plural bedeutet wörtlich „alles, was“. So bleibt offen, welche Vereinbarungen oder Bestimmungen gemeint sind, wie es auch der griechische Text offenlässt.
- source_word: ἐστήσαμεν
  choice: wir … festgesetzt haben
  rationale: Das Verb ἵστημι bezeichnet hier im diplomatischen Zusammenhang das verbindliche Festsetzen von Regelungen. „Festgesetzt“ ist im Deutschen natürlich und behält den formellen Ton bei.
- source_word: πρὸς ὑμᾶς
  choice: mit euch
  rationale: πρός bezeichnet hier die Beziehung zwischen den beteiligten Parteien; „mit euch“ gibt dies idiomatisch wieder.
- source_word: ἔστηκεν
  choice: bleibt bestehen
  rationale: Das Perfekt von ἵστημι drückt die fortdauernde Gültigkeit des zuvor Festgesetzten aus. „Bleibt bestehen“ bewahrt zugleich das Bild des griechischen Ausdrucks.
- source_word: ὀχυρώματα
  choice: Festungen
  rationale: Das Wort bezeichnet befestigte Anlagen oder Orte. „Festungen“ ist prägnant, verständlich und vermeidet eine unnötige architektonische Spezifizierung.
- source_word: ᾠκοδομήσατε
  choice: die ihr gebaut habt
  rationale: οἰκοδομέω bedeutet grundsätzlich „bauen“. Obwohl es hier um Festungen geht, wird nicht ausdrücklich „befestigen“ gesagt.
- source_word: ὑπαρχέτω ὑμῖν
  choice: sollen euch gehören
  rationale: Die imperativische Form bestätigt im amtlichen Zusammenhang den Besitz. „Sollen euch gehören“ gibt die rechtliche Gewährung natürlich wieder, ohne stärker als der griechische Text ausdrücklich Dauer hineinzulesen.
