  text: And now[a], far be it from me to spare my life in any time of distress; for I am not better than my brothers.
translation:
  language: de
  text: 'Und nun: Fern sei es mir, mein Leben zu jeder Zeit der Bedrängnis zu schonen[a]; denn ich bin nicht besser als meine Brüder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich selbst zu schonen“; wörtlich: „meine Seele / mein Leben zu schonen“. Das griechische Wort ψυχή bezeichnet hier das Leben beziehungsweise die eigene Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μή μοι γένοιτο
  choice: Es sei fern von mir
  rationale: Die feste, nachdrückliche Wendung gibt den optativischen Ausdruck starker Zurückweisung würdig und im Deutschen verständlich wieder.
- source_word: φείσασθαί μου τῆς ψυχῆς
  choice: mein Leben … zu schonen
  rationale: ψυχή bezeichnet hier angesichts drohender Bedrängnis das eigene Leben, nicht ausdrücklich eine immaterielle Seele; φείδομαι mit Genitiv bedeutet schonen beziehungsweise bewahren.
- source_word: ἐν παντὶ καιρῷ θλίψεως
  choice: in irgendeiner Zeit der Bedrängnis
  rationale: Die Wiedergabe bewahrt den distributiven Sinn von παντί und fasst θλῖψις als Bedrängnis, Not oder Druck.
- source_word: οὐ γάρ εἰμι κρείσσων
  choice: denn ich bin nicht besser
  rationale: κρείσσων kann ‚besser‘, ‚stärker‘ oder ‚überlegen‘ bedeuten. Im Vergleich mit Simons Brüdern drückt ‚besser‘ hier am natürlichsten aus, dass er keinen höheren Anspruch auf Selbsterhaltung hat.
- source_word: τῶν ἀδελφῶν μου
  choice: als meine Brüder
  rationale: Im Erzählzusammenhang sind Simons leibliche Brüder gemeint; die konkrete männliche Bezeichnung ist daher sachgerecht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst feierliche Formel „Es sei fern von mir“ erhält die starke Zurückweisung des griechischen Ausdrucks; der übrige Satz bleibt klar und allgemein verständlich.
