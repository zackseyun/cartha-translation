  yaml_path: translation/deuterocanon/1_maccabees/013/051.yaml
  text: And he entered it on the twenty-third day of the second month, in the one hundred seventy-first year, with praise and palm branches and with harps and cymbals and stringed instruments and with hymns and songs, because a great enemy had been crushed out of Israel.
translation:
  language: de
  text: Und er zog am dreiundzwanzigsten Tag des zweiten Monats im einhunderteinundsiebzigsten Jahr mit Lob und Palmzweigen, mit Harfen[a], Zimbeln und Saiteninstrumenten[b], mit Hymnen und Liedern in sie ein, denn ein großer Feind war aus Israel herausgeschlagen worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leiern“. Das mit κινύραις bezeichnete antike Saiteninstrument lässt sich nicht sicher einem heutigen Instrument zuordnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort νάβλαις bezeichnet ein bestimmtes antikes Saiteninstrument; auch Übersetzungen wie „Harfen“ oder „Psalterien“ sind möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν εἰς αὐτήν
  choice: zog … in sie ein
  rationale: Das Verb bezeichnet das Hineingehen; das feminine Pronomen wird bewahrt, da es sich im Zusammenhang auf eine Stadt oder Festung bezieht. Die deutsche Verbklammer ermöglicht eine natürliche Satzführung.
- source_word: τῇ τρίτῃ καὶ εἰκάδι τοῦ δευτέρου μηνός
  choice: am dreiundzwanzigsten Tag des zweiten Monats
  rationale: Die griechische Datumsangabe wird in gegenwärtigem, eindeutigem Deutsch wiedergegeben.
- source_word: ἔτους ἑνὸς καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: im einhunderteinundsiebzigsten Jahr
  rationale: Bewahrt die genaue Jahreszahl der seleukidischen Ära, ohne sie durch eine moderne Datierung zu ersetzen.
- source_word: μετὰ αἰνέσεως
  choice: unter Lobgesang
  rationale: αἴνεσις bezeichnet Lobpreis; im musikalischen Festzug wirkt „Lobgesang“ natürlich, ohne den Ausdruck auf Dank einzuengen.
- source_word: βαΐων
  choice: Palmzweigen
  rationale: Gemeint sind bei einem Festzug getragene Zweige der Palme.
- source_word: κινύραις
  choice: Harfen
  rationale: Eine verständliche traditionelle Bezeichnung für das antike Saiteninstrument; seine genaue Bauart bleibt unsicher und wird in einer Fußnote angezeigt.
- source_word: κυμβάλοις
  choice: Zimbeln
  rationale: Direkte und im Deutschen geläufige Bezeichnung des Schlaginstruments.
- source_word: νάβλαις
  choice: Saiteninstrumenten
  rationale: Das Wort benennt ein bestimmtes antikes Saiteninstrument, dessen genaue moderne Entsprechung unsicher ist. Der Oberbegriff vermeidet eine unbegründete Präzisierung.
- source_word: ὕμνοις καὶ ᾠδαῖς
  choice: Hymnen und Liedern
  rationale: Gibt die beiden griechischen Begriffe getrennt und in würdigem, verständlichem Deutsch wieder.
- source_word: συνετρίβη ἐχθρὸς μέγας ἐξ Ἰσραήλ
  choice: ein großer Feind war aus Israel hinaus zerschmettert worden
  rationale: Bewahrt das starke Bild des passiven Verbs sowie ἐξ Ἰσραήλ als Entfernung des Feindes aus Israel, statt es lediglich als Niederlage zu verallgemeinern.
theological_decisions:
- issue: Charakter des Festzuges
  choice: Feierliche Sprache von Lob, Musik und Liedern ohne zusätzliche kultische oder messianische Deutung
  alternative: Die Feier ausdrücklich als Dankgottesdienst, Psalmengesang oder messianischen Triumph kennzeichnen
  rationale: Der griechische Text beschreibt einen öffentlichen Siegeszug mit Lob und Musik, legt aber keine weitergehende typologische oder technische liturgische Einordnung fest.
- issue: Aussage über die Beseitigung des Feindes
  choice: Das Passiv und die räumliche Wendung „aus Israel“ werden gewahrt
  alternative: „weil Israel einen großen Feind besiegt hatte“
  rationale: Die Alternative würde ein handelndes Subjekt ergänzen und die starke, möglicherweise theologisch offene Passivform des Ausgangstextes auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Aufzählung und der feierliche Rhythmus des griechischen Satzes bleiben erhalten; archaische Formen werden vermieden. Sämtliche Fußnotenmarker stehen unmittelbar bei den betroffenen Instrumenten.
