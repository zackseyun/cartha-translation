  text: And Jonathan son of Absalom sent a considerable force with him to Joppa[a], and he drove out those who were in it and remained there.
translation:
  language: de
  text: Und er sandte Jonatan, den Sohn Absaloms, zusammen mit einer beträchtlichen Streitmacht nach Joppe. Jonatan vertrieb die, die sich darin befanden, und blieb dort in der Stadt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Das übliche deutsche Erzählverb gibt das Aussenden einer Person in einem militärischen Auftrag würdig und natürlich wieder.
- source_word: Ἰωνάθαν τὸν τοῦ Ἀψαλώμου
  choice: Jonatan, den Sohn Absaloms
  rationale: Der Akkusativ weist Jonatan als Objekt von ἀπέστειλεν aus; die Genitivkonstruktion bezeichnet seine Abstammung. Damit wird die griechische Syntax genauer wiedergegeben als in der englischen Beratungsschicht.
- source_word: καὶ μετʼ αὐτοῦ δύναμιν ἱκανὴν
  choice: zusammen mit einer beträchtlichen Streitmacht
  rationale: δύναμις bezeichnet hier eine militärische Truppe, während ἱκανή ihre beachtliche beziehungsweise ausreichende Stärke ausdrückt. Die deutsche Formulierung verbindet beide Satzglieder natürlich.
- source_word: εἰς Ἰόππην
  choice: nach Joppe
  rationale: Bei Städtenamen ist „nach“ die idiomatische deutsche Wiedergabe der gerichteten Ortsangabe.
- source_word: ἐξέβαλεν
  choice: vertrieb
  rationale: Das Verb bezeichnet im militärisch-politischen Zusammenhang ein gewaltsames Entfernen, ohne die Betroffenen genauer zu bestimmen.
- source_word: τοὺς ἐν αὐτῇ ὄντας
  choice: die, die sich darin befanden
  rationale: Die Formulierung bewahrt die Unbestimmtheit des Griechischen und nennt die Betroffenen nicht vorschnell Einwohner, Besatzung oder Gegner.
- source_word: ἔμεινεν ἐκεῖ ἐν αὐτῇ
  choice: blieb dort in der Stadt
  rationale: „dort“ gibt ἐκεῖ wieder, „in der Stadt“ das zusätzliche ἐν αὐτῇ. So bleibt die doppelte Ortsangabe erhalten, ohne im Deutschen unnatürlich „dort in ihr“ zu sagen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐξέβαλεν und ἔμεινεν
  choice: Er
  alternative: Dieser (Jonatan)
  rationale: Im Zusammenhang ist Jonatan sehr wahrscheinlich der Handelnde. Das schlichte Pronomen bewahrt jedoch die formale Zurückhaltung des Griechischen, das den Namen nicht wiederholt und das Subjekt nicht ausdrücklich bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei griechischen Sätze werden zur besseren Lesbarkeit getrennt. „Joppe“ folgt der im Deutschen geläufigen biblischen Namensform. Die doppelte Ortsangabe am Versende wird im Haupttext natürlich, aber vollständig abgebildet.
