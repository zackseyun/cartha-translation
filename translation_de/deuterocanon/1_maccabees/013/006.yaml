  source_fidelity: Der Entwurf gibt den adversativen Anschluss (πλήν), die angekündigte Vergeltung (ἐκδικήσω), die vier Bezugsgruppen, die feindliche Sammlung aller Völker, die Vernichtungsabsicht und ihr Motiv sachgerecht wieder. Die Konstruktion „mein Volk ... rächen“ ist jedoch im modernen Deutsch weniger eindeutig als die griechische Präpositionalfügung περί; „Rache nehmen für“ bildet die Bezugsrichtung klarer ab.
  naturalness: Der Ton ist modern, würdig und gut verständlich. „Ich werde Rache nehmen für ...“ ist in dieser Aufzählung idiomatischer und klarer als die direkte Verbindung mehrerer Objekte mit „rächen“.
  terminology: „Volk“, „Heiligtum“, „Frauen und Kinder“, „alle Völker“ und „ausrotten“ sind kontextgerecht. Bei τῶν ἁγίων ist „Heiligtum“ als kontextuelle Wiedergabe vertretbar; die Fußnote soll neben Dingen und Stätten auch die formal mögliche Deutung „die Heiligen“ nennen, damit die griechische Mehrdeutigkeit nicht unnötig eingeengt wird.
