base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/006.yaml
  text: But I will take vengeance for my nation[a], and for the sanctuary, and for our women and children[c][b], because all the nations have gathered to wipe us out out of hatred.
translation:
  language: de
  text: Doch ich werde Rache nehmen für mein Volk, für das Heiligtum[a] und für unsere Frauen[b] und Kinder; denn alle Völker haben sich aus Feindschaft[c] versammelt, um uns auszurotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die heiligen Dinge“ oder „die heiligen Stätten“; auch: „die Heiligen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unsere Ehefrauen und Kinder“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „um der Feindschaft willen“; auch „aus Hass“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Leitet einen starken Gegensatz zum vorausgehenden Zusammenhang ein und klingt im modernen Deutschen natürlich und würdig.
- source_word: ἐκδικήσω
  choice: ich werde … rächen
  rationale: Das Futur bezeichnet hier Vergeltung beziehungsweise das Eintreten für die Bedrohten. „Rächen“ bewahrt die kraftvolle Bedeutung und lässt sich idiomatisch mit den folgenden Bezugsgrößen verbinden.
- source_word: τοῦ ἔθνους μου
  choice: mein Volk
  rationale: ἔθνος bezeichnet hier die jüdische Volksgemeinschaft. „Mein Volk“ ist im Deutschen natürlicher als „meine Nation“ und bewahrt den gemeinschaftlichen Sinn.
- source_word: τῶν ἁγίων
  choice: das Heiligtum
  rationale: Der substantivierte Plural bezeichnet im tempelbezogenen Kontext von 1 Makkabäer wahrscheinlich das Heiligtum beziehungsweise den heiligen Bereich. Die wörtlich offenere Form wird in der Fußnote genannt.
- source_word: τῶν γυναικῶν καὶ τῶν τέκνων ἡμῶν
  choice: unsere Frauen und Kinder
  rationale: γυναῖκες kann sowohl „Frauen“ als auch „Ehefrauen“ bedeuten. Der weitere Ausdruck „Frauen“ passt zur gemeinschaftlichen Reichweite der Aufzählung; die engere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: συνήχθησαν
  choice: haben sich … versammelt
  rationale: Das Aorist-Passiv beschreibt das feindliche Zusammenkommen der Völker. Das deutsche Perfekt stellt den daraus entstandenen gegenwärtigen Bedrohungszustand natürlich dar.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: Gemeint sind die umliegenden Völker. „Alle Völker“ gibt den historischen und kollektiven Sinn wieder, ohne eine spätere fachsprachliche Bedeutung von „Heiden“ einzutragen.
- source_word: ἐκτρῖψαι ἡμᾶς
  choice: um uns auszurotten
  rationale: ἐκτρίβω bezeichnet hier vollständige Vernichtung. „Ausrotten“ gibt diese Schärfe präzise und idiomatisch wieder.
- source_word: ἔχθρας χάριν
  choice: aus Feindschaft
  rationale: Die Wendung nennt das feindselige Motiv. „Aus Feindschaft“ wahrt den kausalen Sinn und bleibt näher an ἔχθρα als das emotional stärker festgelegte „aus Hass“.
theological_decisions:
- issue: Bezug von τῶν ἁγίων
  choice: das Heiligtum
  alternative: die heiligen Dinge; die heiligen Stätten; die Heiligen
  rationale: Der tempelzentrierte Kontext von 1 Makkabäer spricht am ehesten für das Heiligtum beziehungsweise den heiligen Tempelbereich, nicht für heilige Personen. Da der griechische substantivierte Plural formal offener ist, wird diese Mehrdeutigkeit durch eine Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die militärische Dringlichkeit und die Härte der Vernichtungsabsicht bleiben erhalten; echte lexikalische Mehrdeutigkeiten werden nicht im Haupttext überladen, sondern in den markierten Fußnoten offengelegt.
