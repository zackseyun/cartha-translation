translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischem „zogen“. Die Satzstruktur bewahrt die griechische Abfolge. Gedankenstriche fassen die Bemerkung über den langen Weg als Einschub; der abschließende Doppelpunkt verbindet „antworteten“ mit der im nächsten Vers folgenden direkten Rede.
