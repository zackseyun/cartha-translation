  text: And they went to Rome—the journey was very long indeed—and entered the council chamber and answered[b][a],
translation:
  language: de
  text: 'Sie reisten nach Rom – die Reise war überaus lang[a] –, gingen in den Ratssaal[b] und antworteten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Der Weg war überaus lang.“ Gemeint ist im Zusammenhang die große Länge der Reise.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in das Senatsgebäude“. Das griechische Wort bezeichnet den Ort, an dem der Rat tagte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: zogen
  rationale: Das aoristische Deponens πορεύομαι bezeichnet hier die Reisebewegung. „Sie zogen“ klingt in historischer Erzählung natürlich und etwas würdevoller als „sie gingen“, ohne zusätzliche Bedeutung einzutragen.
- source_word: εἰς Ῥώμην
  choice: nach Rom
  rationale: Das direktionale εἰς mit einem Städtenamen wird im Deutschen idiomatisch mit „nach“ wiedergegeben.
- source_word: ἡ ὁδὸς πολλὴ σφόδρα
  choice: der Weg war überaus weit
  rationale: Die Formulierung bleibt nahe bei ὁδός („Weg“) und gibt die starke Betonung durch πολλὴ σφόδρα mit „überaus“ wieder. „Weit“ bezeichnet idiomatisch die große Länge beziehungsweise Entfernung des Weges.
- source_word: εἰσῆλθον
  choice: gingen in
  rationale: Der Aorist von εἰσέρχομαι bezeichnet das Hineingehen. Zusammen mit dem Ortsausdruck ist „gingen in den Ratssaal“ im Deutschen flüssiger als das formellere „betraten“.
- source_word: τὸ βουλευτήριον
  choice: den Ratssaal
  rationale: βουλευτήριον bezeichnet den Ort, an dem ein Rat tagt. „Ratssaal“ ist transparent und vermeidet die historisch plausible, aber stärker ausdeutende Wiedergabe „Senatsgebäude“.
- source_word: ἀπεκρίθησαν
  choice: antworteten
  rationale: Die übliche Bedeutung ist „antworten/erwidern“. Der Doppelpunkt macht deutlich, dass der Inhalt der Antwort im folgenden Vers steht, ohne das griechische Verb umzudeuten.
