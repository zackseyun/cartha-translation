  text: According to these terms[a], the Romans thus made an agreement with the people of the Jews.
translation:
  language: de
  text: Entsprechend diesen Bestimmungen schlossen die Römer mit dem Volk der Juden[a] eine solche Vereinbarung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judäer“. Das griechische Wort Ἰουδαίων kann je nach Zusammenhang sowohl Juden als auch Judäer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τοὺς λόγους τούτους
  choice: Nach diesen Bestimmungen
  rationale: Die Wendung bezeichnet die Übereinstimmung mit den zuvor genannten Vertragsklauseln. „Bestimmungen“ gibt den rechtlich-diplomatischen Zusammenhang natürlicher wieder als das wörtliche „Worte“.
- source_word: οὕτως
  choice: auf diese Weise
  rationale: Die Formulierung verweist auf die soeben dargelegten Bedingungen und bewahrt diesen Rückbezug ausdrücklich.
- source_word: ἔστησαν
  choice: schlossen … eine Vereinbarung
  rationale: Der Aorist von ἵστημι bezeichnet hier im diplomatischen Zusammenhang das Zustandebringen beziehungsweise Festsetzen einer Vereinbarung. Das im Griechischen elliptische Objekt wird aus dem Vertragskontext erschlossen, ohne die Vereinbarung enger als „Bund“ oder „Vertrag“ zu bestimmen.
- source_word: Ῥωμαῖοι
  choice: die Römer
  rationale: Das artikellose Ethnikon wird im Deutschen natürlich als Bezeichnung der handelnden Volksgruppe mit Artikel wiedergegeben.
- source_word: τῷ δήμῳ
  choice: mit dem Volk
  rationale: δῆμος bezeichnet hier das Volk als politische Gemeinschaft; der Dativ nennt die andere Partei der Vereinbarung.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Ἰουδαῖοι kann sowohl „Juden“ als auch „Judäer“ bedeuten. In diesem diplomatischen Kontext ist das jüdische Volk als kollektive Größe gemeint; die geografische Lesart bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe von Ἰουδαίων
  choice: der Juden
  alternative: der Judäer
  rationale: Die Formulierung bezieht sich wahrscheinlich auf das jüdische Volk als politische und ethnoreligiöse Gemeinschaft, nicht ausschließlich auf Bewohner Judäas. Da die griechische Bezeichnung beide Bedeutungen zulässt, wird die Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht formellem, dem diplomatischen Zusammenhang entsprechendem Ton. Die griechische Ellipse bei ἔστησαν wird für verständliches Deutsch behutsam ergänzt.
