lexical_decisions:
- source_word: ἤρεσεν
  choice: fand ihre Zustimmung
  rationale: Der Aorist von ἀρέσκω bezeichnet hier die zustimmende Aufnahme. Die deutsche Wendung ist idiomatisch und gibt den positiven Beschlusscharakter wieder.
- source_word: ὁ λόγος
  choice: der Vorschlag
  rationale: λόγος meint im diplomatischen Erzählzusammenhang nicht bloß ein einzelnes Wort, sondern das zuvor vorgebrachte Anliegen beziehungsweise den Vorschlag.
- source_word: ἐνώπιον αὐτῶν
  choice: ihre
  rationale: Das wörtliche »vor ihnen« bezeichnet hier ihr Urteil. In der idiomatischen Wendung »fand ihre Zustimmung« ist diese Beziehung natürlich wiedergegeben.
