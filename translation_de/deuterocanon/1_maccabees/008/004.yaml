base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/004.yaml
  text: And they gained control of the whole region by their counsel and by the sword—though the region was very far away from them—and of the kings who came against them from the end of the earth[a], until they crushed them and struck them with a great blow[b]; and the rest give them tribute year by year.
translation:
  language: de
  text: Und sie brachten das ganze Gebiet durch ihren Rat und durch das Schwert unter ihre Herrschaft – obwohl es sehr weit von ihnen entfernt lag – ebenso die Könige, die vom Ende der Erde[a] gegen sie herangezogen waren, bis sie diese zerschmetterten und ihnen einen schweren Schlag versetzten; die Übrigen[b] entrichten ihnen Jahr für Jahr Tribut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vom Ende der Erde«; gemeint ist eine äußerst große Entfernung.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Übrigen« können die verbleibenden Herrscher oder Völker gemeint sein, die weiterhin jährlich Tribut zahlen.
    reason: ambiguity
lexical_decisions:
- source_word: κατεκράτησαν
  choice: brachten … unter ihre Herrschaft
  rationale: Gibt die gewaltsam errungene Vorherrschaft im politisch-militärischen Zusammenhang natürlich und präzise wieder.
- source_word: τοῦ τόπου παντός
  choice: das ganze Gebiet
  rationale: τόπος bezeichnet hier nicht bloß einen Ort, sondern ein größeres politisch-geografisches Gebiet.
- source_word: τῇ βουλῇ αὐτῶν
  choice: durch ihren klugen Rat
  rationale: βουλή kann Rat, Planung oder politische Klugheit bezeichnen. Die Formulierung bewahrt den Gegensatz zwischen überlegtem Vorgehen und Waffengewalt.
- source_word: τῇ ῥομφαίᾳ
  choice: durch das Schwert
  rationale: Bewahrt die griechische Metonymie für militärische Gewalt und ist im Deutschen verständlich.
- source_word: μακρὰν ἀπέχων ἀπʼ αὐτῶν σφόδρα
  choice: sehr weit von ihnen entfernt lag
  rationale: Gibt sowohl die große Entfernung als auch die Verstärkung durch σφόδρα wieder.
- source_word: τῶν βασιλέων τῶν ἐπελθόντων ἐπʼ αὐτούς
  choice: ebenso die Könige, die … gegen sie herangezogen waren
  rationale: Der Genitiv hängt weiterhin von κατεκράτησαν ab. „Ebenso“ macht diese syntaktische Fortführung im Deutschen deutlich, ohne eine neue Aussage einzuführen.
- source_word: ἀπʼ ἄκρου τῆς γῆς
  choice: vom Ende der Erde
  rationale: Folgt dem griechischen Singular und bewahrt das anschauliche Idiom für äußerste Ferne; eine Fußnote erläutert es.
- source_word: συνέτριψαν
  choice: zerschmetterten
  rationale: Bewahrt die starke, bildhafte Bedeutung des militärischen Verbs.
- source_word: ἐπάταξαν ἐν αὐτοῖς πληγὴν μεγάλην
  choice: brachten ihnen eine schwere Niederlage bei
  rationale: Gibt das griechische Schlag-Wortfeld in natürlichem deutschem Militärstil wieder, ohne die Stärke von μεγάλη abzuschwächen.
- source_word: οἱ ἐπίλοιποι
  choice: die Übrigen
  rationale: Bewahrt die Unbestimmtheit des griechischen Ausdrucks, der sich auf die verbleibenden Herrscher oder Völker beziehen kann.
- source_word: ὀιδόασιν αὐτοῖς φόρον
  choice: entrichten ihnen … Tribut
  rationale: Trotz der auffälligen griechischen Verbform ergibt der Zusammenhang die fortdauernde Tributzahlung; „Tribut entrichten“ ist idiomatisch und würdevoll.
- source_word: κατʼ ἐνιαυτόν
  choice: Jahr für Jahr
  rationale: Gibt den distributiven und wiederkehrenden Charakter der jährlichen Zahlung wieder.
