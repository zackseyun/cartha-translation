base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/023.yaml
  text: May it go well for the Romans and for the nation of the Jews[a], on sea and on land forever[b]; and may sword and enemy be far from them.
translation:
  language: de
  text: Den Römern und dem Volk der Juden möge es auf dem Meer und auf dem Land[a] für immer gut gehen, und Schwert[b] und Feind mögen ihnen fernbleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „im Meer und auf dem trockenen Land“. Die griechische Paarformel bezeichnet das Wohlergehen in allen Bereichen.'
    reason: lexical_alternative
  - marker: b
    text: „Schwert“ steht hier wahrscheinlich sinnbildlich für Krieg oder bewaffnete Gewalt; der Haupttext bewahrt das konkrete griechische Bild.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς γένοιτο
  choice: möge es gut gehen
  rationale: Die Optativform drückt einen Wunsch oder Segensspruch aus. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den feierlichen Charakter.
- source_word: Ῥωμαίοις
  choice: den Römern
  rationale: Der Dativ Plural bezeichnet das römische Volk und hängt von der unpersönlichen Wendung „möge es gut gehen“ ab.
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: dem Volk der Juden
  rationale: ἔθνος bezeichnet hier eine ethnisch-politische Gemeinschaft. „Volk der Juden“ bleibt der griechischen Genitivverbindung nahe und ist verständlich.
- source_word: ἐν τῇ θαλάσσῃ καὶ ἐπὶ τῆς ξηρᾶς
  choice: auf dem Meer und auf dem Land
  rationale: Die konventionelle Paarformel umfasst beide Tätigkeitsbereiche und wahrscheinlich sinngemäß alle Lebensbereiche. Die deutsche Fassung bewahrt das konkrete Bild.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: In diesem Bündniswunsch bezeichnet die Wendung eine unbegrenzte, fortdauernde Zeit; „für immer“ ist klar und gegenwärtig.
- source_word: ῥομφαία
  choice: Schwert
  rationale: Die konkrete Waffenbezeichnung wird beibehalten, obwohl sie im Zusammenhang wahrscheinlich metonymisch für Krieg oder bewaffnete Gewalt steht.
- source_word: ἐχθρός
  choice: Feind
  rationale: Der Singular kann kollektiv oder repräsentativ verstanden werden. „Feind“ wahrt diese Form und das knappe Parallelgefüge.
- source_word: μακρυνθείη ἀπ’ αὐτῶν
  choice: mögen ihnen fernbleiben
  rationale: Der passive Optativ formuliert den Wunsch nach Entfernung. „Fernbleiben“ gibt das Ergebnis idiomatisch wieder, ohne die Aussage als aktives menschliches Handeln festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem feierlichen Wunschmarker „möge“. Die koordinierte Schlussformel bleibt knapp und bildhaft; die im Griechischen auffällige Einzahl beim Verb wird im Deutschen zugunsten grammatisch natürlicher Kongruenz im Plural wiedergegeben.
