base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/005.yaml
  text: And Philip[a], and Perseus king of the Kittians[b], and those who rose up against them—they crushed them in war and prevailed over them.
translation:
  language: de
  text: Die Römer zerschmetterten Philipp und Perseus, den König der Kittäer[a], und diejenigen[b], die sich gegen sie erhoben hatten, im Krieg und gewannen die Oberhand über sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch „König der Kittäer“. Historisch ist damit wahrscheinlich das makedonische Herrschaftsgebiet gemeint; manche Übersetzungen geben diese Deutung statt des griechischen Volksnamens wieder.
    reason: alternative_reading
  - marker: b
    text: Der überlieferte griechische Text enthält an dieser Stelle dreimal hintereinander καὶ („und“). Dies ist vermutlich eine Textunregelmäßigkeit, verändert den Sinn aber nicht wesentlich.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππον
  choice: Philipp
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: Περσέα
  choice: Perseus
  rationale: Der Personenname wird nach der etablierten deutschen Namensform wiedergegeben.
- source_word: Κιτιέων
  choice: der Kittäer
  rationale: Die Wiedergabe bewahrt das griechische Ethnikon im Plural, statt die historisch naheliegende Deutung „Makedonier“ in den Haupttext einzutragen.
- source_word: βασιλέα
  choice: den König
  rationale: Übliche Wiedergabe des Herrschertitels; Kasus und Apposition beziehen die Bezeichnung im überlieferten Wortlaut unmittelbar auf Perseus.
- source_word: τοὺς ἐπηρμένους ἐπʼ αὐτοὺς
  choice: diejenigen, die sich gegen sie erhoben hatten
  rationale: Bewahrt das Bild des feindlichen Sich-Erhebens und gibt das Partizip in natürlichem modernem Deutsch wieder.
- source_word: συνέτριψαν
  choice: zerschmetterten
  rationale: Drückt die im Verb bezeichnete gewaltsame und vollständige militärische Niederlage kräftig aus.
- source_word: πολέμῳ
  choice: im Krieg
  rationale: Natürliche Wiedergabe des Dativs im militärischen Zusammenhang.
- source_word: κατεκράτησαν αὐτῶν
  choice: gewannen die Oberhand über sie
  rationale: Gibt das Erlangen von Überlegenheit oder Herrschaft wieder, ohne eine dauerhafte politische Unterwerfung vorauszusetzen.
theological_decisions:
- issue: Historisch deutungsbedürftiges Ethnikon Κιτιέων
  choice: der Kittäer
  alternative: der Makedonier; von Kition
  rationale: Der Haupttext folgt der griechischen Bezeichnung und lässt die historische Identifizierung offen. Die wahrscheinlich gemeinten makedonischen Herrscher werden nur in der Fußnote erläutert.
- issue: Bezug der wiederholten Pronomen αὐτούς/αὐτῶν
  choice: sie … sie
  alternative: ausdrückliche Ersetzung durch „die Römer“ beziehungsweise namentliche Gegner
  rationale: Die griechische Pronominalstruktur bleibt erhalten, damit die nur aus dem Zusammenhang erschließbaren Bezüge nicht stillschweigend festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftigen militärischen Verben des Griechischen werden bewahrt. Die mehrfachen Pronomen bleiben bewusst stehen, um die Bezüge nicht über den Wortlaut hinaus zu vereindeutigen; das dreifache καὶ wird wegen seiner offenkundigen Überlieferungsunregelmäßigkeit nicht im Lesetext nachgebildet.
