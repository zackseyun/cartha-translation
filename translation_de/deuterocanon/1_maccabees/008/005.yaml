    rationale: Das griechische Verb συνέτριψαν ist pluralisch und bezieht sich im unmittelbaren Kontext auf die Römer. Die deutsche Nachstellung „zerschmetterten sie“ nach einer langen Objektgruppe erzeugt vermeidbare syntaktische Mehrdeutigkeit. „Die Römer“ macht den kontextuell gegebenen Bezug deutlich.
