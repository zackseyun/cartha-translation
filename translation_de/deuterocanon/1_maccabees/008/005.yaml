  to: Die Römer zerschmetterten Philipp und Perseus, den König der Kittäer[a], und diejenigen[b], die sich gegen sie erhoben hatten, im Krieg und gewannen die Oberhand über sie.
  rationale: Die Revision klärt das aus dem Kontext vorausgesetzte Subjekt („Die Römer“) und beseitigt damit eine im Deutschen erhebliche syntaktische Mehrdeutigkeit. Sie bewahrt die griechische Reihenfolge der Objekte, das nicht interpretierend ersetzte Ethnikon, die feindliche Wendung und die beiden militärischen Aussagen. Die Fußnoten werden ihren sachlich passenden Ankern zugeordnet; die textkritische Anmerkung steht bei der Verbindung vor der Gegnergruppe, an der die dreifache καὶ-Überlieferung vorliegt.
