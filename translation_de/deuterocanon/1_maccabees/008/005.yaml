review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur, die beiden Eigennamen, das Ethnikon Κιτιέων, das feindliche Sich-Erheben sowie die beiden militärischen Prädikate insgesamt treffend wieder. Die Fußnote zur dreifachen Überlieferung von καὶ ist sachlich angemessen. Allerdings wird der durch den vorangestellten Kontext und die griechischen Pluralformen klar bezeichnete Handelnde im Deutschen durch das nachgestellte „sie“ unnötig und missverständlich; „die Römer“ stellt keinen zusätzlichen Sinn dar, sondern macht das im Kontext vorausgesetzte Subjekt sichtbar.
  naturalness: „Auch Philipp und Perseus ... zerschmetterten sie“ ist im Deutschen wegen der Stellung und Wiederholung von „sie“ schwer lesbar und kann zunächst fälschlich Philipp und Perseus als Subjekt erscheinen lassen. Mit einem vorangestellten Subjekt und der natürlichen Verbfolge ist der Vers klar und modern, ohne den knappen Charakter des Originals aufzugeben.
  terminology: '„Philipp“, „Perseus“, „Kittäer“, „König“, „sich gegen sie erhoben“, „zerschmetterten“ und „gewannen die Oberhand“ sind terminologisch vertretbar. Das Ethnikon soll im Haupttext nicht durch „Makedonier“ ersetzt werden. Die Fußnotenanker sind jedoch vertauscht: Der Anker bei „Kittäer“ muss die Erläuterung des Ethnikons tragen, während die Textkritik zu den wiederholten καὶ nicht an „erhoben hatten“ verankert werden kann, da die Wiederholung im überlieferten Text vor der Gegnergruppe steht.'
