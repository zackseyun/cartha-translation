  text: and what they did in the land of Spain[a], to gain control of the silver and gold mines there,
translation:
  language: de
  text: und was sie im Land Spanien getan hatten, um die dortigen Silber- und Goldminen[a] in ihre Gewalt zu bringen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die dortigen Silber- und Goldvorkommen«; das griechische Wort kann sowohl die Metalle beziehungsweise Bodenschätze als auch die Minen bezeichnen, aus denen sie gewonnen wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χώρα Σπανίας
  choice: Land Spanien
  rationale: χώρα bezeichnet Land, Gebiet oder Territorium. „Land Spanien“ gibt die antike geografische Bezeichnung natürlich wieder, ohne ausdrücklich einen modernen Nationalstaat vorauszusetzen.
- source_word: ἐποίησαν
  choice: getan hatten
  rationale: Der Aorist blickt in der berichtenden Aufzählung auf die Taten der Römer zurück; das deutsche Plusquamperfekt fügt sich natürlich in diesen Rückblick ein.
- source_word: κατακρατῆσαι
  choice: in ihre Gewalt zu bringen
  rationale: Der Aoristinfinitiv mit τοῦ bezeichnet hier den Zweck. κατακρατέω drückt wirksame Herrschaft beziehungsweise Kontrolle aus; die gewählte Wendung bewahrt zugleich den machtpolitischen Ton.
- source_word: μέταλλα
  choice: Minen
  rationale: μέταλλον kann Bergwerk, Mine oder mineralische beziehungsweise metallische Vorkommen bezeichnen. Im Zusammenhang mit Silber und Gold ist „Minen“ eine natürliche, konkrete Wiedergabe; die lexikalische Breite wird in der Fußnote erhalten.
- source_word: ἀργυρίου καὶ χρυσίου
  choice: Silber- und Gold-
  rationale: Die Genitive bestimmen die Art der Minen. Das deutsche Kompositum „Silber- und Goldminen“ ist präzise und idiomatisch.
- source_word: τοῦ ἐκεῖ
  choice: dortigen
  rationale: Der substantivierte Ortsadverbialausdruck bezeichnet das, was sich dort befindet. „dortigen“ bindet ihn im Deutschen knapp und natürlich an „Minen“.
