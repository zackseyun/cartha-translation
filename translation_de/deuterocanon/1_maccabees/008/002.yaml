lexical_decisions:
- source_word: δυνατοὶ ἰσχύϊ
  choice: große militärische Macht besaßen
  rationale: Die griechische, verstärkende Wendung bezeichnet erhebliche Macht beziehungsweise Stärke. Die militärische Präzisierung ergibt sich aus dem unmittelbaren Zusammenhang und vermeidet eine im Deutschen schwerfällige Doppelung wie „mächtig an Stärke“.
- source_word: διηγήσαντο αὐτῷ
  choice: Man berichtete ihm
  rationale: Das Verb bezeichnet das ausführliche Erzählen oder Berichten. Das unpersönliche „man“ gibt das im Griechischen nicht ausdrücklich genannte Subjekt natürlich wieder.
- source_word: τοὺς πολέμους αὐτῶν
  choice: von ihren Kriegen
  rationale: „Kriege“ entspricht dem breiten Sinn des Plurals; „Schlachten“ wäre zu eng und „Feldzüge“ stärker deutend.
- source_word: τὰς ἀνδραγαθίας
  choice: den Heldentaten
  rationale: Das Wort meint mutige, besonders militärische Taten. „Heldentaten“ ist prägnant und vermeidet die heute missverständliche wörtliche Geschlechtsmarkierung.
- source_word: ἃς ποιοῦσιν ἐν τοῖς Γαλάταις
  choice: die sie unter den Galatern vollbringen
  rationale: Der griechische Text verwendet Präsens und sagt wörtlich „unter den Galatern“. Die Übersetzung bewahrt sowohl diese Zeitform als auch die offene räumlich-relationale Formulierung, statt ohne Kennzeichnung „gegen“ einzusetzen.
- source_word: κατεκράτησαν αὐτῶν
  choice: dass sie diese unterworfen
  rationale: Das Verb bezeichnet das Gewinnen der Oberhand beziehungsweise die Erlangung von Herrschaft; „unterworfen“ passt zum militärisch-politischen Zusammenhang.
- source_word: ἤγαγον αὐτοὺς ὑπὸ φόρον
  choice: tributpflichtig gemacht hatten
  rationale: Die griechische Wendung bedeutet, jemanden unter Tribut zu bringen. Die deutsche Formulierung gibt die auferlegte politische Abgabenpflicht idiomatisch wieder.
