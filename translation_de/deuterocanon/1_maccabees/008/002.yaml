  language: de
  text: und dass sie über große Stärke verfügten. Man berichtete ihm von ihren Kriegen und den Heldentaten[a], die sie unter den Galliern[b] vollbringen, und davon, dass sie diese unterworfen und tributpflichtig gemacht hatten.
