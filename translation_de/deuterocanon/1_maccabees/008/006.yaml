  yaml_path: translation/deuterocanon/1_maccabees/008/006.yaml
  text: and Antiochus the great king of Asia[a], who came against them in war, having one hundred twenty elephants and cavalry and chariots and a very great force, was crushed by them.
translation:
  language: de
  text: Und Antiochus, der große König von Asien, der gegen sie in den Krieg zog und hundertzwanzig Elefanten, Reiterei[a], Streitwagen und eine überaus große Streitmacht mitführte, wurde von ihnen vernichtend geschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „Pferd“ im Singular; in dieser militärischen Aufzählung ist das Wort kollektiv als Reiterei oder berittene Truppen zu verstehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίοχον
  choice: Antiochus
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: τὸν μέγαν βασιλέα τῆς Ἀσίας
  choice: den großen König von Asien
  rationale: Bewahrt die appositionelle Titelstruktur und gibt μέγαν unmittelbar mit „großen“ wieder.
- source_word: τὸν πορευθέντα ἐπʼ αὐτοὺς εἰς πόλεμον
  choice: der gegen sie in den Krieg zog
  rationale: Gibt die militärische Bewegung und feindliche Ausrichtung des Partizips natürlich und quellennah wieder.
- source_word: ἔχοντα
  choice: mitführte
  rationale: Im Zusammenhang eines Feldzugs bezeichnet das Partizip die von Antiochus mitgeführten militärischen Mittel; „mitführte“ ist im Deutschen natürlicher als ein wörtliches „hatte“.
- source_word: ἑκατὸν εἴκοσι ἐλέφαντας
  choice: hundertzwanzig Elefanten
  rationale: Direkte Wiedergabe der Zahl und des militärischen Bestands.
- source_word: ἵππον
  choice: Reiterei
  rationale: Der griechische Singular wird in dieser militärischen Aufzählung kollektiv als berittene Truppe verstanden.
- source_word: ἅρματα
  choice: Streitwagen
  rationale: Präzise Wiedergabe des militärischen Sinns von ἅρματα.
- source_word: δύναμιν πολλὴν σφόδρα
  choice: eine überaus große Streitmacht
  rationale: δύναμις bezeichnet hier eine militärische Macht beziehungsweise ein Heer; „überaus groß“ erhält die starke Intensivierung durch πολλὴν σφόδρα.
- source_word: συνετρίβη ἀπʼ αὐτῶν
  choice: er wurde von ihnen vernichtend geschlagen
  rationale: Bewahrt das Passiv und die ausdrücklich genannte Urheberschaft; „vernichtend geschlagen“ vermittelt die stärkere Bedeutung von συντρίβω idiomatisch, ohne eine buchstäbliche körperliche Zerschmetterung nahezulegen.
