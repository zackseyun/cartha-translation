translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem historischem Erzählstil. Die lange griechische Reihung mit καί wurde zur natürlichen Lesbarkeit auf drei Sätze verteilt. Das abschließende „erneut“ macht die im Griechischen vorliegende Wiederholung verständlich, ohne sie auszulassen.
