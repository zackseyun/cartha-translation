base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/010.yaml
  text: And when the report became known to them, they sent one general against them, and they fought against them, and many of them fell wounded, and they took their wives and their children captive, and plundered them, and gained control of their land, and pulled down their strongholds, and plundered them.
translation:
  language: de
  text: Als ihnen die Nachricht bekannt wurde, schickten sie einen einzigen General gegen sie. Sie kämpften gegen sie, und viele von ihnen fielen verwundet. Sie nahmen ihre Frauen und Kinder gefangen, plünderten sie, brachten ihr Land unter ihre Herrschaft, rissen ihre Festungen nieder und plünderten sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „und sie plünderten sie“ am Versende ein zweites Mal. Die Wiederholung ist im Haupttext wörtlich beibehalten; sie kann der Betonung dienen oder durch eine Doppelüberlieferung entstanden sein.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος αὐτοῖς
  choice: Als ihnen die Nachricht bekannt wurde
  rationale: λόγος bezeichnet hier im Zusammenhang das, was den Römern zu Ohren kam, also eine Nachricht oder Kunde; die passive Form ἐγνώσθη bleibt mit „bekannt wurde“ erhalten.
- source_word: ἀπέστειλαν ἐπʼ αὐτοὺς στρατηγὸν ἕνα
  choice: schickten sie einen einzigen Feldherrn gegen sie
  rationale: στρατηγός ist im militärischen Zusammenhang ein Feldherr bzw. Heerführer. „Einen einzigen“ bewahrt die hervorgehobene Zahl ἕνα.
- source_word: ἐπολέμησαν πρὸς αὐτούς
  choice: Sie kämpften gegen sie
  rationale: Die schlichte Formulierung gibt sowohl die militärische Handlung als auch die gegnerische Ausrichtung von πρός natürlich wieder.
- source_word: ἔπεσαν ἐξ αὐτῶν τραυματίαι πολλοί
  choice: viele von ihnen fielen verwundet
  rationale: τραυματίαι bezeichnet Verwundete bzw. im Kampf Getroffene. „Fielen verwundet“ wahrt die Bildsprache, ohne ausdrücklich zu behaupten, alle seien gestorben.
- source_word: ᾐχμαλώτισαν τὰς γυναῖκας αὐτῶν καὶ τὰ τέκνα αὐτῶν
  choice: Sie nahmen ihre Frauen und Kinder gefangen
  rationale: Das Verb bezeichnet das Gefangennehmen als Kriegsgefangene; die deutsche Formulierung ist klar und präzise.
- source_word: ἐπρονόμευσαν αὐτούς
  choice: plünderten sie
  rationale: Das Verb bezeichnet das Ausplündern oder Berauben nach einem Sieg. Die zweimalige Verwendung im griechischen Text wird auch in der Übersetzung wiedergegeben.
- source_word: κατεκράτησαν τῆς γῆς αὐτῶν
  choice: brachten ihr Land unter ihre Herrschaft
  rationale: κατακρατέω mit Genitiv bezeichnet das Erlangen bzw. Ausüben von Gewalt oder Herrschaft über etwas, ohne notwendig einen rechtlichen Besitzanspruch auszudrücken.
- source_word: καθεῖλον τὰ ὀχυρώματα αὐτῶν
  choice: rissen ihre Festungen nieder
  rationale: ὀχυρώματα sind befestigte Plätze oder Festungsanlagen; καθεῖλον beschreibt deren Niederreißen oder Zerstören.
