  yaml_path: translation/deuterocanon/1_maccabees/008/017.yaml
  text: And Judas chose Eupolemus son of John[a], the son of Accos, and Jason son of Eleazar, and sent them to Rome to establish friendship and alliance with them,
translation:
  language: de
  text: Judas wählte Eupolemus, den Sohn des Johannes, der ein Sohn des Akkos war,[a] und Jason, den Sohn Eleasars, aus und sandte sie nach Rom, um mit den Römern Freundschaft und ein Bündnis zu schließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Eupolemus, den Sohn des Johannes aus Akkos“, falls sich der letzte Genitiv unmittelbar auf Johannes bezieht und dessen Herkunft bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: wählte … aus
  rationale: Das Verb bezeichnet ein Auswählen; „auswählen“ ist im erzählenden Zusammenhang natürlich und unterstellt keine förmliche Ernennung.
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Die schlichte erzählerische Wiedergabe entspricht dem gewöhnlichen Sinn des Verbs.
- source_word: στῆσαι
  choice: zu schließen
  rationale: Der Aoristinfinitiv bezeichnet hier den Zweck der Sendung. Im Deutschen werden diplomatische Freundschafts- und Bündnisbeziehungen idiomatisch „geschlossen“; gemeint ist ihre formelle Herstellung.
- source_word: φιλίαν
  choice: Freundschaft
  rationale: „Freundschaft“ bewahrt die lexikalische Form und kann im diplomatischen Zusammenhang eine förmliche freundschaftliche Beziehung bezeichnen.
- source_word: συμμαχίαν
  choice: Bündnis
  rationale: Der Begriff bezeichnet ein politisches, häufig auch militärisches Bündnis; „Bündnis“ vermeidet eine nicht ausdrücklich festgelegte Eingrenzung.
- source_word: τοῦ Ἀκχώς
  choice: des Sohnes des Akkos
  rationale: 'Der Genitiv mit wiederholtem Artikel lässt sich am natürlichsten als Fortsetzung der Abstammungsangabe verstehen: Eupolemus ist Sohn des Johannes, der seinerseits Sohn des Akkos ist. Die alternative Zuordnung wird in der Fußnote erhalten.'
- source_word: αὐτοῖς
  choice: mit den Römern
  rationale: Der Dativ bezeichnet hier die Partei, mit der die diplomatische Beziehung eingegangen werden soll. Das ausdrückliche „den Römern“ beseitigt im Deutschen eine mögliche unklare Pronomenreferenz, ohne den Sinn zu erweitern.
