  source_fidelity: 'Der letzte Teilsatz des Entwurfs vertauscht gegenüber dem Griechischen die handelnde Seite: ἐσπῶντο αὐτοῖς φιλίαν besagt, dass diejenigen, die zu den Römern kommen, deren Freundschaft erlangen, nicht dass die Römer mit ihnen Freundschaft schließen. Die übrigen Aussagen geben die Berichtsinhalte und die politische Nuance angemessen wieder.'
