  terminology: „Römer“, „wohlgesinnt“ und „Freundschaft“ sind passend. Die Fußnote zu „Freundschaft“ wahrt zutreffend die mögliche diplomatisch-bündnishafte Bedeutung von φιλία, ohne sie in den Text hineinzuzwingen.
