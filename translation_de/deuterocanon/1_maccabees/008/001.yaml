base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/001.yaml
  text: And Judas heard the name of the Romans[a], that they are mighty in strength, and that they are well disposed toward all who attach themselves to them, and that as many as come to them obtain friendship with them[b],
translation:
  language: de
  text: 'Und Judas hörte vom Namen der Römer[a]: Sie seien mächtig und stark, allen wohlgesinnt, die sich ihnen anschlössen, und alle, die zu ihnen kämen, gewännen ihre Freundschaft[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vom Ruf der Römer«. Wörtlich steht im Griechischen »den Namen der Römer«; »Name« kann hier ihren Ruf oder ihr Ansehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Freundschaft« kann hier förmliche politische Freundschaft oder ein Bündnis einschließen, nicht nur persönliche Zuneigung.
    reason: cultural_note
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte
  rationale: Gibt den Aorist unmittelbar wieder; zusammen mit »vom Namen« bezeichnet es das Hören von Berichten über die Römer.
- source_word: τὸ ὄνομα τῶν Ῥωμαίων
  choice: vom Namen der Römer
  rationale: Bewahrt die griechische Redeweise, in der »Name« zugleich Ruf oder Ansehen bezeichnen kann; die folgenden Aussagen entfalten ihren Inhalt.
- source_word: δυνατοὶ ἐν ἰσχύϊ
  choice: mächtig an Stärke
  rationale: Erhält die betonte, leicht redundante Ausdrucksweise des Griechischen in verständlichem Deutsch.
- source_word: εὐδοκοῦσιν
  choice: seien … wohlgesinnt
  rationale: Passt zum politischen und zwischenstaatlichen Zusammenhang und bezeichnet eine günstige Haltung gegenüber den Genannten.
- source_word: τοῖς προστεθειμένοις αὐτοῖς
  choice: allen …, die sich ihnen anschließen
  rationale: Gibt die Ausrichtung oder Verbindung mit den Römern wieder, ohne bereits zwingend ein förmliches Bündnis festzulegen.
- source_word: ὅσοι ἐὰν προσέλθωσιν αὐτοῖς
  choice: mit allen, die zu ihnen kämen
  rationale: Bewahrt den allgemeinen, offenen Sinn der Konstruktion sowie das Bild des Herantretens.
- source_word: ἐσπῶντο αὐτοῖς φιλίαν
  choice: schlössen … Freundschaft
  rationale: Die mediale Verbform bezeichnet hier das Zustandebringen beziehungsweise Vereinbaren von Freundschaft; die deutsche Wendung ist natürlich und lässt den diplomatischen Sinn von φιλία offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt leitet den Inhalt dessen ein, was Judas gehört hatte; der Konjunktiv I beziehungsweise II kennzeichnet die berichteten Aussagen. Die etwas emphatische Formulierung »mächtig an Stärke« bewahrt die Ausdrucksweise der Vorlage.
