base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/032.yaml
  text: If they still bring charges against you[a], we will execute judgment on them, and we will fight against them by sea and by land.
translation:
  language: de
  text: Wenn sie also weiterhin gegen dich Klage erheben, werden wir an ihnen das Urteil vollstrecken und dich zu Wasser und zu Land bekämpfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen: „Wir werden dich zu Wasser und zu Land bekämpfen.“ Im Zusammenhang könnte „für dich kämpfen“ gemeint sein; möglicherweise liegt auch eine Schwierigkeit in der Textüberlieferung vor.'
    reason: textual_difficulty
lexical_decisions:
- source_word: ἐὰν οὖν ἔτι
  choice: Wenn sie also weiterhin
  rationale: Die Wortfolge leitet eine Bedingung ein und bezeichnet zugleich die Fortsetzung oder Wiederaufnahme des Vorgehens. „Also“ gibt οὖν wieder, „weiterhin“ die zeitliche Kraft von ἔτι.
- source_word: ἐντύχωσιν κατὰ σοῦ
  choice: gegen dich Klage erheben
  rationale: ἐντυγχάνω kann in einem rechtlich-diplomatischen Zusammenhang das Vorbringen einer Beschwerde oder Klage bezeichnen; κατὰ σοῦ kennzeichnet deren feindliche Ausrichtung gegen den Angeredeten.
- source_word: ποιήσομεν αὐτοῖς τὴν κρίσιν
  choice: werden wir an ihnen das Urteil vollstrecken
  rationale: Die Verbindung von ποιεῖν und κρίσις bezeichnet hier nicht nur das Fällen, sondern das Ausführen eines gerichtlichen Entscheids; αὐτοῖς wird ausdrücklich mit „an ihnen“ wiedergegeben.
- source_word: πολεμήσομέν σε
  choice: dich … bekämpfen
  rationale: Das überlieferte Griechisch hat das Akkusativpronomen σε, „dich“. Obwohl dies im Zusammenhang auffällig ist, wird der belegte Wortlaut nicht stillschweigend zu „sie“ oder „für dich“ geändert.
- source_word: διὰ τῆς θαλάσσης καὶ διὰ τῆς ξηρᾶς
  choice: zu Wasser und zu Land
  rationale: Die geläufige deutsche Wendung gibt die beiden Bereiche militärischen Handelns natürlich und vollständig wieder.
theological_decisions:
- issue: Auffälliger Wechsel zum Objekt „dich“ im letzten Satzteil
  choice: Der belegte Wortlaut „dich … bekämpfen“ bleibt im Haupttext erhalten.
  alternative: „für dich kämpfen“ oder „sie bekämpfen“
  rationale: πολεμήσομέν σε bedeutet dem vorliegenden griechischen Text nach wörtlich „wir werden dich bekämpfen“. Das widerspricht anscheinend der im Zusammenhang zugesagten Unterstützung. Da weder eine andere Lesart noch eine Ergänzung im Text vorgegeben ist, wird die Spannung bewahrt und in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtlich-diplomatische Sprache bleibt klar; die auffällige Formulierung des griechischen Ausgangstextes wird nicht harmonisiert.
