    rationale: „wie es ihnen die jeweilige Lage vorgibt“ ist grammatisch möglich, aber stilistisch schwerfällig. Die griechische Aussage wird klarer mit „wie die Umstände es ihnen nahelegen“ wiedergegeben, ohne sie als strikte Vorschrift zu überdeuten.
  - severity: low
    issue: Zusätzliche Hervorhebung durch „und zwar“
    rationale: Das Griechische enthält keine entsprechende fokussierende Partikel. Die Wendung kann entfallen, während καρδίᾳ πλήρει unmittelbar und idiomatisch wiedergegeben wird.
