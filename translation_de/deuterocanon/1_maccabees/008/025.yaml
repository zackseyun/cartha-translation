  text: The nation of the Jews shall be an ally[a], as the occasion may indicate for them, with a full heart.
translation:
  language: de
  text: Das Volk der Juden soll, wie die Umstände es ihnen nahelegen, von ganzem Herzen als Verbündeter handeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit vollem Herzen“.'
    reason: Die Fußnote bewahrt das konkrete griechische Bild hinter der idiomatischen deutschen Wiedergabe „von ganzem Herzen“.
lexical_decisions:
- source_word: συμμαχήσει
  choice: soll als Verbündeter handeln
  rationale: Das Futur von συμμαχέω bezeichnet im Vertragszusammenhang das Handeln als Bundesgenosse. Die deutsche Soll-Form entspricht dem normativen Stil einer Vertragsbestimmung, ohne die Aussage auf eine bestimmte militärische Handlung zu verengen.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: das Volk der Juden
  rationale: ἔθνος bezeichnet hier die politisch-korporative Gemeinschaft. „Volk der Juden“ gibt sowohl das Substantiv als auch den Genitiv unmittelbar und in verständlichem Deutsch wieder.
- source_word: ὡς ἂν ὁ καιρὸς ὑπογράφῃ αὐτοῖς
  choice: wie es ihnen die jeweilige Lage vorgibt
  rationale: ὡς ἄν mit dem Konjunktiv lässt die jeweiligen Umstände offen; καιρός bezeichnet die passende Gelegenheit oder Lage. ὑπογράφῃ kann „anzeigen“, „vorzeichnen“ oder „vorgeben“ bedeuten. „Vorgibt“ bewahrt im Vertragskontext den leitenden, jedoch nicht übermäßig technischen Sinn.
- source_word: καρδίᾳ πλήρει
  choice: von ganzem Herzen
  rationale: Die Wendung bedeutet uneingeschränkte Aufrichtigkeit und vollen Einsatz. „Von ganzem Herzen“ ist die natürliche deutsche Entsprechung; die wörtlichere Form wird in der Fußnote genannt.
