  source_fidelity: 'Die wesentlichen Begriffe sind zutreffend erfasst: συμμαχήσει bezeichnet ein Handeln im Bündnis, τὸ ἔθνος τῶν Ἰουδαίων die politische Gemeinschaft der Juden, und καρδίᾳ πλήρει drückt uneingeschränkte Herzlichkeit bzw. Bereitschaft aus. Die Wendung ὡς ἂν ὁ καιρὸς ὑπογράφῃ αὐτοῖς bleibt jedoch im Entwurf etwas hölzern; das unpersönliche „es ... die jeweilige Lage vorgibt“ bildet die griechische Konstruktion weniger klar und natürlich ab.'
  naturalness: „Und zwar“ wirkt im würdigen Vertragston unnötig nachgetragen und verstärkt die Aussage ohne Grundlage im Griechischen. Eine Stellung von „von ganzem Herzen“ direkt beim Verb ist im Deutschen flüssiger. „Wie die Umstände es ihnen nahelegen“ ist eine natürliche, zurückhaltende Wiedergabe von καιρός und ὑπογράφῃ und bewahrt die offene Bezugnahme von αὐτοῖς.
  terminology: „Volk der Juden“ und „als Verbündeter handeln“ sind sachgerecht und registerangemessen. Die Fußnote erklärt die idiomatische deutsche Wiedergabe transparent und ist korrekt verankert.
