review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Gefangennahme, die auferlegte Verpflichtung, Tribut, Geiseln und die wahrscheinlich territoriale Leistung sachgerecht wieder. Das nicht eindeutig deutbare διαστολή bleibt durch die Fußnote angemessen kenntlich gemacht. Allerdings fügt „ihnen einen hohen Tribut zu zahlen“ einen im Griechischen nicht ausdrücklich genannten Empfänger des Tributs ein und kann zudem syntaktisch missverstanden werden.
  naturalness: „Ihn und die Könige nach ihm dazu verpflichten, ihnen ... zu zahlen“ ist im Deutschen unnötig schwerfällig und wegen des doppelten Bezugs von „ihnen“ missverständlich. „Ihm und den nach ihm regierenden Königen ... auferlegen“ ist idiomatischer und klarer.
  terminology: „Tribut“, „Geiseln stellen“ und „Gebiet abtreten“ passen zum politischen und rechtlichen Register. „Nach ihm regierende Könige“ gibt βασιλεύοντας μετʼ αὐτόν natürlich und ohne zusätzliche dynastische Festlegung wieder.
  issues:
  - severity: medium
    issue: Nicht im Ausgangstext ausgedrückter Zahlungsempfänger
    rationale: Das deutsche „ihnen einen hohen Tribut zu zahlen“ legt nahe, dass die Eroberer ausdrücklich als Empfänger genannt seien. Das Griechische enthält bei διδόναι keinen solchen Empfänger. Die Ergänzung ist zwar kontextuell naheliegend, für eine quellennah optimierte Übersetzung aber entbehrlich.
  - severity: low
    issue: Mehrdeutiger und schwerfälliger Bezug von „ihnen“
    rationale: In „verpflichteten ihn und die Könige nach ihm dazu, ihnen ... zu zahlen“ kann „ihnen“ formal sowohl auf die Verpflichteten als auch auf die Handelnden bezogen werden. Die Umformulierung beseitigt diese deutsche Ambiguität, ohne die griechische Aussage zu verändern.
