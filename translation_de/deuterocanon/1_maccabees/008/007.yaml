lexical_decisions:
- source_word: ἔλαβον αὐτὸν ζῶντα
  choice: sie nahmen ihn lebend gefangen
  rationale: Gibt sowohl die Gefangennahme als auch den ausdrücklichen Umstand wieder, dass er lebend in ihre Gewalt kam.
- source_word: ἔστησαν αὐτοῖς διδόναι
  choice: sie verpflichteten ... dazu, ihnen ... zu zahlen / zu stellen / abzutreten
  rationale: Die Wendung bezeichnet hier das Auferlegen einer verbindlichen politischen Verpflichtung; „verpflichteten“ wahrt den rechtlich-kausativen Sinn in natürlichem Deutsch.
- source_word: φόρον μέγαν
  choice: einen hohen Tribut
  rationale: „Tribut“ ist im politischen Unterwerfungszusammenhang genauer als „Steuer“; „hoch“ ist die natürliche deutsche Verbindung für μέγαν.
- source_word: ὅμηρα
  choice: Geiseln
  rationale: Bezeichnet Personen, die als Sicherheit für die Erfüllung einer politischen Vereinbarung gestellt werden.
- source_word: διαστολήν
  choice: Gebiet abzutreten
  rationale: Im Zusammenhang der auferlegten Friedensbedingungen liegt eine territoriale Abtretung nahe. Wegen der Unsicherheit des seltenen Ausdrucks wird die Deutung in einer Fußnote offengelegt.
- source_word: αὐτόν τε καὶ τοὺς βασιλεύοντας μετʼ αὐτόν
  choice: ihn und die Könige nach ihm
  rationale: Bewahrt die koordinierende Formulierung und gibt βασιλεύοντας ausdrücklich als Herrscher beziehungsweise Könige wieder; „nach ihm“ bezeichnet die zeitliche Thronfolge, ohne sie weiter auszudeuten.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber dem Griechischen leicht gestrafft: Das indirekte Objekt αὐτοῖς wird bei „ihnen ... zu zahlen“ wiedergegeben, während die Verpflichteten durch „ihn und die Könige nach ihm“ bezeichnet werden. Die historische Fachsprache „Tribut“, „Geiseln“ und „Gebiet abtreten“ bleibt für heutige Leser verständlich.'
