revisions:
- from: Und sie nahmen ihn lebend gefangen[a] und verpflichteten ihn und die Könige nach ihm dazu, ihnen einen hohen Tribut zu zahlen, Geiseln zu stellen und Gebiet abzutreten[b].
  to: Und sie nahmen ihn lebend gefangen[a] und auferlegten ihm und den nach ihm regierenden Königen, einen hohen Tribut zu zahlen, Geiseln zu stellen und Gebiet abzutreten[b].
  rationale: Die Revision ersetzt die im Griechischen nicht explizit vorhandene Empfängerangabe „ihnen“ durch eine quellennahe Konstruktion mit „auferlegten“. Zugleich wird die Bezugsstruktur geglättet. Die vorsichtige Wiedergabe von διαστολή als territoriale Abtretung bleibt erhalten und wird weiterhin durch die Fußnote als unsicher ausgewiesen.
