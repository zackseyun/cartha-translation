  yaml_path: translation/deuterocanon/1_maccabees/008/008.yaml
  text: and the land of India and Media and Lydia[a], some of the finest of their lands—they took them from him and gave them to King Eumenes.
translation:
  language: de
  text: und das Land Indien sowie Medien und Lydien – einige ihrer besten Gebiete[a] –, die sie ihm abnahmen und König Eumenes gaben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ihren besten Landesteilen“. Wörtlich heißt es im Griechischen „aus ihren schönsten Ländern“, eine Wendung für besonders begehrenswerte oder hervorragende Gebiete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χώραν τὴν Ἰνδικὴν καὶ Μηδίαν καὶ Λυδίαν
  choice: das Land Indien sowie Medien und Lydien
  rationale: χώρα bezeichnet Land oder Gebiet; die geografischen Namen werden in ihrer üblichen deutschen Form wiedergegeben. Das einleitende καί wird als Fortsetzung des vorausgehenden Satzes mit „und“ bewahrt.
- source_word: ἀπὸ τῶν καλλίστων χωρῶν αὐτῶν
  choice: einige ihrer wertvollsten Gebiete
  rationale: Die partitive Wendung bezeichnet eine Auswahl aus besonders guten, begehrenswerten Landesteilen. „Wertvollsten“ gibt καλλίστων im geopolitischen Zusammenhang natürlicher wieder als das wörtliche „schönsten“.
- source_word: λαβόντες αὐτὰς παρ’ αὐτοῦ
  choice: Sie nahmen sie ihm ab
  rationale: Das Aoristpartizip wird für einen natürlichen deutschen Erzählfluss als finites Verb wiedergegeben. „ihm“ wahrt den pronominalen Rückverweis des Griechischen, ohne den Herrscher ausdrücklich zu benennen.
- source_word: ἔδωκαν αὐτὰς Εὐμενεῖ τῷ βασιλεῖ
  choice: und gaben sie König Eumenes
  rationale: Die schlichte Bedeutung von ἔδωκαν bleibt erhalten; der Titel τῷ βασιλεῖ steht im Deutschen idiomatisch vor dem Namen.
