translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Versanfang bleibt als Fortsetzung des vorhergehenden Satzes erkennbar; die etwas gedrängte griechische Aufzählung wird behutsam gegliedert, ohne den unbestimmten pronominalen Rückverweis aufzulösen.
