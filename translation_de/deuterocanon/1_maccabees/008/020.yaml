base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/020.yaml
  text: Judas[a], who is also called Maccabeus, and his brothers and the multitude of the Jews sent us to you, to establish an alliance and peace with you, and to have us enrolled as your allies and friends.
translation:
  language: de
  text: Judas, der auch Makkabäus genannt wird, seine Brüder und die Menge der Juden haben uns zu euch gesandt, um mit euch ein Bündnis und Frieden zu schließen und als eure Verbündeten und Freunde eingetragen zu werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit wir als eure Verbündeten und Freunde schriftlich verzeichnet werden«. Das Griechische meint wahrscheinlich eine förmliche diplomatische Registrierung oder schriftliche Aufnahme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Die im Deutschen für diese Gestalt herkömmliche Namensform gibt den griechischen Personennamen Ἰούδας wieder.
- source_word: ὁ καὶ Μακκαβαῖος
  choice: der auch Makkabäus genannt wird
  rationale: Die Konstruktion bezeichnet einen weiteren Namen oder Beinamen; die Formulierung ist im Deutschen eindeutig und natürlich.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: seine Brüder
  rationale: Wörtliche und kontextgemäße Wiedergabe der männlichen Geschwister.
- source_word: τὸ πλῆθος τῶν Ἰουδαίων
  choice: die Menge der Juden
  rationale: πλῆθος bezeichnet eine größere Gesamtheit oder Menge, ohne hier ausdrücklich eine formelle Versammlung zu benennen.
- source_word: ἀπέστειλαν ἡμᾶς πρὸς ὑμᾶς
  choice: haben uns zu euch gesandt
  rationale: Gibt Verb, Objekt und Zielrichtung klar wieder; das Perfekt klingt in der direkten diplomatischen Rede natürlich.
- source_word: στῆσαι
  choice: zu schließen
  rationale: Im Deutschen werden Bündnisse und Frieden idiomatisch »geschlossen«; dies vermittelt im diplomatischen Zusammenhang das Herstellen einer festen Vereinbarung.
- source_word: συμμαχίαν
  choice: ein Bündnis
  rationale: Bewahrt den politischen und möglicherweise militärischen Sinn, ohne den im Vers nicht ausdrücklich genannten Begriff »Vertrag« hinzuzufügen.
- source_word: εἰρήνην
  choice: Frieden
  rationale: Entspricht dem einfachen Substantiv und vermeidet die präzisierende Ergänzung »Friedensvertrag«.
- source_word: γραφῆναι ἡμᾶς
  choice: uns … eintragen zu lassen
  rationale: Der passive Infinitiv von γράφω weist hier wahrscheinlich auf eine formelle diplomatische Eintragung oder Registrierung hin.
- source_word: συμμάχους καὶ φίλους ὑμῶν
  choice: als eure Verbündeten und Freunde
  rationale: Gibt die geläufige diplomatische Begriffspaarung und die Genitivbeziehung knapp wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit diplomatischem Ton. Die kollektive Wendung »die Menge der Juden« bleibt bewusst allgemein; eine institutionelle Deutung wird nicht eingetragen. Der Fußnotenmarker steht am Satzende, weil er sich auf die gesamte Schlusswendung bezieht.
