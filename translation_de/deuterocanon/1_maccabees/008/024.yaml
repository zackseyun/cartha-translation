  text: But if war comes first to Rome, or to any of their allies, anywhere within their dominion,
translation:
  language: de
  text: Wenn aber zuerst über Rom oder über irgendeinen ihrer Verbündeten irgendwo in ihrem Herrschaftsgebiet Krieg hereinbricht,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνστῇ πόλεμος
  choice: Krieg hereinbricht
  rationale: Gibt das Eintreten bzw. unmittelbare Herankommen eines Krieges natürlich und zugleich eindringlich wieder.
- source_word: Ῥώμῃ
  choice: über Rom
  rationale: Der griechische Dativ bezeichnet hier die vom Krieg betroffene Seite; „über Rom hereinbricht“ bewahrt diese Beziehung ohne die Präposition „gegen“ einzutragen.
- source_word: πᾶσι τοῖς συμμάχοις αὐτῶν
  choice: über einen ihrer Verbündeten
  rationale: 'Das pluralische πᾶσι wird im Deutschen distributiv wiedergegeben: Gemeint ist jeder beliebige Verbündete, nicht zwingend die Gesamtheit zugleich.'
- source_word: ἐν πάσῃ κυρίᾳ αὐτῶν
  choice: irgendwo in ihrem Herrschaftsgebiet
  rationale: κυρία bezeichnet hier den Bereich ihrer Herrschaft oder Hoheit; πάσῃ umfasst dessen gesamten räumlichen Umfang.
- source_word: προτέρα
  choice: zuerst
  rationale: Die Form wird entsprechend dem Zusammenhang adverbial verstanden und wahrt den für die Bündnisklausel wichtigen Vorrangfall.
