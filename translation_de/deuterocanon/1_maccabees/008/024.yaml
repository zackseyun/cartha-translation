  source_fidelity: Die Satzstruktur und der offene Konditionalsatz entsprechen dem Griechischen. Das distributive πᾶσι τοῖς συμμάχοις αὐτῶν meint jedoch ausdrücklich jeden beliebigen ihrer Verbündeten; „einen ihrer Verbündeten“ kann im Deutschen zwar so verstanden werden, ist ohne „irgendeinen“ aber weniger eindeutig.
  naturalness: „Krieg hereinbricht“ ist idiomatisch und für den Vertragskontext angemessen. Die Stellung von „irgendwo in ihrem Herrschaftsgebiet“ bewahrt den weiten örtlichen Geltungsbereich von ἐν πάσῃ κυρίᾳ αὐτῶν.
  terminology: „Herrschaftsgebiet“ gibt κυρία im politischen Kontext sachgerecht wieder, ohne die genaue Reichweite des Begriffs übermäßig festzulegen. „Verbündete“ ist für σύμμαχοι passend.
