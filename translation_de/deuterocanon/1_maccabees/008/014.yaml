base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/014.yaml
  text: And in all these matters not one of them put on a crown[b][a], nor did they clothe themselves in purple so as to exalt themselves by it.
translation:
  language: de
  text: Und bei alledem setzte sich keiner von ihnen ein Diadem[a] auf; auch legten sie keinen Purpur[b] an, um sich damit großzumachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „eine Königskrone“; das griechische Wort bezeichnet eine königliche Kopfbinde als Zeichen der Königsherrschaft.
    reason: lexical_alternative
  - marker: b
    text: Purpur steht hier für purpurfarbene Kleidung als Zeichen königlichen oder hohen Ranges.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἅπασιν τούτοις
  choice: bei alledem
  rationale: Die Wendung verweist zusammenfassend auf die zuvor geschilderten politischen und militärischen Verhältnisse; „bei alledem“ ist im Deutschen natürlich und bewahrt den weiten Rückbezug.
- source_word: ἐπέθετο ... διάδημα
  choice: setzte sich ... ein Diadem auf
  rationale: „Diadem“ gibt die spezifische königliche Kopfbinde genauer wieder als das allgemeinere „Krone“; das reflexive „setzte sich ... auf“ entspricht der griechischen Verbform.
- source_word: πορφύραν
  choice: legten ... Purpur an
  rationale: Das griechische Wort bezeichnet knapp Purpur beziehungsweise ein purpurfarbenes Gewand. „Purpur anlegen“ bewahrt die Metonymie und ist zugleich verständliches, gehobenes Deutsch.
- source_word: ἁδρυνθῆναι
  choice: um sich ... großzumachen
  rationale: Die Form bezeichnet hier das Sich-groß- oder Bedeutendmachen durch königliche Kleidung. Die Wiedergabe wahrt den Gedanken der Selbsterhöhung, ohne ihn unnötig auf Hochmut als innere Haltung zu verengen.
- source_word: ἐν αὐτῇ
  choice: damit
  rationale: Das feminine Pronomen bezieht sich am ehesten auf den Purpur und bezeichnet ihn als Mittel des Sich-großmachens; „damit“ ist idiomatisch und erhält diesen instrumentalen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Verneinung des Griechischen bleibt erhalten; der Wechsel von „keiner von ihnen“ zum pluralischen „sie“ folgt der Struktur des Ausgangstextes. „Großzumachen“ ist bewusst konkret und vermeidet eine stärker theologisch oder moralisch festgelegte Deutung.
