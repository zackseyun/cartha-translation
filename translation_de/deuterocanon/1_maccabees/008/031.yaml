base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/031.yaml
  text: And concerning the wrongs that King Demetrius is doing to them[a], we wrote to him, saying, “Why have you made your yoke heavy upon our friends and allies, the Jews?”
translation:
  language: de
  text: 'Und wegen der Übel, die König Demetrius ihnen zufügt,[a] schrieben wir ihm: »Warum hast du dein Joch unseren Freunden und Verbündeten, den Juden, so schwer gemacht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen des Unrechts« oder »wegen der Schäden, die König Demetrius ihnen zufügt«. Der griechische Ausdruck kann verletzende Handlungen oder bedrückende Maßnahmen bezeichnen, nicht nur das Böse im abstrakten Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τῶν κακῶν
  choice: wegen der Untaten
  rationale: κακά bezeichnet hier konkrete schädigende oder unrechte Handlungen gegen die Juden, nicht nur das Böse im abstrakten Sinn. „Untaten“ bewahrt die moralische und konkrete Dimension.
- source_word: συντελεῖται εἰς αὐτούς
  choice: die … ihnen antut
  rationale: Die Wendung beschreibt gegen die Juden vollzogene schädigende Maßnahmen. „Ihnen antut“ ist im Deutschen natürlich und lässt den genauen Charakter der Übergriffe offen.
- source_word: ἐγράψαμεν αὐτῷ
  choice: schrieben wir ihm
  rationale: Der griechische Aorist wird im erzählenden Zusammenhang angemessen mit dem Präteritum wiedergegeben.
- source_word: Διὰ τί ἐβάρυνας
  choice: Warum hast du … schwer gemacht?
  rationale: Die Formulierung erhält die Verbindung zwischen dem Verb „schwer machen“ und dem Bild des Jochs.
- source_word: τὸν ζυγόν σου
  choice: dein Joch
  rationale: Die wörtliche Metapher für bedrückende Herrschaft oder auferlegte Last bleibt erhalten.
- source_word: ἐπὶ τοὺς φίλους ἡμῶν τοὺς συμμάχους Ἰουδαίους
  choice: auf unseren Freunden und Verbündeten, den Juden
  rationale: Die Juden werden entsprechend der appositionellen griechischen Struktur als Freunde und Verbündete bezeichnet; zugleich bleibt das Bild eines auf ihnen liegenden Jochs erkennbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild des schweren Jochs und die appositionelle Bezeichnung der Juden als Freunde und Verbündete werden bewahrt.
