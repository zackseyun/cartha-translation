base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/028.yaml
  text: And grain[a], weapons, or silver shall not be given to the allies, as it seemed good to Rome; and they shall keep these provisions[b], and not with deceit.
translation:
  language: de
  text: Und den Verbündeten sollen weder Getreide noch Waffen noch Silber gegeben werden, wie Rom beschlossen hat.[a] Sie sollen diese Bestimmungen[b] einhalten, und zwar ohne Arglist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie es Rom gut schien“; dies ist eine förmliche diplomatische Wendung im Sinn von „wie Rom beschlossen hatte“.'
    reason: cultural_note
  - marker: b
    text: 'Auch: „Auflagen“, „Verpflichtungen“ oder „Satzungen“; der griechische Ausdruck meint wörtlich „diese einzuhaltenden Dinge“ und bezeichnet hier vertragliche Regelungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμάχοις
  choice: den Verbündeten
  rationale: Der Dativ Plural bezeichnet im politischen und militärischen Vertragszusammenhang die verbündeten Parteien.
- source_word: δοθήσεται
  choice: sollen … gegeben werden
  rationale: Die unpersönliche Passivkonstruktion und der verbindliche Stil eines Vertrags werden im Deutschen mit dem passivischen „sollen … gegeben werden“ wiedergegeben.
- source_word: σῖτος
  choice: Getreide
  rationale: Das Wort bezeichnet hier Getreide allgemein und nicht zwingend Weizen oder Lebensmittel jeder Art.
- source_word: ὅπλα
  choice: Waffen
  rationale: Im militärischen Zusammenhang ist „Waffen“ die klare und natürliche Entsprechung.
- source_word: ἀργύριον
  choice: Silber
  rationale: Die Wiedergabe bleibt beim konkreten griechischen Ausdruck; obwohl Silber hier als Zahlungsmittel gemeint sein kann, steht nicht ausdrücklich „Geld“.
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: wie Rom beschlossen hat
  rationale: Die Wendung ist eine diplomatische Entscheidungsformel. „Beschlossen hat“ gibt ihren tatsächlichen Sinn in natürlichem, formellem Deutsch wieder.
- source_word: φυλάξονται
  choice: sie sollen … einhalten
  rationale: Im rechtlichen Kontext bedeutet φυλάσσω das Beachten oder Einhalten bindender Regelungen; das Futur trägt hier den verpflichtenden Ton des Vertrags.
- source_word: τὰ φυλάγματα ταῦτα
  choice: diese Bestimmungen
  rationale: Wörtlich handelt es sich um „diese einzuhaltenden Dinge“. Im Vertragskontext bezeichnet die Wendung die verbindlichen Bestimmungen, ohne sie enger als Pflichten oder weiter als den gesamten Vertrag zu bestimmen.
- source_word: οὐ μετὰ δόλου
  choice: und zwar ohne Arglist
  rationale: Die Formulierung schließt ein täuschendes oder hinterlistiges Vorgehen bei der Vertragserfüllung aus und wahrt den feierlich-rechtlichen Ton.
