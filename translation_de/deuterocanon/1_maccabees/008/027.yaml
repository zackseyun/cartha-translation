base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/027.yaml
  text: Likewise[a], if war should first come upon the nation of the Jews, the Romans will fight as allies wholeheartedly[b], as the occasion may direct them.
translation:
  language: de
  text: 'Ebenso gilt: Wenn das Volk der Juden zuerst von einem Krieg betroffen wird, werden die Römer ihm mit ganzem Einsatz als Verbündete beistehen, wie es ihnen die Umstände nahelegen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „wie es ihnen die jeweilige Lage vorgibt“ oder „wie es ihnen der Zeitpunkt vorschreibt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτὰ
  choice: Ebenso gilt
  rationale: Die Wendung nimmt die zuvor genannten wechselseitigen Vertragsbestimmungen auf. „Ebenso gilt“ klingt im Deutschen natürlich und wahrt den vertragsartigen Ton.
- source_word: ἔθνει Ἰουδαίων
  choice: das Volk der Juden
  rationale: ἔθνος bezeichnet hier das jüdische Volk als politische Gemeinschaft. „Volk der Juden“ bleibt nah an der griechischen Konstruktion, ohne moderne nationalstaatliche Vorstellungen einzutragen.
- source_word: συμβῇ ... πόλεμος
  choice: von einem Krieg betroffen wird
  rationale: συμβαίνω bezeichnet ein Eintreten oder Widerfahren. Die passive deutsche Form gibt verständlich wieder, dass Krieg über das jüdische Volk kommt.
- source_word: προτέρῳ
  choice: zuerst
  rationale: 'Der Komparativ bezeichnet zeitlichen Vorrang: Der Kriegsfall tritt zuerst beim jüdischen Volk ein.'
- source_word: συμμαχήσουσιν
  choice: als Verbündete beistehen
  rationale: Das Verb meint militärische Hilfe als Bundesgenossen. „Als Verbündete beistehen“ wahrt diesen Sinn, ohne über den Wortlaut hinaus ausdrücklich eine bestimmte Kampfhandlung festzulegen.
- source_word: ἐκ ψυχῆς
  choice: mit ganzem Einsatz
  rationale: Die idiomatische Wendung drückt ernsthafte, uneingeschränkte Einsatzbereitschaft aus. „Mit ganzem Einsatz“ passt zum Vertragston und ist in modernem Deutsch klar.
- source_word: ὡς ἂν αὐτοῖς ὁ καιρὸς ὑπογράφῃ
  choice: wie es ihnen die Umstände nahelegen
  rationale: καιρός bezeichnet hier die jeweilige Lage oder Gelegenheit; ὑπογράφω kann ein Anzeigen, Vorzeichnen oder Nahelegen ausdrücken. Die Formulierung bewahrt die offene, situationsabhängige Begrenzung der Hilfe.
