  register: Modernes, würdiges Standarddeutsch. Die paarige Formulierung „Wem … den / wen … den“ bildet die offene Relativkonstruktion des Griechischen natürlich ab; „Königsherrschaft“ bewahrt den Bezug von βασιλεύω, während die Fußnote die formale Mehrdeutigkeit offenlegt.
