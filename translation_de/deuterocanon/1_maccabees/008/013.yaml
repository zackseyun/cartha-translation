base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/013.yaml
  text: Whomever they wish to help and to make king[a], they make king; and whomever they wish, they remove[b], and they have become very great.
translation:
  language: de
  text: Wem sie helfen und zur Königsherrschaft verhelfen wollen, den machen sie zum König[a]; wen sie aber absetzen wollen, den setzen sie ab[b]. So sind sie überaus mächtig geworden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier zweimal ein Ausdruck mit „König sein“ oder „herrschen“; im Zusammenhang ist gemeint, dass sie jemanden zur Königsherrschaft bringen beziehungsweise als König einsetzen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „entfernen“. Das griechische Verb kann in diesem politischen Zusammenhang die Absetzung aus einem Herrscheramt bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Und sie wurden sehr erhöht.“ Gemeint ist ihr Aufstieg zu großer Macht und hohem Ansehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς δʼ ἂν βούλωνται
  choice: Wem sie … wollen
  rationale: Die indefinite Relativkonstruktion mit ἄν und Konjunktiv bezeichnet eine jeweils beliebige Person. Der Dativ richtet sich nach βοηθεῖν.
- source_word: βοηθεῖν
  choice: helfen
  rationale: „Helfen“ gibt das Verb klar und ohne unnötige militärische Spezifizierung wieder.
- source_word: καὶ βασιλεύειν, βασιλεύουσιν
  choice: zur Königsherrschaft verhelfen … zum König machen
  rationale: βασιλεύω bedeutet gewöhnlich „König sein/herrschen“. Die Wiederholung im politischen Zusammenhang beschreibt hier jedoch, dass die Römer ausgewählten Personen zur Herrschaft verhelfen beziehungsweise sie als Könige einsetzen. Die deutsche Formulierung macht diesen Zusammenhang verständlich, ohne ihn als bloßes eigenes Herrschen der Römer misszuverstehen.
- source_word: μεθιστῶσιν
  choice: absetzen
  rationale: Das Verb kann allgemein „entfernen/versetzen“ bedeuten; bei Herrschern bezeichnet es hier sachgerecht die Entfernung aus dem Amt.
- source_word: ὑψώθησαν σφόδρα
  choice: sind … überaus mächtig geworden
  rationale: Wörtlich ist von einem starken Erhöhtwerden die Rede. Im Zusammenhang fasst die Wendung den Aufstieg Roms zu großer Macht und hohem Rang zusammen.
