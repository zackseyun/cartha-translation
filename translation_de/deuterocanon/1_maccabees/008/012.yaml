  to: Mit ihren Freunden[a] und mit denen, die sich auf sie verließen, wahrten sie Freundschaft; die nahen und die fernen Königreiche brachten sie unter ihre Herrschaft. Alle, die ihren Namen hörten[b], fürchteten sie.
