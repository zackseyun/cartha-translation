  terminology: „Freunde“ mit der Fußnotenalternative „Verbündete“ bewahrt die mögliche politische Bedeutung von φίλοι, ohne sie im Haupttext festzulegen. „Königreiche“, „unter ihre Herrschaft bringen“ und „ihren Namen hören“ sind treffend. Die Fußnotenanker sind korrekt gesetzt und die Anmerkungen entsprechen dem griechischen Wortlaut.
