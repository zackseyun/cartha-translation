base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/012.yaml
  text: But with their allies and with those who relied on them they maintained friendship[a], and they gained control over the kingdoms near and far[b]; and all who heard their name feared them.
translation:
  language: de
  text: Mit ihren Freunden[a] und mit denen, die sich auf sie verließen, wahrten sie Freundschaft; die nahen und die fernen Königreiche brachten sie unter ihre Herrschaft. Alle, die ihren Namen hörten[b], fürchteten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Verbündeten“. Das griechische Wort kann persönliche Freunde oder politische Verbündete bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Ihren Namen hören“ kann hier bedeuten, von ihrem Ruf oder Ruhm zu hören.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Mit … jedoch
  rationale: δέ führt den Gedankengang mit leichter Gegenüberstellung fort; die nachgestellte Wiedergabe mit „jedoch“ ist im Deutschen natürlich, ohne einen starken Gegensatz zu erzwingen.
- source_word: τῶν φίλων αὐτῶν
  choice: ihren Freunden
  rationale: φίλοι bedeutet zunächst „Freunde“, kann im politischen Zusammenhang aber auch Verbündete bezeichnen. Der Haupttext bewahrt die lexikalische Offenheit; die Fußnote nennt die kontextuelle Alternative.
- source_word: τῶν ἐπαναπαυομένων αὐτοῖς
  choice: denen, die sich auf sie verließen
  rationale: Das Partizip von ἐπαναπαύομαι bezeichnet hier Vertrauen beziehungsweise Abhängigkeit; „sich auf jemanden verlassen“ ist eine genaue und geläufige deutsche Entsprechung.
- source_word: συνετήρησαν αὐτοῖς φιλίαν
  choice: hielten sie … Freundschaft
  rationale: συντηρέω bezeichnet das Bewahren oder Aufrechterhalten. Die Formulierung erhält φιλία ausdrücklich als „Freundschaft“ und lässt den diplomatischen Charakter aus dem Kontext hervorgehen.
- source_word: κατεκράτησαν τῶν βασιλειῶν
  choice: sie brachten … Königreiche unter ihre Herrschaft
  rationale: κατακρατέω mit Genitiv drückt Überwältigung beziehungsweise beherrschende Kontrolle aus. Die deutsche Wendung gibt dies idiomatisch wieder, ohne ein formelles Königtum der Römer zu behaupten.
- source_word: τῶν ἐγγὺς καὶ τῶν μακρῶν
  choice: die nahen und die fernen
  rationale: Die parallelen substantivierten Adjektive werden als geografisch umfassendes Gegensatzpaar bewahrt.
- source_word: ὅσοι ἤκουσαν τὸ ὄνομα αὐτῶν
  choice: alle, die ihren Namen hörten
  rationale: Die wörtliche Bildsprache bleibt erhalten; „Name“ kann dabei den Ruf oder das Ansehen einschließen.
- source_word: ἐφοβοῦντο αὐτούς
  choice: fürchteten sie
  rationale: Die knappe Formulierung entspricht direkt dem griechischen Ausdruck und trägt dessen Gewicht.
