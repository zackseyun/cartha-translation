  text: and to remove their yoke[a], because they saw that the kingdom of the Greeks was enslaving Israel.
translation:
  language: de
  text: und ihnen das Joch abzunehmen, weil sie sahen, dass das Reich der Griechen Israel in Knechtschaft zwang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Israel in die Sklaverei versklavte«; das Griechische verstärkt die Aussage durch ein Verb und ein stammverwandtes Substantiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἆραι
  choice: abzunehmen
  rationale: Im Zusammenhang mit dem Joch bezeichnet αἴρω das Wegnehmen beziehungsweise Abnehmen einer auferlegten Last.
- source_word: ζυγόν
  choice: Joch
  rationale: Bewahrt das konkrete Bild, das hier für bedrückende Fremdherrschaft steht.
- source_word: βασιλείαν τῶν Ἑλλήνων
  choice: das Reich der Griechen
  rationale: Gibt die politische Größe direkt wieder, ohne sie näher als Königsherrschaft oder Weltreich festzulegen.
- source_word: καταδουλουμένους … δουλίαν
  choice: in Knechtschaft zwang
  rationale: Die deutsche Wendung gibt sowohl das Versklaven als Vorgang als auch die daraus entstehende Knechtschaft wieder, ohne eine unnatürliche deutsche Verdoppelung zu erzeugen.
theological_decisions:
- issue: Nachdrückliche Sprache von Versklavung und Knechtschaft
  choice: in Knechtschaft zwang
  alternative: versklavte
  rationale: Das griechische καταδουλουμένους … δουλίαν ist eine nachdrückliche Verbindung aus Verb und stammverwandtem Substantiv. Die Hauptfassung erhält diesen Nachdruck idiomatisch; die Fußnote dokumentiert die wörtlichere Struktur.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Joch« bewahrt das historische Herrschaftsbild; »Knechtschaft« ist hier verständlich und trägt den politischen Zwang stärker als das allgemeinere »Unterdrückung«.
