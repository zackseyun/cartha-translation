lexical_decisions:
- source_word: οἱ ἐκ τῆς Ἑλλάδος
  choice: die aus Griechenland
  rationale: Gibt die Herkunftsangabe wörtlich und ohne die gegenüber dem Ausgangstext etwas stärker ethnisierende Deutung „die Griechen“ wieder.
- source_word: ἐβουλεύσαντο
  choice: geplant hatten
  rationale: Das Medium bezeichnet hier Beratung beziehungsweise das Fassen eines Plans. Das Plusquamperfekt fügt sich natürlich in den berichtenden Zusammenhang ein.
- source_word: ἐλθεῖν
  choice: zu kommen
  rationale: Direkte Wiedergabe des Infinitivs; die deiktische Perspektive des griechischen Verbs bleibt erhalten.
- source_word: ἐξᾶραι
  choice: zu beseitigen
  rationale: „Beseitigen“ bewahrt die Spannweite zwischen Entfernen und gewaltsamer Vernichtung und passt zum militärisch-politischen Zusammenhang, ohne ausdrücklich vollständige Ausrottung festzulegen.
- source_word: αὐτούς
  choice: sie
  rationale: Natürliche Wiedergabe des Akkusativpronomens mit Bezug auf die zuvor genannten Menschen.
