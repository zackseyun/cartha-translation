  text: And they established a council for themselves, and every day three hundred and twenty would deliberate, continually taking counsel concerning the multitude, to govern themselves well.
translation:
  language: de
  text: Und sie setzten für sich einen Rat ein, und Tag für Tag berieten dreihundertzwanzig von ihnen; unablässig hielten sie Rat über das Volk, um sich in guter Ordnung zu halten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um bei sich für gute Ordnung zu sorgen“. Das griechische Wort kann „gut ordnen“ oder „in guter Ordnung halten“ bedeuten; der genaue Bezug des reflexiven Fürworts bleibt im Kontext offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευτήριον
  choice: Rat
  rationale: Das Wort kann sowohl einen Beratungsrat als auch dessen Versammlungsstätte bezeichnen. Im politischen Zusammenhang bezeichnet „Rat“ natürlich und ohne unnötige Festlegung auf den römischen Senat das beratende Leitungsgremium.
- source_word: ἐποίησαν ἑαυτοῖς
  choice: sie setzten für sich ... ein
  rationale: Die institutionelle Wendung gibt das wörtliche „sie machten sich“ in idiomatischem Deutsch wieder und bewahrt den reflexiven Bezug.
- source_word: καθ' ἡμέραν
  choice: Tag für Tag
  rationale: Die Formulierung bezeichnet regelmäßiges, tägliches Handeln und passt zum iterativen Imperfekt.
- source_word: ἐβουλεύοντο
  choice: berieten
  rationale: Das Imperfekt beschreibt wiederholte beziehungsweise fortdauernde Beratung; im Zusammenhang mit „Tag für Tag“ wird dieser Aspekt im Deutschen deutlich.
- source_word: τριακόσιοι καὶ εἴκοσι
  choice: dreihundertzwanzig Männer
  rationale: Die Zahl wird direkt wiedergegeben; „Männer“ macht das maskuline Zahlwort im natürlichen deutschen Satz ausdrücklich, ohne eine zusätzliche Amtsbezeichnung einzuführen.
- source_word: βουλευόμενοι διὰ παντός
  choice: hielten beständig Rat
  rationale: Die partizipiale Wendung betont die anhaltende Beratung. Die Wiedergabe wahrt diese Dauer und vermeidet eine schwerfällige Wiederholung von „beraten“.
- source_word: περὶ τοῦ πλήθους
  choice: über das Volk
  rationale: πλῆθος bezeichnet hier im staatsbürgerlichen Zusammenhang die Gesamtheit beziehungsweise breite Masse des Volkes. „Volk“ ist im Deutschen klarer und würdiger als „Menge“ oder „Masse“.
- source_word: τοῦ εὐκοσμεῖν ἑαυτούς
  choice: um bei sich für gute Ordnung zu sorgen
  rationale: εὐκοσμεῖν bedeutet gut ordnen beziehungsweise in guter Ordnung halten. Die Formulierung erhält den reflexiven Bezug, ohne das stärkere und interpretierendere „sich gut regieren“ vorauszusetzen.
