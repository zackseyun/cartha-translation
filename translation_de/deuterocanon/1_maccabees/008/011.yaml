lexical_decisions:
- source_word: κατεδουλώσαντο
  choice: machten sie zu Sklaven
  rationale: Die Wiedergabe bewahrt die starke Bedeutung von καταδουλόω, nämlich jemanden in Sklaverei oder völlige Unterordnung zu bringen, statt sie zum bloßen politischen »Unterwerfen« abzuschwächen.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: bis heute
  rationale: Die geläufige deutsche Wendung bringt zum Ausdruck, dass der Zustand bis in die Gegenwart des Erzählers fortbestand.
- source_word: τὰς ἐπιλοίπους βασιλείας
  choice: die übrigen Königreiche
  rationale: ἐπίλοιπος bezeichnet das Verbleibende oder Übrige; die Formulierung passt zum aufzählenden Zusammenhang.
- source_word: τὰς νήσους
  choice: die Inseln
  rationale: Die direkte Wiedergabe genügt; eine Erweiterung zu »Inselgebieten« ist im Griechischen nicht ausdrücklich vorhanden.
- source_word: ὅσοι ποτὲ ἀντέστησαν αὐτοῖς
  choice: alle, die sich ihnen je widersetzten
  rationale: »alle, die« bewahrt den umfassenden Charakter von ὅσοι, während »je« die unbestimmte zeitliche Weite von ποτέ ausdrückt. Der Einschub erhält die grammatische Spannung, da das maskuline ὅσοι nicht glatt mit den femininen βασιλείας und νήσους übereinstimmt.
- source_word: κατέφθειραν
  choice: richteten sie zugrunde
  rationale: καταφθείρω bezeichnet hier schwere Zerstörung oder Verwüstung. »Zugrunde richten« wahrt diese Härte, ohne zwingend vollständige Auslöschung zu behaupten, die mit der anschließenden Versklavung in Spannung stünde.
- source_word: ἐδούλωσαν αὐτοῖς
  choice: machten sie sich dienstbar
  rationale: Die Formulierung bildet sowohl die Unterwerfungsbedeutung von δουλόω als auch den ausdrücklichen Dativ αὐτοῖς ab. Im Bezug auf Königreiche und Inseln klingt sie im Deutschen natürlicher als eine zweite wörtliche Aussage über Sklaven, ohne die gewaltsame Abhängigkeit zu verharmlosen.
theological_decisions:
- issue: Sklavereisprache im militärisch-politischen Zusammenhang
  choice: Im ersten Satz ausdrücklich »machten sie zu Sklaven«; im zweiten, metonymisch auf Königreiche und Inseln bezogen, »machten sie sich dienstbar«
  alternative: unterwarfen sie / machten sie sich untertan
  rationale: Die erste Formulierung erhält die volle Härte der δουλόω-Wortgruppe. Die zweite berücksichtigt den unbelebten beziehungsweise territorialen Bezug, bewahrt aber die Vorstellung erzwungener Knechtschaft und gibt zugleich αὐτοῖς wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz bleibt bewusst hart und konkret. Im zweiten Satz markieren Gedankenstriche den griechisch etwas spannungsreichen Relativsatz; »zugrunde richten« und »dienstbar machen« ergeben eine natürliche, zugleich quellennahe militärisch-politische Darstellung.
