  text: And they enslaved them to this day[a]. And the remaining kingdoms and the islands, as many as ever resisted them[b], they destroyed and enslaved to them.
translation:
  language: de
  text: Und sie versklavten sie bis auf den heutigen Tag.[a] Die übrigen Königreiche und die Inseln aber – alle, die sich ihnen je widersetzten – zerstörten sie[b] und versklavten sie für sich.
