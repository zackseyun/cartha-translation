base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/022.yaml
  text: And this is the copy of the document that they copied onto bronze tablets and sent to Jerusalem, to be there among them as a memorial of peace and alliance.
translation:
  language: de
  text: Und dies ist die Abschrift des Schriftstücks, das sie auf Bronzetafeln abschrieben und nach Jerusalem sandten, um dort bei ihnen als Erinnerungszeichen an Frieden und Bündnis zu sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: Abschrift
  rationale: Das Wort bezeichnet die Wiedergabe eines geschriebenen Textes; »Abschrift« passt zum amtlichen Zusammenhang und bewahrt die Beziehung zum folgenden Verb.
- source_word: γραφῆς
  choice: Schriftstück
  rationale: Hier ist ein amtliches Schriftstück gemeint, nicht die Heilige Schrift. »Schriftstück« gibt den konkreten schriftlichen Gegenstand natürlich wieder.
- source_word: ἀντέγραψαν
  choice: übertrugen
  rationale: Das Verb bezeichnet das Anfertigen einer Kopie. »Auf Bronzetafeln übertrugen« vermeidet im Deutschen die schwerfällige Wiederholung »Abschrift … abschrieben«, ohne den Sinn zu verändern.
- source_word: ἐπὶ δέλτους χαλκαῖς
  choice: auf Bronzetafeln
  rationale: δέλτοι sind Schreibtafeln, χαλκαῖς nennt das Material. »Bronzetafeln« ist für eine amtliche Inschrift sachgerecht.
- source_word: μνημόσυνον
  choice: Erinnerungszeichen
  rationale: Der Ausdruck bezeichnet etwas, das die Erinnerung dauerhaft wachhält. »Erinnerungszeichen« bewahrt diesen konkreten und feierlichen Sinn.
- source_word: εἰρήνης
  choice: Frieden
  rationale: Das griechische Wort bedeutet schlicht »Frieden«; die Übersetzung ergänzt nicht ausdrücklich »Friedensvertrag«.
- source_word: συμμαχίας
  choice: Bündnis
  rationale: συμμαχία bezeichnet ein politisches, häufig auch militärisches Bündnis. »Bündnis« lässt dessen genaue Reichweite offen.
- source_word: παρ' αὐτοῖς
  choice: bei ihnen
  rationale: Die Wendung bezeichnet den dauerhaften Verbleib des Schriftstücks bei der Gemeinschaft in Jerusalem.
- source_word: εἶναι
  choice: damit es … aufbewahrt werde
  rationale: Der Infinitiv drückt hier den Zweck des Sendens aus. Die Wiedergabe mit »aufbewahrt werde« macht den beabsichtigten dauerhaften Verbleib idiomatisch deutlich.
