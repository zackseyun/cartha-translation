base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/026.yaml
  text: To those who make war on them they shall neither give nor supply grain[a], weapons, silver, or ships, as Rome has decided; and they shall keep their obligations, taking nothing.
translation:
  language: de
  text: Denen, die gegen sie Krieg führen, sollen sie weder Getreide, Waffen, Silber noch Schiffe geben noch liefern, wie Rom beschlossen hat. Sie sollen ihre Verpflichtungen einhalten[a], ohne etwas dafür zu erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Bestimmungen beachten“ oder „ihre Vertragsbedingungen einhalten“. Im Griechischen steht eine Verbindung verwandter Wörter, wörtlich etwa: „das zu Bewahrende bewahren“; im Zusammenhang geht es um vertragliche Pflichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς πολεμοῦσιν
  choice: denen, die gegen sie Krieg führen
  rationale: Das substantivierte Partizip bezeichnet feindliche Parteien; „gegen sie“ macht den im Bündniskontext vorausgesetzten Bezug deutlich.
- source_word: οὐ δώσουσιν οὐδὲ ἐπαρκέσουσιν
  choice: sollen sie weder … geben oder liefern
  rationale: Die beiden Verben unterscheiden unmittelbares Geben und das Bereitstellen benötigter Unterstützung. Die etwas markierte Verbindung bewahrt beide Aussagen des Griechischen.
- source_word: σῖτον
  choice: Getreide
  rationale: σίτος bezeichnet hier Getreide beziehungsweise Getreidevorräte; „Getreide“ ist genauer als „Nahrung“ und weniger eng als „Weizen“.
- source_word: ὅπλα
  choice: Waffen
  rationale: Im militärischen Vertragskontext ist „Waffen“ die klare und natürliche Wiedergabe.
- source_word: ἀργύριον
  choice: Silber
  rationale: Die wörtliche Bedeutung wird beibehalten; zugleich kann Silber im antiken Kontext als Zahlungsmittel verstanden werden.
- source_word: πλοῖα
  choice: Schiffe
  rationale: „Schiffe“ entspricht dem militärisch-diplomatischen Zusammenhang.
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: wie Rom beschlossen hat
  rationale: Die Wendung mit ἔδοξεν bezeichnet hier einen amtlichen Beschluss und wird in natürlichem Deutsch entsprechend wiedergegeben.
- source_word: φυλάξονται τὰ φυλάγματα αὐτῶν
  choice: sie sollen ihre Verpflichtungen einhalten
  rationale: Die griechische figura etymologica bedeutet wörtlich etwa „das zu Bewahrende bewahren“; im Vertragskontext sind damit einzuhaltende Verpflichtungen oder Bestimmungen gemeint.
- source_word: οὐθὲν λαβόντες
  choice: ohne etwas zu erhalten
  rationale: Das Partizip bezeichnet, dass sie bei der Erfüllung dieser Verpflichtungen nichts empfangen; „erhalten“ ist im Deutschen hier natürlicher als das wörtlichere „nehmen“.
