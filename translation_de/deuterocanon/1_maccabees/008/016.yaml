  verdict: approve
  source_fidelity: Die Übersetzung gibt πιστεύουσιν im politischen Kontext treffend mit „vertrauen ... die Herrschaft ... an“ wieder und bewahrt sowohl die jährlich begrenzte Beauftragung als auch die zweifache Herrschaftsausübung über das Volk und das gesamte Land. „Alle hören auf diesen einen“ hält die bewusst weniger explizite Ausdrucksweise von ἀκούουσιν τοῦ ἑνός aufrecht; die Fußnote erläutert die kontextuell mögliche Bedeutung von Gehorsam, ohne sie in den Haupttext hineinzulesen. „Weder Neid noch Eifersucht“ entspricht der negativen Begriffspaarung φθόνος ... ζῆλος angemessen.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und trotz der kompakten Verbindung der beiden Herrschaftsaspekte gut verständlich. Die Stellung von „jedes Jahr“ ist idiomatisch und vermittelt den wiederkehrenden jährlichen Amtsrhythmus.
  terminology: „Einem Mann“ wahrt die maskuline Singularform. „Herrschaft“, „Land“, „Neid“ und „Eifersucht“ sind kontextgerecht und unterscheiden die griechischen Begriffe ausreichend. Die Fußnotenmarke ist korrekt im Text verankert und die Fußnote ist klar formuliert.
