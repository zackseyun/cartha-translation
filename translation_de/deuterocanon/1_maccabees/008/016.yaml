base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/016.yaml
  text: And they entrust one man to rule over them each year and to exercise lordship over all their land[a], and all listen to the one, and there is no envy or jealousy among them.
translation:
  language: de
  text: Und jedes Jahr vertrauen sie einem Mann die Herrschaft über sich und über ihr ganzes Land an; alle hören auf diesen einen[a], und unter ihnen gibt es weder Neid noch Eifersucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle gehorchen diesem einen«. Wörtlich heißt es: »alle hören auf den einen«; im Zusammenhang mit der Regierung kann dies Gehorsam einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύουσιν ἑνὶ ἀνθρώπῳ ἄρχειν αὐτῶν
  choice: sie vertrauen einem Mann die Herrschaft über sich an
  rationale: πιστεύω mit dem Infinitiv bezeichnet hier, dass einem Mann Regierungsgewalt anvertraut wird. Die Formulierung wahrt den Gedanken übertragener Autorität, ohne das stärker institutionelle »ernennen« einzutragen.
- source_word: κατ' ἐνιαυτόν
  choice: jedes Jahr
  rationale: Die Wendung bezeichnet die jährlich wechselnde beziehungsweise jeweils einjährige Amtsausübung; »jedes Jahr« gibt den wiederkehrenden Sinn natürlich wieder.
- source_word: κυριεύειν πάσης τῆς γῆς αὐτῶν
  choice: die Herrschaft über ihr ganzes Land
  rationale: κυριεύειν ist kräftiger als ein bloßes »leiten« und bezeichnet die Ausübung von Herrschaft; γῆ meint im politischen Zusammenhang das Land oder Herrschaftsgebiet.
- source_word: ἀκούουσιν τοῦ ἑνός
  choice: alle hören auf diesen einen
  rationale: ἀκούω mit Genitiv kann »auf jemanden hören« bedeuten und in diesem Regierungskontext Gehorsam einschließen. Die deutsche Wendung bewahrt sowohl das Bild des Hörens als auch die praktische Folgebereitschaft.
- source_word: φθόνος οὔτε ζῆλος
  choice: weder Neid noch Eifersucht
  rationale: φθόνος bezeichnet neidische Missgunst; ζῆλος hat in dieser negativen Paarung den Sinn von Eifersucht oder Rivalität, nicht von positivem Eifer.
