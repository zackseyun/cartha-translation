translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde leicht gebündelt, um die doppelte griechische Infinitivkonstruktion idiomatisch wiederzugeben. »Einem Mann« bewahrt die ausdrücklich maskuline Singularform; »diesen einen« nimmt die hervorgehobene Einheit des Amtsträgers auf.
