base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/030.yaml
  text: But if[a], after these terms, these people and those decide to add or to remove anything, they will do so by their own choice[b], and whatever they add or remove will be valid.
translation:
  language: de
  text: Wenn aber beide Seiten nach Festlegung dieser Bestimmungen[a] beschließen, etwas hinzuzufügen oder wegzunehmen, werden sie es aus eigenem Entschluss tun; und was immer sie hinzufügen oder wegnehmen, wird gültig sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »diese und diese«; die wiederholten Demonstrativpronomen beziehen sich auf die beiden Seiten der Vereinbarung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verbindlich« beziehungsweise »in Kraft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους
  choice: Bestimmungen
  rationale: Im Zusammenhang eines Vertrags bezeichnet λόγοι die festgelegten Regelungen oder Vertragsbestimmungen, nicht bloß gesprochene Worte.
- source_word: βουλεύσωνται
  choice: beschließen
  rationale: Das Verb kann Beratung und Entschlussbildung bezeichnen; im konditionalen Rechtssatz steht der gemeinsam gefasste Entschluss im Vordergrund.
- source_word: οὗτοι καὶ οὗτοι
  choice: beide Seiten
  rationale: Die wiederholten Demonstrativpronomen verweisen auf die beiden Vertragsparteien. »Beide Seiten« gibt diesen Bezug im modernen Deutschen klar wieder, ohne eine bestimmte institutionelle Form vorauszusetzen.
- source_word: προσθεῖναι ἢ ἀφελεῖν
  choice: etwas hinzuzufügen oder wegzunehmen
  rationale: Das Wortpaar bezeichnet Änderungen an den Vertragsbestimmungen und wird zugleich nah an seiner allgemeinen Bedeutung wiedergegeben.
- source_word: ἐξ αἱρέσεως αὐτῶν
  choice: nach eigener Entscheidung
  rationale: αἵρεσις bedeutet hier Wahl beziehungsweise Entscheidung, nicht religiöse Partei oder Sekte. Die Formulierung wahrt den Gedanken eines von den Parteien selbst getragenen Entschlusses.
- source_word: κύρια
  choice: rechtskräftig
  rationale: κύρια bezeichnet im rechtlichen Zusammenhang etwas Gültiges und Wirksames. »Rechtskräftig« macht diesen Vertragscharakter verständlich; mögliche Wiedergaben werden in der Fußnote genannt.
