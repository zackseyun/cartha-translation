  text: And they kept seeking out and searching for the friends of Judas[a], and they were bringing them to Bacchides[b], and he took vengeance on them and mocked them.
translation:
  language: de
  text: Und sie suchten die Freunde des Judas[a] immer wieder und spürten ihnen nach. Sie führten sie zu Bakchides, und er übte Vergeltung[b] an ihnen; sie verspotteten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Anhänger“ beziehungsweise „die Verbündeten des Judas“. Das griechische Wort bedeutet wörtlich „Freunde“, kann hier aber auch politische oder militärische Gefolgsleute bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb kann auch bedeuten: „bestrafte sie“ oder „setzte das Recht gegen sie durch“. Im Zusammenhang hat es einen feindseligen, vergeltenden Klang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεζήτουν
  choice: suchten … immer wieder
  rationale: Der Imperfekt bezeichnet hier ein fortgesetztes oder wiederholtes Vorgehen. „Immer wieder“ macht diesen Aspekt in natürlichem Deutsch deutlich.
- source_word: ἐξηραύνων
  choice: spürten ihnen nach
  rationale: Das zweite, ebenfalls imperfektische Verb verstärkt die gezielte Suche. „Nachspüren“ vermittelt das aktive Ermitteln und Aufspüren, ohne beide nahezu synonymen Verben zusammenzuziehen.
- source_word: τοὺς φίλους Ἰούδου
  choice: die Freunde des Judas
  rationale: φίλοι bedeutet wörtlich „Freunde“, kann im politischen und militärischen Zusammenhang aber auch Anhänger oder Verbündete bezeichnen. Die wörtliche Form bleibt im Haupttext erhalten; die weitere Bedeutung steht in der Fußnote.
- source_word: ἦγον
  choice: führten sie
  rationale: ἄγω bezeichnet das Hinführen zu einer Person; der imperfektische Zusammenhang lässt dabei ein wiederholtes Vorgehen erkennen. Das deutsche Präteritum ist hier idiomatisch und schließt an „immer wieder“ an.
- source_word: πρὸς Βακχίδην
  choice: zu Bakchides
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf eine Person zu. „Zu Bakchides“ ist knapp und natürlich.
- source_word: ἐξεδίκα
  choice: übte Vergeltung an ihnen
  rationale: Das Verb kann das Vollziehen von Recht, Bestrafen oder Rächen bezeichnen. „Vergeltung üben“ bewahrt im feindseligen Erzählzusammenhang den retributiven Sinn, ohne ihn auf ein neutrales Gerichtsverfahren festzulegen.
- source_word: ἐνέπαιζον αὐτοῖς
  choice: verspotteten sie sie
  rationale: ἐμπαίζω bezeichnet spöttische Erniedrigung oder das Treiben eines grausamen Spiels mit Menschen. „Verspotten“ ist gegenwärtiges, verständliches Deutsch und wahrt den Grundsinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Verfolgung wird durch „immer wieder“ ausgedrückt; die überlappenden Suchverben des Griechischen bleiben als „suchten“ und „spürten … nach“ unterscheidbar. Der Wechsel vom pluralischen Handeln der Verfolger zum singularischen Handeln des Bakchides und zurück zum Plural wird beibehalten.
