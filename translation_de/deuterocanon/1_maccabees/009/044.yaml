base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/044.yaml
  text: And Jonathan said to his brothers[a], “Let us rise now and fight for our lives, for today is not as yesterday and the day before.”
translation:
  language: de
  text: 'Und Jonatan sagte zu seinen Brüdern: „Lasst uns jetzt aufstehen und um unser Leben kämpfen; denn heute ist es nicht wie gestern und vorgestern.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie gestern und am dritten Tag“; gemeint ist: „wie gestern und vorgestern“.'
    reason: Die wörtliche griechische Zeitformel wäre im Deutschen missverständlich; die Fußnote bewahrt ihre Form und erklärt ihre idiomatische Bedeutung.
lexical_decisions:
- source_word: Ἀναστῶμεν
  choice: Lasst uns aufstehen
  rationale: Der Aorist Konjunktiv ist hier auffordernd gebraucht. „Lasst uns aufstehen“ bewahrt sowohl die konkrete Bildlichkeit als auch die Dringlichkeit des militärischen Aufrufs.
- source_word: πολεμήσωμεν
  choice: kämpfen
  rationale: Das Verb bezeichnet die Teilnahme am Kampf. „Kämpfen“ ist im Deutschen natürlich und entspricht dem unmittelbaren Schlachtkontext.
- source_word: ὑπὲρ τῶν ψυχῶν ἡμῶν
  choice: um unser Leben
  rationale: ψυχή bezeichnet hier angesichts der drohenden Schlacht das physische Leben beziehungsweise Überleben, nicht ausdrücklich eine immaterielle Seele. Die Präposition ὑπέρ gibt den Einsatz für die Bewahrung des Lebens an.
- source_word: ἀδελφοῖς
  choice: Brüdern
  rationale: Die direkte Wiedergabe erhält die männliche Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung des griechischen Textes, ohne sie näher zu bestimmen.
- source_word: σήμερον
  choice: heute
  rationale: Die schlichte Zeitangabe wird im modernen Deutschen unmittelbar mit „heute“ wiedergegeben.
- source_word: ὡς ἐχθὲς καὶ τρίτην ἡμέραν
  choice: wie gestern und vorgestern
  rationale: Die griechische Wendung bedeutet idiomatisch „gestern und am Tag davor“. „Gestern und vorgestern“ gibt den zeitlichen Gegensatz im Deutschen klar und knapp wieder; die ungewöhnliche wörtliche Form bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem dringlichen Ton einer Aufforderung vor dem Kampf. Die Satzstruktur bleibt nahe am Griechischen, während die Zeitformel idiomatisch verständlich wiedergegeben wird.
