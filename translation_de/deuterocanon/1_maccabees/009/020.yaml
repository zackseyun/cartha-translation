  terminology: »Totenklage« gibt κόπτομαι/κοπετός sachgerecht wieder, ohne körperliche Trauergesten unzulässig festzulegen. Der Wechsel zu »trauerten« für ἔπενθουν erhält die griechische lexikalische Variation. »Ganz Israel« ist als kollektive Bezeichnung angemessen.
