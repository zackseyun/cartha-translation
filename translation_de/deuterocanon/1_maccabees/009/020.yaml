  text: And they mourned for him there[a], and all Israel mourned for him with great mourning, and they grieved for many days and said,
translation:
  language: de
  text: 'Und dort hielten sie Totenklage um ihn, und ganz Israel hielt eine große Totenklage um ihn. Viele Tage lang trauerten sie und sagten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκόψαντο
  choice: hielten sie die Totenklage
  rationale: Das mediale κόπτομαι bezeichnet im Trauerzusammenhang die Totenklage, ursprünglich auch mit körperlichen Trauergesten. »Die Totenklage halten« ist im Deutschen klar und bewahrt den kultisch-öffentlichen Klang, ohne eine bestimmte Gebärde festzulegen.
- source_word: αὐτόν
  choice: um ihn
  rationale: Das Pronomen verweist im Zusammenhang auf Judas; bei »Totenklage halten« verlangt natürliches Deutsch die Verbindung »um ihn«.
- source_word: ἐκεῖ
  choice: dort
  rationale: Schlichte und natürliche Wiedergabe des Ortsadverbs.
- source_word: πᾶς Ἰσραήλ
  choice: ganz Israel
  rationale: Bewahrt den kollektiven nationalen Ausdruck in geläufiger biblischer Sprache.
- source_word: κοπετὸν μέγαν
  choice: eine große Totenklage
  rationale: Das Substantiv κοπετός ist mit dem vorangehenden Verb verwandt. Die Wiederholung von »Totenklage« bildet diese Wortverwandtschaft und die Steigerung des Griechischen ab.
- source_word: ἔπενθουν
  choice: trauerten sie
  rationale: πενθέω bezeichnet Trauern und ist vom vorherigen Wortstamm verschieden. »trauerten« erhält diesen lexikalischen Wechsel.
- source_word: ἡμέρας πολλὰς
  choice: Viele Tage lang
  rationale: Der Akkusativ bezeichnet die Dauer; diese Stellung ist idiomatisches modernes Deutsch und hebt die lange Trauerzeit hervor.
- source_word: καὶ εἶπαν
  choice: 'und sagten:'
  rationale: Leitet die Äußerung des folgenden Verses ein; im Deutschen steht dafür passend ein Doppelpunkt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Totenklage halten« gibt den öffentlichen beziehungsweise rituellen Trauerzusammenhang präziser wieder als das allgemeinere »trauern«, während der abschließende Wechsel zu »trauerten« die griechische Variation erhält.
