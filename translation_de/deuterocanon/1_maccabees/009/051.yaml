base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/051.yaml
  text: And they stationed a garrison in them to be hostile toward Israel[a].
translation:
  language: de
  text: Und sie stationierten in ihnen eine Besatzung, um gegen Israel feindlich vorzugehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um Israel gegenüber feindlich zu handeln«. Der griechische Infinitiv τοῦ ἐχθραίνειν bezeichnet den Zweck, zu dem die Besatzung stationiert wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: sie stationierten
  rationale: Das Verb τίθημι bezeichnet hier das Aufstellen beziehungsweise Einsetzen militärischen Personals. »Stationierten« gibt den militärischen Zusammenhang natürlich und präzise wieder.
- source_word: φρουράν
  choice: eine Besatzung
  rationale: φρουρά bezeichnet hier eine in befestigten Orten eingesetzte militärische Wach- oder Besatzungstruppe. »Besatzung« ist im Deutschen knapper und kontextgemäßer als »Wache«.
- source_word: ἐν αὐτοῖς
  choice: in ihnen
  rationale: Das Pronomen verweist auf die zuvor genannten Orte. Die Wiedergabe bewahrt diesen Rückbezug, ohne den Referenten innerhalb des Verses näher festzulegen.
- source_word: τοῦ ἐχθραίνειν
  choice: um … feindlich vorzugehen
  rationale: Der substantivierte Infinitiv mit τοῦ bezeichnet den Zweck der Stationierung. »Feindlich vorzugehen« bringt sowohl die feindselige Haltung als auch das im Kontext erwartete fortgesetzte Handeln zum Ausdruck, ohne ausdrücklich Kriegführung zu behaupten.
- source_word: τῷ Ἰσραήλ
  choice: gegen Israel
  rationale: Der Dativ bezeichnet das Ziel der Feindseligkeit. Im Deutschen ist »gegen Israel« in Verbindung mit »vorgehen« die natürliche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe militärische Ausdrucksweise und der nicht näher bestimmte Rückverweis »in ihnen« bleiben erhalten; die Zweckkonstruktion wird im Deutschen mit »um … zu« natürlich wiedergegeben.
