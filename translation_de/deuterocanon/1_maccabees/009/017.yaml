translation:
  language: de
  text: Und der Kampf wurde immer heftiger, und auf beiden Seiten fielen viele Verwundete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von diesen und von diesen«, das heißt von beiden Seiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαρύνθη
  choice: wurde immer heftiger
  rationale: Das Passiv von βαραίνω bedeutet wörtlich, dass etwas »schwer« wird. Im Zusammenhang eines Kampfes bezeichnet es dessen zunehmende Härte oder Heftigkeit; die deutsche Wiedergabe wahrt den Vorgang und klingt natürlich.
- source_word: ὁ πόλεμος
  choice: der Kampf
  rationale: πόλεμος kann »Krieg« oder »Kampf« bedeuten. Hier geht es um das unmittelbar geschilderte Gefecht, weshalb »Kampf« kontextgemäß ist.
- source_word: ἔπεσαν
  choice: fielen
  rationale: Die übliche Bedeutung des Verbs bleibt erhalten und passt zur knappen Sprache eines Kampfberichts.
- source_word: τραυματίαι πολλοί
  choice: viele Verwundete
  rationale: τραυματίαι bezeichnet Verwundete. Die substantivische Wiedergabe folgt der griechischen Form und vermeidet das weiter gefasste »Opfer«, das auch Tote einschließen könnte.
- source_word: ἐκ τούτων καὶ ἐκ τούτων
  choice: auf beiden Seiten
  rationale: Die wörtliche Wendung »von diesen und von diesen« bezeichnet Angehörige beider kämpfenden Parteien. »Auf beiden Seiten« gibt diesen idiomatischen Sinn in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Erzählstil in modernem Standarddeutsch. »Immer heftiger« macht die im griechischen Aoristpassiv ausgedrückte Zuspitzung des Kampfes verständlich; die ungewöhnliche griechische Symmetrie am Versende wird in der Fußnote dokumentiert.
