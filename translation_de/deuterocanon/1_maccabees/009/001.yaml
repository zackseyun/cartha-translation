base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/001.yaml
  text: And Demetrius heard that Nicanor and his forces had made war[a], and he sent Bacchides and Alcimus into the land of Judah a second time, and the right wing with them.
translation:
  language: de
  text: Und Demetrius hörte, dass Nikanor und seine Streitkräfte Krieg geführt hatten. Darauf sandte er Bakchides und Alkimos zum zweiten Mal in das Land Juda, zusammen mit dem rechten Heeresflügel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das rechte Horn“; im militärischen Sprachgebrauch ist damit der rechte Flügel oder die rechte Flanke des Heeres gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte
  rationale: Das einfache Erzählverb wird direkt wiedergegeben, ohne die zusätzliche Nuance von „erfuhr“ oder „wurde benachrichtigt“ einzutragen.
- source_word: ἐποίησεν ... πόλεμον
  choice: Krieg geführt hatten
  rationale: Die griechische Wendung bedeutet wörtlich „Krieg machen“. „Krieg führen“ ist die natürliche deutsche Entsprechung; das Plusquamperfekt verdeutlicht, dass der Kampf der Nachricht vorausging.
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: seine Streitkräfte
  rationale: „Streitkräfte“ gibt den militärischen Sinn von δυνάμεις wieder, ohne den Ausdruck auf eine bestimmte Truppengattung oder einen einzelnen Heeresverband einzuengen.
- source_word: προσέθετο ... ἀποστεῖλαι
  choice: darauf sandte er
  rationale: Die Verbindung mit dem Infinitiv bezeichnet hier die anschließende beziehungsweise erneute Handlung. Das idiomatische deutsche „darauf sandte er“ vermeidet die unnatürliche wörtliche Fassung „er fügte hinzu zu senden“; die Wiederholung wird ausdrücklich durch ἐκ δευτέρου ausgedrückt.
- source_word: ἐκ δευτέρου
  choice: zum zweiten Mal
  rationale: Die Formulierung bewahrt die ausdrücklich numerische Bedeutung und ist präziser als bloßes „wieder“.
- source_word: γῆν Ἰούδα
  choice: das Land Juda
  rationale: Die Wiedergabe folgt der griechischen Bezeichnung „Land Juda“ und ersetzt sie nicht stillschweigend durch den später üblichen Gebietsnamen „Judäa“.
- source_word: τὸ δεξιὸν κέρας
  choice: der rechte Heeresflügel
  rationale: κέρας bedeutet wörtlich „Horn“, bezeichnet im militärischen Sprachgebrauch aber einen Flügel beziehungsweise eine Flanke. „Heeresflügel“ macht diesen Sinn im Deutschen eindeutig.
