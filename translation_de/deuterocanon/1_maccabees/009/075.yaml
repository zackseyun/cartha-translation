  yaml_path: translation/deuterocanon/1_maccabees/009/075.yaml
  text: And he encamped against Joppa[a], but those from the city shut him out, because a garrison of Apollonius was in Joppa; and they fought against it.
translation:
  language: de
  text: Dann schlug er sein Lager vor Joppe auf. Doch die Bewohner der Stadt verwehrten ihm den Zugang, weil in Joppe eine Besatzung des Apollonius lag; und sie kämpften gegen die Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sie kämpften gegen sie“. Nach den vorherigen Verben im Singular wechselt der griechische Grundtext hier unvermittelt in den Plural. Gemeint sind wahrscheinlich Jonatan und seine Truppen, die gegen Joppe kämpften. Der Wechsel wird nicht geglättet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ
  choice: schlug er sein Lager vor … auf
  rationale: παρεμβάλλω bezeichnet das Aufschlagen eines Lagers beziehungsweise das militärische Stellungnehmen; ἐπί mit Akkusativ gibt hier die feindliche Ausrichtung gegen die Stadt an. Die deutsche Wendung „vor Joppe“ passt natürlich zum Belagerungskontext.
- source_word: Ἰόππην
  choice: Joppe
  rationale: „Joppe“ ist die im Deutschen traditionell gebräuchliche Form des Ortsnamens.
- source_word: ἀπέκλεισαν αὐτόν
  choice: verwehrten ihm den Zugang
  rationale: Das Verb bedeutet hier, jemanden auszusperren oder am Eintritt zu hindern. Diese Wiedergabe macht den Personenbezug von αὐτόν deutlich und klingt im modernen Deutschen natürlicher als „schlossen ihn aus“.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: die Leute aus der Stadt
  rationale: Die Formulierung bleibt nahe am Griechischen, ohne ein Geschlecht hinzuzufügen, und bezeichnet verständlich die aus der Stadt handelnde Gruppe.
- source_word: ὅτι
  choice: weil
  rationale: Die Konjunktion führt den Grund dafür ein, dass ihm der Zugang verwehrt wurde.
- source_word: φρουρὰ Ἀπολλωνίου
  choice: eine Besatzung des Apollonius
  rationale: φρουρά bezeichnet hier eine in der Stadt stationierte militärische Besatzung, die Apollonius unterstand oder zu ihm gehörte. Der unbestimmte Artikel entspricht im Deutschen dem artikellosen griechischen Ausdruck.
- source_word: ἐπολέμησαν αὐτήν
  choice: sie kämpften gegen die Stadt
  rationale: ἐπολέμησαν steht ausdrücklich im Plural; dieser unvermittelte Wechsel gegenüber dem vorherigen Singular wird beibehalten. Das feminine Pronomen αὐτήν verweist am ehesten auf Joppe als Stadt. „Die Stadt“ verhindert im Deutschen die irreführende mögliche Rückbeziehung von „sie“ auf die ebenfalls feminine „Besatzung“.
