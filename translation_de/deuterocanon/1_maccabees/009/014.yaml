    rationale: Die deutsche Wendung betont ein räumliches Umringen. Das griechische Verb mit Dativ besagt, dass die Mutigen bei Judas zusammenkamen; „sammelten sich bei ihm“ wahrt diese offenere Relation.
  revised_text: Und Judas sah, dass Bakchides und die Hauptmacht des Heeres auf der rechten Seite standen; da sammelten sich alle Männer mit mutigem Herzen bei ihm.
