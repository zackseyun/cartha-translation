  yaml_path: translation/deuterocanon/1_maccabees/009/014.yaml
  text: And Judas saw that Bacchides and the main strength of the camp were on the right[b][a], and all the men courageous in heart gathered around him.
translation:
  language: de
  text: Und Judas sah, dass Bakchides und die Hauptmacht des Heeres auf der rechten Seite standen; da sammelten sich alle Männer mit mutigem Herzen bei ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεν
  choice: sah
  rationale: Der Aorist von ὁράω bezeichnet hier im schlichten Erzählstil Judas’ Wahrnehmung der gegnerischen Aufstellung; „sah“ vermeidet eine unnötige Deutung als bloße Schlussfolgerung.
- source_word: τὸ στερέωμα τῆς παρεμβολῆς
  choice: die Kerntruppe des Heeres
  rationale: στερέωμα bezeichnet das Feste, Starke oder Tragende; im militärischen Zusammenhang ist damit der feste beziehungsweise stärkste Truppenkörper gemeint. „Kerntruppe“ gibt dies natürlich wieder, ohne eine bauliche Befestigung anzunehmen. παρεμβολή wird wegen des konkreten Kampfverbandes hier mit „Heer“ wiedergegeben.
- source_word: ἐν τοῖς δεξιοῖς
  choice: auf der rechten Seite
  rationale: Die substantivierte Pluralform bezeichnet die rechte Seite beziehungsweise den rechten Flügel. „Auf der rechten Seite“ wahrt die räumliche Aussage, ohne die im Griechischen nicht ausdrücklich genannte Bezeichnung „Flügel“ einzusetzen.
- source_word: συνῆλθον αὐτῷ
  choice: scharten sich um ihn
  rationale: συνέρχομαι mit dem Dativ beschreibt hier das Zusammenkommen bei Judas. „Sich um ihn scharen“ ist im Deutschen idiomatisch und vermittelt das geschlossene Sammeln der Kämpfer bei ihrem Anführer.
- source_word: πάντες οἱ εὔψυχοι τῇ καρδίᾳ
  choice: alle Männer mit mutigem Herzen
  rationale: εὔψυχοι bezeichnet Mutige oder Beherzte, während τῇ καρδίᾳ die innere Haltung hervorhebt. Die maskuline Form meint im gegebenen Kampfkontext die männlichen Kämpfer; „mit mutigem Herzen“ bewahrt das Bild des Ausgangstextes.
theological_decisions:
- issue: Geschlechtsspezifischer Bezug im militärischen Kontext
  choice: alle Männer mit mutigem Herzen
  alternative: alle Mutigen; alle, die mutigen Herzens waren
  rationale: Der maskuline Plural bezieht sich im Erzählzusammenhang auf die kämpfenden Männer. Die ausdrückliche Wiedergabe mit „Männer“ macht diesen konkreten Bezug sichtbar, statt ihn zu verallgemeinern.
translation_notes:
  register: Moderner, würdevoller Erzählstil. „Bakchides“ folgt einer griechischnahen deutschen Namensform. Der Satzbau bleibt dem griechischen Ablauf nahe, wird aber durch das Semikolon und „da“ für heutiges Deutsch klar gegliedert.
