  source_fidelity: '„Kerntruppe“ ist für τὸ στερέωμα stärker spezifiziert als der griechische Ausdruck: Es kann eine Eliteeinheit oder einen organisatorischen Kern nahelegen, während der Text die feste bzw. hauptsächliche Stärke des Heeres bezeichnet. „Hauptmacht“ gibt dies ohne Zusatzannahme wieder. „Sich um ihn scharen“ legt zudem ein Umringen nahe; συνῆλθον αὐτῷ besagt neutraler, dass sie bei/zu ihm zusammenkamen.'
