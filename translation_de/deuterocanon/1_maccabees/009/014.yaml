  terminology: „Bakchides“ ist eine passende griechischnahe deutsche Namensform. „Männer mit mutigem Herzen“ bildet die maskuline Kämpfergruppe und die idiomatische Hervorhebung des Herzens angemessen ab. Für στερέωμα ist „Hauptmacht“ gegenüber „Kerntruppe“ terminologisch zurückhaltender.
