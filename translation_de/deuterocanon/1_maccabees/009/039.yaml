base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/039.yaml
  text: And they lifted up their eyes and looked, and behold, a noisy procession and much baggage; and the bridegroom came out to meet them, with his friends and his brothers, with tambourines and musicians and many weapons.
translation:
  language: de
  text: 'Da hoben sie ihre Augen auf und sahen: Siehe, lautes Getöse und viel Gepäck. Und der Bräutigam kam mit seinen Freunden und Brüdern heraus, um ihnen entgegenzutreten, mit Tamburinen, Musikern und vielen Waffen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θροῦς
  choice: eine lärmende Prozession
  rationale: Das Wort bezeichnet Lärm bzw. lautes Getöse; im Zusammenhang der herannahenden Hochzeitsgesellschaft gibt »lärmende Prozession« den akustischen Eindruck und die Szene natürlich wieder.
- source_word: ἀποσκευή πολλή
  choice: viel Gepäck
  rationale: ἀποσκευή bezeichnet Gepäck, Ausrüstung oder mitgeführtes Gut; »viel Gepäck« bewahrt die konkrete, unbestimmte Aussage.
- source_word: εἰς συνάντησιν αὐτῶν
  choice: ihnen entgegen
  rationale: Die idiomatische deutsche Wendung gibt die Bewegung zum Zusammentreffen präzise wieder.
- source_word: μουσικῶν
  choice: Musikern
  rationale: Das substantivierte Adjektiv bezeichnet hier musizierende Personen; »Musiker« ist die natürliche moderne Entsprechung.
- source_word: ὅπλων πολλῶν
  choice: mit vielen Waffen
  rationale: ὅπλα meint im Kontext Waffen beziehungsweise Bewaffnung; die konkrete Wiedergabe wahrt die auffällige militärische Dimension des Hochzeitszugs.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende biblische Ausdruck »die Augen aufheben« bleibt erhalten, während die übrige Satzführung für heutige Leser geglättet wird. Die Wiederholung von »und« wurde maßvoll reduziert, ohne die Abfolge der Beobachtungen zu verändern.
