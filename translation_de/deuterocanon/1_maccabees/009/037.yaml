  text: After these words it was reported to Jonathan and Simon his brother that the sons of Jambri were holding a great wedding[a], and were bringing the bride from Nadabath, the daughter of one of the great nobles of Canaan, with a large escort.
translation:
  language: de
  text: Nach diesen Worten wurde Jonatan und seinem Bruder Simon gemeldet, dass die Söhne Jambris eine große Hochzeit feierten und die Braut, die Tochter eines der großen Würdenträger Kanaans, aus Nadabath unter großem Geleit[a] herbeiführten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in einem großen Festzug. Das griechische Wort kann sowohl das begleitende Geleit als auch den festlichen Zug selbst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τοὺς λόγους τούτους
  choice: Nach diesen Worten
  rationale: Die Wiedergabe bleibt nahe bei λόγους und bildet zugleich einen natürlichen erzählerischen Übergang.
- source_word: ἀπηγγέλησαν
  choice: wurde ... gemeldet
  rationale: Das unpersönliche Passiv des Griechischen wird bewahrt, ohne einen nicht genannten Überbringer einzuführen.
- source_word: Ἰωναθὰν καὶ Σίμωνι τῷ ἀδελφῷ αὐτοῦ
  choice: Jonatan und seinem Bruder Simon
  rationale: Der Dativ bezeichnet die Empfänger der Nachricht; die Formulierung macht natürlich verständlich, dass Simon Jonatans Bruder ist.
- source_word: Υἱοὶ Ἰαμβρὶ
  choice: die Söhne Jambris
  rationale: Die familiäre beziehungsweise stammesbezogene Bezeichnung des griechischen Textes bleibt transparent erhalten.
- source_word: ποιοῦσιν γάμον μέγαν
  choice: ein großes Hochzeitsfest feierten
  rationale: ποιεῖν γάμον bezeichnet idiomatisch das Feiern einer Hochzeit; »Hochzeitsfest« ist im Deutschen anschaulich und kontextgerecht.
- source_word: ἄγουσι τὴν νύμφην
  choice: die Braut ... holten / wurde ... herbeigeführt
  rationale: ἄγω bezeichnet das Bringen oder Führen. Die deutsche Formulierung gibt sowohl die Bewegung vom Herkunftsort als auch das feierliche Geleit wieder.
- source_word: ἀπὸ Ναδαβάθ
  choice: aus Nadabat
  rationale: ἀπό bezeichnet den Ausgangsort; der Ortsname wird entsprechend der griechischen Form deutsch transliteriert.
- source_word: θυγατέρα ἑνὸς τῶν μεγάλων μεγιστάνων Χαναάν
  choice: die Tochter eines der großen Würdenträger Kanaans
  rationale: μεγιστάν bezeichnet einen hochrangigen Machthaber oder Großen. »Würdenträger« ist verständlich, würdevoll und vermeidet eine zu spezifische Adelsterminologie.
- source_word: μετὰ παραπομπῆς μεγάλης
  choice: unter großem Geleit
  rationale: παραπομπή kann sowohl das begleitende Gefolge als auch den festlichen Zug bezeichnen. »Geleit« gibt den konkreten Hauptsinn wieder, ohne die Alternative auszuschließen.
