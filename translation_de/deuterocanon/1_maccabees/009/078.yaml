review_pass:
  verdict: revise
  source_fidelity: Die Ortsnamensform „Aschdod“, die Verfolgung und „tausend Reiter“ geben den griechischen Text sachgerecht wieder. Bei αἱ παρεμβολαὶ … συνῆψαν … εἰς πόλεμον legt „trafen ... aufeinander“ jedoch stärker als der griechische Wortlaut fest, dass mehrere Heere miteinander kämpften. Eine weniger reziproke Formulierung bewahrt die knappe und in der Bezugnahme offene Syntax besser.
  naturalness: Der Text ist flüssiges modernes Standarddeutsch. „Die Heere nahmen hinter ihm den Kampf auf“ ist idiomatisch und wahrt zugleich die räumliche Unbestimmtheit von ὀπίσω αὐτοῦ.
  terminology: „Aschdod“ ist die etablierte deutsche biblische Namensform für Ἄζωτος. „Heere“ kann παρεμβολαί hier als metonymische Bezeichnung für militärische Verbände wiedergeben; „Reiter“ ist für χιλίαν ἵππον passend.
  issues:
  - severity: low
    issue: „trafen die Heere zur Schlacht aufeinander“ präzisiert die Kampfbeziehung.
    rationale: Die griechische Formulierung nennt pluralische militärische Verbände und ihr Eingehen in den Kampf, legt aber keinen ausdrücklich wechselseitigen Kampf dieser Verbände gegeneinander fest. Die revidierte Fassung vermeidet diese zusätzliche Festlegung.
  - severity: low
    issue: Die Fußnote bezeichnet den Satz als unvollständig.
    rationale: Der überlieferte Wortlaut endet zwar abrupt und die Erzählung wird im folgenden Vers fortgeführt, doch „ließ tausend Reiter zurück“ ist als deutscher Satz grammatisch vollständig. Die Fußnote sollte daher von einem abrupten Versschluss bzw. einer Fortführung der Erzählung sprechen.
  revised_text: Er verfolgte ihn bis Aschdod. Die Heere nahmen hinter ihm den Kampf auf. Und Apollonius ließ tausend Reiter zurück.[a]
