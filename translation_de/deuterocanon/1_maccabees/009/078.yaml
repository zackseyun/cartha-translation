  yaml_path: translation/deuterocanon/1_maccabees/009/078.yaml
  text: He pursued after him as far as Azotus[a], and the camps joined battle behind him[b]. And Apollonius left behind a thousand horsemen
translation:
  language: de
  text: Er verfolgte ihn bis Aschdod. Die Heere nahmen hinter ihm den Kampf auf. Und Apollonius ließ tausend Reiter zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte griechische Text endet hier mit den Worten: „Und Apollonius ließ tausend Reiter zurück.“ Die Erzählung wird im folgenden Vers fortgeführt.'
    reason: textual_variant
lexical_decisions:
- source_word: δίωξεν ὀπίσω αὐτοῦ
  choice: Er verfolgte ihn
  rationale: Die Verbindung bezeichnet in diesem militärischen Zusammenhang eine feindliche Verfolgung; die deutsche Wendung ist präzise und natürlich.
- source_word: εἰς Ἄζωτον
  choice: bis Aschdod
  rationale: εἰς bezeichnet hier das Ziel beziehungsweise die Reichweite der Verfolgung. Aschdod ist die im modernen Deutschen übliche biblische Namensform für Ἄζωτος.
- source_word: συνῆψαν ... εἰς πόλεμον
  choice: trafen ... zur Schlacht aufeinander
  rationale: συνάπτω mit εἰς πόλεμον beschreibt das Zusammentreffen beziehungsweise den Eintritt in den Kampf; die Wiedergabe vermeidet das im Deutschen unnatürliche Bild von Lagern, die sich verbinden.
- source_word: αἱ παρεμβολαί
  choice: die Heere
  rationale: παρεμβολή kann wörtlich ein Lager bezeichnen, steht hier im Plural aber metonymisch für die dort befindlichen militärischen Verbände.
- source_word: ὀπίσω αὐτοῦ
  choice: hinter ihm
  rationale: Beim zweiten Vorkommen ist die räumliche Bedeutung passend; der nicht ausdrücklich geklärte männliche Bezug bleibt wie im Griechischen erhalten.
- source_word: ἀπέλειπεν
  choice: ließ ... zurück
  rationale: Die Form bezeichnet das Zurücklassen einer Truppe, ohne deren taktische Funktion näher festzulegen.
- source_word: χιλίαν ἵππον
  choice: tausend Reiter
  rationale: ἵππος wird bei militärischen Zahlen metonymisch für berittene Soldaten beziehungsweise Kavallerie gebraucht; „Reiter“ ist klares, idiomatisches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwerfällige griechische Militärsprache wird verständlich wiedergegeben, während die räumliche Unbestimmtheit von „hinter ihm“ und der abrupte Versschluss erhalten bleiben.
