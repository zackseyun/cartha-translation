- from: Er verfolgte ihn bis Aschdod. Hinter ihm trafen die Heere zur Schlacht aufeinander. Und Apollonius ließ tausend Reiter zurück.[a]
  to: Er verfolgte ihn bis Aschdod. Die Heere nahmen hinter ihm den Kampf auf. Und Apollonius ließ tausend Reiter zurück.[a]
  rationale: Die Revision bewahrt die militärische Bedeutung von συνῆψαν εἰς πόλεμον, ohne durch „aufeinander“ eine im Griechischen nicht ausdrücklich bestimmte Gegnerschaft festzulegen. Die Fußnote beschreibt den abrupten Textschluss genauer, ohne fälschlich eine grammatische Unvollständigkeit zu behaupten.
