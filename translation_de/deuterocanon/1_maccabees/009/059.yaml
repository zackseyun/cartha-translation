  text: And after they went, they took counsel with him[a].
translation:
  language: de
  text: Und nachdem sie gegangen waren, berieten sie sich mit ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der gewöhnliche Anschluss bewahrt die knappe Erzählfolge.
- source_word: πορευθέντες
  choice: sie gingen zu ihm
  rationale: Das Aoristpartizip bezeichnet eine der Beratung vorausgehende Bewegung. Im Deutschen lässt sich die Abfolge natürlich durch beigeordnete Verben wiedergeben. Das im Kontext naheliegende Ziel »zu ihm« wird aus αὐτῷ erschlossen.
- source_word: συνεβουλεύσαντο
  choice: berieten sich
  rationale: Die mediale Form bezeichnet gemeinsames Beraten beziehungsweise Sich-Besprechen und wird durch »berieten sich« idiomatisch und präzise wiedergegeben.
- source_word: αὐτῷ
  choice: mit ihm
  rationale: Der Dativ bezeichnet bei diesem Verb am wahrscheinlichsten die Person, mit der die Beratung stattfand. Zugleich kann er im Deutschen zusammen mit dem Bewegungsverb als Zielbezug verstanden werden.
