  register: Knapper, würdiger Erzählstil in modernem Standarddeutsch. Die koordinierte Fassung klingt natürlicher als »nachdem sie gegangen waren« und bewahrt dennoch die zeitliche Abfolge des griechischen Aoristpartizips.
