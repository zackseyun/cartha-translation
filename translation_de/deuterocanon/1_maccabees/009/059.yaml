  source_fidelity: Der Entwurf fügt mit »zu ihm« beim Bewegungsverb ein im Griechischen nicht ausgedrücktes Ziel hinzu. αὐτῷ gehört zur Beratung und bedeutet hier am besten »mit ihm«. Das vorzeitige Aoristpartizip πορευθέντες sollte als zeitlich vorausgehende Handlung wiedergegeben werden, ohne Richtung oder Ziel der Bewegung zu ergänzen.
  naturalness: »Und nachdem sie gegangen waren, berieten sie sich mit ihm« ist modernes, klares Standarddeutsch und bildet die knappe zeitliche Abfolge des griechischen Satzes angemessen ab.
  terminology: »sich mit ihm beraten« gibt συνεβουλεύσαντο αὐτῷ idiomatisch und ohne sachliche Einengung wieder. Es sind keine besonderen theologischen Begriffe betroffen.
