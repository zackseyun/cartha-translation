  yaml_path: translation/deuterocanon/1_maccabees/009/068.yaml
  text: And they fought against Bacchides[a], and he was crushed by them, and they pressed him hard, because his plan and his attack were in vain.
translation:
  language: de
  text: Und sie kämpften gegen Bakchides, und er wurde von ihnen zerschmettert; sie setzten ihm heftig zu, denn sein Plan und sein Angriff waren vergeblich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »leer«. Auch möglich: »liefen ins Leere«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπολέμησαν πρὸς
  choice: kämpften gegen
  rationale: Die Verbindung bezeichnet hier eine gegen Bakchides gerichtete kriegerische Handlung; „kämpften gegen“ ist im modernen Deutsch klar und idiomatisch.
- source_word: Βακχίδην
  choice: Bakchides
  rationale: Der griechische Personenname wird in einer dem Deutschen angepassten Form transliteriert.
- source_word: συνετρίβη ὑπʼ αὐτῶν
  choice: zerschmetterten ihn
  rationale: Das Passiv von συντρίβω trägt das anschauliche Bild des Zerbrechens oder Zerschmetterns. Die aktive deutsche Form vermeidet eine schwerfällige Passivkonstruktion und bewahrt denselben Handlungsträger.
- source_word: ἔθλιβον αὐτὸν σφόδρα
  choice: setzten ihm heftig zu
  rationale: Im militärischen Zusammenhang bezeichnet θλίβω starken Druck oder Bedrängnis; die Wendung gibt dies in natürlichem Deutsch wieder, während „heftig“ die Verstärkung durch σφόδρα ausdrückt.
- source_word: βουλή
  choice: Plan
  rationale: βουλή bezeichnet hier den beabsichtigten Handlungsplan des Bakchides; „Plan“ ist klar und lässt offen, ob besonders Strategie oder allgemeine Absicht gemeint ist.
- source_word: ἔφοδος
  choice: Angriff
  rationale: ἔφοδος bezeichnet in diesem militärischen Zusammenhang einen Angriff oder Vorstoß; „Angriff“ ist die unmittelbarste moderne Wiedergabe.
- source_word: κενή
  choice: waren vergeblich
  rationale: κενός bedeutet wörtlich „leer“, bezeichnet hier aber bildlich einen wirkungslosen Plan und Angriff. „waren vergeblich“ gibt diesen Sinn natürlich wieder, ohne ein konkretes Ergebnis hinzuzufügen.
