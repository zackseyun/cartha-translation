  yaml_path: translation/deuterocanon/1_maccabees/009/011.yaml
  text: And the force moved out from the camp and took their stand to meet them[a], and the cavalry was divided into two parts, and the slingers and the archers went before the force, and all the mighty men were in the front ranks.
translation:
  language: de
  text: Und die Streitmacht brach aus dem Lager auf und stellte sich ihnen zum Kampf entgegen. Die Reiterei wurde in zwei Abteilungen geteilt; die Schleuderer und die Bogenschützen zogen vor der Streitmacht her, und alle kampfstarken Männer standen in vorderster Reihe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Vorkämpfer waren allesamt kampfstarke Männer.“ Die griechische Formulierung ist knapp und kann entweder die Stellung der kampfstarken Männer in der vordersten Reihe oder ihre Bezeichnung als Vorkämpfer ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: brach … auf
  rationale: Das Verb bezeichnet hier das Aufbrechen einer Truppe aus ihrem Lager und klingt im Deutschen natürlich militärisch, ohne bereits einen Angriff zu behaupten.
- source_word: ἡ δύναμις
  choice: die Streitmacht
  rationale: δύναμις bezeichnet in diesem Zusammenhang einen bewaffneten Truppenverband; „Streitmacht“ umfasst passend die anschließend genannten Waffengattungen.
- source_word: παρεμβολῆς
  choice: Lager
  rationale: παρεμβολή ist in militärischer Erzählung die übliche Bezeichnung für ein Lager oder Heerlager.
- source_word: ἔστησαν εἰς συνάντησιν αὐτοῖς
  choice: stellte sich ihnen zum Kampf entgegen
  rationale: Die Formulierung gibt sowohl das Aufstellen als auch die feindliche Begegnung wieder. Der deutsche Singular richtet sich nach dem Kollektiv „Streitmacht“, während das griechische Prädikat in den Plural wechselt.
- source_word: ἡ ἵππος
  choice: die Reiterei
  rationale: Der wörtliche Kollektivausdruck „das Pferd“ bezeichnet im militärischen Kontext die Kavallerie.
- source_word: ἐμερίσθη … εἰς δύο μέρη
  choice: wurde in zwei Abteilungen geteilt
  rationale: „Abteilungen“ vermittelt die taktische Gliederung natürlicher als das wörtliche „Teile“, ohne eine bestimmte Einheitsgröße festzulegen.
- source_word: σφενδονῆται
  choice: die Schleuderer
  rationale: Dies ist die übliche deutsche Bezeichnung für mit Schleudern bewaffnete Kämpfer.
- source_word: τοξόται
  choice: die Bogenschützen
  rationale: Dies ist die klare und gebräuchliche deutsche Entsprechung für mit Bogen kämpfende Truppen.
- source_word: προεπορεύοντο τῆς δυνάμεως
  choice: zogen vor der Streitmacht her
  rationale: Die Wendung beschreibt ihre Position vor dem Hauptverband, ohne ihnen eine Führungs- oder Befehlsfunktion zuzuschreiben.
- source_word: οἱ πρωταγωνισταὶ πάντες οἱ δυνατοί
  choice: alle kampfstarken Männer standen in vorderster Reihe
  rationale: Die Wiedergabe versteht πρωταγωνισταί militärisch als Kämpfer in der vordersten Stellung und δυνατοί als kampfstarke Männer. Wegen der gedrängten griechischen Formulierung wird die alternative Zuordnung in der Fußnote bewahrt.
