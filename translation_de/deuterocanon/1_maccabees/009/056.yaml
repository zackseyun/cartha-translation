translation:
  language: de
  text: Und Alkimos starb zu jener Zeit unter großen Qualen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach großen Qualen“. Die griechische Wendung μετὰ βασάνου μεγάλης kann entweder die Begleitumstände seines Todes oder das schwere Leiden bezeichnen, das ihm vorausging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: starb
  rationale: Der Aorist von ἀποθνῄσκω berichtet schlicht das eingetretene Sterben; „starb“ ist die natürliche und genaue deutsche Wiedergabe.
- source_word: Ἄλκιμος
  choice: Alkimos
  rationale: Die griechische Namensform wird nach üblicher deutscher Transliteration als „Alkimos“ wiedergegeben.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: zu jener Zeit
  rationale: Die Wendung bezeichnet allgemein den Zeitpunkt des Geschehens. „Zu jener Zeit“ erhält den erzählerischen Rückbezug, ohne καιρός unnötig als besondere Frist oder Epoche zu deuten.
- source_word: μετὰ βασάνου μεγάλης
  choice: unter großen Qualen
  rationale: μετά mit Genitiv bedeutet grundsätzlich „mit“; im Zusammenhang bezeichnet die Wendung die leidvollen Begleitumstände seines Todes. „Unter großen Qualen“ klingt im Deutschen natürlich und bewahrt die Intensität von βάσανος, ohne eindeutig festzulegen, ob die Qualen dem Tod vorausgingen oder ihn begleiteten.
