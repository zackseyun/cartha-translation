translation:
  language: de
  text: In jenen Tagen kam eine überaus große Hungersnot auf, und das Land lief zu ihnen über.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und das Land schloss sich ihnen an“; wörtlicher kann μετʼ αὐτῶν „mit ihnen“ heißen. Das griechische Verb bezeichnet das Überlaufen oder den Wechsel zu einer anderen Partei.'
