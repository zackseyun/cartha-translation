lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: In jenen Tagen
  rationale: Die geläufige deutsche Erzählformel gibt die griechische Zeitangabe eng und würdig wieder.
- source_word: ἐγενήθη
  choice: kam … auf
  rationale: Die Form bezeichnet hier das Eintreten eines Geschehens; „kam auf“ ist bei einer Hungersnot natürliches modernes Deutsch.
- source_word: λιμὸς μεγάλη σφόδρα
  choice: eine überaus große Hungersnot
  rationale: „Hungersnot“ gibt λιμός wieder; „überaus groß“ bewahrt die starke Intensivierung durch μεγάλη σφόδρα.
- source_word: αὐτομόλησεν
  choice: lief … über
  rationale: Das Verb bezeichnet das Überlaufen beziehungsweise den Parteiwechsel und behält damit den politischen Beiklang.
- source_word: ἡ χώρα
  choice: das Land
  rationale: χώρα kann Land, Gebiet oder Landschaft samt Bevölkerung bezeichnen. „Das Land“ wahrt diese Breite und lässt die übliche metonymische Bezugnahme auf seine Bewohner bestehen.
- source_word: μετʼ αὐτῶν
  choice: zu ihnen
  rationale: In Verbindung mit dem Verb des Überlaufens wird die Zugehörigkeit zur anderen Partei im Deutschen idiomatisch mit „zu ihnen“ ausgedrückt; die wörtlichere Begleitbedeutung „mit ihnen“ bleibt in der Fußnote sichtbar.
