  yaml_path: translation/deuterocanon/1_maccabees/009/022.yaml
  text: And the rest of the accounts concerning Judas, and his wars, and the brave deeds that he did, and his greatness, were not recorded; for they were very many.
translation:
  language: de
  text: Was sonst noch über Judas zu berichten war – über seine Kriege, die mutigen Taten, die er vollbrachte, und seine Größe –, wurde nicht aufgezeichnet; denn es war überaus viel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ περισσὰ τῶν λόγων Ἰούδα
  choice: Was sonst noch über Judas zu berichten wäre
  rationale: 'Die Formulierung gibt den historiografischen Rückblick idiomatisch wieder: Gemeint ist das über die bisherige Darstellung hinaus noch Berichtenswerte über Judas. Der Konjunktiv „wäre“ bezeichnet hier nicht Unsicherheit, sondern den nicht niedergeschriebenen weiteren Stoff.'
- source_word: τῶν πολέμων
  choice: seine Kriege
  rationale: Der Plural bezeichnet Judas’ militärische Auseinandersetzungen umfassend; „Kriege“ bleibt weiter als „Schlachten“.
- source_word: τῶν ἀνδραγαθιῶν ὧν ἐποίησεν
  choice: seine mutigen Taten
  rationale: ἀνδραγαθίαι bezeichnet tapfere, ruhmvolle Leistungen. „Mutige Taten“ ist verständlich, würdig und vermeidet das heute missverständliche „Mannestaten“.
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: seine Größe
  rationale: „Größe“ bewahrt die breite Bedeutung von μεγαλωσύνη, die hier Judas’ herausragende Stellung und Bedeutung bezeichnet, ohne technisch königliche Majestät einzutragen.
- source_word: οὐ κατεγράφη
  choice: wurde nicht aufgezeichnet
  rationale: Das passive Verb bezeichnet das Ausbleiben einer schriftlichen Aufzeichnung. Der Singular richtet sich im Deutschen natürlich nach dem als Gesamtstoff verstandenen einleitenden Relativsatz.
- source_word: πολλὰ γὰρ ἦν σφόδρα
  choice: denn es war überaus viel
  rationale: Die unpersönliche Formulierung gibt die große Menge des nicht aufgezeichneten Stoffes natürlich wieder und erhält die verstärkende Kraft von σφόδρα.
