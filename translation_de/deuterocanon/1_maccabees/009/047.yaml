  text: And the battle grew intense[a], and Jonathan stretched out his hand to strike Bacchides[b], but he turned away from him to the rear.
translation:
  language: de
  text: Da wurde der Kampf immer heftiger,[a] und Jonatan streckte seine Hand aus, um Bakchides zu schlagen; doch dieser wich ihm nach hinten aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da rückten die Kämpfenden enger zusammen« beziehungsweise: »Da verdichtete sich der Kampf.« Das griechische Verb kann sowohl das Zusammenrücken als auch die zunehmende Heftigkeit des Kampfes ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: »doch er bog von ihm weg nach hinten ab.« Das griechische Verb bezeichnet ein Abweichen oder Ausweichen; die Formulierung hebt die rückwärtige Bewegungsrichtung hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆγεν ὁ πόλεμος
  choice: Da wurde der Kampf immer heftiger
  rationale: Das intransitiv gebrauchte συνῆγεν beschreibt hier wahrscheinlich, wie sich das Kampfgeschehen verdichtet beziehungsweise zuspitzt. Die Formulierung ist natürliches Deutsch und wahrt durch die Fußnote die Bildhaftigkeit und Mehrdeutigkeit des Griechischen.
- source_word: ἐξέτεινεν ... τὴν χεῖρα αὐτοῦ
  choice: streckte seine Hand aus
  rationale: Die griechische Wendung bleibt in ihrer konkreten Bildsprache sichtbar und wird nicht bloß zu „griff an“ verallgemeinert.
- source_word: πατάξαι
  choice: zu schlagen
  rationale: „Schlagen“ gibt die kräftige, unmittelbare Handlung wieder, ohne altertümlich oder unnötig technisch zu klingen.
- source_word: Βακχίδην
  choice: Bakchides
  rationale: Der griechische Personenname wird in einer im Deutschen nachvollziehbaren Form transliteriert.
- source_word: ἐξέκλινεν ἀπ᾿ αὐτοῦ εἰς τὰ ὀπίσω
  choice: doch der wich vor ihm nach hinten zurück
  rationale: Die Übersetzung bewahrt sowohl das seitliche beziehungsweise ausweichende Moment von ἐξέκλινεν als auch die rückwärtige Richtung von εἰς τὰ ὀπίσω. Das Demonstrativpronomen „der“ macht den natürlichen Subjektwechsel zu Bakchides verständlich, ohne ihn im Haupttext ausdrücklich auszudeuten.
