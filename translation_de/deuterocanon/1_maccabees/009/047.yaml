  register: Modernes, würdiges Standarddeutsch. Die militärische Szene bleibt anschaulich; altertümliche Wörter wie „schmettern“ oder „schlagen wollen“ wurden vermieden. Die nicht ausdrücklich genannte Subjektaufnahme bei ἐξέκλινεν wird durch „der“ lesbar gemacht, während die Fußnote die syntaktische und bewegungsbezogene Nuance erläutert.
