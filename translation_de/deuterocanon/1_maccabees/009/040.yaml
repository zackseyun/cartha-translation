base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/040.yaml
  text: And they rose up against them from the ambush and killed them[a]; and many fell wounded, and the rest fled to the mountain[b], and they took all their equipment.
translation:
  language: de
  text: Da brachen sie aus dem Hinterhalt gegen sie hervor und töteten sie. Viele fielen verwundet[a], die Übrigen flohen auf den Berg, und sie nahmen ihre gesamte Ausrüstung an sich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Viele fielen als Kampfopfer.« Das griechische Wort τραυματίαι kann Verwundete oder allgemeiner Opfer eines Kampfes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihr gesamtes Gepäck« oder »ihre gesamte Habe«. Das griechische σκεύη ist eine breite Bezeichnung für Gegenstände oder Ausrüstung; im militärischen Zusammenhang liegt mitgeführte Ausrüstung nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν ἐπʼ αὐτοὺς ἀπὸ τοῦ ἐνέδρου
  choice: sie brachen aus dem Hinterhalt gegen sie hervor
  rationale: Die Formulierung gibt das plötzliche Hervorkommen aus der verborgenen Stellung und die feindliche Ausrichtung wieder, ohne das griechische Bild durch ein bloßes „griffen an“ vollständig aufzulösen.
- source_word: ἀπέκτειναν αὐτούς
  choice: töteten sie
  rationale: Direkte, moderne und nicht archaische Wiedergabe des Verbs.
- source_word: ἔπεσαν τραυματίαι πολλοί
  choice: Viele fielen verwundet zu Boden
  rationale: Die Übersetzung bewahrt sowohl das Fallen als auch die Verwundung und vermeidet im Haupttext die Festlegung, dass alle Genannten starben.
- source_word: οἱ ἐπίλοιποι
  choice: die Übrigen
  rationale: Natürliche Wiedergabe derjenigen, die nach dem Angriff noch entkommen konnten.
- source_word: ἔφυγον εἰς τὸ ὄρος
  choice: flohen auf den Berg
  rationale: Der griechische Singular und das konkrete Ziel werden beibehalten; „ins Bergland“ wäre stärker auslegend.
- source_word: πάντα τὰ σκεύη αὐτῶν
  choice: ihre gesamte Ausrüstung
  rationale: Im militärischen Zusammenhang bezeichnet σκεύη am ehesten die mitgeführten Ausrüstungsgegenstände; „Ausrüstung“ ist im Deutschen umfassend und idiomatisch.
