  text: Und Bakchides erfuhr davon und suchte ihn zu töten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: erfuhr davon
  rationale: Der Aorist von γινώσκω bezeichnet hier im Erzählzusammenhang wahrscheinlich das Erlangen einer Information. „Erfuhr davon“ ist natürliches Deutsch; „davon“ nimmt den vorausgehenden Sachverhalt auf, ohne seinen Inhalt näher festzulegen.
- source_word: ἐζήτει
  choice: suchte
  rationale: Das Imperfekt beschreibt ein anhaltendes oder wiederholtes Bestreben. „Suchte ihn zu töten“ bewahrt die Zielgerichtetheit von ζητέω, ohne bereits zu behaupten, dass ein konkreter Tötungsversuch stattfand.
- source_word: ἀποκτεῖναι
  choice: zu töten
  rationale: Die schlichte und genaue Wiedergabe des Infinitivs vermeidet sowohl den möglichen Hintersinn einer förmlichen Hinrichtung bei „hinrichten“ als auch einen unnötig gehobenen Ausdruck.
- source_word: Βακχίδης
  choice: Bakchides
  rationale: Der Personenname wird nach geläufiger deutscher Umschrift des Griechischen wiedergegeben.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Akkusativpronomen verweist auf die männliche Person im vorausgehenden Kontext und wird direkt mit „ihn“ wiedergegeben.
