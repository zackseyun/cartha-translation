  register: Moderner, würdevoller Erzählstil. „Schlugen … ihr Lager auf“ hält den militärischen Zusammenhang fest; die ungewöhnliche griechische Verbindung mit εἰς wird im Haupttext idiomatisch und in der Fußnote transparent wiedergegeben.
