  text: And in the first month of the one hundred and fifty-second year[a], they encamped in Jerusalem.
translation:
  language: de
  text: Und im ersten Monat des einhundertzweiundfünfzigsten Jahres schlugen sie in Jerusalem ihr Lager auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch steht εἰς Jerusalem, wörtlich etwa „nach Jerusalem“. Die Präposition kann hier die Bewegung zum Ort oder den Ort des Lagers kennzeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ μηνὸς τοῦ πρώτου
  choice: im ersten Monat
  rationale: Der Genitiv hat temporale Funktion; die deutsche Wendung gibt die Zeitangabe natürlich und genau wieder.
- source_word: ἔτους δευτέρου καὶ πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: des hundertzweiundfünfzigsten Jahres
  rationale: Die additive griechische Zahlform („zweiten und fünfzigsten und hundertsten“) wird nach heutigem deutschen Sprachgebrauch als Ordinalzahl wiedergegeben.
- source_word: παρενέβαλον
  choice: schlugen sie ihr Lager auf
  rationale: Die Wendung bewahrt den militärischen Sinn des Verbs und klingt im modernen Deutschen natürlicher als „sie lagerten“.
- source_word: εἰς Ἱερουσαλήμ
  choice: in Jerusalem
  rationale: Nach dem Verb des Lageraufschlagens kann εἰς sowohl die Bewegung zum Ort als auch den erreichten Ort bezeichnen. „In Jerusalem“ gibt hier die resultierende Ortslage idiomatisch wieder, ohne die nicht ausdrücklich genannte Bedeutung „gegen Jerusalem“ einzutragen.
