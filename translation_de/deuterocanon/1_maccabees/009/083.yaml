base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/083.yaml
  text: to Azotus[a], and they entered Beth-dagon, their idol temple, to be saved[b]. And Jonathan burned Azotus and the cities around it.
translation:
  language: de
  text: nach Azotus[a], und sie gingen in Bet-Dagon, ihren Götzentempel, um sich in Sicherheit zu bringen[b]. Jonatan steckte Azotus und die umliegenden Städte in Brand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azotus ist der griechische Name von Aschdod.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um gerettet zu werden“. Bei „ihren Götzentempel“ steht im Griechischen wörtlich „ihr Götzenbild“; im Zusammenhang ist wahrscheinlich das Götzenheiligtum in Bet-Dagon gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄζωτον
  choice: Azotus
  rationale: Die griechische Namensform wird entsprechend der griechischen Textgrundlage beibehalten; das geläufigere hebräische Namensäquivalent Aschdod wird in einer Fußnote genannt.
- source_word: εἰσῆλθον
  choice: sie gingen in
  rationale: Die Form bezeichnet hier das Hineingehen in Bet-Dagon; diese Wiedergabe ist im Deutschen natürlicher als das formalere „sie traten ein in“.
- source_word: Βηθδαγὼν
  choice: Bet-Dagon
  rationale: Der Eigenname des Heiligtums beziehungsweise Ortes wird in einer im Deutschen üblichen semitischen Umschrift wiedergegeben.
- source_word: τὸ εἴδωλον αὐτῶν
  choice: ihren Götzentempel
  rationale: Wörtlich steht „ihr Götzenbild“. Da die Flüchtenden in Bet-Dagon hineingehen, bezeichnet die Wendung im Zusammenhang wahrscheinlich das Heiligtum beziehungsweise den Tempel des Götzen. Die wörtliche Möglichkeit bleibt in der Fußnote sichtbar.
- source_word: τοῦ σωθῆναι
  choice: um sich in Sicherheit zu bringen
  rationale: Der substantivierte Infinitiv drückt den Zweck aus. Im militärischen Fluchtzusammenhang geht es um Rettung beziehungsweise Schutz, nicht ausdrücklich um Heil im theologischen Sinn.
- source_word: ἐνεπύρισεν
  choice: steckte … in Brand
  rationale: Das Verb bezeichnet das Anzünden oder Inbrandsetzen. Die Formulierung behauptet nicht über den Wortlaut hinaus, dass alles vollständig niederbrannte.
- source_word: τὰς πόλεις τὰς κύκλῳ
  choice: die umliegenden Städte
  rationale: Die Wendung bezeichnet die Städte in der Umgebung von Azotus und wird so knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bedeutung von σωθῆναι im Zusammenhang einer militärischen Flucht
  choice: körperliche Rettung beziehungsweise Sicherheit
  alternative: Heil oder Rettung im geistlichen Sinn
  rationale: Der unmittelbare Erzählzusammenhang beschreibt Menschen, die in einem heidnischen Heiligtum Zuflucht suchen. Daher ist konkrete Sicherheit gemeint, ohne eine weitergehende theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Beginn bleibt als Satzfragment erhalten, weil auch der gelieferte griechische Ausgangstext mit dem Ziel der vorausgehenden Bewegung einsetzt. „Jonatan“ folgt der gebräuchlichen deutschen Namensform.
