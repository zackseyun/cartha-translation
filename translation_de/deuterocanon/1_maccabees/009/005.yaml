  text: Judas war bei Alasa gelagert, und dreitausend ausgewählte Männer waren bei ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεβεβληκὼς
  choice: hatte … sein Lager aufgeschlagen
  rationale: Das Perfektpartizip von παρεμβάλλω bezeichnet im militärischen Zusammenhang den bestehenden Zustand nach dem Aufschlagen eines Lagers. Die deutsche Formulierung ist natürlich und bewahrt zugleich den resultativen Aspekt.
- source_word: ἐν Ἀλασά
  choice: bei Alasa
  rationale: Bei einem Ortsnamen und einem Heerlager bezeichnet ἐν den Standort. „Bei Alasa“ ist im Deutschen idiomatisch und legt nicht unnötig fest, dass sich das Lager innerhalb einer Siedlung befand.
- source_word: τρισχίλιοι
  choice: dreitausend
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: ἄνδρες
  choice: Männer
  rationale: Das griechische Wort bezeichnet ausdrücklich Männer. Der militärische Zusammenhang ist klar, doch „Soldaten“ würde eine nicht ausdrücklich genannte Spezifizierung eintragen.
- source_word: ἐκλεκτοὶ
  choice: ausgewählte
  rationale: ἐκλεκτοί bezeichnet hier eigens ausgewählte beziehungsweise erlesene Männer. „Ausgewählte“ ist präzise und in diesem militärischen Zusammenhang natürlich.
- source_word: μετʼ αὐτοῦ
  choice: waren bei ihm
  rationale: Die Wendung bezeichnet schlicht ihre Anwesenheit bei Judas und vermeidet die zusätzliche Aussage, sie hätten ihn gerade begleitet.
