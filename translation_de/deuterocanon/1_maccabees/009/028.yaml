lexical_decisions:
- source_word: ἠθροίσθησαν
  choice: kamen … zusammen
  rationale: Der Aorist Passiv von ἀθροίζω wird hier intransitiv beziehungsweise medial gebraucht. „kamen … zusammen“ gibt den Vorgang natürlich und präzise wieder.
- source_word: πάντες
  choice: alle
  rationale: Entspricht knapp und unmittelbar dem umfassenden Sinn des griechischen πάντες.
- source_word: οἱ φίλοι
  choice: Freunde
  rationale: φίλοι bedeutet wörtlich „Freunde“. Ein möglicher Beiklang von Gefährten oder Anhängern wird nicht interpretierend in den Haupttext aufgenommen.
- source_word: Ἰούδου
  choice: des Judas
  rationale: Der Genitiv bezeichnet die Zugehörigkeit beziehungsweise persönliche Verbindung zu Judas.
- source_word: εἶπον
  choice: sagten
  rationale: Natürliche erzählerische Wiedergabe des Aorists von λέγω.
- source_word: τῷ Ἰωναθάν
  choice: zu Jonatan
  rationale: Der Dativ bezeichnet den Adressaten. „Jonatan“ ist die im modernen deutschen Bibelgebrauch übliche Namensform.
