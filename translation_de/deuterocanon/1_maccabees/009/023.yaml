base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/023.yaml
  text: And it happened that after the death of Judas[a], the lawless emerged in all the territories of Israel[b], and all those who worked unrighteousness sprang up.
translation:
  language: de
  text: 'Und nach dem Tod des Judas geschah es: In allen Gebieten Israels kamen die Gesetzlosen hervor, und alle, die Unrecht taten, schossen empor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich für „schossen empor“: „gingen auf“; das griechische Verb wird auch vom Aufgehen der Sonne oder vom Aufsprießen einer Pflanze gebraucht.'
    reason: Bildhafte Bedeutung des griechischen Verbs ἀνέτειλαν.
lexical_decisions:
- source_word: ἐγένετο
  choice: es geschah
  rationale: Die geläufige Erzählformel wird würdig und knapp wiedergegeben, ohne die Aussage unnötig zu erweitern.
- source_word: τελευτὴν
  choice: Tod
  rationale: Im Zusammenhang bezeichnet das Wort eindeutig den Tod des Judas, nicht nur ein abstraktes Ende.
- source_word: ἐξέκυψαν
  choice: kamen ... hervor
  rationale: Die Wiedergabe bewahrt den Gedanken, dass die Gesetzlosen nun offen hervortraten.
- source_word: οἱ ἄνομοι
  choice: die Gesetzlosen
  rationale: Das substantivierte Adjektiv bleibt erhalten und wahrt den Bezug auf Gesetzlosigkeit, ohne das im Deutschen unnötige Wort „Männer“ hinzuzufügen.
- source_word: ὁρίοις
  choice: Gebieten
  rationale: Im Plural meint der Ausdruck hier die Landesteile beziehungsweise Regionen Israels, nicht lediglich Grenzlinien.
- source_word: ἀνέτειλαν
  choice: schossen empor
  rationale: Die bildhafte Sprache des Aufgehens oder Aufsprießens bleibt erhalten und bildet einen bewussten Kontrast zu „kamen hervor“.
- source_word: οἱ ἐργαζόμενοι τὴν ἀδικίαν
  choice: alle, die Unrecht taten
  rationale: Natürliches modernes Deutsch, das sowohl die handelnden Personen als auch ihre fortgesetzte ungerechte Tätigkeit ausdrückt.
- source_word: ἀδικίαν
  choice: Unrecht
  rationale: „Unrecht“ kann sowohl moralische Verkehrtheit als auch Ungerechtigkeit bezeichnen und bewahrt damit die Bedeutungsbreite von ἀδικία.
theological_decisions:
- issue: Moralisch und bundestheologisch geprägte Bezeichnung οἱ ἄνομοι
  choice: die Gesetzlosen
  alternative: die Frevler / die Bösen
  rationale: „Gesetzlosen“ erhält den ausdrücklichen Bezug zum Gesetz; allgemeinere Wertungen würden diesen Zusammenhang abschwächen.
- issue: Bedeutungsbreite von ἀδικία
  choice: Unrecht
  alternative: Ungerechtigkeit
  rationale: „Unrecht“ wahrt die mögliche allgemeine moralische Bedeutung, ohne die Lesart auf gesellschaftliche oder richterliche Ungerechtigkeit einzuengen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Parallelität der beiden Satzhälften und die lebhafte Bildsprache des griechischen Textes werden bewahrt.
