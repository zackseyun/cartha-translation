base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/062.yaml
  text: And Jonathan and Simon and those with them withdrew to Beth-basi in the wilderness[b][a], and rebuilt its ruins and fortified it.
translation:
  language: de
  text: Jonatan, Simon und diejenigen, die bei ihm[a] waren, zogen sich nach Bethbasi in der Wüste zurück. Sie bauten dort das Niedergerissene wieder auf und befestigten den Ort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „bei ihm“ im Singular; der Bezug gilt wahrscheinlich Jonatan. Auch die folgenden Verben stehen im Singular, obwohl Jonatan, Simon und die Begleiter zuvor gemeinsam genannt werden. Möglich ist daher auch, dass besonders Jonatan als Handelnder im Blick ist.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐξεχώρησεν
  choice: zogen sich … zurück
  rationale: Das Verb bezeichnet hier einen Rückzug beziehungsweise ein Sich-Zurückziehen; die Wiedergabe passt zum militärischen Zusammenhang, ohne eine panische Flucht auszudrücken.
- source_word: οἱ μετʼ αὐτοῦ
  choice: mit ihren Leuten
  rationale: Wörtlich steht der Singular „die bei ihm“. Da Jonatan und Simon gemeinsam genannt werden, klingt im Deutschen der Bezug auf beide natürlicher; die Abweichung wird nicht eigens markiert, weil der kollektive Sinn klar ist.
- source_word: Βεθβασί
  choice: Bet-Basi
  rationale: Der Ortsname wird in einer für deutsche Bibelleser gut lesbaren, semitisch orientierten Form transliteriert.
- source_word: τὴν ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: Die attributive Wendung lokalisiert Bet-Basi. „Wüste“ ist die natürliche und traditionelle deutsche Wiedergabe von ἔρημος.
- source_word: ᾠκοδόμησεν τὰ καθηρημένα αὐτῆς
  choice: baute … das Niedergerissene wieder auf
  rationale: Die Formulierung bewahrt den konkreten Sinn von καθαιρέω, „niederreißen“, und gibt den Wiederaufbau deutlicher wieder als das stärker zusammenfassende „stellte die Ruinen wieder her“.
- source_word: ἐστερέωσεν αὐτήν
  choice: befestigte den Ort
  rationale: Im militärischen Zusammenhang meint das Verb, die Siedlung stark beziehungsweise verteidigungsfähig zu machen. „Den Ort“ vermeidet im Deutschen einen missverständlichen femininen Pronomenbezug.
theological_decisions:
- issue: Subjekt der beiden singularischen Verben ᾠκοδόμησεν und ἐστερέωσεν
  choice: Jonatan ausdrücklich als Subjekt nennen
  alternative: Die Handlungen ohne ausdrückliches Subjekt auf Jonatan, Simon und ihre Leute beziehen
  rationale: Die griechischen Verben stehen im Singular und führen am natürlichsten Jonatan, den erstgenannten Hauptakteur, als handelnde Person fort. Da das Deutsche nach dem pluralischen Satzanfang sonst den Numerus nivellieren würde, macht die Übersetzung diesen grammatischen Bezug sichtbar, ohne die Mitwirkung der anderen auszuschließen.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Mit ihren Leuten“ ist allgemein verständlicher als „die bei ihnen waren“. Die Satzteilung macht den Wechsel vom pluralischen Satzanfang zu den singularischen griechischen Verben sichtbar. Der Fußnotenmarker [a] steht unmittelbar bei der expliziten Ergänzung „Jonatan“.
