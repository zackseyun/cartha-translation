    rationale: Die griechischen Verben stehen zwar im Singular, doch nach „Jonatan und Simon und die bei ihm waren“ bleibt die syntaktisch auffällige Konstruktion erklärungsbedürftig. Der Text nennt bei den Verben kein ausdrückliches Subjekt. Die deutsche Fassung sollte nicht im Haupttext entscheiden, dass ausschließlich Jonatan handelte.
  - severity: medium
    issue: „mit ihren Leuten“ verdeckt das singuläre αὐτοῦ.
    rationale: Der griechische Text lautet wörtlich „die bei ihm waren“. Auch wenn ein pluralischer Bezug im Deutschen glatter klingt, sollte der Singular samt seines nicht völlig eindeutigen Bezugs durch den Wortlaut und eine Anmerkung erkennbar bleiben.
  - severity: low
