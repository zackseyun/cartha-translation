- from: Jonatan und Simon zogen sich mit ihren Leuten nach Bet-Basi in der Wüste zurück. Dort baute Jonatan[a] das Niedergerissene wieder auf und befestigte den Ort.
  to: Jonatan, Simon und diejenigen, die bei ihm[a] waren, zogen sich nach Bethbasi in der Wüste zurück. Sie bauten dort das Niedergerissene wieder auf und befestigten den Ort.
  rationale: Die Revision bewahrt das singuläre „ihm“ und erläutert sowohl dessen Bezug als auch die ungewöhnlichen singularischen Verben. Da eine deutsche Verbform nach dem mehrgliedrigen Subjekt zwingend im Plural stehen muss, vermeidet „sie“ eine ungesicherte alleinige Zuschreibung an Jonatan; die Fußnote erhält die griechische Ambiguität. Die Namensform wurde auf „Bethbasi“ vereinheitlicht.
