  naturalness: Die Sprache ist klar und modern. „Das Niedergerissene wieder aufbauen“ und „den Ort befestigen“ sind idiomatisch und dem erzählenden Register angemessen. „Bethbasi“ entspricht der im Deutschen üblichen biblischen Namensform besser als „Bet-Basi“.
  terminology: „Wüste“ gibt ἐρήμῳ angemessen wieder. „Befestigen“ trifft ἐστερέωσεν im militärisch-siedlungsgeschichtlichen Kontext. „Bethbasi“ wahrt die etablierte deutsche Form des Ortsnamens.
