  text: And Simon and those with him went out from the city and set fire to the siege engines[a].
translation:
  language: de
  text: Simon und seine Begleiter zogen aus der Stadt hinaus und setzten die Belagerungsmaschinen[a] in Brand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Maschinen« oder »die Vorrichtungen«; im Zusammenhang sind militärische Geräte gemeint, die beim Angriff auf die Stadt eingesetzt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μετʼ αὐτοῦ
  choice: seine Begleiter
  rationale: Die substantivierte Wendung bezeichnet allgemein die Menschen, die bei Simon waren. »Seine Begleiter« ist natürliches Deutsch und legt ihren militärischen Status nicht enger fest als der griechische Text.
- source_word: ἐξῆλθον ἐκ τῆς πόλεως
  choice: zogen aus der Stadt hinaus
  rationale: Die Formulierung gibt sowohl die Bewegung als auch den Ausgangspunkt ausdrücklich wieder. »Zogen« passt zum erzählenden und militärischen Zusammenhang, ohne dem Verb selbst einen zusätzlichen technischen Sinn aufzudrängen.
- source_word: ἐνεπύρισαν
  choice: setzten … in Brand
  rationale: Das Verb bezeichnet das Entzünden beziehungsweise Inbrandsetzen. Die deutsche Wendung ist klar, idiomatisch und bewahrt den aktiven Vorgang.
- source_word: τὰς μηχανάς
  choice: die Belagerungsmaschinen
  rationale: μηχαναί bezeichnet hier im Zusammenhang des Angriffs militärische Vorrichtungen. »Belagerungsmaschinen« vermittelt diesen historischen Sinn heutigen Lesern deutlicher als das allgemeinere »Maschinen«.
