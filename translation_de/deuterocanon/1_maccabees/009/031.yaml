  text: And Jonathan took up the leadership at that time, and arose in place of Judas his brother.
translation:
  language: de
  text: Damals übernahm Jonatan die Führung und trat an die Stelle seines Bruders Judas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: übernahm
  rationale: Das Medium von ἐπιδέχομαι bezeichnet hier das Annehmen beziehungsweise Übernehmen einer Aufgabe oder Stellung. „Übernahm“ ist im modernen Deutschen natürlich und passt zum Führungswechsel.
- source_word: ἡγεσίαν
  choice: die Führung
  rationale: ἡγεσία bezeichnet Führung oder Oberbefehl. „Die Führung“ wahrt die Breite des Begriffs und vermeidet die stärkere Vorstellung einer monarchischen Herrschaft.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: Damals
  rationale: Die Wendung bedeutet „zu jener Zeit“. „Damals“ gibt sie knapp und idiomatisch wieder.
- source_word: ἀνέστη
  choice: trat
  rationale: ἀνέστη bedeutet wörtlich „stand auf/erhob sich“, kann hier aber das Hervortreten als Nachfolger bezeichnen. Zusammen mit „an die Stelle“ ergibt „trat“ eine natürliche deutsche Wiedergabe, ohne einen zusätzlichen Aufstand anzudeuten.
- source_word: ἀντί
  choice: an die Stelle
  rationale: ἀντί drückt hier Stellvertretung beziehungsweise Nachfolge aus. „An die Stelle“ bezeichnet den Wechsel in der Führungsrolle klar und ohne feindlichen Gegensatz.
- source_word: Ἰούδου
  choice: Judas
  rationale: „Judas“ ist die im Kontext von 1 Makkabäer geläufige deutsche Wiedergabe der griechischen Namensform Ἰούδας.
