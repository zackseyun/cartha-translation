  verdict: revise
  source_fidelity: Der griechische Text besagt, dass die Söhne Jambris aus Medaba hervorkamen, Johannes und alles, was er hatte, ergriffen und fortgingen, wobei das Objekt des Partizips ἔχοντες aus dem vorangehenden Satz zu ergänzen ist. Die Pluralaufnahme in „mit ihnen“ kann daher sowohl Johannes als auch seinen Besitz bezeichnen und sollte nicht zu einem Singular eingeengt werden.
  naturalness: „Aus Medaba auszogen“ ist zwar möglich, kann im heutigen Deutsch aber leicht einen dauerhaften Auszug oder Aufbruch aus der Stadt nahelegen. „Kamen aus Medaba“ gibt die Bewegung natürlich wieder. „Jemanden und Besitz in ihre Gewalt bringen“ ist verständlich, schwächt aber das unmittelbare, gewaltsame Ergreifen von συνέλαβον ab; „ergriffen“ ist hier knapper und quellennäher.
  terminology: „Söhne Jambris“, „Medaba“ und „Johannes“ sind angemessene, registergerechte Namensformen. Es gibt keine theologischen Terminologiefragen.
