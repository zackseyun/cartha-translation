base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/036.yaml
  text: And the sons of Jambri came out from Medaba[a], and they seized John and everything he had, and went away with them.
translation:
  language: de
  text: Die Söhne Jambris kamen aus Medaba, ergriffen Johannes und alles, was er besaß, und gingen mit ihnen fort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und gingen fort, wobei sie ihn und seinen ganzen Besitz mitnahmen.“ Im Griechischen steht wörtlich „und sie gingen weg, habend“; das nicht ausdrücklich wiederholte Objekt bezieht sich auf Johannes und alles, was er besaß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰαμβρεὶ
  choice: die Söhne Jambris
  rationale: Die wörtliche Familien- beziehungsweise Clanbezeichnung bleibt erhalten; der griechische Eigenname wird als „Jambri“ wiedergegeben und im Deutschen in den Genitiv gesetzt.
- source_word: ἐκ Μηδαβά
  choice: aus Medaba
  rationale: ἐκ bezeichnet die Bewegung aus einem Ort heraus; „aus Medaba“ ist im Deutschen natürlich und genau.
- source_word: συνέλαβον
  choice: brachten … in ihre Gewalt
  rationale: Die Formulierung gibt das feindliche Ergreifen beziehungsweise Inbesitznehmen wieder und kann, wie im Griechischen, sowohl Johannes als auch seinen Besitz umfassen, ohne einen förmlichen Rechtsakt anzudeuten.
- source_word: Ἰωάνην
  choice: Johannes
  rationale: „Johannes“ ist die im Deutschen übliche Wiedergabe der griechischen Namensform Ἰωάνης; eine Rückübertragung zu einer vermuteten semitischen Form wird vermieden.
- source_word: πάντα ὅσα εἶχεν
  choice: alles, was er besaß
  rationale: Die Wendung bewahrt die umfassende Bedeutung von πάντα und gibt den Relativsatz in natürlichem, würdigem Deutsch wieder.
- source_word: ἀπῆλθον ἔχοντες
  choice: zogen mit ihnen davon
  rationale: Das knappe Partizip ἔχοντες hat kein ausdrücklich wiederholtes Objekt und verweist auf Johannes und alles, was er besaß. Das pluralische „ihnen“ erhält diesen Rückbezug, während die Fußnote die syntaktische Kürze offenlegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Brachte … in ihre Gewalt“ vermeidet die unnatürliche Verbindung, Johannes und Besitz gleichermaßen zu „ergreifen“, und wahrt dennoch die gemeinsame Objektkonstruktion des Griechischen. Die leicht ungewöhnliche Mehrzahl „mit ihnen“ bewahrt den Rückbezug auf Person und Besitz und wird durch die Fußnote erläutert.
