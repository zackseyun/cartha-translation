base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/029.yaml
  text: Since your brother Judas has died[a], and there is no man like him to go out against the enemies and Bacchides, and those who hate our nation,
translation:
  language: de
  text: Seit dein Bruder Judas gestorben ist, gibt es keinen Mann wie ihn, der gegen die Feinde, gegen Bakchides und gegen jene ausziehen könnte, die unser Volk hassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet der letzte Ausdruck: „und unter denen, die unser Volk hassen“. Das griechische „unter“ ist in diesem Satz sprachlich auffällig; dem Zusammenhang nach ist wahrscheinlich eine weitere Gruppe von Gegnern gemeint.'
    reason: Die ungewöhnliche griechische Konstruktion mit ἐν wird nicht stillschweigend geglättet; die Hauptübersetzung gibt den im Kontext wahrscheinlichen Sinn wieder.
lexical_decisions:
- source_word: Ἀφʼ οὗ
  choice: Seit
  rationale: Die Wendung bezeichnet den seit Judas’ Tod bestehenden Zustand; „seit“ gibt den zeitlichen Zusammenhang knapp und natürlich wieder.
- source_word: ὁ ἀδελφός σου Ἰούδας
  choice: dein Bruder Judas
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Anrede und des Eigennamens.
- source_word: τετελεύτηκεν
  choice: gestorben ist
  rationale: Das Perfekt bezeichnet den eingetretenen Tod mit fortdauernder Auswirkung. Die direkte Formulierung vermeidet einen nicht geforderten Euphemismus.
- source_word: ἀνὴρ ὅμοιος αὐτῷ
  choice: kein Mann wie er
  rationale: Bewahrt sowohl das ausdrücklich männliche Substantiv ἀνήρ als auch den Vergleich mit Judas.
- source_word: ἐξελθεῖν πρὸς τοὺς ἐχθρούς
  choice: gegen die Feinde … ausziehen könnte
  rationale: ἐξελθεῖν hat im Zusammenhang militärischen Sinn. „Ausziehen“ wahrt das Bild, während „könnte“ die Fähigkeit bzw. Eignung des gesuchten Mannes im Deutschen idiomatisch ausdrückt.
- source_word: Βακχίδην
  choice: Bakchides
  rationale: Übliche deutschsprachige Transkription des griechischen Eigennamens; die feindliche Beziehung wird aus der koordinierten Konstruktion erschlossen.
- source_word: ἐν τοῖς ἐχθαίνουσιν τοῦ ἔθνους ἡμῶν
  choice: gegen die, die unser Volk hassen
  rationale: Das überlieferte ἐν („in/unter“) ist in dieser Konstruktion auffällig. Die Wiedergabe folgt dem im Zusammenhang naheliegenden Sinn einer weiteren feindlichen Gruppe, kennzeichnet die Schwierigkeit jedoch in einer Fußnote.
- source_word: τοῦ ἔθνους ἡμῶν
  choice: unser Volk
  rationale: ἔθνος bezeichnet hier das jüdische Gemeinwesen als geschichtliche und politische Gemeinschaft. „Volk“ ist im Deutschen natürlicher und weniger modern-staatlich als „Nation“.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von ἀνήρ
  choice: Mann
  alternative: jemand
  rationale: Der griechische Text gebraucht ausdrücklich ἀνήρ; die Übersetzung bewahrt diese Bezeichnung, ohne sie zu verallgemeinern.
- issue: Wiedergabe von ἔθνος ἡμῶν
  choice: unser Volk
  alternative: unsere Nation
  rationale: Im Kontext von 1 Makkabäer ist die jüdische Gemeinschaft als politisch-religiöses Volk gemeint. „Volk“ erhält diese Breite, ohne den neuzeitlichen Nationalstaatsbegriff aufzurufen.
- issue: Beziehung der letzten koordinierten Gruppe zum Ausziehen
  choice: als weiteres feindliches Gegenüber
  alternative: „unter denen, die unser Volk hassen“
  rationale: Der Zusammenhang legt eine Aufzählung der Gegner nahe, doch das überlieferte ἐν bleibt sprachlich auffällig. Die Hauptübersetzung gibt den wahrscheinlichen Sinn wieder; die Fußnote bewahrt die textliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ausziehen“ hält den militärischen Ton aufrecht, ohne altertümlich zu wirken. Die Wiederholung von „gegen“ macht die gegnerischen Gruppen verständlich; die offene Satzentwicklung des griechischen Verses wird als vollständiger deutscher Aussagesatz gestaltet.
