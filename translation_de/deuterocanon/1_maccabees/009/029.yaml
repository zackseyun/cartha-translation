  source_fidelity: Die Übersetzung gibt den zeitlichen Anschluss von Ἀφʼ οὗ, Judas’ Tod, das Fehlen eines vergleichbaren Mannes sowie den militärischen Sinn von ἐξελθεῖν zutreffend wieder. Die auffällige Präposition ἐν vor „denen, die unser Volk hassen“ wird mit einer kontextgemäßen Deutung als weiterer Gegnergruppe wiedergegeben und sinnvoll dokumentiert. Diese Deutung sollte wegen der syntaktischen Schwierigkeit weiterhin als wahrscheinlich, nicht als sicher, gekennzeichnet bleiben.
  naturalness: Der Entwurf ist verständlich, doch „ist kein Mann wie er da“ klingt weniger idiomatisch als „gibt es keinen Mann wie ihn“. Eine parallele Wiederholung von „gegen“ vor Bakchides erhöht im Deutschen die Klarheit der gegnerischen Aufzählung, ohne den Sinn zu verändern.
  terminology: „Judas“, „Bakchides“, „Mann“, „ausziehen“ und „unser Volk“ sind im gegebenen Kontext angemessen. „Volk“ gibt ἔθνος natürlich wieder, ohne einen modernen staatsrechtlichen Nationsbegriff zu erzwingen.
