  yaml_path: translation/deuterocanon/1_maccabees/009/012.yaml
  text: But Bacchides was on the right wing[a], and the phalanx came near from both sides, and they were sounding the trumpets[b], and those with Judas also sounded the trumpets, they too.
translation:
  language: de
  text: Bacchides aber befand sich auf dem rechten Flügel[a], und die Phalanx rückte von beiden Seiten heran[b], und man blies die Trompeten; auch die bei Judas bliesen ihrerseits die Trompeten.
  philosophy: optimal-equivalence
  footnotes:
