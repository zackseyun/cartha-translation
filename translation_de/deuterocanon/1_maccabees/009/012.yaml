  - marker: b
    text: 'Oder wörtlicher: »aus den beiden Teilen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βακχίδης
  choice: Bacchides
  rationale: Der Personenname wird entsprechend der etablierten deutschsprachigen Form transliteriert.
- source_word: ἐν τῷ δεξιᾷ κέρατι
  choice: auf dem rechten Flügel
  rationale: κέρας bedeutet wörtlich „Horn“, bezeichnet hier aber als militärischer Ausdruck den Flügel einer Heeresaufstellung.
- source_word: ἤγγισεν ἡ φάλαγξ
  choice: Die Phalanx rückte … heran
  rationale: „Heranrücken“ gibt die Annäherung im militärischen Zusammenhang natürlich wieder; „Phalanx“ bewahrt den konkreten militärischen Ausdruck.
- source_word: ἐκ τῶν δύο μερῶν
  choice: von beiden Seiten
  rationale: Die Formulierung gibt die räumliche Bewegung aus zwei Richtungen wieder, ohne genauer festzulegen, ob zwei Flanken oder zwei Abteilungen gemeint sind.
- source_word: ἐφώνουν ταῖς σάλπιγξιν
  choice: sie ließen die Trompeten erschallen
  rationale: Die Wendung bildet das Hervorbringen von Schall mit den Trompeten ab; die imperfektive Form wird durch die durative Ausdrucksweise gegenüber dem folgenden Aorist erkennbar gehalten.
- source_word: οἱ παρὰ Ἰούδαν
  choice: die Männer bei Judas
  rationale: Die Formulierung bezeichnet die bei Judas befindlichen beziehungsweise zu ihm gehörenden Kämpfer, ohne eine engere organisatorische Bezeichnung einzutragen.
- source_word: ἐσάλπισαν καὶ αὐτοὶ ταῖς σάλπιγξιν
  choice: auch … stießen ihrerseits in die Trompeten
  rationale: Das spezifische Verb für das Trompetenblasen und die emphatische Rückbeziehung αὐτοί werden mit „auch“ und „ihrerseits“ wiedergegeben.
