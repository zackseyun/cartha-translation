revisions:
- from: Bacchides aber stand auf dem rechten Flügel[a]. Die Phalanx rückte von beiden Seiten heran[b], und sie ließen die Trompeten erschallen; auch die Männer bei Judas stießen ihrerseits in die Trompeten.
  to: Bacchides aber befand sich auf dem rechten Flügel[a], und die Phalanx rückte von beiden Seiten heran[b], und man blies die Trompeten; auch die bei Judas bliesen ihrerseits die Trompeten.
  rationale: Die Revision gibt die bloße Ortsangabe bei Bacchides mit „befand sich“ wieder, beseitigt den unklaren Bezug des pluralischen Pronomens beim ersten Trompetensignal durch das unpersönliche „man“ und formuliert Judas’ Begleiter sowie das Trompetenblasen idiomatischer. „ihrerseits“ erhält die hervorgehobene Erwiderung in καὶ αὐτοί. Die alternative Fußnote zu ἐκ τῶν δύο μερῶν wurde näher am griechischen Wortlaut formuliert.
