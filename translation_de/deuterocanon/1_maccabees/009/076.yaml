  text: And those from the city[a], being afraid, opened up, and Jonathan gained control of Joppa. And Apollonius heard[b], and
translation:
  language: de
  text: Da bekamen die Leute aus der Stadt Angst und öffneten[a], und Jonatan brachte Joppe unter seine Herrschaft. Apollonius hörte, und[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen bleibt unausgesprochen, was sie öffneten; dem Zusammenhang nach sind wahrscheinlich die Stadt oder ihre Tore gemeint.
    reason: lexical_alternative
  - marker: b
    text: Der Vers endet hier mit »und«, weil der an dieser Stelle vorliegende griechische Text unvollständig abbricht.
    reason: textual_variant
lexical_decisions:
- source_word: φοβηθέντες
  choice: bekamen ... Angst
  rationale: Das aoristische Partizip bezeichnet die Furcht, die zum anschließenden Handeln führte. Die deutsche Formulierung ist natürlich und gibt den situativen beziehungsweise kausalen Zusammenhang wieder.
- source_word: ἤνοιξαν
  choice: öffneten
  rationale: Im Griechischen fehlt ein ausdrückliches Objekt. Daher ergänzt der Haupttext weder »die Tore« noch »die Stadt«, sondern bewahrt die Ellipse.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: die Leute aus der Stadt
  rationale: Die substantivierte Wendung bezeichnet Personen, die zur Stadt gehören oder sich dort befinden. »Leute« bleibt geschlechtsneutral und ist im modernen Deutsch verständlich.
- source_word: ἐκυρίευσεν
  choice: brachte ... unter seine Herrschaft
  rationale: κυριεύω bezeichnet das Erlangen von Herrschaft oder Kontrolle. Die Wendung passt zum militärisch-politischen Zusammenhang, ohne den Vorgang enger als bloße Eroberung festzulegen.
- source_word: Ἰόππης
  choice: Joppe
  rationale: »Joppe« ist die im Deutschen gebräuchliche biblische Form des Ortsnamens Ἰόππη.
- source_word: ἤκουσεν
  choice: hörte davon
  rationale: ἀκούω bedeutet grundsätzlich »hören«. Das im Deutschen notwendige »davon« verweist auf das zuvor berichtete Geschehen, ohne zusätzliche Informationen einzuführen.
