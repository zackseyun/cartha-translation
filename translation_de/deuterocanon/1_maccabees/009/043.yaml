base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/043.yaml
  text: And Bacchides heard[a], and on the day of the Sabbaths he came as far as the banks of the Jordan with a great force.
translation:
  language: de
  text: Und Bakchides hörte davon; am Sabbat[a] kam er mit einer großen Streitmacht bis an die Ufer des Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Tag der Sabbate“; dies ist im jüdischen Griechisch eine feste Wendung für den Sabbattag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte davon
  rationale: Das objektlos gebrauchte ἀκούω bezeichnet hier das Vernehmen einer Nachricht. „Hörte davon“ ist im Deutschen natürlich und lässt den aus dem Zusammenhang zu erschließenden Inhalt unausgesprochen.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: am Sabbat
  rationale: Die wörtlich plurale Wendung ist im jüdischen Griechisch eine feste Bezeichnung für den Sabbattag. „Am Sabbat“ gibt den Sinn in heutigem Deutsch klar wieder; die Form des griechischen Ausdrucks wird in der Fußnote dokumentiert.
- source_word: ἕως τῶν κρηπῖδων τοῦ Ἰορδάνου
  choice: bis an die Ufer des Jordan
  rationale: κρηπίς kann einen Rand, eine Einfassung oder ein Ufer bezeichnen. Im geografischen Zusammenhang sind die Ufer des Jordan gemeint.
- source_word: ἐν δυνάμει πολλῇ
  choice: mit einer großen Streitmacht
  rationale: δύναμις bezeichnet hier im militärischen Erzählzusammenhang eine starke bewaffnete Truppe. „Streitmacht“ bewahrt diesen Sinn, ohne ausdrücklich ein reguläres Heer vorauszusetzen.
- source_word: Βακχίδης
  choice: Bakchides
  rationale: Der griechische Personenname wird in einer im Deutschen gut lesbaren, quellennahen Form transliteriert.
