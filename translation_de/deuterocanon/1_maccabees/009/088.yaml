  yaml_path: translation/deuterocanon/1_maccabees/009/088.yaml
  text: And it happened that when Alexander the king heard these words[a], he continued to honor Jonathan, and he sent him a clasp.
translation:
  language: de
  text: Und als König Alexander diese Worte hörte, ehrte er Jonatan weiterhin und sandte ihm eine Spange[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Brosche“ oder „eine Schnalle“; das griechische Wort bezeichnet einen schmückenden Gegenstand zum Befestigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Und als
  rationale: Die griechische Erzählformel leitet eine neue Entwicklung ein. „Und als“ gibt diese Funktion in natürlichem modernem Deutsch wieder, ohne die Wendung unnötig schwerfällig nachzubilden.
- source_word: ἤκουσεν
  choice: hörte
  rationale: Das einfache Hörverb entspricht dem griechischen Ausdruck und passt zum Empfang der berichteten Worte.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Die Wiedergabe bleibt nahe am mehrdeutigen λόγοι; auch „diese Botschaft“ oder „diese Angelegenheiten“ wären kontextuell möglich.
- source_word: προσέθετο δοξάσαι
  choice: ehrte … noch mehr
  rationale: προστίθημι mit Infinitiv bezeichnet hier ein Hinzufügen oder Fortfahren. Im königlich-politischen Zusammenhang bedeutet δοξάζω, jemandem Ehre zu erweisen; „noch mehr“ bewahrt den steigernden Sinn.
- source_word: πόρπην
  choice: eine Spange
  rationale: πόρπη bezeichnet einen schmückenden Gegenstand zum Befestigen, etwa eine Gewandspange, Brosche oder Schnalle. „Spange“ ist knapp und legt die genaue Form nicht unnötig fest.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählbewegung des Griechischen bleibt erhalten; der politisch-höfische Sinn von δοξάσαι wird ohne theologische Überfrachtung wiedergegeben.
