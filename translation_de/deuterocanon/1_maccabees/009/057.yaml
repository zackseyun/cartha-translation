  yaml_path: translation/deuterocanon/1_maccabees/009/057.yaml
  text: And Bacchides saw that Alcimus had died, and he returned to the king, and the land of Judah was quiet for two years.
translation:
  language: de
  text: Als Bakchides sah, dass Alkimos gestorben war, kehrte er zum König zurück. Danach hatte das Land Juda zwei Jahre lang Ruhe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: sah
  rationale: Die Grundbedeutung von ὁράω wird beibehalten; mit einem dass-Satz ist „sah, dass“ auch im Deutschen verständlich und lässt die mögliche Bedeutung „erkannte/erfuhr“ offen.
- source_word: ἀπέθανεν
  choice: gestorben war
  rationale: Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass Alkimos’ Tod der Wahrnehmung des Bakchides vorausging.
- source_word: ἀπέστρεψεν
  choice: kehrte ... zurück
  rationale: Dies entspricht der Bewegungsbedeutung „umkehren/zurückkehren“ und verbindet sich idiomatisch mit dem Ziel „zum König“.
- source_word: πρὸς τὸν βασιλέα
  choice: zum König
  rationale: πρός mit Akkusativ bezeichnet hier das Ziel der Rückkehr.
- source_word: ἡσύχασεν
  choice: hatte ... Ruhe
  rationale: Die Wendung gibt den Zustand politischer Ruhe natürlich wieder, ohne den stärkeren Begriff „Frieden“ einzutragen.
- source_word: ἡ γῆ Ἰούδα
  choice: das Land Juda
  rationale: γῆ wird ausdrücklich als „Land“ wiedergegeben; „Juda“ bewahrt die biblisch-territoriale Bezeichnung.
- source_word: ἔτη δύο
  choice: zwei Jahre lang
  rationale: Die deutsche Dauerangabe entspricht dem griechischen Akkusativ der zeitlichen Ausdehnung.
