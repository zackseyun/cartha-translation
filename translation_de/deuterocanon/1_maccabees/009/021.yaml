translation:
  language: de
  text: Wie ist der Held gefallen[a], der Israel rettete!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung greift die biblische Klage „Wie sind die Helden gefallen!“ auf (vgl. 2. Samuel 1,19.25.27).
    reason: cross_reference
lexical_decisions:
- source_word: Πῶς
  choice: Wie
  rationale: Leitet einen klagenden Ausruf ein, keine sachliche Frage. „Wie“ bewahrt die vertraute Form der biblischen Totenklage, ohne ein zusätzliches „Ach“ einzufügen.
- source_word: ἔπεσεν
  choice: ist … gefallen
  rationale: Der Aorist bezeichnet hier den Tod des Helden. Das deutsche Perfekt klingt in diesem unmittelbaren Klageruf natürlich und eindringlich.
- source_word: δυνατός
  choice: der Held
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen mächtigen, tatkräftigen Mann. „Der Held“ wahrt den Singular und den gehobenen Ton, ohne Judas namentlich in den Text einzutragen.
- source_word: σώζων
  choice: der … rettete
  rationale: Das Präsenspartizip beschreibt Judas in seiner fortdauernden beziehungsweise kennzeichnenden Rolle als Retter Israels. Im Deutschen gibt der Relativsatz im Präteritum diese auf sein Wirken vor dem Tod bezogene Aussage natürlich wieder.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Der Eigenname steht als direktes Objekt. Der griechische Artikel wird im Deutschen vor „Israel“ nicht wiedergegeben.
theological_decisions:
- issue: Anklang an die biblische Klageformel
  choice: „Wie ist der Held gefallen“
  alternative: „Wie fiel ein Mächtiger“
  rationale: Die Formulierung bewahrt den wahrscheinlichen Anklang an die Totenklage über gefallene Helden, besonders 2 Samuel 1,19.25.27, und lässt zugleich den Singular des griechischen Textes stehen.
- issue: Zeitlicher Sinn des Präsenspartizips σώζων
  choice: „der Israel rettete“
  alternative: „der Israel rettet“ / „Israels Retter“
  rationale: Das Partizip kennzeichnet das fortdauernde Wirken des nun Gefallenen. Das deutsche Präteritum bezieht dieses Wirken verständlich auf die Zeit vor seinem Tod, ohne daraus einen bloßen Titel zu machen.
translation_notes:
  register: Knapper, würdevoller Klageruf in modernem Standarddeutsch. Das Ausrufezeichen macht die im griechischen Πῶς liegende Klagefunktion deutlich; die Wortwahl bleibt auch für heutige Leser unmittelbar verständlich.
