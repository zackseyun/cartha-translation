lexical_decisions:
- source_word: ὑστήκει
  choice: Es blieb stehen
  rationale: Die Form bezeichnet ein fortdauerndes Stehen beziehungsweise Verharren. Da im vorgelegten griechischen Ausschnitt kein ausdrückliches Subjekt steht, vermeidet die unpersönliche Wiedergabe eine nicht belegte nähere Bestimmung.
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: wie Jonatan befohlen hatte
  rationale: καθώς bezeichnet die Übereinstimmung mit Jonatans Anordnung; das Plusquamperfekt gibt im Deutschen passend wieder, dass der Befehl dem Verharren vorausging.
- source_word: ἐκοπίασαν οἱ ἵπποι αὐτῶν
  choice: ihre Pferde ermüdeten
  rationale: κοπιάω bezeichnet hier das Müdewerden infolge der Anstrengung, ohne zwingend völlige Erschöpfung auszudrücken.
- source_word: ἐξέλυσεν Σίμων τὴν δύναμιν αὐτοῦ
  choice: Da ließ Simon seine Streitmacht ausrücken
  rationale: ἐκλύω beziehungsweise die hier überlieferte Form ἐξέλυσεν hat in Verbindung mit einer militärischen δύναμις den Sinn des Entlassens oder In-Bewegung-Setzens; „ausrücken lassen“ ist im Deutschen idiomatisch und wahrt den militärischen Zusammenhang.
- source_word: συνῆψεν πρὸς
  choice: nahm den Kampf mit … auf
  rationale: συνάπτω mit πρός bezeichnet im militärischen Erzählzusammenhang das Aufnehmen beziehungsweise Beginnen eines Kampfes mit einem Gegner.
- source_word: τὴν
  choice: der
  rationale: Der vorgelegte griechische Text bricht nach dem femininen Akkusativartikel mitten in der Wortgruppe ab. Die deutsche Fassung bleibt deshalb ebenfalls unvollständig; „mit der“ spiegelt das feminine Anschlusswort, ohne das fehlende Substantiv zu ergänzen.
