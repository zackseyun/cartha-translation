base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/045.yaml
  text: For behold[a], the battle is before us and behind us, while the water of the Jordan is on this side and on that, with marsh and forest[b], and there is no place to turn aside.
translation:
  language: de
  text: 'Denn seht: Der Kampf ist vor uns und hinter uns, und das Wasser des Jordan ist auf dieser wie auf jener Seite, dazu Sumpf und Wald; es gibt keinen Weg auszuweichen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es gibt keinen Raum, sich zurückzuziehen“ beziehungsweise „zu entkommen“. Das griechische Wort bedeutet wörtlich „auszuweichen“ oder „abzubiegen“ und bezeichnet hier eine fehlende Ausweichroute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Denn seht
  rationale: „Denn“ gibt das begründende γάρ wieder; „seht“ bewahrt ἰδού als lebendigen Aufmerksamkeitsruf in modernem, würdigem Deutsch.
- source_word: ὁ πόλεμος
  choice: der Kampf
  rationale: Im unmittelbaren taktischen Zusammenhang bezeichnet πόλεμος die bevorstehende Kampfhandlung; „Kampf“ ist hier treffender als das umfassendere „Krieg“.
- source_word: ἐξ ἐναντίας ἡμῶν καὶ ἐξόπισθεν ἡμῶν
  choice: vor uns und hinter uns
  rationale: Die räumliche Gegenüberstellung beschreibt die Bedrängung von vorn und hinten klar und knapp.
- source_word: τὸ ὕδωρ τοῦ Ἰορδάνου
  choice: das Wasser des Jordan
  rationale: Die Formulierung bewahrt den ausdrücklichen Hinweis auf das Wasser als Geländehindernis; im Deutschen ist die traditionelle Form „des Jordan“ natürlich.
- source_word: ἔνθεν καὶ ἔνθεν
  choice: auf dieser wie auf jener Seite
  rationale: Die Wiedergabe erhält die distributive räumliche Aussage des Griechischen und klingt zugleich idiomatisch.
- source_word: ἕλος καὶ δρυμός
  choice: Sumpf und Wald
  rationale: Die beiden Geländeformen werden knapp und konkret wiedergegeben. δρυμός kann je nach Kontext auch ein Dickicht oder Waldgebiet bezeichnen.
- source_word: οὐκ ἔστι τόπος τοῦ ἐκκλῖναι
  choice: es gibt keinen Weg auszuweichen
  rationale: ἐκκλίνω bedeutet wörtlich „ausweichen/abbiegen“. „Keinen Weg“ bringt τόπος im Zusammenhang einer fehlenden Rückzugs- oder Fluchtroute natürlich zum Ausdruck, ohne die Richtung eindeutiger festzulegen als der Ausgangstext.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem erzählerischem Ton. Der Doppelpunkt nach „seht“ bildet den Aufmerksamkeitsruf natürlich ab; die Geländebeschreibung bleibt eng an der griechischen Satzstruktur, ohne unnatürlich zu wirken.
