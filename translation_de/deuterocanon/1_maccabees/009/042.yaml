  yaml_path: translation/deuterocanon/1_maccabees/009/042.yaml
  text: And they avenged the blood of their brother[b][a], and returned to the hill country of the Jordan.
translation:
  language: de
  text: Und sie rächten das Blut ihres Bruders[a] und kehrten in das Bergland am Jordan[b] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie rächten die Rache des Blutes ihres Bruders«; eine nachdrückliche Wendung für Blutrache.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf den Berg des Jordan«. Das griechische Wort kann einen einzelnen Berg oder ein bergiges Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδίκησαν τὴν ἐκδίκησιν αἵματος
  choice: rächten sie das Blut
  rationale: 'Die griechische Verbindung ist wörtlich und nachdrücklich formuliert: »sie rächten die Rache des Blutes«. Die natürliche deutsche Wendung bewahrt den Sinn der Blutrache, ohne die im Deutschen schwer verständliche Wiederholung nachzuahmen.'
- source_word: ἀδελφοῦ αὐτῶν
  choice: ihres Bruders
  rationale: Der Singular bezeichnet seinem gewöhnlichen Wortsinn nach einen bestimmten Bruder; eine Erweiterung zu »Verwandten« ist vom griechischen Text nicht gefordert.
- source_word: ἀπέστρεψαν
  choice: kehrten … zurück
  rationale: Das Verb bezeichnet hier die Rückbewegung in ein zuvor genanntes Gebiet und wird idiomatisch mit »zurückkehren« wiedergegeben.
- source_word: εἰς τὸ ὄρος τοῦ Ἰορδάνου
  choice: in das Bergland am Jordan
  rationale: ὄρος kann sowohl einen einzelnen Berg als auch bergiges Gelände bezeichnen. Im geografischen Erzählzusammenhang ist »Bergland« natürlich; »am Jordan« gibt die örtliche Zuordnung verständlich wieder, ohne einen Besitzsinn nahezulegen.
