base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/074.yaml
  text: When Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem; and Simon his brother met him to help him.
translation:
  language: de
  text: Als Jonatan die Worte des Apollonius hörte, wurde er innerlich aufgewühlt. Er wählte zehntausend Männer aus und zog aus Jerusalem hinaus; sein Bruder Simon traf ihn, um ihm zu helfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „begegnete ihm zu seiner Hilfe“. Die griechische Formulierung nennt ausdrücklich Simons Zweck, Jonatan zu helfen, ohne die nähere Art ihres Zusammentreffens auszuführen.'
    reason: Macht die Grundbedeutung von συνήντησεν und die ausdrückliche Zweckangabe ἐπὶ βοήθειαν αὐτοῦ transparent, ohne ein stärkeres Anschließen an Jonatans Gruppe vorauszusetzen.
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Als … hörte
  rationale: ὡς mit dem Aorist leitet hier einen temporalen Nebensatz ein; „Als … hörte“ gibt die zeitliche Abfolge natürlich wieder.
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: die Worte des Apollonius
  rationale: Die wörtliche Wiedergabe von λόγοι bleibt im Deutschen verständlich und vermeidet eine Festlegung auf „Botschaft“ oder „Aussage“.
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: wurde er innerlich aufgewühlt
  rationale: Die Wendung bezeichnet eine innere, gedanklich-seelische Bewegung. „Innerlich aufgewühlt“ bewahrt die emotionale Offenheit, ohne sie ausdrücklich als Angst oder Zorn zu bestimmen.
- source_word: ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν
  choice: Er wählte zehntausend Männer aus
  rationale: „Männer“ entspricht ἀνδρῶν; der militärische Kontext rechtfertigt nicht, das im Griechischen nicht ausdrücklich stehende „Soldaten“ einzusetzen.
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: zog aus Jerusalem hinaus
  rationale: „Hinausziehen“ ist eine natürliche Wiedergabe der Bewegung aus der Stadt und passt zum militärischen Zusammenhang, ohne einen Kampf hinzuzufügen.
- source_word: συνήντησεν αὐτῷ ἐπὶ βοήθειαν αὐτοῦ
  choice: stieß zu ihm, um ihn zu unterstützen
  rationale: συναντάω bezeichnet das Zusammentreffen; zusammen mit der Zweckangabe ἐπὶ βοήθειαν vermittelt „stieß zu ihm“ hier natürlich, dass Simon sich Jonatan zur Hilfe anschloss.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Das vorangestellte φυγεῖν ist ein syntaktischer Überhang aus dem vorhergehenden Kontext und wurde nicht als Bestandteil dieses Verses wiedergegeben. Die innere Bewegung Jonatans bleibt bewusst hinsichtlich ihres genauen Gefühls offen.
