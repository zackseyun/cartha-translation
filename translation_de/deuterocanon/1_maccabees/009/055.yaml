base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/055.yaml
  text: At that time Alcimus was struck down[a], and his works were hindered; his mouth was stopped up, and he was paralyzed, and he could no longer speak a word or give orders concerning his house.
translation:
  language: de
  text: Zu jener Zeit traf ein Schlag Alkimos, und seine Vorhaben wurden behindert. Sein Mund wurde verschlossen, und er wurde gelähmt; er konnte kein Wort mehr sprechen und keine Anweisungen für sein Hauswesen[a] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Haushalt“, „sein Haus“ oder „seine Angelegenheiten“. Das griechische Wort für „Haus“ (οἶκος) kann auch die Familie und den gesamten häuslichen Verantwortungsbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγη
  choice: traf Alkimos ein Schlag
  rationale: Die unpersönliche Form bewahrt das Bild eines plötzlichen, schweren Getroffenwerdens, ohne eine göttliche Ursache oder eine bestimmte medizinische Diagnose ausdrücklich einzutragen.
- source_word: ἐνεποδίσθη τὰ ἔργα αὐτοῦ
  choice: seine Vorhaben wurden behindert
  rationale: ἔργα bezeichnet hier wahrscheinlich seine laufenden Tätigkeiten oder Unternehmungen; „Vorhaben“ ist im Zusammenhang natürlich, während der Passiv „wurden behindert“ die Aussage des Griechischen wahrt.
- source_word: ἀπεφράγη τὸ στόμα αὐτοῦ
  choice: Sein Mund wurde verschlossen
  rationale: Die konkrete Körpermetapher des griechischen Ausdrucks bleibt erhalten; zugleich klingt die Formulierung im heutigen Deutsch würdig und verständlich.
- source_word: παρελύθη
  choice: er wurde gelähmt
  rationale: παραλύω bezeichnet gewöhnlich eine Lähmung oder schwere körperliche Bewegungsunfähigkeit. Die Wiedergabe passt zur anschließenden Sprech- und Handlungsunfähigkeit.
- source_word: οὐκ ἠδύνατο ἔτι λαλῆσαι λόγον
  choice: er konnte kein Wort mehr sprechen
  rationale: Die deutsche Wendung bildet λαλῆσαι λόγον idiomatisch ab; „mehr“ gibt ἔτι im verneinten Zusammenhang wieder.
- source_word: ἐντείλασθαι
  choice: Anweisungen geben
  rationale: Der Infinitiv bezeichnet das Erteilen von Befehlen oder Weisungen. „Anweisungen geben“ passt zum häuslich-administrativen Zusammenhang, ohne unnötig schroff zu wirken.
- source_word: περὶ τοῦ οἴκου αὐτοῦ
  choice: für sein Hauswesen
  rationale: οἶκος kann Haus, Haushalt, Familie oder den gesamten häuslichen Bereich bezeichnen. „Hauswesen“ lässt diesen weiteren organisatorischen Sinn erkennen; die Fußnote bewahrt die lexikalischen Alternativen.
theological_decisions:
- issue: Art und Ursache von Alkimos’ Leiden
  choice: Als plötzlicher, lähmender Schlag wiedergegeben, ohne dessen Ursache oder medizinische Art festzulegen.
  alternative: Den Vorgang ausdrücklich als göttliches Gericht oder als medizinischen Schlaganfall bezeichnen.
  rationale: Die Reihe griechischer Passivformen nennt in diesem Vers weder Gott als Handelnden noch eine genaue Krankheit. Die Übersetzung bewahrt daher die mögliche Gerichtsdimension, legt sie aber ebenso wenig fest wie eine moderne Diagnose.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze und die wiederholten Passivformen spiegeln die unerbittliche Abfolge des griechischen Berichts, ohne unnatürlich zu wirken. Der Fußnotenmarker steht bei „Hauswesen“, auf das sich die erläuterte Mehrdeutigkeit tatsächlich bezieht.
