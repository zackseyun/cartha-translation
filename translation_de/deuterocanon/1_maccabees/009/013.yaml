  text: And the earth shook from their encampments, and the battle raged from morning until evening.
translation:
  language: de
  text: Und die Erde erbebte von ihren Heerlagern[a], und die Schlacht wurde vom frühen Morgen bis zum Abend geführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Heeren.'
    reason: παρεμβολαί bezeichnet gewöhnlich Lager oder Heerlager, kann aber je nach Zusammenhang auch die dort versammelten Heere meinen.
lexical_decisions:
- source_word: παρεμβολῶν
  choice: Heeren
  rationale: Das griechische Wort kann sowohl ein Heerlager als auch das dort versammelte Heer bezeichnen. Im Zusammenhang mit der erbebenden Erde ist „Heeren“ im Deutschen verständlicher und bewahrt den militärischen Sinn.
- source_word: συνηγμένος
  choice: tobte
  rationale: Wörtlich bezeichnet das Partizip etwas „Zusammengebrachtes“ beziehungsweise eine eröffnete oder verbundene Schlacht. In Verbindung mit der Zeitspanne vom Morgen bis zum Abend gibt „tobte“ den fortdauernden heftigen Kampf natürlich wieder, ohne den Ausgang vorwegzunehmen.
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: vom frühen Morgen bis zum Abend
  rationale: „Früher Morgen“ bildet πρωΐθεν genauer ab als das unmarkierte „Morgen“ und ergibt eine natürliche deutsche Zeitangabe.
