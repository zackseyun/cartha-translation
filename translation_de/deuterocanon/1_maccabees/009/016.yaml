  yaml_path: translation/deuterocanon/1_maccabees/009/016.yaml
  text: And those on the left wing[a], seeing that the right wing had been crushed, turned back at the heels of Judas and those with him[b], from behind.
translation:
  language: de
  text: Als die auf dem linken Flügel[a] sahen, dass der rechte Flügel zerschlagen worden war, machten sie kehrt und setzten Judas und seinen Begleitern von hinten dicht auf den Fersen nach.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „linkes Horn“ und „rechtes Horn“; „Horn“ ist hier eine militärische Bezeichnung für den linken beziehungsweise rechten Flügel eines Heeres.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie wandten sich den Fersen des Judas und seiner Begleiter nach, von hinten.“ Die Wendung bezeichnet eine unmittelbare Verfolgung aus dem Rücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριστερὸν κέρας / δεξιὸν κέρας
  choice: linker Flügel / rechter Flügel
  rationale: κέρας bedeutet wörtlich „Horn“, bezeichnet hier im militärischen Zusammenhang jedoch einen Heeresflügel. „Flügel“ ist im Deutschen die natürliche und genaue militärische Entsprechung.
- source_word: οἱ εἰς τὸ ἀριστερὸν κέρας
  choice: die Soldaten auf dem linken Flügel
  rationale: Die substantivierte Wendung bezeichnet die dort aufgestellten Personen. „Soldaten“ macht den im Schlachtzusammenhang eindeutig vorausgesetzten Bezug verständlich.
- source_word: συνετρίβη
  choice: zerschlagen worden war
  rationale: Das starke Passiv bezeichnet das Zerbrechen oder Zerschlagen des rechten Flügels; die vorzeitige Form gibt wieder, dass dessen Niederlage bereits sichtbar war.
- source_word: ἐπέστρεψαν
  choice: machten sie kehrt
  rationale: Die Form bezeichnet eine Umkehr der Bewegungsrichtung. „Kehrtmachen“ ist im militärischen Zusammenhang natürlich, ohne den Vorgang als Flucht zu deuten.
- source_word: κατὰ πόδας
  choice: dicht auf den Fersen
  rationale: Die Redewendung bezeichnet unmittelbares Folgen beziehungsweise Verfolgen und bewahrt zugleich das anschauliche Bild der Füße.
- source_word: τῶν μετʼ αὐτοῦ
  choice: seinen Begleitern
  rationale: Die Wendung meint die bei Judas befindlichen Personen, ohne ihr Verhältnis genauer festzulegen. „Begleiter“ ist knapp und lässt diese Offenheit bestehen.
- source_word: ἐκ τῶν ὄπισθεν
  choice: von hinten
  rationale: Die Richtungsangabe wird ausdrücklich wiedergegeben und verdeutlicht, dass Judas und seine Begleiter nun aus ihrem Rücken verfolgt wurden.
