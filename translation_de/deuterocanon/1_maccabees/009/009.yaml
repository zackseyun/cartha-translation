base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/009.yaml
  text: But they turned away from him[a], saying, “We certainly cannot do it. Instead, let us save our own lives for now. Let us return with our brothers and fight against them[b], but we are few.”
translation:
  language: de
  text: 'Doch sie redeten ihm davon ab[a] und sagten: »Das können wir auf keinen Fall. Retten wir lieber fürs Erste unser eigenes Leben. Kehren wir mit unseren Brüdern zurück und kämpfen wir gegen sie; wir aber sind nur wenige.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie brachten ihn davon ab«; wörtlicher: »sie wandten ihn zurück«. Die griechische Wendung kann besagen, dass sie Judas von seinem Vorhaben abbringen wollten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν αὐτόν
  choice: sie wandten sich von ihm ab
  rationale: Die Wendung kann eine körperliche Abwendung oder die Zurückweisung seines Vorschlags bezeichnen. Die Übersetzung bewahrt diese Mehrdeutigkeit, ohne eine förmliche Ablehnung festzuschreiben.
- source_word: Οὐ μὴ δυνώμεθα
  choice: Das schaffen wir auf keinen Fall
  rationale: Die verstärkte Verneinung οὐ μή wird in natürlichem Deutsch nachdrücklich wiedergegeben.
- source_word: ἀλλʼ ἢ σώσωμεν τὰς ἑαυτῶν ψυχὰς τὸ νῦν
  choice: Retten wir lieber fürs Erste unser eigenes Leben
  rationale: ἀλλʼ ἢ leitet hier den stattdessen vorgeschlagenen Ausweg ein; ψυχάς bezeichnet im militärischen Zusammenhang das Leben, und τὸ νῦν die gegenwärtige Lage.
- source_word: ἐπιστρέψωμεν μετὰ τῶν ἀδελφῶν ἡμῶν
  choice: Kehren wir mit unseren Brüdern zurück
  rationale: μετά mit Genitiv bedeutet regulär »mit«; »Brüder« wahrt die konkrete maskuline Bezeichnung für die Kampfgefährten beziehungsweise Volksgenossen.
- source_word: πολεμήσωμεν πρὸς αὐτούς
  choice: kämpfen wir gegen sie
  rationale: Die Formulierung gibt den bewaffneten Kampf gegen die Gegner direkt und idiomatisch wieder.
- source_word: ἡμεῖς δὲ ὀλίγοι
  choice: wir aber sind nur wenige
  rationale: Die knappe, elliptische Schlussklausel und das adversative δέ bleiben erhalten; »nur« verdeutlicht idiomatisch die geringe Zahl, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Bedeutung von ψυχάς im Kampfzusammenhang
  choice: Leben
  alternative: Seelen
  rationale: Gemeint ist die Bewahrung vor dem Tod, nicht ausdrücklich eine Aussage über eine immaterielle Seele.
- issue: Wiedergabe von ἀδελφῶν
  choice: Brüder
  alternative: Gefährten / Landsleute
  rationale: Die quellennahe Bezeichnung bleibt stehen und wird nicht unnötig neutralisiert; der Kontext kann Kampfgefährten oder Volksgenossen einschließen.
- issue: Logische Funktion von δέ im Schlusssatz
  choice: aber
  alternative: denn
  rationale: »Denn« würde die erklärende Beziehung ausdrücklich festlegen. »Aber« bewahrt den formalen Gegensatz und die Spannung des griechischen δέ.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Die Formulierung ist verständlich und zugleich quellennahe; die knappe militärische Dringlichkeit sowie die Mehrdeutigkeit der einleitenden Wendung bleiben erhalten.
