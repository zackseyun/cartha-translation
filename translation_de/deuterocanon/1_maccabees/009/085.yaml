review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die erhaltenen griechischen Elemente grundsätzlich zutreffend wieder: σὺν ist additiv, τοῖς ἐμπυρισθεῖσιν bezeichnet verbrannte Personen, εἰς ἄνδρας ὀκτακισχιλίους eine Gesamtzahl von achttausend Männern, und ἀπῆρεν einen Aufbruch bzw. ein Fortgehen. „Insgesamt“ ist als Deutung der Summenfunktion vertretbar, doch „auf achttausend Mann“ bildet εἰς unmittelbarer ab. Die Partizipialgruppe sollte ausdrücklich Personen bezeichnen.'
  naturalness: „Den Verbrannten“ ist möglich, wirkt im heutigen Standarddeutsch jedoch substantivisch verkürzt und kann auch an verbrannte Gegenstände denken lassen. „Denen, die verbrannt worden waren“ ist klar, natürlich und bewahrt die passive Aussage ohne die nicht ausdrücklich belegte Verschärfung „bei lebendigem Leib“. „Und er zog fort“ ist eine unmittelbare, erzählerisch natürliche Wiedergabe von καὶ ἀπῆρεν.
  terminology: „Mann“ ist bei einer Zahl idiomatisch und bewahrt die spezifisch männliche Referenz von ἄνδρας. Es sind keine theologischen Fachbegriffe betroffen.
