lexical_decisions:
- source_word: σὺν
  choice: zusammen mit
  rationale: Die Präposition fügt die genannte Gruppe einer zuvor erwähnten Zahl oder Gruppe hinzu; „zusammen mit“ macht diese additive Bedeutung deutlich.
- source_word: τοῖς ἐμπυρισθεῖσιν
  choice: den Verbrannten
  rationale: Das substantivierte passive Aoristpartizip von ἐμπυρίζω bezeichnet Menschen, die verbrannt wurden. Die knappe Wiedergabe vermeidet die stärkere, im erhaltenen Wortlaut nicht ausdrücklich enthaltene Aussage „bei lebendigem Leib verbrannt“.
- source_word: εἰς
  choice: insgesamt
  rationale: εἰς führt hier offenbar die resultierende Gesamtzahl ein. „insgesamt“ gibt diese summierende Funktion im Deutschen natürlich wieder.
- source_word: ἄνδρας
  choice: Mann
  rationale: Das Griechische verwendet ausdrücklich ἄνδρας. In Verbindung mit einer Zahl ist „achttausend Mann“ die natürliche deutsche Form und bewahrt die geschlechtsspezifische Bezeichnung.
- source_word: ὀκτακισχιλίους
  choice: achttausend
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: ἀπῆρεν
  choice: zog er ab
  rationale: Der Aorist bezeichnet den Aufbruch beziehungsweise das Wegziehen. „zog er ab“ passt zum militärisch-narrativen Zusammenhang und bleibt im modernen Deutsch klar.
