    rationale: Das griechische substantivierte Partizip steht hier angesichts von ἄνδρας für Menschen. Die explizite Relativkonstruktion verhindert im Deutschen eine unnötige Mehrdeutigkeit.
  - severity: low
    issue: „insgesamt“ ist weniger quellennah als eine Richtungs-/Ergebnisangabe mit „auf“
    rationale: εἰς mit der Zahl drückt das Erreichen der Gesamtsumme aus. „auf achttausend Mann“ gibt dies im Deutschen präzise und idiomatisch wieder.
  revised_text: zusammen mit denen, die verbrannt worden waren, auf achttausend Mann. Und er zog fort.
