base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/070.yaml
  text: And Jonathan learned of it[b][a], and sent ambassadors to him to make peace with him and to return the captives to them.
translation:
  language: de
  text: Jonathan erfuhr davon und sandte Gesandte[a] zu ihm, um mit ihm Frieden zu schließen und ihnen die Gefangenen[b] zurückzugeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abgesandte“. Das griechische Wort bezeichnet offizielle diplomatische Vertreter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Gefangenschaft“; gemeint sind hier die Menschen, die gefangen genommen worden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: erfuhr davon
  rationale: Der Aorist von γινώσκω bezeichnet hier das Bekanntwerden eines Sachverhalts; „erfuhr davon“ gibt diesen ingressiven Sinn natürlich wieder.
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Schlichte und im würdevollen Erzählstil passende Wiedergabe von ἀποστέλλω.
- source_word: πρέσβεις
  choice: Gesandte
  rationale: Das Wort bezeichnet offizielle diplomatische Vertreter. „Gesandte“ ist im Deutschen natürlich und lässt den genauen Rang offen.
- source_word: τοῦ συνθέσθαι πρὸς αὐτὸν εἰρήνην
  choice: um mit ihm Frieden zu schließen
  rationale: Der artikulierte Infinitiv drückt den Zweck aus; συντίθεσθαι mit εἰρήνην meint die Vereinbarung beziehungsweise den Abschluss von Frieden, ohne zwingend einen förmlichen Vertrag zu bezeichnen.
- source_word: ἀποδοῦναι
  choice: zurückzugeben
  rationale: ἀποδίδωμι bezeichnet die Rückgabe dessen, was zurückgehalten wird; die Infinitivkonstruktion hängt weiterhin vom Zweck des Sendens ab.
- source_word: τὴν αἰχμαλωσίαν
  choice: die Gefangenen
  rationale: Das abstrakte beziehungsweise kollektive Substantiv „Gefangenschaft“ bezeichnet hier konkret die gefangen genommenen Menschen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Das Pronomen bleibt entsprechend dem Griechischen ohne erklärende Präzisierung stehen, sodass die Bezugsgruppe nicht überdeutet wird.
