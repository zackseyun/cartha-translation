base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/066.yaml
  text: And he struck Odomera and his brothers and the sons of Phasiron in their camp[b][a], and he began to strike and to advance with his forces.
translation:
  language: de
  text: Und er schlug Odomera, seine Brüder und die Söhne Phasirons in ihrem Lager[a], und er begann, zu schlagen und mit den Streitkräften vorzurücken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihrer Zeltstätte“ oder „in ihrer Behausung“; im militärischen Zusammenhang ist wohl ihr Lager gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu schlagen und mit den Streitkräften hinaufzugehen“; „vorzurücken“ gibt den wahrscheinlichen militärischen Sinn wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάτεξεν
  choice: schlug
  rationale: Der Aorist von πατάσσω bezeichnet ein Schlagen oder Niederschlagen. „Schlug“ bewahrt die konkrete militärische Handlung und vermeidet altertümliches Deutsch.
- source_word: Ὀδομηρὰ
  choice: Odomera
  rationale: Der Personenname wird entsprechend der griechischen Form transliteriert.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: seine Brüder
  rationale: ἀδελφοί bedeutet gewöhnlich „Brüder“; der Singular des Possessivpronomens verweist auf Odomera.
- source_word: τοὺς υἱοὺς Φασιρὼν
  choice: die Söhne Phasirons
  rationale: υἱοί kann auch Nachkommen bezeichnen, doch die formale Wiedergabe „Söhne“ bewahrt die genealogische Ausdrucksweise und bleibt verständlich.
- source_word: ἐν τῷ σκηνώματι αὐτῶν
  choice: in ihrem Lager
  rationale: σκήνωμα bezeichnet wörtlich eine Zeltstätte oder Behausung; im militärischen Zusammenhang ist „Lager“ die natürliche deutsche Entsprechung.
- source_word: ἐξηρξατο
  choice: begann er
  rationale: Das Verb kennzeichnet den Beginn einer Handlung und wird unmittelbar wiedergegeben.
- source_word: τύπτειν
  choice: zuzuschlagen
  rationale: τύπτω bezeichnet das Schlagen. „Zuzuschlagen“ erhält die Wiederholung des Schlagens aus dem Griechischen, klingt hier aber natürlicher als ein erneutes „zu schlagen“.
- source_word: ἀναβαίνειν
  choice: vorzurücken
  rationale: Wörtlich bedeutet das Verb „hinaufzugehen“. Im Kampfzusammenhang liegt die militärische Bedeutung „vorrücken“ nahe, ohne die wörtliche Möglichkeit zu verschweigen.
- source_word: ἐν ταῖς δυνάμεσιν
  choice: mit den Streitkräften
  rationale: δύναμις im Plural kann militärische Streitkräfte bezeichnen. Der bestimmte Artikel wird bewahrt; ein im Griechischen nicht vorhandenes Possessivpronomen wird nicht ergänzt.
