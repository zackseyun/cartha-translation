  yaml_path: translation/deuterocanon/1_maccabees/009/030.yaml
  text: Now therefore we have chosen you today to be for us, in his place, a ruler and leader, to fight our war.
translation:
  language: de
  text: Darum haben wir dich heute erwählt, damit du für uns an seiner Stelle Oberhaupt und Anführer bist und unseren Krieg führst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρετισάμεθα
  choice: haben wir … erwählt
  rationale: Das mediale Aoristverb bezeichnet die bewusste Auswahl einer Person für eine Aufgabe. „Erwählt“ gibt dies würdig und natürlich wieder, ohne ein bestimmtes Wahlverfahren vorauszusetzen.
- source_word: ἀντʼ αὐτοῦ
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die Nachfolge in der bisherigen Stellung des Verstorbenen und bleibt gegenüber „als sein Nachfolger“ näher am griechischen Ausdruck.
- source_word: ἄρχοντα
  choice: Oberhaupt
  rationale: ἄρχων bezeichnet allgemein eine Person mit leitender Autorität. „Oberhaupt“ bewahrt diesen weiten Sinn, ohne einen monarchischen Titel oder ein rein militärisches Amt einzutragen.
- source_word: ἡγούμενον
  choice: Anführer
  rationale: Das substantivierte Partizip bezeichnet einen Führenden. „Anführer“ hält den Begriff von „Oberhaupt“ unterscheidbar und bringt den praktischen Leitungsaspekt zum Ausdruck.
- source_word: τοῦ πολεμῆσαι
  choice: und … führst
  rationale: Der artifizielle Infinitiv bezeichnet hier den Zweck der Erwählung. Die koordinierte deutsche Formulierung mit „damit“ gibt diesen Zweck natürlich wieder.
- source_word: τὸν πόλεμον ἡμῶν
  choice: unseren Krieg
  rationale: πόλεμος meint den Krieg beziehungsweise den gesamten bewaffneten Konflikt, nicht nur eine einzelne Schlacht. Das Possessivpronomen bleibt ausdrücklich erhalten.
theological_decisions:
- issue: Wiedergabe der beiden Titel ἄρχοντα καὶ ἡγούμενον
  choice: Oberhaupt und Anführer
  alternative: Herrscher und Führer; Fürst und Heerführer
  rationale: Die Wiedergabe hält beide Bezeichnungen auseinander, ohne daraus spätere Amts- oder Herrschertitel zu machen. „Oberhaupt“ betont die Autoritätsstellung, „Anführer“ die aktive Leitung, auch im folgenden Krieg.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde mit „damit“ idiomatisch gestaltet; sowohl das Sein in der Leitungsrolle als auch das Führen des Krieges bleiben als Zweck der Erwählung erkennbar.
