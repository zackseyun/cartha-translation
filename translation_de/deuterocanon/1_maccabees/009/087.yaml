translation:
  language: de
  text: Jonathan kehrte mit seinen Begleitern zurück; sie hatten viel Beute bei sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρεψεν
  choice: kehrte … zurück
  rationale: Der Aorist von στρέφω bezeichnet hier im Erzählzusammenhang die Rückkehr beziehungsweise das Umkehren; die deutsche Wendung ist natürlich und bewahrt die Bewegungsrichtung.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: mit seinen Begleitern
  rationale: Die Formulierung bezeichnet die bei Jonathan befindliche Gruppe, ohne sie ausdrücklich als Soldaten festzulegen. „Begleiter“ gibt dies knapp und idiomatisch wieder.
- source_word: ἔχοντες
  choice: führte … mit sich
  rationale: Das Partizip bezeichnet einen begleitenden Umstand und bezieht sich sinngemäß auf Jonathan samt seiner Gruppe. Bei erbeuteten Gegenständen klingt „mit sich führen“ im Deutschen natürlich.
- source_word: σκῦλα πολλά
  choice: reiche Beute
  rationale: σκῦλα meint im Kampf errungene Beutestücke. „Reiche Beute“ gibt die große Menge idiomatisch wieder, ohne den Sinn unnötig auszuweiten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp erzählender Stil. Die leichte grammatische Unebenheit des griechischen Satzes (Singular στρεψεν neben pluralischem ἔχοντες) wird in natürlichem Deutsch sinngemäß auf Jonathan und seine Begleiter bezogen.
