translation_notes:
  register: Moderner, würdiger Erzählstil. Die Satzstruktur bleibt knapp und folgt der Abfolge des griechischen Textes; »unter Bewachung« vermeidet die zu enge Festlegung auf Haft in einem Gefängnis.
