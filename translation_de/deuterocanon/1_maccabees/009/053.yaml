  text: And they took the sons of the leaders of the land as hostages[a], and placed them under guard in the citadel in Jerusalem.
translation:
  language: de
  text: Und sie nahmen die Söhne der führenden Männer des Landes als Geiseln und brachten sie in der Zitadelle[a] in Jerusalem in Gewahrsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Akra«, der befestigten Zitadelle in Jerusalem.'
    reason: 'Lexikalische Alternative: ἄκρα kann hier als Bezeichnung der Jerusalemer Festung Akra verstanden werden.'
lexical_decisions:
- source_word: ἔλαβον
  choice: nahmen
  rationale: Das schlichte Erzählverb gibt die Ingewahrsamnahme im Zusammenhang natürlich wieder, ohne die stärkere Gewaltkomponente von »ergriffen« oder »packten« einzutragen.
- source_word: τοὺς υἱοὺς
  choice: die Söhne
  rationale: Der griechische Text bezeichnet ausdrücklich die männlichen Nachkommen; diese Geschlechtsspezifik bleibt erhalten.
- source_word: τῶν ἡγουμένων
  choice: der führenden Männer
  rationale: Das substantivierte Partizip bezeichnet Personen in leitender Stellung, ohne zwingend ein bestimmtes politisches Amt auszudrücken. »Führende Männer« ist im historischen Zusammenhang natürlich und präzise.
- source_word: τῆς χώρας
  choice: des Landes
  rationale: χώρα kann Land, Gebiet oder Region bezeichnen. »Land« wahrt die geografische Weite und passt zum historischen Erzählstil.
- source_word: ὁμήρα
  choice: als Geiseln
  rationale: Das Wort bezeichnet Geiseln; »als Geiseln« macht ihre Funktion im deutschen Satz idiomatisch deutlich.
- source_word: ἔθεντο ... ἐν φυλακῇ
  choice: hielten ... unter Bewachung
  rationale: Die Wendung beschreibt gesicherten Gewahrsam. Die deutsche Fassung gibt den resultierenden Zustand natürlich wieder, ohne ein besonderes Gefängnisgebäude vorauszusetzen.
- source_word: ἐν τῇ ἄκρᾳ
  choice: in der Zitadelle
  rationale: ἄκρα bezeichnet eine befestigte Höhe oder Zitadelle und meint hier wahrscheinlich die Jerusalemer Festung, die als Akra bekannt ist. Der Gattungsbegriff bleibt im Haupttext verständlich; der Eigenname steht als Alternative in der Fußnote.
