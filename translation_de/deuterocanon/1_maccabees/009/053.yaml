  verdict: revise
  source_fidelity: Die erste Satzhälfte gibt καὶ ἔλαβον τοὺς υἱοὺς τῶν ἡγουμένων τῆς χώρας ὁμήρα treffend wieder. In der zweiten Hälfte bezeichnet ἔθεντο jedoch vorrangig das Unterbringen/Platzieren der Geiseln. »Hielten sie … unter Bewachung« beschreibt eher einen fortdauernden Zustand und schwächt diese erzählerische Handlung ab. »Brachte[n] sie … in Gewahrsam« wahrt sowohl die Handlung als auch den Sinn von ἐν φυλακῇ.
  naturalness: Die deutsche Fassung ist insgesamt klar und angemessen. »In Gewahrsam bringen« ist modernes, idiomatisches Deutsch und bildet die Abfolge des griechischen Satzes präziser ab als »unter Bewachung halten«.
  terminology: »Söhne«, »führende Männer des Landes«, »Geiseln« und »Zitadelle« sind sachgerecht. Die Fußnote bewahrt mit »Akra« sinnvoll die mögliche spezifische Benennung der Jerusalemer Zitadelle.
  issues:
