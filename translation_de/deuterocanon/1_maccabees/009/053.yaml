    issue: Die Wiedergabe von ἔθεντο … ἐν φυλακῇ als »hielten sie … unter Bewachung« verschiebt die Handlung in eine Zustandsbeschreibung.
    rationale: Das griechische Aoristverb ἔθεντο berichtet, dass sie die Geiseln in der Zitadelle unterbrachten; ἐν φυλακῇ bezeichnet dabei Gewahrsam/Haft bzw. Bewachung. Eine Formulierung mit »in Gewahrsam bringen« bewahrt beide Aspekte ohne ein bestimmtes Gefängnisgebäude zu behaupten.
  revised_text: Und sie nahmen die Söhne der führenden Männer des Landes als Geiseln und brachten sie in der Zitadelle[a] in Jerusalem in Gewahrsam.
