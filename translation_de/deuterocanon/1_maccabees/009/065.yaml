  yaml_path: translation/deuterocanon/1_maccabees/009/065.yaml
  text: And Jonathan left Simon his brother in the city[a], and went out into the country, and came with a number of men.
translation:
  language: de
  text: Und Jonatan ließ seinen Bruder Simon in der Stadt zurück, ging ins Umland hinaus und kam mit einer Anzahl von Männern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »kam mit einer Zahl/Anzahl«. Die griechische Wendung ist elliptisch und meint wahrscheinlich, dass er mit einer Gruppe von Männern kam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: ließ … zurück
  rationale: Der Aorist von ἀπολείπω bezeichnet hier, dass Jonatan Simon an diesem Ort zurückließ, während er selbst fortging. Die deutsche Wendung gibt diese räumliche Trennung klar und natürlich wieder.
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder Simon
  rationale: Die attributive deutsche Wortstellung gibt die appositionelle Identifizierung Simons als Jonatans Bruder flüssig und vollständig wieder.
- source_word: ἐν τῇ πόλει
  choice: in der Stadt
  rationale: πόλις kann Stadt oder Ortschaft bezeichnen. »Stadt« ist hier die naheliegende, kontextgerechte Wiedergabe.
- source_word: ἐξῆλθεν εἰς τὴν χώραν
  choice: ging ins Umland hinaus
  rationale: χώρα bezeichnet hier das Gebiet beziehungsweise offene Land außerhalb der Stadt. »Umland« bewahrt den räumlichen Gegensatz zur Stadt, ohne ein eigenständiges Staatsgebiet anzudeuten.
- source_word: ἦλθεν ἀρίθμῳ
  choice: kam mit einer Anzahl von Männern
  rationale: Die griechische Formulierung ist elliptisch; ἀριθμός kann eine Zahl oder eine zahlenmäßig bestimmte Gruppe bezeichnen. Die Ergänzung »von Männern« macht den im militärischen Zusammenhang naheliegenden Sinn verständlich, ohne Größe oder Art der Gruppe festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Bewegungsfolge »ging … hinaus und kam« bleibt entsprechend dem griechischen Text erhalten. Die ungewöhnliche Schlusswendung wird im Haupttext behutsam verdeutlicht und in der Fußnote als elliptisch ausgewiesen.
