base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/035.yaml
  text: And he sent his brother as leader of the crowd[a], and he urged his Nabatean friends to take charge of their abundant baggage for them.
translation:
  language: de
  text: Und er sandte seinen Bruder als Anführer der Schar. Er bat seine nabatäischen Freunde, deren umfangreiches Gepäck in Verwahrung zu nehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deren umfangreiches Gepäck zu übernehmen“. Das griechische Verb kann hier das Annehmen von Eigentum zur sicheren Verwahrung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte … voraus
  rationale: Das Verb bedeutet grundsätzlich „senden“. „Voraussenden“ ist im Erzählzusammenhang natürlich und lässt erkennen, dass der Bruder mit einer Leitungsaufgabe entsandt wurde.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder
  rationale: Direkte und natürliche Wiedergabe der griechischen Possessivkonstruktion.
- source_word: ἡγούμενον τοῦ ὄχλου
  choice: als Anführer der Schar
  rationale: Das Partizip bezeichnet die leitende Funktion des Bruders. „Schar“ gibt die hier gemeinte größere Gruppe natürlicher wieder als „Menschenmenge“, ohne sie ausdrücklich als militärische Einheit festzulegen.
- source_word: παρεκάλεσεν
  choice: bat
  rationale: Das Verb kann bitten, auffordern oder dringend ersuchen bedeuten. In Verbindung mit befreundeten Nabatäern ist „bat“ eine klare, nicht übersteigerte Wiedergabe.
- source_word: τοὺς Ναβαταίους φίλους αὐτοῦ
  choice: seine nabatäischen Freunde
  rationale: Die knappe Form bewahrt sowohl die ethnische Bezeichnung als auch das Freundschaftsverhältnis.
- source_word: παραθέσθαι αὐτοῖς
  choice: für sie in Verwahrung zu nehmen
  rationale: Der mediale Infinitiv kann hier das Annehmen anvertrauten Besitzes zum Zweck der Aufbewahrung bezeichnen. Die Formulierung macht den Bezug des Dativs αὐτοῖς deutlich.
- source_word: τὴν ἀποσκευήν αὐτῶν τὴν πολλήν
  choice: ihr umfangreiches Gepäck
  rationale: ἀποσκευή bezeichnet mitgeführtes Gepäck, Gerät oder Habe; πολλήν hebt dessen große Menge hervor. „Umfangreiches Gepäck“ ist idiomatisch und sachlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schar“ vermeidet das im Kontext missverständliche „Menschenmenge“, ohne eine ausdrücklich militärische Bezeichnung einzuführen. Die mögliche Verwahrungsbedeutung von παραθέσθαι wird im Text ausgedrückt und in der Fußnote mit einer offeneren Alternative dokumentiert.
