  text: And the wedding was turned into mourning[a], and the sound of their musicians into lamentation.
translation:
  language: de
  text: Da verwandelte sich die Hochzeit in Trauer, und der Klang ihrer Musiker in Klage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Klang ihrer Musikinstrumente“. Das griechische Wort kann sich hier auf Musiker oder auf Musikinstrumente beziehungsweise musikalische Darbietung beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεστράφη
  choice: verwandelte sich
  rationale: Das Passiv bezeichnet den Umschlag von einem Zustand in einen anderen; die deutsche reflexive Form gibt diesen jähen Wandel natürlich wieder.
- source_word: ὁ γάμος
  choice: die Hochzeit
  rationale: Im Kontext ist die Hochzeitsfeier als öffentliches Ereignis gemeint, nicht die Ehe als Institution.
- source_word: πένθος
  choice: Trauer
  rationale: Das Wort bezeichnet Trauer angesichts von Tod oder Unheil und bildet den passenden Gegensatz zur Hochzeit.
- source_word: φωνὴ
  choice: der Klang
  rationale: Hier bezeichnet φωνή das Hörbare der Musik; „Klang“ ist im Deutschen idiomatischer als das wörtliche „Stimme“.
- source_word: μουσικῶν
  choice: Musiker
  rationale: Der substantivisch gebrauchte Genitiv Plural kann die Musizierenden bezeichnen; die ebenfalls mögliche instrumentale Deutung bleibt in der Fußnote erhalten.
- source_word: θρῆνον
  choice: Totenklage
  rationale: θρῆνος bezeichnet eine feierliche Klage, besonders im Zusammenhang mit Tod; „Totenklage“ bewahrt hier den starken Kontrast zur Hochzeitsmusik.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der scharfe Gegensatz zwischen Hochzeit und Trauer sowie zwischen Musik und Totenklage bleiben erhalten.
