base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/002.yaml
  text: And they traveled on the road to Galgala[a], and encamped against Mesaloth in Arbela, and captured it[b], and destroyed many people.
translation:
  language: de
  text: Sie zogen auf der Straße nach Galgala und schlugen ihr Lager vor Messalot im Gebiet von Arbela auf. Sie brachten den Ort in ihre Gewalt[a], und dabei kamen viele Menschen ums Leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb ist selten und schwer zu deuten; möglich sind auch: „nahmen den Ort zuvor ein“, „besetzten ihn“ oder „überrannten ihn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im griechischen Text steht hier unvermittelt ein Verb im Singular, obwohl zuvor von „sie“ die Rede ist; ein Bezugsträger wird nicht ausdrücklich genannt. Wörtlich heißt es: „[er/es] vernichtete viele Menschenseelen“, das heißt: Viele Menschen wurden getötet.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐπορεύθησαν ὁδὸν τὴν εἰς Γάλγαλα
  choice: Sie zogen auf der Straße nach Galgala
  rationale: Die Wendung mit ὁδόν bezeichnet den eingeschlagenen Weg. „Zogen“ passt natürlich zu einer militärischen Bewegung, ohne ausdrücklich einen Marsch zu behaupten.
- source_word: παρενέβαλον ἐπὶ Μεσσαλὼθ τὴν ἐν Ἀρβήλοις
  choice: schlugen ihr Lager vor Messalot im Gebiet von Arbela auf
  rationale: παρεμβάλλω bezeichnet hier das Aufschlagen eines militärischen Lagers; ἐπί legt eine feindliche Stellung vor dem Ort nahe. Die Formulierung „im Gebiet von Arbela“ gibt die Zuordnung des Ortes verständlich wieder.
- source_word: προκατελίβοντο αὐτήν
  choice: brachten den Ort in ihre Gewalt
  rationale: Das seltene und schwierige Verb bezeichnet offenbar eine bemächtigende oder vorausgreifende Einnahme. Die Wiedergabe lässt die genaue Art der Besitzergreifung offen; „den Ort“ macht den Bezug des femininen Pronomens αὐτήν im Deutschen klar.
- source_word: ἀπώλεσεν ψυχὰς ἀνθρώπων πολλὰς
  choice: er tötete viele Menschen
  rationale: ψυχαί bezeichnet in diesem Zusammenhang Menschenleben beziehungsweise Personen, und ἀπόλλυμι hat hier tödliche Bedeutung. Das singularische „er“ bewahrt den auffälligen Numeruswechsel des griechischen Textes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Situation wird klar ausgedrückt, ohne das schwierige Verb προκατελίβοντο zu überpräzisieren. Der auffällige Wechsel zum singularischen Verb ἀπώλεσεν bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
