base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/046.yaml
  text: Now then[a], cry out to heaven, so that you may be delivered from the hand of our enemies.
translation:
  language: de
  text: Nun denn, ruft zum Himmel[a], damit ihr aus der Hand unserer Feinde gerettet werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu Gott«. Im Griechischen steht »zum Himmel«; »Himmel« kann hier als ehrfürchtige Umschreibung für den göttlichen Bereich oder für Gott selbst gebraucht sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun also
  rationale: Die Verbindung bezeichnet einen folgernden und zugleich dringlichen Übergang; »Nun also« bewahrt beide Aspekte in natürlichem Deutsch.
- source_word: κεκράξατε
  choice: ruft
  rationale: Der Aoristimperativ von κράζω fordert hier zu einem dringlichen Hilferuf auf. In Verbindung mit »zum Himmel« vermittelt »ruft« dies natürlich, ohne bloß lautes Schreien nahezulegen.
- source_word: εἰς οὐρανόν
  choice: zum Himmel
  rationale: Die wörtliche Wendung bleibt erhalten und kann im Kontext ehrfürchtig auf Gott beziehungsweise den göttlichen Bereich verweisen, ohne diese Deutung im Haupttext festzuschreiben.
- source_word: ὅπως
  choice: damit
  rationale: »Damit« gibt den Zweck beziehungsweise das beabsichtigte Ergebnis der Aufforderung klar wieder.
- source_word: διασωθῆτε
  choice: ihr ... gerettet werdet
  rationale: Das Passiv von διασῴζω bezeichnet hier die Rettung aus unmittelbarer militärischer Gefahr; »gerettet werden« ist präzise und im Deutschen nicht notwendig auf einen späteren theologischen Sinn beschränkt.
- source_word: ἐκ χειρὸς
  choice: aus der Hand
  rationale: Die biblische Metapher für Macht oder Gewalt bleibt verständlich und quellennah erhalten.
- source_word: ἐχθρῶν ἡμῶν
  choice: unserer Feinde
  rationale: Dies ist die natürliche und genaue deutsche Wiedergabe der Genitivverbindung.
theological_decisions:
- issue: Ob »Himmel« wörtlich wiederzugeben oder ausdrücklich als »Gott« auszulegen ist
  choice: zum Himmel
  alternative: zu Gott
  rationale: Im Griechischen steht ausdrücklich »zum Himmel«. Wahrscheinlich dient »Himmel« als ehrfürchtige Umschreibung für Gott oder den göttlichen Bereich; die Übersetzung bewahrt jedoch die Formulierung und ihre mögliche Spannung, statt Gott im Haupttext ausdrücklich einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der biblische Ausdruck »aus der Hand unserer Feinde« bleibt erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser unmittelbar verständlich.
