  yaml_path: translation/deuterocanon/1_maccabees/009/052.yaml
  text: And they fortified the city[a], and Beth-zur, and Gazara, and the citadel[b], and they stationed forces in them and supplies of food.
translation:
  language: de
  text: Und sie befestigten die Stadt, Bet-Zur, Gazara und die Zitadelle und stationierten dort Truppen und Lebensmittelvorräte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠχύρωσαν
  choice: befestigten
  rationale: Das Verb bezeichnet hier das militärische Sichern durch Befestigungsanlagen; „befestigten“ ist im Deutschen präzise und natürlich.
- source_word: τὴν πόλιν
  choice: die Stadt
  rationale: πόλις bedeutet gewöhnlich „Stadt“; der Artikel verweist auf eine im Zusammenhang bekannte Stadt. Aufgrund einer möglichen Textabweichung wird eine Fußnote gesetzt.
- source_word: Βεθοσούραν
  choice: Bet-Zur
  rationale: Der Ortsname wird in einer im Deutschen geläufigen, an der semitischen Namensform orientierten Schreibweise wiedergegeben.
- source_word: Γάζαρα
  choice: Gazara
  rationale: „Gazara“ bildet die griechische Namensform unmittelbar ab; die häufige Identifikation mit Geser wird nicht in den Haupttext eingetragen.
- source_word: τὴν ἄκραν
  choice: die Zitadelle
  rationale: ἄκρα bezeichnet hier die befestigte Hochburg beziehungsweise Zitadelle; die Übersetzung wahrt den Sachbezug, ohne den Ausdruck unnötig als Eigennamen festzulegen.
- source_word: ἔθεντο ἐν αὐταῖς δυνάμεις
  choice: stationierten dort Truppen
  rationale: Wörtlich steht „setzten/stellten in ihnen Streitkräfte“. „Stationierten dort Truppen“ gibt den militärischen Vorgang idiomatisch wieder; „dort“ vermeidet im Deutschen ein schwerfälliges geschlechtlich uneinheitliches Pronomen.
- source_word: παραθέσεις βρωμάτων
  choice: Lebensmittelvorräte
  rationale: Die Wortgruppe bezeichnet bereitgelegte beziehungsweise eingelagerte Nahrung; „Lebensmittelvorräte“ ist knapp, sachlich und kontextgerecht.
