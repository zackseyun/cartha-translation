translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer militärischer Terminologie. Die Reihung des griechischen Satzes bleibt weitgehend erhalten. Die Fußnote berücksichtigt, dass die im englischen Konsultationstext genannte Akra-Alternative sinnvoll nur als Textvariante zu τὴν πόλιν ist; im vorgelegten Swete-Text bezeichnet τὴν ἄκραν bereits die Zitadelle.
