revisions:
- from: Als sie sahen, wie groß die Streitmacht war und wie zahlreich die Soldaten waren, bekamen sie große Angst. Viele liefen aus dem Lager davon[a], sodass von ihnen nur achthundert Mann übrig blieben.
  to: Als sie die große Zahl der Truppen sahen und erkannten, wie zahlreich sie waren, gerieten sie in große Angst. Viele flohen aus dem Lager[a], und von ihnen blieben nur achthundert Mann zurück.
  rationale: Die Revision wahrt die doppelte griechische Hervorhebung der großen Truppenmenge und ihrer Zahl, gibt den Plural δυνάμεων als »Truppen« wieder und ersetzt die umgangssprachlichere Formulierung für ἐξερρύησαν durch »flohen«. Die koordinierende Satzverbindung folgt der griechischen Aussagefolge, ohne einen überstarken Folgezusammenhang einzutragen.
