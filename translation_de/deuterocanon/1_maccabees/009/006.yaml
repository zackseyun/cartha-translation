  yaml_path: translation/deuterocanon/1_maccabees/009/006.yaml
  text: And they saw the multitude of the forces[a], that they were many, and they were greatly afraid; and many fled from the camp, and none of them were left except eight hundred men.
translation:
  language: de
  text: Als sie die große Zahl der Truppen sahen und erkannten, wie zahlreich sie waren, gerieten sie in große Angst. Viele flohen aus dem Lager[a], und von ihnen blieben nur achthundert Mann zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »entfernten sich aus dem Lager«. Das griechische Verb kann neben Flucht auch ein Sichentfernen oder Weggleiten aus einer Gruppe andeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πλῆθος τῶν δυνάμεων
  choice: wie groß die Streitmacht war
  rationale: πλῆθος bezeichnet hier die große Menge, δυνάμεις militärische Truppen. Die deutsche Wendung gibt den militärischen Sinn natürlich wieder, ohne mehrere Heere vorauszusetzen.
- source_word: πολλοί εἰσιν
  choice: wie zahlreich die Soldaten waren
  rationale: Das erklärende ὅτι wird sinngemäß angeschlossen. Das ergänzte »Soldaten« macht den Bezug im Deutschen eindeutig und bezeichnet im Kontext keine andere Personengruppe.
- source_word: ἐφοβήθησαν σφόδρα
  choice: bekamen sie große Angst
  rationale: Die Form bezeichnet das Eintreten starker Furcht; σφόδρα wird durch »große« deutlich wiedergegeben.
- source_word: ἐξερρύησαν
  choice: liefen ... davon
  rationale: Das Verb kann ein Herausströmen, Sichentfernen oder Fliehen bezeichnen. »Davonlaufen« wahrt im militärischen Zusammenhang den Fluchtgedanken, ohne ausdrücklich eine formelle Desertion zu behaupten.
- source_word: παρεμβολῆς
  choice: Lager
  rationale: παρεμβολή bezeichnet in diesem militärischen Kontext das Heerlager.
- source_word: οὐ κατελείφθησαν ἐξ αὐτῶν ἀλλʼ ἢ ὀκτακόσιοι ἄνδρες
  choice: sodass von ihnen nur achthundert Mann übrig blieben
  rationale: Die Formulierung gibt den verbleibenden Rest nach dem Fortgehen vieler klar und idiomatisch wieder.
