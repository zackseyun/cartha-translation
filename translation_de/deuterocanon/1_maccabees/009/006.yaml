  source_fidelity: Die Aussagefolge und der militärische Zusammenhang sind im Wesentlichen zutreffend wiedergegeben. Die Singularform »die Streitmacht« glättet jedoch das griechische Pluralwort δυνάμεων („Truppen/Streitkräfte“) zu stark. Für ἐξερρύησαν ist »flohen« im Kontext die klarere, registergerechtere Wiedergabe als das eher umgangssprachliche »liefen ... davon«.
  naturalness: Der Entwurf ist verständlich und modernes Standarddeutsch. »Viele flohen aus dem Lager« und »von ihnen blieben nur achthundert Mann zurück« sind idiomatisch, würdig und präziser als die bisherige Formulierung mit »sodass«.
  terminology: »Truppen« gibt δυνάμεις in diesem Kontext angemessen wieder, ohne eine einzelne Streitmacht vorauszusetzen. »Mann« ist hier als militärische Zählbezeichnung für ἄνδρες passend. Die Fußnote soll die mögliche Nuance eines unauffälligen Sichentfernens als Alternative nennen, ohne dies zur Hauptbedeutung zu machen.
