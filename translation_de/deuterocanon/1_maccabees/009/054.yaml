base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/054.yaml
  text: And in the one hundred and fifty-third year[a], in the second month, Alcimus ordered the wall of the inner court of the sanctuary to be torn down, and he tore down the works of the prophets[b], and began to tear it down.
translation:
  language: de
  text: Im 153. Jahr, im zweiten Monat, befahl Alkimos, die Mauer des inneren Vorhofs des Heiligtums niederzureißen. Er riss die Werke der Propheten[a] nieder und begann mit dem Abbruch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Werke der Propheten“. Gemeint sein können Bauten oder Wiederherstellungsarbeiten, die mit den Propheten verbunden wurden; der griechische Text sagt dies jedoch nicht genauer.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει τρίτῳ καὶ πεντηκοστῷ καὶ ἑκατοστῷ
  choice: Im 153. Jahr
  rationale: Die additive griechische Zahl bezeichnet das 153. Jahr; die Ziffernschreibweise ist im Deutschen klar und natürlich.
- source_word: τῷ μηνὶ τῷ δευτέρῳ
  choice: im zweiten Monat
  rationale: Die temporale Dativkonstruktion wird unmittelbar und idiomatisch wiedergegeben.
- source_word: ἐπέταξεν
  choice: befahl
  rationale: Das Verb bezeichnet eine verbindliche Anordnung; „befahl“ bewahrt deren Nachdruck.
- source_word: καθελεῖν / καθεῖλεν / καθαιρεῖν
  choice: niederzureißen / riss … nieder / Abbruch
  rationale: Die wiederkehrende Wortwurzel bezeichnet jeweils das Niederreißen. Im letzten Satzteil vermeidet „Abbruch“ ein schwerfälliges drittes Wiederholen, ohne den Sinn zu verändern.
- source_word: τὸ τεῖχος
  choice: die Mauer
  rationale: τεῖχος bezeichnet hier die feste Umfassungsmauer des Tempelbereichs.
- source_word: τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: des inneren Vorhofs des Heiligtums
  rationale: Die Genitivfolge beschreibt einen inneren Hof im heiligen Tempelbezirk. „Vorhof“ entspricht dem etablierten, allgemein verständlichen Sprachgebrauch für einen Tempelhof; „Heiligtum“ gibt τὰ ἅγια als sakralen Bereich wieder.
- source_word: τὰ ἔργα τῶν προφητῶν
  choice: die Werke der Propheten
  rationale: Die wörtliche Wiedergabe erhält die im Griechischen nicht näher bestimmte historische Aussage und vermeidet eine spekulative Deutung als bestimmte Bauwerke.
- source_word: ἐνήρξατο τοῦ καθαιρεῖν
  choice: begann mit dem Abbruch
  rationale: Die Konstruktion bezeichnet den Beginn des Niederreißens. Die deutsche Formulierung bleibt bewusst ohne ergänztes Objekt, da auch der griechische Ausdruck an dieser Stelle keines ausdrücklich nennt.
theological_decisions:
- issue: Tempeltopografie in τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: des inneren Vorhofs des Heiligtums
  alternative: des inneren Hofes der heiligen Stätte
  rationale: Die gewählte Fassung ist natürlich und lässt die genaue Abgrenzung des bezeichneten Tempelbereichs offen, statt eine spätere technische Einteilung einzutragen.
- issue: Unbestimmte Wendung τὰ ἔργα τῶν προφητῶν
  choice: die Werke der Propheten
  alternative: die von den Propheten errichteten Bauwerke
  rationale: Der griechische Text erklärt weder Art noch Urheberschaft dieser „Werke“ genauer. Die wörtliche Fassung bewahrt diese historische und mögliche theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei Sätze geteilt. Die rätselhafte Formulierung „Werke der Propheten“ bleibt im Haupttext erhalten und wird nur in der Fußnote behutsam erläutert.
