base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/010.yaml
  text: And Judas said[a], “Far be it from me to do this thing—to flee from them. And if our time has drawn near, let us die bravely for the sake of our brothers[b], and let us not leave a cause for reproach to our glory.”
translation:
  language: de
  text: 'Und Judas sagte: »Niemals werde ich so etwas tun: vor ihnen fliehen! Unsere Zeit ist nahe.[a] Lasst uns tapfer[b] für unsere Brüder sterben und keinen Grund zum Vorwurf gegen unsere Ehre[c] hinterlassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann die entscheidende oder festgesetzte Zeit bezeichnen; im Zusammenhang ist wohl der nahende Tod im Kampf gemeint.
    reason: lexical_ambiguity
  - marker: b
    text: 'Auch: »mutig«; die griechische Wendung ist wörtlich mit männlicher Tapferkeit verbunden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »unseren Ruhm« beziehungsweise »unser Ansehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή μοι γένοιτο
  choice: Niemals werde ich
  rationale: Die griechische Wendung drückt eine entschiedene persönliche Zurückweisung aus. Die deutsche Formulierung ist natürlich und bewahrt die Stärke der Aussage.
- source_word: ποιῆσαι τὸ πρᾶγμα τοῦτο, φυγεῖν ἀπʼ αὐτῶν
  choice: so etwas tun und vor ihnen fliehen
  rationale: Der Infinitiv φυγεῖν erläutert, worin »so etwas« besteht. Die koordinierte deutsche Fassung gibt diesen Zusammenhang verständlich wieder, ohne den konkreten Gedanken der Flucht abzuschwächen.
- source_word: ἤγγικεν ὁ καιρὸς ἡμῶν
  choice: Unsere Zeit ist nahe gekommen
  rationale: Das Perfekt ἤγγικεν wird indikativisch wiedergegeben; im griechischen Text steht keine Bedingung. καιρός bleibt als »Zeit« bewusst offen zwischen entscheidendem Zeitpunkt und nahendem Tod.
- source_word: ἀποθάνωμεν ἀνδρίᾳ
  choice: Lasst uns tapfer sterben
  rationale: Die Wendung bezeichnet mutiges, heldenhaftes Handeln. »Tapfer« ist im modernen Deutsch natürlich; die geschlechtlich geprägte Bildsprache wird in der Fußnote dokumentiert.
- source_word: χάριν τῶν ἀδελφῶν ἡμῶν
  choice: für unsere Brüder
  rationale: χάριν mit Genitiv bedeutet »um ... willen« bzw. »für«. Das ausdrücklich maskuline ἀδελφῶν wird im militärisch-volklichen Zusammenhang als »Brüder« beibehalten.
- source_word: μὴ καταλίπωμεν αἰτίαν τῇ δόξῃ ἡμῶν
  choice: keinen Grund zum Vorwurf gegen unsere Ehre hinterlassen
  rationale: αἰτία kann Grund, Beschuldigung oder Vorwurf bedeuten; καταλίπωμεν bezeichnet das Zurück- bzw. Hinterlassen. »Ehre« trifft δόξα im vorliegenden Ehr- und Schandkontext natürlicher als »Herrlichkeit«, während die mögliche Bedeutung »Ruhm/Ansehen« in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Aussage oder Bedingung bei ἤγγικεν ὁ καιρὸς ἡμῶν
  choice: Unsere Zeit ist nahe gekommen
  alternative: Wenn unsere Zeit nahe gekommen ist
  rationale: Der griechische Text enthält καί und einen Indikativ, aber keine Bedingungspartikel. Daher wird die Nähe der Zeit als Aussage wiedergegeben und nicht hypothetisch abgeschwächt.
- issue: Bedeutung von καιρός
  choice: Zeit
  alternative: Stunde / festgesetzter Zeitpunkt / Todesstunde
  rationale: »Zeit« bewahrt die feierliche Offenheit des Ausdrucks. Der Kontext legt den nahenden Tod im Kampf nahe, doch der griechische Wortlaut benennt ihn nicht ausdrücklich.
- issue: Maskulines ἀδελφῶν
  choice: Brüder
  alternative: Geschwister / Landsleute
  rationale: Die maskuline Form und der militärische Zusammenhang sprechen für die Beibehaltung von »Brüder«; eine geschlechtsneutrale oder rein nationale Deutung wäre enger als der Wortlaut.
- issue: δόξα im Ehr- und Schandkontext
  choice: Ehre
  alternative: Ruhm / Ansehen / Herrlichkeit
  rationale: Hier geht es um einen bleibenden Vorwurf, der Judas und seine Gefährten entehrt. »Ehre« entspricht diesem Zusammenhang, ohne die möglichen Nuancen von Ruhm und öffentlichem Ansehen auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, entschlossener Rede. Die Aussage über die nahende Zeit folgt gegen die englische Konsultationsfassung dem griechischen Indikativ ohne eingefügte Bedingung. Archaische Wörter wie »mannhaft« werden im Haupttext vermieden, ihre Quellnuance aber in der Fußnote festgehalten.
