  text: And they seized from the men of the country fifty men who were leaders of wickedness[a], and he killed them.
translation:
  language: de
  text: Und unter den Männern des Landes ergriffen sie fünfzig Männer, die Anführer der Bosheit waren, und er tötete sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνέλαβον
  choice: sie ergriffen
  rationale: Das Verb bezeichnet das Ergreifen oder Festnehmen von Personen. „Ergriffen“ bewahrt die unmittelbare Aussage, ohne ausdrücklich ein förmliches Gerichtsverfahren vorauszusetzen.
- source_word: ἀπὸ τῶν ἀνδρῶν τῆς χώρας
  choice: unter den Männern des Landes
  rationale: ἀπό bezeichnet hier die Auswahl aus einer größeren Gruppe. „Unter den Männern des Landes“ gibt diesen partitiven Sinn im Deutschen natürlicher wieder als eine wörtliche Formulierung mit „von“.
- source_word: τῶν ἀρχηγῶν
  choice: die Anführer
  rationale: ἀρχηγός bezeichnet führende Personen. „Anführer“ ist hier klar und weniger ausdeutend als „Rädelsführer“.
- source_word: τῆς κακίας
  choice: der Bosheit
  rationale: κακία kann Bosheit, Schlechtigkeit oder böses Handeln bezeichnen. „Der Bosheit“ wahrt die Genitivkonstruktion und lässt offen, ob führende Vertreter des Bösen oder führende Übeltäter gemeint sind.
- source_word: εἰς πεντήκοντα ἄνδρας
  choice: fünfzig Männer
  rationale: Die Wendung nennt die Gesamtzahl. Im natürlichen Deutschen kann εἰς unausgedrückt bleiben, ohne die genaue Zahl abzuschwächen.
- source_word: ἀπέκτεινεν
  choice: er tötete
  rationale: Der Singular bedeutet schlicht „er tötete“. Diese Wiedergabe vermeidet die zusätzliche gerichtliche Nuance von „hinrichten“.
theological_decisions:
- issue: Wechsel vom pluralischen zum singularischen Subjekt im letzten Satzteil
  choice: „und er tötete sie“
  alternative: „und sie töteten sie“
  rationale: Der griechische Text wechselt ausdrücklich von συνέλαβον („sie ergriffen“) zu ἀπέκτεινεν („er tötete“). Der grammatische Spannungsbogen wird nicht harmonisiert; wer mit „er“ gemeint ist, bleibt dem Kontext überlassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen; der auffällige Wechsel von „sie“ zu „er“ wird bewusst bewahrt.
