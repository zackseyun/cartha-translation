translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Satzführung. Die Wiederholung der beiden Bewegungsverben wird als „brachen auf und zogen“ bewahrt. Die genuine metonymische Spannung bei ἵπποις bleibt im Haupttext sichtbar und wird nicht stillschweigend zu „Reitern“ aufgelöst.
