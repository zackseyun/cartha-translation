  text: And they set out and went to Berea with twenty thousand men and two thousand horsemen[a].
translation:
  language: de
  text: Und sie brachen auf und zogen nach Beröa, mit zwanzigtausend Mann und zweitausend Pferden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zweitausend Pferde“; im militärischen Zusammenhang sind damit wahrscheinlich berittene Truppen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆραν
  choice: brachen auf
  rationale: Das Verb bezeichnet idiomatisch den Aufbruch. „Brachen auf“ ist natürliches modernes Deutsch und legt nicht unnötig fest, ob ausdrücklich ein Lager abgebrochen wurde.
- source_word: ἐπορεύθησαν
  choice: zogen
  rationale: Im militärischen Erzählzusammenhang gibt „zogen“ die Bewegung einer Truppe angemessen wieder, ohne die stärkere Nuance von „marschierten“ in den griechischen Ausdruck hineinzulesen.
- source_word: εἰς Βερέαν
  choice: nach Beröa
  rationale: Die Präposition εἰς bezeichnet hier die Richtung zu einem Ort. „Beröa“ ist die im Deutschen etablierte biblische Form des Ortsnamens.
- source_word: ἐν εἴκοσι χιλιάσιν ἀνδρῶν
  choice: mit zwanzigtausend Mann
  rationale: ἐν bezeichnet in dieser Konstruktion die mitziehende Truppenstärke. „Mit“ ist im Deutschen idiomatisch; „Mann“ ist nach einer Zahl die übliche militärische Mengenangabe.
- source_word: δισχιλίοις ἵπποις
  choice: zweitausend Pferden
  rationale: Der griechische Text nennt wörtlich „Pferde“. Diese Formulierung bleibt im Haupttext erhalten, während die wahrscheinlich gemeinten Reitertruppen in der Fußnote erläutert werden.
