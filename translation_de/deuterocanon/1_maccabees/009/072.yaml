  naturalness: Modernes Standarddeutsch, klar und gut lesbar. Die doppelte Rückkehrmetaphorik in „kehrte er um und zog ... zurück“ wirkt jedoch leicht redundant; ohne das zweite „zurück“ bleibt der Bewegungsablauf natürlich und präzise.
  terminology: „Gefangene“ gibt τὴν αἰχμαλωσίαν im vorliegenden kollektiven Sinn treffend wieder; die Fußnote erläutert die wörtlich abstrakte Form sachgerecht. „Land Juda“ und „ihr Gebiet“ sind im Kontext passend. Keine theologischen Terminologiefragen.
