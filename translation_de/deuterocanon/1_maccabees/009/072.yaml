  text: And he returned to him the captives whom he had formerly taken captive from the land of Judah[a], and he turned back and went away to his own land[b], and he no longer came again into their borders.
translation:
  language: de
  text: Und er gab ihm die Gefangenen zurück, die er zuvor aus dem Land Juda gefangen genommen hatte[a]. Dann kehrte er um und zog in sein eigenes Land; er kam nicht wieder in ihr Gebiet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „die Gefangenschaft“; gemeint ist hier die Gesamtheit der gefangen genommenen Menschen.
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung bedeutet wörtlich etwa „er fügte nicht mehr hinzu zu kommen“; gemeint ist, dass er nicht wieder beziehungsweise nicht länger in ihr Gebiet kam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: gab … zurück
  rationale: Das Verb bezeichnet die Rückgabe dessen, was zuvor genommen worden war; „gab … zurück“ ist im Deutschen natürlich und präzise.
- source_word: τὴν αἰχμαλωσίαν
  choice: die Gefangenen
  rationale: Das griechische Abstraktum „Gefangenschaft“ bezeichnet hier kollektiv die gefangen genommenen Menschen. Die konkrete Wiedergabe vermeidet im Deutschen ein Missverständnis.
- source_word: ᾐχμαλώτευσεν
  choice: gefangen genommen hatte
  rationale: Die Form bezeichnet eine bereits zuvor erfolgte Gefangennahme und bewahrt die Wortverbindung mit „die Gefangenen“.
- source_word: τὸ πρότερον
  choice: zuvor
  rationale: Die Wendung verweist knapp und idiomatisch auf einen früheren Zeitpunkt.
- source_word: ἐκ γῆς Ἰούδα
  choice: im Land Juda
  rationale: Im Zusammenhang mit dem Gefangennehmen gibt „im Land Juda“ den Herkunfts- beziehungsweise Handlungsbereich natürlich wieder; das im Griechischen ausdrücklich genannte „Land“ bleibt erhalten.
- source_word: ἀποστρέψας
  choice: Dann kehrte er um
  rationale: Die finite Wiedergabe macht die Abfolge der Handlungen im Deutschen klar, ohne dem Text zusätzliche Inhalte hinzuzufügen.
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: zog in sein eigenes Land zurück
  rationale: „Zog … zurück“ verbindet die Abreise mit der Rückkehr ins eigene Land und gibt αὐτοῦ betont als „sein eigenes“ wieder.
- source_word: οὐ προσέθετο ἔτι ἐλθεῖν
  choice: er kam nicht wieder
  rationale: Die griechische Konstruktion mit προστίθημι und Infinitiv bezeichnet die Nichtwiederholung beziehungsweise das Ende einer Handlung. „Kam nicht wieder“ ist idiomatisch und lässt offen, ob ein einmaliges erneutes Kommen oder fortgesetzte Einfälle im Blick stehen.
- source_word: τὰ ὅρια αὐτῶν
  choice: ihr Gebiet
  rationale: ὅρια kann Grenzen, Grenzland oder das dadurch bestimmte Gebiet bezeichnen. „Gebiet“ passt zur Bewegung mit „in“ und zum militärisch-geografischen Zusammenhang.
