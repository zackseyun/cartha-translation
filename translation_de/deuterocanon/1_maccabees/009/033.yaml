base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/033.yaml
  text: And Jonathan and Simon his brother[a], and all those with him, learned of it[b], and they fled into the wilderness of Tekoa and encamped by the water of the cistern of Asphar.
translation:
  language: de
  text: Jonathan, sein Bruder Simon und alle, die bei ihm waren, erfuhren davon[a]. Sie flohen in die Wüste von Tekoa und schlugen ihr Lager am Wasser der Zisterne[b] von Asfar auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kamen zu der Erkenntnis“ oder „erkannten es“. Im Griechischen bleibt das Objekt unausgesprochen und ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: „Zisterne“ kann auch mit „Grube“ oder „Brunnen“ wiedergegeben werden. Die Verbindung „Wasser der Zisterne“ weist auf eine Wasserstelle oder einen Wasserspeicher hin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: erfuhren davon
  rationale: Der Aorist von γινώσκω bezeichnet hier, dass die Gruppe von der zuvor geschilderten Entwicklung Kenntnis erhielt. Das im Griechischen unausgesprochene Objekt wird aus dem Zusammenhang mit „davon“ aufgenommen.
- source_word: ἔφυγον
  choice: sie flohen
  rationale: Das Verb bezeichnet eine Flucht angesichts drohender Gefahr und bewahrt so die Dringlichkeit der Handlung.
- source_word: ἔρημον Θεκώε
  choice: die Wüste von Tekoa
  rationale: ἔρημος bezeichnet hier die unbewohnte, wüstenartige Gegend bei Tekoa. „Wüste“ ist im Deutschen eine natürliche geografische Wiedergabe.
- source_word: παρενέβαλον
  choice: schlugen ihr Lager auf
  rationale: Das Verb bezeichnet im erzählenden und militärischen Zusammenhang das Errichten eines Lagers. Die deutsche Wendung ist gegenwärtig, klar und würdevoll.
- source_word: ἐπὶ τὸ ὕδωρ
  choice: am Wasser
  rationale: Bei einem Lagerplatz gibt ἐπί mit Akkusativ hier die Lage an einer Wasserstelle an. „Am Wasser“ ist die natürliche deutsche Formulierung.
- source_word: λάκκου
  choice: Zisterne
  rationale: λάκκος kann Grube, Brunnen oder Zisterne bedeuten. In Verbindung mit „Wasser“ liegt ein Wasserspeicher oder eine Wasserstelle nahe; „Zisterne“ passt am besten, ohne die lexikalische Spannweite zu verschweigen.
- source_word: Ἀσφάρ
  choice: Asfar
  rationale: Der Ortsname wird nach der griechischen Form ins Deutsche übertragen; griechisches φ wird dabei mit „f“ wiedergegeben.
