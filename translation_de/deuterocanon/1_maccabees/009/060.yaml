  text: And he refrained from coming with a large force[a], and secretly sent letters to all his allies in Judea, so that they might seize Jonathan and those with him; but they were not able[b], because their plan became known to them.
translation:
  language: de
  text: Er nahm davon Abstand, mit einer großen Streitmacht zu kommen, und sandte heimlich Briefe an alle seine Verbündeten in Judäa, um Jonatan und seine Begleiter ergreifen zu lassen. Doch er konnte es nicht[a], denn ihr Plan war ihnen bekannt geworden.[b]
