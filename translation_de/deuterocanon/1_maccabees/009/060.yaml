    reason: grammatical_ambiguity
  - marker: b
    text: 'Wörtlicher: „Denn ihr Plan war ihnen bekannt geworden.“ Der Zusammenhang legt nahe, dass Jonatan und seine Begleiter von dem gegen sie gerichteten Plan erfuhren; die griechischen Pronomen sind jedoch verdichtet.'
    reason: pronoun_clarification
lexical_decisions:
- source_word: ἀπῆρεν τοῦ ἐλθεῖν
  choice: nahm davon Abstand, … zu kommen
  rationale: Die Wendung bezeichnet das Ablassen von einer beabsichtigten Handlung. Diese Formulierung ist im modernen Deutschen natürlich und lässt das Motiv offen.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: mit einer großen Streitmacht
  rationale: δύναμις bezeichnet hier militärische Kräfte, ohne zwingend ein vollständig organisiertes Heer vorauszusetzen.
- source_word: ἐπιστολὰς λάθρᾳ
  choice: sandte heimlich Briefe
  rationale: λάθρᾳ kennzeichnet das Versenden als verborgen oder heimlich.
- source_word: πᾶσι τοῖς συμμάχοις αὐτοῦ τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: an alle seine Verbündeten in Judäa
  rationale: σύμμαχοι bezeichnet politische oder militärische Verbündete; die Ortsangabe wird knapp und eindeutig angeschlossen.
- source_word: ὅπως συλλάβωσι
  choice: damit sie … ergriffen
  rationale: συλλαμβάνω bedeutet hier ergreifen oder gefangen nehmen. „Ergriffen“ vermeidet eine unnötig moderne rechtliche Färbung.
- source_word: τοὺς σὺν αὐτῷ
  choice: seine Begleiter
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet diejenigen, die bei Jonatan waren, ohne ihre genauere Rolle festzulegen.
- source_word: οὐκ ἠδύνατο
  choice: sie konnten es nicht
  rationale: Obwohl das griechische Verb im Singular steht, legt der Zusammenhang eine kollektive Beziehung auf die Verbündeten nahe. Die grammatische Alternative wird in einer Fußnote bewahrt.
- source_word: ἔγνωσθη αὐτοῖς ἡ βουλὴ αὐτῶν
  choice: Jonatan und seine Begleiter hatten von ihrem Plan erfahren
  rationale: 'Die komprimierten Pronomen werden für verständliches Deutsch anhand des Zusammenhangs aufgelöst: Der Plan der Verschwörer wurde den vorgesehenen Opfern bekannt.'
