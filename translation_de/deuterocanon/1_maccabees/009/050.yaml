  register: Moderne, würdevolle Standardsprache mit klarer militärischer Terminologie. Die Ortsnamen werden teils in eingebürgerter deutscher Form, bei unsicher überlieferten Namen jedoch nahe am vorliegenden griechischen Text wiedergegeben. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ortsnamen.
