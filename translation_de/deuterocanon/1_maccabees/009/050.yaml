base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/050.yaml
  text: 'And they returned to Jerusalem and built fortified cities in Judea: the stronghold in Jericho[a], and Emmaus, and Beth-horon, and Bethel, and Thamnatha-pharathon, and Tephon[b], with high walls and gates and bars.'
translation:
  language: de
  text: 'Dann kehrten sie nach Jerusalem zurück und bauten in Judäa befestigte Städte: die Festung in Jericho, Emmaus, Bet-Horon, Bet-El, Temanata-Faraton[a] und Tefon[b], mit hohen Mauern, Toren und Riegeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname Temanata-Faraton wird in anderen Überlieferungen auch als „Timnat-Faraton“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Tefon ist eine Umschrift der griechischen Namensform; in anderen Überlieferungen findet sich auch die Schreibung „Tafon“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: kehrten … zurück
  rationale: Gibt die Rückkehr an einen früheren Ort natürlich und richtungsgetreu wieder.
- source_word: ᾠκοδόμησαν
  choice: bauten
  rationale: Das Verb bezeichnet das Bauen oder Errichten; ein ausdrückliches Wiederaufbauen ist im Griechischen nicht markiert.
- source_word: πόλεις ὀχυρὰς
  choice: befestigte Städte
  rationale: Diese geläufige deutsche Wendung gibt den militärischen Sinn von ὀχυρός klar wieder.
- source_word: τὸ ὀχύρωμα
  choice: die Festung
  rationale: Das Substantiv bezeichnet eine befestigte Anlage; „Festung“ passt zum militärischen Zusammenhang und lässt ihre genaue Gestalt offen.
- source_word: Ἰερειχὼ
  choice: Jericho
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: Ἐμμαοὺμ
  choice: Emmaus
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: Βεθωρὼν
  choice: Bet-Horon
  rationale: Im Deutschen gebräuchliche, gut lesbare Wiedergabe des semitischen Ortsnamens.
- source_word: Βαιθὴλ
  choice: Bet-El
  rationale: Transparente deutsche Schreibung des bekannten Ortsnamens.
- source_word: Θεμανάθα Φαραθὼν
  choice: Temanata-Faraton
  rationale: Folgt in deutscher Umschrift eng der vorliegenden griechischen Namensform, ohne sie nach einer anderen Überlieferung zu vereinheitlichen.
- source_word: Τεφών
  choice: Tefon
  rationale: Direkte deutsche Umschrift der in der griechischen Vorlage gebotenen Form.
- source_word: ἐν τείχεσιν ὑψηλοῖς
  choice: mit hohen Mauern
  rationale: Das instrumentale beziehungsweise beschreibende ἐν wird im Deutschen idiomatisch mit „mit“ wiedergegeben.
- source_word: πύλαις καὶ μοχλοῖς
  choice: Toren und Riegeln
  rationale: Bewahrt die konkreten Bestandteile der Befestigungsanlagen und die Reihung des Griechischen.
