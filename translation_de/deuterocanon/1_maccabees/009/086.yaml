  yaml_path: translation/deuterocanon/1_maccabees/009/086.yaml
  text: From there Jonathan moved on and encamped at Ashkelon[a], and those from the city came out to meet him with great honor.
translation:
  language: de
  text: Von dort zog Jonatan weiter und schlug bei Aschkelon sein Lager auf. Die Leute aus der Stadt kamen ihm mit großen Ehren entgegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Textzeile bei Swete bricht nach καὶ ἐπέ- ab. Der Satz bis »mit großen Ehren« ist jedoch vollständig und lässt sich für diesen Versabschnitt sicher übersetzen.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: Von dort
  rationale: Gibt den räumlichen Übergang knapp und natürlich wieder.
- source_word: Ἰωναθάν
  choice: Jonatan
  rationale: Verwendet die im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: παρενέβαλεν εἰς Ἀσκάλωνα
  choice: schlug bei Aschkelon sein Lager auf
  rationale: Bewahrt den militärischen Sinn des Verbs; »bei« ist im Deutschen bei einer Lagerstätte natürlicher als ein wörtliches »nach/in«.
- source_word: ἐξῆλθον οἱ ἐκ τῆς πόλεως
  choice: Die Leute aus der Stadt kamen ... entgegen
  rationale: Wahrt die Unbestimmtheit des griechischen Ausdrucks, ohne ihn ausdrücklich auf sämtliche Einwohner festzulegen.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: kamen ihm ... entgegen
  rationale: Ist die natürliche deutsche Wiedergabe der idiomatischen Wendung und schließt das Herauskommen aus der Stadt ein.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: mit großen Ehren
  rationale: δόξα bezeichnet hier die ehrenvolle, feierliche Aufnahme; der Plural ist im Deutschen für eine besonders ehrenvolle Begrüßung idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. »Zog ... weiter« macht die im vorgelegten griechischen Ausschnitt elliptische Verbindung von ἐκεῖθεν mit »Jonatan« natürlich verständlich; die eigentliche finite Handlung bleibt das Aufschlagen des Lagers.
