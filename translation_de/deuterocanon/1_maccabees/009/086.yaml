  text: ἐκεῖθεν Ἰωναθάν, καὶ παρενέβαλεν εἰς Ἀσκάλωνα, καὶ ἐξῆλθον οἱ ἐκ τῆς πόλεως εἰς συνάντησιν αὐτῷ ἐν δόξῃ μεγάλῃ. καὶ ἐπέ-
