base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/089.yaml
  text: a gold buckle[a], as is customary to give to the kinsmen of kings[b]; and he gave him Accaron and all its territories as an inheritance.
translation:
  language: de
  text: eine goldene Spange[a], wie sie gewöhnlich den Verwandten der Könige gegeben wird; und er gab ihm Akkaron[b] und sein ganzes Gebiet zum Erbbesitz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht nur das feminine Adjektiv »golden«; das Substantiv ist aus dem vorherigen Zusammenhang zu ergänzen. Neben »Spange« sind auch »Fibel« oder »Schmuckstück« möglich.
    reason: lexical_alternative
  - marker: b
    text: Akkaron ist die griechische Form des Ortsnamens, der gewöhnlich als Ekron bekannt ist.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσῆν
  choice: eine goldene Spange
  rationale: Das feminine Adjektiv bedeutet »golden«; der zugehörige Gegenstand ist im Vers ausgelassen und aus dem vorherigen Zusammenhang zu ergänzen. »Spange« ist im Deutschen eine natürliche, aber als Ergänzung kenntlich zu machende Wiedergabe.
- source_word: ἔθος
  choice: gewöhnlich
  rationale: Die Wendung ὡς ἔθος ἐστὶν διδόσθαι bezeichnet eine übliche Praxis; die passive deutsche Formulierung gibt sie flüssig und nah am Griechischen wieder.
- source_word: συγγενεῦσιν
  choice: den Verwandten
  rationale: Das Wort bezeichnet Angehörige beziehungsweise Verwandte. »Verwandten« ist im modernen Standarddeutsch natürlich und bewahrt den familiären Sinn.
- source_word: τῶν βασιλέων
  choice: der Könige
  rationale: Der Genitiv Plural wird direkt wiedergegeben, ohne ihn zu »Mitgliedern der Königsfamilie« auszudeuten.
- source_word: Ἀκκαρὼν
  choice: Akkaron
  rationale: Die griechische Namensform wird in einer dem Deutschen entsprechenden Umschrift wiedergegeben; die geläufigere Form »Ekron« wird in einer Fußnote genannt.
- source_word: ὅρια
  choice: Gebiet
  rationale: Im Zusammenhang einer Landzuteilung bezeichnet der Plural nicht nur Grenzlinien, sondern das gesamte zugehörige Territorium. Der deutsche Singular »Gebiet« ist hier idiomatisch.
- source_word: εἰς κληρονομίαν
  choice: zum Erbbesitz
  rationale: Die Wendung bezeichnet die Zuweisung als erblichen Besitz. »Zum Erbbesitz« wahrt den rechtlichen Charakter knapp und verständlich.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Standardstil. Die einleitende Kleinschreibung bleibt erhalten, weil der Vers als Fortsetzung des vorangehenden Satzes überliefert ist. Das Semikolon bewahrt die Gliederung des griechischen Satzes; die interpretative Ergänzung »Spange« wird durch eine Fußnote transparent gemacht.
