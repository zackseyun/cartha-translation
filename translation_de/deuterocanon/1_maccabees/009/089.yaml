  text: χρυσῆν, ὡς ἔθος ἐστὶν διδόσθαι τοῖς συγγενεῦσιν τῶν βασιλέων· καὶ ἔδωκεν αὐτῷ τὴν Ἀκκαρὼν καὶ πάντα τὰ ὅρια αὐτῆς εἰς κληρονομίαν. XI
