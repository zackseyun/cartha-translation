lexical_decisions:
- source_word: φάλαγγα
  choice: die Schlachtreihe
  rationale: φάλαγξ bezeichnet eine geschlossene militärische Formation oder Schlachtreihe. „Schlachtreihe“ ist im modernen Deutschen unmittelbar verständlich und bewahrt als Akkusativ den fragmentarischen Anschluss an den verlorenen Satzanfang.
- source_word: ἡ ἵππος
  choice: die Reiterei
  rationale: Der Singular ἵππος wird hier kollektiv für berittene Truppen gebraucht. „Reiterei“ gibt diesen militärischen Sinn natürlich wieder.
- source_word: ἐξελύθη
  choice: löste sich auf
  rationale: Das Verb bezeichnet ein Auseinanderlösen oder Zusammenbrechen der Formation. „Löste sich auf“ wahrt das Bild, ohne ausdrücklich eine vollständige Niederlage hinzuzufügen.
- source_word: συνετρίβησαν
  choice: wurden zerschlagen
  rationale: Das Verb drückt gewaltsames Zerbrechen und im militärischen Zusammenhang eine schwere Niederlage aus. „Zerschlagen“ ist kräftig, idiomatisch und sachgerecht.
- source_word: ἀπʼ αὐτοῦ
  choice: von ihm
  rationale: Bei der passiven Verbform kann ἀπό den Urheber bezeichnen. „Von ihm“ gibt diese naheliegende Beziehung knapp wieder, ohne den nicht genannten Bezug der männlichen Einzahl zu bestimmen.
- source_word: ἐσκορπίσθη
  choice: zerstreute sich
  rationale: Die Form beschreibt das Auseinandergetriebenwerden beziehungsweise die Zerstreuung der Truppe. Die reflexive deutsche Form ist im erzählenden Militärkontext natürlich.
- source_word: ἐν τῷ πεδίῳ
  choice: in der Ebene
  rationale: πεδίον bezeichnet hier offenes, ebenes Gelände. „In der Ebene“ passt besser zum militärischen Schauplatz als „auf dem Feld“.
- source_word: ἔφυγον εἰς
  choice: sie flohen nach
  rationale: εἰς verlangt ein Ziel, das im erhaltenen Wortlaut fehlt. Die unvollständige Formulierung „sie flohen nach“ bildet den Abbruch sichtbar ab, ohne fehlenden Inhalt zu ergänzen.
