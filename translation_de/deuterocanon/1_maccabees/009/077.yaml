  yaml_path: translation/deuterocanon/1_maccabees/009/077.yaml
  text: He encamped three thousand cavalry and a large force[a], and went to Azotus as though passing through; at the same time he was leading them into the plain[c][b], because he had a multitude of cavalry and trusted in it.
translation:
  language: de
  text: Er ließ dreitausend Reiter und eine große Streitmacht lagern und zog nach Aschdod, als wollte er nur hindurchziehen.[a] Zugleich führte er sie in die Ebene, denn er verfügte über eine große Zahl von Reitern und setzte sein Vertrauen darauf.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „als zöge er hindurch“. Die Formulierung kann den bloßen Anschein eines Durchzugs und damit ein Täuschungsmanöver bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Pronomen steht im Singular und kann sich auf die Streitmacht insgesamt oder besonders auf die Reiterei als Grundlage seines Vertrauens beziehen.
    reason: lexical_alternative
  - marker: c
    text: Die vorliegende griechische Quelleneinheit bricht mitten im Wort ab (καὶ κατε-) und der Satz wird im folgenden Vers fortgesetzt. Hier ist nur der vollständig erhaltene Teil wiedergegeben.
    reason: textual_variant
lexical_decisions:
- source_word: παρενέβαλεν τρισχιλίαν ἵππον καὶ δύναμιν πολλήν
  choice: Er schlug mit dreitausend Reitern und einer großen Streitmacht sein Lager auf
  rationale: παρεμβάλλω bezeichnet im militärischen Zusammenhang das Aufschlagen eines Lagers. Die griechischen Akkusative werden im Deutschen idiomatisch als die mitgeführte beziehungsweise eingesetzte Truppe wiedergegeben; „Reiter“ ist für das kollektiv gebrauchte ἵππος natürlich und präzise.
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: zog nach Aschdod
  rationale: ἐπορεύθη bezeichnet die Bewegung zum Ort; „zog“ passt zum militärischen Erzählzusammenhang. Für Ἄζωτος wird die im Deutschen geläufige biblische Ortsform „Aschdod“ verwendet.
- source_word: ὡς διοδεύων
  choice: als wollte er nur hindurchziehen
  rationale: ὡς mit Partizip kennzeichnet hier den Anschein beziehungsweise die vorgegebene Absicht. „Nur“ macht die naheliegende Täuschungsnuance verständlich, ohne sie als ausdrücklich erklärte List festzuschreiben.
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: Zugleich führte er sie in die Ebene
  rationale: ἅμα bedeutet „zugleich“; προσάγω hat hier den kausativen Sinn „heranführen/führen“. Das im Griechischen unausgesprochene Objekt wird aus dem unmittelbaren Zusammenhang als seine Truppen ergänzt.
- source_word: διὰ τὸ ἔχειν αὐτὸν πλῆθος ἵππου
  choice: denn er verfügte über eine große Zahl von Reitern
  rationale: Die Konstruktion nennt den Grund für sein Vorgehen. πλῆθος ἵππου ist eine kollektive militärische Bezeichnung und wird in natürlichem Deutsch als „eine große Zahl von Reitern“ wiedergegeben.
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: setzte sein Vertrauen darauf
  rationale: Der Perfektinfinitiv bezeichnet gefestigtes Vertrauen. Das deutsche „darauf“ lässt den Bezug des femininen Pronomens offen, statt ihn eindeutig auf die gesamte Streitmacht oder speziell auf die Reiterei festzulegen.
