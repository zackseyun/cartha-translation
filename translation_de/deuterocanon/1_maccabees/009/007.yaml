  yaml_path: translation/deuterocanon/1_maccabees/009/007.yaml
  text: And Judas saw that his camp was failing, because the battle was pressing hard on him; and he was crushed in heart, because he had no time to gather them together.
translation:
  language: de
  text: Und Judas sah, dass sein Heer nachgab[a], weil der Kampf ihn hart bedrängte. Er wurde im Herzen zerschlagen, denn er hatte keine Zeit, sie zusammenzurufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut nach „Judas sah“ ist knapp und elliptisch: Bei „seiner Streitmacht“ fehlt ein ausdrücklich genanntes Prädikat. Die Übersetzung versteht aus dem folgenden Hinweis auf den Kampfdruck, dass Judas sein Heer nachgeben sah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ αὐτοῦ
  choice: sein Heer
  rationale: παρεμβολή kann ein Lager oder die dort versammelte Streitmacht bezeichnen. Im unmittelbaren Kampfgeschehen ist „sein Heer“ im Deutschen natürlicher und macht den Bezug auf Judas’ Truppen deutlich, ohne den militärischen Sinn zu verengen.
- source_word: ὅτι ἡ παρεμβολὴ αὐτοῦ
  choice: dass sein Heer zurückwich
  rationale: Der überlieferte griechische Wortlaut ist nach „sah“ knapp und elliptisch; ein ausdrückliches Verb für das Heer fehlt. Aus dem folgenden Satzteil ergibt sich, dass Judas seine Streitmacht unter dem Druck des Kampfes weichen sah. Die Ergänzung wird durch eine Fußnote offengelegt.
- source_word: ὁ πόλεμος ἔθλιβεν αὐτόν
  choice: der Kampf ihn hart bedrängte
  rationale: πόλεμος bezeichnet hier die konkrete Schlacht, während das Imperfekt ἔθλιβεν fortdauernden starken Druck ausdrückt. „Hart bedrängte“ bewahrt dieses Bild in natürlichem Deutsch.
- source_word: συνετρίβη τῇ καρδίᾳ
  choice: wurde er im Herzen zerschlagen
  rationale: Die Formulierung erhält sowohl das Passiv als auch das eindringliche Bild des zerschlagenen Herzens, statt es lediglich als Traurigkeit zu umschreiben.
- source_word: καιρὸν
  choice: Zeit
  rationale: καιρός kann den geeigneten Zeitpunkt oder eine Gelegenheit meinen. In der dringlichen Lage ist „Zeit“ die natürliche Wiedergabe; die fehlende Gelegenheit ist darin mitgemeint.
- source_word: συναγαγεῖν αὐτούς
  choice: sie zusammenzurufen
  rationale: συνάγω bedeutet sammeln oder zusammenbringen. „Zusammenrufen“ passt zu verstreuten beziehungsweise weichenden Truppen, ohne das stärker deutende „neu formieren“ einzutragen.
