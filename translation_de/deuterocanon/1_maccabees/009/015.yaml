  text: And the right wing was crushed before them[b][a], and he pursued after them as far as the mountain of Azotus.
translation:
  language: de
  text: Da wurde der rechte Flügel[a] vor ihnen zerschlagen, und er verfolgte sie bis zum Berg von Aschdod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das rechte Horn“; gemeint ist die rechte Seite oder der rechte Flügel des Heeres.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis zum Bergland von Aschdod“. Der griechische Ausdruck kann einen einzelnen Berg oder das mit Aschdod verbundene Bergland bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνετρίβη
  choice: wurde … zerschlagen
  rationale: Das Passiv von συντρίβω bezeichnet ein Zerbrechen oder Zerschmettern. Im Kampfzusammenhang drückt „zerschlagen“ eine schwere Niederlage aus und bewahrt zugleich die bildhafte Kraft des griechischen Verbs.
- source_word: τὸ δεξιὸν κέρας
  choice: der rechte Flügel
  rationale: κέρας bedeutet wörtlich „Horn“, bezeichnet hier aber bildhaft eine Seite der Heeresaufstellung. „Rechter Flügel“ ist dafür der natürliche deutsche militärische Ausdruck.
- source_word: ἀπʼ αὐτῶν
  choice: vor ihnen
  rationale: ἀπό kennzeichnet hier im Zusammenhang des Zusammenbrechens wahrscheinlich das Zurückweichen unter dem Druck der Gegner. „Vor ihnen“ wahrt diese räumlich-kausale Nuance, ohne eindeutiger als der griechische Ausdruck eine direkte Urheberschaft zu behaupten.
- source_word: ἔδωκεν ὀπίσω αὐτῶν
  choice: er verfolgte sie
  rationale: Die idiomatische Wendung bezeichnet das Nachsetzen hinter den Fliehenden. Der Singular „er“ folgt der griechischen Verbform und lässt Judas als handelnden Heerführer erkennen, ohne ausdrücklich „seine Truppen“ zu ergänzen.
- source_word: ἕως Ἀζώτου ὄρους
  choice: bis zum Bergland von Aschdod
  rationale: Die Wortfolge kann ein mit Aschdod verbundenes Berg- oder Hügelland bezeichnen. „Aschdod“ ist die im Deutschen geläufige Form des Ortsnamens Ἄζωτος; die mögliche Deutung als einzelner Berg wird in der Fußnote bewahrt.
