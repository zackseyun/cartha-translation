base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/034.yaml
  text: And Bacchides learned of it on the Sabbath day[b][a], and he himself and all his army came to the other side of the Jordan.
translation:
  language: de
  text: Und Bakchides erfuhr am Sabbat[a] davon, und er selbst kam mit seinem ganzen Heer auf die andere Seite des Jordan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Tag der Sabbate“; die griechische Wendung bedeutet „am Sabbat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jenseits des Jordan“. Die griechische Wendung kann die Gegend jenseits des Flusses oder die Bewegung auf die andere Seite bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: erfuhr … davon
  rationale: Der Aorist von γινώσκω bezeichnet hier das Erlangen einer Information. Das im Griechischen unausgesprochene Objekt wird aus dem Zusammenhang mit „davon“ ergänzt.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: am Sabbat
  rationale: Die wörtlich pluralische Wendung ist eine geläufige griechische Bezeichnung für den einzelnen Sabbattag; „am Sabbat“ ist im Deutschen klar und natürlich.
- source_word: αὐτός
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist betont und hebt hervor, dass Bakchides persönlich mitkam.
- source_word: πᾶν τὸ στράτευμα αὐτοῦ
  choice: sein ganzes Heer
  rationale: στράτευμα bezeichnet hier die gesamte unter seinem Befehl stehende Streitmacht; „sein ganzes Heer“ gibt πᾶν unmittelbar und idiomatisch wieder.
- source_word: πέραν τοῦ Ἰορδάνη
  choice: auf die andere Seite des Jordan
  rationale: πέραν kann sowohl die jenseitige Region als auch im Bewegungskontext das Gelangen auf die andere Flussseite bezeichnen. Die Formulierung passt zu ἦλθεν, ohne die geografische Perspektive näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Name Βακχίδης wird als „Bakchides“ wiedergegeben. Die parataktische Erzählweise bleibt erhalten; ein Semikolon mit anschließendem „da“ macht den zeitlichen Handlungsfortgang natürlich verständlich.
