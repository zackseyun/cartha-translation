  yaml_path: translation/deuterocanon/1_maccabees/009/008.yaml
  text: And he was dismayed[a], and said to those who were left, “Let us rise and go up against our adversaries, if perhaps we are able to fight them.”
translation:
  language: de
  text: 'Da verlor er den Mut[a] und sagte zu denen, die noch übrig waren: »Stehen wir auf und ziehen wir gegen unsere Widersacher hinauf, wenn wir vielleicht gegen sie kämpfen können.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde schwach« oder »verzagte«; das griechische Verb kann körperliches Erschlaffen oder inneren Mutverlust bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελύθη
  choice: verlor er den Mut
  rationale: Das Passiv von ἐκλύω kann ein körperliches Erschlaffen oder einen inneren Zusammenbruch bezeichnen. Im Kampfzusammenhang gibt »verlor er den Mut« die emotionale Bedeutung natürlich wieder, ohne die mögliche körperliche Nuance auszuschließen; diese wird in der Fußnote genannt.
- source_word: τοῖς καταλειφθεῖσιν
  choice: zu denen, die noch übrig waren
  rationale: Das substantivierte Partizip bezeichnet die Zurückgebliebenen beziehungsweise Verbliebenen. Die Formulierung bleibt nah am Griechischen und legt nicht ausdrücklich fest, dass es sich um Überlebende handelt.
- source_word: Ἀναστῶμεν
  choice: Stehen wir auf
  rationale: Der auffordernde Konjunktiv wird als gemeinsame Aufforderung wiedergegeben. »Stehen wir auf« bewahrt sowohl die konkrete Bewegung als auch den militärischen Aufbruchscharakter.
- source_word: ἀναβῶμεν
  choice: ziehen wir … hinauf
  rationale: ἀναβαίνω bedeutet wörtlich »hinaufgehen«. »Hinaufziehen« klingt im militärischen Zusammenhang natürlich und bewahrt zugleich die mögliche topografische Richtung.
- source_word: τοὺς ὑπεναντίους ἡμῶν
  choice: unsere Widersacher
  rationale: ὑπεναντίος bezeichnet diejenigen, die einem entgegenstehen. »Widersacher« wahrt diesen oppositionellen Sinn genauer als das allgemeinere »Feinde«.
- source_word: ἐὰν ἄρα
  choice: wenn … vielleicht
  rationale: Die Verbindung drückt eine unsichere Bedingung beziehungsweise zögernde Hoffnung aus. Die deutsche Wendung erhält diese auffällige Unsicherheit, statt sie zu glätten.
- source_word: δυνώμεθα
  choice: wir … können
  rationale: Das Verb bezeichnet Fähigkeit oder Vermögen. Das moderne »können« ist hier klar und idiomatisch.
- source_word: πολεμῆσαι
  choice: gegen sie kämpfen
  rationale: Der Infinitiv bedeutet »kämpfen« oder »Krieg führen«. Im unmittelbaren Schlachtzusammenhang ist »kämpfen« die präzise und natürliche Wiedergabe.
