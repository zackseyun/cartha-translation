  yaml_path: translation/deuterocanon/1_maccabees/009/063.yaml
  text: And Bacchides learned of it and gathered all his forces[c][b][a], and he gave orders to those from Judea.
translation:
  language: de
  text: Bakchides erfuhr davon[a], zog seine gesamte Streitmacht[b] zusammen und erteilte denen aus Judäa[c] Befehle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „davon Kenntnis erhielt“. Das griechische Verb kann hier das Bekanntwerden einer Lage oder Entwicklung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seine ganze Menge“ oder „seine ganze Schar“. Gemeint ist hier wahrscheinlich die Gesamtheit seiner Truppen oder Gefolgsleute.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder möglicherweise: „denen in Judäa“. Im Griechischen steht wörtlich „denen aus Judäa“; damit können mit Judäa verbundene Personen gemeint sein und nicht nur Menschen, die sich dort aufhielten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: davon erfuhr
  rationale: Der Aorist von γινώσκω bezeichnet hier im Erzählzusammenhang wahrscheinlich das Bekanntwerden einer Entwicklung. „Davon erfuhr“ gibt diesen Übergang natürlich wieder.
- source_word: συνήγαγεν
  choice: zog … zusammen
  rationale: Das Verb bezeichnet das Zusammenbringen von Menschen für gemeinsames Handeln; im militärischen Zusammenhang ist „zog … zusammen“ idiomatisch und treffend.
- source_word: πᾶν τὸ πλῆθος αὐτοῦ
  choice: seine ganze Streitmacht
  rationale: Wörtlich steht „seine ganze Menge/Schar“. Der militärische Zusammenhang legt die Gesamtheit der ihm unterstehenden Truppen oder Gefolgsleute nahe; „Streitmacht“ ist präzise, ohne ausdrücklich ein reguläres Heer vorauszusetzen.
- source_word: τοῖς ἐκ τῆς Ἰουδαίας
  choice: denen aus Judäa
  rationale: Die Formulierung bewahrt die Grundbedeutung von ἐκ („aus“) und lässt offen, ob damit judäische Verbündete, Gefolgsleute oder andere mit Judäa verbundene Personen gemeint sind.
- source_word: παρήγγειλεν
  choice: gab … Befehle
  rationale: παραγγέλλω bedeutet hier, Anweisungen oder Befehle zu erteilen. Der militärische Kontext stützt „Befehle“.
