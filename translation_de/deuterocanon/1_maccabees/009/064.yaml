  yaml_path: translation/deuterocanon/1_maccabees/009/064.yaml
  text: And he came and encamped against Bethbasi[a], and fought against it for many days, and made siege engines.
translation:
  language: de
  text: Und er kam und schlug sein Lager vor Betbasi auf. Viele Tage lang kämpfte er gegen die Stadt und baute Belagerungsmaschinen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „baute Kriegsmaschinen“; das griechische Wort bezeichnet hier technische Vorrichtungen, die bei einer Belagerung eingesetzt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: und er kam
  rationale: Das aoristische Partizip führt die nächste Handlung ein; die finite Form gibt die Erzählfolge im Deutschen natürlich wieder.
- source_word: παρεβάλεν ἐπὶ
  choice: schlug sein Lager vor … auf
  rationale: Die militärische Wendung bezeichnet das Lagern gegen einen Ort. „Vor …“ ist im Deutschen für ein gegen eine befestigte Stadt gerichtetes Heerlager idiomatisch, ohne bereits jede Bedeutungsnuance auf „belagern“ zu verengen.
- source_word: Βεθβασί
  choice: Betbasi
  rationale: Der Ortsname wird nach deutscher Bibeltradition und Lautgestalt transliteriert.
- source_word: ἐπολέμησεν αὐτήν
  choice: kämpfte er gegen die Stadt
  rationale: πολεμέω bezeichnet Kriegführen oder Kämpfen. „Die Stadt“ macht den Bezug des femininen Pronomens im Deutschen eindeutig und natürlich.
- source_word: ἡμέρας πολλὰς
  choice: Viele Tage lang
  rationale: Der Akkusativ drückt die Dauer aus; diese Formulierung ist gegenwärtiges, idiomatisches Deutsch.
- source_word: ἐποίησεν μηχανάς
  choice: baute Belagerungsmaschinen
  rationale: μηχαναί sind in diesem militärischen Zusammenhang technische Vorrichtungen für eine Belagerung. Die Wiedergabe macht den Kontext verständlich, ohne eine bestimmte Maschinenart festzulegen.
