  text: And he accepted[a], and did according to his words, and swore to him not to seek harm against him all the days of his life.
translation:
  language: de
  text: Und er stimmte zu und handelte nach seinen Worten; und er schwor ihm, alle Tage seines Lebens gegen ihn nichts Böses zu unternehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
