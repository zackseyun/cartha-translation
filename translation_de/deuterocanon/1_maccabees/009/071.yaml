  naturalness: „An allen Tagen seines Lebens“ ist verständlich, wirkt in dieser Konstruktion mit „schwor“ jedoch weniger idiomatisch als „alle Tage seines Lebens“. Die Satzverknüpfung mit Semikolon bildet die griechische Reihung würdig und flüssig ab.
  terminology: „Stimmte zu“, „handelte nach seinen Worten“ und „schwor ihm“ sind angemessen. „Gegen ihn nichts Böses zu unternehmen“ wahrt die feindliche Ausrichtung, ohne den Sinn auf inneres Planen zu beschränken. Die Fußnote stellt die wörtlichere Formulierung bereit.
