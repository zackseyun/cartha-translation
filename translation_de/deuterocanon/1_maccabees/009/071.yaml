    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεδέξατο
  choice: stimmte zu
  rationale: Die mediale Verbform bezeichnet hier die Annahme des zuvor unterbreiteten Vorschlags beziehungsweise der Bedingungen. „Stimmte zu“ gibt dies im modernen Deutschen natürlicher wieder als das ohne Objekt unvollständige „nahm an“.
- source_word: ἐποίησεν κατὰ τοὺς λόγους αὐτοῦ
  choice: handelte nach seinen Worten
  rationale: Die Formulierung bleibt der griechischen Wendung eng verbunden und bezeichnet ein Handeln entsprechend dem Gesagten, ohne sie auf eine einzelne Anweisung zu verengen.
- source_word: ὤμοσεν αὐτῷ
  choice: schwor ihm
  rationale: „Schwor“ bewahrt die Feierlichkeit und Verbindlichkeit des griechischen Eidverbs; der Dativ wird direkt mit „ihm“ wiedergegeben.
- source_word: μὴ ἐκζητῆσαι αὐτῷ κακὸν
  choice: nichts Böses gegen ihn zu planen
  rationale: Im Zusammenhang bezeichnet die Wendung das feindselige Trachten oder Planen gegen jemanden. „Planen“ ist im Deutschen idiomatischer als „suchen“, während „nichts Böses gegen ihn“ die negative und personale Ausrichtung wahrt.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ
  choice: an allen Tagen seines Lebens
  rationale: Die Wiedergabe erhält die biblische Zeitformel und lässt wie der griechische Text offen, auf welchen männlichen Beteiligten das Pronomen im unmittelbaren Zusammenhang bezogen wird.
theological_decisions:
- issue: Bezug von αὐτοῦ in τῆς ζωῆς αὐτοῦ
  choice: „seines Lebens“ ohne namentliche Auflösung
  alternative: „solange Jonathan lebte“ beziehungsweise „solange er selbst lebte“
  rationale: Das griechische Pronomen nennt den Bezugsträger nicht ausdrücklich. Eine namentliche oder reflexive Auflösung würde die syntaktische Mehrdeutigkeit beseitigen, die der Ausgangstext stehen lässt.
translation_notes:
  register: Modernes, würdiges Erzählregister. Die Sätze sind klar gegliedert; die wiederholten Pronomen und die Lebenszeitformel bewahren die Nähe zum griechischen Text. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung, nicht bei „stimmte zu“.
