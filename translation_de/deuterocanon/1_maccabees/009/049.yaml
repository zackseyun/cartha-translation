translation:
  language: de
  text: Und an jenem Tag fielen auf der Seite des Bakchides etwa tausend Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In der Nähe von Bakchides fielen an jenem Tag etwa tausend Mann.“ Die griechische Wendung kann die Zugehörigkeit zu Bakchides oder die Nähe zu ihm bezeichnen; eine unmittelbare Täterschaft ist nicht ausdrücklich gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέπεσαν
  choice: fielen
  rationale: Das Verb bezeichnet im Kampfzusammenhang das Fallen beziehungsweise Sterben im Gefecht. „Fielen“ bewahrt das griechische Bild und ist im Deutschen als militärischer Ausdruck verständlich.
- source_word: παρὰ Βακχίδα
  choice: auf der Seite des Bakchides
  rationale: παρά mit Akkusativ bezeichnet hier wahrscheinlich die Zuordnung zu Bakchides beziehungsweise dessen Partei, nicht eindeutig seine unmittelbare Täterschaft. Die Formulierung gibt diesen Zusammenhang natürlich wieder, ohne „durch Bakchides“ hineinzulesen.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe des temporalen Dativs; „jenem“ entspricht dem rückverweisenden ἐκείνῃ.
- source_word: εἰς χιλίους ἄνδρας
  choice: etwa tausend Mann
  rationale: εἰς mit einer Zahl kann eine ungefähre Gesamtzahl beziehungsweise Größenordnung ausdrücken. „Etwa tausend Mann“ ist idiomatisch und bewahrt diese Nuance.
