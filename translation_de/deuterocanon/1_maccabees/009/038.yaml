  verdict: revise
  source_fidelity: Die Übersetzung gibt Erinnern, Johannes als ihren Bruder, das Hinaufgehen und das Sichverbergen zutreffend wieder. „Im Schutz des Berges“ schwächt jedoch die räumliche Relation von ὑπὸ („unter“) ab. „Unter dem Schutz des Berges“ bewahrt sowohl die Bildlichkeit als auch die Schutzbedeutung von σκέπη.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und hat einen angemessenen erzählenden Ton. „Unter dem Schutz des Berges“ ist idiomatisch und genauer als „im Schutz des Berges“.
  terminology: „Johannes“ ist die etablierte deutsche Bibelform für Ἰωάνου. „Schutz“ ist für σκέπη möglich, sollte aber durch „unter“ an die konkrete griechische Konstruktion gebunden werden. Die Fußnote sollte keine richtungsanzeigende Formulierung („unter die“) verwenden, da der deutsche Satz hier einen Ort des Verbergens beschreibt.
  issues:
