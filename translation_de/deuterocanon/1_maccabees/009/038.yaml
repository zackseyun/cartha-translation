  - severity: low
    issue: Die Fußnotenalternative „unter die schützende Bedeckung“ ist im Deutschen richtungsbezogen und weniger passend.
    rationale: Als Alternative zur Ortsangabe beim Sichverbergen ist „unter der Bedeckung“ bzw. „unter dem Schutz“ syntaktisch und semantisch geeigneter.
