  yaml_path: translation/deuterocanon/1_maccabees/009/038.yaml
  text: And they remembered John their brother[a], and they went up and hid under the cover of the mountain.
translation:
  language: de
  text: Und sie erinnerten sich an ihren Bruder Johannes und zogen hinauf und verbargen sich unter dem Schutz des Berges.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter der Bedeckung des Berges“. Das griechische Wort kann Bedeckung, Schutz oder Zuflucht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: sie erinnerten sich an
  rationale: Der Aorist von μιμνῄσκομαι bezeichnet hier ein Erinnern bzw. Sich-ins-Gedächtnis-Rufen; die reflexive deutsche Wendung ist direkt und natürlich.
- source_word: Ἰωάνου τοῦ ἀδελφοῦ αὐτῶν
  choice: ihren Bruder Johannes
  rationale: Die Genitivfügung identifiziert Johannes als ihren Bruder. Die im Deutschen übliche biblische Namensform lautet „Johannes“.
- source_word: ἀνέβησαν
  choice: zogen hinauf
  rationale: Die Wiedergabe bewahrt die aufwärts gerichtete Bewegung, ohne ein im Griechischen nicht ausdrücklich genanntes Ziel zu ergänzen.
- source_word: ἐκρύβησαν
  choice: verbargen sich
  rationale: Die Form bezeichnet im Zusammenhang, dass sie sich selbst versteckten; „verbargen sich“ ist präzise und würdevoll.
- source_word: ὑπὸ τὴν σκέπην τοῦ ὄρους
  choice: im Schutz des Berges
  rationale: σκέπη kann eine Bedeckung, einen Schutz oder einen Zufluchtsort bezeichnen. „Im Schutz des Berges“ erhält das konkrete Schutzbild und klingt im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das zweimalige καί wird als fortlaufende Erzählverknüpfung bewahrt; „zogen“ passt zum historischen Bericht. Die Mehrdeutigkeit von σκέπη wird in der Fußnote offengehalten.
