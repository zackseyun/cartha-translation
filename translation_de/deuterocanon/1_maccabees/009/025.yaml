translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die koordinierte Satzstruktur des Griechischen bleibt erhalten; „gottlos“ wahrt gegenüber dem allgemeineren „böse“ den religiösen Gehalt von ἀσεβεῖς.
