  text: And Bacchides chose wicked men and appointed them rulers over the land[a].
translation:
  language: de
  text: Und Bakchides wählte die gottlosen Männer aus und setzte sie als Machthaber über das Land ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu Herren des Landes“.'
    reason: Die Fußnote bewahrt die konkretere Grundbedeutung von κυρίους und die Genitivkonstruktion τῆς χώρας, während der Haupttext ihre politische Funktion natürlich wiedergibt.
lexical_decisions:
- source_word: ἐξέλεξεν
  choice: wählte … aus
  rationale: Das trennbare Verb „auswählen“ gibt den Aorist direkt und in natürlichem modernem Deutsch wieder.
- source_word: Βακχίδης
  choice: Bakchides
  rationale: Der griechische Personenname wird in einer im Deutschen nachvollziehbaren Form transliteriert.
- source_word: τοὺς ἀσεβεῖς ἄνδρας
  choice: die gottlosen Männer
  rationale: ἀσεβεῖς bezeichnet Menschen, die sich gegen Gott und die gebotene Frömmigkeit stellen; „gottlos“ wahrt diesen religiös-moralischen Gehalt. ἄνδρας wird ausdrücklich mit „Männer“ wiedergegeben.
- source_word: κατέστησεν
  choice: setzte … ein
  rationale: καθίστημι bezeichnet hier die Einsetzung in eine Autoritätsstellung; „einsetzen“ ist dafür idiomatisches, würdevolles Deutsch.
- source_word: κυρίους
  choice: Machthaber
  rationale: κύριοι bedeutet wörtlich „Herren“ beziehungsweise „Gebieter“, bezeichnet im politischen Zusammenhang aber Personen mit Herrschaftsgewalt. „Machthaber“ bewahrt den Herrschaftsaspekt, ohne feudale Assoziationen aufzudrängen.
- source_word: τῆς χώρας
  choice: über das Land
  rationale: χώρα bezeichnet hier das Gebiet oder Land. Die Präposition „über“ ergibt sich im Deutschen aus der funktionalen Wiedergabe von κυρίους als „Machthaber“.
