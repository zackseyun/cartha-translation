  text: and he took their spoils[a], and he burned the temple of Dagon and its temple with fire[b]. And those who had fallen by the sword
translation:
  language: de
  text: '[…] ihrer[a]; und er nahm ihre Beute und verbrannte den Tempel Dagons und ihren Tempel[b] mit Feuer. Und die durch das Schwert Gefallenen waren […]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier überlieferte griechische Ausschnitt setzt mitten im Satz ein und bricht auch am Ende ab. Die Auslassungszeichen kennzeichnen den jeweils fehlenden Zusammenhang.
    reason: textual_variant
  - marker: b
    text: Wörtlich „ihren Tempel“. Das griechische Pronomen ist feminin und bezieht sich wahrscheinlich auf ein feminines Bezugswort im vorausgehenden, hier nicht erhaltenen Zusammenhang, möglicherweise auf eine Stadt.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῆς
  choice: '[…] ihrer'
  rationale: Das feminine Genitivpronomen hängt syntaktisch vom verlorenen vorausgehenden Text ab. Die fragmentarische Wiedergabe bewahrt die erhaltene Form, ohne eine Ergänzung zu erfinden.
- source_word: ἔλαβεν
  choice: er nahm
  rationale: Die übliche erzählende Wiedergabe des Aorists von λαμβάνω ist im Deutschen klar und sachlich.
- source_word: τὰ σκῦλα αὐτῶν
  choice: ihre Beute
  rationale: σκῦλα bezeichnet im militärischen Zusammenhang erbeutete Güter; „Beute“ ist im modernen Deutschen natürlich und wahrt den kollektiven Sinn.
- source_word: τὸ ἱερὸν Δαγὼν
  choice: den Tempel Dagons
  rationale: ἱερόν bezeichnet hier das Heiligtum beziehungsweise den Tempel der Gottheit Dagon; die Genitivkonstruktion ist idiomatisch.
- source_word: τὸ ἱερὸν αὐτῆς
  choice: ihren Tempel
  rationale: Das feminine αὐτῆς wird formal bewahrt. Sein Bezug liegt offenbar im nicht vollständig vorliegenden Kontext und wird daher nicht ausdrücklich als „Stadt“ festgelegt.
- source_word: ἐνεπύρισεν ἐν πυρί
  choice: verbrannte … mit Feuer
  rationale: Die Wiedergabe erhält die emphatische Verbindung von Verb und Feuerangabe, auch wenn sie feierlicher klingt als das schlichtere „zündete … an“.
- source_word: οἱ πεπτωκότες μαχαίρᾳ
  choice: die durch das Schwert Gefallenen
  rationale: Das Perfektpartizip bezeichnet die bereits Erschlagenen in ihrem resultierenden Zustand; „durch das Schwert gefallen“ entspricht dem militärischen Idiom.
- source_word: ἐγένοντο
  choice: waren
  rationale: Im abgebrochenen Zähl- oder Ergebniszusammenhang kann γίνομαι idiomatisch „waren/beliefen sich auf“ bedeuten. „Waren“ bewahrt die Offenheit, da die erwartete Ergänzung fehlt.
theological_decisions: []
