revisions:
- from: Und es kam große Bedrängnis über Israel, wie es sie nicht mehr gegeben hatte, seit kein Prophet mehr unter ihnen gesehen wurde.[a]
  to: Und über Israel kam eine große Bedrängnis, wie es sie seit dem Tag, an dem unter ihnen kein Prophet mehr gesehen worden war, nicht gegeben hatte.[a]
