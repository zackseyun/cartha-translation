base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/027.yaml
  text: And there was great distress in Israel[a], such as had not been since the day when a prophet was no longer seen among them.
translation:
  language: de
  text: Und über Israel kam eine große Bedrängnis, wie es sie seit dem Tag, an dem unter ihnen kein Prophet mehr gesehen worden war, nicht gegeben hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seit dem Tag, an dem ihnen kein Prophet mehr erschien“. Das griechische Passiv „gesehen worden war“ kann auch im Sinn von „erschien“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: es kam
  rationale: Bewahrt den ereignishaften Einsatz der griechischen Erzählformel und klingt im Deutschen zusammen mit „über Israel“ natürlich.
- source_word: θλίψις μεγάλη
  choice: große Bedrängnis
  rationale: Bezeichnet schwere Not und Bedrückung, ohne den Ausdruck unnötig zu einem eschatologischen Fachbegriff zu machen.
- source_word: ἐν τῷ Ἰσραήλ
  choice: über Israel
  rationale: Gibt Israel als die von der Not betroffene Gemeinschaft idiomatisch wieder; wörtlicher wäre „in Israel“.
- source_word: ἥτις οὐκ ἐγένετο
  choice: wie es sie nicht mehr gegeben hatte
  rationale: Erfasst die qualitative Vergleichsaussage und die bis dahin beispiellose Schwere der Bedrängnis.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: seit
  rationale: Gibt den zeitlichen Ausgangspunkt natürlich wieder; „seit dem Tag, an dem“ wäre formaler, im Deutschen hier aber schwerfälliger.
- source_word: οὐκ ὤφθη
  choice: nicht mehr … gesehen wurde
  rationale: Bewahrt die Passivform von ὁράω und macht zugleich die im Zusammenhang gemeinte Beendigung prophetischer Gegenwart verständlich; auch „erschien“ ist möglich.
- source_word: προφήτης
  choice: kein Prophet
  rationale: Der griechische Singular ist generisch zu verstehen und bezeichnet das Fehlen prophetischer Gegenwart, nicht notwendig einen bestimmten Einzelpropheten.
- source_word: αὐτοῖς
  choice: unter ihnen
  rationale: Gibt den Dativ im Sinn der Gegenwart innerhalb der Gemeinschaft idiomatisch wieder.
theological_decisions:
- issue: Bedeutung der Aussage über das Fehlen eines Propheten
  choice: Der Vers beklagt eine Zeit, in der unter Israel kein Prophet mehr wahrgenommen wurde.
  alternative: Der Vers könnte lediglich sagen, dass kein Prophet öffentlich erschien, oder sich auf einen bestimmten Propheten beziehen.
  rationale: Der Singular ist am ehesten generisch. Die Formulierung bleibt jedoch beim historischen Befund des Verses und leitet daraus keine allgemeine Lehre über ein endgültiges Ende der Prophetie ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bedrängnis“ wahrt die Schwere des Ausdrucks; die Fußnote erhält die echte Mehrdeutigkeit von οὐκ ὤφθη.
