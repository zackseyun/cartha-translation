    issue: Die Wendung „wie es sie nicht mehr gegeben hatte“ ist semantisch unzutreffend bzw. missverständlich.
    rationale: '„Nicht mehr“ modifiziert im Deutschen hier das Vorkommen der Bedrängnis und legt nahe, seit dem genannten Zeitpunkt habe es diese nicht mehr gegeben. Der griechische Satz behauptet dagegen die bis zu diesem Zeitpunkt beispiellose Schwere der jetzigen Bedrängnis: eine solche hatte es seit dem Ausbleiben eines Propheten nicht gegeben.'
  revised_text: Und über Israel kam eine große Bedrängnis, wie es sie seit dem Tag, an dem unter ihnen kein Prophet mehr gesehen worden war, nicht gegeben hatte.[a]
