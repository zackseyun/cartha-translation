translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzfluss wurde durch ein Semikolon und »doch« gegliedert. Das im Griechischen nur aus dem Zusammenhang erkennbare Subjekt des letzten Satzteils wird zur Verständlichkeit als »ihre Verfolger« ausgedrückt; die Fußnote bewahrt die Bedeutungsbreite der Präpositionalfügung.
