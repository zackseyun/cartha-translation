base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/048.yaml
  text: And Jonathan and those with him jumped into the Jordan and swam across to the other side[a], and they did not cross the Jordan after them.
translation:
  language: de
  text: Und Jonatan sprang mit denen, die bei ihm waren, in den Jordan, und sie schwammen zum anderen Ufer hinüber; doch ihre Verfolger überquerten den Jordan nicht hinter ihnen her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Doch sie überquerten den Jordan nicht gegen sie.« Die knappe griechische Formulierung kann eine Verfolgung oder eine feindliche Bewegung gegen Jonatans Gruppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπήδησεν
  choice: sprangen in
  rationale: Das Verb bezeichnet ein plötzliches Hineinspringen. Wegen des zusammengesetzten Subjekts wird es im Deutschen natürlich im Plural wiedergegeben.
- source_word: οἱ μετ᾿ αὐτοῦ
  choice: die bei ihm waren
  rationale: Die Formulierung bewahrt die inhaltliche Breite des Griechischen und legt weder Geschlecht noch eine bestimmte Rolle fest.
- source_word: διεκολύμβησαν
  choice: schwammen … hinüber
  rationale: Das zusammengesetzte Verb bezeichnet ausdrücklich ein Überqueren durch Schwimmen.
- source_word: εἰς τὸ πέραν
  choice: zum anderen Ufer
  rationale: Im Zusammenhang mit dem Jordan bezeichnet die Wendung die gegenüberliegende Seite; »Ufer« ist im Deutschen klar und idiomatisch.
- source_word: οὐ διέβησαν ἐπ᾿ αὐτοὺς τὸν Ἰορδάνην
  choice: doch ihre Verfolger überquerten den Jordan nicht hinter ihnen her
  rationale: Das unausgesprochene Subjekt wird aus dem Zusammenhang als die Verfolger erschlossen. »Hinter ihnen her« gibt die Bewegung gegen beziehungsweise auf Jonatans Gruppe zu natürlich wieder, ohne einen erfolgten Angriff zu behaupten.
- source_word: Ἰορδάνην
  choice: den Jordan
  rationale: Die übliche deutsche Bezeichnung des Flusses benötigt keinen Zusatz.
