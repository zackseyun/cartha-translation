  source_fidelity: Die Übersetzung gibt das Hineinspringen, das Überqueren schwimmend und das gegenüberliegende Ufer zutreffend wieder. Das griechische ἐνεπήδησεν steht jedoch im Singular und bezieht sich ausdrücklich auf Jonatan; die anschließende Pluralform διεκολύμβησαν umfasst dann seine Begleiter. Die deutsche Pluralform »sprangen« verwischt diesen Wechsel. Die explizite Benennung der im Kontext vorausgesetzten Verfolger im Schlusssatz ist zur deutschen Verständlichkeit vertretbar; »hinter ihnen her« gibt die kontextuelle Lesart von ἐπ᾿ αὐτούς wieder. Die Fußnote muss aber die wörtlich adversative Lesart als Alternative benennen, statt nur »um sie anzugreifen« anzubieten.
  naturalness: Der Satz ist in modernem Standarddeutsch flüssig. »Jonatan sprang mit denen, die bei ihm waren« ist natürlich und bewahrt zugleich den griechischen Singular-Plural-Wechsel. Das Semikolon vor dem letzten, kontrastierenden Satzteil bleibt gut lesbar.
  terminology: »Jordan«, »zum anderen Ufer« und »schwammen … hinüber« sind idiomatisch und sachgerecht. »Verfolger« ist eine kontextgestützte Explikation, keine theologische Festlegung.
