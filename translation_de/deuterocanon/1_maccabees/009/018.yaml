  text: And Judas fell[a], and the rest fled.
translation:
  language: de
  text: Und Judas fiel[a], und die Übrigen flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde erschlagen« / »starb«. Wörtlich steht im Griechischen »fiel«, eine geläufige Wendung im Zusammenhang mit einer Schlacht, die den Tod meinen kann, ohne ihn ausdrücklich zu benennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Die im Deutschen für Ἰούδας und insbesondere Judas Makkabäus übliche Namensform.
- source_word: ἔπεσεν
  choice: fiel
  rationale: Der Aorist von πίπτω bedeutet wörtlich »fiel«. Im Kampfbericht kann das Verb den Tod bezeichnen; die Wiedergabe bewahrt jedoch die knappe, feierliche Bildsprache des griechischen Textes, ohne sie im Haupttext eindeutiger zu machen.
- source_word: οἱ λοιποὶ
  choice: die Übrigen
  rationale: Bezeichnet diejenigen, die außer dem zuvor genannten Judas noch da waren; »die Übrigen« gibt den substantivierten Ausdruck knapp und natürlich wieder.
- source_word: ἔφυγον
  choice: flohen
  rationale: φεύγω bezeichnet hier die Flucht aus der Schlacht; »flohen« ist die direkte und dem ernsten Erzählton angemessene Wiedergabe.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller moderner Erzählstil. Die Wiederholung von »und« bildet die parataktische Struktur des Griechischen ab; »fiel« erhält die im Ausgangstext vorhandene kriegerische Wendung und ihre Bedeutungsweite.
