base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/058.yaml
  text: And all the lawless men took counsel, saying, “Look, Jonathan and those with him are living in peace, confident; so now let us bring Bacchides, and he will seize them all in a single night.”
translation:
  language: de
  text: 'Und alle Gesetzlosen berieten miteinander und sagten: »Seht, Jonatan und seine Gefährten leben ruhig und voller Zuversicht.[a] Lasst uns nun Bakchides holen; dann wird er sie alle in einer einzigen Nacht gefangen nehmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wohnen ungestört und sind zuversichtlich«. Das Griechische verbindet ruhiges, ungestörtes Wohnen mit einem Partizip, das »zuversichtlich sein« oder »vertrauen« bedeutet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: berieten miteinander
  rationale: Das Medium bezeichnet eine gemeinsame, überlegte Beratung. Die Wiedergabe bleibt neutraler als »schmiedeten einen Plan«, obwohl der Zusammenhang feindselig ist.
- source_word: οἱ ἄνομοι
  choice: alle Gesetzlosen
  rationale: ἄνομοι bezeichnet Menschen, die ohne oder gegen das Gesetz handeln. »Gesetzlose« bewahrt den rechtlich-moralischen Klang, ohne pauschal zu »Bösewichte« zu steigern.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Der Aufmerksamkeitsruf wird in würdigem, gegenwärtigem Deutsch unmittelbar wiedergegeben.
- source_word: οἱ παρ᾿ αὐτοῦ
  choice: seine Gefährten
  rationale: Die Wendung meint die Menschen bei Jonatan, ohne ihren genauen Status festzulegen. »Gefährten« ist natürlich und weniger militärisch festgelegt als »seine Männer«.
- source_word: ἐν ἡσυχίᾳ κατοικοῦσιν
  choice: leben ruhig
  rationale: Die Wendung beschreibt ein ruhiges, ungestörtes Wohnen. »Leben ruhig« bewahrt diese konkrete Aussage, ohne ausdrücklich einen politischen Friedenszustand einzutragen.
- source_word: πεποιθότες
  choice: voller Zuversicht
  rationale: Das Perfektpartizip bezeichnet Vertrauen beziehungsweise Zuversicht. Die Formulierung ist im Deutschen idiomatisch und vermeidet die stärker interpretierende Wiedergabe »ahnungslos«.
- source_word: ἄξομεν
  choice: Lasst uns nun Bakchides holen
  rationale: Der Futur erhält im Beratungszusammenhang auffordernden Sinn. »Holen« gibt das Herbeibringen natürlich wieder.
- source_word: συλλήψεται
  choice: wird er ... gefangen nehmen
  rationale: Das Verb bezeichnet Ergreifen oder Gefangennehmen. Im militärischen Zusammenhang ist »gefangen nehmen« klarer und weniger juristisch als »verhaften«.
- source_word: ἐν νυκτὶ μιᾷ
  choice: in einer einzigen Nacht
  rationale: »Einzigen« erhält die Betonung auf der konzentrierten, raschen Durchführung.
