  yaml_path: translation/deuterocanon/1_maccabees/009/019.yaml
  text: And Jonathan and Simon carried Judas their brother and buried him in the tomb of his fathers at Modein[a][b].
translation:
  language: de
  text: Und Jonathan und Simon trugen Judas, ihren Bruder,[a] und begruben ihn im Grab seiner Väter in Modeïn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: „seinen Bruder“; bei dem zusammengesetzten Subjekt ist dem Sinn nach „ihren Bruder“ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: trugen … fort
  rationale: Das Verb αἴρω bezeichnet hier im Zusammenhang mit der Bestattung das Aufheben und Forttragen des Leichnams. „Trugen … fort“ gibt die konkrete Handlung in natürlichem Deutsch wieder.
- source_word: Ἰωναθὰν καὶ Σίμων
  choice: Jonathan und Simon
  rationale: Die Personennamen werden in ihren im Deutschen geläufigen biblischen Formen wiedergegeben.
- source_word: Ἰούδα τὸν ἀδελφὸν αὐτοῦ
  choice: Judas, ihren Bruder
  rationale: Das griechische Pronomen steht formal im Singular, doch bei dem zusammengesetzten Subjekt Jonathan und Simon ist Judas als Bruder beider Männer gemeint. „Ihren Bruder“ vermeidet im Deutschen einen falschen Singularbezug; die Form des Ausgangstextes wird in einer Fußnote dokumentiert.
- source_word: ἔθαψαν
  choice: begruben
  rationale: „Begruben“ ist die natürliche und genaue Wiedergabe von θάπτω in diesem Bestattungszusammenhang.
- source_word: ἐν τῷ τάφῳ
  choice: im Grab
  rationale: τάφος bezeichnet ein Grab oder eine Grabstätte. „Im Grab“ ist knapp und entspricht dem hier genannten Familiengrab.
- source_word: τῶν πατέρων αὐτοῦ
  choice: seiner Väter
  rationale: Die Formulierung bewahrt den Plural πατέρων und die biblische Rede von den familiären Vorfahren, ohne sie erklärend aufzulösen.
- source_word: ἐν Μωδεείμ
  choice: in Modeïn
  rationale: Der Ortsname wird nach der griechischen Form transliteriert. „In“ ist im Deutschen bei einer Grabstätte innerhalb eines Ortes idiomatisch.
