lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache nebenordnende Verbindung bewahrt den knappen Erzählstil des griechischen Textes.
- source_word: κατέπαυσεν
  choice: kam zur Ruhe
  rationale: Der Aorist bezeichnet hier das Eintreten des Aufhörens. Die Formulierung ist im Deutschen natürlich und lässt das Schwert als Bild für endende Gewalt stehen.
- source_word: ῥομφαία
  choice: das Schwert
