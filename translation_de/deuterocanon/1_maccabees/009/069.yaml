  verdict: revise
  source_fidelity: Die Wiedergabe von ἀπέκτειναν als „Er ließ ... töten“ folgt weder der ausdrücklich pluralischen Verbform noch ist die dadurch eingeführte kausative Bedeutung im griechischen Text ausgedrückt. Die Spannung zwischen dem Plural in dieser Teilaussage und den umgebenden Singularformen ist als Schwierigkeit des überlieferten Textes zu bewahren.
  naturalness: Abgesehen von dieser Stelle ist die Übersetzung klar, idiomatisch und für moderne würdige Erzählsprache passend. Die koordinierende Formulierung mit „sie töteten“ ist trotz des unklaren Bezugs die transparenteste Wiedergabe der griechischen Form.
  terminology: „zornig“, „gesetzlosen Männer“, „geraten“, „Land“ und „beschloss“ geben die maßgeblichen Ausdrücke treffend wieder. „zurückzukehren“ ist im Kontext möglich, obwohl ἀπελθεῖν zunächst schlicht „weggehen/fortgehen“ bedeutet; die Rückkehr in sein eigenes Land macht die Richtung hinreichend deutlich.
  issues:
