  yaml_path: translation/deuterocanon/1_maccabees/009/069.yaml
  text: And he became angry with those lawless men who had advised him to come into the country[a], and he killed many of them, and he decided to depart to his own land.
translation:
  language: de
  text: Da wurde er zornig auf jene gesetzlosen Männer, die ihm geraten hatten, in das Land zu kommen. Und sie töteten viele von ihnen,[a] und er beschloss, in sein eigenes Land zurückzukehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet wörtlich: „Und sie töteten viele von ihnen.“ Das Subjekt des Plurals ist im überlieferten Text nicht eindeutig; die Verben davor und danach stehen im Singular.'
    reason: textual_variant
lexical_decisions:
- source_word: ὠργίσθη
  choice: wurde zornig
  rationale: Die ingressive Bedeutung des Aorists von ὀργίζομαι wird natürlich wiedergegeben, ohne die Stärke des Zorns über das Griechische hinaus zu steigern.
- source_word: τοῖς ἀνδράσι τοῖς ἀνόμοις
  choice: auf jene gesetzlosen Männer
  rationale: „Gesetzlos“ bewahrt die konkrete rechtlich-moralische Bedeutung von ἄνομος besser als das allgemeinere „böse“.
- source_word: τοῖς συμβουλεύσασιν αὐτῷ
  choice: die ihm geraten hatten
  rationale: Das vorzeitige Partizip bezeichnet die Männer als diejenigen, die ihm diesen Rat gegeben hatten.
- source_word: ἐλθεῖν εἰς τὴν χώραν
  choice: in das Land zu kommen
  rationale: χώρα bezeichnet hier das Gebiet beziehungsweise Land, in das der Heerführer gekommen war; „Land“ passt zum militärisch-geografischen Zusammenhang.
- source_word: ἀπέκτειναν ἐξ αὐτῶν πολλούς
  choice: Er ließ viele von ihnen töten
  rationale: Der überlieferte griechische Text hat formal den Plural „sie töteten“. Die umgebenden Verben stehen jedoch im Singular und beziehen sich auf denselben Heerführer. Die kausative deutsche Formulierung gibt seine verantwortliche Handlung im Erzählzusammenhang natürlich wieder; der formale Plural bleibt in der Fußnote sichtbar.
- source_word: ἐβουλεύσατο
  choice: er beschloss
  rationale: Das Medium bezeichnet hier einen gefassten Entschluss, nicht bloß eine noch offene Beratung.
- source_word: τοῦ ἀπελθεῖν εἰς τὴν γῆν αὐτοῦ
  choice: in sein eigenes Land zurückzukehren
  rationale: Die Wendung bezeichnet den Inhalt seines Entschlusses. „Zurückzukehren“ bringt im Deutschen natürlich zum Ausdruck, dass er das gegenwärtige Gebiet verlässt und in sein eigenes Land geht.
