    issue: Die pluralische Form ἀπέκτειναν wird kausativ-singularisch als „Er ließ viele von ihnen töten“ wiedergegeben.
    rationale: Der überlieferte griechische Text sagt „sie töteten“ und nennt weder den Singular als Subjekt noch eine Veranlassung. Die syntaktische bzw. textgeschichtliche Spannung darf nicht durch eine inhaltliche Harmonisierung im Haupttext aufgelöst werden.
  - severity: medium
    issue: Die Fußnote behauptet, der Haupttext gebe die Handlung als die des Heerführers wieder.
    rationale: Dies stellt eine mögliche Rekonstruktion als Textsinn dar, statt den im griechischen Wortlaut vorhandenen unklaren Plural offen zu dokumentieren.
