lexical_decisions:
- source_word: κατόπισθεν αὐτοῦ
  choice: hinter ihm
  rationale: Die Ortsangabe bezeichnet die Position im Rücken einer männlichen Bezugsperson. Der Satzanfang bleibt als Fortsetzung des vorhergehenden Verses fragmentarisch.
- source_word: ἐκύκλωσαν
  choice: umzingelten
  rationale: Das Verb bezeichnet ein ringsum Einschließen; „umzingeln“ ist im militärischen Zusammenhang natürlich und präzise.
- source_word: αὐτὸν τὴν παρεμβολήν
  choice: sein Lager
  rationale: Die überlieferte Wortfolge mit zwei Akkusativen ist grammatisch auffällig. Der Zusammenhang verlangt, dass das Lager der genannten Person eingeschlossen wurde; die Schwierigkeit wird in einer Fußnote offengelegt.
- source_word: ἐξετίναξαν
  choice: schleuderten
  rationale: Das Verb beschreibt hier das Ausschleudern beziehungsweise Abschießen von Wurf- oder Schusskörpern, ohne deren genaue Art festzulegen.
- source_word: τὰς σχίζας
  choice: Geschosse
  rationale: Das seltene Substantiv bezeichnet offenbar geschleuderte oder abgeschossene Gegenstände. „Geschosse“ wahrt die Unsicherheit besser als die engere Festlegung auf Pfeile.
- source_word: εἰς τὸν λαόν
  choice: auf das Volk
  rationale: λαός bedeutet wörtlich „Volk“; obwohl im Zusammenhang die Kampftruppe gemeint ist, bleibt die allgemeinere Bezeichnung erhalten.
- source_word: ἐκ πρωΐθεν ἕως δείλης
  choice: vom frühen Morgen bis zum Abend
  rationale: Die Wiedergabe bildet die ausdrücklich genannte Dauer des Angriffs klar und nah am griechischen Ausdruck ab.
- source_word: ὁ δὲ λαός
  choice: Das Volk aber
  rationale: Die adversative Partikel δέ wird mit „aber“ wiedergegeben; der unvollständige Schluss bleibt erhalten, da die Vorlage mitten im Satz endet.
