translation:
  language: de
  text: heimlich hinter ihnen.[a] Und Jonatan erkannte, dass es ein Hinterhalt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Textzeuge bietet hier ein Satzfragment: „heimlich hinter ihnen. Und Jonatan erkannte, dass es ein Hinterhalt war.“ Der unvermittelte Anfang hängt wahrscheinlich mit dem vorausgehenden Zusammenhang zusammen und bildet in diesem Vers keinen vollständigen selbstständigen Satz.'
    reason: textual_variant
lexical_decisions:
- source_word: κρυπτῶς
  choice: heimlich
  rationale: Das Adverb bezeichnet ein verborgenes, unbemerktes Vorgehen; „heimlich“ ist im heutigen Deutsch natürlich und bewahrt den verdeckten Sinn.
- source_word: κατόπισθεν
  choice: hinter
  rationale: Die räumliche Bedeutung „hinter“ passt zum militärischen Zusammenhang und gibt die fragmentarische Wendung knapp wieder.
- source_word: αὐτῶν
  choice: ihnen
  rationale: Der Genitiv Plural verlangt einen pluralischen Bezug; nach „hinter“ steht im Deutschen der Dativ.
- source_word: ἔγνω
  choice: erkannte
  rationale: Der Aorist von γινώσκω kann hier das Erfassen der Lage bezeichnen. „Erkannte“ ist im Deutschen idiomatischer als „wusste“ und fügt keine nähere Art der Erkenntnis hinzu.
- source_word: ἔνεδρον
  choice: ein Hinterhalt
  rationale: Der militärische Ausdruck kann den Hinterhalt oder die im Verborgenen lauernde Truppe bezeichnen. „Hinterhalt“ erhält diese kontextuelle Offenheit besser als „Falle“.
