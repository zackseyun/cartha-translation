base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/039.yaml
  text: And Nicanor went out from Jerusalem and camped at Beth-horon[a], and a force of Syria met him.
translation:
  language: de
  text: Und Nikanor zog aus Jerusalem hinaus und schlug bei Bet-Horon sein Lager auf. Eine Streitmacht aus Syrien traf mit ihm zusammen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Eine syrische Streitmacht traf mit ihm zusammen« oder »Das Heer Syriens traf mit ihm zusammen«. Das griechische Wort δύναμις kann eine militärische Streitmacht oder ein Heer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zog … hinaus
  rationale: Gibt die Bewegung aus Jerusalem direkt wieder und passt zum militärischen Erzählzusammenhang, ohne ausdrücklich einen Marsch zu ergänzen.
- source_word: παρενέβαλεν
  choice: schlug … sein Lager auf
  rationale: παρεμβάλλω bezeichnet hier im militärischen Zusammenhang das Lagern beziehungsweise Aufschlagen eines Lagers; die deutsche Wendung ist natürlich und präzise.
- source_word: Βεθωρών
  choice: Bet-Horon
  rationale: Der Ortsname wird in der im Deutschen geläufigen biblischen Form transliteriert.
- source_word: συνήντησεν αὐτῷ
  choice: traf … mit ihm zusammen
  rationale: Bewahrt die breite Bedeutung von συναντάω als begegnen oder zusammentreffen und legt nicht fest, ob die Streitmacht sich ihm als Verstärkung anschloss.
- source_word: δύναμις Συρίας
  choice: eine Streitmacht aus Syrien
  rationale: δύναμις bezeichnet im Kontext eine militärische Truppe oder Streitmacht. Der Genitiv Συρίας wird natürlich als Herkunftsangabe wiedergegeben, ohne daraus zwingend das offizielle Heer Syriens zu machen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Lesbarkeit geteilt. »Traf mit ihm zusammen« wahrt die mögliche Neutralität der Begegnung und vermeidet die kontextuell denkbare, aber im Verb nicht ausdrücklich enthaltene Deutung »schloss sich ihm an«.
