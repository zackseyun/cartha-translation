    issue: ἐσκόρπισεν ist als „vertrieben“ übersetzt.
    rationale: ἐσκόρπισεν bedeutet „zerstreuen, verstreuen“. Zwar kann der Kontext erzwungene Vertreibung einschließen, doch „vertrieben“ macht diese Folgerung zur Hauptaussage und verliert die im griechischen Verb ausgedrückte Zerstreuung. Eine direkte Wiedergabe wahrt sowohl die Bildsprache als auch die Offenheit hinsichtlich der Art des Wegschaffens.
