  text: And they accused the people before the king[a], saying, “Judas and his brothers have destroyed all your friends, and have scattered us from our land.”
translation:
  language: de
  text: 'Und sie klagten das Volk vor dem König an und sagten: »Judas und seine Brüder haben alle deine Freunde[a] vernichtet und uns aus unserem Land zerstreut.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gefolgsleute« beziehungsweise »Verbündete«; im Umfeld eines Königshofes kann »Freunde« die politischen Unterstützer oder Hofangehörigen des Königs bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηγόρησαν
  choice: klagten … an
  rationale: Das Verb bezeichnet das Erheben einer Anklage; die deutsche Wendung ist präzise und passt zur förmlichen Beschuldigung vor dem König.
- source_word: τοῦ λαοῦ
  choice: das Volk
  rationale: Der Genitiv bezeichnet hier das Objekt der Anklage. „Das Volk“ gibt den griechischen Ausdruck unmittelbar wieder, ohne ihn unnötig nationalpolitisch zu verengen.
- source_word: πρὸς τὸν βασιλέα
  choice: vor dem König
  rationale: Bei einer Anklage bezeichnet πρός die Ausrichtung an den König; „vor dem König“ lässt zugleich die förmliche Situation erkennen.
- source_word: Ἀπώλεσεν
  choice: haben … vernichtet
  rationale: ἀπόλλυμι bezeichnet hier die gewaltsame Beseitigung von Personen. Wegen des zusammengesetzten Subjekts steht im natürlichen Deutschen der Plural, obwohl das griechische Verb formal im Singular steht.
- source_word: οἱ φίλοι σου
  choice: deine Freunde
  rationale: „Freunde“ wahrt die Grundbedeutung von φίλοι. Der mögliche politische Sinn als königliche Gefolgsleute oder Verbündete wird in der Fußnote offengehalten.
- source_word: ἐσκόρπισεν
  choice: haben … vertrieben
  rationale: Das Verb bedeutet wörtlich „zerstreuen“. Zusammen mit „aus unserem Land“ bezeichnet es hier eine Vertreibung; „vertrieben“ ist im Deutschen natürlicher und bewahrt den Sinn der erzwungenen Verstreuung.
- source_word: ἀπὸ τῆς γῆς ἡμῶν
  choice: aus unserem Land
  rationale: γῆ bezeichnet hier das eigene Land oder Gebiet. „Aus unserem Land“ verbindet sich idiomatisch mit „vertrieben“.
theological_decisions:
- issue: Singularische Verben bei „Judas und seine Brüder“
  choice: 'Deutsche Pluralformen: „haben … vernichtet und … vertrieben“'
  alternative: Judas als grammatisches Hauptsubjekt mit singularischen Verben wiedergeben
  rationale: Der griechische Singular stellt Judas als führenden Handelnden heraus, doch die ausdrücklich genannten Brüder bilden im Deutschen ein zusammengesetztes Subjekt. Der Plural ist natürlich und schreibt die Handlungen dennoch allen Genannten zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die förmliche Anklagesituation bleibt erkennbar; der mögliche politische Fachsinn von „Freunde“ wird nicht in den Haupttext hineingedeutet, sondern in der Fußnote erläutert.
