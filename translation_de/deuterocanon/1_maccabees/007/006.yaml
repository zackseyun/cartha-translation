  verdict: revise
  source_fidelity: Die Anklage, das Volk, der König, Judas und seine Brüder sowie die königlichen „Freunde“ sind zutreffend wiedergegeben. „Vernichtet“ ist für ἀπώλεσεν in diesem feindseligen Kontext vertretbar. Die Wiedergabe von ἐσκόρπισεν als „vertrieben“ verengt jedoch das griechische „zerstreut/versprengt“ auf eine bestimmte Art der Vertreibung und gibt das Bild des Zerstreuens nicht wieder.
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch. „Uns aus unserem Land zerstreut“ ist im biblisch-historischen Register verständlich und wahrt gegenüber „vertrieben“ die Bedeutung des Grundtexts besser.
  terminology: „Freunde“ bewahrt φίλοι; die Fußnote erläutert den möglichen hofpolitischen bzw. politischen Sinn angemessen, ohne ihn im Haupttext festzulegen. „König“, „Volk“ und „Land“ sind passend.
