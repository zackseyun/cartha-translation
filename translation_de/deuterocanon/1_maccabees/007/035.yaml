lexical_decisions:
- source_word: ὤμοσεν
  choice: schwor
  rationale: Der Aorist von ὄμνυμι bezeichnet das Ablegen eines Eides; „schwor“ ist knapp, würdevoll und im Deutschen natürlich.
- source_word: μετὰ θυμοῦ
  choice: im Zorn
  rationale: Die Wendung bezeichnet die Gemütslage, in der der Eid ausgesprochen wird. „Im Zorn“ gibt θυμός deutlich wieder, ohne es unnötig zu „Wut“ oder „Raserei“ zu steigern.
- source_word: παραδοθῇ
  choice: ausgeliefert werden
  rationale: Der passive Konjunktiv von παραδίδωμι meint hier die Übergabe in die Gewalt eines anderen; „ausgeliefert werden“ passt zum militärischen Machtkontext.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: sein Lager
  rationale: παρεμβολή kann das Heerlager oder die dort versammelte Streitmacht bezeichnen. „Lager“ bewahrt die konkrete militärische Bildsprache und legt den Ausdruck nicht einseitig auf „Heer“ fest.
- source_word: τὸ νῦν
  choice: jetzt
  rationale: Die Wendung hebt den gegenwärtigen Zeitpunkt beziehungsweise die unmittelbare Forderung hervor; „jetzt“ ist die direkte und unaufdringliche Wiedergabe.
- source_word: εἰς χεῖράς μου
  choice: mir … ausgeliefert
  rationale: Die griechische Wendung bedeutet wörtlich „in meine Hände“. Im Zusammenhang mit „ausliefern“ ist der deutsche Dativ idiomatischer und bewahrt den Sinn der Übergabe in seine Gewalt.
- source_word: καὶ ἔσται
  choice: dann wird es geschehen
  rationale: Die formelhafte und syntaktisch unvollständige Wendung wird bewusst nicht durch den Inhalt des Folgeverses ergänzt. „Dann wird es geschehen“ erhält ihren vorausweisenden Charakter.
- source_word: ἐὰν ἐπιστρέψω ἐν εἰρήνῃ
  choice: wenn ich in Frieden zurückkehre
  rationale: „In Frieden zurückkehren“ bewahrt die griechische Ausdrucksweise und lässt offen, ob vor allem unversehrte Rückkehr oder eine Rückkehr unter friedlichen Umständen gemeint ist.
theological_decisions:
- issue: Unvollständige Eidesformel am Versende
  choice: Den Bedingungssatz unvollständig enden lassen und den fehlenden Hauptinhalt nicht aus dem Folgevers ergänzen
  alternative: Den Satz durch Vorwegnahme der im nächsten Vers ausgesprochenen Drohung vervollständigen
  rationale: Der griechische Vers endet mitten in der Eidesformel. Die Übersetzung wahrt diese Quellengestalt und vermeidet, Text aus dem folgenden Vers in diesen Vers einzutragen.
- issue: Bezug von ἐν εἰρήνῃ
  choice: in Frieden
  alternative: wohlbehalten
  rationale: Die allgemeinere Formulierung erhält die mögliche Bedeutungsbreite und verengt den Ausdruck nicht ausschließlich auf körperliche Unversehrtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der ungewöhnlich abbrechende Satzbau ist quellenbedingt und wird durch die Fußnote erklärt; die direkte Rede bleibt deshalb am Versende bewusst unvollständig.
