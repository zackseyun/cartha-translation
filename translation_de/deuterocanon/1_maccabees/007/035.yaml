  text: And he swore in anger[a], saying, “If Judas and his camp are not delivered into my hands now, then when I return in peace,”
translation:
  language: de
  text: 'Und er schwor im Zorn: „Wenn Judas und sein Lager mir nicht jetzt ausgeliefert werden, dann wird es geschehen, wenn ich in Frieden zurückkehre,“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Eid bleibt hier unvollständig, weil der griechische Satz im nächsten Vers fortgesetzt wird.
