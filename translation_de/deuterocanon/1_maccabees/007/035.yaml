  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente des griechischen Textes zuverlässig wieder: ὤμοσεν („schwor“), μετὰ θυμοῦ („im Zorn“), Judas und seine παρεμβολή („sein Lager“), die Übergabe in seine Gewalt, τὸ νῦν („jetzt“) sowie die abschließende, in den nächsten Vers fortlaufende Bedingungsformel. „Dann wird es geschehen“ bildet das absichtlich noch nicht inhaltlich ausgeführte καὶ ἔσται angemessen ab, ohne die Drohung aus V. 36 vorwegzunehmen.'
  naturalness: Das Deutsch ist modernes Standarddeutsch in angemessen würdigem Register. Der Schluss klingt notwendigerweise abrupt und leicht unidiomatisch, weil der griechische Eid im Vers selbst syntaktisch unabgeschlossen bleibt. Die Fußnote erklärt dies klar und ausreichend.
  terminology: „Im Zorn“, „ausgeliefert“, „Lager“ und „in Frieden zurückkehre“ sind sachgerechte, nicht unnötig deutende Wiedergaben. Der Eigenname Judas und die militärische Terminologie sind konsistent. Keine theologisch oder konfessionell einengende Auslegung wurde eingeführt.
