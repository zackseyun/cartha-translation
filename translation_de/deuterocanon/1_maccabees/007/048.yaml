  text: And the people rejoiced greatly[a], and they made that day a day of great gladness.
translation:
  language: de
  text: Und das Volk freute sich sehr, und sie begingen jenen Tag als einen Tag großer Freude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie führten/brachten jenen Tag als einen Tag großer Freude«; die griechische Wendung bedeutet, dass sie den Tag als solchen begingen oder feierten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐφράνθη
  choice: freute sich
  rationale: Der Aorist Passiv von εὐφραίνω hat hier intransitive Bedeutung. »Freute sich« gibt die freudige Reaktion des Volkes natürlich und genau wieder.
- source_word: ὁ λαός
  choice: das Volk
  rationale: Der griechische Text sagt schlicht »das Volk«. Der Zusammenhang bestimmt es als das jüdische Volk; eine ausdrückliche Ergänzung wie »Israel« wäre jedoch nicht quellennah.
- source_word: σφόδρα
  choice: sehr
  rationale: σφόδρα verstärkt die Freude. »Sehr« ist im modernen Deutschen natürlich und bewahrt die Intensität ohne unnötig altertümlichen Klang.
- source_word: ἦγαγον
  choice: sie begingen
  rationale: Wörtlich bedeutet ἦγαγον »sie führten/brachten«. In Verbindung mit einem Tag bezeichnet das Verb idiomatisch dessen Begehung oder Feier; »begingen« wahrt dabei den feierlichen Erzählton.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: jenen Tag
  rationale: »Jenen Tag« entspricht der demonstrativen Wendung genau und passt zum gehobenen, aber verständlichen Erzählstil.
- source_word: ἡμέραν εὐφροσύνης μεγάλην
  choice: als einen Tag großer Freude
  rationale: εὐφροσύνη bezeichnet Freude, Fröhlichkeit oder festlichen Jubel. »Große Freude« erhält das Bedeutungsfeld und bildet die Wiederholung des griechischen Wortes für »Tag« ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »Tag« spiegelt die griechische Satzgestalt; »begingen … als« macht zugleich die idiomatische Bedeutung verständlich.
