  yaml_path: translation/deuterocanon/1_maccabees/007/044.yaml
  text: And he himself fell first in the battle. But when his camp saw that Nicanor had fallen[a], they threw down their weapons and fled.
translation:
  language: de
  text: Und er selbst fiel als Erster in der Schlacht. Als aber seine Truppen[a] sahen, dass Nikanor gefallen war, warfen sie ihre Waffen weg und flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Lager« beziehungsweise »seine Streitmacht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν
  choice: fiel / gefallen war
  rationale: Bewahrt die griechische Kampfesredeweise, die hier den Tod Nikanors nahelegt, ohne ausdrücklich »wurde getötet« zu sagen.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Gibt die Hervorhebung durch das griechische Pronomen wieder.
- source_word: πρῶτος
  choice: als Erster
  rationale: Gibt die zeitliche beziehungsweise rangmäßige Abfolge direkt und natürlich wieder.
- source_word: ἐν τῷ πολέμῳ
  choice: in der Schlacht
  rationale: Im unmittelbaren Zusammenhang ist ein einzelnes Kampfgeschehen gemeint, nicht der Krieg als Ganzes.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: sein Heer
  rationale: παρεμβολή kann sowohl das Lager als auch die dort versammelte Streitmacht bezeichnen. Da diese sieht, Waffen wegwirft und flieht, ist im Deutschen »Heer« die natürliche kollektive Bezeichnung; die Bildalternative bleibt in der Fußnote erhalten.
- source_word: ῥίψαντες τὰ ὅπλα αὐτῶν
  choice: warfen sie ihre Waffen weg
  rationale: Gibt das absichtliche Aufgeben der Waffen vor der Flucht kräftig und idiomatisch wieder.
- source_word: ἔφυγον
  choice: flohen
  rationale: Die übliche und genaue Wiedergabe im militärischen Zusammenhang.
