  verdict: revise
  source_fidelity: Die Übersetzung gibt die emphatische Stellung von αὐτός (»er selbst«), πρῶτος (»als Erster«), die zurückhaltende Kampfesformel ἔπεσεν (»fiel/gefallen war«) sowie die Abfolge von Waffenwegwerfen und Flucht zuverlässig wieder. »Schlacht« ist hier für ἐν τῷ πολέμῳ sachgerecht. Die Bedeutungsspanne von παρεμβολή wird durch die Fußnote angemessen kenntlich gemacht.
  naturalness: Die Verbindung eines singularischen Kollektivs (»sein Heer sah«) mit dem anschließenden Pluralpronomen (»warfen sie«) ist verständlich, aber im modernen Standarddeutsch stilistisch uneinheitlich. »Seine Truppen sahen …; sie warfen …« ist natürlicher und bildet die handelnde Soldatengruppe klar ab.
  terminology: »Nikanor«, »Schlacht«, »Waffen« und »flohen« sind idiomatisch und registergerecht. »Truppen« ist für die in diesem Kontext handelnde παρεμβολή eine natürliche Wiedergabe; die mögliche Bedeutung »Lager« bleibt als Fußnotenalternative erhalten.
