base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/028.yaml
  text: Let there be no battle between me and you. I will come with a few men, so that I may see your faces in peace.
translation:
  language: de
  text: Zwischen mir und euch soll es keinen Kampf geben. Ich werde mit wenigen Männern kommen, damit ich euch in Frieden von Angesicht zu Angesicht sehen kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „damit ich eure Gesichter in Frieden sehe“.'
    reason: Die Fußnote macht die konkrete griechische Ausdrucksweise hinter der idiomatischen deutschen Wiedergabe transparent.
lexical_decisions:
- source_word: Μὴ ἔστω
  choice: soll es keinen … geben
  rationale: Die verneinte Imperativform wird als direkte, im Deutschen natürliche Aufforderung wiedergegeben.
- source_word: μάχη
  choice: Kampf
  rationale: „Kampf“ entspricht dem militärisch-politischen Zusammenhang und klingt im Deutschen natürlicher als das enger gefasste „Schlacht“.
- source_word: ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν
  choice: zwischen mir und euch
  rationale: Die Formulierung bewahrt sowohl die relationale Bedeutung als auch den Gegensatz von singularischem Sprecher und pluralischen Adressaten.
- source_word: ἥξω
  choice: Ich werde … kommen
  rationale: Die Zukunftsform von ἥκω bezeichnet hier das angekündigte Kommen des Sprechers.
- source_word: ἐν ἀνδράσιν ὀλίγοις
  choice: mit wenigen Männern
  rationale: ἐν bezeichnet hier Begleitung; „Männer“ ist in diesem militärischen Kontext sachlich und geschlechtsgenau.
- source_word: ἵνα ἴδω
  choice: damit ich … sehen kann
  rationale: Die Wiedergabe erhält den ausdrücklichen Zweckcharakter des ἵνα-Satzes in natürlichem Deutsch.
- source_word: ὑμῶν τὰ πρόσωπα
  choice: euch von Angesicht zu Angesicht
  rationale: Die griechische Wendung lautet wörtlich „eure Gesichter“, meint hier aber eine persönliche Begegnung. Die gewählte Form bewahrt das Bild und ist zugleich idiomatisch.
- source_word: μετ’ εἰρήνης
  choice: in Frieden
  rationale: Die Wendung bezeichnet die friedliche Art beziehungsweise den friedlichen Rahmen der angekündigten Begegnung.
