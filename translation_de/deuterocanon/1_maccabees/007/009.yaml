  yaml_path: translation/deuterocanon/1_maccabees/007/009.yaml
  text: And he sent him and Alcimus the ungodly[a], and established the priesthood for him[b], and commanded him to carry out vengeance on the sons of Israel.
translation:
  language: de
  text: Und er sandte ihn und den gottlosen Alkimos. Alkimos wurde in das Priesteramt eingesetzt[a], und er befahl ihm, unter den Söhnen Israels Vergeltung zu üben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie richteten ihm das Priestertum auf“. Das griechische Verb steht im Plural; der Handelnde wird in dieser knappen Formulierung nicht eindeutig bezeichnet. Gemeint ist im Zusammenhang die Einsetzung des Alkimos in ein Priesteramt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an den Söhnen Israels“ beziehungsweise „gegen die Söhne Israels“. Das griechische „unter“ kann den Bereich bezeichnen, in dem die Vergeltung ausgeübt wird; der Zusammenhang legt zugleich eine feindliche Zielrichtung nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Die übliche und im erzählenden Kontext natürliche Wiedergabe des griechischen Verbs.
- source_word: Ἄλκιμον
  choice: Alkimos
  rationale: Der griechische Personenname wird in einer dem Ausgangstext nahen deutschen Form transliteriert.
- source_word: τὸν ἀσεβῆ
  choice: den gottlosen
  rationale: Bewahrt die ausdrücklich religiös-moralische Wertung von ἀσεβής; „böse“ wäre zu allgemein, „frevlerisch“ weniger gegenwartssprachlich.
- source_word: ἔστησαν αὐτῷ τὴν ἱερωσύνην
  choice: bestätigte ihm das Priesteramt
  rationale: Gibt die im Kontext erkennbare Einsetzung beziehungsweise Sicherung des priesterlichen Amtes natürlich wieder, ohne ausdrücklich „Hohepriesteramt“ zu setzen, das im griechischen Satz nicht genannt wird.
- source_word: ἱερωσύνην
  choice: Priesteramt
  rationale: Im Zusammenhang bezeichnet das Wort hier eher die bekleidete priesterliche Würde beziehungsweise Amtsstellung als das Priestertum als Personengruppe.
- source_word: ἐνετείλατο
  choice: befahl
  rationale: Wahrt die autoritative Kraft des Verbs in knappem, modernem Deutsch.
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: Vergeltung zu üben
  rationale: Eine idiomatische deutsche Wendung, die den starken Sinn von ἐκδίκησις erhält, ohne ihn zu bloßer Bestrafung abzuschwächen.
- source_word: ἐν τοῖς υἱοῖς Ἰσραήλ
  choice: unter den Söhnen Israels
  rationale: Folgt zunächst der lokalen beziehungsweise sphärischen Bedeutung von ἐν und bewahrt zugleich die feste ethnische Bezeichnung; der feindliche Zielbezug bleibt als mögliche Lesart in der Fußnote sichtbar.
theological_decisions:
- issue: Die abwertende Bezeichnung ἀσεβῆ für Alkimos
  choice: den gottlosen
  alternative: den frevlerischen; den ruchlosen
  rationale: Die Erzählerwertung hat ausdrücklich religiösen Gehalt und darf weder neutralisiert noch auf allgemeine Bosheit verengt werden.
- issue: Bedeutung von ἔστησαν αὐτῷ τὴν ἱερωσύνην
  choice: bestätigte ihm das Priesteramt
  alternative: setzte ihn in das Priesteramt ein; sicherte ihm das Priestertum
  rationale: Die Formulierung hält den Amtsbezug fest, ohne das nur kontextuell naheliegende Hohepriesteramt ausdrücklich in den Haupttext einzutragen. Die griechische Pluralform wurde angesichts des unmittelbar vorausgehenden singularischen Herrschers als kontextuell auf ihn bezogen wiedergegeben; eine mögliche Text- oder Überlieferungsspannung wird nicht dogmatisch ausgebaut.
- issue: Funktion von ἐν bei der Vergeltung
  choice: unter den Söhnen Israels
  alternative: an den Söhnen Israels; gegen die Söhne Israels
  rationale: ἐν kann den Bereich bezeichnen, in dem gehandelt wird; der Zusammenhang lässt zugleich eine feindliche Zielrichtung erkennen. Haupttext und Fußnote bewahren diese Spannung.
- issue: Wiedergabe von υἱοῖς Ἰσραήλ
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die traditionelle, ausdrücklich maskuline griechische Gruppenbezeichnung wird formal bewahrt und nicht stillschweigend neutralisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählsyntax. „Gottlos“, „Priesteramt“ und „Vergeltung üben“ sind allgemein verständlich und bewahren den religiös-moralischen sowie politischen Ernst des griechischen Textes. Die Satzteilung verhindert eine schwerfällige Reihung, ohne die Abfolge der Handlungen zu verändern.
