  yaml_path: translation/deuterocanon/1_maccabees/007/049.yaml
  text: And they established that this day should be observed year by year, on the thirteenth day of Adar.
translation:
  language: de
  text: Und sie legten fest, diesen Tag Jahr für Jahr am dreizehnten Adar zu begehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησαν
  choice: sie legten fest
  rationale: Der Aorist von ἵστημι bezeichnet in dieser Konstruktion das verbindliche Einführen einer wiederkehrenden Praxis. „Legten fest“ ist im modernen Deutsch natürlich und vermeidet den stärkeren amtlichen Klang von „verordneten“.
- source_word: τοῦ ἄγειν
  choice: zu begehen
  rationale: Der substantivierte Infinitiv benennt den Inhalt dessen, was festgelegt wurde. Einen Gedenk- oder Festtag „begehen“ ist idiomatisch und lässt offen, ob die Einhaltung vorwiegend feierlich oder erinnernd war.
- source_word: κατʼ ἐνιαυτόν
  choice: Jahr für Jahr
  rationale: Die Wendung bezeichnet die jährlich wiederkehrende Begehung und wird formnah sowie idiomatisch wiedergegeben.
- source_word: τὴν ἡμέραν ταύτην
  choice: diesen Tag
  rationale: Das proximale Demonstrativpronomen wird direkt wiedergegeben.
- source_word: τῇ τρισκαιδεκάτῃ
  choice: am dreizehnten
  rationale: Der Dativ bezeichnet das Datum. Im Deutschen ist „am dreizehnten Adar“ klar und knapp; der Monatsname macht die Datumsangabe eindeutig.
- source_word: τοῦ Ἀδάρ
  choice: Adar
  rationale: Der Monatsname wird entsprechend der üblichen deutschen Form transliteriert; nach einer Ordinalzahl steht er idiomatisch ohne „des“.
