base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/016.yaml
  text: 'And they trusted him[a], and he seized sixty men from among them and killed them in one day, according to the words that he wrote:'
translation:
  language: de
  text: Und sie vertrauten ihm, und sie nahmen sechzig Männer aus ihrer Mitte fest, und er tötete sie an einem einzigen Tag, entsprechend den Worten, die er schrieb:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen folgt auf das pluralische „sie nahmen fest“ das singularische „er tötete“. Auch „die er schrieb“ hat ein nicht ausdrücklich genanntes männliches Subjekt.
    reason: Der griechische Text bewahrt einen Wechsel vom Plural zum Singular sowie ein aktives Singularsubjekt beim folgenden Verweis auf geschriebene Worte.
lexical_decisions:
- source_word: ἐνεπίστευσαν
  choice: sie vertrauten ihm
  rationale: Das Verb bezeichnet hier, dass sie ihm Vertrauen schenkten; „glaubten ihm“ wäre ebenfalls möglich, könnte aber stärker auf den Wahrheitsgehalt seiner Worte als auf das Vertrauen zu seiner Person zielen.
- source_word: συνέλαβον
  choice: sie nahmen … fest
  rationale: Die überlieferte griechische Verbform steht im Plural. Die Übersetzung bewahrt diesen Numeruswechsel, statt ihn stillschweigend an das folgende Singularverb anzugleichen. Im Zusammenhang bezeichnet das Verb ein gewaltsames Ergreifen bzw. Festnehmen.
- source_word: ἐξ αὐτῶν
  choice: aus ihrer Mitte
  rationale: 'Die Wendung ist partitiv: Die sechzig Männer wurden aus einer größeren Gruppe ausgewählt und ergriffen.'
- source_word: ἑξήκοντα ἄνδρας
  choice: sechzig Männer
  rationale: Direkte und natürliche Wiedergabe der Zahl und der männlichen Personenbezeichnung.
- source_word: ἀπέκτεινεν
  choice: er tötete
  rationale: Die griechische Verbform steht im Singular und benennt ohne ausdrücklichen Hinweis auf ein Gerichtsverfahren das Töten.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: an einem einzigen Tag
  rationale: Die Formulierung gibt die zeitliche Konzentration des Geschehens idiomatisch und mit dem Nachdruck von μιᾷ wieder.
- source_word: κατὰ τοὺς λόγους
  choice: entsprechend den Worten
  rationale: Die Wendung drückt Übereinstimmung mit einer schriftlichen Aussage aus und leitet die folgende Anführung ein.
- source_word: οὓς ἔγραφεν
  choice: die er geschrieben hatte
  rationale: Der griechische Text hat ein aktives Verb im Singular. Das Plusquamperfekt macht im Deutschen deutlich, dass das Schreiben dem berichteten Geschehen vorausliegt, ohne den nicht ausdrücklich genannten Verfasser zu bestimmen.
theological_decisions:
- issue: Numerus- und Subjektwechsel zwischen συνέλαβον (Plural) und ἀπέκτεινεν (Singular)
  choice: „sie nahmen … fest, und er tötete“
  alternative: „er nahm … fest und tötete“
  rationale: Der griechische Ausgangstext weist tatsächlich einen Wechsel vom Plural zum Singular auf. Da dieser die unmittelbare Beteiligung mehrerer Handelnder und zugleich die Hauptverantwortung des einzelnen Anführers andeuten kann, wird die Spannung im Haupttext bewahrt und nicht harmonisiert.
- issue: Bezug des Subjekts in οὓς ἔγραφεν
  choice: Das unbestimmte männliche Singularsubjekt als „er“ bewahren
  alternative: 'Unpersönlich: „die geschrieben stehen“'
  rationale: Der überlieferte Text ist aktiv und singular. Eine unpersönliche Passivform wäre glatter, würde aber eine echte grammatische Besonderheit und die mögliche Bezugnahme auf den Verfasser der zitierten Worte beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am griechischen Erzählfluss; die echten Subjektwechsel werden im Haupttext erhalten und in der Fußnote erläutert.
