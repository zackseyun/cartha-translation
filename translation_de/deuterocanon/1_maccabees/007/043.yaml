lexical_decisions:
- source_word: συνῆψαν … εἰς πόλεμον
  choice: trafen … in der Schlacht aufeinander
  rationale: Die Verbindung bezeichnet im militärischen Zusammenhang den Eintritt in den Kampf. Die deutsche Wendung gibt dies natürlich wieder, ohne den Vorgang über den griechischen Text hinaus auszumalen.
- source_word: αἱ παρεμβολαί
  choice: die Heerlager
  rationale: παρεμβολή kann sowohl das Lager als auch die dort versammelte Streitmacht bezeichnen. „Heerlager“ bewahrt das konkrete Bild und lässt zugleich den militärischen Sinn erkennen.
- source_word: τῇ τρισκαιδεκάτῃ τοῦ μηνὸς Ἀδάρ
  choice: am dreizehnten Tag des Monats Adar
  rationale: Der temporale Dativ bezeichnet das Datum; „Tag“ ist im Griechischen unausgesprochen, im Deutschen aber zur klaren Wiedergabe sinnvoll zu ergänzen.
- source_word: συνετρίβη
  choice: wurde zerschlagen
  rationale: Das Verb bezeichnet ein Zerbrechen oder vernichtendes Schlagen und ist stärker als ein bloßes „wurde besiegt“. „Zerschlagen“ ist zugleich eine natürliche deutsche militärische Formulierung.
- source_word: ἡ παρεμβολὴ Νικάνορος
  choice: Nikanors Heerlager
  rationale: Die Wiedergabe hält die lexikalische Verbindung zum vorherigen Plural παρεμβολαί aufrecht und kann sowohl Lager als auch Streitmacht bezeichnen.
