  text: And the camps joined battle on the thirteenth day of the month Adar[a], and Nicanor’s camp was crushed,
translation:
  language: de
  text: Die Heerlager[a] traten am dreizehnten Tag des Monats Adar gegeneinander zum Kampf an, und Nikanors Heerlager wurde zerschlagen.
  philosophy: optimal-equivalence
  footnotes:
