base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/017.yaml
  text: They poured out the flesh of your holy ones and their blood around Jerusalem[c][b][a], and there was no one to bury them.
translation:
  language: de
  text: Das Fleisch deiner Heiligen[a] und ihr Blut gossen sie rings um Jerusalem aus[c][b], und niemand war da, sie zu begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Getreuen“ oder „Gottesfürchtigen“.'
    reason: lexical_alternative
  - marker: b
    text: Diese Zeile lehnt sich eng an Psalm 79,2–3 an (in der Septuaginta Psalm 78,2–3).
    reason: cross_reference
  - marker: c
    text: 'Auch: „vergossen“; das griechische Verb bedeutet wörtlich „ausgießen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σάρκας
  choice: das Fleisch
  rationale: Die konkrete Wiedergabe bewahrt das drastische körperliche Bild des griechischen Plurals, ohne es zu „Leichen“ oder „Körper“ abzumildern. Im Deutschen ist der kollektive Singular natürlich.
- source_word: ὁσίων
  choice: deiner Heiligen
  rationale: „Heilige“ gibt die sakrale und bundestreue Bedeutung von ὅσιοι knapp wieder. Die Fußnote nennt weniger kirchlich geprägte mögliche Wiedergaben.
- source_word: ἐξέχεαν
  choice: gossen … aus
  rationale: Die Grundbedeutung des Verbs ist „ausgießen“. Diese Wiedergabe erhält die Bildhaftigkeit und den sprachlichen Anklang an den Psalm; „vergossen“ wäre beim Blut idiomatischer, würde aber mit „Fleisch“ weniger gut als gemeinsames Prädikat funktionieren.
- source_word: κύκλῳ Ἱερουσαλήμ
  choice: rings um Jerusalem
  rationale: „Rings um“ gibt die räumliche Bedeutung von κύκλῳ präzise und in natürlichem, würdigem Deutsch wieder.
- source_word: οὐκ ἦν αὐτοῖς ὁ θάπτων
  choice: niemand war da, sie zu begraben
  rationale: Die idiomatische deutsche Form bewahrt sowohl die existentielle Konstruktion als auch das erschütternde Motiv der verweigerten Bestattung.
theological_decisions:
- issue: Wiedergabe von ὁσίων in einem schriftsprachlichen Klagekontext
  choice: Heiligen
  alternative: Getreuen; Gottesfürchtigen
  rationale: „Heilige“ wahrt den Bezug auf Menschen, die Gott zugehören, ohne die Bedeutung auf bloße Frömmigkeit oder Treue einzuengen. Da der deutsche Ausdruck auch an später kirchlich kanonisierte Heilige denken lassen kann, werden semantisch mögliche Alternativen in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich drastische Verbindung von „Fleisch“ und „Blut“ mit demselben Verb wurde entsprechend dem griechischen Wortlaut beibehalten; die Satzstellung bleibt klar und gut lesbar.
