base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/012.yaml
  text: And an assembly of scribes gathered to Alcimus and Bacchides to seek justice[a].
translation:
  language: de
  text: Und eine Versammlung von Schriftgelehrten kam bei Alkimos und Bakchides zusammen, um zu suchen, was recht ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um Recht zu suchen“ oder „um Gerechtigkeit zu suchen“. Das griechische Wort kann sowohl eine moralische als auch eine rechtliche Bedeutung haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: kam … zusammen
  rationale: Die aoristische Passiv-/Medialform beschreibt hier das Zusammenkommen einer Gruppe; die deutsche Wendung ist natürlich und bewahrt den kollektiven Vorgang.
- source_word: πρὸς
  choice: bei
  rationale: Nach einem Verb des Zusammenkommens bezeichnet πρὸς die Ausrichtung auf beziehungsweise das Zusammenkommen bei den genannten Personen. „Bei“ vermeidet das im Deutschen unnatürliche „zu … versammeln“.
- source_word: συναγωγὴ
  choice: Versammlung
  rationale: Gemeint ist eine versammelte Gruppe, nicht ein Synagogengebäude.
- source_word: γραμματέων
  choice: von Schriftgelehrten
  rationale: γραμματεύς bezeichnet im jüdisch-hellenistischen Zusammenhang gewöhnlich einen Schriftgelehrten; dies ist historisch und sprachlich angemessen.
- source_word: ἐκζητῆσαι
  choice: um zu suchen
  rationale: Der Infinitiv drückt den Zweck des Zusammenkommens aus. „Suchen“ bildet die bewusste, zielgerichtete Bemühung ab.
- source_word: δίκαια
  choice: was recht ist
  rationale: Das substantivierte neutrale Pluralwort kann Gerechtes, berechtigte Ansprüche oder Recht im moralisch-rechtlichen Sinn bezeichnen. „Was recht ist“ bewahrt diese Breite.
- source_word: Ἄλκιμον
  choice: Alkimos
  rationale: Quellnahe und im modernen Deutschen gut lesbare Umschrift des griechischen Namens.
- source_word: Βακχίδην
  choice: Bakchides
  rationale: Quellnahe deutsche Umschrift des griechischen Namens.
theological_decisions:
- issue: Bedeutungsumfang von δίκαια im politisch angespannten Zusammenhang
  choice: was recht ist
  alternative: Gerechtigkeit; Recht; gerechte Bedingungen
  rationale: Der Vers legt nicht fest, ob die Schriftgelehrten Rechtsgewährung, einen gerechten Ausgleich oder allgemein das moralisch Richtige suchten. Die gewählte Formulierung erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am Griechischen, ohne unnatürlich zu wirken; die Namen werden quellnah deutsch transkribiert.
