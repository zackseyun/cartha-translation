  source_fidelity: Der Text gibt καὶ ἐπισυνήχθησαν πρὸς Ἄλκιμον καὶ Βακχίδην συναγωγὴ γραμματέων, ἐκζητῆσαι δίκαια vollständig und sinngerecht wieder. „kam bei Alkimos und Bakchides zusammen“ ist für πρὸς in diesem Zusammenhang idiomatisch und lässt sowohl die Ausrichtung auf als auch die Zusammenkunft mit den beiden Personen offen. Die Zweckangabe und der weite moralisch-rechtliche Sinn von δίκαια bleiben erhalten.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Formulierung „eine Versammlung von Schriftgelehrten“ ist leicht formell, passt jedoch zum erzählenden Register und zu συναγωγή. Die Zeichensetzung mit dem Komma bei der erweiterten um-zu-Gruppe ist natürlich.
  terminology: „Schriftgelehrte“ entspricht γραμματέων im jüdisch-hellenistischen Kontext. „Alkimos“ und „Bakchides“ sind vertretbare quellnahe deutsche Namensformen. „was recht ist“ bewahrt die absichtlich nicht weiter eingeengte Bandbreite von δίκαια besser als ein ausschließlich juristisch oder abstrakt verstandenes „Gerechtigkeit“. Die Fußnote erläutert diese Bandbreite angemessen.
