  source_fidelity: 'Der Text gibt die griechische Aussage insgesamt zuverlässig wieder: φόβος und τρόμος, die das ganze Volk erfassen, sowie die Anklage wegen fehlender ἀλήθεια und κρίσις und der Verletzung von στάσις und Eid sind erhalten. »Vereinbarung« ist für στάσις in diesem Kontext eine sachgerechte, nicht übertheologisierende Wiedergabe.'
