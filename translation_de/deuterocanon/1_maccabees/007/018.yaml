base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/018.yaml
  text: And fear and dread fell upon all the people[a], for they said, “There is no truth or justice in them, for they have broken the agreement and the oath that they swore.”
translation:
  language: de
  text: 'Da kamen Furcht und Schrecken über das ganze Volk; denn sie sagten: »Bei ihnen gibt es weder Wahrheit noch Recht. Sie haben die Vereinbarung[a] und den Eid gebrochen, den sie geschworen hatten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Abmachung« oder »Bund«; das griechische Wort kann eine formelle Vereinbarung bezeichnen. Im Zusammenhang wird außerdem ein Eid genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: kamen über
  rationale: Die Wendung gibt das plötzliche Hereinbrechen von Furcht und Schrecken natürlich wieder und bewahrt das räumliche Bild des griechischen Verbs.
- source_word: ὁ φόβος καὶ ὁ τρόμος
  choice: Furcht und Schrecken
  rationale: Die geläufige deutsche Paarformel wahrt die zwei Begriffe, ohne sie unnötig gleichzusetzen; τρόμος kann zwar wörtlich »Zittern« bedeuten, bezeichnet hier aber den hervorgerufenen Schrecken.
- source_word: εἰς πάντα τὸν λαόν
  choice: über das ganze Volk
  rationale: Im Anschluss an »kamen« ist dies idiomatisches Deutsch und erhält den umfassenden Sinn von πάντα.
- source_word: ἀλήθεια
  choice: Wahrheit
  rationale: Dies ist die direkte Wiedergabe; im Zusammenhang schwingt zugleich Wahrhaftigkeit beziehungsweise Verlässlichkeit mit.
- source_word: κρίσις
  choice: Recht
  rationale: Hier geht es um gerechtes Handeln, nicht lediglich um den Vorgang des Urteilens. »Recht« bildet mit »Wahrheit« eine knappe, natürliche Paarung.
- source_word: παρῆρσαν
  choice: gebrochen
  rationale: Das Verb bezeichnet hier die Verletzung eingegangener Verpflichtungen; »eine Vereinbarung und einen Eid brechen« ist im Deutschen klar und idiomatisch.
- source_word: τὴν στάσιν
  choice: die Vereinbarung
  rationale: Im Kontext des begleitenden Eides bezeichnet στάσις eine formelle Abmachung. »Vereinbarung« wahrt diesen Sinn, ohne dem Wort zwingend eine spezifisch theologische Bundesbedeutung zuzuschreiben.
- source_word: τὸν ὅρκον ὃν ὤμοσαν
  choice: den Eid, den sie geschworen hatten
  rationale: Die ausdrückliche etymologische Verbindung zwischen ὅρκος und ὄμνυμι bleibt erhalten; das Plusquamperfekt ordnet den zuvor geleisteten Eid im deutschen Erzählzusammenhang zeitlich ein.
theological_decisions:
- issue: Ob στάσις mit ausdrücklich bundestheologischer Sprache wiederzugeben ist
  choice: Vereinbarung
  alternative: Bund
  rationale: Der Zusammenhang beschreibt eine formelle, durch einen Eid bekräftigte Abmachung, doch στάσις verlangt für sich genommen nicht die stärkere theologische Aussage von »Bund«. Die Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle, aber weiterhin verständliche Paarung »Furcht und Schrecken« bewahrt den Nachdruck des Griechischen. »Weder Wahrheit noch Recht« klingt natürlich und lässt die moralische sowie rechtliche Anklage bestehen.
