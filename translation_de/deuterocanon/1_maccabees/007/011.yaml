  text: But they did not pay attention to their words[a], for behold[c][b], they had come with great force.
translation:
  language: de
  text: Doch sie schenkten ihren Worten keine Beachtung[a]; denn siehe, sie waren mit großer Streitmacht gekommen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie hörten nicht auf ihre Worte.“'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort kann „Macht“, „Stärke“ oder im Zusammenhang eine militärische Streitmacht bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ προσεῖχον
  choice: sie schenkten … keine Beachtung
  rationale: προσέχω mit dem Dativ bedeutet hier, jemandes Worten Aufmerksamkeit oder Gehör zu schenken. Die Formulierung ist im modernen Deutschen natürlich und gibt die bewusste Nichtbeachtung wieder.
- source_word: τοῖς λόγοις αὐτῶν
  choice: ihren Worten
  rationale: λόγοι bezeichnet hier das von ihnen Gesagte. „Ihren Worten“ bleibt eng am Griechischen und ist zugleich gut verständlich.
- source_word: ἴδου γὰρ
  choice: denn sieh
  rationale: ἴδου dient als aufmerksamkeitslenkender Ausruf. „Sieh“ bewahrt diesen deiktischen Nachdruck, ohne das stärker altertümliche „siehe“ in den Haupttext zu übernehmen.
- source_word: ἦλθον
  choice: sie waren … gekommen
  rationale: Der Aorist bezeichnet ein vergangenes Kommen; das deutsche Plusquamperfekt macht im erklärenden Satz deutlich, dass ihre Ankunft bereits erfolgt war.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: mit einer großen Streitmacht
  rationale: δύναμις kann Macht, Stärke oder eine militärische Truppe bezeichnen. Im erzählerischen Zusammenhang ist eine bewaffnete Streitmacht gemeint; die Fußnote hält die weitere Bedeutungsbreite fest.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denn sieh“ erhält bewusst den Aufmerksamkeitssignalcharakter des griechischen ἴδου; „Streitmacht“ macht den wahrscheinlichen militärischen Sinn im Kontext verständlich, während die Fußnote die lexikalische Bedeutungsbreite wahrt.
