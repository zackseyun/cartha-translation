  terminology: „Streitmacht“ gibt die militärische Bedeutung von δύναμις in diesem Kontext angemessen wieder, ohne eine bestimmte Truppengattung zu behaupten. Die Fußnote sollte die Bedeutungsspanne als „Macht, Stärke oder (militärische) Streitmacht“ benennen und nicht unnötig von einer „großen bewaffneten Truppe“ sprechen, da die Größe bereits durch πολλῆς ausgedrückt wird.
