  text: at Chaphar-salama. And about five thousand men of those with Nicanor fell[a], and they fled into the city of David.
translation:
  language: de
  text: bei Charfarasarama.[a] Von Nikanors Männern fielen etwa fünftausend; die Übrigen flohen in die Stadt Davids.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname Charfarasarama gibt die schwierige griechische Namensform Χαρφαρασαραμά wieder; andere Umschriften und Namensformen sind möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: bei
  rationale: Vor dem Ortsnamen bezeichnet κατά hier den Schauplatz des Kampfes. „Bei“ ist im Deutschen eine natürliche lokative Wiedergabe.
- source_word: Χαρφαρασαραμά
  choice: Kafar-Salama
  rationale: Der schwierige Ortsname wird in einer lesbaren deutschen Form transkribiert; wegen der unsicheren griechischen Namensform wird die Variante in einer Fußnote kenntlich gemacht.
- source_word: ἔπεσαν
  choice: fielen
  rationale: Im militärischen Zusammenhang bezeichnet „fielen“ idiomatisch den Tod im Kampf und bewahrt die knappe Ausdrucksweise des Griechischen.
- source_word: τῶν παρὰ Νικάνορος
  choice: Von den Männern bei Nikanor
  rationale: Die Formulierung bleibt nahe bei der räumlich-zugehörigen Wendung des Griechischen und bezeichnet Nikanors Leute, ohne das Verhältnis stärker auszudeuten.
- source_word: ὡς πεντακισχίλιοι ἄνδρες
  choice: etwa fünftausend
  rationale: ὡς kennzeichnet vor der Zahl eine Näherungsangabe; „etwa“ gibt dies knapp und natürlich wieder. „Männer“ ist bereits in der vorangehenden Wortgruppe ausgedrückt.
- source_word: ἔφυγον
  choice: sie flohen
  rationale: Die Übersetzung bewahrt den ausdrücklich gesetzten, aber nicht näher bestimmten Subjektwechsel des griechischen Textes, statt „die Übrigen“ zu ergänzen.
- source_word: εἰς τὴν πόλιν Δαυείδ
  choice: in die Stadt Davids
  rationale: εἰς bezeichnet die Bewegung hinein; die beschreibende Ortsbezeichnung wird auf Deutsch wiedergegeben.
