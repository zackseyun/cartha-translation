  naturalness: „Von den Männern bei Nikanor“ ist im modernen Deutschen unnötig räumlich und weniger idiomatisch als eine Zugehörigkeitsformulierung. Die Umstellung zu „Von Nikanors Männern fielen ...; die Übrigen flohen ...“ ist klar, knapp und natürliche Erzählprosa.
  terminology: „Nikanor“ und „Stadt Davids“ sind angemessen. Die unsichere bzw. textkritisch auffällige griechische Ortsnamensform sollte quellentreu als „Charfarasarama“ umschrieben und durch eine Fußnote erläutert werden.
