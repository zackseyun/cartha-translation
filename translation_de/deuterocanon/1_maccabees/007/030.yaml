translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das unbestimmte Pronomen »jener« hält den griechischen Pronomengebrauch aufrecht und macht zugleich deutlich, dass nicht Judas derjenige war, der mit Hinterlist kam. Der zweite Satz behält die wiederholten Pronomen des Ausgangstextes bei.
