  source_fidelity: Die Übersetzung gibt den passiv-unpersönlichen Informationsvorgang von ἐγνώσθη ὁ λόγος τῷ Ἰούδα idiomatisch wieder, ohne einen Überbringer zu erfinden. »mit Hinterlist gegen ihn gekommen war« entspricht μετὰ δόλου ἦλθεν ἐπ’ αὐτόν im feindseligen Kontext. »erschrak er vor ihm« gibt ἐπτοήθη ἀπ’ αὐτοῦ angemessen wieder, und »wollte sein Gesicht nicht mehr sehen« bewahrt die konkrete Wendung ἰδεῖν τὸ πρόσωπον αὐτοῦ.
  naturalness: Modernes, flüssiges und angemessen würdevolles Standarddeutsch. Das Plusquamperfekt in »gekommen war« stellt das zeitliche Verhältnis klar. »jener« ist in diesem knappen Vers leicht gehoben, aber verständlich und passend zum erzählenden Register.
  terminology: »Hinterlist« ist für δόλος präzise, ohne den Ausdruck zu einer stärkeren Behauptung wie »Verrat« auszuweiten. Die Fußnote dokumentiert sachgerecht die mögliche Bedeutung von λόγος als »Nachricht« oder »Sache« und ist korrekt am Informationsverb verankert.
