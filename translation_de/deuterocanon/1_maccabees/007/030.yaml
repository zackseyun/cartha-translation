base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/030.yaml
  text: And the matter became known to Judas[a], that he had come against him with deceit; and he was alarmed because of him, and no longer wished to see his face.
translation:
  language: de
  text: Judas erfuhr[a], dass jener mit Hinterlist gegen ihn gekommen war. Da erschrak er vor ihm und wollte sein Gesicht nicht mehr sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Judas wurde die Nachricht bekannt«; λόγος kann hier auch »die Sache« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος τῷ Ἰούδα
  choice: Judas erfuhr
  rationale: 'Die griechische Passivkonstruktion lautet wörtlich etwa: »Die Nachricht/Sache wurde Judas bekannt.« Die aktive deutsche Fassung gibt den Informationsvorgang natürlich wieder, ohne einen ungenannten Übermittler einzuführen; die Bedeutungsbreite von λόγος wird in der Fußnote festgehalten.'
- source_word: ὅτι
  choice: dass
  rationale: Leitet hier den Inhalt dessen ein, was Judas bekannt wurde.
- source_word: μετὰ δόλου
  choice: mit Hinterlist
  rationale: Bewahrt die Vorstellung absichtlicher Täuschung und passt zum feindseligen Zusammenhang, ohne den Ausdruck stärker als nötig als offenen Verrat zu deuten.
- source_word: ἦλθεν ἐπ’ αὐτόν
  choice: gegen ihn gekommen war
  rationale: ἐπί mit Akkusativ bezeichnet im Kontext ein feindliches Vorgehen gegen Judas. Das deutsche Plusquamperfekt verdeutlicht, dass dieses Kommen dem Bekanntwerden vorauslag.
- source_word: ἐπτοήθη ἀπ’ αὐτοῦ
  choice: Da erschrak er vor ihm
  rationale: ἐπτοήθη bezeichnet Erschrecken oder Beunruhigung; »erschrak« wahrt die Intensität, ohne bis zu »geriet in Panik« zu steigern. ἀπ’ αὐτοῦ bezeichnet hier die Person als Ursache beziehungsweise Gegenstand des Erschreckens.
- source_word: οὐκ ἠβουλήθη ἔτι
  choice: wollte … nicht mehr
  rationale: Gibt die nun einsetzende und fortdauernde Ablehnung in natürlichem modernem Deutsch wieder.
- source_word: ἰδεῖν τὸ πρόσωπον αὐτοῦ
  choice: sein Gesicht … sehen
  rationale: Bewahrt das konkrete griechische Bild vom Sehen des Gesichts, statt es lediglich mit »ihn sehen« wiederzugeben.
