lexical_decisions:
- source_word: παρενέβαλεν
  choice: schlug … sein Lager auf
  rationale: Das Verb bezeichnet hier im militärischen Zusammenhang das Beziehen eines Lagers. Die deutsche Wendung ist natürlich und bewahrt den militärischen Sinn.
- source_word: ἐν Ἀδασὰ
  choice: bei Adasa
  rationale: Bei einem Lagerplatz gibt „bei Adasa“ die örtliche Angabe idiomatisch wieder, ohne zwingend eine Lage innerhalb der Ortschaft zu behaupten.
- source_word: ἐν τρισχιλίοις ἀνδράσιν
  choice: mit dreitausend Männern
  rationale: Die Präpositionalfügung bezeichnet die Judas begleitende Streitmacht; „mit“ ist dafür im Deutschen die natürliche Wiedergabe.
- source_word: προσηύξατο
  choice: betete
  rationale: Direkte und übliche Wiedergabe von προσεύχομαι.
- source_word: εἶπεν
  choice: sprach
  rationale: Das Verb leitet den Wortlaut des folgenden Gebets ein. „Sprach“ entspricht dem würdevollen Erzählregister und passt zum anschließenden Doppelpunkt.
