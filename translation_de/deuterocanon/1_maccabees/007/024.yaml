  yaml_path: translation/deuterocanon/1_maccabees/007/024.yaml
  text: And he went out into all the borders of Judea and the surrounding region[a], and he took vengeance on the men and on those who had deserted[c][b], and they were prevented from going into the country.
translation:
  language: de
  text: Und er zog in alle Gebiete Judäas und in die Gegenden ringsum[a]. An den Männern und an denen, die übergelaufen waren[b], übte er Vergeltung. Sie wurden daran gehindert, ins Land zu ziehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ringsum“. Das griechische Wort erweitert den beschriebenen Raum auf die umliegenden Gegenden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „desertiert waren“ beziehungsweise „zur Gegenseite übergegangen waren“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in die Gegend“ beziehungsweise „in das Gebiet zu ziehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zog
  rationale: Der narrative Aorist von ἐξέρχομαι bezeichnet hier das Hinaus- beziehungsweise Weiterziehen. „Zog“ ist im deutschen Erzählstil natürlich und gibt die räumliche Bewegung wieder.
- source_word: πάντα τὰ ὅρια τῆς Ἰουδαίας
  choice: alle Gebiete Judäas
  rationale: ὅρια kann Grenzen, Grenzgebiete oder Gebiete bezeichnen. Da jemand in sie hineinzieht, ist „Gebiete“ im Deutschen natürlicher als das missverständliche „Grenzen“ und bewahrt zugleich die geografische Ausdehnung.
- source_word: κυκλόθεν
  choice: die Gegenden ringsum
  rationale: Das Adverb bezeichnet das ringsum Liegende und erweitert den Schauplatz über die Gebiete Judäas hinaus. Die substantivische Wiedergabe ergibt zusammen mit der Bewegungsrichtung einen natürlichen deutschen Satz.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: übte Vergeltung
  rationale: Die griechische Wendung bezeichnet eine vergeltende oder strafende Handlung. „Vergeltung üben“ wahrt diese Schärfe, ohne sie ausdrücklich als rein persönliche Rache oder förmliche Rechtsprechung festzulegen.
- source_word: ἐν τοῖς ἀνδράσιν
  choice: an den Männern
  rationale: Im Zusammenhang mit ἐκδίκησιν bezeichnet ἐν die Personen, an denen die Vergeltung vollzogen wird. Der bestimmte Ausdruck bleibt bewusst allgemein, weil der griechische Text die Männer nicht näher kennzeichnet.
- source_word: τοῖς αὐτομολήσασιν
  choice: denen, die übergelaufen waren
  rationale: Das Aoristpartizip von αὐτομολέω bezeichnet Personen, die desertiert beziehungsweise zur Gegenseite übergegangen waren. „Übergelaufen“ macht den Seitenwechsel deutlich und bewahrt den vorzeitigen Aspekt.
- source_word: ἐνεστάλησαν
  choice: wurden daran gehindert
  rationale: Die Passivform bezeichnet wirksames Hemmen oder Zurückhalten. In Verbindung mit dem Infinitiv ist „daran gehindert“ idiomatisch und lässt die im Griechischen nicht ausdrücklich genannten Handelnden offen.
- source_word: τοῦ πορεύεσθαι εἰς χώραν
  choice: ins Land zu ziehen
  rationale: Der artikulierte Infinitiv benennt, woran sie gehindert wurden. χώρα kann Land, Gegend oder Gebiet bedeuten; „ins Land“ ist hier knapp und natürlich, während „ziehen“ zur erzählenden Darstellung einer Bewegung passt.
