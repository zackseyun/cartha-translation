base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/036.yaml
  text: “I will burn this house.” And he went out in anger[a]. Then the priests entered and stood before the altar and the sanctuary, and they wept and said[b],
translation:
  language: de
  text: '»Ich werde dieses Haus[a] in Brand setzen.« Dann ging er zornig hinaus. Darauf gingen die Priester hinein, stellten sich vor den Altar und das Heiligtum, weinten und sagten[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »diesen Tempel«. Wörtlich steht im Griechischen »dieses Haus«, eine geläufige Bezeichnung für den Tempel.
    reason: lexical_alternative
  - marker: b
    text: Der Vers endet mit »und sagten«; das Gebet beziehungsweise die Rede folgt im nächsten Vers.
    reason: cross_reference
lexical_decisions:
- source_word: ἐμπυριῶ
  choice: ich werde … in Brand setzen
  rationale: Das Futur von ἐμπυρίζω bezeichnet die Drohung, etwas anzuzünden. »In Brand setzen« ist im modernen Deutschen direkt und natürlich, ohne wie »niederbrennen« bereits das vollständige Ergebnis vorauszusetzen.
- source_word: τὸν οἶκον τοῦτον
  choice: dieses Haus
  rationale: οἶκος bedeutet wörtlich »Haus« und bezeichnet hier den Tempel. Die wörtliche Formulierung bewahrt den biblischen Sprachklang; der Zusammenhang mit Altar und Heiligtum macht den Bezug deutlich.
- source_word: μετὰ θυμοῦ
  choice: zornig
  rationale: Die Wendung beschreibt seinen erregten, zornigen Zustand. Das Adverb gibt dies in natürlichem modernem Deutsch wieder.
- source_word: οἱ ἱερεῖς
  choice: die Priester
  rationale: Die übliche und kontextgemäße Bezeichnung für die am Tempel dienenden Priester.
- source_word: ἔστησαν κατὰ πρόσωπον
  choice: stellten sich vor
  rationale: Die Wendung bezeichnet das Einnehmen eines Standorts unmittelbar vor oder angesichts von etwas.
- source_word: τοῦ θυσιαστηρίου
  choice: den Altar
  rationale: Die übliche kultische Bedeutung von θυσιαστήριον.
- source_word: τοῦ ναοῦ
  choice: das Heiligtum
  rationale: ναός bezeichnet häufig das eigentliche Tempelheiligtum. »Heiligtum« wahrt zudem die begriffliche Unterscheidung gegenüber dem zuvor verwendeten οἶκος, »Haus«.
- source_word: ἔκλαυσαν
  choice: weinten
  rationale: Eine schlichte, feierliche Wiedergabe des erzählenden Verbs für das Weinen.
- source_word: εἶπαν
  choice: sagten
  rationale: Das gewöhnliche Verb zur Einleitung direkter Rede; der Doppelpunkt zeigt an, dass die Rede im folgenden Vers beginnt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. Die direkte Drohung bleibt knapp; »Haus« bewahrt die Bildsprache des griechischen Textes, während »Heiligtum« die engere Bedeutung von ναός wiedergibt.
