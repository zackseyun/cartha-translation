base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/025.yaml
  text: But when Alcimus saw that Judas and those with him had grown strong[a], and realized that he was not able to withstand them, he returned to the king and brought wicked charges against them.
translation:
  language: de
  text: Als Alkimus aber sah, dass Judas und seine Gefährten erstarkt waren, und erkannte, dass er ihnen nicht standhalten konnte[a], kehrte er zum König zurück und erhob böswillige Anschuldigungen gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier abgedruckte griechische Text lautet wörtlich: »dass er ihnen standhalten konnte«. Der Zusammenhang legt stark nahe, dass eine Verneinung gemeint ist oder im Text ausgefallen ist.'
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ ἴδεν
  choice: Als ... aber sah
  rationale: ὡς mit dem Aorist leitet hier einen temporalen Nebensatz ein; δέ markiert einen leichten Übergang beziehungsweise Gegensatz.
- source_word: ἐνίσχυσεν Ἰούδας καὶ οἱ μετ’ αὐτοῦ
  choice: dass Judas und seine Gefährten erstarkt waren
  rationale: ἐνίσχυσεν bezeichnet das Gewinnen von Stärke. Das Plusquamperfekt gibt den bereits erreichten Zustand im Verhältnis zu Alkimus’ Wahrnehmung wieder; οἱ μετ’ αὐτοῦ wird natürlich als „seine Gefährten“ ausgedrückt.
- source_word: ἔγνω
  choice: erkannte
  rationale: Das Verb bezeichnet hier Alkimus’ Einsicht aufgrund der wahrgenommenen Stärke seiner Gegner.
- source_word: δύναται ὑποστῆναι αὐτούς
  choice: dass er ihnen nicht standhalten konnte
  rationale: Der überlieferte Wortlaut enthält keine Verneinung, doch der unmittelbare Erzählzusammenhang setzt offenbar Alkimus’ Unfähigkeit voraus. Die sinngemäße Wiedergabe wird deshalb durch eine textkritische Fußnote offengelegt.
- source_word: ἐπέστρεψεν πρὸς τὸν βασιλέα
  choice: kehrte er zum König zurück
  rationale: ἐπιστρέφω bezeichnet hier das Zurückkehren beziehungsweise Sich-zurück-Wenden zum König.
- source_word: κατηγόρησεν αὐτῶν πονηρά
  choice: erhob böse Anschuldigungen gegen sie
  rationale: κατηγορέω hat den Sinn „anklagen, Anschuldigungen erheben“; πονηρά bewahrt die ausdrückliche moralische Bewertung dieser Anschuldigungen.
theological_decisions:
- issue: Sinn von δύναται ὑποστῆναι αὐτούς ohne überlieferte Verneinung
  choice: 'Sinngemäß als Unfähigkeit wiedergeben: „dass er ihnen nicht standhalten konnte“'
  alternative: 'Diplomatisch wörtlich: „dass er ihnen standhalten konnte“'
  rationale: 'Der positive Wortlaut steht in Spannung zur Erzählfolge: Alkimus sieht die Stärke des Judas und wendet sich daraufhin an den König. Wahrscheinlich ist eine Verneinung ausgefallen oder dem Sinn nach vorausgesetzt. Die Übersetzung folgt dem kohärenten Sinn, dokumentiert aber den tatsächlichen griechischen Wortlaut ausdrücklich.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gefährten“, „erstarkt“ und „Anschuldigungen erheben“ entsprechen dem erzählerischen und leicht formellen Register, bleiben aber allgemein verständlich.
