base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/038.yaml
  text: Take vengeance on this man and on his camp[a], and let them fall by the sword. Remember their blasphemies[b], and grant them no survival.
translation:
  language: de
  text: Übe Vergeltung an diesem Mann und an seinem Heerlager, und lass sie durch das Schwert fallen. Erinnere dich ihrer Lästerungen[a] und gewähre ihnen keinen Aufenthalt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schmähungen“ oder „Verleumdungen“. Das griechische Wort kann allgemein verletzende oder herabsetzende Rede bezeichnen; im Gebetszusammenhang kann „Lästerungen“ den religiös gewichteten Sinn wiedergeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „kein Bleiben“ bzw. „keinen Aufenthaltsort“. Der Ausdruck kann im Zusammenhang auch fehlende Sicherheit oder keinen Aufschub des Gerichts nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον ἐκδίκησιν
  choice: Übe Vergeltung
  rationale: Die Wendung gibt den ausdrücklichen Ruf nach strafendem göttlichem Eingreifen wieder, ohne die griechische Konstruktion hölzern nachzubilden.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: an diesem Mann
  rationale: In Verbindung mit ἐκδίκησιν bezeichnet ἐν hier idiomatisch denjenigen, an dem die Vergeltung vollzogen werden soll.
- source_word: παρεμβολῇ
  choice: Heerlager
  rationale: Das Wort bezeichnet in diesem militärischen Zusammenhang das Lager beziehungsweise die dort versammelte Streitmacht; „Heerlager“ macht den militärischen Sinn deutlich.
- source_word: πεσάτωσαν ἐν ῥομφαίᾳ
  choice: lass sie durch das Schwert fallen
  rationale: Die Gebetsform des pluralischen Imperativs und die übliche Wendung für gewaltsamen Tod im Kampf bleiben erhalten.
- source_word: μνήσθητι
  choice: Denk an
  rationale: Die Aufforderung bittet Gott, die Vergehen bei seinem richterlichen Handeln zu berücksichtigen; „Denk an“ ist natürlich und bewahrt diesen Gebetscharakter.
- source_word: δυσφημιῶν
  choice: Lästerungen
  rationale: Das Wort kann allgemein Schmähungen oder verleumderische Äußerungen bezeichnen. Im sakralen Gebetskontext bringt „Lästerungen“ die religiöse Schwere zum Ausdruck, ohne die breitere Bedeutung zu verschweigen.
- source_word: μὴ δῷς αὐτοῖς μονήν
  choice: gewähre ihnen kein Bleiben
  rationale: μονή bezeichnet Bleiben, Aufenthalt oder Fortbestand. Die bewusst offene Formulierung bewahrt, dass sowohl ein sicherer Aufenthaltsort als auch weiteres Bestehen beziehungsweise eine Atempause vor dem Gericht gemeint sein kann.
theological_decisions:
- issue: Bedeutung von δυσφημιῶν im Vergeltungsgebet
  choice: Lästerungen
  alternative: Schmähungen oder Verleumdungen
  rationale: Der Zusammenhang legt religiös gewichtete Schmährede nahe. Die Fußnote erhält jedoch die weitere lexikalische Möglichkeit, damit die Aussage nicht enger festgelegt wird, als es das Griechische erlaubt.
- issue: Reichweite von μονήν
  choice: kein Bleiben
  alternative: keinen Aufenthaltsort, keinen Fortbestand oder keine Atempause
  rationale: Der griechische Ausdruck lässt offen, ob räumliche Sicherheit, fortdauerndes Überleben oder Aufschub vom Gericht im Vordergrund steht. Die Hauptübersetzung bewahrt diese Spannung statt sie einseitig auf „Überleben“ festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Übe Vergeltung“ und „durch das Schwert fallen“ erhalten den feierlichen Gebetston. Das leicht markierte „kein Bleiben“ ist bewusst gewählt, um die Mehrdeutigkeit von μονή nicht vorschnell auf Aufenthaltsort, Ruhe oder Überleben einzuengen.
