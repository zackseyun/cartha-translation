base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/033.yaml
  text: And after these words Nikanor went up to Mount Zion, and some of the priests came out from the sanctuary, and some of the elders of the people, to greet him peaceably and to show him the burnt offering that was being offered for the king.
translation:
  language: de
  text: Nach diesen Worten ging Nikanor auf den Berg Zion hinauf. Da kamen einige der Priester aus dem Heiligtum[a] und einige der Ältesten des Volkes[b] heraus, um ihn friedlich zu begrüßen und ihm das Brandopfer zu zeigen, das gerade für den König dargebracht wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem heiligen Ort“. Der griechische Ausdruck kann genauer das Heiligtum oder den heiligen Tempelbereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die wiederholte Präposition hat wahrscheinlich einen partitiven Sinn: Es kamen Vertreter aus dem Kreis der Priester und der Ältesten heraus, nicht unbedingt alle Priester und Ältesten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: ging ... hinauf
  rationale: Gibt die Aufwärtsbewegung zum Berg Zion natürlich wieder und bewahrt die räumliche Perspektive des griechischen Verbs.
- source_word: τὸ ὄρος Σιών
  choice: den Berg Zion
  rationale: Die im modernen Deutschen übliche und klare Wiedergabe der Ortsbezeichnung.
- source_word: ἐξῆλθαν
  choice: kamen ... heraus
  rationale: Bezeichnet das Hervortreten aus dem heiligen Bereich; „kamen heraus“ ist im Erzählzusammenhang natürlich.
- source_word: ἀπὸ τῶν ἱερέων ... καὶ ἀπὸ τῶν πρεσβυτέρων τοῦ λαοῦ
  choice: einige von den Priestern ... und einige von den Ältesten des Volkes
  rationale: 'Das wiederholte ἀπό ist hier wahrscheinlich partitiv: Vertreter aus beiden Gruppen kamen heraus, nicht notwendig alle Angehörigen.'
- source_word: ἐκ τῶν ἁγίων
  choice: aus dem Heiligtum
  rationale: Der Kontext von Priestern und Opferhandlung spricht für den heiligen Tempelbereich; die mögliche engere Wiedergabe „aus dem heiligen Ort“ wird in der Fußnote bewahrt.
- source_word: ἀσπάσασθαι αὐτὸν εἰρηνικῶς
  choice: um ihn friedlich zu begrüßen
  rationale: Wahrt sowohl die Bedeutung von ἀσπάζομαι als „begrüßen“ als auch die friedliche Art oder Absicht, die εἰρηνικῶς ausdrückt.
- source_word: δεῖξαι αὐτῷ
  choice: ihm ... zu zeigen
  rationale: Direkte und idiomatische Wiedergabe des finalen Infinitivs.
- source_word: τὴν ὁλοκαύτωσιν
  choice: das Brandopfer
  rationale: Etablierte deutsche Bezeichnung für ein vollständig verbranntes Opfer.
- source_word: τὴν προσφερομένην
  choice: das ... dargebracht wurde
  rationale: Gibt das passive Opfergeschehen idiomatisch wieder; der griechische Präsenspartizip beschreibt die zu diesem Zeitpunkt stattfindende Darbringung.
- source_word: ὑπὲρ τοῦ βασιλέως
  choice: für den König
  rationale: Bewahrt knapp den Sinn einer Darbringung zugunsten beziehungsweise im Interesse des Königs, ohne den Zweck näher festzulegen.
