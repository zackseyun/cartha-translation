  text: And he came to Judas[a], and they greeted one another peaceably[b]; but the enemies were ready to seize Judas.
translation:
  language: de
  text: Und er kam zu Judas, und sie begrüßten einander friedlich[a]. Doch die Feinde standen bereit, Judas zu ergreifen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in Frieden“. Das griechische Adverb hebt die äußerlich friedliche Art der Begegnung hervor.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann auch „wegreißen“ oder „plötzlich packen“ bedeuten und unterstreicht die heimtückische Absicht hinter der friedlichen Begrüßung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς Ἰούδαν
  choice: kam zu Judas
  rationale: Der Aorist von ἔρχομαι mit πρός bezeichnet eine Bewegung auf eine Person zu. „Kam zu Judas“ gibt den schlichten Erzählstil wieder, ohne die Absicht vorwegzunehmen.
- source_word: ἠσπάσαντο ἀλλήλους
  choice: sie begrüßten einander
  rationale: ἀσπάζομαι bezeichnet gewöhnlich das Grüßen oder Begrüßen. Eine Umarmung kann damit verbunden sein, wird vom Verb hier aber nicht zwingend ausgesagt.
- source_word: εἰρηνικῶς
  choice: friedlich
  rationale: Das Adverb beschreibt die äußerlich friedliche Art der Begegnung und bewahrt den ironischen Gegensatz zur feindlichen Absicht im folgenden Satz.
- source_word: οἱ πολέμιοι
  choice: die Feinde
  rationale: Das substantivierte πολέμιοι bezeichnet die feindliche, im Zusammenhang bekannte Gruppe. „Die Feinde“ ist präzise und natürlich.
- source_word: ἕτοιμοι ἐξαρπάσαι
  choice: standen bereit, … zu ergreifen
  rationale: ἕτοιμοι bezeichnet Bereitschaft, während ἐξαρπάζω ein plötzliches oder gewaltsames Ergreifen beziehungsweise Wegreißen ausdrücken kann. Die Hauptübersetzung bleibt knapp; die stärkere Bedeutungsnuance wird in der Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil mit klarer Satzstruktur. „Doch“ macht den im Griechischen durch καί fortgeführten, inhaltlich aber scharfen Gegensatz im Deutschen natürlich hörbar. Die Wiederholung des Namens Judas bleibt entsprechend der Vorlage erhalten.
