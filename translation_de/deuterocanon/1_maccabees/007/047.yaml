  text: And they took the spoils and the plunder[a], and they cut off Nikanor’s head and his right hand, which he had stretched out in arrogance, and brought them and displayed them beside Jerusalem.
translation:
  language: de
  text: Und sie nahmen die Beute und das Plündergut. Sie schlugen Nikanor den Kopf und die rechte Hand ab, die er hochmütig ausgestreckt hatte. Sie brachten beides herbei und stellten es bei Jerusalem[a] zur Schau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nahe bei Jerusalem. Der griechische Ausdruck bezeichnet eine Lage bei oder neben Jerusalem, ohne den genauen Ort anzugeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκῦλα
  choice: Beute
  rationale: Das Wort bezeichnet im militärischen Zusammenhang die den Besiegten abgenommene Beute. „Beute“ ist im modernen Deutschen klar und natürlich.
- source_word: προνομήν
  choice: Plündergut
  rationale: Der zweite Ausdruck hebt das geraubte beziehungsweise geplünderte Gut hervor. „Plündergut“ bewahrt die Häufung zweier unterschiedlicher Substantive, statt sie zusammenzuziehen.
- source_word: ἀφεῖλαν
  choice: schlugen … ab
  rationale: Bei Kopf und rechter Hand bezeichnet das Verb hier das Abtrennen. Die deutsche Wendung „den Kopf und die Hand abschlagen“ gibt die im Kontext eindeutige Handlung idiomatisch wieder.
- source_word: δεξιὰν
  choice: rechte Hand
  rationale: δεξιά bezeichnet gewöhnlich die rechte Hand; diese Wiedergabe bleibt näher am griechischen Wortlaut als „rechter Arm“.
- source_word: ἐξέτεινεν
  choice: ausgestreckt hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Nikanor die Hand vor ihrer Abtrennung ausgestreckt hatte.
- source_word: ἐν ὑπερηφάνως
  choice: in Überheblichkeit
  rationale: Die sprachlich auffällige griechische Form bezeichnet hochmütiges, anmaßendes Verhalten. „In Überheblichkeit“ erhält diese negative Wertung.
- source_word: ἤνεγκαν
  choice: brachten … herbei
  rationale: Die Wiedergabe bildet die anschließende Bewegung zum Ort der öffentlichen Zurschaustellung klar ab.
- source_word: ἐξέτειναν
  choice: stellten … zur Schau
  rationale: Wörtlich bedeutet das Verb „streckten aus“; im Zusammenhang mit den abgetrennten Körperteilen beschreibt es deren öffentliche Ausstellung. „Zur Schau stellen“ gibt diese Funktion natürlich wieder.
- source_word: παρὰ τὴν Ἰερουσαλήμ
  choice: bei Jerusalem
  rationale: παρά mit dem Akkusativ bezeichnet hier eine Lage an oder nahe bei Jerusalem. „Bei Jerusalem“ wahrt die räumliche Unbestimmtheit und legt weder ein Stadttor noch den Tempelbezirk fest.
theological_decisions:
- issue: Öffentlicher Umgang mit Nikanors sterblichen Überresten
  choice: Die Handlung wird als historischer Akt des Triumphs beschrieben, ohne eine zusätzliche moralische Bewertung einzufügen.
  alternative: Die Zurschaustellung ausdrücklich als göttlich geboten oder als am Stadttor beziehungsweise im Tempelbezirk geschehen zu deuten.
  rationale: Der Vers berichtet die Handlung und kennzeichnet Nikanors Verhalten als überheblich, nennt aber weder einen genauen Ausstellungsort noch bietet er eine weitergehende ausdrückliche theologische Bewertung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Gewalt wird klar, aber ohne ausschmückende Zusätze wiedergegeben. Der Fußnotenmarker steht unmittelbar bei der räumlich mehrdeutigen Formulierung.
