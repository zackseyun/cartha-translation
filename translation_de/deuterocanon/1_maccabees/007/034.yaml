lexical_decisions:
- source_word: ἐμυκτήρισεν
  choice: verhöhnte
  rationale: Das Verb bezeichnet spöttische Verachtung und kann bildhaft das Rümpfen der Nase einschließen. „Verhöhnte“ gibt den starken, verächtlichen Spott in natürlichem Deutsch wieder.
- source_word: κατεγέλασεν
  choice: lachte … aus
  rationale: Das Verb bedeutet konkret „auslachen“ oder „verspotten“. Die Wiedergabe wahrt gegenüber „verhöhnte“ das eigenständige Bild des Lachens.
- source_word: ἐμίανεν
  choice: entweihte
  rationale: μιαίνω bedeutet beflecken, verunreinigen oder entweihen. „Entweihte“ bewahrt hier die starke religiös-moralische Dimension, ohne eine konkrete Art der Verunreinigung hinzuzufügen.
- source_word: ἐλάλησεν ὑπερηφάνως
  choice: redete voller Hochmut
  rationale: Die Wendung bezeichnet hochmütiges oder anmaßendes Reden. „Voller Hochmut“ klingt im Deutschen würdig und gibt die adverbiale Aussage klar wieder.
- source_word: καὶ … καὶ … καὶ … καὶ
  choice: und … und … und … und
  rationale: Die wiederholten Konjunktionen werden beibehalten, damit die Häufung der aufeinanderfolgenden verächtlichen Handlungen und der Rhythmus des Griechischen erhalten bleiben.
theological_decisions:
- issue: Bedeutungsumfang von ἐμίανεν
  choice: entweihte sie
  alternative: verunreinigte sie / entehrte sie
  rationale: Der griechische Ausdruck kann kultische Verunreinigung wie auch allgemeine Befleckung oder Entehrung bezeichnen. „Entweihte“ erhält die mögliche religiöse Schärfe, ohne die Art der Handlung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die polysyndetische Reihung des griechischen Textes bleibt bewusst erhalten; die vier Verben werden nicht zu allgemeinen Aussagen über Spott oder Misshandlung eingeebnet.
