  source_fidelity: 'Die vierfach gereihte Darstellung entspricht dem Griechischen gut: ἐμυκτήρισεν („verhöhnte“), κατεγέλασεν („lachte ... aus“) und die wiederholten Konjunktionen bleiben erkennbar. Für ἐμίανεν ist „entweihte sie“ jedoch zu eng und im Deutschen bei Personen weniger idiomatisch; das griechische Verb lässt kultische wie allgemeine Befleckung bzw. Verunreinigung offen.'
  naturalness: Die Reihung mit „und“ ist als bewusst beibehaltene rhetorische Häufung gut verständlich. „Verunreinigte sie“ ist bei diesem semantisch offenen, schweren Vorwurf die sachnähere deutsche Wiedergabe als „entweihte sie“.
  terminology: „Verunreinigte“ bewahrt bei μιαίνω die mögliche kultische Konnotation, ohne wie „entweihte“ eine spezifische Verletzung des Heiligen zu behaupten. „sprach hochmütig“ gibt ἐλάλησεν ὑπερηφάνως knapp und idiomatisch wieder.
