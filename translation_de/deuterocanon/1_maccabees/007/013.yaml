  yaml_path: translation/deuterocanon/1_maccabees/007/013.yaml
  text: And the Hasideans were the first among the sons of Israel[a], and they sought peace from them.
translation:
  language: de
  text: Als Erste unter den Söhnen Israels[a] suchten die Hasidäer bei ihnen Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter den Israeliten«. Im Griechischen steht »unter den Söhnen Israels«, eine traditionelle Bezeichnung des Bundesvolkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτοι
  choice: die Ersten
  rationale: 'Die prädikative Verbindung mit ἦσαν bezeichnet den Vorrang der Gruppe: Sie ergriff vor den anderen die Initiative.'
- source_word: Ἀσιδαῖοι
  choice: Hasidäer
  rationale: Der etablierte Gruppenname wird transliteriert statt deutend umschrieben; „Hasidäer“ ist im Deutschen verständlich und wahrt die Verbindung zum griechischen Namen.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: unter den Söhnen Israels
  rationale: ἐν bezeichnet hier die Zugehörigkeit innerhalb einer Gruppe. Die traditionelle familiär-nationale Wendung „Söhne Israels“ bleibt erhalten.
- source_word: ἐπεζήτουν
  choice: sie suchten
  rationale: Das Imperfekt kann einen fortdauernden oder versuchten Vorgang ausdrücken. Das deutsche Präteritum gibt den Erzählfluss natürlich wieder, ohne den Ausgang der Bemühung vorwegzunehmen.
- source_word: παρʼ αὐτῶν
  choice: bei ihnen
  rationale: παρά mit Genitiv bezeichnet die Seite, von der etwas gesucht oder erlangt wird. „Bei ihnen Frieden suchen“ ist im Deutschen idiomatisch und behält den pluralischen Bezug bei.
- source_word: εἰρήνην
  choice: Frieden
  rationale: Die Grundbedeutung bleibt erhalten; „Friedensbedingungen“ oder „Versöhnung“ würden den politischen Sinn stärker auslegen, als es der einzelne griechische Begriff verlangt.
theological_decisions:
- issue: Wiedergabe der bundesgeschichtlich geprägten Volksbezeichnung υἱοῖς Ἰσραήλ
  choice: unter den Söhnen Israels
  alternative: unter den Israeliten
  rationale: Der griechische Text verwendet ausdrücklich die traditionelle familiär-nationale Formulierung. Sie wird bewahrt, während eine geläufigere deutsche Alternative in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gruppenname bleibt als Eigenbezeichnung stehen; die Satzstruktur bewahrt sowohl die Prioritätsaussage als auch die leichte Unbestimmtheit des Friedensgesuchs.
