  text: Und die Truppen töteten sie, und Demetrius setzte sich auf den Thron seines Königreichs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δυνάμεις
  choice: die Truppen
  rationale: Im militärischen Erzählzusammenhang bezeichnet δυνάμεις die bewaffneten Kräfte. „Die Truppen“ ist im modernen Deutschen natürlich und vermeidet die abstrakte Bedeutung „Mächte“.
- source_word: ἀπέκτειναν
  choice: töteten
  rationale: Der Aorist bezeichnet schlicht das Töten; „töteten“ gibt dies klar wieder, ohne eine förmliche Hinrichtung vorauszusetzen.
- source_word: ἐκάθισεν
  choice: setzte sich
  rationale: Das Verb bedeutet wörtlich „setzte sich/saß“. Im Zusammenhang mit dem Thron deutet es zugleich den Herrschaftsantritt an, ohne diesen ausdrücklich in den Text einzutragen.
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: auf den Thron seines Königreichs
  rationale: Die Formulierung bleibt der griechischen Wendung eng verbunden und wahrt deren königlichen Herrschaftsbezug. „Auf seinen Königsthron“ wäre glatter, aber stärker verdichtend.
- source_word: Δημήτριος
  choice: Demetrius
  rationale: Übliche deutsche Namensform für Δημήτριος.
