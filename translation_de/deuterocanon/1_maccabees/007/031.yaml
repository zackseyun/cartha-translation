lexical_decisions:
- source_word: ἔγνω
  choice: erkannte
  rationale: Der Aorist von γινώσκω bezeichnet hier das Erlangen einer Erkenntnis. „Erkannte“ gibt diesen Umschlag natürlich wieder; „erfuhr“ wäre ebenfalls möglich, setzte aber stärker eine Mitteilung voraus.
- source_word: ἀπεκαλύφθη
  choice: aufgedeckt worden war
  rationale: Das Passiv von ἀποκαλύπτω besagt, dass der Plan bekannt beziehungsweise offengelegt wurde. Das Plusquamperfekt bildet die zeitliche Vorordnung gegenüber Nikanors Erkenntnis im Deutschen klar ab.
- source_word: ἡ βουλὴ αὐτοῦ
  choice: sein Plan
  rationale: βουλή kann Rat, Absicht oder Plan bezeichnen. Im militärisch-politischen Zusammenhang ist „Plan“ klar, neutral und idiomatisch.
- source_word: ἐξῆλθεν
  choice: zog ... entgegen
  rationale: ἐξέρχομαι bedeutet wörtlich „hinausgehen“. Zusammen mit εἰς συνάντησιν ist die feste deutsche Wendung „jemandem entgegenziehen“ natürlich und bewahrt im Kontext die Bewegung zu einer Begegnung, ohne ausdrücklich „in den Kampf“ hinzuzufügen.
- source_word: εἰς συνάντησιν τῷ Ἰούδα
  choice: zog er Judas entgegen
  rationale: Die Wendung bezeichnet das Hinausgehen zur Begegnung mit jemandem. „Judas entgegenziehen“ ist im erzählerisch-militärischen Kontext idiomatisch; die feindliche Art der Begegnung bleibt dem Zusammenhang überlassen.
- source_word: Ἰούδα
  choice: Judas
  rationale: Der Personenname Ἰούδας wird gemäß der im Deutschen etablierten Form für Judas Makkabäus als „Judas“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: 'Moderne, würdige Erzählsprache. Der Satz bleibt knapp und erhält die Abfolge: Nikanor erkennt die Aufdeckung seines Plans und rückt daraufhin Judas entgegen. Die einleitende Wiedergabe mit „Als“ macht das Verhältnis der beiden καί-Sätze im Deutschen flüssig, ohne einen zusätzlichen Kausalzusammenhang zu behaupten.'
