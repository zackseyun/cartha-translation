  text: And he spoke peaceful words with them, and swore to them, saying, “We will not seek harm against you or against your friends.”
translation:
  language: de
  text: 'Und er redete mit ihnen in friedlichen Worten und schwor ihnen: »Wir werden weder euch noch euren Freunden etwas Böses antun.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir werden euch und euren Freunden keinen Schaden zufügen.« Das griechische Wort κακόν kann sowohl Böses als auch Schaden bezeichnen; hier ist wahrscheinlich schädigendes Handeln gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν μετʼ αὐτῶν
  choice: er sprach … mit ihnen
  rationale: Die Formulierung gibt λαλέω und μετά mit Genitiv direkt und zugleich in natürlichem erzählendem Deutsch wieder.
- source_word: εἰρηνικοὺς λόγους
  choice: friedliche Worte
  rationale: Die transparente Wiedergabe bewahrt den Bezug auf den friedlichen beziehungsweise versöhnlichen Charakter seiner Worte, ohne ihre Aufrichtigkeit vorauszusetzen.
- source_word: ὤμοσεν αὐτοῖς
  choice: schwor ihnen
  rationale: Die knappe Formulierung entspricht dem griechischen Verb und seinem Dativ; ein ergänztes »einen Eid« ist im Deutschen nicht erforderlich.
- source_word: Οὐκ ἐκζητήσομεν ὑμῖν κακὸν
  choice: Wir werden … euch … [nichts] Böses antun
  rationale: Wörtliches »Böses suchen« wäre im heutigen Deutsch unnatürlich. »Etwas Böses antun« gibt die hier gemeinte feindliche beziehungsweise schädigende Absicht idiomatisch wieder und lässt κακόν als »Böses« erkennbar.
- source_word: τοῖς φίλοις ὑμῶν
  choice: euren Freunden
  rationale: »Freunde« ist die unmarkierte Bedeutung von φίλοι; eine Einengung auf politische Verbündete ist vom Vers allein nicht gefordert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarige Formulierung »weder … noch« bildet die Reichweite der Verneinung über die Angeredeten und ihre Freunde natürlich ab; »friedliche Worte« wahrt zugleich die formale Nähe zum Griechischen.
