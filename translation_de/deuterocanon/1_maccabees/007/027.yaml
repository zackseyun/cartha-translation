    rationale: λόγους εἰρηνικούς steht im Plural und bezeichnet wörtlich friedliche Worte. „Friedensbotschaft“ ist als Sinnwiedergabe möglich, aber enger und kann den behaupteten Inhalt stärker festlegen als der griechische Text.
  - severity: low
    issue: „ließ ihnen sagen“
    rationale: λέγων leitet die anschließende Rede ein. Die deutsche Formulierung kann eine nicht genannte dritte Person als Boten voraussetzen; eine direkte Einleitung bewahrt die syntaktische Funktion ohne diesen Zusatz.
