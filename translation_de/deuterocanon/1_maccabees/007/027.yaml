  text: And Nikanor came to Jerusalem with a large force, and he sent to Judas and his brothers deceitfully with peaceful words, saying,
translation:
  language: de
  text: 'Und Nikanor kam mit einer großen Streitmacht nach Jerusalem und sandte Judas und seinen Brüdern mit List friedliche Worte und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυνάμει πολλῇ
  choice: mit einer großen Streitmacht
  rationale: Im militärischen Zusammenhang bezeichnet δύναμις eine Truppenmacht; „Streitmacht“ ist im Deutschen eindeutig und würdevoll.
- source_word: ἀπέστειλεν πρὸς Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ
  choice: sandte er Judas und seinen Brüdern ... eine ... Botschaft
  rationale: Das elliptische ἀπέστειλεν mit λόγους wird natürlich als das Senden einer Botschaft an die Adressaten wiedergegeben.
- source_word: μετὰ δόλου
  choice: in betrügerischer Absicht
  rationale: Die Wendung markiert den hinter der Friedensbotschaft stehenden Trug, ohne unnötig festzulegen, worin die Täuschung genau bestand.
- source_word: λόγους εἰρηνικούς
  choice: eine Friedensbotschaft
  rationale: Wörtlich „friedliche Worte“; im Kontext bezeichnet die Wendung eine auf Frieden zielende beziehungsweise friedlich klingende Mitteilung.
- source_word: λέγων
  choice: 'und ließ ihnen sagen:'
  rationale: Das Partizip leitet die folgende direkte Rede ein; die idiomatische deutsche Form wahrt diese Funktion.
theological_decisions: []
