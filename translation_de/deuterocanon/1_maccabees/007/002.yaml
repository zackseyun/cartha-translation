  text: And it happened[a], as he was entering the royal house of his fathers, that the forces seized Antiochus and Lysias to bring them to him.
translation:
  language: de
  text: Und es geschah, als er in den Königspalast seiner Vorfahren[a] hineinging, dass die Truppen Antiochus und Lysias ergriffen, um sie zu ihm zu bringen.
  philosophy: optimal-equivalence
  footnotes:
