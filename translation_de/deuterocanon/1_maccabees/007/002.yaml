lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Und es geschah, als
  rationale: Bewahrt die griechische erzählerische Übergangsformel und leitet zugleich den zeitlichen Nebensatz in verständlichem Deutsch ein.
- source_word: εἰσεπορεύετο
  choice: er ... einzog
  rationale: Das Imperfekt bezeichnet den gerade ablaufenden Eintritt; „einzog“ passt zudem zum Betreten einer königlichen Residenz.
- source_word: οἶκον βασιλείας
  choice: Königspalast
  rationale: Gibt die gemeinte königliche Residenz natürlich wieder; die ungewöhnliche wörtliche Formulierung wird in der Fußnote sichtbar gehalten.
- source_word: πατέρων αὐτοῦ
  choice: seiner Vorfahren
  rationale: Im Deutschen bezeichnet „Vorfahren“ in diesem Zusammenhang die dynastischen Ahnen natürlicher und eindeutiger als das wörtliche „Väter“.
- source_word: συνέλαβον
  choice: ergriffen
  rationale: Bezeichnet die gewaltsame Festsetzung, ohne ein förmliches rechtliches Verhaftungsverfahren vorauszusetzen.
- source_word: αἱ δυνάμεις
  choice: die Truppen
  rationale: Der Plural meint hier militärische Kräfte; „Truppen“ ist im Deutschen konkret und idiomatisch.
- source_word: ἀγαγεῖν αὐτοὺς αὐτῷ
  choice: um sie zu ihm zu bringen
  rationale: Gibt den finalen Infinitiv und beide Pronomen direkt wieder, ohne den im Kontext erschließbaren Bezug von „ihm“ im Text auszudeuten.
