base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/041.yaml
  text: When those from the king were speaking abusively[b][a], your angel went out and struck down one hundred eighty-five thousand among them.
translation:
  language: de
  text: Als die Leute des Königs Schmähungen ausstießen[a][b], zog dein Engel aus und erschlug unter ihnen hundertfünfundachtzigtausend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lästerten“. Das griechische Verb kann beleidigendes, schmähendes oder ehrfurchtsloses Reden bezeichnen; die Hauptfassung hält die Bedeutung weiter.'
    reason: lexical_alternative
  - marker: b
    text: Dies spielt auf die Vernichtung des assyrischen Heeres zur Zeit Hiskijas an; siehe 2. Könige 19,35 und Jesaja 37,36.
    reason: cross_reference
lexical_decisions:
- source_word: Οἱ παρὰ τοῦ βασιλέως
  choice: die Leute des Königs
  rationale: Die Wendung bezeichnet Personen, die vom König kommen oder in seinem Dienst stehen. „Die Leute des Königs“ ist im Deutschen natürlich und lässt offen, ob königliche Abgesandte, Diener oder Streitkräfte gemeint sind.
- source_word: ἐδυσφήμουν
  choice: Schmähungen ausstießen
  rationale: Das Verb bezeichnet üble, beleidigende oder ehrfurchtslose Rede. Die gewählte Formulierung gibt den fortgesetzten Vorgang wieder, ohne die Bedeutung vorschnell auf den theologischen Fachbegriff „lästern“ festzulegen.
- source_word: ἐξῆλθεν
  choice: zog ... aus
  rationale: „Ausziehen“ bewahrt die Bewegungsrichtung des griechischen Verbs und klingt im Zusammenhang mit einem Engel, der zum Gericht eingreift, natürlich.
- source_word: ἄγγελός σου
  choice: dein Engel
  rationale: ἄγγελος kann „Bote“ oder „Engel“ bedeuten; die Anspielung auf Gottes übernatürliches Eingreifen bei der Vernichtung des assyrischen Heeres spricht hier für „Engel“.
- source_word: ἐπάταξεν
  choice: erschlug
  rationale: Das Verb bedeutet „schlagen“ und bezeichnet hier offenkundig ein tödliches Gericht. „Erschlug“ gibt das Ergebnis knapp und würdig wieder.
- source_word: ἐν αὐτοῖς
  choice: unter ihnen
  rationale: Die Präpositionalwendung bezeichnet hier die Betroffenen innerhalb der genannten Gruppe; „unter ihnen“ ist die natürliche deutsche Entsprechung.
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: hundertfünfundachtzigtausend
  rationale: Die ausgeschriebene Zahl entspricht genau der ausdrücklichen Zahlenangabe des griechischen Textes und fügt sich in den fortlaufenden Bibeltext ein.
theological_decisions:
- issue: Ob δυσφημέω ausdrücklich theologisch als Gotteslästerung wiederzugeben ist
  choice: Schmähungen ausstießen
  alternative: lästerten / Gott lästerten
  rationale: Der Zusammenhang legt ehrfurchtslose Rede gegen Gott nahe, doch das griechische Verb bezeichnet allgemeiner beleidigendes oder übles Reden, und ein ausdrückliches Objekt fehlt. Die Hauptfassung bewahrt diese Bedeutungsbreite; die Fußnote nennt die theologisch zugespitzte Möglichkeit.
- issue: Referent von ἄγγελός σου
  choice: dein Engel
  alternative: dein Bote
  rationale: Obwohl ἄγγελος beide Bedeutungen haben kann, verweist der Vers auf das göttliche Gericht über das assyrische Heer, das durch einen himmlischen Engel vollzogen wurde. „Engel“ entspricht daher dem Kontext, ohne den Text zu entmythologisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Leute des Königs“ vermeidet eine unnötige Festlegung ihrer genauen Funktion; „Schmähungen ausstießen“ ist verständlich und bewahrt die lexikalische sowie theologische Spannung. Die ausgeschriebene Zahl entspricht dem Stil fortlaufender biblischer Prosa.
