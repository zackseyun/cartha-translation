lexical_decisions:
- source_word: ἐξῆλθον
  choice: kamen … heraus
  rationale: Gibt die Bewegung aus den umliegenden Dörfern im erzählerischen Zusammenhang natürlich wieder.
- source_word: κωμῶν
  choice: Dörfern
  rationale: κώμη bezeichnet gewöhnlich ein Dorf oder eine kleinere, nichtstädtische Siedlung.
- source_word: κυκλόθεν
  choice: ringsum
  rationale: Bewahrt knapp den räumlichen beziehungsweise taktischen Sinn von allen Seiten her.
- source_word: ὑπερεφέρων
  choice: umgingen sie
  rationale: Die ungewöhnliche Form bezeichnet im Zusammenhang wahrscheinlich einen taktischen Vorteil durch eine seitliche oder umfassende Bewegung; „umgingen“ ist zurückhaltender als „umzingelten“.
- source_word: ἀνέστρεφον
  choice: wandten sich
  rationale: Bewahrt die Grundbedeutung des Sichwendens, ohne eindeutig Rückzug, Umkehr oder Gegenangriff festzulegen.
- source_word: οὗτοι πρὸς τούτους
  choice: diese gegen jene
  rationale: Erhält die knappe Gegenüberstellung der griechischen Demonstrativpronomen und vermeidet eine nicht ausdrücklich gegebene Identifizierung der beiden Gruppen.
- source_word: ἔπεσαν πάντες ῥομφαίᾳ
  choice: sie alle fielen durch das Schwert
  rationale: Entspricht der üblichen Kriegssprache des griechischen Textes und bleibt in würdigem Deutsch verständlich.
- source_word: οὐ κατελείφθη ἐξ αὐτῶν οὐδὲ εἷς
  choice: kein Einziger von ihnen blieb übrig
  rationale: Gibt die nachdrückliche Verneinung einschließlich οὐδὲ εἷς wieder.
