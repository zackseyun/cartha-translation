  terminology: Bakchides ist eine etablierte deutsche Namensform. »Freunde des Königs« bewahrt sinnvoll die mögliche Hofrangbezeichnung und wird angemessen erläutert. Die territoriale Bezeichnung wird nicht dogmatisch mit dem Euphrat identifiziert; die Fußnote lässt die einfachere Lesart offen.
