  text: And the king chose Bacchides[a], one of the king’s Friends, governor of the region beyond the River, and great in the kingdom, and faithful to the king[b],
translation:
  language: de
  text: Und der König wählte Bakchides, einen der Freunde des Königs[a], der im Gebiet »Jenseits des Stromes«[b] herrschte, im Königreich eine hohe Stellung innehatte und dem König treu war,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die »Freunde des Königs« waren wahrscheinlich nicht bloß persönliche Freunde, sondern Angehörige eines anerkannten höfischen Ranges oder Kreises von königlichen Beratern und Begleitern in der hellenistischen Verwaltung.
    reason: cultural_note
  - marker: b
    text: »Jenseits des Stromes« ist eine Gebietsbezeichnung, wahrscheinlich für das westlich des Euphrat gelegene Reichsgebiet; die Wendung kann jedoch auch schlicht »jenseits des Stromes« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: erwählte
  rationale: Das Verb bezeichnet das Auswählen. »Erwählte« gibt dies direkt und in einem würdigen erzählenden Register wieder, ohne bereits eine förmliche Ernennung vorauszusetzen.
- source_word: τὸν Βακχίδην
  choice: Bakchides
  rationale: Die Namensform folgt einer üblichen deutschen Umschrift des griechischen Βακχίδης.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: einen von den Freunden des Königs
  rationale: Der partitive Sinn wird ausdrücklich wiedergegeben. »Freunde« bleibt verständlich, während die Fußnote auf den wahrscheinlich rangbezogenen hellenistischen Hofgebrauch hinweist.
- source_word: κυριεύοντα
  choice: der … die Herrschaft ausübte
  rationale: Die Formulierung bewahrt den Grundsinn des Ausübens von Herrschaft, ohne das Partizip vorschnell als konkreten Amtstitel wie »Statthalter« festzulegen.
- source_word: ἐν τῷ πέραν τοῦ ποταμοῦ
  choice: im Gebiet »Jenseits des Stromes«
  rationale: Die Ergänzung »Gebiet« macht den territorial-administrativen Gebrauch verständlich; die Anführungszeichen kennzeichnen »Jenseits des Stromes« als Gebietsbezeichnung, ohne den gemeinten Strom im Haupttext ausdrücklich mit dem Euphrat gleichzusetzen.
- source_word: μέγαν ἐν τῇ βασιλείᾳ
  choice: im Königreich großen Einfluss hatte
  rationale: μέγαν bezeichnet hier gesellschaftlich-politische Größe oder Bedeutung, nicht Körpergröße. »Großen Einfluss hatte« ist natürliches modernes Deutsch und wahrt den politischen Sinn.
- source_word: πιστὸν τῷ βασιλεῖ
  choice: dem König treu war
  rationale: Die Wendung gibt politische Treue beziehungsweise Verlässlichkeit direkt wieder und lässt diese Bedeutungsbreite bestehen.
