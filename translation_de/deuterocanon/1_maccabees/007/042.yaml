base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/042.yaml
  text: So crush this camp before us today[a], and let the rest know that he has spoken wickedly against your holy things; judge him according to his wickedness.
translation:
  language: de
  text: So zerschmettere heute dieses Heerlager vor unseren Augen, und lass die Übrigen erkennen, dass er Böses geredet hat gegen das, was dir heilig ist[a]. Richte ihn nach seiner Bosheit!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen dein Heiligtum“. Wörtlich steht im Griechischen ein Plural: „gegen deine heiligen Dinge“; gemeint sein kann allgemein das, was Gott heilig ist, einschließlich des Heiligtums.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντριψον
  choice: zerschmettere
  rationale: Der Aoristimperativ von συντρίβω fordert eine entschiedene Vernichtung. „Zerschmettere“ ist kraftvoll, würdig und passt sowohl zur militärischen Niederlage als auch zum göttlichen Gericht.
- source_word: παρεμβολὴν
  choice: Heerlager
  rationale: παρεμβολή bezeichnet hier ein militärisches Lager. „Heerlager“ macht diesen Kontext deutlicher als das allgemeinere „Lager“, ohne bereits „Armee“ zu übersetzen.
- source_word: ἐνώπιον ἡμῶν
  choice: vor unseren Augen
  rationale: Die Wendung bedeutet „vor uns/in unserer Gegenwart“. „Vor unseren Augen“ ist natürliches Deutsch und bewahrt den Gedanken eines sichtbar vollzogenen Gerichts.
- source_word: οἱ ἐπίλοιποι
  choice: die Übrigen
  rationale: Der Ausdruck bezeichnet die Verbleibenden oder den Rest. „Die Übrigen“ vermeidet die präzisierende, aber im Griechischen nicht ausdrücklich formulierte Deutung „die Überlebenden“.
- source_word: κακῶς ἐλάλησεν
  choice: böse ... geredet hat
  rationale: κακῶς bezeichnet hier moralisch verwerfliches Reden, nicht bloß ungeschicktes Sprechen. Die Perfektform im Deutschen gibt den griechischen Aorist im Zusammenhang natürlich wieder.
- source_word: ἐπὶ τὰ ἅγιά σου
  choice: gegen das, was dir heilig ist
  rationale: Das substantivierte neutrale Plural τὰ ἅγια kann heilige Dinge oder den Heiligtumsbereich bezeichnen. Die gewählte Formulierung bewahrt den breiten Bezug und klingt im modernen Deutschen natürlicher als „gegen deine heiligen Dinge“.
- source_word: κρῖνον αὐτὸν
  choice: Richte ihn
  rationale: κρίνω bezeichnet Gottes richterliches Handeln. „Richte ihn“ bewahrt den Grundsinn, ohne das Ergebnis durch „verurteile“ vorwegzunehmen.
- source_word: κατὰ τὴν κακίαν αὐτοῦ
  choice: nach seiner Bosheit
  rationale: Die Formulierung bleibt der griechischen Verhältnisangabe nahe und lässt offen, ob nach dem Maß oder entsprechend dem Verdienst seiner Bosheit gerichtet werden soll.
theological_decisions:
- issue: Bezug des Singulars αὐτόν („ihn“) nach ἐλάλησεν („er redete“)
  choice: Der Singular „er/ihn“ bleibt erhalten.
  alternative: Den Singular kollektiv auf das feindliche Heer beziehen oder verallgemeinernd im Plural wiedergeben.
  rationale: Der griechische Text wechselt vom kollektiven „dieses Heerlager“ zu einem einzelnen Schuldigen. Die Beibehaltung des Singulars wahrt diese grammatische und theologische Spannung, ohne den Betreffenden innerhalb dieses Verses näher zu identifizieren.
- issue: Bedeutungsumfang von τὰ ἅγιά σου
  choice: Breit als „das, was dir heilig ist“ wiedergegeben.
  alternative: Enger als „dein Heiligtum“ verstehen.
  rationale: Der griechische Plural kann sowohl Gottes heilige Dinge insgesamt als auch das Heiligtum beziehungsweise dessen heiligen Bereich meinen. Der Haupttext legt sich nicht unnötig auf nur eine Möglichkeit fest; die Fußnote nennt die geläufige engere Lesart.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die kräftigen Imperative und die Singularbezüge des griechischen Textes bleiben erhalten; unnötige konfessionelle oder auslegungsspezifische Festlegungen werden vermieden.
