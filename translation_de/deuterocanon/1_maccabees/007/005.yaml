lexical_decisions:
- source_word: ἄνδρες
  choice: Männer
  rationale: Das ausdrücklich maskuline Substantiv bezeichnet hier eine bestimmte Gruppe männlicher Akteure.
- source_word: ἄνομοι
  choice: gesetzlos
  rationale: Bewahrt den Bezug auf ein Handeln gegen das Gesetz, wahrscheinlich mit bundesbezogenen und jüdisch-rechtlichen Untertönen.
- source_word: ἀσεβεῖς
  choice: gottlos
  rationale: Gibt die mangelnde Ehrfurcht gegenüber Gott in natürlichem, gegenwärtigem Deutsch wieder und hält die religiöse Dimension fest.
- source_word: ἐξ Ἰσραήλ
  choice: aus Israel
  rationale: Kennzeichnet die Männer als Personen, die aus Israel selbst hervorgingen.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: Bei einem Verb der Bewegung bezeichnet die Präposition hier das Ziel der Annäherung.
- source_word: ἡγείται αὐτῶν
  choice: führte sie an
  rationale: Das historische Präsens wird im deutschen Erzählstil als Präteritum wiedergegeben; die Formulierung bezeichnet Alkimos als Anführer der Gruppe.
- source_word: βουλόμενος
  choice: weil er … wollte
  rationale: Der kausale Nebensatz bringt die im Partizip ausgedrückte Absicht beziehungsweise Motivation in flüssigem Deutsch zum Ausdruck.
- source_word: ἱερατεύειν
  choice: Priester sein
  rationale: Die Übersetzung bleibt beim ausdrücklichen Wortlaut des griechischen Infinitivs und ergänzt nicht stillschweigend „Hoherpriester“, obwohl der Kontext wahrscheinlich dieses Amt meint.
theological_decisions:
- issue: Moralisch-religiöse Kennzeichnung der Männer aus Israel
  choice: gesetzlos und gottlos
  alternative: böse und frevelhaft
  rationale: 'Die beiden getrennten Vorwürfe bleiben erhalten: Missachtung des Gesetzes und mangelnde Ehrfurcht gegenüber Gott.'
- issue: Genauigkeit der Amtsbezeichnung bei Alkimos
  choice: Priester sein, mit erläuternder Fußnote zum hohenpriesterlichen Amt
  alternative: Hoherpriester sein
  rationale: ἱερατεύειν nennt das Hohepriesteramt nicht ausdrücklich. Die Hauptübersetzung bewahrt diese lexikalische Offenheit; die Fußnote erläutert den wahrscheinlichen historischen Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gesetzlos“ und „gottlos“ bewahren die doppelte, rechtlich-bundestheologische und religiöse Wertung. Die etwas unübliche Wendung „Priester sein wollte“ folgt bewusst der Offenheit des Griechischen; die kontextuelle Präzisierung steht in der Fußnote.
