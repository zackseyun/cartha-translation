  source_fidelity: Die Übersetzung gibt die beiden Wertungen ἄνομοι und ἀσεβεῖς zutreffend als „gesetzlos und gottlos“ wieder und bewahrt mit „aus Israel“ die Zugehörigkeit der Gruppe zu Israel. „Alkimos führte sie an“ gibt ἡγεῖται αὐτῶν idiomatisch im deutschen Erzählpräteritum wieder. Die Hauptfassung „weil er Priester sein wollte“ ist jedoch sowohl syntaktisch leicht kausal verengt als auch im Deutschen weniger präzise für ἱερατεύειν, das die Ausübung des priesterlichen Dienstes bzw. Amtes bezeichnet.
  naturalness: „Das Priesteramt ausüben wollte“ ist modernes, klares Standarddeutsch und gibt die griechische Infinitivkonstruktion ohne die unnatürliche Wendung „Priester sein wollte“ wieder. Die Partizipialkonstruktion „und wollte das Priesteramt ausüben“ wahrt die motivierende Begleitumstandsangabe, ohne sie durch „weil“ zu einer ausdrücklichen Kausalrelation zu machen.
  terminology: „Gesetzlos“, „gottlos“, „Männer“, „Alkimos“ und „Priesteramt“ sind passend. „Hohepriester“ darf nicht unmarkiert in den Haupttext eingeführt werden, da ἱερατεύειν dies nicht ausdrücklich sagt. Der historische Bezug auf das Hohepriesteramt kann vorsichtig in der Fußnote genannt werden.
