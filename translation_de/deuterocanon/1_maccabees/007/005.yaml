  yaml_path: translation/deuterocanon/1_maccabees/007/005.yaml
  text: And all the lawless and ungodly men from Israel came to him[a], and Alcimus led them, wanting to be priest,
translation:
  language: de
  text: Und alle gesetzlosen und gottlosen Männer aus Israel kamen zu ihm, und Alkimos führte sie an und wollte das Priesteramt ausüben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Priester werden wollte“. Das griechische Verb kann „als Priester dienen“ oder „das Priesteramt ausüben“ bedeuten; im Zusammenhang bezieht es sich wahrscheinlich auf Alkimos’ Streben nach dem Amt des Hohepriesters.'
