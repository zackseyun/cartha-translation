base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/020.yaml
  text: And he appointed Alcimus over the country, and left with him a force to help him; and Bacchides went away to the king.
translation:
  language: de
  text: Und er setzte Alkimos über das Land ein und ließ eine Streitmacht bei ihm zurück, die ihn unterstützen sollte. Dann zog Bakchides zum König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: setzte … über … ein
  rationale: Die Konstruktion mit dem Akkusativ τὴν χώραν und dem Dativ τῷ Ἀλκίμῳ bezeichnet hier die Einsetzung des Alkimos in eine Herrschafts- oder Verwaltungsstellung über das Land.
- source_word: τὴν χώραν
  choice: das Land
  rationale: χώρα bezeichnet hier das politisch verwaltete Territorium; „Land“ ist im Deutschen natürlich und wahrt die territoriale Bedeutung.
- source_word: ἀφῆκεν
  choice: ließ … zurück
  rationale: Im Zusammenhang mit einer bei Alkimos verbleibenden Streitmacht bezeichnet das Verb das Zurücklassen.
- source_word: δύναμιν
  choice: eine Streitmacht
  rationale: δύναμις hat in diesem militärischen Erzählzusammenhang kollektive Bedeutung. „Streitmacht“ macht dies deutlich, ohne den Umfang als vollständiges Heer festzulegen.
- source_word: τοῦ βοηθεῖν αὐτῷ
  choice: die ihn unterstützen sollte
  rationale: Der artikulierte Infinitiv gibt den Zweck der zurückgelassenen Streitmacht an. Die deutsche Relativkonstruktion drückt diesen Zweck natürlich aus.
- source_word: ἀπῆλθεν
  choice: zog
  rationale: Bei einer militärischen Führungsperson bezeichnet „zog … zum König“ die Abreise idiomatisch und knapp.
- source_word: πρὸς τὸν βασιλέα
  choice: zum König
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf den König zu. Ein „zurück“ wird nicht ergänzt, da es im griechischen Wortlaut nicht ausdrücklich steht.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Einsetzen“ bewahrt den amtlich-politischen Sinn; „Streitmacht“ kennzeichnet den militärischen Zusammenhang. Die zwei griechischen Hauptsätze werden im Deutschen durch einen Punkt und „Dann“ klar und flüssig verbunden.
