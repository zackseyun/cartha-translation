base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/026.yaml
  text: And the king sent Nikanor[a], one of his honored rulers, who hated and was hostile to Israel[b], and commanded him to destroy the people.
translation:
  language: de
  text: Und der König sandte Nikanor, einen seiner angesehenen Amtsträger[a], der Israel hasste und ihm gegenüber feindlich gesinnt war. Er befahl ihm, das Volk zu vernichten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen seiner angesehenen Machthaber“; wörtlich: „einen seiner angesehenen Herrscher“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Volk zu beseitigen“; in diesem Zusammenhang auch: „auszurotten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Das gewöhnliche deutsche Erzählverb gibt die Entsendung im Auftrag des Königs würdig und natürlich wieder.
- source_word: ὁ Βασιλεὺς
  choice: der König
  rationale: Bezeichnet im Kontext den regierenden Monarchen; die Kleinschreibung entspricht dem modernen deutschen Gebrauch.
- source_word: Νικάνορα
  choice: Nikanor
  rationale: Die Namensform bildet das griechische Νικάνορα direkt und entspricht der im Deutschen gebräuchlichen Transliteration.
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ τῶν ἐνδόξων
  choice: einen seiner angesehenen Befehlshaber
  rationale: ἄρχων kann einen führenden Amtsträger oder Machthaber bezeichnen; im Kontext seiner königlichen Entsendung ist „Befehlshaber“ natürlich, während ἐνδόξων dessen hohen Rang als „angesehen“ kennzeichnet.
- source_word: μισοῦντα καὶ ἐχθραίνοντα τῷ Ἰσραήλ
  choice: der Israel hasste und ihm feindlich gesinnt war
  rationale: Die beiden Partizipien werden als Relativsatz wiedergegeben. Die Formulierung bewahrt sowohl den Hass als auch die ausdrücklich genannte feindliche Haltung, ohne sie miteinander zu verschmelzen.
- source_word: ἐνετείλατο αὐτῷ
  choice: Er befahl ihm
  rationale: ἐντέλλομαι bezeichnet einen verbindlichen Auftrag; ein neuer Hauptsatz vermeidet eine schwerfällige deutsche Satzkette und macht den Bezug auf Nikanor eindeutig.
- source_word: ἐξᾶραι τὸν λαόν
  choice: das Volk zu vernichten
  rationale: Im feindlichen militärisch-politischen Zusammenhang meint ἐξαίρω die Beseitigung des Volkes; „vernichten“ wahrt die starke Bedrohung in einem würdigen Register.
theological_decisions:
- issue: Stärke und Bedeutungsumfang von ἐξᾶραι τὸν λαόν
  choice: „das Volk zu vernichten“ im Haupttext
  alternative: „das Volk zu beseitigen“ oder „auszurotten“
  rationale: Der Zusammenhang spricht für gewaltsame Vernichtung, doch das Verb kann grundlegend auch „wegnehmen/beseitigen“ bedeuten. Die Fußnote hält diese lexikalische Spannweite offen, ohne die feindliche Absicht abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Wiederholung von Hass und Feindschaft bleibt als bewusste Verstärkung erhalten; die Fußnoten markieren echte lexikalische Alternativen.
