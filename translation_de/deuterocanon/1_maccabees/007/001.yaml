base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/001.yaml
  text: In the one hundred fifty-first year[a], Demetrius son of Seleucus went out from Rome, and went up with a few men to a city by the sea[b], and reigned there.
translation:
  language: de
  text: Im einhunderteinundfünfzigsten Jahr verließ Demetrius, der Sohn des Seleukus, Rom. Mit wenigen Männern zog er hinauf zu einer Stadt am Meer[a] und herrschte dort als König[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einer Küstenstadt“. Wörtlich steht im Griechischen: „zu einer Stadt am Meer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurde dort König“. Das griechische Verb kann je nach Zusammenhang sowohl den Beginn der Königsherrschaft als auch das Herrschen als König bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους ἑνὸς καὶ πεντηκοστοῦ
  choice: Im einhunderteinundfünfzigsten Jahr
  rationale: Die griechische Datierungsformel wird in natürlichem, gehobenem Standarddeutsch wiedergegeben und die Ordnungszahl genau bewahrt.
- source_word: ἐξῆλθεν … ἐκ Ῥώμης
  choice: verließ … Rom
  rationale: Die Wendung bezeichnet die Bewegung aus Rom heraus. „Verließ Rom“ ist im Deutschen natürlicher als das wörtliche „ging aus Rom hinaus“, ohne eine Flucht oder andere nicht ausdrücklich genannte Umstände anzudeuten.
- source_word: Δημήτριος ὁ τοῦ Σελεύκου
  choice: Demetrius, der Sohn des Seleukus
  rationale: Der griechische Artikel mit Genitiv dient als Patronymikon; die ausdrückliche Wiedergabe mit „Sohn“ ist klar und idiomatisch.
- source_word: ἀνέβη
  choice: zog … hinauf
  rationale: „Hinaufziehen“ bewahrt die Bewegungsrichtung des griechischen Verbs, ohne eine bestimmte Route oder geographische Erklärung hinzuzufügen.
- source_word: σὺν ἀνδράσιν ὀλίγοις
  choice: mit wenigen Männern
  rationale: Die schlichte Begleitangabe und die geringe Größe der Gruppe werden unmittelbar wiedergegeben.
- source_word: εἰς πόλιν παραθαλασσίαν
  choice: zu einer Stadt am Meer
  rationale: Die Formulierung entspricht dem anschaulichen griechischen Ausdruck und bleibt natürlicher als eine streng zusammengesetzte Wiedergabe.
- source_word: ἐβασίλευσεν
  choice: herrschte dort als König
  rationale: Die Wiedergabe hält den königlichen Sinn des Verbs ausdrücklich fest, ohne eindeutig festzulegen, ob vor allem der Beginn der Königsherrschaft oder ihre Ausübung gemeint ist.
theological_decisions:
- issue: Bedeutungsumfang von ἐβασίλευσεν
  choice: herrschte dort als König
  alternative: wurde dort König
  rationale: Der Aorist kann sowohl die Ausübung als auch den Beginn der Königsherrschaft bezeichnen. Der Haupttext wahrt den königlichen Amtscharakter; die Fußnote erhält die mögliche ingressivische Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. Die Wiederholung von „zog“ bildet den Bewegungsablauf ab; die Teilung in zwei Sätze vermeidet eine schwerfällige Reihung, ohne den Inhalt oder die Abfolge zu verändern.
