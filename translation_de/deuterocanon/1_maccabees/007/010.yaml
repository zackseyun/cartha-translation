base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/010.yaml
  text: And he departed and came into the land of Judah with a large force[a], and he sent messengers to Judas and to his brothers with peaceful words, but with deceit.
translation:
  language: de
  text: 'Er brach auf und kam mit einer großen Streitmacht in das Land Juda. Dann sandte er Boten zu Judas und seinen Brüdern: friedliche Worte, doch in betrügerischer Absicht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „friedliche Worte mit Arglist“. Das Griechische stellt der äußerlich friedlichen Rede die betrügerische Absicht gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν καὶ ἦλθεν
  choice: brach auf und kam
  rationale: Die beiden Aoristformen schildern nacheinander Aufbruch und Ankunft. „Brach auf und kam“ bewahrt diese Bewegung, ohne den Ausgangsort oder den Reiseweg näher zu bestimmen.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: mit einer großen Streitmacht
  rationale: δύναμις bezeichnet in diesem militärischen Zusammenhang eine bewaffnete Truppe, nicht abstrakte Macht. „Streitmacht“ ist präzise und fügt nicht ausdrücklich den Begriff „Heer“ ein.
- source_word: εἰς γῆν Ἰούδα
  choice: in das Land Juda
  rationale: Die Wiedergabe behält γῆ als „Land“ bei und versteht Juda territorial.
- source_word: ἀπέστειλεν ἀγγέλους
  choice: sandte er Boten
  rationale: ἄγγελοι sind hier menschliche Überbringer einer politisch-militärischen Botschaft. „Boten“ ist im Deutschen natürlich und sachlich.
- source_word: πρὸς Ἰούδαν καὶ πρὸς τοὺς ἀδελφοὺς αὐτοῦ
  choice: zu Judas und seinen Brüdern
  rationale: Die Richtungsangabe πρός wird idiomatisch mit „zu“ wiedergegeben; ἀδελφοί bleibt als „Brüder“ erhalten.
- source_word: λόγους εἰρηνικοὺς
  choice: friedliche Worte
  rationale: Die Formulierung bewahrt das Bild äußerlich friedlicher Rede und bleibt nahe an der griechischen Wendung.
- source_word: μετὰ δόλου
  choice: doch in betrügerischer Absicht
  rationale: δόλος bezeichnet Täuschung oder Arglist. Das ergänzte „doch“ macht den im Griechischen sachlich angelegten Gegensatz zu den friedlichen Worten im Deutschen deutlich; „in ... Absicht“ drückt aus, dass die Rede nur äußerlich friedlich war.
