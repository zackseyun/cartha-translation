base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/019.yaml
  text: And Bacchides departed from Jerusalem and encamped at Bethzaith[a], and he sent and seized many of the men who had deserted to him, and some of the people[c][b], and slaughtered them in the great pit.
translation:
  language: de
  text: Und Bakchides brach von Jerusalem auf und schlug bei Bexeth sein Lager auf. Dann sandte er aus und ergriff viele von denen, die zu ihm übergelaufen waren,[a] sowie einige aus dem Volk. Er tötete sie an der großen Zisterne.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die zu ihm übergetreten waren“; auch: „die zu ihm desertiert waren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an dem großen Brunnen“ beziehungsweise „an der großen Grube“. Das griechische Wort kann einen Brunnen, eine Grube oder eine Zisterne bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht hier ein Verb mit der Bedeutung „opfern“ oder „schlachten“. Gemeint ist in diesem Zusammenhang gewaltsames Töten; ob die Formulierung zusätzlich einen Opferklang trägt, bleibt offen. Die Ortsangabe kann auch heißen: „in die große Zisterne hinein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: brach ... auf
  rationale: Das Verb bezeichnet hier den Aufbruch von Jerusalem; die deutsche Wendung ist natürlich und wahrt die erzählerische Bewegung.
- source_word: παρενέβαλεν
  choice: schlug ... sein Lager auf
  rationale: Der militärische Zusammenhang verlangt eine Wendung für das Errichten eines Lagers.
- source_word: ἐν Βηξέθ
  choice: bei Bethzeth
  rationale: Der Ortsname wird vorsichtig nach dem griechischen Zeugen transkribiert, ohne eine unsichere semitische Identifizierung festzuschreiben.
- source_word: ἀπέστειλεν καὶ συνέλαβεν
  choice: sandte er Männer aus und ließ ... ergreifen
  rationale: Das im Griechischen elliptische Objekt von „sandte“ wird im Deutschen zurückhaltend ergänzt; die Konstruktion gibt den veranlassten Zugriff idiomatisch wieder, ohne ein förmliches Gerichtsverfahren anzudeuten.
- source_word: αὐτομολησάντων
  choice: die zu ihm übergelaufen waren
  rationale: Das Partizip bezeichnet einen Seitenwechsel zu Bakchides; „überlaufen“ ist im militärisch-politischen Zusammenhang präzise.
- source_word: τινας τοῦ λαοῦ
  choice: einige aus dem Volk
  rationale: Die partitive Bedeutung wird in natürlichem Deutsch bewahrt.
- source_word: ἔθυσεν
  choice: ließ ... niedermetzeln
  rationale: Obwohl das Verb wörtlich „opfern“ heißen kann, bezeichnet es hier eine gewaltsame Tötung. „Niedermetzeln“ bewahrt Brutalität und einen möglichen Nachklang des Schlachtens.
- source_word: εἰς τὸ φρέαρ τὸ μέγα
  choice: an der großen Zisterne
  rationale: φρέαρ kann Brunnen, Grube oder Zisterne bezeichnen; „Zisterne“ passt zu einem großen, benannten Ort. εἰς kann in Verbindung mit dem Tötungsverb ziel- oder ortsbezogen verstanden werden, weshalb die Mehrdeutigkeit in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Möglicher Opferklang von ἔθυσεν außerhalb eines kultischen Zusammenhangs
  choice: niedermetzeln
  alternative: opfern
  rationale: Der Zusammenhang schildert die Tötung von Gefangenen, nicht eindeutig eine kultische Opferhandlung. Die Übersetzung wahrt die Härte, ohne eine rituelle Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählsyntax. Der Name Βακχίδης erscheint in der im Deutschen etablierten Form „Bakchides“; Βηξέθ wird konservativ als „Bethzeth“ wiedergegeben. Die Fußnoten bewahren die lexikalische und syntaktische Mehrdeutigkeit von αὐτομολέω, φρέαρ, ἔθυσεν und εἰς.
