  yaml_path: translation/deuterocanon/1_maccabees/007/007.yaml
  text: Now then, send a man whom you trust, and let him go and see all the destruction that he has done to us and to the king’s land, and let him punish them and all who are helping them.
translation:
  language: de
  text: Nun denn, schick einen Mann, dem du vertraust. Er soll hingehen und all die Verwüstung sehen, die er über uns und das Land des Königs gebracht hat. Er soll sie und alle bestrafen, die ihnen zu Hilfe kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun also
  rationale: Gibt sowohl den zeitlichen Bezug als auch die folgernde Funktion der griechischen Wendung knapp und natürlich wieder.
- source_word: ἀπόστειλον ἄνδρα ᾧ πιστεύεις
  choice: schick einen Mann, dem du vertraust
  rationale: Bewahrt den Imperativ und die ausdrückliche Aussage, dass der Angesprochene diesem Mann vertraut.
- source_word: πορευθεὶς ἰδέτω
  choice: Er soll hingehen und … sehen
  rationale: Die Verbindung aus Partizip und Imperativ wird als natürliche deutsche Handlungsfolge wiedergegeben, ohne die Bedeutung zu erweitern.
- source_word: τὴν ἐξολέθρευσιν ἅπασαν
  choice: all die Verwüstung
  rationale: „Verwüstung“ erfasst die umfassende Zerstörung; „all die“ wahrt die verstärkende Gesamtheit von ἅπασαν und klingt im Deutschen idiomatisch.
- source_word: ἣν ἐποίησεν ἡμῖν καὶ τῇ χώρᾳ τοῦ βασιλέως
  choice: die er über uns und das Land des Königs gebracht hat
  rationale: Die Formulierung gibt die verursachte Schädigung der Betroffenen natürlich wieder und hält den Rückbezug des singularischen „er“ offen, wie im griechischen Text.
- source_word: κολάσατο αὐτοὺς
  choice: Dann soll er sie … bestrafen
  rationale: „Bestrafen“ ist eine neutrale, präzise Wiedergabe der geforderten Strafmaßnahme; „dann“ verdeutlicht lediglich die im Satz angelegte Handlungsfolge.
- source_word: πάντας τοὺς ἐπιβοηθοῦντας αὐτοῖς
  choice: alle …, die ihnen zu Hilfe kommen
  rationale: Bewahrt den verbalen Charakter des Partizips und gibt die konkrete Bedeutung des Hilfeleistens wieder, ohne die Hilfe unnötig auf militärische Unterstützung zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt erhalten; die längere griechische Satzfolge ist zur besseren Verständlichkeit in drei Sätze gegliedert. Die Pronomen „er“, „sie“ und „ihnen“ werden nicht durch erklärende Namen ersetzt, damit die im Ausgangstext vorhandenen Rückbezüge gewahrt bleiben.
