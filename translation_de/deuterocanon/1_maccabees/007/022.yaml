base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/022.yaml
  text: And all those who were troubling their people gathered to him[a], and they gained control of the land of Judah, and they inflicted a great blow in Israel.
translation:
  language: de
  text: Und alle, die ihr Volk in Unruhe versetzten, versammelten sich zu ihm. Sie brachten das Land Juda unter ihre Kontrolle und richteten in Israel[a] großes Unheil an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter Israel«. Die griechische Wendung kann bedeuten, dass das Unheil mitten im Volk Israel geschah, und muss nicht allein geografisch verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  choice: bei ihm versammelten sich
  rationale: Die mediale/passive Form mit πρός bezeichnet hier das Zusammenkommen und die Hinwendung zu ihm. Die deutsche Formulierung ist natürlich und legt keine förmliche Anwerbung nahe.
- source_word: πάντες οἱ ταράσσοντες
  choice: alle, die … in Unruhe versetzten
  rationale: Die partizipiale Wendung behält den verbalen Sinn von ταράσσω als Unruhe stiften oder Aufruhr verursachen, ohne die Personen pauschal als »Unruhestifter« zu etikettieren.
- source_word: τὸν λαὸν αὐτῶν
  choice: ihr Volk
  rationale: Die Übersetzung gibt sowohl λαός als auch das ausdrücklich vorhandene Possessivpronomen αὐτῶν wieder.
- source_word: κατεκράτησαν
  choice: brachten … unter ihre Kontrolle
  rationale: Das Verb bezeichnet das Erlangen wirksamer Herrschaft über ein Gebiet; die Wiedergabe vermeidet die weitergehende Vorstellung eines dauerhaften rechtlichen Besitzes.
- source_word: γῆν Ἰούδα
  choice: das Land Juda
  rationale: Die Formulierung bewahrt den konkreten territorialen Sinn von γῆ und entspricht dem im Deutschen üblichen biblisch-historischen Namen Juda.
- source_word: ἐποίησαν πληγὴν μεγάλην
  choice: richteten … großes Unheil an
  rationale: Die wörtliche Verbindung »machten einen großen Schlag« wäre im Deutschen unnatürlich. πληγή kann einen Schlag, eine schwere Schädigung oder ein Unheil bezeichnen; die gewählte Form bleibt bewusst weiter als »Gemetzel« oder »Niederlage«.
- source_word: ἐν Ἰσραήλ
  choice: in Israel
  rationale: ἐν bezeichnet zunächst den Bereich, in dem das Unheil geschah. »In Israel« bewahrt diese Offenheit besser als das stärker gerichtete »gegen Israel«.
