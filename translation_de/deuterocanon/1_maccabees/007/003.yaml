lexical_decisions:
- source_word: ἐγνώσθη αὐτῷ
  choice: wurde ihm bekannt
  rationale: 'Die passive Form mit dem Dativ wird direkt wiedergegeben: Die Sache gelangte zu seiner Kenntnis, ohne ihn als handelnden Urheber des Erkennens darzustellen.'
- source_word: τὸ πρᾶγμα
  choice: die Sache
  rationale: Die breite Bedeutung »Sache, Angelegenheit, Vorgang« bleibt gewahrt; »die Sache« ist im modernen Deutschen natürlich und kontextoffen.
- source_word: Μή μοι δείξητε
  choice: Zeigt mir … nicht
  rationale: μή mit dem Imperativ bezeichnet ein Verbot. Die konkrete Bedeutung von δείκνυμι, »zeigen«, wird beibehalten.
- source_word: τὰ πρόσωπα αὐτῶν
  choice: ihre Gesichter
  rationale: Dies gibt den griechischen Ausdruck wörtlich wieder und erhält seine anschauliche Härte; die kontextuelle idiomatische Bedeutung wird in der Fußnote erklärt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Verbindung mit »und« bildet die schlichte parataktische Struktur des griechischen Textes ab; der konkrete Ausdruck »ihre Gesichter« bleibt im Haupttext erhalten.
