  text: And the matter became known to him[a], and he said, “Do not show me their faces.”
translation:
  language: de
  text: 'Und die Sache wurde ihm bekannt, und er sagte: »Zeigt mir ihre Gesichter nicht.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Zeigt mir ihre Gesichter nicht.« Gemeint ist, dass sie ihm nicht vorgeführt werden sollen.'
