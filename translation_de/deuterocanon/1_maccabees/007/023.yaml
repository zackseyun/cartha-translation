base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/023.yaml
  text: And Judas saw all the evil that Alcimus and those with him had done among the sons of Israel[a], beyond even the nations.
translation:
  language: de
  text: Und Judas sah all das Böse, das Alkimos und seine Anhänger unter den Söhnen Israels angerichtet hatten – sie hatten noch mehr Böses getan als die Völker.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mehr als die Heiden“. Die griechische Wendung besagt, dass Alkimos und seine Anhänger im Bösen sogar die umliegenden Völker übertrafen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδεν
  choice: sah
  rationale: Der erzählende Aorist von ὁράω wird unmittelbar und natürlich mit „sah“ wiedergegeben; das Verb kann hier auch das Erkennen des Geschehenen einschließen.
- source_word: ἅπαν τὴν κακίαν
  choice: all das Böse
  rationale: „Das Böse“ bewahrt die moralische Aussage von κακία, während „all“ die umfassende Bedeutung von ἅπαν ausdrückt.
- source_word: ἐποίησεν
  choice: angerichtet hatten
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass die Taten der Wahrnehmung durch Judas vorausgingen. „Anrichten“ ist bei „Böses“ idiomatisch und gibt die schädigende Wirkung mit wieder.
- source_word: οἱ μετ’ αὐτοῦ
  choice: seine Anhänger
  rationale: Die Wendung bezeichnet die mit Alkimos verbundenen Unterstützer oder Gefolgsleute; „seine Anhänger“ ist im Deutschen knapp und verständlich.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: unter den Söhnen Israels
  rationale: ἐν bezeichnet hier den Bereich beziehungsweise die Personengruppe, in deren Mitte das Böse geschah. „Söhne Israels“ erhält die ausdrückliche familiale Bezeichnung des Griechischen.
- source_word: ὑπὲρ τὰ ἔθνη
  choice: schlimmer noch als die Völker
  rationale: ὑπέρ mit Akkusativ drückt hier ein Übertreffen aus. Die Formulierung wahrt den Vergleich und dessen rhetorische Zuspitzung; „die Völker“ gibt τὰ ἔθνη transparent wieder.
theological_decisions:
- issue: Wiedergabe von υἱοῖς Ἰσραήλ
  choice: unter den Söhnen Israels
  alternative: unter dem Volk Israel; unter den Israeliten
  rationale: Die Hauptfassung bewahrt die im Griechischen ausdrücklich familiale und maskulin-plurale Form, ohne sie zu einer bloßen Volksbezeichnung zu glätten.
- issue: Wiedergabe von τὰ ἔθνη
  choice: die Völker
  alternative: die Heiden
  rationale: „Die Völker“ ist quellennahe und weniger traditionsgebunden; im jüdischen Kontext sind damit die nichtisraelitischen Völker gemeint, sodass „die Heiden“ sachlich ebenfalls möglich ist.
- issue: Vergleich in ὑπὲρ τὰ ἔθνη
  choice: schlimmer noch als die Völker
  alternative: mehr als die Heiden
  rationale: Die Übersetzung erhält die theologische und moralische Spannung, dass das Böse innerhalb Israels das der nichtisraelitischen Völker übertraf, ohne den Vergleich abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt die schockierende Steigerung des griechischen Vergleichs hervor. „Söhne Israels“ wurde trotz der heute geläufigeren Form „Israeliten“ beibehalten, um die Quellengestalt sichtbar zu halten.
