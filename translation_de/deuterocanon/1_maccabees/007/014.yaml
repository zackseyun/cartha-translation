base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/014.yaml
  text: For they said[a], “A man, a priest from the seed of Aaron, has come with the forces[b], and he will not wrong us.”
translation:
  language: de
  text: 'Denn sie sagten: „Ein Mann, ein Priester aus der Nachkommenschaft Aarons[a], ist mit den Truppen[b] gekommen; er wird uns kein Unrecht antun.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „aus dem Samen Aarons“; auch „aus dem Geschlecht Aarons“. Gemeint ist seine Abstammung von Aaron.
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind militärische Kräfte; auch „mit den Streitkräften“ oder „mit dem Heer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπαν γάρ
  choice: Denn sie sagten
  rationale: γάρ kennzeichnet die Aussage als Begründung für das vorausgehende Geschehen; der Aorist εἶπαν wird im Deutschen natürlich mit dem Präteritum wiedergegeben.
- source_word: Ἄνθρωπος
  choice: Ein Mann
  rationale: Gemeint ist hier ein einzelner Mann, nicht der Mensch im allgemeinen Sinn. Die Wiedergabe bewahrt zudem die appositionelle Abfolge des Griechischen.
- source_word: ἱερεὺς
  choice: ein Priester
  rationale: Der gewöhnliche deutsche Begriff gibt die kultische Amtsbezeichnung sachgerecht wieder.
- source_word: ἐκ τοῦ σπέρματος Ἀαρών
  choice: aus der Nachkommenschaft Aarons
  rationale: σπέρμα bezeichnet in diesem genealogischen Zusammenhang die Abstammung. „Nachkommenschaft“ ist im modernen Deutschen natürlicher als die wörtliche Wendung „Samen Aarons“ und bewahrt den Bezug auf die aaronitische Priesterlinie.
- source_word: ἦλθεν
  choice: ist … gekommen
  rationale: Das Perfekt passt in der direkten Rede zu einer kürzlich erfolgten Ankunft, deren gegenwärtige Bedeutung das Vertrauen der Sprecher begründet.
- source_word: ἐν ταῖς δυνάμεσιν
  choice: mit den Truppen
  rationale: δύναμις bezeichnet im Plural hier militärische Kräfte. „Truppen“ macht diesen Sinn klar, ohne eine bestimmte militärische Gliederung vorauszusetzen.
- source_word: οὐκ ἀδικήσει ἡμᾶς
  choice: er wird uns kein Unrecht antun
  rationale: ἀδικέω umfasst ungerechtes Handeln und daraus entstehenden Schaden. Die deutsche Wendung erhält besonders den ethischen Gehalt des Verbs.
theological_decisions:
- issue: Genealogische Wendung als Begründung priesterlicher Legitimität
  choice: aus der Nachkommenschaft Aarons
  alternative: aus dem Samen Aarons; aus dem Geschlecht Aarons
  rationale: Die Formulierung erhält den ausdrücklichen Abstammungsbezug, durch den die Sprecher dem Priester Vertrauen entgegenbringen, ohne dessen Legitimität über die Aussage des Textes hinaus zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Apposition „Ein Mann, ein Priester …“ bleibt erhalten, weil sie die griechische Satzfolge und Hervorhebung abbildet; „Nachkommenschaft“ und „Truppen“ vermeiden unnötig altertümliche oder missverständliche Formulierungen.
