  yaml_path: translation/deuterocanon/1_maccabees/007/045.yaml
  text: And they pursued them for a day's journey from Adasa until they came to Gazera[a], and they sounded the signal trumpets behind them.
translation:
  language: de
  text: Und sie verfolgten sie von Adasa aus eine Tagesreise weit, bis sie nach Gazera kamen, und sie bliesen hinter ihnen die Signaltrompeten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωκον
  choice: sie verfolgten sie
  rationale: Das Imperfekt bezeichnet die andauernde Verfolgung; die schlichte deutsche Vergangenheitsform gibt den erzählerischen Zusammenhang natürlich wieder.
- source_word: ὁδὸν ἡμέρας μιᾶς
  choice: eine Tagesreise weit
  rationale: Die Wendung bezeichnet die Strecke, die an einem Tag zurückgelegt wird; diese deutsche Formulierung ist idiomatisch und bewahrt das Wegmaß.
- source_word: ἀπὸ Ἀδασὰ
  choice: von Adasa aus
  rationale: Der Ortsname wird transliteriert; „von … aus“ kennzeichnet klar den Ausgangspunkt.
- source_word: ἕως τοῦ ἐλθεῖν εἰς Γαζηρά
  choice: bis sie nach Gazera kamen
  rationale: Die Konstruktion mit ἕως und substantiviertem Infinitiv bezeichnet den Endpunkt der Verfolgung und wird eng am Griechischen wiedergegeben.
- source_word: ἐσάλπισαν
  choice: bliesen sie
  rationale: Das Verb bezeichnet hier ausdrücklich das Blasen von Trompeten; die deutsche Verbindung „Trompeten blasen“ ist natürlich und präzise.
- source_word: ὀπίσω αὐτῶν
  choice: hinter ihnen
  rationale: Die räumliche Bedeutung bleibt erhalten, ohne sie deutend als „bei ihrer Verfolgung“ aufzulösen.
- source_word: ταῖς σάλπιγξιν τῶν σημασιῶν
  choice: die Signaltrompeten
  rationale: Der Genitiv bezeichnet wahrscheinlich die Signal- beziehungsweise militärische Funktion der Trompeten. Das deutsche Kompositum ist klar und knapp.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit enger Bindung an die griechische Syntax. Die Wiederholung der Pronomen bleibt trotz möglicher Bezugsunschärfe erhalten; der Kontext unterscheidet Verfolger und Verfolgte. Keine Fußnote ist nötig, da „Signaltrompeten“ die griechische Wendung sachgerecht und ohne wesentlichen Bedeutungsverlust wiedergibt.
