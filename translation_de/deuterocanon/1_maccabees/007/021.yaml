  rationale: Die Form folgt einer im Deutschen natürlichen, quellennahen Transliteration des griechischen Namens.
- source_word: περὶ
  choice: um
  rationale: Bei einem Verb des Ringens bezeichnet περί den Gegenstand, der auf dem Spiel steht; „um“ ist dafür die idiomatische deutsche Verbindung.
- source_word: τῆς ἀρχιερωσύνης
  choice: das Amt des Hohen Priesters
  rationale: ἀρχιερωσύνη bezeichnet das Amt beziehungsweise die Würde des Hohen Priesters. Die gewählte Formulierung ist klar und institutionell präzise.
