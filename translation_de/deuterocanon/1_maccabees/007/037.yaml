revisions:
- from: Du hast dieses Haus erwählt, damit dein Name über ihm ausgerufen wird[a] und es deinem Volk ein Haus des Gebets und des Flehens sei.
  to: Du hast dieses Haus erwählt, damit dein Name über ihm genannt werde und es für dein Volk ein Haus des Gebets und des Flehens sei.[a]
  rationale: Die Revision ersetzt die missverständliche öffentliche Proklamation („ausgerufen“) durch „genannt werde“, das die griechische Passivform und die etablierte biblische Namensformel angemessen wiedergibt. Die parallele Konjunktivfügung („genannt werde ... sei“) macht die beiden von Gottes Erwählung abhängigen Zweckinfinitive sichtbar. „Für dein Volk“ formuliert die hier naheliegende Bestimmung beziehungsweise den Nutzen des Dativs in modernem Deutsch klar.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:24:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben: Gottes Erwählung dieses Hauses, die Namensformel sowie „Haus des Gebets und Flehens“ für sein Volk. „Über ihm ausgerufen“ ist jedoch im heutigen Deutsch keine natürliche Wiedergabe der biblisch-griechischen Formel ἐπικληθῆναι ... ἐπ’ αὐτόν und kann den Sinn einer öffentlichen Proklamation statt einer Namenszuordnung hervorrufen.'
  naturalness: Der Satz ist insgesamt verständlich und angemessen würdig. Die Verbindung „damit ... wird und es ... sei“ mischt jedoch eine moderne Zweckkonstruktion mit einem gehobenen Konjunktiv und klingt unnötig uneinheitlich. „Für dein Volk“ ist in modernem Standarddeutsch klarer als der hier verwendete prädikative Dativ „deinem Volk ein Haus ... sei“.
  terminology: „erwählt“, „Haus“, „Haus des Gebets“ und „Flehen“ treffen den biblisch-feierlichen Registerton und die Bedeutungsdifferenz zwischen προσευχή und δέησις gut. Für die Namensformel ist „dass dein Name über ihm genannt werde“ idiomatischer und bewahrt zugleich die bewusst formelhafte Mehrdeutigkeit. Die Fußnote sollte die Zuordnung zum göttlichen Namen erklären, ohne „ausgerufen“ als Hauptsinn nahezulegen.
  issues:
  - severity: medium
    issue: „dein Name über ihm ausgerufen wird“ ist für die griechische Namensformel missverständlich.
    rationale: ἐπικαλεῖσθαι τὸ ὄνομα ἐπί τι bedeutet in dieser biblischen Formel nicht primär, dass ein Name laut proklamiert wird, sondern dass etwas nach Gottes Namen benannt bzw. seinem Namen zugeordnet ist. „Genannt werde“ ist im Deutschen sachgerechter und weniger irreführend.
  - severity: low
    issue: Uneinheitliche Satzfügung „damit ... wird und es ... sei“.
    rationale: Die Mischung aus Indikativ und Konjunktiv in zwei koordinierten Zwecksätzen beeinträchtigt die sprachliche Geschlossenheit. Zwei parallele Konjunktivkonstruktionen bilden die griechischen Infinitive klarer ab.
  revised_text: Du hast dieses Haus erwählt, damit dein Name über ihm genannt werde und es für dein Volk ein Haus des Gebets und des Flehens sei.[a]
  revised_footnotes:
