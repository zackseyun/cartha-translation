base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/037.yaml
  text: You chose this house for your name to be called upon it[a], to be a house of prayer and petition for your people.
translation:
  language: de
  text: Du hast dieses Haus erwählt, damit dein Name über ihm genannt werde und es für dein Volk ein Haus des Gebets und des Flehens sei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit es deinen Namen trägt“ oder „damit dein Name über ihm angerufen wird“. Die griechische Wendung ist eine biblische Formel: Das Haus ist Gottes Namen zugeordnet und steht in besonderer Beziehung zu ihm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελέξω
  choice: du hast … erwählt
  rationale: Der Aorist bezeichnet Gottes Wahl des Tempels. „Erwählt“ bewahrt den feierlichen und bundestheologischen Klang, ohne unverständlich zu sein.
- source_word: τὸν οἶκον τοῦτον
  choice: dieses Haus
  rationale: „Haus“ entspricht οἶκος und bewahrt die biblische Bezeichnung des Tempels.
- source_word: ἐπικληθῆναι τὸ ὄνομά σου ἐπ’ αὐτόν
  choice: damit dein Name über ihm ausgerufen wird
  rationale: Die Formulierung bleibt nahe am griechischen Passiv und gibt die biblische Namensformel wieder, die Gottes Zugehörigkeit und Herrschaft über das Heiligtum ausdrückt.
- source_word: εἶναι
  choice: und es … sei
  rationale: Der zweite Infinitiv setzt den Zweck der Erwählung fort; die deutsche Konstruktion mit „sei“ verbindet ihn klar mit dem ersten Zwecksatz.
- source_word: οἶκον προσευχῆς
  choice: ein Haus des Gebets
  rationale: Die geläufige biblische Wendung bildet die Genitivkonstruktion präzise und würdig ab.
- source_word: καὶ δεήσεως
  choice: und des Flehens
  rationale: „Flehen“ bezeichnet gegenüber dem allgemeineren „Gebet“ die dringliche Bitte und erhält damit die Bedeutungsunterscheidung.
- source_word: τῷ λαῷ σου
  choice: deinem Volk
  rationale: 'Der Dativ wird als Dativ des Vorteils beziehungsweise der Bestimmung verstanden: Das Haus dient Gottes Volk als Ort des Gebets und Flehens.'
theological_decisions:
- issue: Tempelformel vom göttlichen Namen
  choice: damit dein Name über ihm ausgerufen wird
  alternative: damit es deinen Namen trägt; damit dein Name über ihm angerufen wird
  rationale: Die gewählte Fassung bewahrt das Passiv und die räumliche Wendung des Griechischen sowie die Spannung zwischen Benennung, Zugehörigkeit und kultischer Anrufung, ohne die Formel auf nur einen Aspekt festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Tempelsprache. „Erwählt“, „Haus des Gebets“ und „Flehen“ sind gehoben, aber allgemein verständlich.
