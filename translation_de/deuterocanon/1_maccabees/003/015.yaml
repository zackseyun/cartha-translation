base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/015.yaml
  text: And a strong camp of ungodly men was added and went up with him[b][a], to help him and to execute vengeance on the sons of Israel.
translation:
  language: de
  text: Und ein starkes Heer[a] von Gottlosen schloss sich ihm an und zog mit ihm hinauf, um ihm zu helfen und an den Söhnen Israels Vergeltung zu üben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein starkes Lager“. Das griechische Wort kann sowohl ein Heerlager als auch ein Heer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Vergeltung unter den Söhnen Israels zu üben“; gemeint ist hier ein Vorgehen, das sich gegen Israel richtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεθέτο
  choice: schloss sich ihm an
  rationale: Die mediale Verbform bezeichnet hier, dass die genannte Streitmacht zu der bereits vorhandenen hinzukam. „Schloss sich ihm an“ ist im Deutschen natürlicher als eine wörtliche Passivkonstruktion und lässt die Initiative der Gruppe offen.
- source_word: ἀνέβη
  choice: zog mit ihm hinauf
  rationale: „Hinaufziehen“ bewahrt die Bewegungsrichtung von ἀναβαίνω; „zog“ passt zugleich natürlich zu einem Heer, ohne die militärische Bedeutung allein aus dem Verb abzuleiten.
- source_word: παρεμβολὴ
  choice: Heer
  rationale: παρεμβολή kann sowohl das Lager als auch die darin versammelte Streitmacht bezeichnen. Da die Einheit sich anschließt und hinaufzieht, ist hier „Heer“ im Deutschen sachlich und idiomatisch.
- source_word: ἀσεβῶν
  choice: von Gottlosen
  rationale: Die substantivische Wiedergabe bezeichnet Menschen und erhält die religiös-moralische Wertung von ἀσεβής, die über allgemeine Bosheit hinausgeht.
- source_word: ἰσχυρὰ
  choice: starkes
  rationale: „Stark“ ist die unmittelbare, im militärischen Zusammenhang natürliche Entsprechung.
- source_word: βοηθῆσαι αὐτῷ
  choice: um ihm zu helfen
  rationale: Der Infinitiv drückt den Zweck aus; die Formulierung ist schlicht und genau.
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: Vergeltung zu üben
  rationale: Diese feste deutsche Wendung gibt die Ausführung strafender Vergeltung wieder, ohne den Ausdruck zu bloßer Bestrafung abzuschwächen.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: an den Söhnen Israels
  rationale: Nach der Vergeltungswendung bezeichnet ἐν hier die Betroffenen. „Söhne Israels“ bewahrt die ausdrückliche biblische Volksbezeichnung des griechischen Textes.
theological_decisions:
- issue: Religiös-moralische Bezeichnung ἀσεβῶν im militärisch-politischen Zusammenhang
  choice: von Gottlosen
  alternative: von Frevlern; von gesetzlosen Männern
  rationale: „Gottlose“ erhält den Bezug auf mangelnde Gottesfurcht und die religiös-moralische Wertung, ohne eine spätere konfessionelle Kategorie einzutragen.
- issue: Wiedergabe von υἱοῖς Ἰσραήλ
  choice: Söhne Israels
  alternative: Israeliten; Volk Israel
  rationale: Die traditionelle Wendung entspricht der ausdrücklichen Form des Ausgangstextes und fungiert hier als Volks- und Bundesbezeichnung, nicht als Aussage ausschließlich über männliche Personen.
- issue: Zielrichtung von ἐν bei der Vergeltung
  choice: an den Söhnen Israels
  alternative: unter den Söhnen Israels; gegen die Söhne Israels
  rationale: Der feindliche Zusammenhang spricht für Vergeltung, die sich gegen Israel richtet. Eine Fußnote macht die wörtlichere räumliche Formulierung sichtbar, da die Präposition für sich genommen breiter ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählprosa. „Heer“ und „Vergeltung üben“ wahren den militärischen und feierlichen Ton, während „schloss sich ihm an“ die im Deutschen schwerfällige wörtliche Passivkonstruktion vermeidet. Die Fußnoten sichern die lexikalische Mehrdeutigkeit von παρεμβολή und die ungewöhnliche Präpositionalkonstruktion mit ἐν.
