  yaml_path: translation/deuterocanon/1_maccabees/003/055.yaml
  text: 'And after this Judas appointed leaders of the people: commanders of thousands[a], and of hundreds, and of fifties, and of tens.'
translation:
  language: de
  text: 'Danach setzte Judas Anführer des Volkes ein: Befehlshaber über Tausend[a], über Hundert, über Fünfzig und über Zehn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Führer des Volkes“. Das griechische Wort bezeichnet allgemein Menschen in leitender Stellung; anschließend werden konkrete militärische Ränge genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ μετὰ τοῦτο
  choice: Danach
  rationale: Gibt den zeitlichen Übergang knapp und natürlich wieder; das einleitende καί muss im Deutschen nicht eigens mit „und“ wiederholt werden.
- source_word: κατέστησεν
  choice: setzte … ein
  rationale: Bezeichnet hier die Einsetzung von Personen in bestimmte Leitungs- beziehungsweise Befehlsfunktionen.
- source_word: Ἰούδας
  choice: Judas
  rationale: Entspricht der im Deutschen für 1 Makkabäer üblichen Namensform.
- source_word: ἡγουμένους τοῦ λαοῦ
  choice: Anführer des Volkes
  rationale: Bewahrt die allgemeine Bedeutung des substantivierten Partizips; die folgenden Bezeichnungen konkretisieren die militärische Rangordnung.
- source_word: χιλιάρχους καὶ ἑκατοντάρχους καὶ πεντηκοντάρχους καὶ δεκαδάρχους
  choice: Befehlshaber über Tausend, über Hundert, über Fünfzig und über Zehn
  rationale: Macht die abgestufte militärische Gliederung transparent und vermeidet römisch geprägte Amtsbezeichnungen wie „Zenturionen“.
