  yaml_path: translation/deuterocanon/1_maccabees/003/032.yaml
  text: And he left Lysias, an honored man and of the royal family, over the affairs of the king, from the Euphrates River as far as the borders of Egypt,
translation:
  language: de
  text: Und er ließ Lysias, einen angesehenen Mann aus königlichem Geschlecht, zurück und übertrug ihm die Angelegenheiten des Königs vom Euphrat bis an die Grenzen Ägyptens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν
  choice: ließ … zurück und übertrug ihm
  rationale: Gibt sowohl das Zurücklassen als auch die im Zusammenhang erkennbare Beauftragung wieder, ohne das Verb auf eine bloße Ernennung zu verengen.
- source_word: ἄνθρωπον ἔνδοξον
  choice: einen angesehenen Mann
  rationale: ἔνδοξος bezeichnet hier gesellschaftliches Ansehen oder hohes Ansehen; „angesehen“ ist natürlich und wahrt den Sinn.
- source_word: ἀπὸ γένους τῆς βασιλείας
  choice: aus königlichem Geschlecht
  rationale: Bewahrt die Aussage über Lysias’ Herkunft aus der königlichen Dynastie beziehungsweise Familie in knapper, würdiger Form.
- source_word: ἐπὶ τῶν πραγμάτων τοῦ βασιλέως
  choice: übertrug ihm die Angelegenheiten des Königs
  rationale: Die Wendung bezeichnet die Zuständigkeit für die königlichen Amts- und Regierungsgeschäfte.
- source_word: ἀπὸ τοῦ ποταμοῦ Εὐφράτου ἕως τῶν ὁρίων Αἰγύπτου
  choice: vom Euphrat bis an die Grenzen Ägyptens
  rationale: Natürliche deutsche Wiedergabe der territorialen Reichweite; „Fluss“ ist beim Eigennamen Euphrat entbehrlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch „und übertrug ihm“ so entfaltet, dass Lysias’ Verwaltungsauftrag für heutige Leser klar verständlich ist.
