base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/024.yaml
  text: And they pursued them down the descent of Beth-horon as far as the plain[a], and about eight hundred of them fell; but the rest fled into the land of the Philistines.
translation:
  language: de
  text: Und sie verfolgten sie den Abstieg von Bet-Horon hinunter bis in die Ebene. Von ihnen fielen etwa achthundert Mann[a]; die Übrigen aber flohen ins Land der Philister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „achthundert Mann“. Die griechische Verbindung mit der Zahlenangabe kann als ungefähre Angabe verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωκον
  choice: sie verfolgten sie
  rationale: Der Imperfekt beschreibt die fortdauernde Verfolgung im Erzählverlauf; das deutsche Präteritum gibt dies natürlich wieder.
- source_word: ἐν τῇ καταβάσει Βαιθωρών
  choice: den Abstieg von Bet-Horon hinunter
  rationale: κατάβασις bezeichnet einen Abstieg beziehungsweise einen abwärts führenden Weg. „hinunter“ macht die Bewegungsrichtung im Deutschen deutlich.
- source_word: ἕως τοῦ πεδίου
  choice: bis in die Ebene
  rationale: πέδιον bezeichnet flaches Land; ἕως markiert das Ziel beziehungsweise die Reichweite der Verfolgung.
- source_word: ἔπεσον ἀπ’ αὐτῶν
  choice: Von ihnen fielen
  rationale: Die Formulierung bewahrt die Zugehörigkeit der Gefallenen zur verfolgten Gruppe und lässt die im Griechischen übliche, aber nicht näher ausgeführte Bedeutung von „fallen“ stehen.
- source_word: εἰς ἄνδρας ὀκτακοσίους
  choice: etwa achthundert Mann
  rationale: εἰς bei einer Zahlenangabe kann eine ungefähre Zahl ausdrücken; ἄνδρας wird mit dem idiomatischen deutschen Kollektiv „Mann“ wiedergegeben.
- source_word: οἱ δὲ λοιποί
  choice: die Übrigen aber
  rationale: δέ setzt die Übriggebliebenen in Kontrast zu den Gefallenen; die Wortstellung ist im Deutschen würdig und gut verständlich.
- source_word: ἔφυγον εἰς γῆν Φυλιστιείμ
  choice: flohen ins Land der Philister
  rationale: Die Wendung folgt der griechischen geografischen Bezeichnung eng und bleibt im modernen Deutsch natürlich.
