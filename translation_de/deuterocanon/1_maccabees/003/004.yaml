lexical_decisions:
- source_word: ὡμοιώθη
  choice: glich
  rationale: Das passive Verb drückt hier einen Vergleich aus, keine Verwandlung. „Glich“ ist im Deutschen natürlich und bewahrt die Bildsprache.
- source_word: Λέοντι
  choice: einem Löwen
  rationale: Der Dativ bezeichnet nach ὡμοιώθη den Gegenstand des Vergleichs; „einem Löwen gleichen“ entspricht der deutschen Standardsprache.
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: in seinen Taten
  rationale: ἔργα meint hier sein Handeln, besonders seine kriegerischen Leistungen. „Taten“ ist prägnant, würdig und im erzählerischen Zusammenhang gut verständlich.
- source_word: σκύμνος
  choice: einem jungen Löwen
  rationale: σκύμνος bezeichnet ein junges Tier, in diesem Zusammenhang einen jungen Löwen. „Junger Löwe“ ist natürlich und trägt das kraftvolle Bild besser als das stärker verniedlichend wirkende „Löwenjunges“.
- source_word: ἐρυγόμενος
  choice: der … brüllt
  rationale: Das Partizip beschreibt den kräftigen Laut des Löwen. „Brüllt“ ist im modernen Deutschen die geläufige und anschauliche Wiedergabe.
- source_word: εἰς θήραν
  choice: nach Beute
  rationale: Die Präpositionalphrase bezeichnet die Ausrichtung auf Jagd oder Beute. In Verbindung mit dem Brüllen eines Raubtiers gibt „nach Beute“ den zielgerichteten Sinn knapp und idiomatisch wieder.
