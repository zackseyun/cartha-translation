  yaml_path: translation/deuterocanon/1_maccabees/003/051.yaml
  text: And your holy things have been trampled down and profaned[a], and your priests are in mourning and humiliation.
translation:
  language: de
  text: Und deine heiligen Dinge sind zertreten und entweiht worden,[a] und deine Priester sind in Trauer und Erniedrigung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deine heiligen Dinge“. Der griechische Plural kann im Zusammenhang auch heilige Stätten oder das Heiligtum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἅγιά σου
  choice: deine heiligen Stätten und Dinge
  rationale: Der substantivierte sächliche Plural bezeichnet das, was Gott heilig ist, und kann sowohl heilige Orte als auch geweihte Dinge umfassen. Die Doppelformulierung bewahrt diese Breite und vermeidet die unbegründete Verengung auf ein einzelnes Heiligtum.
- source_word: κατεπεπάτηται
  choice: sind zertreten worden
  rationale: Die Perfekt-Passivform beschreibt eine vollzogene Handlung mit fortdauerndem Ergebnis. „Zertreten“ erhält das gewaltsame Bild des Unter-die-Füße-Tretens.
- source_word: βεβήλωται
  choice: entweiht worden
  rationale: Das Verb bezeichnet die Aufhebung oder Verletzung des heiligen Charakters. „Entweiht“ ist im heutigen Deutsch klarer und natürlicher als „profaniert“.
- source_word: οἱ ἱερεῖς σου
  choice: deine Priester
  rationale: Direkte und kontextgemäße Wiedergabe der am Tempel dienenden Priester.
- source_word: ἐν πένθει
  choice: in Trauer
  rationale: Die Präpositionalfügung bezeichnet den Zustand der Priester; „in Trauer“ ist natürlich und bewahrt den Charakter der Klage.
- source_word: ταπεινώσει
  choice: Erniedrigung
  rationale: Der Ausdruck kann Erniedrigung, Demütigung oder einen bedrückten niedrigen Zustand bezeichnen. „Erniedrigung“ gibt die öffentliche Schmach und Bedrängnis wieder, ohne sie nur als inneres Gefühl zu verstehen.
theological_decisions:
- issue: Umfang von τὰ ἅγιά σου
  choice: Breiter Bezug auf Gottes heilige Stätten und geweihte Dinge
  alternative: dein Heiligtum; deine heilige Stätte
  rationale: Der griechische Plural lässt sowohl heilige Bereiche als auch heilige Gegenstände zu. Die Übersetzung wahrt diese sachliche Mehrdeutigkeit, statt den Ausdruck auf ein einzelnes Tempelgebäude zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des griechischen Klagegebets bleibt erhalten; das wiederholte „worden“ macht die beiden Perfekt-Passivformen im Deutschen deutlich.
