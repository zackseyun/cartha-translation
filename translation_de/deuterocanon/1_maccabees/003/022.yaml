  source_fidelity: Sehr hoch. „Und er selbst“ gibt die emphatische Stellung von αὐτός angemessen wieder; „wird … zerschmettern“ bildet das Futur συντρίψει mit dessen gewaltsamer Bildkraft treffend ab. „vor uns“ bewahrt die offene, räumlich-präsenzbezogene Wendung πρὸ προσώπου ἡμῶν, ohne sie unnötig auszudeuten. Die negative Aufforderung μὴ φοβηθῆτε ἀπʼ αὐτῶν ist mit „fürchtet euch nicht vor ihnen“ vollständig und idiomatisch wiedergegeben.
  naturalness: Natürliches modernes Standarddeutsch mit einem passenden gehobenen, aber nicht altertümlichen Erzähl- und Ermahnungsregister. Der Kontrast mit δέ wird durch „Ihr aber“ klar und flüssig markiert.
