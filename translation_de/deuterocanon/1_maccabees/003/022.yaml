  yaml_path: translation/deuterocanon/1_maccabees/003/022.yaml
  text: And he himself will crush them before us; but as for you, do not fear them.
translation:
  language: de
  text: Und er selbst wird sie vor uns zerschmettern. Ihr aber fürchtet euch nicht vor ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντρίψει
  choice: wird zerschmettern
  rationale: Das Futur von συντρίβω bezeichnet ein gewaltsames Zerbrechen oder Zerschlagen. „Zerschmettern“ bewahrt die starke Bildsprache und den kriegerischen Zusammenhang.
- source_word: πρὸ προσώπου ἡμῶν
  choice: vor uns
  rationale: Die Wendung bedeutet wörtlich „vor unserem Angesicht“. „Vor uns“ gibt den räumlichen Sinn natürlich wieder, ohne zu präzisieren, ob besonders die Gegenwart der Israeliten oder das Vertreiben aus ihrem Blickfeld gemeint ist.
- source_word: μὴ φοβηθῆτε ἀπʼ αὐτῶν
  choice: fürchtet euch nicht vor ihnen
  rationale: Die Konstruktion mit μή drückt ein Verbot beziehungsweise eine eindringliche Aufforderung aus. Die reflexive deutsche Formulierung ist idiomatisch, würdevoll und erhält den direkten Pluralappell.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist emphatisch. „Er selbst“ bewahrt den Nachdruck auf dem handelnden Subjekt.
theological_decisions:
- issue: Identität und Hervorhebung des Subjekts αὐτός
  choice: „er selbst“; im Kontext bezieht sich das Pronomen auf Gott als den entscheidend Handelnden, ohne den Gottesnamen in den Vers einzufügen.
  alternative: „er“ ohne Hervorhebung oder die ausdrückliche Ergänzung „Gott selbst“
  rationale: Die Hervorhebung ist im Griechischen vorhanden und soll erhalten bleiben. Zugleich wahrt das Pronomen die Ausdrucksweise des Ausgangstextes und vermeidet eine erklärende Einfügung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, kräftigem Ton. Der Wechsel mit δέ wird durch „Ihr aber“ klar markiert; ein Fußnotenapparat ist für diesen Vers nicht erforderlich.
