base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/049.yaml
  text: And they brought the priestly garments[a], and the firstfruits and the tithes; and they brought forward the Nazirites, who had completed their days.
translation:
  language: de
  text: Und sie brachten die priesterlichen Gewänder, die Erstlingsgaben und die Zehntabgaben herbei; und sie ließen die Nasiräer vortreten, die ihre Tage vollendet hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die ihre Tage vollendet hatten“. Gemeint sind die vorgeschriebenen Tage ihres Nasiräergelübdes.'
    reason: Die wörtliche griechische Wendung ist knapp und setzt die Kenntnis der zeitlich begrenzten Verpflichtungen eines Nasiräergelübdes voraus.
lexical_decisions:
- source_word: ἤνεγκαν
  choice: sie brachten … herbei
  rationale: Der Aorist von φέρω bezeichnet hier das Herbeibringen der genannten Gegenstände und Abgaben. „Herbeibringen“ ist natürlich und gibt die räumliche Bewegung klar wieder.
- source_word: τὰ ἱμάτια τῆς ἱερωσύνης
  choice: die priesterlichen Gewänder
  rationale: Die Wendung bezeichnet die für den Priesterdienst bestimmten Gewänder. Diese Formulierung ist präzise und vermeidet das stärker kirchlich geprägte „Messgewänder“.
- source_word: τὰ πρωτογεννήματα
  choice: die Erstlingsgaben
  rationale: Im kultischen Zusammenhang sind die zuerst eingebrachten und Gott geweihten Erträge beziehungsweise Gaben gemeint. „Erstlingsgaben“ ist der etablierte deutsche Fachausdruck.
- source_word: τὰς δεκάτας
  choice: die Zehntabgaben
  rationale: Die Wiedergabe bezeichnet die als Zehnten abzuliefernden Anteile und wahrt zugleich den Plural des griechischen Ausdrucks.
- source_word: ἤγειραν
  choice: sie ließen … vortreten
  rationale: Das Verb bedeutet wörtlich „sie richteten auf/erhoben“. Bei Personen bezeichnet es hier wahrscheinlich, dass man sie vor die Versammlung treten ließ. Die Übersetzung gibt diese Handlung idiomatisch wieder, ohne ein Aufwecken oder eine Auferweckung anzudeuten.
- source_word: τοὺς Ναζιραίους
  choice: die Nasiräer
  rationale: „Nasiräer“ ist im Deutschen die geläufige Bezeichnung für Menschen, die durch ein besonderes Gelübde zeitweise Gott geweiht waren, und bewahrt den historischen Fachbegriff.
- source_word: οἳ ἐπλήρωσαν τὰς ἡμέρας
  choice: die ihre Tage vollendet hatten
  rationale: Die nahe am Griechischen bleibende Formulierung bewahrt dessen knappe Ausdrucksweise. Im Zusammenhang sind die vorgeschriebenen Tage des Nasiräergelübdes gemeint; dies wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe der besonderen religiösen Bezeichnung Ναζιραίους
  choice: Nasiräer
  alternative: Menschen, die ein Nasiräergelübde abgelegt hatten
  rationale: Der Fachbegriff bewahrt die konkrete, in der Tora verankerte Form zeitweiliger Weihe und macht daraus keine allgemeine Aussage über Frömmigkeit oder Askese.
- issue: Deutung von „ihre Tage vollendet“
  choice: Die wörtlich knappe Wendung bleibt im Haupttext stehen; die gelübdebezogene Bedeutung wird in der Fußnote erklärt.
  alternative: die vorgeschriebene Zeit ihres Gelübdes erfüllt hatten
  rationale: So wird die im Griechischen vorhandene Ausdrucksweise nicht stillschweigend erweitert, während der historische Sinn für heutige Leser verständlich bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Fachbegriffe werden verständlich, aber nicht konfessionell gefärbt wiedergegeben. Der Semikolonanschluss des Griechischen wird zugunsten eines natürlichen deutschen Satzrhythmus in zwei Sätze aufgeteilt.
