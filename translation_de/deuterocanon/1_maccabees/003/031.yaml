  yaml_path: translation/deuterocanon/1_maccabees/003/031.yaml
  text: And he was greatly troubled in his soul[a], and he decided to go into Persia[b], to collect the taxes of the regions and to gather much silver.
translation:
  language: de
  text: Und er war zutiefst ratlos[a]. Er beschloss, nach Persien zu reisen, die Abgaben der Gebiete einzuziehen und viel Silber zusammenzubringen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »war in seinem Inneren ratlos« oder »war in großer Bedrängnis«. Das griechische Verb kann sowohl Ratlosigkeit als auch schwere Bedrängnis ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Silber« ist hier wahrscheinlich Geldvermögen in Form von geprägtem oder abgewogenem Silber gemeint, nicht nur das Rohmetall.
    reason: cultural_note
lexical_decisions:
- source_word: ἠπορεῖτο
  choice: war … bestürzt
  rationale: Das Verb bezeichnet Ratlosigkeit oder eine bedrängte Lage. »Bestürzt« gibt im Zusammenhang die starke innere Bedrängnis natürlich wieder, ohne den Aspekt der Ratlosigkeit auszuschließen; dieser wird in der Fußnote genannt.
- source_word: τῇ ψυχῇ αὐτοῦ
  choice: in seiner Seele
  rationale: Die relativ formale Wiedergabe bewahrt die anthropologische Ausdrucksweise des Griechischen und ist im Deutschen verständlich.
- source_word: σφόδρα
  choice: sehr
  rationale: Das Adverb verstärkt die innere Bedrängnis; »sehr« ist klar und idiomatisch.
- source_word: ἐβουλεύσατο
  choice: Da beschloss er
  rationale: Die mediale Verbform bezeichnet eine überlegte Entscheidung. »Beschloss« verbindet Erwägung und Handlungsentschluss in natürlichem Deutsch.
- source_word: τοῦ πορευθῆναι εἰς τὴν Περσίδα
  choice: nach Persien zu ziehen
  rationale: »Ziehen« passt zum erhöhten historischen Erzählstil und gibt die gerichtete Bewegung nach Persien wieder.
- source_word: λαβεῖν τοὺς φόρους
  choice: die Abgaben … einzuziehen
  rationale: φόροι kann Steuern oder Tribut bezeichnen. »Abgaben« bewahrt diese sachliche Breite, während »einziehen« den fiskalischen Vorgang idiomatisch ausdrückt.
- source_word: τῶν χωρῶν
  choice: der Gebiete
  rationale: χῶραι bezeichnet hier beherrschte territoriale Einheiten. »Gebiete« vermeidet die nicht ausdrücklich belegte technische Festlegung auf Provinzen.
- source_word: συναγαγεῖν ἀργύριον πολύ
  choice: viel Silber zusammenzubringen
  rationale: Die Wiedergabe behält das konkrete »Silber« des griechischen Textes bei; im Kontext bezeichnet es wahrscheinlich Geldvermögen. »Zusammenzubringen« drückt das Ansammeln natürlich aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht erhöhtem historischem Erzählton. Die Satzfolge bleibt nah am Griechischen, wird aber durch »Da« natürlich verbunden. Die Mehrdeutigkeit von ἠπορεῖτο und die monetäre Bedeutung von ἀργύριον werden in Fußnoten offengelegt.
