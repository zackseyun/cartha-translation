  text: And they took their equipment[a], and Judas took the sword of Apollonius, and he fought with it all his days.
translation:
  language: de
  text: Und sie nahmen ihre Ausrüstung an sich. Judas nahm das Schwert des Apollonius und kämpfte alle seine Tage damit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Tage“; im Zusammenhang kann dies die übrige Lebenszeit des Judas meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  choice: Ausrüstung
  rationale: Im militärischen Zusammenhang bezeichnet σκεύη die Ausrüstung oder Gerätschaften. „Ausrüstung“ bleibt hinreichend weit und legt nicht fest, dass ausschließlich Waffen gemeint sind.
- source_word: μάχαιρα
  choice: Schwert
  rationale: μάχαιρα kann eine kürzere Klinge bezeichnen; im vorliegenden Kampfbericht ist „Schwert“ die natürliche deutsche Wiedergabe, ohne eine nicht gesicherte Waffenart näher zu bestimmen.
- source_word: ἦν πολεμῶν
  choice: kämpfte
  rationale: Die Umschreibung mit ἦν und Partizip bezeichnet eine fortdauernde oder wiederholte Tätigkeit. Zusammen mit „sein Leben lang“ wird dieser durative Sinn im Deutschen ausreichend deutlich.
- source_word: ἐν αὐτῇ
  choice: damit
  rationale: Das feminine Pronomen bezieht sich am natürlichsten auf μάχαιρα („Schwert“); „damit“ gibt den instrumentalen Sinn idiomatisch wieder.
- source_word: πάσας τὰς ἡμέρας
  choice: sein Leben lang
  rationale: Wörtlich steht „alle Tage“. Im Zusammenhang bezeichnet die Wendung wahrscheinlich die gesamte verbleibende Lebenszeit des Judas; die idiomatische deutsche Formulierung gibt diesen Sinn natürlich wieder, während die Fußnote den Wortlaut und seine Offenheit festhält.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „nahm“ aus dem Griechischen wird durch „nahmen … an sich“ und „nahm“ natürlich gestaltet. Der Wechsel von Satzkoordination zu zwei deutschen Sätzen verbessert die Lesbarkeit, ohne den inhaltlichen Zusammenhang zu verändern.
