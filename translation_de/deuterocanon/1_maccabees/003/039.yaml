base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/039.yaml
  text: And he sent with them forty thousand men and seven thousand cavalry[a], to come into the land of Judah and destroy it[b], according to the word of the king.
translation:
  language: de
  text: Und er sandte mit ihnen vierzigtausend Mann und siebentausend Reiter[a], damit sie in das Land Juda kämen und es vernichteten, nach dem Wort des Königs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „siebentausend Pferd“; „Pferd“ steht hier wahrscheinlich für berittene Truppen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach dem Befehl des Königs“. Das griechische „Wort“ hat hier im Zusammenhang die Kraft einer Anordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Der Aorist bezeichnet hier das Aussenden von Truppen zusammen mit den zuvor genannten Anführern; „sandte“ ist direkt, würdig und im modernen Deutsch natürlich.
- source_word: μετʼ αὐτῶν
  choice: mit ihnen
  rationale: Die Wendung besagt, dass die Truppen die zuvor genannten Personen begleiteten; die knappe Entsprechung bewahrt den griechischen Bezug.
- source_word: τεσσεράκοντα χιλιάδας ἀνδρῶν
  choice: vierzigtausend Mann
  rationale: ἀνδρῶν bedeutet wörtlich „Männer“; bei militärischen Zahlenangaben ist „Mann“ im Deutschen idiomatisch und vermeidet die zusätzliche Auslegung „Soldaten“.
- source_word: ἑπτακισχιλίον ἵππον
  choice: siebentausend Reiter
  rationale: ἵππος heißt wörtlich „Pferd“, bezeichnet in der militärischen Aufzählung aber metonymisch berittene Truppen. „Reiter“ gibt diesen Sinn natürlich wieder, ohne eine moderne Truppengattung zu stark in den Vordergrund zu stellen.
- source_word: τοῦ ἐλθεῖν
  choice: damit sie … kämen
  rationale: Der artikulierte Infinitiv drückt den Zweck der Entsendung aus. Ein deutscher Finalsatz macht zugleich das gedachte Subjekt, die ausgesandten Truppen, klar.
- source_word: εἰς γῆν Ἰούδα
  choice: in das Land Juda
  rationale: Die Formulierung bewahrt γῆ als „Land“ und lässt Ἰούδα als geografische Bezeichnung stehen, statt sie vereinheitlichend mit „Judäa“ wiederzugeben.
- source_word: καταφθεῖραι
  choice: vernichteten
  rationale: Das Verb bezeichnet eine umfassende zerstörerische Einwirkung. „Vernichten“ bewahrt die starke Aussage und kann sich grammatisch wie im Griechischen auf das Land beziehen.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: nach dem Wort des Königs
  rationale: Die Übersetzung erhält λόγος als „Wort“ und damit die Ausdrucksweise der Vorlage; im Zusammenhang hat dieses Wort den Charakter eines königlichen Befehls.
