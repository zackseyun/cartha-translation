base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/003.yaml
  text: And he enlarged the glory of his people[a]; he put on a breastplate like a giant, and strapped on his weapons of war; he set battles in order[c][b], shielding the camp with the sword.
translation:
  language: de
  text: Und er vermehrte den Ruhm seines Volkes[a]. Er legte einen Brustpanzer an wie ein Riese[b] und gürtete sich mit seinen Kriegswaffen. Er führte Kriege[c] und schützte das Heerlager mit dem Schwert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Er machte den Ruhm seines Volkes weit«; gemeint ist, dass er dessen Ansehen oder Ruhm vergrößerte.'
    reason: lexical_alternative
  - marker: b
    text: »Riese« kann hier auch im Sinn eines gewaltigen Kämpfers oder Helden verstanden werden; das griechische Wort bedeutet wörtlich »Riese«.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Er ordnete Schlachten« beziehungsweise »Er unternahm Kriege«. Die griechische Wendung kann das Organisieren und Durchführen militärischer Auseinandersetzungen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλάτυνεν δόξαν
  choice: vermehrte den Ruhm
  rationale: ἐπλατύνω bedeutet wörtlich »breit machen«, hier aber übertragen »mehren« oder »vergrößern«. »Den Ruhm vermehren« gibt den Sinn im Deutschen natürlich wieder; »Ruhm« bezeichnet hier das öffentliche Ansehen des Volkes.
- source_word: τῷ λαῷ αὐτοῦ
  choice: seines Volkes
  rationale: λαός bezeichnet hier das Volk als nationale Gemeinschaft. Die possessive Wendung wird im Deutschen idiomatisch mit dem Genitiv wiedergegeben.
- source_word: ἐνεδύσατο θώρακα
  choice: legte einen Brustpanzer an
  rationale: θώραξ ist konkret der Brustpanzer, nicht allgemein die Rüstung. »Anlegen« ist für ein Rüstungsteil natürliches modernes Deutsch.
- source_word: ὡς γίγας
  choice: wie ein Riese
  rationale: γίγας heißt wörtlich »Riese« und zeichnet Judas zugleich als gewaltigen Kämpfer. Das anschauliche Bild bleibt erhalten.
- source_word: συνεζώσατο τὰ σκεύη τὰ πολεμικὰ αὐτοῦ
  choice: gürtete sich mit seinen Kriegswaffen
  rationale: συζώννυμι bezeichnet das Umgürten beziehungsweise Anlegen der Ausrüstung; σκεύη πολεμικά meint Kriegsgerät oder Waffen. Die Formulierung bewahrt das körperliche Bild des griechischen Textes in würdigem Deutsch.
- source_word: πολέμους συνεστήσατο
  choice: führte Kriege
  rationale: Die Wendung kann das Ins-Werk-Setzen, Organisieren oder Führen militärischer Auseinandersetzungen bezeichnen. »Führte Kriege« ist natürlich und lässt sowohl Planung als auch Durchführung zu.
- source_word: σκεπάζων τὴν παρεμβολὴν
  choice: schützte das Heerlager
  rationale: σκεπάζω bedeutet bedecken und daraus übertragen schützen; παρεμβολή bezeichnet im militärischen Zusammenhang das Lager beziehungsweise Heerlager.
- source_word: ἐν ῥομφαίᾳ
  choice: mit dem Schwert
  rationale: ἐν ist instrumental gebraucht. ῥομφαία bezeichnet ein großes Schwert; die allgemeinere Wiedergabe »Schwert« ist im Kontext klar und idiomatisch.
