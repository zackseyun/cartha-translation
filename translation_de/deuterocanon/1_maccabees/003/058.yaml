base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/058.yaml
  text: And Judas said[a], “Gird yourselves, and become mighty men[b], and be ready in the morning to fight against these nations that have assembled against us to destroy us and our holy things.”
translation:
  language: de
  text: 'Und Judas sagte: „Gürtet euch und erweist euch als starke Männer[a]. Seid für den Morgen bereit, gegen diese Völker zu kämpfen, die sich gegen uns versammelt haben, um uns und unsere heiligen Dinge[b] zu vernichten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „werdet zu starken Söhnen“; gemeint sein kann auch: „zeigt euch als tapfere Männer“.'
    reason: Die ungewöhnliche, vermutlich semitisch geprägte griechische Wendung verwendet ausdrücklich „Söhne“, ist im Deutschen aber nicht sinnvoll wortwörtlich wiederzugeben.
  - marker: b
    text: 'Oder: „unser Heiligtum“. Der griechische Plural kann heilige Gegenstände, heilige Bereiche oder den Heiligtumskomplex bezeichnen.'
    reason: Der genaue Bezug des substantivierten Plurals τὰ ἅγια bleibt offen und soll nicht stillschweigend auf eine einzige Deutung verengt werden.
lexical_decisions:
- source_word: Περιζώσασθε
  choice: Gürtet euch
  rationale: Der mediale Imperativ bezeichnet wörtlich das Umschürzen als Vorbereitung zum Handeln oder Kampf. „Gürtet euch“ bewahrt das anschauliche militärische Bild und bleibt in gehobenem modernem Deutsch verständlich.
- source_word: γίνεσθε εἰς υἱοὺς δυνατούς
  choice: erweist euch als starke Männer
  rationale: Die wörtliche Form „werdet zu starken Söhnen“ ist im Deutschen unnatürlich und beruht wahrscheinlich auf einer semitisch geprägten Wendung. Die gewählte Fassung gibt den Aufruf zu männlicher Stärke idiomatisch wieder; die ausdrückliche Rede von „Söhnen“ bleibt in der Fußnote sichtbar.
- source_word: ἕτοιμοι εἰς τὸ πρωῒ
  choice: Seid für den Morgen bereit
  rationale: Die Formulierung bezeichnet den kommenden Morgen als Zeitpunkt des bevorstehenden Kampfes. „Für den Morgen bereit“ ist klarer als das zeitlich mehrdeutige „am Morgen bereit“.
- source_word: πολεμῆσαι
  choice: zu kämpfen
  rationale: Die Wiedergabe ist im unmittelbaren militärischen Zusammenhang natürlich und entspricht dem Infinitiv, ohne ihn unnötig zu verstärken.
- source_word: ἔθνεσιν
  choice: Völker
  rationale: Gemeint sind die fremden, feindlichen Volksgruppen beziehungsweise Streitkräfte. „Völker“ ist quellennah und vermeidet die hier nicht zwingende religiös-ethnische Festlegung durch „Heiden“.
- source_word: ἐπισυνηγμένοις
  choice: die sich gegen uns versammelt haben
  rationale: Die Formulierung erhält den resultativen Sinn des Perfektpartizips und die feindliche Ausrichtung der versammelten Gruppen.
- source_word: ἐξᾶραι
  choice: zu vernichten
  rationale: Das Verb kann „wegnehmen“ oder „beseitigen“ bedeuten; im Kontext eines militärischen Angriffs bezeichnet es die Vernichtung der Menschen und ihrer heiligen Güter beziehungsweise Stätten.
- source_word: τὰ ἅγια ἡμῶν
  choice: unsere Heiligtümer
  rationale: Der substantivierte Plural bezeichnet das, was heilig ist, und kann heilige Gegenstände, Bereiche oder den Heiligtumskomplex meinen. „Heiligtümer“ bewahrt den Plural und lässt den genauen Umfang offen; eine engere Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Männliche Ausdrucksweise in γίνεσθε εἰς υἱοὺς δυνατούς
  choice: „starke Männer“ im Haupttext, mit Hinweis auf „starke Söhne“ in der Fußnote
  alternative: „werdet zu starken Söhnen“
  rationale: Der griechische Text verwendet ausdrücklich υἱούς („Söhne“), doch die Gesamtwendung ist idiomatisch und eine wortwörtliche deutsche Fassung wäre missverständlich. Die Übersetzung bezeichnet die angesprochenen männlichen Kämpfer natürlich, während die Fußnote die auffällige Quellform transparent macht.
- issue: Bedeutungsumfang von τὰ ἅγια ἡμῶν
  choice: „unsere Heiligtümer“
  alternative: „unser Heiligtum“ oder „unsere heiligen Dinge“
  rationale: Der griechische Plural lässt offen, ob heilige Gegenstände, heilige Bezirke oder der gesamte Heiligtumskomplex gemeint sind. Der Haupttext wahrt den Plural; die Fußnote nennt die mögliche engere Deutung, ohne sie festzuschreiben.
translation_notes:
  register: Gehobenes, aber gut verständliches Standarddeutsch. „Gürtet euch“ erhält das konkrete Vorbereitungsbild und den feierlich-militärischen Ton; die übrige Syntax ist bewusst klar und gegenwärtig gehalten.
