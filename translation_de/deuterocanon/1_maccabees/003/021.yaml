  text: But we are fighting for our lives and our laws[a][b].
translation:
  language: de
  text: Wir aber kämpfen für unser Leben[a] und unsere Gesetze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Seelen“. Das griechische Wort kann sowohl „Leben“ als auch „Seele“ bedeuten; im Zusammenhang dieses Kampfes liegt „Leben“ näher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unsere rechtmäßigen Bräuche“ oder „unsere überlieferten Satzungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Wir aber
  rationale: Das ausdrücklich gesetzte Pronomen ἡμεῖς wird bewahrt; δέ kennzeichnet den Gegensatz zum vorangehenden Gedanken. Die Nachstellung „aber“ ist im Deutschen natürlich und würdevoll.
- source_word: πολεμοῦμεν
  choice: kämpfen
  rationale: Das Präsens bezeichnet den gegenwärtigen beziehungsweise fortdauernden Kampf. „Kämpfen“ gibt die militärische Bedeutung klar und idiomatisch wieder.
- source_word: περὶ
  choice: für
  rationale: In Verbindung mit πολεμοῦμεν bezeichnet περί das, worum gekämpft wird beziehungsweise was auf dem Spiel steht. Dafür ist „für“ die natürliche deutsche Entsprechung.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: unser Leben
  rationale: ψυχή kann „Leben“ oder „Seele“ bedeuten. Im Zusammenhang eines bewaffneten Kampfes steht das Leben der Kämpfenden auf dem Spiel. Der deutsche Singular „unser Leben“ gibt den griechischen Plural idiomatisch kollektiv wieder.
- source_word: τῶν νομίμων ἡμῶν
  choice: unsere Gesetze
  rationale: νόμιμα bezeichnet gesetzlich oder herkömmlich festgelegte Ordnungen, hier besonders die überlieferten religiös-rechtlichen Lebensordnungen. „Gesetze“ ist klar und knapp; die weitere Bedeutung wird in einer Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von ψυχαί im Kriegskontext
  choice: unser Leben
  alternative: unsere Seelen
  rationale: Der unmittelbare Zusammenhang betrifft Kampf und Überleben. „Leben“ bewahrt den konkreten Sinn, ohne eine Leib-Seele-Deutung in den Text einzutragen; die echte lexikalische Alternative wird in der Fußnote genannt.
- issue: Bedeutungsumfang von νόμιμα
  choice: unsere Gesetze
  alternative: unsere rechtmäßigen Bräuche oder unsere überlieferten Satzungen
  rationale: Der Ausdruck umfasst mehr als staatliche Einzelgesetze und kann angestammte religiöse und rechtliche Ordnungen einschließen. „Gesetze“ trägt im Haupttext das rechtliche Gewicht, während die Fußnote die herkömmliche und überlieferte Dimension sichtbar macht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Satzführung. „Wir aber“ erhält die Hervorhebung und den Gegensatz des Griechischen; „unser Leben“ vermeidet den im Deutschen unnatürlichen distributiven Plural „unsere Leben“.
