translation:
  language: de
  text: und für seinen Sohn Antiochus zu sorgen, bis zu seiner Rückkehr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und seinen Sohn Antiochus zu versorgen oder zu unterhalten, bis zu seiner Rückkehr“.'
    reason: „τρέφειν“ kann neben „für jemanden sorgen“ auch „versorgen“ oder „unterhalten“ bedeuten.
lexical_decisions:
- source_word: τρέφειν
  choice: für … zu sorgen
  rationale: Das Verb kann „ernähren“, „aufziehen“ oder „unterhalten/versorgen“ bedeuten. Im höfisch-politischen Zusammenhang geht es umfassend um die Versorgung und Fürsorge für den Königssohn während der Abwesenheit seines Vaters.
- source_word: Ἀντίοχον
  choice: Antiochus
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn
  rationale: Die possessive Wendung gibt das griechische Verhältnis natürlich und ausdrücklich wieder.
- source_word: ἕως τοῦ ἐπιστρέψαι αὐτόν
  choice: bis er zurückkehrte
  rationale: Die Konstruktion mit ἕως und substantiviertem Infinitiv bezeichnet die zeitliche Grenze. Der Akkusativ αὐτόν ist das Subjekt des Infinitivs und bezieht sich im Zusammenhang am ehesten auf den abwesenden König; wegen des erzählenden Vergangenheitsrahmens steht im Deutschen das Präteritum.
