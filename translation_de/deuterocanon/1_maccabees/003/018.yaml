  text: And Judas said, “It is easy for many to be shut up into the hands of a few, and in the sight of heaven there is no difference between saving by many or by few.”
translation:
  language: de
  text: 'Und Judas sagte: „Es ist leicht, dass viele in die Hände weniger geraten[a], und vor dem Himmel macht es keinen Unterschied, durch viele oder durch wenige zu retten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass viele in den Händen weniger eingeschlossen werden“; gemeint ist, dass sie umzingelt werden und in deren Gewalt geraten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὔκοπόν ἐστιν
  choice: Es ist leicht
  rationale: Die unpersönliche Wendung bezeichnet etwas als leicht oder ohne Schwierigkeit möglich; die deutsche Formulierung ist unmittelbar und bewahrt den Aussagewert.
- source_word: συγκλεισθῆναι ... ἐν χερσὶν ὀλίγων
  choice: dass viele in die Hände weniger geraten
  rationale: Das passive Verb bedeutet wörtlich „eingeschlossen werden“. Zusammen mit „in den Händen“ bezeichnet es hier, dass die Vielen umzingelt und in die Gewalt weniger gebracht werden. Die gewählte Wendung gibt das Machtverhältnis natürlich wieder; die konkretere Bildlichkeit wird in der Fußnote ausgewiesen.
- source_word: πολλοὺς ... ὀλίγων
  choice: viele ... weniger
  rationale: Die substantivierten Adjektive werden ohne ergänzendes „Männer“ wiedergegeben, wie es der griechische Text erlaubt; der entscheidende Gegensatz zwischen großer und kleiner Zahl bleibt erhalten.
- source_word: διαφορὰ
  choice: macht es keinen Unterschied
  rationale: Die idiomatische deutsche Wendung entspricht οὐκ ἔστι διαφορά, ohne die Aussage als „Vorteil“ enger auszulegen.
- source_word: ἐναντίον τοῦ οὐρανοῦ
  choice: vor dem Himmel
  rationale: Die Formulierung bewahrt ausdrücklich „Himmel“ und gibt ἐναντίον als „vor/in der Gegenwart von“ wieder, statt die ehrfürchtige Umschreibung im Haupttext zu „Gott“ aufzulösen.
- source_word: σῴζειν
  choice: rettet
  rationale: „Retten“ bewahrt die breite Bedeutung des Verbs einschließlich der im militärischen Kontext naheliegenden Befreiung oder Siegesgabe.
- source_word: ἐν πολλοῖς ἢ ἐν ὀλίγοις
  choice: durch viele oder durch wenige
  rationale: „Durch“ gibt den instrumentalen Sinn wieder und lässt offen, ob die Genannten als menschliche Mittel oder Streitkräfte gedacht sind.
theological_decisions:
- issue: Ehrfürchtiger Gebrauch von „Himmel“ in ἐναντίον τοῦ οὐρανοῦ
  choice: „Himmel“ im Haupttext beibehalten
  alternative: „vor Gott“ oder „in den Augen Gottes“
  rationale: Der griechische Text nennt ausdrücklich den Himmel, wahrscheinlich als ehrfürchtige Umschreibung für Gott. Die Übersetzung bewahrt diese Spannung und erläutert die wahrscheinliche Funktion nur in der Fußnote.
- issue: Implizites Subjekt von σῴζειν
  choice: Mit „er“ auf den durch „Himmel“ bezeichneten göttlichen Handelnden beziehen
  alternative: Unpersönlich „Rettung zu bringen“ oder nominal „beim Retten“
  rationale: Natürliches Deutsch verlangt hier eine klarere Satzfügung. Das Pronomen nimmt die wahrscheinlich personhafte, ehrfürchtige Bezugnahme auf Gott auf, ohne im Haupttext den Ausdruck „Himmel“ durch „Gott“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt knapp und zugespitzt. „In die Hände geraten“ ist idiomatisch verständlich, während die Fußnote die konkrete Einschließungsmetapher des Griechischen bewahrt.
