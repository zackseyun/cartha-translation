revisions:
- from: 'Und Judas sagte: „Es ist leicht, dass viele in die Hände weniger geraten[a], und vor dem Himmel[b] macht es keinen Unterschied, ob er durch viele oder durch wenige rettet.“'
  to: 'Und Judas sagte: „Es ist leicht, dass viele in die Hände weniger geraten[a], und vor dem Himmel macht es keinen Unterschied, durch viele oder durch wenige zu retten.“'
  rationale: Die Revision entfernt ausschließlich das im Griechischen nicht ausdrücklich vorhandene Subjekt „er“. Die Formulierung „durch viele oder durch wenige zu retten“ gibt den aktiven Infinitiv wieder, ohne dessen implizites Subjekt im Deutschen theologisch festzulegen. Text, Namensform, Register und Fußnoten werden sonst beibehalten.
