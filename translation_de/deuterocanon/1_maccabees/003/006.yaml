  - severity: low
    issue: Fußnote erläutert die Handwendung ungenau
    rationale: »durch/in seiner Hand« sind nicht einfach austauschbar; die Wendung kann Wirken, Macht oder Vermittlung durch die betreffende Person bezeichnen. Die Fußnote sollte dies ohne überstarke Festlegung ausdrücken.
