base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/006.yaml
  text: And the lawless were restrained because of fear of him[a], and all the workers of lawlessness were thrown into confusion[b], and deliverance prospered in his hand.
translation:
  language: de
  text: Und die Gesetzlosen wichen aus Furcht vor ihm zurück, und alle, die Gesetzlosigkeit übten, gerieten in Verwirrung, und durch seine Hand gelang die Rettung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und in seiner Hand gelang die Rettung« oder: »und durch seine Hand gelang das Heil«. Das griechische Wort σωτηρία kann »Rettung«, »Befreiung« oder »Heil« bedeuten. Die Wendung »in/durch seine Hand« beschreibt, dass die Rettung durch sein Wirken oder seine Macht zustande kam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεστάλησαν
  choice: wichen … zurück
  rationale: Das Passiv von συστέλλω bezeichnet hier, dass die Gegner unter Druck zurückgedrängt beziehungsweise zum Rückzug gebracht wurden. Die Formulierung ist im Deutschen natürlich und bewahrt die erzählerisch-militärische Kraft.
- source_word: οἱ ἄνομοι
  choice: die Gesetzlosen
  rationale: Die Wiedergabe erhält den Bezug zum Gesetz und zugleich die Wortverbindung mit ἀνομία im folgenden Satzglied.
- source_word: ἀπὸ τοῦ φόβου αὐτοῦ
  choice: aus Furcht vor ihm
  rationale: Die Präpositionalphrase bezeichnet den Grund ihres Zurückweichens und lässt sich so knapp und idiomatisch wiedergeben.
- source_word: οἱ ἐργάται τῆς ἀνομίας
  choice: alle, die Gesetzlosigkeit übten
  rationale: Die natürliche deutsche Wendung bewahrt die konkrete Aussage des Handelns und die Wiederholung des Wortfelds ἄνομος/ἀνομία.
- source_word: συνεταράχθησαν
  choice: gerieten in Verwirrung
  rationale: Das Verb bezeichnet heftige Beunruhigung oder Erschütterung; im Zusammenhang steht die dadurch ausgelöste Unordnung der Gegner im Vordergrund.
- source_word: εὐωδώθη
  choice: hatte … Erfolg
  rationale: Das passive εὐοδόω bedeutet hier, dass etwas erfolgreich verlief oder vorankam. Die deutsche Formulierung ist klarer und natürlicher als eine wörtliche Passivkonstruktion.
- source_word: σωτηρία
  choice: die Rettung
  rationale: Im militärisch-historischen Zusammenhang bezeichnet σωτηρία vor allem Befreiung oder Rettung, ohne dass der weiter gefasste Sinn von Heil völlig ausgeschlossen wird.
- source_word: ἐν χειρὶ αὐτοῦ
  choice: durch seine Hand
  rationale: Die biblische Hand-Metapher bleibt erhalten, während »durch« die im Griechischen gemeinte Vermittlung beziehungsweise Wirksamkeit verständlich ausdrückt.
theological_decisions:
- issue: Bedeutung von σωτηρία im militärisch-historischen Zusammenhang
  choice: Rettung
  alternative: Heil; Befreiung; Sieg
  rationale: »Rettung« entspricht dem unmittelbaren Zusammenhang der Befreiung des Volkes, bewahrt aber mehr semantische Weite als »Sieg« und legt den Ausdruck nicht ausschließlich auf einen späteren theologischen Heilsbegriff fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Wortfelds »gesetzlos/Gesetzlosigkeit« und die biblische Hand-Metapher bleiben erhalten; schwer verständliche Nominal- und Passivkonstruktionen werden maßvoll geglättet.
