  verdict: revise
  source_fidelity: Die Satzglieder und die Wiederholung des Wortfelds ἄνομος/ἀνομία sind treffend wiedergegeben. »wichen ... zurück« ist für συνεστάλησαν im Kontext vertretbar, und »gerieten in Verwirrung« gibt συνεταράχθησαν angemessen wieder. Die Schlussformulierung »durch seine Hand hatte die Rettung Erfolg« trifft zwar die beabsichtigte Vermittlungsbedeutung, ist aber wegen des Plusquamperfekts und der Verbindung »Rettung hatte Erfolg« nicht quellentreu im Erzähltempus und nicht idiomatisch.
  naturalness: Der Vers ist insgesamt flüssiges modernes Standarddeutsch. »Durch seine Hand gelang die Rettung« stellt das gleichrangige aoristische Erzählgeschehen her und ist deutlich natürlicher, ohne die biblische Handmetapher aufzugeben.
  terminology: »Gesetzlosen« / »Gesetzlosigkeit« bewahrt die im Griechischen absichtliche lexikalische Verknüpfung. »Rettung« ist für σωτηρία im militärisch-historischen Kontext passend und lässt den weiteren Sinn von »Heil« offen. Die Fußnote sollte die Alternative als solche formulieren und die Bedeutung der Handwendung präzise als Wirken bzw. Machtbereich beschreiben.
  issues:
