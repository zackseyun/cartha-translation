base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/017.yaml
  text: But when they saw the camp coming to meet him[a], they said to Judas, “How can we, being so few, fight against so great a multitude? And we are exhausted[c][b], having gone without food today.”
translation:
  language: de
  text: 'Als sie aber das Heer sahen, das ihm entgegenzog[a], sagten sie zu Judas: „Wie können wir, so wenige, gegen eine so große Menge kämpfen? Außerdem sind wir entkräftet[b], weil wir heute nichts gegessen haben[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das gegen ihn anrückte“. Die griechische Wendung bedeutet wörtlich, dass das Heer ihm zu einer Begegnung entgegenzog; im militärischen Zusammenhang ist eine feindliche Begegnung gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wir sind völlig erschöpft“ beziehungsweise „wir sind schwach“. Das griechische Wort kann körperliche Entkräftung oder einen mutlos gewordenen Zustand bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „weil wir heute fasten“. Das griechische Wort besagt, dass sie keine Nahrung zu sich nahmen, bezeichnet aber nicht zwingend ein religiöses Fasten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολήν
  choice: Heer
  rationale: Das Wort kann im militärischen Zusammenhang das Lager oder die dort versammelte Streitmacht bezeichnen. Da sich die bezeichnete Größe hier nähert, ist „Heer“ im Deutschen natürlich und bewahrt den konkreten militärischen Bezug.
- source_word: ἐρχομένην εἰς συνάντησιν αὐτῷ
  choice: das ihm entgegenzog
  rationale: Die Wendung bezeichnet zunächst die Bewegung auf eine Begegnung mit Judas hin. „Entgegenzog“ lässt die Art der Begegnung sprachlich offen, während der militärische Zusammenhang ihre feindliche Absicht erkennen lässt.
- source_word: ὀλιγοστοὶ ὄντες
  choice: wir, so wenige
  rationale: Die Formulierung hebt die geringe Zahl der Männer im Gegensatz zur großen gegnerischen Streitmacht hervor.
- source_word: πολεμῆσαι
  choice: kämpfen
  rationale: „Kämpfen“ ist die klare und natürliche deutsche Entsprechung im unmittelbaren militärischen Zusammenhang.
- source_word: πρὸς πλῆθος τοσοῦτο
  choice: gegen eine so große Menge
  rationale: πλῆθος bezeichnet hier die große Masse der gegnerischen Kämpfer; die Wiedergabe erhält den rhetorischen Gegensatz zwischen den wenigen und den vielen.
- source_word: ἐκλελύμεθα
  choice: wir sind entkräftet
  rationale: Das Perfekt beschreibt einen gegenwärtigen Zustand körperlicher Schwächung oder Erschöpfung. „Entkräftet“ passt besonders zum anschließenden Hinweis auf den Nahrungsmangel.
- source_word: ἀσιτοῦντες
  choice: weil wir heute nichts gegessen haben
  rationale: Das Partizip bezeichnet das Ausbleiben der Nahrungsaufnahme. Die kausale Formulierung ist im Deutschen natürlich und vermeidet die unbelegte Festlegung auf ein religiöses Fasten.
- source_word: σήμερον
  choice: heute
  rationale: Dies ist die schlichte und natürliche Wiedergabe der Zeitangabe.
