translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt unmittelbar und verständlich. „Heer“ vermeidet das im Deutschen befremdliche Bild eines sich bewegenden Lagers; die feindliche Bedeutung von „entgegenziehen“ wird nicht unnötig in den Haupttext hineingedeutet, sondern aus dem militärischen Kontext und der Fußnote erschlossen.
