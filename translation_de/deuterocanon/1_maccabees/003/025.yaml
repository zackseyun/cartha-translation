translation:
  language: de
  text: Da kam die Furcht vor Judas und seinen Brüdern auf,[a] und über die Völker rings um sie kam Verderben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da begann die Furcht vor Judas und seinen Brüdern“; der griechische Ausdruck hebt ihren Beginn hervor, ohne näher zu bestimmen, wie sie sich bemerkbar machte.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und über die Völker rings um sie kam immer wieder der Untergang“; die griechische Vergangenheitsform kann einen andauernden oder wiederholten Vorgang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: begann sich … auszubreiten
  rationale: Der Aorist von ἄρχομαι bezeichnet hier den Beginn eines Zustands beziehungsweise einer Entwicklung. Zusammen mit φόβος gibt die Formulierung idiomatisch wieder, dass die Furcht aufkam und weitere Kreise zog.
- source_word: ὁ φόβος Ἰούδα καὶ τῶν ἀδελφῶν αὐτοῦ
  choice: die Furcht vor Judas und seinen Brüdern
  rationale: Die Genitive bezeichnen im Zusammenhang am ehesten die Personen, vor denen andere sich fürchten. Das deutsche „vor“ macht diese Beziehung natürlich verständlich, ohne den Grad der Furcht zu übersteigern.
- source_word: ἡ πτῶσις
  choice: Verderben
  rationale: πτῶσις kann Fall, Niederlage oder Untergang bezeichnen. „Verderben“ passt zum militärisch-politischen Zusammenhang und lässt offen, ob einzelne Niederlagen oder ein umfassender Niedergang gemeint sind.
- source_word: ἐπίπτεν
  choice: brach fortwährend … herein
  rationale: Das Imperfekt beschreibt einen andauernden oder wiederholten Vorgang. „Fortwährend“ macht diesen Aspekt sichtbar; „hereinbrechen über“ gibt die Verbindung mit ἐπί natürlich wieder.
- source_word: ἐπὶ τὰ ἔθνη τὰ κύκλῳ αὐτῶν
  choice: über die Völker rings um sie
  rationale: ἔθνη meint hier die umliegenden nichtjüdischen Völker oder Volksgruppen. „Völker“ ist im Deutschen weniger missverständlich als „Nationen“, und „rings um sie“ bewahrt den geografischen Bezug.
