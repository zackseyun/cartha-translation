base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/059.yaml
  text: For it is better for us to die in battle than to look on at the evils of our nation and of the holy things[a].
translation:
  language: de
  text: Denn es ist besser für uns, im Krieg zu sterben, als das Unheil über unser Volk und die heiligen Dinge[a] mitanzusehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Heiligtums“ oder „der heiligen Stätten“; wörtlich steht im Griechischen „der heiligen Dinge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: besser
  rationale: Der Komparativ bezeichnet hier das Vorzuziehende; „besser“ ist im Deutschen natürlich und bewahrt den appellativen Ton.
- source_word: ἀποθανεῖν
  choice: zu sterben
  rationale: Direkte und idiomatische Wiedergabe des Infinitivs, ohne zusätzliche rhetorische Färbung.
- source_word: ἐν πολέμῳ
  choice: im Kampf
  rationale: Im unmittelbaren militärischen Zusammenhang bezeichnet die Wendung den Tod im Kampf; „im Krieg“ wäre allgemeiner.
- source_word: ἐφιδεῖν ἐπὶ
  choice: mitanzusehen
  rationale: Das Verb bezeichnet ein betrachtendes Dabeistehen und vermittelt hier das schmerzliche Zuschauen, statt nur neutrales Sehen.
- source_word: τὰ κακά
  choice: das Unheil
  rationale: κακά umfasst Übel, Leiden und Verderben. Das deutsche Kollektiv „Unheil“ bewahrt diese Breite und klingt in diesem Satz natürlicher als „die Übel“.
- source_word: τοῦ ἔθνους ἡμῶν
  choice: unseres Volkes
  rationale: ἔθνος meint hier die jüdische Gemeinschaft als Ganzes. „Volk“ ist im modernen biblischen Deutsch natürlicher als „Nation“ und wahrt den gemeinschaftlichen Bezug.
- source_word: τῶν ἁγίων
  choice: der heiligen Dinge
  rationale: Der substantivierte neutrale Plural bedeutet formal „die heiligen Dinge“ und lässt offen, ob besonders das Heiligtum, heilige Orte oder geweihte Gegenstände gemeint sind.
theological_decisions:
- issue: Bezugsgröße von τῶν ἁγίων
  choice: der heiligen Dinge
  alternative: des Heiligtums / der heiligen Stätten
  rationale: Die griechische Form ist ein neutraler Plural und bezeichnet daher nicht „die Heiligen“. Die breitere Wiedergabe erhält die grammatische Form und lässt den wahrscheinlichen Bezug auf Tempel und geweihte Dinge offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mitanzusehen“ erhält die emotionale Kraft des Zuschauens; die ungewöhnliche Wendung „heilige Dinge“ bleibt wegen der echten Mehrdeutigkeit des griechischen neutralen Plurals im Haupttext stehen.
