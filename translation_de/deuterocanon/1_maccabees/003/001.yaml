  text: And Judas[a], who was called Maccabeus, his son, rose up in his place.
translation:
  language: de
  text: Und Judas, sein Sohn, der Makkabäus genannt wurde, trat an seine Stelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστη
  choice: trat … an
  rationale: Der Aorist von ἀνίστημι beschreibt hier Judas’ Hervortreten und die Übernahme der Stellung seines Vaters. Zusammen mit ἀντʼ αὐτοῦ gibt „trat an seine Stelle“ den Zusammenhang natürlich wieder, ohne einen technischen Amtsantritt zu behaupten.
- source_word: ὁ καλούμενος
  choice: der … genannt wurde
  rationale: Die partizipiale Wendung kennzeichnet Judas durch einen zusätzlichen Namen oder Beinamen und bleibt in dieser Form eng an der griechischen Aussage.
- source_word: Μακκαβαῖος
  choice: Makkabäus
  rationale: „Makkabäus“ ist die im Deutschen eingebürgerte Wiedergabe des griechischen Namens beziehungsweise Beinamens Μακκαβαῖος.
- source_word: υἱὸς αὐτοῦ
  choice: sein Sohn
  rationale: Die Wendung bezeichnet Judas eindeutig als Sohn der zuvor genannten Person; „sein Sohn“ ist die klare und natürliche deutsche Form.
- source_word: ἀντʼ αὐτοῦ
  choice: an seine Stelle
  rationale: ἀντί mit Genitiv bezeichnet hier Ersatz beziehungsweise Nachfolge. „An seine Stelle“ bewahrt diesen Sinn, ohne mehr als der griechische Text über Art oder Rechtsform der Nachfolge auszusagen.
theological_decisions:
- issue: Art der Nachfolge des Judas
  choice: trat an seine Stelle
  alternative: folgte ihm nach; erhob sich an seiner Stelle
  rationale: Der Vers schildert Judas’ Hervortreten anstelle seines Vaters, verwendet aber keinen technischen Ausdruck für eine förmliche politische oder militärische Amtsnachfolge. Die gewählte Formulierung lässt diese Einzelheiten offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung nennt Judas zunächst zusammen mit seiner familiären Beziehung und fügt dann den Beinamen ein; der abschließende Ausdruck vermittelt die Nachfolge idiomatisch und ohne unnötige Ausdeutung.
