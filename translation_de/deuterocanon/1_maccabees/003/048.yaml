  source_fidelity: 'Der Hauptsatz ist zutreffend wiedergegeben. Im Nebensatz verschiebt jedoch „bei den Abbildern ihrer Götzen suchten“ die griechische Konstruktion: τὰ ἔθνη sind Subjekt und τὰ ὁμοιώματα τῶν εἰδώλων αὐτῶν das Gesuchte; ein Suchen oder Befragen „bei“ den Abbildern ist im Haupttext nicht ausdrücklich gesagt. Die schwierige, elliptische Verknüpfung durch περὶ ὧν soll offen bleiben.'
  naturalness: „Im Blick auf die Dinge, nach denen … bei den Abbildern … suchten“ ist im Deutschen schwer verständlich und erweckt zudem den falschen Eindruck, die Abbilder seien der Ort oder das Mittel der Suche. „Im Zusammenhang mit Dingen, zu denen … nach Abbildern … suchten“ ist zwar absichtlich zurückhaltend, aber grammatisch klarer und angemessen für die überlieferte Verdichtung.
  terminology: „Buch des Gesetzes“, „Völker“, „Abbilder“ und „Götzen“ sind sachgerecht. Die Unterscheidung von ὁμοιώματα und εἴδωλα bleibt erhalten. Die Alternative „entrollten“ ist für einen möglichen Rollenkontext passend, ohne ihn im Haupttext festzulegen.
