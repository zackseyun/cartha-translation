base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/048.yaml
  text: And they spread out the book of the law[b][a], concerning which the nations were searching for the likenesses of their idols.
translation:
  language: de
  text: Und sie breiteten das Buch des Gesetzes aus[a], im Zusammenhang mit Dingen, zu denen die Völker nach Abbildern ihrer Götzen suchten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „öffneten“ beziehungsweise „entrollten das Buch des Gesetzes“.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Satz ist stark verkürzt und mehrdeutig. Wörtlich stehen die Suche der Völker nach „Abbildern ihrer Götzen“ und ein Bezug auf nicht näher bestimmte Dinge nebeneinander. Möglich ist unter anderem, dass die Suche enger auf das Gesetzbuch oder auf einen Vergleich mit solchen Abbildern bezogen wird.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξεπέτασαν
  choice: breiteten … aus
  rationale: Das Verb bezeichnet wörtlich das Ausbreiten oder Entfalten. Bei einem Gesetzbuch bleibt diese Wiedergabe anschaulich, ohne ausdrücklich eine Buchrolle vorauszusetzen.
- source_word: τὸ βιβλίον τοῦ νόμου
  choice: das Buch des Gesetzes
  rationale: Die Wendung gibt den griechischen Ausdruck direkt und im Deutschen idiomatisch wieder. Die Kleinschreibung von „Gesetz“ vermeidet eine zusätzliche typografische Deutung.
- source_word: περὶ ὧν
  choice: im Blick auf die Dinge, nach denen
  rationale: Das griechische Relativpronomen steht im Plural und lässt sich daher nicht ohne Weiteres unmittelbar auf das singularische „Buch“ beziehen. Die Wiedergabe hält den unbestimmten Bezug auf „Dinge“ offen.
- source_word: ἐξηρεύων
  choice: suchten
  rationale: Das Imperfekt bezeichnet eine andauernde oder wiederholte Handlung. „suchten“ ist verständlich und legt nicht fest, ob ein Nachforschen, Aufsuchen oder kultisches Befragen gemeint ist.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Dies ist die direkte und am wenigsten deutende Wiedergabe; „Heiden“ wäre stärker religiös geprägt.
- source_word: τὰ ὁμοιώματα
  choice: die Abbilder
  rationale: „Abbilder“ bewahrt die Bedeutung von Ähnlichkeiten oder Darstellungen und unterscheidet den Ausdruck vom folgenden Wort für „Götzen“.
- source_word: τῶν εἰδώλων αὐτῶν
  choice: ihrer Götzen
  rationale: „Götzen“ gibt den kultischen und polemischen Sinn von εἴδωλον wieder, ohne beide Substantive als „Bilder“ einzuebnen.
theological_decisions:
- issue: Verknüpfung des Gesetzbuches mit den Abbildern der Götzen
  choice: Die komprimierte Verbindung bleibt als „im Blick auf die Dinge, nach denen die Völker bei den Abbildern ihrer Götzen suchten“ weitgehend offen.
  alternative: 'Die Völker durchsuchten das Gesetzbuch nach Darstellungen ihrer Götzen; oder: Sie befragten die Abbilder ihrer Götzen wegen derselben Angelegenheiten.'
  rationale: Der griechische Satzbau ist knapp und mehrdeutig. Der Haupttext soll weder einen Bildvergleich noch eine Orakelbefragung als eindeutig gegeben ausweisen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Formulierung im zweiten Satzteil spiegelt bewusst die Verdichtung und Mehrdeutigkeit des griechischen Textes wider.
