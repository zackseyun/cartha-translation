- from: Und sie breiteten das Buch des Gesetzes aus[a], im Blick auf die Dinge, nach denen die Völker bei den Abbildern ihrer Götzen suchten.[b]
  to: Und sie breiteten das Buch des Gesetzes aus[a], im Zusammenhang mit Dingen, zu denen die Völker nach Abbildern ihrer Götzen suchten.[b]
  rationale: Die Revision stellt wieder her, dass die Völker nach den Abbildern suchen, anstatt bei ihnen zu suchen. Zugleich wird der pluralische und nicht eindeutig bestimmbare Bezug von περὶ ὧν mit „Dingen, zu denen“ nicht künstlich auf das singularische Gesetzbuch festgelegt. Die Fußnote kennzeichnet die mögliche Deutung als solche und vermeidet, eine kultische Befragung als Aussage des Haupttexts erscheinen zu lassen.
