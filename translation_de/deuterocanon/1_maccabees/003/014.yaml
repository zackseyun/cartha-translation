  yaml_path: translation/deuterocanon/1_maccabees/003/014.yaml
  text: And he said[a], “I will make a name for myself, and I will be glorified in the kingdom[c][b], and I will fight Judah and those with him who are disregarding the king’s word.”
translation:
  language: de
  text: 'Und er sagte: „Ich werde mir einen Namen machen und im Königreich[a] Ruhm erlangen. Ich werde gegen Judas[b] und die, die bei ihm sind, kämpfen, die das Wort des Königs[c] verachten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Herrschaftsgebiet“.'
    reason: lexikalische Alternative zu βασιλεία
  - marker: b
    text: Gemeint ist Judas Makkabäus; auch die Namensform „Juda“ ist möglich.
    reason: Namensvariante und Identifizierung
  - marker: c
    text: Das „Wort des Königs“ kann hier seinen Befehl oder Erlass bezeichnen.
    reason: kontextuelle Bedeutung von λόγος
lexical_decisions:
- source_word: Ποιήσω ἐμαυτῷ ὄνομα
  choice: Ich werde mir einen Namen machen
  rationale: Die im Deutschen geläufige Wendung bewahrt das griechische Idiom für den Erwerb von Ruhm oder Ansehen und dessen selbstbezogenen Zug.
- source_word: δοξασθήσομαι
  choice: Ruhm erlangen
  rationale: Das griechische Futur Passiv bezeichnet hier das Erlangen von Ruhm oder Ehre. Die deutsche Formulierung klingt natürlich und vermeidet den in diesem Zusammenhang leicht missverständlichen religiösen Beiklang von „verherrlicht werden“.
- source_word: ἐν τῇ βασιλείᾳ
  choice: im Königreich
  rationale: Dies gibt βασιλεία unmittelbar wieder, ohne eine im Griechischen nicht ausdrücklich genannte nähere Bestimmung hinzuzufügen.
- source_word: πολεμήσω
  choice: ich werde … kämpfen
  rationale: Die knappe Wiedergabe entspricht dem militärischen Sinn des Verbs; „Krieg führen“ wäre ebenfalls möglich, aber etwas ausgreifender.
- source_word: τὸν Ἰούδαν
  choice: gegen Judas
  rationale: Die Form ist der Akkusativ des griechischen Personennamens Ἰούδας und bezeichnet hier Judas Makkabäus. „Judas“ ist die etablierte deutsche Namensform.
- source_word: τοὺς σὺν αὐτῷ
  choice: seine Anhänger
  rationale: Wörtlich steht „die mit ihm“. „Seine Anhänger“ bezeichnet die zu Judas gehörende Gruppe natürlich, ohne ihre genaue Funktion enger festzulegen.
- source_word: τοὺς ἐξουθενοῦντας
  choice: die … verachten
  rationale: ἐξουθενέω bezeichnet ein geringschätziges Verwerfen oder Behandeln als unbedeutend. „Verachten“ bewahrt diese stärkere Bedeutung besser als bloßes „nicht beachten“.
- source_word: τὸν λόγον τοῦ βασιλέως
  choice: das Wort des Königs
  rationale: Die formnahe Wiedergabe erhält λόγος als „Wort“; im Zusammenhang kann damit der Befehl oder Erlass des Königs gemeint sein.
theological_decisions:
- issue: Bestimmung des Namens Ἰούδαν
  choice: Als Personenname „Judas“ wiedergegeben, bezogen auf Judas Makkabäus.
  alternative: „Juda“ als stärker an der hebräischen Namensform orientierte Wiedergabe.
  rationale: Der Kontext bezeichnet eindeutig den makkabäischen Anführer. Die Wahl der geläufigen deutschen Form „Judas“ ist eine Namenskonvention und legt keine theologische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt entschlossen und selbstherrlich. Der zweite Satz innerhalb der Rede erhöht die Lesbarkeit, ohne die syntaktische Abfolge oder den Sinn des griechischen Textes zu verändern.
