base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/019.yaml
  text: For victory in war is not in a multitude of strength[a], but strength is from heaven.
translation:
  language: de
  text: Denn der Sieg im Krieg hängt nicht von großer Stärke ab, sondern die Stärke kommt vom Himmel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλήθει δυνάμεως
  choice: von einer großen Streitmacht
  rationale: Die Wendung bezeichnet eine große Ansammlung militärischer Stärke. „Große Streitmacht“ gibt den militärischen Zusammenhang natürlich wieder, ohne den Ausdruck ausschließlich auf die Zahl der Soldaten zu verengen.
- source_word: νίκη πολέμου
  choice: der Sieg im Krieg
  rationale: Der Genitiv πολέμου bestimmt die Art des Sieges; „Sieg im Krieg“ ist im modernen Deutschen klar und idiomatisch.
- source_word: ἀλλʼ ἢ
  choice: sondern
  rationale: Nach der verneinten Aussage bildet „sondern“ den deutschen Gegensatz natürlich und prägnant ab.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: Die Übersetzung bewahrt die ausdrückliche Wendung des Griechischen und damit auch ihre ehrfürchtige indirekte Bezugnahme auf göttliche Hilfe.
- source_word: ἰσχύς
  choice: Kraft
  rationale: ἰσχύς bezeichnet Kraft oder Stärke. „Kraft“ wahrt den Sinn und setzt die vom Himmel kommende Wirksamkeit von der zuvor genannten versammelten militärischen Macht ab.
theological_decisions:
- issue: Ob ἐκ τοῦ οὐρανοῦ als indirekte ehrfürchtige Bezeichnung Gottes aufgelöst werden soll
  choice: vom Himmel
  alternative: von Gott
  rationale: Der griechische Text nennt ausdrücklich den Himmel. Diese jüdische Umschreibung kann göttliche Hilfe bezeichnen, soll aber in der Übersetzung nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „hängt nicht von … ab“ gibt die griechische Aussage, worin der Sieg nicht besteht beziehungsweise worauf er nicht beruht, verständlich wieder. Der Kontrast zwischen menschlich gebündelter militärischer Macht und der vom Himmel kommenden Kraft bleibt erhalten.
