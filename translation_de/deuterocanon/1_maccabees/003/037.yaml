  yaml_path: translation/deuterocanon/1_maccabees/003/037.yaml
  text: And the king took half of the forces that had been left behind and departed from Antioch[a], the city of his kingdom, in the one hundred forty-seventh year[c][b]; and he crossed the Euphrates River and traveled through the upper regions.
translation:
  language: de
  text: Und der König nahm die Hälfte der zurückgelassenen Streitkräfte mit und brach von Antiochia, der Königsstadt seines Reiches,[a] im hundertsiebenundvierzigsten Jahr[b] auf. Er überschritt den Euphrat und zog durch die oberen Gebiete.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Antiochia, der königlichen Stadt seines Reiches“. Die griechische Formulierung kennzeichnet Antiochia wahrscheinlich als königliche Stadt beziehungsweise als zentrale Stadt des Reiches.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: im 147. Jahr der seleukidischen Zeitrechnung.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „durch die höher gelegenen Landesteile“, „durch die Binnengebiete“ oder „durch die oberen Provinzen“. Gemeint sind wahrscheinlich Gebiete östlich des Euphrat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: nahm … mit
  rationale: Im militärischen Zusammenhang bezeichnet das Verb, dass der König die Truppen mit sich nahm; die deutsche Wendung gibt dies genauer wieder als das bloße „nahm“.
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: die Hälfte der Streitkräfte
  rationale: Die ungewöhnliche griechische Pluralform bezeichnet sinngemäß eine Hälfte; „Streitkräfte“ wahrt den breiten militärischen Sinn von δυνάμεις.
- source_word: τὰς καταλειφθείσας
  choice: der zurückgelassenen
  rationale: Das Partizip verweist auf Streitkräfte, die zuvor zurückgelassen worden waren.
- source_word: ἀπῆρεν
  choice: brach … auf
  rationale: Die idiomatische deutsche Reiseformel passt zum Beginn eines militärischen Zuges und zum würdigen Erzählstil.
- source_word: ἀπὸ πόλεως βασιλείας αὐτοῦ
  choice: der Residenzstadt seines Königreichs
  rationale: Die Formulierung wird appositionell auf Antiochia bezogen. „Residenzstadt“ vermittelt die königliche bzw. zentrale Funktion, ohne die Stadt zwingend mit dem modernen Verwaltungsbegriff „Hauptstadt“ zu bezeichnen.
- source_word: ἔτους ἑβδόμου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: im hundertsiebenundvierzigsten Jahr
  rationale: Dies gibt die griechische Ordinalzahl in natürlicher deutscher Form wieder.
- source_word: διεπέρασεν
  choice: überschritt
  rationale: Das Verb bezeichnet klar das Überqueren des Flusses.
- source_word: τὸν Εὐφράτην ποταμόν
  choice: den Euphrat
  rationale: Im Deutschen bezeichnet der Eigenname bereits eindeutig den Fluss; die Ergänzung „Fluss“ wäre unnötig.
- source_word: διεπορεύετο
  choice: zog durch
  rationale: Das Imperfekt beschreibt fortgesetzte Bewegung; „zog durch“ ist für einen königlichen bzw. militärischen Reisezug natürlich.
- source_word: τὰς ἐπάνω χώρας
  choice: die oberen Gebiete
  rationale: Die Wiedergabe bleibt nahe am räumlich mehrdeutigen Griechisch und legt sich nicht vorschnell auf „Provinzen“ oder „Binnenland“ fest.
