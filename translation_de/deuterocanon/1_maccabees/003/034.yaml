  text: And he handed over to him half of the forces and the elephants[a], and he gave him orders concerning everything he desired, and concerning all those dwelling in Judea and Jerusalem[b],
translation:
  language: de
  text: Und er übergab ihm die Hälfte der Streitkräfte und die Elefanten[a] und gab ihm Anweisungen zu allem, was er wollte,[b] und hinsichtlich aller, die in Judäa und Jerusalem wohnten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vertraute ihm die Hälfte der Streitkräfte und die Elefanten an«. Das griechische Verb kann die Übergabe in die Verantwortung eines anderen betonen.'
