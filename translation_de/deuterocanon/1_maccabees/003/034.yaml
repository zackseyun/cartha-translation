lexical_decisions:
- source_word: παρέδωκεν
  choice: übergab
  rationale: Das Verb bezeichnet hier die Übertragung von Verfügungsgewalt beziehungsweise Verantwortung. »Übergab« bewahrt diesen konkreten Sinn, ohne eine feindliche Auslieferung anzudeuten.
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: die Hälfte der Streitkräfte
  rationale: Gemeint ist die Hälfte der militärischen Kräfte. Diese Formulierung ist im Deutschen idiomatisch und gibt den militärischen Kontext sowie den weiten Sinn von δυνάμεις wieder.
- source_word: τοὺς ἐλέφαντας
  choice: die Elefanten
  rationale: Der griechische Text nennt schlicht die Elefanten; ihre militärische Verwendung ergibt sich aus dem Kontext. »Kriegselefanten« wäre erklärender als die Vorlage.
- source_word: ἐνετείλατο αὐτῷ
  choice: Er gab ihm Anweisungen
  rationale: Die Wendung bezeichnet das Erteilen verbindlicher Aufträge. »Anweisungen geben« klingt in modernem Deutsch natürlich und wahrt den militärisch-administrativen Zusammenhang.
- source_word: περὶ πάντων ὧν ἐβούλετο
  choice: zu allem, was er vorhatte
  rationale: Die griechische Formulierung lässt den konkreten Gegenstand des Wollens unausgesprochen. »Vorhatte« bewahrt diese Offenheit und bezeichnet hier eher beabsichtigte Vorhaben als bloßes Begehren.
- source_word: τῶν κατοικούντων
  choice: allen, die … wohnten
  rationale: Die substantivierte Partizipialform wird verbal und natürlich wiedergegeben.
- source_word: τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: in Judäa und Jerusalem
  rationale: Bei κατοικεῖν bezeichnet der Akkusativ im hellenistischen Griechisch den Wohnort; im Deutschen ist dafür »in« erforderlich.
