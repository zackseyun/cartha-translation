base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/010.yaml
  text: And Apollonius gathered Gentiles[a], and from Samaria a large force to wage war against Israel.
translation:
  language: de
  text: Apollonius zog Völker[a] und eine große Streitmacht aus Samarien zusammen, um gegen Israel Krieg zu führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nichtisraelitische Völker. Das griechische Wort kann allgemein „Völker“ bedeuten, bezeichnet hier aber wahrscheinlich die gegen Israel versammelten Nichtisraeliten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: zog … zusammen
  rationale: Der Aorist bezeichnet das Zusammenbringen beziehungsweise Sammeln. „Zusammenziehen“ klingt im militärischen Zusammenhang natürlich, ohne den Gegenstand enger als im Griechischen zu bestimmen.
- source_word: ἔθνη
  choice: Völker
  rationale: Das griechische Wort bedeutet grundsätzlich „Völker“ und bezeichnet hier im Gegensatz zu Israel wahrscheinlich nichtisraelitische Bevölkerungsgruppen. Die offene Grundbedeutung bleibt im Haupttext erhalten; der Kontext wird in der Fußnote erläutert.
- source_word: δύναμιν μεγάλην
  choice: eine große Streitmacht
  rationale: δύναμις bezeichnet hier aufgrund des Kriegskontexts eine militärische Truppe beziehungsweise Streitmacht, nicht abstrakte Macht.
- source_word: ἀπὸ Σαμαρίας
  choice: aus Samarien
  rationale: Die Präposition bezeichnet die Herkunft der Streitmacht.
- source_word: τοῦ πολεμῆσαι
  choice: um … Krieg zu führen
  rationale: Der artikulierte Infinitiv gibt den Zweck des Zusammenziehens an; „Krieg führen“ entspricht der organisierten militärischen Handlung.
- source_word: πρὸς Ἰσραήλ
  choice: gegen Israel
  rationale: In Verbindung mit πολεμέω bezeichnet πρὸς die feindliche Ausrichtung.
theological_decisions:
- issue: Bedeutung von ἔθνη im jüdischen Kriegskontext
  choice: Völker
  alternative: Nichtisraeliten; Heiden
  rationale: „Völker“ bewahrt die lexikalische Mehrdeutigkeit des griechischen Ausdrucks. Im Zusammenhang sind wahrscheinlich nichtisraelitische Völker gemeint. „Heiden“ würde eine stärkere religiöse Wertung eintragen, als das Wort für sich allein verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Streitmacht“ verdeutlicht den militärischen Zusammenhang; „Völker“ wahrt die Mehrdeutigkeit des griechischen Ausdrucks.
