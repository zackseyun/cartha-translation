base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/041.yaml
  text: And the merchants of the land heard their name[a], and they took very much silver and gold, and servants, and came into the camp to take the sons of Israel as servants[c][b]. And forces from Syria and from the land of foreigners were added to them.
translation:
  language: de
  text: Als die Händler des Landes von ihrem Ruf[a] hörten, nahmen sie sehr viel Silber und Gold sowie Diener[b] mit und kamen ins Lager, um die Söhne Israels als Sklaven zu nehmen. Auch Truppen aus Syrien und aus dem Land der Fremdvölker[c] schlossen sich ihnen an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihrem Namen“; möglich ist auch: „von der Kunde über sie“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann „Kinder“, „Jungen“, „Diener“ oder „Sklaven“ bedeuten. Dasselbe Wort steht später für das, wozu die Israeliten gemacht werden sollten.
    reason: lexical_ambiguity
  - marker: c
    text: 'Das griechische Wort für „Fremdvölker“ kann im biblischen Sprachgebrauch auch die Philister bezeichnen; daher auch: „aus dem Philisterland“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι τῆς χώρας
  choice: die Händler des Landes
  rationale: ἔμποροι bezeichnet Handelstreibende; χώρα kann Land, Gebiet oder Region bedeuten. Die Wiedergabe bleibt nah am Griechischen und ist im Deutschen verständlich.
- source_word: τὸ ὄνομα αὐτῶν
  choice: ihren Ruf
  rationale: Wörtlich steht „ihren Namen“. Im Zusammenhang bezeichnet die Wendung das, was über die Truppen bekannt geworden war, also ihren Ruf oder die Kunde von ihnen. „Ruf“ gibt den griechischen Sinn natürlich wieder; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: ἀργύριον καὶ χρυσίον πολὺ σφόδρα
  choice: sehr viel Silber und Gold
  rationale: πολὺ σφόδρα verstärkt die Mengenangabe ausdrücklich. Die Formulierung bildet diese Steigerung knapp und natürlich ab.
- source_word: παῖδας
  choice: Diener / Sklaven
  rationale: παῖς kann je nach Zusammenhang Kind, Junge, Diener oder Sklave bedeuten. Beim Mitgebrachten ist „Diener“ eine natürliche Wiedergabe; beim beabsichtigten Erwerb der Israeliten als menschliches Eigentum verlangt der Kontext „Sklaven“. Eine Fußnote macht sichtbar, dass im Griechischen an beiden Stellen dasselbe Wort steht.
- source_word: παρεμβολήν
  choice: Lager
  rationale: Hier liegt die übliche militärische Bedeutung „Lager“ oder „Heerlager“ vor.
- source_word: τοῦ λαβεῖν τοὺς υἱοὺς Ἰσραὴλ εἰς παῖδας
  choice: um die Söhne Israels als Sklaven zu nehmen
  rationale: Der substantivierte Infinitiv bezeichnet den Zweck ihres Kommens. „Söhne Israels“ bewahrt die ausdrückliche Form υἱοὺς Ἰσραήλ; „als Sklaven“ verdeutlicht in diesem Kauf- und Gefangenschaftskontext den Status menschlichen Eigentums.
- source_word: προσετέθησαν πρὸς αὐτούς
  choice: schlossen sich ihnen an
  rationale: Die wörtliche Passivform „wurden ihnen hinzugefügt“ wäre im heutigen Deutsch schwerfällig. „Schlossen sich ihnen an“ gibt den Vorgang sachgerecht und natürlich wieder.
- source_word: δυνάμεις Συρίας καὶ γῆς ἀλλοφύλων
  choice: Truppen aus Syrien und aus dem Land der Fremdvölker
  rationale: δυνάμεις meint hier militärische Kräfte oder Truppen. ἀλλόφυλοι bedeutet wörtlich Angehörige eines anderen Volkes und kann in biblischem Sprachgebrauch auch speziell die Philister bezeichnen; der Haupttext bewahrt die allgemeinere Form.
theological_decisions:
- issue: Wiedergabe von παῖδας im Zusammenhang des Menschenhandels
  choice: Diener beim Mitgebrachten, Sklaven beim beabsichtigten Schicksal der Israeliten
  alternative: an beiden Stellen „Diener“ oder an beiden Stellen „Sklaven“
  rationale: Der Kontext macht beim zweiten Vorkommen deutlich, dass die Israeliten als menschliches Eigentum erworben werden sollten. Beim ersten Vorkommen bezeichnet dasselbe Wort dagegen die mitgebrachten Personen, ohne deren genauen Status ausdrücklich festzulegen. Die kontextabhängige Wiedergabe wahrt sowohl die Ausbeutungssituation als auch die lexikalische Mehrdeutigkeit; die Wiederholung desselben griechischen Wortes wird angemerkt.
- issue: Identität der ἀλλόφυλοι
  choice: Fremdvölker
  alternative: Philister
  rationale: Das Wort kann allgemein Fremdstämmige bezeichnen, fungiert in der Septuaginta jedoch häufig als Bezeichnung der Philister. Da der Vers allein die engere ethnische Zuordnung nicht zwingend festlegt, bleibt der Haupttext allgemein und nennt die mögliche Identifizierung in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Unnatürliche griechische Satzverkettungen wurden behutsam geglättet, ohne die Abfolge der Handlungen oder die Härte des Sklavenhandels abzuschwächen.
