base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/023.yaml
  text: And when he stopped speaking[a], he suddenly charged at them[b], and Seron and his camp were crushed before him.
translation:
  language: de
  text: Als er zu Ende geredet hatte, stürmte er plötzlich auf sie los[a], und Seron und sein Heer[b] wurden vor ihm zerschmettert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „sprang auf sie los“ oder „stürzte sich auf sie“; das griechische Verb bezeichnet einen plötzlichen, heftigen Angriff.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch „Lager“ oder allgemeiner „Streitmacht“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: Als er zu Ende geredet hatte
  rationale: Die Wendung bezeichnet den unmittelbaren Abschluss von Judas’ Rede und leitet die anschließende Handlung natürlich ein.
- source_word: ἐνήλατο ἐπʼ αὐτοὺς
  choice: stürmte er … auf sie los
  rationale: Das Verb beschreibt eine kraftvolle, unvermittelte Angriffsbewegung; „auf sie losstürmen“ gibt Richtung und militärische Dynamik idiomatisch wieder.
- source_word: ἄφνω
  choice: plötzlich
  rationale: Die klare, direkte Entsprechung bewahrt die Abruptheit des Angriffs.
- source_word: συνετρίβη
  choice: wurden … zerschmettert
  rationale: Die bildkräftige Passivform bezeichnet ein Zerschlagen oder vernichtendes Besiegen und sollte nicht zum bloßen „besiegt“ abgeschwächt werden.
- source_word: Σήρων
  choice: Seron
  rationale: Gebräuchliche deutsche Umschrift des griechischen Eigennamens.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: sein Heer
  rationale: παρεμβολή kann sowohl das Lager als auch die darin versammelte Streitmacht bezeichnen; im Zusammenhang einer unmittelbar geschlagenen Truppe ist „Heer“ im Deutschen am klarsten.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor ihm
  rationale: Die räumliche Wendung bleibt eng am Griechischen und lässt offen, ob vor allem Judas’ Gegenwart oder die direkte Konfrontation betont wird.
