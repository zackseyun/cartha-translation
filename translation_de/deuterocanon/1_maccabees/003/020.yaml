  text: They are coming against us in a great mass of insolence and lawlessness, to wipe out us and our wives and our children, and to plunder us.
translation:
  language: de
  text: Sie ziehen in großer Zahl gegen uns heran, voller Anmaßung und Gesetzlosigkeit[a], um uns, unsere Frauen und unsere Kinder auszurotten und uns auszuplündern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, enger am Griechischen: „mit einer Fülle von Anmaßung und Gesetzlosigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ἔρχονται πρὸς ἡμᾶς
  choice: Sie ziehen gegen uns heran
  rationale: πρός mit dem Akkusativ bezeichnet hier im militärischen Zusammenhang eine feindliche Bewegung. „Gegen uns heran“ gibt sowohl die Richtung als auch die feindliche Absicht natürlich wieder.
- source_word: πλήθει
  choice: in großer Zahl
  rationale: Der Dativ bezeichnet die Art und Weise beziehungsweise den begleitenden Umstand. „In großer Zahl“ ist im Deutschen idiomatisch und bringt die zahlenmäßige Übermacht zum Ausdruck; die ungewöhnliche Verbindung mit den folgenden Genitiven wird in der Fußnote kenntlich gemacht.
- source_word: ὕβρεως
  choice: Übermut
  rationale: ὕβρις bezeichnet anmaßenden, oft gewalttätigen Hochmut. „Übermut“ bewahrt hier sowohl die Selbstüberhebung als auch den frevelhaften Charakter.
- source_word: ἀνομίας
  choice: Gesetzlosigkeit
  rationale: „Gesetzlosigkeit“ entspricht der Grundbedeutung von ἀνομία und wahrt den Bezug auf die Missachtung von Gesetz und Recht.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: um uns … auszurotten
  rationale: Der artikulierte Infinitiv bezeichnet den Zweck. ἐξαίρω meint hier vollständige Beseitigung; „ausrotten“ gibt die beabsichtigte Vernichtung kraftvoll und präzise wieder.
- source_word: τὰς γυναῖκας ἡμῶν καὶ τὰ τέκνα ἡμῶν
  choice: unsere Frauen und unsere Kinder
  rationale: γυναῖκες kann hier die Ehefrauen bezeichnen; „unsere Frauen“ ist im Deutschen kontextgerecht und bewahrt zugleich die mögliche weitere Bedeutung. Die wiederholte Besitzangabe des Griechischen bleibt erhalten.
- source_word: τοῦ σκυλεῦσαι ἡμᾶς
  choice: uns auszuplündern
  rationale: σκυλεύω bezeichnet das Plündern oder Berauben, besonders nach einem militärischen Sieg. „Ausplündern“ gibt die vollständige, gewaltsame Beraubung idiomatisch wieder.
