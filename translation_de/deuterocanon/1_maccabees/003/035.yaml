  text: to send a force against them[a], to crush and remove the strength of Israel and the remnant of Jerusalem, and to take away its memory from the place,
translation:
  language: de
  text: eine Streitmacht gegen sie zu entsenden, um die Stärke Israels und den Rest Jerusalems zu zerschlagen und zu beseitigen und sein Andenken[a] von dem Ort zu tilgen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Erinnerung“ oder „sein Erinnerungszeichen“.'
    reason: Lexikalische Bedeutungsbreite von μνημόσυνον; der Ausdruck kann sowohl die fortlebende Erinnerung als auch ein konkreteres Erinnerungszeichen bezeichnen.
lexical_decisions:
- source_word: ἀποστεῖλαι
  choice: zu entsenden
  rationale: Der Aoristinfinitiv gibt den Inhalt beziehungsweise Zweck des vorausgehenden Beschlusses wieder. „Entsenden“ ist im militärischen Zusammenhang natürlich und würdig, ohne zusätzliche Einzelheiten einzutragen.
- source_word: δύναμιν
  choice: eine Streitmacht
  rationale: Im militärischen Kontext bezeichnet δύναμις eine bewaffnete Truppe, nicht abstrakte Macht. „Streitmacht“ wahrt die mögliche Größenordnung besser als das enger festlegende „Heer“.
- source_word: τοῦ ἐκρίψαι
  choice: um … zu zerschlagen
  rationale: Der artikulierte Infinitiv bezeichnet den feindlichen Zweck. „Zerschlagen“ gibt den gewaltsamen Sinn wieder und bleibt vom anschließenden Beseitigen unterscheidbar.
- source_word: ἐξᾶραι
  choice: zu beseitigen
  rationale: Das Verb bezeichnet das Wegnehmen oder Entfernen. „Beseitigen“ passt zum gewaltsamen Vorhaben, ohne das bildhaftere „ausrotten“ in den Text einzutragen.
- source_word: τὴν ἰσχὺν Ἰσραήλ
  choice: die Stärke Israels
  rationale: Die transparente Wiedergabe bewahrt sowohl die Bedeutung von ἰσχύς als auch die Genitivkonstruktion.
- source_word: τὸ κατάλιμμα Ἰερουσαλήμ
  choice: den Rest Jerusalems
  rationale: κατάλιμμα bezeichnet das Übriggebliebene. „Rest“ lässt offen, ob vor allem Menschen, die Gemeinschaft oder allgemeiner das Verbliebene der Stadt gemeint ist.
- source_word: ἆραι τὸ μνημόσυνον αὐτοῦ
  choice: sein Andenken zu tilgen
  rationale: μνημόσυνον kann Andenken, Erinnerung oder Erinnerungszeichen bedeuten. „Andenken tilgen“ gibt das Ziel vollständiger Auslöschung der Erinnerung idiomatisch wieder; das singularische „sein“ bewahrt die Form und eine gewisse Bezugsambiguität von αὐτοῦ.
- source_word: ἀπὸ τοῦ τόπου
  choice: von dem Ort
  rationale: Die Wiedergabe bleibt bei dem bestimmten, aber nicht näher bezeichneten τόπος und ergänzt weder „diesem“ noch ein possessives Element.
theological_decisions:
- issue: Umfang von τὸ κατάλιμμα Ἰερουσαλήμ
  choice: „den Rest Jerusalems“ als breite kollektive Wendung
  alternative: „die Überlebenden Jerusalems“ oder „das, was von Jerusalem übrig war“
  rationale: Der griechische Ausdruck kann allgemein das Übriggebliebene bezeichnen. Die Übersetzung beschränkt ihn daher nicht ohne Not ausschließlich auf Personen.
- issue: Bezug des singularischen αὐτοῦ
  choice: „sein Andenken“ unter Wahrung des Singulars und möglicher Bezugsambiguität
  alternative: „ihr Andenken“ als zusammenfassender Bezug auf Israel und Jerusalem
  rationale: Die griechische Form ist singularisch. Eine deutsche Pluralform würde den Bezug ausdrücklich auf mehrere zuvor genannte Größen verteilen und damit die im Ausgangstext verbleibende Spannung auflösen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit militärisch passender, aber nicht unnötig technischer Wortwahl. Die Infinitivstruktur und das abschließende Komma spiegeln den Charakter des überlieferten Verssegments im fortlaufenden Satz. „Von dem Ort“ ist bewusst quellennah und etwas markierter als die idiomatischere Ergänzung „von diesem Ort“.
