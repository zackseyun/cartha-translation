  yaml_path: translation/deuterocanon/1_maccabees/003/028.yaml
  text: And he opened his treasury and gave wages to his forces for a year, and he commanded them to be ready for every need for a year.
translation:
  language: de
  text: Und er öffnete seine Schatzkammer und zahlte seinen Truppen Sold für ein Jahr; und er befahl ihnen, ein Jahr lang für alle Anforderungen bereit zu sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γαζοφυλάκιον
  choice: Schatzkammer
  rationale: Bezeichnet hier den Ort beziehungsweise Bestand der königlichen Geldreserven; „Schatzkammer“ ist präzise und natürlich.
- source_word: ὀψώνια
  choice: Sold
  rationale: Im militärischen Zusammenhang bezeichnet das Wort die Bezahlung beziehungsweise Versorgung von Soldaten; „Sold“ gibt dies knapp und idiomatisch wieder.
- source_word: δυνάμεσιν
  choice: Truppen
  rationale: Der Kontext verlangt die militärische Bedeutung „Streitkräfte/Truppen“; „Truppen“ ist im Deutschen flüssiger.
- source_word: εἰς πᾶσαν χρείαν
  choice: für jeden Einsatz
  rationale: Wörtlich etwa „für jeden Bedarf/jede Notwendigkeit“; im militärischen Kontext meint es die Bereitschaft für jede erforderliche Aufgabe oder Lage.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „ein Jahr“ bleibt erhalten, da sie auch im griechischen Text zweimal vorkommt; durch unterschiedliche Satzstellung klingt sie natürlich. Der zweite mit καί verbundene Hauptsatz wird zur besseren deutschen Lesbarkeit mit „Dann“ eingeleitet.
