base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/046.yaml
  text: And they assembled and came to Mizpah[a], opposite Jerusalem, because formerly Mizpah had been a place of prayer for Israel.
translation:
  language: de
  text: Sie versammelten sich und kamen nach Mizpa, Jerusalem gegenüber[a]; denn Mizpa war früher für Israel ein Ort des Gebets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Jerusalem zugewandt. Der griechische Ausdruck bezeichnet eine Lage gegenüber oder vor Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: sie versammelten sich
  rationale: Die passive beziehungsweise deponentische Aoristform bezeichnet hier idiomatisch das gemeinsame Zusammenkommen und wird im Deutschen natürlich reflexiv wiedergegeben.
- source_word: ἦλθοσαν εἰς Μασσηφά
  choice: kamen nach Mizpa
  rationale: ἔρχομαι mit εἰς und einem Zielort wird im Erzählzusammenhang treffend mit „nach … kommen“ wiedergegeben; „Mizpa“ ist die im Deutschen geläufige Form des biblischen Ortsnamens.
- source_word: κατέναντι Ἰερουσαλήμ
  choice: Jerusalem gegenüber
  rationale: κατέναντι bezeichnet eine Lage gegenüber oder vor etwas. „Jerusalem gegenüber“ bewahrt die räumliche Aussage, ohne sie auf bloße Nähe zu reduzieren.
- source_word: τόπος προσευχῆς
  choice: ein Ort des Gebets
  rationale: Die Wendung bezeichnet einen mit Gebet verbundenen Ort. Die Übersetzung bleibt allgemein und führt weder Synagoge noch Heiligtum oder Altar in den Text ein.
- source_word: τὸ πρότερον
  choice: früher
  rationale: Der adverbiale Ausdruck verweist knapp und natürlich auf eine frühere Zeit.
- source_word: τῷ Ἰσραήλ
  choice: für Israel
  rationale: 'Der Dativ bezeichnet hier am ehesten die Zuordnung beziehungsweise Bestimmung: Mizpa diente Israel als Gebetsort.'
theological_decisions:
- issue: Art des Gebetsortes in Mizpa
  choice: ein Ort des Gebets
  alternative: ein Bethaus; ein Ort des Gottesdienstes
  rationale: Der griechische Text nennt lediglich einen τόπος προσευχῆς. Eine nähere institutionelle oder kultische Bestimmung wäre nicht ausdrücklich vom Ausgangstext gedeckt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. Das Semikolon gliedert Versammlung und historische Begründung, ohne den knappen Stil des griechischen Textes unnötig auszubauen.
