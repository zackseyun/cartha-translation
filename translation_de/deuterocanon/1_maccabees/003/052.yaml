base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/052.yaml
  text: And behold[a], the nations have gathered against us to destroy us[b]; you know what they are planning against us.
translation:
  language: de
  text: 'Und sieh[a]: Die Völker haben sich gegen uns versammelt, um uns auszurotten[b]. Du weißt, was sie gegen uns planen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und siehe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „uns zu beseitigen“ oder „uns zu vernichten“. Das griechische Verb kann sowohl das Entfernen als auch die vollständige Vernichtung bezeichnen.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Oder: „was sie gegen uns aushecken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt die hinweisende und dringliche Kraft des griechischen Ausdrucks in der unmittelbaren Anrede an Gott; im heutigen Deutsch ist „sieh“ natürlicher als das feierlichere „siehe“.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Gibt den militärisch-politischen Sinn der umliegenden nichtjüdischen Völker wieder, ohne mit „die Heiden“ eine stärker religiös wertende Bedeutung einzutragen.
- source_word: συνῆκται ἐφʼ ἡμᾶς
  choice: haben sich gegen uns versammelt
  rationale: Das Perfekt bezeichnet den aus dem Zusammenkommen entstandenen gegenwärtigen Zustand; „gegen uns“ macht die feindliche Ausrichtung im Kontext deutlich.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: um uns auszurotten
  rationale: Der Infinitiv mit Artikel bezeichnet den Zweck. „Ausrotten“ bringt hier die beabsichtigte vollständige Beseitigung des Volkes zum Ausdruck, während die mögliche allgemeinere Bedeutung in der Fußnote erhalten bleibt.
- source_word: ἃ λογίζονται ἐφʼ ἡμᾶς
  choice: was sie gegen uns planen
  rationale: λογίζονται bezeichnet im feindlichen Zusammenhang nicht bloß Gedanken, sondern ein berechnendes Vorhaben; „planen“ ist klar und gegenwärtig.
theological_decisions:
- issue: Bedeutung von τὰ ἔθνη im jüdischen Kriegsgebet
  choice: die Völker
  alternative: die Heiden
  rationale: Der politische und militärische Bezug steht hier im Vordergrund. „Die Völker“ bewahrt zugleich die mögliche Abgrenzung von Israel, ohne eine spätere technische oder abwertende religiöse Bedeutung festzuschreiben.
- issue: Stärke der angedrohten Beseitigung in ἐξᾶραι
  choice: ausrotten
  alternative: beseitigen / vernichten
  rationale: Im Zusammenhang eines gegen Israel gerichteten Angriffs bezeichnet das Verb eine umfassende Beseitigung. Die Übersetzung gibt diese existentielle Bedrohung wieder, ohne zu entscheiden, ob das Verb für sich allein stets Vernichtung bedeutet.
