  register: Modernes, würdevolles Standarddeutsch mit der direkten Dringlichkeit eines Gebets. Der Doppelpunkt nach dem einleitenden Ruf und die Satzteilung machen den Vers gut verständlich, ohne seine knappe Parallelstruktur aufzulösen.
