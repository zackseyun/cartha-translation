  text: and he became afraid that he might not have enough[a], as once and twice before, for the expenses and the gifts that he had formerly given with a generous hand,
translation:
  language: de
  text: Da fürchtete er, dass ihm, wie schon ein- und zweimal zuvor[a], nicht genügend Mittel für die Ausgaben und die Geschenke zur Verfügung stünden, die er früher mit freigebiger Hand gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie einmal und zweimal“; die Wendung bezeichnet wiederholte frühere Gelegenheiten.'
    reason: Die ungewöhnliche griechische Ausdrucksweise kann streng zahlenmäßig missverstanden werden.
lexical_decisions:
- source_word: εὐλαβήθη
  choice: Da fürchtete er
  rationale: Das deponentisch gebrauchte Aoristverb bezeichnet hier die aufkommende Sorge vor einem möglichen finanziellen Engpass. „Fürchtete“ gibt dies natürlich wieder, ohne die andernorts mögliche Bedeutung ehrfürchtiger Scheu einzutragen.
- source_word: μὴ οὐκ ἔχῃ
  choice: er könnte nicht genug … haben
  rationale: Die Furchtkonstruktion bezeichnet die Möglichkeit, dass seine Mittel nicht ausreichen. „Genug“ macht die im Zusammenhang vorausgesetzte finanzielle Auskömmlichkeit deutlich.
- source_word: ὡς ἅπαξ καὶ δὶς
  choice: wie schon ein- und zweimal zuvor
  rationale: Die deutsche Wendung bewahrt die auffällige griechische Formulierung und lässt zugleich erkennen, dass frühere, wiederholte Gelegenheiten gemeint sind.
- source_word: δαπάνας
  choice: Ausgaben
  rationale: „Ausgaben“ ist der klare, gegenwärtige Ausdruck für die hier bezeichneten finanziellen Aufwendungen.
- source_word: δόματα
  choice: Geschenke
  rationale: Der allgemeine Begriff wahrt die Breite des griechischen Wortes, das Geschenke oder gewährte Zuwendungen bezeichnen kann.
- source_word: ἐδίδου
  choice: verteilt hatte
  rationale: Das Imperfekt beschreibt ein früher wiederholt erfolgtes Geben. „Verteilt hatte“ passt zu königlichen Geschenken und vermeidet die schwerfällige Wiederholung „Geschenke gegeben“.
- source_word: ἔμπροσθεν
  choice: früher
  rationale: Das Adverb ist hier zeitlich zu verstehen und verweist auf die vorherige Praxis des Königs.
- source_word: δαψιλῇ χειρί
  choice: mit großzügiger Hand
  rationale: Die bildhafte griechische Wendung bezeichnet freigebiges, reichliches Geben; die deutsche Formulierung bewahrt sowohl das Bild als auch den Sinn.
