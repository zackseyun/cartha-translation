  text: And he came near as far as the ascent of Beth-horon[a], and Judas went out to meet him with only a few men.
translation:
  language: de
  text: Und er kam bis zum Aufstieg von Bet-Horon[a]. Judas zog ihm mit nur wenigen Männern entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Namensform Μεθωρών bezeichnet den gewöhnlich Bet-Horon genannten Ort.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: rückte … vor
  rationale: Der Aorist von ἐγγίζω bezeichnet hier die Annäherung einer Streitmacht. „Rückte vor“ ist im erzählerisch-militärischen Zusammenhang natürlich, ohne über den griechischen Ausdruck hinaus eine Kampfhandlung zu behaupten.
- source_word: ἕως ἀναβάσεως
  choice: bis zum Aufstieg
  rationale: ἕως mit Genitiv bezeichnet die erreichte Grenze; ἀνάβασις meint hier den ansteigenden Weg beziehungsweise die Steigung. „Bis zum Aufstieg“ bewahrt sowohl den topografischen als auch den Begrenzungsaspekt.
- source_word: Μεθωρών
  choice: Bet-Horon
  rationale: Die griechische Form Μεθωρών verweist auf den bekannten Ort Bet-Horon. Die übliche deutsche Namensform ist verständlicher als eine mechanische Umschrift „Methoron“.
- source_word: ἐξῆλθεν
  choice: zog … entgegen
  rationale: ἐξέρχομαι bedeutet wörtlich „hinausgehen“. Zusammen mit εἰς συνάντησιν αὐτῷ gibt „zog ihm … entgegen“ die Bewegung idiomatisch wieder und passt zum militärischen Zusammenhang, ohne einen Angriff vorwegzunehmen.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: ihm … entgegen
  rationale: Die Wendung bezeichnet das Hinausgehen zur Begegnung mit jemandem. Die deutsche Konstruktion „jemandem entgegenziehen“ bildet dies knapp und natürlich ab.
- source_word: ὀλίγος
  choice: mit nur wenigen Männern
  rationale: Das prädikativ gebrauchte Singularadjektiv charakterisiert Judas beziehungsweise seine Begleitung als zahlenmäßig gering. Im Deutschen macht „mit nur wenigen Männern“ den im militärischen Kontext implizierten Bezug verständlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Rückte vor“ und „zog … entgegen“ vermitteln den militärischen Zusammenhang, ohne zusätzliche Einzelheiten einzutragen. Die Satzteilung erhöht die Lesbarkeit; die Abfolge der Handlungen bleibt gewahrt.
