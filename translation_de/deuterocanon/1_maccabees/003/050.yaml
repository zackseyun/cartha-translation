  text: And they cried out with a loud voice to heaven[a], saying, “What shall we do with these, and where shall we take them?”
translation:
  language: de
  text: 'Und sie schrien mit lauter Stimme zum Himmel und sagten: „Was sollen wir mit diesen tun, und wohin sollen wir sie wegbringen[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegführen“. Das griechische Verb betont das Wegführen oder Fortbringen vom gegenwärtigen Ort; im Kontext kann dies auch ein Fortbringen aus der gegenwärtigen Gefahr einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησαν
  choice: sie schrien
  rationale: Das Verb bezeichnet einen nachdrücklichen, dringlichen Ruf. „Sie schrien“ bewahrt die Stärke des Ausdrucks und passt zum Gebetsruf in diesem Zusammenhang.
- source_word: φωνῇ
  choice: mit lauter Stimme
  rationale: Wörtlich steht „mit Stimme“; zusammen mit βοάω dient die Wendung der Verstärkung. „Mit lauter Stimme“ gibt diese emphatische Wirkung in natürlichem Deutsch wieder.
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel
  rationale: Die Formulierung bezeichnet die Richtung ihres Hilferufs. „Zum Himmel“ wahrt den Wortlaut, ohne den nur implizierten göttlichen Adressaten ausdrücklich einzusetzen.
- source_word: Τί ποιήσωμεν
  choice: Was sollen wir … tun
  rationale: Der deliberative Konjunktiv drückt dringliche Ratlosigkeit aus; die deutsche Frage mit „sollen“ gibt dies treffend wieder.
- source_word: τούτοις
  choice: mit diesen
  rationale: Das substantivisch gebrauchte Demonstrativpronomen bleibt wie im Griechischen ohne ausdrückliches Bezugswort. Die etwas markierte Formulierung bewahrt diese Deixis und legt nicht eigenmächtig „Menschen“, „Frauen“ oder „Kinder“ fest.
- source_word: ἀπαγάγωμεν
  choice: sollen wir sie bringen
  rationale: Im Zusammenhang bezeichnet das Verb das Verbringen an einen anderen Ort, oft mit der Nuance des Wegführens. „Wohin sollen wir sie bringen?“ ist im Deutschen natürlich; die spezifischere Richtungsnuance wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Nur indirekt bezeichneter Adressat des Hilferufs
  choice: zum Himmel
  alternative: zu Gott im Himmel / zum Herrn
  rationale: Der griechische Text nennt ausdrücklich den Himmel, nicht Gott oder den Herrn. Dass es sich um einen Gebetsruf handelt, ist im Kontext erkennbar, soll aber nicht durch einen ergänzten Gottesnamen vereindeutigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der dringliche Gebetston bleibt erhalten; zugleich werden weder der nur implizierte Adressat noch das nicht ausdrücklich genannte Bezugswort von „diesen“ ergänzt. Der Fußnotenmarker steht unmittelbar bei der lexikalisch erläuterten Übersetzung.
