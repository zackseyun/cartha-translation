lexical_decisions:
- source_word: ἀπῆρεν
  choice: brach auf
  rationale: Das Verb bezeichnet hier das Aufbrechen von einem Lagerplatz; »brach auf« ist im Deutschen natürlich und passt zum kollektiven Subjekt »das Heerlager«.
- source_word: ἡ παρεμβολή
  choice: das Heerlager
  rationale: παρεμβολή bezeichnet ein Lager beziehungsweise die dort versammelte Streitmacht. »Heerlager« bewahrt den militärischen Zusammenhang und kann kollektiv als handelndes Subjekt stehen.
- source_word: παρενεβάλοσαν
  choice: sie schlugen ihr Lager auf
  rationale: Das Verb bezeichnet im militärischen Reisebericht das Beziehen eines Lagerplatzes. Die deutsche Wendung ist klar, idiomatisch und hält den Wechsel vom singularischen Kollektivsubjekt zum pluralischen Verb fest.
- source_word: κατὰ νότον
  choice: südlich von
  rationale: Die Wendung gibt hier die Lage des neuen Lagerplatzes im Verhältnis zu Emmaus an.
- source_word: Ἀμμαούμ
  choice: Emmaus
  rationale: »Emmaus« ist die im Deutschen herkömmliche Form dieses Ortsnamens.
