  source_fidelity: Die Wiedergabe von ἄρχων τῆς δυνάμεως Συρίας, ἤθροισεν, ἄθροισμα, ἐκκλησία und πιστῶν ist insgesamt quellentreu. Der abschließende genitivische Partizipialausdruck καὶ ἐκπορευομένων εἰς πόλεμον ist jedoch im Griechischen koordiniert mit πιστῶν und sollte nicht allein als Relativsatz zu „Getreuen“ eingeengt werden.
  naturalness: Die Sprache ist modern, klar und angemessen erzählerisch. Eine leichte Umstellung ermöglicht es, die koordinierte Struktur des griechischen Satzes im Deutschen verständlich wiederzugeben.
