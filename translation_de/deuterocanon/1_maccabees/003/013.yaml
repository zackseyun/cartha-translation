  yaml_path: translation/deuterocanon/1_maccabees/003/013.yaml
  text: And Seron[a], the commander of the army of Syria, heard that Judas had gathered a company and an assembly of the faithful with him[b], and of those going out to war.
translation:
  language: de
  text: Und Seron, der Befehlshaber der Streitmacht Syriens, hörte, dass Judas eine Schar und eine Versammlung von Getreuen[a] bei sich sowie von solchen gesammelt hatte, die zum Krieg auszogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Getreue“ kann hier sowohl Glaubenstreue als auch Loyalität gegenüber Judas und seiner Sache bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte
  rationale: Die schlichte narrative Bedeutung von ἀκούω bleibt erhalten; der Zusammenhang lässt zugleich das Hören einer Nachricht erkennen.
- source_word: ὁ ἄρχων τῆς δυνάμεως Συρίας
  choice: der Befehlshaber der Streitmacht Syriens
  rationale: ἄρχων bezeichnet hier einen militärischen Führer, δύναμις die bewaffnete Macht; „Streitmacht“ vermeidet die mögliche Überpräzisierung als reguläres Heer.
- source_word: ἤθροισεν
  choice: um sich gesammelt hatte
  rationale: Das Plusquamperfekt entspricht im Deutschen natürlich dem zeitlichen Verhältnis nach „hörte, dass“; „um sich“ gibt μεθʼ αὐτοῦ idiomatisch wieder.
- source_word: ἄθροισμα
  choice: eine Schar
  rationale: Das Wort bezeichnet eine zusammengebrachte Gruppe und kann im militärischen Zusammenhang eine kampfbereite Schar meinen, ohne eine formale Einheit vorauszusetzen.
- source_word: ἐκκλησίαν
  choice: eine Versammlung
  rationale: „Versammlung“ entspricht dem vorchristlich-jüdischen Kontext und vermeidet, die spätere institutionelle Bedeutung von „Kirche“ einzutragen.
- source_word: πιστῶν
  choice: von Getreuen
  rationale: „Getreue“ wahrt sowohl den Sinn der Zuverlässigkeit beziehungsweise Loyalität als auch den möglichen Anklang an Glaubenstreue.
- source_word: μεθʼ αὐτοῦ
  choice: um sich
  rationale: In Verbindung mit dem Sammeln ist dies eine natürliche deutsche Wiedergabe für die Gemeinschaft mit Judas.
- source_word: ἐκπορευομένων εἰς πόλεμον
  choice: die zum Krieg auszogen
  rationale: Die Wendung gibt das aktive Ausziehen zum Krieg wieder. Der Relativsatz schließt natürlich an die versammelten Getreuen an, ohne „Schlacht“ als engeren Begriff einzutragen.
theological_decisions:
- issue: Wiedergabe von ἐκκλησίαν im jüdischen militärisch-religiösen Kontext
  choice: Versammlung
  alternative: Gemeinde; Kirche
  rationale: „Versammlung“ bewahrt den zeitgenössischen Sinn einer einberufenen Gemeinschaft, ohne spätere christliche Institutionen in den Text hineinzulesen.
- issue: Bedeutung von πιστῶν
  choice: Getreue
  alternative: Gläubige; Loyalisten
  rationale: Die griechische Form kann Bundes- beziehungsweise Glaubenstreue und persönliche Loyalität bezeichnen. „Getreue“ hält beide Möglichkeiten offen.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Streitmacht“, „Schar“ und „Getreue“ sind verständlich, bewahren aber den leicht gehobenen historischen Ton. Die ungewöhnliche Doppelung „eine Schar und eine Versammlung“ wird als Merkmal des griechischen Textes beibehalten.
