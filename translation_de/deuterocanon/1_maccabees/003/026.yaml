  text: And his name reached even to the king[c][b][a], and every nation spoke of the battle lines of Judah.
translation:
  language: de
  text: Und sein Name gelangte sogar bis zum König, und alle Völker erzählten von den Schlachtordnungen des Judas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist schwer zu deuten und lautet wörtlich etwa: „Über jede Schlachtordnung des Judas erzählte jedes Volk.“ Sie kann sich auf Judas’ Schlachtordnungen beziehen oder allgemeiner auf seine Kämpfe und militärischen Unternehmungen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγγισεν ἕως τοῦ βασιλέως
  choice: drang bis zum König vor
  rationale: Die Wendung bewahrt das griechische Bild des Sich-Näherns, klingt im Deutschen aber natürlich und vermittelt, dass Judas’ Name beziehungsweise Ruf den König erreichte.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: sein Name
  rationale: Die wörtliche Wiedergabe bleibt verständlich; im Zusammenhang bezeichnet der Name zugleich Judas’ Bekanntheit oder Ruf.
- source_word: ὑπὲρ πᾶν παράταξιν
  choice: mehr als von jedem Heer
  rationale: ὑπέρ mit Akkusativ kann einen Vergleich ausdrücken, während παράταξις eine Schlachtordnung, Heeresaufstellung oder metonymisch ein Heer bezeichnet. Die Formulierung wahrt den Vergleich, ohne die schwierige griechische Wendung vorschnell auf bestimmte Siege oder Formationen Judas’ festzulegen.
- source_word: Ἰούδα
  choice: Judas
  rationale: Gemeint ist Judas Makkabäus; „Judas“ ist im Deutschen die übliche Namensform für diese Person.
- source_word: ἐξηγεῖτο πᾶν ἔθνος
  choice: jedes Volk erzählte
  rationale: ἐξηγέομαι kann „erzählen“ oder „berichten“ bedeuten. Das Imperfekt wird hier als fortdauerndes öffentliches Reden wiedergegeben; πᾶν ἔθνος ist distributiv „jedes Volk“.
theological_decisions:
- issue: Bezug und Sinn der schwierigen Wendung ὑπὲρ πᾶν παράταξιν Ἰούδα
  choice: Jedes Volk erzählte von Judas mehr als von jedem Heer.
  alternative: Jedes Volk berichtete über Judas in Verbindung mit jeder Schlachtordnung beziehungsweise jedem Feldzug.
  rationale: Die griechische Syntax ist stark verdichtet. Die Hauptfassung erhält die mögliche komparative Kraft von ὑπέρ und nimmt Ἰούδα als Gegenstand des Erzählens. Die Fußnote macht kenntlich, dass auch ein militärischer Bezug ohne klaren Vergleich erwogen werden kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Drang bis … vor“ erhält das Bild des griechischen Verbs, während „jedes Volk erzählte“ schlicht und allgemeinverständlich bleibt. Die ungewöhnliche militärische Vergleichswendung wird lesbar formuliert und ihre echte Unsicherheit in der Fußnote offengelegt.
