  - severity: low
    issue: „drang bis zum König vor“ ist für den Ruf bzw. Namen unnötig bildhaft und klingt leicht aggressiv.
    rationale: ἤγγισεν bezeichnet hier, dass sein Name bis zum König gelangte; „gelangte sogar bis zum König“ ist natürlicher und semantisch präzise.
