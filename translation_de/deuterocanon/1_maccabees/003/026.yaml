  source_fidelity: Die Hauptfassung „mehr als von jedem Heer“ erzwingt für ὑπὲρ πᾶν παράταξιν einen Vergleich, der im Kontext weder natürlich noch hinreichend gesichert ist, und verschiebt παράταξις von „Schlachtordnung/Kampfaufstellung“ zu „Heer“. Die wahrscheinlichste Lesung bezieht die Wendung auf Judas’ Schlachtordnungen bzw. Kämpfe. „Sein Name gelangte sogar bis zum König“ gibt τὸ ὄνομα αὐτοῦ und ἤγγισεν ἕως τοῦ βασιλέως idiomatisch und ohne Bedeutungsverlust wieder.
  naturalness: Die vorgeschlagene Fassung ist modernes, würdiges Standarddeutsch. „Alle Völker erzählten von den Schlachtordnungen des Judas“ ist deutlich verständlicher als die bisherige unmotivierte Vergleichsformulierung.
  terminology: „Judas“ ist für Judas Makkabäus die etablierte deutsche Namensform. „Schlachtordnungen“ bildet παράταξις eng ab; die Fußnote weist darauf hin, dass im Zusammenhang auch Berichte über seine Kämpfe bzw. militärischen Unternehmungen gemeint sein können.
