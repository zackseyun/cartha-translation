lexical_decisions:
- source_word: διῆλθεν
  choice: zog durch
  rationale: Das Verb bezeichnet das Durchqueren eines Gebiets beziehungsweise mehrerer Orte. „Zog durch“ ist im Deutschen natürlich und gibt die Bewegung durch die Städte treffend wieder.
- source_word: πόλεσιν Ἰούδα
  choice: die Städte Judas
  rationale: πόλις kann Stadt oder Ortschaft bedeuten; „Städte“ ist die direkte, kontextgerechte Wiedergabe. Der Genitiv Ἰούδα bezeichnet Juda als Gebiet, zu dem die Städte gehören.
- source_word: ἐξωλόθρευσεν
  choice: rottete … aus
  rationale: Das starke Verb bezeichnet vollständige Beseitigung durch Vernichtung. „Ausrotten“ wahrt diese Härte und verbindet sich idiomatisch mit der folgenden Ortsangabe.
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: ἀσεβής bezeichnet Menschen, die sich gegenüber Gott und der religiös-sittlichen Ordnung frevelhaft verhalten. „Gottlose“ bewahrt diesen religiösen Bedeutungsgehalt deutlicher als das allgemeinere „Böse“.
- source_word: ἐπʼ αὐτῆς
  choice: aus dem Land
  rationale: Das Pronomen bezieht sich am ehesten auf Juda als Land beziehungsweise Gebiet. Die ausdrückliche Wiedergabe „aus dem Land“ macht den Bezug im Deutschen verständlich, ohne einen neuen sachlichen Referenten einzuführen.
- source_word: ἀπέστρεψεν ὀργὴν
  choice: wandte … den Zorn … ab
  rationale: Die Wendung bedeutet, Zorn zurückzuwenden oder abzuwenden. „Den Zorn abwenden“ ist eine natürliche deutsche Entsprechung und bleibt nahe am griechischen Bild.
- source_word: ἀπὸ Ἰσραήλ
  choice: von Israel
  rationale: Die Präpositionalphrase bezeichnet Israel als die Gemeinschaft, von der der Zorn abgewendet wurde. Die knappe Form erhält den kollektiven Sinn.
theological_decisions:
- issue: Wessen Zorn von Israel abgewendet wurde
  choice: Der Haupttext nennt wie der griechische Text lediglich „den Zorn“, ohne Gott ausdrücklich als dessen Urheber zu bezeichnen.
  alternative: „Gottes Zorn“ oder allgemeiner eine über Israel gekommene feindliche Bedrohung beziehungsweise Not
  rationale: Im jüdisch-schriftlichen Zusammenhang liegt göttlicher Zorn nahe. Da Gott in diesem Vers jedoch nicht ausdrücklich genannt wird, bleibt die Formulierung offen und bewahrt die vorhandene theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zog durch“, „rottete … aus“ und „wandte … ab“ bewahren die knappe, kraftvolle Abfolge des griechischen Textes. Der zweite Satz beginnt zur besseren deutschen Lesbarkeit mit „So“, ohne eine zusätzliche kausale Aussage einzuführen.
