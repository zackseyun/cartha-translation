revisions:
- from: Und er sagte, dass diejenigen, die ein Haus bauten, die sich mit einer Frau verlobt hatten, die Weinberge pflanzten, und die Ängstlichen[a] jeder in sein Haus zurückkehren sollten, dem Gesetz entsprechend.[b]
  to: 'Und er sagte: Wer ein Haus baute, sich mit einer Frau verlobt hatte, Weinberge pflanzte oder ängstlich war[a], solle nach dem Gesetz in sein Haus zurückkehren.[b]'
  rationale: Die Revision beseitigt die fehlerhafte Kongruenz und bringt ἕκαστον idiomatisch durch den distributiven Singular „Wer ... solle ... in sein Haus zurückkehren“ zur Geltung. Das im Griechischen mit καί gereihte Verzeichnis bezeichnet alternative Gruppen von Personen, weshalb „oder“ im deutschen Wer-Satz die beabsichtigte Einzelanwendung verständlich ausdrückt, ohne den Sinn zu verändern. „Nach dem Gesetz“ ist die natürlichere knappe Wiedergabe von κατὰ τὸν νόμον.
