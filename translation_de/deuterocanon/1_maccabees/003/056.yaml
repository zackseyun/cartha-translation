  yaml_path: translation/deuterocanon/1_maccabees/003/056.yaml
  text: And he said that those building a house[a], and those betrothed to women, and those planting vineyards, and the fearful, should each return to his house[b], according to the law.
translation:
  language: de
  text: 'Und er sagte: Wer ein Haus baute, sich mit einer Frau verlobt hatte, Weinberge pflanzte oder ängstlich war[a], solle nach dem Gesetz in sein Haus zurückkehren.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verzagt“ beziehungsweise „feige“.'
    reason: lexical_alternative
  - marker: b
    text: „Nach dem Gesetz“ spielt wahrscheinlich auf die Befreiungen vom Kriegsdienst in 5. Mose 20,5–8 an.
    reason: cross_reference
lexical_decisions:
- source_word: οἰκοδομοῦσιν οἰκίαν
  choice: diejenigen, die ein Haus bauten
  rationale: Das Präsenspartizip bezeichnet die Gruppe der mit dem Hausbau Beschäftigten; im deutschen Erzählzusammenhang gibt der Präteritum-Nebensatz dies natürlich wieder, während das singularische Objekt erhalten bleibt.
- source_word: μνηστευομένοις γυναῖκας
  choice: die sich mit einer Frau verlobt hatten
  rationale: μνηστεύω bezeichnet die rechtlich-soziale Verlobung. Das distributive Singularwort „einer Frau“ macht im Deutschen deutlich, dass nicht jeder Mann mit mehreren Frauen verlobt war.
- source_word: φυτεύουσιν ἀμπελῶνας
  choice: die Weinberge pflanzten
  rationale: ἀμπελών bezeichnet einen Weinberg, nicht bloß einzelne Weinstöcke; der parallele Relativsatz bewahrt die Reihung der Gruppen.
- source_word: δειλοῖς
  choice: die Ängstlichen
  rationale: Die Bezeichnung lässt offen, ob bloße Furcht, Verzagtheit oder moralisch bewertete Feigheit gemeint ist, und vermeidet daher eine unnötige Verschärfung.
- source_word: ἀποστρέφειν ἕκαστον εἰς τὸν οἶκον αὐτοῦ
  choice: jeder in sein Haus zurückkehren sollten
  rationale: Der Infinitiv hängt als indirekte Anweisung von εἶπεν ab. „zurückkehren sollten“ gibt den Weisungscharakter idiomatisch wieder; „jeder ... sein“ bewahrt die maskuline distributive Form im militärischen Kontext.
- source_word: κατὰ τὸν νόμον
  choice: dem Gesetz entsprechend
  rationale: Die knappe Formulierung wahrt den Wortlaut und die mögliche Anspielung auf die gesetzlichen Befreiungen vom Kriegsdienst, ohne „Gesetz des Mose“ ausdrücklich einzutragen.
theological_decisions:
- issue: Soll der deuteronomische Hintergrund im Haupttext ausdrücklich benannt werden?
  choice: Nur „dem Gesetz entsprechend“ wiedergeben
  alternative: „nach dem Gesetz des Mose“ oder eine ausdrückliche Nennung von Deuteronomium 20
  rationale: Der griechische Text sagt lediglich „das Gesetz“. Die starke Anspielung kann in einer Fußnote erläutert werden, darf aber nicht als zusätzliche Benennung in den Haupttext eingehen.
- issue: Wiedergabe der maskulinen distributiven Formen
  choice: „jeder in sein Haus“
  alternative: „alle in ihr Zuhause“
  rationale: Der Zusammenhang betrifft männliche Kriegsteilnehmer, und die griechischen Formen sind maskulin und distributiv. Die gewählte Fassung erhält sowohl Geschlecht als auch Einzelbezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Relativsätze bilden die griechische Aufzählung natürlich nach; „dem Gesetz entsprechend“ bleibt bewusst knapp und lässt die Anspielung im Haupttext unausgeführt.
