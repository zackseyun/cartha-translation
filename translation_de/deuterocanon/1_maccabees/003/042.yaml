base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/042.yaml
  text: And Judas and his brothers saw that the troubles had multiplied[a], and that the forces were encamped within their borders[b]; and they recognized the orders of the kingdom that it had commanded to be carried out against the people for destruction and annihilation.
translation:
  language: de
  text: Und Judas und seine Brüder sahen, dass die Bedrängnisse[a] zugenommen hatten und die Streitkräfte in ihrem Gebiet lagerten. Sie erkannten auch die Befehle der Königsherrschaft[b], deren Ausführung sie gegen das Volk[c] zu dessen Verderben und Untergang angeordnet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Übel; gemeint sein können auch schlimme Zustände oder Nöte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich näher: des Königtums oder der königlichen Herrschaft; der griechische Text sagt nicht unmittelbar „des Königs“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: dem Volk; der Zusammenhang zeigt, dass die Befehle auf das Verderben und den Untergang des Volkes zielten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κακά
  choice: die Bedrängnisse
  rationale: Der substantivierte Plural bezeichnet hier die sich verschärfenden schlimmen Umstände und Nöte. „Bedrängnisse“ passt zum militärisch-politischen Zusammenhang, ohne den möglichen Grundsinn „Übel“ zu leugnen.
- source_word: αἱ δυνάμεις
  choice: die Streitkräfte
  rationale: Im Zusammenhang sind bewaffnete Truppen gemeint, nicht abstrakte Mächte.
- source_word: παρεμβάλλουσιν
  choice: lagerten
  rationale: Das historische Präsens beschreibt die feindlichen Streitkräfte als im Lager befindlich; das deutsche Präteritum fügt sich natürlich in die Erzählung ein.
- source_word: ἐν τοῖς ὁρίοις αὐτῶν
  choice: innerhalb ihrer Grenzen
  rationale: ὅρια kann Grenzgebiet, Grenzen oder Territorium bezeichnen. Die Formulierung bewahrt sowohl den räumlichen als auch den bedrohlichen Sinn.
- source_word: ἐπέγνωσαν
  choice: sie erkannten
  rationale: Das Verb bezeichnet ein Erfassen oder deutliches Erkennen und wird nicht auf bloßes Hören oder Erfahren verengt.
- source_word: τοὺς λόγους τῆς βασιλείας
  choice: welche Befehle die Königsherrschaft erteilt hatte
  rationale: λόγοι bezeichnet im Kontext amtliche Weisungen; βασιλεία benennt die königliche Herrschaft und nicht ausdrücklich die Person des Königs. Die Umformung mit „welche“ ergibt idiomatisches Deutsch.
- source_word: ἐνετείλατο ποιῆσαι
  choice: 'erteilt hatte: Sie sollten … ausgeführt werden'
  rationale: Die Konstruktion verbindet das Befehlen mit der verlangten Ausführung. Der deutsche Folgesatz macht diesen Vollzugscharakter klar, ohne einen zusätzlichen handelnden Täter zu benennen.
- source_word: τῷ λαῷ
  choice: gegen das Volk
  rationale: Der Dativ lautet formal „dem Volk“; durch die folgende Zweckangabe ist jedoch eindeutig eine feindliche, gegen das Volk gerichtete Handlung gemeint.
- source_word: εἰς ἀπώλειαν καὶ συντέλειαν
  choice: um es zu vernichten und völlig auszulöschen
  rationale: Die beiden Substantive bilden eine steigernde Verbindung und bezeichnen umfassenden Untergang. Die verbale Wiedergabe ist im modernen Deutsch klar und bewahrt die Intensivierung.
theological_decisions:
- issue: Wiedergabe von τῆς βασιλείας
  choice: der Königsherrschaft
  alternative: des Königs
  rationale: Der griechische Text verwendet das abstrakte βασιλεία und nennt nicht unmittelbar den König als Person. „Königsherrschaft“ bewahrt diese Unterscheidung und vermeidet eine unnötige Personalisierung.
- issue: Feindliche Bedeutung von τῷ λαῷ
  choice: gegen das Volk
  alternative: dem Volk
  rationale: Die formal mögliche Dativwiedergabe „dem Volk“ wäre im Deutschen missverständlich. Die anschließende Wendung εἰς ἀπώλειαν καὶ συντέλειαν zeigt, dass die befohlenen Maßnahmen auf die Vernichtung des Volkes zielen.
- issue: Verhältnis von ἀπώλεια und συντέλεια
  choice: vernichten und völlig auslöschen
  alternative: ins Verderben und ans Ende bringen
  rationale: Die Übersetzung wahrt die steigernde Doppelung, ohne συντέλεια hier mit einer theologischen Fachbedeutung wie „Vollendung“ aufzuladen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem griechischen Relativsatz behutsam gegliedert, damit das Subjekt der königlichen Befehle und deren feindliche Zielrichtung verständlich bleiben. Militärische Begriffe sind sachlich und ohne archaisierende Färbung wiedergegeben.
