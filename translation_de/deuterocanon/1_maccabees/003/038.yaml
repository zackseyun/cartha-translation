base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/038.yaml
  text: And Lysias chose Ptolemy son of Dorymenes[a], Nicanor, and Gorgias, mighty men among the king’s friends.
translation:
  language: de
  text: Und Lysias wählte Ptolemäus, den Sohn des Dorymenes, Nikanor und Gorgias aus, mächtige Männer aus dem Kreis der Freunde des Königs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Kreis der Hofleute des Königs“. Im hellenistischen Sprachgebrauch am Königshof konnte „Freunde des Königs“ eine höfische Rang- oder Amtsbezeichnung sein und musste nicht bloß persönliche Freundschaft ausdrücken.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: erwählte
  rationale: Das Verb bezeichnet ein gezieltes Auswählen. „Erwählte“ ist hier würdevoll und präzise, ohne wie „beauftragte“ eine im Verb nicht ausdrücklich enthaltene Amtseinsetzung vorauszusetzen.
- source_word: Πτολεμαῖον τὸν Δορυμένους
  choice: Ptolemäus, den Sohn des Dorymenes
  rationale: Der Artikel mit dem Genitiv eines Personennamens kennzeichnet Ptolemäus idiomatisch durch seine väterliche Abstammung. Die Wiedergabe mit „Sohn“ macht diese Beziehung im Deutschen klar.
- source_word: ἄνδρας δυνατοὺς
  choice: mächtige Männer
  rationale: ἄνδρας bezeichnet ausdrücklich Männer; δυνατούς kann Stärke, Fähigkeit und Einfluss ausdrücken. „Mächtige Männer“ bewahrt im militärisch-höfischen Zusammenhang sowohl den Einfluss als auch die Tatkraft.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: aus dem Kreis der Freunde des Königs
  rationale: Der Genitiv ordnet die drei Männer dem Kreis der königlichen „Freunde“ zu. „Aus dem Kreis“ ist natürliches Deutsch und bewahrt zugleich die wörtliche Bezeichnung, deren mögliche Funktion als hellenistischer Hoftitel in der Fußnote erläutert wird.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Eigennamen folgen den im Deutschen gebräuchlichen griechischen Formen. Die mögliche höfische Fachbedeutung von „Freunde“ bleibt im Haupttext erhalten und wird nicht stillschweigend vereindeutigt.
