base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/027.yaml
  text: When Antiochus the king heard these words[a], he became furiously angry, and he sent out and gathered all the forces of his kingdom, a very strong camp.
translation:
  language: de
  text: Als König Antiochus diese Worte hörte, geriet er in heftigen Zorn. Er sandte aus und versammelte alle Streitkräfte seines Königreichs – ein überaus starkes Heerlager.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein überaus starkes Heer« oder »eine überaus starke versammelte Streitmacht«. Das griechische Wort kann sowohl das Heerlager als auch die darin versammelte Streitmacht bezeichnen.'
    reason: Lexikalische Mehrdeutigkeit von παρεμβολή.
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Als
  rationale: Leitet den nächsten Vorgang temporal ein und entspricht natürlichem modernem Deutsch.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Bewahrt die konkrete Ausdrucksweise des Griechischen; gemeint sein kann zugleich die zuvor übermittelte Nachricht.
- source_word: ὠργίσθη θυμῷ
  choice: geriet in heftigen Zorn
  rationale: Die Verbindung von Verb und θυμός verstärkt den Ausdruck des Zorns. Die deutsche Wendung gibt diese Intensität idiomatisch wieder.
- source_word: ἀπέστειλεν
  choice: sandte Boten aus
  rationale: Das griechische Verb steht hier ohne ausdrücklich genanntes Objekt. Im Zusammenhang liegt das Aussenden von Boten oder Beauftragten zur Mobilmachung nahe; die Ergänzung wird durch eine Fußnote kenntlich gemacht.
- source_word: συνήγαγεν τὰς δυνάμεις πάσας τῆς βασιλείας αὐτοῦ
  choice: zog alle Streitkräfte seines Königreichs … zusammen
  rationale: δυνάμεις bezeichnet hier militärische Kräfte; »zusammenziehen« ist im militärischen Zusammenhang eine natürliche Wiedergabe von συνάγω.
- source_word: παρεμβολὴν ἰσχυρὰν σφόδρα
  choice: zu einem überaus starken Heerlager
  rationale: παρεμβολή kann sowohl ein Lager als auch die dort versammelte Streitmacht bezeichnen. »Heerlager« wahrt den konkreten Lagersinn, während »überaus stark« die deutliche Steigerung durch σφόδρα erhält.
