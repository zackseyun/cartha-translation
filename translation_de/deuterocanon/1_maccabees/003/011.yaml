  yaml_path: translation/deuterocanon/1_maccabees/003/011.yaml
  text: And Judas learned of it[a], and he went out to meet him and struck him down and killed him; and many fell wounded, and the rest fled.
translation:
  language: de
  text: Judas erfuhr davon, zog ihm entgegen, schlug ihn nieder und tötete ihn. Viele fielen verwundet[a], und die Übrigen flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Viele fielen als Verwundete.“ Das Griechische bezeichnet sie als Verwundete, nicht ausdrücklich als Getötete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: erfuhr davon
  rationale: Der Aorist von γινώσκω bezeichnet hier im Zusammenhang das Bekanntwerden der zuvor geschilderten Lage. Das im Deutschen nötige „davon“ gibt das im Griechischen unausgesprochene Bezugsobjekt wieder.
- source_word: ἐξῆλθεν εἰς συνάντησιν αὐτῷ
  choice: zog ihm entgegen
  rationale: Die Wendung bedeutet, jemandem entgegenzugehen. „Zog“ passt zum militärischen Zusammenhang, ohne die Formulierung vorschnell als „griff ihn an“ auszudeuten.
- source_word: ἐπάταξεν αὐτόν
  choice: schlug ihn nieder
  rationale: πατάσσω bezeichnet hier einen gewaltsamen Schlag. „Schlug ihn nieder“ bewahrt die Wucht der Handlung und bleibt von dem folgenden ausdrücklichen Töten unterscheidbar.
- source_word: ἀπέκτεινεν
  choice: tötete ihn
  rationale: Direkte, moderne und sachliche Wiedergabe von ἀποκτείνω.
- source_word: ἔπεσον τραυματίαι πολλοί
  choice: Viele fielen verwundet zu Boden
  rationale: τραυματίαι bezeichnet Verwundete, nicht ausdrücklich Tote. Die Formulierung erhält sowohl das Fallen als auch die Angabe ihres verwundeten Zustands.
- source_word: οἱ ἐπίλοιποι
  choice: die Übrigen
  rationale: Präzise und im erzählerischen Register natürliche Bezeichnung für den verbleibenden Teil der Truppe.
- source_word: ἔφυγον
  choice: flohen
  rationale: Direkte Wiedergabe des militärischen Rückzugs aus Furcht oder Niederlage.
