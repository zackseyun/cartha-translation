  text: And he hunted down the lawless[a], searching them out[b], and he burned those who troubled his people.
translation:
  language: de
  text: Und er verfolgte die Gesetzlosen, spürte sie auf[a] und verbrannte diejenigen, die sein Volk bedrängten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „suchte sie gründlich“ beziehungsweise „forschte nach ihnen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „setzte diejenigen, die sein Volk bedrängten, in Brand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: verfolgte
  rationale: Das Verb bezeichnet entschlossenes Nachsetzen oder Verfolgen. „Verfolgte“ wahrt diese Grundbedeutung, ohne die bildhafte Zuspitzung von „jagte“ zwingend einzutragen.
- source_word: ἀνόμους
  choice: die Gesetzlosen
  rationale: Die substantivierte Wiedergabe bewahrt die moralische und rechtliche Bedeutung von Menschen, die sich über die geltende, hier auch bundestheologisch geprägte Ordnung hinwegsetzen.
- source_word: ἐξερευνῶν
  choice: spürte sie auf
  rationale: Das Partizip beschreibt ein gründliches Suchen und Ausfindigmachen. Die finite Beiordnung ist im modernen Deutschen natürlich und gibt den engen Zusammenhang mit der Verfolgung wieder.
- source_word: παράσσοντας
  choice: die, die … in Unruhe versetzten
  rationale: Die Form bezeichnet Menschen, die das Volk stören, beunruhigen oder bedrängen. „In Unruhe versetzten“ bewahrt die Breite des Ausdrucks, ohne eine bestimmte Form der Schädigung festzulegen.
- source_word: ἐφλόγισεν
  choice: verbrannte
  rationale: Das Verb bezeichnet ein Verbrennen oder In-Brand-Setzen. Die knappe, drastische Wiedergabe entspricht der ungemilderten Aussage des griechischen Textes.
- source_word: τὸν λαὸν αὐτοῦ
  choice: sein Volk
  rationale: λαός bezeichnet hier die gemeinschaftlich und national verstandene Volksgemeinschaft; „sein Volk“ ist die natürliche und kontextgerechte deutsche Entsprechung.
theological_decisions:
- issue: Moralisch-rechtliche Bedeutung von ἀνόμους
  choice: die Gesetzlosen
  alternative: die Frevler; die Gesetzesbrecher
  rationale: „Die Gesetzlosen“ hält sowohl den moralischen als auch den rechtlichen beziehungsweise bundestheologischen Gehalt offen. „Gesetzesbrecher“ wäre enger, „Frevler“ stärker ausschließlich religiös gefärbt.
- issue: Drastik von ἐφλόγισεν
  choice: verbrannte
  alternative: setzte in Brand
  rationale: Der griechische Text formuliert die Gewalthandlung ohne Abschwächung. „Verbrannte“ erhält diese Härte; die alternative Wiedergabe lässt offen, ob stärker der Vorgang des Anzündens betont wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, erzählerischer Satzführung. Die Wiederholung der Verfolgungs- und Suchhandlung wird idiomatisch als „verfolgte …, spürte sie auf“ wiedergegeben. Die drastische Gewaltaussage wird weder erläutert noch abgeschwächt.
