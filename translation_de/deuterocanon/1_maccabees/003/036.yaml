  text: and to settle foreigners throughout all their territories[a], and to distribute their land by lot.
translation:
  language: de
  text: und Fremde[a] in allen ihren Gebieten anzusiedeln und ihr Land durch das Los zu verteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fremde Söhne“; gemeint sind landfremde Menschen beziehungsweise auswärtige Siedler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίσαι
  choice: anzusiedeln
  rationale: Der Aoristinfinitiv von κατοικίζω bezeichnet hier das gezielte Ansiedeln von Menschen in einem Gebiet; „anzusiedeln“ gibt den kausativen Sinn natürlich und präzise wieder.
- source_word: υἱοὺς ἀλλοτρίους
  choice: Fremde
  rationale: Wörtlich steht „fremde Söhne“. Im Zusammenhang bezeichnet die semitisch gefärbte Wendung jedoch auswärtige beziehungsweise landfremde Siedler. „Fremde“ ist im deutschen Haupttext verständlich und idiomatisch; die wörtliche Form wird in der Fußnote festgehalten.
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῶν
  choice: in ihrem ganzen Gebiet
  rationale: ὅρια bezeichnet hier nicht nur Grenzlinien, sondern den gesamten territorialen Bereich. Der griechische Plural mit πᾶσι wird im Deutschen natürlich durch den kollektiven Singular „im ganzen Gebiet“ wiedergegeben.
- source_word: κατακληρονομῆσαι
  choice: durch das Los zu verteilen
  rationale: Das Verb bezeichnet die Zuteilung als Besitz beziehungsweise Erbteil und schließt die Verteilung durch das Los ein. Die gewählte Formulierung bewahrt die für den Vorgang wichtige Los-Komponente.
- source_word: τὴν γῆν αὐτῶν
  choice: ihr Land
  rationale: γῆ meint das Land der zu verdrängenden Bevölkerung; „ihr Land“ ist direkt, klar und im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe der maskulinen Wendung υἱοὺς ἀλλοτρίους
  choice: Fremde im Haupttext, mit wörtlicher Angabe in der Fußnote
  alternative: fremde Söhne / Söhne von Fremden
  rationale: Die wörtliche Form bezeichnet in diesem Zusammenhang keine theologisch besondere Gruppe von Söhnen, sondern auswärtige Siedler. Eine ausschließlich wörtliche Wiedergabe wäre im modernen Deutschen missverständlich; die Fußnote bewahrt jedoch die sprachliche Gestalt und damit die genuine Nuance des Ausgangstextes.
translation_notes:
  register: Moderner, würdiger und gut verständlicher Erzählstil. Die Infinitivkonstruktion wird entsprechend dem griechischen Satzfragment beibehalten. „In ihrem ganzen Gebiet“ vermeidet das im Deutschen räumlich missverständliche „an allen ihren Grenzen“.
