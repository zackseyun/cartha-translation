lexical_decisions:
- source_word: ὡς δʼ ἂν ᾖ
  choice: Doch wie … auch sein mag
  rationale: Die Wendung leitet einen Vergleich mit unbestimmter Nuance ein. „Wie … auch sein mag“ gibt diese Offenheit im Deutschen natürlich wieder; δέ wird als „doch“ wiedergegeben.
- source_word: θέλημα
  choice: der Wille
  rationale: θέλημα bezeichnet hier Willen oder Absicht. „Wille“ ist prägnant, kontextgemäß und theologisch neutral.
- source_word: ἐν οὐρανῷ
  choice: im Himmel
  rationale: Der griechische Singular wird mit der im Deutschen üblichen Wendung „im Himmel“ wiedergegeben.
- source_word: οὕτως
  choice: so
  rationale: „So“ bildet das natürliche Gegenstück zur einleitenden Vergleichskonstruktion „wie … so“.
- source_word: ποιήσει
  choice: wird er handeln
  rationale: Das aktive Verb hat ein unausgesprochenes männliches Subjekt. „Handeln“ gibt ποιέω hier idiomatisch wieder, ohne ein im Griechischen nicht genanntes Objekt hinzuzufügen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ποιήσει
  choice: wird er handeln
  alternative: wird es geschehen
  rationale: Die griechische Form ist aktiv und verweist auf ein persönliches männliches Subjekt aus dem Kontext; eine unpersönliche passive Wiedergabe würde diese Handlungsfähigkeit abschwächen.
- issue: Zugehörigkeit des Willens
  choice: der Wille im Himmel
  alternative: sein Wille im Himmel
  rationale: Im griechischen Vers steht bei θέλημα kein Possessivpronomen. Die Formulierung bewahrt diese sprachliche Offenheit, obwohl der Zusammenhang den Willen Gottes nahelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Struktur „wie … so“ und die unbestimmte Nuance von ἄν bleiben erhalten; ein im Griechischen fehlendes Possessivpronomen wird nicht stillschweigend ergänzt.
