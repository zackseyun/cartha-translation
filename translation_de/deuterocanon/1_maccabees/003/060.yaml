  source_fidelity: Die Wiedergabe erhält die Vergleichsstruktur ὡς … οὕτως, die indefinite Nuance von ἄν, „Wille“ für θέλημα, „im Himmel“ für ἐν οὐρανῷ und das aktive, kontextuell erschlossene männliche Subjekt von ποιήσει. Die Satzpartikel δέ muss im Deutschen nicht mit einem potenziell zu starken „Doch“ abgebildet werden.
  naturalness: „Wie auch immer der Wille im Himmel sein mag“ ist im modernen Standarddeutsch deutlich idiomatischer als die gewählte Wortstellung „wie der Wille im Himmel auch sein mag“. Die anschließende Korrelativform „so wird er handeln“ bleibt würdevoll und klar.
  terminology: „Wille“ und „im Himmel“ sind sachgerecht und konfessionell neutral. „Handeln“ ist als objektloses aktives Prädikat möglich, wenngleich es ποιήσει etwas interpretierender als „tun“ auffasst; im Kontext ist es eine natürliche deutsche Wiedergabe.
