  text: As his will is in heaven[a], so he will do.
translation:
  language: de
  text: Wie auch immer der Wille im Himmel sein mag,[a] so wird er handeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausführlicher: „Was auch immer der Wille im Himmel sein mag, so wird er handeln.“'
