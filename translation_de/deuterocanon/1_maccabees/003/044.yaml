  text: And the assembly gathered to be ready for war[b][a], and to pray and ask for mercy and compassion.
translation:
  language: de
  text: Und die Versammlung kam zusammen, um für den Krieg bereit zu sein, zu beten und um Erbarmen und Mitgefühl zu bitten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠθροίσθη
  choice: kam zusammen
  rationale: Der formal passive Aorist kann hier das Zusammenkommen der Gruppe bezeichnen. „Kam zusammen“ ist im modernen Deutschen natürlich und bewahrt den kollektiven Vorgang.
- source_word: ἡ συναγωγή
  choice: die Versammlung
  rationale: Gemeint ist hier die versammelte Gemeinschaft, nicht ein Gebäude oder zwingend die spätere Institution der Synagoge. „Versammlung“ gibt den gemeinschaftlichen Sinn sachgerecht wieder.
- source_word: τοῦ εἶναι ἑτοίμους
  choice: um … bereit zu sein
  rationale: Der artikulierte Infinitiv drückt hier den Zweck des Zusammenkommens aus.
- source_word: εἰς πόλεμον
  choice: zum Krieg
  rationale: πόλεμος bezeichnet unmittelbar Krieg; die Formulierung hält den weiteren militärischen Zusammenhang offen und verengt ihn nicht auf eine einzelne Schlacht.
- source_word: τοῦ προσεύξασθαι
  choice: um zu beten
  rationale: Der zweite artikulierte Infinitiv steht parallel zum ersten und bezeichnet einen weiteren Zweck.
- source_word: αἰτῆσαι
  choice: zu bitten
  rationale: Im Gebetszusammenhang ist „bitten“ die natürliche deutsche Wiedergabe und verbindet sich idiomatisch mit den folgenden Objekten.
- source_word: ἔλεον
  choice: Erbarmen
  rationale: „Erbarmen“ bewahrt das religiöse Gewicht des griechischen Begriffs und passt natürlich zur Bitte im Gebet.
- source_word: οἰκτειρμούς
  choice: Mitgefühl
  rationale: Der Ausdruck bezeichnet Regungen oder Erweise des Mitgefühls. Die Wiedergabe unterscheidet ihn von ἔλεον, ohne eine künstlich altertümliche Mehrzahl zu verwenden.
theological_decisions:
- issue: Wiedergabe von συναγωγή im historischen Kontext
  choice: die Versammlung
  alternative: die Gemeinde; die Synagoge
  rationale: Der Vers beschreibt das versammelte Volk als Gemeinschaft, die sich auf Krieg und Gebet vorbereitet. „Versammlung“ vermeidet die anachronistische Festlegung auf ein Gebäude oder eine institutionell bestimmte Synagoge.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Zweckstruktur des Griechischen wird durch die wiederholte Konstruktion „um …“ sichtbar gehalten; zugleich bleibt der Satz für heutige Leser verständlich.
