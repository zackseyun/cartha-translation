base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/007.yaml
  text: And he embittered many kings[a], and he made Jacob glad by his deeds, and his remembrance is for blessing forever.
translation:
  language: de
  text: Und er verbitterte viele Könige und erfreute Jakob durch seine Taten; und bis in Ewigkeit ist sein Andenken zum Segen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und bis in Ewigkeit ist sein Andenken zum Segen.“ Auch möglich: „Sein Andenken ist für immer gesegnet.“'
    reason: Die griechische Segensformel ist nominal formuliert. Die Übersetzung bewahrt diese Form; die Alternative gibt ihren idiomatischen Sinn wieder.
lexical_decisions:
- source_word: ἐπίκρανεν
  choice: verbitterte
  rationale: Bewahrt das griechische Bild des Bittermachens und beschreibt treffend die Wirkung auf die feindlichen Könige.
- source_word: βασιλεῖς πολλούς
  choice: viele Könige
  rationale: Gibt die konkrete Bedeutung von βασιλεῖς unmittelbar wieder.
- source_word: ηὔφρανεν
  choice: erfreute
  rationale: Drückt die verursachte Freude natürlich und knapp aus.
- source_word: τὸν Ἰακώβ
  choice: Jakob
  rationale: Bewahrt den im Griechischen verwendeten Bundesnamen als kollektive Bezeichnung des Volkes, statt ihn deutend durch „Israel“ zu ersetzen.
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: durch seine Taten
  rationale: Versteht ἐν instrumental und gibt ἔργα im Zusammenhang natürlicher als „Taten“ wieder.
- source_word: τὸ μνημόσυνον αὐτοῦ
  choice: sein Andenken
  rationale: „Andenken“ bezeichnet im Deutschen angemessen die fortdauernde Erinnerung an eine Person und passt zur Segensformel.
- source_word: ἕως τοῦ αἰῶνος ... εἰς εὐλογίαν
  choice: bleibt für immer ein Segen
  rationale: Gibt die zeitliche Dauer und die nominale Segensformel in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Kollektiver Sinn von „Jakob“
  choice: „Jakob“ als Bundesname des Volkes beibehalten
  alternative: „Israel“
  rationale: Die Quellfassung nennt ausdrücklich Jakob. Die Beibehaltung wahrt den biblischen Sprachgebrauch und vermeidet eine stillschweigende Auslegung.
- issue: Segensformel im Schlusssatz
  choice: „sein Andenken bleibt für immer ein Segen“
  alternative: „sein Andenken ist für immer zum Segen“
  rationale: Die gewählte Fassung wahrt die nominale Aussage εἰς εὐλογίαν, während „bleibt“ die in ἕως τοῦ αἰῶνος ausgedrückte Fortdauer idiomatisch sichtbar macht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Jakob“ bewahrt bewusst den kollektiven Bundesnamen; „verbitterte“ erhält die kräftige Metaphorik des griechischen Verbs.
