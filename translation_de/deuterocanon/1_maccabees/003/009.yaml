  text: And he was renowned to the ends of the earth[b][a], and he gathered those who were perishing.
translation:
  language: de
  text: Und er wurde bis ans Ende der Erde bekannt[a], und er sammelte die, die vom Untergang bedroht waren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „er wurde bis ans Ende der Erde genannt“. Gemeint sein kann, dass sein Name oder sein Ruf weithin bekannt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die, die zugrunde gingen“ beziehungsweise „die dem Untergang Preisgegebenen“. Das griechische Partizip kann Menschen bezeichnen, die vernichtet werden, zugrunde gehen oder sich in solcher Gefahr befinden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠνομάσθη
  choice: wurde … bekannt
  rationale: Der Aorist Passiv von ὀνομάζω bedeutet wörtlich „wurde genannt“. Im Zusammenhang geht es darum, dass Judas’ Name beziehungsweise Ruf weithin bekannt wurde. Die gewählte Formulierung gibt diese idiomatische Bedeutung natürlich wieder, ohne ausdrücklich „berühmt“ zu sagen.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: bis ans Ende der Erde
  rationale: Die Wendung bezeichnet die äußersten Bereiche der Erde beziehungsweise des Landes. Der Singular des griechischen Textes bleibt erhalten; zugleich ist die deutsche Formulierung verständlich und würdevoll.
- source_word: συνήγαγεν
  choice: sammelte
  rationale: Der Aorist von συνάγω bezeichnet das Sammeln oder Zusammenbringen von Menschen. „Sammelte“ entspricht dem griechischen Ausdruck knapp und unmittelbar.
- source_word: ἀπολλυμένους
  choice: die, die dem Untergang entgegengingen
  rationale: Das präsentische Partizip von ἀπόλλυμι bezeichnet Menschen, die zugrunde gehen, vernichtet werden oder sich in akuter Gefahr befinden. Die Formulierung bewahrt den fortdauernden Vorgang und vermeidet die theologisch aufgeladene Wiedergabe „die Verlorenen“.
theological_decisions:
- issue: Mögliche theologische Deutung von ἀπολλυμένους als „die Verlorenen“
  choice: die, die dem Untergang entgegengingen
  alternative: die Verlorenen
  rationale: Im militärischen Zusammenhang bezeichnet das Partizip wahrscheinlich Menschen, denen Vernichtung oder Verderben drohte, nicht eine festgelegte geistliche Kategorie. Die Übersetzung hält diese sachliche und kontextuelle Offenheit fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzstruktur folgt dem griechischen Parallelismus; erklärungsbedürftige Bedeutungsbreiten werden in Fußnoten offengehalten.
