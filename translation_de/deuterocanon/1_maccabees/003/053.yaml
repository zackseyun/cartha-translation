lexical_decisions:
- source_word: πῶς δυνησόμεθα
  choice: Wie werden wir ... können
  rationale: Gibt die rhetorische Frage und die zukünftige Möglichkeit des griechischen Futurs natürlich und genau wieder.
- source_word: ὑποστῆναι κατὰ πρόσωπον αὐτῶν
  choice: ihnen standhalten
  rationale: Die Verbindung bezeichnet hier das Bestehen angesichts feindlicher Gegner. „Standhalten“ bringt den militärischen Zusammenhang idiomatisch zum Ausdruck, ohne den Ausgang des Kampfes vorwegzunehmen.
- source_word: ἐὰν μὴ
  choice: wenn ... nicht
  rationale: Gibt die negative Bedingung im Deutschen natürlich wieder; „es sei denn“ wäre hier weniger unmittelbar.
- source_word: σὺ βοηθήσῃς ἡμῖν
  choice: du uns ... hilfst
  rationale: Bewahrt die ausdrückliche, betonte Anrede an Gott und gibt das Verb mit seinem Dativobjekt schlicht und direkt wieder.
theological_decisions:
- issue: Direkte Anrede an Gott in einer militärischen Bitte
  choice: Die Abhängigkeit von Gottes Hilfe wird unmittelbar ausgesprochen, ohne Sieg oder Eingreifen näher auszugestalten.
  alternative: Wie können wir vor ihnen bestehen, wenn du uns nicht zu Hilfe kommst?
  rationale: Der griechische Text bekennt die Unfähigkeit ohne göttliche Hilfe, sagt aber weder ausdrücklich einen Sieg noch eine bestimmte Form der Hilfe voraus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung erhält den eindringlichen Charakter der rhetorischen Gebetsfrage; „standhalten“ ist im Konfliktzusammenhang klar und allgemein verständlich.
