review_pass:
  verdict: revise
  source_fidelity: 'Der Haupttext gibt den Wiederherstellungssinn von ἀναστήσωμεν τὴν καθαίρεσιν angemessen wieder. Doch „aus ihrer Verwüstung“ fügt ein im Griechischen nicht ausgedrücktes Possessivverhältnis hinzu und verändert die Konstruktion: καθαίρεσιν ist direktes Objekt von ἀναστήσωμεν und wird durch die Genitive „unseres Volkes und der heiligen [Dinge/Stätten]“ näher bestimmt. Eine Formulierung mit „Zustand“ gibt den idiomatischen Sinn ohne diese Zusatzinformation genauer wieder. „Heilige Stätten“ ist im Kontext gut vertretbar; die Fußnote muss die mögliche sachliche Weite von τῶν ἁγίων wahren.'
  naturalness: „Und einer sagte zum anderen“ ist möglich, klingt jedoch weniger präzise und etwas schwerfällig gegenüber dem distributiven „Jeder sagte zu seinem Nachbarn“. „Unser Volk und die heiligen Stätten aus ihrer Verwüstung wieder aufrichten“ ist verständlich, aber stilistisch und syntaktisch belastet. „Den Zustand der Verwüstung unseres Volkes und der heiligen Stätten wiederherstellen“ ist modernes, klares Standarddeutsch.
  terminology: '„Unser Volk“ und „heilige Stätten“ sind passend. Bei τῶν ἁγίων ist keine dogmatische Engführung vorzunehmen: Im Haupttext kann wegen des Kontextes „heilige Stätten“ stehen; die Fußnote sollte als Alternative „heilige Dinge“ nennen. Die Fußnote sollte nicht „wörtlich“ für eine deutsche Formulierung beanspruchen, die die griechische Wortstellung und Bildverbindung nur annähernd abbildet.'
  issues:
  - severity: medium
    issue: Zusatz „ihrer“ in „aus ihrer Verwüstung“
    rationale: Das griechische τοῦ λαοῦ ἡμῶν καὶ τῶν ἁγίων ist eine genitivische Bestimmung zu καθαίρεσιν; ein eigenständiges Possessivpronomen ist nicht vorhanden. Es ist zwar interpretativ naheliegend, aber für eine optimale Äquivalenz entbehrlich.
  - severity: low
    issue: Wiedergabe von ἕκαστος
    rationale: „Einer sagte zum anderen“ kann gegenseitiges Reden ausdrücken, schwächt aber den explizit distributiven Ausdruck ἕκαστος. „Jeder sagte zu seinem Nachbarn“ ist näher am Text und natürlich.
  - severity: low
    issue: Fußnotenformulierung „Wörtlicher auch“
    rationale: Die angeführte Alternative ist keine durchgehend wörtlichere deutsche Wiedergabe, sondern eine mögliche Nachbildung der ungewöhnlichen griechischen Verbindung. Eine sachliche Erläuterung der Bildverbindung ist genauer.
  revised_text: 'Und jeder sagte zu seinem Nachbarn: „Lasst uns den Zustand der Verwüstung unseres Volkes und der heiligen Stätten wiederherstellen.[a]“'
  revised_footnotes:
