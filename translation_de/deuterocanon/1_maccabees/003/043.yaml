  yaml_path: translation/deuterocanon/1_maccabees/003/043.yaml
  text: And each said to his neighbor[a], “Let us restore the ruin of our people and of the holy places.”
translation:
  language: de
  text: 'Und jeder sagte zu seinem Nachbarn: „Lasst uns den Zustand der Verwüstung unseres Volkes und der heiligen Stätten wiederherstellen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch steht wörtlich etwa „die Zerstörung unseres Volkes und der heiligen Dinge aufrichten“. Die Verbindung von „aufrichten“ mit einem Wort für „Niederreißen/Zerstörung“ meint die Wiederherstellung aus einem Zustand der Verwüstung. „Heilige Dinge“ kann hier auch die heiligen Stätten oder die Tempelheiligkeiten bezeichnen.
    reason: lexikalische Alternative und Mehrdeutigkeit des Bezugs
lexical_decisions:
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: einer sagte zum anderen
  rationale: Die gegenseitige Rede der Einzelnen wird idiomatisch und geschlechtsneutral wiedergegeben; der distributive Sinn von ἕκαστος bleibt erhalten.
- source_word: Ἀναστήσωμεν τὴν καθαίρεσιν
  choice: Lasst uns ... aus ihrer Verwüstung wieder aufrichten
  rationale: Die Verbindung des Verbs für „aufrichten“ mit dem Substantiv für „Niederreißen, Zerstörung“ bezeichnet die Wiederherstellung nach einer Verwüstung. Die deutsche Formulierung bewahrt das Bild des Aufrichtens, ohne die unnatürliche Wendung „die Zerstörung aufrichten“ zu bilden.
- source_word: τοῦ λαοῦ ἡμῶν
  choice: unser Volk
  rationale: λαός bezeichnet hier Israel als Volk; die attributive deutsche Fügung ist natürlich und entspricht dem griechischen Genitiv.
- source_word: τῶν ἁγίων
  choice: die heiligen Stätten
  rationale: Der substantivierte Plural bezeichnet im makkabäischen Zusammenhang wahrscheinlich den heiligen Bezirk beziehungsweise die Heiligtümer oder Tempelheiligkeiten. „Heilige Stätten“ wahrt den kultischen und pluralischen Bezug, ohne ihn auf ein einzelnes Gebäude zu verengen.
theological_decisions:
- issue: Bezug von τῶν ἁγίων
  choice: die heiligen Stätten
  alternative: die heiligen Dinge / das Heiligtum
  rationale: Der Zusammenhang von Entweihung und Wiederherstellung spricht für die Tempelheiligkeiten beziehungsweise den heiligen Bezirk. Da der griechische Plural auch „die heiligen Dinge“ bedeuten kann, wird diese echte Mehrdeutigkeit in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer nachbildbare griechische Bildverbindung wird im Haupttext natürlich formuliert und in der Fußnote transparent gemacht.
