  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den Vers insgesamt zuverlässig wieder: Jerusalems Unbewohntsein, das Niedertrampeln des Heiligtums, die fremde Besetzung der Zitadelle, der Verlust der Freude und das Verstummen der Instrumente bleiben erhalten. Bei ἐκ τῶν γενημάτων αὐτῆς ist „Kinder“ jedoch im Deutschen unnötig eng und kann Minderjährige nahelegen; „Nachkommen“ bewahrt den ungewöhnlichen Bezug auf die von Jerusalem Hervorgebrachten besser. Die elliptische Aussage über die Zitadelle und die Unterkunft für die Völker sollte syntaktisch klarer als Aussage über die Zitadelle formuliert werden.'
  naturalness: „Keiner von ihren Kindern ging ein und aus“ ist verständlich, aber weniger idiomatisch und durch „Kinder“ semantisch verengt. „Niemand von ihren Nachkommen ging ein oder aus“ ist natürliches modernes Standarddeutsch. Die gegenwärtige Apposition „in der Zitadelle, einer Unterkunft für die Völker“ kann zudem missverständlich die fremden Söhne als Unterkunft bezeichnen; ein Relativsatz klärt den Bezug.
  terminology: „Heiligtum“, „Zitadelle“, „Völker“, „Flöte“ und „Leier“ sind angemessen. „Söhne von Fremden“ hält die konkrete, im Deutschen leicht markierte Ausdrucksform von υἱοὶ ἀλλογενῶν vertretbar fest. Die Fußnoten zu γενήματα, Akra und Leier/Harfe sind sachlich und an den richtigen Stellen verankert.
