base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/045.yaml
  text: And Jerusalem was uninhabited like a wilderness[a]; there was no one entering or going out from her offspring, and the sanctuary was being trampled down, and sons of foreigners were in the citadel, a lodging place for the nations; and delight was taken away from Jacob[c][b], and flute and harp ceased.
translation:
  language: de
  text: Und Jerusalem war unbewohnt wie eine Wüste. Niemand von ihren Nachkommen[a] ging ein oder aus. Das Heiligtum wurde mit Füßen getreten, und Söhne von Fremden waren in der Zitadelle[b], die den Völkern als Unterkunft diente. Die Freude wurde Jakob genommen, und Flöte und Leier[c] verstummten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das griechische Wort „Hervorgebrachtes“ oder „Nachkommen“ bedeuten; gemeint sind hier wahrscheinlich die in Jerusalem Geborenen, also ihre Bewohner.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Akra“, der Name der befestigten Zitadelle in Jerusalem.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Harfe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀοίκητος
  choice: unbewohnt
  rationale: Das Adjektiv bezeichnet einen Ort ohne Bewohner. „Unbewohnt“ bewahrt den konkreten Sinn und lässt den anschließenden Vergleich mit der Wüste eigenständig wirken.
- source_word: ὡς ἔρημος
  choice: wie eine Wüste
  rationale: Die Wiedergabe erhält das ausdrückliche Vergleichsbild und ist im modernen Deutsch unmittelbar verständlich.
- source_word: ὁ εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: ging ein und aus
  rationale: Das Partizipienpaar beschreibt die gewöhnliche Bewegung von Menschen in eine Stadt hinein und aus ihr heraus. Die deutsche Wendung ist knapp und quellennah.
- source_word: ἐκ τῶν γενημάτων αὐτῆς
  choice: von ihren Kindern
  rationale: γενήματα bezeichnet wörtlich Hervorgebrachtes oder Nachkommen. „Ihre Kinder“ bewahrt die personifizierende Rede von Jerusalem und verweist wahrscheinlich auf die dort Geborenen beziehungsweise Bewohner, ohne das ungewöhnliche griechische Wort zu tilgen.
- source_word: ἁγίασμα
  choice: Heiligtum
  rationale: Der Begriff bezeichnet den heiligen Ort und wird in diesem Zusammenhang natürlich mit „Heiligtum“ wiedergegeben.
- source_word: καταπατούμενον
  choice: wurde mit Füßen getreten
  rationale: Die Formulierung erhält sowohl das körperliche Niedertreten als auch dessen entehrende Wirkung, ohne lediglich die Deutung „entweiht“ einzusetzen.
- source_word: υἱοὶ ἀλλογενῶν
  choice: Söhne von Fremden
  rationale: Die Übersetzung bewahrt die konkrete griechische Ausdrucksform, statt sie zum bloßen „Fremde“ zu glätten.
- source_word: ἄκρα
  choice: Zitadelle
  rationale: Gemeint ist die befestigte Höhe beziehungsweise Festung in Jerusalem. „Zitadelle“ vermittelt dies verständlich; der mögliche historische Name „Akra“ steht in der Fußnote.
- source_word: κατάλυμα
  choice: Unterkunft
  rationale: Das Wort bezeichnet einen Aufenthalts-, Wohn- oder Übernachtungsort. „Unterkunft“ ist natürlich und legt nicht unnötig fest, ob eine militärische Einquartierung gemeint ist.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: für die Völker
  rationale: Die schwierige Wendung wird im Anschluss an κατάλυμα als Bestimmung der Unterkunft verstanden. „Völker“ bleibt näher an ἔθνη als das stärker religionsgeschichtlich deutende „Heiden“.
- source_word: ἐξῆρθη τέρψις
  choice: Die Freude wurde … genommen
  rationale: Die Formulierung gibt den Entzug von τέρψις wieder. „Freude“ klingt im Deutschen natürlicher als „Vergnügen“, ohne den Gedanken zu überdeuten.
- source_word: αὐλὸς
  choice: Flöte
  rationale: αὐλός bezeichnet ein Blasinstrument, eine Flöte oder Pfeife. „Flöte“ ist die geläufigste moderne Entsprechung.
- source_word: κινύρα
  choice: Leier
  rationale: κινύρα bezeichnet ein Saiteninstrument vom Typ Leier beziehungsweise Harfe. „Leier“ ist instrumentenkundlich passend; „Harfe“ wird als mögliche Wiedergabe vermerkt.
theological_decisions:
- issue: Die ungewöhnliche Wendung ἐκ τῶν γενημάτων αὐτῆς
  choice: Keiner von ihren Kindern ging ein und aus
  alternative: Keiner von ihren Bewohnern ging ein und aus
  rationale: Die Hauptfassung bewahrt das Bild der von Jerusalem hervorgebrachten Kinder und damit die ungewöhnliche Lexik des griechischen Textes. Die wahrscheinlich gemeinte Einwohnerbevölkerung wird in der Fußnote erläutert, statt stillschweigend in den Text eingesetzt zu werden.
- issue: ἄκρα als Gattungsbezeichnung oder historischer Eigenname
  choice: Zitadelle
  alternative: Akra
  rationale: Die Bedeutungsübersetzung ist für heutige Leser verständlich und bezeichnet die befestigte Anlage. Die historisch mögliche Transkription bleibt in der Fußnote sichtbar.
- issue: Wiedergabe von ἔθνη
  choice: Völker
  alternative: Heiden
  rationale: „Völker“ wahrt die lexikalische Breite und vermeidet, eine stärker religiös definierte Gegenüberstellung einzutragen, als der Ausdruck für sich genommen verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, klaren Sätzen. Die Personifizierung Jerusalems wird durch „ihre Kinder“ bewahrt. „Mit Füßen getreten“ erhält die konkrete und entehrende Bildsprache; „verstummten“ gibt das Ende der Musik idiomatisch wieder.
