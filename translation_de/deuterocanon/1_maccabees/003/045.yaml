revisions:
- from: Und Jerusalem war unbewohnt wie eine Wüste. Keiner von ihren Kindern[a] ging ein und aus. Das Heiligtum wurde mit Füßen getreten, und Söhne von Fremden hielten sich in der Zitadelle[b] auf, einer Unterkunft für die Völker. Die Freude wurde Jakob genommen, und Flöte und Leier[c] verstummten.
  to: Und Jerusalem war unbewohnt wie eine Wüste. Niemand von ihren Nachkommen[a] ging ein oder aus. Das Heiligtum wurde mit Füßen getreten, und Söhne von Fremden waren in der Zitadelle[b], die den Völkern als Unterkunft diente. Die Freude wurde Jakob genommen, und Flöte und Leier[c] verstummten.
  rationale: Die Revision ersetzt lediglich die im Deutschen enger und weniger treffend wirkende Bezeichnung „Kinder“ durch „Nachkommen“ und klärt den syntaktischen Bezug der Unterkunftsaussage. Die schwierige Lexik von γενήματα bleibt im Haupttext erkennbar und wird weiterhin transparent in der Fußnote erläutert. Die historische und semantische Offenheit von ἔθνη wird mit „Völker“ bewahrt.
