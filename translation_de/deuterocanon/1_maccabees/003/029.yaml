  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch idiomatische Formulierungen wie »aufgebraucht« und »gering« natürlich lesbar. Mehrdeutigkeiten bei πληγή, τοῦ ἆραι und νόμιμα werden nicht dogmatisch aufgelöst, sondern in den Fußnoten offengelegt.
