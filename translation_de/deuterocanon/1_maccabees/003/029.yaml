  yaml_path: translation/deuterocanon/1_maccabees/003/029.yaml
  text: And he saw that the silver had run out from the treasuries[a], and that the taxes of the country were few because of the division and the blow that he had brought upon the land[b], by removing the customs that had existed from former days.
translation:
  language: de
  text: Und er sah, dass das Silber in den Schatzkammern aufgebraucht war und die Abgaben des Landes gering waren wegen der Zwietracht und des Unheils, das er über das Land gebracht hatte[a], indem er die seit frühester Zeit bestehenden Ordnungen aufhob[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »wegen der Spaltung und des Schlages, den er dem Land zugefügt hatte«. Die griechischen Wörter können politische Zwietracht sowie einen Schlag, eine Plage oder allgemeiner ein Unheil bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »um die seit frühester Zeit bestehenden Ordnungen aufzuheben«. Das Griechische kann hier Mittel beziehungsweise Folge oder Zweck ausdrücken. Mit den »Ordnungen« können überlieferte Satzungen, Gesetze oder Gebräuche gemeint sein.'
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: ἐξέλιπεν τὸ ἀργύριον ἀπὸ τῶν θησαυρῶν
  choice: das Silber in den Schatzkammern war aufgebraucht
  rationale: Bewahrt das konkrete »Silber« und den Plural »Schatzkammern«; »war aufgebraucht« gibt die eingetretene Erschöpfung der Geldmittel in natürlichem Deutsch wieder.
- source_word: οἱ φόροι τῆς χώρας ὀλίγοι
  choice: die Abgaben des Landes waren gering
  rationale: φόροι bezeichnet hier fiskalische Abgaben beziehungsweise Einkünfte. »Abgaben« ist präziser als das engere »Steuern«, während »gering« im Deutschen die verminderte Höhe natürlich ausdrückt.
- source_word: χάριν τῆς διχοστασίας
  choice: wegen der Zwietracht
  rationale: χάριν mit Genitiv ist kausal. »Zwietracht« erfasst die politische Spaltung oder innere Uneinigkeit, ohne den Ausdruck auf einen ausdrücklich genannten Bürgerkrieg festzulegen.
- source_word: πληγῆς ἧς κατεσκεύασεν ἐπὶ τὴν γῆν
  choice: des Unheils, das er über das Land gebracht hatte
  rationale: πληγή kann Schlag, Plage oder schweres Unglück bedeuten. »Unheil« ist im Kontext idiomatisch und lässt die genaue Art der Schädigung offen; die handelnde Verursachung bleibt erhalten.
- source_word: τοῦ ἆραι
  choice: indem er … aufhob
  rationale: Der substantivierte Infinitiv kann Mittel/Folge oder Zweck ausdrücken. Im Haupttext wird der Zusammenhang als begleitende beziehungsweise verursachende Handlung wiedergegeben; die Zwecklesart wird in der Fußnote bewahrt.
- source_word: τὰ νόμιμα ἃ ἦσαν ἀφʼ ἡμερῶν τῶν πρώτων
  choice: die seit frühester Zeit bestehenden Ordnungen
  rationale: νόμιμα umfasst überlieferte Satzungen, Gesetze und Gebräuche. »Ordnungen« hält diese Breite offen; »seit frühester Zeit« gibt die idiomatische zeitliche Wendung natürlich wieder.
