base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/002.yaml
  text: And all his brothers helped him[a], and all who had joined themselves to his father[b], and they fought the war of Israel with gladness.
translation:
  language: de
  text: Alle seine Brüder standen ihm bei, ebenso alle, die sich seinem Vater angeschlossen hatten. Voll Freude führten sie Israels Krieg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Voll Freude führten sie den Krieg für Israel.“ Wörtlicher: „Sie kämpften Israels Krieg mit Freude.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθουν
  choice: standen ihm bei
  rationale: Das Imperfekt bezeichnet fortdauernde Unterstützung. „Standen ihm bei“ ist im Deutschen natürlich und gibt den Beistandscharakter des Verbs wieder.
- source_word: πάντες οἱ ἀδελφοὶ αὐτοῦ
  choice: alle seine Brüder
  rationale: Die Formulierung bezeichnet hier konkret seine leiblichen Brüder und wird ohne Verallgemeinerung wiedergegeben.
- source_word: ὅσοι ἐκολλήθησαν τῷ πατρὶ αὐτοῦ
  choice: alle, die sich seinem Vater angeschlossen hatten
  rationale: Das Verb κολλάω bezeichnet ein Sich-Anschließen beziehungsweise enges Verbinden. Die Wiedergabe bewahrt den Gedanken bewusster Zugehörigkeit, ohne ausdrücklich eine weitergehende politische oder bundestheologische Deutung einzutragen.
- source_word: ἐπολέμουν τὸν πόλεμον
  choice: führten sie … Krieg
  rationale: Die griechische figura etymologica lässt sich im Deutschen mit „Krieg führen“ idiomatisch wiedergeben; das fortdauernde Imperfekt wird im Erzählzusammenhang durch das Präteritum ausgedrückt.
- source_word: Ἰσραήλ
  choice: Israels
  rationale: Der Genitiv wird formal als „Israels Krieg“ bewahrt und nicht eindeutig als „für Israel“ aufgelöst.
- source_word: μετʼ εὐφροσύνης
  choice: Voll Freude
  rationale: Die präpositionale Wendung bezeichnet freudige, bereitwillige Beteiligung. „Voll Freude“ klingt gegenwärtig und würdevoll.
theological_decisions:
- issue: Bedeutung von τὸν πόλεμον Ἰσραήλ
  choice: Israels Krieg
  alternative: den Krieg für Israel
  rationale: Der griechische Genitiv kann Zugehörigkeit beziehungsweise die Sache Israels ausdrücken. Die Hauptfassung bewahrt diese Offenheit und erweitert die Aussage nicht zu einem theologischen Begriff des heiligen Krieges.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung verhindert eine schwerfällige Reihung. Der Ausdruck „Israels Krieg“ bewahrt die knappe und theologisch nicht weiter erklärte Formulierung des Griechischen.
