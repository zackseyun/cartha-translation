  source_fidelity: 'Die Übersetzung gibt die drei koordinierten Aussagen des Griechischen vollständig und zutreffend wieder: die Unterstützung durch seine Brüder, den Anschluss weiterer Personen an seinen Vater und das freudige Führen des Krieges Israels. „Standen ihm bei“ ist eine natürliche Entsprechung für ἐβοήθουν; „sich seinem Vater angeschlossen hatten“ gibt ἐκολλήθησαν angemessen wieder. „Israels Krieg“ bewahrt die Offenheit des Genitivs in τὸν πόλεμον Ἰσραήλ, ohne ihn im Haupttext auf „für Israel“ festzulegen.'
