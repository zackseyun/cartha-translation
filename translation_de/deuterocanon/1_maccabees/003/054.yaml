lexical_decisions:
- source_word: ἐσάλπισαν
  choice: bliesen
  rationale: Das Verb bezeichnet das Blasen beziehungsweise Ertönenlassen einer Trompete. Mit dem ausdrücklich genannten Instrument ist „die Trompeten blasen“ im Deutschen natürlich und präzise.
- source_word: ταῖς σάλπιγξιν
  choice: die Trompeten
  rationale: Der griechische Dativ bezeichnet das Instrument. Die idiomatische deutsche Verbindung „die Trompeten blasen“ gibt dies ohne die schwerfällige Formulierung „mit den Trompeten“ wieder.
- source_word: ἐβόησαν
  choice: schrien
  rationale: Das Verb bezeichnet einen lauten Ruf oder Schrei. „Schrien“ bewahrt die stimmliche Intensität, ohne einen bestimmten Inhalt des Rufes hinzuzufügen.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die geläufige griechische Wendung wird konkret und zugleich natürlich wiedergegeben; „laut“ beschreibt hier die kräftige, weithin hörbare Stimme.
