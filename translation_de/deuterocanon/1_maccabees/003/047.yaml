lexical_decisions:
- source_word: περιεβάλλοντο σάκκους
  choice: legten Trauergewänder aus Sacktuch an
  rationale: Das griechische σάκκους bezeichnet hier aus grobem Sacktuch gefertigte Trauerkleidung. Die Wiedergabe macht die im Deutschen sonst missverständliche Wendung „Säcke anziehen“ natürlich und verständlich.
- source_word: σποδὸν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: streuten sich Asche auf den Kopf
  rationale: Gibt die konkrete Trauerhandlung idiomatisch wieder, ohne sie mit dem Anlegen des Sacktuchs zu verschmelzen.
- source_word: διέρρηξαν τὰ ἱμάτια αὐτῶν
  choice: zerrissen ihre Gewänder
  rationale: Bewahrt die traditionelle, sachlich genaue Bezeichnung der rituellen Trauerhandlung.
