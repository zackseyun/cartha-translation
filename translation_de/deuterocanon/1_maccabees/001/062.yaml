lexical_decisions:
- source_word: πολλοὶ ἐν Ἰσραήλ
  choice: viele in Israel
  rationale: Gibt die knappe Mengenangabe und ihre Zuordnung zu Israel ohne ergänzende Personengruppe wieder.
- source_word: ἐκραταιώθησαν
  choice: wurden stark
  rationale: Bewahrt das Stärke-Motiv des passiven Verbs und lässt die anschließende, ähnlich lautende Aussage als rhetorische Verstärkung stehen.
- source_word: ὠχυρώθησαν
  choice: festigten sich
  rationale: Gibt das Bild des Befestigens beziehungsweise Sich-Festmachens wieder und unterscheidet das Verb von ἐκραταιώθησαν.
- source_word: ἐν αὐτοῖς
  choice: innerlich
  rationale: Die Wendung bedeutet hier am ehesten „in sich selbst“ und bezeichnet ihre innere Festigkeit. „Untereinander“ wäre grammatisch möglich, würde aber eine gegenseitige Bestärkung deutlicher behaupten, als der griechische Wortlaut sie ausdrückt.
- source_word: τοῦ μὴ φαγεῖν
  choice: in dem Entschluss, nichts … zu essen
  rationale: Der artikulierte Infinitiv mit μή bezeichnet das Ziel beziehungsweise den Inhalt ihrer gefestigten Haltung; die deutsche Formulierung gibt diesen Zusammenhang idiomatisch wieder.
- source_word: κοινά
  choice: Entweihtes
  rationale: κοινός meint in diesem jüdischen Reinheitszusammenhang nicht bloß gewöhnliche Nahrung, sondern Speisen, die kultisch als profaniert oder unrein gelten. Das substantivierte „Entweihtes“ wahrt zugleich die unbestimmte Mehrzahl des Griechischen.
theological_decisions:
- issue: Ritueller Status von κοινά im Zusammenhang der jüdischen Speisegebote
  choice: Entweihtes
  alternative: 'Unreines; wörtlich: Gewöhnliches/Gemeines'
  rationale: „Entweihtes“ bringt den kultischen Gegensatz zwischen heilig und gemein zum Ausdruck, ohne κοινά kurzerhand mit dem technisch anders gebildeten ἀκάθαρτα gleichzusetzen. Die geläufige Wiedergabe „Unreines“ bleibt in der Fußnote sichtbar.
- issue: Bezug von ἐν αὐτοῖς
  choice: innerliche Festigung
  alternative: gegenseitige Festigung untereinander
  rationale: Das Pronomen kann in der gedrängten Formulierung unterschiedlich verstanden werden. Die Wiedergabe „innerlich“ folgt dem naheliegenden reflexiven Sinn, ohne eine ausdrücklich gemeinschaftliche Handlung in den Text einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die doppelte Aussage des griechischen Textes über Stärke und Festigung bleibt erhalten; „in dem Entschluss“ macht den im Deutschen sonst schwer verständlichen Anschluss des Infinitivs lesbar.
