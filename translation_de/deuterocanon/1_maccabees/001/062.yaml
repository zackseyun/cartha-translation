  source_fidelity: Der Entschluss, keine rituell unzulässige Nahrung zu essen, wird zutreffend erfasst, und die doppelte Stärkungsformel bleibt grundsätzlich sichtbar. Allerdings gibt „Doch“ das einfache καί ohne erkennbaren Anlass adversativ wieder. „innerlich“ legt außerdem eine von mehreren möglichen Deutungen von ἐν αὐτοῖς fest; die Konstruktion „festigten sich innerlich“ verschiebt zudem die beiden passiven Verben unnötig in eine reflexive Aussage.
  naturalness: „wurden stark und fest in ihrem Entschluss“ ist modernes, idiomatisches Deutsch und bewahrt die verdoppelnde Aussage des Griechischen besser als „wurden stark und festigten sich innerlich in dem Entschluss“.
  terminology: „Unreines“ ist im Kontext jüdischer Speisevorschriften die geläufige und verständliche Wiedergabe von κοινά. Die Fußnote soll klarstellen, dass das Wort wörtlich eher „Gemeines“ bezeichnet und hier rituell-profane bzw. unzulässige Speisen meint, ohne es mit einem anderen griechischen Reinheitsterm gleichzusetzen.
