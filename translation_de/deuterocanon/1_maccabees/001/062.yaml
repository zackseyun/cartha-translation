translation:
  language: de
  text: Und viele in Israel wurden stark und fest in ihrem Entschluss, nichts Unreines zu essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nichts Gemeines“. Das griechische Wort bezeichnet wörtlich das „Gemeine“ oder Profane und meint hier Nahrung, die nach jüdischem Gesetz rituell nicht zulässig war.'
