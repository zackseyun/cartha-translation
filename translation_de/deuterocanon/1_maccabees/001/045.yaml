  naturalness: Der Satz ist als Anschluss an den vorigen Kontext idiomatisch und registergerecht. Die kultischen Fachbegriffe sind im modernen Standarddeutsch verständlich und zugleich präzise. „Sabbate und Feste zu entweihen“ ist sprachlich klar und wahrt den feierlich-kultischen Charakter des Satzes.
  terminology: Die Terminologie ist konsistent mit deutschem biblischen Sprachgebrauch. „Schlachtopfer“ ist für θυσίας in der festen Aufzählung neben Brand- und Trankopfern vertretbar, ohne eine zusätzliche theologische Deutung einzutragen. „Heiligtum“, „Sabbate“ und „Feste“ entsprechen dem griechischen Wortlaut und Register.
