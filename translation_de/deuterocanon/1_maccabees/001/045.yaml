base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/045.yaml
  text: and to forbid whole burnt offerings and sacrifices and drink offerings from the sanctuary[a], and to profane Sabbaths and feasts[d][c][b],
translation:
  language: de
  text: und Brandopfer, Schlachtopfer und Trankopfer aus dem Heiligtum zu verbannen[a] und Sabbate und Feste zu entweihen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus dem Heiligtum fernzuhalten“; dem Sinn nach auch: „im Heiligtum zu verbieten“.'
    reason: Die Verbindung κωλῦσαι … ἐκ τοῦ ἁγιάσματος bezeichnet den Ausschluss der Opferhandlungen aus dem Heiligtum; die genaue räumliche Wiedergabe lässt im Deutschen mehr als eine Formulierung zu.
lexical_decisions:
- source_word: κωλῦσαι
  choice: zu verbannen
  rationale: Mit ἐκ τοῦ ἁγιάσματος bezeichnet das Verb hier den angeordneten Ausschluss dieser Opferhandlungen aus dem Heiligtum; „verbannen“ gibt diese Verbindung im Deutschen natürlich wieder.
- source_word: ὁλοκαυτώματα
  choice: Brandopfer
  rationale: Der etablierte deutsche Kultbegriff bezeichnet Opfer, die vollständig verbrannt werden, ohne die schwerfällige Form „Ganzbrandopfer“ zu erfordern.
- source_word: θυσίας
  choice: Schlachtopfer
  rationale: Der Ausdruck wahrt neben Brand- und Trankopfern eine eigenständige Opferkategorie und ist im alttestamentlich-kultischen Zusammenhang präziser als das allgemeine „Opfer“.
- source_word: σπονδὴν
  choice: Trankopfer
  rationale: „Trankopfer“ ist der verständliche und sachlich genaue deutsche Kultbegriff; der kollektive Singular ist im Deutschen in dieser Aufzählung natürlich.
- source_word: ἐκ τοῦ ἁγιάσματος
  choice: aus dem Heiligtum
  rationale: Die Wiedergabe bewahrt die griechische Präposition ἐκ und bezeichnet zusammen mit „verbannen“ den Ausschluss der Riten aus dem Bereich des Heiligtums.
- source_word: βεβηλῶσαι
  choice: zu entweihen
  rationale: Das Verb bedeutet, etwas Heiliges als gewöhnlich beziehungsweise unheilig zu behandeln; „entweihen“ ist im modernen Deutschen klar und kultisch passend.
- source_word: σάββατα
  choice: Sabbate
  rationale: Die Form bewahrt den ausdrücklichen Plural und bezeichnet die Sabbattage beziehungsweise ihre heilige Beachtung.
- source_word: ἑορτάς
  choice: Feste
  rationale: „Feste“ ist eine natürliche, würdige Bezeichnung für die religiösen Festtage des heiligen Kalenders.
theological_decisions:
- issue: Kultische Terminologie für Israels Tempeldienst
  choice: Die einzelnen Opferarten werden als „Brandopfer, Schlachtopfer und Trankopfer“ unterschieden.
  alternative: Die Reihe allgemein als „Opfer“ oder „Gottesdienst“ zusammenzufassen.
  rationale: Der griechische Text nennt konkrete, voneinander unterschiedene Kultpraktiken. Ihre Beibehaltung zeigt die gezielte Unterdrückung des Opferdienstes, ohne zusätzliche theologische Deutung einzutragen.
- issue: Bedeutung von ἐκ τοῦ ἁγιάσματος bei κωλῦσαι
  choice: „aus dem Heiligtum zu verbannen“
  alternative: „im Heiligtum zu verbieten“
  rationale: Die gewählte Fassung wahrt die räumliche Aussage von ἐκ und bringt zugleich idiomatisch zum Ausdruck, dass diese Riten dort nicht mehr stattfinden durften; die kontextuell mögliche Glättung mit „im“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Infinitivkonstruktion setzt den vorangehenden Satz fort. Etablierte kultische Begriffe sichern Präzision, während „entweihen“ und „Feste“ allgemein verständlich bleiben.
