  yaml_path: translation/deuterocanon/1_maccabees/001/039.yaml
  text: Her sanctuary was laid waste like a wilderness; her feasts were turned into mourning, her Sabbaths into reproach, her honor into contempt,
translation:
  language: de
  text: Ihr Heiligtum wurde verwüstet wie eine Einöde; ihre Feste wurden in Trauer verwandelt, ihre Sabbate in Schmach, ihre Ehre in Verachtung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἁγίασμα
  choice: Heiligtum
  rationale: Bezeichnet hier den heiligen Tempelbezirk Jerusalems; »Heiligtum« ist im Deutschen natürlich und bewahrt den kultischen Sinn.
- source_word: ἠρημώθη
  choice: wurde verwüstet
  rationale: Das Passiv bezeichnet die eingetretene Verödung und Zerstörung; »wurde verwüstet« gibt dies in heutigem Deutsch prägnant wieder.
- source_word: ὡς ἔρημος
  choice: wie eine Einöde
  rationale: Bewahrt den ausdrücklichen Vergleich und die Vorstellung eines verlassenen, öden Ortes, ohne das Wort auf eine Sandwüste zu verengen.
- source_word: αἱ ἑορταὶ
  choice: Feste
  rationale: Gemeint sind die religiösen Festzeiten Israels; »Feste« ist knapp, geläufig und dem tempelbezogenen Zusammenhang angemessen.
- source_word: ἐστράφησαν εἰς πένθος
  choice: verwandelten sich in Trauer
  rationale: Gibt den Übergang in einen gegensätzlichen Zustand natürlich wieder und bewahrt die bildhafte Umkehrung.
- source_word: τὰ σάββατα
  choice: Sabbate
  rationale: Der Plural bezeichnet die wiederkehrenden Sabbattage beziehungsweise ihre Begehung; »Sabbate« ist die direkte deutsche Entsprechung.
- source_word: εἰς ὀνειδισμόν
  choice: in Schmach
  rationale: ὀνειδισμός umfasst Beschimpfung, öffentliche Entehrung und Schande; »Schmach« bewahrt diesen Bedeutungsumfang knapp.
- source_word: τιμὴ
  choice: Ehre
  rationale: Bezeichnet das Ansehen und die Würde Jerusalems; »Ehre« ist die unmittelbarste Entsprechung.
- source_word: εἰς ἐξουδένωσιν
  choice: in Verachtung
  rationale: Das Substantiv bezeichnet das Geringschätzen oder Behandeln als wertlos; »Verachtung« gibt das Ergebnis idiomatisch wieder.
theological_decisions:
- issue: Bezug der femininen Possessivpronomen αὐτῆς
  choice: Durchgehend mit »ihr/ihre« wiedergegeben; der Bezug auf die personifizierte Stadt bleibt wie im Griechischen unausgesprochen.
  alternative: Den Bezug als »Jerusalems« oder »der Stadt« ausdrücklich benennen.
  rationale: Die Wiederholung der femininen Pronomen prägt den Klagecharakter und die Personifikation. Der Zusammenhang macht den Bezug verständlich, sodass keine erklärende Festlegung im Haupttext nötig ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelem Satzbau. »Einöde« und »Schmach« sind literarisch gehoben, aber allgemein verständlich und entsprechen dem Klagecharakter des Verses.
