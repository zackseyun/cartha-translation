  text: And they took the women and the children captive[a], and they took the livestock as plunder.
translation:
  language: de
  text: Und er nahm die Frauen und die Kinder gefangen; und sie nahmen das Vieh als Beute an sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie nahmen das Vieh in Besitz“ oder „sie erbten das Vieh“. Das griechische Verb bezeichnet gewöhnlich den Empfang eines Besitzes; hier steht es im Zusammenhang einer Eroberung und meint die Aneignung des Viehs als Beute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐχμαλώτευσεν
  choice: nahm … gefangen
  rationale: Das Verb bezeichnet das Gefangennehmen oder Wegführen als Kriegsgefangene. „Nahm … gefangen“ gibt den gewaltsamen Zusammenhang natürlich und präzise wieder; die Singularform wird mit „er“ bewahrt.
- source_word: τὰς γυναῖκας
  choice: die Frauen
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. In der Aufzählung der Verschleppten neben den Kindern ist die allgemeine Bedeutung „Frauen“ vorzuziehen.
- source_word: τὰ τέκνα
  choice: die Kinder
  rationale: τέκνα bezeichnet Kinder beziehungsweise Nachkommen ohne Beschränkung auf männliche Kinder.
- source_word: τὰ κτήνη
  choice: das Vieh
  rationale: κτήνη meint hier domestizierte Nutztiere beziehungsweise Tierbesitz. „Vieh“ ist im Deutschen prägnant und weiter als „Rinder“.
- source_word: ἐκληρονόμησαν
  choice: nahmen … als Beute an sich
  rationale: Das Verb bedeutet gewöhnlich „erben“ oder „als Besitz erhalten“. Im Eroberungszusammenhang bezeichnet es die Aneignung des Viehs; „als Beute an sich nehmen“ macht diese Funktion verständlich, während die ungewöhnliche Grundbedeutung in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der unvermittelte Wechsel vom Singular des ersten Verbs („er nahm“) zum Plural des zweiten („sie nahmen“) wird entsprechend dem griechischen Text bewahrt; vermutlich wechselt der Blick dabei vom Anführer zu seinen Leuten. Das Semikolon macht den Wechsel lesbar, ohne ihn einzuebnen.
