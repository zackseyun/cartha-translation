  yaml_path: translation/deuterocanon/1_maccabees/001/038.yaml
  text: And the inhabitants of Jerusalem fled because of them[a], and she became a dwelling place of foreigners; she became foreign to her offspring, and her children abandoned her.
translation:
  language: de
  text: Und die Bewohner Jerusalems flohen ihretwegen, und sie wurde zu einer Wohnstätte für Fremde. Sie wurde ihren Nachkommen[a] fremd, und ihre Kinder verließen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Erzeugnissen“. Das griechische Wort kann sowohl Nachkommen als auch das Hervorgebrachte beziehungsweise Erzeugnisse bezeichnen; die unmittelbare Parallele zu „ihre Kinder“ spricht hier für „Nachkommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγον
  choice: flohen
  rationale: Gibt die erzwungene Flucht als vergangenes Geschehen knapp und natürlich wieder.
- source_word: οἱ κάτοικοι Ἰερουσαλήμ
  choice: die Bewohner Jerusalems
  rationale: Bezeichnet die in Jerusalem lebenden Menschen in einem würdigen, allgemein verständlichen Register.
- source_word: διʼ αὐτούς
  choice: ihretwegen
  rationale: διά mit Akkusativ bezeichnet hier den Anlass beziehungsweise die Ursache der Flucht; der Rückbezug auf die zuvor genannten Bedränger bleibt erhalten.
- source_word: κατοικία ἀλλοτρίων
  choice: eine Wohnstätte für Fremde
  rationale: Bewahrt das konkrete Bild einer nun von Außenstehenden bewohnten Stadt; „Fremde“ nimmt zugleich das Motiv von ἀλλότριος auf.
- source_word: ἐγένετο ἀλλοτρία
  choice: sie wurde … fremd
  rationale: Erhält die auffällige Wiederholung des Wortstamms ἀλλοτρ- durch „Fremde/fremd“ und die Personifikation Jerusalems.
- source_word: τοῖς γενήμασιν αὐτῆς
  choice: ihren Nachkommen
  rationale: γενήματα kann Nachkommen oder Erzeugnisse bezeichnen. Der Parallelismus mit „ihre Kinder“ legt hier „Nachkommen“ nahe, ohne die Alternative zu verschweigen.
- source_word: τὰ τέκνα αὐτῆς
  choice: ihre Kinder
  rationale: Bewahrt das umfassende τέκνα und das Bild Jerusalems als Mutterstadt.
- source_word: ἐγκατέλειπον
  choice: verließen
  rationale: Drückt das Zurücklassen der Stadt in natürlichem modernem Deutsch aus; im Zusammenhang ist mehr als eine bloße Ortsbewegung gemeint.
theological_decisions:
- issue: Weibliche Personifikation Jerusalems
  choice: Jerusalem wird durchgehend mit „sie“ und „ihre“ personifiziert.
  alternative: Den Namen „Jerusalem“ wiederholen oder die Aussage unpersönlich formulieren.
  rationale: Die griechischen femininen Formen stellen Jerusalem als personifizierte Mutterstadt dar; dies trägt die Aussage über „ihre Kinder“ und soll nicht eingeebnet werden.
- issue: Bedeutung von γενήματα
  choice: „Nachkommen“ im Haupttext
  alternative: „Erzeugnisse“ beziehungsweise „Ertrag“
  rationale: Die unmittelbare Parallele zu „ihre Kinder“ spricht für Personen, doch die lexikalische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Fremde/fremd“ bildet die griechische Wortstammwiederholung ab; die weibliche Personifikation hält den klagenden Charakter und das Bild Jerusalems als Mutterstadt fest.
