  text: And they poured out innocent blood around the sanctuary, and they defiled the sanctuary.
translation:
  language: de
  text: Und sie vergossen unschuldiges Blut rings um das Heiligtum und entweihten das Heiligtum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέχεαν
  choice: vergossen
  rationale: Im Zusammenhang mit Blut ist „vergießen“ die natürliche deutsche Entsprechung und bewahrt zugleich das Bild des griechischen Verbs.
- source_word: αἷμα ἀθῷον
  choice: unschuldiges Blut
  rationale: Die feste biblische Wendung bezeichnet Blut, das zu Unrecht vergossen wird; „unschuldiges Blut“ ist im Deutschen klar und geläufig.
- source_word: κύκλῳ
  choice: rings um
  rationale: „Rings um“ gibt die räumliche Bedeutung prägnant wieder und lässt die Vorstellung einer Umgebung des Heiligtums erkennen.
- source_word: τοῦ ἁγιάσματος / τὸ ἁγίασμα
  choice: das Heiligtum
  rationale: ἁγίασμα bezeichnet hier den geheiligten Tempelbereich. Die identische Wiedergabe an beiden Stellen erhält die Wiederholung und den rhetorischen Nachdruck des Griechischen.
- source_word: ἐμόλυναν
  choice: entweihten
  rationale: Das Verb bezeichnet kultische Verunreinigung beziehungsweise Befleckung. „Entweihten“ klingt im modernen Deutsch natürlich und bringt im Zusammenhang mit einem Heiligtum den sakralen Frevel deutlich zum Ausdruck.
theological_decisions:
- issue: Kultische Bedeutung von ἁγίασμα
  choice: das Heiligtum
  alternative: die heilige Stätte; der Tempelbereich
  rationale: Der Kontext betrifft den heiligen Bereich des Jerusalemer Tempels. „Heiligtum“ wahrt den kultischen Sinn, ohne den griechischen Ausdruck räumlich stärker einzugrenzen, als es der Text verlangt.
- issue: Kultische Bedeutung von ἐμόλυναν
  choice: entweihten
  alternative: verunreinigten; befleckten
  rationale: „Entweihten“ vermittelt die kultisch-theologische Tragweite der Tat idiomatisch. Es beschreibt nicht bloß materielle Verschmutzung, sondern die Verletzung der Heiligkeit des Ortes.
translation_notes:
  register: Moderner, würdiger Erzählstil. Die zweimalige Nennung von „das Heiligtum“ wird entsprechend der griechischen Wiederholung beibehalten; auf ein Pronomen wird bewusst verzichtet.
