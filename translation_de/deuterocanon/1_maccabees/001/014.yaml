  text: And they built a gymnasium in Jerusalem according to the customs of the nations[a].
translation:
  language: de
  text: Und sie bauten in Jerusalem ein Gymnasion nach den Bräuchen der Völker.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Nichtjuden“. Wörtlich steht im Griechischen „der Völker“, eine verbreitete jüdische Bezeichnung für die nichtjüdischen Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: bauten
  rationale: Der Aorist bezeichnet schlicht den konkreten Bau der Einrichtung; „bauten“ ist natürlich und quellentreu.
- source_word: γυμνάσιον
  choice: Gymnasion
  rationale: Gemeint ist die spezifische hellenistische Bildungs- und Sporteinrichtung, nicht eine moderne Turnhalle. „Gymnasion“ bewahrt den historischen Begriff.
- source_word: ἐν Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Dies ist die natürliche deutsche Wiedergabe der Ortsangabe.
- source_word: κατὰ τὰ νόμιμα
  choice: nach den Bräuchen
  rationale: κατά bezeichnet hier die Übereinstimmung mit einem Maßstab; νόμιμα meint in diesem Zusammenhang überlieferte Sitten, Gebräuche oder Einrichtungen und nicht nur förmliche Gesetze.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: Die wörtliche Wiedergabe wahrt die jüdische Redeweise für die nichtjüdischen Völker, ohne die im Griechischen nicht ausdrücklich enthaltene abwertende Färbung von „Heiden“ einzutragen.
theological_decisions:
- issue: Wiedergabe von ἐθνῶν im jüdischen Kontrastzusammenhang
  choice: der Völker
  alternative: der Nichtjuden; der Heiden
  rationale: „Der Völker“ erhält die lexikalische Form und die genuine kontextuelle Spannung. Eine Fußnote erklärt, dass damit in dieser jüdischen Redeweise die nichtjüdischen Völker gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der historische Fachbegriff „Gymnasion“ vermeidet die irreführende moderne Vorstellung eines Gymnasiums als weiterführender Schule oder einer bloßen Turnhalle.
