  text: According to her glory[a], her dishonor was multiplied[b], and her exaltation was turned into mourning.
translation:
  language: de
  text: Entsprechend ihrem Ruhm[a] nahm ihre Schmach zu, und ihre Höhe[b] verwandelte sich in Trauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Im Verhältnis zu ihrem Ruhm nahm ihre Schande zu.“ Das griechische κατά kann Entsprechung oder Verhältnis ausdrücken; ἀτιμασμός kann auch „Schande“ oder „Erniedrigung“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Höhe“ kann bildlich auch ihre hohe Stellung, Hoheit oder Erhabenheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν δόξαν αὐτῆς
  choice: Wie groß ihr Ruhm gewesen war, so sehr
  rationale: κατά mit Akkusativ bezeichnet hier Entsprechung beziehungsweise Verhältnis. Die korrelative deutsche Formulierung gibt diesen Sinn natürlich wieder und bewahrt den Kontrast zum Anwachsen der Schmach.
- source_word: ἐπληθύνθη ἀτιμασμὸς αὐτῆς
  choice: mehrte sich ihre Schmach
  rationale: ἐπληθύνθη bezeichnet eine starke Zunahme. Das deutsche reflexive Verb ist natürlicher als ein wörtliches Passiv; „Schmach“ wahrt den gehobenen Ton und den Gegensatz zu „Ruhm“.
- source_word: τὸ ὕψος αὐτῆς
  choice: ihre Erhabenheit
  rationale: ὕψος bezeichnet wörtlich Höhe, hier jedoch bildlich den hohen, ruhmvollen Stand der Stadt. „Erhabenheit“ bewahrt das Höhenbild, ohne es auf eine einzige sachliche Deutung zu verengen.
- source_word: ἐστράφη εἰς πένθος
  choice: verwandelte sich in Trauer
  rationale: Die Wendung bezeichnet eine Umkehr beziehungsweise Verwandlung in einen neuen Zustand. „Trauer“ gibt πένθος in diesem poetischen Zusammenhang idiomatisch wieder.
