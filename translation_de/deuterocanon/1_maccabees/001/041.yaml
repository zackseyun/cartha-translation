  yaml_path: translation/deuterocanon/1_maccabees/001/041.yaml
  text: And the king wrote to all his kingdom that all should become one people[b][a],
translation:
  language: de
  text: Und der König schrieb an sein ganzes Reich, alle sollten zu einem einzigen Volk werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „alle sollten ein Volk sein“. Die Verbindung mit „zu“ kann hier die vom König angeordnete Vereinheitlichung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Die gewöhnliche Bedeutung von γράφω wird beibehalten. Der königliche und anordnende Charakter ergibt sich aus Zusammenhang und Inhalt, ohne das Verb mit „erließ einen Erlass“ zu überdeuten.
- source_word: πάσῃ τὴν βασιλεία αὐτοῦ
  choice: an sein ganzes Reich
  rationale: Die ungewöhnliche beziehungsweise textlich schwierige Konstruktion bezeichnet den gesamten Herrschaftsbereich als Adressaten der schriftlichen Anordnung. Diese Wiedergabe ist im Deutschen natürlich und bewahrt den umfassenden Sinn.
- source_word: εἶναι πάντας
  choice: alle sollten … werden
  rationale: Der Infinitiv gibt den Inhalt der königlichen Anordnung wieder. „Sollten“ trägt dem gebietenden Zusammenhang Rechnung; „werden“ bringt zusammen mit εἰς die angestrebte Veränderung zum Ausdruck.
- source_word: εἰς λαὸν ἕνα
  choice: zu einem einzigen Volk
  rationale: εἰς bezeichnet hier das Hineingelangen in einen einheitlichen Zustand. „Volk“ bewahrt den ethnisch-sozialen beziehungsweise politischen Sinn von λαός, während „einziges“ die beabsichtigte Vereinheitlichung idiomatisch hervorhebt.
theological_decisions:
- issue: Politisch-ethnische Vereinheitlichung durch λαός
  choice: zu einem einzigen Volk
  alternative: zu einer einzigen Nation
  rationale: Der Vers beschreibt die assimilierende Politik des Königs und keine Aussage über Gottes Bundesvolk. „Volk“ gibt den breiten sozialen und ethnisch-politischen Sinn wieder, ohne den modernen staatsrechtlichen Klang von „Nation“ einzutragen.
- issue: Statisches Sein oder angestrebte Veränderung bei εἶναι … εἰς
  choice: werden
  alternative: sein
  rationale: Das griechische εἶναι kann formal mit „sein“ wiedergegeben werden; die Verbindung mit εἰς λαὸν ἕνα legt jedoch eine Bewegung hin zu einem vereinheitlichten Zustand nahe. Die Fußnote bewahrt die wörtlichere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der schlichten griechischen Erzählweise; „an sein ganzes Reich“ ist natürlicher als eine formal mögliche, aber missverständliche Wiedergabe mit „dem ganzen Reich“. Der Fußnotenmarker steht unmittelbar nach der betroffenen Aussage.
