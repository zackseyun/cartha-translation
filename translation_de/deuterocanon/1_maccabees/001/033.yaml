  text: And they fortified the city of David with a great and strong wall[a], with strong towers, and it became a citadel for them.
translation:
  language: de
  text: Und sie bauten die Davidsstadt mit einer großen und starken Mauer und starken Türmen, und sie wurde ihnen zur Zitadelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie wurde ihnen zur Akra.« Das griechische Wort ἄκρα kann als Gattungsbezeichnung (»Zitadelle, Festung«) oder als Name der seleukidischen Festung verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: bauten … aus
  rationale: οἰκοδομέω bedeutet grundsätzlich »bauen« oder »errichten«. Mit der Stadt als Objekt und den anschließend genannten Mauern und Türmen bezeichnet es hier ihren baulichen Ausbau; »bauten … aus« bewahrt den Bauaspekt und klingt im Deutschen natürlicher als »bauten die Stadt mit einer Mauer«.
- source_word: τὴν πόλιν Δαυείδ
  choice: die Davidstadt
  rationale: Die geläufige deutsche Ortsbezeichnung gibt die griechische Wendung »Stadt Davids« knapp und eindeutig wieder.
- source_word: τείχει μεγάλῳ καὶ ὀχυρῷ
  choice: mit einer großen, starken Mauer
  rationale: Der Dativ bezeichnet die beim Ausbau verwendete Befestigungsanlage. μέγας wird mit »groß«, ὀχυρός im militärischen Zusammenhang mit »stark« wiedergegeben.
- source_word: πύργοις ὀχυροῖς
  choice: und starken Türmen
  rationale: Die Türme gehören parallel zur Mauer zu den Befestigungswerken; »stark« bewahrt die Wiederholung von ὀχυρός, ohne eine zusätzliche Deutung einzuführen.
- source_word: ἐγένετο αὐτοῖς εἰς ἄκραν
  choice: sie wurde ihnen zur Zitadelle
  rationale: ἄκρα kann eine befestigte Höhe, Festung oder Zitadelle bezeichnen. »Zitadelle« trifft den städtisch-militärischen Sinn; die mögliche Lesart als historischer Eigenname wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Bauten … aus« folgt dem Grundsinn des Verbs, während Mauer und Türme den militärischen Charakter ausdrücklich vermitteln. Die Satzstruktur wahrt die Abfolge und Wiederholung des griechischen Textes.
