  text: And he entered Egypt with a heavy force, with chariots and elephants and horsemen and a great fleet.
translation:
  language: de
  text: Und er zog mit einer starken Streitmacht in Ägypten ein, mit Streitwagen, Elefanten und Reitern sowie einer großen Flotte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer großen Heeresmacht“ oder „einem großen Expeditionsheer“. Das griechische Wort kann auch allgemeiner militärische Ausrüstung oder ein bewaffnetes Unternehmen bezeichnen; im Zusammenhang dieses Feldzugs ist „Flotte“ eine naheliegende Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: zog … nach Ägypten
  rationale: Das Verb bedeutet wörtlich „ging hinein/gelangte hinein“. Im Zusammenhang eines Feldzugs gibt „zog nach Ägypten“ die Bewegung natürlich wieder, ohne das stärker deutende „fiel ein“ einzutragen.
- source_word: ὄχλῳ βαρεῖ
  choice: mit einer schlagkräftigen Streitmacht
  rationale: ὄχλος bezeichnet hier eine Truppenmacht; βαρύς meint in diesem militärischen Zusammenhang eher ihre Stärke beziehungsweise ihr Gewicht als bloß ihre Größe. „Schlagkräftig“ vermittelt diese Funktion idiomatisch.
- source_word: ἅρμασιν
  choice: Streitwagen
  rationale: Im militärischen Kontext bezeichnet ἅρματα Wagen für den Krieg. „Streitwagen“ ist im Deutschen eindeutig und geläufig.
- source_word: ἐλέφανσιν
  choice: Elefanten
  rationale: Direkte Wiedergabe; dass es sich um Kriegselefanten handelt, ergibt sich bereits aus der Aufzählung militärischer Kräfte.
- source_word: ἱππεῦσιν
  choice: Reitern
  rationale: ἱππεῖς bezeichnet berittene Männer beziehungsweise Kavalleristen. „Reiter“ bleibt nahe an der griechischen Ausdrucksform und ist verständlich.
- source_word: στόλῳ μεγάλῳ
  choice: einer großen Flotte
  rationale: στόλος kann Ausrüstung, eine bewaffnete Unternehmung oder insbesondere eine Flotte bezeichnen. Im Kontext des Ägyptenfeldzugs und neben den ausdrücklich genannten Landstreitkräften ist „Flotte“ eine gut begründete, aber nicht alternativlose Wiedergabe.
