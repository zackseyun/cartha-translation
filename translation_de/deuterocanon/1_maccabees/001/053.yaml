translation:
  language: de
  text: Und sie drängten Israel in Verstecke, in jeden seiner Zufluchtsorte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an verborgene Orte, in jeden seiner Zufluchtsorte“. Der griechische Ausdruck kann sowohl die Orte als auch den Zustand des Verborgenseins hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: sie trieben
  rationale: Der Aorist Medium von τίθημι bezeichnet hier, dass Israel an einen Ort beziehungsweise in eine Lage gebracht wurde. „Sie trieben“ gibt im Verfolgungskontext die erzwungene Bewegung natürlich wieder, ohne die Aussage weiter auszudeuten.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: „Israel“ bewahrt die kollektive Singularform des griechischen Textes und bezeichnet das Volk als Ganzes.
- source_word: ἐν κρυφίοις
  choice: in die Verstecke
  rationale: Das substantivierte Adjektiv bezeichnet verborgene Orte. Die richtungsbezogene Formulierung ist im Deutschen nach „trieben“ idiomatisch und vermittelt zugleich den Gedanken des Sichverbergens.
- source_word: ἐν παντὶ φυγαδευτηρίῳ
  choice: in all seine Zufluchtsstätten
  rationale: φυγαδευτήριον bezeichnet einen Flucht- oder Zufluchtsort. Der griechische Singular mit πᾶς lässt sich bei einer Gesamtheit im Deutschen natürlich mit „all seine Zufluchtsstätten“ wiedergeben.
- source_word: αὐτῶν
  choice: seine
  rationale: Das griechische Pluralpronomen greift Israel dem Sinn nach als Kollektiv auf. Im Deutschen stimmt „seine“ grammatisch mit dem Namen „Israel“ überein und wahrt die Zugehörigkeit der Zufluchtsstätten zu diesem Volk.
