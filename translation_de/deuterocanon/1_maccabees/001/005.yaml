  text: And after these things he fell upon his bed[a], and knew that he was dying.
translation:
  language: de
  text: Danach legte er sich aufs Bett[a] und erkannte, dass er im Sterben lag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fiel aufs Bett“; sinngemäß auch: „musste sich ins Bett legen“. Das Griechische verwendet eine körperlich-konkrete Wendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Danach
  rationale: Gibt die zeitliche Folge knapp und im modernen Deutschen natürlich wieder; das wörtlichere „nach diesen Dingen“ wäre unnötig schwerfällig.
- source_word: ἔπεσεν
  choice: legte er sich
  rationale: Das griechische Verb bedeutet wörtlich „fiel“, bezeichnet im Zusammenhang aber idiomatisch das Sich-zur-Ruhe- beziehungsweise Zu-Bett-Legen bei schwerer Krankheit. Die konkrete Ausdrucksweise wird in der Fußnote bewahrt.
- source_word: ἐπὶ τὴν κοίτην
  choice: aufs Bett
  rationale: κοίτη bezeichnet hier ein Bett oder Lager. „Aufs Bett“ gibt die Bewegungsrichtung von ἐπί mit Akkusativ wieder, ohne einen im Griechischen nicht ausdrücklich vorhandenen Possessivartikel einzuführen.
- source_word: ἔγνω
  choice: erkannte
  rationale: Der Aorist bezeichnet hier das Eintreten der Erkenntnis. „Erkannte“ bildet dies genauer ab als das eher statische „wusste“.
- source_word: ἀποθνήσκει
  choice: im Sterben lag
  rationale: Das Präsens beschreibt einen andauernden Sterbevorgang. „Im Sterben lag“ gibt diesen Aspekt im Rahmen der Vergangenheitsnarration natürlich wieder.
