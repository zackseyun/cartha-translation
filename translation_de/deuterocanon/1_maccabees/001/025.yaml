translation:
  language: de
  text: Und große Trauer kam über Israel, an allen seinen Orten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „überall, wo sie lebten“. Wörtlich: „an jedem ihrer Orte“. Das Griechische hebt hervor, dass sich die Trauer über sämtliche von Israel bewohnten oder ihm zugehörigen Orte ausbreitete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: kam
  rationale: In Verbindung mit ἐπί gibt „kam über“ die griechische Wendung natürlich wieder und bewahrt den Gedanken, dass die Trauer Israel erfasste.
- source_word: πένθος μέγα
  choice: große Trauer
  rationale: „Trauer“ umfasst den gemeinschaftlichen Schmerz und das Klagen infolge des Unheils; „große“ entspricht der schlichten Verstärkung durch μέγα.
- source_word: ἐπὶ Ἰσραήλ
  choice: über Israel
  rationale: „Über Israel“ bewahrt gegenüber dem bloßen „in Israel“ die Richtung und Wucht dessen, was das Volk erfasste.
- source_word: ἐν παντὶ τόπῳ αὐτῶν
  choice: an allen ihren Orten
  rationale: Die Wiedergabe erhält sowohl die distributive Aussage als auch das Possessivpronomen und vermeidet die Verflachung zu „überall“.
