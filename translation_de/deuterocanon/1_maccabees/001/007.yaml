lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: regierte
  rationale: Der Aorist von βασιλεύω bezeichnet hier die Ausübung der Königsherrschaft. „Regierte“ ist im deutschen historischen Erzählstil knapp und natürlich.
- source_word: ἔτη δώδεκα
  choice: zwölf Jahre
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer. Im Deutschen kann die Dauer nach „regierte“ idiomatisch ohne „lang“ oder „für“ stehen.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Der einfache Aorist von ἀποθνῄσκω wird direkt und ohne einen im Ausgangstext nicht vorhandenen Euphemismus wiedergegeben.
- source_word: καὶ ... καὶ
  choice: Und ... und
  rationale: Die wiederholte Konjunktion verbindet die beiden historischen Aussagen schlicht und parataktisch; die deutsche Wiedergabe bewahrt diese Erzählweise.
- source_word: Ἀλέξανδρος
  choice: Alexander
  rationale: „Alexander“ ist die etablierte deutsche Namensform für Ἀλέξανδρος.
