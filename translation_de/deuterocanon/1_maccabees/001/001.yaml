  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch gut lesbar. Doppelpunkt und Semikolon gliedern die lange Vorlage sinnvoll. „Aus dem Land Kittim gekommen war“ ist im Deutschen idiomatischer und weniger konnotativ als „ausgezogen war“.
  terminology: „Alexander der Makedonier“, „Philippus“, „Darius“, „Perser und Meder“ sowie „Kittim“ sind angemessen. „Herrschte an dessen Stelle“ bildet die Nachfolgeformel sachgerecht ab. Die Fußnoten sind korrekt am Ortsnamen bzw. am militärischen Verb verankert.
