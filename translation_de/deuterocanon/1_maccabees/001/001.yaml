base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/001.yaml
  text: And it happened[a], after Alexander the Macedonian, the son of Philip, who had come out from the land of Kittim, struck down Darius king of the Persians and Medes, that he reigned in his place[b], having first reigned over Greece.
translation:
  language: de
  text: '**1 Makkabäer 1,1**


    Und es geschah: Nachdem Alexander der Makedonier, der Sohn des Philippus, der aus dem Land Kittim[a] gekommen war, Darius, den König der Perser und Meder, besiegt hatte[b], herrschte er an dessen Stelle; zuvor hatte er über Griechenland geherrscht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kittim ist ein traditioneller biblischer Ortsname. Je nach Zusammenhang kann er insbesondere Zypern oder allgemeiner Länder im Westen bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „geschlagen hatte“. Das griechische Verb kann „schlagen“, „niederschlagen“ oder im militärischen Zusammenhang „besiegen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Und es geschah
  rationale: Bewahrt die griechische Eröffnungsformel in würdigem, verständlichem Deutsch, ohne sie durch eine rein moderne historische Einleitung zu ersetzen.
- source_word: μετὰ τὸ πατάξαι … καὶ ἐπάταξεν
  choice: Nachdem … besiegt hatte
  rationale: Die griechische Formulierung ist syntaktisch wiederholend; die deutsche Wiedergabe bündelt sie zu einem natürlichen Temporalsatz. Im militärischen Zusammenhang gibt „besiegen“ den Sinn von πατάσσω klar wieder; die wörtlichere Bedeutung wird in einer Fußnote erhalten.
- source_word: Ἀλέξανδρον τὸν Φιλίππου τὸν Μακεδόνα
  choice: Alexander der Makedonier, der Sohn des Philippus
  rationale: Behält sowohl die Herkunftsbezeichnung als auch die Abstammungsangabe bei und ordnet sie in natürlichem Deutsch.
- source_word: ἐξῆλθεν ἐκ τῆς γῆς Χεττιείμ
  choice: der aus dem Land Kittim ausgezogen war
  rationale: „Ausgezogen“ bewahrt die gerichtete Bewegung von ἐξέρχομαι und passt zum militärisch-historischen Zusammenhang. Der traditionelle Ortsname bleibt unaufgelöst.
- source_word: Χεττιείμ
  choice: Kittim
  rationale: Transliteration des biblischen Ortsnamens; eine Festlegung auf Zypern, Makedonien oder allgemein westliche Länder würde die mögliche Bedeutung vorschnell verengen.
- source_word: τὸν Δαρεῖον βασιλέα Περσῶν καὶ Μήδων
  choice: Darius, den König der Perser und Meder
  rationale: Gibt Namen, Herrschertitel und beide Völker vollständig und idiomatisch wieder.
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  choice: herrschte er an dessen Stelle
  rationale: Drückt die königliche Herrschaft und die Nachfolge des Darius aus, ohne zusätzliche historische Einzelheiten einzutragen.
- source_word: πρότερον ἐπὶ τὴν Ἑλλάδα
  choice: zuvor hatte er über Griechenland geherrscht
  rationale: πρότερον bezeichnet die zeitlich vorausgehende Herrschaft; „Griechenland“ ist die allgemein verständliche Wiedergabe von Ἑλλάς.
theological_decisions:
- issue: Historisch-geografische Bedeutung von Χεττιείμ
  choice: Kittim
  alternative: Zypern, Makedonien oder die westlichen Länder
  rationale: Der überlieferte biblische Ortsname bleibt im Haupttext erhalten, weil der konkrete geografische Bezug im Kontext nicht eindeutig ist.
- issue: Bedeutungsumfang von πατάσσω
  choice: besiegt hatte
  alternative: geschlagen oder niedergeschlagen hatte
  rationale: Im militärischen Kontext bezeichnet das Verb hier plausibel den Sieg über Darius. Die Fußnote bewahrt die wörtlichere, kraftvollere Ausdrucksweise und damit den Bedeutungsumfang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Erzählformel bleibt bewusst erhalten. Der lange griechische Satz wird durch Doppelpunkt, Kommas und Semikolon lesbar gegliedert; die semitisch anmutende Wiederholung des Verbs πατάσσω wird im Deutschen nicht mechanisch verdoppelt.
