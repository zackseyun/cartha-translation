  text: And on the fifteenth day of Chislev[a], in the one hundred forty-fifth year, they built the abomination of desolation upon the altar; and in the surrounding cities of Judah they built altars[b],
translation:
  language: de
  text: Am fünfzehnten Tag des Monats Kislew, im 145. Jahr[a], errichteten sie den Gräuel der Verwüstung[b] auf dem Altar; und in den Städten Judas ringsum errichteten sie Altäre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das 145. Jahr ist nach der seleukidischen Zeitrechnung angegeben.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „einen verwüstenden Gräuel“ oder „den Gräuel, der Verwüstung bewirkt“. Die knappe griechische Wendung kann als feststehende Bezeichnung oder als beschreibender Ausdruck verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεντεκαιδεκάτῃ ἡμέρᾳ
  choice: Am fünfzehnten Tag
  rationale: Die Dativform bezeichnet den Zeitpunkt; die ausdrückliche Wiedergabe von ἡμέρᾳ als „Tag“ ist im Deutschen klar und natürlich.
- source_word: Χασελεὺ
  choice: des Monats Kislew
  rationale: „Kislew“ ist die im modernen Deutschen geläufige Form des jüdischen Monatsnamens; der Zusatz „Monat“ verdeutlicht seine Funktion.
- source_word: τῷ πέμπτῳ καὶ τεσσερακοστῷ ἔτει
  choice: im 145. Jahr
  rationale: Die Datierung wird entsprechend dem geschichtlichen Zusammenhang und der überlieferten seleukidischen Zeitrechnung als 145. Jahr wiedergegeben.
- source_word: ᾠκοδόμησαν
  choice: errichteten sie
  rationale: „Errichten“ passt sowohl zu dem Kultobjekt auf dem Altar als auch zu den Altären und bewahrt die Wiederholung desselben griechischen Verbs.
- source_word: βδέλυγμα ἐρημώσεως
  choice: den Gräuel der Verwüstung
  rationale: Die traditionelle, knappe Wendung bewahrt den kultischen und später apokalyptischen Anklang sowie die Mehrdeutigkeit des Genitivs.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: auf dem Altar
  rationale: ἐπί mit Akkusativ bezeichnet hier die Platzierung auf dem Altar; idiomatisches Deutsch verwendet in dieser Konstruktion „auf dem Altar“.
- source_word: πόλεσιν Ἰούδα κύκλῳ
  choice: in den Städten Judas ringsum
  rationale: „Ringsum“ gibt κύκλῳ wieder, ohne unklar zu behaupten, die Städte hätten außerhalb Judas gelegen.
- source_word: βωμούς
  choice: Altäre
  rationale: βωμός bezeichnet hier Altäre; „Heiligtümer“ oder „Kulthöhen“ würden den Ausdruck unnötig interpretieren.
theological_decisions:
- issue: Wiedergabe von βδέλυγμα ἐρημώσεως mit seiner späteren biblisch-theologischen Resonanz
  choice: den Gräuel der Verwüstung
  alternative: einen verwüstenden Gräuel; den Gräuel, der Verwüstung bewirkt
  rationale: Die traditionelle Formulierung erhält die intertextuelle Verbindung und legt zugleich nicht abschließend fest, ob der Genitiv eine Wirkung, Eigenschaft oder feste Bezeichnung ausdrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kislew“ folgt dem geläufigen deutschen Monatsnamen; „Gräuel der Verwüstung“ wahrt die traditionelle biblische Sprachverbindung, während die Fußnote die echte grammatische Mehrdeutigkeit offenhält. Die Wiederholung von „errichteten“ spiegelt die Wiederholung des griechischen Verbs.
