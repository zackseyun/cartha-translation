  text: And he waged many wars, and seized strongholds, and slaughtered kings,
translation:
  language: de
  text: Und er führte viele Kriege, nahm Festungen ein und schlachtete Könige ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεστήσατο
  choice: führte
  rationale: In Verbindung mit πολέμους bezeichnet das Verb das Beginnen beziehungsweise Führen von Kriegen. „führte viele Kriege“ ist im Deutschen natürlich und wahrt den militärischen Sinn.
- source_word: πολέμους πολλούς
  choice: viele Kriege
  rationale: πόλεμος bezeichnet umfassend Krieg oder bewaffneten Konflikt; „Kriege“ ist genauer als das engere „Schlachten“ und weniger deutend als „Feldzüge“.
- source_word: ἐκράτησεν
  choice: nahm … ein
  rationale: κρατέω bedeutet hier, gewaltsam die Herrschaft über etwas zu erlangen. Mit Festungen ist „einnehmen“ die übliche und präzise militärische Formulierung.
- source_word: ὀχυρωμάτων
  choice: Festungen
  rationale: ὀχύρωμα bezeichnet einen befestigten Ort oder eine Befestigungsanlage. „Festungen“ ist knapp, verständlich und idiomatisch.
- source_word: ἔσφαξεν
  choice: schlachtete … ab
  rationale: σφάζω ist ein starkes Verb für gewaltsames, blutiges Töten. „abschlachten“ erhält diese Härte deutlicher als das allgemeinere „töten“.
- source_word: βασιλεῖς
  choice: Könige
  rationale: Das griechische Wort bezeichnet ausdrücklich Könige; das allgemeinere „Herrscher“ würde den politischen Titel einebnen.
