base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/035.yaml
  text: And they stored up weapons and provisions[a], and after gathering the spoils of Jerusalem they deposited them there, and it became a great snare,
translation:
  language: de
  text: Und sie lagerten Waffen und Vorräte ein. Nachdem sie die Beute Jerusalems[a] zusammengetragen hatten, brachten sie sie dort unter. So wurde es zu einer großen Falle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Beute aus Jerusalem“. Der griechische Genitiv lässt die genaue Beziehung zur Stadt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέθεντο
  choice: lagerten … ein
  rationale: Das Medium bezeichnet hier das gezielte Bereitstellen beziehungsweise Einlagern militärischer Vorräte. „Einlagern“ gibt den Zusammenhang natürlich wieder.
- source_word: ὅπλα
  choice: Waffen
  rationale: ὅπλα bezeichnet im militärischen Zusammenhang Waffen beziehungsweise Kriegsgerät; „Waffen“ ist die klare und heutige Wiedergabe.
- source_word: τροφήν
  choice: Vorräte
  rationale: Das Wort bedeutet wörtlich Nahrung oder Verpflegung. Zusammen mit den Waffen und im Zusammenhang einer Besatzung bezeichnet „Vorräte“ treffend den eingelagerten Lebensunterhalt.
- source_word: συναγαγόντες
  choice: nachdem sie … zusammengetragen hatten
  rationale: Das Partizip bezeichnet eine Handlung, die dem Unterbringen der Beute vorausgeht; die temporale Konstruktion macht diese Abfolge im Deutschen deutlich.
- source_word: τὰ σκῦλα
  choice: die Beute
  rationale: Der Ausdruck bezeichnet gewaltsam erlangtes Beutegut. „Beute“ ist präzise, natürlich und würdevoll.
- source_word: Ἰερουσαλήμ
  choice: Jerusalems
  rationale: Der unmarkierte Genitiv bewahrt im Haupttext die knappe Zuordnung zur Stadt, ohne die mögliche Beziehung vollständig festzulegen.
- source_word: ἀπέθεντο
  choice: brachten sie … unter
  rationale: Das Verb beschreibt das Ablegen beziehungsweise Verwahren der zusammengetragenen Beute an diesem Ort. „Unterbringen“ vermeidet eine unnötige Wiederholung von „einlagern“.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das Ortsadverb verweist auf den im vorherigen Vers genannten befestigten Ort.
- source_word: παγίδα
  choice: Falle
  rationale: „Falle“ erhält das bedrohliche Bild der παγίς in verständlichem modernem Deutsch; der Text bestimmt nicht ausdrücklich, wer darin gefangen wird.
theological_decisions:
- issue: Bildhafte Bedeutung von μεγάλην παγίδα
  choice: zu einer großen Falle
  alternative: zu einem großen Fallstrick
  rationale: „Falle“ bewahrt die Metapher und ihre bedrohliche Offenheit, ohne ihre Betroffenen oder ihre genaue Wirkung ausdeutend festzulegen. „Fallstrick“ wäre traditionssprachlich, ist im heutigen Deutsch jedoch weniger unmittelbar verständlich.
- issue: Unausgesprochenes Subjekt von ἐγένετο
  choice: der Ort
  alternative: es
  rationale: Das griechische Verb hat hier kein ausdrücklich genanntes Subjekt und verweist im Zusammenhang auf den befestigten Ort. „Der Ort“ stellt den Bezug im Deutschen verständlich her, ohne ihn näher als Festung, Besatzung oder Machtzentrum auszulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzgliederung vermeidet eine schwerfällige Kette von „und“-Sätzen. Die Genitivbeziehung bei „Jerusalems“ und die offene Bildsprache der „Falle“ werden nicht vorschnell ausgedeutet.
