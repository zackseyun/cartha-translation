translation:
  language: de
  text: Und er nahm die Beute der Stadt, steckte die Stadt in Brand und riss ihre Häuser und ihre Mauern ringsum nieder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: nahm
  rationale: Die direkte Wiedergabe wahrt die schlichte Erzählfolge und legt die Art der Aneignung nicht über den Kontext hinaus fest.
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: die Beute der Stadt
  rationale: σκῦλα bezeichnet im Krieg erbeutete Güter; „Beute“ ist im Deutschen natürlich und bewahrt den militärisch-gewaltsamen Sinn. Der Genitiv wird formal als „der Stadt“ wiedergegeben.
- source_word: ἐνεπύρισεν αὐτὴν πυρί
  choice: steckte sie in Brand
  rationale: Die Wendung gibt das Verb und das ausdrücklich genannte Feuer in natürlichem Deutsch wieder, ohne die im Deutschen schwerfällige Doppelung „verbrannte sie mit Feuer“.
- source_word: καθεῖλεν
  choice: riss … nieder
  rationale: Die Formulierung vermittelt die gewaltsame Zerstörung anschaulich und idiomatisch.
- source_word: τοὺς οἴκους αὐτῆς
  choice: ihre Häuser
  rationale: οἶκοι bezeichnet hier die Gebäude der Stadt; das feminine Pronomen kann im Deutschen natürlich auf „Stadt“ zurückverweisen.
- source_word: τὰ τείχη αὐτῆς
  choice: ihre Mauern
  rationale: τείχη meint die Verteidigungs- beziehungsweise Stadtmauern; im eindeutigen Kontext genügt „Mauern“.
- source_word: κύκλῳ
  choice: ringsum
  rationale: „Ringsum“ gibt die umfassende räumliche Ausdehnung knapp und in modernem Standarddeutsch wieder.
