  yaml_path: translation/deuterocanon/1_maccabees/001/027.yaml
  text: Every bridegroom took up lamentation[a]; she who sat in the bridal chamber became one in mourning.
translation:
  language: de
  text: Jeder Bräutigam stimmte ein Klagelied an[a]; die im Brautgemach saß, geriet in Trauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfacher: „Jeder Bräutigam klagte; die im Brautgemach saß, war in Trauer.“ Das Griechische gebraucht eine verdichtete poetische Ausdrucksweise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: Jeder
  rationale: Mit dem singularischen νυμφίος ist πᾶς distributiv gebraucht; „jeder“ gibt den Umfang im Deutschen natürlich und genau wieder.
- source_word: νυμφίος
  choice: Bräutigam
  rationale: „Bräutigam“ bezeichnet den Mann im unmittelbaren Hochzeitszusammenhang und wahrt den feierlich-poetischen Ton.
- source_word: ἀνέλαβε
  choice: stimmte … an
  rationale: In Verbindung mit θρῆνον bezeichnet das Verb das Einsetzen mit einer Klage. „Stimmte … an“ ist im Deutschen idiomatisch und bewahrt den Gedanken einer hörbar erhobenen Klage.
- source_word: θρῆνον
  choice: Klagelied
  rationale: Das Wort kann eine Klage oder ein Trauerlied bezeichnen. „Klagelied“ bewahrt den substantivischen und poetischen Charakter, ohne den Ausdruck zwingend auf eine förmliche Totenklage zu verengen.
- source_word: καθημένη
  choice: die … saß
  rationale: Das feminine Partizip nennt die Frau nicht ausdrücklich. Die Wiedergabe bewahrt diese poetische Verdichtung, obwohl im Zusammenhang wohl die Braut gemeint ist.
- source_word: ἐν παστῷ
  choice: im Brautgemach
  rationale: παστός bezeichnet hier den hochzeitlichen Raum beziehungsweise das Brautgemach; „Brautgemach“ ist verständlich und stilistisch angemessen.
- source_word: ἐγένετο ἐν πένθει
  choice: geriet in Trauer
  rationale: Die Formulierung bezeichnet einen Übergang in einen Zustand der Trauer. „Geriet in Trauer“ gibt diesen Zustandswechsel natürlicher wieder als ein bloßes „war in Trauer“.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Klang. Die parallele Satzstruktur und die im Griechischen nicht ausdrücklich als Braut bezeichnete feminine Person bleiben erhalten.
