  yaml_path: translation/deuterocanon/1_maccabees/001/004.yaml
  text: And he gathered a very strong force[a], and began to rule over lands and nations and dominions[b], and they became tributary to him.
translation:
  language: de
  text: Und er sammelte eine überaus starke Streitmacht und begann, über Länder, Völker und Herrschaftsgebiete[a] zu herrschen; und sie wurden ihm tributpflichtig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „Tyrannenherrschaften“; das griechische Wort bezeichnet Herrschaftsbereiche oder Regierungsformen unter einem Alleinherrscher. Auch „Fürstentümer“ oder „Gewaltherrschaften“ sind möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆξεν
  choice: sammelte
  rationale: Das Verb bezeichnet hier das Zusammenziehen beziehungsweise Aufbieten militärischer Kräfte. „Sammelte“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: δύναμιν
  choice: Streitmacht
  rationale: Im militärischen Zusammenhang bezeichnet δύναμις bewaffnete Macht beziehungsweise Truppen. „Streitmacht“ ist präziser als das allgemeinere „Macht“ und weniger eng als „Heer“.
- source_word: ἰσχυρὰν σφόδρα
  choice: überaus starke
  rationale: Die Verbindung aus Adjektiv und verstärkendem Adverb wird mit einer würdigen, deutlich intensiven deutschen Formulierung wiedergegeben.
- source_word: ἦρξεν
  choice: begann … zu herrschen
  rationale: ἄρχω mit Genitiv bedeutet „über etwas herrschen“; die Wiedergabe mit „begann“ erhält die mögliche ingressiv verstandene Aoristnuance.
- source_word: χωρῶν
  choice: Länder
  rationale: χώρα bezeichnet Land, Gebiet oder Region. Der Plural „Länder“ passt zum politisch-geografischen Zusammenhang, ohne ausdrücklich moderne Nationalstaaten vorauszusetzen.
- source_word: ἐθνῶν
  choice: Völker
  rationale: ἔθνη bezeichnet hier menschliche Völker beziehungsweise Nationen. „Völker“ vermeidet moderne staatsrechtliche Nebenbedeutungen und unterscheidet die Personenverbände von den Ländern.
- source_word: τυραννιῶν
  choice: Herrschaftsgebiete
  rationale: Gemeint sind von Alleinherrschern beherrschte Gebiete oder Herrschaften, nicht bloß Tyrannei als abstrakte Unterdrückungsform. „Herrschaftsgebiete“ ist im Deutschen verständlich und wahrt den politischen Bezug; die besondere griechische Wortwahl wird in der Fußnote offengelegt.
- source_word: ἐγένοντο αὐτῷ εἰς φόρον
  choice: sie wurden ihm tributpflichtig
  rationale: Die Wendung beschreibt den Eintritt in ein dauerhaftes Tributverhältnis. „Tributpflichtig werden“ gibt sowohl den Zustandswechsel als auch die politisch-fiskalische Unterordnung knapp wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer historischer Sprache. Die Reihung „Länder, Völker und Herrschaftsgebiete“ bleibt erhalten; das Semikolon verdeutlicht den Übergang von Eroberung und Herrschaft zur Tributpflicht. Die echte lexikalische Schwierigkeit bei τυραννιῶν wird nicht eingeebnet, sondern durch eine Fußnote kenntlich gemacht.
