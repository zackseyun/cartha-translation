  source_fidelity: Die Übersetzung gibt die militärische Sammlung einer äußerst starken δύναμις mit „überaus starke Streitmacht“ treffend wieder. „Begann, über … zu herrschen“ bildet die mit ἄρχω mögliche ingressive Nuance ab, ohne sie zu überdeuten. Die abschließende Tributformel ist mit „wurden ihm tributpflichtig“ präzise als dauerhafte fiskalisch-politische Unterordnung wiedergegeben.
  naturalness: Modernes, idiomatisches und zugleich dem historischen Kontext angemessen würdiges Standarddeutsch. Die Reihung und das Semikolon sind gut verständlich. „Tributpflichtig“ ist fachsprachlich, aber im Kontext klar und passend.
  terminology: „Länder“ und „Völker“ unterscheiden die geografisch-politische und die personale Ebene sinnvoll. „Herrschaftsgebiete“ ist eine gut lesbare kontextuelle Wiedergabe von τυραννιῶν; die Fußnote legt die spezifischere, formalere Bedeutung als „Tyrannenherrschaften“ angemessen offen. Es werden keine theologischen oder konfessionellen Deutungen eingeführt.
