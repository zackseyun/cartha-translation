  text: and the table for the presentation of the bread[b][a], and the libation vessels and the bowls and the golden censers and the curtain and the crowns and the gold decoration on the front of the temple—and he stripped it all off.
translation:
  language: de
  text: auch den Tisch für die Schaubrote[a], die Gefäße für die Trankopfer, die Schalen, die goldenen Räuchergefäße, den Vorhang, die Kränze und den Goldschmuck an der Vorderseite des Tempels. Alles schälte er ab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Tisch der Darbringung“ oder „der Aufstellung“; gemeint ist der Tisch, auf dem die Brote vor Gott ausgelegt wurden. Auch möglich: „der Tisch der Gegenwart“ oder „der Schaubrot-Tisch“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb bedeutet „abschälen“ oder „abstreifen“ und kann auf das Entfernen von Goldauflagen oder Verzierungen hinweisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τράπεζαν τῆς προθέσεως
  choice: den Tisch für die Schaubrote
  rationale: Die Wendung bezeichnet im Tempelzusammenhang den Tisch, auf dem die Brote vor Gott ausgelegt wurden. „Tisch für die Schaubrote“ ist verständlich, kultisch präzise und vermeidet die im Deutschen unnatürliche wörtliche Form „Tisch der Auslegung“.
- source_word: σπονδεῖα
  choice: die Gefäße für die Trankopfer
  rationale: Das Wort bezeichnet Geräte für Libationen. Die funktionale Wiedergabe ist für heutige Leser klarer als das fachsprachliche „Libationsgefäße“.
- source_word: φιάλας
  choice: die Schalen
  rationale: φιάλη bezeichnet eine breite, häufig rituell verwendete Schale; „Schalen“ ist eine natürliche und sachlich passende Wiedergabe.
- source_word: θυΐσκας τὰς χρυσᾶς
  choice: die goldenen Räuchergefäße
  rationale: θυΐσκη bezeichnet ein Gerät zum Verbrennen von Räucherwerk. „Räuchergefäße“ ist verständlich und lässt die genaue Gefäßform offen.
- source_word: καταπέτασμα
  choice: den Vorhang
  rationale: Das Wort bezeichnet den Tempelvorhang. „Vorhang“ ist modernes Standarddeutsch und weniger traditionsgebunden als „Vorhangsschleier“ oder „Schleier“.
- source_word: στεφάνους
  choice: die Kränze
  rationale: στέφανος kann Kranz oder Krone bedeuten. Bei dekorativen Tempelbestandteilen ist „Kränze“ die wahrscheinlichere konkrete Vorstellung, ohne ihre genaue Gestalt zu überbestimmen.
- source_word: κόσμον τὸν χρυσοῦν
  choice: den Goldschmuck
  rationale: κόσμος bedeutet hier Schmuck beziehungsweise Verzierung. „Goldschmuck“ ist knapp, natürlich und bezeichnet das Material klar.
- source_word: κατὰ πρόσωπον τοῦ ναοῦ
  choice: an der Vorderseite des Tempels
  rationale: Die Wendung lokalisiert den Schmuck wahrscheinlich an der Front beziehungsweise Fassade des Tempels. Die Wiedergabe erhält diesen räumlichen Sinn.
- source_word: ἐλέπισεν πάντα
  choice: Alles schälte er ab
  rationale: Das Verb bedeutet wörtlich „abschälen“ und weist vermutlich auf das Entfernen einer Goldauflage oder Verkleidung hin. Die bewusst markante Formulierung bewahrt dieses konkrete Bild und bezieht πάντα zusammenfassend auf den geplünderten Bestand.
