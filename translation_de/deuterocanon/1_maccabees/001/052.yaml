lexical_decisions:
- source_word: συνηθροίσθησαν ... πρὸς αὐτούς
  choice: schlossen sich ihnen an
  rationale: Gibt das Sich-Versammeln zu einer bereits genannten Gruppe im Deutschen natürlich wieder und bewahrt den Sinn einer bewussten Hinwendung.
- source_word: πᾶς ὁ ἐγκαταλείπων τὸν νόμον
  choice: alle, die das Gesetz verließen
  rationale: Das substantivierte Präsenspartizip bezeichnet diejenigen, die das Gesetz aufgaben bzw. von ihm abfielen; die deutsche Formulierung bleibt knapp und lässt Verlauf oder wiederholtes Handeln offen.
- source_word: ἐποίησαν κακὰ
  choice: sie taten Böses
  rationale: Entspricht der allgemeinen moralischen Aussage des Griechischen, ohne die Art des Bösen näher festzulegen.
- source_word: ἐν τῇ γῇ
  choice: im Land
  rationale: Im Erzählzusammenhang ist das eigene Land gemeint; „Land“ ist idiomatisch und bewahrt die räumliche Unbestimmtheit.
theological_decisions:
- issue: Bedeutung von „das Gesetz verlassen“
  choice: das Gesetz verließen
  alternative: vom Gesetz abfielen
  rationale: Die gewählte Fassung wahrt das Bild des Verlassens und vermeidet eine stärker konfessionell oder theologisch geprägte Deutung durch „abfallen“.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur und das abschließende Semikolon bewahren den fortlaufenden Charakter des griechischen Erzählzusammenhangs.
