base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/011.yaml
  text: In those days lawless men came out from Israel and persuaded many[a], saying, “Let us go and make a covenant with the nations around us, because since we separated ourselves from them[c][b], many evils have found us.”
translation:
  language: de
  text: 'In jenen Tagen traten aus Israel gesetzlose Männer[a] hervor und überredeten viele mit den Worten: »Lasst uns gehen und mit den Völkern rings um uns einen Bund schließen; denn seit wir uns von ihnen getrennt haben[b], ist viel Unheil über uns gekommen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »gesetzlose Söhne«; gemeint sind Menschen, die durch Gesetzlosigkeit gekennzeichnet sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seit wir von ihnen getrennt wurden«. Die griechische Form kann auch passiv verstanden werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »viel Böses hat uns gefunden«; gemeint ist, dass viel Unglück oder große Not über sie kam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ Ἰσραὴλ
  choice: traten … aus Israel hervor
  rationale: Die Wendung bewahrt das Bild des Hervortretens aus der Mitte Israels und klingt im Deutschen natürlicher als eine rein räumliche Wiedergabe mit „herauskommen“.
- source_word: υἱοὶ παράνομος
  choice: gesetzlose Männer
  rationale: Trotz der auffälligen Kongruenz im griechischen Text bezeichnet die familiäre Ausdrucksweise idiomatisch Menschen, die durch Gesetzlosigkeit gekennzeichnet sind. Die wörtlichere Alternative wird in Fußnote [a] erhalten.
- source_word: ἀνέπεισαν πολλοὺς
  choice: überredeten viele
  rationale: Das Verb bezeichnet ein Überzeugen oder Bestimmen zu einer Handlung. „Überredeten“ gibt dies direkt wieder, ohne die zusätzliche Wertung von „verführten“ einzutragen.
- source_word: Πορευθῶμεν
  choice: Lasst uns gehen
  rationale: Natürliche Wiedergabe des auffordernden Konjunktivs.
- source_word: διαθώμεθα διαθήκην
  choice: einen Bund schließen
  rationale: Die feste deutsche Wendung erhält den gewichtigen biblischen Begriff διαθήκη und reduziert ihn nicht auf eine bloße Vereinbarung.
- source_word: τῶν ἐθνῶν τῶν κύκλῳ ἡμῶν
  choice: mit den Völkern rings um uns
  rationale: „Völker“ passt zum historischen Zusammenhang und vermeidet eine unnötige Einengung auf den späteren neutestamentlichen Sprachgebrauch von „Heiden“.
- source_word: ἀφʼ ἧς ἐχωρίσθημεν ὑπʼ αὐτῶν
  choice: seit wir uns von ihnen abgesondert haben
  rationale: „Seit“ gibt den zeitlichen Sinn von ἀφʼ ἧς natürlich wieder. Die reflexive Form ist im Zusammenhang verständlich; die mögliche passivische Lesart bleibt in Fußnote [b] sichtbar.
- source_word: εὗρεν ἡμᾶς κακὰ πολλὰ
  choice: ist viel Unheil über uns gekommen
  rationale: Die deutsche Wendung vermittelt verständlich, dass zahlreiche Notlagen die Sprecher trafen. Das anschauliche griechische Bild „fand uns“ wird in Fußnote [c] dokumentiert.
theological_decisions:
- issue: Bundessprache in einem politisch und religiös aufgeladenen Zusammenhang
  choice: einen Bund schließen
  alternative: eine Vereinbarung treffen / ein Bündnis eingehen
  rationale: διαθήκη ist ein zentraler biblischer Begriff. „Bund“ bewahrt die theologische Spannung darin, dass Angehörige Israels eine förmliche Bindung an die umliegenden Völker anstreben.
- issue: Verantwortung für die Absonderung Israels
  choice: seit wir uns von ihnen abgesondert haben
  alternative: seit wir von ihnen getrennt wurden
  rationale: Der Zusammenhang lässt eine reflexive Wiedergabe zu, doch die griechische Passivform kann auch eine erlittene oder bewirkte Trennung ausdrücken. Die Übersetzung entscheidet diese Spannung nicht stillschweigend, sondern nennt die Alternative in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Bundessprache. Satzbau und Wortwahl bleiben für heutige Leser verständlich; ungewöhnliche Bilder und grammatische Mehrdeutigkeiten des Griechischen werden über knapp gehaltene Fußnoten zugänglich gemacht.
