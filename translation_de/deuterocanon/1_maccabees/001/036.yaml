  text: And it became an ambush against the sanctuary[a], and a wicked adversary against Israel continually.
translation:
  language: de
  text: Und sie wurde zu einem Hinterhalt gegen das Heiligtum und zu einem bösen Widersacher Israels[a], ständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einem bösen Verleumder«. Das griechische Wort διάβολος kann einen Verleumder oder einen Widersacher bezeichnen; der feindliche Zusammenhang spricht hier eher für »Widersacher«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: sie wurde
  rationale: Der Aorist von γίνομαι bezeichnet hier eine Entwicklung beziehungsweise den Eintritt in eine neue Funktion. Das feminine Pronomen nimmt die zuvor erwähnte Festung auf.
- source_word: εἰς ἔνεδρον
  choice: zu einem Hinterhalt
  rationale: ἔνεδρον bezeichnet einen Hinterhalt oder einen Ort des Auflauerns; »Hinterhalt« bewahrt den militärisch-feindseligen Sinn.
- source_word: τῷ ἁγιάσματι
  choice: gegen das Heiligtum
  rationale: ἁγίασμα bezeichnet hier im Jerusalemer Tempelkontext das Heiligtum, ohne den griechischen Ausdruck unnötig einzuengen.
- source_word: εἰς διάβολον πονηρόν
  choice: zu einem bösartigen Widersacher
  rationale: διάβολος ist hier ein Gattungsbegriff für einen Verleumder oder Widersacher, nicht der Titel »Teufel«. Der militärische Kontext und die Parallelität zu ἔνεδρον sprechen für »Widersacher«; πονηρός wird mit »bösartig« wiedergegeben.
- source_word: τῷ Ἰσραήλ
  choice: Israels
  rationale: Der feindlich betroffene Dativ wird im Deutschen idiomatisch durch den Genitiv nach »Widersacher« ausgedrückt.
- source_word: διὰ παντός
  choice: für alle Zeit
  rationale: Die feste Wendung bezeichnet fortdauernde, beständige Geltung; »für alle Zeit« gibt den durativen Nachdruck natürlich wieder.
theological_decisions:
- issue: Ob διάβολον als titelartiger »Teufel« oder als Gattungsbegriff wiederzugeben ist
  choice: Gattungsbegriff »Widersacher«
  alternative: »Verleumder« oder »Teufel«
  rationale: In dieser historischen Erzählung beschreibt das Wort die feindliche Rolle der Festung beziehungsweise Besatzungsmacht gegenüber Israel. »Teufel« würde eine spätere titelartige Bedeutung in den Text hineintragen; die mögliche Bedeutung »Verleumder« bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgestalt wahrt die Parallelität des Griechischen; »sie« knüpft an die im vorausgehenden Kontext genannte Festung an. Der Fußnotenmarker steht am Versende, da er die alternative Deutung des zweiten Prädikats erläutert.
