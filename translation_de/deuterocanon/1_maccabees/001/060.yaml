translation:
  language: de
  text: Und die Frauen, die ihre Kinder beschnitten hatten[a], töteten sie gemäß dem Erlass,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihre Kinder hatten beschneiden lassen“. Das Griechische verwendet ein aktives Partizip („die beschnitten hatten“), das sowohl die unmittelbare Ausführung als auch das Veranlassen der Beschneidung bezeichnen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμηκυίας
  choice: die … beschnitten hatten
  rationale: Das feminine perfekte Aktivpartizip bezeichnet eine vor der Tötung abgeschlossene Handlung. Die aktive Form wird im Haupttext bewahrt, kann im Zusammenhang aber auch einschließen, dass die Frauen die Beschneidung veranlasst hatten.
- source_word: τὰ τέκνα αὐτῶν
  choice: ihre Kinder
  rationale: τέκνα bedeutet allgemein „Kinder“. Obwohl hier aufgrund der Beschneidung männliche Kinder gemeint sind, wird die griechische Formulierung nicht deutend zu „Söhne“ verengt.
- source_word: ἐθανάτωσαν
  choice: töteten sie
  rationale: Das Verb bedeutet „zu Tode bringen“ beziehungsweise „töten“. Die Formulierung ist im Deutschen natürlich und setzt nicht ausdrücklich ein Gerichtsverfahren voraus.
- source_word: κατὰ τὸ πρόσταγμα
  choice: gemäß dem Erlass
  rationale: πρόσταγμα bezeichnet eine verbindliche Anordnung oder einen Erlass. Im Kontext staatlich angeordneter Verfolgung gibt „Erlass“ den amtlichen Charakter angemessen wieder.
theological_decisions:
- issue: Handlungsträgerschaft der Frauen bei der Beschneidung
  choice: Die Frauen werden als diejenigen bezeichnet, die ihre Kinder beschnitten hatten.
  alternative: Die Frauen hatten ihre Kinder beschneiden lassen.
  rationale: Die aktive griechische Partizipialform spricht zunächst für unmittelbare Handlungsträgerschaft, kann idiomatisch jedoch auch das Veranlassen der Beschneidung umfassen. Der Haupttext erhält die aktive Aussage; die Fußnote nennt die echte Alternative.
- issue: Bedeutungsumfang von τέκνα im Zusammenhang mit der Beschneidung
  choice: „Kinder“ statt einer deutenden Verengung auf „Söhne“
  alternative: Söhne
  rationale: Der Zusammenhang betrifft männliche Kinder, doch der griechische Text verwendet das allgemeinere τέκνα. Die Übersetzung bewahrt diesen Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht das ungenannte Subjekt von ἐθανάτωσαν durch das nachgestellte „sie“ erkennbar. Das abschließende Komma bleibt erhalten, da der Vers syntaktisch in den folgenden Text weiterführt.
