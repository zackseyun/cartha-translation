base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/010.yaml
  text: And from them came forth a sinful root[a], Antiochus Epiphanes, son of King Antiochus, who had been a hostage in Rome[b]. And he reigned in the one hundred forty-seventh year of the kingdom of the Greeks.
translation:
  language: de
  text: 'Und aus ihnen ging eine sündige Wurzel hervor[a]: Antiochus Epiphanes, der Sohn des Königs Antiochus, der als Geisel in Rom gewesen war. Im 147. Jahr der Herrschaft der Griechen wurde er König[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »eine böse Wurzel« oder »ein sündiger Spross«. Im Griechischen steht wörtlich »Wurzel«; das Pflanzenbild bleibt im Haupttext erhalten.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die seleukidische Zeitrechnung, die hier nach der »Herrschaft der Griechen« datiert.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ αὐτῶν
  choice: aus ihnen ging … hervor
  rationale: Die Wendung bezeichnet sein Hervorgehen aus der zuvor genannten Gruppe beziehungsweise Linie. »Hervorgehen« bewahrt den Zusammenhang mit dem Pflanzenbild.
- source_word: ῥίζα ἁμαρτωλός
  choice: eine sündige Wurzel
  rationale: »Wurzel« gibt ῥίζα wörtlich wieder und erhält das bewusst wertende Pflanzenbild; »sündig« entspricht ἁμαρτωλός, ohne die Aussage zu verstärken.
- source_word: Ἀντίοχος Ἐπιφανής
  choice: Antiochus Epiphanes
  rationale: Name und Beiname werden in ihrer eingebürgerten griechisch-lateinischen Form wiedergegeben.
- source_word: ὅμηρα
  choice: als Geisel
  rationale: Obwohl die griechische Form formal im Plural steht, bezieht sie sich idiomatisch auf Antiochus als einzelne politische Geisel.
- source_word: ἐβασίλευσεν
  choice: wurde er König
  rationale: Der punktuelle Zeitbezug auf ein bestimmtes Jahr legt hier den Beginn seiner Königsherrschaft nahe; die Formulierung gibt die Thronbesteigung in natürlichem Deutsch wieder.
- source_word: ἔτει ἑκατοστῷ καὶ ἑβδόμῳ καὶ τεσσαρακοστῷ
  choice: im 147. Jahr
  rationale: Dies entspricht der griechischen Datierungsformel in knapper, üblicher deutscher Schreibweise.
- source_word: βασιλείας Ἑλλήνων
  choice: der Herrschaft der Griechen
  rationale: Die Wendung bezeichnet die Zeitrechnung nach der griechischen beziehungsweise seleukidischen Herrschaft und bleibt näher am politischen Sinn als eine bloße Bezeichnung als »griechische Zeitrechnung«.
theological_decisions:
- issue: Moralisches Pflanzenbild in ῥίζα ἁμαρτωλός
  choice: Das Bild wird als »eine sündige Wurzel« beibehalten.
  alternative: »ein verbrecherischer Spross« oder die entbildlichte Wiedergabe »ein sündiger Mann«
  rationale: Die wörtliche Bildsprache trägt die ausdrückliche moralische Wertung des Erzählers, ohne sie abzuschwächen oder durch eine stärkere Deutung zu ersetzen.
- issue: Aspekt von ἐβασίλευσεν im datierten Zusammenhang
  choice: »wurde er König«
  alternative: »herrschte er« oder »begann er zu herrschen«
  rationale: Die Angabe eines einzelnen Jahres beschreibt hier am natürlichsten den Herrschaftsantritt. Die mögliche allgemeinere Bedeutung »herrschen« wird nicht zu einer Aussage über die Dauer ausgebaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt gut verständlich, während das markante Pflanzenbild und die antike Datierungsformel erhalten werden. Der Datierungsfußnotenmarker steht bei der zugehörigen Zeitangabe.
