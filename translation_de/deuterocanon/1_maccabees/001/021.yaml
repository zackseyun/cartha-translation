base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/021.yaml
  text: And he entered the sanctuary in arrogance[a], and took the golden altar, and the lampstand of the light with all its utensils,
translation:
  language: de
  text: Und er betrat voller Überheblichkeit das Heiligtum[a] und nahm den goldenen Altar, den Leuchter für das Licht samt allen seinen Geräten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Heilige« beziehungsweise »die heilige Stätte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγίασμα
  choice: das Heiligtum
  rationale: ἁγίασμα bezeichnet einen geheiligten Ort beziehungsweise ein Heiligtum. »Heiligtum« ist im Tempelkontext natürlich und legt nicht genauer als der griechische Wortlaut fest, welcher Innenraum gemeint ist.
- source_word: ἐν ὑπερηφανίᾳ
  choice: in Überheblichkeit
  rationale: Die präpositionale Wendung beschreibt die Art seines Eintretens. »In Überheblichkeit« bewahrt die substantivische Form und den deutlich negativen moralischen Sinn von ὑπερηφανία.
- source_word: θυσιαστήριον τὸ χρυσοῦν
  choice: den goldenen Altar
  rationale: Dies ist die natürliche deutsche Wiedergabe der Verbindung aus bestimmtem Substantiv und Adjektiv und lässt den Bezug auf den goldenen Altar des Heiligtums bestehen.
- source_word: λυχνίαν τοῦ φωτός
  choice: den Leuchter für das Licht
  rationale: »Leuchter« ist im Tempelkontext eine geläufige und würdige Bezeichnung. »Für das Licht« gibt den Genitiv τοῦ φωτός funktional wieder, ohne ihn auszulassen.
- source_word: σκεύη
  choice: Geräte
  rationale: σκεύη bezeichnet hier die zum Leuchter gehörenden Gegenstände oder Gerätschaften. »Geräte« ist umfassend, verständlich und weniger eng als »Gefäße«.
theological_decisions:
- issue: Ob ἁγίασμα technisch als ein bestimmter Innenraum des Tempels wiederzugeben ist
  choice: Heiligtum
  alternative: das Heilige; die heilige Stätte
  rationale: Der griechische Ausdruck bezeichnet den heiligen Bereich, erzwingt aber keine präzisere räumliche Zuordnung. »Heiligtum« bewahrt den sakralen Tempelbezug, ohne eine nicht ausdrücklich genannte technische Unterscheidung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Das wiederholte καί wird lesbar verbunden; der Genitiv τοῦ φωτός bleibt sinngemäß ausdrücklich erhalten. Das feminine αὐτῆς bezieht sich auf λυχνία; wegen des deutschen Maskulinums »Leuchter« lautet der Rückbezug grammatisch »seine«.
