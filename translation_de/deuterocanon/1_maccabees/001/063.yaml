  yaml_path: translation/deuterocanon/1_maccabees/001/063.yaml
  text: And they chose to die[a], so that they might not be defiled by the foods and might not profane the holy covenant[b]; and they died.
translation:
  language: de
  text: Und sie nahmen den Tod auf sich, um sich nicht durch die Speisen zu verunreinigen und den heiligen Bund[a] nicht zu entweihen; und sie starben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen heiligen Bund“. Im Griechischen steht die Wendung ohne Artikel; im Zusammenhang ist sehr wahrscheinlich der Israel bekannte Bund gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεδέξαντο ἀποθανεῖν
  choice: sie nahmen den Tod auf sich
  rationale: Die Wendung bewahrt das willentliche Annehmen des Todes, ohne die stärkere Aussage „sie wählten den Tod“ oder die emotionale Färbung „sie begrüßten den Tod“ einzutragen.
- source_word: μιανθῶσιν
  choice: sich verunreinigen
  rationale: „Verunreinigen“ erfasst im Zusammenhang verbotener Speisen sowohl die kultische als auch die sittlich-bundestreue Dimension.
- source_word: τοῖς βρώμασιν
  choice: durch die Speisen
  rationale: Der griechische Plural bezeichnet die betreffenden Nahrungsmittel; „Speisen“ bleibt weiter und quellennäher als „Fleisch“.
- source_word: βεβηλώσωσιν
  choice: entweihen
  rationale: Das Verb bezeichnet hier, etwas Heiliges profan zu behandeln; „entweihen“ bildet den Gegensatz zum heiligen Bund natürlich ab.
- source_word: διαθήκην ἁγίαν
  choice: den heiligen Bund
  rationale: Obwohl im Griechischen kein Artikel steht, verweist der Kontext auf den Israel bekannten Bund mit Gott. Die bestimmte Form ist im Deutschen natürlich; die formale Mehrdeutigkeit wird in einer Fußnote erhalten.
- source_word: ἀπέθανον
  choice: sie starben
  rationale: Die schlichte Aussage des griechischen Textes wird beibehalten, ohne durch „sie wurden getötet“ eine im Verb nicht ausdrücklich enthaltene Kausalität einzutragen.
theological_decisions:
- issue: Art der Verunreinigung durch die Speisen
  choice: Verunreinigung durch Speisen, deren Genuss dem Bund widerspricht
  alternative: allgemeine sittliche Verderbnis durch Essgewohnheiten
  rationale: Der unmittelbare makkabäische Kontext betrifft verbotene Speisen und Bundestreue. „Verunreinigen“ lässt die kultische und sittliche Dimension zusammenstehen.
- issue: Bestimmtheit von διαθήκην ἁγίαν
  choice: den heiligen Bund
  alternative: einen heiligen Bund
  rationale: Der fehlende griechische Artikel lässt formal auch eine unbestimmte Wiedergabe zu; der historische und literarische Kontext spricht jedoch deutlich für Israels bekannten Bund mit Gott.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der abschließende knappe Satz „und sie starben“ bewahren die feierliche Eindringlichkeit des griechischen Textes.
