  text: And rulers and elders groaned; virgins and young men grew weak[a], and the beauty of the women was altered.
translation:
  language: de
  text: Und die Herrscher und Ältesten stöhnten; Jungfrauen und junge Männer wurden schwach, und die Schönheit der Frauen wurde verändert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „veränderte sich“. Das Griechische verwendet ein Passiv und bestimmt nicht genauer, wie die Schönheit der Frauen verändert wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστέναξαν
  choice: stöhnten
  rationale: Das Verb bezeichnet einen hörbaren Ausdruck tiefen Leids. „Stöhnten“ bewahrt die körperlich wahrnehmbare Klagekraft besser als das mildere „seufzten“ und legt weniger aus als „klagten“.
- source_word: ἄρχοντες
  choice: Herrscher
  rationale: Der allgemeine Ausdruck bezeichnet Menschen in leitender oder gebietender Stellung. „Herrscher“ gibt den gesellschaftlichen Rang wieder, ohne erblichen Adel vorauszusetzen.
- source_word: πρεσβύτεροι
  choice: Älteste
  rationale: Hier sind wahrscheinlich anerkannte ältere Repräsentanten der Gemeinschaft gemeint und nicht lediglich Männer höheren Alters.
- source_word: παρθένοι
  choice: Jungfrauen
  rationale: Der griechische Ausdruck bezeichnet ausdrücklich unverheiratete beziehungsweise jungfräuliche Frauen; „Jungfrauen“ erhält diese markierte Bedeutung.
- source_word: νεανίσκοι
  choice: junge Männer
  rationale: Die Bezeichnung meint junge männliche Personen. „Junge Männer“ ist im heutigen Deutsch klar und natürlich.
- source_word: ἠσθένησαν
  choice: wurden schwach
  rationale: Das Verb bedeutet, schwach oder kraftlos zu sein beziehungsweise zu werden. Der Kontext und der Aorist lassen sich natürlich mit „wurden schwach“ wiedergeben.
- source_word: τὸ κάλλος
  choice: die Schönheit
  rationale: Das Substantiv bezeichnet Schönheit oder ansprechendes Aussehen; „Schönheit“ ist die direkte und natürliche Entsprechung.
- source_word: ἠλλοιώθη
  choice: veränderte sich
  rationale: Das Passiv bezeichnet eine Veränderung, ohne deren genaue Art zu bestimmen. „Veränderte sich“ klingt im Deutschen natürlich und vermeidet die unbelegte Präzisierung „verblasste“ oder „wurde entstellt“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. Die Reihung der gesellschaftlichen und altersbezogenen Gruppen bleibt erhalten; die abschließende Veränderung der Schönheit wird bewusst nicht näher ausgedeutet.
