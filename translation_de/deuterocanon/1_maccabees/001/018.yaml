  text: And he waged war against Ptolemy the king of Egypt[a]; and Ptolemy was routed before him and fled[b], and many fell wounded.
translation:
  language: de
  text: Und er führte Krieg gegen Ptolemäus, den König von Ägypten. Ptolemäus wurde vor ihm zurückgeschlagen[a] und floh; viele Verwundete fielen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „musste vor ihm zurückweichen“. Das griechische Verb kann allgemein bedeuten, dass jemand zurückgetrieben oder besiegt wurde; „wurde zurückgeschlagen“ hebt den militärischen Zusammenhang hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Viele Verwundete fielen.“ Die Wendung kann zahlreiche Opfer des Kampfes bezeichnen, ohne ausdrücklich festzulegen, ob sie nur verwundet wurden oder dabei umkamen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεστήσατο πόλεμον
  choice: führte Krieg
  rationale: Die griechische Wendung bezeichnet das Beginnen beziehungsweise Führen eines bewaffneten Konflikts. „führte Krieg“ ist im Deutschen natürlich und gibt den militärischen Sinn wieder, ohne das Einsetzen des Krieges stärker zu betonen, als der Ausdruck verlangt.
- source_word: πρὸς
  choice: gegen
  rationale: In Verbindung mit πόλεμον bezeichnet die Präposition die feindliche Ausrichtung des Krieges.
- source_word: ἐνετράπη
  choice: wurde zurückgeschlagen
  rationale: Das Passiv kann ein Zurückweichen oder eine Niederlage bezeichnen. „wurde zurückgeschlagen“ passt zum militärischen Zusammenhang und bewahrt die Grundvorstellung des Zurückgetriebenwerdens.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: vor ihm
  rationale: Die Wendung beschreibt, dass Ptolemäus angesichts seines Gegners zurückweichen musste. „vor ihm“ gibt die knappe Bildsprache des Griechischen wieder.
- source_word: ἔφυγεν
  choice: floh
  rationale: Das Verb bezeichnet unmittelbar die Flucht aus der Kampfhandlung.
- source_word: ἔπεσαν
  choice: fielen
  rationale: Die griechische Kampfformulierung wird beibehalten; sie legt für sich allein nicht ausdrücklich fest, ob alle Betroffenen starben.
- source_word: τραυματίαι πολλοί
  choice: viele fielen verwundet
  rationale: Die Formulierung erhält sowohl das Fallen als auch den Bezug auf Verwundete beziehungsweise Verwundung, ohne die Stelle eindeutig auf Überlebende oder Tote festzulegen.
