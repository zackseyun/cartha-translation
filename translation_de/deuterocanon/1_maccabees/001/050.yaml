  text: And whoever does not act according to the word of the king shall die[a].
translation:
  language: de
  text: Und wer nicht nach dem Wort des Königs handelt, wird sterben[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem Befehl des Königs“. Im Griechischen steht „nach dem Wort des Königs“; im Zusammenhang ist damit seine Anordnung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ ποιήσῃ
  choice: wer nicht … handelt
  rationale: Die Verbindung mit ἄν und dem Aorist Konjunktiv bezeichnet allgemein jeden, auf den die Bedingung zutrifft. ποιέω meint hier das Befolgen beziehungsweise Ausführen der königlichen Anordnung; „handelt“ ist im Deutschen natürlich und bleibt näher am allgemeinen griechischen Verb als „ausführt“.
- source_word: κατὰ τὸ ῥῆμα
  choice: nach dem Wort
  rationale: ῥῆμα bedeutet wörtlich „Wort“, „Ausspruch“ oder „Äußerung“. Im Zusammenhang bezeichnet es einen königlichen Befehl, doch der griechische Text verwendet keinen ausdrücklich technischen Ausdruck für „Befehl“. Die wörtliche Formulierung bleibt daher im Haupttext erhalten; die kontextuelle Bedeutung wird in der Fußnote genannt.
- source_word: τοῦ βασιλέως
  choice: des Königs
  rationale: Der Genitiv bezeichnet den König als Urheber des Wortes beziehungsweise der Anordnung. „Des Königs“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: ἀποθανεῖται
  choice: wird sterben
  rationale: Die Futurform von ἀποθνῄσκω bedeutet unmittelbar „wird sterben“. Der Zusammenhang lässt eine angedrohte Todesstrafe erkennen, nennt aber weder ausdrücklich eine Hinrichtung noch deren Vollstrecker; „wird sterben“ bewahrt diese formale Offenheit.
