base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/048.yaml
  text: and to leave their sons uncircumcised[a], to make their souls abominable with every unclean thing, and to profane them[b],
translation:
  language: de
  text: und ihre Söhne unbeschnitten zu lassen, ihre Seelen durch alles Unreine abscheulich zu machen[a] und sie zu entweihen[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Seelen durch alles Unreine zu beflecken“ beziehungsweise „ihre Personen dadurch verabscheuungswürdig zu machen“. Das griechische Verb kann sowohl Abscheu als auch Verunreinigung hervorheben; „Seelen“ kann hier auch die Personen selbst bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen ist bei „zu entweihen“ kein Objekt ausdrücklich genannt; es ist aus „ihre Seelen“ im vorangehenden Satzteil zu ergänzen. Dem Sinn nach kann dies die Menschen als Ganze einschließen.
    reason: referent_clarification
lexical_decisions:
- source_word: ἀφεῖναι
  choice: zu lassen
  rationale: Der Aoristinfinitiv von ἀφίημι bezeichnet hier, jemanden in einem bestimmten Zustand zu lassen; die knappe Form passt zum Zusammenhang einer angeordneten Maßnahme.
- source_word: τοὺς υἱοὺς αὐτῶν
  choice: ihre Söhne
  rationale: υἱούς bezeichnet ausdrücklich die Söhne; dies entspricht auch dem unmittelbaren Bezug auf die Beschneidung.
- source_word: ἀπεριτμήτους
  choice: unbeschnitten
  rationale: Die direkte und geläufige Wiedergabe bewahrt die bundesbezogene und rituelle Bedeutung.
- source_word: βδελύξαι
  choice: abscheulich zu machen
  rationale: Die Wiedergabe erhält den im Verb liegenden Gedanken des Abscheus und beschränkt ihn nicht vorschnell auf bloße rituelle Verunreinigung.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ihre Seelen
  rationale: ψυχή kann Seele, Leben oder Person bedeuten. „Seelen“ bewahrt hier das moralisch-religiöse Gewicht, ohne die mögliche weitere Bedeutung zu verschweigen.
- source_word: ἐν παντὶ ἀκαθάρτῳ
  choice: durch alles Unreine
  rationale: Die Formulierung gibt den instrumentalen Sinn von ἐν wieder und lässt den umfassenden Bezug auf rituell Unreines bestehen.
- source_word: βεβηλώσαι
  choice: zu entheiligen
  rationale: βεβηλόω bedeutet, etwas seiner Heiligkeit zu berauben beziehungsweise zu entweihen. „Entheiligen“ bewahrt diese Bedeutung und unterscheidet sie vom vorausgehenden Abscheulichmachen.
theological_decisions:
- issue: Bedeutung von ψυχή im rituell-bundestheologischen Zusammenhang
  choice: ihre Seelen
  alternative: ihre Personen / ihr Leben
  rationale: Der Zusammenhang betrifft die erzwungene Aufgabe von Bundeszeichen und den Umgang mit Unreinem. „Seelen“ erhält die religiöse und moralische Schwere, während eine Fußnote auf den weiteren Bedeutungsumfang hinweist.
- issue: Bezug des Objekts bei βεβηλώσαι
  choice: „sie“ bezieht sich grammatisch auf „ihre Seelen“
  alternative: inhaltlich kann die Aussage zugleich die betroffenen Menschen als Ganze betreffen
  rationale: Das griechische feminine Pluralpronomen ist grammatisch auf τὰς ψυχὰς αὐτῶν zurückbezogen; die deutsche Form „sie“ lässt diesen Bezug ohne erklärende Fußnote weniger deutlich erkennen.
translation_notes:
  register: Moderner, würdevoller Standardstil. Die Infinitivreihe und das abschließende Komma bleiben erhalten, weil der Vers syntaktisch die vorausgehende Anordnung fortsetzt. „Abscheulich zu machen“ ist bewusst markanter als eine glättende Wiedergabe mit „verunreinigen“ und bildet βδελύξαι genauer ab.
