- from: Nach seinem Tod setzten sie sich alle Diademe[a] auf, und nach ihnen ihre Söhne, viele Jahre lang. So vermehrten sie das Unheil im Land.[b]
  to: Nach seinem Tod setzten sie alle Diademe[a] auf, und ihre Söhne nach ihnen taten es viele Jahre lang. Sie vermehrten die Übel im Land.[b]
  rationale: Die Revision stellt durch die Stellung von „alle“ klar, dass alle Nachfolger Diademe anlegten, ohne eine Verteilung der einzelnen Diademe zu behaupten. Das ergänzte „taten es“ überträgt die griechische Ellipse verständlich und bewahrt die Aussage über die Söhne und die lange Dauer. „Übel“ erhält Plural und Bedeutungsweite von κακά. Die Fußnote b wird gestrafft, weil der revidierte Haupttext die zuvor als „wörtlich“ zitierte Formulierung selbst enthält.
