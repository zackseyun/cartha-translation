base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/009.yaml
  text: And they all put on crowns after his death[a], and their sons after them for many years[b]; and they multiplied evils in the land.
translation:
  language: de
  text: Nach seinem Tod setzten sie alle Diademe[a] auf, und ihre Söhne nach ihnen taten es viele Jahre lang. Sie vermehrten die Übel im Land.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Diadem war eine königliche Kopfbinde und diente als Zeichen der Königsherrschaft.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann sowohl moralisch Böses als auch Unheil und schädliche Folgen bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθεντο
  choice: setzten sie sich … auf
  rationale: Der griechische Medium-Aorist bezeichnet hier das Anlegen beziehungsweise Aufsetzen königlicher Insignien und wird im Deutschen konkret und natürlich wiedergegeben.
- source_word: διαδήματα
  choice: Diademe
  rationale: Das Wort bezeichnet spezifisch die königliche Kopfbinde als Herrschaftszeichen. „Diademe“ ist im Deutschen verständlich und genauer als das allgemeinere „Kronen“.
- source_word: μετὰ τὸ ἀποθανεῖν αὐτόν
  choice: Nach seinem Tod
  rationale: Die Konstruktion mit μετά und substantiviertem Infinitiv drückt die Zeit nach Alexanders Tod aus.
- source_word: ὀπίσω αὐτῶν
  choice: nach ihnen
  rationale: Im dynastischen Zusammenhang bezeichnet die Wendung die zeitliche beziehungsweise erbliche Nachfolge, nicht eine räumliche Position.
- source_word: ἔτη πολλά
  choice: viele Jahre lang
  rationale: Der Akkusativ gibt die zeitliche Dauer an; diese Wiedergabe ist idiomatisch und genau.
- source_word: ἐπλήθυναν
  choice: vermehrten
  rationale: 'Das Verb hat aktive Bedeutung: Sie ließen die Übel zahlreicher werden beziehungsweise brachten mehr davon hervor.'
- source_word: κακὰ
  choice: das Unheil
  rationale: „Unheil“ kann sowohl schuldhaft Böses als auch dessen schädliche Folgen umfassen und bewahrt damit die semantische Breite des griechischen Plurals.
- source_word: ἐν τῇ γῇ
  choice: im Land
  rationale: Im historischen Zusammenhang ist das betreffende Land gemeint, nicht die gesamte Erde.
theological_decisions:
- issue: Bedeutungsumfang von κακὰ
  choice: das Unheil
  alternative: das Böse; die Übel; schlimme Zustände
  rationale: Der Ausdruck bleibt bewusst weit und kann moralische Bosheit sowie Leiden, Schäden und politische Not bezeichnen. Die Übersetzung legt sich nicht einseitig auf nur einen Aspekt fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache des Aufsetzens königlicher Insignien bleibt erhalten; der letzte Satz bewahrt die inhaltliche Weite von κακὰ.
