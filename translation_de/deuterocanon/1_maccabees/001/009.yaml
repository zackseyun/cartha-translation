  naturalness: Eine ausdrücklich wiederholte Verbform für die Söhne macht die dynastische Nachfolge und die Dauerangabe klar und klingt im modernen Standarddeutsch natürlich.
  terminology: „Diademe“ ist als präzise Bezeichnung königlicher Insignien möglich; die Erklärung in der Fußnote ist hilfreich. „Übel“ bewahrt im Unterschied zu singularischem „Unheil“ den Plural und die offene Bandbreite von κακά besser.
