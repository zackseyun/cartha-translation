  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des Griechischen zuverlässig wieder: ἐσείσθη mit „bebte“, γῆ mit „Erde“, die Bewohnerbeziehung in ἐπὶ τοὺς κατοικοῦντας αὐτήν, die umfassende Bezeichnung „das ganze Haus Jakob“ sowie die Metapher von ἐνεδύσατο αἰσχύνην. „Unter ihren Bewohnern“ ist eine natürliche deutsche Wiedergabe der im Griechischen bildhaft bzw. syntaktisch nicht ganz glatten Beziehung des Bebens zu den Bewohnern und legt keine zusätzliche kausale Deutung fest.'
