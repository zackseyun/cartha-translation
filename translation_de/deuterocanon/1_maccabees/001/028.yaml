  text: And the earth shook for those who dwelt on it[a], and the whole house of Jacob clothed itself with shame.
translation:
  language: de
  text: Und die Erde bebte unter ihren Bewohnern[a], und das ganze Haus Jakob kleidete sich in Schande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land bebte“. Das griechische Wort γῆ kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσείσθη
  choice: bebte
  rationale: Der Aorist Passiv von σείω bezeichnet ein Erschüttern oder Beben. „bebte“ ist im Deutschen natürlich und lässt offen, ob das Bild wörtlich, metaphorisch oder in beiderlei Sinn gemeint ist.
- source_word: ἡ γῆ
  choice: die Erde
  rationale: γῆ kann sowohl „Erde“ als auch „Land“ bedeuten. Der erhöhte Klagecharakter und die folgende Bezeichnung ihrer Bewohner sprechen für „Erde“, während die mögliche engere Bedeutung in einer Fußnote erhalten bleibt.
- source_word: ἐπὶ τοὺς κατοικοῦντας αὐτήν
  choice: unter ihren Bewohnern
  rationale: Die Wendung bezeichnet die Bewohner als die vom Beben betroffenen Menschen. „unter ihren Bewohnern“ gibt dies in natürlichem Deutsch wieder, ohne die Richtung oder Wirkung des Geschehens unnötig festzulegen.
- source_word: πᾶς ὁ οἶκος Ἰακώβ
  choice: das ganze Haus Jakob
  rationale: Die traditionelle biblische Wendung bleibt erhalten und wird nicht deutend zu „ganz Israel“ erweitert.
- source_word: ἐνεδύσατο
  choice: kleidete sich
  rationale: Das Medium von ἐνδύω bedeutet „sich anziehen“ oder „sich kleiden“. Die konkrete Kleidungsmetapher wird bewahrt.
- source_word: αἰσχύνην
  choice: in Schande
  rationale: αἰσχύνη bezeichnet Scham oder Schande. In Verbindung mit dem Kleidungsbild ist „in Schande“ idiomatisch und wahrt zugleich den öffentlichen wie den inneren Aspekt des griechischen Ausdrucks.
theological_decisions:
- issue: Ob γῆ enger als „Land“ oder weiter als „Erde“ wiederzugeben ist
  choice: die Erde
  alternative: das Land
  rationale: Die dichterische Klagesprache erlaubt die umfassendere Wiedergabe „Erde“. Da γῆ jedoch auch das Land meinen kann, wird diese echte lexikalische Mehrdeutigkeit in der Fußnote ausgewiesen.
- issue: Ob die Kleidungsmetapher in ἐνεδύσατο αἰσχύνην erhalten bleiben soll
  choice: kleidete sich in Schande
  alternative: war von Schande erfüllt
  rationale: Die ausdrückliche Metapher des griechischen Textes trägt zur poetischen Kraft des Verses bei und sollte nicht durch eine abstrakte Umschreibung eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter biblischer Bildsprache. „Haus Jakob“ erhält die traditionelle gemeinschaftliche Bezeichnung; die Syntax wurde für natürliche deutsche Lesbarkeit maßvoll geglättet.
