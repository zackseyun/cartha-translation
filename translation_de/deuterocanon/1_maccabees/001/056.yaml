  text: And the books of the law that they found, they tore to pieces and burned with fire.
translation:
  language: de
  text: Und die Bücher des Gesetzes, die sie fanden, zerrissen sie und verbrannten sie im Feuer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ βιβλία
  choice: die Bücher
  rationale: βιβλία bezeichnet allgemein schriftliche Bücher oder Dokumente. „Bücher“ ist im modernen Deutsch natürlich und legt sich nicht unnötig auf die historische Form von Schriftrollen fest.
- source_word: τοῦ νόμου
  choice: des Gesetzes
  rationale: Der Ausdruck bezieht sich hier auf das jüdische Gesetz, die Tora. „Des Gesetzes“ gibt die griechische Form eng wieder; die Großschreibung kennzeichnet im Deutschen den konkreten religiösen Bezug.
- source_word: ἃ εὗρον
  choice: die sie fanden
  rationale: Der Relativsatz wird unmittelbar und idiomatisch wiedergegeben, ohne ihn durch „alle, die“ oder „was immer“ distributiv zu verstärken.
- source_word: κατασχίσαντες
  choice: zerrissen sie
  rationale: Das Partizip bezeichnet gewaltsames Zerreißen. Als koordiniertes finites Verb klingt es im deutschen Erzählstil natürlich und bewahrt die begleitende Handlung.
- source_word: ἐνεπύρισαν πυρί
  choice: verbrannten sie im Feuer
  rationale: Das Verb bezeichnet Verbrennen oder In-Brand-Setzen; πυρί nennt ausdrücklich das Feuer. „Im Feuer verbrannten“ bewahrt diese nachdrückliche, im Deutschen jedoch noch natürliche Formulierung.
