  text: And the king sent letters by the hand of messengers to Jerusalem and the cities of Judah[a], that they should follow laws foreign to the land,
translation:
  language: de
  text: Und der König sandte durch Boten Schreiben nach Jerusalem und in die Städte Judäas mit der Anweisung, Gesetzen zu folgen, die dem Land fremd waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bräuchen, die dem Land fremd waren“. Das griechische Wort kann sowohl Gesetze als auch herkömmliche Bräuche und Praktiken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλία
  choice: Schreiben
  rationale: Im administrativen Zusammenhang bezeichnet βιβλία schriftliche Mitteilungen beziehungsweise königliche Anordnungen, nicht Bücher im heutigen Sinn. „Schreiben“ ist im Deutschen natürlich und lässt die genaue Dokumentart offen.
- source_word: ἐν χειρὶ ἀγγέλων
  choice: durch Boten
  rationale: Die Wendung bedeutet wörtlich „in der Hand von Boten“, bezeichnet hier aber die Übermittlung beziehungsweise Vermittlung. „Durch Boten“ gibt die Funktion idiomatisch wieder.
- source_word: εἰς Ἰερουσαλὴμ καὶ τὰς πόλεις Ἰούδα
  choice: nach Jerusalem und in die Städte Judas
  rationale: Die wechselnden deutschen Präpositionen entsprechen den Zielangaben natürlich; „Judas“ bewahrt die geografische Bezeichnung des griechischen Textes.
- source_word: προπορεύθηναι ὀπίσω
  choice: zu folgen
  rationale: Die ungewöhnliche Verbindung bezeichnet das Nachgehen beziehungsweise die Übernahme eines vorgegebenen Weges. Im Zusammenhang der königlichen Schreiben drückt „folgen“ die geforderte Befolgung klar aus.
- source_word: νομίμων
  choice: Gesetzen
  rationale: νόμιμα kann Gesetze, Satzungen, Bräuche oder feststehende Praktiken bezeichnen. „Gesetze“ wahrt hier den normativen und obrigkeitlichen Charakter, während die Fußnote die weitere Bedeutung nennt.
- source_word: ἀλλοτρίων τῆς γῆς
  choice: die dem Land fremd waren
  rationale: Die attributive Beziehung wird als Relativsatz natürlich wiedergegeben. „Dem Land“ bewahrt die knappe, nicht näher bestimmte Ortsangabe des Ausgangstextes.
theological_decisions:
- issue: Bedeutungsumfang von νόμιμα im Verfolgungskontext
  choice: Gesetze
  alternative: Bräuche; Satzungen; Gebräuche
  rationale: Die königliche Anordnung hat rechtlich-normative Kraft, doch das Wort kann zugleich religiöse und gesellschaftliche Bräuche umfassen. Die Hauptübersetzung betont die Verbindlichkeit; die Fußnote bewahrt die lexikalische Offenheit.
- issue: Funktion des Infinitivs προπορεύθηναι nach dem Versenden der Schreiben
  choice: Darin befahl er ihnen, ... zu folgen
  alternative: damit sie ... folgten; ihnen ... zu folgen
  rationale: Der Infinitiv gibt Inhalt beziehungsweise Zweck der königlichen Schreiben an. „Darin befahl er ihnen“ macht die direktive Funktion im Deutschen deutlich, ohne den sachlichen Inhalt zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schreiben“ und „durch Boten“ sind klar und administrativ passend; die Satzteilung vermeidet einen schwerfälligen Periodenbau. Die Fußnote erhält die echte Bedeutungsbreite von νόμιμα.
