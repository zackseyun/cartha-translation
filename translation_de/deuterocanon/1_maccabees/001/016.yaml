- from: Und als das Königreich vor Antiochus gefestigt war[a], unternahm er es, über das Land Ägypten zu herrschen, damit er über die beiden Königreiche herrsche.
  to: Als Antiochus’ Herrschaft gesichert war[a], nahm er sich vor, über das Land Ägypten zu herrschen, damit er über die beiden Königreiche herrsche.
  rationale: Die Revision ersetzt die im Deutschen unverständliche wörtliche Konstruktion „vor Antiochus“ durch die kontextuell naheliegende Aussage, dass Antiochus’ Herrschaft gesichert war. Die Fußnote erhält die formale griechische Ausdrucksweise und weist auf die damit verbundene Nuance hin. „Nahm er sich vor“ verbessert die idiomatische Wiedergabe von ὑπέλαβεν, während Zweck, Territorialbezug und die zwei Königreiche unverändert erhalten bleiben.
