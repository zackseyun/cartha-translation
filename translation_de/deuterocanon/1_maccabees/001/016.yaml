  source_fidelity: Die Übersetzung gibt den politischen Sinn von ἡτοιμάσθη und den finalen Zusammenhang von ὅπως zutreffend wieder. Die Wendung ἐνώπιον Ἀντιόχου ist jedoch mit „vor Antiochus“ im Deutschen weder idiomatisch noch in ihrer kontextuellen Funktion klar verständlich. „Antiochus gesichert“ gibt den hier naheliegenden Sinn wieder, ohne weitergehende historische Deutung hinzuzufügen.
  naturalness: Der Eingang „Und als das Königreich vor Antiochus gefestigt war“ wirkt im modernen Standarddeutschen syntaktisch und semantisch befremdlich. „Als Antiochus’ Herrschaft gesichert war“ ist natürlich und bewahrt den knappen erzählenden Registerton. Die übrige Satzführung ist verständlich; „unternahm er es“ ist möglich, aber „nahm er sich vor“ ist im Deutschen flüssiger und gibt den handlungsbezogenen Sinn von ὑπέλαβεν mit Infinitiv angemessen wieder.
  terminology: „Herrschaft“ für die erste βασιλεία passt angesichts der Sicherung von Antiochus’ Stellung; „Königreiche“ für die zwei später genannten politischen Reiche wahrt die begriffliche Unterscheidung. Antiochus und Ägypten sind korrekt geschrieben. Es liegen keine besonderen theologischen Fachbegriffe vor.
