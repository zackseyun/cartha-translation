  text: And the kingdom was established before Antiochus[a], and he undertook to rule the land of Egypt, so that he might rule over the two kingdoms.
translation:
  language: de
  text: Als Antiochus’ Herrschaft gesichert war[a], nahm er sich vor, über das Land Ägypten zu herrschen, damit er über die beiden Königreiche herrsche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „als die Königsherrschaft vor Antiochus bereitgemacht war“. Die griechische Formulierung kann bedeuten, dass die Herrschaft für Antiochus gesichert war, bevor er sich Ägypten zuwandte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡτοιμάσθη
  choice: gefestigt war
  rationale: Das Passiv von ἑτοιμάζω bedeutet wörtlich „bereitet/bereitgemacht wurde“. Im politischen Zusammenhang bezeichnet es hier wahrscheinlich, dass das Königreich für Antiochus gesichert oder geordnet war. „gefestigt war“ gibt diesen Sinn natürlich wieder, ohne die wörtliche Bildlichkeit völlig aufzugeben.
- source_word: ἡ βασιλεία
  choice: das Königreich
  rationale: βασιλεία kann Königtum, Herrschaft oder Königreich bedeuten. Die anschließende Rede von den „beiden Königreichen“ legt hier den territorial-politischen Sinn nahe.
- source_word: ἐνώπιον Ἀντιόχου
  choice: vor Antiochus
  rationale: Die formale Bedeutung der Wendung wird beibehalten. Kontextuell kann sie besagen, dass das Königreich für Antiochus bereitstand oder ihm gesichert war; diese Nuance wird in der Fußnote erläutert.
- source_word: ὑπέλαβεν
  choice: unternahm er es
  rationale: ὑπολαμβάνω kann unter anderem „aufnehmen“ oder „unternehmen“ bedeuten. Mit dem Infinitiv bezeichnet es hier, dass Antiochus den Plan beziehungsweise Versuch aufnahm, Ägypten zu beherrschen.
- source_word: βασιλεῦσαι
  choice: über … zu herrschen
  rationale: Das Verb bezeichnet die Ausübung königlicher Herrschaft. Mit einem Gebiet als Bezug ist „über … herrschen“ im Deutschen natürlich und präzise.
- source_word: γῆς Αἰγύπτου
  choice: das Land Ägypten
  rationale: Die Genitivverbindung wird nahe am Griechischen wiedergegeben und bewahrt die territoriale Betonung.
- source_word: ὅπως
  choice: damit
  rationale: ὅπως leitet hier einen Zwecksatz ein; „damit“ gibt diese finale Bedeutung im modernen Deutschen klar wieder.
- source_word: ἐπὶ τὰς δύο βασιλείας
  choice: über die beiden Königreiche
  rationale: Die Wendung bezeichnet zwei getrennte Reiche, das bereits von Antiochus beherrschte und Ägypten. „die beiden“ gibt den bestimmten griechischen Ausdruck direkt wieder.
