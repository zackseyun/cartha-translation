translation:
  language: de
  text: und das Heiligtum und die Heiligen[a] zu verunreinigen;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die heiligen Menschen«. Wörtlich: »die Heiligen«; gemeint sein können die Menschen, die Gott geheiligt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾶναι
  choice: zu verunreinigen
  rationale: Der Infinitiv bezeichnet das kultische oder sittliche Unreinmachen. »Verunreinigen« gibt diesen kultischen Sinn im Deutschen genauer wieder als das stärker auf Entweihung ausgerichtete »entweihen«.
- source_word: ἁγίασμα
  choice: das Heiligtum
  rationale: Im Zusammenhang der gegen den jüdischen Gottesdienst gerichteten Anordnungen bezeichnet das Wort am ehesten den Tempel als heiligen Ort.
- source_word: ἁγίους
  choice: die Heiligen
  rationale: Die maskuline Pluralform ist substantivisch gebraucht und bezieht sich grammatisch am ehesten auf Menschen. »Die Heiligen« wahrt die knappe Formulierung und ihre mögliche Bedeutungsbreite.
theological_decisions:
- issue: Bezug von ἁγίους
  choice: Menschen, die Gott geheiligt sind (»die Heiligen«)
  alternative: '»die heiligen Menschen«; weniger wahrscheinlich: »die heiligen Dinge«'
  rationale: Der maskuline Akkusativ Plural spricht für Personen, nicht für Sachen. Die Übersetzung legt jedoch nicht fest, ob damit das ganze geheiligte Volk oder eine bestimmte Gruppe wie die Priester gemeint ist.
translation_notes:
  register: Natürliche, würdevolle Standardsprache. Die Satzstellung bewahrt den Anschlusscharakter des griechischen Versfragments. »Die Heiligen« erhält die personelle und zugleich nicht näher bestimmte Aussage des griechischen Ausdrucks.
