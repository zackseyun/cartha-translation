base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/006.yaml
  text: And he called his honored servants[a], who had been brought up with him from youth, and divided his kingdom among them while he was still alive.
translation:
  language: de
  text: Er rief seine angesehenen Gefährten[a] zu sich, die seit seiner Jugend mit ihm aufgewachsen waren, und teilte noch zu seinen Lebzeiten sein Reich unter ihnen auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort paides kann „Kinder“, „Jungen“ oder „Diener“ bedeuten. Die Zusätze „angesehen“ und „seit seiner Jugend mit ihm aufgewachsen“ sprechen hier für vertraute Gefährten am Königshof, nicht für leibliche Söhne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: rief … zu sich
  rationale: Das Verb bedeutet „rufen“ oder „herbeirufen“. „Rief … zu sich“ gibt den Zusammenhang natürlich und ohne unnötige Förmlichkeit wieder.
- source_word: τοὺς παῖδας αὐτοῦ
  choice: seine … Diener
  rationale: παῖς kann „Kind“, „Junge“ oder „Diener“ bedeuten. Die nachfolgenden Bezeichnungen als angesehene, mit ihm aufgewachsene Personen weisen hier auf vertraute Männer seines Hofes, nicht auf leibliche Söhne.
- source_word: ἐνδόξους
  choice: angesehenen
  rationale: Das Adjektiv bezeichnet Personen von Rang und Ansehen. „Angesehen“ ist im Deutschen würdig und kontextgemäß, ohne das stärker klingende „ruhmreich“ zu verwenden.
- source_word: συνεκτρόφους αὐτοῦ ἀπὸ νεότητος
  choice: die von Jugend an mit ihm aufgewachsen waren
  rationale: συνεκτρόφους bezeichnet gemeinsam mit jemandem Aufgezogene; die Relativsatzform gibt diese Beziehung im Deutschen klar und natürlich wieder. ἀπὸ νεότητος markiert den Beginn in der Jugend.
- source_word: διεῖλεν
  choice: teilte … unter ihnen auf
  rationale: Das Verb bezeichnet ein Teilen oder Verteilen. Die deutsche Fügung macht deutlich, dass mehreren Personen Anteile zugewiesen wurden.
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: sein Reich
  rationale: βασιλεία kann Königsherrschaft, Königtum oder Reich bedeuten. Da es unter mehreren Personen aufgeteilt wird, ist hier die territorial-politische Bedeutung „Reich“ am naheliegendsten.
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: noch zu seinen Lebzeiten
  rationale: Der Genitivus absolutus betont, dass die Aufteilung vor seinem Tod geschah. Die gewählte Formulierung ist knapp, idiomatisch und bewahrt diese zeitliche Aussage.
