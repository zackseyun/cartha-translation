  source_fidelity: Die zeitliche Abfolge des Aoristpartizips und der Wechsel von Singular zu Plural sind zutreffend wiedergegeben. „Zog ... zurück“ fügt jedoch die im griechischen Wortlaut nicht ausdrücklich bezeichnete Rückkehr hinzu; „richteten ein Blutbad an“ kann einen Umfang des Tötens nahelegen, den φονοκτονία nicht zwingend festlegt.
