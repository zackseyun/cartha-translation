  yaml_path: translation/deuterocanon/1_maccabees/001/024.yaml
  text: And after taking everything[a], he went away to his own land. And they committed murder[b], and spoke great arrogance.
translation:
  language: de
  text: Und nachdem er alles genommen hatte, ging er in sein Land. Sie aber begingen Mord[a] und äußerten großen Hochmut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vergossen Blut« oder »richteten ein Gemetzel an«.'
    reason: lexical_alternative
