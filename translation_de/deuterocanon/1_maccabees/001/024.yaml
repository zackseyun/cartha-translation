    text: 'Wörtlich: »redeten große Überheblichkeit«; auch: »sprachen in großem Hochmut«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν πάντα
  choice: nachdem er alles an sich genommen hatte
  rationale: Der Aoristpartizip bezeichnet eine vor dem Fortgehen abgeschlossene Handlung. „An sich genommen“ gibt im Kontext des geraubten Besitzes den Sinn natürlicher wieder als das neutrale „genommen“.
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: zog er in sein Land zurück
  rationale: ἀπέρχομαι bezeichnet das Fortgehen; das Ziel ist sein eigenes Land. „Zurückziehen“ entspricht dem Zusammenhang einer Heimkehr, ohne ein „eigenes“ eigens in den Text einzutragen.
- source_word: ἐποίησαν φονοκτονίαν
  choice: richteten ein Blutbad an
  rationale: φονοκτονία bezeichnet gewaltsames Töten beziehungsweise Blutvergießen. Die deutsche Wendung bewahrt die kollektive und schwere Gewalt des Ausdrucks; das Singular „Mord“ wäre nach „sie“ weniger natürlich und könnte zu eng wirken.
- source_word: ἐλάλησαν ὑπερηφανίαν μεγάλην
  choice: führten vermessene Reden
  rationale: Die ungewöhnliche griechische Verbindung eines Verbs des Redens mit dem Substantiv ὑπερηφανία bezeichnet hochmütiges, anmaßendes Reden. „Vermessene Reden führen“ erhält sowohl den Sprachakt als auch dessen moralischen Ton in würdigem Deutsch.
theological_decisions:
- issue: Moralische Tragweite von φονοκτονίαν
  choice: Blutbad
  alternative: Mord; Blutvergießen; Gemetzel
  rationale: Der Ausdruck verurteilt die Tötungsgewalt deutlich, legt aber nicht zwingend die engere moderne strafrechtliche Kategorie „Mord“ fest. „Blutbad“ bewahrt Schwere und Umfang, ohne diese mögliche Verengung.
- issue: Bedeutung von ὑπερηφανίαν μεγάλην
  choice: vermessene Reden
  alternative: großen Hochmut; in großer Überheblichkeit
  rationale: Die Übersetzung lässt den Hochmut ausdrücklich im Reden hervortreten und deutet ihn nicht als allgemeine innere Haltung um. „Vermessen“ bewahrt den starken moralischen Vorwurf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz gibt die zeitliche Abfolge des griechischen Aoristpartizips klar wieder. Im zweiten Satz hält „Sie aber“ den Wechsel vom Singular zum Plural sichtbar; „aber“ macht diesen Übergang lesbar, ohne eine neue inhaltliche Erklärung einzuführen. Beide Fußnotenmarker stehen im Haupttext.
