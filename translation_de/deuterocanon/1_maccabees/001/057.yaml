base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/057.yaml
  text: And wherever a book of the covenant was found with anyone[a], or if anyone consented to the law[b], the king’s decree put him to death.
translation:
  language: de
  text: Und wo immer bei jemandem ein Buch des Bundes[a] gefunden wurde oder jemand dem Gesetz zustimmte[b], wurde der Betreffende aufgrund des Urteils des Königs getötet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „eine Bundesurkunde“ oder „ein Buch des Gesetzes/Bundes“. Wörtlich steht im Griechischen „ein Buch des Bundes“.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann auch „billigte“ oder „mit dem Gesetz einverstanden war“ bedeuten. Im Zusammenhang kann dies Loyalität gegenüber dem jüdischen Gesetz einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: wo immer
  rationale: 'Gibt den unbestimmt-distributiven Sinn wieder: Die Vorschrift wurde überall dort angewandt, wo ein solcher Fall eintrat.'
- source_word: εὑρίσκετο
  choice: gefunden wurde
  rationale: Das Imperfekt Passiv beschreibt im Zusammenhang ein wiederholtes bzw. übliches Geschehen; die deutsche Formulierung ist natürlich und wahrt den passiven Ausdruck.
- source_word: παρὰ τινι
  choice: bei jemandem
  rationale: Bezeichnet hier, dass sich das Buch bei einer Person bzw. in ihrer Verwahrung befand, ohne einen engeren juristischen Besitzbegriff einzutragen.
- source_word: βιβλίον διαθήκης
  choice: ein Buch des Bundes
  rationale: Die formnahe Wiedergabe bewahrt den biblischen Bundesbezug und lässt offen, ob ein bestimmtes Gesetzbuch, eine Schriftrolle oder allgemeiner eine Bundesurkunde gemeint ist.
- source_word: συνευδόκει
  choice: zustimmte
  rationale: Das Verb bezeichnet Zustimmung, Billigung oder ein Sich-auf-die-Seite-von-etwas-Stellen. „zustimmte“ ist klar und lässt die genaue Art dieser Loyalität offen.
- source_word: τῷ νόμῳ
  choice: dem Gesetz
  rationale: Im Kontext ist das jüdische, überlieferte Gesetz beziehungsweise die Tora gemeint. Die nicht weiter ausgeführte Wiedergabe vermeidet eine interpretierende Ergänzung wie „Gesetz des Mose“.
- source_word: τὸ σύγκριμα τοῦ βασιλέως
  choice: der Erlass des Königs
  rationale: Bezeichnet eine verbindliche königliche Entscheidung oder Anordnung mit Strafwirkung; „Erlass“ ist im Deutschen natürlich und amtlich geprägt.
- source_word: ἐθάνατου αὐτόν
  choice: ließ ihn … töten
  rationale: Das kausative Verb bezeichnet die Verhängung beziehungsweise Herbeiführung der Tötung. Zusammen mit dem königlichen Erlass gibt die Formulierung den staatlich angeordneten Charakter wieder, ohne enger „hinrichten“ festzulegen.
theological_decisions:
- issue: Bezug von τῷ νόμῳ
  choice: „dem Gesetz“ mit kontextuellem Bezug auf das jüdische Gesetz beziehungsweise die Tora
  alternative: „dem Gesetz des Mose“ oder ein allgemeines Gesetz
  rationale: Der Zusammenhang der Unterdrückung jüdischer Lebensweise unter Antiochus weist auf das angestammte jüdische Gesetz. Die knappe Wiedergabe wahrt zugleich die Ausdrucksform des Griechischen und vermeidet eine explizierende dogmatische Festlegung.
- issue: Bedeutungsumfang von βιβλίον διαθήκης
  choice: „ein Buch des Bundes“
  alternative: „eine Bundesurkunde“, „ein Buch des Gesetzes“ oder „eine Schriftrolle des Bundes“
  rationale: Der griechische Ausdruck identifiziert weder eindeutig die materielle Form noch einen bestimmten kanonischen Text. Die formnahe Übersetzung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der griechischen Alternative „oder“. „Bei jemandem“ vermeidet eine übermäßig juristische Präzisierung; „ließ … töten“ bewahrt den amtlich-kausativen Charakter des königlichen Erlasses.
