  naturalness: „Wo immer“ und „bei jemandem“ sind modernes Standarddeutsch. Die Umstellung zu einer passiven Hauptaussage mit „der Betreffende“ löst den Bezug des griechischen Singularpronomens nach dem ersten unpersönlichen Passiv idiomatisch, ohne den Täter oder ein rechtliches Verfahren über den Text hinaus zu präzisieren.
  terminology: „Buch des Bundes“ bewahrt διαθήκη als „Bund“ und die Offenheit des Ausdrucks. „Dem Gesetz zustimmte“ ist als knappe Wiedergabe von συνευδόκει vertretbar. Die Fußnote sollte die möglichen Konnotationen nicht als feststehende Paraphrase ausgeben; insbesondere „treu blieb“ ist kontextuell plausibel, aber nicht die unmittelbare lexikalische Aussage des Verbs.
