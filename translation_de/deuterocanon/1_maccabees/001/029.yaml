  yaml_path: translation/deuterocanon/1_maccabees/001/029.yaml
  text: After two years had passed, the king sent a chief collector of tribute to the cities of Judah, and he came to Jerusalem with a heavy crowd.
translation:
  language: de
  text: Nachdem zwei Jahre vergangen waren, sandte der König einen hohen Beamten für die Tributeinnahmen in die Städte Judas. Dieser kam mit einer großen Schar[a] nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit einer schweren Menge«; gemeint ist eine große, gewichtige Schar. Auch möglich: »mit einer großen Menschenmenge« oder, im Kontext, »mit einer starken Streitmacht«.'
    reason: Die griechische Wendung ἐν ὄχλῳ βαρεῖ bezeichnet unmittelbar eine beträchtliche begleitende Menge bzw. Schar; ob diese ausdrücklich als militärische Streitmacht zu verstehen ist, bleibt im Wortlaut offen.
lexical_decisions:
- source_word: Μετὰ δύο ἐτῶν ἡμερῶν
  choice: Nachdem zwei Jahre vergangen waren
  rationale: Die wörtlich ungewöhnliche Wendung »nach zwei Jahren von Tagen« bezeichnet den Ablauf von zwei Jahren; die deutsche Fassung gibt diesen Zeitsinn natürlich wieder.
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Schlichte und dem würdigen Erzählstil angemessene Wiedergabe des Aorists von »senden«.
- source_word: ἄρχοντα φορολογίας
  choice: einen hohen Beamten für die Tributeinnahmen
  rationale: ἄρχων bezeichnet hier einen Amtsträger mit Autorität, φορολογία den Bereich der Tribut- beziehungsweise Steuererhebung. Die Formulierung vermeidet die Verengung auf einen gewöhnlichen Steuereinnehmer.
- source_word: εἰς τὰς πόλεις Ἰούδα
  choice: in die Städte Judas
  rationale: εἰς bezeichnet die Zielrichtung der Entsendung. »Judas« ist hier die natürliche deutsche Genitivform für das Gebiet Juda.
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: mit einem großen Truppenaufgebot
  rationale: ὄχλος bezeichnet eine Menschenmenge oder Schar, βαρύς wörtlich »schwer« und idiomatisch eine große, beträchtliche Menge. Im gewaltsamen militärisch-administrativen Kontext ist »Truppenaufgebot« naheliegend, bleibt aber als kontextuelle Deutung in einer Fußnote kenntlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem historischem Erzählstil. Der Satz wurde zur eindeutigen Zuordnung von »dieser« geteilt; die Mehrdeutigkeit der abschließenden griechischen Wendung wird durch die Fußnote bewahrt.
