  text: And there was very great wrath against Israel[a].
translation:
  language: de
  text: Da kam überaus großer Zorn über Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „gegen Israel“. Der griechische Text lässt offen, von wem der Zorn ausgeht.'
    reason: Die Präposition ἐπί kann hier als „über“ oder als gegen Israel gerichteter Zorn verstanden werden; zugleich bleibt der Urheber unausgesprochen.
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: So kam
  rationale: Die Wendung bezeichnet hier das Eintreten eines resultierenden Zustands. „So kam“ ist im Deutschen natürlich, wahrt den erzählerischen Zusammenhang und erhält mehr verbale Kraft als ein bloßes „es herrschte“.
- source_word: ὀργὴ μεγάλη ... σφόδρα
  choice: sehr großer Zorn
  rationale: „Zorn“ gibt die starke Gemüts- und Gerichtssprache von ὀργή würdig wieder; μεγάλη und das nachgestellte σφόδρα werden gemeinsam durch „sehr großer“ ausgedrückt.
- source_word: ἐπὶ Ἰσραήλ
  choice: über Israel
  rationale: „Über Israel“ bewahrt die räumlich-bildhafte Offenheit der griechischen Präposition und lässt sowohl Zorn gegen Israel als auch über Israel hereinbrechendes Unheil anklingen, ohne dessen Ursprung festzulegen.
theological_decisions:
- issue: Ursprung und Träger des Zorns
  choice: Der Urheber des Zorns bleibt ungenannt.
  alternative: Gottes Zorn oder der Zorn der Verfolger ausdrücklich benennen
  rationale: Der griechische Satz nennt keinen Handelnden. Eine ausdrückliche Zuordnung zu Gott, den Feinden oder den Umständen würde die im Ausgangstext bestehende theologische Offenheit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzform und die starke Schlussbetonung des griechischen Verses bleiben erhalten; „So kam“ verbindet den Vers natürlich mit dem vorausgehenden Geschehen.
