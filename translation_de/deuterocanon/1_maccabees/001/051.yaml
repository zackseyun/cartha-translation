base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/051.yaml
  text: According to all these words he wrote to his whole kingdom[a], and he appointed overseers over all the people; and he commanded the cities of Judah to offer sacrifices, city by city.
translation:
  language: de
  text: Entsprechend all diesen Worten schrieb er an sein Königreich[a]. Er setzte Aufseher über das ganze Volk ein und befahl den Städten Judas, Stadt für Stadt Opfer darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für sein Königreich“. Der griechische Dativ kann den Bereich bezeichnen, an den beziehungsweise für den er schrieb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάντας τοὺς λόγους τούτους
  choice: Ganz entsprechend diesen Worten
  rationale: κατά bezeichnet hier Übereinstimmung; λόγοι wird formal als „Worte“ wiedergegeben. „Ganz“ nimmt πάντας auf und vermeidet die missverständliche Deutung als zeitliches „nach“.
- source_word: ἔγραψεν τῇ βασιλείᾳ αὐτοῦ
  choice: schrieb er an sein Königreich
  rationale: Der Dativ bezeichnet den Adressatenbereich des Schreibens. Anders als die englische Konsultationsfassung fügt die Übersetzung kein nicht ausdrücklich vorhandenes „ganzes“ hinzu.
- source_word: ἐποίησεν ἐπισκόπους
  choice: setzte Aufseher ... ein
  rationale: ἐπίσκοποι bezeichnet in diesem Zusammenhang königliche Kontroll- oder Aufsichtsbeamte. „Aufseher“ wahrt den Grundsinn, ohne den späteren kirchlichen Amtstitel „Bischöfe“ einzutragen.
- source_word: ἐπὶ πάντα τὸν λαόν
  choice: über das ganze Volk
  rationale: ἐπί mit Akkusativ bezeichnet hier den Zuständigkeits- und Herrschaftsbereich der eingesetzten Aufseher.
- source_word: ἐνετείλατο
  choice: befahl
  rationale: Das Verb drückt einen verbindlichen, autoritativen Befehl aus.
- source_word: ταῖς πόλεσιν Ἰούδα
  choice: den Städten Judas
  rationale: Die Formulierung gibt den griechischen Genitiv knapp wieder; „Judas“ bezeichnet hier das Gebiet Juda.
- source_word: θυσιάζειν
  choice: Opfer darzubringen
  rationale: Die Wendung ist im Deutschen eine natürliche und würdige Wiedergabe des kultischen Opferns.
- source_word: κατὰ πόλιν καὶ πόλιν
  choice: Stadt für Stadt
  rationale: Die wiederholte Singularform hat distributiven Sinn und betont die Durchführung in jeder einzelnen Stadt.
theological_decisions:
- issue: Möglicher anachronistischer Amtssinn von ἐπισκόπους
  choice: Aufseher
  alternative: Bischöfe; Beamte; Inspektoren
  rationale: Der Kontext handelt von königlichen Funktionsträgern zur Durchsetzung des Erlasses, nicht von einem späteren kirchlichen Amt. „Aufseher“ erhält die Aufsichtsfunktion und vermeidet konfessionelle Eintragungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am Griechischen, wird jedoch für einen natürlichen deutschen Lesefluss gegliedert. „Stadt für Stadt“ bewahrt die nachdrückliche distributive Formulierung.
