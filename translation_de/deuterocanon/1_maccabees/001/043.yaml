base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/043.yaml
  text: And many from Israel approved of his worship[a], and they sacrificed to the idols and profaned the Sabbath.
translation:
  language: de
  text: Und viele aus Israel stimmten seinem Gottesdienst zu[a]; sie opferten den Götzen und entheiligten den Sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fanden Gefallen an seinem Gottesdienst“; auch: „billigten seinen Gottesdienst“.'
    reason: Das griechische Verb kann Gefallen, Billigung oder Zustimmung ausdrücken.
lexical_decisions:
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: viele aus Israel
  rationale: Gibt die Zugehörigkeit beziehungsweise Herkunft mit ἀπό quellennah und zugleich in natürlichem Deutsch wieder.
- source_word: ηὐδόκησαν
  choice: stimmten ... zu
  rationale: Bezeichnet hier die willentliche Billigung und Annahme der auferlegten religiösen Praxis, ohne notwendigerweise emotionale Freude auszudrücken.
- source_word: τῇ λατρίᾳ αὐτοῦ
  choice: seinem Gottesdienst
  rationale: λατρεία meint kultischen beziehungsweise religiösen Dienst. „Gottesdienst“ ist im Deutschen verständlich und wahrt den kultischen Sinn; das Possessivpronomen bezieht sich grammatisch auf den zuvor genannten Herrscher.
- source_word: ἔθυσαν
  choice: opferten
  rationale: Direkte, knappe Wiedergabe des kultischen Handelns.
- source_word: τοῖς εἰδώλοις
  choice: den Götzen
  rationale: Im Kontext bezeichnet εἴδωλον als verehrtes Bild eine falsche Gottheit beziehungsweise deren Kultbild; „Götzen“ ist die etablierte biblische Wiedergabe.
- source_word: ἐβεβήλωσαν
  choice: entheiligten
  rationale: Drückt aus, dass etwas Heiliges seiner Heiligkeit beraubt beziehungsweise wie etwas Gewöhnliches behandelt wird.
- source_word: τὸ σάββατον
  choice: den Sabbat
  rationale: Übliche moderne deutsche Bezeichnung des jüdischen heiligen Ruhetags.
theological_decisions:
- issue: Bedeutung von λατρεία im Zusammenhang mit der vom König verlangten Religion
  choice: seinem Gottesdienst
  alternative: seinem Kult; seinem religiösen Dienst
  rationale: „Gottesdienst“ hält den religiös-kultischen Bezug fest, ohne mit „Kult“ unnötig moderne abwertende Nebenbedeutungen einzutragen. Zugleich bleibt offen, ob αὐτοῦ den vom König vorgeschriebenen Gottesdienst oder einen unmittelbar auf ihn bezogenen Kult bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung am Semikolon macht die Zustimmung und die daraus folgenden Handlungen klar, ohne die dreifache Koordination des griechischen Textes inhaltlich zu verändern.
