  source_fidelity: 'Der Text gibt die drei griechischen Hauptaussagen vollständig und in ihrer Reihenfolge wieder: Viele innerhalb Israels billigten die betreffende λατρεία, opferten den Götzen und entheiligten den Sabbat. „Stimmten … zu“ trifft ηὐδόκησαν als zustimmende Annahme angemessen. „Seinem Gottesdienst“ wahrt die im griechischen Genitivpronomen enthaltene, kontextuell zu erschließende Bezugnahme und überinterpretiert sie nicht.'
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Verbindung „seinem Gottesdienst zustimmen“ ist idiomatisch; das Semikolon ist für die koordinierte Handlungsfolge gut lesbar.
