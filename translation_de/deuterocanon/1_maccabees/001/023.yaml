  source_fidelity: 'Der Text gibt alle Bestandteile des Griechischen vollständig und in der richtigen Abfolge wieder: Silber, Gold, die ἐπιθυμητά genannten Geräte sowie die gefundenen verborgenen Schätze. Die zweimalige Wiedergabe von ἔλαβεν mit „nahm“ wahrt die Struktur ohne die Plünderung durch stärkere Verben zusätzlich auszudeuten.'
