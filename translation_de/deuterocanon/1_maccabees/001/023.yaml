base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/023.yaml
  text: And he took the silver and the gold[a], and the precious vessels[b]; and he took the hidden treasures that he found.
translation:
  language: de
  text: Und er nahm das Silber und das Gold und die kostbaren Geräte[a]; auch nahm er die verborgenen Schätze, die er fand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die begehrenswerten“ oder „begehrten Geräte“.'
    reason: lexical_alternative
  - marker: b
    text: „Verborgene Schätze“ kann auch geheime oder verborgene Schatzlager bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: nahm
  rationale: Die neutrale Grundbedeutung von λαμβάνω wird bewahrt; „raubte“ oder „führte weg“ würden den Vorgang kontextuell stärker ausdeuten.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: das Silber und das Gold
  rationale: Die bestimmten Artikel weisen auf konkrete, bereits bekannte Bestände hin und werden im Deutschen beibehalten.
- source_word: τὰ σκεύη τὰ ἐπιθυμητά
  choice: die kostbaren Geräte
  rationale: σκεύη bezeichnet hier Gegenstände beziehungsweise Geräte, wahrscheinlich aus dem Tempelbestand. „Kostbar“ gibt den kontextuellen Sinn von ἐπιθυμητά natürlich wieder; die wörtlichere Bedeutung wird in der Fußnote genannt.
- source_word: τοὺς θησαυροὺς τοὺς ἀποκρύφους
  choice: die verborgenen Schätze
  rationale: Die Wendung bleibt bewusst offen dafür, ob verborgene Wertbestände oder geheime Schatzlager gemeint sind.
- source_word: οὓς εὗρεν
  choice: die er fand
  rationale: Schlichte und genaue Wiedergabe des griechischen Relativsatzes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „nahm“ folgt der griechischen Satzstruktur; „auch“ verbindet die beiden Teilsätze natürlicher als ein Semikolon allein. „Geräte“ ist im Deutschen für kultische Gegenstände verständlich, ohne ihre genaue Art festzulegen.
