  yaml_path: translation/deuterocanon/1_maccabees/001/003.yaml
  text: And he passed on to the ends of the earth, and took plunder from a multitude of nations; and the earth was quiet before him, and he was exalted, and his heart was lifted up.
translation:
  language: de
  text: Und er zog weiter bis an die Enden der Erde und nahm Beute von einer Vielzahl von Völkern. Die Erde wurde still vor ihm; er wurde erhöht, und sein Herz erhob sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wurde stolz.“ Wörtlich: „Sein Herz wurde emporgehoben“; die Wendung kann Hochmut oder Überheblichkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διῆλθεν
  choice: zog weiter
  rationale: Das Verb bezeichnet das Durch- oder Weiterziehen. Im Zusammenhang von Alexanders Eroberungszügen gibt „zog weiter“ die fortschreitende Bewegung wieder, ohne Weg oder Art näher festzulegen.
- source_word: ἕως ἄκρων τῆς γῆς
  choice: bis an die Enden der Erde
  rationale: Die geläufige räumliche Wendung bewahrt die weit ausgreifende, möglicherweise hyperbolische Aussage des Griechischen.
- source_word: ἔλαβεν σκῦλα
  choice: nahm Beute
  rationale: σκῦλα bezeichnet im Krieg erbeutete Güter. „Beute nehmen“ ist im Deutschen klar und dem militärischen Zusammenhang angemessen.
- source_word: πλήθους ἐθνῶν
  choice: von einer Vielzahl von Völkern
  rationale: Die Formulierung bildet sowohl πλήθους als auch ἐθνῶν ab und lässt den Genitiv als Herkunft beziehungsweise Bereich der Beute erkennen.
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: Die Erde wurde still vor ihm
  rationale: ἡσυχάζω kann Ruhe oder Stille bezeichnen. Die Wiedergabe bewahrt das Bild einer unter seiner Macht zur Ruhe gebrachten Welt, ohne ausdrücklich Frieden oder freiwillige Unterwerfung einzutragen.
- source_word: ὑψώθη
  choice: er wurde erhöht
  rationale: Das Passiv bezeichnet seine Erhebung zu hohem Rang oder Ansehen. Die formale Wiedergabe wahrt zugleich die Verbindung zum folgenden Bild des sich erhebenden Herzens.
- source_word: ἐπήρθη ἡ καρδία αὐτοῦ
  choice: sein Herz erhob sich
  rationale: Die deutsche Formulierung erhält das griechische Bild. Es deutet Hochmut an, nennt ihn aber nicht ausdrücklich und bewahrt so die Mehrdeutigkeit des Ausgangstextes.
theological_decisions:
- issue: Moralische Wertung von ἐπήρθη ἡ καρδία αὐτοῦ
  choice: sein Herz erhob sich
  alternative: er wurde stolz
  rationale: Die Wendung hat wahrscheinlich einen negativen Beiklang von Stolz oder Überheblichkeit, doch der griechische Text formuliert bildhaft und nicht mit einem ausdrücklichen Wort für Hochmut. Der Haupttext bewahrt dieses Spannungsverhältnis; die Fußnote erschließt die wahrscheinliche Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde zur besseren Lesbarkeit in zwei Hauptsätze gegliedert; die wiederholte Abfolge der Handlungen und das bildhafte Sprachprofil des Griechischen bleiben erhalten.
