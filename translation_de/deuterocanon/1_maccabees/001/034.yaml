  text: And they stationed there a sinful nation, lawless men, and they strengthened themselves in it.
translation:
  language: de
  text: Und sie stationierten dort ein sündiges Volk, gesetzlose Männer, und machten sich darin stark.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκαν ἐκεῖ
  choice: sie siedelten dort … an
  rationale: ἔθηκαν bezeichnet hier im Kontext das Platzieren beziehungsweise Stationieren von Menschen; „ansiedeln“ gibt dies im natürlichen Deutschen prägnant wieder.
- source_word: ἔθνος ἁμαρτωλόν
  choice: ein sündiges Volk
  rationale: ἔθνος kann „Volk“ oder „Nation“ bedeuten. „Volk“ ist hier für eine dort angesiedelte Menschengruppe natürlicher und bewahrt zusammen mit „sündig“ die wertende Aussage des Griechischen.
- source_word: ἄνδρας παρανόμους
  choice: gesetzlose Männer
  rationale: Die appositionale Wendung erläutert das sündige Volk; παράνομος bezeichnet Menschen, die gegen das Gesetz handeln oder außerhalb des Gesetzes stehen.
- source_word: ἐνίσχυσαν ἐν αὐτῇ
  choice: sie machten sich darin stark
  rationale: Die Wiedergabe bewahrt sowohl die mögliche reflexive Bedeutung von ἐνίσχυσαν als auch den Bezug des femininen αὐτῇ auf die zuvor genannte befestigte Anlage beziehungsweise Burg aus dem Kontext.
theological_decisions:
- issue: Bedeutung von παράνομος im jüdischen Kontext
  choice: gesetzlos
  alternative: frevlerisch / gesetzeswidrig
  rationale: „Gesetzlos“ wahrt den möglichen Bezug auf das Gesetz, ohne ausdrücklich festzulegen, ob ausschließlich die Tora oder allgemeines rechtswidriges Handeln gemeint ist.
- issue: Referent und Bedeutung von ἐνίσχυσαν ἐν αὐτῇ
  choice: sie machten sich darin stark
  alternative: sie befestigten sie / sie gewannen darin an Stärke
  rationale: Das Griechische lässt eine gewisse Spannung zwischen eigener Stärkung und befestigendem Handeln bestehen. Die gewählte Formulierung löst diese nicht unnötig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ enger Bindung an die griechische Satzstruktur. Das Semikolon markiert die Fortführung des Gedankens und die leichte Zäsur vor dem letzten Teilsatz.
