lexical_decisions:
- source_word: ἠγαύθη
  choice: fand … Zustimmung
  rationale: Die seltene Form bezeichnet hier eine positive Bewertung beziehungsweise Billigung. Die deutsche Wendung gibt diese günstige Aufnahme natürlich wieder, ohne eine stärkere Gefühlsregung wie „entzückte“ nahezulegen.
- source_word: ὁ λόγος
  choice: der Vorschlag
  rationale: λόγος verweist im Zusammenhang auf die zuvor geäußerte Anregung beziehungsweise den Plan; „Vorschlag“ macht diesen Bezug im Deutschen klar.
- source_word: ἐν ὀφθαλμοῖς αὐτῶν
  choice: ihre Zustimmung
  rationale: Die wörtliche Wendung „in ihren Augen“ drückt hier ihr positives Urteil aus. „Fand ihre Zustimmung“ überträgt den Sinn idiomatisch; die Bildsprache bleibt in der Fußnote sichtbar.
