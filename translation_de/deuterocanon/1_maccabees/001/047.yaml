translation:
  language: de
  text: Altäre, heilige Bezirke und Götzenbilder zu errichten und Schweine und unreine Tiere[a] zu opfern,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewöhnliche Tiere“; das griechische Adjektiv kann „gewöhnlich, gemein“ bedeuten, meint hier im jüdischen Reinheitskontext aber wahrscheinlich „rituell unrein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομῆσαι
  choice: zu errichten
  rationale: Der Aoristinfinitiv bezeichnet die angeordnete Handlung. „Errichten“ ist bei Altären, heiligen Bezirken und Götzenbildern natürlich und gibt den baulichen Sinn wieder.
- source_word: βωμούς
  choice: Altäre
  rationale: βωμός bezeichnet gewöhnlich einen Opferaltar; „Altäre“ ist die direkte und kontextgerechte Wiedergabe.
- source_word: τεμένη
  choice: heilige Bezirke
  rationale: τέμενος bezeichnet einen ausgesonderten, geweihten Bezirk. „Heilige Bezirke“ bewahrt den räumlichen Sinn genauer als das mögliche, aber weniger präzise „Heiligtümer“.
- source_word: εἴδωλα
  choice: Götzenbilder
  rationale: Im jüdischen polemischen Kultkontext sind nicht neutrale Bilder, sondern Gegenstände heidnischer Verehrung gemeint. „Götzenbilder“ ist im modernen Deutschen klar und würdevoll.
- source_word: θύειν
  choice: zu opfern
  rationale: Der Infinitiv setzt die Reihe der angeordneten Handlungen fort; „opfern“ ist knapp und idiomatisch.
- source_word: ὕεια
  choice: Schweine
  rationale: Das substantivierte Adjektiv bezeichnet Schweine. „Schweine“ ist heutiges Standarddeutsch und passt zum Opferkontext.
- source_word: κτῆνη κοινά
  choice: unreine Tiere
  rationale: κοινός kann wörtlich „gewöhnlich/gemein“ heißen, trägt im jüdischen Reinheitskontext jedoch häufig den Sinn „rituell unrein“. κτῆνη bezeichnet hier allgemein Tiere beziehungsweise Vieh.
theological_decisions:
- issue: Wiedergabe von κοινά im jüdischen Reinheitskontext
  choice: unreine Tiere
  alternative: gewöhnliche Tiere
  rationale: Der Zusammenhang beschreibt kultische Praktiken gegen die Tora. Deshalb vermittelt „unrein“ den wahrscheinlichen kontextuellen Sinn besser als eine rein wörtliche Wiedergabe; die echte lexikalische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Infinitivkonstruktion und das abschließende Komma bleiben erhalten, da der Versausschnitt syntaktisch an den vorausgehenden Befehl anschließt. „Heilige Bezirke“ gibt den räumlichen Gehalt von τεμένη präzise wieder; „Götzenbilder“ macht den polemisch-kultischen Kontext verständlich.
