  text: And on the twenty-fifth day of the month they were sacrificing on the altar that was upon the altar of burnt offering[a].
translation:
  language: de
  text: Und am fünfundzwanzigsten Tag des Monats brachten sie auf dem Altar, der auf dem Brandopferaltar stand, Opfer dar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen hier zwei verschiedene Wörter: „Altar“ (βωμός) und „Brandopferaltar“ (θυσιαστήριον). Der Satz beschreibt einen Altar, der auf dem Brandopferaltar stand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτῃ καὶ εἰκάδι
  choice: am fünfundzwanzigsten Tag
  rationale: Die griechische Datumsformel bezeichnet den fünfundzwanzigsten Tag; die gewählte Form ist im modernen Deutschen natürlich und genau.
- source_word: τοῦ μηνός
  choice: des Monats
  rationale: Der Genitiv gehört zur Datumsangabe und wird entsprechend formal bewahrt.
- source_word: θυσιάζοντες
  choice: brachten sie … Opfer dar
  rationale: Das Partizip wird dem erzählenden Zusammenhang entsprechend als finites Verb wiedergegeben. „Opfer darbringen“ ist eine natürliche, würdige Wiedergabe der kultischen Handlung.
- source_word: ἐπὶ τὸν βωμόν
  choice: auf dem Altar
  rationale: ἐπί mit Akkusativ bezeichnet hier die auf die Altarfläche gerichtete Opferhandlung; im Deutschen ist „auf dem Altar“ idiomatisch.
- source_word: βωμός
  choice: Altar
  rationale: Der gewöhnliche Ausdruck wird ohne den aus dem Kontext erschlossenen Zusatz „heidnisch“ wiedergegeben.
- source_word: θυσιαστήριον
  choice: Brandopferaltar
  rationale: Die spezifischere Wiedergabe erhält die Unterscheidung zwischen den beiden griechischen Kultbegriffen und bezeichnet im Tempelzusammenhang den bestehenden Opferaltar.
theological_decisions:
- issue: Unterscheidung zwischen βωμός und θυσιαστήριον im Zusammenhang der Entweihung
  choice: βωμός mit „Altar“ und θυσιαστήριον mit „Brandopferaltar“ wiedergeben
  alternative: Beide Wörter mit „Altar“ wiedergeben oder βωμός ausdrücklich „heidnischer Altar“ nennen
  rationale: Der griechische Text verwendet bewusst zwei verschiedene Wörter und beschreibt einen Altar auf dem bestehenden Tempelaltar. Die Übersetzung wahrt diese Unterscheidung, ohne die kontextuell plausible, aber in diesem Vers nicht ausdrücklich genannte Kennzeichnung als heidnisch in den Haupttext einzutragen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Satzstellung hält die räumliche Beziehung der beiden Altäre klar; der Fußnotenmarker steht unmittelbar nach dem Satz.
