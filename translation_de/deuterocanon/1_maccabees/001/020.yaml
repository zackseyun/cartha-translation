  yaml_path: translation/deuterocanon/1_maccabees/001/020.yaml
  text: And after striking Egypt[a], Antiochus returned in the one hundred forty-third year; and he went up against Israel and Jerusalem with a great multitude.
translation:
  language: de
  text: Nachdem Antiochus Ägypten geschlagen hatte, kehrte er im 143. Jahr zurück. Dann zog er mit einer großen Streitmacht[a] gegen Israel und Jerusalem hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „mit einer schweren Menge“; auch möglich: „mit einer gewaltigen Truppenmasse“ oder „mit einem großen Heer“.'
    reason: Das griechische ὄχλος βαρύς verbindet den allgemeinen Ausdruck für eine Menge mit dem Bild von Schwere beziehungsweise Stärke; im Zusammenhang ist eine große militärische Truppe gemeint.
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: kehrte … zurück
  rationale: Das Verb bezeichnet hier die Rückkehr nach dem Feldzug und wird im Deutschen natürlich mit „zurückkehren“ wiedergegeben.
- source_word: μετὰ τὸ πατάξαι Αἴγυπτον
  choice: Nachdem … Ägypten geschlagen hatte
  rationale: Die Konstruktion bezeichnet Vorzeitigkeit. „Schlagen“ bewahrt die militärische Aussage, ohne ausdrücklich eine vollständige Eroberung oder endgültige Niederlage zu behaupten.
- source_word: ἐν τῷ ἑκατοστῷ καὶ τεσσερακοστῷ καὶ τρίτῳ ἔτει
  choice: im 143. Jahr
  rationale: Dies gibt die griechische Datierungsformel knapp und verständlich wieder, ohne eine nicht ausdrücklich genannte Zeitrechnung in den Haupttext einzufügen.
- source_word: ἀνέβη ἐπὶ Ἰσραὴλ καὶ Ἱεροσόλυμα
  choice: zog … gegen Israel und Jerusalem hinauf
  rationale: „Hinaufziehen“ bewahrt die Richtungsangabe von ἀναβαίνω; „gegen“ gibt im militärischen Zusammenhang den feindlichen Sinn von ἐπί mit Akkusativ wieder.
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: mit einer großen Streitmacht
  rationale: ὄχλος bezeichnet eine Menge und kann im militärischen Zusammenhang eine Truppenmasse meinen; βαρύς vermittelt hier Größe, Gewicht und Stärke. „Große Streitmacht“ ist natürliches Deutsch, während die Fußnote die bildhafte und lexikalische Spannweite offenhält.
