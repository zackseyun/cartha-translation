  text: And they captured the fortified cities in the land of Egypt, and he took the plunder of the land of Egypt.
translation:
  language: de
  text: Und sie nahmen die befestigten Städte im Land Ägypten ein, und er nahm die Beute des Landes Ägypten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβοντο
  choice: nahmen … ein
  rationale: Der Aorist Medium von καταλαμβάνω bezeichnet hier im militärischen Zusammenhang die gewaltsame Einnahme der Städte. „nahmen … ein“ ist dafür die natürliche deutsche Wendung.
- source_word: τὰς πόλεις
  choice: die Städte
  rationale: πόλις bedeutet gewöhnlich „Stadt“; der bestimmte Artikel wird im Deutschen entsprechend wiedergegeben.
- source_word: τὰς ὀχυράς
  choice: die befestigten
  rationale: ὀχυρός beschreibt hier attributiv die Verteidigungsstärke der Städte. „befestigte Städte“ ist präzise und idiomatisch.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: im Land Ägypten
  rationale: Die geografische Formulierung wird quellennah und in würdigem, verständlichem Deutsch wiedergegeben.
- source_word: ἔλαβεν
  choice: er nahm
  rationale: Die Singularform wird bewusst bewahrt und nicht an das vorhergehende Pluralverb angeglichen. Das schlichte „nahm“ entspricht der Grundbedeutung, ohne die Art der Aneignung zusätzlich auszudeuten.
- source_word: τὰ σκῦλα
  choice: die Beute
  rationale: σκῦλα bezeichnet im Krieg erbeutete Güter. „Beute“ ist im modernen Deutschen klar, knapp und dem militärischen Kontext angemessen.
theological_decisions:
- issue: Wechsel vom Plural κατελάβοντο („sie nahmen ein“) zum Singular ἔλαβεν („er nahm“)
  choice: 'Der grammatische Wechsel wird beibehalten: „sie … er“.'
  alternative: Beide Satzteile könnten zur stilistischen Glättung einheitlich im Plural oder Singular formuliert werden.
  rationale: Der griechische Text unterscheidet ausdrücklich zwischen der Gruppe, die die Städte einnahm, und dem einzelnen männlichen Handlungsträger, der die Beute nahm. Eine Angleichung würde eine echte Spannung des Ausgangstextes verdecken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Wiederholung „Ägypten“ und der Wechsel von „sie“ zu „er“ bleiben als Merkmale des griechischen Textes erhalten.
