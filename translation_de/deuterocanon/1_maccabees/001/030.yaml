base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/030.yaml
  text: And he spoke peaceful words to them with deceit[a], and they trusted him; then he fell upon the city suddenly, struck it a great blow[b], and destroyed many people from Israel.
translation:
  language: de
  text: Und er redete ihnen in betrügerischer Absicht friedlich zu[a], und sie vertrauten ihm[b]. Da überfiel er plötzlich die Stadt, fügte ihr einen schweren Schlag zu und brachte viele aus Israel um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Er sprach zu ihnen Worte des Friedens mit Täuschung.“ Gemeint sind friedlich klingende Worte, die der Irreführung dienten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie glaubten ihm“. Sie nahmen seine Zusicherungen für wahr und verließen sich darauf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν αὐτοῖς λόγους εἰρηνικούς
  choice: er redete friedliche Worte zu ihnen
  rationale: Die Wiedergabe bewahrt die direkte Verbindung von εἰρηνικούς mit λόγους und bezeichnet versöhnlich klingende Rede, ohne ihre Aufrichtigkeit vorauszusetzen.
- source_word: ἐν δόλῳ
  choice: in betrügerischer Absicht
  rationale: Die Formulierung gibt den modalen Sinn der Präpositionalphrase natürlich wieder und macht deutlich, dass die friedlichen Worte als Täuschungsmanöver dienten.
- source_word: ἐπίστευσαν αὐτῷ
  choice: sie vertrauten ihm
  rationale: Im Erzählzusammenhang geht es um praktisches Vertrauen auf seine Zusicherungen, nicht um theologischen Glauben.
- source_word: ἐπέπεσεν ἐπὶ τὴν πόλιν ἐξαίφνα
  choice: da überfiel er plötzlich die Stadt
  rationale: „Überfallen“ vermittelt den gewaltsamen Sinn der Wendung idiomatisch; „plötzlich“ entspricht direkt ἐξαίφνα.
- source_word: ἐπάταξεν αὐτὴν πληγὴν μεγάλην
  choice: versetzte ihr einen schweren Schlag
  rationale: Die deutsche idiomatische Wendung erhält das Bild des griechischen Ausdrucks; „schwer“ bezeichnet hier das Ausmaß und die verheerende Wirkung.
- source_word: ἀπώλεσεν λαὸν πολὺν ἐξ Ἰσραήλ
  choice: brachte viele aus Israel um
  rationale: Beim menschlichen Objekt bezeichnet ἀπόλλυμι hier tödliche Vernichtung. „Viele aus Israel“ gibt sowohl die große Zahl als auch den partitiven Herkunftsbezug von ἐξ wieder.
theological_decisions:
- issue: Bedeutung von πιστεύω in einem nichttheologischen Erzählzusammenhang
  choice: sie vertrauten ihm
  alternative: sie glaubten ihm
  rationale: Beide Wiedergaben sind möglich. „Vertrauten“ hebt hervor, dass die Menschen sich auf seine täuschenden Friedenszusicherungen verließen, und vermeidet unangebrachte dogmatische Anklänge.
- issue: Reichweite von ἀπώλεσεν bei menschlichem Objekt
  choice: brachte ... um
  alternative: vernichtete
  rationale: Der gewaltsame Kontext zeigt, dass der Verlust von Menschenleben gemeint ist. Die konkrete Wiedergabe vermeidet zugleich die mögliche Fehlvorstellung, Israel als Ganzes sei vernichtet worden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzfluss folgt der parataktischen griechischen Erzählweise, wird jedoch durch einen Satzpunkt lesbarer gegliedert. „Überfiel“ und „brachte ... um“ sind klare heutige Ausdrücke ohne archaische Färbung.
