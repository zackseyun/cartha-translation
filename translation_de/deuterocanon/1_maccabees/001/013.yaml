base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/013.yaml
  text: And some from the people eagerly sought this[a], and they went to the king; and he gave them authority to practice the customs of the nations.
translation:
  language: de
  text: Einige aus dem Volk wollten dies unbedingt[a] und gingen zum König. Man gab ihnen die Vollmacht, die Bräuche der Völker[b] zu übernehmen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bezeichnet hier eine starke Bereitschaft oder ein eifriges Wollen. Ein ausdrückliches Objekt steht im Satz nicht; „dies“ nimmt den Zusammenhang auf.
    reason: Dokumentiert die idiomatische Ergänzung eines im griechischen Satz nicht ausdrücklich genannten Gegenstands.
  - marker: b
    text: Gemeint sind hier die nichtisraelitischen Völker, also die Nichtjuden.
    reason: Erläutert den kontextuellen Sinn von ἐθνῶν, während der Haupttext die wörtlich nähere Wiedergabe „Völker“ bewahrt.
  - marker: c
    text: 'Wörtlich steht im Griechischen: „und sie gaben ihnen die Vollmacht“. Wer mit „sie“ gemeint ist, wird nicht ausdrücklich gesagt; dem Zusammenhang nach dürfte die königliche Obrigkeit gemeint sein.'
    reason: Dokumentiert den auffälligen Wechsel vom unmittelbar vorausgehenden Singular „König“ zur Pluralform ἔδωκαν und bewahrt die Unbestimmtheit des Ausgangstextes.
lexical_decisions:
- source_word: προεθυμήθησάν
  choice: waren mit Eifer dazu bereit
  rationale: Das Verb bezeichnet eine starke Bereitschaft oder einen eifrigen Entschluss. „Dazu“ nimmt den im Zusammenhang vorausgesetzten Inhalt auf, ohne einen im griechischen Satz nicht ausdrücklich genannten Gegenstand näher festzulegen.
- source_word: τινες ἀπὸ τοῦ λαοῦ
  choice: einige aus dem Volk
  rationale: Die Formulierung gibt die Teilmenge innerhalb des jüdischen Volkes knapp und strukturell nah am Griechischen wieder; eine ausdrückliche geschlechtliche Kennzeichnung steht nicht im Ausgangstext.
- source_word: ἐπορεύθησαν πρὸς τὸν Βασιλέα
  choice: gingen zum König
  rationale: Dies ist eine natürliche und genaue Wiedergabe des schlichten Bewegungsverbs.
- source_word: ἔδωκαν αὐτοῖς ἐξουσίαν
  choice: man gab ihnen die Vollmacht
  rationale: Die unpersönliche Formulierung bewahrt, dass das griechische Verb im Plural steht, obwohl unmittelbar zuvor nur der König im Singular genannt wird. „Vollmacht“ gibt ἐξουσία als gewährte Befugnis wieder.
- source_word: ποιῆσαι
  choice: zu übernehmen
  rationale: In Verbindung mit den Bräuchen oder Regelungen anderer Völker bezeichnet ποιεῖν hier deren praktische Annahme und Befolgung; „übernehmen“ klingt im Deutschen natürlicher als das wörtliche „tun“.
- source_word: τὰ δικαιώματα τῶν ἐθνῶν
  choice: die Bräuche der Völker
  rationale: δικαιώματα kann Satzungen, vorgeschriebene Ordnungen oder gelebte Bräuche bezeichnen. Im Zusammenhang der Annahme nichtjüdischer Lebensweisen vermittelt „Bräuche“ den Sinn verständlich, während „Völker“ eng an ἐθνῶν bleibt.
theological_decisions:
- issue: Wiedergabe von ἐθνῶν im jüdischen Kontext
  choice: Völker
  alternative: Nichtjuden
  rationale: „Völker“ entspricht dem griechischen Ausdruck unmittelbar und vermeidet eine unnötige Festlegung auf einen später stärker terminologisierten Gebrauch. Eine Fußnote erläutert, dass hier die nichtisraelitischen Völker gemeint sind.
- issue: Nicht ausdrücklich genanntes Subjekt von ἔδωκαν
  choice: man gab ihnen
  alternative: der König gab ihnen
  rationale: Der überlieferte griechische Text hat die Pluralform „sie gaben“, obwohl „der König“ im vorangehenden Teilsatz Singular ist. Die unpersönliche deutsche Form wahrt den Sinn der erteilten Vollmacht, ohne die grammatische Spannung stillschweigend zugunsten des Königs als alleinigen Handelnden aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzfolge bleibt knapp und erzählerisch. „Mit Eifer dazu bereit“ wahrt die Willens- und Intensitätskomponente; „Vollmacht“ und „Bräuche“ sind zugänglich, ohne den rechtlich-religiösen Gehalt zu verflachen.
