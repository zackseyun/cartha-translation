translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz setzt syntaktisch den vorangehenden königlichen Erlass fort; deshalb bleibt der erste Teilsatz mit »und« angeschlossen. Die rechtlich-religiöse Weite von νόμιμα und die Bedeutungsbreite von λόγος werden im Text nicht konfessionell verengt und in den Fußnoten kenntlich gemacht.
