    text: Das »Wort des Königs« kann hier auch als »Befehl des Königs« oder »Erlass des Königs« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείπειν
  choice: aufgeben
  rationale: Das Verb bezeichnet hier die entschiedene Abkehr von einer bestehenden Lebens- und Religionspraxis. »Aufgeben« ist im Deutschen natürlich und gibt die Stärke des Ausdrucks wieder.
- source_word: ἕκαστον
  choice: jeder
  rationale: Die distributive Einzahl wird mit »jeder« präzise und idiomatisch wiedergegeben.
- source_word: τὰ νόμιμα αὐτοῦ
  choice: seine eigenen Bräuche
  rationale: νόμιμα bezeichnet in diesem Zusammenhang hergebrachte rechtlich-religiöse Bräuche und Ordnungen. »Bräuche« ist allgemein verständlich und legt den Ausdruck nicht einseitig auf kodifizierte Gesetze fest.
- source_word: ἐπεδέξαντο
  choice: willigten ein
  rationale: Das Verb bezeichnet Annehmen oder Zustimmen. Da κατὰ τὸν λόγον τοῦ βασιλέως den Maßstab beziehungsweise Anlass nennt, gibt »willigten ein« die Konstruktion natürlicher wieder als ein transitives »nahmen … an«.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: ἔθνη meint hier umfassend die Völker unter der Herrschaft des Königs. »Völker« vermeidet die unnötig verengende Wiedergabe »Heiden«.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: wie es das Wort des Königs verlangte
  rationale: κατά bezeichnet hier die Übereinstimmung mit der königlichen Weisung. »Wort« bewahrt die lexikalische Offenheit von λόγος; »verlangte« macht die Funktion als verbindliche königliche Anordnung im Deutschen verständlich.
