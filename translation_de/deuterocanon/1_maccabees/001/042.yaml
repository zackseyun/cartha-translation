translation:
  language: de
  text: und jeder seine eigenen Bräuche[a] aufgeben sollte. Und alle Völker nahmen das Wort des Königs[b] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine eigenen Ordnungen«, »seine eigenen Gesetze« oder »seine überlieferten Bräuche«. Das griechische Wort kann besonders hergebrachte rechtliche und religiöse Lebensordnungen bezeichnen.'
    reason: lexical_alternative
