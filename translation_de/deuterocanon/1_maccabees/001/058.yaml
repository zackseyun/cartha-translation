  yaml_path: translation/deuterocanon/1_maccabees/001/058.yaml
  text: By their power they kept doing this to Israel[b][a], to those who were found in the cities month after month.
translation:
  language: de
  text: Mit ihrer Macht[a] taten sie dies Israel immer wieder an, nämlich denen, die Monat für Monat[b] in den Städten angetroffen wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Gewalt“; die griechische Wendung kann die Zwangsmacht hervorheben, mit der sie handelten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in jedem Monat und Monat“, das heißt: wiederholt in jedem Monat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἰσχύϊ αὐτῶν
  choice: Mit ihrer Macht
  rationale: Die Wendung bezeichnet hier am ehesten das Mittel ihres Handelns. „Mit ihrer Macht“ wahrt die griechische Formulierung und lässt zugleich den im Zusammenhang liegenden Zwang erkennen, ohne ausdrücklich körperliche Gewalt festzulegen.
- source_word: ἐποίουν οὕτω
  choice: taten sie … dies immer wieder an
  rationale: Das Imperfekt bezeichnet ein fortgesetztes oder wiederholtes Vorgehen. Die deutsche Verbindung „jemandem etwas antun“ gibt den Dativ τῷ Ἰσραήλ natürlich wieder und lässt den feindseligen Zusammenhang deutlich werden.
- source_word: τῷ Ἰσραήλ
  choice: Israel … an
  rationale: Der griechische Dativ wird in der deutschen Konstruktion „Israel dies antun“ bewahrt; eine ausdrücklich adversative Präposition wie „gegen“ wird nicht ergänzt.
- source_word: τοῖς εὑρισκομένοις
  choice: denen, die … angetroffen wurden
  rationale: Die Wiedergabe erhält den passiven Sinn des Partizips und ist im Deutschen natürlicher als „den Gefundenen“. „Angetroffen“ kann sowohl gezieltes Auffinden als auch Vorfinden bezeichnen und überbestimmt den Vorgang nicht.
- source_word: ἐν παντὶ μηνὶ καὶ μηνὶ
  choice: Monat für Monat
  rationale: Die wiederholte Formulierung μηνὶ καὶ μηνὶ betont die regelmäßige Wiederkehr. „Monat für Monat“ gibt diesen distributiv-iterativen Sinn idiomatisch wieder.
- source_word: ἐν ταῖς πόλεσιν
  choice: in den Städten
  rationale: Dies ist die direkte und im Kontext angemessene Wiedergabe von ἐν ταῖς πόλεσιν, ohne ein nicht ausdrücklich vorhandenes „überall“ hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortgesetzte Handlung wird durch „immer wieder“ ausgedrückt; „Monat für Monat“ bewahrt zusätzlich die ausdrücklich genannte regelmäßige Wiederkehr. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
