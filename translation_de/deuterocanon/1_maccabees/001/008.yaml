translation:
  language: de
  text: Und seine Diener[a] kamen an die Macht, jeder in seinem Gebiet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Söhne“, „Kinder“ oder „Diener“ bedeuten; hier sind Personen gemeint, die in Alexanders Dienst standen.
    reason: lexical_ambiguity
  - marker: b
    text: 'Wörtlich: „an seinem Ort“; gemeint ist wahrscheinlich der jeweilige Macht- oder Herrschaftsbereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκράτησαν
  choice: kamen an die Macht
  rationale: Das Verb bezeichnet hier, dass Alexanders Nachfolger nach seinem Tod wirksame Herrschaft erlangten. „Kamen an die Macht“ gibt diesen Zusammenhang natürlich wieder, ohne ein ausdrücklich genanntes Herrschaftsobjekt hinzuzufügen.
- source_word: οἱ παῖδες αὐτοῦ
  choice: seine Gefolgsleute
  rationale: παῖδες kann je nach Zusammenhang „Söhne“, „Kinder“, „Diener“ oder „Untergebene“ bedeuten. Hier sind im historischen und unmittelbaren Zusammenhang Alexanders führende Gefolgsleute beziehungsweise Nachfolger gemeint, nicht seine leiblichen Söhne.
- source_word: ἕκαστος
  choice: jeder
  rationale: Entspricht dem distributiven Sinn des griechischen Ausdrucks und ist im Deutschen knapp und natürlich.
- source_word: ἐν τῷ τόπῳ αὐτοῦ
  choice: in seinem Gebiet
  rationale: τόπος bedeutet wörtlich „Ort“, bezeichnet hier aber wahrscheinlich den jeweiligen Macht- oder Herrschaftsbereich. „Gebiet“ macht diesen kontextuellen Sinn verständlich, ohne eine genau festgelegte politische Grenzziehung vorauszusetzen.
