translation:
  language: de
  text: Und sie machten sich eine Vorhaut[a], wandten sich vom heiligen Bund ab, ließen sich mit den Völkern unter ein Joch spannen und verkauften sich, um Böses zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie machten sich eine Vorhaut«; das heißt, sie verbargen das sichtbare Zeichen der Beschneidung oder machten es rückgängig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν ἑαυτοῖς ἀκροβυστίαν
  choice: sie machten sich eine Vorhaut
  rationale: Die bewusst konkrete Formulierung gibt das griechische »sie machten sich selbst eine Vorhaut« nahezu wörtlich wieder. Gemeint ist, dass sie das sichtbare Zeichen der Beschneidung verbargen oder rückgängig machten; die Fußnote erläutert die ungewöhnliche Wendung, ohne ihre Schärfe im Haupttext abzuschwächen.
- source_word: ἀπέστησαν
  choice: wandten sich ... ab
  rationale: Das Verb bezeichnet Abkehr oder Abfall. Die Formulierung ist in modernem Deutsch klar und bringt die bewusste Aufkündigung der Bundestreue zum Ausdruck, ohne einen späteren kirchlichen Fachbegriff einzuführen.
- source_word: διαθήκης ἁγίας
  choice: vom heiligen Bund
  rationale: Obwohl der griechische Ausdruck keinen Artikel hat, bezeichnet er im Zusammenhang den bekannten heiligen Bund Israels. Im Deutschen ist daher der bestimmte Artikel sachgerecht und idiomatisch.
- source_word: ἐζευγίσθησαν
  choice: spannten sich ... unter ein Joch
  rationale: Die Wiedergabe bewahrt das Bild des Zusammenjochens und zugleich den reflexiven, willentlichen Charakter ihrer Verbindung mit den nichtisraelitischen Völkern.
- source_word: τοῖς ἔθνεσιν
  choice: mit den Völkern
  rationale: Der Ausdruck meint hier die nichtisraelitischen Völker. »Die Völker« ist quellennah und weniger konfessionell oder abwertend aufgeladen als »Heiden«.
- source_word: ἐπράθησαν
  choice: verkauften sich
  rationale: Die mediale beziehungsweise passive Form bezeichnet hier bildhaft freiwillige Selbstpreisgabe oder Selbstversklavung. »Verkauften sich« erhält diese starke moralische Metapher.
- source_word: τοῦ ποιῆσαι πονηρόν
  choice: um Böses zu tun
  rationale: Der substantivierte Gebrauch von πονηρόν wird im Deutschen natürlich mit »Böses« wiedergegeben; die Infinitivkonstruktion bezeichnet hier zweckhaftes Handeln.
theological_decisions:
- issue: Wie ausdrücklich die Umkehrung beziehungsweise Verbergung der Beschneidung wiederzugeben ist
  choice: Die konkrete Formulierung »sie machten sich eine Vorhaut« steht im Haupttext und wird in einer Fußnote erläutert.
  alternative: »Sie machten ihre Beschneidung rückgängig« oder »sie stellten ihre Vorhaut wieder her«
  rationale: Die ungewöhnliche Körpermetaphorik gehört zur zugespitzten Darstellung des Bundesabfalls. Eine rein erklärende Übersetzung würde die Bildkraft glätten; die Fußnote wahrt zugleich die Verständlichkeit und legt sich nicht unnötig auf eine einzige antike Vorgehensweise fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge folgt eng dem griechischen Aufbau; die starken Bilder von Vorhaut, Joch und Selbstverkauf bleiben erhalten. Die ungewöhnliche erste Wendung wird nicht geglättet, sondern durch eine knappe Fußnote verständlich gemacht.
