translation:
  language: de
  text: Und an den Eingängen der Häuser und auf den Straßen verbrannten sie Weihrauch.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „brachten sie Weihrauch dar“. Das griechische Verb kann das Verbrennen von Weihrauch als kultische Opferhandlung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch breite Straßen oder öffentliche Plätze bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδων
  choice: Eingängen
  rationale: θυρίς kann eine Tür, Öffnung oder einen Eingang bezeichnen. „Eingänge“ ist im Deutschen natürlich und vermeidet die architektonische Überbestimmung „Türpfosten“.
- source_word: οἰκιῶν
  choice: Häuser
  rationale: οἰκία bezeichnet hier konkret die Häuser als Orte des Geschehens.
- source_word: πλατείαις
  choice: öffentlichen Plätzen
  rationale: πλατεῖα kann breite Straßen oder offene städtische Plätze bezeichnen. „Öffentliche Plätze“ gibt den öffentlichen Stadtraum idiomatisch wieder; die mögliche Bedeutung „breite Straßen“ wird in einer Fußnote bewahrt.
- source_word: ἐθυμίων
  choice: verbrannten sie Weihrauch
  rationale: θυμιάω bezeichnet das Verbrennen beziehungsweise kultische Darbringen von Weihrauch. Die gewählte Formulierung ist direkt und lässt den Opfercharakter im Kontext erkennbar, ohne ihn ausdrücklich festzulegen.
- source_word: ἐπὶ ... καὶ ἐν
  choice: an ... und auf
  rationale: Die Präpositionen markieren unterschiedliche räumliche Beziehungen. Idiomatisches Deutsch verlangt hier „an den Eingängen“ und „auf den öffentlichen Plätzen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt die beiden Ortsangaben des griechischen Textes; „Weihrauch verbrennen“ ist allgemein verständlich, während die kultische Bedeutungsnuance durch Fußnote [a] erhalten bleibt.
