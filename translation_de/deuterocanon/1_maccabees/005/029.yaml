lexical_decisions:
- source_word: ἀπῆρεν
  choice: brach … auf
  rationale: Das Verb bezeichnet hier den Aufbruch von einem Ort; „aufbrechen“ ist im Deutschen natürlich und passt zum Reise- und Militärkontext.
- source_word: ἐκεῖθεν
  choice: von dort
  rationale: Gibt den Ausgangspunkt der Bewegung knapp und idiomatisch wieder.
- source_word: νυκτός
  choice: bei Nacht
  rationale: Der adverbiale Genitiv bezeichnet die nächtliche Zeit des Aufbruchs; „bei Nacht“ bewahrt den knappen Erzählton.
- source_word: ἐπορεύετο
  choice: zog weiter
  rationale: Der Imperfekt beschreibt eine andauernde Bewegung. „zog weiter“ bildet diesen Verlauf natürlich ab und eignet sich für den militärischen Erzählzusammenhang.
- source_word: ἕως ἐπὶ
  choice: bis zu
  rationale: Die Verbindung markiert hier das räumliche Ziel beziehungsweise die erreichte Grenze, ohne einen zusätzlichen Ankunftsvorgang ausdrücklich einzuführen.
- source_word: τὸ ὀχύρωμα
  choice: die Festung
  rationale: ὀχύρωμα bezeichnet einen befestigten Ort oder Stützpunkt. „Festung“ ist eine klare, sachgerechte deutsche Wiedergabe, ohne die genaue bauliche Form festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem narrativem Rhythmus. Die fortdauernde Bewegung des Imperfekts wird durch „zog weiter“ ausgedrückt; „bis zu“ vermeidet die gegenüber dem Griechischen ausdrücklichere Ergänzung „bis er erreichte“.
