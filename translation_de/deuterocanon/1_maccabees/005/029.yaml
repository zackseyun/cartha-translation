  naturalness: Die Formulierung ist natürliches, modernes Standarddeutsch und wahrt einen knappen, würdevollen Erzählton. „Bei Nacht“ ist leicht literarisch, aber im biblisch-historischen Erzählregister idiomatisch und klar.
  terminology: „Festung“ ist für ὀχύρωμα eine sachgerechte Hauptwiedergabe. Die Fußnote hält die weitere Bedeutung „befestigter Ort/Platz“ angemessen offen. Der Fußnotenanker steht unmittelbar bei „Festung“ und ist damit korrekt an das erläuterte Lexem gebunden.
