  text: And he set out from there by night[a], and he kept going until he reached the stronghold.
translation:
  language: de
  text: Und er brach von dort bei Nacht auf und zog weiter bis zur Festung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum befestigten Ort“. Das griechische Wort kann allgemein einen befestigten Platz bezeichnen.'
