  text: And he remembered the evil of the sons of Baian[a], who were a snare and a stumbling block to the people, lying in ambush for them on the roads.
translation:
  language: de
  text: Und er erinnerte sich an die Bosheit der Söhne Baians[a], die dem Volk eine Falle und ein Stolperstein waren, indem sie ihm auf den Straßen auflauerten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Söhne Baeans“; der griechische Eigenname Βαιάν kann unterschiedlich transliteriert werden.'
