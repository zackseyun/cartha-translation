lexical_decisions:
- source_word: ἐμνήσθη
  choice: er erinnerte sich an
  rationale: Die Wendung gibt den Aorist natürlich wieder und bewahrt den Gedanken, dass Judas sich früheres feindseliges Handeln ins Gedächtnis ruft.
- source_word: κακίας
  choice: Bosheit
  rationale: „Bosheit“ bewahrt die breite moralische Bedeutung von κακία, ohne das Wort enger auf Arglist, Hass oder einzelne Untaten festzulegen.
- source_word: υἱῶν Βαιάν
  choice: der Söhne Baians
  rationale: Die formnahe Wiedergabe lässt offen, ob leibliche Söhne, Nachkommen oder eine nach einem Ahnherrn benannte Gruppe gemeint sind. Der Eigenname wird transliteriert.
- source_word: παγίδα
  choice: eine Falle
  rationale: „Falle“ gibt das Bild einer für andere bereiteten Gefahr in klarem, modernem Deutsch wieder.
- source_word: σκάνδαλον
  choice: ein Stolperstein
  rationale: „Stolperstein“ bewahrt die konkrete Bildsprache und ihre übertragene Bedeutung als Ursache von Schaden oder Fall.
- source_word: ἐν τῷ ἐνεδρεύειν αὐτοὺς
  choice: indem sie ihm … auflauerten
  rationale: Die Konstruktion bezeichnet hier die Art und Weise beziehungsweise das Mittel, durch das sie für das Volk zur Falle wurden. Das singularische „ihm“ bezieht sich im Deutschen eindeutig auf das Kollektiv „Volk“.
- source_word: ἐν ταῖς ὁδοῖς
  choice: auf den Straßen
  rationale: Dies ist die idiomatische deutsche Bezeichnung für die Verkehrs- und Reisewege, an denen die Hinterhalte stattfanden.
