  terminology: „Judas“ und „seine Brüder“ entsprechen dem etablierten Gebrauch in 1 Makkabäer. „Tapfer handeln“ gibt ἀνδραγαθῆσαι idiomatisch wieder; „sie selbst“ bewahrt die emphatische Stellung von αὐτοί, ohne die Aussage durch „tapfere Männer“ unnötig zu spezifizieren.
