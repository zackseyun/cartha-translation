  to: Und es kam zu einer großen Niederlage unter dem Volk[a], weil sie nicht auf Judas und seine Brüder gehört hatten und meinten, sie selbst könnten tapfer handeln.[b]
  rationale: Die Revision beseitigt den nicht im Griechischen ausgedrückten adversativen Zusatz „sondern“, gibt μεγάλη genauer mit „groß“ wieder und formuliert den Ausdruck für Tapferkeit idiomatischer. Kausalität, Bezug auf das Volk und die Betonung von „sie selbst“ bleiben erhalten.
