lexical_decisions:
- source_word: τροπὴ μεγάλη
  choice: eine schwere Niederlage
  rationale: τροπή bezeichnet im militärischen Zusammenhang das Umschlagen in die Flucht und damit eine vernichtende Niederlage. Die deutsche Wendung ist natürlich und erfasst die Folge, ohne das Bild zu überspezifizieren.
- source_word: ἐν τῷ λαῷ
  choice: das Volk erlitt
  rationale: λαός wird quellennah mit „Volk“ wiedergegeben. Die Umformung zum Subjekt ergibt im Deutschen einen klaren, natürlichen Satz, ohne den Bezug ausdrücklich auf Heer oder Truppen einzuengen.
- source_word: οὐκ ἤκουσαν Ἰούδα καὶ τῶν ἀδελφῶν αὐτοῦ
  choice: sie nicht auf Judas und seine Brüder gehört hatten
  rationale: ἀκούω mit Genitiv bedeutet hier, auf jemanden zu hören beziehungsweise dessen Rat zu beachten. Das Plusquamperfekt verdeutlicht die vorangegangene Missachtung als Ursache.
- source_word: οἰόμενοι
  choice: sondern meinten
  rationale: Das Partizip bezeichnet ihre Annahme oder Selbstüberschätzung. „Sondern“ macht den gedanklichen Gegensatz im Deutschen verständlich, ohne eine zusätzliche theologische Aussage einzuführen.
- source_word: ἀνδραγαθῆσαι αὐτοί
  choice: sie könnten sich selbst als tapfere Männer erweisen
  rationale: Das Verb bezeichnet mutiges Handeln beziehungsweise den Beweis persönlicher Tapferkeit; αὐτοί ist betont. Die Formulierung bewahrt sowohl den Bewährungsgedanken als auch die Betonung ihres eigenmächtigen Anspruchs.
theological_decisions:
- issue: Ursächlicher Zusammenhang zwischen Missachtung und Niederlage
  choice: „weil“ gibt ὅτι als ausdrückliche Begründung wieder
  alternative: Eine lockerere erzählerische Verbindung ohne deutliche Kausalität
  rationale: ὅτι nennt hier natürlich den Grund der Niederlage. Die Übersetzung bewahrt dieses erzählerische Urteil, ohne es dogmatisch auszubauen.
- issue: Bewertung des eigenständigen Tapferkeitsanspruchs
  choice: Die Selbstbezogenheit wird durch „selbst“ bewahrt, aber nicht weiter moralisiert
  alternative: Eine ausdrückliche Deutung als Hochmut oder Ungehorsam
  rationale: Der Kontext legt Selbstüberschätzung nahe, doch der griechische Satz benennt sie nicht ausdrücklich mit einem theologischen oder moralischen Fachbegriff.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schwere Niederlage“ ist allgemein verständlicher als „große Flucht“ oder „Niederlage durch Flucht“; die Fußnote bewahrt das militärische Bild. Die Satzstruktur ist für flüssiges Deutsch leicht umgeformt, bleibt aber in Aussage, Kausalität und Betonung quellennah.
