  text: And they came as far as Ephron. This was a large city at the entrance[a], very strong. There was no way to turn aside from it to the right or to the left, but only to go through the middle of it.
translation:
  language: de
  text: Und sie kamen bis nach Efron. Diese Stadt war groß, lag an einem Zugang[a] und war sehr stark befestigt. Man konnte weder rechts noch links an ihr vorbeiziehen, sondern musste mitten durch sie hindurchziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einem Pass“ oder „an einem Zugang“. Die griechische Wendung kann die Lage der Stadt an einer Zugangs- oder Passroute bezeichnen; im folgenden Satz wird deutlich, dass man sie nicht umgehen konnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἕως Ἐφρών
  choice: sie kamen bis nach Efron
  rationale: ἕως bezeichnet hier die räumliche Erstreckung bis zum Ortsziel; „bis nach Efron“ ist im Deutschen natürlich und quellennah.
- source_word: αὕτη ἡ πόλις μεγάλη ἡ τῆς εἰσόδου
  choice: Diese Stadt lag am Eingang, war groß
  rationale: αὕτη wird ausdrücklich mit „Diese Stadt“ wiedergegeben. Die knappe griechische Genitivfügung ἡ τῆς εἰσόδου wird als strategische Lage „am Eingang“ verstanden, ohne die mögliche Bedeutung „Pass/Zugang“ im Haupttext festzulegen.
- source_word: ἰσχυρὰ σφόδρα
  choice: sehr stark befestigt
  rationale: Bei einer Stadt bezeichnet ἰσχυρά im militärischen Zusammenhang ihre Wehrhaftigkeit; „stark befestigt“ macht diesen im Kontext naheliegenden Sinn idiomatisch deutlich.
- source_word: οὐκ ἦν ἐκκλῖναι ἀπ’ αὐτῆς δεξιὰν ἢ ἀριστεράν
  choice: Man konnte weder rechts noch links an ihr vorbeiziehen
  rationale: Die unpersönliche Konstruktion drückt Unmöglichkeit aus. ἐκκλῖναι bezeichnet das seitliche Ausweichen; „an ihr vorbeiziehen“ gibt den taktischen Sinn natürlich wieder.
- source_word: ἀλλ’ ἢ διὰ μέσου αὐτῆς πορεύεσθαι
  choice: sondern musste mitten durch sie hindurchziehen
  rationale: ἀλλ’ ἢ markiert die einzig verbleibende Möglichkeit. „Mitten durch sie hindurchziehen“ bewahrt sowohl die Bewegung als auch διὰ μέσου.
