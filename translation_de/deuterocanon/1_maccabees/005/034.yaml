  yaml_path: translation/deuterocanon/1_maccabees/005/034.yaml
  text: And Timothy’s camp recognized that it was Maccabeus[a], and they fled from before him; and he struck them with a great blow, and as many as eight thousand of them fell on that day.
translation:
  language: de
  text: Als das Heerlager des Timotheus erkannte, dass es Makkabäus war, flohen seine Leute vor ihm. Er fügte ihnen eine schwere Niederlage zu, und an jenem Tag fielen von ihnen bis zu achttausend Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „achttausend Mann“. Die griechische Wendung kann eine bis zu dieser Höhe reichende oder eine ungefähre beziehungsweise gerundete Gesamtzahl bezeichnen.'
    reason: lexikalische Alternative bei εἰς ὀκτακισχιλίους ἄνδρας
lexical_decisions:
- source_word: ἐπέγνω
  choice: erkannte
  rationale: Das Verb bezeichnet hier das Erkennen beziehungsweise Identifizieren einer Person im militärischen Geschehen.
- source_word: ἡ παρεμβολὴ Τιμοθέου
  choice: das Heerlager des Timotheus
  rationale: παρεμβολή bezeichnet ein militärisches Lager und kann zugleich kollektiv für die dort versammelten Truppen stehen. „Heerlager“ wahrt dieses Bedeutungsfeld; „seine Leute“ macht den anschließenden pluralischen Bezug im Deutschen natürlich verständlich.
- source_word: ὁ Μακκαβαῖός
  choice: Makkabäus
  rationale: Die herkömmliche deutsche Namensform gibt die griechische Bezeichnung als Namen beziehungsweise Beinamen wieder, ohne den Artikel unnatürlich nachzubilden.
- source_word: ἔφυγον ἀπὸ προσώπου αὐτοῦ
  choice: flohen seine Leute vor ihm
  rationale: „Vor ihm fliehen“ gibt die semitisch geprägte Wendung ἀπὸ προσώπου αὐτοῦ idiomatisch und zugleich quellennah wieder.
- source_word: ἐπάταξεν αὐτοὺς πληγὴν μεγάλην
  choice: Er fügte ihnen eine schwere Niederlage zu
  rationale: Die griechische Schlag-Formel bezeichnet im militärischen Zusammenhang eine vernichtende beziehungsweise schwere Niederlage. Die deutsche Fassung vermeidet die unnatürliche Wörtlichkeit „mit einem großen Schlag schlagen“.
- source_word: ἔπεσον
  choice: fielen
  rationale: „Fielen“ ist im Deutschen die übliche militärische Bezeichnung für den Tod im Kampf und bewahrt die Bildsprache des griechischen Verbs.
- source_word: εἰς ὀκτακισχιλίους ἄνδρας
  choice: bis zu achttausend Mann
  rationale: εἰς vor der Zahl kann eine bis zu dieser Höhe reichende Gesamtzahl ausdrücken. „Mann“ ist in Truppen- und Verlustangaben idiomatisch und entspricht ἄνδρας.
