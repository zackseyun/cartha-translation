  text: And they went up to Mount Zion with gladness and joy[a], and they offered whole burnt offerings, because not one of them had fallen until they returned in peace.
translation:
  language: de
  text: Und sie zogen mit Jubel und Freude auf den Berg Zion hinauf und brachten Ganzbrandopfer dar[a], denn bis zu ihrer Rückkehr in Frieden war keiner von ihnen gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brandopfer“. Das griechische Wort bezeichnet Opfer, die vollständig auf dem Altar verbrannt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν
  choice: zogen … hinauf
  rationale: Bewahrt die konkrete Aufwärtsbewegung zum Berg Zion und klingt im Deutschen natürlich.
- source_word: τὸ ὄρος Σιὼν
  choice: zum Berg Zion
  rationale: Die geläufige deutsche Ortsbezeichnung erhält sowohl den geografischen als auch den religiösen Bezug.
- source_word: ἐν εὐφροσύνῃ καὶ χαρᾷ
  choice: mit Jubel und Freude
  rationale: Gibt beide Ausdrücke für festliche Freude unterscheidbar und idiomatisch wieder.
- source_word: προσήγαγον
  choice: brachten … dar
  rationale: Im Opferkontext bezeichnet das Verb das Darbringen einer Opfergabe.
- source_word: ὁλοκαυτώματα
  choice: Ganzbrandopfer
  rationale: Bezeichnet präzise Opfer, die vollständig auf dem Altar verbrannt wurden, und vermeidet moderne Missverständnisse des Fremdworts „Holokaust“.
- source_word: οὐκ ἔπεσεν ἐξ αὐτῶν οὐθεὶς
  choice: keiner von ihnen war gefallen
  rationale: Bewahrt die emphatische Verneinung; „fallen“ ist auch im Deutschen eine verständliche Bezeichnung für den Tod im Kampf.
- source_word: ἕως τοῦ ἐπιστρέψαι
  choice: bis sie … zurückkehrten
  rationale: Gibt die durch ἕως mit substantiviertem Infinitiv bezeichnete zeitliche Grenze klar wieder.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: Erhält die wörtliche Formulierung und lässt zugleich den Sinn einer sicheren, unversehrten Rückkehr erkennen.
theological_decisions:
- issue: Kultischer Fachausdruck ὁλοκαυτώματα
  choice: Ganzbrandopfer
  alternative: Brandopfer
  rationale: „Ganzbrandopfer“ macht kenntlich, dass die Opfer vollständig verbrannt wurden, ohne spätere oder konfessionell geprägte Deutungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Berichtsstil; „Jubel und Freude“ wahrt die Doppelung, und „in Frieden“ erhält die mögliche Bedeutungsweite zwischen friedlicher und sicherer Rückkehr.
