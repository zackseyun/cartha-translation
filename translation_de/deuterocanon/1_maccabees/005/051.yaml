- from: Und er vernichtete alles, was männlich war, mit der Schärfe des Schwertes[a]. Er entwurzelte die Stadt[b], nahm ihre Beute und zog durch die Stadt über die Erschlagenen hinweg.
  to: Und er vernichtete jeden Mann mit der Schneide des Schwertes[a], riss die Stadt mit der Wurzel aus[b], nahm die Beute der Stadt und zog durch die Stadt über die Erschlagenen hinweg.
