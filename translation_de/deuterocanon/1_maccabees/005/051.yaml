  source_fidelity: Die Handlungsfolge und die drastische Gewalt des Griechischen sind im Entwurf grundsätzlich zutreffend wiedergegeben. „Alles, was männlich war“ ist jedoch im modernen Deutschen unidiomatisch und kann sachlich missverstanden werden; πᾶν ἀρσενικόν bezeichnet hier alle männlichen Personen. Die Schwertidiomatik wird mit „Schneide des Schwertes“ präziser und natürlicher wiedergegeben. Die Bildlichkeit von ἐξερρίζωσεν wird durch „mit der Wurzel ausreißen“ klar bewahrt.
  naturalness: Die Revision verwendet flüssiges modernes Standarddeutsch, ohne die knappe, harte Erzählweise zu glätten. „Jeden Mann“ ist gegenüber „alles, was männlich war“ sowohl eindeutig als auch idiomatisch.
  terminology: „Schneide des Schwertes“, „mit der Wurzel ausreißen“, „Beute“ und „Erschlagene“ geben die einschlägigen Begriffe angemessen wieder. „Jeden Mann“ ist im Kontext die natürliche Wiedergabe des neutralen kollektiven πᾶν ἀρσενικόν und fügt keine über die Quelle hinausgehende Präzisierung hinzu.
  issues:
  - severity: medium
    issue: „alles, was männlich war“ für πᾶν ἀρσενικόν
    rationale: Die Formulierung ist im Deutschen ungewöhnlich und kann auch nichtpersonale Dinge einschließen. Im militärischen Kontext und angesichts der Tötung durch das Schwert meint der Ausdruck sämtliche männlichen Personen; „jeden Mann“ gibt dies klar und idiomatisch wieder.
  - severity: low
    issue: „mit der Schärfe des Schwertes“
    rationale: Verständlich, aber „mit der Schneide des Schwertes“ ist die geläufigere deutsche Entsprechung für das Idiom ἐν στόματι ῥομφαίας und bewahrt dessen Bild besser.
  - severity: low
    issue: „entwurzelte die Stadt“
    rationale: Das Verb ist als transitive Stadtzerstörungsmetapher im Deutschen schwer zugänglich. „Riss sie mit der Wurzel aus“ erhält die griechische Wurzelmetapher ausdrücklich und macht die beabsichtigte Totalität klar.
