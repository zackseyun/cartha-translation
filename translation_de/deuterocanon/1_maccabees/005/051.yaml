  yaml_path: translation/deuterocanon/1_maccabees/005/051.yaml
  text: And he destroyed every male with the edge of the sword[a], and uprooted it, and took the plunder of the city[b], and passed through the city over the slain.
translation:
  language: de
  text: Und er vernichtete jeden Mann mit der Schneide des Schwertes[a], riss die Stadt mit der Wurzel aus[b], nahm die Beute der Stadt und zog durch die Stadt über die Erschlagenen hinweg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem Mund des Schwertes“; eine feste Wendung für das Töten mit der Schneide des Schwertes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „rottete sie aus“. Das Verb bewahrt das Bild des Ausreißens mit der Wurzel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: vernichtete
  rationale: Das Verb bezeichnet hier im militärischen Zusammenhang die gewaltsame Vernichtung beziehungsweise Tötung. „Vernichtete“ bewahrt die umfassende und schonungslose Aussage.
- source_word: πᾶν ἀρσενικόν
  choice: alles, was männlich war
  rationale: Die Formulierung gibt die umfassende, geschlechtsspezifische Wendung wieder, ohne sie durch einen allgemeineren Ausdruck abzuschwächen.
- source_word: ἐν στόματι ῥομφαίας
  choice: mit der Schärfe des Schwertes
  rationale: Die wörtliche Wendung „mit/im Mund des Schwertes“ ist ein Idiom. „Mit der Schärfe des Schwertes“ gibt dessen Sinn verständlich wieder und bewahrt zugleich das Bild.
- source_word: ἐξερρίζωσεν
  choice: entwurzelte
  rationale: Das Verb bezeichnet wörtlich das Herausreißen mit der Wurzel. Die ungewöhnliche Bildlichkeit wird bewusst beibehalten und auf die Stadt bezogen.
- source_word: αὐτήν
  choice: die Stadt
  rationale: Das feminine Pronomen bezieht sich auf πόλις. Die Wiederaufnahme als „die Stadt“ verhindert im Deutschen einen unklaren Pronomenbezug.
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: ihre Beute
  rationale: σκῦλα bezeichnet im Krieg erbeutete Güter. Das Possessivpronomen nimmt die unmittelbar zuvor genannte Stadt natürlich auf.
- source_word: διῆλθεν διὰ τῆς πόλεως
  choice: zog durch die Stadt
  rationale: „Zog durch“ ist eine natürliche, im erzählenden Militärkontext passende Wiedergabe des Durchquerens, ohne ausdrücklich einen Marsch zu ergänzen.
- source_word: ἐπάνω τῶν ἀπεκταμμένων
  choice: über die Erschlagenen hinweg
  rationale: Das substantivierte Partizip bezeichnet die Getöteten. „Die Erschlagenen“ bewahrt das knappe, drastische Bild.
theological_decisions:
- issue: Gewaltsprache und Umfang der Vernichtung
  choice: 'Die volle Härte der militärischen Gewaltdarstellung bleibt erhalten: „vernichtete alles, was männlich war“, „mit der Schärfe des Schwertes“ und „entwurzelte die Stadt“.'
  alternative: Abschwächende Wiedergaben wie „besiegte“, „nahm ein“ oder eine rein bildliche Deutung von „entwurzelte“.
  rationale: Der griechische Text spricht ausdrücklich und drastisch von umfassender Tötung und Zerstörung. Eine Übersetzung darf diese Brutalität weder mildern noch über den Wortlaut hinaus ausdeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper und drastischer Erzählweise. Die Wiederholung von „Stadt“ entspricht der markanten Struktur des Ausgangstextes; bei „ihre Beute“ wurde eine natürliche deutsche Rückverweisung gewählt. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge der Handlungen zu verändern.
