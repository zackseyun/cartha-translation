  text: And the nations in Gilead gathered together against the Israelites who were within their borders[a], to wipe them out; and they fled into the stronghold at Dathema.
translation:
  language: de
  text: Und die Völker in Gilead schlossen sich gegen die Israeliten zusammen, die an ihren Grenzen lebten, um sie auszurotten[a]. Da flohen diese in die Festung Dathema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um sie völlig zu beseitigen« oder »um sie zu vernichten«. Der griechische Ausdruck bezeichnet die Absicht, sie vollständig zu entfernen, und kann in diesem Zusammenhang Vernichtung einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: schlossen sich zusammen
  rationale: Das zusammengesetzte Verb bezeichnet das gemeinsame Zusammenkommen beziehungsweise Sichversammeln; im feindseligen Kontext gibt „schlossen sich zusammen“ die koordinierte Mobilisierung natürlich wieder.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Gemeint sind die nichtisraelitischen Bevölkerungsgruppen der Umgebung. „Die Völker“ ist unmittelbar und vermeidet konfessionell oder neutestamentlich geprägte Zusatzbedeutungen von „Heiden“.
- source_word: τῇ Γαλααδίτιδι
  choice: in Gilead
  rationale: Der griechische Gebietsname bezeichnet die Landschaft Gilead; die geläufige deutsche Form ist klarer als eine formale Transkription.
- source_word: ἐπὶ τὸν Ἰσραὴλ
  choice: gegen die Israeliten
  rationale: Das singularische „Israel“ meint hier, wie der folgende pluralische Relativsatz zeigt, die dort lebenden Angehörigen Israels.
- source_word: τοὺς ὄντας ἐπὶ τοῖς ὁρίοις αὐτῶν
  choice: die innerhalb ihrer Grenzen lebten
  rationale: ἐπί mit dem Dativ kann eine Lage an, auf oder in einem Gebiet bezeichnen. Im Zusammenhang sind Israeliten im Grenz- beziehungsweise Herrschaftsgebiet jener Völker gemeint; „innerhalb ihrer Grenzen“ gibt dies in natürlichem Deutsch wieder, ohne einen exakten Standort an der Grenzlinie zu behaupten.
- source_word: τοῦ ἐξᾶραι αὐτούς
  choice: um sie auszurotten
  rationale: Der Infinitiv mit Artikel bezeichnet die Absicht vollständiger Beseitigung. „Ausrotten“ bewahrt die starke, umfassende Aussage des griechischen Verbs.
- source_word: ἔφυγον
  choice: Da flohen diese
  rationale: Das Verb bedeutet schlicht „fliehen“. Das Demonstrativpronomen macht im Deutschen eindeutig, dass die angegriffenen Israeliten gemeint sind.
- source_word: Δάθεμα
  choice: Datema
  rationale: Der Ortsname wird in einer dem griechischen Δάθεμα nahen und im Deutschen gut lesbaren Form wiedergegeben.
- source_word: τὸ ὀχύρωμα
  choice: die Festung
  rationale: Das Substantiv bezeichnet einen befestigten, verteidigungsfähigen Ort; „Festung“ ist die natürliche und präzise deutsche Entsprechung.
