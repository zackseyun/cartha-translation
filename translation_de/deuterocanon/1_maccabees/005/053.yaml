  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber der griechischen Verlaufsform natürlich gestrafft; die beiden Partizipien bleiben als gleichzeitig fortlaufende Handlungen erkennbar. Keine Fußnote nötig, da „Nachzügler“ die kontextuell wahrscheinliche Bedeutung präzise und ohne unnötige Festlegung wiedergibt.
