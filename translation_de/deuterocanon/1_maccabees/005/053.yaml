  yaml_path: translation/deuterocanon/1_maccabees/005/053.yaml
  text: And Judas was gathering up those who were falling behind and encouraging the people all along the way[a], until he came into the land of Judah.
translation:
  language: de
  text: Judas sammelte die Nachzügler wieder ein und ermutigte das Volk auf dem ganzen Weg, bis er in das Land Juda kam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισυνάγων
  choice: sammelte … wieder ein
  rationale: Das durative Partizip bezeichnet Judas’ fortlaufendes Zusammenführen der während des Marsches Zurückbleibenden. „Wieder einsammeln“ ist im Reisekontext natürlich und gibt die Vorstellung verstreuter Personen wieder.
- source_word: τοὺς ἐσχατίζοντας
  choice: die Nachzügler
  rationale: Das substantivierte Partizip meint hier wahrscheinlich diejenigen am Ende der Marschkolonne beziehungsweise jene, die zurückblieben. „Nachzügler“ ist prägnant und legt keine formelle Nachhut nahe.
- source_word: παρακαλῶν
  choice: ermutigte
  rationale: παρακαλέω kann ermahnen, auffordern, trösten oder ermutigen bedeuten. Im Zusammenhang des anstrengenden Marsches wahrt „ermutigte“ die offene Bedeutung von Zuspruch und Ansporn.
- source_word: τὸν λαόν
  choice: das Volk
  rationale: Die Übersetzung folgt dem allgemeinen Ausdruck des griechischen Textes und verengt ihn trotz des militärischen Zusammenhangs nicht auf „Heer“ oder „Truppen“.
- source_word: κατὰ πᾶσαν τὴν ὁδόν
  choice: auf dem ganzen Weg
  rationale: Die Wendung bezeichnet eine fortdauernde Tätigkeit während des gesamten Weges; die deutsche Formulierung ist idiomatisch und quellennah.
- source_word: γῆν Ἰούδα
  choice: das Land Juda
  rationale: Dies entspricht dem griechischen Wortlaut enger als „Judäa“ und bewahrt die biblische Benennung des Gebietes.
