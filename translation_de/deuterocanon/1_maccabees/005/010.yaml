  text: And they sent letters to Judas and his brothers[a], saying, “The nations around us have gathered together against us to destroy us,”
translation:
  language: de
  text: 'Und sie schickten Briefe an Judas und seine Brüder. Darin hieß es: »Die Völker rings um uns haben sich gegen uns versammelt, um uns auszurotten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν γράμματα
  choice: sie schickten Briefe
  rationale: Die Wendung bezeichnet das Versenden schriftlicher Mitteilungen; »Briefe schicken« ist präzise und natürlich.
- source_word: Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ
  choice: an Judas und seine Brüder
  rationale: Gemeint sind Judas und seine männlichen Geschwister beziehungsweise Mitstreiter aus seiner Familie; »Brüder« entspricht dem Erzählzusammenhang.
- source_word: λέγοντες
  choice: Darin hieß es
  rationale: Die partizipiale Redeeinleitung wird im Deutschen idiomatisch auf den Inhalt der Briefe bezogen.
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: haben sich versammelt
  rationale: Die periphrastische Perfektform beschreibt einen durch das Zusammenkommen entstandenen, fortbestehenden Zustand.
- source_word: τὰ ἔθνη τὰ κύκλῳ ἡμῶν
  choice: die Völker rings um uns
  rationale: »Völker« bewahrt den ethnisch-politischen Sinn von ἔθνη, ohne spätere theologische Konnotationen von »Heiden« einzutragen; »rings um uns« gibt die geografische Umgebung wieder.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: um uns auszurotten
  rationale: Der artikulierte Infinitiv bezeichnet den Zweck. »Ausrotten« gibt hier die starke Bedeutung einer vollständigen Beseitigung treffend und in würdigem Register wieder.
theological_decisions:
- issue: Bedeutung von ἔθνη im historischen Kontext
  choice: die Völker
  alternative: die Heiden
  rationale: Der Ausdruck bezeichnet hier die umliegenden nichtjüdischen Bevölkerungsgruppen als ethnisch-politische Größen. »Völker« vermeidet eine unnötige spätere theologische Aufladung.
- issue: Wiedergabe von ἀδελφοί
  choice: Brüder
  alternative: Geschwister
  rationale: Im Erzählzusammenhang sind Judas’ männliche Brüder und führende Familienmitglieder gemeint; eine inklusive Erweiterung wäre sachlich nicht geboten.
- issue: Stärke von ἐξᾶραι
  choice: auszurotten
  alternative: zu vernichten
  rationale: Das Verb kann grundsätzlich Beseitigung oder Vernichtung bezeichnen. Im Kontext einer gegen die jüdische Bevölkerung gerichteten feindlichen Sammlung bringt »auszurotten« die beabsichtigte vollständige Eliminierung zum Ausdruck, ohne die Spannung abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und dringlich. Die griechische Satzverknüpfung wird durch einen Punkt und »Darin hieß es« idiomatisch gegliedert, ohne Inhalt hinzuzufügen.
