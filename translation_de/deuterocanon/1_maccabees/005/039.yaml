  text: And Arabs had been hired to help them[a], and they were encamped beyond the wadi, ready to come against you in battle[b]. And Judas went out to meet them.
translation:
  language: de
  text: Und Araber sind zu ihrer Unterstützung angeworben worden. Sie lagern jenseits des Wadis[a] und sind bereit, gegen dich[b] in den Kampf zu ziehen. Und Judas zog ihnen entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jenseits des Sturzbachs“. Das griechische Wort kann einen nur zeitweise wasserführenden Bach, einen reißenden Wasserlauf oder dessen Bett bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht „dich“ in der Einzahl; der Judas überbrachte Bericht spricht ihn unmittelbar an.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄραβες
  choice: Araber
  rationale: Die übliche und natürliche moderne deutsche Bezeichnung für die genannte Volksgruppe.
- source_word: μεμίσθωνται
  choice: sind … angeworben worden
  rationale: 'Das Perfekt im Passiv bezeichnet einen vollzogenen Vorgang mit fortbestehendem Ergebnis: Die Araber stehen nun als bezahlte Hilfskräfte zur Verfügung.'
- source_word: εἰς βοήθειαν αὐτοῖς
  choice: als Verstärkung für sie
  rationale: Die Formulierung gibt die militärische Hilfe idiomatisch wieder, ohne die Araber ausdrücklich als Söldner zu bezeichnen.
- source_word: παρεμβάλλουσιν
  choice: sie lagern
  rationale: Das Präsens beschreibt die gegenwärtige militärische Lage; das deutsche Präsens bewahrt diese Unmittelbarkeit.
- source_word: πέραν τοῦ χειμάρρου
  choice: jenseits des Wadis
  rationale: χείμαρρος kann einen saisonal wasserführenden Bach beziehungsweise dessen Bett bezeichnen; „Wadi“ passt zum Gelände und ist im modernen Deutschen verständlich.
- source_word: ἕτοιμοι τοῦ ἐλθεῖν ἐπὶ σὲ εἰς πόλεμον
  choice: bereit, gegen dich in den Kampf zu ziehen
  rationale: Bewahrt die Bewegung gegen Judas und die kriegerische Absicht in natürlichem Deutsch.
- source_word: εἰς συνάντησιν αὐτῶν
  choice: ihnen entgegen
  rationale: Gibt das Hinausziehen zur Begegnung beziehungsweise Konfrontation knapp wieder; der militärische Zusammenhang macht den Sinn deutlich.
