  terminology: '„Araber“ ist die angemessene moderne Bezeichnung. „Angeworben worden“ gibt μεμίσθωνται gut wieder, ohne „Söldner“ über den Text hinaus ausdrücklich zu setzen. Die Fußnote zu b muss sachlich berichtigt werden: Der Bericht wird Judas überbracht, nicht von Judas überbracht.'
