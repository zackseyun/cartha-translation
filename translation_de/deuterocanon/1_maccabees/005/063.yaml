  yaml_path: translation/deuterocanon/1_maccabees/005/063.yaml
  text: And the man Judas and his brothers were greatly glorified before all Israel and all the nations, wherever their name was heard.
translation:
  language: de
  text: Und der Mann Judas[a] und seine Brüder wurden vor ganz Israel und allen Völkern hoch geehrt, überall, wo man ihren Namen hörte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „der Mann Judas“. Die ungewöhnliche appositionelle Bezeichnung wird hier beibehalten und nicht zu „Judas“ geglättet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀνὴρ Ἰούδας
  choice: der Mann Judas
  rationale: Die auffällige appositionelle Bezeichnung ὁ ἀνήρ vor dem Eigennamen wird beibehalten, statt sie stillschweigend zu Judas zu verkürzen.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: seine Brüder
  rationale: Die natürliche moderne Wiedergabe bezeichnet im Zusammenhang Judas’ männliche Angehörige beziehungsweise Mitstreiter aus seiner Familie.
- source_word: ἐδοξάζοντο σφόδρα
  choice: wurden hoch geehrt
  rationale: Die Form bezeichnet hier große öffentliche Ehre und Anerkennung. „Hoch geehrt“ gibt den Sinn im Deutschen natürlicher wieder als „sehr verherrlicht“ und bewahrt durch das Passiv die Perspektive des griechischen Textes.
- source_word: ἐναντίον παντὸς Ἰσραὴλ καὶ τῶν ἐθνῶν πάντων
  choice: vor ganz Israel und allen Völkern
  rationale: „Vor“ bewahrt die Vorstellung der öffentlichen Wahrnehmung beziehungsweise Wertschätzung; ἔθνη wird im breiten geschichtlich-politischen Sinn mit „Völker“ wiedergegeben.
- source_word: οὗ ἠκούετο τὸ ὄνομα αὐτῶν
  choice: überall, wo man ihren Namen hörte
  rationale: Die verallgemeinernde Ortsangabe und das Quellenidiom vom Hören ihres Namens bleiben erhalten, ohne „Name“ deutend durch „Ruhm“ oder „Nachricht“ zu ersetzen.
