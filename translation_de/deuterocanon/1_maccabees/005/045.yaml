lexical_decisions:
- source_word: συνήγαγεν
  choice: versammelte
  rationale: Das Verb bezeichnet hier das Zusammenbringen einer verstreuten Bevölkerung. „Versammelte“ gibt die konkrete Handlung klar und ohne zusätzliche militärische Deutung wieder.
- source_word: πάντα Ἰσραὴλ τοὺς ἐν τῇ Γαλααδίτιδι
  choice: alle Israeliten, die in Gilead waren
  rationale: Gemeint ist die gesamte dort anwesende israelitische Bevölkerung. Die natürliche deutsche Pluralform vermeidet die schwerfällige Konstruktion „ganz Israel, das …“.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: vom Geringsten bis zum Größten
  rationale: Die feste Wendung bezeichnet umfassende Gesamtheit und kann Rang, Alter oder gesellschaftliche Stellung einschließen. Die Übersetzung bewahrt diese Bedeutungsbreite, statt sie auf „Jung und Alt“ zu verengen.
- source_word: ἀποσκευήν
  choice: Gepäck
  rationale: Das Wort bezeichnet die mitgeführten beweglichen Güter einer reisenden Gruppe. „Gepäck“ ist direkt und enger am griechischen Ausdruck als „Besitz“ oder „Vorräte“.
- source_word: παρεμβολὴν μεγάλην σφόδρα
  choice: eine überaus große Schar
  rationale: παρεμβολή kann besonders im militärischen Zusammenhang ein Lager bezeichnen, fasst hier jedoch die versammelten Menschen mit Familien und Gepäck zusammen. „Schar“ bezeichnet die große Menschengruppe, ohne sie ausschließlich als Heer oder festes Lager zu verstehen; „überaus groß“ gibt μεγάλην σφόδρα wieder.
- source_word: ἐλθεῖν εἰς γῆν Ἰούδα
  choice: um in das Land Juda zu ziehen
  rationale: Der Infinitiv bezeichnet Ziel oder Absicht des Versammelns. „Ziehen“ ist bei einer großen Gruppe mit Familien und Gepäck im Deutschen natürlicher als „kommen“, ohne eine Rückkehr ausdrücklich in den Text hineinzulesen.
