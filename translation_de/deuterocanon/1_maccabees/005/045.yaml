translation:
  language: de
  text: Und Judas versammelte alle Israeliten, die in Gilead waren, vom Geringsten bis zum Größten, samt ihren Frauen, ihren Kindern und ihrem Gepäck – eine überaus große Schar[a] –, um in das Land Juda zu kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein überaus großes Lager“. Das griechische Wort παρεμβολή bezeichnet häufig ein Lager, besonders im militärischen Zusammenhang; hier kann es weiter gefasst die versammelte Gruppe mit ihren Familien und ihrem Gepäck meinen.'
