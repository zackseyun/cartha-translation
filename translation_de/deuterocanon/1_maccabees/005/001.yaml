base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/001.yaml
  text: And it happened that when the surrounding nations heard that the altar had been rebuilt and the sanctuary rededicated as before, they became very angry.
translation:
  language: de
  text: Und als die Völker ringsum hörten, dass der Altar wieder aufgebaut und das Heiligtum wie zuvor neu geweiht worden war, wurden sie sehr zornig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Und als
  rationale: Die semitisch geprägte griechische Erzählformel leitet einen neuen Abschnitt mit einer Zeitangabe ein. Im modernen Deutschen gibt „Und als“ ihre Funktion natürlich und würdig wieder; ein wörtliches „Und es geschah, als“ wäre hier unnötig schwerfällig.
- source_word: τὰ ἔθνη κυκλόθεν
  choice: die Völker ringsum
  rationale: „Völker“ entspricht ἔθνη, ohne die kontextuell naheliegende Bedeutung „Nichtjuden“ ausdrücklich in den Text einzutragen. „ringsum“ bewahrt den geografischen Sinn von κυκλόθεν.
- source_word: ᾠκοδομήθη
  choice: wieder aufgebaut
  rationale: Das Verb bezeichnet wörtlich das Bauen; der geschichtliche Zusammenhang ist die Wiederherstellung nach der Entweihung. „wieder aufgebaut“ macht diesen im Kontext klaren Wiederherstellungsaspekt deutlich.
- source_word: τὸ θυσιαστήριον
  choice: der Altar
  rationale: „Altar“ ist die direkte und im kultischen Zusammenhang eindeutige deutsche Entsprechung.
- source_word: ἐνεκαινίσθη
  choice: neu geweiht
  rationale: Das Verb bezeichnet Erneuerung beziehungsweise erneute Einweihung. Im Tempelkontext gibt „neu geweiht“ den kultischen Vorgang klar und idiomatisch wieder.
- source_word: τὸ ἁγίασμα
  choice: das Heiligtum
  rationale: Das Substantiv bezeichnet hier den geheiligten Tempelbereich. „Heiligtum“ ist im Deutschen präzise, geläufig und angemessen.
- source_word: ὡς τὸ πρότερον
  choice: wie zuvor
  rationale: Die knappe Wendung bezeichnet die Wiederherstellung des früheren Zustands; „wie zuvor“ bewahrt diese Offenheit und fügt kein zusätzliches Bezugswort ein.
- source_word: ὠργίσθη σφόδρα
  choice: wurden sie sehr zornig
  rationale: Die Form beschreibt das Aufkommen starken Zorns. „sehr zornig“ ist verständlich und würdig, ohne die Intensität von σφόδρα abzuschwächen.
theological_decisions:
- issue: Bedeutung von τὰ ἔθνη im jüdischen Geschichtskontext
  choice: die Völker ringsum
  alternative: die Heiden ringsum; die umliegenden nichtjüdischen Völker
  rationale: Der griechische Text sagt zunächst „die Völker ringsum“. Der Kontext macht ihre nichtjüdische Identität wahrscheinlich, doch „Völker“ bewahrt die Ausdrucksweise der Quelle und vermeidet zusätzliche religiöse Wertungen.
- issue: Verhältnis von Altar und Heiligtum in der Wiederherstellung
  choice: der Altar wieder aufgebaut und das Heiligtum ... neu geweiht
  alternative: der Altar erbaut und das Heiligtum erneuert
  rationale: 'Die unterschiedlichen Verben werden differenziert wiedergegeben: Der Altar wird baulich wiederhergestellt, das Heiligtum kultisch erneuert beziehungsweise neu geweiht. So bleibt die sachliche Spannung des griechischen Wortlauts erhalten.'
translation_notes:
  register: Modernes Standarddeutsch in einem natürlichen, würdigen Erzählstil. Die hypotaktisch mögliche, im Deutschen aber schwerfällige Formel „Und es geschah, als“ wurde funktional mit „Und als“ wiedergegeben. Keine konfessionell markierten Ausdrücke oder erklärenden Zusätze.
