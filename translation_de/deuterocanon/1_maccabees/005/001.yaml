  text: Καὶ ἐγένετο ὅτε ἤκουσαν τὰ ἔθνη κυκλόθεν ὅτι ᾠκοδομήθη τὸ θυσιαστήριον καὶ ἐνεκαινίσθη τὸ ἁγίασμα ὡς τὸ πρότερον, καὶ ὠργίσθη σφόδρα.
