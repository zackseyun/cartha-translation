  yaml_path: translation/deuterocanon/1_maccabees/005/038.yaml
  text: And Judas sent men to spy out the camp[a], and they reported to him, saying, “All the nations around you have gathered together against them—a very great force.”
translation:
  language: de
  text: 'Judas sandte aus, das Lager auszukundschaften. Sie meldeten ihm: »Alle Völker rings um euch sind gegen sie versammelt – eine überaus große Streitmacht.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem überlieferten Griechisch: »rings um euch … gegen sie«. Der Wechsel der Pronomen ist in diesem Zusammenhang unerwartet; manche Wiedergaben glätten ihn zu »gegen euch« oder »rings um uns«.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: schickte Männer aus
  rationale: Das Verb bezeichnet im Erzählzusammenhang das Entsenden; das im Griechischen unausgesprochene Objekt wird im Deutschen natürlich ergänzt, da Menschen das Lager auskundschaften.
- source_word: κατασκοπῆσαι
  choice: auszukundschaften
  rationale: Gibt die gezielte militärische Erkundung präzise und in natürlichem modernem Deutsch wieder.
- source_word: παρεμβολήν
  choice: das Lager
  rationale: παρεμβολή bezeichnet hier das militärische Lager; »Lager« ist knapp, eindeutig und idiomatisch.
- source_word: ἀπήγγειλαν
  choice: meldeten
  rationale: Passt zur Rückkehr von Kundschaftern und gibt das Überbringen eines Berichts natürlich wieder.
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: haben sich zusammengeschlossen
  rationale: Die perfektische Umschreibung beschreibt einen durch das Zusammenkommen entstandenen gegenwärtigen Zustand; im militärischen Kontext bezeichnet sie zugleich den Zusammenschluss der Gruppen.
- source_word: πρὸς αὐτοὺς
  choice: gegen sie
  rationale: πρός bezeichnet im militärischen Zusammenhang am ehesten eine feindliche Ausrichtung. Das überlieferte Pronomen der dritten Person bleibt erhalten.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: ἔθνη meint hier die ethnisch-politischen Gruppen der Umgebung; »Völker« ist weniger modern-staatlich als »Nationen« und vermeidet die stärker religiös markierte Wiedergabe »Heiden«.
- source_word: τὰ κύκλῳ ὑμῶν
  choice: rings um euch
  rationale: Bewahrt die zweite Person Plural des überlieferten griechischen Textes und bezeichnet die umliegenden Gruppen idiomatisch.
- source_word: δύναμις πολλὴ σφόδρα
  choice: eine überaus große Streitmacht
  rationale: δύναμις bezeichnet hier eine militärische Macht beziehungsweise Truppenstärke; »Streitmacht« macht diesen Sinn deutlich, und »überaus« gibt die starke Intensivierung durch σφόδρα wieder.
theological_decisions:
- issue: Unerwarteter Wechsel der Pronomen in τὰ κύκλῳ ὑμῶν ... πρὸς αὐτούς
  choice: »rings um euch ... gegen sie«
  alternative: »rings um euch ... gegen euch« oder »rings um uns ... gegen uns«
  rationale: Die überlieferte griechische Formulierung enthält die zweite Person »euch« und anschließend die dritte Person »sie«. Diese Spannung wird nicht stillschweigend harmonisiert, sondern im Text bewahrt und in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper militärischer Erzählweise. Die direkte Rede wird ohne das im Deutschen schwerfällige einleitende »indem sie sagten« gestaltet. Die genuine pronominale Spannung des griechischen Textes bleibt sichtbar.
