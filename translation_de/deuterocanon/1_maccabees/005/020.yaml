  text: And three thousand men were assigned to Simon to go into Galilee, but eight thousand men to Judas into Gilead.
translation:
  language: de
  text: Und Simon wurden dreitausend Männer zugeteilt, um nach Galiläa zu ziehen, Judas aber achttausend Männer, um nach Gilead zu ziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμερίσθησαν
  choice: wurden zugeteilt
  rationale: Das Passiv von μερίζω bezeichnet hier die Zuteilung von Truppen an die beiden Befehlshaber. „Wurden zugeteilt“ gibt diesen militärisch-organisatorischen Sinn natürlich wieder und bewahrt zugleich den Gedanken des Aufteilens.
- source_word: ἄνδρες
  choice: Männer
  rationale: Das griechische Wort bezeichnet ausdrücklich Männer. Der militärische Zusammenhang macht deutlich, dass es sich um kämpfende Männer handelt; „Soldaten“ wäre jedoch eine verdeutlichende Ergänzung.
- source_word: τρισχίλιοι / ὀκτακισχίλιοι
  choice: dreitausend / achttausend
  rationale: Die Zahlen werden unmittelbar und ausgeschrieben wiedergegeben.
- source_word: τοῦ πορευθῆναι
  choice: damit sie ... zogen
  rationale: Der artikulierte Infinitiv drückt den Zweck der Zuteilung aus. Die finite Form mit „damit“ ist im Deutschen natürlich und bezieht die Bewegung eindeutig auf die Simon zugeteilten Männer, ohne das nicht ausdrücklich militärische Verb durch „marschieren“ zu verstärken.
- source_word: Γαλιλαίαν
  choice: Galiläa
  rationale: Übliche deutsche Form des geografischen Namens.
- source_word: Ἰούδα
  choice: Judas
  rationale: Ἰούδα ist hier die flektierte Form des Personennamens Judas und bezeichnet den Befehlshaber, nicht das Stammesgebiet Juda.
- source_word: Γαλααδῖτιν
  choice: Gilead
  rationale: Das Wort bezeichnet die Landschaft Gilead. Die übliche deutsche Kurzform genügt im Zusammenhang; „das Gebiet Gilead“ wäre eine mögliche explizitere Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ellipse im zweiten griechischen Satzglied wird beibehalten, ohne ein zusätzliches Bewegungsverb einzusetzen. „Für Gilead“ klingt im Deutschen natürlicher als „nach Gilead“, da das griechische zweite εἰς syntaktisch ohne wiederholten Infinitiv steht und sowohl Zielrichtung als auch Einsatzgebiet anklingen lässt.
