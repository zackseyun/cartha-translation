  - severity: medium
    issue: „für Gilead“ gibt εἰς Γαλααδῖτιν nicht präzise wieder.
    rationale: εἰς bezeichnet hier die Richtung bzw. das Ziel des Gehens. „Für Gilead“ verschiebt den Sinn zu einem Einsatz zugunsten oder im Interesse Gileads; „nach Gilead zu ziehen“ bewahrt den Zweck und die Zielrichtung.
