  text: And they said[a], “Let us also make a name for ourselves[b], and let us go to fight against the nations around us.”
translation:
  language: de
  text: 'Und sie sagten: »Auch wir wollen uns einen Namen machen[a] und gegen die Völker rings um uns in den Krieg ziehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »uns Ruhm erwerben«. Wörtlich: »uns einen Namen machen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσωμεν ... ἑαυτοῖς ὄνομα
  choice: wir wollen uns einen Namen machen
  rationale: Der hortative Aorist Konjunktiv wird im Deutschen natürlich mit »wir wollen« wiedergegeben. Die Wendung »sich einen Namen machen« bewahrt das griechische Bild und ist im modernen Deutschen verständlich.
- source_word: καὶ αὐτοὶ
  choice: auch wir
  rationale: Die betonten Pronominalformen drücken aus, dass sie selbst es ebenfalls tun wollen; »auch wir« erhält diese Hervorhebung.
- source_word: πορευθῶμεν πολεμῆσαι
  choice: in den Krieg ziehen
  rationale: Die Verbindung aus Bewegungsverb und πολεμεῖν bezeichnet hier das Ausziehen zum Krieg. Die deutsche Wendung ist natürlich und gibt den militärischen Sinn wieder, ohne einen Erfolg vorwegzunehmen.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: ἔθνη bezeichnet im Zusammenhang die umliegenden nichtjüdischen Völker. »Völker« bleibt quellennah und vermeidet eine unnötig theologisch verengende Wiedergabe.
- source_word: τὰ κύκλῳ ἡμῶν
  choice: rings um uns
  rationale: Die Formulierung gibt die räumliche Bedeutung von κύκλῳ mit Genitiv knapp und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung der Wendung »sich einen Namen machen«
  choice: Das Bild wird als »uns einen Namen machen« beibehalten.
  alternative: uns Ruhm erwerben
  rationale: Die wörtlich-bildhafte Wendung ist auch im Deutschen geläufig und bewahrt den möglichen biblischen Anklang an das Streben nach Ansehen, ohne das Motiv stärker zu bewerten als der griechische Text.
- issue: Wiedergabe von ἔθνη
  choice: die Völker
  alternative: die Heiden
  rationale: Der historische und militärische Zusammenhang meint die umliegenden fremden beziehungsweise nichtjüdischen Völker. »Völker« wahrt die lexikalische Breite und vermeidet zusätzliche religiöse Wertung.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die direkte Rede klingt entschlossen, aber nicht unnötig archaisch. Das griechische Idiom wird in einer geläufigen deutschen Entsprechung bewahrt.
