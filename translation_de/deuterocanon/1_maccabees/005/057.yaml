  source_fidelity: Die Übersetzung gibt den griechischen Wortlaut zuverlässig wieder. »Auch wir« entspricht der hervorgehobenen additiven Wendung καὶ αὐτοί; »uns einen Namen machen« bewahrt das Idiom ποιεῖν ... ὄνομα samt dem Dativ des Vorteils; und »gegen die Völker rings um uns in den Krieg ziehen« vermittelt πορευθῶμεν πολεμῆσαι πρὸς τὰ ἔθνη τὰ κύκλῳ ἡμῶν ohne zusätzliche inhaltliche Festlegung.
