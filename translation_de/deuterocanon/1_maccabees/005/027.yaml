  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache bleibt konkret. „Ihre Feinde“ verdeutlicht den im griechischen Verb enthaltenen, aus dem Zusammenhang erschließbaren Subjektwechsel; „alle Eingeschlossenen“ macht den durch das griechische Genus eindeutigen Personenbezug im Deutschen klar.
