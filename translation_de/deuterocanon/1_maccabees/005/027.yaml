  text: And in the other cities of Gilead they are shut in[a]; tomorrow they will encamp against the strongholds, capture them[c][b], and destroy all of them in a single day.
translation:
  language: de
  text: Auch in den übrigen Städten Gileads sind sie eingeschlossen.[a] Morgen wollen ihre Feinde gegen die Festungen ihr Lager aufschlagen,[b] sie einnehmen und alle Eingeschlossenen an einem einzigen Tag vernichten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eingekesselt“ beziehungsweise „belagert“. Das griechische Wort beschreibt Menschen, die unter feindlichem Druck eingeschlossen sind, ohne zwingend einen technischen Belagerungsbegriff zu verwenden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Morgen werden ihre Feinde …“. Das griechische Verb kann hier sowohl die bevorstehende Handlung als auch die dahinterstehende Absicht ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: „Vernichten“ kann auch mit „vollständig auslöschen“ wiedergegeben werden. Der griechische Ausdruck ist in diesem militärischen Zusammenhang sehr stark.
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπαῖς πόλεσιν
  choice: übrigen Städten
  rationale: λοιπός bezeichnet hier die verbleibenden beziehungsweise anderen Städte; „übrigen“ gibt den Bezug knapp und natürlich wieder.
- source_word: τῆς Γαλααδίτιδος
  choice: Gileads
  rationale: Die Gebietsbezeichnung wird mit der im Deutschen geläufigen geografischen Form „Gilead“ wiedergegeben.
- source_word: συνειλημμένοι
  choice: eingeschlossen
  rationale: Das Perfekt Passiv beschreibt einen fortdauernden Zustand des Eingeschlossenseins unter feindlichem Druck, ohne zwingend eine förmliche Belagerung vorauszusetzen.
- source_word: εἰς αὔριον
  choice: Morgen
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: πάσονται
  choice: wollen
  rationale: Im Zusammenhang bezeichnet die Form die unmittelbar bevorstehende Absicht beziehungsweise den gefassten Plan. „Wollen“ wahrt diesen intentionalen Zug, statt nur ein neutrales Futur auszudrücken.
- source_word: παρεμβαλεῖν
  choice: vor den Festungen ihr Lager aufschlagen
  rationale: Die militärische Grundbedeutung des Verbs, ein Lager gegen einen Ort aufzuschlagen, bleibt erhalten; eine bereits vollzogene Belagerung oder ein unmittelbarer Angriff wird nicht vorweggenommen.
- source_word: τὰ ὀχυρώματα
  choice: die Festungen
  rationale: ὀχύρωμα bezeichnet befestigte Plätze oder Bollwerke; „Festungen“ ist hier klar und natürlich.
- source_word: καταλαβέσθαι
  choice: sie einnehmen
  rationale: Das Verb bezeichnet die gewaltsame Besitzergreifung beziehungsweise Einnahme der befestigten Orte.
- source_word: ἐξᾶραι
  choice: vernichten
  rationale: Mit menschlichem Objekt und im militärischen Zusammenhang bezeichnet das Verb die vollständige Beseitigung durch Tötung; „vernichten“ wahrt die Härte, ohne umgangssprachlich zu werden.
- source_word: ἅπαντας αὐτοὺς
  choice: alle Eingeschlossenen
  rationale: Das maskuline Pronomen verweist auf die Menschen, nicht auf die sächlichen ὀχυρώματα. Die explizite deutsche Form verhindert einen falschen Bezug auf die Festungen und bewahrt die betonte Gesamtheit.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: an einem einzigen Tag
  rationale: „Einzigen“ bringt die Betonung der kurzen, vollständigen Durchführung natürlich zum Ausdruck.
