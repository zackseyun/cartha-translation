  text: And Gorgias came out from the city, and his men, to meet them in battle.
translation:
  language: de
  text: Da zog Gorgias mit seinen Männern aus der Stadt hinaus, um ihnen zum Kampf entgegenzutreten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zog … hinaus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet das Verlassen eines Ortes. „zog … hinaus“ ist im militärischen Erzählzusammenhang natürlich und gibt die Bewegung aus der Stadt wieder.
- source_word: πόλεως
  choice: Stadt
  rationale: πόλις bezeichnet eine Stadt oder Ortschaft; „Stadt“ ist hier die übliche und kontextgerechte Wiedergabe.
- source_word: οἱ ἄνδρες αὐτοῦ
  choice: mit seinen Männern
  rationale: Gemeint sind Gorgias’ Männer als kämpfende Truppe. „seine Männer“ bewahrt die nichttechnische Ausdrucksweise des Griechischen, ohne ausdrücklich „Soldaten“ einzutragen. Das deutsche „mit“ macht natürlich deutlich, dass Gorgias und seine Männer gemeinsam hinauszogen.
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: um ihnen … entgegenzutreten
  rationale: Die Wendung εἰς συνάντησιν mit Dativ bezeichnet das Entgegengehen zu einer Begegnung; im militärischen Zusammenhang ist „entgegentreten“ idiomatisch und lässt den feindlichen Charakter erkennen.
- source_word: εἰς πόλεμον
  choice: zum Kampf
  rationale: 'Die Wendung bezeichnet die Absicht beziehungsweise das Ziel der Begegnung: den bewaffneten Kampf. „zum Kampf“ ist prägnant und bewahrt die Zielrichtung von εἰς.'
