  text: And he commanded them[a], saying, “Take care of this people, and do not join battle with the nations until we return.”
translation:
  language: de
  text: 'Und er befahl ihnen: „Kümmert euch um dieses Volk[a] und lasst euch nicht auf einen Krieg mit den Völkern ein, bis wir zurückkehren.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wacht über dieses Volk.“ Die griechische Aufforderung kann sowohl schützende Fürsorge als auch allgemeine Wachsamkeit betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: befahl
  rationale: Das Verb bezeichnet einen verbindlichen Auftrag und wahrt hier den autoritativen Ton.
- source_word: Πρόσεχετε, τοῦ λαοῦ τούτου
  choice: Kümmert euch um dieses Volk
  rationale: Mit dem Genitiv bezeichnet die Aufforderung fürsorgliche und schützende Aufmerksamkeit; die deutsche Formulierung ist natürlich und lässt diesen praktischen Sinn erkennen.
- source_word: μὴ συνάψητε πόλεμον
  choice: lasst euch nicht auf einen Krieg … ein
  rationale: Die Wendung bezeichnet das Eintreten in eine kriegerische Auseinandersetzung. Diese Übersetzung gibt das Verbot idiomatisch wieder, ohne ausdrücklich festzulegen, wer den Konflikt beginnen würde.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Die Bezeichnung meint hier die umliegenden nichtjüdischen Völker. „Völker“ bleibt transparent und vermeidet eine unnötig neutestamentlich geprägte Festlegung auf „Heiden“.
- source_word: ἕως τοῦ ἐπιστρέψαι ἡμᾶς
  choice: bis wir zurückkehren
  rationale: Die Konstruktion mit ἕως und substantiviertem Infinitiv setzt eine zeitliche Grenze und wird so in natürlichem Deutsch wiedergegeben.
