  text: And he set out to go into the land of the foreigners[a], and he passed through Samaria.
translation:
  language: de
  text: Und er brach auf, um in das Land der Fremden[a] zu ziehen, und zog durch Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „das Land der Philister“. Das griechische Wort ἀλλόφυλοι kann im biblischen Sprachgebrauch als herkömmliche Bezeichnung für die Philister dienen. Hier bleibt die weitere Wiedergabe „Fremden“ stehen, weil der Vers selbst die Volksgruppe nicht genauer bestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: er brach auf
  rationale: Der Aorist bezeichnet hier den Beginn der Bewegung; „brach auf“ gibt diesen ingressiven Sinn im Deutschen natürlich wieder.
- source_word: τοῦ πορευθῆναι
  choice: um … zu ziehen
  rationale: Der artikulierte Infinitiv bezeichnet nach ἀπῆρεν Zweck beziehungsweise beabsichtigte Handlung. „Um … zu ziehen“ bildet diese Beziehung klar ab.
- source_word: γῆν ἀλλοφύλων
  choice: das Land der Fremden
  rationale: ἀλλόφυλοι kann im biblischen Griechisch als herkömmliche Bezeichnung für die Philister dienen, bedeutet der Form nach aber Menschen eines anderen Volkes oder Stammes. Die weitere Wiedergabe wahrt die Unbestimmtheit des Verses.
- source_word: διεπορεύετο
  choice: zog durch
  rationale: Das Imperfekt schildert die fortdauernde Bewegung durch ein Gebiet; „zog durch“ ist knapp und idiomatisch.
- source_word: τὴν Σαμάριαν
  choice: Samaria
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „ziehen/zog“ spiegelt die beiden griechischen Bewegungsverben, ohne unnatürlich zu wirken; die mögliche engere ethnische Bedeutung von ἀλλόφυλοι wird in der Fußnote bewahrt.
