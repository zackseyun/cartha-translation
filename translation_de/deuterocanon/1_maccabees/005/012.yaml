  yaml_path: translation/deuterocanon/1_maccabees/005/012.yaml
  text: Now then[a], come and rescue us from their hand[b], because a great number of our people has fallen.
translation:
  language: de
  text: Komm nun und rette uns aus ihrer Hand[a], denn eine große Zahl von uns ist gefallen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ihrer Gewalt“. Wörtlich steht im Griechischen „aus ihrer Hand“, eine geläufige Wendung für feindliche Herrschaft oder Verfügungsgewalt.'
    reason: lexical_alternative
  - marker: b
    text: „Gefallen“ kann hier Tod, Niederlage oder beides bezeichnen; das Griechische legt den Akzent nicht eindeutig fest.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun also
  rationale: Die Verbindung wahrt sowohl den zeitlichen Bezug von νῦν als auch die folgernde bzw. überleitende Kraft von οὖν und klingt in einer dringenden Bitte natürlich.
- source_word: ἐλθὼν
  choice: komm
  rationale: 'Das formal vorangestellte Aoristpartizip ist mit dem folgenden Imperativ verbunden. Im Deutschen wird diese Aufforderungsfolge idiomatisch mit zwei koordinierten Imperativen wiedergegeben: „komm und rette“.'
- source_word: ἔξελου
  choice: rette
  rationale: ἐξαιρέω bezeichnet hier das Herausreißen aus Gefahr oder feindlicher Gewalt. „Rette“ ist gegenwärtig, klar und der Dringlichkeit des Hilferufs angemessen.
- source_word: ἐκ χειρὸς αὐτῶν
  choice: aus ihrer Hand
  rationale: Die deutsche Wendung bewahrt das griechische Bild der „Hand“ als Ausdruck feindlicher Gewalt oder Verfügungsgewalt, ohne die Bedeutung im Haupttext festzulegen.
- source_word: πέπτωκεν
  choice: ist gefallen
  rationale: Die wörtliche militärische Wendung bewahrt offen, ob vor allem Tod, Niederlage oder beides gemeint ist.
- source_word: ἐξ ἡμῶν
  choice: von uns
  rationale: Die knappe Form entspricht dem Griechischen eng und ist zusammen mit „eine große Zahl“ im Deutschen verständlich und natürlich.
- source_word: πλῆθος
  choice: eine große Zahl
  rationale: Die Wiedergabe erhält den quantitativen Nachdruck des singularischen Kollektivbegriffs πλῆθος.
theological_decisions:
- issue: Bedeutungsumfang von πέπτωκεν im militärischen Zusammenhang
  choice: ist gefallen
  alternative: ist umgekommen / ist besiegt worden
  rationale: Der griechische Ausdruck entscheidet nicht eindeutig zwischen Tod und Niederlage. Die Übersetzung bewahrt diese sachlich bedeutsame Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit der unmittelbaren Dringlichkeit eines Hilferufs. Das Bild „aus ihrer Hand“ und die Mehrdeutigkeit von „gefallen“ bleiben erhalten; Satzbau und Imperativfolge sind zugleich natürlich deutsch.
