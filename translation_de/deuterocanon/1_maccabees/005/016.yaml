base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/016.yaml
  text: When Judas and the people heard these words[b][a], a great assembly gathered to consider what they should do for their brothers who were in distress and being attacked by them.
translation:
  language: de
  text: Als Judas und das Volk diese Worte[a] hörten, kam eine große Versammlung zusammen, um zu beraten, was sie für ihre Brüder[b] tun sollten, die in Bedrängnis waren und von ihnen[c] angegriffen wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Berichte“ beziehungsweise „diese Nachricht“; wörtlich: „diese Worte“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Brüder“ sind hier Angehörige desselben jüdischen Volkes gemeint.
    reason: cultural_note
  - marker: c
    text: Gemeint sind im Zusammenhang wohl die feindlichen Völker; der griechische Text sagt nur „von ihnen“.
    reason: ambiguity_note
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Als … hörten
  rationale: Ὡς mit dem Aorist leitet hier einen temporalen Nebensatz ein. Das deutsche „als“ gibt die Erzählfolge natürlich wieder; wegen des zusammengesetzten Subjekts steht das Verb im Deutschen im Plural.
- source_word: Ἰούδας
  choice: Judas
  rationale: Die in deutschen Bibelübersetzungen übliche Namensform wird beibehalten.
- source_word: ὁ λαός
  choice: das Volk
  rationale: λαός bezeichnet hier das jüdische Volk beziehungsweise die mit Judas verbundene Gemeinschaft, nicht ausdrücklich nur das Heer.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Die formnahe Wiedergabe bewahrt λόγους; im Zusammenhang kann die Wendung zugleich die überbrachte Nachricht oder die Berichte meinen.
- source_word: ἐπισυνήχθη ἐκκλησία μεγάλη
  choice: kam eine große Versammlung zusammen
  rationale: Die Formulierung gibt den Vorgang des Zusammenkommens idiomatisch wieder. „Versammlung“ vermeidet für ἐκκλησία eine anachronistische kirchliche Festlegung.
- source_word: βουλεύσασθαι τί ποιήσωσιν
  choice: um zu beraten, was sie … tun sollten
  rationale: Der Zweck des Zusammenkommens und der deliberative Sinn der indirekten Frage werden im Deutschen ausdrücklich erhalten.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: für ihre Brüder
  rationale: Die konkrete Verwandtschaftsmetapher des griechischen Textes bleibt stehen; gemeint sind hier Angehörige desselben jüdischen Volkes.
- source_word: τοῖς οὖσιν ἐν θλίψει
  choice: die in Bedrängnis waren
  rationale: „Bedrängnis“ erfasst den Druck und die Not, die θλίψις bezeichnet, in würdigem und verständlichem Deutsch.
- source_word: πολεμουμένοις ὑπʼ αὐτῶν
  choice: und von ihnen angegriffen wurden
  rationale: „Angegriffen“ gibt die feindliche, militärische Handlung des passiven Partizips natürlich wieder. Das Pronomen bleibt entsprechend dem Griechischen unaufgelöst.
theological_decisions:
- issue: Bedeutung von ἐκκλησία im jüdischen historischen Kontext
  choice: Versammlung
  alternative: Gemeinde
  rationale: „Versammlung“ gibt den öffentlichen Zusammenkunftscharakter wieder, ohne spätere christlich-kirchliche Bedeutungen in den Text einzutragen.
- issue: Wiedergabe von ἀδελφοῖς als Bezeichnung der Volksgenossen
  choice: Brüder
  alternative: Volksgenossen / Brüder und Schwestern
  rationale: Die männliche Verwandtschaftsbezeichnung des Ausgangstextes wird bewahrt; eine Fußnote erläutert ihren gemeinschaftlichen Bezug, ohne den Wortlaut zu neutralisieren.
- issue: Bezug von ὑπʼ αὐτῶν
  choice: von ihnen
  alternative: von den feindlichen Völkern
  rationale: Der unmittelbare Vers nennt den Bezug des Pronomens nicht ausdrücklich. Die Übersetzung bewahrt diese formale Offenheit; der weitere Zusammenhang legt die feindlichen Völker nahe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Erzählbewegung, bleibt jedoch flüssig. „Versammlung“ ist historisch passend, „Bedrängnis“ bewahrt den ernsten Ton, und die pronominale Mehrdeutigkeit am Versende wird nicht stillschweigend aufgelöst.
