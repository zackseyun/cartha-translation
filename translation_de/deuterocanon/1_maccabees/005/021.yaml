  yaml_path: translation/deuterocanon/1_maccabees/005/021.yaml
  text: And Simon went into Galilee, and fought many battles against the nations; and the nations were crushed before him.
translation:
  language: de
  text: Und Simon zog nach Galiläa und führte viele Kämpfe gegen die Völker; da wurden die Völker vor ihm zerschmettert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: zog
  rationale: Das Verb bedeutet grundsätzlich »gehen/reisen«. Im militärischen Erzählzusammenhang ist »zog« natürlich, ohne den ausdrücklich stärkeren Sinn von »marschierte« einzutragen.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: Bei geografischen Namen gibt »nach« im Deutschen die durch εἰς bezeichnete Bewegung in das Gebiet natürlich wieder.
- source_word: συνῆψεν πόλεμους πολλοὺς
  choice: führte viele Kämpfe
  rationale: Die Verbindung bezeichnet das Aufnehmen beziehungsweise Führen kriegerischer Auseinandersetzungen. »Führte viele Kämpfe« ist idiomatisch und bewahrt den Plural, ohne daraus mehrere eigenständige Kriege zu machen.
- source_word: πρὸς τὰ ἔθνη
  choice: gegen die Völker
  rationale: ἔθνη bezeichnet hier die nichtjüdischen Volksgruppen, gegen die Simon kämpft. »Völker« bleibt neutraler und quellennäher als das theologisch stärker markierte »Heiden«.
- source_word: συνετρίβη
  choice: wurden zerschmettert
  rationale: Der Passiv-Aorist von συντρίβω bezeichnet ein Zerbrechen oder Zerschmettern. Die kräftige Bildsprache des griechischen Textes soll nicht zum bloßen »wurden besiegt« abgeschwächt werden.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: vor ihm
  rationale: Die idiomatische Wendung beschreibt, dass die Gegner angesichts beziehungsweise vor dem Vorrücken Simons zusammenbrachen. »Vor ihm« erhält die knappe Form und lässt die räumliche wie militärische Nuance bestehen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. »Zog« passt zum militärischen Kontext, ohne das allgemeine Bewegungsverb zu überdeuten; »zerschmettert« bewahrt die markante Gewalt des griechischen Ausdrucks.
