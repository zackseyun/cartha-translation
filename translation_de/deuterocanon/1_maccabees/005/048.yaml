base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/048.yaml
  text: And Judas sent them peaceful words[a], saying, “We will pass through your land to go to our own land, and no one will harm you; we will only pass through on foot.” But they were not willing to open to him.
translation:
  language: de
  text: 'Judas sandte ihnen eine friedliche Botschaft und ließ sagen: »Wir wollen durch dein Land ziehen, um in unser eigenes Land zu gelangen. Niemand wird euch etwas antun; wir werden nur zu Fuß hindurchziehen.« Doch sie wollten ihm nicht öffnen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text lässt unausgesprochen, was sie ihm nicht öffnen wollten; gemeint sein können das Tor, die Stadt oder allgemein der Zugang und damit die Durchreise.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους εἰρηνικούς
  choice: eine friedliche Botschaft
  rationale: Die Wendung bezeichnet hier eine diplomatische, auf Frieden gerichtete Mitteilung. »Eine friedliche Botschaft« ist im modernen Deutschen natürlicher als das wörtliche »friedliche Worte«, ohne den friedlichen Charakter der Kontaktaufnahme abzuschwächen.
- source_word: Διελευσόμεθα
  choice: Wir wollen … ziehen
  rationale: Das Futur bezeichnet die beabsichtigte Durchreise. »Wir wollen durch dein Land ziehen« gibt diese Absicht im diplomatischen Zusammenhang idiomatisch wieder.
- source_word: τοῦ ἀπελθεῖν εἰς τὴν γῆν ἡμῶν
  choice: um in unser eigenes Land zu gelangen
  rationale: Der artikulierte Infinitiv drückt den Zweck aus. Die Übersetzung vermeidet das stärker deutende »zurückzukehren«, da der griechische Text lediglich das Gelangen in das eigene Land bezeichnet.
- source_word: οὐδεὶς κακοποιήσει ὑμᾶς
  choice: Niemand wird euch etwas antun
  rationale: κακοποιέω bedeutet hier, jemandem Böses beziehungsweise Schaden zuzufügen. Die gewählte Formulierung ist knapp, natürlich und dem militärisch-diplomatischen Zusammenhang angemessen.
- source_word: πλὴν τοῖς ποσὶν παρελευσόμεθα
  choice: wir werden nur zu Fuß hindurchziehen
  rationale: Die Formulierung betont die bloße, nicht feindselige Durchreise. »Zu Fuß« bewahrt das Bild von τοῖς ποσίν in geläufigem Deutsch, ohne den Ausdruck unnötig technisch auszulegen.
- source_word: οὐκ ἠβούλοντο ἀνοῖξαι αὐτῷ
  choice: sie wollten ihm nicht öffnen
  rationale: Die Übersetzung folgt der griechischen Formulierung und lässt wie sie unausgesprochen, was geöffnet werden sollte. Wahrscheinlich sind ein Tor, die Stadt oder allgemein der Zugang gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem diplomatischem Ton. Der Wechsel vom Singular »dein Land« zum Plural »euch« wird entsprechend dem griechischen Text bewahrt. Die bildhafte Wendung »zu Fuß« bleibt erhalten; das Objekt von »öffnen« wird nicht stillschweigend ergänzt.
