base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/030.yaml
  text: And when morning came, they lifted up their eyes, and behold, a great multitude, beyond number, carrying ladders and siege engines to capture the stronghold; and they were fighting them.
translation:
  language: de
  text: Als es Morgen wurde, blickten sie auf, und siehe, da war eine große, unzählbare Menge[a]. Sie trugen Leitern und Belagerungsgeräte[b] herbei, um die Festung einzunehmen, und kämpften gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine große Menge, für die es keine Zahl gab“; also eine Menge, die nicht zu zählen war.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet technische Geräte oder Maschinen, die beim Angriff auf eine befestigte Stellung eingesetzt wurden.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο ἑωθινή
  choice: Als es Morgen wurde
  rationale: Gibt die idiomatische Zeitangabe natürlich wieder und bewahrt den erzählerischen Übergang.
- source_word: ἦραν τοὺς ὀφθαλμοὺς αὐτῶν
  choice: blickten sie auf
  rationale: Natürliches modernes Deutsch für das griechische Idiom „die Augen erheben“, ohne dessen räumliche Blickbewegung zu verlieren.
- source_word: ἰδοὺ
  choice: siehe
  rationale: Bewahrt den aufmerksamkeitslenkenden und überraschenden Charakter der Partikel in einem würdigen biblischen Register.
- source_word: λαὸς πολὺς οὗ οὐκ ἦν ἀριθμός
  choice: eine große, unzählbare Menge
  rationale: Gibt sowohl die Größe als auch die ausdrücklich ausgesagte Unzählbarkeit der Menschengruppe wieder; der militärische Zusammenhang wird durch den Folgesatz deutlich.
- source_word: αἴροντες κλίμακας
  choice: Sie trugen Leitern ... herbei
  rationale: Das Partizip beschreibt die beim Angriff mitgeführte Ausrüstung; „herbeitragen“ klingt im Deutschen natürlich und zielgerichtet.
- source_word: μηχανὰς
  choice: Belagerungsgeräte
  rationale: Im militärischen Kontext bezeichnet μηχαναί technische Vorrichtungen für den Angriff auf eine Befestigung; der Ausdruck ist klarer als das allgemeine „Maschinen“.
- source_word: καταλαβεῖσθαι τὸ ὀχύρωμα
  choice: um die Festung einzunehmen
  rationale: Bewahrt die finale Bedeutung des Infinitivs und gibt ὀχύρωμα im konkreten militärischen Kontext treffend wieder.
- source_word: ἐπολέμουν αὐτούς
  choice: kämpften gegen sie
  rationale: Das Imperfekt bezeichnet einen andauernden Kampf; „gegen sie kämpfen“ ist die natürliche deutsche Konstruktion. Das Subjekt bleibt die unmittelbar zuvor genannte Menge.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischer Erzählfärbung. „Siehe“ erhält die markierende Wirkung von ἰδού; ansonsten werden schwerfällige Hebraismen vermieden. Die lange griechische Satzfolge ist zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert.
