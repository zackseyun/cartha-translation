  text: And they crossed the Jordan into the great plain opposite Baisan[a].
translation:
  language: de
  text: Sie überquerten den Jordan und gelangten in die große Ebene gegenüber von Baisan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baisan ist die griechische Form eines Ortsnamens, der häufig mit Bet-Schean identifiziert wird.
    reason: Querverweis zur geläufigen historischen Ortsbezeichnung, ohne die griechische Namensform im Haupttext zu ersetzen und ohne die Identifikation zu verabsolutieren.
lexical_decisions:
- source_word: διέβησαν
  choice: überquerten
  rationale: Der Aorist von διαβαίνω bezeichnet hier im Reisebericht das Hinübergelangen von einer Seite des Jordan auf die andere. „Überquerten“ ist im modernen Deutschen präzise und natürlich.
- source_word: τὸν Ἰορδάνην
  choice: den Jordan
  rationale: Der Eigenname mit Artikel bezeichnet den Fluss. Im Deutschen ist „den Jordan“ ohne den Zusatz „Fluss“ die übliche Form.
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: in die große Ebene
  rationale: πεδίον bezeichnet gewöhnlich eine Ebene oder flache Landschaft. „Große Ebene“ gibt Substantiv und Adjektiv unmittelbar wieder, ohne die Geografie näher festzulegen.
- source_word: κατὰ πρόσωπον
  choice: gegenüber von
  rationale: Die Wendung bezeichnet in einer geografischen Angabe eine Lage angesichts beziehungsweise gegenüber einem Ort. „Gegenüber von“ ist hier klares, heutiges Deutsch.
- source_word: Βαισάν
  choice: Baisan
  rationale: Die Form wird entsprechend dem griechischen Ortsnamen Βαισάν transliteriert. Eine Ersetzung durch „Bet-Schean“ würde die historisch identifizierte hebräische Namensform in den Haupttext eintragen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das zusätzliche „zogen“ macht das griechische Bewegungsziel nach εἰς im Deutschen idiomatisch deutlich, ohne neue inhaltliche Einzelheiten einzuführen.
