  text: And he left Joseph son of Zechariah and Azariah[a], leaders of the people, with the rest of the forces in Judea for defense.
translation:
  language: de
  text: Und er ließ Josef, den Sohn Sacharjas, und Asarja, einen Anführer des Volkes, mit den übrigen Truppen zur Bewachung[a] in Judäa zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zur Sicherung, zum Schutz oder zum Wachdienst. Der griechische Ausdruck bezeichnet das Bewachen oder Wachehalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν
  choice: ließ … zurück
  rationale: Das Verb bedeutet hier, jemanden an einem Ort zurückzulassen; eine ausdrückliche Ernennung wäre eine Überdeutung.
- source_word: Ἰώσηφον τὸν τοῦ Ζαχαρίου
  choice: Josef, den Sohn Sacharjas
  rationale: Die griechische Wendung bezeichnet die Abstammung. Diese Formulierung ist im Deutschen klar und natürlich.
- source_word: Ἀζαρίαν
  choice: Asarja
  rationale: Asarja ist die geläufige deutsche Namensform.
- source_word: ἡγούμενον τοῦ λαοῦ
  choice: einen Anführer des Volkes
  rationale: Das singularische Partizip bezieht sich grammatisch zunächst auf Asarja. „Anführer“ bewahrt die breite Bedeutung des Leitens, ohne ein bestimmtes Amt oder ausschließlich einen militärischen Rang festzulegen.
- source_word: μετὰ τῶν ἐπιλοίπων τῆς δυνάμεως
  choice: mit den übrigen Truppen
  rationale: δύναμις bezeichnet in diesem militärischen Zusammenhang die Streitkräfte, ἐπίλοιπος den verbleibenden Rest.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: in Judäa
  rationale: Übliche deutsche Wiedergabe der geografischen Bezeichnung.
- source_word: εἰς τήρησιν
  choice: zur Bewachung
  rationale: Die Wiedergabe bleibt nahe am griechischen Ausdruck für Bewahren, Bewachen oder Sichern und vermeidet ein im Ausgangstext nicht genanntes Objekt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung macht deutlich, dass Asarja im griechischen Text singularisch als Anführer bezeichnet wird, während beide Männer zusammen mit den übrigen Truppen zurückbleiben.
