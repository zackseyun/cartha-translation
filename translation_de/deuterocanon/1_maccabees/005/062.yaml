base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/062.yaml
  text: But they were not from the offspring of those men through whose hand deliverance had been given to Israel[a].
translation:
  language: de
  text: Sie aber stammten nicht von jenen Männern ab, durch deren Hand Israel Rettung zuteilgeworden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch sie«; wörtlich: »durch deren Hand«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Sie aber
  rationale: δέ setzt einen Kontrast zum vorausgehenden Zusammenhang; die Nachstellung von „aber“ ist im Deutschen natürlich und würdevoll.
- source_word: ἐκ τοῦ σπέρματος
  choice: stammten … ab
  rationale: Die Wendung bezeichnet genealogische Herkunft. Die verbale Wiedergabe ist natürliches modernes Deutsch und bewahrt den Abstammungssinn.
- source_word: τῶν ἀνδρῶν ἐκείνων
  choice: von jenen Männern
  rationale: ἀνδρῶν bezeichnet hier bestimmte männliche Gestalten; „jene Männer“ gibt sowohl das Genus als auch den rückverweisenden Charakter wieder.
- source_word: σωτηρία
  choice: Rettung
  rationale: Im historischen und militärischen Kontext bezeichnet das Wort konkrete Befreiung beziehungsweise Bewahrung Israels. „Rettung“ bleibt breit genug und vermeidet eine unnötige dogmatische Verengung.
- source_word: ἐδόθη
  choice: zuteilgeworden war
  rationale: Die passive Form wird idiomatisch wiedergegeben und wahrt den Gedanken, dass Israel die Rettung gewährt wurde; das Plusquamperfekt entspricht dem rückblickenden Zusammenhang.
- source_word: διὰ χειρὸς αὐτῶν
  choice: durch deren Hand
  rationale: Die biblisch-septuagintale Wendung für vermittelte Urheberschaft beziehungsweise Agency bleibt mit ihrem konkreten Bild erhalten und ist auf Deutsch verständlich.
theological_decisions:
- issue: Wiedergabe von σωτηρία im historisch-militärischen Zusammenhang
  choice: Rettung
  alternative: Heil; Befreiung; Sieg
  rationale: „Rettung“ erfasst die konkrete Bewahrung Israels, ohne das Wort ausschließlich auf geistliches Heil oder militärischen Sieg festzulegen.
- issue: Beibehaltung der Agency-Wendung διὰ χειρὸς αὐτῶν
  choice: durch deren Hand
  alternative: durch sie; von ihrer Hand
  rationale: Die gewählte Form bewahrt das biblische Sprachbild und lässt offen, wer letztlich als Geber der Rettung gedacht ist, während die Männer als Vermittler erscheinen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrtem biblischem Sprachbild. Die Satzstruktur ist gut verständlich, ohne die genealogische Aussage oder die Spannung zwischen gewährter Rettung und menschlicher Vermittlung zu glätten.
