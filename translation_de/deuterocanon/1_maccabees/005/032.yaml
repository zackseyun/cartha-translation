  text: And he said to the men of the force[b][a], “Fight today for our brothers.”
translation:
  language: de
  text: 'Und er sagte zu den Männern des Heeres[a]: »Kämpft heute für unsere Brüder[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Soldaten« beziehungsweise »zu den Kriegern«; wörtlich: »zu den Männern der Streitmacht«.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Brüder« können hier Angehörige der eigenen Gemeinschaft gemeint sein, nicht nur leibliche Brüder.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀνδράσιν τῆς δυνάμεως
  choice: zu den Männern des Heeres
  rationale: Die Wendung bezeichnet die männlichen Angehörigen der Streitmacht. »Männer des Heeres« bewahrt die geschlechtsspezifische Formulierung und gibt δύναμις im militärischen Zusammenhang natürlich als »Heer« wieder.
- source_word: Πολεμήσατε
  choice: Kämpft
  rationale: Der Aoristimperativ fordert zu unmittelbarem militärischem Handeln auf; »Kämpft« ist direkt, gegenwärtig und idiomatisch.
- source_word: σήμερον
  choice: heute
  rationale: Das Wort bezeichnet den gegenwärtigen Tag und unterstreicht die Dringlichkeit.
- source_word: ὑπὲρ
  choice: für
  rationale: Im Zusammenhang des Kampfes bezeichnet ὑπέρ das Eintreten zugunsten beziehungsweise zum Schutz anderer. »Für« wahrt die knappe Formulierung, ohne die genaue Stoßrichtung stärker festzulegen.
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: unsere Brüder
  rationale: Die maskuline Pluralform bezeichnet hier wahrscheinlich israelitische Volks- und Glaubensgenossen, nicht ausschließlich leibliche Brüder. »Unsere Brüder« erhält sowohl die Bildsprache als auch die gemeinschaftliche Verbundenheit.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung
  choice: unsere Brüder
  alternative: unsere Geschwister / unsere Volksgenossen
  rationale: Der griechische Text verwendet den maskulinen Plural ἀδελφῶν. Die Übersetzung bewahrt diese Form, während eine Fußnote darauf hinweist, dass der Bezug über leibliche Brüder hinausgehen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Erzählstil bleibt schlicht; der Imperativ ist knapp und eindringlich. »Heer« ist im Deutschen natürlicher als das wörtlichere »Streitmacht«, während die Fußnote die griechische Ausdrucksweise erkennen lässt.
