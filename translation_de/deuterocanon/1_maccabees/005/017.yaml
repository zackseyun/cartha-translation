  yaml_path: translation/deuterocanon/1_maccabees/005/017.yaml
  text: And Judas said to Simon his brother[a], “Choose men for yourself, and go and rescue your brothers in Galilee; but I and Jonathan my brother will go into Gileaditis.”
translation:
  language: de
  text: 'Und Judas sagte zu seinem Bruder Simon: »Wähle dir Männer aus, geh und rette deine Brüder in Galiläa. Mein Bruder Jonatan und ich dagegen werden in die Gileaditis[a] ziehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Gilead«. Das Griechische verwendet mit »Gileaditis« eine spezifischere regionale Bezeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίλεξον σεαυτῷ ἄνδρας
  choice: Wähle dir Männer aus
  rationale: Die Wendung gibt den Aoristimperativ, den reflexiven Dativ und das nicht näher bestimmte ἄνδρας direkt und zugleich idiomatisch wieder. Der militärische Zusammenhang legt Kämpfer nahe, doch der griechische Text sagt lediglich »Männer«.
- source_word: πορεύου καὶ ῥῦσαι
  choice: geh und rette
  rationale: Die beiden Imperative werden mit klaren deutschen Verben wiedergegeben. »Rette« bezeichnet hier die konkrete Befreiung aus einer Bedrohung, ohne über den Text hinaus »befreie im Kampf« einzufügen.
- source_word: τοὺς ἀδελφούς σου
  choice: deine Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten. Im Zusammenhang kann sie die jüdischen Volksgenossen meinen, doch diese Deutung wird nicht in den Haupttext eingetragen.
- source_word: ἐγὼ δὲ καὶ Ἰωναθὰν ὁ ἀδελφός μου
  choice: Mein Bruder Jonatan und ich dagegen
  rationale: Die natürliche deutsche Wortstellung benennt beide Handelnden ausdrücklich; »dagegen« bewahrt den durch δέ markierten Gegensatz zwischen den beiden Aufträgen.
- source_word: πορευσόμεθα
  choice: werden … ziehen
  rationale: Das Futur wird direkt wiedergegeben. »Ziehen« passt zu einer geplanten militärischen Unternehmung, ohne ausdrücklich einen Feldzug zu behaupten.
- source_word: εἰς τὴν Γαλααδῖτιν
  choice: in die Gileaditis
  rationale: Die spezifische griechische Regionsbezeichnung Γαλααδῖτις wird als Eigenname bewahrt, statt sie im Haupttext zum geläufigeren »Gilead« zu vereinfachen.
