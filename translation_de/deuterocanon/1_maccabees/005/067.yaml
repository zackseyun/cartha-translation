  text: On that day priests fell in battle[a], because they wanted to act bravely[b], when they went out into battle without counsel.
translation:
  language: de
  text: An jenem Tag fielen Priester im Kampf, weil er Tapferkeit beweisen wollte[a], als sie ohne Beratung[b] in den Kampf zogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen die Einzahl: „weil er Tapferkeit beweisen wollte“. Auf wen sich „er“ bezieht, wird in diesem Vers nicht ausdrücklich gesagt. Andere verstehen den Sinn dem Zusammenhang nach pluralisch: „weil sie Tapferkeit beweisen wollten“.'
    reason: textual_and_referential_ambiguity
  - marker: b
    text: 'Oder: „unüberlegt“, „vorschnell“. Das griechische Wort bezeichnet ein Handeln ohne Rat oder Beratung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: fielen
  rationale: Die im militärischen Zusammenhang übliche Wendung bezeichnet den Tod im Kampf und bewahrt den knappen, würdevollen Ton des Griechischen.
- source_word: ἱερεῖς
  choice: Priester
  rationale: Der artikellose Plural bezeichnet Angehörige der Priesterschaft, ohne dass im Deutschen ein bestimmter Artikel ergänzt werden muss.
- source_word: πολέμῳ
  choice: im Kampf
  rationale: Der Dativ bezeichnet hier am natürlichsten den Bereich beziehungsweise die Umstände ihres Fallens.
- source_word: βουλομένου αὐτοῦ
  choice: weil er … wollte
  rationale: Der Genitivus absolutus kann einen begründenden Begleitumstand ausdrücken. Das maskuline Singularpronomen wird entsprechend dem überlieferten griechischen Text beibehalten, ohne seinen Bezug festzulegen.
- source_word: ἀνδραγαθῆσαι
  choice: Tapferkeit beweisen
  rationale: Das Verb bezeichnet das Erweisen von Mut oder Tüchtigkeit. Die Formulierung ist im modernen Deutschen verständlich und vermeidet die heute missverständliche wörtliche Wendung „sich als Mann erweisen“.
- source_word: ἐν τῷ αὐτοὺς ἐξελθεῖν
  choice: als sie … zogen
  rationale: Der substantivierte Infinitiv mit eigenem Akkusativsubjekt wird als temporale Angabe wiedergegeben.
- source_word: εἰς τὸν πόλεμον
  choice: in den Kampf
  rationale: Die Präposition und der bestimmte Artikel weisen auf das Ausziehen zu einer konkreten Kampfhandlung hin.
- source_word: ἀβουλεύτως
  choice: ohne Beratung
  rationale: Die Wiedergabe hält die Grundbedeutung des Handelns ohne Rat oder vorherige Beratung offen und legt sich nicht ausschließlich auf „unüberlegt“ oder „vorschnell“ fest.
theological_decisions:
- issue: Bezug und Numerus von αὐτοῦ in βουλομένου αὐτοῦ ἀνδραγαθῆσαι
  choice: Das Singularpronomen wird mit „er“ wiedergegeben; sein Bezug bleibt unausgesprochen.
  alternative: 'Aufgrund des Zusammenhangs pluralisch verstehen: „weil sie Tapferkeit beweisen wollten“.'
  rationale: Der vorgelegte griechische Text hat eindeutig die Singularform αὐτοῦ, während das folgende αὐτούς pluralisch auf die Priester verweist. Die Übersetzung glättet diese Spannung nicht und erläutert sie in einer Fußnote.
- issue: Semantischer Wert des Genitivus absolutus βουλομένου αὐτοῦ
  choice: 'kausal: „weil er … wollte“'
  alternative: 'temporal oder begleitend: „während er … wollte“'
  rationale: Im Satzgefüge erklärt der Wunsch nach einer mutigen Tat plausibel das unberatene Ausziehen und damit mittelbar den Tod der Priester. Die grammatische Konstruktion selbst lässt jedoch auch eine allgemein begleitende Nuance zu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knappem erzählerischem und militärischem Ton. Die auffällige Spannung zwischen dem singularischen „er“ und dem pluralischen „sie“ wird entsprechend der griechischen Vorlage bewahrt und nicht stillschweigend harmonisiert.
