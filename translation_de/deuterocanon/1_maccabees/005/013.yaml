  yaml_path: translation/deuterocanon/1_maccabees/005/013.yaml
  text: And all our brothers who are in the region of Tob have been killed[a], and they have taken their wives and children captive, along with their possessions[c][b], and have destroyed about one thousand men there.
translation:
  language: de
  text: Und alle unsere Brüder, die im Gebiet von Tob[a] leben, sind getötet worden[b]. Ihre Frauen und Kinder samt ihrer Habe[c] haben sie gefangen weggeführt, und dort haben sie etwa tausend Männer getötet[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: „in den/des Toubiou“. Die genaue Form des Ortsnamens ist unsicher; wahrscheinlich ist das Gebiet von Tob gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sind gestorben“ beziehungsweise „sind tot“. Der Zusammenhang legt einen gewaltsamen Tod nahe.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihr Gepäck“, „ihren Besitz“ oder „ihre Ausrüstung“.'
    reason: lexical_alternative
  - marker: d
    text: 'Griechisch wörtlich: „haben dort etwa tausend Männer vernichtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: unsere Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten; im Zusammenhang bezeichnet sie wahrscheinlich Angehörige des eigenen jüdischen Volkes.
- source_word: οἱ ὄντες ἐν τοῖς Τουβίου
  choice: die im Gebiet von Tob leben
  rationale: Die Wendung ist sprachlich schwierig, hat aber wahrscheinlich örtlichen Sinn. „Gebiet von Tob“ gibt diesen wieder, ohne sie als Volksbezeichnung festzulegen.
- source_word: τεθανάτωνται
  choice: sind getötet worden
  rationale: Die vollendete Form beschreibt den eingetretenen Todeszustand. Der Zusammenhang feindlicher Gewalt legt „getötet worden“ nahe, während die mögliche neutralere Bedeutung in einer Fußnote erhalten bleibt.
- source_word: αἰχμαλωτίκασι
  choice: haben … gefangen weggeführt
  rationale: Das Verb bezeichnet das Gefangennehmen beziehungsweise Verschleppen im Krieg; die deutsche Wendung ist natürlich und bewahrt beide Aspekte.
- source_word: τὴν ὑποσκευήν
  choice: ihre Habe
  rationale: ὑποσκευή kann Gepäck, Ausrüstung oder beweglichen Besitz bezeichnen. „Habe“ ist hier knapp und hinreichend weit.
- source_word: ἀπώλεσαν
  choice: haben … getötet
  rationale: Bei Männern als direktem Objekt ist „getötet“ im Deutschen natürlicher als „vernichtet“; die allgemeinere Grundbedeutung des griechischen Verbs wird in der Fußnote genannt.
- source_word: ὡς μίαν χιλιάδα ἀνδρῶν
  choice: etwa tausend Männer
  rationale: ὡς kennzeichnet bei einer Zahl eine ungefähre Angabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Mehrzahl „sie“ für die nicht ausdrücklich benannten Angreifer folgt dem griechischen Satzbau; „gefangen weggeführt“ macht den kriegerischen Zusammenhang verständlich. Die schwierige Ortsform und die Bedeutungsbreite zentraler Verben und Substantive werden nicht stillschweigend vereindeutigt, sondern in Fußnoten offengelegt.
