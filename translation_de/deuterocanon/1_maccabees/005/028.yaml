lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: wandten sich
  rationale: Das Verb bezeichnet hier eine Wendung beziehungsweise Richtungsänderung; die Wiedergabe vermeidet die unbelegte Vorstellung eines Rückzugs.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: sein Heer
  rationale: παρεμβολή kann das Lager oder die darin versammelte Streitmacht bezeichnen. Im Zusammenhang einer gemeinsamen militärischen Bewegung ist „Heer“ im Deutschen natürlich und präzise.
- source_word: ὁδὸν εἰς τὴν ἔρημον
  choice: auf dem Weg in die Wüste
  rationale: Die Wiedergabe erhält sowohl ὁδόν („Weg“) als auch die Richtungsangabe εἰς τὴν ἔρημον („in die Wüste“) und glättet die gedrängte griechische Formulierung nur behutsam.
- source_word: εἰς Βοσὸρ
  choice: nach Bosor
  rationale: Die Präposition bezeichnet die Bewegungsrichtung auf den Ort Bosor zu; der Ortsname wird transliteriert.
- source_word: ἄφνω
  choice: plötzlich
  rationale: Das Adverb hebt die unvermittelte, überraschende Richtungsänderung hervor.
- source_word: κατελάβετο
  choice: nahm ... ein
  rationale: Im militärischen Zusammenhang bezeichnet das Verb die Einnahme beziehungsweise Eroberung einer Stadt.
- source_word: πᾶν ἀρσενικόν
  choice: alles Männliche
  rationale: Die substantivierte sächliche Form bezeichnet umfassend alle männlichen Personen und wird nicht verengend mit „alle Männer“ wiedergegeben.
- source_word: ἐν στόματι ῥομφαίας
  choice: mit der Schärfe des Schwertes
  rationale: Dies ist eine verständliche deutsche Wiedergabe der festen biblischen Wendung; die wörtliche Bildform „im Mund des Schwertes“ wird in der Fußnote kenntlich gemacht.
- source_word: τὰ σκῦλα
  choice: Beute
  rationale: Der Ausdruck bezeichnet im Krieg erlangtes Raub- oder Beutegut; „Beute“ ist klar, würdig und im heutigen Deutsch geläufig.
- source_word: ἐνέπρησεν αὐτὴν πυρί
  choice: verbrannte die Stadt mit Feuer
  rationale: Die Formulierung bewahrt die ausdrückliche Nennung des Feuers und klärt zugleich den Bezug des weiblichen Pronomens auf die Stadt.
