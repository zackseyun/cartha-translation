  rationale: Die Revision klärt die im Griechischen gedrängte, aber zielgerichtete Routenangabe und modernisiert die deutsche Wiedergabe der Schwertformel. Der Bericht bleibt in Umfang, Härte und militärischem Register quellentreu; die Fußnote sichert die wörtliche Bildform.
