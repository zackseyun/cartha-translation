  text: And Judas and his camp turned suddenly by the road into the wilderness toward Bosor; and he captured the city and killed every male with the edge of the sword[a], and took all their spoils, and burned it with fire.
translation:
  language: de
  text: Judas und sein Heer schlugen plötzlich den Weg durch die Wüste nach Bosor ein. Er nahm die Stadt ein, tötete alle männlichen Bewohner mit dem Schwert[a], nahm ihre gesamte Beute an sich und verbrannte die Stadt mit Feuer.
