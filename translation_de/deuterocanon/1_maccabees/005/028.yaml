    issue: Unklare syntaktische Anbindung der Richtungsangabe
    rationale: „auf dem Weg in die Wüste nach Bosor“ kann bedeuten, dass Judas und sein Heer sich während einer Reise wandten. Das Griechische beschreibt dagegen die abrupt gewählte Route in Richtung Bosor.
  - severity: low
    issue: Unnatürliche Wiedergabe der Schwertformel
    rationale: „mit der Schärfe des Schwertes“ klingt im modernen Deutsch künstlich. Die Bedeutung des idiomatischen ἐν στόματι ῥομφαίας wird durch „mit dem Schwert“ sicher wiedergegeben und die wörtliche Metapher bleibt erläutert.
