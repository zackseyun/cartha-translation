  text: And they gave orders to those of the force with them[a], and they marched against Jamnia.
translation:
  language: de
  text: Und sie erteilten den Männern aus der Streitmacht, die bei ihnen war, Befehle und zogen gegen Jamnia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Jamnia«. Die griechische Wendung kann eine Bewegung auf einen Ort zu bezeichnen; im militärischen Zusammenhang ist wahrscheinlich ein feindlicher Vorstoß gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλαν
  choice: erteilten … Befehle
  rationale: Das Verb bezeichnet hier das Erteilen militärischer Anweisungen. Die deutsche Wendung ist natürlich und wahrt den militärischen Zusammenhang.
- source_word: τοῖς ἀπὸ τῆς δυνάμεως τῆς μετʼ αὐτῶν
  choice: den Männern aus der Streitmacht, die bei ihnen war
  rationale: δύναμις bezeichnet im Kontext eine militärische Streitmacht; ἀπό hat partitive Bedeutung und meint Männer, die dieser Streitmacht angehörten. Die Relativkonstruktion gibt τῆς μετʼ αὐτῶν eng wieder.
- source_word: ἐπορεύθησαν
  choice: zogen
  rationale: Im militärischen Erzählzusammenhang bezeichnet das Verb den geordneten Aufbruch beziehungsweise Vormarsch. „Zogen“ ist idiomatischer als das allgemeinere „gingen“.
- source_word: ἐπὶ Ἰαμνίαν
  choice: gegen Jamnia
  rationale: ἐπί mit Akkusativ kann eine Bewegung auf ein Ziel hin ausdrücken und legt im militärischen Kontext einen feindlichen Vorstoß nahe. Die mögliche neutralere Richtungsangabe bleibt in der Fußnote erhalten.
- source_word: Ἰαμνίαν
  choice: Jamnia
  rationale: „Jamnia“ ist die im Deutschen gebräuchliche Form des antiken Ortsnamens.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die etwas sperrige partitive Formulierung des Griechischen wird verständlich wiedergegeben, ohne die Männer mit der gesamten Streitmacht gleichzusetzen. Der Fußnotenmarker steht unmittelbar bei der von der Anmerkung betroffenen Ortsangabe.
