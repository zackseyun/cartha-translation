base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/033.yaml
  text: And he went out against them in three divisions from outside them[a]; and they sounded the trumpets and cried out in prayer.
translation:
  language: de
  text: Und er zog in drei Abteilungen von außen gegen sie aus. Und er blies die Trompeten[a], und sie schrien im Gebet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht hier der Singular: „er blies die Trompeten“; danach folgt der Plural: „und sie schrien im Gebet“.'
    reason: Der auffällige Wechsel vom Singular zum Plural im griechischen Text wird im Haupttext beibehalten und erläutert.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zog … gegen sie aus
  rationale: Das Verb bedeutet wörtlich „ging/zog hinaus“. Der militärische Zusammenhang erlaubt, die gegen den Feind gerichtete Bewegung mit „gegen sie“ kenntlich zu machen, ohne das Verb zu „griff an“ zu verstärken.
- source_word: ἐν τρισὶν ἀρχαῖς
  choice: in drei Abteilungen
  rationale: ἀρχή bezeichnet hier wahrscheinlich militärisch gegliederte Einheiten. „Abteilungen“ ist natürlich und legt sich nicht auf drei Befehlshaber fest.
- source_word: ἔξωθεν αὐτῶν
  choice: von außerhalb ihrer Stellung
  rationale: Das wörtliche „von außerhalb ihrer“ wäre im Deutschen unverständlich. „Ihrer Stellung“ macht den räumlichen Bezug idiomatisch kenntlich, bleibt aber wegen der nicht ausdrücklich genannten Bezugsgröße zurückhaltend.
- source_word: ἐσάλπισεν ταῖς σάλπιγξιν
  choice: er stieß in die Trompeten
  rationale: Der griechische Haupttext hat ein Verb im Singular. Die deutsche Fassung bewahrt diesen auffälligen Numeruswechsel zum folgenden Plural; die Mehrzahl „Trompeten“ entspricht dem griechischen Substantiv.
- source_word: ἐβόησαν
  choice: sie schrien … zu Gott
  rationale: Das Verb bezeichnet lautes Rufen oder Schreien. In Verbindung mit προσευχή ist „zu Gott schreien“ im Deutschen verständlicher als „im Gebet schreien“, wobei der Gebetscharakter ausdrücklich erhalten bleibt.
- source_word: ἐν προσευχῇ
  choice: im Gebet zu Gott
  rationale: Die Wendung bezeichnet Art oder Sphäre des Rufens. „Im Gebet zu Gott“ gibt den religiösen Charakter natürlich wieder; „zu Gott“ ist dabei eine im Begriff Gebet enthaltene Verdeutlichung.
theological_decisions:
- issue: Militärische Zielrichtung von ἐξῆλθεν
  choice: zog … gegen sie aus
  alternative: zog hinaus
  rationale: Der Kampfzusammenhang macht die feindgerichtete Bewegung deutlich. Die Ergänzung verhindert ein missverständliches bloßes Verlassen eines Ortes, ohne einen bereits vollzogenen Angriff zu behaupten.
- issue: Numeruswechsel zwischen ἐσάλπισεν und ἐβόησαν
  choice: Singular „er stieß“ und anschließend Plural „sie schrien“
  alternative: kollektiver Plural „sie stießen … und schrien“
  rationale: Da die maßgebliche griechische Quelle ausdrücklich vom Singular zum Plural wechselt, wird diese Spannung im Haupttext bewahrt statt aus stilistischen Gründen eingeebnet.
- issue: Adressat des Gebets
  choice: zu Gott
  alternative: nur „im Gebet“
  rationale: Gott wird im griechischen Satz nicht eigens genannt, ist aber als Adressat von προσευχή semantisch vorausgesetzt. Die Formulierung dient der natürlichen deutschen Syntax und führt keinen besonderen Lehrinhalt ein.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der Satz bleibt nahe an der griechischen Struktur, vermeidet aber das im Deutschen kaum verständliche „von außerhalb ihrer“. Der Numeruswechsel der Quelle wird nicht geglättet.
