  terminology: Die militärischen und narrativen Begriffe sind passend. „Schlugen ihr Lager auf“ ist eine natürliche und genaue Wiedergabe; „wurde ... in seine Hände gegeben“ bewahrt Passiv, Plural von χερσίν und den Singular des Possessivpronomens. Die Fußnote erläutert den Numeruswechsel sachlich, ohne einen nicht gesicherten Referenten festzulegen.
