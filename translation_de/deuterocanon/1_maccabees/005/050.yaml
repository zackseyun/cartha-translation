  source_fidelity: 'Der Text gibt die maßgeblichen Elemente des Griechischen zuverlässig wieder: οἱ ἄνδρες τῆς πόλεως als „die Männer der Stadt“, παρενέβαλον als militärisches Lageraufschlagen, ἐπολέμησαν τὴν πόλιν als Kampf gegen die Stadt, die bekräftigte Zeitdauer sowie das Passiv von παρεδόθη. Die auffällige Spannung zwischen den Männern „der Stadt“ und ihrem Kampf gegen „die Stadt“ wird zutreffend nicht harmonisiert. Der abschließende Singular αὐτοῦ bleibt in „seine Hände“ erhalten.'
