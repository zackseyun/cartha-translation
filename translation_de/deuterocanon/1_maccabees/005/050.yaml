base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/050.yaml
  text: And the men of the city encamped, and they fought against the city all that day and all that night, and the city was delivered into his hands.
translation:
  language: de
  text: Und die Männer der Stadt schlugen ihr Lager auf und kämpften jenen ganzen Tag und die ganze Nacht gegen die Stadt. Da wurde die Stadt in seine Hände gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in seine Hände“. Das griechische Possessivpronomen steht im Singular. Manche Übersetzungen gleichen es an die vorherigen Subjekte im Plural an und schreiben „in ihre Hände“.'
    reason: Der unerwartete Wechsel vom Plural zum Singular ist für das Verständnis bedeutsam und soll für Leserinnen und Leser sichtbar bleiben.
lexical_decisions:
- source_word: παρενέβαλον
  choice: schlugen ihr Lager auf
  rationale: Das Verb bezeichnet gewöhnlich das Aufschlagen eines Lagers beziehungsweise das Beziehen einer militärischen Stellung. Die Formulierung bewahrt den konkreten militärischen Sinn, ohne darüber hinaus eine bestimmte Angriffsbewegung einzutragen.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: die Männer der Stadt
  rationale: ἄνδρες bezeichnet ausdrücklich Männer. Die formnahe Wiedergabe erhält zugleich die auffällige Spannung dazu, dass sie anschließend gegen die Stadt kämpfen.
- source_word: ἐπολέμησαν τὴν πόλιν
  choice: kämpften … gegen die Stadt
  rationale: ἐπολέμησαν bezeichnet das Kämpfen oder Kriegführen; das Akkusativobjekt wird im Deutschen idiomatisch mit „gegen“ angeschlossen. Obwohl „die Männer der Stadt“ dadurch ungewöhnlich erscheint, wird die Aussage des griechischen Textes nicht geglättet.
- source_word: ὅλην τὴν ἡμέραν ἐκείνην καὶ ὅλην τὴν νύκτα
  choice: jenen ganzen Tag und die ganze Nacht
  rationale: Die Wiedergabe erhält die zweimalige Betonung der gesamten Dauer und die zeitliche Abfolge.
- source_word: παρεδόθη
  choice: wurde … gegeben
  rationale: Die passive Form bleibt erhalten und lässt wie das Griechische offen, wer die Stadt übergab beziehungsweise preisgab.
- source_word: ἐν χερσὶν αὐτοῦ
  choice: in seine Hände
  rationale: Das Possessivpronomen αὐτοῦ steht im Singular, während χερσίν formal Plural ist. „In seine Hände“ bildet beides transparent ab.
theological_decisions:
- issue: Numeruswechsel im Schlusssatz
  choice: Singular „seine Hände“ beibehalten
  alternative: „ihre Hände“ als Angleichung an die vorherigen Subjekte im Plural
  rationale: Der griechische Text wechselt nach den Verben im Plural ausdrücklich zum singularischen αὐτοῦ. Die Übersetzung bewahrt diesen interpretativ offenen Wechsel, statt ihn stillschweigend zu glätten.
- issue: Spannung zwischen „Männer der Stadt“ und dem Kampf gegen die Stadt
  choice: Beide Aussagen formnah beibehalten
  alternative: Das zweite „die Stadt“ auslassen oder „Männer der Stadt“ freier als eine andere Streitmacht deuten
  rationale: Der vorgelegte griechische Text enthält sowohl οἱ ἄνδρες τῆς πόλεως als auch τὴν πόλιν. Die auffällige Spannung ist textlich vorhanden und wird nicht durch eine unbelegte Harmonisierung beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit formnaher Satzführung. Die ungewöhnlichen Bezüge des griechischen Textes werden bewusst nicht geglättet; die Fußnote erläutert nur den Numeruswechsel, ohne dessen Bezugsperson festzulegen.
