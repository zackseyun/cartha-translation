translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung ist militärisch klar, bleibt aber auch für heutige Leser leicht verständlich. Die mögliche Bedeutung, dass jeder seine bisherige Stellung halten sollte, wird nicht in den Haupttext hineingezwungen, sondern in der Fußnote offengehalten.
