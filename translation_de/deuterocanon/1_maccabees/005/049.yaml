  text: And Judas gave orders to make proclamation in the camp that each should encamp in the place where he is.
translation:
  language: de
  text: 'Und Judas befahl, im Lager auszurufen: Jeder solle an dem Ort lagern, an dem er sich befindet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jeder solle dort lagern, wo er sich befindet.“ Die griechische Wendung kann als Anweisung verstanden werden, dass alle an ihrer jeweiligen Position bleiben sollten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: befahl
  rationale: Das Verb bezeichnet eine verbindliche Anordnung. „Befahl“ gibt seine autoritative Kraft knapp und natürlich wieder.
- source_word: κηρῦξαι
  choice: auszurufen
  rationale: Der Aoristinfinitiv bezeichnet den Inhalt des Befehls und meint eine öffentliche Bekanntmachung im Lager. „Ausrufen“ bewahrt diesen Heroldcharakter.
- source_word: παρεμβολῇ
  choice: Lager
  rationale: Im militärischen Zusammenhang bezeichnet παρεμβολή das Heerlager; „Lager“ ist die klare und idiomatische deutsche Entsprechung.
- source_word: παρεμβαλεῖν
  choice: lagern
  rationale: Der Infinitiv gibt den Inhalt des Ausrufs wieder. „Lagern“ wahrt den militärischen Bezug und die Wortverwandtschaft mit „Lager“, ohne zwingend einen Ortswechsel anzudeuten.
- source_word: ἕκαστον
  choice: jeder
  rationale: „Jeder“ erhält die distributive Singularform des Griechischen, ohne eine nicht ausdrücklich genannte männliche Bezeichnung hinzuzufügen.
- source_word: ἐν ᾧ ἐστιν τόπῳ
  choice: an dem Ort, an dem er sich gerade befinde
  rationale: Die vollständige Ortsangabe bleibt erhalten. Der Konjunktiv „befinde“ fügt sich natürlich in die indirekte Rede ein; „gerade“ verdeutlicht den Bezug auf die jeweilige gegenwärtige Position.
