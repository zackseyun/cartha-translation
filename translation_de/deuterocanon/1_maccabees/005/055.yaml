lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις αἷς
  choice: zu der Zeit, als
  rationale: Gibt die temporale Wendung natürlich und gegenwartssprachlich wieder, ohne ihren zeitlichen Bezug abzuschwächen.
- source_word: ἦν
  choice: waren
  rationale: Das griechische Verb steht im Singular, bezieht sich aber auf das zusammengesetzte Subjekt Judas und Jonatan; im Deutschen ist der Plural erforderlich.
- source_word: Γαλαάδ
  choice: Gilead
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: Γαλιλαίᾳ
  choice: Galiläa
  rationale: Eingebürgerte deutsche Form des Regionsnamens.
- source_word: κατὰ πρόσωπον Πτολεμαΐδος
  choice: gegenüber von Ptolemaïs
  rationale: Bewahrt den räumlichen Sinn der griechischen Wendung, ohne die genaue Lage oder militärische Ausrichtung stärker festzulegen, als es der Ausgangstext tut.
- source_word: Πτολεμαΐδος
  choice: Ptolemaïs
  rationale: Übliche deutsche Wiedergabe des antiken Städtenamens.
