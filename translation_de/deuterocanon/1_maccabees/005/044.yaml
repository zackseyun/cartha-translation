  yaml_path: translation/deuterocanon/1_maccabees/005/044.yaml
  text: And they seized the city[a], and they burned the temple precinct with fire, together with all who were in it; and Karnain was routed, and it could no longer stand before Judas.
translation:
  language: de
  text: Und sie nahmen die Stadt ein und steckten den heiligen Bezirk in Brand, samt allen, die sich darin befanden.[a] So wurde Karnain in die Flucht geschlagen und konnte Judas nicht länger standhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „samt allem, was sich darin befand“. Die griechische Form kann sowohl Personen als auch den gesamten Inhalt des heiligen Bezirks bezeichnen; im Zusammenhang sind wahrscheinlich die Menschen darin gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκατελάβοντο
  choice: nahmen … ein
  rationale: Das Verb bezeichnet hier die erfolgreiche Inbesitznahme der Stadt. Die Vorsilbe προ- kann ein Zuvorkommen ausdrücken, doch wäre „im Voraus“ im Deutschen ohne einen ausdrücklich genannten Gegner unnatürlich und möglicherweise überdeutlich.
- source_word: τὸ τέμενος
  choice: den heiligen Bezirk
  rationale: τέμενος bezeichnet einen abgegrenzten, geweihten Bereich und nicht zwingend nur ein Tempelgebäude. „Heiliger Bezirk“ bewahrt diesen räumlich weiteren Sinn.
- source_word: ἐνεπύρισαν ἐν πυρί
  choice: steckten … in Brand
  rationale: Die idiomatische deutsche Wendung gibt das Verb und die ausdrückliche Feuereinwirkung natürlich wieder, ohne die griechische Verstärkung hölzern zu verdoppeln.
- source_word: σὺν πᾶσιν τοῖς οὖσιν ἐν αὐτῷ
  choice: samt allen, die sich darin befanden
  rationale: Im militärischen Zusammenhang liegt der Bezug auf die Menschen im heiligen Bezirk nahe. Da die griechische Form auch umfassender verstanden werden kann, bleibt die sachliche Alternative in einer Fußnote erhalten.
- source_word: ἐτροπώθη
  choice: wurde … in die Flucht geschlagen
  rationale: Der Passiv stammt von τρέπω und hat hier den militärischen Sinn einer Niederlage beziehungsweise Flucht.
- source_word: ἡ Καρναῒν
  choice: Karnain
  rationale: Der Ortsname wird eng nach der griechischen Form transliteriert. Das feminine Prädikat bezieht sich personifizierend auf die Stadt.
- source_word: οὐκ ἐδύνατο ἔτι ὑποστῆναι κατὰ πρόσωπον Ἰούδα
  choice: konnte Judas nicht länger standhalten
  rationale: ὑφίστημι mit κατὰ πρόσωπον bezeichnet hier das Standhalten in unmittelbarer Konfrontation. Die deutsche Formulierung gibt den Sinn knapp und natürlich wieder.
