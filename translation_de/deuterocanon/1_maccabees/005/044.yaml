  source_fidelity: 'Die Übersetzung gibt den griechischen Erzählverlauf zuverlässig wieder: Einnahme der Stadt, Brand des τέμενος mitsamt den darin Befindlichen, militärische Niederlage Karnains und dessen fehlende Fähigkeit, Judas weiter standzuhalten. „nahmen die Stadt ein“ ist für προκατελάβοντο im Kontext idiomatisch und vermeidet eine im Deutschen unmotiviert wirkende Wiedergabe von προ- mit „im Voraus“.'
