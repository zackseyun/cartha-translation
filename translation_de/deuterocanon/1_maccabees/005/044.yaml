  terminology: „Heiliger Bezirk“ bewahrt gegenüber „Tempel“ oder „Heiligtum“ die räumliche Weite von τέμενος. „Karnain“ folgt konsistent der griechischen Namensform. Die Fußnote sichert die grammatisch mögliche weitere Bedeutung von πάντων τῶν ὄντων, ohne den im Kontext naheliegenden Personenbezug zu verschleiern.
