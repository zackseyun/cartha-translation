base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/065.yaml
  text: And Judas and his brothers went out[a], and they fought the sons of Esau in the land to the south, and he struck Hebron and its daughter towns; he tore down its fortress[b], and he burned its towers all around.
translation:
  language: de
  text: Und Judas und seine Brüder zogen aus und kämpften gegen die Söhne Esaus[a] im südlich gelegenen Land. Er schlug Hebron und seine Tochterstädte[b], riss dessen Festung nieder und verbrannte seine Türme ringsum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint sind wohl die Edomiter; wörtlich: „die Söhne Esaus“.'
    reason: alternative_reading
  - marker: b
    text: „Tochterstädte“ sind kleinere Siedlungen, die einer größeren Stadt zugeordnet oder von ihr abhängig waren.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zogen aus
  rationale: Die geläufige deutsche Erzählform gibt das Aoristverb sachlich wieder, ohne die im Kontext mögliche militärische Nuance durch „marschierten“ ausdrücklich hinzuzufügen.
- source_word: ἐπολέμουν
  choice: kämpften gegen
  rationale: Das Imperfekt bezeichnet den Kampf als fortlaufendes Geschehen; „kämpften gegen“ klingt im Deutschen natürlich und bewahrt diese Bedeutung hinreichend.
- source_word: τοὺς υἱοὺς Ἠσαῦ
  choice: die Söhne Esaus
  rationale: Die wörtliche Verwandtschaftsbezeichnung bewahrt die biblische Ausdrucksweise und ihre Bezüge zur Geschichte Esaus; die ethnische Deutung als Edomiter wird in der Fußnote genannt.
- source_word: ἐν τῇ γῇ τῇ πρὸς νότον
  choice: im Land im Süden
  rationale: Die Wiedergabe bleibt nahe bei „in dem nach Süden gelegenen Land“ und macht daraus nicht ohne ausdrückliche Grundlage im Griechischen den Eigennamen Negev.
- source_word: ἐπάταξεν
  choice: Er schlug
  rationale: Der Wechsel zum Singular wird bewahrt und hebt Judas als handelnden Anführer hervor. „Schlug“ erhält die breite militärische Bedeutung, ohne ausdrücklich Eroberung oder Vernichtung zu behaupten.
- source_word: τὰς θυγατέρας αὐτῆς
  choice: seine Tochterstädte
  rationale: Der semitisch geprägte geografische Ausdruck für kleinere, von einer Hauptstadt abhängige Orte wird erhalten und durch eine Fußnote erläutert.
- source_word: καθεῖλεν
  choice: riss ... nieder
  rationale: Die Wendung ist anschaulich, natürlich und entspricht dem gewaltsamen Niederlegen einer Befestigung.
- source_word: τὸ ὀχύρωμα αὐτῆς
  choice: seine Festung
  rationale: „Festung“ bezeichnet knapp und verständlich eine befestigte Verteidigungsanlage.
- source_word: ἐνεπύρισεν κυκλόθεν
  choice: verbrannte ... ringsum
  rationale: Die Formulierung gibt sowohl das Inbrandsetzen beziehungsweise Verbrennen als auch die räumliche Angabe „ringsum“ wieder.
theological_decisions:
- issue: Volksbezeichnung oder wörtliche Abstammungsbezeichnung in τοὺς υἱοὺς Ἠσαῦ
  choice: die Söhne Esaus
  alternative: die Edomiter; die Nachkommen Esaus
  rationale: Die wörtliche Form bewahrt die vom griechischen Text hergestellte Verbindung zu Esau und löst sie nicht stillschweigend in eine ethnische Bezeichnung auf. Die wahrscheinlich gemeinten Edomiter werden als Deutungsmöglichkeit in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. Der Wechsel vom pluralischen Handeln der Brüder zum singularischen Handeln des Judas bleibt erhalten. Ungebräuchliche, aber quellnahe Ausdrücke werden knapp in Fußnoten erklärt.
