revisions:
- from: Und Judas und seine Brüder zogen aus und kämpften gegen die Söhne Esaus[a] im Land im Süden. Er schlug Hebron und seine Tochterstädte[b], riss seine Festung nieder und verbrannte seine Türme ringsum.
  to: Und Judas und seine Brüder zogen aus und kämpften gegen die Söhne Esaus[a] im südlich gelegenen Land. Er schlug Hebron und seine Tochterstädte[b], riss dessen Festung nieder und verbrannte seine Türme ringsum.
  rationale: Die Übersetzung wird sprachlich geglättet und der Bezug der Festung eindeutig auf Hebron bezogen. Die Erläuterung zu „Tochterstädte“ wird sachgerecht gefasst, ohne eine im Ausgangstext nicht gegebene Hauptstadt vorauszusetzen. Bedeutung und erzählerischer Singularwechsel bleiben unverändert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:03:03Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzfolge, den Singularwechsel bei ἐπάταξεν/καθεῖλεν/ἐνεπύρισεν und die militärischen Handlungen des griechischen Textes grundsätzlich zuverlässig wieder. „Söhne Esaus“ bewahrt die quellennahe Bezeichnung angemessen. Die Bezüge der Possessivpronomen auf Hebron sollten im Deutschen jedoch eindeutiger markiert werden.
  naturalness: „Im Land im Süden“ ist verständlich, aber stilistisch holprig; „im südlich gelegenen Land“ ist modernes Standarddeutsch und ebenso quellennah. Die wiederholten Possessivformen „seine“ können sich nach „Er“ irreführend auf Judas statt auf Hebron beziehen.
  terminology: '„Tochterstädte“ ist als bewusste, erklärte Wiedergabe des geographischen Idioms vertretbar. Die Fußnote darf diese jedoch nicht als von einer „Hauptstadt“ abhängig definieren: Der Ausdruck bezeichnet Nebensiedlungen bzw. abhängige Orte einer größeren bzw. Hauptsiedlung, nicht zwingend einer Hauptstadt.'
