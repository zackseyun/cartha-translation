lexical_decisions:
- source_word: συνῆψεν πρὸς αὐτοὺς πολέμους πολλούς
  choice: er führte viele Kriege gegen sie
  rationale: Die Wendung bezeichnet das Aufnehmen beziehungsweise Führen wiederholter kriegerischer Auseinandersetzungen. Natürliches Deutsch verlangt hier nicht die wörtliche Verbindung „Kriege verknüpfen“.
- source_word: συνετρίβησαν πρὸ προσώπου αὐτοῦ
  choice: sie wurden vor ihm zerschmettert
  rationale: Bewahrt das starke Bild von συντρίβω und gibt πρὸ προσώπου αὐτοῦ knapp und quellennah mit „vor ihm“ wieder.
- source_word: ἐπάταξεν αὐτούς
  choice: er schlug sie nieder
  rationale: Gibt das gewaltsame Schlagen beziehungsweise Besiegen wieder, ohne ausdrücklich „töten“ zu setzen, was der griechische Wortlaut hier nicht zwingend festlegt.
