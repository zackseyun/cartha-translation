  text: 'While the letters were still being read[a], behold, other messengers arrived from Galilee with their garments torn, reporting these words:'
translation:
  language: de
  text: 'Während die Briefe noch vorgelesen wurden, da kamen weitere Boten aus Galiläa an. Sie hatten ihre Gewänder zerrissen und berichteten Folgendes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι … ἀνεγινώσκοντο
  choice: Während … noch vorgelesen wurden
  rationale: Ἔτι zusammen mit dem Imperfekt bezeichnet einen noch andauernden Vorgang; „vorgelesen“ passt zu Briefen, die vor einer versammelten Gruppe hörbar gelesen werden.
- source_word: αἱ ἐπιστολαί
  choice: die Briefe
  rationale: Die direkte und im erzählerischen Zusammenhang natürliche Wiedergabe des Plurals.
- source_word: ἰδού
  choice: da
  rationale: Das präsentative „da“ markiert im modernen Deutschen das plötzliche Eintreffen, ohne das heute feierlich oder altertümlich wirkende „siehe“ zu erzwingen.
- source_word: ἄγγελοι ἕτεροι
  choice: weitere Boten
  rationale: ἄγγελοι bezeichnet hier menschliche Nachrichtenüberbringer; ἕτεροι setzt sie von bereits erwähnten Boten ab.
- source_word: παρεγένοντο ἐκ τῆς Γαλιλαίας
  choice: kamen … aus Galiläa an
  rationale: Gibt das Eintreffen am Schauplatz und die Herkunft idiomatisch wieder.
- source_word: διερρηχότες τὰ ἱμάτια
  choice: Sie hatten ihre Gewänder zerrissen
  rationale: Das Perfektpartizip bezeichnet eine vorausgehende Handlung mit sichtbarem Ergebnis; die aktive Form bewahrt zudem, dass die Boten ihre Gewänder selbst zerrissen hatten.
- source_word: ἀπαγγέλλοντες κατὰ τὰ ῥήματα ταῦτα
  choice: und berichteten Folgendes
  rationale: Die Wendung leitet den Inhalt der unmittelbar folgenden Meldung ein; „Folgendes“ ist natürliches modernes Deutsch und wahrt diese vorausweisende Funktion.
theological_decisions:
- issue: Bedeutung von ἄγγελοι
  choice: menschliche „Boten“
  alternative: „Engel“
  rationale: Herkunftsangabe, zerrissene Gewänder und das Überbringen einer Nachricht kennzeichnen im historischen Erzählzusammenhang menschliche Boten, nicht himmlische Wesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzfluss wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. „Da“ erhält die überraschende narrative Wendung von ἰδού, während „Gewänder“ den kulturell geprägten Ausdruck von Trauer oder Bestürzung angemessen wiedergibt.
