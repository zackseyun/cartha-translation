  register: Modernes, allgemein verständliches Standarddeutsch in würdigem historischem Erzählton. Die direkte Rede bleibt knapp und militärisch. „Heerlager“ und „Wasserlauf“ vermeiden unnötige Fachsprache; die Fußnoten bewahren landschaftlichen Hintergrund und die gedrängte Formulierung des griechischen Schlusssatzes.
