base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/040.yaml
  text: And Timotheus said to the commanders of his forces[a], when Judas and his camp were drawing near to the wadi, “If he crosses over to us first, we will not be able to withstand him[b], because he will surely prevail against us.”
translation:
  language: de
  text: 'Und Timotheus sagte zu den Befehlshabern seiner Streitmacht, als Judas und sein Heerlager sich dem Wasserlauf[a] näherten: »Wenn er als Erster zu uns hinübergeht, werden wir ihm nicht standhalten können; denn er wird uns überlegen sein.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet einen Sturzbach oder einen meist nur zeitweise Wasser führenden Wasserlauf samt seinem Bett.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »Denn er wird gegen uns imstande sein.« Gemeint ist, dass Judas ihnen im Kampf überlegen sein wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρχουσιν τῆς δυνάμεως αὐτοῦ
  choice: den Befehlshabern seiner Streitmacht
  rationale: Im militärischen Zusammenhang bezeichnet ἄρχοντες die Führungspersonen der bewaffneten Macht; „Befehlshaber“ und „Streitmacht“ geben Funktion und Kollektiv natürlich wieder.
- source_word: ἐν τῷ ἐγγίζειν
  choice: als … sich … näherten
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv bezeichnet einen gleichzeitig stattfindenden Vorgang.
- source_word: Ἰούδαν καὶ τὴν παρεμβολὴν αὐτοῦ
  choice: Judas und sein Heerlager
  rationale: παρεμβολή kann das Lager oder die gelagerte Truppe bezeichnen. „Heerlager“ bewahrt den militärischen und räumlichen Sinn, ohne eindeutig nur das Heer oder nur die Zelte zu meinen.
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: Wasserlauf
  rationale: χειμάρρους bezeichnet einen Sturzbach beziehungsweise einen oft saisonalen Wasserlauf oder dessen Rinne. „Wasserlauf“ ist im Deutschen verständlich und vermeidet die unnötig fremdsprachige Bezeichnung „Wadi“.
- source_word: διαβῇ πρὸς ἡμᾶς πρότερος
  choice: vor uns hinübergeht
  rationale: 'πρότερος lässt sich hier vergleichend verstehen: Judas gelangt zuerst beziehungsweise vor den Gegnern über den Wasserlauf. „vor uns“ erhält diese relative zeitliche Aussage.'
- source_word: ὑποστῆναι αὐτόν
  choice: ihm … standhalten
  rationale: Das Verb bezeichnet hier das Bestehen oder Standhalten gegenüber einem Gegner im Kampf.
- source_word: δυνήσεται πρὸς ἡμᾶς
  choice: er wird uns überlegen sein
  rationale: Die knappe griechische Wendung lautet wörtlich etwa „er wird gegen uns imstande sein“. Im militärischen Zusammenhang besagt sie, dass Judas ihnen gewachsen beziehungsweise überlegen sein wird, ohne die ungewöhnliche Ausgangsform stillschweigend ganz zu verdecken.
