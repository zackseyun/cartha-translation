  yaml_path: translation/deuterocanon/1_maccabees/005/037.yaml
  text: After these words[a], Timotheus gathered another camp and encamped opposite Raphon, beyond the stream.
translation:
  language: de
  text: Nach diesen Worten sammelte Timotheus ein weiteres Heer und schlug sein Lager gegenüber von Raphon auf, jenseits des Baches.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jenseits des Wildbachs“ oder „auf der anderen Seite des Wadis“. Das griechische Wort kann einen saisonal wasserführenden Bach oder dessen trockenes Bachbett bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰ ῥήματα ταῦτα
  choice: Nach diesen Worten
  rationale: Die Wendung verweist am ehesten auf das unmittelbar zuvor Gesagte. „Worte“ bewahrt den griechischen Ausdruck und bildet einen natürlichen zeitlichen Übergang.
- source_word: συνήγαγεν
  choice: sammelte
  rationale: Das Verb bezeichnet das Zusammenbringen oder Versammeln; im militärischen Zusammenhang ist „sammelte“ natürlich und hinreichend offen.
- source_word: παρεμβολὴν ἄλλην
  choice: ein weiteres Heer
  rationale: παρεμβολή kann sowohl das Lager als auch die darin versammelte Streitmacht bezeichnen. Da unmittelbar danach vom Aufschlagen des Lagers die Rede ist, vermeidet „Heer“ im Deutschen die schwerfällige Wiederholung „ein Lager sammeln und lagern“.
- source_word: παρενέβαλεν
  choice: schlug sein Lager ... auf
  rationale: Dies gibt den üblichen militärischen Sinn idiomatisch und würdevoll wieder.
- source_word: κατὰ πρόσωπον
  choice: gegenüber von
  rationale: Die Präpositionalwendung bezeichnet hier die Lage einer Streitmacht einer Ortschaft gegenüber.
- source_word: Ῥαφὼν
  choice: Raphon
  rationale: Der Ortsname wird der griechischen Form entsprechend ins Deutsche transliteriert.
- source_word: ἐκ πέραν τοῦ χειμάρρου
  choice: jenseits des Bachtals
  rationale: χειμάρρους bezeichnet einen winterzeitlich oder saisonal wasserführenden Bach beziehungsweise dessen Tal. „Bachtal“ ist im Deutschen verständlich und bewahrt den landschaftlichen Charakter, ohne ständig fließendes Wasser vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Erzählprosa. Die militärische Bedeutung von παρεμβολή wird kontextgerecht als „Heer“ wiedergegeben; die geografische Mehrdeutigkeit von χειμάρρους bleibt durch eine Fußnote sichtbar.
