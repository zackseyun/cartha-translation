  yaml_path: translation/deuterocanon/1_maccabees/005/031.yaml
  text: And Judas saw that the battle had begun[a], and the outcry of the city went up to heaven with trumpet blasts and a great cry.
translation:
  language: de
  text: Und Judas sah, dass der Kampf begonnen hatte, und das Geschrei aus der Stadt stieg mit Trompetenstößen und lautem Rufen[a] bis zum Himmel auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter Trompetenstößen und lautem Rufen“. Die griechischen Dative können stärker als Mittel oder allgemeiner als begleitende Geräusche verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρκται
  choice: begonnen hatte
  rationale: Das griechische Perfekt bezeichnet einen bereits eingetretenen und nun bestehenden Zustand; im deutschen Erzählzusammenhang gibt das Plusquamperfekt die zeitliche Abfolge natürlich wieder.
- source_word: ὁ πόλεμος
  choice: der Kampf
  rationale: πόλεμος kann „Krieg“ oder „Kampf“ bedeuten; hier ist die konkrete, bereits begonnene Auseinandersetzung gemeint.
- source_word: ἡ κραυγὴ τῆς πόλεως
  choice: das Geschrei aus der Stadt
  rationale: κραυγή bezeichnet lautes Rufen oder Geschrei; der Genitiv benennt hier am natürlichsten den Ort beziehungsweise die Gemeinschaft, aus der es aufsteigt.
- source_word: ἀνέβη ἕως οὐρανοῦ
  choice: bis zum Himmel aufstieg
  rationale: Die Wendung bewahrt sowohl die vertikale Bildsprache als auch die ausdrückliche Reichweite von ἕως.
- source_word: σάλπιγξιν
  choice: mit Trompetenstößen
  rationale: Der Dativ kann Begleitung oder Mittel ausdrücken; „Trompetenstöße“ bezeichnet im militärischen Zusammenhang idiomatisch den Klang der Instrumente.
- source_word: κραυγῇ μεγάλῃ
  choice: und lautem Rufen
  rationale: „Lautes Rufen“ gibt die Stärke von μεγάλη in natürlichem Deutsch wieder und vermeidet die schwerfällige Wiederholung von „Geschrei“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau des griechischen Satzes bleibt erhalten; „aus der Stadt“ macht die im Genitiv liegende Herkunftsbeziehung natürlich verständlich. Das Fußnotenzeichen steht am Ende der gesamten Aussage, auf die sich die Alternative bezieht.
