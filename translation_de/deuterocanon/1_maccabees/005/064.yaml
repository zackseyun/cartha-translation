lexical_decisions:
- source_word: ἐπισυνήγοντο
  choice: versammelten sich
  rationale: Das Imperfekt von ἐπισυνάγω beschreibt hier ein sich vollziehendes oder wiederholtes Zusammenkommen; „versammelten sich“ gibt dies natürlich wieder.
- source_word: πρὸς αὐτούς
  choice: bei ihnen
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf Personen zu. In Verbindung mit „sich versammeln“ drückt „bei ihnen“ im Deutschen Ziel und anschließende Nähe idiomatisch aus.
- source_word: εὐφημοῦντες
  choice: priesen sie
  rationale: Das Partizip bezeichnet hier anerkennendes, rühmendes oder Beifall ausdrückendes Reden. „priesen sie“ ist knapp und würdevoll; die Fußnote bewahrt die weniger spezifische Möglichkeit „sprachen anerkennend über sie“.
