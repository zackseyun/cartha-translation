  text: And he crossed over to them first[a], and all his people were before him; and all the nations were crushed before him[b], and they threw down all their weapons and fled into the sanctuary at Carnain.
translation:
  language: de
  text: Und er setzte als Erster zu ihnen hinüber[a], und sein ganzes Volk zog vor ihm her. Und alle Völker wurden vor ihm zerschmettert; sie warfen all ihre Waffen weg und flohen in das Heiligtum[b] in Karnain.
  philosophy: optimal-equivalence
  footnotes:
