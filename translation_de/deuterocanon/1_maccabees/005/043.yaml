    text: 'Oder: „gegen sie“; das griechische πρὸς αὐτούς kann sowohl die Richtung („zu ihnen hin“) als auch im Zusammenhang eine feindliche Bewegung („gegen sie“) bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „heiliger Bezirk“ oder „Kultstätte“; das griechische τέμενος bezeichnet einen abgegrenzten, geweihten Bereich beziehungsweise ein Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπέρασεν
  choice: setzte … hinüber
  rationale: Das Verb bezeichnet das Hinübergelangen von einer Seite auf die andere. „Hinübersetzen“ bewahrt diese räumliche Bewegung, ohne das Gelände näher festzulegen.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: πρός mit Akkusativ kann eine Bewegung auf Personen zu ausdrücken und im militärischen Zusammenhang auch feindlichen Sinn annehmen. „Zu ihnen“ bewahrt zunächst die Richtungsangabe; die feindliche Lage ergibt sich aus dem Kontext.
- source_word: πρότερον
  choice: als Erster
  rationale: Das Adverb kennzeichnet ihn hier am natürlichsten als denjenigen, der zuerst hinübersetzte. Die Formulierung ist im Deutschen klarer als ein bloßes „zuerst“.
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: sein ganzes Volk
  rationale: λαός bedeutet wörtlich „Volk“ und bezeichnet hier seine Streitmacht. Die Wiedergabe bleibt bewusst beim weiteren Ausdruck des Griechischen.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: vor ihm her
  rationale: Die Wendung ist räumlich zu verstehen. „Zog vor ihm her“ klingt im erzählenden Zusammenhang natürlich und bewahrt die Angabe, dass sich das Volk vor ihm befand.
- source_word: συνετρίβησαν
  choice: wurden … zerschmettert
  rationale: Das Passiv beschreibt eine vernichtende Niederlage und erhält mit „zerschmettert“ das starke Bild des griechischen Verbs.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: ἔθνη kann die nichtjüdischen Völker bezeichnen. „Völker“ ist hier breit genug und vermeidet eine unnötige konfessionell oder theologisch verengte Festlegung.
- source_word: ἔρριψαν
  choice: warfen … weg
  rationale: Das Verb bezeichnet das entschlossene Wegwerfen oder Fallenlassen. „Wegwerfen“ passt idiomatisch zur Aufgabe der Waffen auf der Flucht.
- source_word: πάντα τὰ ὅπλα αὐτῶν
  choice: all ihre Waffen
  rationale: ὅπλα bezeichnet in diesem Kampfzusammenhang die Waffen beziehungsweise die Bewaffnung. „Waffen“ ist die klare, heutige Entsprechung.
- source_word: τέμενος
  choice: Heiligtum
  rationale: τέμενος bezeichnet einen geheiligten Bezirk oder eine Kultstätte. „Heiligtum“ gibt den sakralen Charakter wieder, ohne die Anlage genauer zu bestimmen, als es der Ausgangstext tut.
- source_word: ἐν Καρναΐν
  choice: von Karnain
  rationale: Der griechische Ortsname wird als „Karnain“ transliteriert. In Verbindung mit „Heiligtum“ bezeichnet „von Karnain“ dessen örtliche Zuordnung natürlich.
theological_decisions:
- issue: Spannung zwischen πρότερον und ἔμπροσθεν αὐτοῦ
  choice: Sowohl „als Erster“ als auch „sein ganzes Volk zog vor ihm her“ werden beibehalten.
  alternative: Die Aussagen harmonisieren, indem Judas eindeutig an die Spitze des Heeres gestellt oder πρότερον nur zeitlich auf einen früheren Übergang bezogen wird.
  rationale: 'Der griechische Wortlaut enthält eine echte erzählerische Spannung: Er setzt als Erster hinüber, zugleich befindet sich sein Volk vor ihm. Die Übersetzung löst diese Spannung nicht stillschweigend auf.'
translation_notes:
  register: Moderne, würdige Erzählsprache mit klaren militärischen Verben. Die Satzfolge bleibt eng am griechischen Text; das Semikolon gliedert Niederlage, Waffenaufgabe und Flucht, ohne zusätzliche Kausalität einzutragen. Der Fußnotenmarker zum τέμενος steht unmittelbar bei „Heiligtum“.
