  yaml_path: translation/deuterocanon/1_maccabees/005/060.yaml
  text: And Joseph and Azariah were routed and were pursued as far as the borders of Judea[a]; and on that day about two thousand men of the people of Israel fell.
translation:
  language: de
  text: Josef und Asarja wurden in die Flucht geschlagen und bis an die Grenzen Judäas verfolgt. An jenem Tag fielen aus dem Volk Israel etwa zweitausend Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis zu zweitausend Mann“; die griechische Wendung kann eine ungefähre Gesamtzahl bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτροπώθη
  choice: wurden in die Flucht geschlagen
  rationale: Die Passivform bezeichnet im militärischen Zusammenhang eine Niederlage, die zur Flucht führt; die deutsche Wendung gibt diesen Sinn klar und idiomatisch wieder.
- source_word: ἐδιώχθησαν
  choice: wurden verfolgt
  rationale: Das Passiv von διώκω bezeichnet hier die feindliche Verfolgung nach der Flucht.
- source_word: ἕως τῶν ὁρίων τῆς Ἰουδαίας
  choice: bis an die Grenzen Judäas
  rationale: ἕως markiert den erreichten Endpunkt, während der Plural ὅρια die Grenzen beziehungsweise Grenzgebiete bezeichnet.
- source_word: ἔπεσον
  choice: fielen
  rationale: Die im Kampfbericht übliche Wendung bewahrt das griechische Bild und lässt den Zusammenhang erkennen, dass die Männer im Kampf umkamen.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: An jenem Tag
  rationale: Natürliche und würdevolle Wiedergabe der griechischen Zeitangabe.
- source_word: ἐκ τοῦ λαοῦ Ἰσραήλ
  choice: aus dem Volk Israel
  rationale: ἐκ bezeichnet die Gefallenen als Angehörige des Volkes Israel; die deutsche Formulierung bewahrt diese Beziehung.
- source_word: εἰς δισχιλίους ἄνδρας
  choice: etwa zweitausend Mann
  rationale: εἰς bei einer Zahl kann einen ungefähren Gesamtwert angeben; „etwa“ wahrt diese mögliche Nuance.
