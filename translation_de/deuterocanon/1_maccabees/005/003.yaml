  text: καὶ ἐπολέμει Ἰούδας πρὸς τοὺς υἱοὺς Ἠσαῦ ἐν τῇ Ἰουδαίᾳ τὴν Ἀκραβαττήνην, ὅτι περικάθηντο τὸν Ἰσραήλ. καὶ ἐπάταξεν αὐτοῖς πληγὴν μεγάλην, καὶ συνέστειλεν αὐτούς, καὶ ἔλαβεν τὰ σκῦλα αὐτῶν.
