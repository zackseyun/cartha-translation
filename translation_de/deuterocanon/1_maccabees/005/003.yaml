base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/003.yaml
  text: And Judas fought against the sons of Esau in Judea[a], in the Akrabattene region, because they were hemming in Israel. And he struck them with a great blow, and humbled them[b], and took their spoils.
translation:
  language: de
  text: Und Judas führte Krieg gegen die Söhne Esaus[a] in Judäa, im Gebiet Akrabattene[b], weil sie Israel ringsum bedrängten. Er versetzte ihnen einen schweren Schlag, zwang sie nieder und nahm ihre Beute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Nachkommen Esaus“; wahrscheinlich sind die Edomiter gemeint. Im Griechischen steht wörtlich „die Söhne Esaus“.'
    reason: lexical_alternative
  - marker: b
    text: Akrabattene ist der Name eines Gebiets in Judäa. Die knappe griechische Satzfügung kann auch mit „in Judäa, bei Akrabattene“ verstanden werden.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπολέμει
  choice: führte Krieg gegen
  rationale: Der Imperfekt bezeichnet eine fortdauernde militärische Auseinandersetzung; die Formulierung gibt zudem die feindliche Ausrichtung von πρὸς klar wieder.
- source_word: υἱοὺς Ἠσαῦ
  choice: die Söhne Esaus
  rationale: Die genealogische Bezeichnung des griechischen Textes bleibt erhalten, statt sie stillschweigend mit den historisch wahrscheinlich gemeinten Edomitern gleichzusetzen.
- source_word: ἐν τῇ Ἰουδαίᾳ τὴν Ἀκραβαττήνην
  choice: in Judäa, im Gebiet Akrabattene
  rationale: Die knappe, ungewöhnliche Ortsangabe wird verständlich wiedergegeben, ohne die syntaktische Beziehung zwischen Judäa und Akrabattene endgültig festzulegen.
- source_word: περικάθηντο
  choice: ringsum bedrängten
  rationale: Die Wendung vermittelt sowohl das Umringen als auch den anhaltenden feindlichen Druck, ohne zwingend eine förmliche Städtebelagerung anzunehmen.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Der kollektive Singular und die biblisch-nationale Bezeichnung des Ausgangstextes werden bewahrt.
- source_word: ἐπάταξεν αὐτοῖς πληγὴν μεγάλην
  choice: versetzte ihnen einen schweren Schlag
  rationale: Die militärische Redewendung wird nah am Griechischen und zugleich idiomatisch auf Deutsch wiedergegeben.
- source_word: συνέστειλεν αὐτούς
  choice: zwang sie nieder
  rationale: Das Verb bezeichnet hier wahrscheinlich ein Zurückdrängen, Niederhalten oder Unterwerfen. Die Übersetzung drückt militärische Bezwingung aus, ohne vollständige Vernichtung zu behaupten.
- source_word: τὰ σκῦλα αὐτῶν
  choice: ihre Beute
  rationale: Gemeint ist die nach dem Sieg an sich genommene Kriegsbeute; „Beute“ ist im heutigen Deutsch knapp und natürlich.
