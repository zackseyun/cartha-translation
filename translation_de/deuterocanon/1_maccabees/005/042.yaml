base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/042.yaml
  text: And when Judas came near to the wadi[a], he stationed the scribes of the people at the wadi and commanded them, saying, “Do not let anyone camp[b], but let them all come into the battle.”
translation:
  language: de
  text: 'Als Judas sich dem Wadi[a] näherte, stellte er die Schreiber des Volkes am Wadi auf und befahl ihnen: »Lasst niemanden ein Lager aufschlagen, sondern alle sollen in den Kampf ziehen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Sturzbach«, »Bach« oder »Bachbett«. Das griechische Wort bezeichnet einen jahreszeitlich wasserführenden Lauf beziehungsweise dessen Talbett.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: sich näherte
  rationale: Gibt das schlichte Herannahen im erzählenden Kontext natürlich und präzise wieder.
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: Wadi
  rationale: χειμάρρους bezeichnet hier einen jahreszeitlich wasserführenden Bachlauf beziehungsweise ein entsprechendes Talbett. »Wadi« bewahrt den Geländebezug; das semantisch redundante τοῦ ὕδατος wird nicht mit dem unnatürlichen »des Wassers« nachgebildet.
- source_word: ἔστησεν
  choice: stellte ... auf
  rationale: Bezeichnet hier das gezielte Positionieren von Personen an einem Ort und passt zum militärischen Zusammenhang.
- source_word: γραμματεῖς τοῦ λαοῦ
  choice: die Schreiber des Volkes
  rationale: Bewahrt die wörtliche Amtsbezeichnung, ohne ihre im Kontext möglicherweise administrative oder militärische Funktion spekulativ festzulegen.
- source_word: ἐπὶ τοῦ χειμάρρου
  choice: am Wadi
  rationale: ἐπί mit Genitiv bezeichnet hier die Lage an beziehungsweise bei dem Wasserlauf.
- source_word: Μὴ ἀφῆτε ἄνθρωπον παρεμβαλεῖν
  choice: Lasst niemanden ein Lager aufschlagen
  rationale: Die Konstruktion verbietet, irgendjemandem das Lagern zu erlauben. »Ein Lager aufschlagen« gibt die militärische Bedeutung von παρεμβάλλω idiomatisch wieder; ἄνθρωπον ist in der Verneinung natürlich mit »niemanden« wiedergegeben.
- source_word: ἐρχέσθωσαν πάντες εἰς τὸν πόλεμον
  choice: sondern alle sollen in den Kampf ziehen
  rationale: Gibt die Aufforderung zur ausnahmslosen Teilnahme am unmittelbar bevorstehenden Kampf in natürlichem Deutsch wieder.
