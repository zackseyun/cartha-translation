  text: Joseph son of Zechariah and Azariah[a], commanders of the forces, heard of the brave deeds and of the warlike exploits that they had done.
translation:
  language: de
  text: Josef, der Sohn des Zacharias, und Asarja[a], die Befehlshaber der Streitkräfte, hörten von den Heldentaten, die sie vollbracht, und dem Krieg, den sie geführt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier zugrunde gelegte griechische Text bei Swete scheint als zweiten Namen „Zacharias“ zu lesen; der Erzählzusammenhang und die verbreitete Textüberlieferung sprechen hier für „Asarja“.
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörten von
  rationale: Das Verb bezeichnet ein Hören beziehungsweise Erfahren. Im Deutschen leitet „von … hören“ den Bericht über die nachfolgenden Taten natürlich ein. Der griechische Singular steht trotz des zusammengesetzten Subjekts; im Deutschen ist der Plural grammatisch erforderlich.
- source_word: Ἰωσὴφ ὁ τοῦ Ζαχαρία
  choice: Josef, der Sohn des Zacharias
  rationale: Artikel und Genitiv bilden eine übliche Sohnschaftsangabe. Die ausgeschriebene Form ist im modernen Deutsch eindeutig und würdig.
- source_word: Ζαχαρίας
  choice: Asarja[a]
  rationale: Der vorgelegte Swete-Text liest an dieser Stelle „Zacharias“, doch der Erzählzusammenhang und die verbreitete Textüberlieferung weisen auf Asarja als zweiten Befehlshaber. Die Abweichung wird durch eine Fußnote offengelegt.
- source_word: ἄρχοντες τῶν δυνάμεων
  choice: die Befehlshaber der Streitkräfte
  rationale: ἄρχοντες bezeichnet hier militärische Leiter; „Befehlshaber“ gibt die Funktion wieder, ohne einen modernen Dienstgrad festzulegen. „Streitkräfte“ entspricht dem militärischen Sinn von δυνάμεις.
- source_word: ἀνδραγαθήσεων
  choice: Heldentaten
  rationale: Das Substantiv bezeichnet mutige, tapfere Leistungen. „Heldentaten“ ist knapp, verständlich und vermeidet die heute unnatürliche wörtliche Vorstellung „mannhafte Taten“.
- source_word: τοῦ πολέμου
  choice: kriegerischen Taten
  rationale: In Verbindung mit ἀνδραγαθήσεων und οἷα ἐποίησαν ist der Krieg als Bereich konkreter militärischer Leistungen gefasst. „Kriegerische Taten“ bildet diese Verbindung im Deutschen natürlich ab, ohne bestimmte Erfolge hinzuzufügen.
- source_word: οἷα ἐποίησαν
  choice: die jene vollbracht hatten
  rationale: Die Wendung verweist rückblickend auf die berichteten Taten. „Jene“ verdeutlicht, dass nicht Josef und Asarja selbst gemeint sind, sondern die zuvor im Erzählzusammenhang handelnden Männer.
