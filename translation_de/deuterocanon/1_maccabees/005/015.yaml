lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Partizip wird in natürlichem deutschen Erzählstil koordinierend wiedergegeben; sein genauer syntaktischer Anschluss ergibt sich aus dem vorhergehenden Vers.
- source_word: Ἐπισυνήχθη
  choice: ist eine Streitmacht … zusammengezogen worden
  rationale: Die aoristische Passivform bleibt als Passiv erhalten. „Streitmacht“ macht das im militärischen Zusammenhang vorausgesetzte Kollektiv verständlich, ohne ausdrücklich ein reguläres Heer anzunehmen.
- source_word: ἐπʼ αὐτούς
  choice: gegen sie
  rationale: ἐπί mit Akkusativ bezeichnet hier die feindliche Ausrichtung; „gegen sie“ ist präzise und idiomatisch.
- source_word: ἐκ Πτολεμαΐδος καὶ Τύρου καὶ Σιδῶνος
  choice: aus Ptolemaïs, Tyrus und Sidon
  rationale: Die Herkunft der zusammengezogenen Streitmacht wird mit „aus“ wiedergegeben; die Ortsnamen folgen ihren geläufigen deutschen Formen.
- source_word: πάσης Γαλιλαίας ἀλλοφύλων
  choice: aus dem ganzen Galiläa der Fremdvölker
  rationale: Die Genitivverbindung bleibt eng am Griechischen. „Fremdvölker“ gibt ἀλλόφυλοι als Angehörige anderer Völker wieder und vermeidet eine unnötige theologische Festlegung.
- source_word: τοῦ ἐξαναλῶσαι ἡμᾶς
  choice: um uns auszulöschen
  rationale: Der artikulierte Infinitiv bezeichnet den Zweck. „Auslöschen“ vermittelt die beabsichtigte vollständige Vernichtung und bewahrt den ausdrücklichen Wechsel von „sie“ zu „uns“.
theological_decisions:
- issue: Wiedergabe von ἀλλόφυλοι im ethnisch-militärischen Zusammenhang
  choice: Fremdvölker
  alternative: Heiden
  rationale: Das Wort bezeichnet hier zunächst Menschen anderer Volkszugehörigkeit. „Fremdvölker“ erhält diesen ethnisch-politischen Sinn; die traditionelle Wiedergabe „Heiden“ wird in der Fußnote genannt.
- issue: Wechsel der Pronomen von αὐτούς zu ἡμᾶς
  choice: gegen sie … um uns auszulöschen
  alternative: gegen uns … um uns auszulöschen
  rationale: Der auffällige Wechsel steht ausdrücklich im griechischen Text und wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passive Aussage und der unvermittelte Wechsel von „sie“ zu „uns“ bleiben erhalten. „Streitmacht“ ist im militärischen Kontext verständlich, ohne den griechischen Text auf ein reguläres Heer festzulegen.
