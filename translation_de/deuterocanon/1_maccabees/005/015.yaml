translation:
  language: de
  text: 'und sagten: „Gegen sie ist eine Schar aus Ptolemais, Tyrus und Sidon sowie aus ganz Galiläa der Fremden[a] zusammengezogen worden, um uns auszulöschen.“'
  philosophy: optimal-equivalence
