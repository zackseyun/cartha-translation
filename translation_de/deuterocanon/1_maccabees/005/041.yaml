  text: But if we cross over and camp beyond the river[a], we will cross over to him.
translation:
  language: de
  text: Wenn wir aber hindurchziehen und er jenseits des Flusses sein Lager aufschlägt, werden wir zu ihm[a] übersetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen ihn vorgehen«. Im militärischen Zusammenhang kann die griechische Wendung eine feindliche Annäherung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέλθωμεν
  choice: wir hinübergehen
  rationale: Der Aorist Konjunktiv nach ἐάν bezeichnet eine zukünftige Bedingung. »Hinübergehen« gibt die Bewegung über den Fluss natürlich wieder.
- source_word: παρεμβάλῃ
  choice: er … sein Lager aufschlägt
  rationale: Das Verb bezeichnet im militärischen Zusammenhang das Lagern. Die griechische Form steht in der 3. Person Singular; deshalb bleibt der Subjektwechsel gegenüber »wir« im Deutschen sichtbar.
- source_word: πέραν τοῦ ποταμοῦ
  choice: jenseits des Flusses
  rationale: πέραν bezeichnet die andere beziehungsweise weiter entfernte Seite und wird räumlich präzise, ohne zusätzliche Festlegung, wiedergegeben.
- source_word: διαπεράσομεν
  choice: wir … hinübergehen
  rationale: Das Futur bezeichnet das Übersetzen auf die andere Seite. Die wiederholte Formulierung bewahrt die im Griechischen wiederkehrende Vorstellung des Überquerens.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet zunächst die Bewegung auf eine Person zu. Der feindliche Sinn ist im militärischen Kontext möglich, soll aber nicht ohne Kennzeichnung in den Haupttext eingetragen werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der auffällige Wechsel vom Subjekt »wir« zu »er«, der durch die griechischen Verbformen vorgegeben ist, wurde nicht geglättet. Die Wiederholung des Hinübergehens bleibt erhalten.
