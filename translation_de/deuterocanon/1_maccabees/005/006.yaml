  text: And he crossed over against the sons of Ammon[a], and found a strong force and a large people[b], with Timothy leading them.
translation:
  language: de
  text: Und er zog hinüber gegen die Söhne Ammons[a] und fand eine starke Streitmacht[b] und ein zahlreiches Volk; Timotheus führte sie an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ammoniter“. Wörtlich: „die Söhne Ammons“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „eine starke Hand“; hier ist wahrscheinlich militärische Macht oder eine Streitmacht gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπέρασεν ἐπὶ
  choice: zog gegen
  rationale: Das Verb bezeichnet ein Hinübergehen oder Überschreiten; mit ἐπί und im militärischen Zusammenhang gibt „zog gegen“ die feindlich gerichtete Bewegung natürlich wieder, ohne eine im Deutschen unklare Gewässer- oder Grenzüberquerung vorauszusetzen.
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: die Söhne Ammons
  rationale: Die formale Wendung des Griechischen bleibt erhalten; sie bezeichnet die Ammoniter und ist im Deutschen verständlich.
- source_word: χεῖρα κραταιὰν
  choice: eine starke Streitmacht
  rationale: Wörtlich steht „eine starke Hand“. Im militärischen Zusammenhang bezeichnet χείρ hier wahrscheinlich Macht beziehungsweise eine Truppenmacht; „Streitmacht“ vermittelt diesen Sinn idiomatisch.
- source_word: λαὸν πολύν
  choice: ein zahlreiches Volk
  rationale: Die Wiedergabe bewahrt den kollektiven und nicht ausdrücklich auf ein Heer beschränkten Sinn von λαός sowie die Bedeutung „zahlreich“ von πολύς.
- source_word: Τιμόθεον ἡγούμενον αὐτῶν
  choice: Timotheus führte sie an
  rationale: ἡγούμενον bezeichnet allgemein das Leiten oder Führen. Die Formulierung passt zum militärischen Kontext, ohne das spezifischere „befehligte“ in den Text einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der griechischen Struktur, wird aber durch „zog gegen“, „stieß auf“ und einen abschließenden selbstständigen Satzteil natürlich lesbar. Die ungewöhnliche Herkunftsbezeichnung „Söhne Ammons“ und das nicht ausdrücklich militärisch eingeengte „Volk“ bleiben erhalten.
