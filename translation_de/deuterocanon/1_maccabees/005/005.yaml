  source_fidelity: 'Die Übersetzung gibt die Handlungsfolge des Griechischen zuverlässig wieder: Einschließen in die Türme, Lageraufschlagen gegen sie, ἀναθεματίζειν als Weihung zur Vernichtung und das Inbrandsetzen der Türme samt allen darin Befindlichen. Die aktive deutsche Wiedergabe von διεκλείσθησαν ὑπʼ αὐτοῦ ist mit genanntem Handelnden idiomatisch und sinnentsprechend. „Samt allen, die sich darin befanden“ macht den Bezug auf die Türme klar, ohne über den griechischen Wortlaut hinauszugehen.'
