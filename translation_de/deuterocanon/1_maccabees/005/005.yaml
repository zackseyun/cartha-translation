  text: And they were shut up by him in the towers[a], and he encamped against them, and he devoted them to destruction, and he burned its towers with fire[b], along with all who were in them.
translation:
  language: de
  text: Und er schloss sie in den Türmen ein, schlug sein Lager gegen sie auf und weihte sie dem Untergang[a]. Dann setzte er ihre Türme in Brand[b], samt allen, die sich darin befanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „legte sie unter den Bann“. Das griechische Verb bezeichnet hier, Menschen oder Dinge der Vernichtung zu weihen, nicht nur, sie zu verfluchen.'
    reason: lexical_alternative
  - marker: b
    text: Das Griechische hat ein Pronomen im femininen Singular, wörtlich „ihre Türme“; wahrscheinlich bezieht es sich im Zusammenhang auf die Stadt.
    reason: referent_ambiguity
lexical_decisions:
- source_word: διεκλείσθησαν ὑπʼ αὐτοῦ
  choice: er schloss sie … ein
  rationale: Die aktive deutsche Form gibt das griechische Passiv mit genanntem Handelnden natürlich wieder und bewahrt den Sinn, dass Judas sie in den Türmen einschloss beziehungsweise festsetzte.
- source_word: πύργους
  choice: Türmen
  rationale: „Türme“ entspricht der gewöhnlichen Bedeutung und vermeidet, die Bauwerke ohne zwingenden Grund als allgemeine Festungen zu deuten.
- source_word: παρέβαλεν ἐπʼ αὐτούς
  choice: schlug sein Lager gegen sie auf
  rationale: Die Formulierung bewahrt das konkrete Bild des Lageraufschlagens und zugleich die feindliche Ausrichtung, ohne bereits ausdrücklich „belagerte“ zu sagen.
- source_word: ἀνεθεμάτισεν
  choice: weihte sie dem Untergang
  rationale: Die Wendung bringt die Vorstellung des Banns beziehungsweise der Bestimmung zur Vernichtung zum Ausdruck und reduziert das Verb weder auf ein bloßes Verfluchen noch auf gewöhnliches Töten.
- source_word: ἐνεπύρισεν … ἐν πυρί
  choice: setzte … in Brand
  rationale: Die idiomatische deutsche Wendung gibt sowohl das Anzünden als auch den griechischen Feuerbezug prägnant wieder, ohne die im Deutschen schwerfällige Doppelung „verbrannte mit Feuer“.
- source_word: αὐτῆς
  choice: ihre
  rationale: Das feminine Singularpronomen wird formal mit „ihre“ wiedergegeben; sein wahrscheinlich auf die Stadt bezogener Referent wird in einer Fußnote erläutert, statt im Haupttext stillschweigend präzisiert zu werden.
- source_word: σὺν πᾶσιν τοῖς ἐνοῦσιν
  choice: samt allen, die sich darin befanden
  rationale: Die Formulierung bewahrt die ausnahmslose Gesamtheit und bezeichnet natürlich die Menschen im Inneren der Türme.
theological_decisions:
- issue: Wiedergabe von ἀνεθεμάτισεν im Zusammenhang biblischer Bannvorstellungen
  choice: weihte sie dem Untergang
  alternative: legte sie unter den Bann; vernichtete sie vollständig
  rationale: Die gewählte Fassung bewahrt die sakrale Dimension einer Bestimmung zur Vernichtung, bleibt aber für heutige Leser verständlicher als die fachsprachliche Bannformel und behauptet nicht lediglich das Ergebnis einer vollständigen Vernichtung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache bleibt konkret; die Bannvorstellung wird verständlich, aber nicht konfessionell ausgedeutet. Der Wechsel zu einem neuen Satz vor dem Verbrennen dient der Lesbarkeit, ohne die Abfolge der griechischen Handlungskette zu verändern.
