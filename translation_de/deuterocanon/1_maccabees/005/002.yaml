base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/002.yaml
  text: And they were plotting to remove the offspring of Jacob who were among them[b][a], and they began to kill and wipe out those among the people.
translation:
  language: de
  text: Und sie schmiedeten Pläne, die Nachkommen Jakobs[a], die mitten unter ihnen lebten, zu beseitigen. Dann begannen sie, Angehörige des Volkes[b] zu töten und auszurotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Geschlecht Jakobs“ oder „das Volk Jakobs“. Das griechische Wort γένος betont Abstammung und Zusammengehörigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „im Volk“ oder „unter dem Volk“. Die knappe griechische Wendung kann örtlich verstanden werden; im Zusammenhang liegt jedoch auch die Bedeutung „Angehörige des Volkes“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύοντο
  choice: sie schmiedeten Pläne
  rationale: Der Imperfekt bezeichnet ein andauerndes Planen; die Wendung gibt angesichts des feindlichen Ziels auch den verschwörerischen Unterton wieder.
- source_word: ἆραι
  choice: zu beseitigen
  rationale: αἴρω bedeutet hier wegnehmen oder entfernen. „Beseitigen“ bewahrt diesen Sinn und lässt die nachfolgende Aussage über Töten und Ausrotten die konkrete Gewalt entfalten.
- source_word: τὸ γένος Ἰακώβ
  choice: die Nachkommen Jakobs
  rationale: γένος bezeichnet Abstammung, Sippe oder Herkunft. „Nachkommen Jakobs“ gibt die genealogische Identität natürlich wieder, ohne moderne biologische Vorstellungen von „Rasse“ einzutragen.
- source_word: τοὺς ὄντας ἐν μέσῳ αὐτῶν
  choice: die mitten unter ihnen lebten
  rationale: Die substantivierte Partizipialwendung grenzt die Zielgruppe auf die Angehörigen des Volkes Jakobs ein, die sich in ihrer Mitte befanden. „Lebten“ macht den im Deutschen sonst schwerfälligen Aufenthaltsbezug natürlich verständlich.
- source_word: ἤρξαντο τοῦ θανατοῦν
  choice: sie begannen ... zu töten
  rationale: Die Konstruktion mit ἄρχομαι bezeichnet den Beginn einer Handlung; θανατόω heißt töten oder zu Tode bringen.
- source_word: ἐν τῷ λαῷ
  choice: unter dem Volk
  rationale: Die knappe griechische Fügung kann örtlich („unter/im Volk“) oder mit Bezug auf Angehörige des Volkes verstanden werden. Die Hauptfassung hält sich eng an die örtliche Formulierung.
- source_word: ἐξαίρειν
  choice: auszurotten
  rationale: ἐξαιρέω kann entfernen oder wegnehmen bedeuten. Neben θανατοῦν und im Kontext der gegen die gesamte Abstammung gerichteten Pläne bezeichnet es hier die gewaltsame Tilgung beziehungsweise Ausrottung.
theological_decisions:
- issue: Abstammungs- und Bundesbezeichnung in τὸ γένος Ἰακώβ
  choice: die Nachkommen Jakobs
  alternative: das Geschlecht Jakobs; das Volk Jakobs
  rationale: Die Wiedergabe erhält die heilsgeschichtlich-genealogische Bezeichnung, ohne sie mit modernen Rassebegriffen oder einer konfessionellen Deutung aufzuladen.
- issue: Steigerung in ἆραι ... θανατοῦν ... ἐξαίρειν
  choice: beseitigen ... töten und ausrotten
  alternative: wegnehmen ... zu Tode bringen und entfernen
  rationale: Die Übersetzung wahrt die Bewegung vom geplanten Entfernen zur tatsächlichen Tötung und Ausrottung, statt die drei Verben unterschiedslos wiederzugeben.
- issue: Bezug von ἐν τῷ λαῷ
  choice: unter dem Volk
  alternative: Angehörige des Volkes
  rationale: Die griechische Wendung ist knapp und lässt einen örtlichen oder partitiv verstandenen Bezug zu. Die Hauptfassung bewahrt die formale Ortsangabe; die Fußnote nennt die andere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sie schmiedeten Pläne“ trägt den feindseligen Charakter des fortdauernden Beratens, ohne umgangssprachlich zu wirken. Die elliptische Gewaltformel „zu töten und auszurotten“ bleibt bewusst knapp wie der griechische Text; die Unsicherheit des Bezugs von ἐν τῷ λαῷ wird in einer Fußnote offengelegt.
