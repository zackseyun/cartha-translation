base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/068.yaml
  text: And Judas turned aside into Azotus[a], the land of foreigners, and he tore down their altars, and burned the carved images of their gods with fire, and plundered the spoil of the cities[b], and returned to Judea.
translation:
  language: de
  text: Und Judas bog nach Aschdod[a] ab, in das Land der Fremden. Er riss ihre Altäre nieder, und sie verbrannten die geschnitzten Bilder ihrer Götter. Er nahm die Beute aus den Städten an sich[b] und kehrte nach Judäa zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text steht Azotos. „Land der Fremden“ kann im historischen Zusammenhang genauer das Land der Philister bezeichnen.
    reason: alternative_reading
  - marker: b
    text: Beim Verb „verbrannten“ steht im Griechischen unerwartet der Plural, während die umgebenden Verben Judas als einzelnes Subjekt haben. Gemeint sind wahrscheinlich Judas und seine Männer.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: bog … ab
  rationale: Gibt den Richtungswechsel des Verbs natürlich und ohne zusätzliche Motivangabe wieder.
- source_word: Ἄζωτον
  choice: Aschdod
  rationale: Die im Deutschen geläufige biblische Form bezeichnet denselben Ort wie das griechische Ἄζωτος und ist verständlicher als eine mechanische Transliteration.
- source_word: γῆν ἀλλοφύλων
  choice: das Land der Fremdstämmigen
  rationale: Bewahrt den weiteren Wortsinn von ἀλλόφυλοι, ohne die historisch naheliegende Identifikation mit den Philistern in den Haupttext einzutragen.
- source_word: καθεῖλεν
  choice: riss … nieder
  rationale: Bezeichnet die konkrete Zerstörung der Altäre in natürlichem modernem Deutsch.
- source_word: βωμοὺς
  choice: Altäre
  rationale: Direkte und übliche Entsprechung für βωμός.
- source_word: γλυπτὰ
  choice: geschnitzten Bilder
  rationale: Bewahrt den materiellen Aspekt von geschnitzten beziehungsweise gemeißelten Kultbildern, statt allgemein mit „Götzen“ zu übersetzen.
- source_word: κατέκαυσαν
  choice: sie verbrannten
  rationale: Erhält bewusst den Numeruswechsel zum Plural im überlieferten griechischen Text.
- source_word: ἐσκύλευσεν τὰ σκῦλα
  choice: plünderte die Beute
  rationale: Spiegelt die etymologische Verbindung von Verb und Objekt sowie den kriegerischen Zusammenhang, auch wenn die deutsche Wendung markant wirkt.
- source_word: ἐπέστρεψεν
  choice: kehrte … zurück
  rationale: Natürliche narrative Wiedergabe der Rückkehr.
- source_word: Ἰουδαίαν
  choice: Judäa
  rationale: Eingebürgerte deutsche Bezeichnung der Region in diesem historischen Zeitraum.
theological_decisions:
- issue: Ethnische Bezeichnung ἀλλόφυλοι im historisch philistäischen Gebiet
  choice: Land der Fremdstämmigen
  alternative: Land der Philister
  rationale: Der Haupttext wahrt die allgemeinere griechische Bezeichnung; die historische Präzisierung wird in einer Fußnote genannt.
- issue: Numeruswechsel bei κατέκαυσαν nach Verben im Singular
  choice: sie verbrannten
  alternative: er verbrannte
  rationale: Der Plural des griechischen Zeugen wird nicht harmonisiert. Wahrscheinlich sind Judas und seine Männer beziehungsweise seine Truppen gemeint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Text bewahrt den auffälligen Wechsel vom Singular zum Plural. Die langen griechischen Reihungen wurden maßvoll in Sätze gegliedert; die Abfolge der Handlungen bleibt unverändert.
