revisions:
- from: Und Judas bog nach Aschdod[a] ab, in das Land der Fremdstämmigen. Er riss ihre Altäre nieder, und sie verbrannten die geschnitzten Bilder ihrer Götter. Er plünderte die Beute der Städte[b] und kehrte nach Judäa zurück.
  to: Und Judas bog nach Aschdod[a] ab, in das Land der Fremden. Er riss ihre Altäre nieder, und sie verbrannten die geschnitzten Bilder ihrer Götter. Er nahm die Beute aus den Städten an sich[b] und kehrte nach Judäa zurück.
  rationale: Die Revision ersetzt zwei im Deutschen unnatürliche bzw. semantisch problematische Wendungen, ohne den Sinn oder die Handlungsfolge zu verändern. Sie bewahrt sowohl die allgemeine griechische Bezeichnung ἀλλόφυλοι als auch den auffälligen Wechsel zum Plural bei κατέκαυσαν. Die Fußnote zu Aschdod dokumentiert zugleich die griechische Namensform und die mögliche historische Einordnung, ohne diese in den Haupttext einzutragen.
