  source_fidelity: 'Der Plural in κατέκαυσαν wird zutreffend durch „sie verbrannten“ bewahrt. „Aschdod“ ist als deutsche historische Ortsform für Ἄζωτος vertretbar, sofern die abweichende griechische Namensform erläutert wird. Die Verbindung „plünderte die Beute der Städte“ ist jedoch im Deutschen semantisch widersprüchlich: Beute wird nicht geplündert, sondern genommen bzw. erbeutet.'
  naturalness: „Land der Fremdstämmigen“ wirkt im modernen Standarddeutsch unnötig fachsprachlich und ungewohnt. „Land der Fremden“ ist idiomatischer und erhält die allgemeine, nicht ausdrücklich ethnisch spezifizierte griechische Bezeichnung. „Nahm die Beute aus den Städten an sich“ gibt die Handlung verständlich wieder.
  terminology: „Altäre“, „geschnitzten Bilder ihrer Götter“ und „Judäa“ sind angemessen. Die Fußnote zur pluralischen Verbform ist sachlich und wahrt den Charakter der Beobachtung als wahrscheinliche Erklärung.
