lexical_decisions:
- source_word: προκατελάβε
  choice: eroberte
  rationale: Das Verb bezeichnet hier im militärischen Zusammenhang die Einnahme eines Ortes. „Eroberte“ gibt den Sinn natürlich wieder, ohne die Vorsilbe προ- durch ein im Deutschen unpassendes „im Voraus“ zu überzeichnen.
- source_word: Ἰαζὴρ
  choice: Jaser
  rationale: „Jaser“ ist die herkömmliche deutsche Form des biblischen Ortsnamens.
- source_word: θυγατέρας
  choice: zugehörigen Ortschaften
  rationale: Wörtlich steht „Töchter“; geografisch bezeichnet der Ausdruck die von einer Stadt abhängigen kleineren Siedlungen. „Zugehörige Ortschaften“ bewahrt das Abhängigkeitsverhältnis verständlich und legt deren genaue Größe nicht unnötig fest.
- source_word: ἀπέστρεψεν
  choice: kehrte … zurück
  rationale: Die Wendung gibt die Bedeutung „umkehren, zurückkehren“ idiomatisch und knapp wieder.
- source_word: Ἰουδαίαν
  choice: Judäa
  rationale: Der griechische Name bezeichnet hier die Region Judäa; die deutsche Standardform ist „Judäa“.
