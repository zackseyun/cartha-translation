  yaml_path: translation/deuterocanon/1_maccabees/005/035.yaml
  text: And he turned aside to Maapha and fought against it, and he captured it and killed every male in it, and he took its spoils and burned it with fire.
translation:
  language: de
  text: Dann bog er nach Maafa ab und kämpfte gegen die Stadt. Er nahm sie ein, tötete alle männlichen Bewohner, nahm ihre Beute und brannte sie nieder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκλινεν
  choice: bog … ab
  rationale: Gibt die Grundbedeutung des Abbiegens beziehungsweise Abweichens von der bisherigen Route natürlich wieder, ohne einen ausdrücklich nicht genannten Angriffsmarsch einzutragen.
- source_word: Μααφὰ
  choice: Maafa
  rationale: Nahe Umschrift der griechischen Ortsbezeichnung in einer für deutsche Leser gut lesbaren Form; griechisches φ wird in biblischen Namen hier mit „f“ wiedergegeben.
- source_word: ἐπολέμησεν αὐτήν
  choice: kämpfte gegen die Stadt
  rationale: Entspricht dem militärischen Sinn des Verbs; „die Stadt“ macht den femininen Rückbezug im Deutschen eindeutig und natürlich.
- source_word: κατελάβετο αὐτὴν
  choice: nahm sie ein
  rationale: Im Zusammenhang einer eroberten Stadt ist „einnehmen“ die idiomatische und genaue deutsche Wiedergabe.
- source_word: πᾶν ἀρσενικὸν αὐτῆς
  choice: alles Männliche darin
  rationale: Bewahrt die umfassende und sachlich harte Formulierung des griechischen Neutrums, ohne sie auf erwachsene Männer zu verengen.
- source_word: τὰ σκῦλα αὐτῆς
  choice: ihre Beute
  rationale: „Beute“ ist die geläufige deutsche Bezeichnung für im Krieg erlangtes Gut und passt zum kollektiven griechischen Plural.
- source_word: ἐνέπρησεν αὐτὴν ἐν πυρί
  choice: brannte sie nieder
  rationale: Gibt die Brandzerstörung idiomatisch wieder. Das griechische „mit Feuer“ ist im deutschen Verb bereits enthalten und muss nicht pleonastisch wiederholt werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper militärischer Erzählweise. Die koordinierte Ereignisfolge des Griechischen wird durch zwei Sätze lesbarer gestaltet; die Härte und Vollständigkeit der Gewaltdarstellung bleibt unverändert erhalten.
