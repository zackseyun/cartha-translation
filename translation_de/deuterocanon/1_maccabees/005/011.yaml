  text: And they are preparing to come and seize the stronghold into which we have fled[b][a]; and Timothy is leading their camp.
translation:
  language: de
  text: Und sie bereiten sich darauf vor, zu kommen und die Festung, in die wir uns geflüchtet haben, zuvor einzunehmen[a]. Timotheus führt ihr Heer[b] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Voraus einzunehmen“ beziehungsweise „als Erste zu besetzen“. Das griechische Verb betont eine vorwegnehmende, zuvorkommende Einnahme.'
    reason: lexical_alternative
