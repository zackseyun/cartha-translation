lexical_decisions:
- source_word: ἑτοιμάζοντές εἰσιν
  choice: sie bereiten sich darauf vor
  rationale: Die Umschreibung aus Partizip und εἰσιν bezeichnet eine gegenwärtig andauernde Vorbereitung.
- source_word: προκαταλαβέσθαι
  choice: vor uns einzunehmen
  rationale: Die Wiedergabe bewahrt sowohl den militärischen Sinn des Einnehmens als auch die im Präfix προ- enthaltene Vorstellung des Zuvorkommens.
- source_word: τὸ ὀχύρωμα
  choice: die Festung
  rationale: ὀχύρωμα bezeichnet hier einen befestigten Zufluchtsort; „Festung“ ist im Deutschen klar und natürlich.
- source_word: εἰς ὃ κατεφύγομεν
  choice: in die wir uns geflüchtet haben
  rationale: Die Formulierung gibt die Flucht an einen Zufluchtsort sowie die fortdauernde Bedeutung dieses vollzogenen Vorgangs wieder.
- source_word: ἡγεῖται
  choice: führt … an
  rationale: Das Verb bezeichnet im militärischen Zusammenhang die Führung beziehungsweise den Oberbefehl, ohne stärker zu präzisieren als der griechische Text.
- source_word: τῆς παρεμβολῆς αὐτῶν
  choice: ihr Heer
  rationale: παρεμβολή kann sowohl das Lager als auch die dort versammelte Streitmacht bezeichnen. Als Objekt militärischer Führung ist „Heer“ im Deutschen am natürlichsten.
