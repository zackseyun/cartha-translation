  text: And he pursued them as far as the cities of Ptolemais[a]; and about three thousand men from the nations fell[b], and he took their spoils.
translation:
  language: de
  text: Und er verfolgte sie bis zu den Städten von Ptolemaïs[a]. Etwa dreitausend Mann aus den Völkern[b] fielen[c], und er nahm ihre Beute an sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text hat ausdrücklich den Plural „Städte“; gemeint sein können die zu Ptolemaïs gehörenden Orte oder Siedlungen.
    reason: geographical_ambiguity
  - marker: b
    text: „Die Völker“ bezeichnet hier die nichtisraelitischen Völker in den gegnerischen Streitkräften; traditionell wird auch „die Heiden“ übersetzt.
    reason: lexical_alternative
  - marker: c
    text: 'Oder ohne die ungefähre Angabe: „dreitausend Mann“. Die griechische Formulierung εἰς τρισχιλίους ἄνδρας kann als ungefähre Gesamtzahl oder als einfache Zahlenangabe verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: verfolgte
  rationale: Das Verb bezeichnet hier die militärische Verfolgung eines weichenden Gegners; „verfolgte“ ist präzise und natürlich.
- source_word: ἕως τῶν πόλεων Πτολεμαΐδος
  choice: bis zu den Städten von Ptolemaïs
  rationale: ἕως mit Genitiv bezeichnet die räumliche Ausdehnung. Der im Griechischen ausdrücklich stehende Plural πόλεων bleibt erhalten.
- source_word: ἔπεσον
  choice: fielen
  rationale: Im Kampfzusammenhang bedeutet das Verb, dass die Betreffenden im Kampf ums Leben kamen. „Fielen“ bewahrt die knappe militärische Ausdrucksweise des Griechischen.
- source_word: ἐκ τῶν ἐθνῶν
  choice: von den Völkern
  rationale: Die Wendung bezeichnet Angehörige der nichtisraelitischen Völker im gegnerischen Heer. Die Übersetzung bleibt nahe am griechischen Ausdruck und vermeidet eine unnötige spätere Fachprägung durch „Heiden“.
- source_word: εἰς τρισχιλίους ἄνδρας
  choice: etwa dreitausend Mann
  rationale: εἰς bei einer Zahl kann eine Größenordnung beziehungsweise Gesamtsumme angeben. „Etwa“ gibt die mögliche Annäherungsnuance wieder, ohne die alternative Lesart als genaue Zahl zu verschweigen.
- source_word: τὰ σκῦλα αὐτῶν
  choice: ihre Beute
  rationale: σκῦλα bezeichnet die nach einem Kampf erbeuteten Güter. Das Possessivpronomen gibt αὐτῶν wieder; „an sich nahm“ macht das Besitzergreifen idiomatisch deutlich.
