  text: And he took them from Galilee and from Arbactis[a], together with the women and the children and all that belonged to them[b], and they brought them into Judea with great rejoicing.
translation:
  language: de
  text: Und er nahm sie aus Galiläa und aus Arbaktis[a] mit, samt den Frauen und den Kindern und allem, was ihnen gehörte; und sie brachten sie[b] mit großer Freude nach Judäa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Arbaktis“. Der griechische Text verwendet bei diesem Ortsnamen „in“, doch im Zusammenhang kann die Wendung als Herkunftsangabe verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text wechselt von der Einzahl („er nahm“) zur Mehrzahl („sie brachten“). Die Übersetzung bewahrt diesen überlieferten Wechsel, statt ihn anzugleichen.
    reason: textual_variant
lexical_decisions:
- source_word: παρέλαβεν
  choice: nahm … mit
  rationale: Das Verb kann „aufnehmen“, „übernehmen“ oder „mitnehmen“ bedeuten. Im Zusammenhang der Sammlung und sicheren Überführung der Menschen gibt „nahm … mit“ den Vorgang natürlich und knapp wieder.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: aus Galiläa
  rationale: Die Wendung bezeichnet eindeutig den Herkunftsort; „Galiläa“ ist die übliche deutsche Namensform.
- source_word: ἐν Ἀρβάκτοις
  choice: aus Arbaktis
  rationale: Der griechische Text hat zwar ἐν („in“), doch die Verbindung mit „aus Galiläa“ und die anschließende Ortsbewegung legen im Deutschen eine Herkunftsangabe nahe. Die wörtliche Möglichkeit wird in einer Fußnote bewahrt.
- source_word: σὺν ταῖς γυναιξὶν καὶ τοῖς τέκνοις
  choice: samt den Frauen und den Kindern
  rationale: Der Text spricht ausdrücklich von „den Frauen“ und „den Kindern“. „Frauen“ wird nicht zu „Ehefrauen“ verengt; „samt“ gibt die begleitende Gruppe würdig und knapp wieder.
- source_word: πάντα ὅσα ἦν αὐτοῖς
  choice: allem, was ihnen gehörte
  rationale: Die Formulierung umfasst ihren gesamten Besitz, ohne ihn auf bestimmte Arten von Habe zu beschränken.
- source_word: ἤγαγον
  choice: sie brachten
  rationale: Die überlieferte griechische Verbform steht im Plural. Dieser Wechsel vom Singular zum Plural wird nicht harmonisiert.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: nach Judäa
  rationale: Bei der Bewegung in eine geografische Region ist „nach Judäa“ im Deutschen die natürliche Wiedergabe der Richtung.
- source_word: μετʼ εὐφροσύνης μεγάλης
  choice: unter großer Freude
  rationale: Die Wendung bezeichnet ausgeprägte, gemeinschaftlich erlebte Freude und wird in natürlichem, würdigem Deutsch wiedergegeben.
