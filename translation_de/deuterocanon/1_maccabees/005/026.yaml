base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/026.yaml
  text: and that many of them are shut up in Bosora and Bosor[a], in Alamis, Casphor, Maked, and Carnaim; all these cities are fortified and large.
translation:
  language: de
  text: und dass viele von ihnen in Bosora und Bosor, in Alamis, Kasphor, Maked und Karnain[a] eingeschlossen sind; alle diese Städte sind befestigt und groß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Ortsnamen sind teilweise unsicher und werden in den Übersetzungstraditionen unterschiedlich wiedergegeben. Hier folgen sie in enger Umschrift dem Text der Swete-Ausgabe, ohne sie an geläufigere Namensformen anzugleichen.
    reason: cultural_note
lexical_decisions:
- source_word: συνειλημμένοι
  choice: eingeschlossen sind
  rationale: Das Partizip bezeichnet, dass die Betroffenen innerhalb der genannten Städte eingeschlossen oder festgesetzt sind, ohne zwingend den militärischen Fachsinn „belagert“ festzulegen.
- source_word: εἰς
  choice: in
  rationale: In Verbindung mit dem passiven Partizip und den Ortsnamen bezeichnet εἰς hier idiomatisch den Ort beziehungsweise den daraus entstandenen Zustand.
- source_word: Βοσσορὰ καὶ Βοσόρ, ἐν Ἀλάμοις, Κασφὼρ, Μακέδ, καὶ Καρναΐν
  choice: Bosora und Bosor, in Alamis, Kasphor, Maked und Karnain
  rationale: Die Ortsnamen werden eng am griechischen Text transliteriert und nicht an geläufigere Formen anderer Texttraditionen angeglichen. Das ausdrücklich gesetzte ἐν wird als „in“ wiedergegeben.
- source_word: ὀχυραὶ
  choice: befestigt
  rationale: Das Adjektiv beschreibt Städte als durch Verteidigungsanlagen gesichert; „befestigt“ ist dafür die konkrete und natürliche deutsche Wiedergabe.
- source_word: μεγάλαι
  choice: groß
  rationale: Bei der Beschreibung von Städten gibt „groß“ zunächst ihre Ausdehnung wieder, ohne zusätzlich politische Bedeutung anzunehmen.
- source_word: πᾶσαι αἱ πόλεις αὗται
  choice: alle diese Städte
  rationale: Die Wendung fasst die zuvor genannten Orte ausdrücklich als Städte zusammen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der mit „und dass“ beginnende Satzanschluss bleibt erhalten, da der Vers syntaktisch die vorangehende Meldung fortsetzt. Die Ortsnamen werden konservativ transliteriert; „Kasphor“ und „Karnain“ entsprechen dabei üblichen deutschen Lautwerten für griechisches Κ und αι.
