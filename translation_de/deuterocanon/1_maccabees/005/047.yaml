  text: Und die Leute aus der Stadt schlossen sie ein und versperrten die Tore mit Steinen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκλεισαν
  choice: schlossen sie ein
  rationale: Das Verb bezeichnet hier das Einschließen oder Abriegeln. „Schlossen sie ein“ ist natürliches Deutsch und bewahrt den Gedanken, dass die Betroffenen festgesetzt wurden.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: die Leute aus der Stadt
  rationale: Wörtlich steht „die aus der Stadt“. „Die Leute aus der Stadt“ gibt die substantivierte Wendung natürlich wieder, ohne wie „die Männer“ ein im Griechischen nicht ausdrücklich genanntes Geschlecht festzulegen.
- source_word: ἐνέφραξαν
  choice: versperrten
  rationale: Das Verb bedeutet, etwas abzuriegeln, zu verstopfen oder zu blockieren. Bei Toren, die mit Steinen unpassierbar gemacht werden, ist „versperrten“ präzise und idiomatisch.
- source_word: τὰς πύλας
  choice: die Tore
  rationale: Die übliche deutsche Wiedergabe für Stadttore; der Plural des griechischen Textes bleibt erhalten.
- source_word: λίθοις
  choice: mit Steinen
  rationale: Der instrumentale Dativ bezeichnet das Mittel beziehungsweise Material, mit dem die Tore versperrt wurden.
theological_decisions: []
