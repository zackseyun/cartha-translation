base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/002.yaml
  text: And terror and fear fell upon them[a], and no man remained standing before his neighbor any longer; but, scattering in all directions[b], they fled along every road of the plain and of the hill country.
translation:
  language: de
  text: Da fielen Schrecken und Furcht über sie, und keiner blieb noch seinem Nächsten gegenüber stehen; vielmehr liefen sie auseinander[a] und flohen alle zugleich[b] auf allen Wegen der Ebene und des Berglands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „strömten auseinander“; wörtlicher: „wurden ausgegossen“. Das griechische Bild zeigt, wie die Truppen in Panik auseinanderbrechen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „einmütig“. Hier meint das Wort wahrscheinlich, dass alle gemeinsam oder gleichzeitig flohen, nicht dass sie in harmonischer Eintracht handelten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: fielen … über sie
  rationale: Die Wendung bewahrt das anschauliche Bild eines plötzlich über sie hereinbrechenden Schreckens und gibt den griechischen Singular im Deutschen idiomatisch mit dem auf das nachgestellte Doppelsubjekt bezogenen Verb wieder.
- source_word: τρόμος καὶ φόβος
  choice: Schrecken und Furcht
  rationale: Die beiden griechischen Begriffe werden nicht zu einem einzigen Ausdruck zusammengezogen. „Schrecken“ bezeichnet hier überwältigende Bestürzung, „Furcht“ den allgemeineren Angstbegriff.
- source_word: οὐκ ἦν ἄνθρωπος μένων
  choice: keiner blieb … stehen
  rationale: Die natürliche deutsche Wendung gibt sowohl die Verneinung als auch das fortgesetzte Verbleiben des Partizips μένων wieder, ohne unnötig ein geschlechtsspezifisches „Mann“ einzutragen, da ἄνθρωπος hier allgemein gebraucht ist.
- source_word: κατὰ πρόσωπον τοῦ πλησίον
  choice: seinem Nächsten gegenüber
  rationale: Dies wahrt das Bild des Gegenüberstehens von Angesicht zu Angesicht und gibt πλησίον als die jeweils nahestehende Person wieder.
- source_word: ἔτι
  choice: noch
  rationale: „Noch“ bezeichnet knapp und idiomatisch das Ende des bisherigen Zustands.
- source_word: ἐκχυθέντες
  choice: liefen sie auseinander
  rationale: Das Partizip bedeutet wörtlich ein Ausgegossen- oder Auseinanderströmen. Im Zusammenhang eines in Panik zerfallenden Heeres gibt „auseinanderlaufen“ das Bild natürlich wieder; die wörtlicheren Möglichkeiten stehen in der Fußnote.
- source_word: ὁμοθυμαδόν
  choice: alle zugleich
  rationale: Im Fluchtzusammenhang bezeichnet das Adverb eher gemeinsames beziehungsweise gleichzeitiges Handeln als harmonische Einmütigkeit. „Alle zugleich“ bewahrt diese kontextuelle Spannung ohne positive Einheit anzudeuten.
- source_word: ἔφευγον
  choice: flohen
  rationale: Das Imperfekt schildert die laufende Flucht; im deutschen Erzählstil ist das Präteritum die natürliche Wiedergabe.
- source_word: ἐπὶ πᾶσαν ὁδὸν
  choice: auf allen Wegen
  rationale: Die Formulierung bezeichnet die verschiedenen verfügbaren Fluchtwege. Der deutsche Plural gibt den distributiven Sinn von „jeden Weg“ idiomatisch wieder.
- source_word: τοῦ πεδίου καὶ τῆς ὀρεινῆς
  choice: der Ebene und des Berglands
  rationale: „Ebene“ bezeichnet das offene Flachland, „Bergland“ die gebirgige beziehungsweise hügelige Region; beide geografischen Bereiche bleiben unterschieden.
