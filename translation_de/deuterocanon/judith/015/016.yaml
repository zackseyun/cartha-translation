  yaml_path: translation/deuterocanon/judith/015/016.yaml
  text: And Judith kept bringing forth this confession in all Israel[a], and all the people echoed this praise; and Judith said[b],
translation:
  language: de
  text: Und Judit brachte dieses Bekenntnis in ganz Israel immer wieder vor,[a] und das ganze Volk stimmte in diesen Lobpreis ein; und Judit sagte:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Danksagung“ oder „diesen Lobpreis“. Das griechische Wort kann eine öffentliche Anerkennung, Danksagung oder einen Lobpreis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „stimmte … ein“ wiedergegebene Verb kann ein antwortendes oder wechselgesangartiges Erklingen bezeichnen; auch „ließ diesen Lobpreis widerhallen“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆρχεν
  choice: stimmte … an
  rationale: Das Imperfekt bezeichnet hier im Zusammenhang mit einem Gesang nicht primär eine räumliche Bewegung, sondern Judits einsetzendes bzw. fortgesetztes Anführen. „Stimmte … an“ ist im Deutschen natürlich und passt zur folgenden Antwort des Volkes.
- source_word: ἐξομολόγησιν
  choice: Danklied
  rationale: ἐξομολόγησις kann im biblischen Griechisch öffentliches Bekenntnis, Danksagung oder Lob bezeichnen. Im hymnischen Kontext gibt „Danklied“ den Sinn natürlich wieder, ohne es mit dem folgenden αἴνεσις völlig gleichzusetzen.
- source_word: ἐν παντὶ Ἰσραήλ
  choice: in ganz Israel
  rationale: Die Formulierung bewahrt die mögliche geografische wie gemeinschaftliche Reichweite der griechischen Wendung.
- source_word: ὑπεφώνει
  choice: antwortete mit
  rationale: Das Verb bezeichnet ein antwortendes oder responsorisches Erklingen. „Antwortete mit“ macht diesen Wechselgesang verständlich, ohne ausdrücklich eine bestimmte liturgische Form vorauszusetzen.
- source_word: πᾶς ὁ λαὸς
  choice: das ganze Volk
  rationale: Direkte und idiomatische Wiedergabe des kollektiven Ausdrucks.
- source_word: αἴνεσιν
  choice: Lobpreis
  rationale: „Lobpreis“ gibt die an Gott gerichtete lobende Äußerung prägnant wieder und bleibt von „Danklied“ lexikalisch unterschieden.
- source_word: εἶπεν
  choice: sagte
  rationale: Schlichter deutscher Erzählausdruck zur Einleitung der unmittelbar folgenden Rede.
theological_decisions:
- issue: Verhältnis von ἐξομολόγησις und αἴνεσις
  choice: Als „Danklied“ und „Lobpreis“ unterschieden wiedergegeben
  alternative: Beide Wörter mit „Lob“ bzw. „Lobpreis“ wiedergeben oder ἐξομολόγησις als „Bekenntnis“ übersetzen
  rationale: Die beiden verschiedenen griechischen Substantive sollen nicht eingeebnet werden. Zugleich bezeichnet ἐξομολόγησις in diesem hymnischen Zusammenhang eher Danksagung bzw. öffentliches Gotteslob als ein Sündenbekenntnis.
- issue: Art der Antwort des Volkes
  choice: „antwortete mit diesem Lobpreis“
  alternative: „ließ diesen Lobpreis widerhallen“ oder „sang diesen Lobpreis als Antwort“
  rationale: Die gewählte Fassung erhält den responsorischen Sinn, legt aber weder bloßes akustisches Echo noch eine genau definierte liturgische Gesangsform fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stimmte … an“ und „antwortete mit“ ergeben einen natürlichen hymnischen Zusammenhang; die Fußnoten bewahren die Bedeutungsbreite und die mögliche responsorische Gestaltung.
