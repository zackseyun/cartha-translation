  terminology: „Bekenntnis“ und „Lobpreis“ erhalten die im Griechischen vorhandene lexikalische Unterscheidung zwischen ἐξομολόγησις und αἴνεσις. Der Name „Judit“ entspricht der etablierten deutschen Bibelschreibung.
