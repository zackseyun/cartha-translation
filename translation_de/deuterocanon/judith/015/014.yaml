revisions:
- from: Da liefen alle Frauen Israels zusammen, um sie zu sehen.[a] Sie priesen Judith und bildeten ihr zu Ehren aus ihrer Mitte einen Reigen. Judith nahm Thyrsosstäbe[b] in die Hände und gab sie den Frauen, die bei ihr waren.
  to: Da liefen alle Frauen Israels zusammen, um sie zu sehen.[a] Sie segneten Judith und bildeten für sie aus ihrer Mitte einen Reigen. Judith nahm Thyrsosstäbe[b] in ihre Hände und gab sie den Frauen, die bei ihr waren.
  rationale: Die Revision ersetzt die abschwächende Wiedergabe von εὐλόγησαν durch »segneten« und vermeidet mit »für sie« eine nicht ausdrücklich markierte Deutung des Dativs als Ehrenbezeugung. Das Possessivpronomen in »in ihre Hände« stellt den Bezug zu Judith klar. Alle übrigen Elemente einschließlich der Fußnoten bleiben sachgerecht erhalten.
