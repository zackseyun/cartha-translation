  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen im kollektiven Singular: »jede Frau Israels«.'
    reason: lexical_alternative
  - marker: b
    text: Thyrsosstäbe sind festliche Stäbe oder Ruten, die in der griechischen Welt bei Feiern und Umzügen getragen wurden.
    reason: cultural_note
lexical_decisions:
- source_word: συνέδραμεν
  choice: liefen … zusammen
  rationale: Das Verb bezeichnet ein rasches Zusammenlaufen aus verschiedenen Richtungen. Die lebendige Bewegung des griechischen Ausdrucks bleibt so erhalten.
- source_word: πᾶσα γυνὴ Ἰσραήλ
  choice: alle Frauen Israels
  rationale: Der griechische kollektive Singular wird im Deutschen idiomatisch als Plural wiedergegeben; die formale Besonderheit wird in Fußnote [a] dokumentiert.
- source_word: τοῦ ἰδεῖν αὐτήν
  choice: um sie zu sehen
  rationale: Der artikulierte Infinitiv drückt hier den Zweck des Zusammenlaufens aus.
- source_word: εὐλόγησαν αὐτήν
  choice: priesen Judith
  rationale: εὐλογέω kann sowohl »segnen« als auch »preisen« bedeuten. Im Zusammenhang des öffentlichen festlichen Empfangs ist »priesen« natürlich und bewahrt den ehrenden Sinn, ohne eine Segenshandlung zu unterstellen. Der Eigenname verhindert zudem eine missverständliche Folge mehrerer Pronomen.
- source_word: ἐποίησαν αὐτῇ χορὸν ἐξ αὐτῶν
  choice: bildeten ihr zu Ehren aus ihrer Mitte einen Reigen
  rationale: χορός bezeichnet hier eine Tanzgruppe beziehungsweise einen Reigentanz. »Aus ihrer Mitte« gibt wieder, dass die Frauen selbst den Reigen bildeten; »ihr zu Ehren« drückt die personale Widmung mit αὐτῇ natürlich aus.
- source_word: θύρσους
  choice: Thyrsosstäbe
  rationale: Die eindeutige deutsche Fachbezeichnung wahrt die kulturelle Besonderheit des Gegenstands; Fußnote [b] bietet eine knappe Erklärung, ohne eine im Text nicht genannte konkrete Ausgestaltung festzulegen.
- source_word: ταῖς γυναιξὶν ταῖς μετʼ αὐτῆς
  choice: den Frauen, die bei ihr waren
  rationale: Die Formulierung gibt die begleitenden Frauen schlicht und präzise wieder.
theological_decisions:
- issue: Bedeutung von εὐλόγησαν gegenüber Judith
  choice: priesen Judith
  alternative: segneten sie
  rationale: Beide Bedeutungen sind lexikalisch möglich. Der festliche Empfang und die Ehrung Judiths sprechen hier für »preisen«; damit wird nicht entschieden, dass die Frauen eine förmliche Segenshandlung vollzogen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lebhafte Erzählton wird durch »liefen … zusammen« bewahrt; »Reigen« und »Thyrsosstäbe« geben den festlichen und kulturellen Charakter präzise wieder, wobei der seltene Sachbegriff durch eine Fußnote erklärt wird.
