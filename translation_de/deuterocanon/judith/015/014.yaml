    issue: εὐλόγησαν ist mit »priesen« wiedergegeben.
    rationale: »Preisen« ist eine mögliche kontextuelle Annäherung, gibt aber die im griechischen Wort vorhandene Segensbedeutung nicht wieder. »Segneten sie« ist im biblisch-erzählenden Register verständlich und näher am Ausgangstext.
  - severity: low
    issue: »ihr zu Ehren« erweitert αὐτῇ.
    rationale: Der Dativ bedeutet zunächst »für sie/ihr«. Eine Ehrenabsicht ist im Kontext plausibel, wird aber nicht ausdrücklich bezeichnet; »für sie« wahrt die Offenheit des griechischen Ausdrucks.
