  text: And every woman of Israel ran together to see her[a], and they blessed her, and they made a dance for her from among themselves; and she took thyrsi in her hands and gave them to the women with her[b],
translation:
  language: de
  text: Da liefen alle Frauen Israels zusammen, um sie zu sehen.[a] Sie segneten Judith und bildeten für sie aus ihrer Mitte einen Reigen. Judith nahm Thyrsosstäbe[b] in ihre Hände und gab sie den Frauen, die bei ihr waren.
