lexical_decisions:
- source_word: ἐλαφύρευσεν
  choice: plünderte
  rationale: Das Verb bezeichnet das Erbeuten von Beutegut nach einem militärischen Sieg. „Plünderte“ ist im modernen Deutschen klar und bewahrt den militärischen Sinn.
- source_word: πᾶς ὁ λαός
  choice: das ganze Volk
  rationale: Die Wendung bezeichnet die Gesamtheit des Volkes beziehungsweise der versammelten Gruppe. „Das ganze Volk“ gibt den griechischen Ausdruck natürlich wieder, ohne ihn auf das Heer zu verengen.
- source_word: τὴν παρεμβολήν
  choice: das Lager
  rationale: παρεμβολή bezeichnet hier im militärischen Zusammenhang das feindliche Lager. „Das Lager“ ist prägnant und idiomatisch.
- source_word: ἐφʼ ἡμέρας τριάκοντα
  choice: dreißig Tage lang
  rationale: Die Präpositionalphrase drückt eine Zeitdauer aus. „Dreißig Tage lang“ ist eine natürliche und genaue deutsche Wiedergabe.
