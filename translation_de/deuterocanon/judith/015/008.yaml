base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/008.yaml
  text: And Joakim the high priest and the council of the sons of Israel[a], who dwelt in Jerusalem, came to see the good things that the Lord had done for Israel[b], and to see Judith and speak peaceably with her.
translation:
  language: de
  text: Und Joakim, der Hohepriester, und der Ältestenrat der Söhne Israels[a], die in Jerusalem wohnten, kamen, um all das Gute zu sehen, das der Herr für Israel getan hatte, und um Judit zu sehen und mit ihr friedlich zu sprechen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Israeliten«. Wörtlich steht im Griechischen »der Söhne Israels«, eine traditionelle Bezeichnung für das Volk.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Frieden mit ihr reden«. Gemeint sein kann, friedlich mit ihr zu sprechen, sie mit einem Friedensgruß zu begrüßen oder ihr in Frieden Glückwünsche auszusprechen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ἰωακειὶμ
  choice: Joakim
  rationale: Der Name wird entsprechend der griechischen Form transliteriert; eine Rückführung auf eine vermutete hebräische Namensform wird vermieden.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: der Hohepriester
  rationale: Dies ist die im Deutschen etablierte Bezeichnung für das oberste priesterliche Amt.
- source_word: ἡ γερουσία
  choice: der Ältestenrat
  rationale: Der Ausdruck bezeichnet das leitende Gremium der Ältesten. »Ältestenrat« gibt sowohl dessen Zusammensetzung als auch seine Funktion verständlich wieder.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  rationale: Die traditionelle, im Griechischen ausdrücklich familiär und maskulin formulierte Volksbezeichnung bleibt im Haupttext erhalten; die geläufigere Bedeutung »Israeliten« wird in der Fußnote genannt.
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: die in Jerusalem wohnten
  rationale: Der maskuline Plural kann sich grammatisch auf die miteinander verbundenen Personen beziehungsweise Gruppen beziehen. Die deutsche Relativkonstruktion bewahrt diese Zuordnung, ohne sie enger festzulegen.
- source_word: τὰ ἀγαθὰ
  choice: all das Gute
  rationale: Die substantivierte Mehrzahl bezeichnet umfassend die guten Taten, Wohltaten oder günstigen Ereignisse, die der Herr für Israel bewirkt hatte. »All das Gute« ist natürlich und legt die Art des Guten nicht vorschnell fest.
- source_word: Κύριος
  choice: der Herr
  rationale: Die herkömmliche deutsche Wiedergabe bezeichnet hier Gott als den Handelnden.
- source_word: τοῦ θεάσασθαι … τοῦ ἰδεῖν
  choice: um … zu sehen … und um … zu sehen
  rationale: Beide Infinitive drücken den Zweck ihres Kommens aus. Die parallele Formulierung bildet die Struktur des Griechischen ab.
- source_word: λαλῆσαι μετʼ αὐτῆς εἰρήνην
  choice: mit ihr Worte des Friedens zu reden
  rationale: Die Formulierung erhält das Substantiv »Frieden« und damit den semitisch geprägten Ausdruck, ist aber im Deutschen verständlicher als die ganz wörtliche Wendung »Frieden mit ihr reden«.
theological_decisions:
- issue: Wiedergabe von Κύριος
  choice: der Herr
  alternative: Herr
  rationale: Der bestimmte Artikel entspricht dem natürlichen deutschen Gottesbezug im Erzählzusammenhang, ohne über die Identität des Handelnden hinaus zusätzliche Deutung einzutragen.
- issue: Traditionelle Volksbezeichnung τῶν υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  alternative: der Israeliten
  rationale: Die wörtliche familiäre Bundesbezeichnung wird bewahrt, während die Fußnote klarstellt, dass damit kollektiv die Israeliten gemeint sind.
- issue: Bedeutung von λαλῆσαι μετʼ αὐτῆς εἰρήνην
  choice: mit ihr Worte des Friedens zu reden
  alternative: friedlich mit ihr zu sprechen
  rationale: Die gewählte Fassung bewahrt die theologisch und kulturell bedeutsame Friedenssprache, ohne festzulegen, ob vor allem ein friedliches Gespräch, ein Friedensgruß oder eine beglückwünschende Zusage gemeint ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Zweckkonstruktion bildet den griechischen Satzbau ab; idiomatische Glättung wird nur dort vorgenommen, wo eine streng wörtliche Fassung im Deutschen unverständlich wäre.
