  to: Als die Söhne Israels davon hörten,[a] stürzten sie sich alle gemeinsam auf sie und schlugen sie bis Choba immer weiter nieder. Ebenso trafen auch die Leute aus Jerusalem und aus dem ganzen Bergland ein; denn man hatte ihnen berichtet, was im Lager ihrer Feinde geschehen war. Und die in Gilead und in Galiläa überflügelten sie[b] mit einem heftigen Schlag,[c] bis sie an Damaskus und dessen Grenzen vorbeigezogen waren.
