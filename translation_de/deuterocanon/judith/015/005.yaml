base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/005.yaml
  text: But when the sons of Israel heard[a], they all together fell upon them and kept striking them down as far as Choba. Likewise, those from Jerusalem and from all the hill country also arrived, for the things that had happened in the camp of their enemies had been reported to them; and those in Gilead and those in Galilee outflanked them with a great slaughter[c][b], until they had passed Damascus and its borders.
translation:
  language: de
  text: Als die Söhne Israels davon hörten,[a] stürzten sie sich alle gemeinsam auf sie und schlugen sie bis Choba immer weiter nieder. Ebenso trafen auch die Leute aus Jerusalem und aus dem ganzen Bergland ein; denn man hatte ihnen berichtet, was im Lager ihrer Feinde geschehen war. Und die in Gilead und in Galiläa überflügelten sie[b] mit einem heftigen Schlag,[c] bis sie an Damaskus und dessen Grenzen vorbeigezogen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Wörtlich steht im Griechischen: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Verb kann hier auch bedeuten: „umgingen sie“, „gelangten über sie hinaus“ oder „schnitten ihnen den Weg ab“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „mit einem großen Schlag“. Im Kampfzusammenhang kann die Wendung einen schweren Schlag oder ein großes Blutbad bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  rationale: Bewahrt die konkrete griechische Verwandtschaftsbezeichnung und die maskuline Form; „die Israeliten“ wäre idiomatischer, aber weniger formnah.
- source_word: ὁμοθυμαδόν
  choice: alle gemeinsam
  rationale: Gibt das geschlossene, einmütige Handeln in natürlichem modernem Deutsch wieder.
- source_word: ἐπέπεσον ἐπʼ αὐτούς
  choice: stürzten sie sich ... auf sie
  rationale: Bewahrt die lebhafte, gewaltsame Bewegung des militärischen Ausdrucks.
- source_word: ἔκοπτον αὐτούς
  choice: schlugen sie ... immer weiter nieder
  rationale: Die Verlaufsform des Imperfekts wird durch „immer weiter“ als fortgesetztes Vorgehen kenntlich gemacht, ohne eine bestimmte Waffe vorauszusetzen.
- source_word: ἕως Χωβά
  choice: bis Choba
  rationale: Markiert Choba als räumliche Grenze der Verfolgung und transliteriert den Ortsnamen des griechischen Textes.
- source_word: οἱ ἐξ Ἰερουσαλήμ
  choice: die Leute aus Jerusalem
  rationale: Natürliche deutsche Wiedergabe einer substantivierten Herkunftsangabe ohne unnötige Festlegung auf ausschließlich männliche Beteiligte.
- source_word: ἐκ πάσης τῆς ὀρεινῆς
  choice: aus dem ganzen Bergland
  rationale: Gängige und verständliche geografische Bezeichnung für die gesamte Hochlandregion.
- source_word: παρεγενήθησαν
  choice: trafen ... ein
  rationale: Bezeichnet klar ihr Eintreffen am Ort des Geschehens.
- source_word: τὰ γεγονότα
  choice: was ... geschehen war
  rationale: Idiomat Setzt die griechische substantivierte Partizipialform natürlich um.
- source_word: τῇ παρεμβολῇ τῶν ἐχθρῶν αὐτῶν
  choice: im Lager ihrer Feinde
  rationale: Gibt den militärischen Sinn von παρεμβολή und das Possessivpronomen direkt wieder.
- source_word: ὑπερεκέρασαν αὐτούς
  choice: kamen ihnen zuvor
  rationale: Bewahrt den Grundgedanken, über die Verfolgten hinauszugelangen; die genaue taktische Nuance kann auch „umgingen“ oder „schnitten ihnen den Weg ab“ sein.
- source_word: πληγῇ μεγάλῃ
  choice: brachten ihnen eine schwere Niederlage bei
  rationale: Gibt die militärische Wirkung der wörtlichen Wendung „mit einem großen Schlag“ idiomatisch wieder, ohne ausdrücklich ein Massaker zu behaupten.
- source_word: ἕως οὗ παρῆλθον Δαμασκὸν καὶ τὰ ὅρια αὐτῆς
  choice: bis sie an Damaskus und dessen Grenzen vorbeigezogen waren
  rationale: Behält die grammatische Mehrdeutigkeit des nicht ausdrücklich genannten Subjekts von παρῆλθον bei und gibt die Bewegung über Damaskus samt Gebiet hinaus wieder.
