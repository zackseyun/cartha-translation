base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/006.yaml
  text: But the rest[a], those living in Bethulia, fell upon the camp of Assyria[c][b], and they pursued them and plundered it greatly.
translation:
  language: de
  text: Doch die übrigen Bewohner Betulias fielen über das Lager der Assyrer[a] her, verfolgten sie[b] und machten reiche Beute[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Lager Assurs“; gemeint ist das assyrische Lager.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Ausdruck lautet wörtlich: „sie zogen ihnen nach“; im Kampfzusammenhang bedeutet dies, dass sie sie verfolgten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „und sie plünderten sehr“. Möglich ist auch: „und sie nahmen sehr viel Beute“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ οἱ κατοικοῦντες Βαιτυλουὰ
  choice: Doch die übrigen Bewohner Betulias
  rationale: οἱ λοιποί bezeichnet die Übrigen beziehungsweise den verbleibenden Teil; δέ markiert hier den Übergang zur anderen Gruppe. Das substantivierte Partizip οἱ κατοικοῦντες wird im modernen Deutsch natürlich mit „Bewohner“ wiedergegeben.
- source_word: ἐπέπεσαν
  choice: fielen … her
  rationale: Das Verb bezeichnet hier einen plötzlichen feindlichen Angriff. „über … herfallen“ bewahrt die Anschaulichkeit und militärische Wucht des griechischen Ausdrucks.
- source_word: τῇ παρεμβολῇ Ἀσσούρ
  choice: über das Lager der Assyrer
  rationale: παρεμβολή bedeutet im militärischen Zusammenhang „Lager“. Das indeklinable Ἀσσούρ bezeichnet hier die assyrische Seite; „Lager der Assyrer“ ist idiomatisches Deutsch, während die formnähere Wiedergabe „Lager Assurs“ in der Fußnote erhalten bleibt.
- source_word: ἐπορεύοντο αὐτούς
  choice: verfolgten sie
  rationale: πορεύομαι bedeutet grundsätzlich „gehen/ziehen“; mit dem Personenbezug αὐτούς bezeichnet es in diesem Kampfzusammenhang das Nachsetzen hinter den Fliehenden. „verfolgten sie“ gibt die kontextuelle Bedeutung klar wieder.
- source_word: ἐλούτησαν σφόδρα
  choice: machten reiche Beute
  rationale: Das Verb bezeichnet Plündern beziehungsweise Beutemachen, und σφόδρα verstärkt die Aussage. Die deutsche Wendung ist natürlich und vermeidet es, ein im Griechischen nicht ausdrücklich genanntes Objekt einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lebhafte Wendung „über … herfallen“ bewahrt den plötzlichen Charakter des Angriffs; „machten reiche Beute“ gibt die starke Intensivierung idiomatisch wieder, ohne ein nicht ausdrücklich genanntes Objekt zu ergänzen.
