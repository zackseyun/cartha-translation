base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/003.yaml
  text: And those encamped in the hill country around Bethulia turned to flight[a]; then the sons of Israel, every man a warrior[c][b], poured out against them.
translation:
  language: de
  text: Auch die, die im Bergland rings um Betulia lagerten, wandten sich zur Flucht. Da ergossen sich die Söhne Israels, jeder Mann ein Krieger, gegen sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »rückten in Scharen gegen sie aus«.'
    reason: Die Fußnote nennt eine idiomatische deutsche Wiedergabe der metaphorischen Bewegungssprache von ἐξέχυθησαν ἐπʼ αὐτούς, während der Haupttext die Bildsprache bewahrt.
lexical_decisions:
- source_word: οἱ παρεμβεβληκότες
  choice: die, die … lagerten
  rationale: Das substantivierte Perfektpartizip bezeichnet die dort im Lager befindlichen oder stationierten Truppen; im Deutschen gibt die finite Form den bestehenden militärischen Zustand natürlich wieder.
- source_word: ἐν τῇ ὀρεινῇ
  choice: im Bergland
  rationale: ὀρεινή bezeichnet hier eine bergige Region und nicht einen einzelnen Berg.
- source_word: κύκλῳ Βαιτυλουὰ
  choice: rings um Betulia
  rationale: κύκλῳ mit dem Ortsnamen beschreibt das umliegende beziehungsweise umschließende Gebiet.
- source_word: ἐτράπησαν εἰς φυγήν
  choice: wandten sich zur Flucht
  rationale: Die Wendung bewahrt das anschauliche militärische Idiom des Griechischen, ohne ausdrücklich festzulegen, ob die Truppen selbst flohen oder in die Flucht geschlagen wurden.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die traditionelle, ausdrücklich männliche ethnische Bezeichnung des Ausgangstextes bleibt erhalten.
- source_word: πᾶς ἀνὴρ πολεμιστής
  choice: jeder wehrfähige Mann
  rationale: Die distributive Aussage und der männliche Bezug werden gewahrt; »wehrfähig« gibt im Kontext idiomatisch wieder, dass jeder Mann als Kämpfer auszog.
- source_word: ἐξέχυθησαν ἐπʼ αὐτούς
  choice: stürmten … gegen sie hinaus
  rationale: Die dynamische Bewegung des metaphorischen Passivs von ἐκχέω wird in natürlichem Deutsch wiedergegeben; die zugrunde liegende Vorstellung des Sich-Ergießens wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Geschlechtsspezifische ethnische und militärische Sprache
  choice: die Söhne Israels, jeder wehrfähige Mann
  alternative: die Israeliten, alle Kämpfer
  rationale: υἱοί und ἀνήρ sind ausdrücklich männlich formuliert. Die Übersetzung bewahrt diese Form, ohne darüber hinausgehende Aussagen über Geschlechterrollen einzutragen.
- issue: Agens beziehungsweise Nuance der Fluchtwendung
  choice: wandten sich zur Flucht
  alternative: wurden in die Flucht geschlagen / flohen
  rationale: Das griechische ἐτράπησαν kann in der militärischen Formel sowohl das Ergreifen der Flucht als auch das In-die-Flucht-Geschlagenwerden anklingen lassen; die Hauptfassung hält diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. »Betulia« folgt der im Deutschen etablierten Namensform. Die beiden Hauptsätze sind klar gegliedert; die militärische Dynamik bleibt erhalten, ohne die Mehrdeutigkeit der griechischen Fluchtwendung unnötig aufzulösen.
