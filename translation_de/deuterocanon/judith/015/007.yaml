lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἰσραήλ
  choice: die Israeliten
  rationale: Die griechische Wendung lautet wörtlich „die Söhne Israels“. „Die Israeliten“ gibt den semitisch geprägten Volksnamen im modernen Standarddeutsch natürlich und eindeutig wieder; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: ἀναστρέψαντες
  choice: kehrten ... zurück
  rationale: Das Partizip bezeichnet hier die Rückkehr vom Kampfgeschehen und wird als finite, koordinierte Aussage natürlich ins Deutsche übertragen.
- source_word: ἀπὸ τῆς κοπῆς
  choice: vom Niedermetzeln
  rationale: κοπή bezeichnet in diesem militärischen Zusammenhang das gewaltsame Niederhauen beziehungsweise Töten. „Niedermetzeln“ bewahrt die konkrete Härte des Ausdrucks, ohne ihn zu einem technisch bestimmten Ereignis umzudeuten.
- source_word: ἐκυρίευσαν τῶν λοιπῶν
  choice: bemächtigten sich dessen, was noch übrig war
  rationale: κυριεύω mit Genitiv bezeichnet das Erlangen von Herrschaft oder Verfügungsgewalt. Das neutrale τῶν λοιπῶν lässt offen, ob vor allem verbliebene Menschen, Sachen oder beides gemeint sind; die deutsche Fassung bewahrt diese Offenheit.
- source_word: αἱ κῶμαι καὶ ἐπαύλεις
  choice: die Dörfer und Gehöfte
  rationale: κῶμαι sind Dörfer; ἐπαύλεις bezeichnet ländliche Wohnstätten, Anwesen oder kleinere Ansiedlungen. „Gehöfte“ ist im Kontext klar und gegenwärtig verständlich, ohne größere Ortschaften zu suggerieren.
- source_word: ἐν τῇ ὀρεινῇ καὶ πεδινῇ
  choice: im Bergland und in der Ebene
  rationale: Die substantivierten Gebietsbezeichnungen meinen die bergige Region und das flache Land. „Bergland“ und „Ebene“ sind präzise, geläufige geografische Ausdrücke.
- source_word: ἐκράτησαν πολλῶν λαφύρων
  choice: brachten viel Beute an sich
  rationale: κρατέω mit Genitiv bedeutet hier ergreifen oder in Besitz bekommen; λάφυρα ist Kriegsbeute. Die Wendung ist natürliches Deutsch und hält den militärischen Zusammenhang fest.
- source_word: ἦν γὰρ πλῆθος πολὺ σφόδρα
  choice: denn sie war überaus reichlich vorhanden
  rationale: Das Pronomen „sie“ nimmt die Beute auf. „Überaus reichlich“ gibt die starke Häufung von πλῆθος, πολύ und σφόδρα idiomatisch und mit erhaltener Emphase wieder.
