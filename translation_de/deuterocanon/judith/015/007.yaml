  to: Die Israeliten[a] aber kehrten vom Gemetzel zurück und bemächtigten sich dessen, was noch übrig war. In den Dörfern und Gehöften[b] im Bergland und in der Ebene machte man viel Beute[c], denn es gab davon überaus viel.
