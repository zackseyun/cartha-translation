  naturalness: Die erste Satzhälfte ist gut verständlich. „Vom Niedermetzeln“ wirkt allerdings sprachlich holprig, und „Dörfer und Gehöfte ... brachten viel Beute an sich“ weist im modernen Deutsch in unpassender Weise unbelebten Orten eine Handlung zu. Die überarbeitete Fassung löst die Metonymie mit dem unpersönlichen „machte man“ auf.
  terminology: „Israeliten“, „Gehöfte“, „Bergland“, „Ebene“ und „Beute“ sind passende moderne Standardbegriffe. Die Fußnote zu „Gehöfte“ sollte nicht „ländliche Ansiedlungen“ als gleichrangige Alternative zu ἐπαύλεις darstellen, da das Wort vorrangig ländliche Wohnsitze bzw. Anwesen bezeichnet.
