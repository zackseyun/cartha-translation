base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/009.yaml
  text: And when they entered to her[a], they all with one accord blessed her and said to her, “You are the exaltation of Jerusalem, you are the great boast of Israel[b], you are the great glory of our people.”
translation:
  language: de
  text: 'Als sie aber zu ihr hineinkamen, segneten sie sie alle einmütig und sagten zu ihr: »Du bist die hohe Ehre Jerusalems[a], du bist Israels großer Stolz, du bist der große Ruhm unseres Volkes[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Höhe Jerusalems« oder »Jerusalems Erhöhung«. Das griechische Wort bezeichnet Höhe oder Erhebung; die Aussage kann auch den Ruhm meinen, durch den Jerusalem erhöht wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der große Grund zum Rühmen unseres Volkes«. Das griechische Substantiv kann den Ruhm selbst oder den Anlass zum Rühmen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: zu ihr eintraten
  rationale: Die Wendung bewahrt sowohl die Eintrittsbewegung von εἰσέρχομαι als auch die auf Judith gerichtete Bewegung von πρός und klingt im Deutschen natürlich.
- source_word: εὐλόγησαν
  choice: priesen
  rationale: εὐλογέω kann »segnen« oder »lobend preisen« bedeuten. Da unmittelbar eine feierliche Ehrenrede folgt, gibt »priesen« die konkrete Handlung im gegenwärtigen deutschen Sprachgebrauch klar wieder.
- source_word: πάντες ὁμοθυμαδόν
  choice: alle einmütig
  rationale: Die Formulierung erhält sowohl die Gesamtheit (πάντες) als auch die geschlossene Übereinstimmung (ὁμοθυμαδόν).
- source_word: ὕψωμα
  choice: Erhöhung
  rationale: »Erhöhung« bewahrt das Bild des Hochseins beziehungsweise Erhobenwerdens und vermeidet, den Ausdruck vorschnell auf »Ruhm« oder »Stolz« einzuengen.
- source_word: γαυρίαμα
  choice: großer Stolz
  rationale: Das Substantiv bezeichnet das, worüber man jubelt oder worauf man stolz ist. »Israels großer Stolz« ist im Deutschen idiomatisch und erhält den Charakter öffentlicher Anerkennung.
- source_word: καύχημα
  choice: großer Ruhm
  rationale: καύχημα kann »Ruhm«, »Gegenstand des Rühmens« oder »Grund zum Rühmen« bedeuten. »Ruhm« wahrt die feierliche Steigerung und unterscheidet den Ausdruck sprachlich von γαυρίαμα.
- source_word: τοῦ γένους ἡμῶν
  choice: unseres Volkes
  rationale: γένος bezeichnet hier die gemeinsame Abstammungs- und Volksgemeinschaft. »Unser Volk« ist modern und verständlich, ohne die missverständlichen heutigen Nebenbedeutungen von »Rasse«.
theological_decisions:
- issue: Ehrenvolle, gemeinschaftliche Würdigung Judiths durch staats- und volksbezogene Titel
  choice: Die drei Prädikate werden als feierliche öffentliche Würdigung in paralleler Form wiedergegeben.
  alternative: Die Aussagen zu bloßen Komplimenten wie »Jerusalem ist stolz auf dich« abschwächen.
  rationale: Der griechische Text stellt Judith unmittelbar als Erhöhung, Stolz und Ruhm der Gemeinschaft dar. Diese starke Aussage wird beibehalten, ohne daraus eine weitergehende lehrmäßige Behauptung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit feierlicher Parallelstruktur. »Priesen« vermeidet die im heutigen Deutsch missverständliche Vorstellung, die Männer hätten Judith rituell gesegnet, und entspricht der folgenden Lobpreisung. Die bewusst markante Formulierung »Erhöhung Jerusalems« erhält das Höhenbild des griechischen Textes; die Fußnote bietet die wesentliche Bedeutungsbreite.
