  yaml_path: translation/deuterocanon/judith/015/013.yaml
  text: And they gave Judith the tent of Holofernes[a], and all the silver vessels, and the couches, and the utensils, and all his furnishings. And she took them and placed them on her mule, and harnessed her wagons[b], and piled them on them.
translation:
  language: de
  text: Und sie gaben Judit das Zelt des Holofernes, alle silbernen Gegenstände, die Liegen, die Zeltausstattung[a] und all sein Gerät. Sie nahm sie, legte sie auf ihr Maultier, spannte ihre Wagen an und häufte sie darauf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Zeltausstattung“ wiedergegebene griechische Wort (ὅλκια) ist selten und in seiner Bedeutung unsicher; möglicherweise sind insbesondere Behänge oder anderes Zeltzubehör gemeint.
    reason: lexical_alternative
  - marker: b
    text: Die Gegenstände wurden offenbar auf die Wagen gehäuft; die aufeinander bezogenen Fürwörter im Griechischen sind knapp formuliert.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνήν
  choice: Zelt
  rationale: Die gewöhnliche Bedeutung ist ein Reise- oder Heerlagerzelt; im Zusammenhang handelt es sich um die Feldunterkunft des Holofernes.
- source_word: ἀργυρώματα
  choice: silberne Gegenstände
  rationale: Der Ausdruck bezeichnet aus Silber gefertigte Gegenstände, ohne sie auf Gefäße oder Besteck einzugrenzen.
- source_word: κλίνας
  choice: Liegen
  rationale: κλίνη kann Bett oder Ruhe- beziehungsweise Speiseliege bedeuten. „Liegen“ bewahrt diese Offenheit.
- source_word: ὅλκια
  choice: Zeltausstattung
  rationale: Das seltene und unsichere Wort bezeichnet hier wahrscheinlich bewegliche Ausstattungsstücke oder Zubehör des Zeltes; die Übersetzung bleibt bewusst weit.
- source_word: σκευάσματα
  choice: Hausrat
  rationale: Der breite Ausdruck bezeichnet hergestellte Gebrauchs- und Ausstattungsgegenstände. „Hausrat“ passt zur beweglichen Ausstattung, ohne rein militärische Ausrüstung vorauszusetzen.
- source_word: ἡμίονον
  choice: Maultier
  rationale: Die Form bezeichnet ein Maultier, möglicherweise genauer ein weibliches Tier; das Geschlecht ist im Deutschen hier nicht bedeutsam.
- source_word: ἔζευξεν
  choice: spannte ... an
  rationale: Das Verb bedeutet anschirren oder anspannen und wird im Deutschen idiomatisch mit Wagen verbunden.
- source_word: ἁμάξας
  choice: Wagen
  rationale: Gemeint sind Transportfahrzeuge auf Rädern; „Wagen“ ist natürlich und lässt deren genaue Bauart offen.
- source_word: ἐσώρευσεν
  choice: häufte
  rationale: Das Verb bezeichnet das Aufhäufen oder Stapeln und bewahrt das konkrete Bild des griechischen Textes.
