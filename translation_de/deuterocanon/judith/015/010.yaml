base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/010.yaml
  text: You have done all these things by your hand[a]; you have done good things for Israel, and God has been pleased with them[b]. May you be blessed by the Almighty Lord forever.
translation:
  language: de
  text: Du hast all dies mit deiner Hand vollbracht; du hast Israel Gutes getan[a], und Gott fand daran Gefallen[b]. Sei vom allmächtigen Herrn für immer gesegnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Du hast Gutes mit Israel getan.« Im Zusammenhang bezeichnet die Wendung wahrscheinlich ein Handeln zum Wohl Israels.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gott fand an ihnen Gefallen«; das griechische Pronomen kann sich auf die guten Taten oder, weniger wahrscheinlich, auf die Israeliten beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησας πάντα ταῦτα ἐν χειρί σου
  choice: Du hast all dies mit deiner Hand vollbracht
  rationale: Das Perfekt fasst die vollbrachten Taten mit ihrer gegenwärtigen Bedeutung zusammen. »Mit deiner Hand« bewahrt das anschauliche instrumentale Bild; »vollbracht« passt im Deutschen besser zu der zusammenfassenden Würdigung als ein zweimaliges »getan«.
- source_word: ἐποίησας τὰ ἀγαθὰ μετὰ Ἰσραήλ
  choice: du hast Israel Gutes getan
  rationale: Das substantivierte τὰ ἀγαθά wird als »Gutes« wiedergegeben. μετά bedeutet gewöhnlich »mit«, kann in dieser Verbindung jedoch das Handeln zugunsten Israels ausdrücken; die gewählte Formulierung ist natürlich und lässt sich aus dem Zusammenhang gut begründen.
- source_word: εὐδόκησεν ἐπʼ αὐτοῖς ὁ θεός
  choice: und Gott fand daran Gefallen
  rationale: »Gefallen finden an« gibt εὐδοκέω mit ἐπί idiomatisch wieder. »Daran« bezieht sich im Haupttext am ehesten auf das zuvor genannte Gute, ohne die mögliche andere Beziehung des griechischen Pronomens im Fußnotentext zu verschweigen.
- source_word: εὐλογημένη γίνου
  choice: Sei … gesegnet
  rationale: Der Imperativ mit prädikativem Adjektiv ist eine Segensformel. »Sei gesegnet« bewahrt ihre performative und wunschhafte Kraft in würdigem, natürlichem Deutsch.
- source_word: παρὰ τῷ παντοκράτορι κυρίῳ
  choice: vor dem allmächtigen Herrn
  rationale: παρά mit Dativ bezeichnet hier am ehesten die Gegenwart beziehungsweise das Angesicht Gottes. »Vor dem allmächtigen Herrn« wahrt diese räumlich-relationale Nuance; eine instrumentale Deutung wird als Alternative vermerkt.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: auf ewig
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. »Auf ewig« ist knapp, feierlich und im modernen Standarddeutsch verständlich.
theological_decisions:
- issue: Wiedergabe von κύριος als göttlicher Titel
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« ist die etablierte und kontextgerechte Wiedergabe des göttlichen Titels; »Gebieter« würde die Titelfunktion unnötig abschwächen oder verschieben.
- issue: Kraft der Segensformel εὐλογημένη γίνου
  choice: Sei … gesegnet
  alternative: Mögest du … gesegnet sein
  rationale: Die griechische Imperativform wird unmittelbar bewahrt, klingt im Segenskontext aber nicht wie ein gewöhnlicher Befehl, sondern wie ein feierlicher Zuspruch.
- issue: Bezug von ἐπʼ αὐτοῖς
  choice: auf das von Judit für Israel vollbrachte Gute
  alternative: auf Israel beziehungsweise die Israeliten
  rationale: Der nächstliegende grammatische Bezug ist τὰ ἀγαθά; da αὐτοῖς formal auch auf eine als Personengruppe verstandene Größe bezogen werden kann, bleibt die weniger wahrscheinliche Alternative in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Ton. Die Wiederholung von ἐποίησας bleibt durch »vollbracht« und »getan« erkennbar, ohne im Deutschen schwerfällig zu wirken. Die echten Mehrdeutigkeiten bei μετά, dem Pronomen αὐτοῖς und παρά werden nicht dogmatisch aufgelöst, sondern im Haupttext sinnvoll gewichtet und in Fußnoten offengelegt.
