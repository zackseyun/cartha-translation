base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/004.yaml
  text: And Uzziah sent men to Bethomesthaim and Choba and Chola, and to all the territory of Israel, to report what had happened, and that all should rush out against the enemies for their destruction.
translation:
  language: de
  text: Und Usija sandte Boten nach Betomesthaim, Choba und Chola sowie in das ganze Gebiet Israels. Sie sollten melden, was geschehen war, damit alle gegen die Feinde ausströmen[a], um sie zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ausgegossen werden“. Gemeint ist, dass alle in großer Zahl gegen die Feinde hinausziehen.'
    reason: Das griechische Sprachbild wird im Haupttext möglichst bewahrt und in der Fußnote erläutert.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Das übliche, würdevolle deutsche Erzählverb gibt den Aorist präzise und natürlich wieder.
- source_word: Ὀζίας
  choice: Usija
  rationale: Gebräuchliche deutsche Namensform; sie entspricht der biblischen deutschen Namenstradition, ohne die ältere latinisierte Form „Ozias“ zu übernehmen.
- source_word: Βαιτομασθαΐμ
  choice: Betomesthaim
  rationale: Nahe Umschrift der in Swetes griechischem Text bezeugten, in deutscher Sprache nicht sicher konventionalisierten Ortsbezeichnung.
- source_word: Χωβὰι
  choice: Choba
  rationale: Nahe Umschrift der griechischen Ortsbezeichnung; die Überlieferung der Namensform schwankt.
- source_word: Χωλὰ
  choice: Chola
  rationale: Direkte und lesbare Umschrift der griechischen Ortsbezeichnung.
- source_word: πᾶν ὅριον Ἰσραήλ
  choice: das ganze Gebiet Israels
  rationale: ὅριον bezeichnet hier den territorialen Bereich, nicht lediglich eine Grenzlinie.
- source_word: τοὺς ἀπαγγέλλοντας
  choice: Boten … Sie sollten melden
  rationale: Das substantivierte Partizip bezeichnet die ausgesandten Überbringer der Nachricht. Die Aufteilung in zwei Sätze ist im Deutschen klar und bewahrt ihre Funktion.
- source_word: ὑπὲρ τῶν συντετελεσμένων
  choice: was geschehen war
  rationale: Die Wendung bezeichnet die bereits vollendeten Ereignisse; das deutsche Plusquamperfekt wahrt diesen zeitlichen Bezug.
- source_word: ἵνα πάντες ἐκχυθῶσιν
  choice: alle sollten … ausströmen
  rationale: Die bildhafte Passivform bedeutet wörtlich ein Ausgegossenwerden und beschreibt hier, wie Menschen in großer Zahl zum Angriff hinausziehen. „Ausströmen“ erhält das Bild und ist im Kontext verständlich.
- source_word: τοῖς πολεμίοις
  choice: gegen die Feinde
  rationale: Der Dativ bezeichnet zusammen mit der Bewegungsrichtung das feindliche Vorgehen gegen die Gegner.
- source_word: εἰς τὴν ἀναίρεσιν αὐτῶν
  choice: um sie zu vernichten
  rationale: Im militärischen Zusammenhang bezeichnet ἀναίρεσις die gewaltsame Beseitigung bzw. Vernichtung. Der deutsche Zwecksatz gibt εἰς natürlich wieder, ohne die Art der Tötung zusätzlich auszumalen.
theological_decisions:
- issue: Gewaltsprache in einer militärischen Erzählung
  choice: um sie zu vernichten
  alternative: zu ihrer Vernichtung / um sie niederzumachen
  rationale: Der griechische Text nennt ausdrücklich die Vernichtung der Feinde als Ziel. Die Übersetzung bewahrt diese Härte, ohne sie abzuschwächen oder durch „niedermachen“ beziehungsweise „abschlachten“ noch zu steigern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die langen griechischen Satzglieder werden zur Klarheit auf zwei deutsche Sätze verteilt. Die seltenen Ortsnamen werden eng am griechischen Text transliteriert; die militärische Gewaltsprache bleibt ungemildert erhalten.
