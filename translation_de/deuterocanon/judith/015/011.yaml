  text: And all the people said, “Amen.”
translation:
  language: de
  text: 'Und das ganze Volk sagte: »So sei es.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γένοιτο
  choice: So sei es
  rationale: 'Der griechische Optativ drückt Zustimmung in Form eines Wunsches aus: »Möge es geschehen / So sei es.« Anders als ἀμήν ist Γένοιτο hier nicht das Lehnwort »Amen«; die Übersetzung bewahrt die Form und Bedeutung des griechischen Ausgangstextes.'
theological_decisions:
- issue: Wiedergabe der gemeinschaftlichen Zustimmung Γένοιτο
  choice: So sei es
  alternative: Amen
  rationale: »Amen« gibt die Funktion idiomatisch wieder, würde aber die klare lexikalische Unterscheidung zwischen Γένοιτο und ἀμήν verdecken. »So sei es« erhält sowohl den Zustimmungscharakter als auch die Wunschform, ohne zusätzliche konfessionelle Deutung.
translation_notes:
  register: Kurzer, würdevoller und unmittelbar verständlicher Satz. »Das ganze Volk« entspricht πᾶς ὁ λαός; die einleitende Verbindung καί wird mit »Und« beibehalten.
