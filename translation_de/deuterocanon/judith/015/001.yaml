  text: Und als die, die in den Zelten waren, davon hörten, gerieten sie über das Geschehene außer sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Die einfache Verknüpfung wahrt den fortlaufenden Erzählfluss, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: ὡς
  choice: als
  rationale: Mit dem Aorist ἤκουσαν leitet ὡς hier einen temporalen Nebensatz ein; „als“ ist im Deutschen natürlich und behauptet nicht ausdrücklich die Unmittelbarkeit von „sobald“.
- source_word: ἤκουσαν
  choice: davon hörten
  rationale: Das Verb bezeichnet unmittelbar das Hören; das idiomatische „davon“ nimmt die Nachricht über das anschließend genannte Geschehen auf, ohne „erfuhren“ als stärker interpretierende Wiedergabe zu wählen.
- source_word: οἱ ἐν τοῖς σκηνώμασιν ὄντες
  choice: die Menschen in den Zelten
  rationale: Die substantivierte Partizipialfügung bezeichnet die in den Zelten Befindlichen. „Menschen“ vermeidet eine im Griechischen nicht ausdrücklich vorhandene Festlegung auf Männer und klingt natürlicher als „diejenigen, die sich … befanden“.
- source_word: σκηνώμασιν
  choice: Zelten
  rationale: Im militärischen Lagerzusammenhang ist „Zelte“ die sachlich passende und allgemein verständliche Wiedergabe; „Wohnstätten“ wäre zu unbestimmt, „Stiftshütten“ irreführend.
- source_word: ἐξέστησαν
  choice: gerieten sie außer sich
  rationale: ἐξίστημι kann eine starke Erschütterung bis hin zum Außer-sich-Geraten bezeichnen. Die Formulierung bewahrt diese Intensität besser als das schwächere „staunten“, ohne die Reaktion eindeutig nur als Verwirrung oder nur als Verwunderung festzulegen.
- source_word: ἐπὶ τὸ γεγονός
  choice: über das, was geschehen war
  rationale: Die Wendung bezieht sich auf das eingetretene Geschehen; der deutsche Plusquamperfekt gibt dessen Vorzeitigkeit gegenüber ihrer Reaktion natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssigem Erzählrhythmus. Die starke, semantisch offene Reaktion in ἐξέστησαν bleibt erhalten; weder bloßes Erstaunen noch ausschließlich panische Verwirrung wird festgeschrieben.
