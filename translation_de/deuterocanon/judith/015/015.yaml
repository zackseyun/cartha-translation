base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/015.yaml
  text: And they crowned her with an olive wreath[a], she and the women with her. And she went before all the people in the dance, leading all the women, and every man of Israel followed, armed[b], with wreaths and with hymns in their mouths.
translation:
  language: de
  text: Und sie selbst und die Frauen bei ihr bekränzten sich mit Olivenzweigen[a]. Dann schritt sie vor dem ganzen Volk im Reigen[b] her und führte alle Frauen an; alle Männer Israels folgten, bewaffnet, mit Kränzen und Lobgesängen auf den Lippen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Sie bekränzten sich mit der Olive.“ Die mittlere Verbform besagt, dass Judith und die Frauen bei ihr sich selbst schmückten; gemeint sind wahrscheinlich Olivenzweige oder daraus geflochtene Kränze.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „tanzend“ beziehungsweise „in einem Tanzzug“. Das griechische Wort kann sowohl den Tanz als auch einen geordneten Chor- oder Reigentanz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστεφανώσαντο
  choice: sie bekränzten
  rationale: Das Verb bezeichnet das Schmücken mit einem Kranz. „Bekränzten“ gibt den festlichen Vorgang präziser wieder als das im Deutschen leicht königlich verstandene „krönten“.
- source_word: τὴν ἐλαίαν
  choice: mit einem Olivenkranz
  rationale: Wörtlich steht „die Olive“; im Zusammenhang mit στεφανόω ist wahrscheinlich ein Kranz aus Olivenzweigen gemeint. Die idiomatische Wiedergabe macht die implizite Sache verständlich, ohne königliche Symbolik einzutragen.
- source_word: αὐτὴ καὶ αἱ μετʼ αὐτῆς
  choice: sie selbst und die Frauen bei ihr
  rationale: Die feminine Form und der folgende Bezug auf alle Frauen zeigen, dass Judith und ihre Begleiterinnen gemeinsam bekränzt wurden.
- source_word: προῆλθεν παντὸς τοῦ λαοῦ
  choice: zog sie vor dem ganzen Volk einher
  rationale: Die Formulierung beschreibt Judiths Vorangehen an der Spitze der öffentlichen Prozession, ohne unnötig einen Aufbruch aus einem bestimmten Ort anzudeuten.
- source_word: ἐν χορείᾳ
  choice: im Reigentanz
  rationale: χορεία kann einen Tanz, besonders einen gemeinschaftlich geordneten Chortanz, oder die entsprechende Formation bezeichnen. „Reigentanz“ wahrt sowohl die tänzerische als auch die prozessionsartige Dimension.
- source_word: ἡγουμένη πασῶν τῶν γυναικῶν
  choice: führte alle Frauen an
  rationale: Die partizipiale Wendung beschreibt Judith ausdrücklich als Anführerin der Frauen in der Prozession.
- source_word: ἐνωπλισμένοι
  choice: bewaffnet
  rationale: Das Partizip bedeutet unmittelbar, dass die israelitischen Männer Waffen trugen beziehungsweise gerüstet waren.
- source_word: μετὰ στεφάνων
  choice: mit Kränzen
  rationale: Im Siegesfest sind festliche oder Siegeskränze gemeint, nicht Königskronen.
- source_word: ὕμνων ἐν τῷ στόματι αὐτῶν
  choice: mit Lobgesängen auf den Lippen
  rationale: Die deutsche Wendung bewahrt das konkrete Bild des griechischen Textes und gibt ὕμνοι als feierliche Lobgesänge wieder.
