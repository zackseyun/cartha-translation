lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: errichtete
  rationale: Das Verb bezeichnet hier die bauliche Errichtung der Befestigung; „errichtete“ ist natürlich, präzise und stilistisch würdig.
- source_word: ἐπʼ Ἐκβατάνων
  choice: in Ekbatana
  rationale: Die Präpositionalverbindung bezeichnet den Ort der Befestigung. Wegen der gedrängten griechischen Formulierung bleibt auch eine Wiedergabe wie „bei Ekbatana“ möglich.
- source_word: κύκλῳ τείχη
  choice: ringsum Mauern
  rationale: κύκλῳ drückt die rings um die Stadt verlaufende Anlage aus; der Plural τείχη wird als „Mauern“ bewahrt.
- source_word: λίθων λελαξευμένων
  choice: aus behauenen Steinen
  rationale: Das Partizip bezeichnet durch Hauen oder Zuschneiden bearbeitete Steine; „behauen“ ist im Deutschen der übliche Ausdruck für Werkstein.
- source_word: εἰς πλάτος πηχῶν τριῶν
  choice: drei Ellen breit
  rationale: Die Maßangabe wird knapp und idiomatisch wiedergegeben, ohne ausdrücklich festzulegen, ob sie sich auf einzelne Steine oder auf die Bauausführung bezieht.
- source_word: εἰς μῆκος πηχῶν ἕξ
  choice: sechs Ellen lang
  rationale: Die parallele Längenangabe wird in natürlicher deutscher Maßsyntax wiedergegeben.
- source_word: ἐποίησεν τὸ ὕψος τοῦ τείχους πηχῶν ἑβδομήκοντα
  choice: Er machte die Mauer siebzig Ellen hoch
  rationale: Diese Formulierung gibt den Bauvorgang und die Höhenangabe idiomatisch wieder.
- source_word: καὶ τὸ
  choice: und das …
  rationale: Der bereitgestellte griechische Text bricht nach dem bestimmten Artikel ab. Die Übersetzung kennzeichnet den unvollständigen Satz, ohne fehlenden Inhalt aus einer anderen Ausgabe zu ergänzen.
