base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/012.yaml
  text: And Nebuchadnezzar became very angry with all this land[a], and he swore by his throne and his kingdom that he would surely avenge himself on all the territories of Cilicia and Damascus and Syria, and put them to the sword—along with all who lived in Moab and the Ammonites and all Idumea and all those in Egypt[b]—until one came to the borders of the two seas.
translation:
  language: de
  text: Da geriet Nebukadnezar über dieses ganze Land in heftigen Zorn. Er schwor bei seinem Thron und seinem Königtum, er werde gewiss an allen Gebieten Kilikiens, von Damaskus und Syriens Rache nehmen[a] und deren Bewohner mit dem Schwert töten, ebenso alle Bewohner Moabs, die Ammoniter, alle Bewohner Idumäas und alle Menschen in Ägypten – bis er an die Grenzen der beiden Meere gelangte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher lautet die Schwurformel: »wenn er nicht Rache nehmen wird«. Im Griechischen drückt sie hier einen nachdrücklichen, eidlich bekräftigten Entschluss aus.'
    reason: lexical_alternative
  - marker: b
    text: Beim griechischen Infinitiv »gelangen« ist das Subjekt nicht ausdrücklich genannt. »Die beiden Meere« bezeichnet vermutlich die Meere, welche die hier vorgestellte Region begrenzen.
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: ἐθυμώθη ... σφόδρα
  choice: geriet ... in heftigen Zorn
  rationale: Gibt den Zustandswechsel und die Verstärkung durch σφόδρα in natürlichem, würdigem Deutsch wieder.
- source_word: κατὰ τοῦ θρόνου καὶ τῆς βασιλείας αὐτοῦ
  choice: bei seinem Thron und seinem Königtum
  rationale: κατά bezeichnet hier im Zusammenhang mit ὤμοσεν das, wobei geschworen wird. »Königtum« bezeichnet sachgerecht seine Königsherrschaft, nicht lediglich ein geografisches Reich.
- source_word: εἰ μὴ ἐκδικήσει
  choice: er werde gewiss ... Rache nehmen
  rationale: Die Konstruktion ist eine emphatische Schwurformel; »gewiss« vermittelt ihren bekräftigenden Sinn, ohne sie als gewöhnliche negative Bedingung misszuverstehen.
- source_word: πάντα τὰ ὅρια
  choice: alle Gebiete
  rationale: ὅρια meint hier metonymisch die durch Grenzen bestimmten Territorien, nicht nur Grenzlinien.
- source_word: Κιλικίας καὶ Δαμασκηνῆς καὶ Συρίας
  choice: Kilikiens, von Damaskus und Syriens
  rationale: Bewahrt die dreigliedrige Ortsliste; bei Damaskus ist der bloße Ortsname am natürlichsten mit »von« anzuschließen.
- source_word: ἀνελεῖν τῇ ῥομφαίᾳ
  choice: mit dem Schwert töten
  rationale: Gibt die gewaltsame Tötung direkt und verständlich wieder, ohne sie durch eine gehobene deutsche Redewendung abzuschwächen.
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: die Ammoniter
  rationale: Die natürliche deutsche Volksbezeichnung entspricht dem semitisch geprägten Ausdruck »Söhne Ammons«.
- source_word: Ἰδουμαίαν
  choice: Idumäa
  rationale: Folgt der griechischen geografischen Namensform und vermeidet eine unbegründete Angleichung an »Edom«.
- source_word: ἕως τοῦ ἐλθεῖν
  choice: bis er ... gelangte
  rationale: Die Konstruktion bezeichnet den Endpunkt der angekündigten Ausdehnung. Das im Zusammenhang naheliegende Subjekt ist Nebukadnezar, auch wenn es beim Infinitiv nicht ausdrücklich genannt wird.
theological_decisions:
- issue: Schwurformel εἰ μὴ nach ὤμοσεν
  choice: 'als bekräftigter Schwurinhalt: »er werde gewiss«'
  alternative: 'wörtlich: »wenn er nicht / es sei denn, er nähme Rache«'
  rationale: Die griechische Schwurformel hat asseverative Kraft. Eine rein konditionale Wiedergabe wäre im Deutschen missverständlich; die Fußnote bewahrt zugleich die Form des Ausgangstextes.
- issue: Nicht ausdrücklich genanntes Subjekt von ἐλθεῖν
  choice: »bis er ... gelangte« mit Bezug auf Nebukadnezar
  alternative: 'unpersönlich: »bis man ... gelangte« beziehungsweise räumlich: »bis zu den Grenzen«'
  rationale: Der Erzählzusammenhang legt Nebukadnezar als handelndes Subjekt nahe, doch die Fußnote weist auf die grammatische Offenheit hin und vermeidet eine dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Historische Eigennamen folgen der griechischen Überlieferungsform. Die Härte der angekündigten Gewalt und die ungewöhnliche Schwurformel werden nicht geglättet; grammatische und geografische Unsicherheiten erscheinen in den Fußnoten.
