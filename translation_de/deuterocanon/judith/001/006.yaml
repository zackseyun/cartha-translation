  yaml_path: translation/deuterocanon/judith/001/006.yaml
  text: And all who lived in the hill country joined him[a], and all who lived along the Euphrates and the Tigris and the Hydaspes, and in the plain of Ariok king of the Elymaeans[c][b]. And many nations assembled for battle with the sons of Cheleoul.
translation:
  language: de
  text: Und alle Bewohner des Berglands schlossen sich ihm an[a], ebenso alle, die am Euphrat, am Tigris und am Hydaspes wohnten, sowie in der Ebene des Ariok, des Königs der Elymäer[b]. Und viele Völker versammelten sich zum Kampf gegen die Söhne Cheleouls[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann wörtlicher auch „begegneten ihm“ oder „kamen ihm entgegen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Satzbau ist hier schwierig; möglich ist auch, „Ariok, König der Elymäer“, als selbstständige Bezeichnung neben der Ortsangabe zu verstehen.
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: Wörtlich steht hier „zu einer Schlachtordnung“. Der Ausdruck bezeichnet eine zum Kampf aufgestellte Formation; die Verbindung kann auch als „zur Schlachtordnung der Söhne Cheleouls“ verstanden werden.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: συνήντησαν πρὸς αὐτόν
  choice: schlossen sich ihm an
  rationale: Das Verb bedeutet wörtlich „begegneten ihm“ oder „kamen ihm entgegen“. Im militärisch-politischen Zusammenhang liegt ein Anschluss an seine Seite nahe; die Fußnote bewahrt die neutralere Grundbedeutung.
- source_word: οἱ κατοικοῦντες τὴν ὀρεινήν
  choice: die Bewohner des Berglands
  rationale: Das substantivierte ὀρεινή bezeichnet eine bergige Region. „Bergland“ ist natürlich, knapp und geografisch offen.
- source_word: οἱ κατοικοῦντες τὸν Εὐφράτην καὶ τὸν Τίγριν καὶ τὸν Ὑδάσπην
  choice: alle, die am Euphrat, am Tigris und am Hydaspes wohnten
  rationale: Bei Flussnamen gibt „am“ die griechische Konstruktion im Deutschen idiomatisch wieder, ohne ein engeres Gebiet zu bestimmen.
- source_word: πεδίῳ Ἀριὼχ ὁ βασιλεὺς Ἐλυμαίων
  choice: im Gebiet des Ariok, des Königs der Elymäer
  rationale: Der überlieferte griechische Wortlaut ist syntaktisch schwierig und möglicherweise gestört. „Gebiet“ gibt πεδίον weniger eng als „Ebene“ wieder und verbindet Ariok vorsichtig mit dem Ort; seine Bezeichnung als König der Elymäer bleibt erhalten.
- source_word: Ἐλυμαίων
  choice: Elymäer
  rationale: Die Form bezeichnet die Bewohner von Elymais und wird nicht ohne Weiteres mit dem umfassenderen biblischen Volksnamen „Elamiter“ gleichgesetzt.
- source_word: συνῆλθον ἔθνη πολλὰ
  choice: viele Völker versammelten sich
  rationale: Die kollektive Zusammenkunft wird im militärischen Kontext klar und nah am griechischen Wortlaut wiedergegeben.
- source_word: εἰς παράταξιν
  choice: zur Schlachtordnung
  rationale: παράταξις bezeichnet das Aufstellen beziehungsweise die Formation zum Kampf. „Schlachtordnung“ erhält den militärischen Fachsinn und die nominale Form.
- source_word: υἱῶν Χελεούλ
  choice: der Söhne Cheleouls
  rationale: Die formale Wiedergabe bewahrt die mögliche Bedeutung als leibliche Nachkommen, Clan- oder Volksbezeichnung, ohne sie auf „Truppen“ festzulegen.
