translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung des griechischen Textes bleibt erkennbar, wird aber durch „ebenso“ und „sowie“ lesbar gegliedert. Die schwer verständliche Ortsangabe und die mögliche Ziel- oder Zugehörigkeitsrelation bei υἱῶν Χελεούλ werden nicht stillschweigend vereindeutigt, sondern in Fußnoten offengelegt.
