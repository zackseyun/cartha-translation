  to: Und alle Bewohner des Berglands schlossen sich ihm an[a], ebenso alle, die am Euphrat, am Tigris und am Hydaspes wohnten, sowie in der Ebene des Ariok, des Königs der Elymäer[b]. Und viele Völker versammelten sich zum Kampf gegen die Söhne Cheleouls[c].
