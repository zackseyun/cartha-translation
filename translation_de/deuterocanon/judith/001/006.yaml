  - severity: medium
    issue: „zur Schlachtordnung der Söhne Cheleouls“ legt eine Zugehörigkeit der Schlachtordnung zu den Söhnen Cheleouls nahe.
    rationale: Im gegebenen militärischen Kontext wird εἰς παράταξιν υἱῶν Χελεούλ besser als Aufbruch bzw. Versammlung zum Kampf gegen diese Gruppe verstanden. Die alternative Deutung kann in einer Fußnote genannt werden, darf aber den Haupttext nicht in die weniger wahrscheinliche Richtung lenken.
