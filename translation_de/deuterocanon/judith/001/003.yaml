lexical_decisions:
- source_word: πλάτος αὐτοῦ πηχῶν πεντήκοντα
  choice: Es war fünfzig Ellen breit
  rationale: Die knappe griechische Maßangabe setzt den Satzbau des vorhergehenden Verses fort. Die deutsche Formulierung gibt die Breite natürlich wieder und bewahrt die antike Maßeinheit.
- source_word: πύργους
  choice: Türme
  rationale: Gemeint sind neutral und ohne unnötige architektonische Spezifizierung Befestigungstürme.
- source_word: ἔστησεν
  choice: errichtete
  rationale: Im Bauzusammenhang bezeichnet das Verb das Aufstellen beziehungsweise Bauen der Türme; „errichtete“ ist präzise und würdig.
- source_word: ἐπὶ ταῖς πύλαις αὐτῆς
  choice: an ihren Toren
  rationale: ἐπί mit Dativ kann eine Lage an oder auf etwas bezeichnen. „An ihren Toren“ bleibt räumlich zurückhaltend und liest sich im Deutschen natürlich.
- source_word: πηχῶν ἑκατόν
  choice: hundert Ellen hohe
  rationale: Das Griechische nennt nur das Maß; der Bezug auf die Höhe der Türme ist im Kontext impliziert und wird für klares Deutsch ausdrücklich gemacht.
- source_word: ἐθεμελίωσεν εἰς πήχεις ἑξήκοντα
  choice: ihre Fundamente legte er sechzig Ellen breit an
  rationale: Das Verb bezeichnet das Gründen beziehungsweise Legen eines Fundaments. Die leicht entfaltete Formulierung macht den stark verkürzten griechischen Ausdruck verständlich, ohne das Maß umzurechnen.
