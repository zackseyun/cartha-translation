  verdict: revise
  source_fidelity: Die Wiedergabe der Fundamenttiefe ist als kontextuelle Deutung vertretbar und wird zutreffend durch eine Fußnote abgesichert. Die militärischen Begriffe „Auszüge“, „Streitmacht“, „starke Männer“, „Aufstellungen“ und „Fußsoldaten“ bilden die verdichtete griechische Formulierung insgesamt angemessen ab. Die Zweckbestimmung bezieht sich jedoch im Griechischen auf die Tore beziehungsweise Toranlage, nicht auf die unmittelbar zuvor genannte „Breite“.
  naturalness: Der Entwurf ist überwiegend modernes, würdiges Deutsch. Der Satz „Sie waren ... bestimmt“ hat allerdings aufgrund des unmittelbar vorausgehenden femininen Substantivs „Breite“ einen irreführenden beziehungsweise semantisch unmöglichen Bezug. Eine zusammengezogene Beschreibung der Tore beseitigt diese Unklarheit und ist flüssiger.
  terminology: „Ellen“ ist für πήχεις passend. „Streitmacht seiner starken Männer“ erhält die im Griechischen unterscheidbaren Begriffe δύναμις und δυνατοί, ohne sie unnötig zu harmonisieren. „Aufstellungen seiner Fußsoldaten“ ist eine sachgerechte Wiedergabe von διατάξεις τῶν πεζῶν αὐτοῦ.
