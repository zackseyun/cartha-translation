  text: He laid its foundation to a depth of sixty cubits[a], and he made its gates, gates raised to a height of seventy cubits, and its width forty cubits, for the departures of the force of his mighty men and the formations of his foot soldiers.
translation:
  language: de
  text: Er legte ihr Fundament sechzig Ellen tief[a] und errichtete ihre Tore siebzig Ellen hoch und vierzig Ellen breit, für die Auszüge der Streitmacht seiner starken Männer und für die Aufstellungen seiner Fußsoldaten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Maßangabe nennt die Dimension nicht ausdrücklich. Im Zusammenhang mit dem Fundament liegt die Wiedergabe als Tiefe nahe.
    reason: textliche Mehrdeutigkeit der Maßangabe
lexical_decisions:
- source_word: ἐθεμελίωσεν εἰς πήχεις ἑξήκοντα
  choice: legte ihr Fundament sechzig Ellen tief
  rationale: Das Verb bezeichnet das Legen eines Fundaments. Die Maßangabe wird im Zusammenhang natürlich als Tiefe verstanden; „sechzig Ellen tief“ ist klar und bewahrt den baulichen Sinn.
- source_word: πύλας διεγειρμένας
  choice: Tore ließ er … aufragen
  rationale: Die Formulierung gibt das Bild des Emporhebens bzw. Aufragens wieder, ohne es auf das bloße Adjektiv „hoch“ zu reduzieren.
- source_word: εἰς ὕψος πηχῶν ἑβδομήκοντα
  choice: bis zu einer Höhe von siebzig Ellen
  rationale: Direkte und verständliche Wiedergabe der Höhenangabe.
- source_word: τὸ πλάτος αὐτῆς πήχεις τεσσεράκοντα
  choice: ihre Breite betrug vierzig Ellen
  rationale: Die knappe Maßangabe wird in natürlichem modernem Deutsch wiedergegeben; das feminine Pronomen bezieht sich am ehesten auf die Toranlage bzw. die Tore.
- source_word: εἰς ἐξόδους
  choice: für die Auszüge
  rationale: „Auszüge“ bewahrt den Grundsinn des Hinausziehens und lässt zugleich den militärischen Zusammenhang erkennen, ohne zwingend auf „Ausfälle“ festgelegt zu sein.
- source_word: δυνάμεως δυνατῶν αὐτοῦ
  choice: der Streitmacht seiner starken Männer
  rationale: 'Die beiden verwandten, aber getrennten griechischen Ausdrücke werden auch im Deutschen getrennt abgebildet: δύναμις als militärische Streitmacht und δυνατοί als starke bzw. kampftüchtige Männer.'
- source_word: διατάξεις τῶν πεζῶν αὐτοῦ
  choice: die Aufstellungen seiner Fußsoldaten
  rationale: διατάξεις bezeichnet hier militärische Anordnungen oder Formationen; „Aufstellungen“ bewahrt die Sachbedeutung, „Fußsoldaten“ gibt πεζοί allgemeinverständlich wieder.
