lexical_decisions:
- source_word: ἐκυρίευσεν τῶν πόλεων αὐτοῦ
  choice: er bemächtigte sich seiner Städte
  rationale: κυριεύω mit Genitiv bezeichnet das Erlangen von Herrschaft oder Gewalt. „Sich bemächtigen“ passt zum militärischen Zusammenhang, ohne eine längerfristige Regierung vorauszusetzen; αὐτοῦ bleibt als „seiner“ erhalten.
- source_word: ἀφίκετο ἕως Ἐκβατάνων
  choice: drang er bis Ekbatana vor
  rationale: ἀφικνέομαι bezeichnet das Gelangen oder Ankommen, während ἕως die erreichte Ausdehnung markiert. „Drang … vor“ gibt im Feldzugskontext die Bewegung natürlich wieder; „Ekbatana“ ist die übliche deutsche Namensform.
- source_word: ἐκράτησεν τῶν πύργων
  choice: nahm dort die Türme ein
  rationale: κρατέω mit Genitiv kann gewaltsames Ergreifen oder Inbesitznehmen bezeichnen. „Nahm … ein“ ist im militärischen Kontext idiomatisch; „dort“ bindet die Türme eindeutig an Ekbatana.
- source_word: ἐπρονόμευσε
  choice: plünderte
  rationale: Das Verb bezeichnet das Erbeuten beziehungsweise Plündern und behauptet nicht mehr Zerstörung, als der griechische Text ausdrücklich sagt.
- source_word: τὰς πλατείας αὐτῆς
  choice: die breiten Straßen
  rationale: πλατεῖαι sind breite Straßen oder öffentliche Freiflächen einer Stadt. „Breite Straßen“ bewahrt den spezifischeren Sinn und bleibt im modernen Deutsch verständlich.
- source_word: τὸν κόσμον αὐτῆς
  choice: die Pracht der Stadt
  rationale: κόσμος bezeichnet hier Schmuck, Zierde oder sichtbare Pracht, nicht die Welt. Die explizite Formulierung „der Stadt“ vermeidet ein missverständliches deutsches Pronomen.
- source_word: ἔθηκεν εἰς ὄνειδος
  choice: machte … zur Schande
  rationale: Die Wendung bezeichnet das Verwandeln in einen Gegenstand der Schmach oder Schande. Die Formulierung bewahrt den rhetorischen Gegensatz zwischen Pracht und Schande.
