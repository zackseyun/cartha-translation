base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/009.yaml
  text: and all those in Samaria and its cities[a], and beyond the Jordan as far as Jerusalem, and Batane and Chelous and Kadesh and the river of Egypt, and Taphnas and Rameses and all the land of Goshen[b],
translation:
  language: de
  text: und alle in Samaria und seinen Städten und alle jenseits des Jordans bis hin zu Jerusalem, Battanä, Chelus, Kadesch und dem Fluss Ägyptens[a] und Tafnas[b], Ramses und dem ganzen Land Goschen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Bach Ägyptens“ oder „Wadi Ägyptens“. Im griechischen Text steht „Fluss“ (ποταμός); die traditionelle Bezeichnung dieses Grenzgewässers wird unterschiedlich wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Tafnas ist die griechische Namensform des Ortes, der auch als Tachpanhes bekannt ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντας τοὺς ἐν Σαμαρείᾳ
  choice: alle in Samaria
  rationale: Die im Griechischen elliptische Personenbezeichnung wird im Deutschen ebenso knapp wiedergegeben; „alle“ bewahrt die umfassende Bedeutung von πάντας, ohne die Personengruppe näher zu bestimmen.
- source_word: ταῖς πόλεσιν αὐτῆς
  choice: seinen Städten
  rationale: Das Pronomen bezieht sich auf Samaria. „Seinen Städten“ ist im modernen Deutschen natürlich und gibt die Zugehörigkeit der umliegenden Städte wieder.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: jenseits des Jordans
  rationale: Die Wendung bewahrt die räumliche Perspektive von πέραν und entspricht einer verständlichen deutschen geografischen Ausdrucksweise.
- source_word: ἕως Ἰερουσαλήμ
  choice: bis nach Jerusalem
  rationale: ἕως bezeichnet hier die räumliche Erstreckung; bei einem Ortsnamen ist „bis nach“ idiomatisches Deutsch.
- source_word: Βαττανὴ
  choice: Battanä
  rationale: Der unsicher identifizierte Ortsname wird konservativ nach seiner griechischen Form transkribiert, statt mit Baschan gleichgesetzt zu werden.
- source_word: Χελούς
  choice: Chelus
  rationale: Wegen der unsicheren Identifizierung wird der griechische Ortsname direkt in einer im Deutschen lesbaren Form wiedergegeben.
- source_word: Κάδης
  choice: Kadesch
  rationale: „Kadesch“ ist die geläufige deutsche Form dieses biblischen Ortsnamens.
- source_word: τοῦ ποταμοῦ Αἰγύπτου
  choice: zum Fluss Ägyptens
  rationale: ποταμός bedeutet ausdrücklich „Fluss“. Die Übersetzung folgt daher dem griechischen Wortlaut, während die in der Bibeltradition verbreitete Deutung als Bach oder Wadi in einer Fußnote erhalten bleibt.
- source_word: Τάφνας
  choice: Tafnas
  rationale: Der Name wird unmittelbar aus der griechischen Form in deutsche Schreibweise übertragen; die aus der hebräischen Überlieferung bekannte Namensform wird in der Fußnote genannt.
- source_word: Ραμεσσὴ
  choice: Ramses
  rationale: „Ramses“ ist die geläufige deutsche Namensform und entspricht dem Referenten der griechischen Form.
- source_word: πᾶσαν γῆν Γέσεμ
  choice: das ganze Land Goschen
  rationale: „Goschen“ ist die vertraute deutsche Form des biblischen Gebietsnamens; „das ganze Land“ gibt πᾶσαν γῆν vollständig wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Standardstil in Fortsetzung eines längeren Satzes. Die Reihung des griechischen Textes bleibt erkennbar, wird aber durch „sowie“ leicht gegliedert. Unsicher identifizierte Ortsnamen werden nicht harmonisierend aufgelöst. Die Fußnotenmarker stehen bei den jeweils tatsächlich erläuterten Ausdrücken.
