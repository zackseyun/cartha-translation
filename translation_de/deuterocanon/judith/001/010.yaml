  text: as far as Tanis and Memphis[a], and all those inhabiting Egypt, as far as the borders of Ethiopia.
translation:
  language: de
  text: bis hin nach Tanis und Memphis[a] und zu allen Bewohnern Ägyptens bis an die Grenzen Äthiopiens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich wiederholt das Griechische vor beiden geografischen Grenzangaben eine Wendung wie „bis zum Kommen nach/zu“. Im Deutschen wird sie sinngemäß mit „bis hin nach“ beziehungsweise „bis an“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως τοῦ ἐλθεῖν
  choice: bis hin nach / bis an
  rationale: Die Konstruktion ἕως τοῦ mit Infinitiv bezeichnet hier jeweils eine räumliche Grenze. Die idiomatischen deutschen Wendungen bewahren diese Bedeutung, ohne das im Deutschen schwerfällige „bis zum Kommen“ wörtlich nachzubilden.
- source_word: ἐπάνω
  choice: nach
  rationale: Vor den Ortsnamen bezeichnet ἐπάνω in diesem Zusammenhang die Bewegung bis zu diesen Orten; „nach“ ist dafür im Deutschen natürlich.
- source_word: Τάνεως
  choice: Tanis
  rationale: „Tanis“ ist die etablierte deutsche Form des ägyptischen Ortsnamens.
- source_word: Μέμφεως
  choice: Memphis
  rationale: „Memphis“ ist die etablierte deutsche Form des Ortsnamens.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Αἴγυπτον
  choice: zu allen Bewohnern Ägyptens
  rationale: Das substantivierte Partizip bezeichnet sämtliche Menschen, die in Ägypten wohnen. Das ergänzte „zu“ macht den Anschluss an die vorausgehende Aufzählung von Zielorten und Adressaten im Deutschen verständlich.
- source_word: ἐπὶ τὰ ὅρια
  choice: bis an die Grenzen
  rationale: ὅρια bezeichnet territoriale Grenzlinien oder Grenzgebiete; „bis an die Grenzen“ ist eine natürliche geografische Formulierung.
- source_word: Αἰθιοπίας
  choice: Äthiopiens
  rationale: Die griechische Bezeichnung Αἰθιοπία wird mit ihrer etablierten deutschen Namensform wiedergegeben; eine Gleichsetzung mit „Kusch“ wird nicht in den Text eingetragen.
