  text: And Nebuchadnezzar king of the Assyrians sent to all who lived in Persia and to all who lived toward the west—to those living in Cilicia and Damascus[a], Lebanon and Anti-Lebanon, and to all who lived along the seacoast—
translation:
  language: de
  text: Und Nebukadnezar, der König der Assyrer, sandte zu allen Bewohnern Persiens und zu allen, die westwärts wohnten – zu den Bewohnern Kilikiens, von Damaskus, des Libanon und des Antilibanon sowie zu allen, die an der Küste wohnten –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte Boten
  rationale: Das griechische Verb bedeutet „sandte“, lässt das Objekt aber unausgesprochen. Da ein solches absolutes „senden“ im heutigen Deutschen unnatürlich wäre, wird das aus dem Zusammenhang erschlossene „Boten“ ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: ἐπὶ πάντας τοὺς κατοικοῦντας
  choice: zu allen Bewohnern / zu allen, die … wohnten
  rationale: ἐπί bezeichnet hier bei ἀποστέλλω die Richtung zu den Empfängern, nicht eine feindliche Bewegung gegen sie. Die wechselnde deutsche Formulierung hält die Wiederholung erkennbar, ohne schwerfällig zu wirken.
- source_word: τὴν Περσίδα
  choice: Persien
  rationale: „Persien“ ist die geläufige moderne deutsche Bezeichnung für die gemeinte Region.
- source_word: πρὸς δυσμαῖς
  choice: in Richtung Westen
  rationale: Die Formulierung bewahrt die räumliche Ausrichtung des griechischen πρὸς und legt den Ausdruck nicht unnötig als fest umrissene Regionsbezeichnung aus.
- source_word: κατοικοῦντας τὴν Κιλικίαν
  choice: den Bewohnern Kilikiens
  rationale: Diese natürliche deutsche Wendung gibt das Wohnen in Kilikien präzise wieder.
- source_word: Δαμασκόν
  choice: Damaskus
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: τὸν Λίβανον καὶ Ἀντιλίβανον
  choice: des Libanon und des Antilibanon
  rationale: Die beiden Namen bezeichnen die einander gegenüberliegenden Gebirgszüge; „Antilibanon“ ist die etablierte deutsche geografische Form.
- source_word: κατὰ πρόσωπον παραλίας
  choice: entlang der Meeresküste
  rationale: Die Wendung bezeichnet diejenigen, die im Küstenbereich beziehungsweise an der dem Meer zugewandten Seite wohnen. „Entlang der Meeresküste“ ist klar und bewahrt die geografische Ausdehnung.
