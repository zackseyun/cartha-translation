  source_fidelity: 'Die Übersetzung gibt die Abfolge und die militärischen Verben des griechischen Textes insgesamt präzise wieder: ἔλαβε als Gefangennahme, κατηνάγκισεν als gewaltsames Überwältigen, σιβύναις als Wurfspieße und ἐξωλέθρευσεν als Vernichten. Der Ortsname „Ragau“ folgt zutreffend dem vorgelegten griechischen Text. Die Schlussformel ἕως τῆς ἡμέρας ἐκείνης sollte jedoch mit „bis zu jenem Tag“ wiedergegeben werden; „bis auf jenen Tag“ bedeutet im heutigen Deutsch gewöhnlich „mit Ausnahme jenes Tages“ und kehrt damit den Zeitsinn um.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „Bis zu jenem Tag“ ist die idiomatische und zugleich eng am griechischen Demonstrativ orientierte Formulierung. Die inhaltlich auffällige Verbindung mit „vernichtete“ wird nicht harmonisierend verändert.
  terminology: „Arphaxad“, „Ragau“, „Wurfspießen“ und „vernichtete“ sind angemessen. Die Fußnote erklärt die alternative traditionelle Ortsnamensform sachlich und ohne eine abweichende Lesart zu behaupten.
