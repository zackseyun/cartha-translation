lexical_decisions:
- source_word: ἔλαβε
  choice: nahm … gefangen
  rationale: Im militärischen Zusammenhang bezeichnet das Verb die Gefangennahme des besiegten Gegners; die Wendung ist im Deutschen klarer als das unspezifische „nahm“.
- source_word: ἐν τοῖς ὄρεσι
  choice: im Bergland
  rationale: Der griechische Plural bezeichnet die gebirgige Gegend, in der die Gefangennahme stattfand. „Im Bergland“ ist natürliches Deutsch und wahrt den räumlichen Sinn.
- source_word: Ῥαγαῦ
  choice: Ragau
  rationale: Der Ortsname wird entsprechend der in Swetes griechischem Text bezeugten Form Ῥαγαῦ wiedergegeben, statt die Form einer anderen Texttradition zu übernehmen.
- source_word: κατηνάγκισεν
  choice: überwältigte
  rationale: Das Verb drückt gewaltsames Bezwingen oder Niederzwingen aus. „Überwältigte“ passt zum Kampfgeschehen, ohne die konkrete Art des Vorgangs über den Text hinaus festzulegen.
- source_word: σιβύναις
  choice: Wurfspießen
  rationale: σιβύνη bezeichnet einen leichten Speer beziehungsweise eine wurfspeerartige Waffe. „Wurfspieße“ bewahrt das konkrete Waffenbild.
- source_word: ἐξωλέθρευσεν
  choice: vernichtete
  rationale: Das Verb bezeichnet vollständige Zerstörung und ist stärker als „tötete“. „Vernichtete“ gibt diese Intensität knapp und würdig wieder.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: bis auf jenen Tag
  rationale: Die Formulierung bewahrt sowohl die Zeitangabe ἕως als auch die rückweisende Kraft von ἐκείνης. Die ungewöhnliche Spannung der Aussage wird nicht stillschweigend als „bis heute“ umgedeutet.
