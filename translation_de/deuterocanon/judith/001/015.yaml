  text: And he captured Arphaxad in the mountains of Ragau[a], and overpowered him with his javelins, and destroyed him to this day.
translation:
  language: de
  text: Und er nahm Arphaxad im Bergland von Ragau[a] gefangen, überwältigte ihn mit seinen Wurfspießen und vernichtete ihn bis zu jenem Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rages“, eine in manchen Übersetzungen traditionell verwendete Form des Ortsnamens; der griechische Text hat hier „Ragau“.'
