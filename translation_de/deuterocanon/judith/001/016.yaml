  text: And he returned with them, he himself and his force, for one hundred twenty days.
translation:
  language: de
  text: Und er kehrte mit ihnen zurück, er selbst und seine Streitmacht, für hundertzwanzig Tage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für hundertzwanzig Tage“. Das Griechische nennt die Dauer, ohne ausdrücklich ein Verb wie „blieb“ oder eine Ortsangabe wie „dort“ hinzuzufügen.'
    reason: Die Fußnote erläutert die im Deutschen markierte, eng am griechischen Wortlaut gehaltene Dauerangabe und vermeidet eine ungesicherte Festlegung auf einen Aufenthalt.
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: kehrte … zurück
  rationale: Der Aorist von ἀναστρέφω bezeichnet hier im erzählenden Zusammenhang die Rückkehr.
- source_word: μετʼ αὐτῶν
  choice: mit ihnen
  rationale: μετά mit dem Genitiv drückt Begleitung aus.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrückliche Pronomen hebt die Person des Heerführers gegenüber beziehungsweise zusammen mit seiner Streitmacht hervor.
- source_word: ἡ δύναμις αὐτοῦ
  choice: seine Streitmacht
  rationale: δύναμις bezeichnet im militärischen Kontext eine bewaffnete Truppe; „Streitmacht“ ist im Deutschen natürlich und wahrt den kollektiven Sinn.
- source_word: ἐφʼ ἡμέρας ἑκατὸν εἴκοσι
  choice: und blieb hundertzwanzig Tage dort
  rationale: ἐπί mit dem Akkusativ bezeichnet eine Zeitdauer. Im Zusammenhang wird diese Dauer idiomatisch auf den Aufenthalt nach der Rückkehr bezogen; die Ergänzungen „blieb“ und „dort“ sind im Griechischen nicht ausdrücklich vorhanden und werden deshalb durch eine Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Wiederaufnahme „er selbst und seine Streitmacht“ bleibt trotz ihrer markierten Syntax erhalten; die Zeitangabe wird für gewöhnliche Leser idiomatisch erschlossen und transparent erläutert.
