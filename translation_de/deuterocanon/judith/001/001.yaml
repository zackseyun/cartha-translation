base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/001.yaml
  text: In the twelfth year of the reign of Nebuchadnezzar[a], who reigned over the Assyrians in Nineveh, the great city, in the days of Arphaxad, who reigned over the Medes in Ecbatana,
translation:
  language: de
  text: Im zwölften Jahr der Herrschaft Nebukadnezars, der in Ninive, der großen Stadt, über die Assyrer herrschte, in den Tagen Arphaxads, der in Ekbatana über die Meder herrschte, und[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz wird im nächsten Vers unmittelbar fortgesetzt; deshalb endet dieser Vers mit „und“.
    reason: Die ungewöhnliche, aber quelltextgetreue offene Satzstruktur an der Versgrenze bedarf einer kurzen Erklärung.
lexical_decisions:
- source_word: ἜΤΟΥΣ δωδεκάτου τῆς βασιλείας
  choice: Im zwölften Jahr der Herrschaft
  rationale: Die griechische Datierungsformel wird in natürliches, zugleich feierliches Deutsch übertragen; βασιλεία bezeichnet hier die Dauer beziehungsweise Ausübung der Königsherrschaft.
- source_word: Ναβουχοδονοσόρ
  choice: Nebukadnezar
  rationale: Die im Deutschen geläufige biblische Namensform gewährleistet Wiedererkennbarkeit.
- source_word: ὃς ἐβασίλευσεν Ἀσσυρίων
  choice: der … über die Assyrer herrschte
  rationale: Der Genitiv Ἀσσυρίων bezeichnet das Volk, über das er herrschte; die verbale Form des griechischen Ausdrucks bleibt erhalten.
- source_word: ἐν Νινευῇ τῇ πόλει τῇ μεγάλῃ
  choice: in Ninive, der großen Stadt
  rationale: Die Apposition wird eng am Griechischen und in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: ἐν ταῖς ἡμέραις Ἀρφαξάδ
  choice: in den Tagen Arphaxads
  rationale: Die traditionelle zeitgeschichtliche Wendung bewahrt den literarischen Ton der Vorlage.
- source_word: ὃς ἐβασίλευσεν Μήδων
  choice: der … über die Meder herrschte
  rationale: Μήδων ist ein Genitiv Plural und bezeichnet unmittelbar das Volk, über das Arphaxad herrschte.
- source_word: ἐν Ἐκβατάνοις
  choice: in Ekbatana
  rationale: Die übliche deutsche Form des Ortsnamens und die lokale Bedeutung der Präposition werden beibehalten.
- source_word: καὶ
  choice: und
  rationale: Das abschließende καὶ wird ausdrücklich übersetzt, da der griechische Satz über die Versgrenze hinweg weitergeht; so wird die syntaktische Unabgeschlossenheit nicht verdeckt.
