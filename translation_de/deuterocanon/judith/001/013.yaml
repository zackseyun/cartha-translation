  text: And in the seventeenth year he drew up his forces for battle against King Arphaxad, and he prevailed in his war, and routed all the force of Arphaxad, all his cavalry, and all his chariots,
translation:
  language: de
  text: Im siebzehnten Jahr stellte er seine Streitmacht zur Schlacht gegen König Arphaxad auf. In seinem Krieg gewann er die Oberhand und schlug die gesamte Streitmacht Arphaxads, seine ganze Reiterei und alle seine Streitwagen in die Flucht.
