lexical_decisions:
- source_word: παρετάξατο ἐν τῇ δυνάμει αὐτοῦ
  choice: stellte er seine Streitmacht … zur Schlacht auf
  rationale: Das Medium von παρατάσσω bezeichnet im militärischen Zusammenhang das Aufstellen von Truppen zur Schlacht; δύναμις meint hier die Streitmacht, nicht abstrakte Macht.
- source_word: πρὸς Ἀρφαξὰδ βασιλέα
  choice: König Arphaxad gegenüber
  rationale: πρός bezeichnet hier die feindliche Ausrichtung gegen den König. Die Formulierung verbindet sich im Deutschen natürlich mit dem Aufstellen zur Schlacht.
- source_word: ἐκραταιώθη ἐν τῷ πολέμῳ αὐτοῦ
  choice: In seinem Krieg gewann er die Oberhand
  rationale: ἐκραταιώθη bedeutet wörtlich, dass er stark beziehungsweise überlegen wurde. Im Kriegsbericht gibt ‚gewann die Oberhand‘ den militärischen Erfolg wieder, ohne bereits den folgenden Satzteil vorwegzunehmen.
- source_word: ἀνέστρεψεν
  choice: schlug … in die Flucht
  rationale: Das Verb bezeichnet hier das Zurückwenden beziehungsweise Zurücktreiben der feindlichen Truppen. ‚In die Flucht schlagen‘ ist eine klare und natürliche militärische Entsprechung.
- source_word: πᾶσαν τὴν δύναμιν Ἀρφαξὰδ
  choice: die gesamte Streitmacht Arphaxads
  rationale: δύναμις bezeichnet erneut die militärischen Kräfte; der deutsche Genitiv bewahrt die Zugehörigkeit zu Arphaxad.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: seine ganze Reiterei
  rationale: Der kollektive Singular ἵππος, wörtlich ‚Pferd‘, bezeichnet im militärischen Kontext die berittenen Truppen.
- source_word: πάντα τὰ ἅρματα αὐτοῦ
  choice: alle seine Streitwagen
  rationale: ἅρματα bezeichnet hier die im Krieg eingesetzten Wagen; ‚Streitwagen‘ ist im Deutschen eindeutiger als das allgemeinere ‚Wagen‘.
