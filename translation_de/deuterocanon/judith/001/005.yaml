base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/005.yaml
  text: And in those days King Nebuchadnezzar made war against King Arphaxad in the great plain[a], that is, in the territory of Ragae.
translation:
  language: de
  text: In jenen Tagen führte König Nebukadnezzar Krieg gegen König Arphaxad in der großen Ebene, das heißt im Gebiet von Ragau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in den Grenzen von Ragau«; auch möglich: »im Grenzgebiet von Ragau«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν πόλεμον
  choice: führte … Krieg
  rationale: Die griechische Wendung bedeutet wörtlich »machte Krieg«. »führte Krieg« ist die entsprechende natürliche und zugleich genaue deutsche Redewendung.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: In jenen Tagen
  rationale: Die geläufige deutsche Zeitangabe gibt die griechische Wendung unmittelbar wieder.
- source_word: βασιλεὺς Ναβουχοδονοσόρ
  choice: König Nebukadnezzar
  rationale: βασιλεύς wird als Titel »König« wiedergegeben; für den Namen wird die im Deutschen etablierte biblische Form »Nebukadnezzar« verwendet.
- source_word: πρὸς βασιλέα Ἀρφαξάδ
  choice: gegen König Arphaxad
  rationale: Im Zusammenhang mit Krieg bezeichnet πρός die feindliche Ausrichtung; »gegen« gibt diesen Sinn idiomatisch wieder.
- source_word: ἐν τῷ πεδίῳ τῷ μεγάλῳ
  choice: in der großen Ebene
  rationale: πεδίον bezeichnet hier flaches, offenes Gelände. »Ebene« passt zum geografisch-militärischen Zusammenhang besser als »Feld«.
- source_word: τοῦτʼ ἔστιν
  choice: das heißt
  rationale: Die Wendung führt eine nähere Bestimmung beziehungsweise Identifizierung des Ortes ein.
- source_word: τοῖς ὁρίοις Ῥαγαῦ
  choice: im Gebiet von Ragau
  rationale: ὅρια kann Grenzen, Grenzland oder ein abgegrenztes Gebiet bezeichnen. »im Gebiet« ist im heutigen Deutsch natürlich; die wörtlichere räumliche Nuance wird in der Fußnote bewahrt. »Ragau« folgt der etablierten deutschen Namensform.
theological_decisions: []
