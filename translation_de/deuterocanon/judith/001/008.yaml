  text: and those among the nations of Carmel and Gilead[a], and Upper Galilee, and the great plain of Esdraelon,
translation:
  language: de
  text: und die unter den Völkern von Karmel und Gilead, Obergaliläa und der großen Ebene von Esdraelon[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Ἐσδρήμ; wahrscheinlich ist die Ebene von Esdraelon (Jisreel) gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ἐν τοῖς ἔθνεσι
  choice: die unter den Völkern
  rationale: Die substantivierte Wendung bleibt wie im Griechischen elliptisch und bewahrt den persönlichen Bezug von τοὺς. „Völker“ gibt ἔθνεσι breit wieder, ohne die stärker religiös geprägte Bezeichnung „Heiden“ einzutragen.
- source_word: Καρμήλου
  choice: Karmel
  rationale: Der im Deutschen übliche biblische Ortsname entspricht dem griechischen Text, ohne den dort nicht ausdrücklich genannten Zusatz „Berg“ einzufügen.
- source_word: Γαλαὰδ
  choice: Gilead
  rationale: Dies ist die etablierte deutsche biblische Namensform.
- source_word: τὴν ἄνω Γαλιλαίαν
  choice: Obergalliläa
  rationale: ἄνω bezeichnet hier die geografisch obere Region; „Obergalliläa“ ist die natürliche deutsche Gebietsbezeichnung.
- source_word: τὸ μέγα πεδίον
  choice: die große Ebene
  rationale: πεδίον bezeichnet eine Ebene oder flache Landfläche; die Wiedergabe folgt der direkten Bedeutung von μέγα πεδίον.
- source_word: Ἐσδρήμ
  choice: Esdraelon
  rationale: Die griechische Form verweist wahrscheinlich auf die als Esdraelon beziehungsweise Jesreel bekannte Ebene. „Esdraelon“ wahrt den Bezug zur griechischen Namensform; die geläufige Alternative wird in der Fußnote genannt.
