translation_notes:
  register: Moderner, würdiger Standardstil. Die Ellipse „die unter den Völkern“ wurde bewusst erhalten, weil der Vers eine fortlaufende Aufzählung bildet. „Dazu“ macht den Übergang von Personengruppen zu geografischen Gebieten im Deutschen lesbar, ohne die sachliche Spannung des griechischen Satzbaus aufzulösen.
