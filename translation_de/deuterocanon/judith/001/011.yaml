  register: Moderne, allgemein verständliche Standardsprache mit würdigem erzählerischem Ton. Die Satzglieder wurden zur besseren deutschen Lesbarkeit auf drei Sätze verteilt. „Nebukadnezar“ folgt der im Deutschen vertrauten Namensform; „König der Assyrer“ bewahrt die historische Bezeichnung des griechischen Textes, ohne sie zu harmonisieren.
