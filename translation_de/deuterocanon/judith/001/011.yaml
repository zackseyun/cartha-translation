  yaml_path: translation/deuterocanon/judith/001/011.yaml
  text: And all who inhabited the whole land treated the word of Nebuchodonosor king of the Assyrians with contempt, and they did not join him for the war, because they did not fear him, but he was before them like an ordinary man, and they sent his messengers back empty, in dishonor, from before him.
translation:
  language: de
  text: Und alle Bewohner des ganzen Landes verachteten die Botschaft Nebukadnezars, des Königs der Assyrer,[a] und zogen nicht mit ihm in den Krieg, denn sie fürchteten ihn nicht. Vielmehr galt er ihnen nur als ein Mann ihresgleichen.[b] Und sie schickten seine Boten mit leeren Händen und unter Schmach zu ihm zurück.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „missachteten das Wort beziehungsweise den Befehl Nebukadnezars“. Das griechische Wort kann „Wort“, „Botschaft“ oder „Befehl“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „er war vor ihnen wie ein gleicher Mann“. Gemeint ist, dass sie ihn als einen Menschen auf ihrer eigenen Stufe und nicht als einen zu fürchtenden Herrscher betrachteten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „schickten seine Gesandten unverrichteter Dinge und in Unehre zu ihm zurück“. Wörtlich steht am Schluss eine räumliche Wendung „vor seinem Angesicht“; im Zusammenhang bezeichnet sie die Rückkehr zu Nebukadnezar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαύλισαν
  choice: verachteten
  rationale: Das Verb bezeichnet, etwas gering zu achten oder verächtlich zu behandeln. „Verachteten“ gibt dies im Deutschen knapp und würdig wieder.
- source_word: οἱ κατοικοῦντες πᾶσαν τὴν γῆν
  choice: alle Bewohner des ganzen Landes
  rationale: Die nominale Wendung bewahrt sowohl πάντες als auch den umfassenden Bezug von πᾶσαν τὴν γῆν und klingt im Deutschen natürlich.
- source_word: τὸ ῥῆμα
  choice: die Botschaft
  rationale: Im Zusammenhang ist das übermittelte Ansinnen beziehungsweise der Befehl des Königs gemeint. „Botschaft“ wahrt mehr semantische Offenheit als „Befehl“ und ist hier natürlicher als „Wort“.
- source_word: οὐ συνῆλθον αὐτῷ εἰς τὸν πόλεμον
  choice: zogen nicht mit ihm in den Krieg
  rationale: Die Formulierung bezeichnet das verweigerte gemeinsame militärische Vorgehen und wird idiomatisch wiedergegeben, ohne ein förmliches Bündnis vorauszusetzen.
- source_word: οὐκ ἐφοβήθησαν αὐτόν
  choice: sie fürchteten ihn nicht
  rationale: Direkte und genaue Wiedergabe der Begründung für ihre Weigerung.
- source_word: ἦν ἐναντίον αὐτῶν ὡς ἀνὴρ ἴσος
  choice: galt er ihnen nur als ein Mann ihresgleichen
  rationale: Die schwerfällige wörtliche Wendung „war vor ihnen wie ein gleicher Mann“ meint, dass sie ihn als ihnen gleichgestellt und nicht als übermächtigen Herrscher ansahen. „Galt ihnen“ macht die Perspektive deutlich; „nur“ bringt die abwertende Vergleichskraft im Zusammenhang zum Ausdruck.
- source_word: ἀνέστρεψαν τοὺς ἀγγέλους αὐτοῦ κενούς
  choice: schickten sie seine Boten unverrichteter Dinge ... zurück
  rationale: ἀνέστρεψαν bezeichnet hier das Zurückschicken; κενούς meint, dass die Boten ohne Erfolg oder Erfüllung ihres Auftrags zurückkehrten. „Unverrichteter Dinge“ ist eine natürliche deutsche Entsprechung.
- source_word: ἐν ἀτιμίᾳ
  choice: unter Schmach
  rationale: Die Wendung bezeichnet entehrende beziehungsweise schmachvolle Behandlung. „Unter Schmach“ bewahrt den gehobenen, erzählerischen Ton.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: aus seiner Gegenwart
  rationale: Die griechische räumliche Redewendung bedeutet wörtlich „von vor seinem Angesicht“. Die gewählte Form ist verständlich und bewahrt den Bezug auf seine Gegenwart.
