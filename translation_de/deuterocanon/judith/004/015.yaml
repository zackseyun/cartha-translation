base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/015.yaml
  text: And Joakim the high priest[a], and all who stood before the Lord—the priests and those ministering to the Lord, with sackcloth girded around their waists—were offering the regular whole burnt offering, and the prayers, and the freewill gifts of the people[b],
translation:
  language: de
  text: Und Joakim, der Hohepriester, und alle, die vor dem Herrn standen – die Priester und die, die dem Herrn dienten –, mit Sacktuch um die Hüften gegürtet, brachten das regelmäßige Ganzbrandopfer[a], die Gelübdegaben[b] und die freiwilligen Gaben des Volkes dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das beständige Ganzbrandopfer“. Das griechische Wort bezeichnet etwas Regelmäßiges oder Fortdauerndes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Gebete“. Das griechische Wort kann sowohl Gebete als auch Gelübde beziehungsweise Gelübdegaben bezeichnen; der Opferzusammenhang spricht hier eher für Gelübdegaben.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωακεὶμ
  choice: Joakim
  rationale: Die Form folgt dem griechischen Eigennamen möglichst unmittelbar und ist im Deutschen gut aussprechbar.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: der Hohepriester
  rationale: Dies ist die übliche Amtsbezeichnung für den griechischen Ausdruck und im Deutschen natürlicher als eine wörtliche Wiedergabe mit „großer Priester“.
- source_word: οἱ παρεστηκότες ἐνώπιον Κυρίου
  choice: alle, die vor dem Herrn standen
  rationale: Die Formulierung bewahrt sowohl das konkrete Stehen als auch den kultischen Sinn des Dienstes in Gottes Gegenwart.
- source_word: οἱ λειτουργοῦντες Κυρίῳ
  choice: die dem Herrn dienten
  rationale: Im Zusammenhang bezeichnet λειτουργέω den heiligen beziehungsweise priesterlichen Dienst; „dienten“ ist klar und würdig, ohne unnötig kirchensprachlich zu wirken.
- source_word: σάκκους περιεζωσμένοι τὰς ὀσφύας αὐτῶν
  choice: hatten Sacktuch um ihre Hüften gegürtet
  rationale: Die konkrete Buß- und Trauerkleidung bleibt sichtbar; „Hüften“ ist gegenwärtiger als „Lenden“.
- source_word: προσέφερον
  choice: brachten … dar
  rationale: „Darbringen“ passt zu allen aufgezählten kultischen Gaben. Das griechische Imperfekt beschreibt die fortdauernde Handlung; im deutschen Erzählstil kann das Präteritum diese Funktion übernehmen.
- source_word: τὴν ὁλοκαύτωσιν τοῦ ἐνδελεχισμοῦ
  choice: das regelmäßige Ganzbrandopfer
  rationale: „Ganzbrandopfer“ gibt ὁλοκαύτωσις präzise wieder; „regelmäßig“ wahrt den Gedanken des fortlaufend wiederkehrenden Opfers, ohne unbelegt „täglich“ festzulegen.
- source_word: τὰς εὐχὰς
  choice: die Gelübdegaben
  rationale: Da εὐχαί als Gegenstand von „darbringen“ zwischen Opfer und freiwilligen Gaben steht, ist hier wahrscheinlich an durch Gelübde veranlasste Gaben zu denken. Die ebenfalls mögliche Bedeutung „Gebete“ wird in einer Fußnote bewahrt.
- source_word: τὰ ἑκούσια δόματα τοῦ λαοῦ
  choice: die freiwilligen Gaben des Volkes
  rationale: Die Wiedergabe bildet sowohl die Freiwilligkeit als auch den Gabecharakter unmittelbar und idiomatisch ab.
theological_decisions:
- issue: Wiedergabe von Κύριος als Gottesbezeichnung
  choice: Herr
  alternative: HERR
  rationale: Der griechische Text bietet Κύριος und schreibt hier nicht selbst den hebräischen Gottesnamen. „Herr“ bewahrt daher die vorliegende Gottesbezeichnung, ohne den Tetragramm-Ersatz typografisch einzutragen.
- issue: Kultische Bedeutung von εὐχαί
  choice: Gelübdegaben
  alternative: Gebete
  rationale: Die syntaktische Verbindung mit „darbringen“, dem Ganzbrandopfer und den freiwilligen Gaben spricht für Gelübde beziehungsweise Gelübdegaben. Da εὐχή jedoch auch „Gebet“ heißen kann, bleibt diese echte Mehrdeutigkeit in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der griechischen Aufzählung, wird aber durch Gedankenstriche übersichtlich gegliedert. Kultische Fachbegriffe werden präzise, jedoch ohne altertümliche Formen wiedergegeben.
