base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/013.yaml
  text: And they covered the altar with sackcloth, and they cried out to the God of Israel together with fervor, that he might not give their little children over to plunder, and their women to spoil, and the cities of their inheritance to destruction, and the holy things to defilement and reproach, as something the nations would gloat over.
translation:
  language: de
  text: Und sie bedeckten den Altar mit Sacktuch. Sie schrien einmütig und inständig zu Gott, dem Gott Israels, er möge ihre kleinen Kinder nicht der Plünderung preisgeben, ihre Frauen nicht als Kriegsbeute[a], die Städte ihres Erbes nicht der Vernichtung und die heiligen Dinge nicht der Entweihung und Schande – zur Schadenfreude der Völker[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ihre Frauen der Beute“. Das griechische Wort bezeichnet Beute, die im Krieg genommen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „zum Anlass der Freude für die Völker“; gemeint ist feindseliger Triumph über Israels Unglück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ θυσιαστήριον
  choice: den Altar
  rationale: Im Tempelzusammenhang bezeichnet θυσιαστήριον den Opferaltar; „Altar“ ist im Deutschen eindeutig und natürlich.
- source_word: σάκκῳ περιέβαλλον
  choice: verhüllten ... mit Sacktuch
  rationale: περιβάλλω bezeichnet das Umgeben oder Bedecken; „verhüllen“ gibt die Trauer- und Bußhandlung würdig und anschaulich wieder.
- source_word: ἐβόησαν ... ὁμοθυμαδὸν ἐκτενῶς
  choice: schrien ... alle gemeinsam und inständig
  rationale: „schrien“ bewahrt die Stärke von ἐβόησαν; „alle gemeinsam“ und „inständig“ bilden sowohl die Einmütigkeit als auch die Intensität der Bitte ab.
- source_word: τοῦ μὴ δοῦναι
  choice: er möge ... nicht preisgeben
  rationale: Die Konstruktion gibt Inhalt beziehungsweise Ziel ihres Rufens als dringende Bitte wieder. „Preisgeben“ passt idiomatisch zu den folgenden Bedrohungen.
- source_word: τὰ νήπια αὐτῶν εἰς διαρπαγὴν
  choice: ihre kleinen Kinder nicht der Plünderung preisgeben
  rationale: νήπια meint sehr junge Kinder, ohne zwingend nur Säuglinge zu bezeichnen; διαρπαγή bezeichnet gewaltsame Plünderung oder Wegraubung.
- source_word: τὰς γυναῖκας εἰς προνομὴν
  choice: ihre Frauen nicht als Kriegsbeute
  rationale: γυναῖκες bleibt mit „Frauen“ gegenüber „Ehefrauen“ bewusst weit; προνομή ist Beute im Krieg und wird daher klar als „Kriegsbeute“ wiedergegeben.
- source_word: τὰς πόλεις τῆς κληρονομίας αὐτῶν
  choice: die Städte ihres Erbbesitzes
  rationale: „Erbbesitz“ wahrt den sachlichen und bundesgeschichtlich anklingenden Gehalt von κληρονομία besser als ein bloßes „Eigentum“.
- source_word: εἰς ἀφανισμὸν
  choice: der Vernichtung
  rationale: ἀφανισμός bezeichnet Zerstörung bis hin zur Auslöschung; „Vernichtung“ erhält die starke Aussage.
- source_word: τὰ ἅγια
  choice: die heiligen Dinge
  rationale: Der substantivierte sächliche Plural bleibt absichtlich weit und wird nicht auf das Heiligtum als Gebäude eingeengt.
- source_word: εἰς βεβήλωσιν καὶ ὀνειδισμὸν
  choice: der Entweihung und Schande
  rationale: „Entweihung“ bewahrt den kultischen Sinn von βεβήλωσις; „Schande“ gibt die Ehrverletzung von ὀνειδισμός in diesem Zusammenhang natürlich wieder.
- source_word: ἐπίχαρμα τοῖς ἔθνεσιν
  choice: zur Schadenfreude der Völker
  rationale: ἐπίχαρμα bezeichnet einen Anlass feindseliger Freude oder triumphierenden Frohlockens; „Schadenfreude“ bringt diesen negativen Sinn knapp zum Ausdruck.
theological_decisions:
- issue: Bundesgeschichtlicher Klang von κληρονομία
  choice: Erbbesitz
  alternative: Erbe; angestammter Besitz
  rationale: „Erbbesitz“ wahrt den Bezug auf die Israel zugefallenen Städte, ohne den Ausdruck durch zusätzliche theologische Deutung zu erweitern.
- issue: Referenz von τὰ ἅγια
  choice: die heiligen Dinge
  alternative: das Heiligtum; die Heiligtümer
  rationale: Der griechische Plural kann heilige Gegenstände oder heilige Dinge allgemeiner bezeichnen. Die Übersetzung erhält diese Offenheit und legt sich nicht auf ein Gebäude fest.
- issue: Charakter von ἐπίχαρμα τοῖς ἔθνεσιν
  choice: zur Schadenfreude der Völker
  alternative: zum Anlass der Freude für die Völker
  rationale: Der Kontext legt feindseligen Triumph nahe. Die Hauptfassung macht diese Wertung sichtbar; die Fußnote bewahrt die formal neutralere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Reihung des griechischen Satzes bleibt erkennbar, wird jedoch durch einen Satzwechsel und die wiederholte Verneinung lesbarer gestaltet. „Sacktuch“, „Erbbesitz“ und „Entweihung“ erhalten den religiös-historischen Ton, ohne altertümlich zu wirken.
