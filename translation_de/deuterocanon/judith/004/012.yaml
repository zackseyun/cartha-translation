  yaml_path: translation/deuterocanon/judith/004/012.yaml
  text: And every man of Israel[a], and the women and the children, those dwelling in Jerusalem, fell on their faces before the temple, and put ashes on their heads, and spread out their sackcloth before the Lord,
translation:
  language: de
  text: Alle Männer Israels sowie die Frauen und Kinder, die in Jerusalem wohnten, fielen vor dem Tempel auf ihr Angesicht nieder, streuten sich Asche auf den Kopf und breiteten ihre Sacktücher vor dem Herrn aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „streckten ihre Sacktücher vor dem Herrn aus“. Der griechische Ausdruck ist ungewöhnlich. Gemeint sein kann, dass sie die Sacktücher ausbreiteten oder dass sie sich im Sacktuch als Zeichen der Trauer und des Flehens vor dem Herrn ausstreckten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ἀνὴρ Ἰσραὴλ καὶ γυνὴ καὶ παιδία
  choice: Alle Männer Israels sowie die Frauen und Kinder
  rationale: Die ausdrückliche Aufzählung von Männern, Frauen und Kindern bleibt erhalten. Das distributive πᾶς ἀνήρ wird im Deutschen natürlich mit „alle Männer“ wiedergegeben; γυνή ist hier innerhalb der Aufzählung kollektiv zu verstehen, ohne den Familienstand als „Ehefrauen“ festzulegen.
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: die in Jerusalem wohnten
  rationale: Die substantivierte Partizipialgruppe bezeichnet die in Jerusalem ansässigen Angehörigen der zuvor genannten Gruppen. „Wohnten“ ist in modernem Deutsch natürlich und bewahrt den örtlichen Sinn.
- source_word: ἔπεσον κατὰ πρόσωπον τοῦ ναοῦ
  choice: fielen vor dem Tempel auf ihr Angesicht nieder
  rationale: Die Formulierung gibt sowohl die vollständige Niederwerfung als auch die Ausrichtung vor dem Tempel wieder. „Auf ihr Angesicht niederfallen“ ist würdig und als biblische Gebetshaltung verständlich.
- source_word: ἐσποδώσαντο τὰς κεφαλὰς αὐτῶν
  choice: streuten sich Asche auf den Kopf
  rationale: Das Verb bezeichnet das Aufbringen von Asche als Trauer- und Bußzeichen. Die Formulierung ist konkret und verständlich, ohne die genaue Art des Aufbringens unnötig festzulegen.
- source_word: ἐξέτειναν τοὺς σάκκους αὐτῶν
  choice: breiteten ihre Sacktücher ... aus
  rationale: ἐκτείνω bezeichnet ein Ausstrecken oder Ausbreiten. „Sacktücher“ hält den konkreten Plural fest und benennt das Trauergewand, während eine Fußnote auf die ungewöhnliche und nicht ganz eindeutige Handlung hinweist.
- source_word: κατὰ πρόσωπον Κυρίου
  choice: vor dem Herrn
  rationale: Die feste biblische Wendung bezeichnet die Gegenwart Gottes. „Vor dem Herrn“ ist im Deutschen idiomatisch und bewahrt den Gottesbezug.
- source_word: Κυρίου
  choice: dem Herrn
  rationale: κύριος wird als Gottesbezeichnung traditionsgemäß und verständlich mit „Herr“ wiedergegeben.
theological_decisions:
- issue: Geschlechtsspezifische Aufzählung der versammelten Bevölkerung
  choice: Männer, Frauen und Kinder werden ausdrücklich genannt.
  alternative: Alle Israeliten beziehungsweise die gesamte Bevölkerung
  rationale: Der griechische Text entfaltet die Gemeinschaft ausdrücklich nach Männern, Frauen und Kindern. Eine zusammenfassende geschlechtsneutrale Bezeichnung würde diese rhetorische Einzelheit beseitigen.
- issue: Bezug von κύριος
  choice: der Herr
  alternative: Gott oder der Gottesname
  rationale: Der griechische Text bietet κύριος. „Der Herr“ übersetzt den überlieferten Titel, ohne einen nicht ausdrücklich dastehenden Gottesnamen einzusetzen.
- issue: Körperliche Handlung mit den Sacktüchern
  choice: Sie breiteten ihre Sacktücher vor dem Herrn aus.
  alternative: Sie streckten ihre Sacktücher aus beziehungsweise streckten sich im Sacktuch vor dem Herrn nieder.
  rationale: Die Verbindung von ἐκτείνω mit σάκκους ist ungewöhnlich. Der Haupttext bleibt nah am konkreten Wortlaut; die Fußnote bewahrt die Unsicherheit über die genau gemeinte Gebärde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusster biblischer Färbung in „auf ihr Angesicht nieder“ und „vor dem Herrn“. „Sacktücher“ ist konkreter als das abstrakte „Sacktuch“ und entspricht dem griechischen Plural; die ungewohnte Handlung wird nicht stillschweigend vereindeutigt.
