base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/007.yaml
  text: And Joakim the high priest[a], who was in Jerusalem in those days, wrote to those living in Bethulia and Betomesthaim, which is opposite Esdraelon, facing the plain near Dothaim,
translation:
  language: de
  text: 'Und Jojakim, der Hohepriester,[a] der sich damals in Jerusalem aufhielt, schrieb an die Einwohner von Betulia und an die von Betomesthaim, das Esdrelon gegenüberliegt und der Ebene bei Dothaim zugewandt ist:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Priester, der Große“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Der Aorist von γράφω bedeutet hier schlicht „schrieb“. Ein „Brief“ wird nicht ausdrücklich genannt und daher nicht ergänzt.
- source_word: Ἰωακεὶμ
  choice: Jojakim
  rationale: Die im Deutschen geläufige biblische Namensform gibt den griechischen Eigennamen angemessen wieder.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: der Hohe Priester
  rationale: Die Wendung bedeutet wörtlich „der Priester, der große“, ist aber die griechische Amtsbezeichnung für den Hohen Priester. Die idiomatische deutsche Wiedergabe ist daher im Haupttext vorzuziehen; der Wortlaut wird in einer Fußnote transparent gemacht.
- source_word: ὃς ἦν ἐν ταῖς ἡμέραις ἐν Ἰερουσαλήμ
  choice: der sich damals in Jerusalem aufhielt
  rationale: Das etwas ungewöhnliche Griechisch wird als Orts- und Zeitangabe natürlich wiedergegeben, ohne mehr als Jojakims damalige Anwesenheit in Jerusalem auszusagen.
- source_word: τοῖς κατοικοῦσι
  choice: an die Einwohner
  rationale: Das substantivierte Partizip bezeichnet die dort Wohnenden; „die Einwohner“ ist eine prägnante und natürliche deutsche Entsprechung.
- source_word: Βαιτουλουὰ
  choice: Betulia
  rationale: Diese Form entspricht der etablierten deutschen Namensform des Ortes.
- source_word: Βαιτομεσθαίμ
  choice: Betomesthaim
  rationale: Der Ortsname wird lesbar und eng am griechischen Lautbestand transliteriert.
- source_word: ἀπέναντι Ἐσρηλὼν
  choice: gegenüber von Esdrelon
  rationale: ἀπέναντι bezeichnet eine gegenüberliegende Lage; „Esdrelon“ ist eine gebräuchliche deutsche Form des griechischen Ortsnamens.
- source_word: κατὰ πρόσωπον τοῦ πεδίου
  choice: vor der Ebene
  rationale: Die räumliche Wendung κατὰ πρόσωπον bezeichnet hier die Lage unmittelbar vor beziehungsweise mit Ausrichtung auf die Ebene. „Vor der Ebene“ bewahrt die geografische Aussage knapp und vermeidet eine überpräzise Festlegung.
- source_word: τοῦ πλησίον Δωθάειμ
  choice: bei Dothaim
  rationale: πλησίον mit dem Ortsnamen drückt Nähe aus; „bei Dothaim“ ist im Deutschen idiomatisch und knapp.
theological_decisions:
- issue: Wiedergabe von ὁ ἱερεὺς ὁ μέγας
  choice: der Hohe Priester
  alternative: der große Priester
  rationale: Die wörtliche Form kann institutionelle Bedeutung verschleiern. „Hoher Priester“ benennt das gemeinte Amt im natürlichen Deutschen, während die Fußnote die ungewöhnliche griechische Wortstellung offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsnamen bleiben nahe an den in deutschen Bibeltraditionen geläufigen Formen. Der Doppelpunkt wahrt den fortlaufenden Satzcharakter des griechischen Verses.
