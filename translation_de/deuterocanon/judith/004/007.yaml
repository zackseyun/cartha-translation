revisions:
- from: 'Und Jojakim, der Hohe Priester,[a] der sich damals in Jerusalem aufhielt, schrieb an die Einwohner von Betulia und Betomesthaim, das gegenüber von Esdrelon vor der Ebene bei Dothaim liegt:'
  to: 'Und Jojakim, der Hohepriester,[a] der sich damals in Jerusalem aufhielt, schrieb an die Einwohner von Betulia und an die von Betomesthaim, das Esdrelon gegenüberliegt und der Ebene bei Dothaim zugewandt ist:'
  rationale: Die Revision klärt den durch das griechische Singularrelativpronomen vorgegebenen Bezug auf Betomesthaim, verbessert die deutsche Amtsorthographie und gibt die räumliche Ausrichtung von κατὰ πρόσωπον idiomatisch wieder. Inhalt, Register, Namensformen und der offene Satzschluss bleiben erhalten.
