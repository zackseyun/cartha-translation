revisions:
- from: Denn erst vor Kurzem waren sie aus der Gefangenschaft[a] heraufgekommen, und erst seit Kurzem war das ganze Volk Judäas wieder zusammengebracht worden; auch die Geräte, der Altar und das Haus[b] waren aus der Entweihung wieder geheiligt worden.[c]
  to: Denn erst vor Kurzem waren sie aus der Gefangenschaft[a] heraufgekommen, und erst vor Kurzem war das ganze Volk von Judäa zusammengebracht worden; auch die Geräte, der Altar und das Haus[b] waren nach der Entweihung geweiht worden.[c]
  rationale: Die Revision entfernt nicht ausdrücklich im Griechischen markierte Ergänzungen, stellt die doppelte zeitliche Hervorhebung einheitlich dar und ersetzt eine unidiomatische deutsche Wendung durch eine verständliche, kontexttreue Formulierung. Die Fußnote bewahrt die engere semantische Beziehung von ἐκ τῆς βεβηλώσεως, ohne den Haupttext zu überlasten.
