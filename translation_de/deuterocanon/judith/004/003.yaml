base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/003.yaml
  text: for they had only recently come up from the captivity[a], and all the people of Judea had only recently been gathered together[c][b], and the vessels and the altar and the house had been consecrated from the defilement.
translation:
  language: de
  text: Denn erst vor Kurzem waren sie aus der Gefangenschaft[a] heraufgekommen, und erst vor Kurzem war das ganze Volk von Judäa zusammengebracht worden; auch die Geräte, der Altar und das Haus[b] waren nach der Entweihung geweiht worden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Verbannung“.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus“ ist der Tempel gemeint.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „aus der Entweihung geheiligt“. Das Griechische stellt die vorausgegangene Entweihung und die anschließende Wiederherstellung zur Heiligkeit einander gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσφάτως
  choice: erst vor Kurzem
  rationale: Gibt die betonte zeitliche Nähe natürlich und präzise wieder.
- source_word: ἀναβεβηκότες
  choice: waren ... heraufgekommen
  rationale: Bewahrt beim Perfektpartizip sowohl den abgeschlossenen Zustand als auch die räumliche Vorstellung des Hinaufziehens nach Judäa.
- source_word: αἰχμαλωσίας
  choice: der Gefangenschaft
  rationale: Entspricht der konkreten, durch den Artikel bestimmten Gefangenschaft; „Verbannung“ bleibt eine mögliche kontextuelle Wiedergabe.
- source_word: νεωστὶ
  choice: erst seit Kurzem
  rationale: Spiegelt die erneute Betonung der zeitlichen Nähe, ohne im Deutschen unnötig wortgleich zu wiederholen.
- source_word: συνελέλεκτο
  choice: war ... wieder zusammengebracht worden
  rationale: Gibt das passive Plusquamperfekt und die Wiederherstellung des Volkes als Gemeinschaft wieder; „wieder“ ist aus dem Rückkehrkontext erschlossen.
- source_word: σκεύη
  choice: die Geräte
  rationale: Im Tempelzusammenhang sind kultische Gerätschaften gemeint; „Geräte“ ist im modernen Deutschen natürlicher als „Gefäße“ und fügt „heilig“ nicht ausdrücklich hinzu.
- source_word: θυσιαστήριον
  choice: der Altar
  rationale: Die übliche und eindeutige Wiedergabe des Opferaltars.
- source_word: ὁ οἶκος
  choice: das Haus
  rationale: Bewahrt die wörtliche und ehrfürchtige Bezeichnung; gemeint ist der Tempel.
- source_word: βεβηλώσεως
  choice: der Entweihung
  rationale: Bezeichnet die vorausgegangene Profanierung und bildet einen klaren Gegensatz zur erneuten Heiligung.
- source_word: ἡγιασμένα
  choice: waren ... wieder geheiligt worden
  rationale: Gibt das passive Perfekt als fortbestehenden Zustand nach vollzogener Wiederherstellung zur Heiligkeit wieder; „wieder“ verdeutlicht den durch ἐκ angezeigten Übergang aus der Entweihung.
theological_decisions:
- issue: Kultische Wiederherstellung nach der Entweihung
  choice: aus der Entweihung wieder geheiligt
  alternative: nach der Entweihung wieder geweiht
  rationale: Die Formulierung hält sich eng an ἐκ und bewahrt die Bewegung aus einem Zustand der Entweihung in einen wiederhergestellten heiligen Zustand, ohne ein bestimmtes Reinigungsritual einzutragen.
- issue: Bezeichnung des Tempels als ὁ οἶκος
  choice: das Haus
  alternative: der Tempel
  rationale: Die wörtliche Bezeichnung erhält die ehrfürchtige biblische Redeweise; eine Fußnote klärt den eindeutigen Bezug.
- issue: Gemeinschaftliche Sammlung des Volkes
  choice: wieder zusammengebracht worden
  alternative: versammelt worden
  rationale: Das Passiv bleibt erhalten. „Wieder“ macht im Rückkehrkontext die Wiederherstellung der zerstreuten Gemeinschaft sichtbar, ohne deren Urheber ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Hervorhebung der erst kurz zurückliegenden Ereignisse bleibt erhalten. Der lange griechische Satzbau wird lesbar gegliedert, ohne seine Abfolge oder theologischen Spannungen aufzulösen.
