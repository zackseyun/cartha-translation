review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die kultische Terminologie folgen dem Griechischen gut. Die Zusätze „wieder“ bei der Sammlung des Volkes und bei der Heiligung sind jedoch nicht ausdrücklich markiert. Insbesondere ist „aus der Entweihung wieder geheiligt“ im Deutschen keine natürliche Verbindung und lässt die Funktion von ἐκ eher undeutlich.
  naturalness: „Erst seit Kurzem war ... zusammengebracht worden“ klingt mit dem Plusquamperfekt weniger idiomatisch als „erst vor Kurzem“. Die wörtlich angelehnte Wendung „aus der Entweihung wieder geheiligt“ ist schwer verständlich. Eine idiomatische Wiedergabe kann die zeitliche Abfolge ausdrücken, während eine Fußnote die Nuance von ἐκ erläutert.
  terminology: „Gefangenschaft“, „Geräte“, „Altar“ und „Haus“ sind angemessen. „Geweiht“ ist für ἡγιασμένα im Kontext von Tempelgerät, Altar und Tempel idiomatischer als „geheiligt“ und bezeichnet keine bestimmte konfessionelle Lehre.
  issues:
  - severity: medium
    issue: Nicht ausdrücklich belegtes „wieder“ bei „zusammengebracht“
    rationale: συνελέλεκτο besagt, dass das Volk zusammengebracht/versammelt worden war; ein ausdrückliches „wieder“ steht nicht im griechischen Text. Der historische Kontext kann Wiederherstellung nahelegen, sollte aber nicht in den Haupttext eingetragen werden.
  - severity: medium
    issue: Unnatürliche und zusätzlich interpretierende Formulierung „aus der Entweihung wieder geheiligt“
    rationale: Die deutsche Konstruktion ist nicht idiomatisch. Außerdem ist „wieder“ zwar kontextuell verständlich, aber nicht explizit. Die Relation von ἐκ zur vorherigen βεβήλωσις lässt sich natürlich als Weihe nach der Entweihung ausdrücken und in der Anmerkung genauer absichern.
  - severity: low
    issue: „erst seit Kurzem“ bei einem abgeschlossenen Vorvergangenheitsvorgang
    rationale: Für νεωστί in Verbindung mit „war ... worden“ ist „erst vor Kurzem“ im modernen Standarddeutsch klarer und parallelisiert die doppelte Betonung der Nähe in der Zeit.
