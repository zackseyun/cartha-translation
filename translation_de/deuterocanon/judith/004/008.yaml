translation:
  language: de
  text: und sagte ihnen, sie sollten die Aufstiegswege im Bergland[a] fest besetzen; denn durch sie führte der Zugang nach Judäa. Und es war leicht, die Heraufkommenden aufzuhalten, weil der Zugangsweg so eng war, dass jeweils nur zwei Männer nebeneinander gehen konnten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Aufstiege des Berglands“; gemeint sind hinaufführende Wege oder Pässe durch das Bergland.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte griechische Ausdruck ist knapp und schwierig. Wahrscheinlich bedeutet er, dass auf dem engen Weg jeweils nur zwei Männer nebeneinander vorankommen konnten.
    reason: alternative_reading
lexical_decisions:
- source_word: διακατασχεῖν
  choice: fest besetzen
  rationale: Das Verb bezeichnet hier die entschlossene Inbesitznahme und Sicherung strategisch wichtiger Wege. „Fest besetzen“ verbindet den militärischen und den defensiven Sinn.
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: die Aufstiege ins Bergland
  rationale: Die Formulierung bewahrt die topografische Bedeutung von ἀναβάσεις als hinaufführende Wege und gibt τῆς ὀρεινῆς natürlich als „Bergland“ wieder. Das konkretere „Bergpässe“ wäre möglich, ist aber stärker deutend.
- source_word: ἡ εἴσοδος εἰς τὴν Ἰουδαίαν
  choice: der Zugang nach Judäa
  rationale: „Zugang“ gibt den konkreten Eintrittsweg idiomatisch wieder; „nach Judäa“ entspricht im Deutschen der Bewegung in das Gebiet hinein.
- source_word: εὐχερῶς
  choice: leicht
  rationale: Das Adverb bezeichnet die durch das Gelände begünstigte Möglichkeit, den Gegner ohne große Schwierigkeit aufzuhalten.
- source_word: διακωλῦσαι
  choice: aufhalten
  rationale: Das Verb bedeutet hindern oder abhalten. Im Zusammenhang mit vorrückenden Truppen ist „aufhalten“ natürlich und militärisch passend.
- source_word: προσβαίνοντας
  choice: die heraufkommenden Feinde
  rationale: „Heraufkommend“ bewahrt angesichts der zuvor genannten Aufstiege die Richtung der Bewegung. „Feinde“ macht das im Pronomen enthaltene Bezugsobjekt verständlich, ohne eine besondere Angriffshandlung festzulegen.
- source_word: στενῆς τῆς προσβάσεως οὔσης
  choice: weil der Zugangsweg so eng war
  rationale: Der Genitivus absolutus nennt die Enge des Zugangs als Grund dafür, dass die Gegner leicht aufgehalten werden konnten.
- source_word: ἐπʼ ἄνδρας τοὺς πάντας δύο
  choice: dass nur zwei Männer nebeneinander gehen konnten
  rationale: Der überlieferte griechische Ausdruck ist knapp und schwierig. Im Zusammenhang beschreibt er wahrscheinlich einen Weg, auf dem jeweils nur zwei Männer nebeneinander vorankommen konnten.
