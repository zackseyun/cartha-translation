lexical_decisions:
- source_word: ἀπέστειλαν
  choice: sie sandten Boten
  rationale: Das Verb bedeutet »sie sandten«; da im Griechischen kein Objekt genannt wird, macht »Boten« die im Kontext vorausgesetzte Übermittlung natürlich verständlich, ohne den Inhalt einer Botschaft auszuformulieren.
- source_word: εἰς πᾶν ὅριον Σαμαρίας
  choice: in das ganze Gebiet von Samaria
  rationale: ὅριον kann Grenze, Bezirk oder Gebiet bezeichnen. Mit πᾶν und in einer Reihe von Zielorten ist hier der räumliche Sinn »Gebiet« am wahrscheinlichsten.
- source_word: Κωνὰ
  choice: Kona
  rationale: Nahe Umschrift der griechischen Namensform, da die genaue Identifizierung unsicher ist.
- source_word: Βαιθωρὼν
  choice: Bet-Horon
  rationale: Im Deutschen gebräuchliche biblische Form des Ortsnamens; der Bindestrich macht den zusammengesetzten Namen gut lesbar.
- source_word: Βαιλμὰιν
  choice: Belmaim
  rationale: Quellnahe Umschrift der griechischen Form ohne spekulative Gleichsetzung mit einem anderen Ort.
- source_word: Ἰερειχὼ
  choice: Jericho
  rationale: Eingebürgerte deutsche Form des bekannten Ortsnamens.
- source_word: Χωβὰ
  choice: Choba
  rationale: Direkte, im Deutschen lesbare Umschrift des griechischen Ortsnamens Χωβά.
- source_word: Αἰσωρὰ
  choice: Aisora
  rationale: Nahe Umschrift der unsicher identifizierten griechischen Namensform.
- source_word: τὸν αὐλῶνα Σαλήμ
  choice: das Tal von Salem
  rationale: αὐλών bezeichnet ein Tal, eine Schlucht oder eine längliche Niederung. »Tal« ist hier die natürlichste allgemeine Wiedergabe; »Ebene« bleibt möglich.
