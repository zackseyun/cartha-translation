base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/001.yaml
  text: And the sons of Israel who lived in Judea heard all that Holofernes[a], the commander-in-chief of King Nebuchadnezzar of the Assyrians, had done to the nations[b], and how he had plundered all their sanctuaries and given them over to destruction.
translation:
  language: de
  text: Und die Israeliten[a], die in Judäa wohnten, hörten alles, was Holofernes, der Oberbefehlshaber Nebukadnezzars, des Königs der Assyrer, den Völkern angetan hatte, und wie er alle ihre Heiligtümer[b] geplündert und der Vernichtung preisgegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“; auch „die Kinder Israels“. Gemeint sind die Israeliten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Tempel“ oder „ihre heiligen Dinge“. Der griechische Ausdruck kann heilige Stätten wie auch heilige Gegenstände bezeichnen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Israeliten
  rationale: Die griechische Wendung lautet wörtlich „die Söhne Israels“, bezeichnet hier aber das Volk Israel insgesamt. „Die Israeliten“ gibt diesen Sinn in natürlichem modernem Deutsch wieder; die wörtliche Form bleibt in der Fußnote sichtbar.
- source_word: οἱ κατοικοῦντες ἐν τῇ Ἰουδαίᾳ
  choice: die in Judäa wohnten
  rationale: Das Partizip bezeichnet die dort ansässigen Bewohner. Der Relativsatz ist im Deutschen natürlich und bewahrt den durativen Sinn.
- source_word: πάντα ὅσα ἐποίησεν ... τοῖς ἔθνεσιν
  choice: alles, was ... den Völkern angetan hatte
  rationale: „Alles“ bewahrt die umfassende Aussage; „angetan“ gibt im erzählerischen Zusammenhang die feindseligen Taten idiomatisch wieder, ohne ἔθνη theologisch als „Heiden“ festzulegen.
- source_word: ὁ ἀρχιστράτηγος
  choice: der Oberbefehlshaber
  rationale: Der Ausdruck bezeichnet den ranghöchsten militärischen Befehlshaber und ist stärker als das allgemeinere „Feldherr“ oder „General“.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: Gemeint sind die von Holofernes unterworfenen fremden Völker. „Völker“ ist im Deutschen kontextgerecht und vermeidet die mögliche spätere theologische Färbung von „Heiden“.
- source_word: ἐσκύλευσεν
  choice: geplündert
  rationale: Das Verb bezeichnet das Ausrauben oder Wegnehmen von Beute und passt unmittelbar zum militärischen Zusammenhang.
- source_word: τὰ ἱερὰ αὐτῶν
  choice: ihre Heiligtümer
  rationale: Der substantivierte Ausdruck kann heilige Stätten, Tempelbereiche oder heilige Dinge bezeichnen. „Heiligtümer“ erhält diese Bedeutungsbreite besser als eine engere Festlegung.
- source_word: ἔδωκεν αὐτὰ εἰς ἀφανισμόν
  choice: der Vernichtung preisgegeben hatte
  rationale: Die Formulierung bewahrt sowohl das Moment des Übergebens beziehungsweise Preisgebens als auch die starke Bedeutung von ἀφανισμός, ohne eine technisch-theologische Bannformel einzuführen.
theological_decisions:
- issue: Wiedergabe der Volksbezeichnung οἱ υἱοὶ Ἰσραήλ
  choice: die Israeliten
  alternative: die Söhne Israels / die Kinder Israels
  rationale: Die maskuline griechische Idiomatik hat hier kollektive ethnische und bundesgeschichtliche Bedeutung. Die Hauptübersetzung verhindert das moderne Missverständnis, es seien ausschließlich Männer gemeint; die wörtliche Gestalt wird in der Fußnote dokumentiert.
- issue: Referenzbereich von τὰ ἱερὰ αὐτῶν
  choice: ihre Heiligtümer
  alternative: ihre Tempel / ihre heiligen Dinge
  rationale: Der Kontext betrifft die kultischen Stätten oder Güter der Völker. „Heiligtümer“ wahrt die genuine lexikalische Offenheit, ohne den Ausdruck ausschließlich auf Gebäude oder bewegliche Gegenstände zu beschränken.
- issue: Bedeutung von ἔδωκεν ... εἰς ἀφανισμόν
  choice: der Vernichtung preisgegeben
  alternative: dem Untergang geweiht / vollständig zerstört
  rationale: Die gewählte Fassung gibt die zielgerichtete Überlassung zur Vernichtung wieder und vermeidet sowohl eine Abschwächung als auch die Eintragung eines spezifischen Bannkriegskonzepts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Erzählfluss, wird aber durch klare Appositionen natürlich lesbar gehalten. „Nebukadnezzars, des Königs der Assyrer“ bewahrt die Titelfolge und vermeidet eine unnötige historische Harmonisierung.
