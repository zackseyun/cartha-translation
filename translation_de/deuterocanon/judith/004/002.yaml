  yaml_path: translation/deuterocanon/judith/004/002.yaml
  text: And they were very, very afraid because of him, and they were troubled about Jerusalem and the temple of the Lord their God.
translation:
  language: de
  text: Da fürchteten sie sich sehr, sehr vor ihm, und sie waren um Jerusalem und den Tempel des Herrn, ihres Gottes, beunruhigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφοβήθησαν σφόδρα σφόδρα
  choice: fürchteten sie sich sehr, sehr
  rationale: Bewahrt die auffällige doppelte Verstärkung σφόδρα σφόδρα, statt sie zu einer bloßen Steigerungsform zusammenzuziehen.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: vor ihm
  rationale: Die griechische Wendung bezeichnet hier idiomatisch Furcht angesichts seiner Person beziehungsweise Bedrohung; „vor seinem Angesicht“ wäre im heutigen Deutsch unnötig wörtlich.
- source_word: περὶ Ἰερουσαλὴμ καὶ τοῦ ναοῦ
  choice: wegen Jerusalem und des Tempels
  rationale: περί mit Genitiv bezeichnet den Gegenstand ihrer Sorge beziehungsweise Beunruhigung.
- source_word: ἐταράχθησαν
  choice: gerieten ... in Unruhe
  rationale: Gibt die starke innere Erschütterung wieder, ohne sie enger als bloße Angst oder Sorge festzulegen.
theological_decisions:
- issue: Bezeichnung Κυρίου θεοῦ αὐτῶν
  choice: des Herrn, ihres Gottes
  alternative: des Herrn, ihres Gottes
  rationale: Die traditionelle und natürliche Wiedergabe bewahrt sowohl den Herrschaftstitel als auch die Zugehörigkeitsbeziehung; der griechische Text verlangt hier keine besondere konfessionelle Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Griechischen markante Wiederholung „sehr, sehr“ bleibt bewusst erhalten; die Wortstellung wurde für einen natürlichen deutschen Satzfluss angepasst.
