  yaml_path: translation/deuterocanon/judith/004/016.yaml
  text: And there was ashes on their turbans, and they were crying out to the Lord with all their strength, that he might look with favor on the whole house of Israel.
translation:
  language: de
  text: Auf ihren Turbanen lag Asche, und sie schrien mit aller Kraft zum Herrn, dass er sich dem ganzen Haus Israel zum Guten zuwende.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σποδός
  choice: Asche
  rationale: Das griechische Singularwort bezeichnet Asche als Stoff; im Deutschen ist der nicht zählbare Singular natürlich.
- source_word: κιδάρεις
  choice: Turbane
  rationale: Bezeichnet turbanartige Kopfbedeckungen; „Turbane“ ist verständlich und sachlich passend.
- source_word: ἐβόων
  choice: sie schrien
  rationale: Gibt den durativen, eindringlichen Gebetsruf angemessen wieder.
- source_word: ἐκ πάσης δυνάμεως
  choice: mit aller Kraft
  rationale: Natürliche und genaue Wiedergabe des vollen Krafteinsatzes.
- source_word: ἐπισκέψασθαι ... εἰς ἀγαθόν
  choice: sich ... zum Guten zuwenden
  rationale: Bewahrt den Sinn eines fürsorglichen, helfenden Eingreifens, ohne ihn unnötig zu konkretisieren.
- source_word: πᾶν οἶκον Ἰσραήλ
  choice: dem ganzen Haus Israel
  rationale: Erhält die traditionelle kollektive Bezeichnung und bildet den griechischen Ausdruck eng ab.
theological_decisions:
- issue: Bedeutung von ἐπισκέψασθαι in der Bitte an den Herrn
  choice: er möge sich ... zum Guten zuwenden
  alternative: er möge ... gnädig ansehen / heimsuchen
  rationale: Die Formulierung hält fürsorgliche Zuwendung und wirksames Eingreifen zusammen, ohne die Bitte auf bloßes Anschauen oder eine konfessionell geprägte Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Text, klingt aber idiomatisch; „Haus Israel“ bewahrt den biblischen Kollektivausdruck.
