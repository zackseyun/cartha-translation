base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/009.yaml
  text: And the sons of Israel did as Joakim the high priest and the council of the whole people of Israel[a], who sat in Jerusalem[c][b], instructed them.
translation:
  language: de
  text: Und die Israeliten[a] handelten so, wie es ihnen Joakim, der Hohepriester, und der Ältestenrat des ganzen Volkes Israel aufgetragen hatten.[b] Sie saßen in Jerusalem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«; auch: »die Kinder Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht trotz des zweiteiligen Subjekts ein Singular: »auftrug«.'
    reason: source_form
  - marker: c
    text: 'Wörtlich: »die in Jerusalem saßen«. Die pluralische Schlussklausel kann sich auf Joakim und den Ältestenrat gemeinsam oder sinngemäß auf die Mitglieder des Ältestenrats beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Israeliten
  rationale: Die griechische Wendung bedeutet wörtlich »die Söhne Israels«, bezeichnet hier aber das Volk Israel insgesamt. »Die Israeliten« gibt diesen Sinn in natürlichem, heutigem Deutsch wieder; die formale Entsprechung wird in einer Fußnote genannt.
- source_word: ἐποίησαν ... καθὰ
  choice: handelten so, wie
  rationale: Die Verbindung beschreibt ein Handeln gemäß einer Weisung. »Handelten so, wie« ist im Deutschen klarer und idiomatischer als das formal nähere »taten, wie«.
- source_word: συνέταξεν αὐτοῖς
  choice: es ihnen ... aufgetragen hatten
  rationale: συντάσσω bezeichnet hier eine verbindliche Weisung. »Auftragen« bewahrt deren Autorität, ohne den Ton unnötig zu »befehlen« zu verschärfen. Der deutsche Plural entspricht dem zusammengesetzten Subjekt Joakim und Ältestenrat.
- source_word: Ἰωακεὶμ
  choice: Joakim
  rationale: Die Namensform folgt unmittelbar der griechischen Überlieferung, statt sie an eine andere hebräische oder kirchliche Namensform anzugleichen.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: der Hohepriester
  rationale: Dies ist die etablierte deutsche Bezeichnung für das jüdische Amt.
- source_word: ἡ γερουσία
  choice: der Ältestenrat
  rationale: Der Ausdruck bezeichnet ein aus Ältesten bestehendes Ratsgremium. »Ältestenrat« ist genauer als das allgemeine »Rat« und vermeidet die moderne politische Färbung von »Senat«.
- source_word: παντὸς δήμου Ἰσραήλ
  choice: des ganzen Volkes Israel
  rationale: δῆμος meint hier das Volk beziehungsweise die Gemeinschaft als Ganzes. Die gewählte Formulierung ist verständlich und hält den umfassenden Bezug fest.
- source_word: οἱ ἐκάθηντο ἐν Ἰερουσαλήμ
  choice: die in Jerusalem ihren Sitz hatten
  rationale: Die Wendung wahrt das Bild des Sitzens in einer im Deutschen natürlichen institutionellen Form. Der mögliche Bezug der pluralischen Relativkonstruktion bleibt im Haupttext offen und wird in der Fußnote erläutert.
theological_decisions:
- issue: Korporative Bezeichnung Israels
  choice: die Israeliten
  alternative: die Söhne Israels / die Kinder Israels
  rationale: Die idiomatische Volksbezeichnung vermittelt denselben korporativen Bezug, ohne im modernen Deutsch fälschlich nur männliche Nachkommen nahezulegen. Die wörtliche Form bleibt durch die Fußnote transparent.
- issue: Bezug der Schlussklausel
  choice: eine pluralische Relativklausel, die grammatisch Joakim und den Ältestenrat gemeinsam erfassen kann
  alternative: ausschließlicher Bezug auf die Mitglieder des Ältestenrats
  rationale: Das griechische οἱ ἐκάθηντο steht im maskulinen Plural nach Joakim und dem femininen Kollektiv γερουσία. Es kann die gemeinsam genannten Führungsträger oder sinngemäß die Mitglieder des Rates bezeichnen; diese Unschärfe wird nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Aufbau, wird jedoch durch »handelten so, wie« und »ihren Sitz hatten« idiomatisch geglättet. Personen- und Amtsbezeichnungen bleiben klar und traditionsneutral.
