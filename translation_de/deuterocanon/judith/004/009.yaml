  terminology: „Israeliten“, „Hohepriester“, „Joakim“ und „Ältestenrat des ganzen Volkes Israel“ sind angemessen. Die Fußnote zu „Israeliten“ stellt die wörtliche idiomatische Bezeichnung transparent bereit.
