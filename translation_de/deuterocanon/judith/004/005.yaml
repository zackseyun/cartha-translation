lexical_decisions:
- source_word: προκατελάβοντο
  choice: besetzten … im Voraus
  rationale: Das zusammengesetzte Verb bezeichnet hier die vorzeitige beziehungsweise vorsorgliche Einnahme strategischer Orte. Die Formulierung bewahrt sowohl den militärischen Sinn von »besetzen« als auch die durch προ- ausgedrückte zeitliche Komponente.
- source_word: πάσας
  choice: alle
  rationale: Das Adjektiv bezeichnet die Gesamtheit der genannten Gipfel und wird im Deutschen natürlich mit »alle« wiedergegeben.
- source_word: κορυφὰς
  choice: Gipfel
  rationale: κορυφή bezeichnet die Spitze oder höchste Stelle eines Berges; »Gipfel« ist im geografischen und militärischen Zusammenhang präzise und idiomatisch.
- source_word: ὀρέων
  choice: Berge
  rationale: ὄρος bedeutet gewöhnlich »Berg«; der Kontext gibt keinen Anlass für die schwächere Wiedergabe »Hügel«.
- source_word: ὑψηλῶν
  choice: hohen
  rationale: Das Adjektiv beschreibt die Berge als hoch; »hohen« ist die direkte und natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung »besetzten … im Voraus« macht die im griechischen Präfix enthaltene Bedeutung ausdrücklich, ohne eine übermäßig technische militärische Formulierung zu verwenden.
