base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/011.yaml
  text: They themselves and their wives and their little children and their livestock—and every resident alien or hired worker or purchased servant among them—put sackcloth on their waists[a][b][c].
translation:
  language: de
  text: Sie selbst, ihre Frauen, ihre kleinen Kinder und ihr Vieh – auch jeder unter ihnen ansässige Fremde, Lohnarbeiter oder gekaufte Sklave – legten sich Sacktuch um die Hüften.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beisasse“ beziehungsweise „Fremder, der unter ihnen lebte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit Silber Gekaufter“; gemeint ist ein als Eigentum gekaufter Sklave.'
    reason: lexical_alternative
  - marker: c
    text: Das Tragen von Sacktuch war ein Zeichen der Trauer, Demütigung oder inständigen Bitte.
    reason: cultural_note
lexical_decisions:
- source_word: νήπια
  choice: kleine Kinder
  rationale: Das Wort bezeichnet sehr junge Kinder, ohne die Bedeutung zwingend auf Säuglinge zu beschränken.
- source_word: κτήνη
  choice: Vieh
  rationale: Der Sammelbegriff bezeichnet domestizierte Nutztiere und wird im Deutschen natürlich mit „Vieh“ wiedergegeben.
- source_word: πάροικος
  choice: bei ihnen ansässiger Fremder
  rationale: πάροικος bezeichnet einen Nicht-Einheimischen, der dauerhaft oder zeitweise unter der Bevölkerung lebt; die Formulierung bewahrt sowohl Fremdstatus als auch Ansässigkeit.
- source_word: μισθωτός
  choice: Lohnarbeiter
  rationale: Gemeint ist jemand, der gegen Lohn arbeitet; „Lohnarbeiter“ ist modern und sozial präzise.
- source_word: ἀργυρώνητος
  choice: gekaufter Sklave
  rationale: Das Wort bedeutet wörtlich „mit Silber gekauft“ und bezeichnet hier einen Menschen in käuflich erworbenem Abhängigkeitsstatus. „Sklave“ vermeidet eine beschönigende Wiedergabe.
- source_word: ἐπέθεντο σάκκους
  choice: legten sich Sacktuch um
  rationale: Die Formulierung gibt das Anlegen von Sacktuch als körperlich getragenes Zeichen der Trauer oder Bitte idiomatisch wieder.
- source_word: ἐπὶ τὰς ὀσφύας αὐτῶν
  choice: um die Hüften
  rationale: ὀσφύες bezeichnet den Hüft- beziehungsweise Lendenbereich; „um die Hüften“ ist gegenwärtiges, natürliches Deutsch.
theological_decisions:
- issue: Wiedergabe des Statusbegriffs ἀργυρώνητος
  choice: gekaufter Sklave
  alternative: gekaufter Diener; mit Silber Gekaufter
  rationale: Der griechische Ausdruck hebt den käuflichen Erwerb einer Person hervor. Die Übersetzung benennt den damit bezeichneten Sklavenstatus ausdrücklich, ohne ihn durch „Diener“ abzuschwächen; die wörtliche Bedeutung wird in der Fußnote erhalten.
- issue: Verknüpfung der sozialen Gruppen
  choice: ansässige Fremde oder Lohnarbeiter und gekaufte Sklaven
  alternative: ansässige Fremde, Lohnarbeiter oder gekaufte Sklaven
  rationale: Die ungewöhnliche Folge ἢ … καί wird formal als „oder … und“ bewahrt, statt sie stillschweigend zu einer einheitlichen Aufzählung umzuformen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rahmung mit Gedankenstrichen macht die umfangreiche Subjektgruppe verständlich. „Sacktuch“ wahrt den biblisch-kulturellen Ausdruck, während „um die Hüften“ die altertümliche Wendung „um die Lenden“ vermeidet.
