  source_fidelity: Die Hauptgliederung sowie νήπια, κτήνη und das Anlegen von Sacktuch sind zutreffend wiedergegeben. Die deutsche Verknüpfung „oder Lohnarbeiter und jeder … Sklave“ legt jedoch eine nicht ausreichend begründete Verbindung von Lohnarbeitern und gekauften Sklaven nahe und zerreißt die vom griechischen πᾶς getragene Gruppenaufzählung. Die mit ἤ/καί überlieferte Reihung ist in ihrer genauen logischen Gliederung nicht belastbar; eine idiomatische Aufzählung mit „oder“ wahrt die Kategorien ohne eine Zusatzbeziehung zu behaupten.
  naturalness: Der Satz ist insgesamt modernes, würdiges Deutsch. Die Wiederholung von „jeder“ innerhalb des eingeschobenen Satzteils wirkt jedoch schwerfällig. Eine einheitliche Reihung der Personengruppen liest sich klarer.
  terminology: „bei ihnen ansässiger Fremder“, „Lohnarbeiter“, „gekaufter Sklave“, „Vieh“ und „Sacktuch“ sind angemessen. „Gekaufter Sklave“ benennt den durch ἀργυρώνητος ausgedrückten Eigentumsstatus ohne Beschönigung. Die Fußnoten sind passend; die Erklärung zu Sacktuch ist sachlich und nicht konfessionell festgelegt.
