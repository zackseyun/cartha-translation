  text: And they fortified the villages among them[a], and they stored up food supplies in preparation for war, because their fields had been newly harvested.
translation:
  language: de
  text: Und sie befestigten die Dörfer in ihrer Mitte[a] und legten zur Vorbereitung auf den Krieg Lebensmittelvorräte an, denn ihre Felder waren gerade erst abgeerntet worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Dörfer unter ihnen“. Die griechische Wendung lautet wörtlich „die Dörfer in ihnen“ und lässt den genauen räumlichen Bezug offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτείχισαντο
  choice: sie befestigten
  rationale: Die mediale Form von τειχίζω bezeichnet das Sichern beziehungsweise Ummauern eines Ortes. „Befestigten“ ist im heutigen Deutschen klar, ohne eine bestimmte Bauweise vorauszusetzen.
- source_word: τὰς ἐν αὐτοῖς κώμας
  choice: die Dörfer in ihrer Mitte
  rationale: κώμας bezeichnet Dörfer; die räumlich knappe Wendung ἐν αὐτοῖς bleibt mit „in ihrer Mitte“ bewusst offen, statt einen genaueren geografischen Bezug einzutragen.
- source_word: παρέθεντο
  choice: legten … an
  rationale: Zusammen mit εἰς ἐπισιτισμόν beschreibt das Verb das vorsorgliche Bereitstellen beziehungsweise Ansammeln von Vorräten. „Vorräte anlegen“ ist dafür eine natürliche deutsche Wendung.
- source_word: ἐπισιτισμὸν
  choice: Lebensmittelvorräte
  rationale: Das Substantiv bezeichnet die Versorgung, besonders mit Nahrung. Im Zusammenhang mit παρέθεντο gibt „Lebensmittelvorräte“ den konkreten Sinn verständlich wieder.
- source_word: εἰς παρασκευὴν πολέμου
  choice: zur Vorbereitung auf den Krieg
  rationale: παρασκευή bedeutet hier Vorbereitung beziehungsweise Bereitschaft; πολέμου nennt den bevorstehenden Krieg als Bezug.
- source_word: προσφάτως
  choice: gerade erst
  rationale: Das Adverb kennzeichnet ein erst kurz zuvor eingetretenes Geschehen. „Gerade erst“ verbindet sich idiomatisch mit dem folgenden Plusquamperfekt.
- source_word: τὰ πεδία αὐτῶν τεθερισμένα
  choice: ihre Felder waren … abgeerntet worden
  rationale: πεδία kann Ebenen oder flaches Land bezeichnen, meint hier im Erntezusammenhang jedoch das bestellte Feldland. Das Perfekt Passiv von θερίζω wird mit dem deutschen Plusquamperfekt Passiv wiedergegeben.
