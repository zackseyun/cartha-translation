review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur, den lauten Ruf zu Gott, die distributive Formulierung „jeder Mann Israels“, die zweimalige Intensivierung und das Demütigen zutreffend wieder. Die explizite ψυχή-Wendung sollte jedoch wenigstens in der Anmerkung als wörtliche Formulierung sichtbar bleiben, wenn sie im Deutschen idiomatisch wiedergegeben wird.
  naturalness: „Sie demütigten ihre Seelen“ ist im modernen Standarddeutsch unidiomatisch und kann missverständlich wirken. „Sie demütigten sich“ ist die natürliche deutsche Entsprechung der hier reflexiv-idiomatischen Wendung. „Mit großem Ernst“ ist für beide Vorkommen von ἐν ἐκτενείᾳ μεγάλῃ idiomatischer und weniger devotional eingeengt als „in großer Inbrunst“.
  terminology: „Zu Gott“, „jeder Mann Israels“ und „demütigten sich“ sind angemessen. Die Fußnotenanker werden an die jeweils erläuterten Ausdrücke gesetzt; insbesondere darf Anmerkung b nicht am zweiten Intensitätsausdruck hängen.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe von τὰς ψυχὰς αὐτῶν
    rationale: „Ihre Seelen demütigen“ ist im modernen Deutschen keine natürliche reflexive Wendung. „Sich demütigen“ gibt die idiomatische Bedeutung wieder; die Fußnote kann die wörtliche griechische Formulierung „ihre Seelen“ dokumentieren.
  - severity: medium
    issue: Fußnotenanker b steht am falschen Bezugsausdruck
    rationale: Die Anmerkung zu „ihre Seelen“ ist derzeit an „Inbrunst“ angehängt. Der Anker muss bei „sich“ stehen, damit der Bezug eindeutig ist.
  - severity: low
    issue: „In großer Inbrunst“ ist semantisch enger und stilistisch weniger natürlich
    rationale: Inbrunst betont insbesondere hingebungsvolle religiöse Glut. ἐκτένεια bezeichnet hier intensive, ernste Eindringlichkeit; „mit großem Ernst“ wahrt diese Bedeutung in beiden parallelen Satzgliedern.
  revised_text: Und jeder Mann Israels rief mit großem Ernst[a] zu Gott, und sie demütigten sich[b] mit großem Ernst.
