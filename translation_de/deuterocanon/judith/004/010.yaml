revisions:
- from: Und jeder Mann Israels schrie in großer Inbrunst[a] zu Gott, und sie demütigten ihre Seelen[b] in großer Inbrunst.
  to: Und jeder Mann Israels rief mit großem Ernst[a] zu Gott, und sie demütigten sich[b] mit großem Ernst.
  rationale: Die Revision bewahrt die griechische Wiederholung und Intensität, verwendet aber mit „sich demütigten“ eine natürliche moderne deutsche Wendung. Die Fußnote hält die wörtliche ψυχή-Formulierung transparent und der Anker verweist nun auf den richtigen Ausdruck.
