lexical_decisions:
- source_word: ἀνεβόησαν
  choice: schrie
  rationale: Das Verb bezeichnet ein lautes, eindringliches Rufen. „Schrie zu Gott“ bewahrt sowohl die Stärke des Ausdrucks als auch den Gebetszusammenhang.
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: jeder Mann Israels
  rationale: Die distributive Einzahl und das ausdrücklich männliche ἀνήρ werden beibehalten; die anschließende Mehrzahl „sie“ gibt den kollektiven Bezug wieder.
- source_word: πρὸς τὸν θεόν
  choice: zu Gott
  rationale: Im Zusammenhang des Gebets bezeichnet πρός mit Akkusativ die Ausrichtung des Rufens an Gott; „zu Gott“ ist im Deutschen natürlich.
- source_word: ἐν ἐκτενείᾳ μεγάλῃ
  choice: in großer Inbrunst
  rationale: Die Wendung drückt starke, anhaltende innere Beteiligung aus. „In großer Inbrunst“ ist würdig und lässt sich in beiden Satzgliedern unverändert wiederholen.
- source_word: ἐταπείνουσαν
  choice: sie demütigten
  rationale: ταπεινόω bedeutet hier, niedrig zu machen beziehungsweise sich zu demütigen. Die Übersetzung vermeidet die kontextuell mögliche, aber stärker deutende Wiedergabe „kasteien“.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ihre Seelen
  rationale: Die ausdrückliche ψυχή-Sprache des griechischen Textes bleibt erhalten. Eine Fußnote weist darauf hin, dass die Wendung idiomatisch auch die Personen selbst bezeichnen kann.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung πᾶς ἀνὴρ Ἰσραήλ
  choice: jeder Mann Israels
  alternative: jeder Israelit; alle Männer Israels
  rationale: Der Ausgangstext verwendet ausdrücklich ἀνήρ und eine distributive Einzahl. Die Übersetzung neutralisiert dies nicht, ohne daraus eine weitergehende theologische Aussage abzuleiten.
- issue: Anthropologische Wendung τὰς ψυχὰς αὐτῶν
  choice: ihre Seelen
  alternative: sich selbst
  rationale: Die wörtliche Seelen-Terminologie wird bewahrt, zugleich aber durch die Fußnote offengehalten, dass sie idiomatisch reflexiv verstanden werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung von „in großer Inbrunst“ und der Wechsel von der distributiven Einzahl „jeder Mann“ zur Mehrzahl „sie“ folgen dem griechischen Text.
