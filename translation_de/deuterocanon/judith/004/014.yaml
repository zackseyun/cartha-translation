base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/014.yaml
  text: And the Lord heard their voice and looked upon their affliction[b][a], and the people were fasting for many days throughout all Judea and Jerusalem before the holy things of the Lord Almighty.
translation:
  language: de
  text: Und der Herr hörte ihre Stimme[a] und sah ihre Bedrängnis. Das Volk fastete viele Tage lang in ganz Judäa und Jerusalem vor den heiligen Dingen[b] des Herrn, des Allmächtigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Hilferuf“. Wörtlich steht im Griechischen „ihre Stimme“; im Zusammenhang von Gebet und Not kann damit ihr Flehen um Hilfe gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen eine Pluralform: „den heiligen Dingen“. Gemeint sein können auch die heiligen Stätten oder das Heiligtum des Herrn, des Allmächtigen.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: hörte
  rationale: Das Verb bezeichnet das Hören beziehungsweise aufmerksame Anhören und kann im Gebetszusammenhang ein wohlwollendes Erhören einschließen. „Hörte“ bewahrt diese mögliche Nuance, ohne die göttliche Reaktion ausdrücklich als Gebetserhörung auszudeuten.
- source_word: τῆς φωνῆς αὐτῶν
  choice: ihre Stimme
  rationale: Die wörtliche Bedeutung von φωνή ist „Stimme“. Im Zusammenhang von Gebet und Bedrängnis kann auch ihr Hilferuf gemeint sein; diese Möglichkeit wird in einer Fußnote genannt.
- source_word: ἐπεῖδεν
  choice: sah
  rationale: Das Verb kann ein aufmerksames Hinsehen oder Wahrnehmen ausdrücken. „Sah“ ist im Deutschen klar und lässt die im Zusammenhang liegende fürsorgliche Zuwendung unausgesprochen mitschwingen.
- source_word: τὴν θλίψιν αὐτῶν
  choice: ihre Bedrängnis
  rationale: θλῖψις bezeichnet Druck, Not oder Bedrängnis. „Bedrängnis“ gibt die schwere Lage würdig und relativ formnah wieder.
- source_word: ἦν ὁ λαὸς νηστεύων
  choice: das Volk fastete
  rationale: Die periphrastische Konstruktion beschreibt ein andauerndes Geschehen. Zusammen mit „viele Tage lang“ bringt das deutsche Präteritum diese Dauer natürlich zum Ausdruck.
- source_word: ἡμέρας πλείους
  choice: viele Tage lang
  rationale: Die Wendung bezeichnet hier eine längere Dauer. „Viele Tage lang“ ist idiomatisch und entspricht dem griechischen Ausdruck.
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: in ganz Judäa und Jerusalem
  rationale: Die Formulierung beschreibt die räumliche Ausdehnung des Fastens. „In ganz Judäa und Jerusalem“ bewahrt die Betonung durch πάσῃ in natürlichem Deutsch.
- source_word: κατὰ πρόσωπον
  choice: vor
  rationale: Die feste Wendung bedeutet „vor“ oder „in der Gegenwart von“. „Vor“ ist knapp und passt zum kultischen Zusammenhang.
- source_word: τῶν ἁγίων
  choice: dem Heiligen
  rationale: Der griechische substantivierte Plural kann heilige Dinge, heilige Stätten oder das Heiligtum bezeichnen. Das deutsche substantivierte „das Heilige“ erhält die kultische Offenheit besser als eine eindeutige Festlegung auf Gegenstände oder einen einzelnen Raum; die griechische Pluralform wird in der Fußnote offengelegt.
- source_word: Κυρίου Παντοκράτορος
  choice: des Herrn, des Allmächtigen
  rationale: „Herr“ gibt κύριος als Gottesbezeichnung wieder; „der Allmächtige“ ist die geläufige und genaue Wiedergabe von παντοκράτωρ. Die Apposition hält beide Titel erkennbar.
theological_decisions:
- issue: Wiedergabe von κύριος als Gottesbezeichnung
  choice: Herr
  alternative: Gebieter
  rationale: Im vorliegenden Kontext bezeichnet κύριος Gott. „Herr“ ist die sachgerechte, traditionelle und zugleich allgemein verständliche Wiedergabe, ohne den Titel abzuschwächen.
- issue: Kultische Bedeutung von τῶν ἁγίων
  choice: dem Heiligen
  alternative: den heiligen Dingen / den heiligen Stätten / dem Heiligtum
  rationale: Der griechische Plural lässt offen, ob heilige Gegenstände, heilige Bereiche oder das Heiligtum als Ganzes gemeint sind. „Dem Heiligen“ bewahrt diese Spannung im Haupttext; die Fußnote nennt Form und mögliche Deutungen ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst schlichter Satzführung. „Bedrängnis“ hält den ernsten Gebets- und Notsituationsregister aufrecht. Die ungewöhnliche kultische Wendung „vor dem Heiligen“ ist absichtlich offen gehalten und wird durch die Fußnote erläutert.
