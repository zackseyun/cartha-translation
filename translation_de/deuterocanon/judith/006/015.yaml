  text: 'who were in those days: Uzziah son of Micah[a], from the tribe of Simeon, and Chabris son of Gothoniel, and Charmis son of Melchiel.'
translation:
  language: de
  text: 'die in jenen Tagen waren[a]: Usija, der Sohn Michas, aus dem Stamm Simeon, Chabris, der Sohn Gothoniëls, und Charmis, der Sohn Melchiëls.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung lautet schlicht „die in jenen Tagen waren“. Im Zusammenhang kann sie diejenigen bezeichnen, die damals ein Amt innehatten; die Wendung selbst bestimmt ihre Funktion jedoch nicht näher.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ ἦσαν ἐν ταῖς ἡμέραις ἐκείναις
  choice: die in jenen Tagen da waren
  rationale: Die schlichte Wendung mit εἰμί wird eng am Griechischen wiedergegeben. „Im Amt waren“ wäre im Zusammenhang möglich, würde aber eine nicht ausdrücklich genannte Funktion festlegen.
- source_word: Ὀζείας
  choice: Usija
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Namensform wird gegenüber einer unmittelbaren Umschrift wie „Ozias“ bevorzugt.
- source_word: ὁ τοῦ Μειχὰ
  choice: der Sohn Michas
  rationale: Artikel mit Genitiv bezeichnet hier die Abstammung; die deutsche Genitivform ist natürlich und eindeutig.
- source_word: ἐκ τῆς φυλῆς Συμεὼν
  choice: aus dem Stamm Simeon
  rationale: „Aus“ bildet ἐκ ab; „Stamm Simeon“ ist die übliche deutsche biblische Ausdrucksweise.
- source_word: Χαβρεὶς
  choice: Chabris
  rationale: Quellnahe Umschrift des griechischen Eigennamens; Chi wird mit „Ch“ wiedergegeben.
- source_word: ὁ τοῦ Γοθονιὴλ
  choice: der Sohn Gothoniëls
  rationale: Die griechische Abstammungsformel wird idiomatisch als Sohnangabe wiedergegeben; das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: Χαρμεὶς
  choice: Charmis
  rationale: Direkte und im Deutschen gut lesbare Umschrift des griechischen Namens.
- source_word: ὁ τοῦ Μελχειήλ
  choice: der Sohn Melchiëls
  rationale: Die Abstammungsangabe wird ausdrücklich wiedergegeben; das Trema wahrt die Silbentrennung des Namens.
