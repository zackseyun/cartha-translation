base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/021.yaml
  text: And Uzziah took him from the assembly into his house[a], and made a feast for the elders[b]; and they called on the God of Israel for help all that night.
translation:
  language: de
  text: Und Usija nahm ihn aus der Versammlung mit in sein Haus[a] und veranstaltete für die Ältesten ein Festmahl[b]. Dann riefen sie den Gott Israels jene ganze Nacht hindurch um Hilfe an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für »Versammlung« bezeichnet hier die zusammengekommene Gemeinschaft, nicht »Kirche« im späteren christlichen Sinn.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »veranstaltete ein Trinkmahl«; gemeint ist ein festliches Mahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: nahm ihn … mit
  rationale: Das Verb bezeichnet hier, dass Usija ihn aus der Versammlung an einen anderen Ort mitnahm.
- source_word: ἐκ τῆς ἐκκλησίας
  choice: aus der Versammlung
  rationale: ἐκκλησία bezeichnet in diesem Erzählzusammenhang die versammelte Gemeinschaft, nicht eine Kirche im späteren christlichen Sinn.
- source_word: εἰς οἶκον ἑαυτοῦ
  choice: in sein Haus
  rationale: Die Wendung bezeichnet Usijas eigenes Wohnhaus; die schlichte Wiedergabe entspricht dem würdigen Erzählstil.
- source_word: ἐποίησεν πότον
  choice: veranstaltete … ein Festmahl
  rationale: Die wörtliche Wendung »machte ein Trinken« ist idiomatisch und bezeichnet die Ausrichtung eines Trinkmahls beziehungsweise Festmahls.
- source_word: τοῖς πρεσβυτέροις
  choice: für die Ältesten
  rationale: Gemeint sind hier die führenden Männer der Gemeinschaft, nicht lediglich ältere Männer.
- source_word: ἐπεκαλέσαντο
  choice: riefen … an
  rationale: Die mediale Form bezeichnet das an Gott gerichtete, bittende Anrufen.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: den Gott Israels
  rationale: Die traditionelle und direkte Wiedergabe des griechischen Gottesnamens beziehungsweise Titels.
- source_word: εἰς βοήθειαν
  choice: um Hilfe
  rationale: 'Die Präpositionalwendung gibt das Ziel des Anrufens an: Sie baten Gott um Hilfe.'
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: jene ganze Nacht hindurch
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer und betont, dass das Gebet die gesamte Nacht anhielt.
theological_decisions: []
