  source_fidelity: 'Die Befehlsfolge wird treffend wiedergegeben: Holofernes befiehlt seinen bei ihm im Zelt anwesenden Leuten, Achior zu ergreifen, nach Betylua zurückzubringen und den Söhnen Israels zu übergeben. Das deutsche »Dienern« schwächt jedoch δοῦλοι unnötig ab. In diesem erzählerischen und herrschaftlichen Kontext ist »Sklaven« die quellengetreuere Grundübersetzung; die englische Auditspur bestätigt diese Entscheidung.'
  naturalness: Der Satz ist flüssiges, würdiges modernes Standarddeutsch. »bereitstanden« gibt die anwesend-bereite Funktion von παρεστηκότες idiomatisch wieder. Die dreigliedrige Infinitivkonstruktion ist klar.
  terminology: »Sklaven« bildet δοῦλοι sozialgeschichtlich und semantisch angemessener ab als »Diener«. »Zelt«, »ergreifen«, »zurückzubringen«, »übergeben« und die bewusste Beibehaltung von »Söhne Israels« sind passend. »Betylua« ist als eng am griechischen Namen orientierte Form vertretbar; »Betulia« sollte als traditionelle Namensform erläutert bleiben.
