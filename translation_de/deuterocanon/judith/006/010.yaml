base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/010.yaml
  text: And Holofernes ordered his servants[a], who were standing by in his tent[b], to seize Achior and take him back to Bethyloua and hand him over into the hands of the sons of Israel.
translation:
  language: de
  text: Und Holofernes befahl seinen Sklaven, die in seinem Zelt bereitstanden, Achior zu ergreifen, ihn nach Betylua[a] zurückzubringen und ihn in die Hände der Söhne Israels[b] zu übergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: »Betulia«.'
    reason: name_alternative
  - marker: b
    text: »Söhne Israels« bezeichnet hier gemeinschaftlich das Volk Israel.
    reason: clarification
lexical_decisions:
- source_word: προσέταξεν
  choice: befahl
  rationale: Das Verb bezeichnet einen verbindlichen, autoritativen Befehl; »befahl« gibt dies im Deutschen knapp und natürlich wieder.
- source_word: τοῖς δούλοις
  choice: seinen Dienern
  rationale: δοῦλοι kann je nach sozialem Kontext »Sklaven« oder »Diener« bezeichnen. »Diener« passt zur Funktion der im Zelt anwesenden Gefolgsleute, während eine Fußnote die härtere soziale Lesart offenhält.
- source_word: παρεστηκότες
  choice: bereitstanden
  rationale: Das Partizip beschreibt Personen, die anwesend und zur Verfügung standen; »bereitstanden« bewahrt beide Aspekte in natürlichem Deutsch.
- source_word: σκηνῇ
  choice: Zelt
  rationale: Im militärischen Zusammenhang bezeichnet σκηνή ein gewöhnliches Zelt, keine kultische Stiftshütte.
- source_word: συλλαβεῖν
  choice: zu ergreifen
  rationale: Das Verb bezeichnet hier eine gewaltsame Festnahme; »ergreifen« bewahrt den Zwang, ohne ein modernes förmliches Verhaftungsverfahren vorauszusetzen.
- source_word: ἀποκαταστῆσαι
  choice: zurückzubringen
  rationale: Das Verb hat den Sinn des Zurückbringens beziehungsweise Zurückversetzens; in Verbindung mit Betylua ist »zurückzubringen« idiomatisch und kontextgerecht.
- source_word: Βετυλουὰ
  choice: Betylua
  rationale: Die Form wird eng nach dem griechischen Ortsnamen transliteriert; die im Deutschen traditionellere Form »Betulia« steht in der Fußnote.
- source_word: παραδοῦναι
  choice: zu übergeben
  rationale: Das Verb bezeichnet die Auslieferung einer Person in die Gewalt anderer; »übergeben« ist klar und wahrt den feindlichen Vorgang.
- source_word: εἰς χεῖρας
  choice: in die Hände
  rationale: Die bildhafte Wendung für die Übergabe in fremde Gewalt wird als geläufige biblische Ausdrucksweise erhalten.
- source_word: υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  rationale: Die Übersetzung bewahrt die ausdrücklich verwandtschaftliche und maskuline Form des griechischen Ausdrucks; eine Fußnote erläutert seinen kollektiven Bezug.
theological_decisions:
- issue: Bedeutungsumfang von δοῦλοι
  choice: Diener mit Fußnotenalternative »Sklaven«
  alternative: Sklaven
  rationale: Der griechische Ausdruck kann einen unfreien Status bezeichnen, doch der unmittelbare Satz hebt vor allem die Dienstfunktion im Zelt hervor. Die Fußnote bewahrt die soziale Härte als echte lexikalische Möglichkeit.
- issue: Kollektiver Ausdruck υἱῶν Ἰσραήλ
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die formale Wendung des Ausgangstextes bleibt sichtbar, ohne ihren kollektiven Sinn auf männliche Einzelpersonen zu verengen; dieser wird in der Fußnote erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der klaren Befehlsstruktur des Griechischen; die wiederholten Infinitive werden natürlich koordiniert. Bildhafte und traditionell biblische Sprache bleibt erhalten, wo sie gut verständlich ist.
