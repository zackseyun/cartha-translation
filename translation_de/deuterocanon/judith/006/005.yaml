  source_fidelity: 'Der Satzbau und die wesentlichen Bedeutungen folgen dem Griechischen genau: die direkte Kontrastanrede, der Vorwurf über die zuvor gesprochenen Worte, die Wendung vom Sehen des Angesichts sowie die zeitliche Begrenzung bis zur Rache. „Tagelöhner“ ist jedoch enger als μισθωτός, da es spezifisch einen täglich entlohnten Arbeiter bezeichnet; das griechische Wort meint allgemeiner einen gegen Lohn Dienenden und ist hier als abwertende Anrede gebraucht. „Bis ich Rache nehme“ gibt das futurische ἐκδικήσω unmittelbarer wieder als das deutsche Perfekt.'
