  terminology: Achior und Ammon sind korrekt wiedergegeben. „Mietling Ammons“ bewahrt die enge Zugehörigkeitsform des Genitivs, ohne die Quelle vorschnell zu „Ammoniter“ umzuformen. „Unrecht“ lässt die semantische Offenheit von ἀδικία bestehen. Die Fußnoten bieten sinnvolle Alternativen, ohne eine militärische Bedeutung als zwingend auszugeben.
