  yaml_path: translation/deuterocanon/judith/006/005.yaml
  text: But you[a], Achior, hireling of Ammon, who spoke these words in the day of your injustice[b], shall no longer see my face from this day until I take vengeance
translation:
  language: de
  text: Du aber, Achior, Mietling Ammons[a], der du diese Worte am Tag deines Unrechts[b] gesprochen hast, wirst von diesem Tag an mein Angesicht nicht mehr sehen, bis ich Rache nehme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Söldner Ammons“ beziehungsweise „Lohnknecht Ammons“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung kann auch mit „am Tag deiner Verfehlung“ oder „zur Zeit deines Unrechts“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτὲ
  choice: Tagelöhner
  rationale: Bezeichnet einen Menschen, der gegen Lohn dient. „Tagelöhner“ ist im Deutschen konkret, verständlich und bewahrt den herabsetzenden Klang der Anrede, ohne vorschnell die militärische Bedeutung „Söldner“ festzulegen.
- source_word: τοῦ Ἀμμών
  choice: Ammons
  rationale: Der Genitiv wird eng an der griechischen Form als Zugehörigkeit beziehungsweise Herkunft wiedergegeben, ohne ihn zum Adjektiv „ammonitisch“ umzuformen.
- source_word: ἐλάλησας τοὺς λόγους τούτους
  choice: diese Worte gesprochen hast
  rationale: Bewahrt den ausdrücklichen Rückbezug auf Achiors vorausgehende Rede und gibt das Verb in natürlichem Deutsch wieder.
- source_word: ἐν ἡμέρᾳ ἀδικίας σου
  choice: am Tag deines Unrechts
  rationale: „Unrecht“ deckt sowohl ungerechtes Verhalten als auch konkretes Fehlverhalten ab; die auffällige zeitliche Formulierung des Griechischen bleibt erhalten.
- source_word: οὐκ ὄψῃ ἔτι τὸ πρόσωπόν μου
  choice: wirst ... mein Angesicht nicht mehr sehen
  rationale: Erhält die griechische Wendung vom Sehen des Angesichts und ihren würdevoll-drohenden Ton.
- source_word: ἀπὸ τῆς ἡμέρας ταύτης
  choice: von diesem Tag an
  rationale: Direkte und im modernen Deutschen natürliche Wiedergabe des zeitlichen Ausgangspunkts.
- source_word: ἕως οὗ ἐκδικήσω
  choice: bis ich Rache genommen habe
  rationale: Drückt die strafende Vergeltung des Sprechers aus. Das deutsche Perfekt nach „bis“ gibt den gemeinten Abschluss der angekündigten Handlung idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von ἀδικία in einer feindseligen Anklage
  choice: Unrecht
  alternative: Verfehlung; Ungerechtigkeit
  rationale: „Unrecht“ bewahrt die Offenheit zwischen moralischer Schuld, einem konkreten Fehlverhalten und vermeintlicher Illoyalität, ohne die Anklage des Sprechers theologisch zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter direkter Anrede und Drohformel. „Angesicht“ ist bewusst gehobener als „Gesicht“, da es die feste personale Wendung des Griechischen trägt; ungewöhnliche Formulierungen werden nicht unnötig geglättet.
