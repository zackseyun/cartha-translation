  text: and then the iron of my army and the people of my servants will pass through your sides[a], and you will fall among their wounded when they return[c][b];
translation:
  language: de
  text: Und dann werden das Eisen meines Heeres und das Volk meiner Diener deine Seiten durchdringen[a][b], und du wirst unter ihren Verwundeten fallen[c], wenn sie zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „das Eisen meines Heeres“. „Eisen“ bezeichnet wahrscheinlich die Waffen oder die bewaffnete Macht; deutender könnte man „die Schwerter meines Heeres“ übersetzen.
    reason: lexical_alternative
  - marker: b
    text: „Deine Seiten“ kann je nach persönlichem oder kollektivem Verständnis der Anrede auch „deine Rippen“ oder „deine Flanken“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Der griechische Ausdruck ist knapp und wörtlich etwa „unter ihren Verwundeten“. Der Bezug von „ihren“ ist im Griechischen nicht näher erläutert; möglich ist, dass die Verwundeten den genannten Truppen zugeordnet sind oder von ihnen verwundet wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελεύσεται
  choice: werden … durchdringen
  rationale: Das Verb bezeichnet ein Hindurchgehen. Im Zusammenhang der angedrohten militärischen Gewalt gibt „durchdringen“ sowohl die Bewegung als auch die deutlich mitschwingende Verwundung wieder, ohne eine bestimmte Waffe zu nennen.
- source_word: ὁ σίδηρος
  choice: das Eisen
  rationale: Die wörtliche Metonymie „das Eisen“ bleibt als kraftvolles Bild für eiserne Waffen beziehungsweise bewaffnete Gewalt erhalten.
- source_word: τῆς στρατείας μου
  choice: meines Heeres
  rationale: στρατεία bezeichnet hier am natürlichsten die militärische Streitmacht, nicht den Feldzug als Vorgang.
- source_word: ὁ λαὸς τῶν θεραπόντων μου
  choice: das Volk meiner Diener
  rationale: Die ungewöhnliche, aber verständliche Fügung bewahrt sowohl λαός als kollektive Bezeichnung als auch das Abhängigkeitsverhältnis des Genitivs, ohne den Ausdruck ausdrücklich auf „Truppen“ einzuengen.
- source_word: τὰς πλευράς σου
  choice: deine Seiten
  rationale: πλευρά kann Körperseiten, Rippen oder Flanken bezeichnen. „Seiten“ erhält die Offenheit zwischen persönlicher und korporativ-militärischer Anrede.
- source_word: πεσῇ
  choice: du wirst … fallen
  rationale: „Fallen“ gibt die bildhafte Aussage von Niederlage, Verwundung oder Tod wieder, ohne eine dieser Möglichkeiten allein festzulegen.
- source_word: ἐν τοῖς τραυματίαις αὐτῶν
  choice: unter den von ihnen Verwundeten
  rationale: 'Diese Wiedergabe macht den im Griechischen gedrängten Bezug des Pronomens verständlich: Gemeint sind wahrscheinlich diejenigen, die von den genannten Streitkräften verwundet werden.'
- source_word: ὅταν ἐπιστρέψωσιν
  choice: wenn sie zurückkehren
  rationale: Die zukünftige Zeitangabe mit ὅταν und Konjunktiv wird im Deutschen natürlich durch „wenn“ mit Präsens ausgedrückt.
theological_decisions: []
