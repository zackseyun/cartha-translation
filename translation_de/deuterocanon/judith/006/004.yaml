base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/004.yaml
  text: For we will burn them up where they are[a], and their borders will be drenched with their blood, and their plains will be filled with their dead. The trace of their feet will not stand before us, but they will utterly perish, says King Nebuchadnezzar, lord of all the earth. For he said[b], ‘The words of his mouth will not prove empty.’
translation:
  language: de
  text: 'Denn wir werden sie dort, wo sie sind, völlig verbrennen, und ihre Grenzgebiete werden von ihrem Blut trunken werden[a], und ihre Ebenen werden sich mit ihren Toten füllen. Keine Spur ihrer Füße wird vor uns standhalten[b]; vielmehr werden sie völlig zugrunde gehen, spricht König Nebukadnezzar, Herr der ganzen Erde. Denn er hat gesprochen: »Die Worte seiner Rede werden sich nicht als nichtig erweisen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier das Bild, dass ihre Grenzgebiete „von ihrem Blut betrunken gemacht werden“ bzw. „von ihrem Blut trunken werden“.
    reason: Die Fußnote erläutert die ungewöhnliche Blut-und-Rausch-Metapher und macht die stärker wörtliche Form zugänglich.
  - marker: b
    text: 'Das ungewöhnliche Bild kann auch besagen: Nicht einmal eine Spur von ihnen wird vor uns bestehen bleiben.'
    reason: Die Formulierung verbindet das Bild völliger Auslöschung mit dem Gedanken, dass niemand dem Angriff standhalten wird.
lexical_decisions:
- source_word: κατακαύσομεν … ἐν αὐτοῖς
  choice: wir werden sie dort, wo sie sind, völlig verbrennen
  rationale: κατακαίω bezeichnet ein vollständiges oder vernichtendes Verbrennen. Das schwerfällige ἐν αὐτοῖς wird in seinem wahrscheinlich lokalen Sinn wiedergegeben, ohne einen nicht ausdrücklich genannten Ort einzuführen.
- source_word: τὰ ὅρια αὐτῶν
  choice: ihre Grenzgebiete
  rationale: ὅρια kann Grenzen, Grenzmarken oder das dadurch bezeichnete Gebiet meinen. „Grenzgebiete“ passt zum geografisch-militärischen Zusammenhang und funktioniert als Bildträger des folgenden Verbs.
- source_word: μεθυσθήσεται ἐν τῷ αἵματι αὐτῶν
  choice: werden sich an ihrem Blut berauschen
  rationale: Die ungewöhnliche Metapher von μεθύσκω, „betrunken machen/werden“, wird bewusst bewahrt. „Sich an … berauschen“ ist im Deutschen verständlich und erhält die drastische Bildsprache.
- source_word: τὰ πεδία αὐτῶν
  choice: ihre Ebenen
  rationale: πεδίον bezeichnet flaches, offenes Land. „Ebenen“ erhält den militärisch-geografischen Charakter deutlicher als „Felder“.
- source_word: πληρωθήσεται νεκρῶν αὐτῶν
  choice: werden sich mit ihren Toten füllen
  rationale: νεκροί kann Tote oder Leichen bezeichnen. „Ihre Toten“ ist würdig, klar und nicht unnötig klinisch.
- source_word: οὐκ ἀντιστήσεται τὸ ἴχνος τῶν ποδῶν αὐτῶν κατὰ πρόσωπον ἡμῶν
  choice: Keine Spur ihrer Füße wird vor uns standhalten
  rationale: Die auffällige Verbindung von „Spur“ und „standhalten“ bleibt erhalten. Sie kann sowohl völliges Verschwinden als auch fehlenden Widerstand andeuten.
- source_word: ἀπωλείᾳ ἀπολοῦνται
  choice: sie werden völlig zugrunde gehen
  rationale: Die Verbindung des Substantivs ἀπώλεια mit dem verwandten Verb ἀπόλλυμι verstärkt die Aussage. „Völlig zugrunde gehen“ gibt diese Emphase natürlich wieder.
- source_word: κύριος πάσης τῆς γῆς
  choice: Herr der ganzen Erde
  rationale: κύριος wird direkt mit „Herr“ wiedergegeben. Im Kontext ist dies Nebukadnezzars imperialer Anspruch, nicht eine stillschweigende Bestätigung göttlicher Herrschaft.
- source_word: οὐ ματαιωθήσεται τὰ ῥήματα τῶν λόγων αὐτοῦ
  choice: Die Worte seiner Rede werden sich nicht als nichtig erweisen
  rationale: Die griechische Häufung ῥήματα τῶν λόγων wird als „Worte seiner Rede“ hörbar gehalten. ματαιόω bezeichnet das Nichtig- oder Wirkungsloswerden.
theological_decisions:
- issue: Der Titel κύριος für Nebukadnezzar
  choice: Herr der ganzen Erde
  alternative: Gebieter der ganzen Erde
  rationale: Die direkte Wiedergabe bewahrt die anmaßende Universalbehauptung des Königs. Der erzählerische Zusammenhang lässt erkennen, dass es sich um seinen Anspruch handelt; die Übersetzung fügt keine theologische Bewertung hinzu.
- issue: Bedeutung der Fußspur, die nicht standhält
  choice: Das mehrdeutige Bild bleibt im Haupttext erhalten.
  alternative: Keiner von ihnen wird uns Widerstand leisten oder übrig bleiben.
  rationale: Die freie Alternative würde zwei mögliche Folgerungen ausdrücklich machen, die der griechische Text nur bildhaft andeutet.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst erhaltener prophetisch-militärischer Bildkraft. Die drastischen Metaphern und die emphatische Wiederholung des griechischen Textes werden nicht konfessionell geglättet; syntaktische Härten werden nur so weit gelöst, wie es für verständliches Deutsch nötig ist.
