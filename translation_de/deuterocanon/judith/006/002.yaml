base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/002.yaml
  text: And who are you[a], Achior, and the hirelings of Ephraim among all the sons of Moab, that you have prophesied among us as you did today, and said that one should not make war against the house of Israel because their God will defend them? And who is God except Nebuchadnezzar? He himself will send his force and destroy them from the face of the earth[c][b], and their God will not rescue them.
translation:
  language: de
  text: Und wer bist du, Achior, samt den Söldnern Efraims unter allen Moabitern, dass du heute unter uns prophezeit und gesagt hast, man solle gegen das Volk Israel[a] keinen Krieg führen, weil ihr Gott sie verteidigen werde? Und wer ist Gott außer Nebukadnezar?[b] Er wird seine Streitmacht[c] entsenden und sie vom Erdboden vertilgen, und ihr Gott wird sie nicht retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „das Geschlecht“ oder „die Abstammungsgemeinschaft Israels“; der griechische Ausdruck betont die gemeinsame Herkunft.
    reason: lexical_alternative
  - marker: b
    text: Diese Frage gibt die prahlerische Behauptung des Sprechers wieder; sie ist keine Zustimmung des Erzählers.
    reason: cultural_note
  - marker: c
    text: Oder „seine Macht“. Das griechische Wort kann sowohl Macht und Stärke als auch deren konkrete militärische Ausübung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτοὶ Ἐφράιμ
  choice: Söldner Efraims
  rationale: μισθωτοί bezeichnet gegen Lohn Dienende. Im militärischen Zusammenhang gibt „Söldner“ die Bedeutung und den verächtlichen Unterton der Anrede natürlich wieder.
- source_word: ἐπροφήτευσας
  choice: wie ein Prophet geredet
  rationale: Die Formulierung bewahrt die prophetische Begrifflichkeit, lässt im Deutschen aber zugleich den spöttisch-feindseligen Ton des Sprechers erkennen.
- source_word: τὸ γένος Ἰσραήλ
  choice: das Volk Israel
  rationale: γένος bezeichnet hier die durch Abstammung verbundene Volksgemeinschaft. „Volk Israel“ ist im modernen Deutsch natürlich; die engere Abstammungsnuance wird in einer Fußnote ausgewiesen.
- source_word: μὴ πολεμῆσαι
  choice: keinen Krieg führen
  rationale: Die vom Verb des Sagens abhängige Infinitivkonstruktion wird als indirekte Rede mit „man solle“ idiomatisch wiedergegeben.
- source_word: ὑπερασπιεῖ
  choice: wird verteidigen
  rationale: Das Verb bedeutet schützen, verteidigen oder für jemanden eintreten und hat hier einen klar militärischen Bezug.
- source_word: θεὸς
  choice: ein Gott
  rationale: In der rhetorischen Frage steht θεός prädikativ und ohne Artikel. „Ein Gott“ wahrt den Anspruch des Sprechers, ohne ihn als Erzählerurteil erscheinen zu lassen.
- source_word: τὸ κράτος αὐτοῦ
  choice: seine Macht
  rationale: κράτος kann Macht, Stärke oder Gewalt bezeichnen. „Macht“ hält die Formulierung weiter als das kontextuell mögliche, aber enger gefasste „Streitmacht“.
- source_word: ἐξολεθρεύσει
  choice: vertilgen
  rationale: Das starke Verb bezeichnet vollständiges Vernichten. „Vertilgen“ erhält die Härte und den würdevollen biblischen Ton.
- source_word: ἀπὸ προσώπου τῆς γῆς
  choice: vom Erdboden
  rationale: Dies gibt die feste biblische Wendung im heutigen Deutschen natürlich und prägnant wieder.
- source_word: ῥύσεται
  choice: wird retten
  rationale: Das Verb meint die Rettung oder Befreiung aus unmittelbarer Gefahr; „retten“ passt zum militärischen Zusammenhang.
theological_decisions:
- issue: Nebukadnezars Anspruch auf Göttlichkeit
  choice: Und wer ist ein Gott außer Nebukadnezar?
  alternative: Und wer ist Gott außer Nebukadnezar?
  rationale: Der griechische Text unterscheidet nicht durch Groß- und Kleinschreibung. Der unbestimmte Ausdruck „ein Gott“ gibt die prädikative Konstruktion wieder und kennzeichnet die Äußerung als vermessenen Anspruch der Figur, ohne die theologische Spannung durch einen erklärenden Zusatz im Haupttext aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die lange rhetorische Satzführung des Griechischen bleibt erkennbar, wird aber durch idiomatische indirekte Rede geglättet. Der verächtliche Ton gegenüber Achior und Efraim sowie die Gotteslästerung des Sprechers werden nicht abgeschwächt.
