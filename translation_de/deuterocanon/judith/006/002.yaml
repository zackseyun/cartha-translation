revisions:
- from: Und wer bist du, Achior, samt den Söldnern Efraims unter all den Söhnen Moabs, dass du heute in unserer Mitte wie ein Prophet geredet und gesagt hast, man solle gegen das Volk Israel[a] keinen Krieg führen, weil ihr Gott sie verteidigen werde? Und wer ist ein Gott außer Nebukadnezar?[b] Er wird seine Macht[c] aussenden und sie vom Erdboden vertilgen, und ihr Gott wird sie nicht retten.
  to: Und wer bist du, Achior, samt den Söldnern Efraims unter allen Moabitern, dass du heute unter uns prophezeit und gesagt hast, man solle gegen das Volk Israel[a] keinen Krieg führen, weil ihr Gott sie verteidigen werde? Und wer ist Gott außer Nebukadnezar?[b] Er wird seine Streitmacht[c] entsenden und sie vom Erdboden vertilgen, und ihr Gott wird sie nicht retten.
  rationale: Die Revision ersetzt die abschwächende Umschreibung von ἐπροφήτευσας durch „prophezeit“, glättet die im Deutschen unidiomatische Verbindung „Macht aussenden“ und vereinheitlicht die Bezeichnung des Gottes Israels. Die schwer deutbare, im griechischen Wortlaut selbst verschränkte Anrede bleibt vorsichtig als Anrede Achior[s] samt den Söldnern wiedergegeben. Die Fußnotenanker bleiben vollständig und an den einschlägigen Stellen erhalten.
