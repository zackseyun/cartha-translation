base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/001.yaml
  text: 'And when the uproar of the men around the council had ceased[a], Holofernes, commander-in-chief of the army of Asshur, said to Achior in the presence of all the assembly of foreigners:'
translation:
  language: de
  text: 'Und als der Tumult der Männer rings um die Ratsversammlung verstummt war, sagte Holofernes, der Oberbefehlshaber des Heeres von Assur[a], zu Achior vor der ganzen Versammlung der Fremden:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Assyrien“; dann: „des Heeres von Assyrien“ beziehungsweise „des assyrischen Heeres“. Im Griechischen steht der Eigenname Assour, der auch als Landesbezeichnung verstanden werden kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέπαυσεν
  choice: verstummt war
  rationale: Die Form bezeichnet das Ende des vorausgehenden Tumults, bevor Holofernes zu sprechen beginnt; das Plusquamperfekt bildet diese Erzählfolge im Deutschen natürlich ab.
- source_word: θροῦβος
  choice: Tumult
  rationale: Das Wort bezeichnet eine laute, unruhige Störung; „Tumult“ gibt sowohl den Lärm als auch die Erregung wieder.
- source_word: συνεδρίας
  choice: Ratsversammlung
  rationale: Der Ausdruck bezeichnet eine beratende Zusammenkunft. „Ratsversammlung“ bewahrt sowohl den institutionellen als auch den versammelten Charakter.
- source_word: ἀρχιστράτηγος
  choice: Oberbefehlshaber
  rationale: Der zusammengesetzte Titel bezeichnet den höchsten militärischen Befehlshaber und ist stärker als das allgemeinere „Feldherr“.
- source_word: δυνάμεως
  choice: Heer
  rationale: Im militärischen Zusammenhang bezeichnet δύναμις die bewaffnete Streitmacht; „Heer“ ist hier prägnant und idiomatisch.
- source_word: Ἀσσοὺρ
  choice: Assur
  rationale: Die griechische Namensform wird als Eigenname transliteriert. „Assur“ ist die im Deutschen geläufige Form und lässt offen, ob der Stammvater beziehungsweise das Volk oder das Reich gemeint ist.
- source_word: ἐναντίον
  choice: vor
  rationale: In Verbindung mit der gesamten Versammlung bezeichnet das Wort die öffentliche Gegenwart der Zuhörer; „vor“ ist im Deutschen knapp und natürlich.
- source_word: δήμου
  choice: Versammlung
  rationale: Im Kontext einer öffentlichen Rede bezeichnet δήμος die versammelte Gesamtheit und nicht bloß die Bevölkerung im Allgemeinen.
- source_word: ἀλλοφύλων
  choice: Fremden
  rationale: Das Wort bezeichnet Angehörige anderer Völker oder Stämme. Hier liegt kein zwingender Hinweis auf die spezielle Bedeutung „Philister“ vor.
theological_decisions:
- issue: Wiedergabe des Eigennamens Ἀσσοὺρ
  choice: Assur
  alternative: Assyrien beziehungsweise Assyriens
  rationale: Die Namensform wird beibehalten, statt sie stillschweigend als Reichsbezeichnung zu deuten. Eine Fußnote nennt die mögliche geografisch-politische Auffassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Erzählfolge, bleibt aber flüssig. „Tumult“, „Ratsversammlung“ und „Oberbefehlshaber“ bewahren den öffentlichen und militärischen Ton; die Doppeldeutigkeit von Assur wird nicht im Haupttext aufgelöst.
