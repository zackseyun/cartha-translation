  text: And when the men of the city saw them on the top of the mountain, they took up their weapons and went out of the city to the top of the mountain; and every man who used a sling held back their ascent and kept throwing stones at them.
translation:
  language: de
  text: Als die Männer der Stadt sie auf dem Gipfel des Berges sahen, nahmen sie ihre Waffen und zogen aus der Stadt hinauf auf den Gipfel des Berges. Jeder Schleuderer[a] hielt sie beim Aufstieg auf und bewarf sie mit Steinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: jeder Mann, ein Schleuderer.'
    reason: Die Fußnote macht sichtbar, dass der griechische Text neben der Berufsbezeichnung ausdrücklich ἀνήρ („Mann“) verwendet.
lexical_decisions:
- source_word: καὶ ὡς εἶδαν
  choice: Als … sahen
  rationale: ὡς mit dem Aorist leitet hier einen zeitlichen Nebensatz ein; „als“ gibt den auslösenden Vorgang im Deutschen natürlich wieder.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: die Männer der Stadt
  rationale: Die ausdrücklich maskuline Personenbezeichnung wird direkt und in gegenwärtigem Standarddeutsch wiedergegeben.
- source_word: ἐπὶ τὴν κορυφὴν τοῦ ὄρους
  choice: oben auf dem Berg / auf den Gipfel des Berges
  rationale: κορυφή bezeichnet den höchsten Punkt oder Gipfel. Beim Sehen ist die deutsche Ortsangabe „oben auf dem Berg“ idiomatisch; beim gerichteten Hinaufziehen verdeutlicht „auf den Gipfel“ die Bewegung.
- source_word: ἀνέλαβον τὰ ὅπλα αὐτῶν
  choice: nahmen sie ihre Waffen
  rationale: ἀναλαμβάνω bezeichnet hier das Ergreifen beziehungsweise Aufnehmen der Waffen zum Einsatz; „Waffen nehmen“ ist klar und würdig.
- source_word: ἐπῆλθον ἔξω τῆς πόλεως
  choice: zogen aus der Stadt hinauf
  rationale: Die Form bezeichnet eine gerichtete Bewegung; zusammen mit dem folgenden Ziel gibt „zogen … hinauf“ sowohl das Verlassen der Stadt als auch den Aufstieg wieder.
- source_word: πᾶς ἀνὴρ σφενδονήτης
  choice: Jeder Schleuderer
  rationale: σφενδονήτης ist die Bezeichnung eines mit der Schleuder kämpfenden Mannes. „Jeder Schleuderer“ wahrt den distributiven Sinn von πᾶς und ist knapper und natürlicher als eine Umschreibung.
- source_word: διεκράτησαν τὴν ἀνάβασιν αὐτῶν
  choice: hielt sie beim Aufstieg auf
  rationale: Die Wendung beschreibt das Hemmen oder Aufhalten des gegnerischen Hinaufsteigens; die personenbezogene deutsche Fassung vermeidet die schwerfällige Formulierung „hielt ihren Aufstieg auf“.
- source_word: ἔβαλλον ἐν λίθοις ἐπʼ αὐτούς
  choice: bewarf sie mit Steinen
  rationale: Das Imperfekt schildert den andauernden beziehungsweise wiederholten Steinwurf. „Bewerfen“ trägt diesen wiederholten Charakter im Deutschen bereits in sich.
