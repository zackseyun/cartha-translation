translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit erzählerisch-würdigem Ton. Die Wiederholung von „Berg“ und „Gipfel“ bleibt nahe an der räumlichen Abfolge des griechischen Textes; das Semikolon wurde zugunsten natürlicher deutscher Satzgliederung durch einen Punkt ersetzt.
