base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/014.yaml
  text: Then the sons of Israel came down from their city and confronted him[a]; and after untying him, they brought him to Bethyloua and brought him before the rulers of their city[c][b],
translation:
  language: de
  text: Da kamen die Söhne Israels[a] aus ihrer Stadt herab und traten zu ihm[b]. Sie banden ihn los, brachten ihn nach Betylua und stellten ihn vor die Obersten ihrer Stadt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Israeliten«. Im Griechischen steht die traditionelle biblische Bezeichnung »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb kann je nach Zusammenhang auch bedeuten: »traten an ihn heran«, »kamen zu ihm« oder »stellten sich zu ihm«.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: Sie führten ihn den städtischen Autoritäten vor. Das Verb bedeutet hier nicht, dass sie ihn über diese Männer einsetzten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβάντες
  choice: kamen … herab
  rationale: Gibt die räumliche Abwärtsbewegung aus der Stadt wieder und verbindet das vorzeitige Partizip natürlich mit dem Hauptsatz.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  rationale: Bewahrt die traditionelle biblische Personenbezeichnung und die ausdrücklich männliche Verwandtschaftsform des Griechischen.
- source_word: ἐπέστησαν αὐτῷ
  choice: traten zu ihm
  rationale: Gibt das Herantreten in diesem Zusammenhang natürlich wieder, ohne dem Verb unnötig eine feindselige Bedeutung zu geben; seine Bedeutungsbreite wird in einer Fußnote kenntlich gemacht.
- source_word: λύσαντες αὐτόν
  choice: Sie banden ihn los
  rationale: Bezeichnet konkret das Lösen seiner Fesseln und ist im modernen Deutschen anschaulich und idiomatisch.
- source_word: ἀπήγαγον
  choice: brachten ihn
  rationale: Passt zur ausdrücklich genannten Zielangabe und gibt das Wegführen beziehungsweise Hinbringen ohne unnötige Zusätze wieder.
- source_word: εἰς τὴν Βετυλουά
  choice: nach Betylua
  rationale: Verwendet für eine Ortsangabe die natürliche deutsche Präposition und gibt den griechischen Ortsnamen in naher Transliteration wieder.
- source_word: κατέστησαν αὐτὸν ἐπὶ τοὺς ἄρχοντας
  choice: stellten ihn vor die Obersten
  rationale: Gibt das Vorführen vor die städtischen Autoritäten wieder; eine Ernennung über sie ist im Kontext nicht gemeint.
- source_word: οἱ ἄρχοντες
  choice: die Obersten
  rationale: Bezeichnet allgemein die maßgeblichen Amtsträger der Stadt, ohne eine im Text nicht näher bestimmte Verwaltungsordnung vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bezeichnung »Söhne Israels« bleibt erhalten; Satzbau und Partizipialgefüge wurden für flüssiges Deutsch behutsam aufgelöst. Die Mehrdeutigkeit von ἐπέστησαν wird nicht durch eine unnötig feindselige Übersetzung verengt.
