  text: and he will not perish until you are destroyed with them[a].
translation:
  language: de
  text: Und er wird nicht umkommen, bis du zusammen mit ihnen völlig vernichtet wirst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολῇ
  choice: wird nicht umkommen
  rationale: Die mittelpassivisch/intransitive Form von ἀπόλλυμι bezeichnet hier das Zugrundegehen. „Umkommen“ bewahrt diese intransitive Bedeutung und klingt im modernen Deutschen natürlich.
- source_word: ἕως οὗ
  choice: bis
  rationale: Die gewöhnliche temporale Bedeutung wird mit dem knappen deutschen „bis“ genau wiedergegeben.
- source_word: ἐξολεθρευθῇς
  choice: völlig vernichtet wirst
  rationale: ἐξολεθρεύω bezeichnet eine umfassende oder vollständige Vernichtung. „Völlig vernichtet“ gibt die verstärkende Bedeutung des Verbs wieder, ohne sie abzuschwächen.
- source_word: μετʼ αὐτῶν
  choice: zusammen mit ihnen
  rationale: Die Wendung bezeichnet Begleitung beziehungsweise ein gemeinsames Schicksal; „zusammen mit ihnen“ ist eindeutig und idiomatisch.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet den Satz schlicht mit dem vorausgehenden Zusammenhang; ein adversatives „aber“ wäre nicht ausdrücklich markiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die stärkere Bedeutung von ἐξολεθρεύω wird im Haupttext ausdrücklich wiedergegeben; die mögliche passivische Deutung von ἀπολῇ bleibt in der Fußnote erhalten.
