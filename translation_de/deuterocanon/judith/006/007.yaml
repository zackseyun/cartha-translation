translation:
  language: de
  text: Und meine Diener werden dich ins Bergland zurückbringen und dich in einer der Städte an den Bergpässen absetzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einer der Städte an den Aufstiegen“. Das griechische Wort bedeutet wörtlich „Aufstiege“ und kann die ansteigenden Zugänge oder Pässe ins Bergland bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποστήσουσίν σε
  choice: werden dich … zurückbringen
  rationale: Das Futur bezeichnet hier das Zurückbringen Achiors in das Bergland. „Zurückbringen“ gibt sowohl die konkrete Bewegung als auch die rückgerichtete Bedeutung des Kompositums natürlich wieder.
- source_word: οἱ δοῦλοί μου
  choice: meine Diener
  rationale: Im militärischen Zusammenhang sind die dem Sprecher unterstellten Männer gemeint. „Diener“ bewahrt das Dienst- und Abhängigkeitsverhältnis, ohne den Text unnötig auf den rechtlichen Status von Sklaven festzulegen.
- source_word: εἰς τὴν ὀρεινήν
  choice: ins Bergland
  rationale: ἡ ὀρεινή bezeichnet eine gebirgige oder hügelige Region. „Bergland“ ist im Deutschen knapp, geografisch klar und stilistisch angemessen.
- source_word: θήσουσίν σε
  choice: dich … absetzen
  rationale: τίθημι bedeutet wörtlich „setzen, stellen, platzieren“. Bei einer Person, die an einen bestimmten Ort gebracht wird, gibt „absetzen“ die konkrete Handlung idiomatisch wieder.
- source_word: ἐν μιᾷ τῶν πόλεων
  choice: in einer der Städte
  rationale: Die Formulierung folgt der griechischen unbestimmten Auswahl aus mehreren πόλεις; „Städte“ ist die direkte Standardentsprechung.
- source_word: τῶν ἀναβάσεων
  choice: an den Bergaufstiegen
  rationale: ἀνάβασις bezeichnet wörtlich einen Aufstieg und hier wahrscheinlich die ansteigenden Zugänge ins Bergland. „Bergaufstiege“ wahrt dieses topografische Bild, ohne die Bedeutung vorschnell auf „Pässe“ einzuengen.
