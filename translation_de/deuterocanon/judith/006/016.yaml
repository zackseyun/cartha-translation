  text: And he called together all the elders of the city, and all their young men and women ran together into the assembly, and they set Achior in the midst of all their people, and Uzziah asked him what had happened.
translation:
  language: de
  text: Und er rief alle Ältesten der Stadt zusammen. Alle jungen Männer und Frauen eilten zur Versammlung. Sie stellten Achior mitten unter ihrem ganzen Volk, und Usija fragte ihn, was geschehen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: rief … zusammen
  rationale: Die deutsche Verbklammer gibt den zusammenführenden Sinn des griechischen Kompositums natürlich und genau wieder.
- source_word: πρεσβυτέρους
  choice: Ältesten
  rationale: Im städtischen Zusammenhang bezeichnet das Wort anerkannte Gemeindeleiter und nicht lediglich ältere Männer.
- source_word: συνέδραμον
  choice: eilten
  rationale: Das Verb bezeichnet ein eiliges Zusammenlaufen. „Eilten“ bewahrt die Dringlichkeit, ohne im Deutschen unnötig wörtlich oder schwerfällig zu klingen.
- source_word: πᾶς νεανίσκος … καὶ αἱ γυναῖκες
  choice: alle jungen Männer und Frauen
  rationale: Der formal singularische Ausdruck πᾶς νεανίσκος hat kollektiven beziehungsweise distributiven Sinn. Die koordinierte Wiedergabe ist im modernen Deutsch natürlich und schließt beide genannten Gruppen ein.
- source_word: ἐκκλησίαν
  choice: Versammlung
  rationale: Hier ist die versammelte Stadtgemeinschaft gemeint, nicht eine später institutionalisierte Kirche; „Versammlung“ vermeidet diesen Anachronismus.
- source_word: ἔστησαν
  choice: stellten
  rationale: Mit Akkusativobjekt und Ortsangabe bedeutet das Verb, jemanden an einem Ort aufzustellen.
- source_word: ἐν μέσῳ παντὸς τοῦ λαοῦ αὐτῶν
  choice: mitten unter ihr ganzes Volk
  rationale: Die Formulierung bewahrt sowohl die räumliche Vorstellung als auch die Hervorhebung der gesamten Gemeinschaft.
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: Das schlichte deutsche Erzählverb entspricht der hier eingeleiteten Nachfrage Usijas.
- source_word: τὸ συμβεβηκός
  choice: was geschehen war
  rationale: Die substantivierte Perfektform bezeichnet das bereits eingetretene Geschehen; das Plusquamperfekt gibt diesen zeitlichen Bezug idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit kurzen, klaren Sätzen. „Da eilten“ macht den Handlungsfortgang natürlich sichtbar, ohne zusätzliche Sachinformation einzuführen. Die Namensformen „Achior“ und „Usija“ folgen gebräuchlichen deutschen Wiedergaben.
