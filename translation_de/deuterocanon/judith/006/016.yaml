  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Ausdrücke des griechischen Textes zuverlässig wieder: das Zusammenrufen der Ältesten, das eilige Zusammenkommen der jungen Männer und Frauen, die Aufstellung Achiors vor der gesamten Gemeinschaft sowie Usijas Nachfrage. „Versammlung“ ist für ἐκκλησίαν sachgerecht und nicht anachronistisch.'
  naturalness: Der Erzählstil ist klar und modern. Allerdings ist „mitten unter ihr ganzes Volk“ bei der hier gemeinten statischen Position grammatisch nicht korrekt; erforderlich ist der Dativ „mitten unter ihrem ganzen Volk“. Das einleitende „Da“ ist nicht nötig und fügt gegenüber der einfachen Reihung mit καί einen leichten Folgeton hinzu.
  terminology: „Ältesten“, „Versammlung“, „Achior“ und „Usija“ sind passend. Die Wiedergabe „alle jungen Männer und Frauen“ ist als natürliche kollektive Formulierung vertretbar.
