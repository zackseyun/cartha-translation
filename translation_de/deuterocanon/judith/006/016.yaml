    issue: Kasus nach „unter“ in einer Ortsangabe
    rationale: ἐν μέσῳ bezeichnet eine statische Lage. Deutsch verlangt daher „mitten unter ihrem ganzen Volk“ (Dativ), nicht „mitten unter ihr ganzes Volk“ (Akkusativ).
  - severity: low
    issue: Zusätzlicher Folgeton durch „Da“
    rationale: Das griechische καί reiht die Handlung schlicht aneinander. Ohne „Da“ bleibt die Übersetzung enger am Quelltext, ohne die Lesbarkeit zu beeinträchtigen.
