base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/003.yaml
  text: But we[a], his servants, will strike them down as one man, and they will not withstand the might of our horses.
translation:
  language: de
  text: Wir aber, seine Sklaven, werden sie wie einen einzigen Mann[a] niederschlagen, und sie werden der Macht unserer Pferde nicht standhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wie einen Mann“ oder „wie einen einzelnen Mann“. Die griechische Wendung kann betonen, dass sie geschlossen gegen die Gegner vorgehen oder diese so leicht überwältigen werden, als wären sie nur ein einziger Mann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Das Wort bezeichnet Menschen, die einem Herrn gehören und ihm völlig untergeordnet sind. Im militärischen Kontext bewahrt „Sklaven“ diese deutlichere Aussage besser als das mildere „Diener“.
- source_word: πατάξομεν
  choice: werden … niederschlagen
  rationale: Das Verb bezeichnet hier einen gewaltsamen Schlag beziehungsweise das Bezwingen im Kampf; „niederschlagen“ gibt den kriegerischen Nachdruck in heutigem Deutsch wieder.
- source_word: ὡς ἄνθρωπον ἕνα
  choice: wie einen einzigen Mann
  rationale: Die möglichst nahe Wiedergabe erhält das mehrdeutige griechische Bild, das sowohl geschlossenes Vorgehen als auch die mühelose Überwältigung der Gegner ausdrücken kann.
- source_word: ὑποστήσονται
  choice: werden … nicht standhalten
  rationale: Im Zusammenhang bezeichnet das Verb das Widerstehen gegen eine überlegene Kraft; „standhalten“ ist im Deutschen natürlich und militärisch passend.
- source_word: κράτος
  choice: Macht
  rationale: Gemeint ist wirksam hervortretende, überwältigende Stärke. „Macht“ verbindet Quellennähe mit verständlichem modernem Deutsch.
- source_word: ἵππων
  choice: Pferde
  rationale: Der griechische Text nennt ausdrücklich die Pferde und nicht allgemeiner die Reiterei oder die Reiter.
theological_decisions:
- issue: Wiedergabe von δοῦλοι
  choice: Sklaven
  alternative: Diener
  rationale: „Sklaven“ wahrt die im Ausdruck liegende Besitz- und Unterordnungsbeziehung. „Diener“ wäre stilistisch milder, würde diese im prahlerischen militärischen Kontext hervorgehobene Bindung jedoch abschwächen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die martialische Prahlerei und die konkrete Bildsprache des griechischen Textes bleiben erhalten; die echte Mehrdeutigkeit der Wendung ὡς ἄνθρωπον ἕνα wird in einer Fußnote offengelegt.
