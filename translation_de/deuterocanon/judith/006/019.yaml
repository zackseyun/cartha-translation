base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/019.yaml
  text: Lord[a], God of heaven, look upon their arrogance, and have mercy on the humiliation of our people, and look upon the face of those sanctified to you on this day.
translation:
  language: de
  text: Herr, Gott des Himmels, sieh auf ihren Hochmut und erbarme dich der Erniedrigung unseres Volkes. Sieh an diesem Tag auf das Angesicht derer, die dir geheiligt sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die dir geweiht sind“; auch möglich: „deiner Heiligen“. Wörtlich steht im Griechischen: „der dir Geheiligten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ κύριε ist hier eine göttliche Anrede; „Herr“ ist die natürliche und traditionsgemäße deutsche Wiedergabe.
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: Gott des Himmels
  rationale: Die Genitivverbindung wird formal und zugleich idiomatisch als geläufiger biblischer Hoheitstitel wiedergegeben.
- source_word: κάτιδε / ἐπίβλεψον
  choice: sieh auf
  rationale: Beide Imperative bitten Gott um zugewandte Aufmerksamkeit. Die wiederholte Wiedergabe bewahrt den Parallelismus des griechischen Gebets.
- source_word: τὰς ὑπερηφανίας αὐτῶν
  choice: ihren Hochmut
  rationale: Der griechische Plural kann hochmütige Äußerungen oder Taten bezeichnen; das deutsche Kollektivum „Hochmut“ gibt die moralische Bedeutung natürlich wieder.
- source_word: ἐλέησον
  choice: erbarme dich
  rationale: „Sich erbarmen“ ist eine klare, würdevolle und im Gebetskontext geläufige Wiedergabe von ἐλεέω.
- source_word: τὴν ταπείνωσιν
  choice: der Erniedrigung
  rationale: ταπείνωσις bezeichnet hier den Zustand des Gedemütigt- und Niedergehaltenwerdens; „Erniedrigung“ wahrt sowohl Zustand als auch Schmach.
- source_word: τοῦ γένους ἡμῶν
  choice: unseres Volkes
  rationale: γένος meint in diesem Zusammenhang die gemeinschaftliche Abstammungs- und Volksgruppe; „Volk“ vermeidet missverständliche moderne Rassenbegriffe.
- source_word: τὸ πρόσωπον
  choice: das Angesicht
  rationale: Die konkrete Bildsprache von πρόσωπον bleibt erhalten; „Angesicht“ trägt den feierlichen Gebetston, ohne unverständlich zu sein.
- source_word: τῶν ἡγιασμένων σοι
  choice: derer, die dir geheiligt sind
  rationale: Die Formulierung bewahrt den passivischen Zustand des Perfektpartizips und die auf Gott bezogene Dativkonstruktion, ohne vorschnell zwischen Heiligung und kultischer Weihe zu entscheiden.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: an diesem Tag
  rationale: Dies ist die idiomatische deutsche Zeitangabe und erhält die hervorgehobene Gegenwartsbezogenheit.
theological_decisions:
- issue: Bedeutung von τῶν ἡγιασμένων σοι
  choice: derer, die dir geheiligt sind
  alternative: der dir Geweihten; deiner Heiligen
  rationale: Das Partizip kann Heiligung oder Aussonderung beziehungsweise Weihe bezeichnen. Die gewählte Form hält die verbale und passivische Aussage offen und vermeidet eine unbelegte Festlegung auf einen kultischen Stand oder eine bestimmte Gruppe „Heiliger“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gebetssprachlichem Rhythmus. Der parallele Imperativ „sieh auf“ wird wiederholt; „Angesicht“ erhält die konkrete und feierliche Bildsprache. Der Fußnotenmarker steht unmittelbar nach der auslegungsbedürftigen Wendung.
