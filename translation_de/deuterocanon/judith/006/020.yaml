lexical_decisions:
- source_word: παρεκάλεσαν
  choice: ermutigten
  rationale: παρακαλέω hat ein breites Bedeutungsspektrum, darunter ermutigen, trösten, zureden und ermahnen. Im erzählerischen Zusammenhang bezeichnet es am ehesten den unterstützenden Zuspruch an Achior; „ermutigten“ gibt dies natürlich und verständlich wieder.
- source_word: Ἀχιὼρ
  choice: Achior
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: ἐπήνεσαν
  choice: lobten
  rationale: Das Verb bezeichnet Lob oder Anerkennung. „lobten“ ist die unmittelbare und natürliche deutsche Entsprechung und passt zur Verstärkung durch σφόδρα.
- source_word: σφόδρα
  choice: sehr
  rationale: Das Adverb verstärkt das vorangehende Verb deutlich. „sehr“ ist in modernem Deutsch idiomatisch und bewahrt die Intensität ohne altertümlichen Klang.
