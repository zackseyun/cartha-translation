  text: And after going down below the mountain[a], they bound Achior and left him lying at the foot of the mountain, and they went away to their lord.
translation:
  language: de
  text: Nachdem sie zum Fuß des Berges hinabgestiegen waren, fesselten sie Achior und ließen ihn am Fuß des Berges zu Boden geworfen[a] liegen. Dann gingen sie zu ihrem Herrn fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hingeworfen«. Das griechische Partizip betont, dass Achior in dem Zustand zurückgelassen wurde, in den er durch das Hinwerfen geraten war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδύσαντες ὑποκάτω τοῦ ὄρους
  choice: Nachdem sie bis unterhalb des Berges hinabgestiegen waren
  rationale: Die temporale Konstruktion gibt das vorzeitige Aoristpartizip natürlich wieder. „Bis unterhalb des Berges“ bezeichnet eine tiefer gelegene Position, ohne irreführend ein Eindringen unter den Berg anzudeuten.
- source_word: ἔδησαν
  choice: fesselten
  rationale: Das Verb δέω bezeichnet hier das Binden zur körperlichen Einschränkung; „fesselten“ ist im Deutschen prägnant und kontextgemäß.
- source_word: ἀφῆκαν ἐρριμμένον
  choice: ließen ihn … zu Boden geworfen liegen
  rationale: Die Formulierung bewahrt sowohl das Zurücklassen als auch den durch das Perfektpassivpartizip ausgedrückten Zustand nach einem gewaltsamen Hinwerfen.
- source_word: ὑπὸ τὴν ῥίζαν τοῦ ὄρους
  choice: am Fuß des Berges
  rationale: ῥίζα bedeutet wörtlich „Wurzel“, bezeichnet topografisch jedoch den unteren Ansatz beziehungsweise Fuß eines Berges.
- source_word: ἀπῴχοντο πρὸς τὸν κύριον αὐτῶν
  choice: Dann gingen sie zu ihrem Herrn fort
  rationale: „Gingen … fort“ gibt die erzählte Entfernung wieder, ohne ausdrücklich eine im Griechischen nicht festgelegte Rückkehr zu behaupten. Der kleingeschriebene „Herr“ ist hier ihr menschlicher Vorgesetzter.
- source_word: Ἀχιὼρ
  choice: Achior
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: κύριος als Bezeichnung eines menschlichen Vorgesetzten
  choice: ihrem Herrn
  alternative: ihrem Gebieter
  rationale: Der Zusammenhang bezeichnet eindeutig den menschlichen Befehlshaber der Männer. Die Kleinschreibung und das Possessivpronomen verhindern eine Verwechslung mit einer Gottesbezeichnung, während „Herr“ die gewöhnliche Bedeutungsbreite von κύριος wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erleichtert die Lesbarkeit, ohne die Abfolge des griechischen Textes zu verändern. Die etwas markierte Wendung „zu Boden geworfen liegen“ bewahrt die im Ausgangstext hervorgehobene Zustandsbedeutung.
