  text: And in answer he reported to them the words of Holofernes’ council[a], and all the words that he had spoken in the midst of the rulers of the sons of Asshur[b], and whatever boastful things Holofernes had spoken against the house of Israel.
translation:
  language: de
  text: Da antwortete er und teilte ihnen die Worte aus der Ratsversammlung des Holofernes[a] mit, außerdem alle Worte, die Holofernes inmitten der Anführer der Söhne Assurs[b] gesagt hatte, und alles, was Holofernes großsprecherisch[c] gegen das Haus Israel geredet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Worte der Ratsversammlung des Holofernes“. Das griechische Wort kann eine Versammlung oder deren Beratung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: der Assyrer. Griechisch wörtlich: „der Söhne Assurs“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „prahlerisch“ beziehungsweise „anmaßend“. Das griechische Verb bezeichnet stolzes, großsprecherisches Reden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Darauf antwortete er
  rationale: Die partizipiale Redeformel wird in natürlichem Deutsch als einleitender Hauptsatz wiedergegeben; „darauf“ bewahrt den reaktiven Zusammenhang.
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: Das Verb bezeichnet hier die Weitergabe beziehungsweise Erstattung eines Berichts und passt präzise zum Erzählzusammenhang.
- source_word: τὰ ῥήματα τῆς συνεδρείας Ὀλοφέρνου
  choice: was in der Ratsversammlung des Holofernes gesagt worden war
  rationale: Diese idiomatische Wiedergabe wahrt den Bezug auf die dort gesprochenen Worte, ohne das im Deutschen missverständliche Kompositum „Worte des Rates“ zu verwenden.
- source_word: ἐν μέσῳ τῶν ἀρχόντων
  choice: inmitten der Anführer
  rationale: Die räumliche Bildlichkeit des Griechischen bleibt erhalten; zugleich ist verständlich, dass die Worte vor beziehungsweise unter den Anführern gesprochen wurden.
- source_word: υἱῶν Ἀσσούρ
  choice: Söhne Assurs
  rationale: Die wörtliche, stilisierte Völkerbezeichnung des griechischen Textes wird bewahrt und nicht stillschweigend zu „Assyrer“ normalisiert.
- source_word: ἐμεγαλορρημόνησεν
  choice: großsprecherisch geredet hatte
  rationale: Das seltene Verb bezeichnet stolzes, prahlerisches beziehungsweise anmaßendes Reden. Die Formulierung erhält sowohl den Sprechakt als auch dessen wertende Färbung.
- source_word: εἰς τὸν οἶκον Ἰσραήλ
  choice: gegen das Haus Israel
  rationale: Im feindseligen Kontext gibt „gegen“ die gerichtete, wider Israel gewandte Rede idiomatisch wieder; „Haus Israel“ bewahrt die biblische Kollektivbezeichnung.
theological_decisions:
- issue: Stilisierte Völkerbezeichnung υἱῶν Ἀσσούρ
  choice: Söhne Assurs
  alternative: Assyrer
  rationale: Die quellensprachliche Form bleibt sichtbar und wird nicht ethnographisch geglättet; eine Fußnote erschließt die gemeinte Volksbezeichnung.
- issue: Richtung der großsprecherischen Rede εἰς τὸν οἶκον Ἰσραήλ
  choice: gegen das Haus Israel
  alternative: über das Haus Israel / zum Haus Israel
  rationale: Der Zusammenhang legt feindseliges Reden nahe, doch die Entscheidung beruht auf Kontext und Syntax, nicht auf einer konfessionellen Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der dreifachen Aufzählung des Griechischen, wird aber durch „außerdem“ lesbarer gegliedert. Die Wiederholung des Redens bleibt bewusst erhalten.
