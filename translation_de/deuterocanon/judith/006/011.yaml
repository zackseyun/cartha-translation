  text: καὶ συνέλαβον αὐτὸν οἱ δοῦλοι αὐτοῦ καὶ ἤγαγον αὐτὸν ἔξω τῆς παρεμβολῆς εἰς τὸ πεδίον, καὶ ἀπῆραν ἐκ μέσου τῆς πεδινῆς εἰς τὴν ὀρεινήν, καὶ παρεγένοντο ἐπὶ τὰς πηγὰς αἳ ἦσαν ὑποκάτω Βετυλουά.
