  text: And his servants seized him and led him outside the camp into the plain, and they went up from the midst of the plain into the hill country, and they came to the springs that were below Bethulia.
translation:
  language: de
  text: Und seine Sklaven ergriffen ihn und führten ihn aus dem Lager hinaus in die Ebene. Aus der Mitte des Flachlands zogen sie hinauf ins Bergland und kamen zu den Quellen unterhalb von Betylua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: Diener
  rationale: Im Zusammenhang sind die Holofernes unterstellten Männer gemeint. »Diener« gibt das Autoritätsverhältnis natürlich wieder, ohne einen hier nicht eindeutig feststellbaren rechtlichen Sklavenstatus festzuschreiben.
- source_word: συνέλαβον
  choice: ergriffen
  rationale: Das Verb bezeichnet das gewaltsame oder bestimmte Ergreifen einer Person; »ergriffen« bewahrt die körperliche Handlung, ohne den rechtlichen Beiklang von »verhafteten« einzutragen.
- source_word: παρεμβολῆς
  choice: Lager
  rationale: In diesem militärischen Erzählzusammenhang bezeichnet παρεμβολή das Heerlager.
- source_word: πεδίον
  choice: Ebene
  rationale: »Ebene« bezeichnet das offene, flache Gelände und bildet den topografischen Gegensatz zum folgenden Bergland.
- source_word: ἀπῆραν
  choice: zogen sie hinauf
  rationale: Das intransitive Verb beschreibt hier den Aufbruch beziehungsweise die Bewegung der Männer; angesichts des Ziels im Bergland wird die Aufwärtsbewegung ausdrücklich wiedergegeben, ohne ein im Griechischen nicht wiederholtes Objekt einzufügen.
- source_word: ἐκ μέσου τῆς πεδινῆς
  choice: aus der Mitte des Flachlands
  rationale: Die Formulierung wahrt sowohl den Ausgangspunkt »aus der Mitte« als auch die regionale Bedeutung des substantivierten πεδινή.
- source_word: ὀρεινήν
  choice: Bergland
  rationale: Der Ausdruck bezeichnet eine gebirgige oder bergige Region und steht im Text im Gegensatz zum Flachland.
- source_word: παρεγένοντο
  choice: kamen
  rationale: Das Verb bezeichnet das Eintreffen an einem Ort; »kamen zu« ist im deutschen Erzählstil schlicht und idiomatisch.
- source_word: πηγάς
  choice: Quellen
  rationale: Gemeint sind natürliche Wasseraustritte beziehungsweise Wasserquellen in der Landschaft.
- source_word: ὑποκάτω
  choice: unterhalb
  rationale: »Unterhalb« drückt die niedrigere geografische Lage gegenüber Betylua präzise aus.
- source_word: Βετυλουά
  choice: Betylua
  rationale: Der Ortsname wird nach der griechischen Form Βετυλουά als »Betylua« transliteriert.
