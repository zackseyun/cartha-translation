base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/009.yaml
  text: And if you hope in your heart that they will not be taken[a], do not let your face fall. I have spoken[b], and none of my words will fail.
translation:
  language: de
  text: Und wenn du in deinem Herzen hoffst, dass sie nicht gefangen genommen werden[a], dann lass den Kopf nicht hängen[b]. Ich habe gesprochen, und keines meiner Worte wird unerfüllt bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass sie nicht ergriffen werden“. Das griechische Passiv kann hier im militärischen Sinn das Gefangennehmen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Lass dein Gesicht nicht fallen“; gemeint ist, nicht niedergeschlagen oder mutlos zu werden.'
    reason: idiom_explanation
lexical_decisions:
- source_word: εἶπερ
  choice: wenn … wirklich
  rationale: Die Partikel verstärkt die Bedingung leicht. „Wenn … wirklich“ gibt diesen Nachdruck natürlich wieder, ohne daraus eine Einräumung zu machen.
- source_word: ἐλπίζεις τῇ καρδίᾳ σου
  choice: du in deinem Herzen … hoffst
  rationale: Bewahrt sowohl den gegenwärtigen Vorgang des Hoffens als auch die im Griechischen ausdrücklich genannte innere Ausrichtung des Herzens.
- source_word: οὐ λημφθήσονται
  choice: sie nicht gefangen genommen werden
  rationale: Das Futur Passiv von λαμβάνω kann in diesem militärischen Zusammenhang das Gefangennehmen oder Ergreifen bezeichnen. Die gewählte Formulierung ist im Deutschen eindeutig und wahrt das Passiv.
- source_word: μὴ συμπεσέτω σου τὸ πρόσωπον
  choice: dann lass den Kopf nicht hängen
  rationale: Die wörtliche griechische Wendung vom fallenden Gesicht bezeichnet sichtbare Niedergeschlagenheit. Die entsprechende geläufige deutsche Körpermetapher vermittelt denselben Sinn und dieselbe Bildhaftigkeit.
- source_word: ἐλάλησα
  choice: Ich habe gesprochen
  rationale: Das Perfekt klingt im Deutschen als feierliche, abschließende Erklärung natürlich und passt zur anschließenden Bekräftigung.
- source_word: οὐδὲν διαπεσεῖται τῶν ῥημάτων μου
  choice: keines meiner Worte wird unerfüllt bleiben
  rationale: διαπίπτω bezeichnet hier das Ausbleiben oder Fehlschlagen des Gesagten. Die Formulierung bringt klar zum Ausdruck, dass jedes angekündigte Wort eintreffen wird.
theological_decisions:
- issue: Bildhafte Bezeichnung der Niedergeschlagenheit
  choice: lass den Kopf nicht hängen
  alternative: lass dein Gesicht nicht fallen / sei nicht niedergeschlagen
  rationale: Eine streng wörtliche Wiedergabe wäre im modernen Deutschen unverständlich oder missverständlich; die gewählte deutsche Redewendung erhält jedoch die körperliche Metapher und legt keinen zusätzlichen theologischen Sinn fest.
- issue: Gewissheit der ausgesprochenen Worte
  choice: keines meiner Worte wird unerfüllt bleiben
  alternative: keines meiner Worte wird fehlschlagen
  rationale: Die Wiedergabe wahrt den Anspruch, dass das Ausgesprochene eintreffen wird, ohne die Aussage ausdrücklich als göttliche Prophetie zu qualifizieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Satzfolge und „Ich habe gesprochen“ bewahren den autoritativen Ton; schwer verständliche Wörtlichkeit wird nur bei der griechischen Körperrede idiomatisch angepasst und in einer Fußnote offengelegt.
