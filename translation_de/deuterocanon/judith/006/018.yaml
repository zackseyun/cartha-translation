  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσόντες
  choice: warf sich … nieder
  rationale: Das aoristische Partizip bezeichnet eine der Haupthandlung vorausgehende körperliche Bewegung. Die kollektive Singularform entspricht dem deutschen Subjekt »das Volk« und vermittelt die ehrfürchtige Haltung, ohne sie bloß auszudeuten.
- source_word: ὁ λαός
  choice: das Volk
  rationale: Die übliche und kontextgerechte Wiedergabe des kollektiven Singulars λαός.
- source_word: προσεκύνησαν
  choice: betete … an
  rationale: Mit Gott als Gegenüber bezeichnet das Verb religiöse Verehrung; »anbeten« gibt dies im modernen Deutsch natürlich und eindeutig wieder.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der griechische Artikel wird bei »Gott« im Deutschen in dieser Konstruktion idiomatisch nicht wiedergegeben.
- source_word: ἐβόησαν
  choice: rief laut
  rationale: Das Verb bezeichnet einen lauten, eindringlichen Ruf. »rief laut« bewahrt die Intensität in natürlichem Deutsch.
- source_word: λέγοντες
  choice: ':'
  rationale: Das Partizip leitet den Inhalt des Rufes ein. Da dieser erst im folgenden Vers steht, erfüllt der Doppelpunkt im Deutschen dieselbe syntaktische Funktion ohne das schwerfällige »indem es sagte«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für einen kollektiven Singular natürlich gestaltet; der abschließende Doppelpunkt hält den Satz zum folgenden Vers hin offen.
