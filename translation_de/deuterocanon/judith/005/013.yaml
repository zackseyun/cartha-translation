  text: And God dried up the Red Sea before them,[a]
translation:
  language: de
  text: Und Gott trocknete das Rote Meer vor ihnen aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, dem hebräischen Exodusausdruck folgend, in manchen Übersetzungen: „das Schilfmeer“. Die griechische Quelle lautet hier „das Rote Meer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατεξήρανεν
  choice: trocknete … aus
  rationale: Das zusammengesetzte Verb bezeichnet das gründliche Austrocknen beziehungsweise Trockenmachen; „trocknete … aus“ ist im Deutschen natürlich und gibt die bewirkte Trockenlegung des Meeres wieder.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte Wiedergabe des bestimmten Subjekts; bei „Gott“ steht im Deutschen in diesem Gebrauch üblicherweise kein Artikel.
- source_word: τὴν ἐρυθρὰν θάλασσαν
  choice: das Rote Meer
  rationale: Die griechische Formulierung bezeichnet ausdrücklich das Rote Meer. Die aus der hebräischen Exodusüberlieferung bekannte Wiedergabe „Schilfmeer“ wird nicht gegen den unmittelbaren griechischen Wortlaut in den Haupttext aufgenommen, aber in einer Fußnote dokumentiert.
- source_word: ἔμπροσθεν αὐτῶν
  choice: vor ihnen
  rationale: Knappes und natürliches Deutsch für die räumliche Angabe, dass Gott das Meer vor dem Volk austrocknete.
theological_decisions:
- issue: Benennung des Meeres in der Anspielung auf den Exodus
  choice: das Rote Meer
  alternative: das Schilfmeer
  rationale: Da die vorliegende griechische Quelle ausdrücklich ἐρυθρὰν θάλασσαν lautet, folgt der Haupttext diesem Zeugen. Die hebräisch begründete Alternative bleibt aus Gründen der Transparenz in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Text, klingt aber natürlich; das trennbare Verb „austrocknen“ umschließt das Objekt und die Ortsangabe idiomatisch.
