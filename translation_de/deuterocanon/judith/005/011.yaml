  source_fidelity: Der Text gibt die feindselige Bedeutung von ἐπανέστη („erhob sich gegen sie“) zutreffend wieder. Das pluralische Subjekt bei κατεσοφίσαντο wird mit „die Ägypter“ verständlich und im Kontext sachgerecht expliziert. „Mit harter Arbeit und Ziegelherstellung“ vermittelt ἐν πόνῳ καὶ πλίνθῳ angemessen, ohne den Exodus-Bezug unnötig auszubauen. „Erniedrigten“ und „machten sie zu Sklaven“ entsprechen ἐταπείνωσαν und ἔθεντο αὐτοὺς εἰς δούλους klar und vollständig.
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem Erzählregister. Die Satzteilung erleichtert die Lesbarkeit. Die Wiederaufnahme von „gegen sie“ ist leicht redundant, macht die gegnerische Ausrichtung aber nachvollziehbar.
  terminology: „Sklaven“ ist im Kontext erzwungener Arbeit und Unterwerfung die treffende Wiedergabe von δούλους. „Ziegelherstellung“ ist eine natürliche, kontextangemessene Wiedergabe von πλίνθος in dieser Verbindung. Die Fußnote bildet die semantische Spannweite von κατεσοφίσαντο sachlich ab.
