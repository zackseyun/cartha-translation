base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/011.yaml
  text: And the king of Egypt rose up against them[a], and they dealt shrewdly with them in toil and brickmaking; they humbled them and made them servants.
translation:
  language: de
  text: Da erhob sich der König von Ägypten gegen sie, und die Ägypter gingen mit harter Arbeit und Ziegelherstellung listig gegen sie vor.[a] Sie erniedrigten sie und machten sie zu Sklaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie überlisteten sie“ beziehungsweise „sie gingen berechnend gegen sie vor“. Das griechische Verb betont ein klug geplantes oder hinterlistiges Vorgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανέστη
  choice: erhob sich … gegen
  rationale: Die Wendung bewahrt die feindselige, gegen sie gerichtete Bedeutung des Verbs und klingt zugleich würdevoll und verständlich.
- source_word: κατεσοφίσαντο
  choice: gingen … listig gegen sie vor
  rationale: Das Verb bezeichnet ein klug berechnetes oder hinterlistiges Vorgehen gegen jemanden. „Listig gegen sie vorgehen“ erhält diesen Aspekt, ohne die Folge bereits als bloße Unterdrückung auszudeuten.
- source_word: ἐν πόνῳ καὶ πλίνθῳ
  choice: mit harter Arbeit und Ziegelherstellung
  rationale: πόνος bezeichnet hier beschwerliche Arbeit; πλίνθος meint Ziegel beziehungsweise die Arbeit mit Ziegeln. „Ziegelherstellung“ gibt den im Exodus-Hintergrund naheliegenden Arbeitsvorgang idiomatisch wieder.
- source_word: ἐταπείνωσαν
  choice: erniedrigten
  rationale: Die Übersetzung wahrt den Grundsinn „niedrig machen/demütigen“ und lässt die anschließende Versklavung die konkrete Unterdrückung ausdrücken.
- source_word: δούλους
  choice: Sklaven
  rationale: Im Zusammenhang mit erzwungener Arbeit und nationaler Versklavung bezeichnet der Ausdruck keinen gewöhnlichen Dienst, sondern einen gebundenen Sklavenstatus.
theological_decisions:
- issue: Wiedergabe von δούλους bei Israels Unterdrückung in Ägypten
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Die erzwungene Unterwerfung ist in diesem Zusammenhang zentral; „Sklaven“ gibt die Härte und Unfreiheit eindeutig wieder.
- issue: Pluralisches Subjekt nach dem singularischen „König von Ägypten“
  choice: die Ägypter
  alternative: sie; seine Leute
  rationale: Die griechischen Pluralverben setzen die ausführenden Unterdrücker voraus, ohne sie nochmals zu benennen. „Die Ägypter“ macht den Bezug im Deutschen verständlich, ohne den König allein zum unmittelbaren Ausführenden aller Handlungen zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „gegen sie“ hält die feindselige Ausrichtung der beiden griechischen Verben deutlich fest. Der lange griechische Satz wurde zur besseren deutschen Lesbarkeit nach dem listigen Vorgehen geteilt.
