base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/009.yaml
  text: And their God told them to go out from their sojourning and to go into the land of Canaan[a]; and they settled there[b], and became very wealthy in gold and silver and in very many livestock.
translation:
  language: de
  text: Und ihr Gott sagte ihnen, sie sollten ihren Aufenthalt in der Fremde[a] verlassen und in das Land Kanaan ziehen. Dort ließen sie sich nieder und wurden sehr reich an Gold und Silber sowie an sehr viel Vieh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Aufenthalt als Fremde“. Das griechische Wort bezeichnet das Wohnen an einem Ort, an dem man als Fremder lebt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sie nahmen an Gold und Silber und an sehr viel Vieh stark zu“. Die griechische Formulierung betont die starke Zunahme ihres Besitzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... ἐξελθεῖν ... πορευθῆναι
  choice: sagte ihnen, sie sollten ... verlassen und ... ziehen
  rationale: Die Infinitive geben der Rede einen auffordernden Charakter. Die deutsche Konstruktion mit „sie sollten“ klingt natürlich und wahrt den Abstand zum stärkeren „befahl“.
- source_word: παροικίας
  choice: Leben in der Fremde
  rationale: παροικία bezeichnet den Aufenthalt als Fremder beziehungsweise ansässiger Fremdling. „Leben in der Fremde“ gibt diesen Sinn in verständlichem modernem Deutsch wieder.
- source_word: γῆν Χανάαν
  choice: das Land Kanaan
  rationale: Die Wiedergabe erhält sowohl γῆ als auch den geographischen Eigennamen.
- source_word: κατῴκησαν
  choice: ließen sie sich nieder
  rationale: Das Verb bezeichnet hier die Aufnahme eines festen Wohnsitzes und nicht bloß einen vorübergehenden Aufenthalt.
- source_word: ἐπληθύνθησαν χρυσίῳ καὶ ἀργυρίῳ
  choice: wurden reich an Gold und Silber
  rationale: Die wörtliche Vorstellung einer Vermehrung wird durch die genannten Besitztümer konkretisiert. „Wurden reich“ ist im Deutschen idiomatisch, ohne die Zunahme des Besitzes auf Bevölkerungswachstum umzudeuten.
- source_word: ἐν κτήνεσιν πολλοῖς σφόδρα
  choice: an überaus großen Viehbeständen
  rationale: κτήνη bezeichnet Vieh beziehungsweise Nutztiere allgemein; πολλοῖς σφόδρα hebt die außergewöhnlich große Menge hervor.
theological_decisions:
- issue: Stärke der göttlichen Rede in εἶπεν mit Infinitiven
  choice: Gott sagte ihnen, sie sollten fortziehen
  alternative: Gott befahl ihnen fortzuziehen
  rationale: Der Satz enthält eine göttliche Weisung, verwendet jedoch das allgemeine Verb „sagen“ und keine ausdrückliche Befehlsformel. Daher wird die Direktive bewahrt, ohne sie zu verstärken.
- issue: Bedeutung von ἐπληθύνθησαν bei Besitzangaben
  choice: Zunahme beziehungsweise Reichtum an Besitz
  alternative: Vermehrung der Menschen selbst
  rationale: Gold, Silber und Vieh bestimmen, worin die Vermehrung besteht. Die Übersetzung bezieht die Aussage daher auf ihren Besitz, ohne einen Bevölkerungszuwachs einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leben in der Fremde“ vermeidet das heute ungebräuchliche „Fremdlingschaft“; „Viehbestände“ ist breit genug für κτήνη und natürlicher als eine Aufzählung einzelner Tierarten.
