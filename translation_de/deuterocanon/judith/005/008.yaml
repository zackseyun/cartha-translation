base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/008.yaml
  text: They departed from the way of their fathers and worshiped the God of heaven[a], the God whom they had come to know. And they were driven out from before their gods, and fled to Mesopotamia[b], and lived there as foreigners for many days.
translation:
  language: de
  text: Sie verließen den Weg ihrer Vorfahren und beteten den Gott des Himmels an, den Gott, den sie erkannt hatten.[a] Dann vertrieb man sie von ihren Göttern weg;[b] sie flohen nach Mesopotamien und lebten dort viele Tage lang als Fremde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Gott, den sie kennengelernt hatten“. Das griechische Verb kann sowohl das Erkennen als auch das Zum-Kennen-Kommen hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Man vertrieb sie vom Angesicht ihrer Götter weg.“ Die griechische Formulierung ist syntaktisch gedrängt: Die Vertreibenden werden nicht ausdrücklich genannt, und die Wendung beschreibt die Vertreibung in Beziehung zu ihren Göttern.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξέβησαν ἐξ ὁδοῦ τῶν γονέων αὐτῶν
  choice: Sie verließen den Weg ihrer Vorfahren
  rationale: Die Wegmetapher des Griechischen bleibt erhalten. „Vorfahren“ gibt γονεῖς hier im Sinn der vorausgehenden Generationen natürlich wieder, ohne die Wendung bereits als ausdrückliche Bezeichnung einer Religion auszulegen.
- source_word: προσεκύνησαν
  choice: beteten … an
  rationale: Im religiösen Zusammenhang bezeichnet das Verb kultische Verehrung; „anbeten“ ist im Deutschen klarer als eine rein körperliche Wiedergabe wie „sich niederwerfen“.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: den Gott des Himmels
  rationale: Die geläufige biblische Gottesbezeichnung wird unmittelbar und erkennbar wiedergegeben.
- source_word: θεῷ ᾧ ἐπέγνωσαν
  choice: den Gott, den sie erkannt hatten
  rationale: ἐπιγινώσκω kann sowohl Erkennen als auch ein Zum-Kennen-Kommen ausdrücken. „Erkannt hatten“ lässt den möglichen Akzent auf einer entscheidenden Erkenntnis bestehen, ohne ihn auszudeuten.
- source_word: ἐξέβαλον αὐτοὺς ἀπὸ προσώπου τῶν θεῶν αὐτῶν
  choice: Da vertrieb man sie aus dem Bereich ihrer Götter
  rationale: Das griechische Verb steht aktiv im Plural, doch der abrupte Subjektwechsel nennt die Handelnden nicht ausdrücklich. Das unpersönliche „man“ bewahrt diese Unbestimmtheit. „Aus dem Bereich ihrer Götter“ gibt die räumlich-kultische Wendung ἀπὸ προσώπου verständlich wieder; die syntaktische Verdichtung wird in einer Fußnote kenntlich gemacht.
- source_word: ἔφυγον εἰς Μεσοποταμίαν
  choice: sie flohen nach Mesopotamien
  rationale: „Flohen“ entspricht der erzwungenen Abreise nach der Vertreibung und gibt das Ziel idiomatisch mit „nach“ wieder.
- source_word: παρῴκησαν ἐκεῖ ἡμέρας πολλάς
  choice: lebten dort viele Tage lang als Fremde
  rationale: παροικέω bezeichnet den Aufenthalt als Fremde. „Viele Tage lang“ wahrt den konkreten Zeitausdruck, statt ihn lediglich mit „lange Zeit“ zu verallgemeinern.
theological_decisions:
- issue: Abkehr vom überlieferten Weg und Hinwendung zum Gott des Himmels
  choice: Die Übersetzung spricht vom Verlassen des Weges der Vorfahren und von der Anbetung des Gottes des Himmels.
  alternative: „Sie gaben die Religion ihrer Vorfahren auf und bekehrten sich zum wahren Gott.“
  rationale: Die gewählte Fassung bewahrt die Kategorien des griechischen Textes und macht den tatsächlichen religiösen Wechsel sichtbar, ohne spätere Bekehrungs- oder Bundesbegriffe einzutragen.
- issue: Bezeichnung der früheren Gottheiten als „ihre Götter“
  choice: Die possessive Formulierung „ihrer Götter“ bleibt stehen.
  alternative: „der Götter ihrer Vorfahren“ oder „ihrer früheren Götzen“
  rationale: Das Griechische nennt sie weiterhin „ihre Götter“. Weder die zeitliche Präzisierung „früheren“ noch die wertende Bezeichnung „Götzen“ soll gegen den Wortlaut ergänzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wegmetapher und der konkrete Zeitausdruck bleiben erhalten; ungewöhnliche griechische Verdichtung wird im Haupttext verständlich wiedergegeben und in der Fußnote offengelegt.
