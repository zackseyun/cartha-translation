base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/004.yaml
  text: And why did they refuse to come to meet me[a], unlike all who dwell in the west?
translation:
  language: de
  text: Und warum weigerten sie sich, mir entgegenzukommen[a], anders als alle Bewohner des Westens?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Warum verschlossen sie ihre Ohren, sodass sie nicht kamen, mir zu begegnen?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: warum
  rationale: Leitet eine direkte Frage nach dem Grund des folgenden Verhaltens ein.
- source_word: κατενωτίσαντο
  choice: weigerten sie sich
  rationale: Das vom Wort für »Ohr« abgeleitete Verb kann bildhaft ein Nicht-Hören oder Nicht-Beachten bezeichnen; mit dem folgenden Infinitiv gibt »sich weigern« den Sinn im Deutschen natürlich wieder, während die wörtlichere Bildsprache in der Fußnote erhalten bleibt.
- source_word: τοῦ μὴ ἐλθεῖν
  choice: entgegenzukommen
  rationale: Die Konstruktion bezeichnet den Inhalt beziehungsweise die Folge der Weigerung, nicht zu kommen. Zusammen mit εἰς ἀπάντησίν μοι wird sie idiomatisch als »mir entgegenzukommen« wiedergegeben; ein im Griechischen nicht ausdrücklich vorhandenes »heraus« wird nicht ergänzt.
- source_word: εἰς ἀπάντησίν μοι
  choice: mir entgegenzukommen
  rationale: ἀπάντησις bezeichnet das Zusammentreffen oder Entgegengehen zu einer Person; die deutsche Formulierung ist natürlich und bewahrt diesen räumlichen Beiklang.
- source_word: παρὰ πάντας
  choice: anders als alle
  rationale: παρά mit Akkusativ stellt hier ihr Verhalten dem aller übrigen Bewohner des Westens gegenüber.
- source_word: τοὺς κατοικοῦντας ἐν δυσμαῖς
  choice: alle Bewohner des Westens
  rationale: Gibt die substantivierte Partizipialwendung knapp und in einem würdigen modernen Register wieder; δυσμαί bezeichnet die westlichen Gegenden beziehungsweise den Westen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit leicht gehobenem, erzählerischem Ton. Die Hauptfassung gibt das griechische Idiom natürlich wieder; die Fußnote bewahrt dessen Ohr-/Hörbild. Die kontrastive Wendung bleibt erhalten, ohne eine nicht ausdrücklich genannte Bewegungsrichtung wie »heraus« einzufügen.
