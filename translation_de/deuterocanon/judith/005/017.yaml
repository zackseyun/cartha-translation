base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/017.yaml
  text: And as long as they did not sin before their God[a], good things were with them[b], because a God who hates injustice is with them.
translation:
  language: de
  text: Und solange sie vor ihrem Gott nicht sündigten, erfuhren sie Gutes[a], denn Gott, der Unrecht hasst, ist mit ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „waren die guten Dinge bei ihnen“; gemeint sein können Wohlergehen, günstige Umstände und Gutes im umfassenden Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἕως
  choice: Und solange
  rationale: Im Zusammenhang bezeichnet die Wendung einen fortdauernden Zustand bis zu einer Veränderung; „solange“ gibt diesen zeitlich-bedingenden Sinn natürlich wieder.
- source_word: οὐχ ἥμαρτον
  choice: sie nicht sündigten
  rationale: Der negierte Aorist wird im durch „solange“ eröffneten Rahmen schlicht vergangen wiedergegeben, ohne die Aspektbedeutung unnötig festzulegen.
- source_word: ἐνώπιον τοῦ θεοῦ αὐτῶν
  choice: vor ihrem Gott
  rationale: „Vor“ bewahrt sowohl den räumlich-bildlichen als auch den wertenden Sinn von ἐνώπιον.
- source_word: ἦν μετʼ αὐτῶν τὰ ἀγαθά
  choice: war das Gute bei ihnen
  rationale: Die weit gefasste substantivierte Pluralform τὰ ἀγαθά wird im Deutschen idiomatisch als kollektives „das Gute“ wiedergegeben; dies vermeidet die Verengung auf Wohlstand oder ausdrücklich religiöse Segnungen.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion leitet die Begründung ein; „denn“ verbindet die Aussage im Deutschen flüssig, ohne ihren kausalen Sinn abzuschwächen.
- source_word: θεὸς μισῶν ἀδικίαν
  choice: ein Gott, der Unrecht hasst
  rationale: Das artikellose θεός hat hier beschreibende, qualitative Kraft. „Unrecht“ deckt den breiten moralischen und rechtlichen Bedeutungsbereich von ἀδικία ab.
- source_word: μετʼ αὐτῶν ἐστίν
  choice: ist mit ihnen
  rationale: Das Präsens des griechischen Textes bleibt erhalten und hebt die gegenwärtig-allgemeine Aussage gegenüber dem vorausgehenden Vergangenheitstempus hervor.
theological_decisions:
- issue: Tempuswechsel zwischen ἦν und ἐστίν
  choice: „war das Gute bei ihnen … ist mit ihnen“
  alternative: „war das Gute bei ihnen … war mit ihnen“
  rationale: Der griechische Text wechselt bewusst vom Imperfekt zum Präsens. Die Übersetzung bewahrt diese Spannung und glättet die Aussage über Gottes Wesen und Gegenwart nicht zu einer reinen Vergangenheitsaussage.
- issue: Bedeutungsumfang von ἀδικία
  choice: Unrecht
  alternative: Ungerechtigkeit; Unrechtmäßigkeit
  rationale: „Unrecht“ ist im heutigen Deutsch breit verständlich und lässt sowohl moralisches Fehlverhalten als auch Ungerechtigkeit anklingen, ohne einen späteren theologischen Fachbegriff einzutragen.
- issue: Referenz und qualitative Kraft des artikellosen θεός
  choice: ein Gott, der Unrecht hasst
  alternative: Gott, der Unrecht hasst
  rationale: Der unbestimmte Artikel folgt der qualitativen Formulierung des Griechischen und beschreibt, was für ein Gott der Gott Israels ist; er behauptet nicht, dass hier ein anderer Gott gemeint sei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewohnte Wendung „das Gute war bei ihnen“ bleibt bewusst quellennah und bewahrt den weiten Sinn von τὰ ἀγαθά. Der Tempuswechsel von „war“ zu „ist“ wurde nicht geglättet.
