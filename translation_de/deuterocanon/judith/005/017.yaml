    rationale: Der unbestimmte Artikel kann im Deutschen nahelegen, es handle sich um einen beliebigen Gott. Artikelloses „Gott, der Unrecht hasst“ bezeichnet klar ihren Gott und lässt die charakterisierende Partizipialaussage bestehen.
