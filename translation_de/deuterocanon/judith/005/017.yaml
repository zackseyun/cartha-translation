  naturalness: „Das Gute war bei ihnen“ wirkt im modernen Standarddeutsch unnötig fremd. „Sie erfuhren Gutes“ ist idiomatisch und behält den umfassenden Sinn der griechischen Wendung bei.
  terminology: „Sündigten“, „Unrecht“ und „Gott“ sind sachgerecht. „Ein Gott“ klingt im Deutschen leicht indefinit bzw. polytheistisch und ist hier weder nötig noch die beste Wiedergabe des artikellosen θεός, das den Gott Israels bezeichnet und zugleich dessen Eigenschaft charakterisiert.
