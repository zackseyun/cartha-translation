base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/018.yaml
  text: But when they turned away from the path that he had appointed for them[a], they were utterly destroyed in many wars, to a very great extent[b], and they were taken captive into a land not their own, and the temple of their God was laid level with the ground, and their cities were seized by their adversaries.
translation:
  language: de
  text: Als sie aber von dem Weg abwichen, den er ihnen bestimmt hatte,[a] wurden sie in vielen Kriegen in sehr großem Ausmaß vernichtet[b] und in ein Land verschleppt, das nicht ihr eigenes war. Der Tempel ihres Gottes wurde dem Erdboden gleichgemacht, und ihre Städte wurden von ihren Gegnern eingenommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann ὁδός auch einen Weg oder eine Straße bezeichnen. Hier ist bildlich die von Gott bestimmte Lebensführung gemeint.
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung verstärkt die Aussage und kann das sehr große Ausmaß oder die besondere Schwere der Vernichtung hervorheben.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἀπέστησαν ἀπὸ τῆς ὁδοῦ
  choice: von dem Weg abwichen
  rationale: Die Wendung bezeichnet das Abweichen von einer vorgeschriebenen Lebensführung. „Abwichen“ bewahrt den moralisch-religiösen Sinn, ohne ausdrücklich Abfall oder Rebellion einzutragen.
- source_word: ἧς διέθετο αὐτοῖς
  choice: den er ihnen bestimmt hatte
  rationale: Das Medium von διατίθημι bezeichnet hier den Weg, den Gott für sie festgelegt hatte. „Bestimmt“ ist natürlich und wahrt den göttlichen Bezug des Relativsatzes.
- source_word: ἐξωλεθρεύθησαν
  choice: wurden … vernichtet
  rationale: Das intensive Verb verlangt eine starke Wiedergabe. Zusammen mit „überaus schwer“ wird die Heftigkeit ausgedrückt, ohne die moderne Sonderkonnotation von „ausgerottet“ aufzudrängen.
- source_word: ἐν πολλοῖς πολέμοις
  choice: in vielen Kriegen
  rationale: Formnahe und klare Wiedergabe; πόλεμοι bezeichnet Kriege und nicht lediglich einzelne Schlachten.
- source_word: ἐπὶ πολὺ σφόδρα
  choice: überaus schwer
  rationale: Die intensive griechische Wendung verstärkt hier wahrscheinlich das Ausmaß beziehungsweise die Schwere der Vernichtung. Die deutsche Formulierung ist natürlich, lässt aber die genaue Nuance in einer Fußnote offen.
- source_word: ᾐχμαλωτεύθησαν
  choice: wurden … verschleppt
  rationale: Im Zusammenhang mit dem Ziel „in ein Land“ bezeichnet das Passiv die gewaltsame Wegführung in Gefangenschaft. „Verschleppt“ gibt diesen Vorgang prägnant wieder.
- source_word: εἰς γῆν οὐκ ἰδίαν
  choice: in ein Land …, das nicht ihnen gehörte
  rationale: Bewahrt den ausdrücklichen Besitzgegensatz des Griechischen, statt ihn lediglich mit „fremd“ zusammenzufassen.
- source_word: ὁ ναὸς τοῦ θεοῦ αὐτῶν
  choice: der Tempel ihres Gottes
  rationale: „Tempel“ ist im jüdischen Kontext die natürliche und spezifische Entsprechung für ναός.
- source_word: ἐγενήθη εἰς ἔδαφος
  choice: wurde dem Erdboden gleichgemacht
  rationale: Die deutsche Wendung erhält das Bild vollständiger Zerstörung bis auf Bodenniveau.
- source_word: ἐκρατήθησαν ὑπὸ τῶν ὑπεναντίων
  choice: wurden von ihren Gegnern eingenommen
  rationale: Bei Städten bezeichnet κρατέω im Passiv die feindliche Einnahme und Kontrolle. „Gegner“ gibt den substantivierten Ausdruck neutral und würdig wieder.
theological_decisions:
- issue: Handelnder im göttlichen Gericht
  choice: Die Abkehr von dem von Gott bestimmten Weg wird mit Vernichtung, Verschleppung und Zerstörung verbunden, ohne Gott als ausdrücklichen grammatischen Urheber jeder einzelnen Katastrophe einzufügen.
  alternative: Eine stärker deutende Übersetzung könnte Gott ausdrücklich als den Handelnden hinter allen passiven Verben nennen.
  rationale: Der griechische Text stellt einen theologischen Ursache-Wirkungs-Zusammenhang her, verwendet für die Katastrophen jedoch Passivformen. Die Übersetzung wahrt diese Spannung und ergänzt keine ausdrücklich benannte Handlungsinstanz.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge wurde zur besseren deutschen Lesbarkeit geteilt. Die Wiederholung von „und“ wurde maßvoll reduziert, ohne inhaltliche Beziehungen zu verändern.
