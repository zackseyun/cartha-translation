translation:
  language: de
  text: Und als Achior diese Worte zu Ende gesprochen hatte, murrte das ganze Volk, das das Zelt umgab und dort stand. Die Vornehmen des Holofernes und alle, die in der Küstenregion und in Moab wohnten, sagten, man solle ihn niederschlagen.[a]
