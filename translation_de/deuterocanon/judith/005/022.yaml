lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Und als
  rationale: Die geläufige griechische Erzählüberleitung wird in natürlichem modernem Deutsch wiedergegeben; ein wörtliches „Und es geschah, als“ wäre hier unnötig schwerfällig.
- source_word: ἐπαύσατο … λαλῶν τοὺς λόγους τούτους
  choice: diese Worte zu Ende gesprochen hatte
  rationale: Gibt das Aufhören des Sprechens und die zeitliche Vorordnung idiomatisch wieder.
- source_word: ἐγόγγυσεν
  choice: murrte
  rationale: Bezeichnet hörbaren, missbilligenden Unmut und bewahrt die feindselige Reaktion der Menge knapp und würdig.
- source_word: πᾶς ὁ λαὸς ὁ κυκλῶν τὴν σκηνὴν καὶ περιστὼς
  choice: das ganze Volk, das rings um das Zelt stand
  rationale: Fasst die teilweise redundanten Ortsangaben κυκλῶν und περιστώς in natürlichem Deutsch zusammen, ohne die Stellung der Menge zu verändern.
- source_word: οἱ μεγιστᾶνες Ὀλοφέρνου
  choice: die Vornehmen des Holofernes
  rationale: „Vornehme“ bezeichnet hochrangige führende Männer, ohne einen spezifischen erblichen Adelstitel vorauszusetzen.
- source_word: οἱ κατοικοῦντες τὴν παραλίαν καὶ τὴν Μωὰβ
  choice: alle Bewohner der Küstenregion und Moabs
  rationale: Gibt die beiden geografischen Bereiche knapp wieder; „Moabs“ ist im Deutschen als Gebietsbezeichnung natürlich.
- source_word: εἶπαν … συγκόψαι αὐτόν
  choice: verlangten, ihn niederzuschlagen
  rationale: „Verlangten“ überträgt die elliptische Befehlsäußerung idiomatisch. „Niederzuschlagen“ bewahrt die Gewalt des Verbs, ohne die genaue Art oder den sicheren Ausgang der Handlung festzulegen.
