  text: And he led them onto the way of Sinai and Kadesh-barnea[a]; and they drove out all who were living in the wilderness[b],
translation:
  language: de
  text: Und er führte sie auf den Weg zum Sinai und nach Kadesch-Barnea[a]; und sie vertrieben alle, die in der Wüste lebten[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf die Route zum Sinai und nach Kadesch-Barnea“. Die griechische Formulierung „der Weg des Sinai und Kadesch-Barneas“ kann die mit diesen Orten verbundene oder zu ihnen führende Route bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle Bewohner der Wüste“. Im Griechischen steht eine Partizipialkonstruktion, wörtlich: „alle in der Wüste Lebenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν
  choice: führte
  rationale: Der Aorist von ἄγω bedeutet hier im Zusammenhang der Wanderung „führen“ oder „bringen“. „Führte“ bewahrt die aktive Leitung durch das Subjekt.
- source_word: εἰς ὁδὸν
  choice: auf den Weg
  rationale: Die Wendung bezeichnet, dass jemand auf einen Weg beziehungsweise eine Route geführt wird. „Auf den Weg“ ist im Deutschen natürlich und hält am konkreten Wegbild fest.
- source_word: τοῦ Σεινὰ καὶ Καδής Βαρνή
  choice: zum Sinai und nach Kadesch-Barnea
  rationale: 'Die Genitivfügung ordnet die Ortsnamen dem „Weg“ zu und kann eine zu diesen Orten führende oder mit ihnen verbundene Route bezeichnen. Die unterschiedlichen Präpositionen entsprechen dem üblichen deutschen Gebrauch: „zum Sinai“, aber „nach Kadesch-Barnea“.'
- source_word: ἐξέβαλον
  choice: vertrieben
  rationale: ἐκβάλλω bezeichnet hier die gewaltsame Entfernung von Bewohnern aus einem Gebiet. „Vertrieben“ gibt dies im Deutschen prägnant wieder.
- source_word: πάντας
  choice: alle
  rationale: „Alle“ bewahrt den uneingeschränkten, zusammenfassenden Sinn des griechischen Ausdrucks.
- source_word: τοὺς κατοικοῦντας
  choice: die … lebten
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet die dort Wohnenden. Die verbale Wiedergabe ist modern und bewahrt die Ausdrucksweise des Griechischen.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: ἔρημος kann „Wüste“ oder „Wildnis“ bedeuten. „Wüste“ ist für den geographischen Zusammenhang der Wüstenwanderung idiomatisch und verständlich.
theological_decisions: []
