base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/015.yaml
  text: And they lived in the land of the Amorites[a], and by their strength they destroyed all the Heshbonites; and after crossing the Jordan[b], they took possession of all the hill country.
translation:
  language: de
  text: Und sie ließen sich im Land der Amoriter nieder und vernichteten mit ihrer Kraft[a] alle Heschboniter. Nachdem sie den Jordan überquert hatten, nahmen sie das ganze Bergland in Besitz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in ihrer Stärke«; auch: »durch ihre Macht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »erbten das ganze Bergland«. Das griechische Verb kann das Empfangen eines Erbbesitzes bezeichnen; hier steht es im Zusammenhang mit der Besitznahme des Landes nach der Überquerung des Jordan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾤκησαν
  choice: ließen sich … nieder
  rationale: Der Aorist von οἰκέω kann das Wohnen oder die Ansiedlung bezeichnen. Im erzählerischen Zusammenhang gibt „ließen sich nieder“ den Beginn ihres Aufenthalts natürlich wieder.
- source_word: γῇ Ἀμορραίων
  choice: Land der Amoriter
  rationale: Die Genitivverbindung bezeichnet das den Amoritern zugeordnete Gebiet; „Land der Amoriter“ ist klar und bibelsprachlich geläufig.
- source_word: ἐξωλόθρευσαν
  choice: vernichteten
  rationale: Das Verb bezeichnet vollständige Zerstörung. „Vernichteten“ bewahrt seine Stärke, ohne einen modernen Fachbegriff einzutragen.
- source_word: πάντας τοὺς Ἐσεβωνείτας
  choice: alle Heschboniter
  rationale: Das Ethnikon bezeichnet die Menschen von Heschbon. Die knappe Personenbezeichnung folgt der Form des griechischen Textes.
- source_word: ἐν τῇ ἰσχύι αὐτῶν
  choice: mit ihrer Kraft
  rationale: ἐν kann hier instrumental verstanden werden. „Mit ihrer Kraft“ ist im Deutschen natürlich und lässt zugleich die wörtlichere räumlich-modale Fassung in der Fußnote erkennen.
- source_word: διαβάντες τὸν Ἰορδάνην
  choice: Nachdem sie den Jordan überquert hatten
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Besitznahme vorausgeht; der deutsche Nebensatz macht diese zeitliche Abfolge deutlich.
- source_word: ἐκληρονόμησαν
  choice: nahmen … in Besitz
  rationale: κληρονομέω kann „erben“ oder „als Besitz erhalten“ bedeuten. Im Zusammenhang der Landnahme gibt „in Besitz nehmen“ den territorialen Sinn klar wieder, ohne die mögliche Erbvorstellung zu verschweigen.
- source_word: πᾶσαν τὴν ὀρεινήν
  choice: das ganze Bergland
  rationale: ἡ ὀρεινή bezeichnet eine gebirgige oder hochgelegene Region. „Bergland“ ist eine natürliche geografische Wiedergabe.
theological_decisions:
- issue: Bedeutungsumfang von κληρονομέω bei der Landnahme
  choice: nahmen … in Besitz
  alternative: erbten
  rationale: Die Hauptfassung beschreibt im Kontext verständlich die Aneignung des Gebiets. Die Alternative „erbten“ bewahrt die im Verb mögliche Vorstellung eines empfangenen Erbbesitzes und wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die historischen Volks- und Gebietsbezeichnungen bleiben erhalten. Die im englischen Beratungstext offenbar verrutschte Fußnote [a] wurde gemäß dem griechischen Bezug direkt bei „mit ihrer Kraft“ gesetzt.
