base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/019.yaml
  text: And now[a], having turned back to their God, they came up from the dispersion where they had been scattered there, took possession of Jerusalem, where their sanctuary was, and settled in the hill country[b], because it had been deserted.
translation:
  language: de
  text: Und nun, nachdem sie sich wieder ihrem Gott zugewandt hatten, zogen sie aus der Zerstreuung herauf, wo sie verstreut worden waren[a]. Sie nahmen Jerusalem in Besitz, wo sich ihr Heiligtum befand, und ließen sich im Bergland nieder, weil es unbewohnt war[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „wo sie dort verstreut worden waren“. Das Griechische enthält eine nach deutschem Sprachgefühl überflüssige Ortsangabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil es verlassen war“; auch „weil es öde war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: nachdem sie sich wieder ihrem Gott zugewandt hatten
  rationale: Die Wendung bezeichnet eine erneute Hinwendung und Treue zu ihrem eigenen Gott. „Sich wieder zuwenden“ bewahrt das Richtungsbild und den religiösen Sinn, ohne eine formale Bekehrung zu unterstellen.
- source_word: ἀνέβησαν
  choice: zogen sie … herauf
  rationale: ἀναβαίνω bezeichnet ein Hinaufziehen und kann in biblischer Geografie den Aufstieg in das Land beziehungsweise nach Jerusalem ausdrücken. „Heraufziehen“ erhält diese räumliche Vorstellung.
- source_word: ἐκ τῆς διασπορᾶς
  choice: aus der Zerstreuung
  rationale: Die substantivische Wiedergabe entspricht διασπορά und bewahrt den Gedanken des Verstreutseins, ohne ihn enger als „Exil“ zu deuten.
- source_word: οὗ διεσπάρησαν ἐκεῖ
  choice: wohin sie verstreut worden waren
  rationale: Die natürliche deutsche Form gibt den Ort der Zerstreuung wieder. Die im Griechischen pleonastische Verbindung von οὗ und ἐκεῖ wird in einer Fußnote kenntlich gemacht.
- source_word: κατέσχον
  choice: nahmen … in Besitz
  rationale: κατέχω bezeichnet hier das Erlangen beziehungsweise Festhalten tatsächlichen Besitzes. Die Formulierung ist präziser und weniger ausschließlich militärisch als „besetzten“.
- source_word: τὸ ἁγίασμα
  choice: ihr Heiligtum
  rationale: ἁγίασμα bezeichnet einen geheiligten Ort. „Heiligtum“ ist im Zusammenhang natürlich, ohne den Ausdruck unnötig auf ein bestimmtes Bauwerk einzuengen.
- source_word: κατῳκίσθησαν
  choice: ließen sich … nieder
  rationale: Die passive Form kann das Angesiedeltwerden oder, dem Sinn nach, das Sichniederlassen bezeichnen. Die gewählte Form ist idiomatisch und bewahrt den Gedanken einer dauerhaften Ansiedlung.
- source_word: ἐν τῇ ὀρεινῇ
  choice: im Bergland
  rationale: ἡ ὀρεινή ist eine geografische Bezeichnung für das Berg- oder Hügelland. „Bergland“ ist knapp, verständlich und in diesem Kontext sachgerecht.
- source_word: ὅτι ἦν ἔρημος
  choice: weil es unbewohnt war
  rationale: ἔρημος kann „unbewohnt“, „verlassen“ oder „öde“ bedeuten. „Unbewohnt“ erklärt im Ansiedlungskontext konkret, weshalb sie sich dort niederlassen konnten, ohne eine Verwüstung ausdrücklich vorauszusetzen.
theological_decisions:
- issue: Bundestheologische Bedeutung der erneuten Beziehung zu Gott in ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: nachdem sie sich wieder ihrem Gott zugewandt hatten
  alternative: nachdem sie zu ihrem Gott zurückgekehrt waren
  rationale: Der Satz beschreibt die erneuerte Ausrichtung auf Israels eigenen Gott, nicht die Annahme einer neuen Gottheit. „Sich wieder zuwenden“ lässt Umkehr und erneuerte Treue anklingen, ohne spätere dogmatische Fachbegriffe einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge folgt eng dem griechischen Erzählgang, wird aber zur besseren Verständlichkeit in zwei Sätze gegliedert. Ungewöhnliche Quellensprachlichkeit und die Bedeutungsbreite von ἔρημος werden durch Fußnoten bewahrt.
