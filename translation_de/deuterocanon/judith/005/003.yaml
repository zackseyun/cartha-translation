translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Fragenreihe wurde zur besseren Verständlichkeit in mehrere direkte Fragen gegliedert, während Reihenfolge und Inhalt erhalten bleiben. Der kollektive Singular »Volk« wird durchgehend mit singularischen Pronomen aufgenommen.
