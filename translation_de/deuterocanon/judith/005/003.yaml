base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/003.yaml
  text: And he said to them, “Tell me, then, sons of Canaan, who is this people that dwells in the hill country, and which cities they inhabit, and the size of their military force, and in what their power and their strength consist, and who has risen over them as king, leading their army.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Berichtet mir doch, ihr Söhne Kanaans[a]: Wer ist dieses Volk, das im Bergland wohnt[b]? Welche Städte bewohnt es? Wie groß ist seine Streitmacht[c], worin bestehen seine Macht und seine Stärke, und wer hat sich als König über sie erhoben und führt ihr Heer?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Kanaaniter«. Wörtlich: »Söhne Kanaans«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das im Gebirgsland lebt«. Wörtlich heißt es: »das im Bergland sitzt«; »sitzen« ist hier eine Wendung für ansässiges Wohnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »wie zahlreich seine Truppen sind« beziehungsweise »welchen Umfang seine Streitkräfte haben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγγείλατέ δή μοι
  choice: Berichtet mir doch
  rationale: Der Imperativ verlangt eine Auskunft beziehungsweise Meldung; »berichtet« passt zum militärischen Erkundungskontext. »doch« gibt die nachdrückliche Gesprächspartikel δή natürlich wieder.
- source_word: υἱοὶ Χαναάν
  choice: ihr Söhne Kanaans
  rationale: Bewahrt die wörtliche Anrede des Griechischen und damit ihre familiär-ethnische Bildsprache; gemeint sind die Kanaaniter.
- source_word: ὁ λαὸς οὗτος
  choice: Was ist das für ein Volk
  rationale: Gibt die Frage nach Identität und Beschaffenheit des kollektiv singularischen λαός in natürlichem Deutsch wieder.
- source_word: ὁ καθήμενος ἐν τῇ ὀρεινῇ
  choice: das im Bergland wohnt
  rationale: καθῆμαι bedeutet wörtlich »sitzen«, bezeichnet hier aber idiomatisch den Wohnsitz; ἡ ὀρεινή ist das Berg- beziehungsweise Hügelland.
- source_word: τίνες αἱ κατοικοῦσιν πόλεις
  choice: Welche Städte bewohnt es?
  rationale: Die syntaktisch knappe griechische Frage wird im Deutschen natürlich auf den zuvor genannten kollektiven Singular »Volk« bezogen.
- source_word: τὸ πλῆθος τῆς δυνάμεως αὐτῶν
  choice: Wie groß ist seine Streitmacht
  rationale: πλῆθος bezeichnet hier Umfang oder Truppenstärke, δύναμις im Kontext die militärische Streitmacht.
- source_word: κράτος ... ἰσχύς
  choice: Macht und ... Stärke
  rationale: Die beiden überlappenden Kraftbegriffe bleiben als rhetorische Doppelung erhalten und werden nicht zu einem Begriff verschmolzen.
- source_word: ἐν τίνι
  choice: worin bestehen
  rationale: Drückt idiomatisch die Frage danach aus, worauf oder worin Macht und Stärke beruhen.
- source_word: ἀνέστηκεν ἐπʼ αὐτῶν βασιλεὺς
  choice: wer hat sich als König über dieses Volk erhoben
  rationale: Bewahrt das Aufstehens- beziehungsweise Erhebungsmotiv des Perfekts ἀνέστηκεν, ohne es vorschnell als Ernennung oder legitime Herrschaft zu deuten.
- source_word: ἡγούμενος στρατιᾶς αὐτῶν
  choice: und führt sein Heer
  rationale: Gibt das Partizip als mit dem König verbundene Leitungsfunktion wieder; »Heer« ist für στρατιά im militärischen Zusammenhang klar und würdig.
