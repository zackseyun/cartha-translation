  to: 'Und er sagte zu ihnen: »Berichtet mir doch, ihr Söhne Kanaans[a]: Wer ist dieses Volk, das im Bergland wohnt[b]? Welche Städte bewohnt es? Wie groß ist seine Streitmacht[c], worin bestehen seine Macht und seine Stärke, und wer hat sich als König über sie erhoben und führt ihr Heer?«'
