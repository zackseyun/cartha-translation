base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/021.yaml
  text: But if there is no lawlessness in their nation[a], let my lord pass by, lest perhaps their Lord and their God defend them, and we become a reproach before all the earth.
translation:
  language: de
  text: Wenn aber in ihrem Volk keine Gesetzlosigkeit herrscht, dann ziehe mein Herr an ihnen vorüber[a], damit nicht etwa ihr Herr und ihr Gott sie verteidigt und wir vor der ganzen Erde zum Gespött werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dann soll der Herr vorüberziehen.“ Im Zusammenhang ist „Herr“ am besten als respektvolle Anrede an Holofernes zu verstehen, nicht als Bezeichnung Gottes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνομία
  choice: Gesetzlosigkeit
  rationale: Der Ausdruck bezeichnet die Missachtung des Gesetzes beziehungsweise gesetzeswidriges, moralisch verwerfliches Handeln. „Gesetzlosigkeit“ bewahrt sowohl die rechtliche als auch die ethische Bedeutung.
- source_word: ἔθνος
  choice: Volk
  rationale: Gemeint ist Israel als ethnisch-politische Gemeinschaft. „Volk“ ist im Deutschen dafür natürlicher als „Nation“ und bleibt dem kollektiven Sinn des griechischen Wortes treu.
- source_word: παρελθέτω
  choice: ziehe … an ihnen vorüber
  rationale: Der Imperativ bezeichnet das Vorüber- oder Weiterziehen. Die Wendung passt zum militärischen Kontext und gibt die Aufforderung idiomatisch wieder.
- source_word: μή ποτε
  choice: damit nicht etwa
  rationale: Die Formulierung leitet die Warnung vor einem möglichen unerwünschten Ausgang ein; „nicht etwa“ bewahrt dabei den vorsichtigen Möglichkeitsakzent.
- source_word: ὑπερασπίσῃ
  choice: verteidigt
  rationale: Das Verb bedeutet, jemanden zu schützen, zu verteidigen oder für ihn einzutreten. „Verteidigt“ ist im militärischen Zusammenhang klar und prägnant.
- source_word: ὀνειδισμός
  choice: Gespött
  rationale: Das Substantiv bezeichnet öffentliche Schmach beziehungsweise den Gegenstand von Hohn. Die Konstruktion „zum Gespött werden“ gibt diesen nach außen gerichteten Ehrverlust natürlich wieder.
- source_word: πάσης τῆς γῆς
  choice: der ganzen Erde
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten. Die umfassende rhetorische Aussage legt hier „die ganze Erde“ nahe und bewahrt den Wortlaut.
- source_word: κύριος
  choice: mein Herr / ihr Herr
  rationale: Beim ersten Vorkommen ist aufgrund der Redesituation Holofernes als menschlicher Vorgesetzter angesprochen; beim zweiten bezeichnet das mit „ihr Gott“ verbundene Wort eindeutig Israels göttlichen Herrn.
theological_decisions:
- issue: Unterscheidung der beiden Vorkommen von κύριος
  choice: Das erste κύριος wird als höfliche Anrede an Holofernes mit „mein Herr“ wiedergegeben, das zweite als Gottesbezeichnung mit „ihr Herr“.
  alternative: Beide Vorkommen formal gleich mit „der Herr“ wiedergeben und die Mehrdeutigkeit offenlassen.
  rationale: Die griechische Form des ersten Vorkommens enthält kein ausdrückliches Possessivpronomen, doch der unmittelbare Erzählzusammenhang macht eine respektvolle Anrede an Holofernes sehr wahrscheinlich. Das zweite Vorkommen ist durch die Verbindung „ihr Herr und ihr Gott“ eindeutig auf Gott bezogen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Warnstruktur, ohne unnötig altertümlich zu wirken. „Volk“ und „zum Gespött werden“ sind allgemein verständlich; die Fußnote macht die formale Mehrdeutigkeit des ersten κύριος sichtbar.
