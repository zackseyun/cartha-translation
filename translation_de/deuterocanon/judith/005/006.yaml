lexical_decisions:
- source_word: ὁ λαὸς οὗτός
  choice: Dieses Volk
  rationale: λαός bezeichnet hier eine Gemeinschaft als kollektive ethnische Gruppe. „Dieses Volk“ gibt den Singular und die demonstrative Bestimmung οὗτός natürlich und würdig wieder.
- source_word: εἰσιν ἀπόγονοι
  choice: stammt … ab
  rationale: Die griechische Pluralform bezeichnet die Angehörigen des kollektiv verstandenen Volkes als Nachkommen. Im Deutschen ist die idiomatische, dem singularischen Subjekt entsprechende Wiedergabe „stammt … ab“ klarer als „sind Nachkommen“.
- source_word: Χαλδαίων
  choice: von den Chaldäern
  rationale: Der Genitiv Plural nennt die Abstammungsgruppe. Bei der deutschen Verbverbindung „abstammen von“ wird dies idiomatisch mit „von den Chaldäern“ ausgedrückt.
