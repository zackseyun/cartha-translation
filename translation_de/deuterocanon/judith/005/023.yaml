base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/023.yaml
  text: For we will not be helped by the sons of Israel; for look, they are a people in whom there is neither strength nor might for strong battle formation.
translation:
  language: de
  text: 'Denn von den Söhnen Israels wird uns keine Hilfe kommen. Seht doch: Sie sind ein Volk, das weder Kraft noch Macht für eine starke Schlachtordnung besitzt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βοηθησόμεθα ἀπό
  choice: von … wird uns keine Hilfe kommen
  rationale: Gibt die passive Zukunftsform mit Herkunftsangabe natürlich wieder, ohne die Aussage in eine aktive Handlung der Israeliten umzudeuten.
- source_word: υἱῶν Ἰσραήλ
  choice: Söhnen Israels
  rationale: Bewahrt die konkrete griechische Verwandtschaftsbezeichnung und den historischen Sprachklang.
- source_word: ἰδοὺ
  choice: Seht doch
  rationale: Markiert den auffordernden, die Aufmerksamkeit lenkenden Charakter des Ausdrucks in natürlichem Deutsch.
- source_word: δύναμις οὐδὲ κράτος
  choice: weder Kraft noch Macht
  rationale: Erhält die zwei annähernd synonymen, rhetorisch verstärkenden Begriffe des Griechischen.
- source_word: εἰς παράταξιν ἰσχυράν
  choice: zu einer starken Schlachtordnung
  rationale: παράταξις bezeichnet hier die geordnete Aufstellung zum Kampf; die etwas ungewohnte Formulierung bewahrt die militärische Bildlichkeit und die syntaktische Spannung des Ausgangstextes.
