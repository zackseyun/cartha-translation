  yaml_path: translation/deuterocanon/judith/005/020.yaml
  text: And now[a], master lord, if indeed there is an offense in this people and they are sinning against their God, and if we ascertain that this stumbling block is among them, then we will go up and make war against them;
translation:
  language: de
  text: 'Und nun, Gebieter und Herr: Wenn es in diesem Volk eine Verfehlung[a] gibt und sie gegen ihren Gott sündigen, und wenn wir feststellen, dass sich dieser Fallstrick bei ihnen findet, dann werden wir hinaufziehen und Krieg gegen sie führen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Irrtum“ beziehungsweise „unwissentlich begangene Sünde“. Das griechische Wort kann hervorheben, dass die Verfehlung aus Unwissenheit geschieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα κύριε
  choice: Gebieter und Herr
  rationale: Die doppelte Anrede wird bewahrt. „Gebieter“ gibt δέσποτα wieder, während „Herr“ κύριε entspricht; da Holofernes angeredet wird, ist „HERR“ als Gottesname ausgeschlossen.
- source_word: ἀγνόημα
  choice: Verfehlung
  rationale: „Verfehlung“ bezeichnet ein schuldhaftes Fehlverhalten, ohne festzulegen, ob es vorsätzlich oder aus Unwissenheit geschieht; diese mögliche Bedeutungsnuance wird in der Fußnote erhalten.
- source_word: ἁμαρτάνουσιν εἰς τὸν θεὸν αὐτῶν
  choice: sie gegen ihren Gott sündigen
  rationale: Die Wendung mit εἰς bezeichnet hier die Richtung des Vergehens. Das Präsens wird als andauernde oder aktuelle Handlung wiedergegeben.
- source_word: ἐπισκεψόμεθα
  choice: wir werden feststellen
  rationale: Das Verb meint hier prüfendes Ermitteln und anschließendes Feststellen, nicht bloß körperliches Besichtigen.
- source_word: σκάνδαλον
  choice: Fallstrick
  rationale: „Fallstrick“ bewahrt das Bild einer Falle beziehungsweise einer Ursache des Sturzes und passt zum Gedanken, dass die Sünde das Volk dem Untergang aussetzt.
- source_word: ἀναβησόμεθα
  choice: wir werden hinaufziehen
  rationale: Die Wiedergabe erhält sowohl den militärischen Zug als auch die mögliche topografische Bedeutung des Hinaufgehens.
- source_word: ἐκπολεμήσομεν
  choice: Krieg gegen sie führen
  rationale: Die Formulierung gibt die starke Bedeutung des zusammengesetzten Verbs als organisierten Krieg wieder, nicht nur als einzelnen Kampf.
theological_decisions:
- issue: Doppelte Anrede δέσποτα κύριε
  choice: Gebieter und Herr
  alternative: Herr; mächtiger Herr
  rationale: Beide griechischen Anredetitel bleiben sichtbar. Weil die Worte an Holofernes gerichtet sind, darf κύριε nicht als besonderer Gottesname erscheinen.
- issue: Zusammenhang zwischen Sünde und militärischer Verwundbarkeit
  choice: „Fallstrick“ bleibt als Bild stehen
  alternative: Ursache ihres Untergangs; Schuld
  rationale: Der Text verbindet die Sünde gegen Gott mit der Möglichkeit einer Niederlage, erklärt aber den theologischen Mechanismus nicht ausdrücklich. Die bildhafte Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Sprache bleibt deutlich, die doppelte Anrede wird ohne altertümliche Formen erhalten. Das Semikolon bildet die lange griechische Satzbewegung ab und hält Bedingung, Feststellung und militärische Folgerung zusammen.
