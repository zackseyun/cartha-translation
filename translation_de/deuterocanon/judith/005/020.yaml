  source_fidelity: 'Die Übersetzung gibt die Anrede, die Sünde gegen den eigenen Gott, das Bild von σκάνδαλον sowie die militärische Folgerung grundsätzlich treffend wieder. Im Entwurf ist jedoch ἐπισκεψόμεθα („wir werden feststellen/nachforschen“) nicht mehr als weiterer Bestandteil der Bedingung erkennbar: Das anschließende „dann“ lässt die Feststellung stattdessen wie eine unbedingte Vorstufe erscheinen. Die zweite Bedingung wird im revidierten Text ausdrücklich markiert.'
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. „Gebieter und Herr“, „hinaufziehen“ und „Krieg gegen sie führen“ passen zum Register. Die ergänzte Wiederholung von „wenn“ macht die verschachtelte griechische Bedingung klar und bleibt dennoch flüssig.
  terminology: „Verfehlung“ ist für ἀγνόημα angemessen und wird durch die Fußnote hinsichtlich der möglichen Unwissenheitsnuance abgesichert. „Fallstrick“ kann σκάνδαλον bildhaft wiedergeben, ohne die im Kontext nicht näher bestimmte Art des Hindernisses bzw. Anstoßes auszudeuten. Die Anrede an Holofernes bleibt zutreffend von einem Gottesnamen unterschieden.
