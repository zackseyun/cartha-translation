base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/016.yaml
  text: And they drove out from before them the Canaanite[a], the Perizzite, the Jebusite, the Shechemite, and all the Girgashites, and they lived in it for many days.
translation:
  language: de
  text: Und sie vertrieben aus ihrer Gegenwart die Kanaaniter, die Perisiter, die Jebusiter, Sichem[a] und alle Girgaschiter und wohnten viele Tage lang darin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch »Sichem«; in dieser Liste von Völkern kann damit Sichem beziehungsweise die Bevölkerung von Sichem gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλον
  choice: vertrieben
  rationale: Das Verb bezeichnet ein gewaltsames Entfernen. »Vertrieben« gibt dies im Zusammenhang der Landnahme klar und ohne Abschwächung wieder.
- source_word: ἐκ προσώπου αὐτῶν
  choice: aus ihrer Gegenwart
  rationale: Die semitisch geprägte Wendung bedeutet wörtlich eine Entfernung »von ihrem Angesicht weg«. »Aus ihrer Gegenwart« bewahrt das Bild in verständlichem Deutsch, ohne ein im Griechischen nicht ausdrücklich genanntes Land einzufügen.
- source_word: τὸν Χαναναῖον καὶ τὸν Φερεζαῖον καὶ τὸν Ἰεβουσαῖον
  choice: die Kanaaniter, die Perisiter, die Jebusiter
  rationale: Die griechischen Singularformen mit Artikel bezeichnen hier jeweils ein Volk kollektiv. Im modernen Deutschen sind die pluralischen Völkernamen natürlicher.
- source_word: τὸν Συχέμ
  choice: Sichem[a]
  rationale: Die ungewöhnliche Form steht zwischen Völkernamen, ist aber formal der Name Sichem. Die Wiedergabe als »Sichem« erhält die Mehrdeutigkeit; die Fußnote erläutert, dass die Bevölkerung Sichems gemeint sein kann.
- source_word: πάντας τοὺς Γεργεσαίους
  choice: alle Girgaschiter
  rationale: Der Plural mit πάντας wird direkt und idiomatisch wiedergegeben.
- source_word: κατῴκησαν
  choice: wohnten
  rationale: Das Verb bezeichnet hier fortdauerndes Wohnen beziehungsweise Ansässigsein. »Wohnten« ist präzise und fügt den möglichen Anfangsaspekt von »sich niederlassen« nicht ausdrücklich hinzu.
- source_word: ἐν αὐτῇ
  choice: darin
  rationale: Das feminine Pronomen verweist am ehesten auf das zuvor genannte Land. »Darin« wahrt den pronominalen Ausdruck des Griechischen.
- source_word: ἡμέρας πολλάς
  choice: viele Tage
  rationale: Die Zeitdauer wird quellennah wiedergegeben. »Lange Zeit« wäre idiomatischer, aber weniger formal entsprechend.
theological_decisions:
- issue: Die Aussage über Vertreibung und anschließendes Wohnen nicht abschwächen
  choice: sie vertrieben … und wohnten … darin
  alternative: sie zogen an ihnen vorbei und ließen sich dort nieder
  rationale: Der Vers schildert ausdrücklich die Vertreibung früherer Bewohner und den anschließenden Aufenthalt. Die Übersetzung erhält diese Spannung ohne Euphemismus oder zusätzliche theologische Bewertung.
- issue: Die Identität von Συχέμ nicht vorschnell festlegen
  choice: Sichem[a]
  alternative: die Sichemiten / die Einwohner von Sichem
  rationale: Im Kontext kann der Name kollektiv für die Menschen von Sichem stehen, doch die griechische Form nennt formal »Sichem«. Haupttext und Fußnote bewahren diese echte lexikalische Unsicherheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Völkernamen stehen nach deutschem Sprachgebrauch im Plural. Der semitisch geprägte Ausdruck »aus ihrer Gegenwart« und die Zeitangabe »viele Tage« bleiben bewusst quellennah; die ungewöhnliche Bezeichnung »Sichem« wird nicht stillschweigend vereinheitlicht.
