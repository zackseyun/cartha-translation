  terminology: Die Völkernamen sind im deutschen Plural angemessen. „Sichem“ muss wegen der Form Συχέμ im Haupttext beibehalten werden; die Fußnote erklärt vorsichtig die mögliche kollektive Bedeutung, ohne sie festzulegen. „Girgaschiter“ ist als im Deutschen etablierter biblischer Volksname vertretbar.
