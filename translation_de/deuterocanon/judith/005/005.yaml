- from: 'Und Achior, der Anführer aller Söhne Ammons[a], sagte zu ihm: »Mein Herr höre nun ein Wort aus dem Mund seines Dieners. Ich werde dir die Wahrheit über das Volk berichten, das dieses Bergland bewohnt, während du in seiner Nähe lagerst[b], und aus dem Mund deines Dieners wird keine Lüge kommen.«'
  to: 'Und Achior, der Anführer aller Söhne Ammons[a], sagte zu ihm: »Mein Herr höre nun ein Wort aus dem Mund seines Dieners. Ich werde dir die Wahrheit über das Volk berichten, das dieses Bergland bewohnt, während du in der Nähe wohnst[b], und aus dem Mund deines Dieners wird keine Lüge hervorgehen.«'
  rationale: Die Revision entfernt die nicht im griechischen Wortlaut enthaltene militärische Konkretisierung „lagerst“, bewahrt die grammatische Bezugnahme auf den Angesprochenen und lässt die im Zusammenhang mögliche alternative Einordnung weiterhin in der Fußnote erkennen. Ferner wird die Formel von der Lüge, die aus dem Mund hervorgeht, näher am griechischen Bild wiedergegeben.
