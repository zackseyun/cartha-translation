base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/005.yaml
  text: And Achior[a], the leader of all the sons of Ammon, said to him, “Let my lord now hear a word from the mouth of your servant, and I will tell you the truth about the people who dwell in this hill country near you[b], and no falsehood will come from the mouth of your servant.”
translation:
  language: de
  text: 'Und Achior, der Anführer aller Söhne Ammons[a], sagte zu ihm: »Mein Herr höre nun ein Wort aus dem Mund seines Dieners. Ich werde dir die Wahrheit über das Volk berichten, das dieses Bergland bewohnt, während du in der Nähe wohnst[b], und aus dem Mund deines Dieners wird keine Lüge hervorgehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aller Ammoniter«. Wörtlich: »aller Söhne Ammons«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »über das Volk, das dieses Bergland bewohnt, während du nahe wohnst«. Der griechische Ausdruck bezieht das Wohnen grammatisch auf den Angesprochenen; im Zusammenhang ist auch möglich: »das in diesem Bergland nahe bei dir wohnt«.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἀχιὼρ
  choice: Achior
  rationale: Der Personenname wird nach geläufiger deutscher Form wiedergegeben.
- source_word: ὁ ἡγούμενος
  choice: der Anführer
  rationale: Bezeichnet hier den führenden Mann; „Anführer“ passt zum politischen und militärischen Zusammenhang, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: πάντων υἱῶν Ἀμμών
  choice: aller Söhne Ammons
  rationale: Bewahrt das wörtliche ethnische Abstammungsbild des Griechischen; die idiomatische Alternative „aller Ammoniter“ steht in der Fußnote.
- source_word: Ἀκουσάτω δὴ λόγον ὁ κύριός μου
  choice: Mein Herr höre nun ein Wort
  rationale: Der Imperativ der dritten Person und δή ergeben eine ehrerbietige, leicht nachdrückliche Bitte.
- source_word: ἐκ στόματος τοῦ δούλου σου
  choice: aus dem Mund seines Dieners
  rationale: Die höfische Selbsterniedrigungsformel wird mit „Diener“ statt „Sklave“ wiedergegeben; das Mund-Bild bleibt erhalten. Wegen der Anrede in der dritten Person steht zunächst „seines“.
- source_word: ἀναγγελῶ σοι τὴν ἀλήθειαν
  choice: Ich werde dir die Wahrheit berichten
  rationale: ἀναγγέλλω bezeichnet das Mitteilen oder Berichten; die Wiedergabe ist natürlich und bewahrt den feierlichen Wahrheitsanspruch.
- source_word: τὴν ὀρεινὴν ταύτην
  choice: dieses Bergland
  rationale: Bezeichnet eine gebirgige Region und nicht lediglich einen einzelnen Berg.
- source_word: πλησίον σοῦ οἰκούντος
  choice: während du in seiner Nähe lagerst
  rationale: Das Genitivpartizip bezieht sich grammatisch auf das angesprochene „du“ und bedeutet wörtlich „während du nahe wohnst“. „Lagerst“ entspricht dem militärischen Kontext, ohne die syntaktische Zuordnung zum Adressaten aufzugeben.
- source_word: οὐκ ἐξελεύσεται ψεῦδος
  choice: keine Lüge wird ... kommen
  rationale: Bewahrt das griechische Bild, dass unwahre Rede aus dem Mund hervorgeht.
theological_decisions:
- issue: κύριος als Anrede an einen menschlichen Vorgesetzten
  choice: mein Herr
  alternative: mein Gebieter
  rationale: Hier bezeichnet κύριος einen menschlichen Vorgesetzten und keinen Gottesnamen. „Mein Herr“ wahrt den ehrerbietigen höfischen Ton.
- issue: δοῦλος in höfischer Selbstbezeichnung
  choice: Diener
  alternative: Sklave
  rationale: Obwohl δοῦλος auch „Sklave“ bedeuten kann, fungiert der Ausdruck hier als konventionelle Demutsformel gegenüber einem Höhergestellten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrtem höfischem Redeton. Der Wechsel von „seines Dieners“ zu „dir/deines Dieners“ folgt dem griechischen Wechsel zwischen indirekter Anrede in der dritten Person und direkter Anrede. Die schwerfällige griechische Konstruktion bei πλησίον σοῦ οἰκούντος wird verständlich wiedergegeben und ihre echte syntaktische Spannung in der Fußnote offengelegt.
