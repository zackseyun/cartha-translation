base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/007.yaml
  text: And formerly they lived as sojourners in Mesopotamia[a], because they were not willing to follow the gods of their fathers[b], who were in the land of the Chaldeans.
translation:
  language: de
  text: Und früher lebten sie als Fremde in Mesopotamien[a], weil sie den Göttern ihrer Väter[b], die im Land der Chaldäer waren, nicht folgen wollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wohnten sie als Fremde in Mesopotamien“. Das griechische Verb bezeichnet das Wohnen an einem Ort als Fremder oder ortsansässiger Fremder.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher kann der folgende Satzteil auch wiedergegeben werden: „die im Land der Chaldäer entstanden waren“. Möglich ist auch: „die aus dem Land der Chaldäer stammten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρῴκησαν
  choice: lebten sie als Fremde
  rationale: παροικέω bezeichnet das Wohnen an einem Ort mit dem Status von Fremden oder Beisassen. Die Formulierung gibt sowohl das Wohnen als auch die Fremdstellung natürlich wieder.
- source_word: τὸ πρότερον
  choice: früher
  rationale: Die adverbiale Wendung verweist auf eine frühere Zeitstufe und wird im modernen Deutsch knapp und natürlich mit „früher“ wiedergegeben.
- source_word: ἐν τῇ Μεσοποταμίᾳ
  choice: in Mesopotamien
  rationale: Verwendet die übliche deutsche Form des geografischen Namens.
- source_word: οὐκ ἐβουλήθησαν
  choice: nicht folgen wollten
  rationale: Die Form von βούλομαι drückt eine bewusste Willensentscheidung aus, ohne sie unnötig zu „weigerten sich“ zu verschärfen.
- source_word: ἀκολουθῆσαι
  choice: folgen
  rationale: Bewahrt das Bild religiöser Gefolgschaft, ohne ein im Griechischen nicht ausdrücklich vorhandenes Verb wie „verehren“ einzuführen.
- source_word: τοῖς θεοῖς τῶν πατέρων αὐτῶν
  choice: den Göttern ihrer Väter
  rationale: Gibt die konkrete familiäre Bezeichnung πατέρων genau wieder und bewahrt den Gedanken der überlieferten Religion.
- source_word: οἳ ἐγένοντο ἐν γῇ Χαλδαίων
  choice: die im Land der Chaldäer entstanden waren
  rationale: Bewahrt gegenüber dem bloßen „waren“ die Bedeutungskomponente von γίνομαι. Der ungewöhnliche griechische Ausdruck bleibt durch eine Fußnote in seiner möglichen Spannweite erkennbar.
theological_decisions:
- issue: Aussage über die Abkehr von der angestammten Religion
  choice: weil sie den Göttern ihrer Väter … nicht folgen wollten
  alternative: weil sie sich weigerten, die Götter ihrer Vorfahren zu verehren
  rationale: Der griechische Text spricht von fehlender Bereitschaft, den Göttern zu folgen, nicht ausdrücklich von Verweigerung oder Verehrung. Die Übersetzung vermeidet daher eine polemische Verstärkung.
- issue: Bezug und Sinn des Relativsatzes zu den Göttern
  choice: die im Land der Chaldäer entstanden waren
  alternative: die im Land der Chaldäer waren
  rationale: Das Relativpronomen ist grammatisch auf „Götter“ bezogen. „Entstanden waren“ nimmt die Semantik von ἐγένοντο ernst, während die Fußnote die kontextuell glattere Zustandslesart nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Als Fremde leben“ ist verständlicher als das fachsprachliche „als Beisassen wohnen“. Die Satzstellung setzt „nicht folgen wollten“ ans Ende und hält den Relativsatz eindeutig bei den Göttern.
