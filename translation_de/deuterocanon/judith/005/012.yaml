base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/012.yaml
  text: And they cried out to their God[a], and he struck the land of Egypt with plagues for which there was no healing; and the Egyptians drove them out from before them.
translation:
  language: de
  text: Sie schrien zu ihrem Gott, und er schlug das Land Ägypten mit Plagen, gegen die es keine Heilung gab. Und die Ägypter vertrieben sie von sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihrem Angesicht weg“, eine semitisch geprägte Wendung für die Vertreibung aus jemandes Gegenwart. Das Pronomen bezieht sich wahrscheinlich auf die Ägypter; grammatisch könnte es auch auf die Israeliten bezogen werden.'
    reason: lexikalische Alternative und mögliche Pronomenmehrdeutigkeit
lexical_decisions:
- source_word: ἀνεβόησαν
  choice: schrien
  rationale: Das Verb bezeichnet einen lauten, eindringlichen Ruf. Im Zusammenhang ist der Ruf an Gott gerichtet; „schrien zu“ bewahrt sowohl die Lautstärke als auch den Charakter eines Hilferufs.
- source_word: ἐπάταξεν
  choice: schlug
  rationale: πατάσσω bedeutet „schlagen“ oder „heimsuchen“. „Schlug“ gibt die kraftvolle göttliche Handlung direkt und ohne altertümliche Ausdrucksweise wieder.
- source_word: γῆν Αἴγυπτον
  choice: das Land Ägypten
  rationale: γῆ bezeichnet hier das Gebiet Ägyptens. Die Formulierung wahrt den konkreten geografischen Sinn.
- source_word: πληγαῖς
  choice: mit Plagen
  rationale: πληγή kann einen Schlag oder eine Plage bezeichnen. Wegen des deutlichen Bezugs auf den Exodus ist „Plagen“ kontextuell am treffendsten.
- source_word: ἐν αἷς οὐκ ἦν ἴασις
  choice: gegen die es keine Heilung gab
  rationale: ἴασις bedeutet „Heilung“ oder „Genesung“. Die deutsche Formulierung bewahrt das Heilungsmotiv und stellt den Bezug auf die Plagen verständlich her.
- source_word: ἐξέβαλον
  choice: vertrieben
  rationale: Das Verb bezeichnet das gewaltsame Hinauswerfen oder Fortschicken. „Vertrieben“ ist im Exoduszusammenhang prägnant und natürlich.
- source_word: ἀπὸ προσώπου αὐτῶν
  choice: von sich
  rationale: Die wörtliche Wendung „weg von ihrem Angesicht“ ist ein semitisch geprägter Ausdruck für die Entfernung aus der eigenen Gegenwart. „Von sich“ gibt diesen Sinn in heutigem Deutsch natürlich wieder; die wörtliche Form und die mögliche Pronomenmehrdeutigkeit werden in der Fußnote dokumentiert.
theological_decisions:
- issue: Bezug von αὐτῶν in ἀπὸ προσώπου αὐτῶν
  choice: 'Das Pronomen wird auf die Ägypter bezogen: Sie vertrieben die Israeliten aus ihrer eigenen Gegenwart.'
  alternative: Grammatisch kann das Pronomen isoliert betrachtet auch auf die Israeliten bezogen werden.
  rationale: Der Bezug auf das Satzsubjekt „die Ägypter“ entspricht am ehesten der semitischen Ausweisungsformel und dem Exoduszusammenhang. Da die alternative Zuordnung grammatisch nicht völlig ausgeschlossen ist, wird sie in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. Die Wiederholung von „Und“ vor dem letzten Satz bewahrt die parataktische Form des griechischen Textes, ohne unnatürlich zu wirken.
