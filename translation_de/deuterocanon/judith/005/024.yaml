base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/024.yaml
  text: Therefore we will indeed go up[a], and they will become food for all your army, master Holofernes.
translation:
  language: de
  text: Darum werden wir nun hinaufziehen[a], und sie werden deinem ganzen Heer zum Fraß werden, Gebieter Holofernes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinaufmarschieren“. Das griechische Verb kann in militärischem Zusammenhang das Hinaufziehen eines Heeres bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ δὴ
  choice: Darum ... nun
  rationale: διό kennzeichnet die Schlussfolgerung, während δή sie nachdrücklich bekräftigt; „Darum ... nun“ gibt beides in natürlichem Deutsch wieder.
- source_word: ἀναβησόμεθα
  choice: wollen wir ... hinaufziehen
  rationale: Die griechische Futurform bezeichnet hier das bevorstehende Hinaufziehen des Heeres. „Hinaufziehen“ bewahrt sowohl die räumliche als auch die militärische Bedeutung; „wollen“ gibt in diesem Zusammenhang den entschlossenen Zukunftsbezug idiomatisch wieder.
- source_word: ἔσονται εἰς κατάβρωμα
  choice: sie werden ... zum Fraß werden
  rationale: Die Verbindung von ἔσονται mit εἰς bezeichnet ein eintretendes Ergebnis. κατάβρωμα meint etwas, das verzehrt wird; „zum Fraß werden“ erhält das drastische Bild und klingt im Deutschen natürlich.
- source_word: πάσης τῆς στρατειᾶς σου
  choice: deinem ganzen Heer
  rationale: πάσης bezeichnet die Gesamtheit, στρατειά das Heer beziehungsweise die Streitmacht. „Deinem ganzen Heer“ ist präzise und idiomatisch.
- source_word: δέσποτα
  choice: Gebieter
  rationale: δέσποτα ist eine ehrerbietige Anrede für einen Machthaber oder Herrn. „Gebieter“ wahrt den hierarchischen Ton und vermeidet eine unnötig theologische Färbung von „Herr“.
- source_word: Ὀλοφέρνη
  choice: Holofernes
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
theological_decisions:
- issue: Wiedergabe von δέσποτα als direkte Anrede
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: Das griechische Wort ist δέσποτα, nicht κύριε. „Gebieter“ erhält die starke Autoritätsnuance, ohne eine besondere göttliche oder bundesbezogene Bedeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bewegung und das drastische Bild des Verzehrtwerdens bleiben erhalten; die Satzstruktur folgt dem Griechischen, ohne unnatürlich zu wirken.
