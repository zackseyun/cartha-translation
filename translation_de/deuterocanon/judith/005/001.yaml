base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/001.yaml
  text: And it was reported to Holofernes[a], the commander-in-chief of the forces of Assyria, that the sons of Israel had prepared for war, and had blocked the roads of the hill country and fortified every summit of every high mountain[b], and had set up obstacles in the plains.
translation:
  language: de
  text: Und Holofernes, dem Oberbefehlshaber der Streitmacht Assyriens, wurde berichtet, dass sich die Söhne Israels[a] zum Krieg gerüstet, die Wege des Berglands gesperrt, jeden Gipfel eines hohen Berges befestigt und in den Ebenen Hindernisse[b] aufgestellt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“ beziehungsweise „die Kinder Israels“. Wörtlich steht im Griechischen „die Söhne Israels“, eine feste Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Fallen“ oder „Sperren“. Das griechische Wort kann etwas bezeichnen, das zum Straucheln oder zu Fall bringt; hier sind militärische Hindernisse gemeint, deren genaue Art offenbleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: wurde berichtet
  rationale: Die unpersönliche Passivform gibt wieder, dass Holofernes die Nachricht erhielt, ohne einen Boten zu benennen.
- source_word: ἀρχιστρατήγῳ
  choice: dem Oberbefehlshaber
  rationale: Der zusammengesetzte Titel bezeichnet den ranghöchsten militärischen Befehlshaber und wird im Deutschen präzise und geläufig wiedergegeben.
- source_word: δυνάμεως Ἀσσούρ
  choice: der Streitmacht Assurs
  rationale: δύναμις bezeichnet hier eine bewaffnete Macht; „Streitmacht“ bewahrt den kollektiven militärischen Sinn. Die Namensform „Assur“ folgt der griechischen Bezeichnung Ἀσσούρ.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die wörtliche Wiedergabe erhält die im Griechischen übliche ethnische Bezeichnung; gemeint ist das Volk Israel.
- source_word: παρεσκευάσθησαν εἰς πόλεμον
  choice: sich zum Krieg gerüstet hatten
  rationale: Die reflexive Formulierung ist natürliches, würdevolles Deutsch für die militärische Vorbereitung und bewahrt den Bezug auf den Krieg.
- source_word: τὰς ὁδοὺς τῆς ὀρεινῆς
  choice: die Wege des Berglands
  rationale: ἡ ὀρεινή bezeichnet das bergige Land beziehungsweise Bergland; „Wege“ lässt offen, ob Straßen oder kleinere Zugänge gemeint sind.
- source_word: συνέκλεισαν
  choice: gesperrt
  rationale: Im Zusammenhang mit Verkehrswegen und Verteidigungsmaßnahmen bezeichnet das Verb ein Abriegeln oder Versperren.
- source_word: ἐτείχισαν
  choice: befestigt
  rationale: Das Verb kann wörtlich ein Ummauern bezeichnen, hat hier aber den allgemeinen militärischen Sinn, Stellungen zu befestigen.
- source_word: πᾶσαν κορυφὴν ὄρους ὑψηλοῦ
  choice: jeden Gipfel eines hohen Berges
  rationale: Die Formulierung folgt den Singularformen des Griechischen und lässt zugleich deren distributiven Sinn erkennen.
- source_word: σκάνδαλα
  choice: Hindernisse
  rationale: Im militärisch-topografischen Zusammenhang sind physische Hemmnisse gemeint. Der allgemeinere Ausdruck vermeidet eine ungesicherte Festlegung auf Fallen oder Barrikaden.
- source_word: ἐν τοῖς πεδίοις
  choice: in den Ebenen
  rationale: πέδιον bezeichnet flaches oder ebenes Gelände; der deutsche Plural entspricht dem griechischen Plural.
theological_decisions:
- issue: Ethnische Bezeichnung οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  alternative: die Israeliten / die Kinder Israels
  rationale: Die wörtliche Form hält die Ausdrucksweise der Quelle sichtbar. Eine Fußnote erklärt, dass es sich um eine feste Bezeichnung für die Israeliten handelt, ohne sie auf männliche Personen zu verengen.
- issue: Militärische Bedeutung von σκάνδαλα
  choice: Hindernisse
  alternative: Fallen / Sperren / Stolperfallen
  rationale: Der Kontext verlangt eine konkrete militärische Bedeutung, lässt aber die genaue Art der Vorrichtungen offen. „Hindernisse“ bewahrt diese Unbestimmtheit und vermeidet eine hier sachfremde theologische Deutung als „Anstoß“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Berichtssatz bleibt als zusammenhängende Satzperiode erhalten, wird aber durch eine klare deutsche Reihung lesbar gemacht. „Assur“ bewahrt die Namensform der Quelle; „Oberbefehlshaber“ und „Streitmacht“ geben den militärischen Rang und Kontext präzise wieder.
