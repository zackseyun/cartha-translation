lexical_decisions:
- source_word: ὠργίσθη θυμῷ σφόδρα
  choice: geriet in heftigen Zorn
  rationale: Die Wendung bezeichnet den Eintritt in einen Zustand starken Zorns. „Geriet in heftigen Zorn“ gibt sowohl den ingressiven Aspekt von ὠργίσθη als auch die Verstärkung durch θυμῷ σφόδρα natürlich und würdig wieder.
- source_word: ἐκάλεσεν
  choice: ließ … zusammenrufen
  rationale: Im Zusammenhang mit einem Machthaber und mehreren Amtsträgern bezeichnet das Verb ein autoritatives Einberufen. Die Formulierung ist im Deutschen idiomatischer als das bloße „rief“.
- source_word: ἄρχοντας
  choice: Herrscher
  rationale: Das Wort bezeichnet politisch führende oder regierende Personen. „Herrscher“ ist verständlich und bewahrt den Rangbezug, ohne das historisch enger gefasste „Fürsten“ vorauszusetzen.
- source_word: στρατηγοὺς
  choice: Heerführer
  rationale: Der Ausdruck bezeichnet militärische Befehlshaber. „Heerführer“ ist historisch passend, klar und weniger an moderne Dienstgrade gebunden als „Generäle“.
- source_word: σατράπας
  choice: Satrapen
  rationale: Die historische Amtsbezeichnung wird beibehalten, statt sie verallgemeinernd mit „Statthalter“ wiederzugeben.
- source_word: τῆς παραλίας
  choice: des Küstenlandes
  rationale: παραλία bezeichnet das Land beziehungsweise den Bezirk an der Küste. „Küstenland“ wahrt den geografisch-administrativen Sinn knapp und verständlich.
- source_word: Μωὰβ
  choice: Moab
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: Ἀμμὼν
  choice: Ammon
  rationale: Im Deutschen gebräuchliche biblische Namensform.
