  text: And he became very angry[a], and he summoned all the rulers of Moab, the generals of Ammon, and all the satraps of the coastland[b],
translation:
  language: de
  text: Da geriet er in heftigen Zorn[a] und rief alle Herrscher Moabs, die Heerführer Ammons und alle Satrapen des Küstenlandes[b] zusammen.
  philosophy: optimal-equivalence
