  terminology: „Hungersnot“, „als Fremde“ und „versorgt“ sind angemessen. „Geschlecht“ kann γένος im Sinn einer Abstammungsgruppe wiedergeben, ohne den anachronistischen Begriff „Rasse“ zu verwenden. Die Anmerkung sollte die möglichen Bedeutungen als Abstammungslinie, Sippe oder Volk nennen, ohne „Angehörige“ als vom Grundtext vorausgesetzte Ergänzung erscheinen zu lassen.
