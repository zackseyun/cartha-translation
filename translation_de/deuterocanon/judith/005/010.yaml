base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/010.yaml
  text: And they went down into Egypt[a], for a famine covered the face of the land of Canaan, and they lived there as sojourners until they were sustained; and there they became a very great multitude, and there was no number to their family line.
translation:
  language: de
  text: Und sie zogen hinab nach Ägypten; denn eine Hungersnot bedeckte das Land Kanaan. Dort lebten sie als Fremde, bis sie versorgt waren. Sie wurden dort zu einer sehr großen Menge, und ihr Geschlecht war unzählbar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Abstammungslinie, ihre Sippe oder ihr Volk. Das griechische Wort γένος kann eine Abstammungsgruppe, eine Sippe oder ein von gemeinsamen Vorfahren hergeleitetes Volk bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβησαν
  choice: zogen hinab
  rationale: Bewahrt die im biblischen Sprachgebrauch übliche Richtungsangabe für den Weg nach Ägypten und klingt im Deutschen natürlich.
- source_word: ἐκάλυψεν ... τὸ πρόσωπον τῆς γῆς Χανααν
  choice: hatte das Land Kanaan überzogen
  rationale: Erhält das Bild einer das Land bedeckenden Hungersnot, ohne die im modernen Deutschen schwerfällige Wendung »das Angesicht des Landes« wörtlich nachzubilden.
- source_word: λιμός
  choice: Hungersnot
  rationale: Ist im historischen Erzählzusammenhang die präzise und geläufige Wiedergabe.
- source_word: παρῴκησαν
  choice: lebten ... als Fremde
  rationale: Drückt den Aufenthalt als nicht einheimische Beisassen aus, ohne eine dauerhafte Ansiedlung vorauszusetzen.
- source_word: μέχρις οὗ διετράφησαν
  choice: bis sie versorgt waren
  rationale: Gibt den passiven Sinn des Ernährt- beziehungsweise Unterhaltenwerdens in natürlichem Deutsch wieder.
- source_word: ἐγένοντο ... εἰς πλῆθος πολύ
  choice: wurden ... zu einer sehr großen Menge
  rationale: Bewahrt sowohl den resultativen Charakter der Aussage als auch ihre starke quantitative Betonung.
- source_word: οὐκ ἦν ἀριθμὸς
  choice: waren nicht zu zählen
  rationale: Gibt die griechische Unzählbarkeitsformel idiomatisch und klar wieder.
- source_word: τοῦ γένους αὐτῶν
  choice: die Angehörigen ihres Geschlechts
  rationale: »Geschlecht« wahrt den Bezug auf gemeinsame Abstammung; »Angehörige« macht deutlich, dass von der unzählbaren Personenzahl die Rede ist.
theological_decisions:
- issue: Abstammungs- und Volksbezeichnung in τοῦ γένους αὐτῶν
  choice: die Angehörigen ihres Geschlechts
  alternative: ihr Volk; ihr Stamm; ihre Sippe
  rationale: Die Formulierung hält die genealogische und gemeinschaftliche Bedeutung offen und vermeidet moderne biologische Vorstellungen von »Rasse«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder wurden gegenüber dem langen griechischen Satz behutsam gegliedert. Das Bild der das Land bedeckenden Hungersnot bleibt in der Wendung »das Land Kanaan überzogen« erhalten; die Fremdlingsstellung und die Mehrdeutigkeit von γένος werden ausdrücklich gewahrt.
