  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: das Hinabziehen nach Ägypten, die Hungersnot in Kanaan, der Aufenthalt als Nicht-Einheimische, die Versorgung und das Anwachsen zu einer großen Menge. Im letzten Satzteil fügt „die Angehörigen“ jedoch eine personenbezogene Explizierung hinzu, die im griechischen τοῦ γένους αὐτῶν nicht ausdrücklich steht. Die Aussage betrifft die Unzählbarkeit ihres γένος als Abstammungsgruppe; sie sollte ohne diese zusätzliche Einengung formuliert werden. Außerdem ist das Plusquamperfekt „hatte ... überzogen“ gegenüber dem koordinierenden griechischen Aorist unnötig vorzeitig.'
