  text: of the strongholds of upper Cilicia. And he took all his forces[a], the foot soldiers and the horsemen and his chariots, and went away into the hill country.
translation:
  language: de
  text: der Festungen Oberkilikiens.[a] Und er nahm seine gesamte Streitmacht mit, die Fußsoldaten, die Reiter und seine Streitwagen, und zog in das Bergland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die einleitenden Worte „der Festungen Oberkilikiens“ bilden im erhaltenen griechischen Text an dieser Stelle ein Satzfragment und schließen offenbar den Gedanken des vorhergehenden Verses ab.
    reason: textual_variant
lexical_decisions:
- source_word: στερᾶς
  choice: Festungen
  rationale: Das Wort bezeichnet hier am ehesten befestigte Orte oder militärische Stützpunkte. „Festungen“ gibt diesen konkreten militärischen Sinn natürlich wieder.
- source_word: ἄνω Κιλικίας
  choice: Oberkilikiens
  rationale: Die geografische Bezeichnung wird im Deutschen idiomatisch als „Oberkilikien“ wiedergegeben; der Genitiv entspricht der griechischen Konstruktion.
- source_word: δύναμιν
  choice: Streitmacht
  rationale: Im militärischen Zusammenhang bezeichnet δύναμις die gesamte bewaffnete Truppe, die anschließend als Fußsoldaten, Reiter und Streitwagen näher bestimmt wird.
- source_word: πεζοὺς
  choice: Fußsoldaten
  rationale: Die konkrete Bezeichnung ist allgemein verständlich und bewahrt den Gegensatz zu den berittenen Kämpfern.
- source_word: ἱππεῖς
  choice: Reiter
  rationale: „Reiter“ gibt die berittenen Kämpfer knapp, konkret und in modernem Deutsch wieder.
- source_word: ἅρματα
  choice: Streitwagen
  rationale: Im militärischen Kontext sind Wagen für den Kriegseinsatz gemeint; „Streitwagen“ ist im Deutschen die geläufige und eindeutige Bezeichnung.
- source_word: ἀπῆλθεν
  choice: zog
  rationale: In Verbindung mit einer Streitmacht bezeichnet „zog“ die Abreise beziehungsweise militärische Weiterbewegung natürlicher als das wörtlichere „ging weg“.
- source_word: ὀρεινήν
  choice: Bergland
  rationale: Das substantivierte Adjektiv bezeichnet eine gebirgige Region. „Bergland“ ist prägnant, würdig und im modernen Deutsch gut verständlich.
