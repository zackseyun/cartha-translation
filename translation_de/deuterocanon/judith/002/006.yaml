  text: And you shall go out to meet all the land toward the west[b][a], because they disobeyed the word of my mouth.
translation:
  language: de
  text: Und du sollst ausziehen, um dem ganzen Land im Westen entgegenzutreten,[a] denn sie haben dem Wort aus meinem Mund nicht gehorcht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem ganzen Land nach Westen hin entgegenzutreten“. Die griechische Wendung kann sowohl eine westliche Region als auch die Richtung nach Westen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „das Wort aus meinem Mund“ meint hier das mündlich ausgesprochene Wort beziehungsweise den erteilten Befehl.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσῃ
  choice: du sollst ausziehen
  rationale: Das Futur von ἐξέρχομαι hat in der direkten Befehlsrede auffordernden Charakter. „Ausziehen“ ist im militärischen Zusammenhang natürlich, ohne die Bewegung übermäßig auszudeuten.
- source_word: εἰς συνάντησιν
  choice: um … entgegenzutreten
  rationale: Die Wendung bezeichnet das Hinausgehen zu einer Begegnung; im militärischen Kontext ist diese konfrontativ. „Entgegentreten“ bewahrt sowohl die Bewegung als auch den feindlichen Sinn.
- source_word: πάσῃ τῇ γῇ
  choice: dem ganzen Land
  rationale: Das singularische γῇ mit πᾶς bezeichnet hier am ehesten ein Gebiet als Ganzes, nicht distributiv jedes einzelne Land.
- source_word: ἐπὶ δυσμᾶς
  choice: im Westen
  rationale: Die Wendung kann eine westliche Region oder die Richtung nach Westen bezeichnen. Im Satzanschluss an „das ganze Land“ ist „im Westen“ natürlich; die Richtungsbedeutung wird in einer Fußnote offengehalten.
- source_word: ἠπείθησαν
  choice: sie haben … nicht gehorcht
  rationale: Der Aorist von ἀπειθέω bezeichnet verweigerten Gehorsam. Die deutsche Formulierung ist klar und idiomatisch.
- source_word: τῷ ῥήματι τοῦ στόματός μου
  choice: dem Wort aus meinem Mund
  rationale: Die bildhafte Genitivverbindung wird weitgehend erhalten und bezeichnet das mündlich ausgesprochene Wort beziehungsweise den Befehl.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der militärische Zusammenhang wird durch „ausziehen“ und „entgegentreten“ erkennbar, ohne zusätzliche Einzelheiten in den Text einzutragen. Die bildhafte Redeweise „Wort aus meinem Mund“ bleibt erhalten.
