  yaml_path: translation/deuterocanon/judith/002/023.yaml
  text: And he cut down Phud and Lud[a], and he plundered all the sons of Rasses and the sons of Ishmael who were opposite the wilderness[c][b], toward the south of the Chaldeans.
translation:
  language: de
  text: Und er schlug Phud und Lud[a] nieder und plünderte alle Söhne von Rasses sowie die Söhne Ismaels[b], die sich der Wüste gegenüber befanden[c], südlich der Chaldäer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Put und Lud“ oder „Phut und Lud“, nach geläufigeren biblischen Schreibweisen dieser Namen.'
    reason: lexical_alternative
  - marker: b
    text: „Die Söhne Ismaels“ kann auch mit „die Ismaeliter“ wiedergegeben werden. Der Haupttext bewahrt die genealogische Ausdrucksweise des Griechischen.
    reason: lexical_alternative
  - marker: c
    text: 'Die knappe Ortsangabe kann auch verstanden werden als: „die sich vor der Wüste befanden, südlich der Chaldäer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: διέκοψεν
  choice: schlug … nieder
  rationale: Das Verb bezeichnet wörtlich ein Durch- oder Zerschneiden und drückt hier im militärischen Zusammenhang eine gewaltsame Niederwerfung aus, ohne den knappen griechischen Wortlaut unnötig zu präzisieren.
- source_word: τὸ Φοὺδ καὶ Λούδ
  choice: Phud und Lud
  rationale: Die Namen werden entsprechend den griechischen Formen Φούδ und Λούδ transliteriert; geläufigere biblische Schreibweisen werden in einer Fußnote genannt.
- source_word: ἐπρονόμευσεν
  choice: plünderte
  rationale: Das Verb bezeichnet das Erbeuten oder Plündern im Krieg; „plünderte“ gibt diesen militärisch-wirtschaftlichen Sinn natürlich wieder.
- source_word: υἱοὺς πάντας Ῥασσεῖς
  choice: alle Söhne von Rasses
  rationale: Die Wiedergabe bewahrt die genealogisch-ethnische Ausdrucksweise mit υἱούς. Rasses bleibt wegen der unsicheren Identifikation als Eigenname erhalten.
- source_word: υἱοὺς Ἰσμαήλ
  choice: die Söhne Ismaels
  rationale: Dies entspricht der wörtlichen genealogischen Formulierung des Griechischen; die glattere ethnische Bezeichnung „Ismaeliter“ steht als Alternative in der Fußnote.
- source_word: τοὺς κατὰ πρόσωπον τῆς ἐρήμου
  choice: die der Wüste gegenüber wohnten
  rationale: κατὰ πρόσωπον bezeichnet eine Lage gegenüber oder vor etwas. „wohnten“ macht den im Deutschen erforderlichen räumlichen Bezug deutlich, ohne die unbestimmte Geografie weiter festzulegen.
- source_word: πρὸς νότον τῆς Χαλδαίων
  choice: südlich von den Chaldäern
  rationale: Die knappe Richtungs- beziehungsweise Lageangabe wird in natürlichem Deutsch wiedergegeben. Der Bezug auf die Chaldäer bleibt ebenso verdichtet wie im Griechischen.
