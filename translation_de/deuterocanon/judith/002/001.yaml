  yaml_path: translation/deuterocanon/judith/002/001.yaml
  text: And in the eighteenth year[a], on the twenty-second day of the first month, a word came in the house of Nebuchodonosor king of the Assyrians, to take vengeance on all the land[c][b], just as he had spoken.
translation:
  language: de
  text: Und im achtzehnten Jahr, am zweiundzwanzigsten Tag des ersten Monats, kam im Haus[a] Nebukadnezars, des Königs der Assyrer, ein Beschluss zustande[b], an dem ganzen Land[c] Vergeltung zu üben, wie er es gesagt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Palast“ beziehungsweise „am Hof Nebukadnezars“. Das griechische Wort bedeutet wörtlich „Haus“, kann aber auch die königliche Residenz oder den Hof bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „kam ein Wort zustande“. Die griechische Wendung kann auch bedeuten, dass eine Angelegenheit entschieden oder ein Erlass erlassen wurde; sie bezeichnet nicht ausdrücklich einen förmlichen Beschluss.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „an der ganzen Erde“. Das griechische Wort γῆ kann sowohl „Land“ als auch „Erde“ bedeuten; hier spricht der Zusammenhang eher für ein Gebiet oder Territorium.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ ὀκτωκαιδεκάτῳ
  choice: im achtzehnten Jahr
  rationale: Die natürliche deutsche Datierungsform entspricht der griechischen temporalen Konstruktion.
- source_word: δευτέρᾳ καὶ εἰκάδι τοῦ πρώτου μηνός
  choice: am zweiundzwanzigsten Tag des ersten Monats
  rationale: Die griechische Ordinalkonstruktion bezeichnet eindeutig den zweiundzwanzigsten Monatstag.
- source_word: ἐγένετο λόγος
  choice: ein Beschluss kam zustande
  rationale: Im königlichen Umfeld bezeichnet λόγος hier wahrscheinlich eine beschlossene Sache oder Anordnung. Die Formulierung bleibt weniger spezifisch als „ein Erlass wurde verkündet“ und gibt zugleich das idiomatische ἐγένετο natürlich wieder.
- source_word: ἐν οἴκῳ Ναβουχοδονοσὸρ
  choice: im Haus Nebukadnezars
  rationale: „Haus“ bewahrt den Wortlaut von οἶκος; die mögliche Bedeutung „Palast“ oder „Hof“ wird in einer Fußnote offengehalten.
- source_word: βασιλέως Ἀσσυρίων
  choice: des Königs der Assyrer
  rationale: Die Genitivfügung wird formal und verständlich wiedergegeben.
- source_word: ἐκδικῆσαι
  choice: Vergeltung zu üben
  rationale: Die Wendung gibt den Straf- und Racheaspekt wieder, ohne ein im Griechischen nicht ausdrücklich vorhandenes Reflexivpronomen einzufügen.
- source_word: πᾶσαν τὴν γῆν
  choice: am ganzen Land
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten; der territoriale Zusammenhang spricht hier für „Land“.
- source_word: καθὼς ἐλάλησεν
  choice: wie er es angekündigt hatte
  rationale: Im Kontext verweist die Wendung auf Nebukadnezars zuvor geäußerte Absicht. „Angekündigt“ ist im Deutschen natürlicher als das formal mögliche „gesprochen“.
theological_decisions:
- issue: Bedeutung von ἐγένετο λόγος im königlichen Kontext
  choice: ein Beschluss kam zustande
  alternative: ein Wort erging; eine Angelegenheit wurde entschieden; ein Erlass wurde herausgegeben
  rationale: Die Übersetzung vermeidet die zu enge Festlegung auf einen förmlichen Erlass, macht aber den sachlichen Sinn der griechischen Wendung in diesem Hofkontext verständlich.
- issue: Reichweite von γῆ
  choice: das ganze Land
  alternative: die ganze Erde
  rationale: Der Erzählzusammenhang legt eine territoriale und politische, nicht zwingend kosmische Reichweite nahe; die alternative Bedeutung bleibt in der Fußnote sichtbar.
- issue: Subjekt und Reflexivität bei ἐκδικῆσαι
  choice: Vergeltung zu üben
  alternative: sich zu rächen
  rationale: Nebukadnezar ist als Handelnder aus dem Kontext erschließbar, doch das Griechische enthält kein ausdrückliches Reflexivpronomen. Daher wird keine zusätzliche reflexive Nuance in den Haupttext eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historische Namensform „Nebukadnezar“ ist deutschsprachigen Lesern geläufig. Der Haupttext ist idiomatisch, während die Fußnoten die Mehrdeutigkeit von οἶκος, λόγος und γῆ bewahren.
