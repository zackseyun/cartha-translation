  text: For as I live[a], and by the power of my kingdom, I have spoken[b], and I will do these things by my hand.
translation:
  language: de
  text: 'Denn so wahr ich lebe[a] und bei der Macht meines Königreichs: Ich habe gesprochen und werde dies eigenhändig tun.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »lebend ich und die Macht meines Königreichs«. Die griechische Formulierung ist eine elliptische Schwurformel; κράτος kann »Macht«, »Stärke« oder »Herrschaftsgewalt« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in meiner Hand«; die Wendung bezeichnet unmittelbare persönliche Ausführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die feierliche Begründung beziehungsweise Bekräftigung der vorausgehenden Erklärung ein.
- source_word: ζῶν ἐγώ
  choice: so wahr ich lebe
  rationale: Gibt die griechische Schwurformel im heutigen Deutschen idiomatisch und würdevoll wieder.
- source_word: τὸ κράτος τῆς βασιλείας μου
  choice: so wahr die Macht meines Königreichs besteht
  rationale: κράτος bezeichnet Macht oder Stärke; wegen der elliptischen Schwurformel wird das Fortbestehen im Deutschen ergänzt, ohne die Aussage mit der Personifikation »die Macht lebt« wiederzugeben.
- source_word: λελάληκα
  choice: Ich habe gesprochen
  rationale: Bewahrt den perfektischen Aspekt und den feierlichen Ton.
- source_word: ποιήσω ταῦτα
  choice: werde dies tun
  rationale: Gibt das zukünftige ποιήσω direkt wieder; das deutsche Singularpronomen »dies« fasst die zuvor angekündigten Dinge natürlich zusammen.
- source_word: ἐν χειρί μου
  choice: mit meiner Hand
  rationale: Erhält das Handbild und bezeichnet die unmittelbare persönliche Ausführung.
theological_decisions:
- issue: Elliptische königliche Selbstbekräftigung
  choice: so wahr ich lebe und so wahr die Macht meines Königreichs besteht
  alternative: ich lebe und die Macht meines Königreichs
  rationale: Die griechische Formulierung ist schwurartig und beim zweiten Glied elliptisch. Die Ergänzung »so wahr … besteht« macht die Funktion im Deutschen verständlich, ohne aus der Macht des Königreichs ein lebendes Subjekt zu machen.
- issue: Persönliche Ausführung in ἐν χειρί μου
  choice: mit meiner Hand
  alternative: durch meine Hand
  rationale: »Mit meiner Hand« wahrt sowohl das konkrete Bild als auch den Sinn unmittelbarer persönlicher Urheberschaft, ohne eine vermittelnde Person anzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schwurformel wird zur Verständlichkeit behutsam entfaltet; die Handmetapher und der feierliche perfekte Aussagecharakter bleiben erhalten.
