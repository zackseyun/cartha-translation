  source_fidelity: Die Übersetzung gibt die Entscheidungsnuance von ἔκριναν, den finalen Infinitiv ὀλεθρεῦσαι sowie die bewusst bildhafte Wendung πᾶσαν σάρκα zuverlässig wieder. Das Plusquamperfekt „nicht gefolgt war“ ist im Deutschen als Vorzeitigkeit zum Beschluss gut begründet. Das sächliche Relativpronomen richtet sich nach dem deutschen grammatischen Kopf „alles Fleisch“; die Fußnote macht den im griechischen maskulinen Plural erkennbaren Personenbezug transparent.
  naturalness: „Und auch sie beschlossen“ ist modernes, verständliches Standarddeutsch. „Alles Fleisch“ bewahrt absichtlich biblischen Sprachklang, ohne unverständlich zu sein. „Dem Wort aus seinem Mund folgen“ ist verständlich und angemessen würdig, ohne unnötig archaisch zu wirken.
  terminology: „Vernichten“ gibt ὀλεθρεῦσαι als starke, aber nicht übersteigernde Zerstörungsabsicht wieder. „Wort“ erhält den Spielraum von λόγος; die Alternative „Befehl/Weisung“ ist zutreffend in der Fußnote erschlossen. Die Fußnotenanker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
