  text: And they too decided to destroy all flesh who had not followed the word of his mouth[a][b].
translation:
  language: de
  text: Und auch sie beschlossen, alles Fleisch[a] zu vernichten, das dem Wort aus seinem Mund[b] nicht gefolgt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „alle Menschen“ beziehungsweise „alle“. Im Griechischen steht die biblische Wendung „alles Fleisch“.
    reason: lexical_alternative
  - marker: b
    text: Oder „dem Befehl aus seinem Mund“ beziehungsweise „der von ihm ausgesprochenen Weisung“.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: Und auch sie
  rationale: Gibt sowohl die Verknüpfung durch καί als auch die hervorhebende beziehungsweise einschließende Kraft von αὐτοί wieder.
- source_word: ἔκριναν
  choice: beschlossen
  rationale: Bezeichnet hier das Fassen eines Entschlusses; „beschlossen“ ist natürlich und macht daraus nicht unnötig ein förmliches Gerichtsurteil.
- source_word: ὀλεθρεῦσαι
  choice: zu vernichten
  rationale: Gibt die beabsichtigte vollständige Zerstörung kräftig und unmittelbar wieder, ohne über den griechischen Ausdruck hinauszugehen.
- source_word: πᾶσαν σάρκα
  choice: alles Fleisch
  rationale: Bewahrt die biblische Redeweise und ihre Härte. Gemeint sein können im Zusammenhang alle betroffenen Menschen; diese idiomatische Bedeutung wird in der Fußnote genannt.
- source_word: οἳ οὐκ ἠκολούθησαν
  choice: das … nicht gefolgt war
  rationale: „Folgen“ hält das Bild von ἀκολουθέω fest, während der Bezug auf das gesprochene Wort zugleich den Sinn des Gehorchens erkennen lässt. Das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
- source_word: τῷ λόγῳ
  choice: dem Wort
  rationale: Bewahrt die lexikalische Offenheit von λόγος zwischen Wort, Weisung und Befehl, statt die Bedeutung im Haupttext festzulegen.
- source_word: τοῦ στόματος αὐτοῦ
  choice: aus seinem Mund
  rationale: Gibt die anschauliche, semitisch geprägte Wendung in verständlichem modernem Deutsch wieder und kennzeichnet das Wort als mündlich ergangen.
theological_decisions:
- issue: Wiedergabe von σάρξ in einer nichtpaulinischen biblischen Redewendung
  choice: alles Fleisch
  alternative: alle Menschen / alle
  rationale: σάρξ bezeichnet hier nicht eine „sündige Natur“, sondern steht idiomatisch für die Gesamtheit der ins Auge gefassten Lebenden beziehungsweise Menschen. Die wörtliche Wendung bewahrt die biblische Sprachgestalt, während die Fußnote die mögliche Referenz erläutert.
- issue: Bedeutungsumfang von λόγος im Zusammenhang einer Herrscherweisung
  choice: Wort
  alternative: Befehl / Weisung
  rationale: Der Zusammenhang legt eine verbindliche Anordnung nahe, doch λόγος selbst bleibt weiter. „Wort“ erhält diese Spannung, ohne den befehlenden Sinn auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. „Alles Fleisch“ und „aus seinem Mund“ bleiben im Haupttext stehen; Fußnoten erschließen die idiomatischen beziehungsweise kontextuellen Alternativen. Das Relativpronomen „das“ folgt der grammatischen Form der deutschen Wendung, während der griechische maskuline Plural οἳ den gemeinten Personenkreis nach dem Sinn aufnimmt.
