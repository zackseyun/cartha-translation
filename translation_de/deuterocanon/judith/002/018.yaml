  text: and provisions for every man in abundance[a], and very much gold and silver from the king’s house.
translation:
  language: de
  text: und Verpflegung in Fülle für jeden Mann sowie sehr viel Gold und Silber aus dem Haus des Königs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »aus der Schatzkammer des Königs« beziehungsweise »aus dem Königshaus«; wörtlich steht im Griechischen »aus dem Haus des Königs«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισιτισμὸν
  choice: Verpflegung
  rationale: Das Substantiv bezeichnet Versorgung, besonders mit Nahrung. »Verpflegung« ist im militärischen Zusammenhang natürlich, ohne den Ausdruck unnötig auf einzelne Rationen einzuengen.
- source_word: παντὶ ἀνδρὶ
  choice: für jeden Mann
  rationale: Die distributive maskuline Singularform bedeutet wörtlich »für jeden Mann«. Der militärische Kontext legt Soldaten nahe, doch der griechische Text verwendet keine ausdrückliche Bezeichnung für »Soldat«.
- source_word: εἰς πλῆθος
  choice: in Fülle
  rationale: Die Wendung bezeichnet eine reichliche Menge. »In Fülle« gibt dies knapp und idiomatisch wieder.
- source_word: χρυσίον καὶ ἀργύριον
  choice: Gold und Silber
  rationale: Der griechische Ausdruck nennt unmittelbar die beiden Edelmetalle; eine Erweiterung zu »Geld« wäre interpretierend.
- source_word: ἐξ οἴκου βασιλέως
  choice: aus dem Haus des Königs
  rationale: Dies folgt dem griechischen Wortlaut. Der Zusammenhang kann den königlichen Schatz oder die königlichen Vorräte meinen, doch der Ausgangstext legt diese institutionelle Bedeutung nicht eindeutig fest.
- source_word: σφόδρα
  choice: sehr viel
  rationale: Das Adverb verstärkt hier sinnvoll die Menge von Gold und Silber. Die deutsche Formulierung gibt diese quantitative Intensivierung natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und aufzählend. »Sowie« verbindet die beiden Ausstattungsposten flüssig, ohne ihre sachliche Gleichordnung zu verändern. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
