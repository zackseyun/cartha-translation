  source_fidelity: 'Der Entwurf gibt die Satzstruktur und alle wesentlichen griechischen Ausdrücke zutreffend wieder: Holofernes entfernt sich aus der Gegenwart seines menschlichen Herrn und lässt die drei Gruppen führender Personen des assyrischen Heeres zu sich kommen. Die Amtsbezeichnungen bleiben angemessen offen.'
  naturalness: „trat … aus der Gegenwart seines Herrn hinaus“ verbindet jedoch zwei Richtungsangaben unnötig und klingt im modernen Standarddeutsch schwerfällig. Ohne „hinaus“ ist die Bewegung ebenso klar und die Formulierung natürlicher.
  terminology: „Herr“ ist für κύριος im höfischen Kontext richtig; ein Gottesbezug wird nicht nahegelegt. „Mächtige“, „Heerführer“ und „Aufseher“ geben δυνάσται, στρατηγοί und ἐπιστάται verständlich wieder, ohne konkrete moderne Dienstgrade oder Verwaltungsränge einzutragen. „assyrisches Heer“ entspricht der militärischen Bedeutung von δύναμις.
