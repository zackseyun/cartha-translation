  text: And Holofernes went out from the presence of his lord, and he called all the nobles and the generals and overseers of the Assyrian army,
translation:
  language: de
  text: Da trat Holofernes aus der Gegenwart seines Herrn und rief alle Mächtigen, Heerführer und Aufseher des assyrischen Heeres zusammen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: trat … hinaus
  rationale: Der erzählende Aorist bezeichnet eine konkrete Bewegung nach draußen; die deutsche Wendung gibt diese anschaulich und natürlich wieder.
- source_word: ἀπὸ προσώπου
  choice: aus der Gegenwart
  rationale: Die semitisch geprägte Wendung bezeichnet das Weggehen aus der persönlichen Gegenwart eines Höhergestellten und bewahrt hier den höfischen Ton.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: seines Herrn
  rationale: κύριος bezeichnet hier Holofernes’ menschlichen Gebieter; „Herr“ entspricht dem hierarchischen Hofkontext, ohne einen Gottesbezug einzutragen.
- source_word: ἐκάλεσεν
  choice: rief … zusammen
  rationale: Im Kontext sollen die genannten Amtsträger zu ihm kommen. „Zusammenrufen“ ist idiomatisches Deutsch und legt keinen spezielleren formellen Vorgang fest.
- source_word: δυνάστας
  choice: Mächtigen
  rationale: Das Wort bezeichnet einflussreiche, hochgestellte Männer. „Mächtige“ wahrt die offene politische bzw. gesellschaftliche Rangbezeichnung besser als das enger ständische „Adlige“.
- source_word: στρατηγοὺς
  choice: Heerführer
  rationale: Die Bezeichnung meint militärische Befehlshaber; „Heerführer“ ist verständlich und vermeidet die mögliche Anachronistik eines exakt modernen Generalsrangs.
- source_word: ἐπιστάτας
  choice: Aufseher
  rationale: Der Ausdruck bezeichnet Personen mit Aufsichts- oder Leitungsfunktion, ohne ihren konkreten Rang näher festzulegen.
- source_word: τῆς δυνάμεως Ἀσσούρ
  choice: des assyrischen Heeres
  rationale: δύναμις bezeichnet im militärischen Zusammenhang das Heer bzw. die Streitmacht; Ἀσσούρ kennzeichnet dessen assyrische Zugehörigkeit.
theological_decisions:
- issue: Wiedergabe von κύριος als Titel eines menschlichen Herrschers
  choice: seines Herrn
  alternative: seines Gebieters
  rationale: Der unmittelbare Zusammenhang bezieht den Titel eindeutig auf Holofernes’ menschlichen Vorgesetzten. „Herr“ bewahrt die Titelbedeutung, ohne die Stelle auf Gott zu beziehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht höfisch-militärischem Erzählton. Die koordinierte Ämterliste und die Spannung zwischen wörtlicher Nähe und natürlicher deutscher Syntax bleiben erhalten.
