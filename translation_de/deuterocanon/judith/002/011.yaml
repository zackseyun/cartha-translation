  text: But against those who disobey, your eye shall not spare; you shall give them over to slaughter and plunder throughout all your land.
translation:
  language: de
  text: Die Ungehorsamen aber soll dein Auge nicht verschonen; du sollst sie in deinem ganzen Land dem Töten und der Plünderung preisgeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθοῦντας
  choice: die, die sich widersetzen
  rationale: Das Partizip bezeichnet Menschen, die nicht gehorchen bzw. sich einer Anordnung widersetzen. Im militärischen Zusammenhang gibt „sich widersetzen“ den aktiven Widerstand natürlicher wieder als das allgemeinere „ungehorsam sein“.
- source_word: οὐ φείσεται ὁ ὀφθαλμός σου
  choice: soll dein Auge nicht verschonen
  rationale: Die bildhafte Rede vom Auge wird bewahrt; das deutsche Modalverb gibt den im Zusammenhang gebietenden Sinn des griechischen Futurs angemessen wieder.
- source_word: δοῦναι αὐτοὺς εἰς φόνον καὶ ἁρπαγήν
  choice: du sollst sie dem Töten und der Plünderung preisgeben
  rationale: „Preisgeben“ bildet die Konstruktion mit δοῦναι εἰς idiomatisch ab. „Töten“ wahrt den Vorgangscharakter von φόνος, während „Plünderung“ ἁρπαγή im militärischen Kontext trifft.
- source_word: ἐν πάσῃ τῇ γῇ σου
  choice: in deinem ganzen Land
  rationale: Die umfassende Reichweite von πάσῃ wird direkt wiedergegeben, ohne die Bedeutung von γῆ über „Land“ hinaus einzuengen.
theological_decisions:
- issue: Verhältnis von göttlich-königlichem Befehl und erzählter Gewalt
  choice: Die harte Gewaltanweisung wird ohne Abschwächung als Rede innerhalb der Erzählung wiedergegeben.
  alternative: Die Formulierung moralisch abmildern oder die Opfer nur als Kriegsgefangene darstellen.
  rationale: Der griechische Text nennt ausdrücklich φόνος und ἁρπαγή. Eine Abschwächung würde die erzählerische und theologische Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, semitisch geprägte Wendung „dein Auge nicht verschonen“ bleibt als bewusstes Bild erhalten; der anschließende Infinitiv wird zur natürlichen deutschen Gebotskonstruktion entfaltet.
