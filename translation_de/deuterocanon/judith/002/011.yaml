review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur und die Gewaltbegriffe grundsätzlich zutreffend wieder. ἀπειθοῦντας bedeutet jedoch primär „die Ungehorsamen“ bzw. „diejenigen, die nicht gehorchen“; „die sich widersetzen“ legt einen aktiven Widerstand nahe, der im griechischen Partizip nicht ausdrücklich enthalten ist.
  naturalness: „Die aber, die sich widersetzen“ ist im modernen Standarddeutsch schwerfällig. Die Umstellung zu „Die Ungehorsamen aber“ ist natürlich, bewahrt die adversative Nuance von δέ und erhält das Bild vom nicht verschonenden Auge.
  terminology: „Ungehorsame“ entspricht ἀπειθοῦντας ohne zusätzliche militärische Spezifizierung. „dem Töten und der Plünderung preisgeben“ gibt δοῦναι ... εἰς φόνον καὶ ἁρπαγήν sachgerecht wieder. „in deinem ganzen Land“ entspricht ἐν πάσῃ τῇ γῇ σου.
  issues:
  - severity: medium
    issue: „die, die sich widersetzen“ für ἀπειθοῦντας
    rationale: Die Übersetzung verengt „nicht gehorchen/ungehorsam sein“ auf aktiven Widerstand. Der Kontext kann einen solchen Widerstand einschließen, doch der griechische Ausdruck selbst legt ihn nicht fest.
  - severity: low
    issue: Schwerfällige Doppelrelativformulierung
    rationale: „Die aber, die ...“ ist zwar verständlich, aber weniger idiomatisch als eine substantivierte Personenbezeichnung.
  revised_text: Die Ungehorsamen aber soll dein Auge nicht verschonen; du sollst sie in deinem ganzen Land dem Töten und der Plünderung preisgeben.
