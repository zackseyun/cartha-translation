  yaml_path: translation/deuterocanon/judith/002/019.yaml
  text: And he himself and all his force set out on the march to go before King Nebuchadnezzar and to cover the whole face of the land toward the west with his chariots and horsemen and his chosen foot soldiers[a].
translation:
  language: de
  text: Und er selbst brach mit seiner ganzen Streitmacht zum Marsch auf, um dem König Nebukadnezar vorauszuziehen und die ganze Fläche des Landes nach Westen hin mit Streitwagen, Reitern und seinen ausgewählten Fußsoldaten zu bedecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Fläche der Erde“. Das griechische Wort γῆ kann sowohl „Land“ als auch „Erde“ bedeuten. Hier wurde wegen des westwärts gerichteten Vormarschs durch verschiedene Gebiete „Land“ gewählt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν … εἰς πορείαν
  choice: brach … zum Marsch auf
  rationale: Die Verbindung bezeichnet den Aufbruch zu einer militärischen Unternehmung. Die Wiedergabe ist im Deutschen natürlich und bewahrt den ausdrücklichen Gedanken des Marsches, ohne bereits stärker deutend „zum Feldzug“ zu sagen.
- source_word: πᾶσα ἡ δύναμις αὐτοῦ
  choice: seine ganze Streitmacht
  rationale: δύναμις bezeichnet hier aufgrund der folgenden Streitwagen, Reiter und Fußsoldaten eindeutig eine militärische Macht. „Streitmacht“ ist weiter als „Heer“ und entspricht dem umfassenden Ausdruck.
- source_word: τοῦ προελθεῖν βασιλέως Ναβουχοδονοσόρ
  choice: um König Nebukadnezar vorauszuziehen
  rationale: Der substantivierte Infinitiv gibt den Zweck des Aufbruchs an. „Vorauszuziehen“ bewahrt die räumliche Bedeutung des Verbs und lässt offen, wie genau dieses Vorangehen militärisch organisiert war.
- source_word: καλύψαι πᾶν τὸ πρόσωπον τῆς γῆς
  choice: die ganze Fläche des Landes … zu bedecken
  rationale: „Fläche“ gibt das bildhafte πρόσωπον in natürlichem Deutsch wieder; „bedecken“ erhält das Bild der weithin ausgebreiteten Truppen. γῆ wird im territorialen Zusammenhang als „Land“ verstanden, die mögliche Bedeutung „Erde“ jedoch in einer Fußnote bewahrt.
- source_word: πρὸς δυσμαῖς
  choice: nach Westen hin
  rationale: Die Wendung bezeichnet die Richtung des militärischen Vorrückens. „Nach Westen hin“ ist klar und idiomatisch, ohne bestimmte westliche Gebiete hinzuzufügen.
- source_word: ἅρμασι καὶ ἱππεῦσι καὶ πεζοῖς ἐπιλέκτοις αὐτοῦ
  choice: mit seinen Streitwagen, Reitern und ausgewählten Fußsoldaten
  rationale: Die militärischen Truppengattungen werden konkret wiedergegeben. „Ausgewählt“ bewahrt den Sinn von ἐπιλέκτοις, ohne den moderneren Fachausdruck „Eliteinfanterie“ einzuführen.
