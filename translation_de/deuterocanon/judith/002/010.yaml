  yaml_path: translation/deuterocanon/judith/002/010.yaml
  text: But you[a], after going out, shall seize all their territory in advance for me, and they will surrender themselves to you; and you shall keep them for me until the day of their punishment.
translation:
  language: de
  text: Du aber sollst ausziehen und für mich ihr ganzes Gebiet im Voraus einnehmen. Sie werden sich dir ergeben, und du sollst sie für mich bis zum Tag ihrer Bestrafung[a] festhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihrer Zurechtweisung“ oder „ihrer Züchtigung“. Das griechische Wort ἐλεγμός kann eine Rüge, Zurechtweisung oder strafende Züchtigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: sollst ausziehen
  rationale: Das Aoristpartizip bezeichnet eine dem Einnehmen vorausgehende Handlung. Im Deutschen lässt sich die zeitliche Folge in der koordinierten Wendung „sollst ausziehen und … einnehmen“ natürlich und klar ausdrücken.
- source_word: προκαταλήμψῃ
  choice: im Voraus einnehmen
  rationale: Das Verb bezeichnet ein vorheriges beziehungsweise zuvorkommendes Inbesitznehmen. „Einnehmen“ bewahrt den militärischen Zusammenhang, „im Voraus“ gibt die Bedeutung des Präfixes προ- wieder.
- source_word: πᾶν ὅριον αὐτῶν
  choice: ihr ganzes Gebiet
  rationale: ὅριον kann Grenze, Grenzland oder Gebiet bedeuten. Im Zusammenhang eines Feldzugs ist das gesamte von ihnen beherrschte Gebiet gemeint, nicht lediglich eine Grenzlinie.
- source_word: ἐκδώσουσίν σοι ἑαυτούς
  choice: sie werden sich dir ergeben
  rationale: Die reflexive Form bezeichnet das Sich-Ausliefern beziehungsweise Kapitulieren. „Sich ergeben“ ist im militärischen Zusammenhang idiomatisches modernes Deutsch.
- source_word: διατηρήσεις
  choice: festhalten
  rationale: διατηρέω bedeutet bewahren, behalten oder weiterhin unter Kontrolle halten. Hier sollen die unterworfenen Menschen für ein späteres Vorgehen zurückbehalten werden; „festhalten“ bringt diesen Gewahrsamsaspekt natürlich zum Ausdruck.
- source_word: εἰς ἡμέραν ἐλεγμοῦ αὐτῶν
  choice: bis zum Tag ihrer Bestrafung
  rationale: ἐλεγμός kann Zurechtweisung, Rüge oder strafende Züchtigung bezeichnen. Im militärisch-herrschaftlichen Drohkontext gibt „Bestrafung“ die wahrscheinlich beabsichtigte Wirkung wieder, während die Fußnote die echte Bedeutungsbreite bewahrt.
theological_decisions:
- issue: Bedeutung von ἐλεγμός im militärisch-gerichtlichen Zusammenhang
  choice: Bestrafung
  alternative: Zurechtweisung; Züchtigung
  rationale: Der Zusammenhang handelt von Eroberung und dem späteren Umgang mit unterworfenen Völkern. „Bestrafung“ vermittelt die drohende Folge, ohne ausdrücklich eine endzeitliche Gerichtsvorstellung einzutragen. Da das Substantiv auch verbale Rüge oder erzieherische Züchtigung bezeichnen kann, werden diese Möglichkeiten in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Sprache bleibt deutlich, ohne unnötig altertümliche Formulierungen. Das hervorgehobene σύ wird mit „Du aber“ wiedergegeben; „für mich“ bewahrt die wiederholte Ausrichtung der Befehle auf den Herrscher.
