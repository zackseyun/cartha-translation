  text: And he arranged them in the way a multitude is drawn up for war[a].
translation:
  language: de
  text: Und er stellte sie so auf, wie eine große Schar zum Krieg in Schlachtordnung aufgestellt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er ordnete sie so an, wie eine große Schar zum Krieg in Schlachtordnung aufgestellt wird.“ Das griechische Verb διέταξεν kann sowohl das Anordnen als auch das Befehlen betonen; συντάσσεται ist hier ein militärischer Ausdruck für das Aufstellen in Formation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  choice: stellte … auf
  rationale: Das Verb kann sowohl das Anordnen beziehungsweise Aufstellen als auch das Erteilen von Befehlen bezeichnen. Im Zusammenhang mit der folgenden militärischen Formierung gibt „stellte … auf“ den naheliegenden Sinn wieder, ohne die Befehlsnuance in der Fußnote auszuschließen.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen nimmt die zuvor genannten Streitkräfte als direktes Objekt auf.
- source_word: ὃν τρόπον
  choice: so, wie
  rationale: Die Wendung bezeichnet die Art und Weise und wird im Deutschen natürlich mit „so, wie“ wiedergegeben.
- source_word: πολέμου
  choice: zum Krieg
  rationale: Der Genitiv bezeichnet hier die militärische Bestimmung der Aufstellung. „Zum Krieg“ bewahrt den weiteren Sinn von πόλεμος gegenüber dem engeren „zur Schlacht“.
- source_word: πλῆθος
  choice: eine große Schar
  rationale: πλῆθος bezeichnet eine Menge oder große Anzahl. „Große Schar“ klingt im Deutschen natürlicher als „Menge“, ohne ausdrücklich den spezifischeren Begriff „Heer“ einzuführen.
- source_word: συντάσσεται
  choice: in Schlachtordnung aufgestellt wird
  rationale: Im militärischen Zusammenhang bezeichnet das Verb das geordnete Formieren von Truppen. Die Wiedergabe macht diesen militärischen Sinn deutlich und entspricht der medial-passiven Form.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Große Schar“ bewahrt die allgemeinere Bedeutung von πλῆθος, während „in Schlachtordnung“ den militärischen Gebrauch von συντάσσεται verständlich macht.
