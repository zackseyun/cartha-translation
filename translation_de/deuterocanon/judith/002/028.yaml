base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/028.yaml
  text: And fear and dread of him fell upon those living along the coast—those in Sidon and Tyre[a], those living in Assur and Ocina, and all those living in Jamnia[b]; and those living in Azotus and Ascalon were very greatly afraid of him.
translation:
  language: de
  text: 'Da kamen Furcht und Zittern vor ihm über die Bewohner des Küstengebiets: über die Menschen in Sidon und Tyrus, die Bewohner von Assur und Okeina[a] und alle Bewohner von Jamnia. Und die Bewohner von Azotos und Askalon[b] fürchteten ihn überaus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Lage beziehungsweise Identifizierung der hier genannten Orte Assur und Okeina ist unsicher.
    reason: geographical_uncertainty
  - marker: b
    text: Azotos und Askalon sind die griechischen Namensformen der Städte, die heute meist Aschdod und Aschkelon genannt werden.
    reason: name_equivalence
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: kamen … über
  rationale: Die deutsche Wendung gibt das bildhafte griechische „fiel über/kam über“ natürlich wieder; wegen des zusammengesetzten Subjekts steht das Verb im Deutschen im Plural.
- source_word: φόβος καὶ τρόμος
  choice: Furcht und Zittern
  rationale: Die feste, aber weiterhin verständliche Wortverbindung bildet sowohl φόβος als auch das körperlich geprägte τρόμος eng ab und bewahrt die Intensität des griechischen Ausdrucks.
- source_word: αὐτοῦ
  choice: vor ihm
  rationale: Der Genitiv bezeichnet hier am natürlichsten die Person, die Furcht und Zittern auslöst. „Vor ihm“ gibt diese Beziehung im Deutschen klar wieder, ohne eine zusätzliche Ursache auszudeuten.
- source_word: τοὺς κατοικοῦντας τὴν παραλίαν
  choice: die Bewohner des Küstengebiets
  rationale: παραλία bezeichnet die Küste beziehungsweise das Küstenland; „Küstengebiet“ ist präzise und in modernem Deutsch natürlich.
- source_word: Ἀσσούρ / Ὀκεινὰ / Ἰεμνάν
  choice: Assur / Okeina / Jamnia
  rationale: Die Ortsnamen werden nach ihrer griechischen Form wiedergegeben. Besonders bei Assur und Okeina ist eine weitergehende geografische Gleichsetzung nicht sicher genug, um sie in den Text einzutragen.
- source_word: Ἀζώτῳ / Ἀσκάλωνι
  choice: Azotos / Askalon
  rationale: Die Wiedergabe folgt den griechischen Namensformen; die heute beziehungsweise aus dem hebräischen Bibeltext geläufigeren Formen werden in einer Fußnote genannt.
- source_word: ἐφοβήθησαν αὐτὸν σφόδρα
  choice: fürchteten ihn überaus
  rationale: Die Konstruktion mit Akkusativ wird direkt wiedergegeben; „überaus“ bewahrt die starke Intensivierung durch σφόδρα in würdigem, gut verständlichem Deutsch.
theological_decisions:
- issue: Beziehung des Genitivs αὐτοῦ zu „Furcht und Zittern“
  choice: vor ihm
  alternative: von ihm ausgehend / seinetwegen
  rationale: Der Kontext legt ihn als Gegenstand beziehungsweise Auslöser der Furcht nahe. „Vor ihm“ bewahrt diese Aussage, ohne genauer festzulegen, ob unmittelbar seine Person, sein Ruf oder sein Handeln die Angst hervorruft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählungsstruktur und die Wiederholung von „Bewohner“ bleiben zur Wahrung des griechischen Satzrhythmus weitgehend erhalten; der abschließende Satzteil wird wie im Ausgangstext deutlich hervorgehoben.
