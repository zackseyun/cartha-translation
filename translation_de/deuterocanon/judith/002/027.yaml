  yaml_path: translation/deuterocanon/judith/002/027.yaml
  text: And he went down into the plain of Damascus in the days of the wheat harvest[a], and he set all their fields on fire; their flocks and herds he gave over to destruction, and he plundered their cities and stripped bare their plains, and struck down all their young men with the edge of the sword.
translation:
  language: de
  text: Und er zog in die Ebene von Damaskus hinab, als die Weizenernte im Gang war. Er steckte alle ihre Felder in Brand, gab ihre Schaf- und Rinderherden der Vernichtung preis, plünderte ihre Städte, fegte ihre Ebenen kahl und erschlug alle ihre jungen Männer mit der Schneide des Schwertes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem Mund des Schwertes“; eine bildhafte Wendung für das Töten durch das Schwert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: zog … hinab
  rationale: Bewahrt die Richtungsangabe des griechischen Verbs und klingt im erzählenden Zusammenhang natürlich.
- source_word: πεδίον Δαμασκοῦ
  choice: die Ebene von Damaskus
  rationale: πεδίον bezeichnet ebenes, offenes Land; der Genitiv dient hier als geografische Zuordnung.
- source_word: ἐν ἡμέραις θερισμοῦ πυρῶν
  choice: als die Weizenernte im Gang war
  rationale: Gibt die idiomatische Zeitangabe verständlich wieder und erhält mit „Weizen“ die spezifische Bedeutung von πυρῶν.
- source_word: ἐνέπρησεν πάντας τοὺς ἀγροὺς αὐτῶν
  choice: steckte alle ihre Felder in Brand
  rationale: Bewahrt die verursachende Bedeutung des Verbs und gibt ἀγροί im landwirtschaftlichen Zusammenhang präzise als Felder wieder.
- source_word: τὰ ποίμνια καὶ τὰ βουκόλια
  choice: ihre Schaf- und Rinderherden
  rationale: Macht die im Griechischen unterschiedenen Kleinvieh- und Rinderherden konkret sichtbar.
- source_word: ἔδωκεν εἰς ἀφανισμόν
  choice: gab … der Vernichtung preis
  rationale: Entspricht der griechischen Konstruktion „zur Vernichtung geben“ in natürlichem, würdigem Deutsch.
- source_word: ἐσκύλευσεν
  choice: plünderte
  rationale: Bezeichnet unmittelbar das Erbeuten und Wegnehmen von Besitz.
- source_word: τὰ πεδία αὐτῶν ἐξελίκμησεν
  choice: fegte ihre Ebenen kahl
  rationale: Bewahrt das eindringliche Bild gründlicher Verwüstung beziehungsweise restlosen Abräumens, ohne den Ausdruck auf ein allgemeines „verwüstete“ zu reduzieren.
- source_word: νεανίσκους
  choice: junge Männer
  rationale: Gibt Altersgruppe und Geschlecht des griechischen Ausdrucks direkt wieder.
- source_word: ἐν στόματι ῥομφαίας
  choice: mit der Schärfe des Schwertes
  rationale: Gibt die griechische Waffenformel idiomatisch wieder; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
