  yaml_path: translation/deuterocanon/judith/002/015.yaml
  text: 'And he counted chosen men for battle formation[a], just as his lord had commanded him: one hundred twenty thousand, and twelve thousand mounted archers,'
translation:
  language: de
  text: 'Und er zählte ausgewählte Männer für die Schlachtordnung ab, wie sein Herr ihm befohlen hatte: hundertzwanzigtausend[a] sowie zwölftausend berittene Bogenschützen,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „zwölf Myriaden“; eine Myriade entspricht zehntausend.'
    reason: Die Fußnote bewahrt die wörtliche griechische Zahlenangabe neben der für heutige Leser ausgerechneten Zahl.
lexical_decisions:
- source_word: ἠρίθμησεν
  choice: zählte … ab
  rationale: Das Verb bezeichnet das Zählen beziehungsweise Erfassen. „zählte … ab“ bewahrt den konkreten Vorgang und passt zum militärischen Zusammenhang, ohne bereits eine förmliche Musterung vorauszusetzen.
- source_word: ἐκλεκτοὺς ἄνδρας
  choice: ausgewählte Männer
  rationale: ἐκλεκτούς bezeichnet Ausgewählte oder besonders Geeignete; ἄνδρας ist ausdrücklich maskulin und pluralisch.
- source_word: εἰς παράταξιν
  choice: für die Schlachtordnung
  rationale: παράταξις bezeichnet hier die militärische Aufstellung oder Gefechtsordnung. „Schlachtordnung“ ist prägnant und wahrt den militärischen Sinn.
- source_word: καθότι
  choice: wie
  rationale: Die Konjunktion drückt aus, dass die Handlung dem zuvor erteilten Befehl entspricht. Das schlichte „wie“ ist im Deutschen natürlich und genau.
- source_word: ὁ κύριος αὐτοῦ
  choice: sein Herr
  rationale: κύριος bezeichnet hier den menschlichen Vorgesetzten des Holofernes. „sein Herr“ bewahrt die hierarchische Anrede, ohne einen Gottesbezug einzutragen.
- source_word: εἰς μυριάδας δέκα δύο
  choice: hundertzwanzigtausend
  rationale: Zwölf Myriaden entsprechen 120.000. Die ausgerechnete Zahl ist für heutige Leser unmittelbar verständlich; die griechische Ausdrucksweise wird in einer Fußnote dokumentiert.
- source_word: ἱππεῖς τοξότας
  choice: berittene Bogenschützen
  rationale: Die Wortgruppe verbindet Reiterei und Bogenschützen. „berittene Bogenschützen“ ist idiomatisches modernes Deutsch und gibt beide Merkmale wieder.
- source_word: μυρίους δισχιλίους
  choice: zwölftausend
  rationale: Die griechische Zahlenverbindung bezeichnet insgesamt 12.000. Die zusammengezogene Zahl ist im Deutschen natürlich und eindeutig.
theological_decisions:
- issue: Wiedergabe von κύριος in einer nichtgöttlichen militärischen Hierarchie
  choice: sein Herr
  alternative: sein Gebieter
  rationale: Der Bezug gilt eindeutig einem menschlichen Vorgesetzten. „Herr“ entspricht dem Grundsinn und wahrt das Rangverhältnis; der Kontext verhindert eine Verwechslung mit einer Gottesbezeichnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Terminologie bleibt konkret, ohne unnötig technische oder altertümliche Formulierungen. Der Vers endet entsprechend dem griechischen Satzfortgang mit einem Komma.
