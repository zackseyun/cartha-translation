  text: And he summoned all his attendants and all his nobles[a], and he set before them the secret of his plan[b], and from his own mouth he declared all the evil of the land.
translation:
  language: de
  text: Und er rief alle seine Diener und alle seine Großen zusammen, legte ihnen das Geheimnis seines Plans dar[a] und trug ihnen aus eigenem Mund alles Böse des Landes vollständig vor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „teilte ihnen den geheimen Ratschluss mit“. Mit „Geheimnis“ ist hier wahrscheinlich eine vertrauliche Angelegenheit oder ein geheimer Plan gemeint, nicht ein theologischer Fachbegriff.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Satz ist schwierig. Er kann auch bedeuten, dass er alles Böse, das über das Land kommen oder ihm zugefügt werden sollte, vollständig aussprach.
    reason: alternative_reading
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: rief … zusammen
  rationale: Das zusammengesetzte Verb bezeichnet das Zusammenrufen zu einer Versammlung und lässt zugleich den gebieterischen Zusammenhang erkennen.
- source_word: θεράποντας
  choice: Diener
  rationale: Das Wort bezeichnet hier Personen im persönlichen Dienst des Herrschers, ohne zwingend den rechtlichen Status von Sklaven auszudrücken.
- source_word: μεγιστᾶνας
  choice: Großen
  rationale: Gemeint sind hochgestellte Männer des Hofes oder Reiches. „Großen“ ist in diesem historischen Zusammenhang verständlich und angemessen würdevoll.
- source_word: ἔθετο μετʼ αὐτῶν τὸ μυστήριον τῆς βουλῆς αὐτοῦ
  choice: legte ihnen das Geheimnis seines Plans dar
  rationale: Die Wendung beschreibt das vertrauliche Offenlegen einer geheimen Angelegenheit. „Geheimnis“ wahrt μυστήριον, während „Plan“ den politischen Sinn von βουλή natürlich wiedergibt.
- source_word: συνετέλεσεν
  choice: sprach … vollständig aus
  rationale: Das Verb bedeutet grundsätzlich „vollenden“ oder „vollständig ausführen“. In Verbindung mit „aus seinem Mund“ liegt ein vollständiges Aussprechen nahe; die ungewöhnliche Ausdrucksweise des Griechischen bleibt erkennbar.
- source_word: πᾶσαν τὴν κακίαν τῆς γῆς
  choice: alles Böse des Landes
  rationale: 'Die Genitivverbindung ist mehrdeutig: Sie kann das Böse des Landes, über das Land oder gegen das Land bezeichnen. Die nahe Wiedergabe vermeidet eine stillschweigende Festlegung.'
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: aus seinem eigenen Mund
  rationale: Die Formulierung erhält die Betonung, dass der Herrscher die Worte persönlich äußerte.
theological_decisions:
- issue: Bedeutung von μυστήριον
  choice: Geheimnis im Sinn eines vertraulichen Plans
  alternative: ein theologisches Mysterium
  rationale: Der höfisch-politische Kontext spricht für eine geheime Angelegenheit und nicht für einen späteren theologischen Fachbegriff.
- issue: Bezug von κακία auf γῆ
  choice: mehrdeutige Genitivverbindung „das Böse des Landes“
  alternative: das dem Land zugedachte oder gegen das Land geplante Böse
  rationale: Der griechische Wortlaut legt nicht eindeutig fest, ob das Land selbst als böse gilt oder ob das Böse über beziehungsweise gegen das Land beschlossen wird.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die leicht ungewöhnliche Formulierung „aus seinem eigenen Mund“ bewahrt die ausdrückliche Hervorhebung des griechischen Textes; die sachliche Mehrdeutigkeit der Schlussklausel wird nicht im Haupttext aufgelöst.
