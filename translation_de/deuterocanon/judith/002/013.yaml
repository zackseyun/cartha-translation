  text: And you also must not transgress a single one of your lord’s words, but you shall surely carry out exactly as I have commanded you, and you shall not delay to do them.
translation:
  language: de
  text: Auch du sollst keines der Worte deines Herrn übertreten, sondern genau ausführen, was ich dir befohlen habe, und nicht zögern, sie auszuführen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ παραβήσῃ
  choice: darfst ... nicht übertreten
  rationale: παραβαίνω bezeichnet das Übertreten oder Verletzen einer Anordnung. Die deutsche Wendung bewahrt das Bild der Grenzüberschreitung und passt zum gebieterischen Zusammenhang.
- source_word: ἓν τι τῶν ῥημάτων
  choice: kein einziges Wort
  rationale: Die Formulierung hebt distributiv hervor, dass nicht einmal ein einzelner Bestandteil der Weisung missachtet werden darf. „Wort“ kann dabei wie im Griechischen eine konkrete Anordnung bezeichnen.
- source_word: τοῦ κυρίου σου
  choice: deines Herrn
  rationale: κύριος bezeichnet hier einen menschlichen Vorgesetzten. „Herr“ gibt den Rang- und Unterordnungsbezug natürlich wieder, ohne einen Gottesnamen anzunehmen.
- source_word: ἐπιτελῶν ἐπιτελέσεις
  choice: musst alles ... ausführen
  rationale: Die Verbindung von Partizip und finitem Verb verstärkt die Forderung nach vollständiger Durchführung. Eine wörtliche Wiederholung wäre im Deutschen unbeholfen; „musst alles ... ausführen“ vermittelt Nachdruck und Vollständigkeit.
- source_word: καθότι προστέταχά σοι
  choice: genau so, wie ich es dir befohlen habe
  rationale: καθότι fordert genaue Entsprechung, während προστάσσω im militärischen Kontext einen verbindlichen Befehl bezeichnet.
- source_word: οὐ μακρυνεῖς
  choice: zögere nicht
  rationale: Im Zusammenhang mit dem Infinitiv bedeutet μακρύνω, eine Handlung hinauszuschieben. Der deutsche Imperativ gibt die direktive Kraft und die verlangte Unverzüglichkeit natürlich wieder.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: es zu tun
  rationale: Der artikulierte Infinitiv bezeichnet die nicht aufzuschiebende Ausführung. Das Pronomen αὐτά ist formal Plural, verweist sinngemäß jedoch auf die Gesamtheit der befohlenen Dinge; idiomatisches Deutsch verwendet hier „es“ für das zuvor geforderte Handeln.
theological_decisions:
- issue: κύριος bezeichnet einen menschlichen Vorgesetzten und keinen göttlichen Titel
  choice: deines Herrn
  alternative: deines Gebieters
  rationale: Der erzählerische und militärische Zusammenhang weist auf ein menschliches Rangverhältnis. „Herr“ wahrt den üblichen lexikalischen Wert, während die Kleinschreibung im Satzinneren auf Deutsch nicht zur Unterscheidung dienen kann; der Kontext verhindert die Deutung als Gottesbezeichnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar gebieterischem Ton. Die griechische Intensivierung wird idiomatisch durch „musst alles“ und „genau so“ wiedergegeben; unnötig altertümliche oder konfessionell geprägte Sprache wurde vermieden.
