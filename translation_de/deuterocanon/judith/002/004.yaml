base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/004.yaml
  text: And it happened[a], when he had finished his plan, that Nebuchadnezzar king of the Assyrians called Holofernes, the commander-in-chief of his forces, who was second after him, and said to him[c][b],
translation:
  language: de
  text: 'Als er seinen Plan[a] vollendet hatte, ließ Nebukadnezar, der König der Assyrer, Holofernes rufen, den Oberbefehlshaber[b] seiner Streitmacht, der unmittelbar nach ihm den zweiten Rang einnahm[c], und sagte zu ihm:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Entschluss vollendet“ oder „seine Beratung abgeschlossen“. Das griechische βουλή kann einen Plan, einen Entschluss oder eine Beratung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den obersten Heerführer“. Das griechische Wort bezeichnet den höchsten militärischen Befehlshaber.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „der als Zweiter nach ihm war“; gemeint ist der Rang unmittelbar unter dem König.'
    reason: clarification
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς συνετέλεσεν
  choice: Als er … gefasst hatte
  rationale: Die griechische Erzählformel und der vollendete vorherige Vorgang werden in natürlichem modernem Deutsch durch einen temporalen Nebensatz wiedergegeben.
- source_word: τὴν βουλὴν αὐτοῦ
  choice: seinen Entschluss
  rationale: βουλή kann Beratung, Plan, Absicht oder Beschluss bezeichnen. Im Zusammenhang bezeichnet es das Ergebnis von Nebukadnezars Überlegung; „Entschluss fassen“ ist dafür idiomatisches Deutsch, ohne den Inhalt näher festzulegen.
- source_word: ἐκάλεσεν
  choice: ließ … rufen
  rationale: Im königlichen Zusammenhang bezeichnet das Verb eine autoritative Vorladung. „Ließ … rufen“ klingt im Deutschen natürlicher als das möglicherweise missverständliche „rief“.
- source_word: Ναβουχοδονοσὸρ βασιλεὺς Ἀσσυρίων
  choice: Nebukadnezar, der König der Assyrer
  rationale: Die Apposition und die ausdrückliche Volksbezeichnung des Griechischen bleiben erhalten.
- source_word: τὸν Ὀλοφέρνην
  choice: Holofernes
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: ἀρχιστράτηγον
  choice: den Oberbefehlshaber
  rationale: Das Kompositum bezeichnet den ranghöchsten militärischen Befehlshaber; „Oberbefehlshaber“ gibt Amt und Autorität klar wieder.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: seiner Streitmacht
  rationale: δύναμις hat hier aufgrund des militärischen Amtstitels die Bedeutung „Streitmacht“ und nicht die allgemeinere Bedeutung „Macht“.
- source_word: δεύτερον ὄντα μετʼ αὐτόν
  choice: der unmittelbar nach ihm den zweiten Rang einnahm
  rationale: Die Formulierung macht verständlich, dass Holofernes in der Rangordnung direkt unter dem König stand, und bleibt dem wörtlichen „als Zweiter nach ihm“ nahe.
- source_word: καὶ εἶπεν πρὸς αὐτόν
  choice: und sagte zu ihm
  rationale: Direkte und natürliche Wiedergabe der üblichen griechischen Redeeinleitung.
