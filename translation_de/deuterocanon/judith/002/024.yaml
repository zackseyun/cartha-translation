base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/024.yaml
  text: And he crossed the Euphrates and passed through Mesopotamia[a], and he tore down all the high cities along the torrent Abrona[b], until he came to the sea.
translation:
  language: de
  text: Und er überquerte den Euphrat und zog durch Mesopotamien. Er riss alle hoch gelegenen Städte am Wildbach Abrona[b] nieder[a], bis er ans Meer gelangte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durchbrach alle hoch gelegenen Städte“. Das griechische Verb bedeutet wörtlich „durchgraben“ und kann hier das Durchbrechen oder Zerstören von Städten während eines Feldzugs bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Abrona“ ist die Umschrift eines Ortsnamens im griechischen Text. Welcher Wildbach damit genau gemeint ist, ist ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: παρῆλθεν
  choice: überquerte
  rationale: Mit dem Euphrat als direktem Objekt bezeichnet das Verb hier am natürlichsten das Überschreiten des Flusses.
- source_word: διῆλθεν
  choice: zog durch
  rationale: Das Verb beschreibt die Bewegung durch die Region Mesopotamien; „zog durch“ passt zum militärischen Reisebericht und klingt im Deutschen natürlich.
- source_word: διέσκαψε
  choice: riss … nieder
  rationale: Wörtlich bezeichnet das Verb ein Durch- oder Aufgraben. Auf Städte bezogen meint es im Feldzug wahrscheinlich deren gewaltsames Aufbrechen beziehungsweise Zerstören; die Fußnote bewahrt das konkrete griechische Bild und die verbleibende Bedeutungsbreite.
- source_word: πόλεις τὰς ὑψηλάς
  choice: hoch gelegenen Städte
  rationale: ὑψηλάς bedeutet „hoch“. „Hoch gelegen“ gibt wahrscheinlich die erhöhte Lage wieder, ohne die im Griechischen nicht ausdrücklich genannte Bedeutung „befestigt“ einzutragen.
- source_word: χειμάρρου
  choice: Wildbach
  rationale: χείμαρρος bezeichnet einen reißenden, oft jahreszeitlich wasserführenden Bach; „Wildbach“ ist verständlich und erhält diesen geographischen Charakter.
- source_word: Ἀβρωνᾶ
  choice: Abrona
  rationale: Der griechische Ortsname wird in einer für das Deutsche natürlichen Form transliteriert; seine genaue geographische Zuordnung bleibt offen.
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ θάλασσαν
  choice: bis er ans Meer gelangte
  rationale: Die Konstruktion mit ἕως und dem substantivierten Infinitiv bezeichnet den Endpunkt des Vormarsches.
