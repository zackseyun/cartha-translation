  yaml_path: translation/deuterocanon/judith/002/021.yaml
  text: And they advanced from Nineveh a journey of three days to the front of the plain of Baikteileth[a], and they encamped from Baikteileth near the mountain that is at the left hand of upper Cilicia.
translation:
  language: de
  text: Und sie zogen von Ninive aus drei Tagesreisen weit bis vor die Ebene von Baikteilaith. Von Baikteilaith aus schlugen sie ihr Lager nahe dem Berg auf, der links von Oberkilikien liegt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hier vorgelegte Transkription des griechischen Swete-Textes bricht nach „ἐπʼ ἀρι-“ ab. Die Übersetzung folgt für den restlichen Satz der üblichen Fortsetzung: „links von Oberkilikien“.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐπῆλθον
  choice: sie zogen
  rationale: Im Zusammenhang mit dem Vorrücken eines Heeres bezeichnet das Verb eine geordnete Weiterbewegung. „Sie zogen“ ist im Deutschen natürlich und lässt die militärische Färbung aus dem Kontext hervorgehen, ohne sie im Verb zu verstärken.
- source_word: ὁδὸν τριῶν ἡμερῶν
  choice: drei Tagesreisen weit
  rationale: Die Wendung misst die zurückgelegte Strecke nach der Reisezeit. Die deutsche Formulierung gibt diesen idiomatischen Sinn knapp und verständlich wieder.
- source_word: ἐπὶ πρόσωπον τοῦ πεδίου
  choice: bis vor die Ebene
  rationale: Die räumliche Wendung bezeichnet die Lage vor beziehungsweise gegenüber der Ebene. „Bis vor die Ebene“ bewahrt diese Orientierung in natürlichem Deutsch.
- source_word: πεδίου
  choice: Ebene
  rationale: Im topografischen Zusammenhang ist „Ebene“ die naheliegende Bedeutung.
- source_word: Βαικτειλαίθ / Βαικτειλαὶθ
  choice: Baikteilaith
  rationale: Der Ortsname wird nach der griechischen Form transliteriert; die geringfügig unterschiedliche Akzentsetzung bezeichnet keinen anderen Ort.
- source_word: ἐπεστρατοπέδευσαν
  choice: schlugen sie ihr Lager auf
  rationale: Das Verb bezeichnet ausdrücklich das Errichten eines Lagers, häufig durch ein Heer. Diese Wendung ist gegenwärtiges, würdevolles Standarddeutsch.
- source_word: ἀπὸ Βαικτειλαὶθ
  choice: Von Baikteilaith aus
  rationale: ἀπό bedeutet grundsätzlich „von … aus“. Die im Deutschen etwas auffällige geografische Angabe wird nicht zu „bei Baikteilaith“ geglättet.
- source_word: πλησίον τοῦ ὄρους
  choice: nahe dem Berg
  rationale: Die Wiedergabe entspricht dem gewöhnlichen räumlichen Sinn von πλησίον und dem Singular ὄρος.
- source_word: τοῦ ἐπʼ ἀριστερὰς
  choice: der links … liegt
  rationale: Die rekonstruierte Wendung bedeutet „auf der linken Seite“. „Links von“ bewahrt die relative Richtungsangabe, ohne sie als eine bestimmte Himmelsrichtung auszulegen.
- source_word: τῆς ἄνω Κιλικίας
  choice: Oberkilikien
  rationale: Die regionale Bezeichnung wird im Deutschen idiomatisch als zusammengesetzter Eigenname wiedergegeben.
