translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reisesprache bleibt erzählerisch klar; die ungewöhnliche Angabe „von Baikteilaith aus“ wurde wegen des griechischen ἀπό bewusst beibehalten. Die durch den abgebrochenen Quellenauszug bedingte Ergänzung ist in einer Fußnote offengelegt.
