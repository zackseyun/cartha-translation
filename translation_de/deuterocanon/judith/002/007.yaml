  text: and to prepare earth and water[a], because I will go out against them in my wrath, and I will cover the whole face of the earth with the feet of my army, and I will give them over to plunder by them.
translation:
  language: de
  text: und Erde und Wasser[a] bereitzustellen; denn ich werde in meinem Zorn gegen sie ausziehen, die ganze Oberfläche der Erde mit den Füßen meiner Streitmacht bedecken und sie ihnen zur Plünderung preisgeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erde und Wasser“ verweist wahrscheinlich auf Zeichen der Unterwerfung gegenüber einem erobernden König.
    reason: Kultureller Hinweis zur wahrscheinlichen Bedeutung der konkreten Wendung, ohne eine im griechischen Wortlaut nicht ausdrücklich genannte Forderung zu behaupten.
lexical_decisions:
- source_word: ἑτοιμάζειν
  choice: bereitzustellen
  rationale: Der Infinitiv setzt die vorausgehende Befehlsfolge fort. „Bereitzustellen“ gibt das Bereitmachen der genannten Dinge natürlich und ohne zusätzliche Deutung wieder.
- source_word: γῆν καὶ ὕδωρ
  choice: Erde und Wasser
  rationale: Die konkreten Substantive werden wörtlich bewahrt. Ihre wahrscheinliche kulturelle Bedeutung als Zeichen der Unterwerfung wird in einer Fußnote erläutert.
- source_word: ἐξελεύσομαι
  choice: ich werde … ausziehen
  rationale: „Ausziehen“ entspricht dem militärischen Kontext und bleibt dem Grundsinn von ἐξέρχομαι nahe.
- source_word: ἐν θυμῷ μου
  choice: in meinem Zorn
  rationale: „Zorn“ gibt die heftige königliche Wut in einem würdigen, bibelnahen und weiterhin modernen Register wieder.
- source_word: καλύψω πᾶν τὸ πρόσωπον τῆς γῆς
  choice: die ganze Oberfläche der Erde … bedecken
  rationale: „Oberfläche“ überträgt das idiomatische πρόσωπον hier verständlich, während „der Erde“ die weit ausgreifende Eroberungsrhetorik erhält.
- source_word: τοῖς ποσὶν τῆς δυνάμεώς μου
  choice: mit den Füßen meiner Streitmacht
  rationale: δύναμις bezeichnet in diesem Zusammenhang die militärische Macht beziehungsweise Truppe. „Streitmacht“ ist präzise, und das konkrete Bild der Füße bleibt erhalten.
- source_word: δώσω αὐτοὺς εἰς διαρπαγὴν αὐτοῖς
  choice: sie ihnen zur Plünderung preisgeben
  rationale: Die Formulierung bewahrt beide Pronomen und den Dativ αὐτοῖς, gibt die Übergabe zur Plünderung aber in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von „Erde und Wasser“
  choice: Die konkrete Wendung bleibt im Haupttext stehen; ihre wahrscheinliche Bedeutung als Unterwerfungszeichen wird in der Fußnote erklärt.
  alternative: Im Haupttext sinngemäß „Zeichen der Unterwerfung“ zu schreiben.
  rationale: Der griechische Wortlaut nennt lediglich die beiden konkreten Dinge. Die kulturelle Deutung ist wahrscheinlich, aber nicht ausdrücklich ausformuliert und soll deshalb den Haupttext nicht vereindeutigen.
- issue: Bezug des abschließenden αὐτοῖς
  choice: Das Pronomen wird als „ihnen“ wiedergegeben, ohne seinen Bezug im Haupttext durch ein Nomen festzulegen.
  alternative: Explizit „meiner Streitmacht“ oder „meinen Soldaten“ zu schreiben.
  rationale: Im Zusammenhang bezieht sich αὐτοῖς wahrscheinlich auf die angreifenden Truppen; die pronominale Form des Griechischen wird jedoch bewahrt, damit keine über den Wortlaut hinausgehende Präzisierung erfolgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit militärisch-königlichem Ton. Der Satz bleibt als Fortsetzung des vorausgehenden Befehls mit „und“ fragmentarisch angebunden. Das Semikolon gliedert die Befehlsfolge und die anschließende Begründung klar.
