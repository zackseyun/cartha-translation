  yaml_path: translation/deuterocanon/judith/002/025.yaml
  text: And he seized the territory of Cilicia[a], and cut down all who resisted him, and came as far as the borders of Japheth, to the south, opposite Arabia.
translation:
  language: de
  text: Und er nahm das Gebiet Kilikiens ein und hieb alle nieder, die ihm Widerstand leisteten. Dann zog er bis an die Grenzen Jafets[a] im Süden, gegenüber von Arabien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „Jafet“. Die Lage ist ungewiss; manche Ausleger bringen den Namen mit einem bekannteren Ortsnamen in Verbindung. Hier wird jedoch die überlieferte Lesart ohne Textänderung beibehalten.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελάβετο τὰ ὅρια τῆς Κιλικίας
  choice: nahm das Gebiet Kilikiens ein
  rationale: καταλαμβάνω bezeichnet hier die gewaltsame Inbesitznahme; τὰ ὅρια steht im Zusammenhang mit Kilikien metonymisch für dessen Gebiet. Die Wendung ist im Deutschen natürlich und wahrt den militärischen Sinn.
- source_word: κατέκοψε
  choice: hieb … nieder
  rationale: Das Verb bezeichnet ein gewaltsames Niederhauen oder Töten. „Hieb … nieder“ bewahrt die anschauliche Härte des griechischen Ausdrucks.
- source_word: πάντας τοὺς ἀντιστάντας αὐτῷ
  choice: alle …, die ihm Widerstand leisteten
  rationale: Das Partizip bezeichnet Menschen, die sich ihm aktiv entgegenstellten; die deutsche Formulierung ist klar und präzise.
- source_word: ἦλθεν ἕως ὁρίων
  choice: zog … bis an die Grenzen
  rationale: Im militärischen Erzählzusammenhang gibt „zog“ die Bewegung natürlicher wieder als das wörtliche „kam“; ἕως ὁρίων markiert den erreichten Endpunkt.
- source_word: Ἰάφεθ
  choice: Jafet
  rationale: Der überlieferte griechische Ortsname wird in seiner üblichen deutschen Form beibehalten und nicht zu einem bekannteren Ortsnamen emendiert.
- source_word: τὰ πρὸς νότον
  choice: im Süden
  rationale: Die Wendung bezeichnet eine südliche Lage oder Ausrichtung. „Im Süden“ erhält diese Ortsangabe, ohne ihre genaue syntaktische Zuordnung stärker festzulegen als nötig.
- source_word: κατὰ πρόσωπον τῆς Ἀραβίας
  choice: gegenüber von Arabien
  rationale: Die idiomatische Wendung bedeutet räumlich „gegenüber“ oder „mit Blick auf“; die gewählte Form passt zu einer geografischen Beschreibung.
