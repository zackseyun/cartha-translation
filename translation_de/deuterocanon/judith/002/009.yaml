  text: And I will lead their captives to the ends of all the earth[a][b].
translation:
  language: de
  text: Und ich werde ihre Gefangenen bis an die Enden der ganzen Erde führen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Gefangenschaft“, wenn αἰχμαλωσίαν abstrakt und nicht als Bezeichnung für die Gefangenen selbst verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort γῆ kann „Land“ oder „Erde“ bedeuten; hier steht „Erde“, weil die Wendung „bis an die Enden“ eine weltumspannende Aussage nahelegt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: ich werde … führen
  rationale: Das Futur von ἄγω bezeichnet hier das Wegführen von Gefangenen. „Führen“ bewahrt die aktive Bewegung, ohne ihre konkrete Art unnötig festzulegen.
- source_word: αἰχμαλωσίαν
  choice: ihre Gefangenen
  rationale: Das Substantiv kann abstrakt „Gefangenschaft“ oder konkret eine Gruppe Gefangener bezeichnen. Zusammen mit αὐτῶν und einem Verb des Führens ist die konkrete Wiedergabe im Deutschen am natürlichsten.
- source_word: ἐπὶ τὰ ἄκρα
  choice: bis an die Enden
  rationale: Die Wendung bezeichnet weit entfernte äußerste Bereiche. „Bis an die Enden“ ist idiomatisch und gibt die räumliche Ausdehnung wieder.
- source_word: πάσης τῆς γῆς
  choice: der ganzen Erde
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten. Die Verbindung mit „den Enden“ spricht hier für die weltumspannende Aussage „der ganzen Erde“.
