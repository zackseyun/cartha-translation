  text: And their wounded will fill their ravines and the wadis, and a river overflowing will be filled with their dead;
translation:
  language: de
  text: Und ihre Verwundeten werden ihre Schluchten und die Wadis[a] füllen, und ein über die Ufer tretender Fluss wird mit ihren Toten gefüllt sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Winterbäche“ beziehungsweise „die Bachbetten“. Das griechische Wort bezeichnet einen saisonalen Sturzbach oder dessen Bett.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τραυματίαι
  choice: Verwundeten
  rationale: Das substantivierte Adjektiv bezeichnet verwundete Personen. „Verwundeten“ ist im Deutschen knapp und natürlich, ohne die Bedeutung unnötig zu „Gefallenen“ oder allgemein „Opfern“ auszuweiten.
- source_word: πληρώσουσιν
  choice: werden … füllen
  rationale: Gibt den Futur von πληρόω unmittelbar wieder und bewahrt das drastische Bild.
- source_word: φάραγγας
  choice: Schluchten
  rationale: φάραγξ bezeichnet Schluchten oder enge Taleinschnitte. „Schluchten“ ist präzise und allgemein verständlich.
- source_word: χειμάρρους
  choice: Wadis
  rationale: χείμαρρος kann einen saisonalen Sturzbach oder dessen zeitweise trockenes Bett bezeichnen. „Wadis“ passt zur Landschaft und bewahrt diese Bedeutungsbreite; eine Fußnote erläutert den weniger geläufigen Ausdruck.
- source_word: ποταμὸς ἐπικλύζων
  choice: ein über die Ufer tretender Fluss
  rationale: ἐπικλύζων beschreibt ein Überfluten oder Überschwemmen. Die Wendung ist idiomatisches Deutsch und erhält das Bild eines anschwellenden Flusses.
- source_word: τοῖς νεκροῖς αὐτῶν
  choice: mit ihren Toten
  rationale: νεκροί kann tote Menschen beziehungsweise Leichen bezeichnen. „Mit ihren Toten“ ist würdevoll, natürlich und wahrt die düstere Aussage.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst drastischer Bildsprache. „Wadis“ wird wegen der landschaftlichen Genauigkeit beibehalten und in der Fußnote erklärt; die Satzstruktur folgt dem griechischen Parallelismus, ohne im Deutschen unnatürlich zu wirken.
