  text: And he encircled all the sons of Midian[a], and burned their encampments[b], and plundered their sheepfolds.
translation:
  language: de
  text: Und er umzingelte alle Söhne Midians[a], setzte ihre Zeltlager in Brand und plünderte ihre Pferche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle Midianiter«. Wörtlich steht im Griechischen: »alle Söhne Midians«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet eingefriedete Plätze für Tiere, etwa Pferche oder Schafpferche.
    reason: lexical_scope
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: umzingelte
  rationale: Das Verb κυκλόω bezeichnet ein Umgeben oder Einkreisen. »Umzingelte« bewahrt sowohl die räumliche Bildhaftigkeit als auch den militärischen Zusammenhang und klingt im Deutschen natürlicher als »umkreiste«.
- source_word: πάντας τοὺς υἱοὺς Μαδιάμ
  choice: alle Söhne Midians
  rationale: Die Wiedergabe folgt der griechischen Formulierung wörtlich und bewahrt ihren biblisch-genealogischen Charakter. Gemeint sind kollektiv die Midianiter; diese idiomatische Alternative wird in der Fußnote genannt.
- source_word: ἐνέπρησεν
  choice: steckte … in Brand
  rationale: Das Verb bedeutet, etwas anzuzünden oder in Brand zu setzen. Die Formulierung ist im modernen Deutschen natürlich und behauptet nicht ausdrücklich eine vollständige Zerstörung.
- source_word: τὰ σκηνώματα αὐτῶν
  choice: ihre Zeltlager
  rationale: σκηνώματα kann Zelte, zeltartige Behausungen oder ganze Lager bezeichnen. »Zeltlager« bringt hier den nomadischen und kollektiven Sinn knapp und anschaulich zum Ausdruck.
- source_word: ἐπρονόμευσεν
  choice: plünderte
  rationale: Das Verb bezeichnet das Erbeuten oder Plündern im kriegerischen Zusammenhang. »Plünderte« ist die klare und sachlich passende deutsche Entsprechung.
- source_word: τὰς μάνδρας αὐτῶν
  choice: ihre Viehpferche
  rationale: μάνδρα bezeichnet eine Einfriedung oder einen Pferch für Tiere, häufig für Schafe, ohne die Tierart zwingend festzulegen. »Viehpferche« wahrt diese Bedeutungsbreite besser als »Schafpferche«.
