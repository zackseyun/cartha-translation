  text: And a great mixed multitude went out with them[a], like locusts and like the sand of the earth, for there was no number because of their multitude.
translation:
  language: de
  text: Und eine große gemischte Menge zog mit ihnen aus, wie Heuschrecken und wie der Sand der Erde; denn wegen ihrer großen Zahl waren sie nicht zu zählen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Denn wegen ihrer Menge gab es keine Zahl.« Der griechische Ausdruck besagt, dass sie unzählbar waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺς ὁ ἐπίμικτος
  choice: eine große gemischte Menge
  rationale: Das substantivierte ἐπίμικτος bezeichnet kollektiv eine aus unterschiedlichen Menschen zusammengesetzte Begleitmenge. »Eine große gemischte Menge« gibt den Sinn klar und ohne die altertümliche oder abwertende Färbung von »Mischvolk« wieder.
- source_word: συνεξῆλθον αὐτοῖς
  choice: zog mit ihnen aus
  rationale: Das zusammengesetzte Verb bezeichnet das gemeinsame Hinausziehen. »Zog mit ihnen aus« bewahrt die Bewegungsrichtung, ohne die militärische Bedeutung durch »marschierte« stärker festzulegen, als es der griechische Ausdruck verlangt.
- source_word: ὡς ἀκρίς
  choice: wie Heuschrecken
  rationale: Der kollektive Singular ἀκρίς steht im Vergleich für die unübersehbare Zahl; im Deutschen gibt der Plural das Bild natürlich wieder.
- source_word: ὡς ἡ ἄμμος τῆς γῆς
  choice: wie der Sand der Erde
  rationale: Die Formulierung bewahrt das biblische Bild und gibt γῆς unmittelbar wieder, ohne es enger als »Boden« oder »Land« zu bestimmen.
- source_word: οὐ γὰρ ἦν ἀριθμὸς ἀπὸ πλήθους αὐτῶν
  choice: denn wegen ihrer großen Zahl waren sie nicht zu zählen
  rationale: Die natürliche deutsche Wendung vermittelt die idiomatische Aussage des Griechischen, dass die Menge unzählbar war. »Großen« macht den kausalen Sinn von ἀπὸ πλήθους transparent, ohne eine genaue Zahl anzudeuten.
