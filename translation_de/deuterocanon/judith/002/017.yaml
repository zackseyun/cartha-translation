lexical_decisions:
- source_word: ἔλαβεν
  choice: nahm … mit
  rationale: Im erzählerischen und logistischen Zusammenhang bezeichnet λαμβάνω das Mitnehmen beziehungsweise Beschaffen der Tiere; ein gewaltsames Ergreifen steht nicht im Vordergrund.
- source_word: καμήλους καὶ ὄνους καὶ ἡμιόνους
  choice: Kamele, Esel und Maultiere
  rationale: Die drei Tierbezeichnungen werden mit ihren üblichen modernen deutschen Entsprechungen wiedergegeben.
- source_word: εἰς τὴν ἀπαρτίαν αὐτῶν
  choice: für ihr Gepäck
  rationale: ἀπαρτία bezeichnet hier die mitzuführende Ausstattung. Da Kamele, Esel und Maultiere als Lasttiere genannt werden, ist „Gepäck“ im unmittelbaren Zusammenhang besonders natürlich, ohne die weitere Bedeutung „Ausrüstung“ auszuschließen.
- source_word: πλῆθος πολὺ σφόδρα
  choice: eine überaus große Menge
  rationale: Die Formulierung bewahrt die starke Mengenangabe von πολὺ σφόδρα und bleibt im Deutschen flüssig.
- source_word: πρόβατα καὶ βόας καὶ αἶγας
  choice: Schafe, Rinder und Ziegen
  rationale: Dies sind die üblichen Entsprechungen; „Rinder“ lässt bei βόας offen, ob ausschließlich Ochsen oder allgemein Großvieh gemeint ist.
- source_word: εἰς τὴν παρασκευὴν αὐτῶν
  choice: für ihren Proviant
  rationale: παρασκευή kann Vorbereitung, Vorrat oder Versorgung bezeichnen. Bei den als Nahrungsvorrat mitgeführten Nutztieren trifft „Proviant“ den kontextuellen Sinn.
- source_word: ὧν οὐκ ἦν ἀριθμός
  choice: deren Zahl nicht zu zählen war
  rationale: Die deutsche Wendung gibt das griechische Bild einer nicht vorhandenen erfassbaren Zahl verständlich wieder und bewahrt den Gedanken der Unzählbarkeit.
