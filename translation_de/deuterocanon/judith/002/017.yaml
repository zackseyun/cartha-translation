    rationale: „deren Zahl nicht vorhanden war“ bildet die griechische Konstruktion zu mechanisch nach. „Von denen es keine Zahl gab“ ist als wörtlichere Erläuterung verständlicher, während der Text selbst die idiomatische Bedeutung korrekt wiedergibt.
