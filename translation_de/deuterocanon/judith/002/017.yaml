  footnotes:
  - marker: a
    text: 'Oder: „für die Ausrüstung seines Heeres“. Das griechische Wort bezeichnet allgemein die Ausstattung oder das mitgeführte Gerät.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für seinen Proviant“. Das griechische Wort kann Vorbereitung, Vorräte oder Versorgung bezeichnen; hier sind wahrscheinlich Nahrungsvorräte gemeint.'
