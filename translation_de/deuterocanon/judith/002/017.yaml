    issue: Unklarer Bezug von „ihr Gepäck“
    rationale: Ohne ein zuvor genanntes personales Bezugswort kann „ihr“ im Deutschen auf die genannten Lasttiere zurückverweisen. Im griechischen Kontext bezieht sich αὐτῶν auf die bereits erwähnte militärische Streitmacht. Die deutsche Fassung sollte diesen Bezug eindeutig machen.
  - severity: low
