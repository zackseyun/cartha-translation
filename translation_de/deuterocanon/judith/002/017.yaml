  text: Und er nahm Kamele, Esel und Maultiere für das Gepäck seines Heeres[a] mit, eine überaus große Menge, dazu Schafe, Rinder und Ziegen zu seiner Versorgung[b], deren Zahl nicht zu zählen war[c].
