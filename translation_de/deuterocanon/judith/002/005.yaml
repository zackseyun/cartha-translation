base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/005.yaml
  text: 'Thus says the great king[a], the lord of all the earth: Behold, you shall go out from my presence, and you shall take with yourself men confident in their strength, one hundred twenty thousand foot soldiers, and a multitude of horses with riders, one hundred twenty thousand.'
translation:
  language: de
  text: 'So spricht der große König, der Herr über die ganze Erde: Siehe, du sollst von mir fortziehen und Männer mit dir nehmen, die auf ihre Stärke vertrauen: 120.000 Fußsoldaten und eine große Zahl von Pferden samt Reitern, zwölf Myriaden[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Myriade entspricht 10.000; zwölf Myriaden entsprechen 120.000.
    reason: Die Fußnote erklärt die im Haupttext bewahrte griechische Zahlweise.
lexical_decisions:
- source_word: Τάδε λέγει
  choice: So spricht
  rationale: Die geläufige deutsche Botenformel bewahrt den feierlichen Proklamationsstil.
- source_word: ὁ βασιλεὺς ὁ μέγας
  choice: der große König
  rationale: Gibt den königlichen Titel unmittelbar und in gehobenem, natürlichem Deutsch wieder.
- source_word: ὁ κύριος πάσης τῆς γῆς
  choice: der Herr über die ganze Erde
  rationale: „Herr“ entspricht κύριος; die Kleinschreibung des Artikels und der Kontext kennzeichnen den Ausdruck als menschlichen Herrschertitel. „Über“ ist im Deutschen bei einem Herrschaftsanspruch natürlicher als „von“.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den nachdrücklichen, feierlichen Hinweischarakter, ohne das altertümlichere „Sieh!“ zu erzwingen.
- source_word: ἐξελεύσῃ ἐκ τοῦ προσώπου μου
  choice: du sollst von mir ausziehen
  rationale: Gibt die königliche Beauftragung idiomatisch wieder. „Von meinem Angesicht“ wäre unnötig wörtlich; „aus meiner Gegenwart“ klingt im Deutschen unnatürlich.
- source_word: λήμψῃ μετὰ σεαυτοῦ
  choice: Männer mit dir nehmen
  rationale: Entspricht dem begleitenden Sinn von μετὰ σεαυτοῦ in natürlichem Deutsch.
- source_word: ἄνδρας πεποιθότας ἐν ἰσχύι αὐτῶν
  choice: Männer, die auf ihre Stärke vertrauen
  rationale: Bewahrt den Vertrauens- beziehungsweise Sich-Verlassens-Aspekt von πεποιθότας, statt die Männer lediglich als stark zu beschreiben.
- source_word: πεζῶν εἰς χιλιάδας ἑκατὸν εἴκοσι
  choice: 120.000 Fußsoldaten
  rationale: Gibt die Zahl idiomatisch wieder und macht die militärische Bedeutung von πεζῶν deutlich.
- source_word: πλῆθος ἵππων σὺν ἀναβάταις
  choice: eine Menge Pferde samt Reitern
  rationale: Bewahrt die ausdrückliche Nennung sowohl der Pferde als auch ihrer Reiter.
- source_word: μυριάδας δέκα δύο
  choice: zwölf Myriaden
  rationale: Erhält die vom ersten Zahlenausdruck abweichende griechische Formulierung; eine Myriade bezeichnet zehntausend.
theological_decisions:
- issue: κύριος als Titel eines menschlichen Königs
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ bewahrt die übliche Entsprechung zu κύριος und die Wucht des universalen königlichen Anspruchs, ohne den König mit Gott gleichzusetzen; der Kontext macht den menschlichen Referenten eindeutig.
translation_notes:
  register: Feierlich-proklamatorisches, aber modernes Standarddeutsch. Die Satzstruktur bleibt dem königlichen Befehlston nahe; unnötige Archaismen werden vermieden. Der Doppelpunkt vor den Truppenzahlen gliedert die Apposition verständlich.
