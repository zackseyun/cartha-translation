base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/002.yaml
  text: And now[a], if your people who live in the hill country had not treated me with contempt, I would not have raised my spear against them; but they themselves have brought these things on themselves.
translation:
  language: de
  text: 'Und nun: Wenn dein Volk, das im Bergland wohnt, mich nicht verächtlich behandelt hätte, hätte ich meinen Speer nicht gegen sie erhoben. Doch sie selbst haben sich dies zugezogen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch sie selbst haben sich das angetan.“ Die griechische Formulierung betont, dass sie die Folgen selbst verursacht haben.'
    reason: Die reflexive Konstruktion ἑαυτοῖς und die Betonung durch αὐτοὶ werden idiomatisch erläutert, ohne eine ungenaue wörtliche Übersetzung zu behaupten.
lexical_decisions:
- source_word: ὁ λαός σου
  choice: dein Volk
  rationale: λαός bezeichnet hier das Volk als Kollektiv; „dein Volk“ ist im direkten Ansprechen natürlich und präzise.
- source_word: ὁ κατοικῶν τὴν ὀρεινήν
  choice: das im Bergland wohnt
  rationale: Die substantivierte Gebietsbezeichnung ἡ ὀρεινή meint das Berg- oder Hochland; der Singular des Partizips stimmt mit dem Kollektiv „Volk“ überein.
- source_word: εἰ μὴ ἐφαύλισάν με
  choice: wenn … mich nicht verächtlich behandelt hätte
  rationale: φαυλίζω bezeichnet, jemanden als gering zu behandeln oder ihm Geringschätzung zu zeigen. Die Formulierung gibt sowohl Haltung als auch Behandlung wieder und passt zur irrealen Bedingung.
- source_word: οὐκ ἂν ἦρα
  choice: hätte ich … nicht erhoben
  rationale: αἴρω bedeutet „heben/erheben“; mit ἄν bildet es hier die Folge einer irrealen Bedingung.
- source_word: τὸ δόρυ μου
  choice: meinen Speer
  rationale: δόρυ ist im militärischen Zusammenhang gewöhnlich ein Speer.
- source_word: ἐπʼ αὐτούς
  choice: gegen sie
  rationale: ἐπί mit Akkusativ bezeichnet bei einer feindlichen Waffenhandlung die Ausrichtung gegen Personen.
- source_word: ἀλλὰ αὐτοὶ ἑαυτοῖς ἐποίησαν ταῦτα
  choice: Doch sie selbst haben sich dies zugezogen
  rationale: Die idiomatische deutsche Wendung bewahrt die betonte Eigenverantwortung von αὐτοὶ und die reflexive Bedeutung von ἑαυτοῖς, ohne eine zusätzliche Ursache wie göttliches Gericht einzutragen.
theological_decisions:
- issue: Grad der ausdrücklichen Schuldzuweisung im Schlusssatz
  choice: sie selbst haben sich dies zugezogen
  alternative: sie selbst haben sich das angetan
  rationale: Die Übersetzung hält fest, dass das Geschehen selbstverschuldet ist, erklärt es aber weder als göttliches Gericht noch als Schicksal und lässt damit die Aussagegrenze des griechischen Textes bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bergland“ ist allgemein verständlich und geografisch treffend. Der irreale Bedingungssatz wird mit doppeltem Konjunktiv II der Vergangenheit klar wiedergegeben. Der Fußnotenmarker steht unmittelbar nach der erläuterten Schlussaussage.
