base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/010.yaml
  text: Therefore[a], master lord, do not disregard his word, but lay it up in your heart, because it is true; for our people are not avenged, nor does the sword prevail against them[c][b], unless they sin against their God.
translation:
  language: de
  text: Darum, Gebieter und Herr[a], missachte sein Wort nicht, sondern bewahre es in deinem Herzen, denn es ist wahr. Denn unser Volk wird nicht bestraft, und kein Schwert setzt sich gegen sie durch, es sei denn, sie sündigen gegen ihren Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische verwendet zwei Anredetitel: „Gebieter“ und „Herr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus dem vorangehenden Zusammenhang.
- source_word: δέσποτα κύριε
  choice: Gebieter und Herr
  rationale: Gibt beide griechischen Anredetitel wieder, ohne die Anrede als ausschließlich göttlichen Titel zu deuten; das verbindende „und“ entspricht natürlichem Deutsch.
- source_word: μὴ παρέλθῃς τὸν λόγον αὐτοῦ
  choice: missachte sein Wort nicht
  rationale: παρέρχομαι bezeichnet hier das Übergehen oder Nichtbeachten; „missachten“ gibt die idiomatische Bedeutung verständlich wieder.
- source_word: κατάθου αὐτὸν ἐν τῇ καρδίᾳ σου
  choice: bewahre es in deinem Herzen
  rationale: Bewahrt das Herzbild und vermittelt zugleich das innere Aufnehmen und Festhalten der Aussage.
- source_word: ἀληθής
  choice: wahr
  rationale: Direkte prädikative Wiedergabe, die sich auf das Wort beziehungsweise die Aussage bezieht.
- source_word: οὐ ἐκδικάται τὸ γένος ἡμῶν
  choice: an unserem Volk wird keine Vergeltung vollstreckt
  rationale: Die Formulierung wahrt den forensisch-punitiven Sinn von ἐκδικάται und vermeidet das im Deutschen missverständliche „unser Volk wird nicht gerächt“.
- source_word: τὸ γένος ἡμῶν
  choice: unser Volk
  rationale: γένος bezeichnet hier die ethnisch-religiöse Volksgemeinschaft; „Volk“ ist im heutigen Deutsch sachgemäßer als „Geschlecht“ oder „Rasse“.
- source_word: οὐ κατισχύει ῥομφαία ἐπʼ αὐτούς
  choice: kein Schwert gewinnt Macht über sie
  rationale: Erhält das konkrete Bild des Schwertes und gibt κατισχύω als Erlangen von Übermacht wieder.
- source_word: ἐὰν μὴ ἁμάρτωσιν εἰς τὸν θεὸν αὐτῶν
  choice: es sei denn, sie sündigen gegen ihren Gott
  rationale: Gibt die Ausnahmekondition präzise wieder und bewahrt die theologische Aussage, dass Niederlage an die Sünde gegen Gott gebunden ist.
theological_decisions:
- issue: Doppelte Anrede δέσποτα κύριε
  choice: Gebieter und Herr
  alternative: oberster Herr; Herr und Gebieter
  rationale: Beide Hoheitstitel bleiben sichtbar, ohne die an Holofernes gerichtete Anrede durch eine ausschließlich Gottesbezeichnung nahezulegen.
- issue: Bedingung für Bestrafung und militärische Niederlage Israels
  choice: es sei denn, sie sündigen gegen ihren Gott
  alternative: wenn sie nicht gegen ihren Gott sündigen
  rationale: Die deutsche Ausnahmekonstruktion bildet die kontextuelle Logik von ἐὰν μή ab und lässt die scharfe theologische Verknüpfung von Sünde, Vergeltung und Niederlage unverändert stehen.
- issue: Bedeutung von ἐκδικάται
  choice: an unserem Volk wird keine Vergeltung vollstreckt
  alternative: unser Volk wird nicht bestraft; unser Volk wird nicht gerächt
  rationale: Die gewählte Fassung versteht die Vergeltung als gegen das Volk gerichtete Strafvollstreckung, passend zum parallelen militärischen Bild; die mögliche wörtlichere Wiedergabe wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Anrede und das Bild vom Schwert bleiben erhalten; ungebräuchliche oder missverständliche Wörtlichkeit wird nur dort idiomatisch geglättet, wo der Sinn sonst verdunkelt würde.
