review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Folgerung, die doppelte Anrede, das Bild des Wortes im Herzen und die Ausnahmeklausel zutreffend wieder. Für ἐκδικάται ist „bestraft werden“ im Kontext der von Judith behaupteten Unbesiegbarkeit ihres Volkes die klarere und idiomatischere Wiedergabe als die abstrakte Passivformulierung mit „Vergeltung“.
  naturalness: „An unserem Volk wird keine Vergeltung vollstreckt“ ist verständlich, wirkt jedoch verwaltungs- bzw. juristensprachlich. Zudem ist der Wechsel von „unserem Volk“ zu „sie“ ohne ausdrücklich pluralische Bezugsgröße stilistisch unerquicklich. Die Revision stellt die Aussage natürlich und klar dar, während „sie“ weiterhin die Angehörigen des Volkes wiedergibt.
  terminology: „Gebieter und Herr“ bewahrt die zwei griechischen Titel angemessen. „Volk“, „sündigen“ und „Gott“ sind sachgerecht und im modernen Standarddeutsch registergerecht.
  issues:
  - severity: medium
    issue: Die Wiedergabe von ἐκδικάται und die zugehörige Fußnote sind unnötig abstrakt bzw. semantisch zu eng.
    rationale: Im gegebenen Kontext bezeichnet das Verb die gegen das Volk eintretende Straf- oder Gerichtshandlung. „Unser Volk wird nicht bestraft“ drückt dies natürlich aus. Die bisherige Fußnote bezeichnet „Unser Volk wird nicht gerächt“ als wörtliche Wiedergabe, obwohl dies die kontextuell relevante Richtung des Verbs nicht zuverlässig erklärt.
  - severity: low
    issue: Bezug von „sie“ nach dem singularischen Kollektivwort „Volk“ ist stilistisch nicht glatt.
    rationale: Die griechische Form αὐτούς ist pluralisch und meint die Angehörigen des Volkes. „Kein Schwert setzt sich gegen sie durch“ macht diesen Bezug im Deutschen idiomatischer als „gewinnt Macht über sie“.
  revised_text: Darum, Gebieter und Herr[a], missachte sein Wort nicht, sondern bewahre es in deinem Herzen, denn es ist wahr. Denn unser Volk wird nicht bestraft, und kein Schwert setzt sich gegen sie durch, es sei denn, sie sündigen gegen ihren Gott.
