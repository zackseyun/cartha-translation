  to: Darum, Gebieter und Herr[a], missachte sein Wort nicht, sondern bewahre es in deinem Herzen, denn es ist wahr. Denn unser Volk wird nicht bestraft, und kein Schwert setzt sich gegen sie durch, es sei denn, sie sündigen gegen ihren Gott.
  rationale: Die Revision ersetzt die schwerfällige Formulierung über die Vollstreckung von Vergeltung durch die im Kontext klare Aussage „unser Volk wird nicht bestraft“ und glättet die Wiedergabe des militärischen Bildes. Die doppelte Anrede, die Herzmetapher und die bedingte Aussage über Sünde gegen Gott bleiben erhalten. Die Fußnote zu ἐκδικάται wird als Bedeutungsfrage formuliert, statt eine problematische scheinwörtliche Alternative als „wörtlich“ auszugeben.
