translation_notes:
  register: Moderne, würdige Standardsprache. Die einleitende Konstruktion wurde idiomatisch als „Und nun zu dem, was …“ wiedergegeben. Das Semikolon hält den Zusammenhang zwischen dem Bekanntwerden der Worte und der anschließenden Begründung erkennbar.
