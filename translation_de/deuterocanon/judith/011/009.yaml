base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/009.yaml
  text: And now[a], concerning the matter that Achior spoke in your council, we have heard his words, because the men of Bethulia spared him[b], and he reported to them everything that he had spoken from you.
translation:
  language: de
  text: 'Und nun zu dem, was Achior in deiner Ratsversammlung gesagt hat: Wir haben seine Worte gehört; denn die Männer von Betulia haben ihn gerettet[a], und er hat ihnen alles berichtet, was er vor dir gesagt hatte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Leben erhalten“ beziehungsweise „in Sicherheit gebracht“. Das griechische Verb kann das Bewahren oder Retten einer Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „bei dir“. Gemeint ist wahrscheinlich alles, was Achior in deiner Gegenwart gesagt hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: das, was
  rationale: Das Substantiv bezeichnet hier den Inhalt von Achiors Rede, nicht nur ein einzelnes Wort. Die substantivierte Wendung ist im Deutschen natürlich und gibt den Bezug auf seine Äußerung treffend wieder.
- source_word: συνεδρείᾳ
  choice: Ratsversammlung
  rationale: Das Wort bezeichnet eine beratende Versammlung. „Ratsversammlung“ macht sowohl das Gremium als auch die konkrete Zusammenkunft deutlich.
- source_word: ἠκούσαμεν
  choice: wir haben … gehört
  rationale: Das deutsche Perfekt bringt passend zum Ausdruck, dass das Gehörte für die gegenwärtige Situation von Bedeutung ist.
- source_word: ῥήματα
  choice: Worte
  rationale: Die direkte Wiedergabe bewahrt den sprachlichen Charakter dessen, was über Achior bekannt geworden ist.
- source_word: περιεποίησαντο
  choice: haben ihn gerettet
  rationale: Das Verb kann das Bewahren oder In-Sicherheit-Bringen einer Person bezeichnen. Im Kontext geht es darum, dass die Männer von Betulia Achior aufgenommen und vor dem Tod bewahrt haben.
- source_word: οἱ ἄνδρες Βαιτυλουά
  choice: die Männer von Betulia
  rationale: Die Formulierung bezeichnet ausdrücklich die männlichen Einwohner beziehungsweise Verteidiger der Stadt; der Ortsname wird in der üblichen deutschen Form „Betulia“ wiedergegeben.
- source_word: ἀπήγγειλεν
  choice: hat … berichtet
  rationale: Das Verb bezeichnet das Übermitteln einer Nachricht oder eines ausführlichen Berichts und passt zur Weitergabe von Achiors Rede.
- source_word: παρὰ σοί
  choice: vor dir
  rationale: Die Wendung bezieht sich im Kontext wahrscheinlich auf das Reden in der Gegenwart des Holofernes. „Vor dir“ ist im Deutschen idiomatisch, lässt aber offen, ob die Rede unmittelbar an ihn gerichtet war.
