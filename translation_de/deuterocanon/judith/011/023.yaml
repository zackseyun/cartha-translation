base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/023.yaml
  text: And now you are beautiful in your appearance and good in your words. For if you do as you have spoken[a], your God will be my God, and you will dwell in the house of King Nabuchodonosor, and you will be renowned throughout all the earth.
translation:
  language: de
  text: Und nun bist du schön anzusehen, und deine Worte sind gut. Denn wenn du tust, was du gesagt hast, wird dein Gott mein Gott sein[a], und du wirst im Haus des Königs Nebukadnezar wohnen und auf der ganzen Erde berühmt sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische θεός („Gott“) legt nicht fest, ob Holofernes hier Israels Gott in einem bekenntnishaften Sinn meint. Seine Worte können auch seine heidnische Perspektive widerspiegeln.
    reason: Die Anmerkung bewahrt die im griechischen Wortlaut und im Kontext bestehende Deutungsspannung, ohne eine konfessionelle Aussage in den Text einzutragen.
lexical_decisions:
- source_word: ἀστεία … ἐν τῷ εἴδει σου
  choice: schön anzusehen
  rationale: Im Zusammenhang mit εἶδος bezeichnet ἀστεία eine ansprechende äußere Erscheinung. Die idiomatische Wendung gibt das natürliche Kompliment wieder, ohne den möglichen Sinn von Klugheit einzutragen.
- source_word: ἀγαθὴ ἐν τοῖς λόγοις σου
  choice: gut in deinen Worten
  rationale: Die relativ formnahe Wiedergabe erhält die Parallelität zum ersten Satzglied und bezeichnet die gute Qualität ihrer Rede.
- source_word: ἐὰν ποιήσῃς καθὰ ἐλάλησας
  choice: wenn du tust, was du gesagt hast
  rationale: Diese natürliche deutsche Formulierung bewahrt die Verbindung zwischen Judiths vorheriger Aussage und ihrem angekündigten Handeln.
- source_word: ὁ θεός σου ἔσται μού θεός
  choice: dein Gott wird mein Gott sein
  rationale: Im Deutschen werden Bezeichnungen für den einen Gott üblicherweise großgeschrieben. Da Holofernes ausdrücklich Judiths Gott meint, ist die Großschreibung im Haupttext natürlich; die griechische Schrift selbst entscheidet diese Frage jedoch nicht.
- source_word: καθιῇ
  choice: du wirst wohnen
  rationale: Das Verb bedeutet wörtlich unter anderem „sitzen“, bezeichnet mit „im Haus“ hier aber einen dauerhaften Aufenthalt beziehungsweise eine Stellung im königlichen Haus.
- source_word: ἐν οἴκῳ Ναβουχοδονόσορ βασιλέως
  choice: im Haus des Königs Nebukadnezar
  rationale: „Haus“ bewahrt die konkrete Ausdrucksweise des Griechischen, kann im königlichen Zusammenhang aber zugleich Haushalt oder Hof einschließen. Die geläufige deutsche Namensform ist „Nebukadnezar“.
- source_word: ὀνομαστὴ παρὰ πᾶσαν τὴν γῆν
  choice: auf der ganzen Erde berühmt
  rationale: ὀνομαστή bezeichnet eine weithin bekannte, namhafte Person; die räumliche Wendung trägt die umfassende Rhetorik des Satzes.
theological_decisions:
- issue: Großschreibung von θεός in der Aussage des Holofernes
  choice: dein Gott wird mein Gott sein
  alternative: dein Gott wird mein Gott sein, wobei „Gott“ als bloße Bezeichnung aus der heidnischen Perspektive des Sprechers verstanden wird
  rationale: Altgriechische Groß- und Kleinschreibung legt die Deutung nicht fest. Der Haupttext folgt der natürlichen deutschen Schreibung für Judiths Gott, während die Fußnote offenhält, dass Holofernes die Aussage aus seiner polytheistischen Perspektive macht und damit nicht zwingend ein echtes Bekenntnis ablegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Parallelismus, wird aber idiomatisch geglättet. „Nebukadnezar“ folgt der im Deutschen geläufigen Namensform.
