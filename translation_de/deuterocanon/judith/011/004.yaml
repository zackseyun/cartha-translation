base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/004.yaml
  text: Take courage; you will live through this night and beyond. For there is no one who will wrong you; rather[a], he will treat you well, as is done for the servants of my lord King Nebuchadnezzar.
translation:
  language: de
  text: Fass Mut! Du wirst diese Nacht und auch künftig am Leben bleiben. Denn niemand wird dir Unrecht tun; vielmehr wird man dich gut behandeln, wie man die Diener[a] meines Herrn, des Königs Nebukadnezar, behandelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sklaven«. Das griechische Wort kann je nach Zusammenhang Diener oder Sklaven bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάρσει
  choice: Fass Mut!
  rationale: Der Imperativ spricht Judith unmittelbar Mut zu. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt den ermutigenden Ton.
- source_word: ἐν τῇ νυκτὶ ταύτῃ ζήσῃ καὶ εἰς τὸ λοιπόν
  choice: Du wirst diese Nacht und auch künftig am Leben bleiben
  rationale: Die Wiedergabe verbindet das Überleben der unmittelbar bevorstehenden Nacht mit dem Fortleben danach. »Auch künftig« gibt εἰς τὸ λοιπόν idiomatisch wieder, ohne einen Endpunkt festzulegen.
- source_word: ἀδικήσει
  choice: wird dir Unrecht tun
  rationale: ἀδικέω bezeichnet ein ungerechtes Handeln oder eine Schädigung. »Unrecht tun« erhält die moralische Weite des griechischen Ausdrucks, ohne ihn auf körperliche Gewalt zu beschränken.
- source_word: ἀλλʼ εὖ σε ποιήσει
  choice: vielmehr wird man dich gut behandeln
  rationale: Nach dem unbestimmten ὃς steht im Griechischen ein generischer Singular. Das deutsche »man« gibt diesen unbestimmten Personenbezug klar und natürlich wieder; »gut behandeln« entspricht dem idiomatischen Sinn von εὖ ποιεῖν.
- source_word: καθὰ γίνεται
  choice: wie es … üblich ist
  rationale: Die Wendung verweist hier auf die gewöhnliche Behandlung im königlichen Dienst. Die deutsche Formulierung wahrt den allgemeinen, unpersönlichen Charakter.
- source_word: τοῖς δούλοις
  choice: bei den Dienern
  rationale: Im königlichen Hofkontext bezeichnet δοῦλοι die dem König unterstellten Menschen. »Diener« passt zum unmittelbaren Zusammenhang; da das Wort auch Sklaven bezeichnen kann, wird diese Möglichkeit in einer Fußnote offengehalten.
- source_word: τοῦ κυρίου μου βασιλέως Ναβουχοδονόσορ
  choice: meines Herrn, des Königs Nebukadnezar
  rationale: κύριος ist hier eine höfische Anrede beziehungsweise Herrschaftsbezeichnung und kein Gottesprädikat. Die Apposition »des Königs Nebukadnezar« bildet die griechische Titelfolge in natürlichem Deutsch ab.
theological_decisions:
- issue: Wiedergabe von δοῦλοι im königlichen Hofkontext
  choice: Diener
  alternative: Sklaven
  rationale: Der unmittelbare Zusammenhang hebt die Zugehörigkeit zum Dienst des Königs hervor, nicht ausdrücklich den rechtlichen Status. Deshalb steht »Diener« im Haupttext; die mögliche Bedeutung »Sklaven« bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Ermutigung bleibt knapp; höfische Unterordnung wird ohne altertümliche Ausdrucksweise erkennbar. Der Wechsel zum unpersönlichen »man« löst den im Deutschen missverständlichen Bezug eines wörtlichen »er« auf »niemand«, ohne den generischen Sinn des griechischen Singulars zu verändern.
