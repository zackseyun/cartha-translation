  yaml_path: translation/deuterocanon/judith/011/003.yaml
  text: And now tell me why you fled from them and came to us[a]; for you have come for deliverance.
translation:
  language: de
  text: Und nun sag mir, warum du von ihnen geflohen und zu uns gekommen bist; denn du bist hierher zu deiner Rettung[a] gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Sicherheit“ oder „zum Heil“. Griechisch εἰς σωτηρίαν: wörtlich etwa „zur Rettung“; der Ausdruck kann je nach Zusammenhang Rettung, Bewahrung oder Heil bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: nun
  rationale: Das temporale Adverb leitet die unmittelbare Aufforderung des Holofernes ein; „nun“ entspricht dem gehobenen, aber gegenwärtigen Erzählton.
- source_word: λέγε μοι
  choice: sag mir
  rationale: Der Imperativ mit Dativ wird im heutigen Deutsch natürlich und unmittelbar mit „sag mir“ wiedergegeben.
- source_word: τίνος ἕνεκεν
  choice: warum
  rationale: Die Wendung fragt nach dem Grund. „Warum“ bewahrt diese kausale Bedeutung ohne unnötig schwerfällige Formulierung.
- source_word: ἀπέδρας ἀπʼ αὐτῶν
  choice: du von ihnen geflohen bist
  rationale: ἀποδιδράσκω bezeichnet das Wegfliehen oder Entkommen; „geflohen“ wahrt die Bewegung und die Trennung von „ihnen“.
- source_word: ἦλθες πρὸς ἡμᾶς
  choice: zu uns gekommen bist
  rationale: Die schlichte Bewegungsangabe wird ohne den zusätzlichen Beiklang eines Parteiwechsels wiedergegeben.
- source_word: ἥκεις
  choice: du bist hierher gekommen
  rationale: ἥκω hebt das erfolgte Eintreffen und den daraus bestehenden gegenwärtigen Zustand hervor. „Hierher gekommen“ gibt diese resultative und deiktische Nuance natürlich wieder.
- source_word: εἰς σωτηρίαν
  choice: zu deiner Rettung
  rationale: σωτηρία kann Rettung, Bewahrung oder Heil bezeichnen. Im unmittelbaren Erzählzusammenhang spricht Holofernes von Judiths vermeintlicher persönlicher Rettung; „zu deiner Rettung“ wahrt zugleich die stärkere Rettungssemantik des griechischen Ausdrucks.
theological_decisions:
- issue: Bedeutung von σωτηρία in einem erzählerischen, nicht ausdrücklich theologischen Zusammenhang
  choice: zu deiner Rettung
  alternative: in Sicherheit; zum Heil
  rationale: „Rettung“ lässt die volle Bedeutungsbreite des Wortes eher erkennen als das rein zustandsbezogene „Sicherheit“, ohne in diesem Kontext ausdrücklich eine heilsgeschichtliche Aussage festzulegen. Die auf Judith bezogene Formulierung macht den von Holofernes behaupteten persönlichen Nutzen verständlich; die ungewöhnliche griechische Richtungsangabe wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Das Semikolon erhält den engen begründenden Zusammenhang der beiden griechischen Satzteile; die Formulierung vermeidet sowohl unnötigen Archaismus als auch eine vorschnelle theologische Festlegung.
