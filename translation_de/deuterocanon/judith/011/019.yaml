base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/019.yaml
  text: And I will lead you through the midst of Judea until you come opposite Jerusalem[a], and I will set your chariot in her midst, and you will drive them like sheep that have no shepherd, and not even a dog will growl with its tongue against you; for these things were spoken to me according to my foreknowledge, and they were reported to me[c][b], and I was sent to tell you.
translation:
  language: de
  text: Und ich werde dich mitten durch Judäa führen, bis du Jerusalem gegenüber ankommst[a]. Ich werde deinen Streitwagen mitten in Jerusalem aufstellen, und du wirst sie treiben wie Schafe, die keinen Hirten haben. Nicht einmal ein Hund wird dir gegenüber mit seiner Zunge knurren[b]. Denn dies wurde mir gemäß meinem Vorwissen gesagt[c] und mir berichtet, und ich wurde gesandt, es dir mitzuteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis du vor Jerusalem ankommst“ beziehungsweise „bis du Jerusalem gegenüber ankommst“. Das griechische Wort bezeichnet eine Stellung gegenüber oder vor der Stadt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Kein Hund wird dir gegenüber mit seiner Zunge knurren.“ Das Bild drückt aus, dass sich nicht der geringste Widerstand regen wird.'
    reason: cultural_note
  - marker: c
    text: „Vorwissen“ meint hier Kenntnis im Voraus; das Wort muss nicht als theologischer Fachbegriff verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: ich werde dich … führen
  rationale: Das Futur von ἄγω bezeichnet hier Judiths behauptete persönliche Führung des Holofernes durch das Land.
- source_word: διὰ μέσου τῆς Ἰουδαίας
  choice: mitten durch Judäa
  rationale: Bewahrt die räumliche Anschaulichkeit und ist im modernen Deutschen natürlicher als „durch die Mitte Judäas“.
- source_word: ἕως τοῦ ἐλθεῖν ἀπέναντι Ἰερουσαλήμ
  choice: bis du Jerusalem gegenüberstehst
  rationale: ἀπέναντι bezeichnet eine Position gegenüber bzw. vor Jerusalem und besagt nicht eindeutig, dass die Stadt betreten wird.
- source_word: θήσω τὸν δίφρον σου
  choice: ich werde deinen Streitwagen … aufstellen
  rationale: δίφρος kann Sitz oder Wagen bezeichnen; der militärische Zusammenhang spricht für „Streitwagen“.
- source_word: ἐν μέσῳ αὐτῆς
  choice: mitten in der Stadt
  rationale: Das Pronomen bezieht sich am plausibelsten auf Jerusalem; die explizite Wiedergabe vermeidet im Deutschen ein unklares „in ihrer Mitte“.
- source_word: ἄξεις αὐτούς
  choice: du wirst sie treiben
  rationale: Im anschließenden Vergleich mit einer führungslosen Herde gibt „treiben“ das gewaltsame Verfügen über die Menschen treffend wieder; „führen“ bleibt möglich.
- source_word: ὡς πρόβατα οἷς οὐκ ἔστιν ποιμήν
  choice: wie Schafe, die keinen Hirten haben
  rationale: Die Formulierung wahrt das biblische Bild schutz- und führungsloser Menschen.
- source_word: οὐ γρύξει κύων τῇ γλώσσῃ αὐτοῦ
  choice: Nicht einmal ein Hund wird … mit seiner Zunge knurren
  rationale: γρύζω meint eher Knurren als gewöhnliches Bellen. Die ausdrücklich genannte Zunge bleibt trotz ihrer Fremdheit erhalten.
- source_word: κατὰ πρόγνωσίν μου
  choice: aufgrund meines Vorwissens
  rationale: πρόγνωσις bezeichnet hier Wissen im Voraus; „Vorwissen“ wahrt die Aussage, ohne einen späteren dogmatischen Fachbegriff aufzudrängen.
- source_word: ἀπηγγέλη μοι
  choice: mir berichtet
  rationale: Die Passivform bezeichnet Judith als Empfängerin einer Mitteilung und bleibt hinsichtlich des Mitteilenden offen.
- source_word: ἀπεστάλην ἀναγγεῖλαί σοι
  choice: ich wurde gesandt, es dir mitzuteilen
  rationale: Gibt sowohl den behaupteten Auftrag als auch das Berichten an Holofernes natürlich und präzise wieder.
theological_decisions:
- issue: Bedeutung von πρόγνωσις in Judiths Rede
  choice: Vorwissen im Sinn vorheriger Kenntnis
  alternative: besondere Offenbarung oder Vorahnung
  rationale: Der griechische Ausdruck benennt Kenntnis im Voraus, bestimmt aber weder deren genaue Quelle noch zwingend einen technischen theologischen Begriff. Die Übersetzung lässt diese Spannung bestehen.
- issue: Quelle der Judith mitgeteilten Worte und ihrer Sendung
  choice: Passivformulierungen ohne ausdrückliche Nennung des Sendenden
  alternative: Gott als ausdrücklich genannter Sprecher und Sender
  rationale: Der griechische Text verwendet unpersönliche Passivformen. Obwohl ein göttlicher Urheber im Kontext mitgemeint sein kann, soll er nicht in den Wortlaut eingefügt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die markante Bildsprache des Griechischen bleibt erhalten; unnötige Archaismen und dogmatisch vereindeutigende Ergänzungen werden vermieden.
