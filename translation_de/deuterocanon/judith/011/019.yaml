  naturalness: Modernes, würdiges Deutsch. „Bis du Jerusalem gegenüber ankommst“ ist idiomatischer und bildet den Bewegungsaspekt präziser ab. Die explizite Nennung Jerusalems bei „mitten in Jerusalem“ ist klar und natürlich.
