base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/016.yaml
  text: Therefore I[a], your servant, having learned all these things, fled from before them, and God sent me to do with you things at which the whole earth will be astonished[c][b], whenever they hear of them.
translation:
  language: de
  text: Darum bin ich, deine Dienerin, nachdem ich dies alles erfahren hatte, aus ihrer Gegenwart geflohen. Und Gott hat mich gesandt, um mit dir Dinge zu vollbringen[a], über die die ganze Erde[b] staunen wird, wann immer man davon hört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um mit dir Taten auszuführen«. Der griechische Ausdruck lässt offen, auf welche Weise Holofernes daran beteiligt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die ganze Welt«; in engerem Sinn auch: »das ganze Land«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Darum
  rationale: Leitet aus dem zuvor Gesagten eine Folgerung beziehungsweise Begründung ab und klingt im Deutschen natürlich.
- source_word: ἡ δούλη σου
  choice: deine Dienerin
  rationale: Gibt Judiths ehrerbietige Selbstbezeichnung im höfischen Kontext wieder, ohne hier unnötig einen rechtlichen Sklavenstatus hervorzuheben.
- source_word: ἐπιγνοῦσα ταῦτα πάντα
  choice: nachdem ich dies alles erfahren hatte
  rationale: Drückt aus, dass Judith vor ihrer Flucht Kenntnis von all dem erlangt hatte; der deutsche Nebensatz bildet das zeitliche Verhältnis klar ab.
- source_word: ἀπέδρων ἀπὸ προσώπου αὐτῶν
  choice: aus ihrer Gegenwart geflohen
  rationale: Bewahrt den Präsenzsinn der semitisch geprägten Wendung und vermeidet das im heutigen Deutsch unnatürliche wörtliche »vor ihrem Angesicht«.
- source_word: ἀπέστειλέν με ὁ θεός
  choice: Gott hat mich gesandt
  rationale: Gibt die behauptete göttliche Beauftragung unmittelbar und ohne kommentierende Abschwächung wieder.
- source_word: ποιῆσαι μετὰ σοῦ πράγματα
  choice: um mit dir Dinge zu vollbringen
  rationale: Erhält die Weite von πράγματα und lässt offen, in welcher genauen Weise Holofernes an dem Geschehen beteiligt ist.
- source_word: ἐφʼ οἷς ἐκστήσεται
  choice: über die ... staunen wird
  rationale: Natürliches modernes Deutsch für den Anlass starken Erstaunens.
- source_word: πᾶσα ἡ γῆ
  choice: die ganze Erde
  rationale: Bewahrt die rhetorische Weite des griechischen Ausdrucks, der je nach Zusammenhang auch Welt oder Land bezeichnen kann.
- source_word: ὅσο ἐὰν ἀκούσωσιν αὐτά
  choice: sobald man davon hört
  rationale: Gibt die hörenden Menschen idiomatisch mit unpersönlichem »man« wieder und bezieht »davon« auf die angekündigten Dinge.
theological_decisions:
- issue: Judiths Behauptung göttlicher Sendung
  choice: »Gott hat mich gesandt« wird als direkte Aussage wiedergegeben.
  alternative: Die Aussage als bloße Meinung oder angebliche Sendung Judiths abschwächen.
  rationale: Der Text berichtet Judiths Rede unmittelbar. Die Übersetzung soll ihren Anspruch weder zusätzlich bestätigen noch relativieren.
- issue: Art der Beteiligung des Holofernes
  choice: Die offene Formulierung »mit dir Dinge zu vollbringen« bleibt erhalten.
  alternative: Holofernes ausdrücklich als Werkzeug, Partner oder Empfänger der Taten bestimmen.
  rationale: μετὰ σοῦ legt die genaue Rolle nicht eindeutig fest; diese Spannung darf nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Judiths ehrerbietige Redeweise bleibt durch »deine Dienerin« erkennbar. Der erste lange griechische Satz ist zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert; die inhaltliche Verknüpfung bleibt durch »Und« gewahrt.
