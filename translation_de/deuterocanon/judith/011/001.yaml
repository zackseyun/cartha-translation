base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/001.yaml
  text: And Holofernes said to her[a], “Take courage, woman; do not be afraid in your heart[c][b], for I have harmed no man who has chosen to serve King Nebuchadnezzar of all the earth.”
translation:
  language: de
  text: 'Da sagte Holofernes zu ihr: »Fass Mut, Frau, und fürchte dich nicht in deinem Herzen[a]; denn ich habe keinem Menschen Leid zugefügt, der sich entschieden hat[b], Nebukadnezar, dem König der ganzen Erde[c], zu dienen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idiomatischer auch: »Hab keine Angst.«'
    reason: Die griechische Wendung lokalisiert die Furcht ausdrücklich im Herzen; die Übersetzung bewahrt dieses Bild, während die Alternative es im Deutschen glättet.
  - marker: b
    text: 'Oder: »der es vorgezogen hat«.'
    reason: Das zugrunde liegende Verb kann sowohl »wählen« als auch »vorziehen« bedeuten.
  - marker: c
    text: Die Bezeichnung »König der ganzen Erde« gibt den imperialen Herrschaftsanspruch des Sprechers wieder. »Erde« kann in anderen Zusammenhängen auch »Land« bedeuten.
    reason: Die Anmerkung bewahrt die Bedeutungsbreite von γῆ und ordnet die universal klingende Titulatur als Figurenrede ein.
lexical_decisions:
- source_word: Θάρσησον
  choice: Fass Mut
  rationale: Der Imperativ fordert zu Zuversicht und Mut auf. »Fass Mut« ist im modernen Deutschen natürlich und bewahrt die ermutigende Kraft.
- source_word: γύναι
  choice: Frau
  rationale: Die direkte Anrede wird schlicht und ohne zusätzliche Höflichkeitsnuance wiedergegeben.
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: fürchte dich nicht in deinem Herzen
  rationale: Die ausdrückliche Verortung der Furcht im Herzen bleibt erhalten, auch wenn die Wendung im Deutschen bewusst etwas semitisch geprägt klingt.
- source_word: ἐκάκωσα
  choice: habe ... Leid zugefügt
  rationale: κακόω bezeichnet allgemein das Schädigen oder schlechte Behandeln. »Leid zufügen« ist verständlich und legt weder ausschließlich körperliche Gewalt noch rechtliches Unrecht fest.
- source_word: ἄνθρωπον
  choice: Menschen
  rationale: ἄνθρωπος ist hier allgemein auf eine beliebige Person bezogen. »Mensch« gibt diese generische Bedeutung im Deutschen eindeutig wieder.
- source_word: ὅστις ἡρέτικεν
  choice: der sich entschieden hat
  rationale: Die Form von αἱρέω bezeichnet eine getroffene Wahl oder Bevorzugung; »sich entschieden hat« bewahrt sowohl den Wahlakt als auch den resultativen Aspekt.
- source_word: δουλεύειν
  choice: zu dienen
  rationale: Im politischen Zusammenhang bezeichnet das Verb die Unterordnung unter einen König. »Dienen« erhält die Dienst- und Unterwerfungsnuance, ohne zwingend rechtliche Sklaverei zu behaupten.
- source_word: βασιλεῖ Ναβουχοδονόσορ
  choice: Nebukadnezar, dem König
  rationale: Die Apposition entspricht natürlichem deutschen Satzbau und kennzeichnet Nebukadnezar ausdrücklich als König.
- source_word: πάσης τῆς γῆς
  choice: der ganzen Erde
  rationale: γῆ kann »Land« oder »Erde« bedeuten. Im universalen Herrschaftsanspruch dieser Titulatur gibt »ganze Erde« die übersteigerte imperiale Reichweite am besten wieder.
theological_decisions:
- issue: Universaler Herrschaftsanspruch im Titel Nebukadnezars
  choice: König der ganzen Erde
  alternative: König des ganzen Landes
  rationale: Die Übersetzung bewahrt die universale imperiale Rhetorik des Sprechers, ohne sie als wahre Aussage der Erzählung oder als theologische Bestätigung zu kennzeichnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt knapp; der leicht fremdartige Herzensausdruck wird bewusst erhalten. Die Rede Holofernes’ wird nicht sprachlich abgeschwächt, aber auch nicht als objektiv wahr bestätigt.
