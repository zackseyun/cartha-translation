  text: And if you follow the words of your servant girl[a], God will fully accomplish the matter with you[b], and my lord will not depart from his purposes.
translation:
  language: de
  text: Und wenn du den Worten deiner Dienerin[a] folgst, wird Gott die Sache mit dir vollständig zum Ziel bringen[b], und mein Herr wird von seinen Vorhaben nicht ablassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn du auf die Worte deiner Dienerin hörst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird Gott die Sache durch dich vollständig ausführen“; das Griechische kann die genaue Beziehung von Gottes Handeln zu „dir“ offenlassen.'
    reason: ambiguity
lexical_decisions:
- source_word: κατακολουθήσῃς
  choice: folgst
  rationale: Das Verb bezeichnet ein Nachfolgen oder Sich-Richten nach etwas. „Den Worten folgen“ bewahrt das Bild des griechischen Ausdrucks und ist im Deutschen verständlich.
- source_word: λόγοις
  choice: den Worten
  rationale: Die wörtliche Bedeutung bleibt erhalten; im Zusammenhang sind damit Judiths Rat und Anweisungen gemeint.
- source_word: παιδίσκης
  choice: Dienerin
  rationale: Das Wort bezeichnet eine junge weibliche Dienende und dient hier Judiths demütiger Selbstbezeichnung. „Dienerin“ ist modern und legt den rechtlichen Status nicht stärker fest als der Kontext.
- source_word: τελείως
  choice: vollständig
  rationale: Das Adverb bezeichnet die vollständige beziehungsweise erfolgreiche Ausführung.
- source_word: πρᾶγμα
  choice: die Sache
  rationale: Der breite griechische Ausdruck kann eine Sache, Angelegenheit oder Unternehmung bezeichnen. „Die Sache“ wahrt diese Offenheit.
- source_word: ποιήσει μετὰ σοῦ
  choice: wird … mit dir … zum Ziel bringen
  rationale: Die Formulierung gibt die Vollendung einer Sache wieder und bewahrt mit „mit dir“ die offene Relation von μετά, ohne sie eindeutig als „durch dich“ oder „für dich“ auszulegen.
- source_word: ὁ θεός
  choice: Gott
  rationale: Übliche deutsche Wiedergabe von θεός.
- source_word: οὐκ ἀποστεῖται … τῶν
  choice: wird von … nicht ablassen
  rationale: Der Ausdruck bezeichnet hier, dass jemand sich von seinen Bestrebungen nicht entfernt beziehungsweise sie nicht aufgibt. „Nicht ablassen“ ist natürlich und bewahrt diesen Sinn.
- source_word: ὁ κύριός μου
  choice: mein Herr
  rationale: Judith gebraucht κύριος als ehrerbietige Anrede beziehungsweise Bezeichnung für den menschlichen Machthaber Holofernes, nicht als Gottesbezeichnung.
- source_word: ἐπιτηδευμάτων
  choice: Vorhaben
  rationale: Das Substantiv kann Betätigungen, Bestrebungen oder Unternehmungen bezeichnen. „Vorhaben“ passt zum Kontext, ohne einen einzelnen konkreten Plan zu unterstellen.
theological_decisions:
- issue: Bezug von κύριος auf einen menschlichen Herrn
  choice: mein Herr
  alternative: mein Gebieter
  rationale: Der Bezug gilt Holofernes. „Herr“ erhält die ehrerbietige Titelbedeutung, ohne Göttlichkeit anzudeuten.
- issue: Art von Gottes Mitwirkung in ποιήσει μετὰ σοῦ
  choice: Gott wird die Sache mit dir zum Ziel bringen
  alternative: Gott wird die Sache durch dich ausführen
  rationale: μετά bezeichnet ausdrücklich eine Beziehung „mit“ Holofernes, lässt aber offen, ob Mitwirkung, Mittel oder Begünstigung im Vordergrund steht. Die Übersetzung entscheidet diese Spannung nicht vorschnell.
translation_notes:
  register: Moderne, würdige Standardsprache. „Dienerin“ vermeidet das altertümlichere „Magd“, während „mein Herr“ die höfische Erzählwelt erkennen lässt. Die Aussage bleibt als Rede Judiths stehen; ihre theologische Behauptung wird weder bestätigt noch abgeschwächt.
