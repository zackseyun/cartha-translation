base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/012.yaml
  text: For when their food had run out and all water had become scarce[a], they decided to use their livestock, and they determined to consume everything that God had commanded them by his laws not to eat.
translation:
  language: de
  text: Denn ihre Lebensmittel gingen zur Neige, und Wasser wurde überall knapp. Deshalb beschlossen sie, auf ihren Viehbestand zurückzugreifen[a], und sie waren entschlossen, alles zu verzehren, was Gott ihnen durch seine Gesetze zu essen verboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sich auf ihren Viehbestand zu stürzen“ oder „Hand an ihren Viehbestand zu legen“. Die bildhafte griechische Wendung beschreibt, dass sie in ihrer Not auf ihre Tiere als Nahrung zurückgreifen wollten; sie nennt die konkrete Handlung, etwa Schlachtung oder unmittelbaren Verzehr, nicht ausdrücklich.'
    reason: Die griechische Wendung ἐπιβαλεῖν τοῖς κτήνεσιν ist bildhaft und lässt die konkrete Handlung unausgesprochen.
lexical_decisions:
- source_word: ἐξέλειπεν αὐτοὺς τὰ βρώματα
  choice: ihre Lebensmittel gingen zur Neige
  rationale: Das Imperfekt bezeichnet die fortschreitende Erschöpfung der Vorräte. „Gingen zur Neige“ ist natürliches Deutsch und vermeidet die stärkere Aussage, dass bereits gar nichts mehr vorhanden war.
- source_word: ἐσπανίσθη πᾶν ὕδωρ
  choice: alles Wasser wurde knapp
  rationale: Das Passiv bezeichnet umfassenden Wassermangel, nicht zwingend ein völliges Versiegen.
- source_word: ἐβουλεύσαντο
  choice: sie beschlossen
  rationale: Das Verb bezeichnet eine Beratung oder Überlegung, die hier zu einem Entschluss führt.
- source_word: ἐπιβαλεῖν τοῖς κτήνεσιν αὐτῶν
  choice: sich an ihrem Viehbestand zu vergreifen
  rationale: Die Wendung bedeutet wörtlich, über die eigenen Tiere herzufallen bzw. Hand an sie zu legen. Die deutsche Formulierung bewahrt den verzweifelten und unerlaubt wirkenden Zugriff, ohne das im Griechischen nicht ausdrücklich genannte Schlachten einzutragen.
- source_word: κτήνεσιν
  choice: Viehbestand
  rationale: κτῆνος bezeichnet gehaltene Nutz- oder Besitztiere; „Viehbestand“ passt zur Gesamtheit ihrer Tiere.
- source_word: πάντα ὅσα
  choice: alles, was
  rationale: Die umfassende Formulierung des Griechischen wird direkt wiedergegeben.
- source_word: διεστείλατο ... ὁ θεὸς
  choice: Gott ... verboten hatte
  rationale: In Verbindung mit μὴ φαγεῖν bezeichnet das Verb eine verbindliche göttliche Anordnung. Die idiomatische deutsche Negativform „verboten“ gibt den Sinn präzise wieder.
- source_word: τοῖς νόμοις αὐτοῦ
  choice: durch seine Gesetze
  rationale: 'Der Dativ kann instrumental verstanden werden: Die Verbote wurden durch Gottes Gesetze verfügt.'
- source_word: διέγνωσαν δαπανῆσαι
  choice: waren sie entschlossen, ... zu verzehren
  rationale: διέγνωσαν bezeichnet einen festen Entschluss; δαπανῆσαι bedeutet hier, die verbotenen Nahrungsmittel aufzubrauchen beziehungsweise zu verzehren.
theological_decisions:
- issue: Göttliche Speiseverbote
  choice: alles, was Gott ihnen durch seine Gesetze zu essen verboten hatte
  alternative: alles, von dem Gott ihnen durch seine Gesetze geboten hatte, es nicht zu essen
  rationale: Die Wiedergabe wahrt, dass die Speiseverbote von Gott ausgehen und in seinen Gesetzen verankert sind, ohne bestimmte Torastellen oder spätere konfessionelle Deutungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausale Beziehung des einleitenden ἐπεὶ γάρ wird mit „Denn ... Deshalb“ transparent gemacht. Die Fußnote bewahrt die Bildhaftigkeit und Bedeutungsbreite der griechischen Wendung.
