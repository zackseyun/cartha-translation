  to: Denn ihre Lebensmittel gingen zur Neige, und Wasser wurde überall knapp. Deshalb beschlossen sie, auf ihren Viehbestand zurückzugreifen[a], und sie waren entschlossen, alles zu verzehren, was Gott ihnen durch seine Gesetze zu essen verboten hatte.
  rationale: Die Revision ersetzt die missverständliche, wertende Formulierung „sich ... vergreifen“ durch „auf ihren Viehbestand zurückzugreifen“. Sie bewahrt damit den durch den Kontext verlangten Bezug auf Nahrung, ohne eine konkrete Handlung über den griechischen Wortlaut hinaus festzulegen. „Wasser wurde überall knapp“ gibt πᾶν ὕδωρ idiomatischer wieder als „alles Wasser wurde knapp“ und wahrt den Sinn umfassender Wasserknappheit.
