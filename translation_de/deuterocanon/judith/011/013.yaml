  - severity: low
    issue: Formulierung „den Priestern geheiligt“
    rationale: Diese Dativverbindung ist semantisch möglich, aber im modernen Deutsch missverständlich. Der griechische Ausdruck bezeichnet die Weihe der Gaben mit Bestimmung für die Priester; „für die Priester geweiht“ ist klarer.
