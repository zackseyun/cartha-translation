base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/013.yaml
  text: And the firstfruits of the grain and the tithes of the wine and of the oil[a], which they had set aside, having consecrated them for the priests who stand in Jerusalem before the face of our God—they have decided to consume[b], though it is not permitted for any of the people even to touch them with their hands.
translation:
  language: de
  text: Auch die Erstlingsgaben des Getreides und die Zehnten vom Wein und vom Öl, die sie aufbewahrt und für die Priester geweiht hatten, die in Jerusalem vor dem Angesicht unseres Gottes stehen[a], haben sie beschlossen aufzubrauchen, obwohl niemand aus dem Volk sie auch nur mit den Händen berühren durfte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor unserem Gott“ beziehungsweise „in der Gegenwart unseres Gottes“. Wörtlicher heißt es im Griechischen: „vor dem Angesicht unseres Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „obwohl es für niemanden aus dem Volk rechtmäßig war“ beziehungsweise „obwohl es sich für niemanden aus dem Volk gehörte“, sie auch nur mit den Händen zu berühren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὰς
  choice: Erstlingsgaben
  rationale: Der kultische Fachausdruck bezeichnet den ersten Teil des Ertrags, der als heilige Gabe ausgesondert wird.
- source_word: σίτου
  choice: Getreide
  rationale: σῖτος kann speziell Weizen, aber auch Getreide allgemein bezeichnen; der weitere Oberbegriff vermeidet eine unnötige Einengung.
- source_word: δεκάτας
  choice: Zehnten
  rationale: „Zehnter“ ist der geläufige deutsche Ausdruck für die kultische Abgabe, die δεκάτη bezeichnet.
- source_word: ἐφυλάξαν
  choice: aufbewahrt
  rationale: Das Verb bezeichnet hier das Bewahren beziehungsweise Zurückhalten der Erträge für den heiligen Zweck; „aufbewahrt“ bleibt nahe am griechischen Wortlaut.
- source_word: ἁγιάσαντες
  choice: geheiligt hatten
  rationale: Das Partizip bezeichnet die vorherige Aussonderung für den heiligen Gebrauch. „Geheiligt“ wahrt den kultischen Gehalt und fügt sich natürlich in den deutschen Satz ein.
- source_word: τοῖς ἱερεῦσιν
  choice: den Priestern
  rationale: Der Dativ bezeichnet die Priester als Empfänger beziehungsweise Nutznießer der geheiligten Gaben, ohne dass zwischen „für“ und „den“ unnötig entschieden werden muss.
- source_word: τοῖς παρεστηκόσιν
  choice: die ... stehen
  rationale: Die wörtliche Vorstellung des Dastehens wird bewahrt; im Tempelzusammenhang schwingt der priesterliche Dienst mit, ohne ausdrücklich in die Übersetzung eingetragen zu werden.
- source_word: ἀπέναντι τοῦ προσώπου τοῦ θεοῦ ἡμῶν
  choice: vor dem Angesicht unseres Gottes
  rationale: Die bildhafte, semitisch geprägte Wendung des Griechischen wird in einer verständlichen und würdevollen deutschen Form erhalten.
- source_word: κεκρίκασιν
  choice: haben sie beschlossen
  rationale: Das Perfekt bezeichnet einen gefassten, weiterhin geltenden Entschluss und nicht ein gerichtliches Urteil.
- source_word: ἐξαναλῶσαι
  choice: aufzubrauchen
  rationale: Das Verb bedeutet, etwas vollständig zu verbrauchen oder aufzubrauchen. Diese Wiedergabe wahrt den Aspekt der vollständigen Verwendung, ohne ausschließlich an den Verzehr zu denken.
- source_word: οὐδὲ ταῖς χερσὶν καθῆκεν ἅψασθαι
  choice: auch nur mit den Händen berühren darf
  rationale: Die Formulierung gibt sowohl die normative Kraft von καθῆκεν als auch die ausdrückliche Erwähnung der Hände wieder; eine Fußnote hält die Bedeutungsnuance zwischen Erlaubnis, Rechtmäßigkeit und Angemessenheit offen.
- source_word: οὐδένα τῶν ἐκ τοῦ λαοῦ
  choice: niemand aus dem Volk
  rationale: Die Wendung unterscheidet die gewöhnlichen Angehörigen des Volkes von den Priestern, ohne eine zusätzliche soziale Wertung einzutragen.
theological_decisions:
- issue: Kultischer Status der für die Priester bestimmten Erträge
  choice: Die Erträge waren aufbewahrt und den Priestern zum heiligen Gebrauch geweiht; deshalb durfte niemand aus dem übrigen Volk sie berühren.
  alternative: Die Erträge könnten lediglich praktisch zurückgelegt und nicht förmlich geheiligt worden sein.
  rationale: Das Zusammenspiel von ἐφυλάξαν, ἁγιάσαντες, der ausdrücklichen Bestimmung für die Priester und dem Berührungsverbot weist deutlich auf einen kultisch geheiligten Status hin.
- issue: Bedeutung des Stehens der Priester vor Gott
  choice: Die konkrete Wendung „vor dem Angesicht unseres Gottes stehen“ bleibt erhalten.
  alternative: Man könnte deutend mit „im Dienst unseres Gottes stehen“ oder vereinfachend mit „vor unserem Gott stehen“ übersetzen.
  rationale: Der griechische Text verbindet eine räumlich-kultische Vorstellung mit möglicher Dienstbedeutung. Die formnahe Wiedergabe bewahrt beide Ebenen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen kultischen Begriffen. Die Partizipialfolge des Griechischen wurde in eine gut lesbare deutsche Relativkonstruktion überführt. „Vor dem Angesicht“ erhält die feierliche Bildsprache; „aufzubrauchen“ wahrt die Bedeutungsbreite von vollständigem Verbrauch gegenüber einer engeren Festlegung auf Essen.
