  source_fidelity: Der Entwurf gibt die Opfergaben (ἀπαρχαί, δεκάται), ihre Aufbewahrung und Weihe für die Priester sowie den gefassten Beschluss, sie zu verbrauchen, insgesamt zutreffend wieder. Die Wiedergabe des kultischen Verbots mit dem Präsens „darf“ verwischt jedoch den erzählten, im Griechischen durch καθῆκεν ausgedrückten Bezugsrahmen. „Durfte“ entspricht dem Kontext genauer, ohne die generelle kultische Geltung zu bestreiten.
  naturalness: Der Satz ist würdig und gut verständlich. „Den Priestern geheiligt“ ist im Deutschen jedoch weniger idiomatisch und kann so wirken, als seien die Priester selbst geheiligt worden. „Für die Priester geweiht“ macht die Bestimmung der Gaben klar und bleibt dem griechischen Dativ angemessen.
  terminology: „Erstlingsgaben“, „Zehnten“, „vor dem Angesicht unseres Gottes“ und „aufzubrauchen“ sind treffende, registergerechte Wiedergaben. „Geweiht“ ist für ἁγιάσαντες im vorliegenden kultischen Zusammenhang klarer als „geheiligt“.
