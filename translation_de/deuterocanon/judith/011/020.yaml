  text: And her words pleased Holofernes and all his attendants, and they marveled at her wisdom and said,
translation:
  language: de
  text: 'Ihre Worte gefielen Holofernes und allen seinen Gefolgsleuten. Sie staunten über ihre Weisheit und sagten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: gefielen
  rationale: Das Verb ἀρέσκω bezeichnet hier die wohlwollende Aufnahme von Judits Worten; „gefielen“ ist natürlich und quellenah.
- source_word: οἱ λόγοι αὐτῆς
  choice: ihre Worte
  rationale: Die wörtliche Wiedergabe bleibt im Deutschen idiomatisch und bewahrt den Bezug auf Judits Rede.
- source_word: ἐναντίον Ὀλοφέρνου καὶ ἐναντίον πάντων τῶν θεραπόντων αὐτοῦ
  choice: Holofernes und allen seinen Dienern
  rationale: Nach „gefielen“ wird ἐναντίον im Deutschen sinnvoll durch die Personen im Dativ ausgedrückt; die räumliche Grundbedeutung „vor/in Gegenwart von“ tritt hier hinter der Bedeutung des Gefallens zurück.
- source_word: θεραπόντων
  choice: Dienern
  rationale: θεράπων bezeichnet Diener, Gefolgsleute oder persönliche Begleiter. „Diener“ ist in diesem höfisch-militärischen Zusammenhang verständlich und angemessen, ohne den spezifischen Status von δοῦλος einzutragen.
- source_word: ἐθαύμασαν
  choice: staunten
  rationale: „Staunten“ gibt Bewunderung und Verwunderung in natürlichem modernem Deutsch wieder.
- source_word: ἐπὶ τῇ σοφίᾳ αὐτῆς
  choice: über ihre Weisheit
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass des Staunens; „über ihre Weisheit“ ist die idiomatische deutsche Fügung.
- source_word: καὶ εἶπαν
  choice: 'und sagten:'
  rationale: Der Doppelpunkt zeigt an, dass im folgenden Vers die direkte Rede anschließt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt knapp und führt durch den abschließenden Doppelpunkt unmittelbar zur Rede des nächsten Verses weiter.
