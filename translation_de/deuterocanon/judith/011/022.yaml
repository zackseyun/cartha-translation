revisions:
- from: 'Holofernes sagte zu ihr: »Gott hat gut daran getan[a], dich dem Volk vorauszusenden, damit die Macht in unseren Händen sei; denjenigen aber, die meinen Herrn verachtet haben, ist der Untergang bestimmt[b].«'
  to: 'Holofernes sagte zu ihr: »Gott hat gut daran getan[a], dich dem Volk vorauszusenden, damit die Macht in unseren Händen sei; doch Untergang trifft die, die meinen Herrn verachtet haben[b].«'
  rationale: 'Die Übersetzung wird nur behutsam angepasst: Die Voranstellung von »Untergang« folgt der griechischen Hervorhebung, und »trifft« gibt die prädikative Zuordnung ohne die zusätzliche Nuance von »bestimmt« wieder. Fußnote b wird sachlich berichtigt; Fußnote a erhält mit »tat gut« eine nähere wörtliche Alternative.'
