base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/022.yaml
  text: Holofernes said to her[a], “God has done well to send you ahead of the people, so that power might be in our hands[b]; but destruction is for those who have treated my lord with contempt.”
translation:
  language: de
  text: 'Holofernes sagte zu ihr: »Gott hat gut daran getan[a], dich dem Volk vorauszusenden, damit die Macht in unseren Händen sei; doch Untergang trifft die, die meinen Herrn verachtet haben[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Gott tat gut, indem er dich dem Volk vorausschickte.«'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische stellt »Untergang« am Anfang des zweiten Teilsatzes hervor; wörtlicher: »Doch Untergang für diejenigen, die meinen Herrn verachtet haben.«'
    reason: word_order
lexical_decisions:
- source_word: Εὖ ἐποίησεν
  choice: hat gut daran getan
  rationale: Die idiomatische deutsche Wendung bewahrt die ausdrückliche positive Bewertung des Handelns Gottes.
- source_word: ἀποστεῖλας
  choice: dich … vorauszusenden
  rationale: Der griechische Aoristpartizip lässt sich nach »gut daran getan« natürlich als Infinitivkonstruktion wiedergeben.
- source_word: ἔμπροσθεν τοῦ λαοῦ
  choice: dem Volk voraus
  rationale: Die Formulierung kann räumlich wie zeitlich verstanden werden und bezeichnet Judiths Vorausgehen vor dem Volk.
- source_word: τοῦ γενήθηναι
  choice: damit … sei
  rationale: Der artikulierte Infinitiv bezeichnet hier Zweck oder beabsichtigtes Ergebnis; »damit« wahrt diese funktionale Offenheit.
- source_word: ἐν χερσὶν ἡμῶν
  choice: in unseren Händen
  rationale: Die deutsche Wendung bezeichnet Besitz und Verfügungsgewalt und folgt zugleich eng der griechischen Präpositionalphrase.
- source_word: κράτος
  choice: Macht
  rationale: »Macht« umfasst hier militärische Stärke und Herrschaftsgewalt, ohne den Ausdruck unnötig zu spezifizieren.
- source_word: φαυλίσασι
  choice: verachtet haben
  rationale: Das Verb bezeichnet geringschätziges Behandeln oder Missachten; »verachten« gibt dies knapp und verständlich wieder.
- source_word: τὸν κύριόν μου
  choice: meinen Herrn
  rationale: κύριος bezeichnet in diesem Zusammenhang den menschlichen Oberherrn des Holofernes, nicht den Gott Israels.
- source_word: ἀπώλεια
  choice: Untergang
  rationale: »Untergang« gibt den angedrohten Verlust beziehungsweise die Vernichtung wieder, ohne spätere dogmatische Nebenbedeutungen einzutragen.
theological_decisions:
- issue: Bezug von κύριος auf einen menschlichen Herrscher
  choice: meinen Herrn
  alternative: meinen Gebieter
  rationale: Der Zusammenhang weist auf den menschlichen Oberherrn des Holofernes. »Herr« bewahrt den Titelcharakter, ohne die Aussage auf Gott zu beziehen.
- issue: Verhältnis von Gottes Handeln zur beabsichtigten Machtübernahme
  choice: damit die Macht in unseren Händen sei
  alternative: sodass die Macht in unsere Hände käme
  rationale: Die Zweck- beziehungsweise Ergebnisnuance des griechischen artikulierten Infinitivs bleibt offen; der Text gibt Holofernes’ Behauptung wieder, ohne sie theologisch zu bestätigen oder zu korrigieren.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt bestimmt und herrschaftlich, ohne archaische Formen. Die syntaktische Spannung zwischen Gottes angeblichem Handeln und Holofernes’ Machtanspruch wird nicht geglättet.
