base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/011.yaml
  text: And now[a], so that my lord may not become an outcast and ineffective, death will fall upon them, and sin has overtaken them[c][b], by which they provoke their God whenever they commit an offense.
translation:
  language: de
  text: Und nun, damit mein Herr nicht zum Ausgestoßenen wird und ohne Erfolg bleibt, wird der Tod über sie kommen,[a] und eine Sünde hat sie eingeholt, durch die sie ihren Gott zum Zorn reizen, wann immer sie etwas Ungehöriges tun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Der Tod wird auf ihr Angesicht fallen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wann immer sie eine Ungehörigkeit begehen«. Das griechische Wort kann unangemessenes, abwegiges oder moralisch empörendes Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκβολος
  choice: ausgestoßen
  rationale: Bewahrt die Grundbedeutung des Hinauswerfens oder Ausschließens und passt zur drohenden Zurückweisung des Heerführers.
- source_word: ἄπρακτος
  choice: erfolglos bleibt
  rationale: 'Gibt die ergebnisbezogene Bedeutung wieder: Der Angesprochene soll nicht unverrichteter Dinge beziehungsweise ohne Erfolg bleiben.'
- source_word: ἐπιπεσεῖται θάνατος ἐπὶ πρόσωπον αὐτῶν
  choice: der Tod wird über sie kommen
  rationale: Natürliche deutsche Wiedergabe des bildhaften Ausdrucks; das wörtliche »auf ihr Angesicht« ist im Deutschen hier missverständlich.
- source_word: κατέλαβε
  choice: hat sie eingeholt
  rationale: Der Aorist bezeichnet, dass die Sünde sie bereits erfasst hat; »eingeholt« erhält das dynamische Bild.
- source_word: ἁμάρτημα
  choice: eine Sünde
  rationale: Wahrt angesichts des ausdrücklichen Bezugs auf Gott das religiös-moralische Gewicht des Ausdrucks.
- source_word: παροργιοῦσιν
  choice: zum Zorn reizen
  rationale: Macht die im Verb enthaltene Bedeutung des Erzürnens auf Deutsch ausdrücklich und idiomatisch.
- source_word: ἀτοπίαν
  choice: ein schändliches Unrecht
  rationale: Erfasst die Spannweite von unangemessenem, abwegigem und moralisch anstößigem Handeln, ohne sie auf bloße Torheit zu verengen.
- source_word: ὁ κύριός μου
  choice: mein Herr
  rationale: Höfliche Anrede an Holofernes; der Kontext bezeichnet einen menschlichen Vorgesetzten, keinen göttlichen Titel.
theological_decisions:
- issue: Religiös-moralisches Gewicht von ἁμάρτημα
  choice: eine Sünde
  alternative: ein Vergehen
  rationale: Der folgende Gottesbezug verlangt eine Wiedergabe, die den theologischen Gehalt nicht abschwächt.
- issue: Deutung von κύριος in der Anrede
  choice: mein Herr
  alternative: mein Gebieter
  rationale: Die soziale Ehrenanrede wird bewahrt, ohne Holofernes einen göttlichen Titel zuzuschreiben.
- issue: Zeitliches Verhältnis der Sünde zum kommenden Tod
  choice: denn eine Sünde hat sie eingeholt
  alternative: und eine Sünde hat sie eingeholt
  rationale: 'Das griechische καί kann den argumentativen Zusammenhang tragen: Der bereits eingetretene sündige Zustand begründet den angekündigten Tod. »Denn« macht diesen im Kontext naheliegenden Zusammenhang lesbar, ohne die Kausalität dogmatisch weiter auszuführen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt als respektvolle, strategisch argumentierende Anrede Judiths an Holofernes erkennbar; bildhafte Wendungen werden dort idiomatisch wiedergegeben, wo eine wörtliche Form im Deutschen unklar wäre.
