revisions:
- from: Und nun, damit mein Herr nicht ausgestoßen wird und erfolglos bleibt, wird der Tod über sie kommen,[a] denn eine Sünde hat sie eingeholt, durch die sie ihren Gott zum Zorn reizen, sobald sie ein schändliches Unrecht begehen.[b]
  to: Und nun, damit mein Herr nicht zum Ausgestoßenen wird und ohne Erfolg bleibt, wird der Tod über sie kommen,[a] und eine Sünde hat sie eingeholt, durch die sie ihren Gott zum Zorn reizen, wann immer sie etwas Ungehöriges tun.[b]
  rationale: Die Revision stellt die Zustandsveränderung bei γένηται ἔκβολος genauer dar, bewahrt die offene koordinierende Verknüpfung von καί und mildert die für ἀτοπία interpretativ verstärkte Hauptlesart. Die zeitliche Allgemeinheit von ἐπηνίκα ἂν wird mit „wann immer“ ausdrücklich wiedergegeben.
