base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/008.yaml
  text: For we have heard of your wisdom and the cunning of your soul[a], and it has been reported throughout all the earth that you alone are good in all the kingdom, mighty in knowledge[c][b], and marvelous in the armies of war.
translation:
  language: de
  text: Denn wir haben von deiner Weisheit und der List deines Verstandes[a] gehört. Auf der ganzen Erde[b] wurde berichtet, dass allein du im ganzen Königreich[c] gut, an Erkenntnis mächtig und in Kriegsheeren bewundernswert bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den Kunstgriffen deiner Seele“; das griechische Wort ψυχή kann „Seele“, „Leben“ oder das innere Selbst bezeichnen und meint hier wahrscheinlich den Bereich des Denkens und Wollens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im ganzen Land“; das griechische Wort γῆ kann je nach Zusammenhang „Land“ oder „Erde“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in jedem Königreich“; der griechische Singular spricht hier eher für das gesamte Reich des Angesprochenen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: wir haben … gehört
  rationale: Das deutsche Perfekt gibt den Empfang einer weiterhin bedeutsamen Nachricht in dieser Rede natürlich wieder.
- source_word: σοφίαν
  choice: Weisheit
  rationale: Dies ist die naheliegende und im lobenden Kontext angemessene Wiedergabe für Klugheit und Urteilsvermögen.
- source_word: πανουργεύματα
  choice: Kunstgriffe
  rationale: Der Ausdruck bezeichnet kluge, möglicherweise auch listige Vorgehensweisen. „Kunstgriffe“ bewahrt diese wertungsmäßige Spannung besser als rein positives „Geschick“ oder eindeutig negatives „Ränke“.
- source_word: τῆς ψυχῆς σου
  choice: deines Inneren
  rationale: ψυχή bezeichnet hier das innere Denken und Wollen, aus dem die Kunstgriffe hervorgehen. „Inneres“ vermeidet eine unnatürliche Wendung und legt keine spätere Seelenlehre fest.
- source_word: ἀνηγγέλη
  choice: wurde berichtet
  rationale: Das unpersönliche Passiv und der Vergangenheitsaspekt des griechischen Aorists werden direkt bewahrt.
- source_word: πάσῃ τῇ γῇ
  choice: auf der ganzen Erde
  rationale: Die Wendung gibt die weitreichende, rhetorisch überhöhte Bekanntheit wieder; γῆ kann je nach Kontext auch „Land“ bedeuten.
- source_word: μόνος
  choice: allein du
  rationale: Die vorangestellte deutsche Fügung erhält die emphatische Ausschließlichkeit.
- source_word: ἀγαθὸς
  choice: gut
  rationale: Die breite Grundbedeutung bleibt erhalten, ohne sie auf Tüchtigkeit, Tugend oder militärische Befähigung einzuengen.
- source_word: ἐν πάσῃ βασιλείᾳ
  choice: im ganzen Königreich
  rationale: Wegen des Singulars liegt der Bezug auf das gesamte Reich des Angesprochenen näher als auf jedes Königreich überhaupt.
- source_word: δυνατὸς ἐν ἐπιστήμῃ
  choice: an Erkenntnis mächtig
  rationale: Die gehobene und ungewöhnliche Verbindung von Macht und Wissen wird möglichst eng nachgebildet.
- source_word: θαυμαστὸς
  choice: bewundernswert
  rationale: Das Wort bezeichnet jemanden, der Staunen beziehungsweise Bewunderung hervorruft; die deutsche Wahl passt zum höfischen Lob.
- source_word: ἐν στρατεύμασιν πολέμου
  choice: in der Führung von Kriegsheeren
  rationale: Die Wiedergabe behält den konkreten Bezug auf militärische Heere, macht aber den im Kontext gemeinten Bereich seiner bewunderten militärischen Befähigung im Deutschen verständlich.
