base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/018.yaml
  text: And when I come[a], I will open the way before you, and you will go out with all your force, and there is none among them who will stand against you.
translation:
  language: de
  text: Und wenn ich gekommen bin, werde ich dir den Weg im Voraus öffnen[a]. Dann wirst du mit deiner ganzen Streitmacht ausziehen, und niemand von ihnen wird sich dir entgegenstellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „werde ich dir im Voraus öffnen“. Im Griechischen ist nicht ausdrücklich gesagt, was geöffnet wird; „den Weg“ ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: wenn ich gekommen bin
  rationale: Das feminine Aoristpartizip bezieht sich auf Judit. Ein temporaler Nebensatz gibt im Deutschen die zeitliche Abfolge natürlich und genau wieder.
- source_word: προανοίσω
  choice: werde ich dir den Weg im Voraus öffnen
  rationale: Das Futur von προανοίγω bezeichnet ein vorausgehendes Öffnen. „Den Weg“ ist im Griechischen nicht ausdrücklich genannt, wird aber aus dem Zusammenhang erschlossen und macht die Wendung im Deutschen verständlich.
- source_word: ἐξελεύσῃ
  choice: wirst du … ausziehen
  rationale: ἐξέρχομαι bedeutet grundsätzlich hinausgehen. Im militärischen Zusammenhang ist „ausziehen“ natürlich, ohne die Aussage unnötig auf eine bestimmte Marschordnung festzulegen.
- source_word: σὺν πάσῃ τῇ δυνάμει σου
  choice: mit deiner ganzen Streitmacht
  rationale: δύναμις kann Macht, Kraft oder eine militärische Truppe bezeichnen. Hier legt der Feldzug die kollektive militärische Bedeutung nahe; „Streitmacht“ bleibt zugleich weiter als „Heer“.
- source_word: οὐκ ἔστιν ὃς ἀντιστήσεταί σοι
  choice: niemand … wird sich dir entgegenstellen
  rationale: Die Formulierung bewahrt das konkrete Bild von ἀνθίστημι, gegen jemanden zu stehen beziehungsweise ihm Widerstand zu leisten.
- source_word: ἐξ αὐτῶν
  choice: von ihnen
  rationale: Die partitive Wendung bezeichnet niemanden aus der betreffenden Gruppe; im Deutschen gibt „niemand von ihnen“ dies idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Situation wird durch „Streitmacht“ und „ausziehen“ klar, während die im Griechischen ausgelassene Ergänzung zu προανοίσω durch eine Fußnote kenntlich bleibt.
