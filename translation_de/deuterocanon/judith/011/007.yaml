revisions:
- from: Denn König Nebukadnezar, der König der ganzen Erde, lebt, und seine Herrschaft lebt! Er hat dich gesandt, damit es jedem Lebewesen gut ergeht.[a] Denn deinetwegen werden ihm nicht nur die Menschen dienen, sondern auch die wilden Tiere, das Vieh und die Vögel des Himmels werden durch deine Stärke für Nebukadnezar und sein ganzes Haus leben.[b]
  to: Denn König Nebukadnezar, König der ganzen Erde, lebt, und seine Herrschaft lebt! Er hat dich zum Gelingen aller Lebewesen gesandt.[a] Denn nicht nur die Menschen werden ihm deinetwegen dienen, sondern auch die wilden Tiere, das Vieh und die Vögel des Himmels werden durch deine Stärke für Nebukadnezar und sein ganzes Haus leben.[b]
  rationale: Die Revision ersetzt die interpretativ stärkere Umschreibung von κατόρθωσις durch „Gelingen“, glättet die deutsche Apposition bei der Königstitulatur und verbessert nur die deutsche Lesbarkeit des Schlusses. Die tatsächlich bestehende syntaktische Unsicherheit des griechischen Schlusses bleibt in der Fußnote sichtbar und wird nicht dogmatisch aufgelöst.
