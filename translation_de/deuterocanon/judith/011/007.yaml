base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/007.yaml
  text: For King Nebuchadnezzar[a], of all the earth, lives, and his dominion lives—he who sent you for the success of every living soul. For not only will men serve him because of you[c][b], but also the wild animals and the cattle and the birds of the sky will live under your strength for Nebuchadnezzar and all his house.
translation:
  language: de
  text: Denn König Nebukadnezar, König der ganzen Erde, lebt, und seine Herrschaft lebt! Er hat dich zum Gelingen aller Lebewesen gesandt.[a] Denn nicht nur die Menschen werden ihm deinetwegen dienen, sondern auch die wilden Tiere, das Vieh und die Vögel des Himmels werden durch deine Stärke für Nebukadnezar und sein ganzes Haus leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „zur Vollendung“ oder „zum Gelingen jeder Seele“. Das griechische Wort ψυχή bezeichnet hier wahrscheinlich jedes lebende Wesen beziehungsweise jedes Leben, nicht speziell eine immaterielle Seele.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Schlusssatz ist stark gedrängt und ungewöhnlich gebaut. Er kann auch so verstanden werden: „Die Tiere werden unter deiner Macht leben“; möglich ist ferner: „Durch deine Stärke werden Nebukadnezar und sein ganzes Haus leben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ζῇ … καὶ ζῇ
  choice: lebt … und … lebt
  rationale: Die wiederholte, feierlich-beteuernde Hofsprache wird bewusst erhalten und nicht zu einer bloßen Aussage über das Bestehen der Herrschaft geglättet.
- source_word: βασιλεὺς Ναβουχοδονόσορ πάσης τῆς γῆς
  choice: König Nebukadnezar, der König der ganzen Erde
  rationale: Der Genitiv πάσης τῆς γῆς wird natürlich auf βασιλεύς bezogen. Die Wiederaufnahme von „König“ macht die Beziehung im Deutschen deutlich, ohne die universale Übertreibung abzuschwächen.
- source_word: κράτος
  choice: Herrschaft
  rationale: Im königlichen Zusammenhang bezeichnet κράτος wirksame Macht und Herrschaftsgewalt; „Herrschaft“ bewahrt den politischen Bezug besser als das allgemeinere „Kraft“.
- source_word: εἰς κατόρθωσιν πάσης ψυχῆς
  choice: damit es jedem Lebewesen gut ergeht
  rationale: κατόρθωσις bezeichnet ein Gelingen beziehungsweise günstiges Ergehen; ψυχή meint hier angesichts der anschließenden Menschen und Tiere ein lebendes Wesen, nicht eigens eine immaterielle Seele.
- source_word: ἄνθρωποι
  choice: Menschen
  rationale: Der Ausdruck stellt Menschen den nachfolgend genannten Tieren gegenüber und ist daher inklusiv und sachlich mit „Menschen“ wiederzugeben.
- source_word: διὰ σὲ
  choice: deinetwegen
  rationale: 'διά mit Akkusativ bezeichnet hier den Grund beziehungsweise Anlass: Wegen Holofernes werden die Menschen Nebukadnezar dienen.'
- source_word: δουλεύσουσιν
  choice: werden … dienen
  rationale: Im imperialen Zusammenhang bezeichnet das Verb Unterwerfung und Dienst für den Herrscher; „dienen“ wahrt dies, ohne eine bestimmte Form persönlicher Sklaverei zusätzlich festzulegen.
- source_word: θηρία τοῦ ἀγροῦ
  choice: die wilden Tiere
  rationale: Gemeint sind die nicht domestizierten Landtiere. Die moderne Formulierung ist verständlicher als das traditionelle „Tiere des Feldes“.
- source_word: κτήνη
  choice: das Vieh
  rationale: κτήνη bezeichnet domestizierte Nutz- und Herdentiere; „Vieh“ ist im Deutschen breit genug und im biblischen Register natürlich.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: die Vögel des Himmels
  rationale: Die feste biblische Wendung bleibt in einer natürlichen und würdigen deutschen Form erhalten.
- source_word: διὰ τῆς ἰσχύος σου
  choice: durch deine Stärke
  rationale: διά mit Genitiv hat instrumentale Bedeutung. Die Übersetzung bewahrt Holofernes’ Stärke als Mittel oder Ursache des behaupteten Lebens.
- source_word: πάντα τὸν οἶκον αὐτοῦ
  choice: sein ganzes Haus
  rationale: „Haus“ kann Haushalt, Gefolge oder Dynastie umfassen und bewahrt damit die Breite des griechischen οἶκος.
theological_decisions:
- issue: Universaler Herrschaftsanspruch Nebukadnezars
  choice: Die übersteigerte Hofakklamation wird als Aussage innerhalb von Judiths Rede unverändert wiedergegeben.
  alternative: Den Anspruch abschwächen oder erklärend als bloße Schmeichelei kennzeichnen.
  rationale: Die Erzählung legt Judith diese strategische Rede in den Mund. Eine Übersetzung soll deren Spannung und Rhetorik bewahren, ohne den Anspruch als eigene theologische Aussage zu bestätigen oder zu korrigieren.
- issue: Bedeutung von ψυχή
  choice: Lebewesen
  alternative: Seele oder Person
  rationale: Der unmittelbare Zusammenhang schließt Menschen, wilde Tiere, Vieh und Vögel ein. Daher ist keine besondere Lehre von einer immateriellen Seele in den Ausdruck einzutragen.
- issue: Rhetorisch und syntaktisch gedrängter Schlusssatz
  choice: Die Tiere werden „durch deine Stärke für Nebukadnezar und sein ganzes Haus leben“.
  alternative: Die Tiere werden „unter deiner Macht leben“ oder Nebukadnezar und sein Haus selbst werden durch Holofernes’ Stärke leben.
  rationale: Wortstellung und Kasusgebrauch des griechischen Schlusses sind ungewöhnlich. Die gewählte Fassung folgt der wahrscheinlichsten Zuordnung, während eine Fußnote die echte syntaktische Unsicherheit offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener feierlicher Wiederholung „lebt … lebt“. „Vögel des Himmels“ und „sein ganzes Haus“ bewahren den biblischen Ton, während „wilde Tiere“, „Menschen“ und „Lebewesen“ gegenwärtig und allgemein verständlich bleiben.
