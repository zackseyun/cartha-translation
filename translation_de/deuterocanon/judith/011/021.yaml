base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/021.yaml
  text: There is no woman like this one from one end of the earth to the other, in beauty of face and wisdom of speech.
translation:
  language: de
  text: Eine Frau wie diese gibt es nicht von einem Ende der Erde bis zum anderen[a] – an Schönheit des Gesichts und kluger Rede.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von einem Ende des Landes bis zum anderen“. Das griechische Wort γῆ kann sowohl „Erde“ als auch „Land“ bedeuten; zum überschwänglichen Lob passt hier eher der umfassendere Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „an schönem Gesicht und Verständnis der Worte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἔστιν τοιαύτη γυνὴ
  choice: Eine Frau wie diese gibt es nicht
  rationale: Gibt die verneinte Existenzformel natürlich wieder und bewahrt mit „wie diese“ den demonstrativen und qualitativen Sinn von τοιαύτη.
- source_word: ἀπʼ ἄκρου ἕως ἄκρου τῆς γῆς
  choice: von einem Ende der Erde bis zum anderen
  rationale: Bewahrt den bildhaften Merismus und die wahrscheinlich universale Reichweite; die mögliche Bedeutung „Land“ bleibt in der Fußnote erhalten.
- source_word: ἐν καλῷ προσώπῳ
  choice: an Schönheit des Gesichts
  rationale: Gibt den Gesichtspunkt an, unter dem sie unvergleichlich ist, und bewahrt den ausdrücklichen Bezug auf πρόσωπον („Gesicht“).
- source_word: καὶ συνέσει λόγων
  choice: noch an kluger Rede
  rationale: Im Deutschen verlangt die vorausgehende Verneinung idiomatisch „weder … noch“. „Kluge Rede“ erfasst σύνεσις als Einsicht bzw. Verstand und λόγοι als gesprochene Worte, ohne daraus eine technische Weisheitsbezeichnung zu machen.
