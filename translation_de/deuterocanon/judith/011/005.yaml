base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/005.yaml
  text: And Judith said to him[a], “Receive the words of your servant, and let your maidservant speak before you[b], and I will not tell a lie to my lord this night.”
translation:
  language: de
  text: 'Und Judit sagte zu ihm: »Nimm die Worte deiner Sklavin[a] an und lass deine Magd vor dir reden; ich werde meinem Herrn[b] in dieser Nacht keine Lüge erzählen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dienerin«. Das griechische Wort δοῦλη kann eine weibliche Dienerin oder Sklavin bezeichnen; »Sklavin« bewahrt hier die stärkere Statussprache in Judits demütiger Selbstdarstellung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gebieter«. Das griechische κύριος bezeichnet hier einen menschlichen Vorgesetzten, nicht Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δέξαι
  choice: Nimm ... an
  rationale: Der Aoristimperativ von δέχομαι fordert dazu auf, ihre Worte anzunehmen; die trennbare Formulierung ist im Deutschen natürlich und bewahrt mehr als bloßes Anhören.
- source_word: τὰ ῥήματα
  choice: die Worte
  rationale: ῥήματα bezeichnet hier die gesprochenen Worte bzw. Äußerungen Judits; die formale Entsprechung ist zugleich idiomatisch.
- source_word: τῆς δούλης σου
  choice: deiner Sklavin
  rationale: δοῦλη ist die feminine Form von δοῦλος und kann eine Sklavin oder Dienerin bezeichnen. »Sklavin« bewahrt die stärkere Statussprache ihrer demütigen Selbstdarstellung.
- source_word: λαλησάτω
  choice: lass ... reden
  rationale: Der Imperativ der dritten Person wird als höflich-bittendes »lass ... reden« wiedergegeben.
- source_word: ἡ παιδίσκη σου
  choice: deine Magd
  rationale: παιδίσκη bezeichnet eine junge weibliche Dienerin oder Sklavin. »Magd« wahrt den Unterschied zu δοῦλη und passt zum würdevollen, unterwürfigen Sprachduktus.
- source_word: κατὰ πρόσωπόν σου
  choice: vor dir
  rationale: Die griechische Wendung bedeutet wörtlich etwa »vor deinem Angesicht« und idiomatisch »in deiner Gegenwart«.
- source_word: οὐκ ἀναγγελῶ ψεῦδος
  choice: ich werde ... keine Lüge erzählen
  rationale: ἀναγγέλλω bedeutet berichten, verkünden oder mitteilen; zusammen mit ψεῦδος ist »eine Lüge erzählen« natürliches Deutsch, ohne den Aussagegehalt abzuschwächen.
- source_word: τῷ κυρίῳ μου
  choice: meinem Herrn
  rationale: κύριος bezeichnet hier den menschlichen Gebieter Holofernes. »Herr« bewahrt die höfisch-unterwürfige Anrede, ohne ihn mit Gott gleichzusetzen.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: in dieser Nacht
  rationale: Die Formulierung bildet die zeitliche Bestimmung eng und in gehobenem, aber verständlichem Deutsch ab.
theological_decisions:
- issue: Judits Selbstbezeichnungen δοῦλη und παιδίσκη
  choice: »Sklavin« und »Magd« als unterschiedliche Wiedergaben
  alternative: »Dienerin« und »Magd« oder zweimal »Dienerin«
  rationale: Der griechische Text verwendet zwei verschiedene feminine Statusbezeichnungen. Die Übersetzung bewahrt sowohl den Unterschied als auch die starke, möglicherweise strategische Selbsterniedrigung Judits, ohne eine bestimmte soziale Rechtslage über den Kontext hinaus festzulegen.
- issue: κύριος als Bezeichnung eines menschlichen Vorgesetzten
  choice: »mein Herr«
  alternative: »mein Gebieter«
  rationale: Gemeint ist Holofernes, nicht Gott. »Mein Herr« entspricht der höfischen Anrede und lässt die menschliche Referenz aus dem Erzählzusammenhang erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Erzählton. Die direkte Rede bleibt natürlich verständlich; die beiden Selbstbezeichnungen werden bewusst unterschieden, und alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
