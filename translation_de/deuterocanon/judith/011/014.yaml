base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/014.yaml
  text: And he sent word to Jerusalem that those living there also had done these things[a], granting to those who had settled among them the release from the council of elders.
translation:
  language: de
  text: Und er sandte Nachricht nach Jerusalem, dass auch die Bewohner dort dies getan und denen, die sich bei ihnen niedergelassen hatten, die Freilassung vom Ältestenrat gewährt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Erlass“ beziehungsweise „die Vergebung“. Das griechische Wort ἄφεσις kann rechtlich-soziale wie auch moralisch-religiöse Bedeutung haben; die Erwähnung des Ältestenrats spricht hier eher für einen administrativen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλακεν
  choice: er sandte Nachricht
  rationale: Die Perfektform wird im Erzählzusammenhang idiomatisch als vollzogene Mitteilung wiedergegeben; „Nachricht senden“ macht den impliziten Botschaftscharakter deutlich.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Natürliche deutsche Wiedergabe der Richtungsangabe εἰς mit Ortsnamen.
- source_word: οἱ ἐκεῖ κατοικοῦντες
  choice: die dort Wohnenden
  rationale: Bewahrt die substantivische Partizipialkonstruktion und bezeichnet die ansässigen Personen ohne zusätzliche Spezifizierung.
- source_word: ἐποίησαν ταῦτα
  choice: dies getan hatten
  rationale: Das Plusquamperfekt ordnet die Handlung gegenüber dem Senden der Nachricht zeitlich ein; „dies“ lässt den Rückverweis des griechischen ταῦτα offen.
- source_word: τοὺς μετοικίσαντας αὐτοῖς
  choice: denen, die sich bei ihnen niedergelassen hatten
  rationale: Gibt die Bewegung zu einem neuen Wohnort und das Wohnen bei der betreffenden Gemeinschaft verständlich wieder, ohne einen technischen Rechtsstatus einzuführen.
- source_word: τὴν ἄφεσιν
  choice: die Freilassung
  rationale: ἄφεσις kann Freilassung, Erlass oder Vergebung bedeuten. Der Bezug auf den Ältestenrat legt hier zunächst einen administrativ-rechtlichen Sinn nahe; die Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: παρὰ τῆς γερουσίας
  choice: durch den Ältestenrat
  rationale: παρά mit Genitiv bezeichnet hier die institutionelle Herkunft bzw. Autorisierung der Gewährung; γερουσία wird zugänglich und institutionell als „Ältestenrat“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἄφεσις im kommunal-rechtlichen Zusammenhang
  choice: Freilassung
  alternative: Erlass; Vergebung
  rationale: Der Ältestenrat spricht für eine gesellschaftlich-administrative Maßnahme, doch die moralisch-religiöse Bedeutung des Wortes darf nicht ausgeschlossen werden und wird daher in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau macht den wahrscheinlich erklärenden Inhalt der Nachricht durch einen Doppelpunkt lesbar, ohne das Subjekt der Gewährung übermäßig festzulegen. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Satz, auf den die Bedeutungsalternative Bezug nimmt.
