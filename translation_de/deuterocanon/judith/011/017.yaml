base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/017.yaml
  text: for your servant is God-fearing[a], and serves the God of heaven night and day. And now I will remain with you, my lord, and your servant will go out by night into the valley, and I will pray to God[b], and he will tell me when they have committed their sin.
translation:
  language: de
  text: Denn deine Dienerin[a] ist gottesfürchtig und dient dem Gott des Himmels bei Nacht und bei Tag. Nun werde ich bei dir bleiben, mein Herr; und deine Dienerin wird in der Nacht in die Schlucht[b] hinausgehen und zu Gott beten. Dann wird er mir sagen, wann sie ihre Sünde begangen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Sklavin“. Das griechische Wort δούλη kann eine weibliche Sklavin bezeichnen; hier dient es zugleich als ehrerbietige Selbstbezeichnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Tal“ oder „enges Tal“. Das griechische Wort φάραγξ bezeichnet einen Geländeeinschnitt wie eine Schlucht oder ein enges Tal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλη
  choice: Dienerin
  rationale: Das Wort kann eine Dienerin oder Sklavin bezeichnen. Hier gebraucht Judit es als ehrerbietige Selbstbezeichnung gegenüber Holofernes; „Dienerin“ gibt diese Gesprächsfunktion natürlich wieder, ohne den möglichen sozialen Sinn zu verschweigen.
- source_word: θεοσεβής
  choice: gottesfürchtig
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Gottesbezug und bezeichnet ehrfürchtige Hingabe an Gott.
- source_word: θεραπεύουσα
  choice: dient
  rationale: Das Partizip kann dienen, verehren oder religiösen Dienst leisten bedeuten. „Dient“ wahrt diese Bedeutungsbreite und passt zur fortwährenden Hinwendung zum Gott des Himmels.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: bei Nacht und bei Tag
  rationale: Die feste zeitliche Wendung wird in ihrer Zweigliedrigkeit bewahrt und nicht zu „unablässig“ verallgemeinert.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: dem Gott des Himmels
  rationale: Die geläufige biblische Gottesbezeichnung und die Genitivkonstruktion bleiben erhalten.
- source_word: μενῶ παρὰ σοί
  choice: ich werde bei dir bleiben
  rationale: Die Formulierung gibt das Verbleiben in der Nähe oder Gegenwart des Angesprochenen idiomatisch wieder.
- source_word: κύριε μου
  choice: mein Herr
  rationale: Es handelt sich um eine ehrerbietige Anrede Holofernes’, nicht um eine Gottesbezeichnung. „Mein Herr“ wahrt den gehobenen sozialen Ton.
- source_word: ἐξελεύσεται
  choice: wird hinausgehen
  rationale: Das Verb bezeichnet hier das Hinausgehen aus dem Lager in das umliegende Gelände.
- source_word: κατὰ νύκτα
  choice: in der Nacht
  rationale: Die natürliche deutsche Zeitangabe unterscheidet diesen konkreten nächtlichen Gang von der vorangehenden Wendung „bei Nacht und bei Tag“.
- source_word: φάραγγα
  choice: die Schlucht
  rationale: φάραγξ bezeichnet typischerweise einen tiefen Geländeeinschnitt, eine Schlucht oder ein enges Tal. „Schlucht“ ist im Deutschen anschaulich und topografisch präzise, während „Tal“ als breitere Möglichkeit in der Fußnote steht.
- source_word: προσεύξομαι πρὸς τὸν θεόν
  choice: ich werde zu Gott beten
  rationale: Dies ist die klare und idiomatische deutsche Wiedergabe eines an Gott gerichteten Gebets.
- source_word: ἐρεῖ μοι
  choice: er wird mir sagen
  rationale: Die schlichte persönliche Mitteilung des griechischen Ausdrucks bleibt erhalten.
- source_word: πότε ἐποίησαν τὸ ἁμάρτημα αὐτῶν
  choice: wann sie ihre Sünde begangen haben
  rationale: „Wann“ bewahrt die zeitliche Frage, und der Singular „ihre Sünde“ entspricht dem griechischen Singular τὸ ἁμάρτημα.
theological_decisions:
- issue: Bedeutung von δούλη in Judits Selbstbezeichnung
  choice: Dienerin
  alternative: Sklavin
  rationale: δούλη kann rechtlichen Sklavenstatus ausdrücken, dient hier jedoch vor allem als ehrerbietige Selbstbezeichnung in einer höfischen Gesprächssituation. „Dienerin“ bildet diese Funktion ab; die wörtlich-soziale Alternative wird in der Fußnote dokumentiert.
- issue: Art des in θεραπεύουσα bezeichneten Gottesdienstes
  choice: dient
  alternative: verehrt
  rationale: Der griechische Ausdruck kann sowohl allgemeinen Dienst als auch religiöse Verehrung bezeichnen. „Dient“ hält diese Spannung offen und engt die Aussage nicht auf einen bestimmten kultischen Vollzug ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dritte Person in „deine Dienerin wird …“ bleibt als ehrerbietige Selbstbezeichnung erhalten, ebenso der anschließende Wechsel zur ersten Person in „ich werde … beten“. Die Satzglieder folgen dem griechischen Gedankengang, werden jedoch mit deutscher Zeichensetzung lesbar gegliedert.
