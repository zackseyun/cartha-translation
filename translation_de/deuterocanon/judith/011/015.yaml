  text: And it will be that[a], when he reports it to them and they act, they will be given over to you for destruction on that day.
translation:
  language: de
  text: 'Und es wird geschehen: Wenn er es ihnen meldet und sie handeln[a], werden sie dir an jenem Tag zur Vernichtung preisgegeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sobald er es ihnen meldet und sie es tun“. Das griechische ὡς ἂν mit Konjunktiv kann eine unbestimmte zukünftige Bedingung bezeichnen; ποιήσωσιν heißt wörtlicher „sie tun es“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: es wird geschehen
  rationale: Die idiomatische Zukunftsform von εἰμί leitet hier einen künftigen Umstand ein; die deutsche Wendung ist natürlich und bewahrt den vorausweisenden Charakter.
- source_word: ὡς ἂν
  choice: wenn
  rationale: Mit den Aorist-Konjunktiven bezeichnet die Wendung eine noch unbestimmte zukünftige Bedingung. „Wenn“ gibt dies im Deutschen klar wieder, ohne den Zeitpunkt stärker als im Griechischen festzulegen.
- source_word: ἀναγγείλῃ
  choice: er es ihnen meldet
  rationale: ἀναγγέλλω bedeutet berichten, melden oder bekannt geben. „Meldet“ passt zum Überbringen einer Nachricht; das im Griechischen unausgedrückte Objekt wird im Deutschen durch „es“ natürlich aufgenommen.
- source_word: ποιήσωσιν
  choice: sie daraufhin handeln
  rationale: ποιέω ist weit gefasst und steht hier ohne ausdrückliches Objekt. „Daraufhin handeln“ macht den Zusammenhang im Deutschen verständlich, ohne den Inhalt der Handlung festzulegen.
- source_word: δοθήσονταί σοι
  choice: werden sie dir … preisgegeben
  rationale: Die passive Form und der Dativ werden bewahrt. „Preisgegeben“ bringt in Verbindung mit der folgenden Vernichtung den feindlichen Ausgang idiomatisch zum Ausdruck.
- source_word: εἰς ὄλεθρον
  choice: zur Vernichtung
  rationale: ὄλεθρος bezeichnet Vernichtung oder Untergang. „Zur Vernichtung“ gibt Ziel beziehungsweise Ergebnis knapp und deutlich wieder.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: an jenem Tag
  rationale: Dies ist die übliche moderne deutsche Wiedergabe der temporalen Wendung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wechselnden Numeri („er“/„sie“) und die passive Aussage bleiben erhalten; die zeitlich-bedingte Nuance wird nicht übermäßig präzisiert.
