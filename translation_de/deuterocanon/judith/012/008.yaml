base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/008.yaml
  text: And when she went up[a], she was praying to the Lord God of Israel to direct her way for the exaltation of the sons of his people.
translation:
  language: de
  text: Und als sie hinaufging, betete sie zum Herrn, dem Gott Israels, er möge ihren Weg zur Aufrichtung[a] der Söhne seines Volkes leiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Erhöhung“ oder „zur Wiederherstellung der Söhne seines Volkes“. Das seltene griechische Wort kann ein Aufrichten bzw. Erheben, auch eine Wiederherstellung der Stellung oder Lage, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: wieder hinaufgestiegen war
  rationale: Das Verb bezeichnet eine Aufwärtsbewegung. Im unmittelbaren Erzählzusammenhang kehrt Judith vom Wasser zum Lager hinauf zurück; „wieder“ verdeutlicht diese Rückkehr, ohne die Bewegungsrichtung aufzugeben.
- source_word: ἐδέετο
  choice: betete sie
  rationale: δέομαι bezeichnet hier eine an Gott gerichtete Bitte. Das Imperfekt schildert das andauernde Beten; im natürlichen deutschen Erzählstil kann dies schlicht mit „betete“ wiedergegeben werden.
- source_word: κυρίου θεοῦ Ἰσραήλ
  choice: zum Herrn, dem Gott Israels
  rationale: Die Apposition gibt den griechischen Gottesnamen bzw. Titel klar und würdig wieder.
- source_word: κατευθῦναι
  choice: ebnen
  rationale: κατευθύνω kann „gerade machen“, „lenken“ oder „recht führen“ bedeuten. In Verbindung mit „Weg“ bewahrt „ebnen“ das Wegbild und schließt göttliche Führung ein.
- source_word: τὴν ὁδὸν αὐτῆς
  choice: ihren Weg
  rationale: Die Wendung kann sowohl den tatsächlichen Weg als auch Judiths Vorhaben bezeichnen; „ihren Weg“ lässt beide Ebenen offen.
- source_word: εἰς ἀνάστημα
  choice: zum Wiederaufrichten
  rationale: Das seltene ἀνάστημα bezeichnet ein Aufrichten oder Erheben. „Wiederaufrichten“ passt zur bedrängten Lage des Volkes, ohne den Ausdruck ausschließlich als politische Erhöhung oder endgültige Rettung festzulegen.
- source_word: τῶν υἱῶν τοῦ λαοῦ αὐτοῦ
  choice: der Söhne seines Volkes
  rationale: Die ausdrückliche maskuline Bezeichnung υἱῶν wird erhalten; die Genitivverbindung bleibt eng am griechischen Wortlaut.
theological_decisions:
- issue: Wiedergabe von κύριος in einer jüdischen Gebetsformel
  choice: Herr
  alternative: HERR
  rationale: „Herr“ ist im griechischen deuterokanonischen Kontext eine transparente, traditionsgemäße Wiedergabe, ohne im Text ausdrücklich zu entscheiden, ob κύριος hier als Ersatzlesung des Gottesnamens fungiert.
- issue: Bedeutungsumfang von ἀνάστημα
  choice: Wiederaufrichten
  alternative: Erhöhung
  rationale: Der seltene Ausdruck kann eine Erhebung im Rang oder Zustand meinen, im Kontext aber auch die Wiederherstellung des bedrängten Volkes. Der Text bewahrt das Bild des Aufrichtens; die Fußnote nennt die wesentliche Alternative.
- issue: Geschlechtsspezifische Sprache bei υἱῶν
  choice: Söhne
  alternative: Kinder
  rationale: Das griechische Substantiv ist ausdrücklich maskulin. Die formale Kennzeichnung wird beibehalten, ohne über den Vers hinaus festzulegen, ob die Gruppe repräsentativ für das ganze Volk steht.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzfügung ist flüssig, bleibt aber nahe an der griechischen Gebetsformel. Das Wegbild und die Mehrdeutigkeit des seltenen ἀνάστημα werden bewahrt.
