base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/005.yaml
  text: And Holofernes’s attendants brought her into the tent[a], and she slept until the middle of the night; then she rose at the morning watch[b],
translation:
  language: de
  text: Die Diener des Holofernes führten sie in das Zelt, und sie schlief bis zur Mitte der Nacht[a]; dann stand sie zur Morgenwache[b] auf,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis Mitternacht“. Wörtlich heißt es im Griechischen: „bis die Nacht in ihrer Mitte war“.'
    reason: lexical_alternative
  - marker: b
    text: Die „Morgenwache“ war ein Abschnitt der antiken Einteilung der Nacht und lag gegen Tagesanbruch.
    reason: cultural_note
lexical_decisions:
- source_word: θεράποντες
  choice: Diener
  rationale: Das Wort bezeichnet hier persönliche Bedienstete oder Begleiter. „Diener“ ist im militärischen und höfischen Zusammenhang natürlich und setzt nicht zwingend Sklaverei voraus.
- source_word: σκηνήν
  choice: Zelt
  rationale: Im Heerlager bezeichnet σκηνή am naheliegendsten ein Zelt; „Zelt“ ist klar und kontextgerecht.
- source_word: ὕπνωσεν
  choice: schlief
  rationale: Der Aorist berichtet schlicht, dass sie schlief; die direkte deutsche Entsprechung wahrt den knappen Erzählstil.
- source_word: μέχρι μεσούσης τῆς νυκτός
  choice: bis zur Mitte der Nacht
  rationale: Die Formulierung gibt die griechische Wendung eng wieder, ohne sie vorschnell auf die moderne Uhrzeit „Mitternacht“ festzulegen.
- source_word: ἀνέστη
  choice: stand … auf
  rationale: Im Kontext bedeutet ἀνίστημι, sich vom Schlaf zu erheben. „stand … auf“ ist in modernem Deutsch natürlicher als das gehobenere „erhob sich“.
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: zur Morgenwache
  rationale: φυλακή bezeichnet hier einen nächtlichen Wachabschnitt, und πρός markiert dessen ungefähren Zeitpunkt. „zur Morgenwache“ bewahrt die antike Zeitangabe knapp und verständlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit engem Anschluss an den griechischen Satzfluss. Das Semikolon erhält die fortlaufende Reihung der griechischen Teilsätze. Das abschließende Komma bleibt stehen, weil der Satz im folgenden Vers weitergeführt wird. Der im englischen Konsultationstext offenbar verrutschte Fußnotenmarker zur Zeitangabe wurde sachgerecht nach „Nacht“ gesetzt.
