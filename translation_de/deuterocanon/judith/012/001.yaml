  yaml_path: translation/deuterocanon/judith/012/001.yaml
  text: And he ordered that she be brought in where his silverware was kept[b][a], and he directed that food be prepared for her from his own dishes and that she drink from his wine.
translation:
  language: de
  text: Und er befahl, sie dorthin zu bringen, wo seine silbernen Gefäße aufbewahrt wurden,[a] und ordnete an, dass man ihr von seinen zubereiteten Speisen auftische[b] und sie von seinem Wein trinken solle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wo seine silbernen Gegenstände aufbewahrt wurden“. Das griechische Wort bezeichnet allgemein Gegenstände aus Silber; im Zusammenhang können Gefäße gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann das Ausbreiten oder Anrichten bezeichnen. Gemeint ist, dass man ihr von seinen zubereiteten Speisen vorsetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: er befahl
  rationale: Gibt die autoritative Anweisung des griechischen Verbs klar und würdig wieder.
- source_word: εἰσαγαγεῖν αὐτήν
  choice: sie dorthin zu bringen
  rationale: Der Infinitiv hängt von ἐκέλευσεν ab; die Formulierung lässt erkennen, dass Bedienstete Judith hineinbringen sollen.
- source_word: οὗ ἔτιθετο
  choice: wo ... aufbewahrt wurden
  rationale: Der Imperfekt bezeichnet hier am natürlichsten den Ort, an dem die Gegenstände verwahrt oder regelmäßig abgestellt waren.
- source_word: τὰ ἀργυρώματα αὐτοῦ
  choice: seine silbernen Gefäße
  rationale: ἀργυρώματα bezeichnet Gegenstände aus Silber; im Zusammenhang sind Gefäße wahrscheinlich, ohne den Ausdruck auf modernes Besteck zu verengen.
- source_word: συνέταξεν
  choice: ordnete an
  rationale: Bewahrt den autoritativen Sinn und vermeidet die unmittelbare Wiederholung von „befahl“.
- source_word: καταστρῶσαι
  choice: aufzutischen
  rationale: Das Verb meint hier das Ausbreiten beziehungsweise Bereitstellen der Speisen; „auftischen“ ist im Mahlkontext natürlich.
- source_word: ἀπὸ τῶν ὀψοποιημάτων αὐτοῦ
  choice: von seinen zubereiteten Speisen
  rationale: ὀψοποιήματα bezeichnet zubereitete Gerichte oder Speisen und nicht die Gefäße, aus denen sie gegessen werden.
- source_word: τοῦ οἴνου αὐτοῦ πινεῖν
  choice: sie von seinem Wein trinken zu lassen
  rationale: Setzt die abhängige Infinitivkonstruktion natürlich fort und bewahrt den Gedanken, dass sie von seinem eigenen Vorrat trinken soll.
