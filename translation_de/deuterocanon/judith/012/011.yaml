base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/011.yaml
  text: And he said to Bagoas the eunuch[a], who was in charge of all that belonged to him[b], “Go now and persuade the Hebrew woman who is with you to come to us and eat and drink with us.”
translation:
  language: de
  text: 'Und er sagte zu Bagoas, dem Eunuchen[a], der über seinen gesamten Besitz eingesetzt war: »Geh doch und überrede[b] die Hebräerin, die bei dir ist, zu uns zu kommen und mit uns zu essen und zu trinken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Eunuch« kann in manchen Zusammenhängen auch einen hohen Hofbeamten bezeichnen; hier ist das griechische Wort wörtlich wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »überzeuge« oder »bewege«; gemeint ist, dass er sie dazu bringen soll mitzukommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαγώᾳ
  choice: Bagoas
  rationale: Der Personenname wird nach der griechischen Form transliteriert.
- source_word: εὐνούχῳ
  choice: Eunuchen
  rationale: Die konkrete Grundbedeutung des griechischen Ausdrucks bleibt erhalten; die mögliche weitere Verwendung als Bezeichnung eines hohen Hofbeamten wird in einer Fußnote genannt.
- source_word: ἐφεστηκὼς ἐπὶ πάντων τῶν αὐτοῦ
  choice: der über seinen gesamten Besitz eingesetzt war
  rationale: Die Formulierung gibt die übertragene Aufsicht und Zuständigkeit wieder. »Besitz« versteht τὰ αὐτοῦ als das, was ihm gehörte, ohne die administrative Funktion des Partizips abzuschwächen.
- source_word: Πεισὸν δὴ πορευθεὶς
  choice: Geh doch und überrede
  rationale: Das Partizip πορευθεὶς wird idiomatisch mit dem Imperativ verbunden; δή erhält durch »doch« einen leichten nachdrücklichen Ton. »Überrede« bezeichnet das veranlasste Einwilligen, ohne Zwang zu unterstellen.
- source_word: τὴν γυναῖκα τὴν Ἑβραίαν
  choice: die Hebräerin
  rationale: Die natürliche deutsche Personenbezeichnung bewahrt die ethnische Kennzeichnung; ein ehelicher Sinn von γυνή liegt hier nicht vor.
- source_word: ἣ ἔστιν παρὰ σοὶ
  choice: die bei dir ist
  rationale: Die knappe Wiedergabe erhält die örtliche beziehungsweise persönliche Nähe, ohne eine besondere Obhutsbeziehung hinzuzufügen.
- source_word: τοῦ ἐλθεῖν πρὸς ἡμᾶς
  choice: zu uns zu kommen
  rationale: Der Infinitiv bezeichnet den Inhalt beziehungsweise das Ziel des Überredens.
- source_word: φαγεῖν καὶ πιεῖν μεθʼ ἡμῶν
  choice: mit uns zu essen und zu trinken
  rationale: Die direkte Formulierung bewahrt beide Verben und den gemeinsamen Mahlkontext.
