base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/013.yaml
  text: And Bagoas went out from the presence of Holofernes and went in to her and said[a], “Let this beautiful young woman not hesitate to come to my lord, to be honored before him, and to drink wine with us in gladness[b], and to become on this day like one of the daughters of the Assyrians who stand in the house of Nebuchadnezzar.”
translation:
  language: de
  text: 'Und Bagoas verließ die Gegenwart des Holofernes, ging zu ihr hinein und sagte: „Diese schöne junge Frau[a] soll sich doch nicht scheuen, zu meinem Herrn zu kommen, vor ihm geehrt zu werden, mit uns Wein in froher Stimmung zu trinken und an diesem Tag wie eine der Töchter der Assyrer zu werden, die im Haus Nebukadnezars Dienst tun[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienerin“. Das griechische Wort kann ein Mädchen, eine Dienerin oder eine Sklavin bezeichnen; hier wird es als schmeichelnde Anrede gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die im Haus Nebukadnezars dastehen“; gemeint sein kann, dass sie dort aufwarten oder Dienst tun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἀπὸ προσώπου
  choice: ging aus der Gegenwart ... hinaus
  rationale: Die Wendung bezeichnet das Verlassen der Gegenwart einer Person; die etwas feierliche Formulierung bewahrt den höfischen Ton.
- source_word: εἰσῆλθεν πρὸς αὐτήν
  choice: trat bei ihr ein
  rationale: Gibt die räumliche Bewegung wieder, ohne einen sexuellen Nebensinn in den Text hineinzulesen.
- source_word: Μὴ ὀκνήσῃς
  choice: soll sich doch nicht scheuen
  rationale: ὀκνέω bezeichnet hier Zögern oder Zurückscheuen; δή verstärkt die werbende Aufforderung.
- source_word: ἡ παιδίσκη ἡ καλὴ αὕτη
  choice: diese schöne junge Frau
  rationale: παιδίσκη kann ein Mädchen oder eine Dienerin bezeichnen; im Kontext dient es als schmeichelnde Anrede. „Junge Frau“ ist im modernen Deutschen natürlich und würdevoll.
- source_word: δόξασθῆναι κατὰ πρόσωπον αὐτοῦ
  choice: vor ihm geehrt zu werden
  rationale: δοξάζω bezeichnet in diesem menschlich-höfischen Zusammenhang das Empfangen von Ehre, nicht theologische Verherrlichung.
- source_word: πίεσαι μεθʼ ἡμῶν εἰς εὐφροσύνην οἴνου
  choice: mit uns bei Wein fröhlich zu trinken
  rationale: Die Formulierung bringt die vom Wein geprägte Festfreude idiomatisch zum Ausdruck, ohne den Weinbezug auszulassen.
- source_word: γενηθήναι ... ὡς θυγάτηρ μία τῶν υἱῶν Ἀσσούρ
  choice: wie eine der Töchter der Assyrer zu werden
  rationale: Die ingressive Bedeutung von γενηθήναι bleibt mit „zu werden“ erhalten; „Töchter der Assyrer“ gibt den semitisch geprägten Ausdruck natürlich wieder.
- source_word: αἱ παρεστηκυῖαι ἐν οἴκῳ Ναβουχοδονόσορ
  choice: die im Haus Nebukadnezars Dienst tun
  rationale: παρίστημι kann das Dabeistehen beziehungsweise Aufwarten am Hof bezeichnen; „Dienst tun“ macht diese Funktion verständlich, ohne sie enger festzulegen.
theological_decisions:
- issue: Wiedergabe von κύριος im menschlich-höfischen Kontext
  choice: mein Herr
  alternative: mein Gebieter
  rationale: κύριος bezieht sich hier auf Holofernes. „Mein Herr“ wahrt die soziale Rangordnung und vermeidet eine Verwechslung mit einer Gottesbezeichnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht höfischem Erzählton. Die verschachtelte Einladung des griechischen Satzes bleibt erkennbar, wird aber durch eine natürliche deutsche Infinitivreihe lesbar gestaltet.
