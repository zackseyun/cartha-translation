base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/020.yaml
  text: And Holofernes was delighted with her[a], and he drank a very great amount of wine—as much as he had never drunk in a single day since he was born.
translation:
  language: de
  text: Und Holofernes freute sich über sie[a] und trank überaus viel Wein – so viel, wie er noch nie an einem einzigen Tag getrunken hatte, seit er geboren war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihretwegen“ oder „durch sie“; Judith wird als Ursache oder Ausgangspunkt seiner Freude bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠυφράνθη
  choice: freute sich
  rationale: Die passive bzw. deponentische Form bezeichnet das Eintreten von Freude. „Freute sich“ ist im Deutschen natürlich und gibt die emotionale Reaktion zurück, ohne sie unnötig zu verstärken.
- source_word: ἀπʼ αὐτῆς
  choice: über sie
  rationale: ἀπό bezeichnet hier Quelle oder Ursache der Freude. „Über sie“ bewahrt diesen Bezug im Deutschen; die mögliche Nuance „ihretwegen“ wird in der Fußnote offengehalten.
- source_word: ἔπιεν οἶνον πολὺν σφόδρα
  choice: trank überaus viel Wein
  rationale: πολὺν σφόδρα betont die außergewöhnlich große Menge. „Überaus viel Wein“ gibt die starke Intensivierung knapp und würdig wieder.
- source_word: ὅσον οὐκ ἔπιεν πώποτε
  choice: so viel, wie er noch nie ... getrunken hatte
  rationale: Die Formulierung hält den im Griechischen ausdrücklich genannten Mengenvergleich fest und formuliert ihn idiomatisch auf Deutsch.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: an einem einzigen Tag
  rationale: Die Wendung ist temporal und hebt die Dauer eines einzelnen Tages hervor; „einem einzigen Tag“ bewahrt diesen Nachdruck.
- source_word: ἀφʼ οὗ ἐγεννήθη
  choice: seit er geboren war
  rationale: Die Wendung umfasst sein gesamtes bisheriges Leben. „Seit er geboren war“ entspricht dem zeitlichen Ausgangspunkt und fügt sich natürlich in die rückblickende Satzkonstruktion ein.
