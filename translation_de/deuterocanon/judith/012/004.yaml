base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/004.yaml
  text: And Judith said to him[a], “As your life lives, my lord[c][b], your servant will not use up what is with me until he has accomplished by my hand what he has planned.”
translation:
  language: de
  text: 'Und Judith sagte zu ihm: „So wahr du lebst, mein Herr![a] Deine Dienerin wird nicht aufbrauchen, was ich bei mir habe,[b] bis er[c] durch meine Hand vollbracht hat, was er beschlossen hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Deine Seele lebt, mein Herr!“ Gemeint ist die Schwurformel: „So wahr du lebst, mein Herr!“'
    reason: lexical_alternative
  - marker: b
    text: Mit dem, was Judith bei sich hat, sind wahrscheinlich ihre eigenen Lebensmittel oder Vorräte gemeint.
    reason: lexical_alternative
  - marker: c
    text: Das Subjekt von „vollbracht hat“ und „beschlossen hat“ wird im Griechischen nicht genannt. Im Zusammenhang ist am ehesten Gott gemeint, der durch Judith handelt.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῇ ἡ ψυχή σου
  choice: So wahr du lebst
  rationale: Die griechische Schwurformel lautet wörtlich etwa „Deine Seele lebt“. Die gewählte deutsche Wendung gibt ihre bekräftigende Funktion natürlich und würdig wieder, ohne den Sinn zu verändern.
- source_word: κύριέ μου
  choice: mein Herr
  rationale: κύριος ist hier die ehrerbietige Anrede an Holofernes und keine Gottesbezeichnung. „Mein Herr“ bewahrt den höfisch-sozialen Ton.
- source_word: ἡ δούλη σου
  choice: deine Dienerin
  rationale: Judith bezeichnet sich in unterwürfiger Höflichkeit als die weibliche Person im Dienst des Angeredeten. „Dienerin“ ist im modernen Deutschen natürlich und bewahrt den Status- und Unterordnungston, ohne eine rechtliche Versklavung festzuschreiben, die der unmittelbare Kontext nicht ausdrücklich behauptet.
- source_word: οὐ δαπανήσει
  choice: wird nicht aufbrauchen
  rationale: δαπανάω bezeichnet das Ausgeben oder Aufzehren. Da es im Zusammenhang um mitgebrachte Vorräte geht, trifft „aufbrauchen“ den konkreten Sinn.
- source_word: τὰ ὄντα μετʼ ἐμοῦ
  choice: was ich bei mir habe
  rationale: Die Formulierung gibt das wörtliche „das bei mir Seiende“ in natürlichem Deutsch wieder und lässt offen, um welche mitgeführten Dinge es sich handelt.
- source_word: ἕως ἄν ποιήσῃ
  choice: bis er … vollbracht hat
  rationale: Das Verb ποιέω bedeutet hier im Zusammenhang die Ausführung beziehungsweise Vollendung eines Vorhabens. Das im Griechischen unausgesprochene maskuline Subjekt wird als „er“ bewahrt, aber nicht im Haupttext identifiziert.
- source_word: ἐν χειρί μου
  choice: durch meine Hand
  rationale: Die nahe Wiedergabe erhält das biblische Bild der Hand als Mittel beziehungsweise ausführende Instanz.
- source_word: ἃ ἐβουλεύσατο
  choice: was er beschlossen hat
  rationale: βουλεύομαι kann planen, beschließen oder sich vornehmen bedeuten. „Beschlossen“ bringt die überlegte und feste Absicht prägnant zum Ausdruck.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ποιήσῃ und ἐβουλεύσατο
  choice: Das maskuline Singularsubjekt wird mit „er“ wiedergegeben, ohne es im Haupttext ausdrücklich als Gott zu benennen.
  alternative: Eine unpersönliche Formulierung wie „bis durch meine Hand vollbracht ist, was beschlossen wurde“ oder die ausdrückliche Ergänzung „Gott“.
  rationale: Die griechischen Verbformen setzen ein unausgesprochenes Subjekt voraus. Im weiteren Erzählzusammenhang ist damit am ehesten Gott gemeint; seine ausdrückliche Nennung würde jedoch eine im Wortlaut verbleibende Unbestimmtheit auflösen. Die Übersetzung bewahrt daher sowohl die grammatische Person als auch die Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die höfische Anrede bleibt erhalten; unnötig altertümliche Wendungen werden vermieden. Das Hand-Motiv wird wegen seiner erzählerischen und theologischen Bedeutung bewusst wörtlich bewahrt.
