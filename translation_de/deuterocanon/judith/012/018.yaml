translation:
  language: de
  text: 'Und Judit sagte: „Ich will nun trinken, mein Herr, denn heute ist mein Leben in mir groß gemacht worden wie an keinem Tag seit meiner Geburt.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder flüssiger: „Denn heute ist mein Leben in mir größer geworden als je zuvor.“'
    reason: Die Alternative gibt die Wirkung von ἐμεγαλύνθη idiomatischer wieder, während der Haupttext das griechische Passiv und die bewusst ungewöhnliche Redeweise beibehält.
lexical_decisions:
- source_word: Πίομαι δή
  choice: Ich will nun trinken
  rationale: Das Futur von πίνω gibt Judits entschlossene Reaktion wieder; „will … trinken“ bewahrt im Deutschen den volitionalen Klang. δή wird mit „nun“ als leichte Hervorhebung und zeitliche Unmittelbarkeit wiedergegeben.
- source_word: κύριε
  choice: mein Herr
  rationale: Die respektvolle Anrede an Holofernes bleibt erhalten, ohne sie als Gottesbezeichnung zu verstehen.
- source_word: ἐμεγαλύνθη
  choice: ist … größer geworden
  rationale: Die Wendung bewahrt das Bild des Großwerdens, klingt aber natürlicher als das streng passive „ist groß gemacht worden“. Die Fußnote dokumentiert die formnähere Möglichkeit.
- source_word: τὸ ζῆν μου
  choice: mein Leben
  rationale: Der substantivierte Infinitiv bedeutet wörtlich „mein Leben/Mein-Leben“; „mein Leben“ ist die klare, idiomatische deutsche Entsprechung.
- source_word: ἐν ἐμοὶ
  choice: in mir
  rationale: Die im Griechischen ausdrücklich vorhandene innere beziehungsweise persönliche Ortsangabe wird nicht ausgelassen.
- source_word: παρὰ πάσας τὰς ἡμέρας
  choice: als an allen Tagen
  rationale: παρά mit Akkusativ bezeichnet hier einen Vergleich. Die deutsche Konstruktion mit „als“ gibt diesen Vergleich natürlich wieder.
- source_word: τῆς γενέσεώς μου
  choice: seit meiner Geburt
  rationale: γένεσις bezeichnet hier Geburt beziehungsweise Herkunft; „seit meiner Geburt“ macht den zeitlichen Sinn im Deutschen deutlich.
theological_decisions:
- issue: Sinn der Aussage, Judits Leben sei in ihr groß geworden
  choice: Die ungewöhnliche, feierlich gesteigerte Redeweise bleibt als „mein Leben in mir größer geworden“ erhalten.
  alternative: „Noch nie habe ich mich so lebendig gefühlt“ oder „mein Leben ist heute mehr aufgeblüht als je zuvor“.
  rationale: Der griechische Text lässt offen, ob Judith von gesteigerter Lebenskraft, Größe, Glück oder Gedeihen spricht. Eine psychologisierende oder rein prosperitätsbezogene Paraphrase würde diese Mehrdeutigkeit vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt gehoben und leicht ungewöhnlich, wie es dem griechischen Ausdruck entspricht; unnötig altertümliche Formen werden vermieden.
