lexical_decisions:
- source_word: Πίε δὴ
  choice: Trink doch
  rationale: Der Aoristimperativ Πίε ist eine unmittelbare Aufforderung; die Modalpartikel »doch« gibt die nachdrücklich-einladende Kraft von δή im heutigen Deutsch natürlich wieder.
- source_word: γενήθητι μεθʼ ἡμῶν εἰς εὐφροσύνην
  choice: feiere mit uns
  rationale: Wörtlich steht hier etwa »sei/werde mit uns zur Freude«. Im Zusammenhang bezeichnet die Wendung die Teilnahme an der fröhlichen Feier; »feiere mit uns« ist idiomatisch, knapp und bewahrt sowohl das Gemeinschaftsmotiv als auch die festliche Freude.
- source_word: Ὀλοφέρνης
  choice: Holofernes
  rationale: Der Personenname wird nach der im Deutschen etablierten Form wiedergegeben.
- source_word: εἶπεν πρὸς αὐτήν
  choice: sagte zu ihr
  rationale: Direkte und natürliche Wiedergabe der griechischen Redeeinleitung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Trink doch« klingt eindringlich, aber nicht schroff; »feiere mit uns« gibt die festliche Einladung verständlich und ohne zusätzliche Deutung wieder.
