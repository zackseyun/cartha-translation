base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/006.yaml
  text: And she arose toward the morning watch[a], and sent to Holofernes, saying, “Let my lord now give orders to allow your servant to go out for prayer.”
translation:
  language: de
  text: 'Zur Morgenwache stand sie auf, sandte zu Holofernes und ließ ihm sagen: »Mein Herr soll doch anordnen, dass deine Dienerin[a] hinausgehen darf, um zu beten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Sklavin«. Das griechische Wort δούλη kann je nach Zusammenhang eine Dienerin oder eine Sklavin bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστη
  choice: stand sie auf
  rationale: Das Aoristverb bezeichnet hier Judits Aufstehen zu diesem Zeitpunkt; »stand auf« ist im Deutschen natürlich und dem Erzählstil angemessen.
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: gegen die Morgenwache
  rationale: φυλακή bezeichnet einen Nachtabschnitt beziehungsweise eine Wache; ἑωθινή bestimmt ihn als frühmorgendlich. »Gegen« wahrt die zeitliche Annäherungsnuance von πρός.
- source_word: ἀπέστειλεν πρὸς Ὁλοφέρνην λέγουσα
  choice: ließ Holofernes sagen
  rationale: Die griechische Wendung meint idiomatisch, dass sie Holofernes durch einen Boten etwas ausrichten ließ. Die deutsche Formulierung gibt den Sinn knapp und natürlich wieder.
- source_word: Ἐπιταξάτω δὴ
  choice: soll doch anordnen
  rationale: Der Imperativ der dritten Person verlangt eine verbindliche Anweisung; »doch« gibt die hervorhebende beziehungsweise dringliche Partikel δή wieder, ohne sie zu überdeuten.
- source_word: ὁ κύριός μου
  choice: mein Herr
  rationale: κύριος ist hier die ehrerbietige Anrede für den menschlichen Machthaber Holofernes. »Herr« bewahrt den gesellschaftlichen Rang, ohne einen göttlichen Bezug einzutragen.
- source_word: ἐᾶσαι
  choice: dass … hinausgehen darf
  rationale: ἐάω bezeichnet die erbetene Erlaubnis. Die Konstruktion mit »darf« ist in modernem Deutsch natürlicher als eine wörtliche Infinitivkette.
- source_word: τὴν δούλην σου
  choice: deine Dienerin
  rationale: Die feminine Form δούλη kann »Dienerin« oder »Sklavin« bedeuten. Hier dient sie als ehrerbietige, sich selbst erniedrigende Bezeichnung; die mögliche Statusbedeutung wird in einer Fußnote offengehalten.
- source_word: ἐπὶ προσευχὴν
  choice: um zu beten
  rationale: Die Präpositionalphrase bezeichnet den Zweck des Hinausgehens. »Um zu beten« ist klarer und idiomatischer als »zum Gebet«, ohne den Inhalt zu verändern.
- source_word: ἐξελθεῖν
  choice: hinausgehen
  rationale: Das Bewegungsverb bezeichnet das Verlassen des gegenwärtigen Ortes; »hinausgehen« ist die direkte deutsche Entsprechung.
theological_decisions:
- issue: κύριος als Bezeichnung eines menschlichen Vorgesetzten
  choice: mein Herr
  alternative: mein Gebieter
  rationale: Der Bezug gilt eindeutig Holofernes. »Herr« gibt die konventionelle ehrerbietige Anrede wieder; die Großschreibung folgt der deutschen Substantivorthografie und ist hier kein besonderer Gottesname.
- issue: δούλη in Judits Selbstbezeichnung
  choice: deine Dienerin
  alternative: deine Sklavin
  rationale: Im unmittelbaren höfischen Kontext steht die demütige Selbstbezeichnung im Vordergrund. Da δούλη jedoch auch ausdrücklich eine versklavte Frau bezeichnen kann, bleibt diese lexikalische Alternative in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Erzählsprache mit höfisch-ehrerbietiger direkter Rede. Die griechische Satzstruktur wurde behutsam geglättet; die zeitliche Nuance von πρός und die Mehrdeutigkeit von δούλη bleiben erhalten.
