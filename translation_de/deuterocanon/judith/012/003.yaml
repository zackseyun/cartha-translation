  yaml_path: translation/deuterocanon/judith/012/003.yaml
  text: And Holofernes said to her[a], “But if the things you have with you run out, from where shall we get for you provisions like them? For there is no one with us from your nation.”
translation:
  language: de
  text: 'Und Holofernes sagte zu ihr: „Wenn aber das, was du bei dir hast, ausgeht, woher sollen wir dir Vorräte wie diese[a] beschaffen? Denn bei uns ist niemand aus deinem Volk.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Nahrung“ oder „Versorgung“. Das griechische Wort bedeutet gewöhnlich „Kraft“ oder „Macht“, wird hier aber offenbar in einem ungewöhnlichen Sinn für das zum Lebensunterhalt Benötigte gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλίπῃ
  choice: ausgeht
  rationale: Das Verb bezeichnet hier das Zur-Neige-Gehen der mitgebrachten Dinge; „ausgeht“ ist im modernen Deutsch natürlich und präzise.
- source_word: τὰ μετὰ σοῦ ὄντα
  choice: das, was du bei dir hast
  rationale: Die bewusst allgemeine Formulierung des Griechischen bleibt erhalten, während der Zusammenhang erkennen lässt, dass Judiths mitgebrachter Proviant gemeint ist.
- source_word: ἐξοίσομεν σοι
  choice: sollen wir dir … beschaffen
  rationale: ἐκφέρω bedeutet wörtlich „hinausbringen/herbeibringen“; im Zusammenhang gibt „beschaffen“ die Frage nach der Herkunft und Bereitstellung idiomatisch wieder.
- source_word: δύναμιν
  choice: Vorräte
  rationale: δύναμις bedeutet gewöhnlich „Kraft“ oder „Macht“, bezeichnet hier aber dem Zusammenhang nach etwas zur Versorgung beziehungsweise Stärkung, das Judiths mitgebrachten Dingen entspricht.
- source_word: ὁμοίαν αὐτοῖς
  choice: gleichartige
  rationale: Die Wiedergabe bewahrt den Vergleich mit den Dingen, die Judith bei sich hat, und klingt im Deutschen weniger schwerfällig als „Vorräte wie diese“.
- source_word: ἐκ τοῦ ἔθνους σου
  choice: aus deinem Volk
  rationale: ἔθνος bezeichnet hier Judiths ethnische Gemeinschaft; „Volk“ ist im Deutschen natürlicher als „Nation“ und wahrt den Bezug auf ihre Herkunft.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die breite Formulierung „das, was du bei dir hast“ bleibt bestehen; erst „Vorräte“ verdeutlicht den sachlichen Zusammenhang. Die ungewöhnliche Verwendung von δύναμις wird nicht im Haupttext wörtlich nachgebildet, sondern in der Fußnote offengelegt.
