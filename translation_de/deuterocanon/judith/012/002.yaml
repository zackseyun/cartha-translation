base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/002.yaml
  text: And Judith said[a], “I will not eat from them, lest it become a stumbling block; instead, provision will be made for me from the things that have accompanied me.”
translation:
  language: de
  text: 'Und Judit sagte: „Ich werde nichts davon essen, damit kein Anstoß[a] entsteht; vielmehr werde ich mit dem versorgt werden, was ich mitgebracht habe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ärgernis“, „Fallstrick“ oder „Anlass zum Fall“. Das griechische Wort σκάνδαλον kann etwas bezeichnen, das Anstoß erregt, zu Fall bringt oder zum Verhängnis wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ φάγομαι ἐξ αὐτῶν
  choice: Ich werde nichts davon essen
  rationale: Gibt die bestimmte Weigerung im Futur natürlich wieder; „davon“ wahrt den Rückbezug auf die zuvor angebotenen Speisen, ohne sie im Vers ausdrücklich zu ergänzen.
- source_word: ἵνα μὴ γένηται
  choice: damit daraus kein … entsteht
  rationale: Bewahrt den finalen Sinn der Vermeidung und formuliert den im Griechischen nicht näher bezeichneten Zusammenhang im Deutschen verständlich.
- source_word: σκάνδαλον
  choice: Anstoß
  rationale: „Anstoß“ erhält den bildhaften moralisch-religiösen Gehalt des griechischen Wortes, ohne ihn auf bloße gesellschaftliche Empörung oder öffentliche Bloßstellung einzuengen.
- source_word: ἀλλʼ
  choice: vielmehr
  rationale: Kennzeichnet den deutlichen Gegensatz zwischen der abgelehnten Nahrung und der eigenen Versorgung in einem würdigen, natürlichen Register.
- source_word: ἐκ τῶν ἠκολουθηκότων μοι
  choice: mit dem, was ich mitgebracht habe
  rationale: Gibt die im Kontext gemeinten mitgeführten Vorräte idiomatisch wieder. Das Perfektpartizip bezeichnet wörtlich das, was Judit begleitet hat.
- source_word: χορηγηθήσεται
  choice: werde ich … versorgt werden
  rationale: Das deutsche Passiv entspricht dem griechischen Futur Passiv und vermittelt den Sinn des Bereitstellens beziehungsweise Versorgens.
theological_decisions:
- issue: Bedeutung von σκάνδαλον bei Judits Weigerung
  choice: Anstoß
  alternative: Ärgernis; Fallstrick; Anlass zum Fall
  rationale: 'Die Wiedergabe bewahrt die moralisch-religiöse Spannung: Judit will eine Verfehlung oder Gefährdung vermeiden, ohne dass der Text deren genaue Art ausdrücklich festlegt.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satz bleibt nahe an der griechischen Struktur, vermeidet jedoch die im Deutschen unnatürliche Rede von Dingen, die Judit „gefolgt“ seien.
