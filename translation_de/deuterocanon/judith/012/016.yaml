base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/016.yaml
  text: And when she entered[a], Judith reclined, and the heart of Holofernes was beside itself over her; his soul was shaken. He was very eager to have relations with her[b], and he was watching for an opportunity to deceive her from the day he saw her.
translation:
  language: de
  text: Als Judit hereinkam, legte sie sich zu Tisch[a]. Da geriet Holofernes ihretwegen außer sich, und seine Seele wurde erschüttert. Er begehrte heftig, mit ihr zu schlafen, und hielt seit dem Tag, an dem er sie gesehen hatte, nach einer Gelegenheit Ausschau, sie zu täuschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beim Gastmahl lag man üblicherweise auf einem Polster zu Tisch.
    reason: cultural_note
  - marker: b
    text: 'Oder: „sie zu verführen“ beziehungsweise „sie zu überlisten“. Das griechische Wort bedeutet „täuschen“; im Zusammenhang kann sexuelle Manipulation mitgemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: Als Judit hereinkam
  rationale: Das Aoristpartizip leitet zeitlich die folgende Handlung ein; ein temporaler Nebensatz gibt Ablauf und Zusammenhang in natürlichem Deutsch wieder.
- source_word: ἀνέπεσεν
  choice: legte sie sich zu Tisch
  rationale: Im Gastmahlkontext bezeichnet das Verb das damalige Liegen bei Tisch. Die Wendung ist verständlicher als das isolierte „legte sich nieder“ und wird durch eine Kulturnotiz erläutert.
- source_word: ἐξέστη ἡ καρδία ... ἐπʼ αὐτῇ
  choice: Da geriet Holofernes ihretwegen außer sich
  rationale: Die deutsche Redewendung bewahrt die Bildkraft des griechischen Ausdrucks und kennzeichnet Judit als Anlass seiner überwältigenden Erregung.
- source_word: ἐσαλεύθη ἡ ψυχὴ αὐτοῦ
  choice: seine Seele wurde erschüttert
  rationale: „Seele“ erhält die anthropologische Ausdrucksweise von ψυχή; „wurde erschüttert“ bildet das Passiv und die starke innere Bewegung ab.
- source_word: κατενθύμως σφόδρα
  choice: begehrte heftig
  rationale: Im Zusammenhang mit dem folgenden sexuellen Infinitiv bezeichnet die Wortgruppe ein starkes inneres Verlangen. „Heftig“ gibt σφόδρα prägnant wieder.
- source_word: τοῦ συγγενέσθαι μετʼ αὐτῆς
  choice: mit ihr zu schlafen
  rationale: Die griechische Wendung ist hier ein sexueller Euphemismus. Die moderne deutsche Formulierung macht den Sinn klar, ohne grob zu wirken.
- source_word: ἐτήρει καιρόν
  choice: hielt ... nach einer Gelegenheit Ausschau
  rationale: Das Imperfekt beschreibt anhaltendes Suchen beziehungsweise Abpassen eines geeigneten Augenblicks.
- source_word: τοῦ ἀπατῆσαι αὐτήν
  choice: sie zu täuschen
  rationale: ἀπατάω bedeutet grundsätzlich „täuschen“ oder „betrügen“. Die Übersetzung erhält diese Breite; der Kontext lässt zugleich sexuelle Verführung beziehungsweise Manipulation anklingen.
- source_word: ἀφʼ ἧς ἡμέρας εἶδεν αὐτήν
  choice: seit dem Tag, an dem er sie gesehen hatte
  rationale: „Seit“ gibt den vom ersten Sehen bis zum erzählten Zeitpunkt andauernden Zeitraum idiomatisch wieder; das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
theological_decisions:
- issue: Sexuelle Absicht in euphemistischer Sprache
  choice: mit ihr zu schlafen
  alternative: mit ihr zusammen zu sein / mit ihr Verkehr zu haben
  rationale: Der sexuelle Sinn ist im Kontext klar. „Mit ihr zu schlafen“ ist gegenwärtig und verständlich, bewahrt aber eine gewisse sprachliche Zurückhaltung.
- issue: Anthropologische Sprache von ψυχή
  choice: seine Seele wurde erschüttert
  alternative: sein Innerstes wurde aufgewühlt / er wurde innerlich erschüttert
  rationale: Die Beibehaltung von „Seele“ wahrt die konkrete Ausdrucksweise des griechischen Textes, ohne sie auf eine rein psychologische Deutung festzulegen.
- issue: Art der beabsichtigten Täuschung
  choice: sie zu täuschen
  alternative: sie zu verführen / sie zu überlisten
  rationale: Der Grundsinn des griechischen Verbs bleibt bestehen. Eine ausschließlich sexuelle Deutung wird nicht in den Haupttext eingetragen, obwohl sie im Kontext naheliegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt gut lesbar, während die anschaulichen Ausdrücke für Herz beziehungsweise Seele und die Mehrdeutigkeit von ἀπατάω erhalten werden.
