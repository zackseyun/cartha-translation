base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/012.yaml
  text: For look[a], it would be shameful for us if we let such a woman go without speaking with her; for if we do not draw her in, she will laugh at us.
translation:
  language: de
  text: 'Seht doch: Es wäre für uns eine Schande, wenn wir eine solche Frau gehen lassen, ohne mit ihr gesprochen zu haben. Denn wenn wir sie nicht zu uns heranziehen[a], wird sie uns auslachen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie nicht anlocken«, »sie nicht verführen« oder »sie nicht für uns gewinnen«. Das griechische Verb bezeichnet ein Heranziehen zu sich und kann hier eine anzügliche oder manipulative Annäherung meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Denn seht
  rationale: Bewahrt sowohl die begründende Funktion von γάρ als auch den nachdrücklichen Hinweischarakter von ἰδού in natürlichem modernem Deutsch.
- source_word: αἰσχρὸν τῷ προσώπῳ ἡμῶν
  choice: Es wäre eine Schande für uns
  rationale: Die Wendung bezeichnet hier eine Beschämung beziehungsweise einen Ehrverlust; eine wörtliche Wiedergabe mit »unserem Gesicht« wäre im Deutschen missverständlich.
- source_word: παρήσομεν
  choice: wir ... gehen ließen
  rationale: παρίημι bedeutet im Zusammenhang, jemanden vorbeiziehen oder gehen zu lassen. Der deutsche Konjunktiv fügt sich natürlich in den mit εἰ eingeleiteten Bedingungssatz ein.
- source_word: οὐχ ὁμιλήσαντες αὐτῇ
  choice: ohne mit ihr gesprochen zu haben
  rationale: Gibt das verneinte Aoristpartizip als vorausgehenden beziehungsweise begleitenden Umstand präzise wieder.
- source_word: ἐπισπάσωμεθα
  choice: an uns ziehen
  rationale: Bewahrt das Bild des Heranziehens und lässt offen, ob Anlocken, Verführen oder Gewinnen gemeint ist; der Kontext legt eine anzügliche beziehungsweise manipulative Absicht nahe.
- source_word: καταγελάσεται ἡμῶν
  choice: wird sie uns auslachen
  rationale: Gibt den direkten Sinn von καταγελάω und den Ton verletzter männlicher Ehre natürlich wieder.
