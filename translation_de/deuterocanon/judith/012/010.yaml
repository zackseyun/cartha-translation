  text: And on the fourth day[a], Holofernes gave a banquet for his servants alone[b], and he did not invite any of those in attendance.
translation:
  language: de
  text: Am vierten Tag veranstaltete Holofernes ein Trinkgelage nur für seine Sklaven; niemanden von denen, die mit Dienstaufgaben betraut waren, lud er dazu ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung kann sich auf Personen beziehen, die mit praktischen Diensten oder amtlichen Aufgaben betraut waren; ihre genaue Funktion bleibt offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῇ ἡμέρᾳ τῇ τετάρτῃ
  choice: Am vierten Tag
  rationale: Die griechische Erzählformel wird als natürlicher deutscher Zeitanschluss wiedergegeben, ohne ihren zeitlichen Gehalt zu verändern.
- source_word: ἐποίησεν ... πότον
  choice: veranstaltete ... ein Trinkgelage
  rationale: πότος bezeichnet besonders ein gemeinsames Gelage, bei dem das Trinken im Vordergrund steht. „Trinkgelage“ bildet dies genauer ab als das allgemeinere „Festmahl“.
- source_word: τοῖς δούλοις αὐτοῦ μόνοις
  choice: nur für seine Sklaven
  rationale: δοῦλος bezeichnet hier Personen, die Holofernes unterstanden, und kann einen rechtlich unfreien Status ausdrücken. „Sklaven“ bewahrt diese soziale Wirklichkeit; μόνοις beschränkt den Teilnehmerkreis ausschließlich auf sie.
- source_word: οὐκ ἐκάλεσεν
  choice: lud er keinen dazu ein
  rationale: Im Zusammenhang mit einem Gelage bezeichnet καλέω eine Einladung; „dazu“ stellt den natürlichen deutschen Bezug zur genannten Veranstaltung her.
- source_word: εἰς τὴν χρῆσιν
  choice: dazu
  rationale: Die wörtlich schwer wiederzugebende Wendung bezeichnet hier wahrscheinlich die Teilnahme beziehungsweise Mitwirkung bei der Veranstaltung. Der knappe Rückverweis ist im Deutschen idiomatisch, ohne eine unsichere Einzelbedeutung ausdrücklich festzulegen.
- source_word: τῶν πρὸς ταῖς χρείαις
  choice: von denen, die für die verschiedenen Dienste zuständig waren
  rationale: Die idiomatische Formulierung bezeichnet Personen, die mit notwendigen praktischen oder amtlichen Aufgaben befasst waren. „Verschiedene Dienste“ erhält die funktionale Bedeutung, ohne ein genaueres Amt vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Trinkgelage“ gibt den Charakter von πότος präzise wieder; die Schlusswendung bleibt wegen der idiomatischen und mehrdeutigen griechischen Formulierung bewusst allgemein.
