  yaml_path: translation/deuterocanon/judith/012/014.yaml
  text: And Judith said to him[a], “And who am I to speak back to my lord? Whatever is pleasing in his eyes, I will quickly do, and this will be my joy until the day of my death.”
translation:
  language: de
  text: 'Und Judit sagte zu ihm: »Wer bin ich denn, dass ich meinem Herrn widersprechen sollte?[a] Alles, was ihm gefällt, werde ich unverzüglich tun, und das wird mir Freude sein bis zum Tag meines Todes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass ich meinem Herrn Widerrede leisten sollte?« beziehungsweise »dass ich mich meinem Herrn widersetzen sollte?«'
    reason: Lexikalische Alternativen für ἀντειποῦσα, das sowohl widersprechendes Reden als auch ein Entgegentreten ausdrücken kann.
lexical_decisions:
- source_word: ἀντειποῦσα
  choice: widersprechen sollte
  rationale: Das Verb bezeichnet ein Entgegentreten in der Rede, also Widersprechen oder Widerrede. Die rhetorische Form mit »sollte« klingt im Deutschen natürlich und bewahrt Judits demonstrative Unterordnung.
- source_word: τῷ κυρίῳ μου
  choice: meinem Herrn
  rationale: κύριος bezeichnet hier Holofernes als menschlichen Vorgesetzten und ist ein ehrerbietiger sozialer Titel, kein Gottesname. »Herr« wahrt den höfisch-unterwürfigen Ton.
- source_word: πᾶν ὃ ἔσται ἐν τοῖς ὀφθαλμοῖς αὐτοῦ ἀρεστόν
  choice: Alles, was ihm gefällt
  rationale: Die griechische Wendung bedeutet, was in seinen Augen angenehm beziehungsweise genehm ist. Die natürliche deutsche Form gibt den Sinn klar wieder, ohne die Aussage zu verstärken.
- source_word: σπεύσασα
  choice: unverzüglich
  rationale: Das Partizip drückt Eile und bereitwillige Entschlossenheit beim Handeln aus. »Unverzüglich tun« ist gegenwärtiges, würdevolles Deutsch und bewahrt den zeitlichen Nachdruck.
- source_word: ἀγαλλίαμα
  choice: Freude
  rationale: Das Substantiv bezeichnet große Freude oder Jubel. »Freude« ist hier idiomatisch und lässt die mögliche Intensität offen, ohne einen im Deutschen unnatürlich feierlichen Ausdruck zu erzwingen.
- source_word: ἕως ἡμέρας θανάτου μου
  choice: bis zum Tag meines Todes
  rationale: Die formnahe Wiedergabe erhält die feierliche zeitliche Aussage des Griechischen.
theological_decisions:
- issue: Wiedergabe von κύριος in der Anrede eines Menschen
  choice: meinem Herrn
  alternative: meinem Gebieter
  rationale: Der Ausdruck ist hier kein göttlicher Titel, sondern eine ehrerbietige Anrede für Holofernes. »Herr« bewahrt die soziale Rangordnung, ohne Göttlichkeit anzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Judits höfisch-deferenter Ton bleibt erhalten; die rhetorische Frage wird natürlich formuliert. Die Fußnote bewahrt die Bedeutungsbreite von ἀντειποῦσα.
