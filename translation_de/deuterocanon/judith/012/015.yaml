base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/015.yaml
  text: And after disrobing[a], she adorned herself with her garments and with all her feminine adornment; and her female servant came and spread out for her on the ground opposite Holofernes the fleeces that she had received from Bagoas for her daily use[c][b], so that she might recline on them while eating.
translation:
  language: de
  text: Nachdem sie sich entkleidet hatte[a], schmückte sie sich mit ihren Kleidern und mit all ihrem Frauenschmuck. Ihre Sklavin[b] kam und breitete ihr gegenüber von Holofernes auf dem Boden die Felle aus, die Judith von Bagoas für ihren täglichen Gebrauch erhalten hatte, damit sie darauf liegend essen konnte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem sie sich umgezogen hatte“; wörtlicher möglicherweise: „Nachdem sie sich abgesondert hatte“. Das griechische Partizip ist ungewöhnlich. Im Zusammenhang bezeichnet es wohl ihre Vorbereitung, bei der sie die bisherige Kleidung ablegte oder wechselte.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort ist die weibliche Form des Wortes für „Sklave“. Gemeint ist eine versklavte Frau; traditionell wird auch „Magd“ übersetzt.
    reason: lexical_alternative
  - marker: c
    text: In der damaligen Tischkultur nahm man Mahlzeiten häufig im Liegen ein.
    reason: cultural_note
lexical_decisions:
- source_word: διαστασᾶσα
  choice: nachdem sie sich entkleidet hatte
  rationale: Das ungewöhnliche Partizip bezeichnet im Zusammenhang offenbar das Ablegen oder Wechseln der bisherigen Kleidung vor dem anschließenden Ankleiden und Schmücken. Die Fußnote bewahrt die lexikalische Unsicherheit.
- source_word: ἐκοσμήθη
  choice: schmückte sie sich
  rationale: Das Verb bezeichnet ein bewusstes Zurechtmachen oder Schmücken und nicht nur das bloße Ankleiden.
- source_word: ἱματισμός
  choice: Gewand
  rationale: Der Kollektivbegriff für Kleidung wird in einem natürlichen, würdigen deutschen Ausdruck wiedergegeben.
- source_word: παντὶ τῷ κόσμῳ τῷ γυναικείῳ
  choice: mit allem Schmuck einer Frau
  rationale: κόσμος meint hier den gesamten weiblichen Schmuck beziehungsweise Zierrat; die Formulierung bleibt breit und beschränkt die Bedeutung nicht auf Schmuckstücke.
- source_word: δούλη
  choice: Sklavin
  rationale: Die feminine Form von δοῦλος bezeichnet eine versklavte Frau; „Dienerin“ würde ihren rechtlichen und sozialen Status abschwächen.
- source_word: ἔστρωσεν
  choice: breitete ... aus
  rationale: Das Verb beschreibt das Ausbreiten einer Unterlage und passt zu den Fellen auf dem Boden.
- source_word: κώδια
  choice: Felle
  rationale: Der Ausdruck kann Felle oder Vliese als Unterlage bezeichnen. „Felle“ ist verständlich, ohne die Tierart über den griechischen Text hinaus festzulegen.
- source_word: εἰς τὴν καθημερινὴν δίαιταν αὐτῆς
  choice: für ihren täglichen Gebrauch
  rationale: δίαιτα kann Lebensweise, Tagesordnung oder regelmäßige Versorgung bezeichnen. Die gewählte Formulierung erhält diese Weite, während der folgende Zwecksatz den konkreten Gebrauch beim Essen erklärt.
- source_word: κατακλινομένην
  choice: darauf liegend essen
  rationale: Das Partizip verweist auf die antike Gewohnheit, beim Essen zu liegen beziehungsweise zu Tisch zu lagern.
