  to: Nachdem sie sich entkleidet hatte[a], schmückte sie sich mit ihren Kleidern und mit all ihrem Frauenschmuck. Ihre Sklavin[b] kam und breitete ihr gegenüber von Holofernes auf dem Boden die Felle aus, die Judith von Bagoas für ihren täglichen Gebrauch erhalten hatte, damit sie darauf liegend essen konnte[c].
