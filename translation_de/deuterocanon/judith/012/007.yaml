base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/007.yaml
  text: And Holofernes ordered the bodyguards not to hinder her[a]. So she remained in the camp for three days, and went out at night into the valley of Bethulia[b], and washed herself at the spring of water by the camp.
translation:
  language: de
  text: Und Holofernes befahl den Leibwächtern, sie nicht zu hindern. Sie blieb drei Tage im Lager; sie pflegte nachts in die Schlucht[a] von Betulia hinauszugehen und sich an der Wasserquelle im Lager zu waschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Tal“; das griechische Wort kann einen engen Taleinschnitt oder eine Schlucht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann auch „badete“ oder „tauchte sich unter“ bedeuten. Es gehört zu demselben Wortstamm, der später für „taufen“ gebraucht wird; hier ist keine christliche Taufe gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: befahl
  rationale: Gibt die verbindliche Anordnung knapp und mit ihrem autoritativen Gewicht wieder.
- source_word: σωματοφύλαξι
  choice: den Leibwächtern
  rationale: Das Kompositum bezeichnet persönliche Schutz- oder Leibwächter; „Leibwächter“ ist im Deutschen präzise und geläufig.
- source_word: μὴ διακωλύειν αὐτήν
  choice: sie nicht zu hindern
  rationale: Bewahrt die griechische Infinitivkonstruktion und lässt offen, woran sie nicht gehindert werden sollte.
- source_word: παρέμεινεν ἐν τῇ παρεμβολῇ ἡμέρας τρεῖς
  choice: Sie blieb drei Tage im Lager
  rationale: Natürliche deutsche Wiedergabe der Zeitdauer und des militärischen Sinns von παρεμβολή.
- source_word: ἐξεπορεύετο κατὰ νύκτα
  choice: nachts ging sie hinaus
  rationale: Der Imperfekt kann wiederholtes Handeln ausdrücken; „nachts ging sie hinaus“ lässt diesen gewohnheitsmäßigen Sinn im Zusammenhang erkennen, ohne ihn durch „Nacht für Nacht“ zwingend festzulegen.
- source_word: φάραγγα
  choice: Schlucht
  rationale: φάραγξ bezeichnet eher eine Schlucht oder einen engen Taleinschnitt als ein allgemein weites Tal.
- source_word: Βαιτυλοῦα
  choice: Betulia
  rationale: Verwendet die im Deutschen etablierte Form des Ortsnamens.
- source_word: ἐβαπτίζετο
  choice: wusch sich
  rationale: Das Verb bezeichnet hier ein Waschen, Baden oder Untertauchen. „Wusch sich“ ist im erzählerischen Zusammenhang natürlich und vermeidet eine sachlich irreführende Wiedergabe als christliche Taufe.
- source_word: ἐν τῇ παρεμβολῇ ἐπὶ τῆς πηγῆς τοῦ ὕδατος
  choice: im Lager an der Wasserquelle
  rationale: Folgt der Ortsangabe ἐν τῇ παρεμβολῇ ausdrücklich mit „im Lager“, auch wenn sie nach dem Hinausgehen in die Schlucht räumlich auffällig wirkt; diese Spannung wird nicht stillschweigend geglättet.
theological_decisions:
- issue: Bedeutung von ἐβαπτίζετο außerhalb eines christlichen Taufkontexts
  choice: wusch sich
  alternative: badete; tauchte sich unter
  rationale: Der griechische Wortstamm kann Eintauchen oder Waschen bezeichnen. Der Vers schildert eine körperliche Reinigung an einer Quelle; die Übersetzung soll weder christliche Taufsprache eintragen noch einen ausdrücklich rituellen Sinn behaupten, den dieser Satz allein nicht festlegt.
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit klaren Hauptsätzen. Der räumlich auffällige Wortlaut „im Lager“ bleibt entsprechend dem griechischen Text erhalten. Die Imperfektformen werden so wiedergegeben, dass wiederholtes nächtliches Handeln möglich bleibt, ohne die Aussage unnötig zu verstärken.
