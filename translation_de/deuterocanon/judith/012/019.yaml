  text: And taking it[a], she ate and drank before him what her maidslave had prepared.
translation:
  language: de
  text: Da nahm sie davon, aß und trank vor ihm, was ihre Sklavin[a] zubereitet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienerin“ beziehungsweise „Magd“. Das griechische Wort bezeichnet eine weibliche versklavte Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβοῦσα
  choice: Da nahm sie davon
  rationale: Das Aoristpartizip bezeichnet eine der Hauptaussage vorausgehende Handlung. „Davon“ ergänzt im Deutschen das im Griechischen unausgesprochene, aus dem Zusammenhang erschließbare Objekt, ohne es näher festzulegen.
- source_word: ἔφαγεν καὶ ἔπιεν
  choice: aß und trank
  rationale: Die beiden koordinierten Aoristformen werden knapp und idiomatisch wiedergegeben.
- source_word: κατέναντι αὐτοῦ
  choice: vor ihm
  rationale: Die Formulierung bewahrt die räumliche Bedeutung und passt natürlich zur Mahlszene.
- source_word: ἃ ἡτοίμασεν
  choice: was … zubereitet hatte
  rationale: „Was“ gibt das sächliche Pluralpronomen kollektiv wieder; das Plusquamperfekt verdeutlicht, dass die Zubereitung dem Essen und Trinken vorausging.
- source_word: ἡ δούλη αὐτῆς
  choice: ihre Sklavin
  rationale: δούλη ist die feminine Form von δοῦλος und bezeichnet hier eine weibliche versklavte Person. „Sklavin“ wahrt diesen sozialen Status deutlicher als das weichere „Dienerin“.
theological_decisions:
- issue: Wiedergabe von δούλη
  choice: Sklavin
  alternative: Dienerin / Magd
  rationale: Die Übersetzung soll den im griechischen Ausdruck angelegten unfreien Status nicht abschwächen. Die geläufigeren traditionellen Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist flüssig und knapp; „Sklavin“ wird trotz seiner Härte beibehalten, weil es den griechischen Sozialbegriff sachlich genauer wiedergibt.
