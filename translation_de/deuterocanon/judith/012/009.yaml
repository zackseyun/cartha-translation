  yaml_path: translation/deuterocanon/judith/012/009.yaml
  text: And when she went in[a], she remained in the tent purified until she brought in her food toward evening.
translation:
  language: de
  text: Und als sie hineinging, blieb sie rein[a] im Zelt, bis sie gegen Abend ihre Nahrung brachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sauber“ beziehungsweise „rituell rein“. Das griechische Adjektiv kann Reinheit im allgemeinen oder im rituellen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορευομένη
  choice: als sie hineinging
  rationale: Das Partizip wird als temporaler Nebensatz wiedergegeben; so bleibt der Vorgang des Hineingehens in natürlichem Deutsch erhalten.
- source_word: καθαρά
  choice: rein
  rationale: Das Adjektiv bezeichnet Reinheit und kann im Kontext auch rituelle Reinheit anklingen lassen, ohne diese ausdrücklich festzulegen.
- source_word: παρέμενεν
  choice: blieb
  rationale: Das Imperfekt beschreibt ein andauerndes Verbleiben; „blieb“ ist dafür im Deutschen knapp und idiomatisch.
- source_word: τῇ σκηνῇ
  choice: im Zelt
  rationale: σκηνή bezeichnet hier unmittelbar das Zelt.
- source_word: μέχρι οὗ
  choice: bis
  rationale: Die temporale Wendung wird direkt und idiomatisch mit „bis“ wiedergegeben.
- source_word: προσηνέγκατο
  choice: brachte
  rationale: Im Zusammenhang mit Nahrung bedeutet προσφέρω hier am ehesten „bringen“; „darbringen“ würde unnötig einen Opferbezug nahelegen.
- source_word: τὴν τροφὴν αὐτῆς
  choice: ihre Nahrung
  rationale: „Nahrung“ bewahrt den breiten Sinn von τροφή besser als das engere „Mahlzeit“.
- source_word: πρὸς ἑσπέραν
  choice: gegen Abend
  rationale: Die Formulierung gibt die zeitliche Annäherung an den Abend natürlich wieder.
theological_decisions:
- issue: Ob καθαρά im Haupttext ausdrücklich als rituelle Reinheit bezeichnet werden soll
  choice: Allgemein mit „rein“ wiedergeben und die rituelle Bedeutung offenlassen
  alternative: „rituell rein“ oder „kultisch rein“
  rationale: Der Kontext legt rituelle Reinheit nahe, doch das griechische Adjektiv allein erzwingt diese ausdrückliche Festlegung nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Erzählgang, ohne im Deutschen unnötig schwerfällig zu wirken; die Mehrdeutigkeit von καθαρά bleibt erhalten.
