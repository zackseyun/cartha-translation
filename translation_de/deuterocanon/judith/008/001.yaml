  text: And in those days Judith heard[a], the daughter of Merari son of Ox son of Joseph son of Oziel son of Elkiah son of Eliou son of Chelkias son of Eliab son of Nathanael son of Salamiel son of Sarasadai son of Israel.
translation:
  language: de
  text: Und in jenen Tagen hörte Judit, die Tochter Meraris, des Sohnes von Ox, des Sohnes von Josef, des Sohnes von Oziel, des Sohnes von Elkia, des Sohnes von Eliu, des Sohnes von Chelkias, des Sohnes von Eliab, des Sohnes von Natanael, des Sohnes von Salamiel, des Sohnes von Sarasadai, des Sohnes von Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Namen in Judits Stammbaum stehen hier in griechischen Formen; aus der hebräischen Überlieferung vertrautere mögliche Entsprechungen sind unter anderem Usiel für Oziel und Zurischaddai für Sarasadai. Der Haupttext folgt dem griechischen Text und rekonstruiert keine hebräischen Namensformen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte … davon
  rationale: Das griechische Verb bedeutet schlicht „hören“. Da ein allein stehendes „Judit hörte“ im Deutschen unvollständig wirkt, nimmt „davon“ den aus dem Zusammenhang erschließbaren Inhalt auf, ohne ihn näher festzulegen.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: in jenen Tagen
  rationale: Die geläufige temporale Wendung bewahrt Bedeutung und Erzählklang des Griechischen.
- source_word: θυγάτηρ
  choice: Tochter
  rationale: Die ausdrückliche genealogische Bezeichnung wird direkt wiedergegeben.
- source_word: υἱοῦ
  choice: des Sohnes von
  rationale: Die vielfache Wiederholung bildet die ausdrückliche Abstammungsreihe des griechischen Textes ab; „Nachkomme“ würde sie unnötig verallgemeinern.
- source_word: Ἰουδεὶθ
  choice: Judit
  rationale: Judit ist die im modernen Deutschen geläufige Form des Namens.
- source_word: Μεραρὶ / Ὢξ / Ἰωσὴφ / Ὀζιὴλ / Ἐλκεία / Ἠλειοὺ / Χελκείου / Ἐλεὰβ / Ναθαναὴλ / Σαλαμιὴλ / Σαρασαδαὶ / Ἰσραήλ
  choice: Merari / Ox / Josef / Oziel / Elkia / Eliu / Chelkias / Eliab / Natanael / Salamiel / Sarasadai / Israel
  rationale: Die Namen folgen in deutscher Umschrift grundsätzlich den griechischen Namensformen der Vorlage, statt mutmaßliche hebräische Ausgangsformen in den Haupttext einzusetzen.
