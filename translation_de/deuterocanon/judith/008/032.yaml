  text: And Judith said to them[a], “Listen to me[c][b], and I will do a deed that will reach to generation after generation among the sons of our people.”
translation:
  language: de
  text: 'Und Judit sagte zu ihnen: »Hört mich an! Ich werde eine Tat vollbringen, die bis in die Generationen der Nachkommen unseres Volkes[a] hineinreichen wird.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Söhne unseres Volkes«; »Söhne« kann hier kollektiv die Nachkommen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zu Generationen von Generationen«; die Wiederholung bezeichnet eine Reichweite über viele aufeinanderfolgende Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσατέ μου
  choice: Hört mich an!
  rationale: Der Imperativ von ἀκούω mit Genitiv fordert hier zum aufmerksamen Zuhören auf. »Hört mich an« ist im heutigen Deutsch natürlicher als das wörtlichere »Hört auf mich«, das leicht wie eine Aufforderung zum Gehorsam klingt.
- source_word: ποιήσω πρᾶγμα
  choice: Ich werde eine Tat vollbringen
  rationale: πρᾶγμα bezeichnet hier eine konkrete, beabsichtigte Handlung. »Eine Tat vollbringen« gibt die Verbindung mit ποιέω würdig und idiomatisch wieder.
- source_word: ἀφίξεται
  choice: weiterwirken wird
  rationale: ἀφικνέομαι bedeutet grundsätzlich »gelangen, reichen«. In Verbindung mit aufeinanderfolgenden Generationen bezeichnet es, dass die angekündigte Tat sie in ihrer Wirkung oder Bedeutung erreicht; »weiterwirken« drückt dies im Deutschen natürlich aus, ohne die Art der Wirkung näher festzulegen.
- source_word: εἰς γενεὰς γενεῶν
  choice: von Generation zu Generation
  rationale: Die Wiederholung ist eine idiomatische Wendung für fortdauernde Reichweite über viele aufeinanderfolgende Generationen. Die deutsche Formulierung bewahrt den Wiederholungscharakter.
- source_word: υἱοῖς τοῦ γένους ἡμῶν
  choice: bei den Nachkommen unseres Volkes
  rationale: υἱοί heißt wörtlich »Söhne«, kann im Zusammenhang mit künftigen Generationen aber kollektiv die Nachkommen bezeichnen. γένος meint hier die gemeinsame Volks- oder Abstammungsgemeinschaft; »unser Volk« vermeidet irreführende moderne Bedeutungen von »Rasse« oder »Geschlecht«.
theological_decisions:
- issue: Kollektive, grammatisch männliche Bezeichnung υἱοῖς
  choice: Nachkommen unseres Volkes
  alternative: Söhne unseres Volkes
  rationale: Der unmittelbare Zusammenhang mit künftigen Generationen spricht für die kollektive Bedeutung »Nachkommen«. Die ausdrücklich männliche Grundbedeutung wird in einer Fußnote offengelegt, statt den deutschen Haupttext unnötig auf männliche Nachkommen zu beschränken.
- issue: Art der fortdauernden Bedeutung der angekündigten Tat
  choice: weiterwirken wird
  alternative: reichen wird / in Erinnerung bleiben wird
  rationale: Der griechische Text sagt, dass die Tat künftige Generationen »erreichen« wird, legt aber nicht ausdrücklich fest, ob dies durch Erinnerung, Ruhm oder eine andere Wirkung geschieht. »Weiterwirken« wahrt diese Offenheit; »in Erinnerung bleiben« würde sie vorschnell festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt entschlossen, ohne altertümliche Wendungen. »Judit« folgt der im modernen deutschen Bibelgebrauch verbreiteten Namensform.
