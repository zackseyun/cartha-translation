    rationale: Der Doppelpunkt mit „Er hatte ihnen geschworen“ trennt den Schwur von Usija ab und lässt das Pronomen, obwohl praktisch erschließbar, ohne unmittelbare Nennung seines Bezugs. Der griechische Relativsatz bezieht den Schwur direkt auf Ὀζείας.
  - severity: low
    issue: Register von „böse Worte“ und „Vorsteher“
    rationale: „Böse Worte“ ist zwar möglich, wirkt aber im modernen Deutsch weniger idiomatisch als „feindselige Worte“. „Vorsteher“ kann ein zu spezifisches modernes Amtsprofil nahelegen; ἄρχων bleibt am besten mit einem allgemeinen Leitungstitel wiedergegeben.
