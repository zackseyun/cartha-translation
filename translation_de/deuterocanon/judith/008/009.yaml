base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/009.yaml
  text: And she heard the evil words of the people against the ruler[a], because they had lost heart over the shortage of water; and she heard all the words that Ozias had spoken to them, that he had sworn to hand over the city to the Assyrians after five days.
translation:
  language: de
  text: Und sie hörte die feindseligen Worte des Volkes gegen das Oberhaupt, denn wegen des Wassermangels hatten sie den Mut verloren. Auch Judith hörte alles, was Usija zu ihnen gesagt hatte, dass er ihnen geschworen hatte, die Stadt nach fünf Tagen den Assyrern zu übergeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Stadt den Assyrern auszuliefern«.'
    reason: »Übergeben« gibt παραδιδόναι unmittelbar wieder; »ausliefern« ist im militärischen Zusammenhang eine mögliche kontextuelle Wiedergabe.
lexical_decisions:
- source_word: ῥήματα τοῦ λαοῦ τὰ πονηρά
  choice: die bösen Worte des Volkes
  rationale: Die Wiedergabe bewahrt sowohl den konkreten Bezug auf das Gesagte als auch dessen ausdrücklich negative moralische Wertung.
- source_word: ἄρχοντα
  choice: Vorsteher
  rationale: Der allgemeine Leitungstitel bezeichnet hier eine führende Person, ohne ein genaueres politisches Amt festzulegen.
- source_word: ὠλιγοψύχησαν
  choice: hatten sie den Mut verloren
  rationale: Die idiomatische Formulierung gibt das Mutlos- oder Kleinmütigwerden verständlich und mit der emotionalen Kraft des griechischen Verbs wieder.
- source_word: σπάνει τῶν ὑδάτων
  choice: wegen des Wassermangels
  rationale: Die Wendung bezeichnet die durch Knappheit verursachte Notlage; der deutsche Singular ist bei der Stoffbezeichnung natürlich.
- source_word: πάντας τοὺς λόγους
  choice: alles, was ... gesagt hatte
  rationale: Diese natürliche deutsche Formulierung gibt den gesamten Inhalt der Äußerungen wieder, ohne das schwerfällige »alle Worte« zu erzwingen.
- source_word: ὤμοσεν
  choice: hatte ... geschworen
  rationale: Das ausdrücklich genannte Eidmoment bleibt vollständig erhalten.
- source_word: παραδώσειν
  choice: auszuliefern
  rationale: Im militärischen Zusammenhang bezeichnet das Verb die Übergabe der Stadt an die Assyrer; »auszuliefern« ist hier idiomatisch, während eine Fußnote die allgemeinere wörtliche Bedeutung nennt.
- source_word: μετὰ ἡμέρας πέντε
  choice: nach fünf Tagen
  rationale: μετά mit Akkusativ hat hier den normalen zeitlichen Sinn »nach«; die Formulierung wird nicht zu »innerhalb von fünf Tagen« verengt.
- source_word: Ὀζείας
  choice: Usija
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Namensform wird verwendet.
theological_decisions:
- issue: Ausdrückliche Nennung Judiths im zweiten Satzteil
  choice: »Auch Judith hörte ...«
  alternative: »Und sie hörte ...«
  rationale: Der griechische Text nennt Ἰουδεὶθ ausdrücklich als Subjekt des zweiten ἤκουσεν. Die Wiederaufnahme des Namens bewahrt diese Hervorhebung und verhindert, dass eine textlich vorhandene Wiederholung beseitigt wird.
- issue: Art der Übergabe der Stadt
  choice: »den Assyrern auszuliefern« mit Fußnote zur wörtlicheren Alternative
  alternative: »den Assyrern zu übergeben« oder »vor den Assyrern zu kapitulieren«
  rationale: Der Kontext legt eine militärische Preisgabe nahe, doch παραδίδωμι bezeichnet allgemein das Übergeben und nennt nicht ausdrücklich den technischen Vorgang einer Kapitulation. Die Übersetzung wahrt beides durch Haupttext und Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit gegliedert; der Doppelpunkt macht den Inhalt von Usijas Worten transparent. Die ausdrückliche zweite Nennung Judiths folgt dem griechischen Ausgangstext trotz der abweichenden letzten englischen Revision.
