  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen: Judith hört die feindseligen Worte des Volkes gegen den Leiter, dessen Mutlosigkeit wegen des Wassermangels, sowie die von Usija geleistete Zusage, die Stadt nach fünf Tagen den Assyrern zu übergeben. Die explizite Wiederaufnahme von Judith entspricht dem griechischen Text (Ἰουδεὶθ). Die Umformung mit Doppelpunkt und dem unverbundenen Pronomen „Er“ löst jedoch die griechische Relativkonstruktion unnötig und macht den Bezug weniger präzise.'
  naturalness: Der Text ist insgesamt verständlich und würdig. „Böse Worte“ klingt im heutigen Standarddeutsch etwas pauschal und weniger idiomatisch als „feindselige Worte“. „Vorsteher“ kann im Deutschen einen institutionellen oder verwaltungstechnischen Beiklang haben; „Oberhaupt“ gibt den allgemeinen Leitungstitel hier natürlicher wieder. Eine direkte dass-Konstruktion macht Usijas Schwur klar und flüssig.
  terminology: „Usija“ und „Assyrer“ sind passende deutsche Namensformen. „Ausliefern“ ist im Kontext möglich, aber „übergeben“ ist näher an παραδιδόναι und ausreichend natürlich. Der Schwurcharakter von ὤμοσεν bleibt mit „geschworen“ erhalten. „Nach fünf Tagen“ bewahrt die zeitliche Formulierung μετὰ ἡμέρας πέντε.
