revisions:
- from: 'Und sie hörte die bösen Worte des Volkes gegen den Vorsteher, denn wegen des Wassermangels hatten sie den Mut verloren. Auch Judith hörte alles, was Usija zu ihnen gesagt hatte: Er hatte ihnen geschworen, die Stadt nach fünf Tagen den Assyrern auszuliefern.[a]'
