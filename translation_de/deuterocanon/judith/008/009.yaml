  rationale: Die Revision klärt die syntaktische Zuordnung von Usijas Schwur, verwendet natürlichere allgemeine Bezeichnungen für die feindselige Rede und den Leiter und bleibt bei „übergeben“ enger am griechischen παραδιδόναι. Die ausdrückliche zweite Nennung Judiths wird beibehalten, weil sie im griechischen Satz steht.
