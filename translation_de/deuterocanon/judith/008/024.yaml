base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/024.yaml
  text: Now[a], brothers, let us show our brothers that their life hangs on us[b], and that the holy things and the house and the altar rest on us.
translation:
  language: de
  text: Nun, Brüder[a], lasst uns unseren Brüdern zeigen, dass ihr Leben an uns hängt[b] und dass die heiligen Dinge, das Haus und der Altar auf uns ruhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“, falls die Anrede inklusiv und nicht ausschließlich an Männer gerichtet zu verstehen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Seele“; hier ist wahrscheinlich ihr Leben beziehungsweise Überleben gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der grammatisch maskuline Plural und die Anrede als Angehörige des gemeinsamen Bundesvolkes werden bewahrt. Eine inklusive Deutung bleibt in der Fußnote sichtbar.
- source_word: ἐπιδειξώμεθα
  choice: lasst uns … zeigen
  rationale: Der hortative Konjunktiv fordert zu einem sichtbaren Erweis durch Handeln auf; die deutsche Wendung gibt diesen Aufforderungscharakter natürlich wieder.
- source_word: ἐξ ἡμῶν κρέμαται
  choice: hängt an uns
  rationale: Die anschauliche Metapher des griechischen Ausdrucks bleibt erhalten, ohne sie zum bloßen „abhängen von“ abzuschwächen.
- source_word: ἡ ψυχὴ αὐτῶν
  choice: ihr Leben
  rationale: ψυχή bezeichnet hier angesichts der Bedrohung am ehesten das Leben beziehungsweise Überleben der Gemeinschaft, nicht ausdrücklich eine vom Körper unterschiedene Seele.
- source_word: τὰ ἅγια
  choice: die heiligen Dinge
  rationale: Der substantivierte neutrale Plural wird formal bewahrt. „Heiligtum“ würde die Mehrzahl einebnen und könnte den Ausdruck mit dem anschließend genannten Haus zusammenfallen lassen.
- source_word: ὁ οἶκος
  choice: das Haus
  rationale: Die schlichte Quellform wird erhalten; im kultischen Zusammenhang ist der Tempel gemeint, doch der Text sagt ausdrücklich „das Haus“.
- source_word: τὸ θυσιαστήριον
  choice: der Altar
  rationale: Dies ist die klare und übliche deutsche Entsprechung des kultischen Begriffs.
- source_word: ἐπεστήρισται ἐφʼ ἡμῖν
  choice: sich auf uns stützen
  rationale: Die Form bezeichnet einen bestehenden Zustand der Stützung oder Abhängigkeit. Die deutsche Formulierung bleibt bildhaft und ist zugleich verständlich.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftssprache in der direkten Anrede
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die maskuline Form des griechischen Textes bleibt im Haupttext erhalten; dass die Anrede auch inklusiv verstanden werden kann, wird nicht ausgeschlossen, sondern in der Fußnote kenntlich gemacht.
- issue: ψυχή als Leben oder Seele
  choice: ihr Leben
  alternative: ihre Seele
  rationale: Im Kontext geht es um das bedrohte Überleben der Gemeinschaft. „Leben“ vermeidet eine nicht erforderliche anthropologische oder lehrmäßige Festlegung.
- issue: τὰ ἅγια als heilige Dinge oder Heiligtum
  choice: die heiligen Dinge
  alternative: das Heiligtum
  rationale: Die pluralische und vom Haus sowie vom Altar unterschiedene Ausdrucksweise des Ausgangstextes wird bewahrt, ohne die genaue Referenz enger festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Verwandtschaftsbezeichnung und die beiden Bilder „an uns hängt“ und „sich auf uns stützen“ bleiben erhalten. Die leicht ungewohnte Wendung „die heiligen Dinge“ bildet die offene Mehrzahl des griechischen Ausdrucks bewusst ab.
