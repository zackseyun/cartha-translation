base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/010.yaml
  text: And she sent her maid[a], who was in charge of all that belonged to her, and summoned Chabris and Charmis, the elders of her city.
translation:
  language: de
  text: Da schickte sie ihre Dienerin[a], die über ihren ganzen Besitz gesetzt war, und ließ Chabris und Charmis, die Ältesten ihrer Stadt, rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bedienstete“ oder „Magd“. Das griechische Wort bezeichnet eine weibliche persönliche Dienerin oder Begleiterin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστείλασα
  choice: Da schickte sie
  rationale: Das vorzeitige Aoristpartizip bezeichnet die der Haupthandlung vorausgehende Handlung; die finite deutsche Wendung gibt die Abfolge natürlich wieder.
- source_word: ἅβραν
  choice: Dienerin
  rationale: Das Wort bezeichnet eine weibliche persönliche Bedienstete bzw. Begleiterin; „Dienerin“ ist im modernen Deutsch klar und würdig, ohne die altertümliche Färbung von „Magd“.
- source_word: τὴν ἐφεστῶσαν πᾶσιν τοῖς ὑπάρχουσιν αὐτῆς
  choice: die über ihren ganzen Besitz gesetzt war
  rationale: ἐφεστῶσαν drückt eine übertragene Aufsichts- oder Verwaltungsverantwortung aus; τὰ ὑπάρχοντα bezeichnet hier ihren Besitz. Die Formulierung bewahrt diesen leitenden Sinn.
- source_word: ἐκάλεσεν
  choice: ließ ... rufen
  rationale: Da Judith ihre Dienerin schickt, um die Ältesten zu sich zu holen, bildet die kausative Wendung den im Griechischen nur sinngemäß erkennbaren Botengang natürlich ab, ohne einen amtlichen Befehl überzubetonen.
- source_word: Χαβρεὶν καὶ Χαρμεῖν
  choice: Chabris und Charmis
  rationale: Die Eigennamen werden in den im Deutschen gebräuchlichen, an den griechischen Nominativformen orientierten Formen wiedergegeben.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως αὐτῆς
  choice: die Ältesten ihrer Stadt
  rationale: πρεσβύτεροι bezeichnet hier die führenden Stadtältesten und nicht lediglich ältere Männer; der Bezug αὐτῆς bleibt ausdrücklich erhalten.
