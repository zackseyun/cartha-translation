base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/033.yaml
  text: You stand at the gate tonight, and I will go out with my maidservant; and within the days after which you said you would hand over the city to our enemies, the Lord will visit Israel by my hand.
translation:
  language: de
  text: Stellt euch heute Nacht am Tor auf. Ich werde mit meiner Dienerin hinausgehen. Noch in den Tagen, nach deren Ablauf ihr, wie ihr gesagt habt, die Stadt unseren Feinden ausliefern werdet, wird der Herr Israel durch meine Hand helfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσεσθε ἐπὶ τῆς πύλης
  choice: ihr sollt euch am Tor aufstellen
  rationale: Das futurische στήσεσθε hat im Kontext auffordernde Kraft; „sich aufstellen“ gibt das Wachen beziehungsweise Bereitstehen am Tor natürlich wieder.
- source_word: ἅβρα
  choice: Dienerin
  rationale: Bezeichnet Judiths persönliche Dienerin; „Dienerin“ ist im heutigen Deutsch klar und würdig, ohne unnötig einen rechtlichen Status festzulegen.
- source_word: ἐν ταῖς ἡμέραις μεθʼ ἃς
  choice: innerhalb der Frist, nach deren Ablauf
  rationale: Die schwerfällige griechische Zeitangabe bezeichnet die zuvor gesetzte Anzahl von Tagen und wird verständlich wiedergegeben, ohne den Zeitrahmen zu erweitern.
- source_word: ἐπισκέψεται
  choice: heimsuchen
  rationale: Bewahrt die theologisch offene Bedeutung von Gottes machtvollem Eingreifen; der Kontext legt eine rettende Zuwendung nahe, doch das Verb selbst wird nicht auf „retten“ verengt.
- source_word: ἐν χειρί μου
  choice: durch meine Hand
  rationale: Die semitisch geprägte Wendung bezeichnet Judith als Werkzeug des göttlichen Handelns; die bildhafte Form bleibt erhalten.
theological_decisions:
- issue: Art des göttlichen Eingreifens in ἐπισκέψεται
  choice: wird ... heimsuchen
  alternative: wird sich ... annehmen / wird ... retten
  rationale: „Heimsuchen“ erhält die mögliche Spannweite von prüfendem, richtendem oder rettendem Eingreifen, während der Erzählkontext die positive Wirkung erkennen lässt.
- issue: Verhältnis zwischen Gottes Handeln und Judiths Handeln
  choice: der Herr ... durch meine Hand
  alternative: der Herr wird Israel durch mich helfen
  rationale: Die Formulierung wahrt zugleich Gottes Urheberschaft und Judiths instrumentale Rolle, ohne eine weitergehende dogmatische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste griechische Futur wird als kontextuelle Aufforderung wiedergegeben. Die ungewöhnliche Fristformulierung bleibt inhaltlich eng am Griechischen, wird aber idiomatisch geglättet.
