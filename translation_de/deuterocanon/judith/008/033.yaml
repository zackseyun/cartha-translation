review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur ist zutreffend: Judith fordert die Männer zum Bereitstehen am Tor auf, kündigt ihr Ausgehen mit ihrer Dienerin an und schreibt das Handeln des Herrn ihrer Hand als Werkzeug zu. Die Fristformulierung ist jedoch im Entwurf zeitlich missverständlich: »innerhalb der Frist, nach deren Ablauf ihr ... ausliefern wolltet« lässt die Auslieferung wie einen bloßen früheren Wunsch erscheinen. Das griechische εἴπατε παραδῶσειν bezeichnet vielmehr die von ihnen angekündigte künftige Übergabe nach Ablauf der genannten Tage. Außerdem trägt »heimsuchen« im heutigen Deutsch überwiegend den Sinn eines strafenden oder unheilvollen Treffens und ist hier, wo Judith Gottes bevorstehende Rettung ankündigt, ohne Weiteres missleitend.'
  naturalness: Die Überarbeitung verwendet natürliche, würdevolle Standardsprache. »Noch in den Tagen, nach deren Ablauf ...« gibt die ungewöhnliche griechische Fristsetzung verständlich wieder, ohne die zeitliche Spannung aufzulösen.
  terminology: »Dienerin« ist für ἅβρα angemessen. »Der Herr« gibt Κύριος sachgerecht wieder. »durch meine Hand« bewahrt die konkrete instrumentale Wendung ἐν χειρί μου. »helfen« erschließt ἐπισκέψεται im eindeutig rettenden Erzählzusammenhang, ohne eine zusätzliche theologische Deutung einzutragen.
  issues:
  - severity: medium
    issue: Zeitbezug der angekündigten Auslieferung ist verschoben bzw. unklar.
    rationale: »... ausliefern wolltet« kann aussagen, dass die Männer dies lediglich beabsichtigten. Der griechische Infinitiv Futur nach εἴπατε bezieht sich auf die von ihnen für die Zeit nach Ablauf der Tage angekündigte Auslieferung.
  - severity: medium
    issue: »heimsuchen« ist im modernen Deutsch kontextwidrig negativ geprägt.
    rationale: Obwohl ἐπισκέπτομαι lexikalisch »aufsuchen/sehen nach« bedeuten kann, kündigt Judith hier Gottes rettendes Eingreifen für Israel an. Die Hauptlesart von »heimsuchen« suggeriert dagegen Unheil über Israel; die Fußnote neutralisiert diesen Eindruck nicht ausreichend.
  revised_text: Stellt euch heute Nacht am Tor auf. Ich werde mit meiner Dienerin hinausgehen. Noch in den Tagen, nach deren Ablauf ihr, wie ihr gesagt habt, die Stadt unseren Feinden ausliefern werdet, wird der Herr Israel durch meine Hand helfen.
