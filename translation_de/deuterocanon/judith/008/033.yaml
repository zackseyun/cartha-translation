revisions:
- from: Ihr sollt euch heute Nacht am Tor aufstellen. Ich werde mit meiner Dienerin hinausgehen, und innerhalb der Frist, nach deren Ablauf ihr die Stadt unseren Feinden ausliefern wolltet, wird der Herr Israel durch meine Hand heimsuchen.[a]
  to: Stellt euch heute Nacht am Tor auf. Ich werde mit meiner Dienerin hinausgehen. Noch in den Tagen, nach deren Ablauf ihr, wie ihr gesagt habt, die Stadt unseren Feinden ausliefern werdet, wird der Herr Israel durch meine Hand helfen.
  rationale: 'Die Aufforderungsform gibt den im Kontext direktiven griechischen Futur idiomatisch wieder. Die Frist wird so formuliert, dass deutlich bleibt: Gottes Eingreifen erfolgt noch vor dem Zeitpunkt, nach dem die Männer die Übergabe der Stadt angekündigt haben. Die Übersetzung von ἐπισκέψεται als »helfen« folgt dem unmittelbaren Rettungskontext und vermeidet die im heutigen Deutsch irreführende negative Konnotation von »heimsuchen«.'
