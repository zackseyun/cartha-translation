base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/015.yaml
  text: For if he is not willing to help us within these five days[a], he himself has the authority, in whatever days he wishes, to shelter us[b], or even to destroy us before our enemies.
translation:
  language: de
  text: Denn wenn er uns innerhalb dieser fünf Tage nicht helfen will, hat er selbst die Vollmacht, uns an welchen Tagen er will zu beschirmen[a] oder uns sogar vor den Augen unserer Feinde zu vernichten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu schützen“. Das griechische Verb bedeutet wörtlich „bedecken“ und meint hier schützende Bergung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor dem Angesicht unserer Feinde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ βούληται
  choice: wenn er … nicht helfen will
  rationale: Die Formulierung bewahrt den Willens- und Entscheidungsaspekt von βούλομαι und klingt im modernen Deutschen natürlich.
- source_word: ἐν ταῖς πέντε ἡμέραις
  choice: innerhalb dieser fünf Tage
  rationale: Die Wendung bezeichnet im Kontext die zuvor gesetzte Frist von fünf Tagen; „innerhalb“ macht diesen zeitlichen Rahmen deutlich.
- source_word: βοηθῆσαι
  choice: helfen
  rationale: „Helfen“ gibt den weiten Sinn des Verbs wieder, ohne ihn unnötig auf „retten“ oder „befreien“ einzuengen.
- source_word: αὐτὸς ἔχει τὴν ἐξουσίαν
  choice: hat er selbst die Vollmacht
  rationale: „Vollmacht“ umfasst hier die rechtmäßige Freiheit und Macht zum Handeln; „selbst“ erhält die Betonung von αὐτός.
- source_word: ἐν αἷς θέλει … ἡμέραις
  choice: an welchen Tagen er will
  rationale: Die Übersetzung bleibt bei der ausdrücklichen Rede von „Tagen“ und wahrt Gottes Freiheit hinsichtlich des Zeitpunkts, auch wenn die griechische Wortstellung im Deutschen geglättet wird.
- source_word: σκεπάσαι
  choice: zu beschirmen
  rationale: Das Verb bezeichnet wörtlich ein Bedecken und im Kontext schützende Bewahrung. „Beschirmen“ erhält den Schutzgedanken und einen Rest des Bildes.
- source_word: ὀλεθρεῦσαι
  choice: zu vernichten
  rationale: Das Verb bezeichnet Zerstörung oder Untergang; „vernichten“ gibt die Schwere der Aussage unmittelbar wieder.
- source_word: πρὸ προσώπου τῶν ἐχθρῶν ἡμῶν
  choice: vor den Augen unserer Feinde
  rationale: Diese idiomatische Wiedergabe erhält den wörtlichen Bezug auf das Angesicht und den Sinn eines öffentlich vor den Feinden geschehenden Untergangs, ohne die Feinde ausdrücklich als Handelnde festzulegen.
theological_decisions:
- issue: Gottes Souveränität über Zeitpunkt und Ausgang
  choice: Gott behält die Vollmacht, sowohl zu beschirmen als auch zu vernichten, unabhängig von der von Menschen gesetzten Frist.
  alternative: Die zweite Möglichkeit könnte abgeschwächt als bloßes Zulassen der Vernichtung durch die Feinde formuliert werden.
  rationale: Im Griechischen stehen sowohl σκεπάσαι als auch ὀλεθρεῦσαι unter derselben ausdrücklich Gott zugeschriebenen ἐξουσία. Die Übersetzung bewahrt diese theologische Spannung und legt die Feinde nicht als ausführende Ursache fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vollmacht“ und „beschirmen“ tragen den feierlichen Ton des Textes, bleiben aber verständlich. Die ungewöhnliche Wendung „an welchen Tagen er will“ bewahrt die ausdrückliche und theologisch bedeutsame Freiheit Gottes hinsichtlich des Zeitpunkts.
