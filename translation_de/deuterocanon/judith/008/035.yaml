  yaml_path: translation/deuterocanon/judith/008/035.yaml
  text: Then Uzziah and the rulers said to her[a], “Go in peace, and may the Lord God go before you for vengeance on our enemies.”
translation:
  language: de
  text: 'Da sagten Usija und die Vorsteher zu ihr: „Geh in Frieden! Gott, der Herr, möge vor dir hergehen, um Rache an unseren Feinden zu üben.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um an unseren Feinden Vergeltung zu üben“; auch möglich: „um uns gegenüber unseren Feinden Recht zu verschaffen“. Das griechische Wort kann sowohl vergeltendes Handeln als auch Rechtverschaffung bezeichnen; im Zusammenhang des Krieges liegt „Rache“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sagten
  rationale: Das griechische Verb steht formal im Singular, obwohl Usija und die Vorsteher das zusammengesetzte Subjekt bilden. Im natürlichen Deutschen verlangt dieses Subjekt den Plural „sagten“.
- source_word: Ὀζίας
  choice: Usija
  rationale: „Usija“ ist die im modernen deutschen Bibelgebrauch übliche Namensform; sie gibt die griechische Form Ὀζίας traditionsgemäß wieder.
- source_word: οἱ ἄρχοντες
  choice: die Vorsteher
  rationale: ἄρχοντες bezeichnet Männer in leitender oder obrigkeitlicher Stellung. „Vorsteher“ bewahrt den amtlichen Sinn, ohne ein nicht genanntes konkretes Amt festzulegen.
- source_word: Πορεύου εἰς εἰρήνην
  choice: Geh in Frieden
  rationale: Die geläufige deutsche Segens- und Abschiedsformel gibt sowohl den Bewegungsimperativ als auch den idiomatischen Ausdruck εἰς εἰρήνην wieder.
- source_word: Κύριος ὁ θεὸς
  choice: Gott, der Herr
  rationale: Diese im Deutschen natürliche Titelform gibt die Verbindung von κύριος und θεός wieder, ohne ein im Griechischen fehlendes Possessivpronomen einzufügen.
- source_word: ἔμπροσθέν σου
  choice: möge vor dir hergehen
  rationale: Wörtlich steht „vor dir“; durch den vorausgehenden Bewegungsbefehl ist ein Vorangehen sinngemäß. „Möge“ macht den elliptischen Segenswunsch im Deutschen ausdrücklich.
- source_word: εἰς ἐκδίκησιν τῶν ἐχθρῶν ἡμῶν
  choice: um Rache an unseren Feinden zu üben
  rationale: Im Zusammenhang der militärischen Bedrohung bezeichnet ἐκδίκησις am ehesten vergeltendes Eingreifen. Die deutsche Wendung macht die Zielrichtung von εἰς deutlich.
theological_decisions:
- issue: Wiedergabe von Κύριος ὁ θεός
  choice: Gott, der Herr
  alternative: der Herr, Gott
  rationale: „Gott, der Herr“ ist im Deutschen eine natürliche Gottesbezeichnung und vermeidet sowohl die unidiomatische bloße Reihung „der Herr, Gott“ als auch die Ergänzung „unser“, die im Ausgangstext nicht steht.
- issue: Bedeutungsumfang von ἐκδίκησις
  choice: Rache an unseren Feinden üben
  alternative: uns gegenüber unseren Feinden Recht verschaffen
  rationale: Der kriegerische Rettungszusammenhang spricht für eine konkrete vergeltende Handlung. Da das Wort zugleich Ahndung oder Rechtverschaffung bezeichnen kann, wird diese Spannung in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist als Segenswunsch formuliert; „Vorsteher“ lässt die genaue Art der Leitungsämter bewusst offen.
