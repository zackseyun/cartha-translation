base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/006.yaml
  text: And she fasted all the days of her widowhood[a], except the days before Sabbaths and Sabbaths and the days before new moons and festivals and celebrations of the house of Israel.
translation:
  language: de
  text: Und sie fastete an allen Tagen ihres Witwenstandes, außer an den Tagen vor den Sabbaten, an den Sabbaten, an den Tagen vor den Neumonden[a], an den Festen und an den Freudentagen des Hauses Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Zusammensetzungen bezeichnen wörtlich das, was den Sabbaten beziehungsweise den Neumonden vorausgeht.
    reason: Die Fußnote macht die parallele Wortbildung von προσαββάτων und προνουμηνιῶν sichtbar und erklärt die ergänzende Wiedergabe mit „Tagen“.
lexical_decisions:
- source_word: ἐνήστευε
  choice: sie fastete
  rationale: Der Imperfekt bezeichnet hier eine über längere Zeit gewohnheitsmäßig fortgesetzte Praxis; das deutsche Präteritum gibt dies im Zusammenhang natürlich wieder.
- source_word: πάσας τὰς ἡμέρας τῆς χηρεύσεως αὐτῆς
  choice: an allen Tagen ihres Witwenstandes
  rationale: Die Formulierung bewahrt den zeitlichen Gesamtumfang und die Struktur des Griechischen; die anschließend genannten Ausnahmen verhindern das Missverständnis eines ausnahmslos täglichen Fastens.
- source_word: χωρὶς
  choice: außer
  rationale: Die Präposition kennzeichnet hier klar die Tage, die von Judiths üblichem Fasten ausgenommen waren.
- source_word: προσαββάτων
  choice: an den Tagen vor den Sabbaten
  rationale: Das griechische Kompositum bezeichnet die den Sabbaten vorausgehenden Tage. Die beschreibende Wiedergabe vermeidet einen späteren technischen Ausdruck, den der Text nicht ausdrücklich verwendet.
- source_word: σαββάτων
  choice: an den Sabbaten
  rationale: Der griechische Plural verweist auf die regelmäßig wiederkehrenden Sabbate und bleibt im Deutschen erhalten.
- source_word: προνουμηνιῶν
  choice: an den Tagen vor den Neumonden
  rationale: Wie προσαββάτων ist dies ein Kompositum für die jeweils vorausgehenden Tage; die parallele deutsche Formulierung bildet diese Beziehung deutlich ab.
- source_word: ἑορτῶν
  choice: an den Festen
  rationale: „Feste“ ist die geläufige, würdige Bezeichnung für religiöse Festzeiten und wahrt den Plural.
- source_word: χαρμοσυνῶν
  choice: an den Freudentagen
  rationale: Das Substantiv bezeichnet freudige oder festliche Anlässe. „Freudentage“ unterscheidet sie von den unmittelbar zuvor genannten Festen und passt zur kalendarischen Aufzählung.
- source_word: οἴκου Ἰσραήλ
  choice: des Hauses Israel
  rationale: Die traditionelle biblische Wendung wird beibehalten und nicht zum bloßen „Israels“ verkürzt.
theological_decisions:
- issue: Charakter der Ausnahmen von Judiths Fasten
  choice: Judith fastete während ihres Witwenstandes gewohnheitsmäßig, jedoch nicht an den aufgezählten heiligen und freudigen Tagen.
  alternative: Die genannten Tage könnten als besondere Fastentage verstanden werden.
  rationale: χωρὶς hat hier am natürlichsten ausschließende Bedeutung. Auch der festliche Charakter der aufgezählten Zeiten spricht dafür, dass sie vom Fasten ausgenommen waren.
- issue: Wiedergabe der israelitischen Kalenderbegriffe
  choice: Die Tage vor Sabbaten und Neumonden werden beschreibend wiedergegeben.
  alternative: Technische Bezeichnungen wie „Rüsttage“ verwenden.
  rationale: Die griechischen Komposita benennen zunächst nur das zeitliche Vorausgehen. Eine spätere liturgische Fachbezeichnung würde eine nicht zwingend im Ausgangstext enthaltene Präzisierung eintragen.
- issue: Bezug von „des Hauses Israel“
  choice: Die Genitivverbindung steht unmittelbar bei den „Freudentagen“, entsprechend der griechischen Wortstellung.
  alternative: „Des Hauses Israel“ ausdrücklich auf alle genannten Feste und Freudentage beziehen.
  rationale: Die griechische Stellung lässt einen engeren Bezug auf χαρμοσυνῶν zu, während ein weiterer sachlicher Bezug möglich bleibt. Die Übersetzung bewahrt diese syntaktische Offenheit, statt sie ausdrücklich aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Aufzählung folgt eng der griechischen Reihenfolge; wiederholtes „an den“ sorgt trotz der Länge für Klarheit. Der biblische Ausdruck „Haus Israel“ bleibt bewusst erhalten.
