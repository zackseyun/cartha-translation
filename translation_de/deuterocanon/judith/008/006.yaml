  source_fidelity: Die Übersetzung gibt den Imperfekt ἐνήστευε angemessen als gewohnheitsmäßiges Fasten wieder und bewahrt den umfassenden Zeitraum „an allen Tagen ihres Witwenstandes“. χωρὶς ist zutreffend ausschließend mit „außer“ wiedergegeben. Die Reihung von Tagen vor den Sabbaten, Sabbaten, Tagen vor den Neumonden, Festen und Freudentagen folgt dem griechischen Text vollständig und ohne zusätzliche Deutung. „des Hauses Israel“ erhält die biblische Genitivfügung und lässt den im Griechischen möglichen engeren wie weiteren sachlichen Bezug offen.
  naturalness: Modernes, verständliches Standarddeutsch mit einem passenden würdigen Erzählregister. Die Wiederholung von „an den“ macht die lange Aufzählung klar und ist nicht störend. „Witwenstand“, „Feste“ und „Freudentage“ sind idiomatisch und dem Kontext angemessen.
  terminology: „Sabbate“ und „Neumonde“ sind sachgerecht im Plural wiedergegeben. Die beschreibende Übersetzung der Komposita προσαββάτων und προνουμηνιῶν vermeidet nicht gedeckte spätere Fachterminologie. Die Fußnote erklärt die parallele griechische Wortbildung zutreffend; ihr Anker nach „Neumonden“ ist als Hinweis auf die unmittelbar parallelen Formulierungen ausreichend verständlich.
