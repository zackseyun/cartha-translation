base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/021.yaml
  text: For if we are captured like this[a], all Judea will be brought low, and our holy things will be plundered[d][c][b], and he will require their profanation from our blood.
translation:
  language: de
  text: Denn wenn wir so gefangen genommen werden[a], wird ganz Judäa darniedersitzen[b]; unsere Heiligtümer werden geplündert[c], und er wird für ihre Entweihung unser Blut fordern[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn wir auf diese Weise gefangen genommen werden«. Der griechische Satzanfang ist syntaktisch ungewöhnlich; gemeint ist offenbar, dass ihre Gefangennahme in dieser Lage das folgende Unheil auslösen würde.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht hier ein Verb für »sitzen«. Das Bild kann bedeuten, dass Judäa niedergedrückt und hilflos dasitzen wird.
    reason: lexical_alternative
  - marker: c
    text: Der griechische Ausdruck kann sowohl heilige Stätten als auch heilige Gegenstände bezeichnen; auch »was uns heilig ist« wäre möglich.
    reason: lexical_alternative
  - marker: d
    text: Das Subjekt von »wird … fordern« wird im Griechischen nicht genannt. Im Zusammenhang ist wahrscheinlich Gott gemeint, der die Entweihung nicht ungestraft lässt. Die ungewöhnliche Wendung verbindet die Forderung mit ihrem Blut, ohne genau zu erklären, wie dieses Verhältnis zu verstehen ist.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ' ἐν τῷ λημφθῆναι ἡμᾶς οὕτως
  choice: Denn wenn wir so gefangen genommen werden
  rationale: Der griechische Anfang ist syntaktisch auffällig, doch λημφθῆναι ἡμᾶς bezeichnet eindeutig ihr Gefangenwerden. Die konditionale Wiedergabe passt zum argumentativen Zusammenhang und zum militärischen Szenario.
- source_word: καθήσεται
  choice: wird darniedersitzen
  rationale: Die Wiedergabe bewahrt das konkrete Bild des Verbs »sitzen«, lässt aber zugleich dessen kontextuelle Nebenbedeutung von Niedergeschlagenheit und Hilflosigkeit anklingen.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: ganz Judäa
  rationale: Ἰουδαία bezeichnet hier das Land beziehungsweise die Region, nicht die Juden als Volksgruppe.
- source_word: προνομευθήσεται
  choice: werden geplündert
  rationale: Das Futur Passiv beschreibt die gewaltsame Wegnahme durch Feinde; »plündern« ist dafür im militärischen Zusammenhang die natürliche deutsche Bezeichnung.
- source_word: τὰ ἅγια ἡμῶν
  choice: unsere Heiligtümer
  rationale: Der substantivierte Plural bezeichnet das, was ihnen heilig ist, und kann heilige Stätten wie auch heilige Gegenstände umfassen. »Heiligtümer« ist im Deutschen würdig und hinreichend weit, ohne den Ausdruck auf den einen Tempel zu verengen.
- source_word: ζητήσει
  choice: er wird … Rechenschaft fordern
  rationale: Das Verb kann ein Fordern beziehungsweise Einfordern bezeichnen. Die Formulierung bringt den gerichtlichen Sinn verständlich zum Ausdruck, ohne das im Griechischen nicht genannte Subjekt ausdrücklich als Gott zu identifizieren.
- source_word: τὴν βεβήλωσιν αὐτῶν
  choice: wegen ihrer Entweihung
  rationale: βεβήλωσις bezeichnet die Profanierung oder Schändung von Heiligem. »Entweihung« ist im modernen Deutschen präzise, geläufig und dem sakralen Zusammenhang angemessen.
- source_word: ἐκ τοῦ αἵματος ἡμῶν
  choice: von unserem Blut
  rationale: Die bewusst herbe Formulierung hält sich eng an das griechische Bild und bewahrt die Spannung, dass die geforderte Rechenschaft ihr Blut kosten wird.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ζητήσει
  choice: Das Subjekt bleibt als Pronomen »er« unausgesprochen bestimmt.
  alternative: Ausdrückliche Identifikation mit Gott oder unpersönliche Wiedergabe mit »man«.
  rationale: Das griechische Verb steht im Singular, nennt das Subjekt aber nicht. Im Zusammenhang liegt Gott nahe; die Übersetzung fügt seinen Namen dennoch nicht in den Haupttext ein und bewahrt so die formale Offenheit.
- issue: Verantwortung für die Entweihung
  choice: »wegen ihrer Entweihung von unserem Blut Rechenschaft fordern«
  alternative: »ihre Entweihung mit unserem Blut ahnden« oder »uns ihre Entweihung mit unserem Blut büßen lassen«
  rationale: Die gewählte Fassung lässt offen, wie genau Entweihung, Rechenschaft und Blut zueinander stehen, statt die schwierige Wendung vorschnell als Strafe, Sühne oder bloße Kriegsfolge festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Darniedersitzen« ist bewusst bildhaft und leicht gehoben, um das konkrete griechische Verb samt seiner übertragenen Bedeutung zu erhalten. Die Schlusswendung bleibt absichtlich herb und etwas fremd, weil auch das griechische Verhältnis zwischen Entweihung, Forderung und Blut nicht völlig explizit ist.
