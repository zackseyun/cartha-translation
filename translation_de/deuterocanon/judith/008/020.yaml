revisions:
- from: Wir aber haben keinen anderen Gott erkannt als ihn[a]. Deshalb hoffen wir, dass er weder uns noch unser Volk übersehen wird[b].
  to: Wir aber haben keinen anderen Gott außer ihm anerkannt[a]. Deshalb hoffen wir, dass er weder uns noch jemanden aus unserem Volk missachten wird[b].
  rationale: Die Revision bewahrt die exklusive Aussage des griechischen ἐπέγνωμεν mit dem im Bekenntniskontext passenden „anerkannt“. Vor allem stellt sie mit „jemanden aus unserem Volk“ die durch ἀπὸ markierte Zugehörigkeit und den im Griechischen elliptischen personalen Bezug wieder her. Die Fußnoten sind sprachlich bereinigt und behalten die lexikalischen Spielräume bei.
