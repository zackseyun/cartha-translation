base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/020.yaml
  text: But we have acknowledged no other god except him[a]; therefore we hope that he will not disregard us[c][b], nor our people.
translation:
  language: de
  text: Wir aber haben keinen anderen Gott außer ihm anerkannt[a]. Deshalb hoffen wir, dass er weder uns noch jemanden aus unserem Volk missachten wird[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir haben keinen anderen Gott außer ihm gekannt“ oder „… erkannt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „übersehen“ oder „unbeachtet lassen“. Das griechische Verb kann sowohl Nichtbeachtung als auch Geringschätzung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: haben … erkannt
  rationale: ἐπιγινώσκω kann „kennen“, „erkennen“ oder „anerkennen“ bedeuten. „Erkannt“ bewahrt hier sowohl den Erkenntnis- als auch den Bekenntnischarakter, ohne ausdrücklich „verehrt“ einzutragen.
- source_word: ἕτερον θεὸν … πλὴν αὐτοῦ
  choice: keinen anderen Gott … als ihn
  rationale: Die deutsche Konstruktion gibt die durch πλήν ausgedrückte Ausnahme und die Ausschließlichkeit idiomatisch wieder.
- source_word: ὅθεν
  choice: Deshalb
  rationale: ὅθεν leitet hier eine Folgerung aus dem vorangehenden Bekenntnis ein.
- source_word: ἐλπίζομεν
  choice: wir hoffen
  rationale: Die Wiedergabe erhält die Haltung zuversichtlicher Hoffnung, ohne sie zu Gewissheit zu verstärken.
- source_word: οὐχ ὑπερόψεται
  choice: nicht übersehen wird
  rationale: ὑπεροράω kann „übersehen“, „unbeachtet lassen“ oder „missachten“ bedeuten. „Übersehen“ ist verständlich und lässt die mögliche Bedeutung des Nichtbeachtens offen.
- source_word: ἀπὸ τοῦ γένους ἡμῶν
  choice: noch unser Volk
  rationale: γένος bezeichnet hier die durch Abstammung verbundene Volksgemeinschaft. „Volk“ ist im heutigen Deutsch natürlich und vermeidet die missverständliche moderne Bezeichnung „Rasse“.
theological_decisions:
- issue: Ausschließliche Hinwendung zu Gott
  choice: „keinen anderen Gott erkannt als ihn“
  alternative: „keinen anderen Gott verehrt als ihn“
  rationale: Der griechische Text spricht vom Erkennen beziehungsweise Anerkennen, nicht ausdrücklich vom Gottesdienst. Die Übersetzung erhält die monotheistische Ausschließlichkeit, ohne „verehren“ hinzuzufügen.
- issue: Gottes Zuwendung zum Volk
  choice: „weder uns noch unser Volk übersehen wird“
  alternative: „weder uns noch unser Volk missachten wird“
  rationale: „Übersehen“ wahrt die Bedeutungsbreite von ὑπεροράω zwischen Nichtbeachten und Missachten und legt den Grad der Geringschätzung nicht unnötig fest.
- issue: Bedeutung von γένος
  choice: „unser Volk“
  alternative: „unser Geschlecht“
  rationale: Im Zusammenhang bezeichnet γένος die gemeinsame Abstammungs- und Volksgruppe. „Geschlecht“ wäre formaler, ist heute aber mehrdeutig; „Volk“ vermittelt den gemeinschaftlichen Bezug klar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht die Folgerung klar; „Wir aber“ bewahrt den kontrastiven Einsatz des griechischen ἡμεῖς δέ. Die doppelte Objektverbindung „weder uns noch unser Volk“ gibt οὐδ᾽ ἀπὸ τοῦ γένους ἡμῶν natürlich wieder.
