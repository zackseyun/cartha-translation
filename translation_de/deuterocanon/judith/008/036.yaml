translation:
  language: de
  text: Und sie wandten sich vom Zelt ab und gingen zu ihren angewiesenen Plätzen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stellungen“, „Posten“ oder „zugewiesene Orte“. Das griechische Wort kann allgemeiner eine geordnete Einteilung oder einen angewiesenen Platz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψαντες
  choice: sie wandten sich … ab
  rationale: Das aoristische Partizip bezeichnet eine der Haupthandlung vorausgehende Bewegung vom Zelt weg. Die Beiordnung mit „und“ gibt den natürlichen Erzählfluss im Deutschen wieder, ohne eine vollständige Abreise hineinzulesen.
- source_word: σκηνῆς
  choice: vom Zelt
  rationale: σκηνή bedeutet hier im erzählerischen Zusammenhang ein Zelt, nicht das kultische Heiligtum.
- source_word: ἐπορεύθησαν
  choice: gingen
  rationale: Schlichte und natürliche Wiedergabe des gewöhnlichen Verbs der Fortbewegung.
- source_word: διατάξεις
  choice: angewiesenen Plätzen
  rationale: διάταξις kann eine geordnete Zuweisung, Stellung oder einen bestimmten Platz bezeichnen. Mit ἐπί und Akkusativ ist hier das Aufsuchen der ihnen zugewiesenen Plätze gemeint; die Fußnote bewahrt die größere Bedeutungsbreite.
- source_word: αὐτῶν
  choice: ihren
  rationale: Das Possessivpronomen bezieht sich ohne besondere Hervorhebung auf das Subjekt.
