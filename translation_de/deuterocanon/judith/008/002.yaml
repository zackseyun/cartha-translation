  text: And her husband Manasseh was from her own tribe and her own family line[a]; and he died in the days of the barley harvest.
translation:
  language: de
  text: Und ihr Mann Manasse stammte aus ihrem eigenen Stamm und ihrer eigenen Sippe[a]; er starb zur Zeit der Gerstenernte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ihrem eigenen Stamm und ihrem eigenen Vaterhaus“. Das Griechische unterscheidet zwischen φυλή („Stamm“) und πατριά, einer engeren Verwandtschaftsgruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήρ
  choice: Mann
  rationale: Mit dem Possessivpronomen αὐτῆς bezeichnet ἀνήρ hier eindeutig Judiths Ehemann; im Deutschen ist „ihr Mann“ die natürliche relationale Wiedergabe.
- source_word: Μανασσης
  choice: Manasse
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: φυλή
  choice: Stamm
  rationale: Im jüdisch-genealogischen Zusammenhang bezeichnet φυλή einen israelitischen Stamm.
- source_word: πατριά
  choice: Sippe
  rationale: πατριά bezeichnet gegenüber φυλή eine engere, durch Abstammung bestimmte Verwandtschaftsgruppe; „Sippe“ hält diese Unterscheidung knapp und verständlich fest.
- source_word: ἐν ἡμέραις
  choice: zur Zeit
  rationale: Die temporale Wendung wird in natürlichem modernem Deutsch idiomatisch wiedergegeben.
- source_word: θερισμοῦ κριθῶν
  choice: der Gerstenernte
  rationale: Der Genitiv bezeichnet die geerntete Feldfrucht; „Gerstenernte“ ist die natürliche deutsche Entsprechung.
