  text: And now[a], who are you, that you have put God to the test this day[b], and have set yourselves above God among the sons of men?
translation:
  language: de
  text: 'Und nun: Wer seid ihr, dass ihr Gott an diesem Tag auf die Probe gestellt und euch unter den Menschen[b] an Gottes Stelle gestellt habt?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte griechische Schlusswendung ist knapp und syntaktisch verkürzt. Sie kann auch „für Gott“ oder „im Namen Gottes“ bedeuten; als weitere Deutung kommt „über Gott“ in Betracht.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „inmitten der Söhne der Menschen“, eine hebräisch geprägte Wendung für die sterbliche Menschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσατε
  choice: auf die Probe gestellt habt
  rationale: πειράζω bezeichnet hier kein Verführen zum Bösen, sondern das anmaßende Prüfen Gottes. Die deutsche Wendung gibt diesen Vorwurf klar und idiomatisch wieder.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: gerade heute
  rationale: Die verstärkte griechische Zeitangabe wird durch „gerade“ hörbar gemacht, ohne im Deutschen schwerfällig zu wirken.
- source_word: ὑπεῖρ τοῦ θεοῦ
  choice: an Gottes Stelle
  rationale: Die knappe und syntaktisch schwierige Wendung beschreibt im Zusammenhang, dass die Angeredeten eine Gott zukommende Entscheidungsbefugnis beanspruchen. Da ὑπέρ auch „für“ oder „zugunsten von“ bedeuten kann und die Form zudem als „über Gott“ verstanden werden kann, wird die Mehrdeutigkeit in Fußnote [a] offengelegt.
- source_word: ἐν μέσῳ υἱῶν ἀνθρώπων
  choice: unter den Menschen
  rationale: Die hebräisch geprägte wörtliche Wendung „inmitten der Söhne der Menschen“ meint die sterbliche Menschheit. „Unter den Menschen“ ist natürliches modernes Deutsch; der Wortlaut wird in Fußnote [b] dokumentiert.
- source_word: τίνες ἐστὲ ὑμεῖς
  choice: Wer seid ihr
  rationale: Die direkte rhetorische Herausforderung bleibt ohne interpretierende Verstärkung erhalten.
theological_decisions:
- issue: Vorwurf einer Anmaßung göttlicher Befugnis
  choice: „euch … an Gottes Stelle setzt“
  alternative: „für Gott sprecht/handelt“ oder „euch über Gott stellt“
  rationale: Der Kontext legt nahe, dass die Angeredeten Gott Bedingungen setzen und damit seine Entscheidungsbefugnis für sich beanspruchen. Die griechische Formulierung bleibt jedoch mehrdeutig; deshalb wird die alternative Deutung nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Doppelpunkt trägt die scharfe rhetorische Frage. „Gerade heute“ bewahrt die Hervorhebung der griechischen Zeitangabe. Die ergänzte reflexive Verbform macht den im Griechischen stark verkürzten Schluss im Deutschen verständlich, ohne die in Fußnote [a] ausgewiesene Deutungsbreite zu verschweigen.
