lexical_decisions:
- source_word: ἦν … χηρεύουσα
  choice: lebte … als Witwe
  rationale: Die Umschreibung gibt die fortdauernde Lebenssituation natürlich wieder. Sie berücksichtigt sowohl das finite ἦν als auch das durative Partizip χηρεύουσα, ohne ἦν durch das stärker deutende „blieb“ wiederzugeben.
- source_word: Ἰουδεὶθ
  choice: Judith
  rationale: Im Deutschen gebräuchliche Namensform.
- source_word: ἐν τῷ οἴκῳ αὐτῆς
  choice: in ihrem Haus
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe; „Haus“ entspricht οἶκος enger als „Zuhause“.
- source_word: ἔτη τρία καὶ μῆνας τέσσορες
  choice: drei Jahre und vier Monate
  rationale: Die Akkusative bezeichnen die Dauer. Im Deutschen kann diese Zeitspanne ohne zusätzliche Präposition unmittelbar bei „lebte“ stehen.
