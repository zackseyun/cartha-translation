base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/003.yaml
  text: For he happened to be binding the sheaf in the field[a], and the hot wind came upon his head, and he fell onto his bed and died in Bethulia, his city. And they buried him with his fathers in the field between Dothaim and Balamon.
translation:
  language: de
  text: Denn er war gerade dabei, auf dem Feld die Garbe zu binden, als ein heißer Wind[a] über seinen Kopf kam. Da fiel er auf sein Bett und starb in Betylua, seiner Stadt. Man begrub ihn bei seinen Vätern auf dem Feld zwischen Dothaim und Balamon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die sengende Hitze«. Das griechische Wort καύσων kann sowohl brennende Hitze als auch einen sengend heißen Wind bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτύγγανε
  choice: er war gerade dabei
  rationale: Gibt den umstandsmarkierenden, beiläufigen Sinn des Verbs in natürlichem Deutsch wieder, ohne bloßes »er war« zu wählen.
- source_word: δεσμεύοντος τὸ δράγμα
  choice: die Garbe zu binden
  rationale: Das Singularobjekt τὸ δράγμα bezeichnet hier eine beim Ernten zusammengeraffte Garbe; die Wendung bleibt konkret und quellennah.
- source_word: ὁ καύσων
  choice: der Glutwind
  rationale: καύσων kann sengende Hitze oder einen heißen, austrocknenden Wind bezeichnen. »Glutwind« bewahrt den konkreten meteorologischen Sinn und lässt die alternative Deutung in der Fußnote erkennen.
- source_word: ἔπεσεν ἐπὶ τὴν κλίνην
  choice: fiel er auf sein Bett
  rationale: Entspricht der anschaulichen Formulierung des Griechischen, ohne durch »brach zusammen« die Ursache näher festzulegen.
- source_word: ἐτελεύτησεν
  choice: starb
  rationale: Direkte und natürliche Wiedergabe ohne Euphemismus.
- source_word: Βαιτυλουὰ
  choice: Betylua
  rationale: Deutsche Transliteration des griechischen Ortsnamens, in Übereinstimmung mit der in deutschsprachigen Judith-Ausgaben verbreiteten Form.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: bei seinen Vätern
  rationale: Bewahrt die traditionelle familiäre Bestattungsformel; »bei« drückt im Deutschen die Beisetzung an derselben Begräbnisstätte natürlich aus.
- source_word: ἐν τῷ ἀγρῷ τῷ ἀνὰ μέσον Δωθαεὶμ καὶ Βαλαμών
  choice: auf dem Feld zwischen Dothaim und Balamon
  rationale: Gibt die Ortsangabe knapp und genau wieder; die Eigennamen werden transliteriert.
