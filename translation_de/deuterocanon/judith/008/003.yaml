  source_fidelity: 'Die wesentlichen Inhalte werden zutreffend wiedergegeben: die Arbeit am einzelnen Garbenbündel, das Eintreten des καύσων, das Sterben in Betylua und die Bestattung zwischen Dothaim und Balamon. Der Ausdruck „traf auf seinen Kopf“ ist jedoch für ἦλθεν ἐπὶ τὴν κεφαλὴν weniger nah als „kam über seinen Kopf“ und klingt im Deutschen unpassend physisch.'
  naturalness: „Glutwind“ ist zwar verständlich, im modernen Standarddeutsch aber deutlich weniger idiomatisch als „heißer Wind“. Auch „kam über seinen Kopf“ verbindet sich in diesem erzählerischen Kontext natürlicher als „traf auf seinen Kopf“.
