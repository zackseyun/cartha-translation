  text: But the people became very thirsty[a], and they compelled us to do as we had said to them, and to bring upon ourselves an oath that we will not break.
translation:
  language: de
  text: Aber das Volk wurde sehr durstig, und die Leute zwangen uns, so zu handeln, wie sie es ihnen gesagt hatten, und uns einen Eid aufzuerlegen[a], den wir nicht brechen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und uns durch einen Eid zu binden“. Wörtlich heißt es im Griechischen: „einen Eid über uns zu bringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησεν σφόδρα
  choice: bekam großen Durst
  rationale: Der Aorist mit σφόδρα bezeichnet einsetzenden beziehungsweise akut gewordenen starken Durst. Die Formulierung ist natürlich und gibt die Intensität wieder.
- source_word: ἠνάγκασαν
  choice: die Leute zwangen uns
  rationale: Das Verb bezeichnet starken Zwang. Der Wechsel von dem grammatisch singularischen Kollektiv ὁ λαός zum pluralischen Verb wird im Deutschen durch die Wiederaufnahme mit „die Leute“ verständlich gemacht.
- source_word: ποιῆσαι ἡμᾶς καθὰ ἐλάλησαν αὐτοῖς
  choice: so zu handeln, wie wir es ihnen gesagt hatten
  rationale: Der überlieferte griechische Wortlaut ist syntaktisch auffällig, da ἐλάλησαν „sie sagten“ bedeutet, der Zusammenhang aber auf die vorausgegangene Erklärung der Sprecher gegenüber dem Volk verweist. Die Übersetzung gibt diesen kontextuell geforderten Bezug wieder, ohne aus „sagen“ ein ausdrückliches „versprechen“ zu machen.
- source_word: ἐπαγαγεῖν ἐφʼ ἡμᾶς ὅρκον
  choice: uns einen Eid aufzuerlegen
  rationale: Die Formulierung bewahrt das Bild, einen Eid über beziehungsweise auf sich selbst zu bringen, und bleibt im Deutschen verständlich. Die idiomatischere Deutung „uns durch einen Eid zu binden“ steht in der Fußnote.
- source_word: ὃν οὐ παραβησόμεθα
  choice: den wir nicht brechen werden
  rationale: Bei einem Eid bedeutet παραβαίνω, ihn zu übertreten oder zu verletzen. „Einen Eid brechen“ ist die klare, übliche deutsche Wendung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt ernst und direkt; die auffällige Numerusverschiebung beim Kollektiv „Volk“ wird natürlich wiedergegeben. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die Anmerkung bezieht.
