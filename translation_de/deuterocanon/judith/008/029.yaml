    issue: „Verstand“ für σύνεσις
    rationale: „Verstand“ kann im Deutschen vor allem die allgemeine intellektuelle Fähigkeit bezeichnen. „Einsicht“ trifft σύνεσις als Verständnis, Urteilsvermögen und erkennbare verständige Haltung im vorliegenden Kontext präziser.
  - severity: low
    issue: Stil der Fußnoteneinleitung
    rationale: „Auch wörtlich:“ ist im Deutschen glatter als „Wörtlicher auch:“ und kennzeichnet die angebotene formnähere Wiedergabe klar.
