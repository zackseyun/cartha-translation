- from: Denn deine Weisheit ist nicht erst heute offenkundig geworden; vielmehr kennt das ganze Volk deinen Verstand schon seit deinen frühesten Tagen, weil die Ausrichtung deines Herzens gut ist.[a]
  to: Denn deine Weisheit ist nicht erst heute offenkundig geworden; vielmehr kennt das ganze Volk deine Einsicht schon seit deinen frühesten Tagen, weil die Ausrichtung deines Herzens gut ist.[a]
  rationale: 'Die Übersetzung wird nur behutsam überarbeitet: „Einsicht“ stellt die semantische Unterscheidung von σύνεσις gegenüber σοφία besser dar. Die Fußnote bleibt am Satz über πλάσμα τῆς καρδίας verankert und bewahrt die lexikalische Offenheit der griechischen Bildsprache.'
