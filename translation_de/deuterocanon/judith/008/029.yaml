base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/029.yaml
  text: For your wisdom did not become evident only today; rather[a], from the beginning of your days all the people have known your understanding, because the disposition of your heart is good.
translation:
  language: de
  text: Denn deine Weisheit ist nicht erst heute offenkundig geworden; vielmehr kennt das ganze Volk deine Einsicht schon seit deinen frühesten Tagen, weil die Ausrichtung deines Herzens gut ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch wörtlich: „weil das Gebilde deines Herzens gut ist“; gemeint sein kann die innere Prägung oder Neigung des Herzens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐν τῇ σήμερον ἡ σοφία σου πρόδηλός ἐστιν
  choice: deine Weisheit ist nicht erst heute offenkundig geworden
  rationale: 'Die Formulierung gibt den zeitlichen Gegensatz idiomatisch wieder: Judiths Weisheit zeigt sich nicht erst am heutigen Tag, sondern ist seit Langem bekannt. „Offenkundig“ entspricht πρόδηλος, während „geworden“ den im Zusammenhang liegenden Beginn des Bekanntwerdens ausdrückt.'
- source_word: ἀλλʼ ἀπʼ ἀρχῆς ἡμερῶν σου
  choice: vielmehr ... schon seit deinen frühesten Tagen
  rationale: Die griechische Wendung bedeutet wörtlich „vom Anfang deiner Tage an“. „Seit deinen frühesten Tagen“ ist im modernen Deutschen natürlich und bewahrt den Bezug auf ihr frühes Leben.
- source_word: ἔγνω πᾶς ὁ λαὸς
  choice: kennt das ganze Volk
  rationale: Der griechische Aorist bezeichnet hier ein seit Langem bestehendes Erkennen. Das deutsche Präsens zusammen mit „schon seit“ drückt die bis zur Gegenwart fortdauernde Bekanntheit natürlich aus.
- source_word: τὴν σύνεσίν σου
  choice: deinen Verstand
  rationale: σύνεσις bezeichnet Einsicht, Verständnis oder Urteilsvermögen. „Verstand“ unterscheidet den Begriff von der zuvor genannten „Weisheit“ und ist allgemein verständlich.
- source_word: καθότι
  choice: weil
  rationale: Die Konjunktion führt den Grund dafür an, dass das Volk ihren Verstand kennt.
- source_word: τὸ πλάσμα τῆς καρδίας σου
  choice: die Ausrichtung deines Herzens
  rationale: πλάσμα bezeichnet wörtlich etwas Geformtes oder Gebildetes und hier wohl die innere Prägung oder Neigung des Herzens. „Ausrichtung“ bewahrt diesen Sinn in verständlichem Deutsch; die wörtlichere Bildsprache wird in der Fußnote genannt.
- source_word: ἀγαθόν
  choice: gut
  rationale: „Gut“ gibt die allgemeine moralische Wertung des griechischen Adjektivs unmittelbar und ohne zusätzliche Deutung wieder.
theological_decisions:
- issue: Anthropologische Rede vom Herzen
  choice: „Herz“ wird in „die Ausrichtung deines Herzens“ beibehalten.
  alternative: „deine innere Haltung“ oder „die Ausrichtung deines Sinnes“
  rationale: Im biblischen Sprachgebrauch bezeichnet das Herz das Zentrum des Denkens, Wollens und der sittlichen Haltung. Die Beibehaltung wahrt das Ausgangsbild, während „Ausrichtung“ dessen Bedeutung erschließt.
- issue: Zeitliche Reichweite der bekannten Einsicht Judiths
  choice: Die Aussage wird als seit den frühesten Tagen bestehende und bis zur Gegenwart bekannte Eigenschaft wiedergegeben.
  alternative: 'Ein punktuelles Erkennen in der Vergangenheit: „Das ganze Volk erkannte ...“'
  rationale: Der Zusammenhang stellt das heutige Offenbarwerden einer schon lange bekannten Weisheit gegenüber. Das Präsens mit „schon seit“ bildet diese fortdauernde Geltung im Deutschen klar ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobenen Wörter „offenkundig“ und „vielmehr“ entsprechen dem feierlichen Kontext, bleiben aber allgemein verständlich. Der Fußnotenmarker steht unmittelbar nach der Aussage, auf die er sich bezieht.
