base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/005.yaml
  text: And she made for herself a tent on the roof of her house[a], and put sackcloth around her waist[b], and the garments of her widowhood were upon her.
translation:
  language: de
  text: Und sie richtete sich auf dem Flachdach ihres Hauses ein Zelt auf[a], legte sich Sacktuch um die Hüften[b] und trug die Kleider ihres Witwenstandes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet hier die begehbare flache Dachfläche des Hauses.
    reason: lexical_alternative
  - marker: b
    text: Sacktuch war ein grober Stoff, der als Zeichen von Trauer, Kummer oder Demütigung getragen wurde.
    reason: cultural_note
lexical_decisions:
- source_word: σκηνήν
  choice: Zelt
  rationale: σκηνή bezeichnet gewöhnlich ein Zelt oder eine vorübergehend errichtete Unterkunft. „Zelt“ gibt den konkreten Bildgehalt direkt wieder, ohne die Bauart näher festzulegen.
- source_word: ἐπὶ τοῦ δώματος τοῦ οἴκου αὐτῆς
  choice: auf dem Flachdach ihres Hauses
  rationale: δῶμα bezeichnet hier die begehbare, flache Dachfläche des Hauses. „Flachdach“ macht den antiken architektonischen Zusammenhang für heutige Leser unmittelbar verständlich.
- source_word: σάκκον
  choice: Sacktuch
  rationale: σάκκος meint grobes Gewebe, das als Zeichen von Trauer, Demütigung oder Buße getragen wurde. Der etablierte biblische Ausdruck „Sacktuch“ bewahrt diese kulturelle Bedeutung.
- source_word: ἐπὶ τὴν ὀσφὺν αὐτῆς
  choice: um die Hüften
  rationale: ὀσφύς bezeichnet Hüfte beziehungsweise Lenden. In Verbindung mit dem Anlegen eines Stoffes ist „um die Hüften“ natürliches modernes Deutsch.
- source_word: τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: die Kleider ihres Witwenstandes
  rationale: Die Formulierung bewahrt die Verbindung der Kleidung mit Judiths fortdauerndem Status als Witwe und vermeidet die engere Deutung als bloße „Trauerkleider“.
- source_word: ἦν ἐπʼ αὐτῆς
  choice: trug
  rationale: Die wörtliche Zustandsaussage „waren auf ihr“ wird im Deutschen idiomatisch mit „trug“ wiedergegeben; der Aussagegehalt bleibt erhalten, ohne unnatürliche Syntax.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am griechischen Text; idiomatische Verben wie „richtete … auf“ und „trug“ vermeiden zugleich steife Gräzismen. „Witwenstand“ erhält die formelle und statusbezogene Nuance des Originals.
