    rationale: „So aber war es in früheren Tagen“ steht nach dem gegenwartsbezogenen Nachsatz und kann sich daher missverständlich auf die heutige Verneinung beziehen. καθάπερ ἐγένετο ἐν ταῖς πρότερον ἡμέραις bezieht sich auf das frühere Geschehen des Götzendienstes und sollte direkt bei der Anbetungsaussage stehen.
  - severity: medium
    issue: „Volksgemeinschaft“ als Wiedergabe von δῆμος
    rationale: Das Wort ist im modernen Deutschen historisch-ideologisch stark belastet und daher nicht neutral. Der griechische Ausdruck verlangt diese Konnotation nicht.
  - severity: low
    issue: Unvollständige Koordination der negierten Aufzählung
    rationale: „weder ... noch ..., eine Volksgemeinschaft oder eine Stadt“ hebt die vollständige griechische Reihung weniger klar hervor. Eine einheitliche Negationsreihe macht alle vier Einheiten eindeutig sichtbar.
