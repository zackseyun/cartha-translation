  verdict: revise
  source_fidelity: Die Grundbedeutung wird getroffen, doch die Stellung von „So aber war es in früheren Tagen“ macht den griechischen Vergleich unnötig unklar und kann so klingen, als beziehe er sich auf das Nichtvorhandensein solcher Gruppen. Im Griechischen bezeichnet er das frühere Vorkommen des Götzendienstes. Außerdem sollte die viergliedrige Negationsreihe vollständig und klar koordiniert werden.
  naturalness: „Volksgemeinschaft“ ist im heutigen deutschen Sprachgebrauch wegen seiner starken historischen und ideologischen Belastung keine unmarkierte, natürliche Wiedergabe von δῆμος. „Bevölkerungsgruppe“ ist hier neutraler. Die überarbeitete Satzfolge ist klarer und bewahrt den Vergleich an seiner syntaktischen Bezugsstelle.
  terminology: „Stamm“, „Sippe“ und „Stadt“ geben die sozialen Einheiten angemessen wieder. „von Menschenhand gemachte Götter“ bewahrt die absichtlich polemische Formulierung θεοὶ χειροποίητοι; die Fußnote erläutert die mögliche Wiedergabe als „Götzen“, ohne diese in den Haupttext zu verlagern.
