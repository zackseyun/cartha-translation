revisions:
- from: Denn in unseren Generationen ist aus unserer Mitte weder ein Stamm noch eine Sippe, eine Volksgemeinschaft oder eine Stadt hervorgetreten, die von Menschenhand gemachte Götter[a] anbeten; auch am heutigen Tag gibt es keine. So aber war es in früheren Tagen.
  to: Denn in unseren Generationen ist aus unserer Mitte weder ein Stamm noch eine Sippe noch eine Bevölkerungsgruppe noch eine Stadt hervorgetreten, die von Menschenhand gemachte Götter[a] anbeten, wie es in früheren Tagen geschah; auch heute gibt es keine solchen.
  rationale: Die Revision stellt die vollständige soziale Aufzählung klar, ersetzt den belasteten Ausdruck „Volksgemeinschaft“ durch die neutrale Wiedergabe „Bevölkerungsgruppe“ und bindet den Vergleich mit den früheren Tagen unmittelbar an den Götzendienst. Der zusätzliche Gegenwartsnachsatz bleibt als ausdrückliche Verstärkung von οὐδὲ ἔστιν ἐν τῇ ἡμέρᾳ τῇ σήμερον erhalten.
