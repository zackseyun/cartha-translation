base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/018.yaml
  text: For in our generations no tribe or clan or people or city has arisen from among us that worships gods made by hands[a], as happened in former days; nor is there any even to this day.
translation:
  language: de
  text: Denn in unseren Generationen ist aus unserer Mitte weder ein Stamm noch eine Sippe noch eine Bevölkerungsgruppe noch eine Stadt hervorgetreten, die von Menschenhand gemachte Götter[a] anbeten, wie es in früheren Tagen geschah; auch heute gibt es keine solchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „handgemachte Götzen“. Wörtlich steht im Griechischen: „von Händen gemachte Götter“, eine polemische Bezeichnung für Götzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστη
  choice: ist hervorgetreten
  rationale: Das metaphorisch gebrauchte Verb bezeichnet hier das Auftreten einer Gruppe innerhalb Israels, nicht ein leibliches Aufstehen.
- source_word: ἐν ταῖς γενεαῖς ἡμῶν
  choice: in unseren Generationen
  rationale: Die direkte Wiedergabe bewahrt den Bezug auf die aufeinanderfolgenden Generationen der eigenen Gemeinschaft.
- source_word: φυλὴ ... πατριὰ ... δῆμος ... πόλις
  choice: Stamm ... Sippe ... Volksgemeinschaft ... Stadt
  rationale: Die Reihe unterschiedlicher sozialer Einheiten bleibt erhalten; „Volksgemeinschaft“ gibt δῆμος hier als Gemeinschaft von Menschen wieder, ohne es vorschnell als technischen Verwaltungsbegriff festzulegen.
- source_word: ἐξ ἡμῶν
  choice: aus unserer Mitte
  rationale: Die Formulierung macht den Ursprung innerhalb der eigenen Gemeinschaft natürlich und präzise deutlich.
- source_word: οἱ προσκυνοῦσι
  choice: die ... anbeten
  rationale: Im Zusammenhang mit Göttern ist die religiöse Bedeutung von προσκυνέω maßgeblich.
- source_word: θεοῖς χειροποιήτοις
  choice: von Menschenhand gemachte Götter
  rationale: Die polemische, wörtliche Ausdrucksweise des Griechischen bleibt erhalten; „von Menschenhand“ verdeutlicht idiomatisch, wessen Hände gemeint sind.
- source_word: οὐδὲ ἔστιν ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: auch am heutigen Tag gibt es keine
  rationale: Die ausdrücklich gegenwartsbezogene Verstärkung wird bewahrt; das feminine „keine“ nimmt die zuletzt genannte Reihe sozialer Einheiten zusammenfassend auf.
- source_word: καθάπερ ἐγένετο ἐν ταῖς πρότερον ἡμέραις
  choice: So aber war es in früheren Tagen
  rationale: Die Klausel verweist auf den früheren Zustand des Götzendienstes. Ihre Nachstellung erhält den Kontrast, ohne sie fälschlich nur auf den unmittelbar vorausgehenden Gegenwartssatz zu beziehen.
theological_decisions:
- issue: Wiedergabe von θεοῖς χειροποιήτοις
  choice: von Menschenhand gemachte Götter
  alternative: von Menschen gemachte Götzenbilder
  rationale: Die gewählte Fassung bewahrt die theologische Ironie und lexikalische Transparenz des Ausdrucks „Götter, die mit Händen gemacht sind“; „Götzenbilder“ wäre deutlicher interpretierend.
- issue: Bezug der Aussage auf frühere und gegenwärtige Generationen
  choice: Vergangenheit und ausdrückliche Gegenwart beide wiedergeben
  alternative: die Aussage zu einer einzigen allgemeinen Behauptung zusammenziehen
  rationale: Der griechische Text enthält sowohl οὐκ ἀνέστη für das bisherige Auftreten als auch οὐδὲ ἔστιν für den heutigen Zustand; diese Spannung und Verstärkung sollen sichtbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die soziale Aufzählung und die polemisch wörtliche Rede von gemachten „Göttern“ bleiben erhalten. Die Satzstellung wurde behutsam gegliedert, damit der Vergangenheits- und Gegenwartsbezug verständlich bleibt.
