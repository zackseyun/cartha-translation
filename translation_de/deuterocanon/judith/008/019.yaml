lexical_decisions:
- source_word: ὧν χάριν
  choice: Aus diesem Grund
  rationale: Gibt die kausale Wendung idiomatisch und klar wieder und wahrt ihren rückbezüglichen Charakter.
- source_word: ἐδόθησαν
  choice: wurden … preisgegeben
  rationale: Bewahrt das Passiv und bezeichnet die Auslieferung an feindliche Gewalt beziehungsweise Verderben.
- source_word: εἰς ῥομφαίαν
  choice: dem Schwert
  rationale: Die feste biblische Wendung bezeichnet gewaltsamen Tod durch das Schwert.
- source_word: εἰς διαρπαγήν
  choice: der Plünderung
  rationale: Bewahrt die substantivische Parallelstruktur und bezeichnet das Ausrauben beziehungsweise die Beute.
- source_word: οἱ πατέρες ἡμῶν
  choice: unsere Väter
  rationale: Entspricht der ausdrücklich maskulinen, geschichtlich-ancestralen Ausdrucksweise des Griechischen.
- source_word: ἔπεσον
  choice: sie fielen
  rationale: Bewahrt das verbreitete biblische Bild für das Sterben im Kampf.
- source_word: πτῶμα μέγα
  choice: in einem großen Blutbad
  rationale: Vermittelt den kontextuellen Sinn einer großen Zahl Erschlagener in natürlichem Deutsch; die ungewöhnliche wörtliche Bildlichkeit wird in der Fußnote kenntlich gemacht.
- source_word: ἐνώπιον τῶν ἐχθρῶν ἡμῶν
  choice: vor unseren Feinden
  rationale: Ist die natürliche und zugleich formelle deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe der männlichen Ahnenbezeichnung
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die traditionelle geschichtliche Redeweise Israels und die grammatisch ausdrücklich männliche Form werden beibehalten, ohne den Ausdruck zu neutralisieren.
- issue: Deutung von πτῶμα μέγα
  choice: sie fielen in einem großen Blutbad
  alternative: sie fielen als eine große Masse von Erschlagenen
  rationale: Die verdichtete griechische Formulierung bezeichnet im Kontext ein massenhaftes Sterben. Die gewählte Fassung ist verständlich, ohne eine zusätzliche theologische Deutung einzutragen; die wörtlichere Bildlichkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblisch geprägten Wendungen. »Preisgegeben« wahrt das Passiv ohne unnatürliche Formulierung; »Blutbad« macht den Schlachtkontext verständlich, während die Fußnote die ungewöhnliche griechische Ausdrucksweise dokumentiert.
