base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/028.yaml
  text: And Ozias said to her[a], “Everything you have said, you have spoken with a good heart, and there is no one who will oppose your words.”
translation:
  language: de
  text: 'Und Usija sagte zu ihr: »Alles, was du gesagt hast, hast du mit aufrichtigem Herzen[a] gesprochen, und niemand wird deinen Worten widersprechen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit gutem Herzen“; gemeint ist eine gute, aufrichtige innere Haltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθῇ καρδίᾳ
  choice: mit gutem Herzen
  rationale: Die griechische Wendung wird unter Beibehaltung des Bildes vom Herzen wiedergegeben. Sie bezeichnet eine gute, aufrichtige innere Haltung und nicht nur geschicktes Reden.
- source_word: ἐλάλησας
  choice: hast du ... gesprochen
  rationale: Die Wiedergabe unterscheidet das Verb von dem vorausgehenden εἶπας („du gesagt hast“) und bewahrt zugleich den Rückbezug auf Judits soeben gehaltene Rede.
- source_word: ἀντιστήσεται
  choice: wird ... widersprechen
  rationale: Im Zusammenhang bezeichnet das Verb Widerstand gegen Judits Worte. „Widersprechen“ ist dafür im modernen Deutschen präzise und natürlich.
- source_word: τοῖς λόγοις σου
  choice: deinen Worten
  rationale: Die Wiedergabe bewahrt den Plural und den ausdrücklichen Bezug auf Judits Äußerungen.
- source_word: Πάντα ὅσα εἶπας
  choice: Alles, was du gesagt hast
  rationale: Dies gibt die umfassende Aussage des griechischen Ausdrucks klar und idiomatisch wieder.
- source_word: Ὀζείας
  choice: Usija
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform ist für Leser verständlicher als eine unmittelbare Umschrift der griechischen Form.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „gesagt“ und „gesprochen“ bildet die beiden unterschiedlichen griechischen Verben ab. Die idiomatische Herzensmetapher bleibt erhalten; eine Fußnote ist nicht nötig, da „mit gutem Herzen“ im Deutschen verständlich ist.
