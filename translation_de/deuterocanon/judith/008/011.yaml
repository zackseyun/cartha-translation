base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/011.yaml
  text: And they came to her[a], and she said to them, “Listen to me, rulers of those who dwell in Bethulia, for your word that you spoke against the people on this day is not right, and you have set up the oath that you spoke between God and yourselves, and said that you would hand over the city to our enemies if within these days the Lord does not turn back to help you.”
translation:
  language: de
  text: 'Und sie kamen zu ihr. Da sagte sie zu ihnen: »Hört mich doch an, ihr Oberhäupter der Bewohner Betulias! Was ihr heute vor dem Volk[a] gesagt habt, ist nicht recht. Ihr habt einen Eid zwischen Gott und euch festgesetzt und erklärt, die Stadt unseren Feinden auszuliefern, wenn der Herr euch nicht innerhalb dieser Tage[b] wieder Hilfe bringt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen das Volk«.'
    reason: ἐναντίον kann sowohl »vor/in Gegenwart von« als auch »gegen« bedeuten.
  - marker: b
    text: 'Wörtlich: »in ihnen«; gemeint sind wahrscheinlich die zuvor festgelegten Tage der Frist.'
    reason: Das griechische Pronomen steht ohne ausdrückliches Bezugswort und verweist dem Zusammenhang nach auf die Tage des Eides.
lexical_decisions:
- source_word: ἄρχοντες
  choice: Oberhäupter
  rationale: Bezeichnet die Männer mit leitender und entscheidender Autorität in Betulia; »Oberhäupter« ist würdevoll und vermeidet den monarchischen Beiklang von »Fürsten«.
- source_word: τῶν κατοικούντων ἐν Βαιτυλουά
  choice: der Bewohner Betulias
  rationale: Gibt die Zugehörigkeit zu den in Betulia Wohnenden knapp und natürlich wieder.
- source_word: οὐκ εὐθὺς ὁ λόγος ὑμῶν
  choice: Was ihr … gesagt habt, ist nicht recht
  rationale: εὐθύς bedeutet wörtlich »gerade«, bezeichnet hier aber die moralische Richtigkeit; die Satzform ist im Deutschen natürlicher als »euer Wort ist nicht recht«.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: vor dem Volk
  rationale: ἐναντίον kann räumlich »vor, in Gegenwart von« oder gegensätzlich »gegen« bedeuten. Mit ἐλαλήσατε ist die öffentliche Äußerung vor dem Volk eine naheliegende Lesart; die andere Möglichkeit bleibt in der Fußnote sichtbar.
- source_word: ἐστήσατε τὸν ὅρκον
  choice: ihr habt einen Eid … festgesetzt
  rationale: Bewahrt den Gedanken, dass der Eid verbindlich aufgestellt bzw. festgelegt wurde, in natürlichem modernem Deutsch.
- source_word: ἀνὰ μέσον τοῦ θεοῦ καὶ ὑμῶν
  choice: zwischen Gott und euch
  rationale: Gibt die wechselseitige Bindung des Eides unmittelbar wieder.
- source_word: ἐκδώσειν τὴν πόλιν
  choice: die Stadt … auszuliefern
  rationale: ἐκδίδωμι bezeichnet hier die Übergabe beziehungsweise Preisgabe der Stadt an den Feind.
- source_word: ἐὰν μὴ ἐν αὐταῖς
  choice: wenn … nicht innerhalb dieser Tage
  rationale: Das feminine Pluralpronomen verweist wahrscheinlich auf die zuvor festgelegte Frist von Tagen; diese Ergänzung wird in der Fußnote offengelegt.
- source_word: ἐπιστρέψῃ ὁ κύριος βοήθειαν ὑμῖν
  choice: wenn der Herr euch nicht … wieder Hilfe bringt
  rationale: Gibt die gedrängte griechische Verbindung verständlich wieder und bewahrt mit »wieder« den Rückkehrgedanken von ἐπιστρέφω.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: der Gebieter
  rationale: Im jüdisch-schriftlichen Kontext bezeichnet κύριος Gott; »der Herr« ist die sachgerechte und geläufige deutsche Wiedergabe.
- issue: Verhältnis der Äußerung zum Volk
  choice: vor dem Volk
  alternative: gegen das Volk
  rationale: Die Präposition ἐναντίον lässt beide Bedeutungen zu. Der Haupttext versteht die Wendung als öffentliche Rede in Gegenwart des Volkes; die mögliche anklagende Nuance wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt feierlich, aber verständlich; griechische Wiederholungen werden dort geglättet, wo eine wörtliche Nachbildung im Deutschen schwerfällig wäre. Echte Mehrdeutigkeiten werden durch Fußnoten offengehalten.
