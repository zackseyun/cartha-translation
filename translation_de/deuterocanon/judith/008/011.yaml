  source_fidelity: 'Die Übersetzung gibt die Satzfolge und den Sinn des griechischen Textes zuverlässig wieder: Ankunft der Männer, Judiths Anrede an die Amtsträger, ihre Kritik an deren Erklärung, der zwischen Gott und ihnen festgesetzte Eid sowie die angekündigte Auslieferung der Stadt. »wieder Hilfe bringt« gibt die gedrängte Verbindung ἐπιστρέψῃ … βοήθειαν angemessen als Rückkehr bzw. erneute Zuwendung von Hilfe wieder.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Anrede »Hört mich doch an« und die anschließenden kurzen Sätze sind idiomatisch und dem Kontext angemessen. »Oberhäupter« ist leicht gehoben, aber für öffentliche städtische Amtsträger in einer Schriftübersetzung gut vertretbar.
  terminology: »der Herr« für κύριος, »auszuliefern« für ἐκδώσειν und »Eid … festgesetzt« für ἐστήσατε τὸν ὅρκον sind sachgerecht. Die Namensform »Betulia« ist im deutschen Bibelgebrauch etabliert. Die bei ἐναντίον und ἐν αὐταῖς vorhandenen Mehrdeutigkeiten werden angemessen durch Fußnoten kenntlich gemacht.
