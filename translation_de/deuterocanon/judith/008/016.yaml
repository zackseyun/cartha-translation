base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/016.yaml
  text: But do not hold the plans of the Lord our God as security[a], for God is not like a man, to be threatened, nor like a son of man[b], to be persuaded.
translation:
  language: de
  text: Ihr aber sollt die Pläne des Herrn, unseres Gottes, nicht zum Pfand nehmen[a]. Denn Gott ist nicht wie ein Mensch, den man bedrohen könnte, und auch nicht wie ein Menschensohn[b], den man überreden könnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht als Pfand einsetzen / nicht verpfänden“. Im Griechischen steht ein Ausdruck aus dem Bereich von Pfand und Sicherheit.'
    reason: lexical_alternative
  - marker: b
    text: „Menschensohn“ ist hier eine semitisch geprägte Bezeichnung für einen Menschen, kein messianischer Titel.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνεχυράζετε
  choice: zum Pfand nehmen
  rationale: Das Verb gehört in den Bedeutungsbereich von Pfand und Sicherheit. Die Formulierung bewahrt dieses konkrete Bild und lässt zugleich erkennen, dass Gottes Pläne nicht menschlichen Bedingungen oder Fristen unterworfen werden dürfen.
- source_word: βουλάς
  choice: Pläne
  rationale: βουλή kann Rat, Absicht oder Plan bezeichnen. „Pläne“ ist im heutigen Deutsch klar und passt hier zu Gottes beabsichtigtem Handeln.
- source_word: κυρίου τοῦ θεοῦ ἡμῶν
  choice: des Herrn, unseres Gottes
  rationale: Die Wiedergabe erhält κύριος als „Herr“ und gibt die nähere Bestimmung τοῦ θεοῦ ἡμῶν in natürlichem Deutsch appositionell wieder.
- source_word: ἀπειληθῆναι
  choice: den man bedrohen könnte
  rationale: Der passive Infinitiv bedeutet unmittelbar „bedroht werden“. Die Konstruktion mit „könnte“ drückt idiomatisch aus, dass Gott anders als ein Mensch nicht durch Drohungen unter Druck gesetzt werden kann.
- source_word: διαπεισθῆναι
  choice: den man überreden könnte
  rationale: Das Verb bezeichnet das Überreden oder Umstimmen. „Überreden“ wahrt die Parallele zu „bedrohen“ und die Aussage, dass Gott nicht durch menschliche Einflussnahme gelenkt werden kann.
- source_word: υἱὸς ἀνθρώπου
  choice: Menschensohn
  rationale: Die formnahe Wiedergabe erhält den Parallelismus mit „Mensch“. Eine Fußnote erklärt, dass die Wendung hier allgemein einen Menschen bezeichnet und nicht als messianischer Titel gebraucht wird.
theological_decisions:
- issue: Anthropomorpher Gegensatz zwischen Gott und Mensch
  choice: Die Aussage verneint, dass Gott wie ein Mensch durch Drohung oder Überredung beeinflusst werden kann.
  alternative: 'Dynamischer: „Gott ist kein Mensch, den man bedrohen oder manipulieren kann.“'
  rationale: Der griechische Text stellt Gott ausdrücklich „einem Menschen“ und „einem Menschensohn“ gegenüber und verwendet zwei parallele passive Infinitive. Die Übersetzung bewahrt diesen Gegensatz, ohne ihn zu einer weitergehenden dogmatischen Aussage auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zum Pfand nehmen“ bewahrt bewusst das ungewöhnliche Bild des griechischen Textes; die Relativsätze mit „könnte“ geben die passiven Infinitive natürlich wieder. Der parallele Ausdruck „Menschensohn“ bleibt im Haupttext erhalten und wird in der Fußnote eingeordnet.
