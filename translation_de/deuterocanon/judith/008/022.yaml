- from: und das Blutvergießen unter unseren Brüdern[a], die Gefangenschaft des Landes und die Verwüstung unseres Erbes wird er auf unser eigenes Haupt zurückfallen lassen unter den Völkern, wo wir als Sklaven dienen werden[b]; und wir werden denen, die uns besitzen, zum Anstoß und zur Schande werden.
  to: und die Tötung unserer Brüder[a], die Gefangenschaft des Landes und die Verwüstung unseres Erbes wird er auf unser eigenes Haupt zurückwenden unter den Völkern, wo immer wir dort als Sklaven dienen werden[b]; und wir werden vor denen, die uns besitzen, zum Anstoß und zur Schande werden.
