base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/022.yaml
  text: and the slaughter of our brothers[a], and the captivity of the land, and the desolation of our inheritance, will return upon our own heads among the nations where we will serve as servants there[b]; and we will become a stumbling block and a reproach before those who possess us.
translation:
  language: de
  text: und die Tötung unserer Brüder[a], die Gefangenschaft des Landes und die Verwüstung unseres Erbes wird er auf unser eigenes Haupt zurückwenden unter den Völkern, wo immer wir dort als Sklaven dienen werden[b]; und wir werden vor denen, die uns besitzen, zum Anstoß und zur Schande werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Blutvergießen an unseren Brüdern“. Das griechische Wort kann Töten oder Blutvergießen bezeichnen, ohne den engeren juristischen Sinn von „Mord“ festzulegen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wo immer wir dort dienen werden“. Das griechische Verb kann allgemein „dienen“ bedeuten; im Zusammenhang der Gefangenschaft liegt jedoch Sklavendienst nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόνον
  choice: Blutvergießen
  rationale: Der Ausdruck bezeichnet Töten oder vergossenes Blut. „Blutvergießen“ bewahrt die Gewaltsamkeit, ohne den engeren juristischen Sinn von „Mord“ festzulegen.
- source_word: ἀδελφῶν
  choice: Brüdern
  rationale: Die grammatisch maskuline Pluralform wird gewahrt; im Zusammenhang kann sie zugleich die israelitischen Volksgenossen bezeichnen.
- source_word: αἰχμαλωσίαν τῆς γῆς
  choice: die Gefangenschaft des Landes
  rationale: Die formal auffällige Verbindung bleibt erhalten und wird nicht stillschweigend zu „Gefangenschaft der Bewohner“ oder „Besetzung des Landes“ umgedeutet.
- source_word: ἐρήμωσιν τῆς κληρονομίας ἡμῶν
  choice: die Verwüstung unseres Erbes
  rationale: „Verwüstung“ gibt das Zugrunderichten des Landes wieder; „Erbe“ wahrt den möglichen heilsgeschichtlichen Klang von κληρονομία.
- source_word: ἐπιστρέψει εἰς κεφαλὴν ἡμῶν
  choice: wird er auf unser eigenes Haupt zurückfallen lassen
  rationale: Das singuläre Verb wird mit einem nicht näher benannten „er“ wiedergegeben. Die Vergeltungsmetapher des Zurückkehrens auf das eigene Haupt bleibt erhalten.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: Die Wiedergabe ist im Kontext von Fremdherrschaft natürlich und vermeidet die stärker religiös markierte Festlegung auf „Heiden“.
- source_word: δουλεύσωμεν
  choice: als Sklaven dienen werden
  rationale: δουλεύω kann „dienen“ heißen, bezeichnet hier im Zusammenhang mit Gefangenschaft jedoch wahrscheinlich erzwungenen Sklavendienst.
- source_word: πρόσκομμα
  choice: Anstoß
  rationale: „Anstoß“ erhält die Stolpermetapher in einer idiomatischen und würdigen deutschen Form.
- source_word: ὄνειδος
  choice: Schande
  rationale: Der Ausdruck bezeichnet Schmach beziehungsweise einen Gegenstand des Spottes; „Schande“ ist im Deutschen klar und prägnant.
- source_word: κτωμένων ἡμᾶς
  choice: denen, die uns besitzen
  rationale: Die Formulierung bleibt nahe am Partizip von κτάομαι und bewahrt die harte Besitz- und Versklavungsbildlichkeit.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐπιστρέψει
  choice: „wird er … zurückfallen lassen“, ohne „er“ ausdrücklich als Gott zu identifizieren
  alternative: „wird … auf unser Haupt zurückfallen“ beziehungsweise ausdrücklich „wird Gott … zurückfallen lassen“
  rationale: Der griechische Text hat ein Verb im Singular, nennt in diesem Satzteil aber kein Subjekt. Das unbestimmte Pronomen wahrt die Grammatik und mögliche göttliche Urheberschaft, ohne den nicht genannten Namen einzufügen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit weitgehend erhaltener Satzstruktur und Reihung des griechischen Textes. Die ungewöhnliche Formulierung „Gefangenschaft des Landes“ und die Unbestimmtheit des handelnden Subjekts werden bewusst nicht geglättet.
