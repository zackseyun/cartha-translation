  yaml_path: translation/deuterocanon/judith/008/025.yaml
  text: Besides all this[a], let us give thanks to the Lord our God[b], who tests us just as he also tested our fathers.
translation:
  language: de
  text: Bei alledem lasst uns dem Herrn, unserem Gott, danken, der uns prüft[a], wie er auch unsere Väter[b] geprüft hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch »erproben« oder, in manchen Zusammenhängen, »versuchen« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder »unsere Vorfahren«. Wörtlich: »unsere Väter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα πάντα
  choice: Bei alledem
  rationale: Die Wendung gibt die im Zusammenhang naheliegende konzessive Bedeutung knapp und natürlich wieder, ohne sie stärker als nötig auszudeuten.
- source_word: εὐχαριστήσωμεν
  choice: lasst uns … danken
  rationale: Der hortative Konjunktiv der ersten Person Plural wird als gemeinschaftliche Aufforderung wiedergegeben.
- source_word: Κυρίῳ τῷ θεῷ ἡμῶν
  choice: dem Herrn, unserem Gott
  rationale: Bewahrt sowohl den ehrfürchtigen Gottestitel als auch die gemeinschaftliche Zugehörigkeitsaussage.
- source_word: πειράζει
  choice: prüft
  rationale: πειράζω kann je nach Zusammenhang »prüfen«, »erproben« oder »versuchen« bedeuten. Hier bezeichnet es Gottes Erprobung seines Volkes; das Präsens bleibt erhalten.
- source_word: καθὰ καὶ
  choice: wie er auch
  rationale: Gibt sowohl den Vergleich als auch das additive καί wieder.
- source_word: τοὺς πατέρας ἡμῶν
  choice: unsere Väter
  rationale: Entspricht der ausdrücklich männlichen griechischen Bezeichnung und bewahrt die traditionelle familiäre Rede von früheren Generationen Israels.
theological_decisions:
- issue: Bedeutung von πειράζει bei Gott als Subjekt
  choice: prüft
  alternative: versucht oder erprobt
  rationale: »Prüft« bewahrt die Vorstellung göttlicher Erprobung, ohne Gott ausdrücklich moralische Verführung zuzuschreiben. Die mögliche Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
- issue: Wiedergabe von τοὺς πατέρας ἡμῶν
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die Übersetzung hält an der konkreten Form des Ausgangstextes fest; die weiter gefasste idiomatische Bedeutung wird als Alternative vermerkt.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. »Bei alledem« bewahrt die knappe konzessive Wendung; die Wiederaufnahme »geprüft hat« macht den im Griechischen elliptischen Vergleich im Deutschen verständlich.
