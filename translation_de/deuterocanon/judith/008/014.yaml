base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/014.yaml
  text: For you will not find the depths of a man's heart[a], nor will you discern the words of his mind. So how will you search out God, who made all these things, and know his mind, and understand his thought? By no means, brothers[b], provoke the Lord our God.
translation:
  language: de
  text: Denn die Tiefe eines menschlichen Herzens werdet ihr nicht ergründen, und die Überlegungen seines Verstandes werdet ihr nicht erfassen. Wie wollt ihr dann Gott erforschen, der dies alles gemacht hat, seinen Verstand erkennen und seinen Gedanken[a] begreifen? Brüder, reizt den Herrn, unseren Gott, keinesfalls zum Zorn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seinen Ratschluss. Das griechische Wort kann einen Gedanken, eine Überlegung oder einen Plan bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάθος καρδίας ἀνθρώπου
  choice: die Tiefe eines Menschenherzens
  rationale: Die singularische Bildsprache der schwer zugänglichen inneren Tiefe bleibt erhalten. „Menschenherz“ gibt den repräsentativ gebrauchten Singular ἀνθρώπου natürlich und allgemein wieder.
- source_word: εὑρήσετε
  choice: werdet ihr nicht ergründen
  rationale: Der Futur bleibt gewahrt; „ergründen“ verbindet das Finden idiomatisch mit dem Bild der Tiefe, ohne die Aussage auf bloßes Sehen zu reduzieren.
- source_word: λόγους τῆς διανοίας αὐτοῦ
  choice: die Überlegungen seines Verstandes
  rationale: λόγοι kann hier gedankliche Erwägungen beziehungsweise Gedankengänge bezeichnen. Die Formulierung hält λόγοι und διάνοια auseinander und klingt im Deutschen natürlicher als das allzu wörtliche „Worte seines Denkens“.
- source_word: διαλήμψεσθε
  choice: werdet ihr nicht erfassen
  rationale: „Erfassen“ gibt das klare Wahrnehmen und geistige Begreifen des Verbs in gegenwärtigem Standarddeutsch wieder.
- source_word: ἐρευνήσετε
  choice: erforschen
  rationale: Das Verb bezeichnet gründliches Suchen beziehungsweise Untersuchen; „erforschen“ bewahrt diese Intensität.
- source_word: ὃς ἐποίησεν τὰ πάντα ταῦτα
  choice: der dies alles gemacht hat
  rationale: Die Relativkonstruktion sowie πάντα und ταῦτα werden knapp und unmittelbar wiedergegeben; „gemacht“ entspricht ἐποίησεν, ohne es unnötig als Schöpfungsfachbegriff zu verengen.
- source_word: νοῦν αὐτοῦ
  choice: seinen Sinn
  rationale: „Sinn“ bezeichnet hier Gottes Denken und Verstehen und bleibt vom folgenden λογισμός sprachlich unterschieden.
- source_word: λογισμὸν αὐτοῦ
  choice: seinen Gedanken
  rationale: Der Singular und die breite Bedeutung von λογισμός bleiben erhalten. Eine Fußnote weist auf die ebenfalls mögliche zielgerichtete Bedeutung „Ratschluss“ hin.
- source_word: κατανοήσετε
  choice: begreifen
  rationale: „Begreifen“ vermittelt das gründliche geistige Verstehen und vermeidet eine monotone Wiederholung von „erkennen“.
- source_word: μηδαμῶς
  choice: Keinesfalls
  rationale: Das emphatische μηδαμῶς wird als entschiedene Zurückweisung wiedergegeben.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die maskuline Anrede wird entsprechend dem griechischen Wortlaut bewahrt; im unmittelbaren Kontext redet Judit die männlichen Stadtältesten an.
- source_word: μὴ παροργίζετε
  choice: Reizt … nicht zum Zorn
  rationale: 'Die Wendung gibt die kausative Bedeutung von παροργίζω ausdrücklich wieder: jemanden zum Zorn reizen.'
theological_decisions:
- issue: Unerforschlichkeit von Gottes Sinn und Gedanken
  choice: Die drei Verben „erforschen“, „erkennen“ und „begreifen“ sowie die Unterscheidung zwischen „Sinn“ und „Gedanken“ bleiben bestehen.
  alternative: Die Aussage allgemein zu „Gottes Pläne könnt ihr nicht verstehen“ zusammenzufassen.
  rationale: Der griechische Text häuft bewusst mehrere Begriffe des Suchens und Verstehens an. Die Übersetzung bewahrt diese Spannung und formuliert keine weitergehende Lehre über Gottes Erkennbarkeit.
- issue: Bedeutungsbreite von λογισμός
  choice: Gedanke
  alternative: Ratschluss oder Plan
  rationale: „Gedanke“ ist semantisch offen und vermeidet, Gottes λογισμός ohne zwingenden Kontext als festgesetzten Heilsplan oder Dekret zu bestimmen; die mögliche zielgerichtete Lesart wird in der Fußnote genannt.
- issue: Generischer Singular ἀνθρώπου und Anrede ἀδελφοί
  choice: „eines Menschenherzens“ für den repräsentativen Singular, aber „Brüder“ für die konkrete Anrede
  alternative: „des Herzens eines Mannes“ beziehungsweise „Geschwister“
  rationale: ἀνθρώπου bezeichnet in der Aussage menschliche Begrenztheit allgemein, während ἀδελφοί sich im erzählerischen Kontext an die männlichen Stadtältesten richtet. So werden Funktion und konkreter Bezug beider Formen unterschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die emphatische Warnung bleiben deutlich; altertümliche Wendungen und unnötige theologische Festlegungen werden vermieden.
