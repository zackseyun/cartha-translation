    issue: „seinen Sinn erkennen“ für νοῦν αὐτοῦ
    rationale: „Sinn“ bezeichnet im modernen Deutsch häufig Bedeutung, Zweck oder Gesinnung und ist daher als Wiedergabe von νοῦς weniger präzise. „seinen Verstand erkennen“ gibt das geistige Erkenntnisvermögen deutlicher wieder.
  - severity: low
    issue: „die Tiefe eines Menschenherzens“
    rationale: Die Formulierung ist verständlich, aber das Kompositum klingt unnötig schwer. „die Tiefe eines menschlichen Herzens“ ist natürlich und bewahrt die generische Aussage.
  - severity: low
    issue: Abgesetztes „Keinesfalls, Brüder! Reizt … nicht“
    rationale: Die emphatische Verneinung gehört syntaktisch zum folgenden Verbot. Eine integrierte Stellung macht die Beziehung klarer, ohne die Nachdrücklichkeit von μηδαμῶς abzuschwächen.
