revisions:
- from: Denn die Tiefe eines Menschenherzens werdet ihr nicht ergründen, und die Überlegungen seines Verstandes werdet ihr nicht erfassen. Wie wollt ihr da Gott erforschen, der dies alles gemacht hat, seinen Sinn erkennen und seinen Gedanken[a] begreifen? Keinesfalls, Brüder! Reizt den Herrn, unseren Gott, nicht zum Zorn.
  to: Denn die Tiefe eines menschlichen Herzens werdet ihr nicht ergründen, und die Überlegungen seines Verstandes werdet ihr nicht erfassen. Wie wollt ihr dann Gott erforschen, der dies alles gemacht hat, seinen Verstand erkennen und seinen Gedanken[a] begreifen? Brüder, reizt den Herrn, unseren Gott, keinesfalls zum Zorn.
  rationale: Die Revision beseitigt die moderne Mehrdeutigkeit von „Sinn“ für νοῦς, glättet die erste Nominalgruppe und bindet die emphatische Verneinung unmittelbar an die Aufforderung. Die rhetorische Struktur, die begriffliche Steigerung und die offene Bedeutung von λογισμός bleiben erhalten.
