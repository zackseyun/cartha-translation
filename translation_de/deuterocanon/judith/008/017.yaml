base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/017.yaml
  text: Therefore[a], while we wait for the salvation that comes from him, let us call on him to help us, and he will hear our voice[b], if it is pleasing to him.
translation:
  language: de
  text: Darum wollen wir, während wir auf die Rettung warten, die von ihm kommt, ihn um Hilfe anrufen, und er wird unsere Stimme hören, wenn es ihm gefällt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: Darum
  rationale: Die folgernde Konjunktion zieht einen Schluss aus dem vorher Gesagten; „Darum“ ist gegenwärtiges, klares Deutsch.
- source_word: ἀναμένοντες
  choice: während wir … warten
  rationale: Das Partizip bezeichnet ein andauerndes, erwartungsvolles Warten und wird temporal aufgelöst.
- source_word: σωτηρίαν
  choice: Rettung
  rationale: Im unmittelbaren Erzählzusammenhang geht es um Gottes rettendes Eingreifen in äußerer Bedrängnis. „Rettung“ bewahrt diesen Sinn, ohne die mögliche theologische Weite des Wortes auszuschließen.
- source_word: τὴν παρ’ αὐτοῦ
  choice: von ihm
  rationale: 'παρά mit Genitiv bezeichnet hier den Ursprung: Die Rettung kommt von Gott.'
- source_word: ἐπικαλεσώμεθα
  choice: wollen wir … anrufen
  rationale: Der hortative Konjunktiv wird als gemeinsame Aufforderung wiedergegeben; „anrufen“ wahrt den Gebetsbezug.
- source_word: εἰς βοήθειαν ἡμῶν
  choice: um Hilfe
  rationale: Die präpositionale Wendung bezeichnet das Ziel des Anrufens. „Um Hilfe anrufen“ ist idiomatisches Deutsch und bleibt dem Sinn eng verbunden.
- source_word: εἰσακούσεται
  choice: wird … hören
  rationale: Das Verb kann im Gebetszusammenhang günstiges Hören beziehungsweise Erhören einschließen; „hören“ bewahrt die Bildsprache der folgenden „Stimme“ und legt das Ergebnis nicht stärker fest als der Wortlaut.
- source_word: τῆς φωνῆς ἡμῶν
  choice: unsere Stimme
  rationale: Die wörtliche Wiedergabe erhält die konkrete Ausdrucksweise des Griechischen; sinngemäß ist das gemeinsame Rufen beziehungsweise Gebet gemeint.
- source_word: ἐὰν ἦν αὐτῷ ἀρεστόν
  choice: wenn es ihm gefällt
  rationale: Die Bedingung stellt das Hören unter Gottes Wohlgefallen beziehungsweise Willen. Die ungewöhnliche griechische Verbform wird nach dem klaren konditionalen Sinn wiedergegeben.
theological_decisions:
- issue: Bedeutungsweite von σωτηρία im erzählerischen Zusammenhang
  choice: Rettung
  alternative: Heil
  rationale: Die konkrete Bedrohung legt „Rettung“ nahe, während „Heil“ die breitere theologische Bedeutung stärker hervorhebt. Die Alternative wird in einer Fußnote offengehalten.
- issue: Bedingtheit des göttlichen Hörens
  choice: wenn es ihm gefällt
  alternative: wenn es ihm wohlgefällig ist
  rationale: Die Formulierung bewahrt die Spannung zwischen der Aufforderung zum vertrauensvollen Gebet und Gottes souveränem Wohlgefallen, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die gemeinsame Aufforderung wird natürlich formuliert; konkrete biblische Bildsprache bleibt erhalten. Die Satzteilung verbessert die Lesbarkeit, ohne den Gedankengang zu verändern.
