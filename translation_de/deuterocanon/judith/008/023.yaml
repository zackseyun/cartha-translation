base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/023.yaml
  text: For our slavery will not be turned to favor[a], but the Lord our God will make it a dishonor.
translation:
  language: de
  text: Denn unsere Sklaverei wird nicht auf Gunst hinauslaufen,[a] sondern der Herr, unser Gott, wird sie zur Schande machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn unsere Knechtschaft wird nicht in Gunst enden, sondern der Herr, unser Gott, wird sie zur Schande machen.“'
    reason: Lexikalische und syntaktische Alternative für δουλεία und κατευθυνθήσεται εἰς χάριν.
lexical_decisions:
- source_word: κατευθυνθήσεται
  choice: wird … führen
  rationale: Das passive Futur bezeichnet hier in Verbindung mit εἰς das Hinauslaufen auf ein Ergebnis. Die deutsche Formulierung ist natürlich und bewahrt die zielgerichtete Aussage, ohne sie mit „gedeihen“ stärker auszudeuten.
- source_word: δουλεία
  choice: Sklaverei
  rationale: δουλεία bezeichnet den Zustand der Versklavung oder Knechtschaft. „Sklaverei“ gibt die Härte der unterworfenen Lage klar wieder.
- source_word: εἰς χάριν
  choice: zu Gunst
  rationale: χάρις meint in diesem gesellschaftlich-politischen Zusammenhang Gunst oder Wohlwollen, nicht ausdrücklich die theologisch geprägte „Gnade“. Die Präposition εἰς bezeichnet das angestrebte oder eintretende Ergebnis.
- source_word: ἀτιμίαν
  choice: Schande
  rationale: ἀτιμία bezeichnet Ehrverlust, Schmach oder Schande. „Schande“ bildet einen klaren Gegensatz zu „Gunst“ und ist im Deutschen idiomatisch.
- source_word: θήσει αὐτήν
  choice: wird sie … machen
  rationale: 'τίθημι hat hier resultativen Sinn: Der Herr setzt beziehungsweise macht die Sklaverei zu etwas. Das Pronomen „sie“ nimmt „Sklaverei“ ausdrücklich wieder auf.'
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: der Herr, unser Gott
  rationale: Die Apposition „unser Gott“ gibt die griechische Wortfolge würdig und eindeutig wieder.
theological_decisions:
- issue: Wiedergabe von δουλεία für Israels drohende Unterwerfung
  choice: Sklaverei
  alternative: Knechtschaft
  rationale: Der starke Ausdruck wahrt die konkrete Erniedrigung und Unfreiheit; „Knechtschaft“ wäre möglich, klingt jedoch altertümlicher und kann die Härte abschwächen.
- issue: Bedeutung von χάρις außerhalb eines soteriologischen Zusammenhangs
  choice: Gunst
  alternative: Gnade
  rationale: Der Gegensatz zu ἀτιμία betrifft Ansehen und Behandlung unter einer fremden Herrschaft. „Gunst“ vermeidet deshalb eine unbeabsichtigte heilsgeschichtliche Festlegung.
- issue: Aussage, dass Gott die Sklaverei zur Schande machen werde
  choice: Der Herr, unser Gott, wird sie zur Schande machen
  alternative: sie wird in Schande enden
  rationale: Die gewählte Fassung erhält Gott ausdrücklich als handelndes Subjekt und glättet die theologische Spannung des griechischen Textes nicht weg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sklaverei“ ist bewusst direkt; „zu Gunst führen“ bewahrt die Zielrichtung des Griechischen, während die Fußnote die idiomatischere Ergebnisformulierung bietet.
