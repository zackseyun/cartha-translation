  yaml_path: translation/deuterocanon/judith/008/027.yaml
  text: For he did not test us by fire, as he did them, to examine their hearts; nor has he taken vengeance on us. Rather, the Lord scourges those who draw near to him for admonition.
translation:
  language: de
  text: Denn er hat an uns keine Vergeltung geübt, wie er jene im Feuer prüfte, um ihre Herzen zu erforschen. Vielmehr geißelt der Herr zur Zurechtweisung diejenigen, die sich ihm nahen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vielmehr züchtigt der Herr zur Zurechtweisung diejenigen, die sich ihm nahen.“ Das griechische Verb bedeutet wörtlich „geißeln“ und bewahrt so die Härte des korrigierenden Bildes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπύρωσεν
  choice: im Feuer geprüft
  rationale: Die Wendung bewahrt sowohl das konkrete Feuerbild des Verbs als auch den durch εἰς ἔτασμόν bestimmten Sinn einer Prüfung.
- source_word: εἰς ἔτασμόν τῆς καρδίας αὐτῶν
  choice: um ihre Herzen zu erforschen
  rationale: Die finale Fügung bezeichnet den Zweck der Feuerprobe; „Herzen“ wahrt die biblische Bezeichnung für das Innere des Menschen.
- source_word: ἐξεδίκησεν
  choice: Rache genommen
  rationale: Die Wiedergabe erhält den starken Sinn des Vollzugs von Vergeltung und damit den Gegensatz zur nachfolgenden korrektiven Züchtigung.
- source_word: εἰς νουθέτησιν
  choice: zur Zurechtweisung
  rationale: Der Ausdruck bezeichnet korrigierende Unterweisung oder Mahnung; „Zurechtweisung“ klingt im modernen Deutsch natürlich und unterscheidet sich klar von Vergeltung.
- source_word: μαστιγοῖ
  choice: geißelt
  rationale: „Geißelt“ bewahrt das harte, konkrete Bild des griechischen Verbs und schwächt es nicht zu einem allgemeinen „erzieht“ ab.
- source_word: Κύριος
  choice: der Herr
  rationale: Die traditionelle und natürliche deutsche Wiedergabe von Κύριος in einer Aussage über Gott.
- source_word: τοὺς ἐγγίζοντας αὐτῷ
  choice: diejenigen, die sich ihm nahen
  rationale: Die Formulierung erhält die religiöse und relationale Resonanz des Sich-Gott-Näherns, ohne sie näher auszudeuten.
theological_decisions:
- issue: Ob das Bild göttlicher Züchtigung abgeschwächt werden soll
  choice: Das konkrete Bild „geißelt“ wird beibehalten.
  alternative: „erzieht“ oder „züchtigt“
  rationale: Der griechische Text stellt schmerzhafte, aber korrigierende Züchtigung der Vergeltung gegenüber; diese Spannung darf nicht eingeebnet werden.
- issue: Verhältnis von Vergeltung und korrigierendem Zweck
  choice: „keine Rache genommen ... zur Zurechtweisung“
  alternative: „nicht bestraft ... zur Erziehung“
  rationale: Die Fassung wahrt den ausdrücklichen Kontrast zwischen Vergeltung und korrektiver göttlicher Einwirkung, ohne eine umfassendere Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Gedankengang; „sich ihm nahen“ bewahrt bewusst den biblisch-religiösen Klang, während „Zurechtweisung“ heute verständlich bleibt.
