  source_fidelity: 'Die Fassung vertauscht die im Griechischen ausgedrückten Bezugsgrößen: ἐκείνους ist Objekt von ἐπύρωσεν und bezeichnet „jene“, während ἡμᾶς Objekt von ἐξεδίκησεν ist. Der Text sagt somit, dass der Herr an „uns“ keine Vergeltung geübt hat, im Vergleich zu der Feuerprüfung „jener“ zur Prüfung ihrer Herzen; er sagt nicht, dass „uns“ geprüft wurden, um die Herzen „jener“ zu erforschen.'
