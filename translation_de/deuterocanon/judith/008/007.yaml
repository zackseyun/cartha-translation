  text: And she was very beautiful in appearance and lovely to behold[a]; and Manasseh her husband had left her gold and silver and male servants and female servants and livestock and fields[b], and she remained over them.
translation:
  language: de
  text: Und sie war von schöner Gestalt und äußerst schön anzusehen. Ihr Mann Manasse hatte ihr Gold und Silber, männliche und weibliche Bedienstete[a], Vieh und Felder hinterlassen, und sie verfügte weiterhin darüber.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklaven und Sklavinnen“. Die griechischen Bezeichnungen können in einem Güterverzeichnis unfreie Hausangehörige oder Bedienstete meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „sie blieb ihnen vorgesetzt“ oder „sie behielt sie in ihrem Besitz“. Die griechische Wendung lässt offen, ob vor allem Besitz, Verwaltung oder beides gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: καλὴ τῷ εἴδει
  choice: von schöner Gestalt
  rationale: Die Wendung beschreibt Judits äußere Erscheinung. „Von schöner Gestalt“ gibt sowohl das Adjektiv als auch den Bezug auf ihre sichtbare Gestalt würdig und verständlich wieder.
- source_word: ὡραία τῇ ὄψει σφόδρα
  choice: überaus anmutig anzusehen
  rationale: Die Formulierung bewahrt den visuellen Bezug von ὄψις, variiert gegenüber „schön“ und gibt die starke Intensivierung durch σφόδρα wieder.
- source_word: ὑπελείπετο αὐτῇ
  choice: hatte ihr … hinterlassen
  rationale: Der Aorist bezeichnet hier das, was der verstorbene Ehemann ihr zurückließ. „Hinterlassen“ ist natürlich, ohne ausdrücklich einen förmlichen Erbakt vorauszusetzen.
- source_word: παῖδας καὶ παιδίσκας
  choice: Knechte und Mägde
  rationale: Im Zusammenhang eines Haushalts- und Güterverzeichnisses bezeichnet das Wortpaar männliche und weibliche Hausangehörige beziehungsweise Arbeitskräfte. Die traditionelle, noch verständliche Paarform hält den Geschlechtsunterschied fest; die mögliche Bedeutung „Sklaven und Sklavinnen“ wird in der Fußnote genannt.
- source_word: κτήνη
  choice: Vieh
  rationale: Der Sammelbegriff meint gehaltene Nutztiere; „Vieh“ ist dafür die knappe und übliche deutsche Entsprechung.
- source_word: ἀγρούς
  choice: Felder
  rationale: Das Wort bezeichnet Felder beziehungsweise landwirtschaftlich genutzte Grundstücke; „Felder“ ist die direkte Entsprechung.
- source_word: ἔμενεν ἐπʼ αὐτῶν
  choice: sie verfügte weiterhin darüber
  rationale: Die Wiedergabe drückt fortdauernde Verfügungsgewalt über die aufgezählten Menschen und Güter aus, ohne ausschließlich Besitz oder ausschließlich Verwaltung festzulegen. Die verbleibende Mehrdeutigkeit wird durch die Fußnote offengelegt.
theological_decisions:
- issue: Sozialer Status der mit παῖδας und παιδίσκας bezeichneten Personen
  choice: Knechte und Mägde
  alternative: Sklaven und Sklavinnen
  rationale: Das griechische Wortpaar kann in einem Güterverzeichnis unfreie Hausangehörige bezeichnen, legt den genauen Rechtsstatus aber nicht so eindeutig fest wie ausdrücklichere Statusbegriffe. Deshalb steht die weniger festlegende Wiedergabe im Text, während die stärkere Alternative in der Fußnote erhalten bleibt.
- issue: Bedeutung von ἔμενεν ἐπʼ αὐτῶν
  choice: sie verfügte weiterhin darüber
  alternative: sie blieb über sie gesetzt / sie blieb in ihrem Besitz
  rationale: Die griechische Wendung kann fortdauernden Besitz, Aufsicht oder Verfügungsgewalt hervorheben. Der Haupttext wahrt diese Überschneidung weitgehend; die Fußnote benennt die möglichen Akzente ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Knechte und Mägde“ ist bewusst etwas traditioneller, bleibt aber allgemein verständlich und bildet das paarige griechische Inventar knapp ab. Die Satzfolge und die aufzählende Struktur des Originals werden bewahrt.
