  text: And now you are testing the Lord Almighty[b][a], and you will never understand anything.
translation:
  language: de
  text: Und nun prüft ihr den Herrn, den Allmächtigen[a], und ihr werdet bis in Ewigkeit[b] nichts erkennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „untersucht ihr den Herrn, den Allmächtigen“ oder „versucht ihr, ihn zu ergründen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „bis zum Zeitalter“; die Wendung bezeichnet hier eine unbegrenzte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάζετε
  choice: stellt … auf die Probe
  rationale: Das Verb bezeichnet ein genaues Prüfen oder Untersuchen und kann in diesem vorwurfsvollen Zusammenhang auch das Auf-die-Probe-Stellen ausdrücken. Die gewählte Formulierung ist im modernen Deutschen natürlich; die untersuchende Bedeutung bleibt in der Fußnote sichtbar.
- source_word: κύριον Παντοκράτορα
  choice: den Herrn, den Allmächtigen
  rationale: „Herr“ gibt κύριος als Gottesbezeichnung wieder; „der Allmächtige“ bewahrt Παντοκράτωρ als eigenständigen göttlichen Titel. Die Apposition entspricht dem griechischen Ausdruck und klingt würdig und natürlich.
- source_word: οὐθὲν
  choice: etwas (unter der Verneinung „niemals“)
  rationale: Die Verbindung „niemals etwas“ ist die natürliche deutsche Entsprechung von οὐθὲν zusammen mit der zeitlich uneingeschränkten Verneinung.
- source_word: ἐπιγνώσεσθε
  choice: werdet … erkennen
  rationale: ἐπιγινώσκω kann ein wirkliches oder volles Erkennen bezeichnen. „Erkennen“ wahrt den Erkenntnisbezug, ohne den Umfang durch „vollständig“ unnötig festzulegen.
- source_word: ἕως τοῦ αἰῶνος
  choice: niemals
  rationale: Wörtlich lautet die Wendung etwa „bis in Ewigkeit“. Zusammen mit οὐθὲν drückt sie hier aus, dass das Erkennen zu keiner Zeit gelingen wird. „Niemals“ gibt diese Gesamtbedeutung idiomatisch wieder; die Bildform der griechischen Wendung wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutung menschlichen Prüfens Gottes in ἐξετάζετε
  choice: stellt … auf die Probe
  alternative: versucht … zu ergründen / untersucht
  rationale: Der Zusammenhang trägt einen deutlichen Vorwurf. „Auf die Probe stellen“ bewahrt diesen, ohne die ebenfalls mögliche Bedeutung des untersuchenden Ergründens auszuschließen; diese wird ausdrücklich in der Fußnote genannt.
- issue: Wiedergabe von κύριος in der griechischen deuterokanonischen Schrift
  choice: Herr
  alternative: Gebieter
  rationale: κύριος steht hier zusammen mit Παντοκράτωρ als Gottesbezeichnung. „Herr“ ist dafür die sachgemäße und etablierte deutsche Wiedergabe; „Gebieter“ würde die Titelform unnötig verändern.
- issue: Reichweite der Aussage ἕως τοῦ αἰῶνος
  choice: niemals
  alternative: bis in Ewigkeit
  rationale: Die idiomatische Wiedergabe bezeichnet eine zeitlich uneingeschränkte Unmöglichkeit des Erkennens. Die wörtlichere Alternative bleibt in der Fußnote erhalten, sodass die eschatologisch oder zeitlich offene Bildsprache nicht verborgen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Plural wird beibehalten. Die adversative Verbindung „doch“ macht den im Griechischen durch die Satzfolge gegebenen Gegensatz natürlich verständlich, ohne die Aussage inhaltlich aufzulösen.
