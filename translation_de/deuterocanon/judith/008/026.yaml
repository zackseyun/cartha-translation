base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/026.yaml
  text: Remember what he did with Abraham[a], and how he tested Isaac, and what happened to Jacob in Mesopotamia of Syria while he was shepherding the sheep of Laban[b], his mother's brother.
translation:
  language: de
  text: Erinnert euch daran, was er mit Abraham tat, wie er Isaak prüfte[a] und was Jakob in Mesopotamien Syriens[b] widerfuhr, als er die Schafe Labans, des Bruders seiner Mutter, hütete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch „erprobte“ oder „auf die Probe stellte“ bedeuten; gemeint ist hier eine Bewährungsprobe, nicht eine Verleitung zum Bösen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Mesopotamien Syriens“; möglich ist auch „das syrische Mesopotamien“.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  choice: Erinnert euch daran
  rationale: Der Aoristimperativ im Plural fordert die Angesprochenen nachdrücklich auf, sich Gottes früheres Handeln zu vergegenwärtigen. Die deutsche Wendung ist natürlich und bewahrt den Aufforderungscharakter.
- source_word: ὅσα ἐποίησεν μετʼ Ἀβραάμ
  choice: was er mit Abraham tat
  rationale: μετά mit Genitiv bezeichnet hier Gottes Handeln mit Abraham, ohne festzulegen, ob es als Handeln für ihn oder an ihm zu verstehen ist. Das im Griechischen unausgesprochene Subjekt wird im Deutschen zurückhaltend mit „er“ wiedergegeben.
- source_word: ἐπείρασεν
  choice: prüfte
  rationale: πειράζω kann je nach Zusammenhang „prüfen“, „erproben“ oder „versuchen“ bedeuten. „prüfte“ bezeichnet hier eine Bewährungsprobe und vermeidet die irreführende Vorstellung einer Verleitung zum Bösen.
- source_word: ὅσα ἐγένετο τῷ Ἰακώβ
  choice: was Jakob widerfuhr
  rationale: Die Formulierung gibt die Ereignisse wieder, die Jakob trafen. „widerfuhr“ ist knapp, idiomatisch und dem würdevollen Erzählregister angemessen.
- source_word: ἐν Μεσοποταμίᾳ τῆς Συρίας
  choice: in Mesopotamien Syriens
  rationale: Die Genitivverbindung wird bewusst eng am griechischen geografischen Ausdruck wiedergegeben. Eine geläufigere alternative Formulierung wird in der Fußnote genannt.
- source_word: ποιμαίνοντι τὰ πρόβατα
  choice: als er die Schafe … hütete
  rationale: Das Präsenspartizip beschreibt Jakobs gleichzeitig andauernde Tätigkeit. „die Schafe hütete“ ist im modernen Deutsch natürlicher als das substantivnahe „Schafe weidete“ und bewahrt das konkrete Bild.
- source_word: Λαβὰν τοῦ ἀδελφοῦ τῆς μητρὸς αὐτοῦ
  choice: Labans, des Bruders seiner Mutter
  rationale: Die Formulierung folgt der ausdrücklichen Verwandtschaftsangabe des Griechischen, statt sie lediglich mit dem interpretierenden Verwandtschaftswort „Onkel“ zusammenzufassen.
theological_decisions:
- issue: Unausgesprochenes Subjekt beim Handeln an Abraham und Isaak
  choice: Das Subjekt wird mit „er“ wiedergegeben.
  alternative: „Gott“ ausdrücklich einsetzen oder den Satz unpersönlich umformen.
  rationale: Der Zusammenhang weist auf Gott als Handelnden, doch der griechische Text nennt ihn in diesem Vers nicht ausdrücklich. Das Pronomen ermöglicht natürliches Deutsch, ohne mehr zu präzisieren als die Vorlage.
- issue: Bedeutung von ἐπείρασεν bei göttlichem Handeln
  choice: prüfte
  alternative: versuchte; stellte auf die Probe
  rationale: „prüfte“ bewahrt den Gedanken einer Bewährungsprobe. „versuchte“ könnte im heutigen Deutsch fälschlich als Verleitung zum Bösen verstanden werden; „stellte auf die Probe“ ist eine mögliche, aber stärker ausdeutende Umschreibung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die dreigliedrige Erinnerung an Abraham, Isaak und Jakob bleibt erhalten; ungewohnte geografische Ausdrucksweise und semantische Spannweite werden nicht stillschweigend geglättet.
