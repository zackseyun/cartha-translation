  text: But you must not investigate my action, for I will not tell you until what I am doing has been completed.
translation:
  language: de
  text: Ihr aber sollt mein Vorgehen nicht ergründen; denn ich werde es euch nicht sagen, bis vollendet ist, was ich tue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερευνήσετε
  choice: sollt nicht ausforschen
  rationale: Das Verb bezeichnet ein gründliches Erkunden oder Nachforschen. „Ausforschen“ bewahrt diesen Nachdruck und passt dazu, dass Judit ihre Absicht bewusst geheim hält.
- source_word: τὴν πρᾶξίν μου
  choice: was ich vorhabe
  rationale: πρᾶξις bezeichnet hier Judits beabsichtigtes Vorgehen. „Was ich vorhabe“ ist im Deutschen natürlich, ohne den Ausdruck auf einen bloßen Gedanken oder einen vollständig ausgearbeiteten Plan zu verengen.
- source_word: οὐ γὰρ ἐρῶ ὑμῖν
  choice: denn ich werde es euch nicht sagen
  rationale: Die futurische Form von λέγω bedeutet im Zusammenhang natürlich „sagen“ beziehungsweise „mitteilen“. Das Pronomen „es“ nimmt Judits Vorhaben auf.
- source_word: ἕως τοῦ τελεσθῆναι
  choice: bis vollendet ist
  rationale: Die Wendung setzt den Abschluss als zeitliche Grenze ihres Schweigens. Die passive Form von τελεσθῆναι bleibt durch „vollendet ist“ erhalten.
- source_word: ἃ ἐγὼ ποιῶ
  choice: was ich tue
  rationale: Die Relativkonstruktion verweist auf Judits eigenes, sich entfaltendes Handeln. „Was ich tue“ bildet sowohl das Präsens als auch das ausdrücklich gesetzte ἐγώ angemessen ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gegenüberstellung des nominalen πρᾶξις mit dem verbalen ποιῶ wird durch „was ich vorhabe“ und „was ich tue“ hörbar gemacht; „vollendet“ bewahrt den feierlichen Ton und die passive Aussage des Griechischen.
