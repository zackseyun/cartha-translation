  text: And now pray for us[a], because you are a devout woman, and the Lord will send rain to fill our cisterns, and we will not perish any longer.
translation:
  language: de
  text: Und nun bete für uns, denn du bist eine gottesfürchtige Frau. Der Herr wird Regen senden, damit sich unsere Zisternen füllen, und wir werden keinen Mangel mehr haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir werden nicht mehr zu kurz kommen“; wörtlich: „Wir werden nicht mehr ausgehen/fehlen.“ Das griechische Verb kann je nach Zusammenhang auch „aufhören“, „erschöpft sein“ oder „zugrunde gehen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητι περὶ ἡμῶν
  choice: bete für uns
  rationale: Der Aorist-Imperativ von δέομαι fordert Judith unmittelbar zur Fürbitte auf; „für uns beten“ ist im modernen Deutsch natürlich und gibt περί idiomatisch wieder.
- source_word: γυνὴ εὐσεβὴς
  choice: eine gottesfürchtige Frau
  rationale: εὐσεβής bezeichnet ehrfürchtige Hingabe an Gott. „Gottesfürchtig“ bewahrt den religiösen Bezug deutlicher als das allgemeinere „fromm“.
- source_word: ἀποστελεῖ Κύριος τὸν ὑετόν
  choice: Der Herr wird Regen senden
  rationale: Die Zukunftsform ἀποστελεῖ wird direkt wiedergegeben; „Regen senden“ ist eine natürliche biblische Wendung, und Κύριος erscheint als „der Herr“.
- source_word: εἰς πλήρωσιν τῶν λάκκων ἡμῶν
  choice: damit sich unsere Zisternen füllen
  rationale: εἰς πλήρωσιν drückt hier Zweck oder Ergebnis aus. λάκκοι sind im Zusammenhang der Dürre am wahrscheinlichsten Zisternen beziehungsweise Wasserspeicher.
- source_word: οὐκ ἐκλείψομεν ἔτι
  choice: wir werden keinen Mangel mehr haben
  rationale: ἐκλείπω kann „ausgehen“, „versiegen“, „fehlen“ oder „erschöpft werden“ bedeuten. Die gewählte Fassung passt zur Wasserknappheit, ohne das Verb auf den Tod zuzuspitzen.
theological_decisions:
- issue: Wiedergabe von Κύριος
  choice: der Herr
  alternative: Herr
  rationale: Der bestimmte Artikel und der jüdisch-schriftsprachliche Zusammenhang sprechen für „der Herr“; damit wird die göttliche Hoheitsbezeichnung bewahrt, ohne einen im griechischen Text nicht ausdrücklich stehenden Gottesnamen einzusetzen.
- issue: Tragweite von οὐκ ἐκλείψομεν ἔτι
  choice: wir werden keinen Mangel mehr haben
  alternative: wir werden nicht mehr zugrunde gehen
  rationale: Das Verb kann im Zusammenhang existenzielle Erschöpfung bezeichnen, nennt aber nicht ausdrücklich das Sterben. Die Übersetzung hält daher die Aussage bei der Behebung des Mangels und dokumentiert die weitere Deutungsmöglichkeit in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste griechische Satzfluss wird zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert; die aufeinanderfolgenden Aussagen und ihre Zukunftsausrichtung bleiben erhalten.
