  text: And she bound up her hair with a headband[a], and took a linen garment to deceive him.
translation:
  language: de
  text: Und sie band ihr Haar mit einem Stirnband zusammen und nahm ein Leinengewand, um ihn zu täuschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „zu seiner Täuschung“. Die griechische Wendung kann Ziel oder Ergebnis bezeichnen; im Zusammenhang ist gemeint, dass sie das Gewand nahm, um ihn zu täuschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδήσατο τὰς τρίχας αὐτῆς
  choice: sie band ihr Haar … zusammen
  rationale: Die mediale Verbform bezeichnet hier das Befestigen beziehungsweise Ordnen des eigenen Haars. Der deutsche Kollektivsingular „Haar“ ist idiomatisch, und „zusammenbinden“ gibt den Vorgang natürlich wieder.
- source_word: ἐν μίτρᾳ
  choice: mit einem Stirnband
  rationale: μίτρα bezeichnet hier eine Binde oder Umhüllung für den Kopf. „Stirnband“ ist im modernen Deutsch verständlich und passt zum Zusammenbinden des Haars, ohne die irreführende kirchliche Bedeutung von „Mitra“ einzutragen.
- source_word: ἔλαβεν
  choice: nahm
  rationale: Die Wiedergabe bleibt beim Grundsinn des griechischen Verbs. Der Zusammenhang kann das Anlegen des Gewands einschließen, doch dies wird im Wortlaut nicht ausdrücklich gesagt.
- source_word: στολὴν λινῆν
  choice: ein Leinengewand
  rationale: στολή bezeichnet ein Gewand oder Kleidungsstück; „Leinengewand“ gibt Ausdruck und Material knapp wieder, ohne Schnitt oder Form näher zu bestimmen.
- source_word: εἰς ἀπάτην αὐτοῦ
  choice: um ihn zu täuschen
  rationale: εἰς mit ἀπάτη kann Ziel oder Ergebnis ausdrücken. Im Erzählzusammenhang bezeichnet die Wendung die gegen ihn gerichtete Täuschungsabsicht; die deutsche Infinitivkonstruktion ist klar und natürlich.
theological_decisions:
- issue: Moralische Charakterisierung von Judiths Vorgehen
  choice: Die Handlung wird offen als darauf gerichtet bezeichnet, ihn zu täuschen.
  alternative: „zu seiner Täuschung“ beziehungsweise „als Täuschung für ihn“
  rationale: Der griechische Text verwendet ausdrücklich ἀπάτη. Die Übersetzung schwächt die strategische Täuschung weder ab noch fügt sie eine moralische Wertung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einfacher Satzstruktur. Der konkrete Erzählton und die sachliche Benennung der Täuschung bleiben erhalten; über den griechischen Wortlaut hinaus wird nicht ausdrücklich gesagt, dass sie das Gewand anzog.
