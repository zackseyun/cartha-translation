lexical_decisions:
- source_word: εὐφραινόμενος
  choice: feierte
  rationale: Das Partizip bezeichnet anhaltende gemeinschaftliche Freude; „feierte“ gibt dies im Deutschen natürlich wieder und passt zum festlichen Zusammenhang.
- source_word: κατὰ πρόσωπον τῶν ἁγίων
  choice: vor dem Heiligtum
  rationale: Die Wendung bezeichnet in diesem Jerusalemer Kultzusammenhang wahrscheinlich den Ort vor dem heiligen Tempelbereich. „Vor“ bewahrt die räumliche Bedeutung von κατὰ πρόσωπον.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: drei Monate lang
  rationale: Idiomatísche deutsche Wiedergabe der zeitlichen Dauer.
- source_word: κατέμεινεν
  choice: blieb
  rationale: Gibt das weitere Verweilen Judits bei dem Volk schlicht und präzise wieder.
- source_word: λαός
  choice: das Volk
  rationale: Natürliche kollektive Bezeichnung, ohne den politischen oder ethnischen Sinn unnötig einzuengen.
theological_decisions:
- issue: Bezug von τῶν ἁγίων im Jerusalemer Kultzusammenhang
  choice: Heiligtum
  alternative: die heiligen Dinge; die Heiligen
  rationale: Die räumliche Wendung und der Jerusalemer Kontext sprechen am ehesten für den heiligen Tempelbereich. Da die griechische Form sowohl sachlich als auch personal verstanden werden kann, werden die echten Alternativen in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, während „feierte“ und „drei Monate lang“ für natürliche Verständlichkeit sorgen.
