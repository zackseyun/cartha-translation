  source_fidelity: Die Grundübersetzung trifft Satzbau, Ortsangabe, Zeitdauer und das Verbleiben Judits. Für εὐφραινόμενος gibt „freute sich“ den andauernden Zustand des Sichfreuens unmittelbarer wieder als das stärker ereignishafte „feierte“. „Vor dem Heiligtum“ ist im Kultkontext eine gut begründete Hauptlesart für κατὰ πρόσωπον τῶν ἁγίων, sofern die grammatisch möglichen Alternativen in der Fußnote erhalten bleiben.
  naturalness: „Und das Volk freute sich drei Monate lang in Jerusalem vor dem Heiligtum“ ist modernes, würdiges und flüssiges Standarddeutsch. Die Stellung von „drei Monate lang“ ist idiomatisch und wahrt den Bezug auf das anhaltende Freuen.
  terminology: '„Heiligtum“ ist als kontextuelle Wiedergabe angemessen und vermeidet eine unangebrachte Festlegung auf „Heilige“ im Sinne späterer kirchlicher Terminologie. Die vorhandene Fußnote muss jedoch korrigiert werden: Der griechische Genitiv τῶν ἁγίων ist nicht Singular, daher ist „dem Heiligen“ als angeblich wörtliche Alternative unzutreffend.'
