  text: He said he would set my mountains on fire[a], and kill my young men with the sword, and throw my nursing children to the ground, and give my infants as plunder, and despoil my virgins.
translation:
  language: de
  text: Er sagte, er werde meine Berge in Brand setzen, meine jungen Männer mit dem Schwert töten, meine Säuglinge auf den Boden legen, meine kleinen Kinder als Beute hingeben und meine Jungfrauen ausplündern[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „meine Jungfrauen schänden“. Das griechische Verb bedeutet wörtlicher „ausplündern“, „berauben“ oder „entkleiden“, kann in diesem Zusammenhang kriegerischer Gewalt aber auch sexuelle Misshandlung andeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: Er sagte, er werde
  rationale: Der Aorist von λέγω leitet die angekündigten Absichten des Feindes ein. Der deutsche Konjunktiv I gibt die indirekte Rede natürlich wieder und trägt die folgenden Infinitive und Futurformen sinngemäß zusammen.
- source_word: ἐμπρήσειν
  choice: in Brand setzen
  rationale: Das Verb bezeichnet das Anzünden oder Niederbrennen. „In Brand setzen“ bewahrt die anschauliche, verursachende Bedeutung.
- source_word: τὰ ὅρη μου
  choice: meine Berge
  rationale: ὄρη bedeutet wörtlich „Berge“; diese Wiedergabe erhält die poetische Bildkraft, ohne das Wort zu „Bergland“ umzudeuten.
- source_word: ἀνελεῖν
  choice: töten
  rationale: Das Verb bedeutet hier, jemanden zu beseitigen beziehungsweise zu töten. „Töten“ ist klar, gegenwärtig und im Zusammenhang eindeutig.
- source_word: τοὺς νεανίσκους μου
  choice: meine jungen Männer
  rationale: νεανίσκοι bezeichnet junge Männer. Eine Wiedergabe als „Krieger“ würde eine im Substantiv nicht ausdrücklich enthaltene militärische Rolle ergänzen.
- source_word: ῥομφαίᾳ
  choice: mit dem Schwert
  rationale: ῥομφαία bezeichnet ein Schwert, teils ein großes Schwert. Die instrumentale Wendung ist im Deutschen natürlich und textnah.
- source_word: τὰ θηλάζοντά μου
  choice: meine Säuglinge
  rationale: Das substantivierte Partizip bezeichnet Kinder, die noch gestillt werden. „Säuglinge“ gibt dies im modernen Deutschen knapp und verständlich wieder.
- source_word: θήσει εἰς ἔδαφος
  choice: zu Boden werfen
  rationale: Wörtlich steht „auf/zu den Boden setzen, legen“. Im Zusammenhang der angekündigten Gewalttaten bringt „zu Boden werfen“ die feindselige Handlung zum Ausdruck, ohne die stärkere Vorstellung des Zerschmetterns ausdrücklich hinzuzufügen.
- source_word: τὰ νήπιά μου
  choice: meine kleinen Kinder
  rationale: νήπια bezeichnet sehr junge, noch unmündige Kinder. „Kleine Kinder“ unterscheidet sie sprachlich von den zuvor genannten, ausdrücklich gestillten Säuglingen, ohne eine ungesicherte genaue Altersstufe festzulegen.
- source_word: δώσει εἰς προνομὴν
  choice: als Beute hingeben
  rationale: προνομή bezeichnet Beute oder Plündergut. Die Formulierung bewahrt sowohl das Verb „geben“ als auch die grausame Behandlung der Kinder als Kriegsbeute.
- source_word: τὰς παρθένους
  choice: meine Jungfrauen
  rationale: παρθένοι bezeichnet hier Jungfrauen beziehungsweise unverheiratete junge Frauen. „Jungfrauen“ bewahrt die ausdrücklich bezeichnete sexuelle beziehungsweise soziale Stellung.
- source_word: σκυλεῦσαι
  choice: ausplündern
  rationale: Das Verb bedeutet grundlegend berauben, ausplündern oder entkleiden. „Ausplündern“ wahrt diesen breiteren Wortsinn; eine mögliche sexuelle Dimension der Kriegsgewalt wird in der Fußnote kenntlich gemacht, aber nicht in den Haupttext hineingelesen.
theological_decisions:
- issue: Ob die Gewalt gegen die Jungfrauen im Haupttext ausdrücklich als sexuelle Gewalt bezeichnet werden soll
  choice: meine Jungfrauen ausplündern
  alternative: meine Jungfrauen schänden
  rationale: σκυλεῦσαι bezeichnet primär das Berauben, Ausplündern oder Entkleiden und ist kein eindeutig spezifisches Verb für Vergewaltigung. Der Haupttext erhält daher die lexikalische Breite; die im Kontext möglicher Kriegsgewalt naheliegende sexuelle Konnotation wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der Konjunktiv I kennzeichnet die Drohung als berichtete Rede. Die Reihung der Gewalttaten bleibt knapp und eindringlich; altertümliche Ausdrücke werden vermieden, während die poetische Parallelstruktur erhalten bleibt.
