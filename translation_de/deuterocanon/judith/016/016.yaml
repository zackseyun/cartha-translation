base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/016.yaml
  text: For every sacrifice for a pleasing aroma is a small thing[a], and all fat for your whole burnt offering is very little; but the one who fears the Lord is great forever.
translation:
  language: de
  text: Denn jedes Opfer, das einen wohlgefälligen Duft verbreitet, ist gering, und alles Fett, das dir als Ganzbrandopfer dargebracht wird, ist äußerst gering; wer aber den Herrn fürchtet, ist allezeit groß.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für immer«; die griechische Wendung kann sowohl fortwährende Dauer als auch bleibende Beständigkeit bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: μικρὸν
  choice: gering
  rationale: Das prädikative Adjektiv bewertet den relativen Wert des Opfers. »Gering« wahrt den Kontrast zu »groß«, ohne Opfer als wertlos zu bezeichnen.
- source_word: θυσία
  choice: Opfer
  rationale: Direkte und im kultischen Zusammenhang geläufige Wiedergabe.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: zum Wohlgeruch
  rationale: Bewahrt die kultische Duftmetaphorik knapp und würdig; gemeint ist der angenehme beziehungsweise wohlgefällige Opferduft.
- source_word: ἐλάχιστον
  choice: verschwindend wenig
  rationale: Gibt die verstärkende superlativische Aussage idiomatisch wieder und hebt die Steigerung gegenüber »gering« hervor.
- source_word: στέαρ
  choice: Fett
  rationale: Bezeichnet das beim Opfer dargebrachte Fett; die wörtliche Wiedergabe ist im Kontext verständlich.
- source_word: ὁλοκαύτωμά
  choice: Ganzbrandopfer
  rationale: Bezeichnet ein Opfer, das vollständig verbrannt wird, und ist genauer als das allgemeinere »Brandopfer«.
- source_word: σοι
  choice: für dich
  rationale: Gibt den Dativ der direkten Beziehung zu Gott natürlich wieder.
- source_word: ὁ δὲ φοβούμενος τὸν κύριον
  choice: wer aber den Herrn fürchtet
  rationale: Gibt das substantivierte Partizip als allgemeingültige Aussage in natürlichem Deutsch wieder.
- source_word: μέγας
  choice: ist groß
  rationale: Bewahrt den ausdrücklich rhetorischen Gegensatz zwischen der Geringheit der Opfergaben und der Größe des Gottesfürchtigen.
- source_word: διὰ παντός
  choice: allezeit
  rationale: Die Wendung kann ununterbrochene Dauer oder bleibende Beständigkeit ausdrücken. »Allezeit« erhält diese zeitliche Offenheit besser als eine ausschließlich auf endlose Dauer festgelegte Formulierung.
theological_decisions:
- issue: Relativer Wert des Opfers gegenüber der Furcht des Herrn
  choice: Die Opfergaben werden vergleichsweise als gering bezeichnet, während der Mensch, der den Herrn fürchtet, groß ist.
  alternative: Die Aussage könnte besonders die Unzulänglichkeit von Opfern ohne Gottesfurcht hervorheben, statt Opfer an sich abzuwerten.
  rationale: Der griechische Text stellt die Geringheit der Opfergaben unmittelbar der Größe des Gottesfürchtigen gegenüber. Die Übersetzung wahrt diesen Gegensatz, ohne eine grundsätzliche Ablehnung des Opferkults hineinzulesen.
- issue: Wiedergabe von κύριον
  choice: den Herrn
  alternative: den Gebieter
  rationale: »Herr« ist im griechisch-jüdischen Gottesbezug die übliche ehrerbietige Wiedergabe und passt zum unmittelbaren Kontext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper kultischer Fachsprache. »Ganzbrandopfer« erhält die sachliche Präzision; »Wohlgeruch« bewahrt bewusst die biblische Opfermetaphorik. Der Satzbau folgt dem antithetischen Aufbau des Griechischen.
