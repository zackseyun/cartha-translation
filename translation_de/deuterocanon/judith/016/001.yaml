  rationale: Die Revision ersetzt die ungrammatische beziehungsweise unübliche Wendung „wohlgeordnet anstimmen“ durch eine verständliche musikalische Wiedergabe, deren interpretativer Spielraum in der Fußnote ausgewiesen ist. Außerdem werden die Dative natürlicher und näher am griechischen Wortlaut wiedergegeben und das gemeinsame Objekt des Schlusses erhalten. Das ergänzte „ein Lied“ bleibt als für das Deutsche erforderliche, aus dem musikalischen Imperativ erschließbare Ergänzung markiert.
