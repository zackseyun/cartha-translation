  terminology: „Tamburinen“, „Zimbeln“, „Herr“, „Psalm“ und „Lobpreis“ sind im gegebenen kultisch-hymnischen Register angemessen. „Singt dem Herrn“ und „meinem Gott“ geben die Dative idiomatisch und quellennah wieder.
