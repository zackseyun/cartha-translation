base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/001.yaml
  text: Begin the song to my God with tambourines[a]; sing to the Lord with cymbals; fit to him a psalm and praise[b]; exalt and call upon his name.
translation:
  language: de
  text: Stimmt meinem Gott mit Tamburinen ein Lied an[a], singt dem Herrn mit Zimbeln! Singt ihm einen Psalm und Lobpreis in Harmonie[b], erhebt und ruft seinen Namen an!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebt meinem Gott mit Tamburinen den Einsatz“ beziehungsweise „Beginnt für meinen Gott mit Tamburinen“. Das griechische Verb ist ein musikalischer Befehl, einen Gesang zu beginnen oder anzuführen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Fügt ihm einen Psalm und Lobpreis harmonisch zusammen“ beziehungsweise „Ordnet ihm Psalm und Lobpreis“. Das Verb bezeichnet ein Abstimmen, Zusammenfügen oder musikalisches Einrichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξάρχετε
  choice: Stimmt … ein Lied … an
  rationale: Der pluralische Imperativ bezeichnet im musikalischen Zusammenhang das Beginnen oder Anführen eines Gesangs. Das im Griechischen nur mitgedachte Lied wird für natürliches Deutsch knapp ergänzt.
- source_word: τῷ θεῷ μου
  choice: für meinen Gott
  rationale: Der Dativ bezeichnet hier den Adressaten beziehungsweise den, dem der Gesang gilt; der persönliche Possessivbezug bleibt erhalten.
- source_word: ἐν τυμπάνοις
  choice: mit Tamburinen
  rationale: τύμπανον bezeichnet eine Handtrommel beziehungsweise ein Tamburin; „Tamburinen“ ist modern und verständlich.
- source_word: ᾄσατε τῷ κυρίῳ ἐν κυμβάλοις
  choice: singt für den Herrn mit Zimbeln
  rationale: Der einfache Singbefehl und der instrumentale Sinn von ἐν werden direkt wiedergegeben.
- source_word: ἐναρμόσασθε
  choice: Stimmt … wohlgeordnet an
  rationale: Die Wendung wahrt sowohl den musikalischen Zusammenhang als auch den Grundgedanken des Zusammenfügens, Abstimmens oder harmonischen Einrichtens.
- source_word: ψαλμὸν καὶ αἶνον
  choice: Psalm und Lobpreis
  rationale: ψαλμός bleibt als liturgischer „Psalm“ erhalten; αἶνος wird idiomatisch und substantivisch mit „Lobpreis“ wiedergegeben.
- source_word: ὑψοῦτε
  choice: erhebt
  rationale: Das Verb fordert im Lobkontext dazu auf, den Namen Gottes hoch zu preisen; „erhebt“ erhält das Bild des griechischen Ausdrucks.
- source_word: ἐπικαλεῖσθε τὸ ὄνομα αὐτοῦ
  choice: ruft ihn an
  rationale: Im Deutschen ist „jemanden anrufen“ in diesem Gebetskontext natürlicher als „seinen Namen anrufen“. Der Parallelbezug auf Gottes Namen bleibt im ersten Verbum ausdrücklich erhalten.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte, kontextgerechte Wiedergabe in der an Gott gerichteten Lobpreisrede, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Gemeinsames Objekt von ὑψοῦτε und ἐπικαλεῖσθε
  choice: „seinen Namen“ ausdrücklich bei „erhebt“, Gott selbst pronominal bei „ruft ihn an“
  alternative: „erhebt und ruft seinen Namen an“
  rationale: Das griechische Objekt kann syntaktisch auf beide Verben bezogen werden. Die deutsche Fassung bewahrt den Namensbezug, vermeidet aber die missverständliche Aussage, der Name selbst werde angerufen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit hymnischem Rhythmus. Die parallelen pluralischen Imperative werden erhalten; leicht altertümliche Instrumentenbezeichnungen wie „Pauken“ oder „Schellen“ werden vermieden.
