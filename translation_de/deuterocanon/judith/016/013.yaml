  yaml_path: translation/deuterocanon/judith/016/013.yaml
  text: I will sing to my God a new hymn[a]. Lord, you are great and glorious, marvelous in strength[b], unsurpassable.
translation:
  language: de
  text: Ich will meinem Gott ein neues Loblied singen.[a] Herr, du bist groß und herrlich, wunderbar in deiner Kraft und unübertroffen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein neues Lied“. Das griechische Wort ὕμνος bezeichnet genauer einen Lobgesang oder Hymnus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unüberwindlich“. Das griechische Wort ἀνυπέρβλητος bezeichnet jemanden, der nicht übertroffen oder überwunden werden kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσω
  choice: ich will … singen
  rationale: Das griechische Futur von ὑμνέω bezeichnet das Singen zum Lob Gottes. Die deutsche Verbindung mit dem Objekt „Loblied“ gibt diesen Sinn natürlich und klar wieder.
- source_word: τῷ θεῷ μου
  choice: meinem Gott
  rationale: Der Dativ bezeichnet den, dem das Lied gilt. Im Deutschen drückt „meinem Gott … singen“ diese Beziehung ohne zusätzliche Präposition idiomatisch aus.
- source_word: ὕμνον καινόν
  choice: ein neues Loblied
  rationale: ὕμνος bezeichnet spezifischer einen Lobgesang als das allgemeinere „Lied“. „Loblied“ bewahrt diese Bedeutung in natürlichem modernem Deutsch.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ redet Gott unmittelbar an. „Herr“ ist die direkte, etablierte deutsche Wiedergabe; ein zusätzliches „O“ ist im modernen Deutsch nicht nötig.
- source_word: μέγας
  choice: groß
  rationale: Die direkte und in diesem Lobpreiszusammenhang natürliche Entsprechung.
- source_word: ἔνδοξος
  choice: herrlich
  rationale: Im doxologischen Kontext bezeichnet das Wort Herrlichkeit, Ehre und Glanz; „herrlich“ bewahrt dieses Bedeutungsfeld.
- source_word: θαυμαστὸς ἐν ἰσχύι
  choice: wunderbar in deiner Kraft
  rationale: θαυμαστός bezeichnet etwas, das Staunen und Bewunderung hervorruft; ἐν ἰσχύι benennt den Bereich der Kraft. Das ergänzte „deiner“ macht den Bezug im Deutschen natürlich, ohne den Sinn zu verändern.
- source_word: ἀνυπέρβλητος
  choice: unübertroffen
  rationale: Das Adjektiv bezeichnet jemanden, der nicht übertroffen oder überwunden werden kann. „Unübertroffen“ erhält die breite Aussage und verengt sie nicht auf militärische Unbesiegbarkeit.
theological_decisions:
- issue: Wiedergabe von κύριος in der unmittelbaren Anrede Gottes
  choice: Herr
  alternative: O Herr
  rationale: Κύριε ist ein Vokativ und richtet sich direkt an Gott. „Herr“ bewahrt den Titel und klingt in modernem Deutsch natürlich; „O“ wäre eine mögliche, aber stilistisch feierlichere Ergänzung.
- issue: Reichweite von ἀνυπέρβλητος
  choice: unübertroffen
  alternative: unüberwindlich
  rationale: Die Formulierung kann sowohl das Nichtübertroffenwerden als auch das Nichtüberwundenwerden einschließen. „Unübertroffen“ lässt die umfassende Aussage stehen, während „unüberwindlich“ sie stärker auf Macht und Sieg zuspitzt.
translation_notes:
  register: Moderne, würdige Lobpreissprache mit klarer Satzführung. „Loblied“ bewahrt die spezifische Bedeutung von ὕμνος, ohne so fachsprachlich wie „Hymnus“ zu wirken. Die koordinierende Verbindung vor „unübertroffen“ ist im Deutschen natürlich und stellt alle Prädikate als Aussagen über den angeredeten Herrn dar.
