  text: Denn sie legte ihre Witwentracht ab, um die Leidenden in Israel aufzurichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Erhöhung der Leidenden in Israel“. Die griechische Wendung εἰς ὕψος ist stark verdichtet; „aufzurichten“ bewahrt das Bild des Emporhebens, während „zur Erhöhung“ formaler übersetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδύσατο
  choice: legte … ab
  rationale: Die mediale Form bezeichnet das Ablegen der eigenen Kleidung. „Legte … ab“ ist im Deutschen natürlich und gibt die konkrete Handlung präzise wieder.
- source_word: στολὴν χηρεύσεως
  choice: Witwentracht
  rationale: Die Genitivverbindung bezeichnet die für ihren Witwenstand kennzeichnende Kleidung. „Witwentracht“ ist knapp, verständlich und wahrt den Bezug auf ihren gesellschaftlich sichtbaren Stand.
- source_word: εἰς ὕψος
  choice: um … aufzurichten
  rationale: Die wörtlich auf „Höhe“ beziehungsweise „Erhöhung“ zielende, stark verdichtete Wendung bezeichnet hier Zweck oder Ergebnis. „Aufzurichten“ bewahrt das Bild des Emporhebens und klingt im Deutschen natürlich.
- source_word: τῶν πονούντων
  choice: die Leidenden
  rationale: Das Partizip kann Menschen bezeichnen, die Mühsal, Schmerz oder Bedrängnis erfahren. „Die Leidenden“ erhält diese Bedeutungsbreite, ohne sie auf körperlichen Schmerz oder Arbeit einzuengen.
- source_word: ἐν Ἰσραήλ
  choice: in Israel
  rationale: Die Präpositionalphrase wird direkt und ihrem örtlich-korporativen Sinn entsprechend wiedergegeben.
