base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/021.yaml
  text: After these days[a], each one returned to his own inheritance, and Judith went away to Bethulia and remained on her own property[c][b], and in her time she became renowned throughout all the land.
translation:
  language: de
  text: Nach diesen Tagen brach jeder zu seinem Erbbesitz auf[a]. Judit ging nach Betulia und blieb auf ihrem eigenen Besitz[b]. Zu ihrer Zeit wurde sie im ganzen Land hoch angesehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu seinem zugewiesenen Land“; das griechische Wort kann ein Erbteil, einen zugewiesenen Anteil oder Besitz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf ihrem Anwesen“; gemeint ist Judits eigener Besitz beziehungsweise ihre Liegenschaft.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „berühmt“ oder „ruhmreich“; das griechische Wort betont das öffentliche Ansehen und die ihr erwiesene Ehre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Nach diesen Tagen
  rationale: Die Wendung bildet einen zeitlichen Übergang und gibt ἡμέρας ausdrücklich als „Tage“ wieder.
- source_word: ἀνέζευξεν
  choice: brach … auf
  rationale: Das Verb bezeichnet ursprünglich das Aufbrechen beziehungsweise den Abmarsch und vermeidet die im griechischen Wort nicht ausdrücklich enthaltene Festlegung auf „kehrte zurück“.
- source_word: ἕκαστος εἰς τὴν κληρονομίαν αὐτοῦ
  choice: jeder zu seinem Erbteil
  rationale: „Jeder“ bewahrt den distributiven Sinn; „Erbteil“ gibt κληρονομία als zugewiesenen oder ererbten Besitz wieder und erhält den biblischen Landbezug.
- source_word: ἀπῆλθεν εἰς Βαιτυλουὰ
  choice: ging nach Betulia
  rationale: Die natürliche deutsche Formulierung bezeichnet das Fortgehen zum genannten Ziel, ohne das Verb unnötig schwer wiederzugeben.
- source_word: κατέμεινεν ἐπὶ τῆς ὑπάρξεως αὐτῆς
  choice: blieb auf ihrem eigenen Besitz
  rationale: κατέμεινεν bezeichnet fortdauernden Aufenthalt; ὕπαρξις meint hier ihren Besitz beziehungsweise ihre Liegenschaft.
- source_word: κατὰ τὸν καιρὸν αὐτῆς
  choice: Zu ihrer Zeit
  rationale: Die knappe Wiedergabe wahrt die mögliche Bedeutung ihres Lebensabschnitts oder ihrer Generation, ohne sie enger auf die gesamte Lebenszeit festzulegen.
- source_word: ἔνδοξος
  choice: hoch angesehen
  rationale: Im Zusammenhang bezeichnet das Wort eine öffentlich anerkannte, ehrenvolle Stellung; „hoch angesehen“ bewahrt diesen Ehraspekt besser als bloßes „berühmt“.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: im ganzen Land
  rationale: γῆ bezeichnet hier das Land beziehungsweise Gebiet, nicht notwendig die ganze Erde.
theological_decisions:
- issue: Bedeutung von κληρονομία im Zusammenhang der Heimkehr
  choice: Erbteil
  alternative: zugewiesenes Land; Besitz
  rationale: „Erbteil“ erhält den für biblische Landverteilung typischen Bedeutungsraum, ohne festzulegen, ob es sich im Einzelfall um Erbschaft oder Zuteilung handelt.
- issue: Ehrenprädikat ἔνδοξος für Judit
  choice: hoch angesehen
  alternative: ruhmreich; berühmt
  rationale: Die Formulierung beschreibt ihre öffentliche Ehre im Land, ohne ihr einen besonderen theologischen Begriff von Herrlichkeit zuzuschreiben.
