  register: Modernes, würdevolles Standarddeutsch mit leicht bibelsprachlicher Färbung. Die Satzfolge wurde zur besseren deutschen Lesbarkeit gegliedert; alle Aussagen und ihre Reihenfolge bleiben erhalten. Die Fußnotenmarker wurden den tatsächlich erläuterten Ausdrücken zugeordnet.
