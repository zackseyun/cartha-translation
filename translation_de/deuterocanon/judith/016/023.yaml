base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/023.yaml
  text: And she continued to prosper greatly[a], and she grew old in her husband's house for one hundred five years, and she set her maidservant free. Then she died in Bethulia[b], and they buried her in the cave of her husband Manasseh.
translation:
  language: de
  text: Und sie nahm weiterhin sehr an Bedeutung zu[a] und wurde im Haus ihres Mannes hundertfünf Jahre alt. Sie ließ ihre Dienerin frei. Dann starb sie in Betulia, und man bestattete sie in der Grabhöhle ihres Mannes Manasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Und sie schritt voran und wurde überaus groß.« Die griechische Wendung kann auch ausdrücken, dass es mit ihr weiterhin sehr aufwärtsging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προβαίνουσα μεγάλη σφόδρα
  choice: gelangte zu sehr hohem Ansehen
  rationale: προβαίνω bezeichnet ein Voranschreiten, μεγάλη σφόδρα das in hohem Maß erreichte Großsein. Im Zusammenhang ist gesellschaftliches Ansehen wahrscheinlich; die Fußnote bewahrt die offenere wörtliche Bedeutung.
- source_word: ἐγήρασεν ... ἔτη ἑκατὸν πέντε
  choice: wurde ... hundertfünf Jahre alt
  rationale: Die natürliche deutsche Formulierung gibt die Altersangabe wieder, ohne den missverständlichen Eindruck zu erwecken, Judith habe 105 Jahre lang im Haus ihres Mannes gewohnt.
- source_word: ἐν τῷ οἴκῳ τοῦ ἀνδρὸς αὐτῆς
  choice: im Haus ihres Mannes
  rationale: Formnahe und im Deutschen klare Wiedergabe; »Haus« kann dabei auch den Haushalt und Lebensbereich bezeichnen.
- source_word: ἀφῆκεν τὴν ἅβραν αὐτῆς ἐλευθέραν
  choice: Ihre Dienerin ließ sie frei
  rationale: ἅβρα bezeichnet eine weibliche persönliche Bedienstete; ἐλευθέραν und ἀφῆκεν machen deutlich, dass es sich um eine rechtlich unfreie Abhängige handelte.
- source_word: εἰς Βαιτυλουὰ
  choice: in Betulia
  rationale: εἰς wird hier bei dem Verb des Sterbens idiomatisch als Ortsangabe verstanden.
- source_word: ἐν τῷ σπηλαίῳ
  choice: in der Grabhöhle
  rationale: σπήλαιον bedeutet wörtlich »Höhle«; der Bestattungskontext rechtfertigt das präzisierende deutsche Kompositum.
theological_decisions:
- issue: Sozialer Status von Judiths Dienerin
  choice: Dienerin im Haupttext, verbunden mit »ließ sie frei«
  alternative: Sklavin; Magd
  rationale: »Dienerin« gibt die Funktion von ἅβρα würdig und verständlich wieder, während die Freilassung den unfreien Status ausdrücklich erkennen lässt. Dadurch wird weder die Abhängigkeit verharmlost noch ein anderer griechischer Sklavenbegriff vorgetäuscht.
- issue: Art von Judiths Größe im Alter
  choice: hohes Ansehen
  alternative: sie wurde überaus groß; es ging mit ihr sehr aufwärts
  rationale: Der Zusammenhang legt fortschreitende Bedeutung oder gesellschaftliches Ansehen nahe, doch die ungewöhnliche und mehrdeutige griechische Wendung wird durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt erzählerisch knapp; »Grabhöhle« verdeutlicht den Bestattungskontext. Der einzige Fußnotenmarker [a] steht im Haupttext.
