lexical_decisions:
- source_word: ἀνέθηκεν
  choice: weihte
  rationale: Das Verb bezeichnet hier die kultische Übereignung von Gegenständen an Gott. „Weihte“ gibt diesen Sinn knapp und natürlich wieder, ohne einen Opferakt im engeren Sinn zu behaupten.
- source_word: σκεύη
  choice: Ausrüstungsgegenstände
  rationale: Der Plural umfasst Geräte, Ausrüstung oder sonstige Gegenstände. Im Zusammenhang mit den Habseligkeiten des Heerführers ist „Ausrüstungsgegenstände“ breit genug und vermeidet die Verengung auf Gefäße.
- source_word: κωνώπιον
  choice: Baldachinnetz
  rationale: Das Wort bezeichnet ursprünglich ein gegen Mücken schützendes Netz und kann damit den netzartigen Vorhang beziehungsweise Baldachin über einem Bett meinen. „Baldachinnetz“ bewahrt beide Bedeutungsanteile besser als das unspezifische „Baldachin“.
- source_word: κοιτῶνος
  choice: Schlafgemach
  rationale: κοιτών bezeichnet einen Schlafraum oder ein Schlafzimmer. „Schlafgemach“ entspricht dem würdigen Erzählregister und bleibt verständlich.
- source_word: εἰς ἀνάθημα
  choice: als Weihegabe
  rationale: ἀνάθημα ist ein einer Gottheit geweihter Gegenstand, teils eine Gelübde- oder Votivgabe. „Weihegabe“ erhält den kultischen Gehalt, ohne ein vorausgehendes Gelübde ausdrücklich vorauszusetzen.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet den Empfänger der Übergabe beziehungsweise Weihung; im Deutschen ist „Gott übergeben“ idiomatisch.
theological_decisions:
- issue: Kultische Sprache der Weihung
  choice: Die Gegenstände werden als Gott geweihte Sachen bezeichnet, ohne sie als Schlachtopfer darzustellen.
  alternative: Technischer als „Votivgabe“ oder allgemeiner nur als „Gabe“ übersetzen.
  rationale: ἀνέθηκεν und ἀνάθημα markieren eine religiöse Weihung. „weihte“ und „Weihegabe“ erhalten diese Verbindung, ohne Tempelverfahren, Gelübde oder Opferkategorien hinzuzufügen.
- issue: Bezug von τῷ θεῷ
  choice: „Gott“ wird unmittelbar mit „übergab“ verbunden.
  alternative: Bereits beim ersten Verb ausdrücklich „Gott weihte“ formulieren.
  rationale: Im griechischen Satz steht τῷ θεῷ ausdrücklich bei der zweiten Handlung. Die deutsche Fassung erhält diese Zuordnung und lässt zugleich den kultischen Sinn des ersten Verbs bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Wechsel zwischen der allgemeinen Weihung der Ausrüstung und der besonders hervorgehobenen Übergabe des Baldachinnetzes. Die Wiederholung verwandter Weihbegriffe bildet die lexikalische Verbindung zwischen ἀνέθηκεν und ἀνάθημα ab.
