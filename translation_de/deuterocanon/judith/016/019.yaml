  text: And Judith dedicated to God all the equipment of Holofernes that the people had given her[b][a], and she gave to God as a dedicated offering the canopy that she had taken for herself from his bedchamber.
translation:
  language: de
  text: Und Judit weihte Gott alle Gegenstände des Holofernes, die das Volk ihr gegeben hatte, und den Betthimmel[a], den sie für sich aus seinem Schlafgemach genommen hatte, gab sie Gott als Weihegabe[b].
