  text: And the house of Israel mourned for her seven days. And before she died, she divided her possessions among all who were nearest of kin to Manasseh her husband and to those nearest of kin of her family.
translation:
  language: de
  text: Und das Haus Israel trauerte sieben Tage um sie. Noch vor ihrem Tod verteilte sie ihren Besitz an alle nächsten Verwandten ihres Mannes Manasse und an die nächsten Verwandten ihrer eigenen Familie.[a]
  philosophy: optimal-equivalence
  footnotes:
