    text: 'Oder: „an alle, die mit ihrem Mann Manasse am nächsten verwandt waren, und an die, die mit ihrer eigenen Familie am nächsten verwandt waren.“ Die griechische Formulierung ist knapp und lässt die genaue Zuordnung der genannten Angehörigen offen.'
