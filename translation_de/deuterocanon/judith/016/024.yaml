lexical_decisions:
- source_word: ἐπένθησεν
  choice: trauerte … um sie
  rationale: Das Verb bezeichnet die Trauer um eine Verstorbene; die deutsche Verbindung „um jemanden trauern“ gibt den Sinn natürlich und genau wieder.
- source_word: οἶκος Ἰσραήλ
  choice: das Haus Israel
  rationale: Die Wiedergabe bewahrt die biblische Kollektivbezeichnung und bezeichnet Israel als Ganzes.
- source_word: ἡμέρας ἑπτά
  choice: sieben Tage
  rationale: Der Akkusativ bezeichnet die Dauer; im Deutschen ist die adverbiale Form ohne zusätzliche Präposition idiomatisch.
- source_word: διεῖλεν
  choice: verteilte
  rationale: Im Zusammenhang mit einem Nachlass bezeichnet das Verb die Aufteilung beziehungsweise Zuweisung von Besitz; „verteilte“ klingt im Deutschen natürlicher als „teilte“.
- source_word: τὰ ὑπάρχοντα αὐτῆς
  choice: ihren Besitz
  rationale: Die substantivierte Wendung bezeichnet das, was ihr gehörte; „Besitz“ ist klar, umfassend und für einen Nachlass passend.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτήν
  choice: noch vor ihrem Tod
  rationale: Die Konstruktion bezeichnet Vorzeitigkeit. „Noch vor ihrem Tod“ ist eine natürliche und knappe deutsche Wiedergabe.
- source_word: πᾶσι τοῖς ἔγγιστα
  choice: an alle nächsten Verwandten
  rationale: Das substantivisch gebrauchte ἔγγιστα bezeichnet die in der Verwandtschaft Nächststehenden; der Erbkontext legt „nächste Verwandte“ nahe.
- source_word: Μανασσῆ τοῦ ἀνδρὸς αὐτῆς
  choice: ihres Mannes Manasse
  rationale: Der Genitiv verbindet die Nächststehenden mit Manasse; die Apposition weist ihn als Judiths Ehemann aus.
- source_word: τοῦ γένους αὐτῆς
  choice: ihrer eigenen Familie
  rationale: γένος kann Familie, Sippe oder Abstammungsverband bezeichnen. „Familie“ ist allgemein verständlich; „eigenen“ verdeutlicht den Gegensatz zur Familie ihres Mannes, ohne eine engere soziale Struktur festzulegen.
