base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/015.yaml
  text: For mountains will be shaken from their foundations with the waters[a], and rocks will melt like wax before your face; yet to those who fear you, you are gracious.
translation:
  language: de
  text: Denn Berge werden von ihren Grundfesten samt den Wassern erschüttert werden, und Felsen werden vor deinem Angesicht[a] wie Wachs zerschmelzen; doch denen, die dich fürchten, bist du gnädig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: »vor dir«. Das Griechische lautet wörtlich: »vor deinem Angesicht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄρη
  choice: Berge
  rationale: Die gewöhnliche konkrete Bedeutung bewahrt das kosmische Bild des griechischen Textes.
- source_word: ἐκ θεμελίων
  choice: von ihren Grundfesten
  rationale: Die Wendung bezeichnet eine Erschütterung vom untersten Fundament her; das ergänzte Possessivpronomen stellt den Bezug im Deutschen natürlich her.
- source_word: σὺν ὕδασιν
  choice: samt den Wassern
  rationale: σύν drückt Begleitung aus. »Samt« gibt dies knapp und in einem gehobenen, poetischen Register wieder.
- source_word: σαλευθήσεται
  choice: werden … erschüttert werden
  rationale: Das Passiv und die zukünftige Aussage von σαλεύω bleiben erhalten; wegen des deutschen Plurals steht das Verb im Plural.
- source_word: πέτραι
  choice: Felsen
  rationale: Im Parallelismus mit den Bergen sind größere Felsmassen gemeint, nicht kleine Steine.
- source_word: ἀπὸ προσώπου σου
  choice: vor deinem Angesicht
  rationale: Die konkrete anthropomorphe Redeweise des Griechischen wird bewahrt; eine idiomatischere Fassung steht in der Fußnote.
- source_word: ὡς κηρός
  choice: wie Wachs
  rationale: Die geläufige deutsche Vergleichsform gibt das Bild unmittelbar wieder.
- source_word: τακήσονται
  choice: werden … zerschmelzen
  rationale: Das Verb bezeichnet Schmelzen oder Sichauflösen; »zerschmelzen« passt zum poetischen Register und erhält das Zukunftstempus.
- source_word: ἔτι δὲ
  choice: doch
  rationale: Die Konjunktion markiert den Gegensatz zwischen kosmischer Erschütterung und Gottes gnädiger Zuwendung.
- source_word: τοῖς φοβουμένοις σε
  choice: denen, die dich fürchten
  rationale: Die biblische Rede von der Gottesfurcht bleibt erhalten und wird nicht auf bloßen Respekt eingeengt.
- source_word: εὐιλατεύεις αὐτοῖς
  choice: denen … bist du gnädig
  rationale: Das seltene Verb bezeichnet eine gnädige, wohlwollende Haltung. Der vorangestellte Dativ gibt αὐτοῖς im Deutschen ausreichend wieder.
theological_decisions:
- issue: Wiedergabe von τοῖς φοβουμένοις σε
  choice: denen, die dich fürchten
  alternative: denen, die dich verehren
  rationale: »Fürchten« erhält die biblische Spannung von Ehrfurcht, Scheu und Gottesverehrung, statt sie auf Verehrung allein festzulegen.
- issue: Wiedergabe von ἀπὸ προσώπου σου
  choice: vor deinem Angesicht
  alternative: vor dir
  rationale: Der Haupttext bewahrt die konkrete Rede vom göttlichen Angesicht; die idiomatischere Alternative wird als Fußnote angegeben.
- issue: Wiedergabe von εὐιλατεύεις
  choice: bist du gnädig
  alternative: erweist du ihnen Erbarmen
  rationale: »Gnädig« lässt die breite Bedeutung einer wohlwollenden und erbarmenden Zuwendung bestehen, ohne sie auf einen einzelnen theologischen Fachbegriff zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Klang. Die Parallelität der Naturbilder, das Futur und der Kontrast zur gnädigen Zuwendung Gottes bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die Anmerkung bezieht.
