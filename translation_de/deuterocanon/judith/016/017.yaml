  yaml_path: translation/deuterocanon/judith/016/017.yaml
  text: Woe to the nations rising up against my people[a]; the Lord Almighty will take vengeance on them in the day of judgment, to put fire and worms in their flesh[b], and they will weep in pain forever.
translation:
  language: de
  text: Wehe den Völkern, die sich gegen mein Volk erheben![a] Der Herr, der Allmächtige, wird an ihnen am Tag des Gerichts Vergeltung üben, um Feuer und Würmer in ihr Fleisch zu legen; und sie werden unter Schmerzen[b] in Ewigkeit weinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Verwandtschaft“, „mein Geschlecht“ oder „meine Nation“. Das griechische γένος bezeichnet hier Judiths eigene Volks- und Abstammungsgemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „in Empfindung“ oder „in Wahrnehmung“. Im Zusammenhang der körperlichen Strafe bezeichnet die Wendung wahrscheinlich schmerzhafte Empfindung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ἔθνεσιν
  choice: Wehe den Völkern
  rationale: „Wehe“ bewahrt den prophetischen Klage- und Gerichtston; „Völker“ bezeichnet hier fremde, feindliche Volksgruppen, ohne den späteren Gegensatz „Juden/Heiden“ einzutragen.
- source_word: ἐπανισταμένοις τῷ γένει μου
  choice: die sich gegen mein Volk erheben
  rationale: Die Formulierung erhält das Bild eines feindlichen Sich-Erhebens. γένος meint hier Judiths eigene Abstammungs- und Volksgemeinschaft; „Volk“ ist im heutigen Deutsch klarer als „Geschlecht“ oder „Rasse“.
- source_word: Κύριος Παντοκράτωρ
  choice: der Herr, der Allmächtige
  rationale: Die appositionelle Wiedergabe ist natürlich und würdevoll und erhält Παντοκράτωρ als göttlichen Hoheitstitel.
- source_word: ἐκδικήσει αὐτούς
  choice: wird an ihnen Vergeltung üben
  rationale: Die Wendung bewahrt den retributiven und gerichtlichen Sinn des Verbs, ohne ihn auf bloße Strafe oder private Rache zu verengen.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: am Tag des Gerichts
  rationale: Dies ist eine natürliche deutsche Wiedergabe der gerichtlichen Zeitangabe und bewahrt ihre mögliche endzeitliche Tragweite.
- source_word: δοῦναι πῦρ καὶ σκώληκας εἰς σάρκας αὐτῶν
  choice: Er wird Feuer und Würmer in ihr Fleisch geben
  rationale: Der Infinitiv wird als inhaltliche Entfaltung der Vergeltung wiedergegeben. „In ihr Fleisch geben“ hält die ungewöhnliche und drastische Bildsprache des Griechischen fest.
- source_word: κλαύσονται ἐν αἰσθήσει
  choice: sie werden unter Schmerzen weinen
  rationale: κλαύσονται bedeutet „weinen/klagen“; αἴσθησις bezeichnet Wahrnehmung oder Empfindung und legt im Zusammenhang körperlicher Pein Schmerzen nahe, ohne dass diese Kontextdeutung im Haupttext als einzig mögliche lexikalische Bedeutung ausgegeben wird.
- source_word: ἕως αἰῶνος
  choice: in Ewigkeit
  rationale: Die traditionelle, im modernen Bibeldeutsch weiterhin verständliche Formulierung gibt die Aussage einer unbegrenzten Dauer mit dem vollen Ernst des Textes wieder.
theological_decisions:
- issue: Art und Dauer des göttlichen Gerichts
  choice: Die schwere körperliche Strafbildsprache und die Dauerangabe werden ungekürzt als „unter Schmerzen weinen in Ewigkeit“ wiedergegeben.
  alternative: „bei vollem Empfinden weinen bis in den Äon“ oder „in Qual klagen für ein Zeitalter“
  rationale: Der Text darf weder abgeschwächt noch durch spätere Lehrbegriffe systematisiert werden. αἴσθησις bleibt lexikalisch weiter als „Schmerz“, während der unmittelbare Zusammenhang diese kontextuelle Wiedergabe stützt; ἕως αἰῶνος wird gemäß seiner Aussagekraft idiomatisch als „in Ewigkeit“ übersetzt.
- issue: Bezug von γένος
  choice: „mein Volk“ bezeichnet Judiths eigene Volks- und Abstammungsgemeinschaft.
  alternative: „meine Verwandtschaft“, „mein Geschlecht“ oder „meine Nation“
  rationale: Die Wahl wahrt den kollektiven Bezug, ohne moderne biologische Rassevorstellungen oder eine engere familiäre Bedeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Gerichtston. Die Syntax wurde für gute Verständlichkeit in zwei Hauptsätze gegliedert; die drastische Bildsprache des Ausgangstextes bleibt erhalten. Alle Fußnotenmarker stehen im Haupttext.
