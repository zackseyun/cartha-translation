  source_fidelity: 'Die Übersetzung gibt die dreigliedrige Kontraststeigerung des griechischen Textes zuverlässig wieder: junge Männer, Titanensöhne und hochgewachsene Riesen stehen Judit gegenüber. „Der Mächtige unter ihnen“ trifft das substantivierte ὁ δυνατός angemessen. „Durch die Hand junger Männer“ ist eine idiomatische, gehoben-biblische Ausformung von ὑπὸ νεανίσκων und verändert die Aussage nicht wesentlich. „Machte ihn ... wehrlos“ gibt παρέλυσεν als kontextuell plausible figurative Entkräftung wieder, ohne eine medizinische Lähmung zu behaupten.'
