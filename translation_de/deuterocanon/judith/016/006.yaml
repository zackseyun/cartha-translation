base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/006.yaml
  text: For their mighty one did not fall by the hands of young men[a], nor did sons of Titans strike him, nor did tall giants set upon him; but Judith daughter of Merari disabled him with the beauty of her face.
translation:
  language: de
  text: Denn der Mächtige unter ihnen fiel nicht durch die Hand junger Männer; auch schlugen ihn keine Söhne von Titanen, und keine hochgewachsenen Riesen griffen ihn an. Vielmehr machte Judit, die Tochter Meraris, ihn durch die Schönheit ihres Gesichts wehrlos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lähmte ihn“. Das griechische Verb kann bedeuten, jemanden kraftlos, handlungsunfähig oder gelähmt zu machen, im wörtlichen wie im übertragenen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δυνατὸς αὐτῶν
  choice: der Mächtige unter ihnen
  rationale: Das substantivierte Adjektiv bezeichnet einen mächtigen Mann oder Vorkämpfer. Die Formulierung bewahrt den gehobenen, poetischen Ton, ohne ein bestimmtes militärisches Amt vorauszusetzen.
- source_word: ὑπὸ νεανίσκων
  choice: durch die Hand junger Männer
  rationale: νεανίσκοι sind junge Männer; die Wendung mit „Hand“ gibt die persönliche Urheberschaft von ὑπό in natürlichem, gehobenem Deutsch wieder.
- source_word: υἱοὶ Τιτάνων
  choice: Söhne von Titanen
  rationale: Die direkte Wiedergabe erhält die mythische Bildwelt und den Kontrast zu Judits unerwartetem Sieg.
- source_word: ἐπάταξαν αὐτόν
  choice: schlugen ihn
  rationale: Das Verb bezeichnet hier das Schlagen oder Treffen. „Schlugen ihn“ bleibt nah am Wortlaut und fügt keinen ausdrücklich resultativen Sinn wie „erschlugen“ hinzu.
- source_word: ὑψηλοὶ γίγαντες
  choice: hochgewachsene Riesen
  rationale: ὑψηλοί bezeichnet körperliche Höhe. „Hochgewachsen“ bewahrt dieses konkrete Bild und klingt im Deutschen natürlicher als „hohe Riesen“.
- source_word: ἐπέθεντο αὐτῷ
  choice: griffen ihn an
  rationale: Die mediale Wendung bedeutet, gegen jemanden vorzugehen oder ihn anzugreifen. Die gewählte Form ist klar, gegenwärtig und nicht umgangssprachlich.
- source_word: παρέλυσεν αὐτόν
  choice: machte ihn wehrlos
  rationale: Das Verb kann lähmen, entkräften oder handlungsunfähig machen. Im Zusammenhang beschreibt es, wie Judit Holofernes durch ihre Schönheit die Widerstandskraft nahm, ohne zwingend eine medizinische Lähmung zu behaupten.
- source_word: ἐν κάλλει προσώπου αὐτῆς
  choice: durch die Schönheit ihres Gesichts
  rationale: Die konkrete Nennung des Gesichts wird beibehalten; „durch“ gibt die instrumentale Bedeutung von ἐν in diesem Zusammenhang natürlich wieder.
- source_word: Ἰουδεὶθ θυγάτηρ Μεραρεί
  choice: Judit, die Tochter Meraris
  rationale: Die genealogische Bezeichnung wird transparent und idiomatisch wiedergegeben; die im Deutschen übliche Namensform „Judit“ wird verwendet.
theological_decisions:
- issue: Mythische Sprache in υἱοὶ Τιτάνων und γίγαντες
  choice: Die mythischen Bezeichnungen werden ausdrücklich als „Söhne von Titanen“ und „hochgewachsene Riesen“ wiedergegeben.
  alternative: Verallgemeinerung zu „Helden“, „Gewaltigen“ oder „starken Männern“.
  rationale: Der griechische Text steigert den Kontrast bewusst durch mythische und übermenschliche Gegner. Eine Verallgemeinerung würde die Rhetorik abschwächen.
- issue: Bedeutung von παρέλυσεν
  choice: „machte ihn wehrlos“ als kontextuell figurative Wiedergabe.
  alternative: „lähmte ihn“ als stärker formale und möglicherweise wörtliche Wiedergabe.
  rationale: Der Kontext legt nahe, dass Holofernes seiner Kraft und Handlungsfähigkeit beraubt wurde; ob das Verb eine buchstäbliche Lähmung bezeichnet, bleibt offen und wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzführung. Der erste Halbvers bewahrt den gehobenen Ausdruck „durch die Hand“, während die übrigen Verben bewusst klar und gegenwärtig bleiben. Die Wiederholung der verneinten, übermächtigen Gegner und der abschließende Gegensatz mit Judit werden deutlich erhalten.
