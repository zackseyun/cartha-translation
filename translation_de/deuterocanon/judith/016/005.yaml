  yaml_path: translation/deuterocanon/judith/016/005.yaml
  text: The Lord Almighty nullified them by the hand of a woman[a].
translation:
  language: de
  text: Der Herr, der Allmächtige, machte sie zunichte durch die Hand einer Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch eine Frau“. Die griechische Wendung „durch die Hand“ bezeichnet die vermittelnde Person oder das Mittel einer Handlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  choice: der Herr
  rationale: Die übliche und sachlich passende Wiedergabe des griechischen Gottestitels κύριος.
- source_word: Παντοκράτωρ
  choice: der Allmächtige
  rationale: Bewahrt den eigenständigen Gottestitel und gibt Gottes umfassende Macht in geläufigem, würdigem Deutsch wieder.
- source_word: ἠθέτησεν
  choice: machte sie zunichte
  rationale: ἀθετέω bezeichnet hier im Siegeszusammenhang das Außerkraftsetzen beziehungsweise Vereiteln der Feinde; „zunichtemachen“ bewahrt diese Bedeutungsbreite natürlicher als ein technisches „annullieren“.
- source_word: αὐτούς
  choice: sie
  rationale: Das Akkusativobjekt verweist auf die zuvor genannten Feinde.
- source_word: ἐν χειρὶ
  choice: durch die Hand
  rationale: Bewahrt die biblische Wendung für vermittelnde Urheberschaft beziehungsweise Instrumentalität; das natürliche „durch“ wird in der Fußnote als Alternative genannt.
- source_word: θηλείας
  choice: einer Frau
  rationale: Das substantivierte Femininum bedeutet wörtlich eine weibliche Person; im erzählerischen Zusammenhang ist „Frau“ die idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe der verbundenen Gottestitel Κύριος Παντοκράτωρ
  choice: Der Herr, der Allmächtige
  alternative: Der allmächtige Herr
  rationale: Die appositionelle Form lässt beide Titel deutlich hervortreten und bewahrt den Nachdruck auf Gottes umfassender Macht.
- issue: Vermittelte Urheberschaft in ἐν χειρὶ θηλείας
  choice: durch die Hand einer Frau
  alternative: durch eine Frau
  rationale: Die Formulierung hält zugleich Gottes Handeln und die menschliche Vermittlung fest, ohne das Verhältnis zwischen Urheber und Werkzeug weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Die Wortstellung setzt die überraschende Wendung „durch die Hand einer Frau“ ans Versende.
