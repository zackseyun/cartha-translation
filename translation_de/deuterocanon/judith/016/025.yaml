  yaml_path: translation/deuterocanon/judith/016/025.yaml
  text: And there was no longer anyone to terrify the sons of Israel in the days of Judith, and for many days after she died. Amen.
translation:
  language: de
  text: Und es gab niemanden mehr, der den Israeliten Angst einjagte, solange Judit lebte und noch viele Tage nach ihrem Tod. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐκφοβῶν
  choice: der … Angst einjagte
  rationale: 'Gibt das substantivierte Partizip und die starke Bedeutung von ἐκφοβέω natürlich wieder: Es gab niemanden, der Israel in Schrecken versetzte.'
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: den Israeliten
  rationale: Die idiomatische moderne deutsche Bezeichnung entspricht der kollektiven Bedeutung von »Söhne Israels«.
- source_word: ἐν ταῖς ἡμέραις Ἰουδείθ
  choice: solange Judit lebte
  rationale: Im Zusammenhang bezeichnet die Wendung Judits Lebenszeit; die zeitliche Beziehung wird im Deutschen klar und natürlich ausgedrückt.
- source_word: μετὰ τὸ ἀποθανεῖν αὐτὴν ἡμέρας πολλάς
  choice: noch viele Tage nach ihrem Tod
  rationale: Bewahrt die unbestimmte Zeitangabe ἡμέρας πολλάς und gibt die substantivierte Infinitivkonstruktion idiomatisch wieder.
- source_word: ἀμήν
  choice: Amen
  rationale: Übernimmt die traditionelle liturgische Schlussformel.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Judit« folgt der im Deutschen üblichen Schreibweise des Buch- und Personennamens. Die Satzstruktur wurde leicht idiomatisiert, ohne die Aussage oder die unbestimmte Dauer von »viele Tage« zu präzisieren.
