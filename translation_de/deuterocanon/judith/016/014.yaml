base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/014.yaml
  text: Let all your creation serve you; for you spoke[a], and they came to be; you sent out your Spirit, and it formed them; and there is no one who will resist your voice.
translation:
  language: de
  text: Alle deine Geschöpfe sollen dir dienen; denn du sprachst, und sie entstanden. Du sandtest deinen Geist[a] aus, und er baute sie auf; niemand wird deiner Stimme widerstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Atem“ oder „deinen Wind“. Das griechische Wort kann im Zusammenhang der Schöpfung alle drei Bedeutungen tragen.'
    reason: lexikalische Mehrdeutigkeit
lexical_decisions:
- source_word: δουλευσάτω
  choice: sollen … dienen
  rationale: Das Verb bezeichnet Dienst und Unterordnung. „Dienen“ ist bei der gesamten geschaffenen Welt natürlich und bewahrt den Gedanken ihrer Unterordnung unter Gott, ohne die im Deutschen unangemessen harte Sklavereimetaphorik aufzudrängen.
- source_word: πᾶσα ἡ κτίσις σου
  choice: alle deine Geschöpfe
  rationale: κτίσις kann die Schöpfung als Ganzes oder das einzelne Geschöpf bezeichnen. Die distributive Wiedergabe passt zum Singular mit πᾶσα und nimmt zugleich die folgenden Pluralformen natürlich auf.
- source_word: εἶπας
  choice: du sprachst
  rationale: „Sprachst“ entspricht dem gehobenen poetischen Zusammenhang und betont Gottes schöpferisches Wort.
- source_word: ἐγενήθησαν
  choice: sie entstanden
  rationale: Die Form bezeichnet das Ins-Dasein-Kommen, ohne ausdrücklich eine Passivkonstruktion mit genanntem Urheber zu erzwingen.
- source_word: ἀπέστειλας τὸ πνεῦμά σου
  choice: du sandtest deinen Geist
  rationale: ἀποστέλλω bezeichnet das Aussenden. πνεῦμα kann Geist, Atem oder Wind bedeuten; „Geist“ ist im Schöpfungszusammenhang die naheliegende Hauptlesart, während die Mehrdeutigkeit in der Fußnote erhalten bleibt.
- source_word: ᾠκοδόμησεν
  choice: er baute sie auf
  rationale: Die Wiedergabe bewahrt das konkrete Bild von οἰκοδομέω („bauen, aufbauen“) und versteht den zuvor genannten Geist als Subjekt; das Objekt wird wie im Zusammenhang aus den Geschöpfen ergänzt.
- source_word: ἀντιστήσεται τῇ φωνῇ σου
  choice: kann deiner Stimme widerstehen
  rationale: „Widerstehen“ gibt das Sich-Entgegenstellen prägnant wieder, während „Stimme“ das Bild der göttlichen Rede bewahrt. Das deutsche Modalverb drückt die kategorische Aussage idiomatisch aus.
theological_decisions:
- issue: Bedeutung von πνεῦμα im Schöpfungszusammenhang
  choice: deinen Geist
  alternative: deinen Atem / deinen Wind
  rationale: Das griechische Wort umfasst Geist, Atem und Wind und kann im biblischen Schöpfungssprachgebrauch diese Vorstellungen überblenden. Die Hauptfassung nennt den göttlichen „Geist“, ohne die anderen möglichen Sinnnuancen zu verschweigen.
- issue: Subjekt von ᾠκοδόμησεν
  choice: der ausgesandte Geist („er“)
  alternative: unpersönliche oder implizite göttliche Wirksamkeit
  rationale: Das unmittelbar vorausgehende τὸ πνεῦμά σου ist grammatisch das naheliegende Bezugswort. Die Übersetzung wahrt damit die Aussage von Gottes schöpferischem Wirken durch seinen Geist, ohne näher zu bestimmen, wie dieses Verhältnis theologisch zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Satzrhythmus. „Alle deine Geschöpfe“ vermeidet einen unnatürlichen Wechsel von der kollektiven Singularform „Schöpfung“ zu den griechischen Pluralformen. Der Fußnotenmarker steht unmittelbar bei „Geist“, auf den die Anmerkung sachlich bezogen ist.
