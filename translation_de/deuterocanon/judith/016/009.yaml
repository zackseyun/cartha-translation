  text: Her sandal captured his eye[a], and her beauty took his soul captive; the sword passed through his neck.
translation:
  language: de
  text: Ihre Sandale riss seinen Blick an sich, und ihre Schönheit nahm seine Seele gefangen; das Kurzschwert[a] fuhr durch seinen Hals.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Dolch; das griechische Wort bezeichnet ein Kurzschwert oder einen Dolch östlichen Typs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σανδάλιον
  choice: Sandale
  rationale: Die konkrete Bezeichnung der Fußbekleidung wird entsprechend dem griechischen Substantiv beibehalten.
- source_word: ἥρπασε ὀφθαλμὸν αὐτοῦ
  choice: riss seinen Blick an sich
  rationale: ἁρπάζω bezeichnet ein gewaltsames Ergreifen oder Fortreißen. Die idiomatische Wiedergabe mit »Blick« bewahrt diese kraftvolle Wirkung, ohne im Deutschen fälschlich an eine körperliche Verletzung des Auges denken zu lassen.
- source_word: κάλλος
  choice: Schönheit
  rationale: Direkte und im poetischen Zusammenhang natürliche Entsprechung für Judiths äußere Schönheit.
- source_word: ᾐχμαλώτισεν ψυχὴν αὐτοῦ
  choice: nahm seine Seele gefangen
  rationale: Die Formulierung erhält sowohl die Kriegs- und Gefangenschaftsmetaphorik des Verbs als auch ψυχή als Bezeichnung seines inneren Lebens.
- source_word: ἀκινάκης
  choice: Kurzschwert
  rationale: Das Wort bezeichnet eine kurze Klingenwaffe östlichen Typs. »Kurzschwert« ist genauer als das allgemeine »Schwert«; die mögliche Wiedergabe »Dolch« wird in der Fußnote genannt.
- source_word: διῆλθεν τὸν τράχηλον αὐτοῦ
  choice: fuhr durch seinen Hals
  rationale: Die Wendung gibt die räumliche Grundbedeutung »hindurchgehen« anschaulich wieder und vermeidet die stärker deutende Übersetzung »durchbohrte«.
theological_decisions:
- issue: Eroberungsmetaphorik in den beiden ersten Satzgliedern
  choice: Die gewaltsame Bildsprache wird mit »riss … an sich« und »nahm … gefangen« bewahrt.
  alternative: Glättung zu »zog seinen Blick auf sich« und »gewann sein Herz«.
  rationale: Das Siegeslied stellt Holofernes’ Verführung und Tod bewusst als eine Folge von Überwältigungen dar. Eine romantisierende Glättung würde die poetische Spannung und die militärische Bildwelt abschwächen.
translation_notes:
  register: Poetisch, kraftvoll und zugleich in modernem Standarddeutsch verständlich. Der Parallelismus und die Eroberungsbilder des griechischen Textes bleiben erhalten. Der Fußnotenmarker steht bei der tatsächlich erläuterten Waffenbezeichnung.
