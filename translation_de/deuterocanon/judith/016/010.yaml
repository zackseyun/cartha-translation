  text: The Persians shuddered at her boldness[a], and the Medes were shaken by her daring.
translation:
  language: de
  text: Die Perser erschauerten vor ihrer Kühnheit[a], und die Meder wurden von ihrer Verwegenheit erschüttert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen für Judits furchteinflößenden Mut zwei bedeutungsnahe Wörter: τόλμα (»Kühnheit«) und θράσος (»Verwegenheit«, auch »Dreistigkeit«). Die Übersetzung gibt sie verschieden wieder, um den Parallelismus und die mögliche Wertungsspanne zu bewahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφριξαν
  choice: erschauerten
  rationale: Das Verb φρίσσω bezeichnet ein körperlich spürbares Schaudern oder Erbeben vor Furcht. »Erschauerten« bewahrt dieses eindringliche Bild.
- source_word: Πέρσαι
  choice: die Perser
  rationale: Der substantivierte Volksname im Plural wird im Deutschen natürlich mit bestimmtem Artikel wiedergegeben.
- source_word: τὴν τόλμαν αὐτῆς
  choice: vor ihrer Kühnheit
  rationale: τόλμα kann Kühnheit, Wagemut oder Dreistigkeit bezeichnen. »Kühnheit« lässt die Wertung offen und passt idiomatisch als Ursache des Erschauerns.
- source_word: Μῆδοι
  choice: die Meder
  rationale: Der substantivierte Volksname wird direkt und idiomatisch wiedergegeben.
- source_word: τὸ θράσος αὐτῆς
  choice: von ihrer Verwegenheit
  rationale: θράσος bezeichnet kühnes, bisweilen vermessenes Wagen. »Verwegenheit« wahrt diese mögliche Spannung und variiert zugleich den nahezu synonymen Parallelbegriff τόλμα.
- source_word: ἐρράχθησαν
  choice: wurden erschüttert
  rationale: Die passive Verbform beschreibt, dass die Meder heftig getroffen, aufgewühlt oder aus der Fassung gebracht wurden. »Wurden erschüttert« erhält die starke, knappe Bildsprache und den Parallelismus.
theological_decisions: []
