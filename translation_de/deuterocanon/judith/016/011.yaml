  text: Then my lowly ones shouted[a], and my weak ones were afraid and panicked; they raised their voice[b], and they were overthrown.
translation:
  language: de
  text: Da erhoben meine Niedrigen ein lautes Geschrei[a]; meine Schwachen fürchteten sich und gerieten in Schrecken. Sie erhoben ihre Stimme und wurden niedergeworfen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stießen einen Schlachtruf aus“. Das griechische Verb bezeichnet einen lauten Ruf und kann im Zusammenhang einen kriegerischen Klang haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Bezug des letzten Satzteils ist in dieser griechischen Formulierung nicht eindeutig: Er kann weiterhin von Judiths „Niedrigen“ und „Schwachen“ sprechen; möglicherweise sind jedoch unausgesprochen ihre Gegner gemeint, die niedergeworfen wurden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάλαξαν
  choice: erhoben … ein lautes Geschrei
  rationale: Das Verb bezeichnet einen lauten Ruf und kann im kriegerischen Zusammenhang einen Schlachtruf meinen. Die Formulierung gibt die Kraft des Ausdrucks wieder, ohne die militärische Bedeutung im Haupttext festzulegen.
- source_word: οἱ ταπεινοί μου
  choice: meine Niedrigen
  rationale: ταπεινοί kann niedrige, gedemütigte oder gesellschaftlich geringgestellte Menschen bezeichnen. „Meine Niedrigen“ bewahrt die Breite des griechischen Ausdrucks und das Possessivpronomen.
- source_word: οἱ ἀσθενοῦντές μου
  choice: meine Schwachen
  rationale: Das substantivisch gebrauchte Partizip bezeichnet die Schwachen oder Kraftlosen; ein medizinischer Sinn wird nicht vorausgesetzt.
- source_word: ἐφοβήθησαν … ἐπτοήθησαν
  choice: fürchteten sich und gerieten in Schrecken
  rationale: 'Die beiden Ausdrücke werden unterschieden: Auf Furcht folgt eine stärkere Erschütterung oder Bestürzung.'
- source_word: ὕψωσαν τὴν φωνὴν αὐτῶν
  choice: Sie erhoben ihre Stimme
  rationale: Die griechische Wendung wird in einer im Deutschen verständlichen, würdevollen Form wiedergegeben; der kollektive Singular „Stimme“ bleibt erhalten.
- source_word: ἀνετράπησαν
  choice: wurden niedergeworfen
  rationale: Das Passiv kann ein Umstürzen, Niederwerfen oder Überwältigen bezeichnen. „Niedergeworfen“ bleibt nahe an der konkreten Bildlichkeit und legt weder eine rein militärische Niederlage noch eine bloß innere Verwirrung fest.
theological_decisions:
- issue: Bezug des abschließenden ἀνετράπησαν
  choice: Das grammatische Subjekt der unmittelbar vorausgehenden Sätze bleibt im Haupttext formal bestehen, ohne einen ausdrücklich genannten Gegner einzufügen.
  alternative: 'Die letzte Aussage kann als unausgesprochener Subjektwechsel verstanden werden: Nicht die Niedrigen und Schwachen, sondern ihre Gegner wurden niedergeworfen.'
  rationale: Die knappe griechische Satzfolge lässt formal dieselbe Personengruppe als Subjekt erwarten, kann im Zusammenhang aber einen impliziten Wechsel zu deren Gegnern nahelegen. Die Übersetzung löst diese Spannung nicht durch eine Ergänzung auf, sondern weist in einer Fußnote darauf hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Abfolge des griechischen Ausgangstextes und die Mehrdeutigkeit des letzten Passivs werden nicht harmonisiert. „Meine Niedrigen“ ist bewusst etwas markanter als eine glättende Umschreibung, damit die soziale und existentielle Niedrigkeit von ταπεινοί offenbleibt.
