base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/018.yaml
  text: And when they came to Jerusalem, they worshiped God; and when the people had been purified, they offered up their burnt offerings and their freewill offerings and their gifts.
translation:
  language: de
  text: Als sie nach Jerusalem kamen, beteten sie Gott an. Als das Volk gereinigt worden war,[a] brachten sie ihre Brandopfer, ihre freiwilligen Opfer und ihre Gaben dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb steht im Passiv: Das Volk wurde gereinigt. Im Zusammenhang handelt es sich wahrscheinlich um eine kultische Reinigung vor der Opferdarbringung.'
    reason: Die Anmerkung macht das Passiv sichtbar und kennzeichnet die kultische Einordnung als kontextuell wahrscheinlich, ohne einen nicht genannten Handelnden oder eine bestimmte theologische Deutung festzulegen.
lexical_decisions:
- source_word: Ὡς δὲ ἦλθον
  choice: Als sie … kamen
  rationale: Die Wendung führt die Erzählung zeitlich weiter. Im Deutschen genügt „Als“; ein zusätzliches „und“ wäre hier weniger natürlich.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: beteten sie Gott an
  rationale: Im kultischen Zusammenhang bezeichnet das Verb die Verehrung Gottes; „anbeten“ gibt den Sinn natürlich wieder, ohne die körperliche Gebärde des Niederwerfens unnötig festzulegen.
- source_word: ἡνίκα
  choice: nachdem
  rationale: Die Opfer werden nach erfolgter Reinigung dargebracht. „Nachdem“ macht diese zeitliche Abfolge im Deutschen klar und idiomatisch.
- source_word: ἐκαθαρίσθη ὁ λαός
  choice: das Volk sich gereinigt hatte
  rationale: Das griechische Passiv kann im Deutschen idiomatisch reflexiv wiedergegeben werden. Der unmittelbare Opferkontext weist auf kultische Reinigung, ohne ausdrücklich zu bestimmen, wer sie vollzog.
- source_word: ἀνήνεγκαν
  choice: brachten … dar
  rationale: „Darbringen“ ist im Deutschen die natürliche kultische Entsprechung für das Opfern und bewahrt den feierlichen Ton.
- source_word: τὰ ὁλοκαυτώματα αὐτῶν
  choice: ihre Brandopfer
  rationale: „Brandopfer“ ist der etablierte deutsche Ausdruck für ein vollständig verbranntes Opfer.
- source_word: τὰ ἑκούσια αὐτῶν
  choice: ihre freiwilligen Opfer
  rationale: Die Form bezeichnet freiwillig dargebrachte Opfer. Die Wiedergabe bleibt verständlich und unterscheidet sie von den folgenden allgemeinen Gaben.
- source_word: τὰ δόματα
  choice: ihre Gaben
  rationale: „Gaben“ bewahrt den allgemeineren Sinn und lässt die begriffliche Unterscheidung zu den beiden vorherigen Opferarten bestehen.
theological_decisions:
- issue: Art und grammatische Darstellung der Reinigung in ἐκαθαρίσθη ὁ λαός
  choice: Kultische Reinigung des Volkes, idiomatisch reflexiv formuliert
  alternative: „Nachdem das Volk gereinigt worden war“, möglicherweise mit stärkerem Eindruck einer ausdrücklich von außen bewirkten Reinigung
  rationale: Der Zusammenhang von Gottesverehrung und Opferdarbringung spricht für rituelle beziehungsweise kultische Reinigung. Die reflexive deutsche Form behauptet nicht, die Reinigung sei moralischer Art, und legt den nicht genannten Handelnden nicht fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze, gut verständliche Satzführung; etablierte kultische Begriffe werden beibehalten. Die drei Opfer- beziehungsweise Gabenkategorien bleiben voneinander unterschieden.
