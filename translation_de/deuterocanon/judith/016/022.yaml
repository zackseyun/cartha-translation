base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/022.yaml
  text: And many desired her[a], but no man knew her all the days of her life[b], from the day when Manasseh her husband died and was added to his people.
translation:
  language: de
  text: Und viele begehrten sie, doch kein Mann erkannte sie[a] von dem Tag an, an dem ihr Mann Manasse starb und seinem Volk hinzugefügt wurde,[b] bis zu ihrem Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Kein Mann hatte geschlechtliche Beziehungen mit ihr. Im Griechischen steht wörtlich „erkannte sie“ als verhüllende Ausdrucksweise.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu seinem Volk versammelt wurde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμησαν
  choice: begehrten
  rationale: Das Verb bezeichnet ein starkes Verlangen. „Begehrten“ bewahrt hier sowohl die eheliche als auch die sexuelle Konnotation, ohne das Motiv einseitig als Begierde oder bloßen Heiratswunsch festzulegen.
- source_word: οὐκ ἔγνω ἀνὴρ αὐτήν
  choice: kein Mann erkannte sie
  rationale: Das griechische γινώσκω dient hier als verhüllende Bezeichnung für Geschlechtsverkehr. Die wörtlich-nahe Wiedergabe erhält den biblischen Euphemismus; eine Fußnote erläutert dessen Sinn.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτῆς
  choice: solange sie lebte
  rationale: Diese natürliche deutsche Wendung gibt die gesamte Zeitspanne ihres weiteren Lebens wieder und vermeidet den im heutigen Deutsch schwerfälligen Ausdruck „alle Tage ihres Lebens“.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: seit dem Tag, an dem
  rationale: Die Formulierung kennzeichnet Manasses Tod als Ausgangspunkt des beschriebenen Zustands und folgt dem griechischen Zeitbezug eng.
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: seinem Volk hinzugefügt wurde
  rationale: Die Wiedergabe bewahrt das griechische Bestattungsidiom und seine theologische Offenheit, ohne es als ausdrückliche Aussage über das Jenseits auszulegen.
- source_word: Μανασσῆς
  choice: Manasse
  rationale: „Manasse“ ist die im Deutschen etablierte biblische Namensform.
theological_decisions:
- issue: Sexueller Euphemismus in οὐκ ἔγνω ἀνὴρ αὐτήν
  choice: Den Euphemismus mit „kein Mann erkannte sie“ im Haupttext bewahren.
  alternative: „Kein Mann hatte Verkehr mit ihr“ oder „kein Mann schlief mit ihr“.
  rationale: Der griechische Text spricht bewusst verhüllend. Die gewählte Fassung erhält dieses literarische Register, während die Fußnote die gemeinte Aussage verständlich macht.
- issue: Totenformel προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: „seinem Volk hinzugefügt wurde“
  alternative: „zu seinem Volk versammelt wurde“
  rationale: Die wörtlich-nahe Fassung bewahrt das Bild des Ausgangstextes und legt nicht näher fest, welche Vorstellung vom Zustand nach dem Tod damit verbunden ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Der sexuelle Euphemismus und die traditionelle Totenformel bleiben erhalten, werden aber durch knappe Fußnoten erschlossen.
