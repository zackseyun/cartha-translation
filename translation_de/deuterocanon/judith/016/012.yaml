  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und syntaktisch klar. „Kinder von Flüchtigen“ ist ebenso verständlich wie „Kinder von Überläufern“, trifft die griechische Mehrdeutigkeit aber besser.
  terminology: „Söhne junger Frauen“, „durchbohrten“, „verwundeten“, „Schlachtreihe“ und „meines Herrn“ sind angemessen. „Junge Frauen“ bewahrt gegenüber „Mädchen“ oder „Jungfrauen“ sinnvoll die begriffliche Offenheit von κοράσιον. „Herr“ ist im hymnischen Kontext korrekt, ohne den Text unnötig zu erweitern.
