base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/012.yaml
  text: The sons of maidens pierced them through[a], and wounded them like the children of deserters[b]; they perished before the battle line of my Lord.
translation:
  language: de
  text: Die Söhne junger Frauen durchbohrten sie und verwundeten sie wie Kinder von Flüchtigen[a]; vor der Schlachtreihe meines Herrn kamen sie um.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Kinder von Deserteuren“ oder „wie Kinder von Überläufern“. Das griechische Bild ist ungewöhnlich; das Wort kann Davonlaufen, Desertieren oder den Übertritt zur Gegenseite bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „aus der Schlachtreihe meines Herrn“ oder „von der Schlachtordnung meines Herrn“. Die griechische Präpositionalverbindung ist schwierig und kann unterschiedlich verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ κορασίων
  choice: die Söhne junger Frauen
  rationale: Die Wiedergabe bewahrt die auffällige Mutter-Sohn-Beziehung des Griechischen. κοράσιον bezeichnet ein Mädchen oder eine junge Frau; „junge Frauen“ ist im heutigen Deutsch verständlich und unterstellt anders als „Jungfrauen“ nicht ausdrücklich sexuelle Unberührtheit.
- source_word: κατεκέντησαν
  choice: durchbohrten sie
  rationale: Das zusammengesetzte Verb bezeichnet ein kräftiges Durchstechen oder Durchbohren; „durchbohrten“ gibt diese Intensität knapp wieder.
- source_word: παῖδας
  choice: Kinder
  rationale: παῖς kann Kind, Junge oder Diener bedeuten. Im Vergleich liegt „Kinder“ am nächsten und lässt das Bild von Schwäche oder Erniedrigung bestehen.
- source_word: αὐτομολούντων
  choice: von Überläufern
  rationale: Das substantivierte Partizip bezeichnet Menschen, die davonlaufen, desertieren oder zur Gegenseite übergehen. „Überläufer“ hält den militärischen Zusammenhang fest; die schwierige Bildsprache wird nicht geglättet.
- source_word: ἐτίτρωσκον
  choice: verwundeten sie
  rationale: „Verwundeten“ gibt die Grundbedeutung wieder. Der imperfektive Aspekt kann wiederholtes oder fortgesetztes Verwunden andeuten, muss im Deutschen hier aber nicht ausdrücklich umschrieben werden.
- source_word: ἀπώλοντο
  choice: kamen sie um
  rationale: Die Wendung bezeichnet ihr Verderben beziehungsweise ihren Tod, ohne die handelnde Ursache genauer festzulegen.
- source_word: ἐκ παρατάξεως
  choice: vor der Schlachtreihe
  rationale: παράταξις ist die geordnete Schlachtaufstellung oder Schlachtreihe. „Vor der Schlachtreihe“ bietet einen natürlichen räumlichen Sinn; da ἐκ wörtlich eher „aus/von“ bedeutet und auch Herkunft oder Ursache markieren kann, werden Alternativen in der Fußnote erhalten.
- source_word: κυρίου μου
  choice: meines Herrn
  rationale: Der ausdrückliche Possessivbezug bleibt erhalten. Im Hymnenkontext bezeichnet κύριος Gott; „Herr“ wahrt den theologischen Gehalt, ohne „Gott“ ergänzend in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: mein Herr
  alternative: mein Gebieter
  rationale: Im hymnischen Zusammenhang ist Gott gemeint. „Herr“ ist die natürliche, traditionsfähige Wiedergabe und bewahrt zugleich den ausdrücklich gesetzten persönlichen Bezug μου.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige und schwer verständliche Bildsprache des griechischen Textes bleibt bewusst erhalten. „Junge Frauen“ vermeidet die im Deutschen engeren Bedeutungen von „Mädchen“ und „Jungfrauen“; „Schlachtreihe“ hält das militärische Bild anschaulich.
