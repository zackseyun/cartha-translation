base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/002.yaml
  text: For the Lord is a God who shatters wars; for in his camp, in the midst of the people, he rescued me from the hand of those pursuing me.
translation:
  language: de
  text: Denn der Herr ist ein Gott, der Kriege zerschmettert; denn mitten im Volk hat er mich in seine Lager aus der Hand derer gerettet, die mich verfolgten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντρίβων πολέμους
  choice: der Kriege zerschmettert
  rationale: Bewahrt das starke, bildhafte Verb συντρίβω und lässt die ungewöhnliche Aussage, dass Gott Kriege selbst zerschmettert, ungeschwächt stehen.
- source_word: παρεμβολὰς αὐτοῦ
  choice: seinem Lager
  rationale: παρεμβολή bezeichnet hier im militärischen Zusammenhang ein Lager; der griechische Plural kann kollektiv als Lager wiedergegeben werden.
- source_word: ἐξείλατό με
  choice: hat er mich … gerettet
  rationale: ἐξαιρέω bezeichnet das Herausreißen beziehungsweise Retten aus einer Bedrohung; „gerettet“ ist natürlich und erhält die konkrete Befreiungsaussage.
- source_word: ἐκ χειρὸς καταδιωκόντων με
  choice: aus der Hand meiner Verfolger
  rationale: Die feste Wendung „aus der Hand“ bleibt erhalten; das substantivierte Partizip wird idiomatisch und prägnant als „meiner Verfolger“ wiedergegeben.
theological_decisions:
- issue: Bezeichnung Gottes als derjenige, der Kriege zerschmettert
  choice: ein Gott, der Kriege zerschmettert
  alternative: ein Gott, der den Kriegen ein Ende macht
  rationale: Die gewaltsame Metapher des griechischen Textes wird nicht zu einer allgemeineren Friedensaussage abgeschwächt.
- issue: Syntaktisches Verhältnis von Κύριος und θεὸς συντρίβων πολέμους
  choice: Denn der Herr ist ein Gott, der Kriege zerschmettert
  alternative: Denn Gott, der Kriege zerschmettert, ist der Herr
  rationale: Die gewählte Fassung folgt der plausiblen prädikativen Lesart der Wortfolge und entspricht der Aussage des griechischen Textes, ohne eine zusätzliche dogmatische Präzisierung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen mit „denn“ eingeleiteten Begründungssätze und die kraftvolle Kriegsmetaphorik des griechischen Lobgesangs bleiben erhalten.
