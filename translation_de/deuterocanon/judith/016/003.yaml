base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/003.yaml
  text: Assyria came from the mountains out of the north[a]; he came with myriads of his forces, whose multitude blocked up the wadis[b], and their horses covered the hills.
translation:
  language: de
  text: Assur kam aus den Bergen vom Norden her; er kam mit Zehntausenden seiner Streitkräfte. Deren Menge verstopfte die Wildbachbetten[a], und ihre Pferde[b] bedeckten die Hügel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Winterbäche“ oder „saisonale Bachläufe“. Gemeint sind Wasserläufe, die vor allem nach Regen Wasser führen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen der Singular „ihr Pferd“, wahrscheinlich als Sammelbezeichnung für die Pferde oder die berittene Streitmacht.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσσούρ
  choice: Assur
  rationale: Die im Deutschen biblisch geläufige Form kann die assyrische Macht personifizieren und ermöglicht es, die männlichen Singularformen des Griechischen beizubehalten.
- source_word: ἐξ ὀρέων ἀπὸ βορρᾶ
  choice: aus den Bergen vom Norden her
  rationale: Die Wendung bewahrt sowohl den Ausgang aus dem Bergland als auch die Herkunftsrichtung aus dem Norden.
- source_word: ἐν μυριάσι δυνάμεων αὐτοῦ
  choice: mit Zehntausenden seiner Streitkräfte
  rationale: „Zehntausende“ gibt μυριάσι verständlich und zugleich feierlich wieder; „Streitkräfte“ wahrt den weiten militärischen Sinn von δυνάμεις.
- source_word: ἐνέφραξεν χειμάρρους
  choice: verstopfte die Wildbachbetten
  rationale: ἐνέφραξεν bezeichnet ein Versperren oder Verstopfen; χειμάρρους meint saisonale Wasserläufe beziehungsweise deren Betten.
- source_word: ἡ ἵππος αὐτῶν
  choice: ihre Pferde
  rationale: Der griechische Singular ist wahrscheinlich kollektiv gebraucht. Der deutsche Plural gibt das Bild unmittelbar wieder, ohne es ausdrücklich als „Reiterei“ zu deuten.
- source_word: βουνούς
  choice: Hügel
  rationale: „Hügel“ erhält den Unterschied zu den zuvor genannten ὄρη, den Bergen.
theological_decisions:
- issue: Personifizierte Reichsmacht im Singular neben pluralischen Bezügen auf ihre Truppen
  choice: „Assur“ wird mit „er“ als personifizierte Macht wiedergegeben; die Streitkräfte und Pferde stehen im Plural.
  alternative: Alles auf „die Assyrer“ oder einheitlich auf einen singularischen Herrscher beziehen.
  rationale: Der Wechsel zwischen der personifizierten Macht und ihren vielen Truppenteilen gehört zur poetischen Spannung des griechischen Textes und wird nicht eingeebnet.
translation_notes:
  register: Poetisch-feierlicher, aber gegenwärtig verständlicher Bibelstil. „Assur“ bewahrt die Personifikation, „Zehntausende“ die Größenwirkung und „Wildbachbetten“ das Landschaftsbild.
