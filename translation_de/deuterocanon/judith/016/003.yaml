  source_fidelity: Der Text gibt die griechische Bildsprache und den Wechsel von der personifizierten Macht im Singular zu ihren Truppen im Plural zuverlässig wieder. „Assur“ ist als deutsche biblische Namensform für Ἀσσούρ vertretbar; „er“ entspricht der maskulinen Personifikation. „Zehntausenden seiner Streitkräfte“, „Wildbachbetten“ und „Hügel“ treffen μυριάσι δυνάμεων, χειμάρρους und βουνούς angemessen.
