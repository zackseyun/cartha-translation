  yaml_path: translation/deuterocanon/judith/003/009.yaml
  text: And he came to the front of Esdrelon[a], near Dothaia, which is opposite the great ridge of Judea[b],
translation:
  language: de
  text: Und er kam vor Esdrelon[a], in die Nähe von Dotaia, das gegenüber dem großen Bergrücken von Judäa[b] liegt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Esdrelon gegenüber“ beziehungsweise „im Angesicht Esdrelons“. Die griechische Wendung κατὰ πρόσωπον lässt mehrere eng verwandte räumliche Wiedergaben zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der großen Säge von Judäa“. „Säge“ ist hier wahrscheinlich bildlich für einen gezackten Bergkamm oder Bergrücken gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πρόσωπον
  choice: vor
  rationale: In Verbindung mit dem Bewegungsverb ἦλθεν bezeichnet die Wendung die Ankunft vor beziehungsweise im Angesicht eines Ortes. „Vor“ ist im Deutschen natürlich und bewahrt die räumliche Offenheit.
- source_word: Ἐσδρηλών
  choice: Esdrelon
  rationale: Der griechische Ortsname wird transliteriert, statt ihn mit dem bekannteren Namen Jesreel zu harmonisieren.
- source_word: πλησίον
  choice: in die Nähe von
  rationale: Bei einem Bewegungsverb gibt „in die Nähe von“ die räumliche Annäherung natürlicher wieder als das statische „nahe“.
- source_word: Δοταίας
  choice: Dotaia
  rationale: Die griechische Namensform wird transliteriert; eine Identifizierung und Harmonisierung mit Dotan wird nicht in den Haupttext eingetragen.
- source_word: ἀπέναντι
  choice: gegenüber
  rationale: „Gegenüber“ gibt die räumliche Bedeutung prägnant und ohne zusätzliche Festlegung wieder.
- source_word: πρίονος
  choice: Bergrücken
  rationale: πρίων bedeutet wörtlich „Säge“, ist hier aber wahrscheinlich ein topografisches Bild für einen gezackten Bergkamm oder Bergrücken. „Bergrücken“ ist verständlich; die wörtliche Bildsprache bleibt in der Fußnote erhalten.
- source_word: τῆς Ἰουδαίας
  choice: von Judäa
  rationale: „Judäa“ ist die geläufige deutsche Form des geografischen Namens Ἰουδαία.
