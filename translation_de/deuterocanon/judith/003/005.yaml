  text: And the men came to Holofernes and reported to him according to these words[a].
translation:
  language: de
  text: Und die Männer kamen zu Holofernes und berichteten ihm in diesen Worten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „gemäß diesen Worten“. Die Wendung bezieht sich wahrscheinlich auf die unmittelbar zuvor übermittelte Botschaft und kann darauf hinweisen, dass sie deren Wortlaut entsprechend wiedergaben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο
  choice: kamen
  rationale: Das Verb bezeichnet hier das Kommen beziehungsweise Eintreffen bei Holofernes. „Kamen“ gibt die schlichte Erzählweise des Griechischen natürlich wieder.
- source_word: οἱ ἄνδρες
  choice: die Männer
  rationale: Die ausdrückliche maskuline Pluralform verweist auf die zuvor entsandten Männer und wird direkt wiedergegeben.
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Das Verb bezeichnet die Übermittlung einer Nachricht oder die Wiedergabe dessen, was gesagt wurde. „Berichteten“ passt zum Botenauftrag.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: alles mit diesen Worten
  rationale: Die Wendung stellt einen engen Bezug zum unmittelbar vorausgehenden Wortlaut her. „Mit diesen Worten“ ist im Deutschen idiomatisch; „alles“ macht das im Verb mitgedachte Berichtete ausdrücklich, ohne einen neuen Inhalt einzuführen.
