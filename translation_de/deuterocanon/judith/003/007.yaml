  text: And they themselves, and all their surrounding region, received him with garlands and dances and tambourines.
translation:
  language: de
  text: Und sie selbst und ihr ganzes Umland empfingen ihn mit Kränzen[a], Tänzen und Tamburinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Girlanden“. Gemeint sind festliche Kränze, nicht unbedingt Kronen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: empfingen
  rationale: „Empfangen“ wahrt sowohl den Grundsinn des Verbs als auch den im festlichen Zusammenhang naheliegenden Sinn eines Willkommens.
- source_word: αὐτοὶ
  choice: sie selbst
  rationale: Das ausdrückliche Pronomen ist emphatisch; „sie selbst“ gibt diese Hervorhebung wieder.
- source_word: πᾶσα ἡ περίχωρος αὐτῶν
  choice: ihr ganzes Umland
  rationale: περίχωρος bezeichnet das umliegende Gebiet; die knappe kollektive Formulierung bewahrt die Personifikation des griechischen Textes.
- source_word: μετὰ στεφάνων
  choice: mit Kränzen
  rationale: στέφανος bezeichnet hier im festlichen Zusammenhang Kränze beziehungsweise Girlanden, nicht notwendig Herrscherkronen.
- source_word: χορῶν
  choice: Tänzen
  rationale: χορός kann einen Tanz oder eine tanzende Gruppe bezeichnen; „Tänze“ bleibt natürlich und lässt die genaue Ausgestaltung offen.
- source_word: τυμπάνων
  choice: Tamburinen
  rationale: τύμπανον bezeichnet ein handgespieltes Trommel- oder Tamburininstrument; „Tamburinen“ passt zum festlichen Empfang.
