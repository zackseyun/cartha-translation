base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/010.yaml
  text: And they encamped between Gaibai and the city of the Scythians[a], and he was there for a full month[c][b], to gather all the full complement of his forces.
translation:
  language: de
  text: Und sie schlugen ihr Lager zwischen Gaibai und der Stadt der Skythen[a] auf. Er blieb dort einen Monat lang[b], um die gesamte Ausrüstung[c] seiner Streitmacht zusammenzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Skythopolis“; griechisch wörtlich: „Stadt der Skythen“.'
    reason: alternative_reading
  - marker: b
    text: 'Griechisch wörtlich: „einen Monat von Tagen“, eine idiomatische Bezeichnung für einen Monat.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den vollen Bestand“ beziehungsweise „die volle Einsatzbereitschaft“ seiner Streitmacht. Das griechische Wort kann die vollständige Ausrüstung oder zahlenmäßige Vollständigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεστρατοπέδευσαν
  choice: sie schlugen ihr Lager auf
  rationale: Die Wendung gibt das militärische Aufschlagen eines Lagers natürlich und präzise wieder.
- source_word: ἀνὰ μέσον
  choice: zwischen
  rationale: Vor den beiden Ortsangaben ist „zwischen“ die idiomatische deutsche Entsprechung.
- source_word: Γαιβαὶ
  choice: Gaibai
  rationale: Der Ortsname wird entsprechend der griechischen Form transliteriert und nicht mit einem unsicheren anderen Toponym harmonisiert.
- source_word: Σκυθῶν πόλεως
  choice: der Stadt der Skythen
  rationale: Dies bewahrt die transparente griechische Wortfügung; der geläufige Ortsname Skythopolis steht als Alternative in der Fußnote.
- source_word: ἦν ἐκεῖ
  choice: Er blieb dort
  rationale: Das Verb steht im Singular und verweist im Kontext auf den Befehlshaber; „blieb“ gibt zusammen mit der Zeitangabe den gemeinten Aufenthalt natürlich wieder.
- source_word: μῆνα ἡμερῶν
  choice: einen Monat lang
  rationale: Die wörtliche Wendung „einen Monat von Tagen“ ist im Deutschen unnatürlich; „einen Monat lang“ gibt die idiomatische Zeitdauer wieder, ohne zwingend einen zusätzlichen Begriff wie „voll“ einzutragen.
- source_word: συλλέξαι
  choice: zusammenzubringen
  rationale: Der Infinitiv bezeichnet den Zweck des Aufenthalts und passt sowohl zum Sammeln von Ausrüstung als auch zum Herstellen voller Einsatzbereitschaft.
- source_word: ἀπαρτίαν
  choice: die gesamte Ausrüstung
  rationale: Der seltene Ausdruck kann im militärischen Zusammenhang Ausrüstung, Vollständigkeit oder den vollen Bestand bezeichnen. „Gesamte Ausrüstung“ ist konkret und plausibel, während die weitere Bedeutungsbreite in der Fußnote erhalten bleibt.
- source_word: δυνάμεως αὐτοῦ
  choice: seiner Streitmacht
  rationale: δύναμις bezeichnet hier eine militärische Streitmacht, nicht abstrakte Macht.
