base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/006.yaml
  text: And he and his force went down to the coast[a], and he garrisoned the high cities, and they took chosen men from them into alliance.
translation:
  language: de
  text: Und er zog mit seiner Streitmacht hinab an die Küste und belegte die hoch gelegenen Städte mit Besatzungen; aus ihnen nahmen sie[a] ausgewählte Männer in das Bündnis auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier „nahmen sie“ im Plural, während die vorausgehenden Verben („zog hinab“, „belegte“) im Singular stehen. Der Plural kann sich auf seine Truppen beziehen, die unter seinem Befehl handelten; manche Übersetzungen gleichen die Form zu „nahm er“ an.
    reason: alternative_reading
lexical_decisions:
- source_word: κατέβη
  choice: zog … hinab
  rationale: Bewahrt die Richtungsangabe des griechischen Verbs und passt zugleich zum militärischen Erzählzusammenhang, ohne ausdrücklich einen Marsch zu behaupten.
- source_word: ἡ δύναμις αὐτοῦ
  choice: mit seiner Streitmacht
  rationale: δύναμις bezeichnet hier eine bewaffnete Truppe. Die mit-Konstruktion gibt αὐτὸς καὶ ἡ δύναμις αὐτοῦ in natürlichem Deutsch wieder, obwohl das griechische Verb im Singular steht.
- source_word: τὴν παραλίαν
  choice: an die Küste
  rationale: παραλία bezeichnet die Küste beziehungsweise das Küstengebiet; „an die Küste“ gibt hier das Ziel der Abwärtsbewegung idiomatisch wieder.
- source_word: ἐφρούρησε
  choice: belegte … mit Besatzungen
  rationale: Das Verb bedeutet bewachen oder militärisch sichern. Bei Städten bringt diese Formulierung den Gedanken einer Garnison klar und natürlich zum Ausdruck.
- source_word: τὰς πόλεις τὰς ὑψηλάς
  choice: die hoch gelegenen Städte
  rationale: Bewahrt den topografischen Sinn von ὑψηλάς, ohne die nicht ausdrücklich genannte Bedeutung „befestigt“ oder „stark“ einzutragen.
- source_word: ἔλαβον
  choice: nahmen sie
  rationale: Die griechische Verbform ist Plural und wird trotz der vorausgehenden Verben im Singular beibehalten.
- source_word: ἄνδρας ἐπιλέκτους
  choice: ausgewählte Männer
  rationale: Gibt sowohl die ausdrückliche männliche Bezeichnung ἄνδρας als auch den Sinn von ἐπιλέκτους genau wieder.
- source_word: εἰς συμμαχίαν
  choice: in das Bündnis auf
  rationale: Die Verbindung mit εἰς bezeichnet die Aufnahme in ein Bündnis beziehungsweise in verbündete Unterstützung; „in das Bündnis aufnehmen“ ist im Deutschen klar und nah an der griechischen Wendung.
