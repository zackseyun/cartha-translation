revisions:
- from: Und er riss alle ihre Grenzmale nieder und fällte ihre heiligen Haine. Ihm war nämlich gegeben worden, alle Götter der Erde zu vernichten, damit alle Völker ihm allein, Nebukadnezar, dienten und alle ihre Sprachen und alle ihre Stämme ihn als Gott anriefen.
  to: Und er riss alle ihre Grenzmale nieder und fällte ihre heiligen Haine. Und ihm war gegeben worden, alle Götter des Landes zu vernichten, damit alle Völker ihm allein – Nebukadnezar – dienten und alle ihre Sprachen und alle ihre Stämme ihn als Gott anriefen.
  rationale: Die Revision entfernt die unbegründete erklärende Partikel und gibt γῆ kontextnäher als „Land“ wieder. Die ungenannte Passivinstanz, der kultische Sinn von λατρεύω und die appositionell hervorgehobene Exklusivität Nebukadnezars bleiben erhalten.
