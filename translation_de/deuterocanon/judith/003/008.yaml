base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/008.yaml
  text: And he tore down all their borders and cut down their sacred groves; and it had been granted to him to destroy all the gods of the land, so that all the nations might worship him alone—Nebuchadnezzar—and that all their tongues and all their tribes might call on him as god.
translation:
  language: de
  text: Und er riss alle ihre Grenzmale nieder und fällte ihre heiligen Haine. Und ihm war gegeben worden, alle Götter des Landes zu vernichten, damit alle Völker ihm allein – Nebukadnezar – dienten und alle ihre Sprachen und alle ihre Stämme ihn als Gott anriefen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέσκαψεν πάντα τὰ ὅρια αὐτῶν
  choice: riss alle ihre Grenzmale nieder
  rationale: κατασκάπτω bezeichnet ein Niederreißen oder Zerstören; ὅρια sind Grenzen beziehungsweise Grenzzeichen. „Grenzmale“ gibt den konkreten Gegenstand natürlicher wieder als das schwer verständliche „Grenzen niederreißen“.
- source_word: τὰ ἄλση αὐτῶν ἐξέκοψεν
  choice: fällte ihre heiligen Haine
  rationale: ἄλση bezeichnet kultisch verstandene Haine; „heilig“ macht die religiöse Funktion deutlich, während ἐκκόπτω hier passend mit „fällen“ wiedergegeben wird.
- source_word: ἦν δεδομένον αὐτῷ
  choice: Ihm war nämlich gegeben worden
  rationale: Die unpersönliche Passivform und der nicht genannte Handelnde bleiben erhalten. „Nämlich“ gibt den erklärenden Anschluss von καί idiomatisch wieder, ohne eine ausdrückliche Beauftragung oder Erlaubnis festzulegen.
- source_word: ἐξολοθρεῦσαι
  choice: zu vernichten
  rationale: Das Verb drückt vollständige Beseitigung oder Ausrottung aus; bei „Göttern“ ist „vernichten“ im Deutschen angemessen, ohne den Referenten auf Götterbilder zu verengen.
- source_word: τῆς γῆς
  choice: der Erde
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten. Der folgende universale Bezug auf alle Völker, Sprachen und Stämme stützt hier den umfassenden Sinn „Erde“.
- source_word: λατρεύσωσι
  choice: dienten
  rationale: λατρεύω bezeichnet kultischen Dienst beziehungsweise Verehrung. „dienen“ bewahrt diesen Bedeutungsumfang und passt zur Konstruktion mit dem Dativ.
- source_word: ἐπικαλέσωνται αὐτὸν εἰς θεόν
  choice: ihn als Gott anriefen
  rationale: ἐπικαλέομαι bedeutet hier „anrufen“; εἰς θεόν bezeichnet die beanspruchte Stellung, in der Nebukadnezar angerufen werden soll.
theological_decisions:
- issue: Wer Nebukadnezar die Vernichtung der Götter „gegeben“ hat
  choice: 'Der Handelnde bleibt ungenannt: „Ihm war … gegeben worden“'
  alternative: „Er hatte den Auftrag erhalten“ oder „es war ihm erlaubt worden“
  rationale: Der griechische Passivsatz nennt keinen Urheber und legt weder Auftrag noch Erlaubnis eindeutig fest. Die Übersetzung löst diese theologisch und erzählerisch bedeutsame Offenheit nicht auf.
- issue: Referenz von αὐτῷ μόνῳ τῷ Ναβουχοδονοσόρ
  choice: „ihm allein, Nebukadnezar“
  alternative: „Nebukadnezar allein“
  rationale: 'Die appositionelle, emphatische Form des Griechischen wird sichtbar bewahrt: Gemeint ist Nebukadnezar selbst als alleiniger Empfänger kultischen Dienstes.'
- issue: Ontologischer Status der „Götter“
  choice: „alle Götter der Erde“
  alternative: „alle Götzenbilder der Erde“ oder „alle fremden Kulte“
  rationale: Der Text sagt θεούς und konkretisiert nicht, ob Gottheiten, Bilder oder Kulte gemeint sind. Die Übersetzung übernimmt die Ausdrucksweise der Erzählung, ohne daraus eine Aussage über deren tatsächliche Existenz abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Erzählton. Der Satz wurde zur besseren Lesbarkeit nach „Haine“ geteilt. Die Reihung „alle ihre Sprachen und alle ihre Stämme“ bleibt bewusst nahe am Griechischen und bewahrt dessen universal-rhetorische Parallelität.
