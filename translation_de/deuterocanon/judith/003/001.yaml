lexical_decisions:
- source_word: ἀπέστειλαν
  choice: schickten
  rationale: Der Aorist von ἀποστέλλω bezeichnet hier schlicht das Entsenden; „schickten“ ist im modernen deutschen Erzählstil natürlich.
- source_word: ἀγγέλους
  choice: Boten
  rationale: Im erzählerischen Zusammenhang sind menschliche Überbringer gemeint. „Boten“ gibt den Ausdruck wieder, ohne die politisch speziellere Deutung „Gesandte“ festzulegen.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet beim Verb des Sendens den Empfänger beziehungsweise das Ziel.
- source_word: λόγοις εἰρηνικοῖς
  choice: mit friedlichen Worten
  rationale: Die Wiedergabe bewahrt sowohl λόγοις („Worten“) als auch den versöhnlichen Sinn von εἰρηνικοῖς und lässt offen, ob allgemein beschwichtigende Rede oder ein konkretes Friedensangebot gemeint ist.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip leitet den Inhalt der Botschaft ein. Die finite deutsche Form verbindet sich natürlich mit dem vorangehenden Erzählverb.
