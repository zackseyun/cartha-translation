  text: 'Und sie schickten Boten zu ihm mit friedlichen Worten[a] und sagten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Worten des Friedens“ beziehungsweise „mit friedlichen Bedingungen“. Die griechische Wendung kann versöhnliche Worte oder die Bedingungen eines Friedensangebots bezeichnen.'
