base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/002.yaml
  text: Look[a], we, the servants of Nebuchodonosor the great king, lie before you[b]; deal with us as is pleasing in your sight.
translation:
  language: de
  text: Siehe, wir, die Diener Nabuchodonosors[a], des großen Königs, liegen vor dir[b]. Verfahre mit uns, wie es dir gefällt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Namensform lautet „Nabuchodonosor“; in vielen deutschen Bibeln steht die geläufigere Form „Nebukadnezar“.
    reason: alternative_reading
  - marker: b
    text: 'Oder sinngemäß: „stehen dir zur Verfügung“. Das griechische Wort bezeichnet wörtlich ein Daliegen oder Bereitliegen vor jemandem.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „wie es vor deinem Angesicht wohlgefällig ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel eröffnet den unterwürfigen Appell. „Siehe“ bewahrt ihre hinweisende Kraft und ist im würdevollen biblischen Erzählstil verständlich.
- source_word: παῖδες
  choice: Diener
  rationale: Im höfisch-politischen Zusammenhang bezeichnet das Wort untergeordnete Gefolgsleute des Königs. „Diener“ gibt diese Unterordnung wieder, ohne Jugend oder rechtlichen Sklavenstatus festzulegen.
- source_word: Ναβουχοδονοσὸρ
  choice: Nabuchodonosor
  rationale: Die Namensform wird aus dem griechischen Text wiedergegeben und nicht an die im Deutschen geläufigere hebräische Form „Nebukadnezar“ angeglichen.
- source_word: βασιλέως μεγάλου
  choice: des großen Königs
  rationale: Die attributive Wendung wird als königlicher Ehrentitel ausdrücklich beibehalten.
- source_word: παρακείμεθα
  choice: liegen vor dir
  rationale: Die Form bezeichnet wörtlich ein Daliegen beziehungsweise Bereitliegen vor jemandem. Die Wiedergabe erhält das anschauliche Bild vollständiger Unterwerfung, lässt aber über die Fußnote auch den funktionalen Sinn der Verfügbarkeit erkennen.
- source_word: χρῆσαι ἡμῖν
  choice: Verfahre mit uns
  rationale: Im Zusammenhang der Kapitulation geht es darum, dass der Angeredete nach seinem Willen mit ihnen handeln darf. „Verfahre mit uns“ ist natürliches Deutsch und vermeidet die im Deutschen enger oder instrumenteller klingende Formulierung „Benutze uns“.
- source_word: καθὼς ἀρεστόν ἐστιν τῷ προσώπῳ σου
  choice: wie es dir gefällt
  rationale: Die natürliche deutsche Wendung gibt den Sinn des griechischen Idioms wieder; dessen wörtlicher Bezug auf das Angesicht wird in der Fußnote dokumentiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischer Färbung. „Siehe“ und „liegen vor dir“ bewahren die eindringliche, unterwürfige Bildsprache; die abschließende Wendung wird idiomatisch formuliert. Die Anrede bleibt durchgehend im Singular, entsprechend dem griechischen σου.
