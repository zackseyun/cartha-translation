base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/003.yaml
  text: Look[a], our homesteads and every field of wheat and the flocks and the herds and all the enclosures of our tents lie before you[b]; use them as pleases you.
translation:
  language: de
  text: Sieh[a], unsere Gehöfte, alle Weizenfelder, die Herden, die Rinderherden und sämtliche Einfriedungen unserer Zelte liegen vor dir[b]. Nutze sie, wie es dir gefällt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schau«. Das griechische Wort ist ein unmittelbarer Aufmerksamkeitsruf.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »sämtliche Einfriedungen unserer Zelte«. Gemeint sein können abgegrenzte Bereiche bei den Zelten, etwa innerhalb eines Lagers oder für das Vieh.'
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Direkter, nicht altertümlicher Aufmerksamkeitsruf; bewahrt die deiktische Kraft des griechischen Ausdrucks.
- source_word: ἐπαύλεις
  choice: Gehöfte
  rationale: Bezeichnet ländliche Wohn- oder Wirtschaftsanwesen und passt zum agrarischen Zusammenhang.
- source_word: πᾶν πεδίον πυρῶν
  choice: alle Weizenfelder
  rationale: Gibt das kultivierte Land mit Weizen idiomatisch wieder; der griechische Singular mit πᾶν kann im Deutschen natürlich kollektiv als Plural erscheinen.
- source_word: ποίμνια
  choice: Schaf- und Ziegenherden
  rationale: Macht die Kategorie der kleineren Herdentiere verständlich und grenzt sie von den folgenden Rinderherden ab, ohne nur Schafe vorauszusetzen.
- source_word: βουκόλια
  choice: Rinderherden
  rationale: Bezeichnet kollektiv gehaltenes Rindvieh; die Wiedergabe erhält den Gegensatz zu ποίμνια.
- source_word: μάνδραι τῶν σκηνῶν ἡμῶν
  choice: Einfriedungen unserer Zelte
  rationale: Bleibt nahe an der ungewöhnlichen griechischen Verbindung und vermeidet eine unbelegte Festlegung auf Viehpferche oder ganze Lager.
- source_word: παράκεινται πρὸ προσώπου σου
  choice: liegen vor dir
  rationale: Bewahrt das räumliche Bild und deutet zugleich an, dass alles dem Angeredeten zur Verfügung steht.
- source_word: χρῆσαι καθʼ ὃ ἂν ἀρέσκῃ σοι
  choice: Verfüge darüber, wie es dir gefällt
  rationale: Gibt die Aufforderung zum Gebrauch in natürlichem Deutsch wieder und bewahrt die freie Verfügung nach dem Gefallen des Angeredeten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sieh« erhält den direkten Aufmerksamkeitsruf, ohne das altertümlichere »Siehe« zu verwenden. Die auffällige Formulierung zu den Zelteinfriedungen bleibt im Haupttext erhalten und wird in der Fußnote vorsichtig erläutert.
