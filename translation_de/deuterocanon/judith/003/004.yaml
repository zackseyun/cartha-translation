base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/004.yaml
  text: Look[a], our cities also, and those who live in them, are your servants; come and deal with them as is good in your eyes.
translation:
  language: de
  text: Sieh, auch unsere Städte und ihre Bewohner sind deine Sklaven[a]. Komm und begegne ihnen, wie es in deinen Augen gut ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Diener. Das griechische Wort kann beides bezeichnen; hier steht wahrscheinlich die völlige Unterwerfung unter den Eroberer im Vordergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Die deiktische Aufforderung hebt das Folgende nachdrücklich hervor. „Sieh“ ist modern und wahrt die direkte Anrede im Singular.
- source_word: πόλεις
  choice: Städte
  rationale: Dies ist die unmittelbare und kontextuell passende Wiedergabe für städtische Gemeinwesen.
- source_word: οἱ κατοικοῦντες ἐν αὐταῖς
  choice: ihre Bewohner
  rationale: Die substantivierte Partizipialfügung bezeichnet die Menschen, die in den Städten wohnen; „ihre Bewohner“ ist knapp und natürlich.
- source_word: δοῦλοί
  choice: Sklaven
  rationale: Im Zusammenhang der bedingungslosen Unterwerfung unter einen Eroberer bezeichnet das Wort nicht bloß freiwilligen Dienst, sondern völlige Verfügungsgewalt und Abhängigkeit.
- source_word: ἐλθὼν
  choice: Komm
  rationale: Das vorangestellte Aoristpartizip verbindet sich sinngemäß mit der folgenden Aufforderung und wird im Deutschen natürlich als koordinierter Imperativ wiedergegeben.
- source_word: ἀπάντησον
  choice: verfahre mit
  rationale: Das Verb bedeutet grundsätzlich „begegnen“ oder „entgegentreten“. Mit Städten als Bezug und im Kontext ihrer Übergabe gibt „verfahre mit ihnen“ die pragmatische Bedeutung verständlich wieder, ohne eine bestimmte Behandlung vorzugeben.
- source_word: ὡς ἔστιν ἀγαθὸν ἐν ὀφθαλμοῖς σου
  choice: wie es in deinen Augen gut ist
  rationale: Die bildhafte griechische Wendung wird bewahrt und bezeichnet das, was dem eigenen Urteil oder Willen entspricht.
theological_decisions:
- issue: Wiedergabe von δοῦλοι im Zusammenhang politischer Unterwerfung
  choice: Sklaven
  alternative: Diener
  rationale: Die Einwohner bieten sich einem Eroberer vollständig zur Verfügung. „Sklaven“ bringt die erzwungene beziehungsweise rechtlose Unterordnung deutlicher zum Ausdruck; die mögliche allgemeinere Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Anrede bleibt im Singular; die idiomatische Wendung „in deinen Augen“ wird wegen ihrer Anschaulichkeit und Nähe zum Griechischen beibehalten.
