  text: And he cried out with a loud voice, with weeping and groaning and a mighty cry, and he tore his garments.
translation:
  language: de
  text: Und er schrie laut auf, unter Weinen und Stöhnen und mit gewaltigem Geschrei, und er zerriss seine Gewänder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησεν
  choice: schrie … auf
  rationale: Das Verb bezeichnet einen lauten Ruf oder Schrei; »aufschreien« bewahrt die Intensität, ohne den Laut als gegliederte Rede oder bloßes Wehklagen festzulegen.
- source_word: φωνῇ μεγάλῃ
  choice: laut
  rationale: Die griechische Wendung bezeichnet eine laute Stimmgebung. Das natürliche deutsche Adverb gibt sie knapp und eindeutig wieder.
- source_word: μετὰ κλαυθμοῦ
  choice: unter Weinen
  rationale: κλαυθμός bezeichnet Weinen beziehungsweise Klagen; die Formulierung gibt den begleitenden Vorgang idiomatisch wieder.
- source_word: στεναγμοῦ
  choice: Stöhnen
  rationale: στεναγμός kann Stöhnen oder Seufzen bedeuten. »Stöhnen« entspricht der Heftigkeit dieser Trauerszene, ohne eine zusätzliche Deutung einzutragen.
- source_word: βοῆς ἰσχυρᾶς
  choice: mit mächtigem Geschrei
  rationale: Die Wendung steigert die lautstarke Klage. »Mächtiges Geschrei« wahrt die emphatische Kraft von ἰσχυρά und unterscheidet sich hinreichend vom vorausgehenden »laut«.
- source_word: διέρρηξεν
  choice: zerriss
  rationale: Das Verb bezeichnet das Zerreißen, besonders von Kleidern als Ausdruck der Trauer; »zerriss« ist gegenwärtig, klar und sachlich.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: seine Gewänder
  rationale: ἱμάτια bezeichnet Kleidungsstücke allgemein. »Gewänder« wahrt den würdigen historischen Ton und vermeidet die mögliche Verengung von »Kleider«.
