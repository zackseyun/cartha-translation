base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/012.yaml
  text: But when the sons of Asshur saw them, they sent word to their leaders; and they came to the generals and commanders of thousands and to every one of their rulers.
translation:
  language: de
  text: Als aber die Söhne Assurs sie sahen, schickten sie ihren Anführern Nachricht. Diese kamen zu den Heerführern, den Befehlshabern über Tausend und zu jedem ihrer Herrscher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἀσσοὺρ
  choice: die Söhne Assurs
  rationale: Die wörtliche ethnische Bezeichnung des Griechischen bleibt erhalten. Sie ist im Deutschen verständlich und bewahrt die Ausdrucksweise der Vorlage, ohne sie stillschweigend zu „Assyrer“ zu glätten.
- source_word: ὡς εἶδον αὐτούς
  choice: als ... sie sahen
  rationale: ὡς mit Aorist bezeichnet hier den Zeitpunkt der anschließenden Handlung. „Als sie sie sahen“ gibt dies wieder, ohne die nicht zwingend ausgedrückte Verstärkung „sobald“ einzutragen.
- source_word: διεπέμψαν
  choice: schickten ... Nachricht
  rationale: Das Verb bezeichnet ein Aussenden beziehungsweise Übermitteln; da das Objekt unausgesprochen bleibt, gibt „Nachricht schicken“ den kommunikativen Vorgang natürlich wieder, ohne ausdrücklich Boten einzuführen.
- source_word: ἐπὶ τοὺς ἡγουμένους αὐτῶν
  choice: ihren Anführern
  rationale: ἡγούμενοι bezeichnet Personen in leitender Stellung. „Anführer“ ist im militärischen Zusammenhang klar und ausreichend weit gefasst.
- source_word: στρατηγοὺς
  choice: Heerführern
  rationale: Im militärischen Kontext bezeichnet στρατηγοί die obersten militärischen Führer. „Heerführer“ ist präzise, würdig und vermeidet eine möglicherweise anachronistische moderne Rangbezeichnung.
- source_word: χιλιάρχους
  choice: Befehlshabern über Tausend
  rationale: Die Übersetzung bewahrt den Zahlenwert des Titels, der einen Befehlshaber über tausend Mann bezeichnet, ohne ihn mit einem römischen Rang gleichzusetzen.
- source_word: ἐπὶ πάντα ἄρχοντα αὐτῶν
  choice: zu jedem ihrer Herrscher
  rationale: Der Singular mit πᾶς ist distributiv. „Zu jedem ihrer Herrscher“ bildet diese Einzelbeziehung genauer ab als „zu allen ihren Herrschern“.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zur griechischen Vorlage. Der zweite Satz verwendet „Diese“, um den wechselnden Bezug klarzumachen: Die zuvor benachrichtigten Anführer gehen zu den höheren militärischen und politischen Autoritäten.'
