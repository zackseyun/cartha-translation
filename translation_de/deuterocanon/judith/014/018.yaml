base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/018.yaml
  text: The servants have failed; one woman of the Hebrews has brought shame on the house of King Nebuchadnezzar. For look—Holofernes is lying on the ground[a], and his head is not on him.
translation:
  language: de
  text: 'Die Sklaven[a] haben versagt! Eine einzige Frau aus dem Volk der Hebräer hat Schande über das Haus König Nebukadnezars gebracht. Seht: Holofernes liegt am Boden, und sein Kopf ist nicht mehr auf seinem Körper.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diener«. Das griechische Wort kann je nach Zusammenhang Sklaven oder Diener bezeichnen; hier steht vermutlich ihr Status als Sklaven im Vordergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠθέτησαν
  choice: haben versagt
  rationale: ἀθετέω kann je nach Zusammenhang »missachten«, »treulos handeln« oder »in einer Pflicht versagen« bedeuten. Hier bezeichnet der Ausruf das katastrophale Versagen der Untergebenen, ohne ausdrücklich einen rechtlichen oder bundestheologischen Sinn festzulegen.
- source_word: οἱ δοῦλοι
  choice: die Sklaven
  rationale: δοῦλοι bezeichnet Menschen unter der Verfügungsgewalt eines Herrn. Im königlichen und militärischen Haushalt ist der rechtlich-soziale Status stärker als bei bloßen Bediensteten; die mögliche kontextuelle Wiedergabe »Diener« wird in der Fußnote genannt.
- source_word: ἐποίησεν αἰσχύνην
  choice: hat Schande … gebracht
  rationale: Die griechische Wendung lautet wörtlich »hat Schande gemacht«. Die deutsche Fügung »Schande über … bringen« gibt die öffentliche Entehrung natürlich und resultativ wieder.
- source_word: μία γυνὴ τῶν Ἑβραίων
  choice: eine einzige Frau aus dem Volk der Hebräer
  rationale: »Eine einzige« bewahrt die pointierte Singularität von μία; »aus dem Volk der Hebräer« gibt die Zugehörigkeit verständlich wieder.
- source_word: εἰς τὸν οἶκον
  choice: über das Haus
  rationale: In Verbindung mit Schande bezeichnet εἰς das Haus als Ziel beziehungsweise Betroffenen der Entehrung. »Schande über das Haus bringen« ist die entsprechende natürliche deutsche Wendung.
- source_word: χαμαί
  choice: liegt am Boden
  rationale: χαμαί bedeutet »auf dem Boden«. Das Verb »liegt« wird aus der prädikativen Bildaussage erschlossen und macht die Szene im Deutschen idiomatisch verständlich.
- source_word: ἡ κεφαλὴ οὐκ ἔστιν ἐπʼ αὐτῷ
  choice: sein Kopf ist nicht mehr auf seinem Körper
  rationale: Die Formulierung bewahrt das konkrete, schockierende Bild des fehlenden Kopfes. »Auf seinem Körper« verdeutlicht im natürlichen Deutschen den Bezug von ἐπʼ αὐτῷ, ohne die Enthauptung nur abstrakt zu umschreiben.
theological_decisions:
- issue: Wiedergabe von δοῦλοι im höfisch-militärischen Erzählzusammenhang
  choice: die Sklaven
  alternative: die Diener
  rationale: Der Ausdruck kann funktional Diener bezeichnen, benennt jedoch grundsätzlich einen abhängigen Status unter der Gewalt eines Herrn. »Sklaven« bewahrt diese soziale Härte; die weniger statusbetonte Alternative bleibt als Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Erzählsprache mit dramatischem Ausruf. »Eine einzige Frau« erhält die rhetorische Zuspitzung des Griechischen; »Seht doch« gibt ἰδού als unmittelbaren, alarmierenden Hinweis wieder.
