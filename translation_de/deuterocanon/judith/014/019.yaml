base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/019.yaml
  text: But when the commanders of the army of Assyria heard the words[a], they tore their tunics, and their souls were greatly troubled[b], and there arose a very great cry and outcry in the midst of the camp.
translation:
  language: de
  text: Als aber die Befehlshaber des assyrischen Heeres diese Worte hörten, zerrissen sie ihre Tuniken[a]. Sie waren zutiefst erschüttert[b], und mitten im Lager erhob sich ein Schrei und ein gewaltiges Geschrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zerreißen der eigenen Gewänder war ein übliches Zeichen von Trauer, Entsetzen oder großer Bestürzung.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Ihre Seele wurde sehr erschüttert.“ Das Griechische verwendet eine kollektive Einzahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Als aber ... hörten
  rationale: ὡς mit dem Aorist leitet einen temporalen Nebensatz ein; δέ markiert hier eine leichte narrative Gegenbewegung.
- source_word: τὰ ῥήματα
  choice: diese Worte
  rationale: ῥήματα bezeichnet das zuvor Gesagte. Das Demonstrativpronomen stellt im Deutschen den notwendigen Rückbezug natürlich her.
- source_word: οἱ ἄρχοντες τῆς δυνάμεως Ἀσσούρ
  choice: die Befehlshaber des assyrischen Heeres
  rationale: ἄρχοντες bezeichnet im militärischen Zusammenhang die Befehlshaber; δύναμις meint hier das Heer. Die attributive Wiedergabe von Ἀσσούρ ist idiomatisches Deutsch.
- source_word: τοὺς χιτῶνας αὐτῶν διέρρηξαν
  choice: zerrissen sie ihre Gewänder
  rationale: χιτών bezeichnet zwar genauer ein Untergewand bzw. eine Tunika, doch „Gewänder“ vermittelt die kulturell relevante Handlung im heutigen Deutsch klarer, ohne ein modernes Kleidungsstück nahezulegen.
- source_word: ἐταράχθη αὐτῶν ἡ ψυχὴ σφόδρα
  choice: Sie waren zutiefst erschüttert
  rationale: Die griechische kollektive Einzahl („ihre Seele“) bezeichnet ihren inneren Zustand. Die idiomatische deutsche Form bewahrt die Intensität von σφόδρα; die wörtliche Gestalt wird in der Fußnote kenntlich gemacht.
- source_word: κραυγὴ καὶ βοὴ μεγάλη σφόδρα
  choice: lautes Schreien und gewaltiges Wehklagen
  rationale: Die beiden annähernd synonymen Substantive werden als emphatische Doppelung bewahrt und im Deutschen unterschieden; σφόδρα verstärkt μεγάλη erheblich.
- source_word: ἐν μέσῳ τῆς παρεμβολῆς
  choice: mitten im Lager
  rationale: Dies ist eine genaue und zugleich natürliche Wiedergabe des räumlichen Ausdrucks.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχή
  choice: im Haupttext idiomatisch „Sie waren zutiefst erschüttert“, mit wörtlicher Form in der Fußnote
  alternative: „Ihre Seele wurde sehr erschüttert“
  rationale: ψυχή wird hier nicht als technische Aussage über einen abgrenzbaren Seelenteil behandelt, sondern bezeichnet kollektiv das innere Erleben. Die Übersetzung vermeidet eine konfessionelle Festlegung und dokumentiert die ungewöhnliche Einzahl.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau wurde gegenüber der langen griechischen Reihung leicht gegliedert; die emphatische Doppelung am Versende bleibt erhalten.
