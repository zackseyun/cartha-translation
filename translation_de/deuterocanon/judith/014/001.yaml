  source_fidelity: 'Die Befehlsfolge und die konkreten Begriffe werden grundsätzlich zutreffend wiedergegeben: Judith spricht die Männer als »Brüder« an, fordert sie auf, den Kopf zu nehmen und ihn an der Befestigung ihrer Mauer aufzuhängen. Die Ortsangabe ἐπὶ τῆς ἐπάλξεως bezeichnet jedoch am unmittelbarsten die Brustwehr bzw. den Zinnenaufsatz selbst; »oben an« ist eine nicht erforderliche explizierende Ergänzung und »an« kann gegenüber dem griechischen »auf/an der« zu eng wirken.'
