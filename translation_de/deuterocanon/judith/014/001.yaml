translation:
  language: de
  text: 'Und Judit sagte zu ihnen: »Hört mir doch zu, Brüder! Nehmt diesen Kopf und hängt ihn an der Brustwehr eurer Mauer auf.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an den Zinnen eurer Mauer«. Das griechische Wort kann die Brustwehr oder die Zinnen oben auf einer Befestigungsmauer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσατε δή μου
  choice: Hört doch auf mich
  rationale: Der Imperativ Ἀκούσατε wird direkt wiedergegeben; δή verleiht der Aufforderung Nachdruck und Dringlichkeit, was das natürliche deutsche »doch« ausdrückt.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch männliche Anrede richtet sich im Kontext an die Männer von Betulia; daher wird sie nicht geschlechtsneutral erweitert.
- source_word: λαβόντες
  choice: Nehmt
  rationale: 'Das vorgeordnete Aoristpartizip wird im Deutschen idiomatisch als erster koordinierter Imperativ wiedergegeben: »Nehmt … und hängt …«; die Abfolge bleibt erhalten.'
- source_word: τὴν κεφαλὴν ταύτην
  choice: diesen Kopf
  rationale: Die Wendung wird eng am griechischen Wortlaut übersetzt. Dass der Kopf abgetrennt ist, ergibt sich aus dem Kontext und wird nicht eigens ergänzt.
- source_word: κρεμάσατε αὐτήν
  choice: hängt ihn
  rationale: κρεμάσατε bezeichnet konkret das Aufhängen. Das deutsche Pronomen richtet sich grammatisch nach dem maskulinen »Kopf«.
- source_word: ἐπὶ τῆς ἐπάλξεως
  choice: oben an die Brustwehr
  rationale: ἐπάλξ bezeichnet die Brustwehr beziehungsweise den Zinnenbereich oben auf einer Befestigungsmauer. »Oben an die Brustwehr« gibt sowohl die Lage als auch das konkrete Ziel des Aufhängens natürlich wieder.
- source_word: τοῦ τείχους ὑμῶν
  choice: eurer Mauer
  rationale: τεῖχος ist hier die Befestigungsmauer der Stadt. »Eurer Mauer« wahrt die knappe Form des griechischen Textes; der Kontext macht ihre Funktion deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Befehlsform. »Hört doch auf mich« bewahrt den Nachdruck der Partikel δή, ohne altertümlich zu wirken. Die Fußnote erhält die sachliche Mehrdeutigkeit des militärischen Baubegriffs.
