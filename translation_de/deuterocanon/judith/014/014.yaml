  text: And Bagoas went in and knocked on the curtain of the tent[b][a], for he assumed that he was sleeping with Judith.
translation:
  language: de
  text: Bagoas ging hinein und klopfte an den Vorhang des Zeltes[a], denn er nahm an, Holofernes schlafe mit Judit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »schlug gegen den Behang des Zeltes«. Das griechische Verb kann sowohl »schlagen« als auch »klopfen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Dass Holofernes mit Judit schlief, war die Annahme des Bagoas; der griechische Text stellt es nicht als Tatsache fest.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ging hinein
  rationale: Gibt den Aorist von εἰσέρχομαι im erzählenden Zusammenhang natürlich wieder, ohne über den genauen Standort des Bagoas vor der Handlung hinauszugehen.
- source_word: ἔκρουσε
  choice: klopfte an
  rationale: Das Verb bezeichnet ein Schlagen oder Klopfen. Zusammen mit dem Zeltvorhang liegt hier ein ankündigendes Klopfen näher als ein gewaltsames Schlagen.
- source_word: τὴν αὐλαίαν τῆς σκηνῆς
  choice: an den Vorhang des Zeltes
  rationale: αὐλαία bezeichnet hier einen Vorhang oder Behang; σκηνή ist im Erzählzusammenhang das Zelt, nicht ein sakraler »Tabernakel«.
- source_word: ὑπενόειτο
  choice: er nahm an
  rationale: Die Form beschreibt eine Vermutung oder Annahme. Das deutsche Aktiv mit dem aus dem Zusammenhang erschlossenen Subjekt Bagoas ist klar und idiomatisch.
- source_word: αὐτόν
  choice: Holofernes
  rationale: Das griechische Pronomen wird zur eindeutigen Zuordnung im Deutschen mit seinem Referenten wiedergegeben; gemeint ist Holofernes, nicht Bagoas.
- source_word: καθεύδειν
  choice: schlafe
  rationale: Der Infinitiv bezeichnet Schlafen und wird nach »nahm an« als indirekte Rede im Konjunktiv wiedergegeben.
- source_word: μετὰ Ἰουδείθ
  choice: bei Judit
  rationale: μετά mit Genitiv bedeutet »mit«. »Bei Judit« bewahrt hier die mögliche intime Implikation, ohne ausdrücklich Geschlechtsverkehr oder ein gemeinsames Bett zu behaupten.
- source_word: Βαγώας / Ἰουδείθ
  choice: Bagoas / Judit
  rationale: Die Eigennamen werden in ihren im modernen deutschen Bibelgebrauch geläufigen Formen wiedergegeben.
