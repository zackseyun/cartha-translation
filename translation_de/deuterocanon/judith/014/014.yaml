  register: Moderne, würdige Erzählsprache. »Klopfte an den Vorhang« formuliert die im Kontext naheliegende Handlung idiomatisch; die Fußnote bewahrt die formalere lexikalische Möglichkeit. Der Name Holofernes wird zur Klärung des im Griechischen lediglich pronominal bezeichneten Subjekts eingesetzt.
