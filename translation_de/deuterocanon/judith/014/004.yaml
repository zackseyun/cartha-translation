  source_fidelity: 'Die Übersetzung gibt alle maßgeblichen Elemente des griechischen Textes wieder: die angesprochene Gruppe („ihr und alle, die … wohnen“), das Nachsetzen als Wiedergang zu ἐπακολουθήσαντες, die räumliche Bestimmung „im ganzen Gebiet Israels“ sowie den militärischen Imperativ καταστρώσατε mit „streckt sie … nieder“. „Auf ihren Wegen“ wahrt die konkrete, im Griechischen nicht weiter spezifizierte Ortsangabe ἐν ταῖς ὁδοῖς αὐτῶν.'
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch und behält einen angemessen würdevollen, direkten Aufforderungston. Die Auflösung des griechischen Partizips in die koordinierte Aufforderung „setzt ihnen nach … und streckt sie … nieder“ ist idiomatisch und erhält den Handlungszusammenhang.
  terminology: „Gebiet Israels“ ist für πᾶν ὅριον Ἰσραήλ im Zusammenhang mit Bewohnern treffend. „Jemandem nachsetzen“ und „niederstrecken“ passen zum militärischen Kontext, ohne zusätzliche Details wie Flucht oder eine bestimmte Art der Tötung einzutragen. Die Fußnote markiert die mögliche weniger kontextuell zugespitzte Wiedergabe von ἐπακολουθήσαντες angemessen.
