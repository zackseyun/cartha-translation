  yaml_path: translation/deuterocanon/judith/014/004.yaml
  text: Then you and all who live within the whole territory of Israel[a], following after them[b], strike them down on their roads.
translation:
  language: de
  text: Dann setzt ihnen nach[a], ihr und alle, die im ganzen Gebiet Israels wohnen, und streckt sie auf ihren Wegen nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „folgt ihnen“; das griechische Partizip kann sowohl das Hinterhergehen als auch, wie hier im Zusammenhang naheliegend, das Verfolgen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακολουθήσαντες
  choice: setzt ihnen nach
  rationale: Das Aoristpartizip bezeichnet eine die Aufforderung begleitende beziehungsweise ihr vorausgehende Handlung. „Jemandem nachsetzen“ gibt im militärischen Zusammenhang sowohl das Hinterhergehen als auch den naheliegenden Verfolgungssinn wieder.
- source_word: οἱ κατοικοῦντες
  choice: die … wohnen
  rationale: Die gegenwärtige Partizipialform bezeichnet die ansässige Bevölkerung; „die … wohnen“ ist im modernen Standarddeutsch natürlich und sachlich.
- source_word: πᾶν ὅριον Ἰσραήλ
  choice: im ganzen Gebiet Israels
  rationale: ὅριον kann Grenze, Gegend oder Gebiet bezeichnen. In Verbindung mit „wohnen“ ist die räumliche Ausdehnung Israels gemeint, nicht nur seine Grenzlinie.
- source_word: καταστρώσατε
  choice: streckt sie … nieder
  rationale: Der Imperativ bezeichnet im militärischen Kontext das Niederwerfen oder Niedermachen der Gegner. „Niederstrecken“ ist kraftvoll, verständlich und wahrt das konkrete Gewaltgeschehen.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: auf ihren Wegen
  rationale: Die Wendung bedeutet wörtlich „auf/in ihren Wegen“. „Auf ihren Wegen“ bewahrt das konkrete Bild, ohne ausdrücklich „Fluchtwege“ einzutragen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Aufforderungssprache. Das griechische Partizip wurde für natürliches Deutsch als koordinierte Aufforderung wiedergegeben; die eingeschobene Subjektgruppe bewahrt, dass sowohl die Angesprochenen als auch alle Bewohner des Gebiets Israel handeln sollen.
