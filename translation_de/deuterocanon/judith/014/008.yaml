  text: And now tell me what you have done in these days[a]. And Judith reported to him, in the midst of the people, all that she had done[b], from the day when she went out until the time when she was speaking to them.
translation:
  language: de
  text: Und nun berichte mir, was du in diesen Tagen getan hast. Und Judit berichtete ihm mitten im Volk[a] alles, was sie getan hatte, von dem Tag an, an dem sie hinausgegangen war, bis zu dem Zeitpunkt, als sie zu ihnen redete.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »vor dem Volk«. Der griechische Ausdruck kann sowohl den Ort inmitten des Volkes als auch die öffentliche Situation vor dem versammelten Volk hervorheben.
    reason: lexical_alternative
  - marker: b
    text: Oder »bis sie zu ihnen sprach«. Das griechische Imperfekt kann den andauernden Vorgang des Redens hervorheben, hier aber auch einfach erzählerisch verwendet sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγγειλόν μοι
  choice: berichte mir
  rationale: Der Imperativ verlangt eine unmittelbare Schilderung der Ereignisse. »Berichte mir« gibt sowohl den Mitteilungscharakter als auch den persönlichen Bezug von μοι wieder.
- source_word: ὅσα ἐποίησας
  choice: was du … getan hast
  rationale: Das deutsche Perfekt bezeichnet hier natürlich die in der jüngsten Vergangenheit vollbrachten Handlungen, nach denen nun gefragt wird.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: in diesen Tagen
  rationale: Die Formulierung bleibt eng am griechischen Zeitbezug, ohne den Zeitraum genauer festzulegen.
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: »Berichtete« bewahrt die sprachliche Verbindung zum vorausgehenden ἀνάγγειλον und bezeichnet eine geordnete Wiedergabe des Geschehenen.
- source_word: ἐν μέσῳ τοῦ λαοῦ
  choice: mitten im Volk
  rationale: Die räumlich anschauliche Wendung entspricht dem Griechischen; zugleich kann der Zusammenhang eine öffentliche Mitteilung vor dem versammelten Volk meinen.
- source_word: πάντα ὅσα ἦν πεποιηκυῖα
  choice: alles, was sie getan hatte
  rationale: Das Plusquamperfekt gibt den periphrastischen griechischen Ausdruck für bereits abgeschlossene Handlungen natürlich wieder.
- source_word: ἀφʼ ἧς ἡμέρας ἐξῆλθεν
  choice: von dem Tag an, an dem sie hinausgegangen war
  rationale: »Hinausgegangen« bewahrt die konkrete Bedeutung von ἐξῆλθεν; das Plusquamperfekt ordnet den Aufbruch zeitlich vor dem Bericht ein.
- source_word: ἕως οὗ ἐλάλει αὐτοῖς
  choice: bis zu dem Zeitpunkt, an dem sie zu ihnen sprach
  rationale: Die Formulierung bildet die zeitliche Grenze ab. Das deutsche Präteritum liest sich natürlich, während eine Fußnote auf den möglichen Verlaufsaspekt des griechischen Imperfekts hinweist.
