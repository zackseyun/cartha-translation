review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ὡς δʼ οὐθεὶς ἐπήκουσεν als „Als aber niemand antwortete“ und von διαστείλας als Auseinanderziehen eines erschlossenen Vorhangs ist kontextgerecht. χελωνίς ist ein schwieriger und lexikalisch umstrittener Einrichtungsbegriff. „Fußschemel“ ist als mögliche konkrete Wiedergabe vertretbar, muss aber, anders als im Entwurf, deutlich als unsicher markiert bleiben; die Alternativen Bettüberdachung bzw. Behang dürfen nicht unterschlagen werden. ἐρριμμένον verlangt außerdem, dass neben dem Liegen des Toten die vorausgehende Handlung des Hingeworfenwerdens erkennbar bleibt.
  naturalness: Der Entwurf ist überwiegend natürliches, modernes Standarddeutsch. „tot auf den Fußschemel hingeworfen“ ist zwar verständlich, wirkt aber in der Stellung des Partizips etwas gedrängt. „tot auf dem Fußschemel liegen, dorthin geworfen“ ist flüssiger und gibt sowohl den vorgefundenen Zustand als auch die perfektische Partizipbedeutung wieder. „Schlafgemach“ passt zum gehobenen erzählerischen Register.
  terminology: „Vorhang“, „Schlafgemach“ und „sein Kopf war ihm abgenommen worden“ sind angemessen. Die Formulierung über den Kopf bewahrt das absichtlich konkrete griechische Bild, ohne die Aussage voreilig auf die Zusammenfassung „enthauptet“ zu reduzieren. Die Fußnotenanker sind in der revidierten Fassung jeweils unmittelbar mit dem erläuterten Ausdruck verbunden.
