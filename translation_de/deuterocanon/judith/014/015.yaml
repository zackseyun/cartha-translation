  yaml_path: translation/deuterocanon/judith/014/015.yaml
  text: But when no one answered[a], he drew aside the curtain and went into the bedroom, and found him lying dead on the canopy[b], and his head had been taken from him.
translation:
  language: de
  text: Als aber niemand antwortete, zog er den Vorhang[a] auseinander, ging in das Schlafgemach und fand ihn tot auf dem Fußschemel[b] liegen, dorthin geworfen; sein Kopf war ihm abgenommen worden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht kein Gegenstand dabei: „zog auseinander“ oder „teilte“. Gemeint ist wahrscheinlich ein Vorhang oder Behang.'
    reason: implicit_object
  - marker: b
    text: Das seltene griechische Wort ist unsicher. Es kann einen niedrigen Fußschemel oder ein anderes zum Bett gehörendes Möbelstück bezeichnen; auch eine Bettüberdachung oder ein Behang wird erwogen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Sein Kopf war von ihm weggenommen worden“; gemeint ist, dass er enthauptet worden war.'
    reason: literal_rendering
lexical_decisions:
- source_word: ὡς δʼ οὐθεὶς ἐπήκουσεν
  choice: Als aber niemand antwortete
  rationale: ἐπακούω bezeichnet hier im Zusammenhang mit dem vorherigen Rufen das Reagieren beziehungsweise Antworten, nicht bloß das akustische Hören.
- source_word: διαστείλας
  choice: zog er den Vorhang auseinander
  rationale: Das Partizip bedeutet „auseinanderziehen/teilen“; das im Griechischen nicht genannte Objekt wird aus der Szene als Vorhang oder Behang erschlossen und zur Verständlichkeit ergänzt.
- source_word: κοιτῶνα
  choice: Schlafgemach
  rationale: κοιτών bezeichnet einen Schlafraum. „Schlafgemach“ ist würdevoll und präzise, ohne so altertümlich wie „Schlafkammer“ zu wirken.
- source_word: ἐπὶ τῆς χελώνιδος
  choice: auf den Fußschemel
  rationale: χελωνίς kann hier ein niedriges, zum Bett gehörendes Möbelstück beziehungsweise einen Fußschemel bezeichnen. Dies passt dazu, dass der Körper zuvor vom Bett hinabgerollt wurde; die sachliche Unsicherheit wird in einer Fußnote bewahrt.
- source_word: ἐρριμμένον νεκρόν
  choice: tot ... hingeworfen
  rationale: 'Die Wiedergabe erhält sowohl den Zustand des Todes als auch die resultative Bedeutung des Perfektpartizips von ῥίπτω: Der Körper war hingeworfen worden und lag noch dort.'
- source_word: ἡ κεφαλὴ αὐτοῦ ἀφῄρητο ἀπʼ αὐτοῦ
  choice: sein Kopf war ihm abgenommen worden
  rationale: Die Formulierung folgt dem auffälligen griechischen Bild, wonach der Kopf „von ihm weggenommen“ war, und verdichtet es nicht stillschweigend zu „er war enthauptet worden“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am griechischen Erzähltempo. „Schlafgemach“ wahrt den gehobenen narrativen Ton; die ungewöhnliche Aussage über den abgenommenen Kopf bleibt erhalten. Unsichere Einrichtungsbegriffe und das ergänzte Objekt bei διαστείλας werden nicht als sicher ausgegeben, sondern in Fußnoten offengelegt.
