base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/005.yaml
  text: But before you do these things[a], call Achior the Ammonite to me[c][b], so that he may see and recognize the one who has treated the house of Israel with contempt and has sent him to us as if to death.
translation:
  language: de
  text: Doch bevor ihr dies tut, ruft Achior, den Ammoniter, zu mir, damit er den sieht und erkennt[a], der das Haus Israel verachtet und ihn[b] wie zum Tod zu uns geschickt hat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen zwei Verben nebeneinander: „sieht und erkennt“. Das zweite kann auch ein volles oder sicheres Erkennen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: '„Ihn“ bezieht sich im Zusammenhang sehr wahrscheinlich auf Achior: Der Verächter Israels hatte Achior zu ihnen geschickt, als wäre er damit dem Tod ausgeliefert.'
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: „als ginge es für ihn in den Tod“ oder „als wäre er zum Tod bestimmt“. Die griechische Wendung lautet wörtlich „wie zum Tod“ und kann andeuten, dass Achior als dem Tod ausgeliefert gesandt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ δὲ τοῦ ποιῆσαι ταῦτα
  choice: Doch bevor ihr dies tut
  rationale: Die Verbindung aus πρό und substantiviertem Infinitiv bezeichnet zeitliche Vorordnung; δέ wird als milder Übergang mit „doch“ wiedergegeben. Der Plural „ihr“ entspricht dem pluralischen Imperativ im Folgesatz.
- source_word: καλέσατέ μοι
  choice: ruft ... zu mir
  rationale: καλέω bedeutet hier „rufen“ beziehungsweise „herbeirufen“; der Dativ μοι wird natürlich mit „zu mir“ ausgedrückt.
- source_word: Ἀχιὼρ τὸν Ἀμμανείτην
  choice: Achior, den Ammoniter
  rationale: Der Personenname wird transliteriert; die ethnische Bezeichnung wird als Apposition im Akkusativ wiedergegeben.
- source_word: ἵνα ἴδῃ ἐπιγνοῖ
  choice: damit er ... sieht und erkennt
  rationale: Die beiden aufeinanderfolgenden Konjunktive bezeichnen den Zweck. „sieht und erkennt“ bewahrt sowohl die Zweigliedrigkeit als auch die Steigerung vom Sehen zum Erkennen.
- source_word: τὸν ἐκφαυλίσαντα
  choice: der ... verachtet
  rationale: ἐκφαυλίζω bezeichnet geringschätziges Behandeln oder Verachten. „verachtet“ ist knapp, klar und dem gehobenen biblischen Register angemessen.
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: das Haus Israel
  rationale: Die feste biblische Wendung bezeichnet Israel als Volk und wird in ihrer traditionellen, weiterhin verständlichen Form bewahrt.
- source_word: καὶ αὐτὸν
  choice: und ihn
  rationale: Das Pronomen wird nicht durch den Namen ersetzt, sodass die grammatische Form und eine geringe Bezugsambiguität des Griechischen erhalten bleiben; im Zusammenhang bezieht es sich am ehesten auf Achior.
- source_word: ἀποστείλαντα εἰς ἡμᾶς
  choice: zu uns geschickt hat
  rationale: Das koordinierte Aoristpartizip wird im Deutschen als zweites Relativsatzprädikat wiedergegeben.
- source_word: ὡς εἰς θάνατον
  choice: wie in den Tod
  rationale: Die ungewöhnliche, durch ὡς qualifizierte Formulierung bleibt sichtbar. Sie stellt Achiors Sendung als eine Sendung in den Tod beziehungsweise als Auslieferung an einen vermeintlich sicheren Tod dar, ohne dies im Haupttext festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem biblischem Ausdruck „Haus Israel“. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber durch einen deutschen Relativsatz natürlich gestaltet. Die markante Wendung „wie in den Tod“ bleibt bewusst leicht fremdartig, damit die durch ὡς ausgedrückte Unschärfe nicht eingeebnet wird.
