base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/010.yaml
  text: And when Achior saw all that the God of Israel had done[a], he believed in God greatly, and he circumcised the flesh of his foreskin[b], and was joined to the house of Israel to this day.
translation:
  language: de
  text: Als Achior aber alles sah, was der Gott Israels getan hatte, glaubte er fest an Gott[a], ließ sich beschneiden und wurde dem Haus Israel hinzugefügt[b] – bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vertraute er ganz auf Gott“. Das griechische Wort kann je nach Zusammenhang Glauben oder Vertrauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurde in das Haus Israel aufgenommen“. Gemeint ist Achiors Eingliederung in das Volk Israel.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Als ... sah
  rationale: Das Aoristpartizip bezeichnet den zeitlichen und zugleich sachlichen Anlass der folgenden Handlungen; die finite Konstruktion ist im Deutschen natürlich.
- source_word: πάντα ὅσα ἐποίησεν
  choice: alles, was ... getan hatte
  rationale: Gibt die Gesamtheit der zuvor geschilderten Taten idiomatisch wieder; das Plusquamperfekt ordnet sie dem Sehen Achiors zeitlich vor.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: der Gott Israels
  rationale: Bewahrt die geläufige genitivische Gottesbezeichnung ohne Paraphrase.
- source_word: ἐπίστευσεν τῷ θεῷ σφόδρα
  choice: glaubte er fest an Gott
  rationale: πιστεύω mit Dativ bezeichnet hier gläubiges Vertrauen auf Gott; „fest“ gibt die Verstärkung durch σφόδρα in natürlichem Deutsch wieder.
- source_word: περιέτεμετο τὴν σάρκα τῆς ἀκροβυστίας αὐτοῦ
  choice: Er ließ das Fleisch seiner Vorhaut beschneiden
  rationale: Das Medium kann kausativ-reflexiv verstanden werden. „ließ ... beschneiden“ vermeidet die im Deutschen naheliegende, aber wahrscheinlich unbeabsichtigte Aussage, Achior habe den Eingriff eigenhändig vorgenommen, und bewahrt zugleich die konkrete Objektformulierung.
- source_word: προσετέθη
  choice: wurde ... hinzugefügt
  rationale: Die Passivform wird formal bewahrt und bezeichnet seine Aufnahme in das Volk.
- source_word: πρὸς τὸν οἶκον Ἰσραήλ
  choice: dem Haus Israel
  rationale: Bewahrt die biblische Gemeinschaftsbezeichnung; der deutsche Dativ entspricht der Verbindung mit „hinzufügen“.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: bis auf diesen Tag
  rationale: Bewahrt die Perspektive der Erzählergegenwart und den leicht feierlichen biblischen Ton.
theological_decisions:
- issue: Bedeutung von πιστεύω im Zusammenhang von Achiors Hinwendung
  choice: glaubte er fest an Gott
  alternative: vertraute er ganz auf Gott
  rationale: Die Hauptfassung wahrt den sprachlichen Bezug zum Glauben, während die Fußnote die ebenso mögliche Vertrauensnuance nennt, ohne eine spätere dogmatische Formel einzutragen.
- issue: Aufnahme Achiors in Israel
  choice: wurde dem Haus Israel hinzugefügt
  alternative: wurde in das Haus Israel aufgenommen
  rationale: Die formnähere Passivform bewahrt das Bild des Hinzugefügtwerdens und vermeidet nicht ausdrücklich genannte technische Bezeichnungen wie „Proselyt“.
- issue: Vollzug der Beschneidung
  choice: Er ließ das Fleisch seiner Vorhaut beschneiden
  alternative: Er beschnitt das Fleisch seiner Vorhaut
  rationale: Das griechische Medium lässt eine reflexive beziehungsweise veranlasste Handlung zu. Die deutsche Fassung bezeichnet Achiors Veranlassung, ohne unnötig festzulegen, dass er den Eingriff eigenhändig ausführte.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. „Haus Israel“ und „bis auf diesen Tag“ erhalten die markanten biblischen Wendungen; „glaubte ... fest“ klingt natürlicher als eine wörtliche adverbiale Verstärkung mit „sehr“.
