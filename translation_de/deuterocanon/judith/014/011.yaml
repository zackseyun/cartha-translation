  yaml_path: translation/deuterocanon/judith/014/011.yaml
  text: When dawn came up, they hung the head of Holofernes from the wall, and every man of Israel took up his weapons and went out in companies to the mountain passes.
translation:
  language: de
  text: Als die Morgendämmerung heraufzog, hängten sie den Kopf des Holofernes von der Mauer auf[a]. Jeder Mann Israels nahm seine Waffen, und sie gingen in Abteilungen zu den Aufstiegswegen hinaus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hängten sie den Kopf des Holofernes an der Mauer auf«. Wörtlich steht im Griechischen »von der Mauer«; die genaue räumliche Vorstellung bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zu den Aufstiegen«; gemeint sein können bergauf führende Wege oder Bergpässe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡνίκα
  choice: als
  rationale: Die temporale Konjunktion leitet den Zeitpunkt des Geschehens ein; »als« ist im Deutschen natürlich und fügt keinen zusätzlichen Diskursmarker hinzu.
- source_word: ὁ ὄρθρος ἀνέβη
  choice: die Morgendämmerung heraufzog
  rationale: Bewahrt das Bild des aufsteigenden Tagesanbruchs in natürlichem, gehobenem Standarddeutsch.
- source_word: ἐκρέμασαν τὴν κεφαλὴν Ὀλοφέρνου ἐκ τοῦ τείχους
  choice: sie hängten den Kopf des Holofernes von der Mauer herab
  rationale: Gibt das Hängen von einem Befestigungspunkt an der Mauer wieder; »herab« macht die im griechischen ἐκ liegende räumliche Beziehung verständlich, ohne den Zweck der Zurschaustellung ausdrücklich hinzuzufügen.
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: jeder Mann Israels
  rationale: Bewahrt die ausdrücklich maskuline, distributive Formulierung des griechischen Textes.
- source_word: ἀνέλαβεν τὰ ὅπλα αὐτοῦ
  choice: nahm seine Waffen
  rationale: Entspricht dem militärischen Sinn von ἀναλαμβάνω mit ὅπλα; »Waffen« ist für heutige Leser eindeutiger als »Rüstung«.
- source_word: κατὰ σπείρας
  choice: in Abteilungen
  rationale: Bezeichnet geordnete Gruppen oder Truppeneinheiten, ohne eine technisch zu genaue militärische Größenordnung festzulegen.
- source_word: ἐπὶ τὰς ἀναβάσεις
  choice: zu den ansteigenden Zugangswegen
  rationale: Gibt die wörtlichen »Aufstiege« im militärisch-geografischen Zusammenhang verständlich wieder, ohne sie sicher als Bergpässe festzulegen.
