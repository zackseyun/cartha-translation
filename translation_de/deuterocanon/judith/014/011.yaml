translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung löst den Wechsel vom distributiven Singular (»jeder Mann«) zur pluralischen Verbform des griechischen Textes verständlich auf. Geografische und räumliche Mehrdeutigkeiten werden im Haupttext lesbar wiedergegeben und in den Fußnoten offengehalten.
