base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/002.yaml
  text: And it shall be[a], when dawn breaks and the sun rises upon the earth, each of you shall take up your weapons of war, and every mighty man shall go out beyond the city. You shall appoint a leader over them, as though going down to the plain against the advance guard of the sons of Asshur[b]; but you shall not go down.
translation:
  language: de
  text: Und wenn das Morgenlicht anbricht und die Sonne über der Erde aufgeht, soll jeder von euch seine Kriegswaffen nehmen, und jeder starke Mann soll vor die Stadt hinausgehen. Gebt ihnen einen Anführer, als wolltet ihr in die Ebene hinabziehen, der Vorhut[a] der Söhne Assurs[b] entgegen; doch zieht nicht hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Vorposten“. Das griechische προφυλακή kann eine Vorhut, einen Vorposten oder eine vorgeschobene Wache bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Söhne Assurs“ gibt die griechische Wendung wörtlich wieder; gemeint sind die Assyrer.
    reason: cultural_note
lexical_decisions:
- source_word: διαφαύσῃ ὁ ὄρθρος
  choice: das Morgenlicht anbricht
  rationale: Die Wendung bezeichnet das erste Aufleuchten des Morgens. „Das Morgenlicht bricht an“ ist natürliches modernes Deutsch und bewahrt das Lichtmotiv des griechischen Verbs.
- source_word: ἐξέλθῃ ὁ ἥλιος ἐπὶ τὴν γῆν
  choice: die Sonne über der Erde aufgeht
  rationale: „Aufgehen“ gibt die Bewegung der hervortretenden Sonne idiomatisch wieder; „über der Erde“ bewahrt die räumliche Bildsprache von ἐπὶ τὴν γῆν.
- source_word: ἀναλήμψεσθε ἕκαστος τὰ σκεύη τὰ πολεμικὰ ὑμῶν
  choice: soll jeder von euch seine Kriegswaffen nehmen
  rationale: Die futurische Anweisung wird mit „soll“ wiedergegeben. Im militärischen Zusammenhang bezeichnet σκεύη πολεμικά die Waffen beziehungsweise Kriegsausrüstung; „Kriegswaffen“ ist klar und prägnant.
- source_word: πᾶς ἀνὴρ ἰσχύων
  choice: jeder kampffähige Mann
  rationale: ἀνήρ wird ausdrücklich als „Mann“ wiedergegeben. Das Partizip ἰσχύων bezeichnet hier im Zusammenhang des militärischen Auszugs einen Mann, der über die erforderliche Kraft verfügt; „kampffähig“ vermittelt diese kontextuelle Bedeutung natürlicher als „stark“.
- source_word: δώσετε ἀρχηγὸν εἰς αὐτούς
  choice: Gebt ihnen einen Anführer
  rationale: Die knappe Formulierung bleibt nahe am griechischen „einen Anführer geben“ und ist zugleich verständliches Deutsch. Der Futur hat hier anweisenden beziehungsweise imperativischen Sinn.
- source_word: ὡς καταβαίνοντες ἐπὶ τὸ πεδίον
  choice: als wolltet ihr in die Ebene hinabziehen
  rationale: ὡς bezeichnet hier den Anschein beziehungsweise die vorgetäuschte Absicht. Der Konjunktiv „als wolltet ihr“ macht diese taktische Täuschung deutlich, ohne sie weiter auszudeuten.
- source_word: εἰς τὴν προφυλακὴν υἱῶν Ἀσσούρ
  choice: der Vorhut der Söhne Assurs entgegen
  rationale: προφυλακή kann eine Vorhut, einen Vorposten oder eine vorgeschobene Wache bezeichnen. „Vorhut“ passt zum militärischen Zusammenhang; „Söhne Assurs“ bewahrt die konkrete griechische Volksbezeichnung.
- source_word: οὐ καταβήσεσθε
  choice: doch zieht nicht hinab
  rationale: Der griechische Futur dient als nachdrückliche Anweisung. Der deutsche Imperativ gibt das Verbot natürlich und eindeutig wieder.
theological_decisions:
- issue: Geschlechtsspezifische militärische Bezeichnung in πᾶς ἀνὴρ ἰσχύων
  choice: jeder kampffähige Mann
  alternative: jede kampffähige Person; jeder Krieger
  rationale: Der Ausgangstext verwendet ἀνήρ, eine ausdrücklich männliche Bezeichnung. Die Übersetzung erhält diese Referenz und gibt zugleich die militärisch relevante Stärke durch „kampffähig“ wieder, statt sie geschlechtsneutral zu verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Bildsprache. Die anweisenden griechischen Futurformen werden je nach deutscher Satzführung mit „soll“ oder Imperativ wiedergegeben. Die ethnische Wendung „Söhne Assurs“ und die mögliche Bedeutungsbreite von προφυλακή bleiben durch Text und Fußnoten sichtbar.
