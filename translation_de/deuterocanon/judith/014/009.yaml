  text: And when she stopped speaking[a], the people shouted with a loud voice and raised a joyful cry in their city.
translation:
  language: de
  text: Als sie aufgehört hatte zu sprechen, stieß das Volk einen lauten Ruf aus und erhob in seiner Stadt einen Freudenruf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als
  rationale: Leitet den folgenden Vorgang zeitlich ein; im Deutschen trägt „Als“ den Erzählfluss natürlich, ohne ein zusätzliches „und“ zu erzwingen.
- source_word: ἐπαύσατο λαλούσα
  choice: sie aufgehört hatte zu sprechen
  rationale: Gibt das Aufhören der fortdauernden Rede klar und in natürlichem modernem Deutsch wieder.
- source_word: ἠλάλαξεν
  choice: brach ... in Jubel aus
  rationale: Das Verb bezeichnet einen lauten Ausruf, teils auch einen Schlachtruf. Im feierlichen Kontext vermittelt „in Jubel ausbrechen“ die hörbare, gemeinschaftliche Freudenreaktion, ohne einen unangebrachten militärischen Sinn festzulegen.
- source_word: ὁ λαός
  choice: das Volk
  rationale: Entspricht der kollektiven Bedeutung von λαός und passt zum biblischen Erzählregister.
- source_word: φωνῇ μεγάλῃ
  choice: mit lautem Ruf
  rationale: Bewahrt die konkrete stimmliche Ausdrucksweise des griechischen Dativs und klingt natürlicher als das wörtliche „mit großer Stimme“.
- source_word: ἔδωκεν φωνὴν εὐφρόσυνον
  choice: ließ ... einen Freudenruf erschallen
  rationale: Gibt die griechische Wendung idiomatisch wieder und erhält sowohl den hörbaren Ausruf als auch seinen freudigen Charakter.
- source_word: ἐν τῇ πόλει αὐτῶν
  choice: in seiner Stadt
  rationale: Bewahrt Ortsangabe und Possessivbezug; da „das Volk“ im Deutschen grammatisch singularisch ist, lautet das rückbezügliche Pronomen „seiner“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden eng verwandten Aussagen über lautes Rufen und Freudenruf bleiben als rhetorische Steigerung erhalten, werden jedoch idiomatisch formuliert.
