base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/013.yaml
  text: And they came to Holofernes’s tent[a], and said to the one over all his affairs, “Wake our lord at once, because the servants have dared to come down against us for battle, so that they may be utterly destroyed.”
translation:
  language: de
  text: 'Sie kamen zum Zelt des Holofernes und sagten zu dem, der für alles verantwortlich war, was Holofernes gehörte[a]: »Weck sofort unseren Herrn! Denn die Sklaven haben es gewagt, zum Kampf gegen uns herabzuziehen, damit sie restlos vernichtet werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »zu dem, der über allem stand, was ihm gehörte«. Gemeint ist der für Holofernes’ Angelegenheiten oder Besitz zuständige Mann. Die griechische Formulierung ist an dieser Stelle schwierig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο
  choice: sie kamen
  rationale: Das Verb bezeichnet hier das Eintreffen an einem Ort; „sie kamen“ ist natürlich und wahrt den Erzählfluss.
- source_word: σκηνή
  choice: Zelt
  rationale: Im militärischen Zusammenhang ist das Feld- beziehungsweise Wohnzelt des Holofernes gemeint; „Heiligtum“ oder „Stiftshütte“ wäre sachlich irreführend.
- source_word: τῷ οὔτι ἐπὶ πάντων τῶν αὐτοῦ
  choice: zu dem, der für alles verantwortlich war, was ihm gehörte
  rationale: Die überlieferte griechische Formulierung ist schwierig, bezeichnet im Zusammenhang aber den Mann, der Holofernes’ Besitz oder Angelegenheiten verwaltete. Die Übersetzung beschreibt seine Funktion, ohne einen im Text nicht ausdrücklich genannten Amtstitel einzuführen.
- source_word: Ἔγειρον δὴ
  choice: Weck sofort
  rationale: Der Imperativ verlangt das Aufwecken; „sofort“ gibt die Dringlichkeit der Partikel δὴ idiomatisch wieder.
- source_word: κύριον
  choice: Herrn
  rationale: κύριος bezeichnet hier den menschlichen Vorgesetzten Holofernes, nicht Gott. „Unseren Herrn“ entspricht der ehrerbietigen Anrede seiner Untergebenen.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Die Sprecher verwenden δοῦλοι abwertend für die als untergeordnet betrachteten Gegner. „Sklaven“ bewahrt diese scharfe soziale und polemische Färbung besser als das mildere „Diener“.
- source_word: καταβαίνειν ἐφʼ ἡμᾶς
  choice: gegen uns herabzuziehen
  rationale: Die Wiedergabe erhält sowohl die räumliche Vorstellung des Herabziehens als auch die feindliche Stoßrichtung von ἐπί.
- source_word: εἰς πόλεμον
  choice: zum Kampf
  rationale: Die Wendung bezeichnet hier den Zweck des Herabziehens und wird im Deutschen natürlich mit „zum Kampf“ wiedergegeben.
- source_word: ἵνα ἐξολοθρευθῶσιν εἰς τέλος
  choice: damit sie restlos vernichtet werden
  rationale: Das Vernichtungsverb und die Verstärkung εἰς τέλος bringen gemeinsam vollständige Auslöschung zum Ausdruck; „restlos“ bewahrt diese Emphase.
theological_decisions:
- issue: Wiedergabe von δοῦλοι als abwertende Bezeichnung im militärischen Kontext
  choice: Sklaven
  alternative: Diener
  rationale: Hier geht es nicht um ehrenvollen Dienst, sondern um eine verächtliche Bezeichnung der vermeintlich untergeordneten Feinde. „Sklaven“ erhält die Härte des griechischen Ausdrucks, ohne sie abzuschwächen.
- issue: Zwecksatz ἵνα ἐξολοθρευθῶσιν
  choice: damit sie restlos vernichtet werden
  alternative: sodass sie restlos vernichtet werden
  rationale: ἵνα bezeichnet am natürlichsten den von den Sprechern beabsichtigten Ausgang des Kampfes. Die Übersetzung wahrt diese Zielrichtung, ohne zu behaupten, dass die Vernichtung tatsächlich eintreten werde.
translation_notes:
  register: Moderner, gut verständlicher und zugleich würdiger Erzählstil. Die direkte Rede ist dringlich und militärisch; die räumliche Bildlichkeit des Herabziehens sowie die polemische Schärfe von δοῦλοι bleiben erhalten.
