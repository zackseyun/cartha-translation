base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/007.yaml
  text: And when they had taken him up[a], he fell at Judith’s feet and bowed before her, and he said, “Blessed are you in every dwelling of Judah and among every nation[b]; those who hear your name will be thrown into confusion.”
translation:
  language: de
  text: 'Als sie ihm aufgeholfen hatten, fiel er Judit zu Füßen, warf sich vor ihr nieder und sagte: »Gesegnet bist du in jeder Wohnstätte[a] Judas und bei jedem Volk; alle, die deinen Namen hören, werden in Unruhe geraten[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in jedem Zelt Judas«. Das griechische Wort kann sowohl ein Zelt als auch allgemeiner eine Wohnstätte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »werden in Verwirrung geraten«, »werden beunruhigt werden« oder »werden erschüttert werden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέλαβον
  choice: sie ihn aufgerichtet hatten
  rationale: Der Aorist von ἀναλαμβάνω bezeichnet hier am ehesten, dass man ihn aufnahm beziehungsweise ihm aufhalf. »Aufgerichtet« bewahrt die konkrete Bewegung und klingt im Deutschen natürlich.
- source_word: προσέπεσεν τοῖς ποσὶν Ἰουδεὶθ
  choice: fiel er Judit zu Füßen
  rationale: Die geläufige deutsche Wendung gibt sowohl die körperliche Handlung als auch die darin liegende Ehrerbietung wieder.
- source_word: προσεκύνησεν τῷ προσώπῳ αὐτῆς
  choice: verneigte sich vor ihr
  rationale: προσκυνέω kann Anbetung oder menschliche Huldigung bezeichnen. Im unmittelbaren Kontext ist eine ehrerbietige Niederwerfung vor Judit gemeint; »verneigte sich vor ihr« vermeidet eine unbegründete Festlegung auf göttliche Anbetung.
- source_word: Εὐλογημένη σὺ
  choice: Gesegnet bist du
  rationale: Die Formulierung bewahrt den feierlichen Charakter der griechischen Segensformel und ist zugleich idiomatisches Deutsch.
- source_word: ἐν παντὶ σκηνώματι Ἰούδα
  choice: in jeder Wohnstätte Judas
  rationale: σκήνωμα kann ein Zelt oder allgemeiner eine Wohnstätte bezeichnen. »Wohnstätte« erhält die Bedeutungsbreite; die konkretere Möglichkeit »Zelt« wird in einer Fußnote genannt.
- source_word: ἐν παντὶ ἔθνει
  choice: unter jedem Volk
  rationale: ἔθνος bezeichnet hier die Völker außerhalb Judas. »Unter jedem Volk« folgt der distributiven Form des Griechischen und klingt im Deutschen natürlich.
- source_word: οἵτινες ἀκούσαντες τὸ ὄνομά σου
  choice: alle, die deinen Namen hören
  rationale: Das Relativpronomen οἵτινες hat hier verallgemeinernde Kraft. Die deutsche Formulierung gibt dies knapp und klar wieder.
- source_word: ταραχθήσονται
  choice: werden erschüttert werden
  rationale: Das Futur Passiv von ταράσσω bezeichnet Beunruhigung, Erschütterung oder Verwirrung. »Erschüttert werden« wahrt die passive Form und legt die Reaktion nicht ausschließlich als Angst oder Verwirrung fest.
theological_decisions:
- issue: Bedeutung von προσκυνέω bei einer an Judit gerichteten Handlung
  choice: 'als menschliche Ehrerbietung wiedergegeben: »verneigte sich vor ihr«'
  alternative: »betete sie an« oder »warf sich vor ihr nieder«
  rationale: Da die Handlung einer menschlichen Person gilt, wird das Verb kontextgemäß als Huldigung verstanden, ohne ihm ausdrücklich den Sinn religiöser Anbetung zu geben. Zugleich bleibt der körperliche Akt bereits durch »fiel er Judit zu Füßen« deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Handlungsablauf, vermeidet jedoch unnötig schwerfällige Wiederholungen. Die Eigennamen werden in der im Deutschen üblichen Form »Judit« und die Gebietsbezeichnung »Judas« wiedergegeben.
