  text: And these men, after taking up their armor, will go into their camp and will rouse the commanders of the army of Assyria;
translation:
  language: de
  text: Und nachdem diese Männer ihre Rüstungen ergriffen haben, werden sie in ihr Lager gehen und die Befehlshaber des assyrischen Heeres wecken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: nachdem … angelegt haben
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die den beiden Hauptverben vorausgeht. Die temporale Wiedergabe macht diese Abfolge in natürlichem Deutsch deutlich; bei einer Rüstung ist „anlegen“ idiomatischer als das wörtlichere „aufnehmen“.
- source_word: οὗτοι
  choice: diese Männer
  rationale: Das Demonstrativpronomen ist hervorgehoben. Das ergänzte „Männer“ bewahrt den hinweisenden Charakter und sorgt im militärischen Zusammenhang für Klarheit.
- source_word: τὰς πανοπλίας αὐτῶν
  choice: ihre Rüstungen
  rationale: πανοπλία bezeichnet die vollständige Rüstung beziehungsweise Kampfausrüstung. Der Plural des griechischen Textes bleibt erhalten; „Rüstungen“ ist hier knapp und natürlich.
- source_word: παρεμβολὴν
  choice: Lager
  rationale: παρεμβολή bezeichnet in diesem militärischen Zusammenhang das Heerlager. „Lager“ ist die geläufige moderne Wiedergabe.
- source_word: ἐγεροῦσι
  choice: wecken
  rationale: Das Futur von ἐγείρω kann „aufwecken“ oder „aufrütteln“ bedeuten. Im unmittelbaren Zusammenhang ist das konkrete Wecken der Befehlshaber am naheliegendsten, ohne eine weitergehende Aktivierung auszuschließen.
- source_word: στρατηγοὺς
  choice: Befehlshaber
  rationale: στρατηγός bezeichnet militärische Führer. „Befehlshaber“ vermeidet die Festlegung auf einen bestimmten modernen Dienstgrad.
- source_word: δυνάμεως
  choice: Heer
  rationale: δύναμις bedeutet grundsätzlich „Macht“ oder „Streitmacht“, bezeichnet hier aber den militärischen Verband. „Heer“ passt zum erzählerischen und militärischen Kontext.
- source_word: Ἀσσούρ
  choice: assyrischen
  rationale: Ἀσσούρ bezeichnet hier Assyrien beziehungsweise die assyrische Macht. Die adjektivische Formulierung „des assyrischen Heeres“ ist in modernem Deutsch klar und idiomatisch.
