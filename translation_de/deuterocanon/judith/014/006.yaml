  yaml_path: translation/deuterocanon/judith/014/006.yaml
  text: And they called Achior out of the house of Ozias. But when he came and saw the head of Holofernes in the hand of one man in the assembly of the people[a], he fell on his face, and his spirit failed.
translation:
  language: de
  text: Da riefen sie Achior aus dem Haus Usijas. Als er kam und den Kopf des Holofernes in der Hand eines Mannes in der Versammlung des Volkes sah, fiel er auf sein Angesicht, und sein Geist versagte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sein Atem verließ ihn« / »Er verlor das Bewusstsein.« Wörtlich heißt es im Griechischen: »Sein Geist versagte«; die Wendung bezeichnet einen körperlichen Zusammenbruch oder eine Ohnmacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσαν
  choice: riefen sie
  rationale: Gibt das schlichte narrative Verb natürlich wieder; »ließen rufen« oder »bestellten ein« wäre stärker ausdeutend.
- source_word: τὸν Ἀχιὼρ
  choice: Achior
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: ἐκ τοῦ οἴκου Ὀζεία
  choice: aus dem Haus Usijas
  rationale: οἶκος bezeichnet hier am ehesten das konkrete Haus; »Usija« ist die geläufige deutsche Namensform.
- source_word: ὡς δὲ ἦλθεν
  choice: Als er kam
  rationale: Das schwach weiterführende δέ muss im Deutschen nicht eigens adversativ wiedergegeben werden; die temporale Konstruktion trägt den Erzählfortgang natürlich.
- source_word: ἴδεν τὴν κεφαλὴν Ὀλοφέρνου
  choice: den Kopf des Holofernes … sah
  rationale: Direkte, strukturtreue Wiedergabe des griechischen Ausdrucks.
- source_word: ἐν χειρὶ ἀνδρὸς ἑνὸς
  choice: in der Hand eines Mannes
  rationale: Der griechische Singular bleibt erhalten; »eines einzigen Mannes« würde ἑνός im Deutschen wahrscheinlich zu stark hervorheben.
- source_word: ἐν τῇ ἐκκλησίᾳ τοῦ λαοῦ
  choice: mitten in der Versammlung des Volkes
  rationale: ἐκκλησία bezeichnet hier die zusammengekommene Volksversammlung, nicht »Kirche«; »mitten in« verdeutlicht idiomatisch den örtlichen Rahmen, ohne den Sinn zu verändern.
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: fiel er auf sein Angesicht
  rationale: Bewahrt das anschauliche Körperbild und den würdigen Erzählton; »fiel er mit dem Gesicht zu Boden« wäre moderner, aber etwas erklärender.
- source_word: ἐξελύθη τὸ πνεῦμα αὐτοῦ
  choice: sein Geist versagte
  rationale: Bewahrt πνεῦμα und die Mehrdeutigkeit der Wendung, statt eindeutig Ohnmacht, Atemverlust oder Tod zu behaupten.
theological_decisions:
- issue: Bedeutung von πνεῦμα beim Zusammenbruch Achiors
  choice: sein Geist versagte
  alternative: er verlor das Bewusstsein
  rationale: Der Kontext legt einen körperlichen Zusammenbruch oder eine Ohnmacht nahe, doch die griechische Formulierung benennt ausdrücklich seinen πνεῦμα. Die Übersetzung hält diese Spannung offen und erläutert die idiomatischen Möglichkeiten in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. »Angesicht« setzt einen leicht gehobenen biblischen Akzent, bleibt aber verständlich. Die Versammlung wird bewusst nicht als »Gemeinde« oder »Kirche« bezeichnet.
