translation:
  language: de
  text: 'Und er ging in das Zelt, in dem Judit sich aufhielt[a], fand sie aber nicht. Da stürzte er hinaus zu den Leuten und schrie[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „logierte“; das griechische Partizip bezeichnet das vorübergehende Bleiben oder Logieren an einem Ort.'
