translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählrhythmus. „Judit“ folgt der im Deutschen verbreiteten Form des Buchnamens. Die beiden griechischen Partizipial- beziehungsweise Satzverbindungen werden natürlich ins Deutsche übertragen, ohne die lebhafte Bewegung und den lauten Ausruf abzuschwächen.
