lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ging in
  rationale: Gibt das erzählende Verb und die Bewegung in das Zelt natürlich und genau wieder.
- source_word: σκηνήν
  choice: Zelt
  rationale: Im Heerlager ist „Zelt“ die schlichte und sachlich passende Wiedergabe.
- source_word: καταλύουσα
  choice: Unterkunft genommen hatte
  rationale: Bezeichnet den vorübergehenden Aufenthalt beziehungsweise das Logieren an einem Ort; die deutsche Formulierung passt zum Rückbezug auf Judits bisherigen Aufenthalt.
- source_word: οὐχ εὗρεν αὐτήν
  choice: fand sie aber nicht
  rationale: Bewahrt den gewöhnlichen Sinn des Nichtauffindens und stellt den Gegensatz im Deutschen idiomatisch heraus.
- source_word: ἐξεπήδησεν
  choice: stürzte er hinaus
  rationale: Erhält die Anschaulichkeit und Plötzlichkeit der Bewegung besser als ein neutrales „ging hinaus“.
- source_word: λαόν
  choice: die Leute
  rationale: Gibt die versammelten Menschen wieder, ohne die Referenz unnötig auf Soldaten oder eine ungeordnete Menge einzuengen.
- source_word: κράζων
  choice: schrie
  rationale: Drückt den lauten Ruf knapp und intensiv aus; der Doppelpunkt führt inhaltlich zur anschließenden Rede.
