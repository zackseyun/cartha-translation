    rationale: μίασμα bezeichnet primär Befleckung bzw. Verunreinigung. „Zur Befleckung“ bewahrt diesen Aspekt und lässt die sexuelle Gewalttat weiterhin in der bildhaften Gesamtaussage erkennbar.
