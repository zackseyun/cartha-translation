base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/002.yaml
  text: And she said[a], “O Lord, God of my father Simeon, to whom you gave a sword in his hand for vengeance against foreigners, who loosed a virgin’s womb for defilement and bared the thigh for shame and profaned the womb for disgrace—though you said, ‘It shall not be so’[c][b]; but they did it.”
translation:
  language: de
  text: 'Und sie sagte: „Herr, Gott meines Vaters Simeon, dem du ein Schwert in die Hand gabst, um an den Fremden Vergeltung zu üben, die den Schoß einer Jungfrau zur Befleckung öffneten[a], ihren Schenkel zur Beschämung entblößten[b] und ihren Schoß zur Schmach entweihten – denn du hattest gesagt: ‚So soll es nicht geschehen.‘ Doch sie taten es.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck ist bildhaft und verhüllend; im Zusammenhang bezeichnet er eine sexuelle Gewalttat.
    reason: lexical_alternative
  - marker: b
    text: Das Entblößen des Schenkels ist hier ein Bild für sexuelle Schändung, Demütigung und den Verlust der Ehre.
    reason: cultural_note
  - marker: c
    text: Das Gebet spielt auf Simeons Vergeltung für die Schändung Dinas an; siehe 1. Mose 34.
    reason: cross_reference
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Direkte Anrede Gottes; „Herr“ entspricht dem Gebetsregister, ohne hier eine Wiedergabe des Tetragramms vorauszusetzen.
- source_word: ὁ θεὸς τοῦ πατρὸς μου Συμεών
  choice: Gott meines Vaters Simeon
  rationale: Bewahrt die im Griechischen ausgedrückte familiäre Zuordnung zu Simeon in natürlichem Deutsch.
- source_word: ᾧ ἔδωκας ἐν χειρὶ ῥομφαίαν
  choice: dem du ein Schwert in die Hand gabst
  rationale: Gibt das konkrete Hand-Motiv des griechischen Ausdrucks wieder; ῥομφαία wird im Kontext allgemein als „Schwert“ übersetzt.
- source_word: εἰς ἐκδίκησιν ἀλλογενῶν
  choice: um an den Fremden Vergeltung zu üben
  rationale: ἐκδίκησις bezeichnet hier vergeltendes Vorgehen; ἀλλογενεῖς sind ethnisch beziehungsweise gemeinschaftlich Außenstehende, ohne dass der spätere Fachbegriff „Heiden“ nötig wäre.
- source_word: οἳ ἔλυσαν μήτραν παρθένου εἰς μίασμα
  choice: die den Schoß einer Jungfrau zur Schändung öffneten
  rationale: „Öffneten“ erhält das Bild von λύω in verständlichem Deutsch; „Schoß“ kann μήτρα im sexualisierten Zusammenhang würdig und doch deutlich wiedergeben. „Zur Schändung“ bündelt die moralische und verunreinigende Kraft von μίασμα.
- source_word: ἐγύμνωσαν μηρὸν εἰς αἰσχύνην
  choice: ihren Schenkel zur Beschämung entblößten
  rationale: Bewahrt das körperliche Scham-Bild; das ergänzte Pronomen macht im Deutschen eindeutig, dass weiterhin die Jungfrau gemeint ist.
- source_word: ἐβεβήλωσαν μήτραν εἰς ὄνειδος
  choice: ihren Schoß der Schmach preisgaben
  rationale: βεβηλόω trägt die Vorstellung des Entheiligens oder Profanierens. „Der Schmach preisgaben“ klingt natürlich, bewahrt die öffentliche Entehrung und vermeidet eine schwerfällige Wiederholung von „schänden“.
- source_word: εἶπας γὰρ Οὐχ οὕτως ἔσται
  choice: 'denn du hattest gesagt: ‚So soll es nicht geschehen.‘'
  rationale: „Denn“ gibt γάρ ausdrücklich wieder. Das Plusquamperfekt verdeutlicht im Deutschen die zeitliche Vorgängigkeit des göttlichen Ausspruchs; „soll“ lässt offen, ob der Satz Verbot, Willensbekundung oder Feststellung ausdrückt.
- source_word: καὶ ἐποίησαν
  choice: Doch sie taten es
  rationale: Das im Griechischen unausgesprochene Objekt wird aus dem Kontext aufgenommen; „doch“ bringt den scharfen Gegensatz zum göttlichen Ausspruch zur Geltung.
theological_decisions:
- issue: Deutlichkeit der sexuellen Gewalttat
  choice: Die dreifache Bildsprache des Griechischen wird beibehalten und durch eine Fußnote erläutert.
  alternative: Die Aussage ausdrücklich mit „vergewaltigten“ zusammenfassen.
  rationale: Der Ausgangstext verbindet Öffnung des Schoßes, Entblößung und Profanierung. Eine einzige moderne Bezeichnung würde diese rhetorische Staffelung auflösen, während eine rein wörtliche Formulierung im Deutschen missverständlich bliebe.
- issue: Bedeutung des göttlichen Ausspruchs Οὐχ οὕτως ἔσται
  choice: „So soll es nicht geschehen“
  alternative: „So wird es nicht sein“ oder „Das darf nicht geschehen“
  rationale: Das Griechische lässt die modale Färbung offen. Die gewählte Fassung bewahrt die Spannung zwischen Gottes erklärtem Willen und der dennoch begangenen Tat, ohne sie dogmatisch auf Vorhersage oder Gebot festzulegen.
- issue: Bewertung von Simeons Gewalttat
  choice: Die im Gebet vorgenommene Deutung als Vergeltung wird ohne zusätzliche Billigung oder Distanzierung wiedergegeben.
  alternative: Die Vergeltung ausdrücklich als göttlich gebotene Strafe oder als menschliche Rache charakterisieren.
  rationale: Der Vers stellt die Tat als von Gott ermöglichtes Vergeltungshandeln dar, entfaltet hier aber keine umfassende moralische Bewertung. Die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch mit verständlicher Satzführung. Die drastische, zugleich verhüllende Bildsprache des griechischen Textes bleibt erhalten. Archaismen und konfessionell geprägte Fachausdrücke werden vermieden.
