  naturalness: Das Gebetsregister ist modernes, verständliches Standarddeutsch. „Schoß“ bewahrt die euphemistische Körpermetaphorik angemessen. „Zur Befleckung“ und „zur Schmach entweihten“ sind in diesem gehobenen Gebetskontext natürlich und genauer als die bisherigen Formulierungen.
  terminology: „Herr“, „Gott meines Vaters Simeon“, „Schwert“, „Fremde“ und „Vergeltung“ sind passend. „Entweihten“ stellt die profanierende Konnotation von βεβηλόω wieder her; „Befleckung“ gibt μίασμα als Verunreinigung/Defilement genauer wieder als „Schändung“, ohne die Bildsprache zu einer einzigen expliziten Bezeichnung zu verdichten.
