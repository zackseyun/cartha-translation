- from: 'Und sie sagte: „Herr, Gott meines Vaters Simeon, dem du ein Schwert in die Hand gabst, um an den Fremden Vergeltung zu üben, die den Schoß einer Jungfrau zur Schändung öffneten[a], ihren Schenkel zur Beschämung entblößten[b] und ihren Schoß der Schmach preisgaben – denn du hattest gesagt: ‚So soll es nicht geschehen.‘ Doch sie taten es.[c]“'
  to: 'Und sie sagte: „Herr, Gott meines Vaters Simeon, dem du ein Schwert in die Hand gabst, um an den Fremden Vergeltung zu üben, die den Schoß einer Jungfrau zur Befleckung öffneten[a], ihren Schenkel zur Beschämung entblößten[b] und ihren Schoß zur Schmach entweihten – denn du hattest gesagt: ‚So soll es nicht geschehen.‘ Doch sie taten es.[c]“'
  rationale: Die Revision beschränkt sich auf zwei Quellbegriffe. „Zur Befleckung“ gibt μίασμα präziser wieder, und „zur Schmach entweihten“ erhält sowohl die Profanierungsbedeutung von ἐβεβήλωσαν als auch die öffentliche Schande von εἰς ὄνειδος. Die Ambivalenz des göttlichen Ausspruchs und die wertende Perspektive des Gebets bleiben unverändert.
