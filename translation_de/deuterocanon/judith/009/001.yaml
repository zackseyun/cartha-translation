base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/001.yaml
  text: But Judith fell on her face[a], and put ashes on her head, and uncovered the sackcloth she had been wearing. And at that very time the evening incense was being offered in Jerusalem in the house of God, and Judith cried out with a loud voice to the Lord[b],
translation:
  language: de
  text: 'Judith aber warf sich mit dem Gesicht zu Boden, streute sich Asche auf den Kopf und legte das Sacktuch frei, das sie trug.[a] Gerade zu dieser Zeit wurde in Jerusalem im Haus Gottes das Räucherwerk jenes Abends dargebracht.[b] Da rief Judith mit lauter Stimme zum Herrn:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bedeutet, dass Judith das Sacktuch, das sie bereits trug, entblößte oder sichtbar machte; es besagt nicht, dass sie es auszog.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die für den Abend bestimmte Räucherdarbringung im Jerusalemer Heiligtum.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: warf sich mit dem Gesicht zu Boden
  rationale: Die Wendung beschreibt eine Niederwerfung in Trauer, Demut oder flehentlichem Gebet. Die deutsche Formulierung bewahrt das konkrete Bild, ohne wie ein unbeabsichtigter Sturz zu klingen.
- source_word: ἐπέθετο σποδὸν ἐπὶ τὴν κεφαλὴν αὐτῆς
  choice: streute sich Asche auf den Kopf
  rationale: Asche auf den Kopf zu tun ist ein Zeichen von Trauer und Demütigung. „Streute“ gibt die Handlung im Deutschen anschaulich und natürlich wieder.
- source_word: ἐγύμνωσεν ὃν ἐνεδεδύκει σάκκον
  choice: legte das Sacktuch frei, das sie trug
  rationale: ἐγύμνωσεν bezeichnet hier das Entblößen oder Freilegen. Die Formulierung macht deutlich, dass Judith das bereits getragene Sacktuch sichtbar machte, statt es abzulegen.
- source_word: ἦν ἄρτι προσφερόμενον
  choice: Gerade zu dieser Zeit wurde … dargebracht
  rationale: ἄρτι betont die zeitliche Unmittelbarkeit; die deutsche Passivkonstruktion bildet den andauernden kultischen Vorgang angemessen ab.
- source_word: εἰς τὸν οἶκον τοῦ θεοῦ
  choice: im Haus Gottes
  rationale: Im kultischen Zusammenhang bezeichnet die Wendung die Darbringung am Jerusalemer Heiligtum. „Haus Gottes“ erhält die Bildsprache des griechischen Textes.
- source_word: τὸ θυμίαμα τῆς ἑσπέρας ἐκείνης
  choice: das Räucherwerk jenes Abends
  rationale: θυμίαμα bezeichnet konkret das Räucherwerk beziehungsweise Räucheropfer. Der Genitiv wird eng am Wortlaut als „jenes Abends“ wiedergegeben.
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: rief … mit lauter Stimme
  rationale: Die idiomatische deutsche Wendung erhält den Nachdruck und die Dringlichkeit des griechischen Ausdrucks.
- source_word: πρὸς Κύριον
  choice: zum Herrn
  rationale: πρός gibt die Richtung des Gebets an; κύριος bezeichnet in diesem Zusammenhang Gott als den im Gebet Angerufenen.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im Gebetszusammenhang ist „Herr“ die natürliche und traditionsübergreifend verständliche Gottesbezeichnung.
- issue: Kultischer Bezug von οἶκος τοῦ θεοῦ
  choice: Haus Gottes
  alternative: Tempel Gottes
  rationale: Die Übersetzung bewahrt den konkreten griechischen Ausdruck, während die Fußnote erläutert, dass das Jerusalemer Heiligtum gemeint ist.
- issue: Bedeutung des Freilegens des Sacktuchs
  choice: Das Sacktuch wurde sichtbar gemacht, nicht abgelegt
  alternative: Judith zog das Sacktuch aus
  rationale: Der Relativsatz sagt ausdrücklich, dass sie das Sacktuch trug; ἐγύμνωσεν legt daher das Freilegen nahe und sollte nicht als Ablegen vereindeutigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gebetssprache. „Sacktuch“, „Räucherwerk“ und „Haus Gottes“ erhalten die kultische Bildwelt des Ausgangstextes; der Doppelpunkt macht kenntlich, dass der folgende Vers Judiths Gebet fortsetzt.
