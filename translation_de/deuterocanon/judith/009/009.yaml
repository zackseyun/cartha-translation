  text: Look upon their arrogance; send your wrath upon their heads; give power to what I have planned by the hand of me[a], a widow.
translation:
  language: de
  text: Sieh ihre Überheblichkeit an; sende deinen Zorn auf ihre Häupter. Gib dem, was ich geplant habe, Kraft durch meine Hand, die Hand einer Witwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gib mir, einer Witwe, Kraft für das, was ich geplant habe.“ Der griechische Schlusssatz ist syntaktisch verdichtet und lässt mehrere eng verwandte Zuordnungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέψον
  choice: Sieh … an
  rationale: Der Aoristimperativ ist eine Bitte an Gott, die Überheblichkeit der Feinde wahrzunehmen; die Formulierung ist nah am Bild und im modernen Deutsch natürlich.
- source_word: ὑπερηφανίαν
  choice: Überheblichkeit
  rationale: Das Wort bezeichnet hochmütige, anmaßende Haltung; „Überheblichkeit“ gibt den moralischen Vorwurf klar und gegenwärtig wieder.
- source_word: ἀπόστειλον
  choice: sende
  rationale: Entspricht dem Imperativ „sende“ und wahrt den gehobenen Gebetston.
- source_word: τὴν ὀργήν σου
  choice: deinen Zorn
  rationale: „Zorn“ bezeichnet hier Gottes richtende Reaktion und entspricht dem stärkeren Gehalt von ὀργή.
- source_word: εἰς κεφαλὰς αὐτῶν
  choice: auf ihre Häupter
  rationale: Bewahrt das konkrete Bild des Gerichts, das auf die Täter zurückfällt; „Häupter“ trägt dem würdevollen Register Rechnung.
- source_word: δὸς
  choice: Gib
  rationale: Direkte Wiedergabe des Imperativs, ohne die Bitte durch „gewähre“ stärker auszudeuten.
- source_word: ἐν χειρί μου τῆς χήρας
  choice: durch meine Hand – die Hand einer Witwe
  rationale: ἐν χειρί kann instrumental verstanden werden. Die Apposition macht Judiths Selbstbezeichnung als Witwe deutlich und bleibt zugleich lesbar.
- source_word: ὃ διενοήθην
  choice: dem, was ich geplant habe
  rationale: διανοέομαι bezeichnet hier das gefasste Vorhaben; „geplant“ ist klar und legt keinen im Wort nicht zwingend enthaltenen Täuschungsaspekt nahe.
- source_word: κράτος
  choice: Kraft
  rationale: κράτος bezeichnet Stärke oder wirksame Macht. „Kraft geben“ passt natürlich zur Bitte, Gott möge Judiths Vorhaben wirksam machen.
theological_decisions:
- issue: Syntaktische Zuordnung von κράτος, ἐν χειρί μου τῆς χήρας und ὃ διενοήθην
  choice: Bitte, Gott möge Judiths geplantem Handeln durch ihre eigene Hand als Witwe Kraft verleihen
  alternative: „Gib in meine Hand, die Hand einer Witwe, Kraft für das, was ich geplant habe.“
  rationale: Die griechische Schlusswendung ist syntaktisch verdichtet. Der Haupttext verbindet κράτος mit dem geplanten Vorhaben und versteht ἐν χειρί instrumental; die Fußnote erhält die naheliegende alternative Zuordnung zur Hand, ohne die Mehrdeutigkeit dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die Semikola des Griechischen werden durch Semikolon und Satzpunkt gegliedert; der Gedankenstrich verdeutlicht die appositionelle Selbstbezeichnung, ohne die sachliche Mehrdeutigkeit des Schlusses zu verbergen.
