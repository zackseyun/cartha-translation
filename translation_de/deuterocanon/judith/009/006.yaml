  text: And what I planned stood ready[a], and they said, ‘Behold, we are here; for all your ways are prepared, and your judgment is in foreknowledge.’
translation:
  language: de
  text: 'Und die Dinge, die du beschlossen hast, standen bereit und sagten: »Siehe, wir sind hier! Denn alle deine Wege sind bereit, und dein Urteil ist im Vorauswissen[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Urteil entspricht dem Vorauswissen« oder: »dein Urteil beruht auf deinem Vorauswissen«. Die knappe griechische Formulierung kann ausdrücken, dass Gottes richterliche Entscheidung in seinem vorherigen Wissen liegt, darauf beruht oder damit übereinstimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: traten herzu
  rationale: Der Aorist von παρίστημι bezeichnet hier, dass die von Gott beschlossenen Dinge hervortreten beziehungsweise zur Ausführung bereitstehen. »Traten herzu« bewahrt zugleich das personifizierende Bild des folgenden »sagten«.
- source_word: ἃ ἐβουλεύσω
  choice: die Dinge, die du beschlossen hattest
  rationale: ἐβουλεύσω ist zweite Person Singular und bezieht sich auf Gottes Beschluss. Die Übersetzung korrigiert daher die Personabweichung der englischen Konsultationsfassung (»I planned«) und gibt den deliberativen Sinn von βουλεύω mit »beschließen« wieder.
- source_word: πάρεσμεν
  choice: wir sind da
  rationale: Die Wendung erklärt unmittelbare Gegenwart und Bereitschaft. »Wir sind da« klingt im modernen Deutschen natürlich und passt zur Personifizierung der beschlossenen Dinge.
- source_word: ὁδοί
  choice: Wege
  rationale: »Wege« ist die breite, bildhafte Entsprechung und kann Gottes Handeln, Vorgehen und Führen bezeichnen.
- source_word: ἕτοιμοι
  choice: bereit
  rationale: Das prädikative Adjektiv bezeichnet einen bereits bestehenden Zustand der Bereitschaft. »Bereit« ist direkter als »vorbereitet« und entspricht der griechischen Form.
- source_word: κρίσις
  choice: Urteil
  rationale: κρίσις bezeichnet hier am ehesten Gottes richterliche Entscheidung. »Urteil« bewahrt diesen gerichtlichen Sinn, ohne den Begriff auf die abstrakte Eigenschaft »Gerechtigkeit« zu verschieben.
- source_word: πρόγνωσις
  choice: Vorauswissen
  rationale: Das Substantiv bezeichnet vorheriges Wissen. »Vorauswissen« ist eine direkte und verständliche deutsche Entsprechung, ohne zusätzliche dogmatische Bestimmungen einzutragen.
theological_decisions:
- issue: Verhältnis von Gottes Urteil zu πρόγνωσις
  choice: dein Urteil ist im Vorauswissen
  alternative: dein Urteil entspricht dem Vorauswissen; dein Urteil beruht auf deinem Vorauswissen
  rationale: Die knappe griechische Verbindung ἐν προγνώσει legt nicht eindeutig fest, ob ein Bereich, eine Grundlage oder eine Übereinstimmung gemeint ist. Der Haupttext erhält deshalb die Präposition möglichst offen; die Fußnote nennt verständlichere Deutungsmöglichkeiten, ohne eine davon dogmatisch festzuschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache. Die auffällige Personifizierung der von Gott beschlossenen Dinge wird bewahrt. »Siehe« erhält den biblisch-feierlichen Ton, während »wir sind da« unmittelbar und allgemein verständlich bleibt. Der Fußnotenmarker steht an der tatsächlich erläuterten Wendung.
