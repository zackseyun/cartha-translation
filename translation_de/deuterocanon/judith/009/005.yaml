base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/005.yaml
  text: For you made those things before them, and those things and the things afterward and the things now and the things to come you planned[a][b], and what you planned came to be.
translation:
  language: de
  text: Denn du hast gemacht, was vor jenen Dingen war; und jene Dinge sowie das Spätere, das Gegenwärtige und das Kommende hast du geplant[a][b], und was du geplant hast, ist geschehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hast du bedacht“ beziehungsweise „hast du beabsichtigt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische häuft Zeitangaben an: was vor jenen Dingen war, jene Dinge selbst, das Spätere, das Gegenwärtige und das Kommende. Dadurch wird Gottes Handeln über alle Zeiten hinweg betont.'
    reason: literary_note
lexical_decisions:
- source_word: σὺ γὰρ
  choice: Denn du
  rationale: γάρ begründet die Bitte; das ausdrücklich gesetzte σὺ wird durch „du“ bewahrt.
- source_word: ἐποίησας
  choice: hast ... geschaffen
  rationale: ποιέω bezeichnet hier Gottes hervorbringendes Handeln. „Geschaffen“ klingt im Deutschen natürlicher als „gemacht“, ohne einen technischen Schöpfungsbegriff festzulegen.
- source_word: τὰ πρότερα ἐκείνων
  choice: das, was vor jenen Dingen war
  rationale: Die Formulierung bewahrt den zeitlichen Vergleich mit dem Genitiv ἐκείνων und lässt dessen konkreten Bezug offen.
- source_word: καὶ ἐκεῖνα
  choice: und jene Dinge
  rationale: Die Wiederaufnahme durch ἐκεῖνα bleibt ausdrücklich erhalten.
- source_word: τὰ μετέπειτα
  choice: das Danach
  rationale: Die substantivierte Zeitangabe erhält die aufzählende, umfassende Struktur des Griechischen.
- source_word: τὰ νῦν
  choice: das Jetzt
  rationale: Die substantivierte Wiedergabe bildet die Gegenwart als Teil der zeitlichen Gesamtschau ab.
- source_word: τὰ ἐπερχόμενα
  choice: das Kommende
  rationale: Das substantivierte Partizip bezeichnet alles, was herankommt bzw. künftig ist.
- source_word: διενοήθης
  choice: hast du geplant
  rationale: διανοέομαι kann erwägen, beabsichtigen oder planen bedeuten; im Zusammenhang mit der anschließenden Verwirklichung gibt „geplant“ die zielgerichtete Bedeutung gut wieder.
- source_word: ἐγενήθησαν ἃ ἐνενοήθης
  choice: was du geplant hast, ist geschehen
  rationale: γίνομαι bezeichnet hier das Eintreten bzw. Wirklichwerden des Gedachten; „ist geschehen“ ist natürlich und wahrt den resultativen Sinn.
theological_decisions:
- issue: Gottes Wissen und souveränes Handeln über alle Zeiten hinweg
  choice: Die Verben werden als Schaffen, Planen und Eintretenlassen wiedergegeben, ohne spätere philosophische Fachbegriffe einzuführen.
  alternative: διενοήθης rein kognitiv mit „hast du bedacht“ oder „hast du erkannt“ wiederzugeben.
  rationale: Die Verbindung von göttlichem Denken und anschließendem Geschehen legt eine intentionale Bedeutung nahe, ohne dass der Vers eine ausgearbeitete Lehre über Vorherwissen oder Vorherbestimmung formuliert.
- issue: Bedeutung von ἐποίησας
  choice: „geschaffen“
  alternative: „gemacht“ oder „bewirkt“
  rationale: „Geschaffen“ bezeichnet Gottes hervorbringendes Tun würdig und idiomatisch; es wird dabei nicht durch zusätzliche kosmologische Aussagen über den Wortlaut hinaus erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich dichte zeitliche Reihung des griechischen Textes wird bewusst sichtbar gehalten; „das Danach“ und „das Jetzt“ geben deren substantivierte Form kompakt wieder.
