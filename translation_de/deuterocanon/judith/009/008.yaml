    issue: τὰ ἅγιά σου wird durch »deine Heiligtümer« zu stark auf heilige Orte eingeengt.
    rationale: Das neutrale Pluralwort kann heilige Dinge, heilige Bereiche oder Heiligtümer bezeichnen. Die Fußnote benennt diese Breite, während der Haupttext sie nicht wahrt.
  - severity: low
    issue: Der Artikel in »Der Herr ist dein Name« ist in der knappen Namen-Prädikation weniger passend.
    rationale: Κύριος ὄνομά σοι ist eine artikellose, formelhafte Prädikation. »Herr ist dein Name« erhält diese verdichtete Anrede im Deutschen besser.
  - severity: low
