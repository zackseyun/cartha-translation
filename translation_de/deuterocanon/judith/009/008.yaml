base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/008.yaml
  text: Lord is your name[a]; you, shatter their strength in your power, and break their might in your wrath; for they planned to profane your holy things, to defile the tabernacle, the resting place of your glorious name[b], and to cast down with the sword the horn of your altar.
translation:
  language: de
  text: Herr ist dein Name. Du, zerschmettere ihre Stärke durch deine Macht und zerbrich ihre Gewalt in deinem Zorn! Denn sie haben geplant, alles, was dir heilig ist,[a] zu entweihen, die Wohnstätte, die Ruhestätte deines herrlichen Namens, zu verunreinigen und das Horn deines Altars mit Eisen[b] niederzuwerfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »deine heiligen Dinge«. Der griechische Plural kann heilige Gegenstände oder heilige Bereiche bezeichnen, nicht nur ein einzelnes Heiligtumsgebäude.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »mit Eisen«; gemeint sein kann eine eiserne Waffe oder ein eisernes Werkzeug. Manche Übersetzungen geben daher »mit dem Schwert« wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος ὄνομά σοι
  choice: Der Herr ist dein Name
  rationale: Gibt die knappe griechische Prädikation eng wieder und bewahrt »Herr« als Gottesbezeichnung, ohne sie erklärend aufzulösen.
- source_word: ῥάξον αὐτῶν τὴν ἰσχὺν
  choice: zerschmettere ihre Stärke
  rationale: Das kräftige Verb bezeichnet gewaltsames Zerbrechen; »zerschmettern« erhält die Intensität des Bittgebets.
- source_word: κατάξον τὸ κράτος αὐτῶν
  choice: zerbrich ihre Gewalt
  rationale: Wahrt den poetischen Parallelismus, unterscheidet das Verb aber von »zerschmettern«; »Gewalt« bezeichnet hier ihre wirksame Macht.
- source_word: ἐν τῷ θυμῷ σου
  choice: in deinem Zorn
  rationale: Entspricht dem erhöhten Gebetsregister und gibt den starken Affekt wieder, ohne ihn weiter theologisch auszudeuten.
- source_word: τὰ ἅγιά σου
  choice: deine Heiligtümer
  rationale: Der substantivierte neutrale Plural kann heilige Orte oder heilige Dinge bezeichnen. »Heiligtümer« bewahrt die Mehrzahl und lässt den Bezug relativ offen.
- source_word: τὸ σκήνωμα τῆς καταπαύσεως
  choice: die Wohnstätte, den Ruheort
  rationale: Gibt sowohl die Vorstellung einer göttlichen Wohnstätte als auch die des Ruheortes wieder und liest den zweiten Ausdruck appositionell.
- source_word: τοῦ ὀνόματος τῆς δόξης σου
  choice: deines herrlichen Namens
  rationale: Natürliche deutsche Wiedergabe der Genitivfolge, die den engen Zusammenhang von Gottes Namen und Herrlichkeit erhält.
- source_word: καταβαλεῖν σιδήρῳ
  choice: mit Eisen niederzuwerfen
  rationale: Bewahrt das konkrete »Eisen« des griechischen Textes und gibt καταβάλλω mit seiner abwärtsgerichteten Bewegung wieder.
- source_word: κέρας θυσιαστηρίου σου
  choice: das Horn deines Altars
  rationale: Erhält die konkrete kultische Bezeichnung des vorspringenden Altarhorns.
theological_decisions:
- issue: Umfang von τὰ ἅγιά σου
  choice: Mehrdeutig als »deine Heiligtümer« wiedergegeben
  alternative: 'auf das Tempelgebäude verengt: »dein Heiligtum«'
  rationale: Der griechische Plural kann heilige Dinge oder Bereiche umfassen; eine eindeutige Festlegung wäre nicht vom Wortlaut erzwungen.
- issue: Wohn- und Ruhevorstellung des göttlichen Namens
  choice: »die Wohnstätte, den Ruheort deines herrlichen Namens«
  alternative: 'freier: »die Wohnstätte, wo dein herrlicher Name ruht«'
  rationale: Die appositionelle Fassung bewahrt die dichte kultische Sprache und vermeidet, die Genitivbeziehungen unnötig zu glätten.
- issue: Werkzeug beim Angriff auf den Altar
  choice: wörtlich »mit Eisen« im Haupttext
  alternative: metonymisch »mit dem Schwert«
  rationale: σίδηρος bezeichnet unmittelbar Eisen und kann zwar für eine eiserne Waffe stehen, legt aber nicht zwingend speziell ein Schwert fest.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit kräftigen Imperativen und erhaltener kultischer Bildsprache. Die Satzstruktur wurde behutsam gegliedert, ohne die Parallelismen oder die genuine Mehrdeutigkeit des griechischen Textes aufzulösen.
