  verdict: revise
  source_fidelity: Die Imperative, die kultische Bildsprache und σιδήρῳ als »mit Eisen« sind im Wesentlichen quellennah wiedergegeben. »Deine Heiligtümer« verengt τὰ ἅγιά σου jedoch auf Orte bzw. Gebäude, obwohl der griechische Plural auch heilige Gegenstände oder allgemein heilige Bereiche meinen kann. Die eröffnende Prädikation ist ohne Artikel idiomatischer und näher an der knappen Vorlage.
  naturalness: Der Gebetston ist insgesamt klar und würdig. »Herr ist dein Name« ist als bewusst knappe, biblisch-liturgische Prädikation im Deutschen besser als »Der Herr ist dein Name«. Die Apposition »die Wohnstätte, die Ruhestätte deines herrlichen Namens« ist syntaktisch klarer als die vorliegende Fassung.
  terminology: »Herr«, »Zorn«, »Horn deines Altars« und »mit Eisen« sind treffend. »Alles, was dir heilig ist« wahrt für τὰ ἅγιά σου die breite, plurale Sachreferenz besser als »Heiligtümer«, ohne eine bestimmte Kategorie festzulegen. »Ruhestätte« gibt καταπαύσεως angemessen wieder; es meint hier die Kultstätte, nicht ein Grab.
  issues:
