review_pass:
  verdict: revise
  source_fidelity: 'Die Personifizierung von στρωμνή bleibt grundsätzlich erhalten. Jedoch macht „durch Täuschung in Blut getaucht“ aus ἀπατηθεῖσαν ein instrumentales „durch Täuschung“, während das Partizip passiv ist: Das Lager wird selbst „getäuscht“. Auch „samt Mächtigen erschlagen“ nivelliert die auffällige Beziehung von δούλους ἐπὶ δυνάσταις.'
  naturalness: Die vorgeschlagene Revision bleibt bewusst ungewöhnlich, weil der griechische Wortlaut an dieser Stelle ungewöhnlich und bildhaft ist. „In Blut getäuscht“ ist im Deutschen hart, kennzeichnet aber nicht fälschlich die Täuschung als Mittelhandlung.
  terminology: „Anführer“, „Knechte“ und „Mächtige“ sind als voneinander unterschiedene Wiedergaben von ἄρχοντες, δοῦλοι und δυνάσται angemessen. „Gemetzel“ gibt εἰς φόνον präziser als das allgemeinere „dem Tod“ wieder.
  issues:
  - severity: medium
    issue: Passiv von ἀπατηθεῖσαν nicht gewahrt
    rationale: „durch Täuschung in Blut getaucht“ interpretiert die Täuschung als Instrument. Der griechische Text sagt vielmehr, dass das personifizierte Lager getäuscht wurde, und verbindet dies mit „in/zu Blut“.
  - severity: medium
    issue: Beziehung von Knechten zu Mächtigen umgedeutet
    rationale: „Knechte samt Mächtigen erschlagen“ lässt beide Gruppen bloß gemeinsam als Opfer erscheinen. Das zweimalige ἐπί stellt jeweils eine schwierige, aber bedeutsame Beziehung her; diese muss im Text und durch die Fußnote erkennbar bleiben.
