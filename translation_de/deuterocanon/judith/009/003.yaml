  yaml_path: translation/deuterocanon/judith/009/003.yaml
  text: Therefore you gave their rulers over to slaughter, and their bed, which was ashamed of their deceit, was deceived into blood; and you struck servants against princes, and princes upon their thrones.
translation:
  language: de
  text: Darum hast du ihre Anführer dem Gemetzel preisgegeben, und ihr Lager, das sich ihrer Täuschung schämte, in Blut getäuscht; du hast Knechte gegen Mächtige geschlagen und Mächtige auf ihre Throne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist ungewöhnlich. Die Wendung kann auch wiedergegeben werden: „Du schlugst Knechte über Mächtige und Mächtige auf ihre Throne.“ Sowohl die Beziehung, die „gegen/über“ ausdrückt, als auch die genaue Bildvorstellung bleiben unsicher.'
    reason: Die Fußnote wahrt die syntaktische und bildliche Mehrdeutigkeit von ἐπάταξας δούλους ἐπὶ δυνάσταις καὶ δυνάστας ἐπὶ θρόνους αὐτῶν, ohne die im Haupttext gewählte, vorsichtige Lesart als eindeutig auszugeben.
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Dafür
  rationale: Die Wendung bezeichnet hier die vergeltende Folge des zuvor geschilderten Frevels.
- source_word: ἄρχοντας
  choice: Anführer
  rationale: Bezeichnet die führenden Männer; das natürliche deutsche Wort vermeidet eine unnötig spezifische Amtsbezeichnung.
- source_word: εἰς φόνον
  choice: dem Tod preisgegeben
  rationale: Gibt die Ziel- bzw. Ergebnisrichtung idiomatisch wieder, ohne das passive Handeln Gottes abzuschwächen.
- source_word: στρωμνήν
  choice: Lager
  rationale: Kann Bett oder Lagerstätte bezeichnen; im Kontext ist die Stätte der versuchten Verführung und Tötung gemeint.
- source_word: δούλους
  choice: Knechte
  rationale: Bewahrt den sozialen Gegensatz zu den Mächtigen und passt zum würdigen Gebetsregister.
- source_word: δυνάσταις / δυνάστας
  choice: Mächtigen / Mächtige
  rationale: Gibt Machthaber bzw. einflussreiche Herren wieder und unterscheidet den Ausdruck von ἄρχοντας.
- source_word: ἐπάταξας … ἐπὶ
  choice: hast … samt … erschlagen
  rationale: Das schwer verständliche ἐπί wird als gemeinsames Niederstrecken zweier Gruppen gefasst; die syntaktische Mehrdeutigkeit wird in einer Fußnote ausgewiesen.
theological_decisions:
- issue: Göttliches Gericht und menschliche Ausführung
  choice: 'Gottes Handeln bleibt direkt formuliert: „du hast … preisgegeben“ und „du hast … erschlagen“.'
  alternative: Die menschlichen Vollstrecker ausdrücklich als alleinige Handelnde darstellen.
  rationale: Der griechische Gebetstext schreibt das vergeltende Gericht unmittelbar Gott zu, auch wenn es geschichtlich durch Menschen ausgeführt wird.
- issue: Personifizierung des Lagers
  choice: Die auffällige Personifizierung „das sich ihres Betrugs schämte“ bleibt erhalten.
  alternative: Auf die dort missbrauchte Frau oder die entehrte Lagerstätte umdeuten.
  rationale: Der griechische Text macht στρωμνή ausdrücklich zum Bezugswort; eine eindeutige Auflösung würde die ungewöhnliche Bildsprache glätten.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die markante Wiederholung und die Personifizierung des Lagers bleiben erhalten; archaisierende oder konfessionell geprägte Zusätze werden vermieden.
