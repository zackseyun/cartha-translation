base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/007.yaml
  text: For behold[a], the Assyrians have multiplied in their strength; they have been exalted on horse and rider; they have boasted in the arm of foot soldiers; they have hoped in shield and spear and bow and sling, and they have not known that you are the Lord[b], the one who shatters wars.
translation:
  language: de
  text: Denn siehe, die Assyrer sind in ihrer Macht zahlreich geworden. Sie haben sich mit Pferd und Reiter überhoben, mit der Stärke ihrer Fußsoldaten geprahlt und auf Schild, Speer, Bogen und Schleuder vertraut[a]. Doch sie haben nicht erkannt, dass du der Herr bist, der Kriege zerschmettert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben auf Schild, Speer, Bogen und Schleuder gehofft“. Das griechische Verb kann sowohl Hoffen als auch Vertrauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Kriege beendet“. Wörtlich: „der Kriege zerschmettert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Denn siehe
  rationale: „Denn“ gibt γάρ wieder; „siehe“ bewahrt den nachdrücklichen, die Aufmerksamkeit lenkenden Gebetston von ἰδού.
- source_word: ἐπληθύνθησαν ἐν δυνάμει αὐτῶν
  choice: sind in ihrer Macht zahlreich geworden
  rationale: Die Formulierung hält sowohl die Zunahme als auch den Bezug auf ihre militärische Macht fest, ohne diese ausschließlich numerisch oder qualitativ auszulegen.
- source_word: ὑψώθησαν ἐφʼ ἵππῳ καὶ ἀναβάτῃ
  choice: haben sich mit Pferd und Reiter erhoben
  rationale: Die Wendung bewahrt das Bild des Sich-Erhebens und verbindet es natürlich mit der Kavallerie, ohne ὑψώθησαν vollständig als bloßen Hochmut aufzulösen.
- source_word: ἐγαυρίασαν ἐν βραχίονι πεζῶν
  choice: haben mit der Stärke ihrer Fußsoldaten geprahlt
  rationale: „Geprahlt“ trifft die stolze Selbstüberhebung; „Stärke“ vermittelt die metaphorische Bedeutung von βραχίων („Arm“) in verständlichem modernem Deutsch.
- source_word: ἤλπισαν
  choice: haben vertraut
  rationale: Bei Waffen als Gegenständen der Hoffnung ist „vertrauen auf“ im Deutschen natürlicher als „hoffen auf“ und gehört zum Bedeutungsbereich des griechischen Verbs.
- source_word: ἀσπίδι καὶ ἐν γαίσῳ καὶ τόξῳ καὶ σφενδόνῃ
  choice: auf Schild, Speer, Bogen und Schleuder
  rationale: Die geläufigen deutschen Waffenbezeichnungen geben die Aufzählung knapp und historisch passend wieder.
- source_word: οὐκ ἔγνωσαν
  choice: haben nicht erkannt
  rationale: „Erkannt“ bringt über bloßes Faktenwissen hinaus das versäumte Begreifen der Identität und Macht Gottes zum Ausdruck, ohne den Satz dogmatisch zu erweitern.
- source_word: συντρίβων πολέμους
  choice: der Kriege zerschmettert
  rationale: Die konkrete und kraftvolle Metapher des griechischen Partizips bleibt erhalten; eine Glättung zu „Kriege beendet“ würde das Bild abschwächen.
theological_decisions:
- issue: Wiedergabe von κύριος als Gottesbezeichnung
  choice: der Herr
  alternative: Herr
  rationale: Der bestimmte Artikel im Griechischen und die identifizierende Aussage werden mit „der Herr“ natürlich wiedergegeben, ohne einen nicht ausdrücklich vorhandenen Gottesnamen einzusetzen.
- issue: Deutung von συντρίβων πολέμους
  choice: der Kriege zerschmettert
  alternative: der Kriege beendet
  rationale: 'Die wörtlichere Fassung bewahrt die theologische Spannung des Bildes: Gott beendet Kriege, indem er sie beziehungsweise ihre Macht zerbricht.'
- issue: Militärische Selbstüberhebung in ὑψώθησαν
  choice: haben sich mit Pferd und Reiter erhoben
  alternative: sind wegen Pferd und Reiter überheblich geworden
  rationale: Die gewählte Fassung lässt offen, ob vor allem militärisches Aufsteigen oder stolze Erhöhung gemeint ist, statt die Mehrdeutigkeit einseitig psychologisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem erhöhten Ton eines Gebets. Der Satz wurde zur besseren Verständlichkeit gegliedert; die parallele Folge militärischer Machtmittel und die kraftvolle Schlussaussage bleiben erhalten.
