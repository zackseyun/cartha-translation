  yaml_path: translation/deuterocanon/judith/009/013.yaml
  text: And make my words and deceit become their wound and bruise[b][a], they who have devised harsh things against your covenant and your sanctified house and the summit of Zion and the house possessed by your sons.
translation:
  language: de
  text: Und lass mein Wort und meine Täuschung ihnen zu Wunde und Strieme werden,[a] ihnen, die Grausames geplant haben gegen deinen Bund, gegen dein geheiligtes Haus, gegen den Gipfel Zions und gegen das Haus, das deine Söhne in Besitz haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher ist möglich: „Gib mein Wort und meine Täuschung zu ihrer Wunde und Strieme.“ Die knappe griechische Formulierung kann das Mittel von Judiths Vorgehen oder dessen Wirkung auf ihre Gegner betonen.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung ist schwer zu deuten. Gemeint sein kann auch „die Wohnstätte“ oder „der Erbbesitz deiner Söhne“, also das Land oder Heiligtum, das Gottes Volk gehört.
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς ... εἰς
  choice: lass ... werden
  rationale: Die Verbindung des Imperativs mit εἰς bezeichnet hier, wozu Judiths Wort und Täuschung für die Feinde werden sollen. Die deutsche Konstruktion gibt diesen Ergebnis- oder Zweckgedanken natürlich wieder.
- source_word: λόγον μου
  choice: mein Wort
  rationale: λόγος kann Wort, Rede oder Äußerung bedeuten. Der Singular „mein Wort“ wahrt die Form und bleibt im Zusammenhang verständlich, ohne den Ausdruck auf einen Plan einzuengen.
- source_word: ἀπάτην
  choice: meine Täuschung
  rationale: Der Ausdruck bezeichnet Täuschung oder Trug. „Täuschung“ bewahrt die moralische Spannung von Judiths Bitte und schwächt ihre Strategie nicht ab.
- source_word: εἰς τραῦμα καὶ μώλωπα αὐτῶν
  choice: ihnen zur Wunde und zum Bluterguss
  rationale: τραῦμα und μώλωψ sind zwei Bilder körperlicher Verletzung. „Bluterguss“ ist im heutigen Deutsch präziser und würdevoller als „blauer Fleck“; die Dativkonstruktion gibt αὐτῶν idiomatisch wieder.
- source_word: ἐβουλεύσαντο σκληρά
  choice: die Grausames geplant haben
  rationale: βουλεύομαι bezeichnet Überlegen oder Planen, während das substantivierte σκληρά harte beziehungsweise grausame Vorhaben meint. Die Übersetzung ist nah am Sinn und natürlich.
- source_word: διαθήκης σου
  choice: deinen Bund
  rationale: Im biblischen Zusammenhang trägt „Bund“ die religiöse Bedeutung von διαθήκη angemessen.
- source_word: οἴκου ἡγιασμένου σου
  choice: dein geheiligtes Haus
  rationale: Das Partizip ἡγιασμένου beschreibt das Haus als geheiligt. „Geheiligt“ erhält diese verbale Nuance besser als bloß „heilig“.
- source_word: κορυφῆς Σιὼν
  choice: den Gipfel Zions
  rationale: κορυφή bedeutet Gipfel, Spitze oder Höhe. „Gipfel Zions“ bewahrt das konkrete Bild.
- source_word: οἴκου κατασχέσεως υἱῶν σου
  choice: das Haus, das deine Söhne in Besitz haben
  rationale: κατάσχεσις bezeichnet Besitz beziehungsweise Inbesitznahme. Die griechische Wendung ist schwierig; diese Übersetzung bleibt formal nachvollziehbar, während die Fußnote mögliche Bezugspunkte nennt.
theological_decisions:
- issue: Judith bittet Gott, ihre Täuschung gegen die Feinde wirksam werden zu lassen
  choice: ἀπάτην wird offen mit „Täuschung“ wiedergegeben
  alternative: „List“ oder eine abschwächende Umschreibung
  rationale: Der griechische Text stellt die ethische und theologische Spannung unverhüllt dar. Die Übersetzung soll sie weder entschärfen noch durch eine konfessionelle Erklärung auflösen.
- issue: Bedeutung von διαθήκη
  choice: „Bund“
  alternative: „Vereinbarung“ oder „Vertrag“
  rationale: „Bund“ erhält den biblisch-theologischen Gehalt der Beziehung zwischen Gott und seinem Volk, ohne zusätzliche Deutung einzutragen.
- issue: Bezug von οἴκου κατασχέσεως υἱῶν σου
  choice: formal als ein von Gottes Söhnen in Besitz gehaltenes Haus wiedergeben
  alternative: direkt als „Erbbesitz deiner Söhne“, „Land“ oder „Heiligtum“ deuten
  rationale: Da die Formulierung mehrdeutig ist, wird der schwierige Wortlaut im Haupttext bewahrt und die mögliche Bedeutung in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Präpositionen in der Aufzählung fördern Klarheit, ohne die parallele Struktur des Griechischen aufzugeben. „Söhne“ bleibt als formale Wiedergabe von υἱῶν erhalten; die schwierige Besitzformel wird nicht stillschweigend vereindeutigt.
