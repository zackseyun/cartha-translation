base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/004.yaml
  text: And you gave their wives as plunder[a], and their daughters into captivity, and all their spoils for division among the sons beloved by you, who also were zealous with your zeal and abhorred the defilement of their blood and called on you for help. O God, my God, hear me[b], the widow.
translation:
  language: de
  text: Und du gabst ihre Frauen zur Beute und ihre Töchter in Gefangenschaft und all ihre erbeuteten Güter zur Verteilung unter die von dir geliebten Söhne, die auch für deinen Eifer eiferten, die Befleckung ihres Blutes[a] verabscheuten und dich um Hilfe anriefen. Gott, mein Gott, erhöre mich, die Witwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung kann auch „die durch ihr Blut verursachte Befleckung“ beziehungsweise „ihre Blutbefleckung“ bedeuten. Gemeint ist eine kultische oder moralische Verunreinigung; die Beziehung zwischen „Befleckung“ und „Blut“ bleibt im Griechischen mehrdeutig.
    reason: lexical_alternative
lexical_decisions:
- source_word: προνομὴν
  choice: Beute
  rationale: Das Substantiv bezeichnet Kriegsbeute. „Zur Beute geben“ wahrt die harte Aussage des Ausgangstextes, ohne sie zu beschönigen.
- source_word: αἰχμαλωσίαν
  choice: Gefangenschaft
  rationale: Die Wendung εἰς αἰχμαλωσίαν bezeichnet das Hineingeraten in Kriegsgefangenschaft; „in Gefangenschaft“ ist im Deutschen natürlich und präzise.
- source_word: σκῦλα
  choice: erbeutete Güter
  rationale: Der militärische Begriff meint im Krieg erlangte Beutestücke. Die Formulierung unterscheidet ihn sprachlich von προνομή, ohne den gemeinsamen Bedeutungsbereich zu verdecken.
- source_word: διαίρεσιν
  choice: zur Verteilung
  rationale: Das Nomen bezeichnet das Aufteilen beziehungsweise Zuteilen. „Zur Verteilung unter“ gibt den Zweck und den Empfängerkreis idiomatisch wieder.
- source_word: υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: die von dir geliebten Söhne
  rationale: Die ausdrückliche Bezeichnung als „Söhne“ und die passive Formulierung der göttlichen Liebe bleiben erhalten.
- source_word: ἐζήλωσαν τὸν ζῆλόν σου
  choice: eiferten mit deinem Eifer
  rationale: Die Wiedergabe bewahrt die betonte Wiederholung des verwandten Verbs und Nomens sowie die Aussage, dass ihr Eifer an Gottes Eifer Anteil hat.
- source_word: ἐβδελύξαντο
  choice: verabscheuten
  rationale: Das starke Verb drückt tiefe moralische beziehungsweise kultische Abscheu aus.
- source_word: μίασμα αἵματος αὐτῶν
  choice: die Befleckung ihres Blutes
  rationale: „Befleckung“ erhält den kultisch-moralischen Gehalt von μίασμα; die mehrdeutige Genitivverbindung mit „Blut“ wird nicht auf eine einzige Deutung festgelegt.
- source_word: ἐπεκαλέσαντό σε εἰς βοήθειαν
  choice: riefen dich um Hilfe an
  rationale: Die Formulierung gibt sowohl den Anrufungscharakter als auch das Ziel der erbetenen Hilfe natürlich wieder.
- source_word: εἰσάκουσον ἐμοῦ
  choice: erhöre mich
  rationale: „Erhöre“ ist eine verständliche und würdige deutsche Gebetsformel, die über bloßes akustisches Hören hinaus die Bitte um Antwort ausdrückt.
- source_word: τῆς χήρας
  choice: mich, die Witwe
  rationale: Die appositionelle Selbstbezeichnung Judiths bleibt knapp und rhetorisch hervorgehoben erhalten.
theological_decisions:
- issue: Geschlechtsspezifische Familienbezeichnung in υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: die von dir geliebten Söhne
  alternative: deine geliebten Kinder
  rationale: Der griechische Text verwendet ausdrücklich das maskuline „Söhne“. Eine geschlechtsneutrale Verallgemeinerung würde diese konkrete Bezeichnung verdecken.
- issue: Kognate Eifer-Formulierung ἐζήλωσαν τὸν ζῆλόν σου
  choice: eiferten mit deinem Eifer
  alternative: brannten vor Eifer für dich
  rationale: Die gewählte Fassung bewahrt die auffällige Wiederholung und die mögliche Vorstellung einer Teilhabe an Gottes Eifer, ohne sie zu einer bloßen Aussage menschlicher Hingabe umzudeuten.
- issue: μίασμα αἵματος αὐτῶν als kultisch-moralische Aussage
  choice: die Befleckung ihres Blutes
  alternative: die durch Blut verursachte Befleckung
  rationale: Die Genitivbeziehung ist nicht eindeutig. Die Übersetzung lässt offen, ob das Blut selbst als befleckt oder als Quelle einer Befleckung verstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die brutale Kriegssprache wird nicht abgeschwächt. Der zweite Satz beginnt mit „Diese“, um die lange griechische Satzperiode für heutige Leser übersichtlich zu gliedern, während die logischen Bezüge erhalten bleiben.
