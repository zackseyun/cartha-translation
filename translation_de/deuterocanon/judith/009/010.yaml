  verdict: revise
  source_fidelity: 'Die Grundentsprechungen sind überwiegend treffend: δοῦλος/Sklave, ἄρχων/Herrscher, θεράπων/Diener, θραύω/zerschmettern und die weibliche Handlungsträgerschaft bleiben erhalten. Die griechische Konstruktion beschreibt jedoch, dass der Sklave gegen den Herrscher und der Herrscher gegen seinen Diener zum Schlag gebracht wird. Die vorliegende deutsche Wortstellung lässt dagegen den Trug unklar zwischen die Objekte treten und kann so verstanden werden, als schlage Gott den Sklaven gegen den Herrscher.'
  naturalness: „Schlag den Sklaven durch den Trug meiner Lippen gegen den Herrscher“ ist im modernen Deutschen syntaktisch schwer verständlich. Eine explizite kausative Formulierung bildet die im Kontext gemeinte Umkehrung der Hierarchie klar und idiomatisch ab.
  terminology: „Sklave“, „Herrscher“, „Diener“, „Überheblichkeit“ und „durch die Hand einer Frau“ sind für den Kontext und das Register geeignet. Die Fußnote bewahrt angemessen die lexikalische Unsicherheit von ἀνάστεμα.
  issues:
