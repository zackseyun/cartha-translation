base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/010.yaml
  text: Strike servant against ruler with the deceit of my lips[a], and ruler against his attendant; shatter their arrogance by the hand of a woman.
translation:
  language: de
  text: Lass durch den Trug meiner Lippen den Sklaven den Herrscher schlagen und den Herrscher seinen Diener; zerschmettere ihre Überheblichkeit[a] durch die Hand einer Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Erhebung“ beziehungsweise „ihren Aufstand“; das seltene griechische Substantiv kann sowohl ihre stolze Überhöhung als auch ihr Sich-Erheben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάταξον
  choice: Schlag
  rationale: Der kräftige Imperativ bittet Gott, einen Schlag zu führen. „Schlag“ bewahrt die Direktheit, ohne wie „erschlage“ zwingend den Tod auszudrücken.
- source_word: δοῦλον
  choice: den Sklaven
  rationale: δοῦλος bezeichnet hier einen sozial untergeordneten, unfreien Menschen. „Sklave“ erhält den betonten Rangunterschied zum Herrscher.
- source_word: ἐκ χειλέων ἀπάτης μου
  choice: durch den Trug meiner Lippen
  rationale: Die Wendung bezeichnet im Zusammenhang das Mittel, durch das Judith die Gegner gegeneinander bringen will. Die knappe Form bleibt nah am Griechischen und bewahrt ihr ausdrückliches Eingeständnis des Trugs, ohne „Worte“ hinzuzufügen.
- source_word: ἐπʼ ἄρχοντι
  choice: gegen den Herrscher
  rationale: ἐπί wird in Verbindung mit πάταξον und dem Motiv der Umkehrung gegnerisch verstanden. „Herrscher“ gibt ἄρχων allgemein und ohne unnötig monarchische Färbung wieder.
- source_word: ἄρχοντα
  choice: den Herrscher
  rationale: Der Begriff bezeichnet allgemein einen Machthaber oder Befehlshaber. Die Wiederholung erhält die parallele Struktur des Griechischen.
- source_word: θεράποντι
  choice: seinen Diener
  rationale: θεράπων bezeichnet einen persönlichen Diener oder Gefolgsmann. „Diener“ ist natürlich und unterscheidet sich hier vom statusbetonteren „Sklaven“ für δοῦλος.
- source_word: θραῦσον
  choice: zerschmettere
  rationale: Der starke Imperativ bezeichnet ein entschiedenes Zerbrechen. „Zerschmettere“ gibt seine Intensität angemessen wieder.
- source_word: τὸ ἀνάστεμα
  choice: ihre Überheblichkeit
  rationale: Das seltene Substantiv kann eine stolze Erhebung, Anmaßung oder ein Sich-Erheben bezeichnen. „Überheblichkeit“ gibt im Kontext den moralischen Sinn wieder; die sachlich mögliche Bedeutung „Aufstand/Erhebung“ bleibt in der Fußnote erhalten.
- source_word: ἐν χειρὶ θηλείας
  choice: durch die Hand einer Frau
  rationale: Die biblische Hand-Wendung bezeichnet das handelnde Mittel. „Frau“ gibt die ausdrücklich weibliche Kennzeichnung natürlich wieder.
theological_decisions:
- issue: Weibliche Handlungsträgerschaft in Judits Gebet
  choice: durch die Hand einer Frau
  alternative: durch Frauenhand
  rationale: Das Griechische hebt die weibliche Handlungsträgerschaft ausdrücklich hervor. Die Übersetzung erhält diesen für die Erzählung bedeutsamen Kontrast, ohne ihn abzuschwächen oder weiter auszudeuten.
- issue: Judits Täuschung als Mittel ihres Handelns
  choice: durch den Trug meiner Lippen
  alternative: durch meine trügerischen Lippen
  rationale: Der Genitiv ἀπάτης μου lässt Judit den Trug ausdrücklich als den ihren bezeichnen. Die Übersetzung bewahrt diese Spannung, statt ihr Handeln moralisch zu entschärfen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Gebetssprache. Die parallele Gegenüberstellung von Sklave, Herrscher und Diener sowie die ausdrücklich weibliche Handlungsträgerschaft bleiben erhalten.
