    issue: Unklare Wiedergabe der doppelten gegnerischen Beziehung bei πάταξον … ἐπʼ.
    rationale: Die derzeitige Formulierung ordnet „durch den Trug meiner Lippen“ und „gegen den Herrscher“ grammatisch nicht eindeutig zu. Die Revision macht verständlich, dass der Trug das Mittel ist, durch das Untergebener und Herrscher gegeneinander zum Schlag veranlasst werden.
  revised_text: Lass durch den Trug meiner Lippen den Sklaven den Herrscher schlagen und den Herrscher seinen Diener; zerschmettere ihre Überheblichkeit[a] durch die Hand einer Frau.
