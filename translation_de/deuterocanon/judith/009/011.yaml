base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/011.yaml
  text: For your power is not in a multitude[a], nor is your dominion among the strong; rather, you are God of the lowly, helper of the lesser, supporter of the weak, shelter of the forsaken[b], savior of those without hope.
translation:
  language: de
  text: Denn deine Macht liegt nicht in einer großen Menge, und deine Herrschaft beruht nicht auf den Starken. Vielmehr bist du der Gott der Niedrigen, Helfer der Geringeren, Beistand der Schwachen, Schutz derer, die man aufgegeben hat,[a] und Retter der Hoffnungslosen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schutz der Verzweifelten“; das griechische Wort kann Menschen bezeichnen, die als verloren aufgegeben wurden, oder Menschen, die selbst verzweifelt sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Befreier der Hoffnungslosen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθει
  choice: einer großen Menge
  rationale: Bewahrt den konkreten Sinn von πλῆθος als Menge oder große Zahl, ohne den Ausdruck ausdrücklich militärisch zu deuten.
- source_word: κράτος
  choice: Macht
  rationale: Gibt die wirksame Stärke oder Macht wieder und bildet einen natürlichen Parallelismus mit der folgenden Herrschaftsaussage.
- source_word: δυναστεία
  choice: Herrschaft
  rationale: Bezeichnet Herrschergewalt beziehungsweise Herrschaft und ist im modernen Deutschen würdig und verständlich.
- source_word: ἐν ἰσχύουσιν
  choice: beruht nicht auf den Starken
  rationale: Die griechische Wendung bezeichnet die Starken oder Mächtigen; „beruht auf“ gibt im Deutschen idiomatisch wieder, dass Gottes Herrschaft nicht bei ihnen ihre Grundlage hat.
- source_word: ταπεινῶν
  choice: der Niedrigen
  rationale: Bezeichnet eher gesellschaftlich Erniedrigte oder Herabgesetzte als ausschließlich innerlich Demütige und passt zur Reihe schutzbedürftiger Menschen.
- source_word: ἐλαττόνων
  choice: der Geringeren
  rationale: Erhält den komparativen Sinn „geringer, kleiner“, ohne ihn zum Superlativ „Geringsten“ zu steigern.
- source_word: βοηθός
  choice: Helfer
  rationale: Direkte und natürliche Wiedergabe des Prädikatsnomens für jemanden, der Hilfe bringt.
- source_word: ἀντιλήμπτωρ
  choice: Beistand
  rationale: Vermittelt das unterstützende Ergreifen und Beistehen, ohne den Begriff mit dem folgenden Schutzmotiv gleichzusetzen.
- source_word: ἀσθενούντων
  choice: der Schwachen
  rationale: Bewahrt den breiten Sinn körperlicher oder allgemeiner Schwäche und legt den Ausdruck nicht auf Krankheit fest.
- source_word: ἀπεγνωσμένων
  choice: derer, die man aufgegeben hat
  rationale: Gibt den passiven Sinn von Menschen wieder, die als verloren gelten oder aufgegeben worden sind, und unterscheidet ihn vom folgenden Verlust der Hoffnung.
- source_word: σκεπαστής
  choice: Schutz
  rationale: Drückt die Funktion des Bedeckens und Bergens natürlich aus; das deutsche Abstraktum passt als Gottesprädikat besser als „Unterstand“ oder „Bedecker“.
- source_word: ἀπηλπισμένων
  choice: der Hoffnungslosen
  rationale: Bezeichnet Menschen, die keine Hoffnung mehr haben; die knappe substantivische Form bewahrt den litaneiartigen Abschluss.
- source_word: σωτήρ
  choice: Retter
  rationale: Gibt σωτήρ als rettende Person unmittelbar wieder; „Befreier“ bleibt als mögliche, aber enger gefasste Alternative bestehen.
theological_decisions:
- issue: Gestaltung der Reihe göttlicher Prädikate
  choice: Die kompakte Folge „Gott …, Helfer …, Beistand …, Schutz … und Retter …“ bleibt erhalten.
  alternative: Eine ausdeutende Satzfolge wie „du hilfst den Niedrigen und rettest die Hoffnungslosen“.
  rationale: Der griechische Text reiht Gottesbezeichnungen litaneiartig aneinander. Die nominale Struktur bewahrt diese Rhetorik und vermeidet eine theologische Ausweitung.
- issue: Verhältnis von Gottes Macht zu Menge und Starken
  choice: „liegt nicht in einer großen Menge“ und „beruht nicht auf den Starken“
  alternative: Absolutere Formulierungen wie „du hast keine Macht durch Menschenmengen“ oder „du herrschst nicht unter Mächtigen“.
  rationale: Die Formulierung wahrt die Aussage, dass Gottes Macht und Herrschaft ihre Grundlage nicht in zahlenmäßiger Größe oder menschlicher Stärke haben, ohne weitergehende Aussagen über menschliche Mitwirkung einzutragen.
- issue: Unterscheidung der beiden verzweiflungsbezogenen Gruppen
  choice: ἀπεγνωσμένων wird als „die man aufgegeben hat“ und ἀπηλπισμένων als „Hoffnungslose“ unterschieden.
  alternative: Beide Ausdrücke mit „Verzweifelte“ wiederzugeben.
  rationale: Die Unterscheidung erhält die mögliche passive Bedeutung des ersten Ausdrucks und den deutlicheren Hoffnungsverlust des zweiten, statt die Spannung einzuebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit litaneiartiger, kompakter Prädikatsfolge. Die Satzstruktur bleibt quellennah, wird aber durch „liegt in“ und „beruht auf“ idiomatisch gestaltet. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
