base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/014.yaml
  text: And bring about[a], upon all your nation and every tribe, recognition, so that they may know that you are the God of all power and might[b], and there is no other who defends the people of Israel except you.
translation:
  language: de
  text: Und bewirke bei deinem ganzen Volk und bei jedem Stamm, dass sie zur Erkenntnis gelangen,[a] damit sie erkennen, dass du der Gott aller Macht und Stärke bist[b] und dass es keinen anderen gibt, der das Volk Israel verteidigt, außer dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Anerkennung“ beziehungsweise „volle Erkenntnis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Gott aller Macht und Stärke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον
  choice: bewirke
  rationale: Der Aoristimperativ von ποιέω hat hier ἐπίγνωσιν zum Objekt und bezeichnet das Hervorbringen von Erkenntnis.
- source_word: ἐπὶ πᾶν τὸ ἔθνος σου καὶ πάσης φυλῆς
  choice: bei deinem ganzen Volk und bei jedem Stamm
  rationale: Die distributive Formulierung wird in natürlichem Deutsch mit „bei“ wiedergegeben; ἔθνος bezeichnet hier das Volk als Ganzes, φυλή die einzelnen Stämme.
- source_word: ἐπίγνωσιν
  choice: Erkenntnis
  rationale: „Erkenntnis“ bewahrt den Sinn von Wissen beziehungsweise Anerkennen und lässt die nachfolgende Erläuterung durch τοῦ εἰδῆσαι bestehen.
- source_word: τοῦ εἰδῆσαι
  choice: damit sie erkennen
  rationale: Der artikulierte Infinitiv bezeichnet hier Zweck oder Folge; der deutsche Finalsatz gibt dies idiomatisch wieder.
- source_word: ὁ θεὸς πάσης δυνάμεως καὶ κράτους
  choice: der Gott aller Macht und Stärke
  rationale: Die beiden einander nahestehenden Begriffe werden als verstärkendes Wortpaar wiedergegeben, ohne ihre mögliche Bedeutungsbreite künstlich festzulegen.
- source_word: ὑπερασπίζων
  choice: der … verteidigt
  rationale: Das Partizip bezeichnet einen aktiv schützenden oder verteidigenden Beistand und passt zum militärischen Kontext des Buches Judit.
- source_word: τοῦ γένους Ἰσραήλ
  choice: das Volk Israel
  rationale: γένος kann Abstammung, Geschlecht oder Volk bezeichnen; „Volk Israel“ ist modernes, würdiges Deutsch und wahrt den kollektiv-ethnischen Sinn.
- source_word: εἰ μὴ σύ
  choice: außer dir
  rationale: Die Wendung drückt einen nachdrücklichen Ausschluss aller anderen Verteidiger aus.
theological_decisions:
- issue: Gottes ausschließliche Rolle als Verteidiger Israels
  choice: es gibt keinen anderen, der das Volk Israel verteidigt, außer dir
  alternative: du allein bist der Verteidiger des Geschlechts Israel
  rationale: Die Formulierung wahrt die exklusive Aussage des griechischen Textes, ohne sie über den Vers hinaus dogmatisch auszuweiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebetston. Die Satzstruktur bleibt dem Griechischen nahe, wird jedoch idiomatisch geglättet. Alle Fußnotenmarker stehen im Haupttext.
