base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/012.yaml
  text: Yes[a], yes, O God of my father and God of Israel’s inheritance, Master of the heavens and of the earth, Creator of the waters[b], King of all your creation, you—hear my prayer.
translation:
  language: de
  text: 'Ja, ja, Gott meines Vaters und Gott des Erbes Israels[a], Gebieter[b] der Himmel und der Erde, Schöpfer der Wasser, König deiner ganzen Schöpfung: Du – erhöre mein Flehen!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott des Erbteils Israels“. Das griechische Wort kann ein Erbe, ein Erbteil, einen Besitz oder ein überkommenes Gut bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Gebieter“ gibt das griechische Wort despotēs wieder, das stärker als kyrios („Herr“) die uneingeschränkte Autorität hervorhebt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὶ ναὶ
  choice: Ja, ja
  rationale: Die doppelte Bekräftigung wird unmittelbar und ohne eine sachfremde Formel wie „Wahrlich, wahrlich“ wiedergegeben.
- source_word: ὁ θεὸς τοῦ πατρὸς μου
  choice: Gott meines Vaters
  rationale: Der Singular „meines Vaters“ folgt dem Griechischen; der Gebetszusammenhang macht die direkte Anrede deutlich.
- source_word: θεὸς κληρονομίας Ἰσραήλ
  choice: Gott des Erbes Israels
  rationale: „Erbe“ gibt κληρονομία direkt wieder und lässt die mögliche Bedeutung als Erbteil, Besitz oder überkommenes Gut Israels offen.
- source_word: δέσποτα
  choice: Gebieter
  rationale: „Gebieter“ bewahrt stärker als „Herr“ den in δεσπότης liegenden Gedanken uneingeschränkter Verfügungsgewalt und bleibt als feierliche Gottesankrede verständlich.
- source_word: τῶν οὐρανῶν καὶ τῆς γῆς
  choice: der Himmel und der Erde
  rationale: Der griechische Plural „Himmel“ wird beibehalten; die parallele Genitivfügung bleibt erhalten.
- source_word: κτίστα τῶν ὑδάτων
  choice: Schöpfer der Wasser
  rationale: „Schöpfer“ entspricht der direkten Anrede κτίστα; der ausdrückliche Plural „Wasser“ wird bewahrt.
- source_word: βασιλεῦ πάσης κτίσεώς σου
  choice: König deiner ganzen Schöpfung
  rationale: κτίσις wird im kosmischen Zusammenhang kollektiv als „Schöpfung“ verstanden; πάσης und σου erscheinen als „ganzen“ und „deiner“.
- source_word: σὺ εἰσάκουσον
  choice: Du – erhöre
  rationale: Das ausdrücklich gesetzte σὺ trägt Nachdruck. „Erhöre“ gibt im Gebetszusammenhang nicht bloß akustisches Hören, sondern das aufmerksame Annehmen der Bitte wieder.
- source_word: τῆς δεήσεώς μου
  choice: mein Flehen
  rationale: δέησις bezeichnet eine eindringliche Bitte oder ein Flehen; diese Wiedergabe ist präziser als das allgemeinere „Gebet“ und im Deutschen weiterhin natürlich.
theological_decisions:
- issue: Wiedergabe von δέσποτα als Gottesankrede
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: Die Übersetzung unterscheidet δέσποτα vom allgemeineren κύριος und wahrt so den stärkeren Akzent auf Gottes uneingeschränkter Autorität, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
- issue: Bezug der Genitive in θεὸς κληρονομίας Ἰσραήλ
  choice: Gott des Erbes Israels
  alternative: Gott des Erbteils Israels; Gott von Israels Erbe
  rationale: Die knappe Genitivverbindung des Griechischen wird nicht in eine dogmatisch eindeutigere Aussage umgeformt. Die Fußnote weist auf den Bedeutungsspielraum von κληρονομία hin.
translation_notes:
  register: Feierliche, aber gegenwärtig verständliche Gebetssprache. Die Reihung der Gottesprädikate und die griechischen Pluralformen werden bewahrt. Doppelpunkt und Gedankenstrich machen den Nachdruck des ausdrücklichen Pronomens σὺ im Deutschen hörbar. Die Fußnotenmarker stehen an den sachlich zugehörigen Stellen.
