  text: And when the men of her city heard her voice, they hurried down to the gate of their city and called together the elders of the city.
translation:
  language: de
  text: Und als die Männer ihrer Stadt ihre Stimme hörten, eilten sie zum Tor ihrer Stadt hinab und riefen die Ältesten der Stadt zusammen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Und als
  rationale: Die Wendung leitet das nächste Geschehen in der Erzählfolge ein. „Und als“ gibt den zeitlichen Zusammenhang natürlich wieder, ohne das griechische Idiom unnötig wörtlich nachzubilden.
- source_word: οἱ ἄνδρες τῆς πόλεως αὐτῆς
  choice: die Männer ihrer Stadt
  rationale: ἄνδρες bezeichnet ausdrücklich Männer; αὐτῆς bezieht sich auf Judit. Die Formulierung bleibt eng am griechischen Text und ist im Deutschen verständlich.
- source_word: τὴν φωνὴν αὐτῆς
  choice: ihre Stimme
  rationale: φωνή bedeutet hier die hörbare Stimme Judits. Die direkte Wiedergabe bewahrt den Wortlaut und passt zum Kontext ihres Rufens.
- source_word: ἐσπούδασαν τοῦ καταβῆναι
  choice: eilten ... hinab
  rationale: Das Verb bezeichnet rasches, dringliches Handeln; der Infinitiv nennt die Bewegung nach unten. „eilten ... hinab“ verbindet beides in natürlichem Deutsch.
- source_word: ἐπὶ τὴν πύλην τῆς πόλεως αὐτῶν
  choice: zum Tor ihrer Stadt
  rationale: πύλη ist das Stadttor; αὐτῶν verweist auf die Männer. „zum Tor ihrer Stadt“ wahrt den Besitzbezug des griechischen Textes.
- source_word: συνεκάλεσαν
  choice: riefen ... zusammen
  rationale: Das zusammengesetzte Verb bezeichnet das Zusammenrufen beziehungsweise Einberufen einer Gruppe. Die gewählte Formulierung ist klar und nicht übermäßig förmlich.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: die Ältesten der Stadt
  rationale: πρεσβύτεροι bezeichnet hier die Ältesten beziehungsweise führenden Vertreter der Stadt. Die traditionelle und verständliche Wiedergabe lässt ihre genaue amtliche Funktion offen.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von ἄνδρες
  choice: die Männer ihrer Stadt
  alternative: die Leute ihrer Stadt / die Einwohner ihrer Stadt
  rationale: Das griechische ἄνδρες ist ausdrücklich maskulin. Da der Vers keinen Anlass bietet, den Ausdruck zu einer geschlechtsneutralen Gesamtbezeichnung zu erweitern, wird die Geschlechtsangabe bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählsyntax. Die Wiederholung von „ihrer Stadt“ und „der Stadt“ folgt der griechischen Ausdrucksweise, ohne unnatürlich zu wirken.
