  yaml_path: translation/deuterocanon/judith/013/009.yaml
  text: And when she came near to the bed, she seized the hair of his head and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: de
  text: 'Als sie an das Bett herangetreten war, ergriff sie sein Haupthaar und sagte: »Stärke mich, Gott Israels, an diesem Tag!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: als sie … herangetreten war
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Annäherung; die temporale Wiedergabe bildet die natürliche Abfolge im Deutschen ab.
- source_word: κλίνη
  choice: Bett
  rationale: κλίνη kann Bett oder Liege bedeuten; im erzählerischen Kontext ist »Bett« die klare und natürliche Bezeichnung.
- source_word: ἐδράξατο
  choice: ergriff
  rationale: Das Verb bezeichnet ein entschiedenes Zugreifen. »Ergriff« wahrt die Kraft der Handlung und klingt in gehobener, aber verständlicher Erzählsprache natürlich.
- source_word: κόμη τῆς κεφαλῆς αὐτοῦ
  choice: sein Haupthaar
  rationale: »Haupthaar« gibt die ausdrücklich auf den Kopf bezogene κόμη knapp wieder und vermeidet die im Deutschen schwerfällige Formulierung »die Haare seines Kopfes«.
- source_word: Κραταίωσόν με
  choice: Stärke mich
  rationale: Der Imperativ bittet unmittelbar um Kraft beziehungsweise Stärkung; »Stärke mich« bewahrt die knappe Gebetsform.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Gott Israels
  rationale: Die Wortgruppe steht als direkte Anrede. Im Deutschen zeigt die Satzstellung die Anrede eindeutig an, ohne dass ein altertümliches »o« nötig ist.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: an diesem Tag
  rationale: Dies ist die idiomatische deutsche Wiedergabe der temporalen Wendung und bewahrt die unmittelbare Zeitbezogenheit der Bitte.
theological_decisions:
- issue: Gebetsformel und Gottesbezeichnung
  choice: Gott Israels
  alternative: o Gott Israels
  rationale: Der griechische Ausdruck hat in diesem Satz Anredefunktion. Das Deutsche kann diese durch Syntax und Zeichensetzung deutlich machen; der Verzicht auf »o« ändert den theologischen Gehalt nicht und entspricht heutiger Standardsprache.
translation_notes:
  register: Moderne, würdevolle und gut verständliche Erzählsprache. Die direkte und feierliche Kürze des Gebets bleibt erhalten; es sind keine Fußnoten erforderlich.
