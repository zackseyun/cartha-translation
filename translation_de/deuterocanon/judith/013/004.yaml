base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/004.yaml
  text: And Judith told her female servant to stand outside her sleeping chamber and watch for her going out[a], as on previous days, for she said that she would go out for her prayer[b]; and she spoke to Bagoas according to these words.
translation:
  language: de
  text: Und Judit sagte ihrer Sklavin, sie solle außerhalb ihres Schlafgemachs stehen und ihr Hinausgehen beobachten[a], wie jeden Tag; denn sie sagte, sie werde zu ihrem Gebet hinausgehen[b]. Und sie sprach mit Bagoas entsprechend diesen Worten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf ihren Ausgang achten“ oder „ihren Ausgang bewachen“.'
    reason: lexical_alternative
  - marker: b
    text: '„Wie jeden Tag“ bezeichnet Judits regelmäßige Gewohnheit, zum Gebet hinauszugehen; wörtlicher: „wie Tag für Tag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλῃ
  choice: Sklavin
  rationale: Der feminine Dativ Singular bezeichnet eine unfreie Dienerin; „Sklavin“ bewahrt Status und Geschlecht, ohne den Begriff zu verharmlosen.
- source_word: στῆναι
  choice: sie solle … stehen
  rationale: Gibt den Aoristinfinitiv von ἵστημι in der indirekten Aufforderung unmittelbar wieder und bezeichnet das postierte Verbleiben vor dem Gemach.
- source_word: κοιτῶνος
  choice: Schlafgemach
  rationale: κοίτων bezeichnet ein Schlaf- oder Bettgemach; „Schlafgemach“ ist würdevoll, verständlich und präziser als das allgemeine „Zimmer“.
- source_word: ἐπιτηρεῖν τὴν ἔξοδον αὐτῆς
  choice: darauf achten, wann sie hinausging
  rationale: Die Wendung bezeichnet aufmerksames Beobachten ihres Hinausgehens. Die deutsche Form ist natürlicher als „ihren Ausgang bewachen“, ohne eine bestimmte Deutung des Zwecks hinzuzufügen.
- source_word: καθάπερ καθʼ ἡμέρας
  choice: wie Tag für Tag
  rationale: Bewahrt die distributive, gewohnheitsmäßige Aussage des Griechischen, ohne ausdrücklich „an den vorherigen Tagen“ einzusetzen.
- source_word: ἐξελεύσεσθαι
  choice: sie werde … hinausgehen
  rationale: Der Futurinfinitiv nach ἔφη wird im Deutschen als indirekte Rede mit „werde“ wiedergegeben.
- source_word: ἐπὶ τὴν προσευχὴν αὐτῆς
  choice: zum Gebet
  rationale: Gibt die zielgerichtete Konstruktion mit ἐπί und Akkusativ knapp und idiomatisch wieder; das Possessivpronomen ist im Deutschen entbehrlich.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: entsprechend diesen Worten
  rationale: Gibt die Übereinstimmung ihrer Mitteilung an Bagoas mit dem zuvor Gesagten formal und zugleich verständlich wieder.
