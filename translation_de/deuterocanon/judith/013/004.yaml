revisions:
- from: Und Judit sagte zu ihrer Sklavin, sie solle außerhalb ihres Schlafgemachs stehen und darauf achten, wann sie hinausging[a], wie Tag für Tag; denn sie hatte gesagt, sie werde zum Gebet hinausgehen[b]. Auch mit Bagoas hatte sie entsprechend diesen Worten gesprochen.
  to: Und Judit sagte ihrer Sklavin, sie solle außerhalb ihres Schlafgemachs stehen und ihr Hinausgehen beobachten[a], wie jeden Tag; denn sie sagte, sie werde zu ihrem Gebet hinausgehen[b]. Und sie sprach mit Bagoas entsprechend diesen Worten.
  rationale: Die Revision beseitigt die unzutreffende temporale Umformung von „ihr Hinausgehen“ und die nicht begründeten Vorvergangenheitsformen. Zugleich wird die gewohnheitsmäßige Wendung idiomatisch wiedergegeben, ohne die im griechischen Text mögliche knappe Verknüpfung näher auszudeuten.
