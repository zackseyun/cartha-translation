review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung ist überwiegend getroffen. „wann sie hinausging“ fügt jedoch eine im Griechischen nicht vorhandene temporale Frage hinzu und setzt das Hinausgehen in die Vergangenheit; τὴν ἔξοδον αὐτῆς bezeichnet ihr Hinausgehen/ihren Ausgang als Gegenstand des Beobachtens. Die Plusquamperfektformen „hatte gesagt“ und „hatte ... gesprochen“ sind nicht angezeigt; die griechischen Aoriste berichten die aufeinanderfolgenden Handlungen schlicht narrativ.
  naturalness: „Wie Tag für Tag“ ist in dieser Stellung unidiomatisch. „Wie jeden Tag“ ist modernes, natürliches Standarddeutsch und wahrt die gewohnheitsmäßige Aussage. Die revidierte Fassung bleibt knapp und erzählerisch klar.
  terminology: „Sklavin“ gibt δούλῃ angemessen wieder, „Schlafgemach“ ist für κοιτών passend, und „Bagoas“ ist korrekt. „Zu ihrem Gebet“ erhält das im Griechischen ausgedrückte Possessivpronomen. „Entsprechend diesen Worten“ gibt κατὰ τὰ ῥήματα ταῦτα sachgerecht wieder.
  issues:
  - severity: medium
    issue: „wann sie hinausging“ für ἐπιτηρεῖν τὴν ἔξοδον αὐτῆς
    rationale: Die Formulierung macht aus dem Objekt des Beobachtens eine Frage nach dem Zeitpunkt und verwendet zudem einen Vergangenheitsausdruck. Gemeint ist, ihr Hinausgehen zu beobachten bzw. darauf zu achten.
  - severity: medium
    issue: Plusquamperfekt in „sie hatte gesagt“ und „hatte ... gesprochen“
    rationale: Die Aoriste ἔφη und ἐλάλησεν verlangen keine Vorvergangenheit. Das deutsche Präteritum gibt den narrativen Ablauf ohne zusätzliche zeitliche Einordnung wieder.
  - severity: low
    issue: „wie Tag für Tag“
    rationale: Die Wendung ist im modernen Deutschen hier nicht idiomatisch. „Wie jeden Tag“ vermittelt die tägliche Gewohnheit klar und ohne Sinnverlust.
