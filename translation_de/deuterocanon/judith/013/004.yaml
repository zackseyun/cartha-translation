translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Satzperiode ist zur besseren Verständlichkeit in zwei Sätze gegliedert. „Sklavin“ wahrt den im griechischen δούλη bezeichneten unfreien Status; „Schlafgemach“ hält den erzählerischen Ton, ohne unnötig archaisch zu wirken.
