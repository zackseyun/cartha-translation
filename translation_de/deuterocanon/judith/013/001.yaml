base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/001.yaml
  text: When evening came[a], his servants hurried to depart; and Bagoas shut the tent from outside and excluded those in attendance from the presence of his lord, and they went away to their beds.
translation:
  language: de
  text: 'Als es Abend geworden war, beeilten sich seine Sklaven[a] aufzubrechen. Bagoas verschloss das Zelt von außen, schloss die Anwesenden von der Gegenwart seines Herrn aus, und sie gingen zu ihren Schlafstätten.


    [a] Oder: seine Diener. Im Griechischen steht „seine Sklaven“ (δοῦλοι); gemeint sind Angehörige des Hausgefolges, die unter der Verfügungsgewalt ihres Herrn standen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Diener. Im Griechischen steht „seine Sklaven“ (δοῦλοι); gemeint sind Angehörige des Hausgefolges, die unter der Verfügungsgewalt ihres Herrn standen.'
    reason: Lexikalische Alternative zu δοῦλοι und Erläuterung des antiken Abhängigkeitsverhältnisses.
lexical_decisions:
- source_word: ὀψία
  choice: Abend
  rationale: In der Wendung ὀψία ἐγένετο bezeichnet das Wort natürlich den Eintritt des Abends; „Einbruch der Nacht“ wäre stärker als nötig.
- source_word: ἐσπούδασαν
  choice: beeilten sich
  rationale: Gibt die im Verb ausgedrückte Eile in natürlichem modernem Deutsch wieder.
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: seine Sklaven
  rationale: Bewahrt den sozialen Rechts- und Abhängigkeitsstatus, den δοῦλοι ausdrückt; die Fußnote nennt die im Funktionskontext mögliche Wiedergabe „Diener“.
- source_word: ἀναλύειν
  choice: aufzubrechen
  rationale: Bezeichnet hier das Sichentfernen beziehungsweise Auflösen der versammelten Dienerschaft für die Nacht.
- source_word: συνέκλεισεν τὴν σκηνὴν ἔξωθεν
  choice: verschloss das Zelt von außen
  rationale: Gibt sowohl das Schließen beziehungsweise Sichern als auch die äußere Position eindeutig wieder.
- source_word: ἀπέκλεισεν τοὺς παρεστῶτας ἐκ προσώπου τοῦ κυρίου αὐτοῦ
  choice: verwehrte den Anwesenden den Zutritt zu seinem Herrn
  rationale: Natürliche deutsche Wiedergabe des Ausschließens aus der Gegenwart des Herrn; κύριος bezeichnet hier den menschlichen Gebieter Holofernes.
- source_word: ἀπῴχοντο εἰς τὰς κοίτας αὐτῶν
  choice: sie gingen zu ihren Schlafstätten
  rationale: Bewahrt die erzählerische Bewegung und den Plural von κοίτας; „Schlafstätten“ passt zum historischen Lagerkontext.
- source_word: Βαγώας
  choice: Bagoas
  rationale: Der Personenname wird gemäß der üblichen deutschen Transkription wiedergegeben.
theological_decisions:
- issue: Wiedergabe von δοῦλοι im häuslich-militärischen Gefolge
  choice: Sklaven
  alternative: Diener
  rationale: „Sklaven“ wahrt die reale persönliche Abhängigkeit und glättet den antiken Status nicht. Da die Personen zugleich als Angehörige des Gefolges dienen, wird „Diener“ als funktionale Alternative in der Fußnote genannt.
- issue: Bedeutung von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im Kontext ist Holofernes als menschlicher Herr gemeint, nicht Gott. „Herr“ erhält dennoch die übliche soziale Bezeichnung des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählsyntax. Der erste griechische Satz wurde zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert. „Schlafstätten“ vermeidet das zu umgangssprachliche „ins Bett“, während „verwehrte … den Zutritt“ die griechische Gegenwartsformel idiomatisch wiedergibt.
