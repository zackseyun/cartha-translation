  - severity: low
    issue: Fußnote gibt die Form des griechischen Ausdrucks nicht ganz genau wieder
    rationale: ὁ θεὸς ὁ θεὸς ἡμῶν enthält vor beiden Vorkommen von θεός den Artikel. Eine als wörtlich gekennzeichnete Erläuterung sollte dies mit »der Gott, der Gott von uns« abbilden.
