base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/011.yaml
  text: And Judith said from a distance to those guarding the gates[a], “Open up, open up the gate, for God, our God, is with us, still to show strength in Israel and power against our enemies, just as he has done today.”
translation:
  language: de
  text: 'Und Judit rief von Weitem den Wächtern an den Toren zu: »Öffnet, öffnet doch das Tor! Gott, unser Gott[a], ist mit uns, um weiterhin in Israel Stärke zu erweisen und Macht gegen unsere Feinde, so wie er es auch heute getan hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Gott, der Gott von uns«; die Wiederholung von »Gott« dient der nachdrücklichen Betonung: »Gott, unser Gott«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακρόθεν
  choice: schon von Weitem
  rationale: Das Adverb bezeichnet räumliche Entfernung; die Wendung ist im modernen Deutschen natürlich und passt zum Zurufen an die Torwächter.
- source_word: εἶπεν ... τοῖς φυλάσσουσιν ἐπὶ τῶν πυλῶν
  choice: rief ... den Wächtern an den Toren zu
  rationale: Das allgemeinere εἶπεν wird im Kontext der Entfernung idiomatisch als »rief ... zu« wiedergegeben; φυλάσσουσιν bezeichnet die Wachenden beziehungsweise Wächter. Der Plural »Tore« folgt dem griechischen Text.
- source_word: Ἀνοίξατε, ἀνοίξατε δὴ τὴν πύλην
  choice: Öffnet, öffnet doch das Tor!
  rationale: Die Wiederholung bewahrt die Dringlichkeit. »doch« gibt die verstärkende Partikel δὴ natürlich wieder; das direkte Objekt πύλην steht im Singular.
- source_word: μεθʼ ἡμῶν ὁ θεός
  choice: Gott ... ist mit uns
  rationale: Die griechische Nominalkonstruktion erfordert im Deutschen die Ergänzung von »ist«.
- source_word: ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: Gott, unser Gott
  rationale: Die Wiederholung von θεός ist emphatisch. Die Wiedergabe erhält beide Glieder, ohne daraus zwei verschiedene Bezeichnungen zu machen.
- source_word: ποιῆσαι ἔτι ἰσχὺν
  choice: um weiterhin ... Stärke zu erweisen
  rationale: Der Infinitiv lässt sich als Zweck beziehungsweise beabsichtigtes Wirken verstehen. »weiterhin« bewahrt den Fortsetzungsaspekt von ἔτι; »Stärke erweisen« gibt die im Deutschen unübliche Verbindung »Stärke tun« idiomatisch wieder.
- source_word: κράτος
  choice: Macht
  rationale: Im Zusammenhang militärischer Rettung bezeichnet das Wort wirksam hervortretende Macht; die Wahl unterscheidet es leicht von ἰσχύς, »Stärke«.
- source_word: κατὰ τῶν ἐχθρῶν ἡμῶν
  choice: gegen unsere Feinde
  rationale: κατά mit dem Genitiv hat hier eine gegen die Feinde gerichtete Bedeutung.
- source_word: καθὰ καὶ σήμερον ἐποίησεν
  choice: so wie er es auch heute getan hat
  rationale: Die Formulierung wahrt den Vergleich und verbindet die heute vollbrachte Tat natürlich mit dem gegenwärtigen Augenblick.
theological_decisions:
- issue: Emphatische Gottesbezeichnung ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: Gott, unser Gott
  alternative: unser Gott
  rationale: Die gewählte Fassung bewahrt die ausdrückliche Wiederholung des griechischen θεός und damit Judits bekenntnishafte Betonung, ohne eine zusätzliche dogmatische Aussage einzutragen.
- issue: Bezug des Infinitivs ποιῆσαι
  choice: 'als Zweck beziehungsweise erwartetes weiteres Handeln Gottes: »um weiterhin ... zu erweisen«'
  alternative: als bloße Folgerung oder unabhängige Aussage
  rationale: Der griechische Anschluss ist knapp und lässt eine gewisse syntaktische Spannung bestehen. Die Zweckfassung ergibt im Deutschen einen verständlichen Satz, ohne das weitere göttliche Handeln als bereits abgeschlossen darzustellen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Das doppelte »Öffnet« und das verstärkende »doch« erhalten die Dringlichkeit des Zurufs. »Judit« folgt der heute im Deutschen gebräuchlichen Namensform.
