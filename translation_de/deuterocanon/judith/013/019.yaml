  naturalness: „der Herr, Gott“ ist im modernen Standarddeutsch keine natürliche appositionelle Gottesbezeichnung und wirkt wegen des Kommas wie eine Anrede. „der Herr, der Gott“ ist idiomatisch, würdevoll und gibt Κύριος ὁ θεός klar wieder.
  terminology: „Gepriesen sei“, „erschaffen“, „Himmel und Erde“ und „Anführer“ passen zum gehobenen erzählerisch-doxologischen Register. „der Herr, der Gott“ wahrt die beiden griechischen Gottesbezeichnungen ohne eine sachlich falsche Konstruktion.
