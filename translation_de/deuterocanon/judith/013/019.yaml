  yaml_path: translation/deuterocanon/judith/013/019.yaml
  text: And blessed is the Lord God[a], who created the heavens and the earth, who directed you to strike the head of the ruler of our enemies.
translation:
  language: de
  text: Und gepriesen sei der Herr, der Gott, der die Himmel und die Erde erschaffen hat und der dich dazu geleitet hat, den Kopf des Anführers unserer Feinde zu verwunden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der dich zu einer Verwundung des Kopfes des Anführers unserer Feinde geführt hat“.'
    reason: Die griechische Wendung εἰς τραῦμα κεφαλῆς ist nominal und kann als Ziel- oder Ergebnisangabe verstanden werden.
lexical_decisions:
- source_word: εὐλογημένος
  choice: gepriesen sei
  rationale: Die deutsche Segens- und Lobformel gibt den prädikativen, doxologischen Sinn natürlich und würdevoll wieder; „gesegnet“ wäre hier missverständlich passiv.
- source_word: Κύριος ὁ θεὸς
  choice: der Herr, Gott
  rationale: „Herr“ und „Gott“ werden als eng verbundene Gottesbezeichnungen beibehalten, ohne ein im Griechischen nicht vorhandenes „und“ einzufügen.
- source_word: ἔκτισεν
  choice: erschaffen hat
  rationale: κτίζω bezeichnet hier Gottes Schöpfungshandeln an Himmel und Erde.
- source_word: τοὺς οὐρανοὺς καὶ τὴν γῆν
  choice: die Himmel und die Erde
  rationale: Der Plural von οὐρανός bleibt als „die Himmel“ sichtbar und ist im gehobenen modernen Deutsch verständlich.
- source_word: κατεύθυνέν
  choice: dazu geleitet hat
  rationale: Die Formulierung bewahrt Gottes lenkende Führung, ohne eine stärkere Verursachung zu behaupten, als das Verb ausdrückt.
- source_word: εἰς τραῦμα κεφαλῆς
  choice: am Kopf zu verwunden
  rationale: Die nominale griechische Wendung „zu/für eine Verwundung des Kopfes“ wird idiomatisch verbal wiedergegeben; die ungewöhnlichere Ausgangsform wird in der Fußnote dokumentiert.
- source_word: ἄρχοντος
  choice: Anführer
  rationale: Im militärisch-politischen Zusammenhang bezeichnet ἄρχων den führenden Mann der Feinde; „Anführer“ ist klar, ohne einen speziellen Herrschertitel einzutragen.
- source_word: ἐχθρῶν ἡμῶν
  choice: unserer Feinde
  rationale: Dies ist die direkte und natürliche Wiedergabe des Genitivattributs.
theological_decisions:
- issue: Göttliche Führung bei Judits Tat
  choice: der dich dazu geleitet hat, den Anführer unserer Feinde am Kopf zu verwunden
  alternative: der dich zu einer Verwundung am Kopf des Anführers unserer Feinde geführt hat
  rationale: Die Übersetzung schreibt den Erfolg ausdrücklich Gottes Führung zu, wahrt aber den semantischen Spielraum von κατευθύνω und verstärkt die Aussage nicht zu unmittelbarer göttlicher Verursachung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die benediktorische Formel bleibt gehoben, während der Handlungssatz klar und unmittelbar formuliert ist.
