base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/014.yaml
  text: And she said to them with a loud voice, “Praise God, praise him; praise God, who has not withdrawn his mercy from the house of Israel, but has shattered our enemies by my hand in this night.”
translation:
  language: de
  text: 'Sie aber rief ihnen mit lauter Stimme zu: »Preist Gott, preist ihn! Preist Gott, der sein Erbarmen dem Haus Israel nicht entzogen, sondern in dieser Nacht durch meine Hand unsere Feinde zerschmettert hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἰνεῖτε
  choice: Preist
  rationale: Gibt den wiederholten Aufruf zum Gotteslob natürlich und würdig wieder; die Wiederholung des griechischen Textes bleibt vollständig erhalten.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: sein Erbarmen
  rationale: Bezeichnet Gottes barmherzige Zuwendung; »Erbarmen« ist im modernen Standarddeutsch klar und trägt den theologischen Gehalt von ἔλεος.
- source_word: ἀπὸ τοῦ οἴκου Ἰσραήλ
  choice: dem Haus Israel
  rationale: Bei »entziehen« steht das betroffene Gegenüber idiomatisch im Dativ; »Haus Israel« bewahrt die kollektive biblische Bezeichnung.
- source_word: ἔθραυσε
  choice: zerschmettert hat
  rationale: Bewahrt die starke, gewaltsame Bildsprache des griechischen Verbs und schwächt sie nicht zu »besiegt« ab.
- source_word: διὰ χειρός μου
  choice: durch meine Hand
  rationale: Bewahrt das Instrumentalbild und die Spannung zwischen Gottes Handeln und Judits menschlicher Mitwirkung.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: in dieser Nacht
  rationale: Entspricht der ausdrücklich gesetzten Präpositionalphrase und erhält den zeitlichen Nachdruck.
theological_decisions:
- issue: Verhältnis von göttlichem Handeln und Judits Tat
  choice: »durch meine Hand«
  alternative: »durch mich«
  rationale: Die wörtliche Hand-Metapher lässt sowohl Gott als handelndes Subjekt als auch Judit als Werkzeug hervortreten, ohne diese Spannung aufzulösen.
- issue: Bedeutungsumfang von ἔλεος
  choice: »Erbarmen«
  alternative: »Gnade« oder »Bundestreue«
  rationale: »Erbarmen« gibt den Grundsinn wieder, ohne eine bestimmte konfessionelle oder bundestheologische Auslegung festzuschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter rhetorischer Wiederholung. »Rief … zu« formuliert εἶπεν … φωνῇ μεγάλῃ im Deutschen natürlicher als das steife »sagte mit lauter Stimme«, ohne den Inhalt zu erweitern.
