  text: For they were all exhausted[a], because the drinking had gone on too long.
translation:
  language: de
  text: Denn sie waren alle erschöpft, weil das Trinken zu lange gedauert hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weil das Trinkgelage länger gedauert hatte« oder: »weil das Trinkgelage ausgeufert war«. Der griechische Ausdruck kann sowohl eine übermäßige Dauer als auch ein Übermaß beim Trinken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκοπωμένοι
  choice: erschöpft
  rationale: Das Perfektpartizip bezeichnet den anhaltenden Zustand der Ermüdung; »erschöpft« gibt die Stärke und das Ergebnis natürlich wieder.
- source_word: διὰ τὸ ... γεγονέναι
  choice: weil ... gedauert hatte
  rationale: Die Konstruktion nennt die Ursache ihres Zustands. Das Plusquamperfekt drückt im Deutschen passend aus, dass das vorausgehende Geschehen zu ihrer Erschöpfung geführt hatte.
- source_word: ἐπὶ πλεῖον
  choice: zu lange
  rationale: Die Wendung bezeichnet ein Übermaß an Dauer oder Ausdehnung. Im Zusammenhang mit πότος ist »zu lange« eine natürliche Wiedergabe, ohne die mögliche Bedeutung allgemeiner Ausschweifung auszuschließen.
- source_word: τὸν πότον
  choice: das Trinken
  rationale: πότος bezeichnet das Trinken, besonders auch ein Trinkgelage. »Das Trinken« bleibt nahe am griechischen Ausdruck und trägt nicht unnötig den Gedanken an eine vollständige Mahlzeit ein.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet die zuvor geschilderte Lage; »Denn« bewahrt diesen erklärenden Anschluss.
