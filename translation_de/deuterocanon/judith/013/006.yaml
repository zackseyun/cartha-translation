  yaml_path: translation/deuterocanon/judith/013/006.yaml
  text: And Judith stood beside his bed and said in her heart[a], “Lord, God of all power, look upon the works of my hands at this hour[b], for the exaltation of Jerusalem.”
translation:
  language: de
  text: 'Und Judit stand neben seinem Bett und sagte in ihrem Herzen[a]: »Herr, Gott aller Macht, sieh in dieser Stunde auf die Werke meiner Hände zur Erhöhung Jerusalems.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sagte bei sich«. Wörtlich: »sagte in ihrem Herzen«; gemeint ist ein inneres Sprechen oder Beten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »zur Erhebung Jerusalems« oder »zum Emporheben Jerusalems«. Das griechische Wort bezeichnet Höhe bzw. Erhöhung; die genaue Weise dieser Erhöhung wird nicht näher bestimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: στᾶσα
  choice: trat
  rationale: Das vorzeitige Aoristpartizip bezeichnet Judits Herantreten bzw. ihre eingenommene Stellung am Bett; die koordinierte deutsche Verbform gibt die Handlungsfolge natürlich wieder.
- source_word: παρὰ τὴν κλίνην αὐτοῦ
  choice: an sein Bett
  rationale: παρά mit Akkusativ bezeichnet hier die Position unmittelbar beim Bett; »Bett« ist im Kontext die klare moderne Wiedergabe von κλίνη.
- source_word: εἶπεν ἐν τῇ καρδίᾳ ἑαυτῆς
  choice: sagte in ihrem Herzen
  rationale: Die bildhafte biblische Wendung für inneres Sprechen bzw. Beten bleibt erhalten; eine Fußnote erläutert die natürliche Alternative.
- source_word: Κύριε ὁ θεὸς πάσης δυνάμεως
  choice: Herr, Gott aller Macht
  rationale: Die Anrede an Gott und der umfassende Sinn von πάσης δυνάμεως werden knapp, würdig und quellennah wiedergegeben.
- source_word: ἐπίβλεψον
  choice: sieh ... auf
  rationale: Der Imperativ bittet Gott, seinen Blick und damit seine Aufmerksamkeit dem bevorstehenden Tun zuzuwenden.
- source_word: ἐν τῇ ὥρᾳ ταύτῃ
  choice: in dieser Stunde
  rationale: Die formnahe Wendung bewahrt den feierlichen Klang und ist im Deutschen gut verständlich.
- source_word: ἐπὶ τὰ ἔργα τῶν χειρῶν μου
  choice: auf das Werk meiner Hände
  rationale: Die biblische Bildsprache bleibt erhalten. Der deutsche Singular »Werk« bezeichnet das konkrete Vorhaben idiomatischer, obwohl das Griechische den Plural ἔργα hat; die Fußnote weist darauf hin.
- source_word: εἰς ὕψωμα Ἰερουσαλήμ
  choice: damit Jerusalem erhöht wird
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis; die verbale Form vermittelt die Erhöhungsmetapher verständlicher als das abstrakte »zur Erhöhung Jerusalems«, ohne sie als »Rettung« auszudeuten.
theological_decisions:
- issue: Formel des inneren Gebets
  choice: sagte in ihrem Herzen
  alternative: sagte bei sich
  rationale: Da die folgenden Worte ausdrücklich an Gott gerichtet sind, bezeichnet die Wendung ein inneres Gebet. Das Herzbild des Ausgangstextes bleibt erhalten, ohne eine besondere Lehre über das Herz einzutragen.
- issue: Bedeutung von εἰς ὕψωμα Ἰερουσαλήμ
  choice: damit Jerusalem erhöht wird
  alternative: zur Erhöhung Jerusalems
  rationale: Die Übersetzung bewahrt das offene Bild des Erhöhens und legt es nicht enger als Befreiung, Ruhm oder militärischen Sieg aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter biblischer Herz- und Handmetaphorik. Die direkte Rede ist als stilles Gebet erkennbar. »Judit« folgt der heute im Deutschen verbreiteten Namensform.
