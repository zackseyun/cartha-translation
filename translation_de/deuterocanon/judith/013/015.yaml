    issue: Unidiomatische Verbindung »zeigte ihnen den Kopf aus dem Beutel«
    rationale: Die griechische Präpositionalgruppe ἐκ τῆς πήρας bestimmt den gezeigten Kopf. Im Deutschen sollte das Hervorholen aus dem Beutel explizit mit dem anschließenden Zeigen verbunden werden.
  - severity: low
    issue: »assyrischen Heeres« ist gegenüber »Heer von Assur« leicht interpretierend
    rationale: Ἀσσούρ steht im Genitiv direkt bei δύναμις. Die Formulierung »Heer von Assur« erhält die Benennung des Ausgangstextes transparenter.
