revisions:
- from: 'Dann trat sie vor, zeigte ihnen den Kopf aus dem Beutel und sagte zu ihnen: »Seht, das ist der Kopf des Holofernes, des Oberbefehlshabers des assyrischen Heeres! Und seht, das ist das Moskitonetz, unter dem er in seinem Rausch lag. Der Herr hat ihn durch die Hand einer Frau erschlagen.«'
  to: 'Dann trat sie vor, holte den Kopf aus dem Beutel hervor und zeigte ihn ihnen. Sie sagte zu ihnen: »Seht, der Kopf des Holofernes, des Oberbefehlshabers des Heeres von Assur! Und seht, das Moskitonetz, unter dem er in seinem Rausch lag. Der Herr hat ihn durch die Hand einer Frau erschlagen.«'
  rationale: 'Die Revision beseitigt eine im Deutschen missverständliche Konstruktion, ohne zusätzlichen Handlungsinhalt einzuführen: Das griechische »den Kopf aus dem Beutel zeigen« wird als Hervorholen und Vorzeigen ausgedrückt. Außerdem wird Ἀσσούρ als »Assur« und dessen Genitivbeziehung zu δύναμις als »Heer von Assur« unmittelbarer wiedergegeben. Die wiederholte Schauaufforderung, das Moskitonetz, die Trunkenheit sowie die göttliche Handlung »durch die Hand einer Frau« bleiben erhalten.'
