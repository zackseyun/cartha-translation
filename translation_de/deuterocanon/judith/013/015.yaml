  yaml_path: translation/deuterocanon/judith/013/015.yaml
  text: And coming forward, she showed them the head from the bag and said to them, “Look, the head of Holofernes, the commander-in-chief of the army of Asshur; and look, the canopy under which he was lying in his drunkenness. And the Lord struck him down by the hand of a woman.”
translation:
  language: de
  text: 'Dann trat sie vor, holte den Kopf aus dem Beutel hervor und zeigte ihn ihnen. Sie sagte zu ihnen: »Seht, der Kopf des Holofernes, des Oberbefehlshabers des Heeres von Assur! Und seht, das Moskitonetz, unter dem er in seinem Rausch lag. Der Herr hat ihn durch die Hand einer Frau erschlagen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προελθοῦσα
  choice: trat sie vor
  rationale: Gibt die Vorwärtsbewegung des Partizips natürlich und präzise wieder.
- source_word: πήρας
  choice: Beutel
  rationale: Ein allgemein verständlicher Ausdruck für eine tragbare Tasche beziehungsweise einen Sack.
- source_word: ἀρχιστρατήγου δυνάμεως Ἀσσούρ
  choice: Oberbefehlshabers des assyrischen Heeres
  rationale: ἀρχιστράτηγος bezeichnet den höchsten Heerführer; Ἀσσούρ wird hier idiomatisch auf das assyrische Heer bezogen.
- source_word: κωνώπιον
  choice: Moskitonetz
  rationale: Das Wort bezeichnet ursprünglich ein gegen Mücken schützendes Netz über dem Lager; diese konkrete Bedeutung wird gegenüber dem allgemeineren »Baldachin« bewahrt.
- source_word: ἐν ταῖς μέθαις αὐτοῦ
  choice: in seinem Rausch
  rationale: Die idiomatische Singularform gibt den Zustand der Trunkenheit klar wieder.
- source_word: ἐπάταξεν
  choice: erschlagen
  rationale: Bewahrt die gewaltsame, tödliche Bedeutung des Verbs im Kontext.
- source_word: ἐν χειρὶ θηλείας
  choice: durch die Hand einer Frau
  rationale: Erhält das auffällige biblische Handlungsidiom und die Betonung des weiblichen Werkzeugs.
theological_decisions:
- issue: Göttliche und menschliche Urheberschaft
  choice: Der Herr hat ihn durch die Hand einer Frau erschlagen
  alternative: Eine Frau hat ihn mit der Hilfe des Herrn erschlagen
  rationale: Die gewählte Fassung bewahrt die ausdrückliche Zuschreibung der Tat an den Herrn und zugleich Judiths Rolle als menschliches Werkzeug, ohne die Spannung erklärend aufzulösen.
- issue: Bezeichnung Gottes
  choice: der Herr
  alternative: JHWH
  rationale: ὁ κύριος wird entsprechend dem griechischen Ausgangstext direkt als »der Herr« wiedergegeben.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter, feierlicher Rede. »Seht« erhält den wiederholten demonstrativen Nachdruck von ἰδού; »Moskitonetz« ist konkret und quellennah, auch wenn »Baldachin« traditioneller klingt.
