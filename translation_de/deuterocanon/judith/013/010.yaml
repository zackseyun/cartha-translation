base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/010.yaml
  text: And she struck his neck twice with all her strength[a], and removed his head, and rolled his body off the bed[b], and took the canopy down from the posts.
translation:
  language: de
  text: Und sie schlug ihm zweimal mit aller ihrer Kraft gegen den Hals und nahm ihm den Kopf ab.[a] Sie rollte seinen Körper vom Bett herunter und nahm das Mückennetz[b] von den Pfosten ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bedeutet wörtlich „wegnehmen“ oder „entfernen“; dem Zusammenhang nach enthauptete sie ihn.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann ein Mückennetz oder einen Betthimmel bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάταξεν εἰς τὸν τράχηλον αὐτοῦ
  choice: schlug ihm … auf den Nacken
  rationale: πατάσσω bezeichnet einen kräftigen Schlag; εἰς mit dem Ziel des Schlages wird im Deutschen natürlich mit „auf den Nacken“ wiedergegeben.
- source_word: δὶς ἐν τῇ ἰσχύϊ αὐτῆς
  choice: zweimal mit ganzer Kraft
  rationale: δὶς bedeutet „zweimal“. Die instrumentale Wendung ἐν τῇ ἰσχύϊ αὐτῆς bezeichnet die eingesetzte Kraft; „mit ganzer Kraft“ ist idiomatisches, verständliches Deutsch.
- source_word: ἀφεῖλεν τὴν κεφαλὴν αὐτοῦ
  choice: nahm ihm den Kopf ab
  rationale: ἀφαιρέω bedeutet grundsätzlich „wegnehmen, entfernen“. Die Formulierung bewahrt diese lexikalische Gestalt, während der Zusammenhang die Enthauptung eindeutig erkennen lässt.
- source_word: ἀπεκύλισεν τὸ σῶμα αὐτοῦ ἀπὸ τῆς στρωμνῆς
  choice: rollte sie seinen Körper vom Bett
  rationale: ἀποκυλίω bezeichnet ein Wegrollen; σῶμα ist „Körper“, und στρωμνή bezeichnet hier das Bett oder Lager. Die gewählte Fassung ist nah am Griechischen und zugleich natürlich.
- source_word: ἀφεῖλε τὸ κωνώπιον ἀπὸ τῶν στύλων
  choice: nahm das Mückennetz von den Pfosten ab
  rationale: κωνώπιον bezeichnet seinem Wortgebrauch nach ein Mückennetz, kann im Kontext aber auch als Betthimmel verstanden werden. στῦλοι sind die tragenden Pfosten.
theological_decisions:
- issue: Explizitheit der Enthauptung in der Erzählung
  choice: nahm ihm den Kopf ab
  alternative: schlug ihm den Kopf ab
  rationale: Das allgemeinere Verb ἀφαιρέω sagt wörtlich, dass der Kopf entfernt beziehungsweise abgenommen wurde; der Zusammenhang macht die Enthauptung klar. Die Übersetzung vermeidet es, ein spezielleres griechisches Verb vorauszusetzen.
translation_notes:
  register: Modernes, klares und würdiges ErzählDeutsch. Die knappe Folge der Handlungen bleibt erhalten; ein „Dann“ gliedert den langen griechischen Satz, ohne seine Abfolge zu verändern. Die Fußnoten stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
