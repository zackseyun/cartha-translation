  naturalness: Die überarbeitete Fassung ist modernes, klares Standarddeutsch und bewahrt die knappe Reihung des griechischen Erzählstils. „Gegen den Hals“ ist hier natürlicher und sachlich genauer als „auf den Nacken“.
  terminology: „Den Kopf abnehmen“ bewahrt die allgemeinere Wortwahl von ἀφαιρέω, ohne den durch den Kontext eindeutigen Vorgang zu verschleiern. „Körper“, „Bett“, „Mückennetz“ und „Pfosten“ sind angemessene Wiedergaben; die Fußnote hält die mögliche Bedeutung „Betthimmel“ offen.
