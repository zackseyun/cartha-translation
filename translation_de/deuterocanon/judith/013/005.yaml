base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/005.yaml
  text: And they all went away from his presence[a], and no one was left in the bedroom, from the least to the greatest.
translation:
  language: de
  text: Da gingen alle aus seiner Gegenwart fort[a], und niemand blieb im Schlafgemach zurück, vom Geringsten bis zum Größten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Angesicht“; das Griechische nennt hier kein Possessivpronomen.'
    reason: Die Fußnote gibt die griechische Wendung genauer wieder und macht die kontextbedingte Ergänzung „seiner“ transparent.
lexical_decisions:
- source_word: ἀπῆλθοσαν
  choice: gingen … fort
  rationale: Der Aorist von ἀπέρχομαι bezeichnet das Weggehen; „gingen fort“ ist natürliches, klares Deutsch.
- source_word: ἐκ προσώπου
  choice: aus seiner Gegenwart
  rationale: Die Wendung lautet wörtlich „vom Angesicht“ und bezeichnet idiomatisch das Fortgehen aus der Gegenwart einer Person. Das im Griechischen nicht ausdrücklich genannte Possessivpronomen wird aus dem Zusammenhang ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: οὐδεὶς κατελείφθη
  choice: niemand blieb … zurück
  rationale: Die passive Form von καταλείπω besagt, dass keine Person zurückgelassen beziehungsweise zurückgeblieben war; die deutsche Formulierung ist idiomatisch und wahrt den Sinn.
- source_word: ἐν τῷ κοιτῶνι
  choice: im Schlafgemach
  rationale: κοιτών bezeichnet einen privaten Schlafraum. „Schlafgemach“ passt zum erzählerischen und historischen Kontext, ohne unverständlich zu sein.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: vom Geringsten bis zum Größten
  rationale: Die umfassende Paarformel bezieht alle ohne Ausnahme ein und lässt, anders als eine altersbezogene Wiedergabe, Rang oder gesellschaftliche Stellung offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht erzählerischem Ton. „Schlafgemach“ wahrt den privaten Charakter des Raumes; die Rangformel bleibt als Merismus erhalten.
