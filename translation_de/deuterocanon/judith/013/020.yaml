revisions:
- from: 'Und Gott möge dir dies zu ewiger Ehre[a] gereichen lassen und dich mit Gutem bedenken, weil du dein Leben angesichts der Erniedrigung unseres Volkes nicht geschont hast, sondern unserem Fall entgegengetreten und vor unserem Gott auf geradem Weg gegangen bist. Und das ganze Volk sagte: »So sei es, so sei es!«[b]'
  to: 'Und Gott möge dies alles für dich zu ewiger Ehre werden lassen, um dich mit Gutem zu bedenken, weil du dein Leben wegen der Erniedrigung unseres Volkes nicht geschont hast, sondern unserem Fall entgegengetreten bist und vor unserem Gott den geraden Weg gegangen bist. Und das ganze Volk sagte: »So sei es, so sei es!«[b]'
  rationale: Die Fassung wird behutsam korrigiert, um das kollektive αὐτά („dies alles“), die Anbindung des Infinitivs τοῦ ἐπισκέψασθαι und den kausalen Sinn von διά präziser wiederzugeben. Die schwierige dative Verbindung bei ἐπεξῆλθες πτώματι ἡμῶν bleibt mit „unserem Fall entgegengetreten“ zurückhaltend und kontextgerecht. Fußnote a bleibt inhaltlich sinnvoll, muss aber im Text an „Ehre“ verankert werden.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Aussage wird überwiegend zutreffend wiedergegeben. Eine Revision ist jedoch angezeigt: αὐτά ist plural bzw. kollektiv und sollte nicht schlicht als „dies“ stehen; der final geprägte Infinitiv τοῦ ἐπισκέψασθαι sollte syntaktisch sichtbar an Gottes Handeln gebunden bleiben. „Wegen“ gibt διά genauer wieder als „angesichts“. Die schwierige Wendung ἐπεξῆλθες πτώματι ἡμῶν kann vorsichtig als Eintreten gegen den Untergang des Volkes wiedergegeben werden, ohne einen nicht genannten Gegner einzutragen.'
  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. „Dies alles für dich zu ewiger Ehre werden lassen“ ist idiomatischer als „dir dies zu ewiger Ehre gereichen lassen“ und verdeutlicht zugleich die Satzrelation. „Den geraden Weg gegangen“ klingt im Deutschen natürlicher als „auf geradem Weg gegangen“.
  terminology: „Ehre“ ist als idiomatische Wiedergabe der Höhenmetapher vertretbar, solange die Fußnote „Erhöhung/Höhe“ bietet. „Mit Gutem bedenken“ gibt die wohltätige göttliche Zuwendung angemessen wieder. „So sei es, so sei es“ bewahrt die Wunschform von Γένοιτο; „Amen, amen“ bleibt als liturgische Alternative vermerkt.
  issues:
  - severity: medium
    issue: „dies“ gibt αὐτά ohne kollektive oder plurale Markierung wieder.
    rationale: Das griechische Neutrum Plural bezieht sich auf Judiths Taten bzw. das Geschehene. „dies alles“ wahrt den kollektiven Plural natürlich.
  - severity: medium
    issue: Die Verbindung „und dich mit Gutem bedenken“ nivelliert die Konstruktion τοῦ ἐπισκέψασθαί σε ἐν ἀγαθοῖς.
    rationale: Der Infinitiv gehört zum göttlichen Handeln und ist zweck- bzw. resultatsbezogen. „um dich mit Gutem zu bedenken“ macht diese Bindung transparent.
  - severity: low
    issue: „angesichts der Erniedrigung“ ist weniger eindeutig kausal als διά.
    rationale: „Wegen der Erniedrigung“ entspricht dem ausdrücklich genannten Beweggrund genauer.
  revised_text: 'Und Gott möge dies alles für dich zu ewiger Ehre werden lassen, um dich mit Gutem zu bedenken, weil du dein Leben wegen der Erniedrigung unseres Volkes nicht geschont hast, sondern unserem Fall entgegengetreten bist und vor unserem Gott den geraden Weg gegangen bist. Und das ganze Volk sagte: »So sei es, so sei es!«[b]'
