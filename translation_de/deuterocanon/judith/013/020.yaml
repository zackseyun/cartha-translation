base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/020.yaml
  text: And may God make these things for you into everlasting exaltation[a], to visit you with good things, because you did not spare your life on account of the humiliation of our people, but went out against our fallen condition, having walked straight before our God. And all the people said, “Amen, amen.”
translation:
  language: de
  text: 'Und Gott möge dies alles für dich zu ewiger Ehre werden lassen, um dich mit Gutem zu bedenken, weil du dein Leben wegen der Erniedrigung unseres Volkes nicht geschont hast, sondern unserem Fall entgegengetreten bist und vor unserem Gott den geraden Weg gegangen bist. Und das ganze Volk sagte: »So sei es, so sei es!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: »Amen, amen!«'
    reason: „Amen“ gibt die liturgische Funktion der doppelten Zustimmung wieder; „So sei es“ entspricht der griechischen Wunschform genauer.
lexical_decisions:
- source_word: ποιήσαι σοι αὐτὰ ὁ θεὸς εἰς ὕψος αἰώνιον
  choice: Gott möge dir dies zu ewiger Ehre gereichen lassen
  rationale: Der Wunschcharakter wird mit „möge“ wiedergegeben. Das idiomatische „zu ewiger Ehre gereichen lassen“ vermittelt die bleibende Erhöhung, die das griechische Bild der ewigen Höhe ausdrückt; die wörtlichere Bildsprache bleibt in einer Fußnote erhalten.
- source_word: τοῦ ἐπισκέψασθαί σε ἐν ἀγαθοῖς
  choice: und dich mit Gutem bedenken
  rationale: ἐπισκέπτομαι bezeichnet hier Gottes fürsorgliche Zuwendung. „Mit Gutem bedenken“ ist im Deutschen natürlich und bewahrt den offenen Umfang der göttlichen Wohltaten, ohne ihn auf einen bestimmten Segen festzulegen.
- source_word: οὐκ ἐφείσω τῆς ψυχῆς σου
  choice: du dein Leben ... nicht geschont hast
  rationale: ψυχή meint in diesem Gefahrenzusammenhang Judiths Leben. Die deutsche Wendung gibt sowohl ihren Einsatz als auch das eingegangene Todesrisiko klar wieder.
- source_word: διὰ τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  choice: angesichts der Erniedrigung unseres Volkes
  rationale: ταπείνωσις bezeichnet Erniedrigung oder Demütigung; γένος ist hier die Volksgemeinschaft. „Angesichts“ macht den Beweggrund verständlich, ohne eine unnatürliche deutsche Verknüpfung mit „nicht geschont“ zu erzeugen.
- source_word: ἐπεξῆλθες πτώματι ἡμῶν
  choice: unserem Fall entgegengetreten
  rationale: Die schwierige Verbindung kann ein Vorgehen gegen etwas oder ein Ausziehen aufgrund davon bezeichnen. „Entgegengetreten“ wahrt die adversative Stoßrichtung von ἐπέρχομαι mit Dativ, während „Fall“ die konkrete Metapher von πτῶμα erhält.
- source_word: ἐπ’ εὐθεῖαν πορευθεῖσα ἐνώπιον τοῦ θεοῦ ἡμῶν
  choice: vor unserem Gott auf geradem Weg gegangen bist
  rationale: Die Formulierung bewahrt sowohl das Wegmotiv als auch den ethischen Sinn geraden, richtigen Handelns vor Gott.
- source_word: Γένοιτο, γένοιτο
  choice: So sei es, so sei es!
  rationale: Die Wunschform wird lexikalisch unmittelbar wiedergegeben, und die Wiederholung der gemeinschaftlichen Bekräftigung bleibt erhalten. Die liturgische Entsprechung „Amen“ wird in der Fußnote genannt.
theological_decisions:
- issue: Art der göttlichen Anerkennung Judiths
  choice: ewige Ehre
  alternative: ewige Erhöhung / ewige Höhe
  rationale: Die Übersetzung versteht die Höhenmetapher als bleibende Ehrung, ohne daraus eine genauer definierte Lehre über Judiths jenseitigen Status abzuleiten. Die formnähere Alternative wird offengelegt.
- issue: Antwort des ganzen Volkes auf den Segenswunsch
  choice: So sei es, so sei es!
  alternative: Amen, amen!
  rationale: „So sei es“ erhält die grammatische Wunschbedeutung von γένοιτο und die doppelte Bekräftigung. „Amen“ ist die sachlich passende liturgische Entsprechung, wird aber nicht anstelle der griechischen Form in den Haupttext gesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem langen griechischen Periodensatz behutsam geglättet. Bildhafte oder semantisch strittige Wendungen wurden entweder im Haupttext erhalten („Fall“, „gerader Weg“) oder durch knappe Fußnoten transparent gemacht.
