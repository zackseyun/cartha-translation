  yaml_path: translation/deuterocanon/judith/013/017.yaml
  text: And all the people were greatly astonished[a], and bowing down they worshiped God and said with one accord, “Blessed are you, our God, who today have brought the enemies of your people to nothing.”
translation:
  language: de
  text: 'Da geriet das ganze Volk in großes Staunen. Sie verneigten sich tief, beteten Gott an und sagten einmütig: »Gepriesen seist du, unser Gott, der du heute die Feinde deines Volkes zunichtegemacht hast[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gering gemacht hast« beziehungsweise »für nichts erachtet hast«. Das griechische Verb kann sowohl ausdrücken, dass jemand bedeutungslos gemacht oder zugrunde gerichtet wird, als auch, dass man ihn für nichts achtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστη … σφόδρα
  choice: geriet … in großes Staunen
  rationale: Die Verbindung bezeichnet eine heftige Reaktion des Staunens. Die deutsche Wendung gibt sowohl die Stärke des Verbs als auch die Verstärkung durch σφόδρα natürlich wieder.
- source_word: κύψαντες
  choice: verneigten sich tief
  rationale: Das Partizip beschreibt das körperliche Niederbeugen. „Sich tief verneigen“ ist im Zusammenhang der anschließenden Anbetung klar und idiomatisch.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: beteten Gott an
  rationale: Da Gott das Objekt der Handlung ist, bezeichnet das Verb hier eindeutig religiöse Verehrung. Die körperliche Gebärde wird bereits durch κύψαντες ausgedrückt.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Das Adverb betont die gemeinsame Haltung und den übereinstimmenden Willen des Volkes, nicht nur gleichzeitiges Sprechen.
- source_word: Εὐλογητὸς εἶ
  choice: Gepriesen seist du
  rationale: Die Formulierung bewahrt die direkte, feierliche Lobpreisung Gottes. Sie ist im Deutschen natürlicher als eine rein feststellende Wiedergabe.
- source_word: ἐξουδενώσας
  choice: zunichtegemacht hast
  rationale: Im Zusammenhang des Sieges bezeichnet das Verb die Demütigung und Ausschaltung der Feinde. Da es auch „für nichts achten“ oder „gering machen“ bedeuten kann, wird die Bedeutungsbreite in einer Fußnote offengelegt.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: heute
  rationale: „Heute“ gibt die idiomatische griechische Zeitangabe in modernem Deutsch knapp und vollständig wieder.
- source_word: τοὺς ἐχθροὺς τοῦ λαοῦ σου
  choice: die Feinde deines Volkes
  rationale: Die Wiedergabe entspricht der bestimmten Bezeichnung der Gegner und bewahrt die Beziehung Gottes zu seinem Volk.
theological_decisions:
- issue: Form der gemeinsamen Antwort des Volkes an Gott
  choice: 'Direkte Lobpreisung: „Gepriesen seist du, unser Gott“'
  alternative: 'Feststellung in der dritten Person: „Gepriesen ist unser Gott“'
  rationale: Das griechische εἶ steht in der zweiten Person und kennzeichnet die Worte als unmittelbare Anrede Gottes.
- issue: Wirkung des göttlichen Handelns an den Feinden
  choice: „zunichtegemacht“ mit offengelegter lexikalischer Alternative
  alternative: „verachtet“ oder „gering gemacht“
  rationale: Der Siegeszusammenhang legt eine wirksame Erniedrigung beziehungsweise Ausschaltung der Feinde nahe; die griechische Form kann jedoch auch das Behandeln als bedeutungslos ausdrücken, weshalb diese Spannung nicht verschwiegen wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht feierlichem Ton. Die Erzählung bleibt flüssig; die direkte Gottesrede behält ihre doxologische Form. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
