  yaml_path: translation/deuterocanon/judith/013/018.yaml
  text: And Uzziah said to her[a], “Blessed are you, daughter, by the Most High God above all the women on the earth,”
translation:
  language: de
  text: 'Und Usija sagte zu ihr: »Gesegnet bist du, Tochter, von Gott, dem Höchsten, mehr als alle Frauen auf der Erde.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gesegnet bist du, Tochter, vor Gott, dem Höchsten, mehr als alle Frauen auf der Erde.« Der griechische Dativ nach »gesegnet« lässt sich unterschiedlich auffassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὴ
  choice: Gesegnet bist du
  rationale: Das prädikative Adjektiv in direkter Anrede wird als feierlicher Segensspruch wiedergegeben; die Formulierung ist natürlich und bewahrt den benediktorischen Charakter.
- source_word: θυγάτηρ
  choice: Tochter
  rationale: Der Vokativ wird ohne ergänztes Possessivpronomen wiedergegeben, da im Griechischen kein »meine« steht.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: von Gott, dem Höchsten
  rationale: Der Dativ wird als Urheber beziehungsweise Bezugsgröße des Gesegnetseins verstanden. Die Apposition »dem Höchsten« folgt der griechischen Wortfügung und ist im Deutschen idiomatisch.
- source_word: παρὰ πάσας τὰς γυναῖκας
  choice: mehr als alle Frauen
  rationale: παρά mit Akkusativ hat hier vergleichende Bedeutung und bezeichnet ein Übertreffen; »mehr als« gibt diese Vergleichskraft unmittelbar wieder.
- source_word: τὰς ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die Wendung bezeichnet allgemein die auf der Erde lebenden Frauen und wird nicht auf ein bestimmtes Land eingeengt.
- source_word: Ὀζίας
  choice: Usija
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Namensform wird gegenüber der griechisch-lateinischen Form »Ozias« bevorzugt.
theological_decisions:
- issue: Bedeutung der Segensformel mit dem Dativ τῷ θεῷ τῷ ὑψίστῳ
  choice: Judith wird als von Gott, dem Höchsten, gesegnet bezeichnet.
  alternative: Judith wird als vor Gott, dem Höchsten, gesegnet bezeichnet.
  rationale: Syntax und Zusammenhang sprechen dafür, dass die Aussage Judiths Gesegnetsein in Beziehung zu Gott beschreibt, nicht dass Judith ihrerseits Gott segnet. Da der Dativ die genaue Beziehung jedoch nicht völlig eindeutig festlegt, wird die mögliche Lesart »vor Gott« in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einer klaren, mündlich verständlichen Segensformel. Die Anrede »Tochter« bleibt knapp und ohne nicht belegtes Possessivpronomen; die echte Mehrdeutigkeit des griechischen Dativs wird durch die Fußnote offengehalten.
