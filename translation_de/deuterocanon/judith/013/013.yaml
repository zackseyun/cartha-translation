base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/013.yaml
  text: And they all ran together[a], from the least to the greatest among them, because it seemed astonishing to them that she had come; and they opened the gate and welcomed them. After lighting a fire for light, they gathered around them.
translation:
  language: de
  text: Da liefen sie alle zusammen, vom Geringsten bis zum Größten unter ihnen; denn für sie war es höchst erstaunlich, dass sie gekommen war. Sie öffneten das Tor und hießen sie[a] willkommen. Dann entzündeten sie ein Feuer, das Licht spenden sollte, und scharten sich um sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „sie“ sind Judit und ihre Begleiterin gemeint.
    reason: Das griechische feminine Pluralpronomen bezeichnet beide Frauen, während die deutsche Pronomenform für sich genommen mehrdeutig sein kann.
lexical_decisions:
- source_word: συνέδραμον
  choice: liefen sie alle zusammen
  rationale: Die Form bezeichnet ein eiliges Zusammenlaufen aus verschiedenen Richtungen; die deutsche Wendung bewahrt sowohl die Bewegung als auch den gemeinschaftlichen Vorgang.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: vom Geringsten bis zum Größten
  rationale: Die feste Spannweite schließt die ganze Gemeinschaft ein, ohne sie einseitig als Altersangabe festzulegen.
- source_word: παράδοξον
  choice: höchst erstaunlich
  rationale: Das Wort bezeichnet etwas, das der Erwartung widerspricht und darum überrascht; die Wiedergabe vermeidet den möglichen negativen Beiklang von „seltsam“.
- source_word: τοῦ ἐλθεῖν αὐτήν
  choice: dass sie gekommen war
  rationale: Der substantivierte Infinitiv benennt den Inhalt beziehungsweise Anlass des Erstaunens; der deutsche dass-Satz gibt dies idiomatisch wieder.
- source_word: ἀπεδέξαντο
  choice: hießen sie willkommen
  rationale: Das Verb meint eine günstige, freundliche Aufnahme und passt zum Öffnen des Tores.
- source_word: ἅψαντες πῦρ
  choice: Dann entzündeten sie ein Feuer
  rationale: Das vorzeitige Partizip bezeichnet eine der anschließenden Handlung vorausgehende Handlung; „dann“ macht die erzählerische Abfolge natürlich deutlich.
- source_word: εἰς φάσιν
  choice: das Licht spenden sollte
  rationale: Die Präpositionalfügung gibt den Zweck des Feuers an. Die Formulierung klingt im modernen Deutsch natürlicher als „zur Beleuchtung“, ohne einen Signal- oder Leuchtfeuerzweck hineinzulesen.
- source_word: περιεκύκλωσαν
  choice: scharten sich um sie
  rationale: Die Wendung erhält das räumliche Umringen, vermeidet im freundlichen Empfangskontext aber den unnötig bedrohlichen Klang von „umzingelten“.
- source_word: αὐτάς
  choice: sie
  rationale: Das feminine Pluralpronomen verweist auf Judit und ihre Begleiterin. Das deutsche Pronomen bleibt formal knapp; eine Fußnote klärt den Bezug.
