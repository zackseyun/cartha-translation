base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/003.yaml
  text: But Judith was left alone in the tent[a], and Holofernes had collapsed on his bed[b], for the wine had overwhelmed him.
translation:
  language: de
  text: Judith aber blieb allein im Zelt zurück, und Holofernes war vornüber auf sein Bett gesunken[a]; denn der Wein hatte ihn überwältigt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war vornüber auf seine Liege gefallen“. Das griechische Partizip bezeichnet sowohl den vorausgegangenen Fall als auch den daraus entstandenen Zustand.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher etwa: „denn der Wein hatte sich um ihn ergossen“. Die ungewöhnliche griechische Wendung beschreibt hier, wie völlig ihn der Wein beherrschte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθη
  choice: blieb … zurück
  rationale: Der Aorist Passiv bezeichnet Judith als diejenige, die nach dem Weggang der anderen allein zurückblieb. Die deutsche Wendung ist natürlich und bewahrt die erzählerische Situation.
- source_word: μόνη
  choice: allein
  rationale: Das Wort betont, dass Judith ohne weitere Person im Zelt war.
- source_word: σκηνῇ
  choice: Zelt
  rationale: Im militärischen Lager ist dies die klare und sachgerechte Wiedergabe von σκηνή.
- source_word: προπεπτωκώς
  choice: war vornüber … gesunken
  rationale: Das Perfektpartizip beschreibt einen vorausgegangenen Fall und den daraus bestehenden Zustand. „Vornüber … gesunken“ gibt die Richtung von προπίπτω genauer wieder, ohne zwingend eine Bauchlage zu behaupten.
- source_word: κλίνην
  choice: Bett
  rationale: κλίνη kann Bett oder Liege bedeuten; „Bett“ ist hier im Deutschen verständlich und dem Kontext angemessen.
- source_word: περικεχυμένος
  choice: hatte ihn überwältigt
  rationale: Die wörtliche Vorstellung des Umgossen- oder Umflossenseins wäre im Deutschen missverständlich. Im Zusammenhang bezeichnet die Form idiomatisch, dass der Wein Holofernes völlig in seine Gewalt gebracht hatte.
- source_word: οἶνος
  choice: der Wein
  rationale: Die Wiedergabe erhält den Wein entsprechend dem griechischen Satz als grammatisches und bildhaft handelndes Subjekt.
