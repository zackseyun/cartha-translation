  register: Moderne, würdevolle Erzählsprache. „Judith aber“ setzt den Gegensatz zum Weggang der übrigen Personen; „vornüber … gesunken“ wahrt die konkrete Bildlichkeit des Griechischen, während „überwältigt“ die idiomatische Aussage über die Wirkung des Weins verständlich wiedergibt.
