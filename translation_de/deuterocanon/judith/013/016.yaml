base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/016.yaml
  text: And as the Lord lives, who guarded me on the way by which I went, my face deceived him to his destruction, and he did not commit sin with me, resulting in defilement and shame.
translation:
  language: de
  text: 'Und so wahr der Herr lebt, der mich auf dem Weg, den ich gegangen bin, behütet hat: Mein Gesicht[a] hat ihn zu seinem Verderben getäuscht, und er hat mit mir keine Sünde begangen, die zu Befleckung und Schande geführt hätte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mein Gesicht hat ihn getäuscht“; gemeint ist, dass Judiths äußere Erscheinung Holofernes irreführte.'
    reason: Die wörtlich bewahrte, bildhafte Formulierung kann im Deutschen missverstanden werden und wird daher knapp erläutert.
lexical_decisions:
- source_word: ζῇ Κύριος
  choice: so wahr der Herr lebt
  rationale: Gibt die griechische Schwurformel idiomatisch, feierlich und in modernem Standarddeutsch wieder.
- source_word: διεφύλαξέν με
  choice: mich … behütet hat
  rationale: Bewahrt den Sinn von Schutz und Bewahrung; „behüten“ passt zum göttlichen Schutz auf Judiths Weg.
- source_word: ἐν τῇ ὁδῷ μου ᾗ ἐπορεύθην
  choice: auf dem Weg, den ich gegangen bin
  rationale: Erhält das konkrete Wegmotiv und den Relativsatz, ohne „Weg“ als Auftrag oder Mission auszudeuten.
- source_word: ἠπάτησεν αὐτὸν τὸ πρόσωπόν μου
  choice: Mein Gesicht hat ihn … getäuscht
  rationale: Folgt der auffälligen griechischen Formulierung, in der „mein Gesicht“ ausdrücklich Subjekt ist; gemeint ist im Zusammenhang Judiths äußere Erscheinung.
- source_word: εἰς ἀπώλειαν αὐτοῦ
  choice: zu seinem Verderben
  rationale: Gibt die resultative Richtung von εἰς und den starken Sinn von ἀπώλεια knapp wieder.
- source_word: οὐκ ἐποίησεν ἁμάρτημα μετʼ ἐμοῦ
  choice: er hat mit mir keine Sünde begangen
  rationale: Bewahrt das ausdrückliche Substantiv „Sünde“ und die Zurückhaltung des griechischen Textes, ohne die sexuelle Bedeutung unnötig auszuschreiben.
- source_word: εἰς μίασμα καὶ αἰσχύνην
  choice: die zu Befleckung und Schande geführt hätte
  rationale: Stellt den resultativen Sinn in natürlichem Deutsch her. Der Konjunktiv macht deutlich, dass diese Folge gerade nicht eingetreten ist; „Befleckung“ wahrt die moralisch-kultische Färbung von μίασμα.
theological_decisions:
- issue: Wiedergabe von κύριος in der göttlichen Schwurformel
  choice: Herr
  alternative: Gebieter
  rationale: κύριος bezeichnet hier Gott in einer feierlichen Schwurformel; „Herr“ ist die sachgemäße und etablierte Wiedergabe.
- issue: Sexueller Bezug von „keine Sünde mit mir begangen“
  choice: Die allgemeinere Formulierung des Ausgangstextes bleibt erhalten.
  alternative: „er hat mich nicht geschändet“ oder „er hatte keinen sündhaften Verkehr mit mir“
  rationale: Der Kontext legt den sexuellen Bezug nahe, doch der griechische Wortlaut formuliert allgemeiner. Die Übersetzung wahrt diese Zurückhaltung und lässt „Befleckung und Schande“ die Art der drohenden Folge andeuten.
- issue: Bezug von εἰς μίασμα καὶ αἰσχύνην
  choice: Als nicht eingetretene Folge der Sünde wiedergegeben
  alternative: 'Wörtlicher und syntaktisch offener: „zu Befleckung und Schande“'
  rationale: Die Wendung hängt am unmittelbar vorausgehenden Sündigen. Der Relativsatz ist im Deutschen verständlicher, ohne festzulegen, ob Befleckung und Schande ausschließlich Judith oder allgemeiner das Geschehen betroffen hätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schwurformel bleibt feierlich; die ungewöhnliche Wendung „mein Gesicht“ wird im Haupttext bewahrt und durch eine Fußnote erklärt. Die sexuelle Dimension wird entsprechend der Zurückhaltung des griechischen Textes nicht ausdrücklich ausformuliert.
