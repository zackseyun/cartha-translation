  text: And she went up to the bed, seized the hair of his head, and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: de
  text: 'Sie trat an das Bett heran, ergriff sein Kopfhaar und sagte: »Stärke mich, Gott Israels, an diesem Tag!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: trat … heran
  rationale: Das Partizip bezeichnet das Herannahen. Die deutsche Wendung gibt die Bewegung zum Bett natürlich und genau wieder.
- source_word: κλίνης
  choice: Bett
  rationale: κλίνη kann Bett oder Liege bezeichnen; im unmittelbaren Erzählzusammenhang ist »Bett« die klare und natürliche Wiedergabe.
- source_word: ἐδράξατο
  choice: ergriff
  rationale: Das Medium von δράσσομαι bezeichnet ein festes Zupacken. »Ergriff« bewahrt die Entschlossenheit der Handlung, ohne sie unnötig auszuschmücken.
- source_word: κόμης τῆς κεφαλῆς αὐτοῦ
  choice: sein Kopfhaar
  rationale: »Kopfhaar« gibt die gesamte Genitivverbindung knapp und eindeutig wieder. Das im Deutschen schwerfällige »das Haar seines Kopfes« ist sachlich möglich, aber weniger natürlich.
- source_word: Κραταίωσόν με
  choice: Stärke mich
  rationale: Der Aoristimperativ bittet Gott unmittelbar darum, Judith stark zu machen. »Stärke mich« ist knapp, würdig und gebetssprachlich, ohne altertümlich zu wirken.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Gott Israels
  rationale: Der formal nominativische Ausdruck fungiert als Anrede. Im Deutschen ist »Gott Israels« eine natürliche, feierliche direkte Anrede; ein zusätzliches »o« wäre heute markiert altertümlich.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: an diesem Tag
  rationale: Die Präpositionalphrase bezeichnet den bestimmten gegenwärtigen Tag. »An diesem Tag« wahrt gegenüber dem allgemeineren »heute« die ausdrückliche Formulierung des Griechischen.
theological_decisions:
- issue: Judith ruft Gott im Augenblick einer gewaltsamen Befreiungstat um Stärke an.
  choice: 'Das kurze Gebet wird direkt und feierlich wiedergegeben: »Stärke mich, Gott Israels, an diesem Tag!«'
  alternative: »Gib mir heute Kraft, Gott Israels!«
  rationale: Der Text verbindet die Bitte um Stärke unmittelbar mit der Anrede an den Gott Israels, ohne die Gewalthandlung theologisch zu erläutern oder zu bewerten. Die Übersetzung lässt diese Spannung bestehen und fügt weder Rechtfertigung noch Abschwächung hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzähl- und Gebetston. Die Wortstellung bleibt flüssig; auf altertümliches »o« und unnötig technische Ausdrücke wird verzichtet.
