lexical_decisions:
- source_word: προσελθοῦσα
  choice: sie trat … heran
  rationale: Das aoristische Partizip bezeichnet die der Haupthandlung vorausgehende Annäherung. Die koordinierte deutsche Formulierung gibt die Handlungsfolge natürlich wieder.
- source_word: κανόνι τῆς κλίνης
  choice: an den Bettpfosten
  rationale: κανών bezeichnet hier einen festen Teil des Bettes; ein Pfosten am Kopfende, an dem die Waffe angebracht sein konnte, passt zum erzählerischen Zusammenhang.
- source_word: πρὸς κεφαλῆς Ὀλοφέρνου
  choice: bei Holofernes’ Kopf
  rationale: Die Formulierung bewahrt den räumlichen Bezug auf den Kopf des Holofernes, ohne ihn unnötig als abstraktes Kopfende des Bettes umzudeuten.
- source_word: καθεῖλε
  choice: nahm … herunter
  rationale: Das Verb bezeichnet hier das Herunternehmen eines Gegenstands von seiner erhöhten oder befestigten Stelle.
- source_word: ἀκινάκην
  choice: Schwert
  rationale: ἀκινάκης meint genauer eine östliche kurze Stich- oder Hiebwaffe. „Schwert“ ist im Haupttext allgemein verständlich; die genauere Bedeutung wird in der Fußnote genannt.
- source_word: ἀπʼ αὐτοῦ
  choice: davon
  rationale: Das Pronomen verweist grammatisch und sachlich auf den Bettpfosten; „davon“ vermeidet im Deutschen die mögliche Verwechslung mit Holofernes.
