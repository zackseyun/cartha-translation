  text: And approaching the bedpost that was at Holofernes’s head[a], she took down his sword from it,
translation:
  language: de
  text: Und sie trat an den Bettpfosten heran, der sich bei Holofernes’ Kopf befand, und nahm sein Schwert[a] davon herunter,
  philosophy: optimal-equivalence
