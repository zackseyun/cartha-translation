  verdict: revise
  source_fidelity: Der Entwurf gibt die militärische Funktion von ἀρχιστρατήγου δυνάμεως, den Zweck des Kommens, den Weg und die Eroberung des Berglands zutreffend wieder. Am Schluss sollte die auffällige griechische Doppelung σὰρξ μία / πνεῦμα ζωῆς jedoch im Deutschen syntaktisch klarer an die Männer Holofernes' gebunden werden. Die Deutung von διαφωνήσει als „fehlen“ bleibt angesichts des Kontextes und der englischen Audit-Spur angemessen, ohne den Vorgang als Tod zu explizieren.
  naturalness: „Kein einziger Leib“ ist zwar verständlich, wirkt in der vorliegenden Stellung nach „von seinen Männern“ aber semantisch und syntaktisch etwas unverbunden. „Keiner seiner Männer wird fehlen, nicht ein einziger Leib und kein Lebenshauch“ bewahrt die absichtlich körperliche, gehobene Bildlichkeit und ist zugleich klarer. „Ich komme zu Holofernes“ ist für das präsentische ἔρχομαι unmittelbarer als „bin auf dem Weg zu“.
  terminology: „Holofernes“, „Oberbefehlshaber“, „Streitkräfte“, „Worte der Wahrheit“, „Bergland“ und „Lebenshauch“ sind angemessen. Die Fußnote soll σάρξ als „Fleisch“ dokumentieren, aber die bildhafte Ausdrucksweise nicht als bloßes, ausschließliches Bedeutungsurteil festlegen.
  issues:
  - severity: low
    issue: Unmittelbarkeit von ἔρχομαι
    rationale: „Auch ich bin auf dem Weg zu“ ist möglich, legt aber stärker als das griechische Präsens nahe, dass Judith bereits unterwegs ist. „Auch ich komme zu“ gibt die unmittelbare Aussage neutraler wieder.
  - severity: medium
    issue: Schlussformulierung und Fußnotenerklärung
    rationale: Die Haupttextformulierung „von seinen Männern kein einziger Leib ... fehlen“ ist im Deutschen holprig. Zudem ist „verloren gehen soll“ in der Fußnote modal und stärker interpretierend, während der griechische Futur eine Zusicherung formuliert. Eine klarere körperliche Parallele im Text und eine zurückhaltendere Fußnote sind vorzuziehen.
