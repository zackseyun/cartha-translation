revisions:
- from: Auch ich bin auf dem Weg zu Holofernes, dem Oberbefehlshaber eurer Streitkräfte, um ihm Worte der Wahrheit zu verkünden. Ich werde ihm den Weg zeigen, auf dem er ziehen und das ganze Bergland unter seine Herrschaft bringen wird; dabei wird von seinen Männern kein einziger Leib und kein Lebenshauch fehlen.[a]
  to: Auch ich komme zu Holofernes, dem Oberbefehlshaber eurer Streitkräfte, um ihm Worte der Wahrheit zu verkünden. Ich werde ihm den Weg zeigen, auf dem er ziehen und das ganze Bergland unter seine Herrschaft bringen wird; keiner seiner Männer wird fehlen, nicht ein einziger Leib und kein Lebenshauch.[a]
  rationale: Die Revision wahrt die unmittelbare Gegenwart von ἔρχομαι und verbessert vor allem die deutsche Anbindung der letzten, im Griechischen bewusst körperlich formulierten Zusicherung. Sie bewahrt die Mehrdeutigkeit von διαφωνήσει durch „fehlen“ und erklärt die metonymische Verwendung von σάρξ lediglich als sprachliche Bildlichkeit, ohne eine weitergehende theologische oder konfessionelle Deutung einzutragen.
  reviewer_model: gpt-5.6-terra
