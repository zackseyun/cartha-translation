base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/013.yaml
  text: And I am coming into the presence of Holofernes[a], the commander-in-chief of your forces, to announce words of truth, and I will show before him the way by which he will go and gain mastery over all the hill country, and not one flesh of his men, nor a breath of life, will be lacking.
translation:
  language: de
  text: Auch ich komme zu Holofernes, dem Oberbefehlshaber eurer Streitkräfte, um ihm Worte der Wahrheit zu verkünden. Ich werde ihm den Weg zeigen, auf dem er ziehen und das ganze Bergland unter seine Herrschaft bringen wird; keiner seiner Männer wird fehlen, nicht ein einziger Leib und kein Lebenshauch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Von seinen Männern wird nicht ein Fleisch und auch kein Lebenshauch fehlen.« Die griechische Formulierung ist auffällig körperlich; „Fleisch“ bezeichnet hier bildhaft einen einzelnen Mann beziehungsweise dessen lebendigen Körper.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ ἔρχομαι
  choice: Auch ich bin auf dem Weg
  rationale: Das präsentische ἔρχομαι bezeichnet Judiths unmittelbar bevorstehende Bewegung zu Holofernes. Die deutsche Wendung ist natürlich und bewahrt den lebendigen Gegenwartsbezug; κἀγώ wird als „Auch ich“ wiedergegeben.
- source_word: εἰς τὸ πρόσωπον Ὀλοφέρνου
  choice: zu Holofernes
  rationale: Die Wendung bezeichnet das Gelangen vor Holofernes beziehungsweise in seine Gegenwart. Im Deutschen gibt „zu Holofernes“ die Bewegungsrichtung natürlich wieder, ohne die griechische Redewendung unverständlich wörtlich abzubilden.
- source_word: ἀρχιστρατήγου δυνάμεως ὑμῶν
  choice: dem Oberbefehlshaber eurer Streitkräfte
  rationale: ἀρχιστράτηγος bezeichnet den höchsten militärischen Befehlshaber; δύναμις meint hier aufgrund des militärischen Zusammenhangs die Streitkräfte.
- source_word: τοῦ ἀναγγεῖλαι ῥήματα ἀληθείας
  choice: um ihm Worte der Wahrheit zu verkünden
  rationale: Der artikulierte Infinitiv drückt den Zweck aus. „Worte der Wahrheit“ bewahrt die gewichtige Genitivverbindung, während „verkünden“ den feierlich-deklarativen Sinn von ἀναγγέλλω vermittelt.
- source_word: δείξω πρὸ προσώπου αὐτοῦ ὁδὸν
  choice: Ich werde ihm den Weg zeigen
  rationale: Die idiomatische deutsche Form erhält das konkrete Bild des Wegweisens; πρὸ προσώπου αὐτοῦ wird als Bezug auf Holofernes verstanden.
- source_word: καθʼ ἣν πορεύσεται
  choice: auf dem er ziehen wird
  rationale: „Ziehen“ passt zum militärischen Fortbewegen und gibt die relative Wegangabe knapp und natürlich wieder.
- source_word: κυριεύσει πάσης τῆς ὀρινῆς
  choice: das ganze Bergland unter seine Herrschaft bringen wird
  rationale: κυριεύω bezeichnet hier das Erlangen von Herrschaft im Zuge eines Feldzugs. ἡ ὀρινή ist die bergige Region, daher „Bergland“.
- source_word: οὐ διαφωνήσει τῶν ἀνδρῶν αὐτοῦ
  choice: von seinen Männern ... wird ... nicht fehlen
  rationale: διαφωνέω hat gewöhnlich den Sinn „nicht übereinstimmen“, kann in dieser Konstruktion jedoch das Fehlen beziehungsweise den Verlust ausdrücken. „Nicht fehlen“ wahrt den ungewöhnlichen griechischen Ausdruck besser als eine ausdrückliche Aussage vom Sterben.
- source_word: σὰρξ μία οὐδὲ πνεῦμα ζωῆς
  choice: kein einziger Leib und kein Lebenshauch
  rationale: σὰρξ μία ist eine körperlich-konkrete Bezeichnung für auch nur einen Mann beziehungsweise Leib. „Leib“ ist im Deutschen verständlicher als „ein Fleisch“, während „Lebenshauch“ die anschauliche Wendung πνεῦμα ζωῆς bewahrt.
theological_decisions:
- issue: Bedeutung von σάρξ in der abschließenden militärischen Zusicherung
  choice: Leib
  alternative: Fleisch
  rationale: σάρξ ist hier nicht anthropologisch oder paulinisch aufgeladen, sondern bezeichnet konkret den lebenden Körper beziehungsweise einen Angehörigen des Heeres. „Leib“ wahrt den körperlichen Sinn, ohne im Deutschen die missverständliche Formulierung „ein Fleisch“ zu erzeugen.
- issue: Reichweite der Zusicherung οὐ διαφωνήσει
  choice: Kein Leib und kein Lebenshauch wird fehlen
  alternative: Keiner seiner Männer wird ums Leben kommen
  rationale: Die gewählte Fassung erhält die doppelte, auffällig körperliche Ausdrucksweise des Griechischen und legt sie nicht stillschweigend ausschließlich als Todesvermeidung aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Erzählton. Die langen griechischen Satzglieder wurden zur besseren Verständlichkeit in zwei Sätze gegliedert. Die ungewöhnliche körperliche Bildsprache am Schluss bleibt im Haupttext erkennbar und wird in der Fußnote wörtlicher dokumentiert.
