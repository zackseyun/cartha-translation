    text: 'Auch: „die Schlucht“ oder „den Bergpass“ (griechisch αὐλών).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν οὕτως
  choice: sie taten es
  rationale: Gibt die bestätigende Erzählformel knapp und natürlich wieder.
- source_word: ἐξῆλθεν
  choice: ging … hinaus
  rationale: Entspricht dem gewöhnlichen Bewegungsverb und passt zum Verlassen der Stadt.
- source_word: παιδίσκη
  choice: Dienerin
  rationale: Bezeichnet Judits weibliche Bedienstete; „Dienerin“ ist im heutigen Deutsch klarer als das altertümliche „Magd“.
- source_word: ἀπεσκόπευον
  choice: blickten ihr nach
  rationale: Das Imperfekt bezeichnet fortgesetztes Beobachten; die deutsche Wendung drückt aus, dass die Männer Judit beim Weggehen weiter im Blick behielten.
- source_word: ἄνδρες τῆς πόλεως
  choice: die Männer der Stadt
  rationale: Formale und geschlechtsspezifisch genaue Wiedergabe der griechischen Wortgruppe.
- source_word: ἕως οὗ κατέβη τὸ ὄρος
  choice: bis sie den Berg hinabgestiegen war
  rationale: Bewahrt die topografische Abwärtsbewegung; das Plusquamperfekt ordnet den Abschluss innerhalb des vergangenen Erzählverlaufs natürlich ein.
- source_word: αὐλών
  choice: Talenge
  rationale: Der Ausdruck kann ein Tal, eine Schlucht oder einen Pass bezeichnen. „Talenge“ bewahrt die topografische Unbestimmtheit besser als das sehr breite „Tal“ und passt zum Verschwinden aus dem Blickfeld.
- source_word: οὐκ ἔτι ἐθεώρουν αὐτήν
  choice: dann konnten sie sie nicht mehr sehen
  rationale: Gibt das Ende des Sichtkontakts in natürlichem modernem Deutsch wieder.
