  text: And they did so. Then Judith went out[a], she and her maid with her; and the men of the city kept watching her until she went down the mountain, until she passed through the valley, and they could no longer see her.
translation:
  language: de
  text: Und sie taten es. Dann ging Judit hinaus, sie selbst und ihre Dienerin mit ihr. Die Männer der Stadt beobachteten sie, bis sie den Berg hinabgestiegen war und das Tal[a] durchquert hatte; dann konnten sie sie nicht mehr sehen.
  philosophy: optimal-equivalence
