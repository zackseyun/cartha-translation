  text: And there was a rush in the camp[a], for her arrival was reported through the tents; and they came and gathered around her as she stood outside the tent of Holofernes, until they announced her to him.
translation:
  language: de
  text: Da entstand im Lager ein Zusammenlaufen, denn durch die Zelte hindurch wurde ihre Ankunft ausgerufen.[a] Sie kamen herbei und scharten sich um sie, während sie vor dem Zelt des Holofernes stand, bis man ihm von ihr Meldung machte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ihre Anwesenheit wurde durch die Zelte hindurch ausgerufen“. Das griechische Verb weist auf die mündliche Verbreitung der Nachricht hin; das Wort für „Ankunft“ kann auch „Anwesenheit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο συνδρομὴ
  choice: da entstand ... ein Zusammenlaufen
  rationale: συνδρομή bezeichnet das eilige Zusammenlaufen einer Menge. „Zusammenlaufen“ bewahrt die körperliche Bewegung, ohne Panik oder Aufruhr in den Text hineinzulesen.
- source_word: ἐν τῇ παρεμβολῇ
  choice: im Lager
  rationale: παρεμβολή bezeichnet hier eindeutig das militärische Lager.
- source_word: διεβοήθη ... ἡ παρουσία αὐτῆς
  choice: ihre Ankunft wurde ... ausgerufen
  rationale: Das Passiv διεβοήθη lässt die stimmliche Verbreitung der Nachricht erkennen; παρουσία ist im Erzählzusammenhang natürlich als Ankunft zu verstehen, kann wörtlicher aber auch „Anwesenheit“ bedeuten.
- source_word: εἰς τὰ σκηνώματα
  choice: durch die Zelte hindurch
  rationale: σκηνώματα sind die Zelte beziehungsweise Zeltunterkünfte des Lagers; die Formulierung gibt die Ausbreitung der Nachricht im Zeltbereich idiomatisch wieder.
- source_word: ἐλθόντες ἐκύκλουν αὐτὴν
  choice: Die Männer kamen herbei und scharten sich um sie
  rationale: Das Partizip ἐλθόντες wird als vorgeordnete Handlung wiedergegeben. ἐκύκλουν bezeichnet ein Sich-im-Kreis-um-sie-Stellen; „scharten sich um sie“ vermeidet einen unbegründet feindseligen Unterton.
- source_word: ὡς ἱστήκει
  choice: während sie ... stand
  rationale: Die stative Form beschreibt Judiths fortdauernde Stellung während des Zusammenströmens.
- source_word: ἔξω τῆς σκηνῆς Ὀλοφέρνου
  choice: vor dem Zelt des Holofernes
  rationale: ἔξω bedeutet wörtlich „außerhalb“. Im Deutschen bezeichnet „vor dem Zelt“ an dieser Stelle natürlich den Standort außerhalb des Eingangs.
- source_word: ἕως προσήγγειλαν αὐτῷ περὶ αὐτῆς
  choice: bis man ihm von ihr Meldung machte
  rationale: Die unbestimmte Wiedergabe mit „man“ entspricht dem nicht näher identifizierten pluralischen Subjekt; „von ihr Meldung machte“ gibt das Berichten über ihre Anwesenheit natürlich und präzise wieder.
