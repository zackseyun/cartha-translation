base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/002.yaml
  text: And she rose from her prostration and called her maid Abra[a], and went down into the house in which she stayed during the days of her Sabbaths and during her festivals[b],
translation:
  language: de
  text: Da stand sie von ihrer Niederwerfung[a] auf, rief ihre Dienerin Abra und ging hinunter in das Haus, in dem sie sich an den Tagen ihrer Sabbate[c] und an ihren Festen aufhielt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von ihrem Fall“. Das griechische Wort kann einen Fall bezeichnen; hier ist wahrscheinlich Judiths niedergeworfene Haltung beim Gebet oder in der Trauer gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Griechischen der Plural „an den Tagen ihrer Sabbate“. Er kann auf die wiederholte Sabbatbeobachtung verweisen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστη ἀπὸ τῆς πτώσεως
  choice: erhob sie sich aus ihrer Niederwerfung
  rationale: ἀνέστη bezeichnet das Aufstehen; πτῶσις kann einen Fall oder das Niederfallen bezeichnen. Im Gebets- und Trauerzusammenhang ist eine bewusst eingenommene, niedergeworfene Haltung am wahrscheinlichsten.
- source_word: ἐκάλεσεν
  choice: rief
  rationale: Das schlichte „rief“ gibt das Verb ohne die stärkere Nuance von „ließ kommen“ oder „befahl zu kommen“ wieder.
- source_word: τὴν Ἄβραν αὐτῆς
  choice: ihre Dienerin Abra
  rationale: Die Überlieferung kann Ἄβρα als Namen verstehen; zugleich hängt die Form mit einer griechischen Bezeichnung für eine persönliche Dienerin zusammen. Die Übersetzung folgt der Namensauffassung und macht die aus dem Zusammenhang erkennbare Funktion deutlich.
- source_word: κατέβη εἰς τὸν οἶκον
  choice: ging hinunter in das Haus
  rationale: Bewahrt sowohl die Abwärtsbewegung von κατέβη als auch die durch εἰς bezeichnete Bewegung in das Haus hinein.
- source_word: ἐν ᾧ διέτριβεν
  choice: in dem sie sich … aufhielt
  rationale: διατρίβω bezeichnet hier ein Verweilen oder Sich-Aufhalten, ohne zwingend einen dauerhaften Wohnsitz auszudrücken.
- source_word: ἐν ταῖς ἡμέραις τῶν σαββάτων
  choice: an den Tagen ihrer Sabbate
  rationale: Die Formulierung wahrt den auffälligen Plural und die kalendarisch wiederkehrende Sabbatbeobachtung, statt ihn zu einem einzelnen Sabbat einzuebnen.
- source_word: ἐν ταῖς ἑορταῖς αὐτῆς
  choice: an ihren Festen
  rationale: „Feste“ ist eine natürliche moderne Wiedergabe der religiösen Festtage; das Possessivpronomen wird entsprechend dem griechischen αὐτῆς erhalten.
theological_decisions:
- issue: Deutung von πτῶσις im Zusammenhang von Gebet und Trauer
  choice: Niederwerfung
  alternative: Fall
  rationale: Der Kontext legt eine Gebetshaltung nahe, doch die lexikalische Möglichkeit eines „Falls“ wird in der Fußnote offengehalten.
- issue: Identität von Ἄβρα
  choice: Abra als Name einer Dienerin
  alternative: ihre Dienerin / ihre Zofe ohne Eigennamen
  rationale: Die Großschreibung der vorgelegten Ausgabe und die konsultierte englische Fassung unterstützen die Namensauffassung; die mögliche appellativische Bedeutung wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Erzählfluss, während „aufhielt“ und „Feste“ allgemein verständlich sind. Auffällige Mehrdeutigkeiten bei πτῶσις und Ἄβρα sowie der Sabbat-Plural werden durch Fußnoten bewahrt.
