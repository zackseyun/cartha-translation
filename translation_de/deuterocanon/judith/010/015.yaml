base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/015.yaml
  text: And they said to her[a], “You have saved your life by hurrying down into the presence of our lord. And now come to his tent[b], and some from among us will escort you until they hand you over into his hands.”
translation:
  language: de
  text: 'Und sie sagten zu ihr: „Du hast dein Leben[a] gerettet, weil du dich beeilt hast, vor unseren Herrn hinabzukommen. Komm nun zu seinem Zelt; einige von uns werden dich begleiten, bis sie dich in seine Hände[b] übergeben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann „Seele“ oder „Leben“ bedeuten; hier ist das gerettete beziehungsweise bewahrte Leben gemeint.
    reason: lexical_alternative
  - marker: b
    text: '„In seine Hände“ bedeutet: in seine Gewalt, Obhut oder Verfügungsgewalt.'
    reason: idiom
lexical_decisions:
- source_word: Σέσωκας τὴν ψυχήν σου
  choice: Du hast dein Leben gerettet
  rationale: Das Perfekt von σῴζω bezeichnet hier eine vollzogene Rettung beziehungsweise Bewahrung. ψυχή meint in diesem Zusammenhang das Leben der Person; „Leben gerettet“ ist im Deutschen natürlich und lexikalisch direkt.
- source_word: σπεύσασα καταβῆναι
  choice: weil du dich beeilt hast, … hinabzukommen
  rationale: Das Partizip kann begleitenden Umstand, Mittel oder Grund ausdrücken. Die kausale Formulierung ist im Kontext natürlich, ohne den Zusammenhang stärker festzulegen als nötig; „hinabzukommen“ bewahrt die Richtungsangabe von καταβῆναι.
- source_word: εἰς πρόσωπον τοῦ κυρίου ἡμῶν
  choice: zu unserem Herrn
  rationale: εἰς πρόσωπον bezeichnet das Kommen vor jemanden beziehungsweise in dessen Gegenwart. Im Deutschen gibt „zu unserem Herrn“ die konkrete Bewegung natürlich wieder; κύριος bezeichnet hier den menschlichen militärischen Vorgesetzten.
- source_word: πρόσελθε ἐπὶ τὴν σκηνὴν αὐτοῦ
  choice: Komm nun zu seinem Zelt
  rationale: σκηνή ist im militärischen Kontext ein Zelt. „Komm zu“ gibt den Imperativ πρόσελθε mit ἐπί idiomatisch wieder.
- source_word: ἀφʼ ἡμῶν προπέμψουσίν σε
  choice: einige von uns werden dich begleiten
  rationale: προπέμπω kann „weitergeleiten“ oder „begleiten“ bedeuten. Die dritte Person Plural zusammen mit ἀφʼ ἡμῶν legt nahe, dass Angehörige der Sprechergruppe Judith weiterbegleiten werden.
- source_word: ἕως παραδῶσίν σε εἰς χεῖρας αὐτοῦ
  choice: bis sie dich in seine Hände übergeben
  rationale: Die konkrete griechische Wendung wird beibehalten. Sie bezeichnet die Übergabe in die Gewalt, Obhut oder Verfügungsgewalt des Befehlshabers.
theological_decisions:
- issue: κύριος als Bezeichnung eines menschlichen Herrschers
  choice: unser Herr
  alternative: unser Gebieter
  rationale: Gemeint ist der menschliche Vorgesetzte der Soldaten, nicht Gott. „Herr“ bewahrt den sozialen Hoheitstitel, ohne durch eine stärker deutende Wiedergabe zusätzliche Härte einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Situation bleibt klar, während die griechischen Bilder „Leben retten“ und „in seine Hände übergeben“ erhalten werden.
