  text: And those attending Holofernes came out[a], and all his servants, and they brought her into the tent.
translation:
  language: de
  text: Da kamen die heraus, die bei Holofernes schliefen, und alle seine Diener, und sie führten sie in das Zelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον
  choice: kamen ... heraus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet eine Bewegung nach draußen; »kamen heraus« entspricht dem natürlichen deutschen Erzählfluss und wahrt die Bewegungsrichtung.
- source_word: οἱ παρακαθεύδοντες Ὀλοφέρνῃ
  choice: die Männer, die bei Holofernes wachten
  rationale: Das Partizip bezeichnet wörtlich diejenigen, die bei Holofernes schliefen oder lagen. Im militärischen Hofkontext ist damit wahrscheinlich sein unmittelbar bei ihm stationierter Wachdienst gemeint. »bei Holofernes wachten« gibt diese Funktion verständlich wieder, während die Fußnote den wörtlichen Sinn bewahrt.
- source_word: θεράποντες
  choice: Diener
  rationale: θεράπων bezeichnet einen Diener oder persönlichen Bediensteten. »Diener« ist hier klar, würdig und kontextgemäß.
- source_word: εἰσήγαγον
  choice: führten ... hinein
  rationale: εἰσάγω bedeutet, jemanden hineinzuführen oder hineinzubringen. »führten sie in das Zelt« bildet den Vorgang und das persönliche Objekt natürlich ab.
- source_word: σκηνήν
  choice: Zelt
  rationale: σκηνή bezeichnet im Heerlager unmittelbar ein Zelt; die direkte deutsche Entsprechung vermeidet die interpretativere und gehobenere Wiedergabe »Pavillon«.
