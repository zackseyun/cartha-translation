  terminology: „aufmerksam betrachteten“ gibt κατενόησαν angemessen wieder. „von außergewöhnlicher Schönheit“ vermittelt die bewundernde, stark intensivierte Aussage von θαυμάσιον … σφόδρα, ohne eine theologisch oder interpretativ aufgeladene Nuance einzutragen.
