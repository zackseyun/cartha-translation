  text: And when the men heard her words and observed her face[b][a], she was exceedingly marvelous in beauty before them.
translation:
  language: de
  text: Als die Männer hörten, was sie sagte, und ihr Gesicht aufmerksam betrachteten,[a] war ihr Gesicht in ihren Augen von außergewöhnlicher Schönheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Gesicht genau betrachteten“; das griechische Verb bezeichnet ein aufmerksames, eingehendes Wahrnehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „war ihr Gesicht vor ihnen überaus wunderbar an Schönheit“; die griechischen Formen beziehen sich auf „ihr Gesicht“ und besagen, dass es in ihren Augen außergewöhnlich schön war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Als … gehört … hatten
  rationale: ὡς mit dem Aorist leitet hier einen temporalen Nebensatz ein; das deutsche Plusquamperfekt macht die Abfolge gegenüber dem folgenden Eindruck natürlich deutlich, ohne besondere Unmittelbarkeit zu behaupten.
- source_word: οἱ ἄνδρες
  choice: die Männer
  rationale: ἄνδρες bezeichnet schlicht Männer. Obwohl der Kontext auf Wachleute weist, wird ihre Funktion im Vers nicht ausdrücklich genannt.
- source_word: τὰ ῥήματα αὐτῆς
  choice: ihre Worte
  rationale: ῥήματα meint ihre gesprochenen Worte oder Äußerungen; „ihre Worte“ ist zugleich quellennah und idiomatisch.
- source_word: κατενόησαν
  choice: aufmerksam betrachtet
  rationale: κατανοέω bezeichnet ein genaues, aufmerksames Wahrnehmen. Mit „Gesicht“ als Objekt gibt „aufmerksam betrachtet“ den bewussten visuellen Vorgang natürlich wieder.
- source_word: τὸ πρόσωπον αὐτῆς
  choice: ihr Gesicht
  rationale: πρόσωπον bedeutet konkret „Gesicht“, auch wenn es erweitert die äußere Erscheinung bezeichnen kann.
- source_word: ἦν ἐναντίον αὐτῶν
  choice: erschien sie ihnen
  rationale: Wörtlich steht, dass sie „vor ihnen“ war. Im Zusammenhang beschreibt die Wendung ihren Eindruck auf die Männer; „erschien sie ihnen“ gibt diesen relationalen Sinn in natürlichem Deutsch wieder.
- source_word: θαυμάσιον τῷ κάλλει σφόδρα
  choice: von außerordentlicher Schönheit
  rationale: θαυμάσιον und σφόδρα drücken gemeinsam höchstes Staunen über ihre Schönheit aus. Die idiomatische deutsche Wendung bewahrt die starke Intensität, ohne eine unbeholfene Wortfolge nachzuahmen.
