- from: Als die Männer ihre Worte gehört und ihr Gesicht aufmerksam betrachtet hatten,[a] erschien sie ihnen von außerordentlicher Schönheit.[b]
  to: Als die Männer hörten, was sie sagte, und ihr Gesicht aufmerksam betrachteten,[a] war ihr Gesicht in ihren Augen von außergewöhnlicher Schönheit.[b]
  rationale: Die Revision stellt den durch die neutrale griechische Kongruenz angezeigten Bezug auf Judiths Gesicht wieder her und beseitigt zugleich eine im Deutschen mögliche Fehlbeziehung von „ihre Worte“. Der zeitliche Aufbau, die aufmerksame Wahrnehmung und die starke Bewunderung der Schönheit bleiben erhalten.
