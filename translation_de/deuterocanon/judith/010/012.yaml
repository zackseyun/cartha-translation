base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/012.yaml
  text: And they seized her and asked her[a], “Who are you, and where are you coming from, and where are you going?” And she said, “I am a daughter of the Hebrews, and I am fleeing from before them[c][b], because they are about to be given over to you for consumption.”
translation:
  language: de
  text: 'Und sie ergriffen sie und fragten sie: »Zu wem gehörst du,[a] woher kommst du und wohin gehst du?« Sie sagte: »Ich bin eine Tochter der Hebräer[b] und fliehe vor ihnen, denn sie werden euch bald zum Fraß[c] ausgeliefert werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Wessen bist du?« Gemeint sein kann die Zugehörigkeit zu einem Volk oder einer politischen Seite.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich bin eine Hebräerin.« Wörtlich: »Ich bin eine Tochter der Hebräer.«'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »zum Verschlingen« beziehungsweise »als Nahrung«. Das griechische Wort bezeichnet etwas, das aufgefressen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέλαβον
  choice: sie ergriffen sie
  rationale: Das Verb bezeichnet hier das körperliche Ergreifen durch Soldaten; „ergriffen“ bewahrt die Plötzlichkeit, ohne bereits eine förmliche Gefangennahme vorauszusetzen.
- source_word: Τίνων εἶ
  choice: Zu wem gehörst du?
  rationale: Der griechische Genitiv Plural bedeutet wörtlich etwa „Wessen bist du?“ und fragt wahrscheinlich nach ethnischer oder politischer Zugehörigkeit. Die deutsche Formulierung ist natürlich und bewahrt diese Mehrdeutigkeit.
- source_word: πόθεν ἔρχῃ
  choice: woher kommst du?
  rationale: Natürliche und richtungsgenaue Wiedergabe der Herkunftsfrage.
- source_word: ποῦ πορεύῃ
  choice: wohin gehst du?
  rationale: „Gehen“ gibt πορεύομαι in diesem Zusammenhang klar und idiomatisch wieder.
- source_word: Θυγάτηρ εἰμὶ τῶν Ἑβραίων
  choice: Ich bin eine Tochter der Hebräer
  rationale: Die wörtliche familiär-ethnische Selbstbezeichnung wird erhalten und nicht zu „Hebräerin“ eingeebnet.
- source_word: ἀποδιδράσκω ἀπὸ προσώπου αὐτῶν
  choice: ich fliehe vor ihnen
  rationale: Das Deutsche „vor jemandem fliehen“ gibt sowohl das Entkommen als auch die Wendung „weg von ihrem Angesicht/ihrer Gegenwart“ natürlich wieder.
- source_word: μέλλουσιν δόσθαι
  choice: sie werden bald … überlassen werden
  rationale: „Bald“ drückt die von μέλλω bezeichnete bevorstehende Handlung aus; das Passiv des griechischen Textes bleibt erhalten.
- source_word: εἰς κατάβρωμα
  choice: zum Fraß
  rationale: Die Wendung bewahrt das drastische Bild des Aufgefressen- oder Verschlungenwerdens und klingt im Deutschen natürlicher als ein abstraktes „zum Verzehr“.
theological_decisions:
- issue: Ethnische Selbstbezeichnung Judits
  choice: Ich bin eine Tochter der Hebräer
  alternative: Ich bin eine Hebräerin
  rationale: Der griechische Text verwendet ausdrücklich θυγάτηρ mit dem Genitiv der Volksgruppe. Die Übersetzung erhält dieses familiäre Zugehörigkeitsbild, ohne zusätzliche konfessionelle Deutung.
- issue: Nicht genannter Handelnder beim Ausliefern
  choice: 'Passiv: „sie werden euch bald … überlassen werden“'
  alternative: „Gott wird sie euch bald überlassen“
  rationale: Der griechische Text nennt den Handelnden nicht. Das Passiv vermeidet, Gott oder einen menschlichen Akteur ausdrücklich einzusetzen und erhält die offene Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist flüssig formuliert; die ungewöhnliche ethnische Wendung „Tochter der Hebräer“ und das drastische Bild „zum Fraß“ bleiben bewusst erhalten.
