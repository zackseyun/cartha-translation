  yaml_path: translation/deuterocanon/judith/010/016.yaml
  text: But if you stand before him, do not be afraid in your heart; instead, report according to your words, and he will treat you well.
translation:
  language: de
  text: Wenn du aber vor ihm stehst, fürchte dich nicht in deinem Herzen. Berichte vielmehr entsprechend deinen Worten, und er wird dich gut behandeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στῇς ἐναντίον αὐτοῦ
  choice: vor ihm stehst
  rationale: Gibt die räumlich-personale Wendung natürlich und nah am Griechischen wieder.
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: fürchte dich nicht in deinem Herzen
  rationale: Bewahrt das ausdrückliche Bild des Herzens als Sitz der inneren Furcht.
- source_word: ἀνάγγειλον κατὰ τὰ ῥήματά σου
  choice: Berichte vielmehr so, wie du es angekündigt hast
  rationale: ἀναγγέλλω bezeichnet hier das Mitteilen bzw. Berichten; κατὰ τὰ ῥήματά σου verweist im Kontext auf Judits zuvor dargelegte Worte beziehungsweise ihren angekündigten Plan.
- source_word: εὖ σε ποιήσει
  choice: dann wird er dich gut behandeln
  rationale: Natürliche deutsche Wiedergabe der idiomatischen Aussage, dass er ihr Gutes tun beziehungsweise wohlwollend mit ihr umgehen wird.
