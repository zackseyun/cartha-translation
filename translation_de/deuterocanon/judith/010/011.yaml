translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Da begegnete“ bildet den Übergang von der fortlaufenden Bewegung zum punktuellen Zusammentreffen natürlich ab; der Fußnotenmarker steht unmittelbar nach der gemeinsamen Wegbeschreibung.
