  text: And they were going straight through the courtyard[a], and an Assyrian advance guard met her.
translation:
  language: de
  text: Und sie gingen geradewegs durch den Hof, und eine Vorwache der Assyrer begegnete ihr[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier „ihr“ im Singular, obwohl es zuvor „sie gingen“ heißt. Damit richtet sich der Blick der Erzählung nun besonders auf Judith.
    reason: Bewahrt und erläutert den auffälligen Wechsel vom Plural zum Singular im griechischen Text.
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: sie gingen
  rationale: Der Imperfekt von πορεύομαι beschreibt den im Gang befindlichen Weg. Im deutschen Erzählstil gibt das Präteritum „gingen“ diesen fortlaufenden Hintergrund natürlich wieder.
- source_word: ἐν τῷ αὐλῶνι
  choice: durch den Hof
  rationale: αὐλών bezeichnet hier einen Hof oder umschlossenen Hofbereich. Bei einem Bewegungsverb gibt „durch den Hof“ die Bewegung innerhalb dieses Bereichs idiomatisch wieder.
- source_word: εἰς εὐθεῖαν
  choice: geradewegs
  rationale: Die adverbiale Wendung bezeichnet eine direkte Bewegung ohne Abweichung. „Geradewegs“ ist knapp, würdevoll und im modernen Deutschen verständlich.
- source_word: συνήντησεν
  choice: begegnete
  rationale: Der Aorist von συναντάω bezeichnet ein Zusammentreffen. „Begegnete“ passt zur deutschen Konstruktion mit dem Dativ αὐτῇ und lässt offen, ob die Vorwache gezielt auf Judith zukam oder unvermittelt auf sie traf.
- source_word: αὐτῇ
  choice: ihr
  rationale: Der feminine Dativ Singular bezieht sich ausdrücklich auf Judith. Die Wiedergabe „ihr“ bewahrt den Wechsel vom pluralischen „sie gingen“ zum singularischen Fokus auf Judith.
- source_word: προφυλακὴ
  choice: Vorwache
  rationale: προφυλακή bezeichnet eine vorausgeschobene Wach- oder Sicherungseinheit. „Vorwache“ bewahrt den militärischen Sinn und legt sich nicht auf einen festen Wachposten fest.
- source_word: τῶν Ἀσσυρίων
  choice: der Assyrer
  rationale: Der Genitiv bezeichnet die Zugehörigkeit der Vorwache. „eine Vorwache der Assyrer“ ist natürlich und näher an der griechischen Form als ein attributives Kompositum.
