base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/009.yaml
  text: And she said to them[a], “Order the gate of the city to be opened for me, and I will go out for the fulfillment of the words that you spoke with me.” So they instructed the young men to open it for her, just as she had said.
translation:
  language: de
  text: 'Und sie sagte zu ihnen: »Gebt den Befehl, mir das Stadttor zu öffnen; dann werde ich hinausgehen, um das zu vollenden, worüber ihr mit mir gesprochen habt.« Da wiesen sie die jungen Männer an, ihr zu öffnen, wie sie gesagt hatten[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb steht im Plural: »wie sie gesprochen hatten«. Im Zusammenhang kann dies die Anweisungen der Männer oder das mit Judit Besprochene zusammenfassend aufnehmen. Die Deutung »wie sie gesagt hatte« versteht die Stelle sinngemäß als Bezug auf Judits Bitte.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπιτάξατε
  choice: Gebt den Befehl
  rationale: Der Aoristimperativ von ἐπιτάσσω verlangt eine verbindliche Anordnung. »Gebt den Befehl« ist im modernen Deutschen klar und wahrt den autoritativen Ton.
- source_word: ἀνοῖξαί μοι τὴν πύλην τῆς πόλεως
  choice: mir das Stadttor zu öffnen
  rationale: Die Infinitivkonstruktion wird natürlich wiedergegeben; »Stadttor« entspricht idiomatisch τὴν πύλην τῆς πόλεως.
- source_word: ἐξελεύσομαι
  choice: werde ich hinausgehen
  rationale: Gibt die zukünftige Bewegung aus der Stadt schlicht und genau wieder.
- source_word: εἰς τελείωσιν τῶν λόγων
  choice: um das zu vollenden
  rationale: τελείωσις bezeichnet Vollendung bzw. Ausführung. Das substantivierte »das« lässt λόγοι kontextgemäß die besprochenen Worte oder Angelegenheiten bezeichnen, ohne eine unnatürliche deutsche Wendung wie »die Worte vollenden« zu erzwingen.
- source_word: ὧν ἐλαλήσατε μετʼ ἐμοῦ
  choice: worüber ihr mit mir gesprochen habt
  rationale: μετʼ ἐμοῦ deutet auf ein Gespräch; »worüber« verbindet die Relativkonstruktion idiomatisch mit den zuvor gemeinten Worten bzw. Angelegenheiten.
- source_word: συνέταξαν
  choice: wiesen sie … an
  rationale: Bezeichnet eine Anordnung an Untergebene und vermeidet zugleich die unmittelbare Wiederholung von »Befehl«.
- source_word: τοῖς νεανίσκοις
  choice: die jungen Männer
  rationale: Direkte und verständliche Wiedergabe von νεανίσκοις; eine speziellere Funktion wie »Wachen« steht nicht ausdrücklich im Text.
- source_word: ἀνοῖξαι αὐτῇ
  choice: ihr zu öffnen
  rationale: Das bereits genannte Stadttor kann im Deutschen ohne Missverständnis ausgelassen werden; der Dativ αὐτῇ bleibt gewahrt.
- source_word: καθὼς ἐλάλησαν
  choice: wie sie gesagt hatten
  rationale: Bewahrt bewusst den Plural des griechischen Wortlauts und damit dessen mögliche Rückverweisung auf das zuvor Besprochene, statt das Subjekt stillschweigend zu Judith umzudeuten.
