  yaml_path: translation/deuterocanon/judith/010/021.yaml
  text: And Holofernes was reclining on his bed under the canopy[a], which was woven with purple, gold, emeralds, and costly stones.
translation:
  language: de
  text: Holofernes ruhte auf seinem Bett unter dem Baldachin[a], der aus Purpur, Gold, Smaragden und kostbaren Steinen gewebt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter dem Moskitonetz“ oder „unter dem Bettvorhang“; das griechische Wort kann eine netzartige oder drapierte Abdeckung über einem Bett bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπαυόμενος
  choice: ruhte
  rationale: Das Partizip bezeichnet Holofernes als ruhend beziehungsweise liegend. „Ruhte“ ist im Deutschen natürlich und legt seine genaue Körperhaltung nicht stärker fest als der griechische Ausdruck.
- source_word: κλίνη
  choice: Bett
  rationale: κλίνη kann Bett oder Liege bedeuten; im privaten Schlafgemach und zusammen mit der darüber befindlichen Abdeckung ist „Bett“ die naheliegende Wiedergabe.
- source_word: κωνώπιον
  choice: Baldachin
  rationale: Das Wort kann ein Moskitonetz oder einen Vorhang beziehungsweise eine Überdachung am Bett bezeichnen. Die kostbare textile Ausgestaltung spricht hier für „Baldachin“; die engere lexikalische Möglichkeit bleibt in der Fußnote erhalten.
- source_word: πορφύρα
  choice: Purpur
  rationale: Der Ausdruck bezeichnet purpurfarbenes Material beziehungsweise Purpurstoff und trägt hier zur Darstellung des Luxus bei.
- source_word: χρυσίον
  choice: Gold
  rationale: „Gold“ gibt den Materialbegriff direkt wieder. „Goldfäden“ wäre wegen des Webkontexts denkbar, würde aber eine im Griechischen nicht ausdrücklich genannte Form des Materials festlegen.
- source_word: σμαράγδος
  choice: Smaragden
  rationale: „Smaragd“ ist die übliche konkrete Wiedergabe des griechischen Edelsteinnamens; der Dativ Plural fügt sich natürlich in die Materialaufzählung ein.
- source_word: λίθων πολυτελῶν
  choice: kostbaren Steinen
  rationale: Die Formulierung bewahrt den Wert- und Luxusakzent von πολυτελής, ohne die Steine technisch genauer als Edelsteine einzuordnen.
- source_word: καθυφασμένων
  choice: gewebt
  rationale: Das Partizip bezeichnet eine textile Verarbeitung, bei der die genannten kostbaren Materialien eingearbeitet sind. „Gewebt“ bleibt näher am griechischen Ausdruck als das ebenfalls mögliche „bestickt“.
