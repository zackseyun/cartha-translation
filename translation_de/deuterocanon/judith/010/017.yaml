  text: And they selected one hundred men from among them, and they escorted her and her maid, and brought them to the tent of Holofernes.
translation:
  language: de
  text: Und sie wählten aus ihrer Mitte hundert Männer aus, die Judit und ihre Dienerin begleiteten und sie zum Zelt des Holofernes brachten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλεξαν ἐξ αὐτῶν
  choice: sie wählten aus ihrer Mitte … aus
  rationale: Die Formulierung gibt sowohl die bewusste Auswahl als auch den partitiven Sinn von ἐξ αὐτῶν natürlich und genau wieder.
- source_word: ἄνδρας ἑκατόν
  choice: hundert Männer
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Zahlenangabe.
- source_word: παρέζευξαν
  choice: begleiteten
  rationale: Das Verb bezeichnet hier das Zugeordnetwerden als Begleitung. „Begleiteten“ ist idiomatisch und vermeidet die stärkere, im Kontext nicht zwingende Vorstellung eines Schutzgeleits.
- source_word: τῇ ἄβρᾳ αὐτῆς
  choice: ihre Dienerin
  rationale: ἄβρα bezeichnet Judits weibliche Hausbedienstete beziehungsweise persönliche Begleiterin; „Dienerin“ ist heute klarer und würdiger als „Magd“.
- source_word: ἤγαγον
  choice: brachten
  rationale: Das Verb bedeutet führen oder bringen; mit dem genannten Ziel ist „brachten“ im Deutschen natürlich.
- source_word: σκηνήν
  choice: Zelt
  rationale: Die Grundbedeutung „Zelt“ passt zum militärischen Lager und vermeidet die unnötig gehobene Wiedergabe „Pavillon“.
- source_word: Ὀλοφέρνου
  choice: Holofernes
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
