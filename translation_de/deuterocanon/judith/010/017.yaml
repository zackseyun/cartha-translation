  source_fidelity: 'Der Text gibt die drei Handlungen des griechischen Satzes sachgerecht wieder: Auswahl von hundert Männern aus der vorhandenen Gruppe, ihre Zuordnung als Begleitung für Judit und ihre Dienerin sowie das Bringen der beiden Frauen zum Zelt des Holofernes. Das Relativpronomen „die“ bezieht sich klar auf die hundert Männer; „sie“ bezeichnet anschließend Judit und ihre Dienerin, entsprechend αὐτάς.'
  naturalness: Der Satz ist modernes, idiomatisches Standarddeutsch. „Aus ihrer Mitte ... aus“ ist trotz der Klammerstellung natürlich und bildet den partitiven Ausdruck ἐξ αὐτῶν präzise ab. „Dienerin“ und „Zelt“ passen zum nüchternen erzählenden Register.
  terminology: „Judit“ und „Holofernes“ sind etablierte deutsche Namensformen. „Dienerin“ trifft ἄβρα angemessen, ohne die altertümliche Färbung von „Magd“ zu erzwingen. Es sind keine theologischen Fachbegriffe oder Fußnotenanker betroffen.
