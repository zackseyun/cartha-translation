  text: And she gave her maid a skin of wine and a flask of oil[a], and she filled a bag with barley meal and cakes of pressed figs and clean loaves; then she wrapped up all her vessels and placed them on her.
translation:
  language: de
  text: Und sie gab ihrer Dienerin einen Weinschlauch und eine Flasche Öl. Dann füllte sie eine Tasche mit Gerstenmehl, Feigenkuchen und reinen Broten[a], verpackte alle ihre Gefäße und lud sie ihrer Dienerin auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kultisch reinen Broten“ beziehungsweise „reinem Brot“. Das Griechische kann Speisen meinen, die unter Beachtung von Reinheitsvorschriften zubereitet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅβρᾳ
  choice: Dienerin
  rationale: Bezeichnet hier Judits weibliche Begleiterin; „Dienerin“ ist im modernen Deutschen klar und legt ihren rechtlichen Status nicht unnötig fest.
- source_word: ἀσκοπυτίνην οἶνον
  choice: einen Weinschlauch
  rationale: Das seltene Kompositum bezeichnet einen ledernen Behälter für Wein. „Weinschlauch“ gibt Gefäß und üblichen Inhalt idiomatisch wieder, ohne das im Deutschen redundante „einen Weinschlauch Wein“.
- source_word: καψάκην ἐλαίου
  choice: eine Flasche Öl
  rationale: Das Substantiv bezeichnet ein kleines tragbares Gefäß. „Flasche“ ist verständlich und lässt das Material offen.
- source_word: πῆραν
  choice: eine Tasche
  rationale: Gemeint ist eine Reise- oder Vorratstasche. „Tasche“ ist natürlich und vermeidet altertümliche oder übermäßig spezifische Benennungen.
- source_word: ἀλφίτων
  choice: Gerstenmehl
  rationale: ἄλφιτα bezeichnet gewöhnlich aus gerösteter Gerste gewonnenes Mehl beziehungsweise Gerstenschrot. „Gerstenmehl“ trifft den Grundsinn in dieser Vorratsliste knapp und verständlich.
- source_word: παλάθης
  choice: Feigenkuchen
  rationale: Das Wort bezeichnet zu Kuchen oder Fladen gepresste Feigen; „Feigenkuchen“ ist die geläufige, knappe deutsche Entsprechung.
- source_word: ἄρτων καθαρῶν
  choice: reinen Broten
  rationale: Die wörtliche Wiedergabe bewahrt die mögliche Bedeutung kultischer oder speisegesetzlicher Reinheit, ohne sie im Haupttext festzulegen.
- source_word: περιεδίπλωσε
  choice: verpackte
  rationale: Das Verb bezeichnet ein Umwickeln oder Einpacken. Im Zusammenhang mit Reisevorräten ist „verpackte“ natürlich, ohne den Vorgang unnötig auszumalen.
- source_word: τὰ ἄγγη αὐτῆς
  choice: alle ihre Gefäße
  rationale: ἄγγη ist eine breite Bezeichnung für Behälter oder Gefäße; „Gefäße“ erhält diese Offenheit.
- source_word: ἐπέθηκε αὐτῇ
  choice: lud sie ihrer Dienerin auf
  rationale: Das feminine Pronomen verweist am natürlichsten auf die Dienerin. „Lud sie … auf“ macht den Vorgang idiomatisch deutlich, ohne einen im Griechischen nicht genannten Körperteil hinzuzufügen.
theological_decisions:
- issue: Reinheitsbedeutung von ἄρτων καθαρῶν
  choice: reinen Broten
  alternative: kultisch reine Brote; unbeflecktes Brot
  rationale: καθαρός kann hier angesichts von Judits Speisevorkehrungen rituelle oder speisegesetzliche Eignung andeuten. Die allgemeinere Formulierung im Haupttext erhält diese Möglichkeit, ohne eine technische kultische Aussage zu erzwingen; die Fußnote benennt die Mehrdeutigkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Aufzählung bleibt konkret und knapp; altertümliche Wörter wie „Magd“ oder „Reisesack“ werden vermieden. Der Wechsel zu einem neuen Satz dient der deutschen Lesbarkeit, ohne den inhaltlichen Ablauf zu verändern.
