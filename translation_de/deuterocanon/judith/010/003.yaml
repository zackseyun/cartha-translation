base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/003.yaml
  text: And she took off the sackcloth that she had been wearing[a], and removed the garments of her widowhood. She washed her body with water and anointed herself with rich perfume, arranged the hair of her head, put a headband on it, and put on her festive garments, with which she used to adorn herself during the days of her husband Manasseh’s life[c][b];
translation:
  language: de
  text: Und sie legte das Sacktuch ab, das sie getragen hatte, und zog die Kleider ihrer Witwenschaft aus. Sie wusch ihren Körper mit Wasser, salbte sich mit reichhaltigem Duftöl[a], ordnete ihr Haar, setzte sich einen Kopfschmuck[b] auf und zog ihre Festkleider an, mit denen sie sich zu Lebzeiten ihres Mannes Manasse geschmückt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dickflüssigem Duftöl“ beziehungsweise „mit reichhaltiger Salbe“. Das griechische Wort kann parfümiertes Öl oder Salbe bezeichnen; das Eigenschaftswort weist auf eine gehaltvolle oder dicke Beschaffenheit hin.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Kopfbinde“ beziehungsweise „einen Turban“. Das griechische Wort bezeichnet eine Binde oder Bedeckung für den Kopf, ohne dass ihre genaue Form hier eindeutig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιείλατο τὸν σάκκον ὃν ἐνεδύκει
  choice: legte das Sacktuch ab, das sie getragen hatte
  rationale: Die mediale Verbform bezeichnet hier das Ablegen eines selbst getragenen Kleidungsstücks; das Plusquamperfekt wird im Deutschen durch „getragen hatte“ wiedergegeben.
- source_word: ἐξεδύσατο τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: zog die Kleider ihrer Witwenschaft aus
  rationale: Die genitivische Wendung bleibt sichtbar und bewahrt den Kontrast zwischen dem äußeren Zeichen ihrer Witwenschaft und der folgenden festlichen Kleidung.
- source_word: περιεκλύσατο τὸ σῶμα ὕδατι
  choice: wusch ihren Körper mit Wasser
  rationale: Die Wiedergabe bleibt beim ausdrücklich genannten Waschen und legt keinen bestimmten Badevorgang nahe.
- source_word: ἔχρισατο μύρῳ παχεῖ
  choice: salbte sich mit reichhaltigem Duftöl
  rationale: μύρον bezeichnet duftendes Salböl beziehungsweise eine parfümierte Salbe; παχύς kann deren gehaltvolle, kräftige oder dicke Beschaffenheit ausdrücken. „Reichhaltig“ ist im Deutschen natürlich und vermeidet die unbelegte Festlegung auf Kostbarkeit.
- source_word: διέταξε τὰς τρίχας τῆς κεφαλῆς αὐτῆς
  choice: ordnete ihr Haar
  rationale: Das Verb bedeutet ordnen oder zurechtmachen; eine konkrete Methode wie Kämmen wird nicht vorausgesetzt.
- source_word: μίτραν
  choice: Kopfschmuck
  rationale: Der Ausdruck kann eine Binde, einen Turban oder eine andere Kopfbedeckung bezeichnen. Der Oberbegriff bewahrt die gegenständliche Unschärfe.
- source_word: τὰ ἱμάτια τῆς εὐφροσύνης αὐτῆς
  choice: ihre Festkleider
  rationale: εὐφροσύνη bezeichnet Freude oder Festlichkeit; im Zusammenhang mit Kleidung ist „Festkleider“ knapp und idiomatisch.
- source_word: ἐστολίζετο
  choice: mit denen sie sich … geschmückt hatte
  rationale: Das Verb bezeichnet das Schmücken oder festliche Kleiden. Die deutsche Form gibt den früher üblichen Zustand im Rückblick natürlich wieder.
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς τοῦ ἀνδρὸς αὐτῆς Μανασσή
  choice: zu Lebzeiten ihres Mannes Manasse
  rationale: Dies ist die natürliche deutsche Entsprechung der wörtlichen Wendung „in den Tagen des Lebens ihres Mannes Manasse“.
theological_decisions:
- issue: Witwenschaft und Trauerzeichen
  choice: „Sacktuch“ und „Kleider ihrer Witwenschaft“ werden ausdrücklich beibehalten.
  alternative: „Trauerkleider“ oder „Witwentracht“
  rationale: Der griechische Text nennt sowohl das Sacktuch als auch die auf ihre Witwenschaft bezogenen Kleider. Ihre gesonderte Wiedergabe erhält den erzählerischen Übergang von Trauer zu festlicher Selbstausstattung, ohne ihn konfessionell zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Abfolge der Handlungen und der deutliche Gegensatz zwischen Witwenkleidung und Festkleidern bleiben erhalten. „Kopfschmuck“ und die Fußnote bewahren die lexikalische Unschärfe von μίτρα.
