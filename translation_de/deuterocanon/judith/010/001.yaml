  text: And it happened, when she stopped crying out to the God of Israel and finished all these words,
translation:
  language: de
  text: Und es geschah, als sie aufgehört hatte, zum Gott Israels zu rufen, und all diese Worte zu Ende gesprochen hatte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Und es geschah
  rationale: Bewahrt die in der Septuaginta häufige erzählerische Übergangsformel und bleibt zugleich in einem würdigen modernen Bibelregister verständlich.
- source_word: ὡς
  choice: als
  rationale: Leitet hier den zeitlichen Umstand ein; „als“ entspricht der rückblickenden Erzählung im Deutschen.
- source_word: ἐπαύσατο
  choice: aufgehört hatte
  rationale: Gibt das Beenden der zuvor andauernden Handlung klar und idiomatisch wieder.
- source_word: βοῶσα
  choice: zu rufen
  rationale: Vermittelt den vernehmlichen, eindringlichen Gebetsruf, ohne die Lautstärke mit „schreien“ unnötig festzulegen.
- source_word: πρὸς τὸν θεὸν Ἰσραήλ
  choice: zum Gott Israels
  rationale: Bewahrt die biblische Gottesbezeichnung und ihren Bezug auf Israel.
- source_word: συνετέλεσεν
  choice: zu Ende gesprochen hatte
  rationale: Bezeichnet hier den Abschluss ihrer Rede beziehungsweise ihres Gebets und klingt im Deutschen natürlicher als „vollendet hatte“.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: all diese Worte
  rationale: Folgt der konkreten Ausdrucksweise des Griechischen und hält den Rückbezug auf das vorangehende Gebet offen.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung θεὸν Ἰσραήλ
  choice: Gott Israels
  alternative: Israels Gott
  rationale: Die gewählte Form bewahrt die traditionelle biblische Titulatur und deren bundestheologischen Klang, ohne zusätzliche Auslegung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Septuaginta-Erzählformel. Der abschließende Beistrich bleibt stehen, weil der griechische Satz syntaktisch in den folgenden Vers weiterführt.
