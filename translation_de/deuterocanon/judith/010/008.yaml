  yaml_path: translation/deuterocanon/judith/010/008.yaml
  text: And they said to her, “May the God of our fathers grant you favor, and bring your undertakings to completion for the boasting of the sons of Israel and the exaltation of Jerusalem.” And she bowed down to God.
translation:
  language: de
  text: 'Und sie sagten zu ihr: »Der Gott unserer Väter schenke dir Gunst[a] und führe deine Vorhaben[b] zum Ziel, zum Ruhm der Söhne Israels und zur Erhöhung Jerusalems[c].« Und sie warf sich vor Gott nieder[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schenke dir Gnade« beziehungsweise »verschaffe dir Wohlwollen«. Wörtlich heißt die griechische Wendung: »gebe dich in Gunst«; gemeint ist eine wohlwollende Aufnahme oder erfolgreiches Gelingen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deine Pläne« beziehungsweise »deine Unternehmungen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »zum Rühmen der Söhne Israels und zur Ehre Jerusalems«.'
    reason: alternative_reading
  - marker: d
    text: 'Oder: »sie betete Gott an« beziehungsweise »sie verneigte sich vor Gott«. Das griechische Verb bezeichnet eine ehrfürchtige Niederwerfung oder Verneigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη ... εἰς χάριν
  choice: schenke dir Gunst
  rationale: Der Optativ drückt einen Segenswunsch aus. »Gunst schenken« gibt die idiomatische Wendung εἰς χάριν διδόναι natürlich wieder und lässt sowohl wohlwollende Aufnahme als auch Gelingen anklingen.
- source_word: τελειῶσαι
  choice: führe ... zum Ziel
  rationale: Die Form bezeichnet die erbetene erfolgreiche Vollendung. »Zum Ziel führen« ist gegenwärtiges, würdevolles Deutsch und bewahrt den Ziel- und Vollendungsaspekt.
- source_word: τὰ ἐπιτηδεύματά σου
  choice: deine Vorhaben
  rationale: Der Ausdruck kann Unternehmungen, Pläne oder Handlungsweisen bezeichnen. Im Zusammenhang sind Judiths beabsichtigte Handlungen gemeint; »Vorhaben« wahrt die nötige Bedeutungsbreite.
- source_word: εἰς καύχημα
  choice: zum Ruhm
  rationale: καύχημα kann den Grund des Rühmens oder den daraus erwachsenden Ruhm bezeichnen. »Zum Ruhm« klingt in einem deutschen Segensspruch natürlich, ohne die öffentliche Ehrendimension aufzugeben.
- source_word: υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  rationale: Die formale Wendung des Griechischen wird bewahrt; sie entspricht zudem dem biblischen Register.
- source_word: ὕψωμα
  choice: zur Erhöhung
  rationale: »Erhöhung« erhält die im Substantiv liegende Vorstellung des Hochhebens beziehungsweise hohen Ansehens, statt sie vollständig zu »Ehre« oder »Herrlichkeit« zu glätten.
- source_word: προσεκύνησεν
  choice: sie warf sich vor Gott nieder
  rationale: Die Übersetzung bewahrt die körperliche Gebärde ehrfürchtiger Huldigung. Sie legt die genaue theologische Bezeichnung der Handlung nicht allein durch das abstraktere »anbeten« fest.
theological_decisions:
- issue: Zweckbestimmungen εἰς καύχημα ... καὶ ὕψωμα
  choice: zum Ruhm der Söhne Israels und zur Erhöhung Jerusalems
  alternative: zum Rühmen der Söhne Israels und zur Ehre Jerusalems
  rationale: Die Übersetzung erhält die parallelen öffentlichen Ehrbegriffe und die Hebungsmetaphorik von ὕψωμα. Zugleich vermeidet »Ruhm« das im Deutschen leicht negativ klingende »Prahlen«, ohne καύχημα zu einer ausdrücklich theologischen »Herrlichkeit« umzudeuten.
- issue: Bedeutung von προσκυνέω
  choice: sie warf sich vor Gott nieder
  alternative: sie betete Gott an
  rationale: Der griechische Ausdruck bezeichnet eine ehrfürchtige Niederwerfung und kann Anbetung einschließen. Die gewählte Fassung bewahrt die sichtbare Handlung und lässt ihren kultischen Gehalt bestehen, ohne sie auf einen rein innerlichen Vorgang zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Der Segenswunsch wird mit dem Konjunktiv »schenke« und »führe« wiedergegeben. »Söhne Israels« wahrt bewusst die formale Quellengestalt; die Fußnoten dokumentieren echte lexikalische Spielräume.
