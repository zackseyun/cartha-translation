base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/006.yaml
  text: And they went out to the gate of the city of Bethulia[a], and found Uzziah standing there, and Chabris and Charmis, the elders of the city.
translation:
  language: de
  text: Und sie gingen zum Tor der Stadt Betulia hinaus und fanden Usija dort stehen[a] und Chabris und Charmis, die Ältesten der Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf/an ihm“, nämlich am Tor; „dort“ gibt den Ortsbezug im Deutschen sinngemäß wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐπὶ τὴν πύλην
  choice: sie gingen zum Tor … hinaus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet eine Bewegung nach draußen; ἐπί mit Akkusativ gibt hier das Ziel an. Die deutsche Formulierung verbindet Richtung und Bewegung idiomatisch.
- source_word: τῆς πόλεως Βαιτυλουά
  choice: der Stadt Betulia
  rationale: πόλις wird mit „Stadt“ wiedergegeben; Βαιτυλουά erscheint in der im Deutschen gebräuchlichen biblischen Namensform „Betulia“.
- source_word: εὗρον
  choice: fanden
  rationale: Die Grundbedeutung von εὑρίσκω bleibt erhalten und ist auch in dieser Begegnungsszene natürlich.
- source_word: ἐφεστῶτα ἐπʼ αὐτῇ
  choice: Usija dort stehen
  rationale: Das Partizip bezeichnet Usijas stehende Anwesenheit am Tor. „Dort“ nimmt den Rückbezug des Pronomens auf das Tor idiomatisch auf, ohne eine amtliche Funktion hineinzulesen.
- source_word: Ὀζίαν
  choice: Usija
  rationale: „Usija“ ist die geläufige deutsche biblische Namensform.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: die Ältesten der Stadt
  rationale: πρεσβύτεροι bezeichnet hier die städtischen Ältesten beziehungsweise führenden Vertreter; die formale Wendung bewahrt den gesellschaftlichen Titel.
- source_word: Χάβρειν καὶ Χάρμειν
  choice: Chabris und Charmis
  rationale: Die Namen werden in ihren geläufigen, vom griechischen Nominativ abgeleiteten Formen wiedergegeben.
