translation_notes:
  register: Moderne, würdevolle Standardsprache. Der einfache Satzbau folgt der griechischen Erzählfolge; die doppelte Koordination bleibt sichtbar. Das etwas formelle „fanden … stehen“ bewahrt sowohl εὗρον als auch das Partizip, ohne unnatürlich zu wirken.
