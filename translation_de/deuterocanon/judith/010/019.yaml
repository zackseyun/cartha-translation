base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/019.yaml
  text: And they marveled at her beauty[a], and because of her they marveled at the sons of Israel; and each said to his neighbor, “Who would despise this people, who have such women among them? For it is not good to leave even one man from among them[b], because those who are left would be able to outwit the whole earth.”
translation:
  language: de
  text: 'Und sie staunten über ihre Schönheit, und ihretwegen staunten sie über die Söhne Israels[a]. Jeder sagte zu seinem Nächsten: »Wer wird dieses Volk verachten, das solche Frauen in seiner Mitte hat? Denn es ist nicht gut, auch nur einen Mann von ihnen übrig zu lassen[b]; die man übrig lässt, werden die ganze Erde überlisten können.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Israeliten«. Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das kann im militärischen Zusammenhang auch heißen: »auch nur einen Mann von ihnen am Leben zu lassen«.'
    reason: implicit_context
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: sie staunten
  rationale: Die Wiederholung des Imperfekts wird beibehalten. »Staunen« umfasst hier sowohl Verwunderung als auch Bewunderung und klingt im modernen Deutsch natürlich.
- source_word: κάλλει
  choice: Schönheit
  rationale: Die übliche und kontextgemäße Wiedergabe; gemeint ist Judiths äußere Schönheit.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die ausdrücklich maskuline griechische Wendung wird formal bewahrt; sie bezeichnet kollektiv das Volk Israel.
- source_word: ἀπʼ αὐτῆς
  choice: ihretwegen
  rationale: Die Präposition bezeichnet Judith als Anlass dafür, dass die Männer über Israel staunen.
- source_word: καταφρονήσει
  choice: wird … verachten
  rationale: Das Futur der rhetorischen Frage und der Gedanke geringschätziger Verachtung bleiben erhalten.
- source_word: γυναῖκας τοιαύτας
  choice: solche Frauen
  rationale: Knapp, idiomatisch und dem wertenden Ausdruck des Griechischen entsprechend.
- source_word: οὐ καλόν ἐστιν
  choice: es ist nicht gut
  rationale: Die breite Wertung bleibt bewusst offen und wird nicht ausdrücklich auf Zweckmäßigkeit, Moral oder Strategie eingeengt.
- source_word: ὑπολειπέσθαι … ἄνδρα ἕνα
  choice: auch nur einen Mann … übrig zu lassen
  rationale: »Auch nur« bringt die emphatische Einzahl zur Geltung; »Mann« wahrt die ausdrücklich maskuline Bezeichnung im militärischen Zusammenhang.
- source_word: οἱ ἀφεθέντες
  choice: die man übrig lässt
  rationale: Die passive Bedeutung des Partizips wird bewahrt, ohne das im militärischen Kontext naheliegende »am Leben« in den Haupttext einzutragen.
- source_word: δυνήσονται κατασοφίσασθαι
  choice: werden … überlisten können
  rationale: Die Formulierung gibt sowohl die Fähigkeit als auch das Element überlegener Klugheit oder List wieder.
- source_word: πᾶσαν τὴν γῆν
  choice: die ganze Erde
  rationale: Die formale Bedeutung von γῆ wird bewahrt; je nach Kontext kann die Wendung auch die ganze Welt beziehungsweise das ganze Land bezeichnen.
theological_decisions:
- issue: Maskuline Kollektivbezeichnung für Israel
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Form des griechischen Ausdrucks bleibt sichtbar, obwohl er kollektiv das Volk Israel bezeichnet; die Fußnote nennt die idiomatische deutsche Alternative.
- issue: Maskuliner Singular in der militärischen Aussage
  choice: auch nur einen Mann
  alternative: auch nur einen Menschen
  rationale: Das Griechische verwendet ausdrücklich ἄνδρα; im Zusammenhang geht es um männliche Überlebende eines Krieges, daher wird die Geschlechtsangabe nicht verallgemeinert.
- issue: Schicksal der Zurückgelassenen
  choice: übrig lassen
  alternative: am Leben lassen
  rationale: Der militärische Zusammenhang legt Überleben nahe, doch das Verb selbst sagt lediglich »übrig lassen«. Diese Spannung wird durch die wörtlichere Haupttextfassung und eine erläuternde Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wiederholung von »staunten« spiegelt die griechische Rhetorik. »In seiner Mitte« ist natürlicher als ein streng wörtliches »in sich«. Die direkte Rede bleibt eindringlich, ohne die strategisch-militärische Aussage moralisch umzudeuten.
