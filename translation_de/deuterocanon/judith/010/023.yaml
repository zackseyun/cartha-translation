base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/023.yaml
  text: When Judith came before him and his attendants[a], they all marveled at the beauty of her face; and falling on her face, she bowed down to him, and they raised her up.
translation:
  language: de
  text: Als Judit vor ihn und seine Diener trat, staunten alle über die Schönheit ihres Gesichts. Sie fiel mit dem Gesicht zur Erde und warf sich vor ihm nieder[a]; dann richteten sie sie auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „huldigte ihm“. Das griechische Verb kann auch „anbeten“ bedeuten; hier bezeichnet es die Ehrerbietung gegenüber einem menschlichen Machthaber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πρόσωπον αὐτοῦ … καὶ τῶν θεραπόντων αὐτοῦ
  choice: vor ihn und seine Diener
  rationale: Die Wendung bezeichnet hier das Treten in die Gegenwart des Holofernes und seiner Diener. „Vor ihn … trat“ ist im Deutschen idiomatisch und wahrt den höfischen Zusammenhang.
- source_word: θεραπόντων
  choice: Diener
  rationale: θεράπων bezeichnet in diesem höfisch-militärischen Umfeld einen Diener oder persönlichen Begleiter. „Diener“ ist verständlich und legt anders als eine Bezeichnung für Sklaven keinen bestimmten Rechtsstatus fest.
- source_word: ἐθαύμασαν
  choice: staunten
  rationale: Das Verb drückt erstaunte Bewunderung aus. „Staunten“ ist gegenwärtiges, natürliches Deutsch und passt zur genannten Schönheit.
- source_word: κάλλει τοῦ προσώπου
  choice: über die Schönheit ihres Gesichts
  rationale: Die Wiedergabe bleibt bei der konkreten Aussage über die Schönheit von Judits Gesicht und verallgemeinert sie nicht zu ihrer gesamten Erscheinung.
- source_word: πεσοῦσα ἐπὶ πρόσωπον
  choice: Sie fiel auf ihr Angesicht
  rationale: Die Formulierung bewahrt das anschauliche körperliche Bild des griechischen Textes. „Angesicht“ ist hier bewusst würdevoll und verbindet sich natürlich mit der Geste der Niederwerfung.
- source_word: προσεκύνησεν αὐτῷ
  choice: warf sich vor ihm nieder
  rationale: Im Zusammenhang mit einem menschlichen Machthaber bezeichnet προσκυνέω eine ehrerbietige Niederwerfung. Die Formulierung gibt die Handlung wieder, ohne sie im Haupttext eindeutig als religiöse Anbetung zu bezeichnen; die weitere Bedeutungsbreite wird in der Fußnote genannt.
- source_word: ἤγειραν αὐτὴν
  choice: richteten sie sie wieder auf
  rationale: Der Plural verweist natürlich auf die Anwesenden. „Wieder aufrichten“ gibt die Gegenbewegung nach Judits Niederfallen idiomatisch wieder, ohne ausdrücklich festzulegen, welche Personen handelten.
theological_decisions:
- issue: Bedeutung von προσκυνέω gegenüber einem menschlichen Herrscher
  choice: warf sich vor ihm nieder
  alternative: betete ihn an; huldigte ihm
  rationale: Da Holofernes ein menschlicher Heerführer ist, bezeichnet das Verb im unmittelbaren Kontext am ehesten eine Geste der Unterwerfung und Ehrerbietung. Die Übersetzung vermeidet deshalb die vorschnelle Festlegung auf religiöse Anbetung, während die Fußnote die semantische Spannweite offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoll-biblischem Ton. Der Satzbau wurde gegenüber dem langen griechischen Satz geteilt. „Angesicht“ erhält an dieser Stelle die konkrete und feierliche Körperhaltung, während sonst das natürliche „Gesicht“ steht.
