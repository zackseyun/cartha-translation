  text: But when they saw her[a], and her face had been changed and her clothing altered, they marveled very greatly at her beauty,
translation:
  language: de
  text: Als sie sie aber sahen – ihr Gesicht war verändert, und sie hatte ihre Kleidung gewechselt –, staunten sie außerordentlich über ihre Schönheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich etwa: „Sie staunten sehr stark über ihre Schönheit.“ Die Wortgruppe ἐπὶ πολὺ σφόδρα verstärkt das Staunen doppelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ εἶδον αὐτήν
  choice: Als sie sie aber sahen
  rationale: ὡς mit dem Aorist leitet hier einen temporalen Nebensatz ein; δέ wird als leichter erzählerischer Übergang mit „aber“ wiedergegeben.
- source_word: ἦν ἠλλοιωμένον τὸ πρόσωπον αὐτῆς
  choice: dass ihr Gesicht verändert ... war
  rationale: Die Formulierung hält an πρόσωπον als „Gesicht“ fest und gibt den resultativen Zustand des Perfektpartizips natürlich wieder.
- source_word: τὴν στολὴν μεταβεβληκυῖαν
  choice: ihre Kleidung gewechselt war
  rationale: στολή bezeichnet hier ihre Kleidung beziehungsweise Gewandung; „gewechselt“ bringt den vorausgegangenen Kleiderwechsel im Kontext idiomatisch zum Ausdruck.
- source_word: ἐθαύμασαν ἐπὶ τῷ κάλλει αὐτῆς
  choice: staunten ... über ihre Schönheit
  rationale: θαυμάζω bezeichnet staunende Verwunderung oder Bewunderung; die Verbindung mit ἐπί und Dativ wird im Deutschen natürlich mit „über“ wiedergegeben.
- source_word: ἐπὶ πολὺ σφόδρα
  choice: über alle Maßen
  rationale: Die starke, doppelte Intensivierung wird durch eine geläufige und würdige deutsche Wendung bewahrt, ohne eine schwerfällige Adverbhäufung zu erzeugen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die leicht sperrige griechische Satzfügung wird durch „und bemerkten, dass“ syntaktisch geglättet; Gesicht, Kleidung und die außergewöhnliche Intensität des Staunens bleiben ausdrücklich erhalten.
