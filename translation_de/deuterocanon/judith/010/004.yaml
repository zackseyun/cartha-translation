base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/004.yaml
  text: And she put sandals on her feet[a], and put on her anklets and bracelets and rings and earrings and all her jewelry; and she made herself very beautiful[b], to deceive the eyes of any men who might see her.
translation:
  language: de
  text: Und sie zog sich Sandalen an[a] und legte ihre Fußreifen, ihre Armreifen, ihre Ringe, ihre Ohrringe und all ihren Schmuck an. Sie machte sich überaus schön, um die Augen aller Männer zu täuschen, die sie sehen würden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nahm Sandalen für ihre Füße“. Gemeint ist, dass sie die Sandalen anzog.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um die Augen jedes Mannes zu täuschen, der sie sehen sollte“. Die griechische Wendung ist unbestimmt und allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν σανδάλια εἰς τοὺς πόδας αὐτῆς
  choice: sie zog Sandalen an ihre Füße
  rationale: ἔλαβεν bedeutet wörtlich „nahm“, bezeichnet hier im Zusammenhang mit Kleidung jedoch idiomatisch das Anziehen; die Körperangabe des Griechischen bleibt erhalten.
- source_word: περιέθετο
  choice: legte … an
  rationale: Die mediale Form bezeichnet hier, dass Judith sich selbst mit den genannten Schmuckstücken ausstattete.
- source_word: χλιδῶνας
  choice: Fußreifen
  rationale: Im konkreten Schmuckverzeichnis ist ein am Fuß beziehungsweise Knöchel getragener Schmuck am wahrscheinlichsten; „Fußreifen“ ist verständlich und würdevoll.
- source_word: ψέλια
  choice: Armreifen
  rationale: ψέλια bezeichnet Arm- oder Handgelenksreifen; „Armreifen“ bildet den Gegenstand konkret ab.
- source_word: δακτυλίους
  choice: Ringe
  rationale: Dies ist die reguläre und im Kontext eindeutige Entsprechung.
- source_word: ἐνώτια
  choice: Ohrringe
  rationale: Das Wort bezeichnet Schmuck an den Ohren; „Ohrringe“ ist die natürliche moderne Wiedergabe.
- source_word: πάντα τὸν κόσμον αὐτῆς
  choice: all ihren Schmuck
  rationale: κόσμος bedeutet hier nicht „Welt“, sondern Schmuck beziehungsweise Zierde. „Schmuck“ passt zum unmittelbar vorausgehenden Verzeichnis und bewahrt zugleich den Sammelbegriff.
- source_word: ἐκαλλωπίσατο σφόδρα
  choice: sie machte sich überaus schön
  rationale: Die mediale Verbform beschreibt ihr eigenes Schönmachen; σφόδρα wird durch „überaus“ mit seiner starken Intensität wiedergegeben.
- source_word: εἰς ἀπάτησιν
  choice: um … zu täuschen
  rationale: Die Konstruktion bezeichnet den Zweck, und ἀπάτησις benennt ausdrücklich Täuschung; diese moralisch spannungsreiche Aussage wird nicht abgeschwächt.
- source_word: ὀφθαλμῶν ἀνδρῶν
  choice: die Augen … der Männer
  rationale: Die konkrete Augenmetaphorik des griechischen Textes bleibt erhalten.
- source_word: ὅσοι ἂν ἴδωσιν αὐτήν
  choice: aller Männer, die sie sehen würden
  rationale: ὅσοι ἄν mit Konjunktiv hat eine unbestimmte, verallgemeinernde Bedeutung. Die Formulierung gibt die Gesamtheit innerhalb der offenen Gruppe wieder; die Fußnote nennt eine ebenso mögliche stärker indefinite Fassung.
theological_decisions:
- issue: Moralischer Zweck von Judiths Schmuck
  choice: Der Text sagt ausdrücklich, dass sie sich schön machte, um die Augen der Männer zu täuschen.
  alternative: Die Aussage könnte als bloßes Anziehen, Betören oder Fesseln der Aufmerksamkeit abgeschwächt werden.
  rationale: ἀπάτησις bezeichnet Täuschung. Die Übersetzung bewahrt deshalb die strategische und moralisch komplexe Absicht des Erzähltextes, ohne sie konfessionell oder ethisch aufzulösen.
- issue: Reichweite von ὅσοι ἂν
  choice: aller Männer, die sie sehen würden
  alternative: jedes Mannes, der sie sehen sollte
  rationale: Die griechische Wendung ist allgemein und unbestimmt. Beide deutschen Fassungen sind möglich; der Haupttext betont die Gesamtheit derjenigen, die sie tatsächlich zu Gesicht bekämen, während die Fußnote die distributiv-indefinite Nuance wahrt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzstruktur. Die Schmuckstücke werden konkret benannt; die ausdrückliche Täuschungsabsicht und die Augenmetaphorik des griechischen Textes bleiben erhalten.
