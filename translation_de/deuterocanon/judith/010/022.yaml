  text: And they reported her to him[a], and he came out into the forecourt[b], with silver lamps going before him.
translation:
  language: de
  text: Und man berichtete ihm von ihr. Da trat er in den Vorraum[a] hinaus, und silberne Lampen[b] gingen ihm voraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet den dem Hauptzelt oder Audienzraum vorgelagerten Bereich; auch „Vorhof“ oder „Platz vor dem Zelt“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: Oder „Fackeln“. Das griechische Wort kann beides bezeichnen; die Erwähnung von Silber spricht hier eher für zeremonielle Lampen oder Leuchten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήγγειλαν
  choice: man berichtete
  rationale: Das Verb bezeichnet das Überbringen einer Meldung. Das unbestimmte „man“ gibt den nicht näher bezeichneten Plural im Deutschen natürlich wieder.
- source_word: περὶ αὐτῆς
  choice: von ihr
  rationale: In Verbindung mit „berichten“ ist „von ihr“ idiomatisches Deutsch und bewahrt den Bezug auf Judith, ohne den Inhalt der Meldung näher festzulegen.
- source_word: ἐξῆλθεν
  choice: trat … hinaus
  rationale: Die Form bezeichnet die Bewegung von drinnen nach draußen; „trat hinaus“ passt zum würdevollen erzählerischen Zusammenhang.
- source_word: προσκήνιον
  choice: Vorhof
  rationale: Gemeint ist hier der Bereich vor dem Hauptzelt oder Audienzraum. „Vorhof“ vermittelt einen vorgelagerten, formellen Bereich, ohne die im Deutschen naheliegende Theaterbedeutung von „Bühne“ einzuführen.
- source_word: λαμπάδες
  choice: Lampen
  rationale: Das Wort kann Lampen oder Fackeln bezeichnen. Die Bestimmung als silbern spricht in diesem zeremoniellen Zusammenhang eher für tragbare Lampen oder Leuchten; die andere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: ἀργυραῖ
  choice: silberne
  rationale: Das Adjektiv bedeutet unmittelbar „silbern“ beziehungsweise „aus Silber“; die knappe deutsche Form bewahrt diese Aussage.
- source_word: προάγον αὐτοῦ
  choice: wurden vor ihm hergetragen
  rationale: Wörtlich gehen die Lampen vor ihm her. Da Leuchten nicht selbst gehen, gibt die idiomatische deutsche Passivform die Prozessionsszene verständlich wieder, ohne ausdrücklich zusätzliche Träger als handelnde Personen in den Vordergrund zu stellen.
