base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/001.yaml
  text: On the next day Holofernes ordered all his army and all his people who had come for his alliance to break camp for Bethulia[a], to seize the passes of the hill country in advance[b], and to make war against the sons of Israel.
translation:
  language: de
  text: Am folgenden Tag befahl Holofernes seinem ganzen Heer und allen seinen Leuten, die sich seinem Bündnis angeschlossen hatten,[a] das Lager abzubrechen und nach Betulia zu ziehen, die Aufstiege ins Bergland im Voraus zu besetzen und gegen die Söhne Israels[b] Krieg zu führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die zu seinem Bündnis gekommen waren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Israeliten“. Das Griechische lautet wörtlich „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Am folgenden Tag
  rationale: Die geläufige Zeitangabe wahrt die erzählerische Abfolge und klingt in modernem Deutsch natürlich.
- source_word: παρήγγειλεν
  choice: befahl
  rationale: Das Verb bezeichnet hier einen verbindlichen militärischen Befehl.
- source_word: πάσῃ τῇ στρατείᾳ αὐτοῦ
  choice: seinem ganzen Heer
  rationale: στρατεία bezeichnet in diesem Zusammenhang das gesamte Heer, nicht den Feldzug.
- source_word: παντὶ τῷ λαῷ αὐτοῦ
  choice: allen seinen Leuten
  rationale: Die Formulierung bleibt weiter als „Soldaten“, bezeichnet hier aber die Holofernes zugehörige Gefolgschaft.
- source_word: οἳ παρεγένοντο ἐπὶ τὴν συμμαχίαν αὐτοῦ
  choice: die sich seinem Bündnis angeschlossen hatten
  rationale: Dies gibt den politisch-militärischen Sinn idiomatisch wieder; die wörtlichere Bewegungsformulierung bleibt in der Fußnote erkennbar.
- source_word: ἀναζευγνύειν ἐπὶ Βαιτυλουὰ
  choice: das Lager abzubrechen und gegen Betylua zu ziehen
  rationale: ἀναζευγνύειν ist ein militärischer Ausdruck für das Aufbrechen des Lagers; ἐπί bezeichnet die Bewegungsrichtung und kann im feindlichen Kontext mit „gegen“ wiedergegeben werden.
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: die Aufstiege ins Bergland
  rationale: Die Wiedergabe erhält das konkrete Bild der hinaufführenden Zugangswege und legt sich nicht unnötig auf eigentliche Gebirgspässe fest.
- source_word: προκαταλαμβάνεσθαι
  choice: im Voraus zu besetzen
  rationale: Das Verb bezeichnet das vorzeitige Einnehmen strategischer Orte; „besetzen“ passt zum militärischen Kontext.
- source_word: ποιεῖν πόλεμον πρὸς
  choice: Krieg zu führen gegen
  rationale: Die feste deutsche Wendung entspricht dem griechischen Ausdruck und bewahrt dessen formellen Ton.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die traditionelle familiäre Bezeichnung wird transparent bewahrt; „Israeliten“ ist die idiomatischere Alternative.
theological_decisions:
- issue: Ethnisch-bundestheologische Bezeichnung τοὺς υἱοὺς Ἰσραήλ
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Übersetzung erhält den maskulinen familiären Ausdruck des griechischen Textes, ohne ihn stillschweigend zu verallgemeinern; eine geläufigere ethnische Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Terminologie. Der Ortsname Βαιτυλουά wird als „Betylua“ transliteriert. Die Satzstruktur bleibt der dreifachen Befehlsfolge des griechischen Textes verpflichtet, wird aber für deutsche Lesbarkeit leicht entfaltet.
