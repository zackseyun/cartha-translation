  text: And the whole camp of Assyria remained around them—the foot soldiers and chariots and their horsemen—for thirty-four days; and all the water containers of all the inhabitants of Bethulia ran out,
translation:
  language: de
  text: Das gesamte Heerlager der Assyrer blieb vierunddreißig Tage lang rings um sie gelagert – die Fußsoldaten, die Streitwagen und ihre Reiter; und allen Einwohnern von Betulia ging das Wasser in all ihren Gefäßen aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴ Ἀσσούρ
  choice: Heer der Assyrer
  rationale: παρεμβολή bezeichnet hier das ringsum lagernde Heerlager beziehungsweise die Streitmacht; im natürlichen deutschen Zusammenhang gibt „Heer“ die Gesamtheit einschließlich der anschließend genannten Truppengattungen wieder.
- source_word: ἔμεινεν κύκλῳ αὐτῶν
  choice: blieb … rings um sie gelagert
  rationale: Die räumliche Einschließung wird bewahrt; „gelagert“ ergibt sich idiomatisch aus dem militärischen Substantiv παρεμβολή, ohne eine zusätzliche Handlung einzuführen.
- source_word: οἱ πεζοὶ καὶ ἅρματα καὶ οἱ ἱππεῖς αὐτῶν
  choice: die Fußsoldaten, die Streitwagen und ihre Reiter
  rationale: Die drei militärischen Gruppen werden eng und in derselben Reihenfolge wiedergegeben; „ihre“ folgt dem griechischen Possessivpronomen bei den Reitern.
- source_word: ἡμέρας τριάκοντα τέσσαρες
  choice: vierunddreißig Tage lang
  rationale: Natürliche deutsche Zeitangabe mit unverändertem Zahlenwert.
- source_word: ἐξέλιπεν … πάντα τὰ ἀγγεῖα αὐτῶν τῶν ὑδάτων
  choice: gingen … die Wasservorräte in sämtlichen Gefäßen aus
  rationale: Die griechische Formulierung ist syntaktisch ungewöhnlich und meint im Kontext, dass das in den Gefäßen vorhandene Wasser zur Neige ging. Die Wiedergabe vermeidet die sachlich missverständliche Aussage, die Gefäße selbst seien ausgegangen.
- source_word: Βαιτυλουά
  choice: Betylua
  rationale: Eingedeutschte Transliteration des griechischen Ortsnamens, in Übereinstimmung mit gebräuchlicher deutscher Namensform.
