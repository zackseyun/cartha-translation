revisions:
- from: Das ganze Heer der Assyrer blieb vierunddreißig Tage lang rings um sie gelagert – die Fußsoldaten, die Streitwagen und ihre Reiter. Da gingen allen Einwohnern von Betylua die Wasservorräte in sämtlichen Gefäßen aus.
  to: Das gesamte Heerlager der Assyrer blieb vierunddreißig Tage lang rings um sie gelagert – die Fußsoldaten, die Streitwagen und ihre Reiter; und allen Einwohnern von Betulia ging das Wasser in all ihren Gefäßen aus.
  rationale: Die Revision präzisiert παρεμβολή als „Heerlager“, verwendet die geläufige deutsche Namensform „Betulia“ und gibt die erschöpften Wassergefäße idiomatisch wieder, ohne den konkreten Bezug des griechischen Textes zu einem bloßen abstrakten Wasservorrat zu reduzieren. Die Satzverknüpfung bleibt entsprechend καί additiv.
  reviewer_model: gpt-5.6-terra
