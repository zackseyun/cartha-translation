review_pass:
  verdict: revise
  source_fidelity: 'Die Belagerung durch das gesamte assyrische Heerlager, die Aufzählung der Truppengattungen und die Dauer von 34 Tagen sind zutreffend wiedergegeben. Die abschließende Formulierung sollte jedoch enger am griechischen Bild bleiben: Nicht ein abstrakter „Wasservorrat“ ist ausdrücklich Subjekt, sondern die Wassergefäße gehen den Einwohnern aus bzw. sind erschöpft. Die deutsche idiomatische Entfaltung mit dem darin befindlichen Wasser gibt diesen Sinn klar wieder.'
  naturalness: Der Entwurf ist weitgehend flüssig. „Da“ fügt allerdings einen stärker zeitlich-folgernden Anschluss ein als das schlichte καί; ein Semikolon mit „und“ bewahrt die Reihung des griechischen Satzes besser. „Betulia“ ist zudem die im modernen deutschen Bibelgebrauch geläufigere Ortsnamensform.
  terminology: „Heerlager“ entspricht παρεμβολή präziser als „Heer“, da der Text das um die Stadt liegende Lager bezeichnet. „Betulia“ wird als etablierte deutsche Form für Βαιτυλουά verwendet. Die militärischen Begriffe Fußsoldaten, Streitwagen und Reiter bleiben sachgerecht.
  issues:
  - severity: medium
    issue: „Wasservorräte in sämtlichen Gefäßen“ deutet die ungewöhnliche griechische Aussage stärker aus als nötig.
    rationale: πάντα τὰ ἀγγεῖα ... τῶν ὑδάτων bezeichnet die Wassergefäße aller Bewohner. Die idiomatische Aussage, dass ihnen das Wasser in allen Gefäßen ausging, erhält sowohl die Allquantifizierung als auch den konkreten Bezug auf die Gefäße.
  - severity: low
    issue: „Heer“ ist gegenüber παρεμβολή weniger genau.
    rationale: παρεμβολή meint hier das belagernd um sie herum befindliche Heerlager; „Heerlager“ bewahrt diese räumlich-militärische Nuance.
  - severity: low
    issue: Die Ortsnamensform „Betylua“ ist im modernen deutschen Bibelgebrauch nicht die übliche Form.
    rationale: „Betulia“ ist die etablierte deutsche Wiedergabe und erleichtert die Wiedererkennung ohne den griechischen Namen zu verändern.
  - severity: low
    issue: „Da“ verstärkt den bloß additiven Anschluss καί.
    rationale: Der griechische Text reiht beide Aussagen mit καί aneinander; „und“ ist genauer und zugleich natürlich.
  revised_text: Das gesamte Heerlager der Assyrer blieb vierunddreißig Tage lang rings um sie gelagert – die Fußsoldaten, die Streitwagen und ihre Reiter; und allen Einwohnern von Betulia ging das Wasser in all ihren Gefäßen aus.
