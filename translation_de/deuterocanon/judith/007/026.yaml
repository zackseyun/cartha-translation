  yaml_path: translation/deuterocanon/judith/007/026.yaml
  text: And now call them, and hand over the whole city as plunder to the people of Holofernes and to all his force.
translation:
  language: de
  text: Und nun ruft sie und liefert die ganze Stadt dem Volk des Holofernes und seinem gesamten Heer zur Plünderung aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσασθε αὐτούς
  choice: ruft sie herbei
  rationale: Der Aoristimperativ fordert dazu auf, die zuvor genannten Personen herbeizurufen; „herbeirufen“ gibt den Zusammenhang im natürlichen modernen Deutsch klar wieder.
- source_word: ἔκδοθε
  choice: liefert ... aus
  rationale: Der Imperativ bezeichnet die Übergabe der Stadt in die Gewalt des Feindes; „ausliefern“ bewahrt die Härte und Endgültigkeit der Forderung.
- source_word: εἰς προνομήν
  choice: zur Plünderung
  rationale: 'Die Wendung bezeichnet den Zweck bzw. das Ergebnis der Übergabe: Die Stadt soll der Plünderung preisgegeben werden.'
- source_word: τῷ λαῷ Ὁλοφέρνου
  choice: dem Volk des Holofernes
  rationale: „Volk“ entspricht λαός formal und lässt offen, ob hier allgemein seine Leute oder sein Kriegsvolk gemeint sind.
- source_word: πάσῃ τῇ δυνάμει αὐτοῦ
  choice: seinem gesamten Heer
  rationale: δύναμις bezeichnet in diesem militärischen Kontext die Streitmacht; der Singular wird im Deutschen idiomatisch mit „Heer“ wiedergegeben.
