base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/028.yaml
  text: We call heaven and earth and our God and Lord of our fathers to witness against you[a], who avenges us according to our sins and according to the sins of our fathers[b], that he may not act according to these words today.
translation:
  language: de
  text: Wir rufen Himmel und Erde und unseren Gott und den Herrn unserer Väter als Zeugen gegen euch an[a], der an uns entsprechend unseren Sünden und entsprechend den Sünden unserer Väter Vergeltung übt[b], damit er heute nicht diesen Worten entsprechend handelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Wir bezeugen euch.“ Im Zusammenhang ist wahrscheinlich gemeint, dass Himmel, Erde und Gott förmlich als Zeugen gegen die Angesprochenen angerufen werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Wendung bezeichnet göttliche Vergeltung entsprechend den Sünden; möglich ist auch: „der uns für unsere Sünden und für die Sünden unserer Väter bestraft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρόμεθα ὑμῖν
  choice: wir rufen … als Zeugen gegen euch an
  rationale: Die mediale Form mit dem Dativ und den anschließend genannten Zeugen bezeichnet hier am ehesten eine förmliche Zeugenanrufung. „Gegen euch“ gibt den im Zusammenhang naheliegenden adversativen Sinn des formal mehrdeutigen Dativs wieder.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: Himmel und Erde
  rationale: Die geläufige deutsche Wendung bewahrt den kosmischen Merismus ohne unnatürliche Artikelhäufung.
- source_word: τὸν θεὸν ἡμῶν καὶ κύριον τῶν πατέρων ἡμῶν
  choice: unseren Gott und Herrn unserer Väter
  rationale: Die koordinierten Gottesbezeichnungen werden eng zusammengehalten; „Herr“ wahrt den Charakter eines göttlichen Titels.
- source_word: ἐκδικεῖ ἡμᾶς
  choice: an uns … Vergeltung übt
  rationale: Die Wendung erhält den Sinn richterlicher Vergeltung, ohne ihn auf bloße Rache oder ausschließlich auf das allgemeinere „bestrafen“ zu verengen.
- source_word: κατὰ τὰς ἁμαρτίας ἡμῶν καὶ κατὰ τὰ ἁμαρτήματα τῶν πατέρων ἡμῶν
  choice: entsprechend unseren Sünden und den Verfehlungen unserer Väter
  rationale: „Entsprechend“ bewahrt die durch κατά bezeichnete Beziehung von Maß oder Zuordnung. Die deutschen Wörter „Sünden“ und „Verfehlungen“ spiegeln die zwei nahe verwandten griechischen Substantive.
- source_word: ἵνα μὴ ποιήσῃ
  choice: damit er nicht … handelt
  rationale: Die negative Zweck- beziehungsweise Folgekonstruktion bleibt syntaktisch offen; „handelt“ ist im Deutschen mit der folgenden Wendung natürlicher als ein isoliertes „tut“.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: diesen Worten entsprechend
  rationale: Die Formulierung verweist eng auf die zuvor ausgesprochenen Worte, ohne ihren Inhalt erklärend festzulegen.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: noch heute
  rationale: „Heute“ gibt die Zeitangabe idiomatisch wieder; „noch“ vermittelt in diesem Zusammenhang die Dringlichkeit des ausdrücklich bezeichneten gegenwärtigen Tages.
theological_decisions:
- issue: Wiedergabe von κύριος als göttlichem Titel
  choice: Herr
  alternative: Gebieter
  rationale: Im Zusammenhang mit „unserem Gott“ und „unseren Vätern“ ist κύριος ein göttlicher Titel; „Herr“ bewahrt dessen biblischen und bundestheologischen Klang, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Richtung der göttlichen Vergeltung in ἐκδικεῖ ἡμᾶς
  choice: der an uns … Vergeltung übt
  alternative: der uns für unsere Sünden bestraft
  rationale: Das Pronomen ἡμᾶς bezeichnet hier diejenigen, an denen wegen der Sünden Vergeltung vollzogen wird, nicht diejenigen, die Gott verteidigt. Die gewählte Fassung bewahrt zugleich die stärkere richterliche Bedeutung von ἐκδικεῖ.
- issue: Beziehung zwischen „unserem Gott“ und „Herrn unserer Väter“
  choice: eine eng koordinierte Bezeichnung desselben göttlichen Referenten
  alternative: unseren Gott und den Herrn unserer Väter
  rationale: Der unmittelbare Zusammenhang und der singularische Relativsatz sprechen für einen gemeinsamen Referenten. Die koordinierte Form bleibt näher an der griechischen Gestalt als eine ausdrücklich appositionelle Auflösung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die förmliche Sprache der Zeugenanrufung und der göttlichen Vergeltung bleibt erhalten. Der lange griechische Satz wird nicht aufgelöst, damit die Verbindung der Anrufung mit dem Relativ- und dem ἵνα-Satz sichtbar bleibt.
