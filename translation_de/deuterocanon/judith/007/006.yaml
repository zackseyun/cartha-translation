lexical_decisions:
- source_word: τῇ δὲ ἡμέρᾳ τῇ δευτέρᾳ
  choice: Am zweiten Tag
  rationale: Der Dativ ist temporal gebraucht. Die Wendung gibt die zeitliche Abfolge direkt und in natürlichem Deutsch wieder; δέ markiert hier lediglich den Fortgang der Erzählung und braucht nicht eigens mit „aber“ übersetzt zu werden.
- source_word: ἐξήγαγεν
  choice: ließ ... aufziehen
  rationale: Das Verb bedeutet „hinausführen“ oder „herausführen“. Im militärischen Zusammenhang gibt „ließ ... aufziehen“ die von Holofernes veranlasste Bewegung der Reiterei natürlich wieder, ohne eine konkrete Gefechtsform zu behaupten.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: seine gesamte Reiterei
  rationale: ἵππος bezeichnet hier kollektiv die berittene Truppe. „Reiterei“ ist die übliche moderne deutsche Entsprechung; αὐτοῦ wird als Possessivpronomen auf Holofernes bezogen.
- source_word: κατὰ πρόσωπον
  choice: vor
  rationale: Die Präpositionalwendung bezeichnet eine Stellung vor beziehungsweise gegenüber einer Personengruppe. „Vor“ ist im gegebenen militärischen Kontext knapp und idiomatisch.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: den Söhnen Israels
  rationale: Die formale Wendung des Griechischen wird bewahrt. Sie ist eine traditionelle ethnische Bezeichnung und meint hier die Israeliten; diese idiomatische Bedeutung wird in der Fußnote erläutert.
- source_word: οἳ ἦσαν ἐν Βετυλουά
  choice: die sich in Betulia befanden
  rationale: Der Relativsatz bestimmt die Söhne Israels durch ihren Aufenthaltsort. „Sich befanden“ ist in erzählendem Standarddeutsch natürlich; Betulia folgt der etablierten deutschen Namensform.
