base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/012.yaml
  text: Remain by your camp, securing every man from your force, and let your servants gain control of the spring of water that comes out from the foot of the mountain,
translation:
  language: de
  text: Bleib bei deinem Lager und sichere jeden Mann deiner Streitmacht; deine Diener[a] sollen die Wasserquelle unter ihre Kontrolle bringen, die am Fuß des Berges[b] hervortritt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „deine Männer“. Das griechische Wort kann hier Diener, Gefolgsleute oder Untergebene bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „aus der Wurzel des Berges“, eine bildhafte Bezeichnung für seinen unteren Ansatz oder Fuß.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάμεινον
  choice: Bleib
  rationale: Der Imperativ bezeichnet das Verbleiben an einem Ort; „Bleib“ ist im militärischen Anweisungskontext natürlich und direkt.
- source_word: παρεμβολῆς
  choice: Lager
  rationale: Im militärischen Zusammenhang bezeichnet das Wort das Heerlager; „Lager“ ist präzise und idiomatisch.
- source_word: ἀσφαλίζων
  choice: sichere
  rationale: Das Partizip begleitet den Imperativ und bezeichnet aktives Sichern oder Absichern.
- source_word: πάντα ἄνδρα
  choice: jeden Mann
  rationale: Die distributive Einzahl und die ausdrücklich männliche Form des Griechischen bleiben gewahrt.
- source_word: ἐκ τῆς δυνάμεώς σου
  choice: deiner Streitmacht
  rationale: δύναμις bezeichnet hier den militärischen Verband; die Zugehörigkeit wird im Deutschen natürlich durch den Genitiv ausgedrückt.
- source_word: ἐπικρατησάτωσαν
  choice: sollen ... unter ihre Kontrolle bringen
  rationale: Der Verbalsinn ist, die Herrschaft oder Kontrolle über etwas zu erlangen; die Form gibt den Imperativ der dritten Person wieder.
- source_word: οἱ παῖδές σου
  choice: deine Diener
  rationale: παῖδες kann Diener, Gefolgsleute oder Untergebene bezeichnen; „Diener“ ist die direkte Wiedergabe, während die Fußnote die militärisch mögliche Alternative nennt.
- source_word: πηγῆς τοῦ ὕδατος
  choice: die Wasserquelle
  rationale: Die kompakte deutsche Zusammensetzung gibt die konkrete Quelle idiomatisch wieder.
- source_word: ἡ ἐκπορεύεται
  choice: die ... hervortritt
  rationale: Das Verb bezeichnet das Herauskommen; bei einer Quelle ist „hervortritt“ natürlich, ohne stärker als nötig ein Fließen auszumalen.
- source_word: ἐκ τῆς ῥίζης τοῦ ὄρους
  choice: am Fuß des Berges
  rationale: Wörtlich steht „aus der Wurzel des Berges“; topografisch ist damit sein unterer Ansatz beziehungsweise Fuß gemeint.
