translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortschreitende Entkräftung und das wiederholte Fallen werden durch „immer schwächer“ und den Imperfektzusammenhang wiedergegeben; lexikalische Mehrdeutigkeiten bei den Kindern und den städtischen Örtlichkeiten bleiben in den Fußnoten sichtbar.
