base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/022.yaml
  text: And their little children lost heart[a], and the women and the young men were failing from thirst, and they were falling in the squares of the city and in the passages of the gates[b], and there was no strength left in them.
translation:
  language: de
  text: Und ihre kleinen Kinder verloren den Mut[a], und die Frauen und die jungen Männer wurden vor Durst immer schwächer. Sie fielen auf den Plätzen der Stadt und in den Tordurchgängen[b] zu Boden, und es war keine Kraft mehr in ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Säuglinge wurden mutlos“; möglicherweise auch: „ihre kleinen Kinder wurden kraftlos“. Das Griechische kann sehr junge Kinder, auch Säuglinge, bezeichnen; das Verb kann sowohl Mutlosigkeit als auch ein Schwinden der inneren Kraft ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf den breiten Straßen der Stadt und in den Durchgängen der Tore“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθύμησεν
  choice: verloren den Mut
  rationale: Das Verb bezeichnet ein Schwinden von Mut oder innerer Kraft. Die Wendung wahrt den seelischen Aspekt, ohne vollständige Verzweiflung oder ausschließlich körperliche Schwäche festzulegen.
- source_word: τὰ νήπια
  choice: ihre kleinen Kinder
  rationale: νήπια kann Kleinkinder bis hin zu Säuglingen bezeichnen. „Kleine Kinder“ ist natürlich, verständlich und lässt die genaue Altersstufe offen.
- source_word: ἐξέλιπον
  choice: wurden immer schwächer
  rationale: Der Imperfekt schildert einen fortschreitenden Zustand des Nachlassens. Die Wiedergabe bezeichnet die zunehmende Entkräftung, ohne sie auf Ohnmacht zu verengen.
- source_word: ἀπὸ τῆς δίψης
  choice: vor Durst
  rationale: Die im Deutschen idiomatische Wendung gibt die Ursache der Entkräftung knapp und unmittelbar wieder.
- source_word: ἔπιπτον
  choice: fielen ... zu Boden
  rationale: Der Imperfekt beschreibt wiederholtes oder andauerndes Fallen. „Zu Boden“ verdeutlicht den deutschen Ausdruck, ohne das stärker deutende „brachen zusammen“ zu wählen.
- source_word: πλατείαις
  choice: Plätzen
  rationale: Das Wort bezeichnet breite, offene öffentliche Räume beziehungsweise Straßen. „Plätze“ passt hier zum städtischen Schauplatz und bleibt gut verständlich.
- source_word: διόδοις τῶν πυλῶν
  choice: Tordurchgängen
  rationale: Die kompakte deutsche Bildung bezeichnet die mit den Stadttoren verbundenen Durchgänge oder Passagen und bleibt nahe an der griechischen Wendung.
- source_word: κραταίωσις
  choice: Kraft
  rationale: Im Zusammenhang mit Durst und Zusammenbrechen bezeichnet das Substantiv die verbliebene körperliche beziehungsweise innere Stärke zum Durchhalten.
- source_word: οὐκ ἦν ... ἔτι ἐν αὐτοῖς
  choice: es war keine Kraft mehr in ihnen
  rationale: Die Formulierung bewahrt sowohl ἔτι („mehr/länger“) als auch die bildhafte Aussage, dass keine Kraft mehr „in ihnen“ war.
