  yaml_path: translation/deuterocanon/judith/007/017.yaml
  text: And the camp of the sons of Ammon moved on[a], and with them five thousand sons of Asshur[c][b], and they encamped in the valley and seized the waters and the springs of water of the sons of Israel.
translation:
  language: de
  text: Das Heerlager der Ammoniter[a] brach auf; mit ihnen zogen fünftausend Assyrer[b]. Sie schlugen im Tal[c] ihr Lager auf und brachten die Gewässer und Wasserquellen der Israeliten frühzeitig unter ihre Kontrolle[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Ammons“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Söhne Assurs“.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort kann je nach Gelände auch eine Schlucht, einen Talkessel oder eine eingeschlossene Ebene bezeichnen.
    reason: lexical_alternative
  - marker: d
    text: Das Verb kann auch mit „nahmen vorweg in Besitz“ oder „besetzten als Erste“ wiedergegeben werden; es deutet auf die strategische Sicherung der Wasserquellen hin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν ἡ παρεμβολή
  choice: Das Heerlager … brach auf
  rationale: Die Verbindung bezeichnet im militärischen Erzählzusammenhang das Aufbrechen des Lagers beziehungsweise des gelagerten Heeres. „Heerlager“ bewahrt beide Bedeutungsanteile besser als das allgemeinere „Lager“.
- source_word: υἱῶν Ἀμμών
  choice: der Ammoniter
  rationale: Die idiomatische deutsche Volksbezeichnung gibt die wörtliche griechische Wendung „Söhne Ammons“ klar und natürlich wieder.
- source_word: χιλιάδες πέντε υἱῶν Ἀσσούρ
  choice: fünftausend Assyrer
  rationale: Die Zahl wird idiomatisch wiedergegeben; „Assyrer“ ist im Deutschen die natürliche ethnische Bezeichnung für die wörtlichen „Söhne Assurs“.
- source_word: παρενέβαλον
  choice: sie schlugen … ihr Lager auf
  rationale: Dies ist die natürliche deutsche Wiedergabe des militärischen Verbs für das Lagern beziehungsweise Errichten eines Lagers.
- source_word: ἐν τῷ αὐλῶνι
  choice: im Tal
  rationale: αὐλών bezeichnet hier aufgrund des Geländezusammenhangs einen länglichen Geländeeinschnitt, ein Tal oder eine Schlucht, nicht einen architektonischen Hof.
- source_word: προκατελάβοντο
  choice: brachten … frühzeitig unter ihre Kontrolle
  rationale: Die Wiedergabe erfasst sowohl die Besitzergreifung als auch das Präfix προ-, das ein Zuvorkommen oder strategisches Sichern im Voraus nahelegt.
- source_word: τὰ ὕδατα καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: die Wasserstellen und Quellen
  rationale: Die Formulierung wahrt die zweigliedrige Betonung der griechischen Wendung, vermeidet im Deutschen aber das unnatürliche „die Wasser und die Quellen der Wasser“.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: der Israeliten
  rationale: Die natürliche deutsche Volksbezeichnung gibt „der Söhne Israels“ ohne Bedeutungsverlust wieder.
