  register: Moderner, würdevoller Erzählstil mit gut verständlicher militärischer Sprache. Ethnische Wendungen wurden im Haupttext idiomatisch wiedergegeben und ihre wörtliche Form in den Fußnoten bewahrt. Die ungewöhnliche Doppelung von Wasser und Quellen wurde leicht geglättet, ohne die zwei genannten Kategorien zusammenzuziehen.
