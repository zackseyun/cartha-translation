base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/010.yaml
  text: For this people[a], the sons of Israel, do not rely on their spears, but on the heights of their mountains, in which they themselves dwell[b]; for it is not easy to approach the summits of their mountains.
translation:
  language: de
  text: Denn dieses Volk, die Söhne Israels[a], vertraut nicht auf seine Speere, sondern auf die Höhen seiner Berge, auf denen sie selbst wohnen; denn die Gipfel ihrer Berge sind nicht leicht zu erreichen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Kinder Israels“ oder „die Israeliten“. Wörtlich steht im Griechischen „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „zu den Gipfeln ihrer Berge hinaufzugelangen“. Das griechische Verb kann das Herantreten oder Hinaufsteigen zu erhöhtem Gelände bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαὸς οὗτος τῶν υἱῶν Ἰσραήλ
  choice: dieses Volk, die Söhne Israels
  rationale: „Volk“ gibt λαός als nationale Gemeinschaft natürlich wieder. Die Apposition „die Söhne Israels“ bewahrt die ausdrückliche maskuline Formulierung des Griechischen und zugleich die etwas spannungsvolle Konstruktion des Ausgangstextes.
- source_word: οὐ πέποιθαν ἐπὶ τοῖς δόρασιν αὐτῶν
  choice: vertraut nicht auf seine Speere
  rationale: Das Perfekt πέποιθαν bezeichnet gefestigtes Vertrauen; „vertraut nicht auf“ ist im Deutschen idiomatisch. δόρασιν wird konkret als „Speere“ und nicht allgemein als „Waffen“ wiedergegeben.
- source_word: ἀλλʼ ἐπὶ τοῖς ὕψεσι τῶν ὀρέων αὐτῶν
  choice: sondern auf die Höhen seiner Berge
  rationale: „Höhen“ bildet ὕψεσι topografisch ab, ohne die möglichen kultischen Nebenbedeutungen von „Höhenstätten“ einzutragen.
- source_word: ἐν οἷς αὐτοὶ ἐνοικοῦσιν ἐν αὐτοῖς
  choice: auf denen sie selbst wohnen
  rationale: Die Wiedergabe erhält durch „selbst“ die Betonung von αὐτοί. Die doppelte griechische Ortsangabe wird nicht unnatürlich wiederholt; bei Bergeshöhen ist deutsches „auf denen“ idiomatisch.
- source_word: οὐ γὰρ ἔστιν εὐχερὲς
  choice: denn … sind nicht leicht
  rationale: Die verneinte Aussage „nicht leicht“ wahrt die Form und den Grad der griechischen Feststellung, statt sie verstärkend als „schwierig“ wiederzugeben.
- source_word: προσβῆναι ταῖς κορυφαῖς τῶν ὀρέων αὐτῶν
  choice: die Gipfel ihrer Berge … zu erreichen
  rationale: „Erreichen“ gibt das Heran- beziehungsweise Hinaufgelangen zu den Gipfeln in natürlichem Deutsch wieder. „Gipfel“ ist die genaue topografische Entsprechung zu κορυφαί.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter militärischer und topografischer Bildsprache. Der Wechsel vom kollektiven Singular („Volk“, „seine“) zum pluralischen Bezug auf die Israeliten („sie“, „ihrer“) bewahrt eine im Griechischen angelegte grammatische Spannung, ohne den Sinn zu verdunkeln.
