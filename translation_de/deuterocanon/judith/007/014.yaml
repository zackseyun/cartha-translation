base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/014.yaml
  text: And we will encamp against them as a guard[a], so that not one man may go out from the city. And they, and their wives, and their children, will waste away in the famine, and before the sword comes upon them, they will be laid low in the streets of their dwellings.
translation:
  language: de
  text: Und wir werden bei ihnen als Wache lagern, damit kein einziger Mann aus der Stadt hinausgeht. Sie selbst, ihre Frauen und ihre Kinder werden vor Hunger dahinschwinden; und noch bevor das Schwert über sie kommt, werden sie auf den Straßen ihres Wohnorts hingestreckt daliegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden sie auf den Plätzen ihrer Wohnstätte niedergestreckt liegen.“ Das griechische Wort πλατεῖαι kann breite Straßen oder öffentliche Plätze bezeichnen; καταστρωθήσονται kann das Niederwerfen oder ausgestreckte Daliegen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβαλοῦμεν ἐπʼ αὐταῖς
  choice: wir werden bei ihnen lagern
  rationale: παρεμβάλλω bezeichnet hier das militärische Lagern. Das feminine Pronomen verweist auf zuvor genannte feminine Größen, wahrscheinlich die Wasserstellen; „bei ihnen“ bewahrt den pronominalen Bezug und legt nicht unnötig eine feindliche Bedeutung wie „gegen sie“ fest.
- source_word: εἰς προφυλακὴν
  choice: als Wache
  rationale: 'Die Wendung bezeichnet Zweck und Funktion des Lagers: Es dient als vorgeschobene Bewachung beziehungsweise Sperre.'
- source_word: τοῦ μὴ ἐξελθεῖν ἐκ τῆς πόλεως ἄνδρα ἕνα
  choice: damit kein einziger Mann aus der Stadt hinausgeht
  rationale: Die Übersetzung gibt die verhindernde Absicht der Konstruktion wieder und bewahrt mit „kein einziger Mann“ die ausdrückliche maskuline Einzahl ἄνδρα ἕνα.
- source_word: τακήσονται ἐν τῷ λιμῷ
  choice: werden vor Hunger dahinschwinden
  rationale: τήκομαι beschreibt bildhaft ein körperliches Aufzehren oder Dahinschmelzen. „Vor Hunger dahinschwinden“ ist im heutigen Deutsch natürlich und gibt die Ursache im Belagerungskontext klar wieder.
- source_word: ῥομφαία
  choice: das Schwert
  rationale: „Schwert“ ist die etablierte, kontextgerechte Wiedergabe der militärischen Waffe, ohne die besondere Bauart unnötig zu präzisieren.
- source_word: καταστρωθήσονται
  choice: werden hingestreckt daliegen
  rationale: Das Verb kann ein Niederwerfen, Ausstrecken oder Ausbreiten auf dem Boden bezeichnen. Die Formulierung vermittelt Zusammenbruch und Tod, ohne festzulegen, dass sie unmittelbar durch das Schwert erschlagen werden.
- source_word: ἐν ταῖς πλατείαις τῆς οἰκήσεως αὐτῶν
  choice: auf den Straßen ihres Wohnorts
  rationale: πλατεῖαι kann breite Straßen oder öffentliche Plätze bezeichnen; „Straßen“ ist im Haupttext die natürliche allgemeine Wiedergabe. οἴκησις bezeichnet hier ihren Wohn- oder Siedlungsort.
