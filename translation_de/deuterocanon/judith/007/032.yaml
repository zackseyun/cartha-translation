revisions:
- from: Und er schickte das Volk auseinander in sein Lager.[a] Dann gingen sie zu den Mauern und Türmen ihrer Stadt, und er schickte die Frauen und Kinder in ihre Häuser. In der Stadt waren sie in großer Bedrängnis.[b]
  to: Und er ließ das Volk in sein Lager auseinandergehen. Dann ging er zu den Mauern und Türmen ihrer Stadt und schickte die Frauen und Kinder in ihre Häuser. In der Stadt waren sie in großer Bedrängnis.[a]
  rationale: Die Singularform von ἀπῆλθεν wird mit „ging er“ wiederhergestellt und die darauf bezogene Fußnote entfernt. Die erste Aussage wird so umgestellt, dass das Auseinandergehen des Volkes und die Zielangabe „in sein Lager“ im Deutschen verständlich bleiben. Die lexikalische Fußnote zu ταπείνωσις bleibt bestehen.
