  text: And he dispersed the people to their camp[a], and they went away to the walls and towers of their city, and he sent the women and children to their houses[b]; and they were in great humiliation in the city.
translation:
  language: de
  text: Und er ließ das Volk in sein Lager auseinandergehen. Dann ging er zu den Mauern und Türmen ihrer Stadt und schickte die Frauen und Kinder in ihre Häuser. In der Stadt waren sie in großer Bedrängnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in großer Erniedrigung“. Der griechische Ausdruck kann einen Zustand tiefer Demütigung, Bedrängnis oder Not bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκόρπισεν
  choice: schickte … auseinander
  rationale: Das Verb bezeichnet hier die Auflösung und Verteilung der versammelten Menge. Die Formulierung ist im modernen Deutschen natürlicher als „zerstreute“, ohne ein panisches Auseinanderlaufen nahezulegen.
- source_word: λαόν
  choice: Volk
  rationale: Der Ausdruck bezeichnet die versammelte Bevölkerung insgesamt und nicht ausschließlich Soldaten.
- source_word: παρεμβολήν
  choice: Lager
  rationale: Im militärisch geprägten Zusammenhang ist „Lager“ die naheliegende und verständliche Wiedergabe.
- source_word: ἀπῆλθεν
  choice: Dann gingen sie
  rationale: Die griechische Verbform steht im Singular, doch der Zusammenhang legt nahe, dass das zuvor auseinander geschickte Volk zu Mauern und Türmen ging. Der deutsche Plural gibt diesen kontextuellen Bezug wieder; die formale Schwierigkeit wird in einer Fußnote offengelegt.
- source_word: τείχη
  choice: Mauern
  rationale: Die übliche Bezeichnung für die Befestigungsmauern der Stadt.
- source_word: πύργους
  choice: Türmen
  rationale: Die neutrale architektonische Bezeichnung entspricht dem griechischen Ausdruck, ohne eine nicht ausdrücklich genannte Funktion hinzuzufügen.
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Das Verb bezeichnet neutral, dass Frauen und Kinder in ihre Häuser geschickt wurden.
- source_word: ταπεινώσει
  choice: Bedrängnis
  rationale: Der Ausdruck beschreibt einen Zustand tiefen Erniedrigt- oder Niedergebeugtseins und kann im Kontext auch Not und Elend bezeichnen. „Bedrängnis“ ist hier natürlich und bewahrt die leidvolle Dimension; „Erniedrigung“ bleibt als formnähere Alternative in der Fußnote erhalten.
- source_word: πολλῇ
  choice: großer
  rationale: „Groß“ dient als idiomatische deutsche Gradangabe für die starke Bedrängnis.
