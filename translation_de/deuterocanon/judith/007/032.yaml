  source_fidelity: Die Wiedergabe von ἀπῆλθεν mit „Dann gingen sie“ folgt zwar der englischen Audit-Entscheidung, widerspricht aber der eindeutigen Singularform des griechischen Textes. Im unmittelbaren Satzgefüge ist „er ging“ die quellentreue Wiedergabe. Die übrigen wesentlichen Begriffe sind sachgerecht wiedergegeben. Für ἐσκόρπισεν εἰς ... παρεμβολήν ist eine Formulierung nötig, die sowohl das Auseinandergehen als auch die Bewegung in das Lager erkennen lässt.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „ließ ... auseinandergehen“ ist hier etwas expliziter als das einzelne Verb ἐσκόρπισεν, bildet aber dessen kausative Bedeutung und die Richtungsangabe idiomatisch ab.
  terminology: „Volk“, „Lager“, „Mauern“, „Türme“, „Frauen und Kinder“ sowie „große Bedrängnis“ sind passend. „Bedrängnis“ deckt die leidvolle Seite von ταπείνωσις ab; die mögliche Nuance von Erniedrigung bleibt in der Fußnote transparent.
