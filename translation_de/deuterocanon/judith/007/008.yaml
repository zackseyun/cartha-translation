  text: And all the rulers of the sons of Esau[a], and all the leaders of the people of Moab, and the generals of the seacoast came to him and said[b],
translation:
  language: de
  text: 'Da traten alle Herrscher der Söhne Esaus[a], alle Anführer des Volkes von Moab und die Heerführer des Küstengebiets[b] zu ihm und sagten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Edomiter“. Wörtlich: „der Söhne Esaus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Meeresküste“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: traten … zu ihm
  rationale: Das Aoristpartizip bezeichnet die Annäherung an die angesprochene Person. Die deutsche Konstruktion verbindet es natürlich mit dem Hauptverb, ohne die Bewegung abzuschwächen.
- source_word: ἄρχοντες
  choice: Herrscher
  rationale: Bezeichnet Personen mit politischer oder gesellschaftlicher Autorität und hält die begriffliche Unterscheidung zu ἡγούμενοι aufrecht.
- source_word: υἱῶν Ἠσαῦ
  choice: der Söhne Esaus
  rationale: Gibt die griechische Abstammungsbezeichnung transparent wieder, statt sie stillschweigend durch die ethnische Entsprechung „Edomiter“ zu ersetzen.
- source_word: ἡγούμενοι
  choice: Anführer
  rationale: Eine natürliche Bezeichnung für führende Personen, die von den zuvor genannten „Herrschern“ unterscheidbar bleibt.
- source_word: λαοῦ Μωὰβ
  choice: des Volkes von Moab
  rationale: Bewahrt die vollständige Genitivfügung und klingt im modernen Deutschen klar und würdig.
- source_word: στρατηγοὶ
  choice: Heerführer
  rationale: Bezeichnet militärische Befehlshaber. „Heerführer“ ist historisch angemessen und vermeidet die möglicherweise zu moderne Rangfestlegung „Generäle“.
- source_word: παραλίας
  choice: des Küstengebiets
  rationale: παραλία kann nicht nur die unmittelbare Meeresküste, sondern eine Küstenregion bezeichnen; „Küstengebiet“ wahrt diese geografische Weite.
- source_word: εἶπαν
  choice: sagten
  rationale: Natürliche und genaue Wiedergabe des üblichen griechischen Redeverbs; der Doppelpunkt leitet die folgende direkte Rede ein.
