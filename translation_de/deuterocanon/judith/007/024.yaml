base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/024.yaml
  text: May God judge between you and us[a], because you have done us great injustice by not speaking peaceably with the sons of Asshur.
translation:
  language: de
  text: Gott richte zwischen euch und uns! Denn ihr habt uns großes Unrecht getan, weil ihr nicht friedlich mit den Söhnen Assurs[a] geredet habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit den Assyrern«. Wörtlich steht im Griechischen: »mit den Söhnen Assurs«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρῖναι
  choice: Gott richte
  rationale: Der Aoristoptativ drückt hier einen Wunsch beziehungsweise eine feierliche Anrufung aus. Der deutsche Konjunktiv I gibt diese volitive Kraft knapp und würdig wieder.
- source_word: ἀνὰ μέσον ὑμῶν καὶ ἡμῶν
  choice: zwischen euch und uns
  rationale: Die Wendung bezeichnet idiomatisch das Richten zwischen zwei Parteien; diese deutsche Formulierung ist klar und entspricht der griechischen Reihenfolge.
- source_word: ἐποιήσατε ἐν ἡμῖν ἀδικίαν μεγάλην
  choice: ihr habt uns großes Unrecht getan
  rationale: Die Wiedergabe bewahrt den starken rechtlich-moralischen Gehalt von ἀδικία und formuliert die Konstruktion mit ἐν ἡμῖν natürlich auf Deutsch.
- source_word: οὐ λαλήσαντες εἰρηνικὰ
  choice: weil ihr nicht friedlich ... geredet habt
  rationale: Das Partizip nennt den Grund beziehungsweise die Art des vorgeworfenen Unrechts. »Friedlich reden« hält am verbalen Bild fest, ohne es deutend zu »Frieden anbieten« zu erweitern.
- source_word: μετὰ υἱῶν Ἀσσούρ
  choice: mit den Söhnen Assurs
  rationale: Dies bildet den griechischen Ausdruck formal ab und bewahrt den Eigennamen Assur; die gemeinte ethnische Bezeichnung wird in der Fußnote erläutert.
theological_decisions:
- issue: Anrufung Gottes als Richter
  choice: Gott richte zwischen euch und uns!
  alternative: Gott möge zwischen euch und uns richten!
  rationale: Der Satz ist eine feierliche Bitte beziehungsweise ein Appell an Gott als Schiedsrichter. Der Konjunktiv bewahrt diese Spannung, ohne daraus einen direkten Befehl an Gott oder eine weitergehende Lehraussage zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der feierliche Konjunktiv »richte« passt zur gerichtlichen Anrufung; der übrige Satz bleibt unmittelbar und allgemein verständlich.
