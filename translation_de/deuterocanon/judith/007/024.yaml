  source_fidelity: Die Übersetzung gibt den optativen Anrufungscharakter von Κρῖναι mit „Gott richte“ treffend wieder. „zwischen euch und uns“, „uns großes Unrecht getan“ und die kausale Begründung durch das nicht friedliche Reden entsprechen dem griechischen Satzbau und Sinn. „Söhnen Assurs“ bewahrt die bewusst wörtliche Bezeichnung υἱῶν Ἀσσούρ.
  naturalness: Modernes, verständliches und zugleich dem Kontext angemessen würdiges Standarddeutsch. Der Konjunktiv „richte“ klingt in einer feierlichen Anrufung natürlich; „friedlich ... geredet“ ist idiomatisch und bewahrt die verbale Offenheit des Griechischen.
  terminology: „Gott“, „Unrecht“ und „Söhne Assurs“ sind angemessen. Die Fußnote erläutert die mögliche ethnische Wiedergabe „Assyrer“, ohne den wörtlichen Text unnötig zu ersetzen. Der Anker steht unmittelbar beim erläuterten Ausdruck.
