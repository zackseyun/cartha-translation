  naturalness: Die Revision verwendet flüssiges modernes Standarddeutsch. „Richtete ... Lager ein“ ist bei mehreren an Wasserquellen eingerichteten militärischen Lagern natürlicher als „stellte Lager ... auf“.
  terminology: „Aufstiege“ bewahrt ἀναβάσεις; die Fußnote bietet die idiomatischere Umschreibung. „Wasserquellen“, „Lager“ und „Krieger“ geben πηγαί, παρεμβολαί und ἄνδρες πολεμισταί ohne zusätzliche Aussage über Kampferfahrung wieder.
  issues:
