revisions:
- from: Und er erkundete die Aufstiege zu ihrer Stadt[a]. Auch die Wasserquellen suchte er der Reihe nach auf und besetzte sie vorsorglich[b]; bei ihnen stellte er Lager mit kampferprobten Männern auf. Er selbst brach auf und kehrte zu seinem Volk zurück[c].
  to: Und er erkundete die Aufstiege zu ihrer Stadt[a], suchte die Wasserquellen auf und nahm sie in Besitz[b]; bei ihnen richtete er Lager von Kriegern ein. Er selbst brach auf und kehrte zu seinem Volk zurück[c].
  rationale: Die Änderungen entfernen unbelegte Zusätze und eine missverständliche zeitliche Umschreibung, ohne die taktische Abfolge oder die lexikalische Unsicherheit des seltenen Verbs ἐφώδευεν zu glätten. Die Fußnotenanker bleiben an den jeweils erläuterten Ausdrücken.
