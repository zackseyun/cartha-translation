    issue: „kampferprobten Männern“
    rationale: πολεμισταί bezeichnet Kämpfer/Krieger, nicht ausdrücklich erfahrene oder bewährte Kämpfer. „Kampferprobt“ ergänzt daher eine nicht belegte Nuance.
  - severity: low
    issue: „besetzte sie vorsorglich“
    rationale: Das Präfix προ- in προκατέλαβε kann ein vorgängiges bzw. strategisches Inbesitznehmen bezeichnen; „vorsorglich“ formuliert jedoch eine spezifische Motivation. Die neutralere Formulierung „nahm sie in Besitz“ wahrt den Kern, während die Fußnote die mögliche Präfixnuance erläutert.
