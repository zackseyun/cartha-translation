base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/007.yaml
  text: And he inspected the approaches to their city[a], and he took control of the springs of water and seized them, and he stationed camps of fighting men by them[c][b]; and he himself returned to his people.
translation:
  language: de
  text: Und er erkundete die Aufstiege zu ihrer Stadt[a], suchte die Wasserquellen auf und nahm sie in Besitz[b]; bei ihnen richtete er Lager von Kriegern ein. Er selbst brach auf und kehrte zu seinem Volk zurück[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Wege hinauf zu ihrer Stadt“. Das griechische Wort betont, dass diese Zugangswege bergauf führten.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene griechische Verb kann auch bedeuten, dass er die Quellen abging, untersuchte oder überwachte. Das folgende Verb kann besagen, dass er sie zuvor oder strategisch vorweg in Besitz nahm.
    reason: lexical_ambiguity
  - marker: c
    text: 'Oder: „Er selbst brach das Lager ab und zog zu seinem Volk.“ Das griechische Verb kann das Aufbrechen eines Lagers vor dem Abmarsch bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεσκέψατο
  choice: erkundete
  rationale: Im militärischen Zusammenhang bezeichnet das Verb ein prüfendes Besichtigen oder Untersuchen der Zugangswege; „erkundete“ gibt diesen taktischen Sinn natürlich wieder.
- source_word: ἀναβάσεις
  choice: Aufstiege
  rationale: Das Wort bezeichnet wörtlich Wege nach oben. „Aufstiege“ bewahrt die topografische Aussage, dass die Stadt über ansteigende Zugangswege erreicht wurde.
- source_word: πηγὰς τῶν ὑδάτων
  choice: Wasserquellen
  rationale: Die knappe deutsche Zusammensetzung gibt die konkreten Wasserquellen wieder, die als strategisches Ziel dienten.
- source_word: ἐφώδευεν
  choice: suchte er der Reihe nach auf
  rationale: Das seltene Verb kann das Entlanggehen, Bereisen oder Kontrollieren mehrerer Orte bezeichnen. Die Wiedergabe wahrt den fortlaufenden Aspekt und vermeidet die unbelegte Vorstellung, die Quellen seien baulich befestigt worden.
- source_word: προκατέλαβε
  choice: besetzte sie vorsorglich
  rationale: Das Kompositum bezeichnet ein vorwegnehmendes Einnehmen oder Sichern eines strategischen Ortes. „Vorsorglich besetzte“ bringt sowohl die Besetzung als auch das Moment des Zuvorkommens zum Ausdruck.
- source_word: ἐπέστησεν
  choice: stellte ... auf
  rationale: Im militärischen Zusammenhang bedeutet das Verb, Kräfte an einem Ort zu postieren oder aufzustellen.
- source_word: παρεμβολὰς
  choice: Lager
  rationale: Das Substantiv bezeichnet gewöhnlich Heerlager oder Feldlager. Der Plural und die örtliche Stationierung an den Quellen bleiben erhalten.
- source_word: ἀνδρῶν πολεμιστῶν
  choice: mit kampferprobten Männern
  rationale: Die Wendung bezeichnet männliche Kämpfer. „Kampferprobte Männer“ ist würdig und verständlich, ohne sie durch einen abstrakten Truppenbegriff zu ersetzen.
- source_word: ἀνέζευξεν
  choice: brach auf und kehrte ... zurück
  rationale: Das Verb bezeichnet das Aufbrechen beziehungsweise Abmarschieren und kann das Abbrechen eines Lagers einschließen. Zusammen mit dem Ziel „zu seinem Volk“ ergibt sich im Deutschen natürlich die Rückkehr.
