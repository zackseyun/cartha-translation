translation:
  language: de
  text: Ihre Worte fanden bei Holofernes und allen seinen Begleitern Zustimmung, und er befahl, so zu handeln, wie sie gesagt hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: fanden … Zustimmung
  rationale: Die Wendung gibt die wohlwollende Aufnahme des Vorschlags natürlich wieder und bewahrt den Bezug auf Holofernes und seine Gefolgsleute.
- source_word: οἱ λόγοι αὐτῶν
  choice: ihre Worte
  rationale: Die wörtliche Wiedergabe bleibt verständlich und bezeichnet im Zusammenhang zugleich den Inhalt ihres Rates.
- source_word: θεραπόντων
  choice: Gefolgsleuten
  rationale: θεράπων bezeichnet hier Personen im persönlichen beziehungsweise militärischen Gefolge; „Gefolgsleute“ passt zum Hof- und Heereskontext, ohne einen Sklavenstatus zu unterstellen.
- source_word: συνέταξε
  choice: er befahl
  rationale: Im Kontext bezeichnet συντάσσω eine verbindliche Anordnung; „befahl“ gibt diese Autorität knapp und idiomatisch wieder.
- source_word: ποιεῖν καθὰ ἐλάλησαν
  choice: so zu handeln, wie sie gesagt hatten
  rationale: Die Formulierung gibt den Inhalt des Befehls wieder und bildet die zeitliche Vorordnung des vorausgegangenen Rates im Deutschen natürlich ab.
