base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/003.yaml
  text: And they encamped in the valley near Bethulia[a], by the spring, and they extended in breadth toward Dothaim as far as Belbaim, and in length from Bethulia as far as Cyamon, which is opposite Esdraelon.
translation:
  language: de
  text: Und sie schlugen ihr Lager in dem Tal nahe Betulia[a] an der Quelle auf. In der Breite dehnte es sich in Richtung Dotaim bis Belbaim aus und in der Länge von Betulia bis Kyamon, das Esdrelon gegenüberliegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort αὐλών kann in anderen Zusammenhängen auch „Hof“ oder „Vorhof“ bedeuten; hier sprechen die geografische Umgebung und die genannten Geländepunkte für „Tal“.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλον
  choice: sie schlugen ihr Lager auf
  rationale: Die geläufige deutsche Wendung gibt das militärische Lagern natürlich und präzise wieder.
- source_word: ἐν τῷ αὐλῶνι
  choice: in dem Tal
  rationale: Im geografischen Zusammenhang mit Ortsnamen und einer Quelle bezeichnet αὐλών eine Talsenke beziehungsweise ein Tal, nicht einen Hof.
- source_word: πλησίον Βαιτυλουὰ
  choice: nahe Betulia
  rationale: Gibt die räumliche Nähe schlicht wieder; der Ortsname wird in einer im Deutschen gut lesbaren Form transliteriert.
- source_word: ἐπὶ τῆς πηγῆς
  choice: an der Quelle
  rationale: πηγή bezeichnet eine natürliche Quelle; die Präposition ist hier örtlich zu verstehen.
- source_word: παρέτειναν
  choice: dehnte es sich … aus
  rationale: Das im Deutschen ausdrücklich genannte Lager dient als natürlicher Bezug; die Formulierung beschreibt dessen räumliche Ausdehnung, ohne dem griechischen Text zusätzliche Handlungsträger aufzuzwingen.
- source_word: εἰς εὖρος
  choice: in der Breite
  rationale: Bewahrt den dimensionalen Gegensatz zu εἰς μῆκος.
- source_word: ἐπὶ Δοθαειμ ἕως Βελβαΐμ
  choice: in Richtung Dotaim bis Belbaim
  rationale: ἐπί ist hier richtungsbezogen; die Formulierung wahrt die Abfolge, ohne den genauen geografischen Verlauf überzubestimmen.
- source_word: εἰς μῆκος
  choice: in der Länge
  rationale: Entspricht dem dimensionalen Ausdruck und bildet ein klares Gegenstück zu „in der Breite“.
- source_word: ἕως Βαιτυλουὰ ἕως Κυαμῶνος
  choice: von Betulia bis Kyamon
  rationale: Die idiomatische deutsche Spannweitenangabe macht die durch die wiederholten ἕως bezeichnete Längsausdehnung verständlich.
- source_word: ἀπέναντι Ἐσδρηλών
  choice: das Esdrelon gegenüberliegt
  rationale: ἀπέναντι bezeichnet die gegenüberliegende beziehungsweise zugewandte Lage eines Ortes.
