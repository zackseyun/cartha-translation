base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/019.yaml
  text: And the sons of Israel cried out to the Lord their God[a], because their spirit had grown faint[b], because all their enemies had surrounded them and there was no escape from among them.
translation:
  language: de
  text: Und die Söhne Israels[a] schrien zum Herrn, ihrem Gott, denn ihr Geist war verzagt geworden[b], weil alle ihre Feinde sie umzingelt hatten und es kein Entkommen aus ihrer Mitte gab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Wörtlich steht im Griechischen: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr Mut war gesunken“; „sie hatten den Mut verloren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die Wiedergabe bewahrt die familiäre Ausdrucksweise des Griechischen und ihren biblischen Klang; die im Deutschen geläufigere Sammelbezeichnung „die Israeliten“ wird in der Fußnote genannt.
- source_word: ἀνεβόησαν
  choice: schrien
  rationale: Das Verb bezeichnet hier einen lauten, dringlichen Hilferuf an Gott; „schrien zum Herrn“ ist im Deutschen natürlich und kontextgerecht.
- source_word: Κύριον θεὸν αὐτῶν
  choice: zum Herrn, ihrem Gott
  rationale: „Herr“ gibt den göttlichen Titel κύριος wieder; die Apposition „ihrem Gott“ erhält die Zugehörigkeitsbeziehung und klingt auf Deutsch idiomatisch.
- source_word: ὠλιγοψύχησεν τὸ πνεῦμα αὐτῶν
  choice: ihr Geist war verzagt geworden
  rationale: Die Formulierung bewahrt πνεῦμα als „Geist“ und bringt zugleich das durch ὀλιγοψυχέω bezeichnete Verzagen beziehungsweise Schwinden des Mutes zum Ausdruck.
- source_word: ἐκύκλωσαν
  choice: sie umzingelt hatten
  rationale: Das Plusquamperfekt macht deutlich, dass die Umzingelung bereits bestand, als das Volk zu Gott schrie.
- source_word: οὐκ ἦν διαφυγεῖν ἐκ μέσου αὐτῶν
  choice: es aus ihrer Mitte kein Entkommen gab
  rationale: Die unpersönliche griechische Konstruktion wird natürlich wiedergegeben; „aus ihrer Mitte“ erhält das Bild, dass die Israeliten von den Feinden eingeschlossen waren.
theological_decisions:
- issue: Wiedergabe des Gottestitels κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im Gebets- und Bundeszusammenhang ist „Herr“ die angemessene und traditionelle Wiedergabe des göttlichen Titels, ohne dessen Bedeutung abzuschwächen.
- issue: Geschlechtlich markierter Kollektivausdruck οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die gewählte Fassung erhält den ausdrücklich männlich-familiären Wortlaut und seine biblische Resonanz; die natürliche kollektive Alternative wird transparent in der Fußnote angeboten.
- issue: Deutung von πνεῦμα im Zusammenhang mit ὀλιγοψυχέω
  choice: Geist
  alternative: Mut
  rationale: „Geist“ wahrt die Bildsprache und Mehrdeutigkeit des griechischen Substantivs, während das Verb durch „verzagt geworden“ den Sinn des Mutverlusts erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter biblischer Ausdrucksweise. Die Satzstruktur folgt den beiden griechischen Begründungssätzen, ohne im Deutschen unnötig schwerfällig zu werden.
