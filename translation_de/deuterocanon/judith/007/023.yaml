  source_fidelity: Die Übersetzung gibt die kollektive Versammlung, die städtischen Amtsträger sowie die ausdrücklich genannten Gruppen zutreffend wieder. Die adversative Deutung von ἐπί und ἐναντίον ist im unmittelbaren Kontext gut vertretbar; die Fußnote muss die mögliche nichtadversative Lesart weiterhin offenhalten.
