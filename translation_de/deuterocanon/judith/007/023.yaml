  terminology: Usija ist eine geeignete deutsche Namensform für Ὀζείας. „Oberste“ bezeichnet hier städtische Autoritäten, ohne ein bestimmtes modernes Amt zu unterstellen. „Älteste“ bewahrt die institutionell-soziale Offenheit von πρεσβύτεροι.
