  text: And all the people gathered against Oziah and the rulers of the city—the young men[a], the women, and the children—and they cried out with a loud voice and spoke against the elders,
translation:
  language: de
  text: Da versammelte sich das ganze Volk gegen Usija und die Obersten der Stadt – die jungen Männer, die Frauen und die Kinder. Sie schrien laut und sprachen sich gegen die Ältesten aus:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da versammelte sich das ganze Volk bei Usija und den Obersten der Stadt … und redete vor den Ältesten.“ Die Präpositionen ἐπί und ἐναντίον können hier auch im Sinn von Anwesenheit bzw. Gegenüberstehen verstanden werden; der unmittelbare Zusammenhang einer öffentlichen Beschwerde spricht jedoch für „gegen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: versammelte sich
  rationale: Der Aorist Passiv von ἐπισυνάγω wird hier intransitiv gebraucht und bezeichnet das Zusammenkommen der Bevölkerung als Gruppe.
- source_word: πᾶς ὁ λαός
  choice: das ganze Volk
  rationale: Die Wendung meint die gesamte örtliche Gemeinschaft; „das ganze Volk“ ist im Deutschen natürlich und bewahrt die umfassende Aussage von πᾶς.
- source_word: ἐπὶ Ὀζείαν
  choice: gegen Usija
  rationale: ἐπί mit Akkusativ kann hier angesichts des anschließenden lautstarken Protests adversativ verstanden werden. Die mögliche räumliche Deutung wird in der Fußnote bewahrt.
- source_word: τοὺς ἄρχοντας τῆς πόλεως
  choice: die führenden Männer der Stadt
  rationale: ἄρχοντες bezeichnet die städtischen Autoritäten. Diese Formulierung gibt ihre Leitungsfunktion wieder, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: οἱ νεανίσκοι
  choice: die jungen Männer
  rationale: Der griechische Ausdruck ist maskuliner Plural und bezeichnet hier ausdrücklich junge Männer.
- source_word: τὰ παιδία
  choice: die Kinder
  rationale: Dies ist die klare und natürliche Wiedergabe der allgemeinen Bezeichnung für Kinder.
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ
  choice: schrien mit lauter Stimme
  rationale: Die Wiedergabe erhält sowohl das nachdrückliche Rufen als auch die instrumentale Wendung φωνῇ μεγάλῃ.
- source_word: εἶπαν ἐναντίον τῶν πρεσβυτέρων
  choice: redeten gegen die Ältesten
  rationale: Im Kontext der öffentlichen Beschwerde ist ἐναντίον wahrscheinlich adversativ zu verstehen. „Redeten“ lässt den unmittelbar folgenden Inhalt ihrer Äußerung offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht deutlich, dass junge Männer, Frauen und Kinder das zuvor genannte ganze Volk näher bestimmen. Der Doppelpunkt weist darauf hin, dass die angekündigte Rede im folgenden Vers einsetzt.
