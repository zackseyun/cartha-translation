translation:
  language: de
  text: Denn alle Bewohner von Baitylua[a] holen von dort ihr Wasser, und der Durst wird sie töten, und sie werden ihre Stadt übergeben; und wir und unser Volk werden auf die nahe gelegenen Berggipfel hinaufziehen,
