lexical_decisions:
- source_word: διότι
  choice: Denn
  rationale: Leitet die Begründung für den zuvor genannten Plan ein und bewahrt den erklärenden Anschluss.
- source_word: ἐκεῖθεν ὑδρεύονται
  choice: von dort holen ... ihr Wasser
  rationale: Gibt sowohl den Herkunftsaspekt von ἐκεῖθεν als auch das konkrete Beschaffen von Wasser durch ὑδρεύονται natürlich wieder.
- source_word: πάντες οἱ κατοικοῦντες Βαιτυλουά
  choice: alle Bewohner von Baitylua
  rationale: Bewahrt den umfassenden Bezug auf die gesamte Einwohnerschaft und gibt den griechischen Ortsnamen in einer deutschen Transliteration wieder.
- source_word: ἀνελεῖ αὐτοὺς ἡ δίψα
  choice: Dann wird der Durst sie umbringen
  rationale: Bewahrt den personifizierten Durst als handelndes Subjekt und die starke, auf den Tod zielende Bedeutung von ἀναιρέω.
- source_word: ἐκδώσουσι τὴν πόλιν αὐτῶν
  choice: sie werden ihre Stadt ausliefern
  rationale: Die militärische Übergabe wird klar ausgedrückt; zugleich bleibt die allgemeinere Bedeutung von ἐκδίδωμι erhalten, ohne ausdrücklich eine Kapitulation zu ergänzen.
- source_word: καὶ ἡμεῖς καὶ ὁ λαὸς ἡμῶν
  choice: Wir aber werden mit unserem Volk
  rationale: Das erste καί markiert hier im Fortgang den Gegensatz beziehungsweise die Folge. Die koordinierte griechische Formulierung wird im Deutschen idiomatisch als gemeinsames Handeln wiedergegeben.
- source_word: ἀναβησόμεθα
  choice: hinaufziehen
  rationale: Bewahrt die Aufwärtsbewegung und passt zum gemeinsamen Vorrücken einer Gruppe, ohne das militärische Moment stärker als der Kontext festzulegen.
- source_word: ἐπὶ τὰς πλησίον κορυφὰς τῶν ὀρέων
  choice: auf die nahe gelegenen Berggipfel
  rationale: Gibt Zielrichtung, Nähe und topografische Einzelheit knapp und natürlich wieder.
