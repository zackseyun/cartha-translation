base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/002.yaml
  text: And on that day every one of their mighty men broke camp[a]; and their fighting force of warrior men was one hundred seventy thousand foot soldiers and twelve thousand horsemen, besides the baggage train of the men who were on foot among them[b], a very great multitude.
translation:
  language: de
  text: An jenem Tag brachen alle ihre wehrhaften Männer auf[a]. Ihre Streitmacht an Kriegern umfasste 170.000 Fußsoldaten und 12.000 Reiter, abgesehen vom Gepäck der Männer, die sich unter ihnen zu Fuß befanden – eine überaus große Menge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schlugen das Lager ab“ beziehungsweise „zogen weiter“.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Wortlaut ist syntaktisch schwierig. Er nennt das Gepäck der Männer, die sich unter ihnen zu Fuß befanden, und bezeichnet dies beziehungsweise die damit verbundenen Begleiter als eine überaus große Menge. Die genaue Beziehung der Satzteile bleibt unsicher.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνέζευξεν
  choice: brachen … auf
  rationale: Das Verb bezeichnet im militärischen Zusammenhang das Aufbrechen beziehungsweise den Abmarsch aus einem Lager. „Aufbrechen“ ist natürliches modernes Deutsch und legt nicht unnötig fest, ob der Schwerpunkt auf dem Abbau des Lagers oder dem anschließenden Marsch liegt.
- source_word: πᾶς ἀνὴρ δυνατὸς αὐτῶν
  choice: alle ihre kampfstarken Männer
  rationale: Die Wendung bezeichnet ihre starken beziehungsweise leistungsfähigen Männer im militärischen Zusammenhang. „Kampfstark“ bewahrt sowohl den Gedanken der Stärke als auch den martialischen Kontext; „Männer“ gibt ἀνήρ ausdrücklich wieder.
- source_word: ἡ δύναμις αὐτῶν ἀνδρῶν πολεμιστῶν
  choice: ihre Streitmacht aus Kriegern
  rationale: δύναμις bezeichnet hier angesichts der anschließenden Truppenzahlen eine militärische Streitmacht; ἀνδρῶν πολεμιστῶν wird knapp und idiomatisch mit „Kriegern“ wiedergegeben.
- source_word: πεζῶν
  choice: Fußsoldaten
  rationale: Im Kontrast zu den Reitern bezeichnet πεζοί die zu Fuß kämpfenden Truppen.
- source_word: ἵππων
  choice: Reiter
  rationale: Obwohl ἵππων wörtlich „Pferde“ bedeuten kann, legt die parallele Zählung neben den Fußsoldaten berittene Truppen nahe. „Reiter“ ist im Deutschen präzise und natürlich.
- source_word: χωρὶς τῆς ἀποσκευῆς
  choice: abgesehen vom Tross
  rationale: ἀποσκευή bezeichnet das mitgeführte Gepäck beziehungsweise die Ausrüstung eines Heeres. „Tross“ gibt den militärischen Zusammenhang knapp wieder, ohne die nachfolgende schwierige Genitivkonstruktion vollständig auszudeuten.
- source_word: τῶν ἀνδρῶν οἳ ἦσαν πεζοὶ ἐν αὐτοῖς
  choice: der Männer, die unter ihnen zu Fuß waren
  rationale: Die bewusst nahe Wiedergabe wahrt die syntaktische Unklarheit des Griechischen und vermeidet die unbelegte Festlegung, ob diese Männer zum Tross gehörten oder zusätzlich mit ihm genannt werden.
- source_word: πλῆθος πολὺ σφόδρα
  choice: eine überaus große Menge
  rationale: Die Formulierung erhält die starke quantitative Steigerung des griechischen Ausdrucks und den gehobenen Erzählton.
