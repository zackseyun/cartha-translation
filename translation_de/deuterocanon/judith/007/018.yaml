base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/018.yaml
  text: And the sons of Esau and the sons of Ammon went up and camped in the hill country opposite Dothaim[a], and they sent some of their men toward the south and east, opposite Egrebel, which is near Chous, which is on the wadi Mochmour. And the rest of the Assyrian army camped on the plain and covered the whole face of the land, and their tents and their baggage were encamped in a very great multitude[b], and they were exceedingly numerous.
translation:
  language: de
  text: Und die Söhne Esaus und die Söhne Ammons zogen hinauf und schlugen ihr Lager im Bergland gegenüber von Dotaim auf. Sie sandten einige aus ihren Reihen nach Süden und Osten[a], gegenüber von Egrebel, das nahe bei Chus liegt, das am Wadi Mochmur[b] liegt. Das übrige assyrische Heer lagerte in der Ebene und bedeckte die ganze Fläche des Landes. Ihre Zelte und ihr Tross lagerten dort in gewaltiger Menge, und sie waren überaus zahlreich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann die zweite Richtungsangabe auch mit „zum Sonnenaufgang“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Ein Wadi ist ein Tal- oder Bachbett, das häufig nur zeitweise Wasser führt; auch „Wildbach“ oder „Bach“ ist möglich.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  choice: zogen hinauf
  rationale: Bewahrt sowohl die konkrete Aufwärtsbewegung in das Bergland als auch den militärischen Zusammenhang, ohne einen technischen Vormarschbegriff einzutragen.
- source_word: οἱ υἱοὶ Ἡσαῦ καὶ οἱ υἱοὶ Ἀμμών
  choice: die Söhne Esaus und die Söhne Ammons
  rationale: Die formale Gruppenbezeichnung des Griechischen wird beibehalten; sie bezeichnet die entsprechenden Völker beziehungsweise Volksgruppen.
- source_word: παρενέβαλον ἐν τῷ ὄρει
  choice: schlugen ihr Lager im Bergland ... auf
  rationale: παρεμβάλλω bezeichnet hier militärisches Lagern; ὄρος kann in diesem Zusammenhang eine Bergregion statt eines einzelnen Berges meinen.
- source_word: ἀπέστειλαν ἐξ αὐτῶν
  choice: Sie sandten einige aus ihren Reihen
  rationale: Gibt die wörtliche Struktur ‚sie sandten von ihnen‘ idiomatisch wieder und lässt offen, wie groß die ausgesandte Abteilung war.
- source_word: πρὸς νότον καὶ ἀπηλιώτην
  choice: nach Süden und Osten
  rationale: νότος und ἀπηλιώτης sind Richtungsangaben; letzteres bezeichnet den Osten als Richtung des Sonnenaufgangs.
- source_word: χειμάρρου
  choice: Wadi
  rationale: Der Ausdruck bezeichnet einen saisonal wasserführenden Bach beziehungsweise ein entsprechendes Trockental; ‚Wadi‘ ist geografisch präzise und im Deutschen gebräuchlich.
- source_word: ἡ λοιπὴ στρατεία τῶν Ἀσσυρίων
  choice: das übrige assyrische Heer
  rationale: στρατεία bezeichnet hier die Streitmacht; die Formulierung ist natürlich und bewahrt λοιπή als ‚übrig‘.
- source_word: αἱ σκηναὶ καὶ αἱ ἀποσκευαὶ αὐτῶν
  choice: ihre Zelte und ihr Tross
  rationale: ἀποσκευαί meint das mitgeführte Gepäck beziehungsweise die Ausrüstung eines Heeres; ‚Tross‘ bündelt dies im militärischen Kontext verständlich.
- source_word: ἐκάλυψαν πᾶν τὸ πρόσωπον τῆς γῆς
  choice: bedeckte die ganze Fläche des Landes
  rationale: Die bildhafte Wendung ‚das ganze Angesicht der Erde/des Landes‘ wird in natürlichem Deutsch wiedergegeben, ohne ihre Aussage über die flächendeckende Masse abzuschwächen.
