translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit klar erkennbarem militärischem und geografischem Zusammenhang. Die langen griechischen Satzreihen wurden maßvoll gegliedert. Eigennamen folgen in eingedeutschter Transliteration den griechischen Formen: Dotaim, Egrebel, Chus und Mochmur.'
