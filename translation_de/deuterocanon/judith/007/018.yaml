  to: Und die Söhne Esaus und die Söhne Ammons zogen hinauf und schlugen ihr Lager im Bergland gegenüber von Dotaim auf. Sie sandten einige aus ihren Reihen nach Süden und Osten[a], gegenüber von Egrebel, das nahe bei Chus liegt, das am Wadi Mochmur[b] liegt. Das übrige assyrische Heer lagerte in der Ebene und bedeckte die ganze Fläche des Landes. Ihre Zelte und ihr Tross lagerten dort in gewaltiger Menge, und sie waren überaus zahlreich.
