base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/021.yaml
  text: And the cisterns were being emptied, and they did not have enough water to drink for even one day, because it was given to them to drink by measure.
translation:
  language: de
  text: Und die Zisternen leerten sich, und sie hatten nicht genug Wasser, um auch nur einen Tag lang zu trinken, denn man gab ihnen das Wasser nur nach Maß zu trinken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in abgemessenen Mengen“ beziehungsweise „rationiert“. Wörtlich steht im Griechischen „nach Maß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκοι
  choice: Zisternen
  rationale: Im Zusammenhang der Belagerung bezeichnet das Wort ausgehobene Wasserspeicher; „Zisternen“ ist im Deutschen präzise und verständlich.
- source_word: ἐξεκενοῦντο
  choice: leerten sich
  rationale: Der Imperfekt beschreibt einen fortschreitenden Vorgang. „Leerten sich“ gibt die zunehmende Erschöpfung der Vorräte natürlich wieder, ohne einen nicht genannten Handelnden einzuführen.
- source_word: οὐκ εἶχον πεῖν … ὕδωρ
  choice: sie hatten nicht genug Wasser … zu trinken
  rationale: Zusammen mit εἰς πλησμονήν geht es nicht um völlige Wasserlosigkeit, sondern um eine für ausreichendes Trinken ungenügende Menge.
- source_word: εἰς πλησμονὴν
  choice: genug
  rationale: Die Wendung bedeutet wörtlich etwa „bis zur Fülle“ und bezeichnet hier eine ausreichende Menge. „Genug“ ist idiomatisches modernes Deutsch.
- source_word: ἡμέραν μίαν
  choice: auch nur einen Tag lang
  rationale: Die Übersetzung bringt die rhetorische Kraft der minimalen Zeitspanne im Deutschen natürlich zum Ausdruck, obwohl kein eigenes griechisches Wort für „auch nur“ steht.
- source_word: ἐν μέτρῳ
  choice: nur nach Maß
  rationale: „Nach Maß“ bewahrt das konkrete Bild des griechischen Ausdrucks und bezeichnet eine mengenmäßig begrenzte, rationierte Ausgabe; „nur“ macht diese Einschränkung im Deutschen deutlich.
- source_word: ἐδίδοσαν αὐτοῖς πεῖν
  choice: man gab ihnen das Wasser … zu trinken
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen natürlich mit „man“ wiedergegeben, ohne den im Griechischen nicht genannten Ausgebenden zu bestimmen. „Das Wasser“ greift das zuvor genannte ὕδωρ auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fortschreitende Wassermangel und die rationierte Ausgabe bleiben deutlich; die Syntax wurde gegenüber dem Griechischen leicht geglättet, ohne einen bestimmten Ausgebenden zu benennen.
