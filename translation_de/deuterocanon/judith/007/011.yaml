base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/011.yaml
  text: And now[a], master, do not fight against them as in a pitched battle, and not one man from your people will fall.
translation:
  language: de
  text: Und nun, Gebieter, kämpfe nicht gegen sie, wie man in Schlachtordnung kämpft[a], und kein einziger Mann aus deinem Volk wird fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wie eine Schlacht in Formation geführt wird“. Gemeint ist der herkömmliche Kampf in aufgestellter Schlachtordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: Gebieter
  rationale: Die Anrede bezeichnet einen menschlichen Herrn oder Befehlshaber. „Gebieter“ bewahrt die Unterscheidung zu κύριος und passt zum militärischen Kontext.
- source_word: μὴ πολέμει
  choice: kämpfe nicht
  rationale: Der verneinte Präsensimperativ formuliert ein direktes Verbot; „kämpfe nicht“ ist knapp, natürlich und bedeutungsnah.
- source_word: καθὼς γίνεται πόλεμος παρατάξεως
  choice: wie man in Schlachtordnung kämpft
  rationale: παράταξις bezeichnet die Aufstellung beziehungsweise Formation zum Kampf. Die Formulierung gibt den Gegensatz zu einer konventionellen offenen Formationsschlacht verständlich wieder, ohne die griechische Wendung unnötig einzuengen.
- source_word: οὐ πεσεῖται
  choice: wird fallen
  rationale: „Fallen“ bewahrt das militärische Bild des griechischen πίπτω und legt nicht ausdrücklicher als der Ausgangstext fest, ob damit der Tod gemeint ist.
- source_word: ἀνὴρ εἷς
  choice: kein einziger Mann
  rationale: Die ausdrücklich maskuline Einzahl mit εἷς wird samt ihrer Hervorhebung wiedergegeben.
- source_word: λαοῦ σου
  choice: aus deinem Volk
  rationale: λαός bedeutet grundsätzlich „Volk“. Trotz des militärischen Zusammenhangs steht im Griechischen kein spezieller Ausdruck für Heer oder Truppen.
theological_decisions:
- issue: Wiedergabe der Anrede δέσποτα in Abgrenzung von κύριος
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: Angeredet wird hier ein menschlicher Vorgesetzter. „Gebieter“ hält die Titel unterscheidbar und vermeidet eine unnötige Angleichung an die übliche Wiedergabe von κύριος.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bildsprache und die auffällige Verbindung der Aufforderung mit der Vorhersage durch „und“ bleiben erhalten; die Aussage wird nicht ausdrücklich als Folgesatz umformuliert.
