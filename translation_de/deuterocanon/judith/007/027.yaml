base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/027.yaml
  text: For it is better for us to become plunder for them[a]; for we will become servants, and our lives will be spared, and we will not see with our own eyes the death of our little children[d][c][b], and our wives and our children breathing out their lives.
translation:
  language: de
  text: Denn es ist besser für uns, ihnen zur Beute zu fallen[a]; denn wir werden Sklaven werden und am Leben bleiben[b], und wir werden nicht mit eigenen Augen[c] den Tod unserer kleinen Kinder sehen und miterleben, wie unsere Frauen und Kinder ihr Leben aushauchen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „für sie zur Beute zu werden“; auch „ihnen als Raubgut anheimzufallen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unsere Seele wird leben“, das heißt: Unser Leben bleibt erhalten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „vor unseren Augen“.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: „wie unseren Frauen und Kindern das Leben schwindet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: besser
  rationale: Der Komparativ bezeichnet hier angesichts der drohenden Lage die vorteilhaftere von zwei schlimmen Möglichkeiten.
- source_word: γενηθῆναι αὐτοῖς εἰς διαρπαγήν
  choice: ihnen zur Beute zu fallen
  rationale: Die natürliche deutsche Wendung bewahrt den Gedanken, den Eroberern zur gewaltsamen Besitznahme ausgeliefert zu werden.
- source_word: δούλους
  choice: Sklaven
  rationale: Im Zusammenhang einer erzwungenen Unterwerfung nach der Kapitulation ist der unfreie Status entscheidend; „Diener“ wäre zu schwach.
- source_word: ζήσεται ἡ ψυχὴ ἡμῶν
  choice: am Leben bleiben
  rationale: Die wörtliche Formulierung „unsere Seele wird leben“ ist hier eine semitisch geprägte Aussage über die Bewahrung des Lebens; die deutsche Wiedergabe gibt den idiomatischen Sinn wieder.
- source_word: τὸν θάνατον τῶν νηπίων ἡμῶν
  choice: den Tod unserer kleinen Kinder
  rationale: νήπια bezeichnet sehr junge Kinder, ohne hier zwingend ausschließlich Säuglinge zu meinen.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: mit eigenen Augen
  rationale: Die idiomatische deutsche Formulierung bringt das unmittelbare persönliche Mitansehen zum Ausdruck.
- source_word: ἐκλειπούσας τὰς ψυχὰς αὐτῶν
  choice: ihr Leben aushauchen
  rationale: Die Wendung beschreibt bildhaft, wie das Leben schwindet; „ihr Leben aushauchen“ bewahrt das Sterbebild in verständlichem, würdigem Deutsch.
theological_decisions:
- issue: Wiedergabe von δούλους im Kontext einer Eroberung
  choice: Sklaven
  alternative: Diener / Knechte
  rationale: Die Sprecher stellen den Tod der erzwungenen Unterwerfung gegenüber. Daher muss der unfreie, gewaltsam auferlegte Status erkennbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zwar … aber“ macht den im Griechischen durch die Abfolge ausgedrückten Gegensatz zwischen Versklavung und Überleben natürlich verständlich. „Miterleben“ verdeutlicht, dass das abschließende Partizip weiterhin vom Verb des Sehens abhängt, ohne die erschütternde Bildsprache zu glätten.
