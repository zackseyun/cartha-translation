  text: And each of them took up his weapons of war, and after kindling fires on their towers, they remained on guard through that whole night.
translation:
  language: de
  text: Und jeder nahm seine Waffen, und nachdem sie auf ihren Türmen Feuer angezündet hatten, hielten sie jene ganze Nacht hindurch Wache.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: nahm
  rationale: Das Partizip bezeichnet hier das Aufnehmen beziehungsweise Bereitmachen der Waffen; im Deutschen gibt „nahm seine Waffen“ den Vorgang natürlich und knapp wieder.
- source_word: ἕκαστος
  choice: jeder
  rationale: Bewahrt den ausdrücklich distributiven Sinn, ohne ein im Griechischen nicht genanntes „Mann“ hinzuzufügen.
- source_word: τὰ σκεύη τὰ πολεμικὰ αὐτῶν
  choice: seine Waffen
  rationale: Im militärischen Zusammenhang bezeichnet die Wortgruppe die persönliche Kriegsausrüstung; „Waffen“ ist im modernen Deutsch klar und idiomatisch, während das Possessivpronomen die distributive Zuordnung zu ἕκαστος wiedergibt.
- source_word: ἀνακαύσαντες πυράς
  choice: nachdem sie … Feuer angezündet hatten
  rationale: Die Vorzeitigkeit des Aoristpartizips gegenüber dem anschließenden Wachehalten wird ausdrücklich bewahrt. Der griechische Plural πυράς lässt sich im Deutschen idiomatisch mit dem kollektiven Singular „Feuer“ wiedergeben.
- source_word: ἐπὶ τοὺς πύργους αὐτῶν
  choice: auf ihren Türmen
  rationale: Gibt die räumliche Beziehung von ἐπί mit Akkusativ in diesem Zusammenhang unmittelbar wieder; „ihren“ bewahrt den griechischen Bezug, ohne die Identität der Besitzer weiter festzulegen.
- source_word: ἔμενον φυλάσσοντες
  choice: hielten … Wache
  rationale: Die Verbindung bezeichnet fortgesetzte Wachsamkeit. „Wache halten“ ist die natürliche deutsche Wendung und drückt den andauernden militärischen Wachdienst aus.
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: jene ganze Nacht hindurch
  rationale: Bewahrt sowohl die Betonung der vollständigen Dauer als auch die demonstrative Bestimmung „jene“.
