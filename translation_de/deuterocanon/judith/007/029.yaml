  text: And there was great weeping in the midst of the whole assembly[a], all together, and they cried out to the Lord God with a loud voice.
translation:
  language: de
  text: Da erhob sich mitten in der ganzen Versammlung[a] ein großes Weinen; alle gemeinsam schrien sie mit lauter Stimme zum Herrn, zu Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: da erhob sich
  rationale: Die Wendung gibt die griechische Erzählformel idiomatisch wieder und verbindet sie natürlich mit dem einsetzenden Weinen.
- source_word: κλαυθμὸς μέγας
  choice: ein großes Weinen
  rationale: κλαυθμός bezeichnet hörbares Weinen oder Klagen; die Wiedergabe bewahrt μέγας direkt, ohne den Ausdruck auf eine förmliche Totenklage einzuengen.
- source_word: ἐν μέσῳ τῆς ἐκκλησίας πάντων
  choice: mitten in der ganzen Versammlung
  rationale: Die Formulierung wahrt sowohl den Sinn von ἐν μέσῳ als auch die umfassende Aussage von πάντων und versteht ἐκκλησία kontextgemäß als die versammelte Gemeinschaft.
- source_word: ὁμοθυμαδόν
  choice: alle gemeinsam
  rationale: Der Ausdruck hebt das einmütige, gemeinsame Handeln aller hervor; die gesonderte Wiedergabe erhält diese Betonung.
- source_word: ἐβόησαν
  choice: schrien sie
  rationale: Das Verb bezeichnet hier einen lauten, dringlichen Ruf an Gott; „schrien“ bewahrt die Intensität und wird durch das Ziel „zum Herrn“ als Hilferuf verständlich.
- source_word: πρὸς Κύριον τὸν θεὸν
  choice: zum Herrn, ihrem Gott
  rationale: Der bestimmte Ausdruck τὸν θεόν steht appositionell zu Κύριον. Im Deutschen ist „zum Herrn, ihrem Gott“ natürlich und bezeichnet den Gott der versammelten Menschen, ohne eine vom Kontext getrennte Titelformel zu erzeugen.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Dies ist die idiomatische deutsche Wiedergabe des instrumentalen Dativs und der in diesem Zusammenhang gemeinten Lautstärke von μεγάλῃ.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR; Gebieter
  rationale: „Herr“ ist die sachgemäße und traditionsbewusste Wiedergabe von κύριος in der Anrede Gottes; „Gebieter“ wäre im Gebetskontext unnötig eng, während „HERR“ eine nicht ausdrücklich im griechischen Text markierte Rückübersetzung voraussetzen könnte.
- issue: Wiedergabe von ἐκκλησία
  choice: Versammlung
  alternative: Gemeinde
  rationale: Im erzählerischen Kontext des Juditbuches bezeichnet ἐκκλησία die zusammengekommene Gemeinschaft. „Versammlung“ vermeidet, dem Text einen späteren spezifisch kirchlichen Sinn aufzuerlegen.
- issue: Bezug des Artikels in τὸν θεόν
  choice: ihrem Gott
  alternative: Gott; dem Gott
  rationale: Die Apposition identifiziert den Herrn als Gott. Das Possessivpronomen macht die im Kontext naheliegende Beziehung der Rufenden zu Gott idiomatisch sichtbar, ohne mehrere Gottheiten anzudeuten; formal näher möglich bleibt „zum Herrn, Gott“ beziehungsweise „zum Herrn, dem Gott“, was im Deutschen jedoch unnatürlich klingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt die feierliche Intensität des gemeinschaftlichen Weinens und Rufens, vermeidet aber altertümliche Wendungen wie „einmütiglich“ oder „mit großer Stimme“.
