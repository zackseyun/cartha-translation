  yaml_path: translation/deuterocanon/judith/007/015.yaml
  text: And you will repay them with an evil recompense[b][a], because they rebelled and did not meet you in peace.
translation:
  language: de
  text: Und du wirst ihnen Böses vergelten[a], weil sie sich aufgelehnt haben und dir nicht in Frieden entgegengegangen sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „du wirst ihnen eine böse Vergeltung vergelten“; im Griechischen verstärken das stammverwandte Verb und Substantiv den Gedanken der Vergeltung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sie sind deinem Angesicht nicht in Frieden entgegengegangen“.'
    reason: literal_rendering
lexical_decisions:
- source_word: ἀνταποδώσεις … ἀνταπόδομα πονηρόν
  choice: du wirst ihnen Böses vergelten
  rationale: Die griechische Verbindung aus stammverwandtem Verb und Substantiv verstärkt den Gedanken der Vergeltung. Die natürliche deutsche Formulierung bewahrt sowohl den Vergeltungssinn als auch die negative Wertung von πονηρόν; die innere Akkusativkonstruktion wird in einer Fußnote kenntlich gemacht.
- source_word: ἀνθʼ ὧν
  choice: weil
  rationale: Die Wendung bezeichnet hier den Grund beziehungsweise Anlass der Vergeltung; „weil“ gibt diesen Zusammenhang klar und idiomatisch wieder.
- source_word: ἐστασίασαν
  choice: sie sich aufgelehnt haben
  rationale: Das Verb bezeichnet rebellisches oder aufrührerisches Verhalten. „Sich auflehnen“ ist im Deutschen natürlich und lässt den genauen politischen oder militärischen Grad der Auflehnung offen.
- source_word: οὐκ ἀπήντησαν
  choice: nicht … entgegengegangen sind
  rationale: ἀπαντάω kann das Entgegengehen zur Begegnung bezeichnen. Die Wiedergabe erhält diese Bewegungsnuance deutlicher als das bloße „begegnen“.
- source_word: τῷ προσώπῳ σου
  choice: dir
  rationale: Wörtlich steht „deinem Angesicht“; idiomatisch ist damit die Person selbst gemeint. „Dir“ ist im modernen Deutschen klar und nicht unnötig hölzern.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: Die Formulierung bewahrt die Breite des griechischen Ausdrucks, der eine friedliche Begegnung ebenso wie friedliche Absicht bezeichnen kann.
theological_decisions:
- issue: Charakter der an Gott gerichteten Vergeltungsaussage
  choice: 'Direkte zukünftige Aussage an Gott: „du wirst ihnen Böses vergelten“'
  alternative: 'Ausdrückliche Bitte: „Vergelte ihnen Böses“'
  rationale: Die griechische Futurform ist als zuversichtliche Aussage oder kontextuell als appellativer Zukunftssatz verständlich. Die Übersetzung erhält die grammatische Form und legt sie nicht eindeutig als Imperativ aus.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung ist bewusst direkt und bewahrt die Härte von πονηρόν, ohne sie durch eine genauere Art von Strafe oder Unheil auszudeuten.
