base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/004.yaml
  text: But the sons of Israel[a], when they saw their great number, were greatly troubled, and each said to his neighbor, “Now these men will lick up the whole face of the land[b], and neither the high mountains nor the ravines nor the hills will bear their weight.”
translation:
  language: de
  text: 'Als aber die Söhne Israels deren große Menge sahen, gerieten sie in große Unruhe. Jeder sagte zu seinem Nachbarn: »Jetzt werden diese Leute die ganze Oberfläche des Landes[b] auflecken[a], und weder die hohen Berge noch die Schluchten noch die Hügel werden ihr Gewicht tragen können.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „verschlingen“. Das griechische Verb bedeutet wörtlich „auflecken“ und bewahrt das Bild eines alles verzehrenden Vordringens.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „das Angesicht des ganzen Landes“. Die Wendung bezeichnet dessen gesamte Oberfläche oder Ausdehnung.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ Ἰσραήλ
  choice: Als aber die Söhne Israels
  rationale: Die formnahe Wiedergabe bewahrt die biblische Ausdrucksweise und den Gegensatz, den δέ im Zusammenhang markiert.
- source_word: ὡς ἴδον αὐτῶν τὸ πλῆθος
  choice: sahen, wie groß ihre Zahl war
  rationale: πλῆθος bezeichnet hier die überwältigende Menge des Heeres. Die Formulierung ist im heutigen Deutsch natürlicher als „ihre Menge sahen“.
- source_word: ἐταράχθησαν σφόδρα
  choice: gerieten sie in große Unruhe
  rationale: ταράσσω beschreibt starke innere Erschütterung oder Beunruhigung, ohne zwingend völlige Todesangst auszudrücken.
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: Einer sagte zum anderen
  rationale: Diese idiomatische deutsche Wendung gibt wieder, dass jeder mit dem jeweils Nahestehenden sprach.
- source_word: Νῦν ἐκλείξουσιν οὗτοι
  choice: Jetzt werden diese Leute … auflecken
  rationale: ἐκλείχω bedeutet wörtlich „auflecken“ und zeichnet das Heer als eine alles verzehrende Masse. Das anschauliche Bild bleibt im Haupttext erhalten.
- source_word: τὸ πρόσωπον τῆς γῆς πάσης
  choice: die ganze Fläche des Landes
  rationale: πρόσωπον bezeichnet in dieser Wendung die sichtbare Oberfläche beziehungsweise Ausdehnung des Landes. „Fläche“ vermittelt das Bild verständlich, ohne den Sinn auf bloßen Grundbesitz zu verengen.
- source_word: οὔτε τὰ ὄρη τὰ ὑψηλὰ οὔτε αἱ φάραγγες οὔτε οἱ βουνοί
  choice: weder die hohen Berge noch die Schluchten noch die Hügel
  rationale: Die drei unterschiedlichen Geländeformen bleiben unterschieden; φάραγγες bezeichnet enge Täler, Schluchten oder Klammen.
- source_word: ὑποστήσονται τὸ βάρος αὐτῶν
  choice: werden ihr Gewicht tragen können
  rationale: Die Wendung bezeichnet das Standhalten oder Tragen unter der ungeheuren Last des Heeres. Die deutsche Fassung erhält dieses körperlich-räumliche Bild.
