    rationale: In „Als aber die Söhne Israels sahen, wie groß ihre Zahl war“ kann „ihre“ grammatisch die Söhne Israels bezeichnen. αὐτῶν bezieht sich hier jedoch auf die zuvor erwähnten Gegner und deren Menge.
  - severity: low
    issue: Fußnote b ist inhaltlich und positionell ungenau
    rationale: Die Fußnote sollte die idiomatische Wendung τὸ πρόσωπον τῆς γῆς erklären und direkt bei „Oberfläche des Landes“ stehen. Die Aussage, „Land“ könne hier auch „Erde“ bedeuten, ist als Übersetzungshinweis weniger präzise und kann den kontextuell naheliegenden Bezug auf das Land verwischen.
