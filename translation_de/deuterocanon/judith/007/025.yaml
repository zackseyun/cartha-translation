base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/025.yaml
  text: And now there is no one to help us[a]; rather, God has delivered us into their hands[c][b], to be laid low before them in thirst and great destruction.
translation:
  language: de
  text: Und nun gibt es niemanden, der uns hilft. Vielmehr hat Gott uns in ihre Hände verkauft[a], damit wir vor ihnen durch Durst und großes Verderben niedergestreckt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat uns in ihre Hände ausgeliefert“. Das griechische Verb bedeutet wörtlich „verkaufen“ und zeichnet das starke Bild einer Übergabe in feindliche Gewalt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „in Durst und großem Verderben“ oder „durch Durst und großes Verderben“. Die griechische Präposition kann hier sowohl die Umstände als auch das Mittel des Untergangs bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βοηθός
  choice: jemand, der uns hilft
  rationale: Der substantivische Ausdruck bedeutet wörtlich „unser Helfer“. Die Umschreibung ist im modernen Deutsch natürlich und bewahrt den persönlichen Sinn.
- source_word: πέπρακεν
  choice: hat … verkauft
  rationale: Das Perfekt von πιπράσκω/πράσκω bezeichnet wörtlich das Verkaufen. Die starke Metapher, nach der Gott das Volk der Feindesmacht überlassen hat, wird nicht abgeschwächt.
- source_word: εἰς τὰς χεῖρας αὐτῶν
  choice: in ihre Hände
  rationale: Die geläufige biblische Wendung bezeichnet die Auslieferung an fremde Gewalt und ist auch im Deutschen verständlich.
- source_word: τοῦ καταστρωθῆναι
  choice: damit wir … niedergestreckt werden
  rationale: Der substantivierte Infinitiv kann Zweck oder Folge ausdrücken. „Niedergestreckt werden“ gibt Niederlage und Vernichtung wieder, ohne ein bestimmtes Tötungsgeschehen vorauszusetzen.
- source_word: ἐναντίον αὐτῶν
  choice: vor ihnen
  rationale: Die Wendung bezeichnet hier am ehesten die Gegenwart beziehungsweise das Angesicht der Feinde, vor denen das Volk zu Fall kommt.
- source_word: ἐν δίψει
  choice: in Durst
  rationale: Die knappe Formulierung hält offen, ob ἐν einen Zustand oder das Mittel des Untergangs bezeichnet.
- source_word: ἀπωλείᾳ μεγάλῃ
  choice: großem Verderben
  rationale: „Verderben“ umfasst Untergang, Ruin und Vernichtung, ohne die späteren theologischen Nebenbedeutungen von „Verdammnis“ einzutragen.
theological_decisions:
- issue: Göttliches Handeln bei der Niederlage des Volkes
  choice: Gott hat uns in ihre Hände verkauft
  alternative: Gott hat uns in ihre Hände ausgeliefert
  rationale: Der griechische Text schreibt die bedrängte Lage ausdrücklich Gottes Handeln zu. Das starke Bild des Verkaufens bewahrt diese theologische Spannung, statt sie durch eine mildere Formulierung aufzulösen.
- issue: Zweck oder Folge der Auslieferung
  choice: damit wir … niedergestreckt werden
  alternative: sodass wir … niedergestreckt werden
  rationale: Der Genitiv des substantivierten Infinitivs lässt eine zweckhafte oder folgerichtige Beziehung zu. Die Hauptfassung folgt der naheliegenden Zweckform, ohne daraus eine weitergehende dogmatische Aussage über Gottes Absicht abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Der Gedankenstrich lässt die verdichtete griechische Schlusswendung hervortreten; „in Durst und großem Verderben“ bleibt absichtlich ungeglättet, um die Mehrdeutigkeit von Zustand und Mittel zu erhalten.
