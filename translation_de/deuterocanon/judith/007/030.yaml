base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/030.yaml
  text: And Uzziah said to them[a], “Take courage, brothers; let us hold out for five more days, within which the Lord our God will turn his mercy toward us, for he will not abandon us forever.”
translation:
  language: de
  text: 'Und Usija sagte zu ihnen: „Fasst Mut, Brüder! Lasst uns noch fünf Tage durchhalten; in diesen wird der Herr, unser Gott, uns sein Erbarmen zuwenden, denn er wird uns nicht für immer verlassen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er wird uns nicht völlig verlassen.“ Wörtlich steht im Griechischen „bis ans Ende“; die Wendung kann endgültiges oder vollständiges Verlassen bezeichnen.'
    reason: lexikalische Alternative und Bewahrung der Mehrdeutigkeit von εἰς τέλος
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: Fasst Mut
  rationale: Der pluralische Imperativ fordert unmittelbar zum Mut auf; die Formulierung ist natürlich, klar und würdig.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Gibt die grammatisch maskuline direkte Anrede des griechischen Textes ohne inklusive Erweiterung wieder.
- source_word: διακαρτερήσωμεν
  choice: Lasst uns … durchhalten
  rationale: Der hortative Konjunktiv bezeichnet gemeinsames weiteres Ausharren unter dem Druck der Belagerung.
- source_word: ἔτι πέντε ἡμέρας
  choice: noch fünf Tage
  rationale: ἔτι bezeichnet die zusätzliche Dauer; im Deutschen ist diese Wendung knapp und idiomatisch.
- source_word: ἐν αἷς
  choice: In dieser Zeit
  rationale: Bezieht sich auf die genannten fünf Tage und wahrt den zeitlichen Rahmen, ohne die Wendung unnatürlich wörtlich wiederzugeben.
- source_word: ἐπιστρέψει … τὸ ἔλεος αὐτοῦ ἐφʼ ἡμᾶς
  choice: wird … uns sein Erbarmen wieder zuwenden
  rationale: ἐπιστρέψει ist transitiv mit τὸ ἔλεος als Objekt; „wieder zuwenden“ bildet die gerichtete Bewegung des Erbarmens zu den Bedrängten natürlich ab.
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: der Herr, unser Gott
  rationale: Entspricht dem griechischen Gottestitel und klingt im modernen Deutschen natürlich; das Komma macht die appositionelle Beziehung deutlich.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: sein Erbarmen
  rationale: „Erbarmen“ trifft ἔλεος im Zusammenhang göttlicher Zuwendung und ist im Deutschen würdig und geläufig.
- source_word: οὐ γὰρ ἐγκαταλείψει ἡμᾶς εἰς τέλος
  choice: denn er wird uns nicht für immer verlassen
  rationale: ἐγκαταλείπω bedeutet verlassen oder im Stich lassen; εἰς τέλος kann idiomatisch endgültige beziehungsweise dauernde Verlassenheit ausdrücken. Die Fußnote wahrt die mögliche Nuance völliger Verlassenheit.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für Israels Gott im griechischen deuterokanonischen Text
  choice: Herr
  alternative: HERR
  rationale: Die Vorlage bietet κύριος und nicht unmittelbar das hebräische Tetragramm; „Herr“ wahrt daher die griechische Textgestalt, ohne eine hebräische Ausgangsform vorauszusetzen.
- issue: Geschlechtsspezifische Anrede ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die griechische Form ist maskulin plural. Eine inklusive Ausweitung wird nicht in den Haupttext eingetragen, da sie vom Wortlaut nicht ausdrücklich gefordert wird.
- issue: Bedeutungsumfang von εἰς τέλος
  choice: nicht für immer verlassen
  alternative: nicht völlig verlassen
  rationale: Die Wendung kann zeitlich „bis ans Ende/für immer“ oder resultativ „völlig/endgültig“ verstanden werden. Der Haupttext verwendet die natürliche zeitliche Lesart; die alternative Nuance bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Bibelton. Kurze Aufforderungssätze geben die Dringlichkeit der Belagerungsszene wieder. Der Fußnotenmarker steht nach dem Satz, auf den sich die Bedeutungsalternative bezieht.
