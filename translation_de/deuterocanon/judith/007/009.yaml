    rationale: „Damit es keinen Bruch ... gibt“ kann einen gegenwärtigen Sachverhalt nahelegen. „Damit es ... nicht zu einem Bruch kommt“ gibt γένηται als drohendes künftiges Eintreten natürlicher wieder.
