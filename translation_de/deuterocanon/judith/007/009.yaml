  text: Let our lord hear a word[b][a], so that there may not be a breach in your force.
translation:
  language: de
  text: Unser Herr möge doch ein Wort anhören, damit es in Eurer Streitmacht nicht zu einem Bruch kommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit Eure Streitmacht keinen schweren Schaden erleidet“. Das griechische Wort für „Bruch“ kann einen schweren Schaden oder Zusammenbruch bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουσάτω δὴ
  choice: möge doch … anhören
  rationale: Der Aoristimperativ in der dritten Person wird als höflich-eindringliche Aufforderung wiedergegeben; „doch“ nimmt die verstärkende beziehungsweise höfliche Kraft von δή auf.
- source_word: λόγον
  choice: ein Wort
  rationale: Die knappe Wendung bleibt nah am Griechischen und bezeichnet hier eine kurze Äußerung oder einen Rat.
- source_word: ὁ δεσπότης ἡμῶν
  choice: unser Herr
  rationale: δεσπότης bezeichnet einen Herrschafts- oder Befehlsträger; in der ehrerbietigen Anrede eines militärischen Vorgesetzten ist „unser Herr“ passend und würdevoll.
- source_word: ἵνα μὴ γένηται
  choice: damit es keinen … gibt
  rationale: Die Formulierung gibt den verneinten Zwecksatz natürlich wieder und bewahrt dessen auf ein drohendes Geschehen gerichteten Sinn.
- source_word: θραῦσμα
  choice: Bruch
  rationale: Das seltene Substantiv bezeichnet wörtlich etwas Zerbrochenes beziehungsweise einen Bruch. „Bruch“ wahrt die Bildlichkeit und legt die genaue Art des militärischen Schadens nicht vorschnell fest.
- source_word: ἐν τῇ δυνάμει σου
  choice: in deiner Streitmacht
  rationale: δύναμις hat hier im Kontext wahrscheinlich militärischen Sinn. „Streitmacht“ bezeichnet die Truppen unter dem Befehl des Angeredeten und bewahrt den Singular.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle und ehrerbietige Anrede. Die leicht formelle Konstruktion „möge doch“ entspricht dem höflichen Rat an einen militärischen Vorgesetzten; die ungewöhnliche Bildsprache „Bruch in deiner Streitmacht“ bleibt im Haupttext bewusst erhalten.
