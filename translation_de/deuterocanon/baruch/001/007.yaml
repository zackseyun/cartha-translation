base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/007.yaml
  text: and they sent to Jerusalem[a], to Jehoiakim son of Hilkiah, son of Shallum, the priest, and to the priests, and to all the people who were found with him in Jerusalem,
translation:
  language: de
  text: Und sie schickten nach Jerusalem zu Jojakim, dem Sohn Hilkijas, des Sohnes Schallums, dem Priester, sowie zu den Priestern und zum ganzen Volk, das mit ihm[a] in Jerusalem angetroffen wurde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit ihm“ (Einzahl). Worauf sich „ihm“ bezieht, wird in diesem Vers nicht ausdrücklich gesagt; möglich ist auch ein allgemeineres Verständnis im Sinn der dort Anwesenden.'
    reason: Die Einzahl des griechischen Pronomens und ihr nicht eindeutiger Bezug sollen sichtbar bleiben.
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: sie schickten
  rationale: Das Verb bezeichnet schlicht das Senden. Wie im Griechischen bleibt das gesandte Objekt in diesem Vers unausgesprochen.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Bei Städtenamen ist „nach“ im Deutschen die natürliche Wiedergabe einer Bewegung zu einem Ort.
- source_word: πρὸς Ἰωακεὶμ ... τὸν ἱερέα
  choice: zu Jojakim, dem Sohn Hilkijas, des Sohnes Schallums, dem Priester
  rationale: πρός kennzeichnet hier die Empfänger. ἱερεύς bedeutet „Priester“; der Quelltext nennt Jojakim nicht ausdrücklich „Hohepriester“.
- source_word: τοὺς ἱερεῖς
  choice: zu den Priestern
  rationale: Direkte und im Deutschen natürliche Wiedergabe des Plurals von ἱερεύς.
- source_word: πάντα τὸν λαόν
  choice: zum ganzen Volk
  rationale: Die kollektive Einzahl des griechischen Ausdrucks wird formal und idiomatisch bewahrt.
- source_word: τοὺς εὑρεθέντας
  choice: das ... angetroffen wurde
  rationale: „Angetroffen wurde“ bewahrt die Grundbedeutung des Partizips von εὑρίσκω besser als das glattere „anwesend war“. Wegen des deutschen Bezugsworts „Volk“ steht die Form grammatisch im Singular.
- source_word: μετ᾽ αὐτοῦ
  choice: bei ihm
  rationale: Der überlieferte griechische Text hat das Singularpronomen αὐτοῦ. „Bei ihm“ gibt die gemeinte Begleitung beziehungsweise Anwesenheit in diesem Zusammenhang natürlich wieder, ohne den Singular zu „bei ihnen“ zu normalisieren.
