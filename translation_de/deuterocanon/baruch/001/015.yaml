  text: And you shall say[a], ‘To the Lord our God belongs righteousness, but to us shame of face, as it is this day—to the people of Judah and to the inhabitants of Jerusalem,’
translation:
  language: de
  text: 'Und ihr sollt sagen: »Dem Herrn, unserem Gott, gehört die Gerechtigkeit[a], uns aber die Schande, wie sie heute die Menschen in Juda und die Bewohner Jerusalems trifft.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtschaffenheit“ oder „Gerechtigkeit“. Das griechische Wort δικαιοσύνη kann sowohl Gottes moralische Rechtschaffenheit als auch gerechtes Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖτε
  choice: ihr sollt sagen
  rationale: Der Futur Indikativ hat im Zusammenhang anweisende Kraft; die Formulierung wahrt den feierlich-liturgischen Ton.
- source_word: τῷ κυρίῳ θεῷ ἡμῶν
  choice: bei dem Herrn, unserem Gott
  rationale: Der Dativ bezeichnet hier die Zuordnung; diese Wiedergabe bildet zugleich den parallelen Gegensatz zu »bei uns« ab.
- source_word: ἡ δικαιοσύνη
  choice: ist Gerechtigkeit
  rationale: Die elliptische Nominalkonstruktion wird im Deutschen durch »ist« ergänzt. »Gerechtigkeit« kann sowohl moralische Rechtschaffenheit als auch gerechtes Handeln bezeichnen.
- source_word: αἰσχύνη τῶν προσώπων
  choice: Scham im Gesicht
  rationale: Die semitisierende Wendung wird nahe am Bild und dennoch verständlich wiedergegeben; gemeint ist eine am Gesicht erkennbare beziehungsweise öffentliche Beschämung.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: wie es an diesem Tag der Fall ist
  rationale: Die Formel verweist auf die gegenwärtig sichtbare Lage, ohne sie stärker auszudeuten.
- source_word: ἀνθρώπῳ Ἰούδα
  choice: bei den Menschen von Juda
  rationale: Der formal singularische Ausdruck ist kollektiv gebraucht. »Menschen von Juda« wahrt diesen kollektiven Bezug, ohne ihn ausschließlich männlich zu verengen.
- source_word: τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: bei den Bewohnern Jerusalems
  rationale: Natürliche und genaue Wiedergabe des substantivierten Partizips.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη im Bußbekenntnis
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; gerechtes Handeln
  rationale: »Gerechtigkeit« erhält die Spannung zwischen Gottes moralischem Rechtsein und seinem gerechten Handeln, während das Volk seine eigene Schande bekennt.
- issue: Zuordnung von Gerechtigkeit und Scham
  choice: Bei dem Herrn ... ist Gerechtigkeit, bei uns aber Scham
  alternative: Dem Herrn ... gehört die Gerechtigkeit, uns aber die Schande
  rationale: Die gewählte parallele Konstruktion gibt den griechischen Dativkontrast wieder, ohne die Aussage auf Besitz im engen Sinn festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Bekenntniston. Die bildhafte Wendung »Scham im Gesicht« und die kollektive Formulierung »Menschen von Juda« bleiben bewusst quellennah.
