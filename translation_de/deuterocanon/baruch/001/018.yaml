translation:
  language: de
  text: Und wir widersetzten uns ihm und hörten nicht auf die Stimme des Herrn, unseres Gottes, und lebten nicht nach den Anordnungen des Herrn, die er uns vorgelegt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um in den Anordnungen des Herrn, die er uns vorgelegt hat, zu gehen“ oder „zu wandeln“; die Wendung bezeichnet die Lebensführung nach ihnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπειθήσαμεν αὐτῷ
  choice: wir waren ihm ungehorsam
  rationale: Gibt den Aorist von ἀπειθέω samt dem Dativbezug αὐτῷ knapp und natürlich wieder, ohne die anschließende Wendung vom Hören vorschnell damit zu verschmelzen.
- source_word: οὐκ ἠκούσαμεν τῆς φωνῆς
  choice: hörten nicht auf die Stimme
  rationale: Bewahrt das griechische Bild des Hörens auf eine Stimme; der im Kontext enthaltene Gehorsamsaspekt bleibt erkennbar, wird aber nicht an die Stelle des Bildes gesetzt.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: des Herrn, unseres Gottes
  rationale: Folgt dem griechischen κύριος mit „Herr“ und gibt die Apposition in natürlichem, würdigem Deutsch wieder.
- source_word: πορεύεσθαι τοῖς προστάγμασιν
  choice: indem wir nicht nach den Anordnungen … lebten
  rationale: πορεύεσθαι bezeichnet hier bildhaft die Lebensführung. „Leben nach“ ist im modernen Deutsch verständlicher als „wandeln in“, während eine Fußnote das zugrunde liegende Bewegungsbild festhält. Die Negation wird sinngemäß aus dem regierenden οὐκ ἠκούσαμεν aufgenommen.
- source_word: τοῖς προστάγμασιν
  choice: nach den Anordnungen
  rationale: πρόσταγμα bezeichnet etwas Angeordnetes oder Vorgeschriebenes. „Anordnungen“ wahrt diese Nuance und unterscheidet den Ausdruck von allgemeineren Wörtern für Gebote.
- source_word: ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: die er uns vorgelegt hatte
  rationale: Gibt die wörtlich räumliche Wendung „vor unser Angesicht gab“ idiomatisch als das Vorlegen verbindlicher Anordnungen wieder.
theological_decisions:
- issue: Gehorsamsnuance in οὐκ ἠκούσαμεν τῆς φωνῆς
  choice: hörten nicht auf die Stimme
  alternative: gehorchten der Stimme nicht
  rationale: Die gewählte Fassung bewahrt die ausdrückliche Hörmetapher und lässt zugleich ihre biblisch naheliegende Bedeutung des Gehorchens offen.
- issue: Wiedergabe von κύριος im griechischen deuterokanonischen Quelltext
  choice: Herr
  alternative: HERR
  rationale: Da der unmittelbare Quelltext griechisch ist und κύριος bietet, folgt „Herr“ dem sichtbaren Ausgangstext, ohne eine nicht unmittelbar bezeugte Schreibung des Gottesnamens einzutragen.
- issue: Bildhafte Lebensführung in πορεύεσθαι
  choice: nach den Anordnungen … lebten
  alternative: in den Anordnungen … wandelten
  rationale: „Leben nach“ vermittelt die ethische Bedeutung in gegenwärtigem Standarddeutsch; die Fußnote bewahrt das wörtliche Bild und verhindert, dass dessen Vorhandensein verborgen bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von Ungehorsam und fehlendem Hören bleibt erhalten; archaisches „wandeln“ steht nur als wörtliche Alternative in der Fußnote.
