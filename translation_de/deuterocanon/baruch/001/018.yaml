  naturalness: Modernes, würdiges Deutsch ist überwiegend erreicht. „Wir waren ihm ungehorsam“ ist möglich, aber die aktive aoristische Aussage wird mit „wir widersetzten uns ihm“ unmittelbarer wiedergegeben. Die bisherige „indem“-Konstruktion ist stilistisch und syntaktisch weniger natürlich.
  terminology: „Herr“ für κύριος, „unser Gott“ und „Anordnungen“ für προστάγματα sind vertretbar. „Anordnungen“ bewahrt den Charakter des vorgeschrieben Angeordneten. Die Fußnote sollte an der Formulierung „nach … leben“ ansetzen und das Bewegungsbild als Alternative nennen.
