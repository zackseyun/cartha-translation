- from: Und wir waren ihm ungehorsam und hörten nicht auf die Stimme des Herrn, unseres Gottes, indem wir nicht nach den Anordnungen des Herrn lebten,[a] die er uns vorgelegt hatte.
  to: Und wir widersetzten uns ihm und hörten nicht auf die Stimme des Herrn, unseres Gottes, und lebten nicht nach den Anordnungen des Herrn, die er uns vorgelegt hatte.[a]
  rationale: Die Revision ersetzt die unnatürliche und syntaktisch verschiebende „indem“-Konstruktion durch zwei gleichgeordnete Aussagen. So bleiben sowohl das Nicht-Hören auf Gottes Stimme als auch die daraus hervorgehobene, nicht gelebte Befolgung seiner Anordnungen klar. Die Fußnote bewahrt das Bild von πορεύεσθαι, ohne es im Haupttext archaisch zu erzwingen.
