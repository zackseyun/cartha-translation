base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/010.yaml
  text: And they said[a], ‘Behold, we have sent you money; and with the money buy burnt offerings and sin offerings and frankincense, and prepare a grain offering and offer them on the altar of the Lord our God,’
translation:
  language: de
  text: 'Und sie sagten: »Seht, wir haben euch Geld geschickt. Kauft für das Geld Brandopfer, Sündopfer und Weihrauch, bereitet ein Getreideopfer[a] zu und bringt alles auf dem Altar des Herrn, unseres Gottes, dar.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort μάννα bezeichnet hier eine Getreidegabe als Opfer, nicht die Manna genannte Nahrung aus der Wüstenzeit.
    reason: lexikalische Alternative und mögliche Verwechslung
lexical_decisions:
- source_word: ἀργύριον
  choice: Geld
  rationale: Wörtlich kann das Wort »Silber« bedeuten; da es hier zum Kauf von Opfergaben dient, ist »Geld« im Deutschen die natürliche sachliche Entsprechung.
- source_word: ἀγοράσατε
  choice: kauft
  rationale: Der Imperativ bezeichnet hier ohne besondere Nebenbedeutung den Erwerb der Opfergaben.
- source_word: ὁλοκαυτώματα
  choice: Brandopfer
  rationale: Der griechische Kultbegriff bezeichnet Opfer, die auf dem Altar vollständig verbrannt werden; »Brandopfer« ist dafür die geläufige deutsche Bezeichnung.
- source_word: περὶ ἁμαρτίας
  choice: Sündopfer
  rationale: Die Wendung wird im Opferzusammenhang technisch für Opfer gebraucht, die wegen Sünde dargebracht werden.
- source_word: λίβανον
  choice: Weihrauch
  rationale: Das Wort bezeichnet spezifisch Weihrauch und nicht bloß Räucherwerk im Allgemeinen.
- source_word: ποιήσατε μάννα
  choice: bereitet ein Getreideopfer zu
  rationale: μάννα ist hier im Zusammenhang einer Opferhandlung als Getreidegabe zu verstehen. »Getreideopfer« ist für heutige Leser klarer als das traditionellere »Speiseopfer« und vermeidet eine Verwechslung mit dem Manna der Wüstenzeit.
- source_word: ἀνοίσατε
  choice: bringt ... dar
  rationale: Im kultischen Zusammenhang geht es um das Hinaufbringen beziehungsweise Darbringen auf dem Altar. Das ergänzte »alles« macht im Deutschen deutlich, dass die zuvor genannten Opfergaben gemeint sind.
- source_word: θυσιαστήριον
  choice: Altar
  rationale: Dies ist die übliche deutsche Bezeichnung für den Ort der Opferdarbringung.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: des Herrn, unseres Gottes
  rationale: Die Apposition gibt die griechische Genitivverbindung natürlich wieder und wahrt die Identifikation des Herrn als »unser Gott«.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für den Gott Israels in einer griechisch überlieferten deuterokanonischen Schrift
  choice: der Herr
  alternative: der HERR
  rationale: Der vorliegende Primärtext bietet κύριος. »Herr« folgt daher dem griechischen Wortlaut, ohne durch »HERR« ausdrücklich eine im Text selbst nicht sichtbare Wiedergabe des hebräischen Gottesnamens zu behaupten.
- issue: Bezug des nicht ausdrücklich genannten Objekts bei ἀνοίσατε
  choice: bringt alles ... dar
  alternative: bringt es ... dar
  rationale: Das Griechische lässt das Objekt unausgesprochen. Im Zusammenhang liegt ein zusammenfassender Bezug auf die zuvor genannten Opfergaben nahe; »alles« vermeidet im Deutschen den irreführenden Eindruck, nur das unmittelbar zuvor erwähnte Getreideopfer werde dargebracht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Seht« gibt den an mehrere Adressaten gerichteten Aufmerksamkeitsruf Ἰδοὺ natürlicher wieder als das stärker altertümliche »Siehe«. Die kultischen Begriffe bleiben präzise, werden aber in allgemein verständlicher Form wiedergegeben.
