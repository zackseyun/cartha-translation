base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/012.yaml
  text: And the Lord will give us strength and enlighten our eyes[a], and we will live under the shadow of Nebuchadnezzar king of Babylon and under the shadow of Belshazzar his son[b], and we will serve them many days and find favor before them.
translation:
  language: de
  text: Und der Herr wird uns Kraft geben und unsere Augen erleuchten, und wir werden unter dem Schatten Nebukadnezars, des Königs von Babylon, und unter dem Schatten seines Sohnes Belsazar leben[a] und ihnen viele Tage dienen und bei ihnen Gunst finden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „unter dem Schatten“. Das Bild kann Schutz und Zuflucht, aber auch Abhängigkeit und Unterordnung bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich lautet die griechische Wendung „Gunst vor ihnen finden“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχύν
  choice: Kraft
  rationale: ἰσχύς bezeichnet Kraft oder Stärke. „Kraft“ ist im Deutschen natürlich und bringt die von Gott gewährte Befähigung zum Ausdruck.
- source_word: φωτίσει τοὺς ὀφθαλμοὺς ἡμῶν
  choice: unsere Augen erleuchten
  rationale: Die bildhafte Wendung kann Klarheit, Belebung und Wiederherstellung ausdrücken. Die Übersetzung bewahrt das Bild, ohne es ausdeutend einzuengen.
- source_word: ζησόμεθα
  choice: werden wir … leben
  rationale: Das Verb bedeutet unmittelbar „leben“. „Überleben“ wäre im Zusammenhang möglich, würde die Aussage aber stärker interpretieren.
- source_word: ὑπὸ τὴν σκιὰν
  choice: unter dem Schatten
  rationale: Die wörtliche Metapher kann sowohl Schutz als auch Unterordnung anklingen lassen und bewahrt dadurch die Spannung des griechischen Textes.
- source_word: Ναβουχοδονοσόρ
  choice: Nebukadnezar
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: Βαλτασάρ
  choice: Belsazar
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: δουλεύσομεν
  choice: wir werden ihnen … dienen
  rationale: δουλεύω kann Sklavendienst oder politische Unterordnung bezeichnen. Hier gibt „dienen“ den Zusammenhang unter fremden Herrschern angemessen wieder, ohne den institutionellen Aspekt der Sklaverei unnötig in den Vordergrund zu rücken.
- source_word: ἡμέρας πολλάς
  choice: viele Tage
  rationale: Die Akkusativwendung bezeichnet eine Zeitdauer. „Viele Tage“ wahrt die Ausdrucksweise des Ausgangstextes und ist verständlich.
- source_word: εὑρήσομεν χάριν ἐναντίον αὐτῶν
  choice: Gunst vor ihnen finden
  rationale: Die Übersetzung erhält die biblische Wendung und die räumliche Bildlichkeit von ἐναντίον; idiomatischer wäre „bei ihnen Gunst finden“.
theological_decisions:
- issue: Bedeutung des Bildes „unter dem Schatten“ bei heidnischen Herrschern
  choice: Die Metapher „unter dem Schatten“ bleibt erhalten.
  alternative: „unter dem Schutz“ oder „unter der Herrschaft“
  rationale: Das griechische Bild kann Schutz und Unterordnung zugleich andeuten. Eine eindeutige Auflösung würde die politische und theologische Spannung des Textes beseitigen.
- issue: Bedeutung von δουλεύσομεν im Zusammenhang des Exils
  choice: „wir werden ihnen dienen“
  alternative: „wir werden ihnen als Sklaven dienen“ oder „wir werden ihnen untertan sein“
  rationale: Der Zusammenhang beschreibt den fortdauernden Dienst unter fremden Königen. „Dienen“ bewahrt den möglichen stärkeren Unterton, ohne ausdrücklich Sklaverei oder bloß allgemeine Unterordnung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzglieder wurden leicht gegliedert, um die lange griechische Reihung lesbar zu machen. Die wiederholte Metapher „unter dem Schatten“ und die biblische Wendung „Gunst vor ihnen finden“ bleiben bewusst erhalten.
