  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „je nachdem, wie viel die Hand eines jeden vermochte“; gemeint ist eine Gabe entsprechend den jeweiligen Möglichkeiten oder Mitteln.'
