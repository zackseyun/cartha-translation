lexical_decisions:
- source_word: συνήγαγον
  choice: sie sammelten
  rationale: Der Aorist von συνάγω bezeichnet hier das Zusammentragen einer Geldgabe; „sammelten“ bleibt nah am griechischen Ausdruck und ist im Deutschen natürlich.
- source_word: ἀργύριον
  choice: Silber
  rationale: ἀργύριον bezeichnet wörtlich Silber und kann zugleich Silber als Geld meinen. „Silber“ bewahrt die konkrete Ausdrucksweise des Ausgangstextes.
- source_word: καθὰ ἑκάστου ἠδύνατο ἡ χείρ
  choice: so viel jeder aufbringen konnte
  rationale: Die Wendung beschreibt eine Gabe nach dem jeweiligen Vermögen. Die idiomatische deutsche Formulierung gibt den proportionalen Sinn wieder, ohne das im Deutschen schwer verständliche Bild der „Hand“ im Haupttext künstlich nachzuahmen.
