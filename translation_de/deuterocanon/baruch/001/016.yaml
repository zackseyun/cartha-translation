  text: and to our kings and our rulers and our priests and our prophets and our fathers,[a]
translation:
  language: de
  text: und an unsere Könige, unsere Herrscher, unsere Priester, unsere Propheten und unsere Väter,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorfahren“. Das griechische Wort für „Väter“ kann die Vorväter eines Volkes oder einer Bundesgemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦσιν
  choice: Könige
  rationale: Der Dativ Plural bezeichnet unmittelbar Könige und bewahrt den politischen Rang.
- source_word: ἄρχουσιν
  choice: Herrscher
  rationale: ἄρχων bezeichnet allgemein Menschen mit Regierungsgewalt; „Herrscher“ wahrt diesen Sinn, ohne ein bestimmtes Amt festzulegen.
- source_word: ἱερεῦσιν
  choice: Priester
  rationale: Direkte und im kultischen Zusammenhang etablierte Entsprechung für ἱερεύς.
- source_word: προφήταις
  choice: Propheten
  rationale: Direkte, sachlich eindeutige Entsprechung für προφήτης.
- source_word: πατράσιν
  choice: Väter
  rationale: Bewahrt die männliche Familienbezeichnung und ihren gemeinschaftlichen beziehungsweise bundestheologischen Anklang; hier können die Vorfahren gemeint sein.
- source_word: ἡμῶν
  choice: unsere
  rationale: Das Possessivpronomen wird bei jeder Gruppe wiederholt, um die rhetorische Struktur und gemeinschaftliche Zuordnung des Griechischen zu erhalten.
- source_word: καί
  choice: und
  rationale: Die Konjunktion führt die vorausgehende Aufzählung fort. Im Deutschen wird sie am Anfang und vor dem letzten Glied ausdrücklich wiedergegeben; zwischen den übrigen Gliedern sorgen Kommata für eine natürliche Aufzählung.
theological_decisions:
- issue: πατράσιν im Rahmen eines gemeinschaftlichen Sündenbekenntnisses
  choice: Väter
  alternative: Vorfahren
  rationale: „Väter“ hält sich formal an die griechische Bezeichnung und bewahrt ihren traditionellen gemeinschaftlichen Klang. Da damit wahrscheinlich frühere Generationen gemeint sind, wird „Vorfahren“ als mögliche Bedeutung in der Fußnote genannt.
translation_notes:
  register: Moderner, würdevoller Standard; als fortlaufendes Satzglied beginnt der Vers kleingeschrieben. Die wiederholten Possessivformen bleiben erhalten, während die vielen griechischen καί innerhalb der Reihe idiomatisch durch deutsche Aufzählungskommata wiedergegeben werden.
