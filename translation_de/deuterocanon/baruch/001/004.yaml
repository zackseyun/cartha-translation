base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/004.yaml
  text: and in the hearing of the nobles and the sons of kings[a], and in the hearing of the elders, and in the hearing of all the people, from the least to the greatest[d][c][b], all who were dwelling in Babylon by the river Sud.
translation:
  language: de
  text: und vor den Ohren[a] der Mächtigen[b] und der Söhne der Könige[c], vor den Ohren der Ältesten und vor den Ohren des ganzen Volkes, vom Geringsten bis zum Größten, aller, die in Babylon am Fluss Sud[d] wohnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Ohren“; gemeint ist, dass etwas so vorgelesen oder gesagt wird, dass die Genannten es hören.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der einflussreichen Männer“ beziehungsweise „der Vornehmen“. Das griechische Wort bezeichnet mächtige oder gesellschaftlich bedeutende Personen.'
    reason: lexical_alternative
  - marker: c
    text: Auch als „der Prinzen“ übersetzbar; wörtlich steht im Griechischen „der Söhne der Könige“.
    reason: lexical_alternative
  - marker: d
    text: Der Name „Sud“ ist aus dem Griechischen übertragen; welcher Fluss damit gemeint ist, lässt sich nicht sicher bestimmen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ὠσίν / ἐν ὠσὶ
  choice: vor den Ohren
  rationale: Die griechische Wendung bedeutet wörtlich „in den Ohren“ und bezeichnet, dass etwas so vorgelesen oder gesagt wird, dass die Genannten es hören. „Vor den Ohren“ bewahrt das konkrete Bild und ist im Deutschen verständlich.
- source_word: τῶν δυνατῶν
  choice: der Mächtigen
  rationale: Das Wort bezeichnet mächtige oder gesellschaftlich einflussreiche Personen. „Mächtige“ erhält die Bedeutungsbreite, ohne den engeren Standesbegriff „Adlige“ vorauszusetzen.
- source_word: υἱῶν τῶν βασιλέων
  choice: der Söhne der Könige
  rationale: Die relationale und pluralische Formulierung des Griechischen wird unmittelbar wiedergegeben; „Prinzen“ wäre flüssiger, würde aber einen nicht ausdrücklich genannten Titel einsetzen.
- source_word: τῶν πρεσβυτέρων
  choice: der Ältesten
  rationale: Im antiken jüdischen und kommunalen Zusammenhang sind damit anerkannte ältere Führungspersonen gemeint, nicht bloß Menschen höheren Alters.
- source_word: παντὸς τοῦ λαοῦ
  choice: des ganzen Volkes
  rationale: Gibt den umfassenden kollektiven Ausdruck direkt und idiomatisch wieder.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: vom Geringsten bis zum Größten
  rationale: Die Wendung ist eine umfassende Paarformel für alle gesellschaftlichen Schichten. Die gewählte Fassung vermeidet eine unbegründete Festlegung auf das Lebensalter.
- source_word: πάντων τῶν κατοικούντων
  choice: aller, die … wohnten
  rationale: Die partizipiale Konstruktion wird natürlich wiedergegeben und behält durch das Präteritum den erzählerischen Zeitbezug.
- source_word: ἐν Βαβυλῶνι
  choice: in Babylon
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: ἐπὶ ποταμοῦ Σούδ
  choice: am Fluss Sud
  rationale: ἐπί mit Genitiv ist hier örtlich zu verstehen. „Am Fluss“ bezeichnet die Lage an oder nahe dem Gewässer; der unsicher identifizierte Eigenname wird als „Sud“ transliteriert.
