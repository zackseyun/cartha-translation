translation_notes:
  register: Moderne, würdige Standardsprache. Die im Griechischen dreimal ausdrücklich wiederkehrende Hörformel und ihre abschließende Ausweitung auf alle Bewohner werden beibehalten. Die leichte Wiederholung ist daher bewusst quellennah; „vom Geringsten bis zum Größten“ wahrt die soziale Spannweite der Paarformel.
