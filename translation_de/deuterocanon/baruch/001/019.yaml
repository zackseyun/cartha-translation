base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/019.yaml
  text: From the day when the Lord brought our fathers out from the land of Egypt until this day[a], we have been disobedient to the Lord our God, and we have been negligent in not listening to his voice.
translation:
  language: de
  text: Von dem Tag an, an dem der Herr unsere Väter aus dem Land Ägypten herausführte, bis zum heutigen Tag waren wir dem Herrn, unserem Gott, ungehorsam und handelten leichtfertig[a], indem wir nicht auf seine Stimme hörten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hier verwendete griechische Verb ist selten. Es kann auch bedeuten: »handelten unbedacht« oder »waren nachlässig«; eine ausdrücklich hartnäckige Weigerung ist nicht zwingend gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῆς ἡμέρας ἧς ... καὶ ἕως τῆς ἡμέρας ταύτης
  choice: Von dem Tag an, an dem ... bis zum heutigen Tag
  rationale: Die Formulierung gibt den Ausgangspunkt und die bis in die Gegenwart reichende Dauer natürlich und genau wieder.
- source_word: ἐξήγαγεν
  choice: herausführte
  rationale: Das Verb bezeichnet das Herausführen und bewahrt in Verbindung mit Ägypten den Exodusanklang.
- source_word: Κύριος
  choice: der Herr
  rationale: Dies entspricht dem griechischen κύριος und lässt den Bezug auf Israels Gott im Kontext klar erkennen.
- source_word: τοὺς πατέρας ἡμῶν
  choice: unsere Väter
  rationale: Die ausdrücklich männliche Pluralform und der Bezug auf Israels Vorväter werden beibehalten.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe erhält sowohl die Präposition ἐκ als auch die volle Wendung γῆ Αἰγύπτου.
- source_word: ἤμεθα ἀπειθοῦντες
  choice: waren wir ... ungehorsam
  rationale: Die Umschreibung bezeichnet einen über den gesamten genannten Zeitraum fortdauernden Zustand; im Deutschen trägt die Zeitangabe diese Dauer hinreichend.
- source_word: πρὸς Κύριον θεὸν ἡμῶν
  choice: dem Herrn, unserem Gott
  rationale: Der Dativ ist bei »ungehorsam sein« idiomatisch und gibt die auf Gott bezogene Relation ohne zusätzliche Verschärfung wieder.
- source_word: ἐσχεδιάζομεν
  choice: handelten leichtfertig
  rationale: Das seltene Verb bezeichnet hier unbedachtes, nachlässiges oder achtloses Handeln. »Leichtfertig« bewahrt diese Bedeutungsbreite, ohne vorsätzlich-trotzige Rebellion festzuschreiben.
- source_word: πρὸς τὸ μὴ ἀκούειν
  choice: indem wir nicht ... hörten
  rationale: Die Formulierung beschreibt, worin sich das leichtfertige Verhalten zeigte, ohne eindeutig eine Absicht auszudrücken.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: auf seine Stimme
  rationale: Die biblische Redeweise »auf eine Stimme hören« bewahrt sowohl φωνή als auch den Sinn des Gehorchens.
theological_decisions:
- issue: Wiedergabe des auf Israels Gott bezogenen Titels Κύριος
  choice: der Herr
  alternative: der HERR
  rationale: Der unmittelbare griechische Ausgangstext bietet Κύριος. »Der Herr« folgt diesem Wortlaut, ohne typografisch den hebräischen Gottesnamen einzutragen.
- issue: Grad der Schuld in ἐσχεδιάζομεν
  choice: handelten leichtfertig
  alternative: weigerten uns hartnäckig
  rationale: Das seltene Verb kann Nachlässigkeit oder unbedachtes Verhalten ausdrücken; eine ausdrücklich hartnäckige, vorsätzliche Weigerung wäre eine theologische und psychologische Präzisierung, die der griechische Ausdruck nicht sicher verlangt.
- issue: Zeitliche Erstreckung des Ungehorsams
  choice: waren wir ... ungehorsam und handelten
  alternative: sind wir ... ungehorsam gewesen und haben ... gehandelt
  rationale: Die Konstruktion beschreibt das Verhalten vom Exodus bis zum gegenwärtigen Tag. Die deutsche Rahmung »Von ... bis zum heutigen Tag« macht den fortdauernden Zeitraum deutlich; das Präteritum wahrt zugleich den erzählenden Bekenntnisstil.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle biblische Wendung »unsere Väter« und das Motiv, auf Gottes Stimme zu hören, bleiben erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser verständlich.
