base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/009.yaml
  text: after Nebuchadnezzar king of Babylon had taken Jeconiah and the rulers and the prisoners and the mighty men and the people of the land from Jerusalem into exile[a], and had brought him to Babylon.
translation:
  language: de
  text: nachdem Nebukadnezzar, der König von Babylon, Jojachin, die führenden Männer, die Gefangenen, die Mächtigen und das Volk des Landes aus Jerusalem in die Verbannung geführt und ihn nach Babylon gebracht hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier „ihn“, offenbar mit Bezug auf Jojachin; dem Sinn nach kann auch die ganze Gruppe der Verschleppten gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ ἀποικίσαι
  choice: nachdem … in die Verbannung geführt … hatte
  rationale: Die Konstruktion mit μετά und substantiviertem Infinitiv bezeichnet Vorzeitigkeit; ἀποικίζω meint hier die erzwungene Umsiedlung ins Exil.
- source_word: Ναβουχοδονοσὸρ βασιλέα Βαβυλῶνος
  choice: Nebukadnezzar, der König von Babylon
  rationale: Verwendet die im Deutschen geläufige Namensform und gibt den Königstitel transparent wieder.
- source_word: τὸν Ἰεχονίαν
  choice: Jojachin
  rationale: Jojachin ist die im modernen deutschen Bibelgebrauch geläufige Form des Königsnamens; sie identifiziert dieselbe Person, die die griechische Form Ἰεχονίας bezeichnet.
- source_word: τοὺς ἄρχοντας
  choice: die führenden Männer
  rationale: ἄρχοντες bezeichnet Personen in leitender oder herrschender Stellung. Die Formulierung bleibt breit, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: τοὺς δεσμώτας
  choice: die Gefangenen
  rationale: δεσμώτης bezeichnet wörtlich einen Gebundenen oder Gefangenen; die eigene Bezeichnung wird gegenüber dem allgemeinen Gedanken der Verbannung bewahrt.
- source_word: τοὺς δυνατοὺς
  choice: die Mächtigen
  rationale: Die substantivische Wiedergabe wahrt die offene soziale, politische oder militärische Bedeutung von δυνατοί, ohne sie vorschnell einzuengen.
- source_word: τὸν λαὸν τῆς γῆς
  choice: das Volk des Landes
  rationale: Formnahe Wiedergabe der möglicherweise sozialen Gruppenbezeichnung, ohne interpretierend „das einfache Volk“ einzusetzen.
- source_word: ἀπὸ Ἰερουσαλήμ
  choice: aus Jerusalem
  rationale: Gibt den Ausgangspunkt der Deportation unmittelbar wieder.
- source_word: καὶ ἤγαγεν αὐτὸν εἰς Βαβυλῶνα
  choice: und ihn nach Babylon gebracht hatte
  rationale: Das maskuline Singularpronomen αὐτόν wird entsprechend dem griechischen Wortlaut als „ihn“ bewahrt und bezieht sich am ehesten auf Jojachin.
theological_decisions:
- issue: Numerus des Pronomens im letzten Satzteil
  choice: Das Singularpronomen „ihn“ steht im Haupttext.
  alternative: Sinngemäß könnte „sie“ auf die gesamte zuvor genannte Gruppe bezogen werden.
  rationale: Der vorliegende griechische Text hat eindeutig den Singular αὐτόν. Die unerwartete Spannung nach der Aufzählung wird nicht stillschweigend geglättet, sondern durch eine Fußnote erläutert.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bleibt als zeitlicher Nebensatz gestaltet, da der Vers syntaktisch an den folgenden Zusammenhang gebunden ist. Die Reihung der Gruppen und das auffällige Singularpronomen des griechischen Textes bleiben sichtbar.
