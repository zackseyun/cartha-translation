  text: when he received the vessels of the house of the Lord that had been carried out from the temple[a], to return them to the land of Judah, on the tenth of Sivan—silver vessels that Zedekiah son of Josiah, king of Judah, had made—
translation:
  language: de
  text: als er am zehnten Tag des Monats Siwan die Geräte des Hauses des Herrn, die aus dem Tempel hinausgebracht worden waren, in Empfang nahm, um sie in das Land Juda zurückzubringen – silberne Geräte, die Zedekia, der Sohn Josias, König von Juda, angefertigt hatte –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ λαβεῖν αὐτόν
  choice: als er … in Empfang nahm
  rationale: Die Konstruktion ἐν mit substantiviertem Infinitiv bezeichnet hier Gleichzeitigkeit. „In Empfang nahm“ gibt λαβεῖν in diesem Übergabezusammenhang natürlich und präzise wieder.
- source_word: τὰ σκεύη οἴκου Κυρίου
  choice: die Geräte des Hauses des Herrn
  rationale: σκεύη bezeichnet im Tempelkontext kultische Gegenstände oder Gerätschaften. „Haus des Herrn“ bewahrt die traditionelle Tempelbezeichnung und gibt Κυρίου als „des Herrn“ wieder.
- source_word: τὰ ἐξενεχθέντα ἐκ τοῦ ναοῦ
  choice: die aus dem Tempel hinausgebracht worden waren
  rationale: Das passive Aoristpartizip bezeichnet eine vorausgegangene Entfernung. Das Plusquamperfekt macht dieses zeitliche Verhältnis im Deutschen deutlich.
- source_word: ἀποστρέψαι εἰς γῆν Ἰούδα
  choice: um sie in das Land Juda zurückzubringen
  rationale: Der Infinitiv drückt den Zweck aus. Das transitive „zurückzubringen“ passt zum gemeinten Rücktransport der Geräte; γῆν wird mit „Land“ ausdrücklich wiedergegeben.
- source_word: τῇ δεκάτῃ τοῦ Σειουάν
  choice: am zehnten Tag des Monats Siwan
  rationale: Die ausgeschriebene Datumsformel ist im modernen Deutschen klar; „Siwan“ ist die übliche deutsche Form des Monatsnamens.
- source_word: σκεύη ἀργυρᾶ
  choice: silberne Geräte
  rationale: Die Formulierung bewahrt sowohl die Gegenstandsbezeichnung als auch die Materialangabe und klingt im Deutschen natürlich.
- source_word: ἐποίησεν
  choice: hatte anfertigen lassen
  rationale: Bei einem König kann ποιεῖν idiomatisch die veranlasste Herstellung bezeichnen. „Anfertigen lassen“ vermeidet die naheliegende, aber unnötige Vorstellung, Zedekia habe die Geräte eigenhändig hergestellt; das Plusquamperfekt markiert die Vorzeitigkeit.
- source_word: Σεδεκίας υἱὸς Ἰωσεία βασιλεὺς Ἰούδα
  choice: Zedekia, der Sohn Josias und König von Juda
  rationale: Die Appositionen werden in verständlicher deutscher Syntax wiedergegeben, ohne zusätzliche Beziehungen in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe von κύριος in der Tempelbezeichnung
  choice: Herr
  alternative: HERR
  rationale: Der griechische Text bietet Κυρίου. „Herr“ entspricht der üblichen Wiedergabe von κύριος und vermeidet eine nicht unmittelbar im griechischen Wortlaut sichtbare typografische Festlegung auf den Gottesnamen.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Der Vers bleibt als syntaktisch unabgeschlossener Teil des längeren Satzes mit Gedankenstrich erhalten. „Geräte“ ist für heutige Leser verständlicher als „Gefäße“, da σκεύη kultische Gegenstände allgemein bezeichnen kann.
