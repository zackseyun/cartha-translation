base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/002.yaml
  text: in the fifth year[a], on the seventh day of the month, at the time when the Chaldeans captured Jerusalem and burned it with fire.
translation:
  language: de
  text: im fünften Jahr, am siebten Tag des Monats,[a] zu der Zeit, als die Chaldäer Jerusalem einnahmen und es in Brand setzten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen: »am siebten des Monats«; gemeint ist nach der üblichen verkürzten Datierungsformel der siebte Tag des Monats.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ πέμπτῳ
  choice: im fünften Jahr
  rationale: Die Zeitangabe mit ἐν wird im Deutschen natürlich und quellennah mit »im fünften Jahr« wiedergegeben.
- source_word: ἐν ἑβδόμῃ τοῦ μηνός
  choice: am siebten Tag des Monats
  rationale: Das feminine Zahlwort ἑβδόμῃ setzt in dieser üblichen Datierungsformel sinngemäß ἡμέρᾳ (»Tag«) voraus; »im siebten Monat« entspräche weder der Form noch der Konstruktion.
- source_word: ἐν τῷ καιρῷ ᾧ
  choice: zu der Zeit, als
  rationale: Diese Formulierung bewahrt den ausdrücklichen zeitlichen Bezug von καιρός und klingt im Deutschen natürlich.
- source_word: ἔλαβον
  choice: einnahmen
  rationale: Bei einer Stadt bezeichnet λαμβάνω hier die militärische Einnahme; »einnahmen« ist präzise und idiomatisch.
- source_word: οἱ Χαλδαῖοι
  choice: die Chaldäer
  rationale: Dies gibt das griechische Ethnonym Χαλδαῖοι unmittelbar wieder, ohne es historisch erklärend durch »Babylonier« zu ersetzen.
- source_word: ἐνέπρησαν αὐτὴν ἐν πυρί
  choice: es in Brand setzten
  rationale: »In Brand setzten« gibt das aktive Anzünden samt der Feuerangabe natürlich wieder, ohne die nicht ausdrücklich genannte vollständige Zerstörung durch »niederbrannten« hinzuzufügen.
