translation:
  language: de
  text: Und betet für uns zum Herrn, unserem Gott; denn wir haben gegen den Herrn, unseren Gott, gesündigt, und der Zorn des Herrn und sein Grimm haben sich bis zum heutigen Tag nicht von uns abgewandt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύξασθε περὶ ἡμῶν πρὸς Κύριον τὸν θεὸν ἡμῶν
  choice: betet für uns zum Herrn, unserem Gott
  rationale: Gibt Fürbitte (περὶ ἡμῶν) und die Gebetsrichtung (πρὸς) klar und natürlich wieder.
- source_word: ἡμάρτομεν τῷ κυρίῳ θεῷ ἡμῶν
  choice: wir haben gegen den Herrn, unseren Gott, gesündigt
  rationale: Der Dativ bezeichnet hier die Person, gegen die gesündigt wurde; „gegen“ ist im heutigen Deutsch eindeutig.
- source_word: ὁ θυμὸς Κυρίου καὶ ἡ ὀργὴ αὐτοῦ
  choice: der Zorn des Herrn und sein Grimm
  rationale: Bewahrt die zwei griechischen Zornbegriffe, ohne sie zu einem einzigen Ausdruck einzuebnen.
- source_word: οὐκ ἀπέστρεψεν ... ἀφʼ ἡμῶν
  choice: haben sich ... nicht von uns abgewandt
  rationale: Natürliches Deutsch für das Abwenden des Zorns; der griechische Singular wird als mögliche zusammenfassende Kongruenz verstanden, während Deutsch bei zwei koordinierten Subjekten den Plural verlangt.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: bis zum heutigen Tag
  rationale: Idiomatiche und präzise Wiedergabe der zeitlichen Angabe.
theological_decisions:
- issue: Verhältnis von Sünde und fortdauerndem göttlichem Zorn
  choice: Die kausale Aussage und das Fortdauern beider Zornbegriffe werden unverändert wiedergegeben.
  alternative: Den Satz abschwächen oder den Zorn nur als vergangene Strafe paraphrasieren.
  rationale: Der griechische Text verbindet das Sündenbekenntnis ausdrücklich mit dem bis in die Gegenwart nicht abgewandten Zorn; diese Spannung darf nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Gottesbezeichnung und die parallelen Zornbegriffe bleiben erhalten; keine konfessionell geprägte Terminologie.
