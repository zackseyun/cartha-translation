translation:
  language: de
  text: Und ihr sollt dieses Buch, das wir euch geschickt haben, lesen, um es im Haus des Herrn öffentlich zu verkünden, an einem Festtag und an Tagen festgesetzter Zeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: »an Festtagen und zu festgesetzten Zeiten«. Die überlieferte griechische Wendung »an Tagen festgesetzter Zeit« ist ungewöhnlich; der Haupttext bleibt näher an ihrer Formulierung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνώσεσθε
  choice: ihr sollt … lesen
  rationale: Die Futurform erteilt im Zusammenhang eine Anweisung. »Lesen« bleibt nah am griechischen Verb; der öffentliche Rahmen wird durch das folgende »öffentlich zu verkünden« deutlich.
- source_word: τὸ βιβλίον τοῦτο
  choice: dieses Buch
  rationale: βιβλίον kann ein Buch, eine Schrift oder eine Schriftrolle bezeichnen. »Buch« ist im heutigen Deutsch natürlich und legt das materielle Format nicht unnötig fest.
- source_word: ἀπεστείλαμεν πρὸς ὑμᾶς
  choice: das wir euch geschickt haben
  rationale: Das griechische Aorist bezeichnet die bereits vollzogene Übersendung. Das deutsche Perfekt stellt natürlich den Bezug zur gegenwärtigen Aufforderung her.
- source_word: ἐξαγορεῦσαι
  choice: um es … öffentlich zu verkünden
  rationale: Der Infinitiv bezeichnet hier den Zweck und kann ein offenes, öffentliches Bekanntmachen ausdrücken. »Öffentlich verkünden« wahrt den formellen Charakter im Rahmen des Gottesdienstes, ohne das Verb auf bloßes Vorlesen zu verengen.
- source_word: ἐν οἴκῳ Κυρίου
  choice: im Haus des Herrn
  rationale: Die traditionelle biblische Wendung bleibt erhalten und bezeichnet in diesem Zusammenhang den Tempel beziehungsweise das Heiligtum.
- source_word: ἐν ἡμέρᾳ ἑορτῆς
  choice: an einem Festtag
  rationale: ἑορτή bezeichnet ein religiöses Fest. »Festtag« ist prägnant und im Deutschen geläufig.
- source_word: ἐν ἡμέραις καιροῦ
  choice: an Tagen festgesetzter Zeit
  rationale: Die ungewöhnliche griechische Wortgruppe wird bewusst relativ quellennah wiedergegeben. καιρός bezeichnet hier wahrscheinlich eine bestimmte oder festgesetzte Zeit; eine glattere Deutung steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von Κυρίου
  choice: Herrn
  alternative: HERRN
  rationale: Die griechische Vorlage bietet Κυρίου und nicht unmittelbar den hebräischen Gottesnamen. »Haus des Herrn« ist daher die textlich nächstliegende und zugleich geläufige Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die öffentliche und kultische Situation wird klar ausgedrückt, während die auffällige Zeitangabe der griechischen Vorlage im Haupttext nicht stillschweigend geglättet wird.
