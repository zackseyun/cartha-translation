lexical_decisions:
- source_word: ἔκλαιον
  choice: sie weinten
  rationale: Der Imperfekt bezeichnet ein andauerndes oder wiederholtes Geschehen. Im Deutschen kann das Präteritum diesen durativen Sinn im Erzählzusammenhang natürlich mittragen.
- source_word: ἐνήστευον
  choice: fasteten
  rationale: Die koordinierte finite Form entspricht dem griechischen Imperfekt und ergibt zusammen mit den übrigen Verben eine klare, natürliche Reihung.
- source_word: ηὔχοντο
  choice: beteten
  rationale: Im religiösen Zusammenhang ist »beten« die übliche und sachlich genaue Wiedergabe von εὔχομαι.
- source_word: ἐναντίον
  choice: vor
  rationale: »Vor« bewahrt knapp und idiomatisch den räumlich-relationalen Sinn von Gegenwart beziehungsweise Angesicht.
- source_word: Κυρίου
  choice: dem Herrn
  rationale: Κύριος bezeichnet hier ehrfürchtig den Gott Israels. Nach der Präposition »vor« steht im Deutschen der Dativ; die bestimmte Form ist idiomatisch.
theological_decisions:
- issue: Wiedergabe von Κυρίου in einem jüdischen Kontext der Septuaginta
  choice: dem Herrn
  alternative: vor Gott / in der Gegenwart des Herrn
  rationale: »Dem Herrn« gibt κύριος unmittelbar wieder und wahrt den ehrfürchtigen Sprachgebrauch der Septuaginta, ohne eine nicht ausdrücklich im griechischen Text markierte Gottesnamensform einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Verbreihe ist bewusst knapp gehalten; das deutsche Präteritum gibt den fortdauernden Charakter der griechischen Imperfekte im Kontext ausreichend wieder.
