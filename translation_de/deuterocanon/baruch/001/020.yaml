  source_fidelity: 'Die Übersetzung gibt τὰ κακά, ἀρά, ἐκολλήθη εἰς ἡμᾶς, die Exodus-Anspielung und die Landformel insgesamt treffend wieder. Die Wendung „seinem Diener Mose angeordnet“ ist jedoch im Deutschen semantisch und syntaktisch missverständlich: Sie kann nahelegen, der Fluch sei Mose auferlegt worden. Der griechische Dativ bei Μωυσῇ ist in seiner genauen Funktion schwierig; „für seinen Diener Mose festgesetzt“ bildet die im Audit gewählte Lesart ab, ohne Mose zum Empfänger des Fluches zu machen.'
  naturalness: „Hafteten an uns“ ist ein gutes, verständliches Bild. „Festgesetzt“ ist in dieser Konstruktion deutlich idiomatischer als „jemandem einen Fluch angeordnet“. Die Stellung der Zeitangabe innerhalb des Relativsatzes macht den griechischen Bezug auf das Festsetzen des Fluches sichtbar.
  terminology: „Unglücke“, „Fluch“, „Herr“, „Diener“ und „Vorfahren“ sind angemessenes modernes, zugleich würdiges Standarddeutsch. Die Fußnote zu „Unglücke“ erläutert sachgerecht, dass keine moralisch bösen Handlungen gemeint sind.
