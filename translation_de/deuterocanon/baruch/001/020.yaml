base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/020.yaml
  text: And the calamities and the curse that the Lord appointed for Moses his servant clung to us[a], on the day when he brought our fathers out to give us a land flowing with milk and honey[c][b], as it is this day.
translation:
  language: de
  text: Und die Unglücke[a] und der Fluch, den der Herr für seinen Diener Mose an dem Tag festgesetzt hatte, als er unsere Vorfahren herausführte, um uns ein Land zu geben, in dem Milch und Honig fließen, hafteten an uns – wie es heute der Fall ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Unheil“ bzw. „die Katastrophen“. Gemeint sind hier wahrscheinlich verheerende Strafgerichte, nicht moralisch böse Taten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολλήθη εἰς ἡμᾶς
  choice: hafteten an uns
  rationale: Bewahrt das anschauliche Bild eines engen und anhaltenden Anhaftens, statt es zum bloßen Eintreffen abzuschwächen.
- source_word: τὰ κακά
  choice: die Unglücke
  rationale: Im Zusammenhang mit dem Bundesfluch bezeichnet der Ausdruck unheilvolle Folgen bzw. Strafgerichte, nicht moralisch böse Taten.
- source_word: ἡ ἀρά
  choice: der Fluch
  rationale: Gibt den im Zusammenhang mit Mose angekündigten Bundesfluch klar und ohne unnötige fachsprachliche Zusätze wieder.
- source_word: συνέταξεν
  choice: angeordnet hatte
  rationale: Das Verb bezeichnet hier ein verbindliches Anordnen oder Festsetzen. Die Wiedergabe wahrt den griechischen Dativ bei Mose, ohne ihn vorschnell mit „durch Mose“ instrumental aufzulösen.
- source_word: παιδὶ αὐτοῦ
  choice: seinem Diener
  rationale: παῖς kann Kind oder Diener bedeuten; bei Mose bezeichnet es hier den Diener Gottes.
- source_word: ἐξήγαγεν τοὺς πατέρας ἡμῶν
  choice: unsere Vorfahren herausführte
  rationale: „Herausführte“ bewahrt die Exodus-Sprache; „Vorfahren“ ist im heutigen Deutsch inklusiv und natürlich.
- source_word: γῆν ῥέουσαν γάλα καὶ μέλι
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Gibt das vertraute biblische Bild idiomatisch und quellennah wieder.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: wie es heute der Fall ist
  rationale: Bewahrt den Bezug auf die gegenwärtige Lage aus Sicht des Sprechers, ohne die syntaktische Zuordnung stärker als der griechische Text festzulegen.
theological_decisions:
- issue: Art des Unheils und des Fluches
  choice: Als Folgen der durch Mose angekündigten Bundesordnung wiedergegeben
  alternative: Allgemeine Unglücksfälle und ein nicht näher bestimmter Fluch
  rationale: Die Verbindung von Unheil, Fluch, Mose, Exodus und Landgabe ruft den deuteronomischen Bundeskontext auf. Die Übersetzung lässt diesen Zusammenhang erkennen, fügt aber keine ausdrückliche dogmatische Erklärung hinzu.
- issue: Rolle des Mose bei συνέταξεν ... τῷ Μωυσῇ
  choice: „seinem Diener Mose angeordnet“
  alternative: „durch seinen Diener Mose angeordnet“ oder „seinem Diener Mose auferlegt“
  rationale: Der griechische Dativ lässt das genaue Verhältnis offen. Die gewählte Form bleibt formal nah und vermeidet sowohl eine rein instrumentale Deutung als auch die Behauptung, Mose selbst sei alleiniger Empfänger des Fluches.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem langen griechischen Satz erkennbar verbunden, wird aber durch den Gedankenstrich am Schluss lesbarer. „Vorfahren“ vermeidet das heute enger wirkende „Väter“, ohne den genealogischen Bezug aufzugeben.
