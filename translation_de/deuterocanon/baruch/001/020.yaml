- from: Und die Unglücke[a] und der Fluch, den der Herr seinem Diener Mose angeordnet[b] hatte an dem Tag, als er unsere Vorfahren herausführte, um uns ein Land zu geben, in dem Milch und Honig fließen, hafteten an uns – wie es heute der Fall ist.
  to: Und die Unglücke[a] und der Fluch, den der Herr für seinen Diener Mose an dem Tag festgesetzt hatte, als er unsere Vorfahren herausführte, um uns ein Land zu geben, in dem Milch und Honig fließen, hafteten an uns – wie es heute der Fall ist.
  rationale: Die Änderung ersetzt die missverständliche Konstruktion „seinem Diener Mose angeordnet“ durch die im Deutschen natürliche und vom englischen Audit gestützte Formulierung „für seinen Diener Mose ... festgesetzt“. Die Zeitangabe bleibt beim Festsetzen des Fluches; der Dativ bei Mose wird nicht dogmatisch oder überpräzise aufgelöst. Der Fußnotenanker bleibt am entsprechenden Verb erhalten.
