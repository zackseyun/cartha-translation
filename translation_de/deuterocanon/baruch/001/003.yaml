base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/003.yaml
  text: And Baruch read the words of this book in the hearing of Jeconiah son of Jehoiakim, king of Judah, and in the hearing of all the people who came to the book,
translation:
  language: de
  text: Und Baruch las Jechonja[a], dem Sohn Jojakims, dem König von Juda, und dem ganzen Volk, das zum Buch gekommen war[b], die Worte dieses Buches vor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jechonja ist auch unter dem Namen Jojachin bekannt.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „das zum Buch gekommen war“. Die ungewöhnliche griechische Wendung kann möglicherweise auch „das zur Lesung gekommen war“ oder „das zu der Schriftrolle gekommen war“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγνω
  choice: las … laut vor
  rationale: Das Verb bedeutet „lesen“; der zweimalige Ausdruck ἐν ὠσὶν macht in diesem öffentlichen Zusammenhang deutlich, dass hörbar vorgelesen wurde. Die deutsche Formulierung gibt dies natürlich wieder.
- source_word: τοὺς λόγους τοῦ βιβλίου τούτου
  choice: die Worte dieses Buches
  rationale: „Worte“ bewahrt den formalen Bezug von λόγοι auf den sprachlichen Inhalt; „dieses Buch“ gibt βιβλίον τοῦτο unmittelbar und in heutigem Deutsch wieder.
- source_word: ἐν ὠσὶν
  choice: … laut vor
  rationale: Die Wendung bedeutet wörtlich „in den Ohren“, bezeichnet hier aber das hörbare Vorlesen vor Anwesenden. Im Deutschen bündelt „jemandem laut vorlesen“ beide Vorkommen idiomatisch, ohne den Sinn zu verändern.
- source_word: Ἰεχονίου
  choice: Jechonja
  rationale: „Jechonja“ ist die im Deutschen geläufige Form des Namens, den die griechische Vorlage als Ἰεχονίας wiedergibt; die alternative Namensform „Jojachin“ wird in einer Fußnote genannt.
- source_word: Ἰωακεὶμ
  choice: Jojakim
  rationale: Dies ist die geläufige deutsche Namensform für den in der griechischen Vorlage als Ἰωακείμ bezeichneten König.
- source_word: τῶν ἐρχομένων πρὸς τὴν βίβλον
  choice: das zu dem Buch gekommen war
  rationale: Die ungewöhnliche konkrete Wendung der Vorlage wird bewusst erhalten. Das Plusquamperfekt bezeichnet die Personen als bereits zur öffentlichen Lesung eingetroffen, ohne πρὸς τὴν βίβλον interpretierend auf „Lesung“ festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Wiederholung von „in den Ohren“ wurde zugunsten des natürlichen deutschen Verbs „laut vorlesen“ gebündelt. Der ungewöhnliche Schlussausdruck bleibt im Haupttext formal sichtbar und wird in der Fußnote erläutert. Das abschließende Komma wurde beibehalten, da der Satz im folgenden Vers weitergeführt wird.
