base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/001.yaml
  text: And these are the words of the book that Baruch son of Neriah[a], son of Maaseiah, son of Zedekiah, son of Hasadiah, son of Hilkiah, wrote in Babylon,
translation:
  language: de
  text: 'Und dies sind die Worte des Buches, die Baruch, der Sohn Nerijas, des Sohnes Maasejas, des Sohnes Zidkijas, des Sohnes Hasadjas[a], des Sohnes Hilkijas, in Babylon schrieb:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text hat hier die Namensform Asadja; Hasadja entspricht der üblichen semitisch geprägten biblischen Namensform.
    reason: lexical_alternative
lexical_decisions:
- source_word: ΚΑΙ οὗτοι
  choice: Und dies
  rationale: Bewahrt sowohl den verbindenden Erzählanfang mit καί als auch den demonstrativen Bezug von οὗτοι auf den folgenden Buchinhalt.
- source_word: οἱ λόγοι τοῦ βιβλίου
  choice: die Worte des Buches
  rationale: Gibt die Genitivverbindung eng und natürlich wieder; λόγοι bezeichnet hier den schriftlichen Inhalt, ohne ihn deutend zu »Bericht« oder »Botschaft« zu erweitern.
- source_word: οὓς ἔγραψεν
  choice: die … schrieb
  rationale: Der Relativsatz wird im Deutschen idiomatisch angeschlossen; der Aorist ἔγραψεν wird als einfache Vergangenheit wiedergegeben.
- source_word: υἱὸς … υἱοῦ
  choice: der Sohn … des Sohnes
  rationale: Die ausdrücklich wiederholte genealogische Sohn-Formel bleibt erhalten und wird nicht zum allgemeineren »Nachkomme« abgeschwächt.
- source_word: Βαροὺχ / Νηρίου / Μαασαίου / Σεδεκίου / Ἀσαδίου / Χελκίου
  choice: Baruch / Nerija / Maaseja / Zidkija / Hasadja / Hilkija
  rationale: Verwendet die im Deutschen üblichen, semitisch geprägten biblischen Namensformen statt gräzisierter Formen.
- source_word: ἐν Βαβυλῶνι
  choice: in Babylon
  rationale: Direkte und im Deutschen geläufige Wiedergabe der Ortsangabe.
theological_decisions:
- issue: Namensformen in einem griechisch überlieferten deuterokanonischen Text
  choice: 'Deutsche biblische Namensformen semitischer Prägung: Nerija, Maaseja, Zidkija, Hasadja und Hilkija'
  alternative: Griechisch geprägte Formen wie Nerias, Maasaias, Sedekias, Asadias und Chelkias
  rationale: Die Wahl verbindet die Personen mit der vertrauten biblischen Namenstradition, ohne aus den Namensformen eine theologische Aussage abzuleiten. Die abweichende Form des griechischen Textes bei Ἀσαδίου wird transparent in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Anschluss mit »Und« und die genealogische Reihung bleiben erhalten. Der Doppelpunkt trägt dem fortlaufenden Satzcharakter Rechnung, da der Vers im griechischen Text mit einem Komma in den nächsten Vers überleitet.
