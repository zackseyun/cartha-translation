base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/021.yaml
  text: And we did not listen to the voice of the Lord our God[a], according to all the words of the prophets whom he sent to us,
translation:
  language: de
  text: Und wir hörten nicht auf die Stimme des Herrn, unseres Gottes,[a] nach allem, was die Propheten gesagt hatten, die er zu uns gesandt hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier auch „Beachtung schenken“ oder „gehorchen“ bedeuten; es meint mehr als bloßes akustisches Hören.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: hörten nicht auf
  rationale: ἀκούω mit Genitiv bezeichnet hier im Zusammenhang schuldhaften Nichtbeachtens ein Hören im Sinn von Hinhören und Folge-Leisten. Die deutsche Wendung „auf die Stimme hören“ bewahrt den biblischen Ausdruck und lässt die Bedeutungsweite zwischen Hören und Gehorchen bestehen.
- source_word: τῆς φωνῆς
  choice: auf die Stimme
  rationale: φωνή bedeutet wörtlich „Stimme“. Die Verbindung „auf die Stimme ... hören“ ist im Deutschen verständlich und unterscheidet Gottes Stimme von den anschließend genannten Worten der Propheten.
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: des Herrn, unseres Gottes
  rationale: Die Apposition gibt die griechische Wortgruppe genau und in würdigem modernem Deutsch wieder. Da die vorliegende Quelle κύριος bietet, wird „Herr“ und nicht typografisch hervorgehobenes „HERR“ verwendet.
- source_word: κατὰ πάντας τοὺς λόγους
  choice: entsprechend all den Worten
  rationale: κατά mit Akkusativ bezeichnet hier die Übereinstimmung mit dem gesamten prophetischen Reden. „Entsprechend“ erhält diesen Bezug, ohne die Aussage in bloßen Inhalt oder Gehorsam aufzulösen.
- source_word: τῶν προφητῶν
  choice: der Propheten
  rationale: Der Genitiv wird direkt bewahrt; der Relativsatz erläutert anschließend, dass Gott diese Propheten gesandt hatte.
- source_word: ὧν ἀπέστειλεν πρὸς ἡμᾶς
  choice: die er zu uns gesandt hatte
  rationale: Das maskuline Relativpronomen bezieht sich auf die Propheten. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass ihre Sendung dem berichteten Nicht-Hören vorausging; πρὸς ἡμᾶς bedeutet „zu uns“.
theological_decisions:
- issue: Bundestheologische Tragweite des Hörens auf Gottes Stimme
  choice: „hörten nicht auf die Stimme“
  alternative: „gehorchten der Stimme nicht“ oder „hörten die Stimme nicht“
  rationale: Die Formulierung bezeichnet nicht bloß ein akustisches Nicht-Hören, sondern schuldhaftes Nicht-Beachten. Zugleich sagt der griechische Wortlaut nicht ausdrücklich „gehorchen“. Die gewählte deutsche Wendung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Redeweise. Der Satz endet entsprechend dem griechischen Text mit einem Komma, da er syntaktisch in den folgenden Vers weiterführt.
