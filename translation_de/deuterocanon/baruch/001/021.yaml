  naturalness: „Und wir hörten nicht auf die Stimme des Herrn, unseres Gottes“ ist würdiges, modernes Bibeldeutsch. „nach allem zu hören, was die Propheten gesagt hatten“ ist im Deutschen natürlicher und verdeutlicht ohne Bedeutungszugabe, worauf sich κατά bezieht.
