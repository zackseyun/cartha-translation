lexical_decisions:
- source_word: ὧν
  choice: mit denen
  rationale: Das Genitivpronomen ist rückbezüglich und wird im Deutschen entsprechend dem vorausgesetzten Bezugswort idiomatisch mit „mit denen“ wiedergegeben.
- source_word: ἡμάρτομεν
  choice: wir gesündigt haben
  rationale: Gibt den Aorist von ἁμαρτάνω in diesem rückblickenden Relativsatz natürlich und inhaltlich genau wieder.
- source_word: ἔναντι Κυρίου
  choice: vor dem Herrn
  rationale: Bewahrt die räumlich-relationale Bildsprache von ἔναντι und vermeidet, sie ohne zwingenden Grund zum bloßen „gegen“ zu verengen.
theological_decisions:
- issue: Verhältnis der Sünde zum Herrn
  choice: vor dem Herrn
  alternative: gegen den Herrn
  rationale: Der griechische Ausdruck ἔναντι Κυρίου bezeichnet hier zunächst das Sündigen in der Gegenwart beziehungsweise vor den Augen des Herrn. „Gegen“ wäre theologisch möglich, würde aber die genuine Ausdrucksweise stärker interpretieren.
translation_notes:
  register: Kurzer, würdevoller Anschluss an den vorausgehenden Satz. „Herr“ folgt der üblichen deutschen Wiedergabe von Κύριος; die Syntax bleibt bewusst fragmentarisch, da der Vers im Griechischen einen Relativsatz fortführt.
