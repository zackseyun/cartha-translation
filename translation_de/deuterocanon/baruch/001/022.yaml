translation:
  language: de
  text: Und jeder von uns ging fort, den Gedanken seines bösen Herzens folgend, um anderen Göttern zu dienen und in den Augen des Herrn, unseres Gottes, Böses zu tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Absicht seines bösen Herzens“. Das griechische Wort kann Denken, Gesinnung oder innere Absicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠχόμεθα
  choice: ging dahin
  rationale: οἴχομαι bezeichnet ein Fort- oder Dahingehen. „ging dahin“ bewahrt die Bewegung in ein abtrünniges Handeln, ohne im Deutschen eine räumliche Trennung überzubetonen.
- source_word: ἕκαστος
  choice: jeder von uns
  rationale: Die distributive Aussage wird natürlich wiedergegeben und zugleich die in der Verbform enthaltene erste Person Plural sichtbar gemacht.
- source_word: ἐν διανοίᾳ καρδίας αὐτοῦ τῆς πονηρᾶς
  choice: nach dem Sinnen seines bösen Herzens
  rationale: διάνοια kann Denken, Gesinnung oder Absicht bezeichnen; „Sinnen“ bewahrt die Mehrdeutigkeit zwischen innerem Denken und willentlicher Ausrichtung. „Herz“ erhält die biblische Anthropologie des Ausgangstextes.
- source_word: ἐργάζεσθαι θεοῖς ἑτέροις
  choice: anderen Göttern zu dienen
  rationale: ἐργάζομαι mit dem Dativ bezeichnet hier im Kontext des Götzendienstes ein Tätigsein beziehungsweise Dienen für andere Götter.
- source_word: ποιῆσαι τὰ κακά
  choice: zu tun, was böse ist
  rationale: Die substantivierte neutrale Pluralform wird idiomatisch und zugleich eng am moralischen Gehalt des Griechischen wiedergegeben.
- source_word: κατʼ ὀφθαλμοὺς Κυρίου θεοῦ ἡμῶν
  choice: in den Augen des Herrn, unseres Gottes
  rationale: Die bildhafte Rede von den Augen bleibt erhalten und bezeichnet Gottes Wahrnehmung und Urteil.
- source_word: Κυρίου
  choice: Herrn
  rationale: κύριος bezieht sich hier auf den Gott Israels; „Herr“ ist die angemessene etablierte Wiedergabe.
theological_decisions:
- issue: Bedeutung von κύριος im LXX-Kontext
  choice: Herr
  alternative: Gebieter
  rationale: Der Ausdruck bezeichnet hier den Gott Israels im Bundeszusammenhang. „Herr“ entspricht dem etablierten biblischen Sprachgebrauch, ohne eine zusätzliche Deutung einzutragen.
- issue: Charakterisierung des Handelns gegenüber anderen Göttern
  choice: anderen Göttern zu dienen
  alternative: für andere Götter zu arbeiten
  rationale: Der Zusammenhang beschreibt Abfall und Götzendienst. „dienen“ gibt den idiomatischen Sinn wieder, ohne über den griechischen Wortlaut hinauszugehen.
- issue: Innere Ursache des Ungehorsams
  choice: nach dem Sinnen seines bösen Herzens
  alternative: in der Absicht seines bösen Herzens
  rationale: Die Formulierung wahrt die Spannung zwischen Denken, Gesinnung und Absicht, statt διάνοια ausschließlich voluntativ festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener biblischer Bildsprache. „Sinnen“ ist leicht gehoben, aber allgemein verständlich und bewahrt die Bedeutungsbreite von διάνοια. Die Reihung der Infinitive folgt dem Gedankengang des griechischen Satzes.
