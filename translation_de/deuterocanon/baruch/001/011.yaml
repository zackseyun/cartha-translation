base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/011.yaml
  text: And pray for the life of Nebuchodonosor king of Babylon[a], and for the life of Baltasar his son[b], so that their days may be like the days of heaven upon the earth.
translation:
  language: de
  text: Und betet für das Leben Nabuchodonosors, des Königs von Babylon, und für das Leben seines Sohnes Baltasar[a], damit ihre Tage wie die Tage des Himmels über der Erde seien.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Namen folgen den griechischen Formen. In anderen biblischen Überlieferungen sind die Könige unter den Namen »Nebukadnezar« und »Belschazzar« bekannt.
    reason: alternative_reading
  - marker: b
    text: 'Sinngemäß: »damit ihre Tage lange währen, solange der Himmel über der Erde steht«. Der griechische Text bewahrt hier ein anschauliches Bild für ein langes Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεύξασθε
  choice: betet
  rationale: Der Aorist-Imperativ Plural ist eine unmittelbare Aufforderung. »Betet« gibt sie im modernen Deutschen knapp und natürlich wieder.
- source_word: περὶ τῆς ζωῆς
  choice: für das Leben
  rationale: περί mit Genitiv bezeichnet hier das Anliegen des Gebets. Die Wiedergabe bleibt beim ausdrücklich genannten ζωή (»Leben«), statt es erweiternd als »Wohlergehen« zu deuten.
- source_word: Ναβουχοδονοσὸρ
  choice: Nabuchodonosor
  rationale: Der Name wird aus der griechischen Form transliteriert und nicht an die aus anderen biblischen Überlieferungen geläufigere deutsche Form »Nebukadnezar« angeglichen.
- source_word: Βαλτασὰρ
  choice: Baltasar
  rationale: »Baltasar« bildet die griechische Namensform unmittelbar ab; eine Angleichung an »Belschazzar« würde eine andere Namenstradition in den griechischen Text eintragen.
- source_word: ἵνα ὦσιν αἱ ἡμέραι αὐτῶν
  choice: damit ihre Tage … seien
  rationale: »Damit« bringt den von ἵνα eingeleiteten Zweck zum Ausdruck; der Konjunktiv »seien« bewahrt die Zielrichtung des Gebets.
- source_word: ὡς αἱ ἡμέραι τοῦ οὐρανοῦ ἐπὶ τῆς γῆς
  choice: wie die Tage des Himmels über der Erde
  rationale: Die ungewöhnliche, auf lange Dauer zielende Bildsprache bleibt erhalten. »Über der Erde« gibt ἐπὶ τῆς γῆς in diesem räumlichen Bild natürlicher wieder als das missverständliche »auf der Erde«.
theological_decisions:
- issue: Bildhafte Schlusswendung oder ausdrückliche Deutung als langes Leben
  choice: Die Metapher »wie die Tage des Himmels über der Erde« wird im Haupttext bewahrt.
  alternative: »damit ihre Tage lange währen, solange der Himmel über der Erde steht«
  rationale: Der griechische Wortlaut verwendet ein eindrückliches und schriftsprachlich resonantes Bild für Dauer. Eine reine Deutung als »sehr lange« würde diese Spannung und Bildkraft einebnen.
- issue: Wiedergabe der Königsnamen
  choice: Die Namen werden nach dem griechischen Text als »Nabuchodonosor« und »Baltasar« wiedergegeben.
  alternative: »Nebukadnezar« und »Belschazzar«
  rationale: Die unmittelbare Übersetzung aus dem griechischen Zeugen soll sichtbar bleiben; die geläufigeren deutschen Formen beruhen auf anderen Namenstraditionen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzführung bleibt nah am griechischen Parallelismus, während Genitivformen und Wortstellung idiomatisch deutsch gestaltet sind. Die fremd wirkenden Namensformen und die ungewöhnliche Himmelsmetapher werden wegen der Priorität des griechischen Ausgangstextes bewusst beibehalten und durch Fußnoten erschlossen.
