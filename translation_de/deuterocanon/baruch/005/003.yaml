  text: For God will show your splendor to all under heaven[a].
translation:
  language: de
  text: Denn Gott wird der ganzen Welt unter dem Himmel deinen Glanz zeigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Pracht“ oder „deine Herrlichkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Denn
  rationale: γάρ begründet oder erläutert die vorausgehende Zusage. „Denn“ bewahrt diese Verknüpfung im Deutschen natürlich und präzise.
- source_word: θεὸς
  choice: Gott
  rationale: Das Substantiv bezeichnet in diesem Zusammenhang eindeutig den Gott Israels.
- source_word: δείξει
  choice: wird … zeigen
  rationale: Das Futur von δείκνυμι bezeichnet Gottes künftiges Sichtbarmachen; „zeigen“ ist direkt und idiomatisch.
- source_word: τῇ ὑπʼ οὐρανὸν πάσῃ
  choice: allen unter dem Himmel
  rationale: Die Formulierung bewahrt das Bild und den umfassenden Geltungsbereich des griechischen Ausdrucks. Das feminine πάσῃ kann elliptisch auf die ganze Welt beziehungsweise bewohnte Erde bezogen sein; die deutsche Wiedergabe hält die im Kontext naheliegende personale Weite offen.
- source_word: τὴν σὴν
  choice: deinen
  rationale: Das Possessivpronomen steht im Singular und richtet sich unmittelbar an Jerusalem/Zion.
- source_word: λαμπρότητα
  choice: Glanz
  rationale: λαμπρότης umfasst leuchtende Pracht und erhabene Herrlichkeit. „Glanz“ erhält die sichtbare, lichtvolle Nuance und klingt im modernen Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe der wiederhergestellten Würde Jerusalems in λαμπρότητα
  choice: Glanz
  alternative: Pracht; Herrlichkeit; Strahlenglanz
  rationale: „Glanz“ verbindet sichtbare Helligkeit mit öffentlicher Würde, ohne den Ausdruck durch das theologisch stärker geprägte „Herrlichkeit“ vorschnell mit δόξα gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bewahrt den begründenden Anschluss durch „Denn“ und die universale Bildsprache „unter dem Himmel“, ohne den griechischen Ausdruck unnötig auszudeuten.
