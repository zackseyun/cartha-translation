lexical_decisions:
- source_word: Ἔκδυσαι
  choice: Leg ab
  rationale: Der Aorist-Medium-Imperativ von ἐκδύω bezeichnet das Ablegen eines Kleidungsstücks. „Leg ab“ ist im modernen Deutschen natürlich und bewahrt das Kleidungsbild.
- source_word: στολή
  choice: Gewand
  rationale: στολή kann ein langes oder stattliches Kleidungsstück bezeichnen. „Gewand“ wahrt das singularische Bild und den gehobenen Ton.
- source_word: πένθος
  choice: Trauer
  rationale: Das Wort bezeichnet Trauer und besonders ihren sichtbaren Ausdruck. „Trauer“ fügt sich unmittelbar in das Bild eines Trauergewands ein.
- source_word: κάκωσις
  choice: Elend
  rationale: κάκωσις umfasst Bedrängnis, Misshandlung und einen elenden Zustand. „Elend“ lässt Ursache und genaue Art des Leidens offen.
- source_word: ἔνδυσαι
  choice: leg … an
  rationale: Der Aorist-Medium-Imperativ von ἐνδύω bildet das direkte Gegenstück zu Ἔκδυσαι. „Anlegen“ erhält diesen bewussten Gegensatz zwischen Ablegen und Anlegen.
- source_word: εὐπρέπεια
  choice: Pracht
  rationale: εὐπρέπεια bezeichnet Schönheit, Würde und herrliche Erscheinung. „Pracht“ gibt den erhabenen und sichtbaren Charakter knapp wieder.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte und in diesem Gottesbezug sachlich passende Wiedergabe von δόξα.
- source_word: παρὰ τοῦ θεοῦ
  choice: von Gott kommend
  rationale: παρά mit Genitiv bezeichnet hier Ursprung oder Quelle. Die Formulierung macht deutlich, dass die Herrlichkeit von Gott ausgeht, ohne sie schlicht mit „Gottes Herrlichkeit“ gleichzusetzen.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die Wendung bezeichnet bleibende Dauer. „Für immer“ ist gegenwärtiges, klares Deutsch und passt zur verheißenen dauerhaften Wiederherstellung.
theological_decisions:
- issue: Personifizierung Jerusalems
  choice: Jerusalem wird unmittelbar angesprochen und soll sinnbildlich ein Trauergewand ablegen und Herrlichkeit anlegen.
  alternative: Die Aussage rein kollektiv umschreiben und das Kleidungsbild abschwächen.
  rationale: Der griechische Text redet Jerusalem direkt an und verwendet zwei gegensätzliche Imperative aus dem Bereich des Bekleidens. Die Personifizierung gehört zur prophetischen Aussageform.
- issue: Ursprung der neuen Herrlichkeit
  choice: „die von Gott kommende Herrlichkeit“
  alternative: „Gottes Herrlichkeit“
  rationale: παρὰ τοῦ θεοῦ hebt die Herkunft von Gott hervor. Die gewählte Fassung bewahrt diesen Quellenbezug und vermeidet die eindeutige Gleichsetzung mit Gottes eigener Herrlichkeit.
- issue: Verhältnis von εὐπρέπεια und δόξα
  choice: „die Pracht der … Herrlichkeit“
  alternative: „die Schönheit der … Herrlichkeit“
  rationale: Der Genitiv bleibt formal erhalten; dadurch wird weder Pracht noch Herrlichkeit in den jeweils anderen Begriff aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Befehle „leg ab“ und „leg … an“ bewahren das prägnante Kleidungsbild; die Wortstellung bleibt trotz des eingeschobenen Genitivgefüges gut verständlich.
