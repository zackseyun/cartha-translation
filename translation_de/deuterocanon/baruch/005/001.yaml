base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/001.yaml
  text: Take off[a], O Jerusalem, the garment of your mourning and affliction[b], and put on forever the splendor of the glory from God.
translation:
  language: de
  text: Leg ab, Jerusalem, das Gewand deiner Trauer und deines Elends[a], und leg für immer die Pracht[b] der von Gott kommenden Herrlichkeit an.
  philosophy: optimal-equivalence
  footnotes:
