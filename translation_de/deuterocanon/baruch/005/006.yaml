base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/006.yaml
  text: For they went out from you on foot[a], being led away by enemies, but God brings them to you[b], carried with glory as on a royal throne.
translation:
  language: de
  text: Denn zu Fuß zogen sie von dir fort, von Feinden weggeführt; doch Gott führt sie zu dir, in Herrlichkeit getragen wie auf einem Königsthron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον
  choice: zogen sie fort
  rationale: Gibt die vergangene Bewegung von der personifizierten Stadt weg natürlich wieder, ohne eine Rückkehr bereits in das Verb hineinzulesen.
- source_word: παρὰ σοῦ
  choice: von dir
  rationale: Bewahrt die direkte Anrede an Jerusalem/Zion und den Gedanken der Trennung.
- source_word: πεζοὶ
  choice: zu Fuß
  rationale: Ist die klare, idiomatische Wiedergabe und bildet den beabsichtigten Gegensatz zum ehrenvollen Getragenwerden bei der Heimkehr.
- source_word: ἀγόμενοι ὑπʼ ἐχθρῶν
  choice: von Feinden weggeführt
  rationale: Gibt die passive Bewegung unter feindlicher Gewalt wieder, ohne das Maß der Gewalt unnötig zu verstärken.
- source_word: εἰσάγει
  choice: führt sie zu dir
  rationale: Bewahrt die Bewegungsrichtung hinein beziehungsweise zur angesprochenen Stadt hin. Ein ausdrückliches „zurück“ wird nicht ergänzt, da es zwar aus dem Zusammenhang folgt, aber nicht im Verb selbst steht.
- source_word: αἰρομένους
  choice: getragen
  rationale: Erhält den Kontrast zu „zu Fuß“ und das Bild einer erhöhten, ehrenvollen Beförderung.
- source_word: μετὰ δόξης
  choice: in Herrlichkeit
  rationale: Bewahrt das religiöse und ehrenvolle Gewicht von δόξα in einer im Deutschen natürlichen Verbindung.
- source_word: ὡς θρόνον βασιλείας
  choice: wie auf einem Königsthron
  rationale: Gibt das verdichtete königliche Bild verständlich wieder. Das ergänzte „auf“ lässt die Heimkehrenden als Getragene erscheinen und entspricht dem Kontrast des Verses.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Die übliche und unmittelbare Wiedergabe.
theological_decisions:
- issue: Umkehrung von Exil und Erniedrigung
  choice: Der Gegensatz zwischen dem Fortziehen zu Fuß unter feindlicher Gewalt und der von Gott bewirkten, ehrenvollen Heimführung bleibt deutlich.
  alternative: „Gott bringt sie zu dir zurück“ würde die Rückkehr ausdrücklich benennen.
  rationale: Der Kontext trägt den Rückkehrgedanken, doch die Übersetzung vermeidet es, das im griechischen εἰσάγει nicht ausdrücklich enthaltene „zurück“ in den Haupttext einzufügen.
- issue: Bild des erhöhten Transports
  choice: Das Bild „in Herrlichkeit getragen wie auf einem Königsthron“ wird bewahrt.
  alternative: Eine erklärende Wiedergabe wie „mit königlichen Ehren heimgebracht“ wäre glatter, würde aber das konkrete Bild auflösen.
  rationale: Die poetische Spannung und die königliche Erhöhung sollen nicht in eine abstrakte Erklärung umgeformt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Rhythmus. Die personifizierte Anrede Jerusalems bleibt erhalten; das königliche Bild wird verständlich, aber nicht konfessionell ausgedeutet.
