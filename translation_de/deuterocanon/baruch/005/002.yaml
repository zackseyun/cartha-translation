base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/002.yaml
  text: Put on the robe of the righteousness that comes from God[d][c][b][a], and place on your head the turban of the glory of the Eternal.
translation:
  language: de
  text: Zieh den Mantel[a] der Gerechtigkeit an, die von Gott kommt, und setz dir den Turban[b] der Herrlichkeit des Ewigen[c] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet ein weites äußeres Kleidungsstück; auch „Überwurf“ oder „Obergewand“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Kopfbund“ oder traditionell „Mitra“. Gemeint ist eine gebundene Kopfbedeckung.'
    reason: lexical_alternative
  - marker: c
    text: Weniger wahrscheinlich kann die Wendung auch als „den Turban der ewigen Herrlichkeit“ verstanden werden. Der griechische Text weist eher auf die Herrlichkeit des Ewigen, also Gottes.
    reason: alternative_reading
lexical_decisions:
- source_word: περιβαλοῦ
  choice: Leg … an
  rationale: Der Aoristimperativ von περιβάλλω bezeichnet hier das Anlegen eines Kleidungsstücks. „Leg … an“ gibt das Kleidungsbild natürlich und unmittelbar wieder.
- source_word: διπλοΐδα
  choice: Mantel
  rationale: διπλοΐς bezeichnet ein weites beziehungsweise doppelt gelegtes äußeres Kleidungsstück. „Mantel“ ist im poetisch-feierlichen Zusammenhang verständlich, ohne eine unsichere historische Form zu behaupten.
- source_word: τῆς παρὰ τοῦ θεοῦ δικαιοσύνης
  choice: der Gerechtigkeit …, die von Gott kommt
  rationale: δικαιοσύνη wird mit „Gerechtigkeit“ wiedergegeben; παρὰ τοῦ θεοῦ bezeichnet den Ursprung bei Gott. Der Relativsatz macht diese Beziehung in natürlichem Deutsch eindeutig.
- source_word: ἐπίθου
  choice: setz dir … auf
  rationale: Der Imperativ von ἐπιτίθημι bedeutet „aufsetzen/auflegen“. Mit einem Kopfbund ist „setz dir … auf“ die idiomatische deutsche Form.
- source_word: μίτραν
  choice: Kopfbund
  rationale: μίτρα bezeichnet eine gebundene Kopfbedeckung. „Kopfbund“ bewahrt das Bild, ohne die heute kirchlich geprägte Vorstellung einer Mitra oder die kulturelle Spezifizierung von „Turban“ in den Haupttext einzutragen.
- source_word: τῆς δόξης τοῦ αἰωνίου
  choice: der Herrlichkeit des Ewigen
  rationale: Die Genitivfolge wird formal bewahrt. Das substantivierte αἰώνιος bezeichnet wahrscheinlich Gott als „den Ewigen“.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht beziehungsweise gerechtes Handeln
  rationale: Das deutsche „Gerechtigkeit“ kann sowohl den rechtlichen als auch den sittlich-bundeshaften Bedeutungsbereich tragen und wahrt damit die Spannung des griechischen Ausdrucks im Kleidungsbild.
- issue: Substantivisches Verständnis von τοῦ αἰωνίου
  choice: des Ewigen
  alternative: der ewigen Herrlichkeit
  rationale: Die Artikelfolge spricht am ehesten dafür, αἰώνιος substantivisch als Gottesbezeichnung zu lesen. Die weniger wahrscheinliche adjektivische Auffassung wird in einer Fußnote erhalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Kleidungsbild. Die direkte Anrede steht entsprechend dem griechischen Singular in der vertrauten Du-Form. Unnötige kirchliche Fachsprache wird vermieden; sachlich relevante lexikalische und syntaktische Alternativen bleiben in den Fußnoten sichtbar.
