base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/005.yaml
  text: Rise up[a], Jerusalem, and stand on the height, and look toward the east, and see your children gathered from the setting of the sun to its rising, at the word of the Holy One[b], rejoicing in the remembrance of God.
translation:
  language: de
  text: 'Steh auf, Jerusalem, und stell dich auf die Höhe! Schau dich nach Osten um und sieh: Deine Kinder sind vom Untergang der Sonne bis zu ihrem Aufgang versammelt, auf das Wort des Heiligen hin[a]; sie freuen sich im Gedenken Gottes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Wort des Heiligen“. Der Dativ kann das Mittel bezeichnen, durch das die Kinder gesammelt wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „weil Gott an sie gedacht hat“ oder „im Gedenken an Gott“. Die knappe griechische Wendung kann sowohl Gottes Gedenken an sein Volk als auch das Gedenken des Volkes an Gott bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάστηθι
  choice: Steh auf
  rationale: Der Aoristimperativ ruft Jerusalem unmittelbar zum Handeln auf; „Steh auf“ ist gegenwärtiges, natürliches Deutsch.
- source_word: στῆθι ἐπὶ τοῦ ὑψηλοῦ
  choice: stell dich auf die Höhe
  rationale: Die Formulierung bewahrt den allgemeinen erhöhten Standort, ohne einen im Griechischen nicht ausdrücklich genannten Berg einzuführen.
- source_word: περίβλεψαι πρὸς ἀνατολάς
  choice: Blicke nach Osten
  rationale: Die griechische Wendung bezeichnet die Ausrichtung des Blicks nach Osten; eine wörtliche Verbindung von „ringsum blicken“ und „nach Osten“ wäre im Deutschen schwerfällig.
- source_word: συνηγμένα τὰ τέκνα
  choice: Deine Kinder sind … versammelt
  rationale: Das Perfektpartizip bezeichnet den erreichten Zustand des Versammeltseins; „Kinder“ gibt τέκνα geschlechtsumfassend wieder.
- source_word: ἀπὸ ἡλίου δυσμῶν ἕως ἀνατολῶν
  choice: vom Untergang der Sonne bis zu ihrem Aufgang
  rationale: Die Übersetzung erhält das Bild des Sonnenuntergangs und Sonnenaufgangs, statt es zu „von Westen bis Osten“ zu verflachen.
- source_word: τῷ ῥήματι
  choice: auf das Wort … hin
  rationale: Diese Wiedergabe lässt erkennen, dass das Wort Anlass oder wirksamer Ruf der Sammlung ist, ohne den Dativ eindeutig nur instrumental festzulegen.
- source_word: τοῦ ἁγίου
  choice: des Heiligen
  rationale: Der substantivierte Genitiv ist ein ehrfürchtiger Gottesbeiname; „des Heiligen“ fügt das im Griechischen nicht stehende Wort „Gott“ nicht hinzu.
- source_word: χαίροντες
  choice: sie freuen sich
  rationale: Die finite deutsche Form macht den Bezug auf die versammelten Kinder klar und gibt das gegenwärtige Partizip natürlich wieder.
- source_word: τῇ τοῦ θεοῦ μνείᾳ
  choice: im Gedenken Gottes
  rationale: Der deutsche Genitiv bewahrt ähnlich wie das Griechische die Offenheit zwischen Gottes Gedenken an sein Volk und dem Gedenken des Volkes an Gott.
theological_decisions:
- issue: Bedeutung von τῇ τοῦ θεοῦ μνείᾳ
  choice: im Gedenken Gottes
  alternative: weil Gott an sie gedacht hat; im Gedenken an Gott
  rationale: Der Genitiv kann subjektiv oder objektiv verstanden werden. Die Übersetzung wahrt diese theologisch bedeutsame Mehrdeutigkeit, statt festzulegen, wer wessen gedenkt.
- issue: Funktion des Dativs τῷ ῥήματι
  choice: auf das Wort des Heiligen hin
  alternative: durch das Wort des Heiligen
  rationale: Der Dativ kann den Anlass beziehungsweise die Grundlage oder das Mittel der Sammlung bezeichnen. Der Haupttext bleibt offen; die instrumentale Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anrede. Die Bildsprache von Sonnenuntergang und Sonnenaufgang sowie die Mehrdeutigkeit der beiden Dativ- und Genitivkonstruktionen bleiben erhalten.
