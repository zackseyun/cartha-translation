  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. Die Wiederaufnahme von „mit“ vor der abschließenden Wortgruppe ist natürlicher und bildet σύν klarer ab als „begleitet von“.
  terminology: „Herrlichkeit“, „Barmherzigkeit“ und „Gerechtigkeit“ sind angemessene, bibelsprachlich etablierte Wiedergaben. „Gerechtigkeit“ bewahrt die Bedeutungsweite von δικαιοσύνη; „Recht“ kann als lexikalische Alternative erläutert werden.
