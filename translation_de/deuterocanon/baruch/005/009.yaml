  - severity: low
    issue: „begleitet von“ ist gegenüber σύν weniger unmittelbar
    rationale: Die Wendung ist nicht falsch, kann aber im Deutschen den Eindruck erwecken, dass Israel oder Gottes Führung lediglich beiläufig begleitet werde. Das schlichte „mit“ entspricht der griechischen Koordination unmittelbarer.
