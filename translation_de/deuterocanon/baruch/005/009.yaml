base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/009.yaml
  text: For God will lead Israel with gladness[a], by the light of his glory, with mercy and righteousness from him.
translation:
  language: de
  text: Denn Gott wird Israel mit Freude führen im Licht seiner Herrlichkeit, mit Barmherzigkeit und der Gerechtigkeit, die von ihm kommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit weiterem Bezug: „mit Barmherzigkeit und Gerechtigkeit, die von ihm kommen“. „Gerechtigkeit“ kann auch „Recht“ bedeuten.'
    reason: Die singularische griechische Formulierung steht unmittelbar bei „Gerechtigkeit“, kann im Zusammenhang aber auch als auf beide koordinierten Begriffe bezogen verstanden werden; zudem wird die naheliegende lexikalische Alternative zu δικαιοσύνη vermerkt.
lexical_decisions:
- source_word: ἡγήσεται
  choice: wird führen
  rationale: Das Futur von ἡγέομαι bezeichnet hier Gottes Führen beziehungsweise Geleiten Israels und bewahrt das Motiv von Auszug und Wiederherstellung.
- source_word: μετʼ εὐφροσύνης
  choice: mit Freude
  rationale: εὐφροσύνη bezeichnet Freude oder Frohsinn; „mit Freude“ ist im modernen Deutschen natürlich und würdig.
- source_word: τῷ φωτὶ τῆς δόξης αὐτοῦ
  choice: im Licht seiner Herrlichkeit
  rationale: Der Dativ kann instrumental oder begleitend verstanden werden. „Im Licht“ wahrt diese Offenheit besser als eine ausschließlich instrumentale Formulierung.
- source_word: ἐλεημοσύνῃ
  choice: Barmherzigkeit
  rationale: Im Zusammenhang mit Gottes Handeln an Israel und in der Verbindung mit δικαιοσύνη bezeichnet das Wort hier göttliches Erbarmen, nicht Almosengeben.
- source_word: δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl die sittliche Richtigkeit als auch das gerechte Handeln Gottes ab und lässt die theologische Weite des griechischen Begriffs bestehen.
- source_word: τῇ παρʼ αὐτοῦ
  choice: die von ihm kommen
  rationale: Die attributive Präpositionalfügung beschreibt die Barmherzigkeit und Gerechtigkeit als von Gott ausgehend. Die deutsche Relativkonstruktion macht diesen Bezug verständlich.
theological_decisions:
- issue: Bedeutungsweite von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht
  rationale: „Gerechtigkeit“ bewahrt die umfassende biblische Bedeutung, während „Recht“ den Akzent stärker auf richterliche Gerechtigkeit legen würde.
- issue: Zuordnung von τῇ παρʼ αὐτοῦ
  choice: auf Barmherzigkeit und Gerechtigkeit bezogen
  alternative: nur auf Gerechtigkeit bezogen
  rationale: Obwohl das griechische Attribut formal eng bei δικαιοσύνῃ steht, lässt die koordinierte Wortgruppe einen gemeinsamen sachlichen Bezug auf beide von Gott kommenden Größen zu; die mögliche engere Zuordnung wird in der Fußnote festgehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Begleitet von“ verdeutlicht die mit σύν ausgedrückte Begleitung, ohne Barmherzigkeit und Gerechtigkeit zu bloßen Führungsmitteln zu machen. Die Formulierung wahrt zugleich die mögliche instrumentale oder räumlich-assoziative Bedeutung des Dativs bei „Licht“.
