base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/007.yaml
  text: For God has ordered that every high mountain and the everlasting hills be made low[a], and the valleys be filled for the leveling of the ground, so that Israel may walk safely in the glory of God.
translation:
  language: de
  text: Denn Gott hat angeordnet, dass jeder hohe Berg und die uralten Hügel abgetragen und die Schluchten aufgefüllt werden, um den Boden zu ebnen, damit Israel sicher in der Herrlichkeit Gottes[a] gehen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „durch die Herrlichkeit Gottes“ oder „mit der Herrlichkeit Gottes“. Der griechische Dativ kann das Mittel, die Begleitung oder den Bereich bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνέταξεν
  choice: hat angeordnet
  rationale: Gibt die verbindliche göttliche Anordnung und zugleich das zielgerichtete Gestalten natürlich wieder.
- source_word: ταπεινοῦσθαι
  choice: abgetragen werden
  rationale: Bei Bergen und Hügeln bezeichnet das Verb ein physisches Erniedrigen; „abgetragen“ ist im Zusammenhang der Einebnung anschaulich und idiomatisch.
- source_word: πᾶν ὄρος ὑψηλὸν
  choice: jeder hohe Berg
  rationale: Bewahrt den distributiven Sinn von πᾶν und gibt die Wortgruppe direkt wieder.
- source_word: θῖνας αἰωνίους
  choice: die uralten Hügel
  rationale: θῖνες kann Erhebungen, Hügel oder Rücken bezeichnen; „Hügel“ passt zum Geländeprofil. αἰωνίους meint hier am ehesten seit unvordenklicher Zeit bestehend, daher „uralt“ statt metaphysisch „ewig“.
- source_word: φάραγγας
  choice: die Schluchten
  rationale: Das Wort bezeichnet besonders Schluchten oder tiefe Geländeeinschnitte; „Schluchten“ bewahrt dieses konkretere Profil besser als das allgemeinere „Täler“.
- source_word: πληροῦσθαι
  choice: aufgefüllt werden
  rationale: Im Bild der Einebnung drückt „aufgefüllt“ das Füllen tiefer Geländeeinschnitte präzise aus.
- source_word: εἰς ὁμαλισμὸν τῆς γῆς
  choice: damit das Land eben wird
  rationale: Gibt das beabsichtigte Ergebnis der Abtragung und Auffüllung in natürlichem Deutsch wieder; γῆ bezeichnet hier das Gelände beziehungsweise Land.
- source_word: ἵνα βαδίσῃ
  choice: damit … seinen Weg gehen kann
  rationale: Bewahrt den Zwecksatz und die Vorstellung des tatsächlichen Gehens, klingt im Deutschen aber natürlicher als bloß „gehen“.
- source_word: ἀσφαλῶς
  choice: sicher
  rationale: Direkte und idiomatische Wiedergabe des Adverbs.
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: in der Herrlichkeit Gottes
  rationale: Bewahrt die Offenheit des griechischen Dativs eher als eine ausschließlich instrumentale Wiedergabe.
theological_decisions:
- issue: Funktion von τῇ τοῦ θεοῦ δόξῃ für Israels sicheres Gehen
  choice: in der Herrlichkeit Gottes
  alternative: durch die Herrlichkeit Gottes / mit der Herrlichkeit Gottes
  rationale: Der Dativ kann den Bereich, die Begleitung oder das Mittel bezeichnen. Die Hauptfassung lässt diese theologische Spannung möglichst offen; die Fußnote nennt die wesentlichen Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Geländeumgestaltung wird konkret und gut verständlich formuliert; die Mehrdeutigkeit der abschließenden Dativfügung bleibt durch Haupttext und Fußnote erhalten.
