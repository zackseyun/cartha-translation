  text: For your name will be called by God forever[b][a], “Peace of righteousness and glory of godliness.”
translation:
  language: de
  text: 'Denn Gott wird dich für immer nennen: »Friede der Gerechtigkeit[a] und Herrlichkeit der Gottesfurcht[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Friede der Rechtschaffenheit« beziehungsweise »Friede des Rechts«.'
    reason: δικαιοσύνης kann je nach Akzent Gerechtigkeit, Rechtschaffenheit oder Recht bezeichnen.
  - marker: b
    text: 'Oder: »Herrlichkeit der Frömmigkeit« beziehungsweise »Herrlichkeit der Ehrfurcht vor Gott«.'
    reason: θεοσεβείας bezeichnet Frömmigkeit oder ehrfürchtige Hinwendung zu Gott.
lexical_decisions:
- source_word: κληθήσεται … σου τὸ ὄνομα
  choice: dir … den Namen geben
  rationale: Die griechische Passivwendung bedeutet wörtlich, dass Jerusalems Name von Gott genannt werden wird. Im Deutschen gibt „Gott wird dir den Namen geben“ die Verleihung eines neuen Namens natürlich wieder, ohne τὸ ὄνομα zu „Titel“ zu verengen.
- source_word: παρὰ τοῦ θεοῦ
  choice: Gott
  rationale: παρά mit Genitiv bezeichnet hier bei der Namensgebung Ursprung beziehungsweise Urheber. Die aktive deutsche Formulierung macht Gott entsprechend zum handelnden Subjekt.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die feste Wendung bezeichnet bleibende Dauer; „für immer“ ist im heutigen Deutsch klar und idiomatisch.
- source_word: εἰρήνη
  choice: Friede
  rationale: Als Bestandteil des verliehenen Namens ist „Friede“ die passende, biblisch geprägte und dennoch verständliche Wiedergabe.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt im Deutschen die breite ethische, gemeinschaftliche und auf rechtes Verhalten bezogene Bedeutung von δικαιοσύνη; die Genitivbeziehung bleibt absichtlich offen.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ erhält den biblischen Klang von δόξα und umfasst Glanz sowie verliehene Ehre besser als das engere „Ehre“.
- source_word: θεοσεβείας
  choice: Gottesfurcht
  rationale: θεοσέβεια bezeichnet ehrfürchtige Hinwendung zu Gott. „Gottesfurcht“ ist prägnant und biblisch vertraut; mögliche Wiedergaben mit „Frömmigkeit“ oder „Ehrfurcht vor Gott“ werden in einer Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von δικαιοσύνης im verliehenen Namen
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Das deutsche „Gerechtigkeit“ wahrt die Breite des griechischen Ausdrucks und vermeidet eine Beschränkung auf persönliche Tugend. „Rechtschaffenheit“ bleibt als mögliche, stärker charakterbezogene Lesart erhalten.
- issue: Bedeutung von θεοσεβείας
  choice: Gottesfurcht
  alternative: Frömmigkeit; Ehrfurcht vor Gott
  rationale: Der Ausdruck benennt eine auf Gott gerichtete ehrfürchtige Haltung. Keine der deutschen Entsprechungen deckt das Bedeutungsfeld allein vollständig ab; daher stehen die wichtigsten Alternativen in der Fußnote.
- issue: Funktion der Schlussphrase
  choice: als wörtlich markierter, von Gott verliehener Name
  alternative: unmarkierte Apposition
  rationale: Die beiden nominativischen Wortgruppen nennen den Inhalt des neuen Namens. Anführungszeichen verdeutlichen diese syntaktische Funktion für heutige Leser, ohne zusätzlichen Inhalt einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die aktive Formulierung der Namensgebung ist idiomatischer als das schwerfällige „dein Name wird von Gott genannt werden“. Der feierliche Doppelname bleibt in seiner genitivischen Dichte erhalten; Anführungszeichen kennzeichnen ihn als Namensinhalt. Sämtliche Fußnotenmarker stehen im Haupttext.
