base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/011.yaml
  text: And now[a], O Lord, God of Israel, who brought your people out of the land of Egypt with a mighty hand, with signs and wonders and with great power and with an uplifted arm, and made for yourself a name, as at this day,
translation:
  language: de
  text: Und nun, Herr, Gott Israels, der du dein Volk mit starker Hand aus dem Land Ägypten herausgeführt hast, mit Zeichen und Wundern, mit großer Macht und mit hoch erhobenem Arm[a], und dir einen Namen gemacht hast, wie es heute ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit hohem Arm“; auch möglich: „mit ausgestrecktem Arm“. Das Griechische hat hier „hoch/erhoben“ und weicht damit von der geläufigeren Exodus-Wendung „ausgestreckter Arm“ ab.'
    reason: Bewahrt die besondere Wortwahl βραχίονι ὑψηλῷ und nennt die traditionelle Übersetzungsalternative.
lexical_decisions:
- source_word: Κύριε ὁ θεὸς Ἰσραήλ
  choice: Herr, Gott Israels
  rationale: Bewahrt die direkte Anrede und den göttlichen Titel in natürlichem, würdigem Deutsch.
- source_word: ἐξήγαγες τὸν λαόν σου ἐκ γῆς Αἰγύπτου
  choice: der du dein Volk aus dem Land Ägypten herausgeführt hast
  rationale: Die Konstruktion „der du“ bildet das griechische Relativpronomen mit der Anrede in idiomatischem Deutsch ab; „herausgeführt“ bewahrt die Exodus-Sprache.
- source_word: ἐν χειρὶ κραταιῷ
  choice: mit starker Hand
  rationale: Gibt das vertraute biblische Machtbild klar und quellennah wieder.
- source_word: ἐν σημείοις καὶ ἐν τέρασιν
  choice: mit Zeichen und Wundern
  rationale: Bewahrt die feste Wortpaarung und die rhetorische Reihung des Griechischen.
- source_word: ἐν δυνάμει μεγάλῃ
  choice: mit großer Macht
  rationale: „Macht“ ist im heutigen Deutsch transparent und entspricht der Bedeutung von δύναμις in diesem Zusammenhang.
- source_word: ἐν βραχίονι ὑψηλῷ
  choice: mit hoch erhobenem Arm
  rationale: ὑψηλός bedeutet hier „hoch/erhoben“; die Formulierung wahrt den Unterschied zur geläufigeren Wendung „ausgestreckter Arm“ und klingt zugleich natürlich.
- source_word: ἐποίησας σεαυτῷ ὄνομα
  choice: dir einen Namen gemacht hast
  rationale: Bewahrt das ausdrückliche Reflexivpronomen und die biblische Redewendung für erworbenes Ansehen.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: wie es noch heute sichtbar ist
  rationale: 'Gibt die formelhafte Aussage idiomatisch wieder: Gottes Name und Ansehen sind bis in die Gegenwart offenkundig.'
theological_decisions:
- issue: Exodus-Sprache über Gottes rettendes Handeln
  choice: Die kumulative Folge „mit starker Hand … mit Zeichen und Wundern … mit großer Macht … mit hoch erhobenem Arm“ bleibt erhalten.
  alternative: Die Aufzählung zu einer allgemeineren Aussage über Gottes machtvolle Rettung zusammenziehen.
  rationale: Die Häufung der Machtbilder ist rhetorisch und theologisch bedeutsam; sie erinnert an die Exodusüberlieferung und soll nicht eingeebnet werden.
- issue: Bedeutung von ὡς ἡ ἡμέρα αὕτη
  choice: wie es noch heute sichtbar ist
  alternative: wie an diesem Tag
  rationale: Die Wendung bezeichnet wahrscheinlich die bis zur Gegenwart erkennbare Geltung des Namens Gottes. Die gewählte Fassung macht diesen Sinn verständlich, ohne einen bestimmten einzelnen Kalendertag anzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener biblischer Bildsprache und kumulativer Satzbewegung. Der Vers bleibt als syntaktisch offener Gebetssatz mit abschließendem Komma stehen, entsprechend dem griechischen Zusammenhang.
