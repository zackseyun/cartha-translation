  source_fidelity: Die Übersetzung gibt Anrede, Exodusmotiv und die gehäuften Instrumentalangaben insgesamt zuverlässig wieder. „mit hoch erhobenem Arm“ bildet βραχίονι ὑψηλῷ angemessen ab und wahrt den Unterschied zu der geläufigeren Formulierung „ausgestreckter Arm“. Die Schlusswendung ὡς ἡ ἡμέρα αὕτη besagt jedoch nicht ausdrücklich, dass Gottes Name ‚sichtbar‘ sei; dies ist eine interpretierende Ergänzung.
