  terminology: „Herr, Gott Israels“, „dein Volk“, „starke Hand“, „Zeichen und Wunder“, „große Macht“ und „einen Namen gemacht“ sind treffend und registergerecht. Der Fußnotenanker steht unmittelbar bei „Arm“ und ist korrekt gesetzt.
