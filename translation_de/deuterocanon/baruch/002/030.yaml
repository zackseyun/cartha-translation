base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/030.yaml
  text: For I knew that they would certainly not listen to me[a], because they are a stiff-necked people; but in the land of their exile they will return to their heart,
translation:
  language: de
  text: Denn ich wusste, dass sie ganz gewiss nicht auf mich hören würden, weil sie ein halsstarriges Volk sind; und im Land ihrer Verbannung werden sie in ihrem Herzen umkehren[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sie werden zu ihrem Herzen zurückkehren«; auch möglich: »sie werden es sich zu Herzen nehmen«, »sie werden sich besinnen«.'
    reason: Die griechische, semitisch geprägte Wendung bezeichnet eine innere Hinwendung bzw. Umkehr. Die Fußnote bietet idiomatische Deutungsmöglichkeiten, ohne die offene Formulierung des Haupttexts einzuengen.
lexical_decisions:
- source_word: ἔγνων
  choice: ich wusste
  rationale: Der Aorist von γινώσκω bezeichnet hier Gottes vorausgehendes Wissen und wird im Deutschen natürlich mit dem Präteritum wiedergegeben.
- source_word: οὐ μὴ ἀκούσωσίν μου
  choice: sie ganz gewiss nicht auf mich hören würden
  rationale: οὐ μή mit Konjunktiv ist eine nachdrückliche Verneinung. »Auf mich hören« bewahrt sowohl das Hören als auch den Sinn des Gehorchens, ohne »meine Stimme« hinzuzufügen.
- source_word: λαὸς σκληροτράχηλος
  choice: ein halsstarriges Volk
  rationale: »Halsstarrig« erhält das biblische Körperbild des griechischen Kompositums und ist im modernen Standarddeutsch verständlich.
- source_word: ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν
  choice: sie werden sich dies zu Herzen nehmen
  rationale: Die semitisch geprägte Wendung bedeutet eine innere Umkehr beziehungsweise ein Sich-Besinnen. Die idiomatische deutsche Formulierung bewahrt das Herzmotiv, während die Fußnote den ungewöhnlichen griechischen Wortlaut sichtbar macht.
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  choice: im Land ihrer Verbannung
  rationale: ἀποικισμός bezeichnet das Wegführen und Leben fern der Heimat. »Verbannung« gibt dies klar wieder und passt zum konkreten Land ihres Exils.
theological_decisions:
- issue: Bedeutung von ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν
  choice: »sie werden sich dies zu Herzen nehmen« im Haupttext
  alternative: »sie werden zu ihrem Herzen zurückkehren« oder »sie werden in ihrem Herzen umkehren«
  rationale: Die Formulierung bezeichnet eine innere Hinwendung oder Besinnung, verwendet aber nicht ausdrücklich einen eindeutigen Fachausdruck für Buße. Daher wird die geistliche Dimension bewahrt, ohne sie im Haupttext enger festzulegen.
- issue: Verhältnis der beiden Aussagen
  choice: »Doch« leitet die spätere innere Wendung ein
  alternative: bloßes »und«
  rationale: 'καί kann hier im Zusammenhang einen kontrastierenden Fortgang ausdrücken: Trotz des angekündigten Nicht-Hörens folgt in der Verbannung eine innere Besinnung. »Doch« macht diese Spannung im Deutschen natürlich sichtbar.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der traditionelle Ausdruck »halsstarrig« bewahrt das biblische Bild; die schwer verständliche Herz-Wendung wird idiomatisch übersetzt und in der Fußnote transparent gemacht. Das abschließende Komma bleibt erhalten, da der Satz im folgenden Vers weitergeführt wird.
