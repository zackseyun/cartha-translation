base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/025.yaml
  text: And behold[a], they have been exposed to the heat of the day and to the frost of the night; and they died in grievous sufferings, in famine and by the sword and in exile.
translation:
  language: de
  text: 'Und sieh: Sie liegen hingeworfen, der Hitze des Tages und dem Frost der Nacht ausgesetzt; und sie starben unter schweren Leiden, durch Hunger und Schwert und in der Verbannung.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Verschleppung“ oder „in der Deportation“; das griechische Wort bezeichnet wörtlich ein Wegsenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: sieh
  rationale: Die direkte Aufforderung lenkt wie das griechische Aufmerksamkeitswort den Blick auf das Folgende, ohne altertümlich zu klingen.
- source_word: ἐξεριμμένα
  choice: liegen hingeworfen
  rationale: Die Form bezeichnet ein gewaltsames Hinauswerfen mit fortdauerndem Ergebnis. Die Wiedergabe bewahrt sowohl das passive Geschehen als auch den Zustand der den Elementen preisgegebenen Körper.
- source_word: τῷ καύματι τῆς ἡμέρας
  choice: der Hitze des Tages ausgesetzt
  rationale: Die Formulierung gibt den Dativ als Ausgesetztsein wieder und erhält das konkrete Bild der Tageshitze.
- source_word: τῷ παγετῷ τῆς νυκτός
  choice: dem Frost der Nacht ausgesetzt
  rationale: παγετός bezeichnet Frost oder eisige Kälte; „Frost“ bewahrt den konkreten Gegensatz zur Hitze des Tages.
- source_word: ἐν πόνοις πονηροῖς
  choice: unter schweren Leiden
  rationale: Die Wendung bezeichnet schlimme, qualvolle Leiden. „Unter schweren Leiden“ ist im Deutschen natürlich und wahrt die verstärkende negative Bedeutung.
- source_word: ἐν λιμῷ
  choice: durch Hunger
  rationale: Im Zusammenhang mit dem Sterben bezeichnet die Präpositionalfügung Hunger beziehungsweise Hungersnot als Todesursache; „durch Hunger“ ist klar und idiomatisch.
- source_word: ἐν ῥομφαίᾳ
  choice: durch das Schwert
  rationale: Die konkrete Schwertmetapher für gewaltsame Tötung bleibt erhalten, ohne sie allgemein zu „Krieg“ aufzulösen.
- source_word: ἐν ἀποστολῇ
  choice: in der Verbannung
  rationale: Im Gerichtszusammenhang bezeichnet das Wort das Fortgeschickt- oder Weggeführtsein. „Verbannung“ gibt den Zustand verständlich wieder; die stärker vorgangsbezogene Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von ἀποστολή im Zusammenhang des Gerichts
  choice: in der Verbannung
  alternative: bei der Verschleppung / in der Deportation
  rationale: „Verbannung“ bezeichnet die erzwungene Entfernung aus dem Land, ohne eine bestimmte heilsgeschichtliche Deutung hinzuzufügen. Da das griechische Substantiv wörtlicher das Wegsenden und damit auch Verschleppung oder Deportation bezeichnen kann, bleibt diese Bedeutungsbreite in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Doppelpunkt nach „sieh“ gibt die hinweisende Funktion von ἰδού wieder. „Liegen hingeworfen“ verbindet den gewaltsamen Vorgang mit dem im Kontext sichtbaren Zustand, ohne die im Vers nicht ausdrücklich genannte Bezeichnung „Leichen“ einzufügen.
