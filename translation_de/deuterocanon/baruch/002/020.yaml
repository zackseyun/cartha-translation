base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/020.yaml
  text: because you have brought your wrath and your anger upon us[a], just as you spoke by the hand of your servants the prophets
translation:
  language: de
  text: Denn du hast deinen Grimm und deinen Zorn über uns gebracht, genau wie du durch deine Diener, die Propheten, gesprochen hast.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand deiner Diener, der Propheten«.'
    reason: Die Fußnote macht die griechische Vermittlungsformel ἐν χειρί sichtbar, die im Haupttext idiomatisch mit „durch“ wiedergegeben wird.
lexical_decisions:
- source_word: ἐνῆκας
  choice: du hast … über uns gebracht
  rationale: Der Aorist bezeichnet hier, dass Gott Grimm und Zorn über die Betenden gebracht hat. Die Formulierung ist im Deutschen natürlich und bewahrt die verursachende Aussage, ohne sie durch ein spezielleres Strafverb zu überdeuten.
- source_word: θυμόν
  choice: Grimm
  rationale: θυμός bezeichnet heftigen Zorn. „Grimm“ hat das nötige Gewicht und ermöglicht es, die Verbindung mit dem nah verwandten ὀργή als bewusstes Begriffspaar wiederzugeben.
- source_word: ὀργήν
  choice: Zorn
  rationale: „Zorn“ ist eine klare, gewichtige Wiedergabe von ὀργή. Zusammen mit „Grimm“ bleibt die rhetorische Doppelung des Griechischen erhalten.
- source_word: καθάπερ
  choice: genau wie
  rationale: Die Wendung macht die genaue Entsprechung zwischen dem eingetretenen Gericht und der früheren prophetischen Rede deutlich.
- source_word: ἐλάλησας
  choice: du … gesprochen hast
  rationale: Die einfache Bedeutung „sprechen“ bleibt erhalten; eine Wiedergabe wie „angekündigt“ würde den Inhalt der prophetischen Rede stärker festlegen, als es der griechische Wortlaut tut.
- source_word: ἐν χειρί
  choice: durch
  rationale: Die griechische Wendung bedeutet wörtlich „durch die Hand“ und bezeichnet hier die Vermittlung beziehungsweise Beauftragung. „Durch“ gibt diese Funktion in natürlichem modernem Deutsch wieder; die wörtliche Ausdrucksweise wird in der Fußnote genannt.
- source_word: παίδων
  choice: Diener
  rationale: παῖς kann „Kind“ oder „Diener“ bedeuten. In Verbindung mit den Propheten sind die von Gott beauftragten Diener gemeint.
- source_word: προφητῶν
  choice: die Propheten
  rationale: Die Apposition bestimmt die Diener näher als Gottes Propheten.
theological_decisions:
- issue: Das Begriffspaar θυμός und ὀργή für Gottes Gericht
  choice: „deinen Grimm und deinen Zorn“ als zwei verschiedene, nah verwandte Begriffe
  alternative: Beide Begriffe zusammenfassend nur mit „deinen Zorn“ wiederzugeben
  rationale: Der griechische Text verwendet bewusst zwei Bezeichnungen für den göttlichen Zorn. Die Übersetzung wahrt diese rhetorische Fülle und schwächt die Gerichtsaussage nicht ab.
- issue: Die Vermittlungsformel ἐν χειρὶ τῶν παίδων σου τῶν προφητῶν
  choice: „durch deine Diener, die Propheten“ im Haupttext
  alternative: „durch die Hand deiner Diener, der Propheten“
  rationale: Die Formulierung bezeichnet Gott als den Sprechenden und die Propheten als seine beauftragten Vermittler. Das idiomatische „durch“ hält diese Aussage klar fest, während die Fußnote die konkrete griechische Bildsprache transparent macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Grimm und Zorn“ bewahrt die feierliche Doppelung, ohne altertümliche Satzformen zu verwenden. Die Apposition „die Propheten“ ist für heutige Leser unmittelbar verständlich.
