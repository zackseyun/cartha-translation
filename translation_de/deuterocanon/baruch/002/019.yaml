translation:
  language: de
  text: Denn nicht aufgrund der gerechten Taten[a] unserer Väter und unserer Könige tragen wir dir unsere Bitte um Erbarmen vor[b], Herr, unser Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Gerechte Taten« kann auch mit »gerechte Handlungen« wiedergegeben werden; weniger wahrscheinlich sind hier »Satzungen« oder »Rechtsbestimmungen«.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »legen wir das Erbarmen vor deinem Angesicht nieder«; gemeint ist das Vorbringen einer Bitte um Erbarmen. »Vor deinem Angesicht« bedeutet idiomatisch »vor dir« oder »in deiner Gegenwart«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώματα
  choice: gerechte Taten
  rationale: Im Zusammenhang des Bußgebets bezeichnet die Wendung mit »unserer Väter und unserer Könige« am ehesten deren gerechte Taten als mögliche Grundlage der Bitte. Die rechtssprachlichen Bedeutungen »Satzungen« oder »Rechtsbestimmungen« bleiben zwar möglich, passen hier aber weniger gut.
- source_word: καταβάλλομεν
  choice: tragen ... vor
  rationale: Das Verb bedeutet wörtlich ein Niederlegen oder Hinlegen. Zusammen mit dem Erbarmensbegehren und der Wendung »vor dir« gibt »vortragen« den Gebetsakt natürlich und würdevoll wieder.
- source_word: τὸν ἔλεον
  choice: unsere Bitte um Erbarmen
  rationale: Das wörtliche »das Erbarmen« wäre im Deutschen missverständlich, als würden die Betenden selbst Erbarmen gewähren. Der Gebetskontext zeigt, dass sie um Gottes Erbarmen bitten.
- source_word: κατὰ πρόσωπόν σου
  choice: dir ... vor
  rationale: Die griechische Wendung lautet wörtlich »vor deinem Angesicht« und bedeutet idiomatisch »vor dir/in deiner Gegenwart«. Die Verbindung »dir ... vortragen« ist im Deutschen natürlich und bewahrt den Sinn.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: Herr, unser Gott
  rationale: Die direkte Gebetsanrede wird ohne das im heutigen Deutsch altertümliche »o« würdevoll und klar wiedergegeben.
theological_decisions:
- issue: Ob das Gebet sich ausdrücklich nicht auf Verdienste der Vorfahren und Könige stützt
  choice: Die Betenden erklären, dass ihre Bitte nicht auf den gerechten Taten ihrer Väter und Könige beruht.
  alternative: δικαιώματα könnte formeller auf Satzungen oder Rechtsbestimmungen bezogen werden.
  rationale: Der Bußgebetskontext und der Genitiv »unserer Väter und unserer Könige« sprechen eher für gerechte Handlungen als für Rechtsvorschriften. Die Übersetzung wahrt den konkreten Aussagegehalt, ohne daraus eine weitergehende Lehrformel abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlicher Gebetssprache. Die ungewöhnliche griechische Verbindung wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich erläutert.
