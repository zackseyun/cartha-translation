base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/012.yaml
  text: We have sinned[a], we have acted ungodly, we have done wrong, O Lord our God, against all your ordinances.
translation:
  language: de
  text: Wir haben gesündigt, wir haben gottlos gehandelt, wir haben Unrecht getan, Herr, unser Gott, gegen alle deine Satzungen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinsichtlich all deiner Satzungen“; „Satzungen“ kann auch „gerechte Rechtssprüche“ oder „Rechtsbestimmungen“ bedeuten. Die griechische Wendung bezeichnet möglicherweise allgemeiner die Beziehung des Unrechts zu Gottes verbindlichen Bestimmungen.'
    reason: Die Verbindung von ἐπί mit dem Dativ und der Bedeutungsumfang von δικαιώματα lassen mehrere sachlich nahe Wiedergaben zu.
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: Wir haben gesündigt
  rationale: Der Aorist bezeichnet hier im Rahmen des Schuldbekenntnisses begangenes Sündigen. Das deutsche Perfekt ist in gegenwärtiger Standardsprache natürlich und bewahrt die bekenntnishafte Kraft.
- source_word: ἠσεβήσαμεν
  choice: wir haben gottlos gehandelt
  rationale: Das Verb bezeichnet ehrfurchtsloses bzw. gottloses Verhalten. „Gottlos gehandelt“ gibt den verbalen Charakter wieder und ist verständlicher als „frevelhaft gehandelt“.
- source_word: ἠδικήσαμεν
  choice: wir haben Unrecht getan
  rationale: Das Verb kann unrechtes oder ungerechtes Handeln bezeichnen. Da kein persönliches Objekt genannt ist, vermeidet „Unrecht getan“ eine unnötige Festlegung auf das Schädigen einer bestimmten Person.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ bezeichnet die direkte Anrede Gottes. „Herr“ ist die sachgemäße und würdige Wiedergabe von κύριος; ein zusätzliches „o“ wäre im heutigen Deutsch unnötig altertümlich.
- source_word: ὁ θεὸς ἡμῶν
  choice: unser Gott
  rationale: Idiomatiche deutsche Wiedergabe des griechischen Genitivs der Zugehörigkeit in direkter Anrede.
- source_word: ἐπὶ
  choice: gegen
  rationale: ἐπί mit Dativ kann hier die Beziehung zu Gottes Bestimmungen ausdrücken. Im Zusammenhang des Schuldbekenntnisses gibt „gegen“ den Gedanken der Übertretung natürlich wieder, ohne die mögliche allgemeinere Beziehungsbedeutung zu verschweigen.
- source_word: πᾶσιν
  choice: alle
  rationale: Entspricht dem umfassenden Plural und bezieht jede der genannten göttlichen Bestimmungen ein.
- source_word: τοῖς δικαιώμασίν σου
  choice: deine Satzungen
  rationale: δικαίωμα kann Satzung, rechtliche Bestimmung, Forderung oder gerechten Rechtsspruch bezeichnen. „Satzungen“ bewahrt den verbindlichen rechtlich-bundeshaften Sinn, ohne den Ausdruck auf richterliche Urteile zu verengen.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede Gottes
  choice: Herr
  alternative: HERR; Gebieter
  rationale: Im griechischen Ausgangstext steht κύριος und nicht der hebräische Gottesname. „Herr“ ist daher die textnahe Wiedergabe, ohne eine nicht ausdrücklich vorhandene Unterscheidung einzutragen.
- issue: Bedeutung von δικαιώματα im Schuldbekenntnis
  choice: Satzungen
  alternative: gerechte Rechtssprüche; Rechtsbestimmungen; Forderungen
  rationale: Der Plural bezeichnet bindende göttliche Festsetzungen oder gerechte Bestimmungen. „Satzungen“ erhält diese rechtlich-bundeshafte Weite und vermeidet eine dogmatische Verengung.
- issue: Beziehung, die ἐπί mit Dativ ausdrückt
  choice: gegen alle deine Satzungen
  alternative: im Blick auf alle deine Satzungen; hinsichtlich all deiner Satzungen
  rationale: Der Bußkontext legt eine Übertretungsbeziehung nahe, weshalb „gegen“ im Haupttext sinnvoll ist. Da die Präposition auch eine allgemeinere Beziehung bezeichnen kann, wird diese echte syntaktische Mehrdeutigkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von „wir haben“ bewahrt den eindringlichen Rhythmus des griechischen Schuldbekenntnisses. „Herr, unser Gott“ erhält die direkte Gebetsanrede, ohne altertümliches „o“.
