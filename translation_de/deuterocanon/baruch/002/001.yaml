base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/001.yaml
  text: And the Lord has confirmed his word that he spoke against us and against our judges who judged Israel[a], and against our kings and against our rulers[b], and against the people of Israel and Judah.
translation:
  language: de
  text: 'Und der Herr hat sein Wort wahr gemacht, das er gegen uns ausgesprochen hatte: gegen unsere Richter, die Israel richteten, gegen unsere Könige und unsere Herrscher und gegen die Menschen von Israel und Juda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische verwendet hier eine gedrängte Singularform: „gegen einen Menschen von Israel und Juda“. Gemeint sind kollektiv die Menschen von Israel und Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: hat … wahr gemacht
  rationale: Das Verb ἵστημι bezeichnet hier, dass der Herr sein zuvor gesprochenes Gerichtswort bestehen und wirksam werden ließ. „Wahr gemacht“ ist natürliches Deutsch und bewahrt sowohl Bestätigung als auch Vollzug.
- source_word: Κύριος
  choice: der Herr
  rationale: Die übliche und würdige Wiedergabe von κύριος als Gottesbezeichnung.
- source_word: τὸν λόγον αὐτοῦ
  choice: sein Wort
  rationale: „Wort“ bewahrt die Breite von λόγος und den biblischen Sprachgebrauch, ohne vorschnell auf Erlass, Urteil oder Drohung einzuengen.
- source_word: ἐλάλησεν ἐφ᾽ ἡμᾶς
  choice: das er gegen uns ausgesprochen hatte
  rationale: Der Zusammenhang des vollzogenen Gerichts stützt die adversative Bedeutung „gegen uns“. Das Plusquamperfekt verdeutlicht im Deutschen, dass das Aussprechen dem Wahrmachen vorausging.
- source_word: δικαστάς … τοὺς δικάσαντας τὸν Ἰσραήλ
  choice: unsere Richter, die Israel richteten
  rationale: Die etymologische Wiederholung des griechischen Nomens und Partizips bleibt erhalten; „richten“ kann hier sowohl richterliche als auch leitende Tätigkeit bezeichnen.
- source_word: ἄρχοντας
  choice: Herrscher
  rationale: „Herrscher“ gibt die politische Autorität von ἄρχοντες wieder und unterscheidet sie von den Richtern.
- source_word: ἄνθρωπον Ἰσραὴλ καὶ Ἰούδα
  choice: die Menschen von Israel und Juda
  rationale: Der griechische Singular ἄνθρωπον ist in der gedrängten Formulierung kollektiv gebraucht. „Die Menschen“ gibt diesen kollektiven Bezug natürlich und inklusiv wieder, ohne die Wendung ausschließlich auf Männer zu beschränken.
theological_decisions:
- issue: Wirkung des göttlichen Wortes im Gerichtszusammenhang
  choice: Der Herr hat sein Wort „wahr gemacht“.
  alternative: Der Herr hat sein Wort bestätigt / erfüllt / vollstreckt.
  rationale: 'Der Kontext verlangt mehr als eine bloße verbale Bestätigung: Das angekündigte Gericht ist eingetreten. „Wahr gemacht“ lässt zugleich offen, ob der Akzent auf Bestätigung, Erfüllung oder Vollzug liegt.'
- issue: Kollektive Bedeutung von ἄνθρωπον
  choice: die Menschen von Israel und Juda
  alternative: den Menschen Israels und Judas / die Männer von Israel und Juda
  rationale: Der Singular steht kollektiv und schließt nach dem Kontext die Bevölkerung ein. Eine ausschließlich männliche Wiedergabe würde die Referenz im Deutschen unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert die lange Aufzählung und macht deutlich, auf welche Gruppen sich das gegen sie ausgesprochene Wort bezieht. Die Wiederholung von „gegen“ wird teilweise bewahrt, ohne den Satz unnötig schwerfällig zu machen.
