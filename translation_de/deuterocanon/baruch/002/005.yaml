lexical_decisions:
- source_word: ἐγενήθησαν
  choice: sie kamen
  rationale: Der Aorist von γίνομαι bezeichnet hier das Eintreten in einen Zustand. „Sie kamen“ bewahrt den Vorgangscharakter und lässt den Wechsel zur ersten Person Plural im folgenden Teilsatz unverändert stehen.
- source_word: ὑποκάτω καὶ οὐκ ἐπάνω
  choice: nach unten und nicht nach oben
  rationale: Die räumliche Gegenüberstellung wird im Deutschen verständlich wiedergegeben und bewahrt zugleich das Bild eines erniedrigten gesellschaftlichen oder politischen Status.
- source_word: ἡμάρτομεν
  choice: wir … sündigten
  rationale: „Sündigen“ ist die direkte, geläufige Wiedergabe von ἁμαρτάνω und behält das theologische Gewicht des Ausdrucks.
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: gegen den Herrn, unseren Gott
  rationale: Der Dativ bei ἁμαρτάνω wird im Deutschen idiomatisch mit „gegen“ ausgedrückt; die Apposition erhält sowohl κύριος als auch θεός ausdrücklich.
- source_word: πρὸς τὸ μὴ ἀκούειν
  choice: indem wir nicht … hörten
  rationale: Die Konstruktion beschreibt näher, worin die Sünde bestand. „Indem“ bewahrt diesen modalen beziehungsweise erläuternden Zusammenhang, ohne ihn stärker kausal oder final festzulegen.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: auf seine Stimme
  rationale: „Auf seine Stimme hören“ ist im Deutschen ein natürlicher biblischer Ausdruck, der den konkreten Begriff „Stimme“ bewahrt und zugleich das darin enthaltene Befolgen anklingen lässt.
theological_decisions:
- issue: Wechsel von der dritten Person Plural zu „wir“
  choice: sie kamen … weil wir … sündigten
  alternative: wir kamen … weil wir … sündigten
  rationale: Der griechische Text hat ausdrücklich ἐγενήθησαν („sie“) und danach ἡμάρτομεν („wir“). Die Übersetzung glättet diesen auffälligen Wechsel nicht und legt den Bezug von „sie“ nicht eigenmächtig fest.
- issue: Bildsprache des Bundesfluchs
  choice: nach unten und nicht nach oben
  alternative: erniedrigt statt erhöht
  rationale: Die konkrete räumliche Gegenüberstellung bleibt erhalten, sodass ihr Anklang an die Sprache von Segen und Fluch wahrnehmbar bleibt, ohne durch eine abstrakte Deutung ersetzt zu werden.
- issue: Hören oder Gehorchen
  choice: nicht auf seine Stimme hörten
  alternative: ihm nicht gehorchten
  rationale: Die Formulierung bewahrt φωνή („Stimme“) und die biblische Hör-Metapher. Dass dieses Hören Gehorsam einschließt, wird erläutert, aber nicht anstelle des Ausgangsbildes in den Haupttext gesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der ungewöhnliche Personenwechsel des griechischen Textes sowie die räumliche Bildsprache bleiben bewusst erhalten; die Satzfügung ist dennoch flüssig und allgemein verständlich.
