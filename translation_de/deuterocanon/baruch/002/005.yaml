translation:
  language: de
  text: Und sie wurden unten und nicht oben[a], weil wir gegen den Herrn, unseren Gott, sündigten, indem wir nicht auf seine Stimme hörten.[b]
  philosophy: optimal-equivalence
  footnotes:
