  text: And the Lord kept watch over the calamities and brought them upon us[b][a], because the Lord is righteous in all his works that he commanded us.
translation:
  language: de
  text: Und der Herr wachte über das Unheil[a] und brachte es über uns; denn der Herr ist gerecht in allen seinen Werken, die er uns geboten hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das Böse“, „die Unglücke“ oder „die Katastrophen“. Gemeint ist hier wahrscheinlich das als Gericht hereinbrechende Unheil, nicht moralische Bosheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut ist knapp und ungewöhnlich: „in allen seinen Werken, die er uns geboten hat“. Sinngemäß kann an das von Gott gebotene Tun gedacht sein.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐγρηγόρησεν
  choice: wachte
  rationale: Das Verb bezeichnet wörtlich Wachsein bzw. Wachsamkeit. „Wachte über“ erhält das Bild aktiver Aufmerksamkeit, ohne es unnötig auszudeuten.
- source_word: ἐπὶ τοῖς κακοῖς
  choice: über das Unheil
  rationale: Im Zusammenhang sind nicht moralisch böse Handlungen gemeint, sondern das als Gericht eintretende Unheil. Der deutsche Sammelbegriff klingt natürlich und bewahrt die Härte der Aussage.
- source_word: ἐπήγαγε … ἐφ᾽ ἡμᾶς
  choice: brachte es über uns
  rationale: Die Wendung gibt die gerichtete Bewegung des griechischen Verbs samt Präpositionalergänzung knapp und idiomatisch wieder.
- source_word: δίκαιος
  choice: gerecht
  rationale: „Gerecht“ ist die natürliche deutsche Entsprechung und bezeichnet hier Gottes Rechtsein gerade in seinem Gerichtshandeln.
- source_word: ἐπὶ πάντα τὰ ἔργα αὐτοῦ
  choice: in allen seinen Werken
  rationale: Die Präposition bezeichnet hier den Bereich bzw. die Hinsicht, in der der Herr gerecht ist. „Werke“ wahrt den umfassenden und schriftsprachlich würdigen Ausdruck.
- source_word: ἃ ἐνετείλατο ἡμῖν
  choice: die er uns geboten hat
  rationale: Der Relativsatz bezieht sich grammatisch auf „Werke“. Die knappe, ungewöhnliche Verknüpfung des Griechischen bleibt erhalten, wird aber in natürlichem Deutsch formuliert.
theological_decisions:
- issue: Bezeichnet τὰ κακά moralisch Böses oder gerichtliches Unheil?
  choice: Unheil
  alternative: Böses; Unglücke; Katastrophen
  rationale: Der anschließende Satz sagt ausdrücklich, dass der Herr es über das Volk brachte. Daher sind leidvolle Gerichtsfolgen gemeint, nicht moralische Bosheit. Zugleich wird die aktive Zuschreibung des Gerichts an den Herrn nicht abgeschwächt.
- issue: Wie ist Gottes δίκαιος-Sein wiederzugeben?
  choice: gerecht
  alternative: im Recht
  rationale: „Gerecht“ bewahrt die theologische und ethische Aussage des Textes, ohne sie auf bloße Rechtsförmigkeit oder Strafgerechtigkeit einzuengen.
- issue: Wie ist der ungewöhnliche Bezug von ἃ ἐνετείλατο ἡμῖν zu verstehen?
  choice: Relativsatz unmittelbar auf „Werke“ beziehen
  alternative: sinngemäß auf Gottes Gebote oder auf das von Israel geforderte Tun beziehen
  rationale: Die griechische Grammatik verbindet den Relativsatz mit „Werke“, auch wenn die Aussage inhaltlich gedrängt ist. Die Übersetzung bewahrt diese Spannung; die Fußnote nennt die mögliche sinngemäße Auffassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Parallelismus. „Unheil“ ist ein verständlicher Sammelbegriff; „Werke“ erhält den biblischen Ton. Die semantische Spannung des letzten Relativsatzes wird nicht stillschweigend aufgelöst.
