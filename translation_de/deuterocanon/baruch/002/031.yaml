lexical_decisions:
- source_word: γνώσονται
  choice: sie werden erkennen
  rationale: Das Futur von γινώσκω bezeichnet hier nicht bloß verstandesmäßiges Wissen, sondern das Erkennen Gottes in seiner Beziehung zu ihnen; „erkennen“ bewahrt diesen Sinn, ohne ihn weiter auszudeuten.
- source_word: Κύριος
  choice: der Herr
  rationale: „Der Herr“ ist die übliche deutsche Wiedergabe des göttlichen Titels κύριος.
- source_word: ὁ θεὸς αὐτῶν
  choice: ihr Gott
  rationale: Die natürliche deutsche Possessivkonstruktion gibt den griechischen Ausdruck genau wieder und bewahrt die Beziehungsaussage.
- source_word: δώσω
  choice: ich werde geben
  rationale: Schlichte und gegenwärtige Wiedergabe des griechischen Futurs.
- source_word: καρδίαν
  choice: ein Herz
  rationale: Die konkrete Metapher des griechischen Singulars bleibt erhalten und wird nicht zu „Verstand“ oder „Gesinnung“ abstrahiert.
- source_word: ὦτα ἀκούοντα
  choice: Ohren, die hören
  rationale: Die attributive Partizipialkonstruktion wird nahezu wörtlich und zugleich verständlich wiedergegeben; sie bezeichnet zum Hören befähigte beziehungsweise empfängliche Ohren.
theological_decisions:
- issue: 'Bildsprache der inneren Erneuerung: „ein Herz und Ohren, die hören“'
  choice: Die konkreten körperlichen Bilder bleiben unverändert erhalten.
  alternative: „Verständnis und Aufnahmebereitschaft“ oder „ein verständiges Herz und hörbereite Ohren“
  rationale: καρδίαν und ὦτα ἀκούοντα benennen konkrete Bilder. Ihre Beibehaltung wahrt die Spannung zwischen innerer Erneuerung und empfänglichem Hören, ohne diese als Gehorsam oder Erkenntnis auszulegen.
- issue: Bedeutungsumfang von γνώσονται
  choice: „erkennen“
  alternative: „wissen“ oder „anerkennen“
  rationale: „Erkennen“ kann sowohl tatsächliche Erkenntnis als auch Beziehungserkenntnis ausdrücken und legt nicht fest, ob vor allem intellektuelles Wissen oder anerkennende Hinwendung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Die ungewöhnlich konkrete Formulierung „Ohren, die hören“ wird bewusst beibehalten. Der abschließende Beistrich entspricht dem fortlaufenden Satz des Quelltextes.
