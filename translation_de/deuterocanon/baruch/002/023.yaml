base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/023.yaml
  text: I will cause the sound of gladness and the sound of rejoicing to cease from the cities of Judah and from the outskirts of Jerusalem[a], the sound of bridegroom and the sound of bride[b], and all the land will become impassable because of its inhabitants.
translation:
  language: de
  text: Ich werde in den Städten Judas und außerhalb Jerusalems[a] den Klang der Freude und den Klang des Jubels verstummen lassen, die Stimme des Bräutigams und die Stimme der Braut. Das ganze Land wird wegen seiner Bewohner unpassierbar werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „außerhalb Jerusalems“. Manche Übersetzungen geben unter dem Einfluss ähnlicher prophetischer Formeln „auf den Straßen Jerusalems“ wieder; im vorliegenden griechischen Text steht jedoch „außerhalb“.'
    reason: alternative_reading
  - marker: b
    text: 'Die griechische Schlussformulierung ist schwer verständlich. Sie kann auch bedeuten: „Das ganze Land wird unpassierbar und ohne Bewohner sein“ oder „von Bewohnern entleert sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλείψειν ποιήσω
  choice: werde … verstummen lassen
  rationale: Die Verbindung aus ποιέω und Infinitiv bezeichnet ein aktives Verursachen. „Verstummen lassen“ gibt die göttliche Urheberschaft natürlich und prägnant wieder.
- source_word: ἐκ πόλεων Ἰούδα καὶ ἔξωθεν Ἰερουσαλήμ
  choice: in den Städten Judas und außerhalb Jerusalems
  rationale: Bei einem Verb des Verstummens ist im Deutschen „in“ idiomatischer als ein wörtliches „aus“. ἔξωθεν wird als „außerhalb“ wiedergegeben und nicht nach prophetischen Parallelstellen zu „auf den Straßen“ harmonisiert.
- source_word: φωνὴν εὐφροσύνης καὶ φωνὴν χαρμοσύνης
  choice: den Klang der Freude und den Klang des Jubels
  rationale: φωνή bezeichnet hier den hörbaren Klang festlicher Freude. Die beiden nahen Begriffe εὐφροσύνη und χαρμοσύνη bleiben als poetische Doppelung erhalten.
- source_word: φωνὴν νυμφίου καὶ φωνὴν νύμφης
  choice: die Stimme des Bräutigams und die Stimme der Braut
  rationale: Bei Personen ist „Stimme“ die natürliche Wiedergabe von φωνή. Die Wiederholung bewahrt den feierlichen Parallelismus.
- source_word: ἔσται πᾶσα ἡ γῆ εἰς ἄβατον
  choice: Das ganze Land wird … unpassierbar werden
  rationale: ἄβατος bezeichnet wörtlich einen Ort, der nicht betreten oder durchquert werden kann. „Unpassierbar“ wahrt diesen konkreten Sinn besser als das allgemeinere „verwüstet“.
- source_word: ἀπὸ ἐνοικούντων
  choice: wegen seiner Bewohner
  rationale: Die schwer verständliche Präpositionalfügung wird eng am überlieferten Wortlaut wiedergegeben, ohne sie stillschweigend zur geläufigeren Aussage „ohne Bewohner“ zu harmonisieren. Die alternative Deutung wird in einer Fußnote genannt.
theological_decisions:
- issue: Mögliche Harmonisierung mit vertrauten prophetischen Gerichtsformeln
  choice: Den Wortlaut des griechischen Zeugen mit „außerhalb Jerusalems“ und der schwierigen Schlussformulierung bewahren.
  alternative: Nach Parallelstellen „auf den Straßen Jerusalems“ und „ohne Bewohner“ übersetzen.
  rationale: Die vorhandene griechische Lesart ist Grundlage der Übersetzung. Parallele Formeln dürfen die eigenständige und teilweise schwierige Formulierung dieses Verses nicht ersetzen; sinnvolle Alternativen werden transparent in Fußnoten dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Parallelismus wird durch die wiederholten Wendungen „den Klang“ und „die Stimme“ hörbar gemacht; ungewöhnliche Einzelheiten des griechischen Textes bleiben erhalten und werden nicht an vertrautere Parallelstellen angeglichen.
