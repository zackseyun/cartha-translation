  text: so that all the earth may know that you[a], Lord, are our God, because your name has been called upon Israel and upon his offspring.
translation:
  language: de
  text: damit die ganze Erde erkennt, dass du, Herr, unser Gott bist; denn dein Name ist über Israel und über seinen Nachkommen genannt worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Name ist über Israel angerufen worden.“ Sinngemäßer: „Israel trägt deinen Namen“ oder „Israel ist nach deinem Namen genannt.“ Die griechische Wendung drückt Zugehörigkeit zu Gott und Benennung durch seinen Namen aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνῷ
  choice: damit … erkennt
  rationale: ἵνα mit dem Aorist Konjunktiv bezeichnet hier Zweck beziehungsweise Folge; „damit … erkennt“ gibt dies im Deutschen natürlich wieder.
- source_word: πᾶσα ἡ γῆ
  choice: die ganze Erde
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. Der umfassende Zusammenhang der Anerkennung Gottes spricht hier für „die ganze Erde“.
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: Herr, unser Gott
  rationale: Die prädikative Aussage wird idiomatisch und zugleich eng am Griechischen wiedergegeben; κύριος erscheint als „Herr“.
- source_word: τὸ ὄνομά σου ἐπεκλήθη ἐπὶ
  choice: dein Name ist über … ausgerufen worden
  rationale: Die Formulierung bewahrt das Bild eines über Israel ausgerufenen göttlichen Namens und lässt die Bedeutungsnuancen von Anrufung, Benennung und Zugehörigkeit offen.
- source_word: τὸ γένος αὐτοῦ
  choice: seinen Nachkommen
  rationale: γένος bezeichnet hier Abstammung beziehungsweise Nachkommenschaft. Der Singular „seinen“ wahrt den grammatischen Rückbezug auf Israel, das zugleich als Stammvatername verstanden werden kann.
theological_decisions:
- issue: Der göttliche Name wird über Israel ausgerufen
  choice: „dein Name ist über Israel … ausgerufen worden“
  alternative: „Israel ist nach deinem Namen genannt“ / „dein Name ist über Israel angerufen worden“
  rationale: Die gewählte Fassung hält die biblische Redeweise sichtbar und bewahrt sowohl öffentliche Benennung und Zugehörigkeit als auch den möglichen Anklang an Anrufung, ohne sich ausschließlich auf eine Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Ausgangstext, wird aber durch das Semikolon lesbar gegliedert. „Nachkommen“ ist heute natürlicher als „Geschlecht“ und wahrt den Bezug auf die Abstammung Israels.
