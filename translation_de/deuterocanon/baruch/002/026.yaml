base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/026.yaml
  text: And you made the house over which your name was called as it is this day[a], because of the wickedness of the house of Israel and the house of Judah.
translation:
  language: de
  text: Und du hast das Haus, das deinen Namen trägt, zu dem gemacht, was es heute ist,[a] wegen der Bosheit des Hauses Israel und des Hauses Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Haus, über dem dein Name genannt wurde«. Das Griechische verwendet eine semitische Wendung für ein Haus, das Gottes Namen trägt bzw. nach ihm genannt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκας
  choice: du hast ... zu dem gemacht
  rationale: Der Aorist von τίθημι bezeichnet hier mit der anschließenden Zustandsangabe das Herbeiführen des gegenwärtigen Zustands des Hauses.
- source_word: τὸν οἶκον
  choice: das Haus
  rationale: Die wörtliche Wiedergabe bewahrt die biblische Bezeichnung für den Tempel, ohne den Bezug im Haupttext auszudeuten.
- source_word: οὗ ἐπεκλήθη τὸ ὄνομά σου ἐπ᾽ αὐτῷ
  choice: über dem dein Name ausgerufen wurde
  rationale: Die semitisch geprägte Formel für Zugehörigkeit und Weihe bleibt sichtbar; das redundante zweite Präpositionalelement wird im Deutschen nicht eigens wiederholt.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: was es heute ist
  rationale: Die idiomatische deutsche Formulierung gibt den gegenwärtigen, offen zutage liegenden Zustand wieder.
- source_word: διὰ πονηρίαν
  choice: wegen der Bosheit
  rationale: διά ist kausal gebraucht; πονηρία bezeichnet in diesem Bußzusammenhang moralische Bosheit.
- source_word: οἴκου Ἰσραὴλ καὶ οἴκου Ἰούδα
  choice: des Hauses Israel und des Hauses Juda
  rationale: Die Wiederholung von »Haus« bewahrt die korporative und bundestheologische Ausdrucksweise der Vorlage.
theological_decisions:
- issue: Bezug von »Haus« und Bedeutung der Namensformel
  choice: Das Haus bleibt als biblische Bezeichnung des Tempels stehen; die Formel vom darüber ausgerufenen Namen wird formal bewahrt.
  alternative: »der Tempel, der deinen Namen trägt«
  rationale: Die gewählte Fassung lässt die Vorstellung göttlicher Zugehörigkeit und Gegenwart in ihrer quellensprachlichen Spannung bestehen, statt sie durch eine glättende Paraphrase festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellennah, wird aber durch »zu dem gemacht, was es heute ist« natürlich und verständlich gestaltet.
