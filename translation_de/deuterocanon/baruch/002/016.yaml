base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/016.yaml
  text: Lord[a], look down from your holy house and take notice of us; incline your ear, Lord, and hear.
translation:
  language: de
  text: Herr, schau aus deinem heiligen Haus[a] herab und achte auf uns; neige, Herr, dein Ohr und höre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus deinem heiligen Tempel“. Wörtlich steht im Griechischen „aus deinem heiligen Haus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ wird als direkte Anrede mit „Herr“ wiedergegeben; das entspricht dem üblichen würdevollen Gebetsregister im Deutschen.
- source_word: κάτιδε
  choice: schau … herab
  rationale: Die Verbform bezeichnet ein Herabschauen bzw. ein Schauen von oben; die getrennte Stellung um die Herkunftsangabe herum klingt im Deutschen natürlich und bewahrt die räumliche Bildsprache.
- source_word: ἐκ τοῦ οἴκου τοῦ ἁγίου σου
  choice: aus deinem heiligen Haus
  rationale: οἶκος bedeutet zunächst „Haus“. Diese Wiedergabe bleibt eng am griechischen Wortlaut und legt nicht ausdrücklich fest, ob ein Tempel oder Gottes himmlische Wohnstätte gemeint ist.
- source_word: ἐννόησον
  choice: achte auf uns
  rationale: Das Verb fordert aufmerksame, zugewandte Beachtung und nicht lediglich gedankliches Erkennen. „Achte auf uns“ ist gegenwärtiges, verständliches Deutsch und wahrt zugleich die Bitte um Gottes tätige Zuwendung.
- source_word: εἰς ἡμᾶς
  choice: auf uns
  rationale: Die Präposition bezeichnet hier die Richtung der Aufmerksamkeit; zusammen mit „achte“ ergibt sich eine natürliche deutsche Fügung.
- source_word: κλῖνον
  choice: neige
  rationale: „Neige“ erhält das konkrete Bild des sich zum Hörenden Hinabwendens und passt zum würdevollen Gebetsstil, ohne unverständlich zu sein.
- source_word: τὸ οὖς σου
  choice: dein Ohr
  rationale: Der Singular und die körperliche Metapher des griechischen Textes werden unmittelbar bewahrt.
- source_word: ἄκουσον
  choice: höre
  rationale: Der Imperativ wird knapp und gewichtig wiedergegeben und lässt sowohl das Wahrnehmen als auch das erhörende Hören anklingen.
theological_decisions:
- issue: Ob οἶκος als „Haus“ oder deutend als „Tempel“ wiederzugeben ist
  choice: Haus
  alternative: Tempel
  rationale: Der griechische Text verwendet οἶκος und nicht den spezifischeren Ausdruck ναός. „Haus“ bewahrt daher die Offenheit zwischen Heiligtum und Gottes heiliger Wohnstätte; die mögliche Deutung „Tempel“ wird in einer Fußnote genannt.
- issue: Ob die bildhafte Gebetsformel κλῖνον τὸ οὖς σου geglättet werden soll
  choice: neige … dein Ohr
  alternative: höre uns aufmerksam an
  rationale: Die konkrete Metapher gehört zum Nachdruck und zur Würde des Gebets. Sie ist im Deutschen weiterhin verständlich und sollte nicht durch eine rein sachliche Umschreibung ersetzt werden.
- issue: Ob ἄκουσον lediglich akustisches Hören oder auch Erhören bezeichnet
  choice: höre
  alternative: erhöre uns
  rationale: Das griechische ἀκούω kann im Gebetszusammenhang ein erhörendes Hören nahelegen, sagt jedoch nicht ausdrücklich „erhören“. „Höre“ bewahrt diese theologisch bedeutsame Spannung.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die zweimalige Anrede „Herr“ sowie die parallelen Imperative des griechischen Textes bleiben erhalten. „Neige dein Ohr“ ist bewusst bildhaft und leicht erhöht, aber im heutigen Standarddeutsch verständlich.
