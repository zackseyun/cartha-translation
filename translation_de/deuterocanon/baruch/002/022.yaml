  text: And if you do not listen to the voice of the Lord[a], to serve the king of Babylon[b],
translation:
  language: de
  text: Und wenn ihr nicht auf die Stimme des Herrn hört[a], um dem König von Babylon zu dienen[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf die Stimme des Herrn achtet“ beziehungsweise „der Stimme des Herrn gehorcht“; die griechische Wendung meint nicht nur das Hören, sondern kann auch das Befolgen einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für den König von Babylon zu arbeiten“; gemeint ist hier, ihm zu dienen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ ἀκούσητε
  choice: wenn ihr nicht … hört
  rationale: ἀκούω mit dem Genitiv kann sowohl das Hören als auch das darauf folgende Befolgen bezeichnen. Die Wiedergabe mit „hört“ bewahrt das Sprachbild des griechischen Textes und lässt den Gehorsamsaspekt mitschwingen.
- source_word: τῆς φωνῆς
  choice: auf die Stimme
  rationale: φωνή bedeutet wörtlich „Stimme“. Die deutsche Wendung „auf die Stimme … hören“ ist natürlich und bewahrt die biblische Ausdrucksweise.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Κύριος wird entsprechend dem üblichen biblischen Sprachgebrauch mit „Herr“ wiedergegeben; der Genitiv fügt sich natürlich in „die Stimme des Herrn“ ein.
- source_word: ἐργάσασθαι
  choice: zu dienen
  rationale: ἐργάζομαι bedeutet grundsätzlich „arbeiten, tätig sein“. Mit einer Person im Dativ bezeichnet es hier das Arbeiten für beziehungsweise den Dienst unter dem babylonischen König; „dienen“ gibt die politische Unterordnung im Kontext idiomatisch wieder.
- source_word: τῷ βασιλεῖ Βαβυλῶνος
  choice: dem König von Babylon
  rationale: Die Genitivverbindung wird klar und unmittelbar als „König von Babylon“ wiedergegeben.
theological_decisions:
- issue: Ob der in ἀκούσητε mitschwingende Gehorsam ausdrücklich gemacht werden soll
  choice: Im Haupttext steht „auf die Stimme des Herrn hört“.
  alternative: „der Stimme des Herrn gehorcht“ oder „auf die Stimme des Herrn achtet“
  rationale: Die griechische Formulierung ist ausdrücklich auf das Hören bezogen, schließt im biblischen Kontext aber Gehorsam ein. Das Sprachbild bleibt im Haupttext erhalten, ohne die Bedeutung auf bloß akustisches Wahrnehmen zu verengen oder sie ausdrücklich als Gehorsam auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt als unvollständiger Bedingungssatz mit abschließendem Komma erhalten, da der griechische Vers syntaktisch in den folgenden Vers weiterführt.
