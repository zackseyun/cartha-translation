lexical_decisions:
- source_word: ἐποίησας εἰς ἡμᾶς
  choice: du hast an uns gehandelt
  rationale: Die griechische Verbindung ποιεῖν εἰς mit Personen bezeichnet hier ein Handeln an oder gegenüber jemandem. „An uns gehandelt“ bleibt nah an der Formulierung und ist im gehobenen Gebetsstil verständlich.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: Herr, unser Gott
  rationale: Die direkte Anrede wird idiomatisch wiedergegeben; κύριος bezeichnet hier Gott und wird entsprechend mit „Herr“ übersetzt.
- source_word: ἐπιεικίαν
  choice: Nachsicht
  rationale: ἐπιείκεια bezeichnet hier Gottes milde, nicht streng vergeltende Haltung. „Nachsicht“ trifft im Deutschen den Gedanken von Milde und Schonung, ohne ihn zu einer technischen theologischen Aussage zu verengen.
- source_word: οἰκτειρμόν
  choice: Erbarmen
  rationale: οἰκτειρμός bezeichnet mitfühlendes Erbarmen. Das Wort wird von „Nachsicht“ unterschieden, damit die beiden griechischen Begriffe nicht eingeebnet werden.
- source_word: τὸν μέγαν
  choice: großen
  rationale: Das Adjektiv μέγας beschreibt das Erbarmen unmittelbar als groß.
- source_word: κατὰ πᾶσαν ... καὶ κατὰ πάντα
  choice: nach all ... und nach dem ganzen ...
  rationale: Die Wiederholung von κατὰ und die umfassende Aussage von πᾶς werden bewahrt. Die leicht feierliche Form passt zum Gebetsstil.
theological_decisions:
- issue: Zwei eng verwandte Begriffe für Gottes barmherzige Haltung
  choice: ἐπιείκεια mit „Nachsicht“ und οἰκτειρμός mit „Erbarmen“ wiedergeben
  alternative: Beide Begriffe allgemein mit „Barmherzigkeit“ wiedergeben
  rationale: Der griechische Text verwendet zwei verschiedene Wörter. Ihre Unterscheidung bewahrt die rhetorische Fülle, ohne daraus eine starre dogmatische Trennung abzuleiten.
- issue: Gottesanrede κύριος
  choice: Herr
  alternative: HERR
  rationale: Die griechische Vorlage bietet κύριος und nicht ausdrücklich den hebräischen Gottesnamen; daher ist „Herr“ die sachgemäße Wiedergabe.
translation_notes:
  register: Moderner, würdevoller Gebetsstil. Die wiederholte Konstruktion „nach … und nach …“ folgt bewusst dem griechischen Parallelismus. Das abschließende Komma bleibt stehen, weil der Satz im folgenden Vers weitergeführt wird.
