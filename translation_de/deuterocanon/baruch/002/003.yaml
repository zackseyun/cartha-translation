lexical_decisions:
- source_word: τοῦ φαγείν ἡμᾶς
  choice: dass wir aßen
  rationale: Der substantivierte Infinitiv mit τοῦ und dem Akkusativsubjekt ἡμᾶς wird als abhängiger dass-Satz wiedergegeben. So bleibt das ausdrücklich vorhandene »wir« erhalten; die deutsche Vergangenheitsform passt zum erzählenden Zusammenhang, ohne eine zusätzliche Modalität wie »mussten« einzuführen.
- source_word: ἄνθρωπον
  choice: ein Mann
  rationale: Das zweimalige singularische ἄνθρωπον wird distributiv und konkret mit »ein Mann« wiedergegeben. Die ungewöhnliche Wiederholung bleibt erhalten.
- source_word: σάρκας
  choice: das Fleisch
  rationale: Gemeint ist wörtlich menschliches Körperfleisch. »Fleisch« bewahrt die erschütternde Aussage deutlicher als eine abschwächende Alternative.
- source_word: υἱοῦ αὐτοῦ
  choice: seines Sohnes
  rationale: Der Genitiv bezeichnet den Sohn des jeweils genannten Mannes. »Seines Sohnes« gibt die Besitzbeziehung vollständig wieder, ohne das im Griechischen nicht eigens ausgedrückte »eigenen« hinzuzufügen.
- source_word: θυγατρὸς αὐτοῦ
  choice: seiner Tochter
  rationale: Wie beim Sohn wird die Zugehörigkeit durch das Possessivpronomen genau wiedergegeben; ein zusätzliches »eigenen« wäre unnötige Explizierung.
theological_decisions:
- issue: Unvollständige Ausgangsformulierung und syntaktische Beziehung zum weiteren Satzkontext
  choice: Die vorgelegte griechische abhängige Konstruktion bleibt als Satzfragment stehen; das ausdrücklich belegte ἡμᾶς wird mit »wir« übersetzt.
  alternative: Aus dem weiteren Kontext einen vollständigen Hauptsatz rekonstruieren oder ἡμᾶς wie in der englischen Konsultationsfassung auslassen.
  rationale: Die Originalsprache hat Vorrang. Da der bereitgestellte Text mit τοῦ φαγείν als abhängige Konstruktion beginnt und die Validierung eine größere Abweichung meldet, wird kein fehlender übergeordneter Satz ergänzt. Zugleich darf das klar bezeugte Pronomen ἡμᾶς nicht stillschweigend entfallen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die sperrige appositionelle Entfaltung des griechischen »wir« lesbar, ohne die auffällige Wiederholung von »ein Mann« zu glätten. Der Fußnotenmarker [a] steht im Haupttext.
