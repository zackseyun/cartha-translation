  to: Und wir hörten nicht auf deine Stimme und dienten dem König von Babylon nicht.[a] Und du hast deine Worte erfüllt, die du durch deine Diener, die Propheten, gesprochen hast, dass die Gebeine unserer Könige und die Gebeine unserer Vorfahren von ihrem Ort fortgebracht würden.[b][c]
  rationale: Die Revision entfernt die nicht vom Ausgangstext gedeckte Kausalverknüpfung, ersetzt die weniger präzise Wendung „wahr gemacht“ durch „erfüllt“ und ordnet den Inhalt der prophetischen Rede mit einem dass-Satz dem griechischen Infinitiv entsprechend unter. Die Fußnotenanker bleiben vollständig und eindeutig; Anmerkung a erläutert nun die griechische Konstruktion ohne eine kausale Aussage hinzuzufügen.
