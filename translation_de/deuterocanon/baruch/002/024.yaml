base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/024.yaml
  text: And we did not listen to your voice to serve the king of Babylon[a], and you have fulfilled your words that you spoke by the hands of your servants the prophets[c][b], that the bones of our kings and the bones of our fathers would be brought out from their place.
translation:
  language: de
  text: Und wir hörten nicht auf deine Stimme und dienten dem König von Babylon nicht.[a] Und du hast deine Worte erfüllt, die du durch deine Diener, die Propheten, gesprochen hast, dass die Gebeine unserer Könige und die Gebeine unserer Vorfahren von ihrem Ort fortgebracht würden.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir gehorchten deiner Stimme nicht.“ Das Griechische spricht wörtlich vom Hören auf Gottes Stimme; im Zusammenhang ist Gehorsam gemeint. Der folgende Ausdruck „dem König von Babylon zu dienen“ bezeichnet den Inhalt dessen, wozu Gottes Stimme aufforderte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch die Hände deiner Diener, der Propheten“; dies ist eine Wendung für die Vermittlung durch die Propheten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „aus ihrem Ort“. Gemeint ist im Zusammenhang offenbar die jeweilige Begräbnisstätte.'
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἠκούσαμεν τῆς φωνῆς σου
  choice: wir hörten nicht auf deine Stimme
  rationale: Die deutsche Wendung „auf jemandes Stimme hören“ bewahrt das Bild des Hörens und schließt zugleich ein, dass der Stimme nicht gehorcht wurde.
- source_word: ἐργάσασθαι τῷ βασιλεῖ Βαβυλῶνος
  choice: dienten dem König von Babylon
  rationale: Im historischen Zusammenhang bezeichnet ἐργάζομαι mit dem Dativ den geforderten Dienst beziehungsweise die Unterordnung unter den babylonischen König; „dienen“ gibt dies natürlicher wieder als „arbeiten“.
- source_word: ἔστησας τοὺς λόγους σου
  choice: hast du deine Worte wahr gemacht
  rationale: ἵστημι bezeichnet hier das Bestätigen beziehungsweise tatsächliche Eintretenlassen der zuvor ausgesprochenen Gerichtsworte. „Wahr gemacht“ drückt ihre Verwirklichung aus, ohne zusätzliche Deutung einzutragen.
- source_word: ἐν χερσὶν τῶν παίδων σου τῶν προφητῶν
  choice: durch deine Diener, die Propheten
  rationale: Die wörtliche griechische Wendung „durch die Hände“ bezeichnet die Propheten als Vermittler der göttlichen Worte. Im heutigen Deutsch gibt „durch“ diese Funktion klar und natürlich wieder.
- source_word: παίδων σου
  choice: deine Diener
  rationale: παῖς ist hier die herkömmliche Bezeichnung für von Gott beauftragte Diener; „Kinder“ wäre im prophetischen Zusammenhang missverständlich, „Sklaven“ unnötig eng.
- source_word: τοῦ ἐξενεχθῆναι τὰ ὀστᾶ
  choice: die Gebeine sollten fortgebracht werden
  rationale: Der artikulierte Infinitiv gibt den Inhalt beziehungsweise das Ergebnis des prophetischen Wortes an. Das Passiv und der auf die Zukunft bezogene Gehalt bleiben erhalten; „Gebeine“ ist für menschliche Knochen in einem Bestattungskontext würdig und präzise.
- source_word: ἐκ τοῦ τόπου αὐτῶν
  choice: von ihrer Stätte
  rationale: „Stätte“ gibt τόπος als Ort wieder und ist bei Gebeinen idiomatischer als das abstrakte „Ort“, ohne im Haupttext ausdrücklich „Grab“ oder „Ruhestätte“ einzusetzen.
theological_decisions:
- issue: Ob die erste Aussage ausdrücklich als Ungehorsam formuliert werden soll
  choice: wir hörten nicht auf deine Stimme
  alternative: wir gehorchten deiner Stimme nicht
  rationale: Der Zusammenhang handelt von Ungehorsam, doch der griechische Text bewahrt das Hörmotiv. Die deutsche Formulierung erhält dieses Bild und lässt zugleich den Gehorsamsaspekt erkennen.
- issue: Wie Gottes Handeln an seinen prophetischen Gerichtsworten wiederzugeben ist
  choice: hast du deine Worte wahr gemacht
  alternative: hast du deine Worte bestätigt / erfüllt
  rationale: Die Formulierung bringt zum Ausdruck, dass die angekündigten Worte tatsächlich eingetroffen sind, ohne die Aussage über eine allgemeine Lehre von Verheißung oder Erfüllung hinaus auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das biblische Bild vom Hören auf Gottes Stimme bleibt erhalten. „Vorfahren“ vermeidet die mögliche Verengung von πατέρες auf unmittelbar leibliche Väter; „Gebeine“ entspricht dem ernsten Bestattungskontext. Die Satzteilung dient der Verständlichkeit, ohne den Gedankengang zu verändern.
