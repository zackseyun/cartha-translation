base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/028.yaml
  text: just as you spoke by the hand of your servant Moses[a], on the day when you commanded him to write your law before the sons of Israel, saying[b],
translation:
  language: de
  text: 'wie du durch deinen Diener Mose[a] gesprochen hast, an dem Tag, als du ihm geboten hast, dein Gesetz vor den Söhnen Israels[b] aufzuschreiben, mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand deines Dieners Mose«; eine biblische Wendung im Sinn von »durch« oder »vermittelt durch«.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »vor den Kindern Israels« beziehungsweise »vor den Israeliten«. Griechisch: »vor den Söhnen Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὰ
  choice: genau so, wie
  rationale: Drückt die Entsprechung aus und gibt die verstärkende Vergleichspartikel in natürlichem modernem Deutsch wieder.
- source_word: ἐλάλησας
  choice: du gesprochen hast
  rationale: Bewahrt den feierlichen Sprachgebrauch und fügt sich grammatisch in den fortlaufenden Gebetskontext ein.
- source_word: ἐν χειρὶ
  choice: durch
  rationale: Gibt den biblischen Vermittlungsidiom im Deutschen klar und natürlich wieder; die wörtliche Bildform wird in der Fußnote genannt.
- source_word: παιδός σου
  choice: deinen Diener
  rationale: παῖς bezeichnet Mose hier als beauftragten Diener Gottes, nicht als Kind; „Sklave“ wäre in diesem Ehrentitel zu eng.
- source_word: ἐν ἡμέρᾳ
  choice: an dem Tag
  rationale: Formnahe und zugleich idiomatische Wiedergabe der Zeitangabe.
- source_word: ἐντειλαμένου σου αὐτῷ
  choice: als du ihm geboten hast
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Begleitumstand; „geboten“ wahrt den würdevollen Ton.
- source_word: γράψαι
  choice: aufzuschreiben
  rationale: Im Zusammenhang mit dem Gesetz bezeichnet das Verb dessen schriftliche Niederlegung; „aufschreiben“ ist im Deutschen natürlicher als bloß „schreiben“.
- source_word: τὸν νόμον σου
  choice: dein Gesetz
  rationale: Im mosaischen Bundeszusammenhang ist „Gesetz“ die geläufige und sachgerechte Entsprechung von νόμος.
- source_word: ἐναντίον
  choice: vor
  rationale: Bei Personen bedeutet ἐναντίον hier „vor“ beziehungsweise „in Gegenwart von“, nicht „gegen“.
- source_word: υἱῶν Ἰσραήλ
  choice: den Söhnen Israels
  rationale: Bewahrt die ausdrücklich maskuline griechische Form und den biblischen Klang; eine idiomatischere Alternative steht in der Fußnote.
- source_word: λέγων
  choice: indem du sprachst
  rationale: Das Partizip leitet die im nächsten Vers folgende direkte Rede ein und wird auf das angesprochene „du“ bezogen.
theological_decisions:
- issue: Bedeutung von παῖς als Bezeichnung für Mose
  choice: deinen Diener
  alternative: dein Kind; deinen Sklaven
  rationale: Im Kontext bezeichnet das Wort Moses ehrenvolle Rolle als von Gott beauftragter Diener, ohne eine leibliche Kindschaft oder vorrangig einen rechtlichen Sklavenstatus auszudrücken.
- issue: Geschlechtsspezifische Wendung υἱῶν Ἰσραήλ
  choice: den Söhnen Israels
  alternative: den Kindern Israels; den Israeliten
  rationale: Die Übersetzung erhält die maskuline Form des Ausgangstextes; die mögliche kollektive Bedeutung wird durch eine Fußnote zugänglich gemacht.
- issue: Vermittelte Rede Gottes durch Mose
  choice: durch deinen Diener Mose
  alternative: durch die Hand deines Dieners Mose
  rationale: „Durch“ gibt die vermittelte Urheberschaft wieder, ohne aus der idiomatischen Wendung eine besondere Lehre über Inspiration oder Autorenschaft abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Der Vers bleibt als Einleitung der folgenden direkten Rede syntaktisch offen; der Doppelpunkt macht diese Fortsetzung deutlich.
