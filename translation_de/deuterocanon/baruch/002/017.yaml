    issue: „seine Gerechtigkeit anerkennen“ ist eine zu starke Auslegung von δικαίωμα.
    rationale: Das Griechische hat neben δόξαν ein zweites direktes Objekt zu δώσουσιν und enthält weder das Possessivpronomen „seine“ noch ein Verb im Sinn von „anerkennen“. δικαίωμα kann hier Gottes Recht, Gerechtigkeit oder gerechten Anspruch bezeichnen; die Übersetzung soll diese Offenheit nicht in der Hauptfassung festlegen.
