base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/017.yaml
  text: 'Open your eyes and see: it is not the dead in Hades, whose breath has been taken from their inward parts, who will give glory and righteousness to the Lord;'
translation:
  language: de
  text: 'Öffne deine Augen und sieh: Nicht die Toten im Hades, deren Lebenshauch aus ihrem Inneren genommen wurde,[a] werden dem Herrn Ehre und Recht geben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deren Geist aus ihrem Inneren genommen wurde“.'
    reason: lexical_alternative
  - marker: b
    text: '„Recht“ kann hier Gottes Gerechtigkeit oder seinen gerechten Anspruch bezeichnen; auch: „werden dem Herrn Ehre geben und seine Gerechtigkeit anerkennen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνοιξον ὀφθαλμούς σου καὶ ἴδε
  choice: Öffne deine Augen und sieh
  rationale: Die beiden direkten Imperative werden schlicht, würdig und quellennah wiedergegeben.
- source_word: οὐχ οἱ τεθνηκότες ἐν τῷ ᾅδῃ
  choice: Nicht die Toten im Hades
  rationale: Die vorangestellte Verneinung bewahrt den Nachdruck des Griechischen; „Hades“ erhält die Bezeichnung für den Bereich der Toten.
- source_word: τὸ πνεῦμα αὐτῶν
  choice: deren Lebenshauch
  rationale: Im Zusammenhang mit dem Tod bezeichnet πνεῦμα wahrscheinlich den genommenen Lebenshauch; „Geist“ bleibt als echte Alternative in der Fußnote erhalten.
- source_word: ἀπὸ τῶν σπλάγχνων αὐτῶν
  choice: aus ihrem Inneren
  rationale: σπλάγχνα bezeichnet die inneren Teile; „aus ihrem Inneren“ ist natürliches modernes Deutsch und wahrt das körperliche Bild, ohne unnötig anatomisch zu klingen.
- source_word: δώσουσιν δόξαν
  choice: werden ... Ehre geben
  rationale: Die futurische Aussage und die feste biblische Wendung werden direkt wiedergegeben.
- source_word: δικαίωμα
  choice: seine Gerechtigkeit anerkennen
  rationale: Im Zusammenhang bezeichnet δικαίωμα wahrscheinlich Gottes Rechtsein beziehungsweise gerechten Anspruch. Das ergänzte „anerkennen“ ergibt im Deutschen eine verständliche Koordination mit „Ehre geben“, ohne die mögliche Bedeutung „Recht“ auszuschließen.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: Der Dativ bezeichnet den Empfänger; κύριος wird traditions- und registergemäß mit „Herr“ übersetzt.
theological_decisions:
- issue: Bedeutung von πνεῦμα im Todeszusammenhang
  choice: Lebenshauch
  alternative: Geist
  rationale: Der Kontext der Toten im Hades legt die beim Tod entwichene Lebenskraft beziehungsweise den Lebensatem nahe. Da πνεῦμα ebenso „Geist“ bedeuten kann, wird diese Spannung in einer Fußnote bewahrt.
- issue: Bedeutung von δικαίωμα in Bezug auf Gott
  choice: seine Gerechtigkeit anerkennen
  alternative: dem Herrn Ehre und Recht geben
  rationale: δικαίωμα kann Recht, gerechten Anspruch oder Gerechtigkeit bezeichnen. Die Hauptfassung drückt idiomatisch das Anerkennen von Gottes Gerechtigkeit aus; die formal nähere Alternative bleibt dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die markierte Satzstellung erhält den Gegensatz; „Hades“ bleibt als spezifische Bezeichnung des Totenreichs stehen. Alle Fußnotenmarker erscheinen im Haupttext.
