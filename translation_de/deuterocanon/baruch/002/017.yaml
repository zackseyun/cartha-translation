review_pass:
  verdict: revise
  source_fidelity: Die Imperative, der Kontrast zu den Toten im Hades und die Todesumschreibung sind insgesamt quellennah. Die Hauptfassung „seine Gerechtigkeit anerkennen“ entfaltet δικαίωμα jedoch interpretierend und verändert die parallele Konstruktion δόξαν καὶ δικαίωμα ... δώσουσιν. „Dem Herrn Ehre und Recht geben“ bewahrt die griechische Struktur und die semantische Offenheit besser.
  naturalness: „Öffne deine Augen und sieh“ sowie „die Toten im Hades“ sind natürliches, modernes Standarddeutsch mit angemessen biblischem Ton. „Dem Herrn Ehre und Recht geben“ ist verständlich und im Deutschen als Wendung möglich; die Fußnote erläutert die hier bestehende Bedeutungsweite von „Recht“.
  terminology: „Hades“ bewahrt die spezifische Bezeichnung ᾅδης. „Lebenshauch“ ist für πνεῦμα im Kontext vertretbar, sofern „Geist“ als Alternative vermerkt bleibt. Für δικαίωμα ist „Recht“ in der Hauptfassung vorzuziehen, da es weder ein possessives „seine“ noch das zusätzliche Deutungsverb „anerkennen“ einführt.
  issues:
