revisions:
- from: Und wir hörten nicht auf seine Stimme[a], um nach den Geboten des Herrn zu leben, die er uns vor Augen gestellt hatte[b].
  to: Und wir hörten nicht auf seine Stimme[a] und lebten nicht nach den Geboten des Herrn, die er uns vorgelegt hat[b].
  rationale: Die Revision beseitigt den im Deutschen missverständlichen Zweckbezug der „um ... zu“-Konstruktion und gibt den ethischen Zusammenhang als klare, natürliche Koordination wieder. Die Hörmetapher, die Bezeichnung „Gebote des Herrn“ und die räumliche Bildsprache des Vorlegens bleiben erhalten. Die Fußnoten wurden sprachlich und auslegungsbezogen auf den griechischen Wortlaut zurückgeführt.
