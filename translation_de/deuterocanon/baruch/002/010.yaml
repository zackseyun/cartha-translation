    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: hörten … auf
  rationale: Die deutsche Wendung „auf seine Stimme hören“ bewahrt das Bild des Hörens und bezeichnet zugleich das aufmerksame Befolgen, ohne den Ausdruck vollständig als „gehorchen“ aufzulösen.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: auf seine Stimme
  rationale: Der griechische Text nennt ausdrücklich „seine Stimme“. Die persönliche Bildsprache der göttlichen Anrede bleibt so erhalten.
- source_word: πορεύεσθαι
  choice: zu leben
  rationale: πορεύομαι bezeichnet hier im Zusammenhang mit Geboten den Lebenswandel. Das heutige deutsche „nach den Geboten leben“ gibt diese ethische Bedeutung natürlicher wieder als „in den Geboten wandeln“.
- source_word: τοῖς προστάγμασιν
  choice: nach den Geboten
  rationale: πρόσταγμα bezeichnet eine Anordnung oder einen Befehl. „Gebote“ passt zum Bundes- und Gesetzeskontext; der Dativ wird idiomatisch mit „nach“ wiedergegeben.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Κύριος wird in der traditionellen und allgemein verständlichen Gottesbezeichnung mit „der Herr“ wiedergegeben.
- source_word: οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: die er uns vor Augen gestellt hatte
  rationale: Die Wendung lautet wörtlich etwa „die er vor unser Angesicht gab“. „Uns vor Augen stellen“ bewahrt das räumliche Bild in natürlichem Deutsch und drückt aus, dass die Gebote dem Volk verbindlich vorgelegt wurden.
theological_decisions:
- issue: Ob ἠκούσαμεν als bloßes Hören oder ausdrücklich als Gehorsam wiederzugeben ist
  choice: hörten nicht auf seine Stimme
  alternative: gehorchten seiner Stimme nicht
  rationale: Die gewählte Formulierung bewahrt die biblische Hörmetapher und lässt zugleich deren Sinn des Beachtens und Befolgens erkennen.
- issue: Wie πορεύεσθαι im ethischen Zusammenhang wiederzugeben ist
  choice: nach den Geboten … leben
  alternative: in den Geboten … wandeln
  rationale: „Leben“ bezeichnet im modernen Deutsch klar den gemeinten Lebenswandel. Die traditionelle Metapher „wandeln“ wäre formnäher, klingt heute jedoch altertümlich und kann missverstanden werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hörmetapher bleibt erhalten; die ethische Wendung wird mit dem heute natürlichen „nach den Geboten leben“ wiedergegeben. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
