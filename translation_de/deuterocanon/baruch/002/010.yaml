translation:
  language: de
  text: Und wir hörten nicht auf seine Stimme[a] und lebten nicht nach den Geboten des Herrn, die er uns vorgelegt hat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir gehorchten ihm nicht.“ Wörtlich steht im Griechischen: „Wir hörten nicht auf seine Stimme.“ In biblischer Sprache bezeichnet dies, Gottes Weisung nicht zu beachten und zu befolgen.'
    reason: lexical_alternative
