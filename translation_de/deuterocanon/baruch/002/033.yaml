base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/033.yaml
  text: And they will turn away from their stiff neck and from their evil deeds[a], because they will remember the way of their fathers who sinned before the Lord.
translation:
  language: de
  text: Und sie werden sich von ihrem starren Rücken[a] und von ihren bösen Taten abwenden; denn sie werden sich an den Weg ihrer Väter erinnern, die vor dem Herrn gesündigt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihrem harten Rücken“; sinngemäß auch: „von ihrem Starrsinn“. Der griechische Text spricht vom Rücken, nicht vom Nacken.'
    reason: Das ungewöhnliche Körperbild des Ausgangstextes kann im Deutschen missverständlich wirken; die Anmerkung erklärt den Wortsinn und nennt die idiomatische Bedeutung, ohne das Bild im Haupttext zu ersetzen.
lexical_decisions:
- source_word: ἀποστρέψουσιν
  choice: sie werden sich … abwenden
  rationale: Das Futur mit ἀπό bezeichnet eine künftige Abkehr; die reflexive deutsche Wendung gibt den Richtungswechsel natürlich wieder.
- source_word: ἀπὸ τοῦ νώτου αὐτῶν τοῦ σκληροῦ
  choice: von ihrem starren Rücken
  rationale: νώτου bedeutet wörtlich „Rücken“, nicht „Nacken“. „Starr“ bewahrt sowohl das Körperbild als auch den übertragenen Sinn der Unnachgiebigkeit.
- source_word: ἀπὸ πονηρῶν πραγμάτων αὐτῶν
  choice: von ihren bösen Taten
  rationale: πράγματα bezeichnet hier das böse Handeln; „Taten“ ist im Deutschen klarer als das allgemeinere „Dinge“.
- source_word: μνησθήσονται
  choice: sie werden sich erinnern
  rationale: Die übliche und direkte Wiedergabe des Futurs von μιμνῄσκομαι.
- source_word: τῆς ὁδοῦ
  choice: an den Weg
  rationale: „Weg“ erhält das biblische Bild für Lebensführung oder Verhaltensweise, ohne es auf eine einzige Deutung festzulegen.
- source_word: πατέρων αὐτῶν
  choice: ihrer Väter
  rationale: Die ausdrücklich maskuline Form bezeichnet die Vorväter und wird entsprechend beibehalten.
- source_word: τῶν ἁμαρτόντων
  choice: die … gesündigt haben
  rationale: Der substantivierte Aoristpartizip wird als natürlicher deutscher Relativsatz wiedergegeben; das Perfekt bezeichnet die zurückliegende Tat mit gegenwärtiger Relevanz.
- source_word: ἔναντι Κυρίου
  choice: vor dem Herrn
  rationale: ἔναντι bedeutet hier „vor“ beziehungsweise „in den Augen von“; „gegen den Herrn“ wäre interpretierender.
theological_decisions:
- issue: Körperbild in „ihrem starren Rücken“
  choice: Das im griechischen Text vorhandene Rückenbild wird beibehalten.
  alternative: von ihrer Halsstarrigkeit / von ihrem starren Nacken / von ihrem Starrsinn
  rationale: Der Text hat νῶτον („Rücken“) und nicht das geläufigere Wort für „Nacken“. Eine Glättung würde ein anderes biblisches Idiom eintragen oder das Bild ganz auflösen.
- issue: Wiedergabe von πατέρων αὐτῶν
  choice: ihrer Väter
  alternative: ihrer Vorfahren
  rationale: „Väter“ entspricht der grammatisch maskulinen Ausgangsform und bewahrt die traditionelle Bezeichnung der Vorväter.
- issue: Wiedergabe von Κυρίου
  choice: dem Herrn
  alternative: dem HERRN
  rationale: Die griechische Quelle bietet Κυρίου. Daher wird die reguläre deutsche Wiedergabe „Herr“ verwendet, ohne typografisch einen unmittelbar belegten Gottesnamen vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ungewöhnliche griechische Rückenbild bleibt aus Quellentreue im Haupttext erhalten und wird durch eine knappe Fußnote erläutert. Das Semikolon macht die Begründungsrelation von ὅτι gut lesbar.
