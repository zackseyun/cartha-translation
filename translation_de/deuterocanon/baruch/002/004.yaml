  source_fidelity: Die Auslieferung an die umliegenden Königreiche, die Schmach und die Zerstreuung durch den Herrn sind zutreffend wiedergegeben. Die lokale Relativkonstruktion οὗ … ἐκεῖ sollte jedoch deutlicher als Bezug auf die Völker gefasst werden, unter die die Zerstreuung erfolgte; das wiederaufnehmende ἐκεῖ sollte nicht ganz ausfallen.
  naturalness: Der Entwurf ist insgesamt modernes, würdiges Deutsch. Die Konstruktion „sodass sie … wurden“ macht aus εἰς unnötig stark eine Folge und klingt mit „zur Verwüstung wurden“ semantisch etwas holprig. Eine direkte Final-/Resultatsfügung mit „zu Schmach und Verwüstung“ ist näher am Griechischen und idiomatischer.
  terminology: „in die Gewalt geben“, „Königreiche“, „Völker“, „der Herr“ und „zerstreuen“ sind treffend. „Schmach“ ist für ὀνειδισμός etwas genauer als „Gespött“, da es nicht nur Spott, sondern öffentliche Entehrung umfasst. „Verwüstung“ für ἄβατον bleibt angesichts des Kontexts mit einer lexikalischen Fußnote vertretbar.
