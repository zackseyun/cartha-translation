    rationale: Die Präpositionalfügung „zu Schmach und Verwüstung“ folgt dem griechischen εἰς direkter. „Schmach“ deckt den weiteren Bedeutungsbereich von ὀνειδισμός besser ab als das enger auf Spott bezogene „Gespött“.
