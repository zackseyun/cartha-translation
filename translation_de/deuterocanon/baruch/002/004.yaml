translation:
  language: de
  text: Und er gab sie allen Königreichen rings um uns in die Gewalt, zu Schmach und Verwüstung[a] unter allen Völkern ringsum, unter die der Herr sie dort zerstreut hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einer unbetretenen, unzugänglichen Einöde“. Das griechische Wort kann wörtlich etwas bezeichnen, das nicht betreten werden kann oder nicht betreten wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν … ὑποχειρίους
  choice: gab sie … in die Gewalt
  rationale: Die Verbindung bezeichnet nicht neutrales Geben, sondern die Auslieferung unter fremde Herrschaft. Die deutsche Wendung gibt das Machtverhältnis klar und natürlich wieder.
- source_word: πάσαις ταῖς βασιλείαις ταῖς κύκλῳ ἡμῶν
  choice: allen Königreichen rings um uns
  rationale: Bewahrt den umfassenden Plural und die räumliche Aussage des griechischen Textes.
- source_word: εἰς ὀνειδισμόν
  choice: zum Gespött
  rationale: ὀνειδισμός bezeichnet öffentliche Schmach und Verhöhnung; „zum Gespött“ ist im Deutschen idiomatisch und wahrt den sozialen Charakter der Erniedrigung.
- source_word: ἄβατον
  choice: zur Verwüstung
  rationale: Das Wort bezeichnet wörtlich etwas Unbetretenes oder Unzugängliches, kann im Gerichtskontext aber den Zustand der Verödung ausdrücken. Die sachliche Unsicherheit wird durch eine Fußnote offengehalten.
- source_word: ἐν πᾶσι τοῖς λαοῖς
  choice: unter allen Völkern
  rationale: λαοί meint hier Menschengruppen beziehungsweise Völker, nicht notwendig politische Staaten; „unter“ gibt den Aufenthaltsbereich der Zerstreuten natürlich wieder.
- source_word: διέσπειρεν
  choice: zerstreut hatte
  rationale: Das Verb ist die geläufige Bezeichnung für die Zerstreuung im Exil. Das Plusquamperfekt ordnet das Geschehen im deutschen Satz zeitlich verständlich ein.
- source_word: Κύριος
  choice: der Herr
  rationale: Die traditionelle und im modernen Bibeldeutsch verständliche Wiedergabe lässt die im Text ausgesagte göttliche Urheberschaft unverändert stehen.
- source_word: οὗ … ἐκεῖ
  choice: unter die … zerstreut hatte
  rationale: Die griechische Verbindung aus lokalem Relativadverb und wiederaufnehmendem „dort“ ist im Deutschen wörtlich schwerfällig. Die gewählte Form gibt idiomatisch den Ziel- und Aufenthaltsbereich der Zerstreuung wieder.
theological_decisions:
- issue: Göttliche Urheberschaft der Zerstreuung
  choice: „der Herr sie zerstreut hatte“
  alternative: eine unpersönliche oder lediglich zugelassene Zerstreuung
  rationale: Der griechische Text nennt den Herrn ausdrücklich als Subjekt. Die Übersetzung schwächt diese Aussage über das Gericht nicht ab und erläutert sie auch nicht konfessionell.
- issue: Bedeutung von ἄβατον im Gerichtszusammenhang
  choice: „Verwüstung“ mit Fußnote
  alternative: „unzugänglicher Ort“ oder „unbetretene Einöde“
  rationale: Der Zusammenhang legt Verödung nahe, während die wörtliche Bedeutung eine räumliche Vorstellung enthält. Haupttext und Fußnote bewahren beides, ohne die Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In die Gewalt geben“ und „zum Gespött werden“ sind allgemein verständlich, ohne umgangssprachlich zu wirken. Die Wiederholung von „rings“ spiegelt die griechische Struktur, während der Relativsatz für natürliches Deutsch leicht geglättet wurde.
