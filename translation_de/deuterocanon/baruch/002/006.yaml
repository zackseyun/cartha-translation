base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/006.yaml
  text: To the Lord our God belongs righteousness[a], but to us and to our fathers belongs shame of face[b], as it is this day.
translation:
  language: de
  text: Dem Herrn, unserem Gott, gehört die Gerechtigkeit[a], uns aber und unseren Vätern die Schande im Gesicht[b], wie es heute der Fall ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Recht«. Das griechische Wort kann sowohl Gerechtigkeit als auch Recht beziehungsweise gerechtes Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Schande der Gesichter«; ein Ausdruck für sichtbare Schande oder öffentliche Demütigung.'
    reason: cultural_note
lexical_decisions:
- source_word: Τῷ κυρίῳ θεῷ ἡμῶν
  choice: Dem Herrn, unserem Gott, gehört
  rationale: Der Dativ mit ausgelassener Kopula drückt eine Zuordnung aus. „gehört“ bildet diese knapp und idiomatisch ab.
- source_word: ἡ δικαιοσύνη
  choice: die Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die Bedeutungsbreite von δικαιοσύνη zwischen moralischer Richtigkeit und gerechtem Handeln und passt zum Bekenntnis, dass Gott im Recht ist.
- source_word: ἡμῖν δὲ καὶ τοῖς πατράσιν ἡμῶν
  choice: uns aber und unseren Vätern
  rationale: Die Formulierung erhält den deutlichen Gegensatz zu Gott und bezieht die Vorfahren ausdrücklich in das Schuldbekenntnis ein.
- source_word: ἡ αἰσχύνη τῶν προσώπων
  choice: die Schande, die uns ins Gesicht geschrieben steht
  rationale: Die idiomatische Wiedergabe macht die sichtbare, öffentliche Beschämung verständlich, während die Fußnote den wörtlichen Ausdruck dokumentiert.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: so ist es bis heute
  rationale: Die Wendung bezeichnet den gegenwärtig offenkundigen Zustand. „bis heute“ gibt ihre formelhafte zeitliche Kraft in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη als Aussage über Gott
  choice: Gottes Gerechtigkeit beziehungsweise Richtigkeit steht der Schande Israels gegenüber
  alternative: Gottes richterliche Gerechtigkeit steht Israels Schande gegenüber
  rationale: Der Vers bekennt, dass Gott im Recht ist, während das Volk und seine Vorfahren Schande tragen. „Gerechtigkeit“ wahrt die theologische Breite und verengt die Aussage nicht auf Strafgerechtigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Gegensatz zwischen Gottes Gerechtigkeit und der Schande des Volkes bleibt erhalten; der schwer verständliche griechisch-semitische Ausdruck zur Gesichtsschande wird im Haupttext behutsam idiomatisch wiedergegeben und in der Fußnote wörtlich erschlossen.
