    issue: Die Formulierung „die uns ins Gesicht geschrieben steht“ ist interpretierend erweitert.
    rationale: Der griechische Text sagt wörtlich „die Schande der Gesichter“ und nennt an dieser Stelle weder „uns“ noch das Bild des Geschriebenseins. Die Ergänzung kann zudem die ausdrücklich mitgenannten Väter aus dem Bildbereich lösen.
  - severity: medium
    issue: „so ist es bis heute“ gibt die Zeitformel nicht genau wieder.
    rationale: ὡς ἡ ἡμέρα αὕτη verweist auf den gegenwärtig sichtbaren Zustand „wie heute/an diesem Tag“, nicht primär auf dessen Fortdauer bis in die Gegenwart.
