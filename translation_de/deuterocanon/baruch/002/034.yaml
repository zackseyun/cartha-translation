base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/034.yaml
  text: and I will bring them back to the land that I swore to their fathers—to Abraham and Isaac and Jacob—and they will rule over it; and I will multiply them[a], and they will certainly not be diminished.
translation:
  language: de
  text: Und ich werde sie in das Land zurückbringen, das ich ihren Vätern – Abraham, Isaak und Jakob – zugeschworen habe. Sie werden darüber herrschen[a]; ich werde sie vermehren, und sie werden gewiss nicht weniger werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es in Besitz nehmen“. Das griechische Verb kann sowohl Herrschaft als auch Besitz kraft Verfügungsgewalt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψω
  choice: ich werde sie … zurückbringen
  rationale: Das kausative Bewegungsmoment des Verbs und die Rückkehr in das Land werden in natürlichem Deutsch unmittelbar wiedergegeben.
- source_word: γῆν
  choice: Land
  rationale: Im Zusammenhang mit dem Eid an die Patriarchen bezeichnet γῆ das verheißene Land, nicht die Erde im Allgemeinen.
- source_word: ὤμοσα
  choice: zugeschworen habe
  rationale: Die Formulierung bewahrt den ausdrücklichen Eidcharakter und lässt sich mit dem Dativ der Empfänger im Deutschen natürlich verbinden.
- source_word: πατράσιν
  choice: Vätern
  rationale: Die unmittelbar folgende Nennung Abrahams, Isaaks und Jakobs zeigt, dass die Patriarchen gemeint sind; „Vätern“ bildet die griechische Bezeichnung formal ab.
- source_word: κυριεύσουσιν
  choice: sie werden darüber herrschen
  rationale: κυριεύω bezeichnet grundsätzlich Herrschaft oder Verfügungsgewalt. „Darüber herrschen“ gibt diese stärkere Bedeutung direkter wieder als das kontextuell ebenfalls mögliche „es in Besitz nehmen“.
- source_word: πληθυνῶ
  choice: ich werde sie vermehren
  rationale: „Vermehren“ greift die bundesbezogene Sprache von zahlreicher Nachkommenschaft auf und entspricht dem transitiven Verb.
- source_word: οὐ μὴ
  choice: gewiss nicht
  rationale: Die Verbindung οὐ μή mit dem Konjunktiv ist eine nachdrückliche Verneinung; „gewiss nicht“ gibt diese Verstärkung idiomatisch wieder.
- source_word: σμικρυνθῶσιν
  choice: weniger werden
  rationale: Gemeint ist hier im Gegenüber zu πληθυνῶ eine zahlenmäßige Verminderung. „Weniger werden“ ist klar und natürlich, ohne den passiven griechischen Ausdruck unnötig schwerfällig nachzubilden.
theological_decisions:
- issue: Bundesbezogene Wiederherstellung aufgrund des Eides an die Patriarchen
  choice: Die Eidsprache sowie Abraham, Isaak und Jakob bleiben ausdrücklich im Haupttext erhalten.
  alternative: 'Dynamischer: „das Land, das ich ihren Vorfahren versprochen habe“'
  rationale: Der griechische Text gründet die Rückkehr ausdrücklich auf Gottes Eid an die genannten Väter. Die gewählte Fassung bewahrt diesen Zusammenhang, ohne ihn theologisch weiter auszudeuten.
- issue: Art der künftigen Beziehung zum Land
  choice: „darüber herrschen“ im Haupttext; die mögliche Besitzbedeutung in der Fußnote
  alternative: „es in Besitz nehmen“
  rationale: κυριεύω trägt die Vorstellung von Herrschaft oder Verfügungsgewalt, kann im Kontext eines Landes aber auf dessen Besitznahme zielen. Die Fassung bewahrt diese lexikalische Spannung, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich markiert die drei Namen als Apposition zu „ihren Vätern“. Die Semikolonstruktur hält Vermehrung und ausbleibende Verminderung eng zusammen. Der Fußnotenmarker steht unmittelbar bei der tatsächlich erläuterten Wendung.
