base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/008.yaml
  text: And we did not entreat the favor of the Lord[b][a], that each one might turn from the thoughts of their evil heart.
translation:
  language: de
  text: Und wir flehten den Herrn nicht um Gnade an,[a] dass er jeden von den Gedanken seines bösen Herzens abwende.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wir flehten das Angesicht des Herrn nicht an.“ Die Wendung meint, den Herrn um seine gnädige Zuwendung zu bitten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von den Absichten seines bösen Herzens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθημεν
  choice: wir flehten … an
  rationale: δέομαι bezeichnet ein inständiges Bitten oder Flehen. „Anflehen“ bewahrt die Eindringlichkeit des Verbs und klingt zugleich natürlich und würdig.
- source_word: τοῦ προσώπου Κυρίου
  choice: den Herrn … um Gnade
  rationale: Wörtlich steht „das Angesicht des Herrn“. In Verbindung mit dem Verb des Flehens bezeichnet die semitisch geprägte Wendung das Erbitten seiner gnädigen Zuwendung; die idiomatische Wiedergabe vermeidet im Deutschen die unverständliche Formulierung „das Angesicht anflehen“.
- source_word: τοῦ ἀποστρέψαι
  choice: damit … umkehrte
  rationale: Der artikulierte Infinitiv lässt sich hier als Ziel oder beabsichtigte Folge des Flehens verstehen. „Damit“ bewahrt diese Beziehung, ohne sie stärker festzulegen als nötig.
- source_word: ἕκαστον
  choice: jeder
  rationale: Die distributive Einzahl wird knapp und natürlich wiedergegeben.
- source_word: νοημάτων
  choice: Absichten
  rationale: νόημα kann Gedanken, Absichten oder Pläne bezeichnen. Im Zusammenhang der geforderten Umkehr bringt „Absichten“ die willentliche Seite zum Ausdruck; „Gedanken“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: καρδίας
  choice: Herzens
  rationale: „Herz“ bewahrt das biblische Bild für das innere Zentrum von Denken und Wollen.
- source_word: αὐτῶν
  choice: seines
  rationale: Das griechische αὐτῶν ist formal pluralisch und bezieht sich auf die Gruppe, während ἕκαστον jedes einzelne Mitglied herausgreift. Natürliches Deutsch setzt nach „jeder“ den distributiven Singular „seines“.
- source_word: τῆς πονηρᾶς
  choice: bösen
  rationale: Das Adjektiv kennzeichnet das Herz moralisch als böse und wird unmittelbar beim Bezugswort wiedergegeben.
theological_decisions:
- issue: Idiomatische Bedeutung von „das Angesicht des Herrn“
  choice: „den Herrn um Gnade anflehen“
  alternative: „das Angesicht des Herrn anflehen“ / „den Herrn um seine Gunst bitten“
  rationale: Die gewählte Fassung macht die Bitte um Gottes gnädige Zuwendung verständlich, ohne „Angesicht“ räumlich zu deuten oder das Flehen zu einem bloß allgemeinen Gebet abzuschwächen.
- issue: Innere Quelle des Bösen
  choice: „Absichten seines bösen Herzens“
  alternative: „Gedanken seines bösen Herzens“
  rationale: Das biblische Herzbild bleibt erhalten. „Absichten“ gibt eine mögliche willentliche Nuance von νοήματα wieder, während die Fußnote die breitere Bedeutung „Gedanken“ sichtbar hält.
- issue: Beziehung des Flehens zur Umkehr
  choice: final mit „damit“
  alternative: „sodass“ oder bloßes „zu“
  rationale: Der griechische Infinitiv kann Ziel beziehungsweise beabsichtigte Folge ausdrücken. „Damit“ passt zum Zusammenhang, ohne zu behaupten, dass Gottes Gnade menschliche Umkehr automatisch bewirke.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, während die semitisch geprägte Wendung vom „Angesicht des Herrn“ im Haupttext verständlich idiomatisch wiedergegeben und in der Fußnote wörtlich dokumentiert wird.
