base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/035.yaml
  text: And I will establish for them an everlasting covenant[a], that I may be their God and they may be my people; and I will no longer remove my people Israel from the land that I gave to them.
translation:
  language: de
  text: 'Und ich werde für sie einen ewigen Bund aufrichten[a]: Ich werde ihr Gott sein, und sie werden mein Volk sein. Und ich werde mein Volk Israel nicht länger aus dem Land entfernen, das ich ihnen gab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen ewigen Bund aufrichten, dass ich ihr Gott sein werde und sie mein Volk sein werden“. Die griechische Infinitivkonstruktion kann Zweck oder Inhalt des Bundes ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσω
  choice: werde … schließen
  rationale: In Verbindung mit διαθήκη bezeichnet ἵστημι das Aufrichten bzw. Inkraftsetzen eines Bundes. Im heutigen Deutschen ist „einen Bund schließen“ die natürliche und zugleich würdevolle Wendung.
- source_word: διαθήκην αἰώνιον
  choice: einen ewigen Bund
  rationale: „Ewiger Bund“ ist die geläufige biblische Bundesformel und gibt die bleibende Geltung von αἰώνιον prägnant wieder.
- source_word: τοῦ εἶναί με αὐτοῖς εἰς θεόν
  choice: Ich werde ihr Gott sein
  rationale: Die Infinitivkonstruktion bezeichnet Zweck bzw. Inhalt des Bundes. Die finite Formulierung gibt die Bundeszusage in natürlichem Deutsch wieder; die grammatische Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: sie werden mein Volk sein
  rationale: Die vertraute deutsche Bundesformel bewahrt die wechselseitige Zuordnung zwischen Gott und Volk.
- source_word: οὐ κινήσω ἔτι
  choice: werde … nicht länger … vertreiben
  rationale: κινέω bedeutet wörtlich „bewegen“; mit ἀπό und einem Volk, das aus seinem Land entfernt wird, ist eine Vertreibung bzw. Verdrängung gemeint. „Vertreiben“ macht diesen Zusammenhang klar, ohne die Aussage durch „nie wieder“ zu verstärken.
- source_word: τὸν λαόν μου Ἰσραήλ
  choice: mein Volk Israel
  rationale: Die appositionelle Struktur und die Bundeszugehörigkeit werden im Deutschen unmittelbar bewahrt.
- source_word: ἀπὸ τῆς γῆς
  choice: aus dem Land
  rationale: γῆ meint hier das Israel gegebene Land, nicht die Erde im Allgemeinen.
- source_word: ἧς ἔδωκα αὐτοῖς
  choice: das ich ihnen gegeben habe
  rationale: Das Perfekt ist im Deutschen für eine zurückliegende Gabe mit fortbestehendem Ergebnis idiomatisch und hält den Bezug zum Land eindeutig.
theological_decisions:
- issue: Formulierung der Bundesformel
  choice: Ich werde ihr Gott sein, und sie werden mein Volk sein
  alternative: damit ich ihr Gott bin und sie mein Volk sind
  rationale: Der artikulierte Infinitiv τοῦ εἶναι kann Zweck oder Inhalt des ewigen Bundes ausdrücken. Die Hauptfassung liest ihn als inhaltliche Bundeszusage; die mögliche Zwecknuance bleibt in der Fußnote erhalten.
- issue: Tragweite von οὐ κινήσω ἔτι für Israels Verbleib im Land
  choice: ich werde mein Volk Israel nicht länger aus dem Land vertreiben
  alternative: ich werde mein Volk Israel nicht mehr aus dem Land wegbewegen
  rationale: Die Aussage verheißt das Ende der Entfernung aus dem gegebenen Land. „Nicht länger … vertreiben“ gibt dies verständlich wieder, ohne ein späteres theologisches System einzutragen oder mit „niemals wieder“ über den Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bundesformel bleibt erkennbar; Satzbau und Wortwahl sind zugleich für heutige Leser unmittelbar verständlich.
