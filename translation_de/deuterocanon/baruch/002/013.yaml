  text: Let your wrath turn away from us, because we have been left few among the nations where you scattered us there.
translation:
  language: de
  text: Wende deinen Zorn von uns ab; denn nur wenige von uns sind unter den Völkern übrig geblieben, unter die du uns zerstreut hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστραφήτω ὁ θυμός σου ἀφ᾽ ἡμῶν
  choice: Wende deinen Zorn von uns ab
  rationale: Der griechische Imperativ der dritten Person wird im Deutschen natürlich als direkte Bitte wiedergegeben; θυμός bezeichnet hier den göttlichen Zorn.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung der Bitte ein; „denn“ bildet den kausalen Zusammenhang in gehobenem, natürlichem Deutsch ab.
- source_word: κατελείφθημεν ὀλίγοι
  choice: nur wenige von uns sind … übrig geblieben
  rationale: Bewahrt das Passiv und macht idiomatisch deutlich, dass von der Gemeinschaft nur eine geringe Zahl verblieben ist.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: Gibt den Aufenthaltsbereich der Zerstreuten präzise und natürlich wieder.
- source_word: οὗ διέσπειρας ἡμᾶς ἐκεῖ
  choice: unter die du uns zerstreut hast
  rationale: Das lokative οὗ mit dem resumptiven ἐκεῖ wird im Deutschen ohne redundantes „dort“ idiomatisch als Relativkonstruktion ausgedrückt.
theological_decisions:
- issue: Göttlicher Zorn und Bitte um seine Abwendung
  choice: 'Die Aussage bleibt als direkte Bitte stehen: „Wende deinen Zorn von uns ab“'
  alternative: „Lass von deinem Zorn gegen uns ab“
  rationale: Die gewählte Form wahrt die personale Zuschreibung des Zorns und löst die theologische Spannung nicht durch Abschwächung auf.
- issue: Verantwortung für die Zerstreuung
  choice: „unter die du uns zerstreut hast“
  alternative: „unter denen wir zerstreut wurden“
  rationale: 'Das ausdrückliche griechische Subjekt der Handlung wird erhalten: Gott wird direkt als derjenige angesprochen, der die Zerstreuung vollzogen hat.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Doppelung οὗ … ἐκεῖ wird nicht mechanisch reproduziert, da „unter die … dort“ im Deutschen schwerfällig wäre; ihr lokativer Sinn bleibt vollständig erhalten.
