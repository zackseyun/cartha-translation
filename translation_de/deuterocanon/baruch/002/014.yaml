base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/014.yaml
  text: Hear, O Lord, our prayer and our plea, and deliver us for your own sake, and grant us favor before those who carried us away captive,
translation:
  language: de
  text: Erhöre, Herr, unser Gebet und unser Flehen; rette uns um deinetwillen und lass uns Gunst finden bei denen, die uns in die Verbannung geführt haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσάκουσον
  choice: Erhöre
  rationale: Bezeichnet nicht bloß das Hören, sondern das aufmerksame, antwortende Anhören einer Bitte.
- source_word: δέησις
  choice: Flehen
  rationale: Gibt die eindringliche Bitte in würdigem, weiterhin allgemein verständlichem Deutsch wieder.
- source_word: ἐξελοῦ
  choice: rette
  rationale: Der Imperativ von ἐξαιρέω meint hier das Herausreißen oder Befreien aus Bedrängnis; „rette“ ist natürlich und bewahrt die Dringlichkeit.
- source_word: ἕνεκεν σοῦ
  choice: um deinetwillen
  rationale: Folgt der ausdrücklich auf Gott bezogenen Wendung, ohne einen im Griechischen nicht genannten Beweggrund wie Gottes Namen oder Ehre einzusetzen.
- source_word: δὸς ἡμῖν χάριν κατὰ πρόσωπον
  choice: lass uns Gunst finden bei
  rationale: Natürliches deutsches Idiom für die Bitte, vor anderen Wohlwollen zu erlangen.
- source_word: τῶν ἀποικισάντων ἡμᾶς
  choice: denen, die uns in die Verbannung geführt haben
  rationale: ἀποικίζω bezeichnet hier die erzwungene Wegführung beziehungsweise Deportation; die Formulierung ist präzise, ohne unnötig moderne Verwaltungssprache.
theological_decisions:
- issue: Begründung der Rettungsbitte mit ἕνεκεν σοῦ
  choice: um deinetwillen
  alternative: um deines Namens willen
  rationale: Der Ausgangstext nennt Gott selbst, aber nicht ausdrücklich seinen Namen. Die offenere Formulierung bewahrt, ob Gottes Ehre, Treue, Erbarmen oder ein anderer auf ihn bezogener Grund gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in direkter Gebetssprache. Das Semikolon hält die eng verbundenen Bitten in einem Satz zusammen und vermeidet zugleich eine schwerfällige Reihung.
