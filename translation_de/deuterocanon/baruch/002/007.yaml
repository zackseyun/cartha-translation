translation:
  language: de
  text: 'was der Herr gegen uns aussprach: all dieses Unheil, das über uns kam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „all diese Übel“ oder „all diese Katastrophen“. Das griechische Wort bezeichnet hier das Unheil, das als Gericht über das Volk kam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: was
  rationale: Das Relativpronomen knüpft den Vers als Satzfragment an den vorausgehenden Zusammenhang an; „was“ ist im Deutschen dafür natürlich.
- source_word: ἐλάλησεν
  choice: aussprach
  rationale: λαλέω bezeichnet hier das Reden des Herrn. „Aussprach“ bewahrt den verbalen Charakter und lässt zugleich erkennen, dass es sich um ein gegen das Volk gerichtetes Gerichtswort handelt, ohne daraus ausdrücklich einen Erlass oder eine Weissagung zu machen.
- source_word: Κύριος
  choice: der Herr
  rationale: Der griechische Text bietet Κύριος; die übliche und unmittelbare deutsche Entsprechung ist „der Herr“.
- source_word: ἐφ᾽ ἡμᾶς
  choice: gegen uns
  rationale: 'Beim Reden trägt ἐπί mit Akkusativ im Gerichtszusammenhang adversative Bedeutung: Das Wort richtet sich gegen das Volk.'
- source_word: πάντα τὰ κακὰ ταῦτα
  choice: all dieses Unheil
  rationale: κακά kann sowohl Böses als auch schädliche Ereignisse und Heimsuchungen bezeichnen. „Unheil“ ist im heutigen Deutsch natürlich, passt zum Eintreffen der angekündigten Gerichte und bewahrt eine gewisse semantische Weite.
- source_word: ἦλθεν
  choice: kam
  rationale: Die schlichte Vergangenheitsform gibt den Aorist von ἔρχομαι knapp wieder; zusammen mit „über uns“ entsteht eine natürliche deutsche Wendung.
- source_word: ἐφ᾽ ἡμᾶς
  choice: über uns
  rationale: Beim zweiten Vorkommen verbindet sich die Präposition mit dem Kommen des Unheils; „über uns kam“ ist die idiomatische deutsche Entsprechung.
theological_decisions:
- issue: Ob τὰ κακά moralisch als „das Böse/Übel“ oder erfahrungsbezogen als „Unheil/Katastrophen“ wiederzugeben ist
  choice: Im Haupttext steht „all dieses Unheil“.
  alternative: „all diese Übel“, „all diese Katastrophen“ oder „all das Böse“
  rationale: Im Zusammenhang sind die eingetroffenen schädlichen Gerichte gemeint. „Unheil“ gibt diesen Ereignisbezug wieder, ohne die Aussage auf bloße Naturkatastrophen einzuengen oder Gott ausdrücklich moralisches Böses zuzuschreiben. Die mögliche weitere Bedeutungsbreite von κακά wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Der fragmentarische Anschluss an den vorhergehenden Vers bleibt erhalten. Die Wiederholung von ἐφ᾽ ἡμᾶς wird entsprechend den beiden unterschiedlichen deutschen Verbindungen mit „gegen uns“ und „über uns“ wiedergegeben.
