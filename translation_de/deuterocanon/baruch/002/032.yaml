  language: en
  yaml_path: translation/deuterocanon/baruch/002/032.yaml
  text: and they will praise me in the land of their exile[a], and they will remember my name[b];
translation:
  language: de
  text: Und sie werden mich im Land ihrer Verbannung[a] preisen und sich an meinen Namen[b] erinnern;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Land ihrer Verschleppung“. Das griechische Wort kann sowohl die Wegführung als auch die Ansiedlung fern der Heimat bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Mein Name“ ist eine biblische Ausdrucksweise, die Gottes offenbarte Identität und Ehre mit einschließen kann.
    reason: theological_idiom
lexical_decisions:
- source_word: αἰνέσουσίν
  choice: sie werden … preisen
  rationale: Das Futur Aktiv von αἰνέω bezeichnet ausdrückliches Lob. „Preisen“ gibt den gottesdienstlichen Sinn natürlich und würdig wieder.
- source_word: ἐν γῇ
  choice: im Land
  rationale: ἐν mit γῇ ist lokal zu verstehen. Trotz des fehlenden Artikels ist im Deutschen wegen der näheren Bestimmung durch den Genitiv „im Land“ idiomatisch.
- source_word: ἀποικισμοῦ αὐτῶν
  choice: ihrer Verbannung
  rationale: ἀποικισμός kann die Wegführung und das Leben fern der Heimat bezeichnen. Im Zusammenhang des erzwungenen Aufenthalts unter fremden Völkern trifft „Verbannung“ den Sinn; „Verschleppung“ bleibt als engere Alternative möglich.
- source_word: μνησθήσονται
  choice: sie werden sich … erinnern
  rationale: Das Futur Medium von μιμνῄσκομαι wird im Deutschen natürlich mit dem reflexiven Verb „sich erinnern“ wiedergegeben.
- source_word: τοῦ ὀνόματός μου
  choice: an meinen Namen
  rationale: Das Verb verlangt in natürlichem Deutsch „sich an etwas erinnern“. „Mein Name“ bewahrt die biblische Ausdrucksweise und ihre Bedeutungsoffenheit.
theological_decisions:
- issue: Bedeutung von „mein Name“ im Bundeszusammenhang
  choice: Die Wendung „mein Name“ wird wörtlich beibehalten.
  alternative: „wer ich bin“ oder „mein Ansehen“
  rationale: Der Name kann Gottes offenbarte Identität und Ehre umfassen. Eine erklärende Paraphrase würde diese theologische Bedeutungsfülle unnötig festlegen.
- issue: Bedeutung von ἀποικισμός im Zusammenhang von Gericht und Wiederherstellung
  choice: „Verbannung“
  alternative: „Verschleppung“ oder „Ansiedlung in der Fremde“
  rationale: „Verbannung“ bringt den erzwungenen Aufenthalt fern der Heimat zum Ausdruck, ohne den Begriff ausschließlich auf den Vorgang der Deportation einzuengen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Der Satzbau folgt der parallelen Struktur des Griechischen; „Verbannung“ ist verständlich und kontextgerecht, während die Fußnote die lexikalische Spannweite wahrt.
