base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/018.yaml
  text: But the soul that is grieved over its great misery[a], that goes about bent over and weak, and the eyes that are failing and the soul that is hungry—these will give you glory and righteousness[b], O Lord.
translation:
  language: de
  text: Doch seine Seele, die über das Ausmaß ihres Elends betrübt ist[a], die gebeugt und kraftlos dahingeht, dazu die versagenden Augen und die hungernde Seele – sie werden dir Ehre erweisen und deine Gerechtigkeit anerkennen, Herr.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „über das Ausmaß“ oder „über die Größe“. „Ihres Elends“ ist aus dem Zusammenhang ergänzt; die griechische Wendung ist stark verkürzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „werden dir Ehre und Gerechtigkeit geben“. Die Wendung kann ausdrücken, dass Gottes Gerechtigkeit anerkannt wird. Für „Gerechtigkeit“ ist auch „Recht“ möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: seine Seele
  rationale: ψυχή wird im poetischen Klagezusammenhang mit „Seele“ wiedergegeben; αὐτοῦ bleibt als Possessivpronomen erhalten und knüpft an die zuvor betrachtete leidende Person an.
- source_word: ἡ λυπουμένη
  choice: die … betrübt ist
  rationale: Das Präsenspartizip bezeichnet anhaltenden Kummer oder innere Bedrängnis. „Betrübt“ ist würdig, verständlich und nicht unnötig verstärkend.
- source_word: ἐπὶ τὸ μέγεθος
  choice: über das Ausmaß ihres Elends
  rationale: Die griechische Wendung ist elliptisch. Der Zusammenhang mit Gebeugtheit, Schwäche, versagenden Augen und Hunger legt nahe, dass das Ausmaß der Not gemeint ist; die Ergänzung wird durch eine Fußnote kenntlich gemacht.
- source_word: βαδίζει
  choice: dahingeht
  rationale: Das Verb beschreibt ein fortdauerndes Gehen; „dahingeht“ verbindet sich im Deutschen natürlich mit dem folgenden körperlichen Zustand.
- source_word: κύπτον
  choice: gebeugt
  rationale: Das Partizip zeichnet eine nach vorn gebeugte, niedergedrückte Haltung und lässt zugleich die übertragene Wirkung der Not anklingen.
- source_word: ἀσθενοῦν
  choice: kraftlos
  rationale: Der Ausdruck kann Schwäche oder Krankheit bezeichnen. „Kraftlos“ passt zur Erschöpfung des Zusammenhangs, ohne eine bestimmte Krankheit vorauszusetzen.
- source_word: οἱ ὀφθαλμοὶ οἱ ἐκλείποντες
  choice: die versagenden Augen
  rationale: ἐκλείπω bezeichnet hier das Nachlassen oder Versagen infolge von Entkräftung. Die substantivische Partizipialfügung bleibt knapp erhalten.
- source_word: ἡ ψυχὴ ἡ πεινῶσα
  choice: die hungernde Seele
  rationale: Die Wiederholung von ψυχή und die poetische Personifikation werden bewahrt; „hungernd“ gibt den fortdauernden Zustand wieder.
- source_word: δώσουσίν σοι δόξαν
  choice: sie werden dir Ehre … geben
  rationale: Die direkte Konstruktion des Griechischen bleibt erhalten. „Ehre geben“ ist im Deutschen natürlicher als „Herrlichkeit geben“ und bezeichnet die Anerkennung Gottes.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die Breite von δικαιοσύνη, einschließlich moralischer Richtigkeit und gerechten Handelns, ohne den Gebetskontext einseitig festzulegen.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ ist die übliche und angemessene deutsche Wiedergabe der göttlichen Anrede.
theological_decisions:
- issue: Bedeutung von δικαιοσύνην in der an Gott gerichteten Aussage
  choice: Gerechtigkeit
  alternative: 'Recht; oder sinngemäß: deine Gerechtigkeit bekennen'
  rationale: Die direkte Formulierung „Gerechtigkeit geben“ ist im Deutschen ungewöhnlich, bewahrt aber die Spannung der griechischen Konstruktion. Gemeint sein kann, Gott als gerecht anzuerkennen; die Übersetzung legt diese Deutung im Haupttext nicht ausdrücklich fest.
- issue: Bezug der elliptischen Wendung ἐπὶ τὸ μέγεθος
  choice: Ausmaß ihres Elends
  alternative: die Größe bzw. das Ausmaß, ohne ausdrückliche Ergänzung
  rationale: Der unmittelbare Zusammenhang spricht von Schwäche, versagenden Augen und Hunger. Deshalb ist Elend beziehungsweise Not wahrscheinlich mitgedacht; da das Substantiv nicht ausdrücklich im Griechischen steht, wird die Ergänzung in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Gebetssprache mit klarer poetischer Reihung. Der Gedankenstrich macht den zusammenfassenden Plural „sie werden“ nach den drei Subjekten verständlich. Die ungewöhnliche Verbindung „Gerechtigkeit geben“ bleibt bewusst nahe am Griechischen und wird in der Fußnote erläutert.
