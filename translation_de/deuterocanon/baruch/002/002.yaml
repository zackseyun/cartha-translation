lexical_decisions:
- source_word: οὐκ ἐποιήθη ὑποκάτω παντὸς τοῦ οὐρανοῦ
  choice: Nirgendwo unter dem ganzen Himmel war je etwas geschehen
  rationale: Die unpersönliche Passivform wird im Deutschen natürlich wiedergegeben; „nirgendwo“ bringt die Reichweite von ὑποκάτω παντὸς τοῦ οὐρανοῦ idiomatisch zum Ausdruck, und „je“ verdeutlicht den im Kontext liegenden Vergleich ohne dessen Inhalt vorwegzunehmen.
- source_word: καθὰ ἐποίησεν ἐν Ἰερουσαλήμ
  choice: wie das, was er in Jerusalem tat
  rationale: Bewahrt den Wechsel vom unpersönlichen Passiv zum aktiven Singular „er tat“ und lässt den im Vers nicht ausdrücklich genannten Handelnden unbestimmt.
- source_word: κατὰ τὰ γεγραμμένα
  choice: entsprechend dem, was ... geschrieben steht
  rationale: Gibt κατά als Übereinstimmung mit dem schriftlich Festgehaltenen wieder und wahrt den perfektischen Sinn von γεγραμμένα.
- source_word: ἐν τῷ νόμῳ Μωυσῆ
  choice: im Gesetz des Mose
  rationale: Übliche, präzise deutsche Wiedergabe des griechischen Genitivattributs.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von ἐποίησεν
  choice: „er“ bleibt ohne ergänzende Benennung stehen
  alternative: „Gott“ oder „der Herr“ ausdrücklich einsetzen
  rationale: Der griechische Vers nennt das Subjekt nicht. Eine Benennung würde eine aus dem Kontext erschlossene Deutung in den Text eintragen.
- issue: Art des Geschehens in Jerusalem
  choice: 'Das Objekt bleibt allgemein: „das, was er ... tat“'
  alternative: Das Geschehen als „Unheil“, „Strafe“ oder „Gericht“ konkretisieren
  rationale: Solche Begriffe mögen aus dem Zusammenhang erschließbar sein, stehen aber nicht ausdrücklich in diesem Vers; die Spannung wird daher bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt trägt dem syntaktischen Anschluss an den folgenden Vers Rechnung; der Vers ist im Griechischen kein abgeschlossener Satz.
