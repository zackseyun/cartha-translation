base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/029.yaml
  text: If you do not listen to my voice[b][a], surely this great and vast multitude will be reduced to a few among the nations where I will scatter them there.
translation:
  language: de
  text: Wenn ihr nicht auf meine Stimme hört, wird diese große, zahlreiche Menge[a] gewiss auf wenige zusammenschrumpfen, dort unter den Völkern, wo ich sie zerstreuen werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »Menge« wiedergegebene griechische Wort kann wörtlich »Summen«, »Brausen« oder »Getöse« bedeuten. Im Zusammenhang bezeichnet es bildhaft die große Menschenmenge, die auf wenige zusammenschrumpft.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν μὴ ἀκούσητε τῆς φωνῆς μου
  choice: Wenn ihr nicht auf meine Stimme hört
  rationale: ἀκούω mit dem Genitiv von »Stimme« bezeichnet hier nicht bloß akustisches Hören, sondern ein Hören, das Gehorsam einschließt. Die direkte Wendung bewahrt zugleich das Bild der göttlichen Stimme.
- source_word: εἰ μὴν
  choice: gewiss
  rationale: Die Partikelverbindung bekräftigt die angedrohte Folge mit feierlicher Sicherheit.
- source_word: ἡ βόμβησις
  choice: Menge
  rationale: βόμβησις bezeichnet wörtlich ein Summen, Brausen oder Getöse. Im Zusammenhang steht es metonymisch für die geräuschvolle Menschenmenge, da diese anschließend auf wenige vermindert wird.
- source_word: ἡ μεγάλη ἡ πολλὴ αὕτη
  choice: diese große, zahlreiche Menge
  rationale: Die beiden Attribute betonen Umfang und Zahl. »Große, zahlreiche Menge« gibt diese doppelte Verstärkung in natürlichem Deutsch wieder.
- source_word: ἀποστρέψει εἰς μικρὰν
  choice: wird auf wenige zusammenschrumpfen
  rationale: Die griechische Formulierung ist gedrängt und bezeichnet den Übergang von einer großen zu einer kleinen Zahl. Das intransitive »zusammenschrumpfen« entspricht dabei der aktiven Verbform besser als ein deutsches Passiv.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: Gemeint sind die fremden Völker, unter denen Israel zerstreut wird. »Völker« vermeidet die stärker theologisch geprägte Wiedergabe »Heiden«.
- source_word: οὗ διασπερῶ αὐτοὺς ἐκεῖ
  choice: wohin ich sie zerstreuen werde
  rationale: Das Deutsche fasst die doppelte Ortsangabe οὗ … ἐκεῖ idiomatisch in »wohin« zusammen; eine wörtliche Verdoppelung (»wohin … dorthin«) wäre hier schwerfällig.
theological_decisions:
- issue: Göttliche Warnung und Folge der Zerstreuung
  choice: Die Aussage wird als sichere Androhung einer zahlenmäßigen Verringerung unter den Völkern wiedergegeben.
  alternative: βόμβησις wörtlich als »Getöse« verstehen und die Aussage auf das Verstummen eines Geräusches beziehen.
  rationale: Die Gegenüberstellung der großen beziehungsweise zahlreichen Größe mit »wenigen« weist im unmittelbaren Satzbau auf eine Menschenmenge. Zusätzliche dogmatische Begriffe wie »Bundesfluch« oder »Strafgericht« werden nicht in den Text eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt feierlich und direkt, vermeidet aber eine im Deutschen unnatürliche Verdoppelung der Ortsangabe. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Gedanken, den er erläutert.
