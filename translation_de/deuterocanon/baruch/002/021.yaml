base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/021.yaml
  text: 'Thus says the Lord: Bow your shoulder and serve the king of Babylon[c][b][a], and dwell on the land that I gave to your fathers.'
translation:
  language: de
  text: 'So spricht der Herr: Beugt eure Schulter[a] und dient dem König von Babylon; wohnt in dem Land[b], das ich euren Vätern[c] gegeben habe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Senkt eure Schulter.“ Gemeint ist, dass sie sich dem auferlegten Dienst unterwerfen sollen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Lasst euch in dem Land nieder“ beziehungsweise „Bleibt in dem Land“. Wörtlich steht im Griechischen „setzt euch“; hier ist damit das Wohnen oder Bleiben gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „euren Vorfahren“. Im Griechischen steht wörtlich „euren Vätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως εἶπεν
  choice: So spricht
  rationale: Obwohl εἶπεν im Aorist steht, wird die feste prophetische Redeformel im Deutschen idiomatisch im Präsens wiedergegeben; so bleibt der Charakter einer gegenwärtig maßgeblichen göttlichen Erklärung erhalten.
- source_word: Κύριος
  choice: der Herr
  rationale: Die übliche und natürliche deutsche Wiedergabe von κύριος in der Einleitung einer Gottesrede.
- source_word: Κλίνατε τὸν ὦμον ὑμῶν
  choice: Beugt eure Schulter
  rationale: Die konkrete Schultermetapher des griechischen Textes bleibt erhalten und bezeichnet die Unterwerfung unter auferlegten Dienst.
- source_word: ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος
  choice: dient dem König von Babylon
  rationale: ἐργάζομαι kann arbeiten oder tätig sein bedeuten; mit dem Dativ des Königs bezeichnet es hier den Dienst für ihn. „Dient“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: καθίσατε ἐπὶ τὴν γῆν
  choice: wohnt in dem Land
  rationale: καθίζω bedeutet wörtlich „sitzen“, bezeichnet hier aber idiomatisch das Wohnen, Sichniederlassen oder Bleiben im Land. „Wohnt“ ist natürlich und wahrt den Zusammenhang.
- source_word: ἣν δέδωκα
  choice: das ich ... gegeben habe
  rationale: Das deutsche Perfekt bildet den griechischen Perfekt angemessen ab und hebt die fortdauernde Bedeutung der vollzogenen Gabe hervor.
- source_word: τοῖς πατράσιν ὑμῶν
  choice: euren Vätern
  rationale: Die ausdrücklich maskuline Verwandtschaftsbezeichnung πατέρες wird formal genau wiedergegeben; „Vorfahren“ bleibt als verständliche Bedeutungsalternative in der Fußnote.
theological_decisions:
- issue: Wiedergabe von κύριος in der prophetischen Gottesrede
  choice: der Herr
  alternative: Herr
  rationale: Der bestimmte Artikel entspricht der natürlichen deutschen Redeformel „So spricht der Herr“ und führt keine zusätzliche konfessionelle Deutung ein.
- issue: Geschlechtsspezifische Ahnenbezeichnung πατέρες
  choice: euren Vätern
  alternative: euren Vorfahren
  rationale: „Vätern“ bewahrt die Form des griechischen Ausdrucks, während die mögliche kollektive Bedeutung nicht stillschweigend verengt, sondern in der Fußnote kenntlich gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Schultermetapher wird quellennah bewahrt und erläutert; das wörtliche „sitzen“ wird wegen seiner idiomatischen Wohnbedeutung natürlich als „wohnen“ wiedergegeben.
