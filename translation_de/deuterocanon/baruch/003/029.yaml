lexical_decisions:
- source_word: τίς
  choice: Wer
  rationale: Leitet die rhetorische Frage knapp und natürlich ein.
- source_word: ἀνέβη εἰς τὸν οὐρανόν
  choice: ist zum Himmel hinaufgestiegen
  rationale: Gibt die konkrete Aufwärtsbewegung und εἰς idiomatisch wieder; „Himmel“ passt zum Weisheitskontext besser als „Firmament“ oder „Luftraum“.
- source_word: ἔλαβεν αὐτήν
  choice: hat sie ergriffen
  rationale: Bewahrt den direkten Sinn von λαμβάνω und den femininen Rückbezug auf die personifizierte Weisheit; „erlangt“ wäre stärker deutend.
- source_word: κατεβίβασεν αὐτὴν
  choice: hat sie herabgebracht
  rationale: Bewahrt den kausativen Sinn des Verbs und die räumliche Perspektive der Frage.
- source_word: ἐκ τῶν νεφελῶν
  choice: aus den Wolken
  rationale: Gibt ἐκ und den Plural νεφελῶν unmittelbar und bildhaft wieder.
theological_decisions:
- issue: Genus des Pronomens mit Bezug auf die Weisheit
  choice: αὐτήν wird mit „sie“ wiedergegeben.
  alternative: Das abstrakte Substantiv durch „sie“ ohne personifizierende Erläuterung oder sinngemäß durch „die Weisheit“ wiedergeben.
  rationale: Das griechische feminine Pronomen greift die im Kontext weiblich personifizierte Weisheit auf. Die Übersetzung wahrt diese literarische und theologische Textgestalt, ohne ihre Identität weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Perfekt klingt in der rhetorischen Frage natürlich; „ergriffen“ bleibt konkret und vermeidet die interpretative Festlegung von „erlangt“.
