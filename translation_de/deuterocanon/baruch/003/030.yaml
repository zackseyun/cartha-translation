base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/030.yaml
  text: Who has crossed beyond the sea and found her[a], and will bring her for choice gold?
translation:
  language: de
  text: Wer ist über das Meer hinübergegangen, hat sie gefunden und wird sie für erlesenes Gold bringen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς
  choice: Wer
  rationale: Leitet eine rhetorische Frage ein, die hervorhebt, dass Weisheit nicht durch menschliche Anstrengung erlangt werden kann.
- source_word: διέβη πέραν τῆς θαλάσσης
  choice: hat das Meer überquert
  rationale: Gibt den vollendeten Vorgang des Hinübergehens auf die andere Seite natürlich und präzise wieder.
- source_word: εὗρεν αὐτήν
  choice: sie gefunden
  rationale: Das feminine Pronomen bezieht sich im Zusammenhang auf die personifizierte Weisheit; im Deutschen lässt sich diese Übereinstimmung unmittelbar bewahren.
- source_word: οἴσει αὐτὴν
  choice: wird sie herbringen
  rationale: Bewahrt das Futur und den Grundsinn von φέρω als bringen. „Herbringen“ drückt die im Kontext vorausgesetzte Bewegung zum Fragenden hin aus, ohne ausdrücklich ein im Griechischen nicht genanntes „zurück“ einzufügen.
- source_word: χρυσίου ἐκλεκτοῦ
  choice: für erlesenes Gold
  rationale: „Erlesen“ gibt die besondere Qualität des Goldes wieder; „für“ bewahrt die wahrscheinlich preis- oder tauschbezogene, aber knappe Ausdrucksweise des Genitivs.
theological_decisions:
- issue: Personifikation der Weisheit im Pronomen αὐτήν
  choice: Das feminine Pronomen „sie“ beibehalten
  alternative: Unpersönlich „es“ verwenden
  rationale: Da „Weisheit“ auch im Deutschen feminin ist, bleibt die Personifikation des griechischen Textes natürlich erhalten, ohne sie über den Kontext hinaus dogmatisch auszudeuten.
translation_notes:
  register: Würdevolles, modernes Standarddeutsch. Die doppelte Formulierung mit „wer“ macht die koordinierte rhetorische Frage im Deutschen klar, ohne ihren Sinn zu verändern.
