lexical_decisions:
- source_word: τῇ ὁδῷ τοῦ θεοῦ
  choice: auf Gottes Weg
  rationale: Bewahrt das Bild des Weges als Lebensführung. Die Präposition „auf“ ist im Deutschen bei „Weg“ idiomatisch, und der Genitiv wird natürlich als „Gottes Weg“ wiedergegeben.
- source_word: εἰ ἐπορεύθης
  choice: Wärst du … gegangen
  rationale: Der Aorist Indikativ mit εἰ bildet zusammen mit ἄν im Folgesatz eine irreale Bedingung der Vergangenheit. Der deutsche Konjunktiv II der Vergangenheit gibt dies klar und natürlich wieder.
- source_word: κατῴκεις ἂν
  choice: hättest du … gelebt
  rationale: κατοικέω bezeichnet dauerhaftes Wohnen oder Leben an einem Ort beziehungsweise in einem Zustand. „Gelebt“ ist hier natürlicher als „gewohnt“, da der Aufenthaltsort metaphorisch als Frieden bezeichnet wird.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: Die substantivische Form bleibt erhalten und bezeichnet Frieden als dauerhaften Zustand.
- source_word: τὸν αἰῶνα
  choice: für immer
  rationale: Der adverbiale Akkusativ drückt unbegrenzte Dauer aus; „für immer“ ist die natürliche moderne deutsche Entsprechung.
theological_decisions:
- issue: Irreale Bedingung der Vergangenheit
  choice: „Wärst du … gegangen, hättest du … gelebt“
  alternative: „Wenn du … gehst, wirst du … leben“
  rationale: Die griechische Konstruktion blickt klagend auf eine nicht erfüllte Möglichkeit zurück und formuliert keine allgemeine oder zukünftige Verheißung.
- issue: Metapher von Gottes Weg
  choice: Das Wegbild wird beibehalten.
  alternative: „Hättest du Gottes Gebote befolgt“ oder „Hättest du Gott gehorcht“
  rationale: Der Ausgangstext spricht weiter und bildhafter vom „Weg Gottes“. Eine Auflösung in Gesetz oder Gehorsam würde die Aussage unnötig verengen.
- issue: Bedeutung von κατοικέω im Frieden
  choice: „in Frieden gelebt“
  alternative: „in Frieden gewohnt“
  rationale: „Gelebt“ bewahrt den Sinn eines dauerhaften Verweilens, ohne im Deutschen den missverständlichen Eindruck zu erwecken, Frieden sei ein räumlicher Wohnort.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe irreale Konditionalform ist natürlich und erhält zugleich das biblische Wegmotiv sowie die Spannung des unerfüllten Rückblicks.
