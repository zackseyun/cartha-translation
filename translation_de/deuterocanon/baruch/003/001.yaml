lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: Herr, Allmächtiger
  rationale: Die vokativische Gottesbezeichnung wird in natürlicher, würdevoller Gebetssprache wiedergegeben; „Allmächtiger“ ist die etablierte Entsprechung für Παντοκράτωρ.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Gott Israels
  rationale: Bewahrt den appositionellen Titel und seinen bundesgeschichtlichen Bezug ohne einen im Deutschen hier unnötigen Artikel.
- source_word: ψυχὴ ἐν στενοῖς
  choice: eine Seele in Bedrängnis
  rationale: „Seele“ erhält das anthropologische und poetische Register von ψυχή; „in Bedrängnis“ gibt die bildhafte Enge von ἐν στενοῖς idiomatisch wieder.
- source_word: πνεῦμα ἀκηδιῶν
  choice: ein verzagter Geist
  rationale: „Geist“ wahrt die Parallele zu „Seele“; „verzagt“ bezeichnet Mutlosigkeit und innere Erschöpfung, ohne einen klinischen Sinn einzutragen.
- source_word: κέκραγεν πρὸς σέ
  choice: haben zu dir geschrien
  rationale: Das Perfekt κέκραγεν bezeichnet einen erfolgten Ruf mit fortwirkender Bedeutung. Das deutsche Perfekt bildet dies gut ab; der Plural folgt der natürlichen deutschen Auffassung der beiden koordinierten Ausdrücke.
theological_decisions:
- issue: Anthropologische Paarung von ψυχή und πνεῦμα
  choice: Beide Begriffe werden unterschieden als „Seele“ und „Geist“ wiedergegeben.
  alternative: Die Paarung zu „Herz und Sinn“ zusammenziehen oder ψυχή als „Mensch“ wiedergeben.
  rationale: Die Unterscheidung bewahrt die poetische und theologische Spannung des griechischen Textes, ohne daraus eine festgelegte Anthropologie abzuleiten.
- issue: Numerus des Prädikats κέκραγεν
  choice: Deutscher Plural „haben ... geschrien“ bei zwei mit „und“ verbundenen Ausdrücken.
  alternative: Singular „hat ... geschrien“ entsprechend der griechischen Verbform.
  rationale: Das griechische Singularprädikat kann die parallelen Bezeichnungen als zusammengehörigen inneren Menschen auffassen. Im modernen Deutschen klingt bei zwei ausdrücklich genannten Subjekten der Plural natürlicher; die semantische Einheit bleibt durch den Parallelismus erkennbar und wird in der Fußnote dokumentiert.
translation_notes:
  register: Moderne standarddeutsche Gebetssprache mit würdigem, leicht poetischem Ton. Die Anrede bleibt knapp und feierlich; „Seele“ und „Geist“ werden als unterscheidbare Parallelbegriffe bewahrt.
