  text: 'Herr, allmächtiger Gott Israels: Eine Seele in Bedrängnis und ein mutloser Geist haben zu dir geschrien.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Seele in Nöten und ein mutloser Geist haben zu dir geschrien.“ Das griechische Verb steht im Singular und kann „Seele“ und „Geist“ als eng zusammengehörig auffassen; im Deutschen ist bei den beiden verbundenen Substantiven der Plural natürlich. Die Ausdrücke können auch schwere Bedrängnis und Niedergeschlagenheit bezeichnen.'
