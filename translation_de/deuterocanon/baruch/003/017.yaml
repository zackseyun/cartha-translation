base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/017.yaml
  text: those who make sport with the birds of the sky[a], and who store up silver and gold, in which people trusted, and there is no end to their possessions.
translation:
  language: de
  text: die mit den Vögeln des Himmels ihr Spiel treiben[a] und Silber und Gold anhäufen, worauf Menschen vertrauten, und deren Besitz kein Ende hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die unter den Vögeln des Himmels spielen“; das griechische Wort kann allgemein spielerische oder sportliche Betätigung bezeichnen und muss nicht „verspotten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαίζοντες
  choice: ihr Spiel treiben
  rationale: Die Wendung wahrt den Grundsinn spielerischer oder sportlicher Betätigung, ohne die im Kontext mögliche Bedeutung von Jagd oder Spott vorschnell festzulegen.
- source_word: ὀρνέοις τοῦ οὐρανοῦ
  choice: mit den Vögeln des Himmels
  rationale: Eine formnahe, verständliche Wiedergabe, die den für die LXX typischen Ausdruck bewahrt.
- source_word: θησαυρίζοντες
  choice: anhäufen
  rationale: Bezeichnet hier das Ansammeln materieller Reichtümer und klingt im modernen Deutschen natürlich.
- source_word: ἀργύριον … χρυσίον
  choice: Silber und Gold
  rationale: Die Verbindung beider Edelmetalle spricht für die konkrete Wiedergabe statt für das allgemeinere „Geld“.
- source_word: ᾧ ἐπεποίθεισαν ἄνθρωποι
  choice: auf die Menschen vertrauten
  rationale: Der Singular des Relativpronomens nimmt den zusammengehörigen Reichtumskomplex auf; im Deutschen ist der pluralische Rückbezug auf „Silber und Gold“ natürlich. Der Aorist wird schlicht als Vergangenheit wiedergegeben.
- source_word: οὐκ ἔστιν τέλος τῆς κτήσεως αὐτῶν
  choice: deren Besitz kein Ende hat
  rationale: Gibt die Aussage knapp und idiomatisch wieder; κτῆσις kann sowohl Besitz als auch Erwerb bezeichnen.
theological_decisions:
- issue: Generisches ἄνθρωποι
  choice: Menschen
  alternative: Männer
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein. „Menschen“ ist im modernen Deutschen sachlich genau und vermeidet eine unbeabsichtigte Beschränkung auf männliche Personen.
- issue: Bezugswort von ᾧ
  choice: auf die [Silber und Gold]
  alternative: auf das [Gold]
  rationale: Die grammatisch singularische Form lässt einen engeren Bezug auf „Gold“ zu, kann aber sinngemäß den gesamten angehäuften Reichtum aufnehmen. Der Haupttext gibt den breiteren Zusammenhang wieder, ohne eine zusätzliche Deutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist als Fortsetzung eines vorausgehenden Satzes kleingeschrieben. Die ungewöhnliche Bildsprache und die Mehrdeutigkeit von ἐμπαίζοντες bleiben erhalten.
