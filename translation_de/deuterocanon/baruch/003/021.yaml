  source_fidelity: Der Entwurf gibt die beiden Verneinungen, das Wegbild und den schwierigen Schluss mit dem pluralischen Possessivpronomen grundsätzlich quellentreu wieder. Im Deutschen kann jedoch das zweite „sie“ unmittelbar nach „Pfade“ leicht auf die Pfade statt auf die im Kontext gemeinte Weisheit bezogen werden; das verdeckt die unterschiedliche Referenz der griechischen Pronomen.
  naturalness: „Gerieten weit weg von ihrem Weg“ ist verständlich, aber etwas sperrig. „Entfernten sich weit von ihrem Weg“ ist modernes, würdevolles Standarddeutsch und bewahrt die dynamische Aussage von ἐγενήθησαν, ohne den überlieferten possessiven Bezug zu glätten.
  terminology: „Pfade“, „Söhne“ und „Weg“ sind angemessen. Die ausdrückliche Nennung der Weisheit beim zweiten Verb klärt den im Griechischen durch das feminine Pronomen markierten Bezug und fügt keine theologische Deutung hinzu.
