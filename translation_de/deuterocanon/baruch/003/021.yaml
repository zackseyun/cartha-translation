base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/021.yaml
  text: Nor did they understand its paths[a], nor did they take hold of it; their sons became far from their way,
translation:
  language: de
  text: Auch verstanden sie ihre Pfade nicht und ergriffen die Weisheit nicht; ihre Söhne entfernten sich weit von ihrem Weg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Schluss lautet ungewöhnlich wörtlich: „Ihre Söhne wurden fern von ihrem Weg.“ Auch möglich ist: „Ihre Söhne gingen weit von dem Weg ab.“ Das überlieferte griechische Pronomen ist pluralisch („ihrem Weg“); sein Bezug bleibt im Text bewusst erhalten.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: verstanden
  rationale: Das Verb bezeichnet das Erfassen oder Verstehen. „Verstanden“ ist im modernen Deutsch klar und lässt die bildhafte Rede von den Pfaden der Weisheit bestehen.
- source_word: τρίβους
  choice: Pfade
  rationale: τρίβος bezeichnet einen Pfad oder ausgetretenen Weg. „Pfade“ bewahrt das Wegbild und unterscheidet sich zugleich angemessen von ὁδός im letzten Satzteil.
- source_word: ἀντελάβοντο
  choice: ergriffen
  rationale: Die mediale Form kann „ergreifen“ oder „sich bemächtigen“ bedeuten. „Ergriffen“ hält das Bild des Zugreifens auf die Weisheit fest, ohne es erklärend aufzulösen.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: ihre Söhne
  rationale: Der griechische Text nennt ausdrücklich die männliche Mehrzahl „Söhne“; daher wird nicht zu „Kinder“ verallgemeinert.
- source_word: πόρρω ἐγενήθησαν
  choice: gerieten weit weg
  rationale: Wörtlich steht etwa „wurden/gelangten fern“. „Gerieten weit weg“ gibt die eintretende Entfernung in verständlichem Deutsch wieder und glättet die ungewöhnliche Formulierung nicht vollständig.
- source_word: ἀπὸ τῆς ὁδοῦ αὐτῶν
  choice: von ihrem Weg
  rationale: Das überlieferte αὐτῶν ist ein Possessivpronomen im Plural und wird deshalb als „ihrem“ wiedergegeben. Die mögliche Unklarheit des Bezugs wird nicht durch eine Konjektur beseitigt.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Nachkommen
  choice: ihre Söhne
  alternative: ihre Kinder
  rationale: υἱοί ist ausdrücklich maskulin. Die quellengenaue Wiedergabe erfordert hier keine geschlechtsneutrale Verallgemeinerung.
- issue: Ungewöhnlicher letzter Satzteil bei ausgewiesenem Quellenkonflikt
  choice: ihre Söhne gerieten weit weg von ihrem Weg
  alternative: ihre Söhne entfernten sich weit von dem Weg
  rationale: Der bezeugte griechische Wortlaut bleibt maßgeblich. Die Übersetzung bewahrt deshalb sowohl das pluralische Possessivpronomen als auch die Vorstellung eines eingetretenen Fernseins, statt eine glattere Lesart in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Verneinung und das Wegbild des griechischen Textes bleiben erhalten; die syntaktische Unebenheit des Schlusses wird nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
