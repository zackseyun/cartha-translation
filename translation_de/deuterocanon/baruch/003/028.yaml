base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/028.yaml
  text: And they perished for lack of understanding[a]; they perished because of their own lack of counsel.
translation:
  language: de
  text: Und sie gingen zugrunde, weil ihnen Einsicht fehlte[a]; sie gingen zugrunde wegen ihres Mangels an Urteilsvermögen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: weil sie keine Besonnenheit hatten; sie gingen zugrunde wegen ihrer Unüberlegtheit.'
    reason: Die Begriffe φρόνησις und ἀβουλία können neben Einsicht und Urteilsvermögen auch praktische Besonnenheit beziehungsweise fehlende Überlegung bezeichnen.
lexical_decisions:
- source_word: ἀπώλοντο
  choice: sie gingen zugrunde
  rationale: Das mediale/passive Aoristverb bezeichnet hier Untergang oder Verderben, ohne eindeutig festzulegen, ob ein gewaltsames Vernichten oder ein allgemeineres Scheitern gemeint ist. „Gingen zugrunde“ bewahrt diese Offenheit und den ernsten Ton.
- source_word: παρὰ τὸ μὴ ἔχειν
  choice: weil ihnen … fehlte
  rationale: Die Konstruktion παρά mit substantiviertem Infinitiv hat kausale Bedeutung. Die deutsche Formulierung gibt diese Ursache natürlich und präzise wieder.
- source_word: φρόνησιν
  choice: Einsicht
  rationale: φρόνησις bezeichnet verständige, praktisch ausgerichtete Einsicht oder Besonnenheit. „Einsicht“ ist verständlich und bewahrt sowohl die gedankliche als auch die sittlich-praktische Dimension.
- source_word: διὰ τὴν ἀβουλίαν
  choice: wegen ihres Mangels an Urteilsvermögen
  rationale: ἀβουλία bezeichnet fehlende Beratung oder Überlegung und daraus folgend mangelhaftes Urteilsvermögen. Die Wiedergabe wahrt die zweite, auf vernünftiges Abwägen bezogene Ursache, ohne sie pauschal zu „Torheit“ zu verflachen.
- source_word: αὐτῶν
  choice: ihres
  rationale: Das Possessivpronomen wird ausdrücklich wiedergegeben. Ein verstärkendes „eigenen“ ist im Griechischen nicht eigens markiert und wird daher nicht hinzugefügt.
theological_decisions:
- issue: Ursache ihres Untergangs
  choice: Der Vers führt ihren Untergang auf fehlende Einsicht und mangelndes Urteilsvermögen zurück.
  alternative: Die Begriffe könnten stärker moralisch wertend als „Torheit“ oder „Unvernunft“ wiedergegeben werden.
  rationale: Der griechische Text bleibt bei Begriffen aus dem Bereich von Einsicht, Überlegung und Urteil. Die Übersetzung bewahrt diese Weisheitssprache, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „sie gingen zugrunde“ folgt der rhetorischen Wiederholung des griechischen Textes; das Semikolon bildet die eng verbundenen parallelen Aussagen ab.
