base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/008.yaml
  text: Behold[a], today we are in our exile, where you scattered us, for reproach and for a curse and for payment, according to all the wrongdoings of our fathers, who turned away from the Lord our God.
translation:
  language: de
  text: 'Sieh, heute sind wir in unserer Verbannung, wohin du uns zerstreut hast: zur Schmach, zum Fluch und zur Zahlungspflicht[a], entsprechend all dem Unrecht unserer Väter, die sich vom Herrn, unserem Gott, abgewandt haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „zur Strafe“ oder „zur Haftung“. Das griechische Wort bezeichnet eine geschuldete Leistung oder rechtliche Verpflichtung und kann im Zusammenhang des Gerichts auch die daraus folgende Strafe meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Der Aufmerksamkeitsruf wird mit einem würdevollen, noch heute verständlichen Ausdruck wiedergegeben.
- source_word: ἀποικίᾳ
  choice: Verbannung
  rationale: Im Zusammenhang bezeichnet das Wort den durch Wegführung entstandenen Zustand fern der Heimat; „Verbannung“ gibt dies prägnanter wieder als „Kolonie“.
- source_word: διέσπειρας
  choice: zerstreut hast
  rationale: Bewahrt das Bild der Verteilung unter fremde Völker und die direkte Anrede Gottes.
- source_word: ὀνειδισμὸν
  choice: Schmach
  rationale: Bezeichnet öffentliche Entehrung und das Dasein als Gegenstand des Spotts; „Schmach“ wahrt den würdevollen biblischen Ton.
- source_word: ἀρὰν
  choice: Fluch
  rationale: Direkte und semantisch klare Wiedergabe.
- source_word: ὄφλησιν
  choice: Schuldenlast
  rationale: Das seltene Wort bezeichnet eine eingegangene Schuld, Haftung oder daraus erwachsende Strafe. „Schuldenlast“ erhält den Grundgedanken einer geschuldeten Leistung, ohne ihn vorschnell auf bloße Bestrafung festzulegen.
- source_word: κατὰ πάσας τὰς ἀδικίας
  choice: entsprechend all dem Unrecht
  rationale: κατά bezeichnet hier Entsprechung oder Maß; die gegenwärtige Lage entspricht dem gesamten Unrecht der Vorfahren.
- source_word: ἀπέστησαν
  choice: sich … abgewandt haben
  rationale: Gibt die Loslösung von Gott klar wieder, ohne die stärker deutende Fachsprache „abgefallen“ oder „apostasieren“ aufzudrängen.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: vom Herrn, unserem Gott
  rationale: Natürliche deutsche Wiedergabe der Bundesbezeichnung; κύριος wird als „Herr“ übersetzt.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR; Gebieter
  rationale: In der auf Israels Gott bezogenen Bundesformel ist „Herr“ die natürliche und traditionsfähige Wiedergabe, ohne eine im griechischen Wortlaut nicht sichtbare Schreibweise einzuführen.
- issue: Deutung von ὄφλησιν im Gerichtszusammenhang
  choice: Schuldenlast
  alternative: Strafe; Haftung; Buße
  rationale: Der griechische Ausdruck umfasst Schuld, daraus entstehende Haftung und mögliche Strafleistung. Die gewählte Formulierung erhält diese Spannung; die Fußnote nennt die geläufigeren Deutungsmöglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die Zweck- beziehungsweise Ergebnisreihe des griechischen εἰς idiomatisch sichtbar. Das redundante οὗ … ἐκεῖ wird natürlich mit „wohin“ wiedergegeben; die Reihung von Schmach, Fluch und Schuldenlast bleibt erhalten.
