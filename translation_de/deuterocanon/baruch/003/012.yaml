  text: You abandoned the fountain of wisdom[a].
translation:
  language: de
  text: Du hast die Quelle der Weisheit verlassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Quell der Weisheit“ oder „den Ursprung der Weisheit“.'
    reason: Lexikalische Alternativen für πηγή, das sowohl die konkrete Wasserquelle als auch bildlich den Ursprung bezeichnen kann.
lexical_decisions:
- source_word: ἐγκατέλιπες
  choice: du hast … verlassen
  rationale: Der Aorist Aktiv Indikativ, 2. Person Singular, bezeichnet das Zurücklassen bzw. Verlassen. „Verlassen“ ist im modernen Deutsch natürlich und bewahrt hier den ernsten Vorwurf, ohne altertümlich zu wirken.
- source_word: πηγήν
  choice: Quelle
  rationale: πηγή bezeichnet eine Wasserquelle oder einen Quell. „Quelle“ erhält sowohl das konkrete Bild als auch die mögliche Bedeutung eines Ursprungs und ist im Deutschen idiomatischer als „Brunnen“.
- source_word: σοφίας
  choice: der Weisheit
  rationale: σοφία wird standardmäßig mit „Weisheit“ wiedergegeben. Obwohl der Kontext auf göttliche Weisheit weist, wird der Ausdruck nicht interpretierend erweitert.
theological_decisions:
- issue: Bildsprache in „Quelle der Weisheit“
  choice: Das konkrete Quellenbild wird unmittelbar beibehalten.
  alternative: der Ursprung der Weisheit
  rationale: πηγή ist ein anschauliches Bild aus der Wasserwelt. „Quelle der Weisheit“ bewahrt diese poetische und theologische Bildkraft, ohne die Quelle ausdrücklich mit Gott gleichzusetzen oder die Metapher abstrakt aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzgestalt und der direkte Vorwurf in der 2. Person Singular bleiben erhalten.
