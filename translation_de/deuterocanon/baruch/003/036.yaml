base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/036.yaml
  text: This is our God[a]; no other will be reckoned beside him.
translation:
  language: de
  text: Dieser ist unser Gott; kein anderer wird ihm gleichgerechnet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kein anderer wird im Vergleich mit ihm gerechnet werden.“'
    reason: Lexikalische Alternative für λογισθήσεται und πρὸς αὐτόν; sie bildet die vergleichende Konstruktion des Griechischen wörtlicher ab, klingt im Deutschen jedoch weniger idiomatisch.
lexical_decisions:
- source_word: οὗτος
  choice: Dieser ist
  rationale: Das Demonstrativpronomen steht prädikativ zu „unser Gott“. „Dieser ist“ bewahrt den nachdrücklichen Hinweischarakter des Griechischen und klingt in diesem feierlichen Zusammenhang natürlich.
- source_word: ὁ θεὸς ἡμῶν
  choice: unser Gott
  rationale: Die Possessivkonstruktion wird direkt und idiomatisch wiedergegeben.
- source_word: οὐ λογισθήσεται
  choice: wird … gelten
  rationale: Das Futur Passiv von λογίζομαι bezeichnet hier, dass jemand als vergleichbar gerechnet oder angesehen wird. „Gelten“ gibt dies in natürlichem Deutsch wieder, ohne die Aussage zu einer bloßen Existenzbehauptung umzudeuten.
- source_word: ἕτερος
  choice: kein anderer
  rationale: In Verbindung mit der Verneinung drückt ἕτερος aus, dass kein anderer neben Gott in Betracht kommt.
- source_word: πρὸς αὐτόν
  choice: neben ihm
  rationale: πρός bezeichnet hier Beziehung beziehungsweise Vergleich. „Neben ihm“ bewahrt die knappe Bildlichkeit und den exklusiven Sinn der Aussage.
theological_decisions:
- issue: Aussage von Gottes Einzigkeit im vergleichenden Satzteil
  choice: neben ihm wird kein anderer gelten
  alternative: kein anderer wird im Vergleich mit ihm gerechnet werden
  rationale: Die Übersetzung bewahrt die vergleichende und passive Ausrichtung der griechischen Aussage, ohne sie erläuternd zu „Es gibt keinen anderen Gott“ auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dieser ist“ erhält den feierlich-nachdrücklichen Ton; „gelten“ vermeidet sowohl altertümliche Schwerfälligkeit als auch eine überdeutende dogmatische Paraphrase.
