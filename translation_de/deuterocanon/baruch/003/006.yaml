translation:
  language: de
  text: Denn du bist der Herr, unser Gott, und wir werden dich preisen, Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet im Gebetszusammenhang die vorausgehende Bitte; „Denn“ gibt diese rückbezügliche Begründung natürlich wieder.
- source_word: σὺ
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen trägt Nachdruck und bleibt im Deutschen erhalten.
- source_word: Κύριος
  choice: der Herr
  rationale: Als göttlicher Titel wird κύριος kontextgemäß mit „Herr“ wiedergegeben; der Artikel ist für das deutsche Prädikatsnomen natürlich.
- source_word: ὁ θεὸς ἡμῶν
  choice: unser Gott
  rationale: Dies ist die idiomatische deutsche Wiedergabe der griechischen Nominalgruppe mit Possessivbezug.
- source_word: αἰνέσομέν
  choice: wir werden preisen
  rationale: Der Futur-Indikativ wird als Zukunftsaussage bewahrt und nicht in eine Aufforderung umgedeutet.
- source_word: σε
  choice: dich
  rationale: Das Akkusativpronomen bezeichnet Gott als direktes Objekt des Preisens.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ wird durch die direkte Anrede nach dem Komma deutlich; ein zusätzliches „o“ wäre im modernen Standarddeutsch feierlicher, aber weniger natürlich.
theological_decisions:
- issue: Wiedergabe von κύριος als Gottesbezeichnung und Anrede
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte und kontextgerechte Wiedergabe des göttlichen Titels, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung von „Herr“ bleibt entsprechend dem griechischen Titel und Vokativ erhalten; die Zukunftsform drückt eine Zusage beziehungsweise Erwartung aus, keine Aufforderung.
