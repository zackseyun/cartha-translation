base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/020.yaml
  text: The younger men saw the light and lived on the earth[b][a], but they did not know the way of knowledge.
translation:
  language: de
  text: Die Jüngeren[a] sahen das Licht[b] und lebten auf der Erde, doch den Weg der Erkenntnis kannten sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die jüngeren Männer“ beziehungsweise „die jüngeren Leute“. Das griechische Wort steht im Maskulinum Plural.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen „sahen Licht“. Die Wendung kann sinngemäß bedeuten, dass sie lebten oder das Leben erfuhren.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτεροι
  choice: die Jüngeren
  rationale: Der substantivierte Komparativ bezeichnet jüngere Menschen im Gegensatz zu früheren Generationen. „Die Jüngeren“ gibt die Vergleichsbedeutung natürlich wieder; die grammatisch maskuline Form des Griechischen wird in einer Fußnote kenntlich gemacht.
- source_word: εἶδον φῶς
  choice: sahen das Licht
  rationale: Die konkrete Lichtmetapher bleibt erhalten. Die im Deutschen geläufige Wendung ist verständlich und kann wie das Griechische zugleich auf das Leben beziehungsweise Lebendigsein hinweisen, ohne diese Deutung im Haupttext festzuschreiben.
- source_word: κατῴκησαν ἐπὶ τῆς γῆς
  choice: lebten auf der Erde
  rationale: κατοικέω bezeichnet hier das Wohnen oder Leben, γῆ im Zusammenhang die Erde. Die Formulierung ist modern und natürlich, ohne den Sinn auf ein bestimmtes Land einzuengen.
- source_word: ὁδὸν
  choice: den Weg
  rationale: „Weg“ bewahrt die Metapher für einen Zugang oder eine Lebensrichtung. Trotz des fehlenden Artikels im Griechischen bildet die Genitivverbindung eine bestimmte begriffliche Einheit.
- source_word: ἐπιστήμης
  choice: der Erkenntnis
  rationale: ἐπιστήμη bezeichnet Wissen, Einsicht oder Erkenntnis. „Erkenntnis“ passt zum Weisheitszusammenhang und bezeichnet mehr als bloßen Informationsbesitz, ohne eine zusätzliche Lehraussage einzutragen.
- source_word: οὐκ ἔγνωσαν
  choice: kannten sie nicht
  rationale: Die deutsche Verbwahl verbindet sich idiomatisch mit „den Weg“ und gibt das schlichte Nichtkennen des griechischen Aorists wieder, ohne ein Versäumnis des Lernens oder Erkennens hinzuzufügen.
theological_decisions:
- issue: Bedeutung der Wendung „Licht sehen“ im Weisheitszusammenhang
  choice: Die konkrete Wendung „sahen das Licht“ bleibt im Haupttext erhalten.
  alternative: „waren am Leben“ oder „genossen das Leben“
  rationale: Die Aussage kann idiomatisch auf Lebendigsein oder Lebenserfahrung hinweisen; der griechische Text formuliert jedoch das Bild selbst. Die Übersetzung bewahrt daher die poetische Offenheit und erläutert die mögliche Bedeutung nur in der Fußnote.
- issue: Personenbezug von νεώτεροι
  choice: „die Jüngeren“ mit Hinweis auf das grammatische Maskulinum
  alternative: „die jungen Männer“
  rationale: Das griechische Wort steht im Maskulinum Plural, kann als substantiviertes Adjektiv jedoch allgemein die jüngeren Angehörigen einer Gruppe bezeichnen. Der Haupttext vermeidet eine stärkere Festlegung auf ausschließlich männliche Personen, während die Fußnote die Form des Ausgangstextes transparent macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung im letzten Glied hebt „den Weg der Erkenntnis“ hervor und erhält den poetischen Gegensatz zwischen irdischem Leben und fehlender Erkenntnis.
