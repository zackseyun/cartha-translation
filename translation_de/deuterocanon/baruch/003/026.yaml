translation:
  language: de
  text: Dort wurden die Riesen geboren, jene seit Urzeiten Berühmten[a], von gewaltiger Größe und im Krieg erfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jene Berühmten, die seit dem Anfang ins Dasein gekommen waren“. Die gedrängte griechische Wendung kann „seit dem Anfang“ entweder mit ihrem Entstehen verbinden oder ihr seit Urzeiten bestehendes Berühmtsein hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: Dort
  rationale: Der Ortsadverb verweist auf den vorausgehenden Zusammenhang; „Dort“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: ἐγεννήθησαν
  choice: wurden … geboren
  rationale: Der Aorist Passiv von γεννάω bezeichnet hier am naheliegendsten die Geburt; die Passivform bleibt erhalten.
- source_word: οἱ γίγαντες
  choice: die Riesen
  rationale: „Riesen“ gibt γίγαντες direkt wieder, ohne sie näher mythologisch oder mit einer bestimmten anderen Gruppe zu identifizieren.
- source_word: οἱ ὀνομαστοὶ ἀπʼ ἀρχῆς γενόμενοι
  choice: jene Berühmten aus uralter Zeit
  rationale: Die verdichtete griechische Fügung bezeichnet seit frühester Zeit bekannte Gestalten. Die Wiedergabe ist im Deutschen natürlich und bewahrt den Bezug auf fernste Vergangenheit; die partizipiale Formulierung wird in der Fußnote offengelegt.
- source_word: εὐμεγέθεις
  choice: von gewaltiger Größe
  rationale: Das Adjektiv bezeichnet außergewöhnliche körperliche Größe; „gewaltig“ vermittelt die verstärkende Bedeutung idiomatisch.
- source_word: ἐπιστάμενοι πόλεμον
  choice: im Krieg erfahren
  rationale: ἐπίσταμαι bezeichnet Kenntnis oder Sachkunde. „Im Krieg erfahren“ drückt militärische Vertrautheit aus, ohne eine übermäßig technische Nuance einzuführen.
theological_decisions:
- issue: Identität und Deutung der Riesen
  choice: Die direkte Bezeichnung „Riesen“ wird beibehalten.
  alternative: „Helden“, „mächtige Männer“ oder „Nephilim“
  rationale: Der griechische Text nennt sie γίγαντες. Eine genauere Identifizierung mit mythologischen Gestalten oder den Nephilim würde eine im Vers selbst nicht ausdrücklich vollzogene Deutung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aus uralter Zeit“ vermeidet einen unnötig metaphysischen Klang von „von Anfang an“, während die echte Mehrdeutigkeit der kompakten griechischen Partizipialkonstruktion in der Fußnote erhalten bleibt.
