base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/005.yaml
  text: Do not remember the unrighteous acts of our fathers[b][a], but remember your hand and your name at this time.
translation:
  language: de
  text: Gedenke nicht der Verfehlungen unserer Väter, sondern gedenke in dieser Zeit deiner Hand[a] und deines Namens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Deine Hand“ ist eine biblische Wendung, die deine Macht oder dein machtvolles Handeln bezeichnen kann.
