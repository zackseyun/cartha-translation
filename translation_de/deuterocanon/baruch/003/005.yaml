lexical_decisions:
- source_word: μὴ μνησθῇς … ἀλλὰ μνήσθητι
  choice: Denk nicht … sondern denk
  rationale: Die Wiederholung desselben Verbs bewahrt den bewussten Gegensatz des griechischen Textes. „An etwas denken“ gibt den Gebetsruf in natürlichem, heutigem Deutsch wieder, ohne den biblischen Gedanken des wirksamen Erinnerns auszudeuten.
- source_word: ἀδικιῶν
  choice: Verfehlungen
  rationale: Das Wort bezeichnet moralisches Unrecht beziehungsweise unrechtes Handeln. „Verfehlungen“ bewahrt die moralisch-religiöse Bedeutung, ohne sie auf soziale Ungerechtigkeiten zu beschränken oder mit „Sünden“ enger zu fassen, als es der griechische Ausdruck verlangt.
- source_word: πατέρων ἡμῶν
  choice: unserer Väter
  rationale: Die ausdrückliche maskuline Bezeichnung für die Väter beziehungsweise Vorväter wird beibehalten. „Unserer Vorfahren“ wäre kontextuell möglich, würde die Form des Ausgangstextes jedoch neutralisieren.
- source_word: χειρός σου
  choice: deine Hand
  rationale: Die wörtliche Metapher bleibt erhalten. Im biblischen Sprachgebrauch kann Gottes Hand seine Macht oder sein machtvolles Handeln bezeichnen.
- source_word: ὀνόματός σου
  choice: deinen Namen
  rationale: „Name“ bewahrt die biblische Bedeutungsfülle von Identität, Ansehen und Ehre, ohne sie im Haupttext auf eine einzelne Deutung festzulegen.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: in dieser Zeit
  rationale: Die Formulierung entspricht dem situativen καιρός und erhält den Bezug auf die gegenwärtige Notlage. Sie ist würdig und im modernen Standarddeutsch verständlich.
theological_decisions:
- issue: Bedeutung von „an deine Hand und an deinen Namen denken“
  choice: Die Bildsprache von Gottes Hand und Namen bleibt unaufgelöst stehen.
  alternative: Paraphrase als Bitte, Gott möge gemäß seiner Macht und seiner Bundesidentität beziehungsweise Ehre handeln.
  rationale: Der Gebetskontext legt ein wirksames göttliches Erinnern und Handeln nahe. Die wörtliche Wiedergabe vermeidet jedoch, die mögliche Bundesbedeutung oder den Aspekt göttlicher Ehre ausdrücklich zum alleinigen Sinn zu erklären.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Der parallele Gegensatz „Denk nicht … sondern denk“ und die biblischen Bilder „Hand“ und „Name“ werden bewahrt. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Metapher.
