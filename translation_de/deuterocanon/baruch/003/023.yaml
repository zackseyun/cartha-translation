base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/023.yaml
  text: And the sons of Hagar also[a], who seek understanding on the earth—the merchants of Merran and Teman, and the myth-makers and seekers of understanding—did not know the way of wisdom[b], nor did they remember her paths.
translation:
  language: de
  text: Auch die Söhne Hagars, die auf Erden nach Einsicht suchten – die Händler von Merran[a] und Teman, die Mythenerzähler und die Erforscher der Einsicht –, erkannten den Weg der Weisheit nicht und erinnerten sich nicht an ihre Pfade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text liest hier „Merran“, einen ungewöhnlichen Ortsnamen. Andere Überlieferungen geben den Namen abweichend wieder oder identifizieren ihn anders.
    reason: textual_variant
lexical_decisions:
- source_word: οἵ τε υἱοὶ Ἁγὰρ
  choice: Auch die Söhne Hagars
  rationale: „Söhne“ wahrt die konkrete Form von υἱοί; „auch“ gibt die additive Kraft von τε im fortlaufenden Katalog wieder.
- source_word: οἱ ἐκζητοῦντες τὴν σύνεσιν οἱ ἐπὶ γῆς
  choice: die auf Erden nach Einsicht suchten
  rationale: Die syntaktisch abrupte griechische Wortfolge wird verständlich gefasst, ohne den weiten Bezug von ἐπὶ γῆς auf ein bestimmtes Land einzuengen. σύνεσις wird mit „Einsicht“ wiedergegeben.
- source_word: οἱ ἔμποροι τῆς Μερρὰν καὶ Θαιμάν
  choice: die Händler von Merran und Teman
  rationale: „Händler“ ist eine natürliche Entsprechung für ἔμποροι. Das ungewöhnliche Μερράν wird nicht stillschweigend emendiert; Θαιμάν erscheint in der üblichen deutschen Form „Teman“.
- source_word: οἱ μυθολόγοι
  choice: die Mythenerzähler
  rationale: Die Wiedergabe bewahrt den Bezug auf μῦθος und bezeichnet Menschen, die Mythen beziehungsweise überlieferte Erzählungen vortragen, ohne zwingend moderne Falschheitsvorstellungen einzutragen.
- source_word: οἱ ἐκζητηταὶ τῆς συνέσεως
  choice: die Erforscher der Einsicht
  rationale: Das Substantiv ἐκζητηταί bezeichnet intensiv Suchende oder Forschende. „Einsicht“ wiederholt bewusst die frühere Wiedergabe von σύνεσις.
- source_word: ὁδὸν δὲ σοφίας οὐκ ἔγνωσαν
  choice: erkannten den Weg der Weisheit nicht
  rationale: „Weg der Weisheit“ erhält die Metapher; „erkannten“ gibt γινώσκω hier als tatsächliches Erfassen wieder und passt zum Erkenntniskontrast des Verses.
- source_word: οὐδὲ ἐμνήσθησαν τὰς τρίβους αὐτῆς
  choice: und dachten nicht an ihre Pfade
  rationale: μιμνῄσκομαι kann das Sich-Erinnern beziehungsweise Bedenken ausdrücken. „Pfade“ unterscheidet τρίβοι von ὁδός; „ihre“ erhält im Deutschen den möglichen Rückbezug auf die personifizierte Weisheit.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: „ihre Pfade“
  alternative: „deren Pfade“ oder „seine Pfade“ mit Bezug auf den Weg
  rationale: Das feminine αὐτῆς bezieht sich am natürlichsten auf die feminine σοφία. Die deutsche Form „ihre“ bewahrt die Personifikation, ohne sie zusätzlich auszudeuten.
- issue: Ungewöhnlicher geografischer Name Μερράν
  choice: Merran beibehalten und mit einer textkritischen Fußnote kennzeichnen
  alternative: Zu einem bekannteren Ortsnamen normalisieren oder emendieren
  rationale: Der vorgelegte griechische Zeuge liest Μερράν. Quellentreue verlangt, die ungewöhnliche Form sichtbar zu bewahren, statt eine unsichere Identifikation in den Text einzutragen.
- issue: Charakterisierung der μυθολόγοι
  choice: „Mythenerzähler“
  alternative: „Geschichtenerzähler“ oder „Mythendichter“
  rationale: „Mythenerzähler“ bleibt semantisch nahe am griechischen Ausdruck, ohne schon ein theologisches Urteil über Wahrheit oder Falschheit der Erzählungen zu formulieren.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Parallelstruktur. Der Gedankenstrich bündelt die näheren Bestimmungen zu den Söhnen Hagars. „Auf Erden“ erhält den weiten, leicht feierlichen Klang; „Mythenerzähler“ bleibt quellennah und verständlich.
