base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/016.yaml
  text: Where are the rulers of the nations[a], and those who rule over the beasts on the earth?
translation:
  language: de
  text: Wo sind die Herrscher der Völker und die, die über die Tiere[a] auf der Erde herrschen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die wilden Tiere.'
    reason: Das griechische θηρίων kann Tiere allgemein oder genauer wilde Tiere bezeichnen.
lexical_decisions:
- source_word: ποῦ
  choice: Wo
  rationale: Die einfache Ortsfrage gibt das griechische Fragewort unmittelbar wieder, ohne eine zusätzliche zeitliche oder rhetorische Nuance einzutragen.
- source_word: ἄρχοντες
  choice: Herrscher
  rationale: Das Wort bezeichnet Personen in politischer oder gesellschaftlicher Machtstellung; »Herrscher« ist im Deutschen klar, würdig und nicht unnötig altertümlich.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: Im Zusammenhang sind politisch verstandene Völker oder Nationen gemeint. »Der Völker« klingt natürlich und vermeidet die hier nicht erforderliche religiöse Festlegung auf »Heiden«.
- source_word: κυριεύοντες
  choice: die, die … herrschen
  rationale: Die Wiedergabe bewahrt den aktiven Sinn des Partizips, nämlich Herrschaft über andere auszuüben, und ist zugleich idiomatisches modernes Deutsch.
- source_word: τῶν θηρίων
  choice: über die Tiere
  rationale: θηρίον kann Tiere allgemein oder insbesondere wilde Tiere bezeichnen. »Tiere« wahrt den weiteren Sinn; die engere Möglichkeit wird in einer Fußnote genannt.
- source_word: τῶν ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die Präpositionalfügung wird räumlich verstanden und bezieht sich auf die Tiere; »auf der Erde« gibt diesen Bezug klar und direkt wieder.
