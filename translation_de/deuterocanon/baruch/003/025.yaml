translation:
  language: de
  text: Groß und ohne Ende, hoch und unermesslich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέγας
  choice: Groß
  rationale: Das prädikative Adjektiv eröffnet eine knappe, poetische Beschreibung. „Groß“ bewahrt die breite Bedeutung von Ausdehnung und Erhabenheit, ohne sie auf Körpergröße oder Macht einzuengen.
- source_word: οὐκ ἔχει τελευτήν
  choice: ohne Ende
  rationale: Die Wendung bedeutet wörtlich „hat kein Ende“. „Ohne Ende“ ist im Deutschen natürlich und knapp und erhält die Parallele zu „unermesslich“.
- source_word: ὑψηλός
  choice: hoch
  rationale: „Hoch“ gibt die Grundbedeutung unmittelbar wieder und passt zum feierlichen, zugleich allgemein verständlichen Register; „erhaben“ würde stärker wertend deuten.
- source_word: ἀμέτρητος
  choice: unermesslich
  rationale: Das Wort bezeichnet etwas, das nicht ausgemessen werden kann. „Unermesslich“ ist die direkte und idiomatische deutsche Entsprechung und beschränkt den Sinn nicht auf eine zählbare Menge.
theological_decisions:
- issue: Aus dem Kontext übernommener Bezug
  choice: Die Zeile bleibt eine subjektlose, prädikative Beschreibung.
  alternative: Am Anfang „Sie ist“ ergänzen.
  rationale: Der griechische Text nennt in diesem Vers kein ausdrückliches Subjekt. Der Bezug ergibt sich aus dem Zusammenhang; die knappe poetische Form wird daher ohne erläuternde Ergänzung bewahrt.
translation_notes:
  register: Feierlich-poetisch, aber in modernem Standarddeutsch. Die parallele Struktur des Griechischen bleibt erhalten; auf ein ergänztes Verb und ein ausdrücklich genanntes Subjekt wird verzichtet.
