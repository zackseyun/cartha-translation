  terminology: Die gewählten Begriffe sind präzise und kontextgerecht. Besonders die Unterscheidung von „Klugheit“ und „Verständnis“ ist gegenüber einer nivellierenden Wiedergabe zu bevorzugen. „Frieden“ bewahrt den etablierten biblischen Sprachgebrauch für εἰρήνη.
