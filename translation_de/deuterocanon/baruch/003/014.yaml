  source_fidelity: Die Übersetzung gibt die griechische Reihung und die Wiederholung von ποῦ ἐστιν sachgerecht wieder. „Klugheit“, „Kraft“ und „Verständnis“ halten φρόνησις, ἰσχύς und σύνεσις sinnvoll auseinander. „Damit du zugleich erkennst“ gibt den final bzw. resultativ verwendbaren artikulierten Infinitiv τοῦ γνῶναι mit ἅμα angemessen wieder. „Lange Lebenszeit und Leben“ bewahrt die im Griechischen ausdrücklich gesetzte, leicht spannungsvolle Verbindung von μακροβίωσις und ζωή. Auch „das Licht der Augen“ und „Frieden“ entsprechen dem Wortlaut, ohne die Metapher auszudeuten.
