base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/014.yaml
  text: Learn where prudence is[a], where strength is, where understanding is, so that you may know at the same time where length of days and life are[b], where light for the eyes and peace are.
translation:
  language: de
  text: Lerne, wo Klugheit ist, wo Kraft ist, wo Verständnis ist, damit du zugleich erkennst, wo lange Lebenszeit und Leben sind,[a] wo das Licht der Augen[b] und Frieden sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Langlebigkeit und Leben“. Der griechische Text nennt die lange Lebensdauer und das Leben als zwei miteinander verbundene Größen.'
    reason: lexical_alternative
  - marker: b
    text: „Das Licht der Augen“ ist eine wörtlich bewahrte Metapher; sie kann Lebenskraft, Freude oder klare Sicht anklingen lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάθε
  choice: Lerne
  rationale: Der Aoristimperativ fordert dazu auf, Erkenntnis zu erwerben. „Lerne“ gibt diese Aufforderung knapp und unmittelbar wieder.
- source_word: φρόνησις
  choice: Klugheit
  rationale: Das Wort bezeichnet praktische Einsicht und besonnenes Urteilsvermögen. „Klugheit“ hält es von σύνεσις („Verständnis“) unterschieden.
- source_word: ἰσχύς
  choice: Kraft
  rationale: „Kraft“ ist die natürliche und nicht übersteigernde Wiedergabe für Stärke oder Macht in diesem Weisheitszusammenhang.
- source_word: σύνεσις
  choice: Verständnis
  rationale: Der Ausdruck bezeichnet Verstehen oder Auffassungsvermögen. „Verständnis“ wahrt die begriffliche Unterscheidung von φρόνησις.
- source_word: τοῦ γνῶναι
  choice: damit du … erkennst
  rationale: Der artikulierte Infinitiv kann Zweck oder Folge ausdrücken. Der Zwecksatz fügt sich hier natürlich an die Aufforderung an, ohne die mögliche Ergebnisnuance völlig auszuschließen.
- source_word: ἅμα
  choice: zugleich
  rationale: „Zugleich“ bewahrt den Gedanken, dass die genannten Güter zusammen erkannt werden.
- source_word: μακροβίωσις
  choice: lange Lebenszeit
  rationale: Das Substantiv bezeichnet ein langes Leben beziehungsweise Langlebigkeit. „Lange Lebenszeit“ klingt im Deutschen natürlich und lässt das anschließend eigens genannte ζωή („Leben“) als selbstständigen Begriff stehen.
- source_word: ζωή
  choice: Leben
  rationale: Dies ist die sachlich direkte Standardwiedergabe.
- source_word: φῶς ὀφθαλμῶν
  choice: das Licht der Augen
  rationale: Die wörtliche, im Deutschen verständliche Metapher bleibt erhalten und wird nicht auf Lebenskraft, Freude oder Erkenntnis verengt.
- source_word: εἰρήνη
  choice: Frieden
  rationale: „Frieden“ ist die grundlegende Wiedergabe und bewahrt die biblische Resonanz, auch wenn das Wort umfassendes Wohlergehen einschließen kann.
theological_decisions:
- issue: Unterscheidung der weisheitsbezogenen Begriffe
  choice: φρόνησις, ἰσχύς und σύνεσις werden als „Klugheit“, „Kraft“ und „Verständnis“ unterschieden.
  alternative: φρόνησις und σύνεσις beide mit „Einsicht“ oder „Weisheit“ wiedergeben.
  rationale: Die Aufzählung nennt bewusst verschiedene Güter. Ihre begriffliche Eigenständigkeit sollte nicht zugunsten stilistischer Glättung aufgehoben werden.
- issue: Verhältnis von μακροβίωσις und ζωή
  choice: „lange Lebenszeit und Leben“
  alternative: „langes Leben“ oder „Langlebigkeit und Leben“
  rationale: Der griechische Text nennt sowohl die Dauer des Lebens als auch das Leben selbst. Die scheinbare Nähe der Begriffe wird beibehalten, statt den zweiten Begriff etwa als „Wohlergehen“ umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Reihung und Wiederholung des griechischen Weisheitsstils. Die drei Erkenntnisbegriffe bleiben unterscheidbar; die Metapher „Licht der Augen“ wird nicht erklärend aufgelöst.
