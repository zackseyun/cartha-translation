translation:
  language: de
  text: Wer hat ihren Ort gefunden, und wer ist in ihre Schatzkammern[a] hineingegangen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schätze“. Das griechische Wort kann sowohl Schätze als auch Schatzkammern oder Vorratsräume bezeichnen. „Schatzkammern“ passt hier besonders zu der Aussage, dass jemand in sie hineingeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Wer
  rationale: Das Interrogativpronomen leitet zwei direkte rhetorische Fragen ein; „Wer“ ist im Deutschen natürlich und präzise.
- source_word: εὗρεν
  choice: hat … gefunden
  rationale: Das griechische Aoristverb wird hier idiomatisch mit dem deutschen Perfekt wiedergegeben; „gefunden“ bleibt näher am Grundwort als das stärker deutende „entdeckt“.
- source_word: τὸν τόπον αὐτῆς
  choice: ihren Ort
  rationale: „Ort“ bewahrt die räumliche Metapher, ohne sie als Wohnort auszudeuten. Das feminine Pronomen erhält die Personifikation der Weisheit.
- source_word: εἰσῆλθεν εἰς
  choice: ist in … hineingegangen
  rationale: Die Formulierung gibt die ausdrücklich bezeichnete Bewegung in etwas hinein wieder und klingt zugleich verständlich und natürlich.
- source_word: τοὺς θησαυροὺς αὐτῆς
  choice: ihre Schatzkammern
  rationale: θησαυρός kann sowohl einen Schatz als auch dessen Aufbewahrungsort bezeichnen. Wegen der Bewegung „in … hinein“ ist hier die örtliche Bedeutung „Schatzkammern“ besonders naheliegend; das feminine Pronomen verweist erneut auf die personifizierte Weisheit.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Die Weisheit wird mit femininen Pronomen bezeichnet („ihren“, „ihre“).
  alternative: Die Weisheit unpersönlich mit „dessen“ oder durch wiederholtes „der Weisheit“ wiedergeben.
  rationale: Der Kontext personifiziert die Weisheit, und die griechischen Pronomen sind feminin. Die deutsche Wiedergabe erhält diese literarisch-theologische Darstellung, ohne sie weitergehend zu bestimmen.
- issue: Bild der θησαυροί
  choice: Die örtliche Bildsprache wird mit „Schatzkammern“ bewahrt.
  alternative: „Schätze“ als Inhalt der Kammern.
  rationale: Beide Bedeutungen sind lexikalisch möglich. Das Verb der Bewegung in etwas hinein spricht im unmittelbaren Satzbau stärker für Räume oder Behältnisse, ohne die alternative Deutung auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Perfekt entspricht natürlichem gegenwärtigem Sprachgebrauch; die räumliche Metaphorik und die feminine Personifikation der Weisheit bleiben erhalten.
