translation:
  language: de
  text: Niemand kennt ihren Weg, niemand bedenkt ihren Pfad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔστιν ὁ γινώσκων
  choice: Niemand kennt
  rationale: Die griechische verneinte Existenzformel mit substantiviertem Partizip wird im Deutschen natürlich und prägnant mit „Niemand kennt“ wiedergegeben.
- source_word: τὴν ὁδὸν αὐτῆς
  choice: ihren Weg
  rationale: Das feminine Pronomen verweist im Kontext auf die personifizierte Weisheit; „Weg“ entspricht der Wegmetaphorik von ὁδός.
- source_word: οὐδὲ
  choice: niemand
  rationale: Die Wiederholung von „niemand“ gibt die parallele Verneinung idiomatisch und mit poetischem Nachdruck wieder.
- source_word: ὁ ἐνθυμούμενος
  choice: bedenkt
  rationale: ἐνθυμέομαι bezeichnet hier inneres Erwägen oder Nachdenken; „bedenkt“ ist knapp, würdig und bewahrt den Unterschied zu „kennt“.
- source_word: τὴν τρίβον αὐτῆς
  choice: ihren Pfad
  rationale: „Pfad“ bewahrt die poetische Variation gegenüber ὁδός („Weg“) und gibt τρίβος als gebahnten oder begangenen Weg wieder.
theological_decisions:
- issue: Bezug des femininen Pronomens αὐτῆς
  choice: „ihren“, bezogen auf die personifizierte Weisheit
  alternative: Unpersönliches „dessen“ oder eine abstrakte Umschreibung mit „der Weisheit“
  rationale: Der unmittelbare Zusammenhang personifiziert die Weisheit. Das feminine Pronomen sollte deshalb erhalten bleiben, ohne die Personifikation weiter auszudeuten.
- issue: Bedeutung von ἐνθυμούμενος
  choice: „bedenkt“ im Sinn von erwägendem Nachdenken
  alternative: „erinnert sich an“
  rationale: Das Verb kann je nach Kontext auch Erinnerung bezeichnen; hier passt angesichts der parallelen Suche nach Weg und Pfad das erwägende Nachdenken besser, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die Wiederholung von „niemand“ macht die Aussage unmittelbar verständlich und wahrt den Nachdruck des griechischen Doppelglieds.
