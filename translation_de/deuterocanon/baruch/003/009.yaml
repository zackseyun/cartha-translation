base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/009.yaml
  text: Hear[a], O Israel, the commandments of life[b]; give ear to know prudence.
translation:
  language: de
  text: Höre, Israel, die Gebote des Lebens[a]; hört aufmerksam zu, damit ihr Einsicht gewinnt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die lebensspendenden Gebote“ oder „die Gebote, die zum Leben führen“. Wörtlich steht im Griechischen: „die Gebote des Lebens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Klugheit“ oder „Besonnenheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄκουε
  choice: Höre
  rationale: Der Imperativ Singular richtet sich an Israel als kollektive Größe. „Höre“ bewahrt den feierlichen biblischen Aufruf und bildet zugleich den Numeruswechsel zum folgenden Plural ab.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Übliche deutsche Form des Eigennamens.
- source_word: ἐντολὰς
  choice: die Gebote
  rationale: „Gebote“ gibt den verbindlichen Charakter von ἐντολή wieder und ist im biblischen Sprachgebrauch geläufig.
- source_word: ζωῆς
  choice: des Lebens
  rationale: Die formale Genitivverbindung bleibt erhalten und legt nicht fest, ob Gebote gemeint sind, die Leben geben, zum Leben führen oder dem Leben zugehören.
- source_word: ἐνωτίσασθε
  choice: hört aufmerksam zu
  rationale: Der Imperativ Plural bezeichnet ein bewusstes, aufmerksames Hinhören. Die natürliche deutsche Wendung bewahrt den Nachdruck, ohne die im Deutschen ungebräuchliche Lehnprägung „leiht euer Ohr“ zu verwenden.
- source_word: γνῶναι
  choice: damit ihr … gewinnt
  rationale: Der Infinitiv lässt sich hier natürlich als Ziel des Hörens ausdrücken. Bei „Einsicht“ ist „gewinnen“ im Deutschen idiomatischer als „erkennen“ oder „wissen“.
- source_word: φρόνησιν
  choice: Einsicht
  rationale: φρόνησις umfasst verständige, lebenspraktische Urteilskraft. „Einsicht“ ist gegenwärtig und breit genug; „Klugheit“ könnte stärker eine persönliche Eigenschaft, „Besonnenheit“ eine engere Tugend bezeichnen.
theological_decisions:
- issue: Bedeutung des Genitivs in ἐντολὰς ζωῆς
  choice: die Gebote des Lebens
  alternative: die lebensspendenden Gebote / die Gebote, die zum Leben führen
  rationale: Die knappe griechische Genitivverbindung ist mehrdeutig. Die Hauptfassung bewahrt diese Offenheit, statt Ursache, Wirkung oder Ziel festzulegen.
- issue: Verhältnis von Hören und Einsicht in ἐνωτίσασθε γνῶναι φρόνησιν
  choice: hört aufmerksam zu, damit ihr Einsicht gewinnt
  alternative: nehmt es zu Ohren, um Einsicht zu erkennen
  rationale: Die Zielfunktion des Infinitivs wird verständlich wiedergegeben, ohne eine besondere Lehre über die Art des Erkenntnisgewinns einzutragen.
translation_notes:
  register: 'Feierlicher, aber moderner Standarddeutsch-Stil. Der Numeruswechsel des Griechischen bleibt sichtbar: Zunächst wird Israel als Einheit im Singular angesprochen („Höre“), danach die Angehörigen Israels im Plural („hört … ihr“). Der Marker [a] steht unmittelbar bei der mehrdeutigen Genitivverbindung; [b] kennzeichnet die Bedeutungsbreite von φρόνησις.'
