base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/032.yaml
  text: But he who knows all things knows her[a]; he found her out by his understanding. He who prepared the earth for everlasting time filled it with four-footed animals[c][b];
translation:
  language: de
  text: Doch der, der alles weiß, kennt sie[a]; er entdeckte sie durch seine Einsicht[b]. Er, der die Erde für ewige Zeit[c] bereitet hat, füllte sie mit vierfüßigen Tieren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sie“ bezieht sich auf die Weisheit, die in diesem Abschnitt als weibliche Gestalt personifiziert wird.
    reason: Bezug des Pronomens und Personifikation verdeutlichen
  - marker: b
    text: 'Oder: „er fand sie durch seine Einsicht heraus“.'
    reason: Lexikalische Alternative zu ἐξεῦρεν angeben
  - marker: c
    text: 'Oder: „für alle Zeit“ beziehungsweise „für immer“.'
    reason: Bedeutungsbreite der Zeitangabe εἰς τὸν αἰῶνα χρόνον bewahren
lexical_decisions:
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: der, der alles weiß
  rationale: Das substantivierte Partizip bezeichnet Gott als den, dessen Wissen alles umfasst. Die Formulierung bewahrt diese Aussage, ohne mit „der Allwissende“ einen abstrakten Titel einzuführen.
- source_word: γινώσκει αὐτήν
  choice: kennt sie
  rationale: Das feminine Pronomen verweist im Zusammenhang auf die personifizierte Weisheit. Da „Weisheit“ auch im Deutschen feminin ist, lässt sich der Bezug natürlich bewahren.
- source_word: ἐξεῦρεν αὐτήν
  choice: entdeckte sie
  rationale: ἐξευρίσκω bedeutet hier „herausfinden, entdecken“. „Entdeckte sie“ ist im heutigen Deutsch natürlicher als „fand sie heraus“ und hält die Weisheit als personales Gegenüber im Blick.
- source_word: τῇ συνέσει αὐτοῦ
  choice: durch seine Einsicht
  rationale: σύνεσις bezeichnet verstehende Einsicht; „durch“ gibt den instrumentalen Dativ wieder.
- source_word: ὁ κατασκευάσας τὴν γῆν
  choice: Der die Erde … bereitet hat
  rationale: κατασκευάζω kann „bereiten, herrichten, ausstatten“ bedeuten. „Bereitet“ wahrt die lexikalische Breite und vermeidet die stärkere Festlegung auf „erschaffen“.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: für ewige Zeit
  rationale: Die Verbindung von αἰών und χρόνος hebt die bleibende Dauer hervor. Die leicht feierliche Wendung entspricht dem griechischen Ausdruck.
- source_word: ἐνέπλησεν αὐτὴν κτηνῶν τετραπόδων
  choice: füllte sie mit vierfüßigen Tieren
  rationale: Das Pronomen bezieht sich nun grammatisch auf die Erde; κτήνη τετράποδα sind klar und ohne unnötige Fachsprache als „vierfüßige Tiere“ wiedergegeben.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Den femininen Bezug mit „sie“ beibehalten
  alternative: Die Weisheit unpersönlich umschreiben
  rationale: Der griechische Zusammenhang stellt die Weisheit personifiziert dar. Das deutsche feminine Pronomen bewahrt diese literarische und theologische Spannung, ohne die Weisheit als eigene Gottheit zu bestimmen.
- issue: Gottes Handeln an der Erde in κατασκευάσας
  choice: „die Erde … bereitet hat“
  alternative: „die Erde erschaffen hat“ oder „die Erde gegründet hat“
  rationale: Das Verb ist semantisch weiter als ein ausdrückliches Schöpfungsverb. Die Übersetzung soll keine stärkere dogmatische Präzisierung eintragen, als der Wortlaut bietet.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die Wiederholung in „der, der alles weiß“ ist bewusst zugunsten der Nähe zur griechischen substantivierten Partizipialkonstruktion beibehalten. Die beiden Vorkommen von „sie“ haben unterschiedliche Bezüge: zuerst die Weisheit, danach die Erde; im Deutschen entspricht dies jeweils dem grammatischen Geschlecht.'
