base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/034.yaml
  text: And the stars shone in their watches and rejoiced;[a]
translation:
  language: de
  text: Die Sterne aber leuchteten an ihren Wachtposten und freuten sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »während ihrer Wachen«, »auf ihren Bahnen« oder »an ihren Plätzen«. Das griechische Wort bezeichnet Wachen, Wachzeiten oder Wachtposten und bezieht sich hier poetisch auf die den Sternen zugewiesenen Orte oder Zeiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀστέρες
  choice: Die Sterne aber
  rationale: ἀστέρες bezeichnet eindeutig die Sterne. Das nachgestellte „aber“ gibt δέ wieder und wahrt den Anschluss an den poetischen Zusammenhang.
- source_word: ἔλαμψαν
  choice: leuchteten
  rationale: Das Aoristverb λάμπω bezeichnet das Ausstrahlen von Licht. „Leuchteten“ ist im Deutschen natürlich und bildet die schlichte Aussage präzise ab.
- source_word: ἐν ταῖς φυλακαῖς αὐτῶν
  choice: an ihren Wachtposten
  rationale: φυλακαί kann Wachen, Wachzeiten oder Wachtposten bezeichnen. Im kosmologischen Bild vermittelt „an ihren Wachtposten“ die Vorstellung zugewiesener Plätze, ohne die mögliche zeitliche Bedeutung endgültig auszuschließen; die Alternativen werden in der Fußnote genannt.
- source_word: εὐφράνθησαν
  choice: freuten sich
  rationale: Die passive/deponentische Form drückt Freude aus. „Freuten sich“ ist gegenwärtiges, würdevolles Deutsch und erhält die Personifikation der Sterne.
theological_decisions:
- issue: Poetische Personifikation der Sterne
  choice: Die Sterne leuchten und freuen sich.
  alternative: Die Aussage als rein unpersönliche astronomische Beschreibung wiedergeben.
  rationale: Der griechische Text schreibt den Sternen ausdrücklich Freude zu. Diese poetisch-theologische Darstellung der auf Gottes Ordnung antwortenden Schöpfung bleibt daher unverändert erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit poetisch-würdigem Ton. „Wachtposten“ bewahrt das ungewöhnliche griechische Bild; die Fußnote macht dessen räumliche und zeitliche Deutungsmöglichkeiten transparent.
