lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die Bitte im Zusammenhang ein und bewahrt die kausale Funktion.
- source_word: σὺ
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen bleibt erhalten und hebt den Gegensatz zu ἡμεῖς hervor.
- source_word: καθήμενος
  choice: thronst
  rationale: Beim Sitzen Gottes liegt im Kontext die Vorstellung beständigen Herrschens nahe. Das natürliche deutsche Verb gibt diese Nuance wieder; die wörtlichere Bedeutung wird in der Fußnote offengehalten.
- source_word: τὸν αἰῶνα
  choice: in Ewigkeit / für immer
  rationale: Der Akkusativ der Dauer bezeichnet unbegrenzte Dauer. Die leicht variierte Wiedergabe klingt im Deutschen natürlich, ohne den inhaltlichen Parallelismus aufzugeben.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen bewahrt den scharfen Kontrast zwischen Gottes Beständigkeit und dem Untergang der Betenden.
- source_word: ἀπολλύμενοι
  choice: gehen zugrunde
  rationale: Gibt den andauernden Vorgang des Verderbens oder Untergehens idiomatisch wieder, ohne ausdrücklich festzulegen, ob eine äußere Vernichtung oder ein fortschreitender Ruin gemeint ist.
theological_decisions:
- issue: Ob καθήμενος ausdrücklich als königliches Thronen wiederzugeben ist
  choice: thronst
  alternative: sitzt / bleibst sitzen
  rationale: In der Rede zu Gott kann das Sitzen beständige Herrschaft andeuten, doch ein Thron wird im Griechischen nicht ausdrücklich genannt. Daher steht die naheliegende kontextuelle Wiedergabe im Text, während die Fußnote die wörtlichere Lesart und deren Begrenzung nennt.
- issue: Die wiederholte Wendung τὸν αἰῶνα in beiden Satzhälften
  choice: in Ewigkeit / für immer
  alternative: beide Male „in Ewigkeit“ oder „für immer“
  rationale: Die Wiederholung und der Gegensatz bleiben semantisch erhalten; die Variation vermeidet im Deutschen eine unbeholfene Formulierung, ohne die theologische Spannung zwischen Gottes Dauer und dem fortdauernden Untergang der Menschen aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kurze kausale Satz und der betonte Gegensatz zwischen »du« und »wir« bleiben erhalten. »Wir aber« macht den griechischen Kontrast im Deutschen klar hörbar.
