  language: de
  text: Denn du sitzt für immer[a], wir aber gehen für immer zugrunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „thronst für immer“. Wörtlich: „sitzt für immer“. Im Zusammenhang kann das Sitzen Gottes seine Herrschaft andeuten; ein Thron wird im Griechischen jedoch nicht ausdrücklich erwähnt.'
