translation:
  language: de
  text: du wurdest zu denen im Totenreich gezählt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du wurdest zu denen im Hades gerechnet.“ Griechisch: „im Hades“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελογίσθης
  choice: du wurdest … gezählt
  rationale: Der Aorist Passiv bezeichnet, dass die angesprochene Person einer Gruppe zugerechnet wurde. Die passive Form und die direkte Anrede bleiben erhalten.
- source_word: μετὰ
  choice: zu denen
  rationale: Nach einem Verb des Zurechnens gibt „zu denen … gezählt“ die Zugehörigkeit zu einer Gruppe im modernen Deutschen natürlich wieder.
- source_word: τῶν εἰς ᾅδου
  choice: denen im Totenreich
  rationale: Die substantivierte Wendung bezeichnet diejenigen, die sich im Hades befinden. Die knappe deutsche Form wahrt diesen räumlichen Bezug.
- source_word: ᾅδου
  choice: Totenreich
  rationale: „Totenreich“ gibt den griechischen Hades als Bereich der Toten verständlich wieder, ohne ihn mit der Hölle als Ort endgültiger Strafe gleichzusetzen.
theological_decisions:
- issue: Wiedergabe von ᾅδου
  choice: Totenreich
  alternative: Hades
  rationale: „Totenreich“ ist im heutigen Deutsch unmittelbar verständlich und bewahrt die Vorstellung vom Bereich der Toten. Die Alternative „Hades“ bleibt in der Fußnote sichtbar; „Hölle“ wäre theologisch zu eng und könnte eine endgültige Strafvorstellung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist knapp und folgt der passiven Aussage des griechischen Textes; „Totenreich“ vermeidet sowohl erklärungsbedürftige Fremdheit als auch die missverständliche Gleichsetzung mit „Hölle“.
