base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/019.yaml
  text: They vanished and went down to Hades[a], and others rose up in their place.
translation:
  language: de
  text: Sie verschwanden und stiegen in den Hades[a] hinab, und andere erhoben sich an ihrer Stelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Totenreich“ oder „das Grab“; griechisch „Hades“, das Reich der Toten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠφανίσθησαν
  choice: sie verschwanden
  rationale: Die Form bezeichnet hier, dass sie aus dem Blickfeld beziehungsweise aus dem Dasein verschwanden. „Verschwanden“ bewahrt die Ergebnisaussage, ohne den Vorgang stärker als ausdrücklich als Vernichtung oder Tod festzulegen.
- source_word: εἰς ᾅδου
  choice: in den Hades
  rationale: Der griechische Text nennt ausdrücklich den Hades als Totenreich. Die direkte Wiedergabe vermeidet sowohl die Verengung auf ein einzelnes Grab als auch die Einführung des hier nicht stehenden hebräischen Ausdrucks „Scheol“.
- source_word: κατέβησαν
  choice: stiegen … hinab
  rationale: Die Wendung gibt die räumliche Abwärtsbewegung zum Totenreich natürlich und würdig wieder.
- source_word: ἄλλοι
  choice: andere
  rationale: Das unbestimmte Pluralwort wird ohne unnötige Ergänzung eines Substantivs wiedergegeben.
- source_word: ἀντανέστησαν
  choice: erhoben sich
  rationale: Das Verb beschreibt ein Aufstehen beziehungsweise Auftreten in Ablösung anderer. „Erhoben sich“ erhält das Bild des Aufstehens, während der folgende Ausdruck die Bedeutung der Nachfolge klärt.
- source_word: ἀντʼ αὐτῶν
  choice: an ihrer Stelle
  rationale: ἀντί mit Genitiv bezeichnet hier Stellvertretung beziehungsweise Ablösung; „an ihrer Stelle“ ist im Deutschen klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe von ᾅδης im weisheitlichen Kontext
  choice: Hades
  alternative: Totenreich; Grab; Scheol
  rationale: Da die griechische Vorlage ᾅδης nennt, bleibt „Hades“ als Bezeichnung des Totenreichs erhalten. Dadurch wird der Ausdruck weder auf das Grab verengt noch durch den nicht vorliegenden hebräischen Begriff „Scheol“ ersetzt; ebenso wird keine spätere Lehre über die Hölle in den Vers eingetragen.
- issue: Möglicher Auferstehungsklang von ἀντανέστησαν
  choice: erhoben sich
  alternative: traten an ihre Stelle; folgten ihnen nach
  rationale: Die bildhafte Bewegung des griechischen Verbs bleibt sichtbar. Zugleich zeigt „an ihrer Stelle“, dass hier das Auftreten einer neuen Generation beziehungsweise von Nachfolgern gemeint ist, ohne eine Auferstehungsdeutung ausdrücklich in den Wortlaut hineinzuschreiben oder sie polemisch auszuschließen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt der knappen Dreigliedrigkeit des griechischen Textes; „Hades“ wird durch eine Fußnote erläutert.
