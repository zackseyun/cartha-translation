base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/037.yaml
  text: He found every way of knowledge[a], and gave it to Jacob his servant and to Israel his beloved.
translation:
  language: de
  text: Er fand jeden Weg der Erkenntnis und gab ihn Jakob, seinem Knecht[a], und Israel, seinem Geliebten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seinem Kind; oder: seinem Sohn. Das griechische Wort παῖς kann alle drei Bedeutungen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεῦρεν
  choice: fand
  rationale: Das Verb bezeichnet das Auffinden oder Entdecken. „Fand“ ist im Deutschen natürlich und bewahrt die aktive Aussage, ohne einen zusätzlichen Vorgang des Forschens einzutragen.
- source_word: πᾶσαν ὁδὸν ἐπιστήμης
  choice: jeden Weg der Erkenntnis
  rationale: „Weg“ erhält die Metapher von ὁδός; „Erkenntnis“ gibt ἐπιστήμη wieder, ohne es mit dem spezifischeren Begriff „Weisheit“ gleichzusetzen.
- source_word: ἔδωκεν αὐτήν
  choice: gab ihn
  rationale: Das Pronomen bezieht sich auf ὁδός. Da „Weg“ im Deutschen maskulin ist, verlangt der Rückbezug „ihn“.
- source_word: τῷ παιδὶ αὐτοῦ
  choice: seinem Knecht
  rationale: παῖς kann Knecht, Kind oder Sohn bedeuten. Im Verhältnis Jakobs zu Gott entspricht „Knecht“ dem naheliegenden bundestheologischen Sprachgebrauch; die echte lexikalische Mehrdeutigkeit wird in der Fußnote offengehalten.
- source_word: τῷ ἠγαπημένῳ ὑπʼ αὐτοῦ
  choice: seinem Geliebten
  rationale: Die Formulierung gibt den passiven Sinn „der von ihm Geliebte“ knapp wieder und wahrt den poetischen Parallelismus.
- source_word: Ἰακὼβ ... Ἰσραήλ
  choice: Jakob ... Israel
  rationale: Beide Namen werden entsprechend dem griechischen Parallelismus beibehalten und nicht zu einer einzigen Bezeichnung zusammengezogen.
theological_decisions:
- issue: Bedeutung von παῖς für Jakob im Verhältnis zu Gott
  choice: Knecht im Haupttext, mit Fußnote
  alternative: Kind oder Sohn
  rationale: „Knecht“ passt zum verbreiteten biblischen Bundes- und Erwählungssprachgebrauch. Da παῖς zugleich „Kind“ oder „Sohn“ heißen kann, wird diese mögliche Sohnschaftssprache nicht ausgeschlossen, sondern in der Fußnote kenntlich gemacht.
- issue: Verhältnis der Bezeichnungen Jakob und Israel
  choice: beide Namen parallel beibehalten
  alternative: zu einer einzigen Bezeichnung zusammenziehen
  rationale: Der griechische Text stellt beide Namen nebeneinander. Die Übersetzung bewahrt diesen literarischen und theologischen Parallelismus, ohne den Bezug weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wegmetapher und der Parallelismus Jakob/Israel bleiben erhalten; die Mehrdeutigkeit von παῖς wird transparent ausgewiesen.
