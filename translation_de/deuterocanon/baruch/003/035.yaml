base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/035.yaml
  text: He called them[a], and they said, ‘Here we are’[c][b]; they shone with gladness for the one who made them.
translation:
  language: de
  text: 'Er rief sie[a], und sie sagten: »Hier sind wir!«[b] Sie leuchteten voller Freude für den, der sie gemacht hat.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »sie« sind die Himmelslichter beziehungsweise Sterne aus dem vorangehenden Zusammenhang gemeint; sie werden hier wie Personen dargestellt.
    reason: cross_reference
  - marker: b
    text: 'Oder: »und sie antworteten: ›Wir sind da!‹«'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »vor dem, der sie gemacht hat« oder »dem, der sie gemacht hat«; der griechische Dativ lässt die genaue Beziehung offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: Er rief
  rationale: Der Aorist von καλέω bezeichnet hier das Rufen der zuvor genannten Himmelslichter; »rief« ist unmittelbar und natürlich.
- source_word: αὐτούς
  choice: sie
  rationale: Das maskuline Pluralpronomen verweist im vorangehenden Zusammenhang auf die personifiziert dargestellten Himmelslichter beziehungsweise Sterne.
- source_word: εἶπον
  choice: sie sagten
  rationale: Die Grundbedeutung wird formal bewahrt. Da die Worte auf einen Ruf folgen, ist zugleich die Bedeutung »sie antworteten« möglich.
- source_word: Πάρεσμεν
  choice: Hier sind wir!
  rationale: Die Form drückt Anwesenheit und Bereitschaft als Reaktion auf einen Ruf aus. Diese Wendung ist im modernen Deutschen idiomatisch und wahrt die lebendige Personifikation.
- source_word: ἔλαμψαν
  choice: Sie leuchteten
  rationale: λάμπω bezeichnet das Leuchten oder Strahlen; »leuchteten« passt klar zu den Himmelslichtern.
- source_word: μετʼ εὐφροσύνης
  choice: voller Freude
  rationale: Die Wendung gibt die begleitende Freude natürlich und zugleich würdig wieder.
- source_word: τῷ ποιήσαντι αὐτούς
  choice: für den, der sie gemacht hat
  rationale: Der griechische Dativ bezeichnet die Beziehung oder Ausrichtung ihres Leuchtens auf ihren Schöpfer. »Für den« ist im Deutschen natürlich, ohne die grammatische Mehrdeutigkeit für alternativlos zu erklären.
theological_decisions:
- issue: Personifizierte Antwort der Himmelskörper auf Gottes Ruf
  choice: Die Himmelslichter werden unmittelbar als antwortend und freudig leuchtend dargestellt.
  alternative: Die Aussage als unpersönliche astronomische Beschreibung wiedergeben.
  rationale: Der griechische Text gestaltet die Himmelskörper poetisch als gehorsame Geschöpfe, die auf den Ruf ihres Schöpfers reagieren. Diese theologische Bildsprache wird nicht eingeebnet.
- issue: Beziehung des Leuchtens zum Schöpfer im Dativ
  choice: »für den, der sie gemacht hat«
  alternative: »vor dem, der sie gemacht hat« oder »dem, der sie gemacht hat«
  rationale: Der Dativ lässt verschiedene Beziehungsnuancen zu. Der Haupttext bietet eine natürliche deutsche Fassung; die Fußnote bewahrt die echte sprachliche Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Die direkte Rede macht die Personifikation hörbar; das Ausrufezeichen verdeutlicht Bereitschaft und freudige Antwort, ohne zusätzliche Sachinformation einzuführen.
