base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/004.yaml
  text: Lord Almighty[a], God of Israel, please hear the prayer of the dead of Israel and of the sons who sinned before you, who did not listen to the voice of you, their God, and the evils have clung to us.
translation:
  language: de
  text: Herr, Allherrscher, Gott Israels, erhöre doch das Gebet der Toten Israels und der Söhne, die vor dir gesündigt haben und nicht auf deine Stimme gehört haben, ihr Gott; die Übel haben sich an uns geheftet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Unheil hat sich an uns geheftet“ beziehungsweise „die Katastrophen haben sich an uns geheftet“. Wörtlich steht im Griechischen: „die Übel haben sich an uns geheftet“.'
    reason: Lexikalische Bedeutungsbreite von τὰ κακά und Beibehaltung des Bildes von κολλάω.
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: Herr, Allherrscher
  rationale: „Herr“ gibt den göttlichen Anredetitel κύριος wieder. „Allherrscher“ bewahrt bei παντοκράτωρ deutlicher als das ebenfalls mögliche „Allmächtiger“ den Gedanken umfassender Herrschaft.
- source_word: ἄκουσον δὴ
  choice: erhöre doch
  rationale: Bei einem Gebet bezeichnet ἀκούω idiomatisch das gnädige Hören beziehungsweise Erhören; „doch“ gibt die nachdrücklich-bittende Kraft von δή wieder.
- source_word: τῆς προσευχῆς τῶν τεθνηκότων Ἰσραήλ
  choice: das Gebet der Toten Israels
  rationale: Die auffällige wörtliche Aussage „der Toten Israels“ bleibt erhalten und wird nicht als geistlicher oder bildlicher Tod ausgedeutet.
- source_word: υἱῶν τῶν ἁμαρτανόντων ἐναντίον σου
  choice: der Söhne, die vor dir gesündigt haben
  rationale: υἱῶν wird geschlechtsgenau mit „Söhne“ wiedergegeben. „Vor dir“ wahrt die räumlich-relationale Offenheit von ἐναντίον σου, ohne die mögliche Bedeutung „gegen dich“ ausdrücklich festzulegen.
- source_word: οἳ οὐκ ἤκουσαν τῆς φωνῆς σου θεοῦ αὐτῶν
  choice: die nicht auf deine Stimme, die Stimme ihres Gottes, gehört haben
  rationale: „Auf die Stimme hören“ bewahrt sowohl das Hörbild als auch den Sinn des Gehorchens. Die wiederholende Apposition macht die Beziehung von θεοῦ αὐτῶν im Deutschen verständlich, ohne sie stillschweigend zu beseitigen.
- source_word: ἐκολλήθη ἡμῖν τὰ κακά
  choice: die Übel haben sich an uns geheftet
  rationale: „Sich anheften“ erhält das anschauliche Bild von κολλάω. „Die Übel“ lässt wie τὰ κακά sowohl Böses als auch daraus erwachsende Nöte anklingen.
theological_decisions:
- issue: Bedeutung der „Toten Israels“
  choice: Die wörtliche Bezeichnung „die Toten Israels“ bleibt im Haupttext stehen.
  alternative: Israeliten, die dem Tod nahe oder geistlich tot sind
  rationale: τεθνηκότων bezeichnet zunächst Verstorbene. Ein möglicherweise bildlicher oder rhetorischer Sinn soll nicht an die Stelle des griechischen Wortlauts gesetzt werden.
- issue: Bezug und Sinn von ἐναντίον σου
  choice: „vor dir gesündigt“
  alternative: „gegen dich gesündigt“
  rationale: Im Zusammenhang kann die Wendung eine gegen Gott gerichtete Sünde bezeichnen; „vor dir“ erhält jedoch die genuine Bedeutungsbreite zwischen Gegenwart und Gegnerschaft.
- issue: Sinn von τὰ κακά
  choice: „die Übel“
  alternative: „das Unheil“ oder „die Katastrophen“
  rationale: Der Kontext legt leidvolle Folgen der Sünde nahe, doch τὰ κακά kann sowohl Böses als auch Nöte oder Unglück bezeichnen. Die Hauptfassung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem feierlichen Gebetsstil angemessen; ungewöhnliche Formulierungen des Ausgangstextes werden nicht vorschnell geglättet. Das Semikolon verdeutlicht den Übergang von der Beschreibung des Ungehorsams zu dessen anhaftenden Folgen.
