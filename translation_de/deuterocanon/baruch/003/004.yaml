  to: Herr, Allherrscher, Gott Israels, erhöre doch das Gebet der Toten Israels und der Söhne, die vor dir gesündigt haben und nicht auf deine Stimme gehört haben, ihr Gott; die Übel haben sich an uns geheftet.[a]
  rationale: Die Fassung korrigiert die Apposition θεοῦ αὐτῶν zu „ihr Gott“ und vermeidet die unzutreffende Wiederholung „die Stimme ihres Gottes“. Die Zusammenziehung der beiden Relativsätze ist im Deutschen natürlich und erhält ihren gemeinsamen Bezug auf die Söhne. Der Schluss ohne kausales Bindewort bewahrt die griechische Parataxe. Die Fußnote bleibt inhaltlich passend.
