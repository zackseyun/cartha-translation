    rationale: 'Im Griechischen steht θεοῦ αὐτῶν appositiv zur zweiten Person: „deine Stimme, du/ihr Gott“, nicht als Genitivbestimmung „die Stimme ihres Gottes“. Die Wiederholung „die Stimme“ verschiebt die syntaktische Beziehung und macht den Satz unnötig schwerfällig.'
