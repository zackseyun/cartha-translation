base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/007.yaml
  text: For because of this you have put your fear in our hearts[a], that we may call on your name; and we will praise you in our exile[d][c][b], because we have turned away from our hearts every unrighteousness of our fathers who sinned before you.
translation:
  language: de
  text: Denn darum hast du die Furcht vor dir in unser Herz gelegt[a], damit wir deinen Namen anrufen; und wir werden dich in unserem Exil[b] preisen, weil wir alles Unrecht[c] unserer Väter, die vor dir[d] gesündigt haben, aus unserem Herzen entfernt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deine Furcht“. Gemeint ist die auf Gott gerichtete Furcht; sie kann auch Ehrfurcht einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in unserer Gefangenschaft“ beziehungsweise „in unserer Verbannung“. Das griechische Wort bezeichnet den Zustand der Verschleppung und des Lebens fern der Heimat.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „alle Ungerechtigkeit“ beziehungsweise „jedes Vergehen“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „gegen dich“. Wörtlicher lautet der griechische Ausdruck „vor dir“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Gibt den begründenden Rückbezug knapp und natürlich wieder; das einleitende ὅτι wird mit „Denn“ aufgenommen.
- source_word: ἔδωκας τὸν φόβον σου ἐπὶ καρδίαν ἡμῶν
  choice: hast du die Furcht vor dir in unser Herz gelegt
  rationale: „Gelegt“ gibt ἔδωκας im deutschen Ausdruck natürlich wieder. „Furcht vor dir“ bezeichnet eindeutig die auf Gott gerichtete Furcht, während „deine Furcht“ im Deutschen leicht als Gottes eigene Furcht missverstanden würde. Der Singular „Herz“ folgt dem griechischen καρδίαν.
- source_word: ἐπικαλεῖσθαι τὸ ὄνομά σου
  choice: damit wir deinen Namen anrufen
  rationale: Der Infinitiv wird als Zweck beziehungsweise Folge des göttlichen Handelns verstanden; „den Namen anrufen“ wahrt die biblische Gebets- und Bundesrede.
- source_word: ἐν τῇ ἀποικίᾳ ἡμῶν
  choice: in unserer Verbannung
  rationale: ἀποικία bezeichnet hier den Zustand der Deportation und des Lebens fern der Heimat. „Verbannung“ ist im Kontext klar und würdevoll.
- source_word: πᾶσαν ἀδικίαν
  choice: alles Unrecht
  rationale: Bewahrt den umfassenden moralischen Sinn von ἀδικία in natürlichem, gegenwärtigem Deutsch, ohne ihn nur auf gesellschaftliche Ungerechtigkeit zu verengen.
- source_word: ἀπεστρέψαμεν ἀπὸ καρδίας ἡμῶν
  choice: aus unserem Herzen entfernt haben
  rationale: Gibt die Abwendung beziehungsweise Beseitigung aus dem inneren Menschen verständlich wieder. Eine streng wörtliche Nachbildung mit „abwenden aus“ wäre im Deutschen unnatürlich.
- source_word: πατέρων ἡμῶν
  choice: unserer Väter
  rationale: Entspricht dem ausdrücklich maskulinen Plural und erhält die konkrete Rede von den Vorvätern.
- source_word: τῶν ἡμαρτηκότων ἐναντίον σου
  choice: die vor dir gesündigt haben
  rationale: „Vor dir“ bewahrt die räumlich-relationale Bildsprache von ἐναντίον und schließt zugleich die Verantwortung vor Gott ein.
theological_decisions:
- issue: Bedeutung von τὸν φόβον σου
  choice: die Furcht vor dir
  alternative: 'Ehrfurcht vor dir; wörtlich: deine Furcht'
  rationale: „Furcht“ bewahrt die Spannung zwischen Erschrecken, Ehrfurcht und gehorsamer Hinwendung. Das stärker deutende „Ehrfurcht“ würde diese Spannung vorschnell auflösen.
- issue: Bezug der Sünde der Väter
  choice: alles Unrecht unserer Väter, die vor dir gesündigt haben
  alternative: alles Unrecht unserer Vorfahren, die gegen dich gesündigt haben
  rationale: „Väter“ folgt dem Quelltext, und „vor dir“ bewahrt dessen Gegenwarts- und Verantwortungsbild, ohne die mögliche Bedeutung „gegen dich“ auszuschließen.
- issue: Verhältnis von göttlich gegebener Furcht und menschlichem Anrufen
  choice: damit wir deinen Namen anrufen
  alternative: sodass wir deinen Namen anrufen
  rationale: Die Zwecklesart ist im Zusammenhang gut begründet, doch der griechische Infinitiv kann auch eine Folge mitschwingen lassen; die Übersetzung legt keine weitergehende dogmatische Erklärung fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Biblische Schlüsselbilder wie Herz, Gottesfurcht, Name und Väter bleiben erhalten; missverständliche griechische Besitzkonstruktionen werden im Deutschen semantisch eindeutig, aber mit Fußnote wiedergegeben.
