base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/024.yaml
  text: O Israel[a], how great is the house of God, and how vast is the place of his possession;
translation:
  language: de
  text: O Israel, wie groß ist das Haus Gottes und wie weitläufig ist der Ort seines Besitzes[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Ort seiner Schöpfung“. Das griechische Wort kann Besitz beziehungsweise Eigentum, das Erworbene und in manchen Zusammenhängen auch die Schöpfung oder das Geschaffene bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Ἰσραήλ
  choice: O Israel
  rationale: Bewahrt die feierliche direkte Anrede des griechischen Vokativs; „O“ ist im Deutschen gehoben, aber weiterhin verständlich.
- source_word: ὡς μέγας
  choice: wie groß
  rationale: Gibt die ausrufende Kraft von ὡς mit dem Adjektiv wieder, statt daraus eine bloße Feststellung zu machen.
- source_word: ὁ οἶκος τοῦ θεοῦ
  choice: das Haus Gottes
  rationale: Die formnahe Wiedergabe lässt offen, ob an Gottes Wohnstätte, Tempel oder umfassenderen Bereich gedacht ist.
- source_word: ἐπιμήκης
  choice: wie weit erstreckt sich
  rationale: Das Wort bezeichnet große Länge beziehungsweise räumliche Ausdehnung. Die verbale deutsche Fassung klingt natürlich und vermittelt das räumliche Bild, ohne lediglich Größe zu wiederholen.
- source_word: ὁ τόπος
  choice: der Raum
  rationale: „Raum“ bewahrt den räumlichen Sinn und verbindet sich im Deutschen idiomatisch mit „erstreckt sich“; „Ort“ wäre hier unnötig punktuell und klänge mit der bezeichneten Ausdehnung schwerfällig.
- source_word: τῆς κτήσεως αὐτοῦ
  choice: seines Besitzes
  rationale: κτῆσις kann Besitz, Eigentum oder das Erworbene bezeichnen. „Seines Besitzes“ hält die Genitivkonstruktion fest und passt zum Bild von Gottes umfassendem Bereich; die mögliche Bedeutung „Schöpfung“ wird in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von κτήσεως im Verhältnis zu Gottes „Haus“ und „Raum“
  choice: seines Besitzes
  alternative: seiner Schöpfung
  rationale: Der unmittelbare Zusammenhang betont räumliche Größe und Ausdehnung, weshalb „Besitz“ naheliegt. Da κτῆσις jedoch auch auf das Geschaffene bezogen werden kann, wird diese theologisch bedeutsame Möglichkeit nicht ausgeschlossen, sondern als Alternative ausgewiesen.
translation_notes:
  register: Feierlich-dichterischer, zugleich moderner Standardstil. Die Anrede „O Israel“ erhält den erhöhten Ton; die übrige Syntax ist natürlich und gut verständlich. Das Ausrufezeichen bildet den exklamatorischen Charakter des griechischen Satzes ab.
