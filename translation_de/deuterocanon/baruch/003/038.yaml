  text: After this he appeared on the earth[a], and lived among men.
translation:
  language: de
  text: Danach erschien er auf der Erde[a] und lebte unter den Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde er auf der Erde gesehen und hielt sich unter den Menschen auf“.'
    reason: Bewahrt die formalere Wiedergabe von ὤφθη und eine mögliche Bedeutungsnuance von συνανεστράφη.
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: Danach
  rationale: Gibt die ausdrücklich zeitliche Abfolge knapp und natürlich wieder.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Bewahrt den umfassenden räumlichen Sinn der griechischen Wendung; „im Land“ wäre hier unnötig verengend.
- source_word: ὤφθη
  choice: erschien
  rationale: Die Aoristform von ὁράω kann formal „wurde gesehen“ und idiomatisch „erschien“ bedeuten. „Erschien“ ist im Deutschen natürlicher, ohne eine Art der Erscheinung festzulegen.
- source_word: ἐν τοῖς ἀνθρώποις
  choice: unter den Menschen
  rationale: ἀνθρώποις bezeichnet Menschen allgemein; die Formulierung ist geschlechtsübergreifend, präzise und idiomatisch.
- source_word: συνανεστράφη
  choice: lebte unter
  rationale: Das Verb bezeichnet den Umgang und das gemeinsame Leben mit anderen. „Lebte unter“ drückt die fortdauernde Gemeinschaft natürlich aus.
theological_decisions:
- issue: Bezug des unausgesprochenen männlichen Subjekts
  choice: „er“ beibehalten
  alternative: Das Subjekt als „sie“ auf die Weisheit beziehen oder den Satz ausdrücklich christologisch formulieren
  rationale: Das Subjekt ist im Vers selbst nicht genannt; die männliche Verbform knüpft grammatisch an den männlichen Bezug im vorausgehenden Kontext an. „Er“ wahrt diesen Zusammenhang, ohne die geschichtlich bedeutsame christologische Auslegung ausdrücklich in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unter den Menschen“ gibt die allgemeine menschliche Sphäre wieder; „erschien“ ist idiomatisch, während die Fußnote die formalere passive Lesart dokumentiert.
