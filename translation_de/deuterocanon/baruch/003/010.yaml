base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/010.yaml
  text: What is it, Israel? Why is it that you are in the land of enemies? You have grown old in a foreign land; you have become defiled with the dead,
translation:
  language: de
  text: Was ist mit dir, Israel?[a] Warum bist du im Land der Feinde? Du bist alt geworden in einem fremden Land; du bist mit den Toten unrein geworden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Was ist los, Israel?“ Die griechische Wendung τί ἐστιν kann als klagende Frage oder als Ausruf verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: „Mit den Toten unrein geworden“ kann sowohl an rituelle Unreinheit durch die Verbindung mit Toten als auch bildlich an einen Zustand wie den der Toten im Exil erinnern; der griechische Wortlaut lässt beides anklingen.
    reason: alternative_reading
lexical_decisions:
- source_word: τί ἐστιν
  choice: Was ist mit dir
  rationale: Die knappe griechische Wendung eröffnet eine klagende Frage. Die idiomatische deutsche Formulierung gibt diese Funktion wieder, ohne das anschließende τί ὅτι („warum“) vorwegzunehmen.
- source_word: ἐν γῇ τῶν ἐχθρῶν
  choice: im Land der Feinde
  rationale: Der Genitiv enthält kein ausdrückliches Possessivpronomen. „Der Feinde“ bleibt nahe am Wortlaut und ist im Deutschen natürlich verständlich.
- source_word: ἐπαλαιώθης
  choice: du bist alt geworden
  rationale: Die Form bezeichnet das Alt- oder Gealtertwerden und bewahrt das Bild eines langen Aufenthalts im Exil.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: in einem fremden Land
  rationale: ἀλλότριος bezeichnet hier ein Land, das einem anderen gehört beziehungsweise fremd ist. „Fremdes Land“ ist klar und gegenwärtig.
- source_word: συνεμιάνθης
  choice: du bist … unrein geworden
  rationale: Das Verb bezeichnet Verunreinigung, möglicherweise mit ritueller oder übertragener Bedeutung. „Unrein geworden“ gibt den erreichten Zustand wieder, ohne ihn ausschließlich moralisch oder rituell zu bestimmen.
- source_word: τοῖς νεκροῖς
  choice: mit den Toten
  rationale: Der Dativ lässt eine Verbindung oder Gemeinschaft mit den Toten erkennen. „Mit den Toten“ bewahrt sowohl den Anklang an Verunreinigung durch Tote als auch die bildliche Nähe zum Bereich des Todes.
theological_decisions:
- issue: Art der Unreinheit in συνεμιάνθης τοῖς νεκροῖς
  choice: Die offene Formulierung „mit den Toten unrein geworden“ bleibt erhalten.
  alternative: Rituell durch Berührung von Leichen verunreinigt; oder bildlich den Toten zugerechnet.
  rationale: Der griechische Text kann sowohl rituelle Unreinheit als auch einen bildlichen Zustand der Todesnähe im Exil anklingen lassen. Die Übersetzung entscheidet nicht zwischen diesen Deutungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Fragen bewahren den klagenden Ton; ungewöhnliche Bildsprache wird nicht geglättet, damit die Mehrdeutigkeit des griechischen Textes erhalten bleibt.
