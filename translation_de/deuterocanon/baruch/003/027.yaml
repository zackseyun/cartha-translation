base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/027.yaml
  text: God did not choose these[b][a], nor did he give them the way of knowledge.
translation:
  language: de
  text: Diese hat Gott nicht erwählt, und auch den Weg der Erkenntnis hat er ihnen nicht gegeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ τούτους ἐξελέξατο
  choice: Diese hat Gott nicht erwählt
  rationale: „Diese“ bewahrt die demonstrative und rückverweisende Kraft von τούτους. Die Voranstellung erhält den Nachdruck des griechischen Satzes, ohne den Bezug näher festzulegen.
- source_word: ὁ θεός
  choice: Gott
  rationale: Die übliche und sachlich genaue Wiedergabe von ὁ θεός.
- source_word: οὐδὲ
  choice: und … auch nicht
  rationale: Diese deutsche Fügung verbindet die zweite verneinte Aussage klar mit der ersten und gibt die fortgesetzte Negation von οὐδέ natürlich wieder.
- source_word: ὁδὸν ἐπιστήμης
  choice: den Weg der Erkenntnis
  rationale: Die Genitivverbindung wird formal bewahrt. „Erkenntnis“ passt zum Weisheitskontext und lässt offen, ob der Weg von Erkenntnis geprägt ist oder zu ihr führt.
- source_word: ἔδωκεν αὐτοῖς
  choice: er hat ihnen … gegeben
  rationale: Dies entspricht der Grundbedeutung von ἔδωκεν mit dem Dativ αὐτοῖς und ist idiomatisches modernes Deutsch.
theological_decisions:
- issue: Demonstrativpronomen oder schlichtes Personalpronomen für τούτους
  choice: Diese
  alternative: sie
  rationale: Das Demonstrativpronomen verweist betont auf die zuvor genannten Gestalten oder Gruppen. Ein bloßes „sie“ würde diese rhetorische Markierung abschwächen.
- issue: Deutung von ὁδὸν ἐπιστήμης
  choice: den Weg der Erkenntnis
  alternative: den Weg zur Erkenntnis
  rationale: „Weg der Erkenntnis“ bewahrt die griechische Genitivkonstruktion und entscheidet nicht, ob Erkenntnis Ziel, Kennzeichen oder Inhalt des Weges ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die substantivische Form „Diese“ erhält den demonstrativen Nachdruck des Griechischen; „Weg der Erkenntnis“ bewahrt die weisheitliche Bildsprache und ihre Mehrdeutigkeit.
