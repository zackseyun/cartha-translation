translation:
  language: de
  text: denn die, die Silber bearbeiten und besorgt sind, deren Werke sind nicht zu ergründen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und es gibt kein Ergründen ihrer Werke“. Der griechische Satz ist knapp und nicht ganz eindeutig. „Werke“ kann sowohl die kunstvollen Erzeugnisse als auch das Tun dieser Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: denn
  rationale: Leitet eine begründende beziehungsweise erläuternde Fortsetzung des vorangehenden Gedankens ein; „denn“ ist in diesem fragmentarischen Satzanschluss natürlich und würdevoll.
- source_word: οἱ τὸ ἀργύριον τεκταίνοντες
  choice: die, die Silber bearbeiten
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet Menschen nach ihrer Tätigkeit. τεκταίνω meint hier das handwerkliche Bearbeiten oder Gestalten, während ἀργύριον konkret als „Silber“ verstanden wird.
- source_word: μεριμνῶντες
  choice: sich sorgen
  rationale: Das Partizip bezeichnet besorgtes, von Mühe oder Unruhe geprägtes Kümmern. „Sich sorgen“ bewahrt diese Spannung, ohne lediglich neutrale Beschäftigung auszudrücken.
- source_word: οὐκ ἔστιν ἐξεύρεσις τῶν ἔργων αὐτῶν
  choice: ihre Werke sind nicht zu ergründen
  rationale: Die idiomatische deutsche Fassung gibt die abstrakte griechische Wendung „es gibt kein Herausfinden ihrer Werke“ wieder und lässt ἔργα bewusst als „Werke“ stehen, statt es auf Erzeugnisse oder Taten einzuengen.
theological_decisions:
- issue: Bezug und Aussage der schwer verständlichen Schlussklausel
  choice: 'Die Mehrdeutigkeit bleibt bestehen: „ihre Werke“ kann sowohl die handwerklichen Erzeugnisse als auch das gesamte Tun der Genannten bezeichnen.'
  alternative: Die Aussage ausdrücklich auf die Unfähigkeit der Handwerker beziehen, Weisheit zu entdecken.
  rationale: Der griechische Wortlaut nennt Weisheit in diesem Vers nicht ausdrücklich und erlaubt keine sichere Festlegung auf eine bestimmte theologische Deutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Gedankenstrich macht den abrupten griechischen Satzbau lesbar, ohne die inhaltliche Spannung aufzulösen.
