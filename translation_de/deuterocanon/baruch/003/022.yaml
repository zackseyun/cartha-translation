translation:
  language: de
  text: Weder hörte man in Kanaan von ihr[a], noch wurde sie in Teman gesehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Weisheit, von der im Zusammenhang die Rede ist; im Griechischen bleibt das Subjekt dieses Verses unausgesprochen.
    reason: Das Deutsche verwendet hier ein Pronomen, während der griechische Text das aus dem Kontext erschließbare Subjekt nicht wiederholt.
lexical_decisions:
- source_word: οὐδὲ
  choice: auch … nichts / und … nicht
  rationale: Die wiederholte Partikel führt die verneinende Reihe aus dem vorherigen Zusammenhang fort. Die variierte deutsche Formulierung gibt die kumulative Verneinung natürlich wieder.
- source_word: ἠκούσθη
  choice: hörte man nichts von ihr
  rationale: Der Aorist Passiv von ἀκούω meint hier im Zusammenhang nicht bloß akustisches Hören, sondern dass von der Weisheit dort nichts zu hören beziehungsweise nichts bekannt war. Die unpersönliche deutsche Wendung ist natürlich und wahrt den passiven Sinngehalt.
- source_word: ἐν
  choice: in
  rationale: Die Präposition bezeichnet hier bei beiden Ortsnamen den geografischen Bereich.
- source_word: Χαναὰν
  choice: Kanaan
  rationale: Dies ist die im Deutschen übliche biblische Form des Ortsnamens.
- source_word: ὤφθη
  choice: wurde sie gesehen
  rationale: Der Aorist Passiv von ὁράω wird direkt wiedergegeben und bewahrt das Bild des Sehens neben dem Hören.
- source_word: Θαιμάν
  choice: Teman
  rationale: Dies ist die im Deutschen übliche biblische Form des Ortsnamens.
theological_decisions:
- issue: Unausgesprochenes Subjekt der beiden Passivverben
  choice: Das im Kontext gemeinte feminine Bezugswort „Weisheit“ wird durch die Pronomen „ihr/sie“ aufgenommen, ohne das Substantiv in den Vers einzufügen.
  alternative: 'Das Substantiv ausdrücklich ergänzen: „Auch von der Weisheit hörte man in Kanaan nichts …“'
  rationale: Im Griechischen bleibt das Subjekt unausgesprochen und ergibt sich aus dem Zusammenhang. Da das Deutsche ein Bezugswort benötigt, bewahren die Pronomen die Ellipse so weit wie möglich; die Fußnote macht den Bezug transparent, ohne die Weisheit ausdrücklich in den Haupttext einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion „hörte man nichts von ihr“ ist idiomatischer als ein schwerfälliges deutsches Passiv und vermittelt im Kontext, dass die Weisheit dort nicht bekannt war. Der Parallelismus von Hören und Sehen bleibt erhalten.
