base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/033.yaml
  text: He sends out the light[a], and it goes; he called it, and it obeyed him with trembling.
translation:
  language: de
  text: Er sendet das Licht aus[a], und es geht; er rief es, und es gehorchte ihm mit Zittern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »der das Licht aussendet, und es geht«. Das Griechische beginnt mit einem substantivisch gebrauchten Partizip, das Gott kennzeichnend beschreibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀποστέλλων
  choice: Er sendet … aus
  rationale: Das artikulierte Partizip bezeichnet substantivisch Gott als den, der das Licht aussendet. Die finite Form klingt im Deutschen natürlich und bewahrt die charakteristische, fortdauernde Handlung; die formale Struktur wird in der Fußnote angegeben.
- source_word: τὸ φῶς
  choice: das Licht
  rationale: Der Artikel wird beibehalten. Im Zusammenhang ist das kosmische Licht gemeint, das Gottes Befehl untersteht.
- source_word: πορεύεται
  choice: es geht
  rationale: Die schlichte Wiedergabe erhält die Personifikation und entspricht dem präsentischen griechischen Verb, ohne die Bewegung näher zu bestimmen.
- source_word: ἐκάλεσεν
  choice: er rief es
  rationale: Die Vergangenheitsform bildet den Aorist ab. »Rief« wahrt die persönliche Bildsprache und legt nicht stärker als der Ausgangstext einen förmlichen Befehl fest.
- source_word: ὑπήκουσεν αὐτῷ
  choice: es gehorchte ihm
  rationale: ὑπακούω bezeichnet hier die gehorsame Reaktion der Schöpfung auf Gottes Ruf; »gehorchte« gibt dies im Deutschen klar wieder.
- source_word: τρόμῳ
  choice: mit Zittern
  rationale: Der Dativ wird adverbial wiedergegeben. »Mit Zittern« bewahrt das anschauliche, personifizierende Bild.
theological_decisions:
- issue: Personifizierung des Lichts als Gott gehorchende Schöpfung
  choice: Die Personifizierung bleibt unmittelbar im Haupttext erhalten.
  alternative: Die Aussage als unpersönliche Beschreibung der Naturordnung abschwächen.
  rationale: Der griechische Text spricht ausdrücklich davon, dass das Licht geht, gerufen wird und mit Zittern gehorcht. Dieses Bild unterstreicht Gottes Herrschaft über die Schöpfung.
- issue: Bezug und Form von ὁ ἀποστέλλων
  choice: Das substantivische Partizip wird im Haupttext mit dem auf Gott bezogenen Pronomen »Er« als finiter Satz wiedergegeben.
  alternative: »Der das Licht aussendet« beziehungsweise »Derjenige, der das Licht aussendet«.
  rationale: Der Zusammenhang identifiziert Gott eindeutig als Handelnden. Die finite Form ist im modernen Deutschen natürlicher, während die Fußnote die formale griechische Konstruktion offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen Satzglieder und der Wechsel vom Präsens zum Präteritum folgen dem griechischen Text; die poetische Personifizierung wird nicht geglättet.
