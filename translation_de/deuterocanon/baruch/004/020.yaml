base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/020.yaml
  text: I have taken off the robe of peace[a], but I have put on the sackcloth of my supplication[b]; I will cry out to the Eternal One in my days.
translation:
  language: de
  text: Ich habe das Gewand des Friedens abgelegt und das Sacktuch[a] meines Flehens angelegt; ich werde während meiner Lebenszeit zum Ewigen[b] rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sacktuch war ein grober Stoff, der als Zeichen von Trauer, Reue oder großer Not getragen wurde.
    reason: cultural_note
  - marker: b
    text: 'Oder: »zum Immerwährenden«. Der griechische Gottestitel bedeutet wörtlich »der Ewige« beziehungsweise »der Immerwährende«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδυσάμην
  choice: ich habe … abgelegt
  rationale: Der Aorist Medium von ἐκδύω bezeichnet hier das Ablegen eines Kleidungsstücks. »Abgelegt« ist im Deutschen natürlich und bewahrt das Bild.
- source_word: τὴν στολὴν τῆς εἰρήνης
  choice: das Gewand des Friedens
  rationale: στολή bezeichnet ein Gewand, oft ein langes oder würdevolles Kleidungsstück. Der Genitiv εἰρήνης bleibt als bildhafte Zuordnung erhalten.
- source_word: ἐνεδυσάμην
  choice: ich habe … angelegt
  rationale: Der Aorist Medium von ἐνδύω bildet den bewussten Gegenpol zu »abgelegt«. »Angelegt« erhält den parallelen Kleidungswechsel.
- source_word: σάκκον
  choice: Sacktuch
  rationale: Der etablierte biblische Ausdruck bezeichnet groben Stoff beziehungsweise ein daraus gefertigtes Trauergewand. Die knappe Wiedergabe bewahrt das kulturelle Bild; eine Fußnote erläutert es.
- source_word: τῆς δεήσεώς μου
  choice: meines Flehens
  rationale: δέησις meint eine dringliche Bitte oder inständige Fürbitte. »Flehen« gibt die Eindringlichkeit stärker wieder als das allgemeinere »Gebet«.
- source_word: κεκράξομαι
  choice: ich werde … rufen
  rationale: Das Futur von κράζω bezeichnet lautes, dringliches Rufen. Im Zusammenhang vermittelt »rufen« die Hinwendung an Gott, ohne ein zusätzliches Objekt wie »um Hilfe« einzutragen.
- source_word: πρὸς τὸν αἰώνιον
  choice: zum Ewigen
  rationale: Das substantivierte Adjektiv bezeichnet »den Ewigen«. Die Formulierung bleibt als eigenständiger Gottestitel sichtbar und wird nicht zu »Gott« oder »Herr« normalisiert.
- source_word: ἐν ταῖς ἡμέραις μου
  choice: während meiner Lebenszeit
  rationale: Die Wendung bedeutet wörtlich »in meinen Tagen« und bezeichnet die Zeit des eigenen Lebens. »Während meiner Lebenszeit« ist natürliches modernes Deutsch, ohne das im Griechischen nicht ausdrücklich stehende »alle« hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottestitels τὸν αἰώνιον
  choice: zum Ewigen
  alternative: zum Immerwährenden
  rationale: Das Griechische verwendet ein substantiviertes Adjektiv mit der Bedeutung »der Ewige/Immerwährende«. Die Übersetzung erhält diesen besonderen Titel, statt ihn konfessionell oder traditionell zu »Gott« beziehungsweise »Herr« zu vereinheitlichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Kleidungswechsel wird durch »abgelegt« und »angelegt« hörbar gemacht. »Während meiner Lebenszeit« vermeidet das im Deutschen ungebräuchliche »in meinen Tagen«, ohne die Wendung zu »mein Leben lang« zu verstärken. Die Fußnotenmarker wurden den jeweils erläuterten Ausdrücken unmittelbar zugeordnet.
