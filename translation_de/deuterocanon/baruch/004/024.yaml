  terminology: „Gefangenschaft“ ist präzise für αἰχμαλωσία, „Heil“ ist für σωτηρία in diesem zugleich restaurativen und theologisch geprägten Kontext gut vertretbar, und „der Ewige“ gibt das substantivierte griechische Adjektiv titelartig wieder, ohne ein nicht wiederholtes „Gott“ hinzuzufügen. Die Fußnoten bieten sachgerechte lexikalische Alternativen.
