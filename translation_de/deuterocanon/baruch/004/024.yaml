  source_fidelity: 'Der deutsche Text gibt die Satzfügung und den Sinn des Griechischen zuverlässig wieder: Die Nachbarn Zions haben die Gefangenschaft gesehen und werden bald das von ihrem Gott kommende Heil sehen. „Schon bald“ entspricht ἐν τάχει, und der Relativsatz bezieht sich korrekt auf „Heil“. „Mit großer Herrlichkeit und dem Glanz des Ewigen“ wahrt die feierliche Doppelung von δόξα und λαμπρότης sowie den Genitiv zu τοῦ αἰωνίου.'
