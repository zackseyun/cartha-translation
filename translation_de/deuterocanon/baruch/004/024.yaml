base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/024.yaml
  text: For just as the neighbors of Zion have now seen your captivity[b][a], so they will soon see the salvation from your God that will come upon you with great glory and the splendor of the Eternal.
translation:
  language: de
  text: Denn wie jetzt die Nachbarn Zions eure Gefangenschaft gesehen haben, so werden sie schon bald das Heil[a] von eurem Gott sehen, das mit großer Herrlichkeit und dem Glanz des Ewigen[b] zu euch kommen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Rettung“ bzw. „die Befreiung“. Das griechische Wort kann sowohl konkrete Rettung als auch Heil im umfassenderen Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „des Ewigseienden“. Im Griechischen steht ein substantiviertes Adjektiv als Bezeichnung für Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάροικοι Σειὼν
  choice: die Nachbarn Zions
  rationale: πάροικοι bezeichnet hier am natürlichsten die in Zions Umgebung lebenden Menschen bzw. Völker. „Nachbarn Zions“ ist verständlich und legt keinen rechtlichen Status als Fremde oder Beisassen fest.
- source_word: αἰχμαλωσίαν
  choice: Gefangenschaft
  rationale: Das Wort bezeichnet den Zustand des Gefangenseins bzw. der Wegführung. „Gefangenschaft“ bewahrt den konkreten Sinn deutlicher als das allgemeinere „Exil“.
- source_word: ἐν τάχει
  choice: schon bald
  rationale: Die Wendung bezeichnet zeitliche Nähe. „Schon bald“ passt idiomatisch zur zukünftigen Verheißung.
- source_word: σωτηρίαν
  choice: Heil
  rationale: σωτηρία kann Rettung, Befreiung oder Heil bedeuten. „Heil“ bewahrt die umfassende biblisch-theologische Bedeutung, ohne die im Zusammenhang enthaltene Befreiung aus der Gefangenschaft auszuschließen.
- source_word: παρὰ τοῦ θεοῦ ὑμῶν
  choice: von eurem Gott
  rationale: παρά mit Genitiv bezeichnet hier Ursprung oder Quelle. Die Wiedergabe folgt der griechischen Formulierung unmittelbar.
- source_word: ἐπελεύσεται ὑμῖν
  choice: zu euch kommen wird
  rationale: ἐπέρχομαι bezeichnet ein Herankommen oder Eintreffen. „Zu euch kommen“ ist im Deutschen natürlich und vermeidet den vorwiegend unheilvollen Beiklang von „über euch kommen“.
- source_word: μετὰ δόξης μεγάλης
  choice: mit großer Herrlichkeit
  rationale: δόξα trägt im biblischen Griechisch besonders im göttlichen Zusammenhang den Sinn von Herrlichkeit. Die Formulierung erhält diesen feierlichen Klang.
- source_word: λαμπρότητος
  choice: dem Glanz
  rationale: λαμπρότης bezeichnet Glanz, Leuchten oder Pracht. „Glanz“ gibt das Bild prägnant wieder und verbindet sich natürlich mit dem göttlichen Titel.
- source_word: τοῦ αἰωνίου
  choice: des Ewigen
  rationale: Das substantivierte Adjektiv bezeichnet Gott als den Ewigen. Die Übersetzung bewahrt den titelartigen Gebrauch, ohne das im Griechischen nicht wiederholte Substantiv „Gott“ einzufügen.
theological_decisions:
- issue: Wiedergabe von σωτηρία im Zusammenhang der Wiederherstellung
  choice: Heil
  alternative: Rettung oder Befreiung
  rationale: Der unmittelbare Zusammenhang spricht von Befreiung aus der Gefangenschaft, doch σωτηρία besitzt zugleich eine weiter reichende heilsgeschichtliche Bedeutung. „Heil“ lässt beide Ebenen offen.
- issue: Wiedergabe von τοῦ αἰωνίου als Gottesbezeichnung
  choice: des Ewigen
  alternative: des Ewigseienden oder des ewigen Gottes
  rationale: Der griechische Text verwendet ein substantiviertes Adjektiv. „Der Ewige“ erhält diese knappe Gottesbezeichnung und fügt kein ausdrücklich fehlendes Substantiv hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau des griechischen Textes bleibt erhalten; „schon bald“ und „zu euch kommen“ sorgen zugleich für natürliche Verständlichkeit. Die Gottesbezeichnung „der Ewige“ wahrt den feierlichen, titelartigen Charakter.
