  text: Look toward the east, Jerusalem, and see the joy that is coming to you from God.
translation:
  language: de
  text: Blicke nach Osten, Jerusalem, und sieh die Freude, die von Gott zu dir kommt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίβλεψαι
  choice: Blicke
  rationale: Der Aoristimperativ fordert Jerusalem auf, den Blick in die angegebene Richtung zu wenden. „Blicke“ ist würdig und natürlich; die Zielrichtung wird durch „nach Osten“ ausgedrückt.
- source_word: πρὸς ἀνατολάς
  choice: nach Osten
  rationale: ἀνατολαί kann wörtlich „Aufgänge“ bezeichnen, meint hier aber idiomatisch die Himmelsrichtung Osten. „Nach Osten“ ist im Deutschen die natürliche Verbindung mit „blicken“.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Die etablierte deutsche Form des Ortsnamens wird beibehalten.
- source_word: ἴδε
  choice: sieh
  rationale: Der Imperativ wird knapp und unmittelbar wiedergegeben, ohne das altertümlich wirkende „siehe“.
- source_word: εὐφροσύνην
  choice: die Freude
  rationale: „Freude“ gibt die Grundbedeutung klar, geläufig und kontextgerecht wieder.
- source_word: τὴν παρὰ τοῦ θεοῦ
  choice: die von Gott
  rationale: παρά mit Genitiv bezeichnet die Herkunft; „von Gott“ bewahrt diese Quellenangabe direkt.
- source_word: σοι
  choice: zu dir
  rationale: Der Dativ bezieht sich auf das personifiziert angeredete Jerusalem. Mit dem Bewegungsverb „kommt“ drückt „zu dir“ das Ziel idiomatisch aus.
- source_word: ἐρχομένην
  choice: kommt
  rationale: Das präsentische Partizip bezeichnet die herannahende Freude. Der deutsche Relativsatz „die … kommt“ ist natürlich und wahrt den Vorgang des Kommens.
theological_decisions:
- issue: Personifizierung Jerusalems
  choice: Jerusalem bleibt als direkt angeredete Stadt personifiziert
  alternative: Die Aussage unpersönlich auf die Bewohner Jerusalems beziehen
  rationale: Die beiden Imperative und die Anrede Ἰερουσαλήμ stellen die Stadt als angesprochene Person dar. Diese prophetisch-poetische Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Imperative „Blicke … und sieh“ erhalten den prophetischen Aufforderungscharakter; auf archaisches „siehe“ wird verzichtet.
