base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/004.yaml
  text: We are blessed[a], O Israel[b], because what is pleasing to God is known to us.
translation:
  language: de
  text: Glücklich zu preisen sind wir[a], Israel, denn was Gott gefällt, ist uns bekannt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „glücklich“ oder „selig“. Das griechische Wort bezeichnet einen Zustand besonderen Glücks oder Segens.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Denn die Dinge, die Gott gefallen, sind uns bekannt.“'
    reason: literal_rendering
lexical_decisions:
- source_word: μακάριοί
  choice: glücklich zu preisen
  rationale: Die Wendung bezeichnet einen begünstigten, beneidenswerten Zustand und nicht bloß ein momentanes Glücksgefühl. „Glücklich zu preisen“ gibt diesen Sinn in natürlichem, würdigem Deutsch wieder.
- source_word: ἐσμεν
  choice: sind wir
  rationale: Der Präsensindikativ von εἰμί wird ausdrücklich wiedergegeben; die Wortstellung hebt den zugesprochenen Zustand hervor.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Der Vokativ wird im Deutschen durch die direkte Anrede „Israel“ natürlich ausgedrückt; ein zusätzliches „o“ wäre möglich, wirkt heute aber stärker altertümlich.
- source_word: τὰ ἀρεστὰ
  choice: was ... gefällt
  rationale: Das substantivierte Neutrum Plural bezeichnet das, was wohlgefällig oder annehmbar ist. Die deutsche Singularkonstruktion mit „was“ ist idiomatisch und bewahrt die inhaltliche Weite.
- source_word: τοῦ θεοῦ
  choice: Gott
  rationale: 'In Verbindung mit ἀρεστά wird der Genitiv sinngemäß als die Person wiedergegeben, der etwas gefällt: „was Gott gefällt“.'
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet diejenigen, denen dieses Wissen zugänglich beziehungsweise bekannt ist.
- source_word: γνωστά
  choice: bekannt
  rationale: Das Prädikatsadjektiv bedeutet „bekannt“. Eine Wiedergabe mit „offenbart“ oder „bekannt gemacht“ würde einen Vorgang ausdrücken, den der griechische Wortlaut nicht ausdrücklich nennt.
theological_decisions:
- issue: Art des Vorrechts Israels
  choice: Israel wird glücklich gepriesen, weil ihm bekannt ist, was Gott gefällt.
  alternative: Die Aussage ausdrücklich auf das Gesetz beziehungsweise die Tora zu verengen.
  rationale: Im Zusammenhang des Baruchbuches klingt die Unterweisung durch die Tora deutlich an; der griechische Wortlaut spricht hier jedoch weiter gefasst von dem, „was Gott gefällt“. Diese Offenheit bleibt in der Übersetzung erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. Die direkte Anrede „Israel“ bleibt ohne das heute altertümlich wirkende „o“. Die Formulierung „glücklich zu preisen“ bewahrt den stärkeren Sinn von μακάριοι, ohne eine konfessionell geprägte Deutung einzutragen.
