base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/025.yaml
  text: Children[a], endure patiently the wrath that has come upon you from God. The enemy pursued you, but you will soon see his destruction, and you will step upon their necks.
translation:
  language: de
  text: Kinder, ertragt geduldig den Zorn, der von Gott über euch gekommen ist. Der Feind verfolgte dich; doch du wirst bald seinen Untergang sehen und auf ihre Hälse treten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen wechselt die Bezeichnung des Feindes vom Singular zum Plural: „seinen Untergang … ihre Hälse“. So kann der Feind zugleich als einzelner Gegner und als eine Mehrzahl feindlicher Mächte erscheinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Kinder
  rationale: Der Vokativ Plural ist eine herzliche Anrede. „Kinder“ bewahrt dies, ohne ein im Griechischen nicht vorhandenes „meine“ hinzuzufügen.
- source_word: μακροθυμήσατε
  choice: ertragt geduldig
  rationale: Der Aoristimperativ fordert zu geduldiger Ausdauer unter dem gegenwärtigen Leid auf.
- source_word: ὀργήν
  choice: Zorn
  rationale: „Zorn“ gibt im Zusammenhang mit Gott die starke, auch gerichtliche Bedeutung des griechischen Ausdrucks angemessen wieder.
- source_word: ἐπελθοῦσαν ὑμῖν
  choice: der ... über euch gekommen ist
  rationale: Die Partizipialkonstruktion beschreibt den Zorn als etwas, das die Angeredeten bereits getroffen hat und nun auf ihnen liegt.
- source_word: κατεδίωξέν
  choice: hat ... verfolgt
  rationale: Das Verb bezeichnet feindseliges Verfolgen und bleibt offen genug für militärische oder politische Bedrängnis.
- source_word: ὄψει αὐτοῦ τὴν ἀπώλειαν
  choice: du wirst seinen Untergang sehen
  rationale: „Untergang“ bezeichnet hier die Vernichtung beziehungsweise das endgültige Scheitern des Feindes; das Singularpronomen wird bewahrt.
- source_word: ἐν τάχει
  choice: bald
  rationale: Die adverbiale Wendung drückt zeitliche Nähe aus und wird im Deutschen natürlich mit „bald“ wiedergegeben.
- source_word: ἐπὶ τραχήλους αὐτῶν ἐπιβήσῃ
  choice: du wirst ihren Nacken den Fuß setzen
  rationale: Die konkrete Siegesmetapher wird beibehalten. Der Numeruswechsel vom einzelnen Feind zu mehreren Gegnern bleibt sichtbar.
theological_decisions:
- issue: Göttliche Herkunft des Zorns
  choice: „den Zorn, der von Gott über euch gekommen ist“
  alternative: „die Strafe, die euch von Gott getroffen hat“
  rationale: Das Griechische nennt ausdrücklich Zorn und dessen Herkunft von Gott. Die Übersetzung mildert dies weder zu einer bloßen Folge ab noch deutet sie es erklärend als „Strafe“.
- issue: Bild des Sieges über die Feinde
  choice: „ihren Nacken den Fuß setzen“
  alternative: „über sie triumphieren“
  rationale: Das körperlich-konkrete Bild der Unterwerfung wird nicht in eine abstrakte Aussage über den Sieg aufgelöst.
- issue: Wechsel von Singular zu Plural beim Feind
  choice: „seinen Untergang ... ihren Nacken“
  alternative: einheitlich Singular oder Plural
  rationale: Der auffällige Wechsel des griechischen Textes wird bewahrt, sodass der Feind zugleich als einzelne Gestalt und als kollektive Macht erscheinen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „Kinder“ bleibt schlicht und herzlich. Der Numeruswechsel zwischen „euch“ und „dich“ sowie zwischen „seinen“ und „ihren“ wird trotz seiner Auffälligkeit source-grounded erhalten; die Fußnote erklärt nur den letztgenannten Wechsel.
