translation:
  language: de
  text: Denn seht die Gefangenschaft[a] meiner Söhne und Töchter an, die der Ewige[b] über sie gebracht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verschleppung“. Das griechische Wort kann Gefangenschaft im weiteren Sinn bezeichnen, einschließlich der Deportation ins Exil.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Ewigwährende“. Im Griechischen steht der Gottestitel ὁ αἰώνιος, wörtlich „der Ewige“ beziehungsweise „der Ewigwährende“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: 'Denn seht:'
  rationale: γάρ begründet das Vorhergehende; ἰδού lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. „Denn seht:“ gibt beides in natürlichem, würdigem Deutsch wieder.
- source_word: τὴν αἰχμαλωσίαν
  choice: die Gefangenschaft
  rationale: αἰχμαλωσία bezeichnet die durch Eroberung verursachte Gefangenschaft und kann auch die Verschleppung ins Exil einschließen. „Gefangenschaft“ bewahrt den Zwangsaspekt.
- source_word: τῶν υἱῶν μου καὶ τῶν θυγατέρων
  choice: meiner Söhne und Töchter
  rationale: Der griechische Text nennt beide Gruppen ausdrücklich; die Paarung wird daher nicht zu „Kinder“ verallgemeinert.
- source_word: ἐπήγαγεν αὐτοῖς
  choice: über sie gebracht hat
  rationale: ἐπάγω bedeutet hier, etwas über jemanden kommen zu lassen beziehungsweise über jemanden zu bringen. Die Formulierung erhält die verursachende Aussage.
- source_word: ὁ αἰώνιος
  choice: der Ewige
  rationale: Das substantivierte Adjektiv ist ein eigenständiger Gottestitel. „Der Ewige“ gibt ihn knapp wieder, ohne „Gott“ oder „Herr“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottestitels ὁ αἰώνιος
  choice: der Ewige
  alternative: der Ewigwährende; der ewige Gott
  rationale: Der besondere Titel wird als solcher bewahrt und weder zu „der Herr“ normalisiert noch durch das im Griechischen nicht stehende Substantiv „Gott“ erweitert.
- issue: Göttliche Verursachung der Gefangenschaft
  choice: die der Ewige über sie gebracht hat
  alternative: die über sie kam
  rationale: Das aktive Verb ἐπήγαγεν mit Gott als Subjekt wird nicht abgeschwächt; dadurch bleibt die theologische Spannung der ausdrücklichen göttlichen Verursachung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach „seht“ bildet die aufmerksamkeitslenkende Funktion von ἰδού ab. Die ausdrückliche Nennung von Söhnen und Töchtern sowie der besondere Gottestitel bleiben erhalten.
