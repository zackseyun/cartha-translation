  language: en
  yaml_path: translation/deuterocanon/baruch/004/005.yaml
  text: Take courage[a], my people, the memorial of Israel.
translation:
  language: de
  text: Fasst Mut, mein Volk, du Gedächtnis Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du Erinnerungszeichen Israels“. Das griechische Wort kann Erinnerung oder Gedenken, aber auch ein konkretes Erinnerungszeichen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: Fasst Mut
  rationale: Der Imperativ Plural fordert unmittelbar zu Mut und Zuversicht auf. „Fasst Mut“ ist im heutigen Deutsch natürlich und wahrt Numerus und Aufforderungscharakter.
- source_word: λαός μου
  choice: mein Volk
  rationale: Die direkte Anrede gibt sowohl das Besitzverhältnis als auch den gemeinschaftlichen Sinn knapp und würdig wieder.
- source_word: μνημόσυνον
  choice: Erinnerungszeichen
  rationale: Das Substantiv kann sowohl Erinnerung beziehungsweise Gedenken als auch ein konkretes Erinnerungszeichen bezeichnen. „Erinnerungszeichen“ bewahrt hier den nominalen und bildhaften Charakter besser als eine rein abstrakte Wiedergabe.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Sinn und syntaktische Funktion von μνημόσυνον Ἰσραήλ
  choice: 'Als zweite, appositionelle Anrede wiedergegeben: „mein Volk, du Erinnerungszeichen Israels“'
  alternative: „mein Volk, du Gedenken Israels“ beziehungsweise eine deutende Auflösung wie „mein Volk, an das Israel sich erinnert“
  rationale: Der griechische Text bietet nach „mein Volk“ eine verblos angeschlossene Apposition und erklärt das Bild nicht. Das eingefügte „du“ kennzeichnet im Deutschen lediglich die Anrede, ohne die metaphorische Spannung inhaltlich aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Metapher des griechischen Textes bleibt erhalten; „du“ macht die appositionelle Anrede auf natürliche Weise verständlich.
