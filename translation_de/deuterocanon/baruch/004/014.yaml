base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/014.yaml
  text: Let the neighboring women of Zion come, let the neighboring women come, and remember the captivity of my sons and daughters, which the Eternal One brought upon them.
translation:
  language: de
  text: Die Nachbarinnen Zions sollen kommen, die Nachbarinnen sollen kommen,[a] und denkt an die Gefangenschaft meiner Söhne und Töchter, die der Ewige über sie gebracht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aufforderung „die Nachbarinnen sollen kommen“ wird wiederholt; nur beim ersten Mal steht „Zions“ dabei. Das griechische Wort kann auch Frauen bezeichnen, die als Fremde oder Ansässige in einer Gegend wohnen.
    reason: Die Wiederholung und die Bedeutungsbreite von πάροικοι sollen erkennbar bleiben.
lexical_decisions:
- source_word: ἐλθάτωσαν
  choice: sollen kommen
  rationale: Der Imperativ der dritten Person wird im modernen Deutschen natürlich durch „sollen kommen“ wiedergegeben.
- source_word: αἱ πάροικοι
  choice: die Nachbarinnen
  rationale: Artikel und Adjektiv sind feminin plural; πάροικος kann Menschen bezeichnen, die in der Nähe oder als Fremde ansässig sind. Im Kontext ist „Nachbarinnen“ eine natürliche, geschlechtsgenaue Wiedergabe, während die weitere Bedeutungsbreite in der Fußnote erhalten bleibt.
- source_word: Σειών
  choice: Zion
  rationale: „Zion“ ist die geläufige deutsche Namensform.
- source_word: μνήσθητε
  choice: denkt an
  rationale: Der Imperativ bedeutet „erinnert euch“ bzw. „gedenkt“. „Denkt an“ ist gegenwärtiges, verständliches Deutsch und passt mit dem Akkusativobjekt gut.
- source_word: τὴν αἰχμαλωσίαν
  choice: die Gefangenschaft
  rationale: αἰχμαλωσία bezeichnet die kriegsbedingte Gefangenschaft oder Verschleppung; „Gefangenschaft“ bewahrt den konkreten Sinn.
- source_word: τῶν υἱῶν μου καὶ θυγατέρων
  choice: meiner Söhne und Töchter
  rationale: Die ausdrücklich genannten beiden Gruppen werden unverändert bewahrt.
- source_word: ὁ αἰώνιος
  choice: der Ewige
  rationale: Das substantivierte Adjektiv fungiert als Gottesbezeichnung; „der Ewige“ ist im Deutschen würdig, klar und traditionsübergreifend.
- source_word: ἐπήγαγεν αὐτοῖς
  choice: über sie gebracht hat
  rationale: Die Formulierung gibt das Verursachen eines über Menschen kommenden Unheils wieder, ohne die stärkere Deutung „ihnen zugefügt“ einzutragen.
theological_decisions:
- issue: Gottesbezeichnung ὁ αἰώνιος
  choice: der Ewige
  alternative: der Ewigseiende; der Unvergängliche
  rationale: Der griechische Text verwendet einen göttlichen Beinamen und keinen Eigennamen. „Der Ewige“ bewahrt diesen Titelcharakter, ohne einen nicht vorhandenen Gottesnamen einzusetzen.
- issue: Bedeutung von αἱ πάροικοι
  choice: die Nachbarinnen
  alternative: die Beisassinnen; die als Fremde Ansässigen; die Nachbarinnen bzw. Bewohnerinnen der Umgebung
  rationale: Die feminine Pluralform wird sichtbar gemacht. Da das Wort sowohl räumliche Nähe als auch den Status fremder Ansässiger ausdrücken kann, wird die Mehrdeutigkeit in einer Fußnote offengelegt.
- issue: Göttliches Handeln bei der Gefangenschaft
  choice: die der Ewige über sie gebracht hat
  alternative: die der Ewige ihnen auferlegt hat
  rationale: Die kausale Aussage des Textes wird nicht abgeschwächt; zugleich vermeidet die Übersetzung eine über den griechischen Wortlaut hinausgehende Bestimmung der Art göttlicher Verursachung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die feminine Form des Griechischen und die emphatische Wiederholung werden bewahrt; eine Fußnote dokumentiert die lexikalische Mehrdeutigkeit.
