revisions:
- from: Niemand soll sich schadenfroh über mich freuen[a], die ich Witwe bin und von vielen verlassen wurde. Ich bin verödet wegen der Sünden meiner Kinder, weil sie vom Gesetz Gottes abgewichen sind.
  to: Niemand soll sich schadenfroh über mich freuen[a], mich, eine Witwe, die von vielen verlassen wurde. Ich bin wegen der Sünden meiner Kinder verwüstet worden, weil sie vom Gesetz Gottes abgewichen sind.
  rationale: Die Revision ersetzt zwei im modernen Deutsch unnatürliche Formulierungen, ohne den Sinngehalt zu verändern. Die Apposition gibt die feminine Selbstbeschreibung der Sprecherin wieder; „verwüstet worden“ entspricht dem passiven ἠρημώθην und lässt offen, ob das Bild persönlich oder im Rahmen der Personifikation einer Stadt zu verstehen ist.
