    rationale: Die Konstruktion ist zwar verständlich, entspricht aber nicht natürlichem modernem Standarddeutsch. Das Griechische lässt sich idiomatisch als Apposition „mich, eine Witwe, die …“ wiedergeben.
  - severity: medium
    issue: „Ich bin verödet“ ist idiomatisch und semantisch weniger geeignet für ἠρημώθην
    rationale: Das griechische Aoristpassiv bezeichnet ein Verwüstet- bzw. Öde-gemacht-Werden. „Ich bin verwüstet worden“ bildet die passive Handlung klarer ab und wahrt die räumlich-personifizierende Mehrdeutigkeit.
