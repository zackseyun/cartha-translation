base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/012.yaml
  text: Let no one gloat over me[a], a widow and abandoned by many; I have been left desolate because of the sins of my children, because they turned aside from the law of God.
translation:
  language: de
  text: Niemand soll sich schadenfroh über mich freuen[a], mich, eine Witwe, die von vielen verlassen wurde. Ich bin wegen der Sünden meiner Kinder verwüstet worden, weil sie vom Gesetz Gottes abgewichen sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Niemand soll sich über mich freuen.“ Das griechische Verb bezeichnet hier Freude über das Unglück eines anderen, also Schadenfreude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς … ἐπιχαιρέτω μοι
  choice: Niemand soll sich schadenfroh über mich freuen
  rationale: Der verneinte Imperativ wird als direkte Aufforderung wiedergegeben. ἐπιχαίρω bezeichnet hier nicht bloße Freude, sondern Freude über das Unglück eines anderen; „schadenfroh“ macht diese feindselige Nuance im heutigen Deutsch deutlich.
- source_word: τῇ χήρᾳ
  choice: die ich Witwe bin
  rationale: Die feminine Apposition beschreibt den Zustand der Sprecherin. Die Relativkonstruktion ist im Deutschen natürlicher als das substantivierte „mir, der Witwe“ und bewahrt die Ich-Rede.
- source_word: καταλειφθείσῃ ὑπὸ πολλῶν
  choice: und von vielen verlassen wurde
  rationale: Das passive Partizip bezeichnet eine, die zurückgelassen oder verlassen worden ist. „Von vielen“ bleibt entsprechend dem Griechischen unbestimmt und wird nicht zu „von allen“ verstärkt.
- source_word: ἠρημώθην
  choice: Ich bin verödet
  rationale: Das Verb bezeichnet das Veröden beziehungsweise Verlassenwerden. „Verödet“ erhält sowohl die persönliche Vereinsamung der als Witwe dargestellten Sprecherin als auch die im Kontext mitschwingende Bildwelt einer entvölkerten Stadt.
- source_word: διὰ τὰς ἁμαρτίας τῶν τέκνων μου
  choice: wegen der Sünden meiner Kinder
  rationale: διά mit Akkusativ gibt den Grund an. τέκνα ist geschlechtsübergreifend und wird daher mit „Kinder“, nicht verengend mit „Söhne“, übersetzt.
- source_word: διότι ἐξέκλιναν ἐκ νόμου θεοῦ
  choice: weil sie vom Gesetz Gottes abgewichen sind
  rationale: ἐκκλίνω beschreibt das Abweichen von einem Weg oder einer Norm. „Vom Gesetz Gottes abgewichen“ bewahrt dieses Bild und gibt ἐκ idiomatisch wieder.
theological_decisions:
- issue: Personifikation Jerusalems beziehungsweise Zions als verwitwete und verlassene Mutter
  choice: Die feminine Ich-Rede bleibt erhalten, ohne die Sprecherin im Haupttext ausdrücklich als Jerusalem oder Zion zu benennen.
  alternative: Den Namen „Jerusalem“ oder „Zion“ erläuternd in den Vers einsetzen.
  rationale: Der griechische Vers nennt die Sprecherin nicht ausdrücklich, sondern stellt sie als Witwe und Mutter dar. Die Identifikation ergibt sich aus dem Zusammenhang; eine namentliche Ergänzung würde die implizite Personifikation im Vers auflösen.
- issue: Bedeutung von ἠρημώθην zwischen persönlicher Verlassenheit und städtischer Verödung
  choice: „Ich bin verödet“
  alternative: „Ich wurde verwüstet“ oder „Ich bin vereinsamt“
  rationale: Die gewählte Formulierung hält die Spannung zwischen der trauernden Muttergestalt und der personifizierten, entvölkerten Stadt offen, statt das Bild ausschließlich psychologisch oder ausschließlich räumlich zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nah an der griechischen Ich-Rede, wird aber durch die Relativkonstruktion natürlich lesbar. „Verödet“ ist bewusst bildhaft gewählt, um die Doppelperspektive von verlassener Mutter und personifizierter Stadt zu bewahren.
