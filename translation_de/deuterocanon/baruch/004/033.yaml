  text: For just as she rejoiced over your fall and was glad over your downfall[b][a], so she will grieve over her own desolation.
translation:
  language: de
  text: Denn wie sie[a] sich über deinen Fall freute und über deinen Untergang frohlockte, so wird sie über ihre eigene Verwüstung trauern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „sie“ ist wahrscheinlich die im Zusammenhang angesprochene feindliche Stadt oder Nation gemeint, traditionell Babylon.
    reason: cross_reference
lexical_decisions:
- source_word: ὥσπερ γὰρ ... οὕτως
  choice: Denn wie ... so
  rationale: Bewahrt die ausdrückliche Vergleichsstruktur und gibt γάρ mit „Denn“ wieder.
- source_word: ἐχάρη
  choice: freute sich
  rationale: Natürliche Wiedergabe der Freude über das Unglück Zions.
- source_word: πτώσει
  choice: Fall
  rationale: Bewahrt das knappe Fall-Motiv und lässt die folgende Parallelformulierung als Verstärkung wirken.
- source_word: εὐφράνθη
  choice: frohlockte
  rationale: Unterscheidet den zweiten Ausdruck von „freute sich“ und bringt die schadenfrohe, triumphierende Freude zur Geltung.
- source_word: πτώματί
  choice: Untergang
  rationale: Im Zusammenhang bezeichnet das Wort eine schwere Niederlage oder Katastrophe, nicht einen Leichnam; „Untergang“ wahrt zugleich die Nähe zu πτῶσις.
- source_word: λυπηθήσεται
  choice: wird trauern
  rationale: Idiomatische Wiedergabe des zukünftigen Leidens beziehungsweise Kummers angesichts der Umkehrung ihres Geschicks.
- source_word: ἑαυτῆς ἐρημίᾳ
  choice: ihre eigene Verwüstung
  rationale: Das Reflexivpronomen wird mit „eigene“ markiert; ἐρημία bezeichnet hier den Zustand verheerender Zerstörung.
theological_decisions:
- issue: Bezug der femininen Einzahl
  choice: Das feminine Pronomen bleibt als „sie/ihre“ erhalten; die Stadt oder Nation wird im Haupttext nicht ausdrücklich benannt.
  alternative: Die Bezugsgröße ausdrücklich als Babylon oder feindliche Stadt bezeichnen.
  rationale: Der griechische Vers verwendet feminine Formen, nennt die Bezugsgröße hier jedoch nicht ausdrücklich. Die pronominale Wiedergabe bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die Umkehr von Zions Fall zur eigenen Verwüstung der Gegnerin bleiben deutlich. „Frohlockte“ ist gehoben, aber allgemein verständlich und passt zum prophetischen Ton.
