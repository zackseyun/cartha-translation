  text: You were sold to the nations, not for destruction; but because you provoked God to anger, you were handed over to your adversaries.
translation:
  language: de
  text: Ihr wurdet an die Völker verkauft, nicht zum Verderben; sondern weil ihr Gott zum Zorn gereizt habt, wurdet ihr euren Widersachern ausgeliefert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθητε
  choice: ihr wurdet … verkauft
  rationale: Der Aorist Passiv von πιπράσκω bezeichnet ein Verkauftwerden. Die Formulierung bewahrt das Bild, ohne den historischen Vorgang näher auszudeuten.
- source_word: τοῖς ἔθνεσιν
  choice: an die Völker
  rationale: ἔθνη meint hier im Kontext von Fremdherrschaft und Exil auswärtige Völker. „Völker“ ist transparent und vermeidet die stärker religiös geprägte Wiedergabe „Heiden“.
- source_word: οὐκ εἰς ἀπώλειαν
  choice: nicht zum Verderben
  rationale: εἰς mit ἀπώλεια kann Ziel oder Ergebnis bezeichnen. „Nicht zum Verderben“ erhält diese Offenheit und bezeichnet drohenden Untergang, ohne ausdrücklich vollständige Vernichtung festzulegen.
- source_word: διὰ δὲ τὸ παροργίσαι ὑμᾶς τὸν θεόν
  choice: sondern weil ihr Gott zum Zorn gereizt habt
  rationale: Die Konstruktion διά mit substantiviertem Infinitiv ist kausal. „Zum Zorn reizen“ bildet die intensive Bedeutung von παροργίζω natürlich und würdig ab.
- source_word: παρεδόθητε
  choice: ihr wurdet … ausgeliefert
  rationale: Das Passiv von παραδίδωμι bezeichnet die Übergabe in fremde Gewalt. „Ausgeliefert“ ist im Deutschen idiomatisch und bewahrt den Gerichts- und Machtaspekt.
- source_word: τοῖς ὑπεναντίοις
  choice: euren Widersachern
  rationale: ὑπεναντίος bezeichnet Personen, die sich gegen jemanden stellen. „Widersacher“ gibt diesen oppositionellen Sinn genauer wieder als das allgemeinere „Feinde“.
theological_decisions:
- issue: Wesen von Israels Exil und Gericht
  choice: Das Verkauftwerden an die Völker geschah nicht zum Verderben, sondern infolge dessen, dass das Volk Gott zum Zorn reizte; daraufhin wurde es seinen Widersachern ausgeliefert.
  alternative: Das Exil war keine endgültige Vernichtung, sondern ein zeitlich begrenztes erzieherisches Gericht.
  rationale: Der griechische Text verneint ausdrücklich das Verderben als Ziel oder Ergebnis und nennt zugleich das Reizen Gottes zum Zorn als Ursache. Die Übersetzung wahrt diese Spannung, ohne über den Vers hinaus ausdrücklich eine zeitliche Begrenzung oder einen erzieherischen Zweck zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Passivbau des griechischen Textes bleibt erhalten. „Widersacher“ ist leicht gehoben, aber allgemein verständlich und dem feierlichen Kontext angemessen.
