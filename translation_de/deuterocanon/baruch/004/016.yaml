lexical_decisions:
- source_word: ἀπήγαγον
  choice: führten … fort
  rationale: Das Verb bezeichnet das Wegführen oder Fortschaffen von Menschen, hier wohl im Zusammenhang von Gefangenschaft und Vertreibung. „Fortführen“ wahrt diesen Sinn, ohne die Art des Abtransports näher festzulegen.
- source_word: τοὺς ἀγαπητοὺς
  choice: die geliebten Menschen
  rationale: Das substantivierte Adjektiv bezeichnet geliebte Personen. „Die geliebten Menschen“ ist im heutigen Deutsch natürlich und bewahrt sowohl den Plural als auch den emotionalen Gehalt.
- source_word: τῆς χήρας
  choice: der Witwe
  rationale: Der Genitiv wird als Zugehörigkeit wiedergegeben. Die poetische Personifikation als Witwe bleibt erhalten und wird nicht im Haupttext als Jerusalem oder Zion ausgedeutet.
- source_word: ἀπὸ τῶν θυγατέρων
  choice: von ihren Töchtern getrennt
  rationale: ἀπό mit Genitiv bezeichnet hier die Trennung von den Töchtern. Die Ergänzung „getrennt“ macht die im Deutschen sonst schwer verständliche Beziehung deutlich, ohne die Töchtermetaphorik aufzulösen.
- source_word: τὴν μόνην
  choice: einsam
  rationale: Die feminine Akkusativform bezeichnet die Witwe als allein Zurückgebliebene. „Einsam“ gibt ihren Zustand idiomatisch wieder; die wörtlichere Möglichkeit „als Einzige“ wird in der Fußnote festgehalten.
- source_word: ἠρήμωσαν
  choice: ließen sie … verlassen zurück
  rationale: Das Verb bedeutet, jemanden oder etwas zu verwüsten beziehungsweise verödet oder verlassen zu machen. Bei der personifizierten Witwe vermittelt „verlassen zurücklassen“ den resultierenden Zustand natürlich und eindringlich.
theological_decisions:
- issue: Personifikation als Witwe mit Töchtern
  choice: Die familiäre Bildsprache wird unmittelbar beibehalten.
  alternative: Die Witwe und ihre Töchter im Haupttext ausdrücklich als Jerusalem beziehungsweise Zion und deren Bewohner deuten.
  rationale: Der griechische Text spricht poetisch in einer Personifikation. Eine ausdrückliche Identifizierung im Haupttext würde die Metapher durch eine Auslegung ersetzen.
- issue: Bezug von τὴν μόνην
  choice: Die Form wird auf die Witwe bezogen und als ihr Zustand des einsamen Zurückbleibens wiedergegeben.
  alternative: Die Wendung streng wörtlich als „die Einzige“ wiedergeben oder syntaktisch auf eine einzelne Tochter beziehen.
  rationale: Genus und Satzbau erlauben den Bezug auf die Witwe; zugleich ist die Konstruktion knapp und im Deutschen erklärungsbedürftig. Die Hauptfassung folgt dem wahrscheinlichsten Sinn, während die Fußnote die formale Mehrdeutigkeit sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „sie“ folgt dem griechischen Satzfluss, während „von ihren Töchtern getrennt“ die Trennungsbedeutung idiomatisch verdeutlicht. Die Bildsprache von Witwe und Töchtern bleibt bewusst unausgelegt.
