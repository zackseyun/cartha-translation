base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/027.yaml
  text: Take courage[a], children, and cry out to God, for you will be remembered by the one who brought this upon you.
translation:
  language: de
  text: Fasst Mut, Kinder, und ruft laut zu Gott! Denn der, der es über euch gebracht hat, wird eurer gedenken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn es wird eurer gedacht werden von dem, der es über euch bringt.“'
    reason: Die Fußnote macht sowohl die unpersönliche griechische Konstruktion „es wird Erinnerung geben“ als auch den präsentischen Wortlaut des Partizips sichtbar.
lexical_decisions:
- source_word: Θαρρήσατε
  choice: Fasst Mut
  rationale: Der Aoristimperativ im Plural fordert zu Zuversicht und mutigem Vertrauen auf. „Fasst Mut“ ist natürliches, modernes Deutsch und bewahrt die nachdrückliche Aufforderung.
- source_word: τέκνα
  choice: Kinder
  rationale: Der Vokativ Plural bezeichnet die Angeredeten geschlechtsübergreifend als Kinder und passt zur fürsorglichen Anrede des Volkes.
- source_word: βοήσατε
  choice: ruft laut
  rationale: Das Verb bezeichnet einen lauten, eindringlichen Ruf, hier als Hilferuf an Gott. „Ruft laut“ bewahrt diese Intensität, ohne im Deutschen unnötig aggressiv zu klingen.
- source_word: πρὸς τὸν θεόν
  choice: zu Gott
  rationale: Nach einem Verb des Rufens gibt die Präposition die Richtung beziehungsweise den Adressaten an; „zu Gott rufen“ ist idiomatisches Deutsch.
- source_word: ἔσται ... μνεία
  choice: wird eurer gedenken
  rationale: Die griechische Wendung lautet wörtlich „es wird Erinnerung an euch geben“. Die deutsche Verbalkonstruktion gibt die zugesicherte künftige Zuwendung natürlich wieder und behält mit „gedenken“ den würdevollen biblischen Ton.
- source_word: ὑπὸ τοῦ ἐπάγοντος
  choice: der, der es über euch gebracht hat
  rationale: Das substantivierte Partizip bezeichnet den Handelnden, der das unausgesprochene Unheil über die Angeredeten bringt. „Es“ lässt den Gegenstand wie im Griechischen implizit; das Perfekt ist im Deutschen kontextgemäß und natürlich.
theological_decisions:
- issue: Identität dessen, der „es über euch gebracht hat“
  choice: Die indirekte Bezeichnung bleibt erhalten und bezieht sich im Zusammenhang wahrscheinlich auf Gott als den, der das Gericht gebracht hat und des Volkes gedenken wird.
  alternative: Den Handelnden ausdrücklich mit „Gott“ benennen oder die Formulierung noch unbestimmter wiedergeben.
  rationale: Der vorherige Satzteil nennt Gott, und der Kontext versteht das Unheil als göttliches Gericht. Da das Griechische Gott hier jedoch nicht nochmals ausdrücklich nennt, wird die theologische Spannung durch „der, der ...“ bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Klang. „Fasst Mut“ und „ruft laut“ sind unmittelbar und gegenwärtig; „eurer gedenken“ bewahrt den feierlichen Ton, ohne altertümliche Satzstellung zu verwenden.
