base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/037.yaml
  text: Look[a], your sons are coming, whom you sent away; they are coming, gathered from east to west at the word of the Holy One[b], rejoicing in the glory of God.
translation:
  language: de
  text: Sieh, deine Söhne kommen, die du fortgeschickt hast. Sie kommen, gesammelt vom Osten bis zum Westen, auf das Wort des Heiligen hin[a], und freuen sich an der Herrlichkeit Gottes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Wort des Heiligen“. Der Dativ τῷ ῥήματι kann das Mittel bezeichnen oder das Wort als Weisung, auf die hin etwas geschieht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „freuen sich über die Herrlichkeit Gottes“. Der Dativ bei „sich freuen“ lässt sich im Deutschen unterschiedlich natürlich wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel eröffnet die Szene nachdrücklich. „Sieh“ ist gegenwärtiges, würdevolles Deutsch und weniger altertümlich als „Siehe“.
- source_word: οἱ υἱοί σου
  choice: deine Söhne
  rationale: Der griechische Ausdruck ist ausdrücklich maskulin und wird daher nicht zu „deine Kinder“ verallgemeinert.
- source_word: ἐξαπέστειλας
  choice: fortgeschickt hast
  rationale: Das Kompositum bezeichnet ein Weg- oder Aussenden. „Fortgeschickt“ passt zum Exilkontext, ohne die im Verb nicht ausdrücklich genannte Ursache weiter auszudeuten.
- source_word: συνηγμένοι
  choice: gesammelt
  rationale: Das passive Partizip bezeichnet die Kommenden als Menschen, die zusammengebracht worden sind, und bewahrt so das Motiv der Sammlung.
- source_word: ἀπʼ ἀνατολῶν ἕως δυσμῶν
  choice: vom Osten bis zum Westen
  rationale: Die Wendung bezeichnet die gesamte räumliche Ausdehnung und wird als geläufige deutsche Himmelsrichtungsformel wiedergegeben.
- source_word: τῷ ῥήματι
  choice: auf das Wort … hin
  rationale: Diese Formulierung versteht den Dativ als Wort beziehungsweise Befehl, auf den hin die Sammlung geschieht, und bleibt zugleich nahe am griechischen ῥῆμα.
- source_word: τοῦ ἁγίου
  choice: des Heiligen
  rationale: Der substantivierte Ausdruck ist ein ehrfürchtiger Gottestitel. „Der Heilige“ ist im Deutschen klar und fügt keine im Griechischen fehlende nähere Bestimmung hinzu.
- source_word: χαίροντες
  choice: freuen sich
  rationale: Die finite deutsche Form verbindet das begleitende Partizip natürlich mit dem Kommen und erhält dessen verbalen Sinn.
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: an der Herrlichkeit Gottes
  rationale: „Sich an etwas freuen“ gibt den Dativ idiomatisch wieder und lässt die Herrlichkeit Gottes als Gegenstand beziehungsweise Anlass der Freude erkennen.
theological_decisions:
- issue: Wiedergabe des Gottestitels τοῦ ἁγίου
  choice: des Heiligen
  alternative: des heiligen Gottes
  rationale: Der Artikel mit dem substantivierten Adjektiv bezeichnet Gott als „den Heiligen“. Die knappere Wiedergabe bewahrt den Titel, ohne das im Ausgangstext nur implizite Substantiv „Gott“ einzusetzen.
- issue: Funktion des Dativs τῷ ῥήματι
  choice: auf das Wort des Heiligen hin
  alternative: durch das Wort des Heiligen
  rationale: Der Dativ kann eine auslösende Weisung oder das Mittel der Sammlung bezeichnen. Der Haupttext wählt die responsive Lesart; die instrumentale bleibt in der Fußnote ausdrücklich erhalten.
- issue: Bezug des Dativs τῇ τοῦ θεοῦ δόξῃ bei χαίροντες
  choice: freuen sich an der Herrlichkeit Gottes
  alternative: freuen sich über die Herrlichkeit Gottes
  rationale: Beide deutschen Fügungen können Gegenstand oder Anlass der Freude ausdrücken. „An“ hält eine engere, möglicherweise teilhabende Beziehung offen, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Kurze, klare Sätze bilden die zweimalige Form von ἔρχονται ab. Die Anrede an Jerusalem und die ausdrücklich maskuline Bezeichnung „Söhne“ bleiben erhalten; echte Dativmehrdeutigkeiten werden durch Fußnoten offengehalten.
