  text: You forgot the eternal God who nourished you; you also grieved Jerusalem, who reared you.
translation:
  language: de
  text: Ihr habt den ewigen Gott vergessen, der euch ernährt hat; auch Jerusalem, die euch großgezogen hat, habt ihr betrübt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάθεσθε
  choice: Ihr habt ... vergessen
  rationale: Das Aoristverb bezeichnet das Vergessen und trägt hier anklagenden Charakter; das deutsche Perfekt ist in heutiger Standardsprache natürlich.
- source_word: τὸν τροφεύσαντα ὑμᾶς
  choice: der euch ernährt hat
  rationale: τροφεύω bezeichnet das Nähren beziehungsweise Versorgen und bewahrt hier das Bild fürsorglicher Aufzucht, ohne es auf ein bloßes Füttern zu verengen.
- source_word: θεὸν αἰώνιον
  choice: den ewigen Gott
  rationale: Die attributive Verbindung wird idiomatisch wiedergegeben und erhält die Aussage über Gottes Ewigkeit.
- source_word: ἐλυπήσατε
  choice: ihr habt ... betrübt
  rationale: λυπέω bedeutet Kummer oder Trauer bereiten; „betrübt“ ist würdig, verständlich und bewahrt das emotionale Gewicht.
- source_word: δὴ καὶ
  choice: und ... auch
  rationale: „auch“ gibt die additive Kraft von καί wieder; die nachdrückliche Nuance von δή wird durch die Satzführung mitgetragen, ohne unnatürliches „wahrlich“ einzufügen.
- source_word: τὴν ἐκθρέψασαν ὑμᾶς
  choice: die euch großgezogen hat
  rationale: ἐκτρέφω bezeichnet das Aufziehen oder Großziehen. Die Formulierung unterscheidet die mütterliche Tätigkeit Jerusalems vom vorherigen Ernähren durch Gott.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Der Eigenname wird in der etablierten deutschen Form wiedergegeben; das feminine Relativpronomen macht die im Griechischen angelegte Personifikation sichtbar.
theological_decisions:
- issue: Personifikation Jerusalems als fürsorgliche weibliche Gestalt
  choice: Jerusalem, die euch großgezogen hat
  alternative: Jerusalem, das euch großgezogen hat; eure Mutter Jerusalem
  rationale: Das feminine Partizip τὴν ἐκθρέψασαν stellt Jerusalem als weibliche, mütterlich handelnde Gestalt dar. „die“ erhält diese Personifikation, während „Mutter“ nicht ergänzt wird, da dieses Substantiv im griechischen Text fehlt.
- issue: Göttliches Epitheton αἰώνιον
  choice: den ewigen Gott
  alternative: den immerwährenden Gott
  rationale: „ewig“ ist die natürliche und theologisch offene deutsche Entsprechung und gibt die Aussage des griechischen Attributs ohne weitere dogmatische Präzisierung wieder.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter Anrede im Plural. Die parallelen Fürsorgebilder werden durch „ernährt“ und „großgezogen“ unterschieden. Die weibliche Personifikation Jerusalems bleibt ausdrücklich erhalten.
