  text: For I nourished them with gladness, but I sent them away with weeping and mourning.
translation:
  language: de
  text: Denn ich zog sie mit Freude groß, doch sandte ich sie unter Weinen und Trauer fort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθρεψα
  choice: ich zog sie … groß
  rationale: τρέφω kann »ernähren«, »nähren« oder »aufziehen« bedeuten. Im mütterlichen Zusammenhang gibt »großziehen« die Fürsorge über längere Zeit natürlicher wieder als das engere »ernähren«.
- source_word: μετʼ εὐφροσύνης
  choice: mit Freude
  rationale: εὐφροσύνη bezeichnet Freude oder Fröhlichkeit; »mit Freude« ist gegenwärtiges, würdiges Deutsch und bewahrt die begleitende Bedeutung von μετά.
- source_word: ἐξαπέστειλα
  choice: ließ ich sie … fortgehen
  rationale: ἐξαποστέλλω bezeichnet ein Aussenden beziehungsweise Wegsenden. »fortgehen lassen« bewahrt hier die Trennungsperspektive der Sprecherin, ohne den im Vers selbst nicht ausdrücklich genannten Exilkontext einzufügen.
- source_word: μετὰ κλαυθμοῦ
  choice: unter Weinen
  rationale: κλαυθμός meint Weinen oder Klagen. »unter Weinen« beschreibt idiomatisch den begleitenden schmerzlichen Vorgang.
- source_word: πένθους
  choice: Trauer
  rationale: πένθος bezeichnet Trauer beziehungsweise Leid angesichts eines Verlustes. »Trauer« erhält neben »Weinen« sowohl die innere als auch die geäußerte Dimension.
theological_decisions:
- issue: Mütterliche Stimme der Sprecherin und Exilkontext
  choice: Die Verben in der ersten Person bleiben ohne erklärenden Zusatz stehen; der Gegensatz zwischen freudigem Großziehen und schmerzlichem Fortgehen bleibt unmittelbar.
  alternative: Das Fortgehen im Haupttext ausdrücklich als Verbannung oder Exil bezeichnen.
  rationale: Der nähere Zusammenhang legt das Exil nahe, doch dieser Vers nennt es nicht ausdrücklich. Die Übersetzung bewahrt daher die Bildsprache und Spannung, ohne die Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die adversative Struktur γάρ … δέ wird mit »Denn … doch« wiedergegeben; der emotionale Gegensatz bleibt deutlich, ohne zusätzliche Erklärung.
