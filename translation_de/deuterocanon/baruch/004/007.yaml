translation:
  language: de
  text: Denn ihr habt den, der euch geschaffen hat, gereizt, indem ihr den Dämonen Opfer dargebracht habt und nicht Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρωξύνατε
  choice: habt ... herausgefordert
  rationale: Das Verb bezeichnet ein scharfes Reizen oder Provozieren. „Herausfordern“ bewahrt die verursachende Kraft, ohne die ausgelöste Reaktion ausdrücklich als Zorn festzulegen.
- source_word: τὸν ποιήσαντα ὑμᾶς
  choice: den, der euch gemacht hat
  rationale: Die substantivierte Partizipialwendung wird nah an der griechischen Struktur und zugleich verständlich wiedergegeben. „Euer Schöpfer“ wäre idiomatischer, würde die Form jedoch stärker verdichten.
- source_word: θύσαντες
  choice: indem ihr ... Opfer darbrachtet
  rationale: Das Aoristpartizip erklärt, wodurch die Angesprochenen Gott herausforderten. Die deutsche Konstruktion gibt diesen modalen beziehungsweise instrumentalen Zusammenhang natürlich wieder.
- source_word: δαιμονίοις
  choice: Dämonen
  rationale: Im jüdisch-griechischen Kontext von Götzenopfern bezeichnet das Wort feindliche geistliche Wesen und nicht neutral verstandene niedere Gottheiten.
- source_word: καὶ οὐ θεῷ
  choice: und nicht Gott
  rationale: Die parallelen Dative bezeichnen die Empfänger der Opfer. Die knappe Gegenüberstellung des Griechischen bleibt erhalten.
theological_decisions:
- issue: Bedeutung von δαιμονίοις im Zusammenhang mit Götzenopfern
  choice: Dämonen
  alternative: böse Geister; Götzenmächte
  rationale: „Dämonen“ bewahrt die Aussage, dass die Opfer geistlichen Wesen galten, die Gott entgegengesetzt sind, statt die Formulierung rein metaphorisch zu deuten.
- issue: Emotionale Bestimmung von παρωξύνατε
  choice: herausgefordert
  alternative: erzürnt
  rationale: Der Text sagt, dass das Verhalten Gott provozierte, benennt die daraus folgende Regung aber nicht ausdrücklich. Daher wird die mögliche Zornesnuance nicht zur eindeutigen Aussage gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am knappen griechischen Kausalzusammenhang; „Opfer darbringen“ ist im kultischen Kontext natürlicher und präziser als das isolierte „opfern“.
