  text: Wretched are those who harmed you and rejoiced at your fall,[a]
translation:
  language: de
  text: Elend sind die, die dir Böses angetan und sich über deinen Fall gefreut haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich über deinen Untergang schadenfroh gefreut haben«. Wörtlich: »sich über deinen Fall gefreut haben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δείλαιοι
  choice: Elend sind
  rationale: Das prädikative Adjektiv bezeichnet einen beklagenswerten, erbärmlichen Zustand. »Elend sind« bewahrt den Wehe- und Gerichtston, ohne ausdrücklich einen Fluch zu formulieren.
- source_word: οἱ σε κακώσαντες
  choice: alle, die dir Böses angetan haben
  rationale: κακόω bezeichnet schädigendes oder übles Handeln. Die deutsche Wendung ist natürlich und lässt offen, ob körperliche Gewalt, Unterdrückung oder anderes Unrecht gemeint ist.
- source_word: ἐπιχαρέντες
  choice: sich … gefreut haben
  rationale: Das Verb bezeichnet Freude über etwas, hier über das Unglück eines anderen. Die feindselige Schadenfreude ergibt sich aus dem Zusammenhang, ohne dass sie im Haupttext stärker als im Griechischen ausgedeutet wird.
- source_word: τῇ σῇ πτώσει
  choice: über deinen Fall
  rationale: πτῶσις bedeutet wörtlich »Fall« und bezeichnet hier Jerusalems Niederlage beziehungsweise Untergang. »Fall« erhält das Bild und ist im Deutschen verständlich.
