base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/028.yaml
  text: For just as your mind was set on going astray from God[a], so, as you return, seek him ten times more.
translation:
  language: de
  text: Denn wie euer Sinn darauf gerichtet war, von Gott abzuirren, so sucht ihn nun bei eurer Umkehr mit zehnfachem Eifer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Verzehnfacht [es], indem ihr umkehrt, um ihn zu suchen.“ Das Griechische lässt unausgesprochen, was verzehnfacht werden soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάνοια
  choice: Sinn
  rationale: „Sinn“ bezeichnet hier die innere Ausrichtung des Denkens und Wollens und klingt im Deutschen natürlicher als das engere „Verstand“.
- source_word: ἐγένετο … εἰς τὸ πλανηθῆναι
  choice: darauf gerichtet war, … abzuirren
  rationale: Die Wendung beschreibt eine entstandene beziehungsweise bestehende innere Ausrichtung auf das Abirren. Die deutsche Fassung gibt diese Bewegung idiomatisch wieder, ohne festzulegen, ob das Abirren selbstverschuldet oder durch Verführung verursacht war.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: von Gott
  rationale: ἀπό bezeichnet die Trennung beziehungsweise Entfernung; „von Gott abirren“ ist prägnant und natürlich.
- source_word: δεκαπλασιάσατε
  choice: mit zehnfachem Eifer
  rationale: Das Verb bedeutet wörtlich „verzehnfacht [es]“. Da sein Gegenstand im Griechischen unausgesprochen bleibt, macht die Übersetzung die Intensivierung des Suchens verständlich, während eine Fußnote die Ellipse offenlegt.
- source_word: ἐπιστρέφοντες
  choice: bei eurer Umkehr
  rationale: Die substantivische Wendung wahrt den begleitenden Sinn des Partizips und lässt zugleich die religiöse Bedeutung des Sich-Gott-wieder-Zuwendens erkennen.
- source_word: ζητῆσαι αὐτόν
  choice: sucht ihn
  rationale: „Ihn suchen“ ist die natürliche und gewichtige deutsche Wiedergabe für das Suchen nach Gott; das Pronomen bezieht sich eindeutig auf Gott.
theological_decisions:
- issue: Beziehung des elliptischen δεκαπλασιάσατε zur Umkehr und zur Suche nach Gott
  choice: Die Verzehnfachung wird als „mit zehnfachem Eifer“ auf das Suchen nach Gott bezogen.
  alternative: „Verzehnfacht [es], indem ihr umkehrt, um ihn zu suchen.“
  rationale: Der griechische Satz nennt nicht ausdrücklich, was verzehnfacht werden soll. Der Zusammenhang legt die erneuerte Suche nach Gott nahe; die Hauptfassung macht dies lesbar, während die Fußnote die grammatische Offenheit bewahrt.
- issue: Aktive oder passive Nuance von πλανηθῆναι
  choice: „abzuirren“
  alternative: „in die Irre geführt zu werden“
  rationale: Die griechische Form ist formal passiv, kann aber intransitiv das Abirren bezeichnen. Die Übersetzung legt keine fremde Verursachung fest und erhält so die im Kontext mögliche Spannung zwischen eigenem Abweichen und Verführung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sinn“ und „Umkehr“ bewahren den religiösen Ernst, ohne konfessionelle Zusätze; „mit zehnfachem Eifer“ löst die griechische Ellipse lesbar auf.
