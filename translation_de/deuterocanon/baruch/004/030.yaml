  text: Take courage[a], Jerusalem[b]; the one who named you will comfort you.
translation:
  language: de
  text: Fass Mut[a], Jerusalem! Der, der dir deinen Namen gab[b], wird dich trösten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
