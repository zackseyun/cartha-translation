lexical_decisions:
- source_word: Θάρσει
  choice: Fass Mut
  rationale: Der Imperativ fordert zu Mut und Zuversicht auf. »Fass Mut« ist im heutigen Deutsch natürlich und bewahrt die direkte, ermutigende Kraft.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Die im Deutschen übliche Namensform.
- source_word: παρακαλέσει
  choice: wird dich trösten
  rationale: Das Futur von παρακαλέω bezeichnet hier angesichts des Leids Jerusalems am ehesten tröstenden Beistand; »ermutigen« bleibt möglich, ist im Zusammenhang aber weniger treffend.
- source_word: ὁ ὀνομάσας σε
  choice: der, der dir deinen Namen gab
  rationale: Der substantivierte Aoristpartizip bezeichnet denjenigen, der Jerusalem benannt hat. Die Formulierung ist idiomatisches Deutsch, wahrt die persönliche Handlung und identifiziert den Handelnden nicht ausdrücklich als Gott.
theological_decisions:
- issue: Identität dessen, der Jerusalem den Namen gab
  choice: Die Person wird im Haupttext umschreibend bezeichnet, ohne »Gott« oder »der Herr« einzufügen.
  alternative: »der Herr, der dir deinen Namen gab« oder »Gott, der dir deinen Namen gab«
  rationale: Der Zusammenhang weist deutlich auf Gott, doch der griechische Vers nennt weder den Gottesnamen noch einen göttlichen Titel. Die beschreibende Wiedergabe erhält diese Zurückhaltung und die literarische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede wird durch ein Ausrufezeichen klar gegliedert; »der, der« ist bewusst gewählt, um die griechische substantivierte Partizipialwendung präzise und verständlich wiederzugeben.
