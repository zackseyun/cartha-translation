base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/013.yaml
  text: and they did not know his righteous decrees[a], nor did they walk in the ways of God's commandments[b], nor did they step onto the paths of discipline in his righteousness.
translation:
  language: de
  text: Auch kannten sie seine Rechtsbestimmungen nicht, gingen nicht auf den Wegen der Gebote Gottes und betraten nicht die Pfade der Unterweisung[a] in seiner Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erziehung“ oder „Zucht“. Das griechische Wort bezeichnet formende Unterweisung, die auch Korrektur einschließen kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in seinem Recht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιώματα αὐτοῦ
  choice: seine Rechtsbestimmungen
  rationale: δικαιώματα bezeichnet verbindliche Satzungen oder rechtliche Bestimmungen. „Rechtsbestimmungen“ gibt den rechtlich-moralischen Gehalt wieder, ohne durch „gerechte“ eine im griechischen Ausdruck nicht ausdrücklich vorhandene Eigenschaft hinzuzufügen.
- source_word: οὐκ ἔγνωσαν
  choice: kannten sie … nicht
  rationale: Die schlichte Wiedergabe wahrt den direkten Sinn von γινώσκω und legt die Aussage nicht einseitig als bloß intellektuelles Nichtverstehen aus.
- source_word: οὐδὲ ἐπορεύθησαν ὁδοῖς
  choice: gingen nicht auf den Wegen
  rationale: Die Wegmetapher für die Lebensführung bleibt erhalten und klingt im modernen Deutschen natürlich und würdig.
- source_word: ἐντολῶν θεοῦ
  choice: der Gebote Gottes
  rationale: „Gebote“ entspricht dem verbindlichen moralisch-religiösen Gehalt von ἐντολαί; die Genitivfügung bleibt sichtbar.
- source_word: τρίβους παιδίας
  choice: die Pfade der Unterweisung
  rationale: τρίβοι wird zur Unterscheidung von ὁδοί mit „Pfade“ wiedergegeben. παιδεία umfasst formende Lehre, Erziehung und Zurechtweisung; „Unterweisung“ stellt hier den pädagogischen Grundsinn in den Vordergrund.
- source_word: ἐπέβησαν
  choice: betraten nicht
  rationale: ἐπιβαίνω bezeichnet das Betreten oder Fußfassen auf etwas. „betraten“ bewahrt das konkrete Bild und ist idiomatischer als eine streng wörtliche Umschreibung.
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: in seiner Gerechtigkeit
  rationale: Die formnahe Wiedergabe bewahrt sowohl den theologischen Gehalt von δικαιοσύνη als auch die knappe und syntaktisch mehrdeutige Verbindung mit „Unterweisung“.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht
  rationale: „Gerechtigkeit“ wahrt die moralisch-theologische Weite des griechischen Begriffs. „Recht“ wäre möglich, würde den Ausdruck hier aber stärker juridisch einengen.
- issue: Bezug der Wendung ἐν δικαιοσύνῃ αὐτοῦ
  choice: Die Wendung bleibt unmittelbar bei „Pfade der Unterweisung“ stehen
  alternative: Explizite Deutung als Unterweisung, die zu Gottes Gerechtigkeit führt oder von ihr geprägt ist
  rationale: Das Griechische ist kompakt und bestimmt die genaue semantische Beziehung nicht näher. Die Übersetzung löst diese Spannung daher nicht erklärend auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Satzstruktur und die beiden Wegbegriffe des Griechischen werden durch „Wege“ und „Pfade“ bewahrt. Die Fußnotenmarker stehen bei den jeweils tatsächlich erläuterten Ausdrücken.
