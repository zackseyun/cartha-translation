base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/021.yaml
  text: Take courage[a], children; cry out to God, and he will deliver you from oppression[b], from the hand of enemies.
translation:
  language: de
  text: Fasst Mut, Kinder! Ruft zu Gott, und er wird euch aus der Unterdrückung, aus der Hand der Feinde[a] retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Aus der Hand der Feinde“ bedeutet: aus ihrer Macht oder Verfügungsgewalt.'
    reason: cultural_note
lexical_decisions:
- source_word: Θαρρεῖτε
  choice: Fasst Mut
  rationale: Der Imperativ Plural fordert unmittelbar zu Zuversicht und Mut auf. „Fasst Mut“ ist im heutigen Deutsch natürlich und bewahrt den ermutigenden Ton.
- source_word: τέκνα
  choice: Kinder
  rationale: Der Vokativ bezeichnet Kinder unabhängig vom Geschlecht und erhält die familiäre Anrede.
- source_word: βοήσατε πρὸς τὸν θεόν
  choice: Ruft zu Gott
  rationale: βοάω bezeichnet einen lauten, dringlichen Ruf; mit πρὸς wird Gott als Adressat des Hilferufs bezeichnet. „Zu Gott rufen“ ist zugleich idiomatisches Gebetsdeutsch.
- source_word: ἐξελεῖται
  choice: wird … retten
  rationale: Die Futurform von ἐξαιρέω verheißt Rettung beziehungsweise Befreiung aus feindlicher Macht. „Retten“ ist klar, gegenwärtig und ohne zusätzliche dogmatische Färbung.
- source_word: ἐκ δυναστείας
  choice: aus der Gewaltherrschaft
  rationale: δυναστεία kann Herrschaft, Macht oder beherrschende Gewalt bezeichnen. „Gewaltherrschaft“ gibt hier den negativen Zusammenhang feindlicher Unterdrückung prägnant wieder.
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: aus der Hand der Feinde
  rationale: Die konkrete biblische Metapher wird beibehalten; sie bezeichnet die Macht oder Verfügungsgewalt der Feinde.
theological_decisions:
- issue: Göttliche Rettungsverheißung
  choice: und er wird euch … retten
  alternative: und er wird euch … befreien
  rationale: Der griechische Text verheißt schlicht Gottes künftiges rettendes Handeln. „Retten“ wahrt diese Aussage, ohne die Beziehung zwischen Hilferuf und Rettung theologisch weiter auszugestalten.
- issue: Beziehung zwischen δυναστεία und der Hand der Feinde
  choice: Beide Wendungen bleiben als aufeinanderfolgende Herkunftsangaben erhalten
  alternative: Zusammenziehung zu „aus der Gewalt der Feinde“
  rationale: Die Wiederholung von ἐκ im Griechischen lässt sowohl eine erläuternde Zuspitzung als auch zwei eng verbundene Aspekte der Bedrängnis erkennen. Die Übersetzung bewahrt diese Spannung und die Bildsprache.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die beiden Imperative bleiben knapp und eindringlich; das traditionelle Hand-Bild wird mit einer kurzen Fußnote erschlossen.
