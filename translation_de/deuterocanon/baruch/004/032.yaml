base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/032.yaml
  text: Wretched are the cities to which your children were enslaved[a]; wretched is she who received your sons.
translation:
  language: de
  text: Elend sind die Städte, denen deine Kinder als Sklaven dienten[a]; elend ist die, die deine Söhne aufgenommen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denen deine Kinder dienten“. Das griechische Verb kann allgemein „dienen“ bedeuten; im Zusammenhang ist jedoch Sklavendienst beziehungsweise Knechtschaft gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δείλαιαι / δείλαια
  choice: Elend sind … / elend ist …
  rationale: Die prädikative Form bewahrt den klagend-verurteilenden Ausruf des griechischen Adjektivs, ohne ihn zur freieren Weheruf-Formel umzudeuten.
- source_word: αἱ πόλεις
  choice: die Städte
  rationale: Der bestimmte Artikel bezeichnet die konkreten Städte, die mit der Verschleppung und Unterdrückung der Kinder Zions verbunden sind.
- source_word: αἷς ἐδούλευσαν
  choice: denen … als Sklaven dienten
  rationale: Der Dativ des Relativpronomens wird direkt mit „denen“ wiedergegeben. „Als Sklaven dienten“ bringt den hier naheliegenden Sinn von δουλεύω als unfreier Dienstleistung klar zum Ausdruck, ohne das Verb in ein bloßes Passiv „wurden versklavt“ umzuwandeln.
- source_word: τὰ τέκνα σου
  choice: deine Kinder
  rationale: τέκνα bezeichnet die Nachkommen allgemein und ist weiter gefasst als das folgende υἱούς.
- source_word: ἡ δεξαμένη
  choice: die, die … aufgenommen hat
  rationale: Die feminine substantivierte Partizipialform wird als weiblich personifizierte Stadt bewahrt. „Aufgenommen“ gibt δέχομαι formal wieder, ohne die im Zusammenhang negative Aufnahme in die Gewalt der Stadt ausdrücklich in das Verb hineinzulesen.
- source_word: τοὺς υἱούς σου
  choice: deine Söhne
  rationale: υἱούς wird spezifisch mit „Söhne“ übersetzt, sodass der lexikalische Wechsel gegenüber τέκνα erhalten bleibt.
theological_decisions:
- issue: Bedeutung von δουλεύω im Zusammenhang von Exil und Unterdrückung
  choice: als Sklaven dienten
  alternative: dienten
  rationale: Der Zusammenhang legt nicht gewöhnlichen Dienst, sondern erzwungene Unterordnung nahe. Die Formulierung bewahrt zugleich den aktiven griechischen Satzbau und macht den Sklavereisinn deutlich.
- issue: Charakter der Aufnahme durch die feindliche Stadt
  choice: aufgenommen hat
  alternative: in ihre Gewalt gebracht hat
  rationale: Das griechische δέχομαι bezeichnet zunächst das Aufnehmen oder Annehmen. Die negative Bedeutung ergibt sich aus dem Kontext; eine stärkere Formulierung würde diese Deutung direkt in das Verb eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzform und die feminine Personifizierung der feindlichen Stadt bleiben erhalten; „Elend sind“ wirkt als knapper Klage- und Gerichtsausruf.
