base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/018.yaml
  text: For the one who brought these evils upon you will rescue you from the hand of your enemies[a].
translation:
  language: de
  text: Denn er, der diese Übel über euch gebracht hat, wird euch aus der Hand eurer Feinde retten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieses Unheil« oder »diese Nöte«. Das griechische τὰ κακὰ kann sowohl Übel als auch schwere Bedrängnisse bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγαγὼν
  choice: über euch gebracht hat
  rationale: Das Aoristpartizip von ἐπάγω bezeichnet hier, dass jemand etwas über andere kommen lässt. Die Formulierung ist im Deutschen natürlich und bewahrt die gerichtete Bedeutung.
- source_word: τὰ κακὰ
  choice: diese Übel
  rationale: κακά kann Übel, Nöte oder Unheil bezeichnen. »Diese Übel« wahrt die moralische wie leidvolle Bedeutungsbreite und bezieht den Ausdruck auf die zuvor genannten Leiden.
- source_word: ἐξελεῖται
  choice: wird ... retten
  rationale: Das Futur Medium von ἐξαιρέω bedeutet hier, jemanden aus Gefahr oder Gewalt zu retten beziehungsweise zu befreien. »Retten« ist klar und gegenwärtig.
- source_word: ἐκ χειρὸς
  choice: aus der Hand
  rationale: Die biblische Wendung bezeichnet die Gewalt oder Verfügungsgewalt eines anderen. Die bildhafte Ausdrucksweise bleibt im Deutschen verständlich.
- source_word: ἐχθρῶν
  choice: Feinde
  rationale: Dies ist die gewöhnliche und kontextuell passende Bedeutung von ἐχθροί.
theological_decisions:
- issue: Göttliches Handeln in Gericht und Rettung
  choice: Derselbe Handelnde, der die Übel über das Volk gebracht hat, wird es auch retten.
  alternative: Eine unpersönlichere Wiedergabe, die vermeidet, das Herbeiführen der Übel ausdrücklich demselben Handelnden zuzuschreiben.
  rationale: Der griechische Satz hat als Subjekt »der, der die Übel über euch gebracht hat« und schreibt diesem einen Handelnden sowohl das Gericht als auch die künftige Rettung zu. Diese Spannung wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung »der, der« bildet die substantivierte griechische Partizipialkonstruktion verständlich ab; die biblische Wendung »aus der Hand« bleibt erhalten.
