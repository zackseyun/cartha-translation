base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/015.yaml
  text: For he brought against them a nation from far away[a], a shameless and foreign-speaking nation, which showed no respect for the old man and had no mercy on the child[b],
translation:
  language: de
  text: Denn er führte gegen sie ein Volk aus der Ferne heran, ein schamloses Volk fremder Sprache, das dem alten Mann keinen Respekt erwies und dem Kind kein Erbarmen zeigte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich stehen im Griechischen „der alte Mann“ und „das Kind“; die Einzahl stellt hier schutzbedürftige Menschen beispielhaft vor Augen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπήγαγεν ... ἐπʼ αὐτούς
  choice: führte gegen sie ... heran
  rationale: Die Verbindung bezeichnet das Heranführen einer feindlichen Macht gegen sie; die deutsche Formulierung bewahrt sowohl die Bewegungsrichtung als auch den feindlichen Sinn.
- source_word: ἔθνος μακρόθεν
  choice: ein Volk aus der Ferne
  rationale: ἔθνος bezeichnet hier ein fremdes Volk als angreifende Gemeinschaft; μακρόθεν hebt dessen ferne Herkunft hervor.
- source_word: ἀναιδές
  choice: schamloses
  rationale: Die direkte Bedeutung ist ein Mangel an Scham beziehungsweise dreiste Unverschämtheit; „schamlos“ bleibt lexikalisch eng am Griechischen.
- source_word: ἀλλόγλωσσον
  choice: fremdsprachiges
  rationale: Das Kompositum bezeichnet ein Volk, das eine andere beziehungsweise fremde Sprache spricht. „Fremdsprachig“ ist knapp und in modernem Deutsch verständlich.
- source_word: οὐκ ᾐσχύνθησαν πρεσβύτην
  choice: vor dem alten Mann keine Achtung hatte
  rationale: αἰσχύνομαι bezeichnet in diesem Zusammenhang die ausbleibende ehrerbietige Scheu gegenüber einem alten Mann; „keine Achtung haben“ gibt den sozialen Sinn natürlich wieder.
- source_word: οὐδὲ παιδίον ἠλέησαν
  choice: mit dem Kind kein Erbarmen
  rationale: ἐλεέω bedeutet Erbarmen oder Mitleid zeigen. Die Formulierung bewahrt die starke Parallelität zur Missachtung des alten Mannes.
theological_decisions:
- issue: Repräsentative Singulare für schutzbedürftige Menschen
  choice: der alte Mann ... das Kind
  alternative: alte Menschen ... Kinder
  rationale: Das Griechische verwendet πρεσβύτην und παιδίον im Singular. Die Beibehaltung des Singulars wahrt die konkrete, repräsentative Rhetorik, ohne sie zu verallgemeinern.
- issue: Bezug des Relativsatzes
  choice: das ... keine Achtung hatte und ... kein Erbarmen
  alternative: die ... keine Achtung hatten und ... kein Erbarmen hatten
  rationale: Das Relativpronomen ὅτι leitet hier inhaltlich die Beschreibung des zuvor genannten Volkes ein; im Deutschen wird der Bezug auf das singularische „Volk“ klar und natürlich wiedergegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Volk“ und die repräsentativen Singulare des griechischen Textes bleiben erhalten. Der Vers endet entsprechend dem fortlaufenden Satzbau mit einem Komma beziehungsweise kann im Satzkontext weitergeführt werden; als Einzeldarstellung steht hier ein Punkt.
