lexical_decisions:
- source_word: πῦρ
  choice: Feuer
  rationale: Die artikellose Form bezeichnet hier Feuer als Bild beziehungsweise Mittel des Gerichts; eine unbestimmte Ergänzung wie „ein Feuer“ ist im Deutschen nicht nötig.
- source_word: ἐπελεύσεται αὐτῇ
  choice: wird über sie kommen
  rationale: Die Wendung bewahrt die Vorstellung eines in feindlicher beziehungsweise richtender Weise über die personifizierte Stadt kommenden Geschehens.
- source_word: παρὰ τοῦ αἰωνίου
  choice: vom Ewigen
  rationale: Das substantivierte Adjektiv ist ein Gottes­titel. „Vom Ewigen“ gibt ihn knapp wieder, ohne das im Griechischen nicht ausdrücklich stehende Wort „Gott“ einzufügen.
- source_word: εἰς ἡμέρας μακράς
  choice: viele Tage lang
  rationale: Die griechische Zeitangabe bezeichnet eine lange Dauer; diese Formulierung ist im heutigen Deutsch natürlich und bleibt beim Bild der Tage.
- source_word: κατοικηθήσεται
  choice: wird … bewohnt sein
  rationale: Das Passiv stellt die Stadt als Wohnstätte dar. Die deutsche Futurform gibt den zukünftigen Zustand idiomatisch wieder.
- source_word: δαιμονίων
  choice: Dämonen
  rationale: Im jüdisch-griechischen Zusammenhang der verwüsteten Stadt sind feindliche Geistwesen gemeint; „Dämonen“ ist die klare und etablierte Entsprechung.
- source_word: τὸν πλεῖονα χρόνον
  choice: sehr lange Zeit
  rationale: Die vergleichende Form bezeichnet im Zusammenhang eine ausgedehnte Dauer. Die Hauptübersetzung gibt den idiomatischen Sinn wieder; die formal näheren Möglichkeiten werden in einer Fußnote offengehalten.
theological_decisions:
- issue: Gottestitel τοῦ αἰωνίου
  choice: vom Ewigen
  alternative: vom ewig Bleibenden; vom ewigen Gott
  rationale: Die Übersetzung wahrt den substantivischen Titelcharakter und benennt den göttlichen Bezug, ohne das Substantiv „Gott“ ergänzend in den Haupttext einzutragen.
- issue: Bedeutung von δαιμόνια im Gerichtswort
  choice: Dämonen
  alternative: böse Geister
  rationale: Die Wesen erscheinen als unheilvolle Bewohner der verwüsteten Stadt. „Dämonen“ entspricht dem griechischen Begriff direkt und vermeidet eine erklärende Paraphrase.
- issue: Zeitangabe τὸν πλεῖονα χρόνον
  choice: sehr lange Zeit
  alternative: die meiste Zeit; die längere Zeit
  rationale: Der Kontext legt eine lang anhaltende Verwüstung nahe, doch die grammatische Vergleichsform lässt auch formalere Wiedergaben zu; diese Spannung wird durch die Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stadt bleibt durch das feminine Pronomen personifiziert; Satzbau und Zeitangaben sind lesbar gestaltet, ohne die Bildsprache oder die Dauer des Gerichts abzuschwächen.
