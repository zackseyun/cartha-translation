  text: For fire will come upon her from the Everlasting One for many days[a], and she will be inhabited by demons for a very long time.
translation:
  language: de
  text: Denn Feuer wird vom Ewigen[a] über sie kommen, viele Tage lang, und sie wird von Dämonen für sehr lange Zeit[b] bewohnt sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht ein substantiviertes Adjektiv, das hier als Gottestitel gebraucht wird.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „für die längere Zeit“. Die Wendung bezeichnet hier eine lange Dauer.'
