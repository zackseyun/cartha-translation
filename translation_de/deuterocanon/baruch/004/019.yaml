lexical_decisions:
- source_word: βαδίζετε
  choice: Geht
  rationale: Das Verb bedeutet wörtlich „gehen“ und fordert hier eindringlich zum Aufbruch auf. Die Wiederholung wird als Ausdruck des Nachdrucks beibehalten.
- source_word: τέκνα
  choice: Kinder
  rationale: τέκνα bezeichnet Kinder unabhängig vom Geschlecht und passt zur mütterlichen Anrede Jerusalems im Zusammenhang.
- source_word: κατελείφθην
  choice: bin … zurückgeblieben
  rationale: Die passive Verbform beschreibt, dass die Sprecherin zurückgelassen wurde, mit einem bis in die Gegenwart reichenden Ergebnis. Die deutsche Formulierung ist natürlich und vermeidet die stärkere Deutung „verstoßen“.
- source_word: ἔρημος
  choice: verlassen
  rationale: ἔρημος kann „einsam“, „verlassen“ oder „verödet“ bedeuten. „Verlassen“ bewahrt sowohl die äußere Verlassenheit als auch den klagenden emotionalen Klang, ohne die Mehrdeutigkeit unnötig einzuengen.
theological_decisions:
- issue: Gefühlsmäßige und situative Tragweite von ἔρημος
  choice: denn ich bin verlassen zurückgeblieben
  alternative: denn ich bin einsam zurückgelassen worden; denn ich bin verödet zurückgeblieben
  rationale: Die Aussage ist eine Klage. „Verlassen“ gibt ihre emotionale und situative Weite wieder, ohne ausdrücklich zu behaupten, die Sprecherin sei vorsätzlich aufgegeben oder verstoßen worden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Aufforderung bleibt erhalten; das Semikolon bildet den knappen, klagenden Rhythmus des griechischen Satzes nach.
