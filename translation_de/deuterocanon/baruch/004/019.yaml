  text: Geht[a], Kinder, geht; denn ich bin allein zurückgelassen worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zieht fort, Kinder, zieht fort.“ Das griechische Verb bedeutet wörtlich „gehen“ und ist hier ein dringender Aufruf zum Aufbruch.'
