base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/022.yaml
  text: For I have hoped in the Eternal One for your salvation, and joy has come to me from the Holy One because of the mercy that will quickly come to you from your eternal Savior.
translation:
  language: de
  text: Denn ich habe auf den Ewigen gehofft, dass er euch rettet, und vom Heiligen ist mir Freude gekommen über das Erbarmen, das euch schnell von eurem ewigen Retter zuteilwerden wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῷ αἰωνίῳ
  choice: auf den Ewigen
  rationale: Bewahrt die substantivierte Gottesbezeichnung und gibt die mit ἐλπίζω verbundene Ausrichtung des Vertrauens natürlich wieder.
- source_word: τὴν σωτηρίαν ὑμῶν
  choice: dass er euch rettet
  rationale: Die verbale Wiedergabe ist im modernen Deutsch natürlicher als „eure Rettung“, ohne den Inhalt zu verändern.
- source_word: ἐλεημοσύνῃ
  choice: Erbarmen
  rationale: Im Kontext bezeichnet das Wort die rettende Barmherzigkeit Gottes, nicht menschliches Almosengeben.
- source_word: ἐν τάχει
  choice: bald
  rationale: Drückt das zeitlich nahe Eintreffen idiomatisch aus; das Griechische kann je nach Kontext auch „schnell“ bedeuten.
- source_word: τοῦ αἰωνίου σωτῆρος ὑμῶν
  choice: eurem ewigen Retter
  rationale: Bildet Adjektiv, Beziehungspronomen und Rettertitel direkt und verständlich ab.
theological_decisions:
- issue: Verhältnis von Hoffnung und Rettung
  choice: „auf den Ewigen gehofft, dass er euch rettet“
  alternative: „beim Ewigen auf eure Rettung gehofft“
  rationale: Die gewählte Fassung macht den Ewigen eindeutig zum Gegenstand der Hoffnung und wahrt zugleich die erwartete Rettung der Angeredeten.
- issue: Bedeutung von ἐλεημοσύνη
  choice: Gottes „Erbarmen“
  alternative: „Barmherzigkeit“ oder „Wohltat“
  rationale: Der Kontext weist auf das kommende rettende Handeln des Heiligen hin; die Fassung vermeidet die hier irreführende Bedeutung „Almosen“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Gottesbezeichnungen „der Ewige“, „der Heilige“ und „ewiger Retter“ bleiben erhalten. Der lange griechische Satz wird in seiner Gedankenführung bewahrt, aber idiomatisch formuliert.
