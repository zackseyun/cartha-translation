lexical_decisions:
- source_word: οἱ τρυφεροί μου
  choice: Meine zart Aufgewachsenen
  rationale: τρυφερός bezeichnet hier Menschen, die an Zartheit, Schonung oder ein bequemes Leben gewöhnt waren. Die Formulierung wahrt den Kontrast zwischen ihrer früheren Lebenslage und den Mühen der Verschleppung, ohne den im Deutschen oft vorwurfsvollen Beiklang von „verwöhnt“ in den Haupttext zu übernehmen.
- source_word: ἐπορεύθησαν
  choice: zogen
  rationale: Das deponentische Verb πορεύομαι bedeutet „gehen“, „ziehen“ oder „reisen“. „Zogen“ verbindet sich im Deutschen natürlich mit dem folgenden Wegmotiv und passt zum Zusammenhang einer erzwungenen Ortsveränderung, ohne den Zwang bereits in dieses Verb hineinzulesen.
- source_word: ὁδοὺς τραχείας
  choice: über raue Wege
  rationale: ὁδός bezeichnet einen Weg, τραχύς etwas Raues oder Unwegsames. Die konkrete Bildsprache des beschwerlichen Weges bleibt erhalten.
- source_word: ἤρθησαν
  choice: sie wurden fortgeschleppt
  rationale: Das Passiv von αἴρω kann „weggenommen“ oder „fortgetragen“ bedeuten. Im Zusammenhang mit der von Feinden geraubten Herde bringt „fortgeschleppt“ die gewaltsame Verschleppung klar und idiomatisch zum Ausdruck.
- source_word: ὡς ποίμνιον
  choice: wie eine Herde
  rationale: ποίμνιον bezeichnet eine Herde, möglicherweise eine kleine Herde. „Herde“ bewahrt den Vergleich, ohne die Diminutivnuance unnötig hervorzuheben.
- source_word: ἡρπασμένον
  choice: die … geraubt wurde
  rationale: Das Partizip von ἁρπάζω bezeichnet gewaltsames Ergreifen oder Rauben. Die Relativsatzkonstruktion gibt den griechischen Sinn in natürlichem Deutsch wieder.
- source_word: ὑπὸ ἐχθρῶν
  choice: von Feinden
  rationale: Die Pluralform wird unmittelbar wiedergegeben und nicht auf einen einzelnen Feind verengt.
theological_decisions:
- issue: Aussagekraft des Herdenvergleichs
  choice: Der Text stellt die Betroffenen als schutzlose, von Feinden gewaltsam fortgebrachte Herde dar.
  alternative: Das Bild könnte allgemeiner lediglich auf Leid und Bedrängnis bezogen werden.
  rationale: Der griechische Text verwendet einen Vergleich und formuliert keine weitergehende theologische Deutung. Die Übersetzung bewahrt das Bild und legt es nicht ausdrücklich auf eine bestimmte Lehre fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Weg- und Herdenbildsprache bleibt erhalten; „zart Aufgewachsenen“ vermeidet den überwiegend tadelnden Klang von „Verwöhnten“, während die Fußnote die Bedeutungsbreite offenlegt.
