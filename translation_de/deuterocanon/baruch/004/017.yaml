lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Ich aber
  rationale: Das ausdrücklich gesetzte Pronomen bewahrt die Betonung der Sprecherin; δέ markiert den Kontrast. Die knappe Voranstellung ist im Deutschen natürlich und quellennah.
- source_word: τί
  choice: wie
  rationale: 'Im Zusammenhang mit δυνατή und dem Infinitiv fragt τί idiomatisch nach der Möglichkeit: „wie“ gibt die rhetorische Frage natürlicher wieder als ein wörtliches „was“.'
- source_word: δυνατὴ
  choice: könnte ich
  rationale: Das prädikative Adjektiv bezeichnet Fähigkeit oder Vermögen. Der deutsche Konjunktiv „könnte“ bringt in der rhetorischen Frage die gemeinte Unfähigkeit idiomatisch zum Ausdruck, ohne sie in eine ausdrückliche Verneinung umzuwandeln.
- source_word: βοηθῆσαι
  choice: helfen
  rationale: „Helfen“ ist die klare, unmittelbare Entsprechung für das Leisten von Beistand.
- source_word: ὑμῖν
  choice: euch
  rationale: „Euch“ gibt den Dativ Plural eindeutig und natürlich wieder.
