  naturalness: Der Satz ist gut verständlich und hat einen angemessenen biblisch-würdigen, modernen Ton. „Mit Trauer und Weinen“ sowie „mit Freude und Fröhlichkeit“ sind im Deutschen natürliche parallele Wortpaare. Ein Komma vor „für immer“ ist hier flüssiger und weniger typographisch hervorgehoben als ein Gedankenstrich.
  terminology: „Gott“, „Trauer“, „Weinen“, „Freude“ und „zurückgeben“ sind passend. „Fröhlichkeit“ wahrt die semantische Nähe zu εὐφροσύνη besser als „Jubel“, ohne die Doppelung mit χαρμοσύνη aufzugeben.
