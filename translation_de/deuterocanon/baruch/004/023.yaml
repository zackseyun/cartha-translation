translation:
  language: de
  text: Denn ich habe euch mit Trauer und Weinen fortgeschickt; doch Gott wird euch mir mit Freude und Fröhlichkeit zurückgeben, für immer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέπεμψα
  choice: ich habe ... fortgeschickt
  rationale: Das Kompositum ἐκπέμπω bezeichnet ein Fort- oder Aussenden. „Fortgeschickt“ bewahrt die räumliche Trennung, ohne eine förmliche Verbannung ausdrücklich festzulegen.
- source_word: μετὰ πένθους καὶ κλαυθμοῦ
  choice: unter Trauer und Weinen
  rationale: πένθος bezeichnet Trauer, κλαυθμός das Weinen oder laute Klagen. Die Wendung gibt beide emotionalen Begriffe natürlich und unterscheidbar wieder.
- source_word: ἀποδώσει ... ὑμᾶς ... μοι
  choice: wird euch mir ... zurückgeben
  rationale: ἀποδίδωμι kann „zurückgeben“ oder „wiederherstellen“ bedeuten. Mit dem ausdrücklichen Dativ μοι und den Personen als Objekt ist „euch mir zurückgeben“ relational und quellennah.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Der griechische Artikel wird beim Gottesnamen im Deutschen idiomatisch nicht eigens wiedergegeben.
- source_word: μετὰ χαρμοσύνης καὶ εὐφροσύνης
  choice: mit Freude und Jubel
  rationale: Die zwei nah verwandten Ausdrücke werden als Wortpaar bewahrt. „Jubel“ gibt bei εὐφροσύνη die freudige Feststimmung wieder und vermeidet die schwerfällige Paarung „Freude und Fröhlichkeit“.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die idiomatische Wendung bezeichnet hier bleibende Dauer; „für immer“ ist klar, modern und würdevoll.
theological_decisions:
- issue: Sprecherin und relationale Rahmung
  choice: 'Der Dativ μοι wird mit „mir“ ausdrücklich bewahrt: Gott wird die Angesprochenen der als Mutter dargestellten Jerusalem/Zion zurückgeben.'
  alternative: „Gott wird euch wiederherstellen“ ohne „mir“.
  rationale: Der Kontext personifiziert Jerusalem als Mutter, und μοι ist im griechischen Text ausdrücklich vorhanden. Die Wiedergabe bewahrt daher die familiäre und gemeinschaftliche Bildwelt.
- issue: Bedeutungsumfang von ἀποδώσει
  choice: „zurückgeben“
  alternative: „wiederherstellen“
  rationale: Beides ist lexikalisch möglich. Die konkrete Konstruktion mit „euch“ und „mir“ stützt hier „zurückgeben“, ohne den umfassenderen Gedanken der Wiederherstellung auszuschließen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Der parallele Gegensatz zwischen „Trauer und Weinen“ und „Freude und Jubel“ bleibt erhalten; das abschließende „für immer“ wird durch den Gedankenstrich hervorgehoben.
