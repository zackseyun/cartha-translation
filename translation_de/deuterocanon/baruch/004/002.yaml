translation:
  language: de
  text: Kehre um, Jakob, und ergreife sie[a]; geh auf den Glanz zu, ihrem Licht entgegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Pronomen ist feminin. Im unmittelbaren Zusammenhang kann es sich auf das „Buch der Gebote Gottes“ beziehen, das im Griechischen feminin ist; die feminine Wiedergabe bewahrt zugleich die personifizierende Bildsprache.
