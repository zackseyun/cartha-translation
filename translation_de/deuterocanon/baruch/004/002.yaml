lexical_decisions:
- source_word: ἐπιστρέφου
  choice: Kehre um
  rationale: Der Imperativ kann sowohl eine Richtungsänderung als auch eine Rückkehr bezeichnen. „Kehre um“ bewahrt diese Spannweite und passt zur auffordernden Sprache des Zusammenhangs.
- source_word: Ἰακώβ
  choice: Jakob
  rationale: Der Eigenname wird unmittelbar wiedergegeben; obwohl damit im Zusammenhang Israel gemeint ist, wird die Benennung des griechischen Textes nicht ersetzt.
- source_word: ἐπιλαβοῦ
  choice: ergreife
  rationale: „Ergreife“ gibt das konkrete Zufassen des griechischen Verbs knapp und würdig wieder, ohne die stärkere Bedeutung „an sich reißen“ einzutragen.
- source_word: αὐτῆς
  choice: sie / ihrem
  rationale: Die femininen Pronomen werden feminin wiedergegeben und bewahren so die im Zusammenhang naheliegende Personifikation von Weisheit beziehungsweise Gesetz.
- source_word: διόδευσον
  choice: geh … zu
  rationale: Das Verb bezeichnet das Gehen oder Sich-auf-den-Weg-Machen. Die schlichte Formulierung ist im modernen Deutsch natürlich und erhält das Bewegungsbild.
- source_word: λάμψιν
  choice: Glanz
  rationale: „Glanz“ bezeichnet die leuchtende Helligkeit und lässt sich zugleich von „Licht“ als Wiedergabe von φῶς unterscheiden.
- source_word: κατέναντι
  choice: entgegen
  rationale: Das Wort kann räumlich „gegenüber“, „vor“ oder kontextuell eine Ausrichtung auf etwas bezeichnen. „Entgegen“ ergibt mit dem Bewegungsverb einen verständlichen deutschen Satz, während die formalere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: φωτός
  choice: Licht
  rationale: „Licht“ ist die direkte und geläufige Entsprechung und bewahrt die poetische Verbindung mit „Glanz“.
theological_decisions:
- issue: Personifikation des femininen Bezugs von αὐτῆς
  choice: Die feminine Bezugnahme wird im Haupttext mit „sie“ und „ihrem“ bewahrt.
  alternative: Eine sachliche Wiedergabe mit „es“ und „seinem“ ist möglich, wenn ausschließlich auf das grammatisch feminine Gesetz oder Gebot Bezug genommen wird.
  rationale: Der Zusammenhang verbindet Gesetz und Weisheit in personifizierender Sprache. Die feminine Form erhält diese literarisch-theologische Spannung, ohne abschließend festzulegen, ob eine eigenständige Weisheitsgestalt oder das personifizierte Gesetz gemeint ist.
- issue: Räumliches Verhältnis von Glanz und Licht
  choice: „geh auf den Glanz zu, ihrem Licht entgegen“
  alternative: 'Formal näher: „geh auf den Glanz zu, gegenüber ihrem Licht“; idiomatisch zusammengezogen: „geh auf den Glanz ihres Lichtes zu“'
  rationale: Die griechische Fügung ist ungewöhnlich und lässt offen, ob κατέναντι lediglich die Ausrichtung bezeichnet oder „gegenüber/vor“ räumlich stärker hervorhebt. Der Haupttext bleibt verständlich; die Fußnote bewahrt die syntaktische Mehrdeutigkeit.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Aufforderungston. Die Anrede „Jakob“ bleibt ohne altertümelndes „o“. Das Semikolon erhält die zweigliedrige Struktur des griechischen Satzes; die ungewöhnliche Bildsprache wird nicht dogmatisch vereindeutigt.
