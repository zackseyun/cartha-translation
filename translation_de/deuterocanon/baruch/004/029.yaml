base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/029.yaml
  text: For the one who brought evils upon you will bring you everlasting gladness with your salvation[a][b].
translation:
  language: de
  text: Denn der, der das Unheil über euch gebracht hat, wird euch ewige Freude bringen, zusammen mit eurer Rettung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zusammen mit eurem Heil« beziehungsweise »mit eurer Befreiung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἐπαγαγὼν ... ἐπάξει
  choice: der ... gebracht hat, wird ... bringen
  rationale: Die Wiederholung von ἐπάγω wird durch »bringen« in beiden Satzhälften bewahrt und macht die Gegenüberstellung von vergangenem Unheil und künftiger Freude hörbar.
- source_word: τὰ κακά
  choice: das Unheil
  rationale: Der substantivierte Plural bezeichnet hier die erfahrenen Übel beziehungsweise das Unheil. Der deutsche Kollektivsingular klingt natürlich und fügt kein im Griechischen fehlendes Demonstrativpronomen hinzu.
- source_word: τὴν αἰώνιον εὐφροσύνην
  choice: ewige Freude
  rationale: εὐφροσύνη bezeichnet Freude oder Frohsinn; »Freude« ist im heutigen Standarddeutsch klar und würdig. αἰώνιος wird direkt mit »ewig« wiedergegeben.
- source_word: μετὰ τῆς σωτηρίας ὑμῶν
  choice: zusammen mit eurer Rettung
  rationale: μετά mit Genitiv bezeichnet Begleitung. σωτηρία kann Rettung, Befreiung oder Heil bedeuten; im Kontext der Wiederherstellung ist »Rettung« konkret und lässt die weiterreichende theologische Bedeutung offen.
theological_decisions:
- issue: Göttliche Urheberschaft von Gericht und Wiederherstellung
  choice: Derselbe Handelnde bringt sowohl das Unheil als auch die ewige Freude und Rettung.
  alternative: Die erste Aussage könnte abgeschwächt werden, etwa indem das Unheil nur als zugelassen oder widerfahren dargestellt würde.
  rationale: Der griechische Text verwendet für beide Handlungen dasselbe Verb und bewahrt damit ausdrücklich die Spannung, dass derselbe göttliche Akteur Gericht und Wiederherstellung herbeiführt.
- issue: Bedeutungsumfang von σωτηρία
  choice: Rettung
  alternative: Heil oder Befreiung
  rationale: »Rettung« passt zum Kontext der Befreiung aus dem gegenwärtigen Unheil, ohne eine ausschließlich politische oder ausschließlich geistliche Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusste Wiederholung von »bringen« bildet den griechischen Parallelismus ab. »Das Unheil« ist idiomatischer als »die Übel«; »zusammen mit« verdeutlicht die Begleitkonstruktion, ohne sie auszudeuten.
