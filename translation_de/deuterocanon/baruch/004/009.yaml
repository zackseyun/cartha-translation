base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/009.yaml
  text: 'For he saw the wrath that came upon you from God[a], and he said, “Hear, you neighbors of Zion: God has brought upon me great mourning.”'
translation:
  language: de
  text: 'Denn sie sah den Zorn, der von Gott über euch kam, und sagte: »Hört, ihr Nachbarn Zions[a]: Gott hat große Trauer über mich gebracht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Beisassen Zions«, »ihr ansässigen Fremden bei Zion« oder »ihr Bewohner in der Nähe Zions«. Das griechische πάροικοι bezeichnet Menschen, die bei oder neben einem Ort wohnen, mitunter ansässige Fremde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: sie sah
  rationale: Das Verb bezeichnet hier ein konkretes Wahrnehmen. Das im vorigen Vers genannte Jerusalem ist die fortwirkende Sprecherin und wird im Deutschen mit »sie« aufgenommen.
- source_word: τὴν ἐπελθοῦσαν ὑμῖν ὀργὴν
  choice: den Zorn, der … über euch kam
  rationale: Die Formulierung bewahrt sowohl ὀργή als »Zorn« als auch das Bild eines über die Angeredeten kommenden Gerichts.
- source_word: παρὰ τοῦ θεοῦ
  choice: von Gott
  rationale: Die Präposition bezeichnet hier Ursprung beziehungsweise Urheberschaft und lässt die ausdrückliche göttliche Zuordnung bestehen.
- source_word: Ἀκούσατε
  choice: Hört
  rationale: Der knappe Imperativ entspricht dem öffentlichen, klagenden Aufruf und wahrt den würdigen Ton.
- source_word: οἱ πάροικοι Σειών
  choice: ihr Nachbarn Zions
  rationale: πάροικοι kann Menschen bezeichnen, die bei oder neben einem Ort wohnen, teils auch ansässige Fremde. »Nachbarn Zions« hält die räumliche und relationale Unterscheidung zu den eigentlichen Bewohnern Zions offen.
- source_word: ἐπήγαγέ μοι
  choice: hat … über mich gebracht
  rationale: Die Wendung drückt aus, dass Gott das Leid über die Sprecherin kommen ließ; das Perfekt ist im gegenwärtigen Klageruf natürlich.
- source_word: πένθος μέγα
  choice: großes Leid
  rationale: πένθος bezeichnet Trauer, Klage oder den Zustand des Trauerns. »Großes Leid« klingt im Deutschen natürlich und kann sowohl den schmerzlichen Zustand als auch seine klagende Äußerung umfassen.
theological_decisions:
- issue: Göttliche Urheberschaft des Gerichts und des Leids
  choice: Der Zorn kommt ausdrücklich von Gott, und Gott bringt das große Leid über die Sprecherin.
  alternative: Eine abgeschwächte Formulierung, die das Unheil nur als zugelassen oder unpersönlich geschehen darstellt.
  rationale: Der griechische Text ordnet sowohl den Zorn durch παρὰ τοῦ θεοῦ als auch das Leid durch ὁ θεός unmittelbar Gott zu. Diese Spannung wird nicht gemildert.
- issue: Identität der Sprecherin
  choice: Das im Zusammenhang personifizierte Jerusalem wird mit »sie« aufgenommen.
  alternative: 'Ein nicht näher bestimmtes männliches Subjekt: »er sah … und sagte«.'
  rationale: Die griechischen Verbformen εἶδεν und εἶπεν markieren kein Genus. Der unmittelbare Zusammenhang nennt jedoch Jerusalem als diejenige, die von ihren Kindern betrübt wurde und nun die Nachbarn Zions anredet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Klage- und Aufrufton. Die direkte Rede ist knapp gehalten; die personifizierte Sprecherin Jerusalem wird aus dem unmittelbaren Zusammenhang erschlossen. Der Fußnotenmarker steht unmittelbar bei der lexikalisch mehrdeutigen Anrede.
