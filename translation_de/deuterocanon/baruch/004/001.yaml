base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/001.yaml
  text: This is the book of the commandments of God[a], and the law that endures forever; all who hold fast to it are for life, but those who forsake it will die.
translation:
  language: de
  text: Dies ist das Buch der Gebote Gottes und das Gesetz, das in Ewigkeit besteht. Alle, die daran festhalten, werden leben[a]; die es aber verlassen, werden sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Alle, die daran festhalten, zum Leben.“ Die griechische Wendung ist elliptisch; möglich ist auch: „Alle, die daran festhalten, sind für das Leben bestimmt.“'
    reason: Die griechische Wendung εἰς ζωὴν enthält kein ausdrückliches finites Verb. „werden leben“ löst die Ellipse im Deutschen natürlich auf, während die Fußnote die knappe Form und ihre mögliche Nuance sichtbar macht.
lexical_decisions:
- source_word: βίβλος
  choice: Buch
  rationale: Die gewöhnliche Bedeutung ist ein schriftliches Buch oder Dokument. „Buch“ ist im modernen Deutschen natürlich und passt zur Wendung „Buch der Gebote“.
- source_word: προσταγμάτων
  choice: Gebote
  rationale: πρόσταγμα bezeichnet eine verbindliche Anordnung. „Gebote“ vermittelt die göttliche Autorität und passt zum parallelen νόμος.
- source_word: νόμος
  choice: Gesetz
  rationale: Im Zusammenhang bezeichnet νόμος Gottes verbindliches Gesetz. „Gesetz“ bewahrt den rechtlichen und theologischen Gehalt deutlicher als „Weisung“.
- source_word: ὁ ὑπάρχων εἰς τὸν αἰῶνα
  choice: das in Ewigkeit besteht
  rationale: Die Wendung drückt bleibende Existenz und Geltung aus. „In Ewigkeit besteht“ ist würdig, verständlich und eng am Griechischen.
- source_word: κρατοῦντες αὐτῆς
  choice: die daran festhalten
  rationale: κρατέω bezeichnet hier beharrliches Festhalten. Das Pronomen wird mit „daran“ natürlich auf das unmittelbar zuvor genannte Gesetz bezogen.
- source_word: εἰς ζωὴν
  choice: gelangen zum Leben
  rationale: Das griechische „zum/ins Leben“ ist elliptisch und enthält kein ausdrückliches finites Verb. „Gelangen zum Leben“ macht die Aussage im Deutschen verständlich, ohne sie schlicht mit „werden leben“ gleichzusetzen; die Ellipse wird in einer Fußnote kenntlich gemacht.
- source_word: καταλείποντες αὐτήν
  choice: die es verlassen
  rationale: καταλείπω bedeutet zurücklassen oder verlassen. „Verlassen“ bewahrt das Bild der Abkehr und vermeidet die heute gehobene, weniger alltägliche Form „verlassen“ im Sinne von „im Stich lassen“ nicht; der Kontext macht die bewusste Abkehr deutlich.
- source_word: ἀποθανοῦνται
  choice: werden sterben
  rationale: Die einfache Zukunft wird direkt und klar mit „werden sterben“ wiedergegeben.
theological_decisions:
- issue: Wie die elliptische Wendung πάντες οἱ κρατοῦντες αὐτῆς, εἰς ζωὴν wiederzugeben ist
  choice: Alle, die daran festhalten, gelangen zum Leben.
  alternative: Alle, die daran festhalten, werden leben.
  rationale: Der griechische Text sagt wörtlich nur „alle, die an ihr festhalten, zum Leben“ und stellt dies dem ausdrücklichen „werden sterben“ gegenüber. Die gewählte Fassung wahrt die Ausrichtung auf das Leben, ohne die Ellipse unmarkiert in eine parallele Zukunftsaussage aufzulösen.
- issue: Ob νόμος als „Gesetz“ oder breiter als „Weisung“ wiederzugeben ist
  choice: Gesetz
  alternative: Weisung
  rationale: Die unmittelbare Parallele zu den „Geboten Gottes“ spricht für verbindliche göttliche Normen. „Gesetz“ bewahrt diese Spannung und vermeidet eine abschwächende Verallgemeinerung.
- issue: Bewahrung des Gegensatzes von Leben und Tod
  choice: „zum Leben … werden sterben“
  alternative: „erlangen Heil … gehen zugrunde“
  rationale: ζωή und ἀποθνῄσκω benennen ausdrücklich Leben und Sterben. Die Übersetzung erhält diesen theologischen Grundgegensatz, ohne ihn in andere Heilsbegriffe umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz folgt der knappen Identifikationsformel des Griechischen. „In Ewigkeit besteht“ wahrt den feierlichen Ton, während „daran festhalten“ und „es verlassen“ allgemein verständlich bleiben.
