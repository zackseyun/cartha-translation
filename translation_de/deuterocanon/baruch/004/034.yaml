base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/034.yaml
  text: And I will take away from her the rejoicing of her many people[b][a], and turn her pride into mourning.
translation:
  language: de
  text: Und ich werde ihr den Jubel ihrer großen Menschenmenge[a] nehmen und ihren Stolz[b] in Trauer verwandeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Jubel über ihre vielen Bewohner“. Der griechische Ausdruck kann sowohl den Jubel der großen Menge als auch die Freude darüber bezeichnen, dass die Stadt volkreich ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihren Hochmut“ beziehungsweise „ihre stolze Pracht“. Das griechische Wort kann Stolz, hochmütige Selbstdarstellung oder glanzvolle Pracht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελῶ
  choice: ich werde … nehmen
  rationale: Das Futur von περιαιρέω bezeichnet hier das Wegnehmen oder Beseitigen. Die Verbindung „jemandem etwas nehmen“ gibt die unmittelbare Handlung natürlich wieder.
- source_word: ἀγαλλίαμα
  choice: Jubel
  rationale: Das Wort bezeichnet freudiges Frohlocken. „Jubel“ ist kraftvoll, gegenwärtig und passt zum Gegensatz mit der Trauer.
- source_word: τῆς πολυοχλίας
  choice: ihrer großen Menschenmenge
  rationale: πολυοχλία bezeichnet eine große Menschenmenge beziehungsweise den Zustand, volkreich zu sein. Die Genitivverbindung bleibt bewusst offen dafür, ob die Menge jubelt oder den Anlass des Jubels bildet.
- source_word: ἀγαυρίαμα
  choice: Stolz
  rationale: Das Substantiv kann Stolz, Hochmut oder stolze Pracht und Selbstdarstellung bezeichnen. „Stolz“ bewahrt die semantische Breite, während die Fußnote engere Möglichkeiten nennt.
- source_word: εἰς πένθος
  choice: in Trauer
  rationale: εἰς bezeichnet hier das Ergebnis einer Veränderung. „In Trauer verwandeln“ drückt diese Zielrichtung in natürlichem Deutsch aus.
theological_decisions:
- issue: Im zweiten Satzglied fehlt im Griechischen ein ausdrücklich wiederholtes Verb.
  choice: Das sinngemäß vorausgesetzte Verb wird mit „verwandeln“ ergänzt.
  alternative: 'Die griechische Ellipse wörtlicher nachbilden: „und ihren Stolz in Trauer“.'
  rationale: Die Ergänzung macht den deutschen Satz verständlich und gibt die durch εἰς πένθος bezeichnete Veränderung wieder, ohne eine zusätzliche theologische Aussage einzuführen.
- issue: Bezug des Genitivs τῆς πολυοχλίας
  choice: „der Jubel ihrer großen Menschenmenge“
  alternative: „der Jubel über ihre vielen Bewohner“ beziehungsweise „der Jubel über ihre Volksfülle“
  rationale: Der griechische Genitiv lässt offen, ob die Menge Trägerin des Jubels oder dessen Anlass ist. Die Hauptübersetzung erhält diese Spannung weitgehend; die Fußnote erläutert sie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jubel“ und „Trauer“ bilden den emotionalen Gegensatz klar ab; die ergänzte Wendung „in Trauer verwandeln“ löst lediglich die im Griechischen vorausgesetzte Verbhandlung sprachlich ein.
