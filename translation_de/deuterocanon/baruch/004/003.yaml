lexical_decisions:
- source_word: μὴ δῷς
  choice: Gib … nicht / keinem
  rationale: Der verneinte Aorist-Konjunktiv formuliert ein Verbot. Die deutsche Konstruktion mit „keinem“ ist klar und natürlich, ohne das stärkere „ausliefern“ einzutragen.
- source_word: ἑτέρῳ
  choice: keinem anderen
  rationale: ἕτερος bezeichnet hier einen anderen beziehungsweise jemand anderen. In Verbindung mit der Verneinung gibt „keinem anderen“ den knappen Gegensatz idiomatisch wieder.
- source_word: τὴν δόξαν σου
  choice: deinen Ruhm
  rationale: δόξα kann Ruhm, Ehre oder Herrlichkeit bedeuten. „Ruhm“ bewahrt den gehobenen, weiten Sinn, ohne den Bezug ausdrücklich auf Ansehen, Bundesvorrecht oder Gottes Herrlichkeit festzulegen.
- source_word: τὰ συμφέροντά σοι
  choice: das, was dir nützt
  rationale: Das substantivierte neutrale Plural bezeichnet das für den Angesprochenen Förderliche oder Vorteilhafte. Die Formulierung bleibt bewusst allgemein und legt weder materiellen Wohlstand noch geistliches Heil fest.
- source_word: ἔθνει ἀλλοτρίῳ
  choice: keinem fremden Volk
  rationale: ἔθνος bezeichnet hier ein Volk; ἀλλότριος kennzeichnet es als fremd beziehungsweise einem anderen zugehörig. „Fremdes Volk“ ist im Deutschen natürlicher und kontextgerechter als „fremde Nation“.
theological_decisions:
- issue: Bedeutung von τὴν δόξαν σου
  choice: „deinen Ruhm“ ohne nähere Bestimmung
  alternative: „deine Ehre“, „deine Herrlichkeit“ oder „das dir von Gott verliehene Vorrecht“
  rationale: Der griechische Text bestimmt den Bezug nicht ausdrücklich. Die allgemeine Wiedergabe wahrt die mögliche persönliche, gemeinschaftliche und bundestheologische Resonanz.
- issue: Bedeutung von τὰ συμφέροντά σοι
  choice: „das, was dir nützt“
  alternative: „dein Wohlergehen“, „deine Vorteile“ oder „deine Güter“
  rationale: Die Wendung ist semantisch weit. Sie wird daher nicht auf materiellen Besitz, politische Vorteile oder geistliches Gut eingeengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur des griechischen Verbots bleibt erhalten; „Volk“ vermeidet den im Deutschen stärker staatsrechtlichen Beiklang von „Nation“.
