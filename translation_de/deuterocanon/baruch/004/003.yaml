  text: Gib deine Herrlichkeit[a] keinem anderen und das, was dir nützt[b], keinem fremden Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Ehre“ oder „deinen Ruhm“. Das griechische Wort δόξα kann hier diese Bedeutungen haben.'
