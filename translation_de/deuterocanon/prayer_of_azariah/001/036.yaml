base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/036.yaml
  text: Bless the Lord, O heavens; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Ihr Himmel, preist den Herrn; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: preist
  rationale: Der Pluralimperativ fordert hier im hymnischen Zusammenhang zum lobenden Reden über Gott auf. „Preist“ ist im modernen Deutschen natürlicher als „segnet“, da Geschöpfe angesprochen werden, und bewahrt zugleich die liturgische Funktion.
- source_word: οὐρανοί
  choice: Ihr Himmel
  rationale: Der griechische Vokativ Plural bezeichnet die Himmel als direkt angesprochene Größe. „Ihr Himmel“ macht die Anrede im Deutschen eindeutig und erhält den gehobenen poetischen Ton.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος bezeichnet in dieser hymnischen Anrede Gott. „Herr“ ist die unmittelbare deutsche Entsprechung, ohne einen im griechischen Text nicht sichtbaren Gottesnamen vorauszusetzen.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Das Verb bezeichnet das Singen eines Hymnus oder Lobgesangs. „Singt ihm Lob“ gibt sowohl den musikalischen als auch den lobpreisenden Sinn natürlich wieder.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Das zusammengesetzte Verb verstärkt ὑψόω und fordert zu nachdrücklicher Erhöhung auf. „Erhebt ihn hoch“ erhält diese Intensivierung und passt zum parallelen hymnischen Rhythmus.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. „In Ewigkeit“ ist im Deutschen klar, würdig und für einen liturgischen Kehrvers idiomatisch.
theological_decisions:
- issue: Wiedergabe von κύριος in einer deuterokanonischen hymnischen Anrede an Gott
  choice: Herr
  alternative: HERR
  rationale: Die griechische Vorlage bietet κύριος und nicht unmittelbar den hebräischen Gottesnamen. „Herr“ folgt daher dem vorhandenen griechischen Wortlaut; „HERR“ würde einen zugrunde liegenden Gottesnamen typografisch anzeigen, den dieser Text nicht ausdrücklich enthält.
translation_notes:
  register: Moderner, würdiger Hymnenstil mit direkter Anrede und parallelen Pluralimperativen. Keine Fußnote ist erforderlich, da die semantischen Nuancen ohne textkritische oder sachliche Zusatzinformation verständlich wiedergegeben werden können.
