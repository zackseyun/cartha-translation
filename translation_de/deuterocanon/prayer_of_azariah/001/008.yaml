  yaml_path: translation/deuterocanon/prayer_of_azariah/001/008.yaml
  text: And now[a], all that you have brought upon us, and all that you have done to us, you have done in true judgment[b],
translation:
  language: de
  text: 'Und nun: Alles, was du über uns gebracht hast, und alles, was du an uns getan hast, hast du mit gerechtem Urteil getan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in wahrem/wahrhaftigem Urteil«; wörtlich: »in wahrer Beurteilung/Entscheidung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Gibt die fortführende Konjunktion und das zeitliche Adverb direkt und im Deutschen natürlich wieder.
- source_word: πάντα ὅσα
  choice: Alles, was
  rationale: Bewahrt in beiden parallelen Satzgliedern die umfassende und betonte Aussage des Griechischen, ohne unnötig förmlich zu klingen.
- source_word: ἐπήγαγες
  choice: du über uns gebracht hast
  rationale: Erhält die ausdrückliche göttliche Verursachung und den üblichen Sinn des Verbs bei einem über jemanden kommenden Unheil, ohne mit „zugefügt“ bereits eine engere Deutung festzulegen.
- source_word: ἐποίησας ἡμῖν
  choice: du an uns getan hast
  rationale: Gibt Verb und Dativ relativ formal wieder. Der Zusammenhang lässt eine belastende Erfahrung erkennen, doch die Formulierung vermeidet die stärkere wertende Festlegung „uns angetan“.
- source_word: ἐν ἀληθινῇ κρίσει
  choice: nach wahrem Urteil
  rationale: „Urteil“ bildet κρίσις direkt ab, während „wahr“ der Grundbedeutung von ἀληθινός folgt. „Nach“ ergibt im modernen Deutschen eine verständlichere Wendung als das wörtliche, aber sperrige „in wahrem Urteil“.
- source_word: ἐποίησας
  choice: hast du ... getan
  rationale: Das deutsche Perfekt verbindet die vergangenen Taten Gottes passend mit ihrem gegenwärtigen Bekenntnis.
theological_decisions:
- issue: Bewertung des göttlichen Handelns an den Sprechern
  choice: Auch das über die Sprecher gebrachte Leid wird ausdrücklich Gott zugeschrieben und als seinem wahren Urteil entsprechend bekannt.
  alternative: Die Schlusswendung kann deutender als „in gerechtem Gericht“ oder „mit gerechtem Urteil“ wiedergegeben werden.
  rationale: Der Text verbindet Gottes Handeln ausdrücklich mit ἐν ἀληθινῇ κρίσει. Die Übersetzung wahrt diese Spannung und schwächt weder Gottes Handlungsmacht ab noch erweitert sie die Aussage zu einer ausgearbeiteten Vergeltungslehre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „Alles, was“ erhält den Parallelismus des griechischen Textes. Der Doppelpunkt nach „Und nun“ macht den Satzbau klar, ohne den Inhalt auszudeuten.
