base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/030.yaml
  text: Blessed are you in the temple of your holy glory, and highly praised and exceedingly glorious forever.
translation:
  language: de
  text: Gepriesen bist du im Tempel deiner heiligen Herrlichkeit, hoch gerühmt und über alle Maßen herrlich in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος
  choice: Gepriesen
  rationale: Gibt die doxologische Bedeutung des griechischen Partizips in natürlichem, würdigem Deutsch wieder.
- source_word: ναῷ
  choice: Tempel
  rationale: Entspricht im gegebenen kultischen Zusammenhang der üblichen Bedeutung von ναός.
- source_word: τῆς ἁγίας δόξης σου
  choice: deiner heiligen Herrlichkeit
  rationale: Bewahrt die Genitivverbindung und die feierliche Ausdrucksweise des Griechischen.
- source_word: ὑπερυμνητός
  choice: hoch gerühmt
  rationale: Gibt die verstärkende Vorsilbe ὑπερ- idiomatisch wieder, ohne ein unnatürliches deutsches Kompositum zu bilden.
- source_word: ὑπερένδοξος
  choice: über alle Maßen herrlich
  rationale: Bewahrt die Aussage, dass Gott in höchstem Maß herrlich ist, statt das Adjektiv passiv als »verherrlicht« wiederzugeben.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Natürliche deutsche Wiedergabe der liturgischen Zeitformel.
theological_decisions:
- issue: Bedeutung von ὑπερένδοξος
  choice: über alle Maßen herrlich
  alternative: überaus verherrlicht
  rationale: Das griechische Wort ist adjektivisch und bezeichnet Gottes überragende Herrlichkeit; die Übersetzung vermeidet die unbegründete Verschiebung zu einer passiven Handlung des Verherrlichens.
- issue: Bezug von ἐν τῷ ναῷ
  choice: im Tempel
  alternative: in deinem heiligen, herrlichen Tempel
  rationale: Die Genitivfügung bezieht »heilige Herrlichkeit« grammatisch auf Gott (»deiner«) und sollte nicht stillschweigend in Attribute des Tempels umgeformt werden.
translation_notes:
  register: Doxologisch, feierlich und zugleich in modernem Standarddeutsch verständlich. Die parallelen verstärkten Adjektive werden mit zwei unterschiedlichen, natürlichen deutschen Wendungen wiedergegeben.
