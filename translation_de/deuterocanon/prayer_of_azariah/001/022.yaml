translation:
  language: de
  text: Sie sollen erkennen, dass du allein der Herr und Gott bist und herrlich über die ganze bewohnte Erde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der ganzen Welt“. Das griechische Wort kann die bewohnte Welt beziehungsweise Erde bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώτωσαν
  choice: Sie sollen erkennen
  rationale: Der Aoristimperativ in der dritten Person Plural hat auffordernden Charakter. „Sie sollen erkennen“ gibt diesen im modernen Deutschen natürlich wieder; „erkennen“ kann dabei auch ein zum Eingeständnis führendes Erkennen ausdrücken.
- source_word: σὺ
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen Nachdruck. Im Deutschen wird dieser zusammen mit „allein“ bewahrt.
- source_word: Κύριος θεὸς
  choice: der Herr und Gott
  rationale: Die beiden artikellosen Nomen stehen als zusammengehörige Gottesbezeichnungen. „Herr und Gott“ ist würdig und natürlich und vermeidet die im Deutschen missverständliche Lesart von „Herrgott“ als bloßer festeingebürgerter Benennung.
- source_word: μόνος
  choice: allein
  rationale: „Du allein“ bewahrt die ausschließende Aussage des griechischen μόνος und ihre monotheistische Tragweite.
- source_word: ἔνδοξος
  choice: herrlich
  rationale: Das Prädikatsadjektiv bezeichnet Gottes Herrlichkeit beziehungsweise ruhmvolle Majestät. „Herrlich“ bewahrt die grammatische Parallelität zu „bist“, ohne es auf bloß verliehene Ehre zu verengen.
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: über die ganze bewohnte Erde
  rationale: οἰκουμένη bezeichnet die bewohnte Erde beziehungsweise Welt. „Über“ lässt sowohl räumliche Erstreckung als auch den möglichen Herrschaftsanklang von ἐπί mit Akkusativ bestehen.
theological_decisions:
- issue: Ausschließlichkeit Gottes bei μόνος mit Κύριος θεὸς
  choice: dass du allein der Herr und Gott bist
  alternative: dass du der einzige Herr und Gott bist
  rationale: Die gewählte Stellung von „allein“ betont die Einzigkeit des angeredeten Gottes, ohne die griechische Verbindung der Gottesbezeichnungen unnötig festzulegen.
- issue: Verhältnis der mit καί verbundenen Prädikate
  choice: und herrlich über die ganze bewohnte Erde
  alternative: der Herr und Gott, herrlich über die ganze bewohnte Erde
  rationale: Das ausdrückliche „und“ bildet καί ab und bewahrt die Koordination zwischen dem Sein als Herr und Gott und dem Herrlichsein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt gebetsnah und bewahrt die knappe Aufforderung sowie die beiden durch „und“ verbundenen Prädikate. Der etwas markante Ausdruck „bewohnte Erde“ wird wegen seiner Nähe zum griechischen οἰκουμένη beibehalten und durch die Fußnote erläutert.
