base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/023.yaml
  text: And the king’s attendants who threw them in did not stop feeding the furnace with naphtha and pitch and tow and brushwood[b][a], keeping it burning.
translation:
  language: de
  text: Und die Diener des Königs, die sie hineingeworfen hatten, hörten nicht auf, den Ofen mit Erdpech[a], Pech, Werg und Rebzweigen[b] zu heizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bitumen“; das griechische Wort bezeichnet einen leicht brennbaren, erdölartigen Stoff.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Reisig“; gemeint sein können insbesondere abgeschnittene Rebtriebe, die als Brennstoff dienten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διέλειπον
  choice: hörten nicht auf
  rationale: Die verneinte Imperfektform bezeichnet eine fortdauernde Handlung; die deutsche Wendung gibt diesen Verlauf natürlich und genau wieder.
- source_word: οἱ ἐμβάλλοντες αὐτοὺς
  choice: die sie hineingeworfen hatten
  rationale: Das substantivierte Partizip kennzeichnet die Diener als diejenigen, die die drei Männer in den Ofen warfen. Das Plusquamperfekt stellt im Deutschen den Bezug zur bereits erfolgten Handlung im Erzählzusammenhang klar.
- source_word: ὑπηρέται τοῦ βασιλέως
  choice: die Diener des Königs
  rationale: ὑπηρέται bezeichnet untergeordnete Bedienstete; „Diener“ ist verständlich und legt kein bestimmtes Amt nahe.
- source_word: καίοντες τὴν κάμινον
  choice: den Ofen … zu heizen
  rationale: Wörtlich geht es um das Brennenlassen des Ofens. „Heizen“ bezeichnet im Deutschen idiomatisch das Zuführen von Brennstoff, ohne den Vorgang unnötig auszudeuten.
- source_word: ἀφθάλτῳ
  choice: Erdpech
  rationale: Das Wort bezeichnet einen leicht brennbaren, erdölartigen Stoff. „Erdpech“ ist im Brennstoffzusammenhang verständlich und bleibt vom folgenden πίσσα unterschieden.
- source_word: πίσσῃ
  choice: Pech
  rationale: „Pech“ ist die direkte und herkömmliche deutsche Entsprechung für den harzartigen Brennstoff.
- source_word: στιππύῳ
  choice: Werg
  rationale: Gemeint sind leicht entzündliche Faserabfälle, häufig von Flachs oder Hanf; „Werg“ ist dafür die präzise deutsche Bezeichnung.
- source_word: κληματίδα
  choice: Rebholz
  rationale: Der Ausdruck kann abgeschnittene Rebtriebe beziehungsweise rankenartiges Holz als Brennmaterial bezeichnen. „Rebholz“ bewahrt den wahrscheinlichen konkreten Bezug.
