translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Ablauf, während „den Ofen … zu heizen“ idiomatisches Deutsch bietet. Die weniger alltäglichen Brennstoffbegriffe werden durch knappe Fußnoten abgesichert.
