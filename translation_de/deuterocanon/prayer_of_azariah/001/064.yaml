base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/064.yaml
  text: Bless the Lord[a], you holy and humble in heart; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Frommen und ihr Demütigen im Herzen; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Im an Gott gerichteten liturgischen Aufruf gibt „preisen“ die Bedeutung von εὐλογέω im heutigen Deutsch natürlich und würdig wieder; „segnet“ wäre formaler, klingt hier jedoch weniger idiomatisch.
- source_word: ὅσιοι
  choice: Frommen
  rationale: ὅσιος bezeichnet hier Menschen, die fromm, gottesfürchtig oder heilig sind. „Fromme“ ist im Deutschen eine natürliche Personenbezeichnung und vermeidet die mögliche ontologische Überzeichnung von „Heilige“.
- source_word: ταπεινοὶ τῇ καρδίᾳ
  choice: von Herzen Demütigen
  rationale: Die Dativfügung bezeichnet die innere Haltung. „Von Herzen demütig“ ist idiomatisches modernes Deutsch und bewahrt den Bezug auf das Herz.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Der Herr“ ist in diesem gottesdienstlichen Kontext die übliche und sachgerechte Wiedergabe von κύριος.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Die Wiedergabe erhält gegenüber bloßem „lobt“ die musikalisch-hymnische Bedeutung des Verbs.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Das verstärkende Präfix ὑπερ- wird durch „hoch“ hörbar gemacht, ohne eine schwerfällige Formulierung zu erzeugen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste deutsche Wendung gibt die zeitlich unbegrenzte Bedeutung des griechischen Idioms in liturgisch angemessenem Register wieder.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: den Herrn
  alternative: den Gebieter
  rationale: „Herr“ entspricht dem etablierten Gottesprädikat und dem Anbetungskontext, ohne zusätzliche konfessionelle Deutung einzutragen.
- issue: Personenbezeichnung ὅσιοι
  choice: ihr Frommen
  alternative: ihr Heiligen
  rationale: „Fromme“ gibt die auf Gottesverehrung und lautere Lebensführung bezogene Bedeutung wieder; die ebenfalls mögliche Wiedergabe „Heilige“ bleibt in der Fußnote sichtbar, damit die semantische Spannung nicht verdeckt wird.
translation_notes:
  register: Gehobene, aber allgemein verständliche liturgisch-poetische Sprache. Die parallelen Imperative und die refrainartige Schlusswendung bleiben erhalten.
