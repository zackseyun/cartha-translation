base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/029.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and highly exalted forever; and blessed is your holy, glorious name, and supremely praised and highly exalted through all the ages.
translation:
  language: de
  text: Gepriesen bist du, Herr, du Gott unserer Väter, gelobt und hoch erhaben in Ewigkeit; und gepriesen ist dein heiliger, herrlicher Name[a], überaus gelobt und hoch erhaben durch alle Zeitalter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der heilige Name deiner Herrlichkeit“. Die griechische Formulierung ist stark verdichtet; die Hauptfassung gibt ihren Sinn in natürlichem Deutsch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Gepriesen
  rationale: Als prädikatives Adjektiv in einer Lobpreisformel bezeichnet es Gott als den Gepriesenen; „Gepriesen bist du“ wahrt die direkte Anrede und vermeidet eine imperativische Umdeutung.
- source_word: Κύριε
  choice: Herr
  rationale: Die übliche und kontextgemäße Wiedergabe von κύριος in direkter Anrede.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: du Gott unserer Väter
  rationale: Bewahrt die ausdrücklich männliche, familiär-bundestheologische Formulierung des Griechischen und klingt in deutscher Gebetssprache natürlich.
- source_word: αἰνετὸς
  choice: lobenswert
  rationale: Gibt das prädikative Adjektiv formal genau wieder und unterscheidet es von Εὐλογητός.
- source_word: ὑπερυψούμενος
  choice: hoch erhaben
  rationale: Bringt die intensive Bedeutung des Kompositums zum Ausdruck und lässt sich an beiden Stellen einheitlich verwenden.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Eine natürliche deutsche Wiedergabe der dauerhaften Zeitspanne in einer Doxologie.
- source_word: τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον
  choice: der heilige Name deiner Herrlichkeit
  rationale: Bewahrt die Genitivkonstruktion und die gestaffelte Ausdrucksweise des Griechischen, ohne sie zu einer bloßen Eigenschaft „herrlich“ einzuebnen.
- source_word: ὑπεραινετὸν
  choice: überaus lobenswert
  rationale: Spiegelt sowohl den adjektivischen Charakter als auch die steigernde Kraft von ὑπερ- wider.
- source_word: εἰς ἅπαντας τοὺς αἰῶνας
  choice: durch alle Zeitalter
  rationale: Gibt ἅπαντας ausdrücklich wieder und unterscheidet die vollere zweite Zeitformel von εἰς τοὺς αἰῶνας.
theological_decisions:
- issue: Direkte Prädikation oder Wunschformel im einleitenden Lobpreis
  choice: Gepriesen bist du, Herr
  alternative: Gepriesen sei der Herr
  rationale: Das Griechische spricht Gott unmittelbar in der zweiten Person an und enthält keine Optativ- oder Imperativform; die direkte Prädikation wahrt diese Struktur.
- issue: Wiedergabe von πατέρων
  choice: Väter
  alternative: Vorfahren
  rationale: „Väter“ entspricht der ausdrücklich männlichen Form des Ausgangstextes und bewahrt die traditionelle familiär-bundestheologische Wendung, ohne eine weitergehende Auslegung einzutragen.
- issue: Verhältnis von Name und Herrlichkeit
  choice: der heilige Name deiner Herrlichkeit
  alternative: dein heiliger, herrlicher Name
  rationale: Die gewählte Fassung erhält die echte, komprimierte Genitivkonstruktion τῆς δόξης σου und vermeidet es, deren Verhältnis stillschweigend als bloßes Qualitätsadjektiv festzulegen.
translation_notes:
  register: Moderne, würdevolle Gebetssprache mit bewusstem Parallelismus. „In Ewigkeit“ und „durch alle Zeitalter“ bilden die unterschiedliche Ausführlichkeit der beiden griechischen Zeitformeln ab. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Genitivverbindung.
