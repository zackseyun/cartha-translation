review_pass:
  verdict: revise
  source_fidelity: Die Namensformen, das Gebet, der gesungene Lobpreis, »dem Herrn«, der zeitliche Anschluss und der Ofen entsprechen dem griechischen Text. Die gegenwärtige deutsche Infinitivkonstruktion »befahl, sie … zu werfen« gibt jedoch den passiven Infinitiv ἐμβληθῆναι nicht eindeutig wieder.
  naturalness: Die Formulierung ist überwiegend idiomatisch und hat einen angemessen würdigen biblischen Ton. »So« ist hier eine natürliche knappe Wiedergabe von Οὕτως οὖν und verbindet den Rückverweis mit dem Schluss-/Anschlusswert besser als »Auf diese Weise« allein.
  terminology: »Hananja, Asarja und Mischaël«, »der Herr« und »Ofen« sind angemessen. Die vorhandene Namensfußnote ist sachlich richtig und ausreichend; die englische lexikalische Alternativnote verlangt keine deutsche Fußnote, da die revidierte deutsche Fassung die Passivform unmittelbar ausdrückt.
  issues:
  - severity: medium
    issue: Passiv von ἐμβληθῆναι nicht eindeutig wiedergegeben
    rationale: »Der König befahl, sie in den Ofen zu werfen« kann im Deutschen als verkürzte aktive Infinitivkonstruktion verstanden werden. Der griechische Text sagt ausdrücklich, dass angeordnet wurde, dass die drei Männer hineingeworfen würden. Eine dass-Konstruktion mit Passiv bewahrt dies eindeutig.
  - severity: low
    issue: Der Anschlusswert von οὖν bleibt in »Auf diese Weise« unterrepräsentiert
    rationale: »Auf diese Weise« gibt vor allem Οὕτως wieder. »So« kann im Deutschen sowohl den manner-bezogenen Rückverweis als auch den knappen diskursiven Anschluss von οὖν tragen.
  revised_text: So beteten Hananja, Asarja und Mischaël[a], und sie sangen dem Herrn Lob, als der König befahl, dass sie in den Ofen geworfen werden sollten.
