base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/001.yaml
  text: Thus Hananiah and Azariah and Mishael prayed[b][a], and they sang praise to the Lord when the king ordered them to be thrown into the furnace.
translation:
  language: de
  text: So beteten Hananja, Asarja und Mischaël[a], und sie sangen dem Herrn Lob, als der König befahl, dass sie in den Ofen geworfen werden sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hier stehen die hebräischen Namen Hananja, Asarja und Mischaël, nicht ihre babylonischen Namen Schadrach, Meschach und Abed-Nego.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως οὖν
  choice: Auf diese Weise
  rationale: Οὕτως bezeichnet die Art und Weise; οὖν stellt den Anschluss an den vorausgehenden Zusammenhang her. „Auf diese Weise“ gibt den Rückverweis natürlich wieder, ohne das im Deutschen schwerfällige „so nun“.
- source_word: προσηύξατο
  choice: beteten
  rationale: Das Verb προσεύχομαι bedeutet schlicht „beten“. Der griechische Singular bei der mehrgliedrigen Namensgruppe wird im Deutschen grammatisch als Plural wiedergegeben.
- source_word: Ἀνανίας καὶ Ἀζαρίας καὶ Μισαήλ
  choice: Hananja, Asarja und Mischaël
  rationale: Die Namen werden in ihren üblichen, an den hebräischen Formen orientierten deutschen Schreibweisen wiedergegeben. Die deutsche Zeichensetzung gestaltet die Aufzählung natürlich.
- source_word: ὕμνησαν
  choice: sangen … Lob
  rationale: ὑμνέω bezeichnet gesungenes Lob. Die Formulierung bewahrt den musikalischen Sinn und klingt in modernem, würdigem Deutsch natürlich.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: κύριος bezieht sich hier im Kontext von Gebet und Lobpreis auf Gott; „Herr“ erhält den schriftsprachlich-theologischen Gebrauch.
- source_word: ὅτε
  choice: als
  rationale: ὅτε ist temporal. Bei einem einmaligen Geschehen in der Vergangenheit ist „als“ die natürliche deutsche Entsprechung, ohne eine ausdrückliche Nachzeitigkeit einzutragen.
- source_word: προσέταξεν
  choice: befahl
  rationale: προστάσσω bedeutet „befehlen“ oder „anordnen“. „Befahl“ passt knapp und idiomatisch zum königlichen Befehl.
- source_word: ἐμβληθῆναι εἰς τὴν κάμινον
  choice: sie in den Ofen zu werfen
  rationale: Der passive Infinitiv von ἐμβάλλω bezeichnet hier das Hineingeworfenwerden. Die deutsche Infinitivkonstruktion nach „befahl“ ist idiomatisch; κάμινος wird ohne den im Vers nicht ausdrücklich vorhandenen Zusatz „brennend“ als „Ofen“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im jüdisch-schriftlichen Gebets- und Lobpreiskontext bezeichnet κύριος Gott. „Herr“ bewahrt diese theologische Verwendung, ohne den Ausdruck auf einen bloß gesellschaftlichen Rangtitel zu verengen.
- issue: Namensformen der drei jungen Männer
  choice: Hananja, Asarja und Mischaël
  alternative: Ananias, Asarias und Misael; Schadrach, Meschach und Abed-Nego
  rationale: Der griechische Text nennt hier die griechisch geschriebenen Formen ihrer hebräischen Namen, nicht die babylonischen Hofnamen. Die geläufigen deutschen Formen der hebräischen Namen entsprechen daher der Vorlage am besten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt eng an der griechischen Vorlage, wird aber bei Kongruenz, Namensaufzählung und Infinitivkonstruktion idiomatisch deutsch gestaltet.
