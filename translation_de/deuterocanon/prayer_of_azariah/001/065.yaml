base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/065.yaml
  text: Bless the Lord[a], Hananiah, Azariah, and Mishael; sing praise to him and highly exalt him forever. For he has delivered us from Hades, and saved us from the hand of death, and rescued us from the midst of the burning flame, and redeemed us from the fire.
translation:
  language: de
  text: Preist den Herrn, Hananja, Asarja und Mischaël! Besingt ihn und erhebt ihn hoch in Ewigkeit! Denn er hat uns aus dem Hades[a] befreit und uns aus der Hand des Todes gerettet; er hat uns mitten aus der brennenden Flamme entrissen und uns aus dem Feuer erlöst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aus dem Totenreich; nach dem Zusammenhang auch: aus dem Grab. Im Griechischen steht „Hades“, die Bezeichnung für den Bereich der Toten.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ fordert hier zum preisenden Segnen Gottes auf. „Preist“ klingt im modernen Deutschen natürlich und würdevoll; „segnet“ wäre formaler, könnte aber missverständlich wirken.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: In diesem jüdisch-griechischen Lobgesang ist κύριος als Gottesbezeichnung mit „Herr“ wiederzugeben.
- source_word: ὑμνεῖτε
  choice: Besingt ihn
  rationale: Das Verb bezeichnet gesungenes Lob. „Besingt ihn“ bewahrt den musikalischen Sinn und unterscheidet sich zugleich von εὐλογεῖτε.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alles
  rationale: Die verstärkte Verbform bezeichnet höchstes Erheben. „Über alles“ gibt die intensive Aussage idiomatisch wieder, ohne sie abzuschwächen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die traditionelle und zugleich verständliche deutsche Wendung gibt die unbegrenzte Dauer des doxologischen Ausdrucks wieder.
- source_word: ἐξείλετο
  choice: hat ... befreit
  rationale: Das Verb bezeichnet die Herausnahme aus einer Gefahr. „Befreit“ passt zum dankbaren Rückblick und lässt sich von den nachfolgenden Rettungsverben unterscheiden.
- source_word: ἐξ ᾅδου
  choice: aus dem Hades
  rationale: „Hades“ wahrt die ausdrückliche Bezeichnung des griechischen Textes für den Bereich der Toten. Die verständlichere Deutung „Totenreich“ wird in der Fußnote genannt.
- source_word: ἔσωσεν
  choice: gerettet
  rationale: „Retten“ ist die direkte Entsprechung zu σώζω und bezeichnet hier konkret die Bewahrung vor tödlicher Gefahr.
- source_word: ἐκ χειρὸς θανάτου
  choice: aus der Hand des Todes
  rationale: Die bildhafte Personifikation und der semitisch geprägte Ausdruck des griechischen Textes bleiben erhalten.
- source_word: ἐρρύσατο
  choice: entrissen
  rationale: „Entrissen“ vermittelt die kraftvolle Rettung aus unmittelbarer Gefahr und unterscheidet dieses Verb von den übrigen Rettungsbegriffen des Verses.
- source_word: ἐκ μέσου καιομένης φλογός
  choice: mitten aus der brennenden Flamme
  rationale: Die Formulierung bewahrt das Bild, dass die Rettung aus dem Inneren der Flamme erfolgte.
- source_word: ἐλυτρώσατο
  choice: erlöst
  rationale: „Erlöst“ gibt den Freisetzungs- und Loskaufsaspekt von λυτρόω wieder und bewahrt dessen weiter reichenden theologischen Klang im Zusammenhang einer konkreten Rettung.
theological_decisions:
- issue: Wiedergabe von ᾅδης bei der Rettung aus tödlicher Gefahr
  choice: aus dem Hades
  alternative: aus dem Totenreich; aus dem Grab
  rationale: Der griechische Text nennt ausdrücklich den Hades und nicht nur Tod oder Grab. Die Hauptfassung wahrt diese begriffliche und theologische Offenheit; die Fußnote erläutert die gemeinte Sphäre der Toten, ohne sie auf ein einzelnes Grab zu verengen.
translation_notes:
  register: Moderner, würdevoller Lobgesang mit klaren Imperativen und bewahrter poetischer Parallelität. Die vier Rettungsverben werden abwechslungsreich, aber semantisch eng am Griechischen wiedergegeben. Die Namen folgen geläufigen deutschen Formen; „Mischaël“ markiert die getrennte Aussprache der Vokale.
