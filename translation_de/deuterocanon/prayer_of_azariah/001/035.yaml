base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/035.yaml
  text: Bless the Lord[a], angels of the Lord[b]; sing hymns and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn[a], ihr Engel des Herrn; singt ihm Loblieder[b] und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Segnet den Herrn“. Das griechische Verb kann in der Sprache der Anbetung sowohl „segnen“ als auch „preisen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „singt ihm Hymnen“. Das griechische Verb bezeichnet ausdrücklich gesungenes Lob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Im anbetenden Aufruf bezeichnet εὐλογέω das lobende Segnen Gottes. „Preist“ ist im heutigen Deutschen natürlicher als „Segnet“, während eine Fußnote die wörtlichere Möglichkeit bewahrt.
- source_word: ἄγγελοι
  choice: Engel
  rationale: Der kosmische Lobgesang richtet sich an himmlische Wesen, nicht an menschliche Boten.
- source_word: Κυρίου / τὸν κύριον
  choice: des Herrn / den Herrn
  rationale: „Herr“ ist hier die angemessene Wiedergabe von κύριος im biblisch-liturgischen Zusammenhang.
- source_word: ὑμνεῖτε
  choice: singt ihm Loblieder
  rationale: ὑμνέω bezeichnet ausdrücklich das Singen von Hymnen beziehungsweise Lob; „Loblieder singen“ bewahrt den musikalischen und liturgischen Gehalt.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alles
  rationale: Die verstärkende Vorsilbe ὑπερ- verlangt mehr als schlichtes „erheben“. „Über alles erheben“ gibt die intensive Bedeutung natürlich und würdig wieder.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet in diesem Kehrvers unbegrenzte Dauer; „in Ewigkeit“ entspricht dem gehobenen liturgischen Register.
theological_decisions:
- issue: Bedeutung von εὐλογεῖτε bei einem an Gott gerichteten Aufruf
  choice: Preist
  alternative: Segnet
  rationale: Beide Wiedergaben sind sachlich möglich. „Preist“ vermittelt heutigen Lesern unmittelbar den doxologischen Sinn, ohne die alternative, formnähere Wiedergabe zu verschweigen.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte und kontextuell passende Wiedergabe im biblischen Lobgesang; der Kontext bietet keinen Grund für eine abweichende Deutung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-liturgischem Klang. Die direkte Anrede „ihr Engel“ macht den griechischen Vokativzusammenhang im Deutschen eindeutig; „ihm“ verdeutlicht das im Griechischen durch αὐτόν ausgedrückte Objekt.
