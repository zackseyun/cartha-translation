base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/055.yaml
  text: Bless the Lord, seas and rivers; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Meere und Flüsse; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ fordert die personifizierte Schöpfung zum lobenden Segnen Gottes auf. „Preist“ gibt diese Bedeutung im heutigen Deutschen natürlicher wieder als „Segnet“, ohne den liturgischen Charakter zu verlieren.
- source_word: θάλασσαι
  choice: Meere
  rationale: Der Plural bleibt erhalten und bewahrt die poetische Anrede verschiedener großer Salzgewässer.
- source_word: ποταμοί
  choice: Flüsse
  rationale: „Flüsse“ ist die direkte und natürliche Entsprechung und bildet mit „Meere“ das poetische Wortpaar.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος steht hier als Gottesbezeichnung; „der Herr“ ist die quellennahe, im Deutschen geläufige Wiedergabe.
- source_word: ὑμνεῖτε
  choice: besingt
  rationale: Das Verb bezeichnet das Singen eines Lobgesangs. „Besingt“ bewahrt die musikalische Nuance knapp und würdig.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alles
  rationale: Die verstärkende Vorsilbe ὑπερ- verlangt mehr als schlichtes „erhebt“. „Über alles“ bringt die außerordentliche Erhöhung in natürlichem Deutsch zum Ausdruck.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet hier zeitlich unbegrenztes, fortdauerndes Lob; „in Ewigkeit“ passt zum liturgisch-poetischen Register.
theological_decisions:
- issue: κύριος als Gottesbezeichnung
  choice: den Herrn
  alternative: den HERRN; den Gebieter
  rationale: Der griechische Text bietet κύριον und nicht unmittelbar den Gottesnamen. Daher wahrt „den Herrn“ die Vorlage, ohne eine nicht ausdrücklich vorhandene Schreibweise des Tetragramms einzutragen.
translation_notes:
  register: Poetisch-liturgischer, aber allgemein verständlicher Imperativ. Die direkte Anrede der Meere und Flüsse sowie die parallelen Aufforderungen des griechischen Hymnus bleiben erhalten.
