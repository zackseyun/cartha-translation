base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/042.yaml
  text: Bless the Lord[a], all spirits; sing praise and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Geister alle; singt ihm Lob und erhebt ihn hoch in Ewigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Winde alle“, wenn πνεύματα hier bewegte Luftströmungen und nicht geistige Wesen bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Im doxologischen Zusammenhang bedeutet εὐλογεῖτε, Gott lobend zu rühmen. „Preist“ ist im modernen Deutschen natürlich und bewahrt den liturgischen Charakter.
- source_word: πάντα τὰ πνεύματα
  choice: ihr Geister alle
  rationale: Die Wortgruppe ist als Anrede zu verstehen. πνεύματα bezeichnet hier am direktesten Geister; die ebenfalls mögliche Bedeutung „Winde“ bleibt in einer Fußnote erhalten.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος dient in diesem jüdisch-griechischen Hymnus als ehrfürchtiger Gottestitel und wird entsprechend mit „Herr“ wiedergegeben.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Das Verb bezeichnet Lobpreis in Liedform. „Singt ihm Lob“ gibt den musikalischen Gehalt in natürlichem Deutsch wieder; das Objekt „ihm“ ergibt sich aus αὐτόν und der syntaktischen Verbindung beider Imperative.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alles
  rationale: Das verstärkte Verb verlangt mehr als ein schlichtes „erhebt“. „Über alles erheben“ vermittelt die intensive, höchste Erhöhung idiomatisch und würdevoll.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. „In Ewigkeit“ entspricht dem gehobenen hymnischen Register.
theological_decisions:
- issue: Wiedergabe von κύριος als Gottestitel
  choice: den Herrn
  alternative: den Gebieter
  rationale: „Herr“ entspricht dem üblichen Septuaginta-Gebrauch als Gottesbezeichnung und vermeidet eine kontextuell unnötige Verengung auf Herrschaft oder Besitz.
- issue: Referenz von πάντα τὰ πνεύματα
  choice: ihr Geister alle
  alternative: ihr Winde alle
  rationale: „Geister“ ist die direkte Wiedergabe und lässt die angesprochenen geistigen Wesen oder Mächte im Vordergrund. Da πνεῦμα auch „Wind“ bedeuten kann, wird diese echte lexikalische Mehrdeutigkeit nicht beseitigt, sondern in der Fußnote ausgewiesen.
translation_notes:
  register: Würdiger, hymnischer Imperativstil in modernem Standarddeutsch. Die Anrede „ihr Geister alle“ macht den griechischen Vokativcharakter deutlich; die beiden Lobaufforderungen bleiben parallel und rhythmisch.
