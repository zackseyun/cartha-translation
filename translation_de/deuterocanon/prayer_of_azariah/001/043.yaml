base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/043.yaml
  text: Bless the Lord[a], fire and heat; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, Feuer und Gluthitze; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der pluralische Imperativ fordert die angeredeten Schöpfungsgrößen zum Lob Gottes auf. »Preist« klingt im Deutschen natürlich und würdig; das wörtlichere »segnet« wäre bei unbelebten Elementen missverständlich.
- source_word: πῦρ
  choice: Feuer
  rationale: Direkte und eindeutige Wiedergabe des griechischen Substantivs.
- source_word: καῦμα
  choice: Gluthitze
  rationale: Bezeichnet starke, brennende Hitze. »Gluthitze« unterscheidet den Ausdruck klar von πῦρ und bewahrt seine Intensität.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Entspricht κύριος als göttlichem Titel, ohne einen im griechischen Text nicht ausdrücklich genannten Gottesnamen einzuführen.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Bewahrt gegenüber einem allgemeinen »lobt« die besondere Bedeutung des gesungenen oder hymnischen Lobes.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Gibt die durch ὑπερ- verstärkte Aufforderung zum Erheben in natürlichem, feierlichem Deutsch wieder.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Eine etablierte, würdige deutsche Wiedergabe der idiomatischen Wendung für unbegrenzte Dauer.
theological_decisions:
- issue: Wiedergabe von κύριος im deuterokanonischen liturgischen Kehrvers
  choice: der Herr
  alternative: der HERR
  rationale: Der griechische Text hat κύριος und nennt den hebräischen Gottesnamen nicht ausdrücklich. »Der Herr« wahrt den vorliegenden Wortlaut und den liturgischen Charakter, ohne zusätzliche Festlegung.
translation_notes:
  register: Moderner, würdiger und hymnischer Standard; parallele pluralische Imperative erhalten. Das Semikolon bildet die zweiteilige Struktur des griechischen Verses ab.
