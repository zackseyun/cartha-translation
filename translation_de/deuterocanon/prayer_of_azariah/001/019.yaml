translation:
  language: de
  text: Beschäme uns nicht, sondern erweise uns Barmherzigkeit nach deiner Milde und nach der Fülle deiner Barmherzigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταισχύνῃς
  choice: bring uns in Schande
  rationale: Das Verb bezeichnet Beschämung oder Entehrung. Die deutsche Wendung ist natürlich und bewahrt die direkte Bitte.
- source_word: ποίησον μεθʼ ἡμῶν ἔλεος
  choice: erweise uns Barmherzigkeit
  rationale: Die wörtliche Konstruktion „tu Barmherzigkeit mit uns“ wäre im Deutschen unnatürlich; „erweise uns Barmherzigkeit“ gibt den konkreten verbalen Ausdruck würdig und verständlich wieder.
- source_word: ἐπιείκειάν
  choice: Milde
  rationale: ἐπιείκεια bezeichnet milde, nachsichtige Güte beziehungsweise Schonung. „Milde“ passt zum Gebetsregister und bleibt von ἔλεος unterschieden.
- source_word: πλῆθος
  choice: Fülle
  rationale: Das Wort bezeichnet eine große, reiche Menge. „Fülle“ verbindet sich im Deutschen natürlich mit „Barmherzigkeit“.
- source_word: ἐλέους
  choice: Barmherzigkeit
  rationale: Im Buß- und Bittgebet bewahrt „Barmherzigkeit“ sowohl den Erbarmensaspekt als auch den feierlichen biblischen Ton.
theological_decisions:
- issue: Unterscheidung der parallelen göttlichen Eigenschaften ἐπιείκεια und ἔλεος
  choice: „Milde“ und „Barmherzigkeit“ werden als verwandte, aber unterschiedliche Begriffe wiedergegeben.
  alternative: Beide Ausdrücke könnten mit Barmherzigkeits- oder Gütesprache einander angeglichen werden.
  rationale: Der griechische Text verwendet bewusst zwei verschiedene Wörter. Die Unterscheidung erhält die Spannung zwischen Gottes nachsichtiger Milde und seiner reichen Barmherzigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gebetstypischer Direktheit. Die zweifache Barmherzigkeitsformulierung des Griechischen wird beibehalten; „nach“ bildet κατὰ in beiden parallelen Wendungen formal ab.
