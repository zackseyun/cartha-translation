base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/058.yaml
  text: Bless the Lord, four-footed animals and beasts of the earth; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Vierfüßer und Wildtiere der Erde; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der imperativische Plural fordert die angeredeten Geschöpfe zum Lob Gottes auf. „Preist“ ist im heutigen Deutschen natürlich und würdevoll; eine wörtliche Wiedergabe mit „segnet“ wäre bei Gott als Objekt missverständlich.
- source_word: τετράποδα
  choice: Vierfüßer
  rationale: Gibt die konkrete Bedeutung „vierfüßige Wesen“ knapp und verständlich wieder und bewahrt die zoologische Gruppierung.
- source_word: θηρία τῆς γῆς
  choice: Tiere der Erde
  rationale: Bewahrt die Genitivverbindung und die kosmische Schöpfungssprache. „Wilde Tiere“ wäre möglich, legt die Bedeutung von θηρία hier jedoch stärker fest als nötig.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Entspricht dem üblichen Gottesprädikat für κύριος im jüdisch-griechischen Lobpreiszusammenhang.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Bringt den ausdrücklich hymnischen Charakter des Verbs idiomatisch zum Ausdruck und unterscheidet es vom vorausgehenden εὐλογεῖτε.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Gibt die verstärkende Bedeutung des zusammengesetzten Verbs wieder, ohne in unnatürliches Deutsch zu verfallen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Ist eine geläufige, liturgisch angemessene Wiedergabe der auf unbegrenzte Dauer zielenden Formel.
theological_decisions:
- issue: Wiedergabe von κύριος in der an Gott gerichteten deuterokanonischen Hymne
  choice: der Herr
  alternative: der Gebieter
  rationale: „Der Herr“ entspricht dem etablierten Gottesprädikat und dem Anbetungskontext, ohne eine zusätzliche Herrschaftsnuance einzutragen.
- issue: Wiedergabe von εὐλογεῖτε bei Gott als Objekt
  choice: Preist
  alternative: Segnet
  rationale: Das griechische Verb kann „segnen“ oder „preisen“ bedeuten. Wenn Geschöpfe Gott εὐλογεῖν, ist „preisen“ im Deutschen sachgemäß und vermeidet die missverständliche Vorstellung, sie sprächen Gott einen Segen zu.
translation_notes:
  register: Poetisch-liturgischer, zugleich moderner Standardstil. Die direkte Anrede wird durch „ihr“ verdeutlicht; der parallele dreifache Lobaufruf des griechischen Textes bleibt erhalten.
