base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/032.yaml
  text: Blessed are you on the throne of your kingdom[a], and greatly praised and highly exalted forever.
translation:
  language: de
  text: Gesegnet bist du auf dem Thron deines Königreichs[a], und über alle Maßen gepriesen und hoch erhaben in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Thron deiner Königsherrschaft“. Das griechische Wort kann „Königreich“, „Königsherrschaft“ oder „Herrschaft“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος
  choice: Gesegnet
  rationale: Das prädikative Adjektiv steht in einer liturgischen Segensformel. „Gesegnet bist du“ bewahrt die doxologische Aussage, ohne einen im Griechischen nicht ausdrücklich vorhandenen Imperativ einzuführen.
- source_word: ἐπὶ θρόνου
  choice: auf dem Thron
  rationale: Gibt die örtliche Bedeutung von ἐπί mit Genitiv direkt und in natürlichem Deutsch wieder; die konkrete Thronmetaphorik bleibt erhalten.
- source_word: τῆς βασιλείας σου
  choice: deines Königreichs
  rationale: βασιλεία kann Königreich, Königsherrschaft oder Herrschaft bezeichnen. „Königreich“ verbindet sich natürlich mit dem Thronbild, während die Bedeutungsbreite in einer Fußnote kenntlich bleibt.
- source_word: ὑπερυμνητός
  choice: über alle Maßen gepriesen
  rationale: Das verstärkende Präfix ὑπερ- bezeichnet hier ein außergewöhnliches, höchstes Maß des Lobes. Die Wendung ist verständlich und wahrt den gehobenen liturgischen Ton.
- source_word: ὑπερυψωμένος
  choice: hoch erhaben
  rationale: Bewahrt die doxologische Bedeutung höchster Erhöhung in einer natürlichen deutschen Verbindung und parallelisiert die vorausgehende verstärkte Lobpreisung.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste griechische Wendung bezeichnet unbegrenzte Dauer. „In Ewigkeit“ ist im Deutschen klar, würdig und liturgisch vertraut.
theological_decisions:
- issue: Doxologische Anrede und Thronbild
  choice: 'Direkte Anrede Gottes: „Gesegnet bist du auf dem Thron deines Königreichs“'
  alternative: „Gesegnet bist du, der du auf dem Thron deiner Königsherrschaft sitzt“
  rationale: Der griechische Text redet Gott unmittelbar an und verbindet den Lobpreis mit dem Thron seiner βασιλεία. Die gewählte Fassung erhält die knappe Syntax und ergänzt weder ein Partizip noch das Verb „sitzen“.
translation_notes:
  register: Gehobene, aber gegenwärtige liturgische Sprache. Die Parallelität der beiden verstärkten Prädikate wird gewahrt; altertümliche Formen wie „hochgelobt“ oder „von Ewigkeit zu Ewigkeit“ werden vermieden, da sie den griechischen Wortlaut entweder verschieben oder erweitern könnten.
