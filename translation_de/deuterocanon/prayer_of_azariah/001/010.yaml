base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/010.yaml
  text: And now we cannot open our mouth[a]; shame and reproach have come upon your servants and those who revere you.
translation:
  language: de
  text: Und nun können wir den Mund nicht auftun. Scham und Schmach sind über deine Diener[a] und über die gekommen, die dich verehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: deine Sklaven; auch: deine Knechte. Das griechische Wort betont Zugehörigkeit und Unterordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι τὸ στόμα
  choice: den Mund auftun
  rationale: Die Wendung bewahrt das griechische Bild vom Öffnen des Mundes und bezeichnet hier die Möglichkeit oder Freiheit zu sprechen. „Auftun“ ist im Deutschen würdevoll und dennoch verständlich.
- source_word: αἰσχύνη
  choice: Scham
  rationale: „Scham“ gibt den inneren und sozialen Zustand unmittelbar wieder und lässt sich klar von ὄνειδος unterscheiden.
- source_word: ὄνειδος
  choice: Schmach
  rationale: „Schmach“ bezeichnet öffentliche Herabsetzung und Beschimpfung und bildet mit „Scham“ ein natürliches, klanglich angemessenes Wortpaar.
- source_word: ἐγενήθη
  choice: sind über … gekommen
  rationale: Wörtlich bedeutet das Verb „wurde/entstand“. Mit Scham und Schmach ist „über jemanden kommen“ im Deutschen die natürliche resultative Wiedergabe.
- source_word: δούλων σου
  choice: deine Diener
  rationale: Im Gebet bezeichnet δοῦλοι Menschen, die Gott gehören und ihm untergeordnet dienen. „Diener“ ist im modernen deutschen Haupttext verständlich und angemessen; die stärkere soziale Bedeutung des griechischen Wortes wird in der Fußnote offengelegt.
- source_word: τῶν σεβομένων σε
  choice: die dich verehren
  rationale: Das Partizip bezeichnet ehrfürchtige, fromme Verehrung. „Verehren“ hält die Bedeutung zwischen bloßer Furcht und ausschließlich kultischer Anbetung offen.
theological_decisions:
- issue: Wiedergabe von δοῦλος in der Anrede an Gott
  choice: Diener mit Fußnote zur wörtlichen Bedeutung
  alternative: Sklaven; Knechte
  rationale: „Diener“ vermeidet im Haupttext eine im heutigen Deutsch leicht missverständliche Verengung auf historische Sklaverei, ohne das Verhältnis der Zugehörigkeit und Unterordnung zu leugnen. Die Fußnote bewahrt die stärkere lexikalische Bedeutung ausdrücklich.
- issue: Verhältnis zwischen Gottes Dienern und denen, die ihn verehren
  choice: zwei durch καί verbundene Bezeichnungen ohne Gleichsetzung
  alternative: „deine Diener, die dich verehren“
  rationale: Der griechische Text verbindet zwei Genitivgruppen mit καί. Die Übersetzung erhält diese Koordination und entscheidet nicht, ob beide Gruppen deckungsgleich sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildrede „den Mund auftun“ bleibt sichtbar; „Scham und Schmach“ gibt das griechische Begriffspaar knapp und einprägsam wieder.
