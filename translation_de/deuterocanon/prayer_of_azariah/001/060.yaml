base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/060.yaml
  text: Bless the Lord[a], Israel; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist[a] den Herrn, Israel; singt ihm Lob und erhebt ihn aufs Höchste in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Segnet den Herrn“. Das griechische εὐλογεῖτε kann in diesem gottesdienstlichen Zusammenhang sowohl mit „preist“ als auch wörtlicher mit „segnet“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Im an Gott gerichteten gottesdienstlichen Aufruf gibt „preist“ die Funktion des griechischen Verbs natürlich wieder. Die wörtlichere biblische Wendung „segnet“ bleibt in der Fußnote erhalten.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Der formgleiche griechische Name steht als direkte Anrede. Das Deutsche macht dies ohne zusätzliches, heute gehoben oder altertümlich wirkendes „O“ verständlich.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος bezeichnet hier Gott; „der Herr“ ist die direkte und geläufige deutsche Wiedergabe des griechischen Titels.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Die Formulierung bewahrt den musikalischen Gehalt von ὑμνέω und klingt zugleich natürlich und verständlich.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn aufs Höchste
  rationale: Die verstärkende Vorsilbe ὑπερ- wird durch „aufs Höchste“ wiedergegeben, ohne die Intensität des Verbs einzuebnen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste deutsche Wendung gibt die dauerhafte, doxologische Bedeutung der griechischen Zeitangabe angemessen wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in einem an Gott gerichteten deuterokanonischen Hymnus
  choice: den Herrn
  alternative: den HERRN
  rationale: Der überlieferte griechische Text bietet κύριον und nicht unmittelbar das Tetragramm. Daher wird der griechische Gottesname-Titel formal als „Herr“ wiedergegeben, ohne durch Kapitälchen eine nicht ausdrücklich im Ausgangstext sichtbare Identifikation einzutragen.
- issue: An Gott gerichtetes εὐλογεῖτε
  choice: Preist
  alternative: Segnet
  rationale: „Preist“ vermeidet im heutigen Deutsch das mögliche Missverständnis, Menschen sollten Gott Segen verleihen. Die wörtlichere, traditionsreiche Ausdrucksweise „segnet“ wird wegen der echten lexikalischen Spannweite in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Hymnensprache mit klarer direkter Anrede. Der parallele Imperativrhythmus des griechischen Verses bleibt erhalten; „in Ewigkeit“ wahrt den liturgischen Klang, ohne unnötig altertümlich zu wirken.
