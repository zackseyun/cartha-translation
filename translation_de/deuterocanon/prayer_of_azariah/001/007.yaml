translation:
  language: de
  text: Und wir haben den Geboten deines Gesetzes nicht gehorcht, sie nicht beachtet und nicht so gehandelt, wie du es uns geboten hast, damit es uns gut geht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολῶν τοῦ νόμου σου
  choice: den Geboten deines Gesetzes
  rationale: Gibt die rechtlich-religiöse Wendung natürlich und präzise wieder; »Gebote« ist im Deutschen für einzelne Weisungen innerhalb des Gesetzes idiomatisch.
- source_word: ὑπηκούσαμεν
  choice: gehorcht
  rationale: Bewahrt die Grundbedeutung des Hörens mit daraus folgendem Gehorsam.
- source_word: συνετηρήσαμεν
  choice: beachtet
  rationale: Drückt das sorgfältige Einhalten beziehungsweise Bewahren der Gebote aus und vermeidet eine unnatürliche Wiederholung von »gehorcht«.
- source_word: ἐποιήσαμεν καθὼς ἐνετείλω ἡμῖν
  choice: nicht so gehandelt, wie du es uns geboten hast
  rationale: Gibt den Vollzug des Gebotenen in natürlichem Deutsch wieder und hält den Vergleichswert von καθὼς fest.
- source_word: ἵνα εὖ ἡμῖν γένηται
  choice: damit es uns gut geht
  rationale: Entspricht der finalen Konstruktion und bewahrt die schlichte, allgemein verständliche Ausdrucksweise des Griechischen.
theological_decisions:
- issue: Bezug des Zwecksatzes ἵνα εὖ ἡμῖν γένηται
  choice: Die Satzstellung lässt den Zwecksatz unmittelbar auf Gottes Gebot folgen.
  alternative: 'Den Zwecksatz ausdrücklich auf den Gehorsam des Volkes beziehen: »Wir haben nicht so gehandelt ..., sodass es uns gut gegangen wäre.«'
  rationale: Der griechische Text formuliert mit ἵνα einen Zweck und lässt syntaktisch offen, ob der Akzent auf Gottes gebietender Absicht oder auf dem vorgesehenen Ergebnis des Gehorsams liegt. Die Übersetzung erhält diese Spannung, statt sie kausal oder irreal umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Bekenntnisfolge bleibt erhalten, wird jedoch durch Pronomen und eine idiomatische Handlungsformulierung flüssig lesbar gemacht.
