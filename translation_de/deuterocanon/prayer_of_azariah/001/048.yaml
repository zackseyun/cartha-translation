base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/048.yaml
  text: Bless the Lord, nights and days; sing praise and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Nächte und Tage; besingt ihn und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: preist
  rationale: Der pluralische Imperativ fordert die personifizierten Nächte und Tage zum Lob Gottes auf. „Preist“ ist im Deutschen natürlich und würdevoll; „segnet“ wäre bei Geschöpfen als Subjekt missverständlich.
- source_word: νύκτες καὶ ἡμέραι
  choice: ihr Nächte und Tage
  rationale: Die ausdrückliche Anrede mit „ihr“ macht den griechischen Vokativ und die poetische Personifikation deutlich und bewahrt den Plural.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Den Herrn“ entspricht κύριον in diesem griechischen liturgischen Zusammenhang, ohne eine nicht ausdrücklich im Ausgangstext markierte Wiedergabe des Gottesnamens einzuführen.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Die Formulierung gibt den musikalischen Gehalt von ὑμνέω in natürlichem modernem Deutsch wieder.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Das verstärkende Präfix ὑπερ- wird durch „hoch“ bewahrt; zugleich bleibt die Formulierung verständlich und poetisch.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste deutsche Wendung bringt in diesem Kehrvers die unbegrenzte Dauer idiomatisch und liturgisch passend zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von κύριος im liturgischen Gotteslob
  choice: der Herr
  alternative: der HERR
  rationale: Die griechische Vorlage bietet κύριος. Daher wird „Herr“ verwendet; die typografische Kennzeichnung „HERR“ würde eine ausdrückliche Rückbindung an das hebräische Tetragramm anzeigen, die dieser Vers allein nicht verlangt.
translation_notes:
  register: Modernes, würdevolles und gut verständliches Deutsch mit poetischer Direktanrede. Der parallele Aufforderungsstil und die verstärkende Bedeutung von ὑπερυψοῦτε bleiben erhalten.
