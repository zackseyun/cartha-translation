base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/052.yaml
  text: Bless the Lord, mountains and hills; sing praise and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Berge und Hügel; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ Plural fordert die Schöpfung auf, den Herrn lobend zu nennen. „Preist“ ist im Deutschen natürlicher als „Segnet“ und passt zum liturgischen Zusammenhang, ohne den Ausdruck bloß zu wiederholen.
- source_word: ὄρη καὶ βουνοί
  choice: Berge und Hügel
  rationale: Die geläufige und transparente deutsche Wiedergabe bewahrt die poetische Paarung zweier Geländeformen.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Die direkte Wiedergabe von κύριος entspricht dem griechischen Text und dem würdevollen doxologischen Sprachgebrauch.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Die Formulierung macht den musikalischen Sinn des Verbs deutlich und ist in modernem Deutsch idiomatischer als „hymnisiert“.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Das verstärkende Präfix ὑπερ- wird durch „hoch“ sichtbar gemacht; zugleich bleibt die Formulierung verständlich und feierlich.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bezieht sich auf den Herrn. Beim vorausgehenden ὑμνεῖτε wird dieser Bezug zur natürlichen deutschen Wortstellung zusätzlich als „ihm“ ausgedrückt.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die traditionelle, weiterhin verständliche Wendung gibt im wiederkehrenden liturgischen Refrain die zeitlich unbegrenzte Dauer wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in einer doxologischen Anrede
  choice: der Herr
  alternative: DER HERR
  rationale: Die griechische Quelle bietet κύριος. „Herr“ folgt diesem Wortlaut, ohne die typografische Konvention für den Gottesnamen in hebräischen Ausgangstexten einzuführen.
translation_notes:
  register: Feierlicher, liturgischer Imperativ in modernem Standarddeutsch. Die direkte Anrede der Berge und Hügel wird durch „ihr“ verdeutlicht. Der Parallelismus der drei Aufforderungen und die Intensivierung in ὑπερυψοῦτε bleiben erhalten.
