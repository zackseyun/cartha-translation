base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/027.yaml
  text: And he made the inside of the furnace like a whistling dew-laden wind[a], and the fire did not touch them at all, nor did it distress or trouble them.
translation:
  language: de
  text: Und er machte das Innere des Ofens wie einen pfeifenden, taufeuchten Wind[a]. Das Feuer berührte sie überhaupt nicht, fügte ihnen kein Leid zu und belästigte sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie einen pfeifenden Tauwind“ oder „wie einen pfeifenden Geist des Taus“. Das griechische Wort πνεῦμα kann „Wind“, „Hauch“ oder „Geist“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησε
  choice: machte
  rationale: Die direkte Wiedergabe wahrt die schlichte Kausativformulierung des Griechischen, ohne den Vorgang näher auszudeuten.
- source_word: τὸ μέσον τῆς καμίνου
  choice: das Innere des Ofens
  rationale: μέσον bezeichnet hier den Innenraum; diese Formulierung ist im heutigen Deutsch natürlicher als „die Mitte des Ofens“.
- source_word: πνεῦμα δρόσου
  choice: taubringenden Wind
  rationale: πνεῦμα bezeichnet in diesem konkreten Bild wahrscheinlich Wind oder Luftzug, während δρόσος die kühlende Feuchtigkeit des Taus bezeichnet. Die Übersetzung bewahrt das physische Bild, ohne die mögliche Bedeutung „Geist“ im Haupttext einzutragen.
- source_word: διασυρίζον
  choice: säuselnden
  rationale: Das Partizip beschreibt einen hörbar hindurchziehenden beziehungsweise pfeifenden Luftstrom. „Säuselnd“ verbindet Bewegung und Klang in einer würdigen, natürlichen Form.
- source_word: οὐχ ἥψατο αὐτῶν τὸ καθόλου τὸ πῦρ
  choice: Das Feuer berührte sie überhaupt nicht
  rationale: „Berühren“ gibt ἅπτομαι direkt wieder; „überhaupt nicht“ bewahrt die emphatische Verneinung τὸ καθόλου.
- source_word: ἐλύπησεν
  choice: fügte ihnen keinen Schmerz zu
  rationale: Das Verb kann körperlichen Schmerz wie auch Kummer oder Bedrängnis bezeichnen. Im Feuerofen liegt körperliches Leid nahe, ohne dass die Formulierung ausschließlich darauf festgelegt wird.
- source_word: παρηνώχλησεν
  choice: bedrängte sie nicht
  rationale: Das seltene Verb bezeichnet Belästigung, Störung oder Beschwerde. „Bedrängen“ bringt die schädigende Einwirkung in diesem Zusammenhang idiomatisch zum Ausdruck.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐποίησε
  choice: „er“ bleibt ohne ausdrückliche Identifizierung stehen
  alternative: „Gott“ oder „der Engel“ ausdrücklich einsetzen
  rationale: Das Griechische enthält nur die maskuline Singularform des Verbs und setzt den Bezug aus dem Zusammenhang voraus. Die Übersetzung wahrt diesen Erzählfluss und legt den Handelnden nicht enger fest als der Vers selbst.
- issue: Bedeutung von πνεῦμα im Wunderbericht
  choice: „Wind“ im Haupttext
  alternative: „Geist“ oder „Hauch“
  rationale: Das Bild im Inneren des Ofens spricht vorrangig für einen kühlenden Luftstrom. Wegen des breiteren Bedeutungsspektrums von πνεῦμα wird die echte lexikalische Mehrdeutigkeit in der Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die beiden griechischen Verben für schädigende Einwirkung werden differenziert wiedergegeben; die Mehrdeutigkeit von πνεῦμα bleibt durch die Fußnote sichtbar.
