base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/037.yaml
  text: Bless the Lord[a], waters and all that are above the heavens; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Wasser und alles, was über dem Himmel ist; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Pluralimperativ fordert die angesprochenen Schöpfungselemente zum Lob Gottes auf. „Preist“ ist im modernen Deutschen natürlich und bewahrt den liturgischen Charakter.
- source_word: ὕδατα
  choice: ihr Wasser
  rationale: Der griechische Plural bezeichnet die Wasser als kosmische Größe. Das im Deutschen formal singularische Kollektiv „Wasser“ ist idiomatisch; „ihr“ macht die direkte Anrede deutlich.
- source_word: πάντα τὰ ἐπάνω τοῦ οὐρανοῦ
  choice: alles, was über dem Himmel ist
  rationale: Die substantivierte neutrale Pluralform wird kollektiv wiedergegeben. Der Singular „Himmel“ folgt dem griechischen τοῦ οὐρανοῦ, ohne die räumliche Aussage zu glätten.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Den Herrn“ gibt den griechischen Gottestitel κύριος wieder, ohne eine nicht ausdrücklich vorliegende Wiedergabe des hebräischen Gottesnamens einzuführen.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Die Formulierung erhält die musikalische Bedeutung des Verbs und ist zugleich verständliches, gehobenes Deutsch.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Die Wiedergabe bewahrt die verstärkende Kraft des Kompositums und den parallelen Imperativ des hymnischen Refrains.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die geläufige doxologische Wendung gibt die unbegrenzte Dauer im Deutschen würdig und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in einem griechischen deuterokanonischen Hymnus
  choice: den Herrn
  alternative: den HERRN
  rationale: Da der vorliegende griechische Text κύριος bietet und nicht unmittelbar den hebräischen Gottesnamen, vermeidet „den Herrn“ eine textlich nicht ausgewiesene typografische Deutung.
- issue: Kosmische Referenz von πάντα τὰ ἐπάνω τοῦ οὐρανοῦ
  choice: alles, was über dem Himmel ist
  alternative: alles über den Himmeln
  rationale: Die gewählte Fassung erhält sowohl den kollektiven Umfang von πάντα als auch den Singular des griechischen οὐρανοῦ und lässt die kosmologische Aussage unaufgelöst stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit hymnischem Rhythmus. Die direkte Anrede wird durch „ihr Wasser“ verdeutlicht; die parallelen Pluralimperative bleiben erhalten.
