base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/067.yaml
  text: Bless the Lord[a], all you who fear the Lord, the God of gods; sing praise and give thanks, for his mercy is forever[b], even forever and ever.
translation:
  language: de
  text: Preist den Gott der Götter, ihr alle, die ihr den Herrn verehrt[a]; singt ihm Lob und dankt ihm. Denn seine Barmherzigkeit währt ewig[b], ja, bis in alle Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die ihr den Herrn anbetet“; sinngemäß auch „die ihr den Herrn fürchtet“.
    reason: lexical_alternative
  - marker: b
    text: Oder „denn seine beständige Güte bleibt für immer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der pluralische Imperativ bezeichnet hier im liturgischen Zusammenhang das lobende Preisen Gottes. „Preist“ ist im heutigen Deutsch natürlicher als „segnet“, wenn Gott das Objekt ist.
- source_word: πάντες οἱ σεβόμενοι τὸν κύριον
  choice: ihr alle, die ihr den Herrn verehrt
  rationale: σέβομαι bezeichnet ehrfürchtige Verehrung beziehungsweise Anbetung. „Verehrt“ gibt das griechische Verb direkter wieder als das traditionsgeprägte „fürchtet“.
- source_word: τὸν θεὸν τῶν θεῶν
  choice: den Gott der Götter
  rationale: Die traditionelle und formal transparente Wiedergabe bewahrt den biblischen Hoheitstitel. Das Objekt wird im Deutschen vor die Anrede gestellt, um die syntaktische Beziehung eindeutig zu machen.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Die Formulierung bewahrt gegenüber einem bloßen „lobt“ den musikalischen Sinn des Verbs und klingt zugleich natürlich.
- source_word: ἐξομολογεῖσθε
  choice: dankt ihm
  rationale: Im hymnischen Zusammenhang bezeichnet das Verb öffentliches Danken oder Preisen; neben ὑμνεῖτε passt „dankt“ am besten und vermeidet eine unnötige Wiederholung.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: seine Barmherzigkeit
  rationale: „Barmherzigkeit“ ist die direkte, würdige Wiedergabe von ἔλεος und lässt den Akzent auf Gottes erbarmendem Handeln bestehen.
- source_word: εἰς τὸν αἰῶνα … εἰς τὸν αἰῶνα τῶν αἰώνων
  choice: währt ewig … ja, bis in alle Ewigkeit
  rationale: Die zweifache Ewigkeitsformel wird nicht zusammengezogen; „ja“ macht ihre steigernde Wirkung im Deutschen deutlich.
theological_decisions:
- issue: Bedeutung von σεβόμενοι im Gottesdienstkontext
  choice: die ihr den Herrn verehrt
  alternative: die ihr den Herrn fürchtet / anbetet
  rationale: Das griechische σέβομαι bezeichnet ehrfürchtige religiöse Verehrung, ist aber nicht das übliche Verb für „fürchten“. Die Hauptfassung bleibt daher quellennah, während die sachlich möglichen Nuancen in der Fußnote genannt werden.
- issue: Wiedergabe von ἔλεος
  choice: Barmherzigkeit
  alternative: beständige Güte / Huld
  rationale: Da der griechische Text ἔλεος bietet, ist „Barmherzigkeit“ lexikalisch transparent. Andere deutsche Begriffe können den Aspekt dauerhafter Zuwendung hervorheben, sollen ihn aber nicht stillschweigend an die Stelle des griechischen Ausdrucks setzen.
- issue: Beziehung zwischen κύριον und θεὸν τῶν θεῶν
  choice: Der Herr, den die Angeredeten verehren, ist derselbe, der als „Gott der Götter“ gepriesen wird.
  alternative: „den Herrn“ als zusätzliches, ausdrücklich nach εὐλογεῖτε ergänztes Objekt
  rationale: Im griechischen Satz ist τὸν θεὸν τῶν θεῶν das ausdrückliche Akkusativobjekt zu εὐλογεῖτε, während τὸν κύριον zu σεβόμενοι gehört. Die deutsche Wortstellung macht diese Syntax klar, ohne ein weiteres Objekt in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges liturgisches Deutsch mit durchgehender Pluralanrede. Die Umstellung von „den Gott der Götter“ an den Satzanfang dient der syntaktischen Klarheit; die beiden griechischen Ewigkeitsformeln bleiben als Steigerung erhalten.
