base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/063.yaml
  text: Bless the Lord[a], spirits and souls of the righteous[b]; sing hymns and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn[a], ihr Geister und Seelen der Gerechten; singt ihm Loblieder und erhebt ihn hoch in alle Ewigkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lobt den Herrn, ihr Geister und Seelen der Gerechten.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in die Zeitalter“; die Wendung ist eine feste doxologische Formel mit dem Sinn „für immer“ oder „in alle Ewigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der pluralische Imperativ bezeichnet hier liturgisches Lob. „Preist“ ist im modernen Deutschen natürlich und würdig; „segnet“ wäre als Aufforderung gegenüber dem Herrn missverständlich.
- source_word: πνεύματα καὶ ψυχαὶ
  choice: Geister und Seelen
  rationale: Beide griechischen Begriffe werden getrennt wiedergegeben, ohne sie anthropologisch näher zu bestimmen oder zu einem einzigen Ausdruck zusammenzuziehen.
- source_word: δικαίων
  choice: der Gerechten
  rationale: Der Genitiv bezieht sich grammatisch auf die zusammengehörige Wendung „Geister und Seelen“; die substantivierte Form ist im Deutschen idiomatisch.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Herr“ entspricht dem jüdisch-griechischen liturgischen Gebrauch von κύριος und ist im Deutschen die etablierte Wiedergabe.
- source_word: ὑμνεῖτε
  choice: singt ihm Loblieder
  rationale: Die Wiedergabe bewahrt ausdrücklich den musikalisch-hymnischen Sinn des Verbs und klingt zugleich natürlich.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Die Formulierung gibt die verstärkende Bedeutung des zusammengesetzten Verbs wieder, ohne den Ausdruck mit einer zusätzlichen theologischen Deutung zu füllen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in alle Ewigkeit
  rationale: Die geläufige deutsche Doxologieformel vermittelt den fortdauernden Sinn der griechischen Wendung angemessen.
theological_decisions:
- issue: Anthropologische Verbindung von „Geistern“ und „Seelen“
  choice: Beide Begriffe bleiben in „Geister und Seelen der Gerechten“ ausdrücklich erhalten.
  alternative: Die Wendung als Hendiadyoin zusammenziehen, etwa zu „Seelen der Gerechten“, oder als „die Gerechten mit Geist und Seele“ deuten.
  rationale: Der griechische Text nennt πνεύματα und ψυχαί nebeneinander. Die Übersetzung bewahrt diese Spannung, ohne daraus eine bestimmte Lehre über die Zusammensetzung des Menschen abzuleiten.
translation_notes:
  register: Modernes, würdevolles liturgisches Deutsch. Das ergänzte „ihr“ macht die griechische Anrede im Deutschen deutlich. Die beiden aufeinanderfolgenden Lobaufforderungen bleiben in ihrer unterschiedlichen Färbung erkennbar.
