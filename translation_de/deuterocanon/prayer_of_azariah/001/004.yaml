  text: For you are righteous in all that you have done to us, and all your works are true, and your ways are straight, and all your judgments are true.
translation:
  language: de
  text: Denn du bist gerecht in allem, was du uns getan hast. Alle deine Werke sind wahr, deine Wege sind gerade, und alle deine Urteile sind wahr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: gerecht
  rationale: Das Prädikatsadjektiv bezeichnet Gottes moralische Gerechtigkeit in seinem Handeln; „gerecht“ ist im modernen Deutschen präzise und bibelsprachlich vertraut.
- source_word: πᾶσιν οἷς ἐποίησας ἡμῖν
  choice: in allem, was du uns getan hast
  rationale: Die umfassende Dativ-Relativkonstruktion wird natürlich wiedergegeben und bewahrt die ausdrückliche Aussage, dass Gott an den Sprechern gehandelt hat.
- source_word: ἔργα
  choice: Werke
  rationale: „Werke“ entspricht dem griechischen Ausdruck direkt und ist für Gottes Taten im Deutschen geläufig.
- source_word: ἀληθινὰ / ἀληθιναί
  choice: wahr
  rationale: Die Wiederholung desselben deutschen Wortes bildet die Wiederholung im Griechischen ab und lässt den Bedeutungsumfang zwischen wahr, verlässlich und wirklich bestehen.
- source_word: ὁδοί
  choice: Wege
  rationale: „Wege“ bewahrt das Bild für Gottes Art zu handeln und ist verständliche, etablierte biblische Sprache.
- source_word: εὐθεῖαι
  choice: gerade
  rationale: „Gerade“ erhält die Wegmetapher, statt sie durch die deutende Wiedergabe „richtig“ oder „rechtschaffen“ aufzulösen.
- source_word: κρίσεις
  choice: Urteile
  rationale: „Urteile“ bezeichnet Gottes richterliche Entscheidungen natürlich und vermeidet die mögliche moderne Fehlauffassung von „Gerichte“ als Institutionen.
theological_decisions:
- issue: Gottes Gerechtigkeit angesichts dessen, was die Sprecher erlitten haben
  choice: „was du uns getan hast“
  alternative: Eine indirekte Formulierung wie „was du über uns hast kommen lassen“
  rationale: Der griechische Text schreibt das Handeln ausdrücklich Gott zu. Die Übersetzung bewahrt diese theologische Spannung und schwächt die göttliche Wirksamkeit nicht zu einem bloßen Zulassen ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die bildhafte Rede von den „geraden Wegen“ sowie die zweimalige Aussage „wahr“ bleiben bewusst erhalten.
