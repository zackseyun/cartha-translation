translation:
  language: de
  text: Und es zog hindurch und verbrannte die Chaldäer, die es rings um den Ofen fand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und es zog hindurch und setzte die Chaldäer, die es rings um den Ofen fand, in Brand.“'
    reason: Die griechischen Verben können formaler als Bewegung durch den Bereich und als Inbrandsetzen wiedergegeben werden.
lexical_decisions:
- source_word: διώδευσεν
  choice: fuhr hindurch
  rationale: Das Verb bezeichnet eine Bewegung durch einen Bereich hindurch. „Fuhr hindurch“ ist im Deutschen natürlich, bewahrt die Dynamik des Feuers und vermeidet eine übermäßige Verstärkung.
- source_word: ἐνεπύρισεν
  choice: verbrannte
  rationale: Im Zusammenhang bezeichnet das Verb die zerstörerische Wirkung des Feuers. „Verbrannte“ gibt dies klar wieder, ohne ausdrücklich vollständige Vernichtung zu behaupten.
- source_word: οὓς εὗρεν
  choice: die es … fand
  rationale: Die Relativkonstruktion bleibt eng am Griechischen und bezeichnet diejenigen, auf die das Feuer dort traf.
- source_word: περὶ τὴν κάμινον
  choice: rings um den Ofen
  rationale: περί mit Akkusativ ist hier räumlich zu verstehen. „Rings um“ gibt die Lage um den Ofen präzise und idiomatisch wieder.
- source_word: τῶν Χαλδαίων
  choice: die Chaldäer
  rationale: Der griechische Volksname wird direkt beibehalten; „Babylonier“ wäre eine erklärende Angleichung, die der Wortlaut nicht verlangt.
