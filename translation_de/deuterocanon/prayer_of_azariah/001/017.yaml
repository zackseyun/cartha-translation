base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/017.yaml
  text: As with whole burnt offerings of rams and bulls[a], and as with tens of thousands of fat lambs, so let our sacrifice be before you today and make atonement before you, for there is no shame for those who have put their trust in you[b], and let it be brought to completion before you.
translation:
  language: de
  text: Wie bei Ganzbrandopfern von Widdern und Stieren und bei Zehntausenden fetter Lämmer, so möge unser Opfer heute vor dir sein und vor dir Sühne bewirken.[a] Denn wer auf dich vertraut, wird nicht beschämt. Und möge es vor dir vollendet werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung bedeutet wörtlich „hinter dir“. Im Zusammenhang des Gebets kann sie sinngemäß „vor dir“ oder „in deiner Gegenwart“ bedeuten. Das Verb kann auch im Sinn von „wohlgefällig sein“ oder „angenommen werden“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: Auch hier steht im Griechischen wörtlich „hinter dir“. Die Formulierung ist verkürzt; der Bezug auf das zuvor genannte Opfer und die Wiedergabe „vor dir vollendet werden“ folgen dem Zusammenhang.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁλοκαυτώμασι
  choice: Ganzbrandopfern
  rationale: Das Wort bezeichnet Opfer, die vollständig verbrannt werden. „Ganzbrandopfer“ bewahrt diese kultische Besonderheit präziser als das allgemeinere „Brandopfer“.
- source_word: μυριάσιν
  choice: Zehntausenden
  rationale: μυριάς bezeichnet zunächst eine Einheit von zehntausend und im Plural eine sehr große Zahl. „Zehntausende“ erhält das konkrete Größenbild.
- source_word: ἀρνῶν πιόνων
  choice: fetter Lämmer
  rationale: Die direkte Wiedergabe bewahrt das Bild besonders wertvoller, wohlgenährter Opfertiere.
- source_word: θυσία
  choice: Opfer
  rationale: „Opfer“ erhält den kultischen Zusammenhang und zugleich die übertragene Bedeutung der gegenwärtigen Hingabe der Betenden.
- source_word: ἐξιλάσαι
  choice: Sühne erwirken
  rationale: Das Verb gehört zur Sprache von Sühnung und Versöhnung. „Sühne erwirken“ wahrt dieses theologische Gewicht, ohne das Verb lediglich als Annahme oder Wohlgefallen zu paraphrasieren.
- source_word: ὄπισθέν σου
  choice: bei dir / vor dir
  rationale: Wörtlich bedeutet die ungewöhnlich wiederholte Wendung „hinter dir“. Im Gebets- und Opferzusammenhang ist eine relationale Wiedergabe wie „bei dir“ beziehungsweise „vor dir“ verständlicher; die wörtliche Form wird in der Fußnote offengelegt.
- source_word: τοῖς πεποιθόσιν ἐπὶ σοί
  choice: wer auf dich vertraut
  rationale: Die substantivierte Partizipialform bezeichnet alle, die ihr Vertrauen dauerhaft auf Gott gesetzt haben. Die deutsche Singularform mit „wer“ ist natürlich und schließt die Gesamtheit ein.
- source_word: τελειῶσαι
  choice: zur Vollendung kommen
  rationale: Das Verb bezeichnet das Vollenden oder Zum-Ziel-Bringen. Wegen der stark verkürzten griechischen Syntax wird die Aussage im Deutschen auf das Opfer bezogen, während die mögliche personale Deutung in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Sühnende Wirkung des gegenwärtigen Opfers
  choice: bei dir Sühne erwirken
  alternative: dir wohlgefällig sein / vor dir angenommen werden
  rationale: ἐξιλάσαι trägt eine echte kultische Sühnebedeutung. Die Hauptfassung bewahrt sie, ohne festzulegen, auf welche genaue Weise das nichttierische Opfer der Betenden Sühne erwirkt.
- issue: Bezug des abschließenden τελειῶσαι
  choice: Das Opfer soll vor Gott zur Vollendung kommen
  alternative: Die Betenden sollen Gott ganz folgen
  rationale: Die Syntax ist gedrängt, und das aktive Infinitiv τελειῶσαι hat kein ausdrücklich genanntes Objekt. Der unmittelbare Satz nennt das Opfer als Subjekt; zugleich kann ὄπισθέν σου personal im Sinn des Folgens verstanden werden. Diese Spannung wird nicht verschwiegen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdige Gebetssprache mit präziser kultischer Begrifflichkeit. Der Satzbau wurde für gewöhnliche Leser gegliedert, ohne die ungewöhnliche griechische Syntax oder ihre theologischen Mehrdeutigkeiten zu verdecken.
