base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/061.yaml
  text: Bless the Lord[a], priests[b]; sing hymns and highly exalt him forever.
translation:
  language: de
  text: Preist[a] den Herrn, ihr Priester; singt ihm Lob und erhebt ihn über alle Maßen in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Segnet den Herrn«. Im Lobpreis Gottes hat das griechische Verb hier den Sinn von »preisen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ kann wörtlich mit »segnet« wiedergegeben werden; beim Lobpreis Gottes bezeichnet er jedoch natürlich das Preisen. Die Fußnote bewahrt die liturgische Grundbedeutung.
- source_word: ἱερεῖς
  choice: ihr Priester
  rationale: Der griechische Vokativ Plural redet die Priester unmittelbar an; »ihr« macht diese Anrede im Deutschen eindeutig und natürlich.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Die Wiedergabe folgt dem griechischen κύριος, ohne eine aus dem hebräischen Gottesnamen abgeleitete typografische Konvention einzuführen.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: ὑμνέω bezeichnet ausdrücklich gesungenes Lob. Die Formulierung ist im modernen Deutsch verständlicher als »hymnisiert« und natürlicher als »singt Hymnen«.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alle Maßen
  rationale: Das Präfix ὑπερ- verstärkt das Erheben; »über alle Maßen« erhält diese Steigerung in idiomatischem Deutsch.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die traditionelle und zugleich verständliche deutsche Wiedergabe der doxologischen Zeitformel.
theological_decisions:
- issue: Wiedergabe von κύριος in der doxologischen Anrede
  choice: der Herr
  alternative: der HERR
  rationale: Die griechische Vorlage bietet κύριος und nicht unmittelbar den hebräischen Gottesnamen. Daher wird »Herr« ohne Kapitälchen verwendet.
- issue: Menschen als Subjekt von εὐλογέω gegenüber Gott
  choice: preisen
  alternative: segnen
  rationale: »Preisen« vermittelt im heutigen Deutsch den gemeinten Lobpreis Gottes, während »Gott segnen« leicht als Bitte um göttliche Segenszuwendung an Gott missverstanden würde. Die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. Die parallelen Imperative und die gesteigerte Aussage von ὑπερυψοῦτε bleiben erhalten.
