base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/014.yaml
  text: For[a], Master, we have become smaller than all the nations[b], and today we are humbled in all the earth because of our sins.
translation:
  language: de
  text: Denn, Gebieter, wir sind geringer geworden[a] als alle Völker und sind heute auf der ganzen Erde[b] erniedrigt wegen unserer Sünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir sind kleiner gemacht worden“ beziehungsweise „wir sind weniger geworden“. Das griechische Verb kann eine Verkleinerung, Verminderung oder Herabsetzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im ganzen Land“. Das griechische Wort γῆ kann sowohl „Land“ als auch „Erde“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: Gebieter
  rationale: Der Vokativ von δεσπότης bezeichnet einen Herrn oder Machthaber mit umfassender Verfügungsgewalt. „Gebieter“ bewahrt diesen stärkeren Akzent und unterscheidet den Titel von κύριος.
- source_word: ἐσμικρύνθημεν
  choice: wir sind geringer geworden
  rationale: Das Verb bezeichnet ein Klein- oder Geringwerden beziehungsweise eine Herabsetzung. „Geringer geworden“ gibt im Vergleich mit allen Völkern vor allem den Verlust an Rang und Bedeutung wieder, ohne ihn auf die Bevölkerungszahl zu beschränken.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: als alle Völker
  rationale: παρά hat nach dem vergleichend gebrauchten Ausdruck ἐσμικρύνθημεν komparative Bedeutung. ἔθνη wird hier natürlich mit „Völker“ wiedergegeben.
- source_word: ταπεινοὶ
  choice: erniedrigt
  rationale: Das Adjektiv bezeichnet einen niedrigen oder gedemütigten Zustand. Im Zusammenhang von Sünde, Gericht und öffentlicher Schmach bringt „erniedrigt“ den erlittenen Zustand klar zum Ausdruck.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: auf der ganzen Erde
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten. Der umfassende Vergleich mit allen Völkern spricht hier eher für den weiteren Sinn, wobei die Alternative in einer Fußnote erhalten bleibt.
- source_word: σήμερον
  choice: heute
  rationale: Die schlichte moderne Wiedergabe des Zeitadverbs wahrt Klarheit und Würde.
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: wegen unserer Sünden
  rationale: διά mit Akkusativ bezeichnet den Grund. Die Formulierung bewahrt das ausdrückliche Bekenntnis eigener Schuld.
theological_decisions:
- issue: Wiedergabe der Gottesanrede δέσποτα
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: Der Ausgangstext verwendet δεσπότης und nicht κύριος. „Gebieter“ erhält den besonderen Akzent umfassender Autorität, ohne beide griechischen Titel unterschiedslos mit „Herr“ wiederzugeben.
- issue: Art der Erniedrigung Israels
  choice: Statusverlust und öffentliche Erniedrigung, ohne zahlenmäßige Verkleinerung auszuschließen
  alternative: ausschließlich zahlenmäßige Verminderung
  rationale: ἐσμικρύνθημεν kann Verkleinerung oder Herabsetzung ausdrücken; der folgende Vergleich mit den Völkern und ταπεινοί legen einen verminderten Rang nahe. Die Übersetzung legt den Ausdruck jedoch nicht ausschließlich darauf fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gebet eng, bleibt aber natürlich lesbar. „Gebieter“ ist bewusst feierlich, um die stärkere Nuance von δεσπότης gegenüber κύριος zu erhalten.
