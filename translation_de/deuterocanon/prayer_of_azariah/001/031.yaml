base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/031.yaml
  text: Blessed are you[a], who look upon the depths, seated upon the cherubim[b], and praised and highly exalted forever.
translation:
  language: de
  text: Gepriesen bist du, der du auf die Tiefen blickst und auf den Cherubim sitzt, gelobt und hoch erhaben in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος εἶ
  choice: Gepriesen bist du
  rationale: Die prädikative Segensformel richtet sich unmittelbar an Gott; „Gepriesen bist du“ ist im Deutschen natürlich, liturgisch und wahrt die Anrede.
- source_word: ὁ ἐπιβλέπων ἀβύσσους
  choice: der du in die Tiefen blickst
  rationale: Das substantivierte Partizip wird als Relativsatz zur direkten Anrede wiedergegeben. „In die Tiefen blicken“ bewahrt den visuellen Sinn und die kosmische Bildwelt des Plurals ἀβύσσους.
- source_word: καθήμενος ἐπὶ χερουβεὶν
  choice: auf den Kerubim thronst
  rationale: καθήμενος bedeutet wörtlich „sitzend“. Im Deutschen bringt „thronen“ die göttlich-königliche Sitzvorstellung natürlich zum Ausdruck; „auf den Kerubim“ hält die durch ἐπί bezeichnete räumliche Zuordnung fest.
- source_word: αἰνετὸς
  choice: gelobt
  rationale: Das verbale Adjektiv bezeichnet Gott als den Gepriesenen beziehungsweise Lobenswerten. „Gelobt“ passt zur parallelen doxologischen Prädikatsreihe, ohne eine zusätzliche Erklärung einzufügen.
- source_word: ὑπερυψούμενος
  choice: hoch erhaben
  rationale: Die verstärkte Erhöhung wird mit der geläufigen doxologischen Wendung „hoch erhaben“ wiedergegeben.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste doxologische Zeitformel wird in würdigem, allgemein verständlichem Deutsch idiomatisch wiedergegeben.
theological_decisions:
- issue: Göttliche Thronvorstellung bei den Kerubim
  choice: auf den Kerubim thronst
  alternative: auf den Kerubim sitzt / über den Kerubim thronst
  rationale: Das Thronmotiv ist im Kontext naheliegend, doch die Präposition wird nicht zu „über“ umgedeutet. So bleibt die räumliche Spannung des griechischen Ausdrucks erhalten.
- issue: Bedeutung von αἰνετός in der Doxologie
  choice: gelobt
  alternative: lobenswert / des Lobes würdig
  rationale: „Gelobt“ bewahrt die knappe parallele Reihung des Griechischen. Die mögliche wertende Nuance „lobenswert“ bleibt eine lexikalische Alternative, muss aber im Haupttext nicht ausgedeutet werden.
translation_notes:
  register: Modernes, würdiges liturgisches Deutsch. Die Satzstruktur bleibt nah an der griechischen Abfolge, wird aber durch finite Relativ- und Partizipialaussagen natürlich lesbar gemacht. Keine Fußnoten sind nötig, da die wichtigen Spannungen ohne irreführende Festlegung im Haupttext erhalten bleiben.
