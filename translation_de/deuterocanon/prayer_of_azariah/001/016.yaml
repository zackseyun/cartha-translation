lexical_decisions:
- source_word: ἀλλʼ
  choice: doch
  rationale: Kennzeichnet den Gegensatz zum vorausgehenden Mangel an Opfergaben; „doch“ führt die Bitte im Deutschen natürlich weiter.
- source_word: ἐν
  choice: mit
  rationale: Bezeichnet hier den Zustand oder die Haltung, in der die Betenden Annahme erbitten; „mit“ ist im Deutschen idiomatischer als das wörtliche „in“.
- source_word: ψυχῇ
  choice: Seele
  rationale: Bewahrt das anthropologische und geistliche Gewicht von ψυχή sowie die Unterscheidung vom parallelen πνεῦμα.
- source_word: συντετριμμένῃ
  choice: zerbrochener
  rationale: Gibt den durch das Perfektpartizip bezeichneten Zustand des Gebrochenseins anschaulich und quellennah wieder, ohne ihn vorschnell als Reue auszudeuten.
- source_word: πνεύματι
  choice: Geist
  rationale: Bezeichnet parallel zu ψυχή die innere Haltung und bewahrt die eigenständige Begrifflichkeit des griechischen Textes.
- source_word: τεταπεινωμένῳ
  choice: gedemütigtem
  rationale: Gibt den bleibenden Zustand des Erniedrigt- oder Demütigseins vor Gott wieder; das weniger deutliche „demütigen“ wäre grammatisch und semantisch schwächer.
- source_word: προσδεχθείημεν
  choice: mögen wir … angenommen werden
  rationale: Die passive Optativform drückt einen Wunsch beziehungsweise eine Bitte um wohlwollende Annahme aus.
theological_decisions:
- issue: Anthropologische Paarung von ψυχή und πνεῦμα
  choice: Als „Seele“ und „Geist“ unterschieden wiedergeben
  alternative: Beide Ausdrücke allgemein auf das innere Selbst beziehen
  rationale: Der griechische Text verwendet zwei verschiedene Begriffe in poetischem Parallelismus. Ihre getrennte Wiedergabe bewahrt die literarische und theologische Spannung, ohne eine feste anthropologische Systematik zu behaupten.
- issue: Bußsprachliches Bild in συντετριμμένῃ
  choice: „zerbrochener Seele“
  alternative: „zerknirschter Seele“
  rationale: „Zerbrochen“ bewahrt das konkrete Bild des griechischen Wortes; „zerknirscht“ ist im Kontext möglich, deutet das Bild aber stärker als innere Reue aus.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die Satzstellung hält die Bitte klar und bewahrt zugleich den poetischen Parallelismus von „Seele“ und „Geist“.
