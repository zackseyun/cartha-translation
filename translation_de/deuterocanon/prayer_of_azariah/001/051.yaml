base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/051.yaml
  text: Let the earth bless the Lord; let it sing hymns and highly exalt him forever.
translation:
  language: de
  text: Die Erde preise den Herrn; sie lobsinge ihm und erhebe ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογείτω
  choice: preise
  rationale: Der Imperativ der dritten Person ist als feierliche Aufforderung wiedergegeben. Bei Gott bedeutet εὐλογέω hier »preisen«; »segnen« wäre im heutigen Deutschen in dieser Richtung missverständlich.
- source_word: ἡ γῆ
  choice: die Erde
  rationale: Im kosmischen Schöpfungslob bezeichnet γῆ die Erde, nicht ein bestimmtes Land.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: »Herr« ist in diesem gottesdienstlichen Zusammenhang die natürliche und etablierte Wiedergabe von κύριος.
- source_word: ὑμνείτω
  choice: sie lobsinge ihm
  rationale: »Lobsingen« bewahrt sowohl den musikalischen als auch den preisenden Sinn von ὑμνέω und passt zum gehobenen liturgischen Register.
- source_word: ὑπερυψούτω
  choice: erhebe ihn hoch
  rationale: Die Formulierung gibt die verstärkende Vorsilbe ὑπερ- hörbar wieder, ohne das Verb zu einem bloßen »Loben« abzuflachen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bezieht sich auf den Herrn und fungiert als Objekt zu ὑπερυψούτω; bei »lobsingen« wird im Deutschen idiomatisch der Dativ »ihm« ergänzt.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste doxologische Wendung bringt die unbegrenzte zeitliche Dauer im Deutschen würdig und idiomatisch zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen deuterokanonischen Lobgesang
  choice: Herr
  alternative: Gebieter
  rationale: Der Kontext bezeichnet Gott mit dem liturgisch etablierten Titel »Herr«; »Gebieter« würde einen im Ausgangstext nicht geforderten Akzent setzen.
- issue: Wiedergabe von εὐλογέω mit Gott als Objekt
  choice: preisen
  alternative: segnen
  rationale: »Preisen« vermittelt im modernen Deutschen eindeutig das von der Schöpfung an Gott gerichtete Lob. »Gott segnen« ist zwar formal traditionsnah, kann für heutige Leser jedoch missverständlich sein.
translation_notes:
  register: Feierlich-liturgischer, zugleich verständlicher Stil. Der Parallelismus und die personifizierte Anrede an die Erde bleiben erhalten; das etwas gehobene »lobsingen« entspricht dem hymnischen Charakter.
