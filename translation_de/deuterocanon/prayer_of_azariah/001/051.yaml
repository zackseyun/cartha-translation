  source_fidelity: 'Die Wiedergabe folgt dem griechischen Parallelismus zuverlässig: εὐλογείτω ist mit „preise“ angemessen wiedergegeben, γῆ bezeichnet im kosmischen Kontext „die Erde“, und κύριος ist sachgerecht „der Herr“. „Sie lobsinge ihm“ vermittelt den hymnisch-musikalischen Gehalt von ὑμνείτω; der im Deutschen idiomatische Dativ expliziert lediglich die aus dem unmittelbaren Kontext eindeutige Ausrichtung des Lobes. „Erhebe ihn hoch“ erhält die Intensivierung von ὑπερυψούτω, und „in Ewigkeit“ gibt die doxologische Formel εἰς τοὺς αἰῶνας treffend wieder.'
