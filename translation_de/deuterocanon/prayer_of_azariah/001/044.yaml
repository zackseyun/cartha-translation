  text: Bless the Lord[a], frost and cold; sing hymns and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn[a], Frost und Kälte; singt ihm Loblieder und erhebt ihn über alle Maßen in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Segnet den Herrn, Frost und Kälte.“ Das griechische Verb εὐλογεῖτε kann „segnet“ oder in diesem Zusammenhang allgemeiner „preist“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ fordert Frost und Kälte dazu auf, den Herrn lobend zu nennen. „Preist“ ist im heutigen Deutschen natürlich und gibt in diesem an die Schöpfung gerichteten Aufruf die Bedeutung besser wieder als das missverständliche „Segnet“; die engere Alternative wird in der Fußnote genannt.
- source_word: ῥῖγος
  choice: Frost
  rationale: Bezeichnet schneidende Kälte beziehungsweise Frost und bleibt so vom folgenden ψῦχος unterschieden.
- source_word: ψῦχος
  choice: Kälte
  rationale: Die allgemeine Bezeichnung für Kälte ergänzt „Frost“, ohne beide griechischen Begriffe zusammenfallen zu lassen.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Natürliche deutsche Wiedergabe des bestimmten Akkusativobjekts in der traditionellen biblischen Anrede.
- source_word: ὑμνεῖτε
  choice: singt ihm Loblieder
  rationale: Bewahrt ausdrücklich den musikalischen Sinn des Verbs. Das ergänzte „ihm“ macht im Deutschen den Bezug auf αὐτόν natürlich und eindeutig.
- source_word: καὶ ὑπερυψοῦτε αὐτόν
  choice: und erhebt ihn über alles
  rationale: Gibt die verstärkende Kraft des Kompositums ὑπερυψόω idiomatisch wieder; „hoch erhebt“ wäre im Deutschen weniger natürlich und könnte die Intensivierung abschwächen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Geläufige, würdige deutsche Wiedergabe der doxologischen Formel für unbegrenzte Dauer.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen deuterokanonischen Lobgesang
  choice: der Herr
  alternative: Herr
  rationale: Der bestimmte Artikel gehört zur griechischen Konstruktion; „den Herrn“ ist hier zugleich die natürliche deutsche Form und legt keine zusätzliche konfessionelle Deutung fest.
- issue: Wiedergabe des an die Schöpfung gerichteten εὐλογεῖτε
  choice: Preist
  alternative: Segnet
  rationale: „Preist“ vermittelt den gemeinten Lobpreis im modernen Deutschen, während „segnet den Herrn“ leicht als Segensspendung an Gott missverstanden werden kann. Die lexikalische Spannung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Moderner, würdiger und liturgisch singbarer Parallelstil. Die beiden Kältebegriffe werden unterschieden; die musikalische Nuance von ὑμνεῖτε und die Verstärkung in ὑπερυψοῦτε bleiben erhalten.
