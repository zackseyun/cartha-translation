  text: And deliver us according to your wonders, and give glory to your name, O Lord;
translation:
  language: de
  text: Und rette uns gemäß deinen Wundertaten und gib deinem Namen Ehre, Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελοῦ
  choice: rette
  rationale: Der Aoristimperativ von ἐξαιρέω bittet im Gebetszusammenhang um rettendes Eingreifen. „Rette“ ist im heutigen Deutsch natürlich und gibt den Sinn präziser wieder als das wörtlichere „nimm heraus“.
- source_word: κατὰ τὰ θαυμάσιά σου
  choice: gemäß deinen Wundertaten
  rationale: κατά mit Akkusativ bezeichnet hier den Maßstab beziehungsweise die Entsprechung. „Wundertaten“ macht deutlich, dass θαυμάσια Gottes außergewöhnliche Taten meint, und „gemäß“ bewahrt den Bezug auf diesen Maßstab.
- source_word: δὸς δόξαν
  choice: gib … Ehre
  rationale: Die unmittelbare Imperativform wird formal nah wiedergegeben. Die deutsche Wendung „jemandem Ehre geben“ bewahrt den biblischen Ausdruck, ohne ihn deutend durch „verherrliche“ zu ersetzen.
- source_word: τῷ ὀνόματί σου
  choice: deinem Namen
  rationale: Der Dativ wird direkt wiedergegeben. „Name“ bleibt als biblischer Ausdruck für Gottes offenbarte Identität und den ihr gebührenden Ruhm erhalten und wird nicht auf „Ansehen“ verengt.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ wird als direkte Anrede wiedergegeben. „Herr“ ist würdig und im modernen Standarddeutsch natürlicher als „o Herr“.
theological_decisions:
- issue: Gottes Name als Empfänger der Ehre
  choice: gib deinem Namen Ehre
  alternative: verherrliche deinen Namen
  rationale: Die gewählte Fassung bewahrt sowohl die Bildsprache vom göttlichen Namen als auch die ungewöhnliche Konstruktion δὸς δόξαν, statt sie in eine geläufigere, aber stärker deutende Aussage umzuwandeln.
- issue: Wiedergabe der Gottesbezeichnung κύριε
  choice: Herr
  alternative: o Herr
  rationale: Die direkte Anrede an Gott bleibt eindeutig. Auf die im heutigen Deutsch feierlich-archaisch wirkende Interjektion „o“ wird verzichtet, da sie im Griechischen kein eigenes Wort repräsentiert.
translation_notes:
  register: Knappe, würdevolle Gebetssprache in modernem Standarddeutsch. Die Satzstruktur folgt dem griechischen Parallelismus, während „Wundertaten“ den handlungsbezogenen Sinn von θαυμάσια verständlich ausdrückt.
