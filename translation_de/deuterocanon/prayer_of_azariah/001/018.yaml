  text: And now we follow after you with our whole heart[a], and we fear you, and we seek your face.
translation:
  language: de
  text: Und nun folgen wir dir mit unserem ganzen Herzen, wir fürchten dich und suchen dein Angesicht[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „suchen deine Gegenwart“ beziehungsweise „suchen deine Gunst“. Wörtlich steht im Griechischen: „suchen dein Angesicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss durch καί als auch die unmittelbare zeitliche Wendung νῦν.
- source_word: ἐξακολουθοῦμεν
  choice: folgen wir dir
  rationale: Das Verb bezeichnet ein Nachfolgen beziehungsweise Sich-Anschließen. Das im Griechischen unausgesprochene Objekt wird aus dem Zusammenhang als „dir“ ergänzt, wie es natürliches Deutsch verlangt.
- source_word: ἐν ὅλῃ καρδίᾳ ἡμῶν
  choice: mit unserem ganzen Herzen
  rationale: Gibt die Wendung für ungeteilte Hingabe wieder und bewahrt sowohl das singularische „Herz“ als auch den gemeinschaftlichen Possessivbezug.
- source_word: φοβούμεθά σε
  choice: wir fürchten dich
  rationale: „Fürchten“ erhält die ausdrückliche Wortwahl des Griechischen und lässt die Spannung zwischen Furcht, Ehrfurcht und Verehrung bestehen.
- source_word: ζητοῦμεν τὸ πρόσωπόν σου
  choice: suchen dein Angesicht
  rationale: Die konkrete biblische Bildsprache wird bewahrt; „Angesicht“ ist im Deutschen würdevoll und intertextuell anschlussfähig, ohne die Wendung vorschnell als „Gegenwart“ oder „Gunst“ auszudeuten.
theological_decisions:
- issue: Bedeutung von φοβούμεθά σε im Blick auf Gott
  choice: wir fürchten dich
  alternative: wir verehren dich; wir haben Ehrfurcht vor dir
  rationale: Der griechische Text verwendet ausdrücklich das Wortfeld der Furcht. Die direkte Wiedergabe vermeidet eine theologische Verengung auf bloße Verehrung oder Ehrfurcht.
- issue: Deutung von ζητοῦμεν τὸ πρόσωπόν σου
  choice: suchen dein Angesicht
  alternative: suchen deine Gegenwart; suchen deine Gunst
  rationale: Der Haupttext behält die wörtliche Metapher und ihre biblische Resonanz bei; mögliche idiomatische Bedeutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Die wiederholten griechischen καί werden teilweise ohne wiederholtes „und“ wiedergegeben, damit der Satz im Deutschen natürlich fließt; die Reihung der drei Handlungen bleibt erhalten.
