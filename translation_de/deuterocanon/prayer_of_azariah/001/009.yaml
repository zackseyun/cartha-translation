  rationale: Die Revision stellt die beiden genitivischen Pluralgruppen „Feinde“ und „Abtrünnige“ grammatisch korrekt dar und gibt die Superlativform πονηροτάτῳ direkt wieder. Die nicht gedeckte Fußnote wird entfernt.
