  text: And you gave us into the hands of our lawless enemies, hateful rebels, and to an unjust and most wicked king in all the earth.
translation:
  language: de
  text: Und du hast uns in die Hände unserer gesetzlosen Feinde und höchst verhassten Abtrünnigen ausgeliefert, einem ungerechten König, dem bösartigsten auf der ganzen Erde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκας
  choice: hast … ausgeliefert
  rationale: Gibt die Übergabe in fremde Gewalt im Deutschen natürlich und mit der im Kontext liegenden Härte wieder.
- source_word: ἀνόμων
  choice: gesetzlosen
  rationale: Entspricht dem Grundsinn von ἄνομος und lässt offen, ob menschliches oder göttliches Gesetz im Blick ist.
- source_word: ἐχθίστων
  choice: überaus verhasster
  rationale: Bewahrt die superlativische Verstärkung und den auf Feindseligkeit beziehungsweise Verhasstheit bezogenen Wortstamm.
- source_word: ἀποστατῶν
  choice: Abtrünniger
  rationale: Bezeichnet Menschen, die sich abgewandt oder aufgelehnt haben, ohne die Aussage auf eine bestimmte konfessionelle Vorstellung von Abfall festzulegen.
- source_word: πονηροτάτῳ
  choice: bösartiger
  rationale: Der starke wertende Sinn von πονηρός wird erhalten; zusammen mit der Vergleichsphrase wird der griechische Superlativ idiomatisch komparativisch wiedergegeben.
- source_word: παρὰ πᾶσαν τὴν γῆν
  choice: als jeder andere auf der ganzen Erde
  rationale: παρά mit Akkusativ bezeichnet hier plausibel den Vergleichsmaßstab; die personenbezogene deutsche Formulierung ergibt sich aus dem Bezug auf den König.
theological_decisions:
- issue: Bezeichnung der Feinde als ἀποστάται
  choice: Abtrünnige
  alternative: Aufständische / Rebellen
  rationale: „Abtrünnige“ hält die mögliche religiöse und politische Dimension des Abfalls offen, während „Rebellen“ die politische Lesart stärker festlegen würde.
- issue: Reichweite des Superlativs beim König
  choice: der bösartiger ist als jeder andere auf der ganzen Erde
  alternative: der bösartigste König auf der ganzen Erde
  rationale: Die gewählte Fassung bildet sowohl den Superlativ πονηροτάτῳ als auch den mit παρά ausgedrückten Vergleich ab, ohne den Vergleich ausdrücklich auf andere Könige zu beschränken.
translation_notes:
  register: Dignitäre, gut verständliche Standardsprache. Die Genitiv-Apposition „überaus verhasster Abtrünniger“ folgt der griechischen Struktur und wahrt die unterscheidbaren Bezeichnungen „Feinde“ und „Abtrünnige“.
