base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/011.yaml
  text: Do not give us over utterly for the sake of your name[b][a], and do not break your covenant.
translation:
  language: de
  text: Gib uns nicht gänzlich preis[a] um deines Namens willen, und löse deinen Bund nicht auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „bis zum Ende“; gemeint sein kann: „Gib uns nicht völlig oder endgültig preis.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zerstreue deinen Bund nicht“; sinngemäß auch: „mache deinen Bund nicht zunichte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ παραδῷς ἡμᾶς
  choice: Gib uns nicht preis
  rationale: παραδίδωμι bezeichnet das Übergeben oder Ausliefern. „Preisgeben“ ist im Deutschen eine natürliche, würdige Wendung und bewahrt den Gedanken, schutzlos dem Verderben oder feindlicher Gewalt überlassen zu werden.
- source_word: εἰς τέλος
  choice: gänzlich
  rationale: Die Wendung kann wörtlich „bis zum Ende“ und idiomatisch „völlig, gänzlich“ bedeuten. Im Zusammenhang der Bitte gibt „gänzlich“ den Gedanken endgültiger oder vollständiger Preisgabe klar wieder, ohne die mögliche wörtliche Lesart zu verschweigen.
- source_word: διὰ τὸ ὄνομά σου
  choice: um deines Namens willen
  rationale: Die traditionelle, weiterhin verständliche deutsche Wendung bringt den Namen Gottes als Grund der Bitte zum Ausdruck und lässt den Bezug auf Gottes Ansehen und Identität offen.
- source_word: μὴ διασκεδάσῃς
  choice: löse ... nicht auf
  rationale: διασκεδάζω bedeutet konkret „zerstreuen, auseinanderstreuen“. Bei „Bund“ als Objekt vermittelt „auflösen“ die Wirkung des ungewöhnlichen griechischen Bildes in natürlichem Deutsch; die konkrete Metapher wird in der Fußnote bewahrt.
- source_word: σου τὴν διαθήκην
  choice: deinen Bund
  rationale: διαθήκη bezeichnet im biblischen Griechisch hier den Bund Gottes mit seinem Volk. „Bund“ ist die sachlich und sprachlich angemessene deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung von εἰς τέλος in der Bitte um Erbarmen
  choice: gänzlich
  alternative: bis zum Ende; für immer
  rationale: Der Text kann vollständige, endgültige oder zeitlich bis ans Ende reichende Preisgabe anklingen lassen. „Gänzlich“ gibt den idiomatischen Hauptsinn wieder; die Fußnote erhält die formnähere Lesart.
- issue: Wiedergabe von διασκεδάσῃς mit διαθήκην als Objekt
  choice: löse deinen Bund nicht auf
  alternative: zerstreue deinen Bund nicht; mache deinen Bund nicht zunichte
  rationale: Das griechische Verb enthält ein konkretes Bild des Zerstreuens, das in Verbindung mit „Bund“ ungewöhnlich ist. Die Hauptfassung formuliert die gemeinte Auflösung natürlich, ohne ausdrücklich einen juristischen Fachbegriff einzuführen; die Fußnote macht das Bild sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Um deines Namens willen“ bewahrt den feierlichen Gebetston, während „preisgeben“ und „auflösen“ allgemein verständlich bleiben. Die ungewöhnlichen griechischen Bilder und möglichen Bedeutungsnuancen werden durch die Fußnoten offengehalten.
