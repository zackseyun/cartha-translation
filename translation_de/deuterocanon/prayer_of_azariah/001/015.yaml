base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/015.yaml
  text: And at this time there is no ruler or prophet or leader, no whole burnt offering or sacrifice or offering or incense, and no place to bring firstfruits before you and to find mercy.
translation:
  language: de
  text: Und in dieser Zeit gibt es weder einen Herrscher noch einen Propheten noch einen Anführer, weder Ganzbrandopfer noch Opfer noch Opfergabe noch Räucherwerk, auch keinen Ort, an dem wir vor dir Erstlingsfrüchte darbringen[a] und Erbarmen finden können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Früchte darbringen“ oder allgemeiner: „eine Opfergabe darbringen“. Der griechische Ausdruck ist selten; „Erstlingsfrüchte“ entspricht dem kultischen Zusammenhang der umgebenden Begriffe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: in dieser Zeit
  rationale: Gibt die zeitliche Wendung unmittelbar und in natürlichem Deutsch wieder.
- source_word: ἄρχων
  choice: Herrscher
  rationale: Bezeichnet allgemein eine Person mit Regierungsgewalt und wahrt den Unterschied zu ἡγούμενος.
- source_word: προφήτης
  choice: Prophet
  rationale: Die übliche und kontextuell eindeutige Entsprechung.
- source_word: ἡγούμενος
  choice: Anführer
  rationale: Bezeichnet eine leitende Person, ohne ein bestimmtes politisches Amt festzulegen, und bleibt von ἄρχων unterschieden.
- source_word: ὁλοκαύτωσις
  choice: Ganzbrandopfer
  rationale: Bezeichnet ein Opfer, das vollständig verbrannt wird, und unterscheidet es vom allgemeineren θυσία.
- source_word: θυσία
  choice: Schlachtopfer
  rationale: Gibt den kultischen Opferbegriff wieder und hält ihn von Ganzbrandopfer und Opfergabe unterscheidbar.
- source_word: προσφορά
  choice: Opfergabe
  rationale: Bezeichnet eine dargebrachte Gabe; die Wiedergabe ist klar, kultisch passend und nicht unnötig kirchensprachlich.
- source_word: θυμίαμα
  choice: Räucherwerk
  rationale: Natürliche deutsche Bezeichnung für den im Kult verwendeten Weihrauch beziehungsweise die Räuchersubstanz.
- source_word: τοῦ καρπῶσαι
  choice: um … Erstlingsfrüchte darzubringen
  rationale: Das von καρπός abgeleitete, seltene Verb legt im Zusammenhang der Opferterminologie eine Darbringung von Erzeugnissen beziehungsweise Erstlingsfrüchten nahe; die verbleibende Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: ἐνώπιόν σου
  choice: vor dir
  rationale: Bewahrt knapp und natürlich den relationalen und kultischen Sinn.
- source_word: εὑρεῖν ἔλεος
  choice: Erbarmen zu finden
  rationale: Entspricht dem griechischen Bild und ist eine verständliche biblische Wendung im Deutschen.
theological_decisions:
- issue: Reihe kultischer Begriffe angesichts des Verlusts von Tempel und Gottesdienst
  choice: Alle genannten Leitungsämter und Opferformen werden einzeln wiedergegeben.
  alternative: Die Reihe zusammenfassend als „keine Führer und keine Opfer“ wiederzugeben.
  rationale: Die vollständige Aufzählung trägt das Gewicht der Klage und sollte nicht zu einer allgemeinen Aussage verkürzt werden.
- issue: Bedeutung von τοῦ καρπῶσαι
  choice: „Erstlingsfrüchte darzubringen“ mit Fußnote zur lexikalischen Unsicherheit.
  alternative: „eine Opfergabe darzubringen“ oder „Früchte darzubringen“.
  rationale: Der kultische Kontext stützt den Bezug auf Erzeugnisse oder Erstlingsfrüchte, doch das seltene griechische Verb erlaubt keine völlig sichere Spezifizierung; die Fußnote bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konstruktion „weder … noch“ erhält den klagenden Rhythmus der griechischen Aufzählung; technische Kultbegriffe werden präzise, aber verständlich wiedergegeben.
