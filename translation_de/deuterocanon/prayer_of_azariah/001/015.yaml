  source_fidelity: Die Aufzählung der fehlenden politischen bzw. religiösen Leitungsfiguren und der einzelnen Kultgaben folgt dem Griechischen genau. „Schlachtopfer“ legt für θυσία jedoch eine Tier- bzw. Schlachtopferbedeutung fest, die der hier allgemeiner verwendete Begriff nicht zwingend trägt. Die seltene Form καρπῶσαι ist im kultischen Kontext plausibel mit einer Frucht- bzw. Erstlingsfruchtdarbringung verbunden, bleibt aber lexikalisch unsicher; die Fußnote sollte diese Unsicherheit wahren.
  naturalness: Die Konstruktion „keinen Ort, um ... darzubringen“ ist im Deutschen unidiomatisch, weil der Ort nicht selbst handelt. „Keinen Ort, an dem wir ... darbringen und Erbarmen finden können“ ist natürlich und gibt die vom Ort der Gottesverehrung abhängige Aussage klar wieder.
  terminology: „Herrscher“, „Prophet“, „Anführer“, „Ganzbrandopfer“, „Opfergabe“ und „Räucherwerk“ sind angemessen und halten die griechischen Begriffe unterscheidbar. Für θυσία ist das nicht spezifizierende „Opfer“ vorzuziehen. „Erstlingsfrüchte“ ist als kontextuelle Hauptlesart mit erläuternder Fußnote vertretbar.
