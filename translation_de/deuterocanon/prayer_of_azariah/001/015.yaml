  - severity: medium
    issue: „auch keinen Ort, um vor dir Erstlingsfrüchte darzubringen ...“ ist syntaktisch unnatürlich.
    rationale: Die um-zu-Konstruktion lässt den Ort als Handelnden erscheinen. Eine Relativsatzkonstruktion mit implizitem menschlichem Subjekt gibt den Sinn idiomatisch wieder.
