lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Gepriesen
  rationale: Das prädikative Adjektiv steht in einer liturgischen Segens- und Lobformel. „Gepriesen“ gibt den doxologischen Charakter im Deutschen natürlich wieder.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος wird als göttlicher Titel in direkter Anrede mit „Herr“ wiedergegeben.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: du Gott unserer Väter
  rationale: „Unsere Väter“ bewahrt den ausdrücklich männlichen, bundestheologisch geprägten biblischen Ausdruck; das eingefügte „du“ macht die Apposition zur Anrede im Deutschen deutlich.
- source_word: αἰνετὸν
  choice: gelobt
  rationale: Das Verbaladjektiv bezeichnet, dass Gottes Name des Lobes würdig ist. „Sei gelobt“ ist eine natürliche deutsche doxologische Formulierung.
- source_word: δεδοξασμένον
  choice: verherrlicht
  rationale: Die perfektisch-passive Form von δοξάζω bezeichnet erwiesene beziehungsweise zukommende Herrlichkeit. „Verherrlicht“ erhält das theologische Gewicht des Ausdrucks.
- source_word: τὸ ὄνομά σου
  choice: dein Name
  rationale: Die übliche biblische Rede vom Namen Gottes bleibt ohne erklärende Erweiterung erhalten.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die griechische Wendung bedeutet idiomatisch unbegrenzte Dauer; „in Ewigkeit“ entspricht dem gehobenen Gebetsregister.
theological_decisions:
- issue: Wiedergabe der Bundesformel τῶν πατέρων ἡμῶν
  choice: unserer Väter
  alternative: unserer Vorfahren
  rationale: Der griechische Text nennt ausdrücklich die „Väter“. Die traditionelle Bundesformel bleibt erhalten, statt sie stillschweigend geschlechtsneutral zu verallgemeinern.
- issue: Modale Kraft von αἰνετὸν καὶ δεδοξασμένον
  choice: dein Name sei gelobt und verherrlicht
  alternative: dein Name ist lobenswert und verherrlicht
  rationale: Die griechische Nominalkonstruktion kann sowohl als Feststellung als auch doxologisch verstanden werden. Der deutsche Jussiv ist im Gebetskontext natürlich, ohne einen menschlichen Urheber der Verherrlichung ausdrücklich festzulegen.
translation_notes:
  register: Gehobene, aber gegenwärtige Gebetssprache. Die Satzstellung bleibt würdevoll und doxologisch, ohne unnötig altertümliche Formen wie „hochgelobt“ oder „von Ewigkeit zu Ewigkeit“ einzuführen.
