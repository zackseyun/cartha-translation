lexical_decisions:
- source_word: διείχετο
  choice: schlug … hoch … hinaus
  rationale: Das Imperfekt beschreibt die räumliche Ausdehnung der Flamme. Die deutsche Wendung gibt im Zusammenhang mit Feuer die aufwärtsgerichtete Ausdehnung natürlich wieder.
- source_word: ἡ φλὸξ
  choice: die Flamme
  rationale: Der Singular des griechischen Substantivs wird direkt und anschaulich wiedergegeben.
- source_word: ἐπάνω τῆς καμίνου
  choice: über den Ofen hinaus
  rationale: ἐπάνω mit Genitiv bezeichnet den Bereich oberhalb des Ofens; „hinaus“ verdeutlicht idiomatisch, dass die Flamme über ihn emporragte.
- source_word: ἐπὶ πήχεις τεσσαράκοντα ἐννέα
  choice: neunundvierzig Ellen hoch
  rationale: Die Präpositionalphrase bezeichnet hier die räumliche, wahrscheinlich vertikale Ausdehnung. Die antike Maßeinheit bleibt erhalten; „hoch“ macht die gemeinte Dimension im Deutschen verständlich.
