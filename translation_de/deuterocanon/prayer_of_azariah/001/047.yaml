  text: Bless the Lord[a], frost and snow[b]; sing hymns and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, Frost[a] und Schnee; besingt ihn und erhebt ihn hoch in Ewigkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Raureif“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für die Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ fordert die Schöpfung auf, den Herrn lobend zu rühmen. „Preist“ ist im Deutschen natürlich, würdig und für den liturgischen Kehrvers geeigneter als das missverständliche „segnet“.
- source_word: πάχναι
  choice: Frost
  rationale: Das Wort bezeichnet Frost beziehungsweise Reif. „Frost“ ist die allgemein verständliche Wiedergabe; die präzisere Alternative „Raureif“ wird in einer Fußnote genannt.
- source_word: χιόνες
  choice: Schnee
  rationale: Obwohl im Griechischen der Plural steht, wird die Naturerscheinung im Deutschen idiomatisch mit dem Kollektivsingular „Schnee“ bezeichnet.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Herr“ ist die sachgemäße Standardwiedergabe von κύριος in diesem griechischen deuterokanonischen Kontext.
- source_word: ὑμνεῖτε
  choice: besingt
  rationale: Das Verb bezeichnet ausdrücklich das Singen eines Hymnus oder Lobgesangs. „Besingt“ bewahrt diese musikalische Nuance knapp und natürlich.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Das intensive Verb bedeutet, jemanden überaus hoch zu erheben. Die Formulierung bewahrt die Verstärkung, ohne im Deutschen schwerfällig zu klingen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet hier unbegrenzte Dauer. „In Ewigkeit“ ist idiomatisch und entspricht dem liturgischen Register des Liedes.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: den Herrn
  alternative: den HERRN
  rationale: Der griechische Text bietet κύριος; die gewöhnliche Wiedergabe „Herr“ wahrt den Wortlaut, ohne durch Kapitälchen ausdrücklich eine Rückübersetzung auf den Gottesnamen festzulegen.
translation_notes:
  register: Modernes, würdevolles liturgisch-poetisches Deutsch. Die parallelen Imperative und die Anrede der Naturerscheinungen bleiben erhalten; zugleich werden griechische Pluralformen dort idiomatisch als deutsche Sammelbegriffe wiedergegeben.
