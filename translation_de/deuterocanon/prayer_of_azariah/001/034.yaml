base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/034.yaml
  text: Bless the Lord[a], all the works of the Lord; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, all ihr Werke des Herrn; singt ihm Lob und erhebt ihn aufs Höchste in Ewigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Zeitalter“; die griechische Wendung bezeichnet hier fortdauerndes Lob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Pluralimperativ fordert hier die gesamte Schöpfung zum lobenden Segnen Gottes auf. „Preist“ gibt diese doxologische Bedeutung im heutigen Deutschen natürlicher wieder als „Segnet“.
- source_word: πάντα τὰ ἔργα Κυρίου
  choice: all ihr Werke des Herrn
  rationale: Die Anrede im Vokativ wird mit „all ihr“ ausdrücklich gemacht; „Werke des Herrn“ bewahrt die Genitivverbindung und den hymnischen Charakter.
- source_word: Κυρίου / τὸν κύριον
  choice: des Herrn / den Herrn
  rationale: „Herr“ ist die sachgemäße Standardwiedergabe von κύριος; die unterschiedlichen Kasus entsprechen dem griechischen Genitiv beziehungsweise Akkusativ.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: ὑμνέω bezeichnet hymnisches, oft gesungenes Loben. „Singt ihm Lob“ ist verständlich und bewahrt diesen musikalisch-liturgischen Akzent.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Das Kompositum verstärkt das Erheben. „Erhebt ihn hoch“ bildet diese Intensivierung ab, ohne im Deutschen unnötig schwer zu wirken.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die wörtlich auf die „Zeitalter“ bezogene griechische Wendung ist eine feste Formel für fortdauerndes Lob; „in Ewigkeit“ passt zum würdevollen hymnischen Register.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen deuterokanonischen Hymnus
  choice: Herr
  alternative: HERR; Gebieter
  rationale: „Herr“ wahrt die griechische Form, die liturgische Anrede und den möglichen Hintergrund jüdischer Gottesnamensumschreibung, ohne eine typografische Identifikation mit dem Tetragramm ausdrücklich festzulegen.
- issue: Zeitliche Tragweite von εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  alternative: für die Zeitalter
  rationale: Im hymnischen Kehrvers bezeichnet die Formel dauerhaftes Lob. Die Fußnote bewahrt zugleich das konkrete Bild der griechischen Wendung, ohne die idiomatische Bedeutung im Haupttext zu verdunkeln.
translation_notes:
  register: Würdiges, gut verständliches Hymnenregister mit parallelen Pluralimperativen. Die Anrede „all ihr Werke“ macht den griechischen Vokativ im Deutschen deutlich; die Wiederholung „des Herrn … den Herrn“ bleibt bewusst erhalten.
