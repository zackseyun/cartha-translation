  text: Let every power bless the Lord[a]; sing praise and highly exalt him forever.
translation:
  language: de
  text: Jede Macht preise den Herrn[a]; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Mächte sollen den Herrn preisen.“ Im Griechischen steht „jede“ mit „Macht“ im Singular; die Wendung kann sowohl verteilend als auch kollektiv verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογείτω
  choice: preise
  rationale: Der Imperativ der dritten Person Singular wird im Deutschen natürlich mit dem Konjunktiv I als auffordernder Form wiedergegeben. „Preisen“ trifft im liturgischen Zusammenhang den Sinn von εὐλογέω.
- source_word: πᾶσα ἡ δύναμις
  choice: jede Macht
  rationale: Die singularische Verbindung wird eng abgebildet. „Jede“ wahrt die mögliche distributive Lesart, während „Macht“ den weiten Bedeutungsumfang von δύναμις erhält, ohne ihn auf Heerscharen oder Engel einzuengen.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος wird als Gottesbezeichnung traditionsgemäß und in modernem Standarddeutsch mit „der Herr“ wiedergegeben.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Die Form ist ein Imperativ der zweiten Person Plural. Die Wendung bewahrt ausdrücklich den musikalischen Gehalt des Verbs und klingt zugleich natürlich.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alles
  rationale: Die verstärkende Vorsilbe ὑπερ- wird durch „über alles“ hörbar gemacht; so bleibt die feierliche Steigerung des griechischen Ausdrucks erhalten.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste deutsche Wendung gibt die unbegrenzte Dauer idiomatisch wieder und passt zum liturgischen Ton des Abschnitts.
theological_decisions:
- issue: Bezeichnung Gottes durch κύριος
  choice: den Herrn
  alternative: den Herrscher
  rationale: „Herr“ ist die sachlich angemessene und etablierte Wiedergabe des griechischen Gottestitels; eine spezifischere Deutung würde mehr festlegen als der Ausgangstext.
- issue: Umfang von πᾶσα ἡ δύναμις
  choice: jede Macht
  alternative: alle Mächte
  rationale: Die Übersetzung folgt zunächst dem grammatischen Singular, lässt aber durch die Fußnote die ebenfalls mögliche kollektive Auffassung offen. Sie beschränkt die angesprochenen Mächte nicht ausdrücklich auf himmlische Wesen.
translation_notes:
  register: Feierlicher, gut verständlicher liturgischer Stil in modernem Standarddeutsch. Der Wechsel vom auffordernden Singular („preise“) zum Plural („singt“, „erhebt“) folgt den griechischen Verbformen und wird nicht geglättet.
