base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/059.yaml
  text: Bless the Lord[a], sons of men; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Menschen; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der pluralische Imperativ von εὐλογέω hat hier im hymnischen Aufruf doxologische Bedeutung. „Preist“ ist im heutigen Deutschen natürlicher als „Segnet“, wenn Menschen Gott anreden.
- source_word: οἱ υἱοὶ τῶν ἀνθρώπων
  choice: ihr Menschen
  rationale: Wörtlich „Söhne der Menschen“. Die griechische Wendung bezeichnet hier die Menschheit als Gruppe; „ihr Menschen“ gibt die direkte Anrede natürlich wieder, ohne den Sinn auf männliche Nachkommen zu verengen.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος wird in diesem griechischen deuterokanonischen Kontext sachgemäß und idiomatisch mit „der Herr“ wiedergegeben.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: ὑμνέω bezeichnet gesungenes beziehungsweise hymnisches Loben. Die Formulierung bewahrt diesen musikalisch-doxologischen Gehalt.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Das Kompositum bezeichnet gesteigertes Erheben oder Verherrlichen. „Erhebt ihn hoch“ wahrt die Intensivierung und passt zum parallelen hymnischen Imperativ.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste doxologische Wendung bezeichnet unbegrenzte Dauer; „in Ewigkeit“ ist würdig, verständlich und liturgisch passend.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: den Herrn
  alternative: den HERRN
  rationale: Der griechische Text bietet κύριος; die Schreibweise „Herr“ übersetzt den vorhandenen griechischen Ausdruck, ohne eine nicht ausdrücklich markierte Rückübertragung auf den Gottesnamen vorzunehmen.
- issue: Anthropologische Wendung οἱ υἱοὶ τῶν ἀνθρώπων
  choice: ihr Menschen
  alternative: ihr Menschensöhne
  rationale: Die Formulierung ist grammatisch maskulin, fungiert hier jedoch als umfassende Anrede an die Menschen. Die natürliche deutsche Wiedergabe bewahrt den kollektiven Sinn; die wörtlichere Alternative wäre missverständlich und unnötig altertümlich.
translation_notes:
  register: Hymnisch, würdig und zugleich in modernem Standarddeutsch. Die parallelen Imperative und die gesteigerte Lobpreisung des griechischen Textes bleiben erhalten.
