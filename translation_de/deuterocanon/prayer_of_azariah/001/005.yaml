base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/005.yaml
  text: And you have executed true judgments in all that you have brought upon us and upon your holy city[a], Jerusalem, the city of our fathers; for in truth and judgment you have done all these things because of our sins.
translation:
  language: de
  text: Und in allem, was du über uns und über deine heilige Stadt, Jerusalem, die Stadt unserer Väter, gebracht hast, hast du Urteile gefällt, die der Wahrheit entsprechen. Denn in Wahrheit und im Gericht[a] hast du all dies wegen unserer Sünden getan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Wahrheit und nach Recht“. Das griechische Wort kann hier Gericht, richterliches Urteil oder Recht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματα ἀληθείας
  choice: Urteile, die der Wahrheit entsprechen
  rationale: Die Formulierung bewahrt sowohl den gerichtlichen Sinn von κρίματα als auch den Wahrheitsbezug des Genitivs ἀληθείας. Sie ist im heutigen Deutsch klarer als das missverständliche „wahrhaftige Urteile“.
- source_word: ἐποίησας
  choice: hast … Urteile vollzogen / hast … getan
  rationale: 'Das Verb wird entsprechend seinen beiden unterschiedlichen Objekten idiomatisch variiert: Urteile werden „vollzogen“, alle diese Dinge werden „getan“.'
- source_word: κατὰ πάντα ἃ ἐπήγαγες ἡμῖν
  choice: mit allem, was du über uns … gebracht hast
  rationale: κατά bezeichnet hier den Zusammenhang beziehungsweise die Entsprechung zwischen den vollzogenen Urteilen und dem auferlegten Unheil; ἐπάγω wird ohne zusätzliche Festlegung auf „Strafe“ als „über jemanden bringen“ wiedergegeben.
- source_word: πόλιν σου τὴν ἁγίαν
  choice: deine heilige Stadt
  rationale: Dies ist die natürliche und theologisch gewichtige deutsche Entsprechung der griechischen Wortgruppe.
- source_word: τὴν τῶν πατέρων ἡμῶν Ἰερουσαλήμ
  choice: Jerusalem, die Stadt unserer Väter
  rationale: Die appositionelle Wiedergabe macht die Beziehung Jerusalems zu den Vorfahren verständlich, ohne sie näher auszudeuten.
- source_word: ἐν ἀληθείᾳ καὶ κρίσει
  choice: in Wahrheit und nach Recht
  rationale: Die beiden Begriffe bleiben unterschieden. „Nach Recht“ gibt den Maßstab richterlichen Handelns in natürlichem Deutsch wieder, während die Fußnote die stärker formale Alternative mit „Gericht“ dokumentiert.
- source_word: πάντα ταῦτα
  choice: all dies
  rationale: Das deutsche Sammelpronomen gibt den Rückverweis natürlich wieder; ein wörtlicheres „alle diese Dinge“ wäre hier schwerfällig.
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: wegen unserer Sünden
  rationale: διά mit Akkusativ bezeichnet den Grund; die Formulierung erhält den ausdrücklich bekenntnishaften Kausalzusammenhang.
theological_decisions:
- issue: Wiederholte Gerichtssprache und Gottes Handeln gegen Jerusalem
  choice: Die erste Aussage spricht ausdrücklich von vollzogenen Urteilen; die zweite von Handeln „in Wahrheit und nach Recht“.
  alternative: Die Ausdrücke könnten allgemeiner als „gerecht gehandelt“ zusammengezogen oder stärker formal als „in Wahrheit und im Gericht“ wiedergegeben werden.
  rationale: Die Übersetzung darf den Zusammenhang zwischen den Sünden des Volkes und Gottes richterlichem Handeln nicht abschwächen. Zugleich soll sie die zwei griechischen Begriffe Wahrheit und κρίσις nicht in einer einzigen wertenden Aussage auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am argumentativen Aufbau des Griechischen, wird aber für gute Verständlichkeit in zwei Sätze gegliedert. Gerichtliche Schlüsselbegriffe bleiben ausdrücklich erhalten.
