base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/045.yaml
  text: Bless the Lord, dews and showers; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Tautropfen und Schneeschauer; besingt ihn und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Im Aufruf an die Schöpfung bedeutet das Verb, den Herrn lobend zu rühmen; „preisen“ ist im modernen Deutschen natürlich und würdig.
- source_word: δρόσοι
  choice: Tautropfen
  rationale: Der Plural wird konkret wiedergegeben und passt zur direkten Anrede der Naturerscheinungen.
- source_word: νιφετοί
  choice: Schneeschauer
  rationale: Das Wort bezeichnet fallenden beziehungsweise in Schauern auftretenden Schnee, nicht allgemein Regenschauer und auch nicht zwingend schwere Schneestürme.
- source_word: ὑμνεῖτε
  choice: besingt
  rationale: Gibt das hymnische Loben als besingendes Preisen knapp und idiomatisch wieder.
- source_word: ὑπερυψοῦτε
  choice: erhebt … über alles
  rationale: Bewahrt die verstärkende Vorsilbe ὑπερ- und vermeidet die im Deutschen unnatürliche Form „hocherhöht“.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Geläufige deutsche Wiedergabe der idiomatischen Zeitformel mit ihrem unbegrenzten Zeithorizont.
theological_decisions:
- issue: Anrede des Herrn
  choice: den Herrn
  alternative: JHWH / den HERRN
  rationale: Der griechische Ausgangstext hat τὸν κύριον; die Übersetzung folgt dieser Textgestalt, ohne einen nicht ausdrücklich vorhandenen Gottesnamen einzusetzen.
- issue: Intensität von ὑπερυψοῦτε
  choice: erhebt ihn über alles
  alternative: verherrlicht ihn aufs Höchste
  rationale: Die gewählte Formulierung hält das Bild des Erhöhens fest und bewahrt zugleich die emphatische Steigerung, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Poetisch-liturgischer Imperativ in moderner, würdiger Standardsprache. Die parallelen Aufforderungen und die direkte Anrede der Naturerscheinungen bleiben erhalten.
