base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/026.yaml
  text: But the angel of the Lord went down into the furnace together with those around Azariah[a], and drove the flame of the fire out of the furnace,
translation:
  language: de
  text: Doch der Engel des Herrn stieg zusammen mit denen, die um Asarja waren[a], in den Ofen hinab und trieb die Feuerflamme aus dem Ofen hinaus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Asarjas Gefährten“. Wörtlicher: „mit denen, die um Asarja waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Doch
  rationale: δέ führt die Erzählung mit einer leicht kontrastierenden Wendung fort; „Doch“ nimmt den Gegensatz zur vorausgehenden Gefahr natürlich auf, ohne ihn zu überzeichnen.
- source_word: ἄγγελος Κυρίου
  choice: der Engel des Herrn
  rationale: Der bestimmte Artikel bei ἄγγελος und der Genitiv Κυρίου werden mit der geläufigen und quellennahen Wendung wiedergegeben.
- source_word: συνκατέβη ... ἅμα
  choice: stieg zusammen mit ... hinab
  rationale: Die Formulierung bewahrt sowohl die Abwärtsbewegung als auch die ausdrücklich bezeichnete Begleitung; das Präfix συν- und ἅμα verstärken gemeinsam diesen Sinn.
- source_word: τοῖς περὶ τὸν Ἀζαρίαν
  choice: denen um Asarja
  rationale: Die Wiedergabe bleibt nahe beim griechischen Ausdruck „die um Asarja“ und legt ihn nicht enger als „Gefährten“ aus.
- source_word: κάμινον
  choice: Ofen
  rationale: „Ofen“ ist im Deutschen die natürliche Bezeichnung für den Feuerofen dieser Erzählung; „Schmelzofen“ oder „Brennofen“ würden eine nicht ausdrücklich genannte Funktion ergänzen.
- source_word: ἐξετίναξεν
  choice: trieb ... hinaus
  rationale: Das Verb bezeichnet ein kraftvolles Herausschleudern oder Entfernen. „trieb ... hinaus“ gibt die wirksame Bewegung aus dem Inneren des Ofens idiomatisch wieder.
- source_word: τὴν φλόγα τοῦ πυρός
  choice: die Feuerflamme
  rationale: Das kompakte deutsche Kompositum gibt die genitivische Verbindung natürlich wieder und bewahrt das konkrete Bild der Flamme.
- source_word: ἐκ τῆς καμίνου
  choice: aus dem Ofen hinaus
  rationale: Die Wendung macht die von ἐκ bezeichnete Bewegung aus dem Inneren deutlich.
theological_decisions:
- issue: Wiedergabe von Κυρίου
  choice: des Herrn
  alternative: des HERRN; des Gebieters
  rationale: „Herr“ entspricht dem griechischen κύριος und ergibt in der festen Wendung „der Engel des Herrn“ natürliches Deutsch, ohne eine hebräische Namenskonvention in den griechischen Text einzutragen.
- issue: Identität des Engels des Herrn
  choice: Die Bezeichnung bleibt ohne nähere Identifizierung stehen.
  alternative: Auslegung als Gotteserscheinung; Auslegung als gewöhnlicher geschaffener Engel
  rationale: Der Vers nennt die Gestalt lediglich „den Engel des Herrn“. Die Übersetzung bewahrt diese theologische Offenheit und fügt keine spezifischere Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellennaher Satzstruktur. „Asarja“ folgt der im Deutschen üblichen biblischen Namensform. Das abschließende Komma bleibt erhalten, da der Quellvers syntaktisch in den folgenden Vers weiterführt.
