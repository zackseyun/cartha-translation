translation:
  language: de
  text: Preist den Herrn, ihr Blitze und Wolken; besingt ihn und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Im hymnischen Aufruf an die Schöpfung bedeutet das Verb, den Herrn lobend zu rühmen; „preisen“ ist im Deutschen natürlich und würdig.
- source_word: ἀστραπαὶ
  choice: Blitze
  rationale: Der griechische Plural wird als „Blitze“ wiedergegeben und nicht zu einem Kollektivsingular vereinheitlicht.
- source_word: νεφέλαι
  choice: Wolken
  rationale: Direkte und geläufige Entsprechung des griechischen Plurals.
- source_word: ὑμνεῖτε
  choice: besingt
  rationale: Bewahrt gegenüber dem allgemeineren „preist“ den Bezug auf hymnisches Singen.
- source_word: ὑπερυψοῦτε
  choice: erhebt ... hoch
  rationale: Gibt die verstärkende Bedeutung des Verbs wieder, ohne die Formulierung unnötig zu überladen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Natürliche deutsche Wiedergabe der idiomatischen Zeitformel mit unbegrenzter Dauer.
