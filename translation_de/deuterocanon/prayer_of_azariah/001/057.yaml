base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/057.yaml
  text: Bless the Lord[a], all birds of the sky; sing hymns and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr alle Vögel des Himmels[a]; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle fliegenden Geschöpfe des Himmels“.'
    reason: πέτεινα kann außer „Vögel“ auch allgemein geflügelte oder fliegende Geschöpfe bezeichnen.
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der pluralische Imperativ fordert im hymnischen Zusammenhang zum Lob Gottes auf. „Preist“ klingt im heutigen Deutschen natürlicher als „Segnet“, ohne die doxologische Kraft abzuschwächen.
- source_word: πάντα τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: all ihr Vögel des Himmels
  rationale: πετεινά kann allgemein fliegende Geschöpfe bezeichnen, meint hier im Schöpfungskatalog aber am natürlichsten die Vögel. Der Vokativ „all ihr“ gibt die direkte Anrede idiomatisch wieder; „des Himmels“ bewahrt die traditionelle und kontextuell passende Bedeutung von οὐρανοῦ.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος wird als göttlicher Titel entsprechend dem griechischen Wortlaut mit „Herr“ wiedergegeben; der Akkusativ hängt von „Preist“ ab.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: ὑμνέω bezeichnet ausdrücklich gesungenes Lob. „Singt ihm Lob“ ist natürlich, würdig und unterscheidet die musikalische Nuance vom vorausgehenden „Preist“.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Das Kompositum verstärkt ὑψόω. „Erhebt ihn hoch“ erhält diese Intensivierung und passt zum poetisch-liturgischen Register.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist auf den Herrn. Im Deutschen wird es bei „singt ihm Lob“ zusätzlich als Dativ aufgenommen und bei „erhebt ihn“ als direktes Objekt ausdrücklich wiedergegeben.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. „In Ewigkeit“ ist im Deutschen klar, geläufig und dem liturgischen Refrain angemessen.
theological_decisions:
- issue: Wiedergabe von κύριος im doxologischen Aufruf
  choice: der Herr
  alternative: der HERR
  rationale: Der griechische Text bietet κύριος und nicht unmittelbar das Tetragramm. „Herr“ folgt daher der vorliegenden Sprachgestalt, ohne eine zusätzliche typografische Identifizierung einzutragen.
translation_notes:
  register: Modernes, würdiges und liturgisch-poetisches Standarddeutsch. Die parallelen Imperative und die verstärkende Formulierung des wiederkehrenden Refrains bleiben erhalten. Keine Fußnote ist nötig, da „Vögel des Himmels“ den naheliegenden Sinn wiedergibt; die weitere Bedeutung „fliegende Geschöpfe“ ist möglich, aber für den Haupttext nicht erforderlich.
