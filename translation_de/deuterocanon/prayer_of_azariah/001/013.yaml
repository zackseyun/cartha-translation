translation:
  language: de
  text: wie du zu ihnen gesprochen hast, als du sagtest, dass ihre Nachkommen[a] so zahlreich werden würden wie die Sterne am Himmel und wie der Sand am Ufer des Meeres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihr Same«; die Formulierung greift die Verheißung an die Vorfahren auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησας πρὸς αὐτοὺς λέγων
  choice: du zu ihnen gesprochen und gesagt hast
  rationale: Die Wendung gibt sowohl die Richtung von πρός als auch das inhaltseinleitende Partizip λέγων klar und in würdigem, natürlichem Deutsch wieder.
- source_word: πολυπληθῦναι
  choice: an Zahl so zahlreich werden sollten
  rationale: Die Formulierung bringt die verheißene zahlenmäßige Mehrung zum Ausdruck und bewahrt mit „sollten“ die vom Infinitiv getragene Zukunftsperspektive, ohne ausdrücklich einen im Griechischen nicht genannten Handelnden einzuführen.
- source_word: τὸ σπέρμα αὐτῶν
  choice: ihre Nachkommen
  rationale: „Nachkommen“ bezeichnet im heutigen Deutsch klar die menschliche Abstammungslinie; die wörtliche und intertextuell bedeutsame Wiedergabe „ihr Same“ wird in der Fußnote ausgewiesen.
- source_word: ὡς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: wie die Sterne des Himmels
  rationale: Die traditionelle biblische Wendung bewahrt das Bild; der Zahlbezug von τῷ πλήθει ist bereits durch „an Zahl so zahlreich“ ausdrücklich wiedergegeben.
- source_word: ὡς τὴν ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: wie der Sand am Ufer des Meeres
  rationale: „Ufer“ gibt das wörtliche Bild vom „Rand/Lippenrand“ des Meeres idiomatisch und anschaulich wieder.
theological_decisions:
- issue: Bundes- und Verheißungssprache von σπέρμα
  choice: Nachkommen im Haupttext, mit „Same“ in der Fußnote
  alternative: Same
  rationale: Das verständliche „Nachkommen“ wahrt den genealogischen Sinn, während die Fußnote die wörtliche Form und ihren Anklang an die Verheißungen an die Vorfahren sichtbar erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gebetstext, wird jedoch durch die koordinierte Formulierung „gesprochen und gesagt“ sowie die idiomatische Wiedergabe von σπέρμα und χεῖλος für heutige Leser verständlich gehalten.
