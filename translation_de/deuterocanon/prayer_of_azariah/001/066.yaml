  text: Give thanks to the Lord[a], for he is good, for his mercy endures forever.
translation:
  language: de
  text: Dankt dem Herrn, denn er ist gut, denn seine Barmherzigkeit[a] währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine beständige Liebe währt ewig“. Wörtlich: „denn in Ewigkeit seine Barmherzigkeit“; im Griechischen fehlt ein ausdrückliches Verb.'
    reason: Lexikalische Alternative zu ἔλεος und Hinweis auf die verblos formulierte griechische Wendung.
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Dankt
  rationale: Im liturgischen Lobpreis bezeichnet das Verb hier nicht das Bekennen von Sünden, sondern Dank und preisendes Bekenntnis. „Dankt“ ist im Deutschen natürlich und entspricht der psalmischen Formel.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: Dies gibt den griechischen Dativ mit κύριος unmittelbar und in würdigem Standarddeutsch wieder.
- source_word: χρηστός
  choice: gut
  rationale: Obwohl das Wort auch „gütig“ oder „freundlich“ bedeuten kann, ist „gut“ in dieser feststehenden Lobpreisformel die prägnante und sachgerechte Wiedergabe.
- source_word: εἰς τὸν αἰῶνα
  choice: bleibt in Ewigkeit
  rationale: Die Wendung bedeutet idiomatisch dauerndes Fortbestehen. Da der griechische Satz kein ausdrückliches Verb enthält, ergänzt „bleibt“ dieses natürlich, ohne die Aussage unnötig zu verstärken.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: seine Barmherzigkeit
  rationale: ἔλεος bezeichnet unmittelbar Barmherzigkeit oder Erbarmen. „Barmherzigkeit“ bewahrt den liturgischen Ton und vermeidet, mögliche bundestheologische Untertöne im Haupttext festzuschreiben.
theological_decisions:
- issue: Bedeutungsumfang von ἔλεος in der psalmischen Lobpreisformel
  choice: seine Barmherzigkeit bleibt in Ewigkeit
  alternative: seine beständige Liebe währt ewig
  rationale: Der Haupttext folgt dem direkten Sinn des griechischen ἔλεος. Die alternative Wiedergabe hält fest, dass das Wort in biblisch-liturgischem Gebrauch auch Gottes beständige, treue Liebe anklingen lassen kann, ohne diese Nuance als einzig mögliche Auslegung festzulegen.
translation_notes:
  register: Moderne, würdige liturgische Sprache. Die wiederholte Begründung mit „denn … denn“ bildet die zweifache ὅτι-Struktur des Griechischen ab; „in Ewigkeit“ bewahrt den feierlichen Klang der Lobpreisformel.
