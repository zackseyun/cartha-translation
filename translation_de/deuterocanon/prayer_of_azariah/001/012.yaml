base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/012.yaml
  text: And do not withdraw your mercy from us[a], for the sake of Abraham your beloved, and Isaac your servant[b], and Israel your holy one.
translation:
  language: de
  text: Und entziehe uns dein Erbarmen nicht[a], um Abrahams willen, den du liebst, um Isaaks willen, deines Dieners, und um Israels willen, deines Heiligen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nimm dein Erbarmen nicht von uns.“'
    reason: lexical_alternative
  - marker: b
    text: Mit „Israel“ ist hier der Erzvater Jakob unter seinem Bundesnamen gemeint.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: entziehe
  rationale: Die transitive, verursachende Bedeutung von ἀφίστημι bezeichnet hier das Wegnehmen oder Zurückziehen des Erbarmens. „Entziehen“ ist im Deutschen natürlich und bewahrt den relationalen Charakter der Bitte.
- source_word: τὸ ἔλεός
  choice: dein Erbarmen
  rationale: ἔλεος bezeichnet Erbarmen oder Barmherzigkeit. „Erbarmen“ passt idiomatisch zur Wendung „jemandem etwas entziehen“ und gibt den Gebetskontext klar wieder.
- source_word: διὰ
  choice: um … willen
  rationale: διά mit Akkusativ führt hier die Patriarchen als Grund der Bitte an. „Um … willen“ gibt diesen bittenden Berufungscharakter prägnant wieder.
- source_word: ἠγαπημένον ὑπὸ σοῦ
  choice: den du liebst
  rationale: Die Formulierung macht ausdrücklich Gott als den Liebenden kenntlich. Der Relativsatz ist in modernem Deutsch natürlicher als „deinen Geliebten“ und bewahrt den Sinn des griechischen Passivs.
- source_word: δοῦλόν
  choice: Dieners
  rationale: Im ehrenden patriarchalischen Titel steht Isaaks treuer Dienst für Gott im Vordergrund. „Diener“ ist daher angemessener als das sozial stärker festgelegte „Sklave“.
- source_word: ἅγιόν
  choice: Heiligen
  rationale: Das substantivierte Adjektiv bezeichnet Israel als einen Gott Geheiligten beziehungsweise für ihn Ausgesonderten. „deines Heiligen“ gibt Form und Würde des Ausdrucks wieder, ohne ihn kirchlich als „Heiligen“ im späteren Sinn umzudeuten.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Der griechische Text nennt ausdrücklich Israel, den Bundesnamen des Patriarchen Jakob; dieser Name wird nicht zu „Jakob“ harmonisiert.
theological_decisions:
- issue: Wiedergabe von δοῦλος als patriarchalischer Ehrentitel
  choice: Diener
  alternative: Sklave
  rationale: In der ehrenden Anrede „Isaak, dein Diener“ ist die Zugehörigkeit und der treue Dienst gegenüber Gott maßgeblich; „Sklave“ würde den sozialen Status stärker hervorheben, als es der Zusammenhang nahelegt.
- issue: Bedeutung des mit διά eingeleiteten Berufens auf die Patriarchen
  choice: um Abrahams … Isaaks … Israels willen
  alternative: wegen Abrahams … Isaaks … Israels
  rationale: Die Bitte beruft sich auf Gottes Verhältnis zu den Patriarchen als Grund für fortdauerndes Erbarmen. „Um … willen“ bewahrt diesen fürbittenden beziehungsweise bundesbezogenen Ton, ohne die Aussage dogmatisch auszuweiten.
- issue: Identität Israels in der Aufzählung der Patriarchen
  choice: Israel mit erklärender Fußnote als Jakob unter seinem Bundesnamen
  alternative: Jakob im Haupttext
  rationale: Die Übersetzung erhält den ausdrücklich überlieferten Namen Ἰσραήλ; die Fußnote klärt die historische Referenz, ohne den Haupttext zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die dreifache Wendung „um … willen“ bildet die wiederholte griechische Präposition ab; die Appositionen „deines Dieners“ und „deines Heiligen“ bewahren die feierliche Parallelstruktur.
