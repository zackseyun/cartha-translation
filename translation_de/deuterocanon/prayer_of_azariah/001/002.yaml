base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/002.yaml
  text: Then Azariah stood and prayed thus[a], and opening his mouth he gave thanks to the Lord together with his companions in the midst of the fire, while the furnace was being intensely heated by the Chaldeans. And they said,
translation:
  language: de
  text: 'Da stand Asarja auf und betete folgendermaßen. Er öffnete seinen Mund und legte gemeinsam mit seinen Gefährten mitten im Feuer vor dem Herrn ein Bekenntnis ab[a], während die Chaldäer den Ofen überaus stark anheizten. Und sie sprachen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dankte dem Herrn“ oder „pries den Herrn“. Das griechische Verb kann je nach Zusammenhang Bekennen, Danken oder Loben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: trat Asarja vor
  rationale: Das adverbiale Aoristpartizip bezeichnet eine der Gebetshandlung vorausgehende Bewegung bzw. ein Sich-Hinstellen. „Trat … vor“ ist natürlich und bewahrt den feierlichen Erzählton.
- source_word: προσηύξατο οὕτως
  choice: betete folgendermaßen
  rationale: Gibt die gewöhnliche Bedeutung von προσεύχομαι wieder; „folgendermaßen“ leitet den Inhalt des Gebets idiomatisch ein.
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: Er öffnete seinen Mund
  rationale: Die feierliche, semitisch geprägte Redeformel wird bewahrt und nicht auf ein bloßes „er sagte“ verkürzt.
- source_word: ἐξωμολογεῖτο τῷ κυρίῳ
  choice: legte … vor dem Herrn ein Bekenntnis ab
  rationale: Die Formulierung wahrt im Deutschen die Dimension des Bekennens, die zum folgenden Schuldbekenntnis und zur Anerkennung von Gottes Gerechtigkeit passt. Die ebenfalls möglichen Bedeutungen „danken“ und „loben/preisen“ werden in der Fußnote erhalten.
- source_word: ἅμα τοῖς συνεταίροις αὐτοῦ
  choice: gemeinsam mit seinen Gefährten
  rationale: Gibt Begleitung und Gemeinschaft der drei Männer natürlich wieder.
- source_word: ἐν μέσῳ τῷ πυρί
  choice: mitten im Feuer
  rationale: Bewahrt die anschauliche Ortsangabe in natürlichem, gehobenem Deutsch.
- source_word: ὑποκαιομένης τῆς καμίνου … σφόδρα
  choice: während … den Ofen überaus stark anheizten
  rationale: Der Genitivus absolutus beschreibt die gleichzeitige fortdauernde Befeuerung; „anheizten“ gibt die aktive Bedeutung des Kompositums wieder, „überaus stark“ das verstärkende σφόδρα.
- source_word: ὑπὸ τῶν Χαλδαίων
  choice: die Chaldäer
  rationale: Die ausdrücklich genannte Volksbezeichnung wird beibehalten und nicht zu „Babylonier“ verallgemeinert.
- source_word: καὶ εἶπαν
  choice: 'Und sie sprachen:'
  rationale: Der überlieferte Plural bleibt trotz des vorausgehenden Singulars erhalten und stimmt mit der Erwähnung der Gefährten überein.
theological_decisions:
- issue: Bedeutung von ἐξωμολογεῖτο in einem Gebet mit Lob und Schuldbekenntnis
  choice: legte vor dem Herrn ein Bekenntnis ab
  alternative: dankte dem Herrn; pries den Herrn
  rationale: Das folgende Gebet bekennt Gottes Gerechtigkeit und die Sünde des Volkes, enthält aber zugleich Lob. Die Hauptfassung wahrt die Bekenntnisdimension; die in der biblisch-griechischen Verwendung ebenfalls möglichen Nuancen von Dank und Lob werden ausdrücklich vermerkt.
- issue: Pluralisches „sie sprachen“ nach Asarjas persönlichem Gebet
  choice: Und sie sprachen
  alternative: Und er sprach
  rationale: Der griechische Text hat den Plural. Er wird nicht an den unmittelbar vorausgehenden Singular angeglichen, sondern als gemeinsames Sprechen Asarjas und seiner Gefährten bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Redeformel „öffnete seinen Mund“ und der abschließende, im Griechischen auffällige Plural werden bewahrt; schwerfällige Partizipialkonstruktionen werden in klare Haupt- und Nebensätze aufgelöst.
