base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/006.yaml
  text: for we have sinned in all things[a], and we have acted lawlessly by turning away from you, and we have sinned greatly in all things.
translation:
  language: de
  text: Denn wir haben in allem gesündigt und gesetzlos gehandelt, indem wir uns von dir abgewandt haben; in allem haben wir schwer gesündigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb im letzten Satzteil ist stärker als das zuvor verwendete Wort für „sündigen“. Auch möglich: „wir haben in allem überaus gesündigt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: wir haben … gesündigt
  rationale: Der Aorist von ἁμαρτάνω wird im Deutschen für das rückblickende Bekenntnis natürlich mit dem Perfekt wiedergegeben.
- source_word: ἐν πᾶσι
  choice: in allem
  rationale: Die Wendung bewahrt den umfassenden Sinn, ohne festzulegen, ob alle einzelnen Taten oder jede Hinsicht gemeint sind.
- source_word: ἠνομήσαμεν
  choice: gesetzlos gehandelt
  rationale: Die Wiedergabe erhält den Bezug auf Gesetz und Gebot, der im Verb ἀνομέω liegt, statt ihn zu allgemeinem Fehlverhalten abzuschwächen.
- source_word: ἀποστῆναι ἀπὸ σοῦ
  choice: indem wir uns von dir abgewandt haben
  rationale: Der Infinitiv erläutert wahrscheinlich Inhalt oder Art des gesetzlosen Handelns. „Sich abwenden“ bewahrt sowohl den relationalen als auch den abtrünnigen Beiklang.
- source_word: ἐξημάρτομεν
  choice: wir haben schwer gesündigt
  rationale: Das zusammengesetzte Verb steigert die Aussage gegenüber dem vorherigen ἡμάρτομεν. „Schwer gesündigt“ gibt diese Verstärkung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Unterscheidung zwischen ἡμάρτομεν und dem verstärkten ἐξημάρτομεν
  choice: Die erste Form wird mit „gesündigt“, die zweite mit „schwer gesündigt“ wiedergegeben.
  alternative: Beide Verben unterschiedslos mit „gesündigt“ wiedergeben.
  rationale: Die unterschiedliche Wortwahl des griechischen Textes verstärkt das Bekenntnis in der Schlussklausel und sollte nicht eingeebnet werden.
- issue: Beziehung des Infinitivs ἀποστῆναι zu ἠνομήσαμεν
  choice: 'Modal beziehungsweise erläuternd: „indem wir uns von dir abgewandt haben“.'
  alternative: 'Final oder konsekutiv: „um uns von dir abzuwenden“ beziehungsweise „sodass wir uns von dir abwandten“.'
  rationale: Im Zusammenhang des Sündenbekenntnisses bezeichnet der Infinitiv am wahrscheinlichsten, worin das gesetzlose Handeln bestand, ohne einen Zweck der Abwendung zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Perfekt entspricht einem natürlichen deutschen Sündenbekenntnis; das Semikolon macht die rhetorische Steigerung der Schlussklausel sichtbar.
