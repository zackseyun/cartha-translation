base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/049.yaml
  text: Bless the Lord[a], light and darkness; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, Licht und Finsternis; besingt ihn und erhebt ihn über alle Maßen in Ewigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bis in die Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der pluralische Imperativ fordert die angesprochenen Schöpfungsgrößen zum Gotteslob auf. „Preist“ gibt im Deutschen die doxologische Bedeutung natürlicher wieder als das hier missverständliche „segnet“.
- source_word: φῶς καὶ σκότος
  choice: Licht und Finsternis
  rationale: Die beiden kosmischen Gegensätze werden direkt und in ihrer poetischen Paarung wiedergegeben.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Das Akkusativobjekt des Imperativs wird in der im Deutschen üblichen liturgischen Form wiedergegeben.
- source_word: ὑμνεῖτε
  choice: besingt
  rationale: Das Verb bezeichnet das Singen eines Hymnus oder Lobgesangs; „besingt“ bewahrt diesen musikalisch-liturgischen Klang.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alle Maßen
  rationale: Die Form bezeichnet ein nachdrückliches, gesteigertes Erheben. Die Wendung bewahrt die verstärkende Kraft des Präfixes ὑπερ-.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die geläufige deutsche doxologische Wendung gibt die zeitlich unbegrenzte Dauer natürlich wieder; die wörtlichere Bildsprache wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: Herr
  rationale: „Den Herrn“ ist als bestimmtes Objekt des Aufrufs im Deutschen natürlich und entspricht der etablierten Wiedergabe von κύριος, ohne eine weitergehende Deutung einzutragen.
- issue: Doxologische Formel εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  alternative: bis in die Zeitalter
  rationale: „In Ewigkeit“ vermittelt die fortdauernde Geltung idiomatisch. Die formal nähere Alternative bleibt in der Fußnote sichtbar, sodass die Bildhaftigkeit des griechischen Plurals nicht verloren geht.
translation_notes:
  register: Poetisch-liturgischer, zugleich moderner und verständlicher Stil. Die direkte Anrede „Licht und Finsternis“ und die parallelen Imperative bewahren den hymnischen Charakter.
