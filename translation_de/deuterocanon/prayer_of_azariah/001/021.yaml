base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/021.yaml
  text: And let all who show evil to your servants be put to shame[a], and let them be disgraced from all their dominion[c][b], and let their strength be broken.
translation:
  language: de
  text: Und alle, die deinen Sklaven[a] Böses antun[b], sollen beschämt werden. In ihrer ganzen Macht sollen sie zuschanden werden[c], und ihre Kraft soll zerschmettert werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Knechten“. Das griechische Wort lautet wörtlich „Sklaven“ und betont ihre Zugehörigkeit zu Gott.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die deinen Sklaven Böses erweisen“. Gemeint sind feindliche Taten gegen sie.'
    reason: lexical_alternative
  - marker: c
    text: Die griechische Wendung ist in ihrer genauen Beziehung schwer zu bestimmen. Sie kann ihre gesamte Herrschaft oder Macht meinen; auch ein Verständnis im Sinn von „weg von ihrer ganzen Herrschaft oder Macht“ ist möglich.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐντραπείησαν
  choice: sollen beschämt werden
  rationale: Der passive Aorist-Optativ drückt im Gebet einen Wunsch aus. Die Formulierung gibt sowohl den Wunschcharakter als auch die von außen kommende Beschämung wieder.
- source_word: οἱ ἐνδεικνύμενοι … κακά
  choice: die … Böses antun
  rationale: Wörtliches „Böses zeigen/erweisen“ wäre im heutigen Deutsch schwerfällig. „Böses antun“ gibt die gegen Gottes Knechte gerichtete feindliche Handlung natürlich wieder, ohne κακά auf bloßen körperlichen Schaden zu verengen.
- source_word: τοῖς δούλοις σου
  choice: deinen Knechten
  rationale: „Knechte“ ist in der Gebetssprache natürlich und würdevoll und kann zugleich Dienst und Zugehörigkeit zu Gott ausdrücken. Die stärkere soziale Grundbedeutung „Sklaven“ wird in der Fußnote offengelegt.
- source_word: καταισχυνθείησαν
  choice: sollen sie zuschanden werden
  rationale: Die eigene Wiedergabe wahrt den rhetorischen Parallelismus mit ἐντραπείησαν, ohne beide Schamverben gleich zu übersetzen, und betont öffentliche Entehrung.
- source_word: ἀπὸ πάσης τῆς δυναστείας
  choice: in all ihrer Macht
  rationale: Die Wendung bezeichnet ihre gesamte Herrschafts- oder Machtstellung; die griechische Präposition ἀπό lässt das genaue Verhältnis offen. Eine Fußnote bewahrt die mögliche Lesart, dass sie ihrer Herrschaft entsetzt werden.
- source_word: ἡ ἰσχὺς αὐτῶν
  choice: ihre Kraft
  rationale: „Kraft“ bezeichnet hier ihre wirksame Stärke und bildet eine verständliche Parallele zu ihrer Machtstellung.
- source_word: συντριβείη
  choice: soll zerschmettert werden
  rationale: Das kräftige Bild von συντρίβω wird mit „zerschmettert“ bewahrt; zugleich setzt „soll“ die Wunschfolge der Optative fort.
theological_decisions:
- issue: Wiedergabe von δοῦλοι für Menschen, die Gott gehören
  choice: deinen Knechten
  alternative: deinen Sklaven
  rationale: Im modernen deutschen Gebetsregister bezeichnet „Knechte“ natürlich Menschen, die Gott dienen und ihm gehören, ohne die Beziehung in ein modernes gesellschaftliches Sklavereiverhältnis umzudeuten. Da δοῦλος jedoch ausdrücklich Unfreiheit und Zugehörigkeit bezeichnen kann, wird „Sklaven“ als wörtlichere Möglichkeit in der Fußnote genannt.
- issue: Verhältnis der Beschämung zur δυναστεία
  choice: In all ihrer Macht sollen sie zuschanden werden
  alternative: Sie sollen ihrer ganzen Herrschaft entsetzt und zuschanden werden
  rationale: Die Präpositionalfügung mit ἀπό ist semantisch schwierig. Der Haupttext versteht die Macht als Bereich beziehungsweise Umstand ihrer Beschämung; die alternative Auffassung als Verlust ihrer Herrschaft bleibt ausdrücklich offen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die dreifache Wunschfolge des griechischen Optativs wird mit „sollen/soll“ erhalten; die beiden Schamverben werden bewusst unterschiedlich wiedergegeben. Kurze Fußnoten legen die stärkere Bedeutung von δοῦλος, die idiomatische Wiedergabe von ἐνδείκνυμι κακά und die Unsicherheit bei ἀπὸ πάσης τῆς δυναστείας offen.
