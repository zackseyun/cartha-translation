base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/041.yaml
  text: Bless the Lord[a], all rain and dew; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, all ihr Regen und Tau[a]; besingt ihn und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder Regen und jeder Tau“. Die griechische Wendung πᾶς ὄμβρος καὶ δρόσος kann kollektiv („all ihr Regen und Tau“) oder distributiv verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ fordert die angesprochenen Schöpfungselemente dazu auf, den Herrn segnend zu rühmen. „Preist“ ist im modernen Deutschen idiomatischer als „Segnet“, bewahrt aber den liturgischen Lobcharakter.
- source_word: πᾶς ὄμβρος καὶ δρόσος
  choice: all ihr Regen und Tau
  rationale: Die Anrede gibt πᾶς kollektiv wieder und behandelt Regen und Tau als Schöpfungselemente. „Regen“ deckt ὄμβρος natürlich ab; die mögliche distributive Auffassung wird in der Fußnote bewahrt.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Die direkte Wiedergabe von κύριος ist in diesem griechischen Kontext „Herr“; der Akkusativ entspricht seiner Funktion als Objekt.
- source_word: ὑμνεῖτε
  choice: besingt
  rationale: Das Verb bezeichnet gesungenes Lob. „Besingt“ erhält diese musikalische Nuance knapp und natürlich.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Die verstärkende Bedeutung des Kompositums wird durch „hoch“ ausgedrückt, ohne die liturgische Zeile unnötig zu beschweren.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. „In Ewigkeit“ passt zum gehobenen liturgischen Register und ist allgemein verständlich.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: der HERR
  rationale: Der griechische Text hat κύριος. „Herr“ gibt die vorliegende Form unmittelbar wieder, ohne durch Kapitälchen eine im Text nicht ausdrücklich sichtbare Identifikation mit dem Gottesnamen typografisch festzulegen.
translation_notes:
  register: Gehobene, aber gegenwärtige liturgische Sprache. Die parallelen Imperative und die personifizierende Anrede der Schöpfung bleiben erhalten.
