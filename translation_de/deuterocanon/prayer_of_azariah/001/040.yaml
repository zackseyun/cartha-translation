base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/040.yaml
  text: Bless the Lord, stars of heaven; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr Sterne des Himmels; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der pluralische Imperativ fordert im hymnischen Zusammenhang zum lobenden Segnen Gottes auf. „Preist“ gibt diese Bedeutung im heutigen Deutschen natürlicher wieder als „Segnet“, ohne den liturgischen Charakter zu verlieren.
- source_word: ἄστρα τοῦ οὐρανοῦ
  choice: ihr Sterne des Himmels
  rationale: ἄστρα bezeichnet konkret die Sterne; der Vokativ wird im Deutschen durch „ihr“ deutlich gemacht. „Des Himmels“ wahrt den gehobenen Ton und den griechischen Singular.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος ist hier die Gottesbezeichnung und wird entsprechend mit „Herr“ wiedergegeben, ohne die typografische Konvention „HERR“ aus einer vorausgesetzten hebräischen Vorlage einzutragen.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Das Verb bezeichnet das Singen eines Hymnus beziehungsweise gesungenes Lob. Die Formulierung bewahrt die musikalische Nuance und klingt zugleich gegenwärtig und verständlich.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alles
  rationale: Das verstärkte Verb bezeichnet ein außerordentliches Erheben oder Verherrlichen. „Über alles erheben“ bringt die Steigerung idiomatisch zum Ausdruck.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste liturgische Wendung drückt unbegrenzte Dauer aus; „in Ewigkeit“ ist im Deutschen würdig, verständlich und refrainfähig.
theological_decisions:
- issue: Wiedergabe von κύριος in der an Gott gerichteten deuterokanonischen Hymne
  choice: Herr
  alternative: HERR; Gebieter
  rationale: Der griechische Text bietet κύριος. „Herr“ bewahrt die ausdrückliche Gottesbezeichnung, während „HERR“ eine Konvention für den hebräischen Gottesnamen voraussetzen würde, die dieser griechische Wortlaut nicht eigens markiert.
translation_notes:
  register: Moderne, würdige Hymnensprache mit direkter Anrede. Der parallele Aufbau der beiden Aufforderungen und die wiederkehrende Schlussformel bleiben erhalten; keine Fußnoten erforderlich.
