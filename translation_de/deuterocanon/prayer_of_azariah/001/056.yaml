base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/056.yaml
  text: Bless the Lord[a], sea creatures and all that move in the waters; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, ihr großen Meerestiere[a] und alles, was sich in den Wassern regt; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meerungeheuer“, „Wale“. Das griechische Wort bezeichnet große Lebewesen des Meeres und kann je nach Zusammenhang auch Seeungeheuer meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der imperativische Aufruf bezeichnet hier das lobende Segnen Gottes. „Preist“ ist im heutigen Deutschen natürlich und passt zur hymnischen Anrede nichtmenschlicher Geschöpfe.
- source_word: κήτη
  choice: großen Meerestiere
  rationale: κήτη bezeichnet große Tiere oder Ungeheuer des Meeres. „Große Meerestiere“ wahrt die Größenkomponente, ohne die Bedeutung auf Wale einzuengen oder mythologisch festzulegen.
- source_word: πάντα τὰ κινούμενα
  choice: alles, was sich … regt
  rationale: Die substantivierte Partizipialfügung ist umfassend. „Alles, was sich … regt“ bildet die Bewegung ab und klingt in einem poetisch-liturgischen Text würdig.
- source_word: ἐν τοῖς ὕδασι
  choice: in den Wassern
  rationale: Der Plural des Griechischen wird bewahrt; „die Wasser“ ist ein verständlicher biblisch-poetischer Ausdruck für den Bereich des Wassers.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος dient in diesem jüdischen Hymnus als Gottesbezeichnung und wird quellennah mit „der Herr“ wiedergegeben.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Das Verb bezeichnet ausdrücklich das Besingen beziehungsweise Loben in einem Hymnus. Die Formulierung erhält den musikalischen Sinn und macht mit „ihm“ den griechischen Objektbezug deutlich.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alles
  rationale: Das präfigierte Verb drückt eine starke Steigerung des Erhebens aus. „Über alles erheben“ vermittelt diese intensive Bedeutung in natürlichem, liturgischem Deutsch.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet hier unbegrenzte Dauer. „In Ewigkeit“ ist eine klare und würdige deutsche Wiedergabe des Refrains.
theological_decisions:
- issue: Wiedergabe von κύριος als Gottesbezeichnung
  choice: der Herr
  alternative: der HERR
  rationale: Die vorliegende griechische Quelle hat κύριος und stellt nicht unmittelbar das hebräische Tetragramm dar. Daher wird die normale Gottesbezeichnung „der Herr“ verwendet, ohne durch Kapitälchen eine nicht direkt belegte Rückübersetzung festzuschreiben.
- issue: Personifizierter Lobaufruf an Wassertiere
  choice: direkte Anrede im Plural
  alternative: beschreibende Aussage über ihr Gotteslob
  rationale: Die pluralischen Imperative richten sich unmittelbar an die Geschöpfe. Diese poetische Personifikation wird bewahrt und nicht als bloße Feststellung umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit hymnischem Klang. Die parallelen Imperative und der poetische Plural „Wasser“ bleiben erhalten; veraltete Verbformen werden vermieden.
