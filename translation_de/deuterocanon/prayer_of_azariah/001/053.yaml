base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/053.yaml
  text: Bless the Lord, all things that grow on the earth; sing hymns and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, alles, was auf der Erde wächst; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ Plural fordert die Schöpfung zum Lob des Herrn auf. Im Deutschen ist „Preist“ bei nicht menschlichen Schöpfungswerken natürlicher als „Segnet“, ohne den liturgischen Charakter zu verlieren.
- source_word: πάντα τὰ φυόμενα
  choice: alles, was wächst
  rationale: Das substantivierte Partizip bezeichnet umfassend alles Wachsende bzw. Hervorsprießende und wird nicht unnötig auf „Pflanzen“ oder „Vegetation“ verengt.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: ἐπί mit Genitiv hat hier den örtlichen Sinn „auf“.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Die bestimmte Form des griechischen κύριος wird als „den Herrn“ wiedergegeben; damit wird keine über den griechischen Wortlaut hinausgehende Gottesnamensform eingeführt.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Die Wendung wahrt den musikalischen Gehalt des Verbs und klingt im modernen Deutschen natürlicher als „hymniert“ oder „singt Hymnen“.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn hoch
  rationale: Das verstärkte Verb wird mit „hoch erheben“ wiedergegeben, wodurch seine intensive Bedeutung erkennbar bleibt.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bezieht sich auf den Herrn. Bei „singt ihm Lob“ wird der Bezug zusätzlich idiomatisch als Dativ aufgenommen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste liturgische Wendung bezeichnet unbegrenzte Dauer; „in Ewigkeit“ ist würdig, geläufig und in diesem Refrain idiomatisch.
theological_decisions:
- issue: Wiedergabe von κύριος im deuterokanonischen Lobgesang
  choice: den Herrn
  alternative: den HERRN
  rationale: Der griechische Text bietet κύριος mit Artikel, aber nicht das Tetragramm. „Den Herrn“ bildet den vorhandenen Text ab, ohne eine nicht ausdrücklich bezeugte Gottesnamensform einzutragen.
- issue: Bedeutung von εὐλογεῖτε bei der angesprochenen Schöpfung
  choice: Preist
  alternative: Segnet
  rationale: Obwohl εὐλογέω wörtlich auch „segnen“ bedeutet, ist hier das lobende Preisen Gottes gemeint. „Preist“ ist bei allem, was wächst, im heutigen Deutsch klarer und bewahrt den Aufruf zum Gotteslob.
translation_notes:
  register: Poetisch-liturgischer, würdiger und zugleich allgemein verständlicher Sprachstil. Die parallelen Imperative und der refrainartige Schluss bleiben erhalten; das Semikolon bildet die griechische Gliederung ab.
