translation:
  language: de
  text: Preist den Herrn, ihr Diener[a]; singt ihm Lob und erhebt ihn über alle Maßen in Ewigkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Knechte“ oder „Sklaven“. Das griechische Wort kann allgemein Dienende oder Menschen in gebundener, unfreier Stellung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „für die Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der pluralische Imperativ fordert im gottesdienstlichen Zusammenhang dazu auf, den Herrn lobend zu rühmen. „Preist“ gibt diese Bedeutung im Deutschen natürlicher wieder als das missverständliche „segnet“.
- source_word: δοῦλοι
  choice: Diener
  rationale: Das Wort kann sowohl Diener als auch Menschen in unfreier, gebundener Stellung bezeichnen. In dieser hymnischen Anrede ist „Diener“ natürlich und würdig, während eine Fußnote die stärkeren Alternativen offenhält.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος ist hier der göttliche Titel und wird entsprechend als „Herr“ wiedergegeben.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Das Verb bezeichnet ausdrücklich das Singen eines Hymnus oder Lobgesangs; die Formulierung bewahrt den musikalischen Sinn.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alle Maßen
  rationale: Das zusammengesetzte Verb verstärkt das Erheben beziehungsweise Rühmen. „Über alle Maßen“ bringt diese Intensivierung in gehobenem, verständlichem Deutsch zum Ausdruck.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die wörtlich auf die Zeitalter bezogene Wendung ist eine feste Ausdrucksweise für unbegrenzte Dauer; „in Ewigkeit“ wahrt zugleich den liturgischen Ton.
theological_decisions:
- issue: Wiedergabe von δοῦλοι als Anrede der Gottesverehrer
  choice: Diener
  alternative: Knechte; Sklaven
  rationale: Der Kontext ist ein hymnischer Aufruf an Menschen, die dem Herrn dienen und zu ihm gehören. „Diener“ vermeidet eine unnötige Festlegung auf einen rechtlichen Sklavenstatus, ohne das Verhältnis der Unterordnung aufzugeben; die semantisch stärkeren Möglichkeiten werden in der Fußnote genannt.
translation_notes:
  register: Dignischer, hymnischer Imperativstil in modernem Standarddeutsch. Die parallelen Aufforderungen und die Intensivierung des griechischen Textes bleiben erhalten; die Formulierung ist für öffentliches Lesen und Singen geeignet.
