  text: Bless the Lord, frost and cold; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, Frost und Kälte; singt ihm Lob und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ Plural fordert die angesprochenen Schöpfungskräfte zum Lob Gottes auf. „Preist“ gibt im Deutschen die doxologische Bedeutung natürlich wieder; „segnet“ wäre bei unbelebten Naturerscheinungen missverständlich.
- source_word: πάγος
  choice: Reif
  rationale: πάγος kann Eis oder Frost bezeichnen. In der Verbindung mit ψῦχος passt die atmosphärische Bedeutung „Reif“ gut und vermeidet eine begriffliche Doppelung mit „Kälte“.
- source_word: ψῦχος
  choice: Kälte
  rationale: Das Substantiv bezeichnet Kälte oder Frost; „Kälte“ ist die direkte und idiomatische Wiedergabe im poetischen Wortpaar.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος wird in diesem griechischen deuterokanonischen Lobgesang sachgerecht und traditionsnah mit „Herr“ wiedergegeben.
- source_word: ὑμνεῖτε
  choice: singt ihm Lob
  rationale: Das Verb bezeichnet ausdrücklich das Singen eines Hymnus oder Lobgesangs. „Singt ihm Lob“ bewahrt diese musikalische Nuance in natürlichem Deutsch.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alles
  rationale: Das zusammengesetzte Verb verstärkt ὑψόω. „Über alles erheben“ bringt die Steigerung klar und würdig zum Ausdruck.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet im Refrain die unbegrenzte Dauer des Lobes; „in Ewigkeit“ entspricht dem liturgischen Register und ist allgemein verständlich.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen deuterokanonischen Hymnus
  choice: den Herrn
  alternative: den HERRN
  rationale: Der griechische Text bietet κύριον und nicht unmittelbar den hebräischen Gottesnamen. „Herr“ bewahrt die Aussage des vorliegenden Textes, ohne eine nicht ausdrücklich markierte Rückübersetzung einzuführen.
translation_notes:
  register: Moderner, würdiger und liturgisch-poetischer Standardstil. Die parallelen Imperative und der wiederkehrende hymnische Rhythmus bleiben erhalten; es sind keine Fußnoten erforderlich.
