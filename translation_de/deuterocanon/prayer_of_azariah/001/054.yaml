  text: Preist den Herrn, ihr Regenschauer und Quellen; besingt ihn und erhebt ihn hoch in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der pluralische Imperativ fordert die Schöpfung zum ehrenden Lob Gottes auf. „Preist“ gibt den doxologischen Sinn im Deutschen natürlicher wieder als das missverständliche „segnet“ und eignet sich für den wiederkehrenden hymnischen Refrain.
- source_word: ὄμβροι
  choice: Regenschauer
  rationale: Das griechische Pluralwort bezeichnet Regenfälle oder Schauer. „Regenschauer“ bewahrt den Plural und lässt sich als angeredete Erscheinung der Schöpfung natürlich verstehen.
- source_word: πηγαί
  choice: Quellen
  rationale: Gemeint sind natürliche Wasserquellen; „Quellen“ ist die direkte und idiomatische deutsche Entsprechung.
- source_word: κύριον
  choice: den Herrn
  rationale: Der Akkusativ bezeichnet den Gegenstand des Lobpreises. „Den Herrn“ wahrt die etablierte Gottesbezeichnung des griechischen Hymnus.
- source_word: ὑμνεῖτε
  choice: besingt
  rationale: Das Verb bezeichnet das Singen eines Hymnus oder Lobgesangs. „Besingt“ erhält den musikalisch-doxologischen Gehalt und kann das nachfolgende αὐτόν unmittelbar als Objekt aufnehmen.
- source_word: ὑπερυψοῦτε
  choice: erhebt … über alles
  rationale: Das intensivierte Verb bedeutet, jemanden in höchstem Maß zu erhöhen. „Über alles erheben“ bringt die Steigerung klar und in würdigem Deutsch zum Ausdruck.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. „In Ewigkeit“ entspricht dem liturgischen Register und ist zugleich allgemein verständlich.
theological_decisions:
- issue: Wiedergabe von κύριος in einem deuterokanonischen Hymnus an den Gott Israels
  choice: den Herrn
  alternative: Herrn
  rationale: Der bestimmte Artikel gehört zur griechischen Formulierung und wird im Deutschen natürlich wiedergegeben. Die Übersetzung wahrt die Gottesbezeichnung, ohne eine typografische Gleichsetzung mit dem hebräischen Tetragramm vorauszusetzen.
translation_notes:
  register: Würdiger, hymnischer und zugleich moderner Sprachton. Die direkte Anrede der Naturerscheinungen bleibt erhalten; das Semikolon gliedert Aufruf und wiederkehrende Lobformel.
