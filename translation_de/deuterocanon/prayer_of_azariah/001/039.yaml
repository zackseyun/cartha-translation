base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/039.yaml
  text: Bless the Lord[a], sun and moon; sing praise to him and highly exalt him forever.
translation:
  language: de
  text: Preist den Herrn, Sonne und Mond; besingt ihn und erhebt ihn hoch in Ewigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »für die Zeitalter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Imperativ Plural fordert Sonne und Mond zum preisenden Segnen Gottes auf. »Preist« gibt diese Bedeutung im Deutschen natürlich und würdig wieder.
- source_word: ἥλιος καὶ σελήνη
  choice: Sonne und Mond
  rationale: Die Himmelskörper werden unmittelbar angeredet; die artikellose Form entspricht im Deutschen einer natürlichen poetischen Anrede.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος bezeichnet in diesem jüdischen Hymnus Gott. »Herr« bewahrt den etablierten theologischen Sprachgebrauch, ohne eine im griechischen Text nicht markierte Schreibkonvention einzuführen.
- source_word: ὑμνεῖτε
  choice: besingt
  rationale: ὑμνέω bezeichnet gesungenes oder hymnenartiges Lob. »Besingt« erhält diesen musikalisch-poetischen Sinn knapp und natürlich.
- source_word: ὑπερυψοῦτε
  choice: erhebt ihn über alles
  rationale: Das verstärkte Verb bezeichnet ein außerordentlich hohes Erheben. Die Formulierung bewahrt die Intensität und lässt zugleich den bildhaften Ausdruck des Griechischen stehen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die idiomatische Wendung bezeichnet unbegrenzte Dauer. »In Ewigkeit« ist im Deutschen klar, feierlich und für den wiederkehrenden liturgischen Kehrvers geeignet.
theological_decisions:
- issue: Wiedergabe von κύριος im deuterokanonischen Hymnus
  choice: Herr
  alternative: HERR; Gebieter
  rationale: »Herr« bezeichnet hier Israels Gott und folgt dem griechischen Wortlaut, ohne die nicht ausdrücklich markierte Wiedergabe eines hebräischen Gottesnamens durch Kapitälchen vorauszusetzen.
- issue: Zeitliche Tragweite von εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  alternative: für die Zeitalter
  rationale: Die idiomatische Wiedergabe drückt die fortdauernde, unbegrenzte Verherrlichung aus; die formalere Mehrzahl bleibt in der Fußnote sichtbar.
translation_notes:
  register: Poetisch-liturgischer, zugleich gegenwartsnaher Standarddeutsch-Stil. Die parallelen Imperative und die direkte Anrede der Himmelskörper bleiben erhalten; die Formulierung eignet sich für den wiederkehrenden Kehrvers.
