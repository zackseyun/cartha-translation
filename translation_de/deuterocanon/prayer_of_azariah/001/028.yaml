  source_fidelity: 'Der deutsche Text gibt alle Bestandteile des griechischen Satzes vollständig und in der richtigen Reihenfolge wieder: den zeitlichen Anschluss (Τότε), die knappe Bezeichnung »die drei«, das Bild »wie aus einem Mund«, die drei voneinander unterschiedenen Verben ὕμνουν, ἐδόξαζον und εὐλόγουν, den Ort im Feuerofen sowie die Einleitung der folgenden Rede. Das Präteritum ist im deutschen erzählenden Kontext eine angemessene Wiedergabe der griechischen Imperfekte.'
  naturalness: »Da sangen die drei wie aus einem Mund Loblieder, verherrlichten und segneten Gott im Feuerofen und sprachen« ist flüssiges, modernes Standarddeutsch in einem angemessen würdigen biblisch-erzählenden Register. Die leicht gehobene Formulierung »Gott segnen« ist hier idiomatisch genug und wahrt die sprachliche Eigenart des Ausgangstextes.
  terminology: Die Begriffe sind treffend gewählt. »Feuerofen« passt zu κάμινος im Daniel-Zusammenhang. »Verherrlichten« und »segneten« erhalten die Unterscheidung der griechischen Lobpreisverben. Die Fußnote erläutert das Bild sachgerecht, ohne eine strittige Deutung einzutragen.
