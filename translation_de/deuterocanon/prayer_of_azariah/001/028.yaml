base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/028.yaml
  text: 'Then the three[a], as with one mouth, were singing hymns and glorifying and blessing God in the furnace, saying:'
translation:
  language: de
  text: 'Da sangen die drei wie aus einem Mund[a] Loblieder, verherrlichten und segneten Gott im Feuerofen und sprachen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie mit einer Stimme«. Wörtlich heißt es im Griechischen: »wie aus einem Mund«; damit wird die völlige Einmütigkeit der drei bei ihrem Lobpreis betont.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Leitet den folgenden Vorgang als natürliche zeitliche Fortsetzung der Erzählung ein.
- source_word: οἱ τρεῖς
  choice: die drei
  rationale: Bewahrt die knappe Form des Griechischen, ohne aus dem Kontext eine nicht ausdrücklich genannte Bezeichnung wie »Männer« oder »Jünglinge« einzufügen.
- source_word: ὡς ἐξ ἑνὸς στόματος
  choice: wie aus einem Mund
  rationale: Erhält das anschauliche griechische Bild und bringt zugleich die vollkommene Einmütigkeit ihres Lobgesangs zum Ausdruck.
- source_word: ὕμνουν
  choice: sangen … Loblieder
  rationale: Gibt den Bezug auf hymnischen Gesang wieder; die fortdauernde Handlung des griechischen Imperfekts ergibt sich im Deutschen aus dem erzählerischen Zusammenhang.
- source_word: ἐδόξαζον
  choice: verherrlichten
  rationale: Bewahrt die besondere Bedeutung des Verbs und unterscheidet es von den benachbarten Ausdrücken des Lobens und Segnens.
- source_word: εὐλόγουν
  choice: segneten
  rationale: Gibt das eigenständige griechische Verb formal wieder, statt alle drei Verben zu einem allgemeinen »lobten« zusammenzuziehen.
- source_word: τὸν θεὸν
  choice: Gott
  rationale: Im Deutschen steht »Gott« in dieser Verwendung gewöhnlich ohne Artikel.
- source_word: ἐν τῇ καμίνῳ
  choice: im Feuerofen
  rationale: »Feuerofen« ist in diesem Erzählzusammenhang eindeutig und idiomatisch; es macht die im Kontext vorausgesetzte Hitze ausdrücklich.
- source_word: λέγοντες
  choice: und sprachen
  rationale: Leitet in würdigem, natürlichem Erzählstil die unmittelbar folgende wörtliche Rede ein.
