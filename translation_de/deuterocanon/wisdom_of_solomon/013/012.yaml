  text: But after using up the scraps from his work to prepare food, he was filled.
translation:
  language: de
  text: Die Reststücke[a] seiner Arbeit aber verbrauchte er, um Essen zuzubereiten, und wurde satt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Abfallstücke“, „Abschnitte“ oder „Überreste seiner Arbeit“. Das griechische Wort bezeichnet Stücke, die bei der Arbeit abfallen oder weggeworfen werden.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „wurde gefüllt“; gemeint ist wahrscheinlich, dass er mit der zubereiteten Speise seinen Hunger stillte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβλήματα
  choice: Reststücke
  rationale: Das Wort bezeichnet weggeworfene oder bei der Arbeit abfallende Stücke. „Reststücke“ passt zum handwerklichen Zusammenhang und vermeidet die zu starke Wertung von „Müll“.
- source_word: ἐργασίας
  choice: Arbeit
  rationale: Der weit gefasste Ausdruck bezeichnet Arbeit oder Tätigkeit; der Zusammenhang macht deutlich, dass hier die Arbeit eines Handwerkers gemeint ist.
- source_word: εἰς ἑτοιμασίαν τροφῆς
  choice: um Essen zuzubereiten
  rationale: Die Zweckangabe wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: ἀναλώσας
  choice: verbrauchte
  rationale: Das Partizip bezeichnet das Aufbrauchen beziehungsweise Verzehren der Reststücke, hier offenbar als Brennmaterial für die Essenszubereitung.
- source_word: ἐνεπλήσθη
  choice: wurde satt
  rationale: Wörtlich bedeutet das Verb „wurde gefüllt“. Im Zusammenhang mit der Speise bezeichnet es idiomatisch die Stillung des Hungers.
- source_word: τὰ δὲ
  choice: aber
  rationale: δέ markiert hier den Übergang beziehungsweise Gegensatz zur vorherigen Verwendung des Holzes.
