  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/019.yaml
  text: But concerning provision and work and success of his hands[b][a], he asks strength from that thing most inactive with his hands.
translation:
  language: de
  text: Doch wenn es um Lebensunterhalt, Arbeit und das Gelingen seiner Hände[a] geht, bittet er mit seinen Händen das völlig Untätige um Tatkraft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Gelingen der Hände“; gemeint ist Erfolg bei dem, was seine Hände tun oder herstellen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wirksamkeit“. Das seltene griechische Wort bezeichnet tätige Kraft und steht in scharfem Gegensatz zu „völlig untätig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορισμοῦ
  choice: Lebensunterhalt
  rationale: Das Wort bezeichnet das Beschaffen von Mitteln beziehungsweise Erwerb. Im Zusammenhang mit Arbeit und praktischem Gelingen gibt „Lebensunterhalt“ den Sinn natürlich wieder, ohne ihn bloß auf Gewinn zu verengen.
- source_word: ἐργασίας
  choice: Arbeit
  rationale: Der weit gefasste Begriff für Tätigkeit oder Erwerbsarbeit wird im modernen Deutsch am natürlichsten mit „Arbeit“ wiedergegeben.
- source_word: χειρῶν ἐπιτυχίας
  choice: das Gelingen seiner Hände
  rationale: 'Die annähernd wörtliche Formulierung bewahrt das Bild der Hände und die Ironie: Der Mensch erbittet für sein eigenes Tun Erfolg von einem handlungsunfähigen Gegenstand.'
- source_word: τὸ ἀδρανέστατον
  choice: das völlig Untätige
  rationale: Der substantivierte neutrale Superlativ bezeichnet das Götzenbild als einen Gegenstand, der in höchstem Maß untätig und wirkungslos ist. „Völlig“ gibt die superlativische Zuspitzung idiomatisch wieder.
- source_word: ταῖς χερσὶν
  choice: mit seinen Händen
  rationale: Die Dativphrase wird am ehesten auf die Hände des Bittenden bezogen. Die Wiederholung von „Händen“ ist im Griechischen angelegt und verstärkt die Ironie.
- source_word: εὐδράνειαν
  choice: Tatkraft
  rationale: Das seltene Substantiv bezeichnet wirksame, kräftige Tätigkeit und bildet einen pointierten Gegensatz zu ἀδρανέστατον. „Tatkraft“ bewahrt diesen Kontrast im Deutschen.
- source_word: αἰτεῖται
  choice: bittet … um
  rationale: Die Wendung „jemanden beziehungsweise etwas um etwas bitten“ gibt die Bedeutung des Verbs in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bezug der substantivierten neutralen Beschreibung τὸ ἀδρανέστατον
  choice: Sie bezeichnet das Götzenbild selbst als völlig untätigen Gegenstand.
  alternative: Allgemeiner Bezug auf eine unwirksame dargestellte Gottheit, ohne die materielle Beschaffenheit des Bildes hervorzuheben.
  rationale: Der unmittelbare Zusammenhang handelt von angefertigten Götzenbildern. Das Neutrum und der scharfe Gegensatz zwischen erbetener Tatkraft und völliger Untätigkeit richten die Aussage auf das Bild als Gegenstand, ohne weitergehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Händen“ und der Gegensatz „völlig Untätige“/„Tatkraft“ bleiben bewusst erhalten, da sie die Ironie des griechischen Satzes tragen.
