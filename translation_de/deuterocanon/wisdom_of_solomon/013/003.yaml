base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/003.yaml
  text: If, then, delighting in their beauty, they supposed them to be gods, let them know how much better than these is their Master; for the creator of beauty created them.
translation:
  language: de
  text: Wenn sie nun, von ihrer Schönheit entzückt, sie für Götter hielten, sollen sie erkennen, wie viel vortrefflicher als diese ihr Herr ist; denn der Schöpfer der Schönheit hat sie erschaffen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ καλλονῇ
  choice: von ihrer Schönheit
  rationale: Gibt den Dativ als Ursache des Entzückens natürlich wieder; das Possessivpronomen bezieht die Schönheit eindeutig auf die zuvor genannten Dinge.
- source_word: τερπόμενοι
  choice: entzückt
  rationale: Drückt das lustvolle Gefallen und die Faszination des Partizips knapp und würdig aus.
- source_word: θεοὺς ὑπελάμβανον
  choice: sie für Götter hielten
  rationale: Entspricht dem urteilenden Sinn von ὑπολαμβάνω und bewahrt den Plural θεούς.
- source_word: ὁ δεσπότης
  choice: ihr Herr
  rationale: Bewahrt den Herrschaftsaspekt von δεσπότης und den aus dem Zusammenhang erschlossenen Bezug auf die geschaffenen Dinge.
- source_word: βελτίων
  choice: vortrefflicher
  rationale: Gibt die qualitative Überlegenheit wieder; „besser“ wäre möglich, klingt hier aber weniger würdig und weniger auf die Vollkommenheit des Schöpfers bezogen.
- source_word: ὁ τοῦ κάλλους γενεσιούργης
  choice: der Schöpfer der Schönheit
  rationale: Gibt die seltene Bezeichnung γενεσιούργης als schöpferischen Urheber wieder und wahrt den Bezug auf κάλλος.
- source_word: ἔκτισεν αὐτά
  choice: hat sie erschaffen
  rationale: κτίζω bezeichnet das Erschaffen; das deutsche Pronomen nimmt die betrachteten geschaffenen Dinge auf.
theological_decisions:
- issue: Verhältnis zwischen der Schönheit der Schöpfung und der Überlegenheit ihres Urhebers
  choice: „wie viel vortrefflicher als diese ihr Herr ist“
  alternative: „um wie viel besser ihr Gebieter ist als sie“
  rationale: Die Formulierung bewahrt den argumentativen Schluss vom Geschaffenen auf den Schöpfer, ohne die Art seiner Überlegenheit näher zu bestimmen oder zusätzliche Lehre einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Der Satzbau bleibt nahe an der griechischen Wenn-dann-Begründungsstruktur; echte Mehrdeutigkeit wird nicht durch konfessionelle Zusätze aufgelöst.
