base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/001.yaml
  text: For all men are by nature futile, in whom there was ignorance of God; and from the good things that are seen they were not able to know the One who is, nor by paying attention to his works did they recognize the craftsman.
translation:
  language: de
  text: 'Denn alle Menschen waren von Natur aus nichtig: Sie hatten keine Erkenntnis Gottes. Aus den sichtbaren Gütern vermochten sie nicht, den zu erkennen, der ist; auch erkannten sie nicht, indem sie auf die Werke achteten, den Werkmeister.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μάταιοι
  choice: nichtig
  rationale: Gibt die Bedeutung von leer, vergeblich oder ohne rechten Erkenntniswert wieder, ohne sie einseitig als bloße Dummheit zu deuten.
- source_word: φύσει
  choice: von Natur aus
  rationale: Entspricht der adverbialen Bestimmung eng und bewahrt die Spannung der Aussage.
- source_word: θεοῦ ἀγνωσία
  choice: Unkenntnis Gottes
  rationale: 'Bewahrt die mögliche objektive Beziehung: fehlende Kenntnis von Gott.'
- source_word: τὸν ὄντα
  choice: den zu erkennen, der ist
  rationale: Gibt die substantivierte Partizipialform wörtlich und theologisch offen wieder.
- source_word: τεχνίτην
  choice: Schöpfer
  rationale: Im Zusammenhang bezeichnet das Wort den kunstfertigen Urheber der sichtbaren Werke; „Schöpfer“ ist im Deutschen natürlich, während eine Fußnote die handwerkliche Nuance sichert.
theological_decisions:
- issue: Bezeichnung Gottes als τὸν ὄντα
  choice: der ist
  alternative: der Seiende
  rationale: „Der ist“ bewahrt die existentielle und mögliche an Exodus erinnernde Formulierung, ohne sie philosophisch durch „der Seiende“ festzulegen.
- issue: τεχνίτην als Bezeichnung des Urhebers
  choice: Schöpfer
  alternative: Werkmeister / Künstler
  rationale: „Schöpfer“ erschließt im Kontext den gemeinten Urheber der Werke, während die Fußnote die konkrete Bedeutung „Werkmeister“ dokumentiert.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz wurde zur besseren Verständlichkeit geteilt; die argumentative Verknüpfung und die Spannung zwischen sichtbaren Gütern, Werken und ihrem Urheber bleiben erhalten.
