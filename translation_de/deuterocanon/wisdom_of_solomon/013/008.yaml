  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν δʼ
  choice: Doch auch
  rationale: πάλιν nimmt den Gedankengang erneut beziehungsweise zusätzlich auf; δέ gibt ihm eine leicht adversative Fortführung. Im Deutschen bringt „Doch auch“ diese Funktion idiomatisch zum Ausdruck, ohne ein schwerfälliges „wiederum“ zu erzwingen.
- source_word: οὐδʼ αὐτοὶ
  choice: auch sie … nicht
  rationale: 'οὐδέ zusammen mit dem intensiven αὐτοί hebt die betreffende Gruppe hervor: Selbst beziehungsweise auch sie bilden keine Ausnahme. Die deutsche Wortstellung bewahrt diese Betonung natürlich.'
- source_word: συγγνωστοί
  choice: zu entschuldigen
  rationale: Das Adjektiv bezeichnet Personen, denen Nachsicht, Entschuldigung oder Verzeihung zugestanden werden kann. „Zu entschuldigen“ passt zum Kontext moralischer Verantwortlichkeit und vermeidet eine unnötige Festlegung auf die stärker beziehungsbezogene Sprache des Vergebens.
theological_decisions:
- issue: Grad der Schuldhaftigkeit in συγγνωστοί
  choice: Die Genannten sind „nicht zu entschuldigen“.
  alternative: „nicht verzeihlich“ oder „nicht der Nachsicht würdig“
  rationale: Die Formulierung wahrt die Aussage über Verantwortlichkeit, ohne daraus eine umfassende Lehre über die Möglichkeit göttlicher Vergebung abzuleiten.
translation_notes:
  register: Kurzer, würdevoller und moderner Standardsatz. Das Semikolon folgt dem fortlaufenden Satzbau des Kontextes. Keine Fußnote nötig, da „zu entschuldigen“ die maßgebliche Bedeutung klar und ohne wesentlichen Bedeutungsverlust wiedergibt.
