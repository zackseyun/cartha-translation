  source_fidelity: 'Die Wiedergabe der zentralen Begriffe ist insgesamt quellennah: „das Leblose“ und „das Schwache“ bewahren die substantivierten, abwertenden Neutra des Griechischen, ohne „Götze“ ergänzend in den Haupttext einzutragen. „Wegen“ ist jedoch bei den Gebetsanliegen missverständlich, da es im Deutschen vor allem einen Grund („aufgrund von“) bezeichnet, während περὶ hier die Gegenstände des Gebets einführt. „Um“ gibt die erbetenen Anliegen klar und natürlich wieder.'
