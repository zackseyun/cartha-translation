lexical_decisions:
- source_word: κτημάτων
  choice: Besitz
  rationale: Das Wort bezeichnet Eigentum oder Besitztümer allgemein. Der deutsche Kollektivbegriff „Besitz“ ist natürlich und engt die Bedeutung nicht auf Grundbesitz ein.
- source_word: γάμων
  choice: Ehe
  rationale: Der griechische Plural kann den Bereich von Ehe- oder Heiratsangelegenheiten bezeichnen. Im Deutschen gibt „Ehe“ den Zusammenhang natürlich wieder; die Formfrage wird in einer Fußnote offengelegt.
- source_word: τέκνων
  choice: Kinder
  rationale: Direkte und allgemein verständliche Wiedergabe von τέκνα.
- source_word: προσευχόμενος
  choice: betet
  rationale: Das Partizip wird in den konditional-temporalen Satzbau integriert und bezeichnet das Beten um die genannten Anliegen.
- source_word: οὐκ αἰσχύνεται
  choice: schämt er sich nicht
  rationale: Bewahrt den moralisch-polemischen Ton des griechischen Ausdrucks.
- source_word: τῷ ἀψύχῳ
  choice: das Leblose
  rationale: Die substantivierte neutrale Form wahrt die indirekte, verächtliche Bezeichnung des Götzen als etwas ohne Leben.
- source_word: προσλαλῶν
  choice: anzureden
  rationale: Gibt das Sprechen zu etwas im Gebetszusammenhang präzise wieder, ohne zusätzliche Deutung einzutragen.
- source_word: ὑγείας
  choice: Gesundheit
  rationale: Direkte Wiedergabe; der Zusammenhang kontrastiert die erbetene Gesundheit mit der Schwäche des angerufenen Gegenstands.
- source_word: τὸ ἀσθενές
  choice: das Schwache
  rationale: Bewahrt die substantivierte neutrale und polemische Ausdrucksweise, ohne „Götze“ ausdrücklich zu ergänzen.
- source_word: ἐπικαλεῖται
  choice: ruft er … an
  rationale: Natürliche deutsche Wiedergabe für das Anrufen in einem religiösen beziehungsweise bittenden Kontext.
theological_decisions:
- issue: Götzenpolemik in ἀψύχῳ und τὸ ἀσθενές
  choice: „das Leblose“ und „das Schwache“
  alternative: „den leblosen Götzen“ und „das Machtlose“
  rationale: Der griechische Text nennt den Götzen hier nicht ausdrücklich, sondern kennzeichnet ihn verächtlich als leblos und schwach. Diese Rhetorik bleibt erhalten, ohne ein erklärendes Substantiv in den Haupttext einzufügen.
- issue: Plural γάμων
  choice: „Ehe“ im Haupttext mit Fußnote zum griechischen Plural
  alternative: „Ehen“ oder „Heiratsangelegenheiten“
  rationale: Der formale Plural bleibt als echte sprachliche Besonderheit sichtbar, während „seine Ehe“ im Deutschen den wahrscheinlich gemeinten Lebensbereich natürlicher ausdrückt. Die Fußnote bewahrt die Ambiguität.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der griechischen Parallelstruktur, wurde aber für einen natürlichen deutschen Lesefluss leicht gegliedert. Die polemischen substantivierten Adjektive bleiben erhalten.
