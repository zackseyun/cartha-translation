    rationale: Im Griechischen steht ein Substantiv für ein kunstvoll hervorgebrachtes Werk. Die deutsche Partizipialgruppe wirkt zwischen „Gold und Silber“ und „Abbilder von Tieren“ elliptisch und kann fälschlich nur Gold und Silber näher bestimmen. „ein kunstvoll gearbeitetes Werk“ erhält den substantivischen Charakter und die Struktur der Liste.
