  source_fidelity: Die Übersetzung gibt die Verurteilung (Ταλαιπώροι), die bewusst knappe und mehrdeutige Wendung ἐν νεκροῖς sowie die Aufzählung menschlich gefertigter Gegenstände insgesamt treffend wieder. „Unter den Toten“ wahrt die Mehrdeutigkeit, auch wenn es im Deutschen zunächst an verstorbene Personen denken lässt; die Fußnote erläutert dies angemessen.
  naturalness: 'Der Satz ist überwiegend modernes, würdiges Standarddeutsch. In der Aufzählung ist jedoch „Gold und Silber, kunstvoll gefertigt, Abbilder von Tieren“ syntaktisch und semantisch uneinheitlich: Das partizipiale „kunstvoll gefertigt“ kann sich nur schwer als eigenständiges Glied neben den Substantiven verstehen lassen. Ein substantivisches Glied bildet τέχνης ἐμμελέτημα klarer ab.'
  terminology: „Götter“, „Werke menschlicher Hände“, „Abbilder“ und „nutzloser Stein“ sind treffend und registergerecht. „Werke menschlicher Hände“ ist gegenüber „Werke von Menschenhänden“ die idiomatischere deutsche Form und bewahrt den generischen Sinn von ἀνθρώπων. Die Fußnoten bewahren die textliche Offenheit und legen keine konfessionelle Deutung fest.
  issues:
