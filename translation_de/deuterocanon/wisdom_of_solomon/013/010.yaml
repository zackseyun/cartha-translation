base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/010.yaml
  text: But miserable are they[a], and their hopes are among the dead, who called gods the works of human hands—gold and silver, the product of skill, and images of animals, or a useless stone[b], the work of an ancient hand.
translation:
  language: de
  text: 'Doch elend sind sie, und ihre Hoffnungen sind unter den Toten[a]: Sie haben Werke menschlicher Hände Götter genannt – Gold und Silber, ein kunstvoll gearbeitetes Werk, Abbilder von Tieren oder einen nutzlosen Stein, das Werk einer Hand aus alter Zeit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ihre Hoffnungen ruhen auf toten Dingen“ oder „ihre Hoffnungen sind bei den Toten“. Die knappe griechische Wendung kann sowohl leblose Götzen als auch die Vergeblichkeit einer dem Tod verbundenen Hoffnung anklingen lassen.'
    reason: alternative_reading
  - marker: b
    text: Die Wendung kann einen schon vor langer Zeit von Menschenhand bearbeiteten Stein bezeichnen und hebt damit sowohl sein Alter als auch seinen rein menschlichen Ursprung hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταλαιπώροι
  choice: elend
  rationale: Gibt den beklagenswerten, verurteilenden Sinn des griechischen Ausdrucks in natürlichem, würdigem Deutsch wieder.
- source_word: ἐν νεκροῖς αἱ ἐλπίδες αὐτῶν
  choice: ihre Hoffnungen sind unter den Toten
  rationale: Bewahrt das markante Bild und die Mehrdeutigkeit, ob Tote, tote Dinge oder der Bereich des Todes im Blick sind.
- source_word: οἵτινες ἐκάλεσαν θεοὺς
  choice: Sie haben … Götter genannt
  rationale: Gibt die direkte Aussage von καλέω mit doppeltem Akkusativ wieder, ohne das bloße Benennen zur inneren Verehrung umzudeuten.
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: Werke von Menschenhänden
  rationale: Bewahrt die biblische Wendung und gibt ἀνθρώπων geschlechtsgenau als allgemein menschlich wieder.
- source_word: τέχνης ἐμμελέτημα
  choice: kunstvoll gefertigt
  rationale: Drückt ein sorgfältig durch Kunstfertigkeit geschaffenes Erzeugnis natürlich und knapp aus.
- source_word: ἀπεικάσματα ζώων
  choice: Abbilder von Tieren
  rationale: Gibt sowohl den darstellenden Charakter von ἀπεικάσματα als auch den üblichen Bezug von ζώων auf Tiere klar wieder.
- source_word: λίθον ἄχρηστον
  choice: einen nutzlosen Stein
  rationale: Bewahrt die polemische Aussage, dass der Stein zu keinem Gebrauch taugt, statt lediglich seinen materiellen Wert zu bestreiten.
- source_word: χειρὸς ἔργον ἀρχαίας
  choice: das Werk einer Hand aus alter Zeit
  rationale: Bewahrt die kompakte Herkunftsangabe und vermeidet das im Deutschen missverständliche Idiom „von alter Hand“.
theological_decisions:
- issue: Bezug der Wendung „ihre Hoffnungen sind unter den Toten“
  choice: Das Bild wird ohne Festlegung auf tote Menschen, leblose Götzen oder das Totenreich beibehalten.
  alternative: Ihre Hoffnungen ruhen auf toten Dingen.
  rationale: Der knappe griechische Ausdruck kann die Leblosigkeit der Götzen und die Todesverfallenheit solcher Hoffnung zugleich anklingen lassen.
- issue: Menschliche Urheberschaft der Götterbilder
  choice: „Werke von Menschenhänden“
  alternative: „Werke von Männerhänden“
  rationale: ἀνθρώπων bezeichnet hier Menschen allgemein; die Übersetzung erhält die theologische Gegenüberstellung zwischen angeblichen Göttern und ihren menschlichen Herstellern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer polemischer Kraft. Der Doppelpunkt erschließt den griechischen Relativanschluss natürlich; die Aufzählung und ihre sachliche Härte bleiben erhalten.
