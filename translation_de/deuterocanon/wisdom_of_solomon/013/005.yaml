translation:
  language: de
  text: Denn aus der Größe und Schönheit der geschaffenen Dinge lässt sich entsprechend auf ihren Schöpfer schließen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lässt sich ihr Schöpfer in entsprechender Weise erkennen“ oder „wird ihr Schöpfer entsprechend wahrgenommen“. Das griechische Adverb kann einen angemessenen bzw. analogen Schluss von den Eigenschaften der geschaffenen Dinge auf ihren Schöpfer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: aus
  rationale: Kennzeichnet die geschaffenen Dinge als Ausgangspunkt beziehungsweise Grundlage der Erkenntnis.
- source_word: μεγέθους
  choice: Größe
  rationale: Bewahrt das breite Bedeutungsspektrum von Umfang, Größe und Erhabenheit, ohne es auf räumliche Ausdehnung zu beschränken.
- source_word: καλλονῆς
  choice: Schönheit
  rationale: Gibt die ästhetische Qualität unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: κτισμάτων
  choice: der geschaffenen Dinge
  rationale: Bewahrt den Plural und umfasst sowohl Lebewesen als auch unbelebte Werke der Schöpfung.
- source_word: ἀναλόγως
  choice: entsprechend
  rationale: Drückt eine Erkenntnis aus, die in angemessener Entsprechung von den geschaffenen Dingen auf ihren Urheber schließt; die Fußnote nennt die stärker fachsprachliche Wiedergabe.
- source_word: ὁ γενεσιουργὸς αὐτῶν
  choice: ihr Schöpfer
  rationale: Der seltene Ausdruck bezeichnet den Hervorbringer oder Urheber; „Schöpfer“ passt zum Kontext der κτίσματα und ist im Deutschen klar und würdig.
- source_word: θεωρεῖται
  choice: lässt sich … erkennen
  rationale: Die passive Form bezeichnet geistiges Wahrnehmen oder Erschließen, nicht notwendig ein Sehen mit den Augen.
theological_decisions:
- issue: Natürliche Gotteserkenntnis aus der Schöpfung
  choice: lässt sich ihr Schöpfer entsprechend erkennen
  alternative: wird ihr Schöpfer durch Analogie erkannt
  rationale: Die Formulierung bewahrt die Aussage, dass der Schöpfer von den geschaffenen Dingen her wahrgenommen oder erschlossen werden kann, ohne Art, Umfang oder Heilsbedeutung dieser Erkenntnis weiter festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lässt sich erkennen“ macht den gedanklichen Charakter von θεωρεῖται verständlich; „entsprechend“ hält ἀναλόγως offen und vermeidet unnötig akademische Sprache.
