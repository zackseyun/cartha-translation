base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/009.yaml
  text: For if they had power to know so much that they could speculate about the age, how did they not more quickly find its Master?
translation:
  language: de
  text: Denn wenn sie so viel zu erkennen vermochten, dass sie die Welt[a] ergründen konnten, warum fanden sie dann nicht viel eher den Herrn dieser Dinge?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Zeitalter. Das griechische Wort kann je nach Zusammenhang auch die Welt oder den Weltzusammenhang bezeichnen.'
    reason: Bewahrt die bei αἰών mögliche zeitliche Bedeutung, während der Kontext die Wiedergabe »Welt« nahelegt.
lexical_decisions:
- source_word: τοσοῦτον ἴσχυσαν εἰδέναι
  choice: so viel Erkenntniskraft besaßen
  rationale: Gibt sowohl ἴσχυσαν (fähig bzw. stark sein) als auch εἰδέναι (erkennen/wissen) wieder, ohne bloße körperliche »Kraft« nahezulegen.
- source_word: στοχάσασθαι
  choice: erforschen
  rationale: Das Verb bezeichnet ein zielgerichtetes Erschließen, Untersuchen oder mutmaßendes Erfassen; »erforschen« ist im Kontext natürlich und wahrt den Erkenntnisbezug.
- source_word: τὸν αἰῶνα
  choice: das Weltall
  rationale: αἰών kann »Zeitalter«, »Ewigkeit« oder im hellenistisch-jüdischen Kontext die geschaffene Welt bzw. den Weltzusammenhang bezeichnen. Hier legt der Zusammenhang mit der Erkenntnis des Schöpfers die kosmologische Bedeutung nahe; die Fußnote bewahrt die lexikalische Mehrdeutigkeit.
- source_word: δεσπότην
  choice: Herrn
  rationale: Bezeichnet den Gebieter oder Eigentümer; »Herr« ist würdig und idiomatisch, während »Gebieter« im Deutschen unnötig hart klänge.
- source_word: τάχιον
  choice: viel eher
  rationale: Der Komparativ kann zeitlich »schneller« oder folgernd »eher/leichter« bedeuten. Im argumentativen Zusammenhang ist »viel eher« natürlich; »viel« bildet die verstärkende Wirkung ab.
theological_decisions:
- issue: Beziehung zwischen Welterkenntnis und Gotteserkenntnis
  choice: 'Die rhetorische Spannung bleibt bestehen: Wer den Kosmos erschließen kann, hätte dessen Herrn umso eher finden sollen.'
  alternative: Den Satz ausdrücklich als Beweis natürlicher Gotteserkenntnis oder als Aussage über vollständige Erkennbarkeit Gottes formulieren.
  rationale: Der griechische Text erhebt einen Vorwurf, definiert aber weder Reichweite noch Heilsbedeutung dieser Erkenntnis. Eine systematisch-theologische Präzisierung wäre ein Zusatz.
- issue: Referent von δεσπότην
  choice: »dessen Herrn« bezieht sich auf das Weltall.
  alternative: »den Herrn dieser Dinge« mit ausdrücklichem Rückbezug auf die zuvor genannten Schöpfungswerke.
  rationale: Das Genitivpronomen τούτων ist formal pluralisch und kann auf die betrachteten Dinge zurückweisen. Im unmittelbaren Satzbau bündelt »dessen« den Bezug idiomatisch beim Weltall, ohne den Schöpfer mit dem Kosmos gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der rhetorische Fragesatz und die gesteigerte Schlussfolgerung des Griechischen bleiben erhalten; ungebräuchliche Formulierungen wie »über den Äon mutmaßen« werden vermieden.
