revisions:
- from: Denn wenn sie so viel Erkenntniskraft besaßen, dass sie das Weltall[a] erforschen konnten, wie konnten sie da nicht viel eher dessen Herrn finden?
  to: Denn wenn sie so viel zu erkennen vermochten, dass sie die Welt[a] ergründen konnten, warum fanden sie dann nicht viel eher den Herrn dieser Dinge?
  rationale: Die Revision korrigiert den pluralischen Bezug von τούτων, ersetzt die technischere und semantisch stärkere Formulierung »das Weltall erforschen« durch eine engere, idiomatische Wiedergabe und bewahrt die lexikalische Offenheit von αἰών in der Fußnote. Der Sinn und die rhetorische Zuspitzung des Verses bleiben unverändert.
