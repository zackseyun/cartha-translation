base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/002.yaml
  text: Instead[a], they considered either fire, or wind, or swift air, or the circle of the stars, or violent water, or the lights of heaven, to be gods[c][b], rulers of the world.
translation:
  language: de
  text: Stattdessen hielten sie entweder das Feuer oder den Wind[a] oder die schnell dahineilende Luft oder den Kreis der Sterne[b] oder das reißende Wasser oder die Himmelslichter für Götter und Herrscher der Welt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geist“ beziehungsweise „Atem“; im Zusammenhang der Naturkräfte ist „Wind“ wahrscheinlicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Umlauf der Sterne“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Götter, Herrscher der Welt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ
  choice: Stattdessen ... oder
  rationale: Gibt den Gegensatz zum vorherigen Vers wieder und leitet zugleich die Reihe der irrtümlich für göttlich gehaltenen Naturerscheinungen ein.
- source_word: πῦρ
  choice: das Feuer
  rationale: Direkte und natürliche Wiedergabe des elementaren Begriffs.
- source_word: πνεῦμα
  choice: der Wind
  rationale: Im Zusammenhang einer Aufzählung von Naturkräften ist „Wind“ die naheliegende Bedeutung; „Geist“ würde eine hier nicht geforderte personale oder theologische Vorstellung nahelegen.
- source_word: ταχινὸν ἀέρα
  choice: die schnell dahineilende Luft
  rationale: Bewahrt den Unterschied zwischen πνεῦμα und ἀήρ und bringt die durch ταχινόν bezeichnete rasche Bewegung idiomatisch zum Ausdruck.
- source_word: κύκλον ἄστρων
  choice: den Kreis der Sterne
  rationale: Bewahrt das kosmologische Bild des griechischen Textes, ohne es als bestimmtes antikes Weltmodell auszudeuten.
- source_word: βίαιον ὕδωρ
  choice: das gewaltige Wasser
  rationale: „Gewaltig“ erhält die Kraft und Heftigkeit von βίαιον; der Singular folgt dem kollektiv gebrauchten ὕδωρ.
- source_word: φωστῆρας οὐρανοῦ
  choice: die Himmelslichter
  rationale: Eine klare, moderne und zugleich würdevolle Wiedergabe der himmlischen Leuchtkörper.
- source_word: πρυτάνεις κόσμου
  choice: die über die Welt herrschen
  rationale: Gibt die den vermeintlichen Göttern zugeschriebene leitende Herrschaft verständlich wieder; eine Fußnote weist auf die substantivisch-appositionale Form hin.
- source_word: θεοὺς ἐνόμισαν
  choice: hielten sie ... für Götter
  rationale: Die deutsche Konstruktion „für etwas halten“ entspricht natürlich dem Urteil, das ἐνόμισαν mit doppeltem Akkusativ ausdrückt.
theological_decisions:
- issue: Bedeutung von πνεῦμα
  choice: Wind
  alternative: Geist oder Atem
  rationale: Die Reihe nennt geschaffene Naturkräfte und Himmelskörper. „Wind“ wahrt diesen Zusammenhang, während „Geist“ leicht eine personale geistige Macht suggerieren würde.
- issue: Beziehung von πρυτάνεις κόσμου zu θεούς
  choice: Götter, die über die Welt herrschen
  alternative: Götter, Herrscher der Welt
  rationale: Der Relativsatz macht die appositionale Beschreibung im Deutschen flüssig, ohne den Gedanken abzuschwächen, dass diesen vermeintlichen Göttern Weltherrschaft zugeschrieben wurde.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Aufzählung bleibt eng am griechischen Aufbau; Artikel und ein Relativsatz sorgen für natürliche deutsche Syntax. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
