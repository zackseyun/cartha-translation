base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/006.yaml
  text: Yet even for these there is only slight blame, for they too perhaps go astray while seeking God and wanting to find him;
translation:
  language: de
  text: Doch auch diese trifft nur wenig Tadel; denn vielleicht gehen auch sie in die Irre, während sie Gott[a] suchen und ihn finden wollen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Gott«; im Griechischen steht das Wort ohne Artikel. Im Zusammenhang ist jedoch wahrscheinlich der wahre Gott gemeint, den sie zu finden suchen, dabei aber in die Irre gehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Doch auch
  rationale: Die Wendung führt einen adversativ-konzessiven Gedanken ein und knüpft natürlich an die vorausgehende Kritik an.
- source_word: ἐπὶ τούτοις ἐστὶν μέμψις ὀλίγη
  choice: diese trifft nur wenig Tadel
  rationale: ἐπὶ τούτοις bezieht sich im Kontext auf die zuvor beschriebenen Menschen; μέμψις bezeichnet Tadel bzw. Vorwurf, ohne die stärkere juristische Bedeutung von Schuld aufzudrängen.
- source_word: τάχα
  choice: vielleicht
  rationale: Bewahrt die abschwächende, احتمال ausdrückende Funktion des griechischen Adverbs.
- source_word: πλανῶνται
  choice: gehen … in die Irre
  rationale: Gibt das Bild des Irrens sowie den geistigen Irrtum wieder, ohne eine äußere Ursache festzulegen.
- source_word: θεὸν ζητοῦντες
  choice: während sie Gott suchen
  rationale: Das Partizip bezeichnet eine gleichzeitige Handlung. Im Kontext ist wahrscheinlich der wahre Gott gemeint, obwohl θεόν ohne Artikel steht.
- source_word: θέλοντες εὑρεῖν
  choice: ihn finden wollen
  rationale: Gibt den Willen der Suchenden klar und in natürlichem modernem Deutsch wieder; das Pronomen nimmt Gott als Objekt wieder auf.
theological_decisions:
- issue: Bestimmte oder unbestimmte Wiedergabe von θεόν
  choice: Gott
  alternative: einen Gott
  rationale: Der Zusammenhang von Weisheit 13 handelt von Menschen, die aus der Schöpfung auf Göttliches schließen, den Schöpfer jedoch nicht erkennen. Daher bezeichnet θεόν hier wahrscheinlich den wahren Gott; wegen des fehlenden Artikels bleibt die alternative Lesart in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt die argumentative Spannung zwischen dem geringen Tadel und dem tatsächlichen Irrweg; die Unsicherheit von τάχα bleibt durch »vielleicht« erhalten.
