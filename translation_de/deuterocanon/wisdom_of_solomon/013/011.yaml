  text: Or if some woodcutter[a], a carpenter, has sawed down a manageable tree and skillfully stripped off all its bark, and with proper craftsmanship made a useful vessel for the service of life[b],
translation:
  language: de
  text: Oder wenn ein Holzfäller und Zimmermann einen leicht zu bearbeitenden Baum[a] abgesägt, geschickt dessen ganze Rinde abgeschält und ihn kunstvoll zu einem nützlichen Gegenstand für die Bedürfnisse des Lebens[b] angefertigt hat,
  philosophy: optimal-equivalence
  footnotes:
