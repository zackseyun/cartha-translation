    text: 'Oder: „einen leicht zu handhabenden Baum“. Das griechische Wort kann etwas bezeichnen, das sich leicht bewegen, handhaben oder bearbeiten lässt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „für den täglichen Gebrauch“. Gemeint ist der praktische Nutzen im gewöhnlichen Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑλοτόμος τέκτων
  choice: Holzfäller, ein Zimmermann
  rationale: Die appositionale Formulierung bewahrt sowohl das Fällen des Holzes als auch dessen handwerkliche Weiterverarbeitung; im unmittelbaren Zusammenhang bezeichnet τέκτων am natürlichsten einen Zimmermann.
- source_word: εὐκίνητον φυτὸν
  choice: einen leicht zu bearbeitenden Baum
  rationale: φυτὸν ist hier aufgrund des Absägens und Entrindens konkret ein Baum. εὐκίνητον bezeichnet im handwerklichen Zusammenhang wahrscheinlich gut handhabbares oder bearbeitbares Holz.
- source_word: ἐκπρίσας
  choice: abgesägt
  rationale: Das Verb bezeichnet ein Sägen; „abgesägt“ gibt die Handlung präzise wieder, ohne zwingend zu behaupten, der Baum sei gefällt worden.
- source_word: περιέξυσεν εὐμαθῶς πάντα τὸν φλοιὸν αὐτοῦ
  choice: geschickt seine ganze Rinde abgeschält
  rationale: περιέξυσεν bezeichnet das ringsum erfolgende Abschaben oder Entfernen; beim Baum ist „Rinde abgeschält“ natürlich. εὐμαθῶς hebt die eingeübte Geschicklichkeit hervor.
- source_word: τεχνησάμενος εὐπρεπῶς
  choice: ihn ansprechend gestaltet
  rationale: Die Wendung verbindet handwerkliche Gestaltung mit einer angemessenen oder gefälligen Ausführung. „Ansprechend gestaltet“ wahrt neben dem Können auch die ästhetische Nuance von εὐπρεπῶς.
- source_word: χρήσιμον σκεῦος
  choice: einen nützlichen Gegenstand
  rationale: σκεῦος ist ein weiter Begriff für einen hergestellten Gebrauchsgegenstand, ein Gerät oder Gefäß. „Gegenstand“ vermeidet eine nicht vom Kontext verlangte Verengung.
- source_word: εἰς ὑπηρεσίαν ζωῆς
  choice: für die Bedürfnisse des Lebens
  rationale: Die Formulierung meint den praktischen Dienst im gewöhnlichen Leben. Die deutsche Wendung ist verständlich und wahrt den Bezug auf alltäglichen Nutzen.
theological_decisions:
- issue: Gewöhnliches Handwerk als Vorbereitung des späteren Götzenbildarguments
  choice: Die Tätigkeit wird in diesem Vers sachlich und ohne vorweggenommene Verurteilung beschrieben.
  alternative: Das Handeln bereits hier durch negativ gefärbte Wörter als Götzenherstellung kennzeichnen.
  rationale: Der Vers schildert zunächst die normale Herstellung eines nützlichen Gebrauchsgegenstands. Die polemische Zuspitzung entsteht erst im weiteren Zusammenhang und soll nicht in diesen Satz hineingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Nebensatz mit abschließendem Komma offen, weil der Gedankengang im folgenden Vers fortgesetzt wird. Die handwerklichen Tätigkeiten werden klar und ohne unnötige Fachsprache wiedergegeben.
