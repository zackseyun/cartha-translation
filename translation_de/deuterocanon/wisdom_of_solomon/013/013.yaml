  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/013.yaml
  text: But the refuse from these[a], useful for nothing, a crooked piece of wood and full of knots—taking it, he carved it with the diligence of his idleness, and with the skill of his leisure he shaped it, and made it like the image of a man[b],
translation:
  language: de
  text: Das Abfallstück davon[a], das zu nichts brauchbar war – ein krummes Stück Holz voller Astknoten –, nahm er und schnitzte es mit dem Fleiß seines Müßiggangs; mit der Kunstfertigkeit seiner Muße[b] formte er es und gab ihm die Gestalt eines Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das weggeworfene Stück“, „der Abfall“ oder „der Verschnitt“. Das griechische Wort bezeichnet etwas, das als wertlos ausgesondert wurde.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich und bewusst ironisch verbindet der griechische Text den „Fleiß“ mit seinem „Müßiggang“ und die erworbene Fertigkeit mit seiner „Muße“.
    reason: rhetorical_note
lexical_decisions:
- source_word: ἀπόβλημα
  choice: Abfallstück
  rationale: Das Wort bezeichnet etwas Weggeworfenes oder als wertlos Ausgesondertes. „Abfallstück“ passt zum Holzhandwerk und vermeidet eine zu genaue Festlegung auf eine bestimmte Art von Verschnitt.
- source_word: εἰς οὐδὲν εὔχρηστον
  choice: zu nichts brauchbar
  rationale: Die Wendung bewahrt die uneingeschränkte Nutzlosigkeit des Stücks in natürlichem Deutsch.
- source_word: ξύλον σκολιὸν καὶ ὅζοις συμπεφυκός
  choice: ein krummes Stück Holz voller Astknoten
  rationale: ξύλον bezeichnet hier ein konkretes Holzstück; die mitgewachsenen ὅζοι werden sachgerecht und verständlich als Astknoten wiedergegeben.
- source_word: ἐγλύψεν
  choice: schnitzte
  rationale: Beim Bearbeiten eines Holzstücks ist „schnitzen“ präziser und natürlicher als das allgemeinere „bearbeiten“ oder „meißeln“.
- source_word: ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ
  choice: mit dem Fleiß seines Müßiggangs
  rationale: Die paradoxe Verbindung von sorgfältigem Fleiß und Müßiggang bleibt erhalten und trägt den spöttischen Ton des griechischen Textes.
- source_word: ἐμπειρίᾳ ἀνέσεως
  choice: mit der Kunstfertigkeit seiner Muße
  rationale: „Kunstfertigkeit“ gibt die durch Erfahrung erworbene Fähigkeit wieder; „Muße“ bewahrt den Gegensatz zur angestrengten Sorgfalt.
- source_word: ἐτύπωσεν αὐτό
  choice: formte er es
  rationale: Das Verb bezeichnet das Formen oder Ausprägen einer Gestalt und passt zur Abfolge des Schnitzens und Gestaltens.
- source_word: ἀπεικάσεν αὐτὸ εἰκόνι ἀνθρώπου
  choice: gab ihm die Gestalt eines Menschen
  rationale: Die Formulierung gibt das Herstellen einer menschlichen Ähnlichkeit idiomatisch wieder. ἄνθρωπος bezeichnet hier einen Menschen und legt für sich allein kein männliches Geschlecht der dargestellten Figur fest.
theological_decisions:
- issue: Geschlecht der dargestellten menschlichen Gestalt in εἰκόνι ἀνθρώπου
  choice: die Gestalt eines Menschen
  alternative: das Bild eines Mannes
  rationale: ἄνθρωπος kann einen Menschen allgemein bezeichnen; der Vers enthält keinen eindeutigen Hinweis darauf, dass die geschnitzte Figur männlich sein muss. Die Übersetzung vermeidet daher eine unbegründete geschlechtliche Festlegung.
- issue: Ironische Darstellung der im Müßiggang aufgewandten Handwerkskunst
  choice: mit dem Fleiß seines Müßiggangs; mit der Kunstfertigkeit seiner Muße
  alternative: mit großer Sorgfalt in seiner freien Zeit
  rationale: Die gegensätzlichen Begriffe des griechischen Textes werden nicht zu einer neutralen Zeitangabe geglättet, sondern als bewusste Ironie erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche bündeln die Beschreibung des wertlosen Holzstücks; das Semikolon erhält die zweigliedrige ironische Darstellung der handwerklichen Arbeit.
