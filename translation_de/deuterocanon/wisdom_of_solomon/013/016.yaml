base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/016.yaml
  text: So then[a], lest it fall, he made provision for it, knowing that it is unable to help itself; for it is an image and has need of help.
translation:
  language: de
  text: Damit es nun nicht umstürzt, hat er dafür Vorsorge getroffen, wohl wissend, dass es sich selbst nicht helfen kann; denn es ist ein Bild[a] und bedarf der Hilfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Götzenbild“. Das griechische Wort bedeutet wörtlich „Bild“ oder „Abbild“; im Zusammenhang ist ein hergestellter Gegenstand der Verehrung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὲν οὖν μὴ καταπέσῃ
  choice: Damit es nun nicht umstürzt
  rationale: ἵνα mit μή und Aorist Konjunktiv bezeichnet hier einen vorbeugenden Zweck. „Damit es … nicht umstürzt“ gibt diesen Sinn natürlich wieder; „umstürzt“ passt zu einem aufgestellten Kultbild.
- source_word: προενόησεν αὐτοῦ
  choice: hat er Vorsorge für es getroffen
  rationale: προνοέω bezeichnet vorausschauendes Bedachtsein beziehungsweise vorsorgliches Handeln. Die Formulierung wahrt den praktischen Aspekt der Sicherung und bezieht αὐτοῦ auf das hergestellte Bild.
- source_word: εἰδὼς
  choice: wohl wissend
  rationale: Das Partizip bezeichnet das begleitende Wissen des Herstellers. „Wohl wissend“ erhält die ironische rhetorische Schärfe, ohne eine zusätzliche Kausalbeziehung festzulegen.
- source_word: ἀδυνατεῖ ἑαυτῷ βοηθῆσαι
  choice: dass es sich selbst nicht helfen kann
  rationale: Die Wendung drückt die Unfähigkeit des Bildes aus, sich selbst beizustehen. Die deutsche Formulierung ist klar und nah am griechischen Sinn.
- source_word: εἰκὼν
  choice: Bild
  rationale: εἰκών bedeutet wörtlich „Bild“ oder „Abbild“. „Bild“ bewahrt die Wortwahl des Ausgangstextes, während der Zusammenhang erkennen lässt, dass ein verehrtes Kultbild gemeint ist.
- source_word: χρείαν ἔχει βοηθείας
  choice: bedarf der Hilfe
  rationale: 'Die etwas gehobene Formulierung entspricht der wörtlichen Konstruktion „hat Hilfe nötig“ und erhält den ironischen Kontrast: Das vermeintlich helfende Bild braucht selbst Hilfe.'
theological_decisions:
- issue: Bezeichnung des Kultgegenstands durch εἰκών
  choice: Bild
  alternative: Götzenbild
  rationale: Der Zusammenhang handelt eindeutig von einem Kultgegenstand, doch εἰκών selbst bezeichnet ein Bild oder Abbild. „Bild“ bewahrt die lexikalische Offenheit und die Ironie, ohne die kontextuelle Deutung bereits in das Hauptwort einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobenen Wendungen „Vorsorge … getroffen“ und „bedarf der Hilfe“ spiegeln den formellen und ironischen Ton des griechischen Textes; die Satzstruktur bleibt dennoch gut verständlich.
