revisions:
- from: Denn während sie sich unter seinen Werken bewegen, erforschen sie diese genau; und was sie sehen, überzeugt sie, denn das Sichtbare ist schön.[a]
  to: Denn während sie sich inmitten seiner Werke bewegen, erforschen sie sie genau und lassen sich durch den Anblick davon überzeugen, dass das Sichtbare schön ist.[a]
  rationale: Die Revision glättet die räumliche Formulierung und bildet die Verbindung von πείθονται τῇ ὄψει ὅτι als Überzeugung durch den Anblick mit einem Inhaltssatz ab. Damit bleibt offen, ob der folgende Gedanke im weiteren Kontext zugleich begründend verstanden wird. Die Alternative zu καλά bleibt an derselben Stelle verankert.
