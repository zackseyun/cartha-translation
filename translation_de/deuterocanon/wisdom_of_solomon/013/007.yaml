base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/007.yaml
  text: For while moving among his works[a], they examine them closely, and they are persuaded by what they see, because the things being seen are beautiful.
translation:
  language: de
  text: Denn während sie sich inmitten seiner Werke bewegen, erforschen sie sie genau und lassen sich durch den Anblick davon überzeugen, dass das Sichtbare schön ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass das Sichtbare gut ist.“ Das griechische Wort καλὰ kann sowohl „schön“ als auch „gut“ bedeuten; wegen der Betonung des Sehens ist hier „schön“ gewählt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστρεφόμενοι
  choice: während sie sich … bewegen
  rationale: Das Partizip bezeichnet hier ein Sich-Bewegen beziehungsweise Sich-Aufhalten im Bereich der Werke. Die Formulierung bewahrt den räumlich-erfahrungsbezogenen Sinn, ohne ihn auf bloßes Nachdenken zu verengen.
- source_word: διεραυνῶσιν
  choice: erforschen sie diese genau
  rationale: Das verstärkte Verb bezeichnet gründliches Suchen oder Untersuchen. Das ergänzte Pronomen greift die Werke als den im Deutschen erforderlichen Gegenstand auf.
- source_word: πείθονται
  choice: überzeugt sie
  rationale: Die mediale beziehungsweise passive Form beschreibt, dass die Betrachtenden durch den visuellen Eindruck überzeugt werden. Die aktive deutsche Wendung ist natürlich und behält diese Wirkung bei.
- source_word: τῇ ὄψει
  choice: was sie sehen
  rationale: Der instrumentale Dativ kann wörtlicher mit „durch den Anblick“ wiedergegeben werden. „Was sie sehen“ bringt den Wahrnehmungsvorgang in gegenwärtigem Deutsch klar zum Ausdruck.
- source_word: καλά
  choice: schön
  rationale: καλός kann sowohl „schön“ als auch „gut“ bedeuten. Wegen ὄψις und τὰ βλεπόμενα steht hier wahrscheinlich der sichtbare, ästhetische Eindruck im Vordergrund; die Alternative wird in der Fußnote bewahrt.
- source_word: τὰ βλεπόμενα
  choice: das Sichtbare
  rationale: Der substantivierte Partizipialausdruck bezeichnet die Dinge, die gesehen werden können. „Das Sichtbare“ ist knapp, natürlich und sachlich eng am Griechischen.
theological_decisions:
- issue: Bezug von αὐτοῦ
  choice: seinen Werken, mit Bezug auf Gott beziehungsweise den Schöpfer im Zusammenhang
  alternative: dessen Werken, bei einem unpersönlicher verstandenen Rückbezug
  rationale: Der umgebende Gedankengang handelt von der Schlussfolgerung aus der Schöpfung auf ihren Urheber. Das maskuline Possessivpronomen bewahrt den naheliegenden persönlichen Bezug, ohne zusätzliche Lehraussagen einzutragen.
- issue: Verhältnis von πείθονται zu ὅτι
  choice: 'kausale Wiedergabe: „denn das Sichtbare ist schön“'
  alternative: 'Inhaltssatz: „davon überzeugen, dass das Sichtbare schön ist“'
  rationale: ὅτι kann hier den Grund der Überzeugung oder deren Inhalt einleiten. Die kausale Wiedergabe entspricht der sichtbezogenen Argumentationsbewegung und lässt die Überzeugung durch den Anblick hervortreten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der griechischen Argumentationsfolge, vermeidet jedoch schwerfällige Nominalformulierungen. Das Semikolon macht die beiden eng verbundenen Beobachtungen übersichtlich.
