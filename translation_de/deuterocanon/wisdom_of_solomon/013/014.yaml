  naturalness: Der Entwurf beginnt mit einer im Deutschen unvollständigen Verbfolge („oder es … gestaltet“). Als Versfortsetzung kann „oder er es … gestaltete“ den griechischen Bezug klar und idiomatisch wiedergeben. Die koordinierte Verbfolge bildet die griechischen Partizipien verständlich und flüssig ab.
  terminology: „unbedeutenden Tier“ gibt den abwertend-niedrigen Status von εὐτελής wieder, ohne „wertlos“ oder eine moralische Wertung einzutragen. „Rötliches Färbemittel“ wahrt bei φῦκος die sachliche Unbestimmtheit zwischen Farbstoff und kosmetischem Pigment. „Makel“ und „überstrich“ passen zu κηλίς und καταχρίσας.
