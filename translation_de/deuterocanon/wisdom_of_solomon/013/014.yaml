translation:
  language: de
  text: oder er es einem unbedeutenden Tier[a] ähnlich gestaltete, es mit rotem Ocker und einem rötlichen Färbemittel[b] bestrich, seine Oberfläche rot färbte und jeden Makel daran überstrich,
