lexical_decisions:
- source_word: ζώῳ τινὶ εὐτελεῖ
  choice: irgendeinem einfachen Tier
  rationale: ζῷον bezeichnet ein Tier oder Lebewesen; εὐτελής kann schlicht, gewöhnlich, geringwertig oder billig bedeuten. „Einfach“ bewahrt den abwertenden Unterton, ohne das Tier moralisch als „wertlos“ zu beurteilen.
- source_word: ὡμοίωσεν αὐτό
  choice: es … ähnlich gestaltet
  rationale: ὁμοιόω bedeutet, etwas ähnlich zu machen. Im handwerklichen Zusammenhang gibt „ähnlich gestaltet“ sowohl Formgebung als auch Ähnlichkeit natürlich wieder.
- source_word: καταχρίσας
  choice: bestrichen / überstrichen
  rationale: 'Das Verb bezeichnet das Auftragen einer Substanz über eine Oberfläche. Die variierte Wiedergabe entspricht im Deutschen den beiden Funktionen: Farbe auftragen und Makel verdecken.'
- source_word: μίλτῳ
  choice: rotem Ocker
  rationale: μίλτος bezeichnet rote Erde beziehungsweise roten Ocker als Farbpigment.
- source_word: φύκει
  choice: roter Farbe
  rationale: φῦκος kann ein rötliches, teils kosmetisch verwendetes Färbemittel bezeichnen. „Rote Farbe“ ist verständlich und bewahrt die Farbangabe, ohne eine unsichere materielle Herkunft festzulegen.
- source_word: ἐρυθῆνας χρῶαν αὐτοῦ
  choice: seine Oberfläche gerötet
  rationale: χρόα kann Haut, Färbung oder Oberfläche meinen. Bei einem gefertigten Bild ist „Oberfläche“ sachgerecht; ἐρυθῆνας bezeichnet deren Rotfärbung.
- source_word: πᾶσαν κηλῖδα τὴν ἐν αὐτῷ
  choice: jeden Makel daran
  rationale: κηλίς bezeichnet Fleck, Makel oder Verunstaltung. Hier geht es um sichtbare Unvollkommenheiten des Werkstücks, die mit Farbe verdeckt werden.
