lexical_decisions:
- source_word: ποιήσας
  choice: nachdem er … gemacht hatte
  rationale: Das vorzeitige aoristische Partizip wird im Deutschen natürlich durch einen temporalen Nebensatz wiedergegeben.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Pronomen bezieht sich auf das Bildnis; das grammatische Geschlecht des deutschen Bezugsworts erfordert hier die maskuline Form, ohne dem Gegenstand Personsein zuzuschreiben.
- source_word: αὐτοῦ ἄξιον
  choice: passende
  rationale: ἄξιος kann hier »würdig« oder »angemessen/passend« bedeuten; »passend« ist im Zusammenhang einer eigens angefertigten Unterkunft idiomatisch und bewahrt den sachlichen Sinn.
- source_word: οἴκημα
  choice: Wohnstätte
  rationale: Das Wort bezeichnet einen Ort des Wohnens. »Wohnstätte« bewahrt zugleich die Ironie, dass einem leblosen Bildnis eine Behausung gegeben wird, ohne vorschnell »Schrein« einzutragen.
- source_word: ἐν τοίχῳ
  choice: in eine Wand
  rationale: Obwohl ἐν mit Dativ gewöhnlich einen Ort bezeichnet, legt das Verb des Setzens im Deutschen die gerichtete Form nahe; gemeint ist offenbar die Anbringung in beziehungsweise innerhalb einer Wand.
- source_word: ἔθηκεν
  choice: stellte
  rationale: Die schlichte Bedeutung des Verbs ist »setzen, stellen, legen«; »stellte« passt zu der Installation des Bildnisses.
- source_word: ἀσφαλισάμενος
  choice: befestigte
  rationale: Das begleitende Partizip beschreibt, wie der Gegenstand gesichert beziehungsweise festgemacht wurde. Eine koordinierte Verbform klingt im Deutschen natürlich.
- source_word: σιδήρῳ
  choice: mit Eisen
  rationale: Der instrumentale Dativ bezeichnet das verwendete Material oder Mittel, ohne die Art der eisernen Befestigung näher festzulegen.
theological_decisions:
- issue: Bezeichnung des Götzenbildes als Sache oder Person
  choice: Sachbezug durch »es«; »ihm« nur aufgrund des grammatischen Geschlechts des Bezugsworts
  alternative: durchgehend personale Wiedergabe mit »ihm«
  rationale: Der Zusammenhang handelt von einem hergestellten Bildnis. Die Übersetzung wahrt seinen Gegenstandscharakter, soweit das deutsche Genus dies zulässt, und schreibt ihm keine Personalität zu.
- issue: Wertung in αὐτοῦ ἄξιον
  choice: »passende« im Haupttext
  alternative: »seiner würdige«
  rationale: Beide Bedeutungen sind sprachlich möglich. Die weniger wertende Lesart passt unmittelbar zur angefertigten Unterkunft; die stärker ironisch oder ehrend klingende Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bildet die Vorzeitigkeit des ersten Partizips klar ab; die zweite Partizipialhandlung wird zur besseren Lesbarkeit koordiniert. Die leicht ironische Wirkung von »Wohnstätte« für ein lebloses Bildnis bleibt erhalten.
