- from: Und nachdem er ihm eine passende Wohnstätte[a] gemacht hatte, stellte er es in eine Wand und befestigte es mit Eisen.
  to: Und nachdem er für das Bild eine passende Wohnstätte[a] geschaffen hatte, brachte er es in einer Wand an und sicherte es mit Eisen.
  rationale: Die Revision klärt den im Deutschen sonst inkonsistenten Bezug auf den im Kontext vorausgesetzten gefertigten Kultgegenstand durch „das Bild“, ohne dessen Sachcharakter zu personalisieren. „In einer Wand anbringen“ gibt ἐν τοίχῳ als Ortsangabe wieder und verbindet die Anbringung natürlich mit der anschließenden Sicherung. Die Fußnote wurde grammatisch und idiomatisch berichtigt.
