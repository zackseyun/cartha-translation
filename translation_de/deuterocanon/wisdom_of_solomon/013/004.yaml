base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/004.yaml
  text: But if they were astonished by their power and activity[a], let them understand from them how much more powerful is the one who made them;
translation:
  language: de
  text: Wenn sie aber über deren Kraft und Wirken[a] staunten, sollen sie an ihnen erkennen, wie viel mächtiger der ist, der sie geschaffen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kraft und Wirksamkeit“. Das Griechische verbindet δύναμις mit ἐνέργεια und bezeichnet damit die eindrucksvolle Kraft und das tätige Wirken der geschaffenen Dinge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει
  choice: Kraft
  rationale: Bewahrt die Bedeutung von Macht bzw. Stärke und stellt die sprachliche Verbindung zum Komparativ δυνατώτερος her.
- source_word: ἐνεργείᾳ
  choice: Wirksamkeit
  rationale: Bezeichnet das tätige Wirken und die hervorgebrachte Wirkung der geschaffenen Dinge; zusammen mit „Kraft“ bleibt das griechische Begriffspaar erkennbar.
- source_word: ἐκπλαγέντες
  choice: staunten
  rationale: Gibt das starke Beeindruckt- und Erstauntsein natürlich und ohne unnötige Übersteigerung wieder.
- source_word: νοησάτωσαν
  choice: sollen sie … erkennen
  rationale: Der Imperativ fordert zu einer verstandesmäßigen Einsicht aufgrund der wahrgenommenen Dinge auf.
- source_word: ἀπʼ αὐτῶν
  choice: von ihnen her
  rationale: Drückt aus, dass die geschaffenen Dinge selbst als Ausgangspunkt des Schlusses dienen, und bewahrt den pronominalen Rückbezug.
- source_word: πόσῳ
  choice: wie viel
  rationale: Leitet den Gradvergleich ein; mit „mächtiger“ ergibt sich im Deutschen die natürliche Formulierung „wie viel mächtiger“.
- source_word: ὁ κατασκευάσας αὐτὰ
  choice: der, der sie geschaffen hat
  rationale: Gibt die beschreibende Bezeichnung des Urhebers wieder, ohne den im griechischen Satz nicht ausdrücklich genannten Namen „Gott“ einzufügen.
- source_word: δυνατώτερός
  choice: mächtiger
  rationale: Bewahrt den direkten Vergleich mit der zuvor genannten „Kraft“ und klingt im Deutschen würdig und natürlich.
theological_decisions:
- issue: Identität des Schöpfers
  choice: der, der sie geschaffen hat
  alternative: Gott; der Schöpfer
  rationale: Der griechische Text bezeichnet ihn in diesem Satz beschreibend und nennt ihn nicht ausdrücklich „Gott“. Die Übersetzung erhält diese rhetorische Bewegung von den geschaffenen Dingen zu ihrem Urheber.
- issue: Art des Erkenntniswegs
  choice: von ihnen her erkennen
  alternative: an ihnen erkennen; aus ihnen schließen
  rationale: Die Formulierung bewahrt sowohl den Ausgangspunkt in den geschaffenen Dingen als auch den intellektuellen Charakter von νοεῖν, ohne den Vorgang auf einen ausdrücklich logischen Fachausdruck festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Argumentation, bleibt aber gut verständlich. „Wirksamkeit“ wahrt die Spannung zwischen Tätigkeit und Wirkung; die Fußnote nennt die naheliegende Alternative „Wirken“.
