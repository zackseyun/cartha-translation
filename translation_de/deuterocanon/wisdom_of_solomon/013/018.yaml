  text: But for life he considers the dead thing worthy; for help he begs the one most inexperienced; and for a journey[a], the one unable even to use its foot,
translation:
  language: de
  text: Um Leben zu erhalten, wendet er sich an etwas Totes; um Hilfe fleht er den völlig Unerfahrenen an; und für eine Reise an den, der nicht einmal seinen Fuß gebrauchen kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der nicht einmal seinen Sockel gebrauchen kann“. Das griechische Wort βάσις kann einen Fuß beziehungsweise Tritt, aber auch die Standfläche oder den Sockel eines Bildes bezeichnen. Die Aussage verspottet das Götzenbild, das sich nicht selbst fortbewegen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ ζωῆς τὸ νεκρὸν ἀξιοῖ
  choice: Um Leben bittet er ein totes Ding
  rationale: περί mit Genitiv bezeichnet hier das Anliegen. ἀξιόω kann im vorliegenden Zusammenhang eine Bitte oder Forderung ausdrücken; „bittet“ ergibt im Deutschen eine natürliche Parallele zu ἱκετεύει. Das substantivierte Neutrum τὸ νεκρόν wird als „ein totes Ding“ wiedergegeben und bezeichnet das leblose Götzenbild.
- source_word: περὶ δὲ ἐπικουρίας
  choice: um Hilfe
  rationale: ἐπικουρία bezeichnet Beistand oder Hilfe. „Um Hilfe“ ist knapp, gegenwärtig und wahrt den parallelen Satzbau.
- source_word: τὸν ἀπειρότατον
  choice: den völlig Unerfahrenen
  rationale: Der Superlativ von ἄπειρος bezeichnet den, dem Erfahrung oder Vertrautheit vollständig fehlt. „Völlig unerfahren“ gibt die verstärkende Aussage idiomatisch wieder, ohne sie ausschließlich als körperliche Unfähigkeit auszulegen.
- source_word: ἱκετεύει
  choice: fleht ... an
  rationale: Das Verb bezeichnet eindringliches Bitten oder Anflehen. „Anflehen“ bewahrt die Intensität und den spöttischen Kontrast zum hilflosen Götzenbild.
- source_word: περὶ δὲ ὁδοιπορίας
  choice: für eine Reise
  rationale: ὁδοιπορία bezeichnet das Reisen oder eine Reise. Die konkrete Wendung passt zum folgenden Bild der Fortbewegungsunfähigkeit.
- source_word: τὸ μηδὲ βάσει χρῆσθαι δυνάμενον
  choice: den, der nicht einmal seinen Fuß gebrauchen kann
  rationale: Die Formulierung hält das konkrete Bewegungsbild fest. βάσις kann Fuß, Tritt beziehungsweise Standfläche oder Sockel bezeichnen; die für das Götzenbild bedeutsame zweite Möglichkeit wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wechsel zwischen sächlicher und männlicher Bezeichnung des Götzenbildes
  choice: Zunächst steht das unpersönliche „ein totes Ding“, danach folgen männliche substantivierte Bezeichnungen.
  alternative: Alle Bezüge einheitlich mit „es“ oder ausdrücklich mit „das Götzenbild“ wiedergeben.
  rationale: Der Wechsel entspricht den griechischen Formen τὸ νεκρόν, τὸν ἀπειρότατον und τὸ ... δυνάμενον und erhält die rhetorische Spannung zwischen leblosem Gegenstand und vermeintlich handlungsfähigem Gegenüber.
- issue: Bedeutung von ἀξιοῖ im Kontext der Bitte um Leben
  choice: „bittet er“
  alternative: „hält er ... für würdig“
  rationale: Obwohl ἀξιόω häufig „für würdig halten“ bedeutet, lässt sich die Konstruktion mit einem angesprochenen Gegenstand und περί samt Genitiv hier als Ersuchen verstehen. Diese Wiedergabe ist im Deutschen vollständig und lässt den Parallelismus mit dem Anflehen um Hilfe hervortreten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knappem dreigliedrigem Parallelismus. Die Wiederholung von „um/für“ bildet die griechischen περί-Gruppen ab; „ein totes Ding“ bewahrt die polemische Sachlichkeit des Neutrums.
