  text: For a man made them[a], and one who had borrowed the spirit formed them; for no man has the strength to fashion a god like himself.
translation:
  language: de
  text: Denn ein Mensch hat sie gemacht, und ein Mensch, der sich den Geist geliehen hat, hat sie geformt; denn kein Mensch vermag einen ihm selbst gleichen Gott zu gestalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος
  choice: Mensch
  rationale: Das zweimalige singularische »Mensch« stellt den menschlichen Hersteller den vermeintlichen Göttern gegenüber und bewahrt die allgemeine anthropologische Aussage ohne unnötige Geschlechtsspezifizierung.
- source_word: ἐποίησεν
  choice: hat … gemacht
  rationale: Die breite Bedeutung des Verbs passt zur Herstellung der Götzenbilder und klingt im Deutschen natürlich.
- source_word: τὸ πνεῦμα
  choice: Geist
  rationale: »Geist« entspricht dem griechischen Ausdruck formal und lässt zugleich die im Kontext mögliche Bedeutung »Atem/Lebensatem« offen; diese wird in der Fußnote genannt.
- source_word: δεδανεισμένος
  choice: nur geliehen
  rationale: Die Form bezeichnet den Geist als etwas Empfangenes, das dem Menschen nicht aus sich selbst zukommt. »Nur« verdeutlicht die im Kontext hervorgehobene Abhängigkeit, ohne eine zusätzliche dogmatische Aussage einzuführen.
- source_word: ἔπλασεν
  choice: hat … geformt
  rationale: Das Verb bezeichnet gestaltendes Formen und erhält gegenüber dem allgemeineren »gemacht« die handwerkliche Bildsprache.
- source_word: ὅμοιον
  choice: der ihm selbst gleicht
  rationale: Die Formulierung macht deutlich, dass der angebliche Gott seinem menschlichen Hersteller ähnlich gestaltet wird.
- source_word: ἰσχύει
  choice: vermag
  rationale: »Vermag« gibt Fähigkeit und Kraft prägnant wieder und bewahrt den würdigen Ton.
- source_word: πλάσαι
  choice: zu gestalten
  rationale: Die Wortwahl hält die handwerkliche Bedeutung fest und vermeidet im selben Satz eine schwerfällige Wiederholung von »formen«.
- source_word: θεόν
  choice: einen Gott
  rationale: Im Zusammenhang der Götzenpolemik bezeichnet der Ausdruck einen vermeintlichen Gott, nicht den wahren Gott.
theological_decisions:
- issue: Bedeutung des nur geliehenen Geistes für das menschliche Leben
  choice: Der Hersteller besitzt seinen Geist beziehungsweise sein Leben nur als etwas Empfangendes und nicht aus sich selbst.
  alternative: »Geliehener Atem« mit stärkerer Betonung der körperlichen Vergänglichkeit.
  rationale: Der Zusammenhang verspottet die Götzen, indem er die Abhängigkeit und Geschöpflichkeit ihres menschlichen Herstellers hervorhebt. »Geist« wahrt den weiteren Bedeutungsumfang, während die Fußnote die mögliche Nuance »Lebensatem« sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bewahrt die rhetorische Wiederholung und den Gegensatz zwischen dem abhängigen menschlichen Hersteller und dem von ihm gestalteten vermeintlichen Gott.
