- from: Denn ein Mensch hat sie gemacht, und mit einem nur geliehenen Geist[a] hat er sie geformt; denn kein Mensch vermag einen Gott zu gestalten, der ihm selbst gleicht.
  to: Denn ein Mensch hat sie gemacht, und ein Mensch, der sich den Geist geliehen hat, hat sie geformt; denn kein Mensch vermag einen ihm selbst gleichen Gott zu gestalten.
  rationale: Die Revision ordnet »den Geist geliehen« dem Hersteller als Partizipialaussage zu und vermeidet damit eine instrumentale Fehllektüre. Sie entfernt die nicht ausdrücklich im griechischen Text stehende Verstärkung »nur«, bewahrt aber die mögliche Bedeutung von πνεῦμα als Lebensatem in der Fußnote. Der Fußnotenanker bleibt am Wort »Geist« im revidierten Text erhalten.
