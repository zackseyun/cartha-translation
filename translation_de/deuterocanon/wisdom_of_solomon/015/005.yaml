base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/005.yaml
  text: The sight of them comes to fools as a reproach[a], and they long for the form of a lifeless image.
translation:
  language: de
  text: Ihr Anblick gereicht den Toren zur Schande, und sie begehren die atemlose Gestalt eines toten Bildes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher lässt sich der zweite Satzteil wiedergeben: „und [er] begehrt die atemlose Gestalt eines toten Bildes“. Das griechische Verb steht im Singular, sein Subjekt bleibt jedoch unausgesprochen; wahrscheinlich ist an einen der Toren beziehungsweise an den Toren als Typus gedacht.'
    reason: Die griechische Syntax lässt das Subjekt des singularischen Verbs ποθεῖ unausgesprochen, während „den Toren“ zuvor im Plural steht.
lexical_decisions:
- source_word: ὄψις
  choice: Anblick
  rationale: ὄψις kann das Sehen oder die sichtbare Erscheinung bezeichnen. „Anblick“ passt natürlich zu dem Genitiv ὧν und hält beides zusammen.
- source_word: ἄφροσιν
  choice: den Toren
  rationale: ἄφρων bezeichnet Menschen, denen Einsicht oder Weisheit fehlt. „Toren“ bewahrt den knappen, moralisch geprägten Gegensatz der Weisheitsliteratur.
- source_word: εἰς ὄνειδος ἔρχεται
  choice: gereicht … zur Schande
  rationale: Die deutsche Wendung gibt die resultative Konstruktion mit εἰς sowie die Substantivkraft von ὄνειδος präzise und idiomatisch wieder.
- source_word: ποθεῖ
  choice: sie begehren
  rationale: Das griechische Verb steht im Singular, doch der begehrende Träger ist im komprimierten Satz nicht ausdrücklich genannt. Inhaltlich liegt der Rückbezug auf „die Toren“ nahe; im Deutschen erfordert dieser pluralische Bezug „sie begehren“.
- source_word: νεκρᾶς εἰκόνος
  choice: eines toten Bildes
  rationale: Die wörtliche Wiedergabe erhält die scharfe Polemik gegen das Bild als etwas Totes und vermeidet, νεκρός und ἄπνους zu einem einzigen Begriff zu verschmelzen.
- source_word: εἶδος
  choice: Gestalt
  rationale: εἶδος bezeichnet hier die sichtbare Form. „Gestalt“ unterscheidet sich sinnvoll vom vorausgehenden „Anblick“.
- source_word: ἄπνουν
  choice: atemlose
  rationale: ἄπνους bedeutet wörtlich „ohne Atem“. „Atemlos“ bewahrt das konkrete Motiv fehlenden Lebensatems und ergänzt „tot“, ohne es bloß zu wiederholen.
theological_decisions:
- issue: Subjekt des Begehrens in der komprimierten zweiten Satzhälfte
  choice: 'Das Begehren wird auf die zuvor genannten Toren bezogen: „sie begehren“.'
  alternative: Das singularische Verb könnte mit einem nur mitgedachten einzelnen Tor verbunden oder formal auf „Anblick“ bezogen werden; Letzteres ergäbe jedoch einen schwer verständlichen Sinn.
  rationale: Der griechische Satz nennt für ποθεῖ kein eindeutiges ausdrückliches Subjekt. Der inhaltliche Bezug auf die Toren entspricht der Götzenbildpolemik, wird aber wegen der echten syntaktischen Spannung in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gereicht … zur Schande“ ist leicht gehoben, aber allgemein verständlich und bildet die griechische Konstruktion knapp ab. Die konkreten, polemischen Ausdrücke „tot“ und „atemlos“ bleiben bewusst nebeneinander stehen.
