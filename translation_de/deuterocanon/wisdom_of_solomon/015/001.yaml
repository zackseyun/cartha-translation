  text: But you, our God, are kind and true, patient, and governing all things with mercy.
translation:
  language: de
  text: Doch du, unser Gott, bist gütig und wahrhaftig, geduldig und regierst alles mit Erbarmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Doch du
  rationale: Bewahrt die direkte Anrede und den im Kontext bedeutsamen Gegensatz; „doch“ klingt im Deutschen natürlich und würdevoll.
- source_word: χρηστός
  choice: gütig
  rationale: Gibt die Güte und das wohlwollende Handeln Gottes prägnant wieder; „gütig“ passt im Deutschen besonders gut als Wesensbeschreibung.
- source_word: ἀληθής
  choice: wahrhaftig
  rationale: Bezeichnet Gottes wahres, zuverlässiges Wesen. „Wahrhaftig“ ist hier als Personenprädikat natürlicher und umfassender als das bloße „wahr“, ohne den Sinn auf „treu“ oder „aufrichtig“ zu verengen.
- source_word: μακρόθυμος
  choice: geduldig
  rationale: Gibt die Langmut beziehungsweise das langsame Zürnen in allgemein verständlichem, modernem Deutsch wieder.
- source_word: ἐλέει
  choice: mit Erbarmen
  rationale: Bewahrt das Substantiv und gibt den Dativ als Art und Weise des Regierens wieder.
- source_word: διοικῶν
  choice: regierst
  rationale: Drückt Gottes gegenwärtige Leitung und Verwaltung des Ganzen klar aus. Die finite Koordination ist im Deutschen natürlicher als eine wörtliche Partizipialkonstruktion.
- source_word: τὰ πάντα
  choice: alles
  rationale: Gibt den umfassenden Sinn knapp und idiomatisch wieder, ohne ihn deutend auf „das Universum“ einzuengen.
theological_decisions:
- issue: Gottes Herrschaft und Erbarmen im Partizipialsatz
  choice: Gott regiert alles mit Erbarmen.
  alternative: Gott ordnet beziehungsweise verwaltet alles in Erbarmen.
  rationale: Die Wiedergabe bewahrt sowohl die umfassende göttliche Leitung als auch das Erbarmen als deren bestimmende Art, ohne daraus ein weitergehendes Lehrsystem abzuleiten.
- issue: Bedeutungsumfang von ἀληθής als Gottesprädikat
  choice: wahrhaftig
  alternative: wahr oder treu
  rationale: „Wahrhaftig“ hält die Aussage über Gottes wahres und verlässliches Wesen offen; „treu“ würde stärker auf Bundestreue festlegen, während „wahr“ im modernen Deutschen leicht unpersönlich klingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Die Satzstruktur bleibt knapp und folgt der Reihung der griechischen Gottesprädikate; die Partizipialform wird für natürliches Deutsch finit wiedergegeben.
