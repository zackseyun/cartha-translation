  naturalness: Die Fassung ist insgesamt verständlich und würdig. „Gegenstände seiner Verehrung“ ist im Deutschen natürlicher und präziser als die umschreibende Relativkonstruktion „die Dinge, die er verehrt“. „Ist … überlegen“ gibt den Vergleich κρείττων natürlich wieder.
  terminology: „Sterblicher“, „etwas Totes“ und „gesetzlosen Händen“ bewahren die polemische Bildsprache des griechischen Textes. „Gegenstände seiner Verehrung“ gibt σεβάσματα nicht vorschnell als „Götzenbilder“ festgelegt wieder; diese kontextuelle Alternative bleibt angemessen in der Fußnote.
