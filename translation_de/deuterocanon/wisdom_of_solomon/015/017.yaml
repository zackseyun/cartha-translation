  text: Yet being mortal[a], he makes a dead thing with lawless hands; for he is better than the things he worships, since he himself once lived, but those never did.
translation:
  language: de
  text: 'Als Sterblicher fertigt er mit gesetzlosen Händen etwas Totes an; denn er ist den Gegenständen seiner Verehrung überlegen: Er selbst lebte, jene dagegen nie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Götzenbilder“.'
    reason: Lexikalische Alternative für σεβάσματα im unmittelbaren Zusammenhang der Götzenverehrung.
lexical_decisions:
- source_word: θνητὸς
  choice: sterblich
  rationale: Bezeichnet einen Menschen, der dem Tod unterworfen ist, und erhält den Gegensatz zum völlig leblosen Götzen.
- source_word: νεκρὸν
  choice: etwas Totes
  rationale: Das substantivierte Adjektiv bezeichnet hier ein totes, lebloses Gebilde; „Leichnam“ wäre im Zusammenhang irreführend.
- source_word: ἐργάζεται
  choice: fertigt … an
  rationale: Im Zusammenhang mit der Herstellung eines Götzen bezeichnet das Verb das Anfertigen oder Hervorbringen.
- source_word: χερσὶν ἀνόμοις
  choice: mit gesetzlosen Händen
  rationale: Die instrumentale Wendung wird eng am griechischen Ausdruck wiedergegeben und bewahrt den Gedanken des Handelns gegen das göttliche Gesetz.
- source_word: κρείττων
  choice: besser
  rationale: Die einfache Vergleichsform erhält die umfassende Überlegenheit des lebenden Herstellers gegenüber seinem leblosen Werk.
- source_word: τῶν σεβασμάτων αὐτοῦ
  choice: als die Dinge, die er verehrt
  rationale: σεβάσματα bezeichnet Gegenstände religiöser Verehrung. Die Formulierung bleibt nahe am lexikalischen Sinn, ohne den im Kontext eindeutigen Götzenbezug in den Haupttext hineinzudeuten.
- source_word: ἔζησεν
  choice: hat gelebt
  rationale: Der Aorist stellt fest, dass der sterbliche Hersteller tatsächlich Leben besaß, anders als die Götzen, die niemals lebten.
- source_word: οὐδέποτε
  choice: niemals
  rationale: Das Adverb verneint ausdrücklich, dass die verehrten Dinge zu irgendeiner Zeit gelebt hätten.
theological_decisions:
- issue: Wiedergabe von σεβάσματα im Zusammenhang der Götzenkritik
  choice: die Dinge, die er verehrt
  alternative: seine Götzenbilder
  rationale: Die gewählte Fassung bewahrt den allgemeineren Wortsinn „Gegenstände der Verehrung“, während die Fußnote die kontextuell naheliegende, aber stärker deutende Wiedergabe nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bewusst markante Ausdruck „mit gesetzlosen Händen“ bewahrt die Bildsprache und den Bezug auf Gesetzlosigkeit; der zweite Satz erhält den zugespitzten Gegensatz zwischen dem einst lebenden Hersteller und den niemals lebenden Kultgegenständen.
