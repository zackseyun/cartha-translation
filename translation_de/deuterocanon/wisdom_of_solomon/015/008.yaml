base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/008.yaml
  text: And with wicked toil he molds a futile god from the same clay—he who a little before had come from the earth[a], and after a short time goes back to the earth from which he was taken, when the debt of his soul is demanded.
translation:
  language: de
  text: Und einer, der sich elend abmüht, formt aus demselben Ton einen nichtigen Gott – er, der erst vor Kurzem aus Erde entstanden ist und wenig später zu der Erde zurückkehrt, aus der er genommen wurde, wenn die Schuld seiner Seele[a] eingefordert wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seines Lebens“. Das griechische Wort ψυχή kann „Seele“ oder „Leben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακόμοχθος
  choice: mit böser Mühe
  rationale: Die Wendung bewahrt sowohl den Gedanken mühevoller Arbeit als auch deren negative, im Zusammenhang moralisch verwerfliche Qualität.
- source_word: θεὸν μάταιον
  choice: einen nichtigen Gott
  rationale: „Nichtig“ gibt die Leere, Wirkungslosigkeit und Vergeblichkeit von μάταιος wieder und wahrt zugleich den ironischen Gegensatz zwischen dem vergänglichen Hersteller und seinem vermeintlichen Gott.
- source_word: πλάσσει
  choice: formt
  rationale: Das Verb bezeichnet hier das Gestalten von Ton; „formt“ ist im Deutschen natürlich und bildhaft.
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  choice: aus demselben Ton
  rationale: „Derselbe“ hebt ausdrücklich hervor, dass Götzenbild und gewöhnliche Töpferware aus identischem Material bestehen.
- source_word: ὃς
  choice: er, der
  rationale: Die Wiedergabe macht deutlich, dass sich das Relativpronomen auf den Hersteller und nicht auf den geformten Gott bezieht.
- source_word: πρὸ μικροῦ
  choice: erst vor Kurzem
  rationale: Die Formulierung bezeichnet den noch nicht lange zurückliegenden Ursprung des Menschen und klingt in modernem Deutsch natürlich.
- source_word: ἐκ γῆς γενηθεὶς
  choice: aus Erde entstanden ist
  rationale: „Entstanden“ gibt γενηθεὶς weit genug wieder, ohne es unnötig auf Geburt oder eine bestimmte Art des Geschaffenwerdens festzulegen.
- source_word: μετʼ ὀλίγον πορεύεται
  choice: wenig später … zurückkehrt
  rationale: Im Zusammenhang beschreibt die Bewegung den baldigen Tod und die Rückkehr zur Erde; „zurückkehrt“ verdeutlicht diese durch den Folgesatz bestimmte Richtung.
- source_word: ἐξ ἧς ἐλήμφθη
  choice: zu der Erde …, aus der er genommen wurde
  rationale: Die erneute Nennung der Erde verhindert ein unklares Bezugswort und bewahrt den Anklang an die Schöpfung des Menschen aus Erde.
- source_word: τὸ τῆς ψυχῆς ἀπαιτηθεὶς χρέος
  choice: wenn die Schuld seiner Seele eingefordert wird
  rationale: „Schuld“ und „eingefordert“ erhalten das Bild einer fälligen Forderung; „Seele“ wahrt die anthropologische Ausdrucksweise des griechischen Textes.
theological_decisions:
- issue: Bedeutung von ψυχή im Zusammenhang menschlicher Sterblichkeit
  choice: Seele
  alternative: Leben
  rationale: ψυχή kann hier sowohl „Seele“ als auch „Leben“ bedeuten. „Seele“ hält sich eng an die anthropologische Ausdrucksweise und bewahrt die theologische Spannung; die ebenso mögliche Bedeutung „Leben“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich markiert den ironischen Gegensatz zwischen dem vergänglichen Menschen und dem von ihm geformten Gott. Die Satzstruktur bleibt dem griechischen Gedankengang eng verbunden, ohne im Deutschen unnötig schwerfällig zu werden.
