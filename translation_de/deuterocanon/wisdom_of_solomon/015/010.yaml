  text: His heart is ashes[a], and his hope is more worthless than earth, and his life more dishonored than clay[b],
translation:
  language: de
  text: Sein Herz ist Asche, seine Hoffnung ist wertloser als Erde[a], und sein Leben ist weniger geachtet als Ton[b].
  philosophy: optimal-equivalence
  footnotes:
