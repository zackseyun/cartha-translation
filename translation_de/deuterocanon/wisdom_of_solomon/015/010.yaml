lexical_decisions:
- source_word: σποδός
  choice: Asche
  rationale: Das prädikative Bild wird direkt und ohne abschwächenden Vergleich wiedergegeben; „Asche“ bezeichnet hier bildhaft Leblosigkeit und völlige Wertlosigkeit.
- source_word: καρδία
  choice: Herz
  rationale: „Herz“ bewahrt den geläufigen biblischen Ausdruck für das innere Wesen des Menschen, ohne ihn auf Verstand oder Gefühl einzuengen.
- source_word: γῆς
  choice: Erde
  rationale: Der Genitiv bezeichnet den Vergleichsmaßstab. „Erde“ erhält den weiten materiellen Sinn und passt zur anschließenden Erwähnung von Ton.
- source_word: εὐτελεστέρα
  choice: wertloser
  rationale: Der Komparativ bezeichnet einen noch geringeren Wert; „wertloser“ gibt die scharfe polemische Aussage natürlicher wieder als „billiger“.
- source_word: ἐλπίς
  choice: Hoffnung
  rationale: Dies ist die naheliegende Wiedergabe und bewahrt die Aussage über das, worauf der Betreffende seine Erwartung setzt.
- source_word: πηλοῦ
  choice: Ton
  rationale: Im Zusammenhang mit der Herstellung von Götzen bezeichnet das Wort formbares Erdmaterial; „Ton“ ist hier präziser als „Schlamm“.
- source_word: ἀτιμότερος
  choice: weniger geachtet
  rationale: Die Formulierung bewahrt den Bedeutungsaspekt fehlender Ehre oder Wertschätzung, ohne ihn ausschließlich als materielle Wertlosigkeit auszulegen.
- source_word: βίος
  choice: Leben
  rationale: In der dreigliedrigen Folge von Herz, Hoffnung und Leben bezeichnet das Wort am natürlichsten die gesamte Existenz des Menschen.
theological_decisions:
- issue: Bildhafte Aussagen über den Götzendiener
  choice: Die drei Aussagen werden als direkte Prädikationen wiedergegeben.
  alternative: „Sein Herz ist wie Asche“ oder eine psychologisierende Umschreibung.
  rationale: Der griechische Text formuliert ohne Vergleichspartikel. Die direkte Wiedergabe erhält die Härte der antiken Götzenpolemik und schwächt ihre theologische Spannung nicht ab.
- issue: Bedeutung von ἀτιμότερος
  choice: „weniger geachtet“ mit Hinweis auf „verachteter“ als mögliche Wiedergabe.
  alternative: „wertloser“ oder „schändlicher“.
  rationale: Der griechische Ausdruck betrifft vor allem fehlende Ehre beziehungsweise Achtung. Die gewählte Fassung vermeidet, ihn auf bloßen Sachwert oder moralische Schändlichkeit zu verengen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer dreigliedriger Satzstruktur. Die knappen, drastischen Bilder des griechischen Textes bleiben erhalten; die Vergleichsformen werden im Deutschen natürlich ausgedrückt.
