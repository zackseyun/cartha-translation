  text: For neither did the evil-crafted invention of men lead us astray[a], nor the fruitless labor of a painter of shadows—an image stained with varied colors[b];
translation:
  language: de
  text: Denn weder führte uns die kunstvoll erdachte böse Machenschaft der Menschen in die Irre[a] noch die fruchtlose Mühe von Schattenmalern – ein mit verschiedenen Farben beschmiertes Bild[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „täuschte uns“. Das griechische Verb kann sowohl Täuschung als auch ein Abbringen vom rechten Weg ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Schattenmaler“ bezeichnet hier Künstler, die mit Umrissen oder Schattierungen arbeiten; die Wendung richtet sich kritisch gegen die Hersteller bemalter Götzenbilder.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπλάνησεν
  choice: führte uns in die Irre
  rationale: Bewahrt sowohl den Gedanken des Täuschens als auch das Bild des Abirrens und ist im Deutschen natürlich.
- source_word: ἀνθρώπων κακότεχνος ἐπίνοια
  choice: die kunstvoll-böse Erfindung der Menschen
  rationale: „Kunstvoll-böse“ erhält die Verbindung von handwerklichem Geschick und moralischer Verurteilung; „Erfindung“ bezeichnet hier das menschliche Gebilde beziehungsweise die ersonnene Hervorbringung.
- source_word: σκιαγράφων
  choice: der Schattenmaler
  rationale: Gibt die konkrete Bezeichnung für Künstler wieder, die mit Umrissen oder Schattierungen arbeiten, ohne sie zum allgemeinen „Maler“ abzuschwächen.
- source_word: πόνος ἄκαρπος
  choice: die fruchtlose Mühe
  rationale: Entspricht der bildhaften Wertung eines Aufwands, der keinen wahren Ertrag hervorbringt.
- source_word: εἶδος
  choice: Bild
  rationale: Im Zusammenhang der Götzenherstellung bezeichnet das Wort die sichtbare, gestaltete Darstellung.
- source_word: σπιλωθὲν
  choice: beflecktes
  rationale: Bewahrt das konkrete Beschmutzen oder Überziehen mit Farbe sowie den negativen Beiklang des griechischen Ausdrucks.
- source_word: χρώμασιν διηλλαγμένοις
  choice: mit verschiedenartigen Farben
  rationale: Gibt wieder, dass die verwendeten Farben voneinander verschieden beziehungsweise abwechslungsreich sind.
theological_decisions:
- issue: Die Polemik gegen götzendienerische Kunst, ohne ihre moralische Schärfe zu mildern
  choice: Die menschliche Erfindung wird als „kunstvoll-böse“ und das bemalte Bild als „befleckt“ bezeichnet.
  alternative: 'Neutraler: „kunstfertige Erfindung“ und „mit verschiedenen Farben bemaltes Bild“.'
  rationale: κακότεχνος und σπιλωθέν tragen im Kontext eine deutlich abwertende Kraft. Die Übersetzung wahrt diese, ohne über den griechischen Wortlaut hinaus eine bestimmte konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Wortbildung „kunstvoll-böse“ bewahrt die doppelte handwerkliche und moralische Aussage von κακότεχνος. Der Doppelpunkt bildet die appositionelle Erläuterung durch εἶδος nach.
