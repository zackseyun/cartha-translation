    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγνόησεν
  choice: erkannte nicht
  rationale: ἀγνοέω kann Nichtwissen oder Nichterkennen bezeichnen. „Erkannte nicht“ ist im Deutschen natürlich und lässt offen, ob Unkenntnis oder schuldhaftes Verkennen im Vordergrund steht.
- source_word: πλάσαντα
  choice: der ihn geformt hatte
  rationale: πλάσσω bezeichnet das Formen oder Gestalten und bewahrt hier die Schöpfungsbildlichkeit, ohne einen bestimmten Werkstoff hinzuzufügen.
- source_word: ἐμπνεύσαντα
  choice: der ihm … einhauchte
  rationale: Die Zusammensetzung bezeichnet das Einhauchen von Atem in jemanden. „Einhauchen“ gibt das konkrete Schöpfungsbild knapp und idiomatisch wieder.
- source_word: ψυχὴν ἐνεργοῦσαν
  choice: eine wirksame Seele
  rationale: ψυχή wird als „Seele“ wiedergegeben; ἐνεργοῦσαν bedeutet tätig, wirksam oder wirkend. „Wirksam“ bleibt eng am griechischen Ausdruck, ohne ihn vorschnell als bloß „lebendig“ auszulegen.
- source_word: ἐμφυσήσαντα
  choice: einblies
  rationale: Das zweite Verb aus dem Wortfeld des Hauchens wird zur Wahrung der Variation und Parallelität mit „einblies“ wiedergegeben.
- source_word: πνεῦμα ζωτικόν
  choice: einen lebenspendenden Geist
  rationale: πνεῦμα kann Geist oder Atem bedeuten, ζωτικός lebenspendend beziehungsweise lebenskräftig. Die Wiedergabe erhält beide Begriffe und vermeidet eine vollständige Angleichung an die Formulierung aus Genesis.
theological_decisions:
- issue: Anthropologische Beziehung zwischen ψυχή und πνεῦμα
  choice: Die beiden Begriffe werden unterschieden als „Seele“ und „Geist“ wiedergegeben.
  alternative: Beide allgemeiner als Leben oder Lebensatem wiedergeben.
  rationale: Der griechische Text gebraucht bewusst zwei verschiedene Begriffe in paralleler Stellung. Ihre Unterscheidung wird bewahrt, ohne daraus eine spätere systematische Anthropologie abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt die dreifache Schöpferbeschreibung und die Parallelität der beiden Hauch-Verben. Die Marker stehen jeweils unmittelbar bei dem Ausdruck, den die Fußnote erläutert.
