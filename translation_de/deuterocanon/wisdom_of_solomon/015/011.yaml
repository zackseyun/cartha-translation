translation:
  language: de
  text: Denn er erkannte den nicht[a], der ihn geformt und ihm eine wirksame Seele[b] eingehaucht und einen lebenspendenden Geist eingeblasen hatte.
  philosophy: optimal-equivalence
  footnotes:
