  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/013.yaml
  text: For this man knows better than all others that he is sinning[a], making fragile vessels and carved images out of earthy material.
translation:
  language: de
  text: Denn dieser weiß besser als alle anderen, dass er sündigt,[a] indem er aus erdigem Material zerbrechliche Gefäße und geschnitzte Bilder herstellt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mehr als alle anderen weiß dieser, dass er sündigt.“ Die griechische Vergleichswendung kann mit leicht abweichender Wortstellung wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: dieser
  rationale: Das Demonstrativpronomen verweist auf den zuvor behandelten Hersteller von Götzenbildern und bewahrt den persönlichen Singular.
- source_word: παρὰ πάντας
  choice: besser als alle anderen
  rationale: In Verbindung mit οἶδεν bezeichnet die Wendung einen Vergleich des Wissens; die deutsche Formulierung gibt dies idiomatisch wieder, ohne den Bezugskreis unnötig festzulegen.
- source_word: οἶδεν
  choice: weiß
  rationale: Die schlichte Wiedergabe bewahrt den Gedanken bewusster Kenntnis, der für die moralische Aussage des Verses entscheidend ist.
- source_word: ὅτι ἁμαρτάνει
  choice: dass er sündigt
  rationale: Das Präsens wird im Deutschen natürlich als gegenwärtige beziehungsweise fortdauernde Tätigkeit ausgedrückt.
- source_word: ὕλης γεώδους
  choice: aus erdiger Materie
  rationale: ὕλη bezeichnet Stoff oder Materie, γεώδης etwas Erdiges beziehungsweise Erde Ähnliches. Die Wiedergabe vermeidet die zu enge Festlegung auf Ton.
- source_word: εὔθραυστα σκεύη
  choice: zerbrechliche Gefäße
  rationale: εὔθραυστα hebt die leichte Zerbrechlichkeit hervor; σκεύη wird im handwerklichen Zusammenhang passend mit „Gefäße“ wiedergegeben.
- source_word: γλυπτὰ
  choice: geschnitzte Bilder
  rationale: Die Formulierung bleibt beim konkreten Sinn von geschnitzten beziehungsweise gemeißelten Werken; dass es sich um Götzenbilder handelt, ergibt sich aus dem Kontext.
- source_word: δημιουργῶν
  choice: herstellt
  rationale: Das Partizip beschreibt die Tätigkeit des Handwerkers. „herstellt“ ist gegenwärtig, klar und für beide Objektgruppen geeignet.
theological_decisions:
- issue: Moralisches Wissen und Schuld des Götzenbildners
  choice: Der Handwerker weiß, dass sein Tun Sünde ist.
  alternative: 'Die Vergleichswendung kann auch enger mit dem ganzen Satz verbunden werden: „Mehr als alle anderen weiß dieser, dass er sündigt.“'
  rationale: Die Syntax betont seine bewusste Kenntnis des sündhaften Handelns. Die Übersetzung bewahrt diese moralische Aussage, ohne eine weitergehende Lehrfolgerung hinzuzufügen.
- issue: Bezug des modalen Partizips δημιουργῶν
  choice: „wenn er … herstellt“ kennzeichnet die Tätigkeit, in der sich sein Sündigen vollzieht.
  alternative: 'Eine beigeordnete Formulierung wäre möglich: „und stellt dabei … her“.'
  rationale: Das griechische Präsenspartizip steht zugleich zur Haupthandlung und lässt sich im Deutschen natürlich als begleitender beziehungsweise konkretisierender Umstand wiedergeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Materie“ hält den umfassenden Sinn von ὕλη fest; „erdig“ bewahrt die stoffliche und niedrige Herkunft, ohne Ton ausdrücklich einzutragen. Die Vergleichsmehrdeutigkeit wird in der Fußnote erhalten.
