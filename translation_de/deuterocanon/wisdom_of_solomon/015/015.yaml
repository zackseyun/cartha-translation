  source_fidelity: 'Die Übersetzung gibt die griechische Aussage zuverlässig wieder: die Götzenbilder der Völker werden als Götter angesehen, verfügen aber über keine funktionierende Seh-, Atem-, Hör-, Tast- oder Gehfähigkeit. »hielten … für« trifft ἐλογίσαντο; »Götzenbilder«, »Völker« und »Götter« entsprechen dem polemischen Kontext und dem Wortlaut. Die Funktionsangaben und der abschließende Hinweis auf die zum Gehen untauglichen Füße sind sachgerecht wiedergegeben.'
