base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/015.yaml
  text: For they even considered all the idols of the nations to be gods—things that have neither the use of eyes for seeing[a], nor noses for drawing in air, nor ears to hear, nor fingers of hands for feeling, and their feet are useless for walking.
translation:
  language: de
  text: Denn sie hielten sogar alle Götzenbilder der Völker für Götter. Diese können weder ihre Augen zum Sehen gebrauchen noch ihre Nasen, um Luft einzuziehen, noch ihre Ohren zum Hören noch die Finger ihrer Hände zum Tasten; und ihre Füße taugen nicht zum Gehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλογίσαντο
  choice: hielten … für
  rationale: Die idiomatische deutsche Konstruktion gibt das wertende Dafürhalten des Verbs präzise wieder.
- source_word: εἴδωλα
  choice: Götzenbilder
  rationale: Im polemischen Zusammenhang sind konkrete Kultbilder gemeint, die für Götter gehalten werden; »Götzenbilder« bewahrt beides.
- source_word: ἐθνῶν
  choice: der Völker
  rationale: Die Wiedergabe ist im jüdischen Weisheitskontext sachlich und vermeidet die stärker neutestamentlich geprägte Bezeichnung »Heiden«.
- source_word: θεούς
  choice: Götter
  rationale: Der einfache Plural entspricht der Behauptung, die Bilder seien als Götter angesehen worden.
- source_word: ὀμμάτων χρῆσις εἰς ὅρασιν
  choice: ihre Augen zum Sehen gebrauchen
  rationale: Diese Formulierung bewahrt den funktionalen Gedanken von χρῆσις und klingt zugleich natürlich auf Deutsch.
- source_word: συνολκὴν ἀέρος
  choice: Luft einzuziehen
  rationale: Die Wendung bildet das konkrete Einziehen der Luft eng ab, ohne es lediglich mit »atmen« zu paraphrasieren.
- source_word: δάκτυλοι χειρῶν εἰς ψηλάφησιν
  choice: die Finger ihrer Hände zum Tasten
  rationale: »Tasten« gibt ψηλάφησις prägnant wieder; »Finger ihrer Hände« bewahrt die ausdrückliche griechische Genitivverbindung.
- source_word: ἀργοὶ πρὸς ἐπίβασιν
  choice: taugen nicht zum Gehen
  rationale: Die Formulierung vermittelt sowohl die Untauglichkeit beziehungsweise Wirkungslosigkeit von ἀργοί als auch die Fortbewegung, auf die ἐπίβασις hier zielt.
theological_decisions:
- issue: Die polemische Darstellung der Götzenbilder
  choice: Die Bilder werden als leblose Gegenstände dargestellt, die fälschlich für Götter gehalten werden.
  alternative: Eine streng formale, schwerfälligere Reihung der fehlenden Körperfunktionen.
  rationale: Die Übersetzung erhält die scharfe Kritik des Ausgangstextes und seine Aufzählung fehlender Sinnes- und Bewegungsfähigkeiten, ohne zusätzliche theologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Konstruktion »zum …« erhält die rhetorische Reihung; der Wechsel zum abschließenden selbstständigen Satzteil hebt die Bewegungsunfähigkeit hervor.
