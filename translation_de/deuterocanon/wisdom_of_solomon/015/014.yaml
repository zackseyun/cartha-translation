base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/014.yaml
  text: But all of them are most foolish and more miserable than an infant's soul—these enemies of your people who oppressed it.
translation:
  language: de
  text: Doch sie alle sind überaus töricht und erbärmlicher als die Seele eines Säuglings[a] – die Feinde deines Volkes, die es unterdrückt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bemitleidenswerter als ein Säugling« oder »erbärmlicher als das Leben eines Säuglings«. Der griechische Ausdruck vergleicht sie wörtlich mit der »Seele« beziehungsweise dem »Leben eines Säuglings« und kann äußerste Schwäche oder einen bemitleidenswerten Zustand hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: sie alle
  rationale: Bewahrt den umfassenden Bezug und führt im Deutschen natürlich zur nachgestellten Bestimmung der Gemeinten.
- source_word: ἀφρονέστατοι
  choice: überaus töricht
  rationale: Gibt den Superlativ als höchsten Grad der Unvernunft in natürlichem, würdigem Deutsch wieder.
- source_word: τάλανες ὑπὲρ
  choice: erbärmlicher als
  rationale: Versteht ὑπέρ komparativ und bewahrt den Sinn einer besonders elenden beziehungsweise bemitleidenswerten Verfassung.
- source_word: ψυχὴν νηπίου
  choice: die Seele eines Säuglings
  rationale: Bewahrt die ungewöhnliche und verdichtete griechische Metapher; ψυχή kann auch »Leben« bedeuten.
- source_word: οἱ ἐχθροὶ τοῦ λαοῦ σου
  choice: die Feinde deines Volkes
  rationale: Gibt die appositionelle Identifizierung der zuvor mit »sie alle« Bezeichneten unmittelbar wieder.
- source_word: οἱ καταδυναστεύσαντες αὐτόν
  choice: die es unterdrückt haben
  rationale: καταδυναστεύω bezeichnet gewaltsame beziehungsweise tyrannische Unterdrückung; das singularische Pronomen nimmt das griechisch wie deutsch singularische Kollektiv »Volk« auf.
theological_decisions:
- issue: Bedeutung des Vergleichs ὑπὲρ ψυχὴν νηπίου
  choice: »erbärmlicher als die Seele eines Säuglings« als Aussage über einen äußerst elenden oder bemitleidenswerten Zustand
  alternative: »bemitleidenswerter als ein Säugling« oder »erbärmlicher als das Leben eines Säuglings«
  rationale: Die griechische Formulierung ist semantisch verdichtet und ungewöhnlich. Die Übersetzung wahrt sowohl ψυχή als »Seele« als auch die Vergleichsstruktur, ohne die mögliche Betonung von Schwäche oder Hilflosigkeit festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildsprache des Griechischen bleibt im Haupttext erhalten und wird in der Fußnote erläutert; der Gedankenstrich macht die nachgestellte Apposition kenntlich.
