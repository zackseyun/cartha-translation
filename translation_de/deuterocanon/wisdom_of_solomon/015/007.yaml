base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/007.yaml
  text: For a potter[a], kneading soft earth with toil, molds each vessel for our service; yet from the same clay he formed both the vessels that are servants to clean uses and those for the contrary, all alike. But which is the use of each of them, the potter is the judge.
translation:
  language: de
  text: Denn auch ein Töpfer bearbeitet weiche Erde und formt mühevoll jedes Gefäß für unseren Gebrauch. Doch aus demselben Ton hat er sowohl Gefäße geformt, die reinen Verwendungen dienstbar sind,[a] als auch solche für das Gegenteil, beide gleichermaßen. Welche Verwendung jedes einzelne von ihnen hat, darüber entscheidet der Töpfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Gefäße, die Sklaven reiner Verwendungen/Werke sind“. Das griechische δοῦλα („Sklaven“, „versklavt“) bezeichnet hier bildlich Gefäße, die einer bestimmten Verwendung zugeordnet sind.'
    reason: Die Fußnote macht die im Deutschen idiomatisch wiedergegebene Sklavenmetapher sowie die Bandbreite von ἔργα transparent.
lexical_decisions:
- source_word: κεραμεύς / πηλουργός
  choice: Töpfer
  rationale: „Töpfer“ ist die natürliche und genaue deutsche Bezeichnung für den Handwerker, der Ton formt. Die Wiederholung im letzten Satz sorgt für Klarheit.
- source_word: ἁπαλὴν γῆν
  choice: weiche Erde
  rationale: Die wörtliche Unterscheidung zwischen γῆ („Erde“) und dem später folgenden πηλός („Ton“) bleibt erhalten.
- source_word: θλίβων ἐπίμοχθον
  choice: bearbeitet … mühevoll
  rationale: „Bearbeitet“ umfasst das Drücken und Kneten des Materials, während „mühevoll“ die mit ἐπίμοχθον bezeichnete Anstrengung wiedergibt, ohne eine bestimmte Handbewegung übermäßig festzulegen.
- source_word: πλάσσει / ἀνεπλάσατο
  choice: formt / gestaltet
  rationale: Beide Verben gehören zum Bilden von Ton. Zwei naheliegende deutsche Verben vermeiden eine schwerfällige Wiederholung.
- source_word: πρὸς ὑπηρεσίαν ἡμῶν
  choice: für unseren Gebrauch
  rationale: Gemeint ist die praktische Verwendung im menschlichen Dienst; „Gebrauch“ ist in diesem Zusammenhang natürlich und präzise.
- source_word: ἕκαστον
  choice: jedes Gefäß
  rationale: Das Substantiv ist im Griechischen zunächst unausgesprochen, ergibt sich aber eindeutig aus dem Töpferbild und wird für verständliches Deutsch ergänzt.
- source_word: πηλοῦ
  choice: Ton
  rationale: „Ton“ ist im Töpferkontext die übliche und genaue Wiedergabe von πηλός.
- source_word: τὰ τῶν καθαρῶν ἔργων δοῦλα σκεύη
  choice: Gefäße, die reinen Zwecken dienstbar sind
  rationale: „Dienstbar“ bewahrt die Metapher zu δοῦλα, klingt im Deutschen jedoch weniger missverständlich als die rein wörtliche Formulierung „Sklaven reiner Tätigkeiten“. καθαρῶν bleibt mit „rein“ offen für kultische wie praktische Reinheit.
- source_word: τὰ ἐναντία
  choice: solche für das Gegenteil
  rationale: Das Griechische nennt nicht ausdrücklich „unreine“ Zwecke, sondern lediglich das Entgegengesetzte; diese Offenheit bleibt erhalten.
- source_word: πάνθ’ ὁμοίως
  choice: in gleicher Weise sowohl … als auch
  rationale: Die Formulierung unterstreicht, dass beide Arten von Gefäßen aus demselben Material und auf gleiche Weise hergestellt werden.
- source_word: κριτὴς
  choice: darüber entscheidet
  rationale: Die prädikative Aussage „ist Richter“ wird idiomatisch verbal wiedergegeben, ohne die Entscheidungsbefugnis des Töpfers abzuschwächen.
theological_decisions:
- issue: Metaphorische Wiedergabe von δοῦλα
  choice: „die reinen Zwecken dienstbar sind“ mit Fußnote zur wörtlichen Sklavenmetapher
  alternative: „die Sklaven reiner Tätigkeiten sind“ oder schlicht „für reine Zwecke“
  rationale: Die gewählte Fassung bewahrt das Motiv der gebundenen, zugewiesenen Funktion, ohne im Deutschen den falschen Eindruck zu erwecken, die unbelebten Gefäße würden unmittelbar als Personen bezeichnet. Die Fußnote macht die volle Bildsprache des griechischen Ausdrucks transparent.
- issue: Bedeutung von καθαρῶν und ἐναντία
  choice: „reinen Zwecken“ und „für das Gegenteil“
  alternative: „sauberen Verwendungen“ und „für unreine Verwendungen“
  rationale: „Rein“ lässt die mögliche kultische Dimension bestehen. Zugleich wird das nur implizierte Gegenteil nicht ausdrücklich als „unrein“ ausformuliert, sodass die Spannung des Ausgangstextes erhalten bleibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, leicht gehobenem Ton. Das Töpferbild bleibt konkret; unnötige Fachsprache und konfessionell festgelegte Deutungen werden vermieden.
