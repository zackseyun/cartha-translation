  text: Even the most hateful animals they revere; for[a], compared in foolishness with the others, they are worse.
translation:
  language: de
  text: Sogar die widerwärtigsten Tiere verehren sie[a]; denn verglichen mit den anderen sind diese in ihrer Unvernunft schlimmer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beten sie an“ oder „bringen ihnen religiöse Verehrung entgegen“. Das griechische Verb kann religiöse Ehrfurcht in unterschiedlicher Stärke bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ζῷα
  choice: die Tiere
  rationale: ζῷα bezeichnet allgemein Lebewesen beziehungsweise Tiere; im Zusammenhang tiergestaltiger Kultbilder ist „Tiere“ klar und natürlich.
- source_word: τὰ ἔχθιστα
  choice: die widerwärtigsten
  rationale: Der Superlativ von ἐχθρός bewertet diese Tiere als besonders abstoßend oder verhasst. „Die widerwärtigsten“ bewahrt die Steigerung und passt im Deutschen idiomatisch zum Kontext.
- source_word: σέβονται
  choice: verehren sie
  rationale: σέβομαι bezeichnet ehrfürchtige, häufig religiöse Verehrung. „Verehren“ wahrt diese religiöse Bedeutung, ohne den kultischen Vorgang enger festzulegen als das Griechische.
- source_word: ἀνοίᾳ
  choice: hinsichtlich ihrer Unvernunft
  rationale: Der Dativ gibt hier den Bereich beziehungsweise Maßstab des Vergleichs an. „Unvernunft“ bewahrt die moralisch-intellektuelle Wertung von ἄνοια.
- source_word: συγκρινόμενα τῶν ἄλλων
  choice: wenn diese … mit den anderen verglichen werden
  rationale: Die partizipiale Vergleichskonstruktion wird als natürlicher deutscher Nebensatz wiedergegeben; der Genitiv bezeichnet die Vergleichsgruppe.
- source_word: χείρονα
  choice: schlimmer
  rationale: χείρονα ist der Komparativ „schlechter/schlimmer“. „Schlimmer“ erhält den wertenden Ton und schließt gut an die beschriebene Unvernunft an.
theological_decisions:
- issue: Religiöse Aussagekraft von σέβονται
  choice: verehren
  alternative: anbeten; ehrfürchtig achten
  rationale: Der Vers verurteilt religiöse Verehrung von Tieren. „Verehren“ gibt die kultische Färbung wieder, lässt aber die im Verb bestehende Spannweite offen und legt sich nicht unnötig auf den engeren Begriff „anbeten“ fest.
- issue: Bezug der Unvernunft
  choice: ihrer Unvernunft
  alternative: in Unvernunft; nach Unvernunft
  rationale: Die deutsche Fassung macht deutlich, dass die Unvernunft als Vergleichsbereich der Tiere verstanden wird. Die etwas knappere griechische Konstruktion wird dabei nicht zu einer weitergehenden theologischen Aussage ausgebaut.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Voranstellung „Sogar“ bewahrt die steigernde Kraft von καὶ … δέ; der zweite Satz folgt der griechischen Vergleichsstruktur, ohne sie unnötig zu glätten.
