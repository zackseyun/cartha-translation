base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/012.yaml
  text: But he considered our life to be a game[a], and our way of life a profitable festival; for, he says, one must get resources from wherever one can[b], even from evil.
translation:
  language: de
  text: Doch er hielt unser Leben für ein Spiel[a] und unsere Lebensführung für ein einträgliches Fest; denn, so sagt er, man müsse sich etwas verschaffen, ganz gleich, woher[b], selbst aus Bösem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unser Leben für einen Zeitvertreib“; παίγνιον kann auch „Spielzeug“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: „man müsse Gewinn machen, wo immer es möglich sei, selbst durch Unrecht.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλογίσατο
  choice: hielt … für
  rationale: Die Wendung gibt das wertende Urteil des Aorists von λογίζομαι im Deutschen natürlich und präzise wieder.
- source_word: παίγνιον
  choice: ein Spiel
  rationale: Das Wort bezeichnet etwas Spielerisches oder der Unterhaltung Dienendes. „Spiel“ bewahrt die moralische Kritik, ohne sich enger auf „Scherz“ oder „Spielzeug“ festzulegen.
- source_word: ζωὴν
  choice: Leben
  rationale: Die übliche Entsprechung; der Unterschied zum folgenden βίος bleibt durch eine andere deutsche Wiedergabe erhalten.
- source_word: βίον
  choice: Lebensführung
  rationale: „Lebensführung“ unterscheidet βίος von ζωή und passt zum ethisch-wirtschaftlichen Zusammenhang, ohne den Ausdruck ausschließlich auf den Lebensunterhalt zu verengen.
- source_word: πανηγυρισμὸν
  choice: Fest
  rationale: Der Ausdruck bezeichnet eine festliche Feier oder öffentliche Festversammlung. „Fest“ bewahrt dieses Bild in knapper, natürlicher Sprache.
- source_word: ἐπικερδῆ
  choice: einträglich
  rationale: Das Adjektiv hebt den auf Gewinn gerichteten Charakter des Festes hervor; „einträglich“ wahrt diese wirtschaftliche Zuspitzung.
- source_word: δεῖν
  choice: man müsse
  rationale: Der griechische unpersönliche Ausdruck der Notwendigkeit wird innerhalb der indirekten Rede idiomatisch wiedergegeben.
- source_word: ὅθεν δὴ κἂν
  choice: woher auch immer
  rationale: Die Formulierung bewahrt die nachdrückliche Gleichgültigkeit gegenüber der Quelle des Erwerbs.
- source_word: ἐκ κακοῦ
  choice: aus Bösem
  rationale: Die knappe Form wahrt die moralische Bedeutung, ohne die mögliche allgemeinere Beziehung auf schlechte Umstände auszuschließen.
- source_word: πορίζειν
  choice: sich etwas verschaffen
  rationale: Das Verb bezeichnet Beschaffen oder Erwerben. Die deutsche Formulierung erhält den materiell-erwerbenden Sinn, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt wie „Gewinn“ einzusetzen.
theological_decisions:
- issue: Moralische Tragweite von ἐκ κακοῦ
  choice: „selbst aus Bösem“ bezeichnet den Erwerb aus einer moralisch bösen Quelle oder durch böse Mittel.
  alternative: Die Wendung kann schwächer als Erwerb „selbst aus schlechten Umständen“ oder „aus einem Unglück“ verstanden werden.
  rationale: Der Zusammenhang kritisiert eine auf Gewinn ausgerichtete, moralisch verdorbene Haltung. Die wörtlich offene Form „aus Bösem“ lässt zugleich die genuine Bedeutungsbreite erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der griechischen Gegenüberstellung von ζωή und βίος, ohne beide mit demselben deutschen Wort wiederzugeben. Die indirekte Rede wird durch „so sagt er“ und den Konjunktiv markiert.
