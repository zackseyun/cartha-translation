base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/006.yaml
  text: Lovers of evil are worthy of such hopes[b][a], both those who make them and those who desire them and those who worship them.
translation:
  language: de
  text: 'Liebhaber des Bösen sind solcher Hoffnungen[a] würdig: diejenigen, die sie herstellen[b], die nach ihnen verlangen und die sie verehren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „solcher Erwartungen würdig“. Gemeint sind die Erwartungen, die im Zusammenhang an Götzen geknüpft werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Handelnden“ oder „die tätig sind“. Im Zusammenhang sind diejenigen gemeint, die die Götzenbilder anfertigen; „sie“ ist ergänzend hinzugefügt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακῶν ἐρασταί
  choice: Liebhaber des Bösen
  rationale: Der Genitiv Plural κακῶν bezeichnet hier moralisch das Böse; „Liebhaber“ bewahrt die knappe und scharfe Charakterisierung durch ἐρασταί.
- source_word: ἄξιοί τε τοιούτων ἐλπίδων
  choice: und solcher Hoffnungen würdig
  rationale: Die Formulierung bleibt eng an der griechischen Prädikatskonstruktion und bewahrt den rückverweisenden Sinn von τοιούτων. „Hoffnungen“ gibt ἐλπίδων wieder, ohne die Spannung der Aussage aufzulösen.
- source_word: οἱ δρῶντες
  choice: die sie herstellen
  rationale: δρῶντες heißt wörtlich allgemein „die Handelnden/die es Tuenden“; im unmittelbaren Zusammenhang sind jedoch die Menschen gemeint, die die Götzenbilder anfertigen. Das ergänzte „sie“ verweist auf diese Bilder.
- source_word: οἱ ποθοῦντες
  choice: die nach ihnen verlangen
  rationale: ποθέω bezeichnet ein starkes Verlangen oder Sehnen. „Nach ihnen verlangen“ ist natürlich und bewahrt diese Intensität.
- source_word: οἱ σεβόμενοι
  choice: die sie verehren
  rationale: σέβομαι bezeichnet im religiösen Zusammenhang kultische Verehrung. „Verehren“ ist hier präzise, ohne über den Wortlaut hinauszugehen.
theological_decisions:
- issue: Das im Griechischen unausgesprochene Objekt der drei Partizipien
  choice: Das Pronomen „sie“ wird ergänzt und auf die Götzenbilder des Zusammenhangs bezogen.
  alternative: Die Partizipien ohne Objekt wiedergeben oder δρῶντες allgemein als „die so handeln“ verstehen.
  rationale: Der vorausgehende Zusammenhang macht die Götzenbilder zum naheliegenden Bezugspunkt. Im Deutschen schafft das Pronomen die nötige Klarheit; bei δρῶντες zeigt der Kontext besonders auf deren Hersteller, ohne dass damit eine zusätzliche theologische Aussage eingeführt wird.
- issue: Der Sinn von „solcher Hoffnungen würdig“
  choice: Die ungewöhnliche Wendung wird im Haupttext bewahrt.
  alternative: Freier mit „verdienen solche Erwartungen“ oder „sind solcher Erwartungen wert“ übersetzen.
  rationale: Die griechische Aussage verbindet die Verehrer polemisch mit den Erwartungen, die sie an Götzen knüpfen. Die formnahe Wiedergabe erhält diese Spannung, statt Art oder Ausgang ihrer Hoffnung ausdrücklich zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst markante Satzstellung bewahrt die knappe Reihung und den urteilenden Ton des griechischen Textes; die wiederholte Relativkonstruktion macht die drei Gruppen klar erkennbar.
