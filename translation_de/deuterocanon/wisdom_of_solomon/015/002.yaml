base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/002.yaml
  text: For even if we sin[a], we are yours, knowing your power; but we will not sin[c][b], knowing that we have been counted as yours.
translation:
  language: de
  text: Denn selbst wenn wir sündigen, gehören wir dir, da wir deine Macht kennen; doch wir werden nicht sündigen, weil wir wissen, dass wir als dir zugehörig gerechnet worden sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass wir als die Deinen gelten.“ Das griechische Wort stammt aus dem Bereich des Rechnens und bedeutet hier, dass wir als Gott zugehörig gerechnet worden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn selbst
  rationale: „Denn“ bewahrt den begründenden Anschluss; „selbst“ trägt zusammen mit dem folgenden Bedingungssatz die konzessive Betonung.
- source_word: ἐὰν ἁμάρτωμεν
  choice: wenn wir sündigen
  rationale: Der Aorist Konjunktiv mit ἐάν bezeichnet eine offene Bedingung; im Zusammenhang ergibt sich durch „selbst“ der Sinn „selbst wenn“.
- source_word: σοὶ ἐσμεν
  choice: gehören wir dir
  rationale: Der Dativ bei εἰμί bezeichnet hier Zugehörigkeit. Die natürliche deutsche Wendung gibt den relationalen Sinn klar wieder.
- source_word: εἰδότες
  choice: da wir … kennen / weil wir wissen
  rationale: Das Partizip kann begleitend oder kausal verstanden werden. Die beiden kausalen Wiedergaben sind im Deutschen natürlich und lassen den begründenden Zusammenhang erkennen.
- source_word: σου τὸ κράτος
  choice: deine Macht
  rationale: κράτος bezeichnet Macht oder Stärke. „Macht“ ist hier weit genug und vermeidet eine vorschnelle Festlegung auf Herrschaft oder bloße Körperkraft.
- source_word: οὐχ ἁμαρτησόμεθα
  choice: wir werden nicht sündigen
  rationale: Das Futur wird als Zukunftsaussage wiedergegeben. So bleibt die Spannung zum vorausgehenden „wenn wir sündigen“ erhalten.
- source_word: ὅτι σοὶ λελογίσμεθα
  choice: dass wir dir zugerechnet sind
  rationale: Das Perfekt Passiv von λογίζομαι bewahrt mit „zugerechnet“ die bildhafte Sprache des Rechnens beziehungsweise Anrechnens; σοὶ bezeichnet dabei die Zugehörigkeit zu Gott.
theological_decisions:
- issue: Spannung zwischen „wenn wir sündigen“ und „wir werden nicht sündigen“
  choice: Beide Aussagen werden unverändert als Bedingung und Zukunftsaussage wiedergegeben.
  alternative: Die zweite Aussage als Aufforderung („Lasst uns nicht sündigen“) oder abgeschwächte Absicht wiederzugeben.
  rationale: Der griechische Text hält die Möglichkeit des Sündigens und die zuversichtliche Aussage, nicht zu sündigen, bewusst nebeneinander. Die Übersetzung harmonisiert diese Spannung nicht.
- issue: Bedeutung von σοὶ λελογίσμεθα
  choice: „dass wir dir zugerechnet sind“
  alternative: „dass wir zu dir gehören“
  rationale: Die gewählte Fassung erhält sowohl die Rechnungsmetapher von λογίζομαι als auch den durch den Dativ ausgedrückten Bezug auf Gott; eine Fußnote erläutert den gemeinten Zugehörigkeitssinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gehören wir dir“ klingt natürlicher als das wörtlichere „sind wir dein“. Die Wiederholung von „wissen/kennen“ folgt dem zweimaligen εἰδότες, wird aber idiomatisch variiert. Die einzige Fußnote erläutert die für das Verständnis bedeutsame Rechnungsmetapher.
