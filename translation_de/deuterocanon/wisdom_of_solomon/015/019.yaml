translation:
  language: de
  text: Nicht einmal ist es so schön, dass man es begehren könnte, wie Lebewesen es ihrem Aussehen nach sein können.[a] Doch dem hat es sowohl an Gottes Lob als auch an seinem Segen gefehlt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nicht einmal ist es so schön anzusehen, dass man es begehren könnte.“ Die knappe griechische Wendung kann verschieden verbunden werden: Sie kann die Schönheit mit dem Aussehen von Lebewesen vergleichen oder dieses Aussehen näher bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier ein Verb mit der Bedeutung „entkommen“ oder „entgehen“; gemeint ist, dass Gottes Lob und Segen nicht erlangt wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ὅσον ἐπιποθῆσαι
  choice: Nicht einmal so schön, dass man sie begehren könnte
  rationale: Die verneinte Maßangabe mit dem Infinitiv besagt, dass die dargestellten Wesen nicht einmal den Grad an Schönheit erreichen, der Begehren wecken könnte. Die aktive unpersönliche Formulierung mit „man“ klingt im Deutschen natürlich.
- source_word: ὡς ἐν ζῴων ὄψει καλὰ τυγχάνει
  choice: sind sie im Aussehen von Lebewesen
  rationale: ζῷα bezeichnet hier Lebewesen beziehungsweise Tiere, ὄψις ihr Aussehen. Die gedrängte griechische Konstruktion bleibt mehrdeutig; der Haupttext verbindet die Schönheit mit dem Aussehen der dargestellten Lebewesen, ohne die syntaktische Frage übermäßig festzulegen.
- source_word: ἐκπέφευγεν
  choice: sind ihnen ... entgangen
  rationale: Das Perfekt bezeichnet einen fortbestehenden Verlustzustand. „Entgangen“ bewahrt das Bild des griechischen Verbs, macht im Deutschen aber klarer als „entkommen“, dass Lob und Segen nicht erlangt wurden.
- source_word: τὸν τοῦ θεοῦ ἔπαινον
  choice: das Lob Gottes
  rationale: Die Formulierung bleibt nahe am Genitiv des griechischen Textes und lässt dessen Beziehung formal offen, wobei im Kontext Gottes Anerkennung gemeint ist.
- source_word: τὴν εὐλογίαν αὐτοῦ
  choice: sein Segen
  rationale: „Sein“ bezieht sich natürlich auf Gott; „Segen“ ist die direkte, geläufige Wiedergabe von εὐλογία.
theological_decisions:
- issue: Bezug der pluralischen Aussage im ersten Satz und des Singulars im zweiten Satz
  choice: Der deutsche Text bezieht die erste Aussage auf die dargestellten Lebewesen; der zweite Satz spricht mit einem unpersönlichen Pluralbezug weiter, ohne ausdrücklich „Götzenbild“ einzusetzen.
  alternative: Den gesamten Vers ausdrücklich auf das gefertigte Götzenbild als Gattung beziehen.
  rationale: Der unmittelbare Zusammenhang kritisiert sowohl die Tiergestalten als auch ihre bildliche Verehrung. Eine ausdrückliche Ergänzung wie „Götzenbild“ würde die im Text verbleibende Bezugsspannung stärker auflösen als nötig.
- issue: Bedeutung des Entgehens von Gottes Lob und Segen
  choice: Negative Vorenthaltung beziehungsweise Nichterlangung
  alternative: Wörtliches Entkommen im Sinn einer erfolgreichen Vermeidung
  rationale: Der verurteilende Kontext zeigt, dass hier kein glückliches Entkommen, sondern der Verlust göttlicher Anerkennung und Segnung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lebewesen“ gibt ζῷα breit wieder; die Fußnote verdeutlicht den möglichen Bezug auf Tiere. Die ungewöhnliche Bildsprache des Entgehens bleibt erhalten, wird jedoch idiomatisch als Dativkonstruktion formuliert.
