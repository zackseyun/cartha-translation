base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/009.yaml
  text: Yet his concern is not that he is about to grow weary[a], nor that his life is short; rather, he competes with goldsmiths and silversmiths, imitates bronze-workers[b], and considers it a glory that he molds counterfeit things.
translation:
  language: de
  text: Doch er sorgt sich nicht darum, dass er ermüden wird[a], noch darum, dass sein Leben nur kurz währt. Vielmehr tritt er mit Goldschmieden und Silberschmieden in Wettbewerb[b], ahmt Bronzehandwerker nach und hält es für eine Ehre, Fälschungen zu formen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „krank werden“ oder „seine Kräfte verlieren“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „misst sich mit Goldschmieden und Silberschmieden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „unechte Gebilde“ beziehungsweise „trügerische Nachbildungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φροντίς
  choice: es kümmert ihn
  rationale: Die Wendung bezeichnet das, was ihn gedanklich beschäftigt; sie ist im Deutschen natürlich und steigert den Ausdruck nicht unnötig zu Angst oder Sorge.
- source_word: μέλλει κάμνειν
  choice: dass er bald ermüden wird
  rationale: μέλλει bezeichnet das Bevorstehende, κάμνειν das Ermüden beziehungsweise Nachlassen der Kräfte. Die Wiedergabe wahrt den Bezug auf die menschliche Vergänglichkeit, ohne vorschnell Krankheit oder Tod festzulegen.
- source_word: βραχυτελῆ βίον
  choice: dass sein Leben nur kurz währt
  rationale: Das zusammengesetzte Adjektiv bezeichnet ein Leben von kurzer Dauer; „kurz währt“ gibt dies idiomatisch und in würdigem Register wieder.
- source_word: ἀντερείδεται
  choice: tritt … in Wettbewerb
  rationale: Das Verb drückt ein konkurrierendes Sich-Messen mit anderen Handwerkern aus. Die Formulierung bewahrt diese aktive Rivalität.
- source_word: χρυσουργοῖς καὶ ἀργυροχόοις
  choice: Gold- und Silberschmieden
  rationale: Dies sind die geläufigen deutschen Berufsbezeichnungen und geben die Parallelität des Griechischen knapp wieder.
- source_word: χαλκοπλάστας
  choice: Bronzehandwerker
  rationale: Der Ausdruck bezeichnet Handwerker, die Bronze beziehungsweise Kupfer formen. „Bronzehandwerker“ bleibt hinsichtlich der genauen Bearbeitungstechnik offen.
- source_word: μιμεῖται
  choice: ahmt … nach
  rationale: Die direkte Wiedergabe macht den nachahmenden Charakter seiner Arbeit deutlich.
- source_word: δόξαν ἡγεῖται
  choice: hält es für eine Ehre
  rationale: Die Wendung bezeichnet seine stolze Bewertung des Tuns. „Ehre“ klingt im modernen Deutschen natürlicher als das hier missverständliche „Herrlichkeit“ und erhält die Ironie des Zusammenhangs.
- source_word: κίβδηλα
  choice: Fälschungen
  rationale: κίβδηλα bezeichnet Unechtes, Verfälschtes oder Nachgemachtes. „Fälschungen“ bringt im handwerklichen Zusammenhang sowohl die materielle Unechtheit als auch die moralische Kritik zum Ausdruck.
- source_word: πλάσσει
  choice: zu formen
  rationale: Das Verb bezeichnet das plastische Gestalten oder Bilden und passt zu den genannten Metallhandwerkern, ohne eine bestimmte Technik wie Gießen vorauszusetzen.
theological_decisions:
- issue: Ironische Bewertung der Herstellung von Götzenbildern
  choice: Die stolze Selbsteinschätzung des Handwerkers wird mit „hält es für eine Ehre, Fälschungen zu formen“ wiedergegeben.
  alternative: 'Neutraler wäre: „hält es für ruhmvoll, Nachbildungen anzufertigen“.'
  rationale: Der Zusammenhang kritisiert die Herstellung von Götzen. κίβδηλα trägt selbst die Bedeutung des Unechten oder Verfälschten; die moralische Ironie stammt daher aus dem Text und wird nicht durch eine zusätzliche konfessionelle Deutung erzeugt.
- issue: Bedeutungsumfang von κάμνειν
  choice: Im Haupttext steht „ermüden wird“, ergänzt durch eine Fußnote zu möglichen stärkeren Bedeutungen.
  alternative: Möglich wären „krank werden wird“, „seine Kräfte verlieren wird“ oder kontextuell zugespitzt „sterben wird“.
  rationale: Das griechische Verb kann körperliche Ermüdung, Leiden oder Krankheit bezeichnen und in bestimmten Zusammenhängen bis an den Tod heranreichen. Die Übersetzung lässt diese Spannung bestehen, statt eine einzige Folgerung festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die beiden negativen Glieder bleiben parallel; der anschließende Gegensatz wird durch „Vielmehr“ markiert. Fachlich enge oder altertümliche Berufsbezeichnungen wurden vermieden. Sämtliche Fußnotenmarker stehen an der jeweils erläuterten Stelle im Haupttext.
