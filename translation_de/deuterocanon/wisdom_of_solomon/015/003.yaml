  text: For to know you is complete righteousness[a], and to know your power is the root of immortality.
translation:
  language: de
  text: Denn dich zu erkennen ist vollkommene Gerechtigkeit[a], und deine Macht zu kennen ist die Wurzel der Unsterblichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Gerechtigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθαί
  choice: zu erkennen
  rationale: Das Verb bezeichnet hier ein bewusstes Erkennen Gottes. „Erkennen“ klingt im Deutschen natürlicher und beziehungsreicher als das bloße „wissen“ und wahrt zugleich die knappe Parallelstruktur.
- source_word: ὁλόκληρος
  choice: vollkommene
  rationale: Das Adjektiv beschreibt δικαιοσύνη als vollständig und unversehrt. „Vollkommen“ gibt diese Ganzheit in würdigem, natürlichem Deutsch wieder.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die natürliche deutsche Entsprechung und kann hier sowohl rechtes Verhalten als auch das rechte Verhältnis zu Gott umfassen, ohne die Spannung auf einen ausschließlich sozialen oder forensischen Sinn festzulegen.
- source_word: εἰδέναι
  choice: zu kennen
  rationale: „Kennen“ bewahrt die Parallele zum ersten Erkenntnisverb und vermeidet die unnatürliche Formulierung „deine Macht zu wissen“. Eine scharfe Bedeutungsdifferenz zwischen den beiden griechischen Verben wird nicht behauptet.
- source_word: κράτος
  choice: Macht
  rationale: Das Wort bezeichnet wirksame Stärke oder Macht. „Macht“ ist hier breit genug und legt den Ausdruck nicht vorschnell auf Herrschaft oder politische Gewalt fest.
- source_word: ῥίζα
  choice: Wurzel
  rationale: Die ausdrückliche Metapher des griechischen Textes bleibt erhalten und vermittelt Ursprung sowie tragenden Grund.
- source_word: ἀθανασίας
  choice: Unsterblichkeit
  rationale: „Unsterblichkeit“ ist die geläufige und dem weisheitlich-theologischen Sprachregister angemessene Wiedergabe.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη im weisheitlich-theologischen Zusammenhang
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Das Deutsche verwendet „Gerechtigkeit“ sowohl für gerechtes Handeln als auch für einen umfassenden Zustand des Rechten. So bleibt offen, ob stärker die ethische Qualität, das rechte Verhältnis zu Gott oder beides gemeint ist.
- issue: Aussage von ὁλόκληρος δικαιοσύνη
  choice: vollkommene Gerechtigkeit
  alternative: die ganze Gerechtigkeit
  rationale: „Vollkommene Gerechtigkeit“ gibt die prädikative Aussage idiomatisch wieder, ohne daraus eine ausgearbeitete Heilslehre abzuleiten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Der Parallelismus der beiden Erkenntnisaussagen und das Bild der Wurzel bleiben erhalten.
