base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/003.yaml
  text: Instead of these things[a], you provided a pillar blazing with fire, both as a guide for an unknown journey and as a harmless sun for their honored exile.
translation:
  language: de
  text: 'Anstelle dessen gabst du ihnen eine lodernde Feuersäule: als Führerin auf einer unbekannten Reise und als unschädliche Sonne für ihren ehrenvollen Aufenthalt in der Fremde.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für ihr angesehenes Leben in der Fremde«; auch »für ihr ehrenvolles Exil« ist möglich. Der griechische Ausdruck φιλοτίμου ξενιτείας ist schwierig und kann die Würde ihres Lebens fern der Heimat hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Anstelle dessen
  rationale: Gibt den rückbezüglichen Kontrast zum Vorangehenden knapp und idiomatisch wieder, ohne den Bezug unnötig festzulegen.
- source_word: πυριφλεγῆ στῦλον
  choice: eine Feuersäule, die lodernd brannte
  rationale: Bewahrt das konkrete Exodusbild der Säule und die verstärkende Bedeutung des zusammengesetzten Adjektivs.
- source_word: ὁδηγόν
  choice: als Führerin
  rationale: Bezeichnet die Funktion der grammatisch femininen »Säule«; die feminine Form stellt keinen eigenständigen personalen Akteur her.
- source_word: ἀγνώστου ὁδοιπορίας
  choice: auf unbekanntem Weg
  rationale: Natürliches Deutsch für eine Reise auf einer unbekannten beziehungsweise unvertrauten Route.
- source_word: ἥλιον ἀβλαβῆ
  choice: als unschädliche Sonne
  rationale: Erhält ausdrücklich das Bild der Sonne und den Gegensatz zu schädlichen oder zerstörerischen Erscheinungen.
- source_word: φιλοτίμου ξενιτείας
  choice: für ihren ehrenvollen Aufenthalt in der Fremde
  rationale: ξενιτεία bezeichnet Aufenthalt oder Leben fern der Heimat; φιλοτίμου wertet diesen als ehrenvoll beziehungsweise würdig. Die Formulierung vermeidet die einseitig negative Festlegung auf »Exil«.
- source_word: παρέσχες
  choice: gabst du ihnen
  rationale: Gibt die direkte Anrede Gottes und den Sinn des Gewährens oder Bereitstellens natürlich wieder; »ihnen« macht die aus dem Zusammenhang erschlossenen Empfänger im Deutschen deutlich.
theological_decisions:
- issue: Anspielung auf die Führung beim Exodus
  choice: Die konkreten Bilder »Feuersäule« und »Sonne« bleiben erhalten.
  alternative: Abstrakt als von Gott gegebenes Licht zur Führung wiedergeben.
  rationale: Die Bildsprache verweist auf Gottes Führung seines Volkes und darf nicht zu einer allgemeinen Aussage über Licht verflacht werden.
- issue: Bedeutung von ξενιτεία
  choice: Aufenthalt in der Fremde
  alternative: Exil oder Verbannung
  rationale: Der griechische Ausdruck kann allgemein das Leben fern der Heimat oder einen Fremdaufenthalt bezeichnen. Die neutralere Wiedergabe bewahrt diese Bedeutungsbreite und lässt die positive Färbung durch φιλοτίμου bestehen.
- issue: Deutung von φιλοτίμου
  choice: ehrenvoll
  alternative: ruhmreich, edel oder ehrgeizig
  rationale: Der schwierige Ausdruck kennzeichnet den Fremdaufenthalt positiv. »Ehrenvoll« wahrt diese Wertung, ohne eine moderne psychologische Bedeutung wie »ehrgeizig« einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gottesanrede und die konkrete Bildsprache bleiben erhalten. Der Doppelpunkt macht die zwei Funktionen der Feuersäule übersichtlich, ohne die syntaktische Parallelität des Griechischen aufzugeben.
