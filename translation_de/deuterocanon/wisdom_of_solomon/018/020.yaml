base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/020.yaml
  text: But the trial of death also touched the righteous[a], and a destruction of the multitude occurred in the wilderness[b]; yet the wrath did not remain for long.
translation:
  language: de
  text: Doch auch die Gerechten traf eine Prüfung durch den Tod[a], und in der Wüste wurde die Menge zerschlagen[b]; der Zorn jedoch hielt nicht lange an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Erfahrung des Todes“ oder „eine Todesprüfung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „es kam zu einer Zerschlagung der Menge“; auch möglich: „zu einer Vernichtung der Menge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἥψατο
  choice: traf
  rationale: Das Verb bezeichnet hier, dass etwas die Gerechten erreichte und erfasste. „Traf“ bewahrt dieses Bild, ohne eine vollständige Vernichtung auszusagen.
- source_word: δικαίων
  choice: die Gerechten
  rationale: Die substantivische Wiedergabe erhält die ethisch-religiöse Bezeichnung des griechischen Plurals.
- source_word: πεῖρα θανάτου
  choice: eine Prüfung durch den Tod
  rationale: πεῖρα kann Prüfung, Erprobung oder Erfahrung bedeuten. Die Formulierung wahrt den Charakter einer tödlichen Bewährungsprobe, ohne zu behaupten, alle Gerechten seien gestorben.
- source_word: θραῦσις
  choice: wurde … zerschlagen
  rationale: Die verbale deutsche Form gibt das Bild des Brechens oder Zerschmetterns natürlich wieder und vermeidet das möglicherweise zu absolute „Vernichtung“.
- source_word: πλήθους
  choice: die Menge
  rationale: Die kollektive Bedeutung von πλῆθος bleibt erhalten, ohne die nicht ausdrücklich genannte Identität der Betroffenen näher festzulegen.
- source_word: ἐν ἐρήμῳ
  choice: in der Wüste
  rationale: „Wüste“ ist im Deutschen die geläufige biblische Bezeichnung für den Schauplatz der Wüstenwanderung.
- source_word: ὀργή
  choice: der Zorn
  rationale: „Zorn“ entspricht dem Kontext göttlichen Gerichts, ohne einen im Griechischen nicht ausdrücklich genannten Besitzer einzufügen.
- source_word: οὐκ ἐπὶ πολὺ ἔμεινεν
  choice: hielt nicht lange an
  rationale: Diese idiomatische deutsche Wendung gibt die begrenzte Dauer des Zorns präzise wieder.
theological_decisions:
- issue: Ob der Zorn ausdrücklich als Gottes Zorn bezeichnet werden soll
  choice: der Zorn
  alternative: Gottes Zorn / sein Zorn
  rationale: Der Zusammenhang legt Gottes Zorn nahe, doch der griechische Text enthält weder einen Gottesnamen noch ein Possessivpronomen. Die Übersetzung lässt den Bezug daher beim Kontext.
- issue: Wie πεῖρα θανάτου im Blick auf die Gerechten zu verstehen ist
  choice: eine Prüfung durch den Tod traf die Gerechten
  alternative: die Gerechten machten eine Todeserfahrung / der Tod erprobte die Gerechten
  rationale: Die gewählte Fassung erhält sowohl die Vorstellung einer Prüfung als auch die reale Bedrohung durch den Tod, ohne die Gerechten unterschiedslos als vernichtet darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem griechischen Gedankengang, während die nominale Wendung bei θραῦσις für natürliches Deutsch verbal wiedergegeben wird. Sämtliche Fußnotenmarker stehen im Haupttext.
