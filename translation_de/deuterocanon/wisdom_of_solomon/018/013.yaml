base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/013.yaml
  text: For though they had disbelieved everything because of their sorceries[b][a], at the destruction of the firstborn they acknowledged that this people was God's son.
translation:
  language: de
  text: Denn obwohl sie wegen ihrer Zauberkünste[a] allem den Glauben verweigert hatten, erkannten sie beim Untergang der Erstgeborenen an, dass das Volk Gottes Sohn sei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zauberei“. Der griechische Ausdruck bezeichnet hier die mit Ägypten verbundenen magisch-okkulten Praktiken.'
    reason: lexical_alternative
  - marker: b
    text: Israel wird hier als Ganzes, also als Volk, Gottes Sohn genannt; die Bezeichnung meint an dieser Stelle keine einzelne Person.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπιστοῦντες
  choice: den Glauben verweigert hatten
  rationale: Die Formulierung gibt den aktiven Unglauben beziehungsweise die Weigerung wieder, den vorausgegangenen Zeichen Glauben zu schenken, und passt zum vorzeitigen Verhältnis gegenüber dem späteren Anerkennen.
- source_word: φαρμακείας
  choice: Zauberkünste
  rationale: Im Zusammenhang mit Ägypten bezeichnet das Wort okkulte magische Praktiken, nicht den medizinischen Gebrauch des Wortstamms.
- source_word: ὀλέθρῳ
  choice: Untergang
  rationale: Das Substantiv bezeichnet das vernichtende Unheil, das die Erstgeborenen traf, ohne über den griechischen Ausdruck hinaus zusätzliche Einzelheiten einzutragen.
- source_word: πρωτοτόκων
  choice: der Erstgeborenen
  rationale: Der griechische Text hat den Artikel, aber kein Possessivpronomen; die deutsche Fassung bewahrt diese Form.
- source_word: ὡμολόγησαν
  choice: erkannten … an
  rationale: Das Verb bezeichnet hier ein durch die Ereignisse erzwungenes offenes Eingeständnis; „anerkennen“ ist im erzählenden Zusammenhang natürlicher als das religiös stärker besetzte „bekennen“.
- source_word: θεοῦ υἱὸν
  choice: Gottes Sohn
  rationale: Die singularische Prädikatsbezeichnung wird bewahrt und idiomatisch als Zugehörigkeitsverhältnis formuliert.
- source_word: λαὸν
  choice: das Volk
  rationale: Der bestimmte Bezug auf Israel ergibt sich aus dem Kontext. Anders als „dieses Volk“ fügt „das Volk“ keinen im Griechischen nicht vorhandenen demonstrativen Ausdruck hinzu.
theological_decisions:
- issue: Korporative Sohnschaft Israels
  choice: dass das Volk Gottes Sohn war
  alternative: dass das Volk ein Sohn Gottes war; dass die Angehörigen des Volkes Gottes Kinder waren
  rationale: Der griechische Text verbindet das singularische „Sohn“ mit dem singularischen Kollektivbegriff „Volk“. Die Übersetzung erhält dieses spannungsreiche korporative Bild, statt es zu individualisieren oder zum Plural „Kinder“ abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konzessive Konstruktion gibt den Gedankengang natürlich wieder; „allem den Glauben verweigern“ vermeidet das missverständliche „an nichts glauben“. Die Vergangenheitsform „war“ fügt sich in den erzählenden Rückblick ein, ohne die theologische Aussage umzudeuten.
