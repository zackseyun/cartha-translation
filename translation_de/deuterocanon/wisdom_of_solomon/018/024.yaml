base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/024.yaml
  text: For on the full-length robe was the whole world[a], and the glory of the fathers was on the engraving of the four-rowed stones[b], and your majesty was on the diadem upon his head.
translation:
  language: de
  text: Denn auf dem fußlangen Gewand war die ganze Welt[a], die Herrlichkeit der Väter auf der Gravur des vierreihigen Steinbesatzes[b] und deine Majestät auf dem Diadem an seinem Haupt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „fußlang“ bezeichnet ein Gewand, das bis zu den Füßen reicht.
    reason: lexical_alternative
  - marker: b
    text: Die knappe griechische Wendung spielt wahrscheinlich auf den Brustschild des Hohepriesters mit seinen Steinen in vier Reihen und ihren Gravuren an.
    reason: cultural_note
lexical_decisions:
- source_word: ποδήρους ἐνδύματος
  choice: fußlangen Gewand
  rationale: ποδήρης bezeichnet ein bis zu den Füßen reichendes Kleidungsstück. „Fußlanges Gewand“ ist im heutigen Deutsch anschaulich und bewahrt den Bezug zur hochpriesterlichen Kleidung.
- source_word: ὅλος ὁ κόσμος
  choice: die ganze Welt
  rationale: κόσμος bezeichnet hier die Welt beziehungsweise die kosmische Ordnung, die symbolisch auf dem Gewand gegenwärtig ist. „Die ganze Welt“ bewahrt diese Weite, ohne deutend „Schöpfung“ einzusetzen.
- source_word: πατέρων δόξα
  choice: die Herrlichkeit der Väter
  rationale: δόξα kann Herrlichkeit, Glanz oder Ehre bezeichnen. „Herrlichkeit“ wahrt den erhabenen Ton und legt nicht vorschnell fest, ob Würde, Ruhm oder erinnernde Darstellung der Vorfahren gemeint ist.
- source_word: ἐπὶ τετραστίχου λίθου γλυφῆς
  choice: auf der Gravur des vierreihigen Steinbesatzes
  rationale: Die griechische Wortgruppe ist stark verdichtet und verweist wahrscheinlich auf die in vier Reihen angeordneten, gravierten Steine des Brustschilds. „Steinbesatz“ gibt den kollektiven Sinn des Singulars λίθου verständlich wieder, ohne die schwierige Formulierung im Haupttext unnötig auszubreiten.
- source_word: μεγαλοσύνη σου
  choice: deine Majestät
  rationale: μεγαλοσύνη bezeichnet Größe, Erhabenheit oder Majestät. In der Anrede an Gott vermittelt „Majestät“ die göttliche Hoheit in natürlichem, gehobenem Deutsch.
- source_word: διάδημα
  choice: Diadem
  rationale: διάδημα bezeichnet ein Diadem beziehungsweise Stirnband. Das Lehnwort bewahrt den besonderen, feierlichen Gegenstand genauer als das allgemeinere „Krone“.
theological_decisions:
- issue: Symbolische Darstellung auf der hochpriesterlichen Kleidung
  choice: Die kosmische und die auf die Väter bezogene Symbolik wird so wiedergegeben, wie der Vers sie nennt, ohne ihre einzelnen Elemente ausdrücklich mit Exodus 28 gleichzusetzen.
  alternative: Die ganze Bildsprache ausdrücklich als Hinweis auf Brustschild, Edelsteine und Kopfbund des Hohepriesters erklären.
  rationale: Der griechische Text setzt den kultischen Hintergrund voraus, entfaltet ihn hier aber nicht. Die Übersetzung bewahrt deshalb die Symbolik und erläutert lediglich die schwierige Wendung zum vierreihigen Steinbesatz in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die verdichtete griechische Satzstruktur. Die dreifache Zuordnung mit „auf“ bleibt erhalten; die kultische Anspielung wird nicht in den Haupttext hineinerklärt.
