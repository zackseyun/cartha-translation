base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/006.yaml
  text: That night was made known beforehand to our fathers[a], so that, knowing with certainty the oaths in which they had trusted[c][b], they might be encouraged.
translation:
  language: de
  text: Jene Nacht war unseren Vätern zuvor bekannt, damit sie, weil sie sich der Eide, auf die sie vertraut hatten, gewiss waren, Mut fassten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jene Nacht wurde unseren Vätern im Voraus angekündigt.“ Das griechische Verb kann sowohl ausdrücken, dass die Nacht den Vätern zuvor bekannt war, als auch, dass sie ihnen vorher kundgetan wurde; der Zusammenhang legt die zweite Deutung nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη ἡ νὺξ
  choice: Jene Nacht
  rationale: Bewahrt die deiktische Kraft des Demonstrativs in einer natürlichen, würdigen deutschen Form.
- source_word: προεγνώσθη
  choice: wurde … im Voraus bekannt gemacht
  rationale: Die passive Wiedergabe entspricht im Zusammenhang einer vorherigen Offenbarung der Nacht; die formal mögliche Bedeutung „wurde vorher erkannt“ bleibt in der Fußnote erhalten.
- source_word: πατράσιν ἡμῶν
  choice: unseren Vätern
  rationale: Gibt die ausdrücklich männliche Bezeichnung wörtlich wieder; gemeint sind Israels Vorväter.
- source_word: ἀσφαλῶς εἰδότες
  choice: in sicherem Wissen um
  rationale: Verbindet den Erkenntnisaspekt von εἰδότες mit der Gewissheit, die ἀσφαλῶς ausdrückt.
- source_word: οἷς ἐπίστευσαν ὅρκοις
  choice: die Eide, auf die sie vertraut hatten
  rationale: Bewahrt „Eide“ als direkte Entsprechung zu ὅρκοις und drückt das in ἐπίστευσαν liegende Vertrauen idiomatisch aus.
- source_word: ἐπευθυμήσωσιν
  choice: Mut fassten
  rationale: Gibt das Ermutigtwerden beziehungsweise Zuversichtlichwerden natürlich und prägnant wieder, ohne zusätzliche Freude in den Text einzutragen.
theological_decisions:
- issue: Bezug der Eide
  choice: Die Eide werden ohne nähere Bestimmung wiedergegeben.
  alternative: Ausdrückliche Deutung als Gottes eidlich bekräftigte Verheißungen an Israels Vorväter.
  rationale: Der Kontext legt göttliche Verheißungen nahe, doch der Vers selbst sagt lediglich „Eide“. Die knappe Wiedergabe bewahrt diese Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Väter“ bewahrt die konkrete historische Bezeichnung; „Mut fassten“ ist idiomatisch und gibt den Zweck der vorherigen Bekanntmachung klar wieder.
