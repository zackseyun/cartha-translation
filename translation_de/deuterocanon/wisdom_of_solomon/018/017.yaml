lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Markiert knapp und natürlich die zeitliche Folge im erzählenden Zusammenhang.
- source_word: παραχρῆμα
  choice: auf der Stelle
  rationale: Gibt den unmittelbaren, plötzlichen Eintritt des Geschehens wieder.
- source_word: φαντασίαι ὀνείρων
  choice: Traumbilder
  rationale: Bewahrt den Bezug auf Träume und lässt offen, ob innere Bilder, Erscheinungen oder gespenstische Visionen gemeint sind.
- source_word: δεινῶς
  choice: schrecklichen
  rationale: Das Adverb beschreibt hier die furchterregende beziehungsweise heftige Art der Wirkung; im Deutschen wird dies idiomatisch am Substantiv ausgedrückt.
- source_word: ἐτάραξαν
  choice: aufgewühlt
  rationale: Gibt die starke innere Beunruhigung und Erschütterung wieder, ohne zusätzlich zu behaupten, dass sie unmittelbar in Schrecken versetzt wurden.
- source_word: αὐτούς
  choice: sie
  rationale: Direktes Objekt; der Bezug ergibt sich aus dem Kontext.
- source_word: φόβοι
  choice: Ängste
  rationale: Entspricht dem griechischen Plural und bezeichnet mehrere plötzlich auftretende Furchterfahrungen.
- source_word: ἐπέστησαν
  choice: überfielen
  rationale: Drückt das plötzliche Herantreten und Bedrängen durch die Ängste in natürlichem Deutsch aus.
- source_word: ἀδόκητοι
  choice: unerwartete
  rationale: Bewahrt den Sinn von unvorhergesehen und nicht erwartet.
