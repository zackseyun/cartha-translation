base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/004.yaml
  text: For those men were worthy to be deprived of light and imprisoned in darkness[a], they who had kept your sons shut in, through whom the imperishable light of the law was about to be given to the age.
translation:
  language: de
  text: Denn jene verdienten es, des Lichtes beraubt und in Finsternis eingesperrt zu werden, die deine Söhne eingeschlossen hielten, durch die das unvergängliche Licht des Gesetzes dem Zeitalter gegeben werden sollte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Welt“ oder „für alle Zeit“. Im Griechischen steht „dem Zeitalter“ im Singular; der Ausdruck kann sowohl weltbezogen als auch zeitlich verstanden werden.'
    reason: Bewahrung der semantischen Mehrdeutigkeit von τῷ αἰῶνι.
lexical_decisions:
- source_word: ἄξιοι
  choice: verdienten es
  rationale: Im Zusammenhang des göttlichen Gerichts bezeichnet ἄξιοι das gerechte Ergehen; „verdienten es“ ist natürliches Deutsch und bewahrt diesen vergeltenden Sinn.
- source_word: στερηθῆναι φωτός
  choice: des Lichtes beraubt zu werden
  rationale: Die Passivform bezeichnet einen auferlegten Entzug und bewahrt den Bezug zur Finsternisplage.
- source_word: φυλακισθῆναι σκότει
  choice: in Finsternis eingesperrt zu werden
  rationale: φυλακίζω hat hier den Sinn des Gefangenhaltens; „eingesperrt“ erhält das Bild der vergeltenden Gefangenschaft.
- source_word: οἱ κατακλείστους φυλάξαντες
  choice: Sie hatten … eingeschlossen gehalten
  rationale: Die Verbindung beschreibt fortdauernde Einschließung. Die eigenständige Satzform gibt die griechische Apposition in natürlichem modernem Deutsch wieder.
- source_word: τοὺς υἱούς σου
  choice: deine Söhne
  rationale: Die ausdrücklich maskuline Bezeichnung wird bewahrt und bezeichnet hier Israel als Gottes Söhne beziehungsweise Volk.
- source_word: διʼ ὧν
  choice: durch die
  rationale: Das Relativpronomen bezieht sich grammatisch am nächsten auf „deine Söhne“ und drückt ihre vermittelnde Rolle aus.
- source_word: ἤμελλεν … δίδοσθαι
  choice: gegeben werden sollte
  rationale: Die Wendung bewahrt die vom damaligen Erzählzeitpunkt aus zukünftige beziehungsweise bestimmte Handlung, ohne eine unmittelbar bevorstehende Erfüllung zu erzwingen.
- source_word: τὸ ἄφθαρτον νόμου φῶς
  choice: das unvergängliche Licht des Gesetzes
  rationale: „Unvergänglich“ gibt ἄφθαρτον wieder, während der Genitiv νόμου direkt auf „Licht“ bezogen bleibt.
- source_word: τῷ αἰῶνι
  choice: dem Zeitalter
  rationale: Die Wiedergabe hält am Dativ und am Singular fest. Da αἰών sowohl zeitliche als auch weltbezogene Weite haben kann, werden geläufigere Deutungen in der Fußnote genannt.
theological_decisions:
- issue: Bezug von „durch die“ und Vermittlung des Gesetzeslichts
  choice: Das Relativpronomen wird auf Gottes Söhne, also Israel, bezogen.
  alternative: Die Wendung könnte lockerer auf die damit verbundenen Ereignisse bezogen werden.
  rationale: τοὺς υἱούς σου ist der nächste grammatische Bezug von διʼ ὧν. Die Übersetzung hält diesen persönlichen Bezug fest, ohne die Art der Vermittlung weiter zu bestimmen.
- issue: Bedeutungsumfang von αἰών
  choice: Im Haupttext steht „dem Zeitalter“.
  alternative: „der Welt“ oder „für alle Zeit“
  rationale: Der griechische Singular kann eine zeitliche oder eine weltbezogene Bedeutung tragen. Die Fußnote bewahrt diese Spannung, statt sie im Haupttext stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die begründende Apposition verständlich, ohne ihren Zusammenhang mit dem vorangehenden Urteil aufzulösen. „Finsternis“ und „unvergängliches Licht des Gesetzes“ bleiben als tragende Kontrastbilder erhalten.
