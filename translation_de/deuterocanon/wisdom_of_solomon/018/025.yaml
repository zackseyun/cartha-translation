  terminology: „Vernichter“ gibt ὀλοθρεύων angemessen wieder, ohne „Engel“ einzutragen. „Zorn“ ist für ὀργή im Gerichtszusammenhang passend. „Erfahrung des Zorns“ ist als Deutung von πεῖρα möglich, sollte aber mit den Alternativen in der Fußnote abgesichert bleiben.
