base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/025.yaml
  text: The destroyer gave way before this man[a], and feared these things[c][b]; for the mere testing of wrath was sufficient.
translation:
  language: de
  text: Vor diesem wich der Vernichter[a] zurück und fürchtete diese Dinge[b]; denn schon die bloße Erfahrung des Zorns[c] genügte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „der Vernichtungsengel“. Im Griechischen steht lediglich „der Vernichter“ beziehungsweise wörtlich „der Vernichtende“.'
    reason: alternative_reading
  - marker: b
    text: „Diese Dinge“ bezieht sich wahrscheinlich auf die priesterlichen Zeichen oder Erinnerungsmale aus dem vorhergehenden Vers. Der griechische Wortlaut lässt den Bezug jedoch unausgesprochen und verwendet beim Verb formal eine Pluralform; streng wörtlich wäre daher auch die schwer verständliche Fassung „diese Dinge aber gerieten in Furcht“ möglich.
    reason: textual_and_syntactic_ambiguity
  - marker: c
    text: Für „Erfahrung des Zorns“ sind auch „Probe“, „Prüfung“ oder „Erprobung des Zorns“ möglich. Gemeint sein kann, dass bereits das begrenzte Erleben oder die erste Offenbarung des Zorns ausreichte.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: vor diesem
  rationale: Das Demonstrativpronomen verweist im unmittelbaren Zusammenhang auf die zuvor beschriebene priesterliche Gestalt. Die Formulierung bleibt näher am knappen griechischen Ausdruck als eine ausdrückliche Ergänzung wie „vor diesem Mann“.
- source_word: εἶξεν
  choice: wich … zurück
  rationale: Das Verb bezeichnet ein Nachgeben oder Zurückweichen. Die deutsche Wendung bewahrt das Bild, ohne die Art des Eingreifens näher festzulegen.
- source_word: ὀλοθρεύων
  choice: der Vernichter
  rationale: Das substantivierte Partizip bedeutet wörtlich „der Vernichtende“. „Der Vernichter“ ist im Deutschen knapp und idiomatisch; „Vernichtungsengel“ würde eine im griechischen Wortlaut nicht ausdrücklich enthaltene Identifizierung eintragen.
- source_word: ταῦτα
  choice: diese Dinge
  rationale: Das sächliche Demonstrativpronomen im Plural hat einen nur aus dem vorhergehenden Vers erschließbaren Bezug. Die wörtlich offene Wiedergabe vermeidet eine vorschnelle Festlegung auf die priesterlichen Zeichen oder Erinnerungsmale.
- source_word: ἐφοβήθησαν
  choice: fürchtete
  rationale: Der überlieferte griechische Wortlaut hat formal eine Pluralform, während der Zusammenhang den Vernichter als fortgesetztes Subjekt nahelegt. Die deutsche Singularform folgt diesem Sinnzusammenhang; die formale Spannung wird in der Fußnote offengelegt.
- source_word: πεῖρα
  choice: Erfahrung
  rationale: Das Substantiv kann Erfahrung, Probe, Versuch oder Erprobung bedeuten. „Erfahrung des Zorns“ ist verständlich und wahrt die verdichtete Aussage, dass bereits dessen begrenztes Erleben ausreichte.
- source_word: ὀργῆς
  choice: Zorn
  rationale: Im Kontext göttlichen Gerichts gibt „Zorn“ die Schwere des Ausdrucks angemessener wieder als „Ärger“.
- source_word: ἱκανή
  choice: genügte
  rationale: Das Prädikatsadjektiv bedeutet „ausreichend“ oder „genug“. Die verbale deutsche Form ist natürlich und erhält den Sinn, dass keine weitere Entfaltung des Zorns nötig war.
theological_decisions:
- issue: Identität des ὀλοθρεύων
  choice: der Vernichter
  alternative: der Vernichtungsengel
  rationale: Der Zusammenhang erinnert an den Vollstrecker eines göttlichen Strafgerichts, doch der griechische Text nennt ihn nicht ausdrücklich einen Engel. Die Übersetzung lässt diese Identität daher offen.
- issue: Bezug von ταῦτα
  choice: diese Dinge
  alternative: die priesterlichen Zeichen und Erinnerungsmale des vorhergehenden Verses
  rationale: Der Bezug ist wahrscheinlich aus der Beschreibung im vorhergehenden Vers zu ergänzen, wird im griechischen Satz jedoch nicht ausdrücklich benannt. Die Hauptübersetzung bewahrt diese Offenheit.
- issue: Numerus und Satzbezug von ἐφοβήθησαν
  choice: Der Vernichter wird sinngemäß als fortgesetztes Subjekt verstanden.
  alternative: „Diese Dinge aber gerieten in Furcht“ bei streng formaler Zuordnung des sächlichen Plurals als Subjekt
  rationale: Die überlieferte Pluralform erzeugt mit dem unmittelbaren Kontext und dem inhaltlichen Ablauf eine grammatische Spannung. Eine wörtliche Zuordnung zu „diese Dinge“ wäre semantisch schwer verständlich; deshalb folgt der Haupttext dem wahrscheinlichen Sinn, ohne die Textschwierigkeit zu verschweigen.
- issue: Bedeutung von πεῖρα τῆς ὀργῆς
  choice: die bloße Erfahrung des Zorns
  alternative: die bloße Probe, Prüfung oder Erprobung des Zorns
  rationale: Die griechische Wendung ist knapp und kann sowohl das Erleben als auch die probeweise Offenbarung des Zorns bezeichnen. „Erfahrung“ bietet einen verständlichen Haupttext, während die Fußnote die übrigen Möglichkeiten bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Satzführung. „Vernichter“ und „Zorn“ bewahren das Gewicht des Gerichtskontexts; Fußnoten machen die lexikalische und grammatische Verdichtung des griechischen Textes sichtbar, ohne sie im Haupttext künstlich aufzulösen.
