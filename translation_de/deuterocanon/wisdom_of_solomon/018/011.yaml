base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/011.yaml
  text: And servant and master alike were punished with the same judgment[a], and the commoner suffered the same things as the king.
translation:
  language: de
  text: Sklave und Herr wurden beide mit derselben Strafe[a] bestraft, und der einfache Bürger erlitt dasselbe wie der König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit einem gleichen Strafgericht«. Das griechische Wort kann je nach Zusammenhang Strafe, Strafgericht oder Recht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία
  choice: derselben
  rationale: Im parallelen Zusammenhang mit τὰ αὐτά bezeichnet das Wort eine gleiche beziehungsweise gleichwertige Strafe, nicht bloß eine ähnliche.
- source_word: δίκη
  choice: Strafe
  rationale: Im Kontext des göttlichen Gerichts bezeichnet δίκη hier die konkret erlittene Strafwirkung; die weitere Bedeutungsspanne wird in der Fußnote bewahrt.
- source_word: δοῦλος
  choice: Sklave
  rationale: Der ausdrückliche Gegensatz zu δεσπότης macht den rechtlich-sozialen Status wesentlich; „Diener“ würde ihn abschwächen.
- source_word: δεσπότῃ
  choice: Herr
  rationale: „Herr“ bildet im Deutschen den natürlichen sozialen Gegenbegriff zu „Sklave“, ohne an dieser Stelle einen theologischen Titel nahezulegen.
- source_word: κολασθείς
  choice: wurden … mit … Strafe belegt
  rationale: Die passive Strafbedeutung des Partizips wird ausdrücklich wiedergegeben und für natürliches Deutsch auf das zusammengehörige Paar bezogen.
- source_word: δημότης
  choice: der einfache Bürger
  rationale: Im Gegensatz zum König bezeichnet δημότης einen gewöhnlichen Angehörigen des Volkes ohne königlichen Rang; „einfacher Bürger“ gibt diesen sozialen Kontrast verständlich wieder.
- source_word: βασιλεῖ
  choice: der König
  rationale: Die konkrete Bedeutung „König“ erhält den scharfen Gegensatz zwischen gewöhnlichem und königlichem Rang.
- source_word: τὰ αὐτὰ πάσχων
  choice: erlitt dasselbe
  rationale: Die knappe Formulierung bewahrt die Betonung identischen Leidens über soziale Grenzen hinweg.
theological_decisions:
- issue: Soziale Rangunterschiede im Gericht
  choice: Die Gegensätze „Sklave und Herr“ sowie „einfacher Bürger … König“ bleiben ausdrücklich erhalten.
  alternative: Die Statusbegriffe zu „Diener und Herr“ beziehungsweise „gewöhnlicher Mensch und Herrscher“ abschwächen.
  rationale: Der Vers betont, dass die Strafe Menschen ungeachtet ihrer gesellschaftlichen Stellung gleichermaßen trifft. Die konkreten Statusbezeichnungen tragen diese Aussage, ohne sie dogmatisch weiter auszudeuten.
- issue: Bedeutung von δίκη
  choice: Im Haupttext steht „Strafe“, mit einer Fußnote zur möglichen Wiedergabe als „Strafgericht“.
  alternative: „Gerechtigkeit“ oder ausschließlich „Gericht“ im Haupttext.
  rationale: Der unmittelbare Zusammenhang und κολασθείς sprechen für eine konkrete Strafe; zugleich soll die gerichtliche Bedeutung von δίκη nicht verdeckt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die soziale Härte von δοῦλος wird nicht durch „Diener“ abgeschwächt. „Gleichermaßen“ und „dasselbe“ bilden die Parallelität des griechischen Satzes nach; die Formulierung bleibt flüssig und allgemein verständlich.
