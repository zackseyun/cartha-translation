  terminology: „Zorn“ bewahrt die Schwere von ὀργή, ohne die nicht ausdrücklich genannte göttliche Zuordnung auszuschreiben. „Die Lebenden“ entspricht τοὺς ζῶντας präzise. Das Pronomen „er“ respektiert das im Griechischen implizite und im Kontext erschließbare Subjekt.
