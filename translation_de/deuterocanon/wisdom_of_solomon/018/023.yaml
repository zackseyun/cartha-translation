base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/023.yaml
  text: For when heaps of dead had already fallen one upon another[a], he stood in the midst and checked the wrath, and cut off the way to the living.
translation:
  language: de
  text: Denn als die Toten bereits haufenweise übereinandergefallen waren, trat er dazwischen, hielt den Zorn auf und schnitt den Weg zu den Lebenden ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωρηδόν
  choice: haufenweise
  rationale: Das Adverb bezeichnet eine Anhäufung in Haufen und bewahrt zusammen mit „übereinandergefallen“ das eindringliche Bild des griechischen Textes.
- source_word: ἤδη πεπτωκότων
  choice: bereits … gefallen waren
  rationale: Das Perfektpartizip beschreibt einen schon eingetretenen Zustand; die deutsche Vorzeitigkeit gibt dies natürlich wieder.
- source_word: ἐπʼ ἀλλήλων
  choice: übereinander
  rationale: Die Formulierung gibt knapp und anschaulich wieder, dass die Toten einer über dem anderen lagen.
- source_word: μεταξὺ στὰς
  choice: trat er dazwischen
  rationale: μεταξύ bezeichnet hier die Stellung zwischen den Toten und den Lebenden; „trat … dazwischen“ bewahrt zugleich die Bewegung und die vermittelnde Position.
- source_word: ἀνέκοψεν
  choice: hielt … auf
  rationale: Das Verb bedeutet anhalten oder zurückdrängen und bezeichnet hier das Aufhalten des Zorns.
- source_word: τὴν ὀργήν
  choice: den Zorn
  rationale: „Zorn“ bewahrt das Gewicht des göttlichen Strafgerichts, ohne eine ausdrückliche Ergänzung einzuführen.
- source_word: διέσχισεν
  choice: schnitt … ab
  rationale: Das Verb hat den kräftigen Sinn des Durchtrennens oder Absonderns; die deutsche Wendung erhält dieses Bild in verständlicher Form.
- source_word: τὴν πρὸς τοὺς ζῶντας ὁδόν
  choice: den Weg zu den Lebenden
  rationale: Die bildhafte Darstellung des weiteren Vordringens des Zorns zu den noch Lebenden bleibt unmittelbar erhalten.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts
  choice: Das Subjekt bleibt als „er“ unbenannt.
  alternative: Den aus dem Zusammenhang erschließbaren Namen Aaron einsetzen.
  rationale: Im griechischen Vers ist das Subjekt nur aus dem Kontext zu erschließen. Das Pronomen wahrt die Ausdrucksweise des Ausgangstextes und vermeidet eine erklärende Ergänzung.
- issue: Bedeutung von ὀργή
  choice: „Zorn“
  alternative: „Wut“ oder „Strafgericht“
  rationale: „Zorn“ bewahrt sowohl den Bezug auf göttliches Gericht als auch die im griechischen Begriff verbleibende Bild- und Bedeutungsspannung; „Strafgericht“ wäre bereits eine Deutung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur bleibt eng am griechischen Ablauf, während „trat er dazwischen“ und „schnitt den Weg … ab“ im Deutschen idiomatisch und anschaulich sind.
