  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des griechischen Satzes zuverlässig wieder: die bereits eingetretene Anhäufung der Toten (σωρηδὸν … ἤδη πεπτωκότων ἐπʼ ἀλλήλων), das unbenannte Subjekt in vermittelnder Stellung (μεταξὺ στάς), das Aufhalten des Zorns (ἀνέκοψεν τὴν ὀργήν) und das Unterbrechen seines Weges zu den Lebenden (διέσχισεν τὴν πρὸς τοὺς ζῶντας ὁδόν). „Trat er dazwischen“ ist eine idiomatische, kontextgemäße Wiedergabe und legt keinen Namen als Subjekt fest.'
