lexical_decisions:
- source_word: ἡσύχου σιγῆς
  choice: ruhige Stille
  rationale: Die Verbindung bezeichnet eine friedvolle, lautlose Ruhe. „Ruhige Stille“ bewahrt sowohl die adjektivische Färbung als auch den poetischen Klang.
- source_word: περιεχούσης
  choice: umfing
  rationale: Das Partizip bezeichnet ein Umgeben oder Umschließen. „Umfing“ ist natürlich, knapp und dem gehobenen Stil angemessen.
- source_word: τὰ πάντα
  choice: alles
  rationale: Die umfassende Wendung wird ohne unnötige Einengung auf die Welt oder die Menschen wiedergegeben.
- source_word: ἐν ἰδίῳ τάχει
  choice: in ihrem raschen Lauf
  rationale: Wörtlich steht „in ihrer eigenen Schnelligkeit“. Die gewählte Formulierung bewahrt die Bewegungsvorstellung und klingt im Deutschen idiomatisch.
- source_word: μεσαζούσης
  choice: die Mitte erreicht hatte
  rationale: Das Verb bezeichnet das Sein oder Gelangen in die Mitte. Im zeitlichen Zusammenhang ist damit die Mitte der Nacht gemeint; das Plusquamperfekt fügt den griechischen Genitivus absolutus natürlich in den weiterführenden Satz ein.
