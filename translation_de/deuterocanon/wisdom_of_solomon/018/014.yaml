  source_fidelity: Die Übersetzung gibt die beiden Genitivus-absolutus-Konstruktionen und die Bildsprache im Wesentlichen treffend wieder. »Die Mitte erreicht hatte« legt jedoch eher ein Eintreffen an einem Punkt nahe, während μεσαζούσης primär das Sich-in-der-Mitte-Befinden der Nacht bezeichnet. Das am Ende der überlieferten griechischen Wortfolge stehende τὰ πάντα bleibt in seiner Zuordnung schwierig und sollte in der Anmerkung präziser dokumentiert werden.
  naturalness: »Ruhige Stille«, »alles umfing« und »in ihrem raschen Lauf« sind poetisch, verständlich und in modernem Standarddeutsch idiomatisch. »In der Mitte war« ist hier natürlicher und enger am griechischen Zustandsausdruck als das Plusquamperfekt »die Mitte erreicht hatte«.
  terminology: Keine theologischen oder namensbezogenen Fragen. Die allgemeine Wendung τὰ πάντα wird mit »alles« angemessen wiedergegeben. Die Fußnote soll klarstellen, dass das abschließende griechische τὰ πάντα tatsächlich im Quelltext steht, statt von einer nicht näher bestimmten »vorliegenden Textgestalt« zu sprechen.
