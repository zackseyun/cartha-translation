  text: Denn als ruhige Stille alles umfing und die Nacht in ihrem raschen Lauf in der Mitte war,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und als die Nacht in ihrer eigenen Schnelligkeit in der Mitte war«. Der griechische Text ist stark verdichtet und endet mit »alles« (τὰ πάντα); dessen syntaktische Zuordnung ist umstritten bzw. unklar.'
