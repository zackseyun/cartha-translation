revisions:
- from: Denn obwohl sie zuvor angegriffen worden waren, dankten sie dafür, dass ihnen kein Schaden zugefügt wurde,[a] und baten wegen ihrer Feindschaft um Verzeihung.[b]
  to: Denn obwohl sie zuvor angegriffen worden waren, dankten sie dafür, dass ihnen kein Schaden zugefügt wurde,[a] und baten wegen ihres Zerwürfnisses um Entgegenkommen.[b]
  rationale: Die Revision ändert nur die zu spezifische Deutung von χάριν ἐδέοντο als Bitte um Verzeihung. »Um Entgegenkommen bitten« ist idiomatisches modernes Deutsch und gibt die Bitte um Gunst wieder, ohne bei der schwierigen Stelle eine nicht ausdrücklich vorhandene Vergebungsbitte festzuschreiben. Die Fußnoten bleiben korrekt an den jeweiligen Textstellen verankert und erläutern die überlieferungsbedingte Unsicherheit sowie die lexikalische Alternative.
