translation:
  language: de
  text: Denn obwohl sie zuvor angegriffen worden waren, dankten sie dafür, dass ihnen kein Schaden zugefügt wurde,[a] und baten wegen ihres Zerwürfnisses um Entgegenkommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist hier syntaktisch schwierig, besonders bei der Wendung mit »nicht schädigen«. Übersetzt ist der im Zusammenhang wahrscheinlichste Sinn: Auf frühere Feindschaft folgen Dankbarkeit darüber, keinen Schaden zu erleiden, und eine Bitte um Entgegenkommen im Blick auf das Zerwürfnis.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »und baten um Gunst hinsichtlich ihres Zerwürfnisses« beziehungsweise »hinsichtlich ihres Konflikts«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὐ βλάπτοντιν
  choice: dass ihnen kein Schaden zugefügt wurde
  rationale: Die überlieferte Formulierung ist grammatisch schwierig; βλάπτω bedeutet gewöhnlich »schädigen« oder »verletzen«. Im Zusammenhang ergibt sich am ehesten der Sinn, dass die zuvor Angegriffenen nun dafür danken, nicht geschädigt worden zu sein.
- source_word: προπολεμημένοι
  choice: obwohl sie zuvor angegriffen worden waren
  rationale: Die Form bezeichnet eine vorausgegangene kriegerische oder feindselige Auseinandersetzung. »Zuvor angegriffen« wahrt sowohl den zeitlichen Aspekt von προ- als auch den Konfliktsinn; »obwohl« macht den konzessiven Zusammenhang im Deutschen natürlich verständlich.
- source_word: εὐχαριστοῦσιν
  choice: dankten sie
  rationale: Das Verb bezeichnet Danken oder Dankbarkeit. Das Präteritum fügt sich in die Erzählfolge ein, auch wenn der vorliegende griechische Zeuge hier eine auffällige Präsensform bietet.
- source_word: τὸ διενεχθῆναι
  choice: wegen ihrer Feindschaft
  rationale: Der substantivierte Infinitiv von διαφέρω kann das Zerwürfnis, die Entfremdung oder den Konflikt bezeichnen. »Feindschaft« gibt hier die zwischenmenschliche Gegnerschaft wieder, ohne sie auf eine bloße Meinungsverschiedenheit zu verengen.
- source_word: χάριν ἐδέοντο
  choice: baten … um Verzeihung
  rationale: Wörtlich geht es um das Erbitten von Gunst oder Entgegenkommen. In Verbindung mit der vorausgegangenen Feindschaft vermittelt »um Verzeihung bitten« den naheliegenden Beziehungssinn, während eine Fußnote die wörtlichere Möglichkeit offenhält.
theological_decisions:
- issue: Umgang mit der syntaktisch schwierigen und möglicherweise gestörten griechischen Überlieferung
  choice: 'Den wahrscheinlichsten Zusammenhangssinn wiedergeben: Dank für das Ausbleiben weiteren Schadens und Bitte um Verzeihung nach früherer Feindschaft.'
  alternative: 'Formnäher, aber schwer verständlich: »Denn die zuvor Bekriegten, die nicht schädigen, danken, und sie baten um Gunst hinsichtlich des Entzweitseins.«'
  rationale: Die vorliegende griechische Zeile ist besonders bei οἱ οὐ βλάπτοντιν syntaktisch auffällig. Die Übersetzung vermeidet unverständlichen Wortlaut, kennzeichnet die Unsicherheit jedoch ausdrücklich und legt keine besondere konfessionelle Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Satzführung. Die schwierige Stelle wird sinngemäß, aber nicht glättend übersetzt; beide Unsicherheiten werden in Fußnoten offengelegt.
