translation:
  language: de
  text: Denn wie du die Gegner bestraft hast, so hast du uns dadurch verherrlicht, nachdem du uns gerufen hattest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem du uns herbeigerufen hast“ oder „indem du uns eingeladen hast“. Das griechische Wort kann ein Rufen, Herbeirufen oder Einladen bezeichnen, möglicherweise mit der Nuance „zu sich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτιμώρησας
  choice: du ... bestraft hast
  rationale: τιμωρέω bezeichnet hier das Bestrafen der feindlich Gegenüberstehenden; „bestrafen“ ist klar und legt weder Rachemotiv noch besondere Strafart fest.
- source_word: τοὺς ὑπεναντίους
  choice: die Gegner
  rationale: ὑπεναντίος bezeichnet Menschen, die feindlich oder widerständig gegenüberstehen. „Gegner“ bewahrt diese Breite, ohne zwingend einen militärischen Zusammenhang anzunehmen.
- source_word: τούτῳ
  choice: dadurch
  rationale: Der Dativ des Demonstrativpronomens verweist instrumental auf das zuvor genannte Handeln zurück. „Dadurch“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: προκαλεσάμενος
  choice: indem du uns zu dir gerufen hast
  rationale: Das mediale Partizip kann ein Herbeirufen, Auffordern oder Einladen bezeichnen und möglicherweise die Richtung zum Rufenden hin einschließen. Die Wiedergabe hält diese relationale Nuance fest, ohne sie als einzig mögliche Deutung auszugeben.
- source_word: ἐδόξασας
  choice: du ... verherrlicht hast
  rationale: δοξάζω kann „verherrlichen“ oder „ehren“ bedeuten. „Verherrlicht“ bewahrt das starke, theologisch gewichtige Gegenstück zur Bestrafung der Gegner.
theological_decisions:
- issue: Verhältnis von Gericht über die Gegner und Verherrlichung des Gottesvolkes
  choice: Dasselbe göttliche Handeln wird als Bestrafung der Gegner und als Verherrlichung des angesprochenen „uns“ dargestellt.
  alternative: τούτῳ könnte weniger ausdrücklich instrumental als „darin“ verstanden werden.
  rationale: Die enge Satzstruktur verbindet beide Wirkungen, ohne näher festzulegen, wie das Gericht die Verherrlichung bewirkt.
- issue: Bedeutung des medialen Partizips προκαλεσάμενος
  choice: „indem du uns zu dir gerufen hast“
  alternative: „nachdem du uns gerufen hattest“, „indem du uns herbeigerufen hast“ oder „indem du uns eingeladen hast“
  rationale: Die gewählte Fassung lässt eine auf Gott hin gerichtete Berufung anklingen. Da diese Nuance nicht eindeutig erzwungen ist, werden die sachlich möglichen Alternativen in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korrelative Struktur ὡς ... τούτῳ wird mit „wie ... so ... dadurch“ sichtbar gehalten; das Partizip wird zur besseren deutschen Lesbarkeit als modaler Nebensatz wiedergegeben.
