base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/001.yaml
  text: But for your holy ones there was very great light[a]; hearing their voice but not seeing their form, since they indeed had not suffered the same things[b], they counted them blessed.
translation:
  language: de
  text: Für deine Heiligen aber gab es überaus helles Licht.[a] Sie hörten ihre Stimme, sahen aber ihre Gestalt nicht; und weil jene nicht dasselbe erlitten hatten,[b] priesen sie sie glücklich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Heiligen“ sind hier die Menschen gemeint, die Gott ergeben sind und zu ihm gehören.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut ist hier schwierig. Das Verb bedeutet gewöhnlich „ersehnen“; außerdem steht im erhaltenen Text keine ausdrückliche Verneinung. Die Übersetzung gibt den im Zusammenhang naheliegenden Sinn wieder: Jene hatten nicht dieselben Leiden erfahren und wurden deshalb glücklich gepriesen.'
    reason: textual_and_lexical_difficulty
lexical_decisions:
- source_word: τοῖς ... ὁσίοις σου
  choice: für deine Heiligen
  rationale: ὅσιοι bezeichnet hier Menschen, die Gott ergeben und ihm zugehörig sind. „Heilige“ gibt den religiösen Sinn knapp und würdig wieder; gemeint ist Gottes Volk im Gegensatz zu den Ägyptern.
- source_word: μέγιστον ... φῶς
  choice: überaus helles Licht
  rationale: Der Superlativ μέγιστον verstärkt φῶς. Die deutsche Wendung gibt die Intensität natürlich wieder, ohne zwingend einen Vergleich im Sinn von „das allergrößte“ einzuführen.
- source_word: φωνὴν
  choice: Stimme
  rationale: φωνή kann „Stimme“ oder „Laut“ bedeuten. Wegen des persönlichen Bezugs und des Gegensatzes zur nicht gesehenen Gestalt ist „Stimme“ vorzuziehen.
- source_word: μορφὴν
  choice: Gestalt
  rationale: μορφή meint die sichtbare Form oder Erscheinung. „Gestalt“ bewahrt den Gegensatz zwischen Hören und Sehen, ohne Einzelheiten hinzuzufügen.
- source_word: ἐπεπώθεισαν
  choice: nicht dasselbe erlitten hatten
  rationale: 'Die überlieferte Form ist im Zusammenhang äußerst schwierig und bedeutet ihrem gewöhnlichen Wortwert nach eher „ersehnt hatten“. Die Haupttextfassung folgt dem durch den Kontext nahegelegten Sinn: Die Ägypter erkannten, dass Gottes Volk von ihrer Finsternis und ihren Leiden verschont war. Da die Negation und der Leidenssinn nicht ausdrücklich im vorliegenden griechischen Wortlaut stehen, wird dies in einer Fußnote offengelegt.'
- source_word: ἐμακάριζον
  choice: priesen sie sie glücklich
  rationale: μακαρίζω bedeutet, jemanden glücklich oder selig zu preisen. „Glücklich preisen“ wahrt den wertenden Sinn und ist im Deutschen verständlich.
theological_decisions:
- issue: Subjekt und Objekt der Verben nach dem ersten Satz
  choice: Die Ägypter hören die Stimme der Heiligen, sehen deren Gestalt nicht und preisen sie glücklich.
  alternative: Die Heiligen hören die Stimme einer anderen Gruppe; oder die gedrängte Syntax beschreibt eine wechselseitige Wahrnehmung.
  rationale: Der weitere Zusammenhang stellt die Finsternis der Ägypter dem Licht von Gottes Volk gegenüber. Daher sind die nicht ausdrücklich genannten Hörenden am ehesten die Ägypter und die glücklich Gepriesenen die Heiligen.
- issue: Deutung von ἐπεπώθεισαν und der im Kontext vorausgesetzten Verneinung
  choice: 'Kontextuell: Die Heiligen hatten nicht dasselbe erlitten.'
  alternative: 'Wortnäher zur vorliegenden Form: „weil auch jene tatsächlich ersehnt worden waren/hatten“; bei Annahme einer abweichenden oder verderbten Lesart auch: „weil auch jene dasselbe erlitten hatten“.'
  rationale: Die vorliegende Form und der Zusammenhang stehen in Spannung. Die kontextuelle Wiedergabe erklärt schlüssig, weshalb die Ägypter Gottes Volk glücklich preisen, darf aber nicht als eindeutig im griechischen Wortlaut ausgedrückt erscheinen; deshalb wird die Schwierigkeit ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem gedrängten griechischen Aufbau nahe, wird aber durch einen neuen Satz und klare Pronomen lesbar gemacht. Die erhebliche lexikalische und textliche Unsicherheit in der zweiten Vershälfte wird nicht verschwiegen, sondern in Fußnote [b] offengelegt.
