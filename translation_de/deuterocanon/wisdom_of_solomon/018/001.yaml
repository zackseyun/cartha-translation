review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe „weil jene nicht dasselbe erlitten hatten“ steht nicht im Wortlaut der angegebenen griechischen Ausgabe. Dort steht weder eine Verneinung noch ein Verb für „leiden“, sondern ἐπεπώθεισαν, gewöhnlich „sie hatten sich gesehnt / verlangt“. Da der Satz in dieser Überlieferung schwierig und sein ausgelassenes Objekt unklar ist, darf die kontextuelle Glättung nicht ohne Kennzeichnung den Haupttext bestimmen.
  naturalness: Der deutsche Text ist insgesamt flüssig und angemessen würdig. „Priesen sie sie glücklich“ ist möglich, aber die mehrfachen Pronomen bleiben schwer nachvollziehbar; „priesen sie glücklich“ nach klarerem Satzanschluss liest sich natürlicher.
  terminology: „Heilige“, „Stimme“ und „Gestalt“ sind sachgerecht. „Überaus helles Licht“ gibt die Intensität von μέγιστον idiomatisch wieder. Die Fußnote zu „Heiligen“ kann beibehalten werden, sollte aber nicht die im Vers nicht ausdrücklich genannte Identifikation mit einer bestimmten Volksgruppe festschreiben.
  issues:
  - severity: high
    issue: Die Haupttextwiedergabe von ἐπεπώθεισαν als „nicht dasselbe erlitten hatten“ fügt eine Verneinung und den Begriff des Leidens ein.
    rationale: Die vorgelegte griechische Lesart lautet ἐπεπώθεισαν („hatten sich gesehnt/verlangt“) und enthält kein οὐχ. Die im englischen Audit vertretene kontextuelle Lösung beruht daher nicht auf dem gegebenen Wortlaut. Die textliche Schwierigkeit muss im Haupttext erhalten und in einer Anmerkung erläutert werden.
  - severity: medium
    issue: Fußnote b beschreibt die kontextuelle Deutung als naheliegenden Sinn, obwohl sie den Wortlaut erheblich ersetzt.
    rationale: Die Anmerkung soll klar sagen, dass „nicht dasselbe erlitten“ eine vermutete bzw. emendierende Kontextlösung ist, nicht die direkte Übersetzung der angeführten Lesart.
  - severity: low
    issue: Die Pronomenfolge im zweiten Satz ist unnötig schwer lesbar.
    rationale: Ein Anschluss mit „Als“ und die Beibehaltung von „sie“ für die nicht ausdrücklich benannten Hörenden macht die Syntax verständlicher, ohne die Referenten stärker festzulegen als das Griechische.
  revised_text: Für deine Heiligen aber gab es überaus helles Licht.[a] Als sie deren Stimme hörten, ihre Gestalt aber nicht sahen, priesen sie sie glücklich, weil auch diese sich danach gesehnt hatten.[b]
  revised_footnotes:
  - marker: a
    text: Mit „Heiligen“ sind hier Menschen gemeint, die Gott ergeben sind und zu ihm gehören.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut ist schwierig. Er lautet wörtlich etwa: „weil auch jene sich gesehnt hatten“; das Ziel ihres Sehnens wird nicht genannt. Die Deutung „weil sie nicht dasselbe erlitten hatten“ folgt einer kontextuellen, möglicherweise emendierenden Lösung und ist nicht unmittelbar im überlieferten Wortlaut ausgedrückt.'
    reason: textual_and_lexical_difficulty
  revision_rationale: Die Revision folgt zunächst der vorgelegten griechischen Lesart und bewahrt deren Schwierigkeit, statt die im englischen Audit vertretene, aber vom Wortlaut abweichende Deutung in den Haupttext einzutragen. „Danach“ macht im Deutschen das im Griechischen fehlende Objekt lediglich anaphorisch kenntlich, ohne es zu bestimmen. Die Fußnote dokumentiert die alternative kontextuelle Lösung transparent.
