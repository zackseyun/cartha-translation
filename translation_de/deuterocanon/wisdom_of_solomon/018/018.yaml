  text: and another[a], cast down elsewhere, half-dead[b], made known the cause for which he was dying.
translation:
  language: de
  text: Und ein anderer, anderswo[a] hingeworfen[b] und halbtot, gab den Grund zu erkennen, aus dem er im Sterben lag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an einem anderen Ort«. Das griechische Adverb bezeichnet einen anderen Schauplatz als im vorausgehenden Beispiel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »geschleudert«. Das griechische Partizip betont, dass er geworfen oder geschleudert wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλαχῇ
  choice: anderswo
  rationale: Das Adverb bezeichnet einen anderen Ort als im vorausgehenden Beispiel. »Anderswo« ist knapp, natürlich und bewahrt diesen räumlichen Kontrast.
- source_word: ῥιφεὶς
  choice: zu Boden geschleudert worden war
  rationale: Das Partizip bezeichnet ein Werfen oder Schleudern. Die Formulierung wahrt den körperlichen Vorgang, ohne einen Handelnden oder eine genauere Todesursache hinzuzufügen.
- source_word: ἡμίθνητος
  choice: halbtot
  rationale: Dies gibt die unmittelbare und bildhafte Bedeutung des Adjektivs wieder. »Dalag« macht die prädikative Zustandsbeschreibung im Deutschen natürlich.
- source_word: διʼ ἣν ... αἰτίαν
  choice: aus welchem Grund
  rationale: Die Wendung verweist auf den konkreten Grund seines Sterbens. Diese Formulierung ist im heutigen Deutsch klarer als das steife »die Ursache, derentwegen«.
- source_word: ἔθνησκεν
  choice: im Sterben lag
  rationale: Das Imperfekt stellt einen noch andauernden Sterbevorgang dar, nicht einen bereits abgeschlossenen Tod.
- source_word: ἐνεφάνιζεν
  choice: gab zu erkennen
  rationale: Das Verb bedeutet, etwas offenbar oder erkennbar zu machen. Die gewählte Wendung klingt natürlich und lässt offen, auf welche Weise der Sterbende den Grund mitteilte.
theological_decisions:
- issue: Verlaufsaspekt beim Sterben des Opfers
  choice: 'Das Imperfekt ἔθνησκεν wird als andauernder Vorgang wiedergegeben: »im Sterben lag«.'
  alternative: »starb«
  rationale: 'So bleibt die Unmittelbarkeit der Szene erhalten: Der Halbtote lebt noch und macht während des Sterbens dessen Grund erkennbar. Dies ist eine grammatische, nicht konfessionelle Entscheidung.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die relative Satzfügung löst die gedrängten griechischen Partizipial- und Adjektivformen lesbar auf; »im Sterben lag« bewahrt dabei ausdrücklich den unvollendeten Vorgang.
