base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/005.yaml
  text: When they had resolved to kill the infants of the holy ones[a], and one child had been exposed and rescued[b], you took away their multitude of children as a rebuke and destroyed them all together in mighty water.
translation:
  language: de
  text: Als sie beschlossen hatten, die Kleinkinder der Heiligen zu töten, und ein einziges Kind ausgesetzt und gerettet worden war[a], nahmst du ihnen zur Zurechtweisung die große Zahl ihrer Kinder weg[c] und vernichtetest sie alle miteinander in reißendem Wasser.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das eine ausgesetzte und gerettete Kind ist wahrscheinlich Mose (2. Mose 2,3–10).
    reason: cross_reference
  - marker: b
    text: 'Oder: „in heftigem Wasser“ beziehungsweise „in überwältigendem Wasser“. Gemeint ist das Meer als Mittel der Vernichtung.'
    reason: lexical_alternative
  - marker: c
    text: Die hier überlieferte griechische Verbform lautet wörtlich gewöhnlich „sie nahmen weg“. Der Zusammenhang und das folgende „du vernichtetest“ sprechen dafür, dass weiterhin Gott angeredet wird.
    reason: textual_or_grammatical_note
lexical_decisions:
- source_word: βουλευσαμένους
  choice: als sie beschlossen hatten
  rationale: Das Partizip bezeichnet einen überlegten, vorsätzlichen Entschluss; die temporale Wiedergabe ergibt im Deutschen einen natürlichen Satzanschluss.
- source_word: τὰ τῶν ὁσίων ... νήπια
  choice: die Kleinkinder der Heiligen
  rationale: νήπια bezeichnet sehr junge Kinder; ὅσιοι benennt hier die zu Gott gehörenden heiligen Menschen. „Heilige“ bleibt nahe am Griechischen, ohne ausdrücklich eine spätere kirchliche Kategorie einzuführen.
- source_word: ἑνὸς ... τέκνου
  choice: ein einziges Kind
  rationale: τέκνον ist geschlechtsneutral. „Ein einziges“ hebt den beabsichtigten Gegensatz zur großen Zahl der ägyptischen Kinder hervor.
- source_word: ἐκτεθέντος
  choice: ausgesetzt
  rationale: Das Verb bezeichnet hier das Aussetzen eines Kindes und spielt auf die Erzählung von Mose an.
- source_word: σωθέντος
  choice: gerettet
  rationale: Die Wahl bezeichnet konkret die Bewahrung aus Lebensgefahr, ohne die erzählerische Aussage unnötig zu theologisieren.
- source_word: εἰς ἔλεγχον
  choice: zur Zurechtweisung
  rationale: ἔλεγχος umfasst Überführung, Rüge und zurechtweisendes Gericht. Die Formulierung bewahrt diese moralisch-gerichtliche Weite.
- source_word: πλῆθος τέκνων
  choice: die große Zahl ihrer Kinder
  rationale: Die idiomatische deutsche Wendung gibt πλῆθος wieder und erhält den rhetorischen Gegensatz zu dem einen geretteten Kind.
- source_word: ὁμοθυμαδόν
  choice: alle miteinander
  rationale: In diesem Zusammenhang hebt das Adverb die gemeinsame, umfassende Vernichtung hervor.
- source_word: ἐν ὕδατι σφοδρῷ
  choice: in reißendem Wasser
  rationale: σφοδρός bezeichnet hier die heftige, überwältigende Kraft des Wassers. Der kollektive Singular „Wasser“ wird beibehalten.
- source_word: ἀφεῖλον
  choice: nahmst du ihnen ... weg
  rationale: Die vorgelegte griechische Form ist formal mehrdeutig beziehungsweise syntaktisch auffällig, da sie gewöhnlich als dritte Person Plural verstanden wird; der unmittelbare Zusammenhang und das folgende ἀπώλεσας sprechen jedoch für Gott als angeredetes Subjekt.
theological_decisions:
- issue: Bezug des einen ausgesetzten und geretteten Kindes
  choice: Der Haupttext lässt das Kind unbenannt; die Fußnote weist auf Mose hin.
  alternative: Das Kind im Haupttext ausdrücklich als Mose bezeichnen.
  rationale: Die Formulierung erinnert deutlich an Exodus 2, nennt Mose jedoch nicht. So bleibt der Wortlaut offen und die wahrscheinliche Anspielung wird transparent gemacht.
- issue: Bezeichnung der ὅσιοι
  choice: die Heiligen
  alternative: die Frommen; die Gott treuen Menschen
  rationale: „Die Heiligen“ bildet die substantivische Personenbezeichnung knapp ab. Gemeint ist Gottes heiliges Volk, ohne dass der Text eine spätere konfessionelle Heiligenlehre voraussetzt.
- issue: Subjekt von ἀφεῖλον
  choice: 'Gott als angeredetes Subjekt: „nahmst du ... weg“'
  alternative: 'Unbestimmtes oder pluralisches Subjekt: „sie nahmen ... weg“'
  rationale: Die übermittelte Form ἀφεῖλον sieht formal wie die dritte Person Plural aus; inhaltlich verlangt der Satz jedoch Gottes Gerichtshandeln, und das anschließende ἀπώλεσας ist eindeutig zweite Person Singular. Die Fußnote legt die sprachliche Unebenheit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem langen griechischen Periodensatz erkennbar verpflichtet, wird aber idiomatisch gegliedert. Die Kontraste „ein einziges Kind“ und „die große Zahl ihrer Kinder“ sowie Rettung und Gericht werden bewusst bewahrt.
