review_pass:
  verdict: revise
  source_fidelity: Die Anrede Gottes in „vernichtetest du“ gibt ἀπώλεσας korrekt wieder. Die im bereitgestellten griechischen Quellentext stehende Form ἀφεῖλον ist jedoch formal dritte Person Plural und kann nicht ohne Kennzeichnung als „nahmst du“ übersetzt werden. Da der Satzkontext zugleich sehr deutlich die zweite Person Singular erwartet, ist eine knappe textkritisch-grammatische Fußnote erforderlich.
  naturalness: Der Satz ist im Deutschen gut verständlich und dem würdigen Register angemessen. „in reißendem Wasser“ ist idiomatisch; „zur Zurechtweisung“ ist möglich, aber „zum Erweis ihrer Schuld“ gibt εἰς ἔλεγχον im Gerichtskontext präziser und natürlicher wieder.
  terminology: „die Kleinkinder der Heiligen“ ist grundsätzlich vertretbar, kann im heutigen Deutsch jedoch leicht als spätere kirchliche Heiligenkategorie verstanden werden. „die Kleinkinder der Gottesfürchtigen“ bezeichnet die Personengruppe natürlich und ohne konfessionelle Nebenbedeutung. Das unbestimmte „Kind“ bewahrt das geschlechtsneutrale τέκνον.
  issues:
  - severity: medium
    issue: Die Übersetzung von ἀφεῖλον als zweite Person Singular wird im Haupttext nicht als vom überlieferten Wortlaut abweichend erkennbar.
    rationale: ἀφεῖλον ist formal dritte Person Plural, während der folgende Aorist ἀπώλεσας eindeutig zweite Person Singular ist. Der Kontext legt eine Lesart „du nahmst weg“ nahe, aber der abweichende Quellentext muss transparent vermerkt werden.
  - severity: low
    issue: „Heiligen“ kann missverständlich technisch-konfessionell wirken.
    rationale: ὅσιοι bezeichnet hier Gottes frommes bzw. ihm ergebenes Volk, nicht notwendig eine spätere Kategorie von „Heiligen“. Eine weniger technisch klingende Personenbezeichnung ist im modernen Standarddeutsch klarer.
  revised_text: Als sie beschlossen hatten, die Kleinkinder der Gottesfürchtigen zu töten, und ein einziges Kind ausgesetzt und gerettet worden war[a], nahmst du ihnen zum Erweis ihrer Schuld die große Zahl ihrer Kinder weg[c] und vernichtetest sie alle miteinander in reißendem Wasser[b].
  revised_footnotes:
  - marker: a
    text: Das eine ausgesetzte und gerettete Kind ist wahrscheinlich Mose (2. Mose 2,3–10).
    reason: cross_reference
  - marker: b
    text: 'Oder: „in heftigem Wasser“ beziehungsweise „in überwältigendem Wasser“. Gemeint ist das Meer als Mittel der Vernichtung.'
    reason: lexical_alternative
  - marker: c
    text: Der überlieferte griechische Text hat hier formal „sie nahmen weg“ (dritte Person Plural). Der Satzkontext und das folgende eindeutige „du vernichtetest“ legen jedoch „du nahmst weg“ nahe; zahlreiche Textzeugen bzw. Ausgaben bieten an dieser Stelle entsprechend eine Form der zweiten Person Singular.
    reason: textual_or_grammatical_note
  revision_rationale: Die Revision bewahrt die wahrscheinliche Satzintention und die Gottes-Anrede, macht aber die im bereitgestellten griechischen Text vorhandene grammatische Spannung sachlich und ohne dogmatische Harmonisierung transparent. Außerdem wird ὅσιοι im modernen Deutsch weniger technisch wiedergegeben und εἰς ἔλεγχον kontextgerecht als gerichtlicher Erweis der Schuld gefasst.
