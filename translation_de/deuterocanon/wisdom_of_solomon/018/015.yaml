base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/015.yaml
  text: your all-powerful word leaped from heaven[a], from royal thrones, a relentless warrior, into the midst of the doomed land[b];
translation:
  language: de
  text: Dein allmächtiges Wort[a] sprang vom Himmel, von königlichen Thronen[b] – ein unerbittlicher Krieger – mitten in das dem Verderben geweihte Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier personifizierte »Wort« wird unterschiedlich ausgelegt; das Griechische kann jedoch auch allgemein Gottes wirksames Wort meinen.
    reason: Bewahrt die Auslegungsmehrdeutigkeit von λόγος, ohne eine bestimmte personale oder christologische Deutung vorauszusetzen.
  - marker: b
    text: Im Griechischen stehen sowohl »Himmel« als auch »Throne« im Plural; im Deutschen wird »Himmel« hier idiomatisch im Singular wiedergegeben, während der Plural »Throne« erhalten bleibt.
    reason: Dokumentiert die Numerusformen des Ausgangstextes und die idiomatische Anpassung im Deutschen.
lexical_decisions:
- source_word: ὁ παντοδύναμός σου λόγος
  choice: dein allmächtiges Wort
  rationale: παντοδύναμος bezeichnet uneingeschränkte Macht; »allmächtig« ist die natürliche und würdevolle deutsche Entsprechung. λόγος bleibt »Wort«, ohne eine spätere christologische Deutung in den Haupttext einzutragen.
- source_word: ἀπʼ οὐρανῶν
  choice: vom Himmel
  rationale: Der griechische Plural kann in diesem Zusammenhang idiomatisch mit dem deutschen Singular »Himmel« wiedergegeben werden.
- source_word: ἐκ θρόνων βασιλείων
  choice: von königlichen Thronen
  rationale: Die Wiedergabe bewahrt den Plural des Griechischen und die königliche Bildwelt.
- source_word: ἀπότομος πολεμιστής
  choice: ein unerbittlicher Krieger
  rationale: ἀπότομος kann Schroffheit, Härte oder schonungslose Entschlossenheit ausdrücken. »Unerbittlich« gibt im Zusammenhang des Gerichts diese Kraft wieder; »Krieger« bewahrt das militärische Bild.
- source_word: εἰς μέσον
  choice: mitten in
  rationale: Die geläufige deutsche Wendung gibt die Bewegung ins Innere eines Ortes natürlich wieder.
- source_word: τῆς ὀλεθρίας γῆς
  choice: das dem Verderben geweihte Land
  rationale: ὀλέθριος kann sowohl verderbenbringend als auch dem Verderben verfallen bedeuten. Im Gerichtszusammenhang bezeichnet die Formulierung das Land als dem Untergang bestimmt, ohne es bereits als verwüstet darzustellen.
- source_word: ἥλατο
  choice: sprang
  rationale: Das Verb beschreibt eine plötzliche, kraftvolle Sprungbewegung und erhält so die Lebendigkeit des griechischen Bildes.
theological_decisions:
- issue: Ob λόγος ausdrücklich als personale oder christologische Bezeichnung wiederzugeben ist
  choice: Wort im Haupttext, ohne interpretierende Personalisierung
  alternative: »Wort« ausdrücklich als göttliche Person verstehen
  rationale: Der unmittelbare Zusammenhang personifiziert Gottes wirksames Wort im Gericht, verlangt aber keine eindeutige Identifikation mit einer bestimmten göttlichen Person. Die Fußnote bewahrt die weitergehende Lesemöglichkeit.
- issue: Wie die militärische Gerichtsmetaphorik wiederzugeben ist
  choice: ein unerbittlicher Krieger
  alternative: ein strenger Krieger / ein schonungsloser Krieger
  rationale: Die Fassung erhält die Härte des Bildes, ohne mit »schonungslos« oder ähnlichen Ausdrücken mehr auszusagen, als ἀπότομος sicher trägt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche machen die nominativische Apposition »ein unerbittlicher Krieger« sichtbar und vermeiden das im Griechischen nicht ausdrücklich vorhandene vergleichende »wie/als«. Die Wortstellung bewahrt die rasche, dramatische Bewegung des Verses.
