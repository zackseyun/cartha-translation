base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/012.yaml
  text: And all together[a], under one sentence of death, they had countless dead; for the living were not even sufficient to bury them, since in a single moment their most honored offspring was destroyed.
translation:
  language: de
  text: Und alle zugleich hatten unter einem einzigen Todesurteil zahllose Tote; denn die Lebenden reichten nicht einmal aus, sie zu begraben, weil in einem einzigen Augenblick ihre höher geschätzte Nachkommenschaft[a] vernichtet wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Erstgeborenen. Der Zusammenhang spielt auf die Plage an, die Ägyptens Erstgeborene traf; das Griechische bezeichnet hier jedoch wörtlicher ihre „höher geschätzte Nachkommenschaft“.'
    reason: Bewahrt die kontextuell klare Exodus-Anspielung, ohne die weniger eindeutige griechische Formulierung im Haupttext zu verengen; korrigiert zugleich die vergleichende Form von ἐντιμοτέρα.
lexical_decisions:
- source_word: ὁμοθυμαδόν
  choice: alle zugleich
  rationale: Gibt hier die gemeinsame und gleichzeitige Betroffenheit wieder, ohne eine bewusste Übereinstimmung anzudeuten.
- source_word: ἐν ἑνὶ ὀνόματι θανάτου
  choice: unter demselben Todesurteil
  rationale: Bewahrt den Gedanken einer einzigen, alle treffenden Todesbestimmung; die wörtliche Wendung „in einem Namen des Todes“ wäre im Deutschen unverständlich.
- source_word: νεκροὺς εἶχον ἀναριθμήτους
  choice: hatten … zahllose Tote
  rationale: Folgt der possessiven griechischen Konstruktion und drückt das erschütternde Ausmaß knapp und würdig aus.
- source_word: οὐδὲ γὰρ πρὸς τὸ θάψαι οἱ ζῶντες ἦσαν ἱκανοί
  choice: denn die Lebenden reichten nicht einmal aus, sie zu begraben
  rationale: Erhält den Gegensatz zwischen Lebenden und Toten sowie den Gedanken, dass die Überlebenden für die Bestattung zahlenmäßig nicht ausreichten.
- source_word: πρὸς μίαν ῥοπὴν
  choice: in einem einzigen Augenblick
  rationale: Vermittelt die extreme Plötzlichkeit in natürlichem, gehobenem Gegenwartsdeutsch.
- source_word: ἡ ἐντιμοτέρα γένεσις αὐτῶν
  choice: ihre am höchsten geehrte Nachkommenschaft
  rationale: Gibt die wertende Steigerung von ἔντιμος und γένεσις als Nachkommenschaft wieder, ohne das kontextuell naheliegende „Erstgeborene“ in den Haupttext einzutragen.
- source_word: διεφθάρη
  choice: vernichtet wurde
  rationale: Bewahrt die Passivform und die starke, katastrophale Bedeutung des Verbs im Gerichtskontext.
theological_decisions:
- issue: Soll die Anspielung auf den Tod der ägyptischen Erstgeborenen ausdrücklich gemacht werden?
  choice: am höchsten geehrte Nachkommenschaft
  alternative: Erstgeborene
  rationale: Der Zusammenhang verweist auf die Erstgeborenen Ägyptens, doch der griechische Wortlaut verwendet nicht πρωτότοκος. Der Haupttext wahrt daher die beschreibende Formulierung; die Fußnote nennt die kontextuelle Deutung.
- issue: Bedeutung von ἐν ἑνὶ ὀνόματι θανάτου
  choice: unter demselben Todesurteil
  alternative: durch dieselbe Art des Todes
  rationale: „Todesurteil“ macht die gemeinsame Todesbestimmung verständlich und passt zum Gerichtskontext, ohne zu behaupten, der griechische Ausdruck sei eine eindeutige juristische Fachformel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am griechischen Gedankengang, wird aber idiomatisch geglättet. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Wendung.
