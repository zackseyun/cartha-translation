base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/019.yaml
  text: For the dreams that troubled them foretold this[b][a], so that they might not perish without knowing why they were suffering.
translation:
  language: de
  text: Denn die Träume, die sie beunruhigt hatten, kündigten ihnen dies im Voraus an[a], damit sie nicht umkämen, ohne zu wissen, weshalb sie Schlimmes erleiden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sagten ihnen dies voraus“ beziehungsweise „warnten sie im Voraus“. Das griechische Verb kann sowohl ein vorheriges Anzeigen als auch eine Vorauswarnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wegen dessen, was sie Schlimmes erleiden“. Die griechische Wendung bezeichnet, dass jemand leidet oder übel betroffen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ γὰρ ὄνειροι
  choice: Denn die Träume
  rationale: Der Artikel verweist auf die im Zusammenhang vorausgesetzten oder bereits erwähnten Träume; γάρ wird begründend mit „denn“ wiedergegeben.
- source_word: θορυβήσαντες αὐτοὺς
  choice: die sie beunruhigt hatten
  rationale: Das Partizip bezeichnet ein Versetzen in Unruhe oder Bestürzung. Der deutsche Relativsatz ist natürlich und das Plusquamperfekt macht deutlich, dass die Träume sie zuvor beunruhigt hatten.
- source_word: τοῦτο προεμήνυσαν
  choice: kündigten ihnen dies im Voraus an
  rationale: προμηνύω bezeichnet ein vorheriges Anzeigen, Voraussagen oder Warnen. „im Voraus ankündigen“ bewahrt sowohl die zeitliche als auch die warnende Komponente, ohne eine eindeutige Zukunftsprophetie zu erzwingen. Das indirekte Objekt „ihnen“ ist im Deutschen zur Verdeutlichung idiomatisch ergänzt.
- source_word: ἵνα μὴ … ἀπόλωνται
  choice: damit sie nicht umkämen
  rationale: ἵνα mit Konjunktiv wird als Zweckangabe wiedergegeben; „umkämen“ entspricht dem ernsten, literarischen Sinn von ἀπόλλυμι.
- source_word: ἀγνοοῦντες διʼ ὃ
  choice: ohne zu wissen, weshalb
  rationale: Das Partizip beschreibt den Zustand der Unwissenheit beim möglichen Untergang; διʼ ὃ fragt nach dem Grund beziehungsweise der Ursache.
- source_word: κακῶς πάσχουσιν
  choice: sie leiden mussten
  rationale: κακῶς πάσχειν bedeutet idiomatisch, Schlimmes zu erleiden beziehungsweise schwer betroffen zu sein. „leiden mussten“ ist im Deutschen natürlich, drückt die Widerfahrnis aus und vermeidet das schwerfällige „schlimm litten“.
theological_decisions:
- issue: Zweck der beunruhigenden Träume
  choice: Die Träume werden als vorherige Warnung dargestellt, damit die Betroffenen nicht in Unkenntnis über den Grund ihres Leidens umkommen.
  alternative: 'Die ἵνα-Klausel könnte lockerer als tatsächliche Folge verstanden werden: Die Träume bewirkten, dass sie nicht unwissend umkamen.'
  rationale: 'ἵνα μὴ bezeichnet hier am natürlichsten einen Zweck. Damit bleibt die Spannung bestehen: Das Leiden und mögliche Umkommen werden nicht abgeschwächt, zugleich wird ihnen der Grund durch eine Vorauswarnung bekannt gemacht.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der begründende Anschluss mit „Denn“ und die Zweckkonstruktion mit „damit“ bleiben erhalten. Die Formulierung vermeidet konfessionelle Zusätze und bewahrt die Mehrdeutigkeit von προμηνύω zwischen Vorhersage und Vorauswarnung.
