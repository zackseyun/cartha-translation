  text: He overcame the multitude not by strength of body, nor by the force of weapons, but by a word he subdued the punisher, reminding him of the oaths to the fathers and the covenants.
translation:
  language: de
  text: Er bezwang die Menge weder durch Körperkraft noch durch die Wirksamkeit von Waffen; vielmehr unterwarf er den Strafenden[a] durch ein Wort, indem er ihn an die den Vätern gegebenen Schwüre[b] und die Bünde erinnerte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den, der strafte“. Das Griechische sagt nicht ausdrücklich, ob Gott, ein vernichtender Engel oder eine personifiziert gedachte Gerichtsmacht gemeint ist.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich auch: „die Schwüre der Väter“. Der griechische Genitiv kann formal auch Schwüre bezeichnen, welche die Väter selbst leisteten; im Zusammenhang sind wahrscheinlich die den Vätern gegebenen eidlichen Zusagen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησεν
  choice: bezwang
  rationale: Das Verb bezeichnet ein Siegen oder Überwinden. „Bezwang“ bewahrt die kräftige Aussage, ohne eine Tötung anzudeuten.
- source_word: τὸν ὄχλον
  choice: die Menge
  rationale: ὄχλος bezeichnet eine Menge oder Menschenmasse; die bestimmte und kollektive Ausdrucksweise des Griechischen bleibt erhalten.
- source_word: οὐκ ἰσχύι τοῦ σώματος
  choice: weder durch Körperkraft
  rationale: Der Dativ bezeichnet das Mittel. Die knappe Form erhält den Gegensatz zu Waffen und Wort.
- source_word: οὐχ ὅπλων ἐνεργείᾳ
  choice: noch durch die Wirksamkeit von Waffen
  rationale: ἐνέργεια bezeichnet hier die wirksame Kraft oder Betätigung. „Wirksamkeit“ bleibt näher am griechischen Ausdruck als eine bloße Umschreibung mit Gewalt.
- source_word: ἀλλὰ λόγῳ
  choice: vielmehr … durch ein Wort
  rationale: λόγος kann Wort oder Rede bedeuten. „Durch ein Wort“ erhält die Kürze und den instrumentalen Gegensatz.
- source_word: τὸν κολάζοντα
  choice: den Strafenden
  rationale: Das substantivierte Präsenspartizip benennt den strafenden Akteur, ohne ihn ausdrücklich als Gott, Engel oder personifizierte Gerichtsmacht zu identifizieren.
- source_word: ὑπέταξεν
  choice: unterwarf
  rationale: ὑποτάσσω bedeutet unterordnen oder unterwerfen. Die starke Bildsprache des Ausgangstextes wird bewahrt, ohne den nicht genannten Akteur näher zu bestimmen.
- source_word: ὅρκους πατέρων
  choice: die den Vätern geleisteten Eide
  rationale: Der Genitiv ist formal mehrdeutig. Im patriarchalischen Bundeskontext liegt die Deutung als Eide gegenüber den Vätern nahe; die Fußnote weist auf die wörtlich mögliche Alternative hin.
- source_word: καὶ διαθήκας
  choice: und die Bundesschlüsse
  rationale: διαθήκη bezeichnet im biblischen Griechisch gewöhnlich einen Bund. „Bundesschlüsse“ gibt den griechischen Plural deutlich wieder.
- source_word: ὑπομνήσας
  choice: indem er ihn … erinnerte
  rationale: Das Aoristpartizip bezeichnet Mittel oder begleitenden Umstand. Das im Deutschen nötige Pronomen greift den zuvor genannten Strafenden auf, ohne dessen Identität zu klären.
theological_decisions:
- issue: Identität des Strafenden und Bezug des Erinnerns
  choice: „den Strafenden“ und „ihn“
  alternative: „den, der strafte“; ausdrückliche Identifikation als Gott oder vernichtender Engel
  rationale: Der griechische Text nennt nur einen substantivierten Partizipialausdruck. Die Übersetzung macht den grammatischen Bezug lesbar, lässt aber die Identität des strafenden Akteurs bewusst offen.
- issue: Bedeutung von λόγῳ
  choice: „durch ein Wort“
  alternative: „durch Fürbitte“ oder „durch eine Rede“
  rationale: „Durch ein Wort“ bewahrt die prägnante Formulierung und vermeidet es, die im Kontext naheliegende Fürbitte bereits in den Wortlaut einzutragen.
- issue: Beziehung der Eide zu den Vätern
  choice: Eide, die den Vätern geleistet wurden
  alternative: Eide, welche die Väter selbst schworen
  rationale: Der Genitiv allein legt die Richtung nicht eindeutig fest. Der Bundeskontext stützt die gewählte Lesart, doch die alternative grammatische Möglichkeit wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Der Parallelismus der Mittelangaben und die starke, theologisch spannungsreiche Formulierung „unterwarf den Strafenden“ bleiben erhalten.
