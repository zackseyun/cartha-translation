base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/009.yaml
  text: For the holy children of good men were secretly offering sacrifices[a], and in unity they established the divine law, that the holy ones would share alike in the same good things and dangers[c][b], while their fathers were already singing beforehand hymns of praise.
translation:
  language: de
  text: 'Denn im Verborgenen[a] brachten die frommen Kinder guter Menschen Opfer dar. Einmütig legten sie das göttliche Gesetz[b] fest: Die Heiligen[c] sollten gleichermaßen an denselben Gütern wie auch an denselben Gefahren teilhaben, während ihre Väter bereits im Voraus Loblieder sangen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „heimlich“. Das griechische κρυφῇ betont, dass die Opferhandlung verdeckt geschah.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „das Gesetz der Göttlichkeit“. Die griechische Wendung ist ungewöhnlich.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische τοὺς ἁγίους bedeutet wörtlich „die Heiligen“ beziehungsweise „die heiligen Menschen“; eine spätere christliche Fachbedeutung ist damit nicht zwingend vorausgesetzt.
    reason: theological_clarity
lexical_decisions:
- source_word: κρυφῇ
  choice: im Verborgenen
  rationale: Die adverbiale Form bezeichnet eine verdeckte, nicht öffentliche Handlung. „Im Verborgenen“ ist natürliches Deutsch und bewahrt den heimlichen Charakter.
- source_word: ἐθυσίαζον
  choice: brachten … Opfer dar
  rationale: Der Imperfekt bezeichnet eine andauernde oder wiederholte Opferhandlung; „Opfer darbringen“ gibt den kultischen Sinn eindeutig wieder.
- source_word: ὅσιοι
  choice: frommen
  rationale: ὅσιος bezeichnet hier Menschen, die Gott ergeben und in religiöser Treue handeln. „Fromm“ ist im Deutschen präziser als „heilig“, da später im Vers ἅγιος steht.
- source_word: παῖδες ἀγαθῶν
  choice: Kinder guter Menschen
  rationale: παῖδες kann Kinder oder Nachkommen bezeichnen; der substantivierte Genitiv ἀγαθῶν meint die Guten beziehungsweise gute Menschen. Die Wiedergabe lässt Alter und Geschlecht offen, ohne die genealogische Beziehung aufzugeben.
- source_word: τὸν τῆς θειότητος νόμον
  choice: das göttliche Gesetz
  rationale: Die ungewöhnliche Genitivverbindung lautet wörtlicher „das Gesetz der Göttlichkeit“. „Das göttliche Gesetz“ ist verständlich und bewahrt den Bezug auf das Göttliche, ohne eine philosophische Abstraktion aufzudrängen.
- source_word: ἐν ὁμονοίᾳ
  choice: einmütig
  rationale: Das Adverb gibt die gemeinsame Gesinnung und geschlossene Übereinstimmung der Gruppe knapp und idiomatisch wieder.
- source_word: διέθεντο
  choice: legten sie … fest
  rationale: Das Medium bezeichnet ein verbindliches Ordnen oder Festsetzen. „Festlegen“ erhält den feierlich-verbindlichen Sinn und glättet die Spannung nicht, dass die Handelnden ein göttliches Gesetz festlegen.
- source_word: μεταλήμψεσθαι
  choice: sollten … teilhaben
  rationale: Der Infinitiv gibt den Inhalt der Festlegung an und bezeichnet gemeinsame Teilhabe. „Sollten“ passt zu der vorausgehenden verbindlichen Vereinbarung.
- source_word: τῶν αὐτῶν ὁμοίως καὶ ἀγαθῶν καὶ κινδύνων
  choice: gleichermaßen an denselben Gütern wie auch an denselben Gefahren
  rationale: Die Formulierung erhält sowohl die Gleichheit der Teilhabe als auch den betonten Gegensatz zwischen Gutem und Gefahren. „Güter“ bleibt näher an ἀγαθά als das deutendere „Segnungen“.
- source_word: τοὺς ἁγίους
  choice: die Heiligen
  rationale: Die substantivische Wiedergabe folgt dem griechischen Ausdruck eng. Eine Fußnote verhindert, dass ausschließlich die spätere christliche Fachbedeutung vorausgesetzt wird.
- source_word: πατέρων
  choice: ihre Väter
  rationale: Das Possessivpronomen macht die im Zusammenhang erkennbare Beziehung zur genannten Gemeinschaft im Deutschen deutlich.
- source_word: προαναμελπόντων αἴνους
  choice: bereits im Voraus Loblieder sangen
  rationale: Die Wiedergabe bewahrt sowohl das vorausgehende Singen in προαναμέλπω als auch den Lobcharakter von αἶνοι.
theological_decisions:
- issue: Historische Identität der Handelnden
  choice: Die Formulierung bleibt bei den frommen Kindern guter Menschen und setzt die Israeliten der Passahnacht nicht ausdrücklich in den Text ein.
  alternative: Die Israeliten beziehungsweise Juden ausdrücklich nennen.
  rationale: Der Exodus- und Passahbezug ergibt sich aus dem Kontext von Weisheit 18, steht aber nicht ausdrücklich in diesem Vers.
- issue: Bedeutung von τοὺς ἁγίους
  choice: die Heiligen
  alternative: die heiligen Menschen / die Geheiligten
  rationale: „Die Heiligen“ bildet die substantivierte griechische Bezeichnung formal ab; die Fußnote macht deutlich, dass nicht zwingend eine spätere kirchliche Kategorie gemeint ist.
- issue: Verhältnis der Gemeinschaft zum göttlichen Gesetz
  choice: Sie legten das göttliche Gesetz einmütig fest.
  alternative: Sie verpflichteten sich einmütig auf das göttliche Gesetz.
  rationale: Die Alternative würde die theologisch auffällige Handlung stärker erklären und damit die echte Spannung des griechischen διέθεντο möglicherweise auflösen. Die gewählte Fassung lässt offen, ob ein Gesetz festgesetzt, vereinbart oder verbindlich geordnet wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch-biblischem Wortschatz („Opfer darbringen“, „Loblieder“). Kurze Satzglieder und ein Doppelpunkt machen die inhaltliche Infinitivkonstruktion verständlich, ohne ihre verbindliche und gemeinschaftliche Aussage abzuschwächen.
