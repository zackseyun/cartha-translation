translation:
  language: de
  text: Doch widerhallte das misstönende Geschrei der Feinde, und weithin verbreitete sich die jammervolle Klage um die Kinder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντήχει
  choice: widerhallte
  rationale: Das Imperfekt bezeichnet ein fortdauerndes Ertönen oder Widerhallen und bewahrt die lebendige akustische Wirkung.
- source_word: ἀσύμφωνος
  choice: misstönend
  rationale: Das Wort bezeichnet wörtlich etwas Unharmonisches oder nicht Zusammenstimmendes; „misstönend“ bewahrt hier den akustischen Sinn.
- source_word: ἐχθρῶν
  choice: der Feinde
  rationale: Der Genitiv bezeichnet am natürlichsten die Urheber beziehungsweise Träger des Geschreis.
- source_word: βοή
  choice: Geschrei
  rationale: Im Zusammenhang von Tod und Trauer bezeichnet das Wort einen lauten, gequälten Aufschrei, nicht einen Kampfruf.
- source_word: οἰκτρά
  choice: jammervoll
  rationale: Das substantivisch beziehungsweise adverbial gebrauchte Neutrum Plural kennzeichnet das Verbreitete als erbarmungswürdig und kläglich; im Deutschen lässt sich dies natürlich auf „Klage“ beziehen.
- source_word: διεφέρετο
  choice: verbreitete sich weithin
  rationale: Die Imperfektform vermittelt, dass der Laut fortlaufend umhergetragen wurde beziehungsweise sich von Ort zu Ort ausbreitete.
- source_word: θρηνουμένων
  choice: Klage um
  rationale: Das passive Partizip bezieht sich auf die Kinder als Betrauerte. „Klage um“ gibt dieses Verhältnis idiomatisch wieder, ohne die Kinder selbst zu den Klagenden zu machen.
- source_word: παίδων
  choice: die Kinder
  rationale: παῖδες ist weiter als „Söhne“ oder „Erstgeborene“; die Übersetzung wahrt die Wortwahl des Verses, obwohl der Zusammenhang die Erstgeburt betrifft.
theological_decisions:
- issue: Ob παίδων aufgrund des Zusammenhangs als „erstgeborene Söhne“ präzisiert werden soll
  choice: Kinder
  alternative: erstgeborene Kinder / erstgeborene Söhne
  rationale: Der weitere Zusammenhang handelt vom Tod der Erstgeborenen, doch der Vers selbst gebraucht das allgemeinere παίδων. Die Übersetzung engt den Ausdruck daher nicht durch eine kontextuelle Ergänzung ein.
- issue: Ob θρηνουμένων die Kinder als Trauernde oder als Betrauerte bezeichnet
  choice: Klage um die Kinder
  alternative: Klage der trauernden Kinder
  rationale: Die Form ist grammatisch mehrdeutig denkbar, doch in Verbindung mit dem Passiv und dem Todeskontext ist die Deutung der Kinder als Betrauerte am naheliegendsten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Misstönend“ erhält das Klangbild von ἀσύμφωνος, während „Klage um die Kinder“ die griechische Konstruktion natürlich und ohne unnötige Präzisierung wiedergibt.
