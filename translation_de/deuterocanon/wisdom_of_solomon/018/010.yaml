  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Bedeutungen des Griechischen zuverlässig wieder: ἀντήχει als fortdauerndes Widerhallen, ἀσύμφωνος als akustisch misstönend, ἐχθρῶν als Genitiv der Urheber, sowie διεφέρετο als weithin erfolgendes Sichverbreiten. „Klage um die Kinder“ gibt θρηνουμένων παίδων im gegebenen Todes- und Trauerkontext sachgerecht wieder, ohne „Kinder“ unzulässig zu „Erstgeborenen“ einzuengen.'
