  text: bearing your sharp sword—your unfeigned command—and standing[a], he filled all things with death; and while he touched heaven[b], he had stepped upon the earth.
translation:
  language: de
  text: Ein scharfes Schwert, das deinen unverstellten Befehl[a] trug, erfüllte, als es seinen Stand eingenommen hatte, alles mit Tod; es berührte den Himmel, stand aber auf der Erde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „deinen ungeheuchelten Befehl“ oder „deine aufrichtige Anordnung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Bild stellt das Schwert als handelnde Gestalt von kosmischer Größe dar: Es berührt den Himmel und steht zugleich auf der Erde. So wird die allumfassende Reichweite des Gerichts hervorgehoben.'
    reason: cultural_note
lexical_decisions:
- source_word: ξίφος ὀξὺ … τὴν ἀνυπόκριτον ἐπιταγήν σου
  choice: deinen unverstellten Befehl wie ein scharfes Schwert
  rationale: Die beiden Akkusative setzen das scharfe Schwert und Gottes Befehl bildlich zueinander. Die Wiedergabe mit „wie“ macht dieses Verhältnis im Deutschen verständlich, ohne den Befehl in ein buchstäbliches Schwert umzudeuten.
- source_word: ἀνυπόκριτον
  choice: unverstellten
  rationale: Das Wort bezeichnet etwas Ungeheucheltes, Unverstelltes oder Aufrichtiges. „Unverstellt“ wahrt die ungewöhnliche Aussage über den göttlichen Befehl, statt sie deutend zu „unwiderruflich“ oder „unerbittlich“ umzuschreiben.
- source_word: ἐπιταγήν
  choice: Befehl
  rationale: ἐπιταγή bezeichnet eine verbindliche Anordnung oder einen autoritativen Befehl. „Befehl“ passt zur kriegerischen Bildsprache.
- source_word: φέρων
  choice: Er trug
  rationale: Das Partizip bezeichnet das Tragen des als Schwert vorgestellten Befehls. Ein finiter Satz klingt im modernen Deutschen natürlich und erhält die Gleichzeitigkeit im Zusammenhang.
- source_word: στὰς
  choice: dann trat er hin
  rationale: Der Aorist von ἵστημι zeichnet das Einnehmen eines Standorts beziehungsweise das Hintreten vor der folgenden Handlung nach. „Dann“ gibt die Abfolge idiomatisch wieder.
- source_word: ἐπλήρωσεν τὰ πάντα θανάτου
  choice: erfüllte alles mit Tod
  rationale: Die umfassende und drastische Formulierung des Griechischen bleibt erhalten; „alles“ legt nicht näher fest, ob die gesamte Schöpfung oder der ganze betroffene Bereich gemeint ist.
- source_word: οὐρανοῦ μὲν ἥπτετο
  choice: Während er den Himmel berührte
  rationale: ἅπτομαι bedeutet hier „berühren“; die Wiedergabe bewahrt das kosmische Bild ohne erklärenden Zusatz.
- source_word: βέβηκει δʼ ἐπὶ γῆς
  choice: stand er auf der Erde
  rationale: Die Form von βαίνω beschreibt das vollzogene Auftreten mit fortbestehendem Stand. Im Gegensatz zum Berühren des Himmels gibt „stand … auf der Erde“ den resultativen Sinn natürlich wieder.
theological_decisions:
- issue: Identität des handelnden, kriegerisch dargestellten Wesens
  choice: Das grammatisch männlich dargestellte Gegenüber wird nur mit „er“ bezeichnet und nicht näher identifiziert.
  alternative: Ausdrückliche Identifikation als Engel, Verderber oder personifiziertes göttliches Wort
  rationale: Der unmittelbare Zusammenhang personifiziert Gottes Wort beziehungsweise Befehl als kosmischen Krieger. Der Vers selbst legt jedoch keine ontologische Identität fest; die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die markante Wendung „unverstellter Befehl“ bewahrt bewusst die ungewöhnliche griechische Wortwahl; Satzbau und Verbformen sind für heutige Leser geglättet, ohne die kriegerische Personifikation oder das Himmel-Erde-Bild aufzulösen.
