  source_fidelity: 'Die Entwurfsfassung kehrt die griechische Bildführung um: ξίφος ὀξύ ist das (personifiziert handelnde) Subjekt, das den Befehl trägt; nicht der männliche Handelnde trägt den Befehl lediglich »wie ein Schwert«. Die revidierte Fassung bewahrt das Schwert als Subjekt und die absichtlich kosmische Personifikation. στὰς wird ohne nicht ausdrücklich markierte zeitliche Zuspitzung wiedergegeben; βέβηκει bleibt als resultierendes Stehen auf der Erde erkennbar.'
  naturalness: Die neue Formulierung ist modernes, würdiges Deutsch. Die Personifikation eines Schwertes bleibt bewusst markant, weil sie dem griechischen Bild entspricht. »Unverstellter Befehl« ist zwar gehoben, aber verständlich und gibt die ungewöhnliche Charakterisierung nicht interpretierend wieder.
  terminology: »Scharfes Schwert«, »Befehl«, »Tod«, »Himmel« und »Erde« entsprechen dem Grundtext. Es wird keine Identifikation des Bildträgers als Engel oder als eigenständige göttliche Person eingeführt.
