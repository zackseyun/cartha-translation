revisions:
- from: Er trug deinen unverstellten Befehl[a] wie ein scharfes Schwert; dann trat er hin und erfüllte alles mit Tod. Während er den Himmel berührte, stand er auf der Erde.[b]
  to: Ein scharfes Schwert, das deinen unverstellten Befehl[a] trug, erfüllte, als es seinen Stand eingenommen hatte, alles mit Tod; es berührte den Himmel, stand aber auf der Erde.[b]
  rationale: 'Die Revision stellt die griechische Syntax und Metapher wieder her: Das scharfe Schwert trägt den göttlichen Befehl und wird als Handelnder personifiziert. Damit bleibt zugleich offen, wie die Gestalt im weiteren Kontext zu identifizieren ist. Die Gegenüberstellung von Himmel und Erde sowie die drastische Aussage, dass alles mit Tod erfüllt wird, bleiben erhalten.'
