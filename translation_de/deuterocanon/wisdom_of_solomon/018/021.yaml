base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/021.yaml
  text: For a blameless man hurried forward and fought in the front line[a], bringing the weapon of his own service—prayer and atonement by incense; he stood against the wrath and put an end to the disaster[b], showing that he is your servant.
translation:
  language: de
  text: Denn ein untadeliger Mann eilte herbei und trat an vorderster Front in den Kampf. Als Waffe seines eigenen Dienstes brachte er Gebet und Sühne durch Räucherwerk[a] mit. Er stellte sich dem Zorn entgegen und setzte dem Unheil ein Ende. So zeigte er, dass er dein Diener[b] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebet und Entsühnung durch Räucherwerk“. Das griechische Wort kann in kultischem Zusammenhang verschiedene eng verwandte Arten sühnenden Handelns bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet einen Diener oder persönlichen Begleiter und kann einen ehrenvollen Dienst ausdrücken.
    reason: lexical_nuance
lexical_decisions:
- source_word: σπεύσας
  choice: eilte herbei
  rationale: Das Aoristpartizip bezeichnet rasches, entschlossenes Eingreifen; „eilte herbei“ ist natürlich und wahrt die Dringlichkeit.
- source_word: ἀνὴρ ἄμεμπτος
  choice: ein untadeliger Mann
  rationale: Die männliche Einzahl bleibt erhalten; „untadelig“ gibt die Bedeutung wieder, dass ihm kein Vorwurf gemacht werden kann.
- source_word: προεμάχησεν
  choice: trat an vorderster Front in den Kampf
  rationale: Die Formulierung bewahrt das militärische Bild des Kämpfens vor den anderen beziehungsweise in der vordersten Reihe.
- source_word: τὸ τῆς ἰδίας λειτουργίας ὅπλον
  choice: als Waffe seines eigenen Dienstes
  rationale: „Waffe“ erhält die militärische Metapher; „Dienst“ ist breit genug für den hier gemeinten priesterlich-kultischen Dienst, ohne ihn ausdrücklich in den Text einzutragen.
- source_word: προσευχὴν καὶ θυμιάματος ἐξιλασμόν
  choice: Gebet und Sühne durch Räucherwerk
  rationale: Die beiden Mittel bilden die genannte „Waffe“. „Sühne“ gibt den kultischen Gehalt von ἐξιλασμός verständlich wieder, während die Fußnote die mögliche Bedeutungsnuance offenhält.
- source_word: ἀντέστη τῷ θυμῷ
  choice: stellte sich dem Zorn entgegen
  rationale: Die Wendung bewahrt das kraftvolle Bild des Widerstands und lässt wie der griechische Text unausgesprochen, wessen Zorn gemeint ist.
- source_word: πέρας ἐπέθηκε τῇ συμφορᾷ
  choice: setzte dem Unheil ein Ende
  rationale: Dies ist eine natürliche deutsche Wiedergabe des Bildes, der Heimsuchung eine Grenze beziehungsweise ein Ende zu setzen.
- source_word: θεράπων
  choice: Diener
  rationale: „Diener“ ist im Deutschen natürlich und würdig; die Fußnote weist auf den ehrenvollen persönlichen Dienst hin, der θεράπων von bloßer Knechtschaft unterscheiden kann.
theological_decisions:
- issue: Bedeutung von ἐξιλασμός im kultischen Zusammenhang
  choice: Sühne
  alternative: Entsühnung; sühnende Wirkung
  rationale: „Sühne“ wahrt das kultische Gewicht, ohne genauer festzulegen, wie die Abwendung des Gerichts theologisch zu erklären ist.
- issue: Bezug von θυμός
  choice: dem Zorn
  alternative: dem Grimm; dem Zorn Gottes
  rationale: Der Zusammenhang legt göttlichen Zorn nahe, doch der griechische Wortlaut nennt Gott hier nicht ausdrücklich; deshalb wird „Gottes“ nicht ergänzt.
- issue: Nuance von θεράπων
  choice: Diener
  alternative: Bediensteter; Gefolgsmann
  rationale: Die Übersetzung soll den ehrenvollen Dienst ausdrücken, ohne eine besondere Amts- oder Standeslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze machen das rasche Eingreifen anschaulich. Das militärische Bild von Kampf und Waffe sowie die kultische Sprache von Dienst, Gebet, Räucherwerk und Sühne bleiben erhalten; implizite Bezüge werden nicht ausdrücklich ergänzt.
