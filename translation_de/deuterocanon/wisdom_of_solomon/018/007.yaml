lexical_decisions:
- source_word: προσεδέχθη
  choice: erwartete
  rationale: Das Verb προσδέχομαι bezeichnet hier am natürlichsten ein erwartungsvolles Warten. Die aktive deutsche Form vermeidet eine schwerfällige Passivkonstruktion, ohne den Sinn zu verändern.
- source_word: ὑπὸ λαοῦ σου
  choice: dein Volk
  rationale: λαός bezeichnet das Volk als Gemeinschaft; die direkte Anrede Gottes bleibt erhalten. In Verbindung mit dem ins Aktiv umgestellten Verb wird der griechische Urheber des Passivs zum deutschen Subjekt.
- source_word: σωτηρία
  choice: Rettung
  rationale: σωτηρία bezeichnet in diesem Zusammenhang die konkrete Bewahrung und Befreiung in der Nacht des Gerichts. „Rettung“ ist klar und bewahrt zugleich den theologischen Gehalt.
- source_word: δικαίων
  choice: der Gerechten
  rationale: Der substantivierte Genitiv Plural bezeichnet die moralisch beziehungsweise religiös als gerecht Geltenden und wird knapp und traditionsnah wiedergegeben.
- source_word: ἐχθρῶν
  choice: der Feinde
  rationale: Der unbestimmte Genitiv Plural wird formal als „der Feinde“ wiedergegeben. Ein Possessivpronomen wie „ihrer“ wäre im Zusammenhang verständlich, steht aber nicht ausdrücklich im Griechischen.
- source_word: ἀπωλία
  choice: Vernichtung
  rationale: ἀπωλία bezeichnet Untergang oder Zerstörung. „Vernichtung“ bildet einen deutlichen Gegenpol zur Rettung und passt zum Gerichtskontext.
- source_word: μὲν … δὲ
  choice: …, … aber ebenso
  rationale: Die korrelative Gegenüberstellung zweier erwarteter Ausgänge wird im Deutschen durch die Nachstellung „aber ebenso“ klar und natürlich ausgedrückt.
theological_decisions:
- issue: Die scharfe Verbindung von Rettung und Gericht
  choice: Das Volk erwartet sowohl die Rettung der Gerechten als auch die Vernichtung der Feinde.
  alternative: Die Aussage könnte abgeschwächt als Rettung der Gerechten im Gegensatz zum Untergang der Feinde formuliert werden.
  rationale: Die griechische Konstruktion μὲν … δὲ stellt beide Ausgänge ausdrücklich einander gegenüber. Die Übersetzung bewahrt diese Spannung, ohne die Vernichtung abzuschwächen oder zusätzliche Aussagen über ihre Ursache einzutragen.
- issue: Bezug von „Feinde“
  choice: „der Feinde“ ohne ergänztes Possessivpronomen
  alternative: „ihrer Feinde“
  rationale: Der Zusammenhang legt die Feinde des Volkes beziehungsweise der Gerechten nahe, doch der griechische Text nennt lediglich „Feinde“. Die offenere Formulierung vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aktive Satzform ist natürlicher als das wörtliche Passiv „wurde von deinem Volk erwartet“. Die knappe antithetische Struktur des Griechischen bleibt erhalten; ein im Ausgangstext nicht vorhandenes einleitendes „So“ wurde nicht ergänzt.
