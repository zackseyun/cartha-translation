base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/010.yaml
  text: But the ungodly will have punishment according to what they reasoned[b][a], having neglected the righteous man and having departed from the Lord.
translation:
  language: de
  text: Die Gottlosen aber werden eine Strafe erhalten, die dem entspricht, was sie erwogen haben;[a] sie, die den Gerechten[b] missachtet und sich vom Herrn abgewandt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „was sie gedacht haben“ oder „was sie geplant haben“. Das Griechische betont, dass ihre Strafe ihren eigenen Überlegungen und Absichten entspricht.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Auch: „den gerechten Mann“ oder „denjenigen, der gerecht ist“. Der griechische Ausdruck steht im Singular und bezeichnet im Zusammenhang wahrscheinlich die repräsentative Gestalt des Gerechten.'
    reason: alternative Wiedergabe
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: Bezeichnet Menschen, deren Verhalten sowohl von moralischer Verfehlung als auch von Missachtung Gottes geprägt ist; „Gottlose“ bewahrt beide Aspekte.
- source_word: καθʼ ἃ ἐλογίσαντο
  choice: die dem entspricht, was sie erwogen haben
  rationale: Gibt den Entsprechungsgedanken von κατά wieder und lässt bei λογίζομαι offen, ob Nachdenken, Absichten oder feindselige Pläne im Vordergrund stehen.
- source_word: ἕξουσιν ἐπιτιμίαν
  choice: werden eine Strafe erhalten
  rationale: ἐπιτιμία bezeichnet hier eine Strafe oder Sanktion. „Erhalten“ ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „haben“.
- source_word: ἀμελήσαντες τοῦ δικαίου
  choice: sie haben den Gerechten missachtet
  rationale: ἀμελέω bedeutet, sich nicht zu kümmern, etwas zu vernachlässigen oder zu missachten. Der substantivierte maskuline Singular τοῦ δικαίου wird als persönliche Gestalt wiedergegeben.
- source_word: τοῦ κυρίου ἀποστάντες
  choice: sich vom Herrn abgewandt
  rationale: ἀφίστημι bezeichnet hier das Sich-Entfernen oder Abwenden; „abgewandt“ ist verständlich und vermeidet den engeren Fachbegriff „abgefallen“ oder „apostasiert“.
theological_decisions:
- issue: Bezug von τοῦ δικαίου
  choice: der Gerechte als persönliche, repräsentative Einzelfigur
  alternative: die Gerechten als Kollektiv oder die Gerechtigkeit als abstrakter Begriff
  rationale: Artikel und maskuliner Singular sowie der Zusammenhang von Weisheit 2–5 sprechen für eine persönliche Einzelfigur. Die Übersetzung legt keine weitergehende christologische Identifizierung fest.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im jüdisch-griechischen Weisheitskontext bezeichnet κύριος Gott; „Herr“ bewahrt das theologische Gewicht und entspricht dem üblichen deutschen Bibelregister.
- issue: Verhältnis der Partizipien zum Hauptsatz
  choice: als anschließende Feststellung wiedergegeben
  alternative: ausdrücklich kausal mit „weil“ oder temporal mit „nachdem“
  rationale: Die griechischen Aoristpartizipien nennen die Handlungen der Gottlosen, ohne das logische Verhältnis mit einer Konjunktion vollständig festzulegen. Der Semikolonanschluss bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem Griechischen leicht geglättet; das Semikolon hält die Verbindung der Partizipien zum Hauptsatz bewusst offen. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
