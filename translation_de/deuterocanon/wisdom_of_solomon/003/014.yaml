  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/014.yaml
  text: And the eunuch who has not worked lawlessness with his hand, nor conceived evil things against the Lord, will be given the chosen grace of faith and a more delightful inheritance in the temple of the Lord.
translation:
  language: de
  text: Und der Eunuch, der mit seiner Hand kein Unrecht begangen und nichts Böses gegen den Herrn ersonnen hat, wird eine auserlesene Gabe des Glaubens[a] und einen angenehmeren Anteil[b] im Tempel des Herrn erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine auserlesene Gnade des Glaubens«, »eine auserlesene Gabe der Treue« oder »eine besonders kostbare Gunst des Vertrauens«. Der griechische Ausdruck ist knapp und lässt bei »Gabe/Gnade/Gunst« sowie bei »Glaube/Treue/Vertrauen« mehrere Nuancen zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einen erfreulicheren Anteil«, »einen begehrenswerteren Anteil« oder »ein angenehmeres Los« im Tempel des Herrn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχος
  choice: Eunuch
  rationale: Der konkrete griechische Ausdruck wird beibehalten; er bezeichnet hier nicht lediglich einen unverheirateten oder kinderlosen Mann.
- source_word: ὁ μὴ ἐργασάμενος ἐν χειρὶ ἀνόμημα
  choice: der mit seiner Hand kein Unrecht begangen hat
  rationale: „Begangen“ gibt ἐργάζομαι mit ἀνόμημα im Deutschen natürlich wieder; „mit seiner Hand“ bewahrt das konkrete Bild und den Singular des Griechischen.
- source_word: μηδὲ ἐνθυμηθεὶς κατὰ τοῦ κυρίου πονηρά
  choice: und nichts Böses gegen den Herrn ersonnen hat
  rationale: „Ersinnen“ erfasst die innere Erwägung oder Planung und stellt sie der äußeren Tat gegenüber; „gegen den Herrn“ wahrt die feindliche Ausrichtung.
- source_word: δοθήσεται
  choice: wird … erhalten
  rationale: Die deutsche Empfängerformulierung gibt den Sinn des Futur Passiv idiomatisch wieder, ohne den Geber ausdrücklich zu ergänzen.
- source_word: τῆς πίστεως χάρις ἐκλεκτὴ
  choice: eine auserlesene Gabe des Glaubens
  rationale: „Gabe“ ist hier für χάρις natürlich und hält zusammen mit „des Glaubens“ die kompakte Genitivverbindung offen; ἐκλεκτή wird als Qualitätsbezeichnung „auserlesen“ verstanden.
- source_word: κλῆρος
  choice: Erbteil
  rationale: Das Wort bezeichnet ein Los beziehungsweise einen zugeteilten Anteil; „Erbteil“ passt zum verheißenen Anteil, ohne die Vorstellung der Zuteilung ganz aufzugeben.
- source_word: ἐν ναῷ Κυρίου
  choice: im Tempel des Herrn
  rationale: Direkte und im Deutschen geläufige Wiedergabe von ναός und κύριος.
- source_word: θυμηρέστερος
  choice: erfreulicher
  rationale: Der Komparativ bezeichnet einen angenehmeren, erfreulicheren oder begehrenswerteren Anteil; die Vergleichsform bleibt ausdrücklich erhalten.
theological_decisions:
- issue: Bedeutung von πίστις in τῆς πίστεως χάρις ἐκλεκτή
  choice: Glaube
  alternative: Treue oder Vertrauen
  rationale: „Glaube“ ist die naheliegende Grundwiedergabe; der knappe griechische Ausdruck lässt jedoch auch „Treue“ oder „Vertrauen“ zu, weshalb die Mehrdeutigkeit in der Fußnote genannt wird.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist in diesem Kontext die übliche und angemessene Gottesbezeichnung, ohne eine im griechischen Text nicht sichtbare Schreibkonvention einzuführen.
- issue: Sinn von χάρις
  choice: Gabe
  alternative: Gnade oder Gunst
  rationale: χάρις kann Gabe, Gnade oder Gunst bezeichnen. „Gabe“ fügt sich syntaktisch und semantisch gut ein, während die Alternativen in der Fußnote bewahrt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der konkrete Ausdruck „Eunuch“ und das Körperbild „mit seiner Hand“ bleiben erhalten. Ungewöhnliche, aber bedeutungstragende Elemente des Griechischen werden nicht eingeebnet; die besonders dichte Wortgruppe zu χάρις und πίστις sowie die Bedeutungsbreite von κλῆρος werden durch Fußnoten offengehalten.
