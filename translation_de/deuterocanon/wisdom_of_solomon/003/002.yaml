lexical_decisions:
- source_word: ἔδοξαν
  choice: schienen
  rationale: Das Verb bezeichnet hier den Eindruck aus der Sicht der Beobachtenden und stellt keine objektive Feststellung dar.
- source_word: ἐν ὀφθαλμοῖς ἀφρόνων
  choice: in den Augen der Unverständigen
  rationale: Die feste Wendung ἐν ὀφθαλμοῖς wird idiomatisch mit „in den Augen“ wiedergegeben. „Unverständige“ bewahrt den wertenden Sinn von ἄφρον, ohne unnötig umgangssprachlich zu wirken.
- source_word: τεθνάναι
  choice: gestorben zu sein
  rationale: Der Perfektinfinitiv bezeichnet den aus dem Sterben hervorgegangenen Zustand; nach „schienen“ ist „gestorben zu sein“ die natürliche deutsche Form.
- source_word: ἐλογίσθη
  choice: wurde beurteilt
  rationale: Das Passiv bezeichnet eine wertende Einschätzung. Da im vorgelegten griechischen Wortlaut das zugehörige Prädikativ fehlt, darf die Art der Beurteilung nicht stillschweigend ergänzt werden.
- source_word: ἡ ἔξοδος αὐτῶν
  choice: ihr Fortgang
  rationale: „Fortgang“ erhält das Bild des Hinausgehens beziehungsweise Scheidens und legt ἔξοδος nicht vorschnell ausschließlich als „Tod“ aus.
theological_decisions:
- issue: Bildhafte Bezeichnung des Todes durch ἔξοδος
  choice: ihr Fortgang
  alternative: ihr Tod
  rationale: Die bildhafte Offenheit des griechischen Ausdrucks bleibt erhalten; der Zusammenhang darf die Bedeutung entfalten, ohne dass die Übersetzung sie auf „Tod“ verengt.
- issue: Im vorgelegten Ausgangstext fehlendes Prädikativ zu ἐλογίσθη
  choice: keine inhaltliche Ergänzung im Haupttext
  alternative: „wurde als Unglück angesehen“ nach der englischen Konsultationsfassung
  rationale: Der bereitgestellte griechische Text endet nach αὐτῶν und enthält weder κακοῦ noch ein anderes Wort für „Unglück“. Die Übersetzung folgt deshalb der tatsächlich vorgelegten Originalsprachengrundlage und kennzeichnet deren unvollständige Syntax.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich offene Satzform ist nicht stilistisch beabsichtigt, sondern folgt dem unvollständig überlieferten beziehungsweise bereitgestellten griechischen Segment; eine nicht belegte Ergänzung wurde vermieden.
