translation:
  language: de
  text: und ihr Weggang von uns galt als Untergang, doch sie sind in Frieden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In Frieden“ kann außer dem Fehlen von Streit auch Ruhe, Heil und Wohlergehen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεία
  choice: Weggang
  rationale: Im Zusammenhang mit dem Tod der Gerechten bezeichnet das Wort ihr Fortgehen von den Lebenden. „Weggang“ bewahrt das Bild des Gehens, ohne ausdrücklich „Tod“ einzusetzen.
- source_word: ἀφʼ ἡμῶν
  choice: von uns
  rationale: Die räumlich-relationale Formulierung wird direkt wiedergegeben und bezeichnet die Perspektive der Zurückbleibenden.
- source_word: σύντριμμα
  choice: Untergang
  rationale: Das Wort kann Zerschmetterung, Verderben oder Ruin bezeichnen. „Untergang“ drückt die vermeintliche Katastrophe aus, ohne zwingend Vernichtung im metaphysischen Sinn zu behaupten.
- source_word: οἱ δὲ
  choice: doch sie
  rationale: „Doch“ gibt den scharfen Gegensatz zwischen menschlicher Einschätzung und dem tatsächlichen Zustand der Gerechten knapp und natürlich wieder.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: 'Die nahe Wiedergabe bewahrt die Bedeutungsweite des Griechischen: Frieden kann neben Konfliktlosigkeit auch Ruhe, Heil und Wohlergehen umfassen.'
theological_decisions:
- issue: Kennzeichnung der Aussage über den Untergang als menschliche Einschätzung
  choice: galt als Untergang
  alternative: war Untergang; schien eine Katastrophe zu sein
  rationale: Im Satzzusammenhang wird die Sicht der Unverständigen dem wahren Zustand der Gerechten gegenübergestellt. Das im Deutschen ergänzte „galt als“ trägt diese bereits etablierte Perspektive weiter, ohne den vermeintlichen Untergang als Tatsache auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Weggang“ hält die Todesmetapher offen; „galt als Untergang“ klingt natürlich und wahrt den Gegensatz zwischen menschlichem Urteil und Wirklichkeit.
