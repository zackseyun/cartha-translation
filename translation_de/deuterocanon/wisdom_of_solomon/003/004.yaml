base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/004.yaml
  text: For even if they are punished in the sight of men[a], their hope is full of immortality.
translation:
  language: de
  text: Denn selbst wenn sie in den Augen der Menschen bestraft werden[a], ist ihre Hoffnung ganz von Unsterblichkeit erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gezüchtigt werden« beziehungsweise »zurechtgewiesen werden«. Das griechische Wort kann strafendes oder erzieherisch-korrigierendes Leiden bezeichnen; »in den Augen der Menschen« hebt den menschlichen Anschein gegenüber der letztgültigen Wirklichkeit hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὄψει ἀνθρώπων
  choice: in den Augen der Menschen
  rationale: Die Wendung bezeichnet die menschliche Wahrnehmung und bewahrt den Gegensatz zwischen äußerem Anschein und tieferer Wirklichkeit.
- source_word: ἐὰν κολασθῶσιν
  choice: selbst wenn sie … bestraft werden
  rationale: κολάζω kann sowohl Strafe als auch Züchtigung beziehungsweise erzieherische Maßregelung bezeichnen. „Bestraft werden“ erhält die stärkere Bedeutung, ohne durch den unmittelbaren Hinweis auf die menschliche Sicht ein göttliches Schuldurteil festzuschreiben.
- source_word: ἡ ἐλπὶς αὐτῶν
  choice: ihre Hoffnung
  rationale: Natürliche und genaue Wiedergabe der griechischen Possessivkonstruktion.
- source_word: ἀθανασίας
  choice: von Unsterblichkeit
  rationale: Der Genitiv bezeichnet hier Inhalt oder Beschaffenheit der Hoffnung; „Unsterblichkeit“ ist die klare Standardwiedergabe von ἀθανασία.
- source_word: πλήρης
  choice: ist … ganz … erfüllt
  rationale: Das im Griechischen unausgesprochene Bindeverb wird ergänzt. Die Formulierung gibt prädikativ wieder, dass die Hoffnung vollständig von Unsterblichkeit erfüllt ist.
theological_decisions:
- issue: Bedeutung des Leidens der Gerechten
  choice: „bestraft werden“, eingerahmt durch „in den Augen der Menschen“
  alternative: „gezüchtigt werden“ oder „zurechtgewiesen werden“
  rationale: Der Text hält die Spannung zwischen dem menschlichen Anschein von Strafe und der wirklichen Hoffnung der Gerechten aufrecht. Die Übersetzung darf weder den Strafcharakter abschwächen noch daraus stillschweigend ein göttliches Verdammungsurteil machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In den Augen der Menschen“ ist idiomatisch und erhält ausdrücklich die Perspektive menschlicher Wahrnehmung. „Ganz von Unsterblichkeit erfüllt“ klingt natürlicher als eine wörtliche Nominalfügung und bewahrt zugleich die ungewöhnlich starke Aussage des griechischen πλήρης.
