  source_fidelity: 'Die Übersetzung gibt alle Bestandteile des griechischen Satzes sachgerecht wieder: καὶ γάρ durch „Denn selbst“, die Perspektivformel ἐν ὄψει ἀνθρώπων durch „in den Augen der Menschen“, den Konditionalsatz ἐὰν κολασθῶσιν durch „wenn sie … bestraft werden“ sowie πλήρης ἀθανασίας als von Unsterblichkeit erfüllte Hoffnung. Die Deutung der Bestrafung wird nicht über den durch die menschliche Sicht markierten Rahmen hinaus dogmatisch festgelegt.'
