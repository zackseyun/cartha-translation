base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/007.yaml
  text: and at the time of their visitation they will shine forth[a], and they will run about like sparks through stubble[b];
translation:
  language: de
  text: Und zur Zeit ihrer Heimsuchung werden sie aufleuchten[a] und wie Funken durch dürres Stroh[b] dahinjagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn sie heimgesucht werden“ – das heißt, wenn Gott eingreift, um zu prüfen, zu richten oder ihnen Recht zu verschaffen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie Funken durch Stoppeln“ beziehungsweise „durch Schilf“; das griechische Bild zeigt Feuer, das rasch durch trockenes, leicht brennbares Pflanzenmaterial läuft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: Zeit
  rationale: καιρός bezeichnet hier den entscheidenden beziehungsweise bestimmten Zeitpunkt; „Zeit“ ist natürlich und lässt die genaue Nuance offen.
- source_word: ἐπισκοπῆς
  choice: Heimsuchung
  rationale: ἐπισκοπή kann ein göttliches Aufsuchen, Prüfen, Richten oder Rechtverschaffen bezeichnen. „Heimsuchung“ bewahrt diese theologische Breite, auch wenn das Wort im heutigen Deutsch erklärungsbedürftig ist.
- source_word: ἀναλάμψουσιν
  choice: werden sie aufleuchten
  rationale: Das Verb bezeichnet ein helles Hervorleuchten oder Aufflammen; „aufleuchten“ gibt Bild und Präfixwirkung prägnant wieder.
- source_word: σπινθῆρες
  choice: Funken
  rationale: „Funken“ ist die direkte und im Deutschen anschauliche Entsprechung.
- source_word: καλάμῃ
  choice: dürres Stroh
  rationale: καλάμη kann Halme, Stoppeln oder trockenes, schilfartiges Pflanzenmaterial bezeichnen. Im Feuerbild macht „dürres Stroh“ die leichte Brennbarkeit natürlich verständlich, ohne die Bildaussage zu verändern.
- source_word: διαδραμοῦνται
  choice: dahinjagen
  rationale: Das Verb beschreibt schnelle Bewegung durch beziehungsweise über einen Bereich. „dahinjagen“ bildet das rasche Ausbreiten der Funken idiomatisch ab.
theological_decisions:
- issue: Bedeutung der „Zeit ihrer Heimsuchung“
  choice: Ein Zeitpunkt göttlichen Eingreifens hinsichtlich der Gerechten, im Haupttext bewusst nicht näher festgelegt
  alternative: Der Zeitpunkt ihrer Prüfung, ihres Gerichts oder ihrer Rechtfertigung durch Gott
  rationale: Der Kontext legt die Rechtfertigung der Gerechten nahe, doch ἐπισκοπή selbst umfasst Aufsuchen, Prüfung, Gericht und gnädiges Eingreifen. Die Übersetzung soll diese Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heimsuchung“ ist bewusst als traditionsnaher, semantisch weiter Ausdruck gewählt und wird in der Fußnote erklärt. „Dahinjagen“ vermittelt die Dynamik des griechischen Verbs natürlicher als das wörtlichere „umherlaufen“.
