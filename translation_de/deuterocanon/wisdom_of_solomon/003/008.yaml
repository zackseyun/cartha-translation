  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/008.yaml
  text: They will judge nations and rule over peoples[c][b][a], and the Lord will reign over them forever.
translation:
  language: de
  text: Sie werden Nationen richten und über Völker herrschen[a], und der Herr wird über sie[b] in Ewigkeit[c] als König herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über Völker Macht ausüben“ beziehungsweise „Völker überwältigen“; das griechische Verb kann Herrschaft, Machtausübung oder Überlegenheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Pronomen „sie“ bezieht sich im Zusammenhang wahrscheinlich auf die Gerechten; möglich ist auch ein weiterer Bezug auf die eben genannten Nationen und Völker.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: „für die Zeitalter“ oder „für alle Zeiten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινοῦσιν
  choice: werden … richten
  rationale: Das Futur von κρίνω bezeichnet hier zunächst das Richten; ein weiter gefasster Sinn des Regierens klingt im weisheitlich-apokalyptischen Zusammenhang mit an, wird aber nicht an die Stelle des Grundsinns gesetzt.
- source_word: ἔθνη
  choice: Nationen
  rationale: „Nationen“ gibt ἔθνη wieder und hält es vom folgenden λαῶν („Völker“) unterscheidbar; „Heiden“ würde einen hier nicht ausdrücklich markierten religiösen Gegensatz eintragen.
- source_word: κρατήσουσι
  choice: werden … herrschen
  rationale: κρατέω mit dem Genitiv kann Machtausübung oder Herrschaft bezeichnen. „Herrschen über“ passt zum Parallelismus mit dem Richten der Nationen, ohne die mögliche Nuance des Überwältigens völlig auszuschließen.
- source_word: λαῶν
  choice: Völker
  rationale: „Völker“ ist eine natürliche Wiedergabe von λαοί und wahrt zusammen mit „Nationen“ die lexikalische Unterscheidung der beiden griechischen Ausdrücke.
- source_word: βασιλεύσει
  choice: wird … als König herrschen
  rationale: Die Formulierung bewahrt ausdrücklich den königlichen Sinn von βασιλεύω und ist zugleich in modernem Deutsch verständlich.
- source_word: αὐτῶν
  choice: über sie
  rationale: Der Genitiv bei βασιλεύω bezeichnet diejenigen, über die der Herr herrscht. Das Pronomen bleibt bewusst erhalten, damit sein Bezug nicht im Haupttext festgelegt wird.
- source_word: Κύριος
  choice: der Herr
  rationale: „Der Herr“ ist die übliche, würdige Wiedergabe des göttlichen Titels Κύριος.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die Wendung bezeichnet unabsehbare, fortdauernde Dauer. „In Ewigkeit“ ist im Deutschen idiomatisch und bewahrt zugleich den feierlichen Ton.
theological_decisions:
- issue: Bezug von αὐτῶν („über sie“)
  choice: Das Pronomen bleibt unaufgelöst; im Zusammenhang liegt als Bezug besonders die zuvor beschriebenen Gerechten nahe.
  alternative: Es kann auch weiter auf die unmittelbar genannten Nationen und Völker bezogen werden.
  rationale: Die griechische Pronomenform legt den Bezug grammatisch nicht abschließend fest. Eine ausdrückliche Ersetzung durch „die Gerechten“ oder „die Völker“ würde die echte Mehrdeutigkeit und die damit verbundene theologische Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus „Nationen … Völker“ bleibt sichtbar; „als König herrschen“ bewahrt gegenüber dem vorherigen „herrschen“ den besonderen königlichen Gehalt von βασιλεύω. Sämtliche sachlich relevanten Mehrdeutigkeiten werden in den Fußnoten offengehalten.
