  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/005.yaml
  text: And after being disciplined a little[a], they will receive great good[c][b], because God tested them and found them worthy of himself.
translation:
  language: de
  text: Nachdem sie ein wenig[a] gezüchtigt worden sind, werden sie reichlich Gutes erfahren[b]; denn Gott hat sie geprüft und sie seiner würdig befunden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine kurze Zeit«. Das griechische Wort kann sowohl ein geringes Maß als auch eine kurze Dauer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »wird ihnen in großem Maß Gutes erwiesen werden« oder: »werden sie großen Nutzen empfangen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »für ihn würdig befunden«. Die Formulierung betont, dass ihre Würdigkeit auf Gott selbst bezogen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: ein wenig
  rationale: Die adverbial gebrauchte Neutrum-Pluralform kann ein begrenztes Maß oder eine begrenzte Dauer bezeichnen. »Ein wenig« wahrt diese Offenheit und den Gegensatz zu μεγάλα.
- source_word: παιδευθέντες
  choice: zurechtgewiesen worden sind
  rationale: Das Partizip kann Erziehung, Schulung und korrigierende Zucht ausdrücken. »Zurechtgewiesen« vermittelt den korrigierenden und formenden Sinn, ohne die Bedeutung auf bloße Bestrafung zu verengen.
- source_word: μεγάλα εὐεργετηθήσονται
  choice: werden sie große Wohltaten erfahren
  rationale: Die Wendung bezeichnet große, ihnen erwiesene Wohltaten. Die deutsche Formulierung ist natürlich und bewahrt, dass ihnen Gutes zuteilwird.
- source_word: ἐπείρασεν
  choice: hat sie geprüft
  rationale: Hier geht es um eine Erprobung ihres Charakters, nicht um Verführung zum Bösen. »Geprüft« gibt diesen Sinn klar wieder.
- source_word: ἀξίους ἑαυτοῦ
  choice: sie seiner selbst für würdig befunden
  rationale: Die relativ formale Wiedergabe wahrt den reflexiven Genitiv und seine Gottbezogenheit, ohne ihn deutend auf Zugehörigkeit oder einen bestimmten Zweck festzulegen.
theological_decisions:
- issue: Göttliche Prüfung im Zusammenhang mit Leiden
  choice: Gott hat sie geprüft
  alternative: Gott hat sie erprobt
  rationale: Die Übersetzung lässt die Spannung bestehen, dass Gott durch die vorausgehende Zurechtweisung beziehungsweise Bedrängnis prüft, ohne daraus ausdrücklich Bestrafung, Verführung oder eine ausgearbeitete Lehre der Heiligung zu machen.
- issue: Bezug der Würdigkeit auf Gott
  choice: seiner selbst für würdig
  alternative: für sich würdig
  rationale: Die gewählte Fassung bleibt nahe am griechischen Genitiv und hält offen, ob vor allem Würdigkeit in Beziehung zu Gott oder Eignung für Gott betont wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang; der Kontrast zwischen »ein wenig« und »große« bleibt erhalten. »Wohltaten erfahren« vermeidet das steife »großen Nutzen empfangen«, während die Fußnote den passiven Charakter des griechischen Verbs sichtbar macht.
