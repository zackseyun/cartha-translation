base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/011.yaml
  text: For miserable is the one who despises wisdom and instruction[a], and their hope is empty, their labors are unprofitable, and their works are useless.
translation:
  language: de
  text: Denn elend ist, wer Weisheit und Unterweisung[a] verachtet. Die Hoffnung solcher Menschen ist leer, ihre Mühen sind sinnlos und ihre Werke nutzlos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Erziehung“ beziehungsweise „Schulung“; das griechische Wort παιδεία kann sowohl Bildung als auch zurechtweisende Erziehung umfassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφίαν
  choice: Weisheit
  rationale: Die übliche Bedeutung in der Weisheitsliteratur; gemeint ist Weisheit als sittiges und geistiges Gut, nicht bloß praktische Geschicklichkeit.
- source_word: παιδείαν
  choice: Unterweisung
  rationale: Der Begriff umfasst Bildung, Erziehung und auch zurechtweisende Schulung. „Unterweisung“ passt natürlich zu „Weisheit“, ohne den Sinn auf Strafe zu verengen.
- source_word: ὁ ἐξουδενῶν
  choice: wer … verachtet
  rationale: Das Partizip bezeichnet aktives Geringschätzen oder Behandeln als bedeutungslos; „verachtet“ bewahrt diese deutliche Ablehnung.
- source_word: ταλαίπωρος
  choice: elend
  rationale: Das Wort beschreibt einen beklagenswerten, unglücklichen Zustand. „Elend“ ist knapp, kräftig und in modernem Deutsch verständlich.
- source_word: κενὴ ἡ ἐλπὶς αὐτῶν
  choice: Die Hoffnung solcher Menschen ist leer
  rationale: „Leer“ gibt κενή unmittelbar wieder. „Solcher Menschen“ stellt den griechischen Wechsel vom repräsentativen Singular zum Plural im Deutschen verständlich dar.
- source_word: οἱ κόποι ἀνόητοι
  choice: ihre Mühen sind sinnlos
  rationale: κόποι bezeichnet mühevolle Arbeit; ἀνόητοι bedeutet ohne Einsicht oder Verstand. „Sinnlos“ gibt das Urteil prägnant wieder und ist näher am Griechischen als „ertraglos“.
- source_word: ἄχρηστα τὰ ἔργα αὐτῶν
  choice: ihre Werke nutzlos
  rationale: ἄχρηστα bezeichnet etwas Unbrauchbares oder Nutzloses; „Werke“ bewahrt die übliche Entsprechung für ἔργα.
theological_decisions:
- issue: Wechsel vom singularischen „wer verachtet“ zu den pluralischen Possessivformen αὐτῶν
  choice: Den repräsentativen Singular zunächst bewahren und den anschließenden Plural mit „solcher Menschen“ ausdrücklich aufnehmen.
  alternative: 'Den gesamten Vers pluralisieren: „Elend sind alle, die …; ihre Hoffnung …“'
  rationale: Das Griechische wechselt selbst vom Singular zum Plural und behandelt den Einzelnen offenbar als Vertreter einer Gruppe. Die gewählte Form erhält diesen Wechsel, ohne im Deutschen einen unklaren Bezug von „ihre“ zu erzeugen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz folgt der pointierten griechischen Aussage; der zweite macht den Wechsel zum Plural idiomatisch verständlich. Die unterschiedlichen Urteile „leer“, „sinnlos“ und „nutzlos“ bleiben bewusst erhalten.
