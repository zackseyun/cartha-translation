review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt γενεᾶς ἀδίκου als kollektive, möglicherweise genealogisch gefärbte Bezeichnung grundsätzlich zutreffend wieder und bewahrt den Plural von τὰ τέλη. „Ausgänge“ ist jedoch im heutigen Deutsch überwiegend für räumliche Ausgänge gebräuchlich und verdeckt den hier gemeinten Sinn endgültiger Folgen bzw. Geschicke.
  naturalness: „Denn schwer sind die Folgen eines ungerechten Geschlechts“ ist knapp, würdevoll und modernes Standarddeutsch. Es gibt χαλεπά angemessen wieder, ohne die Aussage zu verstärken, und vermittelt τὰ τέλη idiomatisch im Plural.
  terminology: „Ungerechtes Geschlecht“ kann die von γενεά umfasste Gruppe ebenso wie deren Abstammungsbezug bezeichnen. Die Fußnote sollte die Alternativen als Varianten des Bezugs von γενεά erklären, nicht mit „eines Ungerechten“ einen einzelnen ungerechten Vorfahren einführen, der im Griechischen nicht ausdrücklich steht.
  issues:
  - severity: medium
    issue: „Ausgänge“ für τὰ τέλη
    rationale: Im modernen Standarddeutsch bezeichnet „Ausgänge“ normalerweise Türen oder Wege nach draußen. Für die schweren Endfolgen bzw. Geschicke einer Gruppe ist es unidiomatisch und missverständlich.
  - severity: low
    issue: Fußnotenalternative „der Nachkommen eines Ungerechten“
    rationale: Diese Formulierung kann einen einzelnen ungerechten Menschen als Elternteil nahelegen. Der griechische Ausdruck charakterisiert vielmehr γενεά kollektiv als ἀδίκου; eine Alternative mit „ungerechter Abstammungslinie“ wahrt diese Offenheit besser.
