revisions:
- from: Denn schlimm sind die Ausgänge eines ungerechten Geschlechts.[a]
  to: Denn schwer sind die Folgen eines ungerechten Geschlechts.[a]
  rationale: Die Änderung ersetzt das heute missverständliche „Ausgänge“ durch „Folgen“, das den pluralischen Sinn von τὰ τέλη als endgültige Ergebnisse natürlich ausdrückt. Die Fußnote bewahrt die bei γενεά bestehende Spannung zwischen Generation, Linie und Nachkommenschaft, ohne eine nicht ausdrücklich genannte Einzelperson oder eine Lehre von ererbter Schuld einzutragen.
