  text: For the ends of an unrighteous generation are grievous[a].
translation:
  language: de
  text: Denn schwer sind die Folgen eines ungerechten Geschlechts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einer ungerechten Generation« oder »einer ungerechten Abstammungslinie«. Das griechische Wort kann eine Generation, eine Abstammungslinie oder eine Gruppe von Nachkommen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: γενεᾶς
  choice: Geschlechts
  rationale: γενεά kann Generation, Nachkommenschaft oder Abstammungslinie bezeichnen. Im Zusammenhang mit Nachkommen bewahrt „Geschlecht“ den kollektiven und möglichen genealogischen Sinn, ohne ihn eindeutig biologisch festzulegen.
- source_word: ἀδίκου
  choice: ungerechten
  rationale: ἄδικος bezeichnet hier moralische Ungerechtigkeit bzw. Gottlosigkeit. „Ungerecht“ entspricht dem Grundsinn und vermeidet die stärkere Wertung von „böse“.
- source_word: χαλεπὰ
  choice: schlimm
  rationale: χαλεπός kann schwer, hart, schmerzlich oder schlimm bedeuten. „Schlimm“ ist in modernem Deutsch natürlich und gibt den ernsten, unheilvollen Charakter wieder.
- source_word: τὰ τέλη
  choice: die Ausgänge
  rationale: Der Plural τέλη bezeichnet die Enden, Ausgänge oder endgültigen Folgen. „Ausgänge“ erhält den griechischen Plural und lässt sowohl Schicksal als auch Ergebnis anklingen.
theological_decisions:
- issue: Ob γενεᾶς ἀδίκου eher als moralisch bestimmte Generation oder als Nachkommenschaft beziehungsweise Abstammungslinie zu verstehen ist.
  choice: eines ungerechten Geschlechts
  alternative: einer ungerechten Generation; der Nachkommen eines Ungerechten
  rationale: „Geschlecht“ wahrt die im Griechischen angelegte Spannung zwischen einer Personengruppe und einer Abstammungslinie. Die Fußnote nennt klarere Alternativen, ohne eine erbliche Schuldlehre in den Text einzutragen.
translation_notes:
  register: Knappes, würdevolles modernes Standarddeutsch. Die markante Pluralform „Ausgänge“ wurde trotz ihrer leichten Ungewöhnlichkeit beibehalten, um τὰ τέλη nicht zum Singular zu glätten.
