translation:
  language: de
  text: Doch die Kinder von Ehebrechern werden unvollendet bleiben[a], und die Nachkommenschaft aus einer gesetzwidrigen Verbindung[b] wird verschwinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Vollendung bleiben“, „nicht zur Vollendung gelangen“. Das griechische Wort bezeichnet einen Mangel an Vollendung, ohne näher zu bestimmen, worin dieser besteht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Same aus einem gesetzwidrigen Bett“. „Bett“ steht im Griechischen bildlich für eine geschlechtliche Verbindung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Kinder
  rationale: Die gewöhnliche Bezeichnung für Kinder beziehungsweise Nachkommen; sie bewahrt den familiären Sinn und engt nicht auf männliche Nachkommen ein.
- source_word: μοιχῶν
  choice: von Ehebrechern
  rationale: Der Genitiv Plural bezeichnet Menschen, die Ehebruch begehen. Die Wiedergabe ist knapp und erhält die moralische Bestimmtheit des griechischen Ausdrucks.
- source_word: ἀτέλεστα
  choice: unvollendet
  rationale: Das Adjektiv bezeichnet etwas, das nicht zur Vollendung oder vollen Ausprägung gelangt ist. „Unvollendet“ bewahrt diese Offenheit, ohne die Art des Mangels näher festzulegen.
- source_word: ἔσται
  choice: werden … bleiben
  rationale: Die deutsche Fügung gibt das zukünftige Sein idiomatisch wieder und verbindet sich natürlich mit „unvollendet“.
- source_word: ἐκ παρανόμου κοίτης
  choice: aus einer gesetzwidrigen Verbindung
  rationale: ἐκ bezeichnet die Herkunft, παράνομος das dem Gesetz Zuwiderlaufende und κοίτη wörtlich das Bett als Bild für geschlechtliche Vereinigung. „Verbindung“ macht die Metonymie im Deutschen verständlich, während „gesetzwidrig“ die rechtlich-moralische Aussage erhält.
- source_word: σπέρμα
  choice: Nachkommenschaft
  rationale: Wörtlich „Same“, bezeichnet σπέρμα hier kollektiv die aus der Verbindung hervorgehenden Nachkommen.
- source_word: ἀφανισθήσεται
  choice: wird verschwinden
  rationale: Das Futur Passiv bezeichnet das Verschwinden beziehungsweise Zunichtewerden. „Wird verschwinden“ erhält den Bildgehalt, ohne die Aussage unnötig zu verschärfen.
theological_decisions:
- issue: Gerichtsaussage über Kinder aus ehebrecherischen beziehungsweise gesetzwidrigen Verbindungen
  choice: Die harte weisheitliche Aussage wird ohne Abschwächung beibehalten.
  alternative: Die Aussage lediglich als Hinweis auf gesellschaftliche Benachteiligung oder Stigmatisierung deuten.
  rationale: Der griechische Text formuliert ein ernstes Urteil und verbindet es ausdrücklich mit Ehebruch und gesetzwidriger Vereinigung. Die Übersetzung bewahrt diese Spannung, legt jedoch keine bestimmte Lehre von ererbter Schuld in den Text hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unvollendet“ bewahrt die Mehrdeutigkeit des griechischen Ausdrucks; „gesetzwidrige Verbindung“ vermittelt die rechtlich-moralische Aussage und löst zugleich die im Deutschen missverständliche wörtliche Metapher vom „Bett“ auf.
