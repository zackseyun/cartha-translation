translation:
  language: de
  text: Ihre Frauen[a] sind töricht, und ihre Kinder sind böse; ihre Nachkommenschaft ist verflucht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihre Ehefrauen«. Das griechische Wort kann sowohl Frauen als auch Ehefrauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihre Abstammung« beziehungsweise »ihr Geschlecht« im Sinn von Abstammungslinie. Das griechische Wort kann die Nachkommen oder die Abstammungslinie bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: Frauen
  rationale: γυνή kann sowohl »Frau« als auch »Ehefrau« bedeuten. »Ihre Frauen« wahrt die knappe Formulierung und lässt im Deutschen, wenn auch mit einer Tendenz zu »Ehefrauen«, beide Bezüge erkennen; die Alternative wird in einer Fußnote ausdrücklich genannt.
- source_word: ἄφρονες
  choice: töricht
  rationale: ἄφρων bezeichnet fehlende Einsicht oder Vernunft. »Töricht« gibt den zugleich verstandesbezogenen und moralischen Ton knapp und würdig wieder.
- source_word: πονηρὰ
  choice: böse
  rationale: πονηρός trägt hier im Rahmen eines scharfen Urteils moralische Bedeutung. »Böse« bewahrt diese Wertung, statt sie zu bloßem »schlecht« abzuschwächen.
- source_word: τέκνα
  choice: Kinder
  rationale: τέκνα bedeutet hier natürlich »Kinder«. Die Wiedergabe unterscheidet den Ausdruck von der anschließenden, umfassenderen γένεσις.
- source_word: ἐπικατάρατος
  choice: verflucht
  rationale: Das Adjektiv bezeichnet, dass jemand oder etwas unter einem Fluch steht. »Verflucht« ist im modernen Deutsch verständlich und bewahrt den feierlich-harten Urteilston.
- source_word: γένεσις
  choice: Nachkommenschaft
  rationale: γένεσις kann hier das Hervorgebrachte, die Nachkommen oder die Abstammungslinie bezeichnen. »Nachkommenschaft« passt zum familiären Zusammenhang und ist weiter gefasst als »Kinder«.
theological_decisions:
- issue: Bezug und Schärfe des Gerichts über die Familie
  choice: Der Vers wird als unmittelbares, hartes Urteil über die Frauen, Kinder und Nachkommenschaft der Gemeinten wiedergegeben, ohne die Aussagen abzuschwächen.
  alternative: Die Aussagen könnten als allgemeine Beschreibung von Unglück statt als moralisches und fluchbezogenes Urteil paraphrasiert werden.
  rationale: Die griechischen Prädikatsadjektive ἄφρονες, πονηρά und ἐπικατάρατος sind ausdrücklich wertend. Der Text bietet keinen sprachlichen Grund, diese Spannung durch eine mildere Deutung aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem und bewusst knappem Urteilston. Die parallele Satzstruktur des Griechischen bleibt erhalten; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten offengelegt.
