translation:
  language: de
  text: Denn die Frucht guter Mühen ist ruhmreich, und die Wurzel der Einsicht[a] versagt nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Klugheit“; auch „Besonnenheit“.'
    reason: Lexikalische Alternative für φρόνησις, das praktische Einsicht und vernünftige Umsicht bezeichnen kann.
lexical_decisions:
- source_word: ἀγαθῶν πόνων
  choice: guter Mühen
  rationale: „Mühen“ gibt den Gedanken an anstrengende, mit Mühe verbundene Arbeit wieder; „guter“ bewahrt die breite positive und sittliche Bedeutung von ἀγαθῶν.
- source_word: καρπός
  choice: Frucht
  rationale: Die ausdrückliche Metapher wird beibehalten und bildet mit „Wurzel“ im zweiten Satzteil ein bewusstes Bildpaar.
- source_word: εὐκλεής
  choice: ruhmreich
  rationale: Das Wort bezeichnet guten Ruf, ehrenvolles Ansehen oder Ruhm. „Ruhmreich“ wahrt diesen Sinn in knapper, würdevoller Form.
- source_word: ἀδιάπτωτος
  choice: unvergänglich
  rationale: Das Adjektiv bezeichnet etwas, das nicht fällt, ausbleibt oder versagt und daher Bestand hat. „Unvergänglich“ passt zur Wurzelmetapher und bringt die bleibende Beständigkeit prägnant zum Ausdruck.
- source_word: ῥίζα
  choice: Wurzel
  rationale: Die landwirtschaftliche Metapher wird entsprechend dem griechischen Text und parallel zu „Frucht“ ausdrücklich erhalten.
- source_word: φρονήσεως
  choice: Einsicht
  rationale: φρόνησις bezeichnet verständige, praktisch orientierte Einsicht. „Einsicht“ ist im modernen Deutsch gut verständlich und unterscheidet den Ausdruck von σοφία, „Weisheit“.
theological_decisions:
- issue: Wiedergabe von φρόνησις im Verhältnis zur Weisheitsterminologie
  choice: Einsicht
  alternative: Klugheit; Besonnenheit; Weisheit
  rationale: Da hier φρόνησις und nicht σοφία steht, werden die unterschiedlichen griechischen Begriffe nicht unterschiedslos mit „Weisheit“ wiedergegeben. „Einsicht“ lässt den intellektuellen und praktischen Bedeutungsumfang offen.
- issue: Bildstruktur von Frucht und Wurzel
  choice: Beide Metaphern ausdrücklich bewahren
  alternative: 'Deutende Umschreibung, etwa: „Die Ergebnisse guter Anstrengungen bleiben bestehen“'
  rationale: Die parallelen Bilder prägen den sprichwortartigen Satz. Ihre Bewahrung vermeidet eine über den Ausgangstext hinausgehende Auslegung.
- issue: Reichweite von ἀδιάπτωτος
  choice: ist unvergänglich
  alternative: versagt nicht; ist unfehlbar; bleibt bestehen
  rationale: Die Übersetzung hebt die dauerhafte Beständigkeit hervor, ohne die Aussage auf moralische Fehlerlosigkeit zu beziehen. Die bildhafte Aussage über die Wurzel bleibt dabei erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwortartiger Satzform. Die Paarung „Frucht“ und „Wurzel“ sowie die genuine Bedeutungsbreite von φρόνησις bleiben erhalten.
