  text: For even if they become long-lived[a], they will be counted as nothing[b], and in the end their old age will be dishonored.
translation:
  language: de
  text: Denn selbst wenn sie ein langes Leben erreichen, werden sie als nichts angesehen[a], und am Ende[b] wird ihr Alter in Unehre sein.
  philosophy: optimal-equivalence
  footnotes:
