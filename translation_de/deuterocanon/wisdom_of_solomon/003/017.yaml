lexical_decisions:
- source_word: ἐὰν τε γὰρ
  choice: Denn selbst wenn
  rationale: Gibt die begründende Verknüpfung durch γάρ und den konzessiven Bedingungssinn von ἐάν τε in natürlichem Deutsch wieder.
- source_word: μακρόβιοι γένωνται
  choice: sie ein langes Leben erreichen
  rationale: Drückt das mögliche Erlangen eines langen Lebens idiomatisch aus und bewahrt die Bedeutung von μακρόβιοι und γένωνται.
- source_word: εἰς οὐθὲν λογισθήσονται
  choice: werden sie für nichts geachtet
  rationale: Bewahrt den passiven Bewertungscharakter von λογισθήσονται und die scharfe Aussage von εἰς οὐθέν, ohne die wertende Instanz ausdrücklich festzulegen.
- source_word: ἐπʼ ἐσχάτων
  choice: zuletzt
  rationale: Gibt die zeitliche Schlussphase knapp wieder; die mögliche Nuance eines abschließenden Ergebnisses bleibt in der Fußnote sichtbar.
- source_word: ἄτιμον
  choice: ohne Ehre
  rationale: Bewahrt die Ehr-und-Schande-Dimension, ohne eindeutig zwischen gesellschaftlicher Geringschätzung und aktivem Entehren zu entscheiden.
- source_word: τὸ γῆρας αὐτῶν
  choice: ihr Alter
  rationale: Ist die direkte und natürliche deutsche Wiedergabe von γῆρας mit dem Possessivpronomen.
theological_decisions:
- issue: Wertung eines langen Lebens der Gottlosen
  choice: Auch ein langes Leben führt nicht zu Ansehen oder Ehre.
  alternative: Die Aussage ausdrücklich auf ein Urteil Gottes oder allein auf gesellschaftliches Ansehen beziehen.
  rationale: Der Kontext stellt Gerechte und Gottlose gegenüber, doch der Vers nennt die wertende Instanz nicht. Die Übersetzung erhält diese Offenheit und fügt weder „vor Gott“ noch eine rein gesellschaftliche Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ein langes Leben erreichen“ ist idiomatischer als das wörtliche „langlebig werden“; „ohne Ehre“ hält die mögliche Spannung zwischen fehlendem Ansehen und Entehrung offen.
