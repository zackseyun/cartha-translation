  text: Even if they die quickly[a], they have no hope, nor comfort on the day of judgment.
translation:
  language: de
  text: Selbst wenn sie rasch sterben, haben sie keine Hoffnung und keinen Trost am Tag des Gerichts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Tag der Entscheidung« beziehungsweise »am Tag der Beurteilung«. Der griechische Ausdruck kann eine entscheidende Prüfung, Beurteilung oder ein Urteil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε
  choice: Selbst wenn
  rationale: Die Wendung leitet hier eine konzessive Bedingung ein; »selbst wenn« gibt diese Funktion im Deutschen natürlich wieder.
- source_word: ὀξέως
  choice: rasch
  rationale: Das Adverb bezeichnet zunächst die Geschwindigkeit. »Rasch« bleibt näher am griechischen Wortlaut als das deutendere »frühzeitig«.
- source_word: τελευτήσωσιν
  choice: sie sterben
  rationale: Das Verb bezeichnet in diesem Zusammenhang das Lebensende; »sterben« ist klar und idiomatisch.
- source_word: ἐλπίδα
  choice: Hoffnung
  rationale: Die übliche deutsche Entsprechung bewahrt den eschatologischen Erwartungshorizont.
- source_word: ἡμέρᾳ διαγνώσεως
  choice: am Tag des Gerichts
  rationale: διάγνωσις kann eine unterscheidende Prüfung, Entscheidung oder ein Urteil bezeichnen. Im Kontext der endgültigen Abrechnung ist »Gericht« verständlich und sachlich angemessen.
- source_word: παραμύθιον
  choice: Trost
  rationale: Das Substantiv bezeichnet Trost oder Zuspruch; »Trost« ist knapp, natürlich und würdig.
theological_decisions:
- issue: Eschatologische Bedeutung von ἡμέρᾳ διαγνώσεως
  choice: am Tag des Gerichts
  alternative: am Tag der Entscheidung; am Tag der Beurteilung
  rationale: Der Zusammenhang stellt das Geschick der Gerechten und Gottlosen über den Tod hinaus gegenüber. »Tag des Gerichts« bewahrt diesen eschatologischen Sinn, während die Fußnote die breitere Bedeutung des griechischen Ausdrucks offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. »Rasch« vermeidet die interpretierende Festlegung auf einen vorzeitigen Tod; die Mehrdeutigkeit von διάγνωσις wird durch die Fußnote bewahrt.
