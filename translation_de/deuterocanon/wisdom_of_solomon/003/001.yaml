  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/001.yaml
  text: But the souls of the righteous are in the hand of God[a], and no torment will ever touch them.
translation:
  language: de
  text: Doch die Seelen der Gerechten sind in Gottes Hand, und keine Qual wird sie je berühren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und keine Bedrängnis wird sie je berühren“. Das griechische Wort βάσανος kann schwere Qual oder bedrängendes Leiden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαίων
  choice: der Gerechten
  rationale: Der substantivisch gebrauchte Genitiv Plural von δίκαιος bezeichnet die Gerechten als moralisch-theologische Gruppe. „Der Gerechten“ ist im Deutschen knapp, würdig und quellennah.
- source_word: ψυχαὶ
  choice: die Seelen
  rationale: ψυχή kann „Seele“, „Leben“ oder „Person“ bedeuten. Im unmittelbaren Zusammenhang mit dem sichtbaren Tod bewahrt „Seelen“ die anthropologische und eschatologische Aussage des Textes, ohne sie weiter auszudeuten.
- source_word: ἐν χειρὶ θεοῦ
  choice: in Gottes Hand
  rationale: Die bildhafte biblische Wendung kann Schutz, Zugehörigkeit und Macht ausdrücken. „In Gottes Hand“ ist natürliches Deutsch und wahrt die Offenheit des Bildes.
- source_word: οὐ μὴ ἅψηται
  choice: wird … je berühren
  rationale: οὐ μή mit Aorist Konjunktiv bildet eine nachdrückliche Verneinung. Die Verbindung von „keine“ und „je“ gibt diesen starken Ausschluss in flüssigem modernem Deutsch wieder.
- source_word: αὐτῶν
  choice: sie
  rationale: ἅπτομαι regiert im Griechischen den Genitiv; im Deutschen verlangt „berühren“ den Akkusativ. „Sie“ gibt den Bezug idiomatisch korrekt wieder.
- source_word: βάσανος
  choice: Qual
  rationale: βάσανος bezeichnet hier schwere Pein oder quälendes Leiden. „Qual“ bewahrt die Intensität, ist im modernen Deutsch natürlich und lässt die mögliche Bedeutungsbreite zu Bedrängnis offen.
theological_decisions:
- issue: Bedeutung von ψυχαί im Blick auf die Existenz nach dem Tod
  choice: „Seelen“ im Haupttext beibehalten
  alternative: „Leben“ oder „Personen“
  rationale: Der folgende Kontext spricht vom vermeintlichen Sterben der Gerechten. „Seelen“ erhält die anthropologische und eschatologische Spannung des griechischen Textes, ohne eine detaillierte Lehre über den Zwischenzustand einzutragen.
- issue: Aussagegehalt von ἐν χειρὶ θεοῦ
  choice: Das Bild mit „in Gottes Hand“ wiedergeben
  alternative: „unter Gottes Schutz“ oder „in Gottes Obhut“
  rationale: Die wörtliche Metapher ist im Deutschen verständlich und umfasst Schutz, Zugehörigkeit und göttliche Macht. Eine erklärende Wiedergabe würde den Sinn unnötig verengen.
- issue: Reichweite von βάσανος
  choice: „Qual“ im Haupttext
  alternative: „Bedrängnis“
  rationale: „Qual“ entspricht der starken Bedeutung von βάσανος in diesem Zusammenhang. Die Fußnote erhält die weiter gefasste Möglichkeit schweren Leidens, ohne die Zusage des Verses konfessionell zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Parallelismus; „Doch“ gibt δέ als Kontrast zum vorausgehenden Zusammenhang wieder. Die traditionelle biblische Bildsprache wird ohne archaische Formulierungen bewahrt.
