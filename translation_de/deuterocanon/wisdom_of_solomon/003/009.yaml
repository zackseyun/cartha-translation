base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/009.yaml
  text: Those who have trusted in him will understand truth[a], and the faithful will remain with him in love[b], because grace and mercy are for his chosen ones.
translation:
  language: de
  text: Die auf ihn vertraut haben, werden Wahrheit verstehen, und die Treuen werden in Liebe bei ihm bleiben[a], denn Gnade und Erbarmen gelten seinen Auserwählten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: werden auf ihn warten. Das griechische Verb kann sowohl das fortdauernde Bleiben bei jemandem als auch das erwartungsvolle Warten auf jemanden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: seinen Erwählten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πεποιθότες ἐπʼ αὐτῷ
  choice: die auf ihn vertraut haben
  rationale: Das Perfektpartizip bezeichnet ein erworbenes und fortdauerndes Vertrauen. „Auf ihn vertraut haben“ bewahrt diesen Aspekt und entspricht natürlichem Deutsch.
- source_word: συνήσουσιν ἀλήθειαν
  choice: werden Wahrheit verstehen
  rationale: Die Wiedergabe folgt direkt dem Futur von συνίημι; das artikellose ἀλήθειαν bleibt ohne bestimmenden Artikel.
- source_word: οἱ πιστοὶ
  choice: die Treuen
  rationale: πιστοί bezeichnet hier am ehesten Menschen, die sich durch beständige Treue auszeichnen. „Die Treuen“ bewahrt zugleich die Parallelität zu den Vertrauenden.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: Die knappe Formulierung lässt offen, ob Gottes Liebe, die Liebe der Treuen oder Liebe als Sphäre ihres Bleibens gemeint ist.
- source_word: προσμενοῦσιν αὐτῷ
  choice: werden bei ihm bleiben
  rationale: προσμένω kann fortdauerndes Bleiben oder erwartungsvolles Warten bezeichnen. Im Zusammenhang mit dem Geschick der Gerechten passt „bei ihm bleiben“, ohne die lexikalische Alternative zu verschweigen.
- source_word: χάρις καὶ ἔλεος
  choice: Gnade und Erbarmen
  rationale: Die geläufige Wortpaarung gibt beide theologisch gewichtigen Begriffe klar und würdig wieder.
- source_word: τοῖς ἐκλεκτοῖς αὐτοῦ
  choice: seinen Auserwählten
  rationale: „Auserwählte“ bringt die göttliche Auswahl im modernen Deutschen klar zum Ausdruck; „Erwählte“ bleibt als ebenso mögliche Alternative vermerkt.
theological_decisions:
- issue: Bedeutung von πιστοὶ im Verhältnis zu Vertrauen und Glauben
  choice: die Treuen
  alternative: die Glaubenden
  rationale: Im Weisheitskontext steht wahrscheinlich die beständige Treue der Gerechten im Vordergrund. Die Wiedergabe legt den Ausdruck jedoch nicht auf eine konfessionelle Kategorie fest.
- issue: Bedeutung von προσμενοῦσιν αὐτῷ
  choice: werden bei ihm bleiben
  alternative: werden auf ihn warten
  rationale: Der Zusammenhang spricht für fortdauernde Gemeinschaft mit Gott; da das Verb auch erwartungsvolles Warten ausdrücken kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
- issue: Wiedergabe von ἐκλεκτοῖς
  choice: Auserwählten
  alternative: Erwählten
  rationale: Beide deutschen Wörter geben die göttliche Erwählung wieder. „Auserwählten“ ist unmittelbar verständlich, ohne die Aussage weiter systematisch-theologisch auszugestalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Satzbau. Die kompakte Wendung „in Liebe“ bleibt bewusst mehrdeutig; „gelten“ ergänzt das im Griechischen unausgedrückte Prädikat idiomatisch, ohne eine zusätzliche zeitliche oder dogmatische Bestimmung einzuführen.
