- from: Denn selig ist die unfruchtbare Frau, die unbefleckt geblieben ist und kein sündiges Beilager kannte[a]; sie wird Frucht haben, wenn die Seelen heimgesucht werden[b].
  to: Denn selig ist die unfruchtbare Frau, die unbefleckt ist und kein Beilager in Verfehlung kannte[a]; sie wird Frucht haben bei der Heimsuchung der Seelen[b].
