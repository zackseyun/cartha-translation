base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/013.yaml
  text: For blessed is the undefiled barren woman[a], who has not known a bed in transgression[b]; she will have fruit at the visitation of souls.
translation:
  language: de
  text: Denn selig ist die unfruchtbare Frau, die unbefleckt ist und kein Beilager in Verfehlung kannte[a]; sie wird Frucht haben bei der Heimsuchung der Seelen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die kein Lager in einer Verfehlung kannte“. „Lager“ beziehungsweise „Beilager“ ist hier eine verhüllende Bezeichnung für sexuelle Gemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: Die „Heimsuchung der Seelen“ kann Gottes künftige Zuwendung zu oder Prüfung der Seelen bezeichnen und dabei Gericht oder Erweisung einschließen.
    reason: alternative_reading
lexical_decisions:
- source_word: μακαρία
  choice: selig
  rationale: „Selig“ bewahrt den gehobenen biblischen Zuspruch und bezeichnet mehr als bloßes Glück.
- source_word: στεῖρα
  choice: die unfruchtbare Frau
  rationale: Das substantivierte feminine Adjektiv bezeichnet eine Frau, die keine Kinder bekommen kann; die Ergänzung „Frau“ macht den Bezug im Deutschen deutlich.
- source_word: ἡ ἀμίαντος
  choice: die unbefleckt geblieben ist
  rationale: Die Formulierung gibt die Freiheit von moralischer Befleckung wieder und verbindet sich im Deutschen natürlich mit dem folgenden Relativsatz.
- source_word: ἔγνω κοίτην
  choice: kein … Beilager kannte
  rationale: „Kannte“ erhält den biblischen Euphemismus von γινώσκω; „Beilager“ gibt κοίτη als verhüllende Bezeichnung sexueller Vereinigung würdig und verständlich wieder.
- source_word: ἐν παραπτώματι
  choice: sündiges
  rationale: Das attributive „sündiges“ vermittelt knapp, dass die bezeichnete sexuelle Verbindung durch eine Verfehlung geprägt ist, ohne die konkrete Art der Verfehlung festzulegen.
- source_word: ἕξει καρπὸν
  choice: sie wird Frucht haben
  rationale: 'Die wörtliche Wendung erhält den beabsichtigten Kontrast: Gerade die unfruchtbare Frau wird künftig „Frucht“ haben.'
- source_word: ἐν ἐπισκοπῇ ψυχῶν
  choice: wenn die Seelen heimgesucht werden
  rationale: „Heimgesucht“ bewahrt die Offenheit von ἐπισκοπή für Gottes prüfendes, richtendes oder rettendes Eingreifen; der temporale Nebensatz ist idiomatisches Deutsch.
theological_decisions:
- issue: Bedeutung der „Heimsuchung der Seelen“
  choice: Ein künftiges göttliches Aufsuchen beziehungsweise Eingreifen, offen zwischen Prüfung, Gericht und Bestätigung
  alternative: „beim Gericht über die Seelen“ oder „wenn Gott sich den Seelen zuwendet“
  rationale: Der Kontext spricht von der künftigen Bestätigung der Gerechten, doch ἐπισκοπή legt nicht eindeutig fest, ob Gericht oder gnädige Zuwendung im Vordergrund steht. Die Übersetzung erhält diese Spannung.
- issue: Art der mit dem Beilager verbundenen Verfehlung
  choice: Allgemein als sündiges Beilager bezeichnet
  alternative: Ehebruch, Unzucht oder eine andere konkrete sexuelle Verfehlung
  rationale: παράπτωμα bezeichnet eine Verfehlung, benennt hier aber nicht näher deren Art. Eine konkretere Zuordnung würde mehr sagen als der griechische Text.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit maßvoll biblischem Klang. „Selig“, „Beilager“ und „Heimsuchung“ erhalten die Würde und Bildsprache des griechischen Textes; die Fußnoten erklären die heute weniger alltäglichen Ausdrücke. Beide Fußnotenmarker stehen im Haupttext.
