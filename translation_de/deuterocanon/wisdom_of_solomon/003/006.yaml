  text: Like gold in a furnace he tested them[b][a], and like a whole burnt offering he accepted them.
translation:
  language: de
  text: Wie Gold im Schmelzofen prüfte er sie[a], und wie ein Ganzbrandopfer[b] nahm er sie an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Schmelztiegel“. Das griechische Wort kann ein Gefäß oder einen Ort zum Schmelzen und Läutern von Metall bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich bezeichnet das griechische Wort ein Opfer, das vollständig verbrannt wird.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὡς χρυσὸν
  choice: Wie Gold
  rationale: Die Vergleichspartikel ὡς und das Bild des Goldes werden direkt und idiomatisch wiedergegeben.
- source_word: ἐν χωνευτηρίῳ
  choice: im Schmelzofen
  rationale: χωνευτήριον bezeichnet eine Vorrichtung oder einen Ort zum Schmelzen und Läutern von Metall; „Schmelzofen“ bewahrt das Verhüttungsbild in allgemein verständlicher Sprache.
- source_word: ἐδοκίμασεν
  choice: prüfte
  rationale: Das Verb bezeichnet eine Prüfung auf Echtheit oder Bewährung; „prüfte“ bewahrt diese Bedeutung, ohne den Vorgang einseitig als Reinigung auszulegen.
- source_word: ὁλοκάρπωμα θυσίας
  choice: Ganzbrandopfer
  rationale: ὁλοκάρπωμα bezeichnet ein vollständig verbranntes Opfer. Das Genitivwort θυσίας macht den kultischen Zusammenhang ausdrücklich, der im deutschen Fachwort bereits enthalten ist.
- source_word: προσεδέξατο
  choice: nahm ... an
  rationale: Das Verb drückt wohlwollende Aufnahme aus; im Opferzusammenhang ist „annehmen“ natürlich und erhält den kultischen Anklang.
theological_decisions:
- issue: Opferterminologie in ὁλοκάρπωμα θυσίας
  choice: Ganzbrandopfer
  alternative: Brandopfer; vollständig verbranntes Opfer
  rationale: „Ganzbrandopfer“ wahrt die Aussage, dass das Opfer vollständig verbrannt wird, und lässt die metaphorische Gleichsetzung der Geprüften mit einem von Gott angenommenen Opfer bestehen, ohne sie dogmatisch auszudeuten.
- issue: Subjekt der Verben
  choice: er
  alternative: Gott
  rationale: Der griechische Vers nennt das Subjekt nicht ausdrücklich. Das Pronomen bewahrt den Rückbezug aus dem Kontext und vermeidet eine im Vers selbst nicht vorhandene Ergänzung.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Parallelismus der beiden mit „wie“ eingeleiteten Vergleiche bleibt erhalten; „Ganzbrandopfer“ ist kultisch präzise, wird aber durch eine Fußnote erklärt.
