revisions:
- from: Denn Gott liebt nichts außer dem Menschen, der mit Weisheit zusammenlebt.[a]
  to: Denn Gott liebt nichts außer dem, der mit der Weisheit lebt.[a]
  rationale: Die Revision ersetzt die im Deutschen leicht partnerschaftlich verstandene Formulierung „mit Weisheit zusammenlebt“ durch „mit der Weisheit lebt“ und glättet die substantivische Personenbezeichnung. Sie wahrt die umfassende Negation („nichts“), die Ausnahmefunktion von εἰ μή und die dauerhafte Gemeinschaft, die συνοικῶν ausdrückt. Die Fußnote erhält die weniger explizit personifizierende Alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:08:02Z'
review_pass:
  verdict: revise
  source_fidelity: Die griechische Ausnahme bezieht sich auf eine durch dauernde Gemeinschaft mit σοφία gekennzeichnete Person. „Zusammenlebt“ kann dies grundsätzlich abbilden, ruft im heutigen Deutsch jedoch leicht die engere, oft partnerschaftliche Bedeutung des eheähnlichen Zusammenlebens hervor. Der bestimmte Artikel bei „der Weisheit“ ist im personifizierenden Kontext sinnvoll, ohne eine dogmatische Identifikation vorzunehmen.
  naturalness: „Nichts außer dem Menschen, der …“ ist unnötig schwerfällig und „zusammenlebt“ in dieser Verbindung missverständlich. „Nichts außer dem, der mit der Weisheit lebt“ ist idiomatischer und bewahrt die substantivische Funktion des Partizips.
  terminology: „Weisheit“ ist als Schlüsselbegriff beizubehalten. Die Formulierung „mit der Weisheit lebt“ gibt die personale Resonanz des unmittelbaren Kontextes wieder; die Fußnote weist darauf hin, dass die artikellose griechische Form auch weniger explizit personifizierend verstanden werden kann.
  issues:
  - severity: medium
    issue: „zusammenlebt“ hat im modernen Deutsch eine unerwünschte partnerschaftlich-häusliche Konnotation.
    rationale: συνοικῶν bezeichnet hier die dauerhafte Gemeinschaft mit der personifizierten Weisheit, nicht eine menschliche Lebenspartnerschaft. Die Formulierung kann daher den Sinn unangemessen verengen oder irritieren.
  - severity: low
    issue: „dem Menschen, der“ ist als Wiedergabe des substantivierten Partizips schwerfällig.
    rationale: „dem, der“ entspricht der griechischen Konstruktion unmittelbar und klingt im modernen Standarddeutsch natürlicher.
