base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/028.yaml
  text: For God loves nothing except the one who dwells with wisdom[a].
translation:
  language: de
  text: Denn Gott liebt nichts außer dem, der mit der Weisheit lebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der mit Weisheit lebt“. Im Zusammenhang dieses Kapitels wird die Weisheit stark personifiziert.'
    reason: Die griechische artikellose Form σοφίᾳ lässt die Personifikation sprachlich weniger ausdrücklich hervortreten; die Anmerkung bewahrt diese Nuance.
lexical_decisions:
- source_word: οὐθὲν
  choice: nichts
  rationale: Das substantivierte Neutrum wird als umfassendes Objekt bewahrt. Obwohl die Ausnahme einen Menschen bezeichnet, sollte die weitere griechische Formulierung nicht zu „niemanden“ verengt werden.
- source_word: ἀγαπᾷ
  choice: liebt
  rationale: Die direkte und natürliche Entsprechung wahrt das Gewicht der Aussage über Gottes Liebe.
- source_word: εἰ μὴ
  choice: außer
  rationale: Die Wendung führt hier eine Ausnahme und keine Bedingung ein.
- source_word: τὸν ... συνοικοῦντα
  choice: dem Menschen, der ... zusammenlebt
  rationale: Das substantivierte Partizip bezeichnet eine Person, die durch eine fortdauernde Lebensgemeinschaft gekennzeichnet ist. „Zusammenlebt“ bildet die συν-Komponente und den häuslich-relationalen Sinn von συνοικέω deutlich ab.
- source_word: σοφίᾳ
  choice: mit Weisheit
  rationale: Der Dativ bezeichnet die Gemeinschaft mit der Weisheit. Die Großschreibung ist im Deutschen als Substantivschreibung grammatisch erforderlich und entscheidet daher nicht zusätzlich über den Grad der Personifikation.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: mit Weisheit
  alternative: mit der Weisheit
  rationale: Der Kontext personifiziert die Weisheit stark, doch der griechische Text hat hier keinen Artikel. Die artikellose deutsche Fassung bewahrt sowohl den Begriff als auch den personifizierten Nachklang, ohne diesen eindeutig festzulegen.
- issue: Reichweite des göttlichen Liebens
  choice: Gott liebt nichts außer dem Menschen ...
  alternative: Gott liebt niemanden außer dem Menschen ...
  rationale: „Nichts“ wahrt das griechische Neutrum οὐθὲν und damit die auffallend umfassende Aussage, auch wenn die genannte Ausnahme eine Person ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zusammenlebt“ klingt gegenwärtig und gibt zugleich die dauerhafte, enge Gemeinschaft des griechischen συνοικέω wieder; „dem Menschen“ vermeidet das schwerfällige „denjenigen“.
