  text: and I came to know both what is hidden and what is plain;[a]
translation:
  language: de
  text: Und ich lernte sowohl kennen, was verborgen ist, als auch, was offenbar ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und ich erkannte sowohl das Verborgene als auch das Offenbare.«'
    reason: Die griechische Form ἔγνων kann auch schlicht mit »ich erkannte« wiedergegeben werden; die substantivische Wiedergabe von κρυπτὰ und ἐμφανῆ entspricht ebenfalls dem möglichen Satzbau.
lexical_decisions:
- source_word: ὅσα
  choice: das, was
  rationale: Die substantivische Relativform gibt den umfassenden Gegenstand des Erkennens im Deutschen natürlich wieder.
- source_word: τε
  choice: sowohl … als auch
  rationale: Die Verbindung τε … καί stellt die beiden Bereiche, das Verborgene und das Offenbare, einander korrelativ gegenüber.
- source_word: κρυπτὰ
  choice: was verborgen ist
  rationale: κρυπτός bezeichnet allgemein das Verborgene oder Verdeckte; »verborgen« vermeidet die engere Vorstellung absichtlich gehüteter Geheimnisse.
- source_word: ἐμφανῆ
  choice: was offenbar ist
  rationale: ἐμφανής bezeichnet das Sichtbare, offenkundig Hervortretende oder Erkennbare. »Offenbar« wahrt den gehobenen Ton und bildet einen klaren Gegensatz zu »verborgen«.
- source_word: ἔγνων
  choice: ich lernte … kennen
  rationale: Der Aorist von γινώσκω kann den Eintritt in das Wissen bezeichnen. »lernte kennen« gibt diese mögliche ingressive Bedeutung idiomatisch wieder, ohne ein bloßes Erlernen von Informationen zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korrelative Struktur macht den Gegensatz zwischen dem Verborgenen und dem Offenbaren deutlich; die Fußnote bewahrt die knappere, formalere Übersetzungsmöglichkeit.
