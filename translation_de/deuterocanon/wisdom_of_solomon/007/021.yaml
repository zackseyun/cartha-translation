  terminology: Es sind keine theologischen Fachbegriffe oder Eigennamen betroffen. »Das Verborgene« und »das Offenbare« in der Fußnote sind tragfähige substantivische Alternativen; sie vermeiden eine unnötige Einengung auf absichtlich geheim gehaltene Dinge.
