  source_fidelity: Die Übersetzung gibt ἔγνων angemessen ingressiv mit »lernte … kennen« wieder und erhält den Gegensatz von κρυπτά und ἐμφανῆ. »Offenbar« ist hier als prädikatives Adjektiv verständlich und entspricht dem griechischen Sinn von »offenkundig/manifest«.
