base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/026.yaml
  text: For she is a radiance of eternal light[a], and a spotless mirror of the working of God, and an image of his goodness.
translation:
  language: de
  text: Denn sie ist der Abglanz des ewigen Lichts[a], ein makelloser Spiegel des Wirkens Gottes und ein Bild seiner Güte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Widerschein des ewigen Lichts“. Das griechische Wort kann sowohl den aus einer Quelle hervorstrahlenden Glanz als auch reflektierten Lichtschein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: Abglanz
  rationale: Das Wort kann ein Ausstrahlen oder einen reflektierten Glanz bezeichnen. „Abglanz“ ist im Deutschen würdig und verständlich und bewahrt diese Mehrdeutigkeit besser als eine eindeutig festlegende Wiedergabe.
- source_word: φωτὸς ἀϊδίου
  choice: des ewigen Lichts
  rationale: Die Genitivverbindung wird direkt wiedergegeben; „ewig“ entspricht ἀΐδιος natürlich und prägnant.
- source_word: ἔσοπτρον ἀκηλίδωτον
  choice: ein makelloser Spiegel
  rationale: „Spiegel“ ist die direkte Entsprechung zu ἔσοπτρον; „makellos“ gibt das Unbefleckte beziehungsweise Unbefleckte von ἀκηλίδωτος idiomatisch wieder und passt zum Bild.
- source_word: τῆς τοῦ θεοῦ ἐνεργείας
  choice: des Wirkens Gottes
  rationale: „Wirken“ bezeichnet Gottes tätige Kraft beziehungsweise Tätigkeit, ohne den Ausdruck durch das im Deutschen fachsprachlich missverständliche „Energie“ zu verengen.
- source_word: εἰκὼν τῆς ἀγαθότητος αὐτοῦ
  choice: ein Bild seiner Güte
  rationale: „Bild“ entspricht εἰκών unmittelbar; „Güte“ bewahrt die umfassende Bedeutung von ἀγαθότης und den gehobenen Ton.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: „sie“ beibehalten
  alternative: „die Weisheit“ wiederholen oder geschlechtsneutral umschreiben
  rationale: Der Kontext personifiziert die Weisheit, und das griechische Pronomen ist feminin. Die Wiedergabe mit „sie“ erhält die literarische und theologische Spannung, ohne die Weisheit als eigene Gottheit festzulegen.
- issue: Beziehung zwischen Weisheit und ewigem Licht
  choice: „Abglanz des ewigen Lichts“
  alternative: „Ausstrahlung“ oder „Widerschein des ewigen Lichts“
  rationale: Die Formulierung erhält die genitivische Beziehung und legt nicht endgültig fest, ob ἀπαύγασμα eher ein Hervorstrahlen aus einer Quelle oder einen reflektierten Glanz bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Bildsprache. Die parallele Folge „Abglanz – Spiegel – Bild“ bleibt erhalten; auf technisch-theologische Fachsprache wird verzichtet.
