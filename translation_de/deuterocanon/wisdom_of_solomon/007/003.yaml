base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/003.yaml
  text: And I too, when I was born, drew in the common air, and fell upon the earth that suffers alike with all; and my first voice was the same as everyone's, as I cried.
translation:
  language: de
  text: Auch ich atmete, als ich geboren wurde, die Luft ein, die allen gemeinsam ist,[a] und fiel auf die Erde, die denselben Leiden unterworfen ist.[b] Mein erster Laut war derselbe wie bei allen anderen, und ich weinte ebenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die gemeinsame Luft«; gemeint ist die Luft, die alle Menschen miteinander teilen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Wort kann auch bedeuten: »denselben Erfahrungen ausgesetzt« oder »von gleicher Beschaffenheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: als ich geboren wurde
  rationale: Im Zusammenhang mit dem ersten Atemzug und dem ersten Weinen bezeichnet das Partizip den Eintritt ins menschliche Leben; die zeitliche Wendung ist im Deutschen natürlich.
- source_word: ἔσπασα τὸν κοινὸν ἀέρα
  choice: atmete ... die Luft ein, die allen gemeinsam ist
  rationale: ἔσπασα bezeichnet mit ἀέρα als Objekt das Einziehen des Atems; κοινός betont die mit allen Menschen geteilte Lebenswelt.
- source_word: ἐπὶ τὴν ὁμοιοπαθῆ ... γῆν
  choice: auf die Erde, die denselben Leiden unterworfen ist
  rationale: ὁμοιοπαθής kann gleiche Erfahrungen, Zustände oder Leidensanfälligkeit bezeichnen. Die Formulierung bewahrt die auffällige Personifizierung der Erde und den Gedanken gemeinsamer menschlicher Gebrechlichkeit.
- source_word: κατέπεσον
  choice: fiel auf
  rationale: Die konkrete Bewegung des griechischen Verbs wird beibehalten und passt zum Bild der Geburt.
- source_word: πρώτην φωνήν
  choice: Mein erster Laut
  rationale: φωνή bedeutet Stimme oder Laut. »Laut« ist hier natürlich und vermeidet eine Vorwegnahme des nachfolgenden Weinens.
- source_word: τὴν ὁμοίαν πᾶσιν ἶσα κλαίων
  choice: 'war wie der aller anderen: Ich weinte'
  rationale: Die Wendung unterstreicht, dass der erste Laut dem aller Menschen glich. Der Doppelpunkt gibt die erläuternde Beziehung zum Partizip κλαίων klar wieder.
theological_decisions:
- issue: Betonung der gemeinsamen menschlichen Existenz
  choice: Die Wiederholungen von Gemeinsamkeit und Gleichheit werden sichtbar bewahrt.
  alternative: Eine geglättete Wiedergabe, die lediglich eine gewöhnliche Geburt beschreibt.
  rationale: κοινόν, ὁμοιοπαθῆ und ὁμοίαν πᾶσιν heben die volle Solidarität des Sprechers mit allen Menschen hervor, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
- issue: Mehrdeutigkeit von ὁμοιοπαθής
  choice: »denselben Leiden unterworfen« im Haupttext, mit weiterer Bedeutungsbreite in der Fußnote
  alternative: »von gleicher Beschaffenheit« oder »denselben Erfahrungen unterworfen«
  rationale: Der Leidensaspekt ist lexikalisch gut begründet und kontextuell passend; die Fußnote verhindert, dass die breitere Bedeutung des Wortes verloren geht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt bildhaft und relativ eng am Griechischen, wird jedoch durch einen neuen Hauptsatz und einen Doppelpunkt für heutige Leser klar gegliedert.
