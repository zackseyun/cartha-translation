  verdict: revise
  source_fidelity: 'Die Übersetzung gibt Geburt, Einatmen der allen gemeinsamen Luft und das Fallen auf die Erde zutreffend wieder. Bei ὁμοιοπαθῆ ist »denselben Leiden unterworfen« als mögliche Auslegung vertretbar, jedoch enger als das griechische Adjektiv, das auch Gleichbetroffenheit bzw. gleiche Erfahrungsbedingungen ausdrücken kann. Vor allem sollte ἶσα ausdrücklich wiedergegeben werden: Der abschließende Satz sollte nicht nur das Weinen, sondern das gleichartige Weinen betonen.'
  naturalness: 'Das Deutsch ist insgesamt klar und würdig. »wie der aller anderen: Ich weinte« ist verständlich, doch die Ergänzung »ebenso« macht den Bezug zum griechischen ἶσα idiomatisch und präzise sichtbar.'
