  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/006.yaml
  text: But there is one entrance into life for all[a], and an equal departure.
translation:
  language: de
  text: Doch für alle gibt es nur einen Eingang ins Leben[a] und einen gleichen Ausgang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch alle haben denselben Eingang ins Leben und denselben Ausgang.“ Das Griechische stellt „Eingang“ und „Ausgang“ als ausgewogenes Bild für Anfang und Ende des menschlichen Lebens gegenüber.'
    reason: Lexikalische Alternative und Erläuterung der Bildsprache.
lexical_decisions:
- source_word: μία
  choice: nur einen
  rationale: Die feminine Zahlform bezeichnet den einen, allen gemeinsamen Eingang. „Nur einen“ bewahrt die knappe Aussage der Einzigkeit und klingt im Deutschen natürlich.
- source_word: πάντων
  choice: für alle
  rationale: 'Der Genitiv wird idiomatisch wiedergegeben und drückt die Universalität aus: Dieser Anfang gilt ausnahmslos allen Menschen.'
- source_word: εἴσοδος
  choice: Eingang
  rationale: „Eingang“ erhält die räumliche Metapher und bildet mit „Ausgang“ ein klares deutsches Wortpaar.
- source_word: εἰς τὸν βίον
  choice: ins Leben
  rationale: Die Formulierung bleibt eng am griechischen Ausdruck für das irdische Leben; „in die Welt“ wäre stärker deutend.
- source_word: ἔξοδος
  choice: Ausgang
  rationale: „Ausgang“ ist das direkte Gegenstück zu „Eingang“ und lässt den Bezug auf den Tod erkennen, ohne ihn ausdrücklich einzusetzen.
- source_word: ἴση
  choice: gleichen
  rationale: Das Adjektiv bezeichnet den Ausgang als gleich beziehungsweise allen gemeinsam. „Gleich“ wahrt die Spannung zur vorausgehenden Zahlform μία, statt beide unterschiedslos mit „derselbe“ wiederzugeben.
- source_word: δὲ
  choice: Doch
  rationale: 'Die Partikel markiert einen milden Gegensatz zur vorausgehenden Selbstdarstellung des königlichen Sprechers: Trotz seines Ranges teilt er Anfang und Ende mit allen.'
theological_decisions:
- issue: Soll der implizite Bezug auf Geburt und Tod ausdrücklich gemacht werden?
  choice: Die Bildsprache „Eingang ins Leben“ und „Ausgang“ bleibt im Haupttext erhalten.
  alternative: „Alle werden auf dieselbe Weise geboren und sterben auf dieselbe Weise.“
  rationale: Der griechische Text verwendet die aufeinander bezogenen Metaphern εἴσοδος und ἔξοδος, nicht ausdrückliche Wörter für Geburt und Tod. Die bildhafte Fassung bewahrt Stil und Aussage über die gemeinsame menschliche Sterblichkeit, ohne sie stärker auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Wortpaar „Eingang/Ausgang“ erhält die prägnante Parallelität des Griechischen; „Doch“ gibt den milden Kontrast zum Kontext wieder.
