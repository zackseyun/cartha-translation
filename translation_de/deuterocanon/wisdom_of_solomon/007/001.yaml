base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/001.yaml
  text: For I also am a mortal man[a], equal to all, and a descendant of the earth-born first-formed man[b]; and in my mother’s womb I was molded into flesh.
translation:
  language: de
  text: Auch ich bin ein sterblicher Mensch, allen gleich, und ein Nachkomme des aus Erde geborenen, zuerst geformten Menschen[a]; im Leib meiner Mutter wurde ich als Fleisch geformt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »zuerst geformte Mensch« ist eine Anspielung auf Adam.
    reason: cross_reference
  - marker: b
    text: 'Oder: »wurde ich zu Fleisch geformt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θνητός
  choice: sterblich
  rationale: Das Adjektiv bezeichnet die dem Tod unterworfene menschliche Existenz. „Sterblich“ ist knapp, natürlich und bewahrt die Betonung der gemeinsamen menschlichen Vergänglichkeit.
- source_word: ἴσος ἅπασιν
  choice: wie alle anderen
  rationale: Die idiomatische deutsche Wendung drückt aus, dass der Sprecher hinsichtlich seiner Sterblichkeit und menschlichen Stellung niemandem gegenüber eine Ausnahme bildet.
- source_word: γηγενοῦς
  choice: aus Erde geboren
  rationale: Die wörtliche Bildsprache des Kompositums („erdgeboren“) und der Bezug auf den Ursprung des Menschen aus der Erde bleiben erhalten, ohne ein im heutigen Deutsch ungewöhnliches Wort zu erzwingen.
- source_word: ἀπόγονος
  choice: Nachkomme
  rationale: Das Wort bezeichnet jemanden, der von einem Vorfahren abstammt; „Nachkomme“ gibt den genealogischen Sinn klar wieder.
- source_word: πρωτοπλάστου
  choice: Erstgeformter
  rationale: Die substantivierte Bezeichnung bewahrt den Gedanken des zuerst geformten Menschen und damit die Anspielung auf Adam, ohne den im Griechischen nicht genannten Eigennamen in den Haupttext einzusetzen.
- source_word: ἐγλύφην
  choice: wurde … geformt
  rationale: Das Verb kann ein Schnitzen oder plastisches Gestalten bezeichnen. Im vorgeburtlichen Zusammenhang gibt „geformt“ das passive Gestaltungsmotiv natürlich wieder.
- source_word: σάρξ
  choice: Fleisch
  rationale: σάρξ ist hier konkret auf die leibliche Entstehung bezogen. „Fleisch“ erhält die Wortwahl und Körperlichkeit des griechischen Textes.
theological_decisions:
- issue: Bezug von πρωτοπλάστου
  choice: Deskriptive Wiedergabe als „Erstgeformter“ mit einer Fußnote zur Anspielung auf Adam
  alternative: Den Eigennamen „Adam“ unmittelbar in den Haupttext einsetzen
  rationale: Der griechische Text verwendet eine beschreibende Bezeichnung und nicht den Eigennamen. Die Übersetzung wahrt diesen Unterschied, während die Fußnote die Anspielung kenntlich macht.
- issue: Verhältnis von ἐγλύφην und σάρξ
  choice: „wurde ich zu Fleisch geformt“
  alternative: „wurde ich als Fleisch geformt“
  rationale: Die Konstruktion lässt sich als Ergebnis der Formung („zu Fleisch“) oder stärker prädikativ („als Fleisch“) verstehen. Der Haupttext verwendet die natürlichere deutsche Ergebnisformulierung; die Fußnote bewahrt die mögliche Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Bezeichnung „Erstgeformter“ erhält die Bildsprache und die unausgesprochene Adam-Anspielung des Originals. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
