lexical_decisions:
- source_word: ἐνιαυτῶν
  choice: der Jahre
  rationale: Der Genitiv Plural von ἐνιαυτός wird direkt wiedergegeben und bleibt auf κύκλους bezogen.
- source_word: κύκλους
  choice: Kreisläufe
  rationale: κύκλος bezeichnet Kreis, Umlauf oder wiederkehrenden Zyklus. „Kreisläufe“ vermittelt hier die regelmäßig wiederkehrende Ordnung der Jahre, ohne die astronomischen Einzelheiten zu stark festzulegen.
- source_word: ἀστέρων
  choice: der Sterne
  rationale: Der Genitiv Plural von ἀστήρ wird schlicht und präzise wiedergegeben und bleibt auf θέσεις bezogen.
- source_word: θέσεις
  choice: Stellungen
  rationale: θέσις bezeichnet eine Setzung, Lage oder Position. „Stellungen“ ist im astronomischen Zusammenhang natürlich und wahrt zugleich die mögliche Bedeutung bestimmter Standorte oder Stationen.
