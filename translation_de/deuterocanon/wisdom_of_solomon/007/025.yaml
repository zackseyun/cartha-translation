    text: 'Oder: „eine lautere/unvermischte Ausströmung“ statt „eine reine Ausströmung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτμίς
  choice: Hauch
  rationale: Das Wort bezeichnet Dunst, Dampf oder einen ausgehenden Hauch. „Hauch“ bewahrt das Bild eines Hervorgehens aus einer Quelle und klingt im Deutschen zugleich natürlich und würdig.
- source_word: δυνάμεως
  choice: Kraft
  rationale: „Kraft“ gibt die Bedeutung im Genitivgefüge präzise und idiomatisch wieder, ohne sie auf körperliche Stärke einzuengen.
- source_word: ἀπόρροια
  choice: Ausströmung
  rationale: Der Ausdruck bezeichnet etwas, das aus einer Quelle hervor- oder herausströmt. „Ausströmung“ erhält dieses Herkunftsbild, ohne die heute leicht negativen Nebenbedeutungen von „Ausfluss“.
- source_word: εἰλικρινής
  choice: rein
  rationale: Hier kennzeichnet das Adjektiv die Ausströmung als unvermischt und unbefleckt. „Rein“ ist verständlich und stellt den Zusammenhang mit dem folgenden Satzteil her.
- source_word: παντοκράτορος
  choice: des Allmächtigen
  rationale: „Der Allmächtige“ ist die geläufige und sachlich angemessene Wiedergabe des göttlichen Titels.
- source_word: μεμιαμμένον
  choice: Beflecktes
  rationale: Das Perfektpartizip bezeichnet etwas, das sich im Zustand der Verunreinigung befindet. „Beflecktes“ lässt moralische, kultische und allgemeine Verunreinigung offen.
- source_word: παρεμπίπτει
  choice: dringt … ein
  rationale: Das Verb bezeichnet hier, dass etwas Verunreinigtes keinen Zugang zu ihr gewinnt. „Dringt … ein“ gibt dies idiomatisch wieder und wahrt die Aussagekraft des Bildes.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Das feminine Pronomen „sie“ wird beibehalten.
  alternative: Wiederholung von „die Weisheit“ oder eine unpersönliche Wiedergabe.
  rationale: Das griechische Femininum verweist im Zusammenhang auf die personifizierte Weisheit. Die feminine Redeweise bewahrt die literarische und theologische Gestalt des Textes, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
- issue: Verhältnis der Weisheit zu Gott in den Bildern des Hervorgehens
  choice: Die Bilder „Hauch der Kraft Gottes“ und „Ausströmung der Herrlichkeit des Allmächtigen“ werden unmittelbar wiedergegeben.
  alternative: Eine abschwächende Umschreibung oder eine spätere metaphysische Deutung.
  rationale: Der Vers verwendet starke Bilder des Hervorgehens, bestimmt deren metaphysischen Sinn aber nicht abschließend. Die Übersetzung erhält diese Spannung, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Genitivverbindungen halten sich eng an das griechische Bild; „Ausströmung“ wahrt dessen philosophisch-theologisches Gewicht, bleibt aber verständlich. Die Satzstruktur folgt der begründenden und folgernden Bewegung des Originals.
