  text: For she is a breath of the power of God[a], and a pure emanation of the glory of the Almighty[b]; therefore nothing defiled enters into her.
translation:
  language: de
  text: Denn sie ist ein Hauch der Kraft Gottes[a] und eine reine Ausströmung der Herrlichkeit des Allmächtigen[b]; darum dringt nichts Beflecktes in sie ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dunst“ beziehungsweise „Dampf“ statt „Hauch“ (ἀτμίς). Das griechische Bild kann einen aus einer Quelle hervorgehenden Hauch oder aufsteigenden Dunst bezeichnen.'
    reason: lexical_alternative
