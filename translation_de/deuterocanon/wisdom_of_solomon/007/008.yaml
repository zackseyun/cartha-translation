lexical_decisions:
- source_word: προέκρινα
  choice: Ich zog … vor
  rationale: Das Verb bezeichnet eine bewusste Bevorzugung; die deutsche Wendung gibt den vergleichenden Sinn natürlich und präzise wieder.
- source_word: αὐτὴν
  choice: sie / ihr
  rationale: Die Pronomen beziehen sich auf die im Kontext personifizierte Weisheit. Das feminine Genus und die Personifikation bleiben erhalten.
- source_word: σκήπτρων
  choice: Zeptern
  rationale: Das konkrete Bild königlicher Herrschaft wird entsprechend dem griechischen Plural bewahrt.
- source_word: θρόνων
  choice: Thronen
  rationale: Die wörtliche Herrschaftsmetapher und der Parallelismus mit „Zeptern“ bleiben erhalten.
- source_word: πλοῦτον
  choice: Reichtum
  rationale: Der Singular bezeichnet materiellen Besitz beziehungsweise Wohlstand; „Reichtum“ ist im modernen Standarddeutsch klar und würdevoll.
- source_word: οὐδὲν ἡγησάμην
  choice: hielt … für nichts
  rationale: Diese geläufige deutsche Wendung bildet das wertende Urteil des griechischen Ausdrucks knapp ab.
- source_word: ἐν συγκρίσει αὐτῆς
  choice: im Vergleich mit ihr
  rationale: Die ausdrückliche Vergleichsrelation wird ohne Abschwächung oder zusätzliche Deutung wiedergegeben.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Feminine Personalpronomen „sie“ und „ihr“ beibehalten
  alternative: Die Weisheit mit dem unpersönlichen Pronomen „es“ wiedergeben
  rationale: Die griechischen femininen Formen beziehen sich im Kontext auf die personifizierte Weisheit. Die Übersetzung bewahrt diese literarisch-theologische Darstellung, ohne sie dogmatisch weiterzubestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die königlichen Bilder „Zepter“ und „Thron“ sowie die feminine Personifikation der Weisheit werden konkret bewahrt; der Satz bleibt zugleich flüssig und allgemein verständlich.
