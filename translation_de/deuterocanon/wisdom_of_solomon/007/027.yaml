base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/027.yaml
  text: Though she is one[a], she can do all things, and while remaining in herself she renews all things; and passing into holy souls from generation to generation, she makes them friends of God and prophets[b];
translation:
  language: de
  text: Obwohl sie eine einzige ist, vermag sie alles. Während sie in sich selbst bleibt, erneuert sie alles[a]. Von Generation zu Generation geht sie in heilige Seelen ein[b] und macht sie zu Freunden Gottes und zu Propheten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „macht alles neu“. Das griechische Verb kann „erneuern“ oder „neu machen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „tritt in heilige Seelen ein“. Das Partizip beschreibt, wie die Weisheit über die Generationen hinweg in jeweils heilige Seelen gelangt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μία
  choice: eine Einzige
  rationale: Bewahrt die Aussage von der Einheit beziehungsweise Einzahl der personifizierten Weisheit, ohne die zusätzliche Ausschließlichkeitsnuance von „allein“ einzutragen.
- source_word: πάντα δύναται
  choice: vermag sie alles
  rationale: Gibt die umfassende Fähigkeit knapp, würdig und im modernen Deutschen natürlich wieder.
- source_word: μένουσα ἐν αὐτῇ
  choice: während sie in sich selbst bleibt
  rationale: Versteht αὐτῇ im Kontext reflexiv und bewahrt den Kontrast zwischen ihrem unveränderten Bleiben und ihrem weltweiten Wirken.
- source_word: τὰ πάντα καινίζει
  choice: erneuert sie alles
  rationale: καινίζει kann sowohl „erneuern“ als auch „neu machen“ bedeuten; „erneuert“ ist prägnant und vermeidet eine unnötige Festlegung.
- source_word: κατὰ γενεὰς
  choice: von Generation zu Generation
  rationale: Bringt das wiederholte Wirken in aufeinanderfolgenden Generationen idiomatisch zum Ausdruck.
- source_word: εἰς ψυχὰς ὁσίας μεταβαίνουσα
  choice: geht sie in heilige Seelen ein
  rationale: Bewahrt sowohl die gerichtete Bewegung von μεταβαίνουσα als auch den ausdrücklichen anthropologischen Begriff ψυχάς.
- source_word: φίλους θεοῦ
  choice: Freunden Gottes
  rationale: Entspricht der Genitivverbindung direkt und erhält deren relationale Aussage.
- source_word: προφήτας
  choice: Propheten
  rationale: Die übliche und kontextgemäße Wiedergabe.
- source_word: κατασκευάζει
  choice: macht sie zu
  rationale: Im Zusammenhang bezeichnet das Verb das Hervorbringen beziehungsweise Formen der heiligen Seelen zu Freunden Gottes und Propheten; die prädikative Konstruktion macht diesen Bezug im Deutschen deutlich.
theological_decisions:
- issue: Weiblich personifizierte Weisheit
  choice: Durchgehend weibliche Pronomen verwenden
  alternative: „Weisheit“ wiederholen oder unpersönlich formulieren
  rationale: Die griechische Grammatik stellt die Weisheit klar als weibliche Einzahl dar. Die Wiedergabe erhält diese literarische und theologische Personifikation, ohne sie ontologisch weiter zu bestimmen.
- issue: Bedeutung von ψυχὰς ὁσίας
  choice: „heilige Seelen“ beibehalten
  alternative: „heilige Menschen“
  rationale: „Seelen“ gibt den ausdrücklich verwendeten griechischen Begriff wieder und bewahrt das anthropologische Profil des Textes; „Menschen“ wäre glättender, aber weniger genau.
- issue: Wirkung von κατασκευάζει auf die heiligen Seelen
  choice: „macht sie zu Freunden Gottes und zu Propheten“
  alternative: „bereitet Freunde Gottes und Propheten“
  rationale: 'Das ergänzte Pronomen verdeutlicht den im Griechischen aus dem Zusammenhang erschlossenen Objektbezug: Die heiligen Seelen werden zu Freunden Gottes und Propheten. Es fügt keine neue Personengruppe ein.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Hauptsätzen. Die feminine Personifikation, der Ausdruck „heilige Seelen“ und der spannungsreiche Gegensatz zwischen Bleiben und Wirken bleiben erhalten. Die Fußnoten stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
