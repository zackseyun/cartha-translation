base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/009.yaml
  text: Nor did I compare to her any precious stone[a], because all gold in her sight is a little sand[b], and silver will be regarded as clay before her.
translation:
  language: de
  text: Auch stellte ich ihr keinen Stein von unschätzbarem Wert gleich[a], denn alles Gold ist in ihren Augen nur ein wenig Sand[b], und Silber wird vor ihr wie Lehm gelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keinen unbezahlbaren Stein“. Der griechische Ausdruck bezeichnet einen Stein von nicht zu ermessendem Wert.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein wenig Sand“; gemeint ist, dass Gold verglichen mit der Weisheit nur verschwindend geringen Wert hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ ὡμοίωσα αὐτῇ
  choice: Auch stellte ich ihr … nicht gleich
  rationale: Gibt die fortführende Verneinung οὐδέ und den Vergleich mit Dativ natürlich wieder; das feminine Pronomen bewahrt die Personifikation der Weisheit.
- source_word: λίθον ἀτίμητον
  choice: einen Stein von unschätzbarem Wert
  rationale: ἀτίμητος bezeichnet hier nicht einen wertlosen, sondern einen nicht mit einem Preis zu bemessenden Stein. Die Formulierung hält den allgemeinen Begriff „Stein“ fest und gibt den hohen Wert eindeutig wieder.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung des vorangehenden Werturteils in würdigem, natürlichem Deutsch ein.
- source_word: ὁ πᾶς χρυσός
  choice: alles Gold
  rationale: Bewahrt den umfassenden, kollektiven Sinn der griechischen Wendung.
- source_word: ἐν ὄψει αὐτῆς
  choice: in ihren Augen
  rationale: Erhält das Bild der personifizierten Weisheit und entspricht zugleich natürlichem deutschen Sprachgebrauch.
- source_word: ψάμμος ὀλίγη
  choice: nur ein wenig Sand
  rationale: Bewahrt das konkrete Bild und die Mengenangabe; „nur“ verdeutlicht knapp die im Vergleich ausgesagte Geringfügigkeit.
- source_word: λογισθήσεται
  choice: wird … gelten
  rationale: Gibt das zukünftige passive Werturteil idiomatisch wieder, ohne den Aussagegehalt zu verstärken.
- source_word: πηλός
  choice: Lehm
  rationale: Ein direkter und im gehobenen Vergleich passender Ausdruck für formbare, gewöhnliche Erde.
- source_word: ἄργυρος ἐναντίον αὐτῆς
  choice: Silber wird vor ihr … gelten
  rationale: Bewahrt sowohl den Stoffnamen als auch die räumlich-personifizierende Vergleichsform des Griechischen.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Das feminine Pronomen „ihr/ihren“ wird beibehalten.
  alternative: „Weisheit“ wiederholen oder sie mit einem neutralisierenden Ausdruck wiedergeben.
  rationale: Die griechischen femininen Formen führen die Weisheit als weiblich personifizierte Gestalt fort. Diese literarische Form bleibt erhalten, ohne daraus weitergehende dogmatische Aussagen abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die konkreten Vergleichsbilder und die weibliche Personifikation der Weisheit bleiben erhalten; „gelten“ vermeidet unnötig altertümliches „gerechnet werden“.
