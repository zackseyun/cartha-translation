base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/024.yaml
  text: For wisdom is more mobile than any movement[b][a], and because of her purity she passes through and penetrates all things.
translation:
  language: de
  text: Denn die Weisheit[a] ist beweglicher als jede Bewegung[b]; wegen ihrer Reinheit durchdringt und durchzieht sie alles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Weisheit wird hier als weibliche Gestalt beschrieben; der Vers bestimmt damit nicht ausdrücklich, ob sie als eigenständiges Wesen zu verstehen ist.
    reason: theological_ambiguity
  - marker: b
    text: 'Auch möglich: „wirksamer als alle Bewegung“. Das griechische Vergleichswort betont vor allem die alles übertreffende Fähigkeit der Weisheit, sich zu bewegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης ... κινήσεως
  choice: als jede Bewegung
  rationale: Die umfassende Vergleichskonstruktion mit πάσης bleibt erhalten; κίνησις wird in seiner Grundbedeutung als „Bewegung“ wiedergegeben.
- source_word: κινητικώτερον
  choice: beweglicher
  rationale: Der Komparativ bezeichnet hier die überragende Fähigkeit zur Bewegung. „Beweglicher“ bewahrt die gemeinsame Wortwurzel mit κίνησις und vermeidet eine vorschnelle Deutung als geistige oder sittliche Aktivität.
- source_word: σοφία
  choice: die Weisheit
  rationale: Dies ist die übliche und kontextgemäße Wiedergabe; der Artikel und die nachfolgenden weiblichen Formen lassen die Personifikation im Deutschen natürlich hervortreten.
- source_word: διήκει
  choice: durchdringt
  rationale: Das Verb bezeichnet ein Hindurchreichen oder Hindurchgehen. „Durchdringt“ gibt diese räumliche Dynamik prägnant wieder.
- source_word: χωρεῖ
  choice: durchzieht
  rationale: „Durchzieht“ hält das zweite Bewegungsverb von διήκει unterscheidbar und vermittelt, dass die Weisheit sich durch alles hindurchbewegt.
- source_word: διὰ πάντων
  choice: alles
  rationale: Das substantivierte πάντων ist umfassend; „alles“ ist im Deutschen natürlich und bewahrt diese uneingeschränkte Reichweite.
- source_word: διὰ τὴν καθαρότητα
  choice: wegen ihrer Reinheit
  rationale: διά mit Akkusativ drückt den Grund aus. Das feminine Possessivpronomen entspricht der grammatischen und literarischen Personifikation der Weisheit.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Weibliche Bezugnahme durch „ihrer“ und „sie“, ohne „Weisheit“ als Eigennamen zu behandeln
  alternative: Unpersönliche Bezugnahme oder Großschreibung als Bezeichnung einer eigenständigen göttlichen Hypostase
  rationale: Das Griechische und der Zusammenhang personifizieren die Weisheit, legen in diesem Vers aber keine weitergehende ontologische Bestimmung fest. Die deutsche Grammatik bewahrt die Personifikation, ohne sie dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst markante Formulierung „beweglicher als jede Bewegung“ spiegelt das griechische Wortspiel zwischen κίνησις und κινητικώτερον. Das Verbpaar „durchdringt und durchzieht“ wahrt die zwei Bewegungsverben, ohne sie zu einem einzigen Begriff zusammenzuziehen.
