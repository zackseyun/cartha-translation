base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/010.yaml
  text: I loved her more than health and beauty[a], and I chose to have her rather than light, because the radiance that comes from her never sleeps.
translation:
  language: de
  text: Ich liebte sie mehr als Gesundheit und Schönheit und zog es vor, sie statt des Lichts zu haben, denn der Glanz, der von ihr ausgeht, schläft nie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn der von ihr ausgehende Glanz ist schlaflos.“ Das griechische Wort beschreibt den Glanz der Weisheit als unaufhörlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ὑγίειαν καὶ εὐμορφίαν
  choice: mehr als Gesundheit und Schönheit
  rationale: ὑπέρ bezeichnet hier vergleichend die höhere Wertschätzung der Weisheit; „mehr als“ ist im Deutschen natürlich und bewahrt den Vergleich.
- source_word: ἠγάπησα αὐτήν
  choice: Ich liebte sie
  rationale: Die direkte Wiedergabe erhält sowohl die persönliche Zuwendung als auch die feminine Personifikation der Weisheit.
- source_word: προειλόμην αὐτὴν ἀντὶ φωτὸς ἔχειν
  choice: zog es vor, sie statt des Lichtes zu besitzen
  rationale: Das Medium προειλόμην drückt eine bewusste Bevorzugung aus; ἀντί bezeichnet den Tausch beziehungsweise die Wahl anstelle des Lichtes. „Besitzen“ gibt ἔχειν in diesem Zusammenhang würdig und präzise wieder.
- source_word: ἀκοίμητον
  choice: schläft nie
  rationale: Das Adjektiv bedeutet wörtlich „schlaflos“. Die verbale Form bewahrt das lebendige Bild eines unaufhörlichen Glanzes.
- source_word: τὸ ἐκ ταύτης φέγγος
  choice: der Glanz, der von ihr ausgeht
  rationale: φέγγος bezeichnet Glanz oder Lichtschein; ἐκ ταύτης nennt die Weisheit als Ursprung. „Glanz“ vermeidet eine unnötige Wiederholung von „Licht“.
theological_decisions:
- issue: Feminine Personifikation der Weisheit
  choice: Weisheit wird mit „sie/ihr“ bezeichnet
  alternative: Sächliche Wiedergabe mit „es/ihm“
  rationale: Die griechischen femininen Formen stehen im Kontext einer ausgeprägten Personifikation. Die feminine Wiedergabe erhält die poetische und theologische Spannung, ohne die Weisheit darüber hinaus zu identifizieren.
- issue: Bild des schlaflosen Glanzes
  choice: Das wörtliche Bild „schläft nie“ bleibt erhalten
  alternative: Deutende Wiedergabe wie „erlischt nie“ oder „ist unvergänglich“
  rationale: ἀκοίμητον bedeutet unmittelbar „schlaflos“. Eine Deutung als „erlischt nie“ träfe den Sinn, würde aber das ungewöhnliche Bild des Ausgangstextes glätten.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Bildhaftigkeit. Die Satzstruktur bleibt nah am Griechischen, klingt jedoch idiomatisch deutsch; „zog es vor“ verdeutlicht die bewusste Bevorzugung.
