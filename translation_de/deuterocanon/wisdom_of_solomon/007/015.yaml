base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/015.yaml
  text: But may God grant me to speak with sound judgment and to think in a manner worthy of the things given[c][b][a], because he himself is both the guide of wisdom and the one who sets the wise right.
translation:
  language: de
  text: Mir aber möge Gott schenken, mit Einsicht zu reden[a] und angemessen über das Gegebene nachzudenken[b]. Denn er selbst leitet die Weisheit[c] und berichtigt die Weisen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach verständigem Urteil zu reden“. Die griechische Wendung bezeichnet ein Reden, das der Einsicht oder einem wohlüberlegten Urteil entspricht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „über das, was gegeben worden ist“ oder „über die gegebenen Gaben“. Im Griechischen bleibt offen, was genau gegeben wurde.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „weist den Weg zur Weisheit“. Die griechische Genitivverbindung kann auch in diesem Sinn verstanden werden.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: „ist der Berichtigende der Weisen“. Auch möglich: „leitet die Weisen richtig“. Das griechische Wort verbindet den Gedanken des Korrigierens mit dem des Geraderichtens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: möge … schenken
  rationale: Der Optativ drückt hier einen Wunsch beziehungsweise eine Bitte aus. „Möge … schenken“ gibt diesen Gebetscharakter in natürlichem Deutsch wieder.
- source_word: εἰπεῖν κατὰ γνώμην
  choice: mit Einsicht zu reden
  rationale: κατὰ γνώμην bezeichnet ein Reden, das sich nach verständigem Urteil oder Einsicht richtet. Die Formulierung ist knapp, verständlich und vermeidet die Verengung auf eine bloße persönliche Meinung.
- source_word: ἐνθυμηθῆναι
  choice: nachzudenken
  rationale: Das Verb bezeichnet inneres Erwägen oder Nachdenken. „Nachdenken“ gibt diesen reflektierenden Sinn genauer wieder als das allgemeinere „denken“.
- source_word: ἀξίως τῶν δεδομένων
  choice: so über das Gegebene nachzudenken, wie es ihm gebührt
  rationale: Die Formulierung bewahrt den Gedanken der Angemessenheit beziehungsweise Würdigkeit und lässt τῶν δεδομένων bewusst inhaltlich offen.
- source_word: τῶν δεδομένων
  choice: das Gegebene
  rationale: Das substantivierte Perfektpartizip bezeichnet allgemein das, was gegeben worden ist. „Das Gegebene“ wahrt diese Offenheit, ohne eigenmächtig „Gaben“ oder einen bestimmten Lehrinhalt einzusetzen.
- source_word: ὁδηγός
  choice: führt
  rationale: Das Nomen bezeichnet jemanden, der den Weg weist oder führt. Die verbale Wiedergabe ergibt zusammen mit dem folgenden Glied einen natürlichen deutschen Parallelismus und vermeidet das missverständliche oder belastete Substantiv „Führer“.
- source_word: διορθωτής
  choice: bringt … auf den rechten Weg
  rationale: Das Wort bezeichnet jemanden, der geraderichtet, berichtigt oder richtig leitet. Die Wendung erhält sowohl den korrigierenden als auch den leitenden Sinn in idiomatischem Deutsch.
- source_word: τῶν σοφῶν
  choice: die Weisen
  rationale: Der substantivierte Plural wird mit der geläufigen und knappen deutschen Bezeichnung „die Weisen“ wiedergegeben.
theological_decisions:
- issue: Bezug und Umfang von τῶν δεδομένων
  choice: Offene Bezeichnung „das Gegebene“, ohne den Inhalt näher festzulegen
  alternative: „die gegebenen Gaben“ oder „das, was gegeben worden ist“
  rationale: Der griechische Text bestimmt nicht ausdrücklich, worauf sich das Gegebene bezieht. Die Übersetzung wahrt diese Breite und legt weder einen bestimmten Gabenkatalog noch überlieferte Lehren als Referenten fest.
- issue: Verhältnis Gottes zur Weisheit in τῆς σοφίας ὁδηγός
  choice: „er selbst führt die Weisheit“
  alternative: „er selbst weist den Weg zur Weisheit“
  rationale: Der Genitiv kann als Beziehung zur Weisheit selbst verstanden werden; idiomatisch ist jedoch auch die Auffassung als Hinführung zur Weisheit möglich. Der Haupttext folgt der näher am griechischen Wortlaut liegenden Lesart, während die andere Möglichkeit in einer Fußnote sichtbar bleibt.
- issue: Aussage von διορθωτής über Gottes Verhältnis zu den Weisen
  choice: Gott bringt selbst die Weisen auf den rechten Weg
  alternative: Gott leitet, berichtigt oder korrigiert die Weisen
  rationale: Die Wiedergabe erhält die Spannung, dass auch Weise auf Gottes richtende und korrigierende Führung angewiesen bleiben, ohne daraus ausdrücklich eine strafende Zucht zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der eröffnende Optativ bleibt als Gebetswunsch hörbar. „Das Gegebene“ bewahrt die inhaltliche Offenheit des Griechischen. Im Schlusssatz werden die beiden griechischen Nominalprädikate verbal wiedergegeben, damit der Parallelismus im Deutschen natürlich und klar klingt; Fußnoten dokumentieren wesentliche Bedeutungsalternativen.
