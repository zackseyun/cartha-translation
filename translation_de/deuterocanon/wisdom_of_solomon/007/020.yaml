base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/020.yaml
  text: the natures of animals and the tempers of wild beasts[a], the violence of winds and the reasonings of men, the varieties of plants and the powers of roots.
translation:
  language: de
  text: die Wesensarten der Tiere und die Temperamente wilder Tiere, die Gewalt der Winde[a] und die Überlegungen der Menschen, die Unterschiede der Pflanzen und die Kräfte der Wurzeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Gewalt der Geister. Das griechische Wort πνευμάτων kann sowohl „Winde“ als auch „Geister“ bedeuten.'
    reason: lexikalische Mehrdeutigkeit
lexical_decisions:
- source_word: φύσεις ζῴων
  choice: Naturen der Tiere
  rationale: Bewahrt den philosophisch-naturkundlichen Sinn der natürlichen Beschaffenheiten; der Plural entspricht dem Griechischen.
- source_word: θυμοὺς θηρίων
  choice: Temperamente wilder Tiere
  rationale: θυμός bezeichnet hier die charakteristische Gemütsart oder das Temperament; θηρίον meint besonders das wilde Tier.
- source_word: πνευμάτων βίας
  choice: Gewalten der Winde
  rationale: Im naturkundlichen Zusammenhang ist πνεύματα am ehesten als Winde zu verstehen; der Plural „Gewalten“ erhält die kräftige Bedeutung von βίαι und die knappe Formulierung.
- source_word: διαλογισμοὺς ἀνθρώπων
  choice: Überlegungen der Menschen
  rationale: διαλογισμός bezeichnet Denkbewegungen, Erwägungen oder Überlegungen; „Menschen“ gibt den generischen Plural geschlechtsübergreifend wieder.
- source_word: διαφορὰς φυτῶν
  choice: Unterschiede der Pflanzen
  rationale: Gibt die unterscheidbaren Arten oder Merkmale der Pflanzen eng am griechischen Ausdruck wieder.
- source_word: δυνάμεις ῥιζῶν
  choice: Kräfte der Wurzeln
  rationale: Bewahrt den antiken Begriff ihrer wirksamen, wohl auch heilkundlichen Eigenschaften, ohne ihn auf Medizin zu verengen.
theological_decisions:
- issue: Mehrdeutigkeit von πνευμάτων βίας
  choice: Gewalten der Winde
  alternative: Gewalten der Geister
  rationale: πνεῦμα kann sowohl Wind als auch Geist bedeuten. Der Katalog von Naturkunde spricht eher für „Winde“, doch die mögliche geistbezogene Lesart wird in der Fußnote offengehalten.
translation_notes:
  register: Moderner, würdevoller Katalogstil. Die parallelen Nominalgruppen und die griechischen Plurale wurden soweit im Deutschen natürlich beibehalten.
