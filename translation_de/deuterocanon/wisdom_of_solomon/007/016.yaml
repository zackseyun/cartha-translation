  text: For in his hand are both we and our words, and all understanding and knowledge of crafts.
translation:
  language: de
  text: Denn in seiner Hand sind wir und unsere Worte, und auch alle Einsicht[a] und alles Wissen um handwerkliche Tätigkeiten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Klugheit“ beziehungsweise „alle praktische Weisheit“. Das griechische Wort bezeichnet verständige, praktisch ausgerichtete Einsicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „alles Fachwissen“ oder „alle Kenntnis der Künste und Gewerbe“. Gemeint ist Wissen, das mit fachkundiger praktischer Arbeit verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... χειρὶ αὐτοῦ
  choice: in seiner Hand
  rationale: Die bildhafte biblische Wendung bleibt erhalten und bezeichnet hier Abhängigkeit, Verfügungsgewalt und Fürsorge, ohne diese Aspekte im Haupttext festzulegen.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen wird schlicht wiedergegeben und wahrt die Gegenüberstellung von uns selbst und unseren Worten.
- source_word: οἱ λόγοι ἡμῶν
  choice: unsere Worte
  rationale: Die direkte, weite Wiedergabe kann sowohl einzelne Äußerungen als auch menschliches Reden insgesamt bezeichnen.
- source_word: πᾶσά τε φρόνησις
  choice: ebenso alle Einsicht
  rationale: φρόνησις bezeichnet verständige, praktisch ausgerichtete Einsicht; „Einsicht“ ist im heutigen Deutsch natürlich und bewahrt die Bedeutungsbreite besser als das enger oder altertümlicher wirkende „Klugheit“.
- source_word: ἐργατειῶν ἐπιστήμη
  choice: alles Wissen um handwerkliche Tätigkeiten
  rationale: ἐπιστήμη bezeichnet Wissen oder Sachkenntnis, während ἐργατειῶν auf praktische, fachkundige Arbeit zielt. Die Formulierung ist verständlich und vermeidet eine Einschränkung auf bloßes Kunsthandwerk.
theological_decisions:
- issue: Bezug von αὐτοῦ
  choice: „seiner“; der Bezug auf Gott bleibt aus dem Zusammenhang erschließbar
  alternative: „in Gottes Hand“
  rationale: Das Pronomen des griechischen Textes wird nicht durch den ausdrücklich genannten Gottesnamen ersetzt; so bleibt die Textgestalt gewahrt, ohne den kontextuell naheliegenden Bezug zu verändern.
- issue: Sinnbild „in seiner Hand“
  choice: Bildhafte Formulierung beibehalten
  alternative: „in seiner Macht“ oder „unter seiner Verfügung“
  rationale: Die wörtliche Bildsprache umfasst Macht, Abhängigkeit und Fürsorge und sollte nicht auf nur einen theologischen Aspekt verengt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem griechischen Gedankengang, ohne unnatürlich zu wirken. „Handwerkliche Tätigkeiten“ gibt den praktischen Charakter des seltenen Ausdrucks ἐργατειῶν wieder; die Fußnote hält die weiter reichenden Möglichkeiten „Künste“, „Gewerbe“ und „Fachwissen“ offen.
