  text: And I learned without deceit[a], and I share without envy; I do not hide her wealth.
translation:
  language: de
  text: Ohne Arglist habe ich gelernt, und ohne Missgunst gebe ich weiter[a]; ihren Reichtum verberge ich nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: großzügig. Das griechische Wort bezeichnet ein Weitergeben ohne Neid, Missgunst oder Geiz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδόλως
  choice: ohne Arglist
  rationale: Das Adverb bezeichnet ein Lernen ohne Täuschung oder Hinterlist. „Ohne Arglist“ bewahrt diese moralische Bedeutung knapp und verständlich.
- source_word: ἔμαθον
  choice: habe ich gelernt
  rationale: Der Aorist von μανθάνω wird als abgeschlossener Lernvorgang wiedergegeben und behält die autobiografische Ich-Form bei.
- source_word: ἀφθόνως
  choice: ohne Missgunst
  rationale: Das Adverb bezeichnet ein Weitergeben ohne Neid, Geiz oder widerwilliges Vorenthalten. „Ohne Missgunst“ bleibt dem griechischen Ausdruck nahe.
- source_word: μεταδίδωμι
  choice: gebe ich weiter
  rationale: Das Verb bedeutet, anderen Anteil zu geben oder etwas mitzuteilen. „Weitergeben“ klingt im modernen Deutschen natürlich und passt zur Vermittlung der Weisheit.
- source_word: πλοῦτον
  choice: Reichtum
  rationale: Die Grundbedeutung ist „Reichtum“; hier bezeichnet das Wort bildhaft die Fülle der Weisheit.
- source_word: αὐτῆς
  choice: ihren
  rationale: Das Pronomen bezieht sich auf die im Kontext personifizierte und grammatisch feminine Weisheit. Die feminine Form erhält diese Personifikation.
- source_word: ἀποκρύπτομαι
  choice: verberge ich nicht
  rationale: 'Die mediale Form hat hier aktiven Sinn: etwas verbergen oder geheim halten. Die gewählte Formulierung ist knapp und idiomatisch.'
theological_decisions:
- issue: Personifizierung der Weisheit im Pronomen αὐτῆς
  choice: Die feminine persönliche Bezugnahme wird mit „ihren Reichtum“ bewahrt.
  alternative: „dessen Reichtum“ oder eine unpersönliche Umschreibung
  rationale: Der griechische Text personifiziert die Weisheit. Die feminine Bezugnahme wahrt die literarische und theologische Spannung, ohne die Gestalt mit einer späteren dogmatischen Deutung gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur der beiden Adverbien wird durch „ohne Arglist“ und „ohne Missgunst“ erhalten; die personifizierte Weisheit bleibt durch „ihren“ erkennbar.
