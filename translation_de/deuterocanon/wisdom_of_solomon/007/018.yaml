lexical_decisions:
- source_word: ἀρχὴν
  choice: Anfang
  rationale: Mit τέλος und μεσότης bildet das Wort eine zeitliche Dreierfolge; daher ist die gewöhnliche Bedeutung »Anfang« passend.
- source_word: τέλος
  choice: Ende
  rationale: In der Reihe mit »Anfang« und »Mitte« bezeichnet τέλος hier am natürlichsten das Ende.
- source_word: μεσότητα
  choice: Mitte
  rationale: Die Wiedergabe wahrt die klare räumlich-zeitliche Dreierstruktur des Griechischen.
- source_word: χρόνων
  choice: der Zeiten
  rationale: Der Plural bleibt allgemein und bezeichnet Zeiträume oder zeitliche Abläufe, ohne sie näher festzulegen.
- source_word: τροπῶν
  choice: der Sonnenwenden
  rationale: Im kosmologisch-astronomischen Zusammenhang kann τροπαί die Wendepunkte des Sonnenlaufs, also die Sonnenwenden, bezeichnen; die mögliche allgemeinere Bedeutung wird in der Fußnote erhalten.
- source_word: ἀλλαγὰς
  choice: die Veränderungen
  rationale: Die direkte Wiedergabe bezeichnet Veränderungen beziehungsweise Wechsel und bewahrt die substantivische Listenform.
- source_word: μεταβολὰς
  choice: den Wechsel
  rationale: »Wechsel« unterscheidet μεταβολαί sprachlich von den zuvor genannten ἀλλαγαί, ohne einen stärkeren Bedeutungsunterschied vorzutäuschen.
- source_word: καιρῶν
  choice: der Zeitabschnitte
  rationale: καιροί bezeichnet hier bestimmte oder gegliederte Zeiten. »Zeitabschnitte« vermeidet eine unklare Wiederholung von χρόνοι und legt den Ausdruck nicht ausschließlich auf Jahreszeiten fest.
