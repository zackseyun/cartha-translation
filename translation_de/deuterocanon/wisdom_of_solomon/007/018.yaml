  source_fidelity: 'Die Grundstruktur entspricht dem Griechischen gut: ἀρχή, τέλος und μεσότης werden treffend als „Anfang, Ende und Mitte“ wiedergegeben. „Sonnenwenden“ ist für τροπαί im astronomischen Kontext eine gut begründete, wenn auch nicht zwingende Präzisierung; die Fußnote erhält die weitere Bedeutung. Bei μεταβολὰς καιρῶν sollte jedoch der griechische Plural deutlicher gewahrt und καιροί im kosmologisch-kalendarischen Zusammenhang natürlicher als „Jahreszeiten“ wiedergegeben werden.'
