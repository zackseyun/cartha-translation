base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/007.yaml
  text: Therefore I prayed[a], and understanding was given to me; I called upon God[b], and a spirit of wisdom came to me.
translation:
  language: de
  text: Darum betete ich, und Einsicht wurde mir gegeben; ich rief[a], und ein Geist der Weisheit[b] kam zu mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ich rief Gott an“ oder „ich flehte“. Im Griechischen wird nicht ausdrücklich gesagt, wen der Sprecher anrief.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „der Geist der Weisheit“. Die griechische Formulierung lässt offen, ob ein bestimmter Geist gemeint ist oder der Ausdruck allgemeiner zu verstehen ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den folgernden Rückbezug auf den vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: ηὐξάμην
  choice: betete ich
  rationale: Das Verb εὔχομαι bezeichnet hier ein Gebet; die schlichte deutsche Form ist idiomatisch und bedeutungsgetreu.
- source_word: φρόνησις
  choice: Einsicht
  rationale: Bewahrt den Sinn von verständiger, praktischer Erkenntnis und unterscheidet den Ausdruck von σοφία („Weisheit“) im zweiten Satzteil.
- source_word: ἐδόθη μοι
  choice: wurde mir gegeben
  rationale: Die Passivform betont, dass die Einsicht empfangen und nicht aus eigener Kraft erworben wurde.
- source_word: ἐπεκαλεσάμην
  choice: ich rief
  rationale: Die Wiedergabe wahrt den Anrufungscharakter, ohne das im Griechischen nicht ausdrücklich genannte Objekt „Gott“ in den Haupttext einzufügen.
- source_word: ἦλθέν μοι
  choice: kam zu mir
  rationale: Entspricht der Bewegungsangabe mit Dativ klar und ohne die stärkere Nebenbedeutung von „kam über mich“.
- source_word: πνεῦμα σοφίας
  choice: ein Geist der Weisheit
  rationale: Die artikellose griechische Wortgruppe wird im Deutschen natürlich wiedergegeben, ohne sie ausdrücklich als feststehenden Titel zu bestimmen oder auf eine bloße innere Haltung zu reduzieren.
theological_decisions:
- issue: Ob πνεῦμα σοφίας als bestimmter göttlicher Geist, als geistliche Gabe oder als innere Haltung zu verstehen ist
  choice: ein Geist der Weisheit
  alternative: der Geist der Weisheit; weiser Sinn
  rationale: Die Formulierung hält die geistlich-theologische Aussage offen. Sie legt weder einen formalen Geisttitel fest noch verengt sie πνεῦμα auf eine rein psychologische Disposition.
- issue: Ob beim Anrufen Gott ausdrücklich als Objekt genannt werden soll
  choice: ich rief
  alternative: ich rief Gott an; ich flehte
  rationale: Im Zusammenhang ist ein Anruf Gottes naheliegend, doch der griechische Satz nennt kein Objekt. Der Haupttext bewahrt diese Auslassung; die Fußnote nennt die sachlich mögliche Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, parallel gebauter Satzstruktur. „Einsicht“ und „Weisheit“ bleiben als verwandte, aber unterschiedliche Begriffe erkennbar; die im Griechischen vorhandenen Deutungsspielräume werden durch Fußnoten offengehalten.
