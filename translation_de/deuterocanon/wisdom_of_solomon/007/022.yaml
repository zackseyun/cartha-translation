base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/022.yaml
  text: For wisdom[a], the craftswoman of all things, taught me. For in her is an intelligent, holy, unique, manifold, subtle, agile, clear, undefiled, distinct[b], unharmed, loving-the-good, keen, unhindered, beneficent spirit,
translation:
  language: de
  text: Denn die Weisheit, die Meisterin aller Dinge, hat mich gelehrt. In ihr ist nämlich ein Geist, der verständig, heilig, einzigartig[a], vielgestaltig, fein, beweglich, klar, unbefleckt, deutlich, unversehrt[b], das Gute liebend, scharfsinnig, ungehindert und wohltätig ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einziggeboren“ beziehungsweise „einzig in seiner Art“. Hier legt der Zusammenhang für μονογενές die Bedeutung „einzigartig“ näher als eine Aussage über Abstammung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unschädlich“. Das griechische Wort kann sowohl „von Schaden unberührt“ als auch „keinen Schaden verursachend“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεχνῖτις
  choice: Werkmeisterin
  rationale: Das feminine Substantiv bezeichnet eine in Kunst oder Handwerk kundige Schaffende. „Werkmeisterin“ bewahrt sowohl den Gedanken kunstfertigen Wirkens als auch die weibliche Personifikation der Weisheit.
- source_word: ἐδίδαξέν
  choice: hat mich gelehrt
  rationale: Das deutsche Perfekt gibt den griechischen Aorist in heutiger Standardsprache natürlich wieder und wahrt die schlichte Aussage.
- source_word: πνεῦμα
  choice: Geist
  rationale: Im Zusammenhang bezeichnet das Wort eine geistige, verständige Wirklichkeit in der Weisheit, nicht wörtlich Atem oder Wind.
- source_word: νοερόν
  choice: verständig
  rationale: Die Wiedergabe bezeichnet geistiges Erfassen und ist zugleich natürlich und würdevoll.
- source_word: μονογενές
  choice: einzigartig
  rationale: Hier beschreibt das Wort den Geist in der Weisheit und keine ausdrücklich kindliche Beziehung; daher steht die Bedeutung „einzig in seiner Art“ im Vordergrund. Die traditionsreiche Alternative wird in der Fußnote erhalten.
- source_word: πολυμερές
  choice: vielgestaltig
  rationale: Das Wort bezeichnet etwas mit vielen Teilen, Seiten oder Ausprägungen; „vielgestaltig“ ist im Deutschen prägnant und verständlich.
- source_word: λεπτόν
  choice: fein
  rationale: Die Grundvorstellung ist Feinheit und subtile Durchdringung. „Fein“ hält diese Bedeutung offen, ohne sie einseitig zu psychologisieren.
- source_word: εὐκίνητον
  choice: beweglich
  rationale: Das Adjektiv bezeichnet leichte Beweglichkeit; die deutsche Form ist klar und vermeidet die vorwiegend körperliche Färbung von „wendig“.
- source_word: τρανόν
  choice: klar
  rationale: Das Wort drückt Klarheit und Deutlichkeit aus. „Klar“ ist die unmittelbarste deutsche Entsprechung.
- source_word: ἀμόλυντον
  choice: unbefleckt
  rationale: Die Wiedergabe bewahrt den Gedanken, von Verunreinigung oder Befleckung frei zu sein, einschließlich möglicher moralischer und kultischer Anklänge.
- source_word: σαφές
  choice: deutlich
  rationale: „Deutlich“ bewahrt die Nähe zu τρανόν, ohne beide griechischen Adjektive im Deutschen identisch wiederzugeben.
- source_word: ἀπήμαντον
  choice: unversehrt
  rationale: Das Adjektiv kann sowohl Freiheit von erlittenem Schaden als auch das Nicht-Schaden bezeichnen. „Unversehrt“ gibt die passive Nuance wieder; die aktive Möglichkeit wird in der Fußnote genannt.
- source_word: φιλάγαθον
  choice: das Gute liebend
  rationale: Die Formulierung bildet die Zusammensetzung transparent ab und wahrt, dass das Gute selbst Gegenstand der Liebe ist.
- source_word: ὀξύ
  choice: scharfsinnig
  rationale: Im geistigen Eigenschaftskatalog gibt „scharfsinnig“ die Schärfe und schnelle Auffassung natürlicher wieder als das bloße „scharf“.
- source_word: ἀκώλυτον
  choice: ungehindert
  rationale: Die Wiedergabe entspricht direkt dem Gedanken, nicht aufgehalten oder gehemmt zu werden.
- source_word: εὐεργετικόν
  choice: wohltätig
  rationale: Das Adjektiv bezeichnet eine Gutes wirkende, nützliche Kraft; „wohltätig“ ist knapp und dem würdevollen Register angemessen.
theological_decisions:
- issue: Bedeutung von μονογενές in der Beschreibung der Weisheit
  choice: einzigartig
  alternative: einziggeboren / einzig in seiner Art
  rationale: Das Wort modifiziert hier πνεῦμα innerhalb der personifizierten Weisheit und steht nicht ausdrücklich in einem Abstammungs- oder Kindschaftszusammenhang. Der Haupttext gibt daher die qualitative Bedeutung wieder, während die theologisch traditionsreiche Alternative in der Fußnote sichtbar bleibt.
- issue: Aktive oder passive Bedeutung von ἀπήμαντον
  choice: unversehrt
  alternative: unschädlich
  rationale: Beide Bedeutungsrichtungen sind lexikalisch möglich. Der Haupttext wahrt die passive Vorstellung, von Schaden unberührt zu sein, ohne die aktive Lesart auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weibliche Personifikation der Weisheit bleibt durch „Werkmeisterin“ ausdrücklich erhalten. Der lange griechische Eigenschaftskatalog wird als deutscher Relativsatz lesbar gestaltet, ohne einzelne Merkmale auszulassen oder ihre Spannung einzuebnen.
