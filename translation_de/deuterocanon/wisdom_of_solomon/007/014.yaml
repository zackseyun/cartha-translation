base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/014.yaml
  text: For it is an unfailing treasure for men; those who have made use of it gained friendship with God, having been commended through the gifts that come from instruction.
translation:
  language: de
  text: Denn sie ist für die Menschen ein unerschöpflicher Schatz; wer von ihr Gebrauch macht, erwirbt sich Freundschaft mit Gott, durch die Gaben der Unterweisung empfohlen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Schlussteil ist knapp und nicht ganz eindeutig. Das Verb kann hier „sich erwerben“ oder „erlangen“ bedeuten; die Wendung „durch die Gaben der Unterweisung empfohlen“ kann auch im Sinn von „durch sie als bewährt ausgewiesen“ verstanden werden.
    reason: Erläutert die semantische und syntaktische Dichte von ἐστείλαντο und συσταθέντες, ohne eine Auslegung festzulegen.
lexical_decisions:
- source_word: ἀνεκλιπὴς θησαυρός
  choice: unerschöpflicher Schatz
  rationale: Gibt die Vorstellung eines Schatzes wieder, der nicht ausgeht und nicht versiegt.
- source_word: οἱ χρησάμενοι
  choice: wer sie nutzt
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die von der Weisheit Gebrauch machen; die singularische deutsche Konstruktion ist natürlich und inklusiv.
- source_word: πρὸς θεὸν ... φιλίαν
  choice: die Freundschaft Gottes
  rationale: Natürliches Deutsch für die auf Gott bezogene Freundschaft, ohne die Beziehung näher einseitig festzulegen.
- source_word: ἐστείλαντο
  choice: gewinnt
  rationale: Der seltene und textlich schwierige Ausdruck wird im Zusammenhang als Erlangen bzw. Gewinnen der Freundschaft verstanden.
- source_word: παιδείας
  choice: Unterweisung
  rationale: Bewahrt hier den Bildungs- und Erziehungsaspekt des griechischen Wortes, ohne es auf bloße Züchtigung zu verengen.
- source_word: συσταθέντες
  choice: wird ... empfohlen
  rationale: Entspricht dem Sinn von als bewährt ausgewiesen bzw. anerkennend empfohlen werden.
theological_decisions:
- issue: Verhältnis von Weisheitsgebrauch und Gottesfreundschaft
  choice: gewinnt die Freundschaft Gottes
  alternative: gelangt zur Freundschaft mit Gott
  rationale: Die Formulierung wahrt die im Satz ausgesagte Verbindung, ohne ein ausgearbeitetes Verdienstschema hinzuzufügen.
- issue: Agens der Empfehlung
  choice: Passivform ohne ausdrücklich genanntes Agens
  alternative: von den Gaben empfohlen
  rationale: Auch der griechische Text nennt nicht ausdrücklich, wer empfiehlt; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das feminine Pronomen »sie« nimmt die Weisheit aus dem Zusammenhang auf. Kurze Hauptsätze sorgen für Verständlichkeit; die Fußnote weist transparent auf die schwierige griechische Formulierung hin.
