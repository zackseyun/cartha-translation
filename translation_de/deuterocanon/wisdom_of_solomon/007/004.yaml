  text: In Windeln wurde ich aufgezogen und mit Fürsorge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Sorge“ oder „unter ängstlicher Sorge“. Das griechische Wort kann Fürsorge, Besorgnis oder aufmerksame Sorge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν σπαργάνοις
  choice: in Windeln
  rationale: σπάργανα bezeichnet die Tücher oder Binden, in die ein Säugling gewickelt wurde. „In Windeln“ gibt das Bild in natürlichem, modernem Deutsch knapp wieder.
- source_word: ἀνετράφην
  choice: wurde ich aufgezogen
  rationale: Der passive Aorist bezeichnet hier das Ernährt- und Großgezogenwerden in der frühen Kindheit. „wurde … aufgezogen“ wahrt Passiv und Aussageperspektive des Griechischen.
- source_word: ἐν φροντίσιν
  choice: unter Sorgen
  rationale: φροντίς kann Fürsorge, Sorge, Besorgnis oder ängstliche Aufmerksamkeit bezeichnen. „unter Sorgen“ bewahrt die Kürze sowie die mögliche belastende Nuance, ohne eindeutig festzulegen, ob die Sorgen den Pflegenden gelten oder allgemein die Bedingungen menschlicher Kindheit bezeichnen.
theological_decisions:
- issue: Bedeutung von φροντίσιν im Zusammenhang der Säuglingszeit
  choice: unter Sorgen
  alternative: unter fürsorglicher Obhut / unter ängstlicher Sorge
  rationale: Die Aussage betont die gewöhnliche menschliche Kindheit und Abhängigkeit des Sprechers. Die Übersetzung lässt offen, ob vor allem fürsorgliche Zuwendung oder besorgte Mühe gemeint ist, und löst die Spannung nicht durch einen erklärenden Zusatz auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Satzbau des Griechischen bleibt erhalten; „Windeln“ ist verständlicher und natürlicher als das historisierende „Wickelbänder“.
