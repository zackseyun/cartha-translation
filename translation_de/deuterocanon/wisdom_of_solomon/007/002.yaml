    reason: lexical_alternative
lexical_decisions:
- source_word: δεκαμηνιαίῳ χρόνῳ
  choice: in einem Zeitraum von zehn Monaten
  rationale: Die Dativverbindung bezeichnet den Zeitraum der Schwangerschaft. Die Wiedergabe ist im Deutschen natürlich und bewahrt die antike Zählweise.
- source_word: παγεὶς
  choice: geformt
  rationale: Das Partizip von πήγνυμι kann ein Festwerden, Gerinnen oder Formen bezeichnen. „Geformt“ gibt im embryologischen Zusammenhang den Sinn verständlich wieder, ohne die mögliche konkretere Vorstellung zu verschweigen; diese steht in der Fußnote.
- source_word: ἐν αἵματι
  choice: im Blut
  rationale: Die konkrete Präposition und die körperliche Bildsprache des griechischen Textes werden unmittelbar bewahrt.
- source_word: ἐκ σπέρματος ἀνδρὸς
  choice: aus dem Samen eines Mannes
  rationale: σπέρμα bezeichnet hier den Zeugungssamen. „Samen“ ist würdig, verständlich und weniger medizinisch als „Sperma“.
- source_word: ἡδονῆς ὕπνῳ συνελθούσης
  choice: aus der Lust, die mit dem Beischlaf einherging
  rationale: Die Genitivfügung verbindet die Lust mit dem Schlaf beziehungsweise Lager als zurückhaltender Umschreibung der geschlechtlichen Vereinigung. „Beischlaf“ bewahrt diese verhüllende Ausdrucksweise im Deutschen besser als eine ausdrückliche Benennung des Geschlechtsverkehrs.
theological_decisions:
- issue: Betonung der gewöhnlichen menschlichen Zeugung und Entwicklung
  choice: Der Vers beschreibt Empfängnis und Schwangerschaft in der antiken, zurückhaltenden Ausdrucksweise des Textes.
  alternative: Eine stärker physiologische Wiedergabe mit „im Blut geronnen“ oder eine ausdrückliche Benennung des Geschlechtsverkehrs.
  rationale: Im Zusammenhang betont der Sprecher seine gemeinsame menschliche Herkunft. Die Übersetzung wahrt diesen Akzent, ohne moderne biologische Präzision oder spätere anthropologische Lehrbegriffe einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung des vorangehenden Verses kleingeschrieben. „Beischlaf“ ist hier bewusst als verständliche, zurückhaltende Wiedergabe des griechischen Euphemismus gewählt.
