translation:
  language: de
  text: in einem Zeitraum von zehn Monaten[a], im Blut geformt[b] aus dem Samen eines Mannes und aus der Lust, die sich mit Schlaf verband[c].
  philosophy: optimal-equivalence
  footnotes:
