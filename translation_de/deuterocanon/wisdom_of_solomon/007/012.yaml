  text: And I rejoiced in them all, because wisdom leads them; but I did not know that she is their mother.
translation:
  language: de
  text: Ich freute mich über all das, weil die Weisheit es leitet; doch ich wusste nicht, dass sie dessen Ursprung ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, personifizierend: »dass sie dessen Mutter ist«. Das griechische Wort kann Entstehung, Ursprung oder Hervorbringung bedeuten.'
    reason: γένεσις wird im Haupttext breit und quellentreu als »Ursprung« wiedergegeben; die kontextuell mögliche bildhafte Deutung als »Mutter« bleibt transparent als Alternative vermerkt.
lexical_decisions:
- source_word: εὐφράνθην
  choice: Ich freute mich
  rationale: Gibt den Aorist natürlich und unmittelbar wieder.
- source_word: ἐπὶ πάντων
  choice: über sie alle
  rationale: Bezieht sich im Zusammenhang auf die zuvor genannten Güter und bewahrt den pronominalen Rückbezug.
- source_word: ἡγεῖται
  choice: führt sie an
  rationale: Bewahrt die Vorstellung, dass die Weisheit diesen Gütern vorangeht beziehungsweise sie anführt.
- source_word: γένεσιν
  choice: Mutter
  rationale: Der griechische Ausdruck bezeichnet hier Ursprung oder Hervorbringung; »Mutter« gibt die personifizierende Aussage prägnant wieder, ist aber enger als der mögliche Sinnumfang.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: weibliche Pronomen und »Mutter«
  alternative: »dass sie der Ursprung von ihnen ist«
  rationale: Das grammatisch feminine σοφία wird als handelnde und hervorbringende Größe personifiziert. Die bildhafte Wiedergabe wird beibehalten, während die Fußnote die lexikalische Breite von γένεσις kenntlich macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzspannung zwischen Freude an den Gütern und der zunächst unerkannten Herkunft aus der Weisheit bleibt erhalten.
