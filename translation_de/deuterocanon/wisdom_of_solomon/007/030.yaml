lexical_decisions:
- source_word: τοῦτο
  choice: dieses
  rationale: Das substantivisch gebrauchte Neutrum bewahrt den im Griechischen unausgesprochenen Rückbezug auf das Licht des vorigen Verses.
- source_word: διαδέχεται
  choice: wird … abgelöst
  rationale: Das Verb bezeichnet, dass etwas auf etwas anderes folgt und dessen Stelle einnimmt; die Passivform gibt die griechische Objektbeziehung im Deutschen natürlich wieder.
- source_word: νύξ
  choice: Nacht
  rationale: Direkte Entsprechung, die den Gegensatz zum Licht des vorigen Verses aufnimmt.
- source_word: σοφίας
  choice: gegen die Weisheit
  rationale: Der Genitiv bezeichnet bei ἀντισχύει, wem gegenüber sich etwas als stark zu erweisen versucht.
- source_word: οὐκ ἀντισχύει
  choice: kommt … nicht an
  rationale: Die geläufige deutsche Wendung gibt das erfolglose Widerstehen beziehungsweise Nicht-Obsiegen prägnant wieder.
- source_word: κακία
  choice: das Böse
  rationale: Die substantivierte Form bezeichnet moralische Schlechtigkeit allgemein und wahrt den umfassenden Gegensatz zur Weisheit.
theological_decisions:
- issue: Unausgesprochener Bezug von τοῦτο
  choice: Das Demonstrativpronomen bleibt als „dieses“ stehen.
  alternative: „Das Licht wird zwar von der Nacht abgelöst“
  rationale: Der Rückbezug auf das Licht ist im Zusammenhang klar, doch der griechische Text wiederholt das Wort „Licht“ nicht. Die Übersetzung bewahrt diese implizite Ausdrucksweise.
- issue: Aussagekraft von οὐκ ἀντισχύει
  choice: „kommt … nicht an“
  alternative: „kann … nicht widerstehen“ oder „obsiegt nicht über“
  rationale: Die Formulierung bewahrt das Bild einer Auseinandersetzung, ohne ausdrücklich modale Unmöglichkeit in das Verb einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion „zwar … doch“ bildet den griechischen Gegensatz μὲν … δὲ ab; „gegen … nicht ankommen“ ist gegenwärtig und allgemein verständlich, ohne umgangssprachlich zu wirken.
