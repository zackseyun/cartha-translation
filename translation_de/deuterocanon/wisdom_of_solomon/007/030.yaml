  text: For this is succeeded by night[b][a], but evil does not prevail against wisdom.
translation:
  language: de
  text: Denn dieses[a] wird zwar von der Nacht abgelöst, doch das Böse setzt sich gegen die Weisheit nicht durch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
