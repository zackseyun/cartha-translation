  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/017.yaml
  text: For he himself gave me unerring knowledge of the things that exist[a], to know the structure of the world and the activity of the elements[c][b],
translation:
  language: de
  text: Denn er selbst gab mir untrügliche Erkenntnis von dem, was ist[a], den Aufbau der Welt[b] und das Wirken der Elemente[c] zu erkennen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wahre Erkenntnis von dem, was existiert“; wörtlich auch: „nicht falsche Erkenntnis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Beschaffenheit der Welt“ beziehungsweise „die Ordnung des Universums“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind die grundlegenden Bestandteile der körperlichen Welt.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das betonte Pronomen wird ausdrücklich wiedergegeben; aus dem Zusammenhang ist Gott der Geber, ohne dass sein Name in den Text eingesetzt wird.
- source_word: ἔδωκεν
  choice: gab
  rationale: Die schlichte Vergangenheitsform entspricht dem griechischen Verb, ohne den Ausdruck unnötig zu erhöhen.
- source_word: τῶν ὄντων
  choice: von dem, was ist
  rationale: Die Formulierung bewahrt den weiten ontologischen Sinn und bleibt zugleich in modernem Deutsch verständlich.
- source_word: γνῶσιν ἀψευδῆ
  choice: untrügliche Erkenntnis
  rationale: ἀψευδής bezeichnet eine Erkenntnis, die nicht falsch ist und nicht täuscht; „untrüglich“ wahrt diese Aussage, ohne den stärker dogmatisch besetzten Ausdruck „unfehlbar“ zu verwenden.
- source_word: εἰδέναι
  choice: zu erkennen
  rationale: Der Infinitiv entfaltet Inhalt beziehungsweise Umfang der geschenkten Erkenntnis.
- source_word: σύστασιν κόσμου
  choice: den Aufbau der Welt
  rationale: σύστασις kann Aufbau, Zusammensetzung oder Ordnung bezeichnen; „Aufbau“ ist klar und passt zum kosmologischen Zusammenhang.
- source_word: ἐνέργειαν στοιχείων
  choice: das Wirken der Elemente
  rationale: „Wirken“ gibt die Tätigkeit oder Wirkungsweise der Elemente wieder, ohne die stärker deutende Vorstellung moderner physikalischer „Kräfte“ einzutragen.
- source_word: στοιχείων
  choice: Elemente
  rationale: Im kosmologischen Zusammenhang sind die grundlegenden Bestandteile der körperlichen Welt gemeint; „Elemente“ ist die etablierte, offene Wiedergabe.
theological_decisions:
- issue: Bezug des betonten Subjekts αὐτὸς
  choice: Das Pronomen „er selbst“ bleibt stehen; Gott ist aus dem Zusammenhang als Geber erkennbar.
  alternative: Den Gottesnamen ausdrücklich in den Vers einsetzen.
  rationale: Der Kontext legt Gott als Bezug nahe, doch die Übersetzung wahrt die pronominale Form des griechischen Textes und macht das Implizite nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „von dem, was ist“ erhält den philosophischen Klang des griechischen Ausdrucks, bleibt aber allgemein verständlich. Das abschließende Komma entspricht dem fortlaufenden Satz des Quelltexts.
