base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/011.yaml
  text: But all good things came to me together with her[a], and in her hands was wealth beyond counting[b];
translation:
  language: de
  text: Doch zugleich mit ihr[a] kamen alle guten Dinge zu mir, und unermesslicher Reichtum war in ihren Händen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Weisheit, die im Zusammenhang als Frau personifiziert wird.
    reason: cross_reference
  - marker: b
    text: 'Wörtlicher: »nicht zählbarer Reichtum«; auch: »zahllose Reichtümer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: kamen
  rationale: Der griechische Aorist von ἔρχομαι bezeichnet hier idiomatisch, dass die guten Dinge zum Sprecher kamen. Der deutsche Plural richtet sich nach dem Subjekt »alle guten Dinge«.
- source_word: τὰ ἀγαθὰ
  choice: alle guten Dinge
  rationale: Der substantivierte neutrale Plural ist weit gefasst und schließt materielle wie nichtmaterielle Güter ein; »gute Dinge« bewahrt diese Offenheit.
- source_word: ὁμοῦ πάντα
  choice: zugleich … alle
  rationale: »Zugleich« gibt ὁμοῦ als gemeinsames bzw. gleichzeitiges Kommen wieder, während »alle« die Totalität von πάντα ausdrückt.
- source_word: μετ’ αὐτῆς
  choice: mit ihr
  rationale: Das feminine Pronomen verweist im Kontext auf die personifizierte Weisheit. Die knappe Formulierung ist natürlich und bewahrt die Personifikation.
- source_word: ἀναρίθμητος πλοῦτος
  choice: unermesslicher Reichtum
  rationale: ἀναρίθμητος bezeichnet etwas nicht Zählbares bzw. zahlenmäßig nicht Fassbares. »Unermesslicher Reichtum« gibt die hyperbolische Aussage würdig und idiomatisch wieder; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: ἐν ταῖς χερσὶν αὐτῆς
  choice: war in ihren Händen
  rationale: Die räumliche Metapher des Griechischen bleibt erhalten und kann sowohl Besitz als auch das von der Weisheit Mitgebrachte ausdrücken.
theological_decisions:
- issue: Bezug des femininen Pronomens αὐτῆς
  choice: Das Pronomen wird mit »ihr/ihren« wiedergegeben und auf die personifizierte Weisheit bezogen.
  alternative: Ein nicht näher bestimmter femininer Bezug wäre grammatisch denkbar, ist im unmittelbaren Kontext jedoch unwahrscheinlich.
  rationale: Weisheit wird in Weisheit 7 als weibliche Gestalt personifiziert. Die Übersetzung erhält diese literarisch-theologische Darstellung, ohne sie im Haupttext weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt dem griechischen Gedankengang nahe, klingt aber natürlich. »Doch« nimmt den adversativen Anschluss von δέ auf; »zugleich« bewahrt den Akzent von ὁμοῦ.
