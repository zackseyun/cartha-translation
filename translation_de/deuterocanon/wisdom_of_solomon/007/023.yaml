lexical_decisions:
- source_word: φιλάνθρωπον
  choice: menschenfreundlich
  rationale: Das Adjektiv bezeichnet Liebe zu den Menschen beziehungsweise ihnen zugewandte Güte. „Menschenfreundlich“ ist im Deutschen transparent und wahrt den personalen Bezug.
- source_word: βέβαιον
  choice: zuverlässig
  rationale: In der Reihe bezeichnet das Wort Festigkeit und Verlässlichkeit; „zuverlässig“ ist natürlich und vermeidet einen rein körperlichen Sinn.
- source_word: ἀσφαλές
  choice: sicher
  rationale: Das Wort bezeichnet Sicherheit beziehungsweise Ungefährdetheit. „Sicher“ bleibt knapp und unterscheidet sich hinreichend von βέβαιον.
- source_word: ἀμέριμνον
  choice: sorgenfrei
  rationale: Gemeint ist Freiheit von Sorge oder Unruhe. „Sorgenfrei“ ist verständlich und in diesem würdevollen Kontext nicht flapsig.
- source_word: παντοδύναμον
  choice: allmächtig
  rationale: Das Kompositum bezeichnet umfassende Macht. „Allmächtig“ ist die natürliche, knappe deutsche Entsprechung und hier als Eigenschaft der Weisheit unmittelbar verständlich.
- source_word: πανεπίσκοπον
  choice: alles überblickend
  rationale: Die Bildung bezeichnet das umfassende Sehen, Beobachten oder Beaufsichtigen. „Alles überblickend“ bewahrt den aktiven verbalen Gehalt, ohne das Wort auf bloßes Sehen zu verengen.
- source_word: διὰ πάντων χωροῦν
  choice: alle … durchdringend
  rationale: χωρεῖν mit διά kann ein Hindurchgehen oder Durchdringen ausdrücken. „Durchdringend“ gibt die permeative Bewegung im Deutschen natürlich wieder.
- source_word: πνευμάτων
  choice: Geister
  rationale: Im Kontext sind geistige Wesen oder Geister gemeint; „Geister“ entspricht dem griechischen Ausdruck knapp und wahrt dessen Offenheit.
- source_word: νοερῶν
  choice: vernunftbegabten
  rationale: Das Adjektiv bezieht sich auf Geist, Denken und Einsicht. „Vernunftbegabt“ ist präziser als das im Deutschen leicht wertende „intelligent“.
- source_word: καθαρῶν
  choice: reinen
  rationale: „Rein“ ist die direkte und kontextgemäße Wiedergabe innerhalb der gehobenen Eigenschaftsreihe.
- source_word: λεπτοτάτων
  choice: feinstofflichen
  rationale: Der Superlativ bezeichnet äußerste Feinheit oder Subtilität. „Feinstofflich“ macht die Beschaffenheit der Geister anschaulich; die mögliche Wiedergabe „feinsten“ wird in der Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe von παντοδύναμον mit einem traditionellen theologischen Begriff
  choice: allmächtig
  alternative: allgewaltig / mit aller Macht ausgestattet
  rationale: Anders als englisches „almighty“ ist „allmächtig“ im modernen Deutschen die unmittelbar verständliche Standardentsprechung des griechischen Kompositums. Der Kontext bezieht die Aussage grammatisch auf die Weisheit; das wird nicht abgeschwächt.
- issue: Syntaktische und semantische Deutung von διὰ πάντων χωροῦν πνευμάτων νοερῶν καθαρῶν λεπτοτάτων
  choice: alle vernunftbegabten, reinen, feinstofflichen Geister durchdringend
  alternative: durch alle vernunftbegabten, reinen, feinsten Geister hindurchgehend
  rationale: Die gewählte Fassung gibt die natürliche Verbindung des Partizips mit dem Genitiv nach διά wieder und bewahrt die Vorstellung des Hindurchgehens beziehungsweise Durchdringens, ohne die Art dieses Vorgangs näher festzulegen.
translation_notes:
  register: Moderne, würdige Eigenschaftsreihe mit knapper Parallelstruktur. Der Vers setzt einen vorangehenden Satz fort; deshalb beginnt die Fassung kleingeschrieben. Die drei Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Übersetzungsentscheidung.
