  text: For no king had a different beginning of birth[a].
translation:
  language: de
  text: Denn kein König hatte einen anderen Ursprung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn kein König hatte einen anderen Anfang seiner Entstehung.« Das griechische Wort γένεσις kann »Entstehung«, »Geburt« oder »Ursprung« bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς … βασιλέων
  choice: kein König
  rationale: Die griechische Verbindung bedeutet wörtlich »keiner von den Königen«; »kein König« gibt die umfassende Verneinung im Deutschen natürlich und präzise wieder.
- source_word: γὰρ
  choice: denn
  rationale: »Denn« bewahrt den begründenden Zusammenhang mit der Aussage über die allen Menschen gemeinsame Herkunft.
- source_word: ἑτέραν
  choice: anderen
  rationale: Das Wort bezeichnet hier einen anderen beziehungsweise andersartigen Anfang und verneint damit eine besondere Herkunft von Königen.
- source_word: ἔσχεν
  choice: hatte
  rationale: Das einfache Präteritum entspricht dem Aorist und ist in dieser Aussage idiomatischer als »besaß« oder »empfing«.
- source_word: γενέσεως ἀρχήν
  choice: Anfang des Lebens
  rationale: Die Verbindung bezeichnet den Beginn der Entstehung beziehungsweise Geburt. »Anfang des Lebens« ist in modernem Deutsch natürlich, bewahrt aber den Gedanken eines allen gemeinsamen Ausgangspunkts; die engere Wiedergabe mit »Geburt« wird in der Fußnote genannt.
theological_decisions:
- issue: Anthropologische Gleichheit von Königen und anderen Menschen
  choice: Die Formulierung verneint einen besonderen Lebensanfang für Könige.
  alternative: Denn kein König hatte einen anderen Ursprung.
  rationale: Der unmittelbare Zusammenhang betont die gemeinsame menschliche Herkunft und Lebensbedingung. Die Übersetzung erhält diese einebnende Aussage, ohne sie zu einer weitergehenden Lehrformel auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Anfang des Lebens« vermeidet die im Deutschen missverständliche Wendung »Anfang der Geburt«, während die Fußnote die formnähere und lexikalisch engere Möglichkeit dokumentiert.
