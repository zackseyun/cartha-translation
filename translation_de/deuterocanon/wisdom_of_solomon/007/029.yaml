base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/029.yaml
  text: For she is more beautiful than the sun, and above every arrangement of the stars. Compared with the light, she is found to be earlier.
translation:
  language: de
  text: Denn sie ist schöner als die Sonne und steht über jeder Anordnung der Sterne. Mit dem Licht verglichen, erweist sie sich als die Frühere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: als die Vorrangige; das griechische Wort kann zeitlichen Vorrang oder höheren Rang bezeichnen.'
    reason: Bewahrt die echte Bedeutungsbreite von προτέρα, ohne die im Haupttext gewählte zeitliche Lesart zu verwischen.
lexical_decisions:
- source_word: εὐπρεπεστέρα
  choice: schöner
  rationale: Der Komparativ bezeichnet hier die größere Schönheit beziehungsweise herrliche Erscheinung der Weisheit; „schöner“ ist natürlich und bewahrt den Bildvergleich.
- source_word: ὑπὲρ πᾶσαν ἄστρων θέσιν
  choice: steht über jeder Anordnung der Sterne
  rationale: θέσις meint Stellung oder Anordnung. Die Wiedergabe bleibt näher am griechischen Ausdruck als das enger deutende „Sternbild“ und ergänzt nur das im Griechischen sinngemäß mitgehörte Prädikat.
- source_word: προτέρα
  choice: die Frühere
  rationale: Der Komparativ von πρότερος kann zeitlichen Vorrang ausdrücken. Die substantivierte Formulierung gibt die feminine Beziehung auf die Weisheit wieder und bewahrt die auffällige Aussage, dass sie im Vergleich mit dem Licht früher ist.
theological_decisions:
- issue: Bedeutung von προτέρα im Vergleich mit dem Licht
  choice: die Frühere
  alternative: die Vorrangige / überlegen
  rationale: Die zeitliche Lesart ist lexikalisch direkt möglich und entspricht der adjudizierten Fassung. Weil das Wort je nach Zusammenhang auch Vorrang oder Überlegenheit bezeichnen kann, wird diese Spannung nicht im Haupttext aufgelöst, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Parallelismus; „Anordnung der Sterne“ vermeidet eine unnötige Festlegung auf Sternbilder, und „die Frühere“ erhält die personifizierte Weisheit als feminines Bezugswort.
