  text: He will take his zeal as full armor[a], and he will arm creation for defense against enemies[b];
translation:
  language: de
  text: Er wird seinen Eifer als vollständige Rüstung anlegen[a] und die Schöpfung zur Abwehr von Feinden bewaffnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Eifersucht“. Das griechische Wort ζῆλος kann je nach Zusammenhang beides bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Schöpfung zu Waffen machen“ oder „die Schöpfung mit Waffen ausrüsten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λήμψεται
  choice: wird … anlegen
  rationale: Das Futur Medium von λαμβάνω bedeutet wörtlich „wird nehmen“. In Verbindung mit einer Rüstung gibt „anlegen“ das kriegerische Bild im Deutschen natürlich wieder.
- source_word: πανοπλίαν
  choice: vollständige Rüstung
  rationale: πανοπλία bezeichnet die gesamte Ausrüstung eines schwer bewaffneten Kämpfers. „Vollständige Rüstung“ bewahrt diesen umfassenden Sinn und ist allgemein verständlich.
- source_word: τὸν ζῆλον αὐτοῦ
  choice: seinen Eifer
  rationale: ζῆλος kann Eifer, leidenschaftlichen Einsatz oder Eifersucht bezeichnen. „Eifer“ passt zum Bild des zum Kampf entschlossenen Gottes, ohne die mögliche emotionale Bedeutung unnötig zu verengen.
- source_word: ὁπλοποιήσει
  choice: wird … bewaffnen
  rationale: Das Verb bezeichnet das Herstellen oder Bereitstellen von Waffen. „Bewaffnen“ drückt das Ergebnis im Deutschen knapp und idiomatisch aus; die wörtlichere Nuance wird in einer Fußnote bewahrt.
- source_word: τὴν κτίσιν
  choice: die Schöpfung
  rationale: κτίσις bezeichnet hier die geschaffene Welt, die Gott in seinen Dienst nimmt. „Schöpfung“ wahrt die kosmische Weite des Ausdrucks.
- source_word: εἰς ἄμυναν ἐχθρῶν
  choice: zur Abwehr von Feinden
  rationale: ἄμυνα bezeichnet Abwehr oder Verteidigung. Die Formulierung bleibt nahe am Griechischen und fügt kein dort fehlendes Possessivpronomen zu „Feinden“ hinzu.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts
  choice: Das männliche Singularsubjekt wird mit „Er“ wiedergegeben und im Kontext auf Gott bezogen.
  alternative: Eine abstraktere Personifikation der göttlichen Gerechtigkeit.
  rationale: Der unmittelbare Zusammenhang schildert den Herrn als göttlichen Krieger. „Er“ bewahrt die grammatische Form, ohne den Vers durch eine zusätzliche Gottesbezeichnung stärker festzulegen als der griechische Wortlaut.
- issue: Bedeutung von ζῆλος im Bild vom göttlichen Krieger
  choice: Gottes Eifer wird bildhaft als Rüstung dargestellt.
  alternative: Gottes Eifersucht als Rüstung.
  rationale: Der Vers verwendet eine poetische Kampfmetapher und keine systematische Lehrformel. „Eifer“ wahrt das Bild und lässt die weitere Bedeutungsmöglichkeit in der Fußnote erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Als vollständige Rüstung anlegen“ gibt das militärische Bild natürlicher wieder als das wörtliche „als vollständige Rüstung nehmen“. Die Satzstruktur bleibt knapp und parallel zum griechischen Ausgangstext.
