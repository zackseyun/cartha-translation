  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/020.yaml
  text: He will sharpen severe wrath into a sword[a], and the world will join battle with him against the senseless.
translation:
  language: de
  text: Er wird den grimmigen Zorn zu einem Schwert schärfen, und die Welt wird mit ihm gegen die Unvernünftigen[a] kämpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen die Toren“. Gemeint sind Menschen, die sich in ihrer Auflehnung gegen Gott vernunftwidrig und ohne Einsicht verhalten, nicht Menschen mit einer psychischen Erkrankung.'
    reason: Das Bedeutungsspektrum von παράφρονας reicht von unvernünftig und uneinsichtig bis töricht; eine klinische Deutung wäre hier irreführend.
lexical_decisions:
- source_word: ὀξυνεῖ
  choice: wird … schärfen
  rationale: Das Futur von ὀξύνω bezeichnet wörtlich das Schärfen oder Wetzen und bewahrt das Waffenbild.
- source_word: ἀπότομον ὀργὴν
  choice: den unerbittlichen Zorn
  rationale: ἀπότομος kann Schärfe, Härte und unnachgiebige Strenge ausdrücken. „Unerbittlich“ klingt im Deutschen natürlich, passt zum Gerichtskontext und vermeidet die schwer verständliche Wendung „scharfer Zorn“.
- source_word: εἰς ῥομφαίαν
  choice: zum Schwert
  rationale: εἰς kann hier Ziel oder Ergebnis anzeigen. „Zum Schwert schärfen“ erhält das kühne Bild, ohne eine eindeutige stoffliche Verwandlung zu behaupten.
- source_word: συνεκπολεμήσει
  choice: wird an seiner Seite … kämpfen
  rationale: Das zusammengesetzte Verb bezeichnet gemeinsames Kriegführen; die Formulierung gibt sowohl den Kampf als auch das Zusammenwirken wieder.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: κόσμος meint hier die geordnete Welt beziehungsweise die Schöpfung, die am Gericht mitwirkt. „Die Welt“ ist direkt und lässt den kosmischen Umfang offen.
- source_word: ἐπὶ τοὺς παράφρονας
  choice: gegen die Unvernünftigen
  rationale: παράφρων bezeichnet Menschen, die ohne rechte Einsicht handeln oder sich vernunftwidrig verhalten. „Unvernünftige“ wahrt den moralisch-geistlichen Sinn, ohne eine klinische Erkrankung anzudeuten.
theological_decisions:
- issue: Bezug von αὐτῷ („an seiner Seite“)
  choice: Das Pronomen bleibt im Text erhalten; im Zusammenhang ist wahrscheinlich Gott gemeint.
  alternative: Es könnte mittelbar auf den Gerechten beziehungsweise dessen Sache bezogen werden.
  rationale: Der Kontext schildert die Schöpfung als Mitstreiterin im göttlichen Gericht. Da der griechische Vers den Bezug nicht ausdrücklich benennt, wird nicht erklärend „Gott“ eingesetzt.
translation_notes:
  register: Gehobene, aber gegenwärtige Standardsprache. Das martialische Bild und die personifizierte Mitwirkung der Welt bleiben erhalten; der unklare Pronomenbezug wird nicht aufgelöst.
