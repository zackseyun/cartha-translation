base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/013.yaml
  text: So also we[a], once we were born, came to an end; and we had no sign of virtue to show[b], but were consumed in our wickedness.
translation:
  language: de
  text: So sind auch wir nach unserer Geburt dahingeschwunden[a]; kein Zeichen von Tugend[b] hatten wir vorzuweisen, sondern wir wurden in unserer Bosheit völlig aufgezehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vergangen« oder »zu Ende gekommen«. Das griechische Verb kann sowohl Verschwinden als auch Aufhören bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Vortrefflichkeit«. Das griechische Wort kann moralische Qualität in einem weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ἡμεῖς
  choice: So sind auch wir
  rationale: Bewahrt den vergleichenden Rückbezug auf die vorausgehenden Bilder der Vergänglichkeit und klingt im Deutschen natürlich.
- source_word: γενηθέντες
  choice: kaum ins Dasein getreten
  rationale: Gibt das Zustandekommen beziehungsweise den Eintritt ins Leben wieder; „kaum“ verdeutlicht im Zusammenhang die Kürze, ohne den Ausdruck einseitig auf den Geburtsvorgang zu beschränken.
- source_word: ἐξελίπομεν
  choice: dahingeschwunden
  rationale: Erfasst das Verschwinden und Aufhören, das ἐκλείπω ausdrücken kann, und passt zum Bild menschlicher Vergänglichkeit.
- source_word: ἀρετῆς
  choice: Tugend
  rationale: Bezeichnet hier im ethischen Zusammenhang sittliche Tüchtigkeit beziehungsweise moralische Vortrefflichkeit.
- source_word: σημεῖον
  choice: Zeichen
  rationale: Ist die direkte Entsprechung und trägt zusammen mit „vorzuweisen“ den Sinn eines sichtbaren Belegs.
- source_word: οὐδὲν ἔσχομεν δεῖξαι
  choice: kein Zeichen … hatten wir vorzuweisen
  rationale: Bewahrt die Aussage, dass nichts als Nachweis gezeigt werden konnte, in idiomatischem Deutsch.
- source_word: κακίᾳ
  choice: Bosheit
  rationale: Gibt die moralische Verderbtheit des Kontextes wieder und vermeidet die sachlich breitere Bedeutung von „Übel“.
- source_word: κατεδαπανήθημεν
  choice: wir wurden … völlig aufgezehrt
  rationale: Bewahrt Passiv und Intensität des Verbs, das vollständiges Aufbrauchen oder Verzehren bezeichnet.
theological_decisions:
- issue: Bedeutung von ἀρετή in der Selbstanklage der Gottlosen
  choice: Tugend
  alternative: Vortrefflichkeit; sittliche Güte
  rationale: Der Zusammenhang stellt Bosheit einem nicht erbrachten Nachweis moralischer Qualität gegenüber. „Tugend“ wahrt den ethischen und weisheitlichen Sinn, ohne eine spätere dogmatische Fachbedeutung einzutragen.
- issue: Verhältnis der Bosheit zum Aufgezehrtwerden
  choice: „in unserer Bosheit“ bleibt relational offen
  alternative: „durch unsere Bosheit“ als eindeutige Ursache
  rationale: Die griechische Präposition ἐν bezeichnet hier den Bereich oder Zusammenhang und kann instrumentale beziehungsweise kausale Färbung haben. Die Übersetzung legt nicht fest, ob die Bosheit ausschließlich Mittel, Ursache oder Lebenssphäre des Verzehrens ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht bildhafte Formulierung „dahingeschwunden“ entspricht dem Kontext der Vergänglichkeit; „völlig aufgezehrt“ erhält die starke Aussage des griechischen Kompositums. Beide Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
