  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/002.yaml
  text: When they see him[a], they will be shaken with dreadful fear, and they will be astonished at the unexpectedness of his salvation.
translation:
  language: de
  text: Wenn sie ihn sehen[a], werden sie von schrecklicher Furcht erschüttert werden und über das Unerwartete seiner Rettung staunen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen: „Sehend werden sie von schrecklicher Furcht erschüttert werden und über das Unerwartete der Rettung staunen.“ „Ihn“ und „seiner“ sind aus dem Zusammenhang ergänzt; gemeint ist der Gerechte aus dem vorhergehenden Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Wenn sie ihn sehen
  rationale: Das Aoristpartizip wird natürlich als Temporalsatz wiedergegeben. Das im Griechischen unausgesprochene Objekt „ihn“ ergibt sich aus dem Gerechten im unmittelbaren Kontext.
- source_word: ταραχθήσονται
  choice: werden sie … erschüttert werden
  rationale: Das Futur Passiv von ταράσσω bezeichnet eine starke innere Erschütterung; „erschüttert“ bewahrt diese Intensität.
- source_word: φόβῳ δεινῷ
  choice: von schrecklicher Furcht
  rationale: Der Dativ kann Ursache oder Mittel bezeichnen. „Schreckliche Furcht“ gibt das nachdrückliche δεινῷ in heutigem, würdigem Deutsch wieder.
- source_word: ἐκστήσονται
  choice: werden … außer sich geraten
  rationale: Das Futur Medium von ἐξίστημι beschreibt hier überwältigendes Erstaunen. „Außer sich geraten“ bewahrt die stärkere Bildhaftigkeit des griechischen Ausdrucks.
- source_word: ἐπὶ τῷ παραδόξῳ
  choice: über das Unerwartete
  rationale: Das substantivierte Adjektiv bezeichnet das Unerwartete oder Erstaunliche als Sache; die knappe substantivische Wiedergabe erhält die Form und Mehrdeutigkeit.
- source_word: τῆς σωτηρίας
  choice: seiner Rettung
  rationale: σωτηρία kann „Rettung“, „Errettung“ oder „Heil“ bedeuten. „Rettung“ passt zur konkreten Rechtfertigung und Bewahrung des Gerechten; „seiner“ verdeutlicht den aus dem Kontext erschlossenen Bezug.
theological_decisions:
- issue: Unausgesprochener Bezug von ἰδόντες und τῆς σωτηρίας
  choice: Der Bezug auf den Gerechten wird mit „ihn“ und „seiner“ ausdrücklich gemacht.
  alternative: „Wenn sie sehen … über das Unerwartete der Rettung“
  rationale: Im Griechischen bleibt der Bezug aufgrund des vorhergehenden Verses unausgesprochen. Im Deutschen wäre dieselbe Ellipse unklar und unnatürlich; die Ergänzungen erläutern den Kontext, ohne eine zusätzliche Lehrentscheidung einzuführen.
- issue: Bedeutungsumfang von σωτηρία
  choice: Rettung
  alternative: Heil; Errettung
  rationale: „Rettung“ lässt sowohl konkrete Befreiung als auch den weitergehenden theologischen Sinn offen und vermeidet eine vorschnelle Verengung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die Satzstruktur folgt dem Griechischen eng, wird jedoch durch einen deutschen Temporalsatz natürlich gestaltet. „Das Unerwartete“ bewahrt die substantivische Offenheit von παράδοξος.
