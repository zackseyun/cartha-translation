base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/006.yaml
  text: So then we went astray from the way of truth[a], and the light of righteousness did not shine on us, and the sun did not rise for us.
translation:
  language: de
  text: Also sind wir vom Weg der Wahrheit abgeirrt, und das Licht der Gerechtigkeit leuchtete uns nicht, und die Sonne ging für uns nicht auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρα
  choice: Also
  rationale: Kennzeichnet die rückblickende Schlussfolgerung der Sprechenden und klingt im modernen Deutschen natürlich.
- source_word: ἐπλανήθημεν ἀπὸ ὁδοῦ ἀληθείας
  choice: sind wir vom Weg der Wahrheit abgeirrt
  rationale: Bewahrt das Wegmotiv und gibt die formal passive Verbform idiomatisch intransitiv wieder, ohne einen im Text nicht genannten Irreführenden vorauszusetzen.
- source_word: τὸ τῆς δικαιοσύνης φῶς
  choice: das Licht der Gerechtigkeit
  rationale: Die Genitivkonstruktion und das Lichtbild bleiben erhalten. Das deutsche „Gerechtigkeit“ umfasst hier sowohl moralische Rechtschaffenheit als auch den Gedanken des Rechts.
- source_word: οὐκ ἔλαμψεν ἡμῖν
  choice: leuchtete uns nicht
  rationale: Gibt den Dativ knapp und idiomatisch wieder und bewahrt das konkrete Bild des Leuchtens.
- source_word: ὁ ἥλιος οὐκ ἀνέτειλεν ἡμῖν
  choice: die Sonne ging für uns nicht auf
  rationale: Entspricht dem gewöhnlichen deutschen Ausdruck für den Sonnenaufgang und erhält durch „für uns“ den Bezugsdativ.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ ist im Deutschen breit genug, um die moralische und die rechtlich-gerichtliche Dimension des griechischen Ausdrucks offenzuhalten; eine Festlegung auf nur eine dieser Nuancen wird vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Satzstruktur des Griechischen wird beibehalten; die wiederholte Verneinung verstärkt das rückblickende Eingeständnis.
