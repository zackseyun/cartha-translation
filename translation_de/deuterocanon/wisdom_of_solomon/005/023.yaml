base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/023.yaml
  text: A spirit of power will stand against them[a], and like a whirlwind it will winnow them away;
translation:
  language: de
  text: Ein Geist[a] der Macht wird sich ihnen entgegenstellen; wie ein Wirbelsturm wird er sie hinwegfegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein mächtiger Wind wird sich ihnen entgegenstellen«; auch: »Ein gewaltiger Sturmwind wird sich ihnen entgegenstellen«. Das griechische Wort πνεῦμα kann »Geist«, »Wind« oder »Hauch« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: wird sich ihnen entgegenstellen
  rationale: Das Futur von ἀνθίστημι bezeichnet aktiven Widerstand. Die Wendung bewahrt das konkrete Bild des Entgegentretens und klingt im Deutschen natürlich.
- source_word: πνεῦμα
  choice: Geist
  rationale: πνεῦμα kann »Geist«, »Wind« oder »Hauch« bedeuten. Als Subjekt von »wird sich entgegenstellen« ist hier »Geist« naheliegend; die Wetterbildlichkeit bleibt durch den folgenden Vergleich mit einem Wirbelsturm erhalten.
- source_word: δυνάμεως
  choice: der Macht
  rationale: Der Genitiv bestimmt πνεῦμα näher. »Der Macht« gibt die abstrakte Kraftangabe knapp wieder, ohne sie unnötig auf körperliche oder militärische Stärke festzulegen.
- source_word: λαῖλαψ
  choice: Wirbelsturm
  rationale: λαῖλαψ bezeichnet einen heftigen Sturm oder Sturmwind. »Wirbelsturm« ist anschaulich und passt zum Bild des gewaltsamen Forttreibens.
- source_word: ἐκλικμήσει
  choice: wird … hinwegfegen
  rationale: Das Verb entstammt dem Bildfeld des Worfelns und bezeichnet das Forttreiben wie von Spreu. »Hinwegfegen« ist im Deutschen idiomatisch und bewahrt die gewaltsame Bewegung, auch wenn das landwirtschaftliche Einzelbild weniger ausdrücklich hervortritt.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor genannten Frevler beziehungsweise Gegner und wird direkt wiedergegeben.
theological_decisions:
- issue: Ob πνεῦμα unpersönlich als »Wind« oder stärker als handelnder »Geist« wiederzugeben ist
  choice: Geist
  alternative: Wind; mächtiger Sturmwind
  rationale: Die Satzstruktur stellt πνεῦμα δυνάμεως als handelndes Subjekt dar, das sich den Gegnern entgegenstellt. Das spricht für »Geist«, doch die echte lexikalische Mehrdeutigkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Übersetzung wahrt die mögliche Personifizierung von πνεῦμα und zugleich die Sturmmetaphorik. Das Semikolon des griechischen Textes wird im deutschen Satz durch »und« verbunden.
