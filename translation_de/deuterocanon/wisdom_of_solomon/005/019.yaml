lexical_decisions:
- source_word: λήμψεται
  choice: wird … nehmen
  rationale: Das Futur Medium von λαμβάνω bezeichnet hier im Bild des Anlegens einer Rüstung das Ergreifen beziehungsweise Annehmen des Schildes. „Nehmen“ bleibt eng am Griechischen, ohne das etwas deutlichere „ergreifen“ einzutragen.
- source_word: ἀσπίδα
  choice: Schild
  rationale: Die übliche und in modernem Deutsch natürliche Bezeichnung für eine Schutzwaffe; ein engerer oder altertümlicherer Ausdruck ist nicht erforderlich.
- source_word: ἀκαταμάχητον
  choice: unüberwindlich
  rationale: Das Adjektiv bezeichnet etwas, das im Kampf nicht bezwungen werden kann. „Unüberwindlich“ bewahrt sowohl die passive Bedeutung als auch das Kampfbild.
- source_word: ὁσιότητα
  choice: Heiligkeit
  rationale: ὁσιότης bezeichnet eine Haltung oder Eigenschaft, die vor Gott heilig, fromm und recht ist. „Heiligkeit“ erhält hier die umfassende moralisch-religiöse Bedeutung und passt zur personifizierten Tugend im Rüstungsbild.
theological_decisions:
- issue: Ob ὁσιότητα als umfassende moralisch-religiöse Eigenschaft oder enger als Frömmigkeit wiederzugeben ist.
  choice: Heiligkeit
  alternative: Frömmigkeit oder Gottesfurcht
  rationale: „Heiligkeit“ bewahrt die Breite des griechischen Tugendbegriffs und verengt ihn nicht auf Andacht oder äußere Religiosität. Die Fußnote hält die echte lexikalische Spannweite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und das Rüstungsbild des griechischen Textes bleiben erhalten; der Fußnotenmarker steht unmittelbar nach dem Satz.
