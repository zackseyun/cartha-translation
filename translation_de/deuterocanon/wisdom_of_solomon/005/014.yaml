base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/014.yaml
  text: For the hope of the ungodly is like down carried by the wind[a], and like thin frost driven away by a storm, and like smoke dispersed by the wind, and passes by like the remembrance of a one-day guest.
translation:
  language: de
  text: Denn die Hoffnung des Gottlosen ist wie Flaum, den der Wind davonträgt, wie feiner Reif, den ein Sturm vertreibt, und wie Rauch, den der Wind verweht; sie ist vorübergegangen wie die Erinnerung an einen Gast, der nur einen Tag blieb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »wie die Erwähnung eines Gasts, der nur einen Tag Unterkunft nahm«. Das griechische μνεία kann »Erinnerung« oder »Erwähnung« bedeuten; καταλύτης bezeichnet jemanden, der vorübergehend Unterkunft nimmt.'
    reason: Lexikalische Mehrdeutigkeit bei μνεία und καταλύτης.
lexical_decisions:
- source_word: ἐλπὶς
  choice: Hoffnung
  rationale: Die übliche und im Zusammenhang natürliche Entsprechung; sie bewahrt den Gegensatz zwischen gegenwärtiger Erwartung und ihrer Vergänglichkeit.
- source_word: ἀσεβοῦς
  choice: des Gottlosen
  rationale: Die substantivierte Personenbezeichnung erhält die auf Gott bezogene Bedeutung von ἀσεβής besser als das allgemeinere »Bösen«.
- source_word: χνοῦς
  choice: Flaum
  rationale: Das Wort bezeichnet leichten Flaum oder feine, leicht verwehbare Fasern und ist nicht der übliche Ausdruck für Spreu.
- source_word: πάχνη … λεπτὴ
  choice: feiner Reif
  rationale: πάχνη bezeichnet Reif beziehungsweise Frost; »fein« gibt λεπτὴ wieder und bewahrt das Bild seiner Zartheit und Vergänglichkeit.
- source_word: λαίλαπος
  choice: Sturm
  rationale: Der Ausdruck bezeichnet einen heftigen Sturm oder eine Bö; »Sturm« ist im modernen Deutsch klar und kräftig.
- source_word: διωχθεῖσα
  choice: vertreibt
  rationale: Das passive Partizip beschreibt, wie der Reif mit Gewalt fortgetrieben wird; die aktive deutsche Relativkonstruktion klingt natürlicher.
- source_word: καπνὸς … διεχύθη
  choice: Rauch, den der Wind verweht
  rationale: Im Bild des Rauchs meint διεχύθη dessen Zerstreuung; »verweht« gibt dies idiomatisch wieder.
- source_word: μνεία
  choice: Erinnerung
  rationale: μνεία kann Erinnerung oder Erwähnung bedeuten. Im Vergleich mit etwas rasch Vorübergehendem ist »Erinnerung« im Haupttext am natürlichsten, ohne die Alternative auszuschließen.
- source_word: καταλύτου μονοημέρου
  choice: einen Gast, der nur einen Tag blieb
  rationale: καταλύτης bezeichnet hier jemanden, der vorübergehend Unterkunft nimmt; die Relativkonstruktion gibt die wörtliche Eintägigkeit von μονοήμερος verständlich wieder.
- source_word: παρῴδευσεν
  choice: zieht vorüber
  rationale: Die Wendung bewahrt das Bewegungsbild des griechischen Verbs und drückt zugleich die Flüchtigkeit aus.
theological_decisions:
- issue: Wiedergabe von ἀσεβοῦς
  choice: des Gottlosen
  alternative: des Frevlers / des Bösen
  rationale: »Gottloser« erhält die religiöse Ausrichtung des Begriffs, ohne über den griechischen Text hinaus eine bestimmte konfessionelle Deutung einzutragen.
- issue: Bezug des letzten Verbs παρῴδευσεν
  choice: Die Hoffnung wird als das vorüberziehende Bezugswort ausdrücklich aufgenommen
  alternative: Die Erinnerung selbst zieht vorüber
  rationale: Der griechische Satz lässt durch seine Folge von Vergleichen eine gewisse syntaktische Spannung stehen. Im Deutschen schafft »sie zieht vorüber wie …« einen verständlichen Bezug auf »Hoffnung«, während der Vergleich mit der flüchtigen Erinnerung erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einer rhythmischen Folge von Vergleichen. Die wiederholten Wind- und Sturmformulierungen werden beibehalten; Relativsätze vermeiden unnatürliche deutsche Partizipialketten.
