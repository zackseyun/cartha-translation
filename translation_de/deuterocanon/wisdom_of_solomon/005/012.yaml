lexical_decisions:
- source_word: βέλους
  choice: Pfeil
  rationale: βέλος bezeichnet hier im Bild vom Schießen am natürlichsten einen Pfeil.
- source_word: βληθέντος
  choice: geschossen wird
  rationale: Das Partizip von βάλλω beschreibt hier einen auf ein Ziel abgeschossenen Pfeil; die passive Form bewahrt die griechische Konstruktion.
- source_word: σκοπόν
  choice: Ziel
  rationale: σκοπός ist hier das konkrete Ziel, auf das der Pfeil gerichtet ist.
- source_word: τμηθεὶς ὁ ἀὴρ
  choice: die durchschnittene Luft
  rationale: Die Formulierung erhält das anschauliche Bild der Luft, die durch den Pfeil geteilt wird.
- source_word: εὐθέως
  choice: sofort
  rationale: Das Wort bezeichnet die unmittelbare Wiedervereinigung der Luft nach dem Durchflug.
- source_word: εἰς ἑαυτὸν ἀνελύθη
  choice: schließt sich … wieder
  rationale: Wörtlich kehrt die Luft in sich selbst zurück; im Deutschen gibt „schließt sich wieder“ den Vorgang natürlich und anschaulich wieder.
- source_word: ὡς ἀγνοῆσαι
  choice: sodass man … nicht erkennen kann
  rationale: ὡς mit Infinitiv bezeichnet hier die Folge; das unbestimmte „man“ gibt den fehlenden ausdrücklichen Wahrnehmenden angemessen wieder.
- source_word: δίοδον αὐτοῦ
  choice: seine Flugbahn
  rationale: δίοδος bezeichnet den Durchgang oder Weg des Pfeils; „Flugbahn“ ist im deutschen Kontext präzise und natürlich, während das Pronomen auf den Pfeil bezogen wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt erhält die beispielhafte Bildfolge; „Flugbahn“ verdeutlicht idiomatisch den Weg des Pfeils durch die Luft, ohne das Bild auszudeuten.
