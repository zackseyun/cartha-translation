translation:
  language: de
  text: 'oder wie ein Pfeil, der auf ein Ziel geschossen wurde: Die durchschnittene Luft schloss sich sofort wieder, sodass man seine Flugbahn[a] nicht erkennen konnte.'
  philosophy: optimal-equivalence
  footnotes:
