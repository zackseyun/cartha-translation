  text: But the righteous live forever[a], and their reward is with the Lord[b], and their care is with the Most High.
translation:
  language: de
  text: Doch die Gerechten leben ewig, und ihr Lohn ist beim Herrn[a]; die Sorge um sie liegt beim Höchsten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „im Herrn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ihr Wohlergehen liegt beim Höchsten“ oder: „Der Höchste sorgt für sie.“ Die knappe griechische Formulierung lässt diese eng verwandten Bedeutungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die durch Gerechtigkeit gekennzeichnet sind. „Die Gerechten“ ist im modernen Standarddeutsch natürlich und bewahrt den ethisch-theologischen Gehalt.
- source_word: εἰς τὸν αἰῶνα
  choice: ewig
  rationale: Die idiomatische Wendung bezeichnet hier eine unbegrenzte Dauer. „Ewig“ gibt sie knapp und natürlich wieder.
- source_word: ζῶσιν
  choice: leben
  rationale: Das Präsens bezeichnet das fortdauernde Leben der Gerechten und wird unmittelbar mit „leben“ wiedergegeben.
- source_word: ἐν Κυρίῳ
  choice: beim Herrn
  rationale: Obwohl ἐν wörtlich oft „in“ bedeutet, bezeichnet die Formulierung hier am ehesten, dass der Lohn in der Gegenwart oder Obhut des Herrn ist. „Beim Herrn“ ist im Deutschen natürlich und entspricht zugleich dem parallelen παρὰ Ὑψίστῳ.
- source_word: ὁ μισθὸς αὐτῶν
  choice: ihr Lohn
  rationale: μισθός kann Arbeitslohn, Vergeltung oder Belohnung bedeuten. „Lohn“ ist knapp, würdig und lässt offen, auf welche Weise die Gerechten ihre Vergeltung empfangen.
- source_word: ἡ φροντὶς αὐτῶν
  choice: die Sorge um sie
  rationale: φροντίς umfasst Sorge, Fürsorge und Bedacht. Der objektive Bezug „um sie“ gibt im Zusammenhang wahrscheinlich die Fürsorge für die Gerechten wieder; eine Fußnote hält die ebenfalls mögliche Deutung als ihr Wohlergehen ausdrücklich offen.
- source_word: παρὰ Ὑψίστῳ
  choice: liegt beim Höchsten
  rationale: παρά mit dem Dativ bezeichnet Nähe, Gegenwart oder Zuständigkeit. Die deutsche Wendung drückt aus, dass die Sorge in der Hand des Höchsten liegt, und erhält die räumlich-beziehungsbezogene Bildsprache.
theological_decisions:
- issue: Bedeutung von ἡ φροντὶς αὐτῶν
  choice: die Sorge um sie liegt beim Höchsten
  alternative: ihr Wohlergehen liegt beim Höchsten; der Höchste sorgt für sie
  rationale: Die knappe griechische Nominalfügung kann sowohl die Fürsorge des Höchsten für die Gerechten als auch ihr bei ihm aufgehobenes Wohlergehen bezeichnen. Der Haupttext wählt eine natürliche, kontextuell wahrscheinliche Formulierung; die Fußnote bewahrt die eng verwandte alternative Lesart.
- issue: Wiedergabe von ἐν Κυρίῳ
  choice: beim Herrn
  alternative: im Herrn
  rationale: „Im Herrn“ ist formal näher an der Präposition, könnte im Deutschen jedoch eine spezifisch mystische oder paulinische Bedeutung nahelegen. „Beim Herrn“ bringt hier Gegenwart beziehungsweise Obhut klarer zum Ausdruck, ohne die wörtlichere Möglichkeit zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Das Semikolon macht die Parallelität der beiden Aussagen sichtbar, ohne den griechischen Gedankengang unnötig zu glätten.
