    reason: lexical_alternative
lexical_decisions:
- source_word: ναῦς
  choice: Schiff
  rationale: Der allgemeine griechische Ausdruck für ein größeres Wasserfahrzeug wird im Deutschen natürlich und bildgerecht mit „Schiff“ wiedergegeben.
- source_word: διερχομένη
  choice: das … fährt
  rationale: Das Partizip beschreibt die Bewegung durch das Wasser; die deutsche Relativkonstruktion ist flüssig und bewahrt den Vorgang.
- source_word: κυμαινόμενον ὕδωρ
  choice: aufgewühltes Wasser
  rationale: κυμαινόμενον bezeichnet Wasser, das Wellen schlägt bzw. in Wellen bewegt ist. „Aufgewühlt“ gibt diese Dynamik idiomatisch wieder, ohne eine Ursache festzulegen.
- source_word: ἧς διαβάσης
  choice: Ist es vorüber
  rationale: Der Genitivus absolutus bezeichnet die abgeschlossene Vorbeifahrt des Schiffs vor dem folgenden Hauptsatz.
- source_word: ἴχνος
  choice: Spur
  rationale: „Spur“ bezeichnet treffend ein zurückbleibendes sichtbares Zeichen und passt zum Bild seines völligen Verschwindens.
- source_word: ἀτραπός
  choice: Bahn
  rationale: Das Wort bezeichnet einen Pfad oder eine Spur; „Bahn“ ist im Zusammenhang mit der Fahrt eines Schiffs natürlich und unterscheidet sich stilistisch von ἴχνος.
- source_word: τρόπιος αὐτῆς
  choice: seines Kiels
  rationale: Die nautische Bedeutung verweist auf den Kiel des Schiffs. Diese konkrete Wiedergabe erhält das anschauliche Bild des griechischen Textes.
- source_word: ἐν κύμασιν
  choice: in den Wellen
  rationale: Die Präpositionalphrase lokalisiert die nicht mehr auffindbare Kielbahn innerhalb der Wellen.
