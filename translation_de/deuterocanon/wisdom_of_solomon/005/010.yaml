translation:
  language: de
  text: 'wie ein Schiff, das durch aufgewühltes Wasser fährt[a]: Wenn es vorübergefahren ist, findet man keine Spur, auch keine Bahn seines Kiels in den Wellen[b];'
  philosophy: optimal-equivalence
  footnotes:
