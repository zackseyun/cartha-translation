base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/003.yaml
  text: 'They will say among themselves[a], repenting, and will groan because of anguish of spirit: “This is the one whom we once held in derision.”'
translation:
  language: de
  text: 'Sie werden unter sich[a] sagen, von Reue erfüllt, und vor innerer Bedrängnis stöhnen: »Dieser ist es, den wir einst verspotteten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei sich selbst« beziehungsweise »in ihrem Inneren«.'
    reason: Die griechische Wendung ἐν ἑαυτοῖς kann eine Äußerung innerhalb der Gruppe oder ein inneres Sprechen bezeichnen.
lexical_decisions:
- source_word: ἐροῦσιν
  choice: Sie werden sagen
  rationale: Das Futur von λέγω wird im modernen Deutsch unmittelbar und natürlich als zukünftige Rede wiedergegeben.
- source_word: ἐν ἑαυτοῖς
  choice: untereinander
  rationale: Die Wendung kann sowohl das Gespräch innerhalb der Gruppe als auch ein Sprechen bei sich selbst bezeichnen. Der Plural und die gemeinsame direkte Rede sprechen im Haupttext für „untereinander“; die innere Lesart bleibt in der Fußnote erhalten.
- source_word: μετανοοῦντες
  choice: voller Reue
  rationale: Das präsentische Partizip bezeichnet den Zustand, in dem sie sprechen. „Voller Reue“ bewahrt die moralische Umkehrkomponente, ohne über das Ergebnis dieser Reue zu entscheiden.
- source_word: διὰ στενοχωρίαν πνεύματος
  choice: vor innerer Bedrängnis
  rationale: στενοχωρία bezeichnet bedrängende Not oder Angst; πνεύματος lokalisiert sie im Inneren. Die Formulierung ist natürlich und wahrt die Intensität, ohne πνεῦμα unnötig lehrhaft festzulegen.
- source_word: στενάξονται
  choice: stöhnen
  rationale: Das Verb bezeichnet einen hörbaren Ausdruck schweren Leids; „stöhnen“ gibt die Stärke besser wieder als „seufzen“.
- source_word: Οὗτος ἦν
  choice: Das ist der
  rationale: Die identifizierende Aussage klingt im Deutschen mit Präsens natürlich; der folgende Relativsatz verankert ihre frühere Haltung ausdrücklich in der Vergangenheit.
- source_word: ὃν ἔσχομέν ποτε εἰς γέλωτα
  choice: den wir einst zum Gespött machten
  rationale: ἔχω mit εἰς und Akkusativ beschreibt hier, dass jemand als Gegenstand des Lachens behandelt wird. „Zum Gespött machten“ ist verständlich, würdig und gibt die aktive Verachtung treffend wieder.
theological_decisions:
- issue: Bedeutung von μετανοοῦντες bei der endzeitlichen Einsicht der Frevler
  choice: voller Reue
  alternative: von Bedauern erfüllt
  rationale: Der griechische Ausdruck trägt stärkeres moralisches Umdenken in sich als bloßes Bedauern. Zugleich sagt der Vers nicht, ob diese Reue heilbringend ist; die Übersetzung lässt diese theologische Spannung offen.
- issue: Bedeutung von πνεῦμα in στενοχωρίαν πνεύματος
  choice: innerer Bedrängnis
  alternative: Bedrängnis des Geistes
  rationale: Hier bezeichnet πνεῦμα plausibel das innere Erleben des Menschen. „Innerer“ vermeidet eine dogmatische Festlegung auf einen technisch verstandenen Geistbegriff und bewahrt dennoch den Sinn der griechischen Genitivverbindung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und mündlich verständlich; „voller Reue“, „innere Bedrängnis“ und „zum Gespött machten“ vermeiden sowohl unnötige Altertümlichkeit als auch umgangssprachliche Abschwächung.
