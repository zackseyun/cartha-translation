lexical_decisions:
- source_word: πῶς
  choice: Wie konnte …? / wie kann …?
  rationale: Das Fragewort leitet im Kontext einen Ausruf ungläubigen Staunens über die unerwartete Umkehrung ein. Die modale Wiedergabe mit „wie“ bewahrt dies besser als „warum“.
- source_word: κατελογίσθη
  choice: wurde … gezählt
  rationale: Der Aorist Passiv bezeichnet hier die Zurechnung beziehungsweise Aufnahme in eine Gruppe; „gezählt werden“ ist im Deutschen klar und wahrt das Passiv.
- source_word: ἐν υἱοῖς θεοῦ
  choice: zu den Söhnen Gottes
  rationale: ἐν mit dem Dativ drückt hier Gruppenzugehörigkeit aus. „Zu den Söhnen Gottes“ ist natürliches Deutsch und bewahrt den ausdrücklich maskulinen Plural des griechischen Statusausdrucks.
- source_word: κλῆρος
  choice: Los
  rationale: „Los“ erhält das Bild eines zugeteilten Platzes oder Anteils; die Bedeutung „Anteil“ wird in einer Fußnote kenntlich gemacht.
- source_word: ἐν ἁγίοις
  choice: unter den Heiligen
  rationale: Das substantivierte Adjektiv bezeichnet heilige Personen. „Die Heiligen“ ist im Deutschen ein geläufiger biblischer Ausdruck; die Formulierung bleibt offen dafür, welche Gruppe genau gemeint ist.
- source_word: αὐτοῦ ἐστιν
  choice: sein Los … sein
  rationale: Die possessive Aussage wird eng am Griechischen wiedergegeben. Das wiederholte Frageelement macht den koordinierten zweiten Satzteil im modernen Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe von υἱοῖς θεοῦ
  choice: Söhne Gottes
  alternative: Kinder Gottes
  rationale: Das Griechische hat ausdrücklich den maskulinen Plural υἱοῖς. Die Hauptübersetzung bewahrt diese Form und ihre mögliche Funktion als Statusbezeichnung; die idiomatisch inklusivere Alternative steht in der Fußnote.
- issue: Identität der ἅγιοι
  choice: Heilige
  alternative: heilige Wesen / Heilige [Menschen]
  rationale: Der griechische Ausdruck bestimmt nicht ausdrücklich, ob Menschen oder himmlische Wesen gemeint sind. „Heilige“ bewahrt diese echte Deutungsoffenheit, statt eine Gruppe festzulegen.
- issue: Zeitform im zweiten Satzteil
  choice: wie kann sein Los … sein?
  alternative: und sein Los ist unter den Heiligen?
  rationale: Im Griechischen steht nach dem aoristischen Passiv ein Präsens. Die deutsche Form wahrt den Gegenwartsbezug und kennzeichnet zugleich beide koordinierten Satzteile eindeutig als Inhalt der erstaunten Frage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Bestürzung wird durch zwei mit „wie“ verbundene Frageglieder natürlich ausgedrückt. „Los“ erhält die biblische Zuteilungsmetapher; „Heilige“ vermeidet eine unbelegte Festlegung auf menschliche oder himmlische Referenten.
