  source_fidelity: 'Die Grundbegriffe sind treffend wiedergegeben: κατελογίσθη als passive Zurechnung, υἱοῖς θεοῦ als „Söhne Gottes“, κλῆρος als „Los“ und ἅγιοι als offen gehaltene „Heilige“. Allerdings fügt „konnte“ im ersten Satzteil eine im Griechischen nicht ausgedrückte Modalität hinzu. Das einzige πῶς leitet die gesamte erstaunte Frage ein; die Gegenwartsform ἐστιν im zweiten Glied ist beizubehalten, ohne ein zweites „wie kann“ einzuführen.'
  naturalness: „Wie wurde er zu den Söhnen Gottes gezählt, und sein Los ist unter den Heiligen?“ ist würdevoll, verständlich und gibt die im Griechischen bewusst knappe, erstaunte Satzfügung angemessen wieder. Die bisherige Fassung ist durch den Wechsel von „konnte“ zu „kann“ und die Wiederholung von „wie“ unnötig interpretierend und weniger eng am Satzbau.
  terminology: „Söhne Gottes“, „Los“ und „Heilige“ sind geeignete, registergerechte Entsprechungen. „Heilige“ wahrt die im Ausdruck ἁγίοις bestehende Referenzoffenheit. Die Alternativfußnote zu κλῆρος soll lediglich „Anteil“ anbieten und nicht die syntaktisch interpretierende Formulierung des Entwurfs wiederholen.
