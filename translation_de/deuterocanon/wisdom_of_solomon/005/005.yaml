revisions:
- from: Wie konnte er zu den Söhnen Gottes[a] gezählt werden, und wie kann sein Los unter den Heiligen[b] sein?
  to: Wie wurde er zu den Söhnen Gottes[a] gezählt, und sein Los ist unter den Heiligen[b]?
