  - severity: low
    issue: Fußnote b ist zu weit gefasst
    rationale: Die Fußnote soll die lexikalische Alternative für κλῆρος („Anteil“) dokumentieren. Ihre bisherige Form wiederholt zugleich die nicht quellengetreue Fragekonstruktion „und wie kann“.
