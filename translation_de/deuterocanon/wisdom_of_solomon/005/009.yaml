  text: All those things passed away like a shadow[a], and like a report running past;
translation:
  language: de
  text: Das alles ging vorüber wie ein Schatten und wie eine Nachricht, die vorübereilt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine Meldung, die rasch vorbeizieht“. Das griechische Wort kann „Nachricht“, „Meldung“, „Botschaft“ oder „Ankündigung“ bedeuten; das folgende Verb betont das schnelle Vorübergehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθεν
  choice: ging vorüber
  rationale: Der Aorist von παρέρχομαι beschreibt hier das Vorübergehen und die Vergänglichkeit; „ging vorüber“ wahrt das Bewegungsbild, ohne bereits stärker als „verschwand“ zu deuten.
- source_word: ἐκεῖνα πάντα
  choice: das alles
  rationale: Die Wendung verweist zusammenfassend auf das zuvor Genannte. „Das alles“ gibt Demonstrativ- und Gesamtbedeutung in natürlichem modernem Deutsch wieder.
- source_word: ὡς σκιὰ
  choice: wie ein Schatten
  rationale: Die direkte Wiedergabe erhält das Bild für Flüchtigkeit und Unbeständigkeit.
- source_word: ἀγγελία
  choice: Nachricht
  rationale: ἀγγελία kann „Nachricht“, „Botschaft“, „Meldung“ oder „Ankündigung“ bedeuten. „Nachricht“ ist hier verständlich, weit genug und lässt sich mit dem folgenden Bewegungsbild verbinden.
- source_word: παρατρέχουσα
  choice: die vorübereilt
  rationale: Das präsentische Partizip bezeichnet etwas, das schnell vorbeiläuft. „Vorübereilt“ bewahrt sowohl die Geschwindigkeit als auch das Vorübergehen und klingt im Deutschen würdevoll.
