  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/018.yaml
  text: He will put on righteousness as a breastplate, and will place sincere judgment as a helmet;
translation:
  language: de
  text: Er wird Gerechtigkeit[a] als Brustpanzer anlegen und sich ungeheucheltes Urteil[b] als Helm aufsetzen;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtschaffenheit“. Das griechische Wort kann sowohl moralische Rechtschaffenheit als auch Gerechtigkeit im Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Urteil ohne Heuchelei“; gemeint sein kann ein echtes, unverfälschtes und daher unparteiisches Urteil.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐνδύσεται
  choice: wird … anlegen
  rationale: Das Futur Medium bezeichnet hier das bewusste Anlegen einer Rüstung; „anlegen“ ist im Deutschen bei einem Brustpanzer natürlich.
- source_word: θώρακα
  choice: Brustpanzer
  rationale: Bezeichnet die den Oberkörper schützende militärische Rüstung und bewahrt das Bild klar und anschaulich.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl die moralische Rechtschaffenheit als auch gerechtes Handeln besser ab als eine stärker individualethische Wiedergabe wie „Rechtschaffenheit“.
- source_word: περιθήσεται
  choice: wird sich … aufsetzen
  rationale: Das Futur Medium von περιτίθημι bedeutet, etwas um beziehungsweise auf sich zu legen; bei einem Helm ist „sich aufsetzen“ idiomatisch und wahrt den reflexiven Sinn.
- source_word: κόρυθα
  choice: Helm
  rationale: Direkte und geläufige Bezeichnung für die militärische Kopfbedeckung.
- source_word: κρίσιν
  choice: Urteil
  rationale: Bewahrt den forensischen Sinn von κρίσις. Das artikellose Abstraktum wird ebenfalls ohne Artikel wiedergegeben, damit es nicht unnötig auf einen einzelnen richterlichen Entscheid verengt wird.
- source_word: ἀνυπόκριτον
  choice: ungeheuchelt
  rationale: Gibt die Grundbedeutung „ohne Heuchelei, nicht vorgetäuscht“ direkt wieder, ohne die mögliche Folgerung „unparteiisch“ stillschweigend zur einzigen Bedeutung zu machen.
theological_decisions:
- issue: Bedeutungsbreite von δικαιοσύνη im Bild der göttlichen Rüstung
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der griechische Ausdruck kann sowohl eine moralische Eigenschaft als auch gerechtes Handeln bezeichnen. „Gerechtigkeit“ hält diese Spannung offen und vermeidet eine konfessionelle Engführung.
- issue: Deutung von ἀνυπόκριτον bei κρίσιν
  choice: ungeheucheltes Urteil
  alternative: unparteiisches Urteil
  rationale: „Unparteiisch“ ist im Zusammenhang mit einem Urteil plausibel, geht aber über die unmittelbare Bedeutung „ohne Heuchelei, echt“ hinaus. Der Haupttext bleibt daher näher am Griechischen; die kontextuelle Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rüstungsmetaphorik. Die leicht ungewöhnliche Verbindung „ungeheucheltes Urteil“ ist bewusst quellennah; die Fußnote erläutert sie, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
