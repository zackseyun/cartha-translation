base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/007.yaml
  text: We were filled with paths of lawlessness and destruction[a], and we traveled through trackless deserts[b], but the way of the Lord we did not know.
translation:
  language: de
  text: Wir waren erfüllt von Pfaden der Gesetzlosigkeit und des Verderbens[a] und durchquerten unwegsame Wüsten[b]; doch den Weg des Herrn kannten wir nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »mit Pfaden der Gesetzlosigkeit und des Verderbens erfüllt«.'
    reason: Die griechische Konstruktion und ihr ungewöhnliches Bild lassen sich im Deutschen nur schwer zugleich wörtlich und natürlich wiedergeben.
  - marker: b
    text: 'Oder: »unbetretbare Einöden«.'
    reason: ἀβάτους kann stärker »unbetretbar, unzugänglich« bedeuten; ἐρήμους kann auch allgemein »Einöden« bezeichnen.
lexical_decisions:
- source_word: ἀνομίας … τρίβοις καὶ ἀπωλείας
  choice: von Pfaden der Gesetzlosigkeit und des Verderbens
  rationale: Die Genitive beschreiben die Pfade als von Gesetzlosigkeit und Verderben geprägt. Die formelle Wendung bewahrt zugleich das auffällige griechische Bild, nach dem die Sprecher von solchen Pfaden »erfüllt« waren.
- source_word: ἐνεπλήσθημεν
  choice: wir waren erfüllt
  rationale: Die Wiedergabe erhält die passive Form und das ungewöhnliche Bild des griechischen Verbs.
- source_word: διωδεύσαμεν
  choice: durchquerten
  rationale: Das Verb bezeichnet das Durchziehen oder Durchschreiten eines Gebietes; »durchquerten« ist knapp und natürlich.
- source_word: ἐρήμους ἀβάτους
  choice: unwegsame Wüsten
  rationale: ἐρήμους bezeichnet öde, unbewohnte Gebiete; ἀβάτους solche, die nicht begehbar oder schwer zugänglich sind. »Unwegsame Wüsten« gibt beides idiomatisch wieder.
- source_word: τὴν … ὁδὸν Κυρίου
  choice: den Weg des Herrn
  rationale: Die traditionelle biblische Wendung wahrt sowohl die mögliche Bildlichkeit als auch den Kontrast zu den zuvor genannten Pfaden.
- source_word: οὐκ ἔγνωμεν
  choice: kannten wir nicht
  rationale: Die schlichte Formulierung entspricht dem rückblickenden Bekenntnis und lässt offen, ob fehlende Kenntnis oder fehlendes Erkennen im Vordergrund steht.
theological_decisions:
- issue: Bedeutung von »Weg des Herrn«
  choice: Die bildoffene Wendung »Weg des Herrn« bleibt unverändert stehen.
  alternative: Ausdrückliche Deutung als die vom Herrn gebotene Lebensführung oder als ein von ihm bestimmter Weg.
  rationale: Der Zusammenhang legt eine moralisch-geistliche Bedeutung nahe, doch die Übersetzung soll die Metapher nicht auf eine einzige Auslegung verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem griechischen Gegensatz zwischen den verderblichen Pfaden und dem Weg des Herrn; das auffällige Bild des Erfülltseins wird bewusst nicht geglättet.
