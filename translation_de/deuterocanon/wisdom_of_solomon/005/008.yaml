  language: de
  text: Was hat uns der Hochmut genützt? Und was hat uns Reichtum, gepaart mit Prahlerei, eingebracht?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερηφανία
  choice: Hochmut
  rationale: Bezeichnet hier überhebliche Selbsterhöhung; „Hochmut“ ist im Deutschen prägnant, würdevoll und im Kontext der rückblickenden Klage natürlich.
- source_word: πλοῦτος
  choice: Reichtum
  rationale: Direkte und kontextgerechte Wiedergabe des materiellen Wohlstands.
- source_word: μετὰ ἀλαζονίας
  choice: gepaart mit Prahlerei
  rationale: ἀλαζονία bezeichnet prahlerisches, anmaßendes Auftreten. „Gepaart mit“ gibt die Verbindung mit dem Reichtum idiomatisch wieder, ohne eine stärkere kausale Aussage einzutragen.
- source_word: συμβέβληται ἡμῖν
  choice: hat uns … eingebracht
  rationale: Das Perfekt fragt rückblickend nach dem tatsächlichen Ertrag oder Nutzen. „Eingebracht“ bewahrt den wirtschaftlichen Unterton im Zusammenhang mit Reichtum und klingt im Deutschen natürlich.
theological_decisions:
- issue: Verhältnis von Reichtum und Prahlerei
  choice: Reichtum, gepaart mit Prahlerei
  alternative: Reichtum samt Prahlerei
  rationale: Die Formulierung hält beide Größen eng zusammen, behauptet aber nicht, Reichtum sei an sich Prahlerei oder notwendig sündhaft.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem rhetorischem Parallelismus. Die beiden Fragen bewahren den bekennenden, rückblickenden Ton des griechischen Textes.
