base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/016.yaml
  text: Therefore they will receive the kingdom of splendor and the crown of beauty from the hand of the Lord[a], because with his right hand he will shelter them[b], and with his arm he will defend them.
translation:
  language: de
  text: Darum werden sie das Reich der Pracht und die Krone[a] der Schönheit aus der Hand des Herrn empfangen; denn mit seiner Rechten wird er sie beschirmen und mit seinem Arm verteidigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Diadem«. Das griechische Wort bezeichnet eigens einen königlichen Kopfschmuck.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische sagt wörtlich: »für sie verteidigen«; die Wendung betont, dass er zu ihren Gunsten handelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den folgernden Anschluss an die vorausgehende Rechtfertigung der Gerechten knapp und natürlich wieder.
- source_word: λήμψονται
  choice: werden sie … empfangen
  rationale: Im Zusammenhang mit »aus der Hand des Herrn« steht das Empfangen einer Gabe im Vordergrund, nicht ein eigenmächtiges Ergreifen.
- source_word: τὸ βασίλειον
  choice: das Reich
  rationale: Bewahrt die konkrete königliche Bildsprache und lässt offen, ob Herrschaft, Königtum oder das verliehene Reich besonders betont ist.
- source_word: τῆς εὐπρεπείας
  choice: der Pracht
  rationale: εὐπρέπεια bezeichnet ansehnliche, angemessene Schönheit beziehungsweise herrscherliche Pracht; »Pracht« passt zur königlichen Bildwelt.
- source_word: τὸ διάδημα
  choice: die Krone
  rationale: Eine verständliche deutsche Wiedergabe des königlichen Kopfschmucks; die genauere Bedeutung »Diadem« wird in der Fußnote genannt.
- source_word: τοῦ κάλλους
  choice: der Schönheit
  rationale: Gibt die ästhetische Grundbedeutung von κάλλος unmittelbar wieder, ohne sie zu »Herrlichkeit« umzudeuten.
- source_word: ἐκ χειρὸς Κυρίου
  choice: aus der Hand des Herrn
  rationale: Bewahrt das personale Bild Gottes als des Gebers und folgt dem biblischen Sprachgebrauch für κύριος.
- source_word: τῇ δεξιᾷ
  choice: mit seiner Rechten
  rationale: Der instrumentale Dativ wird natürlich wiedergegeben; »die Rechte« bewahrt zugleich den würdevollen biblischen Bildausdruck.
- source_word: σκεπάσει
  choice: wird er … beschirmen
  rationale: Vermittelt sowohl das Bedecken als auch den dadurch gewährten Schutz und unterscheidet sich vom folgenden Verteidigen.
- source_word: τῷ βραχίονι
  choice: mit seinem Arm
  rationale: Bewahrt das biblische Bild der wirksam werdenden göttlichen Kraft.
- source_word: ὑπερασπιεῖ αὐτῶν
  choice: wird er sie verteidigen
  rationale: Idiomatiche Wiedergabe des Eintretens und Kämpfens zugunsten anderer; die zugrunde liegende Wendung »für sie« wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« entspricht dem etablierten biblischen Gottesprädikat und bezeichnet hier Gott als souveränen Geber und Beschützer.
- issue: Art der den Gerechten verheißenen Belohnung
  choice: Die königliche Bildsprache mit »Reich« und »Krone« bleibt konkret erhalten.
  alternative: Abstrakte Deutung als königliche Ehre oder herrliche Herrschaft
  rationale: Der griechische Text verbindet konkrete königliche Begriffe. Die Übersetzung entscheidet nicht, ob sie ausschließlich metaphorisch oder als wirkliche Teilhabe an Herrschaft zu verstehen sind.
- issue: Bedeutungsspielraum von βασίλειον
  choice: Reich
  alternative: königliche Insigne / Königskrone
  rationale: Die Form kann im Kontext königlicher Symbolik unterschiedlich eingeordnet werden. »Reich« folgt der naheliegenden substantivischen Lesart und wahrt die Spannung zur unmittelbar folgenden Krone, ohne beide Gegenstände gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelbilder »mit seiner Rechten« und »mit seinem Arm« sowie die königliche Bildsprache bleiben erhalten; das Semikolon macht den begründenden Anschluss von ὅτι klar.
