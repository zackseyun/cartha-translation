base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/011.yaml
  text: 'or like a bird flying through the air: no evidence of its path is found[a], though the light air, whipped by the stroke of its pinions and split by force with the whirring of moving wings, was traversed[b], and after that no sign of its passage was found in it.'
translation:
  language: de
  text: 'Oder wie ein Vogel, der durch die Luft fliegt: Keine nachweisbare Spur seines Weges ist zu finden.[a] Die leichte Luft[b] wird vom Schlag seiner Flügel gepeitscht, durch das gewaltsame Schwirren der bewegten Flügel gespalten und durchquert; doch danach findet sich in ihr kein Zeichen seines Durchflugs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kein Beweis für seinen Weg ist zu finden.« Das griechische τεκμήριον bezeichnet ein beweiskräftiges Anzeichen, πορεία den zurückgelegten Weg.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische πνεῦμα κοῦφον kann hier auch mit »ein leichter Lufthauch« oder »eine sanfte Luftströmung« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρνέου διιπτάντος ἀέρα
  choice: bei einem Vogel, der durch die Luft fliegt
  rationale: Gibt das Bild eines Vogels wieder, der den Luftraum durchfliegt, ohne die nicht näher bestimmte Vogelart zu präzisieren.
- source_word: τεκμήριον πορείας
  choice: Beweis für seinen Weg
  rationale: 'τεκμήριον bezeichnet mehr als eine bloße Spur: ein erkennbares, beweiskräftiges Anzeichen; πορεία meint hier den zurückgelegten Weg oder die Flugbahn.'
- source_word: πληγῇ ... ταρσῶν
  choice: vom Schlag seiner Schwingen
  rationale: Der instrumentale Dativ bezeichnet den Flügelschlag als Mittel; »Schwingen« wahrt gegenüber dem späteren πτερύγων eine leichte lexikalische Unterscheidung.
- source_word: μαστιζόμενον
  choice: gepeitscht
  rationale: Bewahrt das kräftige Bild, wonach die Luft durch den Flügelschlag gleichsam gegeißelt wird.
- source_word: πνεῦμα κοῦφον
  choice: die leichte Luft
  rationale: Im Zusammenhang bezeichnet πνεῦμα das leichte, vom Vogel durchquerte Medium; »Luft« ist hier treffender als »Wind« oder »Atem«.
- source_word: σχιζόμενον βίᾳ ῥοιζῷ κινουμένων πτερύγων
  choice: vom Schwirren der bewegten Flügel gewaltsam zerteilt
  rationale: Bewahrt das Zerteilen der Luft, die Gewalt der Bewegung und das hörbare Schwirren beziehungsweise Rauschen der Flügel.
- source_word: διωδεύθη
  choice: durchquert
  rationale: Die Passivform stellt die Luft als das Medium dar, durch das der Vogel hindurchgeht.
- source_word: σημεῖον ἐπιβάσεως
  choice: Zeichen seines Vorüberziehens
  rationale: Gibt das nach dem Durchflug nicht zurückbleibende Zeichen der Bewegung natürlich wieder, ohne eine dauerhafte materielle Spur vorauszusetzen.
