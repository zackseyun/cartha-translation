  text: And hailstones full of stony wrath will be hurled, and the water of the sea will rage against them; and rivers will suddenly overwhelm them.
translation:
  language: de
  text: Und aus einer Steinschleuder werden Hagelkörner geschleudert, voller Zorn; das Wasser des Meeres wird gegen sie aufbegehren, und Flüsse werden jäh über sie hereinbrechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πετροβόλου
  choice: aus einer Steinschleuder
  rationale: πετροβόλος bezeichnet hier am natürlichsten ein Gerät zum Schleudern von Steinen. Die Präposition ἐκ gibt den Ausgangspunkt an.
- source_word: θυμοῦ πλήρεις
  choice: voller Zorn
  rationale: θυμός bezeichnet heftigen Zorn oder Grimm; die personifizierende Bildsprache wird bewahrt, ohne den Zorn ausdrücklich Gott oder den Hagelkörnern als eigenständigem Willen zuzuschreiben.
- source_word: ῥιφήσονται χάλαζαι
  choice: werden Hagelkörner geschleudert
  rationale: Das Passiv von ῥίπτω beschreibt ein kraftvolles Schleudern; χάλαζαι ist hier konkret als einzelne Hagelkörner wiedergegeben.
- source_word: ἀγανακτήσει
  choice: wird … aufbegehren
  rationale: Das Verb kann Entrüstung und feindseliges Aufbegehren ausdrücken; die Personifikation des Meerwassers bleibt erhalten.
- source_word: συγκλύσουσιν
  choice: werden … überfluten
  rationale: Das Verb bezeichnet ein gemeinsames oder vollständiges Überschwemmen beziehungsweise Überwältigen durch Wasser.
- source_word: ἀποτόμως
  choice: mit unerbittlicher Gewalt
  rationale: ἀποτόμως kann plötzlich, schroff oder unnachgiebig bedeuten. Im Gerichtskontext ist die gewaltsame, unerbittliche Art des Überflutens wahrscheinlich; die semantische Alternative wird in einer Fußnote festgehalten.
theological_decisions:
- issue: Personifizierung der Schöpfung als Werkzeug des Gerichts
  choice: Meer und Flüsse bleiben grammatisch handelnde Größen
  alternative: Gott ausdrücklich als Handelnden ergänzen
  rationale: Der griechische Text personifiziert die Naturgewalten und nennt Gott in diesem Vers nicht ausdrücklich; eine Ergänzung würde die theologische Bildspannung auflösen.
- issue: Zuordnung des Zorns in θυμοῦ πλήρεις
  choice: Die Hagelkörner sind bildlich „voller Zorn“
  alternative: „voll von zorniger Wucht“ oder ausdrückliche Zuordnung zu Gottes Zorn
  rationale: Der Genitiv bleibt im Griechischen bildhaft und theologisch offen. Die Übersetzung vermeidet eine nicht ausdrücklich markierte Besitzzuordnung.
translation_notes:
  register: Dignitärer, moderner deutscher Erzählstil mit kräftiger poetischer Bildsprache. Die ungewöhnliche Metapher der Steinschleuder wird quellennah bewahrt; die Satzglieder folgen dem griechischen Aufbau, bleiben aber flüssig lesbar.
