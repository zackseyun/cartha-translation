  text: and as a proverb of reproach among fools[a]. We considered his life madness, and his end dishonorable[b];
translation:
  language: de
  text: und zum Spottwort – wir Toren![a] Sein Leben hielten wir für Wahnsinn und sein Ende für ehrlos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum sprichwörtlichen Gegenstand des Hohns“. Das griechische Wort kann ein Sprichwort, ein öffentliches Spottwort oder ein beispielhaftes Sinnbild bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinen Tod für ehrlos“. Mit „Ende“ kann hier besonders sein Tod beziehungsweise die Art seines Todes gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραβολήν ὀνειδισμοῦ
  choice: Spottwort
  rationale: Die Verbindung bezeichnet hier ein sprichwörtliches Wort beziehungsweise öffentliches Beispiel des Hohns. „Spottwort“ gibt beides knapp und idiomatisch wieder; die Fußnote bewahrt die Bedeutungsbreite von παραβολή.
- source_word: οἱ ἄφρονες
  choice: wir Toren
  rationale: Der nominativische Einschub kennzeichnet rückblickend die Sprecher selbst. „Wir Toren“ bewahrt den abrupten, bekenntnishaften Ausruf und den würdigen biblischen Ton.
- source_word: ἐλογισάμεθα
  choice: hielten … für
  rationale: Die deutsche Konstruktion gibt das bewertende Urteil des griechischen Verbs natürlich und präzise wieder.
- source_word: βίον
  choice: Leben
  rationale: βίος meint hier das gelebte Leben beziehungsweise die Lebensführung des Gerechten; „Leben“ ist knapp und lässt diese Nuance offen.
- source_word: μανίαν
  choice: Wahnsinn
  rationale: Das starke Wort bewahrt die verächtliche Einschätzung der Sprecher und entspricht der Bedeutung von μανία.
- source_word: τελευτήν
  choice: Ende
  rationale: „Ende“ wahrt die weitere Bedeutung des griechischen Ausdrucks, der im Zusammenhang besonders auf den Tod zielen kann.
- source_word: ἄτιμον
  choice: ehrlos
  rationale: „Ehrlos“ gibt das Fehlen beziehungsweise Vorenthalten von Ehre knapp wieder, ohne die Aussage unnötig zu verstärken.
theological_decisions:
- issue: Sprecherperspektive im rückblickenden Bekenntnis
  choice: 'οἱ ἄφρονες wird als Selbstbezeichnung der in der ersten Person redenden Frevler wiedergegeben: „wir Toren“'
  alternative: 'Eine distanzierte Erzählerbemerkung: „die Toren“'
  rationale: Der weitere Zusammenhang und die erste Person Plural in ἐλογισάμεθα zeigen, dass die Sprecher ihr früheres Fehlurteil selbst eingestehen. Die Übersetzung erhält diesen Perspektivwechsel und glättet ihn nicht zu einer Erzähleraussage.
- issue: τελευτή als allgemeines Ende oder ausdrücklich Tod
  choice: Ende
  alternative: Tod
  rationale: Die allgemeinere Wiedergabe bewahrt die lexikalische Offenheit des Griechischen; eine Fußnote macht deutlich, dass konkret der Tod beziehungsweise die Todesart gemeint sein kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eröffnende Satzteil bleibt als Fortsetzung des vorangehenden Verses syntaktisch fragmentarisch; der Gedankenstrich markiert den abrupten selbstanklagenden Einschub „wir Toren!“. „Spottwort“ ist verständlich und bibelsprachlich, ohne das engere moderne Verständnis von „Gleichnis“ in den Text einzutragen.
