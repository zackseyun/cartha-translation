base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/001.yaml
  text: Then the righteous man will stand with great boldness before those who afflicted him and those who disregarded his labors[a][b][c].
translation:
  language: de
  text: Dann wird der Gerechte mit großer Kühnheit[a] vor denen stehen, die ihn bedrängt haben und seine Mühen[b] missachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit großer Zuversicht“. Das griechische Wort kann Kühnheit, Freimütigkeit und zuversichtliche Offenheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Mühen“ kann hier auch Beschwernisse, Leiden oder Schmerzen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Das Temporaladverb leitet die nun folgende Szene ein; „Dann“ ist natürlich und prägnant.
- source_word: στήσεται
  choice: wird … stehen
  rationale: Das Futur Medium von ἵστημι bezeichnet hier das Auftreten beziehungsweise Stehen des nun gerechtfertigten Gerechten, ohne ausdrücklich ein göttliches Passiv anzunehmen.
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: mit großer Kühnheit
  rationale: παρρησία umfasst freimütiges, öffentliches Auftreten sowie Zuversicht; „Kühnheit“ bewahrt in dieser Konfrontationsszene die nach außen sichtbare Unerschrockenheit.
- source_word: ὁ δίκαιος
  choice: der Gerechte
  rationale: Der substantivierte maskuline Singular wird im Deutschen genau und idiomatisch mit „der Gerechte“ wiedergegeben.
- source_word: κατὰ πρόσωπον
  choice: vor
  rationale: Die Wendung bedeutet, dass er den anderen unmittelbar gegenübertritt. Das natürliche deutsche „vor“ vermittelt dies, ohne die semitisch anmutende Körperteilmetapher nachzuahmen.
- source_word: τῶν θλιψάντων αὐτὸν
  choice: denen, die ihn bedrängt … haben
  rationale: θλίβω kann bedrängen, unter Druck setzen oder schwer zusetzen bedeuten. „bedrängt“ bewahrt die Breite des Ausdrucks.
- source_word: τῶν ἀθετούντων
  choice: … missachtet haben
  rationale: ἀθετέω bezeichnet ein Verwerfen, Beiseitesetzen oder Für-nichtig-Erklären; beim Objekt „Mühen“ ist „missachten“ idiomatisch und sachgerecht.
- source_word: τοὺς πόνους αὐτοῦ
  choice: seine Mühen
  rationale: πόνος kann Mühe, schwere Arbeit, Beschwernis oder Leiden bezeichnen. „Mühen“ lässt Anstrengung und erlittene Härte anklingen, ohne die Bedeutung unnötig einzuengen.
theological_decisions:
- issue: Singular und Geschlecht von ὁ δίκαιος
  choice: der Gerechte
  alternative: der gerechte Mensch
  rationale: Der griechische Text spricht im maskulinen Singular. „Der Gerechte“ wahrt diese Form und kann zugleich repräsentativ verstanden werden, ohne sie im Text zu neutralisieren.
- issue: Bedeutungsnuance von παρρησία in der Gerichtsszene
  choice: mit großer Kühnheit
  alternative: mit großer Zuversicht
  rationale: „Kühnheit“ hebt das offene, unerschrockene Auftreten vor den früheren Bedrängern hervor; „Zuversicht“ wäre ebenfalls möglich, klingt aber stärker nach einer inneren Haltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, wird aber durch die gemeinsame Perfektkonstruktion („bedrängt und … missachtet haben“) natürlich gestaltet. Die unmittelbare Gegenüberstellung von Gerechtem und Bedrängern bleibt erhalten.
