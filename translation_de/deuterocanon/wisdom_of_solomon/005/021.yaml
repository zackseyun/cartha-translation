base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/021.yaml
  text: Well-aimed bolts of lightning will go forth[a], and like from a well-drawn bow of clouds they will leap to the target[b],
translation:
  language: de
  text: Treffsichere Blitzgeschosse werden dahinfahren, und wie von einem wohlgekrümmten Bogen aus Wolken[a] werden sie auf das Ziel zuschnellen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „von einem wohlgerundeten Bogen der Wolken“. Das Bild kann an einen Sturm- oder Regenbogen erinnern, doch der griechische Text sagt nicht ausdrücklich „Regenbogen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden sie zum Ziel springen“ beziehungsweise „fliegen“. Das griechische Verb beschreibt hier anschaulich eine schnelle Bewegung auf die Zielmarke zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: πορεύσονται
  choice: werden dahinfahren
  rationale: Das Futur von πορεύομαι bezeichnet hier das machtvolle Ausziehen beziehungsweise die gerichtete Bewegung der Geschosse. „Dahinfahren“ klingt im Deutschen natürlich und passt zur Schnelligkeit von Blitzen.
- source_word: εὔστοχοι βολίδες ἀστραπῶν
  choice: treffsichere Blitzgeschosse
  rationale: εὔστοχοι bezeichnet etwas, das sein Ziel sicher trifft; βολίδες sind Wurf- oder Schussgeschosse, und der Genitiv ἀστραπῶν kennzeichnet sie als Geschosse aus beziehungsweise von Blitzen. Das Kompositum bewahrt das Waffenbild knapp und verständlich.
- source_word: ὡς ἀπὸ εὐκύκλου τόξου τῶν νεφῶν
  choice: wie von einem wohlgekrümmten Bogen aus Wolken
  rationale: εὔκυκλος bedeutet wörtlich „schön gerundet“ oder „wohlgekrümmt“, nicht ausdrücklich „gespannt“. Der Genitiv τῶν νεφῶν bleibt als bildhafte Zuordnung zu den Wolken erhalten, ohne ihn im Haupttext eindeutig als Regenbogen festzulegen.
- source_word: ἐπὶ σκοπόν
  choice: auf das Ziel
  rationale: σκοπός bezeichnet die Zielmarke oder das Ziel. Mit der gerichteten Bewegung des Verbs ist „auf das Ziel“ idiomatisch und präzise.
- source_word: ἁλοῦνται
  choice: werden sie zuschnellen
  rationale: Das anschauliche Verb vermittelt eine rasche, sprungartige Bewegung auf das Ziel zu. „Zuschnellen“ bewahrt Dynamik und Richtung, ohne die Blitze ausdrücklich als von einer fremden Kraft geschleudert darzustellen.
theological_decisions:
- issue: Mögliche Anspielung des Wolkenbogens auf den Regenbogen oder einen himmlischen Sturmbogen
  choice: „Bogen aus Wolken“ im Haupttext
  alternative: „Regenbogen“ oder „Bogen in den Wolken“
  rationale: Der griechische Wortlaut nennt einen „Bogen der Wolken“, nicht ausdrücklich einen Regenbogen. Die offenere Wiedergabe bewahrt die poetische und möglicherweise kosmisch-kriegerische Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdige poetische Sprache. „Blitzgeschosse“ erhält das kriegerische Naturbild; „wohlgekrümmt“ folgt εὐκύκλου genauer als eine funktional interpretierende Wiedergabe wie „wohlgespannt“.
