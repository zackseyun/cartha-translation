base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/002.yaml
  text: For when lawless men supposed that they were oppressing a holy nation[a], they lay imprisoned by darkness and bound fast by a long night, shut in under their roofs[c][b], fugitives from eternal providence.
translation:
  language: de
  text: Denn die Gesetzlosen[a] meinten, ein heiliges Volk unterdrücken zu können; als Gefangene der Finsternis und von einer langen Nacht Gefesselte[b], unter ihren Dächern eingeschlossen und auf der Flucht vor der ewigen Vorsehung[c], lagen sie da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „gesetzlose Männer“. Das griechische Adjektiv steht im maskulinen Plural und wird substantivisch gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Gefangene der Finsternis und an eine lange Nacht gefesselt“.'
    reason: lexical_alternative
  - marker: c
    text: „Vorsehung“ gibt das griechische πρόνοια wieder; gemeint ist hier wahrscheinlich Gottes bleibende, ordnende Fürsorge, nicht nur Voraussicht.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπειληφότες
  choice: meinten
  rationale: Das Perfektpartizip bezeichnet eine vorausgesetzte, hier irrige und vermessene Annahme. „Meinten“ gibt dies natürlich wieder, ohne den Sinn auf bloße Einbildung zu verengen.
- source_word: καταδυναστεύειν
  choice: unterdrücken zu können
  rationale: Das Verb bezeichnet gewaltsame Machtausübung und Unterdrückung. Die Ergänzung „zu können“ macht im Deutschen deutlich, dass dies der Inhalt ihrer vermeintlichen Annahme war.
- source_word: ἔθνος ἅγιον
  choice: ein heiliges Volk
  rationale: „Volk“ ist im Deutschen die natürliche Wiedergabe von ἔθνος im biblischen Bundeszusammenhang und bewahrt den Anklang an die Bezeichnung Israels als heiliges Volk.
- source_word: ἄνομοι
  choice: die Gesetzlosen
  rationale: Das maskuline Pluraladjektiv wird substantivisch gebraucht. „Die Gesetzlosen“ wahrt die moralische Charakterisierung, ohne unnötig ein zusätzliches Substantiv einzuführen.
- source_word: δέσμιοι σκότους
  choice: Gefangene der Finsternis
  rationale: δέσμιοι bezeichnet Gefangene oder Gebundene. Die nominale Form bewahrt die bildhafte Parallelität mit πεδῆται.
- source_word: μακρᾶς πεδῆται νυκτός
  choice: Gefesselte einer langen Nacht
  rationale: πεδῆται ruft das Bild von Fesseln hervor. Die Genitivkonstruktion lässt wie im Griechischen offen, ob die Nacht als fesselnde Macht oder als Bereich der Gefangenschaft verstanden wird.
- source_word: κατακλεισθέντες ὀρόφοις
  choice: eingeschlossen unter ihren Dächern
  rationale: Die konkrete Dachvorstellung von ὀρόφοις bleibt erhalten; zugleich ist die Formulierung im Deutschen als Hinweis auf die Häuser verständlich, in denen sie eingeschlossen waren.
- source_word: φυγάδες
  choice: auf der Flucht
  rationale: Das Wort bezeichnet Flüchtige beziehungsweise Menschen auf der Flucht. Die adverbiale Form klingt im Deutschen natürlich und erhält die Ironie, dass die Eingeschlossenen zugleich vor der göttlichen Ordnung fliehen.
- source_word: τῆς αἰωνίου προνοίας
  choice: vor der ewigen Vorsehung
  rationale: πρόνοια bezeichnet hier im Kontext der Weisheitsschrift wahrscheinlich Gottes beständige, ordnende Fürsorge und nicht lediglich Voraussicht. „Vorsehung“ bewahrt diese theologische Bedeutung.
- source_word: ἔκειντο
  choice: sie lagen da
  rationale: Die statische, szenische Aussage des Imperfekts wird anschaulich und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bedeutung von πρόνοια im Kontext der Weisheitsschrift
  choice: Vorsehung
  alternative: Voraussicht
  rationale: Im Kontext bezeichnet πρόνοια wahrscheinlich Gottes fortdauerndes ordnendes und fürsorgliches Wirken. „Vorsehung“ wahrt dieses Gewicht, während „Voraussicht“ den Ausdruck auf vorheriges Wissen verengen könnte.
- issue: Substantiviertes maskulines ἄνομοι
  choice: die Gesetzlosen
  alternative: gesetzlose Menschen
  rationale: Die substantivische Wiedergabe folgt der Form des Griechischen und bleibt im Deutschen generisch verständlich, ohne dem Text eine zusätzliche geschlechtliche Präzisierung aufzuzwingen.
- issue: Verhältnis von Finsternis und langer Nacht zur Gefangenschaft
  choice: Gefangene der Finsternis und Gefesselte einer langen Nacht
  alternative: von der Finsternis gefangen und von einer langen Nacht gefesselt
  rationale: Die nominale Fassung erhält die poetische Parallelität und lässt die genauen semantischen Beziehungen der Genitive offen, statt sie ausdrücklich als handelnde Ursachen festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Bildhaftigkeit. Das Semikolon verdeutlicht den Umschlag zwischen der vermessenen Annahme der Unterdrücker und ihrer tatsächlichen Lage. Die konkreten Bilder von Gefangenschaft, Fesseln, Dächern und Flucht bleiben erhalten.
