  text: But expectation, being weaker from within, counts ignorance of the cause that brings the torment as a greater thing.
translation:
  language: de
  text: Doch die Erwartung, die innerlich schwächer ist, hält die Unkenntnis der Ursache, die die Qual hervorruft, für größer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hält es für schlimmer, die Ursache der Qual nicht zu kennen“. Wörtlich heißt es, die Erwartung halte „die Unkenntnis der Ursache, die die Qual hervorruft, für größer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδοθεν
  choice: von innen her
  rationale: Bewahrt die Aussage, dass die Schwäche aus dem Inneren kommt, ohne sie psychologisch weiter auszudeuten.
- source_word: ἥττων
  choice: schwächer
  rationale: Gibt den Komparativ unmittelbar und im Deutschen verständlich wieder.
- source_word: προσδοκία
  choice: Erwartung
  rationale: Der Ausdruck bleibt gegenüber Deutungen wie Vorahnung oder Befürchtung bewusst offen.
- source_word: πλείονα λογίζεται
  choice: hält ... für größer
  rationale: Natürliches Deutsch für das wertende beziehungsweise vergleichende Urteil des griechischen Ausdrucks; die ungewöhnliche Offenheit des Vergleichs bleibt erhalten.
- source_word: ἄγνοιαν
  choice: Unkenntnis
  rationale: Bezeichnet sachlich das Nichtwissen und klingt hier natürlicher als das möglicherweise vorwurfsvollere „Unwissenheit“.
- source_word: τῆς παρεχούσης τὴν βάσανον αἰτίας
  choice: der Ursache, die die Qual hervorruft
  rationale: Erhält die grammatische Beziehung, wonach die Ursache die Qual bewirkt; „Qual“ gibt βάσανος in diesem Kontext angemessen intensiv wieder.
