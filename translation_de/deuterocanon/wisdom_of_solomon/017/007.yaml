translation:
  language: de
  text: Die Gaukeleien der Zauberkunst lagen am Boden, und das überhebliche Prahlen mit Einsicht wurde schmachvoll widerlegt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαγικῆς … τέχνης
  choice: der Zauberkunst
  rationale: Gibt die magische Kunst beziehungsweise Praxis direkt und in natürlichem modernem Deutsch wieder.
- source_word: ἐμπαίγματα
  choice: Gaukeleien
  rationale: Bezeichnet hier trügerische Kunststücke oder Blendwerk; „Gaukeleien“ bewahrt den abwertenden Ton und passt zur Zauberkunst.
- source_word: κατέκειτο
  choice: lagen am Boden
  rationale: Bewahrt das anschauliche Bild des Daniederliegens und bringt das Scheitern der magischen Künste zum Ausdruck.
- source_word: τῆς ἐπὶ φρονήσει ἀλαζονίας
  choice: ihr überheblicher Anspruch auf Einsicht
  rationale: ἀλαζονία bezeichnet prahlerische Überheblichkeit; ἐπὶ φρονήσει benennt deren Grundlage oder Gegenstand, nämlich Einsicht beziehungsweise Klugheit. Die Formulierung vermeidet, φρόνησις vorschnell mit theologischer „Weisheit“ gleichzusetzen.
- source_word: ἔλεγχος
  choice: wurde … entlarvt
  rationale: Gibt die öffentliche Widerlegung beziehungsweise Bloßstellung idiomatisch wieder.
- source_word: ἐφύβριστος
  choice: auf schimpfliche Weise
  rationale: Bewahrt die ungewöhnlich starke Aussage, dass die Entlarvung von Schmach beziehungsweise Demütigung geprägt war.
theological_decisions:
- issue: Bedeutung von φρόνησις
  choice: Einsicht
  alternative: Weisheit / Klugheit
  rationale: Im Kontext geht es um den vermessenen Anspruch der ägyptischen Zauberkünstler auf geistige Kompetenz. „Einsicht“ wahrt den kognitiven Sinn, ohne echte göttliche Weisheit mit ihrer Prahlerei gleichzusetzen.
- issue: Bezug der Überheblichkeit
  choice: „ihr“ bezieht die Überheblichkeit sinngemäß auf die Vertreter der Zauberkunst
  alternative: 'unpersönlich: „die Überheblichkeit wegen ihrer Einsicht“'
  rationale: Der griechische Ausdruck nennt kein ausdrückliches Possessivpronomen, doch der Kontext legt die Zauberkundigen als Träger des Anspruchs nahe. Die deutsche Fassung macht diesen Zusammenhang lesbar, ohne eine zusätzliche Lehrbehauptung einzuführen.
translation_notes:
  register: Dignifikantes, bildhaftes Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erkennbar; „Gaukeleien“ und „lagen am Boden“ bewahren den spöttisch-demütigenden Ton des Verses.
