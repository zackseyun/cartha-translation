base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/003.yaml
  text: For while they thought to remain hidden in their secret sins[a], they were scattered under the dark veil of forgetfulness, terribly aghast and shaken by apparitions.
translation:
  language: de
  text: Denn während sie meinten, bei ihren geheimen Sünden unbemerkt zu bleiben, wurden sie unter einem lichtlosen Schleier des Vergessens zerstreut, von furchtbarem Entsetzen gepackt und durch Erscheinungen[a] aufgewühlt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Trugbilder“, „Phantome“ oder „Schreckgestalten“. Das griechische Wort kann eine bildähnliche oder gespenstische Erscheinung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνειν
  choice: unbemerkt zu bleiben
  rationale: Das Verb bezeichnet, dass jemand der Wahrnehmung entgeht oder verborgen bleibt. Die Formulierung gibt den Inhalt ihres vermeintlichen Sich-Verbergens natürlich wieder.
- source_word: κρυφαίοις ἁμαρτήμασιν
  choice: mit ihren geheimen Sünden
  rationale: κρυφαῖος bedeutet „verborgen“ oder „geheim“, ἁμάρτημα eine Sünde beziehungsweise sündige Tat. „Geheime Sünden“ bewahrt die moralische Aussage und den Bezug auf ihr verborgenes Handeln.
- source_word: ἀφεγγεῖ
  choice: lichtlosen
  rationale: Das Adjektiv bezeichnet das Fehlen von Licht. „Lichtlos“ ist genauer als nur „dunkel“ und passt zur dichten Bildsprache des Verses.
- source_word: λήθης
  choice: des Vergessens
  rationale: λήθη kann Vergessen, Vergesslichkeit oder Vergessenheit bedeuten. „Des Vergessens“ erhält die Genitivverbindung, ohne eine metaphysische Bedeutung von „Untergang“ oder „Nichts“ einzutragen.
- source_word: παρακαλύμματι
  choice: Schleier
  rationale: Das Wort bezeichnet eine Bedeckung oder Verhüllung. „Schleier“ bewahrt das Bild des Verbergens und klingt im Deutschen natürlich und würdig.
- source_word: ἐσκορπίσθησαν
  choice: wurden sie zerstreut
  rationale: Die Passivform von σκορπίζω bedeutet grundsätzlich „zerstreuen“ oder „auseinandertreiben“. Die wörtliche Bildlichkeit bleibt erhalten; die folgenden Partizipien schildern zusätzlich ihre innere Erschütterung.
- source_word: θαμβούμενοι δεινῶς
  choice: von furchtbarem Entsetzen gepackt
  rationale: θαμβέω bezeichnet starkes Erstaunen, Bestürzung oder Entsetzen; δεινῶς verstärkt dies erheblich. Die gewählte Wendung vermittelt in diesem Angstzusammenhang sowohl Schock als auch Schrecken.
- source_word: ἰνδάλμασιν
  choice: Erscheinungen
  rationale: ἴνδαλμα kann ein Bild, Trugbild, Phantom oder eine geisterhafte Erscheinung bezeichnen. „Erscheinungen“ wahrt die Offenheit zwischen innerlich wahrgenommenen Schreckbildern und äußerlich auftretenden Gestalten.
- source_word: ἐκταρασσόμενοι
  choice: aufgewühlt
  rationale: Das Verb bezeichnet heftige Beunruhigung oder Erschütterung. „Aufgewühlt“ gibt die starke innere Unruhe wieder, ohne den bereits ausgedrückten Schrecken unnötig zu verdoppeln.
theological_decisions:
- issue: Wesen der furchterregenden Phänomene in ἰνδάλμασιν
  choice: Erscheinungen
  alternative: Trugbilder, Phantome oder Schreckgestalten
  rationale: Der griechische Ausdruck legt nicht fest, ob es sich um subjektive Visionen oder objektiv auftretende, gespenstische Gestalten handelt. „Erscheinungen“ bewahrt diese echte Mehrdeutigkeit und trifft keine weitergehende ontologische Aussage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdiger, bildhafter Sprache. Die griechische Satzperiode wurde zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert; die logische Gegenüberstellung von vermeintlicher Verborgenheit und tatsächlichem Gericht bleibt erhalten.
