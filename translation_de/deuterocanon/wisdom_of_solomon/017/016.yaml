base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/016.yaml
  text: Then[a], whoever it might have been there, when he fell down, was kept under guard, shut up in that ironless prison.
translation:
  language: de
  text: Dann wurde jeder, der dort zu Boden fiel – ganz gleich, wer er war –, bewacht und in jenes Gefängnis ohne Eisen[a] eingeschlossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Gefängnis ohne Eisen“ – ein Bild für Gefangenschaft ohne eiserne Ketten oder Gitter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶθʼ οὕτως
  choice: Dann
  rationale: Kennzeichnet den Fortgang der Schilderung; das schlichte „Dann“ gibt den zeitlich-folgernden Übergang natürlich wieder.
- source_word: ὃς δὴ ποτʼ οὖν ἦν ἐκεῖ
  choice: jeder … ganz gleich, wer er war
  rationale: 'Die gehäuften Partikeln verstärken die Unbestimmtheit: Nicht die Identität ist entscheidend, sondern dass es jeden dort treffen konnte. Die Formulierung bewahrt zugleich den maskulinen Singular des Griechischen.'
- source_word: καταπίπτων
  choice: der dort zu Boden fiel
  rationale: Das Partizip bezeichnet einen begleitenden Umstand. „Zu Boden fiel“ erhält das konkrete Bild des Niederfallens, ohne es als bloßen Zusammenbruch auszudeuten.
- source_word: ἐφρουρεῖτο
  choice: wurde … bewacht
  rationale: Bewahrt das Passiv und den Sinn, unter Bewachung beziehungsweise in Gewahrsam gehalten zu werden.
- source_word: εἰς τὴν ἀσίδηρον εἱρκτήν
  choice: in jenes Gefängnis ohne Eisen
  rationale: ἀσίδηρος bedeutet wörtlich „ohne Eisen“. Die ungewöhnliche Wendung erhält das Bild einer Gefangenschaft ohne eiserne Ketten oder Gitter.
- source_word: κατακλεισθείς
  choice: eingeschlossen
  rationale: Gibt die Vorstellung des vollständigen Einschließens knapp und idiomatisch wieder und verstärkt wie im Griechischen das Gefängnisbild.
theological_decisions:
- issue: Geschlecht des unbestimmten Subjekts
  choice: jeder … wer er war
  alternative: alle … wer sie auch waren
  rationale: Der griechische Text verwendet einen grammatisch maskulinen Singular. Die deutsche Wiedergabe erhält diese Form, ohne daraus eine weitergehende Aussage über das Geschlecht abzuleiten.
- issue: Art der Gefangenschaft
  choice: Gefängnis ohne Eisen
  alternative: eisenloses Gefängnis
  rationale: Die wörtliche und auffällige Bildsprache bleibt stehen; der Text erklärt nicht ausdrücklich, ob ausschließlich Dunkelheit, Angst oder eine andere nichtmaterielle Macht die Gefangenschaft bewirkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eingeschobene Satzteil gibt die betonte Unbestimmtheit der griechischen Partikelfolge verständlich wieder; die ungewöhnliche Metapher „Gefängnis ohne Eisen“ bleibt bewusst erhalten.
