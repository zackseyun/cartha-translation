  text: For fear is nothing but the betrayal of the helps that come from reason[a].
translation:
  language: de
  text: Denn Angst ist nichts anderes als Verrat an den Hilfen, die vernünftiges Denken bietet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verrat an den Hilfsmitteln, die aus Überlegung hervorgehen.“'
    reason: Lexikalisch und syntaktisch mögliche, stärker formale Wiedergabe von βοηθημάτων und τῶν ἀπὸ λογισμοῦ.
lexical_decisions:
- source_word: φόβος
  choice: Angst
  rationale: Bezeichnet hier allgemein den Zustand des Fürchtens; „Angst“ ist im modernen Deutsch natürlich und übersteigert die Aussage nicht wie etwa „Entsetzen“.
- source_word: οὐθὲν ... εἰ μὴ
  choice: nichts anderes als
  rationale: Die ausschließende Wendung wird im Deutschen idiomatisch wiedergegeben und bewahrt den definierenden Charakter der Aussage.
- source_word: προδοσία
  choice: Verrat an
  rationale: Bewahrt das starke Bild einer treulosen Abkehr von den eigenen geistigen Hilfen. „Preisgabe“ wäre ebenfalls möglich, schwächt aber den personifizierenden Zug etwas ab.
- source_word: βοηθημάτων
  choice: Hilfen
  rationale: Gibt den konkreten Plural als verfügbare Mittel der Unterstützung knapp und verständlich wieder.
- source_word: τῶν ἀπὸ λογισμοῦ
  choice: die vernünftiges Denken bietet
  rationale: λόγισμος bezeichnet hier überlegendes, vernünftiges Denken. Die Formulierung drückt verständlich aus, dass die Hilfen daraus hervorgehen.
theological_decisions:
- issue: Anthropologische und philosophische Nuance von λόγισμος
  choice: vernünftiges Denken
  alternative: Vernunft; Überlegung
  rationale: Der Vers formuliert eine philosophische Beobachtung darüber, dass Angst die verfügbaren Hilfen besonnenen Denkens preisgibt. Die Wiedergabe vermeidet eine zusätzliche dogmatische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prägnante Definition und das starke Bild des Verrats bleiben erhalten; die etwas abstrakte griechische Genitivverbindung wird für gewöhnliche Leser natürlich aufgelöst.
