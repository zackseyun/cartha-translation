  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/018.yaml
  text: For all were bound with one chain of darkness—whether it was the whistling of wind[a], or the pleasant sound of birds among the leafy branches, or the rushing force of flowing water,
translation:
  language: de
  text: Denn alle waren mit einer einzigen Kette der Finsternis gebunden – sei es das Pfeifen des Windes[a], sei es der wohlklingende Laut von Vögeln im dichten Gezweig oder das Rauschen des gewaltsam strömenden Wassers,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Pfeifen eines Geistes“. Das griechische Wort πνεῦμα kann „Wind“ oder „Geist“ bedeuten; in dieser Reihe von Naturgeräuschen passt „Wind“ am besten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ ... ἁλύσει σκότους
  choice: mit ein und derselben Kette der Finsternis
  rationale: Der instrumentale Dativ wird mit „mit“ wiedergegeben. „Kette der Finsternis“ bewahrt das konkrete Bild; „ein und derselben“ bringt die gemeinsame Fesselung aller idiomatisch zum Ausdruck.
- source_word: πάντες ἐδέθησαν
  choice: alle waren ... gebunden
  rationale: Das Passiv und das Bild des Gefesseltseins bleiben erhalten.
- source_word: εἴ τε ... ἢ ... ἢ
  choice: sei es ... oder ... oder
  rationale: Die deutsche Korrelativkonstruktion gibt die Reihe möglicher Geräusche klar und würdig wieder.
- source_word: πνεῦμα συρίζον
  choice: das Pfeifen des Windes
  rationale: Im Zusammenhang mit Vogel- und Wassergeräuschen bezeichnet πνεῦμα am wahrscheinlichsten den Wind; συρίζον hebt dessen pfeifendes oder zischendes Geräusch hervor.
- source_word: περὶ ἀμφιλαφεῖς κλάδους
  choice: im dichten Gezweig
  rationale: ἀμφιλαφής bezeichnet dichtes, weit ausladendes beziehungsweise üppig belaubtes Geäst. „Im dichten Gezweig“ ist natürlich und bewahrt das Bild.
- source_word: ὀρνέων ἦχος εὐμελής
  choice: der wohlklingende Laut von Vögeln
  rationale: εὐμελής bedeutet melodisch oder wohlklingend; „Laut“ vermeidet die nicht ausdrücklich im Griechischen stehende Festlegung auf Gesang.
- source_word: ῥυθμὸς ὕδατος πορευομένου βίᾳ
  choice: das Tosen heftig strömenden Wassers
  rationale: ῥυθμός bezeichnet hier den hörbaren Bewegungsablauf; zusammen mit βίᾳ entsteht das Bild kraftvoll bewegten Wassers. „Tosen“ verbindet Geräusch und heftige Bewegung idiomatisch.
theological_decisions:
- issue: Bedeutung von πνεῦμα in der Aufzählung nächtlicher Geräusche
  choice: Wind
  alternative: Geist
  rationale: Die unmittelbare Reihe nennt Vögel und fließendes Wasser; daher ist „Wind“ kontextuell am wahrscheinlichsten. Die mögliche Bedeutung „Geist“ wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortlaufende Aufzählung und das abschließende Komma spiegeln wider, dass der Satz im folgenden Vers weitergeht. Das Fesselungsbild und die Mehrdeutigkeit von πνεῦμα bleiben erhalten.
