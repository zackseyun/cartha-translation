base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/008.yaml
  text: For those who promised to drive away fears and disturbances from a sick soul were themselves sick with a ridiculous fear[a].
translation:
  language: de
  text: Denn diejenigen, die versprachen, Schrecken und Unruhe aus einer kranken Seele zu vertreiben, litten gerade selbst an einer lächerlichen Ängstlichkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an einer lächerlichen Scheu«. Das griechische Wort kann auch »Vorsicht« oder sogar »Ehrfurcht« bedeuten; hier legt der Zusammenhang jedoch eine negative Bedeutung nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπισχνούμενοι
  choice: die versprachen
  rationale: Das Partizip bezeichnet ein Versprechen oder eine erklärte Zusage. »Die versprachen« gibt dies direkt und im Deutschen natürlich wieder.
- source_word: δείματα
  choice: Schrecken
  rationale: Der Plural bezeichnet furchterregende Empfindungen oder Schrecknisse. »Schrecken« bewahrt die Intensität und steht passend neben der inneren Unruhe.
- source_word: ταραχὰς
  choice: Unruhe
  rationale: Das Wort bezeichnet Erschütterung, Verwirrung oder innere Aufgewühltheit. Der deutsche Kollektivsingular »Unruhe« klingt hier natürlicher als ein abstrakter Plural.
- source_word: ἀπελαύνειν
  choice: zu vertreiben
  rationale: Das Verb bedeutet wegtreiben oder ausstoßen. »Vertreiben« ist bildkräftig und verbindet sich idiomatisch mit Schrecken und Unruhe.
- source_word: ψυχῆς νοσούσης
  choice: aus einer kranken Seele
  rationale: Die Krankheitsmetapher und der umfassende Sinn von ψυχή als inneres Leben werden mit »kranke Seele« bewahrt. »Aus« stellt im Deutschen natürlich den Bereich dar, aus dem Schrecken und Unruhe vertrieben werden sollen.
- source_word: οὗτοι
  choice: gerade selbst
  rationale: Das Demonstrativpronomen hebt ironisch hervor, dass ausgerechnet die genannten Personen selbst an dem entsprechenden Leiden erkrankt waren.
- source_word: καταγέλαστον
  choice: lächerlichen
  rationale: Das Adjektiv bedeutet des Auslachens oder Spotts würdig. »Lächerlich« erhält die deutlich abwertende Kraft.
- source_word: εὐλάβειαν
  choice: Ängstlichkeit
  rationale: Obwohl das Wort auch Vorsicht, Scheu oder Ehrfurcht bezeichnen kann, verlangt die Verbindung mit »lächerlich« und dem Angstmotiv des Kontextes hier wahrscheinlich eine negative Bedeutung. »Ängstlichkeit« gibt diese Haltung prägnant wieder.
- source_word: ἐνόσουν
  choice: litten … an
  rationale: Das Verb bedeutet krank sein. »An … leiden« ist idiomatisches Deutsch und bewahrt durch den vorausgehenden Ausdruck »kranke Seele« die wiederholte Krankheitsmetapher.
theological_decisions:
- issue: Bedeutung von εὐλάβεια im negativen Zusammenhang
  choice: Ängstlichkeit
  alternative: Vorsicht, Scheu oder Ehrfurcht
  rationale: Im unmittelbaren Zusammenhang geht es um Schrecken, innere Unruhe und Krankheit; zudem qualifiziert καταγέλαστον die εὐλάβεια als lächerlich. Eine positive religiöse Bedeutung wie »Ehrfurcht« wäre daher unwahrscheinlich. Die Fußnote hält die lexikalische Spannweite dennoch sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der Krankheitsmetapher sowie die Ironie zwischen dem versprochenen Vertreiben von Angst und der eigenen Ängstlichkeit bleiben erhalten. Der Kollektivsingular »Unruhe« vermeidet im Deutschen eine schwerfällige Abstraktbildung.
