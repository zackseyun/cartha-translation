  text: For what was not destroyed by fire simply melted when warmed by a brief ray of the sun,[a]
translation:
  language: de
  text: Denn was vom Feuer nicht vernichtet[a] wurde, schmolz einfach, als es von einem kurzen Sonnenstrahl erwärmt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: verzehrt. Das griechische Wort kann hier das Zugrundegehen unter der Einwirkung des Feuers bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φθειρόμενον
  choice: vernichtet
  rationale: Im Zusammenhang mit Feuer bezeichnet das Partizip materielles Zugrundegehen, nicht sittliche Verderbnis. „Vernichtet“ ist im Deutschen klar und bewahrt die Bedeutungsbreite.
- source_word: ἁπλῶς
  choice: einfach
  rationale: „Einfach“ gibt das Adverb knapp wieder und lässt offen, ob besonders die Leichtigkeit beziehungsweise Unmittelbarkeit des Schmelzens hervorgehoben wird.
- source_word: βραχείας
  choice: kurzen
  rationale: Bei einem Sonnenstrahl kann das Adjektiv geringe Dauer oder Ausdehnung bezeichnen. „Kurz“ bewahrt diese Offenheit besser als eine Festlegung auf „schwach“.
- source_word: ἀκτῖνος ἡλίου
  choice: Sonnenstrahl
  rationale: Das natürliche deutsche Kompositum gibt die griechische Genitivverbindung prägnant und bildhaft wieder.
- source_word: θερμαινόμενον
  choice: erwärmt wurde
  rationale: Die passive Partizipialform bezeichnet die Erwärmung durch den Sonnenstrahl und wird in einem natürlichen deutschen Nebensatz wiedergegeben.
- source_word: ἐτήκετο
  choice: schmolz
  rationale: Das Imperfekt beschreibt hier den eintretenden beziehungsweise fortschreitenden Schmelzvorgang; „schmolz“ ist die klare physische Entsprechung.
- source_word: τὸ ... μὴ φθειρόμενον
  choice: was ... nicht vernichtet wurde
  rationale: Die substantivierte neutrale Partizipialkonstruktion wird idiomatisch wiedergegeben, ohne ein im Griechischen ungenanntes Bezugswort einzuführen.
