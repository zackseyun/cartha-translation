base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/010.yaml
  text: They were being destroyed[a], trembling and refusing even to look at the air, though there was nowhere to flee from it.
translation:
  language: de
  text: Sie gingen zugrunde[a], zitterten und weigerten sich, auch nur die Luft anzusehen, obwohl man ihr nirgends entfliehen konnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie wurden vernichtet«; auch möglich: »Sie kamen um«.'
    reason: Die mediale beziehungsweise passive Form von διόλλυμι kann sowohl das Zugrundegehen als auch das Vernichtetwerden ausdrücken.
lexical_decisions:
- source_word: διώλλυντο
  choice: sie gingen zugrunde
  rationale: Der Imperfekt des Mediums/Passivs bezeichnet einen andauernden Vorgang des Zugrundegehens oder Vernichtetwerdens. „Gingen zugrunde“ lässt wie das Griechische offen, ob der Vorgang medial oder passiv zu verstehen ist und wer gegebenenfalls handelt.
- source_word: ἔντρομοι
  choice: zitterten
  rationale: Das Adjektiv bezeichnet von Furcht Ergriffene beziehungsweise Zitternde. Die verbale Wiedergabe ist im Deutschen natürlich und bewahrt das anschauliche körperliche Bild.
- source_word: μηδαμόθεν φευκτόν
  choice: obwohl man ihr nirgends entfliehen konnte
  rationale: Die Verbindung aus μηδαμόθεν und dem Verbaladjektiv φευκτόν drückt die Unmöglichkeit aus, der Luft von irgendeiner Seite her zu entkommen. Die unpersönliche Formulierung gibt den Sinn idiomatisch wieder.
- source_word: ἀέρα
  choice: die Luft
  rationale: „Luft“ entspricht der gewöhnlichen Bedeutung und bewahrt das auffällige Bild; „Atmosphäre“ wäre zu technisch.
- source_word: προσιδεῖν
  choice: anzusehen
  rationale: Das Verb bedeutet hinsehen beziehungsweise anschauen. „Ansehen“ ist gegenwärtiges, schlichtes Deutsch, ohne das stärker deutende „sich stellen“ einzutragen.
- source_word: ἀρνούμενοι
  choice: weigerten sich, auch nur
  rationale: Das Partizip bezeichnet eine Weigerung. „Auch nur“ macht idiomatisch deutlich, dass sie nicht einmal zum Anblick der allgegenwärtigen Luft bereit waren.
theological_decisions:
- issue: Art und Urheber des Zugrundegehens
  choice: Ein fortdauerndes Zugrundegehen, ohne einen handelnden Urheber ausdrücklich zu nennen
  alternative: „Sie wurden vernichtet“, mit stärkerem passivem Klang und möglicher Betonung eines äußeren Urhebers
  rationale: Die griechische Form kann medial oder passiv verstanden werden und nennt in diesem Satz keinen Urheber. Der Zusammenhang steht unter dem Zeichen des Gerichts, doch die Übersetzung macht die göttliche Urheberschaft nicht ausdrücklicher als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt bildhaft und verständlich; die ungewöhnliche Aussage über die Luft sowie die Unbestimmtheit der griechischen Medium-/Passivform werden bewahrt.
