  source_fidelity: Die Übersetzung gibt διώλλυντο angemessen als fortdauerndes, hinsichtlich eines Urhebers offenes Zugrundegehen wieder. „zitterten“ trifft ἔντρομοι, und „weigerten sich, auch nur die Luft anzusehen“ bildet ἀρνούμενοι ... προσιδεῖν präzise und idiomatisch ab. Der Zusatzsatz „obwohl man ihr nirgends entfliehen konnte“ gibt die Unentrinnbarkeit von μηδαμόθεν φευκτόν wieder, ohne einen Urheber oder eine weitergehende Deutung einzutragen.
