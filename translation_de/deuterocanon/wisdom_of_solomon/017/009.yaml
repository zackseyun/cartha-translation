lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn selbst
  rationale: Gibt die begründende und zugleich verstärkende Funktion am Satzanfang in natürlichem Deutsch wieder.
- source_word: εἰ μηδὲν αὐτοὺς ταραχῶδες ἐφόβει
  choice: wenn sie nichts Schreckliches in Angst versetzte
  rationale: Bewahrt sowohl die konditionale Form als auch das ausdrückliche Angstvokabular; ταραχῶδες bezeichnet etwas Beunruhigendes oder Schreckliches.
- source_word: κνωδάλων
  choice: wilder Tiere
  rationale: Bezeichnet gefährliche wilde Tiere oder Kreaturen; die Wendung ist modern, verständlich und wahrt den bedrohlichen Klang.
- source_word: παρόδοις
  choice: beim Vorbeiziehen
  rationale: Der Dativ Plural bezeichnet den Anlass oder Umstand ihres Vorüberziehens; „beim Vorbeiziehen“ ist präzise und idiomatisch.
- source_word: ἑρπετῶν
  choice: Schlangen
  rationale: Das Wort kann allgemeiner kriechende Tiere oder Reptilien bezeichnen, doch συριγμοῖς legt hier besonders Schlangen nahe.
- source_word: συριγμοῖς
  choice: beim Zischen
  rationale: Bezeichnet ein Zischen oder Pfeifen; in Verbindung mit ἑρπετῶν ist „Zischen“ die natürlichste Wiedergabe.
- source_word: ἐκσεσοβημένοι
  choice: gerieten sie in Panik
  rationale: Das Partizip beschreibt einen Zustand heftiger Erschütterung und panischer Angst; die deutsche Formulierung wahrt diese Intensität.
