  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/009.yaml
  text: For even if nothing terrifying frightened them[a], they were panic-stricken by the passing by of wild animals and the hissing of snakes,
translation:
  language: de
  text: Denn selbst wenn sie nichts Schreckliches in Angst versetzte, gerieten sie durch das Vorbeiziehen wilder Tiere und das Zischen von Schlangen[a] in Panik,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kriechtieren“. Das griechische Wort kann weiter gefasst sein; das „Zischen“ spricht hier jedoch eher für Schlangen.'
