  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/015.yaml
  text: Some were driven by terrifying apparitions[a], and others were paralyzed by the betrayal of their soul[b]; for sudden and unexpected fear came upon them.
translation:
  language: de
  text: Die einen wurden von furchterregenden Erscheinungen[a] getrieben, die anderen wurden durch den Verrat ihrer Seele[b] gelähmt; denn plötzlich und unerwartet überkam sie Furcht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Trugbilder“ oder „Phantome“. Das Griechische bezeichnet unheimliche, furchterregende Erscheinungen, ohne festzulegen, ob sie wirklich oder nur eingebildet waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch den Verrat der Seele“. Gemeint sein kann ein innerer Zusammenbruch, bei dem die eigene Seele sie gleichsam im Stich ließ.'
    reason: alternative_reading
lexical_decisions:
- source_word: τέρασιν φαντασμάτων
  choice: Schreckensgestalten
  rationale: Die Verbindung bezeichnet unheimliche, furchterregende Erscheinungen. „Schreckensgestalten“ ist im Deutschen anschaulich und lässt offen, ob es sich um Trugbilder, Visionen oder gespenstische Erscheinungen handelt.
- source_word: ἠλαύνοντο
  choice: wurden … gehetzt
  rationale: Das Imperfekt Passiv vermittelt fortdauerndes Getrieben- oder Gejagtwerden; „gehetzt“ gibt den bedrängenden Charakter natürlicher wieder als das blassere „getrieben“.
- source_word: παρελύοντο
  choice: wurden … gelähmt
  rationale: Das Verb kann lösen, schwächen oder lähmen bedeuten. Im Zusammenhang der überwältigenden Angst bezeichnet „gelähmt“ treffend die innere und körperliche Handlungsunfähigkeit.
- source_word: προδοσίᾳ τῆς ψυχῆς
  choice: durch den Verrat ihrer eigenen Seele
  rationale: Die auffällige Metapher des griechischen Textes bleibt erhalten, statt psychologisch eindeutig aufgelöst zu werden. „eigenen“ verdeutlicht im Deutschen, dass der Verrat aus ihrem Inneren kommt.
- source_word: αἰφνίδιος … καὶ ἀπροσδόκητος φόβος
  choice: plötzlich und unerwartet … Furcht
  rationale: Beide Adjektive werden bewahrt; die Umstellung mit dem Verb ergibt einen natürlichen, würdigen deutschen Satz.
- source_word: ἐπῆλθεν
  choice: überkam
  rationale: „Überkam sie“ ist eine idiomatische deutsche Wiedergabe für das Hereinbrechen eines Gefühls auf Menschen.
theological_decisions:
- issue: Deutung von τῆς ψυχῆς … προδοσίᾳ
  choice: durch den Verrat ihrer eigenen Seele
  alternative: durch inneren Verrat; weil ihre Seele sie im Stich ließ
  rationale: Der verdichtete griechische Ausdruck lässt offen, ob die Seele als verräterisch handelnd, versagend oder sich selbst preisgebend gedacht ist. Die Übersetzung erhält diese Spannung und erklärt sie lediglich in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Klang. Die ungewöhnliche Seelenmetapher wird im Haupttext bewusst bewahrt; die Fußnoten erläutern, ohne die Mehrdeutigkeit aufzulösen.
