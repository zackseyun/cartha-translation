base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/004.yaml
  text: For not even the inner chamber that held them kept them free from fear[a], but sounds that troubled them rang around them[b], and gloomy apparitions with unsmiling faces appeared.
translation:
  language: de
  text: Denn nicht einmal der innerste Raum, der sie umschloss, bewahrte sie vor Angst; doch beunruhigende Geräusche hallten rings um sie wider[a], und Erscheinungen mit düsteren, nicht lächelnden Gesichtern[b] zeigten sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Verb deutet auf wiederholten Lärm oder Widerhall rings um sie hin.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Phantome« oder »Spukgestalten«. Das griechische Wort bezeichnet unheimliche, geisterhafte Erscheinungen, ohne ihr Wesen näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυχὸς
  choice: der innerste Raum
  rationale: Das Wort bezeichnet einen tief im Inneren gelegenen, verborgenen Raum oder Winkel. »Der innerste Raum« vermittelt sowohl Abgeschlossenheit als auch vermeintlichen Schutz.
- source_word: ὁ κατέχων αὐτούς
  choice: der sie umschloss
  rationale: κατέχω beschreibt hier, dass der Raum sie in sich hielt beziehungsweise einschloss, ohne notwendig den stärkeren Gedanken gewaltsamer Gefangenschaft auszudrücken.
- source_word: ἀφόβως διεφύλασσεν
  choice: bewahrte sie vor Angst
  rationale: Die Verbindung wird kontextgerecht als misslungener Schutz vor Furcht verstanden. Eine wörtlichere Wiedergabe wie »bewachte sie furchtlos« wäre im Deutschen missverständlich und würde die Furchtlosigkeit dem Raum zuschreiben.
- source_word: ἦχοι ἐκταράσσοντες αὐτούς
  choice: beunruhigende Geräusche
  rationale: ἦχοι bezeichnet unbestimmte Geräusche oder Klänge; ἐκταράσσω drückt starke innere Unruhe und Erschütterung aus. »Beunruhigend« bewahrt dies, ohne die Quelle oder Art der Geräusche festzulegen.
- source_word: ἐτρεκόμπουν
  choice: hallten rings um sie wider
  rationale: Das seltene Verb bezeichnet offenbar wiederholten, ringsum wahrnehmbaren Lärm oder Widerhall. Die Wiedergabe wahrt den umgebenden und fortdauernden Höreindruck des Imperfekts.
- source_word: φάσματα
  choice: Erscheinungen
  rationale: Der Ausdruck kann unheimliche Erscheinungen, Phantome oder Spukgestalten bezeichnen. »Erscheinungen« erhält die Offenheit darüber, was diese wahrgenommenen Gestalten ihrem Wesen nach waren.
- source_word: ἀμειδήτοις κατηφῆ προσώποις
  choice: düstere Erscheinungen mit Gesichtern ohne jedes Lächeln
  rationale: ἀμείδητος bedeutet konkret »nicht lächelnd«, während κατηφής eine düstere, niedergeschlagene oder finstere Wirkung bezeichnet. Die Formulierung bewahrt beide Bildzüge in natürlichem Deutsch.
- source_word: ἐνεφανίζετο
  choice: zeigten sich
  rationale: Das Verb bezeichnet das Sichtbarwerden oder Erscheinen. »Zeigten sich« passt idiomatisch zu unheimlichen Erscheinungen und behauptet nicht mehr als ihre Wahrnehmbarkeit.
theological_decisions:
- issue: Wesen der mit φάσματα bezeichneten Erscheinungen
  choice: Neutrale Wiedergabe als »Erscheinungen«
  alternative: »Gespenster«, »Phantome« oder »Visionen«
  rationale: Der griechische Text schildert unheimliche sichtbare Phänomene, legt aber nicht eindeutig fest, ob sie eigenständige übernatürliche Wesen oder angstbedingte Wahrnehmungen waren. Die Übersetzung entscheidet diese Frage nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt bildhaft und eng am griechischen Ablauf, wird jedoch zur besseren Verständlichkeit in zwei Sätze gegliedert. Die unbestimmte Herkunft der Geräusche und die ontologische Mehrdeutigkeit der Erscheinungen bleiben erhalten.
