base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/029.yaml
  text: For the hope of the ungrateful will melt like wintry frost[b][a], and will run off like useless water.
translation:
  language: de
  text: Denn die Hoffnung des Undankbaren[a] wird wie winterlicher Reif schmelzen und wie unbrauchbares Wasser abfließen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „des Danklosen“. Das griechische Wort hebt die fehlende Dankbarkeit hervor.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild kann Wasser meinen, das abfließt und keinen Nutzen bringt, weil es nicht verfügbar bleibt.
    reason: cultural_note
lexical_decisions:
- source_word: ἀχαρίστου
  choice: des Undankbaren
  rationale: Der substantivierte Genitiv Singular bezeichnet einen Menschen, der durch Undankbarkeit gekennzeichnet ist. „Des Undankbaren“ ist präzise, würdig und lässt die Einzahl des Griechischen erkennen.
- source_word: ἐλπίς
  choice: Hoffnung
  rationale: „Hoffnung“ entspricht hier dem üblichen Sinn und passt zum moralisch-poetischen Zusammenhang.
- source_word: χειμέριος πάχνη
  choice: winterlicher Reif
  rationale: πάχνη bezeichnet Reif beziehungsweise Frost; „winterlicher Reif“ bewahrt das konkrete Naturbild und gibt χειμέριος knapp wieder.
- source_word: τακήσεται
  choice: wird … schmelzen
  rationale: Das Verb bezeichnet das Schmelzen oder Zergehen und steht unmittelbar im Bild des Reifs.
- source_word: ῥυήσεται
  choice: wird … abfließen
  rationale: „Abfließen“ gibt die Bewegung des Wassers und zugleich sein Verschwinden aus dem verfügbaren Bereich natürlich wieder.
- source_word: ὕδωρ ἄχρηστον
  choice: unbrauchbares Wasser
  rationale: ἄχρηστος bedeutet „nicht zu gebrauchen, nutzlos“. „Unbrauchbares Wasser“ erhält die knappe, konkrete Formulierung, ohne den möglichen Grund seiner Nutzlosigkeit festzulegen.
theological_decisions:
- issue: Moralische Kennzeichnung durch ἀχαρίστου
  choice: des Undankbaren
  alternative: des Gottlosen
  rationale: Das griechische Wort bezeichnet ausdrücklich Undankbarkeit. Eine Wiedergabe als „Gottloser“ würde eine breitere religiöse Wertung eintragen, die hier lexikalisch nicht ausgedrückt ist.
- issue: Bezug der Hoffnung
  choice: Singularischer Bezug auf einen undankbaren Menschen
  alternative: kollektive Wiedergabe „der Undankbaren“
  rationale: Der griechische Genitiv steht im Singular. Die deutsche substantivierte Einzahl bewahrt diese Form, ohne auszuschließen, dass die Aussage allgemein gilt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Die parallelen Zukunftsformen und beide Naturbilder des Griechischen bleiben erhalten; die Bilddeutung wird nicht in den Haupttext eingetragen.
