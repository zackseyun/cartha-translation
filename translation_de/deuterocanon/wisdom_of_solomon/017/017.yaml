translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Berufs- und Lebensbereiche bleibt erhalten; der etwas schwere griechische Ausdruck für Arbeit und Mühsal in der Einöde wird verständlich, aber ohne sachliche Präzisierung wiedergegeben.
