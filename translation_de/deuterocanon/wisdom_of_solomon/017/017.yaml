base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/017.yaml
  text: For if someone was a farmer, or a shepherd, or a worker at toils in the wilderness, once seized, he remained under the inescapable necessity.
translation:
  language: de
  text: Denn wenn jemand Bauer oder Hirte war oder sich als Arbeiter in der Wildnis abmühte, blieb er, einmal ergriffen, unter dem unausweichlichen Zwang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einmal eingeholt, blieb er unter dem unausweichlichen Zwang.“ Das griechische Partizip kann sowohl ein Ergriffenwerden als auch ein Eingeholtwerden bezeichnen; ἀνάγκη kann auch mit „Notwendigkeit“ oder „Zwangslage“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τε γὰρ
  choice: Denn ob jemand
  rationale: Die Wendung leitet eine begründende Fallunterscheidung ein; im Zusammenhang gibt „denn ob jemand … oder …“ die umfassende Aufzählung natürlicher wieder als ein eng konditionales „denn wenn“.
- source_word: γεωργὸς
  choice: Bauer
  rationale: Eine klare, moderne Bezeichnung für jemanden, der den Boden landwirtschaftlich bearbeitet.
- source_word: ποιμὴν
  choice: Hirte
  rationale: Die übliche und im ländlichen Zusammenhang passende Wiedergabe.
- source_word: τῶν κατʼ ἐρημίαν ἐργάτης μόχθων
  choice: sich als Arbeiter in der Einöde abmühte
  rationale: Die Formulierung bewahrt sowohl den Arbeiter (ἐργάτης) als auch die mühevolle Arbeit (μόχθων) und den Ort in unbewohntem, einsamem Gelände (κατʼ ἐρημίαν), ohne eine bestimmte Tätigkeit hinzuzufügen.
- source_word: προλημφθεὶς
  choice: einmal ergriffen
  rationale: Das passive Partizip bezeichnet ein plötzliches Erfasst- oder Eingeholtwerden; „ergriffen“ erhält das anschauliche Bild und die Vorzeitigkeit.
- source_word: τὴν δυσάλυκτον ... ἀνάγκην
  choice: in dieser unentrinnbaren Zwangslage
  rationale: „Unentrinnbar“ gibt δυσάλυκτος als etwas wieder, dem man nur schwer oder gar nicht entkommt; „Zwangslage“ vermittelt die bedrängende Kraft von ἀνάγκη in idiomatischem Deutsch.
- source_word: ἔμενεν
  choice: blieb
  rationale: Das Imperfekt beschreibt den fortdauernden Zustand; „blieb“ gibt diesen Aspekt knapp und unmittelbar wieder.
