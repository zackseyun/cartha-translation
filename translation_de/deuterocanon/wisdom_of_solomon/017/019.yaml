lexical_decisions:
- source_word: κτύπος ἀπηνὴς
  choice: das harte Krachen
  rationale: κτύπος bezeichnet ein markantes Schlag- oder Sturzgeräusch; „Krachen“ gibt dies im Zusammenhang mit Felsen natürlich wieder. ἀπηνής beschreibt hier die schroffe, furchterregende Klangwirkung und wird mit „hart“ wiedergegeben.
- source_word: καταρριπτομένων πετρῶν
  choice: herabstürzender Felsen
  rationale: Das Partizip bezeichnet eine kräftige Bewegung nach unten, lässt aber offen, ob die Felsen von selbst fallen oder hinabgeworfen werden. „herabstürzend“ bewahrt die Wucht, ohne einen ausdrücklich handelnden Urheber einzuführen.
- source_word: σκιρτώντων ζῴων δρόμος ἀθεώρητος
  choice: der unsichtbare Lauf springender Tiere
  rationale: Die relativ konkrete Formulierung bewahrt δρόμος als „Lauf“, ἀθεώρητος als „unsichtbar“ und σκιρτάω als springende beziehungsweise hüpfende Bewegung.
- source_word: ὠρυομένων ἀπηνεστάτων θηρίων φωνή
  choice: die Stimme brüllender, äußerst wilder Bestien
  rationale: φωνή wird mit „Stimme“ wiedergegeben; ὠρύομαι bezeichnet den lauten Ruf wilder Tiere. Der Superlativ ἀπηνεστάτων bleibt durch „äußerst wild“ erkennbar.
- source_word: ἀντανακλωμένη ἐκ κοιλότητος ὀρέων ἠχώ
  choice: ein aus den Höhlungen der Berge zurückgeworfenes Echo
  rationale: ἀντανακλωμένη beschreibt das Zurückprallen des Schalls. Der Plural „Höhlungen“ gibt den natürlichen Sinn von κοιλότης im Gebirgskontext wieder, ohne ihn enger als „Höhlen“ festzulegen.
- source_word: παρέλυεν αὐτοὺς ἐκφοβοῦντα
  choice: all das lähmte sie vor Schrecken
  rationale: παραλύω bezeichnet das Kraftlos- oder Bewegungsunfähigwerden; ἐκφοβέω drückt heftiges Erschrecken aus. „vor Schrecken lähmen“ verbindet Wirkung und Ursache idiomatisch.
