translation:
  language: de
  text: oder das harsche Krachen herabstürzender Felsen[a], oder der unsichtbare Lauf springender Tiere[b], oder der Schrei wildester Tiere, oder ein aus der Höhlung der Berge zurückgeworfenes Echo[c] – all das lähmte sie vor Schrecken.
