    rationale: καταρριπτομένων ist ein Partizip Präsens. Die Alternative sollte daher „hinabgeworfen werden“ lauten und nicht eine abgeschlossene vergangene Handlung ausdrücken.
  - severity: low
    issue: Text und Fußnote zu [c] weichen bei „Höhlungen“/„Höhlung“ voneinander ab.
    rationale: Das Griechische hat κοιλότητος im Singular. Die singularische Wiedergabe ist genauer und vermeidet die interne Inkonsistenz.
  - severity: low
    issue: „äußerst wilder Bestien“ gibt den Superlativ nur umschreibend wieder und klingt schwerfällig.
    rationale: „wildester Tiere“ erhält den Superlativ und ist in modernem Standarddeutsch natürlicher.
