translation_notes:
  register: Moderne, würdige Standardsprache. Die Aufzählung und die akustische Bildlichkeit des griechischen Satzes bleiben erhalten. „Bestien“ ist hier bewusst gewählt, um θηρία als bedrohliche wilde Tiere auszudrücken; der abschließende Sammelausdruck „all das“ macht den im Deutschen sonst schwer anschließbaren Singular des Prädikats verständlich.
