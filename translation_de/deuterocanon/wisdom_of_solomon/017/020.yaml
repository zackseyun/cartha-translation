  text: For the whole world was illuminated with bright light and was occupied with unhindered works;[a]
translation:
  language: de
  text: Denn die ganze Welt wurde von strahlendem Licht erhellt und ging ungehindert ihren Tätigkeiten nach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und war mit ungehinderten Arbeiten beschäftigt.“ Gemeint ist wahrscheinlich, dass außerhalb der Plage der Finsternis die gewöhnlichen Tätigkeiten ungestört weitergingen.'
    reason: lexikalische Alternative und Erläuterung der griechischen Wendung συνείχετο ἀνεμποδίστοις ἔργοις
lexical_decisions:
- source_word: ὅλος ... ὁ κόσμος
  choice: die ganze Welt
  rationale: Die attributive Verbindung bezeichnet die Welt als Ganzes und bildet den räumlichen Kontrast zur örtlich begrenzten Finsternis der Ägypter.
- source_word: λαμπρῷ ... φωτί
  choice: von strahlendem Licht
  rationale: Der instrumentale Dativ wird im Deutschen natürlich mit „von“ wiedergegeben; „strahlend“ bewahrt die Leuchtkraft von λαμπρός in würdiger, heutiger Sprache.
- source_word: κατελάμπετο
  choice: wurde ... erhellt
  rationale: Die imperfektische Passivform beschreibt eine anhaltende Erhellung der Welt. „Wurde erhellt“ gibt Wirkung und Verlauf verständlich wieder.
- source_word: ἀνεμποδίστοις
  choice: ungehindert
  rationale: Das Adjektiv bezeichnet, dass die Tätigkeiten ohne Behinderung oder Hemmnis fortgesetzt wurden.
- source_word: συνείχετο ... ἔργοις
  choice: ging ... ihren Tätigkeiten nach
  rationale: Die idiomatische deutsche Wendung vermittelt, dass die Welt weiterhin mit ihren gewöhnlichen Verrichtungen beschäftigt war. Sie vermeidet die missverständliche wörtliche Vorstellung eines physischen Festgehaltenwerdens.
theological_decisions:
- issue: Reichweite von κόσμος im Kontrast zur Plage der Finsternis
  choice: die ganze Welt
  alternative: das ganze All; die gesamte Schöpfung
  rationale: „Welt“ bewahrt den umfassenden literarischen Kontrast zur von Finsternis betroffenen Region, ohne aus dem Vers eine weitergehende kosmologische Aussage abzuleiten.
- issue: Art der ungehinderten ἔργα
  choice: allgemeine Tätigkeiten, ohne nähere Bestimmung
  alternative: Arbeiten oder Werke im engeren Sinn
  rationale: Der griechische Ausdruck ist breit. Die Übersetzung lässt offen, welche gewöhnlichen Arbeiten oder Verrichtungen gemeint sind, und trägt keine besondere theologische Deutung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweite Satzhälfte ist idiomatisch formuliert, während die Fußnote die formal nähere Wiedergabe und die verbleibende Bedeutungsbreite dokumentiert.
