  text: And no force of fire prevailed to give light[a], nor did the brilliant flames of the stars endure to illumine that dreadful night.
translation:
  language: de
  text: Und keine Kraft des Feuers war stark genug, Licht zu spenden; auch die hellen Flammen der Sterne vermochten jene schreckliche Nacht[a] nicht zu erleuchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: jene grimmige oder düstere Nacht; auch: jene verhasste oder abscheuliche Nacht. Das griechische Wort bezeichnet etwas Unheilvolles, Abstoßendes oder düster Bedrückendes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρὸς … βία
  choice: Kraft des Feuers
  rationale: Bewahrt die Genitivverbindung und bezeichnet die wirksame Macht des Feuers, ohne den hier unpassenden Beiklang körperlicher Gewalt.
- source_word: κατίσχυεν φωτίζειν
  choice: vermochte Licht zu spenden
  rationale: Gibt das erfolglose Vermögen der fortdauernd geschilderten Handlung idiomatisch wieder.
- source_word: ἔκλαμπροι φλόγες τῶν ἄστρων
  choice: die hell strahlenden Flammen der Sterne
  rationale: Erhält das anschauliche poetische Bild der Sterne als leuchtende Flammen.
- source_word: ὑπέμενον
  choice: hielten … nicht durch
  rationale: Bewahrt gegenüber einem bloßen »konnten nicht« die Grundvorstellung des Ausharrens oder Standhaltens.
- source_word: καταυγάζειν
  choice: zu erleuchten
  rationale: Gibt die auf die Nacht gerichtete Lichtwirkung des Verbs klar und natürlich wieder.
- source_word: στυγνὴν
  choice: schreckliche
  rationale: Vermittelt in natürlichem Deutsch die starke negative Färbung des griechischen Adjektivs, das etwas Grauenhaftes, Verhasstes oder Düsteres bezeichnen kann.
theological_decisions:
- issue: Poetisch-kosmische Darstellung der Finsternis
  choice: Feuer und Sternenlicht werden als tatsächlich wirkungslos dargestellt.
  alternative: Die Aussage ausschließlich als gewöhnliche Dunkelheit oder nur als Ausdruck psychischer Angst deuten.
  rationale: Die Übersetzung erhält die außergewöhnliche, beinahe kosmische Bildsprache des griechischen Textes, ohne festzulegen, ob sie physisch, psychologisch oder in beiderlei Sinn zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Das zweimalige Unvermögen wird natürlich formuliert; »hielten nicht durch« erhält zugleich die eigentümliche Aussage des griechischen ὑπέμενον.
