  terminology: „Hades“ ist für ᾅδης sachgerecht und vermeidet die dogmatisch enger geprägte Wiedergabe „Hölle“. „Wahrhaft“ gibt ὄντως angemessen nachdrücklich wieder. Der Fußnotenanker steht direkt bei der ersten Instanz des wiederholten problematischen Ausdrucks und die Fußnote dokumentiert sowohl die Wiederholung als auch die mögliche kontextuelle Nuance.
