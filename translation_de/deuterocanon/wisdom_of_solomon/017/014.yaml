  source_fidelity: 'Der Entwurf gibt die griechische Satzstruktur angemessen wieder: Das adversative οἱ δέ ist mit „Sie aber“ erfasst, τὸν αὐτὸν ὕπνον κοιμώμενοι mit „schliefen denselben Schlaf“, und die vorzeitige Partizipialbestimmung ἐπελθοῦσαν mit dem Plusquamperfekt „über sie gekommen war“. Die zweimalige Wiedergabe von ἀδύνατος durch Formen von „machtlos“ bewahrt die auffällige lexikalische Wiederholung, ohne die schwierige Bedeutung einseitig auf „unwiderstehlich“ festzulegen. Der offene Satzschluss entspricht dem Anschlusscharakter des griechischen Verses.'
