base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/014.yaml
  text: But they[a], while sleeping the same sleep, with the truly powerless night having come upon them from the depths of powerless Hades,
translation:
  language: de
  text: Sie aber schliefen denselben Schlaf, während die wahrhaft machtlose[a] Nacht aus den Tiefen des machtlosen Hades über sie gekommen war,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die wahrhaft unwiderstehliche Nacht … aus den Tiefen des unwiderstehlichen Hades“. Das Griechische wiederholt an beiden Stellen dasselbe Wort. Es bedeutet wörtlich „kraftlos, machtlos“, kann hier aber auch etwas bezeichnen, dem man nicht widerstehen oder entrinnen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον … ἀδυνάτου
  choice: machtlose … machtlosen
  rationale: Das Adjektiv bezeichnet zunächst etwas, das keine Kraft oder Fähigkeit besitzt. Die Wiederholung desselben deutschen Wortstamms bewahrt die auffällige Wiederholung des Griechischen und lässt die im Zusammenhang bestehende Spannung stehen.
- source_word: ὄντως
  choice: wahrhaft
  rationale: Gibt die nachdrückliche adverbiale Bestimmung in einem würdigen, heutigen Register wieder.
- source_word: νύκτα
  choice: Nacht
  rationale: Direkte und natürliche Entsprechung.
- source_word: ᾅδου
  choice: Hades
  rationale: Bewahrt den griechischen Begriff für das Totenreich, ohne ihn mit späteren Vorstellungen von der Hölle gleichzusetzen.
- source_word: μυχῶν
  choice: Tiefen
  rationale: Bezeichnet verborgene innere Räume oder äußerste Winkel; „Tiefen“ erhält das düstere räumliche Bild und klingt im Deutschen natürlich.
- source_word: ἐπελθοῦσαν
  choice: über sie gekommen war
  rationale: Gibt das aoristische Partizip als vorzeitige Begleithandlung wieder und bewahrt das Bild einer Nacht, die über die Betroffenen kommt.
- source_word: τὸν αὐτὸν ὕπνον
  choice: denselben Schlaf
  rationale: Nahe Wiedergabe der gemeinsamen, gleichen Schlaferfahrung.
- source_word: κοιμώμενοι
  choice: schliefen
  rationale: Das griechische Partizip wird für verständliches Deutsch als finite Verbform wiedergegeben; der anschließende Nebensatz nimmt die begleitende Partizipialkonstruktion auf.
theological_decisions:
- issue: Deutung von ᾅδης
  choice: Hades
  alternative: Totenreich; Hölle; Scheol
  rationale: „Hades“ erhält die Begriffswelt des griechischen Ausgangstextes und vermeidet eine vorschnelle Gleichsetzung mit einer später dogmatisch bestimmten Höllenvorstellung.
- issue: Bedeutung von ἀδύνατος bei Nacht und Hades
  choice: machtlos
  alternative: unwiderstehlich; unentrinnbar
  rationale: Die Grundbedeutung „ohne Kraft/Vermögen“ und die Wiederholung desselben Wortes werden im Haupttext bewahrt. Die kontextuell mögliche Bedeutung, dass die Nacht für Menschen nicht abzuwehren ist, wird in der Fußnote genannt, aber nicht stillschweigend festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wiederholung von „machtlos“ und der offene Satzschluss werden beibehalten, weil der griechische Vers syntaktisch in den folgenden Vers weiterführt.
