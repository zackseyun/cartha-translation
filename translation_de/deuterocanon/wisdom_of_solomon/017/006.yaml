base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/006.yaml
  text: Only a self-kindled fire[a], full of fear, appeared to them; and, being terrified by that unseen appearance[b], they considered the things they saw to be worse.
translation:
  language: de
  text: Nur ein von selbst entzündetes Feuer[a], voller Furcht, erschien ihnen; doch erschreckt von jener unsichtbaren Erscheinung[b] hielten sie das, was sie sahen, für schlimmer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein spontan entstandenes Feuer“ oder „ein Feuer, das sich selbst entzündet hatte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch wörtlich: „jene nicht gesehene Erscheinung“ – eine bewusst paradoxe Formulierung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφαίνετο
  choice: erschien
  rationale: Das Imperfekt bezeichnet hier ein Sichtbarwerden oder Erscheinen; „erschien“ ist natürlich und bewahrt den unheimlichen Charakter der Wahrnehmung.
- source_word: μόνον
  choice: nur
  rationale: Die vorangestellte Einschränkung wird knapp und betont wiedergegeben.
- source_word: αὐτομάτη πυρά
  choice: ein von selbst entzündetes Feuer
  rationale: αὐτομάτη bezeichnet etwas, das von selbst entsteht oder geschieht. Die Formulierung bewahrt den unheimlichen Eindruck, ohne eine Ursache hinzuzufügen.
- source_word: φόβου πλήρης
  choice: voller Furcht
  rationale: Die wörtlich-offene Formulierung lässt bestehen, ob das Feuer Furcht ausstrahlte oder von Furcht geprägt erschien.
- source_word: ἐκδειματούμενοι
  choice: erschreckt
  rationale: Das Partizip bezeichnet heftige Angst. „Erschreckt“ fügt sich idiomatisch in den deutschen Satz; die Intensität ergibt sich auch aus dem Zusammenhang.
- source_word: τῆς μὴ θεωρουμένης ἐκείνης ὄψεως
  choice: von jener unsichtbaren Erscheinung
  rationale: Die paradoxe Verbindung einer Erscheinung mit dem Nichtgesehenwerden bleibt bewusst erhalten.
- source_word: ἡγοῦντο
  choice: hielten … für
  rationale: Die deutsche Konstruktion gibt das urteilende oder einschätzende Moment des Verbs natürlich wieder.
- source_word: χείρω τὰ βλεπόμενα
  choice: hielten sie das, was sie sahen, für schlimmer
  rationale: Die Wiedergabe erhält sowohl den Komparativ „schlimmer“ als auch den Gegensatz zwischen dem Sichtbaren und der unsichtbaren Erscheinung.
theological_decisions:
- issue: Ob das Paradox einer „unsichtbaren Erscheinung“ geglättet werden soll
  choice: Das Paradox bleibt als „jener unsichtbaren Erscheinung“ im Haupttext stehen.
  alternative: „jener unsichtbaren Schreckgestalt“ oder „jener Erscheinung, die sie nicht sehen konnten“
  rationale: Die ungewöhnliche Spannung gehört zur griechischen Formulierung und zur Darstellung ihrer angstverzerrten Wahrnehmung; eine erklärende Glättung würde den Text stärker festlegen.
- issue: Wie αὐτομάτη im außergewöhnlichen Kontext wiederzugeben ist
  choice: „von selbst entzündet“
  alternative: „spontan entstanden“ oder „selbstentzündet“
  rationale: Die gewählte Formulierung vermittelt das Geschehen aus sich selbst heraus, ohne ausdrücklich eine natürliche oder übernatürliche Ursache zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch „doch“ und die idiomatische Konstruktion „für schlimmer halten“ flüssig lesbar. Die beiden auffälligen Spannungen des Ausgangstextes – das von selbst entstandene Feuer und die unsichtbare Erscheinung – werden nicht erklärend aufgelöst.
