translation:
  language: de
  text: damit deine Söhne, die du geliebt hast, lernen, Herr, dass nicht die Erträge der Feldfrüchte den Menschen ernähren, sondern dein Wort die bewahrt, die dir vertrauen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: damit … lernen
  rationale: ἵνα mit dem Konjunktiv bezeichnet hier den Zweck; die deutsche Konstruktion mit „damit“ gibt ihn natürlich und präzise wieder.
- source_word: οἱ υἱοί σου
  choice: deine Kinder
  rationale: Wörtlich steht der maskuline Plural „deine Söhne“. Im Kontext bezeichnet die Wendung jedoch Gottes geliebtes Volk; „deine Kinder“ ist im modernen Deutschen natürlich, ohne den Bezug einzuengen. Die wörtliche Form wird in einer Fußnote genannt.
- source_word: οὓς ἠγάπησας
  choice: die du geliebt hast
  rationale: Das griechische Aoristverb wird durch das natürliche deutsche Perfekt wiedergegeben und behält den direkten Sinn von ἀγαπάω bei.
- source_word: Κύριε
  choice: Herr
  rationale: Der ausdrückliche Vokativ wird als direkte Anrede wiedergegeben; ein zusätzliches „o“ wäre im heutigen Standarddeutsch unnötig feierlich.
- source_word: αἱ γενέσεις τῶν καρπῶν
  choice: die Erträge der Feldfrüchte
  rationale: γενέσεις meint hier das Hervorgebrachte beziehungsweise den Ertrag, nicht genealogische „Entstehungen“ oder „Generationen“. „Feldfrüchte“ verdeutlicht den landwirtschaftlichen Zusammenhang von καρποί.
- source_word: τρέφουσιν ἄνθρωπον
  choice: ernähren den Menschen
  rationale: Der Singular ἄνθρωπον hat allgemeinen, repräsentativen Sinn. „Den Menschen“ bewahrt diesen Singular und ist im Deutschen geschlechtsübergreifend verständlich.
- source_word: τὸ ῥῆμά σου
  choice: dein Wort
  rationale: ῥῆμα bezeichnet eine Äußerung oder ein gesprochenes Wort; „dein Wort“ ist klar, idiomatisch und wahrt den Kontrast zu materieller Nahrung.
- source_word: τοὺς σοὶ πιστεύοντας
  choice: alle, die dir vertrauen
  rationale: πιστεύω mit dem Dativ einer Person kann persönliches Vertrauen oder Glauben ausdrücken. „Dir vertrauen“ passt besonders zum Gedanken des göttlichen Bewahrens; „alle“ macht die substantivierte Partizipialgruppe natürlich deutsch, ohne eine zusätzliche Begrenzung einzuführen.
- source_word: διατηρεῖ
  choice: bewahrt
  rationale: διατηρέω bedeutet bewahren, erhalten oder am Leben halten. „Bewahrt“ erhält die semantische Weite und den Gegensatz zur Ernährung durch Feldfrüchte.
theological_decisions:
- issue: Bezeichnung des Gottesvolkes durch οἱ υἱοί σου
  choice: deine Kinder
  alternative: deine Söhne
  rationale: Die griechische Form ist ausdrücklich maskulin, kann aber als gemeinschaftliche Bezeichnung für Gottes Volk dienen. Die Übersetzung verwendet das im Deutschen natürliche „Kinder“ und dokumentiert die wörtliche Form, statt den möglichen Umfang dogmatisch festzulegen.
- issue: Generischer Singular ἄνθρωπον
  choice: den Menschen
  alternative: einen Menschen / den Mann
  rationale: Der Satz spricht allgemein davon, was einen Menschen ernährt. „Den Menschen“ wahrt den griechischen Singular und dessen repräsentative Kraft, ohne eine ausschließlich männliche Bedeutung zu suggerieren.
- issue: Bedeutungsbreite von πιστεύω mit Dativ
  choice: die dir vertrauen
  alternative: die dir glauben / die an dich glauben
  rationale: Die Konstruktion kann sowohl Glauben als auch persönliches Vertrauen bezeichnen. Der Kontext göttlicher Erhaltung stützt „vertrauen“; die alternative Nuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach der Anrede macht den Inhalt dessen, was gelernt werden soll, klar erkennbar. Die Formulierung bleibt nah am griechischen Satzbau, vermeidet aber unnatürliche Wörtlichkeit.
