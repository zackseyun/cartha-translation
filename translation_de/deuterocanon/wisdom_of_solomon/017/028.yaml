translation:
  language: de
  text: Damit man erkenne, dass man der Sonne zuvorkommen muss, um dir zu danken,[a] und sich beim Aufgang des Lichts mit Bitten an dich zu wenden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „noch vor der Sonne aufstehen, um dir zu danken“. Wörtlich: „der Sonne zum Dank an dich zuvorkommen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „beim Tagesanbruch zu dir beten“. Wörtlich: „beim Aufgang des Lichts sich an dich wenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  choice: damit bekannt würde
  rationale: ὅπως leitet hier einen Zweck beziehungsweise ein beabsichtigtes Ergebnis ein. Der Konjunktiv „würde“ gibt diese Ausrichtung im Deutschen natürlicher wieder als die rein vergangene Aussage „war bekannt“.
- source_word: δεῖ
  choice: man … muss
  rationale: Die unpersönliche Notwendigkeit des griechischen δεῖ wird klar und ohne einen näher bestimmten Handlungsträger wiedergegeben.
- source_word: φθάνειν τὸν ἥλιον
  choice: noch vor der Sonne aufstehen
  rationale: φθάνω mit Akkusativ bedeutet, jemandem oder etwas zuvorzukommen. Im Zusammenhang des morgendlichen Dankes macht diese idiomatische Wiedergabe den zeitlichen Sinn verständlich, ohne die Bildsprache der Sonne aufzugeben.
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: um dir zu danken
  rationale: Die elliptische Wendung bezeichnet den auf Gott gerichteten Dank. Die verbale deutsche Form ist natürlich und bewahrt den devotionalen Sinn.
- source_word: πρὸς ἀνατολὴν φωτός
  choice: beim Aufgang des Lichts
  rationale: Die Wiedergabe erhält das griechische Bild vom aufsteigenden Licht und bezeichnet zugleich den Tagesanbruch.
- source_word: ἐντυγχάνειν σοι
  choice: sich mit Bitten an dich wenden
  rationale: ἐντυγχάνω kann das Herantreten mit einer Bitte oder Fürsprache bezeichnen. Die Formulierung ist im modernen Deutschen verständlich und genauer als das allgemeinere „beten“.
theological_decisions:
- issue: Verpflichtender Charakter der morgendlichen Frömmigkeit
  choice: 'Die Aussage bleibt als allgemeine Notwendigkeit formuliert: Man muss Gott vor Sonnenaufgang danken und sich beim Anbruch des Lichts bittend an ihn wenden.'
  alternative: Die Aussage könnte ausschließlich als eine innerhalb der vorausgehenden Plagenerzählung gewonnene Erkenntnis verstanden werden, nicht als allgemeine geistliche Weisung.
  rationale: Das griechische δεῖ drückt tatsächlich Notwendigkeit aus. Die Übersetzung bewahrt diese, macht daraus aber weder eine kirchenrechtliche Vorschrift noch eine Lehre über verbindliche Gebetszeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Zweckgefüge; zugleich werden die elliptischen Wendungen so entfaltet, dass sie für heutige Leser unmittelbar verständlich sind.
