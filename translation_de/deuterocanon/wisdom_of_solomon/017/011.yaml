base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/011.yaml
  text: For wickedness is especially cowardly[a], being condemned by itself; and, being pressed by conscience, it always assumes the worst.
translation:
  language: de
  text: Denn die Bosheit erweist sich, wenn sie verurteilt wird, als besonders feige[a]; vom Gewissen bedrängt, rechnet sie stets mit dem Schlimmsten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher am Griechischen: „Denn die Bosheit legt, wenn sie verurteilt wird, in besonderer Weise ein feiges Zeugnis ab.“'
    reason: Die Verbindung von δειλόν („feige“), μαρτυρεῖ („legt Zeugnis ab“) und καταδικαζομένη („wenn sie verurteilt wird“) lässt im Deutschen mehrere syntaktische Wiedergaben zu.
lexical_decisions:
- source_word: δειλὸν
  choice: feige
  rationale: Das Adjektiv bezeichnet Feigheit oder Ängstlichkeit; „feige“ bewahrt hier die moralische Wertung der Bosheit.
- source_word: ἰδίως
  choice: besonders
  rationale: „Besonders“ gibt die verstärkende Funktion des Adverbs in natürlichem modernem Deutsch wieder, ohne die Aussage zu „von Natur aus“ zu erweitern.
- source_word: πονηρία
  choice: die Bosheit
  rationale: „Bosheit“ bezeichnet wie das griechische Abstraktum moralisch Böses und lässt zugleich die Personifikation im Satz zu.
- source_word: μαρτυρεῖ
  choice: erweist sich
  rationale: Das wörtliche „legt Zeugnis ab“ wirkt mit dem prädikativen δειλόν im Deutschen sperrig. „Erweist sich … als“ gibt die bezeugende beziehungsweise offenbarende Funktion idiomatisch wieder.
- source_word: καταδικαζομένη
  choice: wenn sie verurteilt wird
  rationale: Die passive Form bleibt erhalten; eine ausdrückliche Selbstverurteilung wird nicht in den Haupttext eingetragen, da sie im Griechischen nicht grammatisch markiert ist.
- source_word: προσειληφεν
  choice: rechnet … mit
  rationale: Im Zusammenhang von Furcht und Gewissen bezeichnet das Verb das innere Annehmen oder Erwarten belastender Dinge; „mit etwas rechnen“ ist dafür idiomatisches Deutsch.
- source_word: τὰ χαλεπὰ
  choice: das Schlimmste
  rationale: Der Ausdruck bezeichnet schwere, bedrohliche oder leidvolle Dinge. „Das Schlimmste“ gibt die kontextuelle Wirkung einer von Schuld geprägten Erwartung natürlich wieder.
- source_word: συνεχομένη τῇ συνειδήσει
  choice: vom Gewissen bedrängt
  rationale: συνέχω vermittelt Druck, Bedrängnis oder Einengung; „bedrängt“ bewahrt dieses Bild und verbindet es natürlich mit „Gewissen“.
theological_decisions:
- issue: Innere oder äußere Verurteilung der Bosheit
  choice: Das Passiv „wenn sie verurteilt wird“ bleibt offen und wird im Zusammenhang mit dem bedrängenden Gewissen gelesen.
  alternative: „Wenn sie sich selbst verurteilt“ würde die Verurteilung ausdrücklich als innere Selbstverurteilung bestimmen.
  rationale: Das folgende Gewissen legt eine innere moralische Anklage nahe, doch καταδικαζομένη ist formal passiv und enthält kein ausdrückliches Reflexivpronomen. Die Übersetzung wahrt daher die Spannung zwischen Verurteilung und Gewissensdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Personifikation der Bosheit und der knappe moralpsychologische Gedankengang bleiben erhalten; das Semikolon bildet den Übergang vom Zeugnis der Bosheit zum Druck des Gewissens ab.
