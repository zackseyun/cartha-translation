  text: But upon those alone heavy night was imposed[a], an image of the darkness that was about to receive them[b]; yet they were heavier to themselves than darkness.
translation:
  language: de
  text: Nur auf jenen lastete eine schwere Nacht[a], ein Bild der Finsternis, die sie aufnehmen sollte[b]; doch sie selbst waren sich eine schwerere Last als die Finsternis.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „war über jene ausgebreitet“ oder „war über jene gelegt“. Das Griechische verbindet dies mit dem Bild einer „schweren“ Nacht.'
    reason: lexical_alternative
  - marker: b
    text: Die kommende Finsternis kann auf ein größeres Gericht über die unmittelbare Plage hinaus weisen; der Text bestimmt sie jedoch nicht genauer.
    reason: theological_ambiguity
  - marker: c
    text: 'Wörtlich: „Sie waren sich selbst schwerer als die Finsternis.“ Das Griechische wiederholt hier bewusst das Wortbild von der „schweren“ Nacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνοις δὲ ἐκείνοις
  choice: Nur auf jenen
  rationale: Die Stellung von μόνοις betont die Ausschließlichkeit. „Auf jenen“ verbindet sich natürlich mit „lastete“ und bewahrt die Vorstellung einer über sie verhängten Nacht.
- source_word: ἐπέτατο
  choice: lastete
  rationale: Das Verb bezeichnet hier etwas, das über jemanden ausgebreitet oder gelegt ist. „Lastete“ gibt dies idiomatisch wieder und nimmt zugleich die Schwere-Metaphorik von βαρεῖα auf.
- source_word: βαρεῖα νύξ
  choice: eine schwere Nacht
  rationale: Die wörtliche Wiedergabe von βαρεῖα als „schwer“ bewahrt das bedrückende Bild und den beabsichtigten Gleichklang mit βαρύτεροι im Schlusssatz.
- source_word: εἰκὼν
  choice: ein Bild
  rationale: „Bild“ ist die direkte und natürliche Entsprechung und lässt offen, in welchem genauen Sinn die gegenwärtige Nacht auf die kommende Finsternis verweist.
- source_word: τοῦ μέλλοντος αὐτοὺς διαδέχεσθαι σκότους
  choice: der Finsternis, die sie künftig aufnehmen sollte
  rationale: μέλλοντος bezeichnet das Bevorstehende; διαδέχεσθαι kann ein Aufnehmen beziehungsweise Ablösen in der Folge ausdrücken. Die Formulierung bewahrt die personifizierende und bedrohliche Offenheit des Griechischen.
- source_word: ἑαυτοῖς δὲ ἦσαν βαρύτεροι σκότους
  choice: doch sie waren sich selbst schwerer als die Finsternis
  rationale: Die bewusst herbe Formulierung erhält den Dativ ἑαυτοῖς und die Wiederaufnahme der Wurzel „schwer“. Sie deutet nicht aus, ob Schuld, Angst oder innere Qual gemeint ist.
theological_decisions:
- issue: Wesen der künftigen Finsternis
  choice: Die gegenwärtige Nacht erscheint als Bild einer noch kommenden Finsternis, deren genaue Art unbestimmt bleibt.
  alternative: Die Finsternis ausdrücklich als jenseitige Strafe oder ausschließlich als psychischen Schrecken bestimmen.
  rationale: Der Vers weist über die unmittelbare Plage hinaus, legt aber weder Zeitpunkt noch Art des kommenden Gerichts eindeutig fest. Die Übersetzung bewahrt diese Spannung.
- issue: Sinn der Aussage, dass sie sich selbst schwerer waren
  choice: Die ungewöhnliche Selbstaussage wird wörtlich-bildhaft erhalten.
  alternative: Erklärend von Gewissensqual, Schuld oder Angst sprechen.
  rationale: Der griechische Text nennt die Ursache der inneren Belastung nicht. Eine nähere psychologische oder theologische Bestimmung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst markante Wiederholung von „schwer“ bewahrt die rhetorische Klammer des griechischen Textes; Fußnoten erklären die ungewöhnlichen Wendungen, ohne die theologische Offenheit aufzulösen.
