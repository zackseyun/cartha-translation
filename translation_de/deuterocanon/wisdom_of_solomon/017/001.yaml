translation:
  language: de
  text: Denn groß und schwer zu schildern[a] sind deine Gerichte; darum gingen unbelehrte[b] Seelen[c] in die Irre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „schwer zu erzählen“, „schwer zu erklären“ oder „kaum wiederzugeben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „ununterwiesene“, „ungeschulte“ oder „undisziplinierte“. Das griechische Wort kann fehlende Unterweisung ebenso wie fehlende formende Zucht bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Seelen“; sinngemäß könnte auch „Menschen“ stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεγάλαι
  choice: groß
  rationale: Das prädikative Adjektiv bezeichnet die Größe und Tragweite der göttlichen Gerichte; „groß“ bewahrt die breite Aussage des Griechischen.
- source_word: κρίσεις
  choice: Gerichte
  rationale: Der Ausdruck bezeichnet hier Gottes richtende Entscheidungen oder Taten. „Gerichte“ erhält den juristischen und theologischen Klang, ohne die Bedeutung unnötig einzuengen.
- source_word: δυσδιήγητοι
  choice: schwer zu schildern
  rationale: Das Kompositum bezeichnet etwas, das sich nur schwer erzählen, darlegen oder erklären lässt. „Schwer zu schildern“ ist im Deutschen natürlich und behauptet nicht vorschnell völlige Unbeschreiblichkeit.
- source_word: διὰ τοῦτο
  choice: darum
  rationale: Die Wendung kennzeichnet die Folgerung aus dem vorangehenden Satz; „darum“ ist knapp und idiomatisch.
- source_word: ἀπαίδευτοι
  choice: unbelehrte
  rationale: Das Wort bezeichnet einen Mangel an Unterweisung, Bildung oder formender Zucht. „Unbelehrt“ wahrt den Bezug zur fehlenden Unterweisung, ohne ihn ausschließlich als mangelnde Schulbildung zu verstehen.
- source_word: ψυχαὶ
  choice: Seelen
  rationale: Die ausdrückliche anthropologische Redeweise des griechischen Textes bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: ἐπλανήθησαν
  choice: gingen in die Irre
  rationale: Die Form kann ein Verirren oder Irregeführtwerden bezeichnen. „Gingen in die Irre“ gibt das Ergebnis wieder, ohne einen äußeren Verführer festzulegen.
theological_decisions:
- issue: Ob ψυχαὶ wörtlich als „Seelen“ oder idiomatischer als „Menschen“ wiederzugeben ist
  choice: Seelen
  alternative: Menschen
  rationale: „Seelen“ bewahrt die ausdrückliche Wortwahl und die moralisch-geistliche Färbung des griechischen Textes; eine idiomatische Wiedergabe mit „Menschen“ bleibt als Möglichkeit in der Fußnote sichtbar.
- issue: Ob die passive Form ἐπλανήθησαν ein äußeres Irreführen ausdrücklich voraussetzt
  choice: gingen in die Irre
  alternative: wurden irregeführt
  rationale: Der griechische Aorist Passiv kann passiv verstanden werden, lässt aber auch eine intransitive Ergebnisbedeutung zu. Die gewählte Fassung vermeidet es, einen im Satz nicht genannten Handelnden einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung hebt wie das Griechische die Größe und schwere Darstellbarkeit der göttlichen Gerichte hervor. „Unbelehrte“ ist bewusst etwas gehoben, bleibt jedoch verständlich und hält die pädagogisch-moralische Spannweite von ἀπαίδευτοι offen.
