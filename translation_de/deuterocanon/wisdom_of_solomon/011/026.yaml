base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/026.yaml
  text: But you spare all things[a], because they are yours, O Master who loves life. For your imperishable spirit is in all things.
translation:
  language: de
  text: Doch du schonst alles, weil es dir gehört, Gebieter, der du das Leben liebst.[a] Denn dein unvergänglicher Geist ist in allem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der du die Seelen liebst“. Das griechische φιλόψυχε kann enger auf Seelen oder Lebewesen bezogen werden; der Zusammenhang spricht jedoch von Gottes Fürsorge für die gesamte Schöpfung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φείδῃ
  choice: du schonst
  rationale: Das Verb bezeichnet, dass jemand vor Schaden oder Vernichtung bewahrt wird. „Du schonst“ gibt den direkten Sinn knapp und natürlich wieder.
- source_word: πάντων
  choice: alles
  rationale: Der Genitiv bei φείδῃ umfasst hier die Gesamtheit der Schöpfung. „Alles“ ist im Deutschen natürlicher als „alle Dinge“ und bewahrt den umfassenden Bezug.
- source_word: σά ἐστιν
  choice: es dir gehört
  rationale: Die prädikative Possessivkonstruktion verweist auf πάντων zurück. Die deutsche Formulierung macht die Besitzbeziehung idiomatisch deutlich.
- source_word: Δέσποτα
  choice: Gebieter
  rationale: Δέσποτα bezeichnet den Herrn oder Besitzer mit umfassender Verfügungsgewalt. „Gebieter“ wahrt die Unterscheidung zu κύριος besser als „Herr“, ohne den Sinn zu einer abstrakten Herrschaftsaussage auszuweiten.
- source_word: φιλόψυχε
  choice: der du das Leben liebst
  rationale: Das zusammengesetzte Wort kann Liebe zum Leben beziehungsweise zu lebenden Wesen oder Seelen ausdrücken. Im Zusammenhang mit Gottes Fürsorge für die ganze Schöpfung gibt „der du das Leben liebst“ den weiten Sinn verständlich wieder.
- source_word: ἄφθαρτόν
  choice: unvergänglicher
  rationale: Das Adjektiv bezeichnet, was weder Verfall noch Verderben unterliegt. „Unvergänglich“ ist klar, würdevoll und im theologischen Sprachgebrauch geläufig.
- source_word: πνεῦμά
  choice: Geist
  rationale: πνεῦμα meint hier Gottes belebende und gegenwärtige Kraft, nicht lediglich Atem oder Wind. „Geist“ erhält die theologische und literarische Mehrdeutigkeit.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die Wendung greift den umfassenden Schöpfungsbezug von πάντων auf. „In allem“ ist knapp und lässt offen, ob der Schwerpunkt auf allen Dingen oder allen Lebewesen liegt.
theological_decisions:
- issue: Bedeutung von φιλόψυχε im Blick auf Gottes Verhältnis zur Schöpfung
  choice: der du das Leben liebst
  alternative: der du die Seelen liebst
  rationale: Dass Gott alles schont, weil es ihm gehört, und dass sein unvergänglicher Geist in allem ist, legt einen weiten, auf die Schöpfung bezogenen Sinn nahe. Die engere, stärker anthropologische Deutung bleibt in der Fußnote sichtbar.
- issue: Wiedergabe des Gottestitels Δέσποτα
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: „Gebieter“ bewahrt die besondere Bedeutung von Δέσποτα und unterscheidet den Titel von κύριος. „Herrscher“ würde stärker die Ausübung von Herrschaft hervorheben, während „Herr“ die lexikalische Unterscheidung einebnen könnte.
- issue: Aussage, dass Gottes Geist ἐν πᾶσιν ist
  choice: dein unvergänglicher Geist ist in allem
  alternative: dein unvergänglicher Geist ist in allen
  rationale: „In allem“ entspricht dem umfassenden Zusammenhang und bewahrt die spannungsreiche Aussage über Gottes Gegenwart in der Schöpfung, ohne sie auf Menschen oder beseelte Wesen einzugrenzen oder systematisch zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und die direkte Anrede bleiben erhalten. „Alles“ und „in allem“ bilden bewusst eine sprachliche Klammer; die universale Aussage wird nicht dogmatisch eingeengt.
