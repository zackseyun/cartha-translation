base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/015.yaml
  text: But in return for the foolish reasonings of their unrighteousness[a], by which, having been led astray, they worshiped irrational creeping things and worthless beasts, you sent upon them a multitude of irrational animals for punishment[c][b],
translation:
  language: de
  text: Doch als Vergeltung für die törichten Überlegungen ihrer Ungerechtigkeit[a], durch die sie irregeführt wurden und vernunftlose Kriechtiere und wertlose Bestien verehrten, sandtest du eine Menge vernunftloser Tiere über sie – zur Bestrafung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die törichten Gedanken ihres Unrechts“.'
    reason: Lexikalische Alternativen für λογισμῶν ἀσυνέτων und ἀδικίας.
  - marker: b
    text: 'Das griechische Wort kann hier auch „Vergeltung“ oder „Rache“ bedeuten. Außerdem wird „vernunftlos“ im Griechischen bewusst wiederholt: Den vernunftlosen Kriechtieren und Bestien, die sie verehrten, entsprechen die vernunftlosen Tiere, die zu ihrer Bestrafung gesandt werden.'
    reason: Bewahrt die Bedeutungsbreite von ἐκδίκησις und erklärt das rhetorische Echo von ἄλογος.
lexical_decisions:
- source_word: ἀντὶ
  choice: als Vergeltung für
  rationale: Drückt hier die vergeltende Entsprechung zwischen der Verfehlung und der gesandten Plage aus, nicht bloß einen Austausch.
- source_word: λογισμῶν ἀσυνέτων
  choice: törichten Überlegungen
  rationale: Bewahrt gegenüber dem allgemeineren „Gedanken“ die Bedeutung bewusster, jedoch verfehlter Erwägungen.
- source_word: ἀδικίας αὐτῶν
  choice: ihrer Ungerechtigkeit
  rationale: Gibt den umfassenden moralischen Begriff wieder, ohne ihn ausschließlich auf gesellschaftliches Unrecht oder eine bestimmte dogmatische Terminologie zu verengen.
- source_word: ἐν οἷς πλανηθέντες
  choice: durch die sie sich irreführen ließen
  rationale: Versteht ἐν οἷς instrumental und wahrt beim Partizip die passive Bedeutung des Irregeführtwerdens.
- source_word: ἐθρήσκευον
  choice: verehrten
  rationale: Bezeichnet hier religiöse Verehrung; das natürliche deutsche Verb lässt im Kontext klar den Götzendienst erkennen.
- source_word: ἄλογα ἑρπετὰ
  choice: vernunftlose Kriechtiere
  rationale: „Vernunftlos“ bildet ἄλογος präzise ab und ermöglicht die rhetorische Wiederholung; „Kriechtiere“ ist eine natürliche Wiedergabe von ἑρπετά.
- source_word: κνώδαλα εὐτελῆ
  choice: wertlose Bestien
  rationale: Bewahrt den abwertenden Ton sowie die lexikalische Unterscheidung von den später genannten ζῷα.
- source_word: ἐπαπέστειλας αὐτοῖς
  choice: sandtest du ... über sie
  rationale: Gibt die gegen sie gerichtete, bedrängende Bewegung des zusammengesetzten Verbs im Gerichtskontext idiomatisch wieder.
- source_word: πλῆθος ἀλόγων ζῴων
  choice: eine Menge vernunftloser Tiere
  rationale: Bewahrt sowohl πλῆθος als auch die bewusste Wiederholung von ἄλογος.
- source_word: εἰς ἐκδίκησιν
  choice: zur Bestrafung
  rationale: Passt zum gerichtlichen Zusammenhang und vermeidet die mögliche Nebenbedeutung persönlicher Rachsucht.
theological_decisions:
- issue: Moralisch-religiöse Tragweite von ἀδικία
  choice: ihrer Ungerechtigkeit
  alternative: ihres Unrechts / ihrer Gottlosigkeit
  rationale: „Ungerechtigkeit“ wahrt die breite moralische Aussage des griechischen Wortes; „Gottlosigkeit“ würde die Bedeutung im Blick auf den Götzendienst zu stark festlegen.
- issue: Rhetorische Wiederholung von ἄλογος
  choice: vernunftlose ... vernunftloser
  alternative: unvernünftige ... stumpfer
  rationale: 'Die Wiederholung macht die ironische Entsprechung sichtbar: Wegen der Verehrung vernunftloser Geschöpfe werden sie durch vernunftlose Tiere bestraft.'
- issue: Bedeutung von ἐκδίκησις
  choice: Bestrafung
  alternative: Vergeltung / Rache
  rationale: „Bestrafung“ wahrt den gerichtlichen Sinn, während „Rache“ unnötig eine affektive Deutung nahelegen könnte. Die Vergeltungsstruktur wird bereits durch ἀντί ausgedrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Vergeltungslogik, wurde jedoch für flüssiges Deutsch leicht gegliedert. „Bestien“ erhält den abwertenden Klang von κνώδαλα und unterscheidet den Ausdruck von ζῷα („Tiere“).
