base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/001.yaml
  text: He prospered their works by the hand of a holy prophet[a].
translation:
  language: de
  text: Er ließ ihre Werke durch die Hand eines heiligen Propheten gelingen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »heiligen Propheten« ist dem Zusammenhang nach wahrscheinlich Mose gemeint; im griechischen Text dieses Verses wird er jedoch nicht namentlich genannt.
    reason: cross_reference
lexical_decisions:
- source_word: Εὐόδωσεν
  choice: ließ … gelingen
  rationale: 'Gibt die kausative Bedeutung von εὐοδόω natürlich wieder: Der unausgesprochene Handelnde bewirkte den Erfolg ihrer Tätigkeiten.'
- source_word: τὰ ἔργα αὐτῶν
  choice: ihre Werke
  rationale: Bewahrt die breite Bedeutung von ἔργα als Werke, Taten oder Unternehmungen, ohne den Bezug unnötig einzuengen.
- source_word: ἐν χειρὶ
  choice: durch die Hand
  rationale: Erhält die biblische Wendung und bezeichnet zugleich die vermittelnde Mitwirkung des Propheten.
- source_word: προφήτου ἁγίου
  choice: eines heiligen Propheten
  rationale: Die artikellose griechische Form wird unbestimmt wiedergegeben; der Prophet wird im Vers selbst nicht namentlich genannt.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verbs
  choice: Das Subjekt bleibt als „Er“ unausgesprochen bestimmt und wird nicht mit „Gott“ oder „der Herr“ ergänzt.
  alternative: „Gott ließ … gelingen“ oder „Der Herr ließ … gelingen“
  rationale: Im Griechischen steht kein ausdrückliches Subjekt. Der Zusammenhang weist auf Gott, doch die Übersetzung wahrt den Grad der Explizitheit des Ausgangstextes.
- issue: Identität des Propheten
  choice: „eines heiligen Propheten“
  alternative: „Mose“ oder „seines heiligen Propheten“
  rationale: Der Zusammenhang legt Mose nahe, aber der griechische Vers nennt ihn weder beim Namen noch verwendet er ein Possessivpronomen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Durch die Hand“ bewahrt bewusst die biblische Bildsprache; „ließ … gelingen“ ist idiomatischer als eine wörtliche Nachbildung mit „förderte“ und erhält den kausativen Sinn.
