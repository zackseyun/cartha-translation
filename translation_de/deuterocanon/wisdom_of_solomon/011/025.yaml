base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/025.yaml
  text: For how could anything have remained[a], if you had not willed it? Or how could what had not been called by you have been preserved?
translation:
  language: de
  text: Denn wie hätte irgendetwas bestehen können, wenn du es nicht gewollt hättest? Oder wie hätte erhalten bleiben können, was nicht von dir gerufen worden war?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutlicher: »was nicht von dir ins Dasein gerufen worden war«. Im Griechischen steht nur »gerufen«; im Zusammenhang kann damit Gottes schöpferischer Ruf gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ ἔμεινεν ἄν τι
  choice: Denn wie hätte irgendetwas bestehen können
  rationale: Die rhetorische Frage bezeichnet die Unmöglichkeit fortdauernder Existenz ohne Gottes Willen. »Bestehen können« gibt μένω in diesem Zusammenhang natürlich und präzise wieder.
- source_word: εἰ μὴ σὺ ἠθέλησας
  choice: wenn du es nicht gewollt hättest
  rationale: θέλω bezeichnet hier Gottes absichtsvolles Wollen. Die deutsche irreale Form bewahrt den kontrafaktischen Sinn der griechischen Konstruktion.
- source_word: τὸ μὴ κληθὲν ὑπὸ σοῦ
  choice: was nicht von dir gerufen worden war
  rationale: Die Wiedergabe bleibt beim wörtlichen »gerufen« und macht die im Kontext mögliche Bedeutung »ins Dasein gerufen« nicht ohne Kennzeichnung zum Haupttext.
- source_word: διετηρήθη
  choice: wäre erhalten geblieben
  rationale: Das Verb bezeichnet Bewahrung beziehungsweise Erhaltung, im Kontext besonders das Fortbestehen. Die Formulierung führt den irreal-rhetorischen Gedankengang idiomatisch fort.
theological_decisions:
- issue: Ob τὸ μὴ κληθέν im Haupttext ausdrücklich als schöpferisches Ins-Dasein-Rufen wiedergegeben werden soll
  choice: Im Haupttext steht das formal nähere »was nicht von dir gerufen worden war«.
  alternative: was nicht von dir ins Dasein gerufen worden war
  rationale: Der Zusammenhang legt einen schöpferischen Ruf Gottes nahe, doch der griechische Wortlaut sagt lediglich »gerufen«. Die mögliche existenzielle Bedeutung wird deshalb in einer Fußnote erläutert, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden rhetorischen Fragen sind parallel und gut verständlich formuliert; die direkte Anrede Gottes und die genuine Deutungsoffenheit von »gerufen« bleiben erhalten.
