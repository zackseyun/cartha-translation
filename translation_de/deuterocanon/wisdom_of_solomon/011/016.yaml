translation:
  language: de
  text: damit sie erkennen, dass ein Mensch durch eben die Dinge bestraft wird, durch die er sündigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „damit sie erkennen, dass jemand durch die Dinge, durch die er sündigt, durch diese bestraft wird“. Im Griechischen wird dieselbe Präposition wiederholt, um die Entsprechung zwischen Sünde und Strafe hervorzuheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνῶσιν
  choice: damit sie erkennen
  rationale: Die Verbindung aus ἵνα und Aorist Konjunktiv bezeichnet hier Zweck beziehungsweise beabsichtigtes Ergebnis. „Damit sie erkennen“ ist natürliches Deutsch und bewahrt diese Funktion.
- source_word: διʼ ὧν … διὰ τούτων
  choice: durch eben das … wodurch
  rationale: Die wiederholte Präposition διά hebt die Entsprechung zwischen dem Mittel der Sünde und dem der Bestrafung hervor. Die deutsche Verschränkung gibt diese Wiederaufnahme knapp und deutlich wieder.
- source_word: τις
  choice: ein Mensch
  rationale: Das indefinite Singularpronomen bezeichnet allgemein eine Person. „Ein Mensch“ ist verständlich und bewahrt den generischen Bezug.
- source_word: ἁμαρτάνει
  choice: sündigt
  rationale: „Sündigt“ erhält den moralisch-theologischen Gehalt des Verbs und ist präziser als das allgemeinere „Unrecht tut“.
- source_word: κολάζεται
  choice: bestraft wird
  rationale: Im Zusammenhang bezeichnet das Verb strafendes Erleiden beziehungsweise Gericht. „Bestraft wird“ gibt dies wieder, ohne zusätzlich eine bestimmte Art der Strafe festzulegen.
theological_decisions:
- issue: Entsprechung von Sünde und Strafe
  choice: Die Strafe trifft einen Menschen durch eben das, wodurch er sündigt.
  alternative: Sünder werden lediglich im Zusammenhang mit ihren Sünden bestraft, ohne dass eine engere Entsprechung ausgesagt wird.
  rationale: Die parallele Konstruktion διʼ ὧν … διὰ τούτων betont eine angemessene, maßentsprechende Beziehung zwischen Sünde und Strafe. Die Übersetzung wahrt diese Aussage, ohne sie über den Wortlaut hinaus zu systematisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Formulierung vermeidet unnötige Wiederholungen im Haupttext; die Fußnote macht die auffällige griechische Parallelkonstruktion transparent.
