  text: or foul masses of smoke being winnowed[a], or terrible sparks flashing from their eyes—whose harm was able not only to crush them together, but even their frightening appearance to destroy them.
translation:
  language: de
  text: oder widerliche Rauchmassen, die geworfelt wurden[a], oder furchtbare Funken, die aus ihren Augen blitzten. Deren schädliche Wirkung hätte sie nicht nur zermalmen können; schon ihr furchteinflößender Anblick hätte sie vernichten können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „widerliche Rauchmassen, die geworfelt wurden“. Das griechische Wort stammt aus dem Bereich des Worfelns, bei dem Getreide in die Luft geworfen wird, damit der Wind die Spreu fortträgt; gemeint sein können auch widerliche Rauchwolken, die umhergewirbelt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρόμους
  choice: widerliche … Massen
  rationale: Das seltene Substantiv bezeichnet etwas Widerwärtiges oder Unreines. Zusammen mit καπνοῦ bewahrt „widerliche Rauchmassen“ die konkrete, bedrohliche Bildsprache.
- source_word: λικμωμένους
  choice: die wie Spreu geworfelt wurden
  rationale: λικμάω bezeichnet ursprünglich das Worfeln von Getreide. Der Vergleich mit Spreu macht das landwirtschaftliche Bild im heutigen Deutsch verständlich, ohne es auf ein bloßes Umherwirbeln zu reduzieren.
- source_word: καπνοῦ
  choice: Rauchmassen
  rationale: Der griechische Genitiv wird in einem natürlichen deutschen Kompositum wiedergegeben; die genaue Beschaffenheit der widerlichen Gebilde bleibt dabei offen.
- source_word: δεινούς
  choice: furchtbare
  rationale: δεινός hebt hier die Schrecken erregende Wirkung hervor, nicht moralische Bosheit.
- source_word: ἀπʼ ὀμμάτων σπινθῆρας ἀστράπτοντας
  choice: Funken, die aus ihren Augen blitzten
  rationale: Die Formulierung erhält sowohl den Ursprung aus den Augen als auch das plötzliche, blitzartige Leuchten.
- source_word: βλάβη
  choice: Schaden
  rationale: „Schaden“ gibt den weiten Sinn von Verletzung oder schädlicher Wirkung knapp und natürlich wieder.
- source_word: συνεκτρῖψαι
  choice: zermalmen
  rationale: Das Verb bezeichnet ein heftiges, vollständiges Zermalmen. Eine gesonderte Wiedergabe des Präfixes συν- als „zusammen“ wäre im Deutschen missverständlich.
- source_word: ἡ ὄψις ἐκφοβήσασα
  choice: ihr erschreckender Anblick
  rationale: Die Wendung verbindet den bloßen Anblick mit seiner Furcht auslösenden Wirkung.
- source_word: διολέσαι
  choice: vernichten
  rationale: „Vernichten“ wahrt die starke Bedeutung vollständiger Zerstörung.
theological_decisions:
- issue: Grad der Wörtlichkeit in der verdichteten Schreckensbildsprache
  choice: Das Worfelbild und die aus den Augen blitzenden Funken bleiben ausdrücklich erhalten.
  alternative: „Widerliche Rauchwolken, die umherwirbelten“
  rationale: Die ungewöhnliche Bildsprache gehört zur Aussagekraft des griechischen Textes. Die ergänzende Vergleichsformel „wie Spreu“ macht sie verständlich, ohne sie in eine glatte Paraphrase aufzulösen.
- issue: Bezug von ὧν und der folgenden Singularsubjekte
  choice: Der kollektive Rückbezug wird durch „diese Wesen“ verdeutlicht, während Schaden und Anblick als jeweils mögliche Ursache der Vernichtung unterschieden bleiben.
  alternative: Ein enges „deren Schaden … und deren Anblick“
  rationale: Das Griechische bezieht ὧν auf die zuvor vorgestellten möglichen Geschöpfe oder Erscheinungen. Die deutsche Explizierung verhindert einen unklaren Bezug auf die Funken allein und fügt keine bestimmte Deutung ihrer Art hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche poetische Bildsprache bleibt erhalten; der lange griechische Relativsatz wird zur besseren Verständlichkeit in zwei ausgewogene Hauptsätze entfaltet.
