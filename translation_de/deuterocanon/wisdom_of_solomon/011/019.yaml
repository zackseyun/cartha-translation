  to: oder widerliche Rauchmassen, die geworfelt wurden[a], oder furchtbare Funken, die aus ihren Augen blitzten. Deren schädliche Wirkung hätte sie nicht nur zermalmen können; schon ihr furchteinflößender Anblick hätte sie vernichten können.
  rationale: Die Revision entfernt die nicht im Griechischen ausgedrückte Vergleichsformel „wie Spreu“ und korrigiert die referenzielle Fehlleitung durch „diese Wesen“. „Deren schädliche Wirkung“ wahrt den kollektiven Rückbezug von ὧν auf beide Schreckenserscheinungen, ohne den im Vers vorausgesetzten Bezug von αὐτούς unnötig zu benennen. Die hypothetische Form bleibt im Deutschen passend zum fortlaufenden Möglichkeitsgedanken des Kontextes.
