  naturalness: Der Text ist überwiegend modernes, würdiges Deutsch. Die Konstruktion „der Schaden, den diese Wesen anrichten konnten, hätte sie ...“ ist jedoch logisch missverständlich, weil „sie“ zunächst auf die Wesen zurückweist. Eine knappe Relativkonstruktion mit „deren schädliche Wirkung“ ist sowohl klarer als auch näher am griechischen Satzbau. „Geworfelt“ darf als bewusst ungewöhnliches poetisches Bild stehen, wenn die Fußnote es erläutert.
  terminology: „Furchtbare“, „zermalmen“, „furchteinflößender Anblick“ und „vernichten“ sind angemessen. „Schädliche Wirkung“ gibt βλάβη in diesem Zusammenhang präziser wieder als ein von den Erscheinungen aktiv „angerichteter Schaden“.
