    issue: Die Konstruktion „ob sie abwesend oder anwesend waren“ verschiebt die syntaktische Funktion der griechischen Partizipien.
    rationale: ἀπόντες und παρόντες bezeichnen zwei Personengruppen („die Abwesenden“ und „die Anwesenden“), nicht eine Frage oder Bedingung. Die paarige substantivische Wiedergabe bildet den Ausgangstext genauer ab.
  - severity: low
    issue: „zermürbt“ ist als Haupttextwiedergabe etwas enger als ἐτρύχοντο.
    rationale: Das Verb kann bedrängt, geplagt oder aufgerieben werden bedeuten. „Zermürbt“ ist möglich, betont im Deutschen aber stärker einen spezifisch psychisch-erschöpfenden Vorgang.
