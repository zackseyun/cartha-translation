  verdict: revise
  source_fidelity: Der Gegensatz von ἀπόντες und παρόντες sowie ὁμοίως ist grundsätzlich zutreffend erfasst. Die deutsche Konstruktion „ob sie ... waren“ macht die im Griechischen substantivisch gebrauchten Partizipien jedoch unnötig zu einer indirekten Frage beziehungsweise Bedingung. „Geplagt“ gibt ἐτρύχοντο als allgemeines, andauerndes Erleiden von Bedrängnis idiomatisch wieder, ohne die Bedeutung auf psychisches Zermürbtwerden einzuengen.
  naturalness: „Sowohl die Abwesenden als auch die Anwesenden“ ist im modernen Standarddeutsch die klare und natürliche Entsprechung der antithetischen Partizipien. Die Formulierung ist knapp und wahrt den würdigen Registerton.
  terminology: „Geplagt“ ist für τρύχω in diesem Kontext weiter und ausgewogener als „zermürbt“, das im heutigen Deutsch oft speziell an lang anhaltende psychische Erschöpfung denken lässt. Die Fußnote hält die engeren beziehungsweise bildhafteren Alternativen offen.
