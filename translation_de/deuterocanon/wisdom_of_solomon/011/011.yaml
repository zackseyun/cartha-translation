  text: And both those absent and those present were afflicted alike;[a]
translation:
  language: de
  text: Und sowohl die Abwesenden als auch die Anwesenden wurden gleichermaßen geplagt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurden bedrängt«, »wurden gequält« oder »wurden zermürbt«; das griechische Verb kann ein fortdauerndes Plagen, Bedrängen oder Aufreiben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόντες
  choice: abwesend
  rationale: Das Partizip bezeichnet Menschen, die fern beziehungsweise nicht zugegen sind, und wahrt den Gegensatz zu παρόντες.
- source_word: παρόντες
  choice: anwesend
  rationale: Das Partizip bezeichnet Menschen, die zugegen sind; „anwesend“ bildet einen klaren, natürlichen Gegensatz zu „abwesend“.
- source_word: ὁμοίως
  choice: gleichermaßen
  rationale: Das Adverb bezeichnet eine gleiche Weise oder ein gleiches Maß und wird im Deutschen prägnant mit „gleichermaßen“ wiedergegeben.
- source_word: ἐτρύχοντο
  choice: wurden zermürbt
  rationale: Der Imperfekt von τρύχω beschreibt ein andauerndes Aufreiben, Zermürben oder Leiden. „Wurden zermürbt“ bewahrt dieses Bild und legt die Art des Leidens nicht unnötig eng fest.
theological_decisions:
- issue: Art des mit ἐτρύχοντο bezeichneten Leidens
  choice: allgemeines, fortdauerndes Zermürbtwerden
  alternative: „wurden gequält“ oder „litten Not“
  rationale: Das griechische Verb kann Bedrängnis und Qual ausdrücken, hat aber den Grundsinn des Aufreibens beziehungsweise Zermürbens. Die gewählte Wiedergabe vermeidet eine unnötige Festlegung auf körperliche Folter oder eine bestimmte Form göttlicher Strafe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarige Gegenüberstellung von Abwesenden und Anwesenden bleibt erhalten; der Imperfekt wird durch die deutsche Verlaufsbedeutung des Prädikats sinngemäß wiedergegeben.
