  text: But you have mercy on all[a], because you are able to do all things[b], and you overlook the sins of men for repentance.
translation:
  language: de
  text: Doch du erbarmst dich aller, weil du alles vermagst, und siehst über die Sünden der Menschen hinweg[a], damit sie umkehren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das „Hinwegsehen“ meint barmherzige Nachsicht: Gott vollstreckt das Gericht nicht sogleich. Es bedeutet nicht, dass ihm die Sünden gleichgültig wären.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „zur Umkehr“. Die griechische Wendung kann das Ziel oder das Ergebnis bezeichnen.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐλεεῖς
  choice: du erbarmst dich
  rationale: Die Wendung gibt barmherziges Mitgefühl und entsprechendes Handeln würdig und idiomatisch wieder.
- source_word: πάντας
  choice: aller
  rationale: Der uneingeschränkte Plural bezeichnet hier alle Menschen; „aller“ bewahrt den knappen universalen Umfang des Griechischen.
- source_word: πάντα δύνασαι
  choice: du alles vermagst
  rationale: „Alles vermagst“ bringt die umfassende Macht beziehungsweise Fähigkeit prägnant und in einem gehobenen, aber geläufigen Register zum Ausdruck.
- source_word: παρορᾷς
  choice: siehst … hinweg
  rationale: Die Wendung bezeichnet hier ein bewusstes, barmherziges Vorübergehen an den Sünden, nicht Unkenntnis oder Gleichgültigkeit.
- source_word: ἁμαρτήματα
  choice: Sünden
  rationale: „Sünden“ ist die klare und sachlich passende Standardwiedergabe.
- source_word: ἀνθρώπων
  choice: der Menschen
  rationale: ἄνθρωπος bezeichnet hier Menschen allgemein; das deutsche „Menschen“ gibt diesen generischen Umfang genau und natürlich wieder.
- source_word: εἰς μετάνοιαν
  choice: damit sie umkehren
  rationale: Die verbale Wiedergabe drückt die auf Umkehr gerichtete Funktion der Präpositionalphrase natürlich aus; die mögliche Nuance von Ziel oder Ergebnis bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Bedeutung des göttlichen Hinwegsehens über Sünden
  choice: Gott hält das Gericht in Barmherzigkeit zurück und eröffnet damit Raum zur Umkehr.
  alternative: Gott beachte die Sünden nicht oder vergebe sie bereits vollständig in diesem Satzteil.
  rationale: Die Verbindung mit εἰς μετάνοιαν kennzeichnet das Hinwegsehen als auf Umkehr gerichtete Nachsicht. Der Vers sagt weder, dass Sünde belanglos sei, noch bezeichnet er hier ausdrücklich den vollständigen Vollzug der Vergebung.
- issue: Ziel- oder Ergebnisnuance von εἰς μετάνοιαν
  choice: „damit sie umkehren“ im Haupttext, mit Hinweis auf die formalere Wiedergabe „zur Umkehr“.
  alternative: „zur Umkehr“ ohne ausdrückliche Festlegung auf einen finalen Nebensatz.
  rationale: εἰς kann Ziel beziehungsweise Ergebnis ausdrücken. Der Haupttext formuliert den naheliegenden Zweck natürlich, während die Fußnote die grammatische Offenheit bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ gibt den kontrastierenden Anschluss von δέ wieder; „alles vermagst“ erhält den gehobenen Ton, ohne altertümlich zu wirken.
