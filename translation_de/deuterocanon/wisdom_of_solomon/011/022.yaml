base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/022.yaml
  text: For the whole world before you is like a speck on the scales[a], and like a drop of morning dew that falls upon the earth.
translation:
  language: de
  text: Denn die ganze Welt ist vor dir wie ein Stäubchen auf der Waage[a] und wie ein Tropfen Morgentau, der auf die Erde fällt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie der Ausschlag einer Waage“ oder „wie ein winziges Gewicht auf der Waage“; das griechische Bild betont äußerste Geringfügigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥοπὴ ἐκ πλαστίγγων
  choice: ein Stäubchen auf der Waage
  rationale: Die griechische Wendung bezeichnet etwas äußerst Geringes im Bild einer Waage; „Stäubchen auf der Waage“ vermittelt diese verschwindende Leichtigkeit im Deutschen natürlich. Da ῥοπή auch den Ausschlag beziehungsweise eine winzige Gewichtsgröße bezeichnen kann, werden die engeren Alternativen in der Fußnote bewahrt.
- source_word: ὅλος ὁ κόσμος
  choice: die ganze Welt
  rationale: κόσμος bezeichnet hier die Welt als umfassende geordnete Gesamtheit. „Die ganze Welt“ ist verständlich und vermeidet die unnötige Festlegung auf „Universum“.
- source_word: ἐναντίον σου
  choice: vor dir
  rationale: Die räumlich-relationale Grundbedeutung bleibt erhalten und lässt zugleich den im Vergleich ausgedrückten Größenunterschied erkennen.
- source_word: ῥανὶς δρόσου ὄρθρινὴ
  choice: ein Tropfen Morgentau
  rationale: ῥανίς bedeutet „Tropfen“, während δρόσου ὄρθρινή den Tau des frühen Morgens bezeichnet. Die deutsche Zusammensetzung ist knapp, natürlich und bildhaft.
- source_word: κατελθοῦσα ἐπὶ γῆν
  choice: der auf die Erde fällt
  rationale: Das Partizip beschreibt das Herabkommen des Tautropfens. „Fällt“ gibt das Bild in idiomatischem Deutsch wieder, ohne zusätzliche Deutung.
theological_decisions:
- issue: Vergleichsweise Winzigkeit der Welt vor Gott
  choice: Die beiden konkreten Vergleiche werden unmittelbar wiedergegeben.
  alternative: 'Abstrakt und stärker deutend formulieren: „ist vor dir wie nichts“.'
  rationale: Der griechische Text erklärt die Schöpfung nicht ausdrücklich für wertlos, sondern stellt ihre verschwindende Größe vor Gott durch zwei poetische Bilder dar. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die Satzstruktur und die beiden parallelen Vergleiche des griechischen Textes bleiben erhalten.
