base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/020.yaml
  text: And even apart from these things, they could have fallen by a single breath, pursued by justice and winnowed by the breath of your power; but you have arranged all things by measure and number and weight.
translation:
  language: de
  text: Und auch ohne all dies hätten sie durch einen einzigen Hauch fallen können,[a] verfolgt von der Gerechtigkeit[b] und vom Hauch deiner Macht verweht. Doch du hast alles nach Maß und Zahl und Gewicht geordnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch einen einzigen Wind« oder »durch einen einzigen Geist«. Das griechische Wort kann Hauch, Wind oder Geist bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vom Gericht« oder »von der Strafe«. Das griechische Wort kann Gerechtigkeit, Gericht oder Strafe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ τούτων
  choice: Und auch ohne all dies
  rationale: χωρίς mit Genitiv bezeichnet, dass die zuvor genannten Mittel nicht nötig gewesen wären; „auch ohne all dies“ gibt den Kontrast natürlich und genau wieder.
- source_word: ἐνὶ πνεύματι
  choice: durch einen einzigen Hauch
  rationale: ἐνί bedeutet „ein/einziger“; πνεῦμα kann Hauch, Wind oder Geist bezeichnen. „Hauch“ wahrt die konkrete Kraft und den Zusammenhang mit dem späteren Worfeln.
- source_word: πεσεῖν
  choice: fallen können
  rationale: Der Infinitiv von πίπτω bedeutet wörtlich „fallen“. Die deutsche Konstruktion mit ἐδύναντο lautet idiomatisch „hätten ... fallen können“ und lässt die im Kontext mitschwingende Vernichtung unausgedeutet.
- source_word: ὑπὸ τῆς δίκης διωχθέντες
  choice: verfolgt von der Gerechtigkeit
  rationale: δίκη kann Gerechtigkeit, Gericht oder Strafe bedeuten. „Gerechtigkeit“ bewahrt hier die Personifikation einer sie verfolgenden Macht.
- source_word: λικμηθέντες
  choice: fortgeworfelt
  rationale: λικμάω bezeichnet das Worfeln, bei dem insbesondere die Spreu vom Wind fortgetragen wird. „fortgeworfelt“ erhält das landwirtschaftliche Bild und die vernichtende Bewegung.
- source_word: ὑπὸ πνεύματος δυνάμεώς σου
  choice: vom Hauch deiner Macht
  rationale: Die Wiederholung von „Hauch“ bildet die Wiederholung von πνεῦμα ab; der Genitiv δυνάμεώς σου wird eng als „deiner Macht“ wiedergegeben.
- source_word: πάντα ... διέταξας
  choice: du hast alles ... geordnet
  rationale: διατάσσω bezeichnet ordnen oder anordnen. „geordnet“ ist im Deutschen würdevoll, verständlich und passt zur folgenden Dreierformel.
- source_word: μέτρῳ καὶ ἀριθμῷ καὶ σταθμῷ
  choice: nach Maß und Zahl und Gewicht
  rationale: Die instrumentalen Dative bezeichnen die Größen, nach denen alles geordnet ist. Die bekannte, prägnante Dreierformel bleibt formal erhalten.
theological_decisions:
- issue: Bedeutung von πνεῦμα an beiden Stellen
  choice: Hauch
  alternative: Wind oder Geist
  rationale: Das Worfelbild legt eine physisch wirkende Luftbewegung nahe. „Hauch“ bewahrt zugleich die Resonanz göttlicher Wirksamkeit, ohne eine ausdrücklich personale Geist-Deutung festzuschreiben; die Mehrdeutigkeit wird in der Fußnote ausgewiesen.
- issue: Bedeutung von δίκη
  choice: Gerechtigkeit
  alternative: Gericht oder Strafe
  rationale: Die Gerechtigkeit erscheint als handelnde Verfolgerin. „Strafe“ würde den Ausdruck auf seine Folge verengen; die anderen möglichen gerichtlichen Bedeutungen bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzspannung und die formale Schlussformel „Maß und Zahl und Gewicht“ bleiben erhalten. „Fortgeworfelt“ ist ein bewusst konkreter landwirtschaftlicher Ausdruck; der Zusammenhang macht die Bedeutung verständlich.
