base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/008.yaml
  text: You gave them abundant water unexpectedly[a], showing through their thirst at that time how you punished their adversaries.
translation:
  language: de
  text: Du gabst ihnen unerwartet Wasser in Fülle[a] und zeigtest durch ihren damaligen Durst, wie du ihre Widersacher bestraftest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wider alle Hoffnung“ beziehungsweise „als sie nicht mehr damit rechneten“.'
    reason: Lexikalische Alternative zu ἀνελπίστως, das sowohl Unerwartetheit als auch ein Geschehen jenseits bestehender Hoffnung ausdrücken kann.
lexical_decisions:
- source_word: ἔδωκας
  choice: Du gabst
  rationale: Der Aorist von δίδωμι wird unmittelbar und natürlich als einfache vergangene Handlung wiedergegeben.
- source_word: δαψιλὲς ὕδωρ
  choice: Wasser in Fülle
  rationale: Die idiomatische deutsche Wendung bewahrt den Sinn einer reichlichen, großzügigen Wassermenge.
- source_word: ἀνελπίστως
  choice: unerwartet
  rationale: Das Adverb bezeichnet ein Geschehen wider Erwarten; die mögliche stärkere Nuance „wider alle Hoffnung“ bleibt in der Fußnote erhalten.
- source_word: δείξας
  choice: und zeigtest
  rationale: Das griechische Partizip bezeichnet eine begleitende beziehungsweise erläuternde Handlung. Ein koordinierter deutscher Satz klingt natürlich und hält den sachlichen Zusammenhang fest.
- source_word: διὰ τοῦ τότε δίψους
  choice: durch ihren damaligen Durst
  rationale: „Durch“ erhält den instrumentalen Charakter von διά; „damaligen“ gibt τότε knapp und idiomatisch wieder. Das possessive „ihren“ wird aus dem Kontext ergänzt.
- source_word: τοὺς ὑπεναντίους
  choice: ihre Widersacher
  rationale: Der Ausdruck bezeichnet die ihnen feindlich Gegenüberstehenden. „Widersacher“ wahrt den gehobenen Ton, ohne die Gegner genauer zu identifizieren, als es der Vers selbst tut.
- source_word: ἐκόλασας
  choice: du … bestraftest
  rationale: κολάζω bezeichnet hier eine strafende Handlung; „bestrafen“ ist klar und unverhüllt.
theological_decisions:
- issue: Bezug von „ihnen“ und „ihre Widersacher“
  choice: Die Pronomen bleiben stehen; im unmittelbaren Zusammenhang bezeichnet „ihnen“ Gottes Volk und „ihre Widersacher“ dessen Gegner.
  alternative: Eine allgemeinere Gegenüberstellung der Gerechten und ihrer Gegner.
  rationale: Der Kontext von Weisheit 11 legt Israel und seine ägyptischen Gegner nahe, doch der Vers nennt sie nicht ausdrücklich. Die Übersetzung bewahrt daher die pronominale Form und vermeidet eine auslegende Konkretisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wasser in Fülle“ ist geläufiger als das attributive „reichliches Wasser“; „Widersacher“ erhält den leicht gehobenen Ton der Weisheitsliteratur.
