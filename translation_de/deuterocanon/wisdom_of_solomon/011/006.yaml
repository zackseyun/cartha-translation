  text: Instead of the spring of an ever-flowing river[a], they were troubled by muddy blood[b],
translation:
  language: de
  text: Statt einer Quelle eines immer fließenden Stromes[a] wurden sie durch schlammiges Blut[b] in Unruhe versetzt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
