lexical_decisions:
- source_word: ἀντί
  choice: statt
  rationale: 'Bezeichnet hier Ersatz beziehungsweise Gegensatz: An die Stelle der erwarteten Wasserquelle trat das Blut.'
- source_word: πηγῆς
  choice: Quelle
  rationale: Gibt die natürliche Wasserquelle beziehungsweise den Ursprung eines Wasserlaufs präzise und idiomatisch wieder.
- source_word: ἀενάου
  choice: immer fließenden
  rationale: Bewahrt den Gedanken eines ununterbrochenen, dauernden Fließens in gegenwärtigem, verständlichem Deutsch.
- source_word: ποταμοῦ
  choice: Stromes
  rationale: Entspricht der üblichen Bedeutung „Fluss/Strom“; „Strom“ passt hier würdevoll zur großen, beständig fließenden Wasserader.
- source_word: αἵματι
  choice: durch … Blut
  rationale: Der Dativ bezeichnet hier, wodurch die Betroffenen in Unruhe versetzt wurden; die konkrete Bezeichnung „Blut“ wahrt den Bezug zur ägyptischen Plage.
- source_word: λυθώδει
  choice: schlammiges
  rationale: Das Adjektiv bezeichnet etwas Schlamm- oder Morastartiges und hebt die widerwärtige, verunreinigte Beschaffenheit hervor.
- source_word: ταραχθέντες
  choice: wurden … in Unruhe versetzt
  rationale: Gibt das passive Partizip als finites Verb wieder und bewahrt seinen Sinnbereich von Beunruhigung, Erschütterung und Verwirrung, ohne ihn unnötig auf Angst zu verengen.
theological_decisions:
- issue: Anspielung auf die ägyptische Blutplage und mögliche ausdrückliche Ergänzung des verwandelten Wassers oder des Nils
  choice: 'Die knappe, anspielungsreiche Formulierung bleibt erhalten: „durch schlammiges Blut“, ohne „Wasser“ oder „Nil“ zu ergänzen.'
  alternative: „durch Wasser, das zu schlammigem Blut geworden war“ oder „durch den zu schlammigem Blut gewordenen Strom“
  rationale: Der griechische Wortlaut setzt den Exodus-Hintergrund voraus, nennt in diesem Satzteil aber weder Wasser noch Nil ausdrücklich. Eine Ergänzung würde die Anspielung erklären, zugleich jedoch den Quelltext ausdeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetisch knappe Satzgestalt und das abschließende Komma bleiben erhalten, da der Vers syntaktisch in den folgenden Zusammenhang eingebettet ist. „In Unruhe versetzt“ wahrt die semantische Breite von ταραχθέντες besser als eine ausschließlich emotionale Wiedergabe wie „erschraken“.
