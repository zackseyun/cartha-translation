  text: For when they were tested[a], though being disciplined with mercy, they learned how the ungodly were tormented while being judged in wrath[c][b];
translation:
  language: de
  text: Denn als sie, obwohl sie mit Erbarmen erzogen wurden, geprüft wurden, erkannten sie, wie die Gottlosen[c], während sie im Zorn gerichtet wurden, gequält wurden.
