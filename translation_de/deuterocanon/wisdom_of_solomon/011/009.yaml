lexical_decisions:
- source_word: ἐπειράσθησαν
  choice: sie geprüft wurden
  rationale: Das Verb bezeichnet hier eine Erprobung oder Prüfung, nicht in erster Linie eine Verführung zur Sünde. „Geprüft“ ist im modernen Deutsch klar und wahrt den Gegensatz zur Qual der Gottlosen.
- source_word: καίπερ
  choice: obwohl
  rationale: Die konzessive Bedeutung wird direkt und natürlich wiedergegeben.
- source_word: ἐν ἐλέει
  choice: mit Erbarmen
  rationale: Die Wendung kann Art und Weise oder Sphäre bezeichnen. „Mit Erbarmen“ bewahrt den substantivischen Ausdruck und klingt im Deutschen natürlich.
- source_word: παιδευόμενοι
  choice: zurechtgewiesen wurden
  rationale: παιδεύω umfasst Erziehung, Unterweisung und korrigierende Zucht. „Zurechtgewiesen“ betont hier den korrigierenden, nicht vernichtenden Charakter und passt zur ausdrücklichen Verbindung mit Erbarmen.
- source_word: ἔγνωσαν
  choice: erkannten sie
  rationale: Der Aorist von γινώσκω bezeichnet hier ein durch Erfahrung gewonnenes Erkennen. „Erkannten“ gibt dies knapp und würdig wieder.
- source_word: ἐν ὀργῇ
  choice: im Zorn
  rationale: Die knappe Präpositionalfügung bleibt erhalten, ohne ausdrücklich festzulegen, ob Zorn als Sphäre, Begleitumstand oder Art des Gerichts zu verstehen ist.
- source_word: κρινόμενοι
  choice: während sie ... gerichtet wurden
  rationale: „Gerichtet“ gibt κρίνω direkt wieder und vermeidet die stärkere, im Wort nicht zwingend enthaltene Festlegung auf „verurteilt“. „Während“ bildet die begleitende Partizipialkonstruktion verständlich ab.
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: ἀσεβής hebt besonders fehlende Ehrfurcht und Frevel gegenüber Gott hervor. „Gottlose“ bewahrt diese religiös-moralische Komponente besser als das allgemeinere „Böse“.
- source_word: ἐβασανίζοντο
  choice: gequält wurden
  rationale: βασανίζω bezeichnet schwere Qual oder Peinigung. „Gequält“ vermittelt die Intensität, ohne die konkrete Art des Leidens über den Text hinaus festzulegen.
theological_decisions:
- issue: Verhältnis der Prüfung Israels zur Qual der Gottlosen
  choice: Die einen werden mit Erbarmen korrigierend zurechtgewiesen; die Gottlosen werden im Zorn gerichtet und gequält.
  alternative: παιδευόμενοι könnte neutraler mit „unterwiesen“ oder härter mit „gezüchtigt“ wiedergegeben werden.
  rationale: Der Vers stellt eine leidvolle, aber erbarmende Korrektur dem zornigen Gericht gegenüber. „Zurechtgewiesen“ wahrt diesen Gegensatz, ohne das Leiden der Geprüften zu verharmlosen oder es mit der Qual der Gottlosen gleichzusetzen.
- issue: Bezug und Bedeutung von „im Zorn“
  choice: Die Formulierung „im Zorn gerichtet“ bleibt ohne ergänzende Deutung stehen.
  alternative: Möglich wären erläuternde Wiedergaben wie „unter Gottes Zorn“ oder „zornig verurteilt“.
  rationale: Der griechische Text nennt weder ausdrücklich Gott als Besitzer des Zorns noch zwingt κρίνω zur Übersetzung „verurteilen“. Die offene, theologisch gewichtige Formulierung wird daher bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bewahrt den Kontrast zwischen erbarmender Korrektur und zornigem Gericht; fachsprachliche oder konfessionell geprägte Zusätze werden vermieden.
