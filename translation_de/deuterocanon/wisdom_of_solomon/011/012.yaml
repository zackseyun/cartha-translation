lexical_decisions:
- source_word: διπλῆ
  choice: doppelte
  rationale: Das Adjektiv bezeichnet eine zweifache oder verstärkte Trauer; „doppelte“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: ἔλαβε
  choice: ergriffen
  rationale: In Verbindung mit Gefühlen beschreibt das Verb ein machtvolles Überkommen; „ergriffen“ erhält diese Anschaulichkeit.
- source_word: λύπη
  choice: Trauer
  rationale: Das Wort bezeichnet schmerzliche Betrübnis oder Kummer; „Trauer“ trägt hier das angemessene emotionale Gewicht.
- source_word: στεναγμός
  choice: Seufzen
  rationale: Der Ausdruck bezeichnet hörbares Seufzen oder Stöhnen. „Seufzen“ ist würdig und im Deutschen natürlicher, ohne den Schmerz zu verharmlosen.
- source_word: μνημῶν
  choice: beim Gedanken
  rationale: Der komprimierte Genitiv verbindet das Seufzen mit dem Erinnern; „beim Gedanken“ gibt diesen Zusammenhang verständlich wieder, ohne ihn eindeutig nur kausal festzulegen.
- source_word: τῶν παρελθουσῶν
  choice: an das Vergangene
  rationale: Das substantivierte Partizip meint wörtlich die vergangenen Dinge; „das Vergangene“ bewahrt diese Offenheit und klingt natürlich.
