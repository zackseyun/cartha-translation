translation:
  language: de
  text: Denn doppelte Trauer und ein Seufzen beim Gedanken an das Vergangene ergriffen sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Seufzen über die Erinnerung an das, was vergangen war“. Die griechische Wendung ist knapp gefasst und lässt das Verhältnis von Seufzen und Erinnerung offen.'
