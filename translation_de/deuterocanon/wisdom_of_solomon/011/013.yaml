translation:
  language: de
  text: Denn als sie hörten, dass jene durch die eigenen Strafen der Hörenden Gutes empfingen, erkannten sie den Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie wurden auf den Herrn aufmerksam.“ Das griechische Verb kann ein Wahrnehmen oder Erkennen bezeichnen, ohne damit unbedingt ein volles Glaubensbekenntnis auszudrücken.'
    reason: lexikalische Alternative und Bewahrung der theologischen Offenheit
lexical_decisions:
- source_word: ὅτε γὰρ
  choice: Denn als
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ, „als“ leitet den zeitlichen Nebensatz von ὅτε natürlich ein.
- source_word: ἤκουσαν
  choice: sie hörten
  rationale: Die Grundbedeutung ist das Hören einer Nachricht; die direkte Wiedergabe passt zum Kontext.
- source_word: διὰ τῶν ἰδίων κολάσεων
  choice: durch ihre eigenen Strafen
  rationale: διά mit Genitiv bezeichnet hier das Mittel; „eigene“ erhält den ironischen Kontrast, und „Strafen“ gibt κολάσεις im Zusammenhang der Plagen klar wieder.
- source_word: εὐεργετουμένους
  choice: Gutes empfingen
  rationale: Die Form ist passiv und bezeichnet den Empfang einer Wohltat. Die deutsche Wendung ist natürlicher als „begünstigt wurden“, ohne den Gedanken des empfangenen Guten aufzugeben.
- source_word: αὐτούς
  choice: jene
  rationale: Das Pronomen verweist auf die zuvor unterschiedene andere Gruppe, die Israeliten; „jene“ macht den Gruppenwechsel knapp kenntlich.
- source_word: ᾔσθοντο
  choice: erkannten
  rationale: Das Verb kann Wahrnehmen, Bemerken oder Erkennen bezeichnen. „Erkannten“ drückt eine einsetzende Einsicht aus, ohne notwendig ein volles Glaubensbekenntnis zu behaupten.
- source_word: τοῦ κυρίου
  choice: den Herrn
  rationale: Der Genitiv steht beim griechischen Wahrnehmungsverb; im Deutschen verlangt „erkennen“ den Akkusativ. κύριος bezeichnet hier Gott und wird mit „der Herr“ wiedergegeben.
theological_decisions:
- issue: Bezug von αὐτούς und Zuordnung der Strafen
  choice: „jene“ bezeichnet die Israeliten, die durch die Strafen der Ägypter Gutes empfingen; die Formulierung „ihre eigenen Strafen“ bewahrt die knappe griechische Bezugnahme.
  alternative: Das Pronomen lediglich mit „sie“ oder „ihnen“ wiedergeben und den Gruppenkontrast vollständig implizit lassen.
  rationale: Der Zusammenhang stellt die bestraften Ägypter den begünstigten Israeliten gegenüber. „Jene“ verdeutlicht den Referenten, ohne die Israeliten im Vers ausdrücklich zu benennen.
- issue: Aussagegehalt von ᾔσθοντο τοῦ κυρίου
  choice: „sie erkannten den Herrn“
  alternative: „sie wurden auf den Herrn aufmerksam“ oder „sie nahmen den Herrn wahr“
  rationale: Die Aussage bezeichnet eine Wahrnehmung oder Einsicht in das Handeln des Herrn, muss aber keine vollständige Bekehrung oder ein umfassendes Glaubensbekenntnis bedeuten. Die Fußnote hält diese Offenheit fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Begründungs- und Zeitstruktur, bleibt aber flüssig. „Gutes empfingen“ vermeidet eine unnatürliche Passivkonstruktion; „jene“ hält den Kontrast der beiden Gruppen erkennbar.
