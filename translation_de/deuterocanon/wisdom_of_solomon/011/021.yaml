translation:
  language: de
  text: Denn dir steht es jederzeit zu Gebote, große Kraft zu entfalten[a]; und wer wird der Macht deines Armes widerstehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn große Macht auszuüben steht dir jederzeit zu Gebote.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλως ἰσχύειν
  choice: große Kraft zu entfalten
  rationale: Die Verbindung aus Adverb und Infinitiv bezeichnet die Ausübung außergewöhnlicher Stärke. „Große Kraft entfalten“ gibt dies im Deutschen natürlich wieder, ohne die Aussage auf bloßen Besitz von Kraft zu beschränken.
- source_word: πάρεστίν σοι πάντοτε
  choice: dir steht es jederzeit zu Gebote
  rationale: Die Wendung drückt beständige Verfügbarkeit aus. „Zu Gebote stehen“ bewahrt diesen Sinn und passt zum würdevollen Register.
- source_word: κράτει
  choice: der Macht
  rationale: κράτος bezeichnet wirksame, hervortretende Stärke. „Macht“ ist hier idiomatisch und vermeidet die unmittelbare Wiederholung von „Kraft“.
- source_word: βραχίονός σου
  choice: deines Armes
  rationale: Das biblische Bild des Armes als Ausdruck wirksamer göttlicher Macht wird wörtlich bewahrt.
- source_word: τίς ἀντιστήσεται
  choice: wer wird … widerstehen?
  rationale: Die rhetorische Zukunftsfrage erklärt erfolgreichen Widerstand für unmöglich. „Widerstehen“ gibt ἀνθίστημι genau und natürlich wieder.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Arm
  choice: Das Bild wird als „deines Armes“ beibehalten.
  alternative: deiner Kraft / deiner Macht
  rationale: Der griechische Text verwendet bewusst das traditionelle biblische Bild des Armes. Eine Abstraktion würde seine literarische und theologische Prägung abschwächen.
- issue: Gottes jederzeit verfügbare Macht
  choice: „dir steht es jederzeit zu Gebote“
  alternative: „du kannst jederzeit“
  rationale: Die gewählte Fassung bewahrt die Aussage der stets bereitstehenden Verfügbarkeit, ohne sie stärker als nötig zu einer Aussage über abstrakte Möglichkeit umzuformen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „zu Gebote stehen“ entspricht dem feierlichen Kontext, bleibt aber allgemein verständlich; das biblische Bild vom Arm wird erhalten.
