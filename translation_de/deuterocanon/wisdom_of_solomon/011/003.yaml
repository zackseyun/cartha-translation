translation:
  language: de
  text: Sie leisteten den Feinden Widerstand und wehrten die Gegner ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie widerstanden den Feinden und schlugen die Gegner zurück.“ Im Griechischen stehen zwei nahezu synonyme Bezeichnungen für feindliche Gegner sowie zwei Ausdrücke für Widerstand und Abwehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: leisteten … Widerstand
  rationale: Der Aorist von ἀνθίστημι bezeichnet, dass man sich jemandem entgegenstellt oder Widerstand leistet. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den defensiv-konfrontativen Sinn.
- source_word: πολεμίοις
  choice: den Feinden
  rationale: Der Dativ Plural von πολέμιος bezeichnet hier feindliche, wahrscheinlich kriegerische Gegner; „Feinde“ gibt dies knapp und idiomatisch wieder.
- source_word: ἠμύναντο
  choice: wehrten … ab
  rationale: Der mediale Aorist von ἀμύνω kann „sich verteidigen“, „abwehren“ oder „zurückschlagen“ bedeuten. „wehrten … ab“ bewahrt die defensive Stoßrichtung, ohne eine ausdrücklich reflexive Formulierung hinzuzufügen.
- source_word: ἐχθρούς
  choice: die Gegner
  rationale: ἐχθρός bedeutet ebenfalls „Feind“. „Gegner“ erhält den synonymen Parallelismus, vermeidet aber in dem kurzen Satz eine schwerfällige Wiederholung.
