base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/014.yaml
  text: For they rejected with mockery the one who had long ago been cast out at his exposure[a]; but at the end of those events they marveled[b], having thirsted unlike the righteous.
translation:
  language: de
  text: Denn den, der einst als ausgesetztes Kind fortgeworfen worden war[a], wiesen sie spottend zurück; doch am Ende dieser Entwicklungen staunten sie[b], nachdem sie anders als die Gerechten Durst gelitten hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das einst ausgesetzte Kind – eine Anspielung auf Mose.
    reason: cross_reference
  - marker: b
    text: 'Oder: „am Ende dieser Ergebnisse“. Das griechische Wort kann sowohl die Entwicklungen als auch deren schließliche Ausgänge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκθέσει
  choice: als ausgesetztes Kind
  rationale: ἔκθεσις bezeichnet hier das Aussetzen eines Kindes. Die Wiedergabe macht die konkrete Handlung verständlich, ohne Mose im Haupttext ausdrücklich zu nennen.
- source_word: ῥιφέντα
  choice: fortgeworfen worden war
  rationale: Das Partizip von ῥίπτω bezeichnet ein Weg- oder Fortwerfen und bewahrt so die Härte der geschilderten Aussetzung.
- source_word: ἀπεῖπον
  choice: wiesen sie zurück
  rationale: Das Verb bezeichnet hier Zurückweisung oder Lossagung; „zurückweisen“ ist im Deutschen natürlich und lässt die genaue Art der Ablehnung offen.
- source_word: χλευάζοντες
  choice: spottend
  rationale: Das Partizip beschreibt, auf welche Weise die Zurückweisung geschah.
- source_word: ἐπὶ τέλει τῶν ἐκβάσεων
  choice: am Ende all dieser Entwicklungen
  rationale: ἐκβάσεις kann Ausgänge, Ergebnisse oder den Verlauf von Geschehnissen bezeichnen. „Entwicklungen“ wahrt die mögliche prozesshafte Bedeutung, während die Fußnote auf die Ergebnisbedeutung hinweist.
- source_word: ἐθαύμασαν
  choice: staunten sie
  rationale: „Staunen“ gibt das Verb der Verwunderung knapp und in würdigem modernem Deutsch wieder.
- source_word: οὐχ ὅμοια δικαίοις διψήσαντες
  choice: nachdem sie anders als die Gerechten Durst gelitten hatten
  rationale: Die Formulierung bewahrt den ausdrücklichen Vergleich mit den Gerechten und gibt das vorzeitige Partizip in natürlichem Deutsch wieder.
theological_decisions:
- issue: Identität des einst ausgesetzten Kindes
  choice: Mose wird im Haupttext nicht namentlich genannt, sondern nur in einer Fußnote als Bezug der Anspielung erläutert.
  alternative: Den Namen Mose unmittelbar in den Haupttext einsetzen.
  rationale: Der griechische Text bezeichnet die Person indirekt. Die Übersetzung bewahrt diese Zurückhaltung und erläutert den historischen Bezug separat.
- issue: Art des Durstes im Vergleich mit den Gerechten
  choice: Die unterschiedliche Erfahrung wird ausgesagt, ohne im Haupttext näher zu bestimmen, worin der Unterschied bestand.
  alternative: Den Unterschied ausdrücklich als strafenden Durst der Ägypter gegenüber dem vorübergehenden Durst Israels erklären.
  rationale: Der Vers setzt den Kontext voraus, entfaltet den Vergleich aber nicht. Eine nähere theologische Deutung würde über seinen Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt wie im Griechischen den einst Ausgesetzten hervor; der Semikolon wahrt den scharfen Gegensatz zwischen früherer Verspottung und späterem Staunen.
