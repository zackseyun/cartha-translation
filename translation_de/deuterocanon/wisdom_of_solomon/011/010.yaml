lexical_decisions:
- source_word: τούτους μὲν ... ἐκείνους δὲ
  choice: diese ... jene aber
  rationale: Bewahrt den ausdrücklichen Gegensatz zwischen den beiden Gruppen, ohne sie im Vers selbst über die griechischen Demonstrativpronomen hinaus zu benennen.
- source_word: ὡς πατὴρ
  choice: wie ein Vater
  rationale: Gibt das väterliche Vergleichsbild unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: νουθετῶν
  choice: indem du sie ... ermahnt hast
  rationale: „Ermahnen“ umfasst korrigierende Unterweisung und Warnung, ohne den Ausdruck auf bloße Belehrung oder strafende Zucht zu verengen.
- source_word: ἐδοκίμασας
  choice: du hast geprüft
  rationale: Bezeichnet eine Prüfung oder Erprobung und passt zum Zusammenhang der korrigierenden Prüfung Israels.
- source_word: ἀπότομος
  choice: streng
  rationale: Vermittelt die unnachgiebige Schärfe des königlichen Handelns in würdigem, allgemein verständlichem Deutsch; „hart“ bleibt als mögliche Alternative erhalten.
- source_word: βασιλεὺς
  choice: König
  rationale: Entspricht der Grundbedeutung und bewahrt das königliche Bild des griechischen Textes.
- source_word: καταδικάζων
  choice: indem du sie ... verurteilt hast
  rationale: Bewahrt die gerichtliche und nachteilige Bedeutung des Partizips und ordnet sie dem königlichen Handeln zu.
- source_word: ἐξήτασας
  choice: du hast verhört
  rationale: „Verhört“ gibt die eingehende, hier gerichtliche Untersuchung wieder und unterscheidet das Verb deutlich von ἐδοκίμασας („geprüft“).
theological_decisions:
- issue: Unterschiedliches göttliches Handeln an den beiden Gruppen
  choice: Die erste Gruppe wird väterlich und korrigierend geprüft, die zweite königlich-gerichtlich verhört und verurteilt.
  alternative: Beide Satzhälften könnten allgemein mit „prüfen“ wiedergegeben werden, wodurch der Gegensatz zwischen väterlicher Ermahnung und richterlicher Verurteilung abgeschwächt würde.
  rationale: Der griechische Text verwendet verschiedene Bilder und Verben. Die Übersetzung bewahrt deshalb die Spannung zwischen korrigierender Prüfung und strafendem Gericht, ohne sie dogmatisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen „indem“-Sätze bilden die beiden griechischen Partizipialkonstruktionen transparent ab; „geprüft“ und „verhört“ halten die unterschiedlichen Verben und den Wechsel vom väterlichen zum gerichtlichen Bild auseinander.
