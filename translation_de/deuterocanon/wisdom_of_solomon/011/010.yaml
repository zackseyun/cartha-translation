  text: For these you tested by admonishing them as a father[b][a], but those you examined by condemning them as a stern king.
translation:
  language: de
  text: Denn diese hast du geprüft, indem du sie wie ein Vater ermahnt hast[a]; jene aber hast du untersucht, indem du sie wie ein strenger König verurteilt hast[b].
  philosophy: optimal-equivalence
