  text: They traveled through an uninhabited wilderness, and in trackless places they pitched tents;
translation:
  language: de
  text: Sie zogen durch eine unbewohnte Wildnis und schlugen an unwegsamen Orten ihre Zelte auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διώδευσαν
  choice: Sie zogen durch
  rationale: Das Verb bezeichnet die Bewegung durch ein Gebiet. „Sie zogen durch“ ist im Deutschen natürlich und passt zum Zug Israels durch die Wildnis.
- source_word: ἔρημον
  choice: Wildnis
  rationale: ἔρημος bezeichnet hier eine öde, menschenleere Gegend; „Wildnis“ wahrt die Breite des Begriffs, ohne eine reine Sandwüste vorauszusetzen.
- source_word: ἀοίκητον
  choice: unbewohnte
  rationale: Das Adjektiv bedeutet unmittelbar „nicht bewohnt“ und bestimmt „Wildnis“ näher.
- source_word: ἀβάτοις
  choice: an unwegsamen Orten
  rationale: Der Ausdruck kann unbetretbare, schwer zugängliche oder weglose Gegenden bezeichnen. „Unwegsam“ bewahrt diese Bedeutungsbreite und klingt im Reisekontext natürlich.
- source_word: ἔπηξαν
  choice: schlugen ... auf
  rationale: In Verbindung mit σκηνάς ist dies die übliche deutsche Wendung für das Errichten von Zelten.
- source_word: σκηνάς
  choice: ihre Zelte
  rationale: Gemeint sind tragbare Behausungen. Das im Deutschen idiomatische Possessivpronomen macht keine zusätzliche sachliche Aussage, sondern bezeichnet die von ihnen benutzten Zelte.
theological_decisions:
- issue: Bildsprache des Wüstenzugs
  choice: Konkrete Reisesprache ohne zusätzliche theologische Ausdeutung
  alternative: Den Bezug zum Exodus ausdrücklich benennen oder als „sie lagerten in der Wüste“ zusammenfassen
  rationale: Der griechische Text erinnert an Israels Wüstenzug, beschreibt hier aber lediglich Reise und Zeltlager. Die Übersetzung erhält die Anspielung, ohne sie interpretierend auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und parallel zum Griechischen; „unbewohnte Wildnis“ und „unwegsame Orte“ geben die beiden Geländebeschreibungen klar wieder.
