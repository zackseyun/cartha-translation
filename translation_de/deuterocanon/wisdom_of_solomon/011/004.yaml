    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησαν
  choice: Sie litten Durst
  rationale: Die idiomatische deutsche Wendung gibt den aoristischen Ausdruck natürlich wieder und bewahrt die geschilderte Notlage.
- source_word: ἐπεκαλέσαντό σε
  choice: riefen dich an
  rationale: Die Form von ἐπικαλέω bezeichnet hier den an Gott gerichteten Hilferuf; „dich anrufen“ wahrt den Gebetscharakter.
- source_word: ἐδόθη αὐτοῖς
  choice: wurde ihnen … gegeben
  rationale: Das Passiv bleibt erhalten, sodass der im Kontext erkennbare göttliche Geber nicht gegen den Wortlaut ausdrücklich eingesetzt wird.
- source_word: ἐκ πέτρας ἀκροτόμου
  choice: aus schroffem Fels
  rationale: ἀκρότομος bezeichnet etwas steil Abfallendes oder scharf Abgeschnittenes; „schroff“ vermittelt die Unzugänglichkeit und Unwahrscheinlichkeit dieser Wasserquelle knapp und natürlich.
- source_word: ὕδωρ
  choice: Wasser
  rationale: Direkte und eindeutige Entsprechung.
- source_word: ἄκος δίψης
  choice: ein Heilmittel gegen den Durst
  rationale: ἄκος bezeichnet ein Heil- oder Gegenmittel. Die Wiedergabe erhält das bildhafte Verständnis des Wassers als heilende Abhilfe und schwächt es nicht zu bloßer Erfrischung ab.
- source_word: ἐκ λίθου σκληροῦ
  choice: aus hartem Stein
  rationale: Die schlichte Wiedergabe erhält den Parallelismus und hebt den unwahrscheinlichen Ursprung des Wassers hervor.
theological_decisions:
- issue: Soll Gott ausdrücklich als Geber des Wassers genannt werden?
  choice: Das Passiv „wurde ihnen … gegeben“ bleibt stehen.
  alternative: „du gabst ihnen Wasser“
  rationale: Obwohl der Zusammenhang Gottes Wirken voraussetzt, nennt der griechische Satz ihn in diesem Teilsatz nicht ausdrücklich als handelndes Subjekt.
- issue: Wie stark soll die Metapher ἄκος δίψης wiedergegeben werden?
  choice: „ein Heilmittel gegen den Durst“
  alternative: „Linderung des Durstes“
  rationale: Die gewählte Fassung bewahrt die medizinisch-heilende Bildsprache und damit die Darstellung der Gabe als wiederherstellende Hilfe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gebetscharakter von „dich anrufen“, das griechische Passiv und die poetische Heilmittel-Metapher bleiben erhalten; „schroffer Fels“ und „harter Stein“ bilden den Parallelismus natürlich ab.
