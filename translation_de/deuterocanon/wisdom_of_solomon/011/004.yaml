base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/004.yaml
  text: They were thirsty and called on you[a], and water was given to them from a sheer rock[b], and a remedy for thirst from hard stone.
translation:
  language: de
  text: Sie litten Durst und riefen dich an. Ihnen wurde Wasser aus schroffem Fels gegeben und ein Heilmittel gegen den Durst[a] aus hartem Stein.
  philosophy: optimal-equivalence
  footnotes:
