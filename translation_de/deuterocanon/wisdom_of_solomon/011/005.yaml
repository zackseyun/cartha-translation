  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/005.yaml
  text: For by the very things through which their enemies were punished[a], they themselves, when in need, were benefited.
translation:
  language: de
  text: Denn durch dieselben Dinge, durch die ihre Feinde bestraft wurden, wurde ihnen selbst, als sie in Not waren,[a] Gutes erwiesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als sie ratlos waren« oder »als sie in Bedrängnis waren«. Das griechische Partizip kann Ratlosigkeit, Hilflosigkeit oder Mangel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὧν ... διὰ τούτων
  choice: durch dieselben Dinge, durch die ...
  rationale: 'Die wiederholte instrumentale Wendung wird im Deutschen als betonte Entsprechung wiedergegeben: Dieselben Mittel dienen der Bestrafung der Feinde und dem Wohlergehen des Gottesvolkes.'
- source_word: ἐκολάσθησαν
  choice: bestraft wurden
  rationale: Die klare passive Form gibt den Gedanken einer zugefügten Strafe natürlich und ohne zusätzliche Deutung wieder.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: ihre Feinde
  rationale: Natürliche und genaue Wiedergabe der griechischen Possessivkonstruktion.
- source_word: αὐτοὶ
  choice: ihnen selbst
  rationale: Das betonte Pronomen stellt sie ausdrücklich ihren Feinden gegenüber; wegen der deutschen Passivkonstruktion wird der griechische Nominativ idiomatisch als Dativ wiedergegeben.
- source_word: ἀποροῦντες
  choice: als sie in Not waren
  rationale: Die Wendung erfasst hier die konkrete Hilfsbedürftigkeit, ohne die mögliche Bedeutung von Ratlosigkeit oder Bedrängnis auszuschließen; diese Bedeutungsbreite wird in der Fußnote genannt.
- source_word: εὐεργετήθησαν
  choice: wurde ... Gutes erwiesen
  rationale: Die passive Form und der Gedanke empfangener Wohltat bleiben erhalten. Die Formulierung ist würdig und idiomatischer als das sachlichere „sie wurden begünstigt“.
theological_decisions:
- issue: Instrumentale Umkehrung im göttlichen Handeln
  choice: Die identischen Mittel werden sowohl mit der Bestrafung der Feinde als auch mit der Wohltat für das Gottesvolk verbunden.
  alternative: Der Gegensatz könnte freier wiedergegeben werden, ohne die wiederholte instrumentale Formulierung beizubehalten.
  rationale: Die Wiederholung διʼ ὧν ... διὰ τούτων trägt den literarischen und theologischen Gedanken der Umkehrung. Ihre Bewahrung macht die Spannung sichtbar, ohne den handelnden Urheber ausdrücklich zu benennen, wo der Vers selbst ihn nicht nennt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die doppelte Passivkonstruktion bewahrt den formalen Gegensatz des griechischen Textes; die Stellung von „ihnen selbst“ hebt den Kontrast zu „ihren Feinden“ hervor.
