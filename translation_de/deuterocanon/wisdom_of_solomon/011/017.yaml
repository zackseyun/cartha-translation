base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/017.yaml
  text: For your almighty hand[a], which created the world out of formless matter, was not powerless to send upon them a multitude of bears or fierce lions,
translation:
  language: de
  text: Denn deine allmächtige Hand, die die Welt aus formloser Materie[a] erschuf, war nicht außerstande, eine Menge Bären oder wilde Löwen auf sie zu schicken,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ungeformtem Stoff“. Die griechische Wendung greift eine hellenistische kosmologische Ausdrucksweise auf; sie sollte hier nicht zur Entscheidung späterer Lehrfragen über die Weise der Schöpfung herangezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπόρει
  choice: war nicht außerstande
  rationale: Die verneinte Wendung bewahrt die Litotes des griechischen Verbs ἀπορέω und drückt im Zusammenhang aus, dass es Gottes Hand nicht an der nötigen Macht fehlte.
- source_word: ἡ παντοδύναμός σοι χείρ
  choice: deine allmächtige Hand
  rationale: Der possessive Dativ σοι wird im Deutschen natürlich mit „deine“ wiedergegeben; „Hand“ erhält das Bild für Gottes wirksame Macht.
- source_word: κτίσασα τὸν κόσμον
  choice: die die Welt … erschaffen hatte
  rationale: Der Relativsatz gibt das auf „Hand“ bezogene Partizip verständlich wieder. Das Plusquamperfekt macht deutlich, dass die Schöpfung der hier erwogenen Strafhandlung vorausliegt.
- source_word: ἐξ ἀμόρφου ὕλης
  choice: aus formloser Materie
  rationale: Die Wiedergabe bleibt nah am hellenistisch geprägten Ausdruck und vermeidet es, dessen kosmologische Bedeutung durch eine erklärende Paraphrase festzulegen.
- source_word: ἐπιπέμψαι αὐτοῖς
  choice: über sie zu schicken
  rationale: Die Formulierung bewahrt die gegen sie gerichtete Bewegung des zusammengesetzten Verbs und klingt im Deutschen natürlich.
- source_word: πλῆθος ἄρκων
  choice: eine Menge Bären
  rationale: „Eine Menge“ erhält den quantitativen Nachdruck von πλῆθος, ohne ein im Griechischen nicht ausdrücklich vorhandenes Bild wie „Schwarm“ einzuführen.
- source_word: θρασεῖς λέοντας
  choice: wilde Löwen
  rationale: θρασύς bezeichnet hier bei gefährlichen Raubtieren ihre bedrohliche, ungestüme Art; „wild“ ist eine natürliche kontextuelle Wiedergabe.
theological_decisions:
- issue: Litotische Aussage über Gottes Macht
  choice: war nicht außerstande
  alternative: hätte ohne Weiteres … schicken können
  rationale: Die gewählte Fassung wahrt die verneinte Ausdrucksweise des Griechischen und macht zugleich deutlich, dass Gottes Schöpfermacht auch zu anderen Formen des Gerichts ausgereicht hätte.
- issue: Kosmologische Wendung ἐξ ἀμόρφου ὕλης
  choice: aus formloser Materie
  alternative: aus ungeformtem Stoff
  rationale: Die Formulierung gibt den Wortlaut wieder, ohne den Vers zur Entscheidung späterer Lehrfragen über die genaue Weise der Schöpfung heranzuziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzperiode und das abschließende Komma bleiben erhalten, da der Gedanke im folgenden Vers weitergeführt wird; die griechische Litotes und das Bild von Gottes „Hand“ werden bewusst bewahrt.
