translation:
  language: de
  text: oder neu erschaffene, unbekannte wilde Tiere, voller Wut, oder aber Tiere, die einen feurigen Atem ausstießen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεοκτίστους
  choice: neu erschaffene
  rationale: Das Kompositum bezeichnet neu ins Dasein gebrachte Wesen und nicht bloß junge Tiere; „neu erschaffen“ bewahrt den Schöpfungsbezug.
- source_word: θυμοῦ πλήρεις
  choice: voll Wut
  rationale: θυμός bezeichnet hier heftigen Zorn beziehungsweise wilde Erregung; „voll Wut“ ist prägnant und natürlich.
- source_word: θῆρας
  choice: wilde Tiere
  rationale: θήρ bezeichnet besonders ein wildes, potenziell gefährliches Tier; „wilde Tiere“ gibt den bedrohlichen Sinn verständlich wieder.
- source_word: ἀγνώστους
  choice: unbekannte
  rationale: Das Adjektiv bedeutet „unbekannt“ oder „nicht vertraut“ und beschreibt hier offenbar neuartige Wesen.
- source_word: ἤτοι
  choice: die
  rationale: ἤτοι kann eine nähere Bestimmung einleiten. Da der folgende Akkusativpartizipialsatz dieselben Tiere beschreibt, ist im Deutschen ein Relativanschluss natürlicher als ein zweites „oder“.
- source_word: πυρπνόον φυσῶντας ἆσθμα
  choice: die feurigen Atem ausstießen
  rationale: Die verdichtete Wendung verbindet „Feuer atmend“, „ausstoßen/blasen“ und „Atem“. Die Formulierung wahrt das Feuerbild, vermeidet aber eine schwerfällige deutsche Wiederholung von „atmen/Atem“.
theological_decisions:
- issue: Bezug von ἤτοι πυρπνόον φυσῶντας ἆσθμα
  choice: als nähere Beschreibung der neu erschaffenen Tiere wiedergegeben
  alternative: 'als weitere Alternative: „oder solche, die feurigen Atem ausstießen“'
  rationale: Das maskuline Akkusativpartizip φυσῶντας stimmt mit θῆρας überein und charakterisiert daher am ehesten die genannten Tiere. ἤτοι lässt jedoch auch eine alternative oder präzisierende Gliederung zu.
translation_notes:
