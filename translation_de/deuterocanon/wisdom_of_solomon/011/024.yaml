base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/024.yaml
  text: For you love all things that exist[a], and you detest none of the things you made; for if you had hated anything[b], you would not have fashioned it.
translation:
  language: de
  text: Denn du liebst alles, was ist, und verabscheust[a] nichts von dem, was du gemacht hast; denn hättest du etwas gehasst, hättest du es nicht gestaltet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „hegst gegen nichts Abscheu“. Das griechische Verb bezeichnet starke Abneigung oder Ekel.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „hättest du es nicht bereitet“ oder „hergestellt“. „Gestaltet“ gibt den bewussten, formenden Sinn des zweiten griechischen Tätigkeitswortes wieder und unterscheidet es vom vorangehenden „gemacht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷς
  choice: du liebst
  rationale: Direkte Wiedergabe des Präsens von ἀγαπάω. „Lieben“ bewahrt die umfassende positive Aussage, ohne eine besondere Gefühlsnuance hinzuzufügen.
- source_word: τὰ ὄντα πάντα
  choice: alles, was ist
  rationale: Die substantivierte Partizipialform bezeichnet alles Seiende beziehungsweise Existierende. „Alles, was ist“ ist natürlich, würdevoll und bewahrt die ontologische Weite des Griechischen.
- source_word: οὐδὲν βδελύσσῃς
  choice: verabscheust nichts
  rationale: βδελύσσομαι bezeichnet starke Abneigung bis hin zu Abscheu. „Verabscheuen“ gibt diese Intensität im heutigen Deutsch treffend wieder.
- source_word: ὧν ἐποίησας
  choice: von dem, was du gemacht hast
  rationale: ποιέω bedeutet allgemein „machen“ oder „tun“. „Gemacht“ bleibt nah am griechischen Wortlaut und vermeidet eine unnötige dogmatische Zuspitzung durch „erschaffen“.
- source_word: μισῶν τι
  choice: hättest du etwas gehasst
  rationale: Das Partizip steht in einer irrealen Bedingung mit ἄν und dem Aorist des Hauptverbs. Der deutsche Konjunktiv II der Vergangenheit bildet diesen Gedankengang idiomatisch ab.
- source_word: κατεσκεύασας
  choice: hättest du es nicht gestaltet
  rationale: κατασκευάζω kann „bereiten“, „herstellen“ oder „gestalten“ bedeuten. „Gestaltet“ bringt den bewussten, formenden Aspekt zum Ausdruck und unterscheidet das Verb behutsam vom vorangehenden ποιέω.
theological_decisions:
- issue: Verhältnis von göttlicher Liebe und Schöpfung
  choice: Die Aussage umfasst alles, was ist, und alles, was Gott gemacht hat; Gottes Liebe wird mit seinem schöpferischen Handeln begründet.
  alternative: Die Aussage entweder auf die ursprüngliche Güte der Schöpfung zu beschränken oder als uneingeschränkte Billigung jedes Zustands des Geschaffenen auszulegen.
  rationale: Der griechische Text formuliert bewusst umfassend und verbindet Liebe, Nicht-Verabscheuen und Hervorbringen. Die Übersetzung bewahrt diese theologische Spannung, ohne spätere Einschränkungen oder Folgerungen in den Vers einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der parallele Satzbau und die irreale Bedingung bleiben erhalten; die beiden griechischen Verben für das Hervorbringen werden im Deutschen leicht unterschieden.
