lexical_decisions:
- source_word: εἰς
  choice: als
  rationale: Die Präposition bezeichnet hier in dem vom Kontext abhängigen Satzfragment Zweck oder Funktion; „als“ gibt dies im Deutschen idiomatisch wieder.
- source_word: ἔλεγχον
  choice: Zurechtweisung
  rationale: ἔλεγχος kann Widerlegung, Aufdeckung oder Tadel bezeichnen. „Zurechtweisung“ bewahrt hier den Gedanken einer Handlung, die das frühere Unrecht entlarvt und verurteilt.
- source_word: νηπιοκτόνου
  choice: der Säuglinge töten ließ
  rationale: Das Adjektiv bedeutet wörtlich „säuglingstötend“. Als Relativsatz klingt es im Deutschen natürlicher; „töten ließ“ verdeutlicht zudem, dass der Erlass die Tötung anordnete, ohne zusätzliche Einzelheiten einzutragen.
- source_word: διατάγματος
  choice: Erlass
  rationale: διάταγμα bezeichnet eine amtliche Anordnung. „Erlass“ ist gegenwärtiges, klares Deutsch und passt zur Anspielung auf den königlichen Tötungsbefehl.
theological_decisions:
- issue: Geschichtlich-theologische Anspielung auf die Tötung der hebräischen Säuglinge in Ägypten
  choice: „einen Erlass, der Säuglinge töten ließ“
  alternative: „einen säuglingstötenden Erlass“
  rationale: Die Wiedergabe erhält die konkrete Anspielung und die moralische Schärfe des griechischen Adjektivs, ohne den im Fragment nicht ausdrücklich genannten Pharao oder Israel einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das vom Zusammenhang abhängige Satzfragment bleibt erhalten. Die Fußnote dokumentiert die kompakte attributive Form des Griechischen.
