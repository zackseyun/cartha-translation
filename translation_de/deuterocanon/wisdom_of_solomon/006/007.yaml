base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/007.yaml
  text: For the Master of all will not show partiality[a], nor will he be overawed by greatness; for he himself made both small and great[c][b], and he cares for all alike.
translation:
  language: de
  text: Denn der Gebieter über alle[a] kennt kein Ansehen der Person[b] und lässt sich von Größe nicht beeindrucken. Er selbst hat ja Klein und Groß geschaffen und sorgt für alle in gleicher Weise.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Herrscher über alle“. Das griechische Wort lautet δεσπότης (despótēs), nicht κύριος (kýrios, „Herr“).'
    reason: lexical_alternative
  - marker: b
    text: Das Griechische verwendet hier eine Wendung mit „Angesicht“; gemeint ist, dass niemand wegen seines Ansehens bevorzugt wird.
    reason: idiom_explanation
  - marker: c
    text: 'Oder: „trifft für alle gleichermaßen Vorsorge“; auch möglich: „übt über alle in gleicher Weise Vorsehung aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πάντων δεσπότης
  choice: der Gebieter über alle
  rationale: „Gebieter“ gibt die uneingeschränkte Autorität von δεσπότης wieder und hält den Ausdruck zugleich von κύριος („Herr“) unterscheidbar.
- source_word: ὑποστελεῖται πρόσωπον
  choice: kennt kein Ansehen der Person
  rationale: Die deutsche Wendung gibt das griechische Idiom als Aussage über Unparteilichkeit wieder, ohne das Bild durch eine unverständliche wörtliche Übersetzung zu verstellen.
- source_word: ἐντραπήσεται μέγεθος
  choice: lässt sich von Größe nicht beeindrucken
  rationale: Im Zusammenhang bezeichnet ἐντρέπομαι kein moralisches Sich-Schämen, sondern ein Sich-beeinflussen- oder Einschüchternlassen durch Größe, Rang oder Macht.
- source_word: μικρὸν καὶ μέγαν
  choice: Klein und Groß
  rationale: Die feste Paarformel bewahrt die umfassende Gegenüberstellung und kann sowohl niedrigen und hohen Rang als auch geringe und große Bedeutung einschließen.
- source_word: ὁμοίως τε προνοεῖ περὶ πάντων
  choice: sorgt für alle in gleicher Weise
  rationale: προνοέω umfasst fürsorgliche Voraussicht und Versorgung; diese Wiedergabe ist natürlich und bewahrt mit „in gleicher Weise“ den ausdrücklichen Gedanken der Gleichbehandlung.
theological_decisions:
- issue: δεσπότης von κύριος unterscheiden
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: „Gebieter“ wahrt die besondere Nuance uneingeschränkter Verfügungsgewalt, ohne beide griechischen Gottesbezeichnungen unterschiedslos mit „Herr“ wiederzugeben.
- issue: Göttliche Unparteilichkeit
  choice: kennt kein Ansehen der Person
  alternative: bevorzugt niemanden; zeigt keine Parteilichkeit
  rationale: Die Formulierung hält die Aussage eng am griechischen Personen-Idiom und drückt aus, dass äußerer Rang Gottes Handeln nicht beeinflusst.
- issue: Bedeutungsumfang von προνοεῖ
  choice: sorgt für alle
  alternative: trifft für alle gleichermaßen Vorsorge; übt über alle gleichermaßen Vorsehung aus
  rationale: „Sorgt für“ bewahrt die konkrete Bedeutung fürsorglicher Voraussicht, ohne den Ausdruck durch eine ausgebaute dogmatische Lehre von der Vorsehung zu überfrachten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kennt kein Ansehen der Person“ bewahrt einen leicht biblischen Klang, bleibt aber im Deutschen verständlich; „lässt sich … nicht beeindrucken“ und „sorgt für“ halten den Satz zugleich natürlich und zugänglich.
