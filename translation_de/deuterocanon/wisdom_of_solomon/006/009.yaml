base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/009.yaml
  text: Therefore my words are for you[a], O tyrants[b], so that you may learn wisdom and not fall away.
translation:
  language: de
  text: An euch also richten sich meine Worte, ihr Tyrannen[a], damit ihr Weisheit lernt und nicht zu Fall kommt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Herrscher“. Das griechische Wort kann allgemein souveräne Herrscher bezeichnen, hat hier jedoch einen scharfen, negativen Klang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nicht fallt“ oder „nicht vom rechten Weg abkommt“. Das griechische Wort kann allgemein ein Scheitern oder Abirren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς … οἱ λόγοι μου
  choice: An euch … richten sich meine Worte
  rationale: Die deutsche Wendung gibt die Ausrichtung der Worte auf ihre Adressaten natürlich wieder und bewahrt zugleich das Substantiv im Plural.
- source_word: οὖν
  choice: also
  rationale: „Also“ kennzeichnet den folgernden Anschluss an die vorausgehende Warnung, ohne unnötig schwerfällig zu wirken.
- source_word: ὦ τύραννοι
  choice: ihr Tyrannen
  rationale: Die direkte Anrede bleibt erhalten. „Tyrannen“ bewahrt im warnenden Zusammenhang die scharfe, negative Färbung von τύραννοι besser als das neutrale „Herrscher“.
- source_word: ἵνα μάθητε σοφίαν
  choice: damit ihr Weisheit lernt
  rationale: „Damit“ gibt den Zweck des griechischen ἵνα-Satzes wieder; „Weisheit“ wahrt den zentralen ethisch-theologischen Begriff σοφία.
- source_word: μὴ παραπέσητε
  choice: und nicht zu Fall kommt
  rationale: Die Wendung lässt sowohl moralisches Versagen als auch ein allgemeineres Scheitern anklingen und legt den Ausdruck nicht vorschnell auf Abfall oder Irrweg fest.
theological_decisions:
- issue: Wertung der mit τύραννοι angeredeten Machthaber
  choice: „Tyrannen“ mit erklärender Fußnote
  alternative: „Herrscher“ oder „Gewaltherrscher“
  rationale: Der Kontext ist mahnend, und τύραννοι kann eine scharf negative Bezeichnung tragen. Zugleich wird in der Fußnote offengehalten, dass das Wort auch allgemein souveräne Herrscher bezeichnen kann.
- issue: Art des in παραπίπτω bezeichneten Versagens
  choice: „zu Fall kommt“
  alternative: „abfallt“, „fallt“ oder „vom rechten Weg abkommt“
  rationale: Die Übersetzung bewahrt die Breite des griechischen Verbs und vermeidet es, ausdrücklich Apostasie oder ausschließlich moralische Verirrung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Wendung „An euch also“ erhält den rhetorischen Nachdruck der griechischen Anrede; die Satzstruktur bleibt klar und gut verständlich.
