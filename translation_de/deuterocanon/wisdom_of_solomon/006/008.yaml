translation:
  language: de
  text: Den Mächtigen aber steht eine strenge Untersuchung bevor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς δὲ κραταιοῖς
  choice: Den Mächtigen aber
  rationale: κραταιός bezeichnet hier Menschen in einer starken bzw. machtvollen Stellung; der substantivierte Plural wird natürlich mit „den Mächtigen“ wiedergegeben. δέ markiert den Gegensatz zum vorausgehenden Zusammenhang.
- source_word: ἰσχυρά
  choice: strenge
  rationale: Das prädikativ vorangestellte Adjektiv verstärkt die nachfolgende „Untersuchung“ und bezeichnet sie als nachdrücklich, hart bzw. streng. „Strenge“ ist im Deutschen idiomatisch und bewahrt den bedrohlichen Ernst.
- source_word: ἐφίσταται
  choice: steht … bevor
  rationale: Das Präsens vermittelt ein unmittelbar drohendes Herankommen. „Steht bevor“ gibt diesen bevorstehenden Vollzug natürlich wieder, ohne die Untersuchung bereits als gegenwärtig auszugeben.
- source_word: ἔραυνα
  choice: Untersuchung
  rationale: ἔραυνα bezeichnet eine genaue Prüfung oder Untersuchung. Im Gerichtskontext ist „Untersuchung“ verständlich und lässt offen, wie diese Prüfung vollzogen wird.
theological_decisions:
- issue: Göttliches Gericht über Machthaber
  choice: Die Formulierung lässt das Subjekt der Untersuchung unausgesprochen und betont ihre Strenge.
  alternative: „Gott wird die Mächtigen streng prüfen.“
  rationale: Der griechische Satz nennt Gott nicht ausdrücklich. Die Übersetzung bewahrt diese grammatische Offenheit und importiert kein ausdrückliches Subjekt, auch wenn der Kontext göttliches Gericht nahelegt.
translation_notes:
  register: Knapp, würdevoll und in modernem Standarddeutsch. Die Voranstellung „Den Mächtigen aber“ wahrt den Kontrast des griechischen Satzes; „steht … bevor“ klingt natürlich und erhält den drohenden Zukunftsbezug.
