  text: For thinking about her is the perfection of understanding, and the one who stays awake because of her will quickly be free from care.
translation:
  language: de
  text: Denn über sie nachzudenken ist die Vollendung der Einsicht, und wer ihretwegen wach bleibt, wird schnell frei von Sorge sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνθυμηθῆναι περὶ αὐτῆς
  choice: über sie nachzudenken
  rationale: Gibt das bewusste Nachsinnen über die personifizierte Weisheit natürlich und eng am Griechischen wieder.
- source_word: φρονήσεως τελειότης
  choice: die Vollendung der Einsicht
  rationale: Bewahrt sowohl den Gedanken geistiger Einsicht als auch den starken Ausdruck τελειότης, ohne ihn zu bloßer Reife abzuschwächen.
- source_word: ὁ ἀγρυπνήσας δι' αὐτήν
  choice: wer ihretwegen wach bleibt
  rationale: Ἀγρυπνέω bezeichnet Wachen oder Wachbleiben; διὰ mit Akkusativ wird kausal als „ihretwegen“ wiedergegeben und nicht zweckgerichtet als „für sie“.
- source_word: ταχέως ἀμέριμνος ἔσται
  choice: wird schnell frei von Sorge sein
  rationale: Gibt das Futur und die zeitliche Bestimmung direkt wieder; „frei von Sorge“ wahrt den positiven Sinn von ἀμέριμνος.
theological_decisions:
- issue: Bezug des weiblichen Pronomens
  choice: „sie“ verweist wie im Kontext auf die personifizierte Weisheit
  alternative: das Pronomen durch „die Weisheit“ ausdrücklich ersetzen
  rationale: Die pronominale Form des Ausgangstextes bleibt erhalten und wahrt die literarische Personifikation sowie den Zusammenhang.
- issue: Bedeutung von δι’ αὐτήν
  choice: 'kausal: „ihretwegen“'
  alternative: 'final bzw. interessenbezogen: „für sie“'
  rationale: 'Die kausale Deutung entspricht der jüngsten adjudizierten Revision und ist im unmittelbaren Satz sinnvoll: Die Beschäftigung mit der Weisheit veranlasst das Wachen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt parallel zum Griechischen, klingt jedoch idiomatisch; keine Fußnote ist erforderlich.
