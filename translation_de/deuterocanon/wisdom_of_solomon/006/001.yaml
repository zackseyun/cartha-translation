translation:
  language: de
  text: Darum hört[a], ihr Könige, und versteht; lernt, ihr Richter an den Enden der Erde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hört zu“. Das griechische Verb kann sowohl das Hören als auch das aufmerksame Zuhören bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „an den Enden der Erde“ bezeichnet die fernsten Teile der Welt. Angesprochen sind Richter mit umfassender Reichweite; sie unterstreicht die weltweite Geltung der Mahnung.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσατε
  choice: Hört
  rationale: Der Pluralimperativ von ἀκούω fordert zum aufmerksamen Hören auf. „Hört“ bleibt knapp und quellennah; „Hört zu“ wäre ebenfalls möglich, würde die Aufmerksamkeitsnuance aber ausdrücklicher machen.
- source_word: οὖν
  choice: also
  rationale: οὖν kennzeichnet hier eine Folgerung aus dem vorausgehenden Gedankengang. „Also“ bewahrt diesen logischen Anschluss in natürlichem Deutsch.
- source_word: βασιλεῖς
  choice: Könige
  rationale: Das Substantiv bezeichnet ausdrücklich Könige. Die direkte Anrede wird beibehalten.
- source_word: σύνετε
  choice: versteht
  rationale: Der Imperativ von συνίημι bezeichnet verständiges Erfassen. „Versteht“ gibt den einfachen Wortsinn wieder, ohne ihn deutend zu „werdet weise“ zu erweitern.
- source_word: μάθετε
  choice: lernt
  rationale: Der Imperativ von μανθάνω bedeutet unmittelbar „lernt“. Die knappe parallele Aufforderung des Griechischen bleibt erhalten.
- source_word: δικασταί
  choice: Richter
  rationale: δικασταί bezeichnet Personen, die Recht sprechen oder richterliche Gewalt ausüben. „Richter“ bewahrt diese gerichtliche Nuance.
- source_word: περάτων γῆς
  choice: der Enden der Erde
  rationale: Die Genitivverbindung bezeichnet die äußersten Bereiche der Erde. Die bewusst bildhafte, biblisch geprägte Formulierung wird bewahrt, statt sie zu „überall auf der Erde“ aufzulösen.
