review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die drei Imperative (Ἀκούσατε, σύνετε, μάθετε), die Anrede an die Könige sowie δικασταί treffend wieder. οὖν ist mit „also“ grundsätzlich erfasst. Die Formulierung „Richter der Enden der Erde“ ist zwar formal nah am Genitiv des Griechischen, legt im heutigen Deutsch jedoch nahe, die „Enden“ selbst hätten Richter. „Richter an den Enden der Erde“ bewahrt das Bild und die universale Reichweite ohne diese unnatürliche Besitzbeziehung.
  naturalness: „Hört also“ ist möglich, aber „Darum hört“ ist im modernen Deutschen als folgernder Anschluss idiomatischer und zugleich würdevoll. „Richter an den Enden der Erde“ ist deutlich natürlicher als „Richter der Enden der Erde“.
  terminology: „Könige“, „versteht“, „lernt“ und „Richter“ sind sachgerecht. Das traditionssprachliche Bild „Enden der Erde“ bleibt erhalten; die Präposition „an“ klärt die im Deutschen sonst missverständliche Zuordnung, ohne die Aussage zu verengen.
  issues:
