base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/010.yaml
  text: For those who have kept holy things holily will be made holy[b][a], and those who have been taught them will find a defense.
translation:
  language: de
  text: Denn diejenigen, die heilige Dinge in heiliger Weise bewahrt haben, werden geheiligt werden[a]; und diejenigen, die darin unterwiesen worden sind, werden eine Verteidigung finden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit ähnlicher Wortwiederholung: „Diejenigen, die heilige Dinge heilig bewahrt haben, werden geheiligt werden.“ Im Griechischen stehen drei eng verwandte Wörter für Heiligkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Antwort“ beziehungsweise „Rechtfertigung“. Das griechische Wort kann eine Verteidigung oder Erwiderung bei einer Prüfung oder Anklage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαντες
  choice: bewahrt haben
  rationale: Das Partizip bezeichnet sorgfältiges Bewahren oder Befolgen. „Bewahrt haben“ erhält diese Bedeutungsbreite, ohne ein rein körperliches Bewachen nahezulegen.
- source_word: ὁσίως
  choice: auf heilige Weise
  rationale: Die adverbiale Wendung bleibt eng am griechischen Ausdruck und macht den beabsichtigten Gleichklang mit „das Heilige“ und „geheiligt“ im Deutschen sichtbar.
- source_word: τὰ ὅσια
  choice: das Heilige
  rationale: Der substantivierte neutrale Plural bezeichnet heilige Dinge, Ordnungen oder Belange allgemein. Das deutsche Kollektiv „das Heilige“ ist natürlich und lässt den Bezug bewusst offen.
- source_word: ὁσιωθήσονται
  choice: werden geheiligt werden
  rationale: Die zukünftige Passivform wird formal bewahrt. „Geheiligt“ führt zugleich die Folge verwandter Heiligkeitsbegriffe fort.
- source_word: διδαχθέντες
  choice: darin unterwiesen worden sind
  rationale: Die passive Bedeutung des Partizips bleibt erhalten. „Darin“ nimmt das zuvor genannte Heilige auf und klingt im Deutschen natürlicher als ein bloßes „es“.
- source_word: εὑρήσουσιν ἀπολογίαν
  choice: werden eine Verteidigung finden
  rationale: ἀπολογία kann eine Antwort oder Verteidigung angesichts von Prüfung oder Anklage bezeichnen. Die Wiedergabe erhält den forensischen Unterton, ohne bereits einen Freispruch oder eine dogmatisch aufgeladene „Rechtfertigung“ auszusagen.
theological_decisions:
- issue: Wortspiel ὁσίως / τὰ ὅσια / ὁσιωθήσονται
  choice: „das Heilige auf heilige Weise … werden geheiligt“
  alternative: „die heiligen Ordnungen fromm befolgt haben … werden geheiligt“
  rationale: Die auffällige Häufung verwandter Heiligkeitswörter ist ein wesentliches rhetorisches und theologisches Merkmal des griechischen Satzes. Sie wird trotz der leichten stilistischen Ungewöhnlichkeit im Deutschen erkennbar gehalten.
- issue: Bedeutung von ἀπολογία
  choice: „Verteidigung“
  alternative: „Antwort“ oder „Rechtfertigung“
  rationale: „Verteidigung“ wahrt den möglichen gerichtlichen Zusammenhang. „Antwort“ wäre weiter, „Rechtfertigung“ könnte dagegen eine stärker festgelegte dogmatische Bedeutung eintragen, die der Ausdruck hier nicht zwingend verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Formulierung „auf heilige Weise“ bewahrt bewusst das griechische Wortspiel; „alle, die“ gibt den pluralischen und allgemein geltenden Charakter der Aussage klar wieder.
