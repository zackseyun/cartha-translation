  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Aussagen des griechischen Textes insgesamt zutreffend wieder: Wesen und Entstehen der Weisheit, keine Verschwiegenheit der μυστήρια, Untersuchung von ihrem Beginn an, öffentliche Darlegung ihrer Erkenntnis und die nachdrückliche Verneinung eines Übergehens der Wahrheit. „Vom Anfang ihres Werdens an“ wahrt die nicht weiter dogmatisch bestimmte Ursprungs-/Werdenssprache. Die Formulierung „ihrer Spur ... folgen“ macht jedoch aus dem Verb ἐξιχνιάζω ein zusätzliches, im Deutschen recht konkretes Bild einer einzelnen Spur und lässt den Bezug syntaktisch weniger klar werden.'
