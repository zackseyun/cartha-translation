base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/022.yaml
  text: But what wisdom is and how it came to be[a], I will declare, and I will not hide mysteries from you; rather, from the beginning of its origin I will trace it out, and I will set the knowledge of it in the open[b], and I will by no means pass by the truth.
translation:
  language: de
  text: Doch was Weisheit ist und wie sie entstand,[a] will ich verkünden. Ich werde euch keine Geheimnisse verbergen, sondern sie von Anfang ihres Werdens an nachverfolgen, die Erkenntnis über sie ans Licht bringen und keinesfalls an der Wahrheit vorbeigehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie sie ins Dasein kam“. Der griechische Ausdruck bezeichnet ein Entstehen oder Werden, ohne hier ausdrücklich „erschaffen“ zu sagen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Wahrheit übergehen“. Die griechische Wendung enthält das Bild, an etwas vorbeizugehen, und ist nachdrücklich verneint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δέ ἐστιν σοφία
  choice: Doch was Weisheit ist
  rationale: Die direkte Fragekonstruktion und der abstrakte Sinn von σοφία bleiben erhalten; δέ wird als fortführendes „Doch“ wiedergegeben.
- source_word: πῶς ἐγένετο
  choice: wie sie entstand
  rationale: ἐγένετο bezeichnet ein Entstehen oder Ins-Dasein-Kommen. „Entstand“ ist im Deutschen natürlich und legt nicht eigens fest, ob Weisheit geschaffen wurde.
- source_word: ἀπαγγελῶ
  choice: will ich verkünden
  rationale: Das Verb bezeichnet ein kundgebendes Berichten; „verkünden“ wahrt den gehobenen, aber verständlichen Ton.
- source_word: οὐκ ἀποκρύψω ὑμῖν μυστήρια
  choice: Ich werde euch keine Geheimnisse verbergen
  rationale: Die Formulierung gibt sowohl das Verbergen als auch den gewichtigen Sinn von μυστήρια direkt und idiomatisch wieder.
- source_word: ἀπ' ἀρχῆς γενέσεως ἐξιχνιάσω
  choice: ihrer Spur vom Anfang ihres Werdens an folgen
  rationale: ἐξιχνιάζω enthält das Bild des Aufspürens anhand einer Fährte. „Werden“ hält den Prozesscharakter von γένεσις fest, ohne eine technische metaphysische Deutung einzutragen.
- source_word: θήσω εἰς τὸ ἐμφανὲς τὴν γνῶσιν αὐτῆς
  choice: die Erkenntnis über sie ans Licht bringen
  rationale: „Ans Licht bringen“ bildet das konkrete Offenbar-Machen ab. „Über sie“ vermeidet die missverständliche Lesart, es gehe um Erkenntnis, die Weisheit selbst besitzt.
- source_word: οὐ μὴ παροδεύσω τὴν ἀλήθειαν
  choice: keinesfalls an der Wahrheit vorbeigehen
  rationale: „Keinesfalls“ wahrt die verstärkte Verneinung οὐ μή; „vorbeigehen“ erhält die Wegmetapher von παροδεύω.
theological_decisions:
- issue: Mögliche metaphysische Aussage über den Ursprung der Weisheit in πῶς ἐγένετο und γενέσεως
  choice: „wie sie entstand“ und „vom Anfang ihres Werdens an“
  alternative: „wie sie geschaffen wurde“
  rationale: Der griechische Wortlaut spricht von Entstehen beziehungsweise Werden, bestimmt aber in diesem Vers nicht, ob damit Geschöpflichkeit, Offenbarwerden oder eine andere Ursprungsweise gemeint ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild des Spurensuchens und die Wegmetapher am Versende werden bewahrt; zugleich wird die lange griechische Periode zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert.
