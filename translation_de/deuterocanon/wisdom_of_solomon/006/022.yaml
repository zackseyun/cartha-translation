  terminology: „Weisheit“, „Geheimnisse“, „Erkenntnis“ und „Wahrheit“ sind angemessen. „Entstand“ und „Werden“ vermeiden zu Recht die theologisch enger festlegende Wiedergabe „geschaffen“.
