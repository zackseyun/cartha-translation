  to: Doch was Weisheit ist und wie sie entstand,[a] will ich verkünden. Ich werde euch keine Geheimnisse verbergen, sondern sie von Anfang ihres Werdens an nachverfolgen, die Erkenntnis über sie ans Licht bringen und keinesfalls an der Wahrheit vorbeigehen.[b]
