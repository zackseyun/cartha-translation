base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/003.yaml
  text: For authority was given to you by the Lord[a], and sovereignty by the Most High, who will examine your works and investigate your plans[b];
translation:
  language: de
  text: Denn vom Herrn wurde euch die Herrschaftsgewalt gegeben und vom Höchsten die Macht; er wird eure Taten prüfen und eure Pläne[a] erforschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Pläne“ kann auch mit „Ratschlüsse“, „Absichten“ oder „Überlegungen“ wiedergegeben werden; gemeint sind neben den äußeren Taten auch die inneren Entschlüsse der Herrschenden.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράτησις
  choice: Herrschaftsgewalt
  rationale: Das Wort bezeichnet hier die den Herrschenden übertragene Ausübung politischer Gewalt. „Herrschaftsgewalt“ gibt diesen Sinn präzise wieder und unterscheidet den Ausdruck von δυναστεία.
- source_word: δυναστεία
  choice: Macht
  rationale: Gemeint ist die Machtstellung oder Herrschermacht, nicht eine erbliche Dynastie. „Macht“ ist im Deutschen natürlich und bildet mit „Herrschaftsgewalt“ ein sinnvolles Begriffspaar.
- source_word: παρὰ τοῦ κυρίου / παρὰ Ὑψίστου
  choice: vom Herrn / vom Höchsten
  rationale: παρά mit dem Genitiv bezeichnet die Quelle. „Vom“ gibt dies im Deutschen unmittelbar und idiomatisch wieder; die beiden Gottesbezeichnungen bleiben parallel erhalten.
- source_word: ἐξετάσει
  choice: wird prüfen
  rationale: Das Verb bezeichnet eine sorgfältige Untersuchung. „Prüfen“ ist klar, würdig und passt zum Zusammenhang des göttlichen Gerichts.
- source_word: διεραυνήσει
  choice: wird erforschen
  rationale: Das verstärkte Verb bezeichnet ein gründliches Durchforschen. „Erforschen“ wahrt die Steigerung gegenüber „prüfen“ und kann sich auch auf innere Beweggründe beziehen.
- source_word: βουλάς
  choice: Pläne
  rationale: βουλαί kann Pläne, Ratschlüsse oder Absichten bezeichnen. „Pläne“ ist modern und verständlich, ohne die mögliche innere Willensrichtung auszuschließen.
theological_decisions:
- issue: Die parallelen Gottesbezeichnungen κύριος und Ὕψιστος
  choice: „der Herr“ und „der Höchste“
  alternative: „der HERR“ und „der Höchste“ beziehungsweise „der Gebieter“ und „der Höchste“
  rationale: Die beiden Titel werden als parallele Bezeichnungen Gottes bewahrt. So bleibt die Aussage bestehen, dass die Macht irdischer Herrscher von Gott stammt und ihrer Prüfung durch ihn unterliegt.
- issue: Bezug des prüfenden Subjekts
  choice: Mit „er“ auf den einen Gott hinter den beiden parallelen Titeln beziehen
  alternative: Die griechische Relativkonstruktion eng als „der eure Taten prüfen wird“ an „den Höchsten“ anschließen
  rationale: κύριος und Ὕψιστος bezeichnen im Parallelismus denselben göttlichen Geber. Das deutsche Pronomen stellt den sachlichen Bezug klar, ohne die Aussage theologisch zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzparallelität und die gerichtliche Aussage des griechischen Textes bleiben erhalten; das Semikolon bildet den Übergang von der verliehenen Macht zur göttlichen Rechenschaft ab.
