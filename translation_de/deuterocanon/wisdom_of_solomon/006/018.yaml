lexical_decisions:
- source_word: φροντίς
  choice: Sorge
  rationale: Das Substantiv bezeichnet Sorge, Bedacht oder ernsthafte Zuwendung. „Sorge um“ bewahrt die abstrakte Ausdrucksweise und klingt im Deutschen natürlich.
- source_word: παιδείας
  choice: Unterweisung
  rationale: παιδεία umfasst formende Erziehung, Schulung und Zucht. „Unterweisung“ ist verständlich und lässt den moralisch-formenden Sinn offen.
- source_word: ἀγάπη
  choice: Liebe
  rationale: Die zweimalige Verwendung desselben Substantivs wird als „Liebe“ wiedergegeben, sodass die beabsichtigte Begriffskette erhalten bleibt.
- source_word: τήρησις
  choice: Halten
  rationale: τήρησις bezeichnet das Bewahren oder Befolgen. „Das Halten ihrer Gesetze“ gibt den aktiven Gehorsamsaspekt knapp und bibelsprachlich verständlich wieder.
- source_word: νόμων
  choice: Gesetze
  rationale: Die direkte Wiedergabe von νόμοι als „Gesetze“ wahrt den rechtlich-ethischen Wortlaut und vermeidet die stärkere Deutung als einzelne Gebote.
- source_word: αὐτῆς
  choice: ihrer
  rationale: Das feminine Pronomen wird beibehalten und auf die im Kontext personifizierte Weisheit bezogen.
- source_word: προσοχή
  choice: Aufmerksamkeit
  rationale: προσοχή bezeichnet Aufmerksamkeit oder achtsame Hinwendung. Das abstrakte Substantiv passt zur parallelen Begriffskette des Verses.
- source_word: βεβαίωσις
  choice: Gewähr
  rationale: βεβαίωσις bezeichnet Bestätigung, Festigung oder Sicherung. „Gewähr“ drückt verlässliche Sicherung aus, ohne ausdrücklich einen automatischen Kausalmechanismus zu behaupten.
- source_word: ἀφθαρσίας
  choice: Unvergänglichkeit
  rationale: ἀφθαρσία bezeichnet Freiheit von Verderben und Verfall. „Unvergänglichkeit“ ist im Deutschen idiomatischer als „Unverderblichkeit“ und bewahrt den weiteren Sinn gegenüber der engeren Deutung „Unsterblichkeit“.
theological_decisions:
- issue: Personifizierung der Weisheit im Pronomen αὐτῆς
  choice: Das Pronomen wird feminin als „ihrer“ wiedergegeben und auf die personifizierte Weisheit bezogen.
  alternative: Unpersönliche Wiedergabe als „deren“ oder Bezug auf die Unterweisung.
  rationale: Der weitere Zusammenhang personifiziert die Weisheit als weibliche Gestalt. Die feminine Form des griechischen Pronomens erlaubt diesen Bezug, auch wenn παιδεία ebenfalls grammatisch feminin ist; die Übersetzung lässt den unmittelbaren Satzbezug nicht völlig verschwinden.
- issue: Bedeutung von ἀφθαρσία
  choice: Im Haupttext steht „Unvergänglichkeit“.
  alternative: „Unsterblichkeit“ oder „Unverderblichkeit“.
  rationale: Der griechische Ausdruck betont grundsätzlich die Freiheit von Verderben oder Verfall. „Unvergänglichkeit“ wahrt diese Breite und legt den Text nicht vorschnell ausschließlich auf biologische Unsterblichkeit fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Reihung abstrakter Begriffe. Die wiederholten Wörter „Liebe“ und „Gesetze“ spiegeln die argumentierende Kette des Griechischen; der Vers endet wie die Vorlage mit einem weiterführenden Komma.
