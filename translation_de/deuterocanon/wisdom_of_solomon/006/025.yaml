lexical_decisions:
- source_word: ὥστε
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Mahnung und klingt im modernen Deutschen natürlich.
- source_word: παιδεύεσθε
  choice: lasst euch … unterweisen
  rationale: Bewahrt den imperativischen und rezeptiven Charakter der Form und gibt den Zusammenhang von Unterweisung, Erziehung und formender Schulung wieder, ohne einseitig einen strafenden Sinn anzunehmen.
- source_word: τοῖς ῥήμασίν μου
  choice: durch meine Worte
  rationale: „Worte“ gibt ῥήματα schlicht und verständlich wieder; „durch“ bildet den instrumentalen Dativ ab.
- source_word: καὶ
  choice: und
  rationale: Gibt die einfache Verknüpfung der beiden Satzteile ohne unnötige Verstärkung wieder.
- source_word: ὠφεληθήσεσθε
  choice: ihr werdet daraus Nutzen ziehen
  rationale: Gibt die zukünftige Nutzwirkung idiomatisch wieder; „daraus“ macht im Deutschen den Bezug auf die Unterweisung deutlich, ohne einen neuen Gedanken einzuführen.
