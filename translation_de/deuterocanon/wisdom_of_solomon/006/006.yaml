translation:
  language: de
  text: Denn dem Geringsten kann aus Erbarmen verziehen werden[a]; die Mächtigen aber werden mit Macht geprüft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dem Geringsten kann aus Erbarmen Nachsicht gewährt werden.« Das griechische Adjektiv bezeichnet jemanden, dem verziehen oder mit Nachsicht begegnet werden kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht ein Wortspiel: »die Mächtigen werden mächtig geprüft«. »Streng« oder »mit aller Schärfe« gäben den Sinn natürlicher wieder, ließen aber den sprachlichen Anklang verloren gehen.'
    reason: wordplay
lexical_decisions:
- source_word: ἐλάχιστος
  choice: der Geringste
  rationale: Der substantivierte Superlativ bezeichnet den Menschen mit dem geringsten Rang oder der geringsten Macht und bildet einen knappen Gegensatz zu »die Mächtigen«.
- source_word: συγγνωστός
  choice: findet … Verzeihung
  rationale: Das Adjektiv bezeichnet jemanden, dem verziehen oder mit Nachsicht begegnet werden kann. Die verbale deutsche Fassung ist natürlich und bewahrt den gerichtlichen Zusammenhang.
- source_word: ἐλέους
  choice: aus Erbarmen
  rationale: Der knappe Genitiv wird als Grund beziehungsweise Ursprung der nachsichtigen Behandlung wiedergegeben, ohne ihn zu einer umfassenden theologischen Aussage auszubauen.
- source_word: δυνατοὶ
  choice: die Mächtigen
  rationale: Im Zusammenhang der Anrede an Herrscher sind Menschen mit Macht und Autorität gemeint. Die Formulierung erhält den Gegensatz zum »Geringsten«.
- source_word: δυνατῶς
  choice: mit Macht
  rationale: Die Wendung bewahrt im Deutschen das Wortspiel mit »die Mächtigen«, auch wenn »streng« den gemeinten Nachdruck idiomatischer ausdrücken könnte.
- source_word: ἐτασθήσονται
  choice: werden … geprüft
  rationale: Das Futur Passiv bezeichnet eine eingehende Untersuchung oder Prüfung. »Geprüft« bleibt knapp und legt das Ergebnis des Gerichts nicht vorweg.
theological_decisions:
- issue: Verhältnis von Erbarmen gegenüber dem Geringsten und strenger Prüfung der Mächtigen
  choice: Der Kontrast zwischen erbarmender Verzeihung und nachdrücklicher Prüfung bleibt stehen.
  alternative: Den Geringen wird vergeben, die Mächtigen aber werden streng verurteilt.
  rationale: Der griechische Text spricht von Verzeihung beziehungsweise Nachsicht und von Prüfung, nicht ausdrücklich von Freispruch auf der einen oder Verurteilung auf der anderen Seite. Die Übersetzung vermeidet daher eine dogmatische Ausweitung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt knapp und kontrastreich; das ungewöhnliche Wortspiel der zweiten Satzhälfte wird bewusst erhalten und in einer Fußnote erläutert.
