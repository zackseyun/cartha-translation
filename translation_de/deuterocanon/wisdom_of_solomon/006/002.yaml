  verdict: approve
  source_fidelity: Die Übersetzung gibt den aoristischen Aufforderungscharakter von ἐνωτίσασθε, die politische Herrschaft in κρατοῦντες und den kollektiven Sinn von πλήθους zuverlässig wieder. „Euch der Scharen von Völkern rühmt“ bildet γεγαυρωμένοι ἐπὶ ὄχλοις ἐθνῶν als selbstgefälliges Rühmen über bzw. angesichts dieser Völkerscharen angemessen ab, ohne die im Griechischen mögliche Nuance von Anlass und Gegenstand unnötig festzulegen.
  naturalness: „Hört aufmerksam zu“ ist klares modernes Standarddeutsch. Die Anrede „ihr, die ihr … herrscht“ ist würdevoll und gut verständlich. Die Genitivverbindung „sich der Scharen von Völkern rühmen“ ist leicht gehoben, aber in diesem prophetisch-mahnenden Register idiomatisch und passend.
  terminology: „Herrschen“, „Menschen“, „Scharen“ und „Völker“ sind sachgerecht. Es werden weder unterdrückerische Herrschaft noch eine bestimmte politische oder theologische Deutung in den Text eingetragen. Der Fußnotenanker steht unmittelbar bei der Imperativaufforderung und die Alternative ist strukturell korrekt.
