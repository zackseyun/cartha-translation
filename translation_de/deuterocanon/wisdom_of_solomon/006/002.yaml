  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/002.yaml
  text: Listen[a], you who rule over multitudes and boast over crowds of nations.
translation:
  language: de
  text: Hört aufmerksam zu[a], ihr, die ihr über viele Menschen herrscht und euch der Scharen von Völkern rühmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Schenkt Gehör, ihr, die ihr Macht über eine Menschenmenge habt und wegen der Scharen von Völkern frohlockt.'
    reason: 'Lexikalische Alternative: Die griechischen Ausdrücke können stärker als Aufforderung zum Hinhören, als Machtausübung und als stolzes Frohlocken aufgrund der unterstellten Völkerscharen wiedergegeben werden.'
lexical_decisions:
- source_word: ἐνωτίσασθε
  choice: Hört aufmerksam zu
  rationale: Der aoristische Imperativ von ἐνωτίζομαι fordert nachdrücklich dazu auf, Gehör zu schenken. Die Formulierung ist modern und gibt die aufmerksame Hinwendung wieder.
- source_word: οἱ κρατοῦντες πλήθους
  choice: ihr, die ihr über viele Menschen herrscht
  rationale: κρατέω bezeichnet hier im Zusammenhang mit Machthabern das Ausüben von Herrschaft; πλῆθος ist eine kollektiv gebrauchte große Menge. „Viele Menschen“ klingt im Deutschen natürlicher als „eine Menge“, ohne den Sinn zu verändern.
- source_word: γεγαυρωμένοι
  choice: euch … rühmt
  rationale: Das Perfektpartizip von γαυρόω bezeichnet stolzes, selbstgefälliges Frohlocken. „Sich rühmen“ bewahrt den tadelnden Ton, ohne ausdrücklich Unterdrückung zu unterstellen.
- source_word: ἐπὶ ὄχλοις ἐθνῶν
  choice: der Scharen von Völkern
  rationale: ὄχλοι bezeichnet große Scharen oder Menschenmengen, während ἐθνῶν die zugehörigen Völker benennt. Bei γαυρόω kann ἐπί den Gegenstand oder Anlass des Rühmens angeben; der deutsche Genitiv lässt diese Beziehung angemessen offen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Aufforderung mit direkter Anrede. Der tadelnde Unterton des griechischen Satzes bleibt erhalten; zugleich wird die Beziehung von ἐπί zu den Völkerscharen nicht unnötig auf räumliche Herrschaft oder bloße Ursache festgelegt.
