translation:
  language: de
  text: und Unvergänglichkeit bringt einen Menschen in die Nähe Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unsterblichkeit bringt einen Menschen in die Nähe Gottes.“ Das griechische Wort kann Unvergänglichkeit beziehungsweise Freiheit von Verfall und Verderben bezeichnen; „Unsterblichkeit“ ist hier ebenfalls möglich, aber enger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφθαρσία
  choice: Unvergänglichkeit
  rationale: Das Substantiv bezeichnet den Zustand, nicht dem Verfall oder Verderben unterworfen zu sein. „Unvergänglichkeit“ bewahrt die ontologische Weite des griechischen Ausdrucks besser als das engere „Unsterblichkeit“ und vermeidet die im Deutschen stark moralisch klingende „Unbestechlichkeit“.
- source_word: ἐγγὺς εἶναι
  choice: in die Nähe … bringen
  rationale: Die Wendung bedeutet wörtlich „nahe sein“. Zusammen mit dem kausativen ποιεῖ ergibt sich im Deutschen natürlich „in die Nähe … bringen“, ohne daraus eine Vereinigung mit Gott zu machen.
- source_word: ποιεῖ
  choice: bringt
  rationale: ποιεῖ ist hier kausativ. „Bringt … in die Nähe“ gibt „macht, dass … nahe ist“ idiomatisch und prägnant wieder.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv bei ἐγγύς bezeichnet die Person, der man nahe ist; die deutsche Fügung „in die Nähe Gottes“ entspricht dieser Beziehung.
theological_decisions:
- issue: Unausgesprochenes Objekt des kausativen Verbs
  choice: einen Menschen
  alternative: „einen“; „[ihn]“; Weisheit als Objekt
  rationale: Im Griechischen fehlt ein ausdrückliches Objekt. Der Zusammenhang der Gedankenfolge bezieht die Wirkung auf den Menschen, der Weisheit sucht und besitzt. „Einen Menschen“ macht dies auf Deutsch verständlich, ohne Geschlecht oder eine bestimmte Einzelperson festzulegen; Weisheit selbst als Objekt zu verstehen, ist im Zusammenhang weniger wahrscheinlich.
- issue: Bedeutungsumfang von ἀφθαρσία
  choice: Unvergänglichkeit
  alternative: Unsterblichkeit; Unbestechlichkeit
  rationale: „Unvergänglichkeit“ hält den umfassenden Sinn von Freiheit von Verfall und Verderben offen. „Unsterblichkeit“ wäre möglich, würde den Ausdruck aber auf endloses Leben verengen; „Unbestechlichkeit“ verlagerte ihn zu stark auf die moralische Integrität.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist als Fortsetzung des vorhergehenden Gedankens kleingeschrieben und beginnt mit „und“. „In die Nähe Gottes bringen“ klingt natürlicher als das wörtlichere „nahe bei Gott sein lassen“ und bewahrt zugleich die relationale Aussage.
