  text: Wisdom is radiant and unfading[a], and is readily seen by those who love her;
translation:
  language: de
  text: Strahlend und unverwelklich ist die Weisheit und wird von denen, die sie lieben, leicht wahrgenommen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gesehen« oder »geschaut«. Das griechische Verb kann sowohl das Sehen als auch das wahrnehmende Erkennen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαμπρὰ
  choice: strahlend
  rationale: Bewahrt die sichtbare Leuchtkraft des griechischen Adjektivs und passt zur personifizierten Weisheit, ohne ausdrücklich theologische Bedeutungen hinzuzufügen.
- source_word: ἀμάραντός
  choice: unverwelklich
  rationale: Erhält das konkrete Bild dessen, was weder verwelkt noch seine Frische verliert, statt es zum allgemeineren »unvergänglich« zu abstrahieren.
- source_word: ἡ σοφία
  choice: die Weisheit
  rationale: Die feminine Form und der bestimmte Artikel werden natürlich wiedergegeben; das spätere Pronomen »sie« erhält die literarische Personifikation.
- source_word: εὐχερῶς
  choice: leicht
  rationale: Gibt die Bedeutung »ohne Schwierigkeit, mühelos« knapp und idiomatisch wieder.
- source_word: θεωρεῖται
  choice: wird … erkannt
  rationale: Der Kontext spricht nicht nur von körperlichem Sehen, sondern auch vom Wahrnehmen oder Erkennen der Weisheit. »Erkannt« ist im Deutschen natürlich, während die mögliche visuelle Bedeutung in der Fußnote erhalten bleibt.
- source_word: ὑπὸ τῶν ἀγαπώντων αὐτήν
  choice: von denen, die sie lieben
  rationale: Gibt die passive Zuordnung und das präsentische Partizip sachgerecht wieder und bewahrt durch »sie« die Personifikation.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Die Weisheit wird mit dem femininen Pronomen »sie« als personifizierte Gestalt dargestellt.
  alternative: Weisheit nur als unpersönliche Eigenschaft wiedergeben.
  rationale: Der griechische Text verwendet feminine Formen und stellt die Weisheit im Zusammenhang literarisch als weibliche Gestalt dar. Die Übersetzung wahrt diese Darstellung, ohne sie dogmatisch näher zu bestimmen.
- issue: Sehen oder geistiges Wahrnehmen
  choice: θεωρεῖται wird im Haupttext mit »wird … erkannt« wiedergegeben, die visuelle Bedeutung bleibt als Alternative in der Fußnote erhalten.
  alternative: »wird … gesehen« oder »wird … geschaut«.
  rationale: Das Verb kann sowohl visuelles Schauen als auch wahrnehmendes Erkennen ausdrücken. Der Haupttext soll natürlich klingen, ohne die echte Bedeutungsbreite zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung »Strahlend und unverwelklich« erhält die feierliche Betonung des griechischen Satzes; »unverwelklich« bewahrt bewusst dessen Bildsprache.
