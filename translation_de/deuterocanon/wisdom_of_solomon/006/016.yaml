base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/016.yaml
  text: For she goes about seeking those worthy of her[a], and graciously appears to them on the paths, and meets them in every purpose.
translation:
  language: de
  text: Denn sie selbst geht umher und sucht die, die ihrer würdig sind; freundlich zeigt sie sich ihnen auf den Wegen und kommt ihnen bei jedem Gedanken entgegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei jedem Plan“ oder „bei jeder Absicht“. Das griechische Wort kann sowohl einen Gedanken allgemein als auch eine gefasste Absicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ἀξίους αὐτῆς
  choice: die, die ihrer würdig sind
  rationale: Bewahrt den wertenden Sinn von ἄξιος und den relationalen Genitiv, ohne näher zu bestimmen, worin diese Würdigkeit besteht.
- source_word: περιέρχεται ζητοῦσα
  choice: geht umher und sucht
  rationale: Gibt sowohl die Bewegung des finiten Verbs als auch die fortdauernde, zielgerichtete Suche des Partizips wieder.
- source_word: ἐν ταῖς τρίβοις
  choice: auf ihren Wegen
  rationale: τρίβος bezeichnet Weg, Pfad oder Bahn. Das Possessivpronomen bezieht sich natürlich auf die Gesuchten und entspricht dem Dativ αὐτοῖς im Satzgefüge.
- source_word: φαντάζεται αὐτοῖς εὐμενῶς
  choice: freundlich zeigt sie sich ihnen
  rationale: φαντάζομαι bezeichnet hier das Sichtbarwerden oder Sichzeigen; εὐμενῶς bringt eine wohlwollende, freundliche Haltung zum Ausdruck.
- source_word: ἐν πάσῃ ἐπινοίᾳ
  choice: bei jedem Gedanken
  rationale: ἐπίνοια kann Gedanke, Einfall, Absicht oder Plan bedeuten. „Gedanke“ wahrt die Weite des Ausdrucks; die Alternativen werden in der Fußnote kenntlich gemacht.
- source_word: ὑπαντᾷ αὐτοῖς
  choice: kommt ihnen … entgegen
  rationale: ὑπαντάω kann nicht nur „begegnen“, sondern auch „entgegenkommen“ heißen und unterstreicht hier die Initiative der personifizierten Weisheit.
theological_decisions:
- issue: Personifikation der Weisheit als handelnde weibliche Gestalt
  choice: Die weibliche Personifikation wird mit „sie“ und „ihrer“ durchgehend beibehalten.
  alternative: Die Weisheit unpersönlich oder rein abstrakt wiedergeben.
  rationale: Die griechischen Femininformen und die persönlichen Handlungen stellen die Weisheit bewusst als weibliche Gestalt dar. Eine abstrakte Wiedergabe würde dieses literarisch-theologische Profil abschwächen.
- issue: Würdigkeit der von der Weisheit Gesuchten
  choice: „die, die ihrer würdig sind“ bleibt ohne dogmatische Erläuterung stehen.
  alternative: Die Wendung als moralisches Verdienst, Eignung oder göttliche Erwählung ausdeuten.
  rationale: Der Text nennt keine Grundlage dieser Würdigkeit; die Übersetzung bewahrt daher die Spannung und vermeidet eine konfessionelle Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weibliche Personifikation bleibt deutlich erhalten. „Geht umher und sucht“ sowie „kommt ihnen entgegen“ machen die aktive Initiative der Weisheit sichtbar; das mehrdeutige ἐπίνοια wird im Haupttext breit und in der Fußnote differenziert wiedergegeben.
