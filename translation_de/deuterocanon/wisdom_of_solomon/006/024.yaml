base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/024.yaml
  text: A multitude of the wise is the salvation of the world[b][a], and a prudent king is the stability of a people.
translation:
  language: de
  text: Eine große Zahl von Weisen ist die Rettung der Welt[a], und ein umsichtiger König ist die Stabilität eines Volkes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Heil« oder »Bewahrung«.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann »Volk«, »Bevölkerung« oder »Bürgerschaft« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆθος
  choice: eine große Zahl
  rationale: Die Wendung gibt die große Menge bzw. Vielzahl wieder und klingt im Deutschen natürlicher als das schwerfällige »eine Menge von Weisen«.
- source_word: σοφῶν
  choice: von Weisen
  rationale: Der substantivierte Ausdruck bezeichnet weise Menschen allgemein und bewahrt den knappen, gehobenen Ton des Spruchs.
- source_word: σωτηρία
  choice: Rettung
  rationale: »Rettung« bewahrt die starke Bedeutung von σωτηρία, ohne den Ausdruck im politisch-gesellschaftlichen Zusammenhang vorschnell auf rein geistliches Heil oder bloßes Wohlergehen festzulegen.
- source_word: κόσμου
  choice: der Welt
  rationale: Der Genitiv wird unmittelbar wiedergegeben; κόσμος bezeichnet hier umfassend die Welt beziehungsweise die Menschenwelt.
- source_word: βασιλεὺς
  choice: König
  rationale: Das griechische Wort bezeichnet ausdrücklich einen König und nicht nur allgemein einen Herrscher.
- source_word: φρόνιμος
  choice: umsichtig
  rationale: »Umsichtig« betont praktische Klugheit und gutes Urteilsvermögen und unterscheidet den Begriff von den »Weisen« im ersten Satzglied.
- source_word: εὐσταθία
  choice: Stabilität
  rationale: Der Ausdruck bezeichnet festen Bestand, Sicherheit oder geordnete Stabilität; im politischen Zusammenhang ist »Stabilität« klar und treffend.
- source_word: δήμου
  choice: eines Volkes
  rationale: Der unbestimmte Ausdruck passt zum allgemeingültigen Spruch und lässt den Bedeutungsbereich von Volk, Bevölkerung und Bürgerschaft offen.
theological_decisions:
- issue: Bedeutungsumfang von σωτηρία im weisheitlich-politischen Zusammenhang
  choice: Rettung
  alternative: Heil; Bewahrung; Wohlergehen
  rationale: Der Vers spricht von der rettenden Wirkung vieler Weiser für die Welt. »Rettung« erhält das Gewicht des griechischen Begriffs, ohne ihn auf rein politische Wohlfahrt zu verengen oder ausschließlich heilsgeschichtlich zu verstehen.
translation_notes:
  register: Moderner, würdevoller Spruchstil mit parallelem Satzbau. Die wiederholte Kopula »ist« macht die beiden nominalen Aussagen im Deutschen klar. Die Formulierung bleibt allgemein und vermeidet konfessionelle Zuspitzungen.
