base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/021.yaml
  text: Therefore[a], if you delight in thrones and scepters, O rulers of peoples, honor wisdom, so that you may reign forever.
translation:
  language: de
  text: Wenn ihr also an Thronen und Zeptern Gefallen findet, ihr Herrscher über Völker[a], dann ehrt die Weisheit, damit ihr für immer herrscht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tyrannen der Völker“. Das griechische Wort kann allgemein Herrscher bezeichnen, in manchen Zusammenhängen aber auch einen abwertenden Sinn haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδεσθε
  choice: Gefallen findet
  rationale: Die Wendung gibt das Sichfreuen bzw. Lustempfinden des Verbs natürlich und würdig wieder, ohne die Anziehungskraft politischer Herrschaft abzuschwächen.
- source_word: θρόνοις καὶ σκήπτροις
  choice: an Thronen und Zeptern
  rationale: Die konkreten Herrschaftssymbole des griechischen Textes werden unmittelbar bewahrt.
- source_word: τύραννοι λαῶν
  choice: Herrscher über Völker
  rationale: τύραννοι kann Herrscher bezeichnen, ohne notwendig den stark abwertenden Sinn des heutigen deutschen Wortes „Tyrannen“ zu tragen. Der Plural λαῶν wird mit „Völker“ wiedergegeben; die mögliche negative Bedeutung wird in der Fußnote offengehalten.
- source_word: τιμήσατε
  choice: ehrt
  rationale: Das Verb verlangt, der Weisheit Ehre und hohe Wertschätzung entgegenzubringen; „ehrt“ bewahrt Imperativ und gehobenen Ton.
- source_word: σοφίαν
  choice: die Weisheit
  rationale: Die übliche Wiedergabe erhält sowohl den praktischen als auch den im Buch möglichen personifizierten Klang.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die idiomatische Wendung bezeichnet unbegrenzte bzw. bleibende Dauer und wird in verständlichem modernem Deutsch wiedergegeben.
- source_word: βασιλεύσητε
  choice: ihr … herrscht
  rationale: „Herrschen“ bewahrt im Zusammenhang mit Thronen und Zeptern den königlichen Sinn, ohne im Deutschen eine schwerfällige Formulierung zu erzeugen.
theological_decisions:
- issue: Bedeutung von τύραννοι in der Anrede politischer Machthaber
  choice: Neutral im Haupttext als „Herrscher über Völker“ wiedergegeben.
  alternative: „Tyrannen der Völker“
  rationale: Das griechische Wort kann im hellenistischen Sprachgebrauch allgemein einen Herrscher bezeichnen. Das moderne „Tyrannen“ würde zwingend eine scharfe moralische Verurteilung ausdrücken, die der ermahnende Kontext nicht eindeutig verlangt. Die echte Bedeutungsbreite bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform „Wenn …, dann …“ macht den griechischen Bedingungssatz klar; „also“ gibt οὖν wieder. Die königliche Bildsprache bleibt erhalten.
