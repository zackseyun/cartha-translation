translation:
  language: de
  text: Auch werde ich nicht mit Neid einhergehen, der dahinschwindet[a]; denn dieser wird keinen Anteil an der Weisheit haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »mit dahingeschmolzenem« oder »dahinschwindendem Neid«. Das Wort kann Neid als etwas bildhaft Vergehendes kennzeichnen. »Dieser« kann den personifizierten Neid oder den neidischen Menschen meinen.'
    reason: lexikalische und referenzielle Mehrdeutigkeit
lexical_decisions:
- source_word: οὔτε μὴν
  choice: Auch werde ich nicht
  rationale: Gibt die fortführende Verneinung mit leichter Betonung in natürlichem modernem Deutsch wieder.
- source_word: φθόνῳ
  choice: mit Neid
  rationale: Der Dativ hängt von συνοδεύσω ab; »Neid« ist der übliche moralische Begriff und passt zum Gegensatz zur Weisheit.
- source_word: τετηκότι
  choice: der sich selbst verzehrt
  rationale: Das Perfektpartizip von τήκω bezeichnet ein Dahinschmelzen oder Sich-Aufzehren. Die reflexive Form bewahrt das Bild eines Neides, der sich selbst zugrunde richtet, ohne die mögliche aktive Nebenbedeutung des Verzehrens anderer in den Haupttext einzutragen.
- source_word: συνοδεύσω
  choice: werde ich … einhergehen
  rationale: Bewahrt das Weg- und Gemeinschaftsbild des Verbs und klingt zugleich würdig und verständlich.
- source_word: οὗτος
  choice: dieser
  rationale: Das maskuline Demonstrativpronomen nimmt im Deutschen grammatisch »Neid« auf und erhält zugleich die Personifizierung sowie die mögliche gedankliche Beziehung auf den neidischen Menschen.
- source_word: οὐ κοινωνήσει
  choice: wird keinen Anteil … haben
  rationale: Gibt die Vorstellung von Teilhabe oder Gemeinschaft klar und idiomatisch wieder.
- source_word: σοφίᾳ
  choice: an der Weisheit
  rationale: Entspricht dem zentralen Begriff des Buches und der vom Verb verlangten Teilhabebeziehung.
theological_decisions:
- issue: Bezug von οὗτος
  choice: Die personifizierte Rede vom Neid bleibt im Haupttext erhalten.
  alternative: Das Demonstrativpronomen bezeichnet den neidischen Menschen.
  rationale: Der griechische maskuline Rückverweis kann unmittelbar den ebenfalls maskulinen »Neid« personifizieren, zugleich aber gedanklich den von Neid bestimmten Menschen meinen. »Dieser« bewahrt diese Spannung im Deutschen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Einhergehen« erhält das Bild des gemeinsamen Weges; die Satzstellung bleibt klar und gut vorlesbar.
