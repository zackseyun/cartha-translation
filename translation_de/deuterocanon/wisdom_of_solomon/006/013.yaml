translation:
  language: de
  text: Denen, die sich nach ihr sehnen, kommt sie zuvor, indem sie sich zu erkennen gibt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »Sie kommt denen, die [sie] begehren, zuvor, um zuvor erkannt zu werden.« Der griechische Satz ist stark verdichtet. προγνωσθῆναι ist formal passiv und kann »zuvor erkannt zu werden« heißen; der Haupttext gibt den im Zusammenhang naheliegenden Sinn wieder, dass die Weisheit den nach ihr Verlangenden zuvorkommt, indem sie sich ihnen zu erkennen gibt.'
    reason: Die Fußnote kennzeichnet die formale passive Infinitivform, ergänzt das aus dem Kontext erschlossene Objekt transparent und erklärt die idiomatische Deutung des Haupttextes, ohne die komprimierte griechische Syntax zu stark festzulegen.
lexical_decisions:
- source_word: φθάνει
  choice: kommt sie zuvor
  rationale: Das Verb bezeichnet hier, dass die Weisheit den Suchenden zuvorkommt beziehungsweise ihnen voraus ist. »Kommt … zuvor« bewahrt diesen Gedanken ihrer eigenen, frühzeitigen Initiative genauer als ein bloßes »eilt«.
- source_word: τοὺς ἐπιθυμοῦντας
  choice: denen, die sich nach ihr sehnen
  rationale: ἐπιθυμέω bezeichnet ein starkes Verlangen. Das Objekt »ihr« ergibt sich aus dem unmittelbaren Zusammenhang, in dem die Weisheit als weibliche Gestalt personifiziert ist.
- source_word: προγνωσθῆναι
  choice: indem sie sich zu erkennen gibt
  rationale: Der formal passive Aoristinfinitiv bedeutet wörtlich etwa »im Voraus erkannt zu werden«. Im stark verkürzten griechischen Satz drückt er wahrscheinlich aus, dass die Weisheit den nach ihr Verlangenden zuvorkommt, indem sie sich ihnen erkennen lässt.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Die Weisheit wird mit dem femininen Pronomen »sie« wiedergegeben.
  alternative: Weisheit als unpersönliche Eigenschaft behandeln.
  rationale: Der griechische Zusammenhang stellt die Weisheit als weibliche Gestalt dar. Diese literarisch-theologische Personifikation wird bewahrt, ohne sie weitergehend dogmatisch festzulegen.
- issue: Wer bei der Erkenntnis die Initiative ergreift
  choice: Die Weisheit kommt den nach ihr Verlangenden zuvor und gibt sich zu erkennen.
  alternative: Die Formulierung so verstehen, dass die Verlangenden selbst im Voraus erkannt werden möchten.
  rationale: Der Zusammenhang und die Verbindung von φθάνει mit προγνωσθῆναι sprechen wahrscheinlich für die Initiative der Weisheit. Wegen der grammatischen Verdichtung wird die formal mögliche Alternative in der Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung »Denen, die sich nach ihr sehnen« klingt natürlich und hebt die Beziehung zwischen den Suchenden und der ihnen zuvorkommenden Weisheit hervor. Die Fußnote bewahrt die formale Mehrdeutigkeit des griechischen Satzes.
