  text: Whoever rises early for her will not grow weary[b][a], for he will find her sitting beside his gates.
translation:
  language: de
  text: Wer sich früh zu ihr aufmacht, wird nicht müde werden[a]; denn er wird sie bei seinen Toren sitzend finden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer sie schon früh sucht, wird nicht müde werden.“ Das griechische Verb bezeichnet wörtlich ein frühes Aufstehen und kann darüber hinaus ein eifriges, frühes Suchen meinen.'
    reason: lexical_alternative
  - marker: b
    text: Die personifizierte Weisheit ist bereits am Eingang des Suchenden gegenwärtig und wartet dort auf ihn.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὀρθρίσας ἐπ' αὐτὴν
  choice: Wer sich früh zu ihr aufmacht
  rationale: ὀρθρίζω bezeichnet zunächst das frühe Aufstehen und kann im Zusammenhang ein frühes, eifriges Aufsuchen ausdrücken. Die Wendung bewahrt sowohl das Bild des frühen Aufbruchs als auch die Ausrichtung auf die personifizierte Weisheit.
- source_word: οὐ κοπιάσει
  choice: wird sich nicht abmühen
  rationale: κοπιάω kann mühevolle Arbeit wie auch die daraus entstehende Ermüdung bezeichnen. „Sich nicht abmühen“ gibt hier natürlich wieder, dass die Suche keine erschöpfende Anstrengung erfordert.
- source_word: πάρεδρον
  choice: sitzend
  rationale: πάρεδρος bezeichnet jemanden, der daneben oder zur Seite sitzt. Zusammen mit „an seinen Toren“ entsteht das konkrete Bild der bereits wartenden Weisheit.
- source_word: γὰρ
  choice: denn
  rationale: γάρ führt die Begründung dafür ein, warum der Suchende sich nicht abmühen wird.
- source_word: τῶν πυλῶν αὐτοῦ
  choice: an seinen Toren
  rationale: πύλη bezeichnet ein Tor oder einen größeren Eingang. Der Plural und das Possessivpronomen bleiben erhalten, ohne ein im Griechischen nicht ausdrücklich genanntes Haus hinzuzufügen.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit und generische männliche Bezugnahme
  choice: Die Weisheit wird mit „ihr/sie“ weiblich personifiziert; der Suchende wird im zweiten Satz mit „er/seinen“ aufgenommen.
  alternative: Die Bezugnahme auf den Suchenden könnte durch eine Wiederholung wie „dieser Mensch“ geschlechtsneutraler gestaltet werden.
  rationale: Das Griechische personifiziert die Weisheit eindeutig weiblich und formuliert den allgemein gemeinten Suchenden grammatisch maskulin. Die Übersetzung erhält beide Züge, ohne die Aussage auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwortartigem Satzbau. „Sich früh zu ihr aufmachen“ erhält das konkrete Bild des frühen Aufstehens, klingt aber natürlicher als eine streng wörtliche Formulierung. Die weibliche Personifikation der Weisheit bleibt deutlich.
