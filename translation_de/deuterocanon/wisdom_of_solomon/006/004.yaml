translation:
  language: de
  text: Denn als Diener seiner Herrschaft wart ihr[a], habt nicht recht geurteilt[b], das Gesetz nicht befolgt und nicht nach Gottes Ratschluss gelebt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn da ihr Diener seiner Herrschaft wart“. Für „Herrschaft“ ist auch „Reich“ oder „Königsherrschaft“ möglich.'
    reason: grammatical_and_lexical_alternative
  - marker: b
    text: 'Oder: „nicht gerecht gerichtet“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „nicht nach Gottes Plan“ beziehungsweise „nicht im Einklang mit Gottes Willen“. Das zugrunde liegende Verb bedeutet wörtlich „gehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπηρέται ... τῆς αὐτοῦ βασιλείας
  choice: Diener seiner Herrschaft
  rationale: ὑπηρέται bezeichnet Personen, die einer höheren Autorität untergeordnet dienen, hier die angesprochenen Herrscher als Amtsträger unter Gottes Herrschaft. „Diener“ bewahrt den Dienstgedanken; „Herrschaft“ gibt βασιλεία in diesem Zusammenhang natürlicher als das stärker räumliche „Reich“ wieder.
- source_word: ἐκρίνατε ὀρθῶς
  choice: habt ihr nicht recht geurteilt
  rationale: Die Formulierung bewahrt sowohl den gerichtlichen Sinn von κρίνω als auch die adverbiale Bedeutung von ὀρθῶς, ohne sie ausschließlich auf einen einzelnen Aspekt der Gerechtigkeit einzuengen.
- source_word: ἐφυλάξατε νόμον
  choice: das Gesetz nicht befolgt
  rationale: φυλάσσω bedeutet bei νόμος, eine Norm einzuhalten oder zu beachten. „Befolgen“ ist im heutigen Deutsch klar und idiomatisch; der bestimmte Artikel bezeichnet den vorausgesetzten göttlichen Rechtsmaßstab.
- source_word: κατὰ τὴν βουλὴν τοῦ θεοῦ
  choice: nach Gottes Ratschluss
  rationale: βουλή kann Rat, Beschluss, Plan oder Absicht bezeichnen. „Ratschluss“ erhält den Gedanken einer bedachten göttlichen Absicht und legt ihn nicht vorschnell nur als Wunsch oder Willensäußerung aus.
- source_word: ἐπορεύθητε
  choice: gelebt
  rationale: πορεύομαι bezeichnet wörtlich das Gehen, wird hier jedoch ethisch für die Lebensführung gebraucht. „Gelebt“ vermittelt diese Bedeutung in modernem Deutsch klarer als das heute gehobene „gewandelt“.
theological_decisions:
- issue: Stellung irdischer Herrscher unter Gottes Souveränität
  choice: Die Angesprochenen erscheinen als Diener, deren Herrschaftsgewalt der Herrschaft Gottes untergeordnet ist.
  alternative: Die Aussage kann allgemeiner auf alle Menschen mit übertragener Autorität bezogen werden.
  rationale: Der unmittelbare Zusammenhang richtet sich an Könige und Richter. Die Wendung ὑπηρέται ... τῆς αὐτοῦ βασιλείας beschreibt ihre Autorität als abgeleitet, ohne darüber hinaus eine bestimmte Lehre über Staat oder religiöse Ämter einzutragen.
- issue: Verhältnis des Partizips ὄντες zum Hauptsatz
  choice: „obwohl ihr … wart“ gibt die im Zusammenhang naheliegende konzessive Spannung wieder.
  alternative: Formal enger wäre „als Diener seiner Herrschaft“, ohne die logische Beziehung ausdrücklich als konzessiv zu bestimmen.
  rationale: Das Griechische lässt die adverbiale Beziehung des Partizips unausgesprochen. Im Kontext verschärft gerade ihre Stellung als Diener Gottes ihr Versagen; die Fußnote hält die formal offenere Möglichkeit fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am griechischen Dreiklang des Versagens, während „gelebt“ die ethische Wegmetapher verständlich wiedergibt. Fachsprachliche oder konfessionell geprägte Ausdrücke werden vermieden; „Ratschluss“ bleibt als leicht gehobenes, aber verständliches Wort erhalten.
