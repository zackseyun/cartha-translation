  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/005.yaml
  text: He will come upon you terribly and swiftly[a], because severe judgment comes upon those in high places.
translation:
  language: de
  text: Furchtbar und schnell wird er euch entgegentreten[a], denn über die Hochgestellten ergeht ein hartes Gericht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird er furchterregend und rasch über euch kommen«.'
    reason: Das griechische Verb kann sowohl das Herantreten oder Gegenübertreten als auch das plötzliche Kommen über jemanden bezeichnen; auch die beiden Adverbien lassen mehrere nahe Wiedergaben zu.
  - marker: b
    text: 'Oder: »denn unter den Mächtigen findet ein unvermitteltes Gericht statt«.'
    reason: ἀπότομος kann neben »hart« auch »schroff« oder »unvermittelt« bedeuten; die griechische Präposition ἐν kann hier mit »unter« wiedergegeben werden.
lexical_decisions:
- source_word: φρικτῶς
  choice: furchtbar
  rationale: Das Adverb bezeichnet ein Schrecken erregendes, Furcht einflößendes Auftreten. »Furchtbar« bewahrt diese starke Wirkung in natürlichem Deutsch.
- source_word: ταχέως
  choice: schnell
  rationale: Das Adverb hebt hervor, wie rasch das angekündigte Eingreifen erfolgt. »Schnell« ist klar, würdig und unmittelbar.
- source_word: ἐπιστήσεται
  choice: wird … entgegentreten
  rationale: Die Zukunftsform von ἐφίστημι kann ein Herantreten, Gegenübertreten oder bedrohliches Eintreffen bezeichnen. »Entgegentreten« erhält den persönlichen Bezug auf die angeredeten Herrscher, ohne das Handeln als Angriff zu überdeuten.
- source_word: κρίσις
  choice: Gericht
  rationale: Gemeint ist hier richterliches Handeln gegenüber den Machthabern, nicht lediglich abstrakte Gerechtigkeit.
- source_word: ἀπότομος
  choice: hartes
  rationale: Das Wort kann »hart«, »streng«, »schroff« oder »unvermittelt« bedeuten. Da ταχέως bereits die Schnelligkeit ausdrückt, gibt »hart« vor allem die unerbittliche Schärfe des Gerichts wieder.
- source_word: ἐν τοῖς ὑπερέχουσιν
  choice: über die Hochgestellten
  rationale: Das substantivierte Partizip bezeichnet Menschen, die durch Rang, Macht oder Stellung herausragen. »Hochgestellte« bewahrt das Bild erhöhter gesellschaftlicher Stellung.
- source_word: γίνεται
  choice: ergeht
  rationale: In Verbindung mit »Gericht« gibt »ergeht« den ereignishaften und richterlichen Sinn idiomatisch wieder.
theological_decisions:
- issue: Art des angekündigten Handelns
  choice: Die Aussage warnt die direkt angeredeten Machthaber davor, dass Gott ihnen furchtbar und schnell entgegentreten und ein hartes Gericht über sie ergehen wird.
  alternative: Der zweite Satz kann auch allgemeiner als Grundsatz verstanden werden, dass unter den Hochgestellten ein schroffes oder unvermitteltes Gericht stattfindet.
  rationale: Der unmittelbare Kontext richtet sich an Herrscher, und das Pronomen »euch« kennzeichnet eine direkte Warnung. Zugleich wird die allgemeinere Formulierung des griechischen zweiten Satzes nicht auf eine bestimmte geschichtliche Vollstreckung festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede und knapper Gerichtssprache. »Hochgestellte« ist allgemein verständlich und bewahrt die Rangmetaphorik des Griechischen; die Fußnoten erhalten die echte lexikalische und syntaktische Mehrdeutigkeit.
