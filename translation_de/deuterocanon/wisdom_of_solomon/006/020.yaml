  text: So then[a], desire for wisdom leads to kingship.
translation:
  language: de
  text: Das Verlangen nach Weisheit führt also zur Königsherrschaft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Königtum“, „zu königlicher Herrschaft“ oder „zu einem Königreich“. Das griechische Wort βασιλεία kann Königsherrschaft, Königtum oder Königreich bezeichnen; hier passt „Königsherrschaft“ am besten zum Gedankengang über das Erlangen von Herrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμία
  choice: Verlangen
  rationale: Das Substantiv bezeichnet ein starkes Begehren oder Verlangen. „Verlangen“ gibt die Intensität natürlich wieder, ohne die negative Färbung von „Begierde“ einzutragen.
- source_word: ἄρα
  choice: also
  rationale: ἄρα kennzeichnet eine Schlussfolgerung aus der vorausgehenden Argumentation. Das nachgestellte „also“ ist im modernen Deutschen natürlich und hält den logischen Zusammenhang ausdrücklich fest.
- source_word: σοφίας
  choice: nach Weisheit
  rationale: σοφία wird standardmäßig mit „Weisheit“ wiedergegeben. Die deutsche Fügung „Verlangen nach Weisheit“ bringt den objektiven Genitiv idiomatisch zum Ausdruck und bewahrt die praktische wie auch theologisch-philosophische Weite des Begriffs.
- source_word: ἀνάγει
  choice: führt
  rationale: Das Verb kann wörtlich „hinaufführen“ oder „hinbringen“ bedeuten. Hier bezeichnet es die Bewegung auf ein Ziel hin; „führt“ bewahrt das Bild in natürlichem Deutsch.
- source_word: ἐπὶ βασιλείαν
  choice: zur Königsherrschaft
  rationale: ἐπί mit Akkusativ bezeichnet nach ἀνάγει die Ausrichtung auf ein Ziel oder einen erlangten Stand. „Königsherrschaft“ passt zum Zusammenhang, in dem es um die Erlangung königlicher Herrschaft geht, ohne βασιλεία auf ein Herrschaftsgebiet zu verengen.
theological_decisions:
- issue: Bedeutung von βασιλεία in diesem weisheitlichen Schlusssatz
  choice: Königsherrschaft
  alternative: Königtum; Königreich; königliche Herrschaft
  rationale: Der Vers schließt eine Gedankenkette über das Streben nach Weisheit und das Erlangen von Herrschaft ab. „Königsherrschaft“ bezeichnet hier am ehesten königlichen Rang und königliches Regieren; da βασιλεία jedoch auch das Königtum oder ein Königreich meinen kann, bleibt diese Bedeutungsbreite in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kurze Folgerungssatz bleibt knapp; „also“ gibt den logischen Anschluss natürlich wieder. Die Mehrdeutigkeit von βασιλεία wird nicht im Haupttext aufgelöst, sondern durch die Fußnote dokumentiert.
