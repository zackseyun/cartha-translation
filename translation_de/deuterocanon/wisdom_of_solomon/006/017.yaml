lexical_decisions:
- source_word: ἀρχὴ
  choice: Anfang
  rationale: Bewahrt das Bild des ersten Ausgangspunkts oder Schritts auf dem Weg zur Weisheit.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet wie im Griechischen die begründende Verbindung mit dem vorausgehenden Gedanken.
- source_word: αὐτῆς
  choice: ihr
  rationale: Bezieht sich auf die im Zusammenhang weiblich personifizierte Weisheit und erhält diese Personifikation.
- source_word: ἡ ἀληθεστάτη
  choice: wahrhaftigster
  rationale: Gibt den Superlativ als den echtesten beziehungsweise wirklichsten Anfang wieder, ohne ihn auf bloße Gewissheit zu verengen.
- source_word: παιδείας
  choice: Unterweisung
  rationale: Bezeichnet hier lebensprägende Anleitung und Belehrung; das Wort kann zugleich Erziehung, Schulung und Zucht einschließen.
- source_word: ἐπιθυμία
  choice: Verlangen
  rationale: Drückt ein deutliches Begehren aus, ohne dessen emotionale Stärke über den griechischen Wortlaut hinaus festzulegen.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Das feminine Pronomen „ihr“ wird beibehalten.
  alternative: Die Weisheit ausdrücklich nennen oder unpersönlich mit „ihr Anfang“ ohne erkennbare Personifikation wiedergeben.
  rationale: Das griechische αὐτῆς verweist im Zusammenhang auf die weiblich personifizierte Weisheit. Die Wiedergabe wahrt die literarisch-theologische Darstellung, ohne sie weiter auszudeuten.
