  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/011.yaml
  text: Therefore desire my words[a]; long for them[b], and you will be instructed.
translation:
  language: de
  text: Verlangt also nach meinen Worten; sehnt euch nach ihnen[a], und ihr werdet unterwiesen werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb ist gefühlsbetonter als das erste und kann auch mit „verlangt innig nach ihnen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Oder „erzogen“ beziehungsweise „zurechtgewiesen werden“; das griechische Verb umfasst Unterweisung und formende Erziehung, mitunter auch Zucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμήσατε
  choice: Verlangt
  rationale: Der Aoristimperativ fordert nachdrücklich zum Begehren auf. „Verlangt nach“ ist im positiven Zusammenhang natürlich und vermeidet die meist negative Färbung von „begehren“.
- source_word: οὖν
  choice: also
  rationale: Das Wort kennzeichnet eine Folgerung aus dem vorausgehenden Gedankengang; „also“ bewahrt diese logische Verbindung in flüssigem Deutsch.
- source_word: τῶν λόγων μου
  choice: nach meinen Worten
  rationale: λόγοι bezeichnet hier zunächst die Äußerungen des Sprechers. „Worte“ bleibt näher am griechischen Ausdruck als das stärker deutende „Lehren“.
- source_word: ποθήσατε
  choice: sehnt euch nach ihnen
  rationale: ποθέω ist gefühlsbetonter als das vorangehende ἐπιθυμέω. „Sich sehnen nach“ gibt diese Steigerung idiomatisch wieder; „ihnen“ nimmt die zuvor genannten Worte auf.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die Aufforderung mit der folgenden Verheißung; der Folgesinn ergibt sich aus dem Futur und muss nicht durch „damit“ festgelegt werden.
- source_word: παιδευθήσεσθε
  choice: ihr werdet unterwiesen werden
  rationale: Das Futur Passiv von παιδεύω kann Unterweisung, Erziehung und Zucht umfassen. Im unmittelbaren Zusammenhang mit den Worten des Sprechers steht die Unterweisung im Vordergrund; die passive Form bleibt erhalten.
theological_decisions:
- issue: Bedeutungsumfang von παιδεύω im Weisheitskontext
  choice: Im Haupttext wird Unterweisung in den Vordergrund gestellt.
  alternative: „ihr werdet erzogen werden“ oder „ihr werdet zurechtgewiesen werden“
  rationale: Die Aufforderung, nach den Worten des Sprechers zu verlangen, legt hier den Schwerpunkt auf Lehre und Bildung. Der weiter reichende Gedanke formender Erziehung oder disziplinierender Zucht wird jedoch nicht ausgeschlossen und in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Imperative und ihre Steigerung werden bewahrt; das Semikolon macht die rhetorische Gliederung sichtbar. Der resultative Zusammenhang bleibt durch „und“ bewusst ebenso offen wie im Griechischen.
