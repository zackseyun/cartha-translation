  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/015.yaml
  text: For a perishable body weighs down the soul[a], and the earthly tent burdens a mind full of cares.
translation:
  language: de
  text: Denn ein vergänglicher Körper beschwert die Seele, und das irdische Zelt belastet den sorgenvollen Verstand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und das aus Erde bestehende Zelt drückt auf den Verstand, der von vielen Gedanken erfüllt ist.«'
    reason: Die zweite Vershälfte lässt bei γεῶδες und πολυφρόντιδα sowohl die Nuancen »irdisch/aus Erde bestehend« als auch »sorgenvoll/von vielen Gedanken erfüllt« zu.
lexical_decisions:
- source_word: φθαρτὸν
  choice: vergänglich
  rationale: Bezeichnet einen Körper, der Verfall und Verderben unterworfen ist; »vergänglich« ist im modernen Deutsch natürlich und eng am griechischen Sinn.
- source_word: σῶμα
  choice: Körper
  rationale: Die übliche und kontextgemäße Bezeichnung für den leiblichen Körper.
- source_word: βαρύνει
  choice: beschwert
  rationale: Bewahrt das Bild des Schwer-Machens und drückt den Druck des Körpers auf die Seele idiomatisch aus.
- source_word: ψυχήν
  choice: Seele
  rationale: Bewahrt im Weisheitskontext die anthropologische Gegenüberstellung von vergänglichem Körper und innerem Leben.
- source_word: βρίθει
  choice: belastet
  rationale: Gibt die Vorstellung von Gewicht und drückender Last natürlich wieder und erhält den Parallelismus zum ersten Satzglied.
- source_word: γεῶδες
  choice: irdisch
  rationale: Gibt die Bedeutung »aus Erde bestehend/der Erde zugehörig« knapp wieder, ohne sie auf bloße Weltlichkeit zu verengen.
- source_word: σκῆνος
  choice: Zelt
  rationale: Erhält die Metapher des Körpers als vorläufiger Behausung; »Wohnung« würde das Bild abschwächen, »Tabernakel« wäre unnötig kirchensprachlich.
- source_word: νοῦν
  choice: Verstand
  rationale: Bezeichnet hier das denkende und vernünftige Vermögen; »Verstand« unterscheidet es klar von ψυχή, ohne den Sinn zu verengen.
- source_word: πολυφρόντιδα
  choice: sorgenvoll
  rationale: Drückt die Beschäftigung mit vielen Sorgen oder Gedanken kompakt aus. Die mögliche Nuance »voll vieler Gedanken« wird in der Fußnote bewahrt.
theological_decisions:
- issue: Anthropologische Unterscheidung zwischen ψυχή und νοῦς neben der Körpermetaphorik
  choice: ψυχή wird mit »Seele« und νοῦς mit »Verstand« wiedergegeben.
  alternative: ψυχή als »Leben« oder »Selbst« und νοῦς als »Sinn«, »Denken« oder »Einsicht« wiedergeben.
  rationale: Die unterschiedlichen griechischen Begriffe sollen nicht zusammengezogen werden. So bleibt die poetische Spannung zwischen Körper, Seele und denkendem Vermögen sichtbar, ohne daraus ein festes anthropologisches System abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die Metapher des Zeltes bleiben erhalten. »Sorgenvoll« ist verständlich und knapp; die breitere gedankliche Nuance wird durch die Fußnote sichtbar gemacht.
