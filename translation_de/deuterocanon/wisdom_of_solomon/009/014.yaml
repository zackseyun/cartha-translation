translation:
  language: de
  text: Denn die Überlegungen der Sterblichen sind zaghaft, und unsere Gedanken sind unsicher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμοὶ
  choice: Überlegungen
  rationale: Das Substantiv bezeichnet Vorgänge des Nachdenkens, Abwägens oder Schlussfolgerns. „Überlegungen“ gibt diesen Prozess wieder und bleibt gegenüber ἐπίνοιαι („Gedanken“) unterscheidbar.
- source_word: θνητῶν
  choice: der Sterblichen
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Hinweis auf die dem Tod unterworfene menschliche Existenz und ist nicht geschlechtsspezifisch.
- source_word: δειλοί
  choice: zaghaft
  rationale: Das Adjektiv kann „furchtsam“, „mutlos“ oder „feige“ bedeuten. Im Zusammenhang beschreibt es die begrenzte, wenig verlässliche Kraft menschlicher Überlegungen; „zaghaft“ wahrt diese Nuance, ohne vorschnell moralische Feigheit zu unterstellen.
- source_word: ἐπισφαλεῖς
  choice: unsicher
  rationale: Das Wort bezeichnet etwas Instabiles, Gefährdetes oder Unzuverlässiges. „Unsicher“ ist im Deutschen natürlich und lässt sowohl mangelnde Gewissheit als auch mangelnde Verlässlichkeit anklingen.
- source_word: ἐπίνοιαι
  choice: Gedanken
  rationale: Der Begriff kann Gedanken, Einfälle, Entwürfe oder Pläne bezeichnen. „Gedanken“ passt zum allgemeinen anthropologischen Aussagezusammenhang und vermeidet eine Gleichsetzung mit λογισμοί.
- source_word: ἡμῶν
  choice: unsere
  rationale: Der Sprecher schließt sich ausdrücklich in die allgemeinmenschliche Begrenztheit ein; das Possessivpronomen gibt dies unmittelbar wieder.
theological_decisions:
- issue: Anthropologische Aussage von θνητῶν
  choice: der Sterblichen
  alternative: der Menschen
  rationale: „Der Sterblichen“ erhält den im Griechischen hervorgehobenen Zusammenhang zwischen menschlicher Begrenztheit und Sterblichkeit, ohne eine geschlechtliche Einschränkung einzuführen.
- issue: Bewertung menschlichen Denkens durch δειλοί
  choice: zaghaft
  alternative: feige
  rationale: „Zaghaft“ wahrt die Spannung zwischen Furchtsamkeit, Schwäche und begrenzter Erkenntniskraft. „Feige“ würde die Aussage stärker als moralischen Tadel festlegen, als es der Zusammenhang verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die Unterscheidung zwischen „Überlegungen“ und „Gedanken“ spiegeln die beiden griechischen Begriffe wider; auf erklärende Zusätze wurde verzichtet.
