  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/005.yaml
  text: for I am your servant and the son of your female servant[a], a weak man and short-lived, and lacking in understanding of judgment and laws[b];
translation:
  language: de
  text: Denn ich bin dein Sklave und der Sohn deiner Sklavin[a], ein schwacher und kurzlebiger Mensch, dem es an Verständnis für Rechtsprechung und Gesetze fehlt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Diener und der Sohn deiner Magd“. Die griechischen Wörter bezeichnen eine unfreie, gesellschaftlich untergeordnete Stellung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „geringer an Verständnis für Urteil und Gesetze“; gemeint sein kann unzureichende Einsicht zum Richten und zum Regieren nach den Gesetzen.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: Das Wort bezeichnet einen Menschen in unfreier, untergeordneter Stellung. „Sklave“ bewahrt in diesem Demutsgebet die soziale Schärfe des griechischen Ausdrucks.
- source_word: υἱὸς τῆς παιδίσκης σου
  choice: der Sohn deiner Sklavin
  rationale: παιδίσκη bezeichnet hier eine Sklavin beziehungsweise unfreie Dienerin. „Sklavin“ erhält die Parallele zu δοῦλος und die Demutsformel.
- source_word: ἄνθρωπος ἀσθενὴς
  choice: ein schwacher Mensch
  rationale: ἄνθρωπος bezeichnet den Sprecher als sterblichen Menschen; ἀσθενής hebt seine Schwäche und begrenzte Befähigung hervor.
- source_word: ὀλιγόχρονιος
  choice: kurzlebig
  rationale: Das Kompositum bezeichnet jemanden, dessen Lebenszeit kurz ist. „Kurzlebig“ gibt dies knapp und idiomatisch wieder.
- source_word: ἐλάσσων ἐν συνέσει
  choice: dem es an Verständnis fehlt
  rationale: Die wörtlich vergleichende Form „geringer an Verständnis“ bezeichnet hier unzureichende Einsicht. Die deutsche Formulierung ist natürlich, ohne die Aussage unnötig zu verstärken.
- source_word: κρίσεως
  choice: Rechtsprechung
  rationale: Im Zusammenhang königlichen Urteilens bezeichnet κρίσις das Urteilen beziehungsweise die Rechtsprechung. Diese Wiedergabe macht den amtlich-rechtlichen Bezug deutlich, ohne den Begriff auf abstrakte Gerechtigkeit festzulegen.
- source_word: νόμων
  choice: Gesetze
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Plural und den rechtlichen Bezugsrahmen.
theological_decisions:
- issue: Unfreie Statussprache im Demutsgebet
  choice: „Sklave“ und „Sklavin“ im Haupttext
  alternative: „Diener“ und „Magd“
  rationale: Die direkten Statusbegriffe bewahren die Selbsterniedrigung des Sprechers vor Gott und mildern die soziale Unterordnung des griechischen Wortlauts nicht ab.
- issue: Bedeutung von κρίσις im Verhältnis zu νόμοι
  choice: „Rechtsprechung und Gesetze“
  alternative: „Urteil und Gesetze“ oder „Recht und Gesetze“
  rationale: Der Kontext legt die Fähigkeit zum richterlichen und königlichen Entscheiden nahe. Zugleich wird durch eine Fußnote offengehalten, dass κρίσις allgemeiner als „Urteil“ verstanden werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber für natürliche deutsche Lesbarkeit leicht geglättet. Die Statussprache bleibt bewusst direkt; die schwierige Verbindung ἐλάσσων ἐν συνέσει κρίσεως καὶ νόμων wird im Haupttext verständlich formuliert und in der Fußnote transparenter wiedergegeben.
