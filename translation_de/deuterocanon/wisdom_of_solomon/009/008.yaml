base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/008.yaml
  text: You said to build a temple on your holy mountain[a], and an altar in the city of your dwelling, an imitation of the holy tent that you prepared from the beginning.
translation:
  language: de
  text: Du hast gesagt, man solle auf deinem heiligen Berg einen Tempel bauen und in der Stadt, in der du wohnst, einen Altar – ein Abbild des heiligen Zeltes[a], das du von Anfang an bereitet hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der heiligen Stiftshütte«. Das griechische Wort kann »Zelt« bedeuten und im biblischen Sprachgebrauch das heilige Zelt, die Stiftshütte, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπας οἰκοδομῆσαι
  choice: Du hast gesagt, man solle … bauen
  rationale: Gibt λέγω als »sagen« wieder, ohne die stärkere Bedeutung »befehlen« in den Wortlaut einzutragen; der deutsche Konjunktiv macht den abhängigen Infinitiv natürlich verständlich.
- source_word: ναὸν
  choice: einen Tempel
  rationale: ναός bezeichnet hier den Tempel beziehungsweise das Heiligtum; »Tempel« ist im Kontext Jerusalems klar und allgemein verständlich.
- source_word: ἐν ὄρει ἁγίῳ σου
  choice: auf deinem heiligen Berg
  rationale: Für einen Standort am Berg ist deutsches »auf« idiomatisch; »Berg« entspricht ὄρος.
- source_word: ἐν πόλει κατασκηνώσεώς σου
  choice: in der Stadt, in der du wohnst
  rationale: Gibt die substantivische Wendung mit κατασκήνωσις in natürlichem Deutsch wieder und bewahrt den Gedanken der dortigen Gegenwart Gottes.
- source_word: θυσιαστήριον
  choice: einen Altar
  rationale: Die übliche und sachlich genaue Wiedergabe des kultischen Opferaltars.
- source_word: μίμημα
  choice: ein Abbild
  rationale: »Abbild« bezeichnet etwas, das nach einem Vorbild gestaltet ist, und klingt im Deutschen natürlicher als »Nachahmung«, ohne die Beziehung dogmatisch als bloße materielle Kopie festzulegen.
- source_word: σκηνῆς ἁγίας
  choice: des heiligen Zeltes
  rationale: σκηνή bedeutet wörtlich »Zelt« und bezeichnet im biblischen Sprachgebrauch auch das heilige Zelt beziehungsweise die Stiftshütte.
- source_word: ἣν προητοίμασας ἀπʼ ἀρχῆς
  choice: das du von Anfang an bereitet hast
  rationale: »Bereitet« wahrt den gehobenen, aber verständlichen Ton; »von Anfang an« bringt zusammen mit dem Verb die vorherige Bereitung zum Ausdruck.
theological_decisions:
- issue: Verhältnis des irdischen Heiligtums zum zuvor bereiteten heiligen Zelt
  choice: ein Abbild des heiligen Zeltes
  alternative: eine Nachahmung / eine Kopie der heiligen Stiftshütte
  rationale: »Abbild« bewahrt die im griechischen μίμημα ausgesagte Entsprechung zu einem Vorbild, ohne eine weiter ausgearbeitete Lehre über ein himmlisches Urbild in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion »Du hast gesagt, man solle …« hält sich eng an εἶπας mit Infinitiv und vermeidet, das schlichte »sagen« ohne textlichen Zwang zu »befehlen« zu verstärken.
