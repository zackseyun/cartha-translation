  source_fidelity: 'Der Text gibt die Satzstruktur und die wesentlichen Begriffe des Griechischen zuverlässig wieder: εἶπας οἰκοδομῆσαι als „Du hast gesagt, man solle … bauen“, ναός als „Tempel“, ὄρος als „Berg“, θυσιαστήριον als „Altar“, μίμημα als „Abbild“ und σκηνή als „Zelt“. Die Apposition „ein Abbild des heiligen Zeltes“ macht angemessen deutlich, dass der Altar als Entsprechung zu dem zuvor bereiteten heiligen Zelt beschrieben wird. „von Anfang an bereitet“ gibt προητοίμασας ἀπʼ ἀρχῆς idiomatisch und ohne unzulässige dogmatische Zuspitzung wieder.'
