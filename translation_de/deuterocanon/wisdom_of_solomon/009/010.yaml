  text: Send her out from the holy heavens[a], and send her from the throne of your glory, so that, being present with me, she may labor with me[c][b], and I may know what is pleasing to you.
translation:
  language: de
  text: Sende sie aus den heiligen Himmeln aus, und schicke sie vom Thron deiner Herrlichkeit, damit sie bei mir sei und sich mit mir abmühe und ich erkenne, was dir gefällt.[a]
  philosophy: optimal-equivalence
