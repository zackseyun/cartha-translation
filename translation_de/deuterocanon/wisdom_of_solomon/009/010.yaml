lexical_decisions:
- source_word: ἐξαπόστειλον αὐτὴν ἐξ ἁγίων οὐρανῶν
  choice: Sende sie aus den heiligen Himmeln herab
  rationale: „Sende … herab“ gibt die Bewegung vom himmlischen Bereich zum Betenden natürlich wieder; der Plural „Himmel“ und ihre Bezeichnung als heilig bleiben erhalten.
- source_word: ἀπὸ θρόνου δόξης σου πέμψον αὐτήν
  choice: schicke sie vom Thron deiner Herrlichkeit
  rationale: Die Genitivfügung „Thron deiner Herrlichkeit“ bewahrt die gehobene Ausdrucksweise und bleibt näher am Griechischen als „dein herrlicher Thron“.
- source_word: συνπαροῦσά μοι
  choice: damit sie bei mir sei
  rationale: Die Form bezeichnet das gemeinsame Anwesendsein. „Bei mir sei“ ist im Deutschen knapp und wahrt diese Bedeutung, ohne zusätzliche Vorstellungen wie Führung oder Beistand einzutragen.
- source_word: κοπιάσῃ
  choice: sich mit mir abmühe
  rationale: Das Verb bezeichnet mühevolle Arbeit. Die Wendung bewahrt den kräftigen Ausdruck und macht deutlich, dass die personifizierte Weisheit an der Mühe des Betenden teilhat.
- source_word: γνῶ
  choice: ich erkenne
  rationale: „Erkennen“ gibt den Erkenntnisvorgang in der gehobenen Gebetssprache prägnant wieder.
- source_word: τί εὐάρεστόν ἐστιν παρὰ σοί
  choice: was dir gefällt
  rationale: Diese Formulierung gibt den Sinn von εὐάρεστον und παρὰ σοί in natürlichem modernem Deutsch wieder; die wörtlichere räumlich-relationale Ausdrucksweise wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Personifikation der Weisheit als weibliche Gestalt, die aus dem Himmel gesandt wird
  choice: Die weiblichen Pronomen „sie“ werden beibehalten.
  alternative: Weisheit als unpersönliches Abstraktum wiedergeben oder das Substantiv „Weisheit“ wiederholen.
  rationale: Die griechischen weiblichen Formen αὐτήν und συνπαροῦσα führen die Weisheit als personifizierte weibliche Gestalt fort. Die Übersetzung bewahrt dieses Bild, ohne es mit einer späteren theologischen Identifikation gleichzusetzen.
- issue: Gemeinsames Mühen der Weisheit mit dem Betenden
  choice: „sich mit mir abmühe“
  alternative: „mit mir arbeite“
  rationale: Die stärkere Formulierung erhält die Spannung der Aussage, dass die von Gott gesandte Weisheit an der Mühe des Menschen teilhat, ohne die Art dieses Zusammenwirkens dogmatisch zu bestimmen.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Der Parallelismus der beiden Sendebitten, der Plural „Himmel“, die feminine Personifikation der Weisheit und der kräftige Ausdruck für mühevolle gemeinsame Arbeit bleiben erhalten.
