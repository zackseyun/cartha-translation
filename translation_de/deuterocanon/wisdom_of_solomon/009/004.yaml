  text: Give me the wisdom that sits beside your thrones, and do not reject me from among your children.
translation:
  language: de
  text: Gib mir die Weisheit, die neben deinen Thronen sitzt,[a] und verwirf mich nicht aus der Zahl deiner Kinder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die neben deinem Thron sitzt“. Im Griechischen steht „Thronen“ im Plural.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus der Zahl deiner Diener“. Das griechische Wort kann je nach Zusammenhang „Kinder“ oder „Diener“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: δός
  choice: Gib
  rationale: Der schlichte Imperativ gibt δίδωμι direkt, natürlich und ohne unnötige Anhebung des Registers wieder.
- source_word: πάρεδρον
  choice: die neben … sitzt
  rationale: πάρεδρος bezeichnet jemanden, der neben einem anderen sitzt, etwa als Beisitzende oder Gefährtin. Die verbale Wiedergabe bewahrt das räumliche Thronbild und die Personifikation der Weisheit.
- source_word: σοφίαν
  choice: die Weisheit
  rationale: σοφία ist das direkte Objekt und wird hier personifiziert. Der bestimmte Artikel ergibt sich im Deutschen natürlich aus dem folgenden Relativsatz.
- source_word: τῶν σῶν θρόνων
  choice: deinen Thronen
  rationale: Die griechische Form θρόνων steht im Plural. Dieser wird trotz seiner Auffälligkeit bewahrt, damit eine mögliche Majestäts- oder himmlische Hofvorstellung nicht stillschweigend auf einen Singular festgelegt wird.
- source_word: ἀποδοκιμάσῃς
  choice: verwirf
  rationale: Das Verb bezeichnet Ablehnung nach Prüfung oder Beurteilung. „Verwirf“ ist im Gebetskontext prägnant und würdig; „disqualifiziere“ wäre zu technisch.
- source_word: ἐκ παίδων σου
  choice: aus der Zahl deiner Kinder
  rationale: ἐκ verlangt eine Vorstellung des Aussonderns aus einer Gruppe. „Aus der Zahl“ ist im Deutschen verständlich und erhält diese Beziehung; παῖδες wird im Haupttext als „Kinder“ wiedergegeben, ohne die mögliche Bedeutung „Diener“ zu verschweigen.
theological_decisions:
- issue: Bedeutung von παῖδες im Verhältnis zu Gott
  choice: Kinder
  alternative: Diener
  rationale: παῖς kann sowohl „Kind“ als auch „Diener“ bedeuten. Im Gebetszusammenhang ist „Kinder“ gut möglich und bewahrt die familiäre Nuance; die echte lexikalische Mehrdeutigkeit wird in einer Fußnote offengehalten.
- issue: Plural θρόνων in der Rede von Gottes Thron
  choice: Thronen
  alternative: Thron
  rationale: Obwohl der Singular im Deutschen erwartbarer wäre, steht im überlieferten griechischen Text der Plural. Die Übersetzung normalisiert ihn nicht und löst die mögliche Bildsprache nicht dogmatisch auf.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die personifizierte Weisheit und das räumliche Bild des Sitzens neben den Thronen bleiben erhalten; ungewöhnliche oder mehrdeutige Züge des Griechischen werden nicht eingeebnet.
