  text: For she knows all things and understands[a], and she will guide me prudently in my actions, and will guard me by her glory.
translation:
  language: de
  text: Denn sie weiß alles und versteht es; sie wird mich in meinem Handeln mit Besonnenheit leiten und mich durch ihre Herrlichkeit[a] beschützen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihrer Herrlichkeit“. Die griechische Wendung kann den Bereich oder das Mittel bezeichnen.'
    reason: Bewahrung der syntaktischen Mehrdeutigkeit von ἐν mit dem Dativ.
lexical_decisions:
- source_word: οἶδε
  choice: weiß
  rationale: Das geläufige Verb für Wissen bleibt vom folgenden συνίει unterschieden.
- source_word: ἐκείνη
  choice: sie
  rationale: Das feminine Pronomen verweist auf die personifizierte Weisheit; „sie“ bewahrt diese Personifikation natürlich.
- source_word: πάντα
  choice: alles
  rationale: Die umfassende Bedeutung des substantivisch gebrauchten Neutrums wird im modernen Deutsch knapp und vollständig wiedergegeben.
- source_word: συνίει
  choice: versteht es
  rationale: „Versteht“ wahrt den Unterschied zu οἶδε; das ergänzte „es“ macht den deutschen Satz idiomatisch, ohne den Bezug auf „alles“ zu verändern.
- source_word: ὁδηγήσει
  choice: wird … leiten
  rationale: Das Verb bezeichnet Führung oder Leitung und passt hier zu den praktischen Handlungen des Betenden.
- source_word: ἐν ταῖς πράξεσί μου
  choice: bei meinen Taten
  rationale: πράξεις bezeichnet konkrete Handlungen bzw. das praktische Tun; „bei meinen Taten“ ist natürlich und erhält den ethischen Bezug.
- source_word: σωφρόνως
  choice: mit Besonnenheit
  rationale: Die Wendung umfasst vernünftiges, maßvolles und umsichtiges Handeln und gibt die σωφρον-Wortgruppe breiter wieder als bloß „klug“.
- source_word: φυλάξει
  choice: wird … beschützen
  rationale: Das Verb bezeichnet schützendes Bewahren; „beschützen“ bringt diese Funktion im heutigen Deutsch klar zum Ausdruck.
- source_word: ἐν τῇ δόξῃ αὐτῆς
  choice: durch ihre Herrlichkeit
  rationale: Die instrumentale Deutung von ἐν ist im Zusammenhang gut möglich; die ebenfalls mögliche lokale Deutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von ἐν τῇ δόξῃ αὐτῆς
  choice: 'instrumental: „durch ihre Herrlichkeit“'
  alternative: 'lokal: „in ihrer Herrlichkeit“; auch „mittels ihrer Herrlichkeit“'
  rationale: ἐν kann hier sowohl den Bereich als auch das Mittel des Schutzes bezeichnen. Der Haupttext folgt der im Kontext plausiblen instrumentalen Lesart, ohne die echte Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Personifikation der Weisheit bleibt erhalten. Der Satzbau folgt dem Griechischen hinreichend eng, klingt aber natürlich; das Semikolon gliedert Erkenntnis und künftiges Wirken.
