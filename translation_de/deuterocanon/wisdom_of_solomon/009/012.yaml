  text: and my works will be acceptable, and I will judge your people justly, and I will be worthy of my father's thrones.
translation:
  language: de
  text: Meine Werke werden wohlgefällig sein, und ich werde dein Volk gerecht richten und der Throne[a] meines Vaters würdig sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Throne meines Vaters“; der griechische Text verwendet hier den Plural.'
    reason: Der im Deutschen ungewöhnliche Plural ist textlich bedeutsam und soll weder verborgen noch ohne Hinweis normalisiert werden.
lexical_decisions:
- source_word: προσδεκτά
  choice: wohlgefällig
  rationale: Gibt die Bedeutung „annehmbar, willkommen, wohlgefällig“ in einem würdigen religiösen Register wieder, ohne einen ausdrücklich genannten Empfänger hinzuzufügen.
- source_word: διακρινῶ
  choice: ich werde … richten
  rationale: Im Zusammenhang mit dem Regieren des Volkes bezeichnet das Verb gerechtes Urteilen beziehungsweise Rechtsprechen.
- source_word: δικαίως
  choice: gerecht
  rationale: Natürliche adverbiale Wiedergabe des griechischen Ausdrucks.
- source_word: θρόνων
  choice: der Throne
  rationale: Bewahrt bewusst den im überlieferten griechischen Text stehenden Plural.
theological_decisions:
- issue: Plural „Throne“ in der Aussage über den Vater
  choice: der Throne meines Vaters
  alternative: des Thrones meines Vaters
  rationale: Der griechische Ausgangstext hat eindeutig den Genitiv Plural θρόνων. Die ungewöhnliche Formulierung wird nicht stillschweigend zum Singular geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wohlgefällig“ bewahrt den religiös-literarischen Ton; Satzbau und Zukunftsformen bleiben nah am griechischen Text.
