  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/017.yaml
  text: And who has known your counsel[a], unless you have given wisdom and sent your holy Spirit from on high?
translation:
  language: de
  text: Und wer hat deinen Ratschluss erkannt, wenn nicht du Weisheit gegeben und deinen heiligen Geist[a] aus den Höhen gesandt hast?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Heiligen Geist“. Der griechische Wortlaut lautet wörtlich „deinen heiligen Geist“; die Großschreibung als fester Titel beruht auf der Auslegung, nicht auf einem Unterschied im griechischen Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλήν
  choice: Ratschluss
  rationale: „Ratschluss“ gibt βουλή als Gottes überlegten Rat, Vorsatz oder Plan wieder, ohne den Sinn einseitig auf bloßen Willen oder einen festgelegten Plan zu verengen.
- source_word: ἔγνω
  choice: hat erkannt
  rationale: Das Aoristverb wird in der rhetorischen Frage idiomatisch mit dem deutschen Perfekt wiedergegeben. „Erkannt“ umfasst das Erlangen wirklicher Einsicht und geht hier über bloßes Faktenwissen hinaus.
- source_word: σοφίαν
  choice: Weisheit
  rationale: Dies ist die etablierte und kontextgemäße Wiedergabe von σοφία und bewahrt sowohl die geistige als auch die sittlich-theologische Bedeutung.
- source_word: τὸ ἅγιόν σου πνεῦμα
  choice: deinen heiligen Geist
  rationale: πνεῦμα kann „Geist“, „Wind“ oder „Hauch“ bedeuten; im weisheitstheologischen Zusammenhang ist „Geist“ die natürliche Wiedergabe. Die Kleinschreibung des Adjektivs entspricht der deutschen Orthografie und entscheidet nicht, ob die Wendung als Personenbezeichnung verstanden wird.
- source_word: ἀπὸ ὑψίστων
  choice: aus den Höhen
  rationale: Die substantivierte Pluralform bezeichnet die himmlischen Höhen. „Aus den Höhen“ bewahrt sowohl den Plural als auch das erhabene räumliche Bild des griechischen Textes.
theological_decisions:
- issue: Ob „deinen heiligen Geist“ ausdrücklich als Titel einer eigenen göttlichen Person markiert werden soll
  choice: deinen heiligen Geist
  alternative: deinen Heiligen Geist
  rationale: Der griechische Text unterscheidet nicht durch Großschreibung. Die reguläre deutsche Schreibung „deinen heiligen Geist“ bewahrt die heilige und göttliche Zuordnung, ohne eine spätere dogmatische Titelform typografisch vorwegzunehmen. Die alternative Lesart wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die parallele Verbstruktur bleiben erhalten. „Ratschluss“ und „aus den Höhen“ bewahren die gehobene weisheitliche Sprache, sind aber für heutige Leser verständlich.
