  source_fidelity: Die Übersetzung bildet die rhetorische Frage und die Abhängigkeit menschlicher Erkenntnis von Gottes Gabe zuverlässig ab. „Ratschluss“ ist für βουλήν tragfähig; „hat erkannt“, „Weisheit“ sowie die beiden aoristischen Handlungen sind angemessen wiedergegeben. „Aus den Höhen“ gibt ἀπὸ ὑψίστων als himmlische Höhen im Plural sachgerecht wieder.
