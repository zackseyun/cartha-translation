  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/018.yaml
  text: and so the paths of those on earth were set straight[a], and men were taught the things pleasing to you,
translation:
  language: de
  text: Und so wurden die Pfade derer, die auf der Erde leben, gerade gemacht[a], und die Menschen wurden gelehrt, was dir gefällt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: berichtigt; auch: richtig ausgerichtet.'
    reason: Das griechische Verb kann sowohl das bildhafte Gerademachen eines Pfades als auch ein Berichtigen oder Richtigstellen ausdrücken.
lexical_decisions:
- source_word: διωρθώθησαν
  choice: wurden … gerade gemacht
  rationale: Das Passiv bezeichnet ein Gerademachen, Richtigstellen oder Berichtigen. In Verbindung mit „Pfade“ bewahrt „gerade gemacht“ das konkrete Bild und zugleich dessen übertragene Bedeutung.
- source_word: τρίβοι
  choice: Pfade
  rationale: Das Wort bezeichnet wörtlich gebahnte Pfade oder Wege. „Pfade“ erhält das anschauliche Wegmotiv der Weisheitsliteratur.
- source_word: τῶν ἐπὶ γῆς
  choice: derer, die auf der Erde leben
  rationale: Die substantivische Wendung meint allgemein die auf der Erde befindlichen Menschen. Die Ergänzung „leben“ macht dies im Deutschen natürlich verständlich, ohne den Bezug einzuengen.
- source_word: τὰ ἀρεστά σου
  choice: was dir gefällt
  rationale: Das substantivierte sächliche Pluraladjektiv bezeichnet die Dinge, die Gott wohlgefällig sind. Die idiomatische deutsche Wendung „was dir gefällt“ gibt den Sinn klar wieder, auch wenn Deutsch dabei keinen formalen Plural verwendet.
- source_word: ἐδιδάχθησαν
  choice: wurden gelehrt
  rationale: Die passive Form besagt, dass den Menschen Unterweisung zuteilwurde. „Wurden gelehrt“ bildet diese Struktur unmittelbar ab.
- source_word: ἄνθρωποι
  choice: die Menschen
  rationale: Ἄνθρωποι bezeichnet hier Menschen allgemein. „Die Menschen“ ist im modernen Deutschen präzise, natürlich und ausdrücklich auf die gesamte Menschheit bezogen.
theological_decisions:
- issue: Allgemeiner Bezug von ἄνθρωποι
  choice: die Menschen
  alternative: die Männer
  rationale: Obwohl die griechische Form grammatisch maskulin ist, bezeichnet ἄνθρωποι hier Menschen beiderlei Geschlechts. Das deutsche „Menschen“ bewahrt diesen generischen Sinn, ohne eine ausschließlich männliche Gruppe nahezulegen.
- issue: Bildhafte oder abstrakte Wiedergabe von διωρθώθησαν
  choice: Pfade … gerade gemacht
  alternative: Wege … berichtigt
  rationale: Die bildhafte Fassung erhält die Verbindung zwischen dem Verb des Gerademachens und den konkreten „Pfaden“. Sie lässt sowohl praktische Führung als auch moralische Ausrichtung anklingen, ohne die Aussage auf eine einzelne theologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem Wegbild. „Auf der Erde leben“ ist natürlicher als das knappe „auf Erden sind“; „was dir gefällt“ vermeidet eine schwerfällige substantivische Konstruktion.
