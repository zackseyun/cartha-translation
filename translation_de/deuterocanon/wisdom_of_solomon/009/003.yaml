  terminology: „Heiligkeit“ und „Gerechtigkeit“ bewahren die zwei griechischen Begriffe getrennt. „Aufrichtige Seele“ hält ψυχή als „Seele“ und εὐθύτης als moralische Geradheit/Aufrichtigkeit fest. Es bestehen keine problematischen Namens- oder theologisch vorentscheidenden Termini.
