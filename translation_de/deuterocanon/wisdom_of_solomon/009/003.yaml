  text: and govern the world in holiness and righteousness, and judge with uprightness of soul.
translation:
  language: de
  text: und die Welt in Heiligkeit und Gerechtigkeit regiere und mit aufrichtiger Seele Recht spreche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέπῃ
  choice: regiere
  rationale: Das Verb bezeichnet hier das ordnende und leitende Verwalten der Welt; „regieren“ gibt dies im Gebetszusammenhang natürlich und würdig wieder.
- source_word: ἐν ὁσιότητι καὶ δικαιοσύνῃ
  choice: in Heiligkeit und Gerechtigkeit
  rationale: 'Die beiden ethischen Begriffe werden formal unterschieden bewahrt: ὁσιότης als Heiligkeit beziehungsweise fromme Rechtschaffenheit, δικαιοσύνη als Gerechtigkeit.'
- source_word: ἐν εὐθύτητι ψυχῆς
  choice: mit aufrichtiger Seele
  rationale: εὐθύτης bezeichnet Geradheit beziehungsweise Aufrichtigkeit; ψυχή meint hier die innere Person oder Gesinnung. Die Formulierung bleibt nah am griechischen Bild und ist im Deutschen verständlich.
- source_word: κρίσιν κρίνῃ
  choice: Recht spreche
  rationale: Die figura etymologica bedeutet wörtlich „ein Urteil urteilen“. „Recht sprechen“ bildet den richterlichen Sinn idiomatisch ab, ohne die Aussage durch „gerecht“ zusätzlich auszulegen.
theological_decisions:
- issue: Verhältnis von Heiligkeit und Gerechtigkeit
  choice: Beide Begriffe bleiben eigenständig erhalten.
  alternative: Zusammenfassung als „heilig und gerecht“ oder „in rechtschaffener Frömmigkeit“
  rationale: Der griechische Text nennt ὁσιότης und δικαιοσύνη ausdrücklich nebeneinander; eine Zusammenfassung würde ihre mögliche begriffliche Spannung einebnen.
- issue: Innere Haltung beim Richten
  choice: „mit aufrichtiger Seele“
  alternative: „mit redlichem Herzen“ oder „in Lauterkeit des Herzens“
  rationale: Die Übersetzung bewahrt ψυχή als „Seele“ und vermeidet, den anthropologischen Ausdruck stillschweigend in „Herz“ umzudeuten.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Der Konjunktiv „regiere“ und „spreche“ fügt sich in den abhängigen Wunschsatz des unmittelbaren Kontexts ein; der Vers beginnt entsprechend kleingeschrieben mit „und“.
