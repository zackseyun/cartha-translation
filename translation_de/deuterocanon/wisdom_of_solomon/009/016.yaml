  text: And we can scarcely guess the things on earth[a], and we find the things at hand with labor[b]; but who has traced out the things in the heavens?
translation:
  language: de
  text: Und kaum erschließen wir, was auf der Erde ist, und mit Mühe finden wir heraus, was greifbar ist[a]; wer aber hat ergründet, was in den Himmeln ist?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was unmittelbar vor uns liegt“. Wörtlich: „was in den Händen ist“; die griechische Wendung kann das Naheliegende oder leicht Zugängliche meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vollständig ausgeforscht“. Das griechische Verb bezeichnet ein gründliches Nachforschen, ursprünglich das Verfolgen einer Spur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: kaum
  rationale: Gibt die große Schwierigkeit bis hin zur Beinahe-Unfähigkeit knapp und dem würdevollen Ton entsprechend wieder.
- source_word: εἰκάζομεν
  choice: erschließen wir
  rationale: Bezeichnet ein vermutendes Folgern ohne sichere Erkenntnis. „Erschließen“ klingt im Deutschen natürlicher und weniger beiläufig als „erraten“, ohne Gewissheit zu behaupten.
- source_word: τὰ ἐπὶ γῆς
  choice: was auf der Erde ist
  rationale: Bewahrt den konkreten Gegensatz zu dem, was in den Himmeln ist, und vermeidet eine unnötige Abstraktion zu „irdischen Dingen“.
- source_word: τὰ ἐν χερσὶν
  choice: was in unseren Händen liegt
  rationale: Bewahrt das griechische Bild und kann zugleich das unmittelbar Vorliegende oder Zugängliche bezeichnen. „Unseren“ ist für die allgemeine menschliche Aussage idiomatisch ergänzt.
- source_word: εὑρίσκομεν μετὰ πόνου
  choice: nur mit Mühe finden wir heraus
  rationale: „Mit Mühe“ gibt Anstrengung und Beschwernis von πόνος wieder; „herausfinden“ bezeichnet hier das Erlangen von Erkenntnis natürlicher als das bloße „finden“.
- source_word: τὰ ἐν οὐρανοῖς
  choice: was in den Himmeln ist
  rationale: Erhält den griechischen Plural und den räumlich-kosmologischen Gegensatz zur Erde.
- source_word: τίς ἐξιχνίασεν
  choice: wer hat ergründet
  rationale: „Ergründen“ vermittelt die gründliche, bis auf den Grund gehende Untersuchung des Verbs und ist in der rhetorischen Frage idiomatisch.
theological_decisions:
- issue: Menschliche Erkenntnisgrenze gegenüber himmlischen Wirklichkeiten
  choice: Die rhetorische Gegenüberstellung von mühsam erschließbaren irdischen und unergründeten himmlischen Dingen bleibt bestehen.
  alternative: Die himmlischen Dinge ausdrücklich als Gottes Ratschluss oder als göttliche Geheimnisse zu bezeichnen.
  rationale: Der griechische Vers nennt weder Gottes Ratschluss noch Geheimnisse ausdrücklich. Diese Deutung wird daher nicht vorweggenommen; die theologische Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. Das Handbild und der Plural „Himmel“ werden bewahrt; zugleich bleibt die Aussage für heutige Leser verständlich.
