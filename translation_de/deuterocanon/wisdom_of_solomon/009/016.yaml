  rationale: Die Revision entfernt die nicht ausdrücklich im Griechischen enthaltene Verstärkung „nur“ und ersetzt die im Deutschen potenziell missverständliche Formulierung „in unseren Händen liegt“ durch „greifbar ist“. Der Parallelismus, die rhetorische Frage, die kosmologische Gegenüberstellung und die epistemische Zurückhaltung des Ausgangstextes bleiben erhalten.
