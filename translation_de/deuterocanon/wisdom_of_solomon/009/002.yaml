lexical_decisions:
- source_word: τῇ σοφίᾳ σου
  choice: durch deine Weisheit
  rationale: Der Dativ bezeichnet hier das Mittel, durch das Gott schafft. „Weisheit“ bewahrt zugleich das theologische und literarische Gewicht des Begriffs im Buch der Weisheit.
- source_word: κατεσκεύασας
  choice: hast du … geschaffen
  rationale: Das Verb kann „bereiten“, „gestalten“ oder „schaffen“ bedeuten. Im Schöpfungszusammenhang ist „geschaffen“ natürlich und würdig, ohne einen handwerklich-mechanischen Nebenton aufzudrängen.
- source_word: ἄνθρωπον
  choice: den Menschen
  rationale: Der griechische Singular bezeichnet in der Schöpfungssprache den Menschen als repräsentative Gestalt und kann damit zugleich auf die Menschheit bezogen sein. Das deutsche „den Menschen“ erhält Singular und umfassenden Sinn.
- source_word: ἵνα δεσπόζῃ
  choice: damit er … herrscht
  rationale: Die ἵνα-Konstruktion drückt den Zweck aus; δεσπόζω bezeichnet die Ausübung von Herrschaft oder Verfügungsgewalt. „Herrscht“ gibt diesen starken Sinn in geläufigem Deutsch wieder.
- source_word: τῶν … κτισμάτων
  choice: über die Geschöpfe
  rationale: κτίσματα sind geschaffene Wesen oder Dinge. „Geschöpfe“ ist im Schöpfungszusammenhang prägnant und idiomatisch.
- source_word: ὑπὸ σοῦ γενομένων
  choice: die durch dich ins Dasein gekommen sind
  rationale: Die Relativformulierung erhält die Nuance von γίνομαι („werden“, „ins Dasein kommen“) und gibt zugleich Gott als Ursprung an, ohne den Ausdruck lediglich durch ein zweites „geschaffen“ zu ersetzen.
theological_decisions:
- issue: Repräsentativer Sinn von ἄνθρωπον in der Schöpfungssprache
  choice: den Menschen
  alternative: die Menschheit; ein menschliches Wesen
  rationale: Der Singular bleibt erhalten, während „der Mensch“ im Deutschen natürlich als Bezeichnung der Menschheit verstanden werden kann. So wird der Text weder auf einen einzelnen Mann verengt noch in ein abstraktes Kollektiv umgeformt.
- issue: Stärke von δεσπόζῃ im Verhältnis zum Schöpfungsauftrag
  choice: damit er über … herrscht
  alternative: damit er Herr sei über; damit er über … gebietet
  rationale: „Herrscht“ bewahrt die im Verb liegende Autorität und den Anklang an den Schöpfungsauftrag, ohne die Art dieser Herrschaft über den Wortlaut hinaus näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Zweckkonstruktion, bleibt aber flüssig. „Den Menschen“ bewahrt den repräsentativen Singular; „ins Dasein gekommen“ erhält die Eigenart von γίνομαι.
