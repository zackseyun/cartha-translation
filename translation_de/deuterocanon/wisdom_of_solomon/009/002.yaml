translation:
  language: de
  text: und durch deine Weisheit hast du den Menschen[a] geschaffen, damit er über die Geschöpfe herrscht[b], die durch dich ins Dasein gekommen sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „den Menschen“ im Singular; gemeint sein können der Mensch als repräsentative Gestalt oder die Menschheit.
