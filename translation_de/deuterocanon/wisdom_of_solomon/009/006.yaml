base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/006.yaml
  text: For even if someone is perfect among the sons of men[a], apart from the wisdom that comes from you, he will be regarded as nothing.
translation:
  language: de
  text: Denn selbst wenn jemand unter den Menschen[a] vollkommen ist, wird er, wenn ihm die Weisheit fehlt, die von dir kommt, für nichts erachtet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unter den Söhnen der Menschen«; eine traditionelle Wendung für die Menschheit.'
    reason: Erläutert die wörtliche Form der griechischen anthropologischen Wendung, während der Haupttext ihren idiomatischen Sinn in modernem Deutsch wiedergibt.
lexical_decisions:
- source_word: κἂν γάρ τις ᾖ
  choice: Denn selbst wenn jemand … wäre
  rationale: κἄν (καί + ἐάν) leitet eine Einräumung ein; γάρ stellt den begründenden Zusammenhang her. Der deutsche Konjunktiv gibt den hypothetischen Charakter natürlich wieder.
- source_word: τέλειος
  choice: vollkommen
  rationale: τέλειος kann »vollkommen«, »vollendet« oder »reif« bedeuten. »Vollkommen« bewahrt hier den hohen wertenden Anspruch und damit den Kontrast zur göttlichen Weisheit.
- source_word: ἐν υἱοῖς ἀνθρώπων
  choice: unter den Menschensöhnen
  rationale: Die wörtlich geprägte Wendung bewahrt den semitisch-biblischen Ausdruck der griechischen Vorlage; gemeint sind die Menschen insgesamt. Eine verständlichere Alternative wird in der Fußnote genannt.
- source_word: τῆς ἀπὸ σοῦ σοφίας ἀπούσης
  choice: wenn die Weisheit, die von dir kommt, fehlt
  rationale: ἀπό bezeichnet die Herkunft der Weisheit; ἀπούσης drückt ihre Abwesenheit aus. Der Nebensatz bildet die griechische Genitivkonstruktion klar und ohne Abschwächung ab.
- source_word: εἰς οὐδὲν λογισθήσεται
  choice: wird er … für nichts erachtet werden
  rationale: Das passive λογισθήσεται bedeutet »angerechnet«, »gerechnet« oder »erachtet werden«. »Für nichts erachtet werden« erhält sowohl die Wertung als auch die feierliche Sprache.
theological_decisions:
- issue: Männlich geprägter Ausdruck für die Menschheit
  choice: »unter den Menschensöhnen« im Haupttext
  alternative: »unter den Menschen«
  rationale: Die griechische Wendung lautet wörtlich »unter den Söhnen der Menschen«, bezeichnet aber die Menschheit allgemein. Der Haupttext bewahrt die Form der Vorlage; die Fußnote macht den umfassenden Sinn kenntlich.
- issue: Verhältnis menschlicher Vollkommenheit zur von Gott kommenden Weisheit
  choice: Den scharfen Kontrast unverändert stehen lassen
  alternative: τέλειος abschwächend als »reif« oder »noch so tüchtig« wiedergeben
  rationale: Der Vers erklärt selbst einen hypothetisch vollkommenen Menschen ohne die von Gott kommende Weisheit für nichts. Diese theologische Spannung darf nicht durch eine abschwächende Umschreibung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischer Prägung. »Menschensöhne« und »für nichts erachtet« bewahren das gehobene Register; Satzbau und Relativsatz bleiben zugleich für heutige Leser verständlich.
