translation:
  language: de
  text: Und durch die Weisheit wurden sie gerettet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurden sie befreit« oder »wurden sie bewahrt«. Das griechische Verb kann je nach Zusammenhang Rettung, Befreiung oder Bewahrung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφίᾳ
  choice: Weisheit
  rationale: 'Der Dativ bezeichnet das Mittel: »durch die Weisheit«. »Weisheit« ist die übliche Bedeutung und zugleich das Leitmotiv des Buches; »Einsicht« wäre hier zu eng.'
- source_word: ἐσώθησαν
  choice: wurden sie gerettet
  rationale: Der Aorist Passiv von σῴζω umfasst Rettung, Bewahrung und Befreiung. »Gerettet« erhält diese Bedeutungsbreite, ohne die Aussage auf eine rein körperliche Befreiung oder auf einen späteren dogmatischen Fachbegriff festzulegen.
theological_decisions:
- issue: Reichweite der Rettungsaussage in σῴζω
  choice: wurden sie gerettet
  alternative: wurden sie befreit; wurden sie bewahrt
  rationale: »Gerettet« wahrt die theologische Weite des griechischen Verbs. Im Zusammenhang kann zugleich geschichtliche Befreiung oder Bewahrung gemeint sein; diese Möglichkeiten werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzgestalt des griechischen Schlusses bleibt erhalten; die deutsche Wortstellung klingt natürlich und hebt das Mittel »durch die Weisheit« hervor.
