translation:
  language: de
  text: Denn welcher Mensch kann Gottes Ratschluss erkennen? Oder wer kann ergründen, was der Herr will?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Denn welcher Mensch wird Gottes Ratschluss erkennen? Oder wer wird bedenken, was der Herr will?“'
    reason: Die griechischen Verben stehen im Futur; ἐνθυμηθήσεται kann enger das innere Erwägen oder Bedenken bezeichnen.
lexical_decisions:
- source_word: τίς γὰρ ἄνθρωπος
  choice: Denn welcher Mensch
  rationale: τίς leitet eine rhetorische Frage ein, γάρ begründet den vorausgehenden Gedanken, und ἄνθρωπος bezeichnet hier den Menschen allgemein. „Welcher Mensch“ bewahrt Singular und Allgemeingültigkeit in natürlichem Deutsch.
- source_word: γνώσεται
  choice: kann ... erkennen
  rationale: Das Futur steht in einer rhetorischen Frage, die das menschliche Vermögen bestreitet. „Kann erkennen“ gibt diese implizite Aussage im Deutschen idiomatisch wieder; die wörtlichere Zukunftsform wird in der Fußnote kenntlich gemacht.
- source_word: βουλὴν θεοῦ
  choice: Gottes Ratschluss
  rationale: βουλή kann Rat, Absicht, Plan oder Beschluss bezeichnen. „Ratschluss“ bewahrt sowohl die überlegte Absicht als auch das theologische Gewicht, ohne den Ausdruck zu einem festgelegten Lehrbegriff auszubauen.
- source_word: ἐνθυμηθήσεται
  choice: kann ergründen
  rationale: Das Verb bezeichnet inneres Erwägen, Bedenken oder gedankliches Erfassen. Im Parallelismus zielt die Frage darauf, ob ein Mensch den Willen des Herrn aus eigenem Denken erfassen kann; „ergründen“ drückt dieses erfolgreiche Erfassen natürlich aus, während die engere Alternative in der Fußnote erhalten bleibt.
- source_word: τί θέλει ὁ κύριος
  choice: was der Herr will
  rationale: θέλω bezeichnet Wollen oder Begehren; „will“ ist präzise und würdig. κύριος wird im Kontext als Gottesbezeichnung mit „der Herr“ wiedergegeben.
theological_decisions:
- issue: Allgemeine Bedeutung von ἄνθρωπος
  choice: Mensch
  alternative: Mann; jemand
  rationale: „Mensch“ entspricht dem generischen Singular des Griechischen, ist im modernen Deutschen eindeutig allgemein und vermeidet eine unnötige Beschränkung auf Männer.
- issue: Verhältnis von βουλή und θέλει
  choice: Ratschluss ... will
  alternative: Plan ... wünscht; Absicht ... begehrt
  rationale: Die Formulierung wahrt die Spannung zwischen Gottes überlegtem Ratschluss und seinem Willen, ohne beide Ausdrücke gleichzusetzen oder dogmatisch näher zu bestimmen.
- issue: Modale Wiedergabe der griechischen Futurformen
  choice: kann erkennen ... kann ergründen
  alternative: wird erkennen ... wird bedenken
  rationale: Die rhetorischen Fragen handeln von der Begrenztheit menschlicher Erkenntnis. Die modale Wiedergabe macht diese Funktion im Deutschen deutlich, während die Fußnote die formale Zukunfts- und Erwägungsnuance dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. „Ratschluss“ ist leicht gehoben, aber geläufig; „ergründen“ erhält den poetisch-rhetorischen Parallelismus. Der Fußnotenmarker [a] steht im Haupttext.
