  text: You chose me beforehand as king of your people and as judge of your sons and daughters;[a]
translation:
  language: de
  text: Du hast mich im Voraus zum König deines Volkes und zum Richter über deine Söhne und Töchter erwählt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du hast mich eingesetzt« beziehungsweise »Du hast mich vorher ausgewählt«; das griechische Verb bezeichnet eine vorausgehende Wahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύ
  choice: Du
  rationale: Das ausdrücklich gesetzte Pronomen steht betont am Satzanfang und wahrt die direkte Anrede Gottes.
- source_word: προείλω
  choice: hast mich im Voraus … erwählt
  rationale: Die Form bezeichnet eine vorausgehende Wahl. Die Wiedergabe bewahrt sowohl den persönlichen Charakter des Erwählens als auch die zeitliche Bedeutung des Präfixes προ-.
- source_word: βασιλέα λαοῦ σου
  choice: zum König deines Volkes
  rationale: Die prädikative Funktion wird im Deutschen natürlich mit „zum König“ ausgedrückt; der Genitiv „deines Volkes“ bleibt erhalten.
- source_word: δικαστὴν
  choice: zum Richter
  rationale: „Richter“ gibt die rechtsprechende Funktion präzise wieder und vermeidet die allgemeinere Bedeutung „Herrscher“.
- source_word: υἱῶν σου καὶ θυγατέρων
  choice: über deine Söhne und Töchter
  rationale: Der griechische Text nennt beide Geschlechter ausdrücklich. „Über“ macht die im Deutschen erforderliche Beziehung zum Richter idiomatisch deutlich.
theological_decisions:
- issue: Art der königlichen Erwählung Salomos
  choice: Du hast mich im Voraus … erwählt
  alternative: Du hast mich eingesetzt / vorher ausgewählt
  rationale: Die Formulierung erhält den zeitlichen Gehalt des griechischen Präfixes, ohne daraus eine über den unmittelbaren Zusammenhang hinausgehende Aussage über Prädestination abzuleiten.
- issue: Geschlechtsspezifische Bezeichnung der Angehörigen Gottes
  choice: deine Söhne und Töchter
  alternative: deine Kinder
  rationale: Da der Ausgangstext männliche und weibliche Nachkommen ausdrücklich nebeneinander nennt, wird diese Differenzierung bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Gottesrede und die parallelen Amtsbezeichnungen bleiben erkennbar; die Satzstellung ist für natürliches Deutsch leicht angepasst.
