base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/009.yaml
  text: And with you is wisdom[a], who knows your works, and was present when you made the world, and understands what is pleasing in your eyes and what is right according to your commandments.
translation:
  language: de
  text: Und bei dir ist die Weisheit, die deine Werke kennt, die zugegen war, als du die Welt[a] erschufst, und die weiß, was in deinen Augen wohlgefällig und was nach deinen Geboten recht ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Kosmos“. Das griechische Wort kann die Welt als geordnete Schöpfung hervorheben.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: μετὰ σοῦ
  choice: bei dir
  rationale: Die Wendung bezeichnet enge Gemeinschaft beziehungsweise Gegenwart. „Bei dir“ ist im Deutschen natürlich und wahrt den relationalen Sinn.
- source_word: ἡ σοφία ἡ εἰδυῖα
  choice: die Weisheit, die … kennt
  rationale: σοφία wird standardgemäß mit „Weisheit“ wiedergegeben; der feminine Relativsatz erhält ihre deutliche Personifizierung.
- source_word: τὰ ἔργα σου
  choice: deine Werke
  rationale: „Werke“ bewahrt den weiten Bezug auf Gottes Wirken, ohne ihn auf einzelne Taten zu verengen.
- source_word: παροῦσα
  choice: die zugegen war
  rationale: Die Form bezeichnet ihre Anwesenheit bei Gottes Schöpfungshandeln. „Zugegen“ ist präzise und würdevoll, ohne zusätzliche räumliche Bilder einzutragen.
- source_word: ὅτε ἐποίεις τὸν κόσμον
  choice: als du die Welt erschufst
  rationale: „Welt“ gibt κόσμος allgemeinverständlich wieder; „erschufst“ drückt im Schöpfungskontext das göttliche Machen idiomatisch aus, ohne eine Aussage über dessen genaue Art hinzuzufügen.
- source_word: ἐπισταμένη
  choice: die weiß
  rationale: Das Partizip bezeichnet sachkundige Kenntnis beziehungsweise Verständnis. „Weiß“ ist natürlich und bewahrt die semantische Nähe zu εἰδυῖα.
- source_word: τί ἀρεστὸν ἐν ὀφθαλμοῖς σου
  choice: was in deinen Augen wohlgefällig ist
  rationale: Die bildhafte Perspektivformel „in deinen Augen“ bleibt erhalten; „wohlgefällig“ gibt die positive göttliche Bewertung präzise wieder.
- source_word: τί εὐθὲς ἐν ἐντολαῖς σου
  choice: was nach deinen Geboten recht ist
  rationale: εὐθές hat hier ethischen Sinn. „Nach deinen Geboten“ gibt die Gebote als maßgebenden Bezugsrahmen von ἐν idiomatisch wieder.
theological_decisions:
- issue: Personifizierung der Weisheit
  choice: Feminine Relativsätze beibehalten und „Weisheit“ nicht durch Großschreibung besonders markieren
  alternative: Die Aussage unpersönlich formulieren oder „WEISHEIT“ typografisch als Eigennamen kennzeichnen
  rationale: Die griechischen femininen Partizipien stellen die Weisheit personifiziert dar. Die Relativsätze erhalten dies, ohne eine spätere dogmatische Identifikation festzulegen.
- issue: Bedeutungsumfang von κόσμος
  choice: Welt
  alternative: Kosmos oder Universum
  rationale: κόσμος bezeichnet hier die geordnete Schöpfungswelt. „Welt“ ist natürlich und weit genug; „Universum“ wäre moderner-naturwissenschaftlich gefärbt, „Kosmos“ fachsprachlicher.
- issue: Schöpfungsverb ἐποίεις
  choice: erschufst
  alternative: machtest
  rationale: Im unmittelbaren Bezug auf τὸν κόσμον ist „erschufst“ im Deutschen die natürliche kontextuelle Wiedergabe. Es legt weder die Art noch das Material des Schöpfungshandelns fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten femininen Relativsätze machen die Personifizierung der Weisheit klar, ohne sie dogmatisch weiterzubestimmen. Die Satzstruktur bleibt dem griechischen Aufbau erkennbar nahe.
