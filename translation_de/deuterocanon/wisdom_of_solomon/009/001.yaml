  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/001.yaml
  text: God of the fathers and Lord of your mercy[a], who made all things by your word,
translation:
  language: de
  text: Gott der Väter und Herr deines Erbarmens, der du alles durch dein Wort[a] geschaffen hast,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch deinen Befehl«. Griechisch: »durch dein Wort«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὲ
  choice: Gott
  rationale: Der Vokativ richtet sich unmittelbar an Gott; im Deutschen ist dafür kein zusätzliches »O« nötig.
- source_word: πατέρων
  choice: der Väter
  rationale: Der artikellose griechische Genitiv enthält kein ausdrückliches Possessivpronomen. »Der Väter« bewahrt den traditionellen heilsgeschichtlichen Sinn, ohne »unserer« hinzuzufügen.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativtitel bezeichnet Gott im Gebet; »Herr« ist hier die sachlich und stilistisch angemessene Wiedergabe.
- source_word: τοῦ ἐλέους σου
  choice: deines Erbarmens
  rationale: Die ungewöhnliche Genitivverbindung einschließlich des ausdrücklichen σου (»deines«) bleibt erhalten. »Erbarmen« gibt ἔλεος in diesem feierlichen Gebetszusammenhang natürlich wieder.
- source_word: ὁ ποιήσας
  choice: der du … geschaffen hast
  rationale: Das Partizip kennzeichnet den angeredeten Gott durch sein vollendetes Schöpfungshandeln. Die direkte Du-Konstruktion ist im deutschen Gebet natürlich; »geschaffen« verdeutlicht den Kontext, ohne den Umfang des Verbs einzuengen.
- source_word: τὰ πάντα
  choice: alles
  rationale: »Alles« gibt die umfassende Bedeutung knapp und idiomatisch wieder.
- source_word: ἐν λόγῳ σου
  choice: durch dein Wort
  rationale: ἐν ist hier instrumental zu verstehen. »Wort« bewahrt die lexikalische Weite und mögliche intertextuelle Resonanz von λόγος, ohne die Formulierung auf einen Befehl festzulegen.
theological_decisions:
- issue: λόγος im Zusammenhang der Schöpfung
  choice: Wort
  alternative: Befehl
  rationale: »Wort« folgt der griechischen Ausdrucksweise und lässt deren mögliche theologische und intertextuelle Resonanzen offen. »Befehl« ist als kontextuelle Deutung möglich, würde die Bedeutung jedoch stärker festlegen.
- issue: Die Genitivverbindung τοῦ ἐλέους σου
  choice: Herr deines Erbarmens
  alternative: barmherziger Herr
  rationale: Die gewählte Form bewahrt sowohl den Genitiv als auch das ausdrückliche Possessivpronomen. Die glattere Alternative würde die ungewöhnliche Beziehung umdeuten und die Spannung des Ausgangstextes auflösen.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die Anrede bleibt feierlich, aber verständlich; die ungewöhnliche Wendung »Herr deines Erbarmens« wird wegen ihrer Verankerung im griechischen Wortlaut nicht geglättet.
