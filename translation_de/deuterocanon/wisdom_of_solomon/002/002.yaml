translation:
  language: de
  text: Denn durch bloßen Zufall sind wir ins Dasein gekommen, und danach werden wir sein, als hätten wir nie existiert. Denn der Atem in unseren Nasenlöchern ist Rauch, und die Vernunft[a] ist ein Funke in der Regung unseres Herzens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Denken; auch: die Rede. Das griechische Wort λόγος hat hier mehrere mögliche Bedeutungen.'
    reason: Dokumentiert die lexikalische Mehrdeutigkeit von λόγος, während „Vernunft“ im Haupttext die kontextuell naheliegende Bedeutung wiedergibt.
lexical_decisions:
- source_word: αὐτοσχεδίως
  choice: durch bloßen Zufall
  rationale: Das Adverb bezeichnet hier ein ungeplantes, von selbst oder zufällig eintretendes Geschehen; im Gedankengang der Sprecher gibt „durch bloßen Zufall“ ihre behauptete Sicht klar wieder.
- source_word: ὁ λόγος
  choice: das Denken
  rationale: λόγος kann unter anderem Denken, Vernunft, Rede oder Wort bedeuten. Im Zusammenhang mit Atem, Herz und einem Funken ist die geistige Tätigkeit gemeint; „das Denken“ bleibt im Deutschen natürlich und wird wegen der Mehrdeutigkeit mit einer Fußnote versehen.
- source_word: ἐν κινήσει καρδίας ἡμῶν
  choice: in der Regung unseres Herzens
  rationale: κίνησις bedeutet Bewegung oder Regung. „Regung“ bewahrt das körperlich-geistige Bild, ohne den Ausdruck ausschließlich auf den Herzschlag festzulegen.
theological_decisions:
- issue: Die Aussage über die zufällige Entstehung des Menschen
  choice: Als Behauptung der in diesem Abschnitt sprechenden Gottlosen unverändert wiedergegeben
  alternative: Durch eine erklärende Formulierung im Vers als Irrtum kennzeichnen
  rationale: Der Vers gibt die Weltanschauung der Sprecher wieder. Die Übersetzung soll ihre Behauptung deutlich darstellen, ohne sie im Wortlaut zu bestätigen oder vorzeitig theologisch zu korrigieren.
- issue: Bedeutungsbreite von λόγος
  choice: „das Denken“ im Haupttext mit Hinweis auf „Vernunft“ oder „Rede“ in der Fußnote
  alternative: „die Vernunft“ oder „die Rede“ ohne Hinweis
  rationale: So bleibt sowohl der unmittelbare physiologische Zusammenhang als auch die echte lexikalische Mehrdeutigkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem argumentativen Zusammenhang des Griechischen, während „ins Dasein gekommen“ und „als hätten wir nie existiert“ für heutige Leser natürlich formuliert sind.
