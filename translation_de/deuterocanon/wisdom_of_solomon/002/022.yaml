base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/022.yaml
  text: And they did not know his mysteries[a], nor did they hope for the reward of holiness[c][b], nor did they consider blameless souls worthy of honor.
translation:
  language: de
  text: Und sie erkannten seine Geheimnisse[a] nicht; sie hofften auch nicht auf den Lohn der Frömmigkeit[b] und hielten die untadeligen Seelen nicht der Ehre für würdig.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine verborgenen Dinge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Lohn der Heiligkeit“ beziehungsweise „der Gottesfurcht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „sie beurteilten auch nicht die Ehre untadeliger Seelen“. Der griechische Ausdruck ist knapp und kann auch eine Ehrengabe oder Auszeichnung bezeichnen.'
    reason: compressed_syntax
lexical_decisions:
- source_word: ἔγνωσαν
  choice: erkannten
  rationale: Das Verb bezeichnet hier ein fehlendes Erkennen oder Verstehen; „erkannten“ ist prägnant und wahrt den Erkenntnisaspekt.
- source_word: μυστήρια
  choice: Geheimnisse
  rationale: „Geheimnisse“ gibt verborgene göttliche Wirklichkeiten natürlich wieder, ohne ihren Inhalt näher festzulegen.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Pronomen bleibt entsprechend dem Griechischen stehen; im Kontext bezieht es sich auf Gott, ohne dass der Name in den Text eingefügt wird.
- source_word: μισθὸν
  choice: Lohn
  rationale: „Lohn“ ist die direkte, im religiös-ethischen Zusammenhang geläufige Entsprechung.
- source_word: ἤλπισαν
  choice: hofften ... auf
  rationale: Diese Wendung bewahrt die zukunftsgerichtete Erwartung von ἐλπίζω.
- source_word: ὁσιότητος
  choice: Gottesfurcht
  rationale: ὁσιότης bezeichnet hier fromme, Gott gemäße Haltung; „Gottesfurcht“ klingt im Deutschen natürlicher und konkreter als das missverständliche abstrakte „Heiligkeit“.
- source_word: ἔκριναν
  choice: hielten ... für würdig
  rationale: κρίνω hat evaluativen Sinn; zusammen mit dem komprimierten Ausdruck γέρας ψυχῶν ἀμώμων wird dieser im Deutschen idiomatisch entfaltet.
- source_word: γέρας
  choice: Ehre
  rationale: γέρας bezeichnet eine Ehrenstellung, Ehrengabe oder Auszeichnung; „Ehre“ wahrt die Breite des Ausdrucks.
- source_word: ψυχῶν
  choice: Seelen
  rationale: „Seelen“ erhält die anthropologische und über das gegenwärtige Leben hinausweisende Resonanz des Kontextes.
- source_word: ἀμώμων
  choice: untadeligen
  rationale: Das Wort bezeichnet solche, an denen kein Makel oder Tadel ist; „untadelig“ ist für Personen natürlich und würdig.
theological_decisions:
- issue: Bezug von αὐτοῦ („seine“)
  choice: Das Pronomen wird beibehalten und im Kontext auf Gott bezogen.
  alternative: „Gottes Geheimnisse“ ausdrücklich schreiben.
  rationale: Der Kontext legt Gott als Bezug nahe, doch die pronominale Form des griechischen Textes soll nicht erklärend ersetzt werden.
- issue: Bedeutung von ὁσιότης
  choice: Gottesfurcht
  alternative: Heiligkeit oder Frömmigkeit
  rationale: „Gottesfurcht“ bezeichnet eine Gott zugewandte, ehrfürchtige Lebenshaltung, ohne den Ausdruck auf äußere Religionsausübung zu verengen; die Alternativen werden in der Fußnote bewahrt.
- issue: Bedeutung von ψυχή
  choice: Seelen
  alternative: Menschen oder Leben
  rationale: „Seelen“ folgt der lexikalischen Gestalt und wahrt die eschatologische Spannung des Zusammenhangs, ohne eine weitergehende Anthropologie festzuschreiben.
- issue: Syntax von γέρας ψυχῶν ἀμώμων
  choice: „hielten die untadeligen Seelen nicht der Ehre für würdig“
  alternative: 'Wörtlicher: „beurteilten die Ehre untadeliger Seelen nicht“'
  rationale: Der griechische Ausdruck ist stark verdichtet. Die gewählte Entfaltung macht den wertenden Sinn verständlich, ohne Art oder Zeitpunkt der Ehre zu bestimmen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. Die dreifache Verneinung und der Parallelismus des Griechischen bleiben erhalten; die letzte, im Griechischen verdichtete Wendung wird für natürliche deutsche Verständlichkeit behutsam entfaltet.
