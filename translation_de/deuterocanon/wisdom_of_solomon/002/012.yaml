base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/012.yaml
  text: But let us lie in wait for the righteous man, because he is troublesome to us and opposes our deeds, and reproaches us for sins against the law, and charges us with sins against our training.
translation:
  language: de
  text: Doch lasst uns dem Gerechten[a] auflauern; denn er ist uns lästig, widersetzt sich unseren Taten, hält uns Sünden gegen das Gesetz vor und beschuldigt uns, gegen unsere Erziehung[b] verstoßen zu haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem gerechten Mann“. Der griechische Singular kann einen exemplarischen gerechten Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann Erziehung, Unterweisung oder Zucht bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύσωμεν
  choice: lasst uns … auflauern
  rationale: Der hortative Aoristkonjunktiv verlangt eine Aufforderung in der ersten Person Plural. „Auflauern“ bewahrt den Gedanken eines heimlich geplanten Angriffs, ohne dessen konkrete Form festzulegen.
- source_word: τὸν δίκαιον
  choice: dem Gerechten
  rationale: Der substantivierte maskuline Singular bezeichnet hier einen exemplarischen gerechten Menschen. „Der Gerechte“ ist im Deutschen idiomatisch und lässt die repräsentative Bedeutung offen.
- source_word: δύσχρηστος
  choice: lästig
  rationale: Im Zusammenhang meint das Wort jemanden, mit dem schwer umzugehen ist und den die Sprecher als hinderlich empfinden; „lästig“ gibt diese wertende Perspektive natürlich wieder.
- source_word: ἐναντιοῦται
  choice: widersetzt sich
  rationale: Die Form bezeichnet aktiven Widerstand gegen die Taten der Sprecher. „Widersetzt sich“ bewahrt diese persönliche und nachdrückliche Gegenstellung.
- source_word: τοῖς ἔργοις ἡμῶν
  choice: unseren Taten
  rationale: „Taten“ gibt ἔργα in seinem moralisch gefärbten Sinn knapp und verständlich wieder.
- source_word: ὀνειδίζει
  choice: hält … vor
  rationale: Die Wendung bezeichnet tadelndes Vorhalten und klingt im modernen Deutschen natürlicher als das förmlichere „schmäht uns wegen“.
- source_word: ἁμαρτήματα νόμου
  choice: Sünden gegen das Gesetz
  rationale: 'Der Genitiv wird relational beziehungsweise objektiv verstanden: Es geht um Verfehlungen, die gegen das Gesetz begangen wurden.'
- source_word: ἐπιφημίζει
  choice: beschuldigt
  rationale: Das Verb hat hier den Sinn, jemandem etwas anklagend zuzuschreiben. „Beschuldigt“ erhält den forensischen Klang, ohne eine öffentliche Verkündigung vorauszusetzen.
- source_word: ἁμαρτήματα παιδείας ἡμῶν
  choice: gegen unsere Erziehung verstoßen zu haben
  rationale: παιδεία umfasst Erziehung, Bildung und Zucht. Die verbale Fassung macht das im Deutschen sonst schwer verständliche Verhältnis deutlich, ohne die moralisch-formative Bedeutung auf Schulunterricht zu verengen.
theological_decisions:
- issue: Repräsentativer Singular τὸν δίκαιον
  choice: dem Gerechten
  alternative: dem gerechten Mann
  rationale: Die substantivierte Form wahrt den männlichen Singular und zugleich dessen mögliche exemplarische Bedeutung. Sie legt den Vers nicht ausdrücklich auf eine einzige historische oder messianische Person fest.
- issue: Bedeutung von παιδεία im ethisch-formativen Zusammenhang
  choice: unsere Erziehung
  alternative: unsere Unterweisung / unsere Zucht
  rationale: „Erziehung“ umfasst die empfangene moralische Prägung und ist im heutigen Deutsch verständlich. „Unterweisung“ wäre stärker intellektuell, „Zucht“ heute enger und missverständlicher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz behält die anklagende Steigerung des Griechischen bei. Die Semikolonsetzung gliedert die Aufforderung und ihre Begründung, ohne den Vers in mehrere selbstständige Sätze aufzulösen.
