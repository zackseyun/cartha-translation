  source_fidelity: Die Übersetzung gibt den hortativen Aufruf ἐνεδρεύσωμεν mit „lasst uns … auflauern“ treffend wieder. „dem Gerechten“ bewahrt den artikulierten maskulinen Singular und dessen exemplarische Offenheit. Die Abfolge von Lästigkeit, Widerstand gegen die Taten, Vorhalten der Gesetzesverfehlungen und anklagender Zuschreibung der Verfehlungen im Blick auf die eigene παιδεία entspricht dem griechischen Satzbau und Sinn. Die explizierende Wiedergabe „gegen unsere Erziehung verstoßen zu haben“ ist im Deutschen vertretbar und wahrt den ethisch-formativen Bezug, ohne eine bestimmte konfessionelle Deutung einzutragen.
  naturalness: Modernes, würdiges und flüssiges Standarddeutsch. „Jemandem auflauern“, „etwas vorhalten“ und „jemanden beschuldigen, etwas getan zu haben“ sind idiomatisch. Die Satzlänge und Reihung passen zum anklagenden, verschwörerischen Ton des Verses.
  terminology: „Gerechter“, „Sünden“, „Gesetz“, „Taten“ und „Erziehung“ sind sachgerecht. Die Fußnoten markieren sowohl die repräsentative Singularverwendung als auch den Bedeutungsspielraum von παιδεία angemessen.
