  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/024.yaml
  text: But through the devil’s envy death entered into the world[a], and those who belong to his portion test it.
translation:
  language: de
  text: Doch durch den Neid des Teufels kam der Tod in die Welt, und die, die zu seinem Anteil zählen, erfahren ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann die zweite Satzhälfte lauten: „und die, die zu seinem Anteil zählen, prüfen/erproben ihn.“ Die griechische Wendung ist schwierig. Wahrscheinlich ist gemeint, dass diejenigen, die auf der Seite des Teufels stehen, den Tod erfahren.'
    reason: Bewahrt die ungewöhnliche Grundbedeutung von πειράζουσιν und die schwer eindeutig aufzulösende griechische Ausdrucksweise.
lexical_decisions:
- source_word: φθόνῳ
  choice: durch den Neid
  rationale: Der Dativ kann instrumental oder kausal verstanden werden. „Durch den Neid“ bewahrt beide Nuancen in natürlichem Deutsch.
- source_word: διαβόλου
  choice: des Teufels
  rationale: διάβολος bezeichnet hier im jüdisch-griechischen Weisheitskontext am ehesten die personale böse Gestalt, nicht lediglich einen beliebigen Verleumder oder Ankläger.
- source_word: θάνατος
  choice: der Tod
  rationale: Direkte und kontextgemäße Wiedergabe ohne unnötige inhaltliche Erweiterung.
- source_word: εἰσῆλθεν εἰς τὸν κόσμον
  choice: kam ... in die Welt
  rationale: Die Formulierung gibt die Bewegungsrichtung des griechischen Ausdrucks klar und idiomatisch wieder.
- source_word: πειράζουσιν
  choice: erfahren
  rationale: Das Verb bedeutet gewöhnlich „prüfen“, „erproben“ oder „versuchen“. Mit dem Tod als Objekt bezeichnet es hier wahrscheinlich das Erfahren seiner Wirklichkeit; die wörtlichere, aber im Deutschen schwer verständliche Alternative wird in der Fußnote erhalten.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das maskuline Pronomen bezieht sich am natürlichsten auf den ebenfalls maskulinen θάνατος, „Tod“. Das deutsche Pronomen bewahrt diese mögliche Rückbeziehung.
- source_word: οἱ τῆς ἐκείνου μερίδος ὄντες
  choice: die, die seinem Anteil angehören
  rationale: μερίς bezeichnet einen Anteil, Teil oder eine Zugehörigkeit. Die relativ formale Wiedergabe erhält das Bild und lässt offen, ob Partei, Bereich oder Los gemeint ist.
theological_decisions:
- issue: Identität des διάβολος
  choice: personale böse Gestalt, „der Teufel“
  alternative: ein Verleumder oder Ankläger im allgemeinen Sinn
  rationale: Die Aussage über den Eintritt des Todes in die Welt und der jüdisch-griechische Kontext sprechen für die personale Bedeutung, ohne weitere dogmatische Einzelheiten einzutragen.
- issue: Sinn von πειράζουσιν αὐτόν
  choice: Sie erfahren den Tod.
  alternative: Sie prüfen/erproben ihn; möglicherweise mit stärker personifiziertem Tod.
  rationale: Die griechische Wendung ist schwierig. „Erfahren“ vermittelt im Deutschen den wahrscheinlichen Zusammenhang, während die Fußnote die wörtlichere Bedeutung und die verbleibende Mehrdeutigkeit offenlegt.
- issue: Bezug von ἐκείνου („seinem“)
  choice: Bezug auf den Teufel
  alternative: Ein weniger naheliegender Bezug innerhalb der dichten Bildsprache
  rationale: Das stärker zurückweisende Pronomen ἐκεῖνος nimmt am ehesten den Teufel wieder auf; damit werden diejenigen bezeichnet, die seinem Anteil beziehungsweise seiner Seite angehören.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Satzhälfte ist klar und idiomatisch formuliert; in der zweiten bleibt das ungewöhnliche Bild vom „Anteil“ bewusst erhalten. Die Fußnote dokumentiert die echte lexikalische und syntaktische Spannung, ohne sie konfessionell aufzulösen.
