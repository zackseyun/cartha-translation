revisions:
- from: Das dachten sie, doch sie irrten sich; denn ihre eigene Bosheit hatte sie verblendet.
  to: Dies alles überlegten sie, und sie wurden in die Irre geführt; denn ihre eigene Bosheit verblendete sie.
  rationale: Die Revision bewahrt den pluralischen Bezug von ταῦτα, die deliberative Nuance von ἐλογίσαντο, das offene Passiv von ἐπλανήθησαν und die einfache kausale Aussage des Aorists ἀπετύφλωσεν. „Eigene Bosheit“ erhält die possessive moralische Zurechnung, ohne eine weitergehende Lehraussage einzutragen.
  reviewer_model: gpt-5.6-terra
