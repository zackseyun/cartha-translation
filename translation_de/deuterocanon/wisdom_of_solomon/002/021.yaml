  text: Dies alles überlegten sie, und sie wurden in die Irre geführt; denn ihre eigene Bosheit verblendete sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: Das
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist natürlich auf die zuvor dargestellten Überlegungen zurück; der griechische Plural wird im Deutschen idiomatisch zusammenfassend wiedergegeben.
- source_word: ἐλογίσαντο
  choice: dachten sie
  rationale: Das Verb bezeichnet hier überlegendes Denken. „Dachten“ ist im Kontext klar, natürlich und vermeidet den im Deutschen möglicherweise positiv klingenden Ausdruck „vernünftig urteilen“.
- source_word: ἐπλανήθησαν
  choice: sie irrten sich
  rationale: Der passive Aorist beschreibt, dass sie in die Irre gerieten beziehungsweise einem Irrtum verfielen. Das idiomatische „irrten sich“ wahrt den Sinn, ohne einen im Text nicht genannten äußeren Verführer einzuführen.
- source_word: ἀπετύφλωσεν
  choice: hatte sie verblendet
  rationale: Das Verb bezeichnet verursachte Blindheit im übertragenen, moralisch-erkenntnismäßigen Sinn. „Verblendet“ ist im Deutschen dafür präzise und idiomatisch; das Plusquamperfekt macht den begründenden Zusammenhang verständlich.
- source_word: ἡ κακία αὐτῶν
  choice: ihre eigene Bosheit
  rationale: „Bosheit“ bewahrt die starke moralische Wertung von κακία. „Eigene“ hebt idiomatisch hervor, dass die Ursache in ihrer eigenen moralischen Verderbtheit liegt.
theological_decisions:
- issue: Moralische Ursache ihrer Verblendung
  choice: ihre eigene Bosheit hatte sie verblendet
  alternative: die Bosheit verblendete sie
  rationale: Der griechische Text nennt ihre Bosheit ausdrücklich als Ursache. Die Wiedergabe bewahrt diese moralische Kausalität, ohne eine göttliche Verstockung oder einen äußeren Verführer hinzuzufügen.
- issue: Passiv von ἐπλανήθησαν
  choice: sie irrten sich
  alternative: sie wurden in die Irre geführt
  rationale: Das griechische Passiv bleibt hinsichtlich einer handelnden Ursache offen. Die deutsche Formulierung beschreibt das Ergebnis, ohne die nicht ausdrücklich genannte Urheberschaft eines Verführers festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper weisheitlicher Satzstruktur. Das adversative „doch“ verdeutlicht den Gegensatz zwischen ihrem vermeintlichen Denken und ihrem tatsächlichen Irrtum; das Semikolon erhält die enge Begründungsstruktur des Griechischen.
