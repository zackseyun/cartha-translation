  terminology: „Der Gerechte“ trifft δίκαιος im moralisch-religiösen Kontext. „Gottes Sohn“ wahrt die im griechischen anarthrischen Prädikat mögliche Offenheit; die Fußnote benennt sowohl die unbestimmte als auch die bestimmte Alternative und vermeidet damit eine dogmatische Festlegung. „Gegner“ gibt ἀνθεστηκότων sachgerecht wieder.
