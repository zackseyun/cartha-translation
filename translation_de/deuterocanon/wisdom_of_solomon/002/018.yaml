  text: For if the righteous man is God's son, he will help him and rescue him from the hand of those who oppose him.
translation:
  language: de
  text: Denn wenn der Gerechte Gottes Sohn ist[a], wird Gott ihm beistehen und ihn aus der Hand seiner Gegner retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »ein Sohn Gottes« oder »der Sohn Gottes«. Die griechische Formulierung lässt mehr als eine Wiedergabe zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv mit Artikel bezeichnet hier einen einzelnen männlichen Gerechten. „Der Gerechte“ ist im Deutschen natürlich, prägnant und wahrt den religiös-moralischen Sinn.
- source_word: υἱὸς θεοῦ
  choice: Gottes Sohn
  rationale: Die artikellose Prädikatsfügung lässt mehrere deutsche Wiedergaben zu. „Gottes Sohn“ bewahrt die Zugehörigkeitsaussage, ohne durch eine typografische Sonderentscheidung ausdrücklich einen späteren christologischen Titel festzulegen.
- source_word: ἀντιλήμψεται
  choice: wird ihm beistehen
  rationale: Das Verb bezeichnet ein unterstützendes Ergreifen beziehungsweise Zu-Hilfe-Kommen. „Ihm beistehen“ ist idiomatisches, würdiges Deutsch und passt zum parallelen Retten.
- source_word: ῥύσεται
  choice: ihn … retten
  rationale: Das Verb bezeichnet die Befreiung aus einer Gefahr oder feindlichen Gewalt. „Retten“ gibt dies klar wieder, ohne den Ausdruck unnötig auszudeuten.
- source_word: ἐκ χειρὸς
  choice: aus der Hand
  rationale: Die biblische Wendung bezeichnet Gewalt oder Verfügungsgewalt. Das im Deutschen verständliche Bild wird beibehalten.
- source_word: ἀνθεστηκότων
  choice: seiner Gegner
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die sich dem Gerechten entgegengestellt haben. „Seiner Gegner“ ist knapp und gibt die feindliche Gegnerschaft natürlich wieder.
theological_decisions:
- issue: Ob υἱὸς θεοῦ ausdrücklich als christologischer Titel wiederzugeben ist
  choice: „Gottes Sohn“ im Haupttext, mit Hinweis auf die grammatisch möglichen Alternativen
  alternative: „ein Sohn Gottes“ oder „der Sohn Gottes“
  rationale: Der unmittelbare Zusammenhang spricht vom Gerechten; die griechische artikellose Prädikatsfügung entscheidet nicht eindeutig zwischen einer qualitativen beziehungsweise unbestimmten Aussage und einer bestimmten, titularen Lesart. Die Übersetzung soll eine spätere christologische Rezeption weder ausschließen noch in den Ausgangstext hineintragen.
- issue: Subjekt von ἀντιλήμψεται und ῥύσεται
  choice: „Gott“ ausdrücklich als Subjekt genannt
  alternative: „er wird ihm beistehen und ihn retten“
  rationale: Grammatisch verweist das unausgesprochene Subjekt der beiden Verben auf θεοῦ, also Gott, nicht auf den Gerechten. Die Wiederaufnahme mit „Gott“ beseitigt im Deutschen eine irreführende Pronomenmehrdeutigkeit, ohne zusätzliche Sachinformation einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die traditionelle und weiterhin klare Wendung „aus der Hand“ bleibt erhalten; das elliptische griechische Subjekt wird zur Vermeidung eines falschen Bezugs ausdrücklich als „Gott“ wiederaufgenommen.
