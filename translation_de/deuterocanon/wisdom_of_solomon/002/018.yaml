  source_fidelity: 'Der Text gibt die Struktur und den Sinn des Griechischen zuverlässig wieder: εἰ γάρ als „Denn wenn“, ὁ δίκαιος als „der Gerechte“, die Sohn-Gottes-Aussage ohne erzwungene christologische Titellesart, die beiden göttlichen Handlungen des Beistehens und Rettens sowie die Wendung ἐκ χειρὸς ἀνθεστηκότων als Rettung aus feindlicher Gewalt. Die ausdrückliche Wiederaufnahme „Gott“ trifft das im Griechischen bei ἀντιλήμψεται und ῥύσεται implizierte Subjekt und verhindert im Deutschen einen falschen Bezug auf den Gerechten.'
