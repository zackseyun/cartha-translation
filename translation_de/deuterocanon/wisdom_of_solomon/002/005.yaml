base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/005.yaml
  text: For our life is the passing of a shadow, and there is no turning back from our end, because it has been sealed, and no one returns.
translation:
  language: de
  text: Denn unser Leben ist das Vorüberziehen eines Schattens, und von unserem Ende gibt es keine Rückkehr; denn es ist versiegelt, und niemand kehrt zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκιᾶς … πάροδος
  choice: das Vorüberziehen eines Schattens
  rationale: Bewahrt das griechische Nominalbild vom flüchtigen Vorüberziehen eines Schattens und klingt zugleich in modernem Deutsch verständlich.
- source_word: ἀναποδισμός
  choice: Rückkehr
  rationale: Das seltene Wort bezeichnet hier ein Zurückgehen oder Zurückkehren; „Rückkehr“ passt zum folgenden ἀναστρέφει und wahrt die Aussage des griechischen Textes.
- source_word: τελευτῆς
  choice: Ende
  rationale: Gibt die Grundbedeutung wieder und lässt den im Zusammenhang naheliegenden Bezug auf den Tod bestehen, ohne ihn im Haupttext ausdrücklich festzulegen.
- source_word: κατεσφραγίσθη
  choice: es ist versiegelt
  rationale: Bewahrt das Passiv und das Bild eines endgültig verschlossenen beziehungsweise besiegelten Endes, ohne einen Handelnden zu ergänzen.
- source_word: ἀναστρέφει
  choice: kehrt zurück
  rationale: Im Kontext bezeichnet das Verb die Rückkehr vom Ende beziehungsweise Tod; die Wiedergabe ist natürlich und vermeidet das missverständliche „kehrt um“.
theological_decisions:
- issue: Endgültigkeit des Todes aus der Perspektive der im Abschnitt sprechenden Gottlosen
  choice: Die absolute Formulierung des Verses bleibt unverändert stehen.
  alternative: Die Aussage durch einen Zusatz über Auferstehung oder Jenseits einschränken.
  rationale: Der Vers gibt die Redeweise und Argumentation der Gottlosen im literarischen Zusammenhang wieder. Eine harmonisierende Ergänzung würde die im Text beabsichtigte Spannung auflösen.
- issue: Unbestimmter Handelnder beim Versiegeln
  choice: 'Passiv ohne ausdrückliches Agens: „es ist versiegelt“.'
  alternative: „Gott hat es versiegelt“ oder „das Schicksal hat es besiegelt“.
  rationale: Der griechische Text nennt keinen Handelnden; eine ausdrückliche Zuschreibung wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache und die parallele Struktur des griechischen Satzes bleiben erhalten; das Semikolon gliedert Begründung und Folgerung, ohne den Gedankengang aufzubrechen.
