base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/016.yaml
  text: We were considered by him to be counterfeit[a], and he keeps away from our ways as from uncleannesses; he calls the end of the righteous blessed[c][b], and boasts that God is his father.
translation:
  language: de
  text: Wir gelten ihm als unecht[a], und er hält sich von unseren Wegen fern wie von Unreinem. Das Ende der Gerechten nennt er selig[b], und er rühmt sich, Gott zum Vater zu haben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verfälscht“, „falsch“ beziehungsweise „minderwertig“. Das griechische Wort bezeichnet etwas, das nicht echt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Ausgang“ beziehungsweise „den Endzustand der Gerechten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich in gedrängter Form: „er rühmt sich Vater Gott“; gemeint ist, dass er Gott als seinen Vater beansprucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κίβδηλον
  choice: unecht
  rationale: Das Wort bezeichnet etwas Verfälschtes oder nicht Echtes. „Unecht“ ist im Deutschen natürlich und bewahrt das Urteil, dass der Gerechte die Sprecher für moralisch falsch oder unlauter hält.
- source_word: ἐλογίσθημεν
  choice: wir gelten ihm als
  rationale: Das Passiv von λογίζομαι bezeichnet hier eine wertende Einschätzung. „Wir gelten ihm als“ gibt diese Perspektive knapp und idiomatisch wieder.
- source_word: ἀπέχεται
  choice: er hält sich … fern
  rationale: Die Form bezeichnet bewusstes Abstandhalten; die deutsche Wendung passt natürlich zur Ergänzung „von unseren Wegen“.
- source_word: ὁδῶν
  choice: Wegen
  rationale: „Wege“ bewahrt die biblische Metapher für Lebensführung und Verhalten.
- source_word: ἀκαθαρσιῶν
  choice: Unreinem
  rationale: Der substantivierte Ausdruck erhält die Sprache kultischer oder moralischer Verunreinigung, ohne das im Deutschen schwerfällige Abstraktplural nachzuahmen.
- source_word: μακαρίζει
  choice: preist … glücklich
  rationale: Das Verb bedeutet, jemanden oder etwas glücklich beziehungsweise selig zu nennen. „Glücklich preisen“ ist verständlich und wahrt den wertenden Charakter.
- source_word: ἔσχατα
  choice: das Ende
  rationale: Der griechische Plural kann die letzten Dinge, den Ausgang oder den Endzustand bezeichnen. „Das Ende“ ist knapp und lässt diese eschatologische Offenheit bestehen.
- source_word: δικαίων
  choice: der Gerechten
  rationale: Dies ist die geläufige deutsche Wiedergabe der moralisch-religiösen Personengruppe.
- source_word: ἀλαζονεύεται
  choice: er rühmt sich
  rationale: Das Verb bezeichnet anmaßendes oder prahlerisches Reden. „Sich rühmen“ bewahrt den negativen Ton in würdigem Deutsch.
- source_word: πατέρα θεόν
  choice: Gott zum Vater zu haben
  rationale: Die gedrängte Akkusativverbindung wird relational entfaltet, ohne eine spätere christologische Deutung in den Vers einzutragen.
theological_decisions:
- issue: Bedeutung von πατέρα θεόν bei ἀλαζονεύεται
  choice: Der Gerechte rühmt sich nach dem Vorwurf der Frevler, Gott zum Vater zu haben.
  alternative: Er rühmt sich Gottes als Vater.
  rationale: Die Aussage steht innerhalb der Beschwerde der Frevler und ist keine unmittelbare Erzähleraussage. Die Übersetzung macht den relationalen Anspruch verständlich, ohne ihn konfessionell oder christologisch näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt als Vorwurf der Frevler erkennbar; biblische Weg- und Reinheitssprache sowie die Mehrdeutigkeit von ἔσχατα werden bewahrt.
