translation:
  language: de
  text: Kommt also, lasst uns die vorhandenen Güter genießen[a] und die Schöpfung[b] eifrig nutzen wie in der Jugend.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die gegenwärtigen Güter“ oder „die verfügbaren Güter“. Wörtlich: „die seienden Güter“.'
