lexical_decisions:
- source_word: δεῦτε οὖν
  choice: Kommt also
  rationale: Die Aufforderung δεῦτε wird idiomatisch mit „Kommt“ wiedergegeben; „also“ bewahrt den folgernden und fortführenden Charakter von οὖν.
- source_word: ἀπολαύσωμεν
  choice: lasst uns … genießen
  rationale: Das Verb bezeichnet genussvolles Teilhaben. „Genießen“ ist gegenwärtig, verständlich und erhält den hedonistischen Ton der Rede.
- source_word: τῶν ὄντων ἀγαθῶν
  choice: die Güter …, die da sind
  rationale: Die Formulierung bleibt nahe am wörtlichen Sinn „die seienden/vorhandenen Güter“, ohne die Bezugnahme ausdrücklich auf gegenwärtig verfügbare Güter einzuengen.
- source_word: χρησώμεθα
  choice: nutzen
  rationale: χράομαι bezeichnet das Gebrauchen oder Nutzen. Die Wiedergabe unterscheidet das Verb bewusst von ἀπολαύσωμεν („genießen“).
- source_word: τῇ κτίσει
  choice: die Schöpfung
  rationale: κτίσις bezeichnet hier am ehesten das Geschaffene beziehungsweise die Schöpfungsordnung in ihrer Breite.
- source_word: ὡς νεότητι σπουδαίως
  choice: mit jugendlichem Eifer
  rationale: Die kompakte griechische Wendung verbindet eifriges, energisches Handeln mit der Jugend. Die deutsche Fassung gibt diesen Zusammenhang natürlich wieder; die formnähere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von τῶν ὄντων ἀγαθῶν
  choice: die Güter, die da sind
  alternative: die gegenwärtigen Güter; die verfügbaren Güter
  rationale: Der griechische Ausdruck kann ontologisch oder im Kontext zeitlich und situativ verstanden werden. Die gewählte Formulierung bewahrt diese Offenheit.
- issue: Reichweite von τῇ κτίσει
  choice: die Schöpfung
  alternative: die geschaffene Welt; das Geschaffene
  rationale: Die Übersetzung verengt κτίσις weder auf einzelne Geschöpfe noch ausschließlich auf materielle Mittel.
- issue: Verständnis von ὡς νεότητι
  choice: mit jugendlichem Eifer
  alternative: eifrig, wie in der Jugend
  rationale: Die syntaktisch gedrängte Wendung wird als Vergleich mit der Kraft oder Unbekümmertheit der Jugend verstanden. Die Übersetzung vermeidet die nicht ausdrücklich vorhandene Ergänzung „unserer“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Aufforderung der im Kontext sprechenden Gottlosen erkennbar, ohne ihre Haltung durch wertende Zusätze zu kommentieren. Die ungewöhnliche Offenheit von „die Güter, die da sind“ ist bewusst erhalten und durch eine Fußnote abgesichert.
