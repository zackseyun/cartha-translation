base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/007.yaml
  text: Let us fill ourselves with costly wine and perfumes[a], and let no flower of spring pass us by.
translation:
  language: de
  text: Lasst uns an kostbarem Wein und duftenden Ölen[a] satt werden, und keine Blüte des Frühlings soll an uns vorübergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Salbölen“ oder „wohlriechenden Salben“. Das griechische Wort bezeichnet allgemein duftende Öle und Salben, die dem Luxus dienten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴνου πολυτελοῦς
  choice: kostbarem Wein
  rationale: Der Genitiv hängt von πλησθῶμεν ab; πολυτελής bezeichnet hohen Wert oder Preis. „Kostbarer Wein“ klingt würdevoll und bringt den luxuriösen Genuss zum Ausdruck.
- source_word: μύρων
  choice: duftenden Ölen
  rationale: μύρον bezeichnet Duftöl, Salböl oder eine wohlriechende Salbe. „Duftende Öle“ ist im heutigen Deutsch verständlich und vermeidet den medizinischen Beiklang von „Salben“.
- source_word: πλησθῶμεν
  choice: Lasst uns … satt werden
  rationale: Der hortative Aorist Konjunktiv fordert zum ausgiebigen Genuss auf. „Satt werden an“ gibt das Sich-Anfüllen natürlich wieder und bewahrt den maßlosen Ton.
- source_word: μὴ παροδευσάτω ἡμᾶς
  choice: soll an uns vorübergehen
  rationale: Die verneinte Imperativform drückt aus, dass ihnen keine Gelegenheit zum Genuss entgehen soll. Die räumliche Bildlichkeit von παροδεύω bleibt erhalten.
- source_word: ἄνθος ἔαρος
  choice: Blüte des Frühlings
  rationale: Die wörtlich-poetische Verbindung bleibt erhalten; „Blüte“ kann sowohl die konkrete Blume als auch sinnbildlich die vergängliche Schönheit und Freude bezeichnen.
