  text: He claims to have knowledge of God[a], and calls himself a child of the Lord;
translation:
  language: de
  text: Er behauptet, Erkenntnis Gottes zu besitzen, und nennt sich ein Kind des Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Sohn des Herrn“; das griechische Wort kann in manchen Zusammenhängen auch „Diener“ bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἐπαγγέλλεται
  choice: behauptet
  rationale: Im Kontext bezeichnet das Verb den von den Frevlern wiedergegebenen Anspruch des Gerechten. „Behauptet“ gibt die Aussage wieder, ohne ihre Wahrheit vorwegzunehmen.
- source_word: γνῶσιν ἔχειν θεοῦ
  choice: Erkenntnis Gottes zu besitzen
  rationale: Diese Wiedergabe bewahrt die substantivische Form γνῶσις und die Konstruktion „haben“, klingt im Deutschen aber würdiger und natürlicher als „Erkenntnis Gottes haben“.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der artikellose Genitiv wird in dieser festen deutschen Verbindung natürlich mit „Gottes“ wiedergegeben; aus dem fehlenden Artikel wird keine zusätzliche Bedeutungsnuance abgeleitet.
- source_word: παῖδα
  choice: Kind
  rationale: παῖς kann je nach Zusammenhang „Kind“, „Sohn“ oder „Diener“ bedeuten. Hier liegt wegen der behaupteten besonderen Beziehung zu Gott die familiäre Bedeutung nahe; „Kind“ vermeidet eine nicht zwingende geschlechtliche Festlegung.
- source_word: Κυρίου
  choice: des Herrn
  rationale: κύριος wird entsprechend seiner titulären Bedeutung als „der Herr“ wiedergegeben; der Genitiv verlangt hier „des Herrn“.
- source_word: ἑαυτὸν ὀνομάζει
  choice: nennt sich selbst
  rationale: Die Formulierung gibt die reflexive Selbstbezeichnung idiomatisch und genau wieder.
theological_decisions:
- issue: Wiedergabe von παῖδα Κυρίου zwischen familiärer und dienstbezogener Bedeutung
  choice: ein Kind des Herrn
  alternative: ein Sohn des Herrn; ein Diener des Herrn
  rationale: Der unmittelbare Zusammenhang betont die besondere Beziehung des Gerechten zu Gott stärker als seinen Dienststatus. Da παῖς jedoch semantisch offen bleibt, werden die anderen Möglichkeiten in der Fußnote bewahrt.
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: Herr
  rationale: Die tituläre Wiedergabe „der Herr“ entspricht dem griechischen Ausdruck und ist im Deutschen in dieser Genitivverbindung natürlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht formelle Wendung „Erkenntnis Gottes zu besitzen“ bewahrt die griechische Substantivkonstruktion; das Semikolon des Ausgangstextes wird als Komma in einer koordinierten deutschen Satzstruktur wiedergegeben.
