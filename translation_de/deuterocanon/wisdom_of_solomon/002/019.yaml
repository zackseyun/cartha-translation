base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/019.yaml
  text: Let us test him with insolence and torture[b][a], so that we may know his gentleness and test his forbearance.
translation:
  language: de
  text: Lasst uns ihn mit Übergriffen und Folter prüfen[a], damit wir seine Milde erkennen und seine Geduld im Ertragen von Unrecht beurteilen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Schmach und Qual“. Die griechischen Wörter können überhebliche, entehrende Misshandlung und qualvolle Folter oder Peinigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist besonders das geduldige Ertragen zugefügten Unrechts ohne Vergeltung.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὕβρει
  choice: durch Misshandlung
  rationale: ὕβρις bezeichnet hier anmaßende, entehrende oder gewaltsame Misshandlung. „Misshandlung“ gibt die gegen den Gerechten gerichtete Tat natürlich wieder, ohne sie auf bloße Worte zu beschränken.
- source_word: βασάνῳ
  choice: und Folter
  rationale: βάσανος kann eine qualvolle Prüfung und konkret Folter bezeichnen. Da ἐτάσωμεν bereits das Prüfen ausdrückt, wahrt „Folter“ das konkrete Mittel der Prüfung.
- source_word: ἐτάσωμεν
  choice: wollen wir ihn auf die Probe stellen
  rationale: Der hortative Konjunktiv formuliert den Vorschlag der Frevler. „Auf die Probe stellen“ erfasst das Prüfen durch ein absichtlich herbeigeführtes Leiden.
- source_word: ἐπιείκειαν
  choice: Milde
  rationale: ἐπιείκεια bezeichnet eine milde, nachsichtige und nicht auf Härte bestehende Haltung. „Milde“ ist im Deutschen knapp, verständlich und im Zusammenhang passend.
- source_word: δικάσωμεν
  choice: beurteilen
  rationale: δικάζω hat einen urteilenden, teils forensischen Klang. Im Parallelismus bezeichnet es hier das Feststellen oder Beurteilen einer Eigenschaft anhand der Prüfung.
- source_word: ἀνεξικακίαν
  choice: Geduld im Ertragen von Unrecht
  rationale: ἀνεξικακία meint genauer als allgemeine Geduld das standhafte Ertragen von zugefügtem Unrecht ohne Vergeltung. Die entfaltete Wiedergabe bewahrt diese besondere Bedeutung.
theological_decisions:
- issue: Unterschied zwischen ἐπιείκεια und ἀνεξικακία
  choice: Die beiden Eigenschaften werden als „Milde“ und „Geduld im Ertragen von Unrecht“ unterschieden.
  alternative: „Sanftmut“ und „Geduld“
  rationale: 'Der griechische Text nennt zwei verwandte, aber nicht identische Tugenden: eine milde Haltung und das geduldige Ertragen erlittenen Unrechts. Die Übersetzung erhält diese ethische Spannung, ohne beide Begriffe gleichzusetzen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt den auffordernden Ton der Frevler, den Parallelismus der beiden Prüfverben und die Unterscheidung der beiden Tugenden.
