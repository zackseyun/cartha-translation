translation:
  language: de
  text: Er ist für uns zu einem Vorwurf geworden, der unsere Gedanken entlarvt; schon sein Anblick ist uns unerträglich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: ist … geworden
  rationale: Das griechische Aorist von γίνομαι bezeichnet hier das Eintreten eines Zustands; das deutsche Perfekt klingt in gegenwärtiger Rede natürlich und bewahrt den resultativen Sinn.
- source_word: εἰς ἔλεγχον
  choice: zur Anklage
  rationale: ἔλεγχος bezeichnet ein Aufdecken oder Überführen von Schuld und kann daher Anklage, Zurechtweisung oder Entlarvung bedeuten. „Anklage“ gibt hier knapp wieder, dass der Gerechte ihre Gedanken als verwerflich bloßstellt.
- source_word: ἐννοιῶν ἡμῶν
  choice: unserer Gedanken
  rationale: ἐννοίαι kann Gedanken, Absichten oder innere Überlegungen bezeichnen. „Gedanken“ ist natürlich und lässt die im Kontext vorhandene moralische Färbung offen.
- source_word: βαρύς ἐστιν ἡμῖν
  choice: ist uns unerträglich
  rationale: Wörtlich ist er ihnen „schwer“. Im Deutschen bringt „unerträglich“ den übertragenen Sinn eines kaum zu ertragenden Gegenübers idiomatisch zum Ausdruck.
- source_word: καὶ βλεπόμενος
  choice: schon sein Anblick
  rationale: Das passive Partizip bedeutet wörtlich „wenn/indem er gesehen wird“. Die nominale Wendung „sein Anblick“ vermittelt natürlich, dass bereits sein bloßes Sichtbarsein für sie schwer zu ertragen ist; καί erhält hier hervorhebende Kraft („schon“/„sogar“).
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts
  choice: Er
  alternative: der Gerechte / dieser Mann
  rationale: Der Vers setzt das Subjekt aus dem Zusammenhang fort. Das Pronomen bewahrt die knappe griechische Form und fügt keine erklärende Bezeichnung in den Vers ein.
- issue: Art der durch den Gerechten ausgeübten Wirkung
  choice: Anklage unserer Gedanken
  alternative: Zurechtweisung unserer Gedanken / Entlarvung unserer Überlegungen
  rationale: Der Text sagt nicht, dass der Gerechte ausdrücklich urteilt; seine Person wirkt als ἔλεγχος. „Anklage“ bewahrt diese Spannung, ohne eine gerichtliche Verurteilung ausdrücklich zu behaupten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung ist knapp und folgt der Parallelität des griechischen Satzes; „unerträglich“ ist gegenüber dem wörtlichen „schwer“ idiomatischer.
