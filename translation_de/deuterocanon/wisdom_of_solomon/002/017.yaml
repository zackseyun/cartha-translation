  text: Let us see whether his words are true[a], and let us test what will happen at his end.
translation:
  language: de
  text: Wir wollen sehen, ob seine Worte wahr sind, und prüfen, wie es am Ende mit ihm ausgehen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: was bei seinem Ende geschehen wird. Das griechische Wort kann sowohl den Ausgang als auch das Ende bezeichnen, das ihm bevorsteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδωμεν
  choice: Wir wollen sehen
  rationale: Der hortative Konjunktiv der ersten Person Plural wird im Deutschen natürlich mit „wir wollen“ wiedergegeben und bewahrt den herausfordernden Ton der Sprecher.
- source_word: οἱ λόγοι αὐτοῦ
  choice: seine Worte
  rationale: Die Wiedergabe bleibt nahe am griechischen λόγοι und lässt zugleich den kontextuellen Sinn seiner Aussagen oder Behauptungen offen.
- source_word: ἀληθεῖς
  choice: wahr
  rationale: Das Adjektiv bezeichnet hier die Wahrheit des Gesagten; „wahrhaftig“ würde den Akzent stärker auf den Charakter des Sprechers legen.
- source_word: πειράσωμεν
  choice: und prüfen
  rationale: Das Verb bezeichnet ein Erproben oder Auf-die-Probe-Stellen. Die knappe Formulierung bewahrt den feindseligen Prüfgedanken; das hortative „wir wollen“ wirkt aus dem ersten Satzteil fort.
- source_word: τὰ ἐν ἐκβάσει αὐτοῦ
  choice: wie es am Ende mit ihm ausgehen wird
  rationale: ἐκβάσις kann Ausgang, Ergebnis oder Ende bezeichnen. Die Formulierung ist idiomatisches modernes Deutsch und bewahrt sowohl den Gedanken seines Endes als auch den seines schließlichen Ergehens.
theological_decisions:
- issue: Bedeutung von ἐκβάσις im Blick auf den Gerechten
  choice: wie es am Ende mit ihm ausgehen wird
  alternative: was bei seinem Ende geschehen wird
  rationale: Der Zusammenhang zielt darauf, die Aussagen des Gerechten anhand seines schließlichen Ergehens zu überprüfen. Die Übersetzung lässt offen, ob besonders sein Lebensende, das Ergebnis der Bedrängnis oder seine endgültige Bewahrung gemeint ist, und legt keine spezifischere eschatologische Lehre in den Text hinein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweifache Aufforderung ist flüssig verbunden; die leicht unheilvolle Mehrdeutigkeit von „Ende“ und „Ausgang“ bleibt erhalten.
