  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/023.yaml
  text: For God created man for incorruptibility[b][a], and made him in the image of his own nature.
translation:
  language: de
  text: Denn Gott erschuf den Menschen zur Unvergänglichkeit[a] und machte ihn zum Abbild seines eigenen Wesens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Unsterblichkeit“ oder „zur Unverderblichkeit“. Das griechische Wort bezeichnet, dass etwas Verfall, Verderben oder Tod nicht unterworfen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Abbild dessen, was Gott selbst eigen ist“ beziehungsweise „zum Abbild seines eigenen Seins“. Die griechische Wendung ist ungewöhnlich und lässt mehrere eng verwandte Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισε
  choice: erschuf
  rationale: Das Verb bezeichnet hier Gottes schöpferisches Hervorbringen; „erschuf“ gibt dies im Deutschen klar und würdig wieder.
- source_word: τὸν ἄνθρωπον
  choice: den Menschen
  rationale: Der artikulierte Singular bezeichnet den Menschen repräsentativ und schließt die Menschheit ein, ohne die grammatische Einzahl aufzulösen.
- source_word: ἐπʼ ἀφθαρσίᾳ
  choice: zur Unvergänglichkeit
  rationale: ἀφθαρσία bezeichnet einen Zustand, der Verfall und Verderben nicht unterworfen ist; „Unvergänglichkeit“ bewahrt diesen weiteren Sinn besser als das stärker auf Todlosigkeit zugespitzte „Unsterblichkeit“.
- source_word: εἰκόνα
  choice: zum Abbild
  rationale: „Abbild“ bewahrt den Bezug zur Schöpfungs- und Bildtheologie. Die Konstruktion „jemanden zum Abbild machen“ ist im Deutschen natürlich und gibt das prädikative Verhältnis wieder.
- source_word: τῆς ἰδίας ἰδιότητος
  choice: seines eigenen Wesens
  rationale: Die ungewöhnliche Wortgruppe bezeichnet das Gott selbst Eigene beziehungsweise seine besondere Wesensart. „Seines eigenen Wesens“ ist verständlich, ohne die schwierige Wendung unnötig einzuengen.
- source_word: ἐποίησεν αὐτόν
  choice: machte ihn
  rationale: Die schlichte Wiedergabe erhält die Parallelität zum ersten Teilsatz und entspricht der gewöhnlichen Bedeutung von ποιέω.
theological_decisions:
- issue: Anthropologischer Umfang von τὸν ἄνθρωπον
  choice: der repräsentative Singular „den Menschen“
  alternative: „die Menschheit“ oder „das menschliche Wesen“
  rationale: Die Aussage gilt der Menschheit, ist aber im Griechischen als repräsentativer Singular formuliert. Das deutsche „den Menschen“ erhält beides.
- issue: Bedeutung von ἀφθαρσία
  choice: Unvergänglichkeit
  alternative: Unsterblichkeit oder Unverderblichkeit
  rationale: Der Ausdruck umfasst Freiheit von Verfall, Verderben und Tod. „Unvergänglichkeit“ bewahrt diese Breite und legt keine engere Lehre über eine von sich aus unsterbliche Seele fest.
- issue: Sinn von τῆς ἰδίας ἰδιότητος
  choice: seines eigenen Wesens
  alternative: seiner eigenen Besonderheit oder seines eigenen Seins
  rationale: Die griechische Formulierung ist selten und mehrdeutig. Die Hauptfassung ist gut verständlich; die Fußnote hält die lexikalische Spannung offen und vermeidet eine dogmatische Präzisierung über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Denn“ nimmt ὅτι als begründende Fortführung des Zusammenhangs auf. „Den Menschen“ ist inklusiv und zugleich quellennah; „zum Abbild“ klingt natürlicher als eine starre Nachbildung der griechischen Syntax.
