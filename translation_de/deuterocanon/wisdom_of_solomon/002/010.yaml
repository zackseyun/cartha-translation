base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/010.yaml
  text: Let us oppress the righteous poor man[a]; let us not spare the widow[b], nor show regard for the gray hairs of an old man advanced in years.
translation:
  language: de
  text: Lasst uns den gerechten Armen unterdrücken[a], die Witwe nicht verschonen und vor den grauen Haaren eines hochbetagten Mannes keine Achtung haben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den armen Gerechten“. Im Griechischen beziehen sich „arm“ und „gerecht“ auf dieselbe Person; die unterschiedliche Gewichtung bleibt möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und uns vor den grauen Haaren eines alten Mannes von vielen Jahren nicht scheuen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταδυναστεύσωμεν
  choice: Lasst uns ... unterdrücken
  rationale: Das Verb bezeichnet die gewaltsame oder rücksichtslose Ausübung von Macht über jemanden; „unterdrücken“ bewahrt diesen Zwangscharakter und klingt im Deutschen natürlich.
- source_word: πένητα δίκαιον
  choice: den gerechten Armen
  rationale: Beide Akkusativformen beziehen sich eng auf dieselbe männliche Einzelperson. „Armen“ gibt πένητα substantivisch wieder, während „gerecht“ den moralischen Kontrast des Zusammenhangs wahrt.
- source_word: μὴ φεισώμεθα χήρας
  choice: die Witwe nicht verschonen
  rationale: φείδομαι bedeutet hier, jemanden zu schonen beziehungsweise von einer Schädigung abzusehen. Der generische Singular bezeichnet die Witwe als Vertreterin einer besonders schutzbedürftigen Gruppe.
- source_word: μηδὲ ... ἐντραπῶμεν
  choice: und keine Ehrfurcht vor ... haben
  rationale: ἐντρέπομαι kann Scham, Achtung oder ehrfürchtige Scheu ausdrücken. Angesichts des grauen Haares als Zeichen hohen Alters steht hier die verweigerte Achtung im Vordergrund.
- source_word: πρεσβύτου ... πολιάς πολυχρονίους
  choice: vor dem grauen Haar eines hochbetagten Mannes
  rationale: Die konkrete Metonymie des grauen Haares bleibt erhalten; „hochbetagt“ gibt die durch πολυχρονίους verstärkte Altersangabe idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von δίκαιον im Gegensatz zwischen den Frevlern und ihrem Opfer
  choice: gerecht
  alternative: rechtschaffen
  rationale: „Gerecht“ wahrt die Verbindung zum Wortfeld δίκαιος/δικαιοσύνη und lässt dessen ethisch-religiöse sowie auf Gerechtigkeit bezogene Bedeutungsbreite offen.
- issue: Bedeutung von ἐντραπῶμεν gegenüber dem Zeichen hohen Alters
  choice: keine Ehrfurcht ... haben
  alternative: keine Rücksicht ... nehmen; uns nicht scheuen
  rationale: Die Übersetzung hebt die sozial und moralisch gebotene Achtung vor hohem Alter hervor, ohne das Verb auf bloß inneres Schamgefühl zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hortative Reihung wird mit „Lasst uns“ eröffnet und in den folgenden Gliedern knapp fortgeführt. Das konkrete Bild des grauen Haares bleibt erhalten; „hochbetagt“ vermeidet eine schwerfällige wörtliche Wiederholung.
