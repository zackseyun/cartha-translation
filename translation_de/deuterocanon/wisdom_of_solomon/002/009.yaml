base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/009.yaml
  text: Let none of us be without a share in our revelry; everywhere let us leave tokens of our merriment[a], because this is our portion, and this our lot.
translation:
  language: de
  text: Keiner von uns soll ohne Anteil an unserem ausgelassenen Treiben[a] sein. Überall wollen wir Zeichen unserer Fröhlichkeit hinterlassen, denn das ist unser Anteil und dies unser Los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unseres Stolzes«, »unseres Hochmuts« oder »unseres Übermuts«. Das entsprechende griechische Wort kann hochmütige Selbstüberhebung bezeichnen; im Zusammenhang ist jedoch ausgelassene, selbstbezogene Fröhlichkeit gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμοιρος
  choice: ausgeschlossen
  rationale: Das Adjektiv bezeichnet jemanden, der keinen Anteil an etwas hat. In Verbindung mit dem Genitiv gibt »von … ausgeschlossen« den Sinn im Deutschen natürlich wieder.
- source_word: ἀγερωχίας
  choice: ausgelassenes Treiben
  rationale: Im Zusammenhang der Aufforderung zu Genuss und Vergnügen bezeichnet das Wort am ehesten eine übermütige, selbstbezogene Ausgelassenheit. Die Wiedergabe bewahrt den festlichen und zugleich moralisch fragwürdigen Ton.
- source_word: πανταχῇ
  choice: überall
  rationale: Direkte und natürliche Wiedergabe des Ortsadverbs.
- source_word: καταλίπωμεν
  choice: wollen wir … hinterlassen
  rationale: Der hortative Konjunktiv wird durch die deutsche Aufforderungsform mit »wollen wir« wiedergegeben; »hinterlassen« betont bleibende Spuren.
- source_word: σύμβολα
  choice: Zeichen
  rationale: Das Wort bezeichnet erkennbare Zeichen oder Kennzeichen; »Zeichen« ist hier idiomatisch und lässt offen, welcher Art diese Spuren sind.
- source_word: εὐφροσύνης
  choice: Fröhlichkeit
  rationale: Gemeint ist im Kontext festliche Freude beziehungsweise Vergnügen, nicht notwendig geistliche Freude.
- source_word: μερὶς
  choice: Anteil
  rationale: Bewahrt das Bild eines zugewiesenen Teils und den Bezug zum vorherigen Gedanken des Teilhabens.
- source_word: κλῆρος
  choice: Los
  rationale: Gibt die Vorstellung eines zugefallenen oder zugewiesenen Geschicks knapp wieder und wahrt den Parallelismus mit »Anteil«.
theological_decisions:
- issue: Bedeutung von ἀγερωχίας in der Rede der Gottlosen
  choice: unser ausgelassenes Treiben
  alternative: unser Stolz / unser Hochmut / unser Übermut
  rationale: Der unmittelbare Kontext handelt vom gemeinsamen Genuss vergänglicher Freuden. Daher passt eine Bezeichnung ausgelassener Selbstvergnügung am besten. Weil das griechische Wort auch Stolz oder Hochmut ausdrücken kann, wird diese echte Mehrdeutigkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt als gemeinschaftliche, hedonistische Aufforderung hörbar. »Anteil« und »Los« bewahren den pointierten Parallelismus des griechischen Schlusses.
