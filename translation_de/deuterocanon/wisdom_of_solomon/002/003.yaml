translation:
  language: de
  text: Wenn es erlischt, wird der Körper zu Asche, und der Geist[a] wird sich wie dünne Luft[b] zerstreuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Atem“ oder „Lebenshauch“. Das griechische Wort kann hier diese Bedeutungen ebenso wie „Geist“ tragen.'
    reason: lexical_alternative
  - marker: b
