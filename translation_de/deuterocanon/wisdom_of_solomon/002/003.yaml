    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ σβεσθέντος
  choice: Wenn dieser erlischt
  rationale: Der Genitivus absolutus bezeichnet das Erlöschen dessen, worauf das Relativpronomen im vorangehenden Bild zurückweist. „Dieser“ hält den Rückbezug offen und bewahrt die Metapher des Erlöschens.
- source_word: τέφρα ἀποβήσεται
  choice: wird zu Asche
  rationale: ἀποβαίνω bezeichnet hier das Werden beziehungsweise den Ausgang; die singularische Form „Asche“ entspricht τέφρα und klingt im Deutschen natürlich.
- source_word: τὸ σῶμα
  choice: der Körper
  rationale: Direkte Wiedergabe des griechischen Substantivs mit Artikel, ohne „Leichnam“ oder ein possessives Element hinzuzufügen.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: πνεῦμα kann Geist, Atem oder Lebenshauch bedeuten. „Geist“ wahrt die Gegenüberstellung mit dem Körper, während eine Fußnote die hier mitschwingende Atembedeutung offenhält.
- source_word: διαχυθήσεται
  choice: wird sich zerstreuen
  rationale: Das Verb beschreibt ein Auseinanderfließen oder Sichverteilen. Die reflexive deutsche Form gibt die Diffusion in der Luft natürlich wieder, ohne einen handelnden Urheber einzuführen.
- source_word: ὡς χαῦνος ἀήρ
  choice: wie dünne Luft
  rationale: χαῦνος bezeichnet etwas Lockeres, Leichtes oder Substanzloses. „Dünne Luft“ bewahrt das Luftbild und vermittelt die geringe Stofflichkeit und schnelle Zerstreuung.
theological_decisions:
- issue: Anthropologische Bedeutung von πνεῦμα in der skeptischen Rede über den Tod
  choice: Geist
  alternative: Atem; Lebenshauch
  rationale: „Geist“ erhält die im Griechischen erkennbare Spannung zwischen Körper und πνεῦμα, ohne daraus eine Aussage über eine unsterbliche Seele abzuleiten. Das Bild der sich zerstreuenden Luft gibt weiterhin die Sicht der hier redenden Gottlosen wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Bildsprache und die futurische Aussage des griechischen Textes bleiben erhalten; konfessionell festgelegte Anthropologie wird vermieden.
