  text: But let our strength be the law of justice[a], for what is weak is shown to be useless.
translation:
  language: de
  text: Doch unsere Stärke soll das Gesetz der Gerechtigkeit[a] sein; denn das Schwache wird als nutzlos erwiesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Rechtschaffenheit“. Das griechische Wort δικαιοσύνη kann sowohl Gerechtigkeit als auch sittliche Rechtschaffenheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω
  choice: soll … sein
  rationale: Der Imperativ der dritten Person von εἰμί formuliert hier einen auffordernden Grundsatz; „soll … sein“ gibt ihn im Deutschen natürlich und bestimmt wieder.
- source_word: ἰσχὺς
  choice: Stärke
  rationale: ἰσχύς bezeichnet Stärke oder Macht. „Stärke“ bewahrt den allgemeinen Sinn, ohne ihn vorschnell auf politische oder militärische Gewalt einzuengen.
- source_word: νόμος
  choice: Gesetz
  rationale: νόμος bezeichnet ein Gesetz oder eine maßgebende Norm. „Gesetz“ erhält die provozierende Behauptung, die eigene Stärke solle bestimmen, was als gerecht gilt.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: δικαιοσύνη umfasst im Deutschen sowohl Gerechtigkeit als auch gerechtes Handeln beziehungsweise Rechtschaffenheit. Im Zusammenhang einer gesellschaftlichen Norm ist „Gerechtigkeit“ am natürlichsten; die weitere Bedeutung wird in der Fußnote bewahrt.
- source_word: τὸ ἀσθενὲς
  choice: das Schwache
  rationale: Das substantivierte Neutrum bezeichnet allgemein das, was schwach ist, und nicht ausdrücklich schwache Menschen. „Das Schwache“ erhält diese Verallgemeinerung.
- source_word: ἄχρηστον
  choice: nutzlos
  rationale: ἄχρηστος bedeutet unbrauchbar oder ohne Nutzen. „Nutzlos“ gibt die zynische Wertung der Sprecher klar und knapp wieder.
- source_word: ἐλέγχεται
  choice: erweist sich
  rationale: ἐλέγχω kann aufdecken, nachweisen oder überführen bedeuten. Im vorliegenden prädikativen Satz drückt „erweist sich“ idiomatisch aus, dass das Schwache als nutzlos zutage tritt, ohne eine unnötig gerichtliche Färbung einzutragen.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη im Weisheitskontext
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ passt zur Rede von einem Gesetz und zur zynischen Umdeutung des Rechts durch die Gottlosen. Da δικαιοσύνη zugleich sittliche Rechtschaffenheit bezeichnen kann, wird diese echte Bedeutungsweite in einer Fußnote genannt.
- issue: Bezug von τὸ ἀσθενές
  choice: 'unpersönlich und allgemein: „das Schwache“'
  alternative: 'personenbezogen: „die Schwachen“'
  rationale: Das griechische substantivierte Adjektiv steht im Neutrum Singular. Die Übersetzung wahrt daher den allgemeinen Grundsatz und legt ihn nicht ausschließlich auf schwache Menschen fest, auch wenn diese im Kontext mitgemeint sein können.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappe, zynische Maxime der Gottlosen bleibt erhalten; „Gesetz der Gerechtigkeit“ ist bewusst spannungsvoll formuliert.
