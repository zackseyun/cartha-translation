  source_fidelity: 'Der Entwurf gibt die wesentlichen Aussagen des Griechischen zuverlässig wieder: die fehlerhafte Überlegung der Sprecher, die Kürze und Leidhaftigkeit des Lebens, die fehlende Abhilfe am menschlichen Ende sowie die behauptete fehlende Rückkehr aus dem Hades. „Zurückgekehrt“ ist im Kontext von ἐξ ᾅδου eine tragfähige idiomatische Sinnwiedergabe, sollte aber durch die Fußnote als kontextuelle Auslegung der weiteren Wortbedeutung kenntlich bleiben.'
  naturalness: „Sie sagten bei sich und urteilten dabei nicht richtig“ wirkt im modernen Deutsch syntaktisch schwerfällig und verbindet das partizipiale λογισάμενοι zu eng mit einem zweiten finiten Verb. Auch „am Ende eines Menschen“ ist zwar nahe am griechischen Wortlaut, im Fließtext aber unnötig ungewohnt. „Menschenleben“ formuliert den gemeinten generischen Bezug idiomatisch, ohne den Sinn festzulegen, den τελευτή offenlässt.
  terminology: „leidvoll“, „Heilung“ und „Hades“ sind quellennahe und im würdigen Register angemessen. Der generische Singular wird mit „eines Menschenlebens“ geschlechtsgerecht und semantisch präzise wiedergegeben. Die Fußnote zu ἀναλύσας sollte nicht den Eindruck erwecken, alle genannten deutschen Verben seien gleichwertige unmittelbare Bedeutungen in diesem Kontext.
