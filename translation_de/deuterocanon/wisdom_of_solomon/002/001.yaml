base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/001.yaml
  text: For they said among themselves[a], reasoning wrongly, “Our life is short and sorrowful, and there is no remedy at the end of a man's life[b], and no one has been known to return from Hades.”
translation:
  language: de
  text: 'Denn sie sagten bei sich selbst in falscher Überlegung: »Kurz und leidvoll ist unser Leben; am Ende eines Menschenlebens[a] gibt es keine Heilung, und niemand ist bekannt, der aus dem Hades zurückgekehrt wäre.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Ende eines Menschen“; der griechische Singular bezeichnet allgemein das Ende menschlichen Lebens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, näher am griechischen Partizip: „der aus dem Hades losgekommen ist“. Das Wort kann Losmachen oder Fortgehen bezeichnen; mit „aus dem Hades“ liegt eine Rückkehr aus dem Totenreich nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτοῖς
  choice: bei sich
  rationale: Die Wendung bezeichnet ihr Reden bzw. Überlegen im eigenen Kreis. „Bei sich“ ist natürlich und lässt offen, ob jeder innerlich oder sie untereinander redeten.
- source_word: λογισάμενοι οὐκ ὀρθῶς
  choice: und urteilten dabei nicht richtig
  rationale: Das Partizip beschreibt begleitend bzw. begründend ihr verfehltes Denken. „Urteilen“ bewahrt den rationalen und wertenden Gehalt von λογίζομαι, ohne die Aussage unnötig zu moralisieren.
- source_word: ὀλίγος ... ὁ βίος
  choice: Kurz ... ist unser Leben
  rationale: Bei βίος bezeichnet ὀλίγος die geringe Lebensdauer; „kurz“ ist im Deutschen die idiomatische Entsprechung.
- source_word: λυπηρός
  choice: leidvoll
  rationale: Das Wort umfasst Kummer, Schmerz und Bedrängnis. „Leidvoll“ ist knapp, würdevoll und breiter als eine rein körperliche Deutung.
- source_word: ἴασις
  choice: Heilung
  rationale: „Heilung“ gibt die Grundbedeutung von ἴασις wieder und bewahrt das im griechischen Text verwendete Bild, auch wenn „Abhilfe“ kontextuell möglich wäre.
- source_word: ἐν τελευτῇ ἀνθρώπου
  choice: am Ende eines Menschen
  rationale: Die Formulierung bleibt nahe am generischen Singular des Griechischen und bewahrt die knappe Rede vom menschlichen Ende, statt τελευτή ausdrücklich als Tod oder Lebensende festzulegen.
- source_word: ἐγνώσθη
  choice: ist bekannt
  rationale: Das Passiv bezeichnet, dass aus menschlicher Erfahrung kein entsprechender Fall bekannt geworden ist. Das deutsche Präsens mit resultativem Sinn passt zur allgemeinen Behauptung.
- source_word: ὁ ἀναλύσας ἐξ ᾅδου
  choice: der aus dem Hades zurückgekehrt wäre
  rationale: Mit ἐξ ᾅδου bezeichnet das Partizip im Zusammenhang eine Bewegung aus dem Totenreich heraus. „Zurückgekehrt“ gibt den gemeinten Sinn idiomatisch wieder; die offenere Grundbedeutung wird in der Fußnote genannt.
- source_word: ᾅδης
  choice: Hades
  rationale: Die Transliteration erhält die ausdrückliche Bezeichnung des griechischen Totenreichs und verengt sie weder auf das Grab noch identifiziert sie mit der Hölle.
theological_decisions:
- issue: Generischer Singular ἀνθρώπου
  choice: eines Menschen
  alternative: des Menschen / am Lebensende eines Menschen
  rationale: „Eines Menschen“ gibt den generischen Singular geschlechtsgerecht und quellennah wieder. Die Fußnote erläutert, dass die Formulierung allgemein die menschliche Sterblichkeit betrifft.
- issue: Bedeutung von ᾅδης
  choice: Hades
  alternative: Totenreich / Grab
  rationale: „Hades“ wahrt die Begriffswelt des griechischen Textes. „Grab“ wäre enger, während „Totenreich“ bereits eine erklärende Wiedergabe darstellt.
- issue: Aussage über eine Rückkehr aus dem Hades
  choice: niemand ist bekannt, der ... zurückgekehrt wäre
  alternative: niemand wurde erkannt, der ... losgekommen wäre
  rationale: Die Übersetzung stellt die Aussage als Urteil der zuvor ausdrücklich als fehlgehend bezeichneten Sprecher dar und macht daraus keine bestätigte Lehraussage des Erzählers. Der Erkenntnisvorbehalt von ἐγνώσθη bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp und rhythmisch gestaltet; „leidvoll“, „Heilung“ und „Hades“ bewahren die Bild- und Begriffswelt des griechischen Textes. Die einleitende Bewertung macht deutlich, dass die folgenden Sätze die verfehlte Überlegung der Sprecher wiedergeben.
