    issue: „niedergedrückt“ für βαρυνθεῖσα
    rationale: Die Wiedergabe ist möglich, klingt aber unnötig körperlich und eng. „Beschwert“ bewahrt die Metapher des Schwer-Machens offener.
  - severity: low
    issue: Interpretierende Zuspitzung in Fußnote b
    rationale: Die Wendung „und vergeht“ erklärt das Bild stärker aus, als der Text es an dieser Stelle ausdrücklich sagt. Die Fußnote sollte bei der ungewöhnlichen Metapher bleiben.
