  source_fidelity: Die Grundstruktur und die Bilderfolge entsprechen dem Griechischen. Das Futurpassiv ἐπιλησθήσεται wird jedoch genauer durch „wird ... vergessen werden“ wiedergegeben als durch das resultative „wird ... vergessen sein“. Die auf den Nebel bezogenen Partizipien διωχθεῖσα und βαρυνθεῖσα bleiben als Relativsatz erkennbar.
  naturalness: Der Vers ist insgesamt idiomatisch und würdig. „Beschwert“ ist für βαρυνθεῖσα sowohl näher am Bild des griechischen Textes als auch im Deutschen weniger konkret-mechanisch als „niedergedrückt“.
  terminology: „Werke“, „vorüberziehen“, „Spur einer Wolke“ und „Nebel“ sind angemessen. Die Fußnote zu a erläutert den griechischen Plural sinnvoll; Fußnote b sollte die Metapher erläutern, ohne das im Text stehende Bild durch die zusätzliche Deutung „vergeht“ zu ersetzen.
  issues:
