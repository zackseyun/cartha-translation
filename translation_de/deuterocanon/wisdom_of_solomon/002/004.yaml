    issue: Resultativer Ersatz des Futurpassivs
    rationale: '„wird unser Name vergessen sein“ kann nahelegen, dass der Name zu einem zukünftigen Zeitpunkt bereits vergessen ist. ἐπιλησθήσεται ist schlicht futurisches Passiv: „wird ... vergessen werden“.'
