base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/004.yaml
  text: and our name will be forgotten in time[a], and no one will remember our works; and our life will pass by like the trace of a cloud, and will be scattered like mist[b], driven off by the sun’s rays and weighed down by its heat.
translation:
  language: de
  text: Und mit der Zeit wird unser Name vergessen werden, und niemand wird sich an unsere Werke erinnern; unser Leben wird vorüberziehen wie die Spur einer Wolke[a] und sich wie Nebel zerstreuen, der von den Strahlen der Sonne vertrieben und von ihrer Hitze beschwert wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie die Spuren einer Wolke“. Gemeint ist ein flüchtiges Zeichen, das rasch verschwindet.'
    reason: lexical_alternative
  - marker: b
    text: „Beschwert“ gibt die wörtliche Vorstellung von βαρυνθεῖσα („schwer gemacht, beschwert“) wieder. Die ungewöhnliche Metapher beschreibt den Nebel unter der Einwirkung der Sonnenhitze.
    reason: source_metaphor
lexical_decisions:
- source_word: ἐπιλησθήσεται ἐν χρόνῳ
  choice: mit der Zeit wird … vergessen sein
  rationale: Gibt das Futur Passiv und den allgemeinen zeitlichen Verlauf idiomatisch wieder, ohne eine bestimmte Frist anzunehmen.
- source_word: μνημονεύσει τῶν ἔργων ἡμῶν
  choice: wird sich an unsere Werke erinnern
  rationale: Im Parallelismus zum Vergessen steht das Erinnern im Vordergrund; „Werke“ bewahrt die Breite von ἔργα.
- source_word: παρελεύσεται ὁ βίος ἡμῶν
  choice: unser Leben wird vorüberziehen
  rationale: „Vorüberziehen“ erhält sowohl den Vergänglichkeitsgedanken als auch die Bewegungsbildlichkeit des folgenden Vergleichs.
- source_word: ἴχνη νεφέλης
  choice: die Spur einer Wolke
  rationale: Das deutsche Kollektiv „Spur“ bildet die flüchtige Hinterlassenschaft einer Wolke natürlicher ab; der griechische Plural wird in einer Fußnote kenntlich gemacht.
- source_word: ὁμίχλη διασκεδασθήσεται
  choice: wird sich zerstreuen wie Nebel
  rationale: Die deutsche reflexive Form gibt das griechische Passiv natürlich wieder; „Nebel“ passt zum Bild eines vom Sonnenlicht aufgelösten Dunstes.
- source_word: διωχθεῖσα ὑπὸ ἀκτίνων ἡλίου
  choice: von den Strahlen der Sonne vertrieben
  rationale: Bewahrt die passive Gewalt des Partizips und die konkrete Ursache der Zerstreuung.
- source_word: ὑπὸ θερμότητος αὐτοῦ βαρυνθεῖσα
  choice: von ihrer Hitze niedergedrückt
  rationale: Erhält die ungewöhnliche Schwere- beziehungsweise Druckmetaphorik von βαρυνθεῖσα, statt sie stillschweigend als bloßes Auflösen zu erklären.
