translation:
  language: de
  text: Denn sein Leben ist anders als das der übrigen[a], und seine Pfade sind anders geartet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn seine Lebensführung ist anders als die der übrigen, und seine Pfade sind anders geartet.“'
    reason: βίος kann hier ausdrücklich die Lebensführung beziehungsweise Lebensweise bezeichnen.
lexical_decisions:
- source_word: ἀνόμοιος
  choice: anders als
  rationale: Gibt die vergleichende Bedeutung „unähnlich, verschieden von“ im modernen Deutsch natürlich wieder.
- source_word: βίος
  choice: Leben
  rationale: Bewahrt die direkte Bedeutung; im Zusammenhang bezeichnet das Wort zugleich die Lebensführung.
- source_word: ἐξηλλαγμέναι
  choice: ungewöhnlich
  rationale: Bezeichnet hier den auffällig andersartigen Zustand der Pfade. „Verändert“ wäre zwar formnäher, könnte im Deutschen aber irreführend ein ausdrücklich genanntes früheres Stadium voraussetzen.
- source_word: τρίβοι
  choice: Pfade
  rationale: Erhält das konkrete Wegbild für Lebensführung und Verhalten.
theological_decisions:
- issue: Ob die ethische Bedeutung von βίος und τρίβοι ausdrücklich zu entfalten ist
  choice: Die Bildsprache „Leben“ und „Pfade“ bleibt im Haupttext erhalten.
  alternative: Denn seine Lebensführung unterscheidet sich von der der übrigen, und sein Verhalten ist anders.
  rationale: Der griechische Text beschreibt die Andersartigkeit des Gerechten mit gewöhnlichen Begriffen und einem Wegbild; eine ausdrückliche Moralisierung würde mehr festlegen als der Wortlaut.
- issue: Ob ἐξηλλαγμέναι als vorausgehende Veränderung oder als gegenwärtige Andersartigkeit wiederzugeben ist
  choice: ungewöhnlich
  alternative: verändert
  rationale: Das Perfekt bezeichnet einen bestehenden, durch Abweichung geprägten Zustand. Im Kontext steht der Kontrast zu anderen im Vordergrund, ohne dass ein früherer Lebensweg ausdrücklich geschildert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die übrigen“ hält den Bezug allgemein und „Pfade“ bewahrt die metaphorische Sprache des griechischen Textes.
