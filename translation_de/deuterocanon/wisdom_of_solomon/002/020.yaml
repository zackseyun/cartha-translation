translation:
  language: de
  text: Verurteilen wir ihn zu einem schändlichen Tod, denn aufgrund seiner Worte wird man nach ihm sehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er wird Fürsorge erfahren“, „denn er wird Rechtfertigung erfahren“ oder „denn an dem, was ihm widerfährt, werden seine Worte geprüft“. Das griechische Wort kann ein Nachsehen, Fürsorge oder göttliches Eingreifen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θανάτῳ ἀσχήμονι
  choice: zu einem schändlichen Tod
  rationale: Der Dativ bezeichnet bei καταδικάζω die verhängte Strafe. „Schändlich“ gibt die mit ἀσχήμων verbundene Unehre in würdigem, verständlichem Deutsch wieder.
- source_word: καταδικάσωμεν
  choice: Verurteilen wir
  rationale: Der hortative Konjunktiv der ersten Person Plural und der gerichtliche Sinn des Verbs bleiben erhalten.
- source_word: ἐπισκοπή
  choice: Heimsuchung
  rationale: Das Wort kann prüfende Zuwendung, Aufsicht oder göttliches Eingreifen bezeichnen. „Heimsuchung“ bewahrt diese Offenheit besser als eine eindeutige Festlegung auf Fürsorge, Rechtfertigung oder Bestrafung.
- source_word: ἐκ λόγων αὐτοῦ
  choice: nach seinen Worten
  rationale: Die knappe Wendung wahrt den möglichen Bezug auf das, was er gesagt hat, ohne die genaue Beziehung zwischen Worten und bevorstehendem Geschehen stärker als das Griechische festzulegen.
theological_decisions:
- issue: Bedeutung von ἐπισκοπή im Blick auf den Anspruch des Gerechten, dass Gott für ihn eintritt
  choice: Heimsuchung
  alternative: Fürsorge, Rechtfertigung, Prüfung oder göttliches Eingreifen
  rationale: Der griechische Ausdruck lässt Art und Ausgang der göttlichen Zuwendung offen. Die Übersetzung erhält diese theologische Spannung, statt sie zugunsten von Rettung oder Gericht aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hortative Rede bleibt knapp und eindringlich; das bewusst mehrdeutige ἐπισκοπή wird im Haupttext nicht vereindeutigt.
