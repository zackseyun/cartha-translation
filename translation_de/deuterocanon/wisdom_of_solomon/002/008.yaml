translation:
  language: de
  text: Lasst uns uns mit Rosenknospen bekränzen, bevor sie verwelken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lasst uns uns mit Rosenblüten bekränzen, bevor sie verblühen.“ Das Griechische verbindet „Rosen“ mit einem Wort für Knospen oder Blütenkelche und zeichnet so das Bild frischer Rosenknospen oder -blüten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στεψώμεθα
  choice: Lasst uns bekränzen
  rationale: Der Aorist Konjunktiv ist hier hortativ. „Uns bekränzen“ gibt die festliche Selbstschmückung mit einem Kranz natürlich wieder.
- source_word: ῥόδων κάλυξιν
  choice: mit Rosenknospen
  rationale: Die Verbindung aus „Rosen“ und κάλυξ, das eine Knospe beziehungsweise einen Blütenkelch bezeichnen kann, meint am ehesten frische Rosenknospen oder Rosenblüten.
- source_word: πρὶν ἢ
  choice: bevor
  rationale: Die temporale Verbindung bezeichnet den Zeitpunkt, dem die Handlung zuvorkommen soll.
- source_word: μαρανθῆναι
  choice: sie verwelken
  rationale: Der Aorist Passiv Infinitiv von μαραίνω bezeichnet das Welken oder Verblühen; „verwelken“ bewahrt das konkrete Pflanzenbild.
