base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/015.yaml
  text: Fearsome tyrants will fear me when they hear[a]; among the multitude I will appear good[b], and in war courageous.
translation:
  language: de
  text: Furchterregende Tyrannen werden mich fürchten, wenn sie davon hören; unter den Vielen werde ich als gut[a] erscheinen und im Krieg als mutig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als gütig“, „als tüchtig“ oder „als wohltätig“. Das griechische Wort kann hier neben allgemeiner Güte auch die praktische Güte eines Herrschenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθήσονταί με
  choice: werden mich fürchten
  rationale: Die futurische deponentische Form mit dem Akkusativ με bezeichnet unmittelbar, dass die Tyrannen den Sprecher fürchten werden. Die knappe Wiedergabe bewahrt diese direkte Aussage.
- source_word: ἀκούσαντες
  choice: wenn sie davon hören
  rationale: Das Aoristpartizip ist temporal zu verstehen. Da im Griechischen kein Gegenstand des Hörens genannt wird, verweist „davon“ zurückhaltend auf das Bekanntwerden des Sprechers, ohne einen konkreteren Inhalt festzulegen.
- source_word: τύραννοι φρικτοί
  choice: furchterregende Tyrannen
  rationale: φρικτοί charakterisiert die Tyrannen als solche, die Schrecken oder Schauder hervorrufen. „Furchterregend“ erhält zugleich das Wortspiel mit ihrem eigenen Fürchten.
- source_word: ἐν πλήθει
  choice: unter den Vielen
  rationale: Die Wendung bezeichnet das öffentliche Auftreten inmitten einer größeren Zahl von Menschen, ohne sie vorschnell als förmliche Versammlung zu bestimmen.
- source_word: φανούμαι
  choice: werde ich … erscheinen
  rationale: Das Futur von φαίνω lässt offen, ob die Wahrnehmung durch andere oder das Hervortreten des Sprechers im Vordergrund steht; „erscheinen“ bewahrt diese Offenheit.
- source_word: ἀγαθός
  choice: gut
  rationale: Das breite Adjektiv kann moralische Güte, Tüchtigkeit oder wohltätiges Handeln bezeichnen. „Gut“ legt die im politischen Zusammenhang mögliche Nuance nicht unnötig fest.
- source_word: ἐν πολέμῳ ἀνδρεῖος
  choice: im Krieg … mutig
  rationale: ἀνδρεῖος bezeichnet Tapferkeit und Mut. „Mutig“ ist im heutigen Deutsch natürlich und vermeidet die inzwischen missverständliche geschlechtliche Färbung von „mannhaft“.
theological_decisions:
- issue: Öffentliche Güte und kriegerischer Mut des Sprechers
  choice: 'Die beiden Eigenschaften werden unkommentiert nebeneinandergestellt: öffentliches Gutsein und Mut im Krieg.'
  alternative: Die Aussage könnte ausdrücklich als Idealbild königlicher Herrschaft oder als Verbindung von Wohltätigkeit und militärischer Tüchtigkeit gedeutet werden.
  rationale: Der griechische Text verbindet beide Tugenden, entwickelt daraus aber keine umfassende politische oder theologische Lehre. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Furcht“ in „furchterregende … fürchten“ bildet die pointierte griechische Formulierung nach. „Unter den Vielen“ bleibt bewusst weiter als „in der Volksversammlung“.
