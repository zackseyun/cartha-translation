  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Begriffe des Griechischen zuverlässig wieder: Die als φρικτοί charakterisierten Tyrannen fürchten den Sprecher; dessen öffentliches Erscheinen wird als gut und sein Verhalten im Krieg als mutig beschrieben. „Wenn sie davon hören“ macht den im Partizip ἀκούσαντες nicht ausdrücklich genannten Hörinhalt idiomatisch nachvollziehbar, ohne ihn inhaltlich festzulegen.'
  naturalness: Modernes, würdevolles Standarddeutsch. Die Wiederholung in „Furchterregende Tyrannen werden mich fürchten“ ist stilistisch markant, aber angesichts der griechischen Wortverbindung treffend. „Unter den Vielen“ ist leicht literarisch, jedoch natürlich genug und angemessen weit für ἐν πλήθει.
