  text: And if wealth is a desirable possession in life, what is richer than wisdom, which works all things?
translation:
  language: de
  text: Und wenn Reichtum im Leben ein begehrenswerter Besitz ist, was ist dann reicher als die Weisheit, die alles bewirkt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die alles vollbringt“ oder „die alles hervorbringt“. Der griechische Ausdruck ist weit gefasst und betont die wirksame Tätigkeit der Weisheit in allem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῦτός
  choice: Reichtum
  rationale: Bezeichnet materiellen Wohlstand oder Reichtümer; der Singular „Reichtum“ ist im Deutschen natürlich und erhält den Bezug zum Komparativ „reicher“.
- source_word: ἐπιθυμητὸν
  choice: begehrenswert
  rationale: Gibt den wertenden Sinn „begehrt, wünschenswert“ in gegenwärtigem, würdigem Deutsch wieder.
- source_word: κτῆμα
  choice: Besitz
  rationale: Bezeichnet etwas Erworbenes oder Besessenes; „Besitz“ passt idiomatisch zu „begehrenswert“.
- source_word: ἐν βίῳ
  choice: im Leben
  rationale: Bewahrt die knappe, nicht näher eingegrenzte Orts- beziehungsweise Lebensbereichsangabe des Griechischen.
- source_word: τί ... πλουσιώτερον
  choice: was ist dann reicher als
  rationale: Erhält die rhetorische Frage und die Wortverbindung zwischen πλοῦτος und πλουσιώτερον.
- source_word: σοφίας
  choice: die Weisheit
  rationale: Die übliche und kontextuell zentrale Wiedergabe von σοφία.
- source_word: τῆς τὰ πάντα ἐργαζομένης
  choice: die alles bewirkt
  rationale: „Bewirken“ drückt die wirksame Tätigkeit von ἐργάζομαι natürlich aus, ohne sie ausschließlich als Schöpfung, Herstellung oder Vollendung festzulegen.
theological_decisions:
- issue: Reichweite der Tätigkeit der Weisheit in τὰ πάντα ἐργαζομένης
  choice: die alles bewirkt
  alternative: die alles vollbringt; die alles hervorbringt
  rationale: Die Formulierung lässt der Weisheit umfassende Wirksamkeit zukommen, bestimmt diese aber nicht ausdrücklich als Schöpfung aus dem Nichts oder als eine andere eng umrissene metaphysische Tätigkeit. „Bewirkt“ erhält diese Weite und Spannung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Stil. Die Wiederaufnahme des Reichtumsmotivs durch „Reichtum“ und „reicher“ bleibt erhalten; „dann“ macht die Folgerung der rhetorischen Frage im Deutschen natürlich, ohne den Sinn zu erweitern.
