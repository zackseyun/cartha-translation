translation:
  language: de
  text: Im Urteil werde ich als scharfsinnig befunden werden[a], und vor den Mächtigen werde ich bewundert werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Im Gericht werde ich als scharfsinnig befunden werden.« Das griechische Passiv kann auch mit »erkannt werden« wiedergegeben werden.'
