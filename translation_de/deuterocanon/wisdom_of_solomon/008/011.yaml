    issue: Die Wiedergabe von εὑρεθήσομαι als »werde ich mich als … erweisen« ist reflexiv-aktiv.
    rationale: Das griechische Futurpassiv bezeichnet, dass die sprechende Person als scharfsinnig befunden bzw. erkannt wird; der Beurteilende bleibt unausgedrückt. Eine passive deutsche Form bewahrt dies genauer.
  - severity: low
    issue: Die zweite Fußnote nennt »Herrschern« nur als Möglichkeit, obwohl es im Deutschen die naheliegende Alternative zu »Mächtigen« ist.
    rationale: Die Fußnote kann knapper die lexikalische Bandbreite dokumentieren, ohne die Aussage zu verändern.
