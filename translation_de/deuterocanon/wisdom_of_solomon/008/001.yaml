  text: But she reaches mightily from one end to the other[a], and she governs all things well.
translation:
  language: de
  text: Doch sie erstreckt sich machtvoll von einem Ende bis zum anderen[a] und lenkt alles gut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „reicht machtvoll von einem Ende bis zum anderen“.'
