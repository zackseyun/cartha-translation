lexical_decisions:
- source_word: διατείνει
  choice: erstreckt sich
  rationale: Das Verb bezeichnet ein Ausgreifen oder Sich-Erstrecken über einen ganzen Bereich. „Erstreckt sich“ bewahrt das räumliche Bild und bleibt im modernen Deutsch verständlich.
- source_word: ἀπὸ πέρατος εἰς πέρας
  choice: von einem Ende bis zum anderen
  rationale: Die Wendung bezeichnet die vollständige Ausdehnung. Diese Formulierung ist natürlich und gibt die beiden äußersten Grenzen ausdrücklich wieder.
- source_word: εὐρώστως
  choice: machtvoll
  rationale: Das Adverb drückt Stärke, Kraft und wirksame Entfaltung aus. „Machtvoll“ passt zum hohen Stil und zur umfassenden Wirksamkeit der Weisheit.
- source_word: διοικεῖ
  choice: lenkt
  rationale: Das Verb umfasst Leiten, Verwalten und Ordnen. „Lenkt“ gibt die aktive, fortdauernde Leitung wieder, ohne im Deutschen bürokratisch zu klingen.
- source_word: τὰ πάντα
  choice: alles
  rationale: Die Formulierung bezeichnet die Gesamtheit. „Alles“ ist im Deutschen umfassend, idiomatisch und stilistisch passend.
- source_word: χρηστῶς
  choice: gut
  rationale: Das Adverb kann gute, angemessene und wohltätige Ausübung bezeichnen. „Gut“ erhält diese Bedeutungsbreite, ohne Güte oder Zweckrichtung einseitig festzulegen.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel führt den Gedanken mit leichter Gegenüberstellung oder Weiterführung fort. „Doch“ bewahrt diese Nuance in gehobenem, aber heutigem Deutsch.
- source_word: implizites feminines Subjekt (die Weisheit)
  choice: sie
  rationale: Das feminine Pronomen greift die im Zusammenhang personifizierte Weisheit auf und bewahrt die literarische Gestalt des griechischen Textes.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Das feminine Personalpronomen „sie“ wird beibehalten.
  alternative: Das Substantiv „die Weisheit“ wiederholen.
  rationale: Der Kontext stellt die Weisheit als feminin handelnde Gestalt dar. Das Pronomen bewahrt diese Personifikation, ohne darüber hinaus eine Aussage über ihre Hypostasierung oder eine spätere dogmatische Identifikation zu treffen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kosmische Spannweite und die Personifikation der Weisheit bleiben erhalten; „lenkt alles gut“ vermeidet sowohl bürokratische Färbung als auch eine überdeutete Aussage wie „führt alles zum Guten“.
