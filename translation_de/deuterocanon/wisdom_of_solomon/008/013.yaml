  text: And through her I will have immortality[b][a], and I will leave behind an everlasting remembrance to those after me.
translation:
  language: de
  text: Durch sie werde ich Unsterblichkeit haben[a][b] und denen, die nach mir kommen, eine ewige Erinnerung hinterlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ihr“. Das Pronomen bezieht sich auf die als Frau dargestellte Weisheit.'
    reason: lexical_alternative
  - marker: b
    text: „Unsterblichkeit“ kann persönliche Todlosigkeit meinen oder, im Zusammenhang mit dem folgenden Satzteil, ein Fortleben in bleibender Erinnerung; das Griechische legt das Verhältnis nicht eindeutig fest.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕξω
  choice: werde ich … erlangen
  rationale: Das Futur von ἔχω bezeichnet hier im Zusammenhang mit der Weisheit den künftigen Besitz beziehungsweise Gewinn. „Erlangen“ klingt im Deutschen natürlicher als das statische „haben“, ohne eine darüber hinausgehende Aussage über das Wie einzutragen.
- source_word: δὲ
  choice: und
  rationale: δέ verbindet hier mild mit dem vorherigen Gedankengang und markiert keinen deutlichen Gegensatz.
- source_word: αὐτὴν
  choice: durch sie
  rationale: Der femininen Akkusativ verweist auf die personifizierte Weisheit. „Durch sie“ gibt die im Kontext naheliegende instrumentale Beziehung idiomatisch wieder; die mögliche begleitende Lesart wird in der Fußnote offengehalten.
- source_word: ἀθανασίαν
  choice: Unsterblichkeit
  rationale: Dies ist die direkte und im Deutschen übliche Wiedergabe von ἀθανασία und bewahrt die Offenheit zwischen persönlicher Todlosigkeit und einem über den Tod hinausreichenden Fortbestand.
- source_word: μνήμην αἰώνιον
  choice: eine ewige Erinnerung
  rationale: Die Wendung bezeichnet ein dauerhaftes Erinnern beziehungsweise Andenken. „Ewige Erinnerung“ bleibt eng am griechischen Ausdruck und ist verständlich.
- source_word: τοῖς μετʼ ἐμὲ
  choice: den Menschen nach mir
  rationale: Der substantivierte Ausdruck bezeichnet diejenigen, die zeitlich nach dem Sprecher kommen. Die deutsche Formulierung gibt zugleich den Dativ wieder, ohne das allgemein menschliche Bezugsfeld unnötig auf eine bestimmte Gruppe zu verengen.
- source_word: ἀπολείψω
  choice: werde ich … hinterlassen
  rationale: Das Futur von ἀπολείπω bezeichnet hier, etwas für später Kommende zurückzulassen. „Hinterlassen“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung von „Unsterblichkeit“ im Verhältnis zur personifizierten Weisheit
  choice: Die Aussage, dass der Sprecher durch die Weisheit Unsterblichkeit erlangt, bleibt unverkürzt stehen.
  alternative: Ausschließlich persönliche Todlosigkeit oder ausschließlich Fortleben im bleibenden Ruhm
  rationale: Der Parallelismus mit der ewigen Erinnerung legt einen Bezug zum bleibenden Andenken nahe, setzt ἀθανασία aber nicht eindeutig damit gleich. Die Übersetzung wahrt daher die Spannung.
- issue: Art der Beziehung zwischen Weisheit und Unsterblichkeit
  choice: durch sie
  alternative: mit ihr
  rationale: Der bloße Akkusativ αὐτήν nach ἕξω kann formal auch als direktes Objekt verstanden werden, doch im Kontext wird die Weisheit als Ursache oder Vermittlerin der Unsterblichkeit aufgefasst. Eine Fußnote bewahrt die alternative Beziehung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Personifikation der Weisheit bleibt durch „sie“ sichtbar. Die Satzstruktur ist klar und nah am griechischen Parallelismus; beide Fußnotenmarker stehen im Haupttext.
