  text: And if anyone loves righteousness[a], her labors are virtues; for she teaches self-control and prudence, righteousness and courage[b], than which nothing is more useful for human beings in life.
translation:
  language: de
  text: Und wenn jemand die Gerechtigkeit[a] liebt, sind ihre Mühen Tugenden[b]; denn sie lehrt Selbstbeherrschung und Klugheit, Gerechtigkeit und Tapferkeit. Nichts ist den Menschen im Leben nützlicher als diese.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtschaffenheit“. Das griechische Wort kann sowohl sittliche Rechtschaffenheit als auch Gerechtigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihre Mühen sind Tugenden“. Die femininen Formulierungen „ihre“ und „sie“ stellen die Gerechtigkeit als Person dar.'
    reason: cultural_note
lexical_decisions:
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Der deutsche Begriff umfasst hier sowohl sittliche Rechtschaffenheit als auch gerechtes Handeln und lässt die Breite des griechischen Ausdrucks bestehen.
- source_word: ἀγαπᾷ
  choice: liebt
  rationale: Die direkte Wiedergabe bewahrt die persönliche und ethische Kraft des Verbs.
- source_word: οἱ πόνοι ταύτης
  choice: ihre Mühen
  rationale: Die Formulierung folgt dem griechischen Ausdruck eng und erhält durch das feminine Pronomen die Personifikation der Gerechtigkeit.
- source_word: ἀρεταί
  choice: Tugenden
  rationale: Im hellenistisch-ethischen Zusammenhang bezeichnet das Wort Tugenden beziehungsweise sittliche Vorzüge; die anschließende Aufzählung bestätigt diesen Sinn.
- source_word: σωφροσύνην
  choice: Selbstbeherrschung
  rationale: Der moderne, verständliche Ausdruck gibt die durch vernünftige Zurückhaltung geprägte Haltung wieder.
- source_word: φρόνησιν
  choice: Klugheit
  rationale: Gemeint ist praktische Einsicht beziehungsweise vernünftige Urteilskraft; „Klugheit“ passt natürlich in die Tugendaufzählung.
- source_word: ἀνδρείαν
  choice: Tapferkeit
  rationale: Der Ausdruck bezeichnet Mut oder Standhaftigkeit als Tugend; „Tapferkeit“ bewahrt den Charakter der klassischen Tugendaufzählung.
- source_word: χρησιμώτερον
  choice: nützlicher
  rationale: Der Komparativ wird direkt und in idiomatischem Deutsch wiedergegeben.
- source_word: ἐν βίῳ ἀνθρώποις
  choice: den Menschen im Leben
  rationale: Die Wendung erhält sowohl den Bezug auf alle Menschen als auch den Lebensbereich, in dem diese Tugenden nützlich sind.
theological_decisions:
- issue: Feminine Personifikation der Gerechtigkeit
  choice: „ihre Mühen“ und „sie lehrt“
  alternative: Unpersönliche Wiedergabe ohne feminine Bezüge
  rationale: Die griechischen femininen Formen führen die Gerechtigkeit als handelnde Gestalt vor Augen. Die Übersetzung bewahrt dieses literarisch-theologische Merkmal, ohne darüber hinaus eine dogmatische Identifizierung vorzunehmen.
- issue: Bedeutungsbreite von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ ist die natürliche deutsche Entsprechung und kann sowohl die sittliche Haltung als auch gerechtes Handeln bezeichnen; die alternative Nuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Aussage „ihre Mühen sind Tugenden“ bleibt bewusst nahe am griechischen Wortlaut, statt sie deutend als Früchte oder Ergebnisse ihrer Mühen aufzulösen. Die vier Tugendbegriffe werden klar und allgemein verständlich wiedergegeben.
