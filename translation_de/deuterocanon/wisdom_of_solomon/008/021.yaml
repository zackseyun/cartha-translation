base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/021.yaml
  text: 'But knowing that I would not otherwise be self-controlled unless God gave it—and that this also was insight[a], to know whose gift it was—I appealed to the Lord and implored him, and I said with my whole heart:'
translation:
  language: de
  text: 'Doch ich erkannte, dass ich nur dann selbstbeherrscht sein würde, wenn Gott es mir gäbe – und auch dies war Einsicht: zu wissen, wessen Gabe es war[a]. Ich wandte mich an den Herrn, flehte ihn an und sprach aus ganzem Herzen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wessen Gnade es war“ oder „wessen Gunst es war“. Das griechische Wort χάρις kann „Gnade“, „Gunst“ oder „Gabe“ bedeuten; hier bezeichnet es die von Gott gewährte Selbstbeherrschung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: ich erkannte
  rationale: Das Aoristpartizip bezeichnet die vorausgehende Erkenntnis des Sprechers. Die finite Form ergibt im Deutschen einen natürlichen und klaren Satzanschluss.
- source_word: οὐκ ἄλλως ἔσομαι ἐγκρατὴς ἐὰν μὴ ὁ θεὸς δῷ
  choice: dass ich nur dann selbstbeherrscht sein könnte, wenn Gott es mir gäbe
  rationale: Die Formulierung gibt die ausschließliche Bedingung idiomatisch wieder. „Selbstbeherrscht“ bezeichnet die Herrschaft über Begierden und Leidenschaften; das im Griechischen unausgesprochene Objekt wird als „es mir“ aus dem Zusammenhang ergänzt.
- source_word: καὶ τοῦτο δὲ ἦν φρονήσεως
  choice: und auch dies war Einsicht
  rationale: φρόνησις bezeichnet hier verständige Einsicht beziehungsweise praktische Weisheit. „Einsicht“ ist modern, verständlich und wahrt den Erkenntnischarakter.
- source_word: τὸ εἰδέναι τίνος ἡ χάρις
  choice: zu wissen, wessen Gabe es war
  rationale: χάρις bezeichnet im Zusammenhang die von Gott gewährte Befähigung. „Gabe“ macht den konkreten Geschenkcharakter deutlich; die Fußnote bewahrt die möglichen Bedeutungen „Gnade“ und „Gunst“.
- source_word: ἐνέτυχον τῷ κυρίῳ
  choice: Darum wandte ich mich an den Herrn
  rationale: ἐντυγχάνω bezeichnet hier die betende Hinwendung beziehungsweise Bitte an den Herrn. „Darum“ verdeutlicht den im Zusammenhang liegenden Folgerungszusammenhang, ohne die Aussage sachlich zu verändern.
- source_word: ἐδεήθην αὐτοῦ
  choice: flehte ihn an
  rationale: δέομαι drückt eine eindringliche Bitte aus; „flehte ihn an“ bewahrt diese Intensität.
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: aus ganzem Herzen
  rationale: Die geläufige deutsche Wendung gibt vollständige Aufrichtigkeit und Hingabe natürlich und würdig wieder.
theological_decisions:
- issue: Wiedergabe von χάρις als „Gabe“, „Gnade“ oder „Gunst“
  choice: Gabe
  alternative: Gnade; Gunst
  rationale: Im unmittelbaren Zusammenhang ist die Selbstbeherrschung etwas, das Gott gewährt. „Gabe“ vermittelt diesen konkreten Sinn, ohne χάρις vorschnell als theologischen Fachbegriff festzulegen; die Bedeutungsbreite bleibt in der Fußnote sichtbar.
- issue: Wiedergabe von κύριος im Gebetszusammenhang
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte und kontextgerechte Wiedergabe von κύριος in der Anrede beziehungsweise Hinwendung zu Gott.
- issue: Verhältnis von menschlicher Selbstbeherrschung und göttlicher Gewährung
  choice: Die Selbstbeherrschung wird ausdrücklich als von Gottes Gabe abhängig dargestellt
  alternative: Selbstbeherrschung als rein menschliche Leistung
  rationale: Die Konstruktion οὐκ ἄλλως … ἐὰν μή setzt Gottes Geben als notwendige Bedingung. Die Übersetzung bewahrt diese Spannung zwischen persönlicher Tugend und göttlicher Gewährung, ohne sie systematisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Einleitung zum folgenden Gebet offen und endet deshalb mit einem Doppelpunkt. „Selbstbeherrscht“ ist allgemein verständlich und vermeidet das altertümliche beziehungsweise enger konnotierte „enthaltsam“.
