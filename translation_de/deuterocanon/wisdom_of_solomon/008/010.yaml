translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »In der Öffentlichkeit« gibt die soziale Bedeutung von »unter Menschenmengen« idiomatisch wieder; »Ruhm« und »Ehre« bewahren zugleich den gehobenen Ton und die begriffliche Paarung des Griechischen.
