translation:
  language: de
  text: Ich werde, obwohl ich jung bin, unter den Menschenmengen Ruhm erlangen und bei den Älteren Ehre finden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Als junger Mann werde ich unter den Menschenmengen Ruhm erlangen und bei den Älteren Ehre finden.« Die gedrängte griechische Wendung ὁ νέος kann als Bezeichnung »der junge Mann« oder sinngemäß als Altersangabe »als junger Mann / obwohl ich jung bin« verstanden werden.'
    reason: Die syntaktisch gedrängte Altersangabe ὁ νέος wird als plausible konzessive Deutung übersetzt; die Fußnote bewahrt die alternative appositionale beziehungsweise statusbezogene Lesart.
lexical_decisions:
- source_word: ἕξω
  choice: werde ich … genießen / finden
  rationale: Das Futur von ἔχω bezeichnet hier den künftigen Besitz beziehungsweise die Erlangung öffentlichen Ansehens. Die beiden deutschen Verben vermeiden eine schwerfällige Wiederholung von »haben«.
- source_word: αὐτὴν
  choice: durch sie
  rationale: Das Pronomen verweist im Zusammenhang auf die Weisheit. Die instrumentale Wiedergabe bringt den gemeinten Zusammenhang idiomatisch zum Ausdruck; die gedrängte griechische Formulierung lässt sich im Deutschen nicht wortgleich natürlich wiedergeben.
- source_word: δόξαν
  choice: Ruhm
  rationale: δόξα bezeichnet hier öffentliches Ansehen oder Ruhm. »Ruhm« wahrt den gehobenen Ton und bleibt vom folgenden Begriff der Ehre unterscheidbar.
- source_word: ἐν ὄχλοις
  choice: in der Öffentlichkeit
  rationale: ὄχλοι meint Menschenmengen beziehungsweise die breite Öffentlichkeit. Die gewählte Formulierung gibt den gesellschaftlich-öffentlichen Sinn in natürlichem Deutsch wieder.
- source_word: τιμὴν
  choice: Ehre
  rationale: τιμή bezeichnet Ehre, Wertschätzung oder Ansehen. »Ehre« entspricht dem gehobenen Register und bildet ein passendes Gegenstück zu »Ruhm«.
- source_word: παρὰ πρεσβυτέροις
  choice: bei den Älteren
  rationale: παρά mit dem Dativ bezeichnet hier den Kreis, in dessen Gegenwart oder Urteil der Sprecher Ehre findet. »Bei den Älteren« bewahrt diese Offenheit.
- source_word: ὁ νέος
  choice: obwohl ich jung bin
  rationale: Die artikulierte Nominalphrase ist syntaktisch gedrängt und bezeichnet den Sprecher als jungen Mann. Die konzessive Wiedergabe macht den Gegensatz zwischen seiner Jugend und der Anerkennung durch Ältere natürlich verständlich.
