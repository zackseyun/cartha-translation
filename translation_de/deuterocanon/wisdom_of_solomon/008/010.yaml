    rationale: αὐτὴν steht unmittelbar bei δόξαν und ist nicht als feminines Objektpronomen zu verstehen, das auf die Weisheit zurückverweist. Der Zusatz verändert damit die syntaktische und semantische Aussage des Verses.
  - severity: low
    issue: „in der Öffentlichkeit“ ist weiter und abstrakter als ἐν ὄχλοις.
