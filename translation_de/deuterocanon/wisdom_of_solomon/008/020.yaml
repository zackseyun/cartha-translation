translation:
  language: de
  text: 'Vielmehr: Als guter Mensch kam ich in einen unbefleckten Körper.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „trat ich in einen unbefleckten Körper ein“. Das griechische Verb bedeutet wörtlich „kam“, kann hier aber im Sinn des Eintritts in das körperliche Leben verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: Mehr noch
  rationale: Die Wendung verstärkt beziehungsweise korrigiert die vorherige Aussage. „Mehr noch“ gibt diesen fortschreitend-korrigierenden Sinn im Deutschen natürlich wieder.
- source_word: ἀγαθὸς ὢν
  choice: weil ich gut war
  rationale: Das Partizip kann hier aufgrund des Zusammenhangs kausal verstanden werden. „Gut“ bewahrt die unmittelbare moralische Bedeutung von ἀγαθός, ohne sie durch „tugendhaft“ enger auszulegen.
- source_word: ἦλθον
  choice: kam ich
  rationale: Die Grundbedeutung des Aorists von ἔρχομαι ist „ich kam“. Diese Wiedergabe vermeidet es, die Vorstellung eines Eintritts einer präexistenten Seele ausdrücklich in den Text hineinzulegen.
- source_word: εἰς σῶμα
  choice: in einen Körper
  rationale: Die artikellose griechische Wendung wird unbestimmt wiedergegeben. „Körper“ ist hier natürlicher als „Leib“ und bleibt semantisch direkt.
- source_word: ἀμίαντον
  choice: unbefleckten
  rationale: „Unbefleckt“ bewahrt die Bedeutung von etwas Unverunreinigtem beziehungsweise Unbeflecktem sowie den biblischen Reinheitsklang des Adjektivs.
theological_decisions:
- issue: Mögliche Andeutung von Präexistenz oder Seelenwanderung in „kam ich in einen unbefleckten Körper“
  choice: Die Aussage wird nah am griechischen Wortlaut wiedergegeben, ohne die zugrunde liegende Anthropologie festzulegen.
  alternative: „trat ich in einen unbefleckten Körper ein“ oder eine ausdrückliche Deutung als Geburt mit einer reinen körperlichen Verfassung
  rationale: Der griechische Text sagt, dass der Sprecher, weil er gut war, in einen unbefleckten Körper kam. Die Übersetzung bewahrt diese Spannung und entscheidet nicht, ob damit Präexistenz, Geburt oder eine rhetorische Aussage gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt eng am knappen griechischen Satz und vermeidet eine konfessionelle oder philosophische Festlegung.
