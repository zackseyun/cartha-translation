base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/002.yaml
  text: I loved her and sought her out from my youth[a], and I sought to take her as my bride, and I became a lover of her beauty.
translation:
  language: de
  text: Sie habe ich geliebt und seit meiner Jugend eifrig gesucht. Ich suchte, sie mir zur Braut zu nehmen[a], und wurde zum Liebhaber ihrer Schönheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sie als Braut für mich zu nehmen“.'
    reason: Die Fußnote macht die reflexive Nuance von ἀγαγέσθαι ἐμαυτῷ sichtbar. „Zur Braut nehmen“ ist im Deutschen eine natürliche Heiratswendung und vermeidet die unpassende Nebenbedeutung von „zuführen“.
lexical_decisions:
- source_word: Ταύτην
  choice: Sie
  rationale: Das Demonstrativpronomen verweist auf die im Zusammenhang weiblich personifizierte Weisheit; „sie“ bewahrt diese Personifikation in natürlichem Deutsch.
- source_word: ἐφίλησα
  choice: habe ich geliebt
  rationale: Im Kontext bezeichnet das Verb liebevolle Zuneigung, nicht einen wörtlichen Kuss.
- source_word: ἐξεζήτησα
  choice: eifrig gesucht
  rationale: Die verstärkte Verbform bezeichnet ein nachdrückliches Suchen; „eifrig“ gibt diese Intensivierung verständlich wieder.
- source_word: ἐκ νεότητός μου
  choice: seit meiner Jugend
  rationale: Die Wendung bezeichnet den Ausgangspunkt eines in der Jugend begonnenen Strebens.
- source_word: ἐζήτησα
  choice: Ich suchte
  rationale: Die Wiederholung des griechischen Verbs bleibt sichtbar und erhält den poetischen Nachdruck.
- source_word: νύμφην
  choice: als Braut
  rationale: Das Wort bezeichnet hier eine Braut und trägt die ausdrückliche eheliche Bildsprache.
- source_word: ἀγαγέσθαι ἐμαυτῷ
  choice: für mich heimzuführen
  rationale: Die mediale Konstruktion bedeutet wörtlich, sie für sich zu führen bzw. zu nehmen, und ist im Zusammenhang eine Heiratswendung; „heimführen“ bewahrt sowohl das Bild des Führens als auch die eheliche Bedeutung.
- source_word: ἐραστὴς
  choice: Liebhaber
  rationale: Das Substantiv bezeichnet einen Liebhaber oder leidenschaftlichen Verehrer; „Liebhaber“ erhält die starke, zur Brautmetaphorik passende Sprache.
- source_word: τοῦ κάλλους αὐτῆς
  choice: ihrer Schönheit
  rationale: κάλλος bezeichnet unmittelbar Schönheit; die konkrete Wiedergabe bewahrt die poetische und bräutliche Personifikation.
theological_decisions:
- issue: Personifikation der Weisheit in ehelicher Sprache
  choice: Weibliche Personalformen und die Braut- und Liebhabermetaphorik werden ausdrücklich beibehalten.
  alternative: Die Aussage abstrakt als Wertschätzung der Weisheit oder Hingabe an ihre Vortrefflichkeit wiedergeben.
  rationale: Der griechische Text stellt die Weisheit ausdrücklich als Frau dar und verwendet Werbung, Ehe und Liebe als Bildfelder. Eine abstrakte Wiedergabe würde diese poetisch-theologische Spannung einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobenen Wörter „heimführen“ und „Liebhaber“ entsprechen der poetischen Brautmetaphorik, bleiben aber allgemein verständlich. Die beiden Verben des Suchens werden entsprechend der griechischen Wiederholung beibehalten.
