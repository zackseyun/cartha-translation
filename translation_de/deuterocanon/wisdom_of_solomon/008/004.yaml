  text: For she is an initiate in the knowledge of God[a], and a chooser of his works.
translation:
  language: de
  text: Denn sie ist in die Erkenntnis Gottes eingeweiht und wählt seine Werke aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und billigt seine Werke.“ Die griechische Wendung ist ungewöhnlich und kann hervorheben, dass die Weisheit Gottes Werke mit Einsicht auswählt oder ihnen zustimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μύστις
  choice: ist … eingeweiht
  rationale: Das seltene feminine Substantiv bezeichnet eine in Geheimnisse oder verborgenes Wissen eingeweihte Person. Die verbale Wiedergabe klingt im heutigen Deutsch natürlich und bewahrt den Gedanken eines besonderen Zugangs, ohne die späteren Assoziationen von „Mystikerin“ einzutragen.
- source_word: ἐπιστήμης
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt das Wissen bzw. Verstehen in diesem philosophisch-religiösen Zusammenhang angemessen wieder. Die Genitivverbindung „Erkenntnis Gottes“ lässt wie das Griechische offen, ob vor allem Gottes eigene Erkenntnis oder die Erkenntnis über Gott gemeint ist.
- source_word: αἱρέτις
  choice: wählt … aus
  rationale: Das seltene feminine Nomen ist von „wählen/auswählen“ abgeleitet. Eine verbale Form ist in modernem Deutsch verständlicher als das ungebräuchliche „Erwählerin“ und hält sich dennoch eng an die lexikalische Grundbedeutung.
- source_word: ἔργων
  choice: Werke
  rationale: „Werke“ ist breit genug, sowohl Gottes Taten als auch seine Hervorbringungen oder sein Wirken zu bezeichnen.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ wahrt die begründende Verbindung zum vorausgehenden Vers.
theological_decisions:
- issue: Wiedergabe von μύστις mit religiös-philosophischem Bedeutungsgehalt
  choice: ist in die Erkenntnis Gottes eingeweiht
  alternative: ist eine Mystikerin der Erkenntnis Gottes
  rationale: Die gewählte Formulierung bewahrt den Gedanken der Einweihung und des besonderen Zugangs zu göttlicher Erkenntnis, vermeidet aber anachronistische Vorstellungen, die das moderne Wort „Mystikerin“ wecken könnte.
- issue: Deutung von αἱρέτις τῶν ἔργων αὐτοῦ
  choice: wählt seine Werke aus
  alternative: billigt seine Werke
  rationale: Die griechische Wendung ist ungewöhnlich und knapp. Der Haupttext folgt der Grundbedeutung des Auswählens; die mögliche Nuance prüfender Zustimmung wird in der Fußnote erhalten, statt die Mehrdeutigkeit stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen femininen Tätigkeitsbezeichnungen des Griechischen werden zugunsten einer natürlichen deutschen Satzform verbal wiedergegeben; die sachliche Fremdheit der Aussage bleibt erhalten.
