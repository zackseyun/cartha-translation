  text: Wenn aber die Einsicht wirkt[a], wer ist dann unter allem, was existiert, kunstfertiger als sie?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tätig ist“ beziehungsweise „etwas hervorbringt“. Das griechische Verb kann sowohl das aktive Wirken als auch das produktive Schaffen betonen.'
