lexical_decisions:
- source_word: φρόνησις
  choice: Einsicht
  rationale: „Einsicht“ bezeichnet hier verständiges, praktisch wirksames Erkennen und hält den Ausdruck von σοφία („Weisheit“) im weiteren Zusammenhang unterscheidbar.
- source_word: ἐργάζεται
  choice: wirkt
  rationale: Das Verb bezeichnet tätiges Wirken beziehungsweise Hervorbringen. „Wirkt“ ist im Deutschen knapp und natürlich, ohne die produktive Bedeutung auszuschließen.
- source_word: τῶν ὄντων
  choice: unter allem, was existiert
  rationale: Die Wendung umfasst wörtlich „die seienden Dinge“. Die gewählte Formulierung bewahrt diese umfassende Bedeutung in verständlichem Deutsch.
- source_word: μᾶλλον
  choice: größere
  rationale: Der Komparativ wird passend zur deutschen Substantivkonstruktion „eine größere Meisterin“ wiedergegeben.
- source_word: τεχνῖτις
  choice: Meisterin
  rationale: Das feminine Substantiv bezeichnet eine kunstfertige Handwerkerin oder Schöpferin. „Meisterin“ bewahrt die weibliche Personifikation und klingt in der rhetorischen Frage natürlich.
theological_decisions:
- issue: Weibliche Personifikation von φρόνησις
  choice: Die feminine Personifikation wird mit „sie“ und „Meisterin“ beibehalten.
  alternative: Die Einsicht sächlich mit „es“ bezeichnen oder eine geschlechtsneutrale Berufsbezeichnung verwenden.
  rationale: Das Griechische verwendet ausdrücklich das feminine Pronomen αὐτῆς und das feminine Substantiv τεχνῖτις; diese Personifikation soll nicht eingeebnet werden.
- issue: Verhältnis von φρόνησις zu σοφία im Zusammenhang
  choice: φρόνησις wird mit „Einsicht“ und nicht mit „Weisheit“ übersetzt.
  alternative: „Weisheit“ oder „Klugheit“.
  rationale: Die lexikalische Unterscheidung zum sonst gebrauchten Begriff σοφία bleibt erhalten, ohne beide Begriffe theologisch gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Meisterin“ erhält die weibliche Personifikation und den Gedanken kunstfertigen Schaffens; die Fußnote dokumentiert die ungewöhnlichere wörtliche Konstruktion.
