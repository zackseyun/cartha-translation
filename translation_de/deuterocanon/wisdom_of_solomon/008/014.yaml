translation:
  language: de
  text: Ich werde Völker regieren, und Nationen werden mir untertan sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διοικήσω
  choice: Ich werde regieren
  rationale: Das Futur von διοικέω bezeichnet hier das Lenken oder Regieren politischer Gemeinschaften. „Regieren“ ist im Deutschen natürlich und vermeidet sowohl das bürokratisch engere „verwalten“ als auch das härtere „beherrschen“.
- source_word: λαούς
  choice: Völker
  rationale: Der Plural von λαός wird als „Völker“ wiedergegeben; so bleibt der kollektive Plural erhalten und die lexikalische Unterscheidung zum folgenden ἔθνη zumindest durch „Nationen“ sichtbar.
- source_word: ἔθνη
  choice: Nationen
  rationale: Im politischen Zusammenhang ist „Nationen“ eine passende Wiedergabe. „Heiden“ würde einen ethnisch-religiösen Gegensatz eintragen, den der Satz nicht ausdrücklich setzt.
- source_word: ὑποταγήσεταί
  choice: werden sich unterordnen
  rationale: Die Form kann morphologisch mittel oder passiv verstanden werden. Das Deutsche „sich unterordnen“ gibt die resultierende Unterstellung natürlich wieder, ohne ausdrücklich einen äußeren Zwang zu behaupten.
- source_word: μοι
  choice: mir
  rationale: Der Dativ bezeichnet die Person, der die Nationen untergeordnet sind; „mir“ ist die direkte idiomatische Wiedergabe.
theological_decisions:
- issue: Art der Unterordnung in ὑποταγήσεταί
  choice: werden sich mir unterordnen
  alternative: werden mir unterworfen sein
  rationale: Die griechische Form lässt eine mittlere beziehungsweise passive Nuance zu. Der Haupttext formuliert idiomatisch, ohne gewaltsame Unterwerfung ausdrücklich festzulegen; die Alternative würde den passiven Aspekt stärker hervorheben.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der parallele Satzbau und die politische Bildsprache des Griechischen bleiben erhalten; „Völker“ und „Nationen“ bewahren die beiden unterschiedlichen griechischen Substantive, auch wenn sie semantisch nah beieinanderliegen.
