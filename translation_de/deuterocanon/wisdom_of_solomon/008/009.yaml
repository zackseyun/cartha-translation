base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/009.yaml
  text: So I decided to take her to live with me[a], knowing that she would be a counselor of good things for me[b], and a comfort in cares and grief.
translation:
  language: de
  text: Darum beschloss ich, sie zu mir zu nehmen, um mit ihr zusammenzuleben[a]. Denn ich wusste, dass sie mir eine Ratgeberin in guten Dingen und bei Sorgen und Kummer ein Zuspruch sein würde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie zu heiraten“; wörtlicher: „sie zum Zusammenleben zu nehmen“. Die personifizierte Weisheit erscheint hier in eheähnlicher Bildsprache, doch ein ausdrückliches Wort für Heirat steht in diesem Vers nicht.'
    reason: alternative_reading
  - marker: b
    text: „Zuspruch“ kann hier auch „Ermunterung“, „Ermahnung“ oder „Trost“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα τοίνυν
  choice: Darum beschloss ich
  rationale: ἔκρινα bezeichnet hier einen gefassten Entschluss; τοίνυν stellt die folgernde Verbindung zum vorherigen Gedankengang her. Die Formulierung ist natürlich und bewahrt den entschiedenen Ton.
- source_word: ταύτην
  choice: sie
  rationale: Das feminine Pronomen verweist auf die personifizierte Weisheit. Im Deutschen ist „sie“ die natürliche Wiedergabe.
- source_word: ἀγαγέσθαι πρὸς συμβίωσιν
  choice: sie zu mir zu nehmen, um mit ihr zusammenzuleben
  rationale: Die Wendung bezeichnet das Aufnehmen in eine gemeinsame Lebensführung. Sie lässt die eheliche Bildsprache anklingen, ohne einen im Griechischen dieses Verses nicht ausdrücklich genannten Eheschluss festzuschreiben.
- source_word: εἰδὼς
  choice: Denn ich wusste
  rationale: Das Partizip gibt den Grund für den Entschluss an. Ein deutscher Hauptsatz mit „Denn“ drückt diesen Zusammenhang klar und flüssig aus.
- source_word: ἔσται μοι σύμβουλος ἀγαθῶν
  choice: sie mir eine Ratgeberin zum Guten … sein würde
  rationale: σύμβουλος ist eine beratende Person; ἀγαθῶν bleibt semantisch weit. „Zum Guten“ bewahrt den Bezug auf Gutes, ohne ihn ausschließlich moralisch oder praktisch auszulegen.
- source_word: παραίνεσις
  choice: Zuspruch
  rationale: Das Wort kann Ermahnung, Aufmunterung oder tröstenden Zuspruch bezeichnen. Im Zusammenhang mit Sorgen und Kummer gibt „Zuspruch“ die unterstützende Bedeutung wieder, ohne den ermahnenden Unterton völlig auszuschließen.
- source_word: φροντίδων καὶ λύπης
  choice: bei Sorgen und Kummer
  rationale: φροντίδες sind belastende Sorgen oder Bekümmernisse; λύπη bezeichnet Schmerz, Trauer oder Kummer. Die deutsche Paarung ist verständlich und wahrt das emotionale Gewicht.
theological_decisions:
- issue: Ob die gemeinsame Lebensführung ausdrücklich als Ehe bezeichnet werden soll
  choice: sie zu mir zu nehmen, um mit ihr zusammenzuleben
  alternative: sie zu heiraten / sie zur Frau zu nehmen
  rationale: Der weitere Zusammenhang verwendet eheähnliche Bilder für die personifizierte Weisheit. Dieser Vers spricht jedoch wörtlich vom Nehmen oder Herbeiführen „zum Zusammenleben“ und gebraucht keinen ausdrücklichen Ehebegriff. Die Übersetzung erhält die Bildwelt, ohne sie zu vereindeutigen.
- issue: Ob παραίνεσις ausschließlich als Trost oder als Ermahnung wiederzugeben ist
  choice: Zuspruch
  alternative: Ermahnung / Trost
  rationale: Der griechische Ausdruck besitzt eine Bandbreite von Ermahnung bis Ermutigung. „Zuspruch“ passt zu Sorgen und Kummer und bewahrt mehr von dieser Spannung als eine ausschließlich tröstende oder tadelnde Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ratgeberin“ hält die weibliche Personifikation sichtbar; „Zuspruch“ ist allgemein verständlich und bewahrt die Bedeutungsbreite des griechischen Ausdrucks.
