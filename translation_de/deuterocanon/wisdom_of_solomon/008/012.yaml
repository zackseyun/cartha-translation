  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/012.yaml
  text: When I am silent[a], they will wait for me, and when I speak, they will pay attention; and when I speak at greater length, they will lay a hand on their mouth.
translation:
  language: de
  text: Wenn ich schweige, werden sie auf mich warten, und wenn ich spreche, werden sie aufmerksam zuhören; und wenn ich länger rede, werden sie sich die Hand auf den Mund legen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Hand auf den Mund zu legen ist eine Geste schweigender Zurückhaltung oder ehrfürchtigen Respekts gegenüber dem Redenden.
    reason: cultural_note
lexical_decisions:
- source_word: σιγῶντά με
  choice: wenn ich schweige
  rationale: Das präsentische Partizip mit με wird temporal und in natürlichem Deutsch wiedergegeben.
- source_word: περιμενοῦσιν
  choice: werden sie auf mich warten
  rationale: περιμένω bezeichnet hier das erwartungsvolle Warten auf den Sprecher.
- source_word: φθεγγομένῳ προσέξουσιν
  choice: wenn ich spreche, werden sie aufmerksam zuhören
  rationale: προσέχω meint im Zusammenhang aufmerksames Hinhören; die Dativkonstruktion wird idiomatisch temporal wiedergegeben.
- source_word: λαλοῦντος ἐπὶ πλεῖον
  choice: wenn ich länger rede
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet ein längeres beziehungsweise fortgesetztes Reden, ohne eine im Griechischen nicht ausdrücklich vorhandene Bedingung einzuführen.
- source_word: χεῖρα ἐπιθήσουσιν ἐπὶ στόμα αὐτῶν
  choice: werden sie die Hand auf ihren Mund legen
  rationale: Die körperliche Geste wird eng am Griechischen bewahrt; der kollektive Singular entspricht der Vorlage und ist im Deutschen verständlich.
