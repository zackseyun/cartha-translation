  text: When I considered these things within myself and reflected in my heart that there is immortality in kinship with wisdom,[a]
translation:
  language: de
  text: Als ich dies bei mir bedachte und in meinem Herzen erwog, dass in der Verwandtschaft mit der Weisheit Unsterblichkeit liegt,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass in der Verbundenheit mit der Weisheit Unsterblichkeit liegt.“ Die griechische Wendung bezeichnet eine enge Beziehung und kann einen ursächlichen Zusammenhang nahelegen, ohne ihn ausdrücklich festzustellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λογισάμενος
  choice: Als ich dies ... bedachte
  rationale: Das Aoristpartizip bezeichnet ein inneres Überlegen. „Bedachte“ ist im Deutschen natürlich und bewahrt den nachdenklichen Sinn.
- source_word: ἐν ἐμαυτῷ
  choice: bei mir
  rationale: Die Wendung kennzeichnet innere Beratung. „Bei mir“ gibt dies idiomatisch wieder, ohne einen zusätzlichen Gedanken einzutragen.
- source_word: φροντίσας ἐν καρδίᾳ μου
  choice: und in meinem Herzen erwog
  rationale: „Erwog“ drückt sorgfältiges Nachdenken aus; „in meinem Herzen“ erhält das anthropologische Bild des Griechischen.
- source_word: ὅτι ἐστιν ἀθανασία
  choice: dass ... Unsterblichkeit liegt
  rationale: ἀθανασία bedeutet „Unsterblichkeit“. Die Formulierung mit „liegt“ verbindet die Existenzangabe idiomatisch mit der folgenden Verhältnisbestimmung.
- source_word: ἐν συγγενείᾳ σοφίας
  choice: in der Verwandtschaft mit der Weisheit
  rationale: συγγένεια bezeichnet Verwandtschaft, Zugehörigkeit oder enge Verbundenheit. „Verwandtschaft“ bewahrt das familiale Beziehungsbild und macht keinen ausdrücklich kausalen Zusammenhang daraus.
theological_decisions:
- issue: Art des Verhältnisses zwischen Unsterblichkeit und Weisheit in ἐν συγγενείᾳ σοφίας
  choice: in der Verwandtschaft mit der Weisheit liegt Unsterblichkeit
  alternative: durch die Verbundenheit mit der Weisheit erlangt man Unsterblichkeit
  rationale: Der griechische Text verbindet Unsterblichkeit durch ἐν mit einem Beziehungsbegriff, formuliert aber keinen eindeutigen Kausalmechanismus. Die gewählte Fassung erhält diese theologische Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallelen Ausdrücke für inneres Nachdenken bleiben erhalten; das familiale Bild von συγγένεια wird bewusst nicht zu einer eindeutigen Heilsursache ausgedeutet.
