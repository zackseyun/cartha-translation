base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/008.yaml
  text: And if anyone longs even for much experience[a], she knows the things of old and can infer the things to come; she understands turns of speech and solutions to riddles[b]; she knows beforehand signs and wonders and the outcomes of seasons and times.
translation:
  language: de
  text: Und wenn jemand nach viel Erfahrung[a] verlangt, kennt sie das Vergangene und vermag das Kommende zu erschließen; sie versteht Wendungen der Rede und die Lösungen von Rätseln; Zeichen und Wunder erkennt sie im Voraus, ebenso den Ausgang von Zeiten und Zeiträumen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „umfassender Kenntnis“ beziehungsweise „großer Erfahrung“.'
    reason: Das griechische Wort kann sowohl umfangreiche praktische Erfahrung als auch weitreichende, durch Erfahrung erworbene Kenntnis bezeichnen.
  - marker: b
    text: 'Oder: „den Ausgang von bestimmten Zeiten und Zeiträumen“.'
    reason: Die griechischen Begriffe καιροί und χρόνοι überschneiden sich, können aber bestimmte oder maßgebliche Zeiten von Zeiträumen beziehungsweise Zeitverläufen unterscheiden.
lexical_decisions:
- source_word: πολυπειρίαν
  choice: reiche Erfahrung
  rationale: Das Wort bezeichnet ein großes Maß an Erfahrung oder umfassende, durch Erfahrung gewonnene Kenntnis. „Reiche Erfahrung“ ist im Deutschen natürlich und wahrt die Breite des Ausdrucks.
- source_word: ποθεῖ
  choice: verlangt
  rationale: Das Verb drückt ein starkes Begehren aus. „Verlangt nach“ ist würdig und gegenwärtig, ohne unnötig pathetisch zu wirken.
- source_word: τὰ ἀρχαῖα
  choice: das Vergangene
  rationale: Gemeint sind alte beziehungsweise frühere Dinge oder Geschehnisse. „Das Vergangene“ bewahrt den zeitlichen Sinn, ohne ihn auf den Ursprung aller Dinge einzuengen.
- source_word: τὰ μέλλοντα εἰκάζειν
  choice: vermag das Kommende zu erschließen
  rationale: εἰκάζω bezeichnet eher ein Schlussfolgern oder Erschließen als unmittelbares prophetisches Vorherwissen. Die Formulierung erhält den Unterschied zum späteren προγινώσκει.
- source_word: στροφὰς λόγων
  choice: Wendungen der Rede
  rationale: Die Wendung umfasst sprachliche, rhetorische oder gedankliche Wendungen. Diese Übersetzung bleibt bewusst breit und ist im Deutschen verständlich.
- source_word: λύσεις αἰνιγμάτων
  choice: die Lösungen von Rätseln
  rationale: λύσεις bezeichnet Lösungen oder Auflösungen, αἰνίγματα Rätsel beziehungsweise dunkle Aussprüche. Die gewählte Formulierung ist klar und quellennah.
- source_word: σημεῖα καὶ τέρατα
  choice: Zeichen und Wunder
  rationale: Die geläufige biblische Wortverbindung gibt beide griechischen Begriffe prägnant wieder.
- source_word: προγινώσκει
  choice: erkennt ... im Voraus
  rationale: Das Verb bedeutet vorher oder im Voraus kennen. „Erkennt ... im Voraus“ vermeidet eine dogmatische Überladung und unterscheidet sich erkennbar vom bloßen Erschließen des Kommenden.
- source_word: ἐκβάσεις
  choice: Ausgang
  rationale: Das Substantiv bezeichnet Ergebnis oder Ausgang. Der Singular als Sammelbegriff passt im Deutschen natürlich zur koordinierten Genitivverbindung.
- source_word: καιρῶν καὶ χρόνων
  choice: Zeitpunkten und Zeitläufen
  rationale: καιροί sind maßgebliche, passende oder bestimmte Zeitpunkte, χρόνοι Zeiten beziehungsweise zeitliche Verläufe. Die Übersetzung versucht, den Unterschied beider Begriffe sichtbar zu halten.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Das feminine Pronomen „sie“ wird beibehalten.
  alternative: „die Weisheit“ wiederholen oder ein neutrales Pronomen verwenden
  rationale: Der Kontext stellt die Weisheit als weibliche handelnde Gestalt dar. Das grammatisch und literarisch feminine Bild wird bewahrt, ohne weitergehende ontologische oder christologische Festlegungen einzutragen.
- issue: Aussagestärke von εἰκάζειν
  choice: „das Kommende erschließen“
  alternative: „die Zukunft voraussehen“ oder „das Kommende vorhersagen“
  rationale: Das griechische Verb kann Vermuten oder Schlussfolgern aufgrund von Anzeichen bezeichnen und ist schwächer als das später verwendete προγινώσκει. Die Übersetzung wahrt diese innere Spannung.
- issue: Verhältnis von καιροί und χρόνοι
  choice: „Zeitpunkte und Zeitläufe“
  alternative: „Zeiten und Fristen“ oder „Zeitlagen und Zeiten“
  rationale: Die Formulierung unterscheidet zwischen maßgeblichen beziehungsweise bestimmten Zeitpunkten und allgemeiner verlaufender Zeit, ohne die Begriffe dogmatisch zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung folgt der rhetorischen Reihung des Griechischen. Die Erkenntnisverben werden differenziert wiedergegeben, damit der Unterschied zwischen Wissen, Verstehen, Erschließen und Vorauswissen nicht eingeebnet wird.
