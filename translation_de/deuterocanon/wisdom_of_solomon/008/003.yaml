review_pass:
  verdict: revise
  source_fidelity: 'Die Satzrichtung der vorliegenden Fassung entspricht der überlieferten Lesart und dem englischen Audit: Die Gemeinschaft bzw. das Zusammenleben mit Gott bringt der εὐγένεια der personifizierten Weisheit Ehre/Glanz. „Gebieter über alles“ gibt ὁ πάντων δεσπότης angemessen und deutlich anders als κύριος wieder. Der im bereitgestellten griechischen Text stehende Nominativ συμβίωσις ist jedoch syntaktisch auffällig, da die bekannte und vom Audit vorausgesetzte Konstruktion offenbar συμβίωσιν verlangt; dies sollte an der Quellenausgabe geprüft werden.'
  naturalness: „Lebensgemeinschaft“ ist im heutigen Deutsch stark rechtlich und partnerschaftlich konnotiert und kann daher für die Beziehung der Weisheit zu Gott unnötig missverständlich wirken. „Gemeinschaft mit Gott“ ist idiomatischer und wahrt den Umfang von συμβίωσις hinreichend. Das Präteritum „liebte“ bildet den Aorist in diesem literarischen Register unmittelbar ab.
  terminology: „Adel“ bewahrt die gewollte Breite von εὐγένεια zwischen vornehmer Herkunft und edler Beschaffenheit. Die feminine Bezugnahme auf die Weisheit bleibt erhalten. Die Fußnote soll keine über das Griechische hinausgehende „vertraute“ Gemeinschaft nahelegen.
  issues:
  - severity: medium
    issue: „Lebensgemeinschaft“ ist unnötig missverständlich.
    rationale: Der Ausdruck bezeichnet im modernen Deutsch häufig eine partnerschaftliche oder rechtliche Lebensform. συμβίωσις kann zwar Zusammenleben bedeuten, doch „Gemeinschaft mit Gott“ ist hier natürlicher und weniger fehlleitend.
  - severity: low
    issue: Die Fußnote enthält die interpretierende Alternative „vertraute Gemeinschaft“.
    rationale: „Vertraut“ fügt eine Intensitätsnuance hinzu, die der griechische Ausdruck nicht ausdrücklich festlegt.
  - severity: medium
    issue: Textkritisch auffällige Form συμβίωσις im bereitgestellten griechischen Text.
    rationale: Mit dem Nominativ ist die Partizipialkonstruktion ἔχουσα schwer zu erklären; die englische Auditspur und die geläufige Satzkonstruktion setzen offenbar einen Akkusativ voraus. Die Übersetzung folgt der im Audit bezeugten Sinnrichtung, die griechische Quellform sollte aber kontrolliert werden.
  revised_text: Ihre Gemeinschaft mit Gott verleiht ihrem Adel Glanz[a], und der Gebieter über alles liebte sie.
  revised_footnotes:
  - marker: a
    text: 'Oder: „Ihre edle Herkunft wird durch die Gemeinschaft mit Gott geehrt.“ Das griechische Wort für „Gemeinschaft“ kann gemeinsames Leben, Zusammenleben oder Gemeinschaft bezeichnen; „Adel“ kann auch edle Herkunft oder edle Wesensart meinen.'
    reason: lexical_alternative
  revision_rationale: „Gemeinschaft mit Gott“ ersetzt das im Deutschen missverständliche „Lebensgemeinschaft“, ohne die Beziehung aus συμβίωσις theologisch näher zu bestimmen. Die aktivische deutsche Satzgestaltung bleibt inhaltlich bei der im englischen Audit gewählten Resultatsaussage. „Liebte“ gibt den erzählenden Aorist schlicht wieder. Die Fußnote wurde auf echte lexikalische Alternativen beschränkt.
