  text: Her nobility is glorified by living together with God[a], and the Master of all loved her.
translation:
  language: de
  text: Ihre Lebensgemeinschaft mit Gott verleiht ihrem Adel Glanz[a], und der Gebieter über alles hat sie geliebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre edle Herkunft wird durch die Gemeinschaft mit Gott geehrt.“ Das griechische Wort für „Lebensgemeinschaft“ kann gemeinsames Leben, Zusammenleben oder vertraute Gemeinschaft bezeichnen; „Adel“ kann auch edle Herkunft oder edle Wesensart meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγένειαν
  choice: ihrem Adel
  rationale: Das Wort bezeichnet vornehme Herkunft, Adel oder edle Wesensart. „Adel“ bewahrt die würdevolle Bedeutungsbreite, ohne die Aussage ausschließlich auf gesellschaftlichen Rang festzulegen.
- source_word: δοξάζει
  choice: verleiht … Glanz
  rationale: 'Das Verb kann „verherrlichen“, „ehren“ oder „zu Ansehen bringen“ bedeuten. Die aktive Formulierung gibt die griechische Satzstruktur natürlich wieder: Die Lebensgemeinschaft mit Gott lässt den Adel der Weisheit in seiner Herrlichkeit hervortreten.'
- source_word: συμβίωσις θεοῦ ἔχουσα
  choice: ihre Lebensgemeinschaft mit Gott
  rationale: συμβίωσις bezeichnet ein gemeinsames Leben, Zusammenleben oder vertraute Gemeinschaft. „Lebensgemeinschaft“ erhält den konkreten Gedanken des miteinander geteilten Lebens; das Possessivpronomen verdeutlicht im Deutschen den Bezug auf die personifizierte Weisheit.
- source_word: ὁ πάντων δεσπότης
  choice: der Gebieter über alles
  rationale: δεσπότης bezeichnet einen Herrn, Gebieter oder unumschränkten Herrscher. „Gebieter“ wahrt den Unterschied zu κύριος und gibt πάντων umfassend mit „über alles“ wieder.
- source_word: ἠγάπησεν αὐτήν
  choice: hat sie geliebt
  rationale: Der Aorist bezeichnet hier schlicht die Liebe des Gebieters zur personifizierten Weisheit. Das feminine Pronomen bleibt entsprechend der griechischen Darstellung erhalten.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Die Weisheit wird mit femininen Personalformen („ihre“, „sie“) bezeichnet.
  alternative: Die Weisheit unpersönlich mit „es“ wiedergeben.
  rationale: Der griechische Text stellt die Weisheit als weibliche Personifikation dar. Die feminine Sprache bewahrt diese literarisch-theologische Gestalt, ohne sie mit einer späteren dogmatischen Identifikation gleichzusetzen.
- issue: Göttlicher Titel δεσπότης
  choice: „der Gebieter über alles“
  alternative: „der Herr über alles“ oder „der Herrscher über alles“
  rationale: „Gebieter“ bildet δεσπότης erkennbar anders ab als κύριος und bewahrt so die lexikalische Unterscheidung des Ausgangstextes.
- issue: Verhältnis von Weisheit und Gott
  choice: „Lebensgemeinschaft mit Gott“
  alternative: „Gemeinschaft mit Gott“ oder „Zusammenleben mit Gott“
  rationale: Die Formulierung hält die enge, gemeinsame Lebensbeziehung fest, ohne deren genaue metaphysische oder personale Art näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lebensgemeinschaft“ hält die konkrete Kraft von συμβίωσις fest; „verleiht … Glanz“ vermeidet die im Deutschen schwerfällige Passivform „wird verherrlicht“. Der feminine Bezug auf die personifizierte Weisheit bleibt ausdrücklich erhalten.
