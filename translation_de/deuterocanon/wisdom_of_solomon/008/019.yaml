  source_fidelity: 'Die Grundbedeutung ist zutreffend: παῖς ist angemessen mit „Kind“, ψυχή mit „Seele“ und ἔλαχον mit „empfing“ wiedergegeben. εὐφυής bezeichnet jedoch in erster Linie eine günstige natürliche Anlage; „wohlgeraten“ ist möglich, kann im heutigen Deutsch aber auch das Ergebnis einer guten Erziehung oder eine allgemeine Billigung des Kindes nahelegen. Die Satzfortführung mit Komma entspricht zudem dem griechischen Versschluss und dem Anschluss an V. 20 besser.'
  naturalness: „Ich war aber“ ist im modernen Standarddeutsch deutlich natürlicher als die stark markierte Stellung „Ich aber war“. „Von Natur aus begabt“ ist idiomatisch; die Anmerkung sichert ab, dass damit nicht lediglich intellektuelle Begabung gemeint ist.
  terminology: „Seele“ und „gut“ bewahren die offene anthropologische und wertende Sprache des Griechischen. Die Fußnote erläutert die Breite von εὐφυής, ohne sie theologisch oder psychologisch einzuengen.
  issues:
