    rationale: Die Wiedergabe ist nicht unmöglich, ist aber im gegenwärtigen Deutsch potenziell missverständlich, weil sie leicht an Erziehung, Betragen oder rückblickendes Gelingen denken lässt. „von Natur aus begabt“ macht die natürliche Anlage explizit; die Fußnote hält die semantische Breite offen.
  - severity: low
    issue: Satzschluss
    rationale: Der griechische Text endet mit Komma und wird in V. 20 syntaktisch weitergeführt. Ein Komma bewahrt diesen Anschluss.
