  text: I was a gifted child[a], and I received a good soul,
translation:
  language: de
  text: Ich war aber ein von Natur aus begabtes Kind[a] und empfing eine gute Seele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wohlgeraten; das griechische Wort bezeichnet eine günstige natürliche Begabung oder Beschaffenheit in einem umfassenden Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς
  choice: Kind
  rationale: Der Sprecher blickt auf seine frühe Lebenszeit zurück. »Kind« gibt den altersbezogenen Sinn wieder, ohne Geschlecht oder Reifegrad unnötig festzulegen.
- source_word: εὐφυής
  choice: wohlgeraten
  rationale: Das Adjektiv bezeichnet eine günstige natürliche Veranlagung oder Beschaffenheit. »Wohlgeraten« bewahrt diese Breite besser als das enger auf intellektuelle Fähigkeiten bezogene »begabt«.
- source_word: ψυχῆς
  choice: Seele
  rationale: »Seele« entspricht dem ausdrücklichen ψυχή und bewahrt dessen anthropologisches Gewicht, statt es auf »Veranlagung« oder »Wesen« zu verengen.
- source_word: ἔλαχον
  choice: empfing
  rationale: Das Verb kann das Erlangen oder Zugewiesenbekommen bezeichnen. »Empfing« vermittelt hier natürlich, dass die gute Seele dem Sprecher zuteilwurde, ohne einen Zufallsvorgang zu unterstellen.
- source_word: ἀγαθῆς
  choice: gut
  rationale: »Gut« ist die direkte und bewusst breite Wiedergabe; sie legt nicht fest, ob vor allem moralische Güte, Vortrefflichkeit oder eine edle Beschaffenheit gemeint ist.
- source_word: δὲ
  choice: aber
  rationale: »Aber« gibt den verbindenden beziehungsweise leicht kontrastierenden Charakter der Partikel wieder, ohne einen im Griechischen nicht vorhandenen Zeitbegriff einzuführen.
theological_decisions:
- issue: Anthropologische Aussage in ψυχῆς ἔλαχον ἀγαθῆς
  choice: »eine gute Seele« im Haupttext beibehalten
  alternative: »eine gute Veranlagung« oder »ein gutes Wesen«
  rationale: Der griechische Text verwendet ausdrücklich ψυχή. Die Wiedergabe mit »Seele« erhält die mögliche Leib-Seele-Spannung und löst sie nicht durch eine psychologisierende Paraphrase auf.
translation_notes:
  register: Moderne, würdige Standardsprache. »Wohlgeraten« ist bewusst weiter als »begabt« und vermeidet eine rein intellektuelle Deutung. Die knappe Satzgestalt folgt dem griechischen Parallelismus.
