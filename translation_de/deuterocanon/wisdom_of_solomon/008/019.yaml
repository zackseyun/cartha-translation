    issue: Stellung von „aber“
    rationale: δέ kann durch „aber“ wiedergegeben werden, doch „Ich aber war“ klingt im modernen Deutsch unnötig literarisch-archaisierend. „Ich war aber“ erhält die Verknüpfung natürlicher.
  - severity: medium
