revisions:
- from: Und in ihrer Freundschaft liegt gute Freude, in der Mühe ihrer Hände unerschöpflicher Reichtum, in gemeinsamer Übung im Umgang mit ihr[a] Einsicht und in der Teilhabe an ihren Worten hohes Ansehen[b]. So ging ich umher und suchte, wie ich sie für mich gewinnen könnte[c].
  to: Und in ihrer Freundschaft liegt gute Freude, in den Mühen ihrer Hände unerschöpflicher Reichtum, im gemeinsamen Üben der Gemeinschaft mit ihr[a] Einsicht und in der Teilhabe an ihren Worten hohes Ansehen[b]. So ging ich umher und suchte, wie ich sie für mich gewinnen könnte[c].
  rationale: Die Revision korrigiert sicher den griechischen Plural bei πόνοις und präzisiert die Erläuterung der besonders schwierigen Verbindung συγγυμνασίᾳ ὁμιλίας αὐτῆς. Die Formulierung im Haupttext bleibt bewusst leicht verdichtet, damit weder das Moment gemeinsamen Übens noch der Aspekt enger Gemeinschaft mit der personifizierten Weisheit verloren geht. Die übrigen Entscheidungen sind quellennah, idiomatisch vertretbar und theologisch nicht überbestimmt.
