base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/018.yaml
  text: And in her friendship there is good delight[a], and in the labors of her hands, unfailing wealth, and in companionship with her, prudence, and honor in sharing her words[c][b]. I went about seeking how I might take her to myself.
translation:
  language: de
  text: Und in ihrer Freundschaft liegt gute Freude, in den Mühen ihrer Hände unerschöpflicher Reichtum, im gemeinsamen Üben der Gemeinschaft mit ihr[a] Einsicht und in der Teilhabe an ihren Worten hohes Ansehen[b]. So ging ich umher und suchte, wie ich sie für mich gewinnen könnte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „in gemeinsamem Üben der Gemeinschaft mit ihr“. Die griechische Wendung verbindet gemeinsames Sich-Üben mit engem Umgang beziehungsweise Gemeinschaft mit der Weisheit und ist im Deutschen nur schwer knapp nachzubilden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „guter Ruf“ beziehungsweise „Ehre“. Gemeint ist öffentlich anerkanntes, ehrenvolles Ansehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wie ich sie zu mir nehmen könnte“. Die Formulierung bezeichnet die persönliche Aneignung der personifizierten Weisheit, ohne hier eindeutig eine Ehe zu meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλίᾳ
  choice: Freundschaft
  rationale: Bezeichnet die persönliche Beziehung zur personifizierten Weisheit; „Freundschaft“ bewahrt den relationalen Sinn, ohne ihn romantisch zu verengen.
- source_word: τέρψις ἀγαθή
  choice: gute Freude
  rationale: Gibt sowohl die Freude bzw. den Genuss als auch die ausdrückliche positive Wertung durch ἀγαθή wieder.
- source_word: πόνοις χειρῶν αὐτῆς
  choice: in der Mühe ihrer Hände
  rationale: Bewahrt das konkrete Bild der Hände und den in πόνοι enthaltenen Gedanken mühevoller Tätigkeit.
- source_word: πλοῦτος ἀνεκλιπής
  choice: unerschöpflicher Reichtum
  rationale: Drückt idiomatisch aus, dass dieser Reichtum nicht ausgeht oder versiegt.
- source_word: συγγυμνασίᾳ ὁμιλίας αὐτῆς
  choice: in gemeinsamer Übung im Umgang mit ihr
  rationale: Die ungewöhnlich verdichtete Wendung verbindet gemeinsames Einüben bzw. Sich-Üben mit Umgang oder Gemeinschaft; die Übersetzung erhält beide Elemente, ohne sie auf bloße Geselligkeit zu reduzieren.
- source_word: φρόνησις
  choice: Einsicht
  rationale: Bezeichnet verständige, praktisch ausgerichtete Urteilskraft; „Einsicht“ ist hier natürlich und vermeidet die im heutigen Deutsch teils eng moralische Färbung von „Klugheit“ oder „Besonnenheit“.
- source_word: εὔκλεια
  choice: hohes Ansehen
  rationale: Gibt den Sinn eines guten öffentlichen Rufes bzw. ehrenvollen Ansehens genauer wieder als das mehrdeutige „Ehre“.
- source_word: κοινωνίᾳ λόγων αὐτῆς
  choice: in der Teilhabe an ihren Worten
  rationale: Bewahrt sowohl den Beteiligungs- und Gemeinschaftsaspekt von κοινωνία als auch λόγοι als Worte, Rede oder Lehre.
- source_word: περιῆλθον ζητῶν
  choice: So ging ich umher und suchte
  rationale: Spiegelt die aktive, fortgesetzte Suche und das Bewegungsmoment der griechischen Wendung.
- source_word: ὅπως λάβω αὐτὴν εἰς ἐμαυτόν
  choice: wie ich sie für mich gewinnen könnte
  rationale: Gibt Aneignung und persönliche Beziehung wieder, ohne die Formulierung ausdrücklich als Heirat oder Verinnerlichung festzulegen.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Die Weisheit bleibt durchgehend eine weiblich personifizierte Gestalt („ihrer“, „sie“).
  alternative: Weisheit ausschließlich als unpersönliche Eigenschaft wiedergeben.
  rationale: Die griechischen Feminina und die Beziehungsbilder sind ausdrücklich personal gestaltet und sollen nicht eingeebnet werden.
- issue: Bedeutung des Gewinnens der Weisheit für sich selbst
  choice: „sie für mich gewinnen“ wahrt die persönliche Aneignung, ohne sie näher festzulegen.
  alternative: Die Wendung ausdrücklich ehelich („zur Frau nehmen“) oder innerlich-mystisch („in mich aufnehmen“) deuten.
  rationale: Der Wortlaut kann im weiteren Zusammenhang eheliche Anklänge haben, legt diese Deutung in diesem Vers jedoch nicht eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Reihung des Griechischen bleibt erkennbar; ungewöhnliche Verdichtungen werden im Haupttext lesbar entfaltet und in den Fußnoten transparent gemacht.
