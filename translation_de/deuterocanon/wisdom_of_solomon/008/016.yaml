lexical_decisions:
- source_word: εἰσελθὼν
  choice: Wenn ich … komme
  rationale: Das Aoristpartizip bezeichnet den zeitlichen Umstand der Haupthandlung. Die finite Wiedergabe ist im Deutschen natürlich und bewahrt den zeitlichen Sinn.
- source_word: προσαναπαύσομαι
  choice: werde ich bei ihr Ruhe finden
  rationale: Das Futur Medium bezeichnet Ruhe in enger Gemeinschaft mit der personifizierten Weisheit. „Bei ihr Ruhe finden“ ist idiomatisch und lässt die durch die Präfixbildung angedeutete Nähe anklingen.
- source_word: συναναστροφή
  choice: der Umgang mit ihr
  rationale: Das Substantiv bezeichnet Gemeinschaft beziehungsweise gesellschaftlichen Umgang. „Umgang mit ihr“ ist verständlich und vermeidet die mögliche Fehlbedeutung von „ihr Umgang“ als ihr persönliches Verhalten.
- source_word: πικρίαν
  choice: Bitterkeit
  rationale: Die Wiedergabe erhält sowohl die bildliche als auch die emotionale Bedeutung des griechischen Ausdrucks.
- source_word: συμβίωσις
  choice: das Zusammenleben mit ihr
  rationale: Der Ausdruck bezeichnet gemeinsames Leben. „Zusammenleben“ ist präzise und im modernen Deutschen natürlich.
- source_word: ὀδύνην
  choice: Schmerz
  rationale: Das Wort kann körperlichen oder seelischen Schmerz bezeichnen; die knappe allgemeine Wiedergabe bewahrt diese Bedeutungsbreite.
- source_word: εὐφροσύνην
  choice: Frohsinn
  rationale: „Frohsinn“ gibt die heitere, freudige Stimmung wieder und bleibt von χαρά unterscheidbar.
- source_word: χαράν
  choice: Freude
  rationale: Die übliche Wiedergabe bewahrt zusammen mit „Frohsinn“ die zweigliedrige Schlusswendung.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Die weiblichen Pronomen werden mit „ihr“ beibehalten.
  alternative: Die Weisheit wiederholt ausdrücklich nennen oder unpersönlich mit „sie“ im abstrakten Sinn wiedergeben.
  rationale: Die griechischen weiblichen Formen αὐτῇ und αὐτῆς führen die Weisheit als weiblich personifizierte Gestalt weiter. Die Übersetzung bewahrt diese literarische und theologische Darstellung, ohne sie näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Wendungen „Umgang mit ihr“ und „Zusammenleben mit ihr“ sowie das Begriffspaar „Frohsinn und Freude“ bewahren Aufbau und rhetorische Fülle des Griechischen.
