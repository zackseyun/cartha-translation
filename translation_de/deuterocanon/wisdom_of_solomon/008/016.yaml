translation:
  language: de
  text: Wenn ich mein Haus betrete, werde ich bei ihr Ruhe finden[a]; denn der Umgang mit ihr kennt keine Bitterkeit und das Zusammenleben mit ihr keinen Schmerz, sondern Frohsinn und Freude.
