  terminology: „Umgang“, „Zusammenleben“, „Bitterkeit“, „Schmerz“, „Frohsinn“ und „Freude“ sind angemessen. Die femininen Bezüge bleiben als literarische Personifikation der Weisheit gewahrt. Die Fußnote bietet die zulässige Alternative „mit ihr ruhen“, ohne eine theologische Deutung einzutragen.
