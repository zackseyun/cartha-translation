  text: For your strength is the beginning of righteousness[b][a], and your mastery over all makes you spare all.
translation:
  language: de
  text: Denn deine Stärke ist der Ursprung der Gerechtigkeit[a][b], und deine Herrschaft über alles bewirkt, dass du alles verschonst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Anfang der Gerechtigkeit“. Das griechische Wort kann „Anfang“, „Ursprung“ oder „Grundprinzip“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Gerechtigkeit“ kann hier sowohl Gottes Rechtschaffenheit als auch sein gerechtes Handeln bezeichnen.
    reason: semantic_range
lexical_decisions:
- source_word: ἰσχύς
  choice: Stärke
  rationale: Bezeichnet Kraft oder Fähigkeit; „Stärke“ gibt den Ausdruck unmittelbar wieder, ohne ihn unnötig zu abstrahieren.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl moralische Rechtschaffenheit als auch gerechtes Handeln ab und passt zur Aussage über Gottes Herrschaft.
- source_word: ἀρχή
  choice: Ursprung
  rationale: Im Zusammenhang bezeichnet ἀρχή die begründende Quelle oder den Ausgangspunkt. „Ursprung“ klingt im Deutschen natürlicher als „Anfang“, ohne die Mehrdeutigkeit zu verschweigen.
- source_word: δεσπόζειν
  choice: dass du über alles Herr bist
  rationale: Gibt das substantivierte Infinitivgefüge und die tatsächliche Souveränität von δεσπόζειν natürlich und würdig wieder.
- source_word: φείδεσθαι
  choice: verschonen
  rationale: Das Verb bedeutet, jemanden oder etwas vor Vernichtung beziehungsweise Schaden zu bewahren; „verschonen“ ist knapp und kontextgerecht.
- source_word: ποιεῖ
  choice: lässt dich
  rationale: 'Drückt die kausative Beziehung idiomatisch aus: Gottes umfassende Herrschaft ist der Grund seines schonenden Handelns.'
- source_word: πάντων ... πάντων
  choice: über alles ... alles
  rationale: Bewahrt die auffällige Wiederholung und lässt wie das Griechische offen, ob Personen, Dinge oder die gesamte Schöpfung gemeint sind.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη in der Aussage über Gottes Wesen und Handeln
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ ist die übliche und semantisch breite deutsche Wiedergabe; sie umfasst hier Gottes rechtes Wesen und sein gerechtes Handeln.
- issue: Verhältnis von Gottes Allherrschaft zu seinem Verschonen
  choice: kausale Aussage bewahrt
  alternative: bloße Begleitaussage
  rationale: 'ποιεῖ stellt ausdrücklich einen Wirkzusammenhang her: Gerade Gottes Herrschaft über alles führt dazu, dass er alles verschont. Diese Spannung wird nicht abgeschwächt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „alles … alles“ bildet die griechische Parallelstruktur nach; die Formulierung bleibt hinsichtlich des Umfangs von πάντων bewusst offen.
