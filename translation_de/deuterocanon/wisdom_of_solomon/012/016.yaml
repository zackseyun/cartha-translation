  source_fidelity: 'Der Entwurf gibt die Gliederung und den Sinn des Griechischen zutreffend wieder: Gottes Stärke steht als ἀρχή in Beziehung zur δικαιοσύνη; seine Herrschaft über das All hat zur Folge, dass er alles verschont. „Ursprung“ ist für ἀρχή vertretbar, während die Anmerkung die offene Alternative „Anfang“ sichert. Die zweimalige Weite von πάντων bleibt mit „alles … alles“ erhalten.'
  naturalness: Die Konstruktion „dass du über alles Herr bist, lässt dich alles verschonen“ ist verständlich, wirkt im modernen Standarddeutsch jedoch syntaktisch schwerfällig und kann bei „lässt dich“ einen permissiven Nebensinn nahelegen. Eine Nominalformulierung mit „bewirkt, dass“ ist natürlicher und macht die von ποιεῖ ausgedrückte Kausalität klar.
  terminology: „Stärke“, „Gerechtigkeit“, „Herrschaft“ und „verschonen“ sind angemessen und registergerecht. „Herrschaft über alles“ gibt δεσπόζειν idiomatischer wieder als die im Entwurf verwendete dass-Konstruktion, ohne die souveräne Bedeutung abzuschwächen. Die Fußnoten behandeln die relevanten Bedeutungsfelder von ἀρχή und δικαιοσύνη transparent.
