translation:
  language: de
  text: 'die du hasstest, weil sie die abscheulichsten Taten verübten: Zaubereien[a] und unheilige Riten[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „magische Künste“; das griechische Wort kann allgemein magische Praktiken und in manchen Zusammenhängen auch den Gebrauch von Tränken oder Giften bezeichnen.
