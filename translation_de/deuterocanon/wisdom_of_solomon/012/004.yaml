  - marker: b
    text: Oder „Zeremonien“ beziehungsweise „Einweihungsriten“; das griechische Wort kann kultische Vollzüge bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισήσας
  choice: die du hasstest
  rationale: Das Aoristpartizip bezieht sich im fortlaufenden Satz auf die in Vers 3 genannten früheren Bewohner und hat Gott als handelndes Subjekt. Ein deutscher Relativsatz bildet diesen Anschluss natürlich und quellennah ab.
- source_word: ἐπὶ τῷ
  choice: weil
  rationale: Die Verbindung bezeichnet hier den Grund für den Hass und wird im Deutschen idiomatisch durch einen Kausalsatz wiedergegeben.
- source_word: ἔχθιστα
  choice: überaus abscheuliche
  rationale: Der Superlativ drückt stärkste Abscheu aus. „Überaus abscheuliche“ bewahrt die intensive Bedeutung, ohne die Formulierung unnötig altertümlich wirken zu lassen.
- source_word: πράσσειν
  choice: verübten
  rationale: Das Verb bezeichnet das Tun beziehungsweise Ausüben; bei moralisch verwerflichen Taten ist „verüben“ im Deutschen treffend und natürlich.
- source_word: ἔργα
  choice: Taten
  rationale: „Taten“ gibt die konkreten Handlungen und ihr moralisches Gewicht verständlich wieder.
- source_word: φαρμακειῶν
  choice: Zauberei
  rationale: Im kultisch-religiösen Zusammenhang bezeichnet das Wort magische Praktiken; „Zauberei“ ist klar, ohne eine bestimmte Methode wie Giftmischerei festzulegen.
- source_word: τελετὰς
  choice: Riten
  rationale: Der Ausdruck kann kultische Feiern, Zeremonien oder Einweihungsriten bezeichnen. „Riten“ lässt diese Spannweite offen.
- source_word: ἀνοσίους
  choice: unheilige
  rationale: Das Adjektiv bezeichnet, was der Heiligkeit oder religiösen Pflicht widerspricht; „unheilig“ ist direkt und passt zum kultischen Zusammenhang.
theological_decisions:
- issue: Bezug des Partizips μισήσας
  choice: '„die du hasstest“: Gott ist das Subjekt des Hasses, dessen Objekt die zuvor genannten Bewohner sind.'
  alternative: Das Partizip isoliert oder als Aussage über gehasste Dinge wiederzugeben.
  rationale: 'Im griechischen Satz setzt Vers 4 die in Vers 3 begonnene Konstruktion fort: Die früheren Bewohner sind das Objekt zu μισήσας. Der Relativsatz bewahrt diesen syntaktischen Bezug, ohne den Hass auf die Taten statt auf die Bewohner umzulenken.'
- issue: Verhältnis von Gottes Hass und den verwerflichen Praktiken
  choice: Die Praktiken werden mit „weil“ als Grund für Gottes Hass angegeben.
  alternative: Eine lockerere Beiordnung, die das genaue Verhältnis offenlässt.
  rationale: ἐπὶ τῷ mit dem Infinitiv hat hier begründende Kraft. Die Übersetzung wahrt damit die Spannung der Aussage, dass Gott die Bewohner wegen ihrer Taten hasste, statt sie theologisch abzuschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers bleibt als Fortsetzung des in Vers 3 begonnenen Satzes kleingeschrieben und endet mit einem Komma. Die Doppelpunktkonstruktion macht deutlich, dass Zauberei und unheilige Riten die zuvor genannten abscheulichen Taten näher bestimmen.
