base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/015.yaml
  text: But being righteous[a], you govern all things righteously[b], considering it foreign to your power to condemn one who does not deserve to be punished.
translation:
  language: de
  text: Du aber bist gerecht und leitest alles in Gerechtigkeit; denn du erachtest es als deiner Macht fremd, jemanden zu verurteilen, der keine Strafe verdient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der nicht verpflichtet ist, bestraft zu werden“; auch: „der keiner Strafe verfallen ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος ... δικαίως
  choice: gerecht ... in Gerechtigkeit
  rationale: Bewahrt die enge Wortverwandtschaft und den rhetorischen Gleichklang, ohne im Deutschen unnatürlich „gerecht ... gerechterweise“ zu formulieren.
- source_word: τὰ πάντα
  choice: alles
  rationale: Gibt den umfassenden Ausdruck knapp und ohne unnötige kosmologische Präzisierung wieder.
- source_word: διέπεις
  choice: leitest
  rationale: Bezeichnet ordnende, lenkende Herrschaft; „leitest“ ist natürlich und lässt sowohl Regierung als auch fürsorgliche Verwaltung anklingen.
- source_word: αὐτὸν τὸν μὴ ὀφείλοντα κολασθῆναι
  choice: jemanden, der keine Strafe verdient
  rationale: Gibt die Verpflichtungs- beziehungsweise Haftungsbedeutung von ὀφείλω idiomatisch wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: καταδικάσαι
  choice: zu verurteilen
  rationale: Erhält den gerichtlichen Sinn des griechischen Verbs.
- source_word: ἀλλότριον ... τῆς σῆς δυνάμεως
  choice: deiner Macht fremd
  rationale: Bewahrt die Metapher von etwas, das Gottes Macht wesensfremd beziehungsweise nicht angemessen ist, ohne sie dogmatisch auszudeuten.
- source_word: ἡγούμενος
  choice: Es wäre
  rationale: Der gedanklich wertende Partizipialsatz wird im Deutschen als natürliche Feststellung wiedergegeben; das Urteil Gottes bleibt als Aussage über das seiner Macht Fremde erhalten.
theological_decisions:
- issue: Verhältnis von Gottes Macht und Gerechtigkeit
  choice: Die Verurteilung eines Menschen, der keine Strafe verdient, wird als Gottes Macht fremd bezeichnet.
  alternative: „deiner Macht unwürdig“ oder „mit deiner Macht unvereinbar“
  rationale: Die Formulierung erhält die Verbindung zwischen Gottes Gerechtigkeit, seiner gerechten Leitung und seiner Macht. Sie legt weder fest, dass δύναμις ausschließlich Amtsgewalt bedeutet, noch reduziert sie ἀλλότριον bloß auf mangelnde Würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des griechischen Wortstamms δίκαιος/δικαίως wird durch „gerecht/in Gerechtigkeit“ erkennbar gehalten. Die Satzteilung erhöht die Verständlichkeit, ohne den Gedankengang zu verändern.
