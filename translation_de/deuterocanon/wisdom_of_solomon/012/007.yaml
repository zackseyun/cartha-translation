  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/007.yaml
  text: so that the land most precious of all in your sight might receive a worthy colony of God's children[a][b].
translation:
  language: de
  text: damit das Land, das in deinen Augen das kostbarste von allen ist, eine würdige Ansiedlung der Kinder Gottes aufnehme.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine würdige Niederlassung«; das griechische Wort kann eine Kolonie oder eine angesiedelte Bevölkerung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das bei dir kostbarste Land von allen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das beabsichtigte Ergebnis ein und gibt die finale Kraft der griechischen Konjunktion natürlich wieder.
- source_word: ἀξίαν
  choice: würdige
  rationale: Bezeichnet die Ansiedlung als dem kostbaren Land angemessen und bewahrt die qualitative Wertung des griechischen Adjektivs.
- source_word: ἀποικίαν
  choice: Ansiedlung
  rationale: Das Wort kann eine Kolonie, Niederlassung oder angesiedelte Bevölkerung bezeichnen. »Ansiedlung« bewahrt den konkreten Bezug auf die Niederlassung eines Volkes, ohne die heutigen politischen Nebenbedeutungen von »Kolonie« unnötig hervorzurufen.
- source_word: δέξηται
  choice: aufnehme
  rationale: Der Aorist Konjunktiv nach ἵνα beschreibt das beabsichtigte Aufnehmen der angesiedelten Bevölkerung durch das Land. Der deutsche Konjunktiv wahrt die finale Satzfügung in gehobenem, aber verständlichem Stil.
- source_word: θεοῦ παίδων
  choice: der Kinder Gottes
  rationale: παῖς kann je nach Zusammenhang Kind, Sohn oder Diener bedeuten. Hier passt angesichts des im Land angesiedelten Gottesvolkes die familiäre Bedeutung; eine ausschließlich männliche Aussage ist nicht erforderlich.
- source_word: ἡ ... γῆ
  choice: das Land
  rationale: Gemeint ist ein bestimmtes Land, das für Gottes Volk bestimmt ist, nicht die Erde insgesamt.
- source_word: ἡ παρὰ σοὶ πασῶν τιμιωτάτη
  choice: das in deinen Augen das kostbarste von allen ist
  rationale: παρὰ σοὶ bezeichnet hier Gottes Wertung, während τιμιωτάτη den Superlativ »am kostbarsten« beziehungsweise »am höchsten geschätzt« ausdrückt.
theological_decisions:
- issue: Wiedergabe von θεοῦ παίδων
  choice: der Kinder Gottes
  alternative: der Söhne Gottes; der Diener Gottes
  rationale: Der Kontext legt eine Zugehörigkeit zu Gott in familiärer Bedeutung nahe. »Kinder« bewahrt den Bedeutungsumfang von παῖς, ohne ein ausschließlich männliches Verständnis oder die alternative Dienerbedeutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Zwecksatz; »aufnehme« ist bewusst gehoben, aber geläufig. »Ansiedlung« vermeidet unnötige moderne Kolonialassoziationen, ohne den konkreten Siedlungssinn abzuschwächen.
