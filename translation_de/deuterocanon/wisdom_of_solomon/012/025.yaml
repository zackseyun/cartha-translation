  text: Therefore[a], as to senseless children, you sent judgment for mockery;
translation:
  language: de
  text: Darum sandtest du ihnen wie unverständigen Kindern ein Gericht zur Verspottung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gericht zum Spott“; auch „ein Gericht als Verhöhnung“. Die Wendung εἰς ἐμπαιγμόν kann Ziel, Art oder Folge des Gerichts bezeichnen; worauf sich die Verspottung genau richtet, wird nicht ausdrücklich gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Die Wendung zieht eine Folgerung aus dem vorherigen Gedankengang; „Darum“ ist knapp, natürlich und wahrt den logischen Anschluss.
- source_word: ὡς παισὶν ἀλογίστοις
  choice: wie unverständigen Kindern
  rationale: ὡς kennzeichnet hier einen Vergleich beziehungsweise die Art der Behandlung. παῖς meint im Zusammenhang Kinder, und ἀλόγιστος bezeichnet fehlende Einsicht oder Vernunft. „Unverständig“ ist im Deutschen klarer und weniger technisch als „unvernünftig“ oder „irrational“.
- source_word: τὴν κρίσιν
  choice: ein Gericht
  rationale: κρίσις bezeichnet Gottes richterliches Handeln. „Gericht“ bewahrt die rechtliche und strafende Bedeutungsbreite, ohne den Ausdruck vorschnell auf „Strafe“ zu verengen.
- source_word: εἰς ἐμπαιγμόν
  choice: das sie dem Spott preisgab
  rationale: Die Ziel- oder Ergebnisangabe mit εἰς und ἐμπαιγμός wird in natürlichem Deutsch als Wirkung des Gerichts ausgedrückt. So bleibt der Gedanke von Spott beziehungsweise Verhöhnung erhalten, ohne die schwer verständliche Formulierung „ein Gericht zur Verspottung“ zu verwenden.
- source_word: ἔπεμψας
  choice: sandtest du
  rationale: Die konkrete Bildsprache von πέμπω („senden, schicken“) wird beibehalten und nicht deutend durch „verhängtest“ oder „fügtest zu“ ersetzt.
theological_decisions:
- issue: Ob ὡς παισὶν ἀλογίστοις eine Identitätsaussage oder einen Vergleich bezeichnet
  choice: Gott behandelte sie wie unverständige Kinder.
  alternative: Gott sandte das Gericht an sie als unverständige Kinder.
  rationale: ὡς lässt eine vergleichende beziehungsweise modale Lesart zu. Die Übersetzung wahrt den rhetorischen Vergleich, ohne zu behaupten, die Betroffenen seien buchstäblich Kinder gewesen.
- issue: Ob κρίσις enger als „Strafe“ wiederzugeben ist
  choice: Gericht
  alternative: Strafe; Strafgericht
  rationale: Der griechische Ausdruck ist weiter als eine bloße Strafmaßnahme und trägt richterliche Bedeutung. „Gericht“ erhält diese theologische und juristische Spannung.
- issue: Wie εἰς ἐμπαιγμόν auf das Gericht bezogen ist
  choice: Das Gericht gab die Betroffenen dem Spott preis.
  alternative: Das Gericht wurde zur Verspottung gesandt; das Gericht diente als Verhöhnung.
  rationale: Die Präpositionalfügung kann Ziel oder Ergebnis bezeichnen. Der Haupttext formuliert idiomatisch, während die Fußnote die weniger festgelegten Alternativen offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildlichkeit des „gesandten Gerichts“ bleibt erhalten; die schwer übertragbare Wendung εἰς ἐμπαιγμόν wird im Haupttext verständlich entfaltet und in der Fußnote formalere Möglichkeiten bewahrt.
