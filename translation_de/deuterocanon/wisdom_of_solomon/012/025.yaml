  source_fidelity: 'Die Grundstruktur ist richtig: διὰ τοῦτο als Folgerung, die vergleichende Behandlung durch ὡς παισὶν ἀλογίστοις, κρίσις als „Gericht“ und ἔπεμψας als „sandtest“. Die Entfaltung „das sie dem Spott preisgab“ legt jedoch zusätzlich fest, dass die Betroffenen vom Gericht dem Spott ausgesetzt wurden. Diese Objekt- und Wirkungszuweisung ist im griechischen εἰς ἐμπαιγμόν nicht ausdrücklich enthalten und engt dessen umstrittene Beziehung zum Gericht unnötig ein.'
  naturalness: „Darum sandtest du ihnen wie unverständigen Kindern ein Gericht zur Verspottung“ ist würdiges, gut verständliches modernes Standarddeutsch. Die Stellung von „wie unverständigen Kindern“ bildet die griechische Vergleichsstruktur direkt ab.
