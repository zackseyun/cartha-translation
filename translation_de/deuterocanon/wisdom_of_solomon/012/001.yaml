  text: For your imperishable Spirit is in all things[a].
translation:
  language: de
  text: Denn dein unvergänglicher Geist ist in allem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in allen Dingen“; der griechische Ausdruck kann auch kürzer mit „in allen“ wiedergegeben werden, doch im Zusammenhang ist wahrscheinlich alles Geschaffene gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: ἄφθαρτόν
  choice: unvergänglicher
  rationale: Das Adjektiv bezeichnet, was weder Verfall noch Verderben unterliegt. „Unvergänglich“ ist im modernen Deutsch klar und bewahrt den ontologischen Sinn.
- source_word: πνεῦμά
  choice: Geist
  rationale: Im Zusammenhang bezeichnet das Wort Gottes belebende und erhaltende Gegenwart. „Geist“ passt daher besser als das grundsätzlich mögliche „Hauch“ oder „Atem“.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die knappe Formulierung gibt den umfassenden Bezug natürlich wieder und lässt die grammatisch mögliche Weite des griechischen Ausdrucks bestehen; im Kontext ist wahrscheinlich die ganze Schöpfung gemeint.
theological_decisions:
- issue: Bezug von πνεῦμά σου
  choice: dein Geist
  alternative: dein Hauch / dein Atem
  rationale: Der Zusammenhang spricht für Gottes belebende, erhaltende Gegenwart. „Geist“ wahrt diesen göttlichen Bezug, ohne eine spätere trinitarische Präzisierung ausdrücklich in den Vers hineinzutragen.
- issue: Umfang von ἐν πᾶσιν
  choice: in allem
  alternative: in allen Dingen / in allen
  rationale: „In allem“ legt den Bezug auf die gesamte Schöpfung nahe, bewahrt aber die Kürze und gewisse Offenheit des Griechischen. „In allen“ könnte im Deutschen vorschnell nur Personen meinen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur des Griechischen bleibt erhalten. Da deutsche Substantive grundsätzlich großgeschrieben werden, erzwingt „Geist“ keine zusätzliche dogmatische Festlegung durch Großschreibung.
