base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/010.yaml
  text: But in judging them little by little[a], you were giving room for repentance, not being unaware that their origin was evil and their wickedness innate, and that their way of thinking would never change forever[b],
translation:
  language: de
  text: Doch indem du sie nach und nach richtetest, gabst du ihnen Raum zur Umkehr[a]. Dabei wusstest du sehr wohl, dass ihre Herkunft böse und ihre Bosheit ihnen angeboren war und dass sich ihre Denkweise niemals ändern würde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gabst du Raum zur Umkehr“; gemeint sein kann auch: „gabst du Gelegenheit zur Umkehr“ oder „ließest du Zeit zur Umkehr“.'
    reason: lexical_alternative
  - marker: b
    text: „Herkunft“ kann hier auch „Geburt“ oder „Abstammung“ bedeuten. Das griechische Wort γένεσις lässt diese Bedeutungen zu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνων δὲ κατὰ βραχὺ
  choice: Doch indem du sie nach und nach richtetest
  rationale: Die präsentische Partizipialkonstruktion bezeichnet den begleitenden Vorgang; „nach und nach“ bewahrt den schrittweisen Sinn von κατὰ βραχύ.
- source_word: ἐδίδους τόπον μετανοίας
  choice: gabst du ihnen Raum zur Umkehr
  rationale: Die Wendung bewahrt das Bild von τόπος („Raum, Platz“) und gibt μετάνοια natürlich als „Umkehr“ wieder.
- source_word: οὐκ ἀγνοῶν
  choice: Dabei wusstest du sehr wohl
  rationale: Die griechische Litotes drückt volle Kenntnis aus. Die positive deutsche Form ist natürlich und wahrt die Aussagekraft.
- source_word: πονηρὰ ἦ γένεσις αὐτῶν
  choice: ihre Herkunft böse war
  rationale: γένεσις kann Herkunft, Geburt oder Abstammung bezeichnen. „Herkunft“ erhält diese Bedeutungsbreite, ohne die Aussage biologisch oder dogmatisch zu verengen.
- source_word: ἔμφυτος ἡ κακία αὐτῶν
  choice: ihre Bosheit ihnen angeboren war
  rationale: ἔμφυτος bezeichnet etwas Eingewachsenes oder Angeborenes. Die Formulierung gibt den starken Wortlaut verständlich wieder.
- source_word: ὁ λογισμὸς αὐτῶν
  choice: ihre Denkweise
  rationale: λογισμός bezeichnet hier nicht nur einen einzelnen Gedanken, sondern die Weise des Denkens beziehungsweise die innere Ausrichtung.
- source_word: οὐ μὴ ἀλλαγῇ ... εἰς τὸν αἰῶνα
  choice: sich niemals ändern würde
  rationale: οὐ μή ist eine nachdrückliche Verneinung; zusammen mit εἰς τὸν αἰῶνα bezeichnet sie dauernde Unveränderlichkeit. „Niemals“ bringt beides ohne redundantes „niemals für immer“ zum Ausdruck.
theological_decisions:
- issue: Ob der Vers eine absolute metaphysische Unfähigkeit zur Umkehr lehrt
  choice: Die starke Aussage über angeborene Bosheit und eine niemals veränderte Denkweise bleibt stehen.
  alternative: Die Aussage entweder deterministisch als ausdrückliche metaphysische Unfähigkeit oder abgeschwächt als bloße Neigung zum Bösen wiederzugeben.
  rationale: Der griechische Text formuliert scharf, definiert aber keine spätere Lehrkategorie. Die Übersetzung bewahrt daher die Spannung zwischen gewährtem Raum zur Umkehr und der bleibenden Denkweise, ohne sie systematisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede Gottes und die partizipiale Verknüpfung bleiben erhalten; schwerfällige doppelte Verneinung und unnötige dogmatische Präzisierung werden vermieden.
