  text: with how much care you judged your sons[a], to whose fathers you gave oaths and covenants with good promises[c][b];
translation:
  language: de
  text: Mit wie großer Sorgfalt[a] hast du deine Söhne[b] gerichtet, deren Vätern du Eide und Bündnisse mit guten Verheißungen[c] gegeben hast!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „mit wie großer Genauigkeit“ oder „mit welcher Strenge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „deine Kinder“; im Griechischen steht ausdrücklich „Söhne“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „Eide und Bündnisse, die Gutes verhießen“ oder „Eide und Bündnisse guter Verheißungen“.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: μετὰ πόσης ἀκριβείας
  choice: mit wie großer Sorgfalt
  rationale: Die Wendung hebt das genaue, gewissenhafte und möglicherweise auch strenge Vorgehen Gottes hervor. „Mit wie großer Sorgfalt“ gibt die exklamative Form natürlich wieder, ohne den Bedeutungsumfang von ἀκρίβεια auf bloße Strenge zu verengen.
- source_word: ἔκρινας
  choice: hast du … gerichtet
  rationale: „Richten“ bewahrt den rechtlich-moralischen Sinn von κρίνω im Kontext von Gottes Handeln an Israel.
- source_word: τοὺς υἱούς σου
  choice: deine Söhne
  rationale: Das Griechische verwendet ausdrücklich den maskulinen Plural υἱούς. „Söhne“ erhält zudem die Bundes- und Sohnschaftssprache für Israel.
- source_word: ὧν τοῖς πατράσιν
  choice: deren Vätern
  rationale: Die relative Konstruktion verbindet die Söhne mit ihren Vorfahren; der Dativ wird durch die deutsche Satzkonstruktion „deren Vätern … gegeben“ wiedergegeben.
- source_word: ὅρκους καὶ συνθήκας
  choice: Eide und Bündnisse
  rationale: Die beiden feierlichen Bundesbegriffe bleiben getrennt erhalten. „Bündnisse“ entspricht dem biblisch-religiösen Kontext besser als das schwächere „Vereinbarungen“.
- source_word: ἀγαθῶν ὑποσχέσεων
  choice: mit guten Verheißungen
  rationale: Die Formulierung macht in natürlichem Deutsch deutlich, dass die Eide und Bündnisse gute Verheißungen enthalten beziehungsweise mit ihnen verbunden sind, ohne die Beziehung syntaktisch enger festzulegen als der griechische Genitiv.
theological_decisions:
- issue: Geschlechtsspezifische Sohnschaftssprache für Israel
  choice: deine Söhne
  alternative: deine Kinder
  rationale: Da υἱούς ausdrücklich „Söhne“ bedeutet und die Sohnschaft Israels im Bund anklingen kann, wird die geschlechtsspezifische Ausgangsform bewahrt.
- issue: Unterscheidung der Bundesbegriffe
  choice: Eide und Bündnisse
  alternative: eidliche Zusagen
  rationale: Die Häufung zweier Begriffe betont Gottes feierliche Verpflichtung gegenüber den Vätern; eine Zusammenziehung würde diese Akzentuierung abschwächen.
- issue: Bezug des Genitivs ἀγαθῶν ὑποσχέσεων
  choice: mit guten Verheißungen
  alternative: Bündnisse guter Verheißungen / Bündnisse, die Gutes verhießen
  rationale: Der knappe griechische Genitiv lässt offen, ob die Verheißungen qualitativ „gut“ sind oder Gutes zum Inhalt haben und wie genau sie sich auf Eide und Bündnisse beziehen. Die Hauptfassung bleibt verständlich und bewahrt diese Spannung; die Fußnote nennt die wichtigsten Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die exklamative Form „mit wie großer …“ bildet πόσης ab; das abschließende Ausrufezeichen macht den Ausrufcharakter sichtbar. Die Wortwahl bleibt verständlich, bewahrt aber die gerichtliche und bundestheologische Terminologie des griechischen Textes.
