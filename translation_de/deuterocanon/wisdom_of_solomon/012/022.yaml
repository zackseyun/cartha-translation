  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: Gott erzieht „uns“ (ἡμᾶς παιδεύων), während er die Feinde mit einer unermesslichen Vielzahl von Schlägen geißelt; die Gegenüberstellung von eigenem Richten und Gerichtetwerden bleibt erhalten. „Indem“ legt im Deutschen jedoch eine instrumentale bzw. kausale Beziehung nahe, die der partizipialen, hier am besten temporalen Konstruktion nicht entspricht.'
  naturalness: „Während du uns also erziehst“ ist modernes, würdiges Deutsch und bildet den zeitlichen Begleitumstand klarer ab. „Deine Güte bedenken“ ist eine natürliche und knappe Wiedergabe der in diesem Kontext erwogenen, auf Gottes Güte gerichteten Aufmerksamkeit.
  terminology: „Erziehst“, „geißelst“, „Güte“ und „Erbarmen“ sind sachgerecht. Die Fußnote erklärt die idiomatische Intensitätsangabe angemessen, ohne eine unsichere numerische Präzisierung aufzuzwingen.
