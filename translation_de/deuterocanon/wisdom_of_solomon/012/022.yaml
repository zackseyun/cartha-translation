  text: So, while disciplining us, you scourge our enemies by the ten thousands, so that when we judge we may reflect on your goodness, and when we are judged we may expect mercy.
translation:
  language: de
  text: Während du uns also erziehst, geißelst du unsere Feinde mit zahllosen Schlägen[a], damit wir, wenn wir richten, deine Güte bedenken und, wenn wir gerichtet werden, Erbarmen erwarten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in einer Myriade von Schlägen“; die griechische Wendung betont eine unermessliche Zahl oder ein äußerstes Maß der Schläge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύων
  choice: erziehst
  rationale: Das Verb bezeichnet eine korrigierende, formende Erziehung und nicht bloß Bestrafung; „erziehen“ bewahrt diesen pädagogischen Sinn.
- source_word: ἐν μυριότητι μαστιγοῖς
  choice: mit zahllosen Schlägen
  rationale: Die Wendung bezeichnet eine unermessliche Zahl beziehungsweise ein äußerstes Maß an Geißelhieben. Die natürliche deutsche Formulierung gibt das Bild und seine Intensität wieder.
- source_word: μεριμνῶμεν
  choice: auf … bedacht sind
  rationale: Im Zusammenhang bedeutet das Verb, Gottes Güte beim eigenen Richten aufmerksam zu berücksichtigen; die Wiedergabe vermeidet den hier irreführenden Sinn „sich ängstigen“.
- source_word: ἀγαθότητα
  choice: Güte
  rationale: „Güte“ umfasst sowohl moralische Gutheit als auch wohlwollende Freundlichkeit und passt zum Handeln Gottes im Kontext.
- source_word: κρίνοντες
  choice: wenn wir richten
  rationale: Das aktive Partizip wird als temporaler Begleitumstand verstanden und bleibt im deutlichen Gegensatz zum folgenden Passiv.
- source_word: κρινόμενοι
  choice: wenn wir gerichtet werden
  rationale: Die passive Form und die parallele zeitliche Konstruktion werden im Deutschen ausdrücklich bewahrt.
- source_word: προσδοκῶμεν ἔλεος
  choice: Erbarmen erwarten
  rationale: προσδοκάω bezeichnet erwartungsvolles Warten; „Erbarmen erwarten“ bewahrt diese Zuversicht, ohne Gewissheit überzubetonen.
theological_decisions:
- issue: Verhältnis zwischen Gottes Erziehung „unser“ und der Geißelung „unserer Feinde“
  choice: Gott erzieht sein Volk korrigierend und geißelt dessen Feinde in unermesslichem Maß.
  alternative: Die zahllose Geißelung könnte auf „uns“ bezogen werden.
  rationale: Die griechische Syntax legt ἡμᾶς als Objekt von παιδεύων und τοὺς ἐχθροὺς ἡμῶν als Objekt von μαστιγοῖς nahe. So bleibt der rhetorische Gegensatz zwischen erzieherischer Zurechtweisung und strengerem Gericht erhalten.
- issue: Bedeutung von μεριμνῶμεν in Verbindung mit Gottes Güte
  choice: Beim Richten sollen Menschen Gottes Güte aufmerksam berücksichtigen.
  alternative: Das Verb kann allgemein Sorge, Besorgnis oder fürsorgliche Aufmerksamkeit ausdrücken.
  rationale: „Auf deine Güte bedacht sein“ wahrt die ethische Aufmerksamkeit, ohne im Deutschen unpassend Angst um Gottes Güte anzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erziehen“ bewahrt den formenden Sinn von παιδεύω; „geißeln“ erhält das starke Bild des Ausgangstextes. Die parallelen Wendungen „wenn wir richten“ und „wenn wir gerichtet werden“ bilden den aktiven und passiven Gegensatz klar ab.
