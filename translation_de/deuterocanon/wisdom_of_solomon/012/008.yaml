base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/008.yaml
  text: But even these[a], since they were human beings, you spared, and you sent hornets ahead as forerunners of your army, so that they might destroy them little by little[c][b];
translation:
  language: de
  text: Doch auch diese hast du geschont, weil sie Menschen waren[a], und du schicktest Hornissen[b] als Vorläufer deines Heeres[c], damit sie diese nach und nach vernichten sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „als Menschen“. Die griechische Wendung kann den Gesichtspunkt bezeichnen, unter dem Gott sie schonte; im Zusammenhang liegt eine Begründung nahe.'
    reason: lexical_alternative
  - marker: b
    text: Das Motiv, dass Gott stechende Insekten vor Israel hersendet, begegnet auch in 2. Mose 23,28; 5. Mose 7,20 und Josua 24,12.
    reason: cross_reference
  - marker: c
    text: 'Oder: „deines Heerlagers“. Das griechische Wort kann ein Lager oder ein Heer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ τούτων
  choice: Doch auch diese
  rationale: Bewahrt sowohl den adversativen als auch den hinzufügenden Sinn und verweist auf die zuvor genannten Völker.
- source_word: ὡς ἀνθρώπων
  choice: weil sie Menschen waren
  rationale: Gibt die hier naheliegende begründende Bedeutung von ὡς wieder und hebt ihren Status als Menschen hervor; die formalere Lesart wird in der Fußnote offengehalten.
- source_word: ἐφείσω
  choice: hast du geschont
  rationale: Drückt knapp aus, dass Gott von unmittelbarer Vernichtung absah.
- source_word: ἀπέστειλάς τε
  choice: und du sandtest
  rationale: Gibt den Aorist und die Verknüpfung mit dem vorhergehenden Satzteil unmittelbar wieder.
- source_word: προδρόμους
  choice: als Vorläufer
  rationale: Erhält das Bild von Wesen, die einer größeren Streitmacht vorausgesandt werden.
- source_word: τοῦ στρατοπέδου σου
  choice: deines Heeres
  rationale: στρατόπεδον kann sowohl das Heerlager als auch das Heer bezeichnen; „Heer“ vermittelt im Zusammenhang das militärische Bild klar und natürlich.
- source_word: σφῆκας
  choice: Hornissen
  rationale: Entspricht der traditionellen und kontextuell passenden Wiedergabe und bewahrt den Bezug zum biblischen Motiv vorausgesandter stechender Insekten.
- source_word: ἵνα αὐτοὺς κατὰ βραχὺ ἐξολεθρεύσωσιν
  choice: damit sie sie nach und nach vernichten sollten
  rationale: Die Zweckkonstruktion mit ἵνα, die schrittweise Ausführung in κατὰ βραχύ und die starke Bedeutung von ἐξολεθρεύω bleiben erhalten.
theological_decisions:
- issue: Grund für Gottes Schonung
  choice: Die Schonung wird damit begründet, dass die Betroffenen Menschen waren.
  alternative: Die Wendung kann formaler als „als Menschen“ beziehungsweise „wie Menschen“ verstanden werden.
  rationale: Die kausale Wiedergabe ist im Zusammenhang am wahrscheinlichsten, ohne aus der Aussage eine weitergehende Lehre abzuleiten; die sprachliche Offenheit wird in der Fußnote kenntlich gemacht.
- issue: Militärisches Bild für Gottes Handeln
  choice: στρατόπεδον wird als „Heer“ wiedergegeben.
  alternative: „Heerlager“ oder „Lager“
  rationale: „Heer“ bewahrt die Vorstellung einer göttlichen Streitmacht, der die Hornissen vorausgehen, ohne das Bild zu allegorisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt aber flüssig; „nach und nach“ gibt die schrittweise Vernichtung idiomatisch wieder.
