base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/017.yaml
  text: For you show your strength when your perfect power is disbelieved[b][a], and among those who know it you expose boldness.
translation:
  language: de
  text: Denn du zeigst deine Stärke, wenn man dir hinsichtlich der Vollkommenheit deiner Macht nicht glaubt[a], und unter denen, die es wissen, entlarvst du die Vermessenheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn man nicht an die Vollkommenheit deiner Macht glaubt“. Das Griechische ist knapp formuliert und kann entweder den Unglauben gegenüber Gott oder den Zweifel an der Vollkommenheit seiner Macht hervorheben.'
    reason: alternative_reading
  - marker: b
    text: „Vermessenheit“ gibt hier eine negativ verstandene Kühnheit wieder; möglich sind auch „Dreistigkeit“ oder „Unverschämtheit“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχὺν
  choice: Stärke
  rationale: „Stärke“ gibt ἰσχύς natürlich wieder und wahrt die begriffliche Unterscheidung zu δύναμις („Macht“) im selben Vers.
- source_word: ἐνδείκνυσαι
  choice: du zeigst
  rationale: Das Verb bezeichnet ein Zeigen oder Erweisen; „du zeigst“ ist klar, knapp und gegenwartssprachlich.
- source_word: ἀπιστούμενος ἐπὶ δυνάμεως τελειότητι
  choice: wenn man dir hinsichtlich der Vollkommenheit deiner Macht nicht glaubt
  rationale: Die Wiedergabe nimmt das Partizip auf Gott bezogen („dir nicht glaubt“) und lässt mit „hinsichtlich“ die komprimierte Beziehung zur Vollkommenheit seiner Macht bestehen.
- source_word: δυνάμεως τελειότητι
  choice: Vollkommenheit deiner Macht
  rationale: Die Genitivverbindung bezeichnet die Vollkommenheit beziehungsweise Fülle der Macht; die substantivische Form bleibt näher am Griechischen als „vollkommene Macht“.
- source_word: ἐν τοῖς εἰδόσι
  choice: unter denen, die sie kennen
  rationale: ἐν mit dem Dativ bezeichnet hier die Gruppe beziehungsweise den Bereich. Das Pronomen bezieht sich im Zusammenhang natürlich auf Gottes Macht.
- source_word: τὸ θράσος
  choice: die Vermessenheit
  rationale: θράσος kann Mut oder Kühnheit bezeichnen, hat hier wegen des tadelnden Zusammenhangs jedoch die negative Bedeutung „Vermessenheit“ oder „Unverschämtheit“.
- source_word: ἐξελέγχεις
  choice: entlarvst du
  rationale: ἐξελέγχω kann aufdecken, überführen oder zurechtweisen bedeuten. „Entlarven“ bringt das Bloßlegen schuldhafter Vermessenheit prägnant zum Ausdruck.
theological_decisions:
- issue: Bezug und Aussage der Wendung über Unglauben und göttliche Macht
  choice: Gott zeigt seine Stärke, wenn man ihm hinsichtlich der Vollkommenheit seiner Macht nicht glaubt.
  alternative: Gott zeigt seine Stärke, wenn die Vollkommenheit seiner Macht nicht geglaubt wird.
  rationale: Das passive Partizip ἀπιστούμενος ist grammatisch auf Gott bezogen, während die anschließende Präpositionalfügung den Unglauben auf die Vollkommenheit seiner Macht bezieht. Der Haupttext folgt der persönlichen Konstruktion, die Fußnote bewahrt die mögliche sachbezogene Akzentuierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede Gottes bleibt direkt; „Stärke“ und „Macht“ unterscheiden die beiden griechischen Kraftbegriffe. Die komprimierte griechische Aussage wird lesbar entfaltet, ohne ihre sachliche Spannung aufzulösen.
