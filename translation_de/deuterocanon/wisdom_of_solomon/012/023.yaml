  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/023.yaml
  text: Therefore you also tormented[a], through their own abominations, those unrighteous men who had lived in the folly of life.
translation:
  language: de
  text: Darum hast du auch die Ungerechten, die ihr Leben in Unvernunft geführt hatten, durch ihre eigenen Gräuel[a] gequält.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch ihre eigenen abscheulichen Praktiken«. Das griechische Wort kann allgemein verabscheuungswürdige Dinge bezeichnen, darunter auch götzendienerische Handlungen oder Gegenstände.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν καὶ
  choice: Darum ... auch
  rationale: Gibt sowohl den folgernden Anschluss von ὅθεν als auch die hinzufügende Kraft von καί natürlich wieder.
- source_word: τοὺς ... ἀδίκους
  choice: die Ungerechten
  rationale: Das substantivierte Adjektiv bezeichnet Personen, die durch Unrecht beziehungsweise Ungerechtigkeit gekennzeichnet sind; die Formulierung bleibt geschlechtsübergreifend und fügt kein im Griechischen fehlendes Substantiv hinzu.
- source_word: ἐν ἀφροσύνῃ ζωῆς βιώσαντας
  choice: die ihr Leben in Unvernunft geführt hatten
  rationale: Die idiomatische deutsche Wendung bewahrt den Bezug auf ihre Lebensführung; »Unvernunft« gibt ἀφροσύνη als törichte Einsichtslosigkeit wieder, ohne den kompakten griechischen Ausdruck unverständlich wörtlich abzubilden.
- source_word: διὰ τῶν ἰδίων ... βδελυγμάτων
  choice: durch ihre eigenen abscheulichen Dinge
  rationale: »Durch« erhält die instrumentale Bedeutung von διά mit Genitiv. Die bewusst breite Formulierung lässt offen, ob Praktiken, Taten, Gegenstände oder andere verabscheuungswürdige Dinge gemeint sind.
- source_word: ἐβασάνισας
  choice: hast du ... gequält
  rationale: »Quälen« bewahrt die starke Bedeutung von βασανίζω im Gerichtszusammenhang und schwächt sie nicht zu einem allgemeinen »bestrafen« ab.
theological_decisions:
- issue: Art der göttlichen Vergeltung in διὰ τῶν ἰδίων βδελυγμάτων
  choice: Gott quälte sie durch ihre eigenen abscheulichen Dinge.
  alternative: Gott bestrafte sie wegen ihrer abscheulichen Dinge oder durch bestimmte damit verbundene Geschöpfe beziehungsweise Götzen.
  rationale: διά mit Genitiv bezeichnet am natürlichsten das Mittel. Der Vers stellt damit eine ihrer Verfehlung entsprechende Vergeltung dar, legt aber den konkreten Mechanismus nicht fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, behält aber die markante Verbindung zwischen der Strafe und den eigenen Abscheulichkeiten der Betroffenen bei. Der breite Ausdruck »abscheuliche Dinge« und die Fußnote bewahren die lexikalische Offenheit.
