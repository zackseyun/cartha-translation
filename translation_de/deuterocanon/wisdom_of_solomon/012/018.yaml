base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/018.yaml
  text: But you[a], being master of strength, judge with gentleness, and with great forbearance you govern us[b]; for the power is yours whenever you will.
translation:
  language: de
  text: Du aber, der du über die Stärke gebietest, richtest mit Milde[a] und regierst uns mit großer Schonung; denn wann immer du willst, steht dir die Macht dazu zur Verfügung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Nachsicht“ beziehungsweise „mit maßvoller Güte“. Das griechische ἐπιείκεια kann Milde, nachsichtige Fairness oder maßvolle Güte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Denn das Können ist bei dir, wann immer du willst“; gemeint ist, dass dir die Fähigkeit zu handeln stets zu Gebote steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόζων ἰσχύος
  choice: der du über die Stärke gebietest
  rationale: Die Wendung bewahrt den aktiven Sinn des Partizips und gibt den Genitiv als den Bereich wieder, über den Gott verfügt. „Stärke“ hält zudem die lexikalische Unterscheidung zum späteren τὸ δύνασθαι aufrecht.
- source_word: ἐν ἐπιεικείᾳ
  choice: mit Milde
  rationale: ἐπιείκεια bezeichnet Milde, Nachsicht oder maßvolle Billigkeit. „Milde“ ist im Deutschen natürlich und bewahrt den Kontrast zwischen göttlicher Stärke und zurückhaltendem Gericht.
- source_word: κρίνεις
  choice: richtest
  rationale: „Richten“ erhält den gerichtlichen Sinn des gewöhnlichen griechischen Verbs.
- source_word: μετὰ πολλῆς φειδοῦς
  choice: mit großer Schonung
  rationale: φειδώ bezeichnet ein Verschonen oder Sich-Zurückhalten. „Schonung“ bleibt näher am griechischen Ausdruck als „Barmherzigkeit“ und überdeutet ihn nicht.
- source_word: διοικεῖς ἡμᾶς
  choice: regierst uns
  rationale: διοικεῖν meint ordnen, verwalten oder lenken; „regieren“ passt zur göttlichen Leitung und behält das ausdrücklich genannte „uns“ bei.
- source_word: πάρεστιν γάρ σοι ὅταν θέλῃς τὸ δύνασθαι
  choice: denn wann immer du willst, steht dir die Macht dazu zur Verfügung
  rationale: Die Formulierung gibt die jederzeit verfügbare Fähigkeit zum Handeln idiomatisch wieder, ohne das substantivierte δύνασθαι mit einem unbeholfenen „das Können“ abzubilden.
theological_decisions:
- issue: Göttliche Stärke und mildes Gericht
  choice: Gottes Verfügung über Stärke wird neben seiner Milde und Schonung stehen gelassen.
  alternative: Die Aussage durch ein ausdrücklich konzessives „obwohl“ zu erklären oder φειδώ stärker als „Barmherzigkeit“ zu deuten.
  rationale: Der griechische Text stellt unbeschränkte Handlungsfähigkeit und maßvolles Richten spannungsvoll nebeneinander, ohne das Verhältnis syntaktisch ausdrücklich als Einräumung zu kennzeichnen.
- issue: Bezug von ἡμᾶς
  choice: Das ausdrückliche „uns“ wird beibehalten.
  alternative: Ein allgemeines Objekt wie „alles“ einzusetzen.
  rationale: Der Ausgangstext schließt Sprecher und Gemeinschaft ausdrücklich ein; diese Perspektive darf nicht verallgemeinert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt unmittelbar; „gebieten“, „richten“ und „Schonung“ wahren den gehobenen Weisheitston, ohne altertümliche Satzformen zu verwenden.
