base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/002.yaml
  text: Therefore you rebuke those who fall away little by little[a], and by reminding them of the things in which they sin you warn them, so that, having been set free from wickedness, they may put faith in you, Lord.
translation:
  language: de
  text: Darum weist du diejenigen, die sich verfehlen, nach und nach zurecht; indem du sie an das erinnerst, worin sie sündigen, mahnst du sie, damit sie, von der Bosheit befreit, auf dich vertrauen, Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διό
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus dem vorausgehenden Gedankengang.
- source_word: τοὺς παραπίπτοντας
  choice: die, die sich verfehlen
  rationale: παραπίπτω bezeichnet hier ein moralisches Abweichen oder Fehlgehen. „Sich verfehlen“ wahrt diese Breite, ohne bereits einen endgültigen Glaubensabfall anzunehmen.
- source_word: κατʼ ὀλίγον
  choice: nach und nach
  rationale: Die Wendung wird auf das folgende ἐλέγχεις bezogen und beschreibt Gottes schrittweise, maßvolle Zurechtweisung. Die griechische Wortstellung lässt eine gewisse Anschlussmehrdeutigkeit zu.
- source_word: ἐλέγχεις
  choice: weist du … zurecht
  rationale: Gibt die aufdeckende und korrigierende Funktion des Verbs in natürlichem modernem Deutsch wieder.
- source_word: ἐν οἷς ἁμαρτάνουσιν
  choice: an das, worin sie sündigen
  rationale: Bewahrt den Bezug auf die konkreten Bereiche oder Taten ihrer Sünde.
- source_word: ὑπομιμνήσκων
  choice: Du erinnerst sie
  rationale: Der Partizipialgedanke wird zur besseren deutschen Lesbarkeit als eigener, koordinierter Satz wiedergegeben.
- source_word: νουθετεῖς
  choice: mahnst sie
  rationale: „Mahnen“ verbindet Unterweisung und moralische Warnung und trifft so die korrigierende Absicht von νουθετέω.
- source_word: ἀπαλλαγέντες τῆς κακίας
  choice: von der Bosheit befreit
  rationale: Bewahrt die passive Form und den Gedanken der Befreiung von einem Zustand moralischer Schlechtigkeit.
- source_word: πιστεύσωσιν ἐπὶ σέ
  choice: auf dich vertrauen
  rationale: πιστεύω mit ἐπί und Akkusativ bezeichnet hier auf Gott gerichteten Glauben beziehungsweise Vertrauen. „Auf dich vertrauen“ ist im Deutschen idiomatisch und bildet die gerichtete Beziehung deutlich ab.
- source_word: Κύριε
  choice: Herr
  rationale: Gibt den Vokativ als direkte Anrede Gottes schlicht und würdig wieder.
theological_decisions:
- issue: Bedeutung von πιστεύσωσιν ἐπὶ σέ
  choice: auf dich vertrauen
  alternative: an dich glauben
  rationale: Die Konstruktion kann sowohl mit Glauben als auch mit Vertrauen wiedergegeben werden. „Auf dich vertrauen“ betont die durch ἐπί ausgedrückte Hinwendung, ohne den Glaubensaspekt auszuschließen; die Alternative bleibt in der Fußnote erhalten.
- issue: Bezug von κατʼ ὀλίγον
  choice: 'auf Gottes Zurechtweisung: „nach und nach“'
  alternative: 'auf das Sich-Verfehlen: „die nach und nach abirren“'
  rationale: Kontext und Aussageabsicht sprechen stärker für eine schrittweise beziehungsweise maßvolle göttliche Zurechtweisung. Wegen der griechischen Wortstellung ist der alternative Anschluss grammatisch nicht völlig ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde behutsam gegliedert, damit die Abfolge von Zurechtweisung, Erinnerung, Mahnung, Befreiung und Vertrauen für heutige Leser klar bleibt.
