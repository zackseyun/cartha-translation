base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/013.yaml
  text: For there is no god besides you who cares for all[a], so that you should show that you did not judge unjustly[b];
translation:
  language: de
  text: Denn außer dir gibt es keinen Gott, der für alles Sorge trägt[a] und dem du zeigen müsstest, dass du nicht ungerecht geurteilt hast[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sich um alles kümmert“ oder „dem alles am Herzen liegt“. Das Griechische lässt offen, ob πάντων vor allem Personen oder die Gesamtheit aller Dinge bezeichnet.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dass du nicht ungerecht geurteilt hast“; dem Sinn nach auch: „dass du gerecht geurteilt hast“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Denn ... keinen
  rationale: γάρ begründet die vorausgehende Aussage; die Verbindung mit der verneinten Existenzformel wird im Deutschen natürlich mit „Denn ... keinen“ wiedergegeben.
- source_word: θεός ... πλὴν σοῦ
  choice: außer dir gibt es keinen Gott
  rationale: πλήν mit Genitiv bezeichnet die Ausnahme. Die deutsche Ausschließlichkeitsformel ist natürlich und bewahrt die Aussage, dass außer dem angeredeten Gott kein Gott existiert.
- source_word: ᾧ μέλει περὶ πάντων
  choice: der für alles Sorge trägt
  rationale: Die unpersönliche Konstruktion mit μέλει bezeichnet fürsorgliche Anteilnahme. „Für alles Sorge trägt“ bewahrt den Relativanschluss und lässt πάντων bewusst weit gefasst.
- source_word: πάντων
  choice: alles
  rationale: Die Form kann sachlich oder persönlich verstanden werden. „Alles“ erhält die umfassende Reichweite, ohne sie auf alle Dinge oder alle Menschen einzuengen.
- source_word: ἵνα δείξῃς
  choice: sodass du zeigen müsstest
  rationale: 'Im Zusammenhang hat ἵνα eine konsekutiv-rhetorische Färbung: Es gibt keinen anderen Gott, dem gegenüber ein Nachweis erforderlich wäre. „Müsstest“ macht diese implizite Notwendigkeit verständlich, ohne einen tatsächlichen Zweifel an Gottes Urteil zu behaupten.'
- source_word: οὐκ ἀδίκως ἔκρινας
  choice: dass du nicht ungerecht geurteilt hast
  rationale: Die verneinte griechische Formulierung wird beibehalten und nicht zum stärkeren positiven Satz „dass du gerecht geurteilt hast“ geglättet.
theological_decisions:
- issue: Ausschließlichkeitsaussage über Gott
  choice: außer dir gibt es keinen Gott
  alternative: es gibt keinen Gott neben dir
  rationale: Die Übersetzung wahrt die uneingeschränkte Aussage des griechischen Textes, ohne sie konfessionell näher zu bestimmen.
- issue: Negativ formulierte Gerechtigkeit des göttlichen Urteils
  choice: nicht ungerecht geurteilt
  alternative: gerecht geurteilt
  rationale: Die Litotes des Ausgangstextes bleibt erhalten; die rhetorische und theologische Spannung wird nicht durch eine positive Umformung beseitigt.
- issue: Funktion von ἵνα δείξῃς
  choice: sodass du zeigen müsstest
  alternative: damit du zeigst
  rationale: Die Formulierung lässt den Gedanken erkennen, dass kein anderer Gott vorhanden ist, vor dem Gott die Gerechtigkeit seines Urteils nachweisen müsste; zugleich bleibt die Folge-/Zweckbeziehung sprachlich sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sorge trägt“ ist gehoben, aber allgemein verständlich; die doppelte Verneinung der griechischen Ausschließlichkeits- und Gerechtigkeitsaussage bleibt erhalten.
