base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/027.yaml
  text: For in the very things by which they themselves suffered and were indignant—those things they thought were gods—by these[a], while being punished, they saw and recognized as the true God the one whom they had formerly refused to know. Therefore also the final end of condemnation came upon them.
translation:
  language: de
  text: Denn gerade durch das, worunter sie selbst litten und worüber sie sich empörten – durch das, was sie für Götter hielten –, wurden sie bestraft. Als sie das sahen, erkannten sie den Gott, den sie früher nicht kennen wollten, als den wahren Gott.[a] Darum traf sie auch die endgültige Folge der Verurteilung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als sie das sahen, erkannten sie den Gott, den sie früher nicht kennen wollten, wahrhaftig.« Das griechische Wort kann sich entweder als Eigenschaftswort auf »Gott« (»den wahren Gott«) oder adverbial auf »erkannten« (»erkannten wahrhaftig«) beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφʼ οἷς ... ἐπὶ τούτοις ... ἐν αὐτοῖς
  choice: über eben das, wodurch ... über das ... wurden sie bestraft
  rationale: Die wiederholten Bezüge auf dieselben Dinge bleiben erkennbar; zugleich wird die verschachtelte griechische Konstruktion in gegenwärtigem Deutsch verständlich wiedergegeben.
- source_word: ἠγανάκτουν
  choice: sie sich empörten
  rationale: Gibt den starken Unwillen beziehungsweise die Entrüstung des Verbs würdig und natürlich wieder.
- source_word: ἐδόκουν θεούς
  choice: was sie für Götter hielten
  rationale: Bewahrt die subjektive Fehleinschätzung und die ironische Gegenüberstellung von vermeintlichen Göttern und dem wahren Gott.
- source_word: κολαζόμενοι
  choice: wurden sie bestraft
  rationale: Die finite Form löst das Partizip zugunsten eines klaren deutschen Satzbaus auf, ohne die Aussage inhaltlich zu verengen.
- source_word: ὧν πάλαι ἠρνοῦντο εἰδέναι θεὸν
  choice: den sie früher nicht hatten kennen wollen
  rationale: Bringt sowohl πάλαι als auch die willentliche Weigerung von ἠρνοῦντο in natürlichem Deutsch zum Ausdruck.
- source_word: ἐπέγνωσαν ἀληθῆ
  choice: erkannten den als den wahren Gott
  rationale: ἐπιγινώσκω bezeichnet hier ein Erkennen beziehungsweise Anerkennen; ἀληθῆ wird im Haupttext als prädikatives Adjektiv zu θεόν verstanden.
- source_word: τὸ τέρμα τῆς καταδίκης
  choice: das äußerste Maß der Verurteilung
  rationale: Gibt τέρμα als erreichte Grenze beziehungsweise äußersten Endpunkt wieder und vermeidet die im Deutschen schwer verständliche Wendung „das letzte Ende“.
- source_word: ἐπʼ αὐτοὺς ἐπῆλθεν
  choice: kam ... über sie
  rationale: Bewahrt die bildhafte Aussage vom Eintreffen des Gerichts in idiomatischem biblischem Deutsch.
theological_decisions:
- issue: Bezug und Funktion von ἀληθῆ in θεὸν ἐπέγνωσαν ἀληθῆ
  choice: Sie erkannten den zuvor abgelehnten Gott als den wahren Gott.
  alternative: Sie erkannten den Gott, den sie zuvor nicht kennen wollten, wahrhaftig.
  rationale: Die Stellung erlaubt sowohl eine adjektivische als auch eine adverbiale Auffassung. Der Haupttext folgt wegen des Kontrasts zu den vermeintlichen Göttern der adjektivischen Lesart; die echte grammatische Alternative bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Periode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; Wiederholung, Ironie und die Verbindung zwischen den vermeintlichen Göttern und dem Mittel der Bestrafung bleiben erhalten.
