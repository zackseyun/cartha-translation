  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/019.yaml
  text: But by such deeds you taught your people that the righteous must be humane[a], and you made your children full of good hope[b], because you grant repentance for sins.
translation:
  language: de
  text: Doch durch solche Taten hast du dein Volk gelehrt, dass der Gerechte menschenfreundlich[a] sein muss; und du hast deine Söhne voller guter Hoffnung gemacht[b], weil du nach Sünden Umkehr gewährst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gütig zu den Menschen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „du hast deine Söhne guter Hoffnung gemacht“. „Söhne“ kann hier repräsentativ Gottes Kinder beziehungsweise sein Volk bezeichnen.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: διὰ τῶν τοιούτων ἔργων
  choice: durch solche Taten
  rationale: διά mit Genitiv bezeichnet hier das Mittel; „Taten“ gibt Gottes zuvor beschriebene Handlungen konkret und natürlich wieder.
- source_word: δεῖ τὸν δίκαιον εἶναι
  choice: dass der Gerechte … sein muss
  rationale: Die Formulierung bewahrt den repräsentativen substantivierten Singular und gibt die moralische Notwendigkeit von δεῖ klar wieder.
- source_word: φιλάνθρωπον
  choice: menschenfreundlich
  rationale: Das Wort bezeichnet eine wohlwollende, gütige Haltung gegenüber Menschen. „Menschenfreundlich“ entspricht dem griechischen Ausdruck eng, ohne ihn auf „barmherzig“ zu verengen.
- source_word: εὐέλπιδας ἐποίησας
  choice: du hast … gute Hoffnung gegeben
  rationale: Wörtlich wurden die Söhne „guter Hoffnung“ gemacht. Die gewählte deutsche Wendung ist natürlich und bewahrt den positiven Gehalt, ohne eine unidiomatische Konstruktion zu erzwingen.
- source_word: τοὺς υἱούς σου
  choice: deinen Söhnen
  rationale: Der griechische Text sagt ausdrücklich „deine Söhne“; die Wiedergabe erhält diese familiäre und rhetorische Form.
- source_word: διδοῖς ἐπὶ ἁμαρτήμασιν μετάνοιαν
  choice: weil du bei Sünden Umkehr gewährst
  rationale: „Umkehr gewähren“ wahrt Gottes Initiative. „Bei Sünden“ lässt das Verhältnis der Präposition ἐπί zu den Verfehlungen hinreichend offen und vermeidet die mögliche Fehlvorstellung, Umkehr werde zugunsten der Sünden gewährt.
theological_decisions:
- issue: Generisches Maskulinum bei τὸν δίκαιον
  choice: der Gerechte
  alternative: ein gerechter Mensch
  rationale: Der substantivierte maskuline Singular wird als repräsentative Bezeichnung beibehalten; dies wahrt die sprachliche Gestalt des Ausgangstextes, ohne die Aussage auf einen bestimmten Mann zu beschränken.
- issue: Bezeichnung τοὺς υἱούς σου
  choice: deinen Söhnen
  alternative: deinen Kindern
  rationale: Die Hauptfassung bewahrt das ausdrücklich männliche Verwandtschaftswort des Griechischen. Eine Fußnote erläutert die mögliche repräsentative Bedeutung als Gottes Kinder beziehungsweise Volk.
- issue: Gottes Handeln und μετάνοια
  choice: Umkehr gewährst
  alternative: Gelegenheit zur Umkehr gibst
  rationale: Die Formulierung erhält die göttliche Initiative, legt aber nicht fest, ob damit die innere Umkehr selbst oder die Möglichkeit dazu gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Gedankenführung, wird aber idiomatisch geglättet. „Menschenfreundlich“ ist bewusst gehobener als Alltagssprache, bleibt jedoch verständlich und bildet φιλάνθρωπος präzise ab.
