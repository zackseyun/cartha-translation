base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/024.yaml
  text: For they wandered even farther in the ways of error[a], supposing as gods even the dishonored creatures among the animals of their enemies[b], having been deceived like foolish infants.
translation:
  language: de
  text: 'Denn sie gingen auf den Irrwegen noch weiter in die Irre[a]: Sie hielten sogar Wesen, die unter den Tieren ihrer Feinde verachtet waren, für Götter[b] und wurden getäuscht wie törichte Kleinkinder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie wurden auf den Irrwegen noch weiter irregeführt.“ Das Griechische kann sowohl ihr eigenes Umherirren als auch ihr Irregeführtwerden anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Sie hielten sogar die verachteten Tiere ihrer Feinde für Götter.“ Die griechische Wortfügung lässt das Verhältnis zwischen den „verachteten“ Wesen, den Tieren und den Feinden knapp und nicht völlig eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν πλάνης ὁδῶν
  choice: auf den Irrwegen
  rationale: „Irrwege“ bewahrt sowohl das Wegbild von ὁδοί als auch den Sinn von πλάνη als Irrtum und Verirrung. Die knappe deutsche Zusammensetzung klingt natürlich und lässt sich mit dem folgenden Verb als bewusstes Wortspiel verbinden.
- source_word: μακρότερον ἐπλανήθησαν
  choice: gingen ... noch weiter in die Irre
  rationale: Die Wiedergabe erhält den Komparativ μακρότερον und die Bewegungsvorstellung von ἐπλανήθησαν. Zugleich bildet sie den griechischen Zusammenhang zwischen πλάνη und πλανάω im Deutschen durch „Irrwege“ und „in die Irre gehen“ nach.
- source_word: θεοὺς ὑπολαμβάνοντες
  choice: hielten ... für Götter
  rationale: „Für Götter halten“ ist die natürliche deutsche Entsprechung für ὑπολαμβάνειν mit prädikativem Akkusativ und kennzeichnet das Urteil der Betreffenden, ohne zusätzliche Deutung.
- source_word: τὰ καὶ ἐν ζῴοις τῶν ἐχθρῶν ἄτιμα
  choice: sogar die verachteten Geschöpfe unter den Tieren ihrer Feinde
  rationale: „Geschöpfe“ gibt das substantivierte Neutrum τὰ wieder, während „unter den Tieren“ ἐν ζῴοις sichtbar hält. „Verachtet“ trifft ἄτιμα im Sinn von ehrlos oder ohne Ansehen; die Fußnote nennt die flüssigere, aber syntaktisch weniger differenzierte Alternative.
- source_word: νηπίων δίκην ἀφρόνων
  choice: wie unverständige Kleinkinder
  rationale: „Wie“ entspricht δίκην, „Kleinkinder“ gibt νηπίων konkreter wieder als das weitere „Kinder“, und „unverständig“ bewahrt den Mangel an Einsicht in ἀφρόνων, ohne modern abwertende medizinische Konnotationen.
- source_word: ψευσθέντες
  choice: wurden getäuscht
  rationale: Die passive Form bewahrt, dass die Betreffenden einer Täuschung erliegen; sie legt nicht fest, wer sie täuscht, und macht daraus auch nicht bloß Selbsttäuschung.
theological_decisions:
- issue: Negative Bewertung des Götzendienstes
  choice: Die wertenden Begriffe bleiben als „Irrwege“, „verachtet“ und „getäuscht“ erhalten.
  alternative: Neutralisierende Formulierungen wie „andere Wege“, „gering geachtete Tiere“ oder „irrten sich“ verwenden.
  rationale: Der griechische Text beurteilt die dargestellte Gottesverehrung ausdrücklich als Verirrung, verkehrte Zuschreibung von Ehre und Täuschung. Diese Kritik ist textgegeben und darf weder abgeschwächt noch konfessionell erweitert werden.
- issue: Ursache beziehungsweise Urheberschaft der Täuschung
  choice: Das Passiv „wurden getäuscht“ bleibt ohne genannten Urheber stehen.
  alternative: „Sie täuschten sich selbst“ oder „Dämonen täuschten sie“ schreiben.
  rationale: ψευσθέντες bezeichnet Täuschung, nennt hier aber keinen Urheber. Eine ausdrückliche Selbsttäuschung oder dämonische Verursachung würde die offene Formulierung des Verses unzulässig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Wortspiel „Irrwege … in die Irre“ bildet die Wiederholung des griechischen Wortstamms nach. Der Doppelpunkt löst die lange griechische Partizipialfügung lesefreundlich auf, ohne den Gedankengang zu verändern.
