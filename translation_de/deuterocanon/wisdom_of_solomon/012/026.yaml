revisions:
- from: Die aber durch kindliche Strafen nicht zur Einsicht gebracht wurden, werden ein Gottes würdiges Gericht erfahren[a][b].
  to: Die aber, die sich durch spielerische Zurechtweisungen nicht belehren ließen, werden ein Gericht erfahren, das Gottes würdig ist[a][b].
