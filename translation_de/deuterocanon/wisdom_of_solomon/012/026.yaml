    rationale: Die Formulierung kann als Strafen verstanden werden, die Kindern auferlegt werden. παιγνίοις bezeichnet hier eher spielerisch, scherzhaft oder vergleichsweise leicht charakterisierte Zurechtweisungen; ἐπιτίμησις ist primär Zurechtweisung/Tadel, nicht notwendig Strafe.
  - severity: medium
    issue: »nicht zur Einsicht gebracht wurden« überträgt νουθετηθέντες zu resultativ.
    rationale: Das griechische Verb bezeichnet Ermahnen, Belehren oder korrigierendes Anleiten. Es sagt nicht ausdrücklich, dass die Betroffenen zur Einsicht hätten gebracht werden sollen oder nicht.
