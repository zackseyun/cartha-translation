  text: But those who were not instructed by childish punishments will experience a judgment worthy of God[a][b].
translation:
  language: de
  text: Die aber, die sich durch spielerische Zurechtweisungen nicht belehren ließen, werden ein Gericht erfahren, das Gottes würdig ist[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch scherzhafte/spöttische Zurechtweisungen« oder »durch kindliche Maßnahmen der Zurechtweisung«. Die griechische Wendung παιγνίοις ἐπιτιμήσεως ist stark verdichtet; sie kann die früheren Zurechtweisungen als vergleichsweise leicht oder beinahe spielerisch kennzeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht: »werden ein Gottes würdiges Gericht erproben/auf die Probe stellen«. Gemeint ist wohl, dass sie es durch eigenes Erleiden kennenlernen. Der Genitiv kann auch possessiv verstanden werden: »werden Gottes Gericht erfahren«.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: παιγνίοις ἐπιτιμήσεως
  choice: durch kindliche Strafen
  rationale: Die verdichtete Wendung bezeichnet im Zusammenhang vergleichsweise leichte, beinahe spielerische Maßnahmen der Zurechtweisung. »Kindliche Strafen« wahrt diesen Kontrast zum folgenden schweren Gericht, ohne wörtliche Spielsachen anzunehmen.
- source_word: μὴ νουθετηθέντες
  choice: nicht zur Einsicht gebracht wurden
  rationale: νουθετέω bezeichnet ermahnende, korrigierende Unterweisung. Die Formulierung gibt das Passiv und den pädagogischen Zweck der vorangehenden Strafen in natürlichem Deutsch wieder.
- source_word: ἀξίαν θεοῦ κρίσιν
  choice: ein Gottes würdiges Gericht
  rationale: ἀξίαν bezeichnet etwas Angemessenes oder Würdiges. Die Wiedergabe erhält die enge Verbindung mit θεοῦ und die Aussage, dass das Gericht Gottes Wesen und Hoheit entspricht; der fehlende Artikel wird mit »ein« berücksichtigt.
- source_word: πειράσουσιν
  choice: werden … erfahren
  rationale: Das Verb bedeutet wörtlich »erproben/versuchen«, bezeichnet hier aber das Kennenlernen durch eigenes Erleiden. »Erfahren« ist im Deutschen idiomatisch und wahrt diesen Sinn.
theological_decisions:
- issue: Bedeutung des Genitivs θεοῦ in ἀξίαν θεοῦ κρίσιν
  choice: 'qualitativ: »ein Gottes würdiges Gericht«'
  alternative: 'possessiv: »Gottes Gericht«; Herkunft: »ein Gericht von Gott«'
  rationale: Die Stellung von ἀξίαν bei κρίσιν legt nahe, dass das Gericht als Gottes würdig beziehungsweise ihm angemessen beschrieben wird. Die Fußnote hält die mögliche possessive Deutung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Zur Einsicht gebracht« erhält den erzieherischen Gehalt der vorausgehenden Zurechtweisung; »Gericht erfahren« bewahrt den feierlichen Ton und den Gegensatz zwischen leichter Korrektur und vollem göttlichem Gericht.
