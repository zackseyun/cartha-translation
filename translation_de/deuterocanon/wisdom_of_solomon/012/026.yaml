  source_fidelity: Die Grundstruktur und der Zukunftssinn sind zutreffend. »Zur Einsicht gebracht« verstärkt jedoch den Ergebnissinn gegenüber νουθετηθέντες („ermahnt/belehrt/zurechtgewiesen werden“). »Kindliche Strafen« kann im Deutschen außerdem Strafen an Kindern statt spielerisch-leichter Zurechtweisungen nahelegen. Die Wendung ἀξίαν θεοῦ κρίσιν wird mit einer klareren deutschen Konstruktion wiedergegeben, ohne den strittigen Genitiv festzulegen.
  naturalness: Die revidierte Fassung ist modernes, würdevolles Standarddeutsch. Die Relativkonstruktion bei »ein Gericht, das Gottes würdig ist« ist verständlicher und idiomatischer als die attributive Stellung, ohne den knappen Charakter des Verses wesentlich zu verlieren.
  terminology: »Spielerische Zurechtweisungen« wahrt den Charakter von παιγνίοις ἐπιτιμήσεως besser als »kindliche Strafen«. »Belehrt« gibt die ermahnend-pädagogische Nuance von νουθετηθέντες wieder. »Gericht« und »erfahren« sind für κρίσις bzw. πειράσουσιν angemessen. Die Fußnoten halten die lexikalische und syntaktische Mehrdeutigkeit offen.
