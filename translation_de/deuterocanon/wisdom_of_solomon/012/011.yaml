base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/011.yaml
  text: For it was a seed accursed from the beginning[a], and not fearing anyone because of the things in which they sinned[b], you granted them no pardon.
translation:
  language: de
  text: Denn es war von Anfang an eine verfluchte Nachkommenschaft[a]; auch nicht aus Rücksicht auf irgendjemanden gewährtest du ihnen Straffreiheit für das, worin sie gesündigt hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein verfluchter Same“; das griechische Wort kann bildlich eine Nachkommenschaft, Abstammungslinie oder Volksgruppe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der zweite Satzteil kann auch enger an der griechischen Wortfolge wiedergegeben werden: „Auch ohne jemanden zu fürchten, gewährtest du ihnen für das, worin sie gesündigt hatten, keine Straffreiheit.“'
    reason: alternative_reading
lexical_decisions:
- source_word: σπέρμα
  choice: Nachkommenschaft
  rationale: Das Wort bedeutet wörtlich „Same“, kann aber übertragen eine Abstammungslinie oder Volksgruppe bezeichnen. „Nachkommenschaft“ gibt den figurativen Sinn im Deutschen natürlich wieder; die wörtliche Metapher wird in der Fußnote genannt.
- source_word: κατηραμένον
  choice: verfluchte
  rationale: Das Partizip bezeichnet einen Zustand unter einem Fluch. „Verflucht“ bewahrt den ernsten, wertenden Ton.
- source_word: ἀπʼ ἀρχῆς
  choice: von Anfang an
  rationale: Direkte und idiomatische Wiedergabe der zeitlichen Bestimmung, ohne den Bezugspunkt näher festzulegen.
- source_word: εὐλαβούμενός τινα
  choice: aus Rücksicht auf irgendjemanden
  rationale: εὐλαβέομαι kann Furcht, Vorsicht oder ehrfürchtige Rücksicht ausdrücken. Im Zusammenhang bezeichnet die Wendung, dass Gott sich durch keine Person von seinem Urteil abhalten ließ. „Aus Rücksicht auf“ wahrt diese Bedeutungsbreite besser als eine ausschließlich emotionale Wiedergabe mit „Furcht“.
- source_word: ἄδειαν
  choice: Straffreiheit
  rationale: ἄδεια bezeichnet Freiheit, Erlaubnis oder Schutz beziehungsweise Immunität. Im gerichtlichen Kontext ist „Straffreiheit“ präziser als „Vergebung“, da nicht notwendig die Aufhebung persönlicher Schuld, sondern das Verschontbleiben von Strafe gemeint ist.
- source_word: ἐδίδους
  choice: gewährtest
  rationale: Das Imperfekt bezeichnet in der vergangenen Darstellung ein fortdauerndes oder charakteristisches Handeln. Das deutsche Präteritum fügt sich natürlich in die Anrede an Gott ein.
- source_word: ἐφʼ οἷς ἥμαρταν
  choice: für das, worin sie gesündigt hatten
  rationale: Die relativische Formulierung bleibt eng am Griechischen und lässt offen, ob ἐπί stärker den Grund oder den Gegenstand ihrer Schuld bezeichnet.
theological_decisions:
- issue: Identität der als σπέρμα bezeichneten Gruppe
  choice: Keine ausdrückliche Identifizierung im Haupttext; Wiedergabe als „Nachkommenschaft“
  alternative: „verfluchter Same“ oder ausdrückliche Benennung der kanaanitischen Völker
  rationale: Der nähere Zusammenhang erschließt die Gruppe, doch der Vers selbst nennt sie nicht ausdrücklich. Eine ergänzte ethnische Bezeichnung würde mehr festlegen als der griechische Wortlaut.
- issue: Bedeutung von ἄδεια im Verhältnis zu Vergebung und Strafe
  choice: „Straffreiheit“
  alternative: „Vergebung“, „Schonung“ oder „Immunität“
  rationale: Die gerichtliche Bedeutung des Satzes wird bewahrt, ohne eine umfassende theologische Aussage über die Möglichkeit von Vergebung hineinzulesen.
- issue: Syntaktischer Bezug von εὐλαβούμενός τινα und ἐφʼ οἷς ἥμαρταν
  choice: Die Rücksichtnahme bezieht sich auf „irgendjemanden“, während die Sünden den Grund beziehungsweise Gegenstand der verweigerten Straffreiheit angeben.
  alternative: „Und weil du wegen ihrer Sünden niemanden fürchtetest, gewährtest du ihnen keine Straffreiheit.“
  rationale: Die Stellung der Satzglieder lässt eine gewisse Mehrdeutigkeit zu. Die gewählte Fassung entspricht der naheliegenden Konstruktion, während die Fußnote eine enger an der griechischen Wortfolge orientierte Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachkommenschaft“ ist verständlicher als das im Deutschen missverständliche „Same“ und weniger biologisch oder rassisch gefärbt als „Geschlecht“. „Straffreiheit“ wahrt den gerichtlichen Sinn von ἄδεια; die etwas markierte Wendung „das, worin sie gesündigt hatten“ erhält die Unbestimmtheit des griechischen Relativsatzes.
