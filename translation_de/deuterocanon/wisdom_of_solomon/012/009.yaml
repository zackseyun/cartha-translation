revisions:
- from: Nicht etwa, weil du außerstande gewesen wärst, die Gottlosen in offener Schlacht in deine Gewalt zu geben oder sie durch furchterregende wilde Tiere oder durch ein schneidendes Wort[b] alle auf einmal[a] auszulöschen;
  to: Nicht etwa, weil du außerstande gewesen wärst, die Gottlosen in offener Schlacht zu unterwerfen oder sie durch furchterregende wilde Tiere oder durch ein scharfes Wort[b] alle auf einmal[a] auszutilgen;
  rationale: Die Revision beschränkt sich auf zwei sichere sprachlich-semantische Verbesserungen. „Zu unterwerfen“ beseitigt die irreführende Selbstzuordnung in „in deine Gewalt zu geben“ und entspricht der Bedeutung, die Gottlosen unter Macht zu bringen. „Ein scharfes Wort“ ist die natürlichere moderne Wiedergabe von λόγῳ ἀποτόμῳ; die Fußnote erhält die möglichen Nuancen. Satzstruktur, Ambiguität und die Verteilung der Fußnotenanker bleiben erhalten.
