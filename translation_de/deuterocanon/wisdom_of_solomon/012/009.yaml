  terminology: „Gottlosen“ bewahrt die theologisch-religiöse Dimension von ἀσεβεῖς. „Unterwerfen“ ist für ὑποχειρίους δοῦναι geeignet, ohne eine spezifische Art der Gefangennahme zu behaupten. „Furchterregende wilde Tiere“ gibt θηρίοις δεινοῖς vollständig wieder. Die Fußnoten bewahren die lexikalische Offenheit von ὑφʼ ἕν und λόγῳ ἀποτόμῳ; die Marker sind an den jeweils erläuterten deutschen Ausdrücken verankert.
