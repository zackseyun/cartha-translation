  source_fidelity: 'Die kausale Entfaltung von οὐκ ἀδυνατῶν ist im Kontext sachgerecht; auch die militärische Bedeutung von ἐν παρατάξει, die religiöse Nuance von ἀσεβεῖς und die Alternative der unmittelbaren Vernichtung werden getroffen. Bei ὑποχειρίους δοῦναι ist jedoch „in deine Gewalt zu geben“ semantisch und idiomatisch weniger präzise: Es kann nahelegen, Gott gebe die Gegner in seine eigene Gewalt. Gemeint ist ihre Unterwerfung bzw. Auslieferung unter Macht. Die Korrektur gibt dies unmittelbar wieder.'
