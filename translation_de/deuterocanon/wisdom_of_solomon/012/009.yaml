lexical_decisions:
- source_word: οὐκ ἀδυνατῶν
  choice: Nicht etwa, weil du außerstande gewesen wärst
  rationale: Die verneinte Partizipialwendung bezeichnet im Zusammenhang den nicht gegebenen Grund für Gottes maßvolles Handeln. Die deutsche kausale Formulierung macht diesen Zusammenhang natürlich verständlich, ohne eine Unfähigkeit Gottes zu unterstellen.
- source_word: ἐν παρατάξει
  choice: in offener Schlacht
  rationale: παράταξις bezeichnet die Aufstellung zum Kampf und daraus auch den geordneten Kampf selbst. „In offener Schlacht“ bewahrt den militärischen Sinn und klingt im Deutschen natürlich.
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: ἀσεβεῖς bezeichnet Menschen, deren Verfehlung insbesondere in ihrer Missachtung Gottes liegt. „Gottlose“ erhält diese religiöse Dimension.
- source_word: ὑποχειρίους δοῦναι
  choice: in deine Gewalt zu geben
  rationale: ὑποχείριος bedeutet, unter jemandes Hand beziehungsweise Macht zu stehen. Die Wendung gibt sowohl die Herrschaftsbeziehung als auch δοῦναι idiomatisch wieder.
- source_word: θηρίοις δεινοῖς
  choice: durch furchterregende wilde Tiere
  rationale: θηρία sind wilde Tiere; δεινά hebt ihre erschreckende und gefährliche Art hervor. Die Formulierung vermeidet das im Deutschen möglicherweise sagenhafte „Bestien“, ohne die Stärke abzuschwächen.
- source_word: λόγῳ ἀποτόμῳ
  choice: durch ein schneidendes Wort
  rationale: ἀπότομος kann „scharf“, „schneidend“ oder „streng“ bedeuten. „Schneidendes Wort“ bewahrt das kräftige Bild einer unmittelbar wirksamen göttlichen Äußerung und lässt die mögliche Bedeutung eines strengen Befehls offen.
- source_word: ὑφʼ ἓν
  choice: alle auf einmal
  rationale: Die griechische Redewendung betont, dass die Vernichtung in einer einzigen gemeinsamen Handlung erfolgt. „Alle auf einmal“ bringt sowohl die Gesamtheit als auch die Gleichzeitigkeit zum Ausdruck.
- source_word: ἐκτρῖψαι
  choice: auszulöschen
  rationale: ἐκτρίβω bezeichnet ein vollständiges Aufreiben oder Vernichten. „Auslöschen“ ist stark, würdig und im Deutschen gut verständlich.
theological_decisions:
- issue: Unausgesprochenes Subjekt und kausale Bedeutung der Partizipialwendung
  choice: 'Direkte Anrede Gottes: „Nicht etwa, weil du außerstande gewesen wärst“'
  alternative: 'Formnäher: „nicht außerstande, …“ oder konzessiv: „obwohl du imstande warst, …“'
  rationale: Der Zusammenhang redet Gott direkt an und stellt klar, dass sein schrittweises Gericht nicht auf mangelnder Macht beruhte. Die gewählte Form macht den impliziten kausalen Gegensatz deutlich, ohne über den griechischen Sinn hinauszugehen.
- issue: Art der durch λόγῳ ἀποτόμῳ bezeichneten göttlichen Äußerung
  choice: Das Bild bleibt als „schneidendes Wort“ erhalten.
  alternative: 'Deutender: „strenger Befehl“ oder „Machtwort“'
  rationale: Der griechische Ausdruck kann die Härte oder Entschiedenheit eines Wortes bezeichnen. Die bildhafte Wiedergabe bewahrt die Mehrdeutigkeit und legt nicht fest, ob speziell ein Befehl gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als abhängige, mit einem Semikolon endende Fortsetzung des Gedankengangs erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken; ihre Zuordnung folgt dem griechischen Text.
