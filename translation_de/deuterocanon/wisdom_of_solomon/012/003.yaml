  text: For even the ancient inhabitants of your holy land,[a]
translation:
  language: de
  text: Denn auch die früheren Bewohner deines heiligen Landes[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Bewohner deines heiligen Landes aus alter Zeit“.'
    reason: Lexikalische Alternative für τοὺς παλαιοὺς οἰκήτορας; sie macht den Zeitbezug ausdrücklich, klingt jedoch weniger knapp.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn auch
  rationale: Die Wendung verbindet den Satz erklärend mit dem Vorhergehenden; γάρ wird durch „denn“, das hinzufügende beziehungsweise hervorhebende καί durch „auch“ wiedergegeben.
- source_word: τοὺς παλαιοὺς
  choice: die früheren
  rationale: παλαιός bezeichnet hier die Bewohner aus früherer Zeit. „Früheren“ ist im Deutschen natürlicher als „alten“ oder „uralten“ und legt kein bestimmtes Alter fest.
- source_word: οἰκήτορας
  choice: Bewohner
  rationale: Das Substantiv bezeichnet Menschen, die an einem Ort wohnen. „Bewohner“ ist präzise, geläufig und vermeidet die bei „Siedler“ mögliche zusätzliche Aussage über eine Ansiedlung.
- source_word: τῆς ἁγίας σου γῆς
  choice: deines heiligen Landes
  rationale: γῆ bezeichnet im Kontext ein bestimmtes Gebiet und wird daher mit „Land“ statt mit „Erde“ wiedergegeben. Die Wortstellung bewahrt sowohl die Heiligkeit des Landes als auch die direkte Anrede Gottes.
theological_decisions:
- issue: Ob γῆ allgemein als „Erde“ oder geografisch als „Land“ wiederzugeben ist
  choice: Land
  alternative: Erde
  rationale: Gemeint ist das konkrete, Gott zugehörige Gebiet der erzählten Geschichte, nicht die ganze Erde. „Land“ wahrt diesen geografischen Sinn, ohne zusätzliche theologische Festlegungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Versfragment bleibt entsprechend der griechischen Vorlage syntaktisch offen und wird nicht durch Inhalt aus dem Folgevers ergänzt.
