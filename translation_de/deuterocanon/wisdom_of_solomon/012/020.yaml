revisions:
- from: Denn wenn du schon die Feinde deiner Kinder, die dem Tod verfallen waren, mit so großer Sorgfalt und Nachsicht[a] behandelt hast und ihnen Zeit und Raum gabst, sich von ihrer Bosheit zu lösen,
  to: Denn wenn du die Feinde deiner Kinder, die dem Tod verfallen waren, mit so großer Sorgfalt und inständigem Bitten[a] geehrt hast und ihnen Zeit und Gelegenheit gegeben hast, durch die sie von ihrer Bosheit befreit werden könnten,
  rationale: Die Revision ersetzt die interpretierende Wiedergabe „Nachsicht“ durch eine dem griechischen δέησις entsprechende Formulierung und erhält die passive Bedeutung von ἀπαλλαγῶσι. Sie bewahrt zugleich den offenen Bedingungssatz, die gerichtliche Nuance von „dem Tod verfallen“ und die vom griechischen Text ausgesprochene Gewährung von Zeit und Gelegenheit.
