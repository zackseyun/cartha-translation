base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/020.yaml
  text: For if you honored with such great care and forbearance the enemies of your children[a], even those deserving death, giving them time and opportunity by which they might be freed from wickedness,
translation:
  language: de
  text: Denn wenn du die Feinde deiner Kinder, die dem Tod verfallen waren, mit so großer Sorgfalt und inständigem Bitten[a] geehrt hast und ihnen Zeit und Gelegenheit gegeben hast, durch die sie von ihrer Bosheit befreit werden könnten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit so großer Aufmerksamkeit und Flehen“. Das griechische δέησις bedeutet „Bitte“, „Flehen“ oder „inständiges Bitten“; die Verbindung mit Gottes Handeln ist ungewöhnlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθροὺς παίδων σου
  choice: die Feinde deiner Kinder
  rationale: ἐχθρούς bezeichnet feindliche Gegner. παῖς kann »Kind«, »Sohn« oder »Diener« bedeuten; »Kinder« wahrt hier den familiären Bezug, ohne männliches Geschlecht oder ein Dienstverhältnis festzulegen.
- source_word: ὀφειλομένους θανάτῳ
  choice: die dem Tod verfallen waren
  rationale: Die Wendung bezeichnet eine Verpflichtung oder Haftung gegenüber dem Tod. »Dem Tod verfallen« gibt diese gerichtliche Zuspitzung natürlich wieder, ohne ausdrücklich festzulegen, ob vor allem Schuld, Verdienst oder bereits verhängtes Todesurteil gemeint ist.
- source_word: ἐτίμησας
  choice: behandelt hast
  rationale: τιμάω bedeutet gewöhnlich »ehren« oder »wertschätzen«, bezeichnet hier aber die auffallend schonende Art, in der Gott mit den Feinden umging. »Behandelt hast« ist im Deutschen kontextgerecht; die nachfolgende Bestimmung benennt die besondere Achtung, mit der dies geschah.
- source_word: μετὰ τοσαύτης προσοχῆς καὶ δεήσεως
  choice: mit so großer Sorgfalt und Nachsicht
  rationale: προσοχή bezeichnet Aufmerksamkeit oder Sorgfalt. δέησις heißt wörtlich Bitte oder Flehen, ist in dieser Beschreibung göttlichen Handelns jedoch ungewöhnlich. »Nachsicht« bringt den Zusammenhang von Aufschub und Umkehrmöglichkeit zum Ausdruck; die wörtlichere Möglichkeit wird in der Fußnote offengelegt.
- source_word: δοὺς χρόνους καὶ τόπον
  choice: ihnen Zeit und Raum gabst
  rationale: Die Wiedergabe bleibt nahe bei χρόνοι (Zeiten/Zeit) und τόπος (Ort/Raum). »Zeit und Raum geben« ist auch im Deutschen verständlich und bezeichnet die gewährte Möglichkeit zur Abkehr vom Bösen.
- source_word: ἀπαλλαγῶσι τῆς κακίας
  choice: sich von ihrer Bosheit zu lösen
  rationale: ἀπαλλάσσω bezeichnet Befreiung, Loslösung oder Entkommen; κακία bezeichnet sittliche Schlechtigkeit oder Bosheit. Die reflexive deutsche Form gibt das mögliche Freiwerden idiomatisch wieder, ohne die Umkehr stärker auszudeuten, als der griechische Wortlaut verlangt.
theological_decisions:
- issue: Bedeutung von δέησις bei der Beschreibung von Gottes Umgang mit den Gottlosen
  choice: Nachsicht
  alternative: Bitte, Flehen oder inständiges Zureden
  rationale: Die wörtlichen Bedeutungen bleiben möglich und werden in der Fußnote bewahrt. Im unmittelbaren Zusammenhang geht es jedoch um aufgeschobenes Gericht sowie gewährte Zeit und Gelegenheit, weshalb »Nachsicht« den argumentativen Sinn natürlich wiedergibt, ohne die ungewöhnliche Bildsprache stillschweigend zu einer festen Lehraussage über Gottes Bitten zu machen.
- issue: Grad der Schuld in ὀφειλομένους θανάτῳ
  choice: dem Tod verfallen
  alternative: des Todes schuldig; den Tod verdient habend
  rationale: »Dem Tod verfallen« wahrt die gerichtliche Todeshaftung, legt aber weniger ausdrücklich als »den Tod verdient« fest, ob der Ausdruck primär moralisches Verdienst oder rechtliche Verurteilung bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der mit »Denn wenn« eröffnete Bedingungssatz bleibt wie im vorgelegten Versabschnitt syntaktisch offen und endet mit einem Komma, da seine Folgerung im anschließenden Vers folgt.
