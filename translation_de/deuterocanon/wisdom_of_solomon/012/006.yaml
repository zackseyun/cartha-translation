translation:
  language: de
  text: Auch Eltern, die wehrlose Menschen ermordeten,[a] wolltest du durch die Hände unserer Väter vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Eltern, Mörder wehrloser Seelen/Menschen«. Das griechische Wort für »Seelen« kann hier konkrete Menschen oder ihr Leben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐθέντας
  choice: die … ermordeten
  rationale: Das Wort bezeichnet hier Täter eines gewaltsamen Tötens und bezieht sich auf die Eltern. Die verbale Wiedergabe ist im heutigen Deutsch natürlicher als die appositionelle Formulierung »Mörder«.
- source_word: γονεῖς
  choice: Eltern
  rationale: Der griechische Plural bezeichnet Vater und Mutter gemeinsam; »Eltern« gibt dies knapp und inklusiv wieder.
- source_word: ψυχῶν
  choice: Menschen
  rationale: ψυχή bezeichnet hier im Zusammenhang mit gewaltsamer Tötung konkrete menschliche Opfer. »Menschen« vermeidet eine unangebrachte Festlegung auf eine vom Körper getrennte Seele.
- source_word: ἀβοηθήτων
  choice: wehrlose
  rationale: Das Adjektiv bezeichnet Menschen, denen Hilfe oder Schutz fehlt. »Wehrlos« ist prägnant und unterstreicht ihre Schutzlosigkeit.
- source_word: ἐβουλήθης
  choice: wolltest du
  rationale: Die Form bezeichnet einen bewussten Willensentschluss. »Wolltest« bewahrt diese Aussage in natürlichem, würdigem Deutsch.
- source_word: ἀπολέσαι
  choice: vernichten
  rationale: Das Verb meint hier, Menschen dem Untergang beziehungsweise Tod preiszugeben. »Vernichten« erhält die gerichtliche Schärfe und die Reichweite des griechischen Ausdrucks.
- source_word: διὰ χειρῶν πατέρων ἡμῶν
  choice: durch die Hände unserer Väter
  rationale: Die instrumentale Wendung wird bildhaft und quellennah wiedergegeben; »Väter« bezeichnet hier Israels Vorfahren als ausführende Akteure.
- source_word: καί
  choice: Auch
  rationale: Am Versanfang setzt καί die Reihe der zuvor genannten Vergehen beziehungsweise Täter fort und kann im Deutschen natürlich mit »Auch« wiedergegeben werden.
theological_decisions:
- issue: Bedeutung von ψυχῶν ἀβοηθήτων
  choice: wehrlose Menschen
  alternative: wehrlose Seelen; schutzloses Leben
  rationale: Im Zusammenhang mit Tötung und Kinderopfern sind konkrete schutzlose Opfer gemeint. Die Wiedergabe als »Menschen« wahrt diesen Bezug, ohne eine bestimmte Seelenlehre in den Text einzutragen.
- issue: Stärke von αὐθέντας
  choice: ermordeten
  alternative: töteten; Mörder waren
  rationale: Der Kontext legt schuldhaftes, gewaltsames Töten nahe. »Ermordeten« bringt die Täterrolle klar zum Ausdruck, ohne zusätzliche Einzelheiten einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau stellt die Tätergruppe voran und bewahrt die bildhafte Wendung »durch die Hände unserer Väter«. Die Fußnote hält die Mehrdeutigkeit von ψυχή zwischen »Seele«, »Mensch« und »Leben« offen.
