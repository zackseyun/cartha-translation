base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/012.yaml
  text: For who will say[b][a], “What have you done?” Or who will oppose your judgment? And who will bring a charge against you concerning the nations that you destroyed? Or who will come before you as an avenger against unrighteous men?
translation:
  language: de
  text: 'Denn wer wird sagen: »Was hast du getan?« Oder wer wird deinem Urteil widerstehen? Wer aber wird dich wegen untergegangener Völker anklagen, die du geschaffen hast?[a] Oder wer wird dir als Rächer gegen ungerechte Menschen entgegentreten?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich liegt nahe: »untergegangener Völker, die du gemacht/geschaffen hast«. Im Zusammenhang kann die letzte Wendung auch bedeuten: »die du zugrunde gerichtet hast« oder »deren Untergang du bewirkt hast«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Wendung ist ungewöhnlich. Möglich ist auch: »wer wird gegen dich auftreten als Rächer gegen ungerechte Menschen?« Sie kann ein ausdrücklich gegnerisches oder rechtliches Auftreten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐρεῖ
  choice: Denn wer wird sagen
  rationale: Bewahrt γάρ als begründende Verknüpfung und die rhetorische Frage im Futur.
- source_word: Τί ἐποίησας
  choice: Was hast du getan?
  rationale: Gibt die direkte, anklagend klingende Frage wieder, ohne ein im Griechischen nicht vorhandenes »Warum« hinzuzufügen.
- source_word: ἀντιστήσεται τῷ κρίματί σου
  choice: wird deinem Urteil widerstehen
  rationale: »Widerstehen« erhält das Bild aktiven Widerspruchs; »Urteil« deckt den gerichtlichen Sinn von κρίμα ab.
- source_word: ἐγκαλέσει σοι
  choice: wird dich … anklagen
  rationale: Das Verb hat hier einen klaren forensischen Sinn; die deutsche Formulierung ist knapp und natürlich.
- source_word: κατὰ ἐθνῶν ἀπολωλότων
  choice: wegen untergegangener Völker
  rationale: Gibt das Perfektpartizip als eingetretenen Untergang wieder, ohne bereits festzulegen, wie ἐποίησας in der anschließenden Relativkonstruktion zu verstehen ist.
- source_word: ἃ σὺ ἐποίησας
  choice: die du geschaffen hast
  rationale: Bewahrt den naheliegenden Grundsinn von ποιέω und damit die Spannung zwischen Gottes Schöpfung der Völker und ihrem Untergang; die kontextuelle Deutung »die du zugrunde gerichtet hast« wird in der Fußnote genannt.
- source_word: εἰς κατάστασίν σοι ἐλεύσεται
  choice: wird dir … entgegentreten
  rationale: Die seltene und schwierige Wendung bezeichnet hier wahrscheinlich ein Hervortreten in gegnerischer oder rechtlicher Stellung; »entgegentreten« wahrt diesen Sinn ohne übermäßige Präzisierung.
- source_word: ἔκδικος κατὰ ἀδίκων ἀνθρώπων
  choice: als Rächer gegen ungerechte Menschen
  rationale: Erhält sowohl die persönliche Gerichtsrolle von ἔκδικος als auch die durch κατά bezeichnete Ausrichtung gegen die Ungerechten.
theological_decisions:
- issue: Gottes gerichtliches Handeln und seine Anfechtbarkeit
  choice: Die Folge rhetorischer Fragen stellt Gottes Urteil als durch keinen Ankläger oder Gegner erfolgreich anfechtbar dar.
  alternative: Die Fragen könnten lediglich die praktische Machtlosigkeit möglicher Gegner betonen.
  rationale: Die wiederholten τίς-Fragen und die gerichtliche Wortwahl tragen eine starke Aussage über Gottes unangefochtenes Urteilen, ohne eine zusätzliche systematische Lehre ausdrücklich zu formulieren.
- issue: Beziehung Gottes zum Untergang der Völker
  choice: Der Haupttext nennt die Völker »untergegangen« und von Gott »geschaffen«.
  alternative: »die du zugrunde gerichtet hast«
  rationale: Die griechische Formulierung verbindet ἀπολωλότων mit ἃ σὺ ἐποίησας auf spannungsreiche und semantisch nicht völlig eindeutige Weise. Der Haupttext bewahrt den gewöhnlichen Sinn von ποιέω, während die kontextuell-kausative Deutung in der Fußnote offengelegt wird.
- issue: ἀδίκων ἀνθρώπων als generische Personenbezeichnung
  choice: ungerechte Menschen
  alternative: ungerechte Männer
  rationale: ἄνθρωποι bezeichnet hier moralisch schuldige Personen allgemein; der Kontext liefert keinen sicheren Hinweis auf ausschließlich männliche Referenten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische und forensische Prägung des Verses bleibt erhalten; seltene griechische Wendungen werden lesbar wiedergegeben, ohne ihre Mehrdeutigkeit zu verdecken.
