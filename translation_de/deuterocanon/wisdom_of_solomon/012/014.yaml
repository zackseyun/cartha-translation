  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/014.yaml
  text: Neither king nor tyrant will be able to look you in the face concerning those whom you punished[a].
translation:
  language: de
  text: Weder ein König noch ein Tyrann wird dir wegen derer, die du bestraft hast, ins Angesicht treten können.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dir entgegentreten“ oder „deinem Blick standhalten“; das griechische Verb bezeichnet bildhaft eine unmittelbare Begegnung von Angesicht zu Angesicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε … ἢ
  choice: weder … noch
  rationale: Die korrelative Verneinung wird im Deutschen natürlich mit „weder … noch“ wiedergegeben.
- source_word: βασιλεὺς
  choice: König
  rationale: Bewahrt den gewöhnlichen politischen Titel und den Gegensatz zum folgenden Gewaltherrscher.
- source_word: τύραννος
  choice: Gewaltherrscher
  rationale: Gibt einen mächtigen, autokratisch herrschenden Machthaber wieder, ohne das Wort auf die moderne umgangssprachliche Verwendung von „Tyrann“ zu verengen.
- source_word: ἀντοφθαλμῆσαι
  choice: ins Angesicht treten
  rationale: Die seltene, bildhafte Wendung bezeichnet die unmittelbare Begegnung von Angesicht zu Angesicht und deutet zugleich ein konfrontatives Gegenübertreten an.
- source_word: δυνήσεταί
  choice: wird … können
  rationale: Gibt die zukünftige Fähigkeit beziehungsweise Möglichkeit des griechischen Futurs direkt wieder.
- source_word: σοι
  choice: dir
  rationale: Der Dativ bezeichnet die Person, der man unmittelbar gegenübertritt.
- source_word: περὶ ὧν
  choice: wegen derer
  rationale: Die knappe deutsche Form wahrt den Bezug auf die Bestraften und bringt den Anlass der möglichen Konfrontation zum Ausdruck, ohne daraus ausdrücklich eine gerichtliche Anklage zu machen.
- source_word: ἐκόλασας
  choice: die du bestraft hast
  rationale: Im Zusammenhang bezeichnet das Verb strafendes Gericht und nicht lediglich erzieherische Zucht.
theological_decisions:
- issue: Bedeutung des Bildes einer unmittelbaren Begegnung mit Gott
  choice: Kein irdischer Herrscher kann Gott wegen seines Strafhandelns von Angesicht zu Angesicht entgegentreten.
  alternative: Kein Herrscher kann Gott zur Rechenschaft ziehen oder seinem Urteil widerstehen.
  rationale: Das griechische Verb zeichnet eine direkte Konfrontation, formuliert aber nicht ausdrücklich eine gerichtliche Rechenschaftsforderung. Die Übersetzung bewahrt deshalb das Bild und lässt dessen rechtliche beziehungsweise widerständige Implikation offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gewaltherrscher“ unterscheidet τύραννος klar von „König“. Die Wortstellung stellt den Anlass der Konfrontation heraus, ohne die Aussage über das griechische Bild hinaus zu einer förmlichen Anklage gegen Gott auszubauen.
