base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/003.yaml
  text: But the many offspring of the ungodly will be of no use[a], and from bastard shoots they will not give a root into depth[b], nor will they set a firm foundation.
translation:
  language: de
  text: Doch die zahlreiche Nachkommenschaft der Gottlosen wird zu nichts nütze sein; aus unehelichen Schösslingen wird sie keine Wurzel tief hinab treiben[a] und keine feste Grundlage gewinnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus unechten Trieben“. Das griechische Wort kann „unehelich“ oder, im übertragenen Pflanzenbild, „unecht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολύγονον ... πλῆθος
  choice: die zahlreiche Nachkommenschaft
  rationale: Die Formulierung gibt die kollektive Menge zahlreicher Nachkommen wieder und wahrt mit dem Singular den grammatischen Anschluss der griechischen Verben.
- source_word: ἀσεβῶν
  choice: der Gottlosen
  rationale: „Gottlos“ bewahrt die ausdrücklich religiös-moralische Dimension von ἀσεβής besser als das allgemeinere „böse“.
- source_word: οὐ χρησιμεύσει
  choice: wird zu nichts nütze sein
  rationale: Die Wendung gibt die zukünftige Nutz- beziehungsweise Wirkungslosigkeit idiomatisch und zugleich würdig wieder.
- source_word: ἐκ νόθων μοσχευμάτων
  choice: aus unehelichen Schösslingen
  rationale: „Unehelich“ erhält die scharfe soziale Wertung von νόθος, während „Schösslinge“ das Pflanzenbild von μοσχεύματα bewahrt. Eine Fußnote nennt die sachlich ebenfalls mögliche Bedeutung „unecht“.
- source_word: οὐ δώσει ῥίζαν εἰς βάθος
  choice: wird sie keine Wurzel in die Tiefe treiben
  rationale: Die Formulierung bleibt eng beim ungewöhnlichen Bild des Griechischen, klingt im Deutschen jedoch natürlich und verständlich.
- source_word: οὐδὲ ἀσφαλῆ βάσιν ἐδράσει
  choice: und auch keinen festen Grund legen
  rationale: „Fester Grund“ gibt ἀσφαλὴς βάσις wieder; „Grund legen“ bewahrt den Gedanken dauerhafter Stabilität und die aktive Verbform.
theological_decisions:
- issue: Religiös-moralische Kennzeichnung durch ἀσεβῶν
  choice: der Gottlosen
  alternative: der Frevler / der Bösen
  rationale: Die gewählte Fassung erhält den Gottesbezug des Ausdrucks, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Schärfe und Mehrdeutigkeit von νόθων im Pflanzenbild
  choice: uneheliche Schösslinge
  alternative: unechte Schösslinge / Bastardschösslinge
  rationale: „Unehelich“ wahrt die anstößige, sozial belastete Bedeutung des griechischen Adjektivs, vermeidet aber die im heutigen Deutschen unnötig beschimpfend wirkende und botanisch missverständliche Zusammensetzung „Bastardschösslinge“. Die Fußnote lässt die metaphorische Alternative „unecht“ ausdrücklich offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kollektive Singular „Nachkommenschaft“ und das anschließende „sie“ folgen der griechischen Syntax. Das harte Bild wird nicht geglättet; seine lexikalische Spannung wird in der Fußnote offengelegt.
