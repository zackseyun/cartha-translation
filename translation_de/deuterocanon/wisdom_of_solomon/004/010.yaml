translation:
  language: de
  text: Da er Gott wohlgefällig geworden war, wurde er geliebt; und als er unter Sündern lebte, wurde er hinweggenommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde er versetzt“ oder „wurde er entrückt“. Das Griechische lässt offen, ob der frühe Tod, die göttliche Entfernung aus einer verderbten Umgebung oder eine an Henoch erinnernde Entrückung im Vordergrund steht.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐάρεστος
  choice: wohlgefällig
  rationale: Das Adjektiv bezeichnet jemanden, der einem anderen gefällt. „Gott wohlgefällig“ ist im Deutschen würdevoll und präzise und bewahrt den relationalen Sinn des Dativs τῷ θεῷ.
- source_word: γενόμενος
  choice: geworden war
  rationale: 'Der Aoristpartizip wird als dem Hauptverb zeitlich vorausgehend wiedergegeben: Er war Gott wohlgefällig geworden und wurde geliebt.'
- source_word: ἠγαπήθη
  choice: wurde er geliebt
  rationale: Die Passivform wird direkt wiedergegeben. Gott als Handelnder liegt durch den ersten Satzteil nahe, wird aber nicht ausdrücklich ergänzt, da er im Griechischen beim Verb nicht genannt ist.
- source_word: ζῶν
  choice: noch während er … lebte
  rationale: Das Präsenspartizip bezeichnet einen gleichzeitig andauernden Zustand. „Noch während“ macht deutlich, dass die Wegnahme ihn zu Lebzeiten beziehungsweise mitten aus seinem Leben unter Sündern traf, ohne ihre genaue Art festzulegen.
- source_word: μεταξὺ ἁμαρτωλῶν
  choice: unter Sündern
  rationale: Die Formulierung gibt die soziale und moralische Umgebung knapp und natürlich wieder und bewahrt die substantivische Bezeichnung „Sünder“.
- source_word: μετετέθη
  choice: wurde er hinweggenommen
  rationale: Das Verb kann ein Versetzen, Entfernen oder Entrücken bezeichnen. „Hinweggenommen“ ist idiomatisch und lässt offen, ob gewöhnlicher beziehungsweise früher Tod, göttliche Entfernung aus einer verderbten Umgebung oder eine an Henoch erinnernde Entrückung im Vordergrund steht.
theological_decisions:
- issue: Bedeutung von μετετέθη im Blick auf Tod oder göttliche Entrückung
  choice: wurde er hinweggenommen
  alternative: wurde er versetzt; wurde er entrückt
  rationale: Der griechische Ausdruck bezeichnet eine Verlagerung oder Wegnahme und kann im biblischen Sprachgebrauch an Henochs Entrückung erinnern. Der Zusammenhang spricht zugleich vom frühen Tod des Gerechten und von seiner Entfernung aus sündiger Umgebung. Die Übersetzung legt sich daher nicht auf nur eine dieser Deutungen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, ohne unnötig altertümlich zu wirken. Das Semikolon bewahrt die Zweiteilung des Verses; die Fußnotenmarkierung steht unmittelbar bei dem mehrdeutigen Ausdruck.
