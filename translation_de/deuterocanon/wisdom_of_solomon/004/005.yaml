base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/005.yaml
  text: Unfinished branches will be broken off[a], and their fruit is useless, unripe for eating and fit for nothing[b];
translation:
  language: de
  text: Unvollendete Zweige werden abgebrochen[a], und ihre Frucht wird unbrauchbar sein, unreif zum Essen[b] und zu nichts geeignet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unreife Zweige“; das griechische Adjektiv bezeichnet etwas, das nicht zur Vollendung gelangt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Essen noch zu früh“. Bei einer Frucht gibt „unreif“ das Bild am natürlichsten wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περικλασθήσονται
  choice: werden abgebrochen werden
  rationale: Das Futur Passiv bezeichnet ein künftiges Ergehen der Zweige. Die Formulierung bewahrt sowohl Zukunfts- als auch Passivbedeutung.
- source_word: κλῶνες
  choice: Zweige
  rationale: Die übliche botanische Bedeutung erhält das landwirtschaftliche Bild in verständlichem Deutsch.
- source_word: ἀτέλεστοι
  choice: unvollendet
  rationale: Das Adjektiv bezeichnet etwas, das nicht zur Vollendung gelangt ist. „Unvollendet“ erhält diese Grundbedeutung; im Bild kann zugleich mangelnde Reife gemeint sein.
- source_word: καρπός
  choice: Frucht
  rationale: Die wörtliche botanische Bildsprache wird beibehalten.
- source_word: ἄχρηστος
  choice: unbrauchbar
  rationale: Das Wort bezeichnet etwas, das keinen Nutzen hat oder nicht verwendbar ist; „unbrauchbar“ passt unmittelbar zur Frucht.
- source_word: ἄωρος
  choice: unreif
  rationale: Im Zusammenhang mit Frucht und Essen ist „unreif“ die natürliche konkrete Bedeutung; der weitere Sinn „vorzeitig“ bleibt in einer Fußnote sichtbar.
- source_word: εἰς βρῶσιν
  choice: zum Essen
  rationale: Die Wendung bezeichnet die Eignung zum Verzehr und wird knapp und idiomatisch wiedergegeben.
- source_word: ἐπιτήδειος
  choice: geeignet
  rationale: εἰς οὐδὲν ἐπιτήδειος bedeutet „zu nichts geeignet“ und bewahrt die absolute Verneinung.
theological_decisions:
- issue: Metaphorische Bedeutung der landwirtschaftlichen Bildsprache im Kontext
  choice: Zweige und Frucht bleiben als wörtliche Bildelemente stehen.
  alternative: Die Metapher ausdrücklich als Nachkommen oder Nachkommenschaft wiedergeben.
  rationale: Obwohl der Kontext das Bild auf die Nachkommen der Gottlosen bezieht, formuliert dieser Vers selbst in landwirtschaftlichen Bildern. Die Übersetzung lässt den Kontext die Deutung leisten und trägt sie nicht erklärend in den Vers ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die landwirtschaftliche Metapher und der Wechsel vom griechischen Futur („werden abgebrochen werden“) zum Präsens („ist“) bleiben erhalten. Die ungewöhnlichere Doppelung von „werden“ ist hier bewusst gewählt, um das Futur Passiv nicht einzuebnen.
