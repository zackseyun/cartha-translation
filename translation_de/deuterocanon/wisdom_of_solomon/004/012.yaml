  text: For the bewitchment of wickedness darkens what is good[b][a], and the wandering of desire corrupts an innocent mind.
translation:
  language: de
  text: Denn der Bann der Bosheit[a] verdunkelt das Gute[b], und das Umherschweifen der Begierde verkehrt einen arglosen Sinn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Neid der Bosheit«, »der böse Blick der Bosheit« oder »der Zauber der Bosheit«; das griechische Wort kann böswilligen Neid, den bösen Blick oder einen daraus wirkenden unheilvollen Einfluss bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das Schöne« oder »das Edle«; der griechische Ausdruck kann moralische wie ästhetische Güte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασκανία
  choice: Bann
  rationale: Das Wort bezeichnet einen unheilvollen Einfluss, der mit Neid oder dem bösen Blick verbunden sein kann. »Bann« bewahrt die bildhafte Kraft, ohne ausdrücklich eine magische Handlung zu behaupten.
- source_word: φαυλότητος
  choice: Bosheit
  rationale: Der Genitiv kennzeichnet den Bann als Wirkung moralischer Verderbtheit. »Bosheit« ist im heutigen Deutsch klar und ethisch bestimmt.
- source_word: ἀμαυροῖ
  choice: verdunkelt
  rationale: Das Verb bezeichnet ein Trüben, Verdunkeln oder Unkenntlichmachen und erhält hier das Bild beeinträchtigter moralischer Wahrnehmung.
- source_word: τὰ καλά
  choice: das Gute
  rationale: Der Ausdruck kann das Gute, Schöne oder Edle meinen. Im Zusammenhang mit Bosheit und verdorbenem Denken steht die umfassende moralische Bedeutung im Vordergrund.
- source_word: ῥεμβασμός
  choice: unstetes Schweifen
  rationale: Das Substantiv beschreibt ein zielloses Umherschweifen oder eine innere Unstetigkeit. Die Wiedergabe erhält sowohl Bewegung als auch Ablenkung.
- source_word: ἐπιθυμίας
  choice: Begierde
  rationale: ἐπιθυμία bezeichnet Begehren oder Verlangen und ist nicht notwendig auf Sexualität beschränkt. »Begierde« bringt hier die schädliche Intensität zum Ausdruck, ohne den Sinn unnötig einzuengen.
- source_word: μεταλλεύει
  choice: verdirbt
  rationale: Das seltene Verb bezeichnet hier eine Veränderung zum Schlechteren. »Verdirbt« macht die negative Wirkung deutlich, die der Zusammenhang verlangt.
- source_word: νοῦν
  choice: Verstand
  rationale: νοῦς bezeichnet das Vermögen des Erkennens, Urteilens und moralischen Wahrnehmens. »Verstand« ist eine klare, natürliche Entsprechung.
- source_word: ἄκακον
  choice: arglos
  rationale: Das Adjektiv bedeutet frei von Bosheit, Tücke oder schädlicher Absicht. »Arglos« bewahrt diese Nuance genauer als das weiter gefasste »unschuldig«.
theological_decisions:
- issue: Moralisch-ästhetische Bedeutungsbreite von τὰ καλά
  choice: Im Haupttext steht »das Gute«.
  alternative: »das Schöne« oder »das Edle«
  rationale: Der Zusammenhang betont moralische Verderbnis und getrübte Wahrnehmung. »Das Gute« gibt diesen Schwerpunkt wieder, während die Fußnote die ästhetische und wertende Bedeutungsbreite offenhält.
- issue: Bedeutung von βασκανία
  choice: Im Haupttext steht »Bann«, verstanden als unheilvoller Einfluss der Bosheit.
  alternative: »Neid«, »böser Blick« oder »Verhexung«
  rationale: Die griechische Bezeichnung kann malignen Neid, den bösen Blick oder dessen schädliche Wirkung meinen. »Bann« wahrt die personifizierte, bildhafte Kraft, ohne eine einzelne Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Bann« und »unstetes Schweifen« erhalten die eindringlichen Bilder des griechischen Textes; die Fußnoten bewahren dessen wesentliche lexikalische Mehrdeutigkeit.
