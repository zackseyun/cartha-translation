base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/006.yaml
  text: For children born from lawless unions are witnesses of their parents’ wickedness at their examination[a][b][c].
translation:
  language: de
  text: Denn Kinder, die aus gesetzwidrigen Verbindungen geboren werden, sind bei ihrer Untersuchung Zeugen gegen ihre Eltern wegen deren Bosheit.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus gesetzwidrigen Betten“; dies ist eine griechische Umschreibung für unerlaubte sexuelle Verbindungen.'
    reason: lexical_alternative
  - marker: b
    text: „Bei ihrer Untersuchung“ kann auch allgemeiner „bei genauer Prüfung“ bedeuten. Das Pronomen kann sich statt auf die Kinder auch auf die Eltern beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμων ὕπνων
  choice: gesetzeswidrigen Verbindungen
  rationale: Wörtlich bezeichnet die Wendung „gesetzeswidrige Betten“; gemeint sind in euphemistischer Sprache unerlaubte sexuelle Verbindungen. Die gewählte Formulierung bewahrt das moralisch-rechtliche Urteil und klingt zugleich natürlich.
- source_word: τέκνα γεννώμενα
  choice: Kinder, die … geboren werden
  rationale: Die Formulierung gibt das substantivische Partizip klar und gegenwartsnah wieder und wahrt dessen passiven Sinn.
- source_word: μάρτυρές εἰσιν
  choice: sind … Zeugen
  rationale: Die nominale Konstruktion und ihr forensischer Klang werden direkt bewahrt.
- source_word: πονηρίας
  choice: Bosheit
  rationale: „Bosheit“ bezeichnet hier das moralisch Verwerfliche mit dem nötigen Gewicht, ohne die Aussage unnötig zu verschärfen.
- source_word: κατὰ γονέων
  choice: für die Bosheit ihrer Eltern
  rationale: κατά mit dem Genitiv hat einen gegen die Eltern gerichteten, forensischen Sinn. Im Deutschen macht „Zeugen für die Bosheit ihrer Eltern“ deutlich, dass ihr Zeugnis die Eltern belastet.
- source_word: ἐν ἐξετασμῷ αὐτῶν
  choice: bei ihrer Untersuchung
  rationale: Die nominale Wendung gibt ἐξετασμός als Untersuchung oder Prüfung wieder und lässt die mögliche Bezugnahme des Pronomens zunächst ähnlich offen wie das Griechische.
theological_decisions:
- issue: Moralische Aussage von ἀνόμων ὕπνων
  choice: gesetzeswidrige Verbindungen
  alternative: unerlaubte Betten; verwerflicher Geschlechtsverkehr
  rationale: Die Übersetzung wahrt sowohl das moralisch-rechtliche Urteil als auch den verhüllenden Ton des griechischen Ausdrucks, ohne eine bestimmte konfessionelle Sexualethik zusätzlich einzutragen.
- issue: Bezugswort von αὐτῶν in ἐν ἐξετασμῷ αὐτῶν
  choice: Die Formulierung „bei ihrer Untersuchung“ bleibt im Haupttext formal mehrdeutig; nach dem nächstliegenden grammatischen Bezug sind die Kinder gemeint.
  alternative: Die Eltern werden untersucht; oder die Aussage meint allgemein eine Prüfung beziehungsweise genaue Betrachtung.
  rationale: Der unmittelbare Bezug sind die Kinder, doch das Pronomen kann auch anders verstanden werden. Die Fußnote bewahrt diese echte Unbestimmtheit, statt sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen forensischen Bild, während „gesetzeswidrige Verbindungen“ den Euphemismus verständlich wiedergibt. Alle im Haupttext gesetzten Fußnoten erläutern lexikalische oder syntaktische Mehrdeutigkeiten.
