base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/016.yaml
  text: But the righteous one[a], though dead, will condemn the living ungodly[b]; and youth brought to completion quickly will condemn the many-year old age of the unrighteous.
translation:
  language: de
  text: Doch der verstorbene Gerechte[a] wird die lebenden Gottlosen verurteilen; und eine Jugend, die rasch vollendet wurde,[b] wird das hohe Alter eines Ungerechten verurteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »der Gerechte, nachdem er gestorben ist«; möglich ist ebenso: »der Gerechte, obwohl er gestorben ist«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine rasch vollendete Jugend«. Das griechische Wort kann auch mit »vollkommen gemacht« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινεῖ
  choice: wird … verurteilen
  rationale: Das Futur von κατακρίνω bezeichnet ein verurteilendes Urteil. Im zweiten Satzglied ist das Verb aus dem ersten zu ergänzen.
- source_word: δίκαιος καμών
  choice: der Gerechte, der gestorben ist
  rationale: δίκαιος ist substantivisch und singularisch. καμών bezeichnet im Kontext den bereits eingetretenen Tod des früh verstorbenen Gerechten; ein Relativsatz ist im Deutschen natürlich und lässt die genaue adverbiale Beziehung offen.
- source_word: τοὺς ζῶντας ἀσεβεῖς
  choice: die lebenden Gottlosen
  rationale: Die Formulierung bewahrt den Gegensatz zwischen dem verstorbenen Gerechten und den noch lebenden Gottlosen.
- source_word: νεότης τελεσθεῖσα ταχέως
  choice: eine Jugend, die rasch zur Vollendung gelangt ist
  rationale: νεότης bezeichnet Jugend beziehungsweise junges Lebensalter. Die Formulierung gibt den Vollendungsgedanken von τελεσθεῖσα wieder, ohne ihn auf sittliche Fehlerlosigkeit festzulegen.
- source_word: πολυετὲς γῆρας ἀδίκου
  choice: das hohe Alter eines Ungerechten
  rationale: πολυετές bedeutet wörtlich »viele Jahre umfassend«; bei γῆρας entspricht »hohes Alter« natürlichem Deutsch. Der Genitiv ἀδίκου bezeichnet den Ungerechten, dem dieses Alter zukommt.
theological_decisions:
- issue: Bedeutung und syntaktische Kraft von καμών
  choice: der gestorben ist
  alternative: obwohl er gestorben ist; nachdem er gestorben ist
  rationale: Der Kontext handelt vom frühen Tod des Gerechten. Die gewählte Relativkonstruktion gibt diesen Sachverhalt wieder, ohne die im Partizip nicht ausdrücklich markierte konzessive oder temporale Beziehung festzuschreiben.
- issue: Wiedergabe der Vollendungssprache in τελεσθεῖσα
  choice: zur Vollendung gelangt ist
  alternative: vollendet worden ist; vollkommen gemacht worden ist
  rationale: »Zur Vollendung gelangt« erhält den teleologischen Sinn, vermeidet aber die mögliche Überdeutung als moralische Fehlerlosigkeit.
- issue: Elliptisches κατακρινεῖ im zweiten Satzglied
  choice: wird … verurteilen
  alternative: steht gegen … als Urteil da
  rationale: Das Verb ist im zweiten Satzglied sinngemäß aus dem ersten zu ergänzen. Die Wiederholung im Deutschen macht die parallele Aussage klar, ohne einen neuen Gedanken einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Gegenüberstellung von frühem Tod und langem Leben bleibt erhalten; abstrakte Ausdrücke wie »Jugend« und »Alter« werden entsprechend dem griechischen Text personifizierend als verurteilende Zeugen dargestellt.
