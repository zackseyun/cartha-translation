base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/020.yaml
  text: They will come in fear[a], reasoning over their sins[b], and their lawless deeds will convict them to their face.
translation:
  language: de
  text: Sie werden voller Angst[a] kommen und über ihre Sünden nachdenken; ihre gesetzlosen Taten werden ihnen entgegentreten und sie überführen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ängstlich“, „zaghaft“ oder „wie Feiglinge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „von gegenüber“. Gemeint ist, dass ihre eigenen gesetzlosen Taten sie unmittelbar konfrontieren und ihre Schuld offenlegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται
  choice: sie werden kommen
  rationale: Das Futur von ἔρχομαι wird mit dem schlichten und im Gerichtskontext natürlichen Bewegungsverb „kommen“ wiedergegeben.
- source_word: ἐν συλλογισμῷ ἁμαρτημάτων αὐτῶν
  choice: und über ihre Sünden nachdenken
  rationale: συλλογισμός bezeichnet Überlegung oder inneres Abwägen. Die verbale deutsche Formulierung gibt den gedanklichen Vorgang natürlich wieder, ohne Reue als zusätzliche Bedeutung einzutragen.
- source_word: δειλοί
  choice: voller Angst
  rationale: Das prädikativ gebrauchte Adjektiv beschreibt die von Furcht und Zaghaftigkeit geprägte Verfassung der Kommenden. „Voller Angst“ ist im heutigen Deutsch natürlicher als „feige“, dessen moralisch abwertender Beiklang hier zu eng wäre.
- source_word: ἐλέγξει
  choice: wird … überführen
  rationale: ἐλέγχω bezeichnet hier das Offenlegen und Erweisen von Schuld. „Überführen“ bewahrt den gerichtlichen und moralischen Sinn.
- source_word: ἐξ ἐναντίας
  choice: werden ihnen entgegentreten
  rationale: Die Wendung bezeichnet ein unmittelbares Gegenüber oder konfrontatives Entgegentreten. Die deutsche Formulierung erhält dieses anschauliche Bild.
- source_word: τὰ ἀνομήματα αὐτῶν
  choice: ihre gesetzlosen Taten
  rationale: ἀνόμημα bezeichnet eine Tat, die Gesetz oder Ordnung verletzt. „Gesetzlose Taten“ unterscheidet den Ausdruck bewusst von ἁμαρτήματα („Sünden“).
theological_decisions:
- issue: Verhältnis von ἁμαρτήματα und ἀνομήματα
  choice: Die beiden Ausdrücke werden als „Sünden“ und „gesetzlose Taten“ unterschieden.
  alternative: Beide Ausdrücke einheitlich mit „Sünden“ wiederzugeben.
  rationale: Der griechische Text verwendet zwei verwandte, aber nicht identische Begriffe. Ihre Unterscheidung bewahrt die Bewegung vom inneren Nachdenken über die Sünden zur offenen Überführung durch die eigenen gesetzlosen Taten.
- issue: Art der Überführung
  choice: Die eigenen Taten treten den Menschen entgegen und überführen sie.
  alternative: Eine ausdrücklich göttliche oder personifizierte Anklageinstanz ergänzen.
  rationale: Der Text nennt die gesetzlosen Taten selbst als grammatisches Subjekt. Diese zugespitzte Aussage bleibt erhalten, ohne eine nicht genannte Instanz einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt gut verständlich, bewahrt aber die bildhafte Personifizierung der Taten und die Unterscheidung der beiden griechischen Begriffe für moralisches Fehlverhalten.
