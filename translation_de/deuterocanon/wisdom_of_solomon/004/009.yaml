  text: For gray hair is understanding for men, and an unblemished life is the age of old age.
translation:
  language: de
  text: Einsicht gilt den Menschen als graues Haar und ein makelloses Leben als Greisenalter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιὰ
  choice: graues Haar
  rationale: Gibt das Bild des ergrauten Haupthaars natürlich und nah am griechischen Singular wieder.
- source_word: φρόνησις
  choice: Einsicht
  rationale: Bezeichnet verständige Urteilskraft und praktische Klugheit; „Einsicht“ ist hier prägnant und allgemein verständlich.
- source_word: ἀνθρώποις
  choice: den Menschen
  rationale: Das griechische Wort ist allgemein auf Menschen bezogen und nicht auf Männer beschränkt.
- source_word: ἡλικία γήρως
  choice: Greisenalter
  rationale: Bewahrt die ausdrückliche Vorstellung hohen Alters, ohne sie abstrakt als bloße Reife umzudeuten.
- source_word: βίος ἀκηλίδωτος
  choice: ein makelloses Leben
  rationale: Entspricht der ethisch geprägten Wendung für eine Lebensführung ohne befleckenden Makel.
theological_decisions:
- issue: Umkehrung der üblichen Merkmale von Alter und Würde
  choice: 'Die beiden Prädikatsbilder bleiben erhalten: Einsicht gilt als graues Haar, ein makelloses Leben als Greisenalter.'
  alternative: „Graues Haar bedeutet Einsicht, und hohes Alter bedeutet ein makelloses Leben.“
  rationale: Die gewählte Fassung bewahrt die Aussage, dass nicht die Zahl der Jahre, sondern Einsicht und ein untadeliges Leben wahres Alter beziehungsweise dessen Würde ausmachen, ohne den Gedanken ausdrücklich auszudeuten.
translation_notes:
  register: Dignifizieller, knapper Weisheitsspruch in modernem Standarddeutsch. Die parallele Konstruktion „als … gilt“ / elliptisch „als …“ erhält die poetische Verdichtung des Griechischen.
