lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Das Temporaladverb kennzeichnet die Folge des zuvor geschilderten Gerichtsgeschehens; „Dann“ ist natürlich und präzise.
- source_word: στήσεται
  choice: wird … stehen
  rationale: 'Die mediale Futurform von ἵστημι ist hier intransitiv: Der Gerechte tritt hervor und steht da. „Wird stehen“ wahrt diese Bildlichkeit, ohne das Medium als Passiv zu überdeuten.'
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: mit großer Zuversicht
  rationale: παρρησία bezeichnet hier furchtlose Offenheit und selbstbewusstes Auftreten. „Mit großer Zuversicht“ passt zum Zusammenhang der öffentlichen Rechtfertigung und vermeidet den möglichen Beiklang von Leichtsinn bei „Kühnheit“.
- source_word: ὁ δίκαιος
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und bezeichnet die im Kontext dargestellte exemplarische gerechte Person. Die geläufige deutsche Form bewahrt sowohl Genus als auch repräsentative Funktion.
- source_word: κατὰ πρόσωπον
  choice: vor
  rationale: Die Wendung bedeutet wörtlich „vor dem Angesicht“ und bezeichnet unmittelbare Gegenwart beziehungsweise direkte Konfrontation. Im Haupttext gibt „vor“ dies in natürlichem Deutsch wieder; die Bildhaftigkeit wird in der Fußnote erläutert.
- source_word: τῶν θλιψάντων αὐτὸν
  choice: denen …, die ihn bedrängt haben
  rationale: θλίβω umfasst Bedrängung, Bedrückung und das Zufügen von Leid. „Bedrängt“ lässt die genaue Form der feindseligen Behandlung offen und entspricht dem Kontext.
theological_decisions:
- issue: Repräsentativer maskuliner Singular in ὁ δίκαιος
  choice: der Gerechte
  alternative: der gerechte Mensch
  rationale: Der griechische Text verwendet den grammatisch maskulinen Singular für die exemplarische gerechte Person. „Der Gerechte“ bewahrt diese Form, ohne auszuschließen, dass die Gestalt repräsentative Bedeutung hat.
- issue: Art des Auftretens bei der Rechtfertigung
  choice: mit großer Zuversicht
  alternative: mit großer Kühnheit
  rationale: παρρησία kann Freimut, Offenheit, Zuversicht oder Kühnheit bezeichnen. Die Übersetzung hält die furchtlose öffentliche Gewissheit fest, ohne eine besondere dogmatische Deutung der Gerichtsszene einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am Griechischen, während „vor“ statt des schwerfälligen „vor dem Angesicht“ im Haupttext natürlich klingt. Die Fußnote bewahrt die Bildhaftigkeit und den Gedanken direkter Konfrontation.
