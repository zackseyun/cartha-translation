  revision_rationale: Die Revision glättet die im Deutschen ungewohnte direkte Verbindung von „erfüllen“ mit „langen Jahren“, ohne den knappen, paradoxen Charakter des Verses oder die passive Offenheit von τελειωθείς aufzugeben. Die Fußnote wird entsprechend quellennäher formuliert.
