translation:
  language: de
  text: In kurzer Zeit vollendet, erfüllte er die Jahre eines langen Lebens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In kurzer Zeit zur Vollendung gebracht, vollendete er die Jahre eines langen Lebens.“'
    reason: Lexikalische Alternative zu „vollendet“ und „erfüllte“; sie wahrt den passiven Charakter von τελειωθείς und die auf eine lange Lebensspanne bezogene Bedeutung von χρόνους μακρούς.
lexical_decisions:
- source_word: τελειωθεὶς
  choice: vollendet
  rationale: Das Partizip bewahrt den passiven Gedanken des Zur-Vollendung-Gebrachtwerdens. Im Zusammenhang bezeichnet es erlangte Reife oder Ganzheit, ohne notwendig absolute sittliche Vollkommenheit zu behaupten.
- source_word: ἐν ὀλίγῳ
  choice: in kurzer Zeit
  rationale: Die Wendung bezeichnet hier eine kurze Zeitspanne und bildet den Gegensatz zu den langen Jahren.
- source_word: ἐπλήρωσεν
  choice: erfüllte
  rationale: 'Die Wiedergabe hält am Bild des Ausfüllens beziehungsweise Vollendens fest: Das kurze Leben erreicht, was sonst mit einer langen Lebenszeit verbunden wird.'
- source_word: χρόνους μακρούς
  choice: lange Jahre
  rationale: Wörtlich sind es „lange Zeiten“; im Zusammenhang ist eine lange Lebensdauer gemeint. „Lange Jahre“ bewahrt den prägnanten Gegensatz zur kurzen Zeit.
theological_decisions:
- issue: Vollendungsrede angesichts des frühen Todes des Gerechten
  choice: Die Aussage lässt offen, ob vor allem Reife, Ganzheit oder ein von Gott bewirktes Vollendetwerden gemeint ist.
  alternative: „zur Reife gelangt“ würde den Ausdruck ausschließlich als persönliche oder geistliche Reifung deuten.
  rationale: Der griechische Passiv lässt eine stärkere Vollendungsaussage zu, ohne ausdrücklich absolute moralische Vollkommenheit zu lehren. Die knappe Formulierung bewahrt diese Spannung.
translation_notes:
  register: Knappe, würdige und bewusst paradoxe Formulierung. „Erfüllte lange Jahre“ klingt leicht biblisch, bleibt aber verständlich und bildet die griechische Gegenüberstellung eng nach.
