  text: For old age is honorable not because it is long-lived, nor is it measured by the number of years;
translation:
  language: de
  text: Denn ein ehrenvolles Alter hängt nicht von langer Lebenszeit ab und wird auch nicht nach der Zahl der Jahre bemessen;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γῆρας
  choice: Alter
  rationale: Das griechische Substantiv bezeichnet das hohe Alter als Lebensphase, nicht eine alte Person. „Alter“ ist im Deutschen natürlich und wird durch den Zusammenhang eindeutig bestimmt.
- source_word: τίμιον
  choice: ehrenvolles
  rationale: τίμιος bezeichnet hier gesellschaftlich-ethische Wertschätzung. „Ehrenvoll“ gibt diesen Sinn wieder, ohne die mögliche materielle Bedeutung „kostbar“ einzutragen.
- source_word: οὐ τὸ πολύχρονον
  choice: hängt nicht von langer Lebenszeit ab
  rationale: Die substantivierte Wendung verneint, dass bloße lange Dauer das Kriterium ehrenvollen Alters ist. Die deutsche Fassung macht den prädikativen Zusammenhang idiomatisch deutlich.
- source_word: οὐδὲ
  choice: und wird auch nicht
  rationale: Die koordinierende Negation verbindet den zweiten verneinten Gedanken eng mit dem ersten und klingt in dieser Satzgestalt natürlicher als „noch“.
- source_word: ἀριθμῷ ἐτῶν
  choice: nach der Zahl der Jahre
  rationale: Der Dativ bezeichnet den Maßstab der Bemessung. „Nach der Zahl der Jahre“ ist präzise und geläufig.
- source_word: μεμέτρηται
  choice: wird … bemessen
  rationale: Das Perfekt Passiv beschreibt eine maßgebliche beziehungsweise feststehende Bewertung. Das deutsche Präsens Passiv bewahrt den allgemeinen Weisheitsspruch; „bemessen“ passt zur ethischen Beurteilung besser als rein quantitatives „gemessen“.
theological_decisions:
- issue: Worin die Ehrenhaftigkeit des Alters besteht
  choice: Die Ehre des Alters hängt weder von bloßer Lebensdauer noch von der chronologischen Zahl der Jahre ab.
  alternative: Ein hohes Alter ist an sich ehrenvoll, sofern es lange dauert.
  rationale: Die beiden Negationen bestreiten ausdrücklich, dass Langlebigkeit oder Jahreszahl den Wertmaßstab bilden. Der Vers lässt offen, worin das ehrenvolle Alter positiv besteht; dies folgt im nächsten Vers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und sapiential, ohne altertümliche Syntax. Das abschließende Semikolon bewahrt den im Ausgangstext angelegten Übergang zum folgenden Vers.
