base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/002.yaml
  text: When she is present[a], they imitate her, and they long for her when she has gone; and through the age she marches in triumph, wearing a victor’s wreath, having won the contest of the undefiled prizes.
translation:
  language: de
  text: Ist sie gegenwärtig, ahmen sie sie nach; ist sie fortgegangen, sehnen sie sich nach ihr. Für alle Zeit[a] zieht sie mit dem Siegerkranz im Triumphzug einher, nachdem sie den Wettkampf um unbefleckte Preise gewonnen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „im Zeitalter“; die Wendung kann auch dauernde Geltung oder „in Ewigkeit“ bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροῦσάν
  choice: ist sie gegenwärtig
  rationale: Das Partizip von πάρειμι bezeichnet ihre Gegenwart und steht in bewusstem Gegensatz zu ἀπελθοῦσαν.
- source_word: μιμοῦνται
  choice: ahmen sie sie nach
  rationale: Die direkte Wiedergabe bewahrt den Gedanken, dass Menschen sich die personifizierte Tugend zum Vorbild nehmen.
- source_word: ποθοῦσιν
  choice: sehnen sie sich nach ihr
  rationale: „Sich sehnen“ gibt die starke, gefühlsbetonte Bedeutung des Verbs natürlich wieder.
- source_word: ἀπελθοῦσαν
  choice: ist sie fortgegangen
  rationale: Das Aoristpartizip stellt das Fortgehen als vollzogen dar und wahrt den Gegensatz zwischen Gegenwart und Abwesenheit.
- source_word: ἐν τῷ αἰῶνι
  choice: für alle Zeit
  rationale: Die Formulierung bringt den Gedanken dauernden Ruhmes in natürlichem Deutsch zum Ausdruck, ohne die mögliche Bedeutung von αἰών als „Zeitalter“ zu verschweigen; diese bleibt in der Fußnote erhalten.
- source_word: στεφανηφοροῦσα
  choice: mit dem Siegerkranz
  rationale: Der Ausdruck bezeichnet das Tragen eines Kranzes, besonders eines Siegeskranzes, und erhält so die Wettkampfmetaphorik.
- source_word: πομπεύει
  choice: zieht sie ... im Triumphzug einher
  rationale: Das Verb bezeichnet die Teilnahme an einem feierlichen öffentlichen Umzug; im Zusammenhang ist der Triumphzug des Siegers gemeint.
- source_word: ἀμιάντων
  choice: unbefleckte
  rationale: „Unbefleckt“ bewahrt neben der Reinheit auch den moralischen Beiklang des griechischen Adjektivs.
- source_word: ἄθλων
  choice: Siegespreise
  rationale: ἆθλον ist der in einem Wettkampf errungene Preis; „Siegespreise“ hält diesen Bezug deutlich fest.
- source_word: ἀγῶνα
  choice: Wettkampf
  rationale: Die Wahl fügt sich in das Bild von Siegeskranz und Preisen, ohne den Wettkampf unnötig auf einen Lauf einzuengen.
- source_word: νικήσασα
  choice: nachdem sie ... gewonnen hat
  rationale: Die Konstruktion gibt die dem Triumphzug vorausgehende, vollendete siegreiche Handlung des Aoristpartizips wieder.
theological_decisions:
- issue: Bezug der weiblichen Formen
  choice: Die weiblichen Pronomen beziehen sich auf die im Kontext personifizierte Tugend.
  alternative: Eine allgemeinere weiblich personifizierte Größe wie Vortrefflichkeit oder edler Charakter.
  rationale: Die feminine Personifikation des Kontextes bleibt durch „sie/ihr“ erhalten und wird nicht zu einem unpersönlichen Abstraktum eingeebnet.
- issue: Bedeutung von ἐν τῷ αἰῶνι
  choice: „Für alle Zeit“ als Aussage über dauernden, alle Zeiten übergreifenden Ruhm.
  alternative: „Im Zeitalter“ oder „in Ewigkeit“.
  rationale: αἰών kann sowohl ein Zeitalter als auch unbegrenzte Dauer bezeichnen. Der Haupttext bietet eine natürliche deutsche Formulierung; die Fußnote bewahrt die lexikalische Spannweite, ohne eine metaphysische Ewigkeitsaussage zwingend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau „Ist sie …, ist sie …“ bildet den Gegensatz von Anwesenheit und Fortgang knapp ab. „Triumphzug“, „Siegerkranz“, „Wettkampf“ und „Siegespreise“ erhalten das zusammenhängende öffentliche und athletische Bild des Griechischen.
