translation:
  language: de
  text: Er wurde hinweggenommen, damit das Böse seinen Verstand nicht verändere oder die Täuschung seine Seele nicht irreführe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: wurde hinweggenommen
  rationale: Das Passiv bezeichnet ein plötzliches Wegnehmen oder Entrücken. „Hinweggenommen“ bleibt würdevoll und lässt offen, auf welche Weise dies geschah.
- source_word: κακία
  choice: das Böse
  rationale: Gibt den abstrakten und zugleich wirksamen Charakter von κακία wieder, ohne ihn unnötig auf „Bosheit“ einer bestimmten Person einzuengen.
- source_word: ἀλλάξῃ σύνεσιν
  choice: seinen Verstand veränderte
  rationale: Bewahrt die Grundbedeutung von ἀλλάσσω („verändern“) und gibt σύνεσις als geistiges Einsichts- und Urteilsvermögen wieder.
- source_word: δόλος
  choice: die Täuschung
  rationale: Bezeichnet Trug oder Arglist; „Täuschung“ passt hier als wirksame Macht parallel zu „das Böse“.
- source_word: ἀπατήσῃ ψυχὴν
  choice: seine Seele irreführte
  rationale: ἀπατάω kann „täuschen“ oder „irreführen“ bedeuten. „Irreführen“ vermeidet im Deutschen die schwerfällige Wiederholung „Täuschung täuschte“.
theological_decisions:
- issue: Akteur und Art des Hinwegnehmens
  choice: Passiv „wurde hinweggenommen“ ohne ausdrückliche Nennung Gottes
  alternative: „Gott nahm ihn hinweg“ oder „er wurde entrückt“
  rationale: Der griechische Text nennt den Handelnden nicht und legt auch die genaue Art des Wegnehmens nicht ausdrücklich fest. Die Übersetzung bewahrt diese Offenheit.
- issue: Zweck- oder Vermeidungssatz mit μή
  choice: „damit … nicht“
  alternative: „aus Furcht, das Böse könnte …“ oder „bevor das Böse …“
  rationale: μή mit dem Konjunktiv drückt hier die Abwendung einer möglichen Folge aus. „Damit … nicht“ bildet dies natürlich ab, ohne größere Sicherheit über den Verlauf auszudrücken als der Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang eng, bleibt aber für heutige Leser flüssig. Keine Fußnoten erforderlich.
