    issue: Die Verben „veränderte“ und „irreführte“ stehen im Präteritum.
    rationale: Nach „damit“ geben diese Formen im Deutschen nicht zuverlässig den intendierten Abwendungszweck wieder. Das griechische μή mit Aoristkonjunktiv bezeichnet, was verhindert werden soll, nicht etwas, das tatsächlich geschah. Konjunktivformen bewahren diese Prospektivität.
  revised_text: Er wurde hinweggenommen, damit das Böse seinen Verstand nicht verändere oder die Täuschung seine Seele nicht irreführe.
