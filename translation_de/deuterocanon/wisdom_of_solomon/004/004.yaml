base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/004.yaml
  text: For even if it puts forth shoots for a time in its branches[a], standing insecurely it will be shaken by the wind[b], and by the force of the winds it will be uprooted.
translation:
  language: de
  text: Denn selbst wenn es eine Zeit lang in den Zweigen austreibt[a], wird es, obwohl es unsicher steht, vom Wind erschüttert[b] und von der Gewalt der Winde entwurzelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufblüht« oder »für eine Weile Knospen treibt«; das Griechische bewahrt das Bild eines nur vorübergehenden Pflanzenwachstums.'
    reason: lexical_alternative
  - marker: b
    text: Das »es« führt das Pflanzenbild aus dem vorherigen Vers fort, ohne den Bezugsgegenstand ausdrücklich zu benennen.
    reason: cross_reference
lexical_decisions:
- source_word: κἂν
  choice: selbst wenn
  rationale: Die Zusammenziehung aus καὶ ἐάν leitet eine einräumende Bedingung ein; »selbst wenn« gibt diese Bedeutung im Deutschen natürlich wieder.
- source_word: ἐν κλάδοις
  choice: in den Zweigen
  rationale: Die Wendung bewahrt das Pflanzenbild, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: πρὸς καιρόν
  choice: eine Zeit lang
  rationale: Die idiomatische Wendung bezeichnet eine nur vorübergehende Dauer.
- source_word: ἀναθάλῃ
  choice: neu austreibt
  rationale: Das Verb bezeichnet erneutes beziehungsweise frisches Austreiben und hält das botanische Bild lebendig.
- source_word: ἐπισφαλῶς βεβηκότα
  choice: steht es doch unsicher da
  rationale: Das adverbial bestimmte Partizip beschreibt einen bereits bestehenden, aber gefährdeten und instabilen Stand; der deutsche Hauptsatz ist klar und natürlich.
- source_word: σαλευθήσεται
  choice: wird ... erschüttert
  rationale: Das Futur Passiv bezeichnet die durch den Wind bewirkte Destabilisierung.
- source_word: ὑπὸ βίας ἀνέμων
  choice: von der Gewalt der Winde
  rationale: Die Formulierung erhält βία als Substantiv und gibt die verstärkende Kraft der Winde wieder.
- source_word: ἐκριζωθήσεται
  choice: wird ... entwurzelt
  rationale: Die direkte botanische Bedeutung des Verbs wird prägnant bewahrt.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt innerhalb des aus dem vorherigen Vers fortgeführten Pflanzenbildes
  choice: Das Subjekt wird mit dem sächlichen Pronomen »es« wiedergegeben.
  alternative: Das Subjekt ausdrücklich als »Kind«, »Nachkommenschaft« oder im Plural zu benennen.
  rationale: Die griechischen Verb- und Partizipformen stehen im Singular und führen das Pflanzenbild fort, ohne den Bezugsgegenstand in diesem Vers ausdrücklich zu nennen. »Es« bewahrt diese Offenheit und vermeidet eine interpretierende Ergänzung.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am griechischen Bild und seiner Steigerung: vorübergehendes Austreiben, unsicherer Stand, Erschütterung und schließlich Entwurzelung.'
