base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/019.yaml
  text: And after this they will become a dishonored corpse and a reproach among the dead forever[a]. For he will dash them down headlong and speechless, and shake them from their foundations; they will be laid waste to the uttermost, and they will be in pain[b], and their memory will perish.
translation:
  language: de
  text: Danach werden sie zu einem entehrten Leichnam und für immer zum Gespött unter den Toten.[a] Denn er wird sie stumm und kopfüber zu Boden schmettern und sie aus ihren Grundfesten rütteln; sie werden völlig verwüstet werden und Schmerzen leiden,[b] und die Erinnerung an sie wird vergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem entehrten gefallenen Körper“; das griechische Wort kann einen gefallenen Körper beziehungsweise Leichnam bezeichnen und betont die Schmach ihres Endes.'
    reason: lexical_alternative
  - marker: b
    text: Das Subjekt von „wird … schmettern“ und „wird … rütteln“ bleibt im Griechischen unausgesprochen. Im Zusammenhang ist Gottes Gericht gemeint, doch der Vers nennt Gott hier nicht nochmals ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: πτῶμα
  choice: Leichnam
  rationale: Das Wort bezeichnet hier im Gerichtszusammenhang den gefallenen, toten Körper und damit das schmachvolle Ende, nicht nur einen abstrakten Fall.
- source_word: ἄτιμον
  choice: entehrt
  rationale: Bewahrt den Gedanken verlorener Ehre und öffentlicher Schande und verbindet sich im Deutschen natürlich mit „Leichnam“.
- source_word: ὕβριν
  choice: Gespött
  rationale: Hier bezeichnet das Substantiv den Zustand öffentlicher Verachtung; „Gespött“ gibt diesen Schmachcharakter idiomatisch wieder.
- source_word: ἐν νεκροῖς
  choice: unter den Toten
  rationale: ἐν bei einer Personenmehrheit wird natürlich mit „unter“ wiedergegeben.
- source_word: διʼ αἰῶνος
  choice: für immer
  rationale: Im Zusammenhang dauerhaften Gerichts gibt die Wendung eine bleibende Dauer an.
- source_word: ῥήξει
  choice: wird … zu Boden schmettern
  rationale: Die gewaltsame Bedeutung des Verbs und die durch πρηνεῖς bezeichnete Fallrichtung werden gemeinsam anschaulich wiedergegeben.
- source_word: ἀφώνους
  choice: stumm
  rationale: Kann Sprachlosigkeit oder zum Schweigen gebracht worden zu sein bezeichnen; „stumm“ wahrt diese knappe Mehrdeutigkeit.
- source_word: πρηνεῖς
  choice: kopfüber
  rationale: Gibt die nach vorn beziehungsweise mit dem Gesicht nach unten gerichtete, gewaltsame Fallbewegung natürlich wieder.
- source_word: σαλεύσει … ἐκ θεμελίων
  choice: wird sie aus ihren Grundfesten reißen
  rationale: Die Formulierung vermittelt die gewaltsame Erschütterung und vollständige Destabilisierung der griechischen Metapher in natürlichem Deutsch.
- source_word: ἕως ἐσχάτου
  choice: völlig
  rationale: Drückt die umfassende, bis zum äußersten gehende Wirkung idiomatisch aus.
- source_word: χερσωθήσονται
  choice: werden … verwüstet werden
  rationale: Das Verb bezeichnet völlige Verödung oder Verwüstung; die passive Form bleibt erhalten.
- source_word: ἡ μνήμη αὐτῶν ἀπολεῖται
  choice: die Erinnerung an sie wird vergehen
  rationale: Bewahrt die Aussage vom Erlöschen ihres Andenkens in würdigem, natürlichem Deutsch.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Gerichtsverben
  choice: „er wird“ ohne ausdrückliche Benennung
  alternative: „Gott wird“ oder eine unpersönliche Passivform
  rationale: ῥήξει und σαλεύσει haben ein unausgesprochenes maskulines Subjekt. Der Zusammenhang weist auf Gott, doch der Vers nennt ihn an dieser Stelle nicht ausdrücklich; die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftiger Bildsprache. Die Satzstruktur folgt dem griechischen Ablauf, ohne im Deutschen steif zu wirken; die unausgesprochene göttliche Urheberschaft bleibt formal gewahrt.
