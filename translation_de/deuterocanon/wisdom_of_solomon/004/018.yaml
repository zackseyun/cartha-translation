translation:
  language: de
  text: Sie werden sehen und verachten[a], doch der Herr wird sie auslachen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »für nichts achten« oder »geringschätzen«. Im Griechischen ist das Objekt nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »über sie lachen« beziehungsweise »sie verspotten«; das griechische Verb bezeichnet spöttisches, höhnisches Lachen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: Sie werden es sehen
  rationale: Das Futur von ὁράω wird schlicht mit »werden sehen« wiedergegeben. Das im Deutschen notwendige Objekt »es« ist aus dem Zusammenhang zu ergänzen; im Griechischen steht an dieser Stelle kein ausdrückliches Objekt.
- source_word: ἐξουδενήσουσιν
  choice: und verachten
  rationale: ἐξουδενέω bezeichnet, dass man etwas für nichts hält oder geringschätzt. »verachten« ist im modernen Deutsch knapp, natürlich und trifft die abwertende Haltung.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: κύριος bezeichnet hier Gott. »der Herr« bewahrt die übliche theologische Bezeichnung und den Wortlaut des Griechischen.
- source_word: ἐκγελάσεται
  choice: wird sie auslachen
  rationale: ἐκγελάω hat eine deutlich spöttische, höhnische Bedeutung. »auslachen« gibt diese stärkere Nuance genauer wieder als das neutralere »über sie lachen«.
theological_decisions:
- issue: Bezeichnung Gottes durch κύριος
  choice: der Herr
  alternative: der Gebieter
  rationale: Im Kontext bezeichnet κύριος Gott als denjenigen, der die Verächter der Lächerlichkeit preisgibt. »der Herr« ist sachlich und traditionsgemäß, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Anthropomorphe Aussage, dass Gott lacht
  choice: wird sie auslachen
  alternative: wird sie verspotten
  rationale: Die bildhafte und theologisch spannungsreiche Aussage des griechischen Textes wird nicht abgeschwächt. »auslachen« bewahrt sowohl das Lachen als auch dessen spöttischen Charakter; »verspotten« gäbe nur die übertragene Bedeutung wieder.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Gegenüberstellung des griechischen Satzes bleibt erhalten. Das ergänzte »es« macht den ersten Teilsatz im Deutschen idiomatisch; eine Fußnote weist transparent darauf hin, dass das griechische Objekt unausgesprochen bleibt.
