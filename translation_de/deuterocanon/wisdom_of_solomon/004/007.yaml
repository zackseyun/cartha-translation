  source_fidelity: „früh stirbt“ gibt φθάσῃ τελευτῆσαι im Kontext treffend als vorzeitiges Sterben wieder. Der zukünftige Zustand ἐν ἀναπαύσει ἔσται sollte jedoch als Zustand des Seins in Ruhe formuliert werden, nicht mit dem im Deutschen etwas anders akzentuierten Besitz-Ausdruck „Ruhe haben“.
  naturalness: Der Entwurf ist insgesamt klar und würdevoll. „wird er Ruhe haben“ ist jedoch in dieser Bedeutung weniger idiomatisch und kann im Deutschen nach bloßer ungestörter Zeit klingen. „wird er in Ruhe sein“ ist natürlich, knapp und dem griechischen Ausdruck näher.
  terminology: „ein Gerechter“ ist eine angemessene Wiedergabe des substantivischen maskulinen Singulars δίκαιος. „Ruhe“ für ἀνάπαυσις wahrt den zurückhaltenden Trostton, ohne den jenseitigen Zustand dogmatisch zu bestimmen. Die Fußnote wird sprachlich geglättet und kennzeichnet die idiomatische Bedeutung weiterhin vorsichtig als wahrscheinlich.
