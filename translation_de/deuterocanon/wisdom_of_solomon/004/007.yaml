translation:
  language: de
  text: Doch wenn ein Gerechter früh stirbt[a], wird er in Ruhe sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung lautet wörtlich etwa: „wenn er zum Sterben gelangt“. Sie meint hier wahrscheinlich, dass er früh oder vorzeitig stirbt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος
  choice: ein Gerechter
  rationale: Das substantivisch gebrauchte maskuline Singularadjektiv bezeichnet einen einzelnen Menschen, der gerecht ist. „Ein Gerechter“ ist im Deutschen natürlich und bewahrt den repräsentativen Einzelsinn.
- source_word: δὲ
  choice: doch
  rationale: Die Konjunktion stellt den Vers in einen Gegensatz zum vorausgehenden Gedanken. „Doch“ gibt diese adversative Verbindung knapp und natürlich wieder.
- source_word: ἐὰν
  choice: wenn
  rationale: Die Partikel leitet einen möglichen Bedingungsfall ein. Der im Zusammenhang mitschwingende einräumende Sinn wird nicht durch ein ausdrücklich hinzugefügtes „selbst wenn“ erzwungen.
- source_word: φθάσῃ τελευτῆσαι
  choice: früh stirbt
  rationale: Die Verbindung von φθάνω mit τελευτάω bezeichnet hier idiomatisch ein Sterben vor dem gewöhnlich erwarteten Zeitpunkt. „Früh stirbt“ ist verständlich und lässt offen, ob damit lediglich ein junges Alter oder ein als vorzeitig empfundenes Lebensende gemeint ist.
- source_word: ἐν ἀναπαύσει ἔσται
  choice: wird er Ruhe haben
  rationale: Die Wendung beschreibt künftig einen Zustand der Ruhe. „Ruhe haben“ bleibt näher am Verb des Seins als „Ruhe finden“ und legt die genaue Beschaffenheit dieses Zustands nicht näher fest.
theological_decisions:
- issue: Ob ἐν ἀναπαύσει ausdrücklich als Aussage über einen näher bestimmten Zustand nach dem Tod wiederzugeben ist
  choice: wird er Ruhe haben
  alternative: wird er in Frieden ruhen
  rationale: Der griechische Text verheißt Ruhe, erklärt aber deren metaphysische Beschaffenheit nicht. Die gewählte Formulierung bewahrt den Trost der Aussage, ohne eine ausführlichere Jenseitslehre einzutragen.
- issue: Ob ἐὰν ausdrücklich einräumend als „selbst wenn“ zu übersetzen ist
  choice: wenn
  alternative: selbst wenn
  rationale: Die Bedingung kann im Kontext einräumend verstanden werden, doch die Partikel selbst verlangt diese Verstärkung nicht. Die schlichte Wiedergabe erhält die Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Formulierung vermeidet sowohl altertümliche Wendungen als auch eine über den griechischen Wortlaut hinausgehende Festlegung auf eine bestimmte Jenseitsvorstellung.
