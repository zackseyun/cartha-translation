revisions:
- from: Doch wenn ein Gerechter früh stirbt[a], wird er Ruhe haben.
  to: Doch wenn ein Gerechter früh stirbt[a], wird er in Ruhe sein.
  rationale: Die Revision ersetzt allein die deutsche Zustandsformulierung durch „wird er in Ruhe sein“, um ἐν ἀναπαύσει ἔσται genauer und idiomatischer wiederzugeben. Die Fußnote bleibt beim vorsichtigen Hinweis auf den idiomatischen Sinn von φθάσῃ τελευτῆσαι, ist aber sprachlich geglättet. Weder die konditionale Offenheit noch die theologische Zurückhaltung des griechischen Textes werden verändert.
