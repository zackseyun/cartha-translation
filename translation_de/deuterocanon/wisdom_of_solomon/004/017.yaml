base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/017.yaml
  text: For they will see the end of the wise man[a], and will not understand what the Lord planned concerning him[b], or for what purpose he made him secure.
translation:
  language: de
  text: Denn sie werden das Ende des Weisen[a] sehen, aber nicht verstehen, was der Herr im Blick auf ihn beschlossen hat und wozu er ihn in Sicherheit gebracht hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Tod des Weisen“. Das griechische Wort τελευτή kann „Ende“ oder „Tod“ bedeuten; „Ende“ bewahrt hier den weiteren Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu welchem Ziel der Herr ihn sicher bewahrt hat“. Das Griechische lässt offen, welcher Art diese Sicherheit ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: sie werden sehen
  rationale: Das Futur von ὁράω bezeichnet hier unmittelbares Wahrnehmen; die schlichte Wiedergabe wahrt die Direktheit des Griechischen.
- source_word: τελευτὴν
  choice: das Ende
  rationale: τελευτή kann sowohl „Ende“ als auch „Tod“ bedeuten. „Ende“ bewahrt den weiteren Sinn und damit die Spannung zwischen dem sichtbaren Tod und dem von Gott bestimmten Ausgang.
- source_word: σοφοῦ
  choice: des Weisen
  rationale: Das substantivierte maskuline Singularadjektiv bezeichnet hier den weisen Mann beziehungsweise den Weisen und wird im Deutschen idiomatisch substantiviert wiedergegeben.
- source_word: οὐ νοήσουσιν
  choice: nicht verstehen
  rationale: νοέω bezeichnet hier, dass die Beobachter die Bedeutung dessen, was sie sehen, nicht erfassen.
- source_word: ἐβουλεύσατο
  choice: beschlossen hat
  rationale: Das Medium von βουλεύω drückt hier einen überlegten Entschluss beziehungsweise göttlichen Ratschluss aus; „beschlossen hat“ ist gegenwärtig, würdig und stärker als ein bloßes Vorhaben.
- source_word: περὶ αὐτοῦ
  choice: im Blick auf ihn
  rationale: Die Formulierung gibt περί mit Genitiv als „hinsichtlich ihn“ wieder, ohne vorschnell festzulegen, ob ausschließlich „für ihn“ gemeint ist.
- source_word: εἰς τί
  choice: wozu
  rationale: „Wozu“ bewahrt knapp und natürlich die auf Ziel oder Zweck gerichtete Bedeutung der griechischen Wendung.
- source_word: ἠσφαλίσατο
  choice: ihn in Sicherheit gebracht hat
  rationale: Die Wiedergabe erhält den kausativen Gedanken des Sicherns, ohne die Art dieser Sicherheit als körperlich, moralisch oder endzeitlich festzulegen.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: „Der Herr“ ist die natürliche und traditionsgemäße Wiedergabe des bestimmten κύριος in diesem Gottesbezug.
theological_decisions:
- issue: Bedeutungsumfang von τελευτή angesichts des Todes des Gerechten
  choice: „das Ende“
  alternative: „der Tod“ oder „der Ausgang“
  rationale: Der unmittelbare Zusammenhang betrifft den Tod des Gerechten, doch der Vers stellt das Sichtbare dem unverstandenen Plan Gottes gegenüber. „Ende“ lässt sowohl den Tod als auch den umfassenderen, von Gott bestimmten Ausgang anklingen.
- issue: Art der in ἠσφαλίσατο αὐτόν bezeichneten Sicherheit
  choice: „ihn in Sicherheit gebracht hat“
  alternative: „ihn beschützt hat“, „ihn sicher bewahrt hat“ oder „ihn befestigt hat“
  rationale: Der griechische Text bestimmt nicht näher, worin die Sicherheit besteht. Die gewählte Formulierung wahrt daher die Spannung zwischen dem sichtbaren Ende des Weisen und seiner tatsächlichen Geborgenheit bei Gott.
- issue: Bezug von περὶ αὐτοῦ
  choice: „im Blick auf ihn“
  alternative: „für ihn“ oder „über ihn“
  rationale: Die neutrale relationale Formulierung vermeidet sowohl eine ausschließlich begünstigende Deutung („für ihn“) als auch den möglichen Klang eines Gerichtsurteils („über ihn“).
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Gedankenführung, bleibt aber für heutige Leser flüssig. „Im Blick auf ihn“ wahrt den offenen Bezug von περὶ αὐτοῦ; „in Sicherheit gebracht“ lässt die theologische Art der Sicherung bewusst unbestimmt.
