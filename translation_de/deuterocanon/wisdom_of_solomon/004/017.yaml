  source_fidelity: 'Die Übersetzung bildet die griechische Satzstruktur und die zentralen Bedeutungen zuverlässig ab: Das sichtbare „Ende“ (τελευτή), das fehlende Verstehen (οὐ νοήσουσιν), der göttliche Entschluss hinsichtlich des Weisen (ἐβουλεύσατο περὶ αὐτοῦ) und das auf ein Ziel gerichtete Sichern durch den Herrn (εἰς τί ἠσφαλίσατο αὐτὸν ὁ κύριος). „Das Ende“ bewahrt die im Griechischen vorhandene Offenheit gegenüber der engeren Bedeutung „Tod“.'
