base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/001.yaml
  text: Better is childlessness with virtue[a], for immortality is in her memory[b], because she is known both by God and by men.
translation:
  language: de
  text: Besser ist Kinderlosigkeit mit Tugend; denn in der Erinnerung an sie[a] liegt Unsterblichkeit, weil sie sowohl bei Gott als auch bei den Menschen bekannt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische „sie“ bezieht sich wahrscheinlich auf die Tugend. Es kann jedoch auch auf die Kinderlosigkeit als personifizierten Zustand oder sinngemäß auf die kinderlose Frau bezogen werden.
    reason: Mehrdeutiger Pronomenbezug im griechischen Text.
lexical_decisions:
- source_word: κρείσσων ἀτεκνία μετὰ ἀρετῆς
  choice: Besser ist Kinderlosigkeit mit Tugend
  rationale: Die prädikative Vergleichsform und die knappe, spruchartige Wortfolge bleiben erhalten. „Kinderlosigkeit“ bezeichnet den Zustand ohne Kinder, ohne ihn auf körperliche Unfruchtbarkeit einzuengen; ἀρετή wird im ethischen Sinn mit „Tugend“ wiedergegeben.
- source_word: ἀθανασία
  choice: Unsterblichkeit
  rationale: Dies ist die direkte und in der Weisheitsliteratur sachlich angemessene Entsprechung des griechischen Schlüsselbegriffs.
- source_word: ἐν μνήμῃ αὐτῆς
  choice: in der Erinnerung an sie
  rationale: Die Formulierung gibt die lokale Wendung mit ἐν wieder und bewahrt durch „sie“ die im Griechischen vorhandene Mehrdeutigkeit des femininen Bezugs.
- source_word: γινώσκεται
  choice: bekannt ist
  rationale: Das Präsens Passiv bezeichnet hier fortdauerndes Bekanntsein beziehungsweise Anerkanntsein; „bekannt ist“ bleibt nah am Grundverb und passt zu Gott wie zu Menschen.
- source_word: παρὰ θεῷ ... καὶ παρὰ ἀνθρώποις
  choice: sowohl bei Gott als auch bei den Menschen
  rationale: παρά mit Dativ bezeichnet hier das Bekanntsein beziehungsweise Ansehen im Bereich oder Urteil Gottes und der Menschen. „Menschen“ gibt das generische ἀνθρώποις im heutigen Deutsch genau wieder.
theological_decisions:
- issue: Bezugswort des femininen Pronomens αὐτῆς und des unausgesprochenen Subjekts von γινώσκεται
  choice: Der deutsche Haupttext lässt den Bezug durch „sie“ offen; im unmittelbaren Zusammenhang liegt „Tugend“ am nächsten.
  alternative: Das Pronomen kann auf die Kinderlosigkeit als personifizierten Zustand oder sinngemäß auf die kinderlose Frau bezogen werden.
  rationale: 'ἀρετή ist das nächststehende feminine Substantiv und ergibt einen schlüssigen Gedankengang: Tugend bleibt im Gedächtnis und ist bei Gott und Menschen bekannt. Da auch ἀτεκνία feminin ist und der griechische Wortlaut den Bezug nicht ausdrücklich festlegt, wird die echte Mehrdeutigkeit nicht im Haupttext aufgelöst.'
translation_notes:
  register: Knapper, würdevoller Weisheitsspruch in modernem Standarddeutsch. Die leicht markierte Wendung „in der Erinnerung an sie liegt Unsterblichkeit“ bewahrt Bild und Satzbau des Griechischen, ohne unnatürlich zu wirken.
