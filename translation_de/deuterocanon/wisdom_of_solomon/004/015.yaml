lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ gibt die göttliche Zuwendung prägnant wieder und bewahrt im Paar mit ἔλεος das theologische Gewicht des griechischen Ausdrucks.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: „Erbarmen“ ist eine natürliche, würdevolle Wiedergabe für göttliche Barmherzigkeit und fügt sich gut in die Verbindung „Gnade und Erbarmen“ ein.
- source_word: ἐκλεκτοῖς
  choice: Erwählten
  rationale: Das substantivierte Adjektiv bezeichnet die von Gott Erwählten. Die Wiedergabe bleibt nah am Griechischen, ohne zusätzliche Aussagen über Art oder Grundlage der Erwählung einzutragen.
- source_word: ἐπισκοπή
  choice: wachsame Fürsorge
  rationale: Das Wort kann Aufsicht, prüfende Heimsuchung oder fürsorgliche Zuwendung bezeichnen. Der Parallelismus mit „Gnade und Erbarmen“ legt hier eine wohltätige, aufmerksame Fürsorge nahe; die Fußnote hält die weitere Bedeutungsbreite offen.
- source_word: ὁσίοις
  choice: Heiligen
  rationale: „Heiligen“ gibt die Personenbezeichnung verständlich und traditionsnah wieder. Der Ausdruck kann zugleich den Gedanken von Frömmigkeit und Treue einschließen.
- source_word: ἐν
  choice: bei
  rationale: „Bei“ bildet die wiederholte griechische Konstruktion ἐν τοῖς idiomatisch ab und lässt offen, ob vor allem Gegenwart, Zuwendung oder Wirksamkeit gemeint ist.
theological_decisions:
- issue: Bedeutung der göttlichen ἐπισκοπή
  choice: wohltätige, wachsame Fürsorge
  alternative: Aufsicht, prüfender Besuch oder Heimsuchung zum Gericht
  rationale: Die unmittelbare Parallele zu „Gnade und Erbarmen“ spricht für eine positive göttliche Zuwendung. Da ἐπισκοπή jedoch auch Aufsicht, Prüfung oder gerichtliche Heimsuchung bezeichnen kann, wird diese Spannung in der Fußnote kenntlich gemacht.
- issue: Bezeichnung der ἐκλεκτοί und ὅσιοι
  choice: „Erwählte“ und „Heilige“ als parallele Bezeichnungen
  alternative: „Auserwählte“ und „Fromme“ beziehungsweise „Treue“
  rationale: Die Übersetzung wahrt die beiden unterschiedlichen griechischen Begriffe und legt nicht fest, ob sie exakt dieselbe Gruppe unter verschiedenen Gesichtspunkten oder eng verwandte Gruppen bezeichnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erkennbar; „wachsame Fürsorge“ vermeidet die heute meist negative Färbung von „Heimsuchung“, während die Fußnote die Bedeutungsbreite offenhält.
