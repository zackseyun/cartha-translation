  text: Denn Gnade und Erbarmen sind bei seinen Erwählten, und Zuwendung[a] bei seinen Frommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Aufsicht“, „Besuch“ oder „Heimsuchung“ bedeuten und eine Prüfung einschließen; im Zusammenhang mit Gnade und Erbarmen liegt hier eine positive göttliche Zuwendung nahe.
