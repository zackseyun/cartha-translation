  text: so that it might be known that one must rise before the sun to give you thanks[b][a], and at the dawning of the light make petition to you.
translation:
  language: de
  text: damit bekannt würde, dass man der Sonne zuvorkommen muss, um dir zu danken,[a] und sich beim Anbruch des Lichts mit einer Bitte an dich wenden muss.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Sonne zur Danksagung an dich zuvorkommen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu dir beten“; das griechische Verb kann bedeuten, sich mit einer Bitte oder einem Anliegen an jemanden zu wenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  choice: damit bekannt würde
  rationale: Die Zweckkonstruktion mit ὅπως wird im Deutschen natürlich mit „damit“ und Konjunktiv wiedergegeben; so bleibt offen, ob das Gemeinte bekannt werden oder als bekannt erwiesen werden soll.
- source_word: δεῖ
  choice: man … muss
  rationale: Die unpersönliche Notwendigkeit wird idiomatisch und ohne Festlegung eines bestimmten Subjekts ausgedrückt.
- source_word: φθάνειν τὸν ἥλιον
  choice: der Sonne zuvorkommen
  rationale: Die Formulierung bewahrt das poetische Bild und die zeitliche Bedeutung, vor der Sonne da zu sein, ohne ausdrücklich das im Griechischen nicht genannte Aufstehen einzufügen.
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: um dir zu danken
  rationale: Die elliptische Präpositionalphrase bezeichnet hier die an Gott gerichtete Danksagung; die verbale Wiedergabe ist im modernen Deutschen klar und natürlich.
- source_word: πρὸς ἀνατολὴν φωτός
  choice: beim Anbruch des Lichts
  rationale: Die Wendung bewahrt das Bild des aufgehenden Lichts und bezeichnet zugleich verständlich die Morgendämmerung.
- source_word: ἐντυγχάνειν σοι
  choice: sich mit einer Bitte an dich wenden
  rationale: Das Verb mit Dativ kann die Annäherung an jemanden mit einer Bitte bezeichnen; diese Wiedergabe erhält sowohl den Vorgang des Sichwendens als auch den bittenden Sinn.
theological_decisions:
- issue: Allgemeine Verpflichtung oder spezifisch liturgische Vorschrift zum Morgengebet
  choice: Eine allgemein formulierte Notwendigkeit in gottesdienstlich-andächtiger Sprache
  alternative: Eine ausdrückliche Vorschrift, vor Sonnenaufgang aufzustehen und ein festes Morgengebet zu verrichten
  rationale: Das unpersönliche δεῖ drückt Verpflichtung aus, während der Vers weder einen bestimmten Personenkreis noch eine institutionalisierte Liturgie nennt. Die Übersetzung wahrt daher den allgemeinen Anspruch und die Gebetssprache, ohne eine feste liturgische Ordnung einzutragen.
- issue: Ausdrückliche Ergänzung des Aufstehens
  choice: Das Bild wörtlich als „der Sonne zuvorkommen“ bewahren
  alternative: „vor der Sonne aufstehen“
  rationale: Im Griechischen steht kein Verb für „aufstehen“. Die zeitliche und poetische Aussage lässt sich ohne diese kontextuell plausible, aber ergänzende Deutung wiedergeben.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Bildlichkeit. Die Syntax bleibt auch ohne den vorangehenden Kontext verständlich; die zweimalige Verwendung von „muss“ verdeutlicht, dass δεῖ beide Infinitive umfasst.
