base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/002.yaml
  text: Instead of this punishment[a], you did good to your people; for a strange craving of appetite[b], you prepared quail as food for them.
translation:
  language: de
  text: 'Anstelle jener Strafe[a] tatest du deinem Volk Gutes: Um sein Verlangen nach Speise zu stillen, bereitetest du ihm Wachteln als Nahrung mit ungewöhnlichem Geschmack.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Im Gegensatz zu jener Strafe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „zum Verlangen des Appetits einen ungewöhnlichen Geschmack“; die griechische Formulierung ist stark verdichtet. Der ungewöhnliche Geschmack kennzeichnet die bereitete Speise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ἧς κολάσεως
  choice: Anstelle jener Strafe
  rationale: ἀντί mit dem Genitiv bezeichnet hier am natürlichsten einen Gegensatz beziehungsweise Ersatz; das rückverweisende ἧς wird mit „jener“ wiedergegeben.
- source_word: εὐεργετήσας τὸν λαόν σου
  choice: tatest du deinem Volk Gutes
  rationale: Die Wendung gibt das konkrete Wohltun von εὐεργετέω natürlich wieder, ohne zusätzliche Segens- oder Bundesvorstellungen einzutragen.
- source_word: εἰς ἐπιθυμίαν ὀρέξεως ξένην γεῦσιν
  choice: Für sein Verlangen nach einem ungewöhnlichen Geschmack
  rationale: Die Wiedergabe erhält sowohl das Verlangen als auch den Gedanken eines außergewöhnlichen Geschmackserlebnisses, glättet aber die stark verdichtete griechische Wortfolge nur so weit, wie es für verständliches Deutsch nötig ist.
- source_word: τροφὴν ἡτοίμασας ὀρτυγομήτραν
  choice: bereitetest du ihm Wachteln als Speise
  rationale: τροφὴν und ἡτοίμασας werden direkt als „als Speise“ und „bereitetest“ wiedergegeben; ὀρτυγομήτρα bezeichnet hier die Wachtel.
theological_decisions:
- issue: Gottes Wohltun gegenüber seinem Volk im Gegensatz zur Strafe der anderen
  choice: „Anstelle jener Strafe“ kennzeichnet einen deutlichen Gegensatz zwischen der Strafe im Kontext und Gottes Wohltun an seinem Volk.
  alternative: „Als Antwort auf jene Strafe“ oder eine bloß zeitliche Verknüpfung
  rationale: Die Konstruktion ἀνθʼ ἧς mit dem Genitiv spricht am ehesten für Gegensatz oder Ersatz. Die Übersetzung bewahrt diesen Kontrast, ohne seine theologische Bedeutung weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung ist verständlich, bewahrt aber durch die Fußnote die ungewöhnlich verdichtete Ausdrucksweise des Griechischen. Beide Fußnotenmarker erscheinen im Haupttext.
