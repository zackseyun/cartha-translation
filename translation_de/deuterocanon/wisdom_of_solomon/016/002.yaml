  source_fidelity: 'Die Kontrastformel „Anstelle jener Strafe“ und „tatest du deinem Volk Gutes“ geben ἀνθʼ ἧς κολάσεως und εὐεργετήσας τὸν λαόν σου gut wieder. Im Mittelteil verschiebt der Entwurf jedoch die syntaktische Zuordnung: ξένην gehört unmittelbar zu γεῦσιν („ungewöhnlicher Geschmack“), nicht zum Verlangen. Das Verlangen gilt der Speise; die bereitgestellten Wachteln werden als Nahrung mit ungewöhnlichem Geschmack beschrieben.'
