base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/006.yaml
  text: But for a short time they were troubled as a warning, having a sign of salvation, for a reminder of the commandment of your law;
translation:
  language: de
  text: Doch zur Mahnung wurden sie für kurze Zeit beunruhigt und hatten ein Zeichen der Rettung[a] zur Erinnerung an das Gebot deines Gesetzes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Sinnbild des Heils«; auch: »ein Unterpfand der Rettung«.'
    reason: σύμβολον kann »Zeichen«, »Sinnbild« oder »Unterpfand/Erkennungszeichen« bedeuten; σωτηρία kann neben konkreter Rettung auch »Heil« bezeichnen.
lexical_decisions:
- source_word: εἰς νουθεσίαν
  choice: zur Mahnung
  rationale: Die Wendung bezeichnet eine zurechtweisende Warnung, die zur Einsicht führen soll. »Zur Mahnung« gibt sowohl den warnenden als auch den erzieherischen Sinn knapp und natürlich wieder.
- source_word: πρὸς ὀλίγον
  choice: für kurze Zeit
  rationale: Die Präpositionalphrase begrenzt die Dauer des Geschehens ausdrücklich.
- source_word: ἐταράχθησαν
  choice: wurden sie in Schrecken versetzt
  rationale: Der passive Aorist von ταράσσω bezeichnet hier eine von außen bewirkte Erschütterung oder Beunruhigung. Im Zusammenhang der tödlichen Schlangen gibt »in Schrecken versetzt« die Stärke des Ausdrucks natürlicher wieder als das schwächere »beunruhigt«.
- source_word: σύμβολον
  choice: Zeichen
  rationale: σύμβολον kann ein Zeichen, Sinnbild oder Erkennungszeichen bezeichnen. »Zeichen« ist verständlich und lässt offen, auf welche Weise der sichtbare Gegenstand auf die Rettung verweist.
- source_word: σωτηρίας
  choice: der Rettung
  rationale: Im unmittelbaren Zusammenhang geht es um Bewahrung vor tödlicher Gefahr. »Rettung« wahrt diesen konkreten Sinn, ohne die weiter reichende Heilsbedeutung auszuschließen.
- source_word: εἰς ἀνάμνησιν
  choice: zur Erinnerung
  rationale: 'Die Wendung bezeichnet Zweck oder Funktion des Zeichens: Es sollte das Gebot ins Gedächtnis rufen.'
- source_word: ἐντολῆς νόμου σου
  choice: an das Gebot deines Gesetzes
  rationale: Die Wiedergabe bewahrt sowohl den Singular ἐντολή als auch den Genitiv νόμου und legt nicht fest, ob ein einzelnes Gebot oder die gebietende Weisung des Gesetzes gemeint ist.
theological_decisions:
- issue: σωτηρίας zwischen konkreter Lebensrettung und umfassender Heilsbedeutung
  choice: der Rettung
  alternative: des Heils
  rationale: »Rettung« entspricht der unmittelbaren Gefahr in der Wüstenerzählung; die Formulierung »Zeichen der Rettung« bleibt zugleich offen für eine weitergehende theologische Bedeutung.
- issue: Funktion des σύμβολον im Zusammenhang mit der ehernen Schlange
  choice: ein Zeichen der Rettung
  alternative: ein Sinnbild des Heils
  rationale: »Zeichen« hält die repräsentative und hinweisende Funktion fest, ohne den Gegenstand auf ein bloß abstraktes Symbol zu reduzieren oder eine bestimmte typologische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt der griechischen Gedankenfolge nahe, wird aber durch das Semikolon und »dabei« für heutige Leser übersichtlich gemacht. Die Anrede Gottes in »deines Gesetzes« bleibt erhalten.
