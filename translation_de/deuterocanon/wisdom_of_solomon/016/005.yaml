base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/005.yaml
  text: For even when a terrible fury of wild beasts came upon them[a], and they were being destroyed by the bites of crooked serpents, your wrath did not remain to the end;
translation:
  language: de
  text: Denn selbst als ein schreckliches Wüten wilder Tiere über sie kam und sie durch die Bisse gewundener Schlangen[a] zugrunde gerichtet wurden, blieb dein Zorn nicht bis zum Ende bestehen;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „krummer Schlangen“ beziehungsweise „sich windender Schlangen“. Das griechische Adjektiv bedeutet wörtlich „krumm“ oder „gebogen“; hier beschreibt es wahrscheinlich die gewundene Gestalt oder Bewegung der Schlangen und keine moralische Eigenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεινὸς
  choice: schreckliches
  rationale: Gibt die große Bedrohlichkeit des Geschehens in natürlichem, gehobenem Deutsch wieder, ohne die Aussage zu übersteigern.
- source_word: θηρίων θυμός
  choice: Wüten wilder Tiere
  rationale: θηρίων bezeichnet wilde Tiere, während θυμός hier ihre heftige, zerstörerische Angriffswut ausdrückt. „Wüten“ ist im Deutschen anschaulich und idiomatisch.
- source_word: ἐπῆλθεν
  choice: über sie kam
  rationale: Bewahrt das Bild eines Unheils oder Angriffs, der die Betroffenen erreicht und überwältigt.
- source_word: δήγμασίν
  choice: durch die Bisse
  rationale: δήγματα bezeichnet konkret Bisse; die instrumentale Wiedergabe entspricht dem griechischen Dativ.
- source_word: σκολιῶν ὄφεων
  choice: gewundener Schlangen
  rationale: σκολιός bedeutet wörtlich „krumm“ oder „gebogen“ und beschreibt hier wahrscheinlich die gewundene Gestalt beziehungsweise Bewegung der Schlangen, nicht eine moralische Eigenschaft.
- source_word: διεφθείροντο
  choice: zugrunde gingen
  rationale: Die Form bezeichnet einen fortschreitenden zerstörerischen Vorgang. „Zugrunde gingen“ gibt dessen tödlichen Ernst natürlich wieder, auch wenn das griechische Passiv im Deutschen idiomatisch als intransitive Wendung erscheint.
- source_word: οὐ μέχρι τέλους ἔμεινεν
  choice: blieb nicht bis zum Ende bestehen
  rationale: Hält die zeitliche Formulierung eng am Griechischen und vermeidet eine Auslegung darüber, ob „Ende“ hier endgültig oder lediglich für diese Gerichtsepisode gemeint ist.
- source_word: ἡ ὀργή σου
  choice: dein Zorn
  rationale: „Zorn“ entspricht der feierlichen und gerichtlichen Stärke von ὀργή besser als das schwächere „Ärger“.
theological_decisions:
- issue: Die zeitliche Begrenzung des göttlichen Gerichts
  choice: dein Zorn blieb nicht bis zum Ende bestehen
  alternative: dein Zorn dauerte nicht für immer an
  rationale: Die gewählte Fassung bewahrt die konkrete, mehrdeutige Wendung μέχρι τέλους („bis zum Ende“). Sie hält sowohl am wirklichen göttlichen Zorn als auch an seiner Begrenzung in dieser Begebenheit fest, ohne „bis zum Ende“ vorschnell als „für immer“ zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wüten wilder Tiere“ wahrt die Bildkraft des griechischen Ausdrucks; „bis zum Ende“ erhält dessen theologische und zeitliche Offenheit. Das Semikolon folgt dem fortlaufenden Satzanschluss an den nächsten Vers.
