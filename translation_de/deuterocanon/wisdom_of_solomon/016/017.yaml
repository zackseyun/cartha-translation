base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/017.yaml
  text: 'For what was most astonishing was this: in the water that extinguishes everything[a], the fire had even greater power, for the world fights on behalf of the righteous.'
translation:
  language: de
  text: 'Denn das Erstaunlichste war: im Wasser, das alles löscht, entfaltete das Feuer noch größere Kraft; denn die Welt kämpft für die Gerechten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn das Universum ist ein Vorkämpfer für die Gerechten“; auch: „Denn die Schöpfung verteidigt die Gerechten.“'
    reason: Die Verbindung κόσμος ὑπέρμαχος erlaubt sowohl eine substantivische Wiedergabe („Vorkämpfer“) als auch eine verbale („kämpft für“, „verteidigt“); κόσμος kann hier „Welt“, „Universum“ oder „Schöpfung“ bedeuten.
lexical_decisions:
- source_word: παραδοξότατον
  choice: höchst erstaunlich
  rationale: Der Superlativ bezeichnet etwas in höchstem Maß Unerwartetes oder Staunenswertes. „Höchst erstaunlich“ ist natürlich und würdevoll, ohne den Ausdruck unnötig zum Fachwort „paradox“ zu verengen.
- source_word: σβεννύντι
  choice: das alles löscht
  rationale: Das Partizip beschreibt die gewöhnliche Wirkung des Wassers gegenüber Feuer. „Löscht“ bewahrt diesen konkreten Bezug und verbindet sich im Deutschen idiomatisch mit „alles“.
- source_word: πλεῖον ἐνήργει
  choice: entfaltete ... noch größere Kraft
  rationale: ἐνήργει bezeichnet wirksames Tätigsein; πλεῖον steigert diese Wirksamkeit. Die Formulierung gibt den fortdauernden Vorgang natürlich wieder und bewahrt den Gedanken gesteigerter Kraft.
- source_word: ὑπέρμαχος
  choice: kämpft für
  rationale: Das Wort bezeichnet einen Kämpfer oder Verteidiger zugunsten anderer. Die verbale Wiedergabe erhält die martialische Personifikation der Welt.
- source_word: κόσμος
  choice: die Welt
  rationale: κόσμος bezeichnet hier die geordnete geschaffene Welt. „Die Welt“ ist die direkte deutsche Entsprechung; mögliche Nuancen wie „Schöpfung“ oder „Universum“ werden in der Fußnote genannt.
- source_word: δικαίων
  choice: die Gerechten
  rationale: Der substantivierte Ausdruck bezeichnet gerechte Menschen als Gruppe und wird im Deutschen knapp und traditionsverständlich mit „die Gerechten“ wiedergegeben.
theological_decisions:
- issue: Deutung von κόσμος ὑπέρμαχος ... δικαίων
  choice: Die geschaffene Welt wird als eine Macht personifiziert, die für die Gerechten kämpft.
  alternative: Die Welt ist eine Verbündete oder Verteidigerin der Gerechten.
  rationale: Die Übersetzung bewahrt die Personifikation und die kämpferische Kraft von ὑπέρμαχος, ohne daraus eine weitergehende Lehre über die Natur abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht das nachfolgende Wunder als Inhalt des zuvor angekündigten Erstaunlichen kenntlich; das Semikolon erhält die begründende Struktur des griechischen Satzes.
