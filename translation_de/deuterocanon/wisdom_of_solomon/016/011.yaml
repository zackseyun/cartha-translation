base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/011.yaml
  text: For they were being pricked as a reminder of your sayings, and were quickly rescued, so that, after falling into deep forgetfulness, they might not become cut off from your beneficence.
translation:
  language: de
  text: Denn sie wurden zur Erinnerung an deine Aussprüche gestochen und rasch gerettet, damit sie nicht, in tiefe Vergessenheit gefallen, von deiner Wohltat abgelenkt würden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung ist ungewöhnlich. Das zugrunde liegende Wort bedeutet wörtlich „unabgelenkt“; im Zusammenhang kann es ein Abgelenkt- oder Abgewandtwerden von Gottes Wohltat bezeichnen.
    reason: Bewahrt die lexikalische Mehrdeutigkeit von ἀπερίσπαστοι mit Genitiv, ohne einen äußeren Ausschluss als alleinige Deutung festzulegen.
lexical_decisions:
- source_word: λόγια
  choice: Aussprüche
  rationale: Bezeichnet hier Gottes autoritative Äußerungen; „Aussprüche“ wahrt diesen Sinn genauer als das allgemeinere „Worte“.
- source_word: ἐνεκεντρίζοντο
  choice: sie wurden gestochen
  rationale: Das Imperfekt Passiv beschreibt im Zusammenhang die wiederholten Schlangenstiche und bewahrt zugleich das Bild des griechischen Verbs.
- source_word: ὀξέως διεσώζοντο
  choice: rasch gerettet
  rationale: ὀξέως bezeichnet die schnelle Rettung; διεσώζοντο meint das sichere Hindurchretten aus der Gefahr.
- source_word: εὐεργεσία
  choice: Wohltat
  rationale: Gibt die gnädige, konkret erwiesene Hilfe Gottes in würdigem und verständlichem Deutsch wieder.
- source_word: ἀπερίσπαστοι … τῆς σῆς εὐεργεσίας
  choice: deiner Wohltat entzogen würden
  rationale: Die ungewöhnliche Verbindung mit dem Genitiv bezeichnet im Zusammenhang den Verlust des Zugangs zu Gottes Wohltat; eine Fußnote hält die lexikalische Schwierigkeit offen.
theological_decisions:
- issue: Zweck der Stiche und der schnellen Rettung
  choice: Die Stiche dienen der Erinnerung, die Rettung bewahrt vor tiefer Vergessenheit und dem Verlust der göttlichen Wohltat.
  alternative: Die Stiche als Strafe und die Rettung ausschließlich als Heilung formulieren.
  rationale: Die beiden ἵνα-/εἰς-Konstruktionen des griechischen Textes betonen Erinnerung und Bewahrung, ohne Strafe oder Heilung als alleinige theologische Deutung festzulegen.
- issue: Bezug von Gottes εὐεργεσία
  choice: „deine Wohltat“ bleibt allgemein und direkt auf Gott bezogen.
  alternative: Konkretisierung als „Gnade“, „Bundestreue“ oder „Heil“.
  rationale: Der Ausgangstext nennt eine Wohltat beziehungsweise hilfreiche Güte, legt aber keine dieser engeren dogmatischen Kategorien ausdrücklich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der griechischen Begründungs- und Zweckstruktur, bleibt aber flüssig; „Aussprüche“, „Wohltat“ und „entzogen“ halten den gehobenen Weisheitston ohne konfessionelle Zusätze.
