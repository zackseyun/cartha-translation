  source_fidelity: Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben. Jedoch gibt „deiner Wohltat entzogen würden“ ἀπερίσπαστοι mit Genitiv zu stark als äußeren Ausschluss wieder. Das griechische Wort bezeichnet zunächst ein Abgelenkt- bzw. Abgewandtsein. Außerdem sollte der temporale Charakter des Partizips ἐμπεσόντες („in tiefe Vergessenheit gefallen“) im Deutschen erkennbar bleiben.
  naturalness: Der Entwurf ist insgesamt gut verständlich und würdig. „um sie an deine Aussprüche zu erinnern“ ist wegen der Wiederholung von „sie“ weniger glatt als die näher am Griechischen liegende nominale Fügung „zur Erinnerung an deine Aussprüche“.
