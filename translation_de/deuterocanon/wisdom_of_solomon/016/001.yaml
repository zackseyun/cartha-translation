base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/001.yaml
  text: Therefore they were justly punished by similar things[b][a], and were tormented by a multitude of creatures.
translation:
  language: de
  text: Darum wurden sie zu Recht durch Ähnliches bestraft[a] und durch eine Menge von Tieren gequält.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Gleichartiges“. Das Griechische betont die Entsprechung zwischen Vergehen und Strafe.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann allgemein Tiere oder Getier bezeichnen, je nach Zusammenhang auch kleinere, kriechende oder lästige Tiere.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde und begründende Verbindung zum vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: διʼ ὁμοίων
  choice: durch Ähnliches
  rationale: Bewahrt die im Griechischen offen gelassene Entsprechung zwischen Vergehen und Strafe, ohne den Bezug näher festzulegen.
- source_word: ἐκολάσθησαν
  choice: wurden bestraft
  rationale: Entspricht dem hier naheliegenden vergeltenden Sinn; „gezüchtigt“ könnte unnötig einen erzieherischen Akzent setzen.
- source_word: ἀξίως
  choice: zu Recht
  rationale: Drückt idiomatisch aus, dass die Strafe angemessen beziehungsweise verdient war.
- source_word: πλήθους
  choice: eine Menge von
  rationale: Erhält den quantitativen Nachdruck des Substantivs stärker als das schlichte „viele“.
- source_word: κνωδάλων
  choice: Tieren
  rationale: Das Wort kann Tiere beziehungsweise Getier, besonders kleinere oder lästige Tiere, bezeichnen. „Tiere“ wahrt hier die Breite und vermeidet die nicht zwingende Einengung auf Kriechtiere oder Ungeziefer.
- source_word: ἐβασανίσθησαν
  choice: wurden gequält
  rationale: Gibt die starke Bedrängnis natürlich wieder, ohne den Ausdruck auf förmliche Folter einzuengen.
theological_decisions:
- issue: Vergeltende Entsprechung im göttlichen Gericht
  choice: Die Strafe erfolgt „durch Ähnliches“ und entspricht damit dem vorausgesetzten Vergehen, ohne dass die Art der Entsprechung im Vers ausgedeutet wird.
  alternative: „durch eben das, womit sie gesündigt hatten“
  rationale: Der griechische Wortlaut nennt hier nur die Ähnlichkeit beziehungsweise Entsprechung. Eine ausführlichere Deutung aus dem weiteren Kontext würde mehr sagen als dieser Vers.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Parallelismus; „durch Ähnliches“ wahrt dessen bewusste Offenheit.
