  source_fidelity: 'Der deutsche Text gibt die Satzlogik und die wesentlichen Bedeutungen des Griechischen zuverlässig wieder: διὰ τοῦτο als folgerndes „Darum“, διʼ ὁμοίων als bewusst offene Entsprechung „durch Ähnliches“, ἐκολάσθησαν ἀξίως als „wurden sie zu Recht ... bestraft“ und ἐβασανίσθησαν als „gequält“. Die zweimalige Verwendung von „durch“ spiegelt die parallele Konstruktion angemessen. „eine Menge von Tieren“ bewahrt die quantitative Aussage von πλήθους und legt κνωδάλων nicht unzulässig auf eine bestimmte Tiergruppe fest.'
