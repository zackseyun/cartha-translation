base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/019.yaml
  text: But at times[a], even in the midst of water, fire burns beyond its power[b], so that it may destroy the unrighteous produce of the earth.
translation:
  language: de
  text: Bisweilen aber lodert das Feuer sogar mitten im Wasser über seine gewöhnliche Kraft hinaus[a], um den ungerechten Ertrag der Erde zu vernichten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »über die Kraft des Feuers hinaus«; gemeint sein kann, dass das Feuer selbst im Wasser seine gewöhnliche Wirkkraft übersteigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das ungerechte Erzeugnis der Erde«. Gemeint ist wahrscheinlich der Ertrag der Erde in seiner Verbindung mit den Ungerechten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτὲ δὲ
  choice: Bisweilen aber
  rationale: Gibt sowohl den gelegentlichen Zeitpunkt als auch die kontrastive Weiterführung der Beispielreihe knapp und würdig wieder.
- source_word: μεταξὺ ὕδατος
  choice: mitten im Wasser
  rationale: Bewahrt das paradoxe Bild eines Feuers, das vom Wasser umgeben ist, in natürlichem modernem Deutsch.
- source_word: ὑπὲρ τὴν πυρὸς δύναμιν
  choice: über seine gewöhnliche Kraft hinaus
  rationale: Ὑπέρ mit Akkusativ bezeichnet ein Überschreiten. Das ergänzte »gewöhnliche« verdeutlicht, dass das Feuer seine normale Wirkkraft übersteigt, ohne eine größere Kraft als das Feuer selbst einzuführen.
- source_word: φλέγει
  choice: lodert das Feuer
  rationale: Das Verb bezeichnet brennendes oder loderndes Feuer; das im Kontext vorausgesetzte Subjekt wird im Deutschen ausdrücklich genannt.
- source_word: ἵνα
  choice: um ... zu
  rationale: Gibt den Zweck der ungewöhnlichen Feuerwirkung natürlich und präzise wieder.
- source_word: ἄδικον
  choice: ungerecht
  rationale: Bewahrt die unmittelbare moralische Kennzeichnung des Hervorgebrachten, ohne sie durch eine erklärende Besitzzuordnung aufzulösen.
- source_word: γῆς γέννημα
  choice: Ertrag der Erde
  rationale: Γέννημα bezeichnet das von der Erde Hervorgebrachte; »Ertrag« ist im landwirtschaftlichen Zusammenhang klar und idiomatisch.
- source_word: διαφθείρῃ
  choice: vernichten
  rationale: Entspricht hier dem Sinn vollständiger Zerstörung im Gerichtszusammenhang.
theological_decisions:
- issue: Moralische Bedeutung von ἄδικον bei γῆς γέννημα
  choice: den ungerechten Ertrag der Erde
  alternative: den Ertrag der Erde, der den Ungerechten gehörte
  rationale: Der griechische Text ordnet »ungerecht« unmittelbar dem »Ertrag« zu. Die Übersetzung bewahrt diese auffällige Spannung und erklärt sie nicht stillschweigend als bloßes Besitzverhältnis.
- issue: Zweck oder Folge bei ἵνα
  choice: um ... zu vernichten
  alternative: sodass es ... vernichtete
  rationale: Die übliche finale Bedeutung von ἵνα wird erhalten; damit erscheint die Zerstörung als Zweck der außergewöhnlichen Feuerwirkung, ohne den Handelnden eigens zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das paradoxe Bild wird anschaulich bewahrt; die ungewöhnliche moralische Kennzeichnung des Ertrags bleibt im Haupttext stehen und wird nur in der Fußnote erläutert.
