  text: But it is impossible to escape your hand[a].
translation:
  language: de
  text: Doch deiner Hand zu entkommen ist unmöglich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor deiner Hand zu fliehen“. Das Griechische bewahrt das konkrete Bild von Gottes Hand als Ausdruck seiner Macht und Reichweite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὴν ... σὴν χεῖρα
  choice: deiner Hand
  rationale: χείρ bezeichnet wörtlich die Hand und steht hier zugleich bildhaft für Gottes Macht und Reichweite. Die konkrete Metapher bleibt erhalten.
- source_word: φυγεῖν
  choice: zu entkommen
  rationale: φυγεῖν kann „fliehen“ bedeuten; mit dem Akkusativobjekt ist hier idiomatisch gemeint, jemandes Hand beziehungsweise Zugriff zu entkommen.
- source_word: ἀδύνατόν ἐστιν
  choice: ist unmöglich
  rationale: Die unpersönliche griechische Wendung wird knapp, genau und in natürlichem modernem Deutsch wiedergegeben.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier einen Gegensatz zum vorausgehenden Gedanken; „Doch“ gibt diese adversative Funktion würdig und natürlich wieder.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Wirken
  choice: „deiner Hand“ im Haupttext beibehalten
  alternative: „deiner Macht“ oder „deinem Zugriff“
  rationale: Der griechische Text verwendet das körperhafte Bild der Hand für Gottes wirksame Macht und unausweichliche Reichweite. Die Übersetzung bewahrt dieses Bild, statt es in eine abstrakte Aussage aufzulösen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die Voranstellung „Doch deiner Hand“ wahrt den Kontrast und hebt entsprechend der griechischen Wortstellung Gottes Hand hervor.
