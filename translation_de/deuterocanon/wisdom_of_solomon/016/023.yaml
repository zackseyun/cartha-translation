translation:
  language: de
  text: Dies aber vergaß wiederum, damit die Gerechten ernährt würden, sogar seine eigene Kraft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ seine eigene Kraft außer Acht“ beziehungsweise „verlor seine eigene Wirkung“. Der griechische Text personifiziert das angesprochene Element: Es „vergaß“ seine eigene Kraft.'
    reason: Lexikalische Alternative und Hinweis auf die Personifikation.
lexical_decisions:
- source_word: τοῦτο πάλιν δʼ
  choice: Dieses aber wiederum
  rationale: „Dieses“ bewahrt den rückverweisenden, sächlichen Demonstrativcharakter; „aber wiederum“ kennzeichnet die kontrastierende Wendung im Ablauf.
- source_word: ἵνα τραφῶσιν δίκαιοι
  choice: damit die Gerechten ernährt würden
  rationale: Die Formulierung gibt den Zwecksatz mit ἵνα und den passiven Sinn von τραφῶσιν wieder; δίκαιοι steht substantivisch.
- source_word: ἐπιλησθῇ
  choice: vergaß
  rationale: Das Verb bedeutet wörtlich „vergessen“ und erhält die bewusste Personifikation des angesprochenen Elements.
- source_word: τῆς ἰδίας ... δυνάμεως
  choice: sogar seine eigene Kraft
  rationale: „Seine eigene“ wahrt den reflexiven Nachdruck; „Kraft“ bezeichnet hier das dem Element eigene Wirkvermögen. „Sogar“ macht den im Zusammenhang naheliegenden verstärkenden Sinn natürlich verständlich.
theological_decisions:
- issue: Personifikation des geschaffenen Elements unter Gottes Vorsehung
  choice: 'Die Aussage bleibt personifiziert: Es „vergaß“ seine eigene Kraft.'
  alternative: Es verlor seine natürliche Wirkung / setzte seine eigene Kraft außer Wirkung.
  rationale: Der griechische Wortlaut spricht ausdrücklich vom Vergessen. Diese Bildsprache zeigt die Schöpfung als dem Zweck Gottes für die Gerechten entsprechend, ohne den Vorgang abstrakt zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Personifikation und der demonstrative Rückverweis des griechischen Textes bleiben erhalten; der Satzbau wurde nur so weit geglättet, dass der Zweckzusammenhang klar verständlich ist.
