  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/008.yaml
  text: And by this also you convinced our enemies that you are the one who rescues from every evil[a].
translation:
  language: de
  text: Auch dadurch hast du unsere Feinde überzeugt, dass du der bist, der aus allem Übel rettet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus jedem Schaden« oder »aus jeder Not«. Das griechische Wort kann allgemein Böses, Schaden oder Unglück bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: dadurch
  rationale: Die Verbindung mit ἐν und dem Demonstrativ ist hier am natürlichsten instrumental zu verstehen und verweist auf das zuvor geschilderte Geschehen als Mittel der Überzeugung.
- source_word: ἔπεισας
  choice: hast du ... überzeugt
  rationale: Die Wiedergabe bewahrt den direkten Sinn von πείθω und passt zur folgenden ὅτι-Aussage, die den Inhalt der gewonnenen Überzeugung nennt.
- source_word: τοὺς ἐχθροὺς ἡμῶν
  choice: unsere Feinde
  rationale: Dies gibt das Akkusativobjekt samt gemeinschaftlicher Perspektive schlicht und idiomatisch wieder.
- source_word: ὅτι σὺ εἶ
  choice: dass du es bist
  rationale: Die Konstruktion mit „es“ bringt die Betonung des ausdrücklich gesetzten Pronomens σὺ im Deutschen natürlich zum Ausdruck.
- source_word: ὁ ῥυόμενος
  choice: der ... rettet
  rationale: Das substantivierte Präsenspartizip bezeichnet Gottes kennzeichnendes, fortdauerndes Handeln; ein Relativsatz klingt im modernen Deutschen natürlich.
- source_word: ἐκ παντὸς κακοῦ
  choice: aus allem Übel
  rationale: „Übel“ bewahrt die breite Bedeutung von κακόν, die Böses, Schaden und Not umfassen kann; „aus“ entspricht zudem der räumlich gefärbten Rettungskonstruktion mit ἐκ.
theological_decisions:
- issue: Bedeutungsumfang von κακοῦ
  choice: aus allem Übel
  alternative: vor jedem Schaden / aus jeder Not
  rationale: Die gewählte Formulierung hält die Aussage bewusst weit und beschränkt Gottes Rettung weder auf moralisch Böses noch allein auf körperlichen Schaden oder Bedrängnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auch dadurch“ stellt den rückbezüglichen und instrumentalen Zusammenhang knapp her; „dass du es bist“ bewahrt die Betonung des griechischen σὺ.
