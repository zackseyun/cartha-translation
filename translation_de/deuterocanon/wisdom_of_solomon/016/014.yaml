base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/014.yaml
  text: But a man kills by his own wickedness[a], and when a spirit has gone out, he does not bring it back, nor does he release a soul that has been taken.
translation:
  language: de
  text: Ein Mensch tötet zwar durch seine Bosheit, aber wenn der Geist entwichen ist, bringt er ihn nicht zurück und gibt eine Seele, die fortgenommen worden ist, nicht frei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aber wenn der Atem entwichen ist, bringt er ihn nicht zurück und gibt ein Leben, das fortgenommen worden ist, nicht frei.“ Die griechischen Wörter für „Geist“ und „Seele“ können je nach Zusammenhang auch „Atem“ und „Leben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: Der generische Singular bezeichnet einen Menschen im Gegensatz zu Gottes Macht; „ein Mensch“ ist im Deutschen natürlich und geschlechtsübergreifend verständlich.
- source_word: ἀποκτέννει μὲν τῇ κακίᾳ αὐτοῦ
  choice: kann durch seine Bosheit töten
  rationale: ἀποκτείνω bedeutet hier schlicht „töten“, κακία moralische Bosheit. Das im Zusammenhang erkennbare menschliche Vermögen wird mit „kann“ ausgedrückt und bildet den Gegensatz zum folgenden Unvermögen.
- source_word: ἐξελθὸν ... πνεῦμα
  choice: wenn der Geist entwichen ist
  rationale: πνεῦμα kann „Geist“ oder „Atem“ bedeuten. „Geist“ bewahrt die anthropologische Weite; „entwichen“ gibt das Herausgehen im Todeszusammenhang würdig und natürlich wieder.
- source_word: οὐκ ἀναστρέφει
  choice: kann er ihn nicht zurückbringen
  rationale: Das implizite Objekt ist der zuvor genannte Geist. „Zurückbringen“ erhält das konkrete Bild einer nicht rückgängig zu machenden Trennung.
- source_word: οὐδὲ ἀναλύει
  choice: und ... nicht wieder freigeben
  rationale: ἀναλύω hat hier den Sinn „lösen, freigeben“. „Wieder“ verdeutlicht idiomatisch die versuchte Umkehrung des Todes, ohne eine Auferstehungslehre in den Wortlaut einzutragen.
- source_word: ψυχὴν παραλημφθεῖσαν
  choice: eine fortgenommene Seele
  rationale: ψυχή kann „Seele“ oder „Leben“ heißen; παραλαμβάνω bezeichnet hier das Fortnehmen. Die Hauptfassung hält die beiden griechischen anthropologischen Begriffe auseinander.
theological_decisions:
- issue: πνεῦμα und ψυχή im Todeszusammenhang
  choice: „Geist“ und „Seele“ im Haupttext
  alternative: „Atem“ und „Leben“
  rationale: Die beiden griechischen Wörter besitzen überlappende Bedeutungsfelder. Ihre Unterscheidung bleibt im Haupttext sichtbar, während die Fußnote verhindert, dass eine schärfere metaphysische Trennung eingelesen wird, als der griechische Wortlaut verlangt.
- issue: Menschliche Fähigkeit und Grenze
  choice: Der Mensch kann töten, aber den Tod nicht rückgängig machen
  alternative: Die Verben ohne modales „kann“ rein indikativisch wiedergeben
  rationale: Der Kontext stellt menschliches Vermögen Gottes Macht gegenüber. Die modale Wiedergabe macht diesen im Griechischen pragmatisch enthaltenen Gegensatz in natürlichem Deutsch deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt den Gegensatz zwischen menschlicher Fähigkeit zu töten und menschlicher Unfähigkeit, den Tod umzukehren. Der Fußnotenmarker steht nach dem vollständigen Vers.
