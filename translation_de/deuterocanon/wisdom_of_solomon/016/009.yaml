base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/009.yaml
  text: For those whom the bites of locusts and flies killed, no healing was found for their life, because they were worthy to be punished by such things;
translation:
  language: de
  text: Denn diejenigen, die durch die Bisse von Heuschrecken und Fliegen getötet wurden, fanden kein Heilmittel für ihr Leben[a], weil sie es verdient hatten, durch dergleichen bestraft zu werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für ihre Seele“. In diesem Zusammenhang bezeichnet das griechische Wort wahrscheinlich ihr Leben, da es um den Tod durch die Bisse und ein fehlendes Heilmittel geht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch solche Geschöpfe“. Das Griechische sagt allgemeiner: „durch dergleichen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήγματα
  choice: Bisse
  rationale: Das Wort bezeichnet Bisse oder Stiche von Tieren. „Bisse“ ist hier eine klare, nicht unnötig spezifizierende Wiedergabe.
- source_word: ἀκρίδων
  choice: Heuschrecken
  rationale: ἀκρίς bezeichnet gewöhnlich eine Heuschrecke; im Plagenkontext ist dies die naheliegende biblische Wiedergabe.
- source_word: μυιῶν
  choice: Fliegen
  rationale: Dies entspricht der gewöhnlichen Bedeutung, ohne die Insektenart unbegründet näher zu bestimmen.
- source_word: ἀπέκτεινεν
  choice: getötet wurden
  rationale: Die deutsche Passivkonstruktion gibt idiomatisch wieder, dass die Bisse den Tod verursachten, und bewahrt das Objekt des griechischen Verbs als betroffene Personengruppe.
- source_word: οὐχ εὑρέθη ἴαμα
  choice: fanden kein Heilmittel
  rationale: „Heilmittel“ bewahrt den medizinischen Sinn von ἴαμα. Die Umformung zum aktiven deutschen Satz vermeidet eine schwerfällige Konstruktion, ohne die Aussage zu verändern.
- source_word: τῇ ψυχῇ αὐτῶν
  choice: für ihr Leben
  rationale: Im unmittelbaren Zusammenhang von tödlichen Bissen und fehlender Heilung bezeichnet ψυχή am ehesten das Leben. Eine Fußnote erhält die wörtlichere Alternative „Seele“.
- source_word: ἄξιοι ἦσαν
  choice: sie es verdient hatten
  rationale: Die idiomatische deutsche Wendung bringt die im Griechischen ausgesagte Angemessenheit beziehungsweise Schuldwürdigkeit klar zum Ausdruck.
- source_word: ὑπὸ τοιούτων
  choice: durch dergleichen
  rationale: „Dergleichen“ wahrt die absichtlich breite Formulierung des Griechischen, ohne den Bezug ausdrücklich auf Geschöpfe oder Mittel festzulegen.
- source_word: κολασθῆναι
  choice: bestraft zu werden
  rationale: Das Verb bezeichnet hier eine strafende Ahndung; „bestraft“ ist direkt, verständlich und theologisch nicht überbestimmt.
theological_decisions:
- issue: Bedeutung von ψυχή im Zusammenhang von Tod und Heilung
  choice: Leben
  alternative: Seele
  rationale: Der Vers handelt vom körperlichen Tod durch Insektenbisse und vom fehlenden Heilmittel. „Leben“ entspricht daher dem Kontext, während die Fußnote die lexikalische und theologische Mehrdeutigkeit sichtbar hält.
- issue: Moralische Aussage von ἄξιοι ἦσαν ... κολασθῆναι
  choice: weil sie es verdient hatten, ... bestraft zu werden
  alternative: weil sie würdig waren, ... bestraft zu werden
  rationale: Die gewählte Formulierung bewahrt die ausdrückliche Aussage verdienten Gerichts und klingt zugleich in modernem Deutsch natürlich, ohne den Gedanken über den Vers hinaus auszuweiten.
- issue: Bezug von ὑπὸ τοιούτων
  choice: durch dergleichen
  alternative: durch solche Geschöpfe
  rationale: Das griechische τοιούτων ist grammatisch breit. Die Übersetzung legt nicht fest, ob vor allem die Tiere oder allgemeiner derartige Mittel der Strafe gemeint sind.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur wurde für natürliches Deutsch leicht umgeformt; die breite Ausdrucksweise des Griechischen und die Mehrdeutigkeit von ψυχή bleiben durch Text und Fußnoten erhalten.
