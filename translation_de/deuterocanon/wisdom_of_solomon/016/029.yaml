base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/029.yaml
  text: For the hope of the ungrateful will melt like wintry frost[c][b][a], and will run off like useless water.
translation:
  language: de
  text: Denn die Hoffnung des Undankbaren[a] wird wie winterlicher Reif schmelzen und wie unbrauchbares Wasser abfließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Danklosen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀχάριστου
  choice: des Undankbaren
  rationale: Das substantivierte Adjektiv im Genitiv Singular bezeichnet einen undankbaren Menschen. Die Formulierung bewahrt die ethische Aussage und klingt im modernen Standarddeutsch natürlich.
- source_word: ἐλπὶς
  choice: Hoffnung
  rationale: Die Grundbedeutung passt zum weisheitlichen Bild einer Erwartung, die keinen Bestand hat.
- source_word: χειμέριος πάχνη
  choice: winterlicher Reif
  rationale: πάχνη bezeichnet Reif beziehungsweise Frost; »Reif« gibt das sichtbare, leicht schmelzende Winterphänomen prägnant wieder. χειμέριος wird attributiv mit »winterlich« wiedergegeben.
- source_word: τακήσεται
  choice: wird … schmelzen
  rationale: Die Futurform bezeichnet hier das Dahinschmelzen; das deutsche intransitive Verb ist idiomatisch und erhält das Bild.
- source_word: ῥυήσεται
  choice: wird … abfließen
  rationale: Das Verb beschreibt ein Weg- oder Dahinfließen. »Abfließen« verbindet sich natürlich mit Wasser und betont, dass nichts Nutzbares zurückbleibt.
- source_word: ὕδωρ ἄχρηστον
  choice: unbrauchbares Wasser
  rationale: ἄχρηστον bedeutet nicht brauchbar oder zu nichts nütze. »Unbrauchbar« ist quellennah, verständlich und weniger pauschal wertend als »wertlos«.
theological_decisions:
- issue: Moralische Kennzeichnung durch ἀχάριστου
  choice: des Undankbaren
  alternative: des Un dankbaren / des Danklosen
  rationale: »Undankbar« wahrt den moralischen Sinn, ohne näher festzulegen, wem gegenüber der Mensch undankbar ist. »Danklos« wäre möglich, kann im Deutschen aber auch eine erfolglose oder nicht gewürdigte Tätigkeit bezeichnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die griechische Bildsprache. Der parallele Satzbau mit zweimaligem »wie« und den beiden Zukunftsformen bleibt erhalten.
