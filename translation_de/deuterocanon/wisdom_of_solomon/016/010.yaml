base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/010.yaml
  text: But the teeth of venomous serpents did not overcome your sons[a], for your mercy came to their aid and healed them.
translation:
  language: de
  text: Doch selbst die Zähne giftiger Schlangen überwältigten deine Söhne[a] nicht; denn dein Erbarmen kam ihnen zu Hilfe und heilte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Kinder“. Im Griechischen steht ausdrücklich „Söhne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱούς
  choice: Söhne
  rationale: Der griechische Ausdruck ist ausdrücklich maskuliner Plural. Im Zusammenhang bezeichnet er Gottes Volk, die Israeliten; „Söhne“ bewahrt die konkrete Formulierung des Ausgangstextes.
- source_word: ἰοβόλων
  choice: giftiger
  rationale: Das Kompositum bezeichnet Wesen, die Gift abgeben oder schleudern. Bei beißenden Schlangen gibt „giftig“ den Sinn im heutigen Deutsch natürlich wieder.
- source_word: δρακόντων
  choice: Schlangen
  rationale: Im Zusammenhang der giftigen Bisse während der Wüstenwanderung sind Schlangen gemeint. „Drachen“ würde heutige Leser irreführen.
- source_word: ἐνίκησαν
  choice: überwältigten … nicht
  rationale: Das Verb bedeutet „besiegen“, „überwinden“ oder „die Oberhand gewinnen“. „Nicht überwältigten“ bewahrt das Bild, dass die Bisse letztlich keine Gewalt über sie behielten.
- source_word: ὀδόντες
  choice: Zähne
  rationale: 'Die konkrete Metonymie des griechischen Textes wird beibehalten: Die Zähne stehen für den giftigen Biss der Schlangen.'
- source_word: ἀντιπαρῆλθεν
  choice: kam ihnen zu Hilfe
  rationale: Das seltene Verb beschreibt hier, wie Gottes Erbarmen der Gefahr entgegentritt und helfend eingreift. Die idiomatische Wendung gibt diese rettende Bewegung wieder, ohne die ungewöhnliche Form überzuinterpretieren.
- source_word: ἰάσατο
  choice: heilte
  rationale: Dies ist die direkte und natürliche Wiedergabe des üblichen griechischen Verbs für Heilen.
theological_decisions:
- issue: Bezug von „deine Söhne“
  choice: Die an Gott gerichtete Bezeichnung Israels als „deine Söhne“ wird beibehalten.
  alternative: „deine Kinder“
  rationale: Der Vers erinnert an Israel in der Wüste. „Söhne“ wahrt die ausdrücklich maskuline Form des Griechischen und die Bundesanrede, ohne daraus weitergehende dogmatische Aussagen abzuleiten.
- issue: Handeln des göttlichen Erbarmens
  choice: „dein Erbarmen kam ihnen zu Hilfe“
  alternative: „dein Erbarmen trat ihnen zur Seite“
  rationale: Das Erbarmen wird wie im Griechischen als handelnd dargestellt. Die Formulierung bewahrt Gottes rettendes Eingreifen, legt aber den seltenen Ausdruck ἀντιπαρῆλθεν nicht unnötig eng aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache von den Zähnen bleibt erhalten; „giftige Schlangen“ vermeidet das im heutigen Deutsch irreführende „Drachen“. Das vorangestellte „selbst“ bildet die steigernde Kraft von οὐδέ ab.
