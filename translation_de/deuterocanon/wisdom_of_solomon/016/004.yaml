base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/004.yaml
  text: For it was necessary that unavoidable want should come upon those who tyrannized[b][a], but to these only that it should be shown how their enemies were being tormented.
translation:
  language: de
  text: Denn über die, die tyrannisch herrschten[a], musste unausweichlicher Mangel[b] kommen; diesen dagegen sollte nur gezeigt werden, wie ihre Feinde gequält wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Tyrannen“. Die griechische Form hebt ihr tyrannisches Handeln hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unabwendbare Entbehrung“. Gemeint ist ein Mangel, dem man nicht entgehen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: musste
  rationale: Das unpersönliche ἔδει bezeichnet eine Notwendigkeit. „Musste“ gibt diese knapp und natürlich wieder, ohne sie ausdrücklich als moralische Angemessenheit auszudeuten.
- source_word: ἀπαραίτητον ἔνδειαν
  choice: unabwendbare Not
  rationale: ἀπαραίτητος bezeichnet etwas, das sich nicht abwenden oder vermeiden lässt; ἔνδεια meint einen schweren Mangel beziehungsweise eine Entbehrung. „Unabwendbare Not“ verbindet beides in natürlichem, würdigem Deutsch.
- source_word: ἐπελθεῖν
  choice: über … kommen
  rationale: Die Wendung bewahrt das Bild eines Leidens, das die Betroffenen trifft, und fügt sich idiomatisch in die Konstruktion mit „musste“ ein.
- source_word: τυραννοῦσιν
  choice: die, die tyrannisch herrschten
  rationale: 'Die verbale Kraft der griechischen Form bleibt erhalten: Hervorgehoben wird ihr tyrannisches Handeln, nicht nur eine feste Gruppenbezeichnung.'
- source_word: τούτοις δὲ μόνον
  choice: diesen dagegen … nur
  rationale: „Dagegen“ markiert den Gegensatz der beiden Gruppen, während „nur“ die Einschränkung durch μόνον bewahrt. Das deiktische „diesen“ wird nicht erklärend durch eine ausdrücklich benannte Gruppe ersetzt.
- source_word: δειχθῆναι
  choice: sollte … gezeigt werden
  rationale: 'Die passive Form bleibt gewahrt: Diesen widerfährt die Qual nicht selbst, sondern sie wird ihnen vor Augen geführt.'
- source_word: πῶς
  choice: wie
  rationale: „Wie“ lässt offen, ob vor allem die Art und Weise oder allgemeiner die Tatsache des Leidens im Blick steht.
- source_word: ἐβασανίζοντο
  choice: gequält wurden
  rationale: Die Form bezeichnet starkes, schmerzhaftes Leiden. „Gequält“ bewahrt die Intensität, ohne das Geschehen unnötig auf gerichtliche Folter einzuengen.
theological_decisions:
- issue: Unterschiedliche Erfahrung des Gerichts durch die Unterdrücker und durch Gottes Volk
  choice: Die tyrannisch Handelnden werden selbst von unabwendbarer Not getroffen; den anderen wird lediglich gezeigt, wie ihre Feinde gequält werden.
  alternative: „Diese mussten nur mit ansehen, wie ihre Feinde bestraft wurden.“
  rationale: 'Der Gegensatz sowie das passive δειχθῆναι stellen die ungleiche Erfahrung heraus: Die einen erleiden die Not unmittelbar, die anderen empfangen nur eine Anschauung davon. Die Übersetzung bewahrt diese Spannung, ohne sie lehrhaft auszubauen.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Satzbau folgt dem griechischen Gegensatz, bleibt aber idiomatisch. Die deiktischen Bezeichnungen der Gruppen werden nicht durch kontextuelle Erläuterungen im Vers ersetzt.
