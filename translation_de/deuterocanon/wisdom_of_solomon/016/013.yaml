base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/013.yaml
  text: For you have authority over life and death[b][a], and you bring down to the gates of Hades and bring up.
translation:
  language: de
  text: Denn du hast Macht über Leben und Tod, und du führst hinab zu den Toren des Hades[a] und führst hinauf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Totenreichs“. Das griechische Wort lautet „Hades“ und bezeichnet den Bereich der Toten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „führst herauf“. Das griechische Wort bedeutet schlicht „hinaufführen“ und steht als Gegenstück zu „hinabführen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: Macht
  rationale: „Macht“ bezeichnet hier Gottes souveräne Verfügungsgewalt über Leben und Tod. „Vollmacht“ könnte im Deutschen zu stark an übertragene oder verliehene Befugnis denken lassen.
- source_word: ζωῆς καὶ θανάτου
  choice: über Leben und Tod
  rationale: Die Genitivverbindung mit ἐξουσίαν ἔχεις wird im Deutschen idiomatisch mit „Macht über“ wiedergegeben; der klare Gegensatz bleibt unverändert.
- source_word: κατάγεις
  choice: führst hinab
  rationale: Die Wiedergabe bewahrt die räumliche Abwärtsbewegung und bildet einen direkten Gegenpol zu ἀνάγεις.
- source_word: πύλας ᾅδου
  choice: die Tore des Hades
  rationale: „Hades“ erhält die ausdrückliche griechische Bezeichnung für den Bereich der Toten; „Tore“ bewahrt das konkrete Bild des Ausgangstextes.
- source_word: ἀνάγεις
  choice: führst hinauf
  rationale: Die schlichte Wiedergabe wahrt den Gegensatz zu „führst hinab“, ohne durch „auferweckst“ eine technischere Auferstehungsaussage einzutragen oder durch „wieder“ den Wortlaut zu erweitern.
theological_decisions:
- issue: Wiedergabe von ᾅδου
  choice: Hades
  alternative: Totenreich oder Grab
  rationale: Der griechische Text nennt ausdrücklich den Hades als Bereich der Toten. Die Transliteration bewahrt diesen Begriff und vermeidet eine Verengung auf ein einzelnes Grab.
- issue: Aussagekraft von ἀνάγεις im Zusammenhang mit dem Tod
  choice: führst hinauf
  alternative: erweckst auf oder führst wieder herauf
  rationale: Das Verb bezeichnet zunächst die gegenläufige Aufwärtsbewegung zu κατάγεις. Die gewählte Form bewahrt die mögliche weitergehende theologische Bedeutung, legt den Ausdruck aber nicht vorschnell auf eine technische Auferstehungsaussage fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. Die knappe Wiederholung von „führst“ bildet den griechischen Gegensatz nach; das im zweiten Satzglied unausgesprochene Objekt bleibt auch in der Übersetzung offen.
