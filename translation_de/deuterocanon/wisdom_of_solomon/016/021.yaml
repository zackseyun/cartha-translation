base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/021.yaml
  text: For your substance displayed your sweetness toward your children[a]; and, serving the desire of the one who partook of it[b], it changed into whatever each one wished.
translation:
  language: de
  text: Denn dein Wesen[a] offenbarte deinen Kindern deine Süße; die Speise aber diente dem Verlangen dessen, der sie empfing, und verwandelte sich in das, was jeder wünschte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Substanz“. Das griechische Wort kann „Substanz“, „Wesen“ oder „grundlegende Wirklichkeit“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist, dass sich die Speise dem Geschmack beziehungsweise Wunsch jedes Einzelnen anpasste.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπόστασίς
  choice: Substanz
  rationale: „Substanz“ bewahrt den zugleich konkreten und begrifflich offenen Sinn des griechischen Wortes. Im Zusammenhang bezeichnet es wahrscheinlich die Beschaffenheit der von Gott gegebenen Speise, ohne die mögliche Bedeutung „Wesen“ auszuschließen.
- source_word: γλυκύτητα
  choice: Süße
  rationale: Das Wort bezeichnet sowohl geschmackliche Süße als auch wohltuende Güte; „Süße“ erhält im Zusammenhang mit der Speise dieses Wortspiel.
- source_word: τέκνα
  choice: Kinder
  rationale: Der Ausdruck schließt hier Gottes ganzes Volk ein und ist nicht auf männliche Nachkommen beschränkt.
- source_word: τοῦ προσφερομένου
  choice: dessen, der davon aß
  rationale: Das substantivierte Partizip bezeichnet im Speisekontext denjenigen, der die Gabe zu sich nahm. Die Wiedergabe ist im Deutschen verständlicher als das wörtlichere „dessen, dem sie dargeboten wurde“.
- source_word: ἐπιθυμίᾳ
  choice: Verlangen
  rationale: „Verlangen“ gibt den Wunsch beziehungsweise die individuelle geschmackliche Neigung wieder, auf welche die Speise eingeht.
- source_word: ὑπηρετῶν
  choice: indem sie … diente
  rationale: Die partizipiale Form beschreibt, wie sich die Speise dem Verlangen des Essenden dienstbar anpasste.
- source_word: μετεκιρνᾶτο
  choice: verwandelte sie sich
  rationale: Das Verb bezeichnet eine Veränderung der Mischung oder Beschaffenheit; die reflexive Formulierung gibt die dargestellte Anpassung der Speise natürlich wieder.
- source_word: πρὸς ὃ τις ἐβούλετο
  choice: in das, was jeder begehrte
  rationale: 'Die Formulierung wahrt den distributiven Sinn: Die Speise passte sich dem jeweiligen Wunsch jedes Einzelnen an.'
theological_decisions:
- issue: Bezug von „deine Substanz“
  choice: Die Wendung wird vorrangig auf die von Gott gegebene Speise und deren Beschaffenheit bezogen.
  alternative: „Dein Wesen“ könnte unmittelbarer Gottes gütige Natur bezeichnen.
  rationale: Der unmittelbare Zusammenhang handelt von der wundersamen Speise und ihrer Anpassungsfähigkeit. „Substanz“ hält jedoch die sprachliche Offenheit aufrecht und lässt erkennen, dass sich in der Gabe Gottes eigene Süße zeigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst ungewöhnliche Wendung „deine Substanz“ erhält die Mehrdeutigkeit des griechischen ὑπόστασις; die Fußnote bietet die wichtigste Alternative. „Süße“ wahrt sowohl den Geschmackssinn als auch den Hinweis auf Gottes Güte.
