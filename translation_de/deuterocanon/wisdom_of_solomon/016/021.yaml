revisions:
- from: Denn deine Substanz offenbarte deinen Kindern deine Süße[a]; und indem sie dem Verlangen dessen diente, der davon aß, verwandelte sie sich in das, was jeder begehrte.[b]
  to: Denn dein Wesen[a] offenbarte deinen Kindern deine Süße; die Speise aber diente dem Verlangen dessen, der sie empfing, und verwandelte sich in das, was jeder wünschte.[b]
  rationale: Die Revision macht den im griechischen Satzbau vorausgesetzten Bezug auf die Speise im Deutschen ausdrücklich und ersetzt die missverständliche Rückverweisung auf „Substanz“. Zugleich wird „Wesen“ als idiomatische Hauptwiedergabe von ὑπόστασις gewählt; die Fußnote erhält die lexikalische und interpretative Offenheit. Die Empfängerrolle bei τοῦ προσφερομένου wird mit „der sie empfing“ präziser wiedergegeben als mit „der davon aß“.
