review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ὑπόστασις als „Wesen“ ist im Deutschen die natürlichere und im Zusammenhang gut mögliche Wiedergabe; die lexikalische Spannweite bleibt in der Fußnote sichtbar. Der zweite Satz des Entwurfs bindet das feminine „sie“ jedoch grammatisch an „Substanz“, während das griechische Partizip ὑπηρετῶν nicht auf ὑπόστασις (feminin) zurückgehen kann. Der Bezug auf die zuvor genannte Speise sollte daher im Deutschen ausdrücklich gemacht werden. „Empfing“ gibt τοῦ προσφερομένου als kontextuell erschlossenen Empfänger angemessener wieder als die enger auslegende Formulierung „der davon aß“.
  naturalness: „Dein Wesen offenbarte deinen Kindern deine Süße“ ist würdig und modernes Standarddeutsch. Die ausdrückliche Nennung „die Speise aber“ beseitigt einen missverständlichen und syntaktisch unhaltbaren Bezug, ohne den knappen Stil unnötig zu belasten.
  terminology: „Wesen“, „Süße“, „Kinder“, „Verlangen“ und „Speise“ sind registergerecht. Die Fußnote zu „Wesen“ bewahrt mit „Substanz“ und „grundlegende Wirklichkeit“ die relevante Mehrdeutigkeit von ὑπόστασις, ohne spätere dogmatische Festlegung zu erzeugen.
  issues:
