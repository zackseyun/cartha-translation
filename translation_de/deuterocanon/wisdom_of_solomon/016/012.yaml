base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/012.yaml
  text: For neither herb nor poultice healed them[a], but your word, O Lord[b], heals all things.
translation:
  language: de
  text: Denn weder ein Heilkraut noch ein Umschlag machte sie gesund, sondern dein Wort, Herr, das alles heilt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βοτάνη
  choice: Heilkraut
  rationale: Im Zusammenhang mit Heilung bezeichnet das Wort hier wahrscheinlich eine als Heilmittel verwendete Pflanze; „Heilkraut“ ist im Deutschen präziser als das allgemeinere „Pflanze“.
- source_word: μάλαγμα
  choice: Umschlag
  rationale: Das Substantiv bezeichnet eine weichmachende beziehungsweise heilende äußerliche Anwendung. „Umschlag“ gibt diese konkrete Behandlungsform natürlich wieder, ohne sie auf Salbe einzuengen.
- source_word: ἐθεράπευσεν
  choice: machte sie gesund
  rationale: Der Aorist bezeichnet die tatsächlich bewirkte Genesung, nicht bloß eine Behandlung. Die Wendung unterscheidet im Deutschen außerdem klar vom folgenden Präsens „heilt“.
- source_word: λόγος
  choice: Wort
  rationale: „Wort“ bewahrt sowohl den unmittelbaren Sinn einer wirksamen Äußerung Gottes als auch die theologische Resonanz, ohne eine spätere technische Bedeutung festzulegen.
- source_word: πάντα ἰώμενος
  choice: das alles heilt
  rationale: Der attributive Präsenspartizip beschreibt Gottes Wort als umfassend heilend. Der Relativsatz ist natürliches Deutsch und bewahrt die weite Aussage von πάντα.
- source_word: Κύριε
  choice: Herr
  rationale: Die übliche, würdevolle Wiedergabe der direkten Anrede κύριε.
theological_decisions:
- issue: Gegensatz zwischen menschlichen Heilmitteln und Gottes Wirken
  choice: Der Vers sagt, dass in diesem Fall weder Heilkraut noch Umschlag die Betroffenen gesund machte, sondern Gottes Wort.
  alternative: Eine grundsätzliche Verwerfung aller medizinischen Mittel.
  rationale: Der griechische Text formuliert einen konkreten Gegensatz, aber keine allgemeine Lehre gegen den Gebrauch von Medizin.
- issue: Bezug und Funktion von ὁ πάντα ἰώμενος
  choice: 'Als Relativsatz auf „dein Wort“ bezogen: „das alles heilt“.'
  alternative: 'Als selbstständiges Prädikat: „dein Wort, Herr, heilt alles“.'
  rationale: Artikel und Partizip bilden im Griechischen eine attributive Fügung. Der deutsche Relativsatz bildet diese Struktur ab und bewahrt den beschreibenden Charakter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Heilkraut“ und „Umschlag“ sind allgemein verständlich und halten den konkreten medizinischen Gegensatz fest; die Satzform bleibt nahe an der griechischen Struktur.
