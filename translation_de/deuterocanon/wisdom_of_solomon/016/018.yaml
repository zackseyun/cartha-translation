    issue: Tempus/Aspekt von ἐλαύνονται
    rationale: ἐλαύνονται ist Präsens Passiv und bezeichnet im Zweckzusammenhang ein andauerndes Getriebenwerden. „dass sie ... getrieben wurden“ verlegt dies ohne Grundlage in die Vergangenheit. „dass sie durch Gottes Gericht getrieben werden“ bewahrt Passiv, Instrumentalangabe und Aspekt.
