revisions:
- from: Denn einmal wurde die Flamme gebändigt[a], damit sie die gegen die Gottlosen gesandten Tiere nicht verbrenne, sondern damit die Gottlosen selbst beim Anblick erkennen, dass sie durch Gottes Gericht getrieben wurden.[b]
  to: Denn einmal wurde die Flamme gebändigt[a], damit sie die gegen die Gottlosen gesandten Tiere nicht verbrenne, sondern damit die Gottlosen selbst beim Anblick erkennen, dass sie durch Gottes Gericht getrieben werden.[b]
  rationale: Die einzige notwendige Änderung betrifft „wurden“ zu „werden“. Damit wird das griechische Präsenspassiv ἐλαύνονται korrekt als fortdauerndes Handeln wiedergegeben, ohne die semantische Offenheit von ἐλαύνω oder die instrumentale Formulierung θεοῦ κρίσει einzuengen. Die zugehörige Fußnotenalternative wurde grammatisch parallel angepasst.
