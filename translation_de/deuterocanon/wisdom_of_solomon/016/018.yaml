base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/018.yaml
  text: For at one time the flame was subdued[a], so that it might not burn up the creatures sent against the ungodly; but they themselves, seeing it[c][b], might know that they were being pursued by the judgment of God.
translation:
  language: de
  text: Denn einmal wurde die Flamme gebändigt[a], damit sie die gegen die Gottlosen gesandten Tiere nicht verbrenne, sondern damit die Gottlosen selbst beim Anblick erkennen, dass sie durch Gottes Gericht getrieben werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „gezähmt“ oder „sanft gemacht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „vorangetrieben“ oder „verfolgt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεροῦτο
  choice: wurde gebändigt
  rationale: Das Imperfekt von ἡμερόω bezeichnet ein Zähmen oder Sanftmachen. „Gebändigt“ ist bei einer Flamme natürlich, anschaulich und besagt nicht, dass sie erlosch.
- source_word: φλόξ
  choice: die Flamme
  rationale: φλόξ bezeichnet spezifisch eine Flamme und nicht Feuer im Allgemeinen.
- source_word: καταφλέξῃ
  choice: verbrenne
  rationale: Das Kompositum bezeichnet zerstörendes Verbrennen. Im Deutschen gibt „verbrennen“ in diesem Satz den vollständigen Verbrauch natürlich wieder.
- source_word: τὰ ἐπʼ ἀσεβεῖς ἀπεσταλμένα ζῷα
  choice: die gegen die Gottlosen gesandten Tiere
  rationale: ζῷα meint im Zusammenhang der Plagen Tiere beziehungsweise lebende Geschöpfe; ἐπί mit dem Akkusativ drückt hier ihre feindliche Ausrichtung gegen die Gottlosen aus.
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: „Gottlos“ bewahrt den religiös-moralischen Gehalt von ἀσεβής besser als das allgemeinere „böse“.
- source_word: βλέποντες
  choice: beim Anblick
  rationale: Das Partizip nennt keinen ausdrücklichen Gegenstand des Sehens. „Beim Anblick“ bewahrt diese Offenheit und vermeidet, im Haupttext stillschweigend die Flamme oder die Tiere als Objekt festzulegen.
- source_word: εἴδωσιν
  choice: erkennen
  rationale: Der Aorist Konjunktiv von οἶδα bezeichnet hier die aus dem Sehen erwachsende Einsicht; „erkennen“ verbindet Wahrnehmung und Verständnis.
- source_word: θεοῦ κρίσει
  choice: durch Gottes Gericht
  rationale: κρίσις bezeichnet hier Gottes richterliches Handeln. Die Formulierung wahrt das deutliche Gerichtsmotiv.
- source_word: ἐλαύνονται
  choice: getrieben wurden
  rationale: Das Passiv von ἐλαύνω kann ein Treiben, Vorantreiben oder Verfolgen bezeichnen. „Getrieben“ erhält diese Bedeutungsbreite, ohne eine bestimmte Bewegungsrichtung hinzuzufügen.
theological_decisions:
- issue: Göttliches Handeln im Plagengeschehen
  choice: „durch Gottes Gericht getrieben“
  alternative: „von Gottes Gericht verfolgt“ oder eine bloß vorsehungsbezogene Umschreibung
  rationale: θεοῦ κρίσει stellt das Geschehen ausdrücklich als richterliches Handeln Gottes dar. „Getrieben“ bewahrt zugleich die lexikalische Offenheit von ἐλαύνονται und führt keine weitergehende Lehre über die Art göttlicher Verursachung ein.
- issue: Ungenanntes Objekt von βλέποντες
  choice: „beim Anblick“ ohne ergänztes Objekt
  alternative: „als sie es sahen“ mit Bezug auf die gebändigte Flamme oder „als sie die Tiere sahen“
  rationale: Im Griechischen steht beim Partizip kein ausdrückliches Objekt. Die Übersetzung lässt offen, ob vor allem die Flamme, die Tiere oder das ganze Geschehen im Blick ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Zwecksatz bleibt erkennbar, wird aber durch die wiederholte Verbindung „damit“ klar gegliedert. „Die Gottlosen selbst“ beseitigt im Deutschen einen möglichen falschen Rückbezug des Pronomens auf die unmittelbar zuvor genannten Tiere.
