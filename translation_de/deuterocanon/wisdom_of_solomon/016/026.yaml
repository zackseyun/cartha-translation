  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes a man[b], but your word preserves those who trust in you.
translation:
  language: de
  text: damit deine Söhne, die du geliebt hast, Herr, lernen, dass nicht der Ertrag der Feldfrüchte den Menschen ernährt, sondern dein Wort die bewahrt, die dir vertrauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die dir glauben“. Das griechische Partizip kann sowohl vertrauendes Sichverlassen als auch glaubende Zustimmung bezeichnen. Die Aussage erinnert wahrscheinlich an Deuteronomium 8,3: Das menschliche Leben wird nicht allein durch Nahrung, sondern durch Gottes Wort erhalten.'
    reason: lexikalische Alternative und Querverweis
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: damit … erkennen
  rationale: ἵνα mit dem Konjunktiv bezeichnet hier den Zweck; μάθωσιν meint ein durch Erfahrung gewonnenes Erkennen oder Lernen.
- source_word: οἱ υἱοί σου
  choice: deine Söhne
  rationale: Die ausdrücklich maskuline Pluralform υἱοί wird genau wiedergegeben; der Kontext bezeichnet Gottes geliebtes Volk.
- source_word: οὓς ἠγάπησας
  choice: die du geliebt hast
  rationale: Das griechische Aoristverb wird im Deutschen idiomatisch mit dem Perfekt wiedergegeben, ohne zusätzliche zeitliche Nuance einzutragen.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ wird als direkte Anrede natürlich und würdig wiedergegeben.
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  choice: nicht der Ertrag der Feldfrüchte
  rationale: γενέσεις bezeichnet hier das Hervorgebrachte beziehungsweise den Ertrag; καρποί meint im landwirtschaftlichen Zusammenhang Feldfrüchte oder Erzeugnisse, nicht bloß Obst.
- source_word: τρέφουσιν ἄνθρωπον
  choice: den Menschen ernährt
  rationale: τρέφω bedeutet ernähren oder nähren; der Singular ἄνθρωπον ist generisch und wird im Deutschen natürlich mit „den Menschen“ wiedergegeben.
- source_word: ἀλλὰ τὸ ῥῆμά σου
  choice: sondern dein Wort
  rationale: ῥῆμα bezeichnet das gesprochene Wort oder den Ausspruch Gottes; „dein Wort“ bewahrt die mögliche Anspielung auf Deuteronomium 8,3.
- source_word: τοὺς σοὶ πιστεύοντας
  choice: die dir vertrauen
  rationale: πιστεύω mit Dativ kann sowohl „jemandem glauben“ als auch „jemandem vertrauen“ bedeuten; „vertrauen“ passt zum Gedanken der bewahrenden Abhängigkeit von Gott.
- source_word: διατηρεῖ
  choice: bewahrt
  rationale: διατηρέω bedeutet bewahren, erhalten oder am Leben halten; „bewahrt“ erhält die semantische Weite des Ausdrucks.
theological_decisions:
- issue: Mögliche Anspielung auf Deuteronomium 8,3
  choice: Die eigenständige Formulierung „dein Wort … bewahrt“ wird beibehalten.
  alternative: Den Wortlaut an „Der Mensch lebt nicht vom Brot allein“ angleichen.
  rationale: Der griechische Text lässt die Anspielung erkennen, zitiert Deuteronomium 8,3 jedoch nicht vollständig; eine Harmonisierung würde nicht vorhandene Formulierungen eintragen.
- issue: Bedeutung von τοὺς σοὶ πιστεύοντας
  choice: die dir vertrauen
  alternative: die dir glauben
  rationale: Beide Bedeutungen sind sprachlich möglich. Im Haupttext steht die relationale Bedeutung des vertrauenden Sichverlassens; die echte Mehrdeutigkeit wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Zweck- und Gegensatzgefüge, vermeidet aber unnötig wörtliche Wendungen. Der Fußnotenmarker [a] steht unmittelbar nach dem Ausdruck, auf den sowohl die lexikalische Alternative als auch der Hinweis zur Gesamtaussage bezogen werden.
