base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/024.yaml
  text: For creation[a], serving you its maker, strains itself for the punishment of the unrighteous, and relaxes for the benefit of those who have put their trust in you.
translation:
  language: de
  text: 'Denn die Schöpfung dient dir, der du sie gemacht hast: Zur Bestrafung der Ungerechten spannt sie sich an, doch zugunsten derer, die auf dich vertrauen, lässt sie in ihrer Anspannung nach, um ihnen Gutes zu tun.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann man die gegensätzlichen Bilder auch so wiedergeben: „Sie wird zur Bestrafung angespannt … und zum Wohltun gelockert.“'
    reason: Das Griechische stellt mit ἐπιτείνει und ἀνίεται ein körperliches Bild von Anspannen und Lockern gegenüber, das sich im Deutschen nicht zugleich völlig wörtlich und natürlich ausdrücken lässt.
lexical_decisions:
- source_word: κτίσις
  choice: die Schöpfung
  rationale: Bezeichnet hier die gesamte geschaffene Ordnung, die personifiziert im Dienst Gottes handelt; „Natur“ würde den Bezug auf den Schöpfer abschwächen.
- source_word: σοι τῷ ποιήσαντι
  choice: dir, der du sie gemacht hast
  rationale: Gibt die appositionelle Verbindung mit σοι klar und unmittelbar wieder und vermeidet eine unnötig substantivische Formulierung.
- source_word: ὑπηρετοῦσα
  choice: dient
  rationale: Bringt verständlich zum Ausdruck, dass die Schöpfung Gottes Absichten ausführt und ihm dabei untergeordnet bleibt.
- source_word: ἐπιτείνει
  choice: spannt sie sich an
  rationale: Bewahrt das körperlich-räumliche Bild des Anspannens oder Straffens und bildet einen deutlichen Gegensatz zu ἀνίεται.
- source_word: εἰς κόλασιν κατὰ τῶν ἀδίκων
  choice: zur Bestrafung der Ungerechten
  rationale: Gibt Zielrichtung und gerichtlichen Sinn knapp wieder; „Züchtigung“ könnte hier zu einseitig an erzieherische Korrektur denken lassen.
- source_word: ἀνίεται
  choice: lässt sie in ihrer Anspannung nach
  rationale: Bewahrt den Gegensatz von Anspannen und Lockern, ohne im Deutschen den missverständlichen Eindruck zu erwecken, die Schöpfung werde untätig.
- source_word: εἰς εὐεργεσίαν
  choice: um ihnen Gutes zu tun
  rationale: Gibt den aktiven Sinn wohltätigen Handelns in natürlichem, heutigem Deutsch wieder.
- source_word: ὑπὲρ τῶν εἰς σὲ πεποιθότων
  choice: zugunsten derer, die auf dich vertrauen
  rationale: „Zugunsten“ wahrt die Bedeutung von ὑπέρ; das deutsche Präsens bezeichnet natürlich den durch das griechische Perfekt ausgedrückten fortdauernden Vertrauenszustand.
theological_decisions:
- issue: Handlungsmacht der Schöpfung unter Gott
  choice: Die Schöpfung wird als Gottes dienendes Werkzeug sowohl beim Gericht als auch beim Wohltun dargestellt.
  alternative: Die Schöpfung beziehungsweise Natur handelt als eigenständige, unpersönliche Macht.
  rationale: ὑπηρετοῦσα und σοι τῷ ποιήσαντι stellen ihr Handeln ausdrücklich in den Dienst dessen, der sie gemacht hat, ohne die bildhafte Eigenaktivität der Schöpfung zu beseitigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die personifizierte Schöpfung und das kontrastierende Bewegungsbild des griechischen Textes bleiben erhalten; der Doppelpunkt macht die Funktion des folgenden Satzes als Erläuterung ihres Dienstes deutlich.
