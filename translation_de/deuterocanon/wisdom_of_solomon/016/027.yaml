  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/027.yaml
  text: For what was not destroyed by fire simply melted when warmed by a brief ray of the sun,[a]
translation:
  language: de
  text: Denn was durch Feuer nicht zerstört wurde, schmolz schon, wenn es von einem schwachen Sonnenstrahl erwärmt wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von einem kurzen Sonnenstrahl«. Das griechische Adjektiv kann geringe Stärke oder kurze Dauer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... μὴ φθειρόμενον
  choice: was ... nicht zerstört wurde
  rationale: Das substantivierte Partizip verweist im Zusammenhang auf die wunderbare Speise. »Zerstört« gibt den Gegensatz zur Einwirkung von Feuer und zum Schmelzen klarer wieder als »verdorben«.
- source_word: ὑπὸ πυρὸς
  choice: durch Feuer
  rationale: Ὑπό mit Genitiv bezeichnet hier die wirkende Ursache. Im Deutschen ist »durch Feuer« in diesem sachlichen Zusammenhang natürlich.
- source_word: ἁπλῶς
  choice: schon
  rationale: '»Schon« bringt im Satz den steigernden Kontrast zum Ausdruck: Obwohl Feuer die Speise nicht zerstörte, genügte geringe Sonnenwärme, um sie schmelzen zu lassen. Ein isoliertes »einfach« wäre im modernen Deutschen missverständlich oder zu umgangssprachlich.'
- source_word: ὑπὸ βραχείας ἀκτῖνος ἡλίου
  choice: von einem schwachen Sonnenstrahl
  rationale: Βραχύς kann geringe Stärke, Ausdehnung oder Dauer bezeichnen. »Schwacher Sonnenstrahl« bewahrt das Bild und ergibt im Deutschen eine natürliche Formulierung; die mögliche zeitliche Nuance wird in der Fußnote genannt.
- source_word: θερμαινόμενον
  choice: wenn es ... erwärmt wurde
  rationale: Das Partizip wird als zeitlich-bedingender Begleitumstand wiedergegeben. »Erwärmt« entspricht der geringen Einwirkung besser als das stärkere »erhitzt«.
- source_word: ἐτήκετο
  choice: schmolz
  rationale: Τήκω bezeichnet hier das Schmelzen. Das deutsche Präteritum gibt den griechischen Imperfekt in der erzählenden Feststellung idiomatisch wieder.
theological_decisions:
- issue: Wunderhafte Beschaffenheit der Speise im Gegensatz zu einem gewöhnlichen Naturvorgang
  choice: Die Aussage wird konkret als paradoxe Beschreibung der Speise wiedergegeben, ohne das Wunder näher zu erklären.
  alternative: Den Satz als allgemeine Aussage über natürliche Vorgänge oder als sprichwörtliche Weisheit deuten.
  rationale: Der griechische Wortlaut steht im Zusammenhang der Manna-Erzählung und hebt den Gegensatz zwischen Feuerbeständigkeit und Schmelzen durch geringe Sonnenwärme hervor. Die Übersetzung bewahrt diese Spannung ohne erläuternden Zusatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Kontrast, wird aber durch die finite Formulierung mit »wenn« für heutige Leser natürlich gestaltet.
