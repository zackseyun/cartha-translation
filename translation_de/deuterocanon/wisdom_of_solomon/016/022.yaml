base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/022.yaml
  text: But snow and ice endured fire and did not melt[a], so that they might know that fire, blazing in the hail and flashing in the rainstorms, was destroying the fruits of the enemies;
translation:
  language: de
  text: Doch Schnee und Eis hielten dem Feuer stand und schmolzen nicht. So sollten sie erkennen, dass das Feuer, das im Hagel brannte und in den Regengüssen aufblitzte, die Früchte der Feinde[a] vernichtete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Feldfrüchte der Feinde“ oder „die Erträge der Feinde“. Wörtlich steht im Griechischen: „die Früchte der Feinde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιὼν
  choice: Schnee
  rationale: Die gewöhnliche Bedeutung ist „Schnee“. So bleibt auch die Unterscheidung von der später genannten χαλάζῃ („Hagel“) erhalten.
- source_word: κρύσταλλος
  choice: Eis
  rationale: Im Zusammenhang mit Schnee, Feuer und Schmelzen bezeichnet das Wort natürlich „Eis“; „Kristall“ wäre hier irreführend.
- source_word: ὑπέμεινε πῦρ
  choice: hielten dem Feuer stand
  rationale: Die idiomatische deutsche Wendung gibt das Ausharren beziehungsweise Widerstehen unter einer zerstörerischen Einwirkung präzise wieder.
- source_word: οὐκ ἐτήκετο
  choice: schmolzen nicht
  rationale: Bei Schnee und Eis ist „schmelzen“ die natürliche und genaue Entsprechung.
- source_word: ἵνα γνῶσιν
  choice: So sollten sie erkennen
  rationale: Die Formulierung bewahrt den Zweck- beziehungsweise Ergebnischarakter, ohne das im Griechischen unausgesprochene Subjekt näher festzulegen.
- source_word: κατέφθειρε
  choice: vernichtete
  rationale: Das Imperfekt schildert die fortdauernde Zerstörung; im Deutschen kann das Präteritum diesen erzählerischen Verlauf natürlich ausdrücken.
- source_word: φλεγόμενον ἐν τῇ χαλάζῃ
  choice: das im Hagel brannte
  rationale: Die Übersetzung bewahrt das paradoxe Bild eines Feuers, das mitten im Hagel brennt.
- source_word: ἐν τοῖς ὑετοῖς διαστράπτον
  choice: in den Regengüssen aufblitzte
  rationale: „Regengüsse“ passt zum meteorologischen Zusammenhang; „aufblitzte“ gibt das blitzartige Leuchten des Partizips wieder.
- source_word: τοὺς τῶν ἐχθρῶν καρποὺς
  choice: die Früchte der Feinde
  rationale: Die formal nahe Wiedergabe bewahrt die Bildsprache und kann im Zusammenhang die Feldfrüchte beziehungsweise Erträge bezeichnen.
theological_decisions:
- issue: Zwecksatz und Subjekt des Erkennens
  choice: Das unausgesprochene Subjekt bleibt mit „sie“ unbestimmt.
  alternative: Man könnte „sie“ ausdrücklich auf die Feinde oder allgemeiner auf die Beobachter beziehen.
  rationale: Das griechische Verb nennt kein ausdrückliches Subjekt. Die Übersetzung wahrt diese Mehrdeutigkeit und legt die theologische Aussage nicht enger fest als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz gibt das paradoxe Naturgeschehen knapp wieder; der zweite wahrt die komplexe Bildfolge und die Mehrdeutigkeit des griechischen Subjekts.
