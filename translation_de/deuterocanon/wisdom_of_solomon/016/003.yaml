translation:
  language: de
  text: damit jene zwar nach Nahrung verlangten, sich aber wegen des Anblicks der gegen sie gesandten Geschöpfe[a] sogar von ihrem notwendigen Verlangen nach Nahrung abwenden konnten, während diese, nachdem sie kurze Zeit Mangel gelitten hatten, von einem ungewohnten Geschmack[b] kosten konnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch möglich: „wegen des Anblicks dessen, was gegen sie gesandt worden war“. Gemeint sind die Plagewesen, deren sichtbare Erscheinung Abscheu hervorrief.'
    reason: lexical_alternative
  - marker: b
    text: Der „ungewohnte Geschmack“ bezeichnet eine Speise von bisher unbekannter Art und weist im Zusammenhang auf die außergewöhnliche Nahrung hin, die Israel erhielt.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμοῦντες τροφήν
  choice: nach Nahrung verlangten
  rationale: Gibt das deutliche Verlangen nach Speise natürlich wieder, ohne es unnötig zu „Gier“ zu steigern.
- source_word: τὴν δειχθεῖσαν τῶν ἐπαπεσταλμένων
  choice: wegen des Anblicks der gegen sie gesandten Geschöpfe
  rationale: Die schwierige, elliptische Formulierung hebt das sichtbare Erscheinungsbild der gesandten Plagewesen hervor. „Geschöpfe“ erschließt den Bezug aus dem Kontext, ohne eine Tierart festzulegen.
- source_word: τὴν ἀναγκαίαν ὄρεξιν
  choice: ihrem lebensnotwendigen Appetit
  rationale: Bewahrt den Gedanken eines durch körperliche Notwendigkeit bedingten Verlangens; „lebensnotwendig“ klingt im Deutschen verständlicher als „notwendiger Appetit“.
- source_word: ἀποστρέφωνται
  choice: sich … abwandten
  rationale: Entspricht der medialen Vorstellung des Sich-Abwendens und lässt den im Kontext liegenden Ekel mitschwingen, ohne ihn ausdrücklich hinzuzufügen.
- source_word: ἐπʼ ὀλίγον ἐνδεεῖς γενόμενοι
  choice: nachdem sie kurze Zeit Mangel gelitten hatten
  rationale: Drückt sowohl die zeitliche Begrenzung als auch den Zustand vorübergehender Entbehrung klar aus.
- source_word: ξένης … γεύσεως μετάσχωσι
  choice: von einem ungewohnten Geschmack kosten konnten
  rationale: „Ungewohnt“ bezeichnet die Fremdartigkeit der besonderen Speise ohne den im Deutschen möglichen ethnischen Beiklang von „fremd“; „kosten“ gibt die Beteiligung an einer Geschmackserfahrung idiomatisch wieder.
theological_decisions:
- issue: Bezug des Gegensatzes zwischen ἐκεῖνοι und αὐτοί
  choice: Die erste Gruppe bleibt mit „jene“, die zweite mit „diese“ bezeichnet; der Kontext weist auf die Ägypter und Israel.
  alternative: Die Gruppen im Vers ausdrücklich als „die Ägypter“ und „die Israeliten“ benennen.
  rationale: Der unmittelbare Zusammenhang legt die historischen Gruppen nahe, doch der griechische Vers selbst nennt sie nicht. Die pronominale Gegenüberstellung bewahrt daher Wortlaut und rhetorische Spannung.
- issue: Bedeutung des ungewohnten Geschmacks
  choice: Die Formulierung bleibt bildhaft und wird nicht im Haupttext als Manna identifiziert.
  alternative: „von der ungewöhnlichen Speise, dem Manna, kosten“
  rationale: Der Kontext deutet auf Gottes außergewöhnliche Versorgung Israels, aber der Vers spricht nur von einem ξένη γεύσις. Eine ausdrückliche Identifizierung würde die Andeutung stärker auflösen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Gegenüberstellung „jene zwar … während diese …“ bildet μέν … δέ ab. Die Satzstruktur bleibt eng am Griechischen, wird aber durch idiomatische Wendungen wie „Mangel leiden“ und „von einem Geschmack kosten“ lesbar gehalten.
