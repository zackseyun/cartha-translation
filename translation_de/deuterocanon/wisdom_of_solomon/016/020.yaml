    issue: „ohne dass sie sich dafür mühen mussten“
    rationale: ἀκοπιάτως bedeutet „ohne Mühe/ohne Anstrengung“ und bezeichnet im Satz unmittelbar die Sendung bzw. Bereitstellung. Die Einfügung „sie“ und „dafür“ legt eine menschliche Empfängerperspektive fest, die der griechische Wortlaut nicht explizit ausdrückt.
  - severity: low
    issue: „fertiges Brot“
    rationale: Die Wendung ist verständlich, klingt für bereitliegendes, von Gott gesandtes Brot aber weniger natürlich als „bereitetes Brot“.
