base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/020.yaml
  text: Instead of these things[a], you fed your people with the food of angels, and without their labor you sent them ready bread from heaven, able to satisfy every delight and suited to every taste.
translation:
  language: de
  text: Anstelle dieser Dinge speistest du dein Volk mit Engelsspeise[a] und sandtest ihnen ohne Mühe bereitetes Brot vom Himmel, das jeden Genuss zu bieten vermochte und jedem Geschmack entsprach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Speise der Engel“ oder „für Engel geeignete Speise“. Der griechische Ausdruck legt keine genauere Deutung fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Anstelle dieser Dinge
  rationale: Die Wendung bewahrt den Gegensatz zwischen den zuvor geschilderten Strafgerichten und Gottes Versorgung seines Volkes.
- source_word: ἀγγέλων τροφήν
  choice: Engelsspeise
  rationale: Das deutsche Kompositum gibt die Genitivverbindung knapp wieder, ohne zu entscheiden, ob Speise der Engel oder für Engel angemessene Speise gemeint ist.
- source_word: ἐψώμισας
  choice: speistest
  rationale: Das Verb bezeichnet das Geben von Nahrung; „speistest“ ist prägnant, würdig und passt zum direkten Objekt „dein Volk“.
- source_word: ἕτοιμον ἄρτον
  choice: fertiges Brot
  rationale: „Fertig“ gibt ἕτοιμος als bereits bereitgestellte Nahrung natürlich wieder.
- source_word: ἀπʼ οὐρανοῦ
  choice: vom Himmel
  rationale: Dies ist die natürliche deutsche Wiedergabe der räumlichen Herkunftsangabe.
- source_word: ἀκοπιάτως
  choice: ohne dass sie sich dafür mühen mussten
  rationale: Die Formulierung bringt die Abwesenheit von Mühe oder Arbeit idiomatisch zum Ausdruck und bezieht sie im Versorgungskontext auf die Empfänger, ohne eine Herstellung durch sie vorauszusetzen.
- source_word: πᾶσαν ἡδονὴν ἰσχύοντα
  choice: es vermochte jeden Genuss zu bieten
  rationale: „Vermochte“ bewahrt den Fähigkeitsaspekt von ἰσχύοντα; „jeden Genuss zu bieten“ gibt die Wirkung des Brotes verständlich wieder, ohne ἡδονή auf bloße Sättigung zu verengen.
- source_word: πρὸς πᾶσαν ἁρμόνιον γεῦσιν
  choice: entsprach jedem Geschmack
  rationale: Die idiomatische Wendung erhält den Gedanken, dass das Brot zu jedem Geschmack passend oder darauf abgestimmt war.
theological_decisions:
- issue: Art des Mannas als ἀγγέλων τροφή
  choice: Die genitivische Wendung bleibt als „Engelsspeise“ ohne nähere Erklärung im Haupttext stehen.
  alternative: Speise von Engeln; für Engel geeignete Speise; von Engeln vermittelte Speise
  rationale: Der griechische Genitiv legt keine dieser genaueren Deutungen zwingend fest. Die Übersetzung wahrt daher die Aussage von der himmlischen Versorgung, ohne eine bestimmte Engellehre einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das Präteritum „speistest“ hält die Erzählform knapp; der zweite Satzteil wird zur besseren Lesbarkeit mit einem Semikolon gegliedert.
