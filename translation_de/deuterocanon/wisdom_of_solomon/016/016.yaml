  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/016.yaml
  text: For because they refused to know you[a], the ungodly were scourged by the strength of your arm, pursued by strange rains and hail and relentless storms[b], and consumed by fire.
translation:
  language: de
  text: Denn weil die Gottlosen sich weigerten, dich zu erkennen, wurden sie durch die Kraft deines Arms gegeißelt, von außergewöhnlichen Regengüssen[a], Hagel und unabwendbaren Wolkenbrüchen[b] verfolgt und vom Feuer verzehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fremdartigen Regengüssen“; gemeint sind ungewöhnliche, als Gericht gesandte Niederschläge.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unerbittlichen Wolkenbrüchen“; das griechische Adjektiv bezeichnet etwas, das sich nicht abwenden oder zurückweisen lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνούμενοι ... εἰδέναι
  choice: sich weigerten, dich zu erkennen
  rationale: Die Verbindung aus ἀρνέομαι und Infinitiv bezeichnet eine willentliche Weigerung. „Erkennen“ bewahrt den Erkenntnisbezug von εἰδέναι und klingt im Deutschen natürlicher als „dich zu wissen“, ohne ausdrücklich „anerkennen“ einzutragen.
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: Die Bezeichnung hebt die fehlende Ehrfurcht vor Gott hervor und entspricht dem religiösen Gehalt von ἀσεβής.
- source_word: ἐν ἰσχύι βραχίονός σου
  choice: durch die Kraft deines Arms
  rationale: Die instrumentale Wendung und das biblische Bild des göttlichen Arms bleiben mit beiden Substantiven erhalten.
- source_word: ἐμαστιγώθησαν
  choice: wurden ... gegeißelt
  rationale: Das anschauliche Strafbild des griechischen Verbs wird bewahrt und nicht zum allgemeineren „bestraft“ abgeschwächt.
- source_word: ξένοις ὑετοῖς
  choice: außergewöhnlichen Regengüssen
  rationale: ξένος bezeichnet hier fremdartige beziehungsweise ungewöhnliche Niederschläge; „außergewöhnlich“ vermittelt dies im modernen Deutsch klar, während „Regengüsse“ den konkreten Sinn von ὑετοί wiedergibt.
- source_word: χαλάζαις
  choice: Hagel
  rationale: Der deutsche Stoffname gibt den griechischen Plural in dieser Aufzählung idiomatisch wieder.
- source_word: ὄμβροις ἀπαραιτήτοις
  choice: unabwendbaren Wolkenbrüchen
  rationale: ὄμβρος bezeichnet heftigen Regen oder einen Wolkenbruch. ἀπαραίτητος beschreibt etwas, das sich nicht abwenden oder zurückweisen lässt; „unabwendbar“ erhält diese Nuance.
- source_word: διωκόμενοι
  choice: verfolgt
  rationale: Die Verfolgungsmetapher des Partizips bleibt ausdrücklich erhalten.
- source_word: πυρὶ καταναλισκόμενοι
  choice: vom Feuer verzehrt
  rationale: Die Formulierung gibt die zerstörerische Wirkung des Feuers knapp und würdevoll wieder.
theological_decisions:
- issue: Bedeutung der Gotteserkenntnis in εἰδέναι
  choice: dich zu erkennen
  alternative: dich anzuerkennen
  rationale: „Erkennen“ lässt offen, ob Wissen, Anerkennung oder beides im Blick steht. „Anerkennen“ würde die theologische Deutung bereits stärker festlegen.
- issue: Bildhafte Sprache des Strafgerichts
  choice: wurden ... gegeißelt
  alternative: wurden ... bestraft
  rationale: Obwohl die Geißelung durch Wetter und Feuer geschieht, verwendet der Ausgangstext bewusst ein drastisches Strafbild; dieses wird nicht geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der griechischen Begründungs- und Partizipienstruktur, bleibt aber flüssig. Die Wetterbegriffe werden differenziert wiedergegeben; die gewaltsamen Bilder von Verfolgung, Geißelung und Verzehrung bleiben erhalten.
