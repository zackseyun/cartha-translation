base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/007.yaml
  text: For the one who turned was saved not by what was seen[a], but by you[b], the Savior of all.
translation:
  language: de
  text: Denn wer sich zuwandte[a], wurde nicht durch das gerettet, was betrachtet wurde[b], sondern durch dich, den Retter aller[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer sich umwandte“ oder „wer umkehrte“. Gemeint ist hier die Hinwendung zu dem zuvor genannten Zeichen; eine ausdrückliche Aussage über innere Umkehr enthält das Wort an dieser Stelle nicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „durch das Betrachtete“. Der sichtbare Gegenstand selbst war nicht die rettende Ursache.'
    reason: alternative_reading
  - marker: c
    text: „Aller“ kann im Griechischen umfassend verstanden werden; der Ausdruck legt nicht ausdrücklich fest, ob Menschen, alle Geschöpfe oder alles Existierende gemeint sind.
    reason: scope_ambiguity
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: wer sich zuwandte
  rationale: Das substantivisch gebrauchte Aoristpartizip bezeichnet hier den Menschen, der sich dem zuvor genannten Zeichen zuwandte. „Sich zuwandte“ bewahrt die Richtung, ohne Reue oder Umkehr im theologischen Sinn einzutragen.
- source_word: τὸ θεωρούμενον
  choice: das, was er ansah
  rationale: Das substantivierte passive Partizip bezeichnet den betrachteten sichtbaren Gegenstand. Die persönliche Formulierung ist im Deutschen natürlicher als „das Betrachtete“ und hält den Gegensatz zwischen dem sichtbaren Zeichen und Gott fest.
- source_word: ἐσώζετο
  choice: wurde gerettet
  rationale: Das Imperfekt Passiv von σῴζω wird idiomatisch wiedergegeben und entspricht dem Titel σωτήρ im zweiten Satzteil.
- source_word: σωτῆρα
  choice: Retter
  rationale: „Retter“ ist die direkte, würdige deutsche Entsprechung und wahrt die Verbindung zum Verb „retten“.
- source_word: πάντων
  choice: aller
  rationale: Die knappe Genitivform erhält den umfassenden, im Griechischen nicht näher eingegrenzten Geltungsbereich.
theological_decisions:
- issue: Ursächlicher Gegensatz zwischen dem sichtbaren Zeichen und Gott
  choice: Nicht der betrachtete Gegenstand rettete, sondern Gott.
  alternative: Der sichtbare Gegenstand war das Mittel, durch das Gott rettete.
  rationale: Die Konstruktion οὐ διὰ … ἀλλὰ διὰ σέ stellt einen ausdrücklichen Gegensatz her. Die Übersetzung wahrt diesen, ohne die erzählerische Funktion des Zeichens grundsätzlich zu bestreiten.
- issue: Reichweite von πάντων im Gottesprädikat
  choice: Retter aller
  alternative: Retter aller Menschen; Retter aller Dinge; Retter des Alls
  rationale: Das Griechische lässt den Bezug offen. Die knappe Formulierung vermeidet sowohl eine Beschränkung auf Menschen als auch eine ausdrückliche kosmologische oder universalistische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gegensatz, vermeidet jedoch das unnatürliche substantivierte „das Betrachtete“. Die Anrede „durch dich“ bleibt zur Hervorhebung Gottes unverändert erhalten.
