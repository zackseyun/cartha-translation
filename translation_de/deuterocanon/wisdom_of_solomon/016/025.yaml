base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/025.yaml
  text: Therefore also at that time[a], changing itself into all things, it served your all-nourishing gift according to the desire of those in need[b];
translation:
  language: de
  text: Darum steht sie auch damals, indem sie sich in jeder Weise verwandelte[a], deiner Gabe, die alle ernährt, ganz nach dem Wunsch der Bedürftigen[b] zu Diensten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »indem sie sich in alles verwandelte«. Das Griechische hebt die außergewöhnliche Anpassungsfähigkeit der himmlischen Versorgung hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ganz nach dem Wunsch der Bittenden«. Das griechische Wort kann sowohl Bedürftige als auch Menschen bezeichnen, die um etwas bitten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο καὶ τότε
  choice: Darum … auch damals
  rationale: Die Formulierung bewahrt sowohl den Folgerungszusammenhang von διὰ τοῦτο als auch das weiterführende καί und den zeitlichen Rückverweis τότε.
- source_word: εἰς πάντα μεταλλευομένη
  choice: indem sie sich in alles verwandelte
  rationale: Die Wendung gibt die bildhafte Verwandlung in vielerlei Formen oder Eigenschaften wieder und wahrt die mediale Färbung des Partizips.
- source_word: τῇ παντοτρόφῳ σου δωρεᾷ
  choice: deiner Gabe, die alle ernährt
  rationale: Der Relativsatz gibt παντοτρόφος verständlich und würdevoll als umfassend nährend beziehungsweise erhaltend wieder; der Dativ bleibt von »diente« abhängig.
- source_word: ὑπηρετεῖ
  choice: diente sie
  rationale: Das historische Präsens wird wegen τότε und des deutschen Erzählflusses als Vergangenheit wiedergegeben. Das Pronomen bewahrt den unausgesprochenen, aus dem Kontext übernommenen Bezug, statt ausdrücklich »Manna« oder »Schöpfung« einzusetzen.
- source_word: πρὸς τὴν τῶν δεομένων θέλησιν
  choice: ganz nach dem Wunsch der Bedürftigen
  rationale: πρός bezeichnet hier die Ausrichtung oder Anpassung; δεομένων kann Bedürftige oder Bittende meinen. »Bedürftigen« wahrt im Kontext den Gedanken des Angewiesenseins, ohne die mögliche Bitte auszuschließen.
theological_decisions:
- issue: Bezug des weiblichen Subjekts der Verwandlung
  choice: Das Subjekt bleibt mit »sie« unausgesprochen und wird nicht ausdrücklich als Manna oder Schöpfung benannt.
  alternative: Das Subjekt ausdrücklich als »die Schöpfung« oder »die himmlische Speise« benennen.
  rationale: Das feminine Partizip nimmt wahrscheinlich die Schöpfung aus dem vorherigen Vers auf, während der nähere Zusammenhang die anpassungsfähige himmlische Speise im Blick hat. Das Pronomen erhält diese literarische und sachliche Spannung.
- issue: Bedeutung von δεομένων
  choice: der Bedürftigen
  alternative: der Bittenden
  rationale: Das Wort kann sowohl Menschen bezeichnen, die etwas benötigen, als auch solche, die darum bitten. Die Hauptfassung passt zum Versorgungskontext; die Fußnote bewahrt die zweite Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Relativsatz »die alle ernährt« ist natürlicher als ein schwerfälliges Kompositum wie »allernährende«. Die Konstruktion mit »sie« setzt den Zusammenhang mit dem vorigen Vers voraus und vermeidet eine theologisch oder literarisch verengende Explizierung.
