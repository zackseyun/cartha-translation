    rationale: τῶν ἐν τῇ παροικίᾳ αὐτῶν bezeichnet das, was während ihres Fremdaufenthalts geschehen war. Eine Relativformulierung stellt diesen Bezug im Deutschen natürlicher her.
  - severity: low
