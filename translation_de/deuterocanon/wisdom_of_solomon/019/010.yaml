base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/010.yaml
  text: 'For they still remembered the things in their time as foreigners: how[a], instead of the breeding of animals, the land brought forth gnats, and instead of creatures of the water[b], the river spewed out a multitude of frogs.'
translation:
  language: de
  text: 'Denn sie erinnerten sich noch daran, was sich während ihres Aufenthalts als Fremde[a] ereignet hatte: wie die Erde statt der Entstehung von Lebewesen Mücken[b] hervorbrachte und der Fluss statt Wassertieren eine Menge Frösche ausspie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „während ihrer Fremdlingschaft“. Das griechische Wort bezeichnet das Leben an einem Ort als Fremde.'
    reason: lexical_alternative
  - marker: b
    text: Welche Art kleiner Plageinsekten gemeint ist, lässt sich nicht sicher bestimmen; auch „Gnitzen“ oder andere kleine stechende Insekten kommen als Wiedergabe infrage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμέμνηντο … ἔτι
  choice: sie erinnerten sich noch
  rationale: Das Imperfekt bezeichnet ein fortdauerndes Erinnern; ἔτι wird mit „noch“ wiedergegeben.
- source_word: τῶν ἐν τῇ παροικίᾳ αὐτῶν
  choice: an die Ereignisse während ihres Aufenthalts als Fremde
  rationale: παροικία bezeichnet den Aufenthalt an einem Ort, an dem man als Fremder lebt. „Ereignisse“ gibt das substantivierte τῶν ἐν … im Zusammenhang natürlich wieder.
- source_word: γενέσεως ζῴων
  choice: dass Tiere entstanden
  rationale: γένεσις kann Entstehung, Hervorbringung oder Geburt bezeichnen. Die verbale Formulierung ist im Deutschen natürlich und legt den Vorgang nicht unnötig auf Zucht oder Fortpflanzung fest.
- source_word: ἐξήγαγεν ἡ γῆ
  choice: brachte die Erde … hervor
  rationale: Die Wendung bewahrt das Bild, dass die Tiere aus der Erde hervorkommen.
- source_word: σκνῖπα
  choice: Stechmücken
  rationale: Die genaue Insektenart ist unsicher. „Stechmücken“ vermittelt die Vorstellung kleiner stechender Plageinsekten und funktioniert im Deutschen als Kollektivplural.
- source_word: ἐνύδρων
  choice: Wassertieren
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet im Wasser lebende Geschöpfe; „Wassertiere“ ist knapp und verständlich.
- source_word: ἐξηρεύξατο
  choice: spie … aus
  rationale: Das kräftige Verb bezeichnet ein heftiges Ausstoßen; „spie aus“ erhält die drastische Bildsprache.
- source_word: πλῆθος βατράχων
  choice: eine Menge Frösche
  rationale: πλῆθος betont die große Zahl; die Wendung ist genau und in modernem Deutsch natürlich.
theological_decisions:
- issue: Bedeutung von παροικία im Rückblick auf Ägypten
  choice: Aufenthalt als Fremde
  alternative: Fremdlingschaft; Exil
  rationale: Die Formulierung bewahrt den sozialen Status Israels als Fremde in Ägypten. „Exil“ würde eine spezifischere heilsgeschichtliche Deutung eintragen, die das griechische Wort hier nicht verlangt.
- issue: Stärke des Bildes in ἐξηρεύξατο
  choice: spie … aus
  alternative: ließ hervorströmen; brachte hervor
  rationale: Die kräftige, beinahe körperliche Metapher des griechischen Verbs wird erhalten, ohne sie theologisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt bildhaft und eng am griechischen Aufbau, vermeidet jedoch schwer verständliche Nominalformulierungen. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
