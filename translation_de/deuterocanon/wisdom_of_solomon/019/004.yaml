base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/004.yaml
  text: For a deserved necessity dragged them to this end[a], and cast forgetfulness of what had happened upon them[b], so that they might beforehand complete the punishment lacking in their torments.
translation:
  language: de
  text: Denn eine verdiente Notwendigkeit zog sie diesem Ende entgegen[a] und ließ sie vergessen, was geschehen war, damit sie im Voraus die Strafe vollendeten, die zu ihren Qualen noch fehlte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Notwendigkeit, die sie verdient hatten“ oder „eine angemessene Notwendigkeit“. Das Griechische verbindet moralische Angemessenheit beziehungsweise Verdienst mit unausweichlichem Zwang.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „die noch ausstehende Strafe“ – also die Strafe, die durch ihre bisherigen Qualen noch nicht vollständig vollzogen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷλκεν
  choice: riss … entgegen
  rationale: Das Verb bezeichnet hier ein gewaltsames Ziehen. „Riss“ vermittelt den Zwang deutlicher als das neutralere „zog“, ohne eine im Griechischen nicht genannte handelnde Person einzuführen.
- source_word: ἡ ἀξία ... ἀνάγκη
  choice: die verdiente Notwendigkeit
  rationale: Die Wiedergabe bewahrt sowohl die moralische Angemessenheit beziehungsweise das Verdientsein (ἀξία) als auch den unausweichlichen Zwang (ἀνάγκη). Die bewusst ungewöhnliche Verbindung entspricht der prägnanten Spannung des Griechischen.
- source_word: ἐπὶ τοῦτο πέρας
  choice: diesem Ende entgegen
  rationale: πέρας bezeichnet den Endpunkt oder Ausgang. Die Formulierung verbindet Zielrichtung und endgültigen Ausgang auf natürliche deutsche Weise.
- source_word: τῶν συμβεβηκότων
  choice: was geschehen war
  rationale: Die Wendung gibt das perfektische Partizip allgemein und verständlich wieder, ohne die vorausgegangenen Ereignisse näher festzulegen.
- source_word: ἀμνηστίαν ἐνέβαλεν
  choice: ließ sie vergessen
  rationale: Die idiomatische deutsche Formulierung vermittelt das Auferlegen von Vergessenheit, wahrt aber durch das fortgeführte Subjekt „Notwendigkeit“ die unpersönliche Darstellung des Griechischen.
- source_word: προαναπληρώσωσιν
  choice: im Voraus ... vollendeten
  rationale: „Vollendeten“ bringt das Vervollständigen zum Ausdruck; „im Voraus“ bewahrt den durch προ- bezeichneten zeitlichen Vorgriff.
- source_word: τὴν λείπουσαν ταῖς βασάνοις ... κόλασιν
  choice: die Strafe ..., die ihren Qualen noch fehlte
  rationale: Die syntaktische Beziehung zwischen der noch fehlenden Strafe und den Qualen bleibt erhalten. „Qualen“ gibt die Schwere von βάσανοι wieder, ohne es unnötig auf konkrete Foltermethoden einzuengen.
theological_decisions:
- issue: Wer den Zwang und das Vergessen bewirkt
  choice: Die personifizierte „Notwendigkeit“ reißt sie dem Ende entgegen und lässt sie vergessen.
  alternative: Gott ausdrücklich als den Handelnden nennen oder alles unmittelbar ihrer eigenen Schuld beziehungsweise ihrem Schicksal zuschreiben.
  rationale: Der griechische Satz nennt Gott nicht ausdrücklich, verbindet den Zwang jedoch mit moralischem Verdienst. Die Übersetzung bewahrt diese Spannung und ergänzt keine eindeutige Aussage über die letzte Urheberschaft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Wendung „verdiente Notwendigkeit“ ist bewusst beibehalten, um die knappe Verbindung von moralischem Verdienst und Zwang im Griechischen nicht durch eine glättende Deutung aufzulösen.
