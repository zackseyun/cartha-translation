base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/021.yaml
  text: Flames[a], on the contrary, did not wither the flesh of the perishable living creatures that walked among them, nor did they melt the meltable[b], crystal-like kind of ambrosial food.
translation:
  language: de
  text: Die Flammen dagegen[a] ließen das Fleisch der vergänglichen Lebewesen, die mitten in ihnen umhergingen, nicht verdorren; ebenso wenig brachten sie eine schmelzbare, leicht schmelzende, kristallartige[b] Art von ambrosischer Speise zum Schmelzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „umgekehrt“ oder „entgegen dem Üblichen“. Das griechische Adverb bezeichnet ein Verhalten der Flammen, das dem normalerweise Erwartbaren entgegengesetzt ist.'
    reason: lexical_alternative
  - marker: b
    text: „Kristallartig“ kann hier auch „eisartig“ oder „kristallin“ bedeuten und das Aussehen oder die Beschaffenheit der wunderbaren Speise beschreiben.
    reason: lexical_alternative
lexical_decisions:
- source_word: φλόγες
  choice: die Flammen
  rationale: Der konkrete Plural bezeichnet das Feuerphänomen; „Flammen“ ist im Deutschen anschaulich und natürlich.
- source_word: ἀνάπαλιν
  choice: dagegen
  rationale: Das Adverb kennzeichnet ein den gewöhnlichen Erwartungen entgegengesetztes Verhalten. „Dagegen“ bewahrt den Kontrast, ohne die Richtung unnötig festzulegen.
- source_word: εὐφθάρτων ζῴων
  choice: der vergänglichen Lebewesen
  rationale: „Lebewesen“ gibt ζῷα allgemein wieder, während „vergänglich“ ihre natürliche Anfälligkeit für Verderben oder Zerstörung ausdrückt.
- source_word: οὐκ ἐμάραναν σάρκας
  choice: ließen das Fleisch … nicht verdorren
  rationale: Die ungewöhnliche Bildsprache von μαραίνω („verdorren, verwelken lassen“) bleibt erhalten, statt sie zu „verbrennen“ zu normalisieren.
- source_word: ἐμπεριπατούντων
  choice: die mitten in ihnen umhergingen
  rationale: Die Relativkonstruktion gibt das fortdauernde Sichbewegen innerhalb der Flammen anschaulich und in natürlichem Deutsch wieder.
- source_word: τηκτὸν εὔτηκτον
  choice: die schmelzbare, leicht schmelzende … Art … zum Schmelzen
  rationale: Die auffällige Häufung der griechischen Wörter aus dem Bedeutungsfeld des Schmelzens wird bewusst bewahrt; das im zweiten Satzglied sinngemäß erforderliche Verb wird im Deutschen ausdrücklich ergänzt.
- source_word: κρυσταλλοειδὲς
  choice: kristallartige
  rationale: Die wörtliche Bildaussage bleibt offen; das Wort kann auf kristall- oder eisähnliches Aussehen beziehungsweise eine entsprechende Beschaffenheit weisen.
- source_word: γένος
  choice: Art
  rationale: „Art“ entspricht dem klassifizierenden, hier jedoch breit verwendeten γένος und fügt sich in die Beschreibung der Speise ein.
- source_word: ἀμβροσίας τροφῆς
  choice: ambrosischer Speise
  rationale: Die gehobene hellenistische Färbung und die Vorstellung überirdischer beziehungsweise unvergänglicher Nahrung bleiben erhalten, ohne sie dogmatisch auf „himmlische Speise“ festzulegen.
theological_decisions:
- issue: Deutung der wunderbaren Speise
  choice: ambrosischer Speise
  alternative: himmlischer Speise; unsterblicher Speise
  rationale: Die Formulierung wahrt die poetische und hellenistische Bildwelt des griechischen Textes und identifiziert die Speise nicht ausdrücklich mit einer späteren theologischen Deutung.
- issue: Aufenthalt der Lebewesen im Feuer
  choice: die mitten in ihnen umhergingen
  alternative: die darin umhergingen
  rationale: Das Bezugswort „Flammen“ wird erkennbar aufgenommen, während die Aussage nicht über das im Partizip ausgedrückte Bewegen in ihrer Mitte hinaus erweitert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter poetischer Fremdheit. Die Wiederholung des Schmelzmotivs und „ambrosisch“ spiegeln den gehobenen griechischen Stil; Satzbau und Relativsatz bleiben zugleich für heutige Leser verständlich.
