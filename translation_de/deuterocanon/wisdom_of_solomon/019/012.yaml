  text: Denn zu ihrem Trost stieg eine Wachtel vom Meer her zu ihnen auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραμυθίαν
  choice: Stärkung
  rationale: Das Substantiv bezeichnet Trost, Erquickung oder Linderung. Im Zusammenhang mit der als Nahrung gegebenen Wachtel gibt „Stärkung“ die konkrete Wirkung natürlich wieder, ohne den Trostgedanken völlig aufzugeben.
- source_word: ἀνέβη
  choice: stieg … herauf
  rationale: Bewahrt die räumliche Bewegung des griechischen Verbs und entspricht der Darstellung, dass die Wachtel vom Meer her zu ihnen gelangte.
- source_word: ὀρτυγομήτρα
  choice: eine Wachtel
  rationale: Das seltene griechische Wort bezeichnet hier im Exodus-Rückblick den als Nahrung dienenden Wachtelvogel; der geläufige deutsche Name ist im Kontext sachgerecht.
- source_word: ἀπὸ θαλάσσης
  choice: aus dem Meer
  rationale: Gibt die Präposition und das Substantiv eng wieder und bewahrt die auffällige Herkunftsangabe des Ausgangstextes.
theological_decisions:
- issue: Art und Zweck der göttlichen Versorgung
  choice: „zu ihrer Stärkung“
  alternative: „um sie zu trösten“ / „zu ihrer Erquickung“
  rationale: Die Formulierung lässt die Versorgung zugleich als körperliche Hilfe und als wohltuende Zuwendung erscheinen, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Kurzer, würdevoller Erzählsatz in modernem Standarddeutsch. Die ungewöhnliche Singularform des griechischen Textes bleibt mit „eine Wachtel“ erhalten.
