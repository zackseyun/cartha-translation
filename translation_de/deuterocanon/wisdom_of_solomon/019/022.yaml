base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/022.yaml
  text: For in every way[a], Lord, you magnified your people and glorified them, and you did not overlook them, standing by them at every time and place.
translation:
  language: de
  text: Denn in jeder Hinsicht, Herr, hast du dein Volk groß gemacht und verherrlicht und es nicht übersehen[a] und ihm zu jeder Zeit und an jedem Ort beigestanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du hast es nicht vernachlässigt“. Wörtlich heißt es im Griechischen „du hast es nicht übersehen“, gefolgt von „ihm zur Seite stehend“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Die Wendung κατά mit dem Akkusativ Plural bezeichnet hier umfassende Geltung. „In jeder Hinsicht“ ist natürlich und bewahrt den Bezug auf alle Aspekte von Gottes Handeln.
- source_word: ἐμεγάλυνας
  choice: hast du ... groß gemacht
  rationale: Das Verb bedeutet, jemanden groß zu machen oder zu erhöhen. Die Formulierung ist im heutigen Deutsch verständlicher als „vergrößert“ und bleibt nahe am griechischen Ausdruck.
- source_word: τὸν λαόν σου
  choice: dein Volk
  rationale: λαός bezeichnet im biblischen Griechisch häufig Gottes Volk; „dein Volk“ ist die unmittelbare und sachgerechte Wiedergabe.
- source_word: ἐδόξασας
  choice: verherrlicht
  rationale: Das Verb bezeichnet das Verleihen von Herrlichkeit oder Ehre. „Verherrlicht“ erhält die lexikalische und theologische Gewichtigkeit des griechischen Ausdrucks.
- source_word: οὐχ ὑπερεῖδες
  choice: du hast es nicht übersehen
  rationale: ὑπεροράω kann „übersehen“, „missachten“ oder „vernachlässigen“ bedeuten. „Nicht übersehen“ bildet den griechischen Ausdruck eng ab und lässt seine Bildlichkeit bestehen.
- source_word: ἐν παντὶ καιρῷ καὶ τόπῳ
  choice: zu jeder Zeit und an jedem Ort
  rationale: Die idiomatische deutsche Wendung bewahrt sowohl die zeitliche als auch die räumliche Universalität.
- source_word: παριστάμενος
  choice: sondern ihm ... beigestanden
  rationale: Das Partizip bedeutet wörtlich „dabeistehend“ oder „zur Seite stehend“ und kann unterstützende Gegenwart ausdrücken. „Beigestanden“ gibt diesen Sinn natürlich wieder; „sondern“ macht den im Deutschen sachlich vorhandenen Gegensatz deutlich.
theological_decisions:
- issue: Anrede κύριε
  choice: Herr
  alternative: O Herr
  rationale: κύριε ist die direkte Anrede Gottes. „Herr“ wahrt Würde und Üblichkeit; ein zusätzliches „O“ steht nicht im Griechischen und ist im modernen Deutsch unnötig.
- issue: Unausgesprochenes Bezugsobjekt bei παριστάμενος
  choice: ihm ... beigestanden
  alternative: dabeigestanden / gegenwärtig gewesen
  rationale: Das griechische Partizip nennt kein Objekt ausdrücklich, bezieht sich im Zusammenhang jedoch auf Gottes Volk. Das Pronomen „ihm“ macht diesen Bezug im Deutschen verständlich, ohne eine neue Aussage einzuführen.
- issue: Verhältnis des Partizips zum Hauptverb
  choice: sondern ... beigestanden
  alternative: indem du ... beistandest
  rationale: 'Das Partizip erläutert, wie Gott sein Volk nicht übersah: durch seine unterstützende Gegenwart. Die adversative Formulierung ist idiomatisch, während die Fußnote die engere griechische Konstruktion erkennen lässt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz behält die direkte Gottesrede und den feierlichen Abschlusscharakter bei, vermeidet jedoch altertümliche Wortstellung. Das Semikolon gliedert die beiden parallelen Aussagen.
