  terminology: „Wehklagen“, „Flehen“, „hinaustreiben“ und „Flüchtige“ sind angemessen. „Flüchtige“ gibt φυγάδας kontextgerecht wieder, ohne die moderne, primäre asylrechtliche Konnotation von „Flüchtlinge“ hervorzurufen.
