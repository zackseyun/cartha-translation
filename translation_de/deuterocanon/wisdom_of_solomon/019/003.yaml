base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/003.yaml
  text: For while they still had their mourning in their hands and were still lamenting at the graves of the dead[a], they took up another plan of folly, and those whom they had driven out with pleading[c][b], these they pursued as fugitives.
translation:
  language: de
  text: Denn noch hatten sie die Trauer in den Händen und wehklagten an den Gräbern der Toten[a], als sie einen anderen törichten Plan fassten[b] und gerade diejenigen, die sie unter Flehen hinausgetrieben hatten[c], als Flüchtige verfolgten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hatten die Trauer in den Händen“; das anschauliche Bild meint wohl, dass sie noch mit Trauerhandlungen oder sichtbaren Zeichen der Trauer beschäftigt waren.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „einen anderen unvernünftigen Gedanken“ oder „einen anderen Plan der Torheit“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind dieselben Menschen, die sie zuvor unter Flehen zum Fortgehen gedrängt hatten und die sie anschließend als Flüchtige verfolgten.
    reason: cross_reference
lexical_decisions:
- source_word: ἔτι
  choice: noch
  rationale: Kennzeichnet das Fortdauern der Trauer und ihre zeitliche Überschneidung mit dem neuen Entschluss.
- source_word: ἐν χερσὶν ἔχοντες τὰ πένθη
  choice: hielten sie ihre Trauer in den Händen
  rationale: Bewahrt das auffällige konkrete Bild des Griechischen; wahrscheinlich sind Trauerhandlungen oder sichtbare Zeichen der Trauer gemeint.
- source_word: προσοδυρόμενοι τάφους νεκρῶν
  choice: wehklagten an den Gräbern der Toten
  rationale: „Wehklagen“ gibt die anhaltende, hörbare Totenklage wieder; „an“ formuliert den Bezug zu den Gräbern im Deutschen natürlich.
- source_word: ἕτερον ... λογισμὸν ἀνοίας
  choice: einen weiteren Plan der Torheit
  rationale: „Plan“ erfasst den handlungsbezogenen Sinn von λογισμός, während die Genitivfügung die markante Wertung ἀνοίας erhält.
- source_word: ἐπεσπάσαντο
  choice: griffen ... auf
  rationale: Gibt die mediale Bedeutung wieder, dass sie einen neuen Gedankengang oder Handlungsplan annahmen, ohne das Verb auf bloßes „erdenken“ festzulegen.
- source_word: οὓς ἱκετεύοντες ἐξέβαλον
  choice: die sie unter inständigem Flehen hinausgetrieben hatten
  rationale: Das Flehen begleitet nach der griechischen Syntax das Hinaustreiben; „hinausgetrieben“ wahrt dessen nachdrücklichen Charakter.
- source_word: τούτους ὡς φυγάδας ἐδίωκον
  choice: verfolgten sie nun wie Flüchtige
  rationale: Bewahrt die Ironie, dass die zuvor zum Fortgehen Gedrängten anschließend behandelt wurden, als seien sie eigenmächtig entflohen.
theological_decisions:
- issue: Historisch-theologische Ironie im Umschwung der Verfolger
  choice: Den Gegensatz zwischen flehentlichem Hinaustreiben und anschließender Verfolgung unmittelbar wiedergeben.
  alternative: Die Ereignisse des Exodus, die Plagen oder das Meer im Vers ausdrücklich ergänzen.
  rationale: Der griechische Text trägt die Ironie bereits in ἱκετεύοντες ... ἐξέβαλον und ὡς φυγάδας ἐδίωκον. Zusätzliche Einzelheiten würden über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ungewöhnliche Handbild der Trauer bleibt bewusst erhalten und wird in der Fußnote erläutert. „Flüchtige“ vermeidet die heute vorherrschende sozialpolitische Bedeutung von „Flüchtlinge“ und passt zum Kontext der Verfolgung.
