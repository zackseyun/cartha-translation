  text: And punishments came upon the sinners[a], not without the evidence of what had happened in the violence of the thunderbolts; for they justly suffered for their own wicked acts[b], because they practiced a more grievous hatred of strangers.
translation:
  language: de
  text: Und Strafen kamen über die Sünder, nicht ohne Beweise für das, was durch die Gewalt der Blitze geschehen war[a]; denn zu Recht litten sie wegen ihrer eigenen Bosheiten, denn sie pflegten einen schlimmeren Hass auf Fremde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist die griechische Satzfügung stark verdichtet: „nicht ohne Beweise aus den Geschehnissen, durch die Gewalt der Blitze“. Die genaue Zuordnung von „Beweise“, „Geschehnisse“ und „Gewalt der Blitze“ ist nicht ganz eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: „Hass auf Fremde“ kann auch mit „Fremdenfeindlichkeit“ oder „Ungastlichkeit“ wiedergegeben werden; das griechische Wort kann aktive Feindseligkeit gegenüber Fremden oder Gästen bezeichnen, nicht nur mangelnde Gastfreundschaft.
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμωρίαι
  choice: Strafen
  rationale: Bezeichnet vergeltende Strafmaßnahmen; „Strafen“ ist im modernen Deutsch klar und bewahrt den gerichtlichen Sinn.
- source_word: ἁμαρτωλοῖς
  choice: die Sünder
  rationale: Die substantivierte Bezeichnung wird direkt wiedergegeben und bewahrt die moralische Einordnung des griechischen Textes.
- source_word: οὐκ ἄνευ τῶν γεγονότων τεκμηρίων
  choice: nicht ohne die Beweiszeichen der Geschehnisse
  rationale: τεκμήρια bezeichnet sichere Anzeichen oder Beweise, während γεγονότων auf Geschehenes verweist. Die bewusst knappe Formulierung erhält die verdichtete und mehrdeutige Syntax.
- source_word: τῇ βίᾳ τῶν κεραυνῶν
  choice: in der Gewalt der Blitze
  rationale: βία bezeichnet Gewalt oder Wucht; κεραυνοί sind Blitze beziehungsweise Blitzschläge. Die Formulierung wahrt das anschauliche Bild und die dative Fügung.
- source_word: δικαίως
  choice: zu Recht
  rationale: Gibt die ethisch-gerichtliche Aussage idiomatisch wieder, dass ihr Leiden verdient war.
- source_word: ταῖς ἰδίαις αὐτῶν πονηρίαις
  choice: wegen ihrer eigenen Bosheiten
  rationale: Der griechische Plural bleibt erhalten, ohne ihn ausschließlich auf einzelne Taten oder auf eine abstrakte Wesensart festzulegen.
- source_word: χαλεπωτέραν μισοξενίαν
  choice: eine schlimmere Fremdenfeindlichkeit
  rationale: Der Komparativ χαλεπωτέραν wird ohne zusätzlichen Verstärker wiedergegeben. „Fremdenfeindlichkeit“ bringt die aktive Feindseligkeit von μισοξενία stärker zum Ausdruck als bloße Ungastlichkeit.
- source_word: ἐπετήδευσαν
  choice: praktiziert hatten
  rationale: Das Verb bezeichnet ein bewusst verfolgtes oder zur Gewohnheit gemachtes Verhalten; „praktiziert“ lässt diesen fortgesetzten Charakter erkennen.
theological_decisions:
- issue: Moralische Stärke von μισοξενία
  choice: Fremdenfeindlichkeit
  alternative: Ungastlichkeit; Hass auf Fremde
  rationale: Der Ausdruck bezeichnet mehr als unterlassene Gastfreundschaft und kann aktive Feindseligkeit gegen Fremde oder Gäste meinen. „Fremdenfeindlichkeit“ bewahrt diese Schärfe, ohne eine spezielle Lehrtradition einzutragen.
- issue: Bedeutung des Dativs ταῖς ἰδίαις αὐτῶν πονηρίαις
  choice: 'kausal: wegen ihrer eigenen Bosheiten'
  alternative: 'instrumental: durch ihre eigenen Bosheiten'
  rationale: Im Zusammenhang mit δικαίως ἔπασχον liegt eine Begründung ihres verdienten Leidens nahe; der griechische Dativ erlaubt jedoch auch eine stärker instrumentale Nuance, die in der Fußnote angezeigt wird.
- issue: Verhältnis der beiden γάρ-Sätze
  choice: Der zweite wird mit „hatten sie doch“ begründend an den ersten angeschlossen.
  alternative: denn sie hatten ...
  rationale: Beide γάρ-Partikeln haben begründende Funktion. Die deutsche Fügung vermeidet eine schwerfällige Wiederholung und erhält zugleich den argumentativen Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem biblischem Ton. Die ungewöhnlich verdichtete Beweiszeichen-Blitz-Fügung wurde nicht glatt aufgelöst, damit die echte syntaktische Mehrdeutigkeit des Griechischen sichtbar bleibt. Beide Fußnotenmarker stehen im Haupttext.
