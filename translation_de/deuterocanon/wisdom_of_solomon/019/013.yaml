  rationale: Die Revision klärt die im Deutschen unverständliche Beweis-/Blitz-Fügung, ohne deren im Griechischen bestehende syntaktische Schwierigkeit zu verschweigen; diese wird sachlich in Fußnote a festgehalten. Die Kausalstruktur der beiden γάρ-Sätze bleibt mit zweimaligem „denn“ sichtbar. „Schlimmeren“ bewahrt den nicht weiter bestimmten Komparativ, und „Hass auf Fremde“ vermeidet eine unnötig moderne politische Konnotation. Beide Fußnotenmarker wurden an die jeweils erläuterten Ausdrücke gesetzt.
