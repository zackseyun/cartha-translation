    text: Gemeint sind besondere Speisen zum Genuss und nicht nur Nahrung zur Sättigung; vergleiche die Überlieferung vom Verlangen nach Nahrung in der Wüste in 2. Mose 16 und 4. Mose 11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐφʼ ὑστέρῳ
  choice: Später
  rationale: Die Wendung kennzeichnet einen späteren Abschnitt der erzählten Ereignisse; „Später“ ist knapp, natürlich und sachlich.
- source_word: εἶδον
  choice: sahen sie
  rationale: Die direkte Wiedergabe wahrt den schlichten erzählerischen Charakter des Aorists von ὁράω.
- source_word: νέαν γένεσιν ὀρνέων
  choice: wie Vögel neu entstanden
  rationale: Diese Formulierung gibt γένεσις als neues Hervortreten beziehungsweise Entstehen wieder, ohne eine bestimmte Vogelart einzutragen. Die alternative Deutung als neue Art von Vögeln wird in der Fußnote bewahrt.
- source_word: ὅτε
  choice: als
  rationale: „Als“ leitet im Deutschen natürlich den einmaligen zeitlichen Zusammenhang ein.
- source_word: ἐπιθυμίᾳ προαχθέντες
  choice: von ihrem Verlangen getrieben
  rationale: „Verlangen“ bewahrt den hier negativ gefärbten, aber nicht zwingend auf einen bestimmten Affekt beschränkten Sinn von ἐπιθυμία; „getrieben“ gibt das passive Vorangetriebenwerden durch προαχθέντες wieder.
- source_word: ᾐτήσαντο
  choice: baten
  rationale: Das Verb bezeichnet zunächst ein Erbitten oder Ersuchen. „Baten“ vermeidet die stärkere, im Verb selbst nicht notwendige Bedeutung „forderten“.
- source_word: ἐδέσματα τρυφῆς
  choice: erlesene Speisen zum Genuss
  rationale: ἐδέσματα bezeichnet Speisen, während τρυφή Genuss, Üppigkeit oder Verwöhnung ausdrückt. Die Wendung macht deutlich, dass besondere Speisen aus Genussverlangen und nicht bloß zur Ernährung erbeten wurden.
theological_decisions:
- issue: Moralische Bewertung des Speisewunsches Israels in der Wüste
  choice: „von ihrem Verlangen getrieben“ und „erlesene Speisen zum Genuss“ bewahren die kritische Färbung, ohne die Bitte stärker zu verurteilen, als es die griechischen Wörter verlangen.
  alternative: Eine neutralere Wiedergabe wie „von ihrem Wunsch bewegt“ oder eine schärfere wie „von Gier fortgerissen“ wäre möglich.
  rationale: ἐπιθυμία und τρυφή tragen in diesem Zusammenhang eine wertende Komponente. Die Übersetzung lässt diese erkennen, vermeidet aber eine Übersteigerung zu ausdrücklich sündentheologischer Terminologie.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt erzählerisch klar; ungebräuchliche Nominalbildungen wie „eine neue Entstehung von Vögeln“ werden vermieden. Die Fußnoten sichern die lexikalische Mehrdeutigkeit und den traditionsgeschichtlichen Bezug.
