  text: Later they also saw a new generation of birds[a], when, driven by craving, they asked for delicacies of luxury[b];
translation:
  language: de
  text: Später sahen sie auch neue Vögel entstehen[a], als sie, von Verlangen getrieben, um erlesene Speisen zum Genuss baten[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine neue Art von Vögeln“. Die griechische Wendung kann vor allem ein neues Hervortreten oder Hervorbringen von Vögeln bezeichnen, möglicherweise aber auch eine neue Art.'
    reason: lexical_alternative
