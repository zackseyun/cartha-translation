base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/020.yaml
  text: Fire was strong in water beyond its own power[a], and water forgot its extinguishing power;
translation:
  language: de
  text: Das Feuer war im Wasser über seine eigene Kraft hinaus wirksam[a], und das Wasser vergaß seine löschende Kraft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Feuer war im Wasser mit seiner eigenen Kraft wirksam.“'
    reason: Die Genitivverbindung τῆς ἰδίας δυνάμεως kann statt als Vergleichs- oder Maßangabe auch die dem Feuer eigene Kraft bezeichnen.
lexical_decisions:
- source_word: πῦρ
  choice: das Feuer
  rationale: Die wörtliche Wiedergabe erhält den Gegensatz zwischen den beiden Elementen Feuer und Wasser.
- source_word: ἴσχυεν ἐν ὕδατι
  choice: war im Wasser … mächtig
  rationale: Das Imperfekt ἴσχυεν bezeichnet fortdauernde Wirksamkeit oder Stärke; „mächtig sein“ gibt diese Bedeutung würdig und verständlich wieder, während „im Wasser“ den paradoxen Ort bewahrt.
- source_word: τῆς ἰδίας δυνάμεως
  choice: über seine eigene Kraft hinaus
  rationale: 'Der Genitiv kann als Vergleichs- beziehungsweise Maßangabe zu ἴσχυεν verstanden werden: Das Feuer erwies sich stärker, als es aus eigener Kraft sein konnte. Da die Konstruktion mehrdeutig ist, wird die alternative Zuordnung in einer Fußnote erhalten.'
- source_word: ὕδωρ
  choice: das Wasser
  rationale: Wörtliche Wiedergabe in antithetischer Parallele zu πῦρ.
- source_word: τῆς σβεστικῆς δυνάμεως
  choice: seine löschende Kraft
  rationale: σβεστική bezeichnet die Fähigkeit, Feuer zu löschen. „Löschende Kraft“ ist knapp, natürlich und erhält die Parallelität zu „eigene Kraft“.
- source_word: ἐπελανθάνετο
  choice: vergaß
  rationale: Die wörtliche Personifikation wird beibehalten; das Imperfekt beschreibt das fortdauernde Ausbleiben der gewöhnlichen Wirkung des Wassers.
theological_decisions:
- issue: Personifizierte Darstellung der Elemente im Wunderzusammenhang
  choice: „das Wasser vergaß“
  alternative: „das Wasser verlor seine Fähigkeit zu löschen“
  rationale: Die Personifikation gehört zur poetischen Aussage des Textes und schildert, wie sich die Schöpfung unter göttlichem Wirken entgegen ihren gewöhnlichen Eigenschaften verhält, ohne dies erklärend aufzulösen.
- issue: Deutung des Genitivs τῆς ἰδίας δυνάμεως
  choice: 'Vergleichs- oder Maßangabe: „über seine eigene Kraft hinaus“'
  alternative: 'Zugehörigkeit beziehungsweise wirksame Eigenkraft: „mit seiner eigenen Kraft“'
  rationale: Die griechische Fügung lässt die genaue syntaktische Beziehung offen. Der Haupttext folgt der vergleichenden Deutung, während die Fußnote die traditionelle alternative Zuordnung bewahrt und so die echte Mehrdeutigkeit sichtbar macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener poetischer Personifikation. Die Wortstellung stellt den paradoxen Gegensatz von Feuer und Wasser klar heraus; das abschließende Satzzeichen folgt dem fortlaufenden Zusammenhang.
