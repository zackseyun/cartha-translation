  text: through which those sheltered by your hand passed[a], the whole nation[b], having seen marvelous wonders.
translation:
  language: de
  text: Durch dieses zogen die von deiner Hand Beschirmten[a] als ein ganzes Volk hindurch, nachdem sie erstaunliche Wunderzeichen[b] gesehen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die von deiner Hand geschützt wurden«. Das griechische Wort bezeichnet wörtlich ein Bedecken oder Beschirmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich eine betonte Verbindung zweier Ausdrücke für staunenerregende, außergewöhnliche Zeichen; auch: »wunderbare Zeichen« oder »erstaunliche Wunder«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ οὗ
  choice: Durch dieses … hindurch
  rationale: διά mit dem Genitiv bezeichnet hier den Raum, durch den der Zug führt. Das neutrale Relativpronomen bezieht sich im Zusammenhang auf das zuvor genannte Feld; »dieses« stellt den Rückbezug im Deutschen verständlich her.
- source_word: πανεθνεὶ
  choice: als ein ganzes Volk
  rationale: Das Adverb hebt hervor, dass die Beschirmten gemeinsam in ihrer Gesamtheit als Volk hindurchzogen.
- source_word: διῆλθον
  choice: zogen … hindurch
  rationale: Der Aorist von διέρχομαι bezeichnet das Hindurchziehen. Die deutsche Verbklammer vermeidet die schwerfällige Wiederholung von »durch« unmittelbar beim Verb.
- source_word: οἱ τῇ σῇ σκεπαζόμενοι χειρί
  choice: die von deiner Hand Beschirmten
  rationale: »Beschirmten« bewahrt das Bild des Bedeckens und schützenden Bergens; »deine Hand« bleibt als ausdrückliches Bild für Gottes wirksamen Schutz erhalten.
- source_word: θεωρήσαντες
  choice: und sahen
  rationale: Das aoristische Partizip kann hier als begleitende beziehungsweise eng mit dem Hauptgeschehen verbundene Wahrnehmung wiedergegeben werden. Die Koordination ist im Deutschen natürlicher, ohne eine im Griechischen nicht eindeutig festgelegte zeitliche Abfolge zu erzwingen.
- source_word: θαυμάσια τέρατα
  choice: erstaunliche Wunderzeichen
  rationale: Die Verbindung bezeichnet außergewöhnliche, staunenerregende Zeichen. »Wunderzeichen« bewahrt den Zeichencharakter von τέρατα, während »erstaunliche« die Bedeutung von θαυμάσια aufnimmt.
theological_decisions:
- issue: Bild von Gottes schützender Hand
  choice: »von deiner Hand Beschirmten«
  alternative: »die von dir Beschützten«
  rationale: Die konkrete Rede von Gottes Hand wird nicht zu einer abstrakten Aussage über Schutz verflacht; zugleich gibt »beschirmt« das Bild von σκεπάζω wieder.
- issue: Verhältnis des Partizips θεωρήσαντες zum Hauptverb
  choice: Beiordnung mit »und sahen«
  alternative: »nachdem sie … gesehen hatten«
  rationale: Ein strikt vorzeitiges Verständnis ist möglich, aber nicht zwingend. Die beiordnende Wiedergabe wahrt die Offenheit und verbindet das Sehen eng mit dem Durchzug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Beschirmten« ist leicht gehoben, bleibt aber verständlich und erhält das biblische Schutzbild. Die Satzstellung macht sowohl den gemeinsamen Durchzug des ganzen Volkes als auch das Sehen der Wunderzeichen deutlich.
