lexical_decisions:
- source_word: ἀσεβέσιν
  choice: die Gottlosen
  rationale: Die Bezeichnung meint Menschen, deren Haltung durch Missachtung Gottes geprägt ist. „Gottlose“ bewahrt diesen religiös-moralischen Sinn und passt zum würdevollen Sprachregister.
- source_word: μέχρι τέλους
  choice: bis zuletzt
  rationale: Die Wendung bezeichnet hier den zeitlich äußersten Punkt und trägt zugleich Nachdruck. „Bis zuletzt“ klingt im heutigen Deutsch natürlich und wahrt diese Zuspitzung.
- source_word: ἀνελεήμων
  choice: erbarmungslos
  rationale: Das Adjektiv verneint Erbarmen unmittelbar. „Erbarmungslos“ gibt die Härte des Gerichts prägnant wieder.
- source_word: θυμός
  choice: Zorn
  rationale: Im Gerichtszusammenhang bezeichnet θυμός heftigen, strafenden Zorn. „Zorn“ bewahrt die Intensität, ohne sie unnötig zu steigern.
- source_word: ἐπέστη
  choice: kam über
  rationale: ἐφίστημι kann das Herankommen oder Eintreten einer bedrängenden Macht bezeichnen. Die deutsche Wendung „kam über“ ist natürlich und bildet den Dativ der Betroffenen angemessen ab.
- source_word: προῄδει
  choice: wusste im Voraus
  rationale: Die Wiedergabe macht den zeitlichen Aspekt des vorherigen Wissens klar, ohne die besonderen theologischen Nebenbedeutungen einzutragen, die ein Fachwort wie „vorhererkennen“ annehmen könnte.
- source_word: αὐτῶν καὶ τὰ μέλλοντα
  choice: was sie künftig tun würden
  rationale: Der Genitiv αὐτῶν gehört am natürlichsten zu dem substantivierten τὰ μέλλοντα und bezeichnet ihr Künftiges beziehungsweise ihre künftigen Handlungen. Der folgende Zusammenhang handelt von ihrem bevorstehenden Sinneswandel und ihrer Verfolgung Israels; eine Fußnote hält die allgemeinere Deutung offen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von προῄδει
  choice: „er wusste im Voraus“, ohne Gott ausdrücklich zu nennen
  alternative: „Gott wusste im Voraus“
  rationale: Im Griechischen wird das Subjekt nicht eigens genannt. Der Zusammenhang weist am ehesten auf Gott, doch das Pronomen bewahrt die sprachliche Zurückhaltung des Ausgangstextes.
- issue: Bedeutung von αὐτῶν καὶ τὰ μέλλοντα
  choice: auf die künftigen Handlungen der Gottlosen bezogen
  alternative: 'allgemeiner: „was ihnen bevorstand“ oder „ihre Zukunft“'
  rationale: Syntax und Fortgang des Abschnitts stützen den Bezug auf das, was sie künftig tun würden. Da die Formulierung für sich genommen weiter gefasst werden kann, wird diese Bedeutungsbreite in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die markante Gerichtssprache bleibt erhalten; zugleich werden das unausgesprochene Subjekt und die Bedeutungsbreite der Schlusswendung nicht stillschweigend vereindeutigt.
