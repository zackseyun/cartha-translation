base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/017.yaml
  text: And they also were struck with blindness[a], like those at the doors of the righteous man, when, wrapped in deep darkness[b], each one kept seeking the way through his own door.
translation:
  language: de
  text: Auch sie wurden mit Blindheit geschlagen[a], wie jene an den Türen des Gerechten, als jeder, von unermesslicher Finsternis umhüllt, den Durchgang durch seine eigenen Türen suchte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Angespielt wird auf Genesis 19,11: Die Männer vor Lots Haus wurden mit Blindheit geschlagen und mühten sich vergeblich, den Eingang zu finden.'
    reason: cross_reference
  - marker: b
    text: Der griechische Wortlaut am Versende ist ungewöhnlich und lässt sich wörtlich etwa mit „jeder ging den Durchgang seiner eigenen Türen hinaus“ wiedergeben. Im Zusammenhang ist wahrscheinlich gemeint, dass jeder tastend den Durchgang suchte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγησαν ... ἀορασίᾳ
  choice: wurden mit Blindheit geschlagen
  rationale: Bewahrt die kräftige Passivform von πλήσσω und gibt ἀορασία natürlich als Verlust des Sehvermögens wieder.
- source_word: ὥσπερ ἐκεῖνοι ἐπὶ ταῖς τοῦ δικαίου θύραις
  choice: wie jene an den Türen des Gerechten
  rationale: Folgt der knappen Anspielung des Griechischen, ohne den Namen Lot in den Haupttext einzufügen; der Plural θύραι wird erhalten.
- source_word: ἀχανεῖ ... σκότει
  choice: unermesslicher Finsternis
  rationale: ἀχανής bezeichnet etwas Weites, Unermessliches oder Gähnendes; die ungewöhnliche Bildkraft wird nicht auf bloß „tiefe“ oder „dichte“ Finsternis eingeebnet.
- source_word: περιβληθέντες
  choice: umhüllt
  rationale: Gibt das vollständige Umgeben- oder Eingehülltsein prägnant und idiomatisch wieder.
- source_word: ἕκαστος τῶν αὐτοῦ θυρῶν τὴν δίοδον ἐξῄει
  choice: jeder den Durchgang durch seine eigenen Türen suchten
  rationale: Die griechische Formulierung ist schwierig. „Durchgang“ wahrt δίοδος, „seine eigenen Türen“ den überlieferten Plural; „suchten“ gibt im Kontext den erfolglosen, wiederholten Versuch wieder, statt ein gelungenes Hinausgehen zu behaupten.
theological_decisions:
- issue: Identität des „Gerechten“
  choice: den Titel „der Gerechte“ im Haupttext bewahren
  alternative: Lot ausdrücklich nennen
  rationale: Der griechische Text nennt keinen Eigennamen. Die Anspielung auf Lot wird deshalb nur in der Fußnote erläutert.
- issue: Deutung des schwierigen Schlusssatzes
  choice: als erfolgloses Suchen nach dem Durchgang wiedergeben
  alternative: als tatsächliches Hinausgehen durch die eigenen Türen übersetzen
  rationale: Der Zusammenhang mit Genesis 19,11 spricht für tastendes, erfolgloses Suchen; wegen der sprachlichen Härte wird die Unsicherheit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wendung „unermessliche Finsternis“ und der schwierige Plural „Türen“ bleiben erhalten; die syntaktische Härte des letzten Satzteils wird für die Verständlichkeit behutsam geglättet und in der Fußnote offengelegt.
