  source_fidelity: Die Übersetzung gibt ἐπλήγησαν ... ἀορασίᾳ treffend mit „wurden mit Blindheit geschlagen“ wieder und bewahrt die unbenannte Anspielung auf Lot als „den Gerechten“. Die schwierige Schlusswendung wird vorsichtig als erfolgloses Suchen nach einem Durchgang verstanden; die Fußnote legt die sprachliche Schwierigkeit transparent offen. Der überlieferte Plural „Türen“ bleibt erhalten.
  naturalness: 'Die Satzkonstruktion des Entwurfs ist grammatisch nicht stimmig: Das Singularsubjekt „jeder“ verlangt „suchte“, nicht „suchten“. Mit dieser Korrektur ist der Satz modernes, würdiges Standarddeutsch. „Unermessliche Finsternis“ ist markant, aber als Wiedergabe von ἀχανής vertretbar.'
  terminology: „Blindheit“, „der Gerechte“, „Finsternis“ und „Durchgang“ sind registergerecht und quellennah. Die Erklärung in Anmerkung a identifiziert Lot nur außerhalb des Haupttexts und wahrt damit die Ausdrucksweise des griechischen Textes.
