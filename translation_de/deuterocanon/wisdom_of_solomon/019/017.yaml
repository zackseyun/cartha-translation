    rationale: 'In „als sie, von unermesslicher Finsternis umhüllt, jeder den Durchgang ... suchten“ kollidiert das pluralische „sie/suchten“ mit dem distributiven Singular „jeder“. ἕκαστος verlangt hier im Deutschen eine Singularkonstruktion: „als ... jeder ... suchte“.'
