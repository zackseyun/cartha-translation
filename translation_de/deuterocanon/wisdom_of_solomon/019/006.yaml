base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/006.yaml
  text: For the whole creation[a], in its own kind, was formed anew from above, serving your own commands, so that your children might be kept unharmed.
translation:
  language: de
  text: Denn die ganze Schöpfung wurde je in ihrer eigenen Art von oben her neu gestaltet[a] und diente deinen eigenen Anordnungen, damit deine Kinder unversehrt bewahrt blieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde von Anfang an neu gestaltet“. Das griechische ἄνωθεν kann „von oben her“ oder „von Anfang an“ bedeuten; διετυποῦτο bezeichnet ein Formen, Umgestalten oder Neuordnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλη ἡ κτίσις
  choice: die ganze Schöpfung
  rationale: Die singularische Gesamtbezeichnung meint die gesamte geschaffene Ordnung; „die ganze Schöpfung“ bewahrt sowohl die Form als auch den umfassenden Sinn.
- source_word: ἐν ἰδίῳ γένει
  choice: in ihrer eigenen Art
  rationale: γένος bezeichnet hier Art oder Gattung. Die Wiedergabe vermeidet die philosophisch stärker festgelegte Übersetzung „Natur“ und erhält zugleich das wiederholte ἴδιος.
- source_word: πάλιν ἄνωθεν
  choice: von oben her neu
  rationale: „Neu“ gibt πάλιν im Zusammenhang einer erneuten Gestaltung wieder; „von oben her“ bewahrt die mögliche räumliche beziehungsweise göttliche Nuance von ἄνωθεν. Die ebenfalls mögliche zeitliche Bedeutung wird in der Fußnote genannt.
- source_word: διετυποῦτο
  choice: wurde … neu gestaltet
  rationale: Das Imperfekt Passiv beschreibt die Schöpfung als einem fortschreitenden Umgestaltungsprozess unterworfen. „Gestaltet“ gibt den Gedanken des Formens oder Neuordnens verständlich wieder.
- source_word: ὑπηρετοῦσα
  choice: diente
  rationale: Das Partizip beschreibt, dass die Schöpfung den göttlichen Weisungen dienstbar war; „diente“ ist klar und ohne unnötig kultische Nebenbedeutung.
- source_word: ταῖς ἰδίαις ἐπιταγαῖς
  choice: deinen eigenen Anordnungen
  rationale: Im Kontext richtet sich der possessive Ausdruck an Gott. „Anordnungen“ vermittelt den verbindlichen Charakter von ἐπιταγαί, während „eigenen“ das zweite ἰδίαις ausdrücklich wiedergibt.
- source_word: οἱ σοὶ παῖδες
  choice: deine Kinder
  rationale: παῖδες kann Kinder, Söhne oder Diener bezeichnen. Hier steht Gottes Volk unter seinem Schutz; „Kinder“ wahrt die relationale Bedeutung ohne unnötige geschlechtliche Verengung.
- source_word: φυλαχθῶσιν ἀβλαβεῖς
  choice: unversehrt bewahrt blieben
  rationale: Der passive Konjunktiv nach ἵνα drückt den Zweck des göttlichen Handelns aus. Die Formulierung verbindet den Schutzgedanken von φυλάσσω mit der Schadlosigkeit von ἀβλαβής.
theological_decisions:
- issue: Bedeutung von ἄνωθεν bei der erneuten Gestaltung der Schöpfung
  choice: Im Haupttext steht „von oben her“, wodurch die mögliche Ausrichtung auf Gottes ordnendes Handeln erhalten bleibt.
  alternative: „von Anfang an“ beziehungsweise „von Grund auf“
  rationale: ἄνωθεν kann sowohl „von oben“ als auch „von Anfang an“ bedeuten. Der Kontext göttlicher Anordnungen erlaubt die vertikale beziehungsweise göttliche Nuance, legt sie aber nicht eindeutig fest; deshalb bleibt die zeitliche Deutung in der Fußnote sichtbar.
- issue: Bedeutung von παῖδες für Gottes Volk
  choice: „deine Kinder“
  alternative: „deine Diener“ oder „deine Söhne“
  rationale: Der Ausdruck kann sowohl eine kindliche als auch eine dienende Beziehung bezeichnen. Im Schutzkontext ist „Kinder“ natürlich und inklusiv, ohne die Zugehörigkeit zu Gott konfessionell weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem griechischen Gedankengang nahe, ohne unnatürlich zu wirken. Die Wiederholung von „eigenen“ bildet die zweimalige Verwendung von ἴδιος bewusst ab; die Mehrdeutigkeit von ἄνωθεν wird nicht stillschweigend aufgelöst.
