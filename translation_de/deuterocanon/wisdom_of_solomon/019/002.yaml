translation:
  language: de
  text: Denn nachdem sie selbst[a] ihren Entschluss, sie ziehen zu lassen, zurückgenommen und sie in Eile fortgeschickt hatten, würden sie ihnen nachjagen, nachdem sie es bereut hatten.[b]
