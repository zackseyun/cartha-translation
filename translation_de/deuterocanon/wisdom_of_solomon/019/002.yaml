    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: ihre Haltung … geändert
  rationale: Das Partizip bezeichnet hier eine Umkehr in Haltung oder Vorgehen. Die Wendung ist im Deutschen natürlich und wahrt den Gedanken des Umschwenkens.
- source_word: τοῦ ἀπεῖναι
  choice: dazu, sie fortziehen zu lassen
  rationale: Der substantivierte Infinitiv wird im Exoduszusammenhang auf das Gewähren des Wegzugs bezogen. Die Formulierung macht den kontextuell vorausgesetzten Bezug verständlich, ohne die Beteiligten ausdrücklich zu benennen.
- source_word: μετὰ σπουδῆς
  choice: mit Nachdruck
  rationale: σπουδή kann Eifer, Ernst oder Eile ausdrücken. „Mit Nachdruck“ lässt die Dringlichkeit erkennen, ohne den Sinn ausschließlich auf Geschwindigkeit festzulegen.
- source_word: προπέμψαντες
  choice: auf den Weg geschickt
  rationale: Das Verb bezeichnet das Weitersenden oder Geleitgeben. Diese Wiedergabe erhält die Wegbewegung, ohne ein persönliches Begleiten festzuschreiben.
- source_word: διώξουσιν
  choice: würden sie ihnen nachjagen
  rationale: Im Erzählzusammenhang ist die tatsächliche Verfolgung gemeint. Der deutsche Konjunktiv gibt die Zukunft aus der Perspektive des übergeordneten Zusammenhangs wieder.
- source_word: μεταμεληθέντες
  choice: weil sie es sich anders überlegt hatten
  rationale: Das Partizip bezeichnet ein nachträgliches Bedauern beziehungsweise einen Sinneswandel. Die Formulierung vermeidet eine unnötig theologisch aufgeladene Wiedergabe mit „bereuen“ oder „Buße tun“.
theological_decisions:
- issue: Erzählsujet und unausgesprochene Bezüge
  choice: Die Pronomen bleiben stehen; aus dem Zusammenhang wird deutlich, dass die Ägypter handeln und den Fortgezogenen nachjagen.
  alternative: Die Ägypter und Israel ausdrücklich nennen.
  rationale: Der griechische Text setzt die Bezugsgrößen aus dem Kontext voraus. Die Übersetzung soll verständlich bleiben, aber keine Namen in diesen Vers eintragen, die dort nicht ausdrücklich stehen.
- issue: Bedeutung von μεταμεληθέντες
  choice: als Sinneswandel wiedergegeben
  alternative: als Reue oder Umkehr im religiösen Sinn wiedergeben
  rationale: Der Kontext beschreibt die Rücknahme einer zuvor getroffenen Entscheidung. Eine spezifisch religiöse Bedeutung ist hier nicht erforderlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bewahrt die Vorzeitigkeit der griechischen Aoristpartizipien und lässt die Spannung zwischen dem zunächst nachdrücklichen Entsenden und der anschließenden Verfolgung bestehen.
