  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/009.yaml
  text: For they grazed like horses[a], and skipped about like lambs, praising you, Lord[b], the one who delivered them.
translation:
  language: de
  text: Denn sie weideten wie Pferde[a] und sprangen wie Lämmer umher[b]; dabei priesen sie dich, Herr, der du sie rettest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden wie Pferde geweidet“ beziehungsweise „ernährt“; das griechische Verb kann sowohl das Weiden als auch das Fressen auf der Weide bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hüpften wie Lämmer“; gemeint ist ein lebhaftes, ausgelassenes Springen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεμήθησαν
  choice: weideten sie
  rationale: Die mediale beziehungsweise passive Form bezeichnet das Fressen auf der Weide oder das Geweidetwerden. „weideten“ bewahrt das konkrete Tierbild und ist im Deutschen natürlich.
- source_word: διεσκίρτησαν
  choice: sprangen sie umher
  rationale: Das Verb beschreibt lebhaftes, wiederholtes Springen. „sprangen … umher“ gibt die ausgelassene Bewegung der Lämmer würdig und verständlich wieder.
- source_word: ἀμνοί
  choice: Lämmer
  rationale: Dies ist die direkte und übliche deutsche Entsprechung und erhält das Bild junger, ausgelassen springender Tiere.
- source_word: αἰνοῦντες
  choice: dabei priesen sie
  rationale: Das Präsenspartizip bezeichnet eine begleitende Handlung. „dabei priesen sie“ macht dieses Verhältnis im Deutschen idiomatisch deutlich.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ richtet sich unmittelbar an Gott; „Herr“ ist die etablierte, sachlich passende Wiedergabe.
- source_word: τὸν ῥυόμενον αὐτούς
  choice: der du sie gerettet hast
  rationale: Das substantivierte Partizip steht appositionell zu dem angeredeten „dich“ und bezeichnet Gott als den Retter des Volkes. Die deutsche Anredeform mit „der du“ bewahrt den direkten Gottesbezug; das Perfekt entspricht dem im Kontext vollbrachten Rettungshandeln.
theological_decisions:
- issue: Göttliche Anrede mit κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Der Text spricht Gott unmittelbar im Lob an. „Herr“ ist die übliche und kontextgemäße Wiedergabe, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Zeitbezug des rettenden Handelns in τὸν ῥυόμενον
  choice: der du sie gerettet hast
  alternative: der du sie rettest
  rationale: Das griechische Präsenspartizip kann Gott als den Retter kennzeichnen, während der unmittelbare Zusammenhang auf die bereits erfahrene Rettung Israels zurückblickt. Das deutsche Perfekt stellt diesen Kontextbezug natürlich dar, ohne die bleibende Retterrolle Gottes auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Tiervergleiche und ihre Parallelität bleiben erhalten; das Semikolon gliedert den langen griechischen Satz, und „dabei“ gibt die begleitende Funktion des Partizips natürlich wieder.
