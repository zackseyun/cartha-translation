base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/007.yaml
  text: The cloud that overshadowed the camp was seen[a], and from the water that had stood before them dry land emerged; from the Red Sea came an unhindered road, and from the violent surge a grassy plain.
translation:
  language: de
  text: Zu sehen waren die Wolke, die das Lager überschattete, das Hervortreten trockenen Landes aus dem zuvor vorhandenen Wasser, ein ungehinderter Weg aus dem Roten Meer[a] und eine grasbewachsene Ebene aus der gewaltigen Brandung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Schilfmeer. Der griechische Text lautet hier „Rotes Meer“; daher steht diese Bezeichnung im Haupttext.'
    reason: Alternative Bezeichnung aus dem hebräischen Hintergrund der Exodustradition.
lexical_decisions:
- source_word: σκιάζουσα
  choice: überschattete
  rationale: Das Partizip bezeichnet das Spenden von Schatten beziehungsweise das Überschatten. Die gewählte Form bewahrt das anschauliche Bild der Wolke und klingt im Deutschen natürlich.
- source_word: παρεμβολήν
  choice: Lager
  rationale: Im Zusammenhang des Exodus bezeichnet das Wort das Lager Israels. „Lager“ ist die klare und geläufige deutsche Entsprechung.
- source_word: προϋφεστῶτος ὕδατος
  choice: dem zuvor dort stehenden Wasser
  rationale: Die Perfektpartizipialkonstruktion beschreibt Wasser, das schon vorher vorhanden war und an dieser Stelle stand. „Zuvor dort stehend“ erhält sowohl den zeitlichen als auch den räumlichen Aspekt.
- source_word: ξηρᾶς ἀνάδυσις γῆς
  choice: trockenes Land, das … auftauchte
  rationale: Die Wendung schildert das Hervortreten trockenen Landes aus dem Wasser. Die verbale Wiedergabe ist idiomatisch und bewahrt das Bild des Auftauchens.
- source_word: ἐθεωρήθη
  choice: Zu sehen waren
  rationale: Das Passiv bedeutet „wurde gesehen“ oder „war zu sehen“. Die pluralische deutsche Konstruktion bezieht das Sehen natürlich auf die anschließende Reihe sichtbarer Erscheinungen, ohne den Sinn zu erweitern.
- source_word: ἐρυθρᾶς θαλάσσης
  choice: dem Roten Meer
  rationale: Der griechische Text verwendet ausdrücklich die herkömmliche Bezeichnung „Rotes Meer“. Diese wird im Haupttext direkt wiedergegeben; die aus dem hebräischen Hintergrund bekannte Alternative steht in der Fußnote.
- source_word: ὁδὸς ἀνεμπόδιστος
  choice: ein ungehinderter Weg
  rationale: Die Formulierung bezeichnet einen Weg, der frei von Hindernissen und passierbar ist. „Ungehinderter Weg“ folgt dem konkreten Bild des Griechischen.
- source_word: χλοηφόρον πεδίον
  choice: eine grasbewachsene Ebene
  rationale: Das zusammengesetzte Adjektiv bedeutet „grünes Kraut beziehungsweise Gras tragend“. „Grasbewachsene Ebene“ gibt sowohl die Vegetation als auch die Geländeform anschaulich wieder.
- source_word: κλύδωνος βιαίου
  choice: der gewaltigen Brandung
  rationale: κλύδων bezeichnet bewegte, aufgewühlte Wassermassen oder hohen Wellengang; βίαιος hebt deren Kraft hervor. „Gewaltige Brandung“ ist bildhaft, knapp und dem Kontext angemessen.
theological_decisions:
- issue: Wiedergabe von ἐρυθρᾶς θαλάσσης im Exodusbild
  choice: Rotes Meer
  alternative: Schilfmeer
  rationale: Die vorliegende griechische Quelle sagt ausdrücklich „Rotes Meer“. Die Übersetzung folgt diesem Textbefund, statt eine mögliche hebräische Hintergrundbezeichnung in den Haupttext einzusetzen; „Schilfmeer“ wird als bekannte Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Konstruktion „Zu sehen waren“ bewahrt den beobachtenden Charakter des griechischen Passivs und trägt die bildhafte Aufzählung. Die Ellipse des griechischen Satzes wird im zweiten Satzteil durch „entstand“ behutsam verdeutlicht.
