review_pass:
  verdict: revise
  source_fidelity: Der Haupttext ersetzt das überlieferte δείπνοις („bei/mit Mahlzeiten, Gastmählern“) durch die emendierte Lesart δεινοῖς („schrecklichen“). Die Emendation ist zwar naheliegend, aber der vorgelegte griechische Wortlaut ist schwierig und umstritten; daher sollte die Hauptübersetzung ihn nicht ohne Kennzeichnung ersetzen.
  naturalness: Die deutsche Syntax ist klar und würdig. Eine wörtlichere Wiedergabe von δείπνοις bleibt ebenfalls gut verständlich, auch wenn die Aussage absichtlich bzw. textbedingt unerquicklich bleibt.
  terminology: „An denselben Rechten Anteil hatten“ ist als kontextuelle Wiedergabe von τῶν αὐτῶν ... δικαίων vertretbar. Die Fußnote sollte jedoch die offene Bedeutung stärker bewahren. „Leiden zufügen“ gibt ἐκάκωσαν πόνοις angemessen wieder.
  issues:
  - severity: medium
    issue: Ungekennzeichnete Emendation von δείπνοις zu δεινοῖς im Haupttext
    rationale: Der festgelegte Ausgangstext hat δείπνοις. Die Fußnote legt die Abweichung zwar offen, aber der Haupttext präsentiert die vermutete Emendation als den Text. Bei einer schwierigen bzw. strittigen Lesart soll die Unsicherheit erhalten bleiben; die mögliche Emendation gehört als Alternative in die Anmerkung.
  - severity: low
    issue: Fußnote a legt die Bedeutung von δικαίων zu stark fest
    rationale: „Gemeint ist wahrscheinlich die gleiche rechtliche oder gesellschaftliche Stellung“ ist möglich, aber der Ausdruck kann auch allgemeiner „gerechte Dinge/Ansprüche“ oder gemeinsame Zuwendungen meinen. Eine neutralere Formulierung wahrt die Mehrdeutigkeit.
  revised_text: Doch jene hatten diejenigen, die bereits an denselben Rechten Anteil hatten[a], mit Festlichkeiten aufgenommen und fügten ihnen bei Mahlzeiten Leiden zu[b].
  revised_footnotes:
  - marker: a
    text: 'Kann auch heißen: „an denselben gerechten Dingen“ oder „an denselben Ansprüchen“. Die Wendung ist nicht eindeutig; sie kann gleiche Rechte, Ansprüche oder gemeinsame Zuwendungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der überlieferte griechische Text hat hier ein Wort, das gewöhnlich „bei Mahlzeiten“ oder „mit Gastmählern“ bedeutet. Die Verbindung mit „Leiden“ ist schwierig. Als Emendation wird „schrecklichen“ erwogen; dann ergäbe sich: „schreckliche Leiden“.'
    reason: textual_variant
  revision_rationale: Die Revision bewahrt im Haupttext die überlieferte Lesart δείπνοις und kennzeichnet die gut mögliche, aber nicht im Ausgangstext stehende Emendation δεινοῖς ausschließlich in der Fußnote. Die Wiedergabe von δικαίων als „Rechten“ bleibt erhalten, während die Anmerkung die semantische Offenheit der griechischen Wendung sachlich ausweist.
