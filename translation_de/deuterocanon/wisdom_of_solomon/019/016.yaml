base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/016.yaml
  text: But those who had welcomed with festivities those who had already shared in the same rights afflicted them with terrible sufferings[a][b].
translation:
  language: de
  text: Doch jene hatten die, die bereits an denselben Rechten Anteil hatten[a], mit Festlichkeiten aufgenommen und fügten ihnen schreckliche Leiden zu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „an denselben gerechten Dingen“ oder „an denselben Ansprüchen“. Gemeint ist wahrscheinlich die gleiche rechtliche oder gesellschaftliche Stellung.'
    reason: lexical_alternative
  - marker: b
    text: Der überlieferte griechische Text hat hier ein Wort, das gewöhnlich „bei Mahlzeiten“ oder „mit Gastmählern“ bedeutet. Der Haupttext folgt der wahrscheinlich gemeinten, nur geringfügig anders geschriebenen Lesart „schreckliche Leiden“.
    reason: textual_variant
lexical_decisions:
- source_word: μετὰ ἑορτασμάτων
  choice: mit Festlichkeiten
  rationale: Die Wendung bezeichnet einen feierlichen, festlichen Empfang. Der Plural und der öffentliche Charakter der Aufnahme bleiben erhalten.
- source_word: εἰσδεξάμενοι
  choice: hatten … aufgenommen
  rationale: Das Verb bezeichnet hier gastliche Aufnahme. Das Plusquamperfekt gibt die Vorzeitigkeit des Aoristpartizips gegenüber dem anschließenden Misshandeln natürlich wieder.
- source_word: τοὺς ἤδη τῶν αὐτῶν μετεσχηκότας δικαίων
  choice: die, die bereits an denselben Rechten Anteil hatten
  rationale: μετέχω bedeutet „Anteil haben, teilhaben“; δικαίων kann substantivisch gerechte Ansprüche oder Rechte bezeichnen. Die Formulierung bewahrt den Gedanken gleicher gesellschaftlicher oder rechtlicher Teilhabe, ohne ihn weiter auszudeuten.
- source_word: ἐκάκωσαν
  choice: fügten ihnen … zu
  rationale: Das Verb bedeutet, jemandem Böses anzutun, ihn zu schädigen oder zu misshandeln. Zusammen mit πόνοις ergibt sich im Deutschen natürlich „Leiden zufügen“.
- source_word: πόνοις
  choice: Leiden
  rationale: πόνος kann Mühe, Schmerz, Drangsal oder Leiden bezeichnen. „Leiden“ passt zum Zusammenhang der Unterdrückung und bleibt semantisch angemessen.
- source_word: δείπνοις
  choice: schreckliche
  rationale: Der überlieferte Ausdruck δείπνοις („bei Mahlzeiten/mit Gastmählern“) ergibt zusammen mit πόνοις eine äußerst schwierige Wortverbindung. Der Haupttext folgt der naheliegenden Lesart δεινοῖς („schrecklichen“), die eine minimale Buchstabenabweichung voraussetzt und die verständliche Verbindung „schreckliche Leiden“ ergibt; die Überlieferung wird in der Fußnote offengelegt.
theological_decisions:
- issue: Bedeutung von τῶν αὐτῶν … δικαίων
  choice: Teilhabe an denselben Rechten
  alternative: Teilhabe an denselben gerechten Dingen oder Ansprüchen
  rationale: Der Zusammenhang stellt frühere gastliche Aufnahme und spätere Unterdrückung einander gegenüber. „Rechte“ bringt die ethisch-soziale Dimension zum Ausdruck; wegen der möglichen weiteren Bedeutung von δικαίων wird die Alternative in einer Fußnote genannt.
- issue: Schwierige Lesart δείπνοις vor πόνοις
  choice: Im Haupttext die wahrscheinliche Lesart δεινοῖς („schreckliche“) wiedergeben
  alternative: Den überlieferten Wortlaut als „bei Mahlzeiten/mit Gastmählern“ wiedergeben
  rationale: Die überlieferte Wortfolge „mit/bei Mahlzeiten Leiden“ ist syntaktisch möglich, aber inhaltlich kaum verständlich. Die sehr geringe graphische Differenz zu δεινοῖς und die geläufige Verbindung mit πόνοις stützen die emendierte Lesart. Die Fußnote wahrt textkritische Transparenz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Relativkonstruktion „die, die“ ist idiomatisch und hält die Bezugsstruktur des Griechischen klar. Beide Unsicherheiten des schwierigen Verses werden durch unmittelbar gesetzte Fußnotenmarker transparent gemacht.
