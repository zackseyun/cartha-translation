  text: And not only that[a], but there will be an inspection of them, because they received the foreigners with hostility.
translation:
  language: de
  text: 'Und nicht nur das: Über sie wird eine Heimsuchung kommen[a], weil sie die Fremden feindselig aufnahmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Über sie wird eine Überprüfung ergehen«; das griechische Wort kann auch ein göttliches Eingreifen zum Gericht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον
  choice: nicht nur das
  rationale: Die Wendung führt über den vorherigen Gedanken hinaus und verlangt im Deutschen eine idiomatische Rückverweisung.
- source_word: ἐπισκοπή
  choice: Heimsuchung
  rationale: Das Wort bezeichnet ein Aufsuchen oder eine Überprüfung und kann im Zusammenhang ein göttliches Eingreifen zum Gericht meinen. »Heimsuchung« bewahrt diese gerichtliche Färbung, ohne ausdrücklich »Bestrafung« zu sagen.
- source_word: ἀπεχθῶς
  choice: feindselig
  rationale: Das Adverb beschreibt die ablehnende, von Feindschaft geprägte Art der Aufnahme knapp und natürlich.
- source_word: προσεδέχοντο
  choice: aufgenommen hatten
  rationale: Das Verb bedeutet hier »aufnehmen« oder »bei sich aufnehmen«. Das Plusquamperfekt gibt den begründenden Rückblick im Deutschen natürlich wieder.
- source_word: τοὺς ἀλλοτρίους
  choice: die Fremden
  rationale: Gemeint sind Menschen, die nicht zum eigenen Volk oder Gemeinwesen gehören. »Fremde« ist im Deutschen klar und weniger administrativ als »Ausländer«.
theological_decisions:
- issue: Gerichtliche Bedeutung von ἐπισκοπή
  choice: Über sie wird eine Heimsuchung kommen
  alternative: Sie werden überprüft werden / Über sie wird Strafe kommen
  rationale: Der Zusammenhang legt ein göttliches Gericht nahe, doch das griechische Substantiv nennt die Strafe nicht ausdrücklich. Die Übersetzung lässt daher sowohl den Grundsinn des prüfenden Aufsuchens als auch die gerichtliche Wirkung erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Heimsuchung« ist bewusst etwas gehoben, da es die Mehrdeutigkeit zwischen Aufsuchen, Überprüfung und göttlichem Gericht besser wahrt als eine eindeutige Wiedergabe mit »Strafe«.
