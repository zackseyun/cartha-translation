review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἐπισκοπή als „Heimsuchung“ ist im gerichtlichen Kontext vertretbar und bewahrt die Mehrdeutigkeit gegenüber einer ausdrücklich genannten Strafe. „die Fremden“ trifft τοὺς ἀλλοτρίους angemessen. Das Plusquamperfekt „aufgenommen hatten“ entspricht jedoch nicht dem griechischen Imperfekt προσεδέχοντο, das die frühere fortdauernde bzw. wiederholte Haltung beschreibt, ohne einen Vorzeitigkeitsbezug zu setzen.
  naturalness: Der Satz ist würdevoll und gut verständlich. „Über sie wird eine Heimsuchung kommen“ ist natürliches gehobenes Standarddeutsch; „feindselig aufnahmen“ ist idiomatisch und präziser als das Plusquamperfekt.
  terminology: „Heimsuchung“ ist als markierte, aber etablierte religiös-literarische Bezeichnung passend. Die Fußnote sollte die Alternative als substantivische Wiedergabe formulieren und die gerichtliche Konnotation als mögliche, nicht zwingende Nuance kennzeichnen.
  issues:
  - severity: medium
    issue: Unzutreffendes Plusquamperfekt bei „aufgenommen hatten“
    rationale: προσεδέχοντο steht im Imperfekt. Es beschreibt das Aufnehmen der Fremden in der Vergangenheit, nicht eine gegenüber einem anderen vergangenen Ereignis vorzeitige Handlung. Das Präteritum „aufnahmen“ gibt dies ohne zusätzliche zeitliche Einordnung wieder.
  - severity: low
    issue: Fußnotenalternative ist stilistisch unnötig umständlich
    rationale: „Sie werden einer Überprüfung unterzogen werden“ wechselt zu einer passivischen Verbalkonstruktion und entfernt sich von der Nominalstruktur des griechischen ἐπισκοπή. „Eine Überprüfung wird über sie kommen“ bzw. besser „Über sie wird eine Überprüfung ergehen“ hält die Alternative klarer als alternative Auslegung erkennbar.
  revised_text: 'Und nicht nur das: Über sie wird eine Heimsuchung kommen[a], weil sie die Fremden feindselig aufnahmen.'
  revised_footnotes:
