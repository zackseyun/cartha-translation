  terminology: »aufnehmen«, »Wohltäter« und besonders »versklavten« sind treffende moderne Wiedergaben von ἐδέχοντο, εὐεργέτας und ἐδουλοῦντο. »jene ... diese aber« erhält die griechische Gegenüberstellung, ohne die Gruppen zu identifizieren.
