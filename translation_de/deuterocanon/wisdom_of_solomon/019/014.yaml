  text: For they did not welcome those who were present as strangers[c][b][a], but these enslaved foreign benefactors.
translation:
  language: de
  text: Denn jene nahmen die ihnen Unbekannten, die bei ihnen waren, nicht auf; diese aber versklavten fremde Wohltäter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ μὲν ... οὗτοι δὲ
  choice: jene ... diese aber
  rationale: Bewahrt den knappen Gegensatz zwischen zwei Gruppen, ohne sie über den Wortlaut des Verses hinaus ausdrücklich zu benennen.
- source_word: τοὺς ἀγνοοῦντας
  choice: Menschen, die sie nicht kannten
  rationale: Gibt das substantivierte Partizip nahe am griechischen Wortlaut wieder und lässt den sozialen Sinn »Fremde« mitschwingen, ohne ihn zur einzigen Deutung zu machen.
- source_word: οὐκ ἐδέχοντο
  choice: nahmen ... nicht auf
  rationale: Im Zusammenhang der Gastfreundschaft bezeichnet das Verb nicht bloß Annahme, sondern die verweigerte Aufnahme von Ankommenden.
- source_word: παρόντας
  choice: obwohl sie zu ihnen gekommen waren
  rationale: Das Partizip bedeutet wörtlich »anwesend« oder »zugegen«. Die Formulierung macht in natürlichem Deutsch deutlich, dass diese Menschen tatsächlich bei ihnen eingetroffen waren; der konzessive Zusammenhang wird aus der Satzfügung erschlossen.
- source_word: εὐεργέτας
  choice: Wohltäter
  rationale: 'Bewahrt die moralische Ironie: Versklavt wurden gerade Menschen, die Gutes getan beziehungsweise Hilfe erwiesen hatten.'
- source_word: ξένους
  choice: aus der Fremde
  rationale: Kennzeichnet die Wohltäter als Außenstehende beziehungsweise Fremde und vermeidet die im Deutschen mögliche Bedeutung, sie seien sonderbar gewesen.
- source_word: ἐδουλοῦντο
  choice: versklavten
  rationale: Gibt die gewaltsame Herabsetzung in den Sklavenstand klar und knapp wieder.
theological_decisions:
- issue: Historische Zuordnung der beiden verglichenen Gruppen
  choice: Die Gruppen bleiben als »jene« und »diese« unbenannt.
  alternative: Die erste Gruppe als Bewohner Sodoms und die zweite als Ägypter ausdrücklich bezeichnen.
  rationale: Der weitere Zusammenhang legt diese Zuordnung nahe, doch der griechische Vers selbst verwendet nur die Gegenüberstellung οἱ μὲν ... οὗτοι δὲ. Die Übersetzung fügt daher keine Namen ein.
- issue: Verhältnis von Fremdheit und Wohltat
  choice: ξένους wird als Herkunft beziehungsweise Außenseiterstatus der Wohltäter wiedergegeben.
  alternative: »fremde Wohltäter« oder »Wohltäter, die Fremde waren«
  rationale: 'Die gewählte Formulierung erhält den Gegensatz: Die Betroffenen waren zwar Fremde, hatten sich jedoch als Wohltäter erwiesen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarige Gegenüberstellung »jene ... diese aber« hält die rhetorische Struktur des Griechischen fest. »Versklavten« ist bewusst deutlich; die im Ausgangstext nicht ausdrücklich genannten historischen Gruppen werden nicht ergänzt.
