  source_fidelity: 'Der Entwurf gibt den Grundkontrast und die Versklavung von Wohltätern zutreffend wieder. »obwohl sie zu ihnen gekommen waren« ist jedoch keine sichere Wiedergabe von παρόντας: Das griechische Partizip besagt nur, dass die ihnen Unbekannten anwesend waren, ohne weder ein konzessives Verhältnis noch ein vorheriges Ankommen ausdrücklich zu behaupten. »aus der Fremde« ist für ξένους enger als nötig; »fremde Wohltäter« bewahrt die offene Bezeichnung als Außenstehende besser.'
