translation:
  language: de
  text: Denn Landtiere wurden zu Wassertieren[a], und Schwimmtiere gingen aufs Land hinüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Landwesen verwandelten sich in Wasserwesen, und schwimmende Wesen gingen aufs Land hinüber.“'
    reason: Die substantivierten griechischen Adjektive können allgemeiner mit „Landwesen“, „Wasserwesen“ und „schwimmende Wesen“ wiedergegeben werden; zudem lässt die mediale oder passive Verbform sowohl „verwandelten sich“ als auch „wurden zu“ zu.
lexical_decisions:
- source_word: χερσαῖα
  choice: Landtiere
  rationale: Das substantivierte Adjektiv bezeichnet hier Lebewesen des trockenen Landes. „Landtiere“ gibt den Gegensatz zum Lebensraum Wasser knapp und natürlich wieder.
- source_word: ἔνυδρα
  choice: Wassertiere
  rationale: Das substantivierte Adjektiv bezeichnet im Wasser lebende Wesen. „Wassertiere“ bewahrt den parallelen Gegensatz zu „Landtiere“.
- source_word: μετεβάλλετο
  choice: wurden zu
  rationale: Die imperfektische mediale oder passive Form beschreibt einen sich vollziehenden Wandel. „Wurden zu“ wahrt die Aussage des Textes, ohne den Vorgang näher zu erklären.
- source_word: νηκτά
  choice: Schwimmtiere
  rationale: Das substantivierte Adjektiv bezeichnet Wesen, die schwimmen. „Schwimmtiere“ erhält diese Charakterisierung und die Parallelität der beiden Satzhälften.
- source_word: μετέβαινεν
  choice: gingen … hinüber
  rationale: Das Verb bezeichnet den Übergang von einem Bereich in einen anderen. „Gingen aufs Land hinüber“ bringt diese räumliche Bewegung idiomatisch zum Ausdruck.
- source_word: γῆς
  choice: Land
  rationale: Im Gegensatz zum Wasser bezeichnet γῆ hier das Land als Lebensraum; „aufs Land“ ist im Deutschen die natürliche Formulierung.
theological_decisions:
- issue: Art des beschriebenen Wandels in der Schöpfung
  choice: Der Text beschreibt einen Wandel der Landtiere zu Wassertieren und den Übergang von Schwimmtieren aufs Land, ohne den Vorgang naturkundlich oder allegorisch zu erklären.
  alternative: Die Aussage entweder als buchstäbliche Verwandlung von Arten oder lediglich als bildhafte Beschreibung ungewöhnlichen Verhaltens festlegen.
  rationale: Die griechische Formulierung behauptet einen Wandel beziehungsweise Austausch der Lebensbereiche, lässt dessen genaue Art jedoch offen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Parallelstruktur. Die knappen Zusammensetzungen „Landtiere“, „Wassertiere“ und „Schwimmtiere“ sind allgemein verständlich und entsprechen dem Gegensatz der griechischen substantivierten Adjektive.
