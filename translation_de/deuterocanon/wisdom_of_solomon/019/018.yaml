  to: Denn die Elemente wurden untereinander neu geordnet, wie bei einem Saiteninstrument die Töne des Rhythmus ihre Bezeichnung wechseln[a], und blieben doch im Klang stets dieselben. Das lässt sich aus dem Anblick dessen, was geschehen ist, genau erschließen.[b]
  rationale: Die Revision gibt die passive Form von μεθαρμοζόμενα wieder und ordnet „blieben“ syntaktisch den „Elementen“ zu, entsprechend dem Neutrum Plural von μένοντα. Zugleich bleibt die merkwürdige Verbindung „im Klang“ als Bestandteil des bewusst verdichteten musikalischen Bildes erhalten. Die Fußnotenanker und ihr Bezug bleiben unverändert.
