base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/018.yaml
  text: For the elements[a], changing among themselves, as in a harp the notes of the melody alter the name, while always remaining in the sound[b], as may be accurately inferred from the sight of what happened.
translation:
  language: de
  text: Denn die Elemente wurden untereinander neu geordnet, wie bei einem Saiteninstrument die Töne des Rhythmus ihre Bezeichnung wechseln[a], und blieben doch im Klang stets dieselben. Das lässt sich aus dem Anblick dessen, was geschehen ist, genau erschließen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihren Namen wechseln“. Der griechische musikalische Vergleich ist stark verdichtet und in seiner genauen Aussage nicht völlig eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Das lässt sich aus der Beobachtung der Geschehnisse genau erkennen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: στοιχεῖα
  choice: Elemente
  rationale: Der Zusammenhang beschreibt die bei den Exodusereignissen veränderte geschaffene Ordnung. „Elemente“ bleibt konkret, ohne daraus personhafte kosmische Mächte oder ein bestimmtes philosophisches System zu machen.
- source_word: μεθαρμοζόμενα
  choice: ordneten sich untereinander neu
  rationale: Das Partizip bezeichnet ein Neuordnen, Umstimmen oder wechselseitiges Anpassen. Die Formulierung gibt die gegenseitige Neukonfiguration wieder und lässt zugleich den musikalischen Vergleich anklingen.
- source_word: ψαλτηρίῳ
  choice: Saiteninstrument
  rationale: Das griechische ψαλτήριον bezeichnet ein gezupftes Saiteninstrument. Der allgemein verständliche Ausdruck vermeidet eine unsichere Gleichsetzung mit einem bestimmten modernen Instrument.
- source_word: φθόγγοι
  choice: Töne
  rationale: Im musikalischen Bild sind unterscheidbare Töne gemeint; „Töne“ ist im Deutschen natürlicher als „Laute“ und weniger schriftbezogen als „Noten“.
- source_word: τοῦ ῥυθμοῦ
  choice: des Rhythmus
  rationale: Die direkte Wiedergabe bewahrt die Vorstellung einer geordneten musikalischen Bewegung, ohne den Ausdruck enger als „Melodie“ auszulegen.
- source_word: τὸ ὄνομα διαλλάσσουσιν
  choice: ihre Bezeichnung wechseln
  rationale: Wörtlich ist vom Wechseln des „Namens“ die Rede. „Bezeichnung“ macht den schwierigen Gedanken im Deutschen verständlich, ohne ihn zu einer Wesensveränderung umzudeuten.
- source_word: πάντοτε μένοντα ἤχῳ
  choice: doch stets Klang bleiben
  rationale: Die knappe und schwierige Wendung hält Veränderung und Kontinuität zusammen. Die Übersetzung bewahrt diese Spannung, ohne erklärend „dieselben“ oder „unverändert“ hinzuzusetzen.
- source_word: ὅπερ ἐστὶν εἰκάσαι ... ἀκριβῶς
  choice: Das lässt sich ... genau erschließen
  rationale: εἰκάσαι bezeichnet ein folgerndes Erkennen; ἀκριβῶς qualifiziert dieses als genau. Der deutsche Satz bindet die Aussage klar an die beobachteten Ereignisse zurück.
- source_word: ἐκ τῆς τῶν γεγονότων ὄψεως
  choice: aus dem Anblick dessen, was geschehen ist
  rationale: Die Formulierung bewahrt die visuelle Bedeutung von ὄψις und gibt τὰ γεγονότα als die zuvor erzählten Geschehnisse wieder.
theological_decisions:
- issue: Deutung der Elemente und des musikalischen Vergleichs
  choice: Die Naturbestandteile werden als innerhalb der geschaffenen Ordnung neu geordnet dargestellt.
  alternative: στοιχεῖα als personhafte Elementarmächte oder als fest umrissene metaphysische Prinzipien zu verstehen.
  rationale: Der unmittelbare Kontext verweist auf wahrnehmbare Veränderungen der Natur bei den Exodusereignissen. Eine konkretere Wiedergabe wahrt diesen Zusammenhang, ohne mögliche weitere Resonanzen dogmatisch auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der ungewöhnliche musikalische Vergleich bleibt in seiner Spannung zwischen Veränderung und fortdauerndem Klang erhalten; die Syntax wurde nur so weit geglättet, wie es für gewöhnliche heutige Leser nötig ist.
