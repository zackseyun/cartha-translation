translation:
  language: de
  text: damit dein Volk eine außergewöhnliche Reise erleben sollte, jene aber einen fremdartigen Tod finden sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαός σου
  choice: dein Volk
  rationale: Die übliche Wiedergabe von λαός mit Possessivpronomen; im Zusammenhang ist Gottes Volk gemeint.
- source_word: παράδοξον
  choice: außergewöhnliche
  rationale: Das Wort bezeichnet etwas Unerwartetes, Erstaunliches oder Außerordentliches. „Außergewöhnlich“ bewahrt diese Bedeutungsbreite, ohne die positive Wertung zu überzeichnen.
- source_word: ὁδοιπορίαν
  choice: Reise
  rationale: Bezeichnet eine Reise oder das Unterwegssein; „Reise“ ist im Deutschen natürlich und passt zum geschichtlichen Zusammenhang.
- source_word: πειράσῃ
  choice: erlebte
  rationale: πειράομαι kann hier bedeuten, etwas zu erfahren oder durchzumachen. „Erlebte“ vermeidet den irreführenden Eindruck, das Volk habe die Reise lediglich versucht.
- source_word: ἐκεῖνοι
  choice: jene
  rationale: Das Demonstrativpronomen hebt den Gegensatz zu „dein Volk“ hervor, ohne ausdrücklich „Männer“ oder „Ägypter“ in den Text einzutragen.
- source_word: ξένον
  choice: ungewöhnlichen
  rationale: ξένος kann „fremd“, „seltsam“ oder „ungewöhnlich“ bedeuten. Bei „Tod“ klingt „ungewöhnlich“ natürlich und bewahrt den unheilvollen Kontrast.
- source_word: εὕρωσι
  choice: fanden
  rationale: Die wörtliche Wiedergabe ist auch im Deutschen verständlich und erhält die knappe, markante Formulierung.
- source_word: θάνατον
  choice: Tod
  rationale: Entspricht der gewöhnlichen Bedeutung des griechischen Wortes, ohne es verallgemeinernd als „Vernichtung“ wiederzugeben.
theological_decisions:
- issue: Gegensatz zwischen Gottes Volk und den anderen
  choice: 'Der Vers wird als scharfer Gegensatz formuliert: Gottes Volk erlebt eine außergewöhnliche Reise, jene finden dagegen einen ungewöhnlichen Tod.'
  alternative: Beide Adjektive mit demselben deutschen Wort wiedergeben, etwa „seltsame Reise“ und „seltsamer Tod“.
  rationale: Der griechische Text verwendet zwei verschiedene Adjektive, παράδοξον und ξένον. Die gewählte Wiedergabe wahrt sowohl ihre Unterscheidung als auch den Gegensatz zwischen wunderbarer Rettung und befremdlichem Tod.
- issue: Zeitform der abhängigen griechischen Konjunktive
  choice: Im Deutschen wird der erzählte Sachverhalt in der Vergangenheit wiedergegeben.
  alternative: 'Die Abhängigkeit vom vorangehenden Finalsatz sichtbar machen: „damit … erleben … finden sollten“.'
  rationale: Die isolierte Verswiedergabe soll als vollständiger deutscher Satz verständlich sein. Der inhaltliche Rückblick auf die Ereignisse wird mit dem Präteritum natürlich ausgedrückt; die syntaktische Verknüpfung mit dem vorausgehenden Vers bleibt eine kontextuelle Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und „jene aber“ bewahren den ausgeprägten griechischen Gegensatz μὲν … δέ. „Außergewöhnlich“ und „ungewöhnlich“ unterscheiden die beiden griechischen Adjektive, ohne ihre Bedeutungsnähe ganz zu verdecken.
