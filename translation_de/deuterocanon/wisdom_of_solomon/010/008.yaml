  source_fidelity: Die Grundstruktur und die wesentlichen Begriffe sind treffend wiedergegeben. Die abschließende ἵνα-Konstruktion ist jedoch eine Finalkonstruktion und sollte nicht als bloße vergangene Folgerung („So konnten“) formuliert werden. Außerdem gibt „mit dem, worin“ den lokalen/sachlichen Bezug von ἐν οἷς weniger genau wieder.
  naturalness: Die Fassung ist überwiegend modernes, würdiges Deutsch. „der Menschenwelt“ ist verständlich, aber weniger idiomatisch als „der Welt der Menschen“. Eine final eingeleitete Schlussaussage liest sich zugleich klarer und näher am Griechischen.
  terminology: „Weisheit“, „Schaden“, „was gut ist“, „Torheit“ und „Denkmal“ sind angemessen. „Denkmal“ bewahrt den öffentlichen und bleibenden Charakter von μνημόσυνον. Die Fußnote wahrt die lexikalische Weite von βίος.
