  to: Denn weil sie an der Weisheit vorbeigingen, nahmen sie nicht nur dadurch Schaden, dass sie nicht erkannten, was gut ist, sondern hinterließen auch der Welt der Menschen[a] ein Denkmal ihrer Torheit, damit sie in dem, worin sie fehlgingen, nicht einmal unbemerkt bleiben können.
