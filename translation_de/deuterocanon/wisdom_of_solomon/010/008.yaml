    text: 'Oder: »dem menschlichen Leben«. Das griechische Wort kann das Leben beziehungsweise die Lebenswelt der Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παροδεύσαντες
  choice: weil sie an der Weisheit vorbeigingen
  rationale: Bewahrt das Bild des Vorübergehens und lässt zugleich die kontextuelle Bedeutung des Missachtens erkennen.
- source_word: ἐβλάβησαν
  choice: nahmen sie ... Schaden
  rationale: Gibt das passive Erleiden von Schaden natürlich und in seiner moralisch-praktischen Weite wieder.
- source_word: τοῦ μὴ γνῶναι τὰ καλά
  choice: dadurch ..., dass sie nicht erkannten, was gut ist
  rationale: Gibt den Bezug des substantivierten Infinitivs verständlich wieder; τὰ καλά bleibt ethisch weit gefasst.
- source_word: τῆς ἀφροσύνης
  choice: ihrer Torheit
  rationale: Bezeichnet ihren Mangel an Einsicht mit dem im Deutschen passenden moralischen Gewicht.
- source_word: ἀπέλιπον
  choice: hinterließen
  rationale: Drückt aus, dass ein bleibendes Zeugnis ihres Handelns zurückblieb.
- source_word: τῷ βίῳ
  choice: der Menschenwelt
  rationale: Der Dativ bezeichnet wahrscheinlich den Bereich menschlichen Lebens beziehungsweise die Gemeinschaft der Lebenden, der das Denkmal hinterlassen wurde.
- source_word: μνημόσυνον
  choice: ein Denkmal
  rationale: Bewahrt den Gedanken eines dauerhaften, öffentlich wahrnehmbaren Erinnerungszeichens.
- source_word: ἔσφαλησαν
  choice: fehlgingen
  rationale: Vermittelt sowohl Irrtum als auch moralisches Versagen, ohne die Bildlichkeit unnötig zu verstärken.
- source_word: μηδὲ λαθεῖν δυνηθῶσιν
  choice: nicht einmal unbemerkt bleiben konnten
  rationale: Gibt die Konstruktion mit λανθάνω idiomatisch und präzise wieder.
theological_decisions:
- issue: Ethische Bedeutung von τὰ καλά
  choice: was gut ist
  alternative: was edel ist; die guten Dinge
  rationale: Die Formulierung wahrt den ethischen Sinn, ohne ihn auf eine bestimmte philosophische oder konfessionelle Deutung festzulegen.
- issue: Bezug von ἐν οἷς
  choice: gerade mit dem, worin sie fehlgingen
  alternative: in den Dingen, in denen sie fehlgingen
  rationale: Die deutsche Fassung erhält den sachlichen Bezug und die pointierte Aussage, dass ihr eigenes Fehlverhalten sie öffentlich kenntlich machte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Metaphern des Vorbeigehens und des Denkmals bleiben erhalten; der komplexe griechische Satzbau wird behutsam gegliedert, ohne die kausale und finale Verknüpfung aufzugeben.
