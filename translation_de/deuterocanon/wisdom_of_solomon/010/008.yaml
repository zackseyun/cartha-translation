base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/008.yaml
  text: For by passing wisdom by[a], they were harmed not only by not knowing what is good, but they also left behind for life a memorial of their folly, so that in the things in which they went astray they might not even be able to escape notice.
translation:
  language: de
  text: Denn weil sie an der Weisheit vorbeigingen, nahmen sie nicht nur dadurch Schaden, dass sie nicht erkannten, was gut ist, sondern hinterließen auch der Welt der Menschen[a] ein Denkmal ihrer Torheit, damit sie in dem, worin sie fehlgingen, nicht einmal unbemerkt bleiben können.
  philosophy: optimal-equivalence
  footnotes:
