  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/012.yaml
  text: She protected him from enemies[a], and from those lying in ambush she kept him safe; and she awarded him a strong contest[b], so that he might know that godliness is stronger than everything.
translation:
  language: de
  text: Sie beschützte ihn vor Feinden und hielt ihn vor denen, die ihm auflauerten, in Sicherheit. In einem schweren Kampf sprach sie ihm den Preis zu[a], damit er erkenne, dass Gottesfurcht[b] stärker ist als alles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie teilte ihm einen schweren Wettkampf zu.“ Das griechische Verb gehört zur Bildwelt des Schiedsrichters und der Preisvergabe; seine Verbindung mit „schwerer Kampf“ lässt mehr als eine Deutung zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Frömmigkeit“. Das griechische Wort bezeichnet ehrfürchtige Hingabe an Gott, die sich im Leben zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφύλαξεν
  choice: beschützte
  rationale: Das Verb bezeichnet das Bewahren oder Schützen vor Gefahr; „beschützte“ ist im modernen Deutsch natürlich und passt zur anschließenden ἀπό-Konstruktion.
- source_word: ἐχθρῶν
  choice: Feinden
  rationale: Die übliche und sachlich genaue Wiedergabe für feindlich gesinnte Personen.
- source_word: ἐνεδρευόντων
  choice: denen, die ihm auflauerten
  rationale: Die Formulierung erhält das konkrete Bild eines gelegten Hinterhalts und ist idiomatischer als „Hinterhalt Legenden“.
- source_word: ἠσφαλίσατο
  choice: bewahrte ihn sicher
  rationale: Das Medium drückt hier aus, dass sie ihn in Sicherheit brachte beziehungsweise sicher erhielt; die deutsche Wendung wahrt zugleich den Parallelismus.
- source_word: ἀγῶνα ἰσχυρὸν
  choice: in einem schweren Kampf
  rationale: ἀγών kann Wettkampf, Kampf oder Ringen bezeichnen; ἰσχυρός hebt dessen Härte hervor. „Schwerer Kampf“ bewahrt die metaphorische Breite und klingt natürlich.
- source_word: ἐβράβευσεν αὐτῷ
  choice: sprach ihm den Preis zu
  rationale: Das Verb gehört zur Bildwelt des Schiedsrichters und der Preisvergabe. Diese Wiedergabe macht das Wettkampf-und-Preis-Bild deutlich, ohne daraus lediglich ein Verleihen des Kampfes zu machen.
- source_word: ἵνα γνῷ
  choice: damit er erkannte
  rationale: Die Formulierung gibt den Zwecksatz wieder; „erkannte“ bezeichnet hier ein durch Erfahrung gewonnenes Wissen.
- source_word: παντὸς δυνατωτέρα
  choice: stärker ist als alles
  rationale: Der Komparativ mit Genitiv bezeichnet die Überlegenheit gegenüber allem; die Wiedergabe ist direkt und wahrt den umfassenden Anspruch.
- source_word: εὐσέβεια
  choice: Gottesfurcht
  rationale: εὐσέβεια meint ehrfürchtige, im Leben verwirklichte Hinwendung zu Gott. „Gottesfurcht“ ist verständlich und religiös prägnant, ohne bloße Angst auszudrücken.
theological_decisions:
- issue: Bezug des unausgesprochenen femininen Subjekts
  choice: „Sie“ als Rückbezug auf die personifizierte Weisheit
  alternative: Das Subjekt ausdrücklich als „die Weisheit“ wiederholen
  rationale: Die griechischen Verben führen das feminine Subjekt aus dem Kontext fort. „Sie“ erhält die Personifikation, ohne im Vers mehr ausdrücklich zu benennen als der Ausgangstext.
- issue: Bedeutung von ἐβράβευσεν im Verhältnis zu ἀγῶνα ἰσχυρόν
  choice: „sprach ihm in einem schweren Kampf den Preis zu“
  alternative: „teilte ihm einen schweren Kampf zu“
  rationale: Das Verb enthält Schiedsrichter- beziehungsweise Preisvergabe-Bildsprache. Die gewählte Fassung bewahrt diese Bildwelt und vermeidet die schwer verständliche Vorstellung, der Kampf selbst werde als Preis verliehen; die alternative grammatische Verknüpfung bleibt in der Fußnote sichtbar.
- issue: Bedeutungsumfang von εὐσέβεια
  choice: „Gottesfurcht“
  alternative: „Frömmigkeit“
  rationale: „Gottesfurcht“ vermittelt ehrfürchtige Gottesbezogenheit in einer heute verständlichen biblischen Ausdrucksweise; „Frömmigkeit“ betont stärker deren gelebte religiöse Praxis.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze erhalten den erzählerischen Fluss. Die konkrete Hinterhaltsbildsprache sowie die Mehrdeutigkeit der Wettkampf-und-Preis-Metapher werden bewahrt; seltene oder missverständliche Alternativen stehen in Fußnoten.
