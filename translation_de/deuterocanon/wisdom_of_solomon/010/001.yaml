base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/001.yaml
  text: She guarded the first-formed father of the world[a], when he alone had been created, and she delivered him from his own transgression[b],
translation:
  language: de
  text: Sie bewahrte den zuerst geformten Vater der Welt[a], der allein erschaffen worden war, und rettete ihn aus seiner eigenen Verfehlung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der erste Mensch, Adam.
    reason: cross_reference
  - marker: b
    text: 'Auch möglich: „aus seiner eigenen Übertretung“ oder „aus seinem eigenen Fehltritt“. „Aus seinem eigenen Sündenfall“ wäre stärker deutend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὕτη
  choice: Sie
  rationale: Das feminine Demonstrativpronomen verweist auf die zuvor personifizierte Weisheit. „Sie“ wahrt diesen Rückbezug, ohne den im Vers nicht wiederholten Namen einzufügen.
- source_word: πρωτόπλαστον
  choice: zuerst geformten
  rationale: Die Wendung bewahrt das im Kompositum enthaltene Motiv des Formens und klingt im Deutschen natürlicher als „erstgeformten“.
- source_word: πατέρα κόσμου
  choice: Vater der Welt
  rationale: Die formal nahe Wiedergabe erhält die erhabene und zugleich mehrdeutige Ausdrucksweise des Griechischen; gemeint ist Adam als Stammvater der Menschheit.
- source_word: μόνον κτισθέντα
  choice: der allein erschaffen worden war
  rationale: Der Relativsatz gibt den aoristischen Passivpartizipialausdruck idiomatisch wieder und bezieht „allein“ auf seinen Zustand bei der Erschaffung.
- source_word: διεφύλαξεν
  choice: bewahrte
  rationale: Das Verb bezeichnet schützendes Erhalten oder Behüten. „Bewahrte“ passt zum würdigen Register und lässt die Art des Schutzes offen.
- source_word: ἐξείλατο
  choice: rettete
  rationale: Das Medium bedeutet hier retten oder befreien. „Rettete“ ist im modernen Deutsch klar und gibt die persönliche Schutzhandlung natürlich wieder.
- source_word: παραπτώματος ἰδίου
  choice: aus seiner eigenen Verfehlung
  rationale: „Verfehlung“ bildet die Grundvorstellung eines Fehltritts ab, ohne mit „Sündenfall“ eine spätere theologische Fachbezeichnung in den Text einzutragen; „seiner eigenen“ wahrt die Betonung durch ἰδίου.
theological_decisions:
- issue: Identität des „zuerst geformten Vaters der Welt“
  choice: Adam ist gemeint, wird aber wie im griechischen Haupttext nicht ausdrücklich genannt.
  alternative: Den Namen „Adam“ unmittelbar in den Haupttext aufnehmen.
  rationale: Die beschreibende Formulierung gehört zur literarischen Darstellung. Eine Fußnote klärt den Bezug, ohne den Ausgangstext auszuweiten.
- issue: Bedeutung von παραπτώματος
  choice: Verfehlung
  alternative: Übertretung; Fehltritt; Sündenfall
  rationale: „Verfehlung“ wahrt den moralischen Gehalt und die Bildnähe eines falschen Schrittes. „Sündenfall“ wäre stärker dogmatisch festgelegt, als es das griechische Wort für sich genommen verlangt.
- issue: Aussage, dass die Weisheit Adam aus seiner eigenen Verfehlung rettete
  choice: Die auffällige Aussage bleibt ohne harmonisierende Erklärung stehen.
  alternative: Die Rettung ausdrücklich als Bewahrung vor der Verfehlung oder als Befreiung von deren Folgen deuten.
  rationale: Die Präposition ἐκ bezeichnet „aus“ beziehungsweise „heraus aus“. Der Text soll die damit verbundene theologische Spannung behalten, statt Ursache, Zeitpunkt oder Art der Rettung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Aufbau, wird aber durch einen Relativsatz idiomatisch gestaltet. Die Personenbezeichnung der Weisheit und die ungewöhnliche Wendung „Vater der Welt“ bleiben erhalten.
