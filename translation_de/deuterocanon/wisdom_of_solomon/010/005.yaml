  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/005.yaml
  text: She also[a], when the nations were thrown into confusion in their wicked conspiracy, found the righteous man and kept him blameless before God[c][b], and kept him strong against his compassion for his child.
translation:
  language: de
  text: Auch sie fand den Gerechten[b], als die Völker in böser Eintracht[a] verwirrt wurden, bewahrte ihn untadelig vor Gott und bewahrte ihn stark gegenüber seinem Mitgefühl für sein Kind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in einmütiger Bosheit“ oder „in böser Übereinstimmung“. Gemeint ist die gemeinsame böse Absicht der Völker.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Gerechten“ ist im Zusammenhang wahrscheinlich Abraham gemeint; der griechische Text nennt ihn hier jedoch nicht beim Namen.
    reason: cross_reference
  - marker: c
    text: 'Auch möglich: „und bewahrte ihn stark gegenüber seiner innigen Zuneigung zu seinem Kind“. Das griechische Wort bezeichnet tiefe innere Regungen, Mitgefühl oder innige Zuneigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη καὶ
  choice: auch sie
  rationale: Das feminine Demonstrativpronomen verweist auf die personifizierte Weisheit im Kontext. „Auch sie“ gibt Geschlecht und weiterführende Aussage natürlich wieder, ohne den Namen erneut einzusetzen.
- source_word: ἐν ὁμονοίᾳ πονηρίᾳ
  choice: in böser Eintracht
  rationale: ὁμόνοια bezeichnet Einmütigkeit oder Eintracht, πονηρία deren bösen Charakter. Die bewusst spannungsvolle Formulierung bewahrt, dass die Völker in ihrem bösen Vorhaben geeint waren.
- source_word: ἐθνῶν συγχυθέντων
  choice: als die Völker verwirrt wurden
  rationale: Der Genitivus absolutus bezeichnet den begleitenden zeitlichen Umstand. Die Passivform bewahrt die Aussage des griechischen συγχυθέντων und lässt die mögliche Anspielung auf Babel bestehen, ohne sie auszuschreiben.
- source_word: εὗρεν τὸν δίκαιον
  choice: fand den Gerechten
  rationale: Der substantivierte maskuline Singular wird knapp und traditionell verständlich wiedergegeben. Der Kontext legt Abraham nahe, doch der griechische Text nennt ihn nicht ausdrücklich.
- source_word: ἐτήρησεν αὐτὸν ἄμεμπτον θεῷ
  choice: bewahrte ihn untadelig vor Gott
  rationale: τηρέω bedeutet bewahren oder erhalten; ἄμεμπτος bezeichnet jemanden, dem kein Tadel anhaftet. „Vor Gott“ gibt den relationalen Dativ θεῷ idiomatisch wieder.
- source_word: ἐπὶ τέκνου σπλάγχνοις
  choice: trotz seiner innigen Zuneigung zu seinem Kind
  rationale: σπλάγχνα bezeichnet bildlich die tiefen inneren Regungen, besonders Mitgefühl oder innige Zuneigung. „Trotz“ bringt den hier naheliegenden Widerstreit zwischen väterlicher Zuneigung und geforderter Standhaftigkeit zum Ausdruck, ohne das nicht ausdrücklich genannte Opfergeschehen einzufügen.
- source_word: ἰσχυρὸν ἐφύλαξεν
  choice: ließ ihn stark bleiben
  rationale: ἰσχυρός steht prädikativ zu φυλάσσω. Die Formulierung gibt sowohl das Bewahren als auch die fortdauernde Stärke in natürlichem Deutsch wieder.
theological_decisions:
- issue: Identität des Gerechten
  choice: Im Haupttext steht lediglich „der Gerechte“.
  alternative: Abraham
  rationale: Der Zusammenhang, besonders die Erwähnung des Kindes, weist wahrscheinlich auf Abraham. Da der griechische Wortlaut keinen Eigennamen enthält, wird diese Identifizierung nur in der Fußnote erläutert.
- issue: Sinn der Schlussaussage über das Kind
  choice: Die Weisheit ließ den Gerechten trotz seiner innigen Zuneigung zu seinem Kind stark bleiben.
  alternative: Sie bewahrte ihn stark gegenüber seinem Mitgefühl für sein Kind.
  rationale: Die Formulierung hält die Spannung zwischen väterlicher Zuneigung und Standhaftigkeit fest. Sie spielt wahrscheinlich auf die Bindung Isaaks an, nennt jedoch weder Isaak noch ein Opfer ausdrücklich; diese Einzelheiten werden daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die ungewöhnliche Verbindung „böse Eintracht“ ist bewusst beibehalten, weil sie die moralisch verkehrte Einmütigkeit der Völker prägnant ausdrückt. Die Satzstruktur bleibt dem griechischen Gedankengang nahe, wird aber für flüssiges Deutsch leicht geordnet.
