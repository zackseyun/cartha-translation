base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/010.yaml
  text: She guided the righteous man[a], a fugitive from his brother’s anger, in straight paths; she showed him the kingdom of God, and gave him knowledge of holy things; she prospered him in his labors[b], and increased the fruits of his toil.
translation:
  language: de
  text: Sie führte den Gerechten, der vor dem Zorn seines Bruders floh, auf geraden Pfaden; sie zeigte ihm das Reich Gottes und gab ihm Erkenntnis heiliger Dinge[a]; sie ließ ihn bei seinen Mühen Erfolg haben und mehrte seine Mühen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erkenntnis der Heiligen“ beziehungsweise „heiliger Wesen“. Der griechische Ausdruck kann heilige Dinge oder heilige Personen beziehungsweise Wesen bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „mehrte seine Mühen“ oder „seine Beschwerden“. Im wohltätigen Zusammenhang kann damit auch gemeint sein, dass sie den Ertrag seiner Mühen mehrte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Sie
  rationale: Das feminine Demonstrativpronomen verweist auf die personifizierte Weisheit im Zusammenhang. „Sie“ bewahrt diesen Rückbezug, ohne den im Vers nicht wiederholten Namen einzufügen.
- source_word: φυγάδα ὀργῆς ἀδελφοῦ
  choice: der vor dem Zorn seines Bruders floh
  rationale: φυγάς bezeichnet einen Flüchtenden oder Verbannten; die attributive Formulierung ist im modernen Deutschen natürlicher als „ein Flüchtling vor dem Zorn seines Bruders“.
- source_word: δίκαιον
  choice: den Gerechten
  rationale: Das substantivierte maskuline Adjektiv bezeichnet den gerechten Mann, im Zusammenhang Jakob. Die knappe substantivische Wiedergabe entspricht biblischem Deutsch.
- source_word: ὡδήγησεν ἐν τρίβοις εὐθείαις
  choice: führte … auf geraden Pfaden
  rationale: Bewahrt das Wegbild und gibt ὁδηγέω sowie τρίβοι εὐθεῖαι unmittelbar und idiomatisch wieder.
- source_word: βασιλείαν θεοῦ
  choice: das Reich Gottes
  rationale: Dies ist die etablierte und sachlich genaue Wiedergabe, die sowohl Herrschaft als auch Reich anklingen lässt.
- source_word: γνῶσιν ἁγίων
  choice: Erkenntnis heiliger Dinge
  rationale: Der Genitiv Plural ἁγίων kann sich auf Heiliges oder auf heilige Personen beziehungsweise Wesen beziehen. Im Haupttext steht die sachliche Deutung; die echte Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: εὐπόρησεν αὐτὸν ἐν μόχθοις
  choice: ließ ihn bei seinen Mühen Erfolg haben
  rationale: εὐπορέω bezeichnet Gedeihen, Gelingen oder Erfolg. Diese Formulierung ist natürliches Deutsch und wahrt den Bezug auf anstrengende Arbeit.
- source_word: ἐπλήθυνεν τοὺς πόνους αὐτοῦ
  choice: mehrte seine Mühen
  rationale: 'Die Wiedergabe bleibt bewusst nahe am überlieferten griechischen Wortlaut: πόνοι bedeutet zunächst Mühen, Arbeiten oder Beschwerden. Die unerwartete Spannung zum wohltätigen Kontext wird nicht durch die unmarkierte Einfügung von „Erträgen“ beseitigt.'
theological_decisions:
- issue: Bezug des femininen Subjekts
  choice: Personifizierte Weisheit, mit „sie“ wiedergegeben
  alternative: Den Namen „die Weisheit“ im Vers ausdrücklich wiederholen
  rationale: αὕτη greift die Weisheit aus dem Kontext auf. Das Pronomen bewahrt die Personifikation und fügt kein Substantiv in den Vers ein.
- issue: Bedeutung von γνῶσιν ἁγίων
  choice: „Erkenntnis heiliger Dinge“
  alternative: „Erkenntnis der Heiligen“ beziehungsweise „heiliger Wesen“
  rationale: Die griechische Form erlaubt einen sachlichen wie einen persönlichen Bezug. Der Haupttext wählt die kontextuell gut passende sachliche Lesart, während die andere in der Fußnote ausdrücklich erhalten bleibt.
- issue: Bedeutung von τοὺς πόνους αὐτοῦ
  choice: „seine Mühen“
  alternative: „die Erträge seiner Mühen“
  rationale: Obwohl der Zusammenhang eine Wohltat beschreibt, bedeutet πόνοι lexikalisch zunächst Mühen, Arbeiten oder Leiden. Eine Deutung als Arbeitserträge ist möglich, aber weniger direkt; deshalb bleibt der Haupttext formal näher am Griechischen und nennt die kontextuelle Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Bildsprache. Die Satzglieder des griechischen Textes bleiben erkennbar. Zwei echte lexikalische Spannungen werden durch markierte Fußnoten statt durch stillschweigende Harmonisierung bewahrt.
