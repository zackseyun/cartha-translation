  terminology: „der Gerechte“, „geraden Pfaden“, „das Reich Gottes“ und „Erkenntnis heiliger Dinge“ sind terminologisch tragfähig. Die Fußnote zu ἁγίων bewahrt die grammatisch mögliche personale Deutung, ohne sie dogmatisch festzulegen.
