  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Aussagen des griechischen Textes insgesamt zuverlässig wieder: die begleitende Weisheit, Grube und Fesseln, die Übertragung königlicher Insignien und Vollmacht, die Widerlegung der Gegner sowie die ewige Herrlichkeit. Bei τυραννούντων sollte die negative, tyrannische Nuance jedoch im Haupttext erkennbar bleiben. ψευδεῖς ἔδειξεν besagt, dass die Beschuldigenden als falsch bzw. im Unrecht erwiesen wurden, nicht zwingend, dass sie bewusst logen.'
  naturalness: Die Satzführung ist weitgehend idiomatisch und würdig. „Sie erwies seine Ankläger als Lügner“ ist im Deutschen zwar verständlich, verschärft aber die Aussage und klingt weniger neutral als der griechische Ausdruck. „Zeigte, dass … im Unrecht waren“ ist natürlich und wahrt die Aussageweite.
  terminology: „Grube“, „Fesseln“, „Zepter königlicher Herrschaft“, „Macht“ und „ewige Herrlichkeit“ sind geeignete moderne, zugleich literarisch würdige Entsprechungen. „Tyrannisch über ihn geherrscht“ gibt τυραννούντων genauer wieder als das neutrale „über ihn geherrscht“, ohne eine bestimmte historische Identifizierung vorzunehmen.
  issues:
  - severity: medium
    issue: Die negative Nuance von τυραννούντων wird in „die über ihn geherrscht hatten“ abgeschwächt.
    rationale: Das Verb bezeichnet tyrannisches Herrschen bzw. Unterdrücken. Eine behutsame Kennzeichnung als „tyrannisch“ wahrt diese Nuance besser als die rein neutrale Wiedergabe.
  - severity: medium
    issue: „als Lügner“ ist für ψευδεῖς stärker und enger als nötig.
    rationale: Die griechische Konstruktion erweist die betreffenden Personen als falsch; sie behauptet nicht ausdrücklich eine absichtliche Lüge. Eine Formulierung mit „im Unrecht“ ist im Deutschen idiomatisch und erhält die semantische Offenheit.
  - severity: low
    issue: Fußnote b übernimmt mit „als falsch“ eine im Deutschen unidiomatische Prädikation von Personen.
    rationale: Die Alternative sollte die mögliche Aussage über die Falschheit der Beschuldigung bzw. das Unrecht der Beschuldigenden in natürlichem Deutsch ausdrücken.
