base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/014.yaml
  text: She went down with him into the pit[a], and in chains she did not abandon him, until she brought him the scepter of a kingdom and authority over those who had ruled him; she showed those who had slandered him to be false[b], and gave him everlasting glory.
translation:
  language: de
  text: Sie stieg mit ihm in die Grube hinab[a] und ließ ihn auch in Fesseln nicht im Stich, bis sie ihm die Zepter königlicher Herrschaft und Macht über die brachte, die tyrannisch über ihn geherrscht hatten. Sie zeigte, dass die, die ihn beschuldigt hatten, im Unrecht waren[b], und gab ihm ewige Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Verlies“. Das griechische Wort bedeutet wörtlich „Grube“ und kann auch eine Zisterne oder ein Grubengefängnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie erwies die gegen ihn erhobenen Beschuldigungen als falsch.“'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατέβη αὐτῷ
  choice: Sie stieg mit ihm ... hinab
  rationale: Das Kompositum συγκαταβαίνω bezeichnet ein gemeinsames Hinabsteigen; die Formulierung bewahrt sowohl die Bewegung als auch die begleitende Gegenwart der personifizierten Weisheit.
- source_word: εἰς λάκκον
  choice: in die Grube
  rationale: λάκκος bezeichnet wörtlich eine Grube und kann im Zusammenhang auch eine Zisterne oder ein Grubengefängnis meinen. Die konkrete Bildsprache bleibt im Haupttext erhalten.
- source_word: ἐν δεσμοῖς
  choice: auch in Fesseln
  rationale: δεσμοί bezeichnet Fesseln oder Bande. „In Fesseln“ ist im Deutschen natürlich und macht die Gefangenschaft deutlich; „auch“ verdeutlicht idiomatisch, dass sie ihn selbst dort nicht verließ.
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: ließ ihn ... nicht im Stich
  rationale: ἀφίημι bedeutet hier verlassen oder zurücklassen. „Nicht im Stich lassen“ gibt die treue Begleitung in gegenwärtigem, würdigem Deutsch wieder.
- source_word: ἕως ἤνεγκεν αὐτῷ
  choice: bis sie ihm ... brachte
  rationale: φέρω mit Dativ kann bringen oder zukommen lassen bedeuten. „Brachte“ wahrt die konkrete Verbvorstellung, ohne sie vorschnell als Verleihung auszulegen.
- source_word: σκῆπτρα βασιλείας
  choice: die Zepter königlicher Herrschaft
  rationale: Der griechische Plural σκῆπτρα wird bewusst bewahrt. βασιλεία bezeichnet hier königliche Herrschaft beziehungsweise Königsmacht, nicht notwendig ein räumliches Königreich.
- source_word: ἐξουσίαν τυραννούντων αὐτοῦ
  choice: Macht über die, die über ihn geherrscht hatten
  rationale: ἐξουσία ist hier Vollmacht oder Macht. τυραννέω kann tyrannisch herrschen, beherrschen oder unterdrücken bedeuten; die Formulierung wahrt den Herrschaftsaspekt und die Umkehr der Machtverhältnisse, ohne die moralische Wertung maximal auszuschreiben.
- source_word: ψευδεῖς ... ἔδειξεν
  choice: erwies ... als Lügner
  rationale: Die Konstruktion besagt, dass die betreffenden Personen als falsch beziehungsweise unwahr erwiesen wurden. Im Deutschen bezeichnet „als Lügner erweisen“ klar die Falschheit ihrer Anschuldigungen.
- source_word: τοὺς μωμησαμένους αὐτόν
  choice: seine Ankläger
  rationale: μωμάομαι kann tadeln, beschuldigen oder einen Vorwurf erheben bedeuten. Im Josef-Kontext passt „Ankläger“, ohne die spezifischere Bedeutung einer öffentlichen Verleumdung zwingend einzutragen.
- source_word: δόξαν αἰώνιον
  choice: ewige Herrlichkeit
  rationale: Die feste, würdevolle Wendung gibt δόξα αἰώνιος unmittelbar wieder und bleibt für moderne Leser verständlich.
theological_decisions:
- issue: Bezug des unausgesprochenen femininen Subjekts
  choice: „Sie“ bezieht sich auf die im Kontext personifizierte Weisheit.
  alternative: Am Versanfang ausdrücklich „Die Weisheit“ wiederholen.
  rationale: Der unmittelbare Kontext bestimmt die handelnde Person als Weisheit. Das Pronomen bewahrt den griechischen Erzählfluss und die literarische Personifikation.
- issue: Art der Herrschaft über Josef
  choice: „die über ihn geherrscht hatten“
  alternative: „seine Unterdrücker“ oder „die ihn tyrannisiert hatten“
  rationale: Die gewählte Fassung lässt die negative Färbung von τυραννέω anklingen, ohne sie auf eine einzelne deutsche Deutung festzulegen, und hebt die Umkehr der früheren Unterordnung hervor.
- issue: Bedeutung der bleibenden Herrlichkeit
  choice: „ewige Herrlichkeit“
  alternative: „immerwährende Ehre“
  rationale: δόξα kann Ehre oder Herrlichkeit bedeuten. „Herrlichkeit“ wahrt die theologische und literarische Weite; der Text erklärt nicht näher, in welchem Sinn sie ewig ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die feminine Personifikation der Weisheit und der griechische Plural „Zepter“ bleiben erhalten. Lexikalische Mehrdeutigkeiten bei λάκκος, τυραννέω und μωμάομαι werden nicht konfessionell oder erzählerisch überbestimmt; wesentliche Alternativen stehen in den Fußnoten.
