- from: Sie stieg mit ihm in die Grube hinab[a] und ließ ihn auch in Fesseln nicht im Stich, bis sie ihm die Zepter königlicher Herrschaft und Macht über die brachte, die über ihn geherrscht hatten. Sie erwies seine Ankläger als Lügner[b] und gab ihm ewige Herrlichkeit.
  to: Sie stieg mit ihm in die Grube hinab[a] und ließ ihn auch in Fesseln nicht im Stich, bis sie ihm die Zepter königlicher Herrschaft und Macht über die brachte, die tyrannisch über ihn geherrscht hatten. Sie zeigte, dass die, die ihn beschuldigt hatten, im Unrecht waren[b], und gab ihm ewige Herrlichkeit.
  rationale: Die Revision stellt die tyrannische Nuance von τυραννούντων wieder her und ersetzt die zu stark auf bewusste Lüge festgelegte Aussage „als Lügner“ durch eine natürliche deutsche Formulierung, die ψευδεῖς ἔδειξεν angemessen weit wiedergibt. Fußnote b bietet eine idiomatische alternative Auslegung, bei der die Falschheit auf die Beschuldigungen bezogen wird.
