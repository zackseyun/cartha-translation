base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/020.yaml
  text: Therefore the righteous plundered the ungodly[a], and they sang praise to your holy name, O Lord[b]; and with one accord they praised your defending hand.
translation:
  language: de
  text: Darum plünderten die Gerechten die Gottlosen aus[a] und besangen deinen heiligen Namen, Herr, und einmütig priesen sie auch deine Hand, die für sie kämpft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nahmen den Gottlosen die Beute ab«. Das griechische Verb bezeichnet das Erbeuten oder Wegnehmen von Beute, besonders von besiegten Feinden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »deine für andere kämpfende Hand« oder »deine beistehende Hand«. Das griechische Wort verbindet Schutz mit dem Bild kämpferischen Eintretens für jemanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den rückbezüglichen Folgerungszusammenhang knapp und natürlich wieder.
- source_word: δίκαιοι
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die durch Gerechtigkeit gekennzeichnet sind; die traditionelle und weiterhin verständliche Wiedergabe bewahrt den moralisch-theologischen Gehalt.
- source_word: ἐσκύλευσαν
  choice: plünderten … aus
  rationale: Das Verb bezeichnet das Wegnehmen von Beute, besonders nach einem Sieg. Die deutsche Wendung bewahrt dieses konkrete Beutemotiv.
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: Der Ausdruck bezeichnet fehlende Ehrfurcht gegenüber Gott und nicht lediglich allgemeine Bosheit.
- source_word: ὕμνησαν
  choice: besangen
  rationale: Bewahrt gegenüber einem allgemeinen »lobten« den im griechischen Verb angelegten Bezug auf hymnischen Gesang.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ wird als direkte Anrede wiedergegeben; die deutsche Wortstellung macht ein zusätzliches »o« entbehrlich.
- source_word: τὸ ὄνομα τὸ ἅγιόν σου
  choice: deinen heiligen Namen
  rationale: Entspricht der festen biblischen Ausdrucksweise und bewahrt den Bezug auf Gottes offenbarte Identität und Ehre.
- source_word: τήν τε ὑπέρμαχόν σου χεῖρα
  choice: auch deine schützende Hand
  rationale: Die Handmetapher bleibt erhalten. »Schützend« gibt idiomatisch wieder, dass diese Hand zugunsten anderer eintritt; die kriegerischere Nuance wird in der Fußnote kenntlich gemacht.
- source_word: ᾔνεσαν
  choice: priesen
  rationale: Gibt das allgemeine Lobverb würdig und natürlich wieder und unterscheidet es von dem zuvor verwendeten Verb für hymnischen Gesang.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Bezeichnet gemeinsames Wollen und eine geeinte Haltung, nicht bloß gleichzeitiges Handeln.
theological_decisions:
- issue: Geschichtliche Identität der Gerechten und der Gottlosen
  choice: Die moralisch-religiösen Bezeichnungen »die Gerechten« und »die Gottlosen« bleiben ohne ethnische Ergänzung stehen.
  alternative: die gerechten Israeliten und die gottlosen Ägypter
  rationale: Der Zusammenhang weist auf Israel und Ägypten, doch der griechische Text verwendet bewusst allgemeine moralisch-religiöse Kategorien. Diese Spannung soll der Kontext erschließen.
- issue: Gottes Hand als handelnde Schutzmacht
  choice: Die Metapher der »Hand« wird bewahrt und ὑπέρμαχος mit »schützend« wiedergegeben.
  alternative: deine Macht, die für sie kämpfte; deine für sie kämpfende Hand
  rationale: Die Bildsprache göttlichen Handelns bleibt erhalten, ohne sie zur abstrakten »Macht« aufzulösen. Die Fußnote bewahrt ausdrücklich den möglichen kämpferischen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Bildsprache. »Besangen« und »priesen« bilden die Unterscheidung der beiden griechischen Lobverben ab; »einmütig« wahrt den Gedanken geeinten Handelns.
