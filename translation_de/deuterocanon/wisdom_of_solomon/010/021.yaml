  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/021.yaml
  text: For wisdom opened the mouths of the mute[c][b][a], and made the tongues of infants eloquent.
translation:
  language: de
  text: Denn die Weisheit[c] öffnete den Mund der Stummen[a] und machte die Zungen kleiner Kinder beredt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Mund der Tauben«. Das griechische Wort kann Menschen bezeichnen, die nicht hören oder nicht sprechen können; wegen des Zusammenhangs mit Mund und Zungen ist hier »Stummen« naheliegender.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ließ die Zungen kleiner Kinder deutlich sprechen«. Das griechische Wort bezeichnet klare, deutliche oder artikulierte Rede.'
    reason: lexical_alternative
  - marker: c
    text: Die Weisheit erscheint hier als handelnde Person. Da deutsche Substantive immer großgeschrieben werden, lässt die Schreibweise nicht erkennen, ob »Weisheit« als Eigenname verstanden wird.
    reason: alternative_reading
lexical_decisions:
- source_word: σοφία
  choice: Weisheit
  rationale: Die gewöhnliche deutsche Entsprechung bewahrt sowohl den abstrakten Sinn als auch die im Zusammenhang erkennbare Personifizierung.
- source_word: ἤνοιξεν
  choice: öffnete
  rationale: Die konkrete Metapher des griechischen Verbs wird unmittelbar und natürlich wiedergegeben.
- source_word: στόμα κωφῶν
  choice: den Mund der Stummen
  rationale: στόμα steht im Singular, während κωφῶν pluralisch ist. Im Zusammenhang von Mund, Zungen und verständlicher Rede bezeichnet κωφός am ehesten Menschen, die nicht sprechen können; der Singular lässt sich im Deutschen als kollektive Wendung bewahren.
- source_word: γλώσσας
  choice: die Zungen
  rationale: Die körperliche Bildsprache und die Parallele zu »Mund« bleiben erhalten.
- source_word: νηπίων
  choice: kleiner Kinder
  rationale: νήπιος bezeichnet Säuglinge oder sehr junge, noch nicht voll sprechfähige Kinder. »Kleine Kinder« ist im heutigen Deutsch natürlich und legt das genaue Alter nicht unnötig fest.
- source_word: ἔθηκεν τρανάς
  choice: machte … beredt
  rationale: τρανός bezeichnet klare, deutliche oder artikulierte Rede. »Beredt« bildet die prädikative Konstruktion knapp und würdig nach, ohne die Aussage auf bloße Lautbildung zu reduzieren.
theological_decisions:
- issue: Personifizierung von σοφία
  choice: »die Weisheit«; die Personifizierung ergibt sich aus ihrer Rolle als handelndes Subjekt
  alternative: Eine typografisch besonders hervorgehobene oder in der Fußnote als Eigenname bezeichnete »Weisheit«
  rationale: Im Deutschen werden Substantive ohnehin großgeschrieben. Der Text lässt die literarische Personifizierung erkennen, ohne sie als Eigenname oder besondere hypostatische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Körpermetaphorik von »Mund« und »Zungen« sowie die knappe kausale Einleitung mit »Denn« bleiben erhalten.
