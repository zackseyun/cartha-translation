  text: But wisdom rescued those who served her from hardships[a].
translation:
  language: de
  text: Doch die Weisheit rettete die, die ihr dienten, aus Mühsalen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Mühen“, „aus Bedrängnissen“ oder „aus Schmerzen“. Das griechische Wort kann beschwerliche Arbeit, Leiden oder Not bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: die Weisheit
  rationale: Das geläufige deutsche Substantiv gibt den Begriff direkt wieder. Die im Kontext handelnd dargestellte Weisheit bleibt erkennbar, ohne durch Großschreibung als Eigenname festgelegt zu werden.
- source_word: θεραπεύσαντας
  choice: die, die ihr dienten
  rationale: θεραπεύω kann dienen, sich jemandem widmen oder fürsorglich aufwarten bedeuten. „Ihr dienten“ drückt hier die hingebungsvolle Zuwendung zur personifizierten Weisheit klar und natürlich aus.
- source_word: αὐτήν
  choice: ihr
  rationale: Der feminine Bezug auf die Weisheit wird beibehalten. Im Deutschen entspricht dies zugleich dem grammatischen Geschlecht von „Weisheit“.
- source_word: ἐκ πόνων
  choice: aus Mühsalen
  rationale: πόνος umfasst Mühe, beschwerliche Arbeit, Schmerz und Bedrängnis. „Mühsale“ bewahrt diese Breite besser als eine ausschließlich körperliche oder arbeitsbezogene Wiedergabe.
- source_word: ἐρρύσατο
  choice: rettete
  rationale: Das Verb bezeichnet das Herausreißen oder Befreien aus Not und Gefahr. „Rettete … aus“ ist im modernen Deutsch anschaulich und entspricht der Konstruktion mit ἐκ.
- source_word: δέ
  choice: Doch
  rationale: „Doch“ gibt den fortführenden beziehungsweise kontrastierenden Übergang knapp und idiomatisch wieder.
theological_decisions:
- issue: Personifizierung der Weisheit
  choice: „Weisheit“ bleibt ein gewöhnliches Substantiv, wird aber durch ihr Handeln und den Bezug „ihr“ personifiziert dargestellt.
  alternative: „Weisheit“ ausdrücklich als Eigennamen oder rein unpersönlich wiederzugeben.
  rationale: Der griechische Text stellt die Weisheit handelnd und mit femininem Rückbezug dar, legt sie jedoch nicht eindeutig als eigenständige Person oder Eigennamen fest. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mühsale“ ist leicht gehoben, aber allgemein verständlich und erhält die Bedeutungsbreite des griechischen Ausdrucks.
