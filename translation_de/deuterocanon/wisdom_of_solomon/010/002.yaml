  text: and gave him strength to rule over all things[a].
translation:
  language: de
  text: und gab ihm die Kraft, über alles zu herrschen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: über alles Macht zu haben. Das griechische Verb kann Macht oder Herrschaft über etwas bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκέν
  choice: gab
  rationale: Die einfache Vergangenheitsform gibt δίδωμι in der knappen erzählenden Aussage natürlich wieder.
- source_word: τε
  choice: und
  rationale: Das enklitische τε verbindet den Satzteil mit dem vorausgehenden Zusammenhang; „und“ wahrt diese Anschlussfunktion ohne Überbetonung.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen verweist im Zusammenhang auf den zuvor genannten Menschen, Adam.
- source_word: ἰσχὺν
  choice: die Kraft
  rationale: ἰσχύς bezeichnet Kraft oder Stärke; „die Kraft“ verbindet sich im Deutschen idiomatisch mit dem folgenden Infinitiv.
- source_word: κρατῆσαι
  choice: zu herrschen
  rationale: κρατέω kann das Ausüben oder Erlangen von Macht und Herrschaft bezeichnen. Mit „über“ gibt „herrschen“ die durch den Genitiv ausgedrückte Gewalt über etwas würdig und verständlich wieder.
- source_word: ἁπάντων
  choice: über alles
  rationale: Der umfassende Genitiv Plural bleibt bewusst allgemein; es wird weder „Schöpfung“ noch „Lebewesen“ ergänzt.
theological_decisions:
- issue: Reichweite der Adam verliehenen Herrschaft
  choice: Die Aussage bleibt mit „über alles“ umfassend und unbestimmt.
  alternative: über die ganze Schöpfung zu herrschen
  rationale: Der griechische Text nennt ausdrücklich weder die Schöpfung noch Geschöpfe. Die breite Formulierung bewahrt den möglichen Anklang an die dem Menschen verliehene Herrschaft, ohne ihn durch eine erklärende Ergänzung festzulegen.
- issue: Nuance von κρατῆσαι
  choice: zu herrschen
  alternative: alles in seine Gewalt zu bringen
  rationale: Die Hauptfassung betont die Ausübung von Herrschaft; die Fußnote hält die mögliche ingressiv-ergebnisbezogene Nuance des Aoristinfinitivs offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des Griechischen bleibt erhalten; „die Kraft“ ist gegenüber dem artikellosen griechischen Ausdruck eine im Deutschen notwendige idiomatische Formulierung.
