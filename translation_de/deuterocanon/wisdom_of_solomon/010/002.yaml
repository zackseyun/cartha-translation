  source_fidelity: 'Die Hauptfassung gibt ἔδωκεν ... ἰσχὺν κρατῆσαι ἁπάντων treffend wieder: Gott gab ihm Kraft zur Herrschaft über alles. „Über alles zu herrschen“ wahrt die umfassende, nicht näher bestimmte Reichweite von ἁπάντων und ergänzt weder „Schöpfung“ noch „Lebewesen“.'
  naturalness: „und gab ihm die Kraft, über alles zu herrschen“ ist natürliches, würdiges modernes Standarddeutsch und bewahrt den knappen Anschluss des griechischen τε.
  terminology: „Kraft“ für ἰσχύς und „herrschen“ für κρατεῖν sind hier angemessen. Die vorhandene Fußnote legt jedoch mit „in seine Gewalt zu bringen“ eine spezifisch ingressiv-erwerbende Nuance nahe, die der Aoristinfinitiv in diesem Kontext nicht zwingend trägt. Die Anmerkung sollte die lexikalische Spannweite ohne diese Überfestlegung beschreiben.
