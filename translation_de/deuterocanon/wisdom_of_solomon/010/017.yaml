  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/017.yaml
  text: He gave the holy ones the reward of their labors[a], guided them in a marvelous way[c][b], and became for them a shelter by day and a flame of stars by night.
translation:
  language: de
  text: Sie gab den Frommen[b] den Lohn für ihre Mühen, führte sie auf einem wunderbaren Weg und wurde ihnen am Tag zum Schutz und in der Nacht zu einer Sternenflamme[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bilder erinnern an Gottes Führung und Schutz beim Auszug aus Ägypten, besonders an die Wolke am Tag und das Feuer in der Nacht. Der griechische Text spielt darauf nur an und verwendet nicht die vollständige traditionelle Formel.
    reason: cross_reference
  - marker: b
    text: 'Oder: »den Heiligen« beziehungsweise »den Gottesfürchtigen«.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Griechischen die ungewöhnliche Wendung »Flamme der Sterne«; möglich ist auch die verdichtete Wiedergabe »eine sternige Flamme«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: gab
  rationale: Das Verb kann »zurückgeben«, »erstatten« oder »vergelten« bedeuten. Zusammen mit μισθὸν bezeichnet es hier die Gewährung des verdienten Lohns; »gab« ist natürlich und legt den wirtschaftlichen Beiklang nicht zu stark fest.
- source_word: ὁσίοις
  choice: den Frommen
  rationale: ὅσιος bezeichnet Menschen, die Gott ergeben und ihm treu sind. »Die Frommen« bewahrt diesen religiösen Sinn, ohne eine spätere technische Kategorie einzutragen.
- source_word: μισθὸν κόπων αὐτῶν
  choice: den Lohn für ihre Mühen
  rationale: μισθός kann Lohn oder Belohnung bedeuten; κόπος hebt anstrengende Arbeit und Mühsal hervor. Die Formulierung gibt den Zusammenhang idiomatisch und würdevoll wieder.
- source_word: ὡδήγησεν αὐτοὺς ἐν ὁδῷ θαυμαστῇ
  choice: führte sie auf einem wunderbaren Weg
  rationale: ὁδηγέω bedeutet führen oder den Weg weisen. »Auf einem wunderbaren Weg« entspricht der griechischen Wegmetapher und lässt offen, ob vor allem der Weg selbst oder die Art der Führung als wunderbar erscheint.
- source_word: ἐγένετο αὐτοῖς εἰς σκέπην ἡμέρας
  choice: wurde ihnen am Tag zum Schutz
  rationale: σκέπη bezeichnet eine Bedeckung, einen Schutz oder Zufluchtsort. »Zum Schutz« ist im Deutschen klar und bewahrt die Schutzfunktion, ohne ausdrücklich eine Wolkensäule einzufügen.
- source_word: εἰς φλόγα ἄστρων τὴν νύκτα
  choice: in der Nacht zu einer Sternenflamme
  rationale: Die verdichtete Verbindung aus φλόξ (Flamme) und dem Genitiv ἄστρων (der Sterne) wird mit dem ebenso verdichteten Kompositum »Sternenflamme« wiedergegeben. Die ungewöhnliche Bildsprache bleibt erhalten.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt der Verben
  choice: Das feminine Pronomen »Sie« verweist auf die im Kontext personifizierte Weisheit.
  alternative: Das Subjekt im Vers ausdrücklich als »die Weisheit« wiederholen.
  rationale: Im griechischen Vers wird σοφία nicht erneut genannt, ist aber aus dem Zusammenhang das Subjekt. Das Pronomen bewahrt den fortlaufenden Bezug, ohne eine erklärende Ergänzung in den Text einzufügen.
- issue: Anspielung auf die Führung beim Auszug aus Ägypten
  choice: Die Bilder werden in ihrer knappen, anspielenden Form übersetzt.
  alternative: Ausdrückliche Wiedergabe als »Wolkensäule am Tag und Feuersäule in der Nacht«.
  rationale: Der Vers erinnert deutlich an die Exodusüberlieferung, verwendet aber nicht deren vollständige traditionelle Formel. Eine Ausformulierung würde mehr sagen als der griechische Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzfolge und die personifizierte Weisheit bleiben erhalten. Ungewöhnliche Bildsprache wird nicht zu der geläufigeren Exodusformel geglättet.
