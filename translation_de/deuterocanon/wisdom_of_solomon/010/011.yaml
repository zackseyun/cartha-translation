  text: When others overpowered him in greed[a], she stood by him and made him rich.
translation:
  language: de
  text: Als andere ihn aus Habgier überwältigten,[a] stand sie ihm bei und machte ihn reich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als die, die aus Habgier handelten, die Oberhand über ihn gewannen.“ Das griechische Partizip kann formaler mit „die Oberhand gewinnen“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πλεονεξίᾳ
  choice: aus Habgier
  rationale: πλεονεξία bezeichnet Habgier oder Begehrlichkeit. Das mit ἐν gebildete Satzglied kann hier die Art oder den Beweggrund des feindlichen Handelns ausdrücken; „aus Habgier“ ist im modernen Deutschen natürlich, ohne die moralische Färbung abzuschwächen.
- source_word: κατισχυόντων
  choice: als andere ihn … überwältigten
  rationale: Das Partizip von κατισχύω bezeichnet ein Übermächtigwerden oder Obsiegen über jemanden. Die finite Nebensatzkonstruktion ist idiomatisches Deutsch und erhält die feindliche Überlegenheit.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen verweist im Zusammenhang auf die männliche Gestalt, Jakob.
- source_word: παρέστη
  choice: stand sie ihm bei
  rationale: παρίστημι kann hier das unterstützende Beistehen ausdrücken. „Ihm beistehen“ bewahrt sowohl das Bild der Nähe als auch den Sinn tätiger Hilfe.
- source_word: ἐπλούτισεν
  choice: machte ihn reich
  rationale: Das Verb bedeutet, jemanden reich zu machen. Die gewählte Formulierung ist konkret, klar und näher am griechischen Ausdruck als allgemeinere Wiedergaben wie „ließ ihn gedeihen“.
theological_decisions:
- issue: Unausgesprochenes Subjekt von παρέστη und ἐπλούτισεν
  choice: Das Subjekt wird mit „sie“ wiedergegeben und auf die personifizierte Weisheit bezogen.
  alternative: Das Subjekt könnte wie im Griechischen unausgesprochen bleiben, was in einem selbstständigen deutschen Vers jedoch unklar oder ungrammatisch wäre.
  rationale: Im fortlaufenden Zusammenhang von Weisheit 10 ist die Weisheit die handelnde weibliche Gestalt. Das deutsche Pronomen macht lediglich den grammatisch und diskursiv vorausgesetzten Bezug ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und bewahrt die Personifikation der Weisheit sowie die konkrete Aussage, dass sie ihn reich machte.
