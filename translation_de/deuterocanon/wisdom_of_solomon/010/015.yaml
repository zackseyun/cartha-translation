  text: She rescued a holy people and a blameless offspring from a nation of oppressors[a].
translation:
  language: de
  text: Sie rettete ein heiliges Volk und eine untadelige Nachkommenschaft aus einer Nation von Unterdrückern[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus einer bedrückenden Nation“ beziehungsweise „aus einer Nation, die sie unterdrückte“. Das griechische Partizip θλιβόντων kann statt substantivisch („von Unterdrückern“) auch sinngemäß als nähere Bestimmung der Nation verstanden werden.'
    reason: lexikalische Alternative und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: αὕτη
  choice: Sie
  rationale: Das feminine Demonstrativpronomen verweist im Zusammenhang auf die personifizierte Weisheit. „Sie“ bewahrt diese Personifikation und den rückverweisenden Charakter, ohne den Namen erklärend in den Text einzusetzen.
- source_word: λαὸν
  choice: Volk
  rationale: „Volk“ ist die natürliche kollektive Bezeichnung und wahrt gegenüber ἔθνος, das als „Nation“ wiedergegeben wird, die lexikalische Unterscheidung.
- source_word: ὅσιον
  choice: heiliges
  rationale: ὅσιος bezeichnet hier die auf Gott bezogene Heiligkeit beziehungsweise Frömmigkeit des Volkes. „Heilig“ erhält das gewichtige, bundestheologische Gepräge der Aussage.
- source_word: σπέρμα
  choice: Nachkommenschaft
  rationale: „Nachkommenschaft“ gibt den kollektiv gebrauchten Singular wieder und klingt im Deutschen natürlicher als das wörtliche „Same“.
- source_word: ἄμεμπτον
  choice: untadelige
  rationale: „Untadelig“ bezeichnet moralische Unbescholtenheit und lässt sich im Deutschen natürlich auf die kollektive „Nachkommenschaft“ beziehen.
- source_word: ἐρρύσατο
  choice: rettete
  rationale: Das Verb bezeichnet die Befreiung aus Bedrängnis oder Gefahr. „Rettete“ ist klar und gegenwärtig, ohne den Vorgang unnötig zu erläutern.
- source_word: ἐξ
  choice: aus
  rationale: Die Präposition bezeichnet die Herausführung beziehungsweise Befreiung aus einem Machtbereich; „aus“ ist hier die natürliche deutsche Entsprechung.
- source_word: ἔθνους
  choice: Nation
  rationale: „Nation“ wahrt die Unterscheidung von λαός („Volk“) und vermeidet die überdeutende Wiedergabe als „heidnisches Volk“.
- source_word: θλιβόντων
  choice: von Unterdrückern
  rationale: Das substantivisch verstandene Partizip im Genitiv Plural bezeichnet diejenigen, die bedrängen oder unterdrücken. „Eine Nation von Unterdrückern“ bildet die griechische Konstruktion verständlich ab.
theological_decisions:
- issue: Bezugswort des femininen Pronomens αὕτη
  choice: Das Pronomen bezieht sich auf die personifizierte Weisheit und wird mit „Sie“ wiedergegeben.
  alternative: Zur Verdeutlichung könnte „die Weisheit“ oder formaler „diese“ stehen.
  rationale: Der Kontext stellt die Weisheit als weibliche handelnde Gestalt dar. „Sie“ erhält diese literarisch-theologische Personifikation, ohne das Pronomen im Haupttext durch ein erklärendes Substantiv zu ersetzen.
- issue: Beschreibung Israels als ὅσιον und ἄμεμπτον
  choice: Die Prädikate werden ohne Abschwächung als „heilig“ und „untadelig“ wiedergegeben.
  alternative: Möglich wären „fromm“ und „ohne Tadel“ beziehungsweise „gottesfürchtig“ und „makellos“.
  rationale: Die Aussage charakterisiert das gerettete Volk in der Rhetorik des Textes religiös und ethisch. Die Übersetzung bewahrt diese Spannung, ohne spätere Lehrbegriffe einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und parallel zum Griechischen. „Nation von Unterdrückern“ ist bewusst etwas markant, um den Genitiv Plural θλιβόντων nicht stillschweigend in einen Relativsatz umzudeuten; die natürlichere alternative Deutung wird in der Fußnote dokumentiert.
