  text: She entered into the soul of a servant of the Lord[b][a], and stood against fearsome kings with wonders and signs.
translation:
  language: de
  text: Sie ging in die Seele eines Dieners des Herrn[a] ein und trat furchterregenden Königen mit Wundern und Zeichen entgegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Diener des Herrn“ ist dem Zusammenhang nach Mose gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „und trat furchterregenden Königen durch Wunder und Zeichen entgegen“. Die griechische Wendung kann das Mittel oder einen begleitenden Umstand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ging … ein
  rationale: Der Aorist von εἰσέρχομαι bezeichnet ein Eintreten. Die deutsche Formulierung bewahrt das konkrete Bild, dass die personifizierte Weisheit in einen Menschen eingeht.
- source_word: ψυχὴν
  choice: Seele
  rationale: ψυχή kann Leben oder inneres Selbst bezeichnen; hier wahrt „Seele“ die anthropologische und theologische Weite des Ausdrucks.
- source_word: θεράποντος Κυρίου
  choice: eines Dieners des Herrn
  rationale: θεράπων bezeichnet einen persönlichen Diener oder Gefolgsmann mit möglichem Würdeklang. Der Kontext weist auf Mose, doch der Haupttext behält die allgemeine Bezeichnung des Griechischen bei.
- source_word: ἀντέστη
  choice: trat … entgegen
  rationale: ἀνθίστημι bedeutet, sich gegen jemanden zu stellen oder Widerstand zu leisten. „trat … entgegen“ ist anschaulich, natürlich und bewahrt die aktive Konfrontation.
- source_word: βασιλεῦσι φοβεροῖς
  choice: furchterregenden Königen
  rationale: φοβερός bezeichnet hier solche, die Furcht hervorrufen. „Furchterregend“ vermeidet die mögliche Fehlbedeutung, die Könige hätten selbst Angst.
- source_word: ἐν τέρασι καὶ σημείοις
  choice: mit Wundern und Zeichen
  rationale: ἐν kann hier Mittel oder begleitenden Umstand ausdrücken. „Mit Wundern und Zeichen“ bewahrt die vertraute biblische Wortverbindung und lässt die genaue Verhältnisbestimmung offen.
theological_decisions:
- issue: Geschlecht und Identität des unausgesprochenen Subjekts
  choice: Das feminine Pronomen „Sie“ verweist auf die personifizierte Weisheit.
  alternative: „Die Weisheit“ ausdrücklich wiederholen oder ein neutrales Pronomen verwenden.
  rationale: Das griechische Verb nennt in diesem Vers kein Subjekt; aus dem Zusammenhang ist jedoch die grammatisch feminine, personifizierte Weisheit das fortlaufende Subjekt. „Sie“ wahrt diese literarische Personifikation, ohne ein Nomen in den Text einzufügen.
- issue: Identität des „Dieners des Herrn“
  choice: Die allgemeine Bezeichnung bleibt im Haupttext stehen; Mose wird nur in der Fußnote genannt.
  alternative: Im Haupttext unmittelbar „Mose“ schreiben.
  rationale: Der Zusammenhang legt Mose nahe, aber der griechische Wortlaut nennt ihn hier nicht namentlich. Die Übersetzung trennt daher Textaussage und kontextuelle Identifikation.
- issue: Funktion von ἐν bei „Wundern und Zeichen“
  choice: „mit“ lässt Mittel und Begleitumstand mitschwingen.
  alternative: „durch Wunder und Zeichen“ als eindeutig instrumentale Wiedergabe.
  rationale: Die griechische Präpositionalphrase kann instrumental oder begleitend verstanden werden. Der Haupttext soll diese echte Mehrdeutigkeit nicht unnötig festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Personifikation der Weisheit und das konkrete Bild ihres Eingehens in die Seele bleiben erhalten. Die Satzstellung ist flüssig und folgt zugleich eng dem griechischen Gedankengang.
