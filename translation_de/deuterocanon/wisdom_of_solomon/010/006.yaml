base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/006.yaml
  text: She rescued a righteous man when the ungodly were perishing[b][a], as he fled the fire descending on the Five Cities.
translation:
  language: de
  text: Sie rettete einen Gerechten, der vor dem Feuer floh, das auf die Fünf Städte[a] herabkam, als die Gottlosen zugrunde gingen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Verband von fünf Städten um Sodom; der Vers spielt auf Lots Flucht an.
    reason: cross_reference
  - marker: b
    text: Wörtlich wird das Feuer als „herabkommend“ bezeichnet; dass es vom Himmel kommt, wird im griechischen Wortlaut nicht ausdrücklich gesagt.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Sie
  rationale: Das feminine Demonstrativpronomen verweist im Zusammenhang auf die personifizierte Weisheit. „Sie“ führt diese Personifikation natürlich fort, ohne den Namen in jedem Vers zu wiederholen.
- source_word: δίκαιον
  choice: einen Gerechten
  rationale: Das artikellose substantivierte Adjektiv bezeichnet den geretteten Menschen, ohne ihn ausdrücklich als Lot zu benennen. „Ein Gerechter“ bewahrt sowohl die moralische Bedeutung als auch die Zurückhaltung des griechischen Textes.
- source_word: ἐξαπολλυμένων ἀσεβῶν
  choice: als die Gottlosen zugrunde gingen
  rationale: Die Genitivus-absolute-Konstruktion beschreibt den gleichzeitig ablaufenden Untergang. „Gottlose“ gibt den religiös-moralischen Gehalt von ἀσεβής wieder; „zugrunde gingen“ bewahrt den prozesshaften Sinn, ohne die handelnde Ursache eigens festzulegen.
- source_word: ἐρρύσατο
  choice: rettete
  rationale: Das Verb bezeichnet die Befreiung aus konkreter Gefahr. „Rettete“ ist im modernen Deutsch klar, würdig und kontextgerecht.
- source_word: φυγόντα
  choice: Er floh
  rationale: Das Partizip bezieht sich auf den Gerechten und beschreibt seine Flucht im Zusammenhang mit der Rettung. Ein eigener kurzer Satz vermeidet eine schwerfällige Verschachtelung und hält den Bezug eindeutig.
- source_word: πῦρ καταβάσιον
  choice: das Feuer, das … herabkam
  rationale: καταβάσιος bezeichnet etwas Herabkommendes. Die Formulierung bleibt nah am griechischen Bild, ohne „vom Himmel“ hinzuzufügen, was nicht ausdrücklich im Wortlaut steht.
- source_word: Πενταπόλεως
  choice: die Fünf Städte
  rationale: Der Genitiv bezeichnet die Pentapolis, den Verband der fünf mit Sodom verbundenen Städte. „Die Fünf Städte“ ist für heutige Leser transparenter als die Fremdbezeichnung „Pentapolis“.
theological_decisions:
- issue: Bezug des femininen Subjekts αὕτη
  choice: Das Pronomen bezeichnet die im Zusammenhang personifizierte Weisheit.
  alternative: „Diese“ oder die ausdrückliche Wiederholung „die Weisheit“
  rationale: Kapitel 10 schreibt der personifizierten Weisheit fortlaufend rettende Taten zu. „Sie“ bewahrt diese literarisch-theologische Personifikation, ohne weitergehende dogmatische Identifikationen einzutragen.
- issue: Identität des Gerechten und der Fünf Städte
  choice: Der Haupttext lässt die Anspielung auf Lot und Sodom unausgesprochen.
  alternative: Lot und Sodom im Haupttext ausdrücklich nennen
  rationale: Der griechische Text nennt weder Lot noch Sodom, sondern spricht von „einem Gerechten“ und der „Pentapolis“. Die implizite Form bewahrt die Aussageweise der Quelle; die Fußnote erschließt die Anspielung.
- issue: Herkunft des Feuers
  choice: Das Feuer kommt herab, ohne dass seine Herkunft ausdrücklich benannt wird.
  alternative: „Feuer vom Himmel“
  rationale: καταβάσιος beschreibt die Abwärtsbewegung, nennt aber in dieser Formulierung den Himmel nicht ausdrücklich. Die Übersetzung vermeidet daher eine sachlich naheliegende, aber über den Wortlaut hinausgehende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufteilung in zwei Sätze löst die dichte griechische Partizipialkonstruktion verständlich auf, ohne ihren zeitlichen und sachlichen Zusammenhang zu verändern. Die personifizierte Weisheit wird mit „Sie“ fortgeführt; die biblische Anspielung bleibt im Haupttext bewusst implizit.
