  text: Because of him[a], when the earth was being flooded, wisdom again saved it, steering the righteous man by means of a humble piece of wood.
translation:
  language: de
  text: Seinetwegen[a] wurde die Erde von der Flut überschwemmt. Die Weisheit rettete sie erneut, indem sie den Gerechten mithilfe eines einfachen Stücks Holz durch die Flut lenkte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „durch ihn“. Im Zusammenhang bezeichnet das Pronomen wahrscheinlich den zuvor genannten Ungerechten als Anlass der Flut.'
    reason: Die griechische Verbindung δι’ ὃν kann formal instrumentalen oder kausalen Sinn haben; der Kontext legt die kausale Lesart nahe.
  - marker: b
    text: Gemeint ist die Arche. Wörtlich steht hier ein geringes oder wenig geachtetes „Holz“; das Verb „lenken“ gehört zur Sprache der Seefahrt.
    reason: Die Fußnote erläutert die knappe Metonymie ξύλον und bewahrt die Nuance von εὐτελής sowie das nautische Bild von κυβερνήσασα.
lexical_decisions:
- source_word: δι’ ὃν
  choice: Seinetwegen
  rationale: Die Verbindung von διά mit dem Akkusativ hat hier kausale Bedeutung und verweist im Zusammenhang auf den zuvor genannten Ungerechten als Anlass des Flutgerichts. Die grammatisch mögliche offenere Wiedergabe wird in Fußnote [a] genannt.
- source_word: κατακλυζομένην γῆν
  choice: wurde die Erde von der Flut überschwemmt
  rationale: Die Formulierung bewahrt den passiven Vorgang des Überflutetwerdens und macht den Flutkontext im Deutschen deutlich; γῆ wird wegen des umfassenden Zusammenhangs mit „Erde“ wiedergegeben.
- source_word: πάλιν διέσωσεν
  choice: rettete sie erneut
  rationale: πάλιν wird direkt mit „erneut“ wiedergegeben. Das verstärkte Verb διασῴζω bezeichnet die sichere Rettung durch eine Gefahr hindurch; das Pronomen „sie“ nimmt „die Erde“ auf.
- source_word: σοφία
  choice: die Weisheit
  rationale: Die Weisheit erscheint als handelnde, personifizierte Größe. Die gewöhnliche Kleinschreibung vermeidet, sie über den griechischen Wortlaut hinaus als Eigennamen festzulegen.
- source_word: δι’ εὐτελοῦς ξύλου
  choice: mithilfe eines unscheinbaren Stücks Holz
  rationale: εὐτελής bezeichnet etwas Geringes, Niedriges oder wenig Geachtetes; „unscheinbar“ bewahrt diese Wertung, ohne im heutigen Deutsch mangelhafte Qualität anzudeuten. ξύλον bezeichnet hier metonymisch das Holz beziehungsweise den hölzernen Gegenstand der Arche.
- source_word: τὸν δίκαιον
  choice: den Gerechten
  rationale: Die substantivierte Einzahl wird knapp und geschlechtsbezogen wiedergegeben und verweist im Erzählzusammenhang auf Noach.
- source_word: κυβερνήσασα
  choice: indem sie … hindurchsteuerte
  rationale: Das Partizip hat nautische Bedeutung und beschreibt die Weisheit als diejenige, die den Gerechten durch die Flut lenkt. „Hindurchsteuerte“ verbindet dieses Bild mit dem Rettungssinn von διέσωσεν.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Die Weisheit wird als persönlich handelnde Größe dargestellt, aber nicht als Eigenname markiert.
  alternative: „Weisheit“ als quasi-proprialen Titel großzuschreiben oder ausdrücklich mit einer göttlichen Person gleichzusetzen.
  rationale: Der Vers personifiziert σοφία deutlich, bestimmt jedoch nicht ausdrücklich ihren metaphysischen Status. Die Übersetzung erhält die Personifikation, ohne eine weitergehende dogmatische Identifikation einzutragen.
- issue: Bezug von δι’ ὃν und τὸν δίκαιον
  choice: „Seinetwegen“ verweist auf den Ungerechten des vorherigen Verses; „der Gerechte“ bezeichnet Noach.
  alternative: δι’ ὃν offen als „durch den“ zu übersetzen, wodurch auch eine instrumentale Lesart anklingen könnte.
  rationale: Der unmittelbare Zusammenhang stellt den Ungerechten als Anlass des Flutgerichts der Rettung Noachs gegenüber. Eine Fußnote bewahrt die formal mögliche offenere Wiedergabe von δι’ ὃν.
- issue: Rettung der Erde
  choice: Das Objekt von διέσωσεν wird grammatisch auf „die Erde“ bezogen.
  alternative: Den Sinn erläuternd auf die Bewohner oder das Leben auf der Erde zu beschränken.
  rationale: Der griechische Satz nennt γῆν als direktes Objekt. Die Übersetzung erhält diese kühne Aussage, statt ihren Sinn stillschweigend einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt bildhaft und knapp; „hindurchsteuerte“ erhält die nautische Metapher, während „unscheinbar“ die geringe äußere Bedeutung des Rettungsmittels ausdrückt, ohne eine schlechte Beschaffenheit der Arche anzudeuten.
