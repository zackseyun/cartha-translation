  text: He brought them across the Red Sea, and led them through abundant water;
translation:
  language: de
  text: Sie brachte sie über das Rote Meer und führte sie durch viel Wasser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch große Wassermassen«. Wörtlich steht im Griechischen »durch viel Wasser«; »Wasser« steht in der Einzahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεβίβασεν
  choice: ließ … durchqueren
  rationale: Das Verb bezeichnet das Veranlassen oder Ermöglichen einer Überquerung. Die deutsche Formulierung bewahrt den kausativen Sinn und vermeidet die mögliche Vorstellung, sie seien über die Wasseroberfläche gegangen.
- source_word: θάλασσαν ἐρυθράν
  choice: das Rote Meer
  rationale: Die herkömmliche deutsche geografische Bezeichnung gibt den klaren Bezug auf den Exodus natürlich und genau wieder.
- source_word: διήγαγεν
  choice: führte … durch
  rationale: Die Wiedergabe erhält sowohl die Bedeutung des geleiteten Hindurchgehens als auch den Unterschied zum vorherigen Verb des Überquerens.
- source_word: διʼ ὕδατος πολλοῦ
  choice: durch gewaltige Wasser
  rationale: Die Formulierung bringt die große Wassermenge in würdigem, natürlichem Deutsch zum Ausdruck. Da das Griechische grammatisch den Singular verwendet, wird die nähere Form in einer Fußnote angegeben.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: Sie
  alternative: Er
  rationale: 'Das Subjekt ist im griechischen Vers nicht eigens genannt, wird aber aus dem fortlaufenden Abschnitt übernommen: die personifizierte Weisheit. Das feminine Pronomen bewahrt diesen literarischen Zusammenhang, ohne eine zusätzliche Deutung einzuführen.'
- issue: Exodus-Anspielung und Name des Meeres
  choice: das Rote Meer
  alternative: das rote Meer
  rationale: Die feste geografische Bezeichnung macht den im griechischen Text klar erkennbaren Exodus-Bezug sichtbar.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Der parallele Satzbau und die zwei unterschiedlichen Bewegungsverben des griechischen Textes bleiben erhalten.
