  text: But he flooded their enemies[a], and from the depth of the abyss he cast them up.
translation:
  language: de
  text: Doch sie überflutete ihre Feinde und warf sie aus der Tiefe des Abgrunds empor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ sie aus der Tiefe des Abgrunds emporsteigen“. Das griechische Verb kann ausdrücken, dass etwas aufwallt oder nach oben gebracht wird; hier ist wohl gemeint, dass das Meer die Feinde aus der Tiefe emporwarf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέκλυσεν
  choice: überflutete
  rationale: Das Verb bezeichnet ein Überwältigen durch Wasser. „Überflutete“ bewahrt das konkrete Wasserbild, ohne ausdrücklich hinzuzufügen, dass die Feinde ertranken.
- source_word: τοὺς ἐχθροὺς αὐτῶν
  choice: ihre Feinde
  rationale: „Feinde“ ist die klare und übliche Wiedergabe von ἐχθρούς; das Possessivpronomen nimmt den Bezug des griechischen αὐτῶν auf.
- source_word: ἐκ βάθους ἀβύσσου
  choice: aus der Tiefe des Abgrunds
  rationale: Die singularische Formulierung bleibt nah am Griechischen und bewahrt dessen gehobenes Bild von der unergründlichen Meerestiefe.
- source_word: ἀνέβρασεν
  choice: warf … empor
  rationale: Das Verb kann ein Aufwallen oder gewaltsames Emporbringen bezeichnen. „Warf … empor“ erhält die kräftige Bewegungsrichtung, ohne den Text durch „Leichen“ oder eine ausdrückliche Todesaussage zu erweitern.
theological_decisions:
- issue: Gerichtsbild am Meer
  choice: Das konkrete Bild des Überflutens und Emporwerfens wird beibehalten, ohne „ertränkte“ oder „Tote“ einzufügen.
  alternative: „Sie ertränkte ihre Feinde und brachte sie aus den Tiefen herauf.“
  rationale: Der Vers erinnert an das Gericht über die Ägypter beim Exodus, benennt Tod oder Leichen jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung.
- issue: Nicht ausdrücklich genanntes Subjekt
  choice: Das feminine Pronomen „sie“ führt das im Zusammenhang vorausgesetzte Subjekt, die Weisheit, fort.
  alternative: Ein nicht im griechischen Vers stehendes Substantiv wie „die Weisheit“ ausdrücklich wiederholen.
  rationale: Die griechischen Verben haben ein nur aus dem Kontext erschließbares Subjekt. Das Pronomen ergibt im Deutschen einen zusammenhängenden Text, ohne eine neue Benennung in den Vers einzutragen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit bewusst kräftiger Wasser- und Bewegungsbildlichkeit. Die doppelte Verwendung von „sie“ ist grammatisch eindeutig: Das erste bezeichnet die Weisheit als Subjekt, das zweite die Feinde als Objekt.'
