translation:
  language: de
  text: Doch als ein Ungerechter sich in seinem Zorn von ihr abwandte, ging er durch seine brudermörderischen Wutausbrüche zugrunde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄδικος
  choice: ein Ungerechter
  rationale: Das substantivierte Adjektiv bezeichnet einen Menschen, der Unrecht tut; die knappe Form wahrt den Kontrast zur personifizierten Weisheit.
- source_word: ἀποστὰς ἀπ’ αὐτῆς
  choice: wandte sich von ihr ab
  rationale: Gibt die bewusste Entfernung oder Abkehr von der zuvor genannten Weisheit natürlich und präzise wieder.
- source_word: ἀδελφοκτόνοις … θυμοῖς
  choice: an seiner brudermörderischen Raserei
  rationale: ἀδελφοκτόνος bedeutet wörtlich „brudertötend“; θυμός kann heftigen Zorn, Wut oder leidenschaftliche Erregung bezeichnen. „Raserei“ vermittelt hier die tödliche, unbeherrschte Heftigkeit.
- source_word: συναπώλετο
  choice: ging … zugrunde
  rationale: Das Verb bezeichnet das Verderben oder Zugrundegehen. Die mit συν- verbundene Nuance ist im Kontext und in der Konstruktion mit dem Dativ nicht völlig eindeutig und wird deshalb in einer Fußnote offengelegt.
theological_decisions:
- issue: Unausgesprochene Identität des Ungerechten
  choice: Der Name Kain wird nicht in den Haupttext eingefügt.
  alternative: „Kain, der Ungerechte“
  rationale: Der Kontext spielt erkennbar auf Kain an, doch der griechische Text nennt ihn nicht ausdrücklich; die indirekte Erzählweise bleibt erhalten.
- issue: Bezug des femininen Pronomens αὐτῆς
  choice: „ihr“ bleibt als Rückverweis auf die personifizierte Weisheit stehen.
  alternative: „von der Weisheit“
  rationale: Das Pronomen des Ausgangstextes wird bewahrt, ohne die Personifikation durch eine erklärende Wiederholung abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ein Ungerechter“ erhält die knappe, typologische Ausdrucksweise; „brudermörderische Raserei“ ist eindringlich, ohne den im Griechischen nicht genannten Namen Kain einzutragen.
