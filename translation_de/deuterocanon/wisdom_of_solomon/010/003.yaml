review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt Abkehr von der personifizierten Weisheit, den Ungerechten und dessen Untergang grundsätzlich wieder. Sie lässt jedoch die ausdrückliche Angabe ἐν ὀργῇ αὐτοῦ („in seinem Zorn“) beim Abwenden aus und verdichtet die getrennten Ausdrücke ὀργή und die pluralischen θυμοί zu einer einzigen „Raserei“.
  naturalness: „Doch als ein Ungerechter sich in seinem Zorn von ihr abwandte, ging er durch seine brudermörderischen Wutausbrüche zugrunde“ ist modernes, würdiges und syntaktisch klares Standarddeutsch.
  terminology: „Ungerechter“ ist für ἄδικος angemessen. „Brudermörderisch“ bewahrt die bildungs- und kontextbezogene Bezeichnung, ohne den nicht genannten Kain einzuführen. „Wutausbrüche“ gibt die pluralischen θυμοῖς genauer wieder; „Zorn“ entspricht ὀργῇ.
  issues:
  - severity: medium
    issue: ἐν ὀργῇ αὐτοῦ wird nicht eigenständig wiedergegeben.
    rationale: Der griechische Text besagt, dass der Ungerechte sich „in seinem Zorn“ von ihr abwandte. Die vorhandene Fassung verschmilzt dies mit θυμοῖς zu „an seiner ... Raserei“ und verändert damit die Gliederung des Satzes.
  - severity: low
    issue: Die Fußnote erklärt eine im deutschen Haupttext nicht abgebildete „Vorsilbe“.
    rationale: In „ging zugrunde“ ist keine deutsche Entsprechung der συν-Komponente sichtbar. Zudem ist die vorgeschlagene Alternative schwerfällig und für den Hauptsinn nicht erforderlich.
  revised_text: Doch als ein Ungerechter sich in seinem Zorn von ihr abwandte, ging er durch seine brudermörderischen Wutausbrüche zugrunde.
