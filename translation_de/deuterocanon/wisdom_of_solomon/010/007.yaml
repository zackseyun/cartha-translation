  source_fidelity: 'Die drei bleibenden Zeugnisse der Bosheit sowie die zurückhaltende, nicht namentliche Anspielung auf Lots Frau werden zutreffend wiedergegeben. „Niemals“ hat jedoch keine ausdrückliche Entsprechung im Griechischen: ἀτελέστιοι beschreibt Früchte, die nicht zur Reife bzw. Vollendung gelangen, ohne zwingend eine absolute zeitliche Aussage zu machen. Die Formulierung wird daher präzisiert.'
  naturalness: Der Entwurf ist insgesamt modernes, würdiges Standarddeutsch. Die Revision glättet die Eröffnung zu einer idiomatischen Zeugnisformulierung und setzt die Querverweisfußnote unmittelbar an die Salzsäule.
  terminology: „Bosheit“, „Ödland“, „Salzsäule“ und „ungläubige Seele“ sind angemessen. „Erinnerungszeichen an“ gibt μνημεῖον im Deutschen natürlicher wieder als „Denkmal einer“, ohne die Funktion der Säule als Memorial zu verändern.
