  text: whose wickedness still has as its witness a smoking wasteland[a], plants bearing fruit that never ripens[b], and a pillar of salt standing as a memorial of an unbelieving soul.
translation:
  language: de
  text: 'Noch immer zeugen von ihrer Bosheit: ein rauchendes Ödland, fruchttragende Pflanzen, deren Früchte nicht zur Reife gelangen, und eine Salzsäule[b], die als Erinnerungszeichen an eine ungläubige[a] Seele dasteht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „treulosen“. Das griechische Wort kann Unglauben oder mangelnde Treue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Salzsäule spielt auf Lots Frau in 1. Mose 19,26 an, ohne sie hier ausdrücklich zu nennen.
    reason: cross_reference
lexical_decisions:
- source_word: ἧς … τῆς πονηρίας
  choice: ihrer Bosheit
  rationale: Das feminine Relativpronomen verweist auf das zuvor genannte Land beziehungsweise Gebiet zurück. „Bosheit“ bewahrt den moralischen Sinn von πονηρία.
- source_word: ἔτι μαρτύριον … καθέστηκε
  choice: Als Zeugnis … stehen noch da
  rationale: Die stative Perfektform bezeichnet fortdauernd vorhandene Beweiszeichen. Die deutsche Konstruktion gibt sowohl μαρτύριον als auch ἔτι natürlich wieder.
- source_word: καπνιζομένη χέρσος
  choice: ein rauchendes Ödland
  rationale: χέρσος bezeichnet brachliegendes oder verwüstetes Land; das Präsenspartizip schildert es als weiterhin Rauch ausstoßend.
- source_word: ἀτελέστιοι ὥρας καρποφοροῦντα φυτά
  choice: Pflanzen, deren Früchte niemals reif werden
  rationale: Die Wendung beschreibt Pflanzen mit Frucht, die nicht zur Vollendung beziehungsweise Reife gelangt. Die Relativkonstruktion ist im Deutschen klar und bewahrt das Bild.
- source_word: ἀπιστούσης ψυχῆς
  choice: einer ungläubigen Seele
  rationale: ἀπιστέω kann mangelnden Glauben oder mangelnde Treue bezeichnen. „Ungläubig“ ist hier quellennah; die alternative Bedeutung wird in der Fußnote erhalten.
- source_word: μνημεῖον … στήλη ἁλός
  choice: eine Salzsäule … als Denkmal
  rationale: μνημεῖον bezeichnet hier ein bleibendes Erinnerungszeichen, während στήλη ἁλός knapp und idiomatisch als „Salzsäule“ wiedergegeben wird.
- source_word: ἑστηκυῖα
  choice: dasteht
  rationale: Das Perfektpartizip betont den fortdauernden Zustand der stehenden Säule.
theological_decisions:
- issue: Identität der Salzsäule und der ungläubigen Seele
  choice: Die Gestalt wird im Haupttext nicht ausdrücklich als Lots Frau bezeichnet.
  alternative: Lots Frau im Haupttext namentlich nennen.
  rationale: Die Anspielung auf Genesis 19,26 ist deutlich, doch der griechische Vers nennt die Person nicht. Die Übersetzung wahrt diese Zurückhaltung.
- issue: Bedeutung von ἀπιστούσης
  choice: ungläubigen
  alternative: treulosen
  rationale: Beide Bedeutungsrichtungen sind möglich. Der Haupttext wählt die formnahe Lesart, während die Fußnote die echte lexikalische Alternative nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eröffnende Ausdruck „Als Zeugnis“ macht die griechische Satzstruktur verständlich; die Aufzählung bewahrt die drei fortdauernden Zeichen der Bosheit. Keine Identifikation wird über den Wortlaut hinaus in den Haupttext eingefügt.
