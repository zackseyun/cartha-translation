  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/013.yaml
  text: She did not abandon the righteous man when he was sold, but rescued him from sin;
translation:
  language: de
  text: Sie verließ den Gerechten nicht, als er verkauft wurde, sondern rettete ihn aus der Sünde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rettete ihn vor der Sünde“.'
    reason: Die Präposition ἐξ bedeutet gewöhnlich „aus“, doch im erzählerischen Bezug auf Josef kann die Wendung auch als Bewahrung vor dem Sündigen verstanden werden.
lexical_decisions:
- source_word: αὕτη
  choice: Sie
  rationale: Das feminine Demonstrativpronomen verweist im Zusammenhang auf die Weisheit; im Deutschen ist das Personalpronomen natürlich und eindeutig.
- source_word: πραθέντα
  choice: als er verkauft wurde
  rationale: Das passive Aoristpartizip wird als temporaler Nebensatz wiedergegeben; dies bewahrt sowohl das Verkauftwerden als auch den Bezug auf den Gerechten.
- source_word: δίκαιον
  choice: den Gerechten
  rationale: Die substantivische Wiedergabe entspricht dem artikellosen, prädikativ bzw. substantivisch gebrauchten Adjektiv und hält die typologische Anonymität des Abschnitts fest.
- source_word: οὐκ ἐγκατέλιπεν
  choice: verließ ... nicht
  rationale: Gibt das Zurücklassen oder Im-Stich-Lassen idiomatisch und würdig wieder.
- source_word: ἐξ ἁμαρτίας ἐρρύσατο αὐτόν
  choice: rettete ihn aus der Sünde
  rationale: ἐκ mit ῥύομαι bezeichnet Rettung aus einem Bereich oder einer Gewalt. Die ungewöhnliche Aussage wird nicht erklärend aufgelöst.
theological_decisions:
- issue: Bedeutung von ἁμαρτία im Joseph-Bezug
  choice: aus der Sünde
  alternative: vor der Sünde / aus der Verfehlung
  rationale: Der griechische Wortlaut hat ἐξ ἁμαρτίας, wörtlich „aus der Sünde“. Obwohl der Kontext an Bewahrung vor Sünde denken lassen kann, bleibt die genuine semantische und theologische Spannung im Haupttext erhalten.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Erzählprosa. Die personifizierte Weisheit bleibt durch „Sie“ erkennbar; der im Kapitel nicht namentlich genannte Gerechte wird nicht ausdrücklich als Josef identifiziert.
