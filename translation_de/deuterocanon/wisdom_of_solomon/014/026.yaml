  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Vergessen der Gunst“ beziehungsweise „der Gnade“. Das griechische χάρις kann je nach Zusammenhang Gunst, Gnade, Wohltat oder Dankbarkeit bezeichnen.'
