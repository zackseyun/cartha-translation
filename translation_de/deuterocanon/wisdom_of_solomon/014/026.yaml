    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτος ἀμνησία
  choice: das Vergessen von Wohltaten
  rationale: Die Wendung wird unmittelbar und idiomatisch wiedergegeben. „Wohltaten“ erfasst hier empfangene Gunst und lässt den Vorwurf der Undankbarkeit mitschwingen, ohne ἀμνησία ausdrücklich als „Undankbarkeit“ auszudeuten.
- source_word: ψυχῶν μιασμός
  choice: die Befleckung der Seelen
  rationale: „Befleckung“ bewahrt die moralischen und kultischen Anklänge von μιασμός; „Seelen“ entspricht dem geistlich-ethischen Sprachgebrauch der Weisheitsliteratur, ohne eine bestimmte Anthropologie festzulegen.
- source_word: γενέσεως ἐναλλαγή
  choice: die Verkehrung der Zeugung
  rationale: Die griechische Wendung ist knapp und mehrdeutig. „Verkehrung“ gibt die im Lasterkatalog negative Veränderung wieder, während „Zeugung“ den Zusammenhang mit Entstehung, Geburt und Fortpflanzung wahrt. Die wörtlicheren Möglichkeiten werden in der Fußnote offengehalten.
- source_word: γάμων ἀταξία
  choice: die Unordnung der Ehen
  rationale: Die Genitivverbindung wird formal nah wiedergegeben. „Unordnung“ bezeichnet das Fehlen der gebührenden Ordnung, ohne die gemeinten Verfehlungen enger festzulegen.
- source_word: μοιχεία
  choice: Ehebruch
  rationale: Dies ist die präzise und geläufige deutsche Entsprechung.
- source_word: ἀσέλγεια
  choice: Ausschweifung
  rationale: Das Wort bezeichnet schamloses, ungezügeltes sinnliches Verhalten. „Ausschweifung“ ist kräftig, verständlich und dem würdigen Register angemessen.
theological_decisions:
- issue: Ob χάριτος ausdrücklich theologisch als „Gnade“ wiederzugeben ist
  choice: Wohltaten
  alternative: Gnade; Gunst; Dankbarkeit
  rationale: Der Zusammenhang ist ein Katalog gesellschaftlicher und sittlicher Übel, keine ausdrückliche Lehrrede über rettende Gnade. „Wohltaten“ vermittelt empfangene Gunst, ohne spätere dogmatische Bedeutungen einzutragen; die lexikalische Alternative „Gnade“ bleibt in der Fußnote sichtbar.
- issue: Ob ψυχῶν anthropologisch flacher als „Menschen“ oder „Leben“ wiederzugeben ist
  choice: Seelen
  alternative: Menschen; Leben
  rationale: „Seelen“ bewahrt die moralisch-geistliche Aussagekraft der griechischen Formulierung, ohne eine spätere systematische Seelenlehre festzuschreiben.
- issue: Wie die mehrdeutige Wendung γενέσεως ἐναλλαγή zu deuten ist
  choice: Verkehrung der Zeugung
  alternative: Veränderung der Geburt; Vertauschung der Abstammung
  rationale: Der sexuelle und eheliche Zusammenhang legt eine negative Verkehrung im Bereich von Zeugung und Fortpflanzung nahe. Da der griechische Ausdruck jedoch auch Geburt, Entstehung oder Abstammung bezeichnen kann, wird diese Unsicherheit ausdrücklich dokumentiert.
translation_notes:
  register: Moderner, würdiger Standardwortschatz in der Form eines knappen Lasterkatalogs. Die parallelen Nominalgruppen und die Steigerung bis zu „Ehebruch und Ausschweifung“ bleiben erhalten. Unnötige konfessionelle oder dogmatische Festlegungen wurden vermieden.
