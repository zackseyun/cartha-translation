  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/027.yaml
  text: For the worship of nameless idols is the beginning and cause and end of every evil[a][b].
translation:
  language: de
  text: Denn die Verehrung namenloser Götzen[a] ist Anfang, Ursache und Ende allen Übels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Götzen ohne Namen“. Das griechische Adjektiv kann hervorheben, dass diese Götzen keinen wahren oder würdigen Namen haben.'
    reason: lexical_alternative
  - marker: b
    text: Die Folge „Anfang, Ursache und Ende“ kann auch als „Ursprung, Ursache und Vollendung“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρησκεία
  choice: Verehrung
  rationale: Das Wort bezeichnet hier die religiöse Praxis und kultische Hinwendung zu den Götzen. „Verehrung“ ist im Deutschen natürlich und lässt den Umfang der kultischen Betätigung offen.
- source_word: ἀνωνύμων
  choice: namenloser
  rationale: Das Adjektiv bedeutet wörtlich „ohne Namen“ oder „unbenannt“. „Namenlos“ bewahrt die zugespitzte Aussage, ohne zu erklären, weshalb den Götzen ein wahrer oder würdiger Name fehlt.
- source_word: εἰδώλων
  choice: Götzen
  rationale: Im Kontext bezeichnet das Wort Bilder, die als falsche Götter religiös verehrt werden. „Götzen“ gibt den polemisch-religiösen Sinn klar wieder.
- source_word: παντὸς ... κακοῦ
  choice: allen Übels
  rationale: Die umfassende Genitivverbindung wird idiomatisch und knapp wiedergegeben und bewahrt die uneingeschränkte Aussage des Verses.
- source_word: ἀρχὴ
  choice: Anfang
  rationale: „Anfang“ entspricht der Grundbedeutung und erhält die prägnante Dreierfolge des Griechischen.
- source_word: αἰτία
  choice: Ursache
  rationale: Das Substantiv bezeichnet hier einen ursächlichen Zusammenhang. „Ursache“ bleibt nah am Griechischen und vermeidet zusätzliche Deutung.
- source_word: πέρας
  choice: Ende
  rationale: Das Wort kann Ende, Grenze, Ziel oder Vollendung bezeichnen. „Ende“ bewahrt die knappe Dreierformel und lässt die mögliche Bedeutung einer letzten Auswirkung oder Vollendung offen.
theological_decisions:
- issue: Wiedergabe der Dreierfolge ἀρχὴ καὶ αἰτία καὶ πέρας
  choice: Anfang, Ursache und Ende allen Übels
  alternative: Ursprung, Ursache und Vollendung allen Übels
  rationale: Die gewählte Fassung folgt der rhetorischen Gestalt des Griechischen und bewahrt die umfassende Anklage gegen den Götzendienst. Zugleich wird πέρας nicht einseitig als Ziel, Ausgang oder Vollendung festgelegt.
- issue: Bedeutung von ἀνωνύμων in Bezug auf die Götzen
  choice: namenloser Götzen
  alternative: Götzen ohne Namen
  rationale: Der Text erklärt nicht, ob die Götzen ohne wahre Identität, ohne anerkennenswerten Namen oder des Namens unwürdig sind. „Namenlos“ erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, rhetorisch markanter Satzstruktur. Die Wiederholung der drei Hauptwörter bildet die griechische Dreierfolge nach; auf erklärende Zusätze wurde verzichtet.
