  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/020.yaml
  text: And the multitude[a], drawn by the charm of the workmanship, now regarded as an object of worship the man who a little before had been honored.
translation:
  language: de
  text: Die Menge aber, von der ansprechenden Ausführung angezogen, hielt nun den Menschen, der kurz zuvor geehrt worden war, für einen Gegenstand religiöser Verehrung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Götzenbild« oder »ein Kultbild«.'
    reason: Lexikalische Alternativen für σέβασμα; das Wort kann einen Gegenstand religiöser Verehrung und im Kontext auch ein Kultbild bezeichnen.
lexical_decisions:
- source_word: πλῆθος
  choice: die Menge
  rationale: Bewahrt den kollektiven Sinn und den gehobenen Ton, ohne das umgangssprachlichere »Menschenmenge« zu verwenden.
- source_word: ἐφελκόμενον
  choice: angezogen
  rationale: Das Partizip bezeichnet ein Herangezogen- oder Fortgerissenwerden durch eine äußere Anziehungskraft; »angezogen« ist im Deutschen natürlich und wahrt diesen passiven Zug.
- source_word: διὰ τὸ εὔχαρι τῆς ἐργασίας
  choice: von der ansprechenden Ausführung
  rationale: εὔχαρι bezeichnet die gefällige, anziehende Wirkung, ἐργασία hier die handwerklich-künstlerische Ausführung. Die Formulierung gibt Ursache und ästhetische Wirkung knapp wieder.
- source_word: τὸν πρὸ ὀλίγου τιμηθέντα ἄνθρωπον
  choice: den Menschen, der kurz zuvor geehrt worden war
  rationale: Die Wendung erhält den zeitlichen und rhetorischen Gegensatz zwischen der vorherigen menschlichen Ehrung und der nun folgenden religiösen Verehrung. ἄνθρωπος wird quellentreu als »Mensch« wiedergegeben, ohne ein nicht zwingend markiertes Geschlecht festzulegen.
- source_word: νῦν
  choice: nun
  rationale: Markiert prägnant den Gegensatz zu πρὸ ὀλίγου, »kurz zuvor«.
- source_word: σέβασμα
  choice: Gegenstand der Verehrung
  rationale: Der Ausdruck bezeichnet etwas, dem religiöse Verehrung gilt. Diese Wiedergabe lässt offen, ob stärker an ein Götzenbild, ein heiliges Bild oder allgemein an ein Verehrungsobjekt gedacht ist.
- source_word: ἐλογίσαντο
  choice: hielt ... für
  rationale: Gibt das urteilende »ansehen, erachten, halten für« idiomatisch wieder und passt zur prädikativen Konstruktion des Griechischen.
theological_decisions:
- issue: Art des mit σέβασμα bezeichneten Kultobjekts
  choice: Gegenstand der Verehrung
  alternative: Götzenbild; heiliges Bild; etwas Verehrungswürdiges
  rationale: Der Vers kritisiert den Übergang von menschlicher Ehrung zu religiöser Verehrung. Die gewählte Formulierung bewahrt diesen theologischen Vorwurf, ohne die im griechischen Wort verbleibende Offenheit auf eine bestimmte Bild- oder Götzenterminologie zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der argumentativen Bewegung des Griechischen, bleibt aber gut verständlich. Der Fußnotenmarker steht unmittelbar bei der erklärten Wendung.
