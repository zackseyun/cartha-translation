translation:
  language: de
  text: 'und alles ist miteinander vermischt: Blut und Mord[a], Diebstahl und Betrug, Verderbnis, Treulosigkeit, Aufruhr, Meineid und Verwirrung darüber, was gut ist[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Blutvergießen und Mord“; im Griechischen steht wörtlich „Blut und Mord“.'
