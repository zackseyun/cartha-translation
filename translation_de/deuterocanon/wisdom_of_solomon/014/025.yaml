lexical_decisions:
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend die Gesamtheit der aufgezählten Missstände.
- source_word: ἐπιμὶξ ἔχει
  choice: ist miteinander vermischt
  rationale: Die Wendung beschreibt einen Zustand ungeordneter Vermischung; die deutsche Formulierung bewahrt das Bild und leitet die Lasterreihe natürlich ein.
- source_word: αἷμα καὶ φόνος
  choice: Blut und Mord
  rationale: „Blut“ gibt αἷμα wörtlich wieder, während „Mord“ den moralischen Sinn von φόνος in diesem Lasterkatalog trifft. Die mögliche sinngemäße Wiedergabe von αἷμα als „Blutvergießen“ wird in der Fußnote genannt.
- source_word: κλοπὴ καὶ δόλος
  choice: Diebstahl und Betrug
  rationale: Die nominale Reihung des Griechischen bleibt erhalten; „Betrug“ ist eine klare moderne Wiedergabe des hier sozial-ethisch gebrauchten δόλος.
- source_word: φθορά
  choice: Verderbnis
  rationale: Das Wort kann Verfall, Zerstörung oder moralische Zerrüttung bezeichnen; „Verderbnis“ wahrt in diesem Zusammenhang die entsprechende Bedeutungsbreite.
- source_word: ἀπιστία
  choice: Treulosigkeit
  rationale: Im Zusammenhang des sozialen und moralischen Zerfalls bezeichnet der Ausdruck eher Unzuverlässigkeit und gebrochene Loyalität als ausdrücklich religiösen Unglauben.
- source_word: τάραχος
  choice: Aufruhr
  rationale: Der Begriff bezeichnet Unruhe, Erschütterung oder Tumult; „Aufruhr“ passt zur gesteigerten Darstellung gesellschaftlicher Zerrüttung.
- source_word: ἐπιορκία
  choice: Meineid
  rationale: Der Ausdruck bezeichnet falsches Schwören beziehungsweise die Verletzung eines Eides; „Meineid“ ist knapp und präzise.
- source_word: θόρυβος ἀγαθῶν
  choice: Verwirrung darüber, was gut ist
  rationale: Die schwierige Wortgruppe wird im ethischen Kontext als Verwirrung über das Gute verstanden. Die Übersetzung bleibt verständlich, während andere grammatisch mögliche Deutungen in der Fußnote offengelegt werden.
theological_decisions:
- issue: Bedeutung von ἀπιστία im Lasterkatalog
  choice: Treulosigkeit
  alternative: Unglaube
  rationale: Der unmittelbare Kontext beschreibt zwischenmenschlichen und gesellschaftlichen Verfall. Daher ist die relationale und ethische Bedeutung wahrscheinlicher, ohne die weitere Bedeutungsbreite des Wortes grundsätzlich auszuschließen.
- issue: Deutung von θόρυβος ἀγαθῶν
  choice: Verwirrung darüber, was gut ist
  alternative: Störung guter Dinge / Aufruhr um Güter
  rationale: Die gewählte Fassung versteht ἀγαθῶν ethisch als „das Gute“. Da die knappe griechische Verbindung auch gegenständlich oder auf Wohltaten bezogen werden kann, wird die Unsicherheit ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit rhythmischer nominaler Reihung. Der Satzanfang und das abschließende Komma wahren den Zusammenhang mit den benachbarten Versen. Schwierige beziehungsweise mehrdeutige Ausdrücke werden nicht stillschweigend vereindeutigt, sondern durch Fußnoten abgesichert.
