  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/001.yaml
  text: Again[a], someone preparing to sail and about to pass through wild waves boards more fragile wood than the ship that carries him.
translation:
  language: de
  text: Wieder besteigt jemand, der sich zur Seefahrt anschickt und im Begriff ist, wilde Wogen zu durchqueren, ein Stück Holz, das morscher ist als das Schiff, das ihn trägt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Stück Holz, das gebrechlicher ist als das Schiff, das ihn trägt«. Das griechische Wort kann sowohl Morschheit oder Verfall als auch allgemein mangelnde Festigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰλοῦν
  choice: in See stechen
  rationale: Der überlieferte bzw. normalisierte Ausdruck wird im nautischen Zusammenhang als Hinweis auf eine Seereise verstanden; die deutsche Wendung ist natürlich und macht diesen Zusammenhang deutlich.
- source_word: τις
  choice: jemand
  rationale: Das indefinite Pronomen bezeichnet eine beispielhafte Person; »jemand« gibt dies im Deutschen ohne unnötige Festlegung wieder.
- source_word: πάλιν
  choice: Wieder
  rationale: Das Adverb führt ein weiteres Beispiel innerhalb der Argumentation ein.
- source_word: στελλόμενος
  choice: will … in See stechen
  rationale: Das mediale Partizip bezeichnet hier das Sichanschicken oder Aufbrechen zu einer Reise und wird mit dem nautischen Zusammenhang idiomatisch verbunden.
- source_word: ἄγρια … κύματα
  choice: wilde Wogen
  rationale: Die Alliteration ist natürlich und würdevoll; »wild« bewahrt die bedrohliche Bildkraft des griechischen Adjektivs.
- source_word: διοδεύειν
  choice: zu durchqueren
  rationale: Das Verb bezeichnet das Hindurchgehen beziehungsweise Durchfahren und wahrt damit die räumliche Kraft des Ausdrucks.
- source_word: τοῦ φέροντος αὐτὸν πλοίου
  choice: als das Schiff, das ihn trägt
  rationale: Die Vergleichskonstruktion und das tragende Schiff werden unmittelbar wiedergegeben.
- source_word: σαθρότερον
  choice: noch morscher
  rationale: Der Komparativ bezeichnet etwas strukturell Unsicheres, Brüchiges oder Verfaultes. »Morscher« passt besonders zu ξύλον und erhält die zugespitzte Ironie.
- source_word: ξύλον
  choice: ein Holz
  rationale: Der Ausdruck bezeichnet das hölzerne Fahrzeug beziehungsweise Gebilde, das bestiegen wird. Die knappe Metonymie des Griechischen bleibt erhalten, ohne ausdrücklich »Stück Holz« zu ergänzen.
- source_word: ἐπιβᾶται
  choice: besteigt er
  rationale: Das Verb bedeutet, auf etwas zu steigen oder es zu besteigen; hier ist der nautische Sinn des Anbordgehens eingeschlossen.
theological_decisions:
- issue: Die Pointe des Vergleichs σαθρότερον ξύλον
  choice: ein Holz, das noch morscher ist als das Schiff, das ihn trägt
  alternative: ein gebrechlicheres Holz als das Schiff, das ihn trägt
  rationale: 'Die Übersetzung wahrt den ausdrücklich komparativen Gedanken: Der Mensch vertraut sich einem hölzernen Gebilde an, das sogar noch unsicherer ist als das tragende Schiff. »Morsch« legt die materielle Schadhaftigkeit nahe, ohne die Aussage theologisch weiter auszudeuten.'
- issue: Geschlecht der beispielhaften Person
  choice: jemand
  alternative: ein Mann
  rationale: τις ist formal geschlechtsunspezifisch und dient hier einer allgemeinen Fallbeschreibung. Das folgende maskuline Pronomen wird im Deutschen grammatisch passend mit »ihn« aufgenommen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer nautischer Bildsprache. Der Semikolon-Satz bewahrt den argumentativen Ablauf und hebt die ironische Wendung beim Besteigen des Holzes hervor.
