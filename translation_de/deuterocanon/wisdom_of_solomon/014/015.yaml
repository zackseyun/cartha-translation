  verdict: revise
  source_fidelity: 'Der Entwurf gibt den griechischen Satzbau und die wesentlichen Begriffe insgesamt zuverlässig wieder: die vorzeitige Trauer, das rasch weggenommene Kind, das Bild, der Kontrast zwischen dem damals toten Menschen und seiner späteren kultischen Verehrung sowie die Weitergabe von Mysterien und Riten. Für ὡς θεόν ist im Deutschen jedoch „als einen Gott“ genauer als „wie einen Gott“, da es die zugeschriebene Stellung bzw. Verehrung bezeichnet, nicht bloß einen Vergleich.'
  naturalness: „Den Menschen unter seiner Gewalt“ ist zwar verständlich, klingt im modernen Standarddeutsch aber unnötig hart und weniger idiomatisch. „Seinen Untergebenen“ gibt den weiten Sinn von τοῖς ὑποχειρίοις natürlich wieder. „Gab ... weiter“ ist für die Weitergabe von kultischen Praktiken klarer als „überlieferte“ mit einem indirekten Objekt.
  terminology: „Bild“, „Mysterien“ und „Riten“ sind angemessen. „Als einen Gott“ wahrt den polemischen Kontext, ohne die Gottheit des Verstorbenen zu bestätigen. Die Fußnote zu Mysterien und Riten wird grammatisch auf die pluralische Begriffspaarung abgestimmt.
  issues:
  - severity: medium
    issue: „wie einen Gott“ für ὡς θεόν
    rationale: Die griechische Wendung bezeichnet hier die Behandlung bzw. Verehrung des Verstorbenen als Gott. „Wie einen Gott“ kann im Deutschen stärker einen bloßen Vergleich nahelegen; „als einen Gott“ ist näher am Sinn und bleibt theologisch nicht bestätigend.
  - severity: low
    issue: „den Menschen unter seiner Gewalt“
    rationale: Die Formulierung ist semantisch möglich, aber im modernen Deutsch schwerfällig und stärker auf Zwang fokussiert. „Seinen Untergebenen“ ist idiomatischer und bewahrt die Offenheit bezüglich Hausangehöriger oder politisch Abhängiger.
  - severity: low
    issue: Singularkongruenz in Fußnote b
    rationale: Bei der koordinierten Begriffspaarung ist „bezeichnen“ stilistisch und grammatisch klarer als „bezeichnet“.
