revisions:
- from: Denn ein Vater, den die vorzeitige Trauer um sein rasch hinweggenommenes Kind[a] zermürbte, fertigte ein Bild des damals toten Menschen an, verehrte ihn nun wie einen Gott und überlieferte den Menschen unter seiner Gewalt Mysterien und Riten[b];
  to: Denn ein Vater, den die vorzeitige Trauer um sein rasch hinweggenommenes Kind[a] zermürbte, fertigte ein Bild des damals toten Menschen an, verehrte ihn nun als einen Gott und gab seinen Untergebenen Mysterien und Riten weiter[b];
  rationale: 'Die Revision beschränkt sich auf sichere sprachliche und semantische Präzisierungen: Die Verehrung erfolgt „als einen Gott“, nicht nur vergleichsweise „wie einen Gott“; die von ihm abhängigen Personen werden idiomatisch als „seine Untergebenen“ bezeichnet; und die Fußnote erhält passende Pluralkongruenz. Der Satzanschluss mit „Denn“ und das abschließende Semikolon bleiben erhalten.'
  reviewer_model: gpt-5.6-terra
