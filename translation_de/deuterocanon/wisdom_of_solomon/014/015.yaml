base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/015.yaml
  text: For a father[a], worn down by untimely grief for the child quickly taken away, made an image of the one then dead, and now honored him as a god, and handed down mysteries and rites to those under his authority[b];
translation:
  language: de
  text: Denn ein Vater, den die vorzeitige Trauer um sein rasch hinweggenommenes Kind[a] zermürbte, fertigte ein Bild des damals toten Menschen an, verehrte ihn nun als einen Gott und gab seinen Untergebenen Mysterien und Riten weiter[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Rasch hinweggenommen“ kann auch „plötzlich hinweggenommen“ oder „entrissen“ bedeuten. Zusammen mit „vorzeitige Trauer“ hebt der griechische Text hervor, dass das Kind unerwartet früh starb.
    reason: lexical_alternative
  - marker: b
    text: „Mysterien und Riten“ bezeichnen geheime oder mit einer Einweihung verbundene religiöse Kulthandlungen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀώρῳ πένθει
  choice: die vorzeitige Trauer
  rationale: ἀώρῳ bezeichnet etwas, das vor der rechten oder erwarteten Zeit eintritt. Die knappe Wiedergabe bewahrt den Bezug auf den zu frühen Todesfall, ohne ihn ausdrücklich auszudeuten.
- source_word: τρυχόμενος
  choice: zermürbte
  rationale: Das Partizip beschreibt ein fortdauerndes Aufgerieben- oder Aufgezehrtwerden durch Leid. „Zermürbte“ ist im Deutschen natürlich und wahrt die Intensität.
- source_word: τοῦ ταχέως ἀφαιρεθέντος τέκνου
  choice: um sein rasch hinweggenommenes Kind
  rationale: τέκνον ist geschlechtsneutral und wird daher mit „Kind“ wiedergegeben. ἀφαιρεθέντος bezeichnet das Wegnehmen; „hinweggenommen“ passt zum Tod, ohne zusätzliche Gewaltbildlichkeit einzutragen. ταχέως bleibt mit „rasch“ ausdrücklich erhalten.
- source_word: εἰκόνα
  choice: ein Bild
  rationale: „Bild“ gibt die Grundbedeutung wieder. „Götzenbild“ würde die polemische Bewertung des Zusammenhangs bereits in das einzelne Substantiv hineintragen.
- source_word: τὸν τότε νεκρὸν ἄνθρωπον
  choice: des damals toten Menschen
  rationale: 'Die Formulierung hält den Gegensatz zwischen τότε („damals“) und νῦν („nun“) fest: Ein toter Mensch wird anschließend göttlich verehrt. „Mensch“ bewahrt zudem die ausdrückliche Betonung seiner Menschlichkeit.'
- source_word: νῦν ὡς θεὸν ἐτίμησεν
  choice: verehrte ihn nun wie einen Gott
  rationale: ἐτίμησεν bezeichnet hier kultische Ehrung. „Wie einen Gott“ gibt ὡς θεόν unmittelbar wieder und behauptet nicht, der Verstorbene sei tatsächlich göttlich.
- source_word: παρέδωκεν
  choice: überlieferte
  rationale: Das Verb bezeichnet Weitergabe oder Tradierung. „Überlieferte“ erfasst die Weitergabe kultischer Praktiken, ohne zwingend eine erstmalige Einführung zu behaupten.
- source_word: τοῖς ὑποχειρίοις
  choice: den Menschen unter seiner Gewalt
  rationale: Das substantivierte Adjektiv bezeichnet Personen unter jemandes Hand, Macht oder Verfügungsgewalt. Diese Wiedergabe lässt offen, ob Hausangehörige, Untergebene oder politische Untertanen gemeint sind.
- source_word: μυστήρια καὶ τελετάς
  choice: Mysterien und Riten
  rationale: Die beiden kultischen Fachbegriffe bezeichnen geheime beziehungsweise initiatorische religiöse Handlungen und ihre rituellen Vollzüge. Die formnahe Paarung bewahrt den historischen Klang.
theological_decisions:
- issue: Wiedergabe von θεός im polemischen Zusammenhang der Vergöttlichung eines Verstorbenen
  choice: wie einen Gott
  alternative: als Gott; als göttlich
  rationale: Die Wendung beschreibt die dem Verstorbenen erwiesene göttliche Verehrung, ohne seine Göttlichkeit zu bestätigen. „Wie einen Gott“ bewahrt den durch ὡς ausgedrückten Vergleich beziehungsweise die zugeschriebene Stellung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit formnaher Satzstruktur. Der mit „Denn“ eröffnete und mit Semikolon endende Satz wahrt seinen Zusammenhang mit dem folgenden Vers. Kultische Fachbegriffe bleiben erhalten und werden in der Fußnote erläutert.
