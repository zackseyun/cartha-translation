  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/014.yaml
  text: For by human vanity it entered into the world, and because of this their end was devised to be brief.
translation:
  language: de
  text: Denn durch menschliche Eitelkeit[b] kam sie[a] in die Welt, und deshalb wurde für sie ein kurzes Ende ersonnen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt von „kam“ wird im Griechischen nicht genannt; im Zusammenhang kann es sich auf die Götzenverehrung oder auf das Aufkommen von Götzen beziehen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „durch menschliche Ruhmsucht“. Das griechische Wort bezeichnet leeren Selbstruhm oder Eitelkeit.'
    reason: lexical_alternative
  - marker: c
    text: Das Passiv „wurde … ersonnen“ nennt nicht ausdrücklich, wer ihr kurzes Ende ersann.
    reason: alternative_reading
lexical_decisions:
- source_word: κενοδοξίᾳ ἀνθρώπων
  choice: durch menschliche Eitelkeit
  rationale: Der Dativ lässt sich instrumental oder kausal verstehen. „Eitelkeit“ bewahrt den Gedanken leerer Selbstherrlichkeit, während „durch“ die Entstehungsursache natürlich ausdrückt.
- source_word: εἰσῆλθεν εἰς κόσμον
  choice: kam sie in die Welt
  rationale: Das singularische Verb hat ein nur aus dem Kontext erschließbares Subjekt. Das Pronomen „sie“ hält diese Ellipse offen und kann sich auf die im Zusammenhang behandelte Erscheinung des Götzendienstes beziehen.
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Die knappe Folgerung gibt den kausalen Zusammenhang im Deutschen klar und natürlich wieder.
- source_word: σύντομον ... τέλος
  choice: ein baldiges Ende
  rationale: σύντομος bezeichnet hier die Kürze beziehungsweise das rasche Eintreten des Endes. „Baldig“ ist in Verbindung mit „Ende“ idiomatischer als „kurz“.
- source_word: αὐτῶν
  choice: für sie
  rationale: Das griechische Pluralpronomen verweist am ehesten auf die im Kontext genannten Götzen oder Bilder. Deutsch kann dies mit dem pluralisch verstandenen „sie“ wiedergeben, ohne den Bezug im Haupttext auszudeuten.
- source_word: ἐπενόηθη
  choice: wurde ... ersonnen
  rationale: Das Passiv und der gedanklich-planende Gehalt des Verbs bleiben erhalten; ein handelndes Subjekt wird nicht ergänzt.
theological_decisions:
- issue: Unausgesprochenes Subjekt von εἰσῆλθεν
  choice: Das grammatisch nötige Pronomen „sie“ wird verwendet, ohne das Gemeinte ausdrücklich als „Götzendienst“ festzulegen.
  alternative: „Der Götzendienst kam in die Welt“ oder ein pluralischer Bezug auf Götzenbilder.
  rationale: Im Griechischen bleibt das Subjekt unausgesprochen und wird aus dem Kontext erschlossen. Eine ausdrückliche Benennung würde die echte Mehrdeutigkeit reduzieren.
- issue: Agens des Passivs ἐπενόηθη
  choice: Das Passiv wird ohne genanntes Agens bewahrt.
  alternative: Ein göttliches Passiv („Gott bestimmte“) oder eine unpersönliche Schicksalsformulierung („war bestimmt“).
  rationale: Der Vers nennt nicht, wer dieses Ende ersann. Daher wird kein theologisches Agens in den Haupttext eingefügt.
- issue: Bezug von αὐτῶν
  choice: Das pluralische „für sie“ bleibt bezugsoffen und verweist kontextuell auf die Götzen oder Bilder.
  alternative: Ein singularischer Bezug auf den Götzendienst als Erscheinung.
  rationale: Die griechische Pluralform soll nicht durch eine singularische Deutung eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber idiomatisch gestaltet. „Eitelkeit“ und „ersonnen“ sind gehoben, jedoch allgemein verständlich; die Fußnoten bewahren die lexikalische und syntaktische Offenheit.
