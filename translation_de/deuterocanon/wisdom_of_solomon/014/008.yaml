  text: But the thing made by hands is accursed[a], both it and the one who made it, because the one made it[b], but the perishable thing was called god.
translation:
  language: de
  text: Doch das von Menschenhand Gemachte[a] steht unter dem Fluch – es selbst und der, der es gemacht hat; denn er arbeitete daran, das Vergängliche aber wurde Gott genannt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das von Händen Gemachte«; im Zusammenhang ist ein von Menschen gefertigtes Götzenbild gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein Gott genannt«.'
    reason: alternative_reading
lexical_decisions:
- source_word: χειρόποιητον
  choice: das von Menschenhand Gemachte
  rationale: Die substantivierte Wiedergabe bewahrt den wörtlichen Gedanken des von Händen Hergestellten, klingt im modernen Deutschen natürlich und setzt nicht ausdrücklich »Götzenbild« ein, obwohl dieses im Zusammenhang gemeint ist.
- source_word: ἐπικατάρατον
  choice: steht unter dem Fluch
  rationale: Die Formulierung gibt den Zustand des Verfluchtseins mit dem religiös-gerichtlichen Gewicht des griechischen Ausdrucks wieder.
- source_word: ὁ ποιήσας αὐτό
  choice: der, der es gemacht hat
  rationale: Die partizipiale Personenbezeichnung wird ohne unnötige geschlechtsspezifische Ergänzung klar und strukturell nah am Griechischen wiedergegeben.
- source_word: ἠργάζετο
  choice: fertigte es an
  rationale: »Anfertigen« bezeichnet hier die handwerkliche Herstellung und vermeidet im Deutschen die unklare Formulierung »arbeitete daran«; das Imperfekt wird durch das Präteritum wiedergegeben.
- source_word: φθαρτὸν
  choice: das Vergängliche
  rationale: Die substantivierte Form erhält den Kontrast zwischen der zerstörbaren Beschaffenheit des Gegenstands und seiner Benennung als Gott.
- source_word: θεὸς ὠνομάσθη
  choice: wurde Gott genannt
  rationale: Die Wiedergabe ohne unbestimmten Artikel bewahrt die polemische Zuspitzung, dass einem vergänglichen Gegenstand die Gottesbezeichnung beigelegt wurde.
theological_decisions:
- issue: Soll der Bezug auf ein Götzenbild im Haupttext ausdrücklich gemacht werden?
  choice: Die allgemeinere Formulierung »das von Menschenhand Gemachte« bleibt erhalten.
  alternative: »das von Menschenhand gemachte Götzenbild«
  rationale: Der Zusammenhang handelt eindeutig von Götzenbildern, doch χειρόποιητον nennt zunächst nur das von Händen Hergestellte. Die allgemeinere Wiedergabe bewahrt die Rhetorik des Ausgangstextes.
- issue: Soll θεὸς als »Gott« oder »ein Gott« wiedergegeben werden?
  choice: »Gott«
  alternative: »ein Gott«
  rationale: Der artikellose griechische Prädikatsausdruck lässt beide deutschen Wiedergaben erwägen. »Gott genannt« erhält die polemische Kraft, ohne den Gegenstand ausdrücklich als einen Gott unter mehreren einzuordnen; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau hält den griechischen Gegensatz zwischen Hersteller und vergänglichem Erzeugnis sichtbar; der Gedankenstrich macht den eingeschobenen Umfang des Fluches lesbar.
