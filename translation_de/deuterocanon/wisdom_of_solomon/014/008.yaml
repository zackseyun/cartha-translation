revisions:
- from: Doch das von Menschenhand Gemachte[a] steht unter dem Fluch – es selbst und der, der es gemacht hat; denn der eine fertigte es an, das Vergängliche aber wurde Gott genannt.[b]
  to: Doch das von Menschenhand Gemachte[a] steht unter dem Fluch – es selbst und der, der es gemacht hat; denn er arbeitete daran, das Vergängliche aber wurde Gott genannt.[b]
  rationale: Die Revision stellt den griechischen Gegensatz zwischen demjenigen, der das Objekt bearbeitete, und dem vergänglichen Objekt klarer dar. Sie vermeidet, eine zweite Person anzudeuten, und erhält zugleich die Verlaufsnuance des Imperfekts. Die allgemeine Formulierung für χειρόποιητον und die theologisch nicht weiter festgelegte Wiedergabe „Gott genannt“ bleiben bestehen.
