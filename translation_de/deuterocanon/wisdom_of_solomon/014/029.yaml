review_pass:
  verdict: revise
  source_fidelity: Der Satzbau und die Wiedergabe von πεποιθότες, εἰδώλοις, κακῶς, ὀμόσαντες, ἀδικηθῆναι und οὐ προσδέχονται sind sachgerecht. Allerdings ist die in der bereitgestellten griechischen Quellangabe stehende Form αἴγνιοι mit dem Dativ εἰδώλοις nicht syntaktisch vereinbar und ergibt keine tragfähige Grundlage für „leblose“. Die Übersetzung folgt damit erkennbar der auch im englischen Audit vorausgesetzten Lesart ἀψύχοις („leblos“), nicht dem buchstäblich angegebenen Wortlaut. Dies muss als Textproblem transparent und ohne eine zu starke Behauptung über die Überlieferung kenntlich gemacht werden.
  naturalness: „Da sie nämlich auf leblose Götzenbilder vertrauen, erwarten sie, nachdem sie frevelhaft geschworen haben, nicht, Schaden zu erleiden“ ist modernes, würdiges und gut verständliches Standarddeutsch. „Erwarten“ gibt προσδέχονται unmittelbarer wieder als die etwas umständlichere Konstruktion „rechnen ... nicht damit“.
  terminology: „Götzenbilder“ trifft εἰδώλοις im religionskritischen Kontext. „Frevelhaft“ bewahrt die ethisch-religiöse Wertung von κακῶς, ohne es auf einen falschen Eid zu beschränken. „Schaden zu erleiden“ lässt die Weite von ἀδικηθῆναι bestehen; die Fußnote darf die kontextnahe Möglichkeit von Strafe oder Vergeltung nennen, aber nicht zur alleinigen Bedeutung machen.
  issues:
  - severity: high
    issue: Die Quellform αἴγνιοι trägt die Übersetzung „leblose“ nicht.
    rationale: Die Form ist in der vorliegenden Satzkonstruktion auffällig und steht zudem im Widerspruch zur im englischen Audit behandelten Bedeutung. Der Haupttext übernimmt implizit eine abweichende, naheliegende Lesart. Dies verlangt eine klarer formulierte textkritische Anmerkung und menschliche Prüfung der Quellschicht.
  - severity: low
    issue: Die bisherige Fußnote a behauptet zu bestimmt eine fehlerhafte Überlieferung und verweist unspezifisch auf den „üblichen griechischen Text“.
    rationale: Aus den bereitgestellten Daten allein lässt sich die Überlieferungsgeschichte nicht abschließend beurteilen. Die Anmerkung sollte präzise sagen, dass die vorliegende Quellform problematisch ist und der Übersetzung die in anderen Textausgaben erwartete Lesart zugrunde liegt.
  revised_text: Da sie nämlich auf leblose Götzenbilder[a] vertrauen, erwarten sie, nachdem sie frevelhaft geschworen haben, nicht, Schaden zu erleiden.[b]
  revised_footnotes:
