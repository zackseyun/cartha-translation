base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/029.yaml
  text: For because they trusted in lifeless idols[b][a], after swearing wickedly they do not expect to be harmed.
translation:
  language: de
  text: Denn weil sie auf leblose Götzenbilder[a] vertrauen, rechnen sie, nachdem sie frevelhaft geschworen haben, nicht damit, Schaden zu erleiden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zugrunde gelegte griechische Form ist an dieser Stelle offenbar fehlerhaft überliefert; dem Zusammenhang und dem üblichen griechischen Text zufolge ist „leblose Götzenbilder“ gemeint. Möglich ist sinngemäß auch: „nichtige“ oder „wertlose Götzenbilder“.'
    reason: textual_and_lexical_issue
  - marker: b
    text: 'Oder: „Unrecht zu erleiden“; im Zusammenhang kann damit besonders eine Strafe oder Vergeltung für das frevelhafte Schwören gemeint sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: αἴγνιοι
  choice: leblose
  rationale: Die angegebene Form ist lexikalisch und syntaktisch auffällig und dürfte eine fehlerhafte Wiedergabe des in diesem Vers bezeugten Adjektivs ἀψύχοις sein. „Leblose“ entspricht dem Zusammenhang, in dem die Machtlosigkeit der Götzenbilder die falsche Sicherheit der Schwörenden begründet.
- source_word: πεποιθότες
  choice: weil sie … vertrauen
  rationale: Das Perfektpartizip bezeichnet ein gefestigtes Vertrauen; die kausale Wiedergabe nimmt γάρ auf und ergibt im Deutschen einen klaren Satzanschluss.
- source_word: εἰδώλοις
  choice: Götzenbilder
  rationale: Gemeint sind kultisch verehrte Bilder. „Götzenbilder“ ist im heutigen Deutsch konkreter als „Götzen“ und bewahrt den Bildcharakter von εἴδωλον.
- source_word: κακῶς
  choice: frevelhaft
  rationale: Das Adverb bewertet das Schwören moralisch. „Frevelhaft“ bewahrt diese religiös-ethische Schärfe, ohne den Ausdruck auf „falsch“ beziehungsweise Meineid zu verengen.
- source_word: ὀμόσαντες
  choice: nachdem sie … geschworen haben
  rationale: Das Aoristpartizip wird als dem Erwarten vorausgehende Handlung wiedergegeben; ein zusätzliches Substantiv „Eid“ ist nicht nötig.
- source_word: ἀδικηθῆναι
  choice: Schaden zu erleiden
  rationale: Die passive Form kann allgemein bedeuten, dass jemand geschädigt, ins Unrecht gesetzt oder nachteilig getroffen wird. Die Formulierung hält offen, ob besonders an Vergeltung oder Strafe gedacht ist.
- source_word: οὐ προσδέχονται
  choice: rechnen sie … nicht damit
  rationale: Die Wendung gibt die Erwartung ausbleibender nachteiliger Folgen in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutung der erwarteten Folge
  choice: Die Schwörenden rechnen nicht damit, Schaden zu erleiden.
  alternative: Sie erwarten keine Strafe für ihr frevelhaftes Schwören beziehungsweise keinen Schaden durch die angerufenen Götzenbilder.
  rationale: ἀδικηθῆναι bleibt semantisch weit. Der Zusammenhang legt Vergeltung nahe, doch der Haupttext soll weder den Urheber des Schadens noch dessen genaue Art festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Frevelhaft“ trägt die moralisch-religiöse Wertung von κακῶς, während „Schaden zu erleiden“ die absichtliche Offenheit von ἀδικηθῆναι wahrt. Die Satzstellung hält Ursache, vorausgehende Handlung und ausbleibende Erwartung klar auseinander.
