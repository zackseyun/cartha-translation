lexical_decisions:
- source_word: δεικνὺς
  choice: und damit zeigst
  rationale: Das präsentische Partizip führt den Gedanken des vorherigen Verses weiter. Die verbale Fassung ist im Deutschen natürlich; „damit“ bringt den aufweisenden Zusammenhang zum Ausdruck.
- source_word: δύνασαι
  choice: du kannst
  rationale: Gibt die unmittelbar an Gott gerichtete Aussage über sein Vermögen klar und würdig wieder.
- source_word: ἐκ παντὸς
  choice: aus allem
  rationale: Bewahrt bewusst die umfassende und im Griechischen nicht ausdrücklich auf Gefahren eingeschränkte Formulierung; der Zusammenhang legt Rettung aus jeder Gefahr nahe.
- source_word: σώζειν
  choice: retten
  rationale: Trifft sowohl die konkrete Rettung im Zusammenhang der Seefahrt als auch den weiteren theologischen Klang des Verbs.
- source_word: ἵνα κἂν
  choice: sodass selbst
  rationale: Gibt die Folge beziehungsweise den Zweck und die verstärkende Kraft von κἄν in natürlichem Deutsch wieder.
- source_word: ἄνευ τέχνης
  choice: ohne Fachkenntnis
  rationale: τέχνη bezeichnet hier praktisches Können beziehungsweise Sachkunde, im Kontext besonders seemännische Erfahrung. „Fachkenntnis“ bleibt etwas weiter als „Seemannskunst“.
- source_word: τις
  choice: jemand
  rationale: Bewahrt die unbestimmte, allgemein gehaltene Einzahl.
- source_word: ἐπιβῇ
  choice: an Bord gehen kann
  rationale: Gibt im nautischen Zusammenhang die konkrete Bedeutung des Verbs klar und idiomatisch wieder.
theological_decisions:
- issue: Reichweite von ἐκ παντὸς σώζειν
  choice: aus allem retten
  alternative: aus jeder Gefahr retten
  rationale: Die wörtlich breite Aussage wird im Haupttext erhalten, ohne sie auf Seenot zu verengen. Der maritime Kontext und die mögliche kontextuelle Wiedergabe werden in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wird als Fortsetzung des vorherigen Verses formuliert. Die breite Aussage über Gottes Rettungsmacht bleibt erhalten; die nautische Konkretisierung steht in den Anmerkungen.
