base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/012.yaml
  text: For the beginning of sexual immorality is the devising of idols[b][a], and the invention of them is the corruption of life.
translation:
  language: de
  text: Denn der Anfang sexueller Unmoral ist das Ersinnen von Götzen[a], und ihre Erfindung ist das Verderben des Lebens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Vorstellung von Götzen“; auch: „das Ausdenken von Götzen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Ruin des Lebens“ beziehungsweise „die Vernichtung des Lebens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ
  choice: der Anfang
  rationale: Bewahrt die knappe Prädikatsstruktur und lässt zugleich den im Zusammenhang möglichen ursächlichen Sinn von Ursprung oder Ausgangspunkt offen.
- source_word: πορνείας
  choice: sexueller Unmoral
  rationale: Gibt den weiten Sinn unerlaubten sexuellen Verhaltens in verständlichem modernem Deutsch wieder, ohne die im Kontext mögliche Bildsprache geistlicher Untreue an die Stelle des unmittelbaren Wortsinns zu setzen.
- source_word: ἐπίνοια
  choice: das Ersinnen
  rationale: Bezeichnet eine gedankliche Konzeption oder planvolle Hervorbringung und entspricht dem bewussten menschlichen Hervorbringen von Götzen.
- source_word: εἰδώλων
  choice: von Götzen
  rationale: Im jüdisch-griechischen Kontext bezeichnet εἴδωλον hier nicht wertneutral Bilder, sondern Kultbilder als Gegenstände falscher Verehrung.
- source_word: εὕρεσις
  choice: Erfindung
  rationale: Im Parallelismus mit ἐπίνοια meint das Wort hier eher das Hervorbringen beziehungsweise Erfinden als ein bloßes Entdecken.
- source_word: αὐτῶν
  choice: ihre
  rationale: Das Pronomen verweist auf die Götzen zurück; die possessive Form ist im Deutschen natürlich und erhält den Genitivbezug.
- source_word: φθορὰ
  choice: das Verderben
  rationale: Verderben umfasst sowohl moralische Zerrüttung als auch ruinöse oder zerstörerische Folgen, ohne den Ausdruck auf physischen Untergang zu verengen.
- source_word: ζωῆς
  choice: des Lebens
  rationale: Gibt den griechischen Genitiv knapp wieder und wahrt die weit gefasste, aphoristische Aussage.
theological_decisions:
- issue: Ob πορνεία wörtlich als sexuelle Unmoral oder metaphorisch als Götzendienst beziehungsweise Untreue wiederzugeben ist
  choice: sexuelle Unmoral
  alternative: Götzendienst; Untreue
  rationale: Der Satz unterscheidet πορνεία vom Ersinnen der Götzen und stellt zwischen beiden eine Ursprungsbeziehung her. Eine rein metaphorische Wiedergabe würde diese Aussage einebnen; mögliche Anklänge an geistliche Untreue bleiben durch den Kontext erhalten.
- issue: Ob φθορὰ ζωῆς eng als Vernichtung des Lebens oder breiter wiederzugeben ist
  choice: das Verderben des Lebens
  alternative: die Vernichtung des Lebens; der Ruin des Lebens
  rationale: Die gewählte Formulierung erhält die Breite des griechischen Ausdrucks zwischen moralischer Verderbnis und zerstörerischem Ausgang und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, spruchartiger Satzstruktur. „Sexuelle Unmoral“ ist allgemein verständlich und weniger veraltet als „Unzucht“; „Ersinnen“ und „Verderben“ bewahren den gehobenen Weisheitsstil, ohne unnatürlich zu wirken.
