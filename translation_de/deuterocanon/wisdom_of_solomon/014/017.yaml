  terminology: »Ehren« ist für τιμᾶν sachgerecht und trägt noch keine überzogene kultische Bedeutung ein. »Sichtbares Bild« entspricht ἐμφανῆ εἰκόνα. »Schmeicheln« bewahrt die kritische Nuance von κολακεύωσιν; »Eifer« ist eine tragfähige Wiedergabe von σπουδή.
