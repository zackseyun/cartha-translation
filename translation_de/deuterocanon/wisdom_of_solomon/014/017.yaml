base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/017.yaml
  text: Since men were not able to honor them in person because they lived far away[a], they reproduced the distant appearance and made a visible image of the honored king[b], so that by their zeal they might flatter the absent one as though present.
translation:
  language: de
  text: Da die Menschen sie nicht persönlich ehren konnten, weil jene weit entfernt lebten, bildeten sie ihr Aussehen aus der Ferne nach[a] und schufen ein sichtbares Bild des geehrten Königs, um durch ihren Eifer dem Abwesenden zu schmeicheln, als wäre er anwesend.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Anblick aus der Ferne nachbildeten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um sich durch ihren Eifer beim Abwesenden einzuschmeicheln, als wäre er anwesend«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὄψει
  choice: persönlich
  rationale: Die Wendung bezeichnet hier die unmittelbare Gegenwart beziehungsweise Sichtbarkeit und steht im Gegensatz zu Entfernung und Abwesenheit. »Persönlich« gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: τιμᾶν
  choice: ehren
  rationale: Das Verb bezeichnet zunächst soziale oder politische Ehrerweisung. »Ehren« vermeidet es, an dieser Stelle bereits ausdrücklich kultische Verehrung in den Text einzutragen.
- source_word: διὰ τὸ μακρὰν οἰκεῖν
  choice: weil jene weit entfernt lebten
  rationale: Die Begründung bezieht sich sinngemäß auf die zu ehrenden Herrscher. »Jene« verhindert im Deutschen, dass »sie« irrtümlich auf die Menschen bezogen wird.
- source_word: τὴν πόρρωθεν ὄψιν
  choice: ihr Aussehen aus der Ferne
  rationale: ὄψις kann den Anblick oder das Aussehen bezeichnen; πόρρωθεν wahrt den Bezug zur räumlichen Ferne. Die Formulierung lässt offen, ob das Aussehen aus eigener Anschauung, Erinnerung oder vermittelter Kenntnis bekannt war.
- source_word: ἀνατυπωσάμενοι
  choice: bildeten … nach
  rationale: Das Partizip bezeichnet die Herstellung einer Darstellung nach einem Vorbild. »Nachbilden« passt zum folgenden Bildmotiv und klingt im Deutschen natürlich.
- source_word: ἐμφανῆ εἰκόνα
  choice: ein sichtbares Bild
  rationale: ἐμφανής hebt die wahrnehmbare, vor Augen stehende Gestalt des Bildes hervor und kontrastiert sie mit dem abwesenden König.
- source_word: τοῦ τιμωμένου βασιλέως
  choice: des geehrten Königs
  rationale: Das Partizip bezeichnet den König als Empfänger der Ehre. Die knappe Wiedergabe wahrt den passiven Sinn.
- source_word: τὸν ἀπόντα ὡς παρόντα
  choice: dem Abwesenden … als wäre er anwesend
  rationale: Die pointierte Gegenüberstellung von Abwesenheit und Anwesenheit bleibt erhalten und wird idiomatisch wiedergegeben.
- source_word: κολακεύωσιν
  choice: zu schmeicheln
  rationale: Das Verb trägt einen kritischen Unterton und meint Schmeichelei beziehungsweise das Bemühen um Gunst, nicht bloß neutrale Ehrerweisung.
- source_word: διὰ τῆς σπουδῆς
  choice: durch ihren Eifer
  rationale: σπουδή bezeichnet hier den engagierten Aufwand, mit dem das Bild hergestellt wird. »Eifer« bewahrt sowohl Einsatz als auch Absicht.
theological_decisions:
- issue: Ob τιμᾶν mit ausdrücklich kultischer Sprache wiederzugeben ist
  choice: ehren
  alternative: verehren oder anbeten
  rationale: Der unmittelbare Zusammenhang beschreibt zunächst die Ehrung entfernter Herrscher und die Entstehung ihrer bildlichen Darstellung. Obwohl der größere Abschnitt Götzendienst kritisiert, sollte dessen kultische Zuspitzung nicht vorzeitig in dieses Verb eingetragen werden.
- issue: Wie stark κολακεύωσιν als Streben nach königlicher Gunst auszulegen ist
  choice: schmeicheln
  alternative: sich die Gunst sichern / sich einschmeicheln
  rationale: »Schmeicheln« bewahrt den negativen Wertungston, ohne den Zweck enger festzulegen, als es das griechische Verb verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem gedanklichen Aufbau des Griechischen, wird aber durch »jene« referenziell verdeutlicht. Die kritische Färbung von κολακεύωσιν bleibt erhalten, ohne die politische Ehrung vorschnell als ausdrückliche Anbetung zu bezeichnen.
