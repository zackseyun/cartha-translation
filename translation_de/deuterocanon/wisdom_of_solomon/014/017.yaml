  source_fidelity: 'Der Text gibt die Syntax und den Sinn des Griechischen zuverlässig wieder: Die Menschen können die entfernten Herrscher nicht persönlich ehren, stellen deren Erscheinung nach und schaffen ein sichtbares Bild des geehrten Königs, um dem Abwesenden schmeicheln zu können, als sei er gegenwärtig. Die Kontraste von Ferne/Nähe und Abwesenheit/Anwesenheit bleiben erhalten.'
