revisions:
- from: Dann genügte es ihnen nicht, sich in der Erkenntnis Gottes zu verirren[a]; vielmehr leben sie auch in einem großen Krieg der Unwissenheit[b] und nennen so große Übel Frieden.
  to: 'Dann genügte es ihnen nicht, in Bezug auf die Erkenntnis Gottes in die Irre zu gehen[a], sondern auch: Während sie in einem großen Krieg der Unwissenheit leben[b], nennen sie so viele Übel Frieden.'
  rationale: Die Revision korrigiert die additive Kraft von ἀλλὰ καί, macht die begleitende Funktion des Partizips ζῶντες sichtbar und präzisiert den Bezug von περὶ τὴν τοῦ θεοῦ γνῶσιν. Die umstrittene mittlere bzw. passive Nuance von πλανᾶσθαι bleibt durch die Fußnote offen; die Metapher und die Ironie des griechischen Textes bleiben erhalten.
