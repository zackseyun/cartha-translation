  text: Then it was not enough for them to go astray concerning the knowledge of God[a], but also, living in a great war of ignorance[b], they call such great evils peace.
translation:
  language: de
  text: 'Dann genügte es ihnen nicht, in Bezug auf die Erkenntnis Gottes in die Irre zu gehen[a], sondern auch: Während sie in einem großen Krieg der Unwissenheit leben[b], nennen sie so viele Übel Frieden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Bezug auf die Erkenntnis Gottes irregeführt zu werden“. Die griechische Form kann stärker passiv verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: '„Ein großer Krieg der Unwissenheit“ bewahrt das griechische Bild: Unwissenheit erscheint als ein Zustand des Krieges oder tiefen Konflikts.'
    reason: cultural_note
lexical_decisions:
- source_word: Εἶτʼ
  choice: Dann
  rationale: Kennzeichnet den nächsten Schritt in der Argumentation, ohne den Zusammenhang stärker auszudeuten.
- source_word: οὐκ ἤρκεσεν
  choice: es genügte ihnen nicht
  rationale: Gibt die unpersönliche griechische Wendung natürlich wieder; das ergänzte „ihnen“ benennt die im Kontext vorausgesetzten Personen.
- source_word: τὸ πλανᾶσθαι
  choice: sich zu verirren
  rationale: Bewahrt die mögliche mediale bzw. passive Nuance, ohne ausdrücklich eine äußere Ursache des Irrwegs festzulegen.
- source_word: περὶ τὴν τοῦ θεοῦ γνῶσιν
  choice: in der Erkenntnis Gottes
  rationale: Natürliches Deutsch für eine Verirrung im Bereich der Gotteserkenntnis; der theologische Gehalt von γνῶσις bleibt erhalten.
- source_word: μεγάλῳ ... ἀγνοίας πολέμῳ
  choice: in einem großen Krieg der Unwissenheit
  rationale: Bewahrt die auffällige Kriegsmetapher und lässt die genaue Beziehung des Genitivs ἀγνοίας offen.
- source_word: ζῶντες
  choice: leben sie
  rationale: Überführt das Partizip in einen koordinierten deutschen Hauptsatz und erhält seinen begleitenden Sinn.
- source_word: τὰ τοσαῦτα κακὰ
  choice: so große Übel
  rationale: Gibt den Grad beziehungsweise das Ausmaß von τοσαῦτα wieder, ohne es einseitig als bloße Anzahl zu verstehen.
- source_word: εἰρήνην προσαγορεύουσιν
  choice: nennen ... Frieden
  rationale: Erhält die knappe, ironische Gegenüberstellung von schweren Übeln und Frieden.
theological_decisions:
- issue: Ob πλανᾶσθαι ausdrücklich passiv als Verführtwerden wiederzugeben ist
  choice: sich zu verirren
  alternative: irregeführt zu werden
  rationale: Die Form erlaubt eine passive Nuance, legt aber die handelnde Ursache nicht fest. Die gewählte Form bewahrt diese Offenheit; die Alternative wird in der Fußnote genannt.
- issue: Ob εἰρήνην interpretierend erweitert werden soll
  choice: Frieden
  alternative: Sicherheit oder Ordnung
  rationale: Der griechische Text nennt allein Frieden. Die schlichte Wiedergabe erhält die Ironie und vermeidet zusätzliche politische oder theologische Bedeutungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Kriegsmetapher und die abschließende Ironie bleiben bewusst ungemildert; die Satzstruktur wurde für flüssiges Deutsch leicht aufgelöst.
