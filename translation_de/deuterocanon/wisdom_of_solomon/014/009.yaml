  text: For the ungodly man and his ungodliness are equally hateful to God;[a]
translation:
  language: de
  text: Denn gleichermaßen sind Gott sowohl der, der gottlos handelt, als auch seine Gottlosigkeit verhasst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn gleichermaßen werden von Gott sowohl der Gottlose als auch seine Gottlosigkeit gehasst.“'
    reason: 'Lexikalisch und syntaktisch mögliche Alternative: μισητά kann stärker verbal mit „gehasst“ wiedergegeben werden; „der Gottlose“ bildet das substantivierte Partizip kompakter, aber weniger handlungsbezogen ab.'
lexical_decisions:
- source_word: ἐν ἴσῳ
  choice: gleichermaßen
  rationale: Die Wendung bezeichnet Gleichheit im Maß; „gleichermaßen“ gibt den vergleichenden Sinn knapp und natürlich wieder.
- source_word: μισητά
  choice: verhasst
  rationale: Das prädikative Adjektiv bezeichnet beide Genannten als Gegenstände göttlichen Hasses. „Gott … verhasst“ bewahrt die adjektivische Form und schwächt die Aussage nicht ab.
- source_word: θεῷ
  choice: Gott
  rationale: Der Dativ wird in der natürlichen deutschen Konstruktion „jemandem verhasst sein“ unmittelbar wiedergegeben.
- source_word: ὁ ἀσεβῶν
  choice: der, der gottlos handelt
  rationale: Das substantivierte Präsenspartizip bezeichnet einen Mann bzw. jemanden, der Gottlosigkeit ausübt. Die verbale Wiedergabe erhält den Handlungsaspekt und vermeidet das im heutigen Deutsch missverständliche „der Gottlose“.
- source_word: ἡ ἀσέβεια αὐτοῦ
  choice: seine Gottlosigkeit
  rationale: „Gottlosigkeit“ ist verständlich und wahrt die Wortverwandtschaft mit „gottlos handelt“; „seine“ bildet den Rückbezug des griechischen αὐτοῦ ab.
theological_decisions:
- issue: Göttlicher Hass gegenüber dem Handelnden und seiner Gottlosigkeit
  choice: Sowohl der gottlos Handelnde als auch seine Gottlosigkeit sind Gott gleichermaßen verhasst.
  alternative: Nur die Gottlosigkeit, nicht aber der Mensch selbst, sei Gegenstand göttlichen Hasses.
  rationale: Der griechische Satz ordnet ausdrücklich sowohl ὁ ἀσεβῶν als auch ἡ ἀσέβεια αὐτοῦ dem Prädikat μισητά θεῷ zu. Die Übersetzung bewahrt diese Spannung, ohne daraus eine weitergehende systematische Lehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paarige Konstruktion „sowohl … als auch“ macht den gleichrangigen Bezug des Prädikats eindeutig; die Wiederholung „gottlos/Gottlosigkeit“ spiegelt den griechischen Wortstamm.
