  source_fidelity: Die Übersetzung gibt ἐν ἴσῳ als „gleichermaßen“ treffend wieder und bezieht μισητά θεῷ klar auf beide Satzglieder. „der, der gottlos handelt“ gibt das artikuläre Partizip ὁ ἀσεβῶν handlungsbezogen wieder; „seine Gottlosigkeit“ entspricht ἡ ἀσέβεια αὐτοῦ. Die Aussage, dass sowohl der Handelnde als auch seine Gottlosigkeit Gott verhasst sind, wird weder abgeschwächt noch lehrmäßig ausgeweitet.
