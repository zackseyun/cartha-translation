base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/021.yaml
  text: And this became an ambush against life[a], because men, enslaved by calamity or by tyranny, bestowed the incommunicable name on stones and wood.
translation:
  language: de
  text: Und dies wurde zu einer Falle, die dem Leben galt, weil Menschen, die durch Unglück oder Gewaltherrschaft versklavt worden waren, Steinen und Holz den Namen beilegten, der mit niemandem geteilt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich der allein Gott eigene Name oder die allein ihm gebührende Ehre, die nicht auf Götzen übertragen werden darf.
    reason: Die Fußnote erläutert den wahrscheinlich gemeinten Bezug des wörtlich schwer fassbaren Ausdrucks τὸ ἀκοινώνητον ὄνομα, ohne ihn im Haupttext festzuschreiben.
lexical_decisions:
- source_word: ἔνεδρον
  choice: Falle
  rationale: Das Wort bezeichnet einen Hinterhalt oder eine lauernde Falle. „Falle“ gibt die gegen das Leben gerichtete Gefahr in natürlichem Deutsch wieder, ohne das Bild aufzugeben.
- source_word: τῷ βίῳ
  choice: für das Leben
  rationale: In Verbindung mit εἰς ἔνεδρον bezeichnet der Dativ das, dem die Falle droht. „Für das Leben“ bewahrt den weiten Bezug von βίος, ohne ausdrücklich „menschliches Leben“ einzusetzen.
- source_word: συμφορᾷ
  choice: Unglück
  rationale: Das Wort kann Missgeschick, Unglück oder Katastrophe bezeichnen. „Unglück“ ist im heutigen Deutsch verständlich und lässt den Umfang des widrigen Schicksals offen.
- source_word: τυραννίδι
  choice: Gewaltherrschaft
  rationale: Der Ausdruck bezeichnet tyrannische Herrschaft oder Unterdrückung. „Gewaltherrschaft“ ist unmittelbar verständlich und hebt den Zwang hervor.
- source_word: δουλεύσαντες
  choice: zu Sklaven ... geworden waren
  rationale: Das Partizip bezeichnet Dienstbarkeit beziehungsweise Versklavung. Die Formulierung erhält das starke Bild der Bindung an Unglück oder Gewaltherrschaft.
- source_word: τὸ ἀκοινώνητον ὄνομα
  choice: den Namen, der mit niemandem geteilt wird
  rationale: ἀκοινώνητος bezeichnet etwas, das nicht gemeinsam ist oder nicht geteilt wird. Die Formulierung bleibt nahe am griechischen Ausdruck und vermeidet den im Deutschen schwer verständlichen theologischen Fachausdruck „der inkommunikable Name“.
- source_word: λίθοις καὶ ξύλοις
  choice: Steinen und Holz
  rationale: Der Dativ nennt die Materialien, denen der Name beigelegt wird. Die konkrete Ausdrucksweise bleibt erhalten, ohne „Götzenbilder“ erklärend in den Text einzutragen.
- source_word: περιέθεσαν
  choice: beilegten
  rationale: Das Verb kann hier das Übertragen oder Zuerkennen eines Namens bezeichnen. „Beilegten“ ist eine natürliche deutsche Wendung für die Zuschreibung eines Namens.
theological_decisions:
- issue: Bedeutung von τὸ ἀκοινώνητον ὄνομα im Zusammenhang der Götzenkritik
  choice: den Namen, der mit niemandem geteilt wird
  alternative: den Namen, der keinem anderen zukommt
  rationale: Der griechische Ausdruck deutet auf den ausschließlich Gott eigenen Namen oder Rang, sagt dies aber nicht ausdrücklich. Die gewählte Fassung bewahrt die Exklusivität und zugleich die sprachliche Offenheit, statt die Deutung unmittelbar in den Haupttext einzubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild der Versklavung und die konkrete Gegenüberstellung mit Stein und Holz bleiben erhalten. „Falle“ ist gegenüber dem wörtlicheren „Hinterhalt“ im Deutschen idiomatischer und trägt die feindliche Bildwirkung weiterhin.
