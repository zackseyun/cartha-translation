  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe insgesamt zuverlässig wieder: Die durch Unglück oder tyrannische Herrschaft bedingte Versklavung, die Zuschreibung des exklusiven Namens und die konkrete Nennung von Stein und Holz bleiben erhalten. Die Wendung „eine Falle für das Leben“ ist jedoch im heutigen Deutsch richtungssemantisch unscharf und kann sogar wie eine für das Leben bestimmte Falle klingen. Der feindliche Bezug von εἰς ἔνεδρον τῷ βίῳ sollte deutlicher werden.'
