  text: Then[a], as time passed, that ungodly custom grew strong and was kept as a law[b], and by the commands of tyrants the carved images were worshiped.
translation:
  language: de
  text: Mit der Zeit festigte sich dann dieser gottlose Brauch und wurde wie ein Gesetz befolgt; und auf Befehl von Tyrannen wurden die geschnitzten Bilder verehrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶτα ἐν χρόνῳ
  choice: Mit der Zeit … dann
  rationale: Die Wendung verbindet den Gedankengang mit dem Vorhergehenden und beschreibt zugleich eine allmähliche Entwicklung. Die deutsche Wortstellung gibt beides natürlich wieder.
- source_word: κρατυνθὲν
  choice: festigte sich
  rationale: Das Partizip bezeichnet, dass der Brauch mit der Zeit fest oder etabliert wurde. Die reflexive Form ist im Deutschen idiomatisch und bewahrt den Entwicklungsgedanken.
- source_word: τὸ ἀσεβὲς ἔθος
  choice: dieser gottlose Brauch
  rationale: „Gottlos“ erhält das religiös-moralische Urteil von ἀσεβής; „Brauch“ gibt ἔθος prägnant und verständlich wieder. „Dieser“ bindet an den vorausgehenden Zusammenhang an.
- source_word: ὡς νόμος ἐφυλάχθη
  choice: wurde wie ein Gesetz befolgt
  rationale: φυλάσσω bedeutet hier einhalten oder befolgen; ὡς νόμος besagt, dass der Brauch den Rang beziehungsweise die Geltung eines Gesetzes erhielt, ohne ihn schlicht mit einem Gesetz gleichzusetzen.
- source_word: τυράννων ἐπιταγαῖς
  choice: auf Befehl von Tyrannen
  rationale: „Befehl“ entspricht dem verpflichtenden Charakter von ἐπιταγή. „Tyrannen“ bewahrt die wertende Bezeichnung des griechischen Textes.
- source_word: ἐθρησκεύετο
  choice: wurden … verehrt
  rationale: Das Verb bezeichnet religiöse Verehrung beziehungsweise kultische Huldigung. „Verehrt“ ist hier natürlich und lässt den religiösen Sinn im Zusammenhang deutlich hervortreten.
- source_word: τὰ γλυπτά
  choice: die geschnitzten Bilder
  rationale: Die Übersetzung bewahrt den konkreten Hinweis auf gefertigte, geschnitzte Bildwerke, ohne das allgemeinere Wort vorzeitig durch das deutende „Götzen“ zu ersetzen.
theological_decisions:
- issue: Soll τυράννων neutral als „Herrscher“ oder wertend als „Tyrannen“ wiedergegeben werden?
  choice: Tyrannen
  alternative: Herrscher
  rationale: τύραννος trägt in diesem kritischen Zusammenhang eine negative Wertung. Die neutralere Alternative würde die Kritik an politischem Zwang abschwächen.
- issue: Soll τὰ γλυπτά deutend als „Götzen“ oder gegenständlich als geschnitzte Bilder übersetzt werden?
  choice: die geschnitzten Bilder
  alternative: die Götzen
  rationale: Der griechische Ausdruck hebt die materielle Herstellung der Gegenstände hervor. Dass es sich im Zusammenhang um Götzenverehrung handelt, ergibt sich aus dem Verb „verehrt“, sodass keine zusätzliche Deutung in das Substantiv gelegt werden muss.
- issue: Wie stark soll ἐθρησκεύετο als religiöse Handlung ausgedrückt werden?
  choice: wurden verehrt
  alternative: wurden angebetet
  rationale: „Verehrt“ deckt den kultisch-religiösen Sinn ab, ohne die mögliche Bandbreite des Verbs auf die engere Handlung des Anbetens zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Abfolge, vermeidet jedoch schwerfällige Partizipialkonstruktionen. Die wertende Sprache des Ausgangstextes wird weder abgeschwächt noch konfessionell zugespitzt.
