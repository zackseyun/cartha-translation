  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/024.yaml
  text: They no longer keep either lives or marriages pure[a]; instead, one kills another by treachery[b], or by adultery causes grief.
translation:
  language: de
  text: Sie bewahren weder ihr Leben noch ihre Ehen rein. Vielmehr tötet der eine den anderen aus dem Hinterhalt[a] oder verursacht durch Ehebruch[b] Leid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »indem er ihm auflauert«; das griechische Wort bezeichnet das verdeckte Warten auf einen Angriff.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »indem er die eheliche Treue verdirbt«; das griechische Verb kann allgemein »verfälschen« oder »verderben« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βίους
  choice: ihr Leben
  rationale: βίος kann das Leben, die Lebensführung oder den Lebensunterhalt bezeichnen. Das distributive Singularpronomen »ihr« ergibt im Deutschen eine natürliche Formulierung und lässt den ethisch-sozialen Umfang des Ausdrucks offen.
- source_word: γάμους
  choice: ihre Ehen
  rationale: γάμος kann Ehe, Hochzeit oder Ehebett bedeuten. Im Zusammenhang mit Reinheit und ehelicher Untreue bezeichnet es hier am ehesten die Ehen als bestehende Verbindungen.
- source_word: καθαρούς
  choice: rein
  rationale: Das Adjektiv bezeichnet Reinheit und bezieht sich grammatisch sowohl auf βίους als auch auf γάμους. »Rein« bewahrt den ethischen Sinn, ohne ihn auf rituelle Reinheit einzuengen.
- source_word: φυλάσσουσιν
  choice: bewahren
  rationale: φυλάσσω bedeutet bewachen, hüten oder bewahren. »Bewahren … rein« gibt das fortdauernde Erhalten moralischer Unversehrtheit würdig und verständlich wieder.
- source_word: λοχῶν
  choice: aus dem Hinterhalt
  rationale: Das Partizip bezeichnet das Auflauern oder Im-Hinterhalt-Liegen. Die Wiedergabe benennt die verdeckte Art des Angriffs konkret, ohne einen militärischen Rahmen vorauszusetzen.
- source_word: ἀναιρεῖ
  choice: tötet
  rationale: ἀναιρέω bedeutet in diesem Zusammenhang töten oder beseitigen. »Tötet« ist direkt und fügt keine besondere rechtliche Einordnung hinzu.
- source_word: νοθεύων
  choice: durch Ehebruch
  rationale: νοθεύω kann verfälschen, verderben oder eheliche Treue verletzen bedeuten. Wegen der unmittelbar zuvor genannten Ehen ist »durch Ehebruch« die klare kontextuelle Wiedergabe; die allgemeinere Bedeutung wird in einer Fußnote erhalten.
- source_word: ὀδυνᾷ
  choice: verursacht … Leid
  rationale: Das Verb bedeutet Schmerz zufügen, quälen oder betrüben. »Verursacht … Leid« ist natürlich und lässt offen, wem genau dieses Leid zugefügt wird.
theological_decisions:
- issue: Umfang der Reinheit in βίους … γάμους καθαρούς
  choice: Der Vers spricht von der Reinheit des Lebens und der Ehen insgesamt.
  alternative: βίους könnte enger Lebensweisen oder Lebensunterhalte bezeichnen; καθαρούς könnte rituelle Reinheit meinen.
  rationale: Der Kontext beschreibt sittliche Zerrüttung infolge des Götzendienstes. Eine ethische Lesart liegt daher nahe, doch die Formulierung vermeidet eine konfessionelle oder unnötig enge Festlegung.
- issue: Bedeutung von νοθεύων
  choice: Der Ausdruck wird im Kontext als Ehebruch wiedergegeben.
  alternative: Er kann allgemeiner das Verfälschen oder Verderben ehelicher Treue bezeichnen.
  rationale: Die Nähe zu γάμους stützt den ehelichen Bezug. Die Fußnote bewahrt zugleich die weitere lexikalische Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt klar und knapp; die Wiederholung von »ihre« macht die gemeinsame Beziehung von »rein« zu Leben und Ehen verständlich. Die ungenannte betroffene Person bei ὀδυνᾷ wird nicht ergänzt, damit die Offenheit des Griechischen erhalten bleibt.
