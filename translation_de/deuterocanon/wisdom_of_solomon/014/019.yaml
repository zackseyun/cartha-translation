base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/019.yaml
  text: For he[a], perhaps wishing to please the ruler, forced the likeness by his skill into a more beautiful form[b];
translation:
  language: de
  text: Denn vielleicht zwang er, um dem Herrscher[a] zu gefallen, durch seine Kunst die Ähnlichkeit zu größerer Schönheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Machthaber« beziehungsweise »dem Herrschenden«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »zwang die Ähnlichkeit zum Schöneren«; gemeint ist offenbar, dass der Künstler die Darstellung über die gewöhnliche Ähnlichkeit hinaus idealisierte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τάχα
  choice: vielleicht
  rationale: Im Zusammenhang bezeichnet das Wort am ehesten eine Vermutung über das Motiv des Künstlers, nicht zeitliche Schnelligkeit.
- source_word: κρατοῦντι
  choice: dem Herrscher
  rationale: Das substantivierte Partizip bezeichnet denjenigen, der Macht oder Herrschaft ausübt; »Herrscher« ist im politischen Zusammenhang natürlich und prägnant.
- source_word: βουλόμενος ἀρέσαι
  choice: wollte ... gefallen
  rationale: Die Formulierung gibt den Willen und die Absicht des Künstlers in natürlichem modernem Deutsch wieder.
- source_word: ἐξεβιάσατο
  choice: zwang
  rationale: Das Verb bezeichnet ein gewaltsames Drängen über das Natürliche hinaus. »Zwang« bewahrt die auffällige Bildlichkeit, ohne bereits ausdrücklich »verfälschte« zu sagen.
- source_word: τῇ τέχνῃ
  choice: mit seiner Kunst
  rationale: τέχνη kann Kunst, Handwerk oder Fertigkeit bezeichnen; hier passt »Kunst« zum Schaffen einer idealisierten Darstellung und bezeichnet zugleich das eingesetzte Mittel.
- source_word: τὴν ὁμοιότητα
  choice: die Ähnlichkeit
  rationale: Die direkte Wiedergabe vermeidet es, den Ausdruck vorschnell ausdrücklich als Götzenbild zu deuten.
- source_word: ἐπὶ τὸ κάλλιον
  choice: zu größerer Schönheit
  rationale: Die Wendung bezeichnet eine Bewegung oder Steigerung hin zum Schöneren; diese Fassung wahrt den komparativen Sinn.
theological_decisions:
- issue: Deutung der Tätigkeit des Künstlers im Zusammenhang der Götzenkritik
  choice: Die künstlerische Verschönerung wird beschreibend wiedergegeben, ohne ein zusätzliches ausdrückliches moralisches Urteil einzufügen.
  alternative: ἐξεβιάσατο mit »verfälschte« oder »entstellte« wiederzugeben und so die Kritik bereits im Verb hervorzuheben.
  rationale: Der weitere Zusammenhang kritisiert den Götzendienst, doch dieser Vers schildert zunächst, wie der Künstler aus Gefälligkeit gegenüber einem Machthaber die Darstellung idealisiert. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ungewöhnliche Verbindung »zwang ... zu größerer Schönheit« erhält bewusst die kraftvolle Ausdrucksweise des griechischen Verbs; »deshalb« macht den durch γάρ angezeigten Begründungszusammenhang im Deutschen flüssig verständlich.
