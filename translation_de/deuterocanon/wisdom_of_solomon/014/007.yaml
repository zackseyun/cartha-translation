  text: For blessed is the wood through which righteousness comes[a].
translation:
  language: de
  text: Denn gesegnet ist das Holz, durch das Gerechtigkeit entsteht[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Rechtschaffenheit entsteht“. Das griechische Wort kann moralische Rechtschaffenheit ebenso wie Gerechtigkeit im Sinn gerechten Handelns oder gerechter Ordnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγηται
  choice: ist gesegnet
  rationale: Das Perfekt Passiv bezeichnet einen bestehenden Zustand als Ergebnis des Segnens. Im Deutschen gibt „ist gesegnet“ dies natürlich und würdig wieder.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden beziehungsweise erläuternden Anschluss an den vorhergehenden Vers.
- source_word: ξύλον
  choice: Holz
  rationale: Der griechische Ausdruck kann Holz, Baum oder einen Gegenstand aus Holz bezeichnen. „Holz“ erhält hier bewusst die materielle und im Kontext kontrastierende Bedeutung, ohne auf „Baum“ oder ein bestimmtes Holzobjekt festzulegen.
- source_word: δι’ οὗ
  choice: durch das
  rationale: Das Relativpronomen bezieht sich auf das sächliche ξύλον. „Durch das“ gibt die instrumentale Vermittlung direkt wieder.
- source_word: γίνεται
  choice: entsteht
  rationale: γίνομαι bezeichnet hier das Zustandekommen oder Wirklichwerden. „Entsteht“ ist im Deutschen knapp und wahrt diese Bedeutung besser als eine stärker kausative Formulierung wie „bewirkt wird“.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl moralische Rechtschaffenheit als auch gerechtes Handeln oder gerechte Ordnung ab und bewahrt damit die Bedeutungsweite des griechischen Begriffs.
theological_decisions:
- issue: Bedeutungsweite von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der Kontext erlaubt sowohl die Vorstellung moralischer Rechtschaffenheit als auch die einer gerechten, rettenden Tat oder Ordnung. „Gerechtigkeit“ hält diese Spannung im Deutschen am besten offen; „Rechtschaffenheit“ wäre enger auf die moralische Qualität bezogen.
- issue: Instrumentale Aussage über das Holz
  choice: durch das Gerechtigkeit entsteht
  alternative: durch das Gerechtigkeit bewirkt wird
  rationale: Die gewählte Fassung wahrt die grammatische Offenheit von γίνεται und sagt nicht genauer als der griechische Text, wer die Gerechtigkeit bewirkt oder in welchem theologischen Sinn sie zustande kommt.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Die ungewöhnlich pointierte Aussage über „das Holz“ bleibt erhalten und wird nicht durch eine konkrete Deutung, etwa auf die Arche oder das Kreuz, festgelegt.
