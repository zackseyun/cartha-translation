  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/013.yaml
  text: For it was not from the beginning[a], nor will it be forever.
translation:
  language: de
  text: Denn es war nicht von Anfang an da[a] und wird auch nicht für immer bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen bleibt das Subjekt unausgesprochen; aus dem Zusammenhang können Götzenbilder oder der Götzendienst gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: οὔτε γὰρ ... οὔτε
  choice: Denn ... nicht ... und ... auch nicht
  rationale: γάρ wird mit dem erklärenden „Denn“ wiedergegeben. Die korrelativen Verneinungen werden in natürlichem Deutsch als „nicht … und auch nicht“ ausgedrückt.
- source_word: ἦν
  choice: war ... da
  rationale: Die Wendung gibt das schlichte Sein beziehungsweise Vorhandensein idiomatisch wieder, ohne das im Griechischen unausgesprochene Subjekt näher festzulegen.
- source_word: ἀπ' ἀρχῆς
  choice: von Anfang an
  rationale: Dies ist die geläufige und genaue deutsche Entsprechung für einen Bestand seit dem Anfang.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die idiomatische Wendung bezeichnet hier unbegrenzte Fortdauer und steht im zeitlichen Gegensatz zu „von Anfang an“.
- source_word: ἔσται
  choice: wird ... bestehen
  rationale: „Bestehen“ drückt zukünftiges Fortdauern natürlich aus und vermeidet das im Deutschen schwerfällige „wird sein“.
theological_decisions:
- issue: Im Griechischen bleibt das Subjekt unausgesprochen.
  choice: Im Haupttext steht das Pronomen „es“, ohne das Gemeinte als Götzenbild oder Götzendienst festzulegen.
  alternative: „Denn Götzenbilder waren nicht von Anfang an da …“ oder „Denn der Götzendienst war nicht von Anfang an da …“
  rationale: Der Kontext erlaubt beide Bezüge. Eine ausdrückliche Benennung würde die echte Mehrdeutigkeit des griechischen Textes unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da sein“ und „bestehen“ ergeben eine natürliche zeitliche Gegenüberstellung; die kontextuelle Mehrdeutigkeit des Subjekts bleibt erhalten.
