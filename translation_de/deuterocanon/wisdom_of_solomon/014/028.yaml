base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/028.yaml
  text: For either[a], while reveling, they go mad; or they prophesy lies; or they live unjustly; or they quickly swear false oaths[b];
translation:
  language: de
  text: Denn entweder sind sie beim ausgelassenen Feiern von Sinnen[a], oder sie weissagen Lügen, oder sie leben ungerecht, oder sie schwören rasch falsche Eide[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Beim ausgelassenen Feiern sind sie rasend geworden.“ Die Verbindung von Partizip und Perfekt lässt sowohl den gegenwärtigen Zustand als auch dessen Eintreten hervortreten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „sie leisten rasch einen Meineid“ oder „sie schwören bereitwillig falsch“. Das griechische Wort bezeichnet falsches Schwören beziehungsweise Meineid; „rasch“ kann hier auch die Nuance bedenkenloser Bereitschaft haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενοι
  choice: beim ausgelassenen Feiern
  rationale: Das Partizip bezeichnet freudiges, festliches Vergnügen; im Zusammenhang ist ausgelassenes Feiern gemeint, ohne dass ein bestimmtes Fest oder Gelage vorausgesetzt werden muss.
- source_word: μεμήνασιν
  choice: sind sie von Sinnen
  rationale: Das Perfekt von μαίνομαι beschreibt einen eingetretenen Zustand von Wahnsinn oder Raserei. Die deutsche Zustandsform gibt den resultativen Aspekt natürlich wieder.
- source_word: προφητεύουσιν ψευδῆ
  choice: sie weissagen Lügen
  rationale: Die direkte Verbindung von Verb und Objekt bewahrt die Schärfe des griechischen Vorwurfs und vermeidet die Abschwächung zu bloß irrtümlichem Weissagen.
- source_word: ζῶσιν ἀδίκως
  choice: sie leben ungerecht
  rationale: Die Wiedergabe wahrt die ethische und soziale Bedeutung von ἀδίκως, ohne den Ausdruck unnötig dogmatisch aufzuladen.
- source_word: ἐπιορκοῦσιν
  choice: sie schwören falsch
  rationale: Das Verb bezeichnet falsches Schwören beziehungsweise Meineid. Die transparente Formulierung hält die im Griechischen enthaltene Eidvorstellung fest.
- source_word: ταχέως
  choice: ohne Weiteres
  rationale: Das Adverb kann hier neben zeitlicher Schnelligkeit auch die bereitwillige, bedenkenlose Leichtigkeit des falschen Schwörens ausdrücken; diese Bedeutung klingt im Deutschen idiomatisch mit.
theological_decisions:
- issue: Bedeutungsumfang von ἀδίκως im weisheitlich-ethischen Zusammenhang
  choice: ungerecht
  alternative: gottlos; böse; nicht rechtschaffen
  rationale: „Ungerecht“ bewahrt den Zusammenhang von moralischem Unrecht und verletzter Gerechtigkeit, ohne ausschließlich eine kultische oder später dogmatisch geprägte Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Struktur „entweder … oder“ bildet die griechische Reihung ab. „Von Sinnen“ ist verständlich und kräftig, ohne unnötig medizinische Terminologie einzuführen.
