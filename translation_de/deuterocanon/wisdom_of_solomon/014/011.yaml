base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/011.yaml
  text: Therefore there will also be a visitation upon the idols of the nations[a], because among God’s creatures they became an abomination, and a stumbling block to the souls of men[b], and a snare for the feet of fools.
translation:
  language: de
  text: Darum wird auch über die Götzen der Völker eine Heimsuchung kommen[a], denn sie sind in Gottes Schöpfung zu einem Gräuel geworden, zu Stolpersteinen für die Seelen der Menschen und zu einer Schlinge für die Füße der Toren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Heimsuchung“ bezeichnet hier ein prüfendes und strafendes Eingreifen; auch möglich: „Über die Götzen der Völker wird Gericht kommen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Gedankengang knapp und natürlich wieder.
- source_word: ἐν εἰδώλοις ἐθνῶν ἐπισκοπὴ ἔσται
  choice: wird auch die Götzen der Völker eine Heimsuchung treffen
  rationale: „Heimsuchung“ bewahrt die Bedeutungsbreite von ἐπισκοπή zwischen prüfendem Eingreifen und Strafgericht; die deutsche Konstruktion macht die Götzen idiomatisch zum Ziel dieses Eingreifens.
- source_word: ἐν κτίσματι θεοῦ
  choice: unter Gottes Geschöpfen
  rationale: κτίσμα bezeichnet hier am ehesten das von Gott Geschaffene beziehungsweise einzelne Geschöpfe; die Formulierung folgt der lokalen Bedeutung von ἐν, ohne die Aussage auf den abstrakten Begriff „Schöpfung“ festzulegen.
- source_word: εἰς βδέλυγμα ἐγενήθησαν
  choice: sind sie zu einem Gräuel geworden
  rationale: Bewahrt sowohl das starke religiös-moralische Gewicht von βδέλυγμα als auch die Veränderungsformel ἐγενήθησαν.
- source_word: εἰς σκάνδαλα ψυχαῖς ἀνθρώπων
  choice: zu Fallstricken für die Seelen der Menschen
  rationale: Der Plural σκάνδαλα bleibt erhalten; „Fallstricke“ vermittelt hier konkreter als „Anstöße“ etwas, das Menschen zu Fall bringt. „Menschen“ gibt das generische ἀνθρώπων inklusiv und zeitgemäß wieder.
- source_word: εἰς παγίδα ποσὶν ἀφρόνων
  choice: zu einer Falle für die Füße der Unverständigen
  rationale: „Falle“ und „Füße“ bewahren das konkrete Bild. „Unverständige“ gibt ἄφρονες als moralisch und geistlich uneinsichtige Menschen wieder, ohne bloße geringe Intelligenz zu unterstellen.
theological_decisions:
- issue: Bedeutung von ἐπισκοπή im Gerichtskontext
  choice: Heimsuchung
  alternative: Gericht oder strafendes Eingreifen
  rationale: Der Zusammenhang legt eine strafende Bedeutung nahe, doch ἐπισκοπή bezeichnet zunächst ein Aufsuchen beziehungsweise prüfendes Eingreifen. „Heimsuchung“ bewahrt diese Spannung; eine Fußnote erläutert den gerichtlichen Sinn.
- issue: Bezug von ἐν κτίσματι θεοῦ
  choice: unter Gottes Geschöpfen
  alternative: in Gottes Schöpfung
  rationale: Der griechische Singular κτίσμα kann das Geschaffene kollektiv oder ein Geschöpf bezeichnen. Die gewählte Fassung bleibt nahe am konkreten Schöpfungsbezug, ohne eine Lehre über den ontologischen Status der Götzen hinzuzufügen.
- issue: Wiedergabe von ἀφρόνων
  choice: der Unverständigen
  alternative: der Toren
  rationale: Im Weisheitskontext bezeichnet das Wort nicht nur intellektuelle Schwäche, sondern fehlende Einsicht und moralische Uneinsichtigkeit. „Unverständige“ ist verständlich und vermeidet eine unnötig beleidigende moderne Nebenbedeutung; „Toren“ wäre traditionsnäher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von Gräuel, Fallstricken, Seelen, Falle und Füßen bleibt erhalten. Der Satzbau wurde gegenüber dem Griechischen leicht geglättet, die dreigliedrige Steigerung jedoch bewahrt.
