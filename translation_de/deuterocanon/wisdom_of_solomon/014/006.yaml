base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/006.yaml
  text: For when the proud giants were being destroyed at the beginning[a], the hope of the world, taking refuge on a raft, left to the age to come a seed of generation[b], steered by your hand.
translation:
  language: de
  text: Denn als zu Beginn die hochmütigen Riesen zugrunde gingen, nahm die Hoffnung der Welt, von deiner Hand gesteuert, auf einem Floß[a] Zuflucht und hinterließ der Nachwelt[b] einen Samen der Nachkommenschaft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf einem Wasserfahrzeug“ beziehungsweise „auf einem kleinen Fahrzeug“. Im Griechischen steht „Floß“, ein auffälliger Ausdruck statt des üblichen Wortes für ein Schiff oder eine Arche.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Zeitalter“. Das Griechische unterscheidet hier αἰών („Zeitalter“) von κόσμος („Welt“) im vorhergehenden Satzteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχῆς
  choice: zu Beginn
  rationale: Der Genitiv ist hier zeitlich zu verstehen und verweist auf die frühe Urzeit; „zu Beginn“ wahrt diesen Sinn, ohne einen metaphysischen Anfang festzulegen.
- source_word: ἀπολλυμένων
  choice: vernichtet wurden
  rationale: Das präsentische mediale/passive Partizip bezeichnet den im Gang befindlichen Untergang. Die passive Wiedergabe passt zum Gerichtskontext, ohne die handelnde Instanz ausdrücklich zu ergänzen.
- source_word: ὑπερηφάνων γιγάντων
  choice: die hochmütigen Riesen
  rationale: „Hochmütig“ gibt die moralische Wertung von ὑπερήφανος wieder; „Riesen“ entspricht dem jüdisch-hellenistischen Sprachgebrauch und vermeidet mythologische Assoziationen von „Titanen“.
- source_word: ἡ ἐλπὶς τοῦ κόσμου
  choice: die Hoffnung der Welt
  rationale: Die personifizierende Formulierung bleibt erhalten und wird nicht ausdrücklich auf Noah oder den geretteten Rest festgelegt.
- source_word: ἐπὶ σχεδίας
  choice: auf einem Floß
  rationale: σχεδία bezeichnet gewöhnlich ein Floß oder ein einfaches Wasserfahrzeug und ist rhetorisch auffälliger als die üblichen Wörter für Schiff oder Arche.
- source_word: καταφυγοῦσα
  choice: nahm … Zuflucht
  rationale: Die Formulierung bewahrt den Gedanken des Schutzsuchens und nicht nur den einer Flucht oder Rettung.
- source_word: ἀπέλιπεν
  choice: hinterließ
  rationale: Das Verb bedeutet „zurücklassen/hinterlassen“; die Wiedergabe vermeidet die stärker deutende Übersetzung „bewahrte“.
- source_word: τῷ αἰῶνι
  choice: dem kommenden Zeitalter
  rationale: Die zeitlich vorwärtsgerichtete Wiedergabe unterscheidet αἰών von κόσμος („Welt“) im selben Satz und bezeichnet die fortdauernde künftige Zeit.
- source_word: σπέρμα γενέσεως
  choice: einen Samen des Werdens
  rationale: „Samen“ erhält die Metapher von σπέρμα; „Werden“ gibt die offene Bedeutung von γένεσις als Entstehung, Hervorbringung oder Generation wieder, ohne das im Griechischen fehlende Adjektiv „neu“ einzufügen.
- source_word: τῇ σῇ κυβερνηθείσῃ χειρί
  choice: von deiner Hand gesteuert
  rationale: Die nautische Bedeutung von κυβερνάω passt zum Floß; zugleich bleibt Gottes leitendes Handeln unmittelbar ausgedrückt.
theological_decisions:
- issue: Bezug von „die Hoffnung der Welt“
  choice: Die personifizierte Wendung bleibt unaufgelöst und kann Noah beziehungsweise den in ihm bewahrten menschlichen Rest bezeichnen.
  alternative: Die abstrakte Hoffnung selbst überlebt die Flut.
  rationale: Das feminine Partizip καταφυγοῦσα stimmt grammatisch mit ἐλπίς überein, während der Zusammenhang eine konkrete Verkörperung nahelegt. Die Übersetzung bewahrt diese Spannung.
- issue: Unterscheidung zwischen κόσμος und αἰών
  choice: κόσμος wird mit „Welt“, αἰών zeitlich mit „kommendes Zeitalter“ wiedergegeben.
  alternative: αἰών könnte mit „Nachwelt“ oder schlicht „Zeitalter“ wiedergegeben werden.
  rationale: Eine erneute Wiedergabe als „Welt“ würde die lexikalische Unterscheidung im griechischen Text verwischen; die zeitliche Fassung hebt die Fortdauer der Menschheit hervor, ohne sie vollständig auszudeuten.
- issue: Bedeutung von σπέρμα γενέσεως
  choice: „Samen des Werdens“ bewahrt Bild und Bedeutungsweite.
  alternative: „Samen der Fortpflanzung“, „Keim künftiger Geschlechter“ oder „Samen der Entstehung“.
  rationale: Die Wendung weist auf den Ursprung fortgesetzten Lebens nach der Flut, nennt aber weder ausdrücklich eine „neue“ Generation noch allein den biologischen Vorgang der Fortpflanzung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. Die personifizierte „Hoffnung der Welt“, die Samenmetapher und das nautische Bild bleiben erhalten; erklärende Zusätze wie „neu“ oder eine ausdrückliche Nennung Noahs werden vermieden.
