  source_fidelity: Der Entwurf gibt die Satzstruktur, die Personifikation von „Hoffnung der Welt“, das auffällige „Floß“ sowie die Unterscheidung von κόσμος und αἰών insgesamt gut wieder. „vernichtet wurden“ schwächt jedoch den durativen Charakter von ἀπολλυμένων, und die Schlussstellung von „von deiner Hand gesteuert“ bezieht sich im Deutschen naheliegend auf den maskulinen „Samen“, während der griechische Bezug bei der personifizierten Hoffnung liegt.
  naturalness: „Samen des Werdens“ ist im modernen Standarddeutsch ungewöhnlich und wenig verständlich. „Samen der Nachkommenschaft“ bewahrt das Bild und ist klarer. Die Umstellung des Partizipialsatzes macht dessen Bezug eindeutig, ohne die poetisch-personifizierende Ausdrucksweise aufzulösen.
  terminology: „hochmütige Riesen“, „Hoffnung der Welt“, „Floß“, „Nachwelt“ und „Samen der Nachkommenschaft“ sind angemessen. „Nachwelt“ ist eine natürliche, im Fußnotenapparat bereits ausgewiesene Wiedergabe von τῷ αἰῶνι und unterscheidet sich klar von κόσμος („Welt“).
