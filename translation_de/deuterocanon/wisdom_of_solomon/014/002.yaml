  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/002.yaml
  text: For it was desire for profit that devised that one[a], and skillful wisdom constructed it;
translation:
  language: de
  text: Denn das Verlangen nach Gewinn ersann es[a], kunstfertige Weisheit aber baute es;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich »jenes«. Gemeint ist wahrscheinlich das im vorherigen Vers genannte Schiff. Möglich ist auch: »das Verlangen nach Erwerb« statt »das Verlangen nach Gewinn«.'
    reason: Der griechische Demonstrativbezug und die Bedeutungsbreite von πορισμῶν werden offengelegt.
lexical_decisions:
- source_word: ἐκείνο
  choice: es
  rationale: Das neutrale Pronomen bezieht sich im Zusammenhang wahrscheinlich auf das im vorherigen Vers genannte Schiff. Die demonstrative Nuance des griechischen »jenes« wird in der Fußnote ausgewiesen, da ein wörtliches »jenes« hier im Deutschen schwerfällig und syntaktisch missverständlich wäre.
- source_word: ὄρεξις πορισμῶν
  choice: das Verlangen nach Gewinn
  rationale: ὄρεξις bezeichnet ein Begehren oder Verlangen; πορισμῶν benennt in diesem wirtschaftlichen Zusammenhang Gewinn beziehungsweise Erwerb. Die Formulierung bewahrt den wirtschaftlichen Beweggrund.
- source_word: ἐπενόησεν
  choice: ersann
  rationale: Das Verb bezeichnet das gedankliche Ausdenken oder Ersinnen und bildet den beabsichtigten Gegensatz zur anschließenden tatsächlichen Herstellung.
- source_word: τεχνῖτις σοφία
  choice: kunstfertige Weisheit
  rationale: τεχνῖτις trägt die Bedeutung handwerklicher oder technischer Befähigung. »Weisheit« bewahrt zugleich den Leitbegriff σοφία und dessen literarisch-theologische Resonanz im Buch.
- source_word: κατεσκεύασεν
  choice: baute
  rationale: Im Rückbezug auf ein Schiff ist »baute« die natürliche deutsche Wiedergabe für das Herstellen oder Konstruieren.
theological_decisions:
- issue: Wiedergabe von σοφία im Zusammenhang praktischer Handwerkskunst
  choice: Weisheit
  alternative: Kunstfertigkeit oder Geschick
  rationale: Die Übersetzung bewahrt σοφία als zentralen Leitbegriff des Buches. Das Adjektiv »kunstfertig« macht deutlich, dass hier zugleich praktische, handwerkliche Befähigung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Gegenüberstellung von gedanklichem Ersinnen und handwerklichem Bauen bleibt erhalten; das Semikolon führt den Satzfluss des Kontextes weiter.
