  text: For the thing done[a], together with the one who did it, will be punished.
translation:
  language: de
  text: Denn auch das, was gemacht wurde[a], wird zusammen mit dem, der es gemacht hat, bestraft werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das, was getan wurde, zusammen mit dem, der es getan hat“. Im Zusammenhang sind das angefertigte Götzenbild und sein Hersteller gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γάρ
  choice: Denn auch
  rationale: Die Wortverbindung führt die Begründung aus dem vorherigen Zusammenhang fort; „Denn auch“ gibt sowohl die erklärende Kraft von γάρ als auch καί wieder.
- source_word: τὸ πραχθέν
  choice: das, was gemacht wurde
  rationale: Das substantivierte Aoristpassiv von πράσσω kann allgemein „das, was getan wurde“ bedeuten. Im Kontext der Herstellung von Götzen liegt jedoch ein hervorgebrachter Gegenstand nahe. Die Formulierung bleibt weiter als „Götzenbild“ und bewahrt die sprachliche Spannung durch eine Fußnote.
- source_word: σὺν
  choice: zusammen mit
  rationale: Die Präposition bezeichnet die Verbindung des Gemachten mit seinem Urheber im gemeinsamen Strafgericht.
- source_word: τῷ δράσαντι
  choice: dem, der es gemacht hat
  rationale: δράω bedeutet grundsätzlich „tun, vollbringen“. Im Kontext und in der Gegenüberstellung mit τὸ πραχθέν ist der Hersteller des Gegenstands gemeint; „gemacht hat“ wahrt zugleich die sprachliche Entsprechung.
- source_word: κολασθήσεται
  choice: wird … bestraft werden
  rationale: Das Futur Passiv von κολάζω bezeichnet hier eine künftig erfolgende Bestrafung oder Strafahndung. Die gewählte Formulierung ist klar und idiomatisch.
theological_decisions:
- issue: Soll der hergestellte Gegenstand im Haupttext ausdrücklich als Götzenbild bezeichnet werden?
  choice: Die allgemeinere Formulierung „das, was gemacht wurde“ bleibt im Haupttext stehen.
  alternative: „das Götzenbild“ oder „das, was getan wurde“
  rationale: Der Zusammenhang weist eindeutig auf ein angefertigtes Götzenbild, doch der griechische Satz verwendet hier kein ausdrückliches Wort für „Götzenbild“. Die allgemeinere Wiedergabe lässt den Kontext den Bezug bestimmen und vermeidet eine Überpräzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas allgemein gehaltene substantivierte Wendung bildet den griechischen Ausdruck nach, ohne den im Kontext erkennbaren Bezug auf ein Götzenbild ausdrücklich in den Haupttext einzutragen.
