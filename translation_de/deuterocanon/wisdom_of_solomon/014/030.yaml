  text: But justice will pursue them both[a], because they thought wrongly about God by giving heed to idols, and they swore unjustly in deceit[c][b], despising holiness.
translation:
  language: de
  text: Doch für beides werden sie gerechte Strafen treffen[a], denn sie dachten verkehrt über Gott, indem sie sich Götzen zuwandten, und sie schworen auf ungerechte Weise und in betrügerischer Absicht, indem sie missachteten, was heilig ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Für beides werden die gerechten Dinge sie verfolgen.« »Beides« kann sich auf die beiden im folgenden Satz genannten Verfehlungen oder auf zwei im Zusammenhang vorausgesetzte Sachverhalte beziehen. »Gerechte Strafen« kann auch allgemeiner als »gerechte Folgen« oder »die Forderungen der Gerechtigkeit« verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »indem sie die Frömmigkeit verachteten« beziehungsweise »die Heiligkeit missachteten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμφότερα … τὰ δίκαια
  choice: wegen beider Vergehen … die gerechte Strafe
  rationale: Das substantivierte Neutrum Plural τὰ δίκαια bezeichnet hier wahrscheinlich die gerechten Folgen beziehungsweise die gebührende Ahndung; ἀμφότερα verweist am ehesten auf die beiden anschließend genannten Vergehen. Die deutsche Formulierung macht den syntaktisch schwierigen Bezug verständlich, ohne die Alternative zu verschweigen.
- source_word: μετελεύσεται
  choice: wird … verfolgen
  rationale: Das Verb hat hier eine nachsetzende, ahndende Kraft. „Verfolgen“ bewahrt das Bild einer Gerechtigkeit, die die Schuldigen einholt.
- source_word: κακῶς ἐφρόνησαν περὶ θεοῦ
  choice: sie dachten verkehrt über Gott
  rationale: Die Wendung bezeichnet eine falsche Auffassung oder ein verfehltes Urteil über Gott; „verkehrt“ ist natürlich und enthält sowohl erkenntnismäßige als auch moralische Färbung.
- source_word: προσχόντες εἰδώλοις
  choice: indem sie sich Götzen zuwandten
  rationale: προσέχω kann Aufmerksamkeit, Hinwendung oder Anhänglichkeit ausdrücken. „Sich zuwenden“ erfasst den Zusammenhang mit Götzendienst, ohne eine stärkere kultische Aussage einzutragen.
- source_word: ἀδίκως ὤμοσαν ἐν δόλῳ
  choice: sie schworen auf ungerechte Weise und in betrügerischer Absicht
  rationale: ἀδίκως bezeichnet die moralische Unrechtmäßigkeit des Schwörens und ist weiter als bloß „falsch“. ἐν δόλῳ benennt Täuschung oder Arglist; „in betrügerischer Absicht“ ist im Deutschen idiomatischer als eine formale Wiedergabe mit „in Täuschung“.
- source_word: καταφρονήσαντες ὁσιότητος
  choice: weil sie missachteten, was heilig ist
  rationale: ὁσιότης kann Heiligkeit, Frömmigkeit oder Ehrfurcht vor dem Heiligen bezeichnen. Die Umschreibung wahrt die sachliche Breite und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Bezug von ἀμφότερα und Bedeutung von τὰ δίκαια
  choice: Die Formulierung bezieht „beide“ auf die zwei im Vers genannten Vergehen und versteht τὰ δίκαια als deren gerechte Ahndung.
  alternative: „Beide“ kann sich auf zwei zuvor genannte Gruppen beziehen; τὰ δίκαια lässt sich allgemeiner als „die Forderungen der Gerechtigkeit“ oder „das Gerechte“ wiedergeben.
  rationale: Der folgende ὅτι-Satz nennt zwei parallele Verfehlungen und stützt den Bezug auf beide Vergehen. Da der griechische Ausdruck jedoch ungewöhnlich und semantisch weiter als ein eindeutiger Strafbegriff ist, wird die alternative Deutung in der Fußnote erhalten.
- issue: Bedeutung von ὁσιότης
  choice: „was heilig ist“
  alternative: „Frömmigkeit“ oder „Heiligkeit“
  rationale: Der Kontext betrifft die Ehrfurcht vor dem Heiligen beim Eid. Die gewählte Umschreibung vermeidet eine Verengung auf persönliche Frömmigkeit oder einen abstrakten Zustand der Heiligkeit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber zur Verständlichkeit leicht entfaltet. Die echte Mehrdeutigkeit von ἀμφότερα und τὰ δίκαια ist in Fußnote [a] dokumentiert.
