base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/005.yaml
  text: But you intend that the works of your wisdom should not be idle[a]; therefore even with the smallest piece of wood men entrust their lives, and passing through the waves on a raft[b], they were brought safely through.
translation:
  language: de
  text: Du willst aber, dass die Werke deiner Weisheit nicht untätig bleiben. Darum vertrauen Menschen selbst einem winzigen Stück Holz ihr Leben[a] an; und als sie auf einem Floß[b] die Wogen durchquerten, wurden sie sicher hindurchgebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ihre Seelen“; hier sind im Zusammenhang mit der Gefahr auf See ihre Leben gemeint.
    reason: lexical_alternative
  - marker: b
    text: Ein Floß, also ein einfaches und gebrechliches Wasserfahrzeug.
    reason: clarification
lexical_decisions:
- source_word: θέλεις
  choice: du willst
  rationale: Das Präsens bezeichnet hier Gottes Willen beziehungsweise seine Absicht. „Du willst“ ist direkt, natürlich und lässt die Bedeutungsbreite zwischen Wollen und Beabsichtigen bestehen.
- source_word: μὴ ἀργὰ εἶναι
  choice: nicht untätig bleiben
  rationale: ἀργός bedeutet untätig, unwirksam oder unproduktiv. Die Formulierung bewahrt das Bild, dass die Werke der Weisheit nicht ohne Tätigkeit bleiben.
- source_word: τὰ τῆς σοφίας σου ἔργα
  choice: die Werke deiner Weisheit
  rationale: Die Genitivverbindung und die theologische Aussage über Gottes Weisheit werden eng am Griechischen wiedergegeben, ohne Weisheit ausdrücklich als eigenständige Person zu deuten.
- source_word: ἐλαχίστῳ ξύλῳ
  choice: einem winzigen Stück Holz
  rationale: ξύλον bezeichnet hier das Holz des äußerst gebrechlichen Wasserfahrzeugs. „Winzig“ gibt die verstärkende superlativische Aussage von ἐλάχιστος idiomatisch wieder, ohne ein logisch absolut kleinstes Holzstück zu behaupten.
- source_word: πιστεύουσιν ... ψυχάς
  choice: vertrauen ... ihr Leben an
  rationale: Mit ψυχάς als Objekt bedeutet πιστεύειν, das eigene Leben etwas anzuvertrauen. Im Zusammenhang einer gefährlichen Seefahrt ist „Leben“ treffender als das leicht missverständliche „Seelen“.
- source_word: κλύδωνα
  choice: die Wogen
  rationale: κλύδων bezeichnet eine anschwellende Woge beziehungsweise den Wellengang. Der deutsche Plural gibt das natürliche Bild einer gefährlichen, bewegten See wieder.
- source_word: σχεδίᾳ
  choice: auf einem Floß
  rationale: σχεδία bezeichnet ein Floß oder ein einfaches, notdürftiges Wasserfahrzeug. „Floß“ ist die präzise und verständliche Entsprechung.
- source_word: διεσώθησαν
  choice: wurden sie sicher hindurchgebracht
  rationale: Die Wiedergabe wahrt das Passiv und den verstärkenden Gedanken des sicheren Durchkommens; zugleich bleibt der im Zusammenhang naheliegende göttliche Urheber unausgesprochen, wie im griechischen Text.
theological_decisions:
- issue: Bezug von „deiner Weisheit“ und göttliches Wirken bei der Rettung auf See
  choice: Der Vers redet Gott unmittelbar an und schreibt seiner Weisheit wirksame Werke zu, ohne Weisheit ausdrücklich als eigenständige Person zu bestimmen.
  alternative: „Weisheit“ als ausdrücklich hypostasierte handelnde Person oder lediglich als abstrakte kluge Ordnung zu deuten.
  rationale: Der griechische Text spricht Gott in der zweiten Person an und nennt „die Werke deiner Weisheit“. Die Übersetzung erhält diese Spannung, statt eine weitergehende metaphysische Deutung festzulegen.
- issue: Ungenannter Handelnder im Passiv διεσώθησαν
  choice: Das Passiv wird als „wurden ... hindurchgebracht“ bewahrt.
  alternative: „Gott brachte sie sicher hindurch“ oder aktiv „sie kamen sicher hindurch“.
  rationale: Im Zusammenhang ist Gottes bewahrendes Wirken impliziert, doch der griechische Satz nennt den Handelnden nicht ausdrücklich. Das Passiv bewahrt sowohl diese Offenheit als auch die theologische Andeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzbewegung. Die maritime Bildsprache bleibt anschaulich; schwer verständliche Wörtlichkeit und konfessionell festgelegte Deutungen werden vermieden.
