  text: And the ambition of the craftsman urged on even those who were ignorant toward an intensification of worship[a].
translation:
  language: de
  text: Und der Ehrgeiz des Kunsthandwerkers trieb sogar die Unwissenden dazu an, die Verehrung noch zu steigern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Religion auszuweiten“; oder: „die religiöse Betätigung zu verstärken“.'
    reason: Lexikalische Alternativen für ἐπίτασιν θρησκείας; die griechische Wendung kann die Steigerung, Ausweitung oder Intensivierung kultischer Praxis bezeichnen.
lexical_decisions:
- source_word: ἐπίτασιν
  choice: noch zu steigern
  rationale: Das Substantiv bezeichnet eine Verstärkung oder Steigerung. Die verbale Formulierung ist im Deutschen natürlich und bewahrt zusammen mit προετρέψατο die Zielrichtung der Aussage.
- source_word: θρησκείας
  choice: die Verehrung
  rationale: Im Zusammenhang der Götzenbilder bezeichnet θρησκεία vor allem kultische Verehrung beziehungsweise religiöse Betätigung, nicht bloß Religion als abstraktes System.
- source_word: ἀγνοοῦντας
  choice: die Unwissenden
  rationale: Das substantivierte Partizip bezeichnet Menschen, denen Erkenntnis fehlt, ohne ausdrücklich festzulegen, was genau sie nicht wissen.
- source_word: τεχνίτου
  choice: Kunsthandwerkers
  rationale: Der Ausdruck bezeichnet hier den geschickten Hersteller eines Bildwerks. „Kunsthandwerker“ verbindet den handwerklichen und gestalterischen Aspekt.
- source_word: προετρέψατο
  choice: trieb ... dazu an
  rationale: Die mediale Verbform drückt ein Antreiben oder Bewegen zu etwas aus. „Trieb ... dazu an“ gibt die wirksame Förderung wieder, ohne gewaltsamen Zwang zu unterstellen.
- source_word: φιλοτιμία
  choice: Ehrgeiz
  rationale: Das Wort bezeichnet ursprünglich das Streben nach Ehre oder Ansehen und kann entsprechend „Ehrgeiz“ bedeuten. Im Kontext ist damit das Geltungsstreben des Herstellers gemeint.
theological_decisions:
- issue: Wiedergabe von θρησκεία in der Götzenpolemik
  choice: Verehrung
  alternative: Religion; religiöse Betätigung
  rationale: „Verehrung“ hebt die kultische Praxis gegenüber den Bildern hervor, ohne θρησκεία auf einen späteren theologischen Fachbegriff festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kunsthandwerker“ ist präziser als das allgemeinere „Handwerker“; „die Verehrung noch zu steigern“ vermeidet das schwerfällige Abstraktum „Intensivierung“.
