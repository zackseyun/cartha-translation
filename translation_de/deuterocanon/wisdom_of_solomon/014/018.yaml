  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und Aussage des Griechischen zuverlässig wieder: Die φιλοτιμία des τεχνίτης bewirkt, dass selbst die ἀγνοοῦντες zu einer Steigerung der θρησκεία bewegt werden. „dazu an, die Verehrung noch zu steigern“ bildet εἰς ἐπίτασιν θρησκείας idiomatisch und mit erhaltener Zielrichtung ab.'
