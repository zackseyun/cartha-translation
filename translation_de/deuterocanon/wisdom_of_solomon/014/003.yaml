  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/003.yaml
  text: But your providence[a], Father, steers it, because you gave a way even in the sea, and a safe path in the waves,
translation:
  language: de
  text: Doch deine Vorsehung, Vater, steuert es; denn du hast auch im Meer einen Weg und in den Wellen einen sicheren Pfad gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Steuert“ hat wie das griechische Verb einen nautischen Sinn; möglich ist auch: „lenkt“ oder „führt“. „Hast ... gegeben“ gibt das griechische Verb wörtlich wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακυβερνᾷ
  choice: steuert
  rationale: Das Verb bezeichnet besonders das Steuern oder Lenken eines Schiffes. „Steuert“ bewahrt im Zusammenhang das konkrete nautische Bild.
- source_word: πρόνοια
  choice: Vorsehung
  rationale: Das Wort umfasst Vorausblick und tätige Fürsorge. „Vorsehung“ gibt hier das theologische Gewicht der fürsorglichen Leitung Gottes wieder.
- source_word: πάτερ
  choice: Vater
  rationale: Der Vokativ redet Gott unmittelbar und persönlich an; „Vater“ ist im modernen Deutsch schlicht und würdig.
- source_word: ἔδωκας
  choice: hast ... geschaffen
  rationale: Wörtlich steht „hast gegeben“. Bei einem Weg im Meer ist „geschaffen“ im Deutschen natürlicher und drückt aus, dass Gott diesen Weg eröffnet hat.
- source_word: ὁδὸν
  choice: einen Weg
  rationale: „Weg“ ist die natürliche Entsprechung und bewahrt zugleich das biblische Bild eines Weges im Meer.
- source_word: τρίβον
  choice: einen ... Pfad
  rationale: „Pfad“ unterscheidet τρίβος von ὁδός und erhält den poetischen Parallelismus.
- source_word: ἀσφαλῆ
  choice: sicheren
  rationale: Das Adjektiv bezeichnet Schutz vor Gefahr; „sicher“ ist klar und idiomatisch.
- source_word: ἐν θαλάσσῃ
  choice: im Meer
  rationale: Die örtliche Formulierung des Griechischen wird direkt und natürlich wiedergegeben.
- source_word: ἐν κύμασι
  choice: in den Wellen
  rationale: Die Wiedergabe erhält die Parallelität zu „im Meer“ und das eindrückliche Bild des Weges mitten in den Wellen.
- source_word: καί
  choice: selbst
  rationale: 'Das erste καί hat hier hervorhebende Kraft: Gott hat sogar beziehungsweise selbst im Meer einen Weg geschaffen.'
theological_decisions:
- issue: Wiedergabe von πρόνοια in Bezug auf Gott
  choice: Vorsehung
  alternative: Fürsorge; vorausschauende Sorge
  rationale: „Vorsehung“ hält Vorausblick, tätige Fürsorge und göttliche Leitung zusammen, ohne den Text durch eine weitergehende konfessionelle Auslegung festzulegen.
- issue: Bezug des unausgesprochenen Objekts bei διακυβερνᾷ
  choice: es
  alternative: sie; alles
  rationale: Das Verb nimmt im Kontext am ehesten das zuvor erwähnte Schiff beziehungsweise Fahrzeug auf. Das neutrale „es“ wahrt diesen Bezug, ohne ein Substantiv in den Vers einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt die Anrede „Vater“, die maritime Metaphorik und den poetischen Parallelismus von „im Meer“ und „in den Wellen“.
