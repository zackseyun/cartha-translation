base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/031.yaml
  text: For it is not the power of the things by which they swear[a], but the punishment of those who sin[b], that always pursues the transgression of the unrighteous.
translation:
  language: de
  text: Denn nicht die Macht dessen, was beim Schwören angerufen wird[a], sondern die Strafe für diejenigen, die sündigen[b], verfolgt stets die Übertretung der Ungerechten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Macht der Eide“ oder „die Macht dessen, wobei sie schwören“. Der griechische Ausdruck ist knapp und kann sich entweder auf den Eid selbst oder auf das beim Schwören Angerufene beziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „die Strafe der Sündigenden“; ebenso „das Gericht über die Sünder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Denn nicht
  rationale: Bewahrt die begründende Funktion von γάρ und führt den Gegensatz im Deutschen knapp und natürlich ein.
- source_word: ἡ τῶν ὀμνυμένων δύναμις
  choice: die Macht dessen, was beim Schwören angerufen wird
  rationale: Die komprimierte griechische Wendung bezeichnet wahrscheinlich das, wobei oder wodurch geschworen wird, im Kontext also das beim Eid Angerufene. Die Formulierung bleibt allgemein genug, um die grammatische Mehrdeutigkeit nicht auf eine bestimmte Art von Wesen oder Gegenständen festzulegen.
- source_word: ἀλλ᾽ ἡ τῶν ἁμαρτανόντων δίκη
  choice: sondern die Strafe für diejenigen, die sündigen
  rationale: δίκη hat hier einen vergeltend-gerichtlichen Sinn. „Strafe“ ist im Deutschen natürlich und verständlich; „für diejenigen, die sündigen“ gibt den Genitiv wieder, ohne die Sünder zu einer feststehenden Personengruppe zu machen.
- source_word: ἐπεξέρχεται
  choice: verfolgt
  rationale: Gibt das aktive Bild des Nachgehens wieder und passt zum Akkusativobjekt παράβασιν.
- source_word: ἀεὶ
  choice: stets
  rationale: Entspricht dem uneingeschränkten zeitlichen Sinn und wahrt den gehobenen, aber gegenwärtigen Ton.
- source_word: τὴν τῶν ἀδίκων παράβασιν
  choice: die Übertretung der Ungerechten
  rationale: Bewahrt den rechtlich-moralischen Wortlaut von παράβασις und ἄδικοι sowie die Genitivkonstruktion des Griechischen.
theological_decisions:
- issue: Bedeutung von δίκη als Ausdruck vergeltender Gerechtigkeit
  choice: Strafe für diejenigen, die sündigen
  alternative: Gericht über die Sünder; vergeltende Gerechtigkeit gegenüber den Sündigenden
  rationale: Der Zusammenhang stellt nicht die Wirksamkeit des beim Eid Angerufenen, sondern die wirksame Ahndung des Unrechts heraus. „Strafe“ gibt diesen Sinn klar wieder, ohne näher zu bestimmen, wie oder durch wen sie vollzogen wird.
- issue: Bezug von τῶν ὀμνυμένων
  choice: dessen, was beim Schwören angerufen wird
  alternative: der Eide; dessen, wobei geschworen wird
  rationale: Die griechische Form kann auf den Eid beziehungsweise seine Gegenstände oder auf die beim Schwören angerufenen Mächte bezogen werden. Der Haupttext folgt dem Kontext der Anrufung, während die Fußnote die echte lexikalische Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Weisheitsstil. Der symmetrische Gegensatz „nicht … sondern …“ und das Bild des unablässigen Verfolgens bleiben erhalten; unnötige konfessionelle oder dogmatische Präzisierungen werden vermieden.
