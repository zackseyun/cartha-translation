base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/023.yaml
  text: For they were conducting either child-killing rites, or secret mysteries, or frenzied revelries with strange customs,
translation:
  language: de
  text: Denn sie hielten entweder Riten ab, bei denen Kinder getötet wurden, oder geheime Mysterien oder veranstalteten rasende Gelage mit fremdartigen Bräuchen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεκνοφόνους τελετάς
  choice: Riten, bei denen Kinder getötet wurden
  rationale: Gibt die kultische Bedeutung von τελεταί und den aktiven Sinn von τεκνοφόνος klar wieder, ohne das Deutsche mit einer schwer verständlichen Zusammensetzung zu belasten.
- source_word: κρύφια μυστήρια
  choice: geheime Mysterien
  rationale: Bewahrt den religionsgeschichtlichen Sinn von μυστήρια als geheime kultische Feiern und die Aussage von κρύφια.
- source_word: ἐμμανεῖς … κώμους
  choice: rasende Gelage
  rationale: κῶμοι bezeichnet ausgelassene Festgelage oder Festzüge; „rasende“ erhält die starke, exzessive Färbung von ἐμμανεῖς.
- source_word: ἐξάλλων θεσμῶν
  choice: nach fremdartigen Bräuchen
  rationale: θεσμοί kann Satzungen oder etablierte Bräuche bezeichnen; im kultischen Zusammenhang ist „Bräuche“ natürlich. „Fremdartig“ gibt ἐξάλλων wieder, ohne es konfessionell oder ethnisch als „heidnisch“ festzulegen.
- source_word: ἄγοντες
  choice: vollzogen … veranstalteten
  rationale: 'Die idiomatische deutsche Aufteilung trägt den unterschiedlichen Objekten Rechnung: Riten werden vollzogen, Gelage veranstaltet.'
theological_decisions:
- issue: Art der Kindertötung
  choice: Riten, bei denen Kinder getötet wurden
  alternative: kindermörderische Riten
  rationale: Die Übersetzung benennt die Tötung von Kindern ausdrücklich, legt aber keine über den griechischen Ausdruck hinausgehende konkrete Opferform fest.
- issue: Bewertung der θεσμοί
  choice: fremdartige Bräuche
  alternative: verkehrte Satzungen
  rationale: Das Griechische kennzeichnet die Bräuche als ungewöhnlich oder abweichend; eine moralisch stärker ausdeutende Wiedergabe würde die offene Nuance unnötig festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die abschließende Interpunktion bleibt als Komma erhalten, weil der griechische Vers syntaktisch in den folgenden Vers weiterführt.
