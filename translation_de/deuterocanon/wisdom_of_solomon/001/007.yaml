base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/007.yaml
  text: For the Spirit of the Lord has filled the inhabited world[b][a], and that which holds all things together has knowledge of every utterance.
translation:
  language: de
  text: Denn der Geist des Herrn hat die bewohnte Welt erfüllt, und was alles zusammenhält[a], weiß um jede Äußerung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was alles umfasst«; auch möglich: »der, der alles zusammenhält«. Das griechische Partizip steht im Neutrum und kann das Umfassen, Erhalten oder Zusammenhalten des Alls bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »hat Kenntnis von Stimme«. Gemeint sein kann jede Stimme, jeder Laut oder jede Äußerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα Κυρίου
  choice: der Geist des Herrn
  rationale: Die Wendung bezeichnet hier Gottes wirksame, alles durchdringende Gegenwart. Die Großschreibung kennzeichnet den wahrscheinlichen göttlichen Bezug, ohne spätere dogmatische Kategorien ausdrücklich in den Text einzutragen.
- source_word: πεπλήρωκεν
  choice: hat … erfüllt
  rationale: 'Das griechische Perfekt bezeichnet eine vollzogene Handlung mit fortdauernder Wirkung: Der Geist hat die Welt erfüllt und ist in ihr gegenwärtig.'
- source_word: τὴν οἰκουμένην
  choice: die bewohnte Welt
  rationale: Die Wiedergabe bewahrt die konkrete Bedeutung der οἰκουμένη als bewohnte Erde beziehungsweise Menschenwelt.
- source_word: τὸ συνέχον τὰ πάντα
  choice: was alles zusammenhält
  rationale: Das substantivierte Partizip steht im Neutrum. Die Formulierung wahrt diese grammatische Offenheit und gibt συνέχω im kosmischen Zusammenhang als Zusammenhalten wieder.
- source_word: γνῶσιν ἔχει
  choice: kennt
  rationale: Das wörtliche »hat Kenntnis« wird im Deutschen idiomatisch mit »kennt« wiedergegeben.
- source_word: φωνῆς
  choice: jede Stimme
  rationale: φωνή kann Stimme, Laut oder Äußerung bedeuten. »Jede Stimme« bewahrt die Bildlichkeit und bringt im universalen Zusammenhang den generischen Singular natürlich zum Ausdruck.
theological_decisions:
- issue: Ob πνεῦμα Κυρίου unpersönlich oder als göttlicher Geist wiederzugeben ist
  choice: der Geist des Herrn
  alternative: der Geist des Herrn mit kleingeschriebenem »Geist« beziehungsweise der Hauch des Herrn
  rationale: Das Erfüllen der ganzen bewohnten Welt und die Kenntnis jeder Stimme sprechen für Gottes wirksame Gegenwart. Die Wiedergabe lässt dennoch offen, wie diese Aussage innerhalb späterer theologischer Systeme einzuordnen ist.
- issue: Ob τὸ συνέχον τὰ πάντα persönlich auf den Geist oder eher unpersönlich bezogen ist
  choice: was alles zusammenhält
  alternative: der, der alles zusammenhält; was alles umfasst
  rationale: Das griechische Neutrum soll nicht stillschweigend personalisiert werden. Zugleich bleibt ein sachlicher Rückbezug auf den Geist möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, während »kennt« statt des schwerfälligen »hat Kenntnis von« für natürliche Lesbarkeit sorgt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Wendungen.
