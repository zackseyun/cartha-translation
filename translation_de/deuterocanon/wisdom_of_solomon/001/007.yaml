  source_fidelity: Der Entwurf gibt die Satzglieder, das Perfekt πεπλήρωκεν, die neutrale Offenheit von τὸ συνέχον und den kosmischen Umfang von τὰ πάντα zuverlässig wieder. Bei φωνῆς ist jedoch „kennt jede Stimme“ im Deutschen leicht als Wiedererkennen einzelner Stimmen zu verstehen; γνῶσιν ἔχει φωνῆς besagt weitergehend Kenntnis von Gesagtem bzw. von Äußerungen.
  naturalness: „Denn der Geist des Herrn hat die bewohnte Welt erfüllt“ ist würdig und verständlich. „weiß um jede Äußerung“ ist für den zweiten Satzteil idiomatischer und trifft die kontextuelle Bedeutung präziser als „kennt jede Stimme“, ohne die lexikalische Breite von φωνή auszuschließen.
