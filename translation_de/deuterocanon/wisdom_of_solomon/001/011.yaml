base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/011.yaml
  text: Therefore guard yourselves against useless grumbling[a], and spare your tongue from slander; for no secret utterance goes out empty[b], and a lying mouth destroys a soul.
translation:
  language: de
  text: Darum hütet euch vor nutzlosem Murren und haltet eure Zunge von übler Nachrede fern; denn kein heimlich gesprochenes Wort bleibt folgenlos[a], und ein lügnerischer Mund vernichtet eine Seele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „geht nicht leer aus“. Gemeint ist, dass auch heimliche Rede nicht wirkungslos oder vergeblich bleibt.'
    reason: Das griechische Sprachbild ist in einer rein wörtlichen deutschen Fassung schwer verständlich und wird deshalb als Alternative dokumentiert.
  - marker: b
    text: 'Oder: „vernichtet ein Leben“ beziehungsweise „vernichtet einen Menschen“. Das griechische Wort kann „Seele“, „Leben“ oder „Person“ bedeuten.'
    reason: Die Bedeutungsbreite von ψυχή soll erhalten bleiben und nicht stillschweigend auf eine einzige anthropologische Deutung verengt werden.
lexical_decisions:
- source_word: φυλάξασθε τοίνυν
  choice: Darum hütet euch
  rationale: Der Aorist-Medium-Imperativ fordert zu bewusster Selbstbewahrung auf; τοίνυν kennzeichnet die Folgerung aus dem vorher Gesagten.
- source_word: γογγυσμὸν ἀνωφελῆ
  choice: nutzlosem Murren
  rationale: γογγυσμός bezeichnet missmutiges, oft halblautes Murren; ἀνωφελής hebt dessen Nutzlosigkeit hervor.
- source_word: ἀπὸ καταλαλιᾶς φείσασθε γλώσσης
  choice: haltet eure Zunge von übler Nachrede fern
  rationale: Die Wiedergabe bewahrt das Bild der Zunge und gibt φείδομαι mit der Bedeutung des Sich-Enthaltens wieder. καταλαλιά meint herabsetzendes oder verleumderisches Reden über andere.
- source_word: φθέγμα λαθραῖον
  choice: heimlich gesprochenes Wort
  rationale: φθέγμα ist eine Äußerung oder ein Laut, λαθραῖος etwas Verborgenes oder Heimliches. Die Formulierung klingt im Deutschen natürlich und wahrt den Gedanken verdeckter Rede.
- source_word: κενὸν οὐ πορεύεται
  choice: bleibt nicht folgenlos
  rationale: Wörtlich heißt die Wendung, eine solche Äußerung gehe nicht leer aus. Gemeint ist, dass auch heimliche Rede Wirkung und Folgen hat; die Fußnote bewahrt das griechische Bild.
- source_word: στόμα καταψευδόμενον
  choice: ein lügnerischer Mund
  rationale: Das Partizip bezeichnet einen Mund, der Unwahres redet. Die knappe Form erhält den sprichwortartigen Stil.
- source_word: ἀναιρεῖ ψυχήν
  choice: vernichtet eine Seele
  rationale: ἀναιρέω kann beseitigen, vernichten oder töten bedeuten; ψυχή kann Seele, Leben oder Person bezeichnen. Die Hauptfassung wahrt die Schwere und anthropologische Offenheit der Aussage.
theological_decisions:
- issue: Bedeutungsumfang von ψυχή im Schlusssatz
  choice: „Seele“ im Haupttext
  alternative: „Leben“ oder „einen Menschen“
  rationale: ψυχή besitzt im Griechischen einen breiten Bedeutungsumfang. „Seele“ bewahrt hier die moralische und anthropologische Tiefe, ohne die ebenfalls möglichen Bezüge auf Leben oder Person auszuschließen; diese werden in der Fußnote genannt.
- issue: Folgen heimlicher Rede
  choice: „bleibt nicht folgenlos“
  alternative: „geht nicht leer aus“ oder „ergeht nicht vergeblich“
  rationale: Der Text stellt fest, dass verborgene Rede nicht ohne Wirkung bleibt, bestimmt aber Art und Zeitpunkt ihrer Folgen nicht näher. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwortartiger Prägnanz. „Murren“, „üble Nachrede“ und „lügnerischer Mund“ sind allgemein verständlich und bleiben zugleich nah an Bildwelt und Ton des griechischen Weisheitstextes.
