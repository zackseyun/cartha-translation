  terminology: „Murren“ und „üble Nachrede“ sind registergerecht und semantisch passend. Die Wahl „Seele“ ist nicht konfessionell überdeutet, da die Alternativen „Leben“ und „Mensch“ ausdrücklich in der Anmerkung genannt werden.
