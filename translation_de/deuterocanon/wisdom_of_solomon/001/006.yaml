base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/006.yaml
  text: For wisdom is a spirit that loves humanity[a], and it will not acquit a blasphemer because of his lips; for God is witness of his inner motives[b], and a true observer of his heart and a hearer of his tongue.
translation:
  language: de
  text: Denn die Weisheit ist ein Geist, der die Menschen liebt, und sie wird einen Lästerer wegen dessen, was von seinen Lippen kommt,[a] nicht für schuldlos erklären; denn Gott ist Zeuge seines Innersten,[b] ein wahrer Beobachter seines Herzens und hört, was seine Zunge sagt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird einen Lästerer nicht für schuldlos erklären wegen dessen, was von seinen Lippen kommt«. Die knappe griechische Wendung kann kausal verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »seiner Nieren«. Die Nieren stehen hier bildlich für das verborgene Innere eines Menschen, einschließlich seiner Gedanken und Beweggründe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλάνθρωπον
  choice: der die Menschen liebt
  rationale: Gibt die aktive Menschenfreundlichkeit des Adjektivs natürlich und geschlechtsinklusiv wieder.
- source_word: πνεῦμα σοφία
  choice: die Weisheit ist ein Geist
  rationale: Bewahrt die prädikative Aussage des Griechischen und vermeidet eine ausdrückliche Gleichsetzung mit dem Heiligen Geist, die der Vers selbst nicht erzwingt.
- source_word: οὐκ ἀθῳώσει
  choice: wird … nicht für schuldlos erklären
  rationale: 'Gibt den forensischen Sinn wieder: jemanden nicht freisprechen beziehungsweise nicht als unschuldig gelten lassen.'
- source_word: βλάσφημον
  choice: einen Lästerer
  rationale: Bewahrt das religiös-moralische Gewicht der Bezeichnung für einen Menschen, der lästerlich redet.
- source_word: ἀπὸ χειλέων αὐτοῦ
  choice: wegen seiner Lippen
  rationale: Folgt der knappen griechischen Formulierung und gibt ihren wahrscheinlichen kausalen Sinn wieder, ohne die Äußerung ausdrücklich in den Haupttext einzutragen.
- source_word: τῶν νεφρῶν αὐτοῦ
  choice: seines Innersten
  rationale: Überträgt das wörtliche Bild der Nieren als Bezeichnung für das verborgene Innenleben, ohne es auf Motive allein zu verengen.
- source_word: μάρτυς
  choice: Zeuge
  rationale: Erhält den gerichtlichen Klang und die Parallelität der drei Bezeichnungen Gottes.
- source_word: ἐπίσκοπος ἀληθής
  choice: ein wahrer Beobachter
  rationale: Drückt zuverlässiges, prüfendes Wahrnehmen aus und vermeidet die hier unpassende kirchenamtliche Bedeutung von »Bischof«.
- source_word: τῆς καρδίας
  choice: seines Herzens
  rationale: Bewahrt den üblichen biblischen Ausdruck für das innere Denken, Wollen und Empfinden.
- source_word: τῆς γλώσσης ἀκουστής
  choice: ein Hörer seiner Zunge
  rationale: Erhält das konkrete Körperbild und die substantivische Parallelität zu »Zeuge« und »Beobachter«, auch wenn die Wendung im Deutschen bewusst markant klingt.
theological_decisions:
- issue: Ob πνεῦμα σοφία ausdrücklich mit dem Heiligen Geist gleichgesetzt werden soll
  choice: »die Weisheit ist ein Geist« mit kleingeschriebenem »Geist«
  alternative: »die Weisheit ist der Heilige Geist« oder »die Weisheit ist der Geist«
  rationale: Der griechische Text personifiziert die Weisheit und bezeichnet sie als Geist, fordert aber keine ausdrückliche trinitarische Identifikation. Die Übersetzung bewahrt diese theologische Offenheit.
- issue: Wie das anthropologische Bild τῶν νεφρῶν αὐτοῦ wiederzugeben ist
  choice: »seines Innersten«
  alternative: »seiner Nieren« oder »seiner innersten Beweggründe«
  rationale: »Innerstes« vermittelt Gottes Kenntnis des verborgenen Menschen, bleibt aber weiter als die interpretierende Festlegung auf Motive.
- issue: Wie die gerichtliche Aussage οὐκ ἀθῳώσει zu verstehen ist
  choice: »nicht für schuldlos erklären«
  alternative: »nicht ungestraft lassen«
  rationale: Die gewählte Fassung erhält primär den forensischen Sinn des Verbs, ohne die Aussage ausschließlich als Strafvollzug auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur und die dreifache Bezeichnung Gottes als Zeuge, Beobachter und Hörer bleiben möglichst erhalten. Ungewohnte Körperbilder werden teils im Haupttext verständlich übertragen und in Fußnoten offengelegt.
