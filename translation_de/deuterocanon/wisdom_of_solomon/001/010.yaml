translation:
  language: de
  text: Denn ein eifersüchtiges Ohr hört alles[a], und das Geräusch des Murrens bleibt nicht verborgen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein eifriges Ohr«. Das griechische Wort kann sowohl Eifersucht als auch Eifer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Laut des Murrens«, »das Geflüster des Murrens« oder »der Klang der Beschwerden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖς
  choice: das Ohr
  rationale: Die wörtliche Wiedergabe bewahrt das personifizierende Bild eines Ohres, dem nichts entgeht.
- source_word: ζηλώσεως
  choice: der Eifersucht
  rationale: Der Genitiv wird formal bewahrt. »Eifersucht« erhält die scharfe, moralisch aufgeladene Bedeutung des griechischen Wortes, ohne sie vorschnell zu »Eifer« oder »Wachsamkeit« abzuschwächen.
- source_word: ἀκροᾶται
  choice: hört
  rationale: Das schlichte Verb gibt den Vorgang des Hörens prägnant wieder und passt zur Aussage umfassender Wahrnehmung.
- source_word: τὰ πάντα
  choice: alles
  rationale: »Alles« ist im modernen Deutsch natürlich und gibt den umfassenden Sinn vollständig wieder.
- source_word: θροῦς
  choice: das Raunen
  rationale: Das Wort bezeichnet ein Geräusch, Gemurmel oder Gerücht. »Raunen« hält die Hörmetaphorik fest und lässt zugleich die leise, schwer greifbare Art der Äußerung erkennen.
- source_word: γογγυσμῶν
  choice: des Murrens
  rationale: »Murren« bezeichnet leise, missmutige oder aufbegehrende Rede und bewahrt sowohl den Klangaspekt als auch die moralische Färbung.
- source_word: οὐκ ἀποκρύπτεται
  choice: bleibt nicht verborgen
  rationale: Die passive Aussageform wird gewahrt und in natürliches Deutsch übertragen.
theological_decisions:
- issue: Bedeutung von ζηλώσεως im Zusammenhang mit göttlicher Wahrnehmung
  choice: »der Eifersucht«
  alternative: »des Eifers« oder »der eifersüchtigen Wachsamkeit«
  rationale: Der Kontext legt ein göttliches, alles wahrnehmendes Hören nahe, doch der griechische Ausdruck benennt Gott nicht ausdrücklich. Die Übersetzung wahrt daher sowohl das Bild als auch seine Spannung und erklärt die mögliche Bedeutung »Eifer« in der Fußnote, statt sie im Haupttext festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst markante Wendung »Ohr der Eifersucht« bewahrt das griechische Bild und seine theologische Spannung; »Raunen des Murrens« hält die Klangwirkung der beiden griechischen Substantive fest.
