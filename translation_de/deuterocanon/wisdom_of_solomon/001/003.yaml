review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen: σκολιοὶ λογισμοί sind „verkehrte Gedanken“, χωρίζουσιν ἀπὸ θεοῦ ist angemessen mit „trennen von Gott“ wiedergegeben, und die Macht bezieht sich im Kontext plausibel auf Gott. Die temporale Wiedergabe von δοκιμαζομένη ist möglich. Für τοὺς ἄφρονας ist jedoch „die Toren“ im weisheitlichen Register näher und idiomatischer als „die Unverständigen“.'
  naturalness: Der Entwurf ist verständlich, doch die Inversion „und wird seine Macht auf die Probe gestellt, entlarvt sie …“ wirkt unnötig gehoben und kann kurzzeitig schwer erfassbar sein. Mit „und wenn seine Macht auf die Probe gestellt wird“ ist der Satz im modernen Standarddeutsch klarer. Der Fußnotenanker sollte unmittelbar bei „entlarvt“ stehen, auf das sich die lexikalische Alternative bezieht.
  terminology: „Verkehrte Gedanken“ und „seine Macht“ sind tragfähig. „Die Toren“ entspricht dem traditionellen, weiterhin verständlichen Weisheitsvokabular und gibt ἄφρονες präziser wieder als „die Unverständigen“. „Entlarvt“ bewahrt die nicht ausschließlich forensische Weite von ἐλέγχει; „überführt“ bleibt als Alternative sinnvoll.
  issues:
  - severity: medium
    issue: „die Unverständigen“ für τοὺς ἄφρονας
    rationale: Die Formulierung ist zwar möglich, bezeichnet im heutigen Deutsch aber leicht Menschen, die etwas nicht verstehen. „Die Toren“ bezeichnet den im griechischen Weisheitskontext gemeinten Mangel an Einsicht und Weisheit genauer.
  - severity: low
    issue: Markierte Inversion im zweiten Teilsatz
    rationale: Die Stellung „und wird …, entlarvt …“ ist grammatisch möglich, aber weniger unmittelbar als ein expliziter Konditionalsatz mit „wenn“.
  - severity: low
    issue: Fußnotenanker am Satzende
    rationale: Die Fußnote bietet eine Alternative zu ἐλέγχει („entlarvt“) und sollte daher unmittelbar an diesem Wort verankert werden.
