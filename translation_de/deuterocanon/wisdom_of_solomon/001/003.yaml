lexical_decisions:
- source_word: σκολιοὶ
  choice: verkehrte
  rationale: Das Adjektiv bezeichnet moralisch verdrehtes oder vom rechten Weg abweichendes Denken; „verkehrte“ ist im Deutschen natürlich und würdevoll.
- source_word: λογισμοὶ
  choice: Gedanken
  rationale: Der Ausdruck kann Gedanken, Überlegungen oder Erwägungen meinen. „Gedanken“ wahrt hier die Breite der inneren moralisch-intellektuellen Tätigkeit.
- source_word: χωρίζουσιν ἀπὸ θεοῦ
  choice: trennen von Gott
  rationale: Dies gibt die Grundbedeutung des Verbs unmittelbar wieder, ohne eine weitergehende theologische Deutung einzutragen.
- source_word: δοκιμαζομένη
  choice: wird ... auf die Probe gestellt
  rationale: Die passive beziehungsweise mediale Partizipialform wird temporal-konditional wiedergegeben und wahrt den Gedanken einer Prüfung oder Herausforderung.
- source_word: ἡ δύναμις
  choice: seine Macht
  rationale: Der vorangehende Gottesbezug legt Gottes Macht als Referenten nahe; das Pronomen macht den Zusammenhang im Deutschen verständlich.
- source_word: ἐλέγχει
  choice: entlarvt
  rationale: Das Verb kann aufdecken, überführen oder zurechtweisen bedeuten. „Entlarvt“ betont das Offenbarwerden der Torheit, ohne die Aussage auf einen förmlichen Gerichtsvorgang festzulegen.
- source_word: τοὺς ἄφρονας
  choice: die Unverständigen
  rationale: Der Ausdruck bezeichnet Menschen ohne Einsicht oder Weisheit. „Die Unverständigen“ entspricht dem weisheitlichen Kontext und bleibt sachlich.
theological_decisions:
- issue: Referent von ἡ δύναμις
  choice: Als Gottes Macht verstanden und mit „seine Macht“ wiedergegeben.
  alternative: Die unpersönliche Formulierung „die Macht“.
  rationale: Die unmittelbar vorausgehende Erwähnung Gottes macht diesen Bezug am wahrscheinlichsten, ohne einen zusätzlichen theologischen Gedanken einzuführen.
- issue: Bedeutungsumfang von ἐλέγχει
  choice: „entlarvt“
  alternative: „überführt“, „weist zurecht“ oder „erweist als im Unrecht“
  rationale: Die Wiedergabe wahrt die Spannung zwischen Aufdeckung, Widerlegung und möglicher Zurechtweisung, ohne ausschließlich eine gerichtliche Bedeutung festzulegen.
- issue: Syntaktische Beziehung von δοκιμαζομένη
  choice: 'Temporal-konditional: „wird seine Macht auf die Probe gestellt“'
  alternative: 'Eng partizipial: „seine auf die Probe gestellte Macht“'
  rationale: Die gewählte Form ist idiomatisches modernes Deutsch und lässt offen, ob die Prüfung als tatsächlicher Vorgang oder als Herausforderung verstanden wird.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Weisheitsstil. Die Satzstruktur bleibt dem griechischen Gedankengang nahe; echte lexikalische Mehrdeutigkeit bei ἐλέγχει wird in der Fußnote sichtbar gemacht.
