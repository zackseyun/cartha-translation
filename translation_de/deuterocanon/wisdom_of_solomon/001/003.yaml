revisions:
- from: Denn verkehrte Gedanken trennen von Gott, und wird seine Macht auf die Probe gestellt, entlarvt sie die Unverständigen.[a]
  to: Denn verkehrte Gedanken trennen von Gott, und wenn seine Macht auf die Probe gestellt wird, entlarvt[a] sie die Toren.
  rationale: Die Revision glättet die deutsche Satzführung, ersetzt die weniger präzise Personenbezeichnung „die Unverständigen“ durch das im Weisheitsstil angemessene „die Toren“ und setzt den vorhandenen Fußnotenanker direkt an die lexikalisch erläuterte Verbform. Der Aussagegehalt und die vom Griechischen zugelassene Spannung von ἐλέγχει bleiben erhalten.
