  source_fidelity: 'Der Entwurf gibt die griechische Satzfolge und die zentralen Bilder zuverlässig wieder: die Gottlosen rufen den personifizierten Tod mit „Händen und Worten“ herbei, halten ihn für einen Freund, verzehren sich, schließen mit ihm einen Bund und gehören zu seinem Anteil. Die Pronomen bewahren die Gestalt des griechischen Textes; Fußnote a klärt ihren Kontextbezug angemessen.'
  naturalness: Modernes, würdiges Standarddeutsch. „riefen ihn … herbei“, „hielten ihn für einen Freund“ und „schlossen einen Bund“ sind klar und idiomatisch. „verzehrten sich“ ist eine tragfähige bildhafte Wiedergabe von ἐτάκησαν und wahrt dessen Dahinschwindens- bzw. Selbstzerstörungsbild.
