base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/016.yaml
  text: But the ungodly[a], with their hands and their words, called for him; considering him a friend, they wasted away, and they made a covenant with him[c][b], because they are worthy to belong to his portion.
translation:
  language: de
  text: Doch die Gottlosen riefen ihn[a] mit ihren Händen und Worten herbei; sie hielten ihn für einen Freund und verzehrten sich. Sie schlossen einen Bund[b] mit ihm, denn sie sind es wert, zu seinem Anteil zu gehören.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „ihn“ ist der im vorausgehenden Zusammenhang personifizierte Tod gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Sie schlossen einen Pakt mit ihm.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihm als Los zuzufallen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: Bewahrt die religiös-moralische Bedeutung von Menschen, die Gott und das Rechte missachten; „Böse“ wäre allgemeiner.
- source_word: ταῖς χερσὶ καὶ τοῖς λόγοις
  choice: mit ihren Händen und Worten
  rationale: Erhält die konkrete Parallelität von Handeln und Reden, ohne die Hände erklärend durch „Taten“ zu ersetzen.
- source_word: προσεκαλέσαντο αὐτόν
  choice: riefen ihn herbei
  rationale: Das Medium bezeichnet hier ein Rufen zu sich beziehungsweise ein Herbeirufen. Die Formulierung ist im Deutschen natürlich und lässt die personifizierende Bildsprache bestehen.
- source_word: φίλον ἡγησάμενοι αὐτόν
  choice: sie hielten ihn für einen Freund
  rationale: Gibt die prädikative Konstruktion unmittelbar wieder und bewahrt die befremdliche Darstellung des Todes als Freund.
- source_word: ἐτάκησαν
  choice: verzehrten sich
  rationale: Das Verb bezeichnet ein Schmelzen oder Dahinschwinden und kann bildlich ein Sichverzehren ausdrücken. Die deutsche Wendung bewahrt die Mehrdeutigkeit, ohne ein im Griechischen unausgesprochenes Ziel wie „nach ihm“ einzufügen.
- source_word: συνθήκην ἔθεντο πρὸς αὐτόν
  choice: sie schlossen einen Bund mit ihm
  rationale: „Bund“ gibt die feierliche und bindende Vereinbarung wieder und trägt die ironische Schwere der Verbindung mit dem Tod; „Pakt“ bleibt als Alternative vermerkt.
- source_word: ἄξιοί εἰσιν
  choice: sie sind es wert
  rationale: Bewahrt den Gedanken von Wertsein beziehungsweise Würdigkeit und lässt den bitter-ironischen Ton stehen.
- source_word: τῆς ἐκείνου μερίδος εἶναι
  choice: zu seinem Anteil zu gehören
  rationale: Gibt μερίς als „Anteil“ wieder und bewahrt die Vorstellung, dem Bereich oder Los des personifizierten Todes zuzugehören.
theological_decisions:
- issue: Bezugswort der männlichen Pronomen αὐτόν/αὐτοῦ
  choice: Das Haupttextwort bleibt „ihn/ihm/sein“; eine Fußnote identifiziert den Tod als Bezugswort.
  alternative: Im Haupttext jeweils ausdrücklich „den Tod/dem Tod“ schreiben.
  rationale: 'Der unmittelbare Kontext personifiziert den Tod, während der griechische Vers selbst nur Pronomen verwendet. Die Übersetzung wahrt beides: die Textgestalt im Haupttext und die notwendige Orientierung in der Fußnote.'
- issue: Feierliche Bündnissprache bei συνθήκη
  choice: „Bund“
  alternative: „Pakt“ oder „Vereinbarung“
  rationale: Obwohl kein Bund mit Gott gemeint ist, bezeichnet das Wort eine bindende Übereinkunft. „Bund“ erhält die feierliche Ironie, ohne daraus eine bestimmte konfessionelle Lehre abzuleiten.
- issue: Ironische Aussage der Würdigkeit in ἄξιοί εἰσιν
  choice: „sie sind es wert“
  alternative: „sie verdienen es“ oder „sie sind würdig“
  rationale: Die Formulierung lässt offen, ob der Satz vor allem Eignung, Würdigkeit oder verdiente Zuordnung betont, und glättet die Spannung nicht zu einer bloßen Strafbehauptung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkreten Bilder „Hände und Worte“, die Personifizierung des Todes sowie die absichtlich herbe Bündnis- und Anteilssprache bleiben erhalten. Das Semikolon gliedert den langen griechischen Satz, ohne seine gedankliche Einheit aufzulösen.
