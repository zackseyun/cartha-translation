base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/014.yaml
  text: For he created all things so that they might exist[a], and the generations of the world are health-giving, and in them there is no poison of destruction, nor the dominion of Hades upon the earth[b];
translation:
  language: de
  text: Denn er schuf alles, damit es da sei, und die Geschöpfe der Welt sind heilsam[a]. In ihnen ist kein Gift des Verderbens, und auf Erden gibt es keine Herrschaft des Hades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Hervorbringungen der Welt sind lebensfördernd“ beziehungsweise „die Entstehungen der Welt sind heilsam“. Der griechische Ausdruck ist weit gefasst und kann Ursprünge, Entstehungen oder das innerhalb der Schöpfung Hervorgebrachte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf Erden gibt es kein Reich des Hades“. Das griechische Wort kann sowohl eine Herrschaftsmacht als auch einen Herrschaftsbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισεν
  choice: schuf
  rationale: κτίζω bezeichnet das Erschaffen beziehungsweise Ins-Dasein-Bringen; „schuf“ gibt den göttlichen Schöpfungsakt prägnant und würdig wieder.
- source_word: εἰς τὸ εἶναι
  choice: damit es da sei
  rationale: Die Konstruktion kann Zweck oder Ergebnis ausdrücken. „Damit es da sei“ bewahrt die Ausrichtung der Schöpfung auf Existenz und klingt im Deutschen natürlicher als „zum Sein“.
- source_word: τὰ πάντα
  choice: alles
  rationale: Der substantivierte Plural bezeichnet umfassend die Gesamtheit des Geschaffenen; das deutsche „alles“ ist klar und idiomatisch.
- source_word: σωτήριοι
  choice: heilsam
  rationale: Das Adjektiv bezeichnet hier im Gegensatz zu Verderben und Tod eine wohltuende, bewahrende oder lebensfördernde Wirkung. „Heilsam“ erhält diese Bedeutungsbreite, ohne ausdrücklich eine spätere Heilslehre einzutragen.
- source_word: αἱ γενέσεις τοῦ κόσμου
  choice: die Geschöpfe der Welt
  rationale: γένεσις kann Ursprung, Entstehung oder das Hervorgebrachte bezeichnen. Im Plural sind hier wahrscheinlich die innerhalb der Welt hervorgebrachten Wesen oder Gebilde gemeint; „Geschöpfe der Welt“ ist verständlich, während die Fußnote die echte Bedeutungsbreite offenhält.
- source_word: φάρμακον ὀλέθρου
  choice: Gift des Verderbens
  rationale: φάρμακον bezeichnet kontextbedingt einen schädlichen Stoff. Die genitivische Wendung bleibt mit „Gift des Verderbens“ sichtbar und erhält den feierlichen Ton.
- source_word: ᾅδου βασίλειον
  choice: Herrschaft des Hades
  rationale: βασίλειον kann königliche Herrschaft, Reich oder Herrschaftsbereich bedeuten. „Herrschaft des Hades“ bewahrt den abstrakten Sinn, ohne die mögliche räumliche Bedeutung auszuschließen.
- source_word: ἐπὶ γῆς
  choice: auf Erden
  rationale: Die Wendung bezeichnet den irdischen Bereich. „Auf Erden“ ist knapp, würdig und im modernen Standarddeutsch gut verständlich.
theological_decisions:
- issue: Bedeutung von σωτήριοι im Schöpfungszusammenhang
  choice: heilsam im Sinn von wohltuend, bewahrend oder lebensfördernd
  alternative: heilbringend beziehungsweise rettend
  rationale: Der unmittelbare Zusammenhang stellt Gottes Schöpfungsabsicht Verderben und Hades gegenüber. „Heilsam“ bewahrt die positive, lebenszugewandte Aussage, ohne sie auf einen ausdrücklich soteriologischen Fachsinn festzulegen.
- issue: Wiedergabe von ᾅδης
  choice: Hades
  alternative: Totenreich, Grab oder Tod
  rationale: Der griechische Text nennt ausdrücklich den Hades. Die Transliteration erhält den antiken Begriff und vermeidet eine vorschnelle Gleichsetzung mit Grab, Tod oder einer bestimmten theologischen Vorstellung vom Jenseits.
- issue: Bedeutung von βασίλειον
  choice: Herrschaft
  alternative: Reich
  rationale: Die Formulierung kann sowohl eine regierende Macht als auch einen Herrschaftsbereich bezeichnen. Im Haupttext steht „Herrschaft“, während die Fußnote die räumlichere Alternative „Reich“ bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. „Da sei“ wahrt den existenziellen Sinn von εἶναι ohne schwerfällige Abstraktion; „auf Erden“ erhält den feierlichen Klang. Die Zweiteilung in zwei Sätze verbessert die Lesbarkeit, ohne die gedankliche Abfolge des griechischen Textes aufzulösen.
