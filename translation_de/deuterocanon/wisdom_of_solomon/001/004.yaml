base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/004.yaml
  text: For wisdom will not enter a soul that devises evil[b][a], nor dwell in a body enslaved to sin.
translation:
  language: de
  text: Denn die Weisheit wird nicht in eine Seele eintreten, die Böses ersinnt,[a] und sie wird nicht in einem Körper wohnen, der unter der Macht der Sünde steht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „eine arglistige Seele“, „eine böse Seele“ oder, wörtlicher, „eine im Bösen kunstfertige Seele“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „der Sünde unterworfen“, „der Sünde verpflichtet“ oder „der Sünde verschuldet“. Das griechische Wort kann bezeichnen, dass jemand unter einem Anspruch, einer Verpflichtung oder einer Schuld steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακότεχνον
  choice: die Böses ersinnt
  rationale: Das Adjektiv bezeichnet eine Seele, die im Bösen kunstfertig ist beziehungsweise Böses ausheckt. Die verbale Wiedergabe ist im Deutschen natürlich und bewahrt den Aspekt des planvollen Hervorbringens von Bösem.
- source_word: ψυχὴν
  choice: Seele
  rationale: „Seele“ erhält den ausdrücklichen Gegensatz zu σώματι („Körper“) und die moralisch-anthropologische Bildsprache, ohne daraus eine umfassende dualistische Lehre abzuleiten.
- source_word: εἰσελεύσεται
  choice: wird … einziehen
  rationale: „Einziehen“ bewahrt die räumliche Metapher und bereitet den Gegensatz zum dauerhaften Wohnen vor.
- source_word: σοφία
  choice: Weisheit
  rationale: Dies ist die direkte und im Kontext der Weisheitsliteratur übliche Wiedergabe.
- source_word: κατοικήσει
  choice: wird … wohnen
  rationale: Das Verb bezeichnet ein beständiges Wohnen und steht damit in sinnvoller Steigerung zum bloßen Eintreten.
- source_word: σώματι
  choice: Körper
  rationale: Die direkte Wiedergabe erhält den im Griechischen ausdrücklich gesetzten Gegensatz von Seele und Körper.
- source_word: κατάχρεῳ
  choice: unter der Macht … steht
  rationale: Das Wort kann Verschuldung, Verpflichtung oder Unterworfenheit ausdrücken. Im Zusammenhang mit Sünde vermittelt diese Formulierung verständlich, dass der Körper ihrem Anspruch beziehungsweise ihrer Kontrolle untersteht, ohne das Bild ausdrücklich zur Sklaverei auszuweiten.
- source_word: ἁμαρτίας
  choice: der Sünde
  rationale: Der Genitiv wird schlicht als „der Sünde“ wiedergegeben und nicht zu einem abstrakteren „Sündhaftigkeit“ umgedeutet.
theological_decisions:
- issue: Anthropologischer Gegensatz zwischen Seele und Körper
  choice: Die Begriffe „Seele“ und „Körper“ werden beide beibehalten.
  alternative: ψυχή als „Mensch“ oder „Inneres“ wiederzugeben.
  rationale: Der griechische Text nennt beide Größen ausdrücklich. Ihre Beibehaltung wahrt den literarischen und moralischen Gegensatz, ohne über den Vers hinaus eine bestimmte Lehre über das Verhältnis von Seele und Körper festzulegen.
- issue: Bedeutungsumfang von κατάχρεῳ ἁμαρτίας
  choice: „unter der Macht der Sünde steht“
  alternative: „der Sünde verpflichtet“, „der Sünde verschuldet“ oder „der Sünde unterworfen“
  rationale: Die gewählte Fassung bringt den Anspruch und die beherrschende Wirkung der Sünde in natürlichem Deutsch zum Ausdruck. Die Fußnote bewahrt zugleich die Schuld- und Verpflichtungsnuance des griechischen Wortes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt dem griechischen Gedankenverlauf, während „einziehen“ und „wohnen“ die räumliche Metapher idiomatisch erhalten. Die Fußnoten sichern echte lexikalische Mehrdeutigkeit ab.
