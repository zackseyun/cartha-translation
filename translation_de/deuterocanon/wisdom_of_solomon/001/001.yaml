base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/001.yaml
  text: Love righteousness[a], you who judge the earth; think about the Lord with goodness[c][b], and seek him with singleness of heart.
translation:
  language: de
  text: Liebt die Gerechtigkeit[a], ihr, die ihr die Erde richtet[b]; denkt in Güte über den Herrn nach und sucht ihn mit ungeteiltem Herzen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gerechtigkeit“ kann hier auch im Sinn von „Rechtschaffenheit“ verstanden werden; im Zusammenhang mit denen, die richten, tritt besonders das gerechte Handeln hervor.
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint sein können die Herrscher oder Regierenden der Erde. Wörtlich steht hier: „die die Erde richten“.'
    reason: referent_clarification
  - marker: c
    text: 'Oder: „mit aufrichtigem Herzen“. Der griechische Ausdruck bezeichnet ein lauteres, nicht geteiltes Herz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: Liebt
  rationale: Der Aoristimperativ wird als unmittelbare, nachdrückliche Aufforderung wiedergegeben.
- source_word: δικαιοσύνην
  choice: die Gerechtigkeit
  rationale: „Gerechtigkeit“ umfasst im Deutschen sowohl persönliches rechtschaffenes Handeln als auch gerechtes Urteilen und bewahrt damit die Bedeutungsbreite des griechischen Ausdrucks.
- source_word: οἱ κρίνοντες τὴν γῆν
  choice: ihr, die ihr die Erde richtet
  rationale: Die Formulierung folgt dem griechischen Partizip „die Richtenden“ und legt die Angesprochenen nicht vorschnell auf die engere Deutung „Herrscher“ fest.
- source_word: φρονήσατε περὶ τοῦ κυρίου
  choice: denkt … über den Herrn nach
  rationale: Die Wendung gibt das auf den Herrn gerichtete Denken wieder, ohne φρονέω unnötig als bloßes Wissen oder Verstehen einzuengen.
- source_word: ἐν ἀγαθότητι
  choice: in Güte
  rationale: Die Wiedergabe wahrt die Grundbedeutung einer guten, rechtschaffenen inneren Haltung.
- source_word: ἐν ἁπλότητι καρδίας
  choice: mit ungeteiltem Herzen
  rationale: Die Formulierung vermittelt die hier gemeinte Geradheit, Aufrichtigkeit und innere Ungeteiltheit, ohne das heute leicht missverständliche „Einfalt“ zu verwenden.
- source_word: ζητήσατε αὐτόν
  choice: sucht ihn
  rationale: „Sucht ihn“ ist eine direkte, natürliche Wiedergabe des Imperativs und bewahrt dessen Ernst und religiöse Tragweite.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ passt zum Zusammenhang des Richtens und kann zugleich die umfassendere ethische Haltung bezeichnen; die Übersetzung beschränkt den Ausdruck daher weder auf Rechtsprechung noch allein auf persönliche Tugend.
- issue: Identität derer, die die Erde richten
  choice: ihr, die ihr die Erde richtet
  alternative: ihr Herrscher der Erde
  rationale: Der Zusammenhang kann auf Herrschende oder Regierende zielen, doch der griechische Wortlaut bezeichnet sie ausdrücklich als Richtende. Diese Spannung bleibt erhalten.
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: der Gebieter
  rationale: „Der Herr“ ist im biblischen Kontext die angemessene und nicht unnötig einengende Wiedergabe.
- issue: Nuance von ἁπλότης καρδίας
  choice: mit ungeteiltem Herzen
  alternative: mit aufrichtigem Herzen
  rationale: Die Hauptfassung bewahrt den Gedanken einer ungeteilten, geraden Herzenshaltung; die mögliche Betonung der Aufrichtigkeit wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer imperativischer Ansprache. Die leicht markierte Wendung „die Erde richtet“ bewahrt bewusst die Bild- und Ausdrucksweise des griechischen Textes; missverständliches oder veraltetes „Einfalt des Herzens“ wird vermieden.
