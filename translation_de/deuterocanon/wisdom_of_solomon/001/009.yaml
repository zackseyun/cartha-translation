  text: For an inquiry will be made into the schemes of the ungodly[c][b][a], and a report of his words will come to the Lord for the exposing of his lawless deeds.
translation:
  language: de
  text: Denn die Pläne[a] eines Gottlosen werden geprüft werden, und ein Bericht[b] über seine Worte wird zum Herrn gelangen zur Aufdeckung seiner gesetzlosen Taten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Überlegungen“, „Beratungen“ oder „Machenschaften“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Hören“; gemeint ist, dass seine Worte dem Herrn zu Ohren kommen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zur Zurechtweisung“ oder „zur Überführung seiner gesetzlosen Taten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβουλίοις
  choice: Pläne
  rationale: Das Substantiv bezeichnet Überlegungen, Beratungen oder daraus hervorgehende Pläne. „Pläne“ ist im Deutschen klar und lässt offen, ob eher der Denkprozess oder das Vorhaben gemeint ist; Alternativen werden in der Fußnote genannt.
- source_word: ἀσεβοῦς
  choice: eines Gottlosen
  rationale: Der substantivisch gebrauchte Singular bezeichnet allgemein einen Menschen, der Gott missachtet. „Gottloser“ bewahrt die ausdrücklich religiös-moralische Dimension stärker als das allgemeinere „Bösewicht“ oder „Übeltäter“.
- source_word: ἐξέτασις
  choice: werden untersucht werden
  rationale: ἐξέτασις bezeichnet eine Prüfung oder eingehende Untersuchung. Die verbale deutsche Form gibt die unpersönliche Zukunftsaussage natürlich wieder und wahrt den gerichtlichen Beiklang.
- source_word: λόγων
  choice: Worte
  rationale: „Worte“ gibt den weiten Bedeutungsumfang des griechischen Ausdrucks direkt wieder und passt zum Zusammenhang über menschliches Reden.
- source_word: ἀκοὴ
  choice: ein Bericht
  rationale: Wörtlich bezeichnet das Wort ein Hören beziehungsweise das Gehörte. Hier ist gemeint, dass das Gesagte dem Herrn zu Ohren kommt; „ein Bericht“ drückt dies idiomatisch aus, ohne die Aussage als bloßes Geräusch misszuverstehen.
- source_word: Κύριον
  choice: zum Herrn
  rationale: Κύριος wird entsprechend seinem göttlichen Bezug mit „Herr“ wiedergegeben; die Präposition πρὸς bezeichnet hier das Gelangen zu ihm.
- source_word: ἔλεγχον
  choice: aufgedeckt werden
  rationale: ἔλεγχος kann Aufdeckung, Überführung, Zurechtweisung oder Widerlegung bezeichnen. „Aufgedeckt werden“ bewahrt hier den Gedanken, dass die eigenen Worte die gesetzlosen Taten ans Licht bringen, ohne vorschnell nur Strafe oder Verurteilung auszudrücken.
- source_word: ἀνομημάτων
  choice: gesetzlosen Taten
  rationale: Das Wort bezeichnet konkrete Verstöße gegen das Gesetz oder die göttliche Ordnung. „Gesetzlose Taten“ bewahrt sowohl die konkrete Mehrzahl als auch den Bezug auf Normverletzung.
theological_decisions:
- issue: Generischer Singular bei ἀσεβοῦς und αὐτοῦ
  choice: Der griechische Singular wird mit „eines Gottlosen … seine“ beibehalten.
  alternative: Generische Mehrzahl („der Gottlosen … ihre“) oder eine ausdrücklich geschlechtsneutrale Umschreibung („eines gottlosen Menschen … dessen“).
  rationale: Die Quelle verwendet einen männlichen generischen Singular. Die Wiedergabe wahrt Zahl und grammatische Form, ohne damit die Aussage sachlich auf Männer zu beschränken.
- issue: Bedeutung von ἔλεγχος im Verhältnis zu den gesetzlosen Taten
  choice: Die Worte gelangen zum Herrn, sodass die Taten „aufgedeckt werden“.
  alternative: „zur Überführung wegen seiner gesetzlosen Taten“ oder „zur Zurechtweisung für seine gesetzlosen Taten“.
  rationale: Der Ausdruck trägt sowohl einen beweisenden als auch einen tadelnden beziehungsweise überführenden Sinn. „Aufgedeckt“ hält den evidentiellen Aspekt fest; die Fußnote bewahrt die anderen möglichen Nuancen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der zweiteiligen griechischen Aussage, wird jedoch idiomatisch formuliert. „Gottloser“ und „gesetzlose Taten“ erhalten den religiös-rechtlichen Ton des Ausgangstextes; die Fußnoten machen echte lexikalische Mehrdeutigkeiten sichtbar.
