  to: Denn die Pläne[a] eines Gottlosen werden geprüft werden, und ein Bericht[b] über seine Worte wird zum Herrn gelangen zur Aufdeckung seiner gesetzlosen Taten.[c]
  rationale: Die Revision glättet die deutsche Passivform, gibt die finale beziehungsweise gerichtliche εἰς-Fügung enger wieder und korrigiert die Fußnote c, sodass sie nicht mehr zwischen den Taten und der Person wechselt. Die generische Singularform und die theologisch unentschiedene Bandbreite von ἔλεγχος bleiben erhalten.
