base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/012.yaml
  text: Do not court death by the error of your life[b][a], nor draw destruction upon yourselves by the works of your hands.
translation:
  language: de
  text: Strebt nicht nach dem Tod durch die Verirrung eures Lebens[a], und zieht euch nicht durch die Werke eurer Hände[b] das Verderben zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verlangt nicht nach dem Tod auf dem Irrweg eures Lebens.“ Das griechische Verb kann auch „eifrig begehren“ bedeuten; ἐν πλάνῃ lässt sich sowohl instrumental als auch im Sinn eines Bereichs oder Weges verstehen.'
    reason: lexical_alternative
  - marker: b
    text: „Werke eurer Hände“ kann allgemein eure Taten bezeichnen; die konkrete Wendung kann zugleich von Menschenhand Geschaffenes anklingen lassen.
    reason: cultural_note
lexical_decisions:
- source_word: ζηλοῦτε
  choice: strebt … nach
  rationale: Das Verb bezeichnet hier ein eifriges Begehren oder Verfolgen. „Nach dem Tod streben“ gibt die aktive Ausrichtung natürlich und eindringlich wieder, ohne die ungewöhnliche wörtliche Form „für den Tod eifern“ zu erzwingen.
- source_word: θάνατον
  choice: Tod
  rationale: Direkte und eindeutige Wiedergabe des griechischen Substantivs.
- source_word: ἐν πλάνῃ
  choice: durch die Verirrung
  rationale: πλάνη kann Verirrung, Irrtum oder Täuschung bezeichnen. „Durch“ versteht ἐν instrumental; „Verirrung“ bewahrt zugleich das Bild eines vom rechten Weg abweichenden Lebens.
- source_word: ζωῆς ὑμῶν
  choice: eures Lebens
  rationale: Der Singular des griechischen Textes bleibt erhalten und wird auf die gemeinsam angesprochene Mehrzahl bezogen.
- source_word: ἐπισπᾶσθε
  choice: zieht euch … zu
  rationale: Die deutsche Wendung gibt die mediale, auf die Handelnden selbst zurückwirkende Bedeutung prägnant wieder.
- source_word: ὄλεθρον
  choice: Verderben
  rationale: „Verderben“ bezeichnet schweres, vernichtendes Unheil und vermeidet eine unnötige dogmatische Festlegung.
- source_word: ἔργοις χειρῶν ὑμῶν
  choice: durch die Werke eurer Hände
  rationale: Die konkrete Bildsprache des Originals bleibt erhalten; sie kann allgemein menschliche Taten und möglicherweise auch von Menschenhand Geschaffenes anklingen lassen.
theological_decisions:
- issue: Bedeutung von ζηλόω in der Warnung vor dem Tod
  choice: Strebt nicht nach dem Tod
  alternative: Verlangt nicht nach dem Tod; Eifert nicht für den Tod
  rationale: Die gewählte Fassung vermittelt sowohl Begehren als auch aktive Hinwendung zum Tod, ohne das Verb auf einen bloßen inneren Wunsch zu beschränken oder unnatürlich wörtlich zu formulieren.
- issue: Instrumentale oder örtliche Nuance von ἐν πλάνῃ ζωῆς ὑμῶν
  choice: durch die Verirrung eures Lebens
  alternative: auf dem Irrweg eures Lebens; im Irrtum eures Lebens
  rationale: Die instrumentale Wiedergabe passt zum Zusammenhang, legt aber mit „Verirrung“ nicht abschließend fest, ob ein Irrtum, eine Täuschung oder ein fehlgeleiteter Lebensweg gemeint ist.
- issue: Reflexive Kraft von ἐπισπᾶσθε
  choice: zieht euch … Verderben zu
  alternative: bringt Verderben über euch; zieht das Verderben an
  rationale: Die Formulierung macht deutlich, dass die Angesprochenen durch ihr eigenes Tun Verderben über sich bringen, ohne darüber hinaus eine bestimmte Lehre über Ursache und Gericht einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Anrede im Plural. Die Satzstruktur bleibt eng am griechischen Parallelismus; konkrete Bildsprache und echte Bedeutungsbreite werden bewahrt.
