  source_fidelity: Die Übersetzung gibt den Folgerungsanschluss διὰ τοῦτο mit „Darum“ treffend wieder. „Niemand, der Unrechtes ausspricht, [wird] unbemerkt bleiben“ entspricht der emphatischen Verneinung οὐδεὶς μὴ λάθῃ und erhält den Sinn, dass kein solcher Redender der Wahrnehmung entgeht. „Die Gerechtigkeit, die überführt“ gibt ἐλέγχουσα ἡ δίκη sachgerecht wieder; die personifizierende Bildlichkeit und die forensisch-aufdeckende Nuance bleiben erhalten. „Wird nicht an ihm vorübergehen“ wahrt das Bild von παροδεύσῃ αὐτόν ohne Bedeutungsverlust.
