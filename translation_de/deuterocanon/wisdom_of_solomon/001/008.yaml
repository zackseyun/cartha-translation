  text: Therefore no one who speaks unrighteous things will escape notice[b][a], nor will convicting justice pass him by.
translation:
  language: de
  text: Darum wird niemand, der Unrechtes ausspricht, unbemerkt bleiben[a], und die Gerechtigkeit, die überführt, wird nicht an ihm vorübergehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Niemand, der ungerechte Dinge äußert, wird der Aufmerksamkeit entgehen.“'
    reason: lexical_alternative
  - marker: b
    text: '„Gerechtigkeit“ kann hier auch als personifiziertes Gericht verstanden werden: „Auch das Gericht wird, wenn es überführt, nicht an ihm vorübergehen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den folgernden Anschluss an den vorausgehenden Gedanken knapp und idiomatisch wieder.
- source_word: φθεγγόμενος
  choice: der … ausspricht
  rationale: Das Partizip bezeichnet die Person durch ihr Reden; „ausspricht“ wahrt den Gedanken einer hörbaren Äußerung, ohne die Art des Sprechens unnötig festzulegen.
- source_word: ἄδικα
  choice: Unrechtes
  rationale: Das substantivierte Neutrum gibt den Inhalt der Äußerungen wieder und bewahrt die moralische wie rechtliche Bedeutungsweite des Wortstamms δικ-.
- source_word: οὐδεὶς μὴ λάθῃ
  choice: wird niemand … unbemerkt bleiben
  rationale: Die emphatische Verneinung bezeichnet sicher ausbleibendes Verborgenbleiben; die deutsche Formulierung ist natürlich und erhält den Zukunftsbezug.
- source_word: οὐδὲ μὴ παροδεύσῃ αὐτόν
  choice: wird nicht an ihm vorübergehen
  rationale: Bewahrt das Bild des Vorübergehens und bringt zugleich zum Ausdruck, dass der Betreffende nicht übergangen wird.
- source_word: ἐλέγχουσα
  choice: die überführt
  rationale: Das Partizip beschreibt die Tätigkeit der Gerechtigkeit. „Überführt“ wahrt im Zusammenhang den aufdeckenden und gerichtlichen Sinn, ohne ihn auf bloße Zurechtweisung zu verengen.
- source_word: ἡ δίκη
  choice: die Gerechtigkeit
  rationale: „Gerechtigkeit“ erhält sowohl den abstrakten moralischen Sinn als auch die mögliche Personifikation; „Gericht“ oder „Strafe“ würde die Bedeutung stärker festlegen.
theological_decisions:
- issue: Moralisch-gerichtliche Spannung von ἄδικα und δίκη
  choice: „Unrechtes“ und „Gerechtigkeit“
  alternative: „ungerechte Dinge“ und „Gericht“ beziehungsweise „Strafe“
  rationale: Die gewählte Fassung hält ethisches Unrecht und gerichtliche Verantwortung zusammen, ohne δίκη vorschnell ausschließlich als Urteil, Strafe oder Vergeltung zu deuten.
- issue: Mögliche Personifikation von δίκη
  choice: Die Gerechtigkeit handelt als überführende Größe
  alternative: 'Unpersönlich: „das überführende Gericht“'
  rationale: Artikel und Partizip erlauben eine personifizierte Darstellung. Die Hauptfassung bewahrt diese Bildlichkeit, während die Fußnote die stärker forensische Deutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unrechtes ausspricht“ ist für heutige Leser verständlich und bleibt nahe am griechischen Ausdruck; die leicht bildhafte zweite Satzhälfte erhält die mögliche Personifikation der Gerechtigkeit.
