  terminology: „Unrechtes“ bewahrt die ethische und rechtliche Spannweite von ἄδικα. „Gerechtigkeit“ ist für δίκη gut gewählt, da es weder auf „Strafe“ noch ausschließlich auf ein institutionelles Gericht verengt und zugleich die mögliche Personifikation zulässt. Die Fußnoten bieten sinnvolle, nicht doktrinär festlegende Alternativen; ihre Anker sind korrekt gesetzt.
