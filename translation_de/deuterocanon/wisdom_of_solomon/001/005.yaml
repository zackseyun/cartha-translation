base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/005.yaml
  text: For a holy spirit of discipline will flee deceit[a], and it will depart from senseless thoughts[c][b], and it will be rebuked when unrighteousness comes upon it.
translation:
  language: de
  text: Denn ein heiliger Geist der Unterweisung[a] flieht vor Täuschung, zieht sich von unvernünftigen Gedanken zurück und wird überführt[b], wenn Ungerechtigkeit herantritt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Heilige Geist der Unterweisung«. Im Griechischen steht die Wendung ohne Artikel; sie kann daher qualitativ verstanden werden und muss kein feststehender Eigenname sein.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »wird zurechtgewiesen«, »wird bloßgestellt« oder »wird beschämt«. Das griechische Verb kann je nach Zusammenhang überführen, aufdecken, zurechtweisen oder beschämen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »wenn Unrecht herankommt«. Die griechische Wendung bezeichnet das Herantreten oder Herankommen der Ungerechtigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅγιον ... πνεῦμα
  choice: ein heiliger Geist
  rationale: Die artikellose griechische Wendung ist qualitativ formuliert. »Ein heiliger Geist« bewahrt dies, ohne sie vorschnell als feststehenden Eigennamen zu bestimmen.
- source_word: παιδείας
  choice: der Unterweisung
  rationale: παιδεία umfasst Unterweisung, Erziehung, Einübung und korrigierende Zucht. »Unterweisung« ist im heutigen Deutsch verständlich und wahrt den formenden Sinn, ohne unnötig strafend zu klingen.
- source_word: φεύξεται δόλον
  choice: flieht vor Täuschung
  rationale: Das Futur bezeichnet hier eine sichere künftige Reaktion. »Vor ... fliehen« gibt das anschauliche Meiden wieder; »Täuschung« deckt die Bedeutung von δόλος als Trug oder Arglist breit ab.
- source_word: ἀπαναστήσεται ἀπὸ
  choice: zieht sich ... zurück
  rationale: Das zusammengesetzte Verb bezeichnet ein Sich-Erheben und Entfernen. »Sich zurückziehen von« drückt die deutliche Trennung natürlich aus, ohne die griechische Bewegungsmetapher im Deutschen zu überzeichnen.
- source_word: λογισμῶν ἀσυνέτων
  choice: unverständigen Gedanken
  rationale: λογισμοί kann Gedanken, Überlegungen oder Erwägungen meinen; ἀσύνετοι bezeichnet mangelnde Einsicht. Die Formulierung lässt offen, ob törichte Gedanken oder gedankenlose Überlegungen im Vordergrund stehen.
- source_word: ἐλεγχθήσεται
  choice: wird überführt
  rationale: Das Passiv von ἐλέγχω kann ein Aufdecken, Überführen, Zurechtweisen oder Beschämen bezeichnen. »Wird überführt« bewahrt die passive und forensisch-prüfende Färbung, auch wenn der genaue Sinn im Zusammenhang schwierig bleibt.
- source_word: ἐπελθούσης ἀδικίας
  choice: wenn Ungerechtigkeit herantritt
  rationale: Der Genitivus absolutus bezeichnet eine begleitende Situation. »Herantritt« erhält die gerichtete Annäherung von ἐπέρχομαι; »Ungerechtigkeit« gibt ἀδικία wieder, ohne den Begriff ausschließlich auf persönliche Frömmigkeit zu verengen.
theological_decisions:
- issue: Ob ἅγιον ... πνεῦμα als feststehender Gottesname »der Heilige Geist« wiederzugeben ist
  choice: ein heiliger Geist der Unterweisung
  alternative: der Heilige Geist der Unterweisung
  rationale: Der fehlende Artikel und der weisheitliche Kontext erlauben eine qualitative Lesart. Die Übersetzung wahrt das theologische Gewicht, legt aber keine erst später fest umrissene Benennung in den Text hinein.
- issue: Wie die schwierige Passivform ἐλεγχθήσεται auf den heiligen Geist zu beziehen ist
  choice: wird überführt
  alternative: wird zurechtgewiesen / wird bloßgestellt / wird beschämt
  rationale: Der grammatische Bezug auf πνεῦμα bleibt bestehen, auch wenn die Vorstellung eines »überführten« heiligen Geistes Spannung erzeugt. Diese Spannung wird nicht durch eine freie Umschreibung beseitigt; eine Fußnote dokumentiert das Bedeutungsspektrum.
- issue: Wiedergabe von ἀδικία
  choice: Ungerechtigkeit
  alternative: Unrecht / Gottlosigkeit
  rationale: »Ungerechtigkeit« bewahrt den breiten ethischen und sozialen Gehalt des griechischen Wortes. Eine stärker religiös festgelegte Wiedergabe wie »Gottlosigkeit« wäre enger als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt den drei griechischen Zukunftsaussagen, wird aber durch natürliche deutsche Verknüpfung geglättet. »Unterweisung« vermeidet sowohl das heute leicht missverständliche »Zucht« als auch das zu pädagogisch-alltägliche »Erziehung«. Die schwierige theologische und syntaktische Spannung des letzten Satzglieds bleibt sichtbar.
