  text: For God did not make death[a], nor does he delight in the destruction of the living;
translation:
  language: de
  text: Denn Gott hat den Tod nicht gemacht[a] und hat keine Freude am Untergang der Lebenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat den Tod nicht erschaffen“. Das griechische Verb kann sowohl „machen“ als auch „erschaffen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt die erklärende beziehungsweise kausale Funktion natürlich wieder.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte und kontextgemäße Wiedergabe des griechischen Subjekts.
- source_word: θάνατον
  choice: den Tod
  rationale: Bewahrt das abstrakte Substantiv als direktes Objekt, ohne es deutend zu erweitern.
- source_word: οὐκ ἐποίησεν
  choice: hat … nicht gemacht
  rationale: Gibt ποιέω möglichst direkt wieder und vermeidet es, die Aussage unnötig auf den engeren Begriff des Erschaffens festzulegen.
- source_word: οὐδὲ
  choice: und … keine
  rationale: Verknüpft die zweite verneinte Aussage im Deutschen flüssig mit der ersten; die verstärkende Fortführung der Negation bleibt erhalten.
- source_word: τέρπεται
  choice: hat keine Freude
  rationale: Drückt das Genießen oder Gefallenhaben natürlich, würdig und mit der affektiven Stärke des griechischen Verbs aus.
- source_word: ἐπʼ ἀπωλείᾳ
  choice: am Untergang
  rationale: Untergang wahrt die Spannweite von ἀπώλεια zwischen Verderben, Vernichtung und Zugrundegehen, ohne vorschnell eine konkrete Todesart festzulegen.
- source_word: ζώντων
  choice: der Lebenden
  rationale: Gibt das substantivierte Partizip knapp und in seiner allgemeinen Reichweite wieder.
theological_decisions:
- issue: Wie ἐποίησεν in der Aussage über Gottes Verhältnis zum Tod wiederzugeben ist
  choice: hat den Tod nicht gemacht
  alternative: hat den Tod nicht erschaffen
  rationale: „Gemacht“ entspricht dem breiten Bedeutungsumfang von ποιέω und lässt die genaue metaphysische Tragweite der Aussage offen; „erschaffen“ wäre möglich, würde sie aber stärker als ausdrückliche Schöpfungsaussage bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzverknüpfung „Denn“ wahrt den Bezug zum vorherigen Kontext; „Untergang der Lebenden“ erhält die allgemeine und theologisch spannungsreiche Formulierung des Griechischen.
