  text: because he is found by those who do not test him[b][a], and he reveals himself to those who do not distrust him.
translation:
  language: de
  text: Denn er wird von denen gefunden, die ihn nicht auf die Probe stellen[a], und er zeigt sich denen, die ihm nicht misstrauen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn nicht prüfen“. Das griechische Verb kann in anderen Zusammenhängen auch „versuchen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihm nicht ungläubig begegnen“, „ihm nicht den Glauben verweigern“ oder „ihm nicht untreu sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung. „Denn“ stellt diesen Zusammenhang im Deutschen klar her und eignet sich besser als ein isoliertes „weil“ für den Versanfang.
- source_word: εὑρίσκεται
  choice: wird … gefunden
  rationale: Die passive Form wird unmittelbar wiedergegeben, ohne durch „lässt sich finden“ eine zusätzliche willentliche Nuance einzutragen.
- source_word: τοῖς μὴ πειράζουσιν αὐτόν
  choice: von denen, die ihn nicht auf die Probe stellen
  rationale: πειράζω kann „prüfen“, „auf die Probe stellen“ oder kontextabhängig „versuchen“ bedeuten. Bei Gott als Objekt bringt „auf die Probe stellen“ den Gedanken skeptischen oder herausfordernden Prüfens natürlich zum Ausdruck, ohne die stärkere Bedeutung „versuchen“ festzuschreiben.
- source_word: ἐμφανίζεται
  choice: zeigt sich
  rationale: Die Wiedergabe bewahrt den medialen Sinn des Sichtbar- oder Offenbarwerdens und klingt in modernem Deutsch natürlich, ohne den Ausdruck vorschnell zum theologischen Fachwort „offenbart sich“ zu verengen.
- source_word: τοῖς μὴ ἀπιστοῦσιν αὐτῷ
  choice: denen, die ihm nicht misstrauen
  rationale: ἀπιστέω mit Dativ kann Unglauben, fehlendes Vertrauen oder Untreue bezeichnen. „Ihm nicht misstrauen“ erhält hier die relationale Ausrichtung auf Gott und bleibt idiomatisch.
theological_decisions:
- issue: Relationale oder erkenntnismäßige Nuance von ἀπιστοῦσιν αὐτῷ
  choice: die ihm nicht misstrauen
  alternative: die nicht an ihn glauben; die ihm nicht glauben; die ihm gegenüber nicht ungläubig sind
  rationale: „Misstrauen“ beschreibt die innere Haltung gegenüber Gott, ohne den Ausdruck auf rein intellektuellen Unglauben zu reduzieren. Die Fußnote hält die weiteren möglichen Glaubensnuancen offen.
- issue: Gottes Gefundenwerden und Sichzeigen
  choice: passiv „wird … gefunden“ und medial „zeigt sich“
  alternative: „lässt sich finden“ und „offenbart sich“
  rationale: Die Formulierungen folgen den griechischen Verbformen und vermeiden es, die Aussage stärker als ausdrücklichen göttlichen Willensakt oder als fachtheologische Offenbarungsaussage auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau des griechischen Textes bleibt sichtbar; Fachsprache und konfessionell geprägte Zusätze werden vermieden.
