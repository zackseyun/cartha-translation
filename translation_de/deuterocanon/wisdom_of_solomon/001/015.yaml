lexical_decisions:
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: Das Substantiv bezeichnet sowohl moralische Rechtschaffenheit als auch Gerechtigkeit im Sinn gerechten Handelns. »Gerechtigkeit« bewahrt im Deutschen die ethische und theologische Weite des griechischen Ausdrucks am besten.
- source_word: γάρ
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage; »denn« ist knapp, natürlich und dem gehobenen Ton angemessen.
- source_word: ἀθάνατος
  choice: unsterblich
  rationale: Das Adjektiv bedeutet, dass etwas dem Tod nicht unterworfen ist. »Unsterblich« gibt die pointierte Aussage unmittelbar wieder.
- source_word: ἐστιν
  choice: ist
  rationale: Schlichte Kopula; eine Erweiterung ist nicht erforderlich.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der griechische Begriff umfasst sowohl gerechtes Handeln und Gerechtigkeit als auch persönliche moralische Rechtschaffenheit. Der Haupttext verwendet den weiteren und im Deutschen geläufigen Begriff, während die Fußnote die persönliche ethische Nuance offenhält.
translation_notes:
  register: Kurzer, würdevoller und aphoristischer Satz in modernem Standarddeutsch. Die Wortstellung folgt natürlichem deutschem Sprachgebrauch und bewahrt die begründende Funktion von γάρ.
