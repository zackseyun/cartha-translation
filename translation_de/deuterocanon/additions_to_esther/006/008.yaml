  text: And these two lots came at the hour and appointed time[a], and at the day of judgment before God and all the nations,
translation:
  language: de
  text: Und diese beiden Lose kamen zur Stunde und zur bestimmten Zeit[a], zum Tag des Gerichts vor Gott und allen Völkern,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Stunde und zur passenden Zeit“. Das griechische Wort kann einen passenden oder festgesetzten Zeitpunkt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δύο κλῆροι οὗτοι
  choice: diese beiden Lose
  rationale: „Lose“ bewahrt das konkrete Bild von etwas, das durch das Los zugeteilt wird; eine übertragene Bedeutung wie „Schicksale“ bleibt möglich, wird aber nicht in den Haupttext eingetragen.
- source_word: ἦλθον
  choice: kamen
  rationale: Die schlichte Wiedergabe von ἔρχομαι vermeidet es, mit „fielen“ eine im Verb selbst nicht enthaltene Loshandlung einzutragen.
- source_word: εἰς ὥραν καὶ καιρόν
  choice: zur Stunde und zum bestimmten Zeitpunkt
  rationale: Die Formulierung wahrt die beiden Zeitbegriffe; „bestimmt“ bringt bei καιρός den passenden oder festgesetzten Zeitpunkt zum Ausdruck.
- source_word: εἰς ἡμέραν κρίσεως
  choice: zum Tag des Gerichts
  rationale: κρίσις bezeichnet hier Gericht beziehungsweise richterliche Entscheidung; die Zielrichtung von εἰς wird mit „zum“ knapp wiedergegeben.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: „Vor“ bewahrt den feierlichen, möglicherweise gerichtlichen Sinn von ἐνώπιον.
- source_word: καὶ πᾶσι τοῖς ἔθνεσιν
  choice: und allen Völkern
  rationale: Der Dativ wird parallel zu „vor Gott“ verstanden. Das einmal gesetzte „vor“ kann im Deutschen beide Glieder regieren, ohne ein zweites Mal ergänzt zu werden.
theological_decisions:
- issue: Bedeutung von κλῆροι im Zusammenhang
  choice: wörtlich „Lose“, mit unausgesprochener möglicher Bildbedeutung
  alternative: „Schicksale“ oder „Losanteile“
  rationale: Der Zusammenhang kann eine symbolische Bedeutung nahelegen, doch der griechische Text verwendet das konkrete Loswort. Die Übersetzung bewahrt daher das Bild und löst die theologische Spannung nicht interpretierend auf.
- issue: Bezug von ἐνώπιον auf Gott und alle Völker
  choice: „vor“ regiert beide koordinierten Glieder
  alternative: „vor Gott und vor allen Völkern“
  rationale: Im Griechischen steht ἐνώπιον nur einmal. Die knappe deutsche Fassung bildet diese Struktur nach und lässt „vor“ natürlich sowohl auf Gott als auch auf alle Völker bezogen sein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Reihung der Zeitangaben und das konkrete Losbild bleiben erhalten. Das abschließende Komma folgt dem als Satzsegment überlieferten Vers.
