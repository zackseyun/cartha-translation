  text: For I remembered the dream that I saw concerning these matters[a], for not a word of them has passed by.
translation:
  language: de
  text: Denn ich erinnerte mich an den Traum, den ich über diese Dinge gesehen hatte; denn nichts davon ist unbeachtet geblieben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Denn kein Wort davon ist vorübergegangen.“ Die knappe Wendung kann auch bedeuten: „Denn nichts davon ist unerfüllt geblieben.“'
    reason: Die Fußnote dokumentiert die ungewöhnlich verdichtete griechische Formulierung und ihre mögliche erfüllungsbezogene Bedeutung, ohne diese im Haupttext als alleinige Deutung festzulegen.
lexical_decisions:
- source_word: ἐμνήσθην
  choice: ich erinnerte mich
  rationale: Die deponentisch gebrauchte Aoristform hat aktive Bedeutung. „Ich erinnerte mich“ ist im Deutschen natürlich und gibt den Rückblick auf den früheren Traum genau wieder.
- source_word: ἐνυπνίου
  choice: Traum
  rationale: Das Substantiv bezeichnet schlicht einen Traum; ein Zusatz wie „Traumgesicht“ würde den Ausdruck unnötig ausdeuten.
- source_word: περὶ τῶν λόγων τούτων
  choice: über diese Ereignisse
  rationale: λόγοι kann hier nicht nur „Worte“, sondern auch „Dinge“, „Angelegenheiten“ oder „Ereignisse“ bezeichnen. Im Zusammenhang sind die im Traum vorweggenommenen Geschehnisse gemeint.
- source_word: οὐδὲ ... παρῆλθεν
  choice: kein ... ist vergangen
  rationale: Die Wiedergabe bleibt nahe bei der Grundbedeutung „vorübergehen/vergehen“ und vermeidet es, die knappe griechische Wendung im Haupttext eindeutig als Erfüllungsaussage festzulegen.
- source_word: ἀπ’ αὐτῶν λόγος
  choice: kein Wort davon
  rationale: Nach der Verneinung bezeichnet der Singular λόγος auch den kleinsten einzelnen Bestandteil. „Kein Wort davon“ bewahrt zugleich das Wortbild und die gedrängte Formulierung des Griechischen.
theological_decisions:
- issue: Bedeutung von οὐδὲ γὰρ παρῆλθεν ἀπ’ αὐτῶν λόγος
  choice: Die knappe Rede vom Vergehen eines Wortes bleibt im Haupttext erhalten.
  alternative: „Denn nichts davon ist unerfüllt geblieben.“
  rationale: Die Wendung kann besagen, dass nichts aus dem Traum ausblieb oder unerfüllt blieb. Da das Griechische dies jedoch nicht ausdrücklich mit einem Verb für „erfüllen“ sagt, wird diese wahrscheinlich gemeinte Aussage in der Fußnote erläutert, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „denn“ folgt der griechischen Begründungsstruktur; „einen Traum sehen“ bewahrt bewusst das Bild des Ausgangstextes.
