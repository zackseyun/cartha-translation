translation:
  language: de
  text: Die beiden Drachen aber sind ich und Haman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die beiden Schlangen aber sind ich und Haman.“ Das griechische Wort δράκοντες kann Drachen oder Schlangen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... δύο δράκοντες
  choice: die beiden Drachen
  rationale: δράκοντες bezeichnet Drachen oder große Schlangen. „Drachen“ bewahrt die eindrückliche Bildsprache des Traums; die ebenfalls mögliche Wiedergabe „Schlangen“ wird in der Fußnote genannt.
- source_word: ἐγώ εἰμι
  choice: sind ich
  rationale: Das betonte ἐγώ mit εἰμι lautet wörtlich „ich bin“. Wegen des vorangestellten pluralischen Subjekts „die beiden Drachen“ und der anschließenden Zuordnung zu zwei Personen ist „sind ich und Haman“ im Deutschen die passende identifizierende Konstruktion.
- source_word: Ἁμάν
  choice: Haman
  rationale: Der Eigenname wird gemäß der üblichen deutschen biblischen Namensform wiedergegeben.
- source_word: δέ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten Übergang in der Erklärung des Traums. „Aber“ gibt diese weiterführende, leicht absetzende Funktion wieder.
theological_decisions:
- issue: Symbolische Identifizierung in der Traumdeutung
  choice: Die beiden Drachen werden unmittelbar mit dem Sprecher („ich“, also Mordechai im Kontext) und Haman gleichgesetzt.
  alternative: Die beiden Schlangen sind ich und Haman.
  rationale: Der griechische Text formuliert eine direkte Identifizierung, ohne eine darüber hinausgehende Deutung zu liefern. Die lexikalische Spannung zwischen „Drachen“ und „Schlangen“ bleibt durch die Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Formulierung „sind ich und Haman“ bewahrt die direkte symbolische Gleichsetzung und den Numerus des griechischen Satzes.
