base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/006.yaml
  text: But my people—that is[a], Israel—are those who cried out to God and were saved. And the Lord saved his people, and the Lord rescued us from all these evils, and God did the signs and the great wonders that have not happened among the nations.
translation:
  language: de
  text: Doch mein Volk – das ist Israel – sind die, die Gott um Hilfe baten[a] und gerettet wurden. Und der Herr rettete sein Volk, und der Herr befreite uns aus all diesen Übeln. Und Gott vollbrachte die Zeichen und die großen Wunder, wie sie unter den Völkern noch nie geschehen sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die bei Gott Hilfe suchten“ oder „die zu Gott um Hilfe riefen“. Die griechische Formulierung ist ungewöhnlich; im Zusammenhang geht es darum, dass Israel sich hilfesuchend an Gott wandte und gerettet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἔθνος τὸ ἐμόν
  choice: mein Volk
  rationale: Obwohl ἔθνος häufig „Volk“ oder „Nation“ bedeutet, bezeichnet es hier die eigene Volksgemeinschaft des Sprechers, die unmittelbar mit Israel identifiziert wird. „Mein Volk“ ist im Deutschen natürlich und vermeidet die moderne staatspolitische Nebenbedeutung von „Nation“.
- source_word: οὗτός ἐστιν Ἰσραήλ
  choice: das ist Israel
  rationale: Die schlichte Identifikationsformulierung erhält die Hervorhebung des griechischen Textes.
- source_word: οἱ βοηθήσαντες πρὸς τὸν θεόν
  choice: die Gott um Hilfe baten
  rationale: Die griechische Verbindung ist ungewöhnlich. Im Zusammenhang mit σωθέντες bezeichnet sie am ehesten die Hinwendung an Gott mit der Bitte um Hilfe, nicht eine Hilfeleistung für Gott.
- source_word: σωθέντες / ἔσωσεν
  choice: gerettet wurden / rettete
  rationale: Die gemeinsame Wortwurzel wird durch die Wiederholung von „retten“ sichtbar gehalten.
- source_word: ἐρρύσατο
  choice: befreite ... aus
  rationale: „Befreien aus“ unterscheidet das Verb von σῴζω und gibt die Herausrettung aus einer Bedrohung idiomatisch wieder.
- source_word: τῶν κακῶν τούτων
  choice: all diesen Übeln
  rationale: „Übel“ bewahrt die Bedeutungsbreite von κακά zwischen bösen Dingen, Nöten und Unheil.
- source_word: σημεῖα καὶ τὰ τέρατα τὰ μεγάλα
  choice: die Zeichen und die großen Wunder
  rationale: Die traditionelle und verständliche Wortpaarung bildet beide griechischen Begriffe ab und bewahrt die Verstärkung durch μεγάλα.
- source_word: ἃ οὐ γέγονεν ἐν τοῖς ἔθνεσιν
  choice: wie sie unter den Völkern noch nie geschehen sind
  rationale: Diese natürliche deutsche Formulierung bewahrt den Bezug zu den Zeichen und Wundern, die räumlich-soziale Wendung „unter den Völkern“ und die Aussage ihrer beispiellosen Art.
- source_word: κύριος
  choice: der Herr
  rationale: Der griechische Ausgangstext bietet κύριος; daher wird „der Herr“ verwendet, ohne typografisch den hebräischen Gottesnamen zu suggerieren.
theological_decisions:
- issue: Deutung von βοηθήσαντες πρὸς τὸν θεόν
  choice: Israel bat Gott um Hilfe.
  alternative: 'Israel rief zu Gott; Israel suchte Hilfe bei Gott; wörtlich missverständlich: Israel half Gott.'
  rationale: Die ungewöhnliche Konstruktion bleibt durch eine Fußnote kenntlich, wird im Haupttext aber gemäß dem Rettungszusammenhang als Hilferuf beziehungsweise Bitte an Gott wiedergegeben. Eine Aussage, Israel habe Gott geholfen, würde den Kontext verfehlen.
- issue: Verhältnis der wiederholten Rettungsbegriffe
  choice: „gerettet/rettete“ für σῴζω und „befreite ... aus“ für ῥύομαι
  alternative: „gerettet ... entriss“ oder „befreit ... rettete“
  rationale: Die lexikalische Verbindung innerhalb von σῴζω bleibt sichtbar, während der zweite griechische Rettungsbegriff unterscheidbar wiedergegeben wird.
- issue: Aussage über die Einzigartigkeit der Zeichen und Wunder
  choice: „wie sie unter den Völkern noch nie geschehen sind“
  alternative: „die unter den Völkern nicht geschehen sind“
  rationale: Die Formulierung wahrt die starke Aussage des griechischen Perfekts und bezieht den Relativsatz natürlich auf die Zeichen und Wunder, ohne deren genaue Art näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Die Satzwiederholung „Und der Herr ... und der Herr ...“ bleibt als rhetorisches Merkmal des Ausgangstextes erhalten; der abschließende Satz wird im Deutschen durch einen Punkt klar gegliedert.
