- from: Im vierten Regierungsjahr des Ptolemäus und der Kleopatra brachte Dositheus, der sagte, er sei Priester und Levit, zusammen mit seinem Sohn Ptolemäus den hier vorliegenden Brief über das Purimfest[a]. Sie sagten, dieser sei auch vorhanden und von Lysimachus, dem Sohn des Ptolemäus, einem von denen in Jerusalem, übersetzt worden.[b]
  to: Im vierten Regierungsjahr des Ptolemäus und der Kleopatra brachten Dositheus, der sagte, er sei Priester und Levit, und sein Sohn Ptolemäus den hier vorliegenden Brief über das Purimfest[a], von dem sie sagten, er sei auch vorhanden und von Lysimachus, dem Sohn des Ptolemäus, einem von den Leuten in Jerusalem, übersetzt worden.[b]
  rationale: Die Revision bewahrt die durch καί ausgedrückte koordinierte Rolle von Dositheus und seinem Sohn und fasst die Relativsatzkonstruktion wieder als eine zusammenhängende Aussage. Die Fußnote dokumentiert die griechische Lesart präzise. Der Sinn der Passage und ihre bestehenden, sachlich vertretbaren Übersetzungsentscheidungen bleiben unverändert.
