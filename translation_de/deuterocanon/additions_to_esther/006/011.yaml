base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/011.yaml
  text: In the fourth year of the reign of Ptolemy and Cleopatra[a], Dositheus, who said that he was a priest and a Levite, and Ptolemy his son, brought in the following letter of the Purim festival, which they said also existed and had been translated by Lysimachus son of Ptolemy[b], one of those in Jerusalem.
translation:
  language: de
  text: Im vierten Regierungsjahr des Ptolemäus und der Kleopatra brachten Dositheus, der sagte, er sei Priester und Levit, und sein Sohn Ptolemäus den hier vorliegenden Brief über das Purimfest[a], von dem sie sagten, er sei auch vorhanden und von Lysimachus, dem Sohn des Ptolemäus, einem von den Leuten in Jerusalem, übersetzt worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „τῶν Φρουραίων“ (Phrouraia), die hier verwendete griechische Bezeichnung für das jüdische Purimfest.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von dem sie sagten, er liege auch vor und sei von Lysimachus, dem Sohn des Ptolemäus, übersetzt worden.“ Die knappe griechische Formulierung kann eher das Vorhandensein oder die Verfügbarkeit des Dokuments als seine Echtheit hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους τετάρτου Βασιλεύοντος Πτολεμαίου καὶ Κλεοπάτρας
  choice: Im vierten Regierungsjahr des Ptolemäus und der Kleopatra
  rationale: Gibt die griechische Datierungsformel knapp, natürlich und in gehobenem modernem Deutsch wieder.
- source_word: εἰσήνεγκεν
  choice: brachte ... den ... Brief
  rationale: Bewahrt den Grundsinn des formellen Einbringens eines Dokuments, ohne einen nicht ausdrücklich genannten Verwaltungsakt vorauszusetzen.
- source_word: ὃς ἔφη εἶναι ἱερεὺς καὶ Λευείτης
  choice: der sagte, er sei Priester und Levit
  rationale: Gibt ἔφη neutral wieder und bewahrt die ausdrückliche Koordination beider Bezeichnungen.
- source_word: τὴν προκειμένην ἐπιστολὴν
  choice: den hier vorliegenden Brief
  rationale: προκειμένην verweist auf das dem Leser vorgelegte Dokument; diese Formulierung passt besser als „folgenden“ zu einem abschließenden Kolophon.
- source_word: τῶν Φρουραίων
  choice: über das Purimfest
  rationale: Macht den gemeinten jüdischen Festnamen verständlich; die griechische Bezeichnung wird in der Fußnote dokumentiert.
- source_word: ἣν ἔφασαν εἶναι
  choice: Sie sagten, dieser sei auch vorhanden
  rationale: Bewahrt die knappe und mehrdeutige Existenz- beziehungsweise Verfügbarkeitsaussage, ohne daraus ausdrücklich eine Echtheitsbehauptung zu machen.
- source_word: καὶ ἑρμηνευκέναι
  choice: und ... übersetzt worden
  rationale: Im dokumentarischen Zusammenhang ist „übersetzen“ der naheliegende Sinn von ἑρμηνεύω.
- source_word: Λυσίμαχον Πτολεμαίου τῶν ἐν Ἰερουσαλήμ
  choice: von Lysimachus, dem Sohn des Ptolemäus, einem von denen in Jerusalem
  rationale: Versteht den Genitiv Πτολεμαίου als Abstammungsangabe und bewahrt die ungewöhnliche, aber klare Wendung „von denen in Jerusalem“.
theological_decisions:
- issue: Neutrale Aussage oder skeptischer Unterton in ὃς ἔφη εἶναι
  choice: der sagte, er sei
  alternative: der behauptete, er sei
  rationale: Das Verb kann neutral oder leicht distanzierend wirken. Der Haupttext vermeidet es, einen Zweifel an Dositheus’ Selbstauskunft einzutragen, den der griechische Text nicht eindeutig ausdrückt.
- issue: Bedeutung von τῶν Φρουραίων
  choice: über das Purimfest
  alternative: der Phrouraia
  rationale: Die verständliche Bezeichnung des Festes steht im Haupttext; die griechische Benennung bleibt in der Fußnote sichtbar.
- issue: Sinn von ἣν ἔφασαν εἶναι
  choice: dieser sei auch vorhanden
  alternative: dieser sei echt
  rationale: Das knappe εἶναι kann die Existenz oder Verfügbarkeit des Dokuments hervorheben. „Echt“ würde eine nicht eindeutig ausgesprochene Authentizitätsbehauptung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Datierungsformel bleibt formal; der kolophonartige Charakter wird durch „hier vorliegenden Brief“ gewahrt. Ungewöhnliche Angaben wie „Priester und Levit“ werden nicht harmonisiert.
