  text: And Mordecai said[a], “These things have come from God.”
translation:
  language: de
  text: 'Und Mordechai sagte: »All dies ist von Gott gekommen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »All dies ist von Gott her geschehen.«'
    reason: Bewahrt für γίνομαι ausdrücklich die Bedeutung »geschehen«, während παρά mit Genitiv weiterhin den Ursprung bezeichnet.
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: εἶπεν
  choice: sagte
  rationale: Die übliche und natürliche Wiedergabe des Aorists von λέγω in einer Redeeinleitung.
- source_word: Μαρδοχαῖος
  choice: Mordechai
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: Παρὰ τοῦ θεοῦ
  choice: von Gott
  rationale: παρά mit Genitiv bezeichnet hier Quelle oder Ursprung; die Formulierung schreibt das Geschehen Gott zu, ohne die Art der Verursachung näher festzulegen.
- source_word: ἐγένετο
  choice: ist … gekommen
  rationale: γίνομαι kann ein Eintreten oder Geschehen bezeichnen. In Verbindung mit »von Gott« gibt »ist … gekommen« den Gedanken des Ursprungs idiomatisch wieder.
- source_word: ταῦτα
  choice: all dies
  rationale: Das neutrale Pluralpronomen verweist zusammenfassend auf die betreffenden Vorgänge. »All dies« ist im modernen Deutschen natürlicher als das formal nähere »diese Dinge«, ohne den umfassenden Rückbezug aufzulösen.
theological_decisions:
- issue: Göttlicher Ursprung beziehungsweise göttliche Verursachung in παρά mit Genitiv
  choice: All dies ist von Gott gekommen
  alternative: All dies ist durch Gott geschehen
  rationale: Die gewählte Fassung benennt Gott als Ursprung der Ereignisse, legt aber keinen genaueren Mechanismus göttlicher Verursachung fest. Die Alternative könnte stärker eine unmittelbare Wirkursache ausdrücken, als der griechische Wortlaut verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. Die direkte Rede bleibt nahe an der griechischen Satzstruktur, wird jedoch idiomatisch formuliert.
