  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes angemessen wieder: Καὶ als »Und«, εἶπεν als »sagte«, Μαρδοχαῖος als »Mordechai«, ταῦτα als zusammenfassendes »All dies«, ἐγένετο als Perfektumschreibung des eingetretenen Geschehens und παρὰ τοῦ θεοῦ als Herkunfts-/Ursprungsangabe »von Gott«. Die deutsche Wortstellung ist idiomatisch und ohne Sinnverlust.'
  naturalness: '»Und Mordechai sagte: ›All dies ist von Gott gekommen.‹« ist modernes, verständliches Standarddeutsch mit einem passenden knappen Erzählregister. »Von Gott gekommen« ist hier natürlich genug und wahrt die im Griechischen ausgedrückte Herkunft, ohne den Vorgang dogmatisch zu präzisieren.'
