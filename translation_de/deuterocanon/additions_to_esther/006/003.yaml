  text: The little spring that became a river was Esther, whom the king married and made queen; and there was light and sun and abundant water.
translation:
  language: de
  text: Die kleine Quelle, die zu einem Fluss wurde – und es gab Licht, Sonne und viel Wasser –, ist Ester, die der König heiratete und zur Königin machte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ μικρὰ πηγή
  choice: die kleine Quelle
  rationale: „Quelle“ bezeichnet im Deutschen natürlich den Ursprung eines Wasserlaufs und bewahrt das Bild der zunächst kleinen Wasserquelle.
- source_word: ἡ ἐγένετο ποταμός
  choice: die zu einem Strom wurde
  rationale: „Strom“ gibt ποταμός als größeren Fluss wieder und lässt die Entwicklung aus der kleinen Quelle deutlich hervortreten.
- source_word: φῶς καὶ ἥλιος καὶ ὕδωρ πολύ
  choice: Licht, Sonne und viel Wasser
  rationale: Die drei Bildelemente werden ohne allegorische Ausdeutung direkt wiedergegeben; „viel Wasser“ entspricht der schlichten quantitativen Aussage des Griechischen.
- source_word: Ἐσθήρ ἐστιν ὁ ποταμός
  choice: Ester ist der Strom
  rationale: Die ausdrückliche Identifikation und das Präsens ἐστιν werden formal und verständlich bewahrt.
- source_word: ἣν ἐγάμησεν ὁ βασιλεύς
  choice: sie wurde vom König geheiratet
  rationale: Die passive Formulierung fügt sich an „Ester ist der Strom“ an und bewahrt eindeutig Ester als die Frau, die der König heiratete.
- source_word: ἐποίησεν βασίλισσαν
  choice: zur Königin gemacht
  rationale: Die Konstruktion mit prädikativem Akkusativ bezeichnet, dass der König ihr die Stellung als Königin gab.
theological_decisions:
- issue: Reihenfolge und Aussagekraft der Deutung des Traumbildes
  choice: Die Bildfolge wird in der Reihenfolge des griechischen Textes wiedergegeben; anschließend wird Ester ausdrücklich mit dem Strom identifiziert.
  alternative: Die kleine Quelle, die zu einem Strom wurde, war Ester, die der König heiratete und zur Königin machte; und da waren Licht, Sonne und viel Wasser.
  rationale: Die gewählte Fassung bewahrt sowohl die auffällige Gliederung als auch das Präsens der ausdrücklichen Identifikation, ohne die Traumsymbolik über den Quelltext hinaus auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht die im Griechischen lockere, bildhafte Satzfügung lesbar, ohne die Reihenfolge umzustellen. „Ester“ folgt der heute üblichen deutschen Namensform.
