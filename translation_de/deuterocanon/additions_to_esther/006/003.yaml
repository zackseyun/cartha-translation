  source_fidelity: Die ausdrückliche Identifikation Ἐσθήρ ἐστιν ὁ ποταμός sollte als Prädikation der gesamten vorangehenden Bildbeschreibung erkennbar bleiben. Die vorliegende Fassung trennt diese Beschreibung durch einen Punkt ab und lässt den ersten Satz syntaktisch unvollständig zurück. Außerdem ist der König im Griechischen Subjekt sowohl von „heiratete“ als auch von „machte“.
  naturalness: „Sie wurde vom König geheiratet“ ist zwar verständlich, wirkt im modernen Standarddeutsch aber unnötig passiv und weniger idiomatisch als „die der König heiratete“. Die umschließende Gedankenstrichkonstruktion bildet die lockere Einfügung von „und es gab Licht …“ lesbar ab, ohne die griechische Reihenfolge zu verändern.
  terminology: „Fluss“ ist für ποταμός im Deutschen die unmarkierte, natürliche Entsprechung; „Strom“ bezeichnet häufiger einen besonders großen Fluss. „Ester“ und „Königin“ sind angemessen. Es sind keine Fußnoten erforderlich.
