  text: And God remembered his people[a], and vindicated his inheritance.
translation:
  language: de
  text: Und Gott erinnerte sich an sein Volk und verschaffte seinem Erbteil Recht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rechtfertigte sein Erbteil“ oder „erwies seinem Erbteil Gerechtigkeit“. Das griechische Verb kann rechtfertigen, als gerecht erweisen oder Recht verschaffen bedeuten; hier bezieht es sich kollektiv auf Gottes Eintreten für sein Volk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: erinnerte sich an
  rationale: Die deponentische Form bedeutet im biblischen Griechisch gewöhnlich „sich erinnern“. Die Formulierung bewahrt die biblische Redeweise, die hier ein daraus folgendes günstiges Handeln Gottes einschließen kann, ohne dieses ausdrücklich in den Text einzutragen.
- source_word: ὁ θεός
  choice: Gott
  rationale: Die übliche und sachlich entsprechende Wiedergabe von θεός.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: sein Volk
  rationale: λαός bezeichnet im biblischen Sprachgebrauch häufig Gottes Bundesvolk; „sein Volk“ ist im Deutschen natürlich und kontextgemäß.
- source_word: ἐδικαίωσεν
  choice: verschaffte … Recht
  rationale: δικαιόω trägt hier gegenüber dem kollektiven Objekt einen rechtlichen und vindizierenden Sinn. „Recht verschaffen“ gibt Gottes öffentliches Eintreten für sein Volk wieder, ohne die Stelle vorschnell mit der paulinischen Rechtfertigungsterminologie zu verbinden.
- source_word: τὴν κληρονομίαν ἑαυτοῦ
  choice: seinem Erbteil
  rationale: κληρονομία bezeichnet Erbe, Erbteil oder Besitz. „Sein Erbteil“ bewahrt das biblische Bundesbild für Gottes Volk und bleibt eng am Griechischen.
theological_decisions:
- issue: Wiedergabe von ἐδικαίωσεν in einem korporativen Rettungszusammenhang
  choice: verschaffte seinem Erbteil Recht
  alternative: rechtfertigte sein Erbteil; erwies sein Erbteil als gerecht
  rationale: Die Formulierung erhält die forensische beziehungsweise vindizierende Kraft des Verbs, deutet sie hier aber als Gottes Eintreten für und Wiederherstellung seines Volkes. Sie vermeidet zugleich, eine spätere dogmatische Bedeutung von „rechtfertigen“ unbemerkt einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe parataktische Struktur des Griechischen bleibt erhalten; die biblische Metapher „Erbteil“ wird nicht aufgelöst.
