base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/010.yaml
  text: And these days shall be for them in the month of Adar[a], on the fourteenth and on the fifteenth of the same month, with assembly and joy and gladness before God[b], throughout the generations forever among his people Israel.
translation:
  language: de
  text: Und diese Tage sollen für sie im Monat Adar, am vierzehnten und am fünfzehnten Tag desselben Monats, Tage mit Versammlung[a], Freude und Jubel vor Gott[b] sein, von Generation zu Generation, für immer, unter seinem Volk Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Zusammenkommen“ beziehungsweise „mit Festversammlung“. Das griechische Wort bezeichnet hier eine gemeinschaftliche Versammlung, nicht eigens ein Synagogengebäude.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der Gegenwart Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: sollen … sein
  rationale: Das Futur steht in einem festlich-verbindlichen Kontext. „Sollen … sein“ bewahrt den anordnenden Ton und klingt im modernen Deutschen natürlicher als ein bloßes „werden sein“.
- source_word: αἱ ἡμέραι αὗται
  choice: diese Tage
  rationale: Direkte und natürliche Wiedergabe der Demonstrativphrase.
- source_word: ἐν μηνὶ Ἀδάρ
  choice: im Monat Adar
  rationale: Der jüdische Monatsname wird transliteriert und die Zeitangabe idiomatisch wiedergegeben.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ καὶ τῇ πεντεκαιδεκάτῃ τοῦ αὐτοῦ μηνός
  choice: am vierzehnten und am fünfzehnten Tag desselben Monats
  rationale: Die ausgeschriebenen Ordinalzahlen und „Tag“ machen den kalendarischen Bezug im Deutschen eindeutig; „desselben Monats“ bewahrt den Rückverweis.
- source_word: μετὰ συναγωγῆς
  choice: Tage der Versammlung
  rationale: συναγωγή bezeichnet hier das gemeinschaftliche Zusammenkommen, nicht ein Synagogengebäude. Die syntaktische Einfügung als „Tage der …“ ergibt einen klaren deutschen Satz, ohne den Sinn zu verändern.
- source_word: χαρᾶς καὶ εὐφροσύνης
  choice: der Freude und des Jubels
  rationale: „Freude“ gibt χαρά schlicht wieder; „Jubel“ unterscheidet εὐφροσύνη davon und vermittelt dessen festlich-frohen Charakter.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Formale und zugleich idiomatische Wiedergabe, die die ausdrücklich auf Gott bezogene Feier bewahrt.
- source_word: εἰς γενεὰς εἰς τὸν αἰῶνα
  choice: von Generation zu Generation, für immer
  rationale: Die Formulierung erhält sowohl die Abfolge der Generationen als auch die verstärkende Aussage unbegrenzter Dauer.
- source_word: ἐν τῷ λαῷ αὐτοῦ Ἰσραήλ
  choice: in seinem Volk Israel
  rationale: Die Wiedergabe bleibt nahe an ἐν und bewahrt die Zuordnung Israels als Gottes Volk.
theological_decisions:
- issue: Die ausdrückliche Gottesbezogenheit der Festfeier
  choice: vor Gott
  alternative: in der Gegenwart Gottes
  rationale: θεοῦ steht ausdrücklich im griechischen Text. „Vor Gott“ bewahrt diese Orientierung knapp und ohne sie zu einer bloß gesellschaftlichen Feier abzuschwächen.
- issue: Die Dauerformel εἰς γενεὰς εἰς τὸν αἰῶνα
  choice: von Generation zu Generation, für immer
  alternative: für alle Generationen auf ewig
  rationale: Die gewählte Fassung bewahrt beide Elemente der griechischen Wendung und lässt ihre starke, dauerhafte Geltung stehen, ohne sie näher dogmatisch zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit festlich-verbindlichem Ton. Die Satzstellung wurde für natürliche Lesbarkeit leicht umgeformt. Die beiden Freudenbegriffe sowie die doppelte Dauerformel bleiben unterscheidbar; „Versammlung“ wird durch eine Fußnote gegen das Missverständnis eines Gebäudes abgesichert.
