lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Deshalb
  rationale: Gibt den kausal-folgernden Zusammenhang knapp und natürlich wieder.
- source_word: ἐποίησεν
  choice: machte
  rationale: Bewahrt die allgemeine Bedeutung von ποιέω, ohne das spezifischere ‚warf‘ oder ‚zog‘ in den Text einzutragen.
- source_word: κλήρους δύο
  choice: zwei Lose
  rationale: κλῆρος bezeichnet hier Lose, die einer Entscheidung oder Zuteilung dienen; die Zweizahl strukturiert den Gegensatz ausdrücklich.
- source_word: ἕνα τῷ λαῷ τοῦ θεοῦ
  choice: eines für das Volk Gottes
  rationale: Entspricht der griechischen Konstruktion und ist im Deutschen klar und idiomatisch.
- source_word: ἕνα πᾶσι τοῖς ἔθνεσιν
  choice: eines für alle Völker
  rationale: ‚Völker‘ bewahrt den breiten Wortsinn von ἔθνη und lässt zugleich den im Kontext bestehenden Gegensatz zum Volk Gottes erkennen.
theological_decisions:
- issue: Wiedergabe von ἔθνεσιν im Gegensatz zum Volk Gottes
  choice: alle Völker
  alternative: alle Heidenvölker
  rationale: Die Haupttextfassung bewahrt den allgemeinen lexikalischen Sinn und legt die ethnisch-religiöse Abgrenzung nicht enger fest, als es der griechische Ausdruck verlangt. Die kontextuell mögliche Bedeutung ‚Heidenvölker‘ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die anschließende Zweiteilung natürlich lesbar. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung ‚alle Völker‘.
