  text: For this reason he made two lots[a], one for the people of God and one for all the nations;
translation:
  language: de
  text: 'Deshalb machte er zwei Lose: eines für das Volk Gottes und eines für alle Völker.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Heidenvölker“. Das griechische Wort kann allgemein die Völker bezeichnen, besonders im Gegensatz zum Volk Gottes.'
