translation:
  language: de
  text: Die Völker aber waren zusammengebracht worden, um den Namen der Juden auszulöschen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatten sich versammelt“. Das griechische Partizip ist passiv geformt.'
    reason: lexical_alternative
  - marker: b
    text: „Den Namen auslöschen“ ist eine biblische Ausdrucksweise und kann bedeuten, die Erinnerung an ein Volk oder dessen Fortbestand zu beseitigen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Im Kontext bezeichnet ἔθνη die nichtjüdischen Völker. „Völker“ ist im Deutschen natürlich und weniger theologisch vorgeprägt als „Heiden“.
- source_word: τὰ ἐπισυναχθέντα
  choice: hatten sich versammelt
  rationale: Das Partizip ist formal passiv und beschreibt ein Zusammengeführtsein. Die idiomatische deutsche Formulierung gibt den resultierenden Zusammenschluss klar wieder; die formnähere passive Möglichkeit wird in einer Fußnote bewahrt.
- source_word: ἀπολέσαι
  choice: um … auszulöschen
  rationale: Der Infinitiv bezeichnet den Zweck. In Verbindung mit „den Namen“ gibt „auslöschen“ die Vernichtungsabsicht und das biblische Bild natürlicher wieder als das im Deutschen schwerfällige „den Namen zerstören“.
- source_word: τὸ ὄνομα
  choice: den Namen
  rationale: Die konkrete Bildsprache des griechischen Textes bleibt erhalten, statt sie im Haupttext als „Erinnerung“ oder „Fortbestand“ auszudeuten.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Im Ester-Kontext bezeichnet Ἰουδαῖοι das jüdische Volk; „Juden“ ist die klare, übliche deutsche Wiedergabe.
theological_decisions:
- issue: Bedeutung der Wendung „den Namen der Juden auslöschen“
  choice: Die wörtliche Bildrede mit „Namen“ bleibt im Haupttext erhalten.
  alternative: die Erinnerung an die Juden auslöschen; die Juden vollständig vernichten
  rationale: Die Wendung kann auf die Beseitigung der Erinnerung an ein Volk oder seines weiteren Bestehens zielen. Die bildhafte griechische Formulierung bleibt jedoch verständlich und sollte nicht stillschweigend auf nur eine Deutung festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit vorangestelltem „Die Völker aber“ erhält den kontrastierenden Anschluss δὲ. Die bildhafte Rede vom Auslöschen des Namens bleibt bewusst bestehen.
