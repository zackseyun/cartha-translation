base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/001.yaml
  text: 'And this is the copy of the letter: Great King Artaxerxes writes these things to the rulers and local governors of the one hundred twenty-seven provinces from India to Ethiopia[b][a], who are subject to him.'
translation:
  language: de
  text: 'Dies ist die Abschrift des Briefes: »Der Großkönig Artaxerxes schreibt an die Herrscher und Statthalter der hundert­siebenundzwanzig Gebiete[a] von Indien bis Äthiopien, die ihm unterstellt sind, Folgendes:[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Länder« oder »Provinzen«; das griechische Wort hat eine weitere Bedeutung, steht hier jedoch in einem imperialen Verwaltungskontext.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »schreibt dies« beziehungsweise »schreibt diese Dinge«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολῆς
  choice: Briefes
  rationale: ἐπιστολή bezeichnet hier ein förmliches schriftliches Mitteilungsstück; »Brief« ist im heutigen Deutsch klar und natürlich.
- source_word: ἀντίγραφον
  choice: Abschrift
  rationale: ἀντίγραφον meint die Wiedergabe beziehungsweise Kopie eines Dokuments. »Abschrift« passt zum amtlichen Kontext.
- source_word: Βασιλεὺς μέγας
  choice: Großkönig
  rationale: Die Zusammensetzung bewahrt die persische Herrschertitulatur und klingt im Deutschen würdevoll und idiomatisch.
- source_word: Ἀρταξέρξης
  choice: Artaxerxes
  rationale: Dies ist die im Deutschen etablierte Form des Königsnamens.
- source_word: χωρῶν
  choice: Gebiete
  rationale: χώρα ist breiter als ein fest definierter Verwaltungsbegriff. »Gebiete« wahrt diese Bedeutungsbreite; der imperiale Kontext bleibt durch Zahl und Amtsträger deutlich.
- source_word: ἄρχουσι
  choice: Herrscher
  rationale: ἄρχοντες bezeichnet allgemein Personen, die Autorität ausüben, und bleibt so von den spezifischeren τοπάρχαι unterscheidbar.
- source_word: τοπάρχαις
  choice: Statthalter
  rationale: τοπάρχαι sind Amtsträger über örtliche Bezirke. »Statthalter« vermittelt die administrative Funktion verständlich, ohne das Fremdwort »Toparchen« zu benötigen.
- source_word: ὑποτεταγμένοις
  choice: die ihm unterstellt sind
  rationale: Das Partizip bezeichnet Unterordnung; das im Griechischen implizite Verhältnis zum König wird im Deutschen natürlich mit »ihm« ausgedrückt.
- source_word: τάδε γράφει
  choice: schreibt … Folgendes
  rationale: Die feste deutsche Briefformel gibt den deiktischen Sinn von τάδε präzise und idiomatisch wieder.
theological_decisions:
- issue: Königliche Titulatur und Verwaltungssprache in einem Zusatz zum Esterbuch
  choice: Als förmlichen Eingang eines königlichen Schreibens wiedergeben, ohne historische oder theologische Harmonisierung.
  alternative: Als allgemeine königliche Bekanntmachung frei umschreiben.
  rationale: Der griechische Text bietet eine amtliche Briefüberschrift. Die Übersetzung erhält deren Charakter und fügt keine über den Wortlaut hinausgehenden Aussagen hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit amtlich-feierlichem Ton. Die direkte Rede markiert den Beginn der wiedergegebenen Abschrift. »Großkönig« erhält die Titulatur; »Gebiete« vermeidet eine unnötige Verengung von χώρα auf eine bestimmte Verwaltungsform.
