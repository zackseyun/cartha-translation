base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/004.yaml
  text: among all the tribes throughout the inhabited world there is mixed in a certain hostile people[a], opposed in its laws to every nation, and continually disregarding the decrees of the kings[c][b], so that the blameless joint-rule directed by us may not be maintained.
translation:
  language: de
  text: Inmitten aller Volksstämme in der ganzen bewohnten Welt ist ein gewisses feindseliges Volk eingemischt, das mit seinen Gesetzen[a] im Gegensatz zu jedem Volk steht und die Anordnungen der Könige fortwährend missachtet[b], damit die von uns untadelig geleitete gemeinsame Herrschaft[c] nicht aufrechterhalten wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit seinen Bräuchen“. Das griechische Wort νόμοι kann sowohl Gesetze als auch überlieferte Sitten und Bräuche bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Wortlaut ist hier syntaktisch gedrängt. Gemeint ist wahrscheinlich, dass die königlichen Anordnungen übergangen oder nicht beachtet werden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „gemeinsame Regierung“ beziehungsweise „geteilte Herrschaft“. Das seltene griechische Wort συναρχία bezeichnet eine gemeinsame Ausübung von Herrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσαις ταῖς κατὰ τὴν οἰκουμένην φυλαῖς
  choice: Unter allen Volksstämmen in der ganzen bewohnten Welt
  rationale: „Volksstämme“ gibt φυλαῖς als ethnische Gruppierungen wieder; „bewohnte Welt“ bewahrt den engeren Sinn von οἰκουμένη.
- source_word: ἀναμεμιγμένον
  choice: lebt … verstreut
  rationale: Die Form bezeichnet das Eingemischt- beziehungsweise Verstreutsein unter anderen Gruppen. Die deutsche Wendung ist natürlich und bewahrt den abwertenden Blick des Schreibens.
- source_word: δυσμενῆ λαόν τινα
  choice: ein gewisses feindseliges Volk
  rationale: „Gewisses“ erhält die Unbestimmtheit von τινα; „feindselig“ gibt δυσμενῆ wieder, ohne die polemische Aussage abzuschwächen.
- source_word: τοῖς νόμοις ἀντίθετον πρὸς πᾶν ἔθνος
  choice: das mit seinen Gesetzen im Gegensatz zu jedem anderen Volk steht
  rationale: νόμοι wird primär als „Gesetze“ verstanden, kann aber auch Bräuche bezeichnen. „Jedem anderen Volk“ macht den Vergleich im Deutschen deutlich, ohne den Sinn zu verändern.
- source_word: τά τε τῶν βασιλέων παραπέμποντας διηνεκῶς προστάγματα
  choice: und die Anordnungen der Könige fortwährend missachtet
  rationale: Die syntaktisch gedrängte Formulierung wird im Sinn des beständigen Übergehens oder Nichtbeachtens königlicher Anordnungen verstanden. Der Plural „Könige“ bleibt erhalten.
- source_word: πρὸς τὸ μὴ κατατίθεσθαι
  choice: sodass … nicht aufrechterhalten werden kann
  rationale: Die Konstruktion bezeichnet hier die behauptete verhindernde Folge. Im politischen Zusammenhang ist „aufrechterhalten“ plausibel, während „errichtet“ ebenfalls lexikalisch möglich wäre.
- source_word: τὴν ὑφʼ ἡμῶν κατευθυνομένην ἀμέμπτως συναρχίαν
  choice: die von uns untadelig geleitete gemeinsame Herrschaft
  rationale: συναρχία bezeichnet eine gemeinsame oder geteilte Herrschaft beziehungsweise Regierung; ἀμέμπτως wird adverbial auf deren Leitung bezogen.
theological_decisions:
- issue: Polemische politische Darstellung des beschuldigten Volkes
  choice: Die feindselige und propagandistische Sprache des königlichen Schreibens wird erkennbar beibehalten.
  alternative: Die Aussage durch neutrale Begriffe wie „andersartiges Volk“ oder „abweichende Bräuche“ abzumildern.
  rationale: Die Wertung gehört zur Stimme des königlichen Erlasses und darf nicht als neutrale Erzählerbeschreibung umgedeutet oder beschönigt werden.
- issue: Bedeutung von συναρχία
  choice: gemeinsame Herrschaft
  alternative: gemeinsame Regierung; Mitherrschaft
  rationale: Der seltene Ausdruck bleibt politisch mehrdeutig. „Gemeinsame Herrschaft“ bewahrt den Gedanken einer geteilten beziehungsweise gemeinschaftlichen Regierungsordnung, ohne eine bestimmte Staatsform festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wahrt den amtlich-polemischen Ton eines königlichen Erlasses. Seltene oder mehrdeutige politische und rechtliche Begriffe werden im Text verständlich wiedergegeben und in den Fußnoten offengehalten.
