base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/005.yaml
  text: Therefore[a], having recognized that this nation alone stands in opposition to every man, introducing a foreign way of life in its laws, and being ill-disposed toward our affairs, accomplishing the worst evils, so that the kingdom does not attain stability[b],
translation:
  language: de
  text: Da wir nun erkannt haben, dass allein dieses Volk jedem Menschen fortwährend feindlich gegenübersteht, durch seine Gesetze eine fremdartige Lebensweise pflegt[a], unseren Angelegenheiten übelgesinnt ist und schlimmstes Unheil anrichtet, sodass das Königreich keine Stabilität erlangt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung über die Gesetze und die Lebensweise ist im Griechischen gedrängt und mehrdeutig. In diesem feindseligen königlichen Schreiben werden die Bräuche des Volkes als dem Reich fremd dargestellt.
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: διειληφότες
  choice: da wir nun erkannt haben
  rationale: Das Partizip gibt den behaupteten Erkenntnisgrund des königlichen Schreibens an; die kausale Auflösung ist im Deutschen natürlich und bewahrt den Anschluss durch οὖν.
- source_word: ἔθνος
  choice: Volk
  rationale: Im Deutschen bezeichnet „Volk“ hier eine identifizierbare ethnische Gemeinschaft, ohne die modernen biologischen Konnotationen von „Rasse“ oder den staatsrechtlichen Beiklang von „Nation“ aufzudrängen.
- source_word: μονώτατον
  choice: allein dieses Volk
  rationale: Der Superlativ hebt das Volk als angeblich einzigartigen Ausnahmefall hervor.
- source_word: ἐν ἀντιπαραγωγῇ παντὶ διὰ παντὸς ἀνθρώπῳ κείμενον
  choice: jedem Menschen fortwährend feindlich gegenübersteht
  rationale: „Gegenübersteht“ gibt die andauernde Gegenposition wieder; διὰ παντός wird als „fortwährend“ bewahrt, und der generische Singular ἀνθρώπῳ wird mit „jedem Menschen“ natürlich und genau wiedergegeben.
- source_word: διαγωγὴν νόμων ξενίζουσαν παραλλάσσον
  choice: durch seine Gesetze eine fremdartige Lebensweise pflegt
  rationale: Die griechische Wendung ist gedrängt und syntaktisch schwierig. Die Übersetzung hält Gesetz und Lebensführung zusammen und gibt die feindselige Darstellung fremder Bräuche wieder, ohne ausdrücklich eine Veränderung der Gesetze zu behaupten.
- source_word: δυσονοοῦν τοῖς ἡμετέροις πράγμασιν
  choice: unseren Angelegenheiten übelgesinnt ist
  rationale: „Übelgesinnt“ bewahrt die Bedeutung einer feindlichen Haltung; „unsere Angelegenheiten“ lässt den breiten staatlich-politischen Bezug offen.
- source_word: τὰ χείριστα συντελοῦν κακὰ
  choice: richtet schlimmstes Unheil an
  rationale: Die idiomatische deutsche Wendung bewahrt den stark anklagenden Superlativ und den Gedanken, schweres Übel zu bewirken.
- source_word: πρὸς τὸ μὴ τὴν βασιλείαν εὐσταθείας τυγχάνειν
  choice: sodass das Königreich keine Stabilität erlangt
  rationale: Die Folgeangabe und der politische Sinn von εὐστάθεια werden direkt bewahrt.
theological_decisions:
- issue: Feindselige königliche Charakterisierung des jüdischen Volkes
  choice: Die Aussagen werden in ihrer anklagenden Schärfe als Inhalt des königlichen Schreibens wiedergegeben.
  alternative: Durch Zusätze wie „angeblich“ oder „wie behauptet wird“ ausdrücklich Abstand von den Vorwürfen nehmen.
  rationale: Der Kontext kennzeichnet die Worte bereits als feindselige Herrscherrede. Eine Übersetzung soll diese Perspektive nicht abschwächen, sie aber auch nicht durch erläuternde Zusätze zur Erzählerstimme machen.
- issue: Mehrdeutigkeit der Wendung über Gesetze und Lebensweise
  choice: „durch seine Gesetze eine fremdartige Lebensweise pflegt“
  alternative: „durch Änderung der Gesetze eine fremdartige Lebensweise einführt“
  rationale: Die gedrängte griechische Konstruktion erlaubt unterschiedliche Zuordnungen. Die gewählte Fassung vermeidet die nicht sichere Behauptung, das Volk ändere Gesetze, und wahrt den Zusammenhang von gesetzlichen Bräuchen und fremdartiger Lebensführung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch im Stil eines amtlichen königlichen Schreibens. Die anklagende Rhetorik bleibt erkennbar, ohne dass die Übersetzung sie als sachlich wahr bestätigt. Der Satz bleibt wegen seines fortlaufenden Charakters mit einem Komma abgeschlossen.
