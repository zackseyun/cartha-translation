  text: so that those who were hostile in the past and are hostile now[a], after going down violently to Hades in a single day, may for all time afterward provide us with stable and undisturbed affairs.
translation:
  language: de
  text: damit diejenigen, die früher feindlich gesinnt waren und es auch jetzt sind, nachdem sie an einem einzigen Tag gewaltsam in den Hades[a] hinabgestiegen sind, uns für die ganze folgende Zeit beständige und ungestörte Verhältnisse verschaffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das Totenreich“ beziehungsweise „das Grab“. Das griechische Wort bezeichnet den Bereich der Toten, nicht ausdrücklich den Ort der endgültigen Strafe.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσμενεῖς
  choice: feindlich gesinnt
  rationale: Das Adjektiv bezeichnet Menschen, die feindselig oder übel gesinnt sind. „Feindlich gesinnt“ bewahrt diese Bedeutung, ohne sie zwingend als förmlich erklärte „Feinde“ einzuordnen.
- source_word: πάλαι καὶ νῦν
  choice: früher ... und ... auch jetzt
  rationale: Die Formulierung gibt den zeitlichen Gegensatz beziehungsweise die fortdauernde Feindseligkeit natürlich wieder, ohne πάλαι auf „von alters her“ festzulegen.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: an einem einzigen Tag
  rationale: Die Wendung betont, dass der Untergang plötzlich und innerhalb eines Tages erfolgt.
- source_word: βιαίως
  choice: gewaltsam
  rationale: Das Adverb kennzeichnet den Abstieg als gewaltsam und nicht lediglich als gewöhnliches Sterben.
- source_word: εἰς τὸν ἅδην κατελθόντες
  choice: nachdem sie ... in den Hades hinabgestiegen sind
  rationale: „Hades“ erhält die ausdrückliche griechische Bezeichnung für das Totenreich. Der Aoristpartizip wird als zeitlich vorausgehende Handlung wiedergegeben.
- source_word: εἰς τὸν μετέπειτα χρόνον
  choice: für die ganze folgende Zeit
  rationale: Die Wendung bezeichnet die Zeit nach dem Untergang der feindlich Gesinnten und zielt im Zusammenhang auf dauerhaft gesicherte Zustände.
- source_word: εὐσταθῆ
  choice: beständige
  rationale: Das Adjektiv beschreibt gefestigte, stabile politische oder gesellschaftliche Verhältnisse.
- source_word: ἀτάραχα
  choice: ungestörte
  rationale: Das Wort bezeichnet Freiheit von Unruhe, Erschütterung und Aufruhr.
- source_word: παρέχωσιν ἡμῖν ... τὰ πράγματα
  choice: uns ... Verhältnisse verschaffen
  rationale: τὰ πράγματα meint hier die allgemeine Lage beziehungsweise die öffentlichen Verhältnisse. „Verschaffen“ erhält die auffällige Aussage, dass der Untergang der Gegner solche Verhältnisse herbeiführt.
- source_word: διὰ τέλους
  choice: die ganze
  rationale: In Verbindung mit „folgende Zeit“ drückt die Wendung die ununterbrochene Dauer bis zum Ende aus; „die ganze folgende Zeit“ ist im Deutschen natürlicher als eine zusätzliche, missverständliche Formulierung „bis zum Ende“.
theological_decisions:
- issue: Wiedergabe von ᾅδης im griechischen deuterokanonischen Kontext
  choice: Hades
  alternative: Totenreich; Grab
  rationale: Der griechische Text nennt ausdrücklich den Hades, also den Bereich der Toten. „Hades“ bewahrt diese sprachliche Besonderheit und vermeidet die nicht zwingend gemeinte Vorstellung eines endgültigen Strafortes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Satzbau des königlichen Schreibens bleibt erkennbar, wird aber durch eine natürliche zeitliche Partizipialauflösung verständlich gemacht. Die eigentümliche Aussage, dass die beseitigten Gegner selbst beständige Verhältnisse „verschaffen“, wurde nicht erklärend geglättet.
