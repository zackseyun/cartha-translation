  terminology: „Ratgeber“, „Besonnenheit“, „Wohlwollen“, „Treue“ und „Ehrenstellung“ passen zum höfisch-königlichen Kontext. „Treue“ gibt πίστις hier sachgerecht nichttheologisch wieder. „Zweithöchste Ehrenstellung“ ist eine zulässige und klare Wiedergabe des zweiten königlichen Ehrenranges.
