revisions:
- from: Als ich aber meine Ratgeber fragte, wie dies zu Ende geführt werden könnte, zeigte uns Haman, was zu tun sei[a]. Er zeichnete sich unter uns durch Besonnenheit aus, hatte sich als unveränderlich in seinem Wohlwollen und als von beständiger Treue erwiesen und die zweithöchste Ehrenstellung im Königreich erhalten.
  to: Als ich aber meine Ratgeber fragte, wie dies zu Ende geführt werden könnte, zeigte es uns Haman[a], der sich unter uns durch Besonnenheit auszeichnete, in seinem Wohlwollen unwandelbar war, sich durch unerschütterliche Treue bewährt hatte und die zweithöchste Ehrenstellung im Königreich erhalten hatte.
  rationale: Die Revision bewahrt die Ellipse nach ἐπεδείξεν mit dem kontextbezogenen „es“, statt sie als „was zu tun sei“ weiter auszudeuten. Zugleich werden die Prädikate zu εὔνοια und βεβαία πίστις in idiomatischerem modernem Standarddeutsch formuliert. Die lange, im Griechischen zusammenhängende Charakterisierung Hamans wird in einem deutschen Satz geführt.
