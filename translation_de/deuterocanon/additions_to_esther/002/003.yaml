base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/003.yaml
  text: And when I asked my counselors how this might be brought to completion[a], Haman showed us the way—he who excelled among us in prudence, had been proved unchanging in goodwill and in steadfast loyalty, and had received the second rank of honor in the kingdom.
translation:
  language: de
  text: Als ich aber meine Ratgeber fragte, wie dies zu Ende geführt werden könnte, zeigte es uns Haman[a], der sich unter uns durch Besonnenheit auszeichnete, in seinem Wohlwollen unwandelbar war, sich durch unerschütterliche Treue bewährt hatte und die zweithöchste Ehrenstellung im Königreich erhalten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Haman zeigte es uns“ oder „Haman wies es uns nach“. Nach der Frage, wie die Sache zu Ende geführt werden könnte, lässt der griechische Text das direkte Objekt von „zeigte“ unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πυθομένου δέ μου τῶν συμβούλων
  choice: Als ich aber meine Ratgeber fragte
  rationale: Der Genitivus absolutus bezeichnet den begleitenden zeitlichen Umstand. „Meine Ratgeber“ gibt den im königlichen Ich-Kontext naheliegenden Bezug natürlich wieder.
- source_word: πῶς ἂν ἀχθείη τοῦτο ἐπὶ πέρας
  choice: wie dies zu Ende geführt werden könnte
  rationale: Die Formulierung bewahrt das Passiv von ἀχθείη und gibt die Wendung ἐπὶ πέρας idiomatisch und zugleich quellennah wieder.
- source_word: σωφροσύνῃ παρʼ ἡμῖν διενέγκας
  choice: Er zeichnete sich unter uns durch Besonnenheit aus
  rationale: σωφροσύνη umfasst Besonnenheit, Selbstbeherrschung und vernünftiges Urteilsvermögen; im höfisch-administrativen Zusammenhang ist „Besonnenheit“ passend. διενέγκας bezeichnet ein Hervorragen.
- source_word: ἐν τῇ εὐνοίᾳ ἀπαραλλάκτως
  choice: unveränderlich in seinem Wohlwollen
  rationale: Die Wiedergabe hält sowohl den Gedanken des Wohlwollens als auch die ausdrücklich ausgesagte Unveränderlichkeit fest.
- source_word: βεβαίᾳ πίστει ἀποδεδειγμένος
  choice: als von beständiger Treue erwiesen
  rationale: πίστις bezeichnet hier im höfischen Dienstverhältnis verlässliche Treue, nicht religiösen Glauben; βεβαίᾳ betont deren Festigkeit.
- source_word: δεύτερον τῶν βασιλείων γέρας ἀπενηνεγμένος
  choice: die zweithöchste Ehrenstellung im Königreich erhalten
  rationale: γέρας bezeichnet Ehre, Vorrecht oder Ehrenrang. Die idiomatische deutsche Formulierung macht Hamans Stellung unmittelbar nach dem König verständlich, ohne einen Amtstitel einzuführen.
- source_word: Ἁμὰν ἐπεδείξεν ἡμῖν
  choice: zeigte uns Haman, was zu tun sei
  rationale: ἐπεδείξεν bedeutet „zeigte“ oder „wies auf“. Das Objekt bleibt im Griechischen unausgesprochen und ist aus der vorausgehenden Frage zu ergänzen; die deutsche Fassung macht diese Ellipse lesbar, während die Fußnote die formnähere Alternative dokumentiert.
theological_decisions:
- issue: Bedeutung von πίστις im nichttheologischen höfischen Kontext
  choice: Treue
  alternative: Glaube; Glaubenstreue; Zuverlässigkeit
  rationale: Der König rühmt Hamans bewährte Verlässlichkeit im königlichen Dienst. „Treue“ wahrt den relationalen Sinn von πίστις, ohne eine religiöse Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zum griechischen königlichen Schreiben. Die lange griechische Partizipialkonstruktion wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die sachlichen Bezüge und die implizite Ergänzung nach ἐπεδείξεν bleiben erkennbar.
