base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/006.yaml
  text: Therefore we have instructed those writing to you in the documents written by Haman[a], who was appointed over affairs and was our second father, to destroy all of them—together with women and children—root and branch, by the swords of their enemies, without any pity or sparing, on the fourteenth day of Adar, the twelfth month, of this present year[b],
translation:
  language: de
  text: Darum haben wir diejenigen, die euch schreiben[a], in den von Haman – der über die Staatsgeschäfte eingesetzt war und unser zweiter Vater war[b] – verfassten Schriftstücken angewiesen, alle – samt Frauen und Kindern – mit Stumpf und Stiel durch die Schwerter ihrer Feinde auszurotten, ohne jedes Mitleid und jede Schonung, und zwar am vierzehnten Tag des zwölften Monats Adar in diesem Jahr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die euch den Wortlaut vorgeben“. Das griechische Partizip kann Personen bezeichnen, die den Wortlaut eines Schriftstücks diktieren oder formulieren; die genaue amtliche Funktion bleibt unklar.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unser zweiter Vater“; eine höfische Ehrenbezeichnung für Hamans herausgehobene Stellung.'
    reason: cultural_note
lexical_decisions:
- source_word: ὑποστεῖλαιμεν
  choice: haben wir … angewiesen
  rationale: Die schwierige Verbform wird im Zusammenhang des königlichen Erlasses als Erteilung einer amtlichen Anweisung verstanden. „Angewiesen“ ist im Deutschen klar und wahrt den administrativen Ton.
- source_word: τοῖς ὑπαγρευομένοις ὑμῖν
  choice: diejenigen, die euch schreiben
  rationale: ὑπαγορεύω kann das Vorsagen beziehungsweise Vorgeben eines Wortlauts bezeichnen. Die Übersetzung bleibt bei der im Überlieferungs- und Verwaltungskontext möglichen personalen Auffassung, ohne die genaue amtliche Funktion als „Sekretäre“ festzulegen.
- source_word: ἐν τοῖς γεγραμμένοις ὑπʼ Ἁμὰν
  choice: in den von Haman verfassten Schriftstücken
  rationale: „Schriftstücke“ bezeichnet amtliche Dokumente, ohne sie enger als Briefe festzulegen; ὑπʼ Ἁμάν gibt Haman als Urheber an.
- source_word: τοῦ τεταγμένου ἐπὶ τῶν πραγμάτων
  choice: war über die Staatsgeschäfte eingesetzt
  rationale: Die Wendung beschreibt Hamans amtliche Einsetzung über die Regierungsgeschäfte. „Staatsgeschäfte“ macht den administrativen Bezug im Deutschen deutlich.
- source_word: δευτέρου πατρὸς ἡμῶν
  choice: galt als unser zweiter Vater
  rationale: Die ungewöhnliche höfische Ehrenbezeichnung wird bildhaft beibehalten und nicht zu einer bestimmten Amtsbezeichnung wie „oberster Ratgeber“ umgedeutet.
- source_word: ἀπολέσαι ὁλορριζεί
  choice: mit Stumpf und Stiel … auszurotten
  rationale: ἀπολέσαι bezeichnet die Vernichtung; ὁλορριζεί verstärkt sie mit dem Bild vollständiger Beseitigung bis zur Wurzel. Die deutsche Redewendung bewahrt dieses Bild und die Härte des Befehls.
- source_word: ταῖς τῶν ἐχθρῶν μαχαίραις
  choice: durch die Schwerter ihrer Feinde
  rationale: Der Dativ wird instrumental wiedergegeben. „Ihrer“ bezieht die Feinde auf die zum Tod Bestimmten, wie es der Zusammenhang nahelegt.
- source_word: ἄνευ παντὸς οἴκτου καὶ φειδοῦς
  choice: ohne jedes Mitleid und jede Schonung
  rationale: 'Die beiden Begriffe werden unterschieden wiedergegeben: οἶκτος als Mitleid und φειδώ als Schonung beziehungsweise Verschonung.'
- source_word: τῇ τεσσαρεσκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: am vierzehnten Tag des zwölften Monats Adar
  rationale: Die Datumsangabe folgt dem Griechischen und behält den Monatsnamen Adar bei.
- source_word: τοῦ ἐνεστῶτος ἔτους
  choice: in diesem Jahr
  rationale: Die natürliche deutsche Formulierung gibt den Gegenwartsbezug des amtlichen Ausdrucks vollständig wieder.
theological_decisions:
- issue: Gewaltsprache des königlichen Erlasses
  choice: Den umfassenden Vernichtungsbefehl einschließlich Frauen und Kindern ungemildert wiedergeben
  alternative: Euphemistische Formulierungen wie „beseitigen“ oder „gegen sie vorgehen“
  rationale: Der griechische Text nennt ausdrücklich Frauen und Kinder, vollständige Ausrottung und das Fehlen jeder Schonung. Die moralische Härte darf in der Übersetzung nicht abgeschwächt werden.
- issue: Höfische Bezeichnung Hamans als „zweiter Vater“
  choice: Das ungewöhnliche Bild beibehalten
  alternative: Als konkrete Funktion wie „oberster Ratgeber“ auflösen
  rationale: Der Text gebraucht eine metaphorische Ehrenbezeichnung. Eine funktionale Umschreibung würde eine nicht ausdrücklich genannte Amtsstellung festlegen und die höfische Überhöhung beseitigen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit amtlich-königlichem Ton. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Vernichtungssprache bleibt bewusst direkt; altertümliche Kanzleisprache und konfessionell geprägte Begriffe werden vermieden.
