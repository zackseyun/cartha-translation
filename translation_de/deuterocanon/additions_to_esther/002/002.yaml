  text: The matter was being hurried along even in Susa; but the king and Haman were reclining at table[a], while the city was in turmoil.
translation:
  language: de
  text: Die Sache wurde auch in Susa eilends vorangetrieben. Der König und Haman aber lagen bei Tisch[a], während die Stadt in Aufruhr war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »feierten ein Festmahl« oder »hielten ein Gelage«. Das griechische Verb bezeichnet insbesondere das Liegen auf Speisesofas bei einer förmlichen Mahlzeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσπεύδετο
  choice: wurde mit Nachdruck vorangetrieben
  rationale: Der imperfektische Passiv beschreibt einen fortdauernden Vorgang, der beschleunigt beziehungsweise nachdrücklich betrieben wurde. Die Formulierung bewahrt Passivität und Dringlichkeit in natürlichem Deutsch.
- source_word: τὸ πρᾶγμα
  choice: die Sache
  rationale: Der allgemeine Ausdruck bezeichnet eine Sache, Angelegenheit oder ein Vorhaben. »Erlass« wäre trotz des Kontexts enger als der griechische Wortlaut.
- source_word: καὶ εἰς Σουσάν
  choice: auch in Susa
  rationale: Die Wendung zeigt, dass sich das Geschehen ebenfalls auf Susa erstreckte. Das deutsche »auch in Susa« gibt dies idiomatisch wieder, ohne εἰς unnatürlich räumlich abzubilden.
- source_word: ἐκωθωνίζοντο
  choice: lagen beim Mahl zu Tisch
  rationale: Das Verb bezeichnet das Lagern auf Speisesofas bei einer Mahlzeit oder einem Gelage. Die Übersetzung bewahrt das konkrete kulturelle Bild; eine Fußnote nennt geläufigere, stärker deutende Alternativen.
- source_word: ἐταράσσετο
  choice: war in Aufruhr
  rationale: Der Imperfekt schildert den anhaltenden Zustand der Erregung und Verwirrung in der Stadt. »In Aufruhr« bildet den scharfen Kontrast zur Mahlzeit des Königs und Hamans natürlich ab.
- source_word: ἡ πόλις
  choice: die Stadt
  rationale: Dies ist die direkte Wiedergabe und kann im Kontext sowohl Susa als Ort als auch seine Bevölkerung beziehungsweise Bürgerschaft bezeichnen.
