translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz bildet die feierliche Bewegung durch die Palastzugänge knapp und klar ab. »Prachtgewandung« wahrt den konkreten Kleidungsbezug von στολή und zugleich die sichtbare königliche Herrlichkeit von ἐπιφάνεια. Die echte textliche Unsicherheit am Versende wird nicht im Haupttext geglättet, sondern ausdrücklich in Fußnote [b] dokumentiert.
