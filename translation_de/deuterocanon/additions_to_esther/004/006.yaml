  text: And after she had gone in through all the doors[a], she stood before the king; and he was sitting on the throne of his kingdom[b], and was clothed in all the splendor of his majesty.
translation:
  language: de
  text: Nachdem sie durch alle Türen[a] eingetreten war, stellte sie sich vor den König. Er saß auf dem Thron seines Königreichs und war in sein ganzes Prachtgewand gekleidet.[b]
