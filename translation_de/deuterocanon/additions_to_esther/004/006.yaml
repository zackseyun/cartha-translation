lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: Nachdem sie … eingetreten war
  rationale: Das Aoristpartizip wird temporal wiedergegeben und bezeichnet die dem Hintreten vor den König vorausgehende Handlung.
- source_word: πάσας τὰς θύρας
  choice: durch alle Türen
  rationale: θύρα bedeutet gewöhnlich »Tür«, kann im Palastzusammenhang aber auch auf eine Folge von Durchgängen oder Toren weisen; die Fußnote bewahrt diese Möglichkeit.
- source_word: κατέστη ἐνώπιον τοῦ βασιλέως
  choice: trat sie vor den König
  rationale: κατέστη bezeichnet hier das Eintreten in eine stehende Position vor dem König; die deutsche Wendung ist natürlich und wahrt den höfischen Zusammenhang.
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: Thron seines Königreichs
  rationale: Die Genitivverbindung wird bewusst eng am Griechischen wiedergegeben, statt sie zum bloßen »Königsthron« zu verdichten.
- source_word: πᾶσαν στολὴν τῆς ἐπιφανείας αὐτοῦ
  choice: seine ganze Prachtgewandung
  rationale: στολή bezeichnet Gewand oder Gewandung, während ἐπιφάνεια hier die sichtbare königliche Pracht ausdrückt. »Prachtgewandung« verbindet beide Bestandteile in natürlichem Deutsch, ohne einen theologischen Fachsinn von ἐπιφάνεια einzutragen.
- source_word: ἐνεδεΒ
  choice: hatte … angelegt
  rationale: Die überlieferte Form bricht offenbar innerhalb eines Verbs ab. Der Zusammenhang legt eine Form mit der Bedeutung »war bekleidet« oder »hatte angelegt« nahe; die Übersetzung gibt diesen wahrscheinlichen Sinn wieder und kennzeichnet die Unsicherheit in einer Fußnote.
