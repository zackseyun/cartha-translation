lexical_decisions:
- source_word: γενηθεῖσα ἐπιφανής
  choice: als sie sichtbar geworden war
  rationale: Die Formulierung bewahrt den im Griechischen bezeichneten Übergang zum Sichtbar- oder Öffentlichwerden. Die idiomatischere Möglichkeit „als sie erschien“ wird in der Fußnote genannt, ohne eine mögliche Bedeutung von Glanz oder herrlicher Erscheinung in den Haupttext einzutragen.
- source_word: ἐπικαλεσαμένη
  choice: rief sie … an
  rationale: Das mediale Partizip bezeichnet hier das Anrufen Gottes, insbesondere im Gebet. Im Deutschen lässt sich die dem Hauptverb vorausgehende Handlung natürlich durch die koordinierte Verbform wiedergeben.
- source_word: τὸν πάντων ἐπόπτην θεὸν
  choice: Gott, den Wächter über alle
  rationale: ἐπόπτης bezeichnet jemanden, der über andere wacht oder sie im Blick hat. „Wächter über alle“ erhält die titelartige Form und vermeidet den im modernen Deutschen häufig amtlich oder kirchlich-technisch klingenden Ausdruck „Aufseher“.
- source_word: σωτῆρα
  choice: Retter
  rationale: „Retter“ gibt die personale Bezeichnung σωτήρ in natürlichem, gehobenem Deutsch wieder und lässt sowohl Rettung als auch Befreiung anklingen.
- source_word: παρέλαβεν
  choice: nahm … mit
  rationale: Im Zusammenhang bezeichnet das Verb, dass Ester ihre Begleiterinnen zu sich nimmt und mitführt. „Mitnehmen“ ist dafür die natürliche deutsche Wiedergabe.
- source_word: τὰς δύο ἅβρας
  choice: die beiden Dienerinnen
  rationale: ἅβρα bezeichnet hier junge weibliche Bedienstete beziehungsweise persönliche Begleiterinnen. „Dienerinnen“ ist verständlich und wahrt den sozialen Bezug, ohne unnötig altertümlich zu wirken.
theological_decisions:
- issue: Verhältnis der Gottesbezeichnungen ἐπόπτην und σωτῆρα zu θεόν
  choice: Gott, den Wächter über alle und Retter
  alternative: Gott, der über alle wacht, und Retter; den allsehenden Gott und Retter
  rationale: 'Die Wiedergabe erhält beide nominalen Aussagen über Gott: seine universale Wachsamkeit und seine Eigenschaft als Retter. Sie verschmilzt die Titel weder zu einer einzigen Umschreibung noch beschränkt sie Gottes rettendes Handeln auf die konkrete Situation.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt gut verständlich, während die titelartigen Aussagen über Gott und die zeitliche Abfolge der griechischen Partizipien erkennbar bleiben.
