  yaml_path: translation/deuterocanon/additions_to_esther/004/013.yaml
  text: And he said to him[a], “I saw you, lord, like an angel of God, and my heart was troubled with fear because of your glory.”
translation:
  language: de
  text: 'Und sie sagte zu ihm: „Ich sah dich, mein Herr, wie einen Engel Gottes[a], und mein Herz geriet aus Furcht vor deiner Herrlichkeit in Unruhe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als einen Engel Gottes“. Das griechische Wort bezeichnet hier einen Vergleich, keine Gleichsetzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: Und sie sagte zu ihm
  rationale: Das griechische Verb nennt das Geschlecht des Subjekts nicht; aus dem Erzählzusammenhang ist Ester die Sprechende. αὐτῷ bezeichnet den angeredeten König.
- source_word: Εἶδόν σε
  choice: Ich sah dich
  rationale: Der Aorist wird im erzählenden Zusammenhang schlicht vergangen wiedergegeben.
- source_word: κύριε
  choice: mein Herr
  rationale: Die Anrede gilt hier dem menschlichen König. „Mein Herr“ gibt die ehrerbietige Anrede im heutigen Deutschen natürlich wieder, ohne den König mit Gott gleichzusetzen.
- source_word: ὡς ἄγγελον θεοῦ
  choice: wie einen Engel Gottes
  rationale: „Wie“ wahrt den vergleichenden Sinn von ὡς; die artikellose Wendung wird unbestimmt wiedergegeben. „Engel“ entspricht dem durch Herrlichkeit und Furcht geprägten himmlischen Bild besser als „Bote“.
- source_word: ἐταράχθη ἡ καρδία μου
  choice: mein Herz geriet … in Unruhe
  rationale: Die Form bezeichnet eine innere Erschütterung. Die deutsche Wendung bewahrt zugleich das griechische Bild vom Herzen als Sitz der Empfindungen.
- source_word: ἀπὸ φόβου τῆς δόξης σου
  choice: aus Furcht vor deiner Herrlichkeit
  rationale: ἀπό bezeichnet die Furcht als Ursache der inneren Unruhe; der Genitiv verbindet die Furcht mit der Herrlichkeit des Königs. „Herrlichkeit“ bewahrt sowohl sichtbaren Glanz als auch die feierliche Resonanz von δόξα.
theological_decisions:
- issue: Bezug der Anrede κύριε
  choice: „mein Herr“ als Anrede an den menschlichen König
  alternative: „Herr“ als möglicherweise göttlich verstandene Anrede
  rationale: Der unmittelbare Erzählzusammenhang beschreibt Esters Reaktion auf den König. Die Übersetzung wahrt die ehrerbietige Anrede, ohne eine göttliche Identifikation nahezulegen.
- issue: Vergleich mit einem Engel Gottes
  choice: 'vergleichend: „wie einen Engel Gottes“'
  alternative: „als einen Engel Gottes“
  rationale: ὡς kann formal mit „wie“ oder „als“ wiedergegeben werden; hier bezeichnet es angesichts der Herrlichkeit und Furcht eine Ähnlichkeit, keine Aussage, der König sei tatsächlich ein Engel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mein Herr“ klingt als höfische Anrede natürlicher als das isolierte „Herr“; „geriet … in Unruhe“ vermeidet veraltete oder übermäßig dramatische Ausdrucksweisen. Das im Griechischen unausgedrückte Subjekt wird entsprechend dem Erzählzusammenhang mit „sie“ wiedergegeben.
