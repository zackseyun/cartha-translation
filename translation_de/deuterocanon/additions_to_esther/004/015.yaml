lexical_decisions:
- source_word: ἐν δὲ τῷ διαλέγεσθαι αὐτήν
  choice: Doch während sie sprach
  rationale: Die substantivierte Konstruktion mit ἐν und Infinitiv bezeichnet die Gleichzeitigkeit. διαλέγεσθαι meint hier im Kontext schlicht das Sprechen; δέ wird als leichter Fortgang beziehungsweise Kontrast mit „Doch“ wiedergegeben.
- source_word: ἔπεσεν
  choice: sank … zu Boden
  rationale: Das Verb bedeutet wörtlich „fiel“. Im Deutschen beschreibt „sank … zu Boden“ den durch Schwäche verursachten Sturz natürlich, ohne eine vollständige Bewusstlosigkeit hinzuzufügen.
- source_word: ἀπὸ ἐκλύσεως
  choice: vor Schwäche
  rationale: ἀπό kann hier die Ursache angeben; ἔκλυσις bezeichnet Erschlaffung, Entkräftung oder Schwäche. „Vor Schwäche“ ist idiomatisch und bewahrt den ursächlichen Zusammenhang.
theological_decisions: []
translation_notes:
  register: Kurzer, würdevoller Erzählstil in modernem Standarddeutsch. Die Formulierung vermeidet das stärker deutende „wurde ohnmächtig“ und bewahrt, dass der griechische Text einen Fall infolge von Entkräftung beschreibt.
