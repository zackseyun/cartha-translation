lexical_decisions:
- source_word: Τί ἐστιν
  choice: Was ist
  rationale: Die knappe Frage gibt den griechischen Wortlaut direkt wieder und ist im Deutschen als besorgte Nachfrage verständlich; die idiomatischere Deutung »Was ist los?« bleibt in der Fußnote erhalten.
- source_word: ἀδελφός
  choice: Bruder
  rationale: Das griechische Wort bezeichnet wörtlich einen Bruder. Obwohl es hier möglicherweise weiter gefasst einen nahen Verwandten oder eine versicherte Verbundenheit ausdrückt, wird die konkrete Familienbezeichnung im Haupttext bewahrt.
- source_word: θάρσει
  choice: Fasse Mut
  rationale: Der Imperativ fordert Ester zu Zuversicht und Mut auf. »Fasse Mut!« ist würdig, verständlich und gibt die auffordernde Kraft knapp wieder.
- source_word: ἐγὼ ὁ ἀδελφός σου
  choice: Ich bin dein Bruder
  rationale: Ein vollständiger deutscher Satz bildet die betonte Selbstbezeichnung mit ἐγώ natürlich ab und bewahrt ihren beruhigenden Charakter.
theological_decisions:
- issue: Familienbezeichnung des Sprechers gegenüber Ester
  choice: Die wörtliche Bezeichnung »Bruder« steht im Haupttext.
  alternative: »Verwandter« oder »naher Angehöriger«
  rationale: Der griechische Text verwendet ausdrücklich ἀδελφός. Eine weitere soziale oder verwandtschaftliche Bedeutung ist möglich, soll aber nicht ohne Kennzeichnung in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und beruhigend; »Ester« folgt der heute üblichen deutschen Namensform. Die echte Bedeutungsbreite von ἀδελφός wird durch eine Fußnote offengehalten.
