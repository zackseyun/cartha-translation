  text: And he said to her[a], “What is it, Esther? I am your brother[b]; take courage.”
translation:
  language: de
  text: 'Und er sagte zu ihr: »Was ist denn, Ester?[a] Ich bin dein Bruder[b]. Fasse Mut!«'
  philosophy: optimal-equivalence
  footnotes:
