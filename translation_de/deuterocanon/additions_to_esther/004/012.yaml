  text: And lifting up the golden scepter[a], he placed it on her neck, and kissed her and said, “Speak to me.”
translation:
  language: de
  text: 'Und er hob das goldene Zepter hoch, legte es ihr auf den Hals, küsste sie[a] und sagte: »Sprich zu mir.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »begrüßte sie«; das griechische Verb kann allgemein eine Begrüßung bezeichnen, doch der Zusammenhang spricht hier für einen Kuss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρας
  choice: hob … hoch
  rationale: Das Aoristpartizip von αἴρω bezeichnet eine der folgenden Handlung vorausgehende Bewegung. Die finite deutsche Form fügt sich natürlich in die Handlungskette ein.
- source_word: χρυσῆν ῥάβδον
  choice: das goldene Zepter
  rationale: ῥάβδος kann Stab, Rute oder Zepter bedeuten; im königlichen Hofkontext ist »Zepter« die sachlich passende Wiedergabe.
- source_word: ἐπέθηκεν
  choice: legte
  rationale: ἐπιτίθημι bezeichnet hier das Auflegen des Zepters auf Esters Hals. »Legte … auf« ist konkret und im Deutschen idiomatisch.
- source_word: ἐπὶ τὸν τράχηλον αὐτῆς
  choice: ihr auf den Hals
  rationale: τράχηλος bedeutet »Hals«; die possessive Dativkonstruktion ist im Deutschen natürlicher als »auf ihren Hals«.
- source_word: ἠσπάσατο
  choice: küsste sie
  rationale: ἀσπάζομαι kann allgemein »grüßen« bedeuten, schließt aber einen körperlichen Gruß durch einen Kuss ein. Die Abfolge körperlicher Gesten spricht hier für »küssen«, ohne die lexikalische Alternative zu verschweigen.
- source_word: Λάλησόν μοι
  choice: Sprich mit mir
  rationale: Der Imperativ λαλέω mit dem Dativ μοι lädt Ester zum Reden ein. »Sprich mit mir« ist würdevoll und natürlich; »Sprich zu mir« wäre ebenfalls möglich, klingt hier jedoch distanzierter.
