  text: You certainly will not die, for our decree is common.
translation:
  language: de
  text: Du wirst ganz gewiss nicht sterben; denn unser Erlass gilt für alle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »denn unser Erlass ist allgemein (oder: gemeinsam)«.'
    reason: Die ungewöhnliche Formulierung κοινὸν τὸ πρόσταγμα ἡμῶν lässt offen, ob vor allem die allgemeine Geltung oder der gemeinsame Charakter des Erlasses betont wird.
lexical_decisions:
- source_word: οὐ μὴ ἀποθάνῃς
  choice: Du wirst ganz gewiss nicht sterben
  rationale: Die Verbindung οὐ μή mit dem Aorist-Konjunktiv drückt eine nachdrückliche Verneinung aus; »ganz gewiss nicht« gibt diese Stärke in natürlichem Deutsch wieder.
- source_word: κοινὸν
  choice: gilt für alle
  rationale: κοινός bezeichnet hier wahrscheinlich etwas Allgemeines beziehungsweise für alle gleichermaßen Geltendes. Eine rein formale Wiedergabe als »gemeinsam« wäre im Deutschen bei einem Erlass missverständlich.
- source_word: πρόσταγμά
  choice: Erlass
  rationale: πρόσταγμα bezeichnet eine autoritative Anordnung oder Verfügung; »Erlass« passt zum königlichen Kontext.
- source_word: ἡμῶν
  choice: unser
  rationale: Der Genitiv wird unmittelbar possessiv wiedergegeben und bewahrt den königlichen Plural der griechischen Rede.
theological_decisions:
- issue: Reichweite des königlichen Erlasses
  choice: gilt für alle
  alternative: ist allgemein / ist uns gemeinsam
  rationale: Der griechische Ausdruck κοινὸν τὸ πρόσταγμα ἡμῶν ist knapp und kann formal verschieden verstanden werden. Im Kontext einer allgemeinen Hofregel liegt die universale Geltung nahe; die Fußnote bewahrt die wörtlichere Ausdrucksweise und damit die verbleibende Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Zusicherung wird klar wiedergegeben; die knappe amtliche Sprache des zweiten Satzteils bleibt erhalten.
