lexical_decisions:
- source_word: ὅλος διὰ χρυσοῦ καὶ λίθων πολυτελῶν
  choice: ganz in Gold und kostbare Steine gehüllt
  rationale: Die Ergänzung „gehüllt“ macht das im überlieferten Ausschnitt elliptische Satzstück auf Deutsch verständlich, ohne ein bestimmtes Kleidungsstück zu unterstellen. „Kostbare Steine“ gibt πολυτελεῖς λίθοι idiomatisch wieder.
- source_word: φοβερὸς σφόδρα
  choice: überaus furchterregend
  rationale: Die Formulierung bewahrt die starke Wirkung von σφόδρα und den Schrecken, den die Erscheinung des Königs hervorruft.
- source_word: ἄρας τὸ πρόσωπον αὐτοῦ
  choice: Er hob sein Gesicht
  rationale: Die konkrete Körperbewegung des griechischen Ausdrucks bleibt erhalten; das bloße „er blickte auf“ wäre weniger anschaulich.
- source_word: πεπυρωμένον δόξῃ
  choice: das vor Herrlichkeit glühte
  rationale: „Glühte“ bewahrt das Feuerbild von πεπυρωμένον, während „Herrlichkeit“ die majestätische Ausstrahlung von δόξα wiedergibt.
- source_word: ἐν ἀκμῇ θυμοῦ
  choice: auf dem Höhepunkt seines Zorns
  rationale: ἀκμή bezeichnet den höchsten oder vollsten Grad; die Wendung gibt die äußerste Intensität des Zorns natürlich wieder.
- source_word: μετέβαλε τὸ χρῶμα αὐτῆς ἐν ἐκλύσει
  choice: in ihrer Ohnmacht wich ihr die Farbe aus dem Gesicht
  rationale: Die idiomatische deutsche Formulierung vermittelt sowohl die sichtbare Veränderung ihrer Gesichtsfarbe als auch den Zustand des Schwachwerdens beziehungsweise der Ohnmacht.
- source_word: κατέκυψεν
  choice: sie sank
  rationale: Im Zusammenhang ihres Zusammenbruchs bezeichnet das Verb eine Abwärtsbewegung; „sank“ vermeidet den Eindruck einer bewussten Verbeugung.
- source_word: ἅβρας
  choice: Dienerin
  rationale: Das substantivierte ἅβρα bezeichnet hier eine weibliche Hofdienerin oder Begleiterin. Eine wörtliche Wiedergabe als „zarte“ Dienerin würde im modernen Deutsch eine im Kontext nicht notwendige körperliche Eigenschaft hervorheben.
- source_word: τῆς προπορευομένης
  choice: die vor ihr herging
  rationale: Die Wendung gibt die räumliche und prozessionale Funktion des Partizips klar und natürlich wieder.
theological_decisions:
- issue: Fragmentarischer beziehungsweise elliptischer Versanfang im vorgelegten griechischen Text
  choice: Der Text beginnt mit Auslassungspunkten und einer Fußnote; lediglich das für einen verständlichen deutschen Satz notwendige „gehüllt“ wird ergänzt.
  alternative: Eine konkrete Rekonstruktion wie „Er trug ein Gewand“ oder „Er war bekleidet“ in den Haupttext aufnehmen.
  rationale: Der vorgelegte Zeuge setzt mitten in einer Beschreibung ein. Die sichtbare Auslassung wahrt diese Unsicherheit und vermeidet, ein nicht erhaltenes Kleidungsstück oder Verb als sicher auszugeben.
