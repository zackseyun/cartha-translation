  text: '...entirely covered with gold and costly stones, and he was very terrifying. And lifting up his face, blazing with splendor at the height of anger, he looked; and the queen fell and changed color in faintness, and she bent down upon the head of the delicate maidservant who was going before her.'
translation:
  language: de
  text: …[a] ganz in Gold und kostbare Steine gehüllt[b], und er war überaus furchterregend. Er hob sein Gesicht, das vor Herrlichkeit glühte, und blickte in höchstem Zorn. Da fiel die Königin, und vor Schwäche veränderte sich ihre Farbe; sie beugte sich über den Kopf der zarten Dienerin, die vor ihr herging.
