  to: …[a] ganz in Gold und kostbare Steine gehüllt[b], und er war überaus furchterregend. Er hob sein Gesicht, das vor Herrlichkeit glühte, und blickte in höchstem Zorn. Da fiel die Königin, und vor Schwäche veränderte sich ihre Farbe; sie beugte sich über den Kopf der zarten Dienerin, die vor ihr herging.
