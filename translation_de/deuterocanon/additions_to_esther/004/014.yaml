  yaml_path: translation/deuterocanon/additions_to_esther/004/014.yaml
  text: For you are wonderful[a], Lord, and your face is full of grace.
translation:
  language: de
  text: Denn du bist wunderbar, Herr, und dein Angesicht ist voller Gnade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Angesicht ist voller Huld« oder »voller Anmut«. Das griechische Wort kann Gnade, Huld oder Anmut bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die begründende Konjunktion knüpft Esters Aussage natürlich an den vorausgehenden Zusammenhang an.
- source_word: θαυμαστὸς
  choice: wunderbar
  rationale: Das Adjektiv bezeichnet etwas Staunenswertes oder Bewundernswertes. »Wunderbar« bewahrt den ehrfürchtigen Ton und ist im modernen Deutsch verständlich.
- source_word: κύριε
  choice: Herr
  rationale: Die Anrede gilt im unmittelbaren Erzählzusammenhang dem König. »Herr« gibt die respektvolle Anrede wieder, ohne sie als Gottesbezeichnung festzulegen.
- source_word: πρόσωπόν
  choice: Angesicht
  rationale: Das griechische Wort bedeutet hier konkret »Gesicht«. »Angesicht« erhält die bildhafte und feierliche Ausdrucksweise; die abstraktere Deutung »Gegenwart« wird nicht in den Text eingetragen.
- source_word: χαρίτων
  choice: Anmut
  rationale: Der Genitiv Plural von χάρις kann hier anmutige, liebenswürdige oder huldvolle Ausstrahlung bezeichnen. Im Zusammenhang mit dem Angesicht des Königs ist »Anmut« natürlich und vermeidet eine vorschnelle dogmatische Verengung auf den theologischen Begriff »Gnade«.
- source_word: μεστόν
  choice: voller
  rationale: Das Adjektiv bedeutet »voll« oder »angefüllt«. Die Verbindung »voller Anmut« ist idiomatisches modernes Deutsch.
theological_decisions:
- issue: Bezug der Anrede κύριε
  choice: Die Anrede als respektvolle Bezeichnung des Königs wiedergeben
  alternative: Die Anrede als Gottesbezeichnung »Herr« deuten
  rationale: Obwohl »Herr« auch als Gottesbezeichnung dienen kann, spricht Ester im unmittelbaren Kontext den König an. Die Übersetzung wahrt die Anredeform, ohne ihr eine nicht vom Kontext getragene göttliche Referenz zu geben.
- issue: Bedeutung von χάρις in der Beschreibung des königlichen Angesichts
  choice: »Anmut«
  alternative: »Gnade« oder »Gunst«
  rationale: Das mehrdeutige χάρις bezeichnet nicht nur theologische Gnade, sondern auch Anmut, Liebenswürdigkeit oder Gunst. In dieser Beschreibung der Erscheinung des Königs liegt »Anmut« nahe; eine Fußnote bewahrt die weiteren Bedeutungsnuancen.
- issue: Bildhafte Rede vom Angesicht
  choice: Das konkrete Bild »dein Angesicht« beibehalten
  alternative: »deine Gegenwart«
  rationale: πρόσωπον bezeichnet unmittelbar das Gesicht beziehungsweise Angesicht. Eine Abstraktion zu »Gegenwart« würde die körperliche Bildsprache unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Angesicht« trägt den feierlichen Ton der höfischen Szene, bleibt aber allgemein verständlich. Die Formulierung folgt dem griechischen Ausgangstext und berücksichtigt, dass Ester hier den König und nicht Gott anspricht.
