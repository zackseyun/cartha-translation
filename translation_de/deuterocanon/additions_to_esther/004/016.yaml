  text: And the king was troubled[a], and all his attendants were comforting her.
translation:
  language: de
  text: Und der König war beunruhigt, und sein ganzes Gefolge sprach ihr Mut zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »tröstete sie« oder »redete ihr zu«. Das griechische Wort kann trösten, ermutigen, ermahnen oder zureden bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράσσετο
  choice: war beunruhigt
  rationale: Der Imperfekt bezeichnet eine andauernde innere Erregung oder Unruhe. »War beunruhigt« ist natürliches modernes Deutsch und legt weder Panik noch bloße Überraschung fest.
- source_word: πᾶσα ἡ θεραπεία αὐτοῦ
  choice: sein ganzes Gefolge
  rationale: θεραπεία bezeichnet hier kollektiv die Personen, die dem König am Hof persönlich aufwarteten. »Sein ganzes Gefolge« bewahrt den kollektiven Singular und passt zum höfischen Zusammenhang.
- source_word: παρεκάλει αὐτήν
  choice: sprach ihr Mut zu
  rationale: παρακαλέω kann je nach Zusammenhang ermutigen, trösten, ermahnen oder zureden bedeuten. »Sprach ihr Mut zu« gibt die unterstützende Zuwendung idiomatisch wieder, ohne eine ausdrückliche Aufforderung zum Handeln einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kollektive Ausdruck »sein ganzes Gefolge« vermeidet eine unnötige Aufzählung einzelner Bediensteter; »sprach ihr Mut zu« wahrt die Bedeutungsbreite des griechischen Verbs.
