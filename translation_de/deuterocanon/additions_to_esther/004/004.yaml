lexical_decisions:
- source_word: ἑτέρα
  choice: eine andere
  rationale: Die feminine Singularform bezeichnet eine weitere Frau, im Zusammenhang eine Begleiterin Esters. Die knappe Wiedergabe lässt die im Ausschnitt nicht ausdrücklich genannte Rolle offen.
- source_word: ἐπηκολούθει
  choice: folgte ihr
  rationale: Das Imperfekt beschreibt ein fortdauerndes Folgen. Das im Deutschen ergänzte „ihr“ ergibt sich aus dem Zusammenhang und macht die Beziehung natürlich verständlich.
- source_word: κουφίζουσα
  choice: erleichterte die Last
  rationale: Das Partizip von κουφίζω bezeichnet das Leichtermachen oder Entlasten. Die Formulierung bewahrt das griechische Bild, ohne eindeutig festzulegen, ob das Gewand angehoben, getragen oder anders entlastet wurde.
- source_word: τὴν ἔνδυσιν αὐτῆς
  choice: ihres Gewandes
  rationale: ἔνδυσις bezeichnet Kleidung oder Gewandung und kann kollektiv gebraucht sein. „Gewand“ passt zum erzählerischen Kontext und bildet zusammen mit „Last“ eine natürliche deutsche Wendung.
- source_word: καὶ αὐτὴ
  choice: und sie
  rationale: Die Worte eröffnen einen neuen Satzteil, der in diesem Verssegment unvollständig bleibt. Die Übersetzung ergänzt keinen Inhalt aus dem folgenden Abschnitt.
