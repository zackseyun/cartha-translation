lexical_decisions:
- source_word: ἐτηρείδετο
  choice: wurde behütet
  rationale: Das Imperfekt Passiv von τηρέω bezeichnet ein fortdauerndes Bewahren, Hüten oder Bewachen. „Behütet“ lässt offen, ob der Vorgang vor allem fürsorglich oder kontrollierend gemeint ist, und passt zum folgenden Vergleich.
- source_word: τρυφερευομένη
  choice: wie eine Verwöhnte
  rationale: Das Partizip bezeichnet ein Leben in Weichlichkeit oder Luxus beziehungsweise eine verwöhnte Behandlung. Die substantivierende Wiedergabe ist im Deutschen natürlich und bewahrt den vergleichenden Anschluss mit ὡς.
- source_word: καὶ τῇ μὲν μιᾷ ... ἡ δὲ
  choice: Und die eine ... die andere aber—
  rationale: Die korrelative Konstruktion stellt zwei weiblich bezeichnete Personen oder Größen einander gegenüber. Der Gedankenstrich erhält den am Segmentende unabgeschlossenen Gegensatz.
