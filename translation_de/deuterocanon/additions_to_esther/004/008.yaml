  text: And God changed the king’s spirit to gentleness[a], and in anguish he sprang up from his throne and took her into his arms until she recovered[c][b], and he comforted her with peaceful words.
translation:
  language: de
  text: Und Gott verwandelte den Geist des Königs in Sanftmut[a]. In seiner Angst sprang er von seinem Thron auf, nahm sie in seine Arme, bis sie wieder zu sich kam[b], und tröstete sie mit Worten des Friedens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gesinnung des Königs“ oder „das Gemüt des Königs“; griechisch „Geist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis sie sich wieder gefasst hatte“ beziehungsweise „bis sie wieder festen Halt hatte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit beruhigenden Worten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέβαλεν
  choice: wandelte
  rationale: Das Verb bezeichnet eine Veränderung; „wandelte“ gibt Gottes unmittelbares Wirken würdig und prägnant wieder.
- source_word: τὸ πνεῦμα τοῦ βασιλέως
  choice: den Geist des Königs
  rationale: Die formnahe Wiedergabe bewahrt die Aussage über die innere Verfassung des Königs, ohne sie auf „Gesinnung“ oder „Gemüt“ festzulegen.
- source_word: εἰς πραύτητα
  choice: zur Sanftmut
  rationale: „Sanftmut“ entspricht der milden, nicht harten Haltung, die πραΰτης hier bezeichnet, und behält den abstrakten Ausdruck der Vorlage bei.
- source_word: ἀγωνιάσας
  choice: in seiner Angst
  rationale: Das Partizip bezeichnet starke innere Bedrängnis oder Angst; die adverbiale Wendung fügt sich natürlich in den deutschen Satz.
- source_word: ἀνεπήδησεν
  choice: sprang ... auf
  rationale: Die Wiedergabe vermittelt die plötzliche, heftige Bewegung vom Thron.
- source_word: ἀνέλαβεν αὐτὴν ἐπὶ τὰς ἀγκάλας αὐτοῦ
  choice: nahm sie in seine Arme
  rationale: Dies ist die natürliche deutsche Wiedergabe der konkreten Handlung und des stützenden Umfassens.
- source_word: μέχρις οὗ κατέστη
  choice: bis sie wieder zu sich kam
  rationale: Im Erzählzusammenhang bezeichnet κατέστη ihre Rückkehr zu einem gefassten oder stabilen Zustand; die Formulierung bleibt verständlich, während eine Fußnote die engere Alternative nennt.
- source_word: παρεκάλει
  choice: tröstete
  rationale: Das Imperfekt beschreibt fortgesetztes beruhigendes Zureden; „tröstete“ passt zu Esters Bedrängnis.
- source_word: λόγοις εἰρηνικοῖς
  choice: mit friedlichen Worten
  rationale: Die formnahe Wendung bewahrt den ausdrücklichen Bezug zu Frieden; idiomatischere Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Gottes Einwirkung auf das Innere des Königs
  choice: Gott wandelte den Geist des Königs zur Sanftmut
  alternative: Gott änderte die Gesinnung des Königs und machte ihn milde
  rationale: Die Übersetzung erhält sowohl Gottes ausdrücklich zugeschriebene unmittelbare Wirksamkeit als auch das semantisch offene πνεῦμα, ohne den Vorgang rein psychologisch zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Lesbarkeit nach dem ersten griechischen Hauptsatz geteilt. Die konkrete Bewegung und die theologisch bedeutsame Aussage über Gottes Handeln bleiben erhalten.
