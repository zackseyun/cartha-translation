base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/004/001.yaml
  text: And it happened on the third day[a], when she had stopped praying, that she took off the garments of her service and put on her splendor[b];
translation:
  language: de
  text: 'Und es geschah am dritten Tag: Als sie aufgehört hatte zu beten, legte sie die Gewänder ihres Dienstes[a] ab und kleidete sich in ihre Pracht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gewänder ihrer Aufwartung / ihrer frommen Verrichtung“. Das griechische Wort kann Dienst, Aufwartung oder eine gottesdienstliche beziehungsweise fromme Verrichtung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Herrlichkeit“. Gemeint ist hier wahrscheinlich ihre prachtvolle königliche Kleidung oder Erscheinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγενήθη
  choice: Und es geschah
  rationale: Die griechische Erzählformel wird in einem würdigen, gut verständlichen Deutsch wiedergegeben und leitet den neuen Handlungsschritt ein.
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: am dritten Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der griechischen Zeitangabe.
- source_word: ὡς ἐπαύσατο προσευχομένη
  choice: Als sie aufgehört hatte zu beten
  rationale: Die Formulierung wahrt, dass Esters Beten beendet war, bevor sie die Kleider wechselte; das Plusquamperfekt macht diese zeitliche Abfolge im Deutschen deutlich.
- source_word: ἐξεδύσατο τὰ ἱμάτια
  choice: legte sie die Gewänder … ab
  rationale: „Ablegen“ ist bei Gewändern idiomatisch; „Gewänder“ entspricht dem gehobenen Ton der Szene, ohne altertümlich zu wirken.
- source_word: τῆς θεραπείας
  choice: ihres Dienstes
  rationale: θεραπεία kann Dienst, Aufwartung oder eine gottesdienstliche beziehungsweise fromme Verrichtung bezeichnen. Die breite Wiedergabe „Dienst“ legt den genauen Bezug nicht unnötig fest.
- source_word: περιεβάλετο
  choice: kleidete sich in
  rationale: Die Wendung gibt das Anlegen beziehungsweise Umhüllen mit etwas wieder und bewahrt zugleich das bildhafte Zusammenspiel mit „Pracht“.
- source_word: τὴν δόξαν αὐτῆς
  choice: ihre Pracht
  rationale: Im Zusammenhang des Kleiderwechsels bezeichnet δόξα wahrscheinlich Esters sichtbare königliche Pracht. „Pracht“ ist hier natürlicher als das stärker abstrakt oder theologisch klingende „Herrlichkeit“.
theological_decisions:
- issue: Bedeutung von τῆς θεραπείας beim Kleiderwechsel Esters
  choice: „ihres Dienstes“ als bewusst breite Bezeichnung der mit Gebet und demütiger Verrichtung verbundenen Gewänder
  alternative: „ihres Gottesdienstes“, „ihrer Aufwartung“ oder „ihrer frommen Verrichtung“
  rationale: Der unmittelbare Zusammenhang verbindet die Gewänder mit Esters Gebet, doch θεραπεία benennt nicht eindeutig einen förmlichen Gottesdienst. Die Übersetzung wahrt diese Offenheit.
- issue: Bedeutung von τὴν δόξαν αὐτῆς
  choice: „ihre Pracht“ als sichtbare königliche Erscheinung beziehungsweise Kleidung
  alternative: „ihre Herrlichkeit“
  rationale: Da Esther gerade ihre Gewänder wechselt, liegt der konkrete Sinn königlicher Ausstattung nahe. Die mögliche wörtlichere Wiedergabe wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eröffnende Erzählformel bleibt erkennbar; der Doppelpunkt gliedert den langen griechischen Satz natürlich. Die ungewöhnliche Verbindung „Gewänder ihres Dienstes“ wurde beibehalten, um die Mehrdeutigkeit von θεραπεία nicht durch eine konfessionell oder kultisch engere Formulierung aufzulösen.
