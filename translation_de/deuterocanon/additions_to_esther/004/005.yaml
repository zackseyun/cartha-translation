translation:
  language: de
  text: Sie errötete in voller Blüte ihrer Schönheit[a], und ihr Gesicht war heiter und freundlich[b]; doch ihr Herz war vor Angst zugeschnürt.
  philosophy: optimal-equivalence
  footnotes:
