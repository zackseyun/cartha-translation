lexical_decisions:
- source_word: ἐρυθριῶσα
  choice: Sie errötete
  rationale: Das Partizip bezeichnet ein sichtbares Rotwerden. „Errötete“ gibt das körperliche Bild natürlich und direkt wieder.
- source_word: ἀκμῇ κάλλους αὐτῆς
  choice: auf der Höhe ihrer Schönheit
  rationale: ἀκμή bezeichnet Höhepunkt oder volle Entfaltung; zusammen mit κάλλος ist die sachlich-nahe Wendung „auf der Höhe ihrer Schönheit“ angemessen und bewahrt den Bezug des Griechischen.
- source_word: τὸ πρόσωπον αὐτῆς ἱλαρόν
  choice: ihr Gesicht war heiter
  rationale: ἱλαρός kann heiter, freundlich oder strahlend bedeuten. „Heiter“ wahrt den Ausdruck eines nach außen gelösten Gesichtes und bildet einen deutlichen Gegensatz zur inneren Angst.
- source_word: ὡς προσφιλές
  choice: als wäre es freundlich zugewandt
  rationale: προσφιλής umfasst „lieb, willkommen, angenehm, freundlich“. Die Formulierung bezieht sich grammatisch auf das Gesicht; „als wäre es freundlich zugewandt“ erhält die vergleichende beziehungsweise den Anschein bezeichnende Kraft von ὡς, ohne zu behaupten, Esther selbst sei geliebt.
- source_word: ἡ δὲ καρδία αὐτῆς ἀπεστενωμένη
  choice: doch ihr Herz war ... wie zugeschnürt
  rationale: ἀπεστενωμένη vermittelt das Bild des Verengens oder Zusammenpressens. Die deutsche Wendung „wie zugeschnürt“ bewahrt diese körperlich-metaphorische Kraft und klingt natürlicher als „verengt“.
- source_word: ἀπὸ τοῦ φόβου
  choice: vor Angst
  rationale: ἀπό bezeichnet hier Ursache oder Ausgangspunkt. „Vor Angst“ ist im Deutschen die idiomatische und knappe Wiedergabe.
