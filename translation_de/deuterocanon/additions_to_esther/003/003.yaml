  text: denn du hast Himmel und Erde gemacht und alles Wunderbare unter dem Himmel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles, was unter dem Himmel bestaunt wird“; das griechische Partizip bezeichnet etwas, das wunderbar ist oder bestaunt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: denn
  rationale: Im Gebetszusammenhang leitet ὅτι die Begründung für das Vorhergehende ein. „Denn“ wahrt diesen kausalen Anschluss und klingt in würdevoller Gebetssprache natürlich.
- source_word: ἐποίησας
  choice: hast … gemacht
  rationale: ποιέω bezeichnet hier Gottes Machen von Himmel und Erde. „Gemacht“ bleibt näher am allgemeinen griechischen Verb als das theologisch stärker festgelegte „geschaffen“.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: Himmel und Erde
  rationale: Die artikellose deutsche Wendung ist idiomatisch und gibt die umfassende Schöpfungsformel treffend wieder.
- source_word: πᾶν θαυμαζόμενον
  choice: alles Wunderbare
  rationale: Das substantivierte singularische Partizip bezeichnet in umfassendem Sinn alles, was Staunen hervorruft beziehungsweise wunderbar ist. „Alles Wunderbare“ ist natürlich und bewahrt beide Bedeutungsseiten.
- source_word: ἐν τῇ ὑπʼ οὐρανόν
  choice: unter dem Himmel
  rationale: Die verkürzte griechische Wendung bezeichnet den Bereich unterhalb des Himmels. „Unter dem Himmel“ ist im Deutschen klar und idiomatisch.
theological_decisions:
- issue: Reichweite der Schöpfungsaussage
  choice: Die Formulierung umfasst Himmel und Erde sowie alles Wunderbare unter dem Himmel.
  alternative: ἐποίησας mit „geschaffen“ wiedergeben oder θαυμαζόμενον konkretisierend als „Schöpfungswerk“ verstehen.
  rationale: Der Text spricht umfassend von Gottes Machen, verwendet jedoch weder ein ausschließlich technisches Schöpfungsverb noch ein Substantiv für „Schöpfung“. Die Übersetzung wahrt diese Weite, ohne die Aussage dogmatisch zu präzisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Gebetston. „Denn“ bindet den Vers an den vorausgehenden Kontext; „alles Wunderbare“ vermeidet eine schwerfällige wörtliche Partizipialkonstruktion.
