  text: Do not overlook your portion[a], which I redeemed for myself out of the land of Egypt.
translation:
  language: de
  text: Übersieh nicht deinen Anteil[a], den du dir selbst aus dem Land Ägypten erlöst hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Erbteil“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: Sieh nicht … hinweg
  rationale: 'Die Wendung bewahrt das Bild und den prohibitivischen Sinn von ὑπεροράω: etwas übersehen, unbeachtet lassen oder vernachlässigen.'
- source_word: τὴν μερίδα σου
  choice: deinen Anteil
  rationale: μερίς bezeichnet einen Anteil oder ein Teilgut. „Anteil“ lässt mögliche bundesbezogene Anklänge offen, ohne ausdrücklich „Erbteil“ oder „Volk“ einzusetzen.
- source_word: σεαυτῷ
  choice: dir selbst
  rationale: Der reflexive Dativ hebt hervor, dass Gott diesen Anteil für sich selbst erworben bzw. erlöst hat.
- source_word: ἐλυτρώσω
  choice: du … erlöst hast
  rationale: ἐλυτρώσω ist hier die zweite Person Singular des Aorists im Medium von λυτρόω und bezieht sich in der an Gott gerichteten Bitte auf Gottes Erlösungshandeln.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: aus dem Land Ägypten
  rationale: Die vollständige biblische Auszugsformel wird in natürlichem modernem Deutsch erhalten.
theological_decisions:
- issue: Bundes- und Besitzanklang von μερίς
  choice: deinen Anteil
  alternative: dein Erbteil; dein Volk als dein Eigentum
  rationale: Der griechische Text nennt den Angeredeten Gottes „Anteil“, ohne das Bild ausdrücklich als Erbteil, Eigentum oder Volk auszudeuten.
- issue: Person und reflexiver Bezug von ἐλυτρώσω σεαυτῷ
  choice: den du dir selbst … erlöst hast
  alternative: den du für dich selbst … erlöst hast
  rationale: Die zweite Person des Verbs und der auf das angeredete Gegenüber bezogene Reflexivdativ werden direkt wiedergegeben. Dadurch bleibt die Aussage eine an Gott gerichtete Erinnerung an sein eigenes Erlösungshandeln.
translation_notes:
  register: Dignige, moderne Gebetssprache. Die leicht ungewöhnliche Verbindung von „Anteil“ und „erlösen“ bleibt erhalten, weil sie die knappe Besitz- und Bundesmetaphorik des griechischen Textes trägt.
