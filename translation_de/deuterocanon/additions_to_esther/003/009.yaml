  source_fidelity: Die Anrede im Singular, das Verbot μὴ ὑπερίδῃς, „deinen Anteil“ für τὴν μερίδα σου sowie die Vergangenheitsaussage „den du dir selbst ... erlöst hast“ geben den griechischen Text zutreffend wieder. Der Reflexivdativ σεαυτῷ ist sachgerecht auf den angeredeten Gott bezogen. Die Fußnote wahrt die mögliche Nuance von μερίς.
  naturalness: „Sieh nicht über deinen Anteil hinweg“ ist zwar verständlich, im heutigen Standarddeutsch aber weniger idiomatisch und kann zudem den Beiklang eines großzügigen Hinwegsehens haben. „Übersieh nicht deinen Anteil“ ist knapper, natürlich und trifft die Bedeutung „nicht außer Acht lassen / nicht vernachlässigen“ besser.
  terminology: „Anteil“ ist als offene Wiedergabe von μερίς gut gewählt; „Erbteil“ bleibt zu Recht als Alternative in der Anmerkung. „Erlösen“ bewahrt die exodische und theologisch gewichtige Sprache von λυτρόω, ohne sie auszudeuten.
