base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/012.yaml
  text: And taking off her garments of glory[a], she put on garments of distress and mourning; and instead of splendid perfumes, she filled her head with ashes and dung, and she humbled her body greatly[c][b], and every place of her joyful adornment she filled with the twisting of her hair.
translation:
  language: de
  text: Und sie legte ihre Prachtgewänder ab und zog Kleider der Bedrängnis und Trauer an. Statt der prunkvollen Duftmittel[a] füllte sie ihr Haupt mit Asche und Mist[b], demütigte ihren Körper sehr und füllte jede Stelle ihres festlichen Schmucks mit ihren gedrehten Haaren[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „statt der hochmütigen Duftmittel“. Gemeint sind wahrscheinlich kostbare, auffällige Duftstoffe oder Salben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „sie bedeckte ihr Haupt mit Asche und Mist“. Im Griechischen steht ungewöhnlich: „sie füllte ihr Haupt“.'
    reason: lexical_alternative
  - marker: c
    text: Die griechische Schlusswendung ist schwer verständlich. Sie kann besagen, dass ihr Haar nun gedreht, wirr oder ungeordnet die Stellen bedeckte, die sie sonst festlich schmückte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφελομένη τὰ ἱμάτια τῆς δόξης αὐτῆς
  choice: sie legte ihre Prachtgewänder ab
  rationale: Das Partizip bezeichnet Esters bewusstes Ablegen ihrer prächtigen, ihrem Rang entsprechenden Kleidung. „Prachtgewänder“ gibt den Sinn des Genitivs τῆς δόξης natürlich und knapp wieder.
- source_word: ἱμάτια στενοχωρίας καὶ πένθους
  choice: Kleider der Bedrängnis und Trauer
  rationale: „Bedrängnis“ bewahrt die Enge- und Notvorstellung von στενοχωρία; „Trauer“ entspricht πένθος und bezeichnet hier auch den sichtbaren Trauerzustand.
- source_word: ἀντὶ τῶν ὑπερηφάνων ἡδυσμάτων
  choice: statt der prunkvollen Duftmittel
  rationale: ἡδύσματα sind wohlriechende Mittel, Gewürze, Salben oder Parfüms. Das wörtlich „hochmütig/stolz“ bedeutende ὑπερήφανος beschreibt hier wahrscheinlich deren kostbaren, demonstrativen Prunk; „prunkvoll“ ist im Deutschen verständlich, ohne die Bildhaftigkeit ganz einzuebnen.
- source_word: σποδοῦ καὶ κοπριῶν ἔπλησεν τὴν κεφαλήν
  choice: füllte sie ihr Haupt mit Asche und Mist
  rationale: Die ungewöhnliche Wendung hält am ausdrücklichen ἔπλησεν („füllte“) fest. „Mist“ gibt κοπρίων unverhüllt wieder und bewahrt die drastische Selbsterniedrigung.
- source_word: τὸ σῶμα ἐταπείνωσεν σφόδρα
  choice: demütigte ihren Körper sehr
  rationale: Die Formulierung wahrt das konkrete Objekt „Körper“ und die Grundbedeutung von ταπεινόω, ohne ein bestimmtes, im Text nicht genanntes Trauerritual einzutragen.
- source_word: πάντα τόπον κόσμου ἀγαλλιάματος αὐτῆς
  choice: jede Stelle ihres festlichen Schmucks
  rationale: κόσμος bedeutet hier Schmuck oder Zierde, nicht „Welt“; ἀγαλλίαμα bezeichnet Freude oder Jubel. „Festlicher Schmuck“ bringt beides in natürlichem Deutsch zusammen.
- source_word: στρεπτῶν τριχῶν αὐτῆς
  choice: mit ihren gedrehten Haaren
  rationale: στρεπτός verweist auf Drehen oder Winden. Die zurückhaltend wörtliche Wiedergabe vermeidet es, die textlich schwierige Wendung vorschnell als zerzaustes oder ausgerissenes Haar festzulegen.
theological_decisions:
- issue: Körperlichkeit und Drastik von Esters Trauer
  choice: Die Bilder „Asche und Mist“ sowie „demütigte ihren Körper“ bleiben unverhüllt erhalten.
  alternative: Die Ausdrücke zu „Asche und Schmutz“ oder allgemein zu „sie trauerte tief“ abschwächen.
  rationale: Der griechische Text betont eine radikale, körperlich vollzogene Erniedrigung. Eine Verallgemeinerung würde seine Spannung und Eindringlichkeit mindern.
- issue: Deutung der schwierigen Schlusswendung στρεπτῶν τριχῶν αὐτῆς
  choice: Im Haupttext steht die konservative Wiedergabe „mit ihren gedrehten Haaren“, ergänzt durch eine erklärende Fußnote.
  alternative: „mit ihrem wirren Haar“ oder „indem sie ihr Haar zerzauste“.
  rationale: Der Trauerkontext legt ungeordnetes Haar nahe, doch der Wortlaut benennt das Zerzausen nicht eindeutig. Deshalb bleibt die mögliche Mehrdeutigkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Bildkraft. „Haupt“ trägt die feierlich-literarische Färbung der Szene; die syntaktisch und lexikalisch schwierige Schlusswendung wird nicht stillschweigend geglättet.
