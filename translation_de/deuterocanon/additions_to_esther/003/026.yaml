base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/026.yaml
  text: You know my distress[a], that I loathe the sign of my pride, which is upon my head in the days of my appearance; I loathe it like a menstrual cloth[e][d][c][b], and I do not wear it in the days of my rest.
translation:
  language: de
  text: 'Du kennst meine Bedrängnis[a]: Ich verabscheue das Zeichen meines Hochmuts, das sich an den Tagen meines öffentlichen Auftretens auf meinem Kopf befindet.[b][c] Ich verabscheue es wie einen Menstruationslappen[d] und trage es nicht in den Tagen meiner Ruhe.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Not“ oder „meine Zwangslage“. Das griechische Wort kann auch „Notwendigkeit“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Das „Zeichen meines Hochmuts“ meint wahrscheinlich Esters königlichen Kopfschmuck oder ein anderes Statuszeichen; der griechische Text benennt den Gegenstand nicht genauer.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: „an den Tagen meiner Erscheinung“, das heißt wohl, wenn Ester öffentlich oder am Hof erscheint.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich etwa: „wie einen Menstruationslappen“. Der griechische Ausdruck ist bewusst drastisch und bringt starken Abscheu zum Ausdruck.'
    reason: lexical_alternative
  - marker: e
    text: 'Oder: „in den Tagen meiner Stille“ oder „Zurückgezogenheit“; gemeint ist offenbar die Zeit außerhalb ihrer öffentlichen Auftritte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγκην
  choice: Bedrängnis
  rationale: Das Substantiv kann Notwendigkeit, Zwangslage, Not oder Bedrängnis bezeichnen. Im Gebet Esters steht ihre bedrängende Lage im Vordergrund; „Bedrängnis“ ist natürlich und wahrt die semantische Spannung.
- source_word: βδελύσσομαι
  choice: verabscheue
  rationale: Das Verb bezeichnet starken Abscheu. „Verabscheuen“ gibt diese Intensität in würdigem, heutigem Deutsch wieder.
- source_word: σημεῖον τῆς ὑπερηφανίας μου
  choice: Zeichen meines Hochmuts
  rationale: Die Formulierung bleibt nah am Griechischen und legt den Gegenstand nicht vorschnell als Krone oder Diadem fest. „Hochmut“ bewahrt den negativen Sinn von ὑπερηφανία.
- source_word: ἐν ἡμέραις ὀπτασίας μου
  choice: an den Tagen meines öffentlichen Auftretens
  rationale: ὀπτασία kann sonst eine Erscheinung oder Vision bezeichnen; hier weist der Gegensatz zur privaten Ruhe auf die Gelegenheiten, bei denen Ester vor anderen erscheint. „Öffentliches Auftreten“ macht diesen kontextuellen Sinn verständlich.
- source_word: ῥάκος καταμηνίων
  choice: Tuch mit Menstruationsblut
  rationale: Die griechische Wendung ist bewusst drastisch und bezeichnet einen im Zusammenhang mit der Menstruation verwendeten beziehungsweise befleckten Stofffetzen. Die Wiedergabe bleibt ausdrücklich, klingt im Deutschen aber natürlicher als „Menstruationslappen“.
- source_word: φορῶ
  choice: trage
  rationale: Für einen am Kopf befindlichen Schmuck oder ein Statuszeichen ist „tragen“ die natürliche deutsche Entsprechung.
- source_word: ἐν ἡμέραις ἡσυχίας μου
  choice: an den Tagen, an denen ich ungestört bin
  rationale: ἡσυχία umfasst Ruhe, Zurückgezogenheit und Ungestörtheit. Die Formulierung verdeutlicht den Gegensatz zum öffentlichen Auftreten, ohne bloß körperliche Erholung zu behaupten.
theological_decisions:
- issue: Art des von Ester abgelehnten Gegenstands
  choice: Allgemeines Zeichen ihres königlichen Hochmuts beziehungsweise Status, ohne nähere Benennung
  alternative: Krone, Diadem oder Kopfschmuck
  rationale: Der griechische Text nennt lediglich ein „Zeichen“ auf ihrem Kopf. Eine genauere Bestimmung würde über den Wortlaut hinausgehen.
- issue: Deutlichkeit des Menstruationsvergleichs
  choice: Die ausdrückliche Menstruationsbildlichkeit bleibt im Haupttext erhalten.
  alternative: unreines Tuch oder schmutziger Lappen
  rationale: Der Ausgangstext benennt die Menstruation ausdrücklich und verwendet das Bild, um Esters heftigen Abscheu auszudrücken. Eine Euphemisierung würde die Aussage abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist verständlich, bewahrt aber die starke Abscheusprache und die Unbestimmtheit des königlichen Kopfzeichens. Die Satzteilung erhöht die Lesbarkeit; die Fußnotenmarker stehen jeweils an der inhaltlich einschlägigen Stelle.
