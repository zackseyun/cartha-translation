  source_fidelity: Die wesentlichen Begriffe sind zutreffend wiedergegeben. Allerdings macht „das ich ... trage“ die Relativbestimmung des Griechischen aktiver und nimmt die spätere Aussage „ich trage es nicht“ vorweg. „Ungestört bin“ verengt ἡσυχία unnötig auf eine mögliche Störung durch andere. Auch „Tuch mit Menstruationsblut“ legt Blut als Beschaffenheit des Tuchs stärker fest, als der Ausdruck „Menstruationslappen“ bzw. „Lappen der Menstruation“ verlangt.
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „in den Tagen meiner Ruhe“ ist hier natürlicher und zugleich näher am griechischen Kontrast zu den öffentlichen Auftritten als die umschreibende Formulierung „an den Tagen, an denen ich ungestört bin“.
  terminology: „Bedrängnis“, „verabscheue“ und „Zeichen meines Hochmuts“ treffen Sinn und Register. Die Unbestimmtheit des Kopfzeichens soll bewahrt werden; der drastische Menstruationsvergleich darf nicht euphemisiert, aber auch nicht durch die zusätzliche Angabe „mit ... Blut“ konkretisiert werden.
