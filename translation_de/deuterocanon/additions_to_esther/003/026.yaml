revisions:
- from: 'Du kennst meine Bedrängnis[a]: Ich verabscheue das Zeichen meines Hochmuts, das ich an den Tagen meines öffentlichen Auftretens auf dem Kopf trage.[b][c] Ich verabscheue es wie ein Tuch mit Menstruationsblut[d] und trage es nicht an den Tagen, an denen ich ungestört bin.[e]'
  to: 'Du kennst meine Bedrängnis[a]: Ich verabscheue das Zeichen meines Hochmuts, das sich an den Tagen meines öffentlichen Auftretens auf meinem Kopf befindet.[b][c] Ich verabscheue es wie einen Menstruationslappen[d] und trage es nicht in den Tagen meiner Ruhe.[e]'
  rationale: 'Die Revision bewahrt die inhaltliche Unbestimmtheit des griechischen Textes: Das Kopfzeichen befindet sich bei den öffentlichen Auftritten auf Esters Kopf, ohne dass die Relativkonstruktion schon als Verb „tragen“ formuliert wird. Die zweite ausdrückliche Aussage über das Nichttragen bleibt dadurch klar erhalten. „Ruhe“ gibt ἡσυχία breit und idiomatisch wieder; „Menstruationslappen“ behält die explizite und abstoßende Bildsprache bei, ohne Blut als zusätzliche Einzelheit einzutragen.'
