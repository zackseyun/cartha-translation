base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/029.yaml
  text: O God[a], who are mighty over all, hear the voice of those who have lost hope, and rescue us from the hand of those who do evil, and rescue me from my fear.
translation:
  language: de
  text: O Gott, der du mächtig bist über alle, höre die Stimme derer, die alle Hoffnung verloren haben, und rette uns aus der Hand derer, die Böses tun, und rette mich aus meiner Furcht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »rette mich vor dem, was ich fürchte«. Das Griechische kann sowohl Esters Furcht selbst als auch die Gefahr bezeichnen, vor der sie sich fürchtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς ὁ ἰσχύων ἐπὶ πάντας
  choice: O Gott, der du mächtig bist über alle
  rationale: Der artikulierte Nominativ dient im Gebet als Anrede. Die Relativkonstruktion ist im Deutschen natürlich und gibt Gottes über alle reichende Macht wieder, ohne πάντας unnötig auf Menschen zu beschränken.
- source_word: εἰσάκουσον φωνὴν ἀπηλπισμένων
  choice: höre die Stimme derer, die alle Hoffnung verloren haben
  rationale: εἰσάκουσον bezeichnet das erhörende Hören einer Bitte. Die Formulierung für ἀπηλπισμένων bewahrt den Zustand eingetretener Hoffnungslosigkeit und das Pathos des griechischen Perfekts.
- source_word: ῥῦσαι ἡμᾶς
  choice: rette uns
  rationale: ῥύομαι meint die Rettung oder Befreiung aus einer konkreten Gefahr. „Rette“ ist gegenwärtig, klar und kräftig.
- source_word: ἐκ χειρὸς τῶν πονηρευομένων
  choice: aus der Hand derer, die Böses tun
  rationale: „Aus der Hand“ erhält das griechische Bild feindlicher Gewalt; die partizipiale Wendung wird verständlich wiedergegeben, ohne die böse Tätigkeit näher zu bestimmen als der Ausgangstext.
- source_word: καὶ ῥῦσαί με ἐκ τοῦ φόβου μου
  choice: und rette mich aus meiner Furcht
  rationale: Die Wiederholung von „rette“ wahrt den Parallelismus. „Aus meiner Furcht“ folgt der nächstliegenden Bedeutung, lässt aber offen, ob der innere Zustand oder metonymisch die gefürchtete Gefahr gemeint ist.
theological_decisions:
- issue: Bezeichnet ἐκ τοῦ φόβου μου die innere Furcht oder die gefürchtete äußere Gefahr?
  choice: aus meiner Furcht
  alternative: vor dem, was ich fürchte
  rationale: Die knappe griechische Wendung erlaubt beide Deutungen. Der Haupttext bleibt möglichst nah an ihrer Form; die Fußnote bewahrt die sachlich mögliche alternative Lesart, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die direkte Anrede mit „O Gott“ und „der du“ trägt den feierlichen Ton, während „rette“ und „die Böses tun“ allgemein verständlich bleiben. Die wiederholte Bitte wurde entsprechend dem griechischen Parallelismus beibehalten.
