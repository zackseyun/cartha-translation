base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/021.yaml
  text: Do not hand over your scepter[a], Lord, to those who do not exist, and do not let them gloat over our downfall; instead, turn their plan against them, and make an example of the one who began this attack against us.
translation:
  language: de
  text: Überlass, Herr, dein Zepter nicht denen, die nicht sind[a], und lass sie nicht über unseren Fall spotten. Kehre vielmehr ihren Plan gegen sie selbst, und statuier an dem, der gegen uns den Anfang gemacht hat, ein Exempel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Nichtigen“ oder „denen, die nichts sind“. Wörtlich steht im Griechischen: „denen, die nicht sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ παραδῷς
  choice: Überlass ... nicht
  rationale: παραδίδωμι bezeichnet ein Übergeben oder Ausliefern. „Überlassen“ gibt hier natürlich wieder, dass Herrschaft oder Verfügungsgewalt in fremde Hände gelangen soll.
- source_word: τὸ σκῆπρόν σου
  choice: dein Zepter
  rationale: σκῆπτρον bezeichnet wörtlich das Zepter als Zeichen königlicher Herrschaft. Das konkrete und theologisch bedeutsame Bild bleibt erhalten.
- source_word: τοῖς μὴ οὖσιν
  choice: denen, die nicht sind
  rationale: Die Wendung bedeutet wörtlich „den Nichtseienden“. Die gewählte Form bewahrt die auffällige ontologische und möglicherweise polemische Aussage, ohne sie auf bloße Bedeutungslosigkeit festzulegen.
- source_word: μὴ καταγελασάτωσαν
  choice: lass sie nicht ... spotten
  rationale: καταγελάω bedeutet über jemanden lachen, ihn verhöhnen oder verspotten. „Spotten“ wahrt den feindseligen Sinn und ist in einem würdevollen Gebet natürlich.
- source_word: ἐν τῇ πτώσει ἡμῶν
  choice: über unseren Fall
  rationale: πτῶσις heißt wörtlich „Fall“ und kann hier den Untergang oder Zusammenbruch der Gemeinschaft bezeichnen. „Fall“ erhält diese Bedeutungsbreite.
- source_word: στρέψον τὴν βουλὴν αὐτῶν ἐπʼ αὐτούς
  choice: Kehre vielmehr ihren Plan gegen sie selbst
  rationale: βουλή kann Rat, Absicht oder Plan bedeuten. Im Zusammenhang einer feindlichen Unternehmung ist „Plan“ klar; „gegen sie selbst“ gibt die rückwirkende Stoßrichtung von ἐπʼ αὐτούς wieder.
- source_word: τὸν δὲ ἀρξάμενον ἐφʼ ἡμᾶς
  choice: den, der den Angriff gegen uns begonnen hat
  rationale: ἀρξάμενον bezeichnet denjenigen, der etwas begann oder einleitete. Das im Griechischen nur aus dem feindlichen Zusammenhang erschlossene Objekt wird mit „den Angriff“ im Deutschen ausdrücklich gemacht.
- source_word: παραδειγμάτισον
  choice: mach ... zum abschreckenden Beispiel
  rationale: παραδειγματίζω kann bedeuten, jemanden öffentlich bloßzustellen oder an ihm ein Exempel zu statuieren. Die Wiedergabe drückt eine öffentlich wirksame Strafhandlung aus, ohne deren konkrete Form festzulegen.
theological_decisions:
- issue: Bedeutung von τοῖς μὴ οὖσιν
  choice: denen, die nicht sind
  alternative: den Nichtigen; denen, die nichts sind
  rationale: Die ungewöhnlich schroffe griechische Formulierung kann die Gegner als nichtig oder ohne wahres Sein bezeichnen und möglicherweise eine theologische Polemik enthalten. Der Haupttext bewahrt diese Spannung, statt sie durch eine eindeutige Deutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der Gebetsanrede „Herr“. Die konkreten Bilder „Zepter“ und „Fall“ bleiben erhalten; nur beim impliziten Gegenstand von ἀρξάμενον wird zur natürlichen Verständlichkeit „den Angriff“ ergänzt.
