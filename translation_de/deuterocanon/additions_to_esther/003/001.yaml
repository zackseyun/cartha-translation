translation:
  language: de
  text: Und er flehte zum Herrn und gedachte dabei aller Taten des Herrn,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  choice: flehte
  rationale: Das Verb bezeichnet hier eine eindringliche Bitte. „Flehte“ bewahrt diese Intensität und ist in modernem, würdigem Deutsch natürlich.
- source_word: Κυρίου
  choice: zum Herrn
  rationale: Nach „flehen“ ist die Verbindung mit „zu“ im Deutschen idiomatisch; κύριος wird als „Herr“ wiedergegeben.
- source_word: μνημονεύων
  choice: gedachte dabei
  rationale: Das begleitende Partizip bezeichnet eine gleichzeitig mit dem Flehen erfolgende Erinnerung. „Gedachte dabei“ lässt offen, ob dies innerlich oder ausgesprochen geschah.
- source_word: πάντα τὰ ἔργα
  choice: aller Taten
  rationale: „Aller“ gibt den umfassenden Sinn von πάντα wieder. „Taten“ bezeichnet Gottes wirksames Handeln hier natürlicher als das im Deutschen missverständliche „Werke“.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Die Wiederholung von κύριος im griechischen Text bleibt ausdrücklich erhalten.
theological_decisions:
- issue: Wiedergabe von κύριος in der griechischen Gebetssprache
  choice: Herr
  alternative: HERR; Gebieter
  rationale: Der unmittelbare griechische Text bietet κύριος. „Herr“ wahrt die Gebetsanrede, ohne eigenständig eine Wiedergabe des Gottesnamens oder eine abgeschwächte Bedeutung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem biblischem Register. Die Wiederholung „Herr … Herr“ und die offene Beziehung des Partizips zum Flehen werden bewahrt; das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeht.
