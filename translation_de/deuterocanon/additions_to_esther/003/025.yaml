base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/025.yaml
  text: And you know that I hated the glory of the lawless[a], and I abhor the bed of the uncircumcised and of every foreigner.
translation:
  language: de
  text: Und du weißt, dass ich die Herrlichkeit der Gesetzlosen gehasst habe und das Bett[a] der Unbeschnittenen und eines jeden Fremden verabscheue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Ehebett« oder »geschlechtliche Gemeinschaft«; das griechische Wort für »Bett« kann metonymisch für eheliche oder sexuelle Beziehungen stehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμίσησα
  choice: ich … gehasst habe
  rationale: Der Aorist wird als zurückblickende Aussage wiedergegeben. Das Perfekt klingt im modernen Deutschen natürlich und bewahrt die starke Bedeutung von »hassen«.
- source_word: δόξαν
  choice: die Herrlichkeit
  rationale: Das Wort bezeichnet hier Ruhm, Glanz oder hohen Rang. »Herrlichkeit« bewahrt den gehobenen Ton und lässt die genaue Art dieses Ansehens offen.
- source_word: ἀνόμων
  choice: der Gesetzlosen
  rationale: Die substantivierte Bezeichnung hält den ausdrücklichen Bezug auf Gesetzlosigkeit fest und verallgemeinert ihn nicht zu »Bösen«.
- source_word: βδελύσσομαι
  choice: verabscheue
  rationale: Das Präsens und die starke Abscheu des griechischen Verbs werden unmittelbar und in würdigem, heutigem Deutsch wiedergegeben.
- source_word: κοίτην
  choice: das Lager
  rationale: »Lager« bewahrt das griechische Bild eines Bettes, kann aber wie das griechische Wort zugleich eheliche oder sexuelle Gemeinschaft bezeichnen, ohne diese ausdrücklich festzulegen.
- source_word: ἀπεριτμήτων
  choice: der Unbeschnittenen
  rationale: Die substantivierte Pluralform entspricht dem im Griechischen unausgesprochenen Bezugswort und vermeidet den Zusatz »Männer«.
- source_word: παντὸς ἀλλοτρίου
  choice: jedes Fremden
  rationale: Im Zusammenhang mit »Unbeschnittenen« liegt eine personenbezogene Deutung nahe. Die grammatisch mögliche sachliche Bedeutung wird nicht in den Haupttext übernommen, da die Personenbezeichnung kontextuell natürlicher ist.
theological_decisions:
- issue: Ob κοίτην ausdrücklich als Geschlechtsgemeinschaft oder Ehebett wiederzugeben ist
  choice: das Lager
  alternative: das Ehebett; die geschlechtliche Gemeinschaft
  rationale: Die bildhafte und möglicherweise metonymische Ausdrucksweise des Griechischen bleibt erhalten, ohne die eheliche oder sexuelle Bedeutung stärker festzulegen als der Ausgangstext.
- issue: Ob ἀνόμων allgemeiner als »Böse« wiederzugeben ist
  choice: der Gesetzlosen
  alternative: der Bösen
  rationale: »Gesetzlosen« bewahrt die im griechischen Ausdruck enthaltene Beziehung zum Gesetz und vermeidet eine interpretierende Verallgemeinerung.
- issue: Ob παντὸς ἀλλοτρίου persönlich oder sachlich verstanden wird
  choice: jedes Fremden
  alternative: alles Fremden
  rationale: Die Verbindung mit den »Unbeschnittenen« spricht am ehesten für fremde Personen; die Form des griechischen Adjektivs könnte isoliert jedoch auch sachlich verstanden werden.
translation_notes:
  register: Die Fassung verwendet gehobenes, aber verständliches modernes Standarddeutsch. »Herrlichkeit«, »Gesetzlose« und »Lager« bewahren den feierlichen Gebetsstil sowie die Bildhaftigkeit und Mehrdeutigkeit des griechischen Textes.
