base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/005.yaml
  text: You know all things; you know[a], Lord, that it was not in insolence or in pride or in ambition that I did this—refusing to bow down to the proud Haman.
translation:
  language: de
  text: 'Du weißt alles; du weißt, Herr, dass ich dies weder aus Anmaßung noch aus Hochmut noch aus Geltungssucht[a] getan habe: mich vor dem hochmütigen Haman nicht niederzuwerfen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ehrgeiz; das griechische Wort bezeichnet das Streben nach Ansehen oder Ehre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ πάντα γινώσκεις
  choice: Du weißt alles
  rationale: Die umfassende Aussage und die betonte direkte Anrede an Gott bleiben erhalten.
- source_word: σὺ οἶδας
  choice: du weißt
  rationale: Die Wiederholung der beiden griechischen Verben des Wissens wird als Gebetsnachdruck bewahrt und nicht zusammengezogen.
- source_word: Κύριε
  choice: Herr
  rationale: Natürliche und traditionelle deutsche Wiedergabe der göttlichen Anrede κύριε.
- source_word: οὐκ ἐν ὕβρει
  choice: weder aus Anmaßung
  rationale: Anmaßung bezeichnet hier ein freches, übergriffiges Sich-Erheben und bleibt zugleich von dem folgenden Hochmut unterscheidbar.
- source_word: οὐδὲ ἐν ὑπερηφανείᾳ
  choice: noch aus Hochmut
  rationale: Hochmut gibt die stolze Selbstüberhebung klar und idiomatisch wieder.
- source_word: οὐδὲ ἐν φιλοδοξίᾳ
  choice: noch aus Geltungssucht
  rationale: Das Wort kann das selbstbezogene Streben nach Ehre, Ansehen oder Ruhm bezeichnen. Geltungssucht trifft in diesem negativen Zusammenhang den Sinn; die breitere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: ἐποίησα τοῦτο
  choice: habe ich dies getan
  rationale: Die rückverweisende, bewusst allgemeine Formulierung wird erhalten; der folgende Infinitiv erläutert, worin die Handlung bestand.
- source_word: τὸ μὴ προσκυνεῖν
  choice: mich … nicht niederzuwerfen
  rationale: Sich niederwerfen bildet die körperliche Handlung von προσκυνεῖν deutlicher ab als das schwächere sich verbeugen, ohne hier bereits eine ausschließlich kultische Bedeutung festzulegen.
- source_word: τὸν ὑπερήφανον Ἁμάν
  choice: vor dem hochmütigen Haman
  rationale: Die wertende Charakterisierung Hamans wird entsprechend dem griechischen Text ausdrücklich beibehalten.
theological_decisions:
- issue: Beweggrund für Mordechais Weigerung, sich vor Haman niederzuwerfen
  choice: Der Text verneint Anmaßung, Hochmut und Geltungssucht als Beweggründe, lässt den positiven Beweggrund in diesem Vers aber unausgesprochen.
  alternative: Die Weigerung ausdrücklich als ausschließlich religiös, politisch oder persönlich motiviert zu erklären.
  rationale: Der griechische Wortlaut nennt nur die Motive, die Mordechai bestreitet. Die Übersetzung ergänzt keine Begründung aus dem weiteren Zusammenhang und erhält damit die Spannung des Verses.
- issue: Bedeutungsumfang von προσκυνεῖν
  choice: mich niederzuwerfen
  alternative: mich anzubeten
  rationale: Das Verb kann je nach Zusammenhang Verehrung, Huldigung oder Anbetung bezeichnen. Die körperlich konkrete Wiedergabe vermeidet es, die Handlung ohne ausdrückliches Signal ausschließlich als Gottesdienst zu deuten.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die anaphorische Wiederholung „Du weißt … du weißt“ und die dreigliedrige Verneinung bewahren den feierlichen Nachdruck des Griechischen. Der Doppelpunkt macht die erläuternde Funktion des griechischen substantivierten Infinitivs im Deutschen verständlich.
