translation:
  language: de
  text: um den Beschluss deines Mundes aufzuheben[a] und dein Erbteil zu vernichten[b], um den Mund derer zu verschließen, die dich loben[c], und um die Herrlichkeit deines Hauses[d] und deinen Altar auszulöschen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „den festgesetzten Beschluss aus deinem Mund wegzunehmen“. Gemeint ist offenbar, Gottes verbindliche Anordnung aufzuheben oder unwirksam zu machen.'
    reason: lexical_alternative
  - marker: b
    text: Mit „dein Erbteil“ ist wahrscheinlich das Gott gehörende Volk oder sein Besitz gemeint; der griechische Text legt den Bezug nicht ausdrücklich fest.
    reason: cultural_note
  - marker: c
    text: 'Sinngemäß: „die zum Schweigen zu bringen, die dich loben“. Die Übersetzung bewahrt das konkrete Bild des verschlossenen Mundes.'
    reason: lexical_alternative
  - marker: d
    text: Mit Gottes „Haus“ ist hier wahrscheinlich der Tempel gemeint; im Griechischen steht jedoch schlicht „Haus“.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξᾶραι
  choice: aufzuheben
  rationale: Das Verb bezeichnet hier das Beseitigen oder Außerkraftsetzen. „Aufheben“ passt im Deutschen natürlich zu einem Beschluss und bewahrt den feindlichen Zweck der Infinitivreihe.
- source_word: ὁρισμὸν στόματός σου
  choice: den Beschluss deines Mundes
  rationale: ὁρισμός bezeichnet eine Festsetzung oder einen verbindlichen Beschluss. Die Zuordnung zum Mund bleibt erhalten und bewahrt das Bild göttlicher, autoritativer Rede.
- source_word: ἀφανίσαι
  choice: zu vernichten
  rationale: Das starke Verb meint, etwas verschwinden zu lassen oder zugrunde zu richten. „Vernichten“ entspricht der Schwere der angedrohten Auslöschung.
- source_word: κληρονομίαν σου
  choice: dein Erbteil
  rationale: „Erbteil“ bewahrt den biblischen Bundesklang und lässt offen, ob unmittelbar Gottes Volk, sein Besitz oder beides gemeint ist.
- source_word: ἐμφράξαι στόμα
  choice: den Mund … zu verschließen
  rationale: Die konkrete griechische Wendung wird natürlich und bildhaft wiedergegeben; zugleich bleibt die Wiederholung von „Mund“ erhalten.
- source_word: αἰνούντων σοι
  choice: derer, die dich loben
  rationale: Die präsentische Partizipialform bezeichnet die Lobenden beziehungsweise Anbetenden. Der Relativsatz ist in modernem Deutsch klar und würdig.
- source_word: σβέσαι
  choice: auszulöschen
  rationale: Das Verb wird für das Löschen von Feuer oder Licht gebraucht und bewahrt hier das kräftige Bild für die Beseitigung von Herrlichkeit und Altar.
- source_word: δόξαν οἴκου σου
  choice: die Herrlichkeit deines Hauses
  rationale: „Herrlichkeit“ erhält das theologische Gewicht von δόξα; „Haus“ folgt dem griechischen Wortlaut, ohne den Tempel ausdrücklich einzusetzen.
- source_word: θυσιαστήριόν σου
  choice: deinen Altar
  rationale: Dies ist die übliche und genaue Wiedergabe. Der Akkusativ wird als zweites direktes Objekt zu „auszulöschen“ erkennbar gemacht.
theological_decisions:
- issue: Bezug von κληρονομίαν σου
  choice: dein Erbteil
  alternative: dein Volk / dein Besitz
  rationale: Der Kontext weist wahrscheinlich auf das Gott gehörende Volk, doch der griechische Text benennt den Bezug nicht ausdrücklich. Der Bundesbegriff bleibt daher in seiner Mehrdeutigkeit erhalten.
- issue: Bedeutung von οἶκος
  choice: dein Haus
  alternative: dein Tempel
  rationale: Gemeint ist wahrscheinlich der Tempel. Da der griechische Text jedoch „Haus“ sagt, wird diese Bildsprache nicht interpretierend aufgelöst.
- issue: Syntaktische Beziehung von θυσιαστήριόν σου
  choice: „deinen Altar“ als eigenes Objekt von „auszulöschen“
  alternative: die Herrlichkeit deines Hauses und deines Altars
  rationale: θυσιαστήριόν steht wie δόξαν im Akkusativ und ist mit καί angeschlossen. Daher werden die Herrlichkeit des Hauses und der Altar als zwei Objekte behandelt; die Herrlichkeit wird nicht stillschweigend auch auf den Altar bezogen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Folge der Zweckinfinitive wird durch wiederholtes „um … zu“ klar hörbar gemacht. Zentrale Bilder wie „Mund“, „Erbteil“, „Haus“ und „auslöschen“ bleiben erhalten; die wahrscheinlichen Bezüge auf Gottes Volk und den Tempel werden nur in den Fußnoten erläutert.
