  text: Remember[a], Lord; make yourself known in the time of our affliction, and encourage me[b], O King of the gods and ruler over every authority.
translation:
  language: de
  text: Gedenke, Herr; gib dich zu erkennen[a] in der Zeit unserer Bedrängnis und gib mir Mut, König der Götter[b] und Gebieter über jede Macht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde offenbar“. Die griechische Passivform kann als Bitte verstanden werden, dass Gott sich zu erkennen gibt oder offenbar wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „König der Götter“. Die Wendung bringt Gottes Hoheit über alle Mächte zum Ausdruck, die als Götter gelten oder bezeichnet werden.'
    reason: theological_clarity
lexical_decisions:
- source_word: μνήσθητι
  choice: Gedenke
  rationale: Der Aoristimperativ steht in der Sprache des Gebets als unmittelbarer Appell. „Gedenke“ bewahrt diese knappe biblische Ausdrucksweise, ohne ein im Griechischen nicht genanntes Objekt zu ergänzen.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος ist hier ein göttlicher Titel; „Herr“ ist dafür die natürliche und etablierte deutsche Wiedergabe.
- source_word: γνώρισθητι
  choice: gib dich zu erkennen
  rationale: Der passive Imperativ kann im Gebetszusammenhang eine Bitte um Gottes Selbstoffenbarung ausdrücken. Die reflexive deutsche Form ist natürlich und wahrt zugleich die mögliche mediale beziehungsweise passive Aussagekraft.
- source_word: ἐν καιρῷ θλίψεως ἡμῶν
  choice: in der Zeit unserer Bedrängnis
  rationale: καιρός bezeichnet hier die bestimmte Zeit oder Lage, θλῖψις Bedrängnis beziehungsweise Not. Die Formulierung bleibt quellennah und ist in modernem Deutsch verständlich.
- source_word: ἐμὲ θάρσυνον
  choice: gib mir Mut
  rationale: θαρσύνω bedeutet ermutigen oder mutig machen. „Gib mir Mut“ gibt den konkreten persönlichen Hilferuf natürlicher wieder als das im Deutschen teils schwächere „ermutige mich“.
- source_word: Βασιλεῦ τῶν θεῶν
  choice: König der Götter
  rationale: Die ausdrückliche Genitivverbindung wird unverändert bewahrt. Sie bezeichnet im Zusammenhang des jüdischen Gebets Gottes Hoheit über alle als Götter bezeichneten Mächte und wird nicht aus theologischer Vorsicht abgeschwächt.
- source_word: πάσης ἀρχῆς ἐπικρατῶν
  choice: Gebieter über jede Macht
  rationale: ἀρχή kann Herrschaft, Autorität oder Macht bezeichnen; ἐπικρατέω drückt Überlegenheit und Herrschaft aus. „Gebieter über jede Macht“ ist knapp, würdevoll und erhält den umfassenden Sinn von πάσης.
theological_decisions:
- issue: Der göttliche Titel Βασιλεῦ τῶν θεῶν
  choice: König der Götter
  alternative: König über den Göttern
  rationale: Die wörtliche Genitivkonstruktion soll nicht geglättet werden. Im Gebetskontext bezeugt sie Gottes höchste Herrschaft, ohne damit die tatsächliche Göttlichkeit anderer Mächte festzulegen.
- issue: Stimme und Aussagekraft von γνώρισθητι
  choice: gib dich zu erkennen
  alternative: werde offenbar
  rationale: Die gewählte reflexive Form versteht den Imperativ als Bitte um göttliche Selbstoffenbarung, lässt aber durch die Fußnote erkennen, dass die griechische Passivform auch formaler wiedergegeben werden kann.
- issue: Bezug des Partizips ἐπικρατῶν
  choice: Gebieter über jede Macht
  alternative: der über jede Herrschaft gebietet
  rationale: Das Partizip beschreibt den angeredeten König als den, der über jede ἀρχή Gewalt hat. Die substantivische deutsche Fassung bewahrt die feierliche doppelte Anrede, ohne den Herrschaftsbezug zu verändern.
translation_notes:
  register: Moderne, würdige Gebetssprache. „Gedenke“ ist bewusst bibelsprachlich, aber weiterhin allgemein verständlich; die übrige Formulierung vermeidet unnötige Archaismen. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
