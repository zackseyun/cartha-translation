base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/028.yaml
  text: And your servant has not rejoiced from the day of my change until now[a], except in you, Lord[b], God of Abraham.
translation:
  language: de
  text: Und deine Magd[a] hat seit dem Tag meiner Veränderung[b] bis heute an nichts Freude gehabt außer an dir, Herr, Gott Abrahams.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet eine weibliche Sklavin oder Dienerin und dient hier als demütige Selbstbezeichnung vor Gott.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „meiner Wendung“ oder „der Veränderung meiner Lebensumstände“. Worin die Veränderung bestand, lässt der griechische Text offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: δούλη
  choice: Magd
  rationale: Die feminine Selbstbezeichnung drückt in diesem Gebet demütige Zugehörigkeit und Abhängigkeit von Gott aus. „Magd“ bewahrt sowohl das Geschlecht als auch den würdevollen Gebetsstil; die härtere soziale Bedeutung von „Sklavin“ wird in der Fußnote kenntlich gemacht.
- source_word: ηὐφράνθη
  choice: hat … Freude gehabt
  rationale: Die Wendung gibt den anhaltenden Rückblick bis in die Gegenwart natürlich wieder und bewahrt den Sinn von Freude beziehungsweise Sichfreuen.
- source_word: ἀφʼ ἡμέρας μεταβολῆς μου
  choice: seit dem Tag meiner Veränderung
  rationale: Die bewusst knappe Formulierung lässt offen, ob eine Änderung der Stellung, des Schicksals oder der Lebensumstände gemeint ist.
- source_word: πλὴν ἐπὶ σοί
  choice: außer an dir
  rationale: Die Formulierung bezeichnet Gott als einzige Ausnahme und als alleinigen Gegenstand beziehungsweise Grund ihrer Freude, ohne die Präpositionalfügung unnötig festzulegen.
- source_word: Κύριε
  choice: Herr
  rationale: Entspricht der üblichen deutschen Wiedergabe der direkten göttlichen Anrede.
- source_word: ὁ θεὸς Ἀβραάμ
  choice: Gott Abrahams
  rationale: Bewahrt die knappe, traditionelle Bundesbezeichnung des griechischen Textes.
theological_decisions:
- issue: Demütige Selbstbezeichnung δούλη im Gebet
  choice: deine Magd
  alternative: deine Sklavin; deine Dienerin
  rationale: „Magd“ hält die feminine und untergeordnete Selbstbezeichnung fest, klingt im deutschen Gebet jedoch natürlicher und würdevoller als „Sklavin“. Die Fußnote bewahrt die stärkere soziale Bedeutung des griechischen Wortes.
- issue: Bedeutung von μεταβολή
  choice: meine Veränderung
  alternative: meine Wendung; die Veränderung meiner Lebensumstände
  rationale: Der griechische Text benennt weder Ursache noch Art der Veränderung. Die Übersetzung lässt diese inhaltliche Offenheit bestehen.
- issue: Gott als einzige Freude
  choice: an nichts Freude gehabt außer an dir
  alternative: sich über nichts gefreut außer über dich; nur an dir Freude gehabt
  rationale: Die gewählte Fassung erhält den ausschließlichen Bezug auf Gott, ohne zu entscheiden, ob ἐπὶ σοί vor allem Gegenstand, Grundlage oder Sphäre der Freude bezeichnet.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. „Magd“ ist leicht traditionell, aber allgemein verständlich und trägt die feminine Selbstbezeichnung prägnanter als das neutralere „Dienerin“. Die Satzstellung bleibt flüssig, während die Mehrdeutigkeit von μεταβολή und ἐπὶ σοί erhalten bleibt.
