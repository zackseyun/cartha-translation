  text: and to open the mouth of the nations to the praises of worthless things[b][a], and for a fleshly king to be marveled at forever.
translation:
  language: de
  text: und den Mund der Völker zum Lob nichtiger Dinge[a] zu öffnen und einen König aus Fleisch[b] für immer bewundern zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Preis der Vorzüge nichtiger Dinge« oder »zum Lob von Nichtigkeiten«. Wörtlicher steht im Griechischen: »hin zu den Vorzügen nichtiger Dinge«.'
