  - marker: b
    text: 'Oder: »einen sterblichen König« oder »einen bloß menschlichen König«. Griechisch: »einen König aus Fleisch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι στόμα
  choice: den Mund … zu öffnen
  rationale: Bewahrt das griechische Bild für das Ermöglichen oder Veranlassen von Rede und fügt sich in die Infinitivfolge ein.
- source_word: ἐθνῶν
  choice: der Völker
  rationale: Gibt die nichtisraelitischen Völker breit und ohne die mögliche engere religiöse Festlegung von »Heiden« wieder.
- source_word: ἀρετὰς ματαίων
  choice: zum Lob nichtiger Dinge
  rationale: »Lob« gibt hier die zugeschriebenen Vorzüge idiomatisch wieder; »nichtige Dinge« bewahrt die Offenheit von ματαίων, ohne den Bezug ausdrücklich auf Götzen festzulegen.
- source_word: θαυμασθῆναι
  choice: bewundern zu lassen
  rationale: Bringt den passiven Gedanken des Bewundert- oder Angestauntwerdens in der deutschen Infinitivkonstruktion natürlich zum Ausdruck, ohne ihn zum ausdrücklich kultischen »Anbeten« zu verstärken.
- source_word: βασιλέα σάρκινον
  choice: einen König aus Fleisch
  rationale: Bewahrt das konkrete griechische Bild und damit den Gegensatz zwischen einem menschlichen Herrscher und Gott.
- source_word: εἰς αἰῶνα
  choice: für immer
  rationale: Entspricht der üblichen dauerhaften Bedeutung der Wendung.
theological_decisions:
- issue: Ob ματαίων ausdrücklich als Götzen bezeichnet werden soll
  choice: nichtige Dinge
  alternative: nichtige Götzen; Nichtigkeiten
  rationale: Der Zusammenhang legt Götzendienst nahe, doch das griechische Wort selbst bezeichnet allgemeiner Nichtiges oder Wertloses. Die Übersetzung wahrt diese genuine Offenheit.
- issue: Wie σάρκινον im Gegensatz zu göttlicher Herrschaft wiederzugeben ist
  choice: König aus Fleisch
  alternative: sterblicher König; bloß menschlicher König
  rationale: Die konkrete Formulierung erhält die theologische Spannung, ohne die Metapher erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Infinitivfolge des griechischen Gebetszusammenhangs bleibt erhalten; konkrete Bilder werden nicht vorschnell paraphrasiert.
