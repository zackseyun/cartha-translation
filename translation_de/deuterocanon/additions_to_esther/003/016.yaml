  text: And now we have sinned before you, and you have handed us over into the hands of our enemies.
translation:
  language: de
  text: Und nun haben wir vor dir gesündigt, und du hast uns in die Hände unserer Feinde ausgeliefert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Funktion von καί als auch die zeitliche Bedeutung von νῦν, ohne einen im Griechischen nicht ausdrücklich bezeichneten Gegensatz einzuführen.
- source_word: ἡμάρτομεν
  choice: haben wir gesündigt
  rationale: Das deutsche Perfekt gibt den Aorist in diesem Gebets- und Bekenntniszusammenhang natürlich wieder und lässt die gegenwärtigen Folgen der Sünde erkennen, ohne dem Verb zusätzliche Aspekte aufzuzwingen.
- source_word: ἐνώπιόν σου
  choice: vor dir
  rationale: Die knappe, idiomatische Wendung bewahrt den Gedanken des Handelns in Gottes Gegenwart und vor seinem Angesicht; das stärker deutende „gegen dich“ wäre möglich, steht hier aber nicht ausdrücklich.
- source_word: παρέδωκας
  choice: du hast uns … ausgeliefert
  rationale: „Ausgeliefert“ bezeichnet klar die Übergabe in fremde Gewalt und erhält die im griechischen Verb ausgesagte direkte göttliche Handlung.
- source_word: εἰς χεῖρας
  choice: in die Hände
  rationale: Die im Griechischen gebrauchte bildhafte Rede von der Gewalt oder Verfügungsgewalt anderer ist auch im Deutschen natürlich und verständlich.
- source_word: τῶν ἐχθρῶν ἡμῶν
  choice: unserer Feinde
  rationale: Direkte und kontextgerechte Wiedergabe der Genitivverbindung.
theological_decisions:
- issue: Göttliches Handeln beim Gericht über das sündige Volk
  choice: Gott wird unmittelbar als derjenige angesprochen, der das Volk seinen Feinden ausgeliefert hat.
  alternative: Eine abschwächende Formulierung, nach der Gott die Auslieferung lediglich zugelassen habe.
  rationale: Das griechische παρέδωκας steht in der zweiten Person Singular und nennt den angesprochenen Gott direkt als Handelnden. Diese theologische Spannung wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gebetssprache. Die Wiederholung von „und“ folgt dem schlichten, parataktischen Aufbau des griechischen Satzes.
