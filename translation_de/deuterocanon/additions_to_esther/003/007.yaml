base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/007.yaml
  text: But I did this so that I might not place the glory of man above the glory of God; and I will bow down to no one except you[a], my lord, and I will not do these things in pride.
translation:
  language: de
  text: Aber ich tat dies, um nicht die Ehre eines Menschen über die Ehre Gottes zu stellen. Ich werde mich vor niemandem niederwerfen außer vor dir[a], meinem Herrn, und ich werde dies nicht aus Hochmut tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde niemanden anbeten außer dir, meinem Herrn.« Das griechische Verb kann je nach Zusammenhang sowohl das Sichniederwerfen als Huldigung als auch Anbetung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησα
  choice: ich tat
  rationale: Der Aorist bezeichnet die zurückliegende Handlung schlicht und unmittelbar.
- source_word: ἵνα μὴ θῶ
  choice: damit ich nicht … stellte
  rationale: τίθημι bedeutet setzen oder stellen; mit Ehre gibt »über … stellen« den Rangvergleich natürlich wieder. Der Konjunktiv steht in einem vergangenen Zwecksatz.
- source_word: δόξαν ἀνθρώπου
  choice: die Ehre eines Menschen
  rationale: δόξα bezeichnet hier im Rangkontrast Ehre beziehungsweise Ansehen. Der Singular ἀνθρώπου bleibt erhalten.
- source_word: ὑπεράνω
  choice: über
  rationale: Gibt die räumliche Metapher einer höheren Rangstellung knapp wieder.
- source_word: οὐ προσκυνήσω
  choice: ich werde mich … vor niemandem niederwerfen
  rationale: προσκυνέω kann sowohl eine körperliche Huldigung als auch Anbetung bezeichnen. Im Zusammenhang mit der Verweigerung gegenüber einem Menschen steht zunächst die konkrete Gebärde im Vordergrund.
- source_word: πλὴν σοῦ τοῦ κυρίου μου
  choice: außer vor dir, meinem Herrn
  rationale: πλήν bezeichnet die Ausnahme; die Apposition τοῦ κυρίου μου bezieht sich in diesem Gebet auf Gott.
- source_word: οὐ ποιήσω αὐτὰ
  choice: ich werde dies nicht tun
  rationale: Das griechische neutrale Pluralpronomen αὐτά kann im Deutschen idiomatisch eine Handlung oder die betreffenden Dinge zusammenfassend mit »dies« aufnehmen.
- source_word: ἐν ὑπερηφανίᾳ
  choice: aus Hochmut
  rationale: Die Wendung bezeichnet Hochmut als Beweggrund; »aus Hochmut« ist im modernen Deutsch natürlicher als »in Hochmut«.
theological_decisions:
- issue: Bedeutung von προσκυνέω bei der Verweigerung gegenüber einem menschlichen Würdenträger
  choice: sich niederwerfen
  alternative: anbeten
  rationale: Die Hauptfassung bewahrt die konkrete Geste der Huldigung, ohne den möglichen religiösen Sinn auszuschließen; die Fußnote hält die echte lexikalische Spannung offen.
- issue: Bedeutung von δόξα im Kontrast zwischen Mensch und Gott
  choice: Ehre
  alternative: Herrlichkeit
  rationale: Bei einem Menschen bezeichnet δόξα hier am ehesten Ehre oder Ansehen. Die Wiederholung desselben deutschen Wortes bewahrt den ausdrücklich gesetzten Kontrast mit Gottes Ehre, ohne die Aussage durch unterschiedliche Begriffe abzuschwächen.
- issue: Anrede τοῦ κυρίου μου
  choice: meinem Herrn
  alternative: meinem Herrn (kleingeschriebenes »herrn« als neutrale Standesbezeichnung)
  rationale: Der Satz ist Teil eines an Gott gerichteten Gebets; daher ist »Herr« als Gottesbezeichnung kontextgemäß, auch wenn die griechische Handschrift keine deutsche Großschreibung entscheidet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem griechischen Gedankengang nahe, wird aber durch Punkt und Semikolon lesbar gegliedert. »Ehre« ist für den sozialen und theologischen Rangvergleich verständlicher als das im Deutschen stärker transzendent klingende »Herrlichkeit«.
