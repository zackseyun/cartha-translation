lexical_decisions:
- source_word: ἡμᾶς δὲ ῥῦσαι
  choice: Doch rette uns
  rationale: Der Aoristimperativ ῥῦσαι ist eine dringliche Bitte um Befreiung aus Gefahr. „Rette“ ist im Deutschen direkt und gebetssprachlich angemessen; δέ wird anschlussfähig mit „doch“ wiedergegeben.
- source_word: ἐν χειρί σου
  choice: durch deine Hand
  rationale: Die biblische Metapher der Hand als Ausdruck wirksamer Macht bleibt erhalten; „durch“ verdeutlicht dabei die instrumentale Bedeutung der Wendung.
- source_word: βοήθησόν μοι
  choice: hilf mir
  rationale: Die knappe Imperativform mit Dativ wird unmittelbar und natürlich wiedergegeben.
- source_word: τῇ μόνῃ
  choice: denn ich bin allein
  rationale: Das feminine Partizip bezieht sich auf die betende Ester. Die begründende Satzform ist im Deutschen natürlicher als eine schwerfällige wörtliche Apposition und bewahrt ihre Verlassenheit als Grund der Bitte.
- source_word: μὴ ἔχουσῃ εἰ μὴ σέ
  choice: und habe niemanden außer dir
  rationale: Die Partizipialwendung beschreibt weiter die Hilflosigkeit der Sprecherin. „Niemanden außer dir“ gibt den implizit personalen Bezug idiomatisch wieder.
- source_word: Κύριε
  choice: Herr
  rationale: In der direkten Anrede Gottes ist „Herr“ die sachlich und traditionssprachlich angemessene Wiedergabe von κύριε.
- source_word: πάντων γνῶσιν ἔχεις
  choice: Du weißt alles
  rationale: Die griechische Nominalfügung bedeutet idiomatisch, dass Gott um alles weiß. Die verbale deutsche Form ist klar und natürlich, ohne den Bedeutungsumfang einzuschränken.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede Gottes
  choice: Herr
  alternative: Gebieter
  rationale: Das Gebet richtet sich an den Gott Israels. „Herr“ bewahrt die etablierte Gottesbezeichnung, ohne eine weitergehende konfessionelle Deutung einzutragen.
- issue: Aussage πάντων γνῶσιν ἔχεις über Gottes Wissen
  choice: Du weißt alles
  alternative: Du hast Kenntnis von allem
  rationale: Die idiomatische Fassung bewahrt die umfassende Aussage des griechischen πάντων. Sie legt nicht näher fest, welcher Art dieses Wissen ist, und vermeidet dadurch eine zusätzliche dogmatische Systematisierung.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit bewahrter Hand-Metapher. Die Partizipialkonstruktion wurde zur besseren Verständlichkeit als begründender Hauptsatz entfaltet. Das abschließende Komma bleibt stehen, weil der Satz im folgenden Vers weitergeführt wird.
