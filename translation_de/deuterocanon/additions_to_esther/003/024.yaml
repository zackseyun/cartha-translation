  terminology: „Herr“ ist die angemessene direkte Gottesanrede für Κύριε. „Rette“, „hilf mir“, „allein“ und „Du weißt alles“ sind präzise, verständliche und registergerechte Wiedergaben, ohne zusätzliche theologische Festlegungen.
