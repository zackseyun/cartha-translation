  source_fidelity: 'Der Text gibt die Abfolge und den Sinn des Griechischen zuverlässig wieder: die Bitte um Rettung „uns“, die persönliche Bitte „hilf mir“, Esthers Alleinsein und ausschließliche Abhängigkeit von Gott sowie die umfassende Aussage über Gottes Wissen. „Durch deine Hand“ bewahrt die biblische Hand-Metapher und gibt die instrumentale Wendung ἐν χειρί σου angemessen wieder. Das fortführende Komma entspricht dem überlieferten Satzanschluss.'
