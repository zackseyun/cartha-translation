  text: And she was pleading with the Lord[a], the God of Israel, and said, “My Lord, our king, you alone are the only one; help me, who am alone and have no helper except you,”
translation:
  language: de
  text: 'Und sie flehte zum Herrn, dem Gott Israels, und sagte: »Mein Herr, unser König, du allein bist[a]. Hilf mir, denn ich bin allein und habe keinen Helfer außer dir.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen bleibt die Aussage ohne ausdrückliches Prädikat.
    reason: Die Fußnote erläutert die im Deutschen bewusst beibehaltene elliptische Formulierung, ohne ihre offene Aussage durch eine Ergänzung festzulegen.
lexical_decisions:
- source_word: ἐδεῖτο
  choice: flehte
  rationale: δέομαι bezeichnet hier ein eindringliches Bitten. Das deutsche Präteritum passt zum fortlaufenden Erzählstil; die anhaltende Dringlichkeit wird durch „flehte“ gewahrt.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: zum Herrn, dem Gott Israels
  rationale: Die appositionelle Verbindung beider Gottesbezeichnungen bleibt ausdrücklich erhalten.
- source_word: Κύριέ μου
  choice: Mein Herr
  rationale: Das ausdrücklich gesetzte μου wird wiedergegeben und die persönliche Anrede bewahrt.
- source_word: ὁ βασιλεὺς ἡμῶν
  choice: unser König
  rationale: Der königliche Titel Gottes wird unmittelbar und ohne Abschwächung wiedergegeben.
- source_word: σὺ εἶ μόνος
  choice: du allein bist es
  rationale: Die Formulierung bewahrt die elliptische Aussage des Griechischen, klingt im Deutschen jedoch verständlich. Das ergänzte „es“ lässt das unausgesprochene Prädikat offen, statt es als „Helfer“ oder „Gott“ festzulegen.
- source_word: βοήθησόν μοι
  choice: Hilf mir
  rationale: Der Aoristimperativ wird als kurze, eindringliche Bitte wiedergegeben.
- source_word: τῇ μόνῃ
  choice: denn ich bin allein
  rationale: Der feminine Dativ beschreibt Esters Lage. Die deutsche Begründungskonstruktion verbindet die Bitte natürlich mit dieser Lage.
- source_word: μὴ ἔχουσῃ βοηθὸν
  choice: und habe keinen Helfer
  rationale: Das personale Substantiv βοηθός bleibt als „Helfer“ erhalten und wird nicht zu dem abstrakten „Hilfe“ verflacht.
- source_word: εἰ μὴ σέ
  choice: außer dir
  rationale: Die ausschließende Bedeutung wird klar und idiomatisch ausgedrückt.
theological_decisions:
- issue: Göttlicher Königstitel im Gebet Esters
  choice: „unser König“ als direkte Anrede Gottes
  alternative: „unser Herrscher“
  rationale: Der Text bezeichnet den Herrn ausdrücklich als König Israels. Dieser Titel trägt zur Gegenüberstellung von Gottes Herrschaft und der Macht des irdischen Königs bei und darf nicht abgeschwächt werden.
- issue: Elliptisches Bekenntnis σὺ εἶ μόνος
  choice: „du allein bist es“ mit Fußnote
  alternative: „du allein bist“ oder kontextuell ergänzt „du allein bist mein Helfer“
  rationale: Das griechische Prädikat bleibt unausgesprochen. Die Übersetzung wahrt diese Offenheit; die Fußnote nennt die noch formalere Möglichkeit, ohne die Aussage theologisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetssprache ist eindringlich, aber nicht altertümlich. Der Fußnotenmarker [a] steht unmittelbar an der elliptischen Aussage, auf die er sich bezieht.
