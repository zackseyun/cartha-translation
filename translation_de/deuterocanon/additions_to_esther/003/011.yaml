    reason: lexical_alternative
lexical_decisions:
- source_word: κατέφυγεν
  choice: nahm ihre Zuflucht zu
  rationale: Das Verb bezeichnet die Flucht zu jemandem, bei dem man Schutz sucht. „Nahm ihre Zuflucht zu“ gibt sowohl die Bewegung als auch den Schutzgedanken wieder und klingt im Deutschen natürlich.
- source_word: κύριον
  choice: Herrn
  rationale: κύριος bezeichnet hier Gott. Da der griechische Text nicht ausdrücklich den Gottesnamen wiedergibt, steht „Herr“ und nicht „HERR“.
- source_word: ἐν ἀγῶνι θανάτου
  choice: von einem Kampf auf Leben und Tod
  rationale: ἀγών bezeichnet einen Kampf oder ein schweres Ringen; θανάτου verbindet ihn mit drohendem Tod. Die Wendung bewahrt das Kampfbild, ohne den Ausdruck vorschnell nur als innerliche Angst oder bereits einsetzendes Sterben zu deuten.
- source_word: κατειλημμένη
  choice: ergriffen von
  rationale: Das passive Partizip beschreibt Ester als von dieser tödlichen Bedrängnis erfasst oder überwältigt. „Ergriffen von“ erhält die passive und intensive Aussage.
theological_decisions:
- issue: Wiedergabe von κύριον als Gottesbezeichnung
  choice: dem Herrn
  alternative: dem HERRN
  rationale: Im Gebetszusammenhang ist Israels Gott gemeint; der vorliegende griechische Wortlaut hat jedoch κύριον und weist den Gottesnamen nicht ausdrücklich aus. Daher bleibt die Wiedergabe „Herr“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung von „die Königin“ wird idiomatisch als „die Königin Ester“ wiedergegeben. Das abschließende Komma bleibt erhalten, da der Vers im Quellsegment syntaktisch weiterführt.
