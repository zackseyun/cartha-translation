  text: And Esther the queen fled to the Lord[a], seized by a struggle of death[b],
translation:
  language: de
  text: Und die Königin Ester nahm ihre Zuflucht zum Herrn[a], ergriffen von einem Kampf auf Leben und Tod[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „floh zum Herrn“. Das griechische Verb bezeichnet eine Flucht zu jemandem, bei dem man Schutz sucht.'
