base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/008.yaml
  text: And now[a], Lord God, King, God of Abraham, spare your people[b], because they are watching us for destruction and have desired to destroy your inheritance from the beginning.
translation:
  language: de
  text: Und nun, Herr, Gott, König, Gott Abrahams, verschone dein Volk! Denn sie haben es auf unseren Untergang abgesehen[a] und danach verlangt, dein Erbe von Anfang an[b] zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „sie blicken auf uns zu unserem Verderben“; sinngemäß: „sie haben ihre Augen auf uns gerichtet, um uns zu vernichten“. Der griechische Ausdruck ist stark verdichtet und bezeichnet eine feindselige, auf unseren Untergang gerichtete Haltung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dein Erbe von alters her“ beziehungsweise „dein uraltes Erbe“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ bezeichnet Gott mit dem geläufigen biblischen Hoheitstitel „Herr“.
- source_word: ὁ θεὸς ὁ βασιλεὺς
  choice: Gott, König
  rationale: Die knappe Reihung der Gottesbezeichnungen bleibt erhalten, ohne sie durch eine syntaktische Festlegung wie „Gott, der König“ stärker zu glätten.
- source_word: φεῖσαι
  choice: verschone
  rationale: Der Imperativ von φείδομαι ist eine unmittelbare Bitte um Bewahrung vor der drohenden Vernichtung; „verschone“ gibt ihn präzise wieder.
- source_word: τοῦ λαοῦ σου
  choice: dein Volk
  rationale: λαός bezeichnet hier im Gebetszusammenhang Gottes Bundesvolk.
- source_word: ἐπιβλέπουσιν ἡμῖν εἰς καταφθοράν
  choice: sie haben es auf unseren Untergang abgesehen
  rationale: Diese natürliche deutsche Wendung gibt den verdichteten griechischen Ausdruck für einen feindselig auf die Vernichtung gerichteten Blick bzw. Vorsatz wieder.
- source_word: καταφθοράν
  choice: Untergang
  rationale: Das Wort bezeichnet schwere Zerstörung oder Vernichtung; „Untergang“ passt idiomatisch zur gewählten deutschen Wendung.
- source_word: ἐπεθύμησαν
  choice: danach verlangt
  rationale: Die Wiedergabe bewahrt den Grundsinn des Begehrens oder Verlangens, ohne das Verb auf bloße Planung einzuengen.
- source_word: ἀπολέσαι
  choice: zu vernichten
  rationale: Im Zusammenhang der angestrebten Auslöschung des Volkes trägt „vernichten“ die starke korporative Bedeutung von ἀπόλλυμι.
- source_word: τὴν ἐξ ἀρχῆς κληρονομίαν σου
  choice: dein Erbe von Anfang an
  rationale: „Erbe“ erhält das theologische Bild; „von Anfang an“ bildet ἐξ ἀρχῆς unmittelbar ab, während die mögliche idiomatische Bedeutung „von alters her“ in der Fußnote genannt wird.
theological_decisions:
- issue: Bezug von „dein Erbe“
  choice: Die Metapher bleibt stehen und bezeichnet im Kontext Gottes Volk als sein Erbe.
  alternative: Das angestammte Land oder das umfassendere Bundeserbe.
  rationale: „Dein Volk“ und „dein Erbe“ stehen im Gebet parallel. Eine explizite Ersetzung durch „Volk“ würde das theologische Bild beseitigen und die mögliche weitere Bedeutungsweite unnötig verengen.
- issue: Bedeutung von ἐξ ἀρχῆς
  choice: von Anfang an
  alternative: von alters her; seit alter Zeit
  rationale: Die Hauptfassung folgt der transparenten Grundbedeutung. Da der Ausdruck auch auf eine seit alters bestehende Zugehörigkeit weisen kann, bleibt diese Nuance in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die gestaffelte Anrufung „Herr, Gott, König, Gott Abrahams“ und die Erbmetapher bleiben bewusst unaufgelöst. Das Ausrufezeichen nach der Bitte macht den Gebetscharakter natürlich kenntlich, ohne dem Inhalt etwas hinzuzufügen.
