translation:
  language: de
  text: weil wir ihren Göttern Ehre erwiesen haben.[a] Du bist gerecht, Herr.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dafür, dass wir ihren Göttern Ehre erwiesen haben“.'
    reason: Die Wendung ἀνθʼ ὧν kann neben einer allgemein kausalen Aussage auch stärker rückbezüglich formuliert werden.
  - marker: b
    text: 'Oder: „Du bist im Recht, Herr.“'
    reason: δίκαιος kann hier sowohl Gottes Gerechtigkeit als auch die Rechtmäßigkeit seines Handelns betonen.
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: weil
  rationale: Die Wendung bezeichnet hier den Grund für das zuvor eingestandene Gericht. „Weil“ gibt diesen kausalen Zusammenhang in natürlichem Deutsch wieder; eine stärker rückbezügliche Wiedergabe bleibt in der Fußnote erhalten.
- source_word: ἐδοξάσαμεν
  choice: Ehre erwiesen haben
  rationale: δοξάζω bezeichnet hier das Erweisen beziehungsweise Zuschreiben von Ehre. Die Formulierung ist im Deutschen idiomatisch und macht die Hinwendung zu fremden Göttern deutlich, ohne über den griechischen Wortlaut hinauszugehen.
- source_word: τοὺς θεοὺς αὐτῶν
  choice: ihren Göttern
  rationale: Der Plural mit Possessivpronomen wird direkt und natürlich wiedergegeben und bewahrt den Gegensatz zwischen fremden Göttern und dem angeredeten Herrn.
- source_word: δίκαιος
  choice: gerecht
  rationale: δίκαιος bezeichnet Gottes moralische und richterliche Rechtschaffenheit. „Gerecht“ bewahrt im Deutschen beide Aspekte am besten.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ bezeichnet in diesem Gebet die Anrede an Gott; „Herr“ ist die angemessene standarddeutsche Wiedergabe.
theological_decisions:
- issue: Aussage von δίκαιος über Gott
  choice: gerecht
  alternative: im Recht
  rationale: „Gerecht“ wahrt den bekenntnishaften theologischen Klang und umfasst sowohl Gottes Rechtschaffenheit als auch die Rechtmäßigkeit seines Gerichts. „Im Recht“ hebt den forensischen Aspekt stärker hervor und wird deshalb als mögliche Nuance vermerkt.
- issue: Bezeichnung κύριος in der Gebetsanrede
  choice: Herr
  alternative: Gebieter
  rationale: Im Gebetskontext ist κύριος eine Gottesbezeichnung und keine bloße gesellschaftliche Anrede. „Herr“ entspricht diesem Gebrauch, ohne eine konfessionelle Sonderdeutung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Nebensatz bleibt kleingeschrieben, weil der Vers als kausale Fortsetzung des vorhergehenden Zusammenhangs einsetzt. Die knappe Gebetsanrede und die Spannung zwischen dem Bekenntnis eigener Verfehlung und Gottes Gerechtigkeit bleiben erhalten.
