  text: Put fitting words in my mouth before the lion, and turn his heart to hatred against the one who is warring against us, to his destruction and that of those who are of one mind with him.
translation:
  language: de
  text: Lege mir vor dem Löwen[a] passende Worte[b] in den Mund, und wende sein Herz zum Hass gegen den, der uns bekämpft, sodass er und alle, die mit ihm eines Sinnes sind, zugrunde gehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Löwen“ ist in Esters Gebet bildlich der König gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: „eine wohlgefügte Rede“. Das griechische λόγον εὔρυθμον kann passende, gut formulierte und der Situation angemessene Rede bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „zu seinem Ende und dem Ende derer, die mit ihm eines Sinnes sind“; gemeint sein kann ihr Untergang oder ihre Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς
  choice: Lege … in den Mund
  rationale: Der Imperativ von δίδωμι bedeutet wörtlich „gib“. In Verbindung mit „in meinen Mund“ ist „Lege mir … in den Mund“ im Deutschen natürlich und bewahrt den Gedanken, dass Gott die Rede gewährt.
- source_word: λόγον εὔρυθμον
  choice: passende Worte
  rationale: εὔρυθμος bezeichnet hier eine wohlgefügte, situationsgerechte Rede. Der deutsche Plural „Worte“ gibt den idiomatischen Sinn von λόγος wieder, ohne die Bitte auf ein einzelnes Wort einzuengen.
- source_word: ἐνώπιον τοῦ λέοντος
  choice: vor dem Löwen
  rationale: Die bildhafte Bezeichnung des Königs als „Löwe“ wird entsprechend dem griechischen Text beibehalten.
- source_word: μετάθες τὴν καρδίαν αὐτοῦ
  choice: wende sein Herz
  rationale: Die Wendung bezeichnet eine Veränderung der inneren Haltung. „Wende sein Herz“ erhält das Bild und klingt in gehobenem, gegenwärtigem Deutsch natürlich.
- source_word: εἰς μῖσος
  choice: zum Hass
  rationale: εἰς bezeichnet die angestrebte oder eintretende Ausrichtung der Herzenshaltung.
- source_word: τοῦ πολεμοῦντος ἡμᾶς
  choice: gegen den, der uns bekämpft
  rationale: Das substantivierte Partizip steht im Singular und behält durch „der uns bekämpft“ seinen verbalen Charakter; es wird nicht zum allgemeineren Plural „unsere Feinde“ erweitert.
- source_word: εἰς συντέλειαν αὐτοῦ
  choice: sodass er … zugrunde geht
  rationale: συντέλεια bezeichnet hier das vollständige Ende beziehungsweise Verderben des Gegners. Die Folgesatzkonstruktion gibt das resultative εἰς in natürlichem Deutsch wieder.
- source_word: τῶν ὁμονοούντων αὐτῷ
  choice: alle, die mit ihm eines Sinnes sind
  rationale: Die Formulierung bewahrt den Gedanken gemeinsamer Gesinnung oder Absicht genauer als das stärker deutende „seine Verbündeten“.
theological_decisions:
- issue: Deutung des „Löwen“ als König
  choice: Das Bild „Löwe“ bleibt im Haupttext erhalten.
  alternative: „vor dem König“
  rationale: Der griechische Text nennt nicht unmittelbar den König, sondern gebraucht ein bedrohliches Bild. Eine Fußnote erläutert den Bezug, ohne die Bildsprache aufzulösen.
- issue: Referenz des singularischen τοῦ πολεμοῦντος ἡμᾶς
  choice: 'Singular: „der uns bekämpft“'
  alternative: „unsere Feinde“
  rationale: Der Singular weist im Kontext wahrscheinlich auf den führenden Gegner; die anschließende Pluralgruppe nennt gesondert die Gleichgesinnten.
- issue: Verhältnis von εἰς μῖσος zu τοῦ πολεμοῦντος ἡμᾶς
  choice: „zum Hass gegen den, der uns bekämpft“
  alternative: „damit er den hasst, der uns bekämpft“
  rationale: Die nominale Fügung hält sich eng an den griechischen Wortlaut und lässt die scharf formulierte Bitte der Gebetssprache bestehen.
- issue: Bedeutung von εἰς συντέλειαν
  choice: 'Als eintretendes Verderben wiedergegeben: „sodass … zugrunde gehen“'
  alternative: „bis zu seinem Ende“ / „zu seiner Vernichtung“
  rationale: Im Zusammenhang ist ein verderbliches Ende gemeint. Der Folgesatz vermeidet im Deutschen die unklare Anschlusskonstruktion „zu seiner Vernichtung“, ohne den Ausgang abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Gebetssprache und Bildhaftigkeit. „Passende Worte“ ist allgemein verständlich; „eines Sinnes“ erhält bewusst die Ausdrucksstruktur des griechischen ὁμονοεῖν. Die Satzstellung bleibt nah am griechischen Gedankengang, wird am Ende jedoch als natürlicher deutscher Folgesatz formuliert.
