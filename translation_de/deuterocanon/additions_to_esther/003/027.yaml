base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/027.yaml
  text: And your servant did not eat at Haman’s table[a], and I did not honor the king’s banquet, nor did I drink the wine of libations[b];
translation:
  language: de
  text: Und deine Sklavin[a] aß nicht an Hamans Tisch; ich erwies dem Festmahl des Königs keine Ehre und trank auch keinen Trankopferwein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „deine Dienerin“ oder „deine Magd“. Das griechische Wort ist die feminine Form für „Sklave“ und bezeichnet eine starke Stellung der Unterordnung.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Wein, der mit Trankopfern verbunden war, nicht einfach gewöhnlicher Wein.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ δούλη σου
  choice: deine Sklavin
  rationale: Die feminine Form δούλη bezeichnet eine Sklavin und drückt stärkere Unterordnung aus als das mildere „Dienerin“. Das Possessivpronomen und das feminine Geschlecht werden bewahrt.
- source_word: ἔφαγεν ... τράπεζαν Ἁμάν
  choice: aß nicht an Hamans Tisch
  rationale: Die konkrete Tischmetapher bleibt erhalten; „an jemandes Tisch essen“ ist im Deutschen die natürliche idiomatische Wiedergabe.
- source_word: οὐκ ἐδόξασα συμπόσιον βασιλέως
  choice: ich erwies dem Festmahl des Königs keine Ehre
  rationale: δοξάζω bedeutet hier, etwas zu ehren oder hochzuhalten. Die Formulierung ist natürlicher als „verherrlichte das Festmahl nicht“ und vermeidet eine unnötig kultisch-theologische Festlegung.
- source_word: οἶνον σπονδῶν
  choice: Trankopferwein
  rationale: Das Kompositum bezeichnet knapp und verständlich Wein, der mit σπονδαί, also Trankopfern, verbunden ist; der kultische Bezug bleibt erhalten.
theological_decisions:
- issue: Stärke von δούλη in Esters Selbstbezeichnung
  choice: Sklavin
  alternative: Dienerin / Magd
  rationale: „Sklavin“ bewahrt die im griechischen Ausdruck liegende starke Unterordnung, ohne sie durch eine höfisch weichere Bezeichnung abzuschwächen.
- issue: Kultische Bedeutung von οἶνον σπονδῶν
  choice: Trankopferwein
  alternative: Wein von Trankopfern / Wein für Trankopfer
  rationale: Die Übersetzung erhält den möglichen kultischen Zusammenhang, legt aber nicht genauer fest, ob der Wein bereits dargebracht worden war oder für Trankopfer bestimmt war.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der auffällige Wechsel von der dritten Person („deine Sklavin aß“) zur ersten Person („ich erwies … und trank“) wird entsprechend dem griechischen Text bewahrt. Das Semikolon macht den Wechsel lesbar, ohne ihn zu glätten.
