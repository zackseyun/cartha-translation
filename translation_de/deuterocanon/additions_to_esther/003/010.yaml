  to: Höre mein Flehen und erbarme dich deines Volkes, das dir als Los zugeteilt ist[a]. Verwandle unsere Trauer in Freude, damit wir als Lebende deinem Namen Loblieder singen, Herr. Vernichte nicht den Mund derer, die dich loben.[b] Und ganz Israel schrie aus voller Kraft, denn ihr Tod stand ihnen vor Augen.
