base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/010.yaml
  text: Hear my petition and be merciful to your allotted people[a], and turn our mourning into gladness, so that, living, we may sing praise to your name, O Lord, and do not destroy the mouth of those who praise you. And all Israel cried out with all their strength[b], because their death was before their eyes.
translation:
  language: de
  text: Höre mein Flehen und erbarme dich deines Volkes, das dir als Los zugeteilt ist[a]. Verwandle unsere Trauer in Freude, damit wir als Lebende deinem Namen Loblieder singen, Herr. Vernichte nicht den Mund derer, die dich loben.[b] Und ganz Israel schrie aus voller Kraft, denn ihr Tod stand ihnen vor Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sei deinem Los gnädig“ oder „erbarme dich deines Loses“. Gemeint ist im Zusammenhang Gottes ihm zugehöriges Volk.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild „den Mund vernichten“ bedeutet hier, diejenigen nicht zugrunde gehen zu lassen und so ihr Gotteslob nicht verstummen zu lassen.
    reason: idiom_explanation
lexical_decisions:
- source_word: κουσον τῆς δεήσεώς μου
  choice: Höre mein Flehen
  rationale: Der überlieferte Text hat offenbar die verkürzte Form von ἄκουσον. „Flehen“ gibt δέησις als dringliche Bitte in natürlicher deutscher Gebetssprache wieder.
- source_word: ἱλάσθητι τῷ κλήρῳ σου
  choice: erbarme dich deines dir zugelosten Volkes
  rationale: ἱλάσθητι bezeichnet hier die Bitte um Erbarmen beziehungsweise gnädige Zuwendung. κλῆρος bedeutet wörtlich „Los“ oder „zugeloster Anteil“ und meint im Zusammenhang Gottes Volk; die Formulierung bewahrt beides.
- source_word: στρέψον τὸ πένθος ἡμῶν εἰς εὐφροσύνην
  choice: Verwandle unsere Trauer in Freude
  rationale: Die Wendung erhält das Motiv der vollständigen Umkehrung von Trauer zu freudigem Ergehen und klingt im modernen Deutsch natürlich.
- source_word: ἵνα ζῶντες ὑμνῶμεν σου τὸ ὄνομα
  choice: damit wir am Leben bleiben und deinem Namen Loblieder singen
  rationale: ζῶντες bezeichnet hier das Weiterleben als Voraussetzung des Lobgesangs; ὑμνῶμεν wird durch „Loblieder singen“ spezifischer wiedergegeben als durch das allgemeinere „loben“.
- source_word: μὴ ἀφανίσῃς στόμα αἰνούντων σου
  choice: Vernichte nicht den Mund derer, die dich loben
  rationale: Die konkrete und eindringliche Bildsprache des Griechischen bleibt erhalten, statt sie im Haupttext zu „bringe nicht zum Schweigen“ aufzulösen.
- source_word: ἐκέκραξαν ἐξ ἰσχύος αὐτῶν
  choice: schrie aus voller Kraft
  rationale: Die idiomatische deutsche Formulierung vermittelt den nachdrücklichen, mit ganzer Kraft ausgestoßenen Hilferuf.
- source_word: θάνατος αὐτῶν ἐν ὀφθαλμοῖς αὐτῶν
  choice: ihr Tod stand ihnen vor Augen
  rationale: Die doppelte Bezugnahme auf Israel wird bewahrt; „vor Augen stehen“ ist zugleich nah am griechischen Bild und idiomatisch deutsch.
theological_decisions:
- issue: Wiedergabe von κύριε
  choice: Herr
  alternative: HERR
  rationale: Der griechische Text bietet κύριε. Ohne unmittelbaren hebräischen Gottesnamen ist „Herr“ die sachgerechte Wiedergabe.
- issue: Deutung von τῷ κλήρῳ σου
  choice: deines dir zugelosten Volkes
  alternative: deines Loses / deines Erbteils
  rationale: κλῆρος bleibt als Zulosungsbegriff erkennbar, während der Kontext deutlich macht, dass Israel als Gottes zugehöriges Volk gemeint ist. Die Formulierung vermeidet sowohl unverständliche Wörtlichkeit als auch eine vollständige Auflösung des Bildes.
- issue: Sinn von ἵνα ζῶντες
  choice: damit wir am Leben bleiben und …
  alternative: damit wir, solange wir leben, …
  rationale: Im Kontext drohender Vernichtung ist das Überleben Voraussetzung und Zweckzusammenhang des künftigen Lobes. Die Alternative könnte lediglich die Dauer des Lobens innerhalb eines ohnehin vorausgesetzten Lebens ausdrücken.
translation_notes:
  register: Moderne, würdige Gebetssprache mit direkter Anrede. Die ungewöhnliche Bildsprache des Originals wird im Haupttext bewahrt und knapp erläutert; Satzbau und Wortwahl bleiben für heutige Leser verständlich.
