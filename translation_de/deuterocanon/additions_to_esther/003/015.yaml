  yaml_path: translation/deuterocanon/additions_to_esther/003/015.yaml
  text: I had heard from my birth[a], in the tribe of my ancestral family, that you, Lord, took Israel from among all the nations, and our fathers from among all their ancestors, as an everlasting inheritance, and you did for them what you spoke.
translation:
  language: de
  text: Seit meiner Geburt habe ich im Stamm meines Vaterhauses gehört, dass du, Herr, Israel aus allen Völkern und unsere Väter aus allen ihren Vorfahren als ewiges Erbteil genommen hast. Du hast für sie alles getan, was du gesagt hast.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast für sie erfüllt, was du verheißen hast.“ Wörtlicher lautet das Griechische: „Du hast für sie getan, was du gesagt hast.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἤκουον ἐκ γενετῆς μου
  choice: Von meiner Geburt an hörte ich
  rationale: Der Imperfekt bezeichnet hier das fortgesetzte Hören und Empfangen einer Überlieferung seit frühester Zeit. Die Formulierung bleibt nah am griechischen Wortlaut und ist im Deutschen verständlich.
- source_word: ἐν φυλῇ πατριάς μου
  choice: im Stamm meines Vaterhauses
  rationale: φυλή bezeichnet den Stamm, πατριά die durch Abstammung verbundene Sippe beziehungsweise das Vaterhaus. Die Wiedergabe bewahrt beide Ebenen der Verwandtschaft.
- source_word: σύ, Κύριε
  choice: du, Herr
  rationale: Die direkte Anrede wird ohne altertümliches „o“ wiedergegeben; „Herr“ entspricht κύριος.
- source_word: ἔλαβες ... ἐκ πάντων τῶν ἐθνῶν
  choice: aus allen Völkern ... genommen hast
  rationale: λαμβάνω wird grundnah mit „nehmen“ wiedergegeben; ἐκ bezeichnet die Herausnahme aus einer größeren Gesamtheit. „Völker“ vermeidet die stärker deutende Wiedergabe „Heiden“.
- source_word: τοὺς πατέρας ἡμῶν
  choice: unsere Väter
  rationale: Die ausdrücklich männliche Verwandtschaftsbezeichnung des griechischen Textes bleibt erhalten.
- source_word: ἐκ πάντων τῶν προγόνων αὐτῶν
  choice: aus allen ihren Vorfahren
  rationale: πρόγονοι bezeichnet Vorfahren; das Pronomen wird entsprechend der griechischen Syntax auf „unsere Väter“ bezogen. Die ungewöhnliche Aussage wird nicht geglättet.
- source_word: εἰς κληρονομίαν αἰώνιον
  choice: zu einem ewigen Erbteil
  rationale: „Erbteil“ bewahrt den bundestheologischen Klang von κληρονομία, während „ewig“ αἰώνιον direkt wiedergibt.
- source_word: ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  choice: du hast für sie alles getan, was du gesagt hattest
  rationale: Die Formulierung folgt den Verben ποιέω und λαλέω und gibt das pluralische ὅσα mit „alles, was“ wieder. Das Plusquamperfekt verdeutlicht im Deutschen, dass das Reden dem Tun vorausging, ohne „sagen“ zu „versprechen“ umzudeuten.
theological_decisions:
- issue: Bundessprachliche Bedeutung von εἰς κληρονομίαν αἰώνιον
  choice: zu einem ewigen Erbteil
  alternative: zu ewigem Besitz
  rationale: „Erbteil“ bewahrt die Sprache von Erwählung und Bund, legt aber nicht über den griechischen Satz hinaus fest, wie das Verhältnis von Israel, den Vätern und Gottes Erbteil systematisch zu verstehen ist.
- issue: Verhältnis von Gottes Reden und Tun in ἐποίησας ... ὅσα ἐλάλησας
  choice: alles getan, was du gesagt hattest
  alternative: alles erfüllt, was du verheißen hattest
  rationale: Die Hauptfassung bewahrt die allgemeineren griechischen Verben und lässt offen, ob das Reden ausdrücklich als Verheißung bezeichnet werden soll. Die mögliche erfüllungstheologische Deutung wird nur in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die Anrede „du, Herr“ und der bundessprachliche Ausdruck „ewiges Erbteil“ bewahren den feierlichen Ton; schwer verständliche Archaismen werden vermieden. Die auffällige Wendung „aus allen ihren Vorfahren“ bleibt aus Treue zur griechischen Syntax stehen.
