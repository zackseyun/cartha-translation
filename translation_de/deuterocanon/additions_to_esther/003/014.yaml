lexical_decisions:
- source_word: κίνδυνός μου
  choice: mein Leben steht auf dem Spiel
  rationale: κίνδυνος bezeichnet wörtlich „Gefahr“ oder „Wagnis“. Zusammen mit ἐν χειρί μου drückt die Wendung aus, dass das eigene Leben unmittelbar gefährdet ist. „Mein Leben steht auf dem Spiel“ gibt diesen Sinn in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: ἐν χειρί μου
  choice: steht auf dem Spiel
  rationale: Wörtlich bedeutet die Wortgruppe „in meiner Hand“. Eine formale Wiedergabe wie „mein Leben liegt in meiner Hand“ könnte im Deutschen fälschlich Selbstbestimmung oder Kontrolle ausdrücken. Die idiomatische Übersetzung wahrt hier den gemeinten Gedanken der Lebensgefahr; das Handbild wird in der Fußnote dokumentiert.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet hier eine Begründung oder Erläuterung ein. „Denn“ schließt knapp und angemessen an den vorausgehenden Satz an.
