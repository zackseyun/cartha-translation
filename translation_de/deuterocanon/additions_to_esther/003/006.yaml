lexical_decisions:
- source_word: ἠδυνάμην
  choice: ich hätte … können
  rationale: Die Imperfektform von δύναμαι bezeichnet hier im Zusammenhang von Esters Gebet eine in der Vergangenheit gedachte Bereitschaft oder Möglichkeit. Die Formulierung wahrt den hypothetischen beziehungsweise konzessiven Sinn, ohne eine tatsächlich vollzogene Handlung zu behaupten.
- source_word: φιλεῖν
  choice: küssen
  rationale: Obwohl φιλέω auch „lieben“ bedeuten kann, bezeichnet es mit dem konkreten körperlichen Objekt „die Sohlen seiner Füße“ am natürlichsten einen Kuss als Zeichen äußerster Unterwerfung oder Huldigung.
- source_word: πέλματα ποδῶν αὐτοῦ
  choice: die Sohlen seiner Füße
  rationale: πέλμα bezeichnet die Fußsohle beziehungsweise Unterseite des Fußes. Die deutsche Wendung gibt das eindringliche Körperbild klar und idiomatisch wieder.
- source_word: πρὸς σωτηρίαν Ἰσραήλ
  choice: um Israel zu retten
  rationale: πρός mit σωτηρία bezeichnet hier Ziel oder Zweck. Die verbale Wiedergabe klingt im modernen Deutsch natürlich und versteht σωτηρία kontextgemäß als Rettung beziehungsweise Befreiung Israels.
theological_decisions:
- issue: Art von Esters Aussage über ihre Unterwerfung
  choice: Hypothetische Aussage ihrer Bereitschaft zu äußerster Huldigung, um Israel zu retten
  alternative: Bericht über eine tatsächlich vollzogene Handlung oder allgemeine Aussage ihrer Liebe beziehungsweise Ehrerbietung
  rationale: Die Konstruktion mit ἠδυνάμην wird am besten als Aussage dessen verstanden, wozu Ester um Israels Rettung willen bereit gewesen wäre. Das konkrete Bild der Fußsohlen spricht für äußerste Unterwerfung statt bloß allgemeiner Zuneigung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschauliche Wendung „die Sohlen seiner Füße küssen“ bleibt erhalten; „um Israel zu retten“ vermeidet zugleich, dass „Rettung“ hier unnötig auf einen entwickelten dogmatischen Sinn verengt wird.
