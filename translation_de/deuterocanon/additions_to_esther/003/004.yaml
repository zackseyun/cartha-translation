  text: And you are Lord of all[a], and there is no one who will oppose you, O Lord.
translation:
  language: de
  text: Und du bist Herr über alles, und niemand wird sich dir widersetzen, Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: In diesem Gebetskontext ist κύριος ein unmittelbar auf Gott bezogener Hoheitstitel; „Herr“ bewahrt Autorität und ehrfürchtigen Klang.
- source_word: πάντων
  choice: über alles
  rationale: Der Genitiv bezeichnet hier den Herrschaftsbereich. „Herr über alles“ ist im modernen Deutschen natürlicher als „Herr von allem“ und gibt den Sinn präzise wieder.
- source_word: οὐκ ἔστιν ὃς
  choice: niemand kann
  rationale: Die griechische Wendung verneint, dass es überhaupt jemanden gibt, der sich Gott entgegenstellen könnte. Die deutsche Formulierung ist idiomatisch, ohne die Aussage abzuschwächen.
- source_word: ἀντιτάξεται
  choice: sich widersetzen
  rationale: Das mediale Verb bezeichnet, dass jemand sich gegen einen anderen stellt. „Sich widersetzen“ erhält diesen reflexiven und gegnerischen Sinn.
- source_word: σοι
  choice: dir
  rationale: Der Dativ wird entsprechend der deutschen Rektion von „sich widersetzen“ mit „dir“ wiedergegeben.
- source_word: τῷ κυρίῳ
  choice: Herr
  rationale: Der formal artikulierte Dativ wird im Gebetszusammenhang als Anrede verstanden. Das Deutsche verwendet dafür natürlich den artikellosen Vokativ „Herr“.
theological_decisions:
- issue: Die Wiederholung von κύριος als Gottesbezeichnung und direkte Anrede
  choice: Herr über alles … Herr
  alternative: Herr über alles … dem Herrn
  rationale: Das zweite κύριος steht zwar formal im Dativ mit Artikel, fungiert im Sprachgebrauch der Septuaginta hier jedoch als Anrede. Die vokativische Wiedergabe ergibt einen kohärenten Gebetssatz und bewahrt die Wiederholung des Gottestitels.
translation_notes:
  register: Modernes, klares und zugleich würdiges Gebetsdeutsch. Die koordinierende Satzform des Griechischen und die wiederholte Anrede „Herr“ bleiben erhalten.
