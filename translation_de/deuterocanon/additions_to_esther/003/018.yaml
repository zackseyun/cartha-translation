lexical_decisions:
- source_word: οὐχ ἱκανώθησαν
  choice: war ihnen … nicht genug
  rationale: Die Wendung gibt idiomatisch wieder, dass der bisherige Zustand ihnen nicht ausreichte, ohne ein zusätzliches Motiv wie Unzufriedenheit einzutragen.
- source_word: ἐν πικρασμῷ δουλείας ἡμῶν
  choice: die Bitterkeit unserer Sklaverei
  rationale: „Bitterkeit“ bildet πικρασμός eng ab; „Sklaverei“ bewahrt die Schwere und Konkretheit von δουλεία. Die Genitivverbindung bleibt erhalten.
- source_word: ἔθηκαν τὰς χεῖρας αὐτῶν
  choice: sie legten Hand an uns
  rationale: Das griechische Bild wird mit der natürlichen deutschen Wendung „Hand an jemanden legen“ wiedergegeben. „An uns“ ist im Griechischen nicht ausdrücklich gesetzt, wird aber durch den Zusammenhang und die im Deutschen ergänzungsbedürftige Redewendung nahegelegt; die Ellipse wird in der Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe von δουλεία im Zusammenhang nationaler Unterwerfung
  choice: Sklaverei
  alternative: Knechtschaft
  rationale: „Sklaverei“ bewahrt die starke Aussage über Unfreiheit und Unterwerfung, ohne die Formulierung durch einen traditionell-religiösen Ausdruck abzuschwächen.
- issue: Unausgesprochenes Objekt bei ἔθηκαν τὰς χεῖρας αὐτῶν
  choice: an uns
  alternative: sie legten ihre Hände an
  rationale: Die Ergänzung ergibt im Deutschen eine verständliche feindselige Handlung, ohne deren genaue Art festzulegen. Eine streng formale Wiedergabe bliebe unnatürlich und unvollständig; die echte Ellipse des Griechischen wird deshalb angemerkt.
translation_notes:
