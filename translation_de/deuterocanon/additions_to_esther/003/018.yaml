  text: Doch nun war ihnen die Bitterkeit unserer Sklaverei nicht genug, sondern sie legten Hand an[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie legten ihre Hände an“. Das Ziel der Handlung wird im Griechischen nicht genannt; im Zusammenhang ist wohl feindseliges oder weitergehendes Vorgehen gemeint.'
