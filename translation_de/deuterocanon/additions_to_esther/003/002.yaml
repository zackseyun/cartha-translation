base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/002.yaml
  text: And he said[a], “Lord, Lord, King over all powers, because everything is in your authority, and there is no one who can oppose you when you desire to save Israel.”
translation:
  language: de
  text: 'Und er sagte: »Herr, Herr, König über alle Mächte[a], denn alles steht in deiner Vollmacht, und niemand kann dir widerstehen, wenn du Israel retten willst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »König aller Herrschaftsgewalten«. Das griechische Wort kann Macht, Herrschaft oder Herrschaftsgewalt bezeichnen und ist nicht auf politische Königreiche beschränkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος dient im Gebet als Gottesbezeichnung. »Herr« ist die natürliche und würdevolle deutsche Entsprechung; die Wiederholung des griechischen Textes bleibt erhalten.
- source_word: βασιλεῦ πάντων κρατῶν
  choice: König über alle Mächte
  rationale: βασιλεύς bedeutet »König«; der Plural κρατῶν bezeichnet umfassend Mächte, Gewalten oder Herrschaftsbereiche. »Über alle Mächte« drückt Gottes uneingeschränkte Souveränität aus, ohne die Wendung auf politische Reiche zu verengen.
- source_word: ἐν ἐξουσίᾳ σου
  choice: steht in deiner Vollmacht
  rationale: ἐξουσία umfasst Macht und rechtmäßige Verfügungsgewalt. »Vollmacht« bewahrt beide Aspekte und verbindet sich im Deutschen idiomatisch mit »alles steht in«.
- source_word: τὸ πᾶν
  choice: alles
  rationale: Das substantivierte Neutrum bezeichnet die Gesamtheit; »alles« gibt dies im Deutschen knapp und natürlich wieder.
- source_word: ὁ ἀντιδρῶσων
  choice: niemand kann dir widerstehen
  rationale: Das substantivierte Futurpartizip bezeichnet jemanden, der entgegentritt oder wirksam Widerstand leistet. Die verneinte deutsche Wendung gibt den Sinn klar wieder.
- source_word: ἐν τῷ θέλειν σε
  choice: wenn du … willst
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv ist hier zeitlich beziehungsweise umstandsbezogen. »Wenn du … willst« wahrt den Bezug auf Gottes Willen und klingt natürlicher als eine nominale Wiedergabe.
- source_word: σῶσαι τὸν Ἰσραήλ
  choice: Israel retten
  rationale: σῴζω kann »retten« oder »befreien« bedeuten. »Retten« ist direkt, kontextgemäß und lässt die Art der Rettung offen.
theological_decisions:
- issue: Wiederholte Anrede Κύριε, κύριε
  choice: Herr, Herr
  alternative: O Herr, Herr
  rationale: Die Wiederholung vermittelt Dringlichkeit und Ehrfurcht und wird ohne einen im Griechischen nicht ausgedrückten Zusatz beibehalten.
- issue: Bedeutungsumfang von κρατῶν
  choice: alle Mächte
  alternative: alle Herrschaftsgewalten
  rationale: Die Aussage umfasst mehr als irdische Königreiche. »Mächte« erhält den weiten Sinn und vermeidet eine konfessionell oder kosmologisch zu enge Festlegung.
- issue: Nuance von ἐξουσία
  choice: Vollmacht
  alternative: Macht
  rationale: »Vollmacht« bringt sowohl wirksame Macht als auch souveräne Autorität zum Ausdruck. Die Alternative »Macht« ist möglich, würde die Autoritätsnuance jedoch schwächer abbilden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Gebetsregister. Die Syntax bleibt quellennah, wird aber durch »alles steht in deiner Vollmacht« und »wenn du … willst« natürlich deutsch gestaltet. Die umfassende Aussage über Gottes Souveränität wird bewahrt, ohne die Mehrdeutigkeit von κράτος und ἐξουσία dogmatisch einzuengen.
