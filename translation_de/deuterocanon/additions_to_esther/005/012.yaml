  text: But[a], unable to bear his arrogance, he made it his aim to deprive us of both our position and our life.
translation:
  language: de
  text: Doch[a] weil er dessen Überheblichkeit nicht ertragen konnte, setzte er alles daran, uns sowohl unserer Stellung als auch unseres Lebens zu berauben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „uns sowohl unserer Herrschaftsgewalt als auch unseres Geistes/Lebenshauchs zu berauben“. Das griechische Wort für „Stellung“ kann auch „Herrschaft“, „Amt“ oder „Autorität“ bedeuten; das Wort für „Leben“ auch „Geist“, „Atem“ oder „Lebenshauch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐνέγκας
  choice: weil er … nicht ertragen konnte
  rationale: Das Aoristpartizip von φέρω bezeichnet hier idiomatisch das Ertragen oder Aushalten und hat im Satz begründende beziehungsweise umstandsangebende Funktion.
- source_word: τὴν ὑπερηφανίαν
  choice: dessen Überheblichkeit
  rationale: ὑπερηφανία bezeichnet hochmütige, anmaßende Haltung. Das Demonstrativpronomen vermeidet eine im isolierten Vers mögliche Unklarheit des deutschen Possessivpronomens „seine“.
- source_word: ἐπετήδευσεν
  choice: setzte er alles daran
  rationale: Das Verb bezeichnet ein bewusstes Betreiben oder zielgerichtetes Verfolgen. Die Wendung gibt die entschlossene Absicht natürlich wieder, ohne den Erfolg vorwegzunehmen.
- source_word: τῆς ἀρχῆς
  choice: unserer Stellung
  rationale: ἀρχή kann Herrschaft, Amt oder Autorität meinen. „Stellung“ wahrt im höfisch-politischen Zusammenhang die nötige Bedeutungsbreite.
- source_word: στερῆσαι ἡμᾶς
  choice: uns … zu berauben
  rationale: στερέω mit Genitiv bedeutet, jemanden einer Sache zu berauben. Die deutsche Konstruktion bildet diese Beziehung präzise und idiomatisch ab.
- source_word: καὶ τοῦ πνεύματος
  choice: als auch unseres Lebens
  rationale: πνεῦμα kann Geist, Atem oder Lebenshauch bezeichnen. Nach dem Verlust politischer Stellung ist hier wahrscheinlich der Verlust des Lebens gemeint; die Mehrdeutigkeit wird in der Fußnote festgehalten.
theological_decisions:
- issue: Bedeutung von πνεῦμα im Zusammenhang einer politischen Bedrohung
  choice: Leben
  alternative: Geist, Atem oder Lebenshauch
  rationale: Die Steigerung vom Verlust der Stellung zum Verlust des πνεῦμα weist im Kontext auf das physische Leben. „Leben“ vermeidet zugleich, ohne sachlichen Grund eine anthropologische oder dogmatische Aussage über einen immateriellen Geist einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ führt den Gegensatz knapp fort. „Setzte er alles daran“ macht die zielgerichtete Absicht verständlich; die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit von ἀρχή und πνεῦμα.
