  yaml_path: translation/deuterocanon/additions_to_esther/005/021.yaml
  text: For God[a], who rules over all, has made this a joy for them instead of the destruction of the chosen race,
translation:
  language: de
  text: Denn Gott, der über alles herrscht, hat dies für sie statt der Vernichtung des auserwählten Volkes[a] zur Freude gemacht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des auserwählten Geschlechts“. Das griechische Wort γένος kann sowohl ein Volk als auch eine durch gemeinsame Abstammung verbundene Gemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην
  choice: dies
  rationale: Das feminine Akkusativpronomen verweist auf den unmittelbar vorausgehenden Sachverhalt. „Dies“ lässt den Bezug ebenso offen wie der griechische Text.
- source_word: ὁ πάντα δυναστεύων θεὸς
  choice: Gott, der über alles herrscht
  rationale: δυναστεύω bezeichnet das Ausüben von Macht oder Herrschaft. Die Wiedergabe ist im Deutschen natürlich und bewahrt den Gedanken der aktiven göttlichen Souveränität, ohne einen später festgeprägten Gottestitel einzuführen.
- source_word: ἀντʼ ὀλεθρίας
  choice: statt der Vernichtung
  rationale: ἀντί bezeichnet hier den Austausch beziehungsweise Gegensatz, während ὀλεθρία Untergang, Verderben oder Vernichtung meint. Im Kontext der drohenden Auslöschung trifft „Vernichtung“ die Aussage präzise.
- source_word: τοῦ ἐκλεκτοῦ γένους
  choice: des auserwählten Volkes
  rationale: γένος kann Herkunftsgemeinschaft, Geschlecht, Stamm oder Volk bezeichnen. Im jüdischen Gemeinschaftskontext ist „Volk“ verständlich und sachgerecht; die stärker abstammungsbezogene Möglichkeit bleibt in der Fußnote erhalten.
- source_word: ἐποίησεν αὐτοῖς εὐφροσύνην
  choice: hat dies für sie … zur Freude gemacht
  rationale: ποιέω mit prädikativem Akkusativ kann „zu etwas machen“ bedeuten. Die Formulierung verbindet ταύτην unmittelbar mit εὐφροσύνη und gibt das Perfekt im Deutschen natürlich wieder.
theological_decisions:
- issue: Göttliche Herrschaft in ὁ πάντα δυναστεύων θεὸς
  choice: Gott, der über alles herrscht
  alternative: der allmächtige Gott; Gott, der Macht über alles hat
  rationale: Der griechische Ausdruck betont Gottes ausgeübte Herrschaft bei der Abwendung der drohenden Vernichtung. „Über alles herrscht“ erhält diese Aussage, ohne δυναστεύων mit dem nicht ausdrücklich verwendeten festen Titel „der Allmächtige“ gleichzusetzen.
- issue: Bezeichnung Israels als τοῦ ἐκλεκτοῦ γένους
  choice: des auserwählten Volkes
  alternative: des auserwählten Geschlechts; der auserwählten Abstammungsgemeinschaft
  rationale: Der Ausdruck verbindet Erwählung mit gemeinsamer Herkunft und korporativer Identität. „Volk“ ist in modernem Deutsch am klarsten, während die Fußnote die im Wort γένος liegende Abstammungsnuance dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt die Umkehrung von drohender Vernichtung zu Freude. Das abschließende Komma folgt der Vorlage als Teil eines weiterlaufenden Satzes beziehungsweise Abschnitts.
