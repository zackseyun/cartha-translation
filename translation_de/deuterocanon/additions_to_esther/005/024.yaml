base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/024.yaml
  text: But every city or region as a whole that does not act according to these orders will be consumed with spear and fire in wrath[a]; it will be made not only impassable to men[b], but also most hateful to wild animals and birds for all time.
translation:
  language: de
  text: Jede Stadt oder Region aber, die nicht entsprechend handelt, wird als Ganzes mit Speer und Feuer im Zorn vernichtet werden[a]. Sie wird nicht nur für Menschen unzugänglich, sondern auch für wilde Tiere und Vögel für alle Zeit höchst verhasst gemacht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann καταναλωθήσεται auch mit „verzehrt werden“ wiedergegeben werden; δόρατι bezeichnet ausdrücklich einen Speer, nicht ein Schwert.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα δὲ πόλις ἢ χώρα τὸ σύνολον
  choice: Jede Stadt oder jedes Gebiet als Ganzes aber
  rationale: Die distributive Aussage von πᾶσα mit πόλις ἢ χώρα wird bewahrt; τὸ σύνολον unterstreicht die Gesamtheit und wird natürlich mit „als Ganzes“ wiedergegeben.
- source_word: κατὰ ταῦτα μὴ ποιήσῃ
  choice: das nicht danach handelt
  rationale: Die Wendung verweist auf die zuvor erlassenen Anordnungen. „Danach handelt“ bleibt knapp und entspricht dem rechtlich-administrativen Zusammenhang, ohne das unbestimmte ταῦτα übermäßig zu präzisieren.
- source_word: δόρατι καὶ πυρὶ
  choice: mit Speer und Feuer
  rationale: δόρατι bezeichnet wörtlich den Speer; die konkrete Waffenmetapher wird nicht zum allgemeineren „Schwert“ geglättet. Der Dativ kann instrumental mit „mit“ wiedergegeben werden.
- source_word: καταναλωθήσεται μετʼ ὀργῆς
  choice: wird ... im Zorn vernichtet werden
  rationale: καταναλίσκω bezeichnet vollständiges Aufzehren oder Vernichten. Da „mit Feuer verzehrt“ im Deutschen den Speer als paralleles Mittel sprachlich schwächt, gibt „vernichtet“ den Gesamtsinn natürlich wieder; „im Zorn“ bewahrt μετʼ ὀργῆς.
- source_word: ἀνθρώποις ἄβατος
  choice: für Menschen unzugänglich
  rationale: ἄβατος bezeichnet einen Ort, der nicht betreten oder erreicht werden kann. „Unzugänglich“ passt hier natürlicher als „unpassierbar“; ἀνθρώποις meint Menschen allgemein.
- source_word: θηρίοις καὶ πετεινοῖς
  choice: für wilde Tiere und Vögel
  rationale: θηρία sind wilde Tiere, πετεινά fliegende Tiere beziehungsweise Vögel. Die Wiedergabe ist konkret und allgemein verständlich.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: für alle Zeit
  rationale: Die Wendung bezeichnet eine umfassende, fortdauernde Zeitspanne und behält in dieser Form ihren feierlich-drohenden Ton.
- source_word: ἔχθιστος κατασταθήσεται
  choice: höchst verhasst gemacht werden
  rationale: ἔχθιστος ist ein Superlativ („am meisten verhasst“), und das Passiv von καθίστημι bezeichnet das Versetzen in diesen Zustand. Die ungewöhnlich starke Personifikation des Gebietes bleibt erhalten.
theological_decisions:
- issue: Generischer Gebrauch von ἀνθρώποις
  choice: Menschen
  alternative: Männer
  rationale: ἀνθρώποις bezeichnet hier die menschliche Gattung im Gegensatz zu wilden Tieren und Vögeln. Das moderne deutsche „Menschen“ gibt diese generische Bedeutung genau wieder, ohne einen ausschließlich männlichen Personenkreis nahezulegen.
- issue: Zerstörungsinstrument δόρατι
  choice: Speer
  alternative: Schwert
  rationale: Der griechische Text nennt ausdrücklich den Speer. Die konkrete Lesart hat Vorrang vor einer traditionsbedingten Verallgemeinerung zu „Schwert“.
- issue: Bezug von μετʼ ὀργῆς
  choice: im Zorn
  alternative: mit Zorn / zornig
  rationale: Die Präpositionalphrase kann begleitenden Umstand oder Art und Weise ausdrücken. „Im Zorn“ wahrt diese Offenheit und legt nicht ausdrücklich fest, wessen Zorn gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem feierlich-drohenden Ton eines königlichen Erlasses. Die sperrige Superlativkonstruktion des Griechischen wird bewusst nicht eingeebnet. Der einzige Fußnotenmarker [a] steht unmittelbar bei der einschlägigen Aussage im Haupttext.
