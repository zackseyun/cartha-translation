base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/007.yaml
  text: But consider whether it is possible[a], not so much from the earlier histories that we have handed down as from the things lying at your feet, while you investigate[c][b], to discern how many lawless deeds have been accomplished by the pestilence of those who rule unworthily.
translation:
  language: de
  text: Doch bedenkt, ob es möglich ist,[a] nicht so sehr aus den älteren Geschichtsberichten, die wir überliefert haben, als aus dem, was euch unmittelbar vor Augen liegt,[b] bei genauer Untersuchung zu erkennen, wie viele frevelhafte Taten durch die Pest[c] derer vollbracht worden sind, die ihre Macht in unwürdiger Weise ausüben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch bedenkt – denn es ist möglich –“. Das Griechische verbindet den Imperativ knapp mit „es ist möglich“ und kann auch als eingeschobene Feststellung verstanden werden.'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Wörtlich: „was euch bei den Füßen liegt“. Die griechische Redewendung meint das, was unmittelbar vor einem liegt oder greifbar nahe ist.'
    reason: idiom
  - marker: c
    text: Das griechische Wort bedeutet wörtlich „Pest“ oder „Seuche“. Hier wird es wahrscheinlich bildlich für den zerstörerischen Charakter derer gebraucht, die ihre Macht unwürdig ausüben.
    reason: cultural_note
lexical_decisions:
- source_word: σκοπεῖτε
  choice: bedenkt
  rationale: Der Imperativ Plural fordert zu aufmerksamer Prüfung und Erwägung auf, nicht nur zum körperlichen Sehen.
- source_word: ἐξέστιν
  choice: ob es möglich ist
  rationale: Im Zusammenhang bezeichnet das Verb eher Möglichkeit als Erlaubnis. Die syntaktische Verbindung mit dem Imperativ ist knapp und ungewöhnlich; die deutsche Fassung bewahrt mit der indirekten Frage den vorsichtigen, rhetorischen Charakter.
- source_word: παλαιοτέρων ... ἱστοριῶν
  choice: den älteren Geschichtsberichten
  rationale: ἱστορίαι meint hier überlieferte historische Berichte oder Aufzeichnungen; „älteren“ gibt den Komparativ wieder.
- source_word: ὡς παρεδώκαμεν
  choice: die wir überliefert haben
  rationale: Die Wendung wird ausdrücklich aufgenommen und bezeichnet die Weitergabe der früheren Berichte.
- source_word: παρὰ πόδας ὑμᾶς
  choice: was euch unmittelbar vor Augen liegt
  rationale: Die wörtliche Wendung „bei euren Füßen“ ist idiomatisch und hebt hervor, was direkt vor den Angesprochenen liegt beziehungsweise unmittelbar greifbar ist.
- source_word: ἐξητοῦντας
  choice: bei genauer Untersuchung
  rationale: Das Partizip beschreibt ein eingehendes Prüfen oder Nachforschen; die nominale Wendung ergibt einen natürlichen deutschen Satz.
- source_word: ἀνοσίως
  choice: frevelhafte
  rationale: Das Adverb kennzeichnet Handlungen als Verletzung dessen, was heilig oder sittlich recht ist. „Frevelhaft“ bewahrt sowohl die religiöse als auch die ethische Schärfe.
- source_word: συντετελεσμένα
  choice: vollbracht worden sind
  rationale: Die Perfekt-Passiv-Form bezeichnet bereits ausgeführte und zum Abschluss gebrachte Taten.
- source_word: λοιμότητι
  choice: Verderblichkeit
  rationale: Das Wort bezeichnet wörtlich eine Pest oder Seuche, wird hier aber bildlich für die zerstörerische Verderbtheit ungeeigneter Machthaber gebraucht. „Verderblichkeit“ macht den Sinn verständlich; die Bildsprache wird in der Fußnote dokumentiert.
- source_word: τῶν ἀναξία δυναστευόντων
  choice: derer, die ihre Macht in unwürdiger Weise ausüben
  rationale: ἀναξία wird adverbial zu δυναστευόντων verstanden. Die Übersetzung hält fest, dass nicht bloß die Personen als unwürdig bezeichnet werden, sondern die Art ihrer Machtausübung.
theological_decisions:
- issue: Religiös-ethische Bedeutung von ἀνοσίως
  choice: frevelhafte Taten
  alternative: gottlose Taten; unheilige Taten; gesetzlose Taten
  rationale: Der Ausdruck verurteilt die Taten als Verstoß gegen Heiliges und sittlich Gebotenes. „Frevelhaft“ erhält diese doppelte Stoßrichtung, ohne sie auf eine bestimmte Gesetzesvorstellung oder ausschließlich kultische Vergehen einzuengen.
- issue: Bildsprache von λοιμότης
  choice: Verderblichkeit mit Hinweis auf das Seuchenbild
  alternative: Pest; Seuche; Verderbtheit
  rationale: Die metaphorische Aussage über die zerstörerische Wirkung schlechter Machtausübung bleibt erkennbar, ohne im Haupttext den missverständlichen Eindruck einer buchstäblichen Epidemie zu erzeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Periodensatz des griechischen Erlasses bleibt erkennbar, wird aber durch klare Gliederung lesbar gehalten. „Geschichtsberichte“, „bei genauer Untersuchung“ und „Macht ausüben“ sind allgemein verständlich, ohne den amtlich-rhetorischen Ton einzuebnen.
