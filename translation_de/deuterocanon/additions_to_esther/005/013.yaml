  text: having sought[a], by devious schemes of deceit, the destruction of Mordecai, our savior and continual benefactor, and Esther, the blameless partner of the kingdom[b], together with all their nation.
translation:
  language: de
  text: und durch raffinierte Machenschaften der Täuschung die Vernichtung Mordechais, unseres Retters[a] und beständigen Wohltäters, sowie Esters, der untadeligen Teilhaberin am Königtum[b], zusammen mit ihrem ganzen Volk beantragt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Retter“ bezeichnet Mordechai hier als jemanden, der gerettet oder bewahrt hat; das Wort ist nicht notwendig als förmlicher Heilstitel zu verstehen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Teilhaberin am Reich“. Das griechische Wort kann Reich, Königsherrschaft oder Königtum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτῆρα
  choice: Retter
  rationale: Das Substantiv bezeichnet jemanden, der rettet oder bewahrt. „Retter“ gibt den Ausdruck direkt wieder und bezieht sich hier auf Mordechais rettendes Handeln, ohne ihn zu einem förmlichen Heilstitel zu machen.
- source_word: διὰ παντὸς
  choice: beständigen
  rationale: Die Wendung bezeichnet fortdauerndes Handeln oder eine bleibende Eigenschaft; „beständig“ passt natürlich zu „Wohltäter“.
- source_word: εὐεργέτην
  choice: Wohltäter
  rationale: Im höfisch-politischen Zusammenhang bezeichnet das Wort jemanden, der wertvolle Dienste geleistet und Gutes getan hat.
- source_word: ἄμεμπτον
  choice: untadeligen
  rationale: Das Adjektiv bedeutet, dass jemand ohne berechtigten Vorwurf und nicht zu beanstanden ist.
- source_word: κοινωνὸν
  choice: Teilhaberin
  rationale: Das Wort bezeichnet hier Esters Anteil an königlicher Stellung oder Herrschaft und nicht bloß persönliche Gemeinschaft.
- source_word: Βασιλείας
  choice: am Königtum
  rationale: βασιλεία kann Reich, Königsherrschaft oder Königtum bezeichnen. In Verbindung mit Esters Teilhabe ist „Königtum“ idiomatischer als „Reich“, lässt den genauen Umfang ihrer Teilhabe aber offen.
- source_word: σὺν παντὶ τῷ τούτων ἔθνει
  choice: zusammen mit ihrem ganzen Volk
  rationale: ἔθνος bezeichnet hier das kollektiv gemeinte Volk; τούτων weist auf Mordechai und Ester gemeinsam zurück.
- source_word: πολυπλόκοις μεθόδων παραλογισμοῖς
  choice: durch raffiniert eingefädelte Täuschungen
  rationale: Die stark abwertende Wortgruppe verbindet Vielschichtigkeit, planmäßige Machenschaften und Irreführung. Die deutsche Formulierung bewahrt diese Elemente in natürlicher Sprache.
- source_word: αἰτησάμενος εἰς ἀπώλειαν
  choice: die Vernichtung … beantragt hatte
  rationale: Das Partizip bezeichnet eine an eine Autorität gerichtete Bitte beziehungsweise einen Antrag, dessen Ziel die Vernichtung der Genannten ist.
theological_decisions:
- issue: Bezeichnung Mordechais als σωτήρ
  choice: „Retter“ im gewöhnlichen Sinn eines Menschen, der rettet oder bewahrt
  alternative: „Befreier“ oder „Bewahrer“
  rationale: Der Ausdruck ist nicht ausschließlich theologisch. Im Erzählzusammenhang bezeichnet er Mordechais rettende Tat für König und Reich; die direkte Wiedergabe bewahrt zugleich die Wortstärke des Griechischen.
- issue: Bedeutung von βασιλεία in Esters Verhältnis zum Königtum
  choice: „Teilhaberin am Königtum“
  alternative: „Teilhaberin am Reich“ oder „Gefährtin der Königsherrschaft“
  rationale: Die Formulierung lässt offen, ob vor allem königliche Würde, Herrschaft oder das Reich gemeint ist, und vermeidet eine überpräzise Festlegung.
- issue: Bezug von τούτων
  choice: 'Das Pronomen bezieht sich gemeinsam auf Mordechai und Ester: „ihr ganzes Volk“'
  alternative: „sein ganzes Volk“ oder „das ganze Volk dieser beiden“
  rationale: Der pluralische Demonstrativ verweist am natürlichsten auf beide zuvor genannten Personen und verbindet sie mit dem bedrohten jüdischen Volk.
translation_notes:
  register: Moderner, würdevoller Standardstil. Die Satzform bleibt als abhängiger Teilsatz erhalten, da auch der griechische Vers mit einem Partizip an den vorausgehenden Zusammenhang anschließt. „Raffiniert eingefädelte Täuschungen“ bündelt die rhetorisch dichte griechische Schmähformel, ohne ihre abwertende Kraft abzuschwächen.
