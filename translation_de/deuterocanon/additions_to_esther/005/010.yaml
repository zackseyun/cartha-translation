  yaml_path: translation/deuterocanon/additions_to_esther/005/010.yaml
  text: For Haman son of Hammedatha[a], a Macedonian, being alien to the true Persian blood and far removed from our goodwill, though he had been received by us as a guest[b],
translation:
  language: de
  text: Denn Haman, der Sohn Hammedathas, ein Makedonier[a], war dem echten persischen Geblüt fremd und von unserer Güte weit entfernt, obwohl wir ihn gastlich bei uns aufgenommen hatten[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bezeichnung »Makedonier« steht ausdrücklich im griechischen Zusatz. Sie kann dessen historische oder polemische Prägung widerspiegeln.
    reason: cultural_note
  - marker: b
    text: Die griechische Wendung hinter »dem echten persischen Geblüt fremd« ist syntaktisch schwierig. Gemeint ist offenbar, dass Haman nicht wirklich persischer Abstammung war.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: Haman, der Sohn Hammedathas
  rationale: Der Genitiv bezeichnet am natürlichsten das Patronym; die Formulierung ist im Deutschen klar und würdevoll.
- source_word: Μακεδὼν
  choice: ein Makedonier
  rationale: Die ausdrückliche ethnische Bezeichnung des griechischen Textes bleibt unverändert erhalten.
- source_word: ταῖς ἀληθείας ἀλλότριος τοῦ τῶν Περσῶν αἵματος
  choice: dem echten persischen Geblüt fremd
  rationale: Die griechische Konstruktion ist auffällig und syntaktisch schwierig. Die Wiedergabe bewahrt ἀλλότριος als »fremd« und versteht ἀληθείας im Sinn echter beziehungsweise unverfälschter persischer Abstammung, ohne die Schwierigkeit zu verschweigen.
- source_word: πολὺ διεστηκὼς
  choice: weit entfernt
  rationale: Das Perfektpartizip bezeichnet einen fortbestehenden Zustand deutlicher Distanz.
- source_word: τῆς ἡμετέρας χρηστότητος
  choice: von unserer Güte
  rationale: χρηστότης bezeichnet Güte, Freundlichkeit oder Wohlwollen; »Güte« wahrt hier den königlich-rhetorischen Ton.
- source_word: ἐπιξενωθεὶς ἡμῖν
  choice: obwohl wir ihn gastlich bei uns aufgenommen hatten
  rationale: Die passive Wendung bezeichnet die Aufnahme beziehungsweise Behandlung als Gast. »Obwohl« macht den im Zusammenhang naheliegenden konzessiven Gegensatz deutlich.
theological_decisions:
- issue: Ethnische Bezeichnung Hamans im griechischen Zusatz
  choice: »ein Makedonier« im Haupttext beibehalten
  alternative: Die Bezeichnung zu »ein Fremder« verallgemeinern oder als späteren polemischen Zusatz abschwächen
  rationale: Μακεδών steht ausdrücklich im maßgeblichen griechischen Text. Die historisch spannungsreiche Angabe darf nicht aufgrund einer vermuteten früheren Textform geglättet werden.
- issue: Deutung der schwierigen Wendung ταῖς ἀληθείας ... τοῦ τῶν Περσῶν αἵματος
  choice: »dem echten persischen Geblüt fremd«
  alternative: »dem persischen Geblüt fremd« oder »nicht wahrhaft persischer Abstammung«
  rationale: Die gewählte Fassung erhält sowohl den Gedanken der Echtheit als auch das Bild des Blutes beziehungsweise Geblüts, während eine Fußnote die syntaktische Unsicherheit offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zum griechischen Text. »Geblüt« bewahrt das Abstammungsbild, ohne die Aussage als biologische Wertung zu bekräftigen. Das abschließende Komma zeigt, dass der Vers nur den Anfang eines längeren griechischen Satzes bildet.
