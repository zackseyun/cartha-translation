  text: because the very man who had brought about these things was crucified at the gate of Susa with his whole household[a], since God, who rules over all, swiftly repaid him with the punishment he deserved,
translation:
  language: de
  text: weil gerade der Mann, der all dies ins Werk gesetzt hatte, an den Toren von Susa samt seinem ganzen Haus gekreuzigt worden war[a], da Gott, der über alles herrscht, rasch das verdiente Strafgericht an ihm vollzogen hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einen Pfahl gehängt“ beziehungsweise „gepfählt“. Das griechische Verb kann eine Hinrichtung an einem Pfahl oder Kreuz bezeichnen; die persische Hinrichtungsart muss nicht der späteren römischen Kreuzigung entsprochen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ
  choice: weil
  rationale: Leitet den kausalen Grund für die vorausgehende Aussage ein und gibt die Konstruktion mit substantiviertem Infinitiv natürlich wieder.
- source_word: αὐτὸν τὸν ταῦτα ἐξεργασάμενον
  choice: gerade der Mann, der all dies ins Werk gesetzt hatte
  rationale: „gerade der Mann“ bewahrt die Hervorhebung durch αὐτόν; „ins Werk gesetzt“ gibt das planvolle Herbeiführen der Vorgänge wieder, ohne sie näher auszudeuten.
- source_word: πρὸς ταῖς Σούσων πύλαις
  choice: an den Toren von Susa
  rationale: Bewahrt sowohl die lokale Bedeutung von πρός mit Dativ als auch den griechischen Plural πύλαις.
- source_word: ἐσταυρῶσθαι
  choice: gekreuzigt worden war
  rationale: Gibt die Grundbedeutung des griechischen Verbs direkt wieder; eine Fußnote hält die historisch mögliche weitere Bedeutung einer Hinrichtung an Pfahl oder Kreuz offen.
- source_word: σὺν τῇ πανοικίᾳ
  choice: samt seinem ganzen Haus
  rationale: „Haus“ bezeichnet hier den gesamten Hausverband und ist weiter als die moderne Kernfamilie; „samt“ bringt die Begleitung knapp zum Ausdruck.
- source_word: τὴν καταξίαν ... κρίσιν
  choice: das verdiente Strafgericht
  rationale: Verbindet die Angemessenheit bzw. Verdienstlichkeit von καταξίαν mit dem richterlich-strafenden Sinn von κρίσιν, ohne den Gerichtscharakter auf bloße Vergeltung zu reduzieren.
- source_word: τοῦ τὰ πάντα ἐπικρατοῦντος θεοῦ
  choice: Gott, der über alles herrscht
  rationale: Gibt Gottes umfassende Macht und Herrschaft klar und würdig wieder, ohne zusätzliche dogmatische Begriffe einzuführen.
- source_word: διὰ τάχους
  choice: rasch
  rationale: Natürliche adverbiale Wiedergabe der schnellen Ausführung.
- source_word: ἀποδόντος αὐτῷ κρίσιν
  choice: das Strafgericht an ihm vollzogen hatte
  rationale: Bewahrt Gottes aktive richterliche Vergeltung und ergibt zusammen mit καταξίαν eine idiomatische deutsche Formulierung.
theological_decisions:
- issue: Gottes Handeln im Gericht
  choice: Gott vollzieht aktiv und rasch das verdiente Strafgericht an dem Täter.
  alternative: Die Hinrichtung könnte sprachlich weniger deutlich als unmittelbares Handeln Gottes dargestellt werden.
  rationale: Der Genitivus absolutus schreibt die richterliche Vergeltung ausdrücklich Gott zu. Die Übersetzung bewahrt diese Aussage, ohne daraus eine weitergehende Lehre über Vorsehung oder Gericht abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als kausaler Teilsatz mit abschließendem Komma erhalten, da der Vers syntaktisch an den Zusammenhang anschließt. Der griechische Plural „Tore“ und die umfassende Bedeutung von „Haus“ wurden bewahrt.
