  text: For by these methods he thought that[a], once he had made us desolate, he would transfer the rule of the Persians to the Macedonians.
translation:
  language: de
  text: Denn er meinte, durch diese Machenschaften[a] werde er uns verwüsten und dann die Herrschaft der Perser an die Makedonen übertragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und zugleich mehrdeutig: „durch diese Vorgehensweisen“. Die griechische Wendung kann auch neutraler „durch diese Mittel“ heißen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ γὰρ τῶν τρόπων τούτων
  choice: Denn … durch diese Machenschaften
  rationale: γάρ wahrt den begründenden Anschluss. τρόποι bezeichnet hier Vorgehensweisen oder Mittel; im politischen Intrigenkontext gibt „Machenschaften“ die negative Färbung natürlich wieder, ohne den Inhalt näher auszumalen.
- source_word: ᾠήθη
  choice: er meinte
  rationale: Das deponentische Aoristverb bezeichnet seine Annahme oder Erwartung. „Meinte“ ist im Deutschen idiomatisch und lässt den folgenden Zukunftsbezug erkennen.
- source_word: λαβὼν ἡμᾶς ἐρήμους
  choice: werde er uns verwüsten und dann
  rationale: Die Verbindung von λαβών mit dem prädikativen ἐρήμους ist idiomatisch und bezeichnet, dass er „uns“ zunächst in einen verödeten beziehungsweise verwüsteten Zustand bringen wollte. Die koordinierte deutsche Fassung macht das zeitliche Verhältnis zum anschließenden Übertragen klar, ohne eine unnatürliche wörtliche Konstruktion zu erzwingen.
- source_word: ἐρήμους
  choice: verwüsten
  rationale: ἐρήμους kann „verödet“, „verlassen“ oder „verwüstet“ bedeuten. Im Blick auf ein Volk beziehungsweise Herrschaftsgebiet drückt „verwüsten“ die beabsichtigte Zerstörung am natürlichsten aus.
- source_word: τὴν τῶν Περσῶν ἐπικράτησιν
  choice: die Herrschaft der Perser
  rationale: ἐπικράτησις bezeichnet Vorherrschaft, Macht oder Herrschaft. „Herrschaft“ bleibt nah an der griechischen Genitivkonstruktion und vermeidet die interpretativ engere Wiedergabe „Reich“.
- source_word: εἰς τοὺς Μακεδόνας μετάξει
  choice: auf die Makedonen übertragen
  rationale: μετάξει bezeichnet hier die Übertragung politischer Herrschaft auf eine andere Gruppe. Im Deutschen ist „Herrschaft auf jemanden übertragen“ die passende Verbindung.
- source_word: τοὺς Μακεδόνας
  choice: die Makedonen
  rationale: Das Ethnonym wird unmittelbar und ohne historisierende Erweiterung wiedergegeben.
theological_decisions:
- issue: Historisch-politische Aussage in einem griechischen Zusatz zu Ester
  choice: Perser und Makedonen werden ausdrücklich genannt, und die politische Herrschaft wird als übertragbar dargestellt.
  alternative: Verallgemeinernd von der Übertragung des persischen Reiches auf die Griechen sprechen.
  rationale: Die Übersetzung folgt den ausdrücklich genannten Völkern und harmonisiert die Aussage nicht mit späteren historischen Begriffen.
- issue: Mehrdeutigkeit von λαβὼν ἡμᾶς ἐρήμους
  choice: Im Haupttext als Herbeiführung eines verwüsteten Zustands wiedergeben.
  alternative: „nachdem er uns verlassen vorgefunden hätte“ oder „nachdem er uns verödet zurückgelassen hätte“.
  rationale: Die Konstruktion ist idiomatisch und lässt die genaue Rolle von λαβών offen. Der Kontext legt ein aktives Zugrunderichten nahe, doch die mögliche Nuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt den begründenden Anschluss mit „Denn“, die politische Terminologie sowie die Abfolge von Verwüstung und Machtübertragung. Die schwer wörtlich wiederzugebende Partizipialkonstruktion wird idiomatisch aufgelöst.
