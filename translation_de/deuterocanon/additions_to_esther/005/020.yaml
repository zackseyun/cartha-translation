  text: and to strengthen them[a], so that they might defend themselves against those who attacked them in the time of distress, on the thirteenth day of the twelfth month, Adar[b], on that same day.
translation:
  language: de
  text: und sie zu stärken[a], damit sie sich gegen die verteidigen könnten, die sie in einer Zeit der Bedrängnis[b] angriffen, am dreizehnten Tag des zwölften Monats, des Monats Adar, an eben diesem Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie zu unterstützen« oder »sie zu verstärken«.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung »in einer Zeit der Bedrängnis« kann auch allgemeiner als »in einer Zeit der Not« oder »in einer Zeit der Bedrückung« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπισχύειν
  choice: sie zu stärken
  rationale: Das Verb bezeichnet zusätzliche Stärkung oder Unterstützung. »Stärken« bewahrt den ursächlichen Sinn und klingt im Deutschen natürlich.
- source_word: ὅπως
  choice: damit
  rationale: Leitet den Zweck ein und gibt die finale Bedeutung knapp und idiomatisch wieder.
- source_word: ἐν καιρῷ θλίψεως
  choice: in einer Zeit der Bedrängnis
  rationale: Die Wendung bezeichnet eine von Druck, Not oder Bedrängnis geprägte Zeit. Die unbestimmte Formulierung wahrt die im Griechischen mögliche allgemeine Bedeutung.
- source_word: ἐπιθεμένους
  choice: die sie ... angriffen
  rationale: ἐπιτίθημι ist hier feindselig gebraucht. »Angreifen« entspricht dem gewaltsamen Kontext in modernem Deutsch.
- source_word: ἀμύνωνται
  choice: sie sich ... verteidigen könnten
  rationale: Der mediale Gebrauch bezeichnet Gegenwehr zum eigenen Schutz. »Sich verteidigen« erhält den reflexiven und defensiven Sinn.
- source_word: τῇ τρισκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: am dreizehnten Tag des zwölften Monats, des Monats Adar
  rationale: Die Datumsformel wird vollständig wiedergegeben; der Monatsname Adar bleibt transliteriert. Die Wiederholung von »Monat« vermeidet im Deutschen die missverständliche Lesart, Adar sei selbst der zwölfte Monatstag.
- source_word: τῇ αὐτῇ ἡμέρᾳ
  choice: an eben diesem Tag
  rationale: »Eben diesem« bewahrt die Betonung der Identität mit dem zuvor genannten Datum.
