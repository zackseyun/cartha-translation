base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/005.yaml
  text: And often[a], by madness, she has made many of those appointed to positions of authority, trusted to manage affairs as friends, sharers in innocent blood, and has engulfed them in disasters beyond remedy[b],
translation:
  language: de
  text: Und oft hat sie[a] durch Wahnsinn viele von denen, die in Machtpositionen eingesetzt und als Freunde mit der Führung der Geschäfte betraut waren, zu Mitschuldigen an unschuldigem Blut[b] gemacht und sie mit unheilbaren Katastrophen überhäuft,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht ein weibliches Subjekt im Singular („sie hat … gemacht und … überhäuft“); worauf es sich bezieht, wird in diesem Vers nicht ausdrücklich gesagt.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „zu Teilhabern an unschuldigem Blut“; gemeint ist die Mitschuld am Vergießen unschuldigen Blutes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: oft
  rationale: Gibt das Adverb der wiederholten وقوع naturally und unmittelbar wieder.
- source_word: τῶν ἐπʼ ἐξουσίας τεταγμένων
  choice: die in einflussreiche Ämter eingesetzt waren
  rationale: τεταγμένων bezeichnet eine Einsetzung oder Bestellung; ἐξουσία verweist hier auf amtliche Autorität.
- source_word: τῶν πιστευθέντων χειρίζειν φίλων τὰ πράγματα
  choice: als Freunde mit der Führung der Geschäfte betraut waren
  rationale: Bewahrt das passive Moment des Anvertrauens, den Freundesstatus und χειρίζειν τὰ πράγματα als Verwaltung öffentlicher Angelegenheiten in natürlichem Deutsch.
- source_word: παρανοίᾳ
  choice: durch Wahnsinn
  rationale: Der Dativ wird instrumental verstanden; „Wahnsinn“ erhält die starke Bedeutung von παρανοία.
- source_word: μετόχους αἱμάτων ἀθώων
  choice: zu Mitschuldigen an unschuldigem Blut
  rationale: μετόχους bezeichnet Teilhaber oder Beteiligte; die Formulierung bewahrt das Blut-Motiv und macht die Beteiligung am Vergießen unschuldigen Blutes verständlich.
- source_word: καταστῆσα
  choice: gemacht
  rationale: 'Gibt die kausative Bedeutung wieder: Sie versetzte die Betroffenen in diesen Zustand.'
- source_word: περιέβαλε συμφοραῖς ἀνηκέστοις
  choice: in unabwendbares Unglück gestürzt
  rationale: περιβάλλω beschreibt hier das Umgeben beziehungsweise Überwältigen durch Not; ἀνήκεστος bezeichnet etwas, das nicht mehr geheilt oder behoben werden kann.
theological_decisions:
- issue: Nicht ausdrücklich genannter Bezug der femininen Singularform
  choice: Das feminine Pronomen „sie“ wird beibehalten und durch eine Fußnote erläutert.
  alternative: Den Bezug als eine bestimmte Person, den Zorn des Königs, das Schicksal oder eine personifizierte Macht identifizieren.
  rationale: Die griechischen Verbformen setzen ein feminines Subjekt voraus, doch der vorliegende Vers nennt es nicht ausdrücklich. Eine nähere Identifizierung würde die im Ausgangstext bestehende Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satzbau bleibt erkennbar, wird aber durch klare attributive Gliederung lesbar gemacht. Das abschließende Komma wurde beibehalten, da der Vers syntaktisch in den folgenden Abschnitt weiterführt.
