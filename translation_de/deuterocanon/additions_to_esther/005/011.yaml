    rationale: Das Verb bezeichnet hier zumindest Huldigung bzw. Niederwerfung vor einem Höhergestellten. »Ehren« kann bloß allgemeine Wertschätzung bedeuten und verliert den unterwürfigen Hofgestus.
  - severity: medium
    issue: »fortwährend die zweite Person nach dem königlichen Thron ist« ist unidiomatisch.
    rationale: Die deutsche Formel lässt offen, was mit »zweite Person« gemeint ist, und klingt nicht wie eine Rangbezeichnung. Der griechische Ausdruck bezeichnet eine dauerhafte Stellung unmittelbar nach dem königlichen Thron.
