  source_fidelity: Die Wiedergabe von ἔτυχεν ... φιλανθρωπίας als »Wir haben ... Wohlwollen erlangt« ist vertretbar und folgt der im englischen Audit gewählten Lesart. Die resultative Konstruktion ἐπὶ τοσοῦτον ὥστε wird korrekt wiedergegeben. Die bisherige Formulierung »von allen geehrt ... die zweite Person ... ist« schwächt προσκυνούμενον deutlich ab und bildet die durative Rangstellung bei διατελεῖν syntaktisch und idiomatisch nur unzureichend ab.
  naturalness: »Die zweite Person nach dem königlichen Thron ist« ist im modernen Deutsch unnatürlich und sachlich missverständlich. Eine Rangformel mit »den zweiten Rang nach dem königlichen Thron innehat« ist klar, würdevoll und bewahrt die höfische Aussage. Die aktive Form »alle ihm huldigen« ist idiomatisch; ein Passiv wie »von allen gehuldigt wird« wäre im Deutschen nicht möglich.
  terminology: »Vater« und »ausgerufen« bewahren den öffentlichen politischen Titel. »Huldigen« gibt προσκυνέω im Hofkontext angemessener wieder als das zu allgemeine »ehren«, ohne eine spezifisch religiöse Anbetung zu behaupten. Die Fußnote hält die körperlich-konkrete Bedeutung der Niederwerfung offen.
