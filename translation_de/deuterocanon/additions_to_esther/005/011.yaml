  yaml_path: translation/deuterocanon/additions_to_esther/005/011.yaml
  text: We have attained such goodwill toward every nation that he is proclaimed our father and is honored by all[a], continuing as the second person to the royal throne.
translation:
  language: de
  text: Wir haben gegenüber jedem Volk ein so großes Wohlwollen erlangt, dass er als unser Vater ausgerufen wird, alle ihm huldigen[a] und er fortwährend den zweiten Rang nach dem königlichen Thron innehat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »sich vor ihm niederwerfen«. Das griechische Verb kann Niederwerfung oder Huldigung vor einem Höhergestellten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυχεν ἧς ἔχομεν ... φιλανθρωπίας
  choice: Wir haben ein solches Maß an Wohlwollen ... erlangt
  rationale: τυγχάνω mit dem Genitiv bezeichnet hier das Erlangen bzw. Genießen einer wohlwollenden Haltung. Die etwas unregelmäßige griechische Konstruktion wird in natürlichem Deutsch wiedergegeben, ohne ihren Erwerbs- oder Empfangssinn aufzugeben.
- source_word: φιλανθρωπίας
  choice: Wohlwollen
  rationale: Das Wort bezeichnet menschenfreundliche Güte oder Geneigtheit. »Wohlwollen« passt zum höfisch-politischen Zusammenhang und vermeidet das im Deutschen missverständliche abstrakte »Menschlichkeit«.
- source_word: πρὸς πᾶν ἔθνος
  choice: gegenüber jedem Volk
  rationale: πρός mit Akkusativ bezeichnet die Ausrichtung des Wohlwollens. ἔθνος wird hier politisch als »Volk« verstanden; der Singular »jedem« bewahrt die distributive Aussage von πᾶν.
- source_word: ἐπὶ τοσοῦτον ὥστε
  choice: ein solches Maß ... dass
  rationale: Die Wendung führt eine Folge ein. Diese Formulierung ist idiomatisch und erhält zugleich den Gradcharakter des griechischen Ausdrucks.
- source_word: ἀναγορεύεσθαι
  choice: als unser Vater ausgerufen wird
  rationale: Das Verb bezeichnet eine öffentliche oder förmliche Proklamation. »Ausgerufen« bewahrt den offiziellen höfischen Ton.
- source_word: πατέρα
  choice: Vater
  rationale: Der wörtliche verwandtschaftliche Titel bleibt erhalten, auch wenn er im politischen Sprachgebrauch Schutz und Patronage andeuten kann.
- source_word: προσκυνούμενον
  choice: von allen geehrt
  rationale: Das Verb kann sowohl körperliche Huldigung vor einem Höhergestellten als auch religiöse Anbetung bezeichnen. Im persischen Hofkontext ist »geehrt« eine zurückhaltende Haupttextfassung; die konkretere Bedeutung steht in der Fußnote.
- source_word: τὸ δεύτερον τοῦ Βασιλικοῦ θρόνου πρόσωπον
  choice: die zweite Person nach dem königlichen Thron
  rationale: πρόσωπον bezeichnet hier wahrscheinlich eine Person oder Persönlichkeit, während δεύτερον den Rang ausdrückt. Die formal gehaltene Wiedergabe bewahrt die ungewöhnliche höfische Formulierung und macht die Stellung unmittelbar nach dem Königsthron kenntlich.
- source_word: διατελεῖν
  choice: fortwährend ... ist
  rationale: διατελέω bringt das dauerhafte Verbleiben in dem beschriebenen Rang zum Ausdruck. »Fortwährend ... ist« bindet den durativen Sinn direkt an die Stellung als zweite Person.
theological_decisions:
- issue: Bedeutung von προσκυνούμενον im königlichen Hofkontext
  choice: von allen geehrt
  alternative: von allen mit einer Verbeugung beziehungsweise Niederwerfung gehuldigt; von allen verehrt; von allen angebetet
  rationale: Das Verb lässt höfische Huldigung und religiöse Anbetung sprachlich zu. Der erzählerische Hofkontext spricht eher für Unterwerfung oder Ehrerbietung gegenüber einem menschlichen Würdenträger. Die Hauptfassung vermeidet daher eine unbegründete Aussage über göttliche Verehrung, während die Fußnote die körperliche und semantische Stärke des griechischen Verbs offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit höfisch-offiziellem Ton. Die ungewöhnliche Rangformel wird bewusst relativ formal bewahrt; »königlichen« wird kleingeschrieben, da es ein gewöhnliches Adjektiv und kein Eigenname ist.
