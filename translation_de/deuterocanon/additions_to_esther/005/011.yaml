revisions:
- from: Wir haben ein solches Maß an Wohlwollen gegenüber jedem Volk erlangt, dass er als unser Vater ausgerufen wird und, von allen geehrt[a], fortwährend die zweite Person nach dem königlichen Thron ist.
  to: Wir haben gegenüber jedem Volk ein so großes Wohlwollen erlangt, dass er als unser Vater ausgerufen wird, alle ihm huldigen[a] und er fortwährend den zweiten Rang nach dem königlichen Thron innehat.
  rationale: Die Revision stärkt die Wiedergabe von προσκυνούμενον zu der im persischen Hofkontext passenden, nicht notwendig religiösen »Huldigung« und ersetzt die unnatürliche wörtliche Rangformel durch eine klare deutsche Rangbezeichnung. Der fortdauernde Aspekt von διατελεῖν bleibt ausdrücklich erhalten.
