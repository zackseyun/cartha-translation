lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet den beabsichtigten Zweck beziehungsweise das erhoffte Ergebnis ein und ist im Deutschen natürlich.
- source_word: καὶ νῦν καὶ μετὰ ταῦτα
  choice: jetzt und auch danach
  rationale: Bewahrt den zeitlichen Gegensatz und klingt natürlicher als das wörtlichere „jetzt und nach diesen Dingen“.
- source_word: σωτηρία
  choice: Rettung
  rationale: Bezeichnet hier konkret Bewahrung aus Gefahr; „Rettung“ wahrt zugleich die mögliche weitere Bedeutungsbreite des griechischen Wortes.
- source_word: εὐνοοῦσιν
  choice: die uns wohlgesinnt sind
  rationale: Gibt die günstige Haltung beziehungsweise das Wohlwollen des Partizips präzise wieder, ohne daraus förmliche Anhängerschaft zu machen.
- source_word: Πέρσαις
  choice: den Persern
  rationale: Der Dativ ist mit ἡμῖν koordiniert und von σωτηρία abhängig.
- source_word: ἐπιβουλεύουσιν
  choice: die gegen uns Pläne schmieden
  rationale: Drückt feindseliges Planen klar und idiomatisch aus.
- source_word: μνημόσυνον
  choice: ein bleibendes Zeichen
  rationale: Vermittelt etwas, das dauerhaft an ein Geschehen erinnert; die Dauerwirkung ist im Begriff des Gedächtniszeichens angelegt.
- source_word: ἀπωλείας
  choice: des Untergangs
  rationale: Passt zum politischen und gerichtlichen Kontext und bezeichnet den vernichtenden Sturz der Gegner.
theological_decisions:
- issue: Bedeutungsumfang von σωτηρία im höfisch-politischen Zusammenhang
  choice: Rettung
  alternative: Heil; Befreiung
  rationale: „Rettung“ bezeichnet die konkrete Bewahrung vor Gefahr, ohne die mögliche religiöse Tiefendimension des Wortes auszuschließen oder ausdrücklich festzulegen.
- issue: Deutung von μνημόσυνον τῆς ἀπωλείας
  choice: ein bleibendes Zeichen des Untergangs
  alternative: ein Gedenken an den Untergang; eine Erinnerung an ihren Untergang
  rationale: 'Die knappe und elliptische griechische Wendung bleibt in ihrer Beziehung offen: Gemeint sein kann ein dauerhaftes Mahn- oder Erinnerungszeichen an den Untergang, ohne dass das Deutsche ausdrücklich ein nicht genanntes Possessivpronomen ergänzt.'
