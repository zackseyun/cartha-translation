  terminology: „Abschrift“, „Brief“, „Großkönig“ und „Satrapien“ sind sachgerecht. „Herrscher der Gebiete in den 127 Satrapien“ ist als Wiedergabe von χωρῶν ἄρχουσι vertretbar, ohne einen spezifischen Amtstitel einzutragen. Die Fußnote sollte die königlichen „Interessen/Angelegenheiten“ nicht auf eine abstrakte „Sache“ verengen.
