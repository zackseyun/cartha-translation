    issue: Die Fußnote erklärt die idiomatische Wendung mit „Sache oder Interessen“ und verengt dadurch die wörtlichere Wiedergabe unnötig.
    rationale: τὰ ἡμέτερα bezieht sich unmittelbar auf das, was den König bzw. die königliche Seite betrifft. „Unsere Interessen“ ist im Kontext präziser und weiterhin idiomatisch.
