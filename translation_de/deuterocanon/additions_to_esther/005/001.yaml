base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/001.yaml
  text: 'The following is a copy of the letter: Great King Artaxerxes to the rulers of the provinces of the one hundred twenty-seven satrapies from India to Ethiopia[a], and to those who are loyal to our interests: greetings.'
translation:
  language: de
  text: 'Folgendes ist eine Abschrift des Briefes:


    Der Großkönig Artaxerxes grüßt die Herrscher der Gebiete in den 127 Satrapien von Indien bis Äthiopien sowie diejenigen, die unsere Interessen unterstützen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die auf das Unsere bedacht sind“; gemeint sind diejenigen, die den Interessen oder Anliegen des Königs zugeneigt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφον
  choice: Abschrift
  rationale: Bezeichnet hier die schriftliche Wiedergabe eines amtlichen Dokuments; „Abschrift“ passt zum königlichen Verwaltungskontext.
- source_word: ἐπιστολῆς
  choice: Brief
  rationale: Gibt die königliche schriftliche Mitteilung klar und in modernem Deutsch wieder.
- source_word: τὰ ὑπογεγραμμένα
  choice: Folgendes
  rationale: Die Wendung führt formelhaft den nachstehenden Wortlaut ein; „Folgendes“ ist idiomatisch und knapp.
- source_word: Βασιλεὺς μέγας
  choice: Großkönig
  rationale: Der etablierte deutsche Titel bewahrt den persisch-imperialen Charakter der Bezeichnung.
- source_word: σατραπείαις
  choice: Satrapien
  rationale: Bewahrt die historische Bezeichnung für persische Verwaltungsbezirke, statt sie durch den allgemeineren Ausdruck „Provinzen“ zu ersetzen.
- source_word: χωρῶν ἄρχουσι
  choice: Herrscher der Gebiete
  rationale: Gibt sowohl die territorialen Einheiten als auch die leitende Stellung der Adressaten wieder, ohne einen spezifischeren Amtstitel einzutragen.
- source_word: τοῖς τὰ ἡμέτερα φρονοῦσι
  choice: alle, die unsere Sache unterstützen
  rationale: Die idiomatische Wendung bezeichnet Menschen, die den Interessen oder Anliegen des Königs zugeneigt sind; die Formulierung bleibt politisch, ohne absolute persönliche Loyalität vorauszusetzen.
- source_word: χαίρειν
  choice: grüßt
  rationale: Überträgt die übliche griechische Briefformel natürlich in die deutsche Satzkonstruktion mit Absender und Empfängern.
- source_word: ἑκατὸν εἴκοσι ἑπτὰ
  choice: '127'
  rationale: Direkte Wiedergabe der Zahl in einer für moderne deutsche Texte übersichtlichen Schreibweise.
