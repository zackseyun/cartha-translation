  text: And so you also[a], on your appointed festivals, keep a notable day with every kind of feasting,
translation:
  language: de
  text: Darum feiert auch ihr an euren benannten Festen[a] einen ausgezeichneten Tag mit allem festlichen Schmausen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an euren nach jemandem oder etwas benannten Festen“ oder „an euren festgesetzten Festen“. Das griechische Wort bezeichnet wörtlich Feste, die einen Namen oder eine Benennung tragen; worauf sich die Benennung bezieht, bleibt unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: Darum sollt auch ihr
  rationale: „Darum“ gibt das folgernde οὖν wieder, „auch ihr“ das καὶ ὑμεῖς. Das im Deutschen ergänzte Modalverb bringt den Aufforderungscharakter des Imperativs natürlich zum Ausdruck.
- source_word: ἐν ταῖς ἐπωνύμοις ὑμῶν ἑορταῖς
  choice: an euren Festen, die ihren Namen tragen
  rationale: Die Formulierung bewahrt den Grundsinn von ἐπώνυμος („einen Namen tragend“, „nach jemandem oder etwas benannt“), ohne die nicht ausdrücklich genannte Bezugsgröße festzulegen. „An“ ist bei einer zeitlichen Festangabe idiomatisches Deutsch.
- source_word: ἐπίσημον ἡμέραν
  choice: einen besonderen Tag
  rationale: ἐπίσημος bezeichnet etwas deutlich Gekennzeichnetes, Hervorgehobenes oder Bedeutendes. „Besonders“ ist natürlich und wahrt den Sinn eines ausgezeichneten Festtags.
- source_word: μετὰ πάσης εὐωχίας
  choice: mit einem reichhaltigen Festmahl
  rationale: εὐωχία bezeichnet festliches Schmausen beziehungsweise ein Festmahl. „Reichhaltig“ gibt πάσης idiomatisch wieder, ohne das Wort abstrakt zu „Freude“ zu verallgemeinern.
- source_word: ἄγετε
  choice: sollt … begehen
  rationale: ἄγετε ist hier ein Imperativ im Sinn von einen Tag festlich begehen oder halten. „Begehen“ ist im modernen Standarddeutsch würdig und idiomatisch.
