  text: But we find that the Jews, who have been handed over to destruction by that thrice-accursed man, are not criminals, but are governed by most righteous laws,
translation:
  language: de
  text: 'Wir aber stellen fest: Die Juden, die von diesem dreifach Verfluchten[a] der Vernichtung preisgegeben wurden, sind keine Verbrecher, sondern leben nach überaus gerechten Gesetzen[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von dem dreifach Verfluchten“. Das griechische Wort ist ein ungewöhnlich starkes Schmähwort für den verantwortlichen Mann.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „führen ihr bürgerliches Leben nach überaus gerechten Gesetzen“. Das griechische Verb bezeichnet die Lebensführung als Mitglied einer Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Wir aber
  rationale: δέ setzt die königliche Feststellung in Kontrast zur vorangehenden Anklage; „Wir aber“ bewahrt diesen Gegensatz und den amtlichen Ton.
- source_word: τοὺς ... Ἰουδαίους
  choice: die Juden
  rationale: Im griechischen Esther bezeichnet Ἰουδαῖοι das jüdische Volk als ethnisch-religiöse Gemeinschaft; „Juden“ ist im Deutschen die klare Standardwiedergabe.
- source_word: ὑπὸ τοῦ τρισαλιτηρίου
  choice: von diesem dreifach Verfluchten
  rationale: τρισαλιτήριος ist eine ungewöhnlich starke Schmähung. Die substantivierte Form bewahrt die Personreferenz, ohne ein im Griechischen nicht ausdrücklich stehendes Substantiv einzufügen.
- source_word: παραδεδομένους εἰς ἀφανισμόν
  choice: der Vernichtung preisgegeben wurden
  rationale: Die Formulierung gibt das passive Ausgeliefertsein an ein tödliches Schicksal natürlich wieder; ἀφανισμός bezeichnet Vernichtung oder Auslöschung.
- source_word: εὑρίσκομεν
  choice: stellen fest
  rationale: Im Kontext eines königlichen Erlasses bezeichnet das Verb das Ergebnis einer Prüfung; „stellen fest“ klingt im modernen Deutschen natürlich und amtlich.
- source_word: οὐ κακούργους ὄντας
  choice: sind keine Verbrecher
  rationale: κακοῦργος kann einen Übeltäter oder Verbrecher bezeichnen; der rechtliche Kontext legt „Verbrecher“ nahe.
- source_word: δικαιοτάτοις ... νόμοις
  choice: überaus gerechten Gesetzen
  rationale: Der griechische Superlativ wird idiomatisch intensiv wiedergegeben und bewahrt sowohl die rechtliche als auch die ethische Bedeutung von δίκαιος.
- source_word: πολιτευομένους
  choice: leben nach
  rationale: Das Medium bezeichnet hier die Lebens- beziehungsweise Bürgerführung nach bestimmten Gesetzen; „leben nach“ vermeidet die irreführend passive Vorstellung, die Juden würden lediglich von diesen Gesetzen regiert.
theological_decisions:
- issue: Wiedergabe von δικαιοτάτοις im rechtlich-ethischen Zusammenhang
  choice: überaus gerechten Gesetzen
  alternative: höchst rechtschaffenen Gesetzen
  rationale: „Gerecht“ erhält die rechtliche und moralische Spannweite des Ausdrucks; „überaus“ gibt den Superlativ in natürlichem Deutsch wieder, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Moderner, würdevoller Erlassstil. Der Doppelpunkt nach „stellen fest“ gliedert den langen Satz verständlich. Die Schlussinterpunktion bleibt ein Komma, da der Vers syntaktisch in den folgenden Abschnitt übergeht.
