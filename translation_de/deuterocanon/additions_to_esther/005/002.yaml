lexical_decisions:
- source_word: πολλοὶ
  choice: Viele
  rationale: Das substantivisch gebrauchte Adjektiv leitet eine allgemeine Beobachtung ein; „Viele“ ist knapp und natürlich.
- source_word: τῇ πλείστῃ ... χρηστότητι
  choice: durch die überaus große Güte
  rationale: Der Dativ bezeichnet hier das Mittel beziehungsweise den Grund der Ehrung. „Überaus große“ gibt den Superlativ πλείστῃ idiomatisch wieder, während „Güte“ die Bedeutung von χρηστότης bewahrt.
- source_word: τῶν εὐεργετούντων
  choice: ihrer Wohltäter
  rationale: Das substantivierte Partizip bezeichnet Menschen, die anderen Gutes tun; „Wohltäter“ ist im gegebenen Zusammenhang prägnant und treffend.
- source_word: πυκνότερον
  choice: immer häufiger
  rationale: Der Komparativ des Adverbs trägt primär die Bedeutung „häufiger“. Anders als eine rein korrelative Wiedergabe bewahrt „immer häufiger“ diesen lexikalischen Gehalt und klingt im Deutschen natürlich.
- source_word: τιμώμενοι
  choice: geehrt wurden
  rationale: Das passive Partizip von τιμάω wird direkt und idiomatisch mit „geehrt wurden“ wiedergegeben.
- source_word: μεῖζον ἐφρόνησαν
  choice: hielten sich ... für bedeutender
  rationale: Die wörtliche Wendung „dachten Größeres“ bezeichnet hier ein gesteigertes Selbstverständnis. Die gewählte Formulierung bewahrt die Aussage, ohne den moralischen Unterton stärker als der griechische Wortlaut ausdrücklich festzulegen.
