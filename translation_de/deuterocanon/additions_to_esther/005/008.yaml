translation:
  language: de
  text: und auf das zu achten, was danach kommt,[a] um allen Menschen das Königreich[b] ungestört in Frieden zu gewähren,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf das zu achten, was folgt“. Das griechische Wort kann bedeuten, seine Aufmerksamkeit auf etwas zu richten oder es zu bedenken; zusammen mit „was danach kommt“ sind hier die künftigen Folgen im Blick.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Königsherrschaft“. Das griechische Wort kann sowohl das Reich als Herrschaftsgebiet als auch das Königtum beziehungsweise die Herrschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχειν
  choice: darauf zu achten
  rationale: Die Wendung gibt die Aufmerksamkeit auf die künftigen Folgen wieder, ohne den Sinn auf bloßes Vorausschauen festzulegen.
- source_word: τὰ μετὰ ταῦτα
  choice: was danach kommt
  rationale: Die natürliche deutsche Formulierung bewahrt den zeitlichen Bezug auf das Nachfolgende.
- source_word: Βασιλείαν
  choice: das Königreich
  rationale: Der Ausdruck lässt wie das Griechische offen, ob stärker das Reich als politischer Bereich oder die Königsherrschaft gemeint ist.
- source_word: ἀτάραχον
  choice: unerschüttert
  rationale: Das Wort bezeichnet einen Zustand ohne Unruhe oder politische Erschütterung.
- source_word: τοῖς πᾶσιν ἀνθρώποις
  choice: allen Menschen
  rationale: Die Wiedergabe ist inklusiv und erhält den universalen Umfang des griechischen Ausdrucks.
- source_word: μετʼ εἰρήνης
  choice: in Frieden
  rationale: Diese idiomatische deutsche Wendung bewahrt den substantivischen Friedensbegriff.
- source_word: παρέξεσθαι
  choice: erhalten bleibt
  rationale: Im Zusammenhang bezeichnet das Futur Medium, dass das Königreich allen in einem ungestörten Friedenszustand zur Verfügung stehen bzw. bewahrt werden soll; die deutsche Fassung gibt diesen Ergebnissinn natürlich wieder.
