lexical_decisions:
- source_word: κακοηθείας
  choice: Bosheit
  rationale: Das Substantiv bezeichnet eine schlechte, böswillige Gesinnung. „Bosheit“ ist im Deutschen natürlich und wahrt die moralische Wertung, ohne die Bedeutung unnötig auf persönliche Gehässigkeit einzuengen.
- source_word: ψευδεῖ
  choice: trügerisch
  rationale: Das Adjektiv kennzeichnet die Schlussfolgerung als falsch beziehungsweise irreführend. „Trügerisch“ passt idiomatisch zu „Schlussfolgerung“ und lässt sowohl Irrtum als auch Täuschung anklingen.
- source_word: παραλογισμῷ
  choice: Schlussfolgerung
  rationale: Der Ausdruck bezeichnet ein verfehltes Folgern oder eine falsche Berechnung. „Schlussfolgerung“ gibt hier den gedanklichen Vorgang verständlich wieder; seine Fehlerhaftigkeit wird durch „trügerisch“ bezeichnet.
- source_word: παραλογισαμένων
  choice: falsch eingeschätzt hatten
  rationale: Das Partizip bezeichnet das Gelangen zu einem irrigen Urteil und ist auf das folgende Objekt bezogen. Die Formulierung ist natürliches Deutsch und bewahrt durch die Nähe zu „Schlussfolgerung“ den Zusammenhang der verwandten griechischen Wörter.
- source_word: ἐπικρατούντων
  choice: Machthaber
  rationale: Das substantivierte Partizip meint diejenigen, die herrschen oder die Macht ausüben. „Machthaber“ ist prägnant und legt kein bestimmtes Amtsprädikat fest.
- source_word: ἀκέραιον
  choice: aufrichtig
  rationale: Das Adjektiv bezeichnet etwas Unvermischtes, Unverdorbenes oder Lauteres. Bei „Wohlwollen“ vermittelt „aufrichtig“ diese integre Qualität in natürlichem Deutsch.
- source_word: εὐγνωμοσύνην
  choice: Wohlwollen
  rationale: Im Kontext bezeichnet das Wort die wohlwollende, gütige Haltung der Herrschenden und nicht primär Dankbarkeit. „Wohlwollen“ wahrt diese Beziehungsrichtung.
theological_decisions:
- issue: Syntaktische Funktion von τῶν ἐπικρατούντων in τὴν τῶν ἐπικρατούντων ἀκέραιον εὐγνωμοσύνην
  choice: Das aufrichtige Wohlwollen gehört den Machthabern; sie sind die Träger dieser Haltung.
  alternative: Die Wendung bezeichnet aufrichtige Dankbarkeit gegenüber den Machthabern.
  rationale: Am naheliegendsten ist der Genitiv als subjektiver Genitiv zu εὐγνωμοσύνην. Auch der Kontext unterstützt eine wohlwollende Haltung der Herrschenden gegenüber anderen; die alternative Zielrichtung ist grammatisch und kontextuell weniger wahrscheinlich, bleibt aber in der Fußnote als Übersetzungsmöglichkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als abhängiger Satzteil formuliert, entsprechend dem griechischen Partizipialgefüge und seinem Zusammenhang. Die Wortverwandtschaft von παραλογισμῷ und παραλογισαμένων lässt sich im Deutschen nicht vollständig nachbilden und wird deshalb in der Fußnote erläutert.
