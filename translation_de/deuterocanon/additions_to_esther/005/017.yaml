  text: Therefore you will do well not to make use of the letters sent out by Haman son of Hammedatha,[a]
translation:
  language: de
  text: Darum werdet ihr gut daran tun, von den Schreiben, die Haman, der Sohn Hammedathas, versandt hat, keinen Gebrauch zu machen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht nach den Schreiben zu handeln, die Haman, der Sohn Hammedathas, versandt hat“. Das griechische Verb kann „Gebrauch machen (von)“ oder „sich etwas zunutze machen“ bedeuten; im Zusammenhang kann es einschließen, diese Schreiben nicht umzusetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς οὖν ποιήσετε
  choice: Darum tut ihr gut daran
  rationale: Die idiomatische Wendung gibt καλῶς ποιήσετε natürlich und würdig wieder; „Darum“ bewahrt den folgernden Anschluss von οὖν. Das griechische Futur hat hier zugleich empfehlenden beziehungsweise auffordernden Klang.
- source_word: μὴ προσχρησάμενοι
  choice: nicht zu verwenden
  rationale: 'Die Form bezeichnet die Weise, in der die Adressaten gut handeln: indem sie von den Schreiben keinen Gebrauch machen. „Verwenden“ bleibt nahe am Bedeutungsspielraum von προσχράομαι, ohne bereits „befolgen“ festzulegen.'
- source_word: τοῖς ... γράμμασιν
  choice: die ... Schreiben
  rationale: Im königlich-administrativen Zusammenhang sind schriftliche Mitteilungen oder Erlasse gemeint. „Schreiben“ ist im Deutschen hierfür natürlicher als „Briefe“ und lässt den amtlichen Charakter erkennen.
- source_word: ὑπὸ Ἁμὰν Ἁμαδάθου
  choice: von Haman, dem Sohn Hammedatas
  rationale: Der Genitiv Ἁμαδάθου wird als Vatersangabe verständlich gemacht; die Apposition entspricht natürlichem deutschem Sprachgebrauch.
- source_word: ἀποσταλεῖσι
  choice: versandten
  rationale: Das passive Partizip beschreibt die bereits ausgesandten Schreiben. „Versandt“ passt zur Verbreitung amtlicher Rundschreiben.
