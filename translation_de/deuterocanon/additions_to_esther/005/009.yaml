  text: making use of changes, and always judging the things that come before our eyes with a more gracious response.
translation:
  language: de
  text: indem sie die Veränderungen nutzen und das, was ihnen vor Augen kommt, stets beurteilen und wohlwollender darauf reagieren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρώμενοι ταῖς μεταβολαῖς
  choice: indem sie sich die Veränderungen zunutze machen
  rationale: Gibt die instrumentale Partizipialfügung und den Plural μεταβολαῖς wieder, ohne die nicht näher bestimmten Veränderungen auszudeuten.
- source_word: τὰ δὲ ὑπὸ τὴν ὄψιν ἐρχόμενα
  choice: das, was ihnen vor Augen kommt
  rationale: Bewahrt das anschauliche griechische Idiom in natürlichem Deutsch; das ergänzte „ihnen“ macht den Bezug zum handelnden Subjekt deutlich.
- source_word: διακρίνοντες
  choice: beurteilen
  rationale: Entspricht hier dem prüfenden beziehungsweise urteilenden Sinn, ohne ihn auf bloßes Wahrnehmen oder Unterscheiden zu verengen.
- source_word: ἀεὶ μετʼ ἐπιεικεστέρας ἀπαντήσεως
  choice: stets mit größerer Nachsicht
  rationale: ἐπιεικής bezeichnet Milde, Billigkeit oder Nachsicht; die Komparativform wird mit „größerer“ bewahrt. ἀπάντησις beschreibt hier die Weise des Entgegentretens beziehungsweise Reagierens und wird idiomatisch in die adverbiale Wendung aufgenommen.
