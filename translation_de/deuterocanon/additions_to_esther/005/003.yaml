  text: And they seek not only to mistreat those subject to us[a], but, unable to bear prosperity, they even attempt to scheme against their own benefactors;
translation:
  language: de
  text: Und sie trachten nicht nur danach, denen Böses anzutun, die uns unterstellt sind, sondern versuchen sogar, weil sie den Wohlstand[a] nicht ertragen können, gegen ihre eigenen Wohltäter Ränke zu schmieden.
