lexical_decisions:
- source_word: ὑποτεταγμένους
  choice: die uns unterstellt sind
  rationale: Das Partizip bezeichnet Menschen, die unter eine Autorität gestellt sind. Die Formulierung wahrt diesen relationalen Sinn, ohne einen bestimmten politischen Status vorauszusetzen.
- source_word: ζητοῦσι κακοποιεῖν
  choice: trachten danach, Böses anzutun
  rationale: Die Wendung bezeichnet das bewusste Bestreben, anderen Böses zuzufügen. Die Übersetzung bleibt nahe an κακοποιεῖν und klingt zugleich natürlich.
- source_word: κόρον
  choice: Wohlstand
  rationale: κόρος kann Sättigung, Übersättigung oder einen Überfluss bezeichnen, der zu Überheblichkeit führt. Im Zusammenhang gibt »Wohlstand« den moralischen Sinn verständlich wieder; die konkreteren Bedeutungsnuancen bleiben in der Fußnote erhalten.
- source_word: οὐ δυνάμενοι φέρειν
  choice: nicht ertragen können
  rationale: Die Formulierung gibt die Unfähigkeit wieder, einen Zustand auszuhalten beziehungsweise angemessen mit ihm umzugehen.
- source_word: τοῖς ἑαυτῶν εὐεργέταις
  choice: ihre eigenen Wohltäter
  rationale: εὐεργέτης bezeichnet jemanden, der einem anderen Gutes erweist. »Wohltäter« bewahrt sowohl den sozialen als auch den moralischen Gehalt des Ausdrucks.
- source_word: ἐπιχειροῦσι μηχανᾶσθαι
  choice: versuchen, gegen … Ränke zu schmieden
  rationale: μηχανάομαι bezeichnet das listige Ausdenken eines feindseligen Plans; der Dativ nennt hier die Betroffenen. »Ränke schmieden« gibt diesen Sinn idiomatisch und würdevoll wieder.
