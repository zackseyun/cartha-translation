lexical_decisions:
- source_word: ὄντας δὲ υἱοὺς
  choice: als Söhne
  rationale: „Söhne“ bewahrt die ausdrücklich männliche Abstammungs- und Zugehörigkeitssprache. Die Wendung mit „als“ gibt die partizipiale Konstruktion wieder, ohne sie ausdrücklich kausal zu deuten; δέ wird in diesem abhängigen Satzstück nicht eigens wiedergegeben, da ein deutsches „aber“ hier ohne den vorausgehenden Zusammenhang unnatürlich wäre.
- source_word: τοῦ ὑψίστου μεγίστου ζῶντος θεοῦ
  choice: des höchsten, größten, lebendigen Gottes
  rationale: Die Reihung der göttlichen Prädikate bleibt in ihrer gesteigerten, feierlichen Form erhalten. Die Kleinschreibung der Adjektive entspricht ihrer attributiven Funktion im Deutschen.
- source_word: κατευθύνοντος
  choice: der … lenkt
  rationale: „Lenken“ umfasst sowohl Führung als auch geordnete Leitung, ohne die Aussage stärker als nötig als unmittelbares Eingreifen oder Vorherbestimmung auszulegen.
- source_word: τὴν βασιλείαν
  choice: das Königtum
  rationale: βασιλεία kann Reich, Königsherrschaft oder Königtum bezeichnen. Im königlichen Zusammenhang hält „Königtum“ die Schwebe zwischen Herrschaftsamt und Herrschaftsordnung besser offen als das stärker räumliche „Königreich“.
- source_word: ἡμῖν τε καὶ τοῖς προγόνοις ἡμῶν
  choice: für uns und unsere Vorfahren
  rationale: Die beiden Dativgruppen werden als Nutznießer beziehungsweise Betroffene der göttlichen Leitung verstanden. „Vorfahren“ ist gegenwärtiges, würdevolles Standarddeutsch.
- source_word: ἐν τῇ καλλίστῃ διαθέσει
  choice: in der besten Ordnung
  rationale: Die Formulierung bewahrt den Superlativ und gibt διάθεσις als geordnete Einrichtung oder Anordnung wieder, ohne den Ausdruck psychologisch als „Gesinnung“ zu missverstehen.
theological_decisions:
- issue: Korporative Gottessohnschaft
  choice: Söhne des höchsten, größten, lebendigen Gottes
  alternative: Kinder des höchsten, größten, lebendigen Gottes
  rationale: Das griechische υἱούς bezeichnet ausdrücklich „Söhne“. Diese familiale und bundesbezogene Aussage wird nicht zu einer allgemeineren Zugehörigkeitsbezeichnung abgeschwächt; die inklusive Verständnismöglichkeit wird in der Fußnote genannt.
- issue: Art und zeitlicher Bezug der göttlichen Leitung
  choice: der … das Königtum … lenkt
  alternative: der … das Königtum … gelenkt hat
  rationale: Das griechische Präsenspartizip bezeichnet Gottes Leitung als fortdauernd oder grundsätzlich. Eine ausschließlich vergangene Handlung wird daher nicht festgelegt.
- issue: Bedeutungsumfang von βασιλεία
  choice: Königtum
  alternative: Königreich
  rationale: Die Übersetzung lässt offen, ob vor allem die königliche Herrschaft, das Herrschaftsamt oder der beherrschte Bereich gemeint ist, und vermeidet eine rein territoriale Festlegung.
translation_notes:
  register: Feierliches, aber heutiges Standarddeutsch. Die gehäuften Gottesprädikate werden bewusst nicht geglättet. Der Text bleibt als abhängiges Satzglied formuliert, weil auch die griechische Vorlage mit einem Partizip einsetzt.
