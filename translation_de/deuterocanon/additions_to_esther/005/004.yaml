  text: And[a], while taking away gratitude not only from men, but also being puffed up by the boasts of those who are exceedingly good[b], they suppose they will escape the judgment of the God who always sees all things and hates evil.
translation:
  language: de
  text: Und indem sie den Menschen nicht nur Dankbarkeit entziehen, sondern auch durch die Prahlereien der überaus Guten[a] aufgebläht werden, meinen sie, dem Gericht[b] Gottes entgehen zu können, der stets alles sieht und das Böse hasst.
