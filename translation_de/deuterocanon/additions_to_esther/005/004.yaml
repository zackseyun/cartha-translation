lexical_decisions:
- source_word: εὐχαριστίαν
  choice: Dankbarkeit
  rationale: Das Substantiv bezeichnet Dankbarkeit oder Dankgefühl. »Dankbarkeit« passt als abstraktes Objekt zu dem Bild, dass sie den Menschen genommen wird.
- source_word: ἀνταναιροῦντες
  choice: nehmen … den Menschen
  rationale: Die Wendung gibt den Gedanken des Entziehens in natürlichem Deutsch wieder, ohne den möglichen Sinn unnötig zu »vernichten« zu verschärfen.
- source_word: κόμποις
  choice: Prahlereien
  rationale: κόμπος bezeichnet prahlerisches, großsprecherisches Reden. »Prahlereien« bewahrt sowohl den wiederholten Ausdruck als auch dessen negative Wertung.
- source_word: ἐπαρθέντες
  choice: lassen sich … überheblich machen
  rationale: Das passive Partizip beschreibt ein Hochgehobenwerden im Sinn von Stolz oder Überheblichkeit. Die Formulierung hält den kausalen Zusammenhang mit den Prahlereien fest.
- source_word: ἀπεράγἀθων
  choice: der überaus Guten
  rationale: Die überlieferte Form ist textlich und lexikalisch schwierig. Die Wiedergabe folgt der wahrscheinlichen intensivierend-positiven Bedeutung, ohne die Unsicherheit im Haupttext auszublenden; diese wird in der Fußnote kenntlich gemacht.
- source_word: κατοπτεύοντος
  choice: der stets alles sieht
  rationale: Das Partizip bezeichnet genaues Beobachten oder Überschauen; zusammen mit τὰ πάντα und ἀεί ergibt sich die umfassende und fortdauernde Aussage.
- source_word: μισοπόνηρον
  choice: das Böse hasst
  rationale: Das zusammengesetzte Adjektiv bezeichnet die entschiedene Gegnerschaft gegen das Böse. Die verbale Wiedergabe ist im Deutschen natürlich und bewahrt die moralische Aussage.
- source_word: δίκην
  choice: Strafgericht
  rationale: δίκη kann Recht, Gericht, Strafe oder Vergeltung bezeichnen. Im Zusammenhang mit dem Entgehen verbindet »Strafgericht« die gerichtliche und die strafende Nuance.
theological_decisions:
- issue: Gottes umfassendes Sehen und seine Gegnerschaft gegen das Böse
  choice: Gottes …, der stets alles sieht und das Böse hasst
  alternative: des stets alles überblickenden, das Böse hassenden Gottes
  rationale: Die gewählte Relativsatzkonstruktion gibt beide eng verbundenen griechischen Gottesprädikate verständlich wieder, ohne sie mit späterer dogmatischer Terminologie auszubauen.
- issue: Bedeutungsumfang von δίκη
  choice: Strafgericht
  alternative: Gericht; Strafe; Gerechtigkeit
  rationale: Der Kontext legt ein drohendes göttliches Rechtshandeln mit strafender Folge nahe. Die Fußnote bewahrt den weiteren Bedeutungsumfang des griechischen Wortes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die schwierige Personenbezeichnung bleibt bewusst nah an der wahrscheinlichen Grundbedeutung und wird nicht stillschweigend vereindeutigt.
