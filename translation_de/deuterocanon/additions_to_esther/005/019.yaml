  text: And after posting a copy of this letter in every place openly[a], to permit the Jews to make use of their own laws,
translation:
  language: de
  text: Nachdem sie eine Abschrift dieses Schreibens überall öffentlich ausgehängt haben, sollen sie den Juden erlauben, nach ihren eigenen Gesetzen[a] zu leben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren eigenen Bräuchen“; das griechische Wort kann sowohl geltende Gesetze als auch hergebrachte Bräuche bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφον
  choice: eine Abschrift
  rationale: Das Wort bezeichnet eine Kopie oder Zweitschrift eines Dokuments; „Abschrift“ passt zum amtlichen Zusammenhang.
- source_word: ἐπιστολῆς
  choice: dieses Schreibens
  rationale: ἐπιστολή bedeutet grundsätzlich „Brief“; im amtlichen Kontext gibt „Schreiben“ die Bedeutung natürlich wieder, ohne ausdrücklich „Erlass“ einzutragen.
- source_word: ἐκθέντες
  choice: Nachdem sie … ausgehängt haben
  rationale: Das Partizip bezeichnet hier das öffentliche Auslegen oder Bekanntmachen des Dokuments. „Aushängen“ ist im Deutschen für eine öffentlich zugängliche amtliche Bekanntgabe idiomatisch.
- source_word: ἐν παντὶ τόπῳ
  choice: überall
  rationale: Die knappe deutsche Wiedergabe bewahrt den distributiven Sinn „an jedem Ort“.
- source_word: μετὰ παρρησίας
  choice: öffentlich
  rationale: Im Kontext der Bekanntmachung bezeichnet die Wendung offene, uneingeschränkte Öffentlichkeit; „öffentlich“ vermeidet die hier unpassende psychologische Nuance von „Freimütigkeit“.
- source_word: ἐᾶν
  choice: sollen sie … erlauben
  rationale: Der Infinitiv bedeutet „zulassen/erlauben“. Die Konstruktion wird als fortlaufende Anweisung des amtlichen Schreibens wiedergegeben.
- source_word: χρῆσθαι
  choice: zu leben
  rationale: χράομαι bedeutet wörtlich „Gebrauch machen von“. Bei Gesetzen und Bräuchen ist „danach leben“ in modernem Deutsch natürlicher und vermittelt ihre praktische Befolgung.
- source_word: τοῖς ἑαυτῶν νομίμοις
  choice: nach ihren eigenen Gesetzen
  rationale: νόμιμα kann Gesetze, Satzungen oder überlieferte Bräuche bezeichnen. „Nach ihren eigenen Gesetzen leben“ ist idiomatisch; die weitere Bedeutung wird in der Fußnote bewahrt.
