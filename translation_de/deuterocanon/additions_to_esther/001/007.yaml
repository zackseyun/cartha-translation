  text: And behold[a], a day of darkness and gloom, of affliction and distress, of misery and great turmoil upon the earth.
translation:
  language: de
  text: 'Und siehe: ein Tag der Finsternis und des Dunkels, Bedrängnis und Beklemmung, Not und große Unruhe auf der Erde[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Land«. Das griechische Wort γῆ kann sowohl die Erde insgesamt als auch ein bestimmtes Land bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: und siehe
  rationale: Bewahrt den unvermittelten, visionären Ausruf in einer würdigen, im Deutschen verständlichen Form.
- source_word: ἡμέρα σκότους καὶ γνόφου
  choice: ein Tag der Finsternis und des Dunkels
  rationale: Die Genitivverbindung und die poetische Doppelung zweier verwandter Begriffe für Dunkelheit bleiben erhalten.
- source_word: θλίψις καὶ στενοχωρία
  choice: Bedrängnis und Beklemmung
  rationale: „Bedrängnis“ gibt den belastenden Druck wieder; „Beklemmung“ wahrt bei στενοχωρία das Bild der Enge und unterscheidet die beiden Glieder.
- source_word: κάκωσις
  choice: Not
  rationale: Der Ausdruck bezeichnet hier innerhalb einer Reihe von Unheilsbegriffen leidvolle Not, ohne zwingend einen menschlichen Täter vorauszusetzen.
- source_word: τάραχος μέγας
  choice: große Unruhe
  rationale: Gibt das Ausmaß sowie die emotionale oder gesellschaftliche Erschütterung wieder, ohne die Bedeutung unnötig auf „Verwirrung“ oder „Aufruhr“ zu verengen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Passt zum weiten, visionären Ton; da γῆ ebenso ein bestimmtes Land bezeichnen kann, wird diese Möglichkeit in einer Fußnote bewahrt.
theological_decisions:
- issue: Reichweite von γῆ in der Unheilsankündigung
  choice: auf der Erde
  alternative: im Land / auf dem Land
  rationale: Die umfassende, visionäre Aufzählung legt die weitere Bedeutung nahe, entscheidet die im Griechischen vorhandene Mehrdeutigkeit aber nicht endgültig; deshalb wird die engere Möglichkeit dokumentiert.
translation_notes:
  register: Gehobene, visionäre Sprache mit knapper, nominaler Reihung. Der Satzcharakter des griechischen Ausrufs und seine poetische Spannung werden bewahrt; die Wortwahl bleibt zugleich für heutige Leser verständlich.
