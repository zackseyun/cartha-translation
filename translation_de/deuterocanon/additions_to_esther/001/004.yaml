  text: 'And this was his dream: behold[a], voices and tumult, thunder and earthquake, upheaval upon the earth.'
translation:
  language: de
  text: 'Und dies war sein Traum: Siehe, Stimmen[a] und Getöse, Donner und Erdbeben, Unruhe auf der Erde.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Laute.'
    reason: φωναί kann Stimmen, Rufe oder allgemein Laute beziehungsweise Geräusche bezeichnen.
  - marker: b
    text: 'Oder: im Land.'
    reason: γῆ kann sowohl die Erde als auch ein Land oder Gebiet bezeichnen.
lexical_decisions:
- source_word: ἐνύπνιον
  choice: Traum
  rationale: Die schlichte und übliche Bedeutung ist »Traum«; »Traumgesicht« würde den griechischen Ausdruck unnötig ausdeuten.
- source_word: ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den lebhaften, hinweisenden Charakter der griechischen Interjektion und entspricht einem würdigen deutschen Erzählregister.
- source_word: φωναὶ
  choice: Stimmen
  rationale: Die direkte Wiedergabe lässt offen, ob unterscheidbare Stimmen, Rufe oder allgemeiner Laute gemeint sind.
- source_word: θόρυβος
  choice: Getöse
  rationale: Bezeichnet eine laute Unruhe oder einen Tumult; »Getöse« ist im Deutschen anschaulich und fügt sich natürlich in die Reihe bedrohlicher Erscheinungen ein.
- source_word: βρονταὶ
  choice: Donner
  rationale: Obwohl das Griechische den Plural hat, bezeichnet der deutsche Sammelbegriff die wiederholte oder umfassende Erscheinung idiomatisch.
- source_word: σεισμός
  choice: Erdbeben
  rationale: Dies ist die geläufige konkrete Bedeutung des griechischen Wortes und passt zum Zusammenhang.
- source_word: τάραχος
  choice: Aufruhr
  rationale: Gibt heftige Unruhe und Unordnung wieder, ohne sie ausschließlich als Naturereignis oder als politischen Vorgang festzulegen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Der umfassende Sinn von γῆ passt zu Donner und Erdbeben; die ebenfalls mögliche örtliche Bedeutung »Land« wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Reichweite von γῆ im gesteigerten Traumbild
  choice: Erde
  alternative: Land
  rationale: Die Verbindung mit Donner, Erdbeben und Aufruhr legt eine umfassende irdische Erschütterung nahe. Die Übersetzung importiert dabei keine spätere apokalyptische Deutung; die örtliche Lesart bleibt ausdrücklich als Alternative erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem »Siehe«. Die knappe Reihung des Griechischen bleibt erhalten; echte lexikalische Mehrdeutigkeiten werden nicht stillschweigend aufgelöst.
