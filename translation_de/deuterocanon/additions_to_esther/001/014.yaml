  text: Und der König verhörte die beiden Eunuchen; nachdem sie ein Geständnis abgelegt hatten, wurden sie abgeführt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήτασεν
  choice: verhörte
  rationale: Das Verb bezeichnet hier eine eingehende, förmliche Befragung. „Verhörte“ gibt den gerichtlichen Kontext knapp und natürlich wieder, ohne eine bestimmte Verhörmethode hinzuzufügen.
- source_word: εὐνούχους
  choice: Eunuchen
  rationale: Der griechische Ausdruck bezeichnet ausdrücklich Eunuchen. Eine bloße Wiedergabe als „Hofbeamte“ würde diese konkrete Bezeichnung verallgemeinern.
- source_word: ὁμολογήσαντες
  choice: nachdem sie gestanden hatten
  rationale: Das Partizip bezeichnet ihr Eingeständnis als zeitlich vorausgehenden Umstand. „Gestanden“ passt zum Kontext einer Untersuchung, ohne den nicht ausdrücklich genannten Gegenstand des Geständnisses zu ergänzen.
- source_word: ἀπήχθησαν
  choice: wurden sie abgeführt
  rationale: Das Passiv bezeichnet, dass sie unter fremder Autorität weggebracht wurden. „Abgeführt“ ist im Deutschen für eine Entfernung in amtlichem Gewahrsam idiomatisch und fügt kein ausdrücklich genanntes Ziel hinzu.
