  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Aussagen des Griechischen zutreffend wieder: Der König untersucht/befragt die beiden Eunuchen, sie legen ein Geständnis ab, und sie werden abgeführt. „Eunuchen“ wahrt die spezifische Bezeichnung εὐνούχους. „Verhörte“ ist im Kontext vertretbar, wenngleich ἐξήτασεν allgemein eine eingehende Untersuchung oder Befragung bezeichnet.'
