  terminology: „König“, „Eunuchen“ und „abgeführt“ sind registergerecht und quellentreu. Die Formulierung „ein Geständnis abgelegt“ konkretisiert nicht den nicht genannten Inhalt des Geständnisses, sondern macht die im griechischen Verb enthaltene Aussagehandlung eindeutig.
