base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/011.yaml
  text: And when Mordecai awoke[a], after seeing this dream and what God had purposed to do, he kept it in his heart[b], and in every matter he wanted to understand it until nightfall.
translation:
  language: de
  text: Als Mordechai erwachte, nachdem er diesen Traum und das gesehen hatte, was Gott zu tun beschlossen hatte, bewahrte er ihn in seinem Herzen[a] und wollte ihn in jeder Hinsicht[b] bis zum Einbruch der Nacht verstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text enthält an dieser Stelle offenbar ein geringfügiges Überlieferungs-, Druck- oder Transkriptionsartefakt („ἐν Β τῇ καρδίᾳ“). Der erkennbare Sinn lautet: „in seinem Herzen“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „bei jedem Wort“ beziehungsweise „in jeder Angelegenheit“. Die griechische Wendung ist weit gefasst und kann alles meinen, was mit dem Traum zusammenhing.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθείς
  choice: als Mordechai erwachte
  rationale: Das Partizip Aorist Passiv bezeichnet hier im Erzählablauf das Erwachen. Die aktive deutsche Form ist natürlich und legt keine äußere Person als Ursache des Erwachens fest.
- source_word: ἑωρακώς
  choice: nachdem er ... gesehen hatte
  rationale: Das Perfektpartizip bezeichnet eine bereits abgeschlossene Wahrnehmung; der deutsche Plusquamperfektsatz gibt dieses zeitliche Verhältnis klar wieder.
- source_word: τὸ ἐνύπνιον τοῦτο
  choice: diesen Traum
  rationale: ἐνύπνιον bezeichnet hier einen Traum; „Vision“ würde die Art der Erfahrung unnötig umdeuten.
- source_word: τί ὁ θεὸς βεβούλευται ποιῆσαι
  choice: das, was Gott zu tun beschlossen hatte
  rationale: Das Perfekt Medium von βουλεύω drückt einen gefassten Entschluss oder eine feststehende Absicht aus. „beschlossen hatte“ wahrt diesen Sinn ohne zusätzliche theologische Deutung.
- source_word: εἶχεν αὐτὸ ... τῇ καρδίᾳ
  choice: bewahrte er ihn in seinem Herzen
  rationale: Die Formulierung erhält das biblische Bild des Herzens als Ort inneren Bewahrens und Nachdenkens. Das Pronomen bezieht sich im Deutschen auf „Traum“.
- source_word: ἐν Β τῇ καρδίᾳ
  choice: in seinem Herzen
  rationale: Das gedruckte „Β“ ist offenbar ein geringfügiges Überlieferungs-, Druck- oder Transkriptionsartefakt. Übersetzt wird der klar erkennbare Sinn der Wendung.
- source_word: ἐν παντὶ λόγῳ
  choice: in jeder Hinsicht
  rationale: λόγος kann „Wort“, „Sache“, „Angelegenheit“ oder „Hinsicht“ bedeuten. Im Zusammenhang mit dem Bemühen um Verständnis ist die umfassende Wiedergabe „in jeder Hinsicht“ natürlich; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: ἤθελεν ἐπιγνῶναι αὐτό
  choice: wollte ihn ... verstehen
  rationale: ἐπιγινώσκω bezeichnet hier das genauere Erfassen oder Verstehen des Traums. „verstehen“ passt zum nachdenklichen Zusammenhang.
- source_word: ἕως τῆς νυκτός
  choice: bis zum Einbruch der Nacht
  rationale: Die Wendung nennt den Beginn der Nacht als zeitlichen Endpunkt und wird in aktuellem Deutsch idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe von ὁ θεός
  choice: Gott
  alternative: der Gott
  rationale: „Gott“ ist hier die sachgemäße deutsche Wiedergabe des griechischen Gottestitels; der Zusammenhang verlangt keine nähere Bestimmung.
- issue: Anthropologische Herzensmetapher
  choice: bewahrte er ihn in seinem Herzen
  alternative: behielt er ihn im Gedächtnis
  rationale: Die Übersetzung erhält die Metapher von καρδία und damit sowohl die gedankliche als auch die innere, persönliche Dimension, ohne sie auf einen rein kognitiven Vorgang zu reduzieren.
- issue: Gottes gefasster Entschluss
  choice: was Gott zu tun beschlossen hatte
  alternative: was Gott zu tun beabsichtigte
  rationale: Das Perfekt βεβούλευται legt eine gefasste Absicht nahe. „beschlossen hatte“ gibt dies wieder, ohne Aussagen über Vorherbestimmung oder die genaue Art göttlichen Handelns hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satzbau bleibt in gut lesbarer Form erhalten. Die Herzensmetapher wird bewahrt; unklare beziehungsweise textkritisch auffällige Stellen werden durch genau platzierte Fußnoten kenntlich gemacht.
