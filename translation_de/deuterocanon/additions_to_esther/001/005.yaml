lexical_decisions:
- source_word: ἰδοὺ
  choice: siehe
  rationale: Bewahrt die eindringliche, visionäre Hinweisfunktion der Partikel; „schau“ wäre umgangssprachlicher.
- source_word: δύο δράκοντες μεγάλοι
  choice: zwei große Drachen
  rationale: „Drachen“ erhält die bildhafte, unheilvolle Vision, ohne das Symbol bereits zu deuten; „groß“ kann sowohl Ausmaß als auch Bedeutsamkeit anklingen lassen.
- source_word: ἕτοιμοι προῆλθον
  choice: traten hervor, … bereit
  rationale: „Traten hervor“ gibt die Bewegung in die sichtbare Auseinandersetzung natürlich wieder; „bereit“ bezeichnet ihren Zustand der Kampfbereitschaft.
- source_word: ἀμφότεροι
  choice: beide
  rationale: Direkte und idiomatische Wiedergabe, die ausdrücklich beide Drachen einschließt.
- source_word: παλαίειν
  choice: zu kämpfen
  rationale: Der weitere Ausdruck passt im Deutschen natürlich zur feindlichen Begegnung der Drachen; die mögliche engere Bedeutung „ringen“ wird in einer Fußnote bewahrt.
- source_word: φωνὴ μεγάλη
  choice: ein gewaltiger Laut
  rationale: φωνή kann Stimme, Ruf oder Laut bedeuten. „Laut“ vermeidet die unbelegte Annahme verständlicher Rede, während „gewaltig“ die Stärke und visionäre Wirkung von μεγάλη erhält.
- source_word: ἐγένετο αὐτῶν
  choice: von ihnen ging … aus
  rationale: Gibt die Genitivverbindung idiomatisch als Herkunft des Lautes wieder.
theological_decisions:
- issue: Bedeutung der Drachen in Mordechais Vision
  choice: Das Bild wird ohne allegorische Identifizierung als „Drachen“ wiedergegeben.
  alternative: Die Drachen bereits in diesem Vers mit bestimmten Personen, Mächten oder Reichen gleichzusetzen.
  rationale: Der Vers zeigt symbolische Traumgestalten, erklärt ihre Bedeutung an dieser Stelle jedoch nicht. Die Übersetzung wahrt daher die Bildsprache und ihre Spannung.
