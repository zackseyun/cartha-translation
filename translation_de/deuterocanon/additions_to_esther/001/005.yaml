  register: Modernes, würdiges Standarddeutsch mit leicht erhöhter Sprache für den visionären Zusammenhang. „Und siehe“ bewahrt den markanten Erzählton; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich.
