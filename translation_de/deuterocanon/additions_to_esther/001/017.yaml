base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/017.yaml
  text: And Haman son of Hammedatha[a], the Bougaean, was honored before the king, and he was seeking to harm Mordecai and his people because of the king’s two eunuchs.
translation:
  language: de
  text: Und Haman, der Sohn Hammedatas, der Bougäer,[a] stand beim König in hohem Ansehen. Er trachtete danach, Mordechai und seinem Volk Böses anzutun wegen der beiden Eunuchen des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch »Bougäer«. Eine bekanntere Texttradition bezeichnet Haman als »Agagiter«; der hier zugrunde gelegte griechische Text liest jedoch »Bougäer«.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: Haman, der Sohn Hammedatas
  rationale: Der Genitiv bezeichnet hier natürlich die Abstammung. Die Namensform wird in einer im Deutschen üblichen biblischen Transliterierung wiedergegeben.
- source_word: Βουγαῖος
  choice: der Bugäer
  rationale: Die undurchsichtige Herkunfts- oder Sippenbezeichnung wird transliteriert und nicht mit einer anderen Texttradition harmonisiert. Die Form »Bugäer« bildet das griechische Βουγαῖος für deutsche Leser natürlich ab.
- source_word: ἔνδοξος ἐνώπιον τοῦ βασιλέως
  choice: stand beim König in hohem Ansehen
  rationale: Die Wendung bezeichnet Hamans herausgehobene Stellung am Königshof. Diese idiomatische Formulierung bewahrt sowohl den Statusbegriff als auch den Bezug zum König.
- source_word: ἐζήτει κακοποιῆσαι
  choice: trachtete danach, … Böses anzutun
  rationale: »Trachtete danach« gibt den durativen Charakter des Imperfekts und die feindselige Absicht wieder; »Böses anzutun« wahrt die Breite und den moralischen Klang von κακοποιέω.
- source_word: τὸν Μαρδοχαῖον καὶ τὸν λαὸν αὐτοῦ
  choice: Mordechai und seinem Volk
  rationale: λαός bezeichnet hier das mit Mordechai verbundene Volk; »Volk« ist die natürliche und sachlich offene deutsche Entsprechung.
- source_word: ὑπὲρ τῶν δύο εὐνούχων τοῦ βασιλέως
  choice: wegen der beiden Eunuchen des Königs
  rationale: ὑπέρ wird im Zusammenhang kausal verstanden, ohne die Art des Zusammenhangs weiter auszudeuten. »Eunuchen« entspricht der gewöhnlichen höfischen Bedeutung von εὐνοῦχοι.
theological_decisions:
- issue: Wiedergabe der dunklen Bezeichnung Βουγαῖος
  choice: Bugäer
  alternative: Agagiter
  rationale: Der vorliegende griechische Text liest Βουγαῖος. Daher wird diese Form transliteriert, statt die aus einer anderen Texttradition bekannte Bezeichnung »Agagiter« in den Haupttext einzutragen.
- issue: Bezug von ὑπέρ auf die beiden Eunuchen
  choice: wegen der beiden Eunuchen
  alternative: für die beiden Eunuchen / in der Angelegenheit der beiden Eunuchen
  rationale: Der Kontext legt einen ursächlichen Anlass für Hamans Feindschaft nahe. Die knappe Formulierung bewahrt jedoch die im Vers nicht näher erklärte Verbindung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Stand beim König in hohem Ansehen« ist idiomatischer als eine wörtliche Wiedergabe mit »ruhmreich vor dem König«. Die Wiederholung von »und« wurde durch zwei Sätze gegliedert, ohne den Gedankengang zu verändern.
