lexical_decisions:
- source_word: ἡσύχασεν
  choice: blieb
  rationale: Das Aoristverb kann Ruhe, Stille oder ein ruhiges Verbleiben bezeichnen. Im räumlichen Zusammenhang mit ἐν τῇ αὐλῇ gibt „blieb“ den Fortbestand von Mordechais Anwesenheit natürlich wieder, ohne die mögliche Bedeutung „verhielt sich ruhig“ auszuschließen; diese bleibt in der Fußnote sichtbar.
- source_word: αὐλή
  choice: Palasthof
  rationale: Im Umfeld des Königs und seiner Wachen bezeichnet αὐλή hier am ehesten den umschlossenen Hof der königlichen Residenz. „Palasthof“ macht den königlichen Schauplatz deutlich und wird bei beiden Vorkommen einheitlich verwendet.
- source_word: μετά
  choice: bei
  rationale: μετά bezeichnet hier die Verbindung beziehungsweise räumliche Nähe Mordechais zu den beiden Eunuchen. „Bei“ klingt im Deutschen in dieser Ortsangabe natürlicher als „mit“, ohne eine engere Beziehung zu behaupten.
- source_word: εὐνούχων
  choice: Eunuchen
  rationale: Der griechische Text nennt die Männer ausdrücklich Eunuchen; die konkrete Bezeichnung wird nicht durch das allgemeinere „Hofbeamte“ ersetzt.
- source_word: φυλασσόντων
  choice: bewachten
  rationale: Das Partizip bezeichnet ihre fortdauernde Wach- oder Schutzaufgabe. Der deutsche Relativsatz gibt diese Funktion idiomatisch wieder.
- source_word: Μαρδοχαῖος
  choice: Mordechai
  rationale: „Mordechai“ ist die im modernen Deutschen geläufige biblische Namensform.
- source_word: Γαβὰθα
  choice: Gabatha
  rationale: Direkte Wiedergabe der griechischen Namensform.
- source_word: Θαῤῥὰ
  choice: Tharra
  rationale: Direkte Wiedergabe der griechischen Namensform.
