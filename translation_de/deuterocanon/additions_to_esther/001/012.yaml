translation:
  language: de
  text: Und Mordechai blieb[a] im Palasthof mit Gabatha und Tharra, den beiden Eunuchen des Königs, die den Palasthof[b] bewachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verhielt sich ruhig“ beziehungsweise „ruhte“. Das griechische Verb kann sowohl ruhiges oder stilles Verhalten als auch ein ruhiges Verbleiben ausdrücken.'
