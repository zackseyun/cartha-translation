  yaml_path: translation/deuterocanon/additions_to_esther/001/010.yaml
  text: Light and the sun rose[b][a], and the lowly were exalted and devoured the glorious.
translation:
  language: de
  text: Licht und Sonne gingen auf, und die Niedrigen[a] wurden erhöht und verschlangen die Angesehenen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Demütigen«. Das griechische Wort kann sowohl eine demütige Haltung als auch einen niedrigen gesellschaftlichen Rang bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Geehrten« oder »die Berühmten«. Gemeint sind Menschen, die Ehre, Ansehen oder Ruhm besitzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: Licht
  rationale: Das artikellose Substantiv bleibt als knappes, bildhaftes »Licht« erhalten; »Tageslicht« würde die mögliche symbolische Bedeutung unnötig einengen.
- source_word: ὁ ἥλιος
  choice: Sonne
  rationale: Direkte Wiedergabe des griechischen Substantivs. Im Deutschen wird es mit »Licht« zu einem natürlichen zusammengesetzten Subjekt verbunden.
- source_word: ἀνέτειλεν
  choice: gingen auf
  rationale: Das Verb bezeichnet hier das Aufgehen der Sonne. Wegen des zusammengesetzten deutschen Subjekts »Licht und Sonne« steht das Prädikat grammatisch im Plural, obwohl das Griechische den Singular hat.
- source_word: οἱ ταπεινοὶ
  choice: die Niedrigen
  rationale: ταπεινός kann eine demütige Haltung oder einen niedrigen gesellschaftlichen Rang bezeichnen. »Die Niedrigen« bewahrt besonders den Gegensatz der gesellschaftlichen Umkehr, ohne innere Demut festzulegen.
- source_word: ὑψώθησαν
  choice: wurden erhöht
  rationale: Die passive Form und das Bild der Erhöhung werden unmittelbar und in würdigem, geläufigem Deutsch wiedergegeben.
- source_word: κατέφαγον
  choice: verschlangen
  rationale: Das starke Verb bezeichnet ein vollständiges Aufzehren und behält in der übertragenen Siegesdarstellung seine drastische Bildkraft.
- source_word: τοὺς ἐνδόξους
  choice: die Angesehenen
  rationale: ἔνδοξος bezeichnet Menschen, die Ehre, Ansehen oder Ruhm besitzen. »Die Angesehenen« ist natürliches modernes Deutsch und stellt den sozialen Gegensatz zu den Niedrigen klar dar.
theological_decisions:
- issue: Ob die verdichtete Bildsprache als sachliche Aussage über Befreiung und Sieg entfaltet werden soll
  choice: Die Bilder von aufgehender Sonne, Erhöhung und Verschlingen bleiben unaufgelöst stehen.
  alternative: Den Vers deutend als Befreiung der Unterdrückten und Sieg über die Mächtigen wiedergeben.
  rationale: Der griechische Text ist bewusst knapp und symbolisch. Eine erklärende Paraphrase würde die genuine Mehrdeutigkeit und Spannung des Bildes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe und eindringliche Bildfolge des Griechischen bleibt erhalten; die ungewöhnliche Verbindung von Licht und Sonne wird nicht erklärend geglättet.
