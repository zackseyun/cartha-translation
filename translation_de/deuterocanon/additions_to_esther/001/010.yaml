  source_fidelity: 'Die Übersetzung gibt die Bildfolge des Griechischen vollständig und ohne interpretierende Auflösung wieder: φῶς / ὁ ἥλιος als „Licht und Sonne“, ἀνέτειλεν als „gingen auf“, die Erniedrigten/sozial Niedrigen als „die Niedrigen“, die passive Erhöhung und das drastische κατέφαγον als „verschlangen“. Das deutsche Pluralprädikat bei dem koordinierten Subjekt ist idiomatisch und beeinträchtigt die Aussage nicht.'
