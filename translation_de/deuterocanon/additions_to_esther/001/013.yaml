  text: He listened to their plans and investigated their intentions[a], and he learned that they were preparing to lay hands on King Artaxerxes. And he informed the king about them.
translation:
  language: de
  text: Er hörte sich ihre Pläne an und erforschte ihre Absichten. Und erfuhr, dass sie sich darauf vorbereiteten, Hand an König Artaxerxes zu legen.[a] Und er berichtete dem König von ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »König Artaxerxes anzugreifen«. Wörtlich heißt es im Griechischen: »Hand an König Artaxerxes zu legen«; die Wendung bezeichnet eine feindselige Handlung, legt deren genaue Art aber nicht fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκρόασεν
  choice: hörte sich … an
  rationale: Die Formulierung gibt das aufmerksame, gezielte Zuhören wieder und klingt im modernen Deutschen natürlich.
- source_word: λογισμοὺς
  choice: Pläne
  rationale: Im Zusammenhang einer Verschwörung bezeichnet das Wort überlegte Vorhaben, nicht bloß Gedanken oder Erwägungen.
- source_word: μερίμνας
  choice: Absichten
  rationale: Wörtlich kann das Wort Sorgen oder Angelegenheiten bezeichnen; hier sind die sie beschäftigenden Vorhaben gemeint. „Absichten“ erschließt den Kontext, ohne die Art des geplanten Angriffs näher festzulegen.
- source_word: ἐξηραύνησεν
  choice: erforschte
  rationale: Das Verb bezeichnet ein sorgfältiges Erkunden oder Nachforschen. „Erforschte“ bewahrt diesen intensiven Sinn und lässt sich gut mit dem Objekt „Absichten“ verbinden.
- source_word: ἑτοιμάζουσιν
  choice: sie sich darauf vorbereiteten
  rationale: Der griechische Präsensstamm beschreibt die im Gang befindliche Vorbereitung; im deutschen Erzählzusammenhang ist das Präteritum idiomatisch.
- source_word: τὰς χεῖρας ἐπιβαλεῖν
  choice: Hand an … zu legen
  rationale: Die deutsche Wendung bewahrt das griechische Bild und bezeichnet eine feindselige Handlung, ohne zwischen Ergreifen, Angriff und Tötungsabsicht zu entscheiden.
- source_word: ὑπέδειξεν
  choice: berichtete
  rationale: Hier bedeutet das Verb, dass Mordechai dem König die Angelegenheit zur Kenntnis brachte. „Berichtete“ passt zum höfischen Erzählzusammenhang.
