  text: And every righteous nation was thrown into turmoil[a], fearing their own calamities[c][b], and they prepared to perish.
translation:
  language: de
  text: Und jedes rechtschaffene Volk wurde beunruhigt[a], weil seine Angehörigen ihr eigenes Unheil[b] fürchteten und sich bereitmachten, zugrunde zu gehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jedes gerechte Volk wurde erschüttert“. δίκαιον kann „rechtschaffen“ oder „gerecht“ bedeuten; ἐταράχθη kann auch mit „wurde erschüttert“ oder „geriet in Unruhe“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „ihre eigenen Übel“. Gemeint sein können die schlimmen Ereignisse oder Katastrophen, die sie selbst zu treffen drohten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „vernichtet zu werden“. ἀπολέσθαι kann sowohl das Zugrundegehen als auch das Vernichtetwerden hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: geriet in Aufruhr
  rationale: Die passive Verbform bezeichnet eine starke innere und äußere Erschütterung. „Geriet in Aufruhr“ gibt diese kollektive Beunruhigung kräftiger wieder als das blassere „wurde beunruhigt“.
- source_word: δίκαιον
  choice: rechtschaffen
  rationale: δίκαιος kennzeichnet das Volk moralisch als gerecht beziehungsweise aufrichtig. „Rechtschaffen“ bewahrt diesen ethischen Gehalt und klingt bei einem Volk im modernen Deutschen natürlicher als „gerecht“.
- source_word: πᾶν ἔθνος
  choice: jedes … Volk
  rationale: Der griechische Ausdruck steht im Singular und bezeichnet distributiv jedes Volk. „Volk“ ist hier natürlicher und ebenso quellennah wie „Nation“.
- source_word: φοβούμενοι
  choice: sie fürchteten
  rationale: Das griechische Partizip steht trotz des grammatisch singularischen und sächlichen ἔθνος im maskulinen Plural und richtet den Blick auf die Menschen des jeweiligen Volkes. Ein neuer Satzteil mit „sie“ bildet diesen sinngemäßen Numeruswechsel verständlich ab.
- source_word: τὰ ἑαυτῶν κακά
  choice: ihr eigenes Unheil
  rationale: κακά kann allgemein Böses bezeichnen, meint im Zusammenhang drohender Vernichtung aber wahrscheinlich das Unheil, das sie selbst treffen würde. Der Singular „Unheil“ ist im Deutschen idiomatisch und lässt den Umfang der drohenden Schäden offen.
- source_word: ἡτοιμάσθησαν
  choice: machten sich bereit
  rationale: Die formal passive beziehungsweise mediale Form hat hier den intransitiv-medialen Sinn, dass sie sich selbst bereit machten. Die deutsche Wendung bewahrt diesen aktiven Aspekt.
- source_word: ἀπολέσθαι
  choice: zugrunde zu gehen
  rationale: Der mediale Infinitiv kann Sterben, Untergang oder Vernichtung bezeichnen. „Zugrunde zu gehen“ bewahrt die Schwere und lässt die genaue Art des Untergangs offen.
theological_decisions:
- issue: Bedeutung von δίκαιον als Kennzeichnung des betroffenen Volkes
  choice: moralisch-ethisch „rechtschaffen“
  alternative: sozial oder rechtlich „gerecht“
  rationale: Der Ausdruck stellt das Volk als moralisch aufrichtig beziehungsweise unschuldig gegenüber dem drohenden Unheil dar. „Rechtschaffen“ wahrt das moralische Gewicht, ohne eine bestimmte konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom singularischen „jedes … Volk“ zum pluralischen „sie“ folgt dem auffälligen sinngemäßen Numeruswechsel im Griechischen und bezieht sich auf die Angehörigen der jeweiligen Völker. Das ungewöhnlich harte „machten sich bereit, zugrunde zu gehen“ wurde bewusst nicht geglättet, um die Spannung des Ausgangstextes zu erhalten.
