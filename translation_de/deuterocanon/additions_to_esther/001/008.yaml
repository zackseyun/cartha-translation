revisions:
- from: Und jedes rechtschaffene Volk geriet in Aufruhr[a]; sie fürchteten ihr eigenes Unheil[b] und machten sich bereit, zugrunde zu gehen.[c]
  to: Und jedes rechtschaffene Volk wurde beunruhigt[a], weil seine Angehörigen ihr eigenes Unheil[b] fürchteten und sich bereitmachten, zugrunde zu gehen.[c]
  rationale: Die Fassung wahrt die semantische Breite von ἐταράχθη durch „wurde beunruhigt“ und vermeidet die im Deutschen naheliegende, aber im Griechischen nicht angelegte Assoziation eines Aufstands. Die kausale Wiedergabe des Partizips φοβούμενοι ist möglich; „seine Angehörigen“ erschließt dabei den ungewöhnlichen Übergang vom singularischen ἔθνος zu den pluralischen Partizipien in natürlichem Deutsch. Die übrigen Entscheidungen bleiben erhalten.
