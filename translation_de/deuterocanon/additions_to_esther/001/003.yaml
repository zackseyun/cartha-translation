base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/003.yaml
  text: He was from the captivity that Nebuchadnezzar king of Babylon had carried away from Jerusalem with Jeconiah king of Judea.
translation:
  language: de
  text: Er gehörte zu den Gefangenen[a], die zusammen mit Jechonja, dem König von Juda[b], von Nebukadnezar, dem König von Babylon, aus Jerusalem weggeführt worden waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Er war aus der Gefangenschaft«; möglich ist auch: »Er war unter den Weggeführten.«'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Form kann auch mit »Judäa« wiedergegeben werden; gemeint ist hier das Königreich Juda.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῆς αἰχμαλωσίας
  choice: gehörte zu den Gefangenen
  rationale: Die griechische Wendung lautet wörtlich »aus der Gefangenschaft«. Gemeint ist hier am ehesten die Zugehörigkeit zur gefangen weggeführten Gemeinschaft; die deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne die mögliche abstrakte Bedeutung zu verschweigen.
- source_word: ᾐχμαλώτευσεν
  choice: weggeführt hatte
  rationale: Das Verb bezeichnet das Gefangennehmen und gewaltsame Fortführen. »Weggeführt hatte« passt zum historischen Zusammenhang der babylonischen Verschleppung und wahrt die Vorzeitigkeit des griechischen Aorists im Relativsatz.
- source_word: Ναβουχοδονόσορ
  choice: Nebukadnezar
  rationale: Dies ist die im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: μετὰ Ἰεχονίου
  choice: zusammen mit Jechonja
  rationale: μετά mit Genitiv bezeichnet Begleitung. »Zusammen mit« macht klar, dass Jechonja ebenfalls zu den aus Jerusalem Weggeführten gehörte. »Jechonja« gibt die griechische Namensform in einer geläufigen deutschen biblischen Form wieder.
- source_word: τῆς Ἰουδαίας
  choice: von Juda
  rationale: Obwohl die griechische Form formal auch mit »Judäa« wiedergegeben werden kann, bezeichnet sie in diesem königlichen und vorexilischen Zusammenhang das Reich Juda. »König von Juda« ist historisch und im deutschen Bibelregister natürlich.
theological_decisions:
- issue: Wiedergabe der Gefangenschaft ohne zusätzliche theologische Deutung
  choice: Er gehörte zu den Gefangenen … weggeführt hatte
  alternative: Er war aus der Gefangenschaft … gefangen genommen hatte
  rationale: Der Satz macht eine historische Herkunfts- beziehungsweise Zugehörigkeitsangabe. Die gewählte Fassung vermittelt die erzwungene Wegführung, ohne der Gefangenschaft eine spätere theologische Bedeutung beizulegen.
- issue: Juda oder Judäa als Herrschaftsbezeichnung
  choice: König von Juda
  alternative: König von Judäa
  rationale: Die griechische Form lässt eine formalere Wiedergabe mit »Judäa« zu. Der historische Bezug gilt jedoch dem vorexilischen Königreich Juda; die Fußnote bewahrt die formale Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der griechischen historischen Notiz, wird aber durch »gehörte zu den Gefangenen« idiomatisch verständlich. Die Appositionen erhalten den feierlich-biblischen Ton, ohne altertümliche Formen zu verwenden.
