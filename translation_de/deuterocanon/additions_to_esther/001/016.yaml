  text: And the king ordered Mordecai to serve in the court[a], and he gave him gifts on account of these things.
translation:
  language: de
  text: Und der König befahl Mordechai, am Königshof[a] Dienst zu tun, und gab ihm wegen dieser Ereignisse Geschenke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Hofbereich“. Das griechische Wort kann den Königshof, den Palast oder dessen Hofbezirk bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: befahl
  rationale: Das Verb bezeichnet eine verbindliche Anordnung. „Befahl“ bringt die königliche Autorität klar und natürlich zum Ausdruck, ohne daraus eine formelle Ernennung zu machen.
- source_word: θεραπεύειν
  choice: Dienst zu tun
  rationale: Im höfischen Zusammenhang bezeichnet das Verb das Dienen oder Aufwarten. „Dienst zu tun“ ist im Deutschen idiomatisch und vermeidet den religiösen Beiklang von „zu dienen“ im Sinne eines geistlichen Dienstes nicht vollständig, macht aber den Hofdienst deutlich.
- source_word: ἐν τῇ αὐλῇ
  choice: am Königshof
  rationale: αὐλή kann Hof, Hofbezirk oder Palast bedeuten. „Am Königshof“ gibt im Erzählzusammenhang den institutionellen und räumlichen Rahmen natürlich wieder; die mögliche stärker räumliche Lesart wird in der Fußnote bewahrt.
- source_word: δόματα
  choice: Geschenke
  rationale: δόματα bezeichnet Gaben oder Geschenke. „Geschenke“ bleibt neutral; „Belohnungen“ würde den Zweck der Gaben stärker festlegen, als der griechische Ausdruck es tut.
- source_word: περὶ τούτων
  choice: wegen dieser Ereignisse
  rationale: Die Wendung bezeichnet hier den Anlass oder Grund und behält mit „dieser Ereignisse“ den pluralischen Rückbezug bei. „Ereignisse“ klingt im Deutschen natürlicher als das wörtlichere „Dinge“.
