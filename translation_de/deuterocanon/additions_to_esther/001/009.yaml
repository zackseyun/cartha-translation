base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/009.yaml
  text: And they cried out to God[a], and from their cry there came, as it were, a great river from a little spring, abundant water.
translation:
  language: de
  text: Und sie schrien zu Gott. Aus ihrem Schreien aber entstand gleichsam aus einer kleinen Quelle ein großer Strom, eine Fülle von Wasser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »viel Wasser«.'
    reason: Die knappe appositionelle Wendung ὕδωρ πολύ kann formnäher mit »viel Wasser« wiedergegeben werden.
lexical_decisions:
- source_word: ἐβόησαν
  choice: schrien
  rationale: βοάω bezeichnet ein lautes, dringliches Rufen. »Sie schrien zu Gott« gibt sowohl die Intensität als auch die an Gott gerichtete Bitte knapp und natürlich wieder.
- source_word: πρὸς τὸν θεόν
  choice: zu Gott
  rationale: πρός kennzeichnet hier bei einem Verb des Rufens den Angerufenen. »Zu Gott« ist im Deutschen die natürliche Wendung.
- source_word: βοῆς
  choice: Schreien
  rationale: Das Substantiv greift das vorangehende Verb auf. »Aus ihrem Schreien« bewahrt diese Wiederaufnahme und die bildhafte Herkunftsangabe ἀπό.
- source_word: ἐγένετο
  choice: entstand
  rationale: γίνομαι bezeichnet hier das Hervortreten oder Entstehen des großen Stroms, nicht die Verwandlung eines ausdrücklich genannten Gegenstands.
- source_word: ὡσανεὶ
  choice: gleichsam
  rationale: »Gleichsam« erhält den vergleichenden beziehungsweise annähernden Charakter des Bildes, ohne es als rein wörtlichen Vorgang festzulegen.
- source_word: μικρᾶς πηγῆς
  choice: einer kleinen Quelle
  rationale: πηγή bezeichnet eine Quelle oder einen Quellort; »kleine Quelle« gibt den deutlichen Größenkontrast zum großen Strom wieder.
- source_word: ποταμὸς μέγας
  choice: ein großer Strom
  rationale: »Großer Strom« bewahrt die schlichte, nachdrückliche Größenangabe und klingt in diesem bildhaften Zusammenhang würdig und natürlich.
- source_word: ὕδωρ πολύ
  choice: eine Fülle von Wasser
  rationale: Die nachgestellte Wortgruppe erläutert appositionell die Wasserfülle des Stroms. »Eine Fülle von Wasser« gibt den Nachdruck idiomatisch wieder; die formnähere Fassung steht in der Fußnote.
theological_decisions:
- issue: Charakter des Bildes im zweiten Satz
  choice: Der Vergleichsmarker wird mit »gleichsam« ausdrücklich beibehalten.
  alternative: Die Aussage ohne Vergleichsmarker als unmittelbar wörtliche Beschreibung formulieren.
  rationale: ὡσανεί kennzeichnet Vergleich oder Annäherung. Seine Wiedergabe bewahrt die symbolische beziehungsweise visionäre Offenheit des Bildes und legt dessen Wirklichkeitsart nicht unnötig fest.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. »Gleichsam« wahrt den feierlichen Bildcharakter, bleibt aber allgemein verständlich. Der Fußnotenmarker steht unmittelbar bei der übersetzten Wendung, auf die sich die Anmerkung bezieht.
