  text: And the king wrote these words as a memorial[b][a], and Mordecai wrote concerning these words.
translation:
  language: de
  text: Und der König schrieb diese Worte zum Gedächtnis[a], und Mordechai schrieb über diese Worte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Erinnerungszeichen“ oder „zur Erinnerung“. Das griechische εἰς μνημόσυνον kann sowohl ein Erinnerungszeichen als auch eine zur Erinnerung bewahrte Aufzeichnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über diese Angelegenheiten“. Das griechische λόγοι kann je nach Zusammenhang „Worte“ oder allgemeiner „Dinge, Angelegenheiten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: schrieb … auf / schrieb
  rationale: γράφω bezeichnet hier unmittelbar das Schreiben beziehungsweise schriftliche Festhalten. Im ersten Satzteil macht das trennbare Verb „aufschreiben“ den Zweck eines bleibenden Gedächtnisses natürlich deutlich; im zweiten bleibt das einfache „schrieb“ mit περί idiomatisch.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: λόγοι kann sowohl „Worte“ als auch weiter gefasst „Dinge/Sachverhalte“ bedeuten. „Diese Worte“ wahrt die konkrete lexikalische Gestalt und wird in beiden Satzteilen wiederholt.
- source_word: εἰς μνημόσυνον
  choice: zum Gedächtnis
  rationale: μνημόσυνον bezeichnet etwas, das dem Erinnern dient, also ein Erinnerungszeichen oder einen bewahrten Gedächtniseintrag. „Zum Gedächtnis“ erhält diese Spannweite und entspricht der Zweckrichtung von εἰς.
- source_word: Μαρδοχαῖος
  choice: Mordechai
  rationale: „Mordechai“ ist die im modernen Deutschen etablierte biblische Namensform.
- source_word: περὶ τῶν λόγων τούτων
  choice: über diese Worte
  rationale: περί mit Genitiv bedeutet hier „über/betreffend“. Die Formulierung erhält zugleich die Wiederholung von λόγοι.
