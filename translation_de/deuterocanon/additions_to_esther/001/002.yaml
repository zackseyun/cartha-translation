lexical_decisions:
- source_word: ἄνθρωπος Ἰουδαῖος
  choice: ein jüdischer Mann
  rationale: ἄνθρωπος bezeichnet hier eine konkrete männliche Person; Ἰουδαῖος benennt ihre jüdische Zugehörigkeit. Die Formulierung ist im modernen Deutschen natürlich und sachlich.
- source_word: οἰκῶν
  choice: der … wohnte
  rationale: Das Partizip bezeichnet den Wohnsitz. Ein deutscher Relativsatz gibt die Aussage klar und idiomatisch wieder.
- source_word: ἐν Σούσοις τῇ πόλει
  choice: in der Stadt Susa
  rationale: Die Wiedergabe bewahrt sowohl den Ortsnamen als auch die ausdrückliche Bezeichnung als Stadt, ohne die im Deutschen unbeholfene griechische Apposition nachzuahmen.
- source_word: ἄνθρωπος μέγας
  choice: ein bedeutender Mann
  rationale: μέγας bezeichnet in diesem höfischen Zusammenhang wahrscheinlich Rang, Einfluss oder Ansehen, nicht körperliche Größe. „Bedeutend“ wahrt diese semantische Breite.
- source_word: θεραπεύων
  choice: der … diente
  rationale: Im höfischen Zusammenhang bezeichnet das Partizip Dienst oder Aufwartung. „Diente“ ist klar und vermeidet eine religiöse Nebenbedeutung.
- source_word: ἐν τῇ αὐλῇ τοῦ βασιλέως
  choice: am Hof des Königs
  rationale: αὐλή meint hier den königlichen Hof als Dienst- und Herrschaftssphäre; „am Hof“ ist die idiomatische deutsche Entsprechung.
