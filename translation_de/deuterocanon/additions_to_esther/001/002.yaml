  text: ein jüdischer Mann, der in der Stadt Susa[a] wohnte, ein bedeutender Mann[b], der am Hof des Königs diente[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in Susa, der Stadt«.'
