  - marker: b
    text: 'Oder: »ein angesehener Mann«.'
    reason: μέγας kann hier gesellschaftliche Bedeutung, Rang oder Ansehen bezeichnen.
  - marker: c
    text: 'Oder: »der im Hof des Königs aufwartete«.'
