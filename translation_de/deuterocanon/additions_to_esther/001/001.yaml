lexical_decisions:
- source_word: Ἔτους δευτέρου βασιλεύοντος Ἀρταξέρξου
  choice: Im zweiten Regierungsjahr des … Artaxerxes
  rationale: Die griechische Zeitangabe bezeichnet das zweite Jahr seiner Herrschaft. Die kompakte deutsche Form gibt den Sinn natürlich und genau wieder.
- source_word: τοῦ μεγάλου βασιλέως
  choice: des Großkönigs
  rationale: Der Ausdruck ist ein persischer Herrschertitel. „Großkönig“ ist im Deutschen die geläufige und prägnante Wiedergabe.
- source_word: τῇ μιᾷ τοῦ Νεισὰ
  choice: am ersten Tag des Monats Nisan
  rationale: Die griechische kalendarische Wendung bezeichnet den ersten Monatstag. „Nisan“ ist die im Deutschen übliche Form des jüdischen Monatsnamens; die griechische Form wird in einer Fußnote genannt.
- source_word: ἐνύπνιον εἶδεν
  choice: sah … einen Traum
  rationale: Die Formulierung folgt dem griechischen Bild wörtlich, bleibt im Deutschen verständlich und bewahrt gegenüber dem idiomatischeren „träumte“ die konkrete Ausdrucksweise der Vorlage.
- source_word: Μαρδοχαῖος ὁ τοῦ Ἰαείρου, τοῦ Σεμεείου τοῦ Κεισαίου
  choice: Mordechai, der Sohn Jaïrs, des Sohnes Schimis, des Sohnes Kischs
  rationale: Die aufeinanderfolgenden Genitive geben eine Abstammungsreihe an. Die wiederholte Wiedergabe mit „Sohn“ macht diese Beziehung im Deutschen eindeutig.
- source_word: ἐκ φυλῆς Βενιαμείν
  choice: aus dem Stamm Benjamin
  rationale: Dies ist die natürliche deutsche Bezeichnung für die Stammeszugehörigkeit und entspricht der griechischen Herkunftsangabe.
