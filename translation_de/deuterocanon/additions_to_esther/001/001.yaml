  text: Im zweiten Regierungsjahr des Großkönigs Artaxerxes, am ersten Tag des Monats Nisan[a], hatte Mordechai, der Sohn Jairs, des Sohnes Schimis, des Sohnes Kischs, aus dem Stamm Benjamin, einen Traum[b].
