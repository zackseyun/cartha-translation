  text: And at their cry every nation was made ready for war[b][a], so as to fight against the nation of the righteous.
translation:
  language: de
  text: Und auf ihr Geschrei[a] hin wurde jedes Volk zum Krieg gerüstet, um[b] gegen das Volk der Gerechten[c] zu kämpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Stimme“ beziehungsweise „ihr Laut“. Das griechische Wort kann allgemein die Stimme, den Laut oder das von ihnen ausgehende Geräusch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sodass es … kämpfte“. Die griechische Konstruktion kann sowohl auf das Ziel als auch auf die erwartete Folge hinweisen.'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Oder: „das gerechte Volk“. Die griechische Wortgruppe kann als Genitivverbindung („Volk der Gerechten“) oder als knappe Beschreibung eines gerechten Volkes verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῇ
  choice: Geschrei
  rationale: Das Wort bezeichnet Stimme, Laut oder Geräusch. Im kriegerischen Zusammenhang gibt „Geschrei“ den gemeinschaftlichen, aufstachelnden Ruf natürlich wieder, ohne ihm einen bestimmten Wortlaut zuzuschreiben.
- source_word: ἡτοιμάσθη
  choice: wurde … gerüstet
  rationale: Der Aorist Passiv bezeichnet das Versetzen in einen Zustand der Bereitschaft. „Wurde … gerüstet“ wahrt die passive Form und passt idiomatisch zum Kriegskontext.
- source_word: πᾶν ἔθνος
  choice: jedes Volk
  rationale: Die singularische distributive Wendung wird im Deutschen natürlich mit „jedes Volk“ wiedergegeben. „Volk“ entspricht ἔθνος hier besser als das politisch enger klingende „Nation“.
- source_word: εἰς πόλεμον
  choice: zum Krieg
  rationale: εἰς mit πόλεμος bezeichnet die Ausrichtung der Vorbereitung auf den Krieg; „zum Krieg gerüstet“ ist knapp und idiomatisch.
- source_word: ὥστε πολεμῆσαι
  choice: um … zu kämpfen
  rationale: Die Infinitivkonstruktion kann Ziel oder erwartete Folge ausdrücken. Im Haupttext gibt „um … zu kämpfen“ den Zusammenhang flüssig wieder; eine Fußnote hält die Folgelesart offen.
- source_word: δικαίων ἔθνος
  choice: das Volk der Gerechten
  rationale: Die Genitivverbindung wird formal bewahrt und lässt offen, ob eine aus Gerechten bestehende Gemeinschaft oder ein als gerecht gekennzeichnetes Volk gemeint ist.
theological_decisions:
- issue: Identifikation von δικαίων ἔθνος
  choice: Beschreibend als „das Volk der Gerechten“, ohne es im Haupttext ausdrücklich mit Israel oder den Juden gleichzusetzen.
  alternative: „das gerechte Volk“ oder ausdrücklich „das Volk der Juden“
  rationale: Der griechische Text verwendet eine beschreibende Wendung und keinen ausdrücklichen ethnischen Namen. Die Übersetzung bewahrt diese Offenheit und vermeidet eine eingetragene Identifikation.
- issue: Ziel oder Folge in ὥστε πολεμῆσαι
  choice: Im Haupttext als Ziel formuliert, die mögliche Folgelesart jedoch in einer Fußnote bewahrt.
  alternative: „sodass es gegen das Volk der Gerechten kämpfte“
  rationale: ὥστε mit Infinitiv kann je nach Zusammenhang beabsichtigte beziehungsweise natürliche Folge ausdrücken. Die griechische Konstruktion legt die genaue Abgrenzung nicht zwingend fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf ihr Geschrei hin“ macht den auslösenden Zusammenhang natürlich deutlich; „zum Krieg gerüstet“ bewahrt die passive Aussage. Die Wiederholung von „Volk“ bildet den Kontrast des griechischen Textes ab.
