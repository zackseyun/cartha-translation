  yaml_path: translation/deuterocanon/3_maccabees/005/041.yaml
  text: For this reason the city is in turmoil because of the expectation[a], and as it grows with crowds[c][b], it is already in danger of being plundered many times.
translation:
  language: de
  text: Deshalb ist die Stadt wegen der Erwartung[a] in Aufruhr; und da sie durch Menschenansammlungen[b] immer voller wird, ist sie bereits in Gefahr, wiederholt[c] geplündert zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen der Antizipation“ oder „wegen der Ungewissheit“; das griechische Wort bezeichnet einen Zustand des Erwartens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch versammelte Gruppen“; das griechische Wort kann auch Menschenmengen oder Zusammenrottungen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich auch: „oft“ oder „viele Male“. Die Stellung im griechischen Satz lässt auch die Nuance zu, dass die Gefahr wiederholt besteht.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὧν χάριν
  choice: Deshalb
  rationale: Die idiomatische kausale Wendung verweist auf die zuvor genannten Umstände; „Deshalb“ ist knapp und natürlich.
- source_word: ἡ πόλις
  choice: die Stadt
  rationale: Bewahrt das Bild des griechischen Textes, auch wenn dabei zugleich die Stadtbevölkerung mitgemeint ist.
- source_word: διὰ τὴν προσδοκίαν
  choice: wegen der gespannten Erwartung
  rationale: προσδοκία bezeichnet Erwartung oder Antizipation. Das Adjektiv „gespannt“ macht den hier naheliegenden Zustand öffentlicher Anspannung verständlich, ohne den erwarteten Ausgang festzulegen.
- source_word: ὀχλεῖ
  choice: ist … in Aufruhr
  rationale: Gibt die durch ὀχλέω bezeichnete Beunruhigung und Unruhe einer ganzen Stadt in natürlichem Deutsch wieder.
- source_word: πληθύνουσα
  choice: immer voller wird
  rationale: Das Partizip bezeichnet eine fortschreitende Zunahme. Zusammen mit dem Dativ συστροφαῖς lässt sich dies im Deutschen natürlich als zunehmende Fülle an Ansammlungen ausdrücken.
- source_word: συστροφαῖς
  choice: durch Menschenansammlungen
  rationale: συστροφή kann versammelte Gruppen, Menschenmengen oder Zusammenrottungen bezeichnen. „Menschenansammlungen“ wahrt die Unbestimmtheit hinsichtlich ihres Charakters.
- source_word: ἤδη
  choice: bereits
  rationale: Kennzeichnet die Gefahr als schon gegenwärtig.
- source_word: κινδυνεύει
  choice: besteht … die Gefahr
  rationale: Natürliche deutsche Wiedergabe des Verbs für das Bestehen einer Gefahr oder eines Risikos.
- source_word: πολλακὶς
  choice: häufig
  rationale: Das Adverb bedeutet „oft“, „häufig“ oder „viele Male“. Seine Stellung beim finiten Verb spricht dafür, die Wiederholung auf das Bestehen der Gefahr zu beziehen, nicht zwingend auf mehrfach erfolgende Plünderungen.
- source_word: διαρπασθῆναι
  choice: dass sie geplündert wird
  rationale: Das Passiv bezeichnet das Ausplündern oder Plündern der Stadt; der deutsche dass-Satz ist hier flüssiger als eine erweiterte Infinitivkonstruktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wahrt das Stadtbild des Griechischen, formuliert die ungewöhnliche Verbindung von πληθύνουσα und συστροφαῖς jedoch idiomatisch. Die mögliche Zuordnung von πολλακὶς bleibt durch eine Fußnote offen.
