base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/031.yaml
  text: All the parents who were present[a], and the children with them, have prepared this lavish feast for the wild beasts, instead of the Jews[b], who have been shown to me and to my forefathers to possess complete and steadfast faithfulness beyond reproach.
translation:
  language: de
  text: Alle, die als Eltern oder als Nachkommen von Kindern[a] anwesend waren, haben den wilden Tieren dieses üppige Mahl bereitet – anstelle der Juden, die sich mir und meinen Vorfahren als untadelig erwiesen haben und zu denen ich volles, festes Vertrauen habe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung ist ungewöhnlich und möglicherweise gestört. Gemeint sein können auch die anwesenden Eltern und ihre Kinder beziehungsweise Nachkommen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deren vollständige, feste Treue ich erfahren habe“. Das griechische Wort kann hier Vertrauen, Vertrauenswürdigkeit oder Treue bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅσοι γονεῖς παρῆσαν ἢ παίδων γόνοι
  choice: Alle, die als Eltern oder als Nachkommen von Kindern anwesend waren
  rationale: Die ungewöhnliche und unsichere griechische Formulierung wird in ihrem Aufbau bewahrt, ohne sie stillschweigend auf „Eltern und ihre Kinder“ festzulegen.
- source_word: θηρσὶν ἀγρίοις
  choice: den wilden Tieren
  rationale: Der Dativ bezeichnet die Empfänger des Mahls; „wilde Tiere“ ist natürliches modernes Deutsch und gibt die bedrohliche Bedeutung wieder.
- source_word: ἐσκεύασαν δαψιλῆ θοῖναν
  choice: haben ... dieses üppige Mahl bereitet
  rationale: Gibt die vollzogene Bereitung eines reichlichen Festmahls wieder und erhält die grausame Ironie des Zusammenhangs.
- source_word: ἀνεγκλήτων ... ἀποδεδειγμένων
  choice: die sich ... als untadelig erwiesen haben
  rationale: Die Formulierung bewahrt den forensischen Sinn von ἀνέγκλητος und den festgestellten, erwiesenen Charakter des Perfektpartizips.
- source_word: ὁλοσχερῆ βεβαίαν πίστιν ἔχων
  choice: zu denen ich volles, festes Vertrauen habe
  rationale: ἔχων ist Nominativ Singular und bezieht sich daher am natürlichsten auf den redenden König, nicht auf die Juden. πίστις bezeichnet hier sein begründetes Vertrauen zu ihnen; ὁλοσχερής und βέβαιος werden mit „voll“ und „fest“ wiedergegeben.
theological_decisions:
- issue: Bezug und Bedeutung von πίστις in ὁλοσχερῆ βεβαίαν πίστιν ἔχων
  choice: zu denen ich volles, festes Vertrauen habe
  alternative: die vollkommene und beständige Treue besitzen
  rationale: Das nominativische Singularpartizip ἔχων weist auf den Sprecher als den Vertrauenden. Im politischen Zusammenhang meint πίστις wahrscheinlich Vertrauen beziehungsweise Zuverlässigkeit, nicht spezifisch religiösen Glauben. Die Fußnote nennt „Treue“ als mögliche semantische Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich verdeutlicht den scharfen Gegensatz, ohne den Satz inhaltlich umzudeuten. Die auffällige Bezeichnung der anwesenden Personen bleibt im Haupttext erkennbar und wird in der Fußnote erläutert.
