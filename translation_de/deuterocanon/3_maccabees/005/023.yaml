  text: But just then[a], when the rooster had crowed at dawn, Hermon, having armed the beasts, was driving them on in the great colonnade.
translation:
  language: de
  text: Doch gerade als der Hahn bei Tagesanbruch gekräht hatte, trieb Hermon, nachdem er die wilden Tiere ausgerüstet hatte, sie im großen Säulenhof umher[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der großen Säulenhalle“; das griechische Wort bezeichnet einen von Säulen umgebenen oder mit Säulen versehenen Raum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Doch gerade als
  rationale: ἄρτι bezeichnet die unmittelbare Zeitlage, während δέ den erzählerischen Übergang leicht absetzt. Zusammen mit dem folgenden Temporalsatz ergibt sich im Deutschen eine natürliche und dringliche Einleitung.
- source_word: ἀλεκτρυὼν ἐκέκραγεν ὄρθρος
  choice: bei Tagesanbruch der Hahn gekräht hatte
  rationale: ἀλέκτρυων ist der Hahn, ἐκέκραγεν bezeichnet sein Krähen, und ὄρθρος legt die Zeit als Morgengrauen beziehungsweise Tagesanbruch fest. Das Plusquamperfekt bindet dieses Ereignis als zeitlichen Hintergrund an Hermons anschließendes Handeln.
- source_word: τὰ θηρία
  choice: die wilden Tiere
  rationale: θηρία bezeichnet hier die gefährlichen Tiere, die für den geplanten Angriff eingesetzt werden sollen. „Wilde Tiere“ ist im heutigen Deutsch klarer als das mögliche, aber altertümlichere „Bestien“.
- source_word: καθωπλικὼς
  choice: rüstete … aus
  rationale: Die Form gehört zu καθοπλίζω und bezeichnet das Bewaffnen oder vollständige Ausrüsten. „Ausrüsten“ bewahrt die Aussage, ohne unklar zu behaupten, die Tiere hätten Waffen im engeren Sinn getragen.
- source_word: διεκίνει
  choice: trieb sie … umher
  rationale: διακινέω kann bedeuten, etwas in Bewegung zu setzen, anzutreiben oder hin und her zu bewegen. Das imperfektive „trieb … umher“ gibt sowohl die fortdauernde Handlung als auch Hermons aktive Führung der Tiere wieder.
- source_word: ἐν τῷ μεγάλῳ περιστυλίῳ
  choice: in dem großen Säulenhof
  rationale: περιστύλιον bezeichnet einen von Säulen umgebenen architektonischen Raum, insbesondere einen Säulenhof. Die deutsche Wiedergabe ist anschaulich und allgemein verständlich; die mögliche Bedeutung „Säulenhalle“ wird in der Fußnote genannt.
- source_word: ὁ Ἕρμων
  choice: Hermon
  rationale: Der griechische Eigenname wird in der geläufigen lateinischen Umschrift wiedergegeben.
