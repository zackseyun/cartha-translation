  text: 'But the relatives who were reclining with him[a], marveling at his unstable state of mind[b], kept saying these things:'
translation:
  language: de
  text: 'Die Verwandten aber, die mit ihm zu Tisch lagen[a], wunderten sich über seine unbeständige Sinnesart[b] und sagten immer wieder Folgendes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die mit ihm aßen“ beziehungsweise „mit ihm zu Tisch waren“. Das Griechische verweist ausdrücklich auf die antike Sitte, bei Mahlzeiten zu liegen.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „seine unbeständige Sinnesart“. Gemeint ist seine schwankende oder unbeständige innere Haltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνανακείμενοι
  choice: die mit ihm zu Tisch lagen
  rationale: Das Partizip bezeichnet das gemeinsame Liegen bei einer Mahlzeit. Die Formulierung bewahrt die antike Tischsitte und ist im Deutschen verständlich; gemeint ist sinngemäß, dass sie mit ihm aßen.
- source_word: συγγενεῖς
  choice: die Verwandten
  rationale: Das Wort bezeichnet Angehörige beziehungsweise Blutsverwandte. „Verwandte“ ist die klare, moderne Standardentsprechung.
- source_word: ἄσταθη
  choice: unstete
  rationale: Das Adjektiv beschreibt hier eine schwankende, unbeständige innere Haltung. „Unstet“ bewahrt diese Bedeutung, ohne eine konkrete psychische Diagnose einzutragen.
- source_word: διάνοιαν
  choice: Gesinnung
  rationale: Im Zusammenhang bezeichnet διάνοια die innere Denk- und Willenshaltung. „Gesinnung“ verbindet sich natürlich mit „unstet“ und lässt den genauen Umfang des griechischen Begriffs offen.
- source_word: θαυμάζοντες
  choice: wunderten sich
  rationale: Das Partizip drückt Verwunderung oder Erstaunen aus. „Wunderten sich“ ist natürlich und legt nicht fest, ob die Reaktion positiv oder negativ war.
- source_word: προεφέροντο
  choice: sagten immer wieder
  rationale: Das Imperfekt bezeichnet ein fortdauerndes oder wiederholtes Äußern. „Sagten immer wieder“ bildet diesen Aspekt ab und passt zur Einleitung der folgenden Rede.
- source_word: τάδε
  choice: Folgendes
  rationale: Das Demonstrativpronomen weist voraus auf die anschließende Rede. „Folgendes“ ist dafür im modernen Deutschen die natürliche Formel.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit „aber“ nach dem Subjektanschluss wahrt den erzählerischen Gegensatz. „Zu Tisch lagen“ erhält das historische Bild; die Fußnote bietet geläufigere heutige Umschreibungen. „Unstete Gesinnung“ bewahrt die Wertung des griechischen Ausdrucks, ohne sie medizinisch zuzuspitzen.
