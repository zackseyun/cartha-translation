translation_notes:
  register: Moderne, würdevolle direkte Rede mit klar erkennbarer Entrüstung. Die griechischen Partizipien werden zugunsten eines natürlichen deutschen Satzbaus finit wiedergegeben. Die Spannung zwischen wiederholtem Vernichtungsbefehl und wiederholter Rücknahme bleibt erhalten.
