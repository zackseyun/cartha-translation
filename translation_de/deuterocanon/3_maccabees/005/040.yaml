base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/040.yaml
  text: O king[a], how long will you keep testing us, now commanding for the third time that they be destroyed, and then again, in the matter at hand, reversing by a change of mind the decisions you have made?
translation:
  language: de
  text: »König, wie lange stellst du uns noch auf die Probe? Nun befiehlst du schon zum dritten Mal, sie zu vernichten, und dann hebst du in der vorliegenden Angelegenheit nach einem Sinneswandel die von dir gefassten Beschlüsse[a] wieder auf.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die von dir erlassenen Verfügungen«. Der griechische Ausdruck kann nicht nur allgemein gefasste Entscheidungen, sondern auch amtliche königliche Erlasse bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπειράζεις
  choice: stellst du uns noch auf die Probe
  rationale: Das Präsens zusammen mit μέχρι τίνος bezeichnet eine fortdauernde, wiederholte Erprobung; die deutsche Wendung gibt zugleich den vorwurfsvollen Ton wieder.
- source_word: προστάσσων
  choice: befiehlst du
  rationale: Das Verb bezeichnet hier einen verbindlichen königlichen Befehl. Die finite Wiedergabe ist im Deutschen natürlicher als eine Partizipialkonstruktion.
- source_word: ἤδη τρίτον
  choice: nun ... schon zum dritten Mal
  rationale: „Nun schon“ bewahrt den Gedanken, dass die wiederholte Handlung inzwischen diesen Punkt erreicht hat; „zum dritten Mal“ gibt τρίτον eindeutig wieder.
- source_word: αὐτοὺς ἀφανίσαι
  choice: sie zu vernichten
  rationale: ἀφανίζω bezeichnet hier die vollständige Beseitigung beziehungsweise Vernichtung der betroffenen Menschen. Der aktive Infinitiv entspricht nach „befehlen“ natürlichem Deutsch.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: wenn es zur Ausführung kommen soll
  rationale: Die Wendung bezieht sich im Zusammenhang auf die praktische Umsetzung der angeordneten Sache. Diese idiomatische Wiedergabe macht den Gegensatz zwischen Befehl und dessen anschließender Aufhebung deutlich, ohne den Sachbezug zu verlieren.
- source_word: ἐκ μεταβολῆς
  choice: nach einem Sinneswandel
  rationale: Die Formulierung bezeichnet eine Änderung der Absicht oder Haltung, aus der die erneute Aufhebung hervorgeht.
- source_word: ἀναλύων
  choice: hebst du ... wieder auf
  rationale: Das Verb bedeutet in diesem Zusammenhang, frühere Festlegungen rückgängig zu machen. „Wieder aufheben“ bildet sowohl die Umkehrung als auch das wiederholte Schwanken ab.
- source_word: τὰ σοὶ δεδογμένα
  choice: die von dir gefassten Beschlüsse
  rationale: Das substantivierte Partizip bezeichnet das, was der König beschlossen beziehungsweise verfügt hat. „Beschlüsse“ wahrt die mögliche amtliche Bedeutung, ohne sie im Haupttext zwingend auf formelle Erlasse zu verengen.
