  text: So the one who had been given these orders turned to feasting[a], gathering those of his friends and of the army who were most hostile toward the Jews.
translation:
  language: de
  text: Der Mann, der diese Befehle erhalten hatte, wandte sich dem Festmahl zu[a] und versammelte diejenigen unter seinen Freunden und aus dem Heer, die den Juden am feindseligsten gesinnt waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wandte sich dem Gelage zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... προσταχθεὶς
  choice: Der Mann, der diese Befehle erhalten hatte
  rationale: Das substantivierte Partizip bezeichnet den zuvor Beauftragten; die Formulierung bewahrt den Passivgedanken und verweist mit »diese Befehle« natürlich auf den vorausgehenden Zusammenhang.
- source_word: ἐτρέπετο
  choice: wandte sich ... zu
  rationale: Das Imperfekt Medium beschreibt, wie er sich einer Tätigkeit zuwendet; die deutsche Wendung gibt sowohl Verlaufsaspekt als auch Bewegungsrichtung angemessen wieder.
- source_word: τὴν εὐωχίαν
  choice: dem Festmahl
  rationale: εὐωχία bezeichnet festliches Essen und Trinken beziehungsweise ein Gelage. »Festmahl« ist würdig und gegenwärtig verständlich, ohne die gesellige Feierlichkeit abzuschwächen.
- source_word: συναγαγὼν
  choice: und versammelte
  rationale: Das aoristische Partizip bezeichnet eine mit der Haupthandlung verbundene Begleithandlung. Ein beigeordneter deutscher Satz liest sich natürlich und bewahrt die Handlung.
- source_word: τοὺς μάλιστα τῶν φίλων καὶ τῆς στρατιᾶς
  choice: diejenigen unter seinen Freunden und aus dem Heer, die ... am
  rationale: Die Konstruktion bezeichnet eine Auswahl aus zwei Gruppen; »unter seinen Freunden und aus dem Heer« macht diese Zugehörigkeit im Deutschen klar.
- source_word: ἀπεχθῶς ἔχοντας πρὸς τοὺς Ἰουδαίους
  choice: den Juden am feindseligsten gesinnt waren
  rationale: Die idiomatische Wendung bezeichnet eine feindliche Haltung. Der Superlativ »am feindseligsten« gibt μάλιστα als Gradangabe wieder, ohne die Feindschaft über den griechischen Wortlaut hinaus zu verschärfen.
theological_decisions: []
