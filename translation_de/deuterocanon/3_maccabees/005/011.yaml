  verdict: revise
  source_fidelity: 'Die Grundstruktur ist getroffen: Die personifizierte, seit alters bestehende Zeitordnung sendet dem König Schlaf. Die Fassung „unter dem Wirken dessen“ schwächt jedoch die durch ὑπό ausgedrückte Urheberschaft ab. Zudem ist die Einfügung „es“ in „denen er selbst es schenken will“ ohne klares Bezugswort missverständlich. Die Wiedergabe von μέρος mit „Anteil“ ist im Deutschen natürlicher als „Teil Schlaf“ und bleibt nah am griechischen Bild.'
  naturalness: Der Satz darf bewusst poetisch und leicht feierlich bleiben. „Von dem ... schön zur Geltung gebracht wird“ bildet die passive Konstruktion mit ὑπό klarer und idiomatischer ab als „unter dem Wirken ... hervortritt“. „Einen Anteil Schlaf“ ist modernes, verständliches Standarddeutsch.
  terminology: „Schöpfungsordnung der Zeit“ ist eine vertretbare, wenn auch deutende Wiedergabe von κτίσμα χρόνου; die Fußnote muss die wörtlichere und offene Alternative erkennbar halten. Der indirekte Gottesbezug wird ohne ergänzten Gottesnamen bewahrt. „Seit alters bestehend“ vermeidet zu Recht eine dogmatisch stärkere Aussage wie „von Ewigkeit her“.
  issues:
