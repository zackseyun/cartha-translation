  text: But the age-old ordinance of time[a], beautifully alternating in night and day by the One who grants sleep to all, to whomever he himself wills, sent a portion of sleep upon the king[b];
translation:
  language: de
  text: Doch die seit alters bestehende Schöpfungsordnung der Zeit[a], die von dem, der allen, denen er selbst ihn gewähren will, Schlaf gewährt, bei Nacht und bei Tag schön zur Geltung gebracht wird, sandte dem König einen Anteil Schlaf[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „das seit alters bestehende Geschaffene/Geschöpf der Zeit“. Die griechische Wendung ist dichterisch und knapp; „Schöpfungsordnung der Zeit“ versteht sie im Blick auf Nacht und Tag als die geschaffene Ordnung des zeitlichen Ablaufs.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sandte einen Anteil Schlaf in/zu den König“. Der Dativ „dem König“ ist im Deutschen bei „Schlaf senden“ idiomatisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀπʼ αἰῶνος κτίσμα χρόνου
  choice: die seit alters bestehende Schöpfungsordnung der Zeit
  rationale: κτίσμα bezeichnet etwas Geschaffenes; zusammen mit χρόνου und dem folgenden Bezug auf Nacht und Tag ist die geschaffene Zeitordnung gemeint. „Schöpfungsordnung“ bewahrt sowohl den Schöpfungsbezug als auch den geordneten Ablauf. ἀπʼ αἰῶνος wird mit „seit alters bestehend“ wiedergegeben, ohne daraus eine metaphysische Aussage über Ewigkeit zu machen.
- source_word: καλὸν ἐν νυκτὶ καὶ ἡμέρᾳ ἐπιβαλλόμενον
  choice: die im Wechsel von Nacht und Tag in schöner Weise hervortritt
  rationale: καλόν hat hier eine ästhetisch-positive Färbung. ἐπιβαλλόμενον beschreibt poetisch das Eintreten oder Sich-Geltendmachen in Nacht und Tag; „im Wechsel ... hervortritt“ gibt den wiederkehrenden zeitlichen Rhythmus natürlich wieder, ohne ihn technisch zu erklären.
- source_word: ὑπὸ τοῦ χαριζομένου πᾶσιν, οἷς ἂν αὐτὸς θελήσῃ
  choice: unter dem Wirken dessen, der allen, denen er selbst es schenken will, Schlaf gewährt
  rationale: ὑπό bezeichnet hier den Urheber beziehungsweise Bewirker. χαρίζομαι betont freies, gnädiges Gewähren; „Schlaf“ wird aus dem unmittelbaren Zusammenhang als ausgelassenes Objekt ergänzt. „er selbst“ erhält die Betonung von αὐτός.
- source_word: ὕπνον μέρος
  choice: einen Teil Schlaf
  rationale: μέρος bedeutet wörtlich „Teil“ oder „Anteil“. Die bewusst konkrete und ungewöhnliche Bildsprache des Griechischen bleibt erhalten.
- source_word: ἀπέστειλεν εἰς τὸν βασιλέα
  choice: sandte dem König
  rationale: Das griechische εἰς bedeutet wörtlich „zu/in ... hinein“; beim Senden von Schlaf ist der deutsche Dativ idiomatisch und bewahrt die personifizierende Handlung.
theological_decisions:
- issue: Unausgesprochener Gottesbezug in τοῦ χαριζομένου
  choice: dessen, der ... Schlaf gewährt
  alternative: Gottes, der ... Schlaf gewährt
  rationale: Der Zusammenhang weist auf Gott als Geber des Schlafes, doch der griechische Text nennt ihn hier nicht ausdrücklich. Die substantivierte Umschreibung erhält diesen indirekten Gottesbezug und vermeidet einen ergänzten Titel.
- issue: Bedeutung von ἀπʼ αἰῶνος
  choice: seit alters bestehend
  alternative: von Ewigkeit her
  rationale: Die Wendung kann hohes Alter oder lange Dauer ausdrücken. „Seit alters“ vermeidet die stärkere dogmatische Aussage, die Zeitordnung bestehe im metaphysischen Sinn von Ewigkeit her.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst poetischer Satzführung. Die Personifikation der Zeitordnung und die ungewöhnliche Wendung „einen Teil Schlaf“ bleiben erhalten; erläuternde Fußnoten sichern die formnähere Alternative.
