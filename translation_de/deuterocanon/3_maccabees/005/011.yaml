    rationale: κτίσμα ist poetisch und in dieser Verbindung schwer eindeutig zu bestimmen. Die Anmerkung sollte die Übersetzungsentscheidung erläutern, ohne die Deutung als alleinigen Sinn festzuschreiben.
  - severity: low
    issue: „einen Teil Schlaf“ wirkt im modernen Deutschen unnötig hart.
    rationale: „Einen Anteil Schlaf“ bewahrt μέρος als Teilmenge und ist zugleich verständlicher.
