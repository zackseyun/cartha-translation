    issue: „gemeinsam“ für ὁμοῦ
    rationale: ὁμοῦ bezeichnet in dieser Verbindung am ehesten ein zeitliches Zusammenfallen bzw. ein Handeln „auf einmal“, nicht notwendig ein gemeinschaftliches Handeln. „So gemeinsam“ ist daher weniger präzise.
  - severity: low
    issue: „Denn sie meinten“
    rationale: δοξαντες ist ein begleitendes bzw. begründendes Partizip, aber das explizite „Denn“ legt eine Begründungsrelation stärker fest als der griechische Text.
  - severity: low
    issue: „Diener“ und die Umschreibung der Sicherung
    rationale: λειτουργοί sind hier ausführende Bedienstete/Funktionäre. „Bedienstete“ vermeidet die potenziell irreführende private oder kultische Nuance von „Diener“. „Sie ersannen ... Sicherungsmaßnahmen“ bildet ἐμηχανῶντο und ἀσφάλεια unmittelbarer ab.
