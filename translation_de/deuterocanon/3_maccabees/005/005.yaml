base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/005.yaml
  text: And in addition[a], the attendants, going out at evening, bound the hands of those who were suffering, and contrived the rest of the nighttime security concerning them[b], thinking that they would together bring the race to the end of destruction.
translation:
  language: de
  text: Außerdem gingen die Bediensteten gegen Abend hinaus, banden den Leidenden die Hände und ersannen weitere Maßnahmen zu ihrer Sicherung über Nacht; sie meinten, das jüdische Volk[a] auf einmal bis zur völligen Vernichtung[b] bringen zu können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „das Geschlecht“ oder „der Volksstamm“; gemeint ist das jüdische Volk als Ganzes.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „bis zum Ende (oder: Ziel) der Vernichtung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε πρὸς τούτοις λειτουργοὶ
  choice: Außerdem ... die damit beauftragten Diener
  rationale: πρὸς τούτοις wird additiv als „außerdem“ verstanden; λειτουργοί bezeichnet hier im Auftrag handelnde Bedienstete, nicht kultische Amtsträger.
- source_word: κατὰ τὴν ἑσπέραν
  choice: gegen Abend
  rationale: Die Wendung bezeichnet die Zeit um den Abend herum; „gegen Abend“ ist natürlich und wahrt die mögliche zeitliche Annäherung.
- source_word: τὰς τῶν ταλαιπωρουμένων ... χεῖρας
  choice: den Leidenden die Hände
  rationale: ταλαιπωρουμένων bezeichnet die gequälten, notleidenden Menschen; die deutsche Dativkonstruktion ist idiomatisch.
- source_word: ἐδέσμευον
  choice: banden
  rationale: Direkte Wiedergabe des Bindens oder Fesselns.
- source_word: τὴν ... λοιπὴν ... ἀσφάλειαν ἔννυχον ... ἐμηχανῶντο
  choice: trafen die übrigen Vorkehrungen, um sie über Nacht sicher zu bewachen
  rationale: Die gedrängte griechische Formulierung meint weitere planvoll getroffene nächtliche Sicherungsmaßnahmen. Die Übersetzung macht den praktischen Sinn verständlich, ohne ein bloßes Sicherheitsgefühl anzudeuten.
- source_word: δοξαντες
  choice: Denn sie meinten
  rationale: Das Partizip nennt ihre Annahme beziehungsweise Erwartung; ein neuer Hauptsatz ist im Deutschen klar und flüssig.
- source_word: ὁμοῦ λήμψεσθαι ... πέρας
  choice: sie würden so gemeinsam ... bis ... bringen
  rationale: Die Verbindung ist idiomatisch schwierig. Im Kontext bezeichnet sie das gemeinsame Herbeiführen beziehungsweise Erreichen des Endpunkts; „bringen“ gibt den zielgerichteten Gedanken verständlich wieder.
- source_word: τὸ φύλον
  choice: das jüdische Volk
  rationale: φῦλον bezeichnet hier die gesamte ethnische Gemeinschaft der Juden. „Volk“ ist im heutigen Deutsch klarer und weniger missverständlich als „Rasse“ oder das zu enge „Stamm“.
- source_word: πέρας τῆς ὀλεθρίας
  choice: bis zur völligen Vernichtung
  rationale: Wörtlich steht „bis zum Ende/Ziel der Vernichtung“. Gemeint ist das vollständige Zu-Ende-Führen des Verderbens; die gewählte Formulierung ist natürlich, während die wörtlichere Struktur in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Kollektive Bezeichnung τὸ φύλον
  choice: das jüdische Volk
  alternative: das Geschlecht / der Volksstamm
  rationale: Der Ausdruck bezeichnet die verfolgte jüdische Gemeinschaft als Ganzes. „Volk“ bewahrt den kollektiven ethnischen Bezug, ohne moderne biologistische Vorstellungen einzutragen.
- issue: Zielvorstellung πέρας τῆς ὀλεθρίας
  choice: völlige Vernichtung
  alternative: Ende/Ziel der Vernichtung
  rationale: Die natürliche deutsche Wiedergabe verdeutlicht die beabsichtigte vollständige Auslöschung, während die ungewöhnliche Genitivverbindung nicht als Aussage über ein bloßes Aufhören der Vernichtung missverstanden wird.
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. „Damit beauftragte Diener“ vermeidet den kultischen Klang von „Diener“ ohne Kontext; die komprimierte griechische Sicherungsformel wird maßvoll entfaltet. Sämtliche Fußnotenmarker stehen im Haupttext.
