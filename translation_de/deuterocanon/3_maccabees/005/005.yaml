revisions:
- from: Außerdem gingen die damit beauftragten Diener gegen Abend hinaus, banden den Leidenden die Hände und trafen die übrigen Vorkehrungen, um sie über Nacht sicher zu bewachen. Denn sie meinten, sie würden so gemeinsam das jüdische Volk[a] bis zur völligen Vernichtung[b] bringen.
  to: Außerdem gingen die Bediensteten gegen Abend hinaus, banden den Leidenden die Hände und ersannen weitere Maßnahmen zu ihrer Sicherung über Nacht; sie meinten, das jüdische Volk[a] auf einmal bis zur völligen Vernichtung[b] bringen zu können.
  rationale: Die Revision setzt ὁμοῦ mit „auf einmal“ zeitlich um, vermeidet die unnötig explizite Kausalpartikel und gibt die von ἐμηχανῶντο bezeichnete planvolle Ausarbeitung der nächtlichen Sicherung unmittelbarer wieder. Die kollektiv-ethnische Bezeichnung und die Aussage über die beabsichtigte Vernichtung bleiben unverändert im Sinn des Ausgangstextes.
