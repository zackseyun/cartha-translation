  source_fidelity: 'Die Satzglieder und die Grundbedeutung sind zutreffend wiedergegeben: Ἕρμων ist der ἐλεφαντάρχης, τὸ προσταγέν ist der Befehl/das Befohlene, und συνετέλει bezeichnet dessen Ausführung. »Gewissenhaft« verlagert ἀραρότως jedoch in Richtung einer inneren Haltung bzw. Sorgfalt des Ausführenden. Das griechische, seltene Adverb bezeichnet hier eher eine feste, genaue oder ordnungsgemäße Ausführung.'
