translation:
  language: de
  text: Hermon, der Befehlshaber der Elefanten[a], führte den Befehl genau[b] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Elefantenkommandant« oder »Elefantenoffizier«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ordnungsgemäß«, »zuverlässig« oder »mit fester Entschlossenheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: Elefantenkommandant
  rationale: Das Kompositum bezeichnet den für die Elefanten zuständigen Befehlshaber. »Elefantenkommandant« ist im Deutschen knapp, verständlich und bildet die besondere Amtsfunktion genauer ab als das allgemeinere »Offizier«.
- source_word: τὸ προσταγὲν
  choice: den Befehl
  rationale: Der substantivierte neutrale Partizipialausdruck bedeutet wörtlich »das Befohlene«. Im Deutschen gibt »den Befehl« den administrativ-militärischen Sinn natürlich wieder.
- source_word: ἀραρότως
  choice: gewissenhaft
  rationale: Das Adverb kann Festigkeit, Zuverlässigkeit, ordnungsgemäße Ausführung oder Genauigkeit ausdrücken. Im Zusammenhang mit der Ausführung eines Befehls vermittelt »gewissenhaft« die zuverlässige und genaue Erledigung, ohne den seltenen Ausdruck zu eng festzulegen.
- source_word: συνετέλει
  choice: führte … aus
  rationale: Das Verb bezeichnet hier das vollständige Ausführen beziehungsweise Zuendebringen des Angeordneten. »Einen Befehl ausführen« ist die natürliche deutsche Verbindung.
- source_word: Ἕρμων
  choice: Hermon
  rationale: Der Personenname wird in der im Deutschen naheliegenden Form »Hermon« wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: Die nachgestellte Konjunktion markiert einen fortführenden oder leicht kontrastierenden Übergang. Die deutsche Stellung »Hermon aber« wahrt diese Funktion, wobei je nach Kontext auch »und« möglich ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung »Hermon aber« bewahrt den griechischen Übergang, während »führte den Befehl … aus« idiomatisch bleibt. Die seltene Amtsbezeichnung wird transparent als »Elefantenkommandant« wiedergegeben; die Bedeutungsbreite des seltenen Adverbs bleibt in der Fußnote sichtbar.
