lexical_decisions:
- source_word: οὐ μὴν δὲ ἀλλὰ καὶ
  choice: Doch zugleich ... auch
  rationale: Die gehäufte griechische Verknüpfung markiert einen nachdrücklichen Übergang. Die deutsche Formulierung wahrt sowohl den Gegensatz als auch das additive καί, ohne unnatürlich redundant zu klingen.
- source_word: τὰς ἔμπροσθεν αὐτῶν γεγενημένας ἀντιλήψεις
  choice: die früheren Hilfen, die ihnen ... zuteilgeworden waren
  rationale: ἀντιλήψεις bezeichnet konkrete Hilfen oder Beistandsleistungen; ἔμπροσθεν und γεγενημένας verweisen rückblickend auf bereits erfahrene Hilfe. Der Plural wird im Deutschen bewahrt.
- source_word: ἐξ οὐρανοῦ
  choice: vom Himmel
  rationale: Die Formulierung gibt den griechischen Ausdruck direkt wieder und lässt die implizierte göttliche Herkunft erkennen, ohne einen im Ausgangstext nicht ausdrücklich genannten Handelnden einzufügen.
- source_word: συνιδόντες
  choice: erkannten sie
  rationale: Das Verb bezeichnet hier nicht bloß optisches Sehen, sondern gemeinsames Wahrnehmen beziehungsweise Erfassen. „Erkannten“ passt natürlich zum Rückblick auf frühere Hilfen.
- source_word: πρηνεῖς ὁμοθυμαδὸν ῥίψαντες ἑαυτούς
  choice: Einmütig warfen sie sich mit dem Gesicht zu Boden
  rationale: „Einmütig“ gibt die vereinte Haltung von ὁμοθυμαδόν wieder; „mit dem Gesicht zu Boden“ macht die durch πρηνεῖς bezeichnete Bauch- beziehungsweise Gesichtslage anschaulich und würdig verständlich.
- source_word: τὰ νήπια χωρίσαντες τῶν μαστῶν
  choice: nahmen die Säuglinge von den Brüsten
  rationale: νήπια sind im Stillkontext Säuglinge. „Von den Brüsten nehmen“ wahrt das konkrete Bild, ohne „Mütter“ zu ergänzen oder mit „wegreißen“ eine stärkere Gewaltsamkeit einzutragen.
theological_decisions:
- issue: Soll die Hilfe vom Himmel ausdrücklich Gott zugeschrieben werden?
  choice: vom Himmel
  alternative: von Gott / vom Herrn im Himmel
  rationale: Der griechische Text nennt ausdrücklich nur den Himmel. Die göttliche Herkunft ist im Kontext nahegelegt, soll aber nicht durch einen ergänzten Gottesnamen vereindeutigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde für natürliche deutsche Lesbarkeit in zwei Sätze gegliedert. Die Hilfen bleiben im Plural; die Herkunft „vom Himmel“ und das drastische Bild der von den Brüsten genommenen Säuglinge werden ohne konfessionelle oder erklärende Zusätze bewahrt.
