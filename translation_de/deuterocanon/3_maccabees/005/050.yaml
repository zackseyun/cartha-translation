  text: Yet nevertheless[a], when they also saw the help from heaven that had come to them before, they all together threw themselves down face-first, and separated the infants from the breasts[b],
translation:
  language: de
  text: Doch als sie auch die früheren Hilfen erkannten, die ihnen vom Himmel zuteilgeworden waren,[a] warfen sie sich alle einmütig mit dem Gesicht zu Boden und trennten die Säuglinge von den Brüsten,[b]
