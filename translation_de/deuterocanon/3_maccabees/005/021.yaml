  text: And when the king had spoken, all who were present gladly agreed together with joy, and each departed to his own house.
translation:
  language: de
  text: Nachdem der König gesprochen hatte, stimmten alle Anwesenden freudig und voller Freude einmütig zu, und jeder ging in sein eigenes Haus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσμένως
  choice: bereitwillig
  rationale: Gibt die freudige Bereitschaft wieder, ohne die unmittelbar folgende Wendung μετὰ χαρᾶς unnötig zu verdoppeln.
- source_word: ὁμοῦ συναινέσαντες
  choice: gemeinsam zu
  rationale: Bewahrt sowohl den gemeinsamen Vollzug (ὁμοῦ) als auch den zustimmenden Sinn von συναινέω.
- source_word: ἀνέλυσε
  choice: kehrte ... zurück
  rationale: Im Kontext bezeichnet das Verb das Aufbrechen beziehungsweise Zurückkehren nach Hause; die deutsche Wendung klingt natürlich und wahrt das Ziel εἰς τὸν ἴδιον οἶκον.
