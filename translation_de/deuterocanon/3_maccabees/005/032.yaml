  text: Yet[a], if it were not for your affection because of the gathering together and the necessity[b], you would have been deprived of life instead of these things.
translation:
  language: de
  text: 'Und doch: Wären da nicht die Zuneigung zur Zusammenkunft[a] und die Notwendigkeit[b], wäre dir statt dieser Dinge das Leben genommen worden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Zuneigung der Zusammenkunft“. Das griechische συστροφή kann eine Zusammenkunft, Ansammlung oder dicht gedrängte Menge bezeichnen. Die Beziehung des Ausdrucks „Zuneigung zur Zusammenkunft“ bleibt im Griechischen nicht näher bestimmt.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische χρεία kann „Bedarf“, „Notwendigkeit“ oder, je nach Zusammenhang, „Nutzen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ εἰ μή
  choice: Und doch … wenn nicht
  rationale: καίπερ trägt einen konzessiven Gedanken, während εἰ μή die Ausnahme beziehungsweise irreale Bedingung einführt. Die geteilte deutsche Formulierung gibt beides natürlich wieder.
- source_word: τὴν τῆς συστροφῆς στοργήν
  choice: die Zuneigung aufgrund unseres vertrauten Umgangs
  rationale: στοργή bezeichnet Zuneigung oder persönliche Verbundenheit. συστροφή kann zwar eine Ansammlung bezeichnen, meint im Zusammenhang der persönlichen Anrede aber wahrscheinlich den engen Umgang beziehungsweise die Gemeinschaft miteinander. „Unseres“ verdeutlicht den im Kontext vorausgesetzten gemeinsamen Umgang, ohne die Zuneigung ausdrücklich einer bestimmten Person zuzuschreiben.
- source_word: καὶ τῆς χρείας
  choice: und deiner Dienste
  rationale: χρεία kann Notwendigkeit, Bedarf, Nutzen oder geleisteten Dienst bezeichnen. In der Begründung dafür, weshalb der Angeredete verschont wird, passt „Dienste“ am besten; die lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: τὸ ζῆν … ἐστερήθης
  choice: wäre dir … das Leben genommen worden
  rationale: Der substantivierte Infinitiv τὸ ζῆν bezeichnet hier das Leben; das Passiv von στερέω drückt den Entzug aus. Die deutsche Passivkonstruktion bewahrt sowohl Form als auch Härte der Aussage.
- source_word: ἀντὶ τούτων
  choice: anstelle dieser Menschen
  rationale: ἀντί bezeichnet den Austausch oder die Stellvertretung. Das pluralische τούτων verweist im Kontext auf die bedrohten Menschen; die explizite Wiedergabe verhindert das im Deutschen unklare „dieser Dinge“.
