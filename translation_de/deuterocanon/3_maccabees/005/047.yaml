  to: Doch er erfüllte sein gottloses Denken mit heftigem Zorn und stürmte mit ganzer Wucht zusammen mit den wilden Tieren hinaus, um unberührten Herzens[a] mit eigenen Augen[b] den qualvollen und elenden Untergang derer zu sehen, die gekennzeichnet worden waren.
  rationale: Die Revision ersetzt die sperrige Nominalform „gottloses Sinnen“ durch „gottloses Denken“, glättet die Wiedergabe von θεάσασθαι und verbindet die Aussage als deutschen Zweckzusammenhang. Die Reihenfolge, die Bildlichkeit des unverwundeten Herzens, die religiöse Nuance von δυσσεβής und die Fußnotenanker bleiben erhalten.
