base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/047.yaml
  text: But he[a], filled with heavy wrath and impious in mind, rushed out with all his force along with the beasts[b], wanting with unfeeling heart and with the pupils of his eyes to look upon the painful and miserable destruction of those who had been marked out.
translation:
  language: de
  text: Doch er erfüllte sein gottloses Denken mit heftigem Zorn und stürmte mit ganzer Wucht zusammen mit den wilden Tieren hinaus, um unberührten Herzens[a] mit eigenen Augen[b] den qualvollen und elenden Untergang derer zu sehen, die gekennzeichnet worden waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unverwundeten“ oder „undurchbohrten Herzens“; wahrscheinlich ist ein Herz gemeint, das von Mitleid unberührt bleibt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit den Pupillen seiner Augen“. Die betonte Formulierung besagt, dass er es persönlich und unmittelbar sehen wollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργῇ βαρείᾳ γεμίσας δυσσεβῆ φρένα
  choice: erfüllte sein gottloses Sinnen mit heftigem Zorn
  rationale: 'Die Satzglieder werden gemäß der griechischen Konstruktion verbunden: Das gottlose Denken bzw. Sinnen ist das von schwerem, heftigem Zorn Erfüllte. „Gottlos“ bewahrt die religiöse Bedeutung von δυσσεβής; „Sinnen“ gibt φρένα als innere Denk- und Willenshaltung wieder.'
- source_word: παντὶ τῷ βάρει
  choice: mit ganzer Wucht
  rationale: Die Wendung bezeichnet hier die volle Schwere oder Kraft der Bewegung. „Mit ganzer Wucht“ ist im Deutschen anschaulich und idiomatisch.
- source_word: σὺν τοῖς θηρίοις
  choice: zusammen mit den wilden Tieren
  rationale: θηρία bezeichnet im Zusammenhang die zur Tötung eingesetzten gefährlichen Tiere. „Wilde Tiere“ wahrt den bedrohlichen Sinn ohne das altertümliche „Bestien“ vorauszusetzen.
- source_word: ἐξώρμησε
  choice: stürmte … hinaus
  rationale: Das Verb beschreibt eine plötzliche, kraftvolle Bewegung nach draußen.
- source_word: ἀτρώτῳ καρδίᾳ
  choice: unberührten Herzens
  rationale: ἀτρώτος bedeutet wörtlich „unverwundet“ oder „undurchbohrt“. „Unberührt“ lässt das Bild eines von Mitleid nicht erreichten Herzens erkennen, ohne diese Deutung vollständig in den Haupttext einzutragen.
- source_word: κόραις ὀφθαλμῶν
  choice: mit eigenen Augen
  rationale: Wörtlich sind die „Pupillen der Augen“ gemeint. Die natürliche deutsche Wendung bewahrt den Nachdruck des persönlichen, unmittelbaren Sehens; die konkrete Ausdrucksweise wird in der Fußnote genannt.
- source_word: τὴν ἐπίπονον καὶ ταλαίπωρον … καταστροφήν
  choice: den qualvollen und elenden Untergang
  rationale: 'Die doppelte Charakterisierung der Katastrophe bleibt erhalten: ἐπίπονος hebt das Schmerzvolle, ταλαίπωρος das Elende und Jammervolle hervor.'
- source_word: τῶν προσεσημαμμένων
  choice: derer, die gekennzeichnet worden waren
  rationale: Das Perfektpartizip bezeichnet Menschen, die bereits zuvor markiert oder bestimmt worden waren. Die Formulierung wahrt das Passiv und die zeitliche Vorordnung.
theological_decisions:
- issue: Religiös-moralische Bedeutung von δυσσεβῆ
  choice: gottloses Sinnen
  alternative: böses Denken; frevelhafte Gesinnung
  rationale: δυσσεβής bezeichnet nicht bloß allgemeine Bosheit, sondern mangelnde Ehrfurcht gegenüber Gott. „Gottlos“ erhält diese Dimension, ohne eine weitergehende konfessionelle Deutung einzutragen.
- issue: Deutung von ἀτρώτῳ καρδίᾳ
  choice: unberührten Herzens mit erklärender Fußnote
  alternative: unverwundeten Herzens; gefühllosen Herzens
  rationale: Die griechische Metapher kann ein unverwundetes beziehungsweise von Mitleid unberührtes Herz bezeichnen. Der Haupttext bleibt bildhaft und mehrdeutig; die Fußnote erläutert den wahrscheinlichen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verbessert die Verständlichkeit, ohne die inhaltliche Abfolge zu verändern. Bildhafte oder ungewöhnliche griechische Wendungen werden entweder behutsam bewahrt oder durch unmittelbar zugeordnete Fußnoten transparent gemacht.
