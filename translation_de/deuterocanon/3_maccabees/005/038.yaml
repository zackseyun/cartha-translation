  yaml_path: translation/deuterocanon/3_maccabees/005/038.yaml
  text: Arm the elephants even now for tomorrow[b][a], for the destruction of the Jews.
translation:
  language: de
  text: Rüste die Elefanten noch jetzt für morgen aus, zur Vernichtung[b] der Juden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Judäer“; hier ist jedoch wahrscheinlich die jüdische Volks- und Religionsgemeinschaft gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Auslöschung“. Das griechische Substantiv kann völlige Vernichtung oder Beseitigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθόπλισον
  choice: rüste … aus
  rationale: Der Aoristimperativ verlangt das militärische Ausrüsten beziehungsweise Kampfbereitmachen der Elefanten. „Rüste … aus“ ist im Deutschen knapp, natürlich und sachlich.
- source_word: ἔτι καὶ νῦν
  choice: noch jetzt
  rationale: Die Wendung unterstreicht die Dringlichkeit und bezeichnet, dass die Vorbereitung bereits jetzt erfolgen soll, ohne sie ausdrücklich als „sofort“ zu deuten.
- source_word: εἰς τὴν αὔριον
  choice: für morgen
  rationale: Die Präpositionalwendung bezeichnet den morgigen Tag als Zielpunkt der jetzigen Vorbereitung; „für morgen“ gibt dies idiomatisch wieder.
- source_word: ἐπὶ τὸν … ἀφανισμόν
  choice: zur Vernichtung
  rationale: ἀφανισμός kann weitgehende Zerstörung, Auslöschung oder Vernichtung bezeichnen. „Vernichtung“ bewahrt die starke Aussage und die nominale Form des Griechischen.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Im diasporajüdischen Zusammenhang des Buches bezeichnet Ἰουδαῖοι die ethnisch-religiöse Gemeinschaft und nicht lediglich Bewohner Judäas.
theological_decisions:
- issue: Bedeutung von Ἰουδαῖοι im hellenistischen Diasporakontext
  choice: Juden
  alternative: Judäer
  rationale: Der Zusammenhang zielt auf die jüdische Volks- und Religionsgemeinschaft unter ptolemäischer Herrschaft, nicht auf eine ausschließlich geografische Herkunftsbezeichnung.
- issue: Stärke von ἀφανισμός
  choice: Vernichtung
  alternative: Auslöschung
  rationale: „Vernichtung“ lässt die Reichweite des griechischen Substantivs bestehen, ohne sie abzuschwächen; „Auslöschung“ hebt den Gedanken völliger Beseitigung noch stärker hervor.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der knappen Befehlsform des Griechischen; „noch jetzt“ bewahrt dessen Nachdruck, und die Zweckangabe bleibt als Substantivalkonstruktion erhalten.
