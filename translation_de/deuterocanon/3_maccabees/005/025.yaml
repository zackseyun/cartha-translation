base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/025.yaml
  text: But the Jews[a], as the indivisible time drew them together in soul, stretched out their hands to heaven and, with mournful songs, offered a tearful plea, begging the greatest God to help them again without delay.
translation:
  language: de
  text: 'Die Juden aber waren während dieser ungeteilten Zeit innerlich miteinander vereint[a]. Sie streckten die Hände zum Himmel aus und brachten unter klagenden Gesängen eine tränenreiche Bitte vor: Sie flehten den größten Gott an, ihnen erneut unverzüglich zu helfen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „während dieser ununterbrochenen Zeit wie eine Seele vereint“. Der griechische Ausdruck ist ungewöhnlich und verbindet einen ungeteilten Zeitraum mit der inneren Einheit der Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμερῆ
  choice: ungeteilten
  rationale: Das Adjektiv bedeutet wörtlich „nicht geteilt“ und beschreibt hier die Zeit als einen ununterbrochenen, zusammenhängenden Zeitraum. „Ungeteilt“ bewahrt die ungewöhnliche Ausdrucksweise des Griechischen.
- source_word: ψυχοκοινούμενοι
  choice: innerlich miteinander vereint
  rationale: Das seltene Kompositum bezeichnet eine Gemeinsamkeit oder Vereinigung auf der Ebene der Seele beziehungsweise des inneren Lebens. Die Wiedergabe ist im Deutschen verständlich, ohne das ungewöhnliche Bild übermäßig festzulegen.
- source_word: πολυδάκρυν ἱκετίαν
  choice: eine tränenreiche Bitte
  rationale: Die Bitte ist von vielen Tränen geprägt. „Tränenreich“ erhält die emotionale Stärke und klingt zugleich würdig und natürlich.
- source_word: ἐν μέλεσιν γοεροῖς
  choice: unter klagenden Gesängen
  rationale: μέλη kann Lieder, Gesänge oder Weisen bezeichnen; γοερός kennzeichnet sie als klagend oder trauervoll.
- source_word: τείνοντες τὰς χεῖρας εἰς τὸν οὐρανόν
  choice: Sie streckten die Hände zum Himmel aus
  rationale: Die Formulierung gibt die im Text beschriebene Gebetshaltung und ihre aufwärts gerichtete Bewegung unmittelbar wieder.
- source_word: ἐδέοντο
  choice: sie flehten ... an
  rationale: Das Verb bezeichnet eine eindringliche, dringliche Bitte und passt zum verzweifelten Ton der Szene.
- source_word: τοῦ μεγίστου θεοῦ
  choice: den größten Gott
  rationale: Der griechische Superlativ μέγιστος bedeutet unmittelbar „der größte“. Diese Wiedergabe vermeidet es, stattdessen den traditionellen, aber lexikalisch weniger direkten Titel „der höchste Gott“ einzusetzen.
- source_word: πάλιν
  choice: erneut
  rationale: Das Adverb bittet um ein weiteres göttliches Eingreifen und deutet damit auf bereits erfahrene Hilfe zurück.
- source_word: συντόμως
  choice: unverzüglich
  rationale: Im Gebetszusammenhang bezeichnet das Adverb rasches, promptes Handeln. „Unverzüglich“ bringt die Dringlichkeit klar zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von τοῦ μεγίστου θεοῦ
  choice: den größten Gott
  alternative: den höchsten Gott; den erhabendsten Gott
  rationale: Der Ausgangstext verwendet einen Superlativ zu μέγας („groß“) und nicht die übliche Formulierung für „der Höchste“. Die direkte Wiedergabe bewahrt diesen Unterschied, auch wenn „der höchste Gott“ im Deutschen vertrauter klingt.
- issue: Art der inneren Einheit in ψυχοκοινούμενοι
  choice: innerlich miteinander vereint
  alternative: wie eine Seele vereint; im Geist vereint
  rationale: Der seltene Ausdruck spricht von gemeinsamer Einheit auf der Ebene der ψυχή, legt aber keine präzise dogmatische Bedeutung von „Geist“ oder „Seele“ fest. Die gewählte Formulierung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Verbindung von ungeteilter Zeit und innerer Gemeinschaft wird im Haupttext verständlich wiedergegeben und in der Fußnote in ihrer Bildhaftigkeit offengehalten. Die Satzgliederung in zwei Sätze verhindert eine schwer verständliche Häufung von Partizipien, ohne inhaltliche Elemente auszulassen.
