  yaml_path: translation/deuterocanon/3_maccabees/005/008.yaml
  text: to turn back the unholy plan against them[a], and to rescue them with a magnificent manifestation from the death ready at their feet.
translation:
  language: de
  text: den gegen sie gerichteten frevelhaften Plan umzukehren und sie durch eine machtvolle Erscheinung[a] aus dem Tod zu retten, der schon zu ihren Füßen bereitlag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ein herrliches Erscheinen“ oder „durch ein majestätisches Eingreifen“. Das griechische Wort kann eine eindrucksvolle Erscheinung bezeichnen, besonders als Ausdruck göttlicher Hilfe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστρέψαι
  choice: umzukehren
  rationale: Das Verb bezeichnet hier die Umkehrung beziehungsweise Abwendung des feindlichen Plans. „Umzukehren“ bewahrt diese Bewegungsrichtung, ohne lediglich das Ergebnis als Vereitelung auszudrücken.
- source_word: βουλὴν ἀνοσίαν
  choice: frevelhaften Plan
  rationale: „Plan“ gibt βουλή im Kontext klar und gegenwartsnah wieder. „Frevelhaft“ bewahrt bei ἀνόσιος sowohl die moralische Verwerflichkeit als auch den religiösen Bezug.
- source_word: ῥύσασθαι
  choice: zu retten
  rationale: Das Verb bezeichnet die Befreiung aus einer unmittelbar drohenden tödlichen Gefahr. „Retten“ ist im modernen Deutschen natürlich und präzise.
- source_word: μεγαλομεροῦς ἐπιφανείας
  choice: durch eine machtvolle Erscheinung
  rationale: „Erscheinung“ erhält den Bedeutungsaspekt des sichtbaren oder eindrucksvollen Hervortretens in ἐπιφάνεια; „machtvoll“ gibt die außergewöhnliche Größe und Erhabenheit von μεγαλομερής wieder, ohne die Art des göttlichen Handelns genauer festzulegen.
- source_word: μόρου
  choice: Tod
  rationale: μόρος kann Verhängnis oder Todesgeschick bezeichnen; angesichts der unmittelbar drohenden Gefahr ist „Tod“ die klare und konkrete Wiedergabe.
- source_word: παρὰ πόδας ἐν ἑτοίμῳ
  choice: der schon zu ihren Füßen bereitlag
  rationale: Die Formulierung bewahrt das anschauliche räumliche Bild des Griechischen und vermittelt zugleich die unmittelbare Nähe der Todesgefahr.
theological_decisions:
- issue: Bedeutung von ἐπιφάνεια im Zusammenhang
  choice: machtvolle Erscheinung
  alternative: majestätisches Eingreifen; herrliches Erscheinen
  rationale: Im Zusammenhang wird die Rettung Gottes außergewöhnlichem Handeln zugeschrieben. „Erscheinung“ wahrt den Aspekt eines eindrucksvollen Hervortretens, ohne festzulegen, in welcher sichtbaren oder unsichtbaren Weise Gott eingreift.
translation_notes:
  register: Moderner, würdevoller Gebetsstil. Die Satzform bleibt als Infinitivfügung erhalten, weil der vorgelegte Vers im Griechischen syntaktisch an den vorausgehenden Zusammenhang anschließt. Das Bild vom unmittelbar zu den Füßen bereitliegenden Tod wird bewusst nicht geglättet.
