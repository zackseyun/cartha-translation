lexical_decisions:
- source_word: οὔπω δὲ ἡλίου βολαὶ κατεσπείροντο
  choice: Noch hatten sich die Strahlen der Sonne nicht ausgebreitet
  rationale: Gibt οὔπω mit dem Imperfekt narrativ als noch nicht eingetretenen Vorgang wieder; βολαί bezeichnet bei der Sonne ihre Strahlen, während κατεσπείροντο bildhaft deren Ausbreitung ausdrückt.
- source_word: τοῦ βασιλέως τοὺς φίλους ἐκδεχόμενον
  choice: Während der König seine Freunde empfing
  rationale: Die Akkusativkonstruktion bezieht sich auf den König; ἐκδέχομαι kann »erwarten« oder »empfangen« bedeuten. Im höfischen Zusammenhang ist »empfangen« natürlich, ohne die mögliche Amtssprache von φίλοι zu verdecken.
- source_word: ὁ Ἕρμων παραστὰς
  choice: trat Hermon heran
  rationale: Das Aoristpartizip παραστάς schildert Hermons Herantreten beziehungsweise Erscheinen in der Situation.
- source_word: ἐπικαλεῖ πρὸς τὴν ἔξοδον
  choice: rief sie zum Aufbruch
  rationale: Die kompakte griechische Wendung bezeichnet einen Ruf beziehungsweise eine Aufforderung zum Hinausgehen oder Aufbrechen; das im Deutschen ergänzte »sie« erschließt sich aus den Anwesenden, bleibt aber durch eine Fußnote kenntlich.
- source_word: ὑποδεικνὺς
  choice: dabei wies er darauf hin
  rationale: Gibt die begleitende Erläuterung oder Begründung des Rufes idiomatisch wieder.
- source_word: τὸ πρόθυμον τοῦ βασιλέως ἐν ἑτοίμῳ κεῖσθαι
  choice: dass der Eifer des Königs bereitstand
  rationale: Bewahrt die substantivische Form τὸ πρόθυμον und die ungewöhnliche Spannung der Aussage. »Eifer« erfasst die motivationale Bedeutung, während »bereitstand« die Bereitschaftsformel ἐν ἑτοίμῳ κεῖσθαι knapp wiedergibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz wahrt das poetische Lichtbild; die höfische Bedeutung von »Freunde« und das implizite Objekt des Rufes werden in Fußnoten erläutert. Die auffällige Formulierung über den bereitstehenden Eifer wird nicht stillschweigend geglättet.
