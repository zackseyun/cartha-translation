  text: But the sun’s rays had not yet spread out[a], and while the king was receiving his friends, Hermon came forward and summoned them to the departure[b], pointing out that the king’s eagerness was in readiness.
translation:
  language: de
  text: Noch hatten sich die Strahlen der Sonne nicht ausgebreitet. Während der König seine Freunde[a] empfing, trat Hermon heran und rief sie zum Aufbruch[b]; dabei wies er darauf hin, dass der König dazu bereit und entschlossen war.
