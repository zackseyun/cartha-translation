  text: He ordered that[a], by the coming day, all the elephants—five hundred in number—be given drink with generous draughts of frankincense and much unmixed wine, and that, once made savage by the abundant supply of drink, they be brought in for the destruction of the Jews.
translation:
  language: de
  text: Er befahl, bis zum kommenden Tag alle Elefanten – fünfhundert an der Zahl – mit reichlichen Portionen Weihrauch und viel unverdünntem Wein zu tränken und sie, nachdem sie durch die überreiche Gabe des Getränks wild gemacht worden waren, hineinzuführen, um den Juden ihr Verderben zu bringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »zur Begegnung mit dem Verderben der Juden«. Das griechische Wort kann auch »Verhängnis« oder »Tod« bedeuten; gemeint ist der beabsichtigte Untergang der Juden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: Er befahl
  rationale: Gibt den verbindlichen Befehl des Aorists von κελεύω knapp und würdig wieder.
- source_word: ὑπὸ τὴν ἐρχομένην ἡμέραν
  choice: bis zum kommenden Tag
  rationale: Bewahrt den vorwärtsgerichteten zeitlichen Sinn der griechischen Wendung in natürlichem Deutsch.
- source_word: δαψιλέσι δράκεσι λιβανωτοῦ
  choice: mit reichlichen Portionen Weihrauch
  rationale: δαψιλέσι bezeichnet die reiche Menge; δράκεσι meint hier bemessene Portionen. λιβανωτός wird spezifisch als Weihrauch wiedergegeben.
- source_word: οἴνῳ πλείονι ἀκράτῳ
  choice: viel unverdünntem Wein
  rationale: ἀκράτῳ bezeichnet ungemischten, nicht mit Wasser verdünnten Wein; πλείονι hebt die große Menge hervor.
- source_word: ὄντας τὸν ἀριθμὸν πεντακοσίους
  choice: fünfhundert an der Zahl
  rationale: Entspricht der erklärenden, leicht formellen Zählangabe des griechischen Partizipialsatzes.
- source_word: ἀγριωθέντας
  choice: wild gemacht
  rationale: 'Bewahrt die passive und kausative Bedeutung: Die Tiere sollen durch das Getränk in einen wilden Zustand versetzt werden.'
- source_word: τῇ τοῦ πόματος ἀφθόνῳ χορηγίᾳ
  choice: durch die überreiche Gabe des Getränks
  rationale: Gibt sowohl die Fülle von ἄφθονος als auch die bereitstellende Bedeutung von χορηγία wieder.
- source_word: εἰσαγαγεῖν
  choice: hineingeführt werden
  rationale: Natürliche deutsche Entsprechung für das Hineinführen der Tiere an den vorgesehenen Ort.
- source_word: πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων
  choice: um den Juden ihr Verderben zu bringen
  rationale: Drückt die beabsichtigte tödliche Begegnung idiomatisch aus, ohne μόρος auf bloße Niederlage abzuschwächen.
theological_decisions:
- issue: Wiedergabe von τοῦ μόρου in der verdichteten Wendung πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων
  choice: um den Juden ihr Verderben zu bringen
  alternative: zur Begegnung mit dem Verderben der Juden
  rationale: Die wörtlichere Alternative ist im Deutschen missverständlich, da sie nahelegen kann, die Elefanten selbst begegneten dem Verderben. Der Kontext bezeichnet sie als Werkzeuge des für die Juden vorgesehenen tödlichen Ausgangs. Die Fußnote bewahrt die Bildstruktur und die Bedeutungsbreite von μόρος.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit in zwei Sätze gegliedert. Der ungewöhnliche Weihrauchtrank bleibt entsprechend dem griechischen Text unverändert stehen; die verdichtete Schlusswendung wird im Haupttext idiomatisch und in der Fußnote formnäher wiedergegeben.
