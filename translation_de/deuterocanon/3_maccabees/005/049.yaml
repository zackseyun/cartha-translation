  yaml_path: translation/deuterocanon/3_maccabees/005/049.yaml
  text: Considering that moment to be for them the final turn of life[a], the end of their most miserable expectation, they turned to pity and lamentation and kept kissing one another, embracing their relatives, falling upon their necks—parents upon children and mothers upon young daughters; and others, holding infant babies to their breasts[c][b], were drawing out their last milk.
translation:
  language: de
  text: Da sie glaubten, dies sei für sie der letzte Wendepunkt des Lebens, das Ende ihres qualvollsten Wartens[a], gaben sie sich Jammer und Wehklagen hin. Immer wieder küssten sie einander, umschlangen ihre Angehörigen und fielen ihnen um den Hals[b] – Eltern ihren Kindern und Mütter ihren jungen Töchtern[c]. Andere Frauen hielten neugeborene Säuglinge an die Brust, die zum letzten Mal Milch sogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ende ihrer qualvollsten Erwartung“. Das griechische Wort προσδοκία kann Erwartung, banges Warten oder gespannte Aussicht auf das Bevorstehende bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „fielen ihnen auf den Hals“; eine griechische Ausdrucksweise für eine leidenschaftliche Umarmung in Trauer oder Zuneigung.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „jungen Frauen“ beziehungsweise „Mädchen“. Der Zusammenhang der familiären Paarungen spricht hier für „junge Töchter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστάτην βίου ῥοπὴν
  choice: der letzte Wendepunkt des Lebens
  rationale: ῥοπή bezeichnet eine Neigung, Wende oder einen entscheidenden Umschlagpunkt. „Wendepunkt“ bewahrt das griechische Bild und lässt zugleich erkennen, dass die Betroffenen mit ihrem unmittelbar bevorstehenden Tod rechneten.
- source_word: δόξαντες
  choice: da sie glaubten
  rationale: Das Partizip gibt ihre Einschätzung der Lage wieder, ohne zu behaupten, dass diese tatsächlich zutraf.
- source_word: τὸ τέλος τῆς ἀθλιωτάτης προσδοκίας
  choice: das Ende ihres qualvollsten Wartens
  rationale: προσδοκία kann Erwartung, banges Warten oder gespannte Aussicht bezeichnen. Im Zusammenhang ist „Warten“ im Deutschen natürlich und bringt das qualvolle Harren auf das erwartete Unheil zum Ausdruck; die Fußnote wahrt die lexikalische Alternative.
- source_word: εἰς οἶκτον καὶ γόους τραπέντες
  choice: gaben sie sich Jammer und Wehklagen hin
  rationale: Die Wendung beschreibt den Übergang in einen Zustand klagender Ergriffenheit. „Jammer“ gibt οἶκτος hier kontextgemäßer wieder als das im Deutschen auf andere gerichtete „Mitleid“, während „Wehklagen“ den Plural γόους erfasst.
- source_word: κατεφίλουν
  choice: Immer wieder küssten
  rationale: Das Imperfekt bezeichnet eine fortdauernde beziehungsweise wiederholte Handlung; die Präfigierung mit κατα- verstärkt das Verb zusätzlich.
- source_word: περιπλεκόμενοι τοῖς συγγενέσιν
  choice: umschlangen ihre Angehörigen
  rationale: „Umschlangen“ bewahrt die körperliche Eindringlichkeit von περιπλέκομαι; „Angehörige“ deckt den weiten Verwandtschaftsbegriff von συγγενεῖς ab.
- source_word: ἐπὶ τοὺς τραχήλους ἐπιπίπτοντες
  choice: fielen ihnen um den Hals
  rationale: Die deutsche Redewendung entspricht dem griechischen Bild einer leidenschaftlichen Umarmung und bleibt anschaulich.
- source_word: νεάνισιν
  choice: ihren jungen Töchtern
  rationale: Das Wort bezeichnet junge Frauen oder Mädchen. In der Abfolge familiärer Paarungen legt der Kontext Töchter nahe; die Fußnote hält die allgemeinere Bedeutung offen.
- source_word: νεογνὰ ... βρέφη
  choice: neugeborene Säuglinge
  rationale: Die Verbindung beider griechischer Ausdrücke hebt Alter und Schutzlosigkeit der Kinder hervor. Die leichte Bedeutungsüberschneidung im Deutschen spiegelt diese Verstärkung.
- source_word: τελευταῖον ἕλκοντα γάλα
  choice: die zum letzten Mal Milch sogen
  rationale: Das Partizip ἕλκοντα bezieht sich grammatisch auf die Säuglinge. „Milch sogen“ ist die natürliche deutsche Wiedergabe des Ziehens der Milch an der Brust; τελευταῖον bezeichnet das aus Sicht der Bedrohten letzte Stillen.
