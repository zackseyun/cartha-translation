translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Satzfolge wurde für gute Lesbarkeit leicht gegliedert, während die Steigerung der Abschiedsszene erhalten bleibt. Die wiederholte und intensive Handlung von κατεφίλουν wird mit „Immer wieder“ ausgedrückt. Beim Schluss wird die griechische grammatische Zuordnung ausdrücklich gewahrt: Nicht die Mütter ziehen die Milch, sondern die Säuglinge saugen sie.'
