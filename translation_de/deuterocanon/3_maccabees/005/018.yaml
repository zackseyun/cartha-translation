  yaml_path: translation/deuterocanon/3_maccabees/005/018.yaml
  text: But as the conversation kept dragging on[a], the king summoned Hermon and, with a bitter threat, asked for what reason the Jews had been spared, having survived beyond the appointed day.
translation:
  language: de
  text: Als sich das Gespräch aber immer länger hinzog, ließ der König Hermon zu sich rufen und fragte ihn mit einer bitteren Drohung, aus welchem Grund die Juden verschont worden seien, nachdem sie den folgenden Tag überlebt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise wörtlicher: „weshalb die Juden geheilt oder bewahrt worden seien, nachdem sie den verbleibenden beziehungsweise folgenden Tag durchlebt hatten“. Der griechische Wortlaut ist gedrängt und nicht eindeutig. Im Zusammenhang kann gemeint sein, dass sie über den für sie erwarteten Todestag hinaus am Leben geblieben waren.'
    reason: Die Bedeutungen von ἰάθησαν und besonders von περιοῦσαν ἡμέραν sind in dieser Verbindung unsicher. Die Anmerkung legt daher keine einzelne kontextuelle Deutung als sicheren Wortsinn fest.
lexical_decisions:
- source_word: ἐπὶ πλεῖον … προσκοπτούσης τῆς ὁμιλίας
  choice: Als sich das Gespräch aber immer länger hinzog
  rationale: Die Genitivus-abs.-Konstruktion beschreibt eine sich verlängernde, stockend fortdauernde Unterredung. „Sich immer länger hinziehen“ gibt sowohl die Dauer als auch den unangenehmen Beiklang natürlich wieder.
- source_word: προσκαλεσάμενος
  choice: ließ … zu sich rufen
  rationale: Das mediale Partizip bezeichnet, dass der König Hermon vor sich rufen ließ; die Formulierung wahrt den Aspekt königlicher Autorität.
- source_word: μετὰ πικρίας ἀπειλῆς
  choice: mit einer bitteren Drohung
  rationale: Die Einzahl folgt ἀπειλῆς, während „bitter“ die ungewöhnlich scharfe Färbung von πικρίας erhält.
- source_word: τίνος ἕνεκεν αἰτίας
  choice: aus welchem Grund
  rationale: Die ausdrückliche Frage nach Ursache bzw. Grund wird näher am Griechischen wiedergegeben als durch ein bloßes „warum“.
- source_word: ἰάθησαν
  choice: verschont worden seien
  rationale: Das Verb bedeutet gewöhnlich „geheilt werden“, bezeichnet hier jedoch im Zusammenhang mit der vorgesehenen Vernichtung offenbar die Bewahrung der Juden vor dem Tod.
- source_word: περιοῦσαν ἡμέραν
  choice: den festgesetzten Tag
  rationale: Die griechische Wendung ist schwierig. Im Erzählzusammenhang ist der für die Tötung maßgebliche, inzwischen überlebte Tag gemeint; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: περιβεβιωκότες
  choice: nachdem sie … überlebt hatten
  rationale: Das Perfektpartizip betont, dass die Juden über die erwartete zeitliche Grenze hinaus am Leben geblieben waren.
