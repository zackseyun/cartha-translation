    issue: „in dieser Sache“ für περὶ τούτων
    rationale: Das Demonstrativpronomen steht im Plural und bezieht sich auf die zuvor behandelten Angelegenheiten. „hinsichtlich dieser Dinge“ erhält den Bezug ohne sachliche Verengung.
  - severity: low
    issue: „mit Nachdruck und unter Drohungen“
    rationale: Die Wendung ist verständlich, aber „unter Drohungen“ wirkt im Deutschen weniger natürlich. „Mit drohendem Nachdruck“ wahrt sowohl die Eindringlichkeit von ἐντείνων als auch die Drohungen von μετὰ ἀπειλῆς.
