  source_fidelity: 'Der Satz gibt den griechischen Sinn insgesamt zuverlässig wieder: Der Zorn wird durch das Gesagte und durch die Vereitelung seines Vorhabens aufgrund von Gottes Vorsehung ausgelöst. „In dieser Sache“ verengt jedoch περὶ τούτων („hinsichtlich dieser Dinge/Angelegenheiten“) unnötig ins Singularische. Die Schlusswendung kann idiomatischer formuliert werden, ohne die Partizipialnuance von ἐντείνων und den Zusatz μετὰ ἀπειλῆς einzubüßen.'
  naturalness: Das Register ist angemessen und der abschließende Doppelpunkt richtig. „Unter Drohungen“ klingt im Deutschen etwas unidiomatisch; „mit drohendem Nachdruck“ ist flüssiger und gibt das insistierende, drohende Reden knapp wieder.
  terminology: „Gottes Vorsehung“ ist eine genaue und etablierte Wiedergabe von προνοίᾳ θεοῦ. „Heftiger Zorn“ gibt βαρεῖ χόλῳ im modernen Deutsch angemessen wieder. „Vorhaben“ trifft νόημα hier als Absicht bzw. Plan.
  issues:
