  yaml_path: translation/deuterocanon/3_maccabees/005/030.yaml
  text: 'But he, filled with heavy anger at what had been said, because all his purpose concerning these things had been frustrated by the providence of God, spoke with threats, pressing the matter hard:'
translation:
  language: de
  text: 'Er aber wurde über das Gesagte von heftigem Zorn erfüllt, weil durch Gottes Vorsehung sein ganzes Vorhaben hinsichtlich dieser Dinge vereitelt worden war, und sagte mit drohendem Nachdruck:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρεῖ χόλῳ
  choice: von heftigem Zorn
  rationale: Gibt die Stärke und belastende Wucht des Zorns natürlich wieder; das wörtliche »schwerer Zorn« wäre im modernen Deutschen weniger idiomatisch.
- source_word: προνοίᾳ θεοῦ
  choice: durch Gottes Vorsehung
  rationale: Bewahrt den ausdrücklich theologischen Kausalbezug und die traditionelle, weiterhin verständliche Bedeutung von πρόνοια.
- source_word: πᾶν αὐτοῦ νόημα
  choice: sein ganzes Vorhaben
  rationale: νόημα bezeichnet hier im Kontext seine Absicht beziehungsweise seinen Plan; »Vorhaben« wahrt den intentionalen Sinn, ohne unnötig zu präzisieren.
- source_word: ἐντείνων μετὰ ἀπειλῆς εἶπεν
  choice: sagte mit Nachdruck und unter Drohungen
  rationale: ἐντείνων vermittelt ein angespanntes, eindringliches Sprechen; μετὰ ἀπειλῆς wird als drohende Begleitumstand wiedergegeben.
theological_decisions:
- issue: Göttliche Vorsehung als Ursache des Scheiterns
  choice: weil durch Gottes Vorsehung sein ganzes Vorhaben … vereitelt worden war
  alternative: weil sein ganzes Vorhaben … trotz Gottes Vorsehung vereitelt worden war
  rationale: 'Der griechische Dativ προνοίᾳ θεοῦ steht kausal beziehungsweise instrumental: Gottes Vorsehung bewirkt die Vereitelung. Diese Aussage darf nicht abgeschwächt oder umgekehrt werden.'
translation_notes:
  register: Modernes, würdevolles Erzählregister. Die Satzperiode und der abschließende Doppelpunkt bleiben erhalten, da der folgende Vers offenbar die direkte Rede fortsetzt.
