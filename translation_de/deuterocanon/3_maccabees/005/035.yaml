base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/035.yaml
  text: And the Jews[a], when they heard what came from the king, were praising the manifest God, the Lord, the King of kings, since they had obtained this help from him.
translation:
  language: de
  text: Und als die Juden hörten, was vom König gekommen war, priesen sie den offenbar gewordenen Gott, den Herrn, den König über die Herrschenden[a], da sie diese Hilfe von ihm erlangt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als geläufige Titelformel: „König der Könige“. Wörtlich: „König der Herrschenden“ bzw. „derjenigen, die herrschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ παρὰ τοῦ βασιλέως
  choice: was vom König gekommen war
  rationale: Die Wendung bezeichnet allgemein das, was vom König ausging—etwa eine Nachricht, Anordnung oder Maßnahme—, ohne es ausdrücklich als Erlass festzulegen.
- source_word: ἀκούσαντες
  choice: als sie hörten
  rationale: Das Partizip wird als natürlicher deutscher Temporalsatz wiedergegeben.
- source_word: ἐπιφανῆ
  choice: sichtbar in Erscheinung getretenen
  rationale: Die Formulierung bewahrt den Gedanken, dass Gott sich durch sein wirksames Eingreifen erkennbar gezeigt hat, ohne das Adjektiv lediglich als allgemeinen Ehrentitel wiederzugeben.
- source_word: θεὸν Κύριον
  choice: Gott, den Herrn
  rationale: Beide appositionell verbundenen Gottesbezeichnungen werden ausdrücklich wiedergegeben.
- source_word: Βασιλέα τῶν βασιλευόντων
  choice: den König über alle Herrschenden
  rationale: Die Übersetzung gibt das substantivierte Partizip βασιλευόντων („die Herrschenden“) wieder und formuliert das Herrschaftsverhältnis zugleich in natürlichem Deutsch.
- source_word: ᾔνουν
  choice: priesen
  rationale: Das deutsche Präteritum ist hier erzählerisch natürlich; der lexikalische Gehalt des Lobens bleibt klar erhalten, auch wenn der imperfektive Aspekt nicht eigens umschrieben wird.
- source_word: τῆσδε τῆς βοηθείας
  choice: diese Hilfe
  rationale: Dies ist die direkte und unaufgeladene Entsprechung; „Rettung“ wäre stärker deutend.
- source_word: τετευχότες
  choice: da sie … erlangt hatten
  rationale: Der Kausalsatz gibt den Grund ihres Lobpreises wieder; das Plusquamperfekt bildet den abgeschlossenen, fortwirkenden Empfang der Hilfe ab.
theological_decisions:
- issue: Wiedergabe von κύριος als göttlichem Titel
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die angemessene, traditionsfähige und zugleich allgemein verständliche Wiedergabe des auf Gott bezogenen Titels.
- issue: Wiedergabe von Βασιλέα τῶν βασιλευόντων
  choice: König über alle Herrschenden
  alternative: König der Könige
  rationale: Der Haupttext bewahrt den substantivierten Partizipialausdruck „die Herrschenden“, statt ihn stillschweigend zur geläufigeren Titelformel mit dem Substantiv „Könige“ zu normalisieren. Die idiomatische Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber durch einen Temporalsatz und einen Kausalsatz natürlich lesbar gemacht.
