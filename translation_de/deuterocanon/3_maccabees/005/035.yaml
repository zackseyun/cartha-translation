revisions:
- from: Und als die Juden hörten, was vom König gekommen war, priesen sie den sichtbar in Erscheinung getretenen Gott, den Herrn, den König über alle Herrschenden[a], da sie diese Hilfe von ihm erlangt hatten.
  to: Und als die Juden hörten, was vom König gekommen war, priesen sie den offenbar gewordenen Gott, den Herrn, den König über die Herrschenden[a], da sie diese Hilfe von ihm erlangt hatten.
  rationale: Die Revision vermeidet eine übermäßig konkrete Umschreibung von ἐπιφανῆ und entfernt die nicht ausdrücklich markierte Totalisierung „alle“. Der übrige Satzbau, die Wiedergabe der Gottesbezeichnungen und die zeitlich-kausale Verknüpfung bleiben erhalten.
