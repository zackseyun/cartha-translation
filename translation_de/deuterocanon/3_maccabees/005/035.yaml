review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die meisten lexikalischen Entscheidungen geben den griechischen Text zuverlässig wieder. „Sichtbar in Erscheinung getretenen“ macht aus dem Adjektiv ἐπιφανῆ jedoch eine unnötig explizite vergangene Erscheinung. Außerdem fügt „über alle Herrschenden“ mit „alle“ eine im griechischen Wortlaut nicht ausgedrückte Totalisierung ein.
  naturalness: Der Satz ist insgesamt würdevoll und gut verständlich. „Den offenbar gewordenen Gott“ ist für ἐπιφανῆ knapper und im Kontext des sichtbar erwiesenen Eingreifens idiomatischer als die umständliche Umschreibung „sichtbar in Erscheinung getretenen“.
  terminology: „Herr“ gibt Κύριον angemessen wieder. „König über die Herrschenden“ wahrt den Sinn der genitivischen Herrschertitulatur und die partizipiale Nuance von βασιλευόντων, ohne die geläufige Formel „König der Könige“ in den Haupttext zu übernehmen. Die Fußnote bewahrt diese idiomatische Alternative.
  issues:
  - severity: medium
    issue: „sichtbar in Erscheinung getretenen“ überbestimmt ἐπιφανῆ
    rationale: ἐπιφανής bezeichnet den offenbaren, sichtbar erwiesenen Gott; die deutsche Formulierung legt zusätzlich ein konkretes, vergangenes ‚In-Erscheinung-Treten‘ nahe.
  - severity: low
    issue: „alle“ in „über alle Herrschenden“
    rationale: Das pluralische βασιλευόντων bezeichnet Herrschende bzw. Regierende, enthält aber kein ausdrücklich entsprechendes Wort für „alle“.
