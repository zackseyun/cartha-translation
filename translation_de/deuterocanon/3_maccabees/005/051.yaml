base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/051.yaml
  text: They cried out very loudly[a], imploring the Sovereign of all to have mercy and visibly come to their aid, since they already stood at the gates of Hades.
translation:
  language: de
  text: Sie schrien sehr laut und flehten den Herrscher über alles an, sich ihrer in sichtbarer Weise zu erbarmen[a], da sie bereits an den Toren des Hades standen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich ihrer durch ein sichtbares Eingreifen zu erbarmen“; wörtlicher: „sich ihrer mit einer Erscheinung zu erbarmen“. Die griechische Wendung kann hervorheben, dass Gottes Erbarmen offen erkennbar zutage treten sollte.'
    reason: lexikalische Alternative und Erhaltung der Mehrdeutigkeit von μετὰ ἐπιφανείας
lexical_decisions:
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ σφόδρα
  choice: sie schrien sehr laut
  rationale: Gibt den nachdrücklichen lauten Hilferuf in natürlichem modernem Deutsch wieder und erfasst sowohl μεγάλῃ als auch σφόδρα.
- source_word: τὸν τῆς ἁπάσης δυνάστην
  choice: den Herrscher über alles
  rationale: δυνάστης bezeichnet einen Machthaber oder souveränen Herrscher; die Formulierung bewahrt die umfassende Herrschaft, ohne zusätzliche dogmatische Titel einzuführen.
- source_word: ἱκετεύοντες
  choice: und flehten … an
  rationale: Das Partizip bezeichnet eine eindringliche, demütige Bitte; die koordinierte deutsche Form ist flüssig und erhält den engen Zusammenhang mit dem Schreien.
- source_word: οἰκτείραι μετὰ ἐπιφανείας αὐτούς
  choice: sich ihrer in sichtbarer Weise zu erbarmen
  rationale: Bewahrt αὐτούς als Gegenstand des Erbarmens und gibt μετὰ ἐπιφανείας als sichtbar hervortretendes beziehungsweise offen erkennbares Erbarmen wieder, ohne eine ausdrücklich nicht genannte Rettungshandlung in den Haupttext einzutragen.
- source_word: ἤδη πρὸς πύλας ᾅδου καθεστῶτας
  choice: da sie bereits an den Toren des Hades standen
  rationale: Erhält das Bild unmittelbarer Todesnähe und gibt den ausdrücklich verwendeten Namen Hades wieder, statt ihn interpretierend durch Tod oder Totenreich zu ersetzen.
theological_decisions:
- issue: Bedeutung von μετὰ ἐπιφανείας bei der Bitte um Erbarmen
  choice: in sichtbarer Weise
  alternative: durch ein sichtbares Eingreifen / mit einer Erscheinung
  rationale: Die Wendung kann eine Erscheinung oder ein offen erkennbares göttliches Eingreifen bezeichnen. Die gewählte Fassung hält die Art des Erbarmens sichtbar, legt aber weder eine körperliche Erscheinung noch die genaue Form der Hilfe fest.
- issue: Wiedergabe von ᾅδου
  choice: Hades
  alternative: Totenreich / Tod
  rationale: Der griechische Ausdruck und sein Bild werden erhalten; dadurch wird keine spätere, konfessionell bestimmte Jenseitsvorstellung in den Vers eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt gut verständlich, während das eindringliche Gebet, der Titel göttlicher Herrschaft und das Bild von den Toren des Hades erhalten bleiben.
