  text: Then[a], summoning Hermon, who was in charge of the elephants, being filled with grievous anger and wrath altogether unchangeable[b],
translation:
  language: de
  text: Dann rief er Hermon, den für die Elefanten Verantwortlichen, zu sich. Er war von schwerem Zorn und Wut erfüllt und in jeder Hinsicht unbeugsam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Zeile der Vorlage bricht nach „ἀμετά-“ ab. Wahrscheinlich folgt ein Ausdruck im Sinn von „unbeugsam“ oder „unveränderlich“, der sich auf den Handelnden bezieht; die genaue Wortform ist auf der vorliegenden Seite nicht sichtbar.
    reason: textual_variant
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Leitet als natürliches deutsches Erzähladverb den nächsten Handlungsschritt ein.
- source_word: προσκαλεσάμενος
  choice: rief er … zu sich
  rationale: Gibt das vorzeitige aoristische Medium idiomatisch wieder, ohne die Handlung in eine schwerfällige Partizipialkonstruktion zu zwängen.
- source_word: Ἕρμωνα
  choice: Hermon
  rationale: Der Personenname wird in etablierter deutscher Transliteration wiedergegeben.
- source_word: τὸν πρὸς τῇ τῶν ἐλεφάντων ἐπιμελείᾳ
  choice: den Verantwortlichen für die Elefanten
  rationale: Bezeichnet knapp und verständlich Hermons Zuständigkeit für Aufsicht und Versorgung der Elefanten.
- source_word: βαρείᾳ
  choice: heftigem
  rationale: Überträgt die belastende, starke Intensität des griechischen Adjektivs in natürliches modernes Deutsch.
- source_word: μεμεστωμένος
  choice: war … erfüllt
  rationale: Bewahrt den durch das Perfektpartizip bezeichneten anhaltenden Zustand vollständiger emotionaler Erfüllung.
- source_word: ὀργῇ καὶ χόλῳ
  choice: Zorn und … Wut
  rationale: Erhält die rhetorische Doppelung zweier naher Begriffe, unterscheidet sie aber im Deutschen ausreichend.
- source_word: κατὰ πᾶν ἀμετά-
  choice: völlig unerbittlicher
  rationale: Das sichtbare Wort ist am Seitenende abgebrochen. Im Zusammenhang mit Zorn gibt „unerbittlich“ den wahrscheinlichen Sinn von nicht umzustimmen oder nicht zu besänftigen idiomatisch wieder.
