  source_fidelity: 'Die Wiedergabe von Hermons Zuständigkeit und der Zornesdoppelung ist grundsätzlich zutreffend. Die Schlusswendung „völlig unerbittlicher Wut“ verschiebt jedoch wahrscheinlich den Bezug: Das am Zeilenende abgebrochene Adjektiv ἀμετά- steht nach κατὰ πᾶν sehr wahrscheinlich prädikativ zu dem handelnden Subjekt, nicht als Attribut zu χόλῳ/Wut. Da die sichtbare Quelle mitten im Wort abbricht, muss diese Ergänzung weiterhin als wahrscheinlich, nicht als sicher gekennzeichnet werden.'
