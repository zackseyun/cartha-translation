  text: And the crowds throughout the city were gathering for the most pitiful spectacle[a], eagerly awaiting the morning.
translation:
  language: de
  text: In der ganzen Stadt hatten sich Menschenmengen zu diesem äußerst beklagenswerten Schauspiel[a] versammelt und erwarteten voller Eifer den Morgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um diesen äußerst beklagenswerten Anblick mitanzusehen«. Das griechische Wort kann sowohl das Anschauen als auch das, was angeschaut wird, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... κατὰ τὴν πόλιν πλήθη
  choice: die Menschenmengen aus der ganzen Stadt
  rationale: Die Wendung bezeichnet zahlreiche Gruppen der Stadtbevölkerung. »Aus der ganzen Stadt« gibt die distributive Bedeutung von κατὰ τὴν πόλιν in natürlichem Deutsch wieder.
- source_word: συνῄθροιστο
  choice: hatten sich versammelt
  rationale: Der griechische Plusquamperfekt bezeichnet einen bereits eingetretenen, fortwirkenden Zustand. Daher ist »hatten sich versammelt« genauer als eine progressive Wiedergabe.
- source_word: πρὸς τὴν οἰκτρότατην θεωρίαν
  choice: zu diesem überaus beklagenswerten Schauspiel
  rationale: θεωρία kann sowohl das Anschauen als auch das angeschaute Schauspiel bezeichnen; »Schauspiel« bewahrt den Charakter eines öffentlichen, erschütternden Ereignisses. Der Superlativ οἰκτρότατην wird idiomatisch mit »überaus beklagenswert« wiedergegeben.
- source_word: προσδοκῶντα
  choice: erwarteten
  rationale: Das Partizip beschreibt die Erwartung dessen, was am folgenden Morgen geschehen sollte.
- source_word: τὴν πρωίαν
  choice: den Morgen
  rationale: Die schlichte Zeitangabe entspricht dem griechischen Ausdruck, ohne ihn unnötig auf Morgengrauen oder Tagesanbruch einzuengen.
- source_word: μετὰ σπουδῆς
  choice: mit großer Ungeduld
  rationale: Die Wendung kann Eifer, angespannte Erwartung oder Dringlichkeit ausdrücken. Im düsteren Kontext bezeichnet »mit großer Ungeduld« die intensive Erwartung, ohne sie moralisch positiv als freudige Vorfreude darzustellen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, während »Menschenmengen« und »mit großer Ungeduld« für heutige Leser natürlich verständlich sind. Die echte Bedeutungsbreite von θεωρία wird in der Fußnote bewahrt.
