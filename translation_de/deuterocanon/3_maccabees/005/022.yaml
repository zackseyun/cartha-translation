  yaml_path: translation/deuterocanon/3_maccabees/005/022.yaml
  text: And they did not spend the time of the night so much in sleep as in devising every kind of mockery for those who seemed miserable[a].
translation:
  language: de
  text: Und sie verbrachten die Nacht nicht so sehr mit Schlafen, als damit, sich alle möglichen Arten von Spott gegen diejenigen auszudenken, die ihnen als bemitleidenswert erschienen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen die scheinbar Elenden«. Das griechische Wort kann »elend«, »geplagt« oder »bemitleidenswert« bedeuten; »ihnen als« gibt die durch das griechische δοκοῦσιν angedeutete Sicht der Spötter wieder.'
    reason: Lexikalische Alternative und Erläuterung der Perspektive von δοκοῦσιν in Verbindung mit ταλαιπώροις.
lexical_decisions:
- source_word: κατεχρίζαντο
  choice: verbrachten
  rationale: In Verbindung mit »die Zeit der Nacht« bezeichnet das Verb, wie die Nachtstunden verwendet wurden. »Verbrachten« ist im Deutschen natürlich und bewahrt den vergleichenden Satzbau.
- source_word: οὐχ οὕτως ... ὡς
  choice: nicht so sehr ... sondern vielmehr
  rationale: Die korrelative Konstruktion stellt zwei Tätigkeiten vergleichend gegenüber. Diese deutsche Wendung gibt die Gewichtung klar und idiomatisch wieder.
- source_word: εἰς ὕπνον
  choice: mit Schlafen
  rationale: Die Präpositionalphrase bezeichnet, wozu beziehungsweise womit die Nachtzeit verwendet wurde. »Mit Schlafen« fügt sich natürlich in die Konstruktion mit »verbringen« ein.
- source_word: παντοίως
  choice: alle möglichen
  rationale: Das Adverb unterstreicht die Vielfalt beziehungsweise umfassende Art ihrer geplanten Verhöhnungen.
- source_word: μηχανᾶσθαι
  choice: sich ... auszudenken
  rationale: Das Verb bezeichnet absichtsvolles Ersinnen oder Aushecken. »Sich ausdenken« ist verständlich und gibt die planende Tätigkeit wieder, ohne sie unnötig zu verschärfen.
- source_word: τοῖς ταλαιπώροις
  choice: für die ... bemitleidenswert Erscheinenden
  rationale: Der Dativ wird unmittelbar mit »für« wiedergegeben; ταλαίπωρος bezeichnet hier Menschen, die als elend oder bemitleidenswert betrachtet werden.
- source_word: δοκοῦσιν
  choice: ihnen ... Erscheinenden
  rationale: 'Die Wiedergabe bewahrt den perspektivischen Charakter des Ausdrucks: Die Betroffenen gelten den Spöttern als bemitleidenswert. Das ergänzte »ihnen« macht diese Perspektive im Deutschen deutlich.'
- source_word: ἐμπαιγμούς
  choice: Verhöhnungen
  rationale: Der Plural bezeichnet konkrete Formen oder Akte spöttischer Herabsetzung. »Verhöhnungen« bewahrt den Plural und den feindseligen Ton.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der leicht sperrige Ausdruck »die ihnen bemitleidenswert Erscheinenden« erhält bewusst die im Griechischen erkennbare Perspektive und vermeidet es, das Urteil des Erzählers mit demjenigen der Spötter gleichzusetzen.
