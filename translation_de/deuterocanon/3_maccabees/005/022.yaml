  naturalness: »für die ihnen bemitleidenswert Erscheinenden« ist im modernen Standarddeutsch schwer verständlich und lässt Verhöhnungen fälschlich wie etwas zugunsten der Betroffenen erscheinen. Eine Formulierung mit »gegen« und einem Relativsatz ist klar, idiomatisch und wahrt die Perspektive.
  terminology: »Spott« beziehungsweise »Verhöhnung« gibt ἐμπαιγμοί angemessen wieder. »Bemitleidenswert« ist für ταλαίπωροι vertretbar, sofern durch »ihnen als« klar bleibt, dass dies die Sicht der Spötter und nicht notwendig ein Erzählerurteil ist.
