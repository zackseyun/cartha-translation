revisions:
- from: 'Darum legte sich der König, in jeder Hinsicht ein Phalaris[a] und von Unvernunft erfüllt, mit einem ganz und gar unerfüllbaren Eid fest. Die in seinem Innern vor sich gehenden Wandlungen, die der Bewahrung der Juden dienten[b], achtete er für nichts: Ohne jeden Aufschub werde er sie in den Hades[c] schicken, nachdem wilde Tiere ihnen Knie und Füße grausam zugerichtet hätten.'
  to: 'Darum fasste der König, in jeder Hinsicht ein Phalaris[a] und von Unvernunft erfüllt, einen Eid, der ganz gewiss nicht erfüllt werden würde: Die inneren Wandlungen, die sich in ihm im Hinblick auf die Aufsicht über die Juden vollzogen, hielt er für völlig bedeutungslos. Ohne jeden Aufschub werde er sie in den Hades[c] schicken, an Knien und Füßen von wilden Tieren grausam zugerichtet.'
  rationale: Die Revision beseitigt die nicht abgesicherte Deutung von ἐπισκοπή als „Bewahrung“ und bewahrt stattdessen die offenere Beziehung zur Aufsicht über die Juden. Sie fasst die griechische Periodenstruktur in natürliches modernes Deutsch, ohne die Partizipialrelation bei der Misshandlung zeitlich zu verschieben. Die Fußnotenanker bleiben vollständig erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:28Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von πρὸς ἐπισκοπὴν τῶν Ἰουδαίων als „der Bewahrung der Juden dienten“ legt eine begünstigende Rettungs- oder Bewahrungswirkung fest, die der griechische Ausdruck selbst nicht eindeutig besagt. ἐπισκοπή bezeichnet eher Aufsicht, Betreuung, Untersuchung oder Heimsuchung. Die übrigen wesentlichen Elemente, einschließlich der Phalaris-Anspielung, des Hades und der Misshandlung durch Tiere, sind sachgerecht wiedergegeben.
  naturalness: Die Satzgliederung ist grundsätzlich gut lesbar. „achtete er für nichts“ wirkt jedoch weniger idiomatisch als „für völlig bedeutungslos hielt er“. Die Stellung von „nachdem“ macht die Verletzung zudem unnötig zu einer zeitlich vorherigen Handlung; das griechische Partizip beschreibt die Betroffenen beim Hinabsenden als zugerichtet.
  terminology: „Phalaris“ und „Hades“ sind angemessen beibehalten. „Ganz und gar unerfüllbarer Eid“ lässt sich im Deutschen glatter als „ein Eid, der ganz gewiss nicht erfüllt werden würde“ formulieren, ohne die erzählerische Ironie von ἀτελέστατον aufzugeben. Die Anmerkung zu ἐπισκοπή sollte keine kontextuelle Festlegung auf ein Eingreifen zugunsten der Juden enthalten.
  issues:
  - severity: medium
    issue: „Bewahrung der Juden“ legt πρὸς ἐπισκοπὴν τῶν Ἰουδαίων einseitig aus.
    rationale: Der Ausdruck nennt eine ἐπισκοπή in Bezug auf die Juden, nicht ausdrücklich ihre Bewahrung. Eine neutrale Wiedergabe mit Anmerkung erhält die lexikalische und syntaktische Offenheit.
  - severity: low
    issue: „nachdem wilde Tiere ihnen Knie und Füße ... zugerichtet hätten“ verändert den Partizipbezug.
    rationale: ἠκισμένους kennzeichnet die Menschen als zugerichtet, wenn sie in den Hades geschickt werden sollen; es verlangt keine explizite Vorzeitigkeit.
  - severity: low
    issue: Die Fußnote b erklärt ein Eingreifen zugunsten der Juden als Kontextbedeutung.
    rationale: Dies wiederholt und verstärkt die nicht zwingende Deutung im Haupttext, statt die vorhandene Mehrdeutigkeit neutral zu erläutern.
  revised_text: 'Darum fasste der König, in jeder Hinsicht ein Phalaris[a] und von Unvernunft erfüllt, einen Eid, der ganz gewiss nicht erfüllt werden würde: Die inneren Wandlungen, die sich in ihm im Hinblick auf die Aufsicht über die Juden vollzogen, hielt er für völlig bedeutungslos. Ohne jeden Aufschub werde er sie in den Hades[c] schicken, an Knien und Füßen von wilden Tieren grausam zugerichtet.'
  revised_footnotes:
