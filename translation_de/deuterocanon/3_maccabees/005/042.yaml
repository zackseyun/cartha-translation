base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/042.yaml
  text: Therefore the king[a], a Phalaris in every way, filled with irrationality and counting as nothing the changes of soul occurring within him for oversight of the Jews, firmly setting an utterly unfulfillable oath, that he would without delay send these men to Hades, cruelly mangled in the knees and feet by beasts[c][b],
translation:
  language: de
  text: 'Darum fasste der König, in jeder Hinsicht ein Phalaris[a] und von Unvernunft erfüllt, einen Eid, der ganz gewiss nicht erfüllt werden würde: Die inneren Wandlungen, die sich in ihm im Hinblick auf die Aufsicht über die Juden vollzogen, hielt er für völlig bedeutungslos. Ohne jeden Aufschub werde er sie in den Hades[c] schicken, an Knien und Füßen von wilden Tieren grausam zugerichtet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phalaris war ein sprichwörtlich grausamer Tyrann. Der Text vergleicht den König ausdrücklich mit ihm.
    reason: cultural_note
  - marker: c
    text: „Hades“ bezeichnet hier das Totenreich, nicht ausdrücklich die Hölle.
    reason: lexical_theological_clarification
lexical_decisions:
- source_word: Ὅθεν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Geschehen und klingt im modernen Deutschen natürlich.
- source_word: ὁ κατὰ πάντα Φάλαρις βασιλεὺς
  choice: der König, in jeder Hinsicht ein Phalaris
  rationale: Bewahrt die pointierte Gleichsetzung mit dem sprichwörtlich grausamen Tyrannen, statt sie zu einer bloßen Eigenschaftsangabe abzuflachen.
- source_word: ἐνπληθυνθεὶς ἀλογιστίας
  choice: von Unvernunft erfüllt
  rationale: Gibt sowohl den resultativen Charakter des Partizips als auch die verstandesmäßige und moralische Verblendung wieder.
- source_word: τὰς γινομένας ... ἐν αὐτῷ μεταβολὰς τῆς ψυχῆς
  choice: die in seinem Innern vor sich gehenden Wandlungen
  rationale: ψυχή bezeichnet hier das innere Denken und Wollen. „In seinem Innern“ ist natürliches Deutsch, ohne die Wendung vorschnell nur als Meinungsänderung festzulegen.
- source_word: πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  choice: die der Bewahrung der Juden dienten
  rationale: Im erzählerischen Zusammenhang bewirken die inneren Wandlungen einen Aufschub zugunsten der Juden. Eine Fußnote wahrt den breiteren Bedeutungsumfang von ἐπισκοπή.
- source_word: παρ' οὐδὲν ἡγούμενος
  choice: achtete er für nichts
  rationale: Entspricht der griechischen Wertungsformel eng und bleibt verständlich.
- source_word: ἀτελέστατον βεβαίως ὅρκον ὁρισάμενος
  choice: legte sich ... mit einem ganz und gar unerfüllbaren Eid fest
  rationale: ἀτελέστατος bezeichnet hier einen Eid, der nicht zur Ausführung gelangen wird; βεβαίως und ὁρισάμενος drücken zugleich die feste Entschlossenheit des Königs aus.
- source_word: ἀνυπερθέτως
  choice: ohne jeden Aufschub
  rationale: Gibt die ausdrückliche Verneinung jeder Verzögerung präzise wieder.
- source_word: πέμψειν εἰς ἅιδην
  choice: in den Hades schicken
  rationale: Bewahrt die griechische Bezeichnung für das Totenreich und vermeidet die theologisch enger besetzte Wiedergabe „Hölle“.
- source_word: ἐν γόνασιν καὶ ποσὶν θηρίων ἠκισμένους
  choice: nachdem wilde Tiere ihnen Knie und Füße grausam zugerichtet hätten
  rationale: Formuliert die körperliche Misshandlung idiomatisch, behält aber die ausdrücklich genannten Körperteile und die Tiere als Handelnde bei.
theological_decisions:
- issue: Wiedergabe von ἅιδης
  choice: Hades
  alternative: Totenreich
  rationale: „Hades“ wahrt die Vorstellungswelt des griechischen Textes, ohne ἅιδης mit der später theologisch enger verstandenen „Hölle“ gleichzusetzen.
- issue: Deutung von πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  choice: zur Bewahrung der Juden
  alternative: im Blick auf die Beaufsichtigung/Heimsuchung der Juden
  rationale: Der Kontext legt eine zugunsten der Juden wirkende göttliche Fügung nahe. Da ἐπισκοπή jedoch auch Aufsicht, Untersuchung oder Heimsuchung bedeuten kann, wird die Bedeutungsbreite in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Partizipialkonstruktion wurde zur Verständlichkeit in drei eng verbundene Sätze gegliedert. Die drastische Gewalt bleibt klar benannt, ohne zusätzliche Ausschmückung.
