  text: But this was the working of God[a], who rules over all, having implanted in the minds of those who had previously plotted against them a forgetfulness of their purpose.
translation:
  language: de
  text: 'Doch dies war das Wirken Gottes, der über alles herrscht: Er hatte den König vergessen lassen, was dieser zuvor geplant hatte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Form kann auch maskulin verstanden werden: „denen, die zuvor gegen ihn geplant hatten“. Im Zusammenhang ist jedoch die neutrale Deutung naheliegend: Gott ließ den König seine zuvor gefassten Pläne vergessen.'
    reason: Grammatische Mehrdeutigkeit von τῶν πρὶν αὐτῷ μεμηχανημένων; die Anmerkung bewahrt die mögliche alternative Analyse, ohne den kontextuell naheliegenden Bezug auf die Pläne des Königs zu verdecken.
lexical_decisions:
- source_word: ἐνέργεια
  choice: Wirken
  rationale: Das Substantiv bezeichnet wirksame Tätigkeit beziehungsweise Kraftentfaltung. „Wirken“ ist im Deutschen würdig und verständlich, ohne unnötig technisch zu klingen.
- source_word: τοῦ πάντα δεσποτεύοντος θεοῦ
  choice: Gottes, der über alles herrscht
  rationale: δεσποτεύω bezeichnet umfassende Herrschaft. Die Formulierung gibt Gottes universale Souveränität natürlich wieder, ohne die irreführenden modernen Nebenbedeutungen von „Despot“ einzutragen.
- source_word: τῶν πρὶν αὐτῷ μεμηχανημένων
  choice: was er zuvor geplant hatte
  rationale: 'Der substantivierte Genitiv lässt sich am besten als Gegenstand des Vergessens verstehen: die zuvor von ihm ersonnenen Vorhaben. Das Dativpronomen αὐτῷ bezeichnet dabei wahrscheinlich den Handelnden beim passiven Partizip und verweist im Kontext auf den König.'
- source_word: λήθην κατὰ διάνοιαν ἐντεθεικότος
  choice: Er hatte ihn vergessen lassen
  rationale: Wörtlich legt Gott Vergessen in den Sinn des Königs. Die deutsche Kausativform gibt die ausdrücklich aktive göttliche Verursachung klar und idiomatisch wieder; die Bildsprache wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Göttliche Verursachung des Vergessens
  choice: Gott ließ den König seine früheren Vorhaben vergessen
  alternative: Gott gestattete lediglich, dass der König sie vergaß
  rationale: 'ἐντεθεικότος schreibt Gott eine aktive Handlung zu: Er legt das Vergessen in den Sinn. Die Übersetzung schwächt diese unmittelbare Verursachung nicht zu bloßer Zulassung ab.'
- issue: Bezug und Funktion von αὐτῷ
  choice: 'Dativ des Handelnden: die zuvor von ihm geplanten Dinge'
  alternative: „gegen ihn“ beziehungsweise kontextuell „gegen sie“, wenn αὐτῷ als Ergänzung zu μηχανάομαι verstanden wird
  rationale: Der Genitiv τῶν … μεμηχανημένων hängt natürlich von λήθην ab und bezeichnet das Vergessene. Beim perfekt-passiven Partizip kann αὐτῷ den Handelnden ausdrücken; im Erzählzusammenhang sind damit die früheren Pläne des Königs gemeint. Die syntaktische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Erzählsprache. Der Doppelpunkt löst die griechische Partizipialkonstruktion lesbar auf. „Vergessen lassen“ klingt natürlich, wahrt aber die direkte göttliche Verursachung; die konkretere griechische Bildsprache und die syntaktische Alternative stehen in der Fußnote.
