    issue: Unklarer Bezug von „ihn“ im Haupttext
    rationale: Das griechische αὐτῷ verweist im Kontext auf den König, doch im deutschen Einzelvers fehlt ein tragfähiges Bezugswort. Der Satz kann daher nicht zuverlässig verstanden werden.
  - severity: medium
    issue: Die Fußnote paraphrasiert die griechische Syntax fehlerhaft und unscharf
    rationale: '„Vergessen an das ... Geplante in den Sinn gelegt“ ist kein angemessenes deutsches Abbild von λήθην κατὰ διάνοιαν ἐντεθεικότος. Die relevante Ambiguität betrifft die Form τῶν ... μεμηχανημένων (Neutrum: zuvor Geplantes; Maskulinum: Personen, die gegen ihn planten).'
  - severity: low
    issue: Die alternative Deutung wird im bisherigen Text nicht sauber von der kontextuell bevorzugten Deutung abgegrenzt
    rationale: Die Fußnote sollte die maskuline Möglichkeit als grammatische Alternative benennen, während die neutrale, auf die Pläne des Königs bezogene Lesart als kontextuell naheliegend erkennbar bleibt.
