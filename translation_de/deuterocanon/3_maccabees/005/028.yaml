- from: 'Doch dies war das Wirken Gottes, der über alles herrscht: Er hatte ihn vergessen lassen, was er zuvor geplant hatte.[a]'
  to: 'Doch dies war das Wirken Gottes, der über alles herrscht: Er hatte den König vergessen lassen, was dieser zuvor geplant hatte.[a]'
  rationale: Der Haupttext wird nur zur notwendigen Klärung des Bezugs von αὐτῷ und zur idiomatischen Wiedergabe berichtigt. Die Revision folgt der im unmittelbaren Kontext plausiblen neutralen Lesart („was zuvor von ihm geplant worden war“) und bewahrt die maskuline Analyse („die zuvor gegen ihn geplant hatten“) in einer sachlich formulierten Fußnote. Die direkte göttliche Verursachung bleibt erhalten.
