  text: But each of the friends[a], looking grim, dismissed those who had gathered[b], each one to his own occupation.
translation:
  language: de
  text: Doch jeder der Freunde entließ mit finsterer Miene die Versammelten[a], jeden zu seiner eigenen Beschäftigung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier die ungewöhnliche Form ὑπεκρέων; zudem ist die Überlieferung beziehungsweise Transkription dieser Stelle als geringfügig abweichend gekennzeichnet. Die Übersetzung folgt dem aus dem Zusammenhang erkennbaren Sinn, dass die Versammelten einzeln fortgeschickt wurden.
    reason: textual_variant
  - marker: b
    text: 'Oder: „zu seinem eigenen Geschäft“ beziehungsweise „zu seinen eigenen Angelegenheiten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθ᾽ εἷς τῶν φίλων
  choice: jeder der Freunde
  rationale: Die distributive Wendung bezeichnet die Freunde einzeln. Die schlichte Wiedergabe wahrt zugleich φίλοι als „Freunde“, ohne den möglichen höfischen Rang ausdrücklich festzulegen.
- source_word: σκυθρωπῶς
  choice: mit finsterer Miene
  rationale: Das Adverb bezeichnet eine düstere, missmutige oder niedergeschlagene äußere Haltung; die deutsche Wendung gibt diesen sichtbaren Ausdruck natürlich wieder.
- source_word: ὑπεκρέων … ἀπέλυαν
  choice: entließ
  rationale: ὑπεκρέων ist eine ungewöhnliche und textlich unsichere Form. Zusammen mit ἀπέλυαν und dessen Akkusativobjekt ergibt der Zusammenhang, dass die versammelten Menschen fortgeschickt wurden. Das deutsche Präteritum passt zum Erzählstil.
- source_word: τοὺς συνθροισμένους
  choice: die Versammelten
  rationale: Die substantivierte Partizipialform bezeichnet die Menschen, die zusammengekommen beziehungsweise versammelt worden waren.
- source_word: ἕκαστον
  choice: jeden
  rationale: Der distributive Akkusativ hebt hervor, dass die Anwesenden einzeln fortgeschickt wurden.
- source_word: ἐπὶ τὴν ἰδίαν ἀσχολίαν
  choice: zu seiner eigenen Beschäftigung
  rationale: ἀσχολία kann Beschäftigung, Geschäft oder Angelegenheit bezeichnen. „Beschäftigung“ bleibt nah am griechischen Ausdruck und ist im Deutschen verständlich.
