  text: And after barely rousing himself, he pointed out that the time for the banquet was already slipping by, making his speech about these matters.
translation:
  language: de
  text: Und nachdem er nur mühsam erwacht war, wies er darauf hin, dass die Zeit für das Festmahl bereits verstrich[a], während er über diese Dinge sprach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass die Zeit für das Gelage bereits verstrich“. Das griechische Wort kann ein Festmahl oder Trinkgelage bezeichnen; das Verb stellt die Zeit als rasch vorübergehend dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις διεγείρας
  choice: nachdem er nur mühsam erwacht war
  rationale: μόλις bezeichnet hier die Schwierigkeit des Erwachens; die temporale Konstruktion gibt das vorzeitige Aoristpartizip διεγείρας natürlich wieder.
- source_word: ὑπέδειξέ
  choice: wies er darauf hin
  rationale: Die Wendung entspricht der mit einem Inhaltssatz verbundenen diskursiven Bedeutung von ὑποδείκνυμι.
- source_word: τὸν τῆς συμποσίας καιρόν
  choice: die Zeit für das Festmahl
  rationale: συμποσία kann ein gemeinsames Mahl beziehungsweise Trinkgelage bezeichnen. „Festmahl“ ist im Kontext würdig und verständlich, ohne den möglichen Trinkaspekt unnötig hervorzuheben.
- source_word: ἤδη παρατρέχοντα
  choice: bereits verstrich
  rationale: Das Präsenspartizip beschreibt die zu diesem Zeitpunkt fortschreitende Bewegung der Zeit; „verstrich“ bewahrt dies in idiomatischem Deutsch.
- source_word: τὸν περὶ τούτων λόγον ποιούμενος
  choice: während er über diese Dinge sprach
  rationale: Die wörtlichere Wendung „eine Rede über diese Dinge hielt“ klänge im Deutschen unnötig förmlich und könnte einen ausgearbeiteten Vortrag nahelegen. Die Wiedergabe lässt die genaue Art des Sprechens offen.
