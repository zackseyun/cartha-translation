  yaml_path: translation/deuterocanon/3_maccabees/005/044.yaml
  text: Then the friends and relatives[a], overjoyed, having regained confidence, stationed the forces in the most suitable places of the city for guard duty.
translation:
  language: de
  text: Darauf gingen die Freunde und Verwandten überglücklich auseinander und postierten im Vertrauen[a] die Truppen an den geeignetsten Stellen der Stadt zur Bewachung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »treu« oder »voller Zuversicht«. Wörtlich steht im Griechischen »mit Glauben/Vertrauen«; die Wendung kann entweder ihr Vertrauen beziehungsweise ihre Zuversicht oder die treue Art ihres Handelns bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Darauf
  rationale: Gibt die zeitliche Fortsetzung der Erzählung natürlich wieder.
- source_word: περιχαρεῖς
  choice: überglücklich
  rationale: Bewahrt die verstärkte Freude des griechischen Adjektivs in gegenwärtigem, gut verständlichem Deutsch.
- source_word: ἀναλύσαντες
  choice: gingen … auseinander
  rationale: Das Partizip bezeichnet hier am ehesten das Aufbrechen beziehungsweise Auseinandergehen der versammelten Personen; die deutsche Koordination gibt die zeitliche Abfolge flüssig wieder.
- source_word: οἱ φίλοι καὶ συγγενεῖς
  choice: die Freunde und Verwandten
  rationale: Gibt beide genannten sozialen Gruppen direkt und ohne altertümliche Ausdrucksweise wieder.
- source_word: μετὰ πίστεως
  choice: im Vertrauen
  rationale: Bewahrt den Grundgedanken von πίστις und klingt im erzählerischen Zusammenhang natürlich; die mögliche Bedeutung ‚treu‘ oder ‚voller Zuversicht‘ wird in der Fußnote offengehalten.
- source_word: διέτασσον
  choice: postierten
  rationale: Bei Truppen und bestimmten Standorten bezeichnet das Verb deren geordnete Aufstellung.
- source_word: τὰς δυνάμεις
  choice: die Truppen
  rationale: Im militärischen Sicherungskontext ist dies konkreter und natürlicher als das allgemeinere ‚Kräfte‘.
- source_word: ἐπὶ τοὺς εὐκαιροτάτους τόπους
  choice: an den geeignetsten Stellen
  rationale: Gibt den Superlativ und die besondere Eignung der Orte wieder, ohne eine ausdrücklich strategische Fachbedeutung hinzuzufügen.
- source_word: πρὸς τὴν τήρησιν
  choice: zur Bewachung
  rationale: Drückt den Zweck der Aufstellung knapp und sachlich aus.
theological_decisions:
- issue: Bedeutung von πίστις in μετὰ πίστεως
  choice: im Vertrauen
  alternative: treu; voller Zuversicht; mit Glauben
  rationale: Der narrative Zusammenhang erlaubt sowohl Vertrauen beziehungsweise Zuversicht als auch die treue Art des Handelns. ‚Im Vertrauen‘ wahrt die lexikalische Nähe zu πίστις, ohne die Formulierung ausdrücklich religiös festzulegen; die Alternativen bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt erzählerisch klar; militärische Begriffe werden verständlich, aber nicht unnötig technisch wiedergegeben.
