  yaml_path: translation/deuterocanon/3_maccabees/005/013.yaml
  text: And the Jews[a], having escaped the appointed hour, again were imploring their holy God to show to the proud nations, in magnificent generosity[c][b], the might of his hand.
translation:
  language: de
  text: Die Juden aber, die der zuvor angekündigten Stunde entronnen waren, flehten den Heiligen, das heißt ihren Gott, den zur Versöhnung Bereiten, erneut an, den hochmütigen Völkern in großherziger Weise die Macht seiner Hand zu zeigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαφυγόντες
  choice: entronnen waren
  rationale: Das Partizip bezeichnet das erfolgreiche Entkommen aus einer drohenden Gefahr. „Entronnen“ bewahrt diesen Gefahrensinn und passt zur zuvor festgesetzten Stunde.
- source_word: τὴν προσημανθεῖσαν ὥραν
  choice: der zuvor angekündigten Stunde
  rationale: προσημαίνω bezeichnet ein vorheriges Anzeigen oder Festsetzen. Die Formulierung bleibt näher am griechischen Wortlaut als „festgesetzte Stunde“, ohne im Deutschen unnatürlich zu wirken.
- source_word: ἤγουν
  choice: priesen
  rationale: Im Satz lässt sich ἤγουν als Imperfekt Plural von ἄγω verstehen, hier im Sinn von „feiern, ehren, preisen“. So erhält der erste Satzteil ein eigenes Prädikat, bevor mit καὶ πάλιν ἤξιουν eine weitere Handlung folgt. Die gleichlautende Deutung als erläuternde Partikel bleibt in der Fußnote erhalten.
- source_word: τὸν ἅγιον … θεὸν αὐτῶν
  choice: ihren heiligen Gott
  rationale: Die Wendung bezeichnet den Gott der Juden als heilig. Bei der gewählten verbalen Deutung von ἤγουν ist dies das Objekt zu „priesen“.
- source_word: ἤξιουν
  choice: flehten … an
  rationale: Das Imperfekt gibt ein anhaltendes oder wiederholtes Bitten wieder; „flehten an“ bringt zugleich die Dringlichkeit des Gebets zum Ausdruck.
- source_word: τὸν εὐκατάλλακτον
  choice: den Versöhnungsbereiten
  rationale: Das substantivierte Adjektiv bezeichnet Gott als jemanden, der sich bereitwillig versöhnen lässt beziehungsweise gnädig zugänglich ist. Die eigenständige Gottesbezeichnung wird bewahrt und nicht lediglich in eine adverbiale Artangabe aufgelöst.
- source_word: μεγαλοφθενῶς
  choice: auf großartige Weise
  rationale: Das seltene Adverb drückt Größe, Erhabenheit oder edle Großherzigkeit aus. „Auf großartige Weise“ bewahrt seine adverbiale Funktion und lässt die genaue Nuance offen.
- source_word: χειρὸς κράτος
  choice: die Macht seiner Hand
  rationale: Die konkrete biblische Bildsprache von Hand und Macht bleibt erhalten und bezeichnet sichtbar wirksame göttliche Kraft.
- source_word: ἔθνεσιν ὑπερηφάνοις
  choice: den hochmütigen Völkern
  rationale: ἔθνη kann allgemein „Völker“ oder im jüdischen Sprachgebrauch „Nichtjuden“ bedeuten. „Völker“ ist die breitere, weniger festlegende Wiedergabe; ὑπερήφανος wird präzise mit „hochmütig“ wiedergegeben.
theological_decisions:
- issue: Gottesbezeichnung εὐκατάλλακτον
  choice: den Versöhnungsbereiten
  alternative: den leicht zu Versöhnenden; den Gnädigen
  rationale: Die Übersetzung erhält die Aussage, dass Gott für Versöhnung beziehungsweise gnädige Zuwendung bereit ist, ohne sie in eine bloße Beschreibung seiner Freigebigkeit umzudeuten. Zugleich vermeidet sie die missverständliche Vorstellung eines launischen, leicht zu beschwichtigenden Gottes.
- issue: Mehrdeutigkeit von ἤγουν
  choice: als Verb „priesen“ verstanden
  alternative: 'als erläuternde Partikel: „den Heiligen, das heißt ihren Gott“'
  rationale: 'Die verbale Lesart ergibt eine klare syntaktische Abfolge: Die Juden priesen Gott und flehten ihn erneut an. Da dieselbe griechische Form auch als erläuternde Partikel gelesen werden kann, wird diese echte sprachliche Mehrdeutigkeit in einer Fußnote ausgewiesen.'
- issue: Adressaten ἔθνεσιν
  choice: Völkern
  alternative: Nichtjuden
  rationale: Der Kontext erlaubt sowohl die allgemeine ethnische als auch die spezifisch jüdische Verwendung. Die Hauptübersetzung entscheidet sich nicht unnötig für die theologisch stärker markierte Alternative.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Satzführung. „Entronnen“, „Versöhnungsbereiten“ und „hochmütig“ halten den biblischen Ton, bleiben aber allgemein verständlich. Die griechische Syntax und ihre echte Mehrdeutigkeit werden nicht zugunsten der englischen Konsultationsfassung eingeebnet.
