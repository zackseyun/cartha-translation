  verdict: revise
  source_fidelity: 'Die Hauptabweichung ist erheblich: ἤγουν ist hier die erläuternde Partikel „das heißt/nämlich“, nicht ein Imperfekt von ἄγω. Daher enthält der Entwurf mit „priesen“ eine im griechischen Text nicht vorhandene Handlung und unterbricht die Satzstruktur. Das wiederholte Flehen (καὶ πάλιν ἤξιουν) ist die einzige finite Handlung. Die revidierte Fassung gibt die appositionelle Gottesbezeichnung und εὐκατάλλακτον als weitere Gottescharakterisierung wieder.'
  naturalness: Die revidierte Satzführung ist modernes, würdevolles Standarddeutsch. Die appositionelle Folge „den Heiligen, das heißt ihren Gott, den zur Versöhnung Bereiten“ ist bewusst eng am griechischen Satzbau, bleibt aber verständlich und vermeidet die sachlich falsche Einführung von „priesen“.
  terminology: „Der Heilige“ wahrt die Substantivierung von τὸν ἅγιον; „zur Versöhnung bereit“ gibt εὐκατάλλακτον zurückhaltend wieder, ohne eine konfessionelle Deutung einzutragen. „Hochmütige Völker“ bewahrt die offene Bedeutung von ἔθνη. „Die Macht seiner Hand“ erhält die biblische Bildsprache von χειρὸς κράτος.
  issues:
  - severity: high
    issue: ἤγουν wurde als Verb „priesen“ statt als erläuternde Partikel wiedergegeben.
    rationale: Im vorliegenden griechischen Text verbindet ἤγουν τὸν ἅγιον erläuternd mit θεὸν αὐτῶν („den Heiligen, das heißt ihren Gott“). Die Verbdeutung fügt ein nicht belegtes Prädikat hinzu und lässt die syntaktische Funktion der Partikel sowie die fortlaufende Bitte bei ἤξιουν verfehlen.
  - severity: medium
    issue: Die Fußnote zu Marker a stellt die unzutreffende Verbdeutung als gleichwertige Lesemöglichkeit dar.
    rationale: Sie muss durch eine Erklärung der erläuternden Partikel ersetzt werden, damit der Fußnotenapparat die Hauptübersetzung nicht unterläuft.
  - severity: low
    issue: Die Stellung von εὐκατάλλακτον als eigenständige Gottesbezeichnung war im Entwurf zwar erkennbar, aber durch die falsche Satzgliederung weniger klar.
    rationale: Die Revision bindet die Charakterisierung appositionell an Gott und lässt zugleich die semantische Bandbreite in der Fußnote offen.
  revised_text: Die Juden aber, die der zuvor angekündigten Stunde entronnen waren, flehten den Heiligen, das heißt ihren Gott, den zur Versöhnung Bereiten, erneut an, den hochmütigen Völkern in großherziger Weise die Macht seiner Hand zu zeigen.
  revised_footnotes:
