- from: Die Juden aber, die der zuvor angekündigten Stunde entronnen waren, priesen ihren heiligen Gott[a] und flehten den Versöhnungsbereiten[b] erneut an, den hochmütigen Völkern[c] auf großartige Weise[d] die Macht seiner Hand zu zeigen.
  to: Die Juden aber, die der zuvor angekündigten Stunde entronnen waren, flehten den Heiligen, das heißt ihren Gott, den zur Versöhnung Bereiten, erneut an, den hochmütigen Völkern in großherziger Weise die Macht seiner Hand zu zeigen.
  rationale: 'Die Revision korrigiert die falsche morphologische und syntaktische Analyse von ἤγουν. Sie gibt den Satz als fortdauerndes, erneutes Flehen wieder und erhält die erläuternde Bezeichnung Gottes sowie die zusätzliche Charakterisierung εὐκατάλλακτον. Die Wortstellung bei der Machterweisung folgt dem griechischen Bezug: Gott soll den hochmütigen Völkern die Macht seiner Hand in großherziger beziehungsweise erhabener Weise zeigen. Die Fußnoten wurden vollständig an die korrigierte Übersetzung angepasst.'
