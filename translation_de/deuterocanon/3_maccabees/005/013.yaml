    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den hochmütigen Nichtjuden“. Das griechische Wort kann sowohl „Völker“ als auch, im jüdischen Sprachgebrauch, „Nichtjuden“ bedeuten.'
    reason: lexical_alternative
  - marker: d
    text: Das seltene griechische Adverb kann auch „in erhabener Weise“, „großartig“ oder „herrlich“ bedeuten.
    reason: lexical_alternative
