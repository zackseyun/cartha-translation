lexical_decisions:
- source_word: μεσούσης δὲ ἤδη ἑκάτης ὥρας σχεδόν
  choice: Als die sechste Stunde bereits fast zur Hälfte verstrichen war
  rationale: Bewahrt die antike Stundenangabe und gibt μεσούσης, ἤδη und σχεδόν natürlich und hinreichend genau wieder, ohne unmittelbar in eine moderne Uhrzeit umzurechnen.
- source_word: ὁ πρὸς ταῖς κλήσεσιν τεταγμένος
  choice: der für die Aufrufe zuständige Mann
  rationale: τεταγμένος bezeichnet eine beauftragte oder eingesetzte Person; „für die Aufrufe zuständig“ erhält den administrativen Sinn von κλήσεις, ohne eine Registrierung oder Volkszählung vorauszusetzen.
- source_word: ἀθρόους
  choice: in großer Zahl versammelt
  rationale: Gibt das geschlossene, massenhafte Zusammenkommen idiomatisch wieder; „als Masse“ wäre im Deutschen unnötig hart und weniger natürlich.
- source_word: τοὺς κλητούς
  choice: die Aufgerufenen
  rationale: Bezeichnet hier Menschen, die kraft einer Anordnung zusammengerufen worden waren, nicht gesellschaftlich eingeladene Gäste.
- source_word: προσελθὼν
  choice: trat ... zum König
  rationale: Das vorzeitige Partizip wird in natürlicher deutscher Satzfolge als finites Verb wiedergegeben und beschreibt die Annäherung an den König.
- source_word: ἔνευσε
  choice: gab ihm ein Zeichen
  rationale: Bewahrt die Offenheit des Verbs für ein Nicken oder eine andere Geste, ohne die genaue Art des Zeichens festzulegen.
