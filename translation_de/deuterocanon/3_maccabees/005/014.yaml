  text: And when it was already nearly the middle of the sixth hour[a], the man appointed over the summonses, seeing those who had been summoned assembled in a mass, came up and signaled to the king.
translation:
  language: de
  text: Als die sechste Stunde bereits fast zur Hälfte verstrichen war[a], sah der für die Einberufungen eingesetzte Mann, dass die Einberufenen alle beisammen waren, trat zum König und gab ihm ein Zeichen.
