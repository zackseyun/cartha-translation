translation:
  language: de
  text: Nachdem der König das gesamte Festmahl nach denselben Regeln[a] ausgerichtet hatte, forderte er dazu auf, zur Fröhlichkeit überzugehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach denselben Gesetzen“ beziehungsweise „nach denselben Gepflogenheiten“. Das griechische Wort νόμοι kann Gesetze, Regeln oder festgelegte Bräuche bezeichnen; beim Ausrichten eines Festmahls liegt hier ein praktischer Sinn nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τοὺς αὐτοὺς νόμους
  choice: nach denselben Regeln
  rationale: κατά mit Akkusativ bezeichnet Übereinstimmung; νόμοι kann Gesetze, Normen oder geregelte Gepflogenheiten meinen. Im Zusammenhang eines ausgerichteten Festmahls ist „Regeln“ am naheliegendsten, während die Fußnote die echte Bedeutungsbreite wahrt. δέ wird hier wegen des knappen deutschen Einzelverskontexts nicht eigens wiedergegeben.
- source_word: ὁ βασιλεὺς συστησάμενος πᾶν τὸ συμπόσιον
  choice: Nachdem der König das gesamte Festmahl … ausgerichtet hatte
  rationale: Das Aoristpartizip συστησάμενος bezeichnet eine der Haupthandlung vorausgehende Organisation oder Einrichtung. „Ausgerichtet“ ist bei einem Festmahl idiomatisch; „gesamte“ gibt πᾶν wieder, und „Festmahl“ erfasst συμπόσιον in würdigem, heutigem Deutsch.
- source_word: εἰς εὐφροσύνην τραπῆναι
  choice: zur Fröhlichkeit überzugehen
  rationale: Die Wendung bezeichnet den Übergang in eine freudige, festliche Stimmung. „Überzugehen“ bewahrt die Richtungs- und Zustandsänderung von εἰς und τραπῆναι, ohne ein schwerfälliges Passiv zu erzwingen.
- source_word: παρεκάλει
  choice: ermunterte er dazu
  rationale: παρακαλέω kann auffordern, ermahnen, bitten oder ermutigen bedeuten. Im festlichen Kontext trifft „ermunterte“ den freundlichen Nachdruck; „dazu“ bindet den folgenden Infinitiv natürlich an, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt einzuführen.
