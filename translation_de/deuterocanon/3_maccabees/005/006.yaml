  yaml_path: translation/deuterocanon/3_maccabees/005/006.yaml
  text: But the Jews[a], seeming to the nations to be deprived of every protection because of the necessity that surrounded them on every side with chains,
translation:
  language: de
  text: Die Juden aber schienen den Völkern ohne jeden Schutz zu sein, weil der Zwang sie von allen Seiten in Fesseln gefangen hielt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάσης σκέπης ἔρημοι
  choice: ohne jeden Schutz
  rationale: σκέπη bezeichnet Deckung, Zuflucht oder Schutz; mit ἔρημοι und dem Genitiv ist das Fehlen dieses Schutzes gemeint. Die knappe Wendung ist im Deutschen natürlich und wahrt den bildlichen Sinn.
- source_word: δοκοῦντες εἶναι
  choice: schienen ... zu sein
  rationale: Die Formulierung kennzeichnet den Eindruck aus der Sicht der Völker und behauptet nicht uneingeschränkt, dass die Juden tatsächlich schutzlos waren.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: Der Dativ gibt hier die Perspektive der umgebenden nichtjüdischen Völker an; „den Völkern“ bleibt nah am Griechischen und vermeidet eine unnötig fachsprachliche Wiedergabe.
- source_word: ἀνάγκην
  choice: Zwangslage
  rationale: ἀνάγκη kann Notwendigkeit, Zwang oder bedrängende Not bezeichnen. Im Zusammenhang mit Fesseln bringt „Zwangslage“ den auferlegten und bedrängenden Charakter klar zum Ausdruck.
- source_word: πάντοθεν περιέχουσαν αὐτοὺς μετὰ δεσμῶν
  choice: sie von allen Seiten mit Fesseln umschloss
  rationale: Die Wiedergabe erhält sowohl das räumliche Bild vollständiger Einschließung als auch die konkrete Gefangenschaftsmetapher.
- source_word: δεσμῶν
  choice: Fesseln
  rationale: δεσμοί kann Fesseln, Bande oder Ketten bedeuten. „Fesseln“ passt idiomatisch zur Haft- und Zwangssituation, ohne das Material genauer festzulegen als der griechische Text.
theological_decisions:
- issue: Scheinbare oder tatsächliche Schutzlosigkeit
  choice: „schienen den Völkern ohne jeden Schutz zu sein“
  alternative: „galten den Völkern als völlig schutzlos“
  rationale: Die Übersetzung bewahrt durch δοκοῦντες die Spannung zwischen äußerem Eindruck und tatsächlicher Lage, ohne einen unausgesprochenen göttlichen Schutz ausdrücklich einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist im griechischen Ausgangstext syntaktisch nicht abgeschlossen; das abschließende Komma signalisiert die Fortsetzung in Vers 7.
