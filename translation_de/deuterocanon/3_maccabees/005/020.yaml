base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/020.yaml
  text: Having a savagery worse than Phalaris[a], he said that they should be thankful to sleep today; but, once they had been kept alive until the coming day[c][b], prepare the elephants in the same way for the destruction of the lawless Jews.
translation:
  language: de
  text: 'Er übertraf Phalaris noch an Grausamkeit[a] und sagte: »Sie sollen den heutigen Schlaf als Gunst ansehen[b]. Wenn sie bis zum kommenden Tag am Leben gehalten worden sind, bereite die Elefanten ebenso vor, um die gesetzlosen Juden[c] zu vernichten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phalaris galt in der griechischen Überlieferung als besonders grausamer Herrscher. Der Vergleich steigert die Darstellung der Grausamkeit des Königs.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Für den heutigen Schlaf sollen sie dankbar sein.« Gemeint ist, dass sie die Erlaubnis, heute noch zu schlafen, als erwiesene Gunst betrachten sollten.'
    reason: lexical_alternative
  - marker: c
    text: »Gesetzlos« gibt hier eine feindselige Bezeichnung aus dem Mund des Sprechers wieder; auch »frevelhaft« ist möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠμότητα χείρονα Φαλάριδος ἐσχηκὼς
  choice: Von einer Grausamkeit erfüllt, die noch schlimmer war als die des Phalaris
  rationale: Die Formulierung gibt den bestehenden Zustand des Handelnden und den Vergleich mit dem sprichwörtlich grausamen Phalaris natürlich wieder, ohne die starke moralische Wertung von ὠμότης abzuschwächen.
- source_word: τὸ τῆς σήμερον ὕπνῳ χάριν ἔχειν αὐτούς
  choice: Für den heutigen Schlaf sollen sie dankbar sein
  rationale: χάριν ἔχειν bezeichnet Dankbarkeit für eine gewährte Gunst. Die knappe Formulierung wahrt das Bild des Schlafes und macht deutlich, dass der Aufschub als Gunst gelten soll.
- source_word: συντηρηθέντας
  choice: Nachdem sie ... am Leben erhalten worden sind
  rationale: Das passive Partizip bezeichnet hier im Hinrichtungskontext nicht bloß Aufbewahrung, sondern das Bewahren des Lebens bis zum vorgesehenen Zeitpunkt.
- source_word: ὑποτέλλουσαν ἡμέραν
  choice: bis zum anbrechenden Tag
  rationale: Das Partizip beschreibt den herannahenden beziehungsweise anbrechenden Tag. Diese Wiedergabe bewahrt das zeitliche Bild des Griechischen.
- source_word: κατὰ τὸ ὅμοιον ἑτοίμασον
  choice: mach ... ebenso bereit
  rationale: Der Imperativ wird als unmittelbarer Befehl wiedergegeben; ebenso verweist auf die zuvor beschriebene Vorbereitung.
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: um ... zu vernichten
  rationale: Die finale Konstruktion bezeichnet den Zweck der Vorbereitung. vernichten gibt die starke Bedeutung von ἀφανισμός in idiomatischem Deutsch wieder.
- source_word: ἀθεμίτων Ἰουδαίων
  choice: die gesetzlosen Juden
  rationale: ἀθέμιτος bezeichnet etwas, das gegen Gesetz, Ordnung oder göttliches Recht verstößt. gesetzlos bewahrt den feindseligen Vorwurf des Sprechers, ohne ihn als Erzählerurteil auszugeben.
theological_decisions:
- issue: Feindselige Bezeichnung der Juden
  choice: die gesetzlosen Juden
  alternative: die frevelhaften Juden; die das Recht missachtenden Juden
  rationale: Der abwertende Ausdruck gehört zur Rede des Verfolgers und darf weder verschwiegen noch als sachliche Bewertung des Erzählers verstanden werden. Die Fußnote kennzeichnet seine rhetorische Funktion.
- issue: Bezug der gewährten Schlafpause
  choice: Sie sollen den heutigen Schlaf als Grund zur Dankbarkeit ansehen
  alternative: Sie sollen den heutigen Schlaf als Gunst betrachten
  rationale: 'Die griechische Wendung verbindet den Schlaf mit χάριν ἔχειν. Die Übersetzung belässt die bittere Spannung: Der bloße Aufschub der Tötung wird vom grausamen Sprecher als Gunst dargestellt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede verbindet den von ἔφη abhängigen Gedanken natürlich mit dem folgenden griechischen Imperativ. Die drastische, feindselige Sprache bleibt als Figurenrede erkennbar.
