  source_fidelity: Der Entwurf gibt den zeitlichen Rahmen, die unzählbaren Menschenmengen beim Hippodrom, das Betreten der αὐλή und das drängende Einwirken auf den König sachgerecht wieder. „Beim Hippodrom“ wahrt die räumliche Zurückhaltung des griechischen κατὰ τοῦ ἱπποδρόμου. Die Wiedergabe von ἐπὶ τὸ προκείμενον zusammen mit ὤτρυνε sollte im Deutschen jedoch idiomatischer gefasst werden.
  naturalness: „Den König in der anstehenden Sache antreiben“ ist verständlich, klingt im heutigen Standarddeutsch aber ungewohnt und kann mechanisch wirken. „Den König in der anstehenden Angelegenheit zum Handeln drängen“ ist natürlich und gibt die auf eine gegenwärtig vorliegende Sache gerichtete Aufforderung wieder.
  terminology: „Hippodrom“ und „Hof“ passen zum historischen Erzählregister. Der Fußnotenanker steht korrekt bei „Hof“; die Alternative „Palasthof“ erläutert die mögliche Bedeutung von αὐλή, ohne sie dem Text aufzuzwingen.
