  to: Gegen Tagesanbruch, als die Stadt beim Hippodrom bereits von zahllosen Menschenmengen überfüllt war, betrat er den Hof[a] und drängte den König in der anstehenden Angelegenheit zum Handeln.
  rationale: Lediglich die deutsche Wiedergabe der Kombination ὤτρυνε ἐπὶ τὸ προκείμενον wurde idiomatisch geglättet. „Zum Handeln drängen“ bringt das im Verb enthaltene Anspornen bzw. Drängen zum Ausdruck, während „in der anstehenden Angelegenheit“ die vorliegende Sache bezeichnet. Alle übrigen Entscheidungen, einschließlich der bewusst offenen räumlichen Angabe „beim Hippodrom“ und der Fußnote zu αὐλή, bleiben erhalten.
