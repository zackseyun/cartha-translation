  text: Around dawn[a], when the city was already filled with innumerable crowds at the hippodrome, he entered the court and urged the king on concerning the matter at hand.
translation:
  language: de
  text: Gegen Tagesanbruch, als die Stadt beim Hippodrom bereits von zahllosen Menschenmengen überfüllt war, betrat er den Hof[a] und drängte den König in der anstehenden Angelegenheit zum Handeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Palasthof“; das griechische Wort kann den Hofbereich einer königlichen Residenz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τὴν ἕω
  choice: Gegen Tagesanbruch
  rationale: Die Wendung bezeichnet ungefähr die Zeit des anbrechenden Tages; „gegen“ bewahrt den Näherungswert von περὶ.
- source_word: πλήθεσιν ἀναριθμήτοις
  choice: von zahllosen Menschenmengen
  rationale: πλήθη bezeichnet große Menschenansammlungen, während ἀναρίθμητοι ihre nicht zählbare Menge hervorhebt.
- source_word: κατὰ τοῦ ἱπποδρόμου καταμεστωμένης
  choice: beim Hippodrom … überfüllt war
  rationale: καταμεστόω beschreibt ein völliges Anfüllen oder Überfüllen; κατὰ mit dem Genitiv lokalisiert die Menschenansammlung im Bereich des Hippodroms, ohne die räumliche Ausdehnung unnötig festzulegen.
- source_word: εἰς τὴν αὐλήν
  choice: den Hof
  rationale: αὐλή kann den Hof eines Herrschers, einen Palasthof oder den höfischen Bereich bezeichnen. „Hof“ ist knapp und erhält diese Mehrdeutigkeit.
- source_word: ἐπὶ τὸ προκείμενον
  choice: in der anstehenden Sache
  rationale: Das substantivierte προκείμενον bezeichnet idiomatisch die vorliegende oder aktuell anstehende Angelegenheit.
- source_word: ὤτρυνε
  choice: trieb … an
  rationale: ὀτρύνω bedeutet antreiben, drängen oder anspornen. Die Formulierung gibt den Druck auf den König wieder, ohne ein genaueres Motiv hinzuzufügen.
