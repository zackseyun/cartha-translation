  text: But if he should campaign against Judea[a], he would quickly make it level with fire and spear, and after burning their sanctuary—untrodden by us[b]—with fire, he would put a stop forever to those who perform sacrifice there.
translation:
  language: de
  text: Wenn er aber gegen Judäa zu Felde ziehe, werde er es in kürzester Zeit mit Feuer und Speer dem Erdboden gleichmachen; und nachdem er ihr Heiligtum, das wir nicht betreten dürfen[a], schnell in Brand gesetzt habe[b], werde er denen, die dort Opfer darbringen, für immer ein Ende setzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das griechische Wort auch „für uns unbetretbar“ oder „uns unzugänglich“ heißen; gemeint ist ein Heiligtum, zu dem der Sprecher und seinesgleichen keinen Zutritt haben.
    reason: lexical_alternative
  - marker: b
    text: Die Buchstaben des griechischen Wortes für „in Brand gesetzt“ sind in Swetes Text geringfügig unsicher; die Bedeutung „in Brand setzen, verbrennen“ ist jedoch klar.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιστρατεύσαντα
  choice: gegen Judäa zu Felde ziehe
  rationale: Bewahrt den militärischen Sinn des Partizips und fügt sich natürlich in die abhängige Rede ein.
- source_word: ἰσόπεδον ... στήσεσθαι
  choice: dem Erdboden gleichmachen
  rationale: Gibt die völlige Einebnung idiomatisch und anschaulich wieder.
- source_word: πυρὶ καὶ δόρατι
  choice: mit Feuer und Speer
  rationale: Bewahrt das konkrete griechische Instrumentenpaar.
- source_word: διὰ τάχους
  choice: in kürzester Zeit
  rationale: Drückt die nachdrückliche Schnelligkeit der ersten Wendung natürlich aus.
- source_word: ἄβατον ἡμῖν
  choice: das wir nicht betreten dürfen
  rationale: Erhält die konkrete Bedeutung des Nichtbetretens und die Perspektive der ersten Person Plural; zugleich klingt die kultische Zugangsbeschränkung im Deutschen natürlich.
- source_word: ναόν
  choice: Heiligtum
  rationale: Bezeichnet hier eher den inneren Tempel beziehungsweise das Heiligtum als den gesamten Tempelbezirk.
- source_word: πρήσαντα
  choice: niedergebrannt habe
  rationale: Vermittelt das klare Ergebnis des in der Überlieferung geringfügig unsicher geschriebenen Verbs und vermeidet im Deutschen eine schwerfällige Wiederholung von „Feuer“.
- source_word: τῶν συντελούντων ἐκεῖ θυσίαν
  choice: denen, die dort Opfer darbringen
  rationale: Ist idiomatisches, würdiges Deutsch und bezeichnet die Ausführung des Opferdienstes, ohne ausdrücklich ein nicht genanntes Priesteramt einzuführen.
- source_word: εἰς τὸν ἅπαντα χρόνον καταστήσειν
  choice: für immer ein Ende setzen
  rationale: Bewahrt die Aussage einer dauerhaften und endgültigen Beendigung.
theological_decisions:
- issue: Bedeutung von ἄβατον ἡμῖν
  choice: das wir nicht betreten dürfen
  alternative: das von uns unbetreten ist / das uns unzugänglich ist
  rationale: Die gewählte Fassung wahrt die Außenseiterperspektive des Sprechers und die konkrete Vorstellung des Betretens, ohne die Art der Zugangsbeschränkung dogmatisch näher festzulegen.
- issue: Wiedergabe von ναός
  choice: Heiligtum
  alternative: Tempel
  rationale: „Heiligtum“ wahrt die mögliche engere Bedeutung des inneren Tempelbereichs, die im Zusammenhang mit ἄβατον besonders naheliegt.
- issue: Objekt der endgültigen Beendigung
  choice: den Opfernden ein Ende setzen
  alternative: das Opferdarbringen für immer beenden
  rationale: Der griechische Genitiv τῶν συντελούντων bezeichnet grammatisch die Personen. Die härtere Aussage über ihr Ende wird daher nicht stillschweigend zu einer bloßen Einstellung des Opferdienstes abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion mit Konjunktiv I bewahrt die abhängige beziehungsweise berichtete Rede. Beide Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
