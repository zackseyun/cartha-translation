  text: But when he had accepted it and was struck with astonishment at the lawless outcome[a], being in every way overcome by ignorance[b], he kept asking whether what had been decreed had indeed been carried out for him with urgency.
translation:
  language: de
  text: Als er es jedoch angenommen hatte und über den gesetzlosen Ausgang[a] bestürzt war, fragte er, ganz von Unwissenheit überwältigt, immer wieder, ob das für ihn schriftlich Angeordnete[b] inzwischen mit aller Eile ausgeführt worden sei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über den gesetzlosen Auszug“ beziehungsweise „über den rechtswidrigen Ausgang“. Das griechische Wort ἔξοδος kann einen Ausgang, einen Auszug oder den Fortgang eines Geschehens bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das für ihn Festgelegte“ beziehungsweise „die erlassene Anordnung“. Das griechische Wort kann besonders etwas schriftlich Festgelegtes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξαμένου
  choice: als er es angenommen hatte
  rationale: Das Aoristpartizip von ἀποδέχομαι kann annehmen, entgegennehmen oder gutheißen bedeuten. „Angenommen“ bewahrt diese Bedeutungsbreite, ohne eine bloße Kenntnisnahme oder förmliche Billigung festzulegen.
- source_word: καταπλαγέντος
  choice: bestürzt war
  rationale: Das passive Partizip bezeichnet ein heftiges Erschrecken oder Überwältigtsein; „bestürzt“ gibt die Reaktion natürlich und würdevoll wieder.
- source_word: ἀνόμῳ ἐξόδῳ
  choice: gesetzlosen Ausgang
  rationale: ἄνομος bedeutet gesetzlos oder rechtswidrig; ἔξοδος kann Ausgang, Auszug oder Fortgang bezeichnen. „Ausgang“ erhält die lexikalische Offenheit und passt zum schockierenden Geschehen, ohne einen räumlichen Aufbruch festzuschreiben.
- source_word: κατὰ πάντα ἀγνωσίᾳ κεκρατημένος
  choice: ganz von Unwissenheit überwältigt
  rationale: Das Perfektpartizip von κρατέω mit dem Dativ beschreibt einen anhaltenden Zustand des Beherrschtseins. „Ganz“ gibt κατὰ πάντα kompakt wieder; „Unwissenheit“ wahrt den deutlichen Sinn von ἀγνωσία statt ihn zu bloßer Verwirrung umzudeuten.
- source_word: ἐπυνθάνετο
  choice: fragte ... immer wieder
  rationale: Der Imperfekt von πυνθάνομαι legt ein andauerndes oder wiederholtes Fragen nahe.
- source_word: τὸ διαγραμμένον
  choice: das ... schriftlich Angeordnete
  rationale: Das substantivierte Perfektpartizip von διαγράφω kann das Niedergeschriebene beziehungsweise eine schriftlich festgelegte Anordnung bezeichnen. Die Formulierung bewahrt beide Aspekte.
- source_word: ἔτι
  choice: noch
  rationale: Die gewöhnliche temporale Bedeutung „noch“ beziehungsweise „weiterhin“ wird beibehalten; eine verstärkende Wiedergabe wie „tatsächlich“ wäre möglich, aber stärker kontextuell gedeutet.
- source_word: μετὰ σπουδῆς
  choice: mit allem Nachdruck
  rationale: σπουδή verbindet je nach Kontext Eile, Eifer und Ernsthaftigkeit. „Mit allem Nachdruck“ ist im Zusammenhang einer Anordnung idiomatisch und beschränkt den Sinn nicht ausschließlich auf Geschwindigkeit.
- source_word: τετέλεσται
  choice: ausgeführt worden sei
  rationale: Das Perfekt Passiv von τελέω bezeichnet die erfolgte Durchführung oder Vollendung. Der deutsche Konjunktiv kennzeichnet die indirekte Frage.
