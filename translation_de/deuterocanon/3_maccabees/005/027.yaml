translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die verschachtelte griechische Partizipialstruktur wurde in einen flüssigen deutschen Hauptsatz überführt; die wiederholte Fragetätigkeit und die indirekte Rede bleiben erkennbar. Die Mehrdeutigkeit von ἔξοδος, διαγράφω und ἔτι wird nicht dogmatisch oder narrativ vereindeutigt.
