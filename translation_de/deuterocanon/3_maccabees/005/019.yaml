  text: But when the one who had pointed out that during the night the order had been carried through to completion[a], and their friends had borne witness to it,
translation:
  language: de
  text: Als aber derjenige darauf hingewiesen hatte, dass das Befohlene während der Nacht vollständig ausgeführt worden sei[a], und ihre Freunde dies ebenfalls bezeugt hatten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hier mit „ausgeführt worden sei“ wiedergegebene griechische Verbform ist in Swetes Text textlich und morphologisch schwierig. Der Gesamtsinn des Satzteils ist jedoch klar: Es wurde berichtet, das Befohlene sei während der Nacht vollendet worden.'
    reason: textual_variant
lexical_decisions:
- source_word: ὑποδείξαντος
  choice: darauf hingewiesen hatte
  rationale: Das Partizip bezeichnet ein Anzeigen oder Kenntlichmachen. „Darauf hingewiesen“ bewahrt diesen Sinn, ohne daraus eine förmliche Verkündigung zu machen.
- source_word: νυκτός
  choice: während der Nacht
  rationale: Der Genitiv der Zeit wird im modernen Standarddeutsch natürlich mit „während der Nacht“ wiedergegeben.
- source_word: τὸ προσταγέν
  choice: der Befehl
  rationale: Das substantivierte Partizip bezeichnet das Angeordnete; „der Befehl“ ist knapp, idiomatisch und entspricht dem amtlichen Zusammenhang.
- source_word: ἐπὶ τέλος
  choice: vollständig
  rationale: Die Wendung bezeichnet das Erreichen des Endes beziehungsweise die Vollendung. „Vollständig“ gibt dies natürlich wieder, ohne einen Erfolg über die bloße Ausführung hinaus zu behaupten.
- source_word: ἠγοχέναι
  choice: ausgeführt worden sei
  rationale: Die schwierige Form bezeichnet im Satzzusammenhang offenbar, dass das Befohlene zur Ausführung beziehungsweise Vollendung gelangt war. Der Konjunktiv wahrt im Deutschen die mittelbare Aussage.
- source_word: προσμαρτυρησάντων
  choice: dies ebenfalls bezeugt hatten
  rationale: Das Kompositum bezeichnet ein hinzutretendes Zeugnis oder eine zusätzliche Bestätigung. „Ebenfalls bezeugt“ erhält den Zeugnischarakter und macht den Bezug im Deutschen verständlich.
- source_word: φίλων
  choice: Freunde
  rationale: Dies ist die gewöhnliche Bedeutung. Der höfische Kontext kann „Vertraute“ oder „Gefolgsleute“ nahelegen, zwingt aber nicht zu einer solchen Spezifizierung.
