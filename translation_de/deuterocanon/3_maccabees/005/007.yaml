  text: They all called upon the almighty Lord[a], the sovereign over every dominion, their merciful God and Father, with tears and with an unceasing cry, begging him,
translation:
  language: de
  text: 'Sie alle riefen unter Tränen und mit unaufhörlichem Schreien den allmächtigen Herrn, den Herrscher, der über jeden Herrscher herrscht,[a] ihren barmherzigen Gott und Vater, an und baten ihn inständig:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der über jede Herrschaft herrscht“ beziehungsweise „der über jeden Machthaber gebietet“. Im Griechischen stehen hier stammverwandte Wörter für Herrscher und Herrschen; dadurch wird Gottes Überlegenheit über alle Machthaber und Herrschaftsbereiche betont.'
    reason: Lexikalische Mehrdeutigkeit und Wortspiel der Wendung πάσης δυνάστην δυναστεύοντα.
lexical_decisions:
- source_word: παντοκράτορα
  choice: allmächtigen
  rationale: Die geläufige und prägnante Wiedergabe des göttlichen Titels παντοκράτωρ bewahrt dessen Aussage umfassender Macht.
- source_word: κύριον
  choice: Herrn
  rationale: Als Gottesbezeichnung entspricht „Herr“ sowohl dem biblischen Sprachgebrauch als auch dem ehrfürchtigen Gebetskontext.
- source_word: πάσης δυνάστην δυναστεύοντα
  choice: den Herrscher, der über jeden Herrscher herrscht
  rationale: Die Wiedergabe erhält die auffällige Verbindung der stammverwandten griechischen Wörter δυνάστης und δυναστεύω und versteht πάσης umfassend im Sinn jedes Machthabers.
- source_word: ἐλεήμονα
  choice: barmherzigen
  rationale: „Barmherzig“ gibt die religiös geprägte Bedeutung direkt und in würdigem modernem Deutsch wieder.
- source_word: θεὸν αὐτῶν καὶ πατέρα
  choice: ihren barmherzigen Gott und Vater
  rationale: Das Possessivpronomen bezieht sich natürlich auf beide Hauptwörter; die ausdrückliche Vaterbezeichnung bleibt erhalten.
- source_word: δυσκαταπαύστῳ βοῇ
  choice: mit unaufhörlichem Schreien
  rationale: Das Adjektiv bezeichnet einen Schrei, der sich kaum stillen oder zum Aufhören bringen lässt; „unaufhörlich“ vermittelt die anhaltende Dringlichkeit idiomatisch.
- source_word: πάντες
  choice: Sie alle
  rationale: Die Voranstellung bewahrt die kollektive Betonung des griechischen πάντες.
- source_word: μετὰ δακρύων
  choice: unter Tränen
  rationale: Die Formulierung ist anschaulich, natürlich und erhält die emotionale Haltung der Betenden.
- source_word: ἐπεκαλέσαντο
  choice: riefen … an
  rationale: „Anrufen“ ist im Deutschen die übliche Bezeichnung für die betende Hinwendung zu Gott.
- source_word: δεόμενοι
  choice: baten ihn inständig
  rationale: Das begleitende Partizip bezeichnet dringendes, flehentliches Bitten; die Wiedergabe unterscheidet es sprachlich vom vorhergehenden „anrufen“.
theological_decisions:
- issue: Die gehäufte Folge göttlicher Titel und Beschreibungen
  choice: den allmächtigen Herrn, den Herrscher, der über jeden Herrscher herrscht, ihren barmherzigen Gott und Vater
  alternative: den allmächtigen Herrn und Gebieter über alle Macht, ihren barmherzigen Gott und Vater
  rationale: Die gewählte Fassung bewahrt die kumulative Kraft der Titel, die ausdrückliche Vaterbezeichnung und das Wortspiel der stammverwandten Herrschaftsbegriffe, ohne die Aussage auf einen einzigen abstrakten Titel zu verkürzen.
- issue: Bezugsgröße von πάσης in der Herrschaftsformel
  choice: über jeden Herrscher
  alternative: über jede Herrschaft / über alle Macht
  rationale: δυνάστης bezeichnet zunächst einen Machthaber oder Herrscher. Die personenbezogene Wiedergabe bleibt lexikalisch eng am Griechischen; die mögliche allgemeinere Auffassung als Macht oder Herrschaft wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Titelhäufung. Das kräftige „Schreien“ gibt βοή deutlicher wieder als das abgeschwächte „Rufen“. Der Doppelpunkt zeigt, dass der Satz in den folgenden Vers hinein weiterführt.
