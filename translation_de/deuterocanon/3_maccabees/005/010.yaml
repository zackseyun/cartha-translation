translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde gegenüber dem Griechischen leicht entflochten, damit klar bleibt, dass die Elefanten mit Wein und Weihrauch gefüllt beziehungsweise gesättigt waren. Die Art der Verwendung des Weihrauchs bleibt wie im Ausgangstext offen.
