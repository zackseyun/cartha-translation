lexical_decisions:
- source_word: ἀνηλεῖς
  choice: erbarmungslosen
  rationale: Das Adjektiv bezeichnet die Elefanten als mitleidlos und grausam. „Erbarmungslos“ bewahrt diese Personifizierung und die bedrohliche Härte des griechischen Ausdrucks.
- source_word: ποτίσας
  choice: gab ... zu trinken
  rationale: 'Das Partizip bezeichnet eine vorzeitige Handlung Hermons: Er ließ die Elefanten trinken beziehungsweise gab ihnen zu trinken. Die gewählte Formulierung ist im modernen Deutsch natürlich.'
- source_word: πεπληρωμένους τῆς τοῦ οἴνου πολλῆς χορηγίας
  choice: bis sie von der reichlichen Versorgung mit Wein ganz voll ... waren
  rationale: Die Formulierung macht eindeutig, dass die Elefanten, nicht Hermon, gefüllt waren. „Versorgung“ gibt neben der großen Menge auch den Bereitstellungsaspekt von χορηγία wieder; „bis“ stellt den im Kontext naheliegenden erreichten Zustand heraus.
- source_word: τοῦ λιβάνου μεμεστωμένους
  choice: mit Weihrauch gesättigt
  rationale: λίβανος bezeichnet spezifisch Weihrauch. „Gesättigt“ wahrt die starke Vorstellung des vollständigen Erfülltseins, ohne festzulegen, auf welche Weise der Weihrauch verabreicht wurde.
- source_word: ὄρθριος
  choice: früh am Morgen
  rationale: Die Wendung gibt die frühe Tageszeit klar und idiomatisch wieder, ohne sie genauer als der griechische Text auf den Tagesanbruch festzulegen.
- source_word: αὐλήν
  choice: Königshof
  rationale: Im königlichen Zusammenhang kann αὐλή den Hof beziehungsweise den Palastbereich bezeichnen. „Königshof“ passt zum offiziellen Bericht an den König und vermeidet die rein bauliche Verengung auf einen Innenhof.
- source_word: προσαγγεῖλαι
  choice: Bericht zu erstatten
  rationale: Der Infinitiv bezeichnet den Zweck von Hermons Kommen. „Bericht erstatten“ entspricht dem offiziellen, administrativen Zusammenhang.
