  text: But Hermon[a], after giving the savage elephants drink, with them filled from the abundant supply of wine and saturated with frankincense[b], came early in the morning to the court to report these things to the king.
translation:
  language: de
  text: Nachdem Hermon den erbarmungslosen[a] Elefanten zu trinken gegeben hatte, die von reichlich bereitgestelltem Wein ganz voll und mit Weihrauch[b] gesättigt waren, erschien er früh am Morgen am Königshof, um dem König darüber Bericht zu erstatten.
