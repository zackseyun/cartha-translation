  text: When the king considered this[a], and turned to drinking, he ordered those who had come to the banquet to recline around him.
translation:
  language: de
  text: Nachdem der König dies bedacht hatte, wandte er sich dem Trinken zu und befahl denen, die zum Gastmahl gekommen waren, sich rings um ihn zu Tisch zu legen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der letzte Satzteil ist im griechischen Text sprachlich schwer verständlich. Gemeint ist, dass die Gäste in liegender Haltung ihre Plätze beim Mahl in Beziehung zum König einnehmen; statt „rings um ihn“ wäre auch „nahe bei ihm“ möglich.
    reason: textual_variant
lexical_decisions:
- source_word: λογισάμενος
  choice: dies bedacht hatte
  rationale: Das aoristische Medium-Partizip bezeichnet die gedankliche Erwägung des zuvor Berichteten. Die Formulierung wahrt sowohl den Rückbezug als auch die zeitliche Abfolge.
- source_word: τραπεὶς εἰς τὸν πότον
  choice: wandte er sich dem Trinken zu
  rationale: Die Wendung bezeichnet den Übergang zum Trinken beziehungsweise Gelage. Sie bleibt näher am Griechischen als eine Festlegung auf Wein oder Trunkenheit.
- source_word: παραγεγονότας
  choice: denen, die … gekommen waren
  rationale: 'Die Wiedergabe erhält die perfektische Bedeutung: Die Betreffenden waren gekommen und nun anwesend.'
- source_word: ἐπὶ τὴν συμποσίαν
  choice: zum Gastmahl
  rationale: συμποσία bezeichnet hier die gemeinsame Fest- und Trinkgesellschaft. „Gastmahl“ ist würdig, verständlich und durch den unmittelbaren Hinweis auf das Trinken hinreichend bestimmt.
- source_word: ὑπὲρ ἀνακλίνα αὐτοῦ
  choice: sich rings um ihn zu Tisch zu legen
  rationale: Der überlieferte Ausdruck ist syntaktisch schwierig. Die Übersetzung gibt die beim Mahl übliche liegende Haltung und die räumliche Beziehung zum König wieder, ohne eine unsichere technische Rekonstruktion zu erzwingen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu Tisch liegen“ erläutert die antike Körperhaltung beim Mahl knapp im Haupttext; die echte syntaktische Unsicherheit der Schlusswendung bleibt in der Fußnote sichtbar.
