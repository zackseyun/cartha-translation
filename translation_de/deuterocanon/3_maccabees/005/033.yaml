translation:
  language: de
  text: So ertrug Hermon eine unerwartete und gefährliche Drohung; sein Aussehen und sein Gesicht verrieten, dass er eingeschüchtert war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er zog sich in Aussehen und Gesicht zusammen“ beziehungsweise „und sein Aussehen und sein Gesicht wirkten verstört“. Das griechische Verb kann sichtbares Zusammenziehen oder Zurückweichen, Einschüchterung oder innere Erschütterung bezeichnen.'
