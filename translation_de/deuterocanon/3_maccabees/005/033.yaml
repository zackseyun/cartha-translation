lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: Leitet knapp die Folge beziehungsweise die Art des zuvor geschilderten Geschehens ein.
- source_word: ὁ Ἕρμων
  choice: Hermon
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: ἀπροσδόκητον
  choice: unerwartete
  rationale: Bezeichnet etwas, womit nicht gerechnet wurde; „unerwartet“ ist präzise und gegenwärtig.
- source_word: ἐπικίνδυνον
  choice: gefährliche
  rationale: Bewahrt den ausdrücklichen Gedanken der Gefahr, ohne ihn mit dem Substantiv „Drohung“ zu verschmelzen.
- source_word: ὑπήνεγκεν
  choice: musste … hinnehmen
  rationale: Gibt das Ertragen beziehungsweise Erdulden der Drohung natürlich wieder, ohne zu unterstellen, Hermon habe ihr standhaft widerstanden.
- source_word: ἀπειλήν
  choice: Drohung
  rationale: Direkte und idiomatische Entsprechung des griechischen Substantivs.
- source_word: τῇ ὁράσει καὶ τῷ προσώπῳ
  choice: an seinem Äußeren wie an seinem Gesicht
  rationale: Erhält die beiden sichtbaren Bezugspunkte des Griechischen, obwohl sie sich semantisch teilweise überschneiden.
- source_word: συνεστάλη
  choice: war zu sehen, wie eingeschüchtert er war
  rationale: Vermittelt die sichtbare Wirkung des Zusammenfahrens, Zurückweichens oder inneren Bedrängtseins in natürlichem Deutsch; die Mehrdeutigkeit wird in der Fußnote offengelegt.
