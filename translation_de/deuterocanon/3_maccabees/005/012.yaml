  yaml_path: translation/deuterocanon/3_maccabees/005/012.yaml
  text: And by the action of the Sovereign he was overcome with a most pleasant and deep stupor[b][a], having been greatly frustrated in his lawless purpose and utterly disappointed in his unchangeable resolve.
translation:
  language: de
  text: Und durch das Wirken des Gebieters[a] wurde er von einem überaus süßen und tiefen Schlaf überwältigt[b], da er mit seinem gesetzlosen Vorhaben gründlich gescheitert war und sich in seinem unabänderlichen Entschluss völlig getäuscht sah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gebieter“ gibt das griechische δεσπότης wieder, einen Titel, der uneingeschränkte Autorität hervorhebt; auch „Herrscher“ ist möglich.
    reason: alternative_reading
  - marker: b
    text: Die griechischen Adjektive „überaus süß“ und „tief“ stehen ohne ein ausdrücklich genanntes Bezugswort; nach Form und Kontext ist „Schlaf“ zu ergänzen. Das Wirken des Gebieters bezeichnet die bewirkende Macht.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστῳ
  choice: überaus wohltuende
  rationale: Der Superlativ von ἡδύς bezeichnet etwas höchst Angenehmes oder Wohltuendes. „Wohltuend“ bewahrt den auffälligen positiven Klang im Zusammenhang mit dem göttlichen Eingreifen, ohne einen im Griechischen nicht ausdrücklich genannten Schlafzustand einzuführen.
- source_word: βαθεῖ
  choice: tiefe
  rationale: Die Grundbedeutung „tief“ bleibt erhalten; die ungewöhnliche Verbindung mit dem Wirken Gottes wird nicht geglättet.
- source_word: κατεσχέθη
  choice: wurde … überwältigt
  rationale: Das Passiv von κατέχω kann „festhalten“, „ergreifen“ oder „überwältigen“ bedeuten. Hier bezeichnet es, dass das wirksame Eingreifen Gottes ihn vollständig in Gewalt bekam und an der Ausführung hinderte.
- source_word: ἐνεργείᾳ
  choice: Wirken
  rationale: ἐνέργεια meint wirksame Tätigkeit oder Kraftentfaltung. „Wirken“ ist im Deutschen natürlich und lässt offen, in welcher konkreten Weise Gott eingriff.
- source_word: δεσπότου
  choice: des Gebieters
  rationale: „Gebieter“ gibt δεσπότης als Titel uneingeschränkter Autorität wieder und wahrt die lexikalische Unterscheidung zu κύριος, das gewöhnlich mit „Herr“ wiedergegeben wird.
- source_word: ἀθέσμου προθέσεως
  choice: gesetzloses Vorhaben
  rationale: ἀθέσμος bezeichnet etwas, das gegen Recht und Ordnung verstößt; πρόθεσις ist hier das beabsichtigte Vorhaben.
- source_word: πολὺ διεσφαλμένος
  choice: gründlich vereitelt
  rationale: διασφάλλω kann ein Zu-Fall-Bringen, Fehlgehen oder Vereiteln ausdrücken. Im Kontext wird sein beabsichtigtes Vorgehen wirksam zum Scheitern gebracht.
- source_word: ἀμεταθέτου λογισμοῦ
  choice: unabänderlicher Entschluss
  rationale: ἀμετάθετος bezeichnet das nicht zu Ändernde oder nicht Verrückbare; λογισμός meint hier nicht bloß einen Gedanken, sondern seine feststehende Absicht.
- source_word: μεγάλως διεψευσμένος
  choice: sah er sich völlig getäuscht
  rationale: Das passive Partizip von διαψεύδω kann ausdrücken, dass jemand in seiner Erwartung enttäuscht oder durch den Ausgang widerlegt wird. Die Formulierung bewahrt den Bezug auf seine eigene feste Erwartung.
theological_decisions:
- issue: Wiedergabe von δεσπότης als Gottesbezeichnung
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: „Gebieter“ betont die uneingeschränkte Autorität Gottes und unterscheidet den Titel von κύριος. „Herrscher“ wäre ebenfalls möglich, bezeichnet im Deutschen jedoch eher eine politische Rolle.
- issue: Art des göttlich bewirkten Zustands
  choice: wirksames göttliches Eingreifen ohne ausdrückliche Benennung eines Schlaf- oder Erstarrungszustands
  alternative: tiefer, wohltuender Schlaf oder Schlummer
  rationale: Der griechische Satz nennt keinen Schlaf oder Stupor ausdrücklich. Deshalb wird die ungewöhnliche Bildsprache von ἥδιστος, βαθύς, κατέχω und ἐνέργεια bewahrt, ohne den konkreten Zustand dogmatisch oder erzählerisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche positive und räumliche Bildsprache („wohltuend und tief“) bleibt bewusst erkennbar. Der Satz benennt keinen „Schlaf“ oder „Stupor“, da ein entsprechendes Substantiv im griechischen Text fehlt.
