  text: And when this had happened, he urged them, having given themselves over to feasting, to devote the present occasion of the banquet, long honored, to gladness.
translation:
  language: de
  text: Nachdem auch dies geschehen war, forderte er sie auf, sich dem Festmahl hinzugeben und als seit Langem Geehrte einen Teil des gegenwärtigen Gelages der Fröhlichkeit zu widmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz ist stark gedrängt. τὸ παρόν kann „das Gegenwärtige“ oder „der gegenwärtige Anlass“ bedeuten; μέρος „Teil“ oder „Anteil“. Das pluralische Partizip γεραιρομένους bezieht sich grammatisch wahrscheinlich auf die Angeredeten („als seit Langem Geehrte“), seine genaue Einbindung in den Satz bleibt jedoch unsicher.
    reason: syntaktische_und_lexikalische_ambiguität
lexical_decisions:
- source_word: ὃ δὲ καὶ γενομένου
  choice: Nachdem auch dies geschehen war
  rationale: Die Wendung markiert ein bereits abgeschlossenes Ereignis. „Auch“ gibt καί wieder, ohne den nicht näher bestimmten Rückbezug von ὅ zu konkretisieren.
- source_word: παρῄνει
  choice: forderte er sie auf
  rationale: Das Verb bezeichnet ein nachdrückliches Zureden oder Anraten; die gewählte Formulierung ist im Deutschen natürlich und entspricht dem höfisch-erzählenden Zusammenhang.
- source_word: εἰς εὐωχίαν δόντας ἑαυτούς τὸ παρόν
  choice: sich vorerst dem Festmahl hinzugeben
  rationale: εὐωχία bezeichnet festliches Essen und Trinken. τὸ παρόν wird hier adverbial als „vorerst/gegenwärtig“ verstanden; „Festmahl“ vermeidet die stärkere Nebenbedeutung ausschweifender Zecherei.
- source_word: ἐπὶ πολὺ γεραιρομένους
  choice: nachdem sie schon eine ganze Weile festlich bewirtet worden waren
  rationale: Das maskuline Akkusativpartizip bezieht sich grammatisch auf die angesprochenen Personen, nicht auf einen sächlichen „Anlass“. γεραιρόμενοι kann beim Gelage ein ehrenvolles Bewirten bezeichnen; ἐπὶ πολύ hat hier zeitliche Ausdehnung.
- source_word: τῆς συμποσίας … εἰς εὐφροσύνην καταθέσθαι μέρος
  choice: einen Teil des Gelages der Fröhlichkeit zu widmen
  rationale: Die auseinandergezogenen Wörter werden als „einen Teil des Gelages“ zusammengehörig verstanden. καταθέσθαι μέρος ist eine gedrängte Wendung für das Zuweisen oder Bestimmen eines Anteils; εἰς εὐφροσύνην gibt dessen freudigen Zweck an.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Festmahl“ und „Gelage“ bewahren den festlichen Bankettkontext; „festlich bewirtet“ bildet den grammatischen Personenbezug von γεραιρομένους ab, den die englische Beratungsschicht weniger deutlich wiedergibt.
