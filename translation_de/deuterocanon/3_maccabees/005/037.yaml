  text: Then, summoning Hermon with a threat, he said, “How many times must I command you about these very matters, you most wretched man?”
translation:
  language: de
  text: 'Dann ließ er Hermon zu sich rufen und sagte drohend: »Wie oft muss ich dir in genau diesen Angelegenheiten noch Befehle erteilen, du elendster Mensch?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ... Ἕρμωνα
  choice: Hermon
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert und nicht übersetzt.
- source_word: προσκαλεσάμενος
  choice: ließ er ... zu sich rufen
  rationale: Das mediale Aoristpartizip bezeichnet, dass Hermon zu ihm gerufen beziehungsweise vorgeladen wurde; die kausativ formulierte Wiedergabe ist im Deutschen natürlich.
- source_word: μετὰ ἀπειλῆς
  choice: drohend
  rationale: Die Wendung bedeutet wörtlich „mit Drohung“. Das deutsche Adverb gibt den begleitenden drohenden Ton knapp und idiomatisch wieder, ohne die Aussage abzuschwächen.
- source_word: Ποσάκις
  choice: Wie oft
  rationale: Das Frageadverb fragt nach der Häufigkeit und trägt hier den Ton eines ungeduldigen Vorwurfs.
- source_word: δεῖ ... προστάττειν
  choice: muss ich ... Befehle erteilen
  rationale: δεῖ drückt Notwendigkeit aus, während προστάττειν ein autoritatives Anordnen bezeichnet. Das im Griechischen unausgesprochene Subjekt „ich“ ergibt sich eindeutig aus der direkten Rede.
- source_word: σοι
  choice: dir
  rationale: Der Dativ bezeichnet den Empfänger der wiederholt erteilten Befehle.
- source_word: περὶ τούτων αὐτῶν
  choice: wegen genau dieser Dinge
  rationale: αὐτῶν hebt die bereits behandelten Dinge nachdrücklich hervor; „genau dieser“ bewahrt diese Emphase in natürlichem Deutsch.
- source_word: ἀθλιώτατε
  choice: du erbärmlichster Mensch
  rationale: Der vokativische Superlativ von ἄθλιος ist eine scharfe Beschimpfung. Die Wiedergabe erhält sowohl die direkte Anrede als auch die grammatische Steigerung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bewahrt den herrischen, ungeduldigen und beleidigenden Ton des griechischen Textes. Das ergänzte „noch“ macht in der rhetorischen Frage die Wiederholung idiomatisch deutlich, ohne den Sinn zu verändern.
