    rationale: „du erbärmlichster Mensch“ ist im modernen Deutsch keine geläufige oder glatte Anrede. Das griechische ἀθλιώτατε verlangt eine direkt an Hermon gerichtete, deutlich superlativische Beschimpfung; „du elendster Mensch“ leistet dies natürlich.
  - severity: low
    issue: Beziehung von περὶ τούτων αὐτῶν
    rationale: „wegen genau dieser Dinge“ kann einen Grund bezeichnen. περὶ markiert hier den Gegenstandsbereich der Anweisungen. „in genau diesen Angelegenheiten“ gibt diesen Bezug und die emphatische Wiederaufnahme besser wieder.
