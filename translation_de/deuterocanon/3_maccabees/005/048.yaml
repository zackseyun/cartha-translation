  text: But when the Jews saw the elephants coming out to the gate[a], and the dust from the advancing armed force and from the movement of the crowd, and heard a loud tumult,
translation:
  language: de
  text: Als aber die Juden sahen, wie die Elefanten auf das Tor zu herauskamen, und den Staub der nachfolgenden bewaffneten Streitmacht und des Zuges der Menge, und als sie ein tiefes Getöse[a] hörten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen mächtig dröhnenden Lärm. Der griechische Ausdruck betont die Schwere oder tiefe Resonanz des Geräuschs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als aber
  rationale: Gibt sowohl den zeitlichen Anschluss als auch die erzählerische Wendung wieder.
- source_word: τῶν ἐλεφάντων ἐξιόντων ἐπὶ πύλην
  choice: wie die Elefanten auf das Tor zu herauskamen
  rationale: Bewahrt das Herauskommen der Elefanten und die durch ἐπί mit Akkusativ bezeichnete Richtung zum Tor, ohne ihre Ankunft am Tor vorauszusetzen.
- source_word: τῆς ἑπομένης ἐνόπλου δυνάμεως
  choice: der nachfolgenden bewaffneten Streitmacht
  rationale: ἑπομένης bezeichnet die hinter den Elefanten folgende Truppe; „Streitmacht“ gibt den militärischen Sinn von δύναμις natürlich wieder.
- source_word: τῆς τε τοῦ πλήθους πορείας
  choice: des Zuges der Menge
  rationale: πορεία bezeichnet hier das geordnete oder fortschreitende Ziehen; die knappe Genitivfügung erhält die Zuordnung zum Staub.
- source_word: κονιορτόν
  choice: den Staub
  rationale: Entspricht dem konkreten Substantiv, ohne die interpretierende Erweiterung „Staubwolke“.
- source_word: βαρυχῆ θόρυβον
  choice: ein tiefes Getöse
  rationale: „Getöse“ erfasst den lärmenden Tumult, während „tief“ die Schwere und Resonanz von βαρυχής bewahrt.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Bezeichnet in diesem Zusammenhang das jüdische Volk als ethnisch-religiöse Gemeinschaft, nicht bloß Bewohner Judäas.
