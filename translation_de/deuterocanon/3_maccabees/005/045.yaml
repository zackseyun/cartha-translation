- from: Der Elefantenführer aber hatte die Tiere, wie er gesagt hatte, mit stark duftenden Tränken – mit Weihrauch versetztem Wein – beinahe in einen Zustand rasender Wildheit versetzt[a] und sie mit Ausrüstung furchterregend geschmückt[b],
  to: Nachdem aber der Elefantenführer die Tiere, wie er gesagt hatte, mit überaus wohlriechenden Tränken – mit Weihrauch versetztem Wein – beinahe in einen Zustand der Raserei versetzt und sie mit furchterregendem Geschirr geschmückt hatte,
