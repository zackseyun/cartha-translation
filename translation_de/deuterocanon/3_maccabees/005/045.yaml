  text: But the elephant-master[a], after bringing the beasts almost—as he had said—into a frenzied state by very fragrant drinks, with wine mixed with frankincense, and making them terrifyingly adorned with equipment[c][b],
translation:
  language: de
  text: Nachdem aber der Elefantenführer die Tiere, wie er gesagt hatte, mit überaus wohlriechenden Tränken – mit Weihrauch versetztem Wein – beinahe in einen Zustand der Raserei versetzt und sie mit furchterregendem Geschirr geschmückt hatte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: Elefantenführer
  rationale: Bezeichnet den für die Elefanten verantwortlichen Leiter; die deutsche Wiedergabe ist verständlich und bewahrt den funktionalen Amtssinn.
- source_word: τὰ θηρία
  choice: die Tiere
  rationale: Im Zusammenhang sind die Elefanten gemeint. „Tiere“ ist im modernen Deutsch natürlich; die bedrohliche Wirkung ergibt sich aus ihrer rasenden Wildheit und ihrer Ausstattung.
- source_word: σχεδόν
  choice: beinahe
  rationale: Gibt den gewöhnlichen adverbialen Sinn präzise wieder.
- source_word: εἰς κατάστεμα μανιῶδες
  choice: in einen Zustand rasender Wildheit
  rationale: Bewahrt sowohl den Zustandsbegriff von κατάστεμα als auch die unbeherrschte, gefährliche Kraft von μανιῶδες.
- source_word: ἀγιοχὼς
  choice: hatte … versetzt
  rationale: Die überlieferte Form ist schwierig. Aus dem Kontext ergibt sich wahrscheinlich eine vorbereitende Einwirkung des Elefantenführers auf die Tiere; die Wiedergabe bleibt deshalb bewusst funktional.
- source_word: εὐωδεστάτοις πόμασιν
  choice: mit stark duftenden Tränken
  rationale: πόματα sind Getränke beziehungsweise Tränke; der Superlativ von εὐώδης hebt ihren intensiven Wohlgeruch hervor.
- source_word: οἴνῳ λελιβανωμένῳ
  choice: mit Weihrauch versetztem Wein
  rationale: Gibt konkret wieder, dass der Wein mit Weihrauch behandelt oder vermischt worden war, ohne die genaue Zubereitungsweise festzulegen.
- source_word: φοβερῶς κεκοσμημένα
  choice: sie … furchterregend geschmückt
  rationale: Bewahrt die dekorative Bedeutung von κοσμέω und zugleich die Furcht einflößende Wirkung des Adverbs.
- source_word: κατασκευαῖς
  choice: mit Ausrüstung
  rationale: Der weite Ausdruck kann Ausrüstung, Vorrichtungen oder Prunkzeug bezeichnen; „Ausrüstung“ vermeidet eine unnötige Festlegung.
