translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist im Griechischen syntaktisch unvollständig und führt in den folgenden Vers weiter; deshalb endet die Übersetzung mit einem Komma. Die Parenthese zum Wein hält die Zuordnung der duftenden Tränke knapp und lesbar fest.
