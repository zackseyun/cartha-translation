  yaml_path: translation/deuterocanon/3_maccabees/005/029.yaml
  text: 'Hermon was showing them the beasts and all the forces: “They are prepared[a], O king[c][b], according to that intention of yours.”'
translation:
  language: de
  text: 'Hermon und alle Freunde[a] führten die Tiere und die Streitkräfte vor[b]: »Sie sind bereit, König, nach jenem deinem Vorhaben[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Freunden« können hier Angehörige oder Würdenträger des hellenistischen Königshofes gemeint sein.
    reason: cultural_note
  - marker: b
    text: 'Oder: »zeigten die Tiere und die Streitkräfte«; das griechische Imperfekt stellt die Handlung als im Verlauf befindlich dar.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »nach jener deiner Absicht« beziehungsweise »nach jenem deinem Plan«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδείκνυεν
  choice: führten … vor
  rationale: Das Imperfekt bezeichnet eine im Verlauf befindliche Handlung. „Vorführen“ passt zur Präsentation der für den Einsatz bereitstehenden Tiere und Streitkräfte; auch „zeigten“ oder „wiesen auf … hin“ wäre möglich.
- source_word: ὁ Ἕρμων καὶ πάντες οἱ φίλοι
  choice: Hermon und alle Freunde
  rationale: Obwohl das vorangestellte Verb im Singular steht, bilden Hermon und alle Freunde syntaktisch das zusammengesetzte Subjekt. „Freunde“ bewahrt die wörtliche Bezeichnung, ohne die mögliche höfische Funktion im Haupttext festzulegen.
- source_word: τὰ θηρία
  choice: die Tiere
  rationale: Im Zusammenhang sind die zur Tötung vorgesehenen Elefanten gemeint. „Tiere“ ist im modernen Deutschen natürlich und vermeidet die zusätzliche Wertung von „Bestien“.
- source_word: τὰς δυνάμεις
  choice: die Streitkräfte
  rationale: Der Plural bezeichnet militärische Kräfte, lässt aber ihre genaue Zusammensetzung offen. „Streitkräfte“ bildet diese Breite besser ab als das engere „Truppen“.
- source_word: Ἡτοίμασται
  choice: Sie sind bereit
  rationale: Die Perfektform beschreibt den gegenwärtigen Zustand als Ergebnis der Vorbereitung. Das deutsche Prädikativ gibt diesen Resultatszustand knapp wieder.
- source_word: βασιλεῦ
  choice: König
  rationale: Der griechische Vokativ wird als direkte Anrede wiedergegeben. Ein zusätzliches „o“ wäre im heutigen Standarddeutsch unnötig feierlich; „Majestät“ wäre interpretierender.
- source_word: κατὰ τὴν σὴν ἐκείνην πρόθεσιν
  choice: ganz nach jenem Vorhaben von dir
  rationale: πρόθεσις kann Vorhaben, Absicht oder Plan bedeuten; „Vorhaben“ wahrt diese Bedeutungsbreite. „Jenem … von dir“ erhält sowohl die rückverweisende Kraft von ἐκείνην als auch die Hervorhebung durch σὴν.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Anrede bleibt knapp, und der mögliche Fachgebrauch von „Freunde“ wird nur in der Fußnote erläutert. Der Doppelpunkt bewahrt den abrupten Übergang der griechischen Vorlage zur direkten Rede, ohne ein nicht ausdrücklich vorhandenes Redeverb einzufügen.
