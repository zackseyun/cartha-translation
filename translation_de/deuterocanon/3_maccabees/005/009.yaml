lexical_decisions:
- source_word: τούτων
  choice: ihr
  rationale: Der Genitiv des Demonstrativpronomens verweist auf die zuvor genannten Menschen und wird im Deutschen natürlich als Possessivpronomen wiedergegeben.
- source_word: μὲν οὖν
  choice: So
  rationale: Die Partikelverbindung führt den Erzählgang folgernd und zugleich weiterführend fort; „So“ gibt dies knapp und idiomatisch wieder.
- source_word: λιτανία
  choice: Flehen
  rationale: Das Wort bezeichnet eine inständige Bitte. „Flehen“ bewahrt den eindringlichen, bittenden Charakter und ist im heutigen Deutsch natürlicher als „Bittgebet“ oder „Supplication“.
- source_word: ἐκτενῶς
  choice: anhaltend
  rationale: Das Adverb kann Intensität oder zeitliche Erstreckung ausdrücken. „Anhaltend“ wahrt hier die mögliche Dauerbedeutung, ohne die Intensitätsnuance endgültig auszuschließen; die Alternative wird in der Fußnote genannt.
- source_word: ἀνέβαινεν
  choice: stieg … empor
  rationale: Das Imperfekt beschreibt einen fortdauernden Vorgang. Im Deutschen kann diese Verlaufsbedeutung zusammen mit „anhaltend“ natürlich ausgedrückt werden.
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel
  rationale: Im Zusammenhang eines Gebets ist οὐρανός als „Himmel“ zu verstehen; „zum Himmel“ ist die natürliche deutsche Richtungsangabe.
