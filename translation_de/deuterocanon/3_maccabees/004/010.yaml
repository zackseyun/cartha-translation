  text: and with the dense planking above arranged so that[a], their eyes being darkened on every side, they might receive a transport fit for plotters throughout the whole voyage.
translation:
  language: de
  text: Außerdem war über ihnen eine dichte Bretterdecke so angebracht, dass ihnen von allen Seiten die Sicht genommen wurde und sie während der gesamten Seereise wie Verschwörer befördert wurden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie während der gesamten Seereise eine Beförderung erdulden mussten, wie sie Verschwörern zukommt“. Das griechische Wort ἐπίβολοι ist abwertend und kann „Verschwörer“, „Anschlagplaner“ oder allgemeiner „gefährliche Menschen“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθύπερθε
  choice: über ihnen
  rationale: Das Adverb bezeichnet die Lage oberhalb der Gefangenen; „über ihnen“ ist im Deutschen eindeutig und natürlich.
- source_word: πυκνῷ σανιδώματι
  choice: eine dichte Bretterdecke
  rationale: σανίδωμα bezeichnet eine Konstruktion aus Brettern, während πυκνός ihre enge, lichtundurchlässige Anordnung hervorhebt. „Bretterdecke“ gibt im Zusammenhang die über ihnen angebrachte Verschalung anschaulich wieder.
- source_word: διακειμένῳ
  choice: so angebracht
  rationale: Das Partizip beschreibt den angeordneten Zustand der Bretterkonstruktion; die Zweckkonstruktion mit ὅπως zeigt, dass sie gezielt so angebracht worden war.
- source_word: ὅπως πάντοθεν ἐσκοτισμένοι τοὺς ὀφθαλμούς
  choice: dass ihnen von allen Seiten die Sicht genommen wurde
  rationale: Die Wendung bezeichnet den beabsichtigten Entzug von Licht und Sicht aus jeder Richtung. Die natürliche deutsche Formulierung wahrt den Sinn, ohne das griechische Partizip steif nachzubilden.
- source_word: ἀγωγήν
  choice: befördert wurden
  rationale: ἀγωγή bezeichnet hier die Art der erzwungenen Beförderung auf dem Schiff. Die verbale Wiedergabe ist im Deutschen natürlicher als „eine Beförderung erhielten“.
- source_word: ἐπιβόλων
  choice: wie Verschwörer
  rationale: ἐπίβολος ist abwertend und kann einen Menschen bezeichnen, der Anschläge plant oder als gefährlich gilt. „Verschwörer“ bewahrt diese pejorative Bedeutung, ohne sie allgemein zu „Verbrechern“ zu verflachen.
- source_word: ἐν παντὶ τῷ κατάπλῳ
  choice: während der gesamten Seereise
  rationale: κατάπλους bezeichnet eine Fahrt beziehungsweise Passage auf dem Seeweg; die Formulierung gibt zugleich die gesamte zeitliche Ausdehnung wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sperrige wörtliche Verbindung „eine Beförderung der Verschwörer empfangen“ wurde idiomatisch verbal wiedergegeben; die abwertende, möglicherweise vergleichende Einordnung der Gefangenen bleibt erhalten.
