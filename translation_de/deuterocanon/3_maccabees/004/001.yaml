  naturalness: Die Satzperiode ist gut lesbar, doch „Hass ... aufgesprungen war“ ist im Deutschen sehr hart. Die Bildlichkeit kann mit „aufgekeimt“ natürlich wiedergegeben und in der Fußnote als Übersetzungsentscheidung erläutert werden. „Bei den Nichtjuden wurde ... gefeiert“ ist idiomatisch und vermeidet eine nicht erforderliche Zuschreibung von Handlungsträgerschaft.
