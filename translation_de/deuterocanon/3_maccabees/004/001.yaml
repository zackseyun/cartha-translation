base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/001.yaml
  text: And everywhere this decree arrived[a], a public celebration was organized among the nations with shouting and joy[b], as though the hatred long before dancing in their minds against them were now being openly displayed with boldness.
translation:
  language: de
  text: Überall aber, wohin dieser Erlass gelangte, wurde bei den Nichtjuden ein öffentliches Fest mit lautem Jubel und Freude gefeiert, als ob der Hass, der schon lange zuvor in ihrem Denken gegen sie aufgekeimt war,[a] nun unverhohlen zutage trat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene und schwierige griechische Wort zeichnet den Hass bildhaft als etwas, das schon lange zuvor im Inneren in Bewegung geraten oder gleichsam aufgesprungen war; die Wiedergabe „aufgekeimt“ gibt diese Metapher sinngemäß wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντῃ ... ὅπου
  choice: Überall ..., wohin
  rationale: Gibt die räumlich-distributive Wendung idiomatisch und vollständig wieder.
- source_word: προσέπιπτεν ... τὸ πρόσταγμα
  choice: dieser Erlass gelangte
  rationale: Das wörtliche „darauffiel“ bezeichnet hier das Eintreffen beziehungsweise Erreichen eines Ortes durch eine amtliche Anordnung.
- source_word: δημοτελὴς ... εὐωχία
  choice: auf öffentliche Kosten ein Fest
  rationale: δημοτελής bezeichnet wahrscheinlich die öffentliche Finanzierung; εὐωχία ist ein festliches Mahl beziehungsweise Fest. Die Wiedergabe bewahrt diese konkrete Nuance besser als nur „öffentliches Fest“.
- source_word: συνίστατο τοῖς ἔθνεσιν
  choice: veranstalteten die Nichtjuden
  rationale: Das Medium lässt sich als Veranstaltung des Festes durch die bezeichnete Gruppe verstehen. Im jüdischen Erzählzusammenhang meint ἔθνη hier die nichtjüdische Bevölkerung, nicht abstrakt politische Nationen.
- source_word: μετὰ ἀλαλαγμῶν καὶ χαρᾶς
  choice: mit lautem Jubel und Freude
  rationale: ἀλαλαγμός bezeichnet laute Rufe; „lauter Jubel“ passt zum Festkontext, ohne die emotionale Intensität abzuschwächen.
- source_word: προκατεσκιρωμένης
  choice: schon lange zuvor ... aufgesprungen war
  rationale: Die schwierige, bildhafte Form legt ein vorheriges Springen oder Hüpfen nahe. Die ungewöhnliche Metapher wird bewahrt und nicht stillschweigend zu bloßem „Schlummern“ oder „Gären“ geglättet.
- source_word: κατὰ διάνοιαν
  choice: in ihrem Inneren
  rationale: Bezeichnet den inneren Gedanken- und Gesinnungsbereich; die deutsche Formulierung ist natürlich und hält den Gegensatz zur offenen Äußerung fest.
- source_word: μετὰ παρρησίας νῦν ἐκφαινομένης
  choice: nun ... ganz offen zum Vorschein
  rationale: Vereint die öffentliche, unverhohlene Äußerung von παρρησία mit dem Sichtbarwerden in ἐκφαίνω.
theological_decisions:
- issue: Bedeutung von τοῖς ἔθνεσιν im jüdischen Erzählkontext
  choice: die Nichtjuden
  alternative: die Völker
  rationale: Gemeint ist wahrscheinlich die nichtjüdische Bevölkerung im Gegensatz zu den verfolgten Juden. „Nichtjuden“ ist im heutigen Deutsch klarer und weniger kirchlich markiert als „Heiden“, während „Völker“ den konkreten sozialen Gegensatz verwischen könnte.
- issue: Bezug des feindseligen Hasses
  choice: gegen sie
  alternative: ohne ausdrückliches Bezugswort
  rationale: αὐτοῖς kann syntaktisch sowohl zum inneren Bereich als auch zur gegen sie gerichteten Feindschaft in Beziehung stehen; der Kontext verlangt die Feindschaft gegen die Juden. Die Formulierung hält den pronominalen Bezug wie die Vorlage knapp.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzperiode folgt der Bewegung des griechischen Originals, bleibt aber lesbar. Die auffällige Metapher des innerlich „aufspringenden“ Hasses wird bewusst nicht eingeebnet; eine Fußnote erläutert ihre Unsicherheit.
