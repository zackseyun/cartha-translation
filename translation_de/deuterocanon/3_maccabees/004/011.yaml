base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/011.yaml
  text: When they had been brought down to the place called Schedia[a], and the voyage had been completed, as had been decreed by the king, he ordered them to encamp in the hippodrome before the city, an open area excellently suited for making an example of them, lying in full view of all who were traveling down into the city and of those being sent out from there into the country on a journey[b], so that they might neither associate with his forces nor, in general, be deemed worthy of an enclosure.
translation:
  language: de
  text: Nachdem sie zu dem Ort namens Schedia gebracht worden waren und die Fahrt beendet war, wie der König es angeordnet hatte, befahl er, sie auf der Pferderennbahn[a] vor der Stadt zu lagern, einem offenen Gelände, das besonders gut geeignet war, an ihnen ein Exempel zu statuieren. Es lag im Blickfeld aller, die in die Stadt hinabzogen, und aller, die von dort zu Reisen ins Landesinnere aufbrachen. So sollten sie weder mit seinen Truppen in Verbindung kommen noch überhaupt einer Einfriedung für würdig erachtet werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hippodrom“; gemeint ist eine Anlage für Pferderennen.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satz ist sprachlich schwierig. Wahrscheinlich bedeutet er, dass sie von den Truppen des Königs ferngehalten werden und nicht einmal eine umfriedete, schützende Unterkunft erhalten sollen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: Πότιον
  choice: Als … dann
  rationale: Die schwer deutbare Eröffnung wird zurückhaltend als zeitlich-fortführende Verknüpfung mit den folgenden Genitivi absoluti wiedergegeben.
- source_word: Σχεδίαν
  choice: Schedia
  rationale: Der Ortsname wird transliteriert; λεγομένην erscheint als „sogenannten“.
- source_word: ἀχθέντων
  choice: gebracht hatte
  rationale: Das Passiv bezeichnet das erzwungene Verbringen an den Ort; eine unsichere Richtungsangabe wird nicht ergänzt.
- source_word: τὸ παράπλου περαθέντος
  choice: die Fahrt beendet hatte
  rationale: παράπλους bezeichnet hier die Fahrt beziehungsweise Wasserpassage, deren Abschluss περαθέντος ausdrückt.
- source_word: δεδογματισμένον
  choice: angeordnet worden war
  rationale: Die Form bezeichnet eine bereits ergangene amtliche Entscheidung des Königs.
- source_word: ἱπποδρόμῳ
  choice: Pferderennbahn
  rationale: Die verständliche deutsche Bezeichnung gibt den historischen Ort präziser wieder als das weniger geläufige Fremdwort „Hippodrom“.
- source_word: παρεμβαλεῖν
  choice: lagern zu lassen
  rationale: Das Verb bezeichnet das Beziehen beziehungsweise Einrichten eines Lagers; die kausative deutsche Form passt zum königlichen Befehl.
- source_word: ἁπλατῷ καθεστῶτι περιμέτρῳ
  choice: ungeschützte Platz
  rationale: Die textlich und syntaktisch schwierige Wendung wird ihrem Kontext nach als offene, nicht schützende Örtlichkeit verstanden, ohne eine präzise bauliche Gestalt zu behaupten.
- source_word: πρὸς παραδειγματισμὸν
  choice: öffentlich zum abschreckenden Beispiel zu machen
  rationale: Die Wendung verbindet öffentliche Bloßstellung mit exemplarischer, abschreckender Bestrafung.
- source_word: ἄγαν εὐκαιροτάτῳ
  choice: besonders gut geeignet
  rationale: Die starke Intensivierung und die besondere Eignung des Ortes werden in natürlichem Deutsch bewahrt.
- source_word: καταπορευομένοις
  choice: in die Stadt hinabzogen
  rationale: „hinabzogen“ erhält die Richtungsnuance von κατα-, ohne den Vorgang unnatürlich auszudrücken.
- source_word: στελλομένοις πρὸς ἐκδημίαν
  choice: zu einer Reise ins Land aufbrachen
  rationale: Die Form kann ein Entsenden oder Sich-auf-den-Weg-Machen bezeichnen; die neutrale deutsche Fassung erhält das Wegreisen, ohne eine nicht sichere Beauftragung festzuschreiben.
- source_word: τὸ σύνολον
  choice: überhaupt
  rationale: Die adverbiale Wendung verstärkt die vollständige Verweigerung.
- source_word: περιβόλῳ
  choice: umfriedeten Lagers
  rationale: περίβολος bezeichnet eine Umfriedung beziehungsweise einen eingefriedeten Bereich; „Lager“ ergibt sich aus dem Unterbringungskontext.
