revisions:
- from: Als man sie dann zu dem sogenannten Schedia gebracht und die Fahrt beendet hatte, wie es vom König angeordnet worden war, befahl er, sie auf der Pferderennbahn[a] vor der Stadt lagern zu lassen. Dieser ungeschützte Platz war besonders gut geeignet, sie öffentlich zum abschreckenden Beispiel zu machen; denn er lag vor den Augen aller, die in die Stadt hinabzogen, und aller, die von dort zu einer Reise ins Land aufbrachen. So sollten sie weder mit seinen Truppen in Berührung kommen noch überhaupt eines umfriedeten Lagers für würdig erachtet werden.[b]
  to: Nachdem sie zu dem Ort namens Schedia gebracht worden waren und die Fahrt beendet war, wie der König es angeordnet hatte, befahl er, sie auf der Pferderennbahn[a] vor der Stadt zu lagern, einem offenen Gelände, das besonders gut geeignet war, an ihnen ein Exempel zu statuieren. Es lag im Blickfeld aller, die in die Stadt hinabzogen, und aller, die von dort zu Reisen ins Landesinnere aufbrachen. So sollten sie weder mit seinen Truppen in Verbindung kommen noch überhaupt einer Einfriedung für würdig erachtet werden.[b]
  rationale: Die Revision folgt enger der passiven und abgeschlossenen Darstellung der Eingangspartizipien, übersetzt den Ortsnamen neutral und reduziert die Deutung der schwierigen Beschreibung des Hippodroms auf das kontextuell sichere Merkmal seiner Offenheit. Die Fußnote hält die weitergehende Deutung einer verweigerten geschützten Unterbringung ausdrücklich als wahrscheinlich, nicht als gesichert, fest.
  reviewer_model: gpt-5.6-terra
