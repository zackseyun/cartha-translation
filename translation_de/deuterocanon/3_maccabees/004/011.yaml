  source_fidelity: Die Grundstruktur und der Sinn des griechischen Satzes sind weitgehend getroffen. Korrigiert werden sollten jedoch die unnötige agentive Umschreibung der beiden Genitivi absoluti (»man ... beendet hatte«), die bei λεγομένην missverständliche Wiedergabe »sogenannten« sowie die zu stark festgelegte Deutung »ungeschützt« für die schwierige Ortsbeschreibung.
  naturalness: Der Entwurf ist gut verständliches modernes Standarddeutsch. Die überarbeitete Fassung glättet die Eingangskonstruktion, ohne den gehobenen erzählerischen Registerton zu verlieren, und verbindet die Ortsbeschreibung enger mit der Pferderennbahn.
  terminology: »Pferderennbahn« gibt ἱπποδρόμῳ treffend wieder. »Ein Exempel an ihnen zu statuieren« ist für παραδειγματισμός idiomatisch und wahrt den exemplarisch-strafenden Charakter, ohne über den griechischen Wortlaut hinaus eine bestimmte Art der Bestrafung zu benennen. »Einfriedung« gibt περιβόλῳ neutraler wieder als »umfriedetes Lager«.
  issues:
