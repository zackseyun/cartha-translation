    issue: Die Genitivi absoluti werden mit einem unbestimmten handelnden Subjekt wiedergegeben.
    rationale: »Als man sie ... gebracht und die Fahrt beendet hatte« lässt insbesondere die Fahrt aktiv durch »man« beenden. ἀχθέντων und περαθέντος sind dagegen passiv bzw. intransitiv und bezeichnen die erfolgte Überführung und den Abschluss der Passage.
  - severity: low
    issue: »sogenannten Schedia« kann eine distanzierende oder zweifelnde Benennung nahelegen.
    rationale: λεγόμενην bedeutet hier schlicht »genannt« bzw. »namens« und bietet keinen Anlass für die im Deutschen oft wertende Nuance von »sogenannt«.
  - severity: medium
    issue: »ungeschützte Platz« legt eine Schutzlosigkeit als gesicherte Bedeutung fest.
    rationale: Die Wortgruppe ἁπλατῷ καθεστῶτι περιμέτρῳ ist sprachlich schwierig. Der Kontext stützt die Vorstellung eines offenen, öffentlich einsehbaren Ortes; eine ausdrückliche Aussage über fehlenden Schutz sollte im Haupttext nicht behauptet werden.
