translation:
  language: de
  text: Doch sie ließen sich umso erbitterter gegen sie aufbringen, weil diese angeblich im Zusammenhang mit einem Fluchtplan bestochen worden waren; und es stellte sich klar heraus, dass er davon überzeugt worden war.[a]
