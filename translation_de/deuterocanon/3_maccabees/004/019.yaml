lexical_decisions:
- source_word: ἐπείσθησαν
  choice: man ließ sich … einnehmen
  rationale: Der Aorist Passiv von πείθω bezeichnet hier ein Überzeugt- oder Eingenommenwerden. Die unpersönliche deutsche Form gibt den nicht ausdrücklich genannten Urheber wieder und klingt natürlicher als ein wörtliches Passiv im Plural.
- source_word: αὐτοῖς
  choice: gegen sie
  rationale: Der Dativ steht im Zusammenhang mit der gegen die Betroffenen gerichteten Einflussnahme; „gegen sie“ gibt diese nachteilige, politisch-rechtliche Stoßrichtung wieder.
- source_word: σκληρότερον
  choice: umso unerbittlicher
  rationale: Der adverbiale Komparativ von σκληρός beschreibt eine verschärfte, harte Haltung. „Umso unerbittlicher“ bewahrt sowohl die Härte als auch die Steigerung.
- source_word: ὡς δεδωροκημένοις
  choice: weil sie angeblich … bestochen worden waren
  rationale: ὡς kennzeichnet hier den behaupteten Grund und sollte nicht als feststehende Tatsache dargestellt werden. Das Perfektpassiv bezeichnet den Zustand nach einer Bestechung.
- source_word: εἰς μηχανὴν τῆς ἐκφυγῆς
  choice: als Teil eines Fluchtplans
  rationale: μηχανή bezeichnet ein Mittel, Vorhaben oder ausgeklügeltes Verfahren; zusammen mit ἐκφυγή ist „Fluchtplan“ eine knappe, idiomatische Wiedergabe.
- source_word: συνεβῆ
  choice: so kam es
  rationale: Die unpersönliche Wendung bewahrt den Ereignischarakter von συμβαίνω und den Übergang zum Infinitivsatz.
- source_word: σαφῶς
  choice: eindeutig
  rationale: Das Adverb bedeutet „klar, offenkundig“ und verstärkt hier das Überzeugtsein.
- source_word: πιστωθῆναι
  choice: überzeugt wurde
  rationale: Der passive Aoristinfinitiv von πιστόω bezeichnet, dass jemand Gewissheit erlangt beziehungsweise von etwas überzeugt wird; das Passiv des Griechischen bleibt erhalten.
