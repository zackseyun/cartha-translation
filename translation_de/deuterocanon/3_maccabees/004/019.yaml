  naturalness: „Man ließ sich ... gegen sie einnehmen“ ist verständlich, aber in Verbindung mit dem anschließenden „er“ unnötig unklar. „Sie ließen sich ... gegen sie aufbringen“ bewahrt die personale Pluralform und ist in diesem Kontext idiomatisch. Die Formulierung „es stellte sich klar heraus“ glättet die gedrängte Konstruktion, ohne ihren Befund zu verändern.
  terminology: „Fluchtplan“ gibt μηχανὴ τῆς ἐκφυγῆς angemessen wieder. Die vorsichtige Kennzeichnung der Bestechung als behaupteter Grund („angeblich“) ist für ὡς sinnvoll. Keine theologischen oder namensbezogenen Fragen sind betroffen.
