  text: And as prisoners they were dragged by force in public until their embarkation onto the ship[a].
translation:
  language: de
  text: Als Gefangene wurden sie öffentlich mit Gewalt fortgeschleppt, bis man sie auf das Schiff brachte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis man sie in das Schiff hineinstieß“. Der griechische Ausdruck bezeichnet wörtlich ein Hineinbringen oder Hineinstoßen in das Schiff.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιοι
  choice: Als Gefangene
  rationale: Das prädikativ gebrauchte δέσμιοι bezeichnet sie als Gefangene bzw. Gefesselte; die Formulierung ist im modernen Deutsch klar und bewahrt diese Satzfunktion.
- source_word: δημοσίᾳ
  choice: öffentlich
  rationale: Das Adverb bezeichnet hier am natürlichsten den öffentlichen, vor aller Augen stattfindenden Charakter der Misshandlung; die mögliche Bedeutung „auf öffentliche Kosten“ passt nicht zum Zusammenhang.
- source_word: μέχρι τῆς εἰς τὸ πλοῖον ἐμβολῆς
  choice: bis man sie auf das Schiff brachte
  rationale: ἐμβολή bezeichnet wörtlich ein Hineinbringen oder Hineinstoßen. Die verbale Wiedergabe ist natürlich und erhält mit der Fußnote die kräftigere wörtliche Nuance.
- source_word: εἵλκοντο
  choice: wurden sie … fortgeschleppt
  rationale: Die Imperfekt-Passivform schildert einen andauernden erzwungenen Transport. „Fortgeschleppt“ gibt die Härte von ἕλκω im Zusammenhang treffend wieder.
- source_word: μετὰ βίας
  choice: mit Gewalt
  rationale: Die Wendung bezeichnet Zwang und gewaltsames Vorgehen; „mit Gewalt“ ist präzise und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Öffentlich“ steht natürlich adverbial; „fortgeschleppt“ und „mit Gewalt“ bewahren die brutale Zwangssituation, ohne sie auszuschmücken.
