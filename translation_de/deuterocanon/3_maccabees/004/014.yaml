  source_fidelity: 'Die Grundbedeutung wird getroffen: das ganze jüdische Volk soll einzeln registriert werden, nicht zum vorgegebenen Arbeitsdienst, sondern zur vollständigen Vernichtung an einem Tag. »Jeweiligen Arbeiten« fügt jedoch eine Verteilungsnuance hinzu, die der schwierige Ausdruck κατὰ τρόπον nicht eindeutig verlangt. Zudem ist »durch die angeordneten Misshandlungen gefoltert« im Deutschen semantisch tautologisch und bildet die partizipiale Konstruktion weniger klar ab.'
  naturalness: Der Satz ist insgesamt verständlich und im angemessen würdigen Register gehalten. Eine Umstellung der zweiten Zweckbestimmung macht den Zusammenhang von Misshandlungen und Vernichtung idiomatischer. Das Fußnotenzeichen zur schwierigen früheren Zweckbestimmung sollte unmittelbar bei dieser Wortgruppe stehen, nicht erst nach dem ganzen Satz.
