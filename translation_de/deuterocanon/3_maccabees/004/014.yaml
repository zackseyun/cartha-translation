  yaml_path: translation/deuterocanon/3_maccabees/004/014.yaml
  text: and that the whole nation should be registered by name[a], not for the previously indicated brief service according to their work, but, by being tortured with the ordered cruelties[b], to be utterly destroyed in the course of a single day.
translation:
  language: de
  text: und dass das ganze Volk namentlich erfasst werden sollte[a] – nicht für den zuvor angekündigten kurzen Dienst nach Maßgabe der Arbeiten[b], sondern um es, während es den angeordneten Misshandlungen ausgesetzt wurde, innerhalb eines einzigen Tages vollständig zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Name für Name erfasst werden sollte«; die Wendung hebt die Erfassung jedes Einzelnen hervor.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Formulierung ist schwierig. Sie bezeichnet wahrscheinlich einen zuvor angekündigten kurzen Arbeitsdienst als Vorwand, im Gegensatz zum tatsächlichen Plan vollständiger Vernichtung.
    reason: textual_or_syntactical_note
lexical_decisions:
- source_word: ἀπογραφῆναι
  choice: erfasst werden sollte
  rationale: Das Verb bezeichnet eine amtliche Registrierung; »erfasst werden« ist im Deutschen natürlich und bewahrt den administrativen Sinn.
- source_word: πᾶν τὸ φῦλον
  choice: das ganze Volk
  rationale: Im Zusammenhang ist das jüdische Volk als Gesamtheit gemeint; »Volk« vermeidet die modernen staatlichen Nebenbedeutungen von »Nation«.
- source_word: ἐξ ὀνόματος
  choice: namentlich
  rationale: Die Wendung bezeichnet eine Erfassung nach einzelnen Namen; »namentlich« gibt dies knapp und idiomatisch wieder.
- source_word: οὐκ εἰς τὴν ἔμπροσθεν βραχεῖ προδεδηλωμένην τῶν ἔργων κατὰ τρόπον λατρείαν
  choice: nicht für den zuvor angekündigten kurzen Dienst entsprechend den jeweiligen Arbeiten
  rationale: 'Die schwierige Wortfolge wird möglichst nah am Griechischen wiedergegeben: Ein zuvor angekündigter kurzer Arbeitsdienst steht dem tatsächlichen Vernichtungszweck gegenüber. »Jeweiligen« macht die Verteilungsbedeutung von κατὰ τρόπον verständlich, ohne eine konkrete Arbeitsordnung hinzuzusetzen.'
- source_word: στρεβλούμεντας
  choice: gefoltert
  rationale: Das Partizip bezeichnet qualvolles Foltern, möglicherweise auf der Streckbank; die allgemeine Wiedergabe legt kein bestimmtes Instrument fest.
- source_word: παρηγγελμέναις αἰκίαις
  choice: durch die angeordneten Misshandlungen
  rationale: Die Formulierung bewahrt sowohl den befohlenen Charakter als auch die brutale Bedeutung von αἰκίαι.
- source_word: τὸ τέλος ἀφανίσαι
  choice: völlig vernichtet würden
  rationale: ἀφανίζω bezeichnet Vernichten oder Verschwindenlassen; τὸ τέλος verstärkt den Gedanken bis zur vollständigen Auslöschung.
- source_word: μιᾶς ὑπὸ καιρὸν ἡμέρας
  choice: innerhalb eines einzigen Tages
  rationale: Die Wiedergabe bringt die zeitliche Verdichtung auf den Zeitraum eines Tages klar und natürlich zum Ausdruck.
