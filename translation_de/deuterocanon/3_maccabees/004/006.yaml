revisions:
- from: Die jungen Frauen aber, die gerade erst zur Gemeinschaft des Lebens in die Hochzeitskammer eingetreten waren,[a] mussten statt Freude Klage erfahren. Ihr von Duftöl getränktes Haar war mit Staub beschmutzt, und unverhüllt[b] wurden sie fortgeführt. Einmütig stimmten sie statt Hochzeitsliedern einen Trauergesang an, als würden sie durch die Misshandlungen Fremdstämmiger[c] zerrissen.
  to: Die jungen Frauen aber, die gerade erst die Hochzeitskammer betreten hatten, um ihr Leben in der Ehe miteinander zu teilen,[a] hatten statt Freude Klage erfahren. Ihr von Duftöl getränktes Haar war mit Staub beschmutzt, und unverhüllt[b] wurden sie fortgeführt. Einmütig stimmten sie statt Hochzeitsliedern einen Trauergesang an, wie durch Misshandlungen von Menschen eines anderen Volkes zerrissen.[c]
  rationale: Die Revision entfernt die nicht ausgedrückte Modalität, glättet die erste Satzfügung und gibt die knappe, in ihrer genauen Beziehung nicht weiter ausgeführte Schlussformulierung ohne das veraltete „Fremdstämmige“ wieder. Die Bildsprache von mit Staub beschmutztem, geöltem Haar, unverhülltem Fortführen sowie dem Kontrast von Hochzeits- und Trauergesang bleibt erhalten.
