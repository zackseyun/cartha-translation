  yaml_path: translation/deuterocanon/3_maccabees/004/006.yaml
  text: And the young women who had just entered the bridal chamber for the sharing of life in marriage[a], taking up lamentation instead of joy, and with their perfume-drenched hair smeared with dust, were being led away unveiled, and with one accord raised a dirge instead of wedding songs[c][b], as though torn apart by abuse from foreigners.
translation:
  language: de
  text: Die jungen Frauen aber, die gerade erst die Hochzeitskammer betreten hatten, um ihr Leben in der Ehe miteinander zu teilen,[a] hatten statt Freude Klage erfahren. Ihr von Duftöl getränktes Haar war mit Staub beschmutzt, und unverhüllt[b] wurden sie fortgeführt. Einmütig stimmten sie statt Hochzeitsliedern einen Trauergesang an, wie durch Misshandlungen von Menschen eines anderen Volkes zerrissen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ehebett“. Das griechische Wort kann die Hochzeitskammer oder das Ehebett bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unbedeckt“ oder „mit unbedecktem Kopf“; dies ist hier ein Zeichen öffentlicher Demütigung.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „durch Misshandlungen eines anderen Volkes/fremder Art“. Die griechische Formulierung verbindet die Misshandlungen mit dem Begriff „anderes Volk“; ob dabei vor allem ihre Herkunft oder die Täter im Blick sind, bleibt knapp formuliert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς βίου κοινωνίαν
  choice: zur Gemeinschaft des Lebens
  rationale: Bewahrt den Gedanken gemeinsamer Teilhabe am Leben und lässt den ehelichen Zusammenhang durch die Hochzeitskammer deutlich werden.
- source_word: γαμικὸν ... παστόν
  choice: in die Hochzeitskammer
  rationale: Gibt die geläufige Bedeutung von παστός im Hochzeitkontext wieder, ohne sie auf das Ehebett zu verengen.
- source_word: νεάνιδες
  choice: die jungen Frauen
  rationale: Gibt Alter und Geschlecht direkt wieder; dass es sich um junge Bräute handelt, ergibt sich aus dem Kontext.
- source_word: ἀντὶ τέρψεως μεταλαβοῦσαι γόους
  choice: mussten statt Freude Klage erfahren
  rationale: Drückt den erzwungenen Umschlag von festlicher Freude zu Trauer natürlich aus; μεταλαμβάνω wird hier als Anteilbekommen beziehungsweise Erfahren verstanden.
- source_word: μυροβρεχῆ ... κόμην
  choice: ihr von Duftöl getränktes Haar
  rationale: Das Kompositum bezeichnet mit wohlriechender Salbe oder Öl benetztes Haar; „Duftöl“ ist konkret und verständlich, ohne Myrrhe vorauszusetzen.
- source_word: κόνει ... πεφυρμέναι
  choice: war mit Staub beschmutzt
  rationale: Gibt die Verunreinigung des festlich gesalbten Haars idiomatisch wieder.
- source_word: ἀκαλύπτως
  choice: unverhüllt
  rationale: Bewahrt die Bedeutung „ohne Bedeckung/Schleier“ und damit das Bild öffentlicher Bloßstellung.
- source_word: ἀγόμεναι
  choice: wurden sie fortgeführt
  rationale: Die Passivform bezeichnet erzwungenes Wegführen, ohne eine im Verb selbst nicht ausdrückliche Art körperlicher Gewalt hinzuzufügen.
- source_word: θρῆνον ἀνθ᾽ ὑμεναίων
  choice: statt Hochzeitsliedern einen Trauergesang
  rationale: Erhält den scharfen Gegensatz zwischen Hochzeit und Trauer sowie den Charakter beider Ausdrücke als Gesang.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Gibt die gemeinsame, gleichgerichtete Regung der Gruppe knapp und in würdigem Gegenwartsdeutsch wieder.
- source_word: ὡς ἐσπαραγμέναι αἰκίαις ἀλλοεθνεῖσιν
  choice: als würden sie durch die Misshandlungen Fremdstämmiger zerrissen
  rationale: Bewahrt den Vergleich mit körperlichem Zerreißen und versteht den Dativ als Mittel beziehungsweise Urhebersphäre; ἀλλοεθνής bezeichnet Angehörige eines anderen Volkes.
