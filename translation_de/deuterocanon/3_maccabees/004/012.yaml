  text: And when this happened[a], having heard that his fellow countrymen from the city were secretly going out and more frequently slipping away because of the misery of their brothers[c][b],
translation:
  language: de
  text: Als dies geschehen war[a] und er hörte, dass seine Volksgenossen aus der Stadt heimlich hinausgingen und sich häufiger davonstahlen angesichts des Elends ihrer Brüder,
  philosophy: optimal-equivalence
