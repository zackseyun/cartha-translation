lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Als dies geschehen war
  rationale: ὡς mit dem Aorist führt hier einen zeitlichen Umstand ein; δέ verlangt im Deutschen keinen ausdrücklich adversativen Anschluss.
- source_word: ἀκούσας
  choice: und er hörte
  rationale: Das Aoristpartizip wird in einer natürlichen deutschen Satzverknüpfung wiedergegeben. Das im Griechischen nur aus dem Zusammenhang erkennbare Subjekt wird als „er“ ausgedrückt.
- source_word: τοὺς ἐκ τῆς πόλεως ὁμοεθνεῖς
  choice: seine Volksgenossen aus der Stadt
  rationale: ὁμοεθνεῖς bezeichnet Angehörige desselben Volkes. „Volksgenossen“ bewahrt diesen ethnisch-nationalen Sinn, ohne ihn auf Staatsangehörigkeit zu verengen.
- source_word: κρυβῇ ἐκπορευομένους
  choice: heimlich hinausgingen
  rationale: κρυβῇ ist adverbial („heimlich“), während ἐκπορευομένους die Bewegung aus der Stadt heraus bezeichnet.
- source_word: πυκνότερον
  choice: immer häufiger
  rationale: Der Komparativ bezeichnet im Zusammenhang am ehesten eine zunehmende Häufigkeit der heimlichen Abgänge.
- source_word: ὑποδιδράσκειν
  choice: sich davonstahlen
  rationale: Das Verb bezeichnet ein heimliches Entweichen; „sich davonstehlen“ erhält den verstohlenen Charakter.
- source_word: τὴν ... ταλαιπωρίαν
  choice: angesichts des Elends
  rationale: Die überlieferte Wortfolge ist schwierig. Diese Wiedergabe bringt den erkennbaren Zusammenhang mit der Not der Brüder zum Ausdruck, ohne eine eindeutig kausale Beziehung stärker festzulegen, als der beschädigte beziehungsweise dunkle Text erlaubt.
- source_word: τῶν ἀδελφῶν
  choice: ihrer Brüder
  rationale: Die konkrete Verwandtschafts- und Solidaritätsbezeichnung wird beibehalten; „ihrer“ verdeutlicht idiomatisch den Bezug.
- source_word: ἰχθεῖ
  choice: nicht eigenständig wiedergegeben; durch die kontextuelle Wendung „angesichts des Elends“ berücksichtigt
  rationale: Die überlieferte Form ἰχθεῖ ist an dieser Stelle lexikalisch beziehungsweise textlich problematisch und ermöglicht keine sichere wörtliche Übersetzung.
