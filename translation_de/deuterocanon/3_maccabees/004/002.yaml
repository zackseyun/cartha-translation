  text: But for the Jews there was unspeakable grief and an all-lamenting cry with tears, while their heart, burning on every side with groanings, bewailed the destruction unexpectedly and suddenly decreed against them.
translation:
  language: de
  text: Bei den Juden aber herrschte unaussprechliche Trauer, und unter Tränen erhob sich ein Schrei, ganz erfüllt von Wehklage.[a] Von Seufzern war ihr Herz ringsum entflammt, während sie das unvermutete Verderben beklagten, das plötzlich über sie verhängt wurde.
