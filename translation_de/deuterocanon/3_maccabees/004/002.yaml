lexical_decisions:
- source_word: ἄλεκτον
  choice: unaussprechliche
  rationale: Bezeichnet etwas, das sich nicht in Worte fassen lässt, und bewahrt die starke rhetorische Wirkung.
- source_word: πένθος
  choice: Trauer
  rationale: Gibt tiefe Trauer beziehungsweise Klage natürlich und würdig wieder, ohne den Ausdruck unnötig zu ritualisieren.
- source_word: πανόδυρτος
  choice: ganz erfüllt von Wehklage
  rationale: Das seltene, stark intensivierende Kompositum wird verständlich wiedergegeben, ohne eine unnatürliche deutsche Wortneuschöpfung zu bilden.
- source_word: βοή
  choice: Schrei
  rationale: Bezeichnet hier einen lauten Ausdruck der Not; „Schrei“ ist direkt und kontextgemäß.
- source_word: στεναγμοῖς
  choice: von Seufzern
  rationale: Bewahrt die körperlich hörbare Äußerung des Leids und lässt den Dativ als Ursache beziehungsweise Mittel offen.
- source_word: πεπυρωμένης
  choice: entflammt
  rationale: Erhält das metaphorische Feuerbild der inneren Qual in gehobenem, aber verständlichem Deutsch.
- source_word: πάντοθεν
  choice: ringsum
  rationale: Gibt die umfassende, von allen Seiten bedrängende Intensität knapp wieder.
- source_word: καρδίας
  choice: Herz
  rationale: Bewahrt das biblisch und allgemein verständliche Bild für das innere Empfinden.
- source_word: ὀλοφυρομένων
  choice: während sie … beklagten
  rationale: Gibt die fortdauernde aktive Wehklage des Partizips in natürlicher deutscher Syntax wieder.
- source_word: ἀπροσδόκητον
  choice: unvermutete
  rationale: Kennzeichnet das Verderben als nicht erwartet, ohne den Ausdruck mit ἐξαίφνης zusammenzuziehen.
- source_word: ἐξαίφνης
  choice: plötzlich
  rationale: Bewahrt neben der Unerwartetheit ausdrücklich auch das Moment des jähen Eintretens.
- source_word: ἐπικριθεῖσαν
  choice: über sie verhängt
  rationale: Vermittelt den amtlich-richterlichen Sinn eines gegen sie ergangenen Beschlusses in idiomatischem Deutsch.
- source_word: ὀλεθρίαν
  choice: Verderben
  rationale: Das substantivisch gebrauchte feminine Adjektiv bezeichnet hier eine vernichtende Katastrophe; „Verderben“ bewahrt die starke und offene Formulierung.
