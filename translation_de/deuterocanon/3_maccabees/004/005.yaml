  yaml_path: translation/deuterocanon/3_maccabees/004/005.yaml
  text: For an old man was being led along[a], full of gray hair, bent over by the weakness in his feet that comes with age, driven by the violent force of being thrown down[c][b], making use of a swift march without any regard for all dignity.
translation:
  language: de
  text: Denn da wurde ein Greis abgeführt[a], das Haar ganz ergraut, von der altersbedingten Schwerfälligkeit seiner Füße tief gebeugt. Unter gewaltsamem Stoßen, das ihn zu Fall zu bringen drohte[b], zwang man ihn ohne jede Rücksicht auf seine Würde zu einem raschen Marsch[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde fortgetrieben“. Das griechische Imperfekt schildert den Vorgang als andauernd.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung ist stark verdichtet und schwierig. Sie kann auch eine gewaltsame Bewegung bezeichnen, durch die er umgestoßen oder taumelnd vorwärtsgetrieben wurde.
    reason: source_ambiguity
  - marker: c
    text: 'Wörtlicher etwa: „wobei er sich eines raschen Weges bediente“. Im Zusammenhang ist jedoch klar, dass ihm dieses hohe Tempo aufgezwungen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγετο
  choice: wurde abgeführt
  rationale: Das Imperfekt Passiv beschreibt einen andauernden, von anderen bestimmten Vorgang. „Abgeführt“ gibt die erzwungene Bewegung in natürlichem Deutsch wieder.
- source_word: γέρων
  choice: Greis
  rationale: Gemeint ist ein hochbetagter Mann, nicht ein Amtsältester. „Greis“ passt zum würdevollen, zugleich eindringlichen Erzählton.
- source_word: πλήρης πολιᾶς
  choice: das Haar ganz ergraut
  rationale: Die Wendung hebt sein sichtbar hohes Alter hervor; die deutsche Formulierung bewahrt das Bild ohne unnatürliche Wörtlichkeit.
- source_word: πεπυκασμένος … ἐπικύφων
  choice: tief gebeugt
  rationale: Die schwer deutbare erste Partizipialform und ἐπικύφων zeichnen zusammen seine zusammengesunkene, gebeugte Haltung. Die Übersetzung vermeidet eine künstliche Verdoppelung.
- source_word: τὴν ἐκ τοῦ γήρως νωθρίτητα ποδῶν
  choice: von der altersbedingten Schwerfälligkeit seiner Füße
  rationale: νωθρίτης bezeichnet Trägheit, Schwerfälligkeit oder Schwäche. „Schwerfälligkeit“ hält den Bezug zur verlangsamten Bewegung fest.
- source_word: ἀνατροπῆς ὁρμῇ βιαίας
  choice: unter gewaltsamem Stoßen, das ihn zu Fall zu bringen drohte
  rationale: Die stark verdichtete Wendung verbindet gewaltsamen Antrieb mit Umstürzen oder Zu-Fall-Kommen. Diese Fassung wahrt die Unsicherheit, ohne einen politischen Sinn von „Umsturz“ einzutragen.
- source_word: ἁπάσης αἰδοῦς ἄνευ
  choice: ohne jede Rücksicht auf seine Würde
  rationale: αἰδώς kann Scham, Achtung oder Anstand bezeichnen. Im Kontext steht die ehrfurchtslose Behandlung des alten Mannes im Vordergrund; ἁπάσης wird durch „jede“ wiedergegeben.
- source_word: πρὸς ὀξεῖαν καταχρώμενος πορείαν
  choice: zwang man ihn … zu einem raschen Marsch
  rationale: Der Zusammenhang ist eindeutig erzwungen. Die aktive unpersönliche Form macht im Deutschen verständlich, dass der gebrechliche Mann die schnelle Fortbewegung nicht freiwillig wählte.
