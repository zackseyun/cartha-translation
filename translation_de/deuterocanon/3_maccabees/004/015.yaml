  yaml_path: translation/deuterocanon/3_maccabees/004/015.yaml
  text: So the registration of these people was carried out with bitter urgency and zealous exertion[a], from the rising of the sun to its setting[c][b], reaching no completion for forty days.
translation:
  language: de
  text: So wurde ihre Erfassung[a] mit bitterem Eifer und ehrgeizigem Einsatz betrieben, vom Aufgang der Sonne bis zu ihrem Untergang[b], ohne selbst nach vierzig Tagen zum Abschluss zu kommen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Registrierung“ beziehungsweise „amtliche Aufnahme“; gemeint ist die Eintragung in eine offizielle Liste.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen „von den Aufgängen der Sonne bis zu den Untergängen“; gemeint ist die ununterbrochene Arbeit den ganzen Tag hindurch.
    reason: cultural_note
  - marker: c
    text: Der griechische Ausdruck besagt, dass der Vorgang auch innerhalb von vierzig Tagen nicht zum Abschluss kam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογραφὴ
  choice: Erfassung
  rationale: Das Substantiv bezeichnet hier die amtliche Aufnahme in eine Liste. „Erfassung“ passt zum Verwaltungsvorgang, ohne wie „Volkszählung“ eine umfassende Zählung der Bevölkerung vorauszusetzen.
- source_word: πικρᾶς σπουδῆς
  choice: mit bitterem Eifer
  rationale: σπουδή kann Eifer, Ernst oder Eile bezeichnen; πικρός verleiht dem Ausdruck im bedrückenden Kontext eine bittere, harte Färbung. „Bitterer Eifer“ bewahrt diese Mehrdeutigkeit besser als eine einseitige Festlegung auf bloße Eile.
- source_word: φιλοτίμου προσθεσίας
  choice: ehrgeizigem Einsatz
  rationale: φιλοτίμος kann von Eifer, Ehrgeiz oder Streben nach Anerkennung sprechen, während προσθεσία den aufgewandten beziehungsweise zusätzlichen Einsatz bezeichnet. Die Wiedergabe erhält sowohl die Tatkraft als auch den möglichen Beiklang des Ehrgeizes.
- source_word: ἀπὸ ἀνατολῶν ἡλίου μέχρι δυσμῶν
  choice: vom Aufgang der Sonne bis zu ihrem Untergang
  rationale: Die bildhafte Zeitangabe bezeichnet die Arbeit während des ganzen Tages. Die Formulierung bewahrt das Bild des griechischen Ausdrucks.
- source_word: ἀνήνυτον λαμβάνουσα τὸ τέλος ἐπὶ ἡμέρας τεσσεράκοντα
  choice: ohne selbst nach vierzig Tagen zum Abschluss zu kommen
  rationale: ἀνήνυτος bezeichnet etwas Unvollendetes oder nicht zum Ziel Gebrachtes. Die deutsche Formulierung gibt natürlich wieder, dass der Vorgang auch im Verlauf von vierzig Tagen nicht beendet wurde.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt erzählerisch gehoben, aber allgemein verständlich. „Bitterer Eifer“ und „ehrgeiziger Einsatz“ erhalten die ungewöhnliche, spannungsreiche Charakterisierung der Durchführung, ohne sie vorschnell nur als Hast oder nur als Grausamkeit auszulegen.
