  terminology: „Erfassung“ ist für den administrativen Vorgang passend und wird durch die Fußnote sinnvoll präzisiert. Die Fußnoten sind idiomatisch formuliert, ihre Marker stehen an den einschlägigen Stellen, und sie führen keine sachlich über die griechische Aussage hinausgehende Deutung ein.
