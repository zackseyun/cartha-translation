translation:
  language: de
  text: Dabei erklärten sie unter Vorlage von Belegen, dass selbst das Papyrusmaterial und die Rohrfedern[a], die sie benutzt hatten, bereits aufgebraucht seien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Schreibrohre« beziehungsweise »zum Schreiben bestimmte Rohre«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγόντων
  choice: Dabei erklärten sie
  rationale: Das Partizip im Genitiv führt den berichteten Vorgang weiter. »Erklärten« passt zu einer förmlich vorgebrachten und belegten Aussage; »dabei« bildet den anschließenden Charakter der Konstruktion im Deutschen natürlich ab.
- source_word: μετὰ ἀποδείξεως
  choice: unter Vorlage von Belegen
  rationale: ἀπόδειξις bezeichnet Nachweis, Beweis oder Darlegung. Die Formulierung macht deutlich, dass die Behauptung nicht bloß aufgestellt, sondern belegt wurde.
- source_word: τὴν χαρτηρίαν
  choice: der Papyrus
  rationale: Gemeint ist das aus Papyrus bestehende Schreibmaterial. »Papyrus« wahrt den historischen Sachbezug besser als das anachronistisch wirkende »Papier«.
- source_word: τοὺς γραφικοὺς καλάμους
  choice: die Schreibrohre
  rationale: Die Wendung bedeutet wörtlich »zum Schreiben bestimmte Rohre«. Die sachlich idiomatischere Wiedergabe »Schreibfedern« wird in der Fußnote genannt.
- source_word: ἐν οἷς ἐχρῶντο
  choice: die sie benutzt hatten
  rationale: Das Imperfekt bezeichnet den fortdauernden Gebrauch in der vorausliegenden Situation. Das deutsche Plusquamperfekt ordnet diesen Gebrauch zeitlich vor der berichteten Erklärung ein.
- source_word: ἐκλελοιπέναι
  choice: bereits ausgegangen seien
  rationale: Der Perfektinfinitiv von ἐκλείπω bezeichnet hier den schon eingetretenen Mangel beziehungsweise die vollständige Erschöpfung des Materials. Der Konjunktiv gibt die indirekte Rede wieder.
