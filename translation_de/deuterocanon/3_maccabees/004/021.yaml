  yaml_path: translation/deuterocanon/3_maccabees/004/021.yaml
  text: But this was the invincible working of the providence from heaven of the one helping the Jews[a].
translation:
  language: de
  text: Doch dies war das unüberwindliche Wirken der vom Himmel kommenden Fürsorge dessen, der den Juden hilft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wenn „vom Himmel“ auf das Helfen bezogen wird: „Doch dies war das unüberwindliche Wirken der Fürsorge dessen, der den Juden vom Himmel her hilft.“'
    reason: Die griechische Wortstellung erlaubt eine Zuordnung von ἐξ οὐρανοῦ sowohl zur Fürsorge als auch zu dem, der den Juden hilft.
lexical_decisions:
- source_word: ἐνέργεια
  choice: Wirken
  rationale: Das Substantiv bezeichnet wirksame Tätigkeit oder Kraftentfaltung. „Wirken“ ist im Deutschen natürlich und gibt den aktiven Sinn wieder, ohne den Ausdruck vorschnell als Wunderbegriff festzulegen.
- source_word: προνοίας
  choice: Fürsorge
  rationale: Hier geht es um schützende, lenkende Fürsorge göttlichen Ursprungs. „Fürsorge“ bewahrt diesen Sinn und ist für heutige Leser verständlicher als das stärker fachsprachliche „Vorsehung“.
- source_word: τοῦ βοηθοῦντος
  choice: dessen, der … hilft
  rationale: Das substantivierte Partizip im Genitiv bleibt als indirekte Bezeichnung wiedergegeben; Gott wird nicht ausdrücklicher benannt als im Griechischen.
- source_word: τοῖς Ἰουδαίοις
  choice: den Juden
  rationale: Gemeint ist hier das jüdische Volk als ethnisch-religiöse Gemeinschaft, nicht lediglich die Bewohner Judäas.
- source_word: ἐξ οὐρανοῦ
  choice: vom Himmel her
  rationale: Die Wendung bezeichnet den himmlischen beziehungsweise göttlichen Ursprung der Hilfe und bleibt nahe an der griechischen Präpositionalphrase.
- source_word: ἀνίκητον
  choice: unüberwindlich
  rationale: Das Adjektiv betont, dass dieses Wirken durch keine Gegenmacht überwunden werden konnte. „Unüberwindlich“ ist idiomatisch und bewahrt die Stärke des Ausdrucks.
theological_decisions:
- issue: Bezug von „dessen, der den Juden vom Himmel her hilft“
  choice: Der Gottesbezug bleibt implizit und wird durch eine substantivische Umschreibung ausgedrückt.
  alternative: „Gottes, der den Juden vom Himmel her hilft“ oder „des Helfers der Juden“
  rationale: Der griechische Text nennt Gott nicht ausdrücklich, sondern verwendet ein substantiviertes Partizip. Die Übersetzung wahrt diese indirekte Ausdrucksweise und lässt den im Kontext naheliegenden Gottesbezug bestehen.
- issue: Zuordnung von ἐξ οὐρανοῦ
  choice: „vom Himmel her“ wird syntaktisch auf das Helfen bezogen.
  alternative: 'Die Wendung kann als nähere Bestimmung der Fürsorge verstanden werden: „der vom Himmel kommenden Fürsorge“ beziehungsweise „der Fürsorge aus dem Himmel“.'
  rationale: Die griechische Wortstellung lässt eine gewisse strukturelle Mehrdeutigkeit zu. Der Haupttext folgt der naheliegenden Verbindung mit βοηθοῦντος; die Fußnote macht die alternative Zuordnung sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ stellt den kontrastierenden Anschluss her; „Wirken“ und „Fürsorge“ bleiben verständlich, ohne die theologische Aussage stärker festzulegen als der griechische Text.
