base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/003.yaml
  text: What district[a], or city, or indeed what inhabited place at all, or what streets[b], were not filled with mourning and lamentation over them?
translation:
  language: de
  text: Welcher Bezirk oder welche Stadt, ja überhaupt welcher beklagenswerte Ort oder welche Straßen waren nicht von Klage[a] und Wehgeschrei über sie erfüllt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für »Klage« kann besonders eine rituelle Trauerbekundung bezeichnen, zu der auch das Schlagen an die Brust gehörte.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομός
  choice: Bezirk
  rationale: Das Wort bezeichnet im hellenistischen Sprachgebrauch häufig einen Verwaltungsbezirk; »Bezirk« passt zur Abstufung der genannten Ortsgrößen.
- source_word: πόλις
  choice: Stadt
  rationale: Die gewöhnliche Bedeutung des griechischen Begriffs wird im Deutschen unmittelbar und natürlich wiedergegeben.
- source_word: τὸ σύνολον
  choice: ja überhaupt
  rationale: Die Wendung erweitert und verstärkt hier rhetorisch den Geltungsbereich der Frage; »ja überhaupt« gibt diese Funktion idiomatisch wieder.
- source_word: οἰκτιστὸς τόπος
  choice: bewohnte Ort
  rationale: Das überlieferte Adjektiv ist ungewöhnlich. Im Zusammenhang liegt die Bedeutung eines bewohnten oder besiedelten Ortes nahe; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: ἀγυιαί
  choice: Straßen
  rationale: Gemeint sind öffentliche Straßen innerhalb bewohnter Orte; »Straßen« ist die natürliche moderne Entsprechung.
- source_word: κοπετοῦ
  choice: Trauer
  rationale: Der Begriff bezeichnet Trauerbekundung und kann insbesondere rituelles Klagen mit Schlagen an die Brust einschließen. Im Haupttext wahrt »Trauer« einen natürlichen, umfassenden Sinn; die speziellere Nuance steht in der Fußnote.
- source_word: γόων
  choice: Wehklagen
  rationale: Das Wort hebt hörbare Klagerufe hervor. »Wehklagen« unterscheidet diese Nuance klar von der allgemeineren »Trauer« und bewahrt den gehobenen Ton.
- source_word: ἐπʼ αὐτοῖς
  choice: um sie
  rationale: Die Präposition mit Dativ bezeichnet hier die Personen als Gegenstand beziehungsweise Anlass der Trauer; »um sie« ist dafür die idiomatische deutsche Formulierung.
- source_word: οὐκ ἐνεπιπλῶντο
  choice: waren nicht ... erfüllt
  rationale: Das Imperfekt Passiv beschreibt, dass die aufgezählten Orte von Trauer und Wehklagen erfüllt waren. Der Plural richtet sich nach der zusammenfassenden Aufzählung und besonders nach »Straßen«.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Ton. Die rhetorische Frage und die Steigerung vom Bezirk über Stadt und bewohnten Ort bis zu den Straßen bleiben erhalten; »ja überhaupt« vermittelt die verstärkende Funktion von τὸ σύνολον.
