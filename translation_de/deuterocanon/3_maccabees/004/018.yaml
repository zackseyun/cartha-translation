  text: even though most were still in the country—some still assembled in their houses[b][a], and others also in the place—since the situation had become impossible for all the generals over Egypt.
translation:
  language: de
  text: obwohl die meisten noch im Land waren[a] – die einen noch in den Häusern versammelt, die anderen auch an dem Ort[b] –, da die Lage für alle für Ägypten zuständigen Befehlshaber unmöglich geworden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die meisten noch überall im Land waren«.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung »die anderen auch an dem Ort« ist im Griechischen elliptisch und kann sich auf andere beziehen, die an einem bestimmten Ort oder öffentlichen Platz versammelt waren.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: obwohl
  rationale: Gibt die konzessive Bedeutung der Partikel natürlich und knapp wieder.
- source_word: ὄντων ἔτι κατὰ τὴν χώραν τῶν πλειόνων
  choice: die meisten noch im Land waren
  rationale: Gibt den Genitivus absolutus und τῶν πλειόνων als Mehrheit wieder; χώρα bezeichnet hier allgemein das Land bzw. Landesgebiet.
- source_word: τῶν μὲν κατὰ τὰς οἰκίας ἔτι συνεστηκότων
  choice: die einen noch in den Häusern versammelt
  rationale: Bewahrt die Gegenüberstellung μὲν … δὲ und versteht συνεστηκότων als versammelt bzw. zusammengeschlossen; der Plural ‚in den Häusern‘ lässt die verteilende Bedeutung offen.
- source_word: τῶν δὲ καὶ κατὰ τὸν τόπον
  choice: die anderen auch an dem Ort
  rationale: Die knappe, elliptische Formulierung des Griechischen bleibt erkennbar; es wird kein bestimmter öffentlicher oder örtlicher Bezug ergänzt, den der Text nicht ausdrücklich nennt.
- source_word: ὡς ἀδυνάτου καθεστῶτος
  choice: da die Lage … unmöglich geworden war
  rationale: ὡς wird kausal verstanden; καθεστῶτος beschreibt den eingetretenen Zustand. ‚die Lage‘ macht das im Griechischen nur implizite Sachverhältnis idiomatisch sichtbar.
- source_word: πᾶσιν τοῖς ἐπ᾽ Αἴγυπτον στρατηγοῖς
  choice: für alle Befehlshaber über Ägypten
  rationale: ‚Befehlshaber‘ gibt στρατηγοί ohne unnötige Festlegung auf einen ausschließlich militärischen Rang wieder; ‚über Ägypten‘ bewahrt den Gedanken der Zuständigkeit bzw. Autorität.
