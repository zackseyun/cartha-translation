base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/016.yaml
  text: And the king[a], greatly and continually filled with joy, was arranging banquets before all the idols, with a mind far removed from the truth and with a profane mouth, praising deaf things that were unable to speak or help them[b], but speaking improper things against God.
translation:
  language: de
  text: Der König aber war überaus und fortwährend von Freude erfüllt und veranstaltete Festmähler vor allen Götzenbildern[b]. Mit einem Sinn, der weit von der Wahrheit entfernt war, und mit frevelhaftem Mund pries er taube Dinge, die weder zu ihnen sprechen noch ihnen helfen konnten; gegen Gott[a] aber redete er Ungehöriges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter „Gott“ stehen in der griechischen Quellenausgabe in eckigen Klammern und gelten daher als textlich unsicher; dem Zusammenhang nach richtet sich die ungehörige Rede gegen Gott.
    reason: textual_variant
  - marker: b
    text: 'Oder: „zu Ehren aller Götzenbilder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεγάλως δὲ καὶ διηνεκῶς
  choice: überaus und unablässig
  rationale: Die beiden Adverbien bezeichnen das hohe Maß und die fortdauernde Art der Freude. Die Wiedergabe ist prägnant, gehoben und im modernen Deutsch verständlich.
- source_word: συμπόσια
  choice: Festgelage
  rationale: Das Wort bezeichnet festliche Mahl- und Trinkgemeinschaften. „Festgelage“ passt zum königlichen und kultischen Zusammenhang, ohne den Ausdruck auf bloße Trinkgelage zu verengen.
- source_word: ἐπὶ πάντων τῶν εἰδώλων
  choice: vor allen Götzen
  rationale: Die räumlich-kultische Grundbedeutung der Präposition bleibt erhalten. Eine Wiedergabe wie „zu Ehren aller Götzen“ wäre möglich, würde den Zweck jedoch ausdrücklicher festlegen als der griechische Wortlaut.
- source_word: πεπληρωμένῃ πόρρω τῆς ἀληθείας φρενί
  choice: mit einem Sinn, der weit von der Wahrheit entfernt war
  rationale: φρήν bezeichnet hier die innere Haltung beziehungsweise das Denken. Die deutsche Formulierung gibt den Sinn natürlich wieder, ohne die schwierige Konstruktion mechanisch nachzuahmen.
- source_word: βεβήλῳ στόματι
  choice: mit entheiligtem Mund
  rationale: βεβήλος beschreibt das Profane, Unheilige oder religiös Frevelhafte. „Entheiligt“ bewahrt den kultisch-religiösen Gehalt und klingt im Deutschen weniger missverständlich als „profan“.
- source_word: κωφὰ
  choice: taube Wesen
  rationale: Das substantivierte Neutrum bleibt rhetorisch abwertend und nennt die Götzen nicht erneut ausdrücklich. „Wesen“ vermeidet das im Deutschen unnötig grobe „Dinge“, ohne ihnen wirkliche Lebendigkeit zuzuschreiben.
- source_word: μὴ δυνάμενα αὐτοῖς λαλεῖν ἢ ἀρήγειν
  choice: die weder zu ihnen sprechen noch ihnen helfen konnten
  rationale: Die Unfähigkeit der Götzen wird klar und unmittelbar ausgedrückt. Das Pronomen „ihnen“ erhält den Bezug des griechischen αὐτοῖς, ohne seine im Einzelsatz nicht näher bezeichnete Referenz zu ergänzen.
- source_word: ἐπαινῶν
  choice: pries
  rationale: „Preisen“ entspricht dem religiös gefärbten Lob und erhält den Kontrast zur frevelhaften Rede gegen Gott.
- source_word: εἰς δὲ [τὸν θεὸν]
  choice: gegen Gott aber
  rationale: Im feindseligen Zusammenhang hat εἰς bei dem Verb des Redens adversative Kraft. Die Unsicherheit der eingeklammerten Wörter in der Quellenausgabe wird in einer Fußnote offengelegt.
- source_word: τὶ μὴ καθήκοντα
  choice: Ungehöriges
  rationale: Die substantivierte Formulierung gibt knapp wieder, dass der König Dinge äußerte, die sich nicht gehörten beziehungsweise nicht angemessen waren.
theological_decisions:
- issue: Richtung und Charakter der Rede des Königs in Bezug auf Gott
  choice: gegen Gott aber äußerte er Ungehöriges
  alternative: über Gott aber äußerte er Ungehöriges
  rationale: Der Zusammenhang stellt das Lob der Götzen der respektlosen Rede gegenüber Gott entgegen. „Gegen Gott“ bewahrt diese feindselige Gegenüberstellung, ohne den Inhalt der Äußerungen auszumalen.
- issue: Bezeichnung der machtlosen Götzen
  choice: taube Wesen
  alternative: taube Dinge
  rationale: Das griechische Neutrum lässt das Bezugswort unausgesprochen. Die Übersetzung bewahrt diese rhetorische Form und vermeidet eine ausdrückliche theologische Deutung über das hinaus, was der Satz sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem erzählerischem Ton. Die lange griechische Periode wird zur besseren Verständlichkeit in zwei Sätze gegliedert; ihre Kontraste und Partizipialbeziehungen bleiben erhalten.
