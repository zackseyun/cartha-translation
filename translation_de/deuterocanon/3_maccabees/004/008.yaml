  yaml_path: translation/deuterocanon/3_maccabees/004/008.yaml
  text: And their relatives[a], with nooses wrapped around their necks instead of garlands, though in the full bloom of youth, spent the remaining days of their weddings in mourning instead of feasting and youthful ease, already seeing Hades lying at their feet.
translation:
  language: de
  text: Ihre Verwandten aber hatten sich Schlingen um den Hals geschlungen, als wären es Festkränze. Obwohl sie in der Blüte ihrer Jugend standen, verbrachten sie die übrigen Tage der Hochzeitsfeiern nicht mit Festmahlen und jugendlicher Unbeschwertheit, sondern mit Klagen; denn sie sahen den Hades[a] schon zu ihren Füßen liegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Tod«, »das Totenreich« oder »das Grab«. Im Griechischen steht »Hades«; das Wort bewahrt das Bild der Unterwelt beziehungsweise des Bereichs der Toten und bezeichnet nicht ausdrücklich eine endgültige Bestrafung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγενεῖς
  choice: Verwandten
  rationale: Bezeichnet allgemein durch Verwandtschaft verbundene Personen und schließt im Deutschen ohne unnötige Einschränkung den gesamten Familienkreis ein.
- source_word: βρόχους
  choice: Schlingen
  rationale: Bewahrt das bedrohliche Bild von um den Hals gelegten Schlingen und den scharfen Gegensatz zu den Festkränzen.
- source_word: ὡς ἀντὶ στεφέων
  choice: statt der Festkränze
  rationale: Gibt die ironische Umkehr festlicher Hochzeitszier natürlich wieder; »Festkränze« macht den Kontext deutlich, ohne das Bild aufzulösen.
- source_word: τοὺς αὐχένας περιπεπλεγμένοι
  choice: hatten sich ... um den Hals gelegt
  rationale: Drückt den resultativen Sinn des Perfektpartizips verständlich aus und erhält das körperlich-bedrohliche Bild.
- source_word: μετὰ ἀκμαίας νεανικῆς ἡλικίας
  choice: obwohl sie in der Blüte ihrer Jugend standen
  rationale: Vermittelt sowohl das jugendliche Alter als auch dessen volle Lebenskraft; der konzessive Anschluss bildet den inhaltlichen Gegensatz natürlich ab.
- source_word: εὐωχίας
  choice: Festmahlen
  rationale: Bezeichnet im Hochzeitszusammenhang festliches Essen und Feiern.
- source_word: νεωτερικῆς ῥᾳθυμίας
  choice: jugendlichem Müßiggang
  rationale: Bewahrt die Spannweite von sorgloser Muße bis Untätigkeit, ohne eine stärkere moralische Verurteilung einzutragen.
- source_word: τὰς ἐπιλοίπους τῶν γάμων ἡμέρας
  choice: die übrigen Tage der Hochzeitsfeiern
  rationale: Der Plural γάμων bezeichnet hier am ehesten die mehrtägigen Hochzeitsfeierlichkeiten, nicht die Ehe als abstrakten Zustand.
- source_word: ἐν θρήνοις διῆγον
  choice: verbrachten ... mit Klagen
  rationale: Gibt sowohl das Verbringen der Zeit als auch die hörbaren Toten- oder Trauerklagen von θρῆνοι wieder.
- source_word: παρὰ πόδας ἤδη τὸν ἅδην ὁρῶντες κείμενον
  choice: sie sahen den Hades schon unmittelbar vor ihren Füßen liegen
  rationale: Erhält Ἅιδης und die anschauliche Personifikation beziehungsweise räumliche Darstellung unmittelbar drohenden Todes.
theological_decisions:
- issue: Wiedergabe von ἅδην
  choice: Hades
  alternative: Tod; Totenreich; Grab
  rationale: Der griechische Text nennt ausdrücklich den Hades als Bereich oder Macht des Todes. Die Beibehaltung wahrt das antike Bild und vermeidet die Einengung auf endgültige Bestrafung oder eine bestimmte Jenseitslehre.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz ist zur besseren Verständlichkeit gegliedert; die Gegensätze zwischen Festkränzen und Schlingen sowie zwischen Hochzeitsfreude und Klage bleiben erhalten. »Müßiggang« ist bewusst leicht gehoben, aber allgemein verständlich.
