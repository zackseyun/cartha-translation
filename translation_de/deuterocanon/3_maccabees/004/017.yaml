  text: But after the previously mentioned interval of time[a], the scribes reported to the king that it was no longer possible to carry out the registration of the Jews because of their countless multitude.
translation:
  language: de
  text: Nach dem zuvor genannten Zeitraum berichteten die Schreiber dem König, sie seien wegen der unermesslich großen Zahl der Juden nicht mehr imstande, deren Erfassung[a] durchzuführen.
  philosophy: optimal-equivalence
  footnotes:
