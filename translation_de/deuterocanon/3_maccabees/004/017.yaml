    text: 'Oder: „Zählung“. Das griechische Wort kann eine amtliche Erfassung, Eintragung oder Volkszählung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Nach
  rationale: μετά mit Akkusativ bezeichnet die zeitliche Folge. Das leicht weiterführende δέ muss im Deutschen nicht eigens wiedergegeben werden; „Nach“ eröffnet den Satz natürlich.
- source_word: τὸ προειρημένον τοῦ χρόνου διάστημα
  choice: dem zuvor genannten Zeitraum
  rationale: προειρημένον verweist ausdrücklich auf etwas zuvor Erwähntes, διάστημα bezeichnet eine Zeitspanne. „Zeitraum“ ist im modernen Deutsch prägnant und natürlich.
- source_word: προσηγγέλλον
  choice: berichteten
  rationale: Das Imperfekt bezeichnet die Mitteilung der amtlichen Schreiber an den König. „berichteten“ gibt den administrativen Vorgang idiomatisch wieder, ohne eine Wiederholung zwingend festzulegen.
- source_word: οἱ γραμματεῖς
  choice: die Schreiber
  rationale: γραμματεῖς meint hier mit Schrift- und Listenführung betraute Amtsträger. „Schreiber“ wahrt die historische Färbung und bleibt allgemein verständlich.
- source_word: μηκέτι ἰσχύειν
  choice: sie seien ... nicht mehr imstande
  rationale: ἰσχύειν bezeichnet hier die praktische Fähigkeit, die Erfassung fortzuführen. Der deutsche Konjunktiv markiert den Inhalt ihres Berichts.
- source_word: τὴν τῶν Ἰουδαίων ἀπογραφὴν ποιεῖσθαι
  choice: deren Erfassung durchzuführen
  rationale: ἀπογραφή kann Registrierung, Eintragung oder Zählung bezeichnen. „Erfassung“ erhält diese administrative Bedeutungsbreite; „durchführen“ gibt ποιεῖσθαι wieder.
- source_word: διὰ τὴν ἀμέτρητον αὐτῶν πληθύν
  choice: wegen der unermesslich großen Zahl der Juden
  rationale: διά mit Akkusativ nennt den Grund. ἀμέτρητος und πληθύς bezeichnen zusammen eine nicht zu ermessende Menge; die deutsche Formulierung bewahrt die starke, möglicherweise hyperbolische Aussage.
