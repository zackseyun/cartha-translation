  source_fidelity: Die Übersetzung gibt διοργισθείς als intensiven Zorn, προσέταξεν als autoritativen Befehl, die additive Bezugnahme auf die gegenwärtige Gruppe sowie die Forderung nach einer der vorherigen Gruppe entsprechenden Bestrafung zutreffend wieder. „In keiner Hinsicht hinter der Bestrafung jener zurückzubleiben“ bildet μὴ λειπομένους κατὰ μηδένα τρόπον τῆς ἐκείνων τιμωρίας angemessen ab.
