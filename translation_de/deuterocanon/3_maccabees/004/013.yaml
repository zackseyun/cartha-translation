base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/013.yaml
  text: Enraged[a], he ordered that these men too be treated in exactly the same way as those others, carefully, falling short in no way of their punishment.
translation:
  language: de
  text: Zornentbrannt befahl er, auch diese mit aller Sorgfalt auf genau dieselbe Weise[a] zu behandeln wie jene und dabei in keiner Hinsicht hinter der Bestrafung jener zurückzubleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung mit τρόπων ist in ihrer Form ungewöhnlich. Gemeint ist offenbar, dass diese Gruppe ebenso behandelt werden sollte wie die vorherige.
    reason: lexical_alternative
lexical_decisions:
- source_word: διοργισθείς
  choice: Zornentbrannt
  rationale: Das Partizip bezeichnet heftigen, gesteigerten Zorn. »Zornentbrannt« ist knapp, würdig und bewahrt die Intensität.
- source_word: προσέταξεν
  choice: befahl er
  rationale: Gibt den verbindlichen, autoritativen Befehl im natürlichen deutschen Erzählstil wieder.
- source_word: καὶ τούτοις ὁμοῦ
  choice: auch diese
  rationale: »Auch« bewahrt die additive Aussage; ein nicht ausdrücklich genanntes Substantiv wie »Männer« wird nicht ergänzt.
- source_word: τὸν αὐτὸν τρόπων
  choice: auf genau dieselbe Weise
  rationale: Die griechische Formulierung ist grammatisch auffällig, zielt im Zusammenhang jedoch auf dieselbe Art der Behandlung. Die Übersetzung gibt diesen Sinn klar wieder, ohne die Unsicherheit zu verschweigen.
- source_word: ἐπιμελῶς
  choice: mit aller Sorgfalt
  rationale: Drückt die gewissenhafte und gründliche Ausführung des angeordneten Vorgehens aus.
- source_word: ὡς ἐκείνοις ποιῆσαι
  choice: zu behandeln wie jene
  rationale: Die idiomatische deutsche Wendung bewahrt den Vergleich mit der zuvor genannten Gruppe.
- source_word: μὴ λειπομένους κατὰ μηδένα τρόπον
  choice: in keiner Hinsicht … zurückzubleiben
  rationale: Bewahrt sowohl die Vorstellung des Zurückbleibens als auch die verstärkte Verneinung.
- source_word: τῆς ἐκείνων τιμωρίας
  choice: hinter der Bestrafung jener
  rationale: »Jener« verweist eindeutig auf die zuvor bestrafte Gruppe; τιμωρία bezeichnet hier die auferlegte Strafe beziehungsweise Strafbehandlung.
