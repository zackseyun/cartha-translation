base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/004.yaml
  text: For with the bitter cruelty of a merciless spirit they were being sent out together by the generals in each city[a], so that, beyond the outrageous punishments, even some of their enemies, seeing the common pity before their eyes and considering the uncertain ruin of their life[b], were weeping over their wretched deportation.
translation:
  language: de
  text: Denn in der Bitterkeit einer erbarmungslosen Gesinnung wurden sie von den Befehlshabern in den einzelnen Städten einmütig fortgeschickt[a], sodass zusätzlich zu den ungeheuerlichen Strafen sogar einige ihrer Feinde, die das gemeinsame Erbarmen vor Augen hatten und den ungewissen Ausgang des Lebens bedachten[b], über ihre elende Verschleppung weinten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vertrieben“ beziehungsweise „verschleppt“. Das griechische Verb bedeutet wörtlich „fortgeschickt“, bezeichnet hier aber eine erzwungene Entfernung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den ungewissen Ausgang des Lebens“. Gemeint sein kann sowohl das ungewisse Schicksal der Verschleppten als auch die Ungewissheit des menschlichen Lebens allgemein.'
    reason: ambiguity
lexical_decisions:
- source_word: μετὰ πικρίας ἀνοίκτου ψυχῆς
  choice: mit solcher bitteren Härte und erbarmungsloser Gesinnung
  rationale: Die Wendung beschreibt die grausame innere Haltung, aus der die Maßnahme vollzogen wurde. „Härte“ gibt die kontextuelle Schärfe von πικρία idiomatisch wieder; „Gesinnung“ bezeichnet hier ψυχή als innere Haltung.
- source_word: στρατηγῶν
  choice: Befehlshabern
  rationale: στρατηγός kann einen militärischen oder staatlichen Amtsträger bezeichnen. „Befehlshaber“ bewahrt den obrigkeitlich-militärischen Charakter, ohne die Funktion enger als der Kontext festzulegen.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Das Adverb bezeichnet ein übereinstimmendes, geschlossenes Vorgehen. Die Stellung lässt eine Beziehung auf die handelnden Befehlshaber am natürlichsten erscheinen.
- source_word: ἐξαπεστέλλοντο
  choice: wurden ... fortgeschickt
  rationale: Die Grundbedeutung des Verbs („weg-/aussenden“) bleibt im Haupttext sichtbar; der Zwangscharakter der Maßnahme ergibt sich aus Kontext und Schlusswort „Verschleppung“.
- source_word: ἐπὶ ταῖς ἐξάλλοις τιμωρίαις
  choice: angesichts der maßlosen Bestrafungen
  rationale: ἐπί mit Dativ kann hier einen Anlass oder Begleitumstand bezeichnen; ἐξάλλοις kennzeichnet die Strafen als außergewöhnlich bzw. jedes Maß überschreitend. Die additive Deutung bleibt in einer Fußnote erhalten.
- source_word: λαμβάνοντας πρὸ τῶν ὀφθαλμῶν τὸν κοινὸν ἔλεον
  choice: sich das allen Menschen gemeinsame Mitgefühl vor Augen führten
  rationale: Die bildhafte Formulierung πρὸ τῶν ὀφθαλμῶν bleibt mit „vor Augen führen“ erhalten. κοινός bezeichnet das allgemein geteilte menschliche Erbarmen, nicht bloß das Mitleid einer bestimmten Gruppe.
- source_word: τὴν ἄδηλον τοῦ βίου καταστροφήν
  choice: den ungewissen Ausgang des Lebens
  rationale: ἄδηλος bedeutet „ungewiss, nicht absehbar“; καταστροφή kann „Ende, Ausgang, Umsturz, Verderben“ bezeichnen. Die Formulierung bewahrt die offene Bezugnahme auf das menschliche Leben allgemein.
- source_word: τὴν δυσάθλιον ἐξαποστολήν
  choice: ihre elende Verschleppung
  rationale: Das Substantiv ist mit dem früheren „fortschicken“ verwandt, bezeichnet im Kontext aber eine erzwungene Entfernung. „Verschleppung“ macht diesen Zwang verständlich, während „elend“ die starke Wertung von δυσάθλιος wiedergibt.
theological_decisions:
- issue: Bezug von τοῦ βίου in „der ungewisse Ausgang des Lebens“
  choice: 'allgemein formuliert: „des Lebens“'
  alternative: „das ungewisse Ende ihres Lebens“
  rationale: Der griechische Singular steht ohne ausdrückliches Possessivpronomen. Die allgemeine Formulierung lässt offen, ob die Feinde über die bedrohte Zukunft der Verschleppten oder über die Ungewissheit menschlichen Lebens überhaupt nachdenken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die lange griechische Ergebniskonstruktion bleibt als ein zusammenhängender Satz erhalten. Bildhafte Wendungen werden möglichst bewahrt; ungesicherte Bezüge werden nicht vereindeutigt.
