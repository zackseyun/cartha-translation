base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/009.yaml
  text: 'And they were brought down, driven like beasts by the compulsion of iron chains: some with their necks fastened to the yokes of the ships, and others with their feet secured in unbreakable fetters,'
translation:
  language: de
  text: 'Sie wurden hinabgeführt und unter dem Zwang eiserner Fesseln wie Tiere getrieben[a]: Die einen waren mit ihren Hälsen an den Jochen der Schiffe[b] festgemacht[c], die anderen mit ihren Füßen in unzerbrechlichen Fußfesseln fest gesichert,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geführt“. Das griechische Wort kann neutraler wiedergegeben werden; der Vergleich mit Tieren und die eisernen Fesseln sprechen hier für „getrieben“.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Jochen der Schiffe“ können Balken oder Querhölzer gemeint sein, an denen die Gefangenen befestigt wurden. Das griechische Wort bewahrt zugleich das Bild eines Tierjochs.
    reason: cultural_note
  - marker: c
    text: Das mit „festgemacht“ wiedergegebene Verb kann in seinem stärksten Sinn auch „angenagelt“ bedeuten; der unmittelbare Zusammenhang legt diese engere Bedeutung jedoch nicht eindeutig fest.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήχθησαν
  choice: sie wurden hinabgeführt
  rationale: Das Passiv von κατάγω bezeichnet hier ein Hinabführen oder Hinbringen. „Hinabgeführt“ bewahrt die Richtungsangabe, ohne ein im Text nicht genanntes Ziel festzulegen.
- source_word: θηρίων τρόπον
  choice: wie Tiere
  rationale: Die knappe Vergleichsformulierung gibt die entwürdigende Behandlung natürlich wieder. „Tiere“ lässt die mögliche Nuance von wilden oder gefährlichen Tieren offen.
- source_word: ἀγόμενοι
  choice: getrieben
  rationale: ἄγω kann neutral „führen“ bedeuten; zusammen mit dem Tiervergleich und den eisernen Fesseln bringt „getrieben“ den Zwang des Zusammenhangs angemessen zum Ausdruck. Die Alternative wird in einer Fußnote bewahrt.
- source_word: σιδηροδέσμοις ἀνάγκαις
  choice: unter dem Zwang eiserner Fesseln
  rationale: Die verdichtete griechische Wendung verbindet eiserne Bindung mit Zwang. Die deutsche Formulierung gibt beide Aspekte wieder, ohne die Fesseln unnötig auf Ketten einzuengen.
- source_word: τοῖς ζυγοῖς τῶν πλοίων
  choice: an den Jochen der Schiffe
  rationale: „Joche“ erhält die Bildsprache von ζυγός und damit den Anschluss an den vorausgehenden Tiervergleich. Welche Schiffsteile konkret gemeint sind, bleibt unsicher und wird in der Fußnote erläutert.
- source_word: προσηλωμένοι
  choice: befestigt
  rationale: Das Verb bezeichnet ein festes Anbringen und kann im stärkeren Sinn „annageln“ heißen. „Befestigt“ wahrt die Aussage, ohne eine konkrete Befestigungsart festzulegen.
- source_word: τοὺς τραχήλους
  choice: mit dem Nacken
  rationale: Der griechische Akkusativ bezeichnet den Körperteil, an dem die Betroffenen befestigt waren. Die deutsche Konstruktion ist idiomatisch und erhält diesen Bezug.
- source_word: ἀρρήκτοις
  choice: unzerbrechlichen
  rationale: Das Adjektiv bezeichnet etwas, das nicht zerbrochen oder gesprengt werden kann. „Unzerbrechlich“ ist klar und direkt.
- source_word: κατησφαλισμένοι
  choice: fest gesichert
  rationale: Das Partizip betont, dass die Füße zuverlässig und fest verschlossen beziehungsweise gesichert waren.
- source_word: πέδαις
  choice: Fußfesseln
  rationale: πέδαι bezeichnet spezifisch Fesseln für die Füße; „Fußfesseln“ ist im modernen Deutschen präzise und verständlich.
