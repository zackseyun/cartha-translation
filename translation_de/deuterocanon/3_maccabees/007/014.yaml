  text: They themselves also killed along the road any compatriot of the defiled people who had fallen in with them[a], and they did away with them as examples.
translation:
  language: de
  text: Auch sie selbst töteten unterwegs jeden Volksgenossen aus der Schar der Befleckten, der ihnen begegnete, und machten ihn öffentlich zum abschreckenden Beispiel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und töteten ihn unter öffentlicher Bloßstellung“. Der griechische Ausdruck kann sowohl die öffentliche Beschämung als auch die exemplarische Warnwirkung der Tötung betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ τε
  choice: Auch sie selbst
  rationale: Bewahrt sowohl die verbindende Bedeutung von τε als auch die Hervorhebung durch αὐτοί in natürlichem Deutsch.
- source_word: τὸν ἐμπεσόντα
  choice: jeden …, der ihnen begegnete
  rationale: ἐμπίπτω bezeichnet hier im Zusammenhang mit κατὰ τὴν ὁδόν ein zufälliges Zusammentreffen; die generische Wiedergabe mit „jeden“ macht den wiederholten Charakter der Imperfektformen verständlich.
- source_word: τῶν μεμιαμμένων
  choice: aus der Schar der Befleckten
  rationale: Das substantivierte Perfektpartizip bezeichnet eine als kultisch oder moralisch befleckt geltende Gruppe. „Aus der Schar“ gibt den partitiven Genitiv wieder, ohne die Art der Befleckung festzulegen.
- source_word: ὁμοεθνῆ
  choice: Volksgenossen
  rationale: Bezeichnet einen Angehörigen desselben Volkes; „Volksgenosse“ ist präziser als das stärker staatsbürgerlich gefärbte „Landsmann“.
- source_word: κατὰ τὴν ὁδὸν
  choice: unterwegs
  rationale: Gibt die örtlich-umständliche Angabe knapp und idiomatisch wieder.
- source_word: ἀπέκτεννον
  choice: töteten
  rationale: Direkte, heutige Wiedergabe; der iterative Zug des Imperfekts wird durch „jeden …, der ihnen begegnete“ mitgetragen.
- source_word: μετὰ παραδειγματισμῶν
  choice: auf abschreckende Weise
  rationale: Bewahrt den Gedanken öffentlicher Abschreckung beziehungsweise beschämender Exempel, ohne eine bestimmte Hinrichtungsart einzutragen.
- source_word: ἀνήρουν
  choice: brachten ihn … um
  rationale: ἀναιρέω hat hier tödliche Bedeutung. Die deutsche Variation vermeidet eine unbeholfene Wiederholung von „töten“, während der Singular an das generische Objekt anschließt.
