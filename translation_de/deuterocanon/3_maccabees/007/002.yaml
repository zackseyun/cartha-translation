revisions:
- from: Auch uns selbst und unseren Kindern geht es gut, da der große Gott unsere Anordnungen so gelingen lässt, wie wir es beabsichtigen.[a]
  to: Auch uns selbst und unseren Kindern geht es gut, da der große Gott seine Gebote für uns lenkt, wie wir es wollen.[a]
