  yaml_path: translation/deuterocanon/3_maccabees/007/002.yaml
  text: And we ourselves and our children are well[a], as the great God directs his commands for us, just as we choose.
translation:
  language: de
  text: Auch uns selbst und unseren Kindern geht es gut, da der große Gott seine Gebote für uns lenkt, wie wir es wollen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie wir es vorhaben“ oder „wie wir es beabsichtigen“.'
    reason: προαιρούμεθα kann sowohl das Wollen bzw. Wählen als auch eine bewusste Absicht bezeichnen.
lexical_decisions:
- source_word: ἐρρώμεθα
  choice: geht es gut
  rationale: Die idiomatische Perfektform bezeichnet hier das Wohlergehen; die deutsche Wendung ist natürlich und legt den Sinn nicht ausschließlich auf körperliche Gesundheit fest.
- source_word: καὶ αὐτοὶ καὶ τὰ τέκνα ἡμῶν
  choice: uns selbst und unseren Kindern
  rationale: Die emphatische Einbeziehung der Sprecher und ihrer Nachkommen bleibt erhalten; τέκνα ist geschlechtsübergreifend als „Kinder“ wiederzugeben.
- source_word: κατευθύνοντος
  choice: gelingen lässt
  rationale: Im Zusammenhang mit Anordnungen und beabsichtigten Ergebnissen bezeichnet κατευθύνω nicht bloß räumliches Lenken, sondern ein erfolgreiches Ausrichten beziehungsweise Gedeihenlassen.
- source_word: τοῦ μεγάλου θεοῦ
  choice: der große Gott
  rationale: Die ehrende Bezeichnung wird unmittelbar und in natürlichem Deutsch wiedergegeben.
- source_word: τὰ προστάγματα
  choice: unsere Anordnungen
  rationale: πρόσταγμα bezeichnet eine Anordnung oder Verfügung. Der Dativ ἡμῖν und der anschließende Hinweis auf die Absicht der Sprecher legen nahe, dass es um die von ihnen erlassenen Anordnungen geht, nicht um Gottes Gebote.
- source_word: ἡμῖν
  choice: unsere
  rationale: Der Dativ bezeichnet die Zuordnung zu den Sprechern. Im Deutschen wird diese Beziehung bei „Anordnungen“ am klarsten possessiv ausgedrückt.
- source_word: καθὼς προαιρούμεθα
  choice: wie wir es beabsichtigen
  rationale: προαιρέομαι bezeichnet hier ein bewusstes Vorhaben oder eine gewählte Absicht; „beabsichtigen“ passt zum Erfolg der erlassenen Anordnungen und wahrt die menschliche Willenskomponente.
theological_decisions:
- issue: Verhältnis von Gottes Wirken und menschlicher Absicht
  choice: Gott lässt die Anordnungen so gelingen, wie die Sprecher es beabsichtigen.
  alternative: Gott lenkt seine Gebote für uns, wie wir es wählen.
  rationale: Der griechische Satz stellt Gottes wirksames Lenken und die Absicht der Menschen nebeneinander. Die Übersetzung bewahrt beides, ohne daraus eine allgemeine Lehraussage über Determination oder menschliche Autonomie abzuleiten.
- issue: Zugehörigkeit der προστάγματα
  choice: Anordnungen der königlichen Sprecher
  alternative: Gebote Gottes
  rationale: Grammatisch ist τοῦ μεγάλου θεοῦ das Subjekt des Genitivus absolutus, während τὰ προστάγματα dessen Objekt ist. ἡμῖν und καθὼς προαιρούμεθα beziehen die Anordnungen auf die Sprecher; deshalb wird kein göttliches Possessivpronomen eingeführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz behält den brieflichen Ton und die emphatische Nennung der königlichen Familie bei. Die Wiedergabe vermeidet die missverständliche Aussage, Gott richte seine eigenen Gebote nach menschlicher Wahl aus.
