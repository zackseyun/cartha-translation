    text: 'Auch: »Rosen tragend«. Das griechische ῥοδοφόρον ist ein beschreibender Beiname für Ptolemaïs, der mit der besonderen Eigenart des Ortes begründet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγενηθέντες
  choice: Als sie … kamen
  rationale: Das aoristische Partizip leitet temporal das nächste Geschehen ein; die finite Wiedergabe ist im modernen Deutschen natürlich und bewahrt den zeitlichen Bezug.
- source_word: Πτολεμαΐδα
  choice: Ptolemaïs
  rationale: Gebräuchliche deutsche Transliteration des griechischen Ortsnamens; der Trema kennzeichnet die getrennte Aussprache.
- source_word: τὴν ὀνομαζομένην
  choice: das … genannt wird
  rationale: Die Relativkonstruktion gibt die Benennung der Stadt unmittelbar wieder. Das sächliche Relativpronomen bezieht sich auf den Ortsnamen Ptolemaïs.
- source_word: διὰ τὴν τοῦ τόπου ἰδιότητα
  choice: wegen der besonderen Beschaffenheit des Ortes
  rationale: ἰδιότης bezeichnet die eigentümliche beziehungsweise besondere Beschaffenheit eines Ortes, ohne näher festzulegen, worin sie besteht.
- source_word: ῥοδοφόρον
  choice: die Rosentragende
  rationale: Das Kompositum bedeutet wörtlich „rosentragend“. Als substantivierter Beiname bleibt seine bildhafte Form erhalten.
- source_word: ἐν ᾗ
  choice: dort
  rationale: Das Lokaladverb nimmt Ptolemaïs auf und vermeidet im Deutschen eine schwerfällige Verschachtelung.
- source_word: προσέμεινεν
  choice: wartete … auf sie
  rationale: Mit dem Akkusativ αὐτούς bezeichnet das Verb hier ein Bleiben in Erwartung der genannten Personen.
- source_word: ὁ στόλος
  choice: die Flotte
  rationale: στόλος bezeichnet hier den Verband der Schiffe; „Flotte“ ist die präzise und natürliche deutsche Entsprechung.
- source_word: κατὰ κοινὴν αὐτῶν βουλήν
  choice: nach ihrem gemeinsamen Beschluss
  rationale: Die Formulierung bewahrt sowohl den gemeinschaftlichen Charakter als auch den deliberativen Sinn von βουλή; der mögliche Bezugsumfang von αὐτῶν wird nicht zusätzlich festgelegt.
- source_word: ἡμέρας ἑπτά
  choice: sieben Tage
  rationale: Der Akkusativ gibt die Zeitdauer an; im Deutschen ist dafür keine zusätzliche Präposition erforderlich.
