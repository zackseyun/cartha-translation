  text: When they arrived at Ptolemais[a], which is called Rose-bearing because of the nature of the place, where the fleet waited for them for seven days by their common decision,
translation:
  language: de
  text: Als sie in Ptolemaïs ankamen, das wegen der besonderen Eigenart des Ortes »rosentragend«[a] genannt wird, wartete die Flotte dort gemäß ihrem gemeinsamen Beschluss sieben Tage auf sie,
  philosophy: optimal-equivalence
  footnotes:
