  text: There they held a saving banquet[a], since the king had generously supplied each of them with everything for the journey, all the way to his own house.
translation:
  language: de
  text: Dort veranstalteten sie ein Festmahl der Rettung[a], denn der König hatte jedem von ihnen großzügig alles für die Reise bis zu seinem jeweiligen eigenen Haus bereitgestellt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Festmahl zur Feier ihrer Rettung“ oder „ein rettungsbringendes Festmahl“. Das griechische Adjektiv verbindet das Fest ausdrücklich mit der Rettung, ohne die genaue Beziehung näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότον
  choice: Festmahl
  rationale: Das Wort bezeichnet wörtlich ein Trinkgelage bzw. eine Trinkfeier; im Zusammenhang ist eine feierliche Mahlzeit gemeint. „Festmahl“ gibt den Ereignischarakter natürlich und würdig wieder, ohne den Aspekt des Trinkens unnötig hervortreten zu lassen.
- source_word: σωτήριον
  choice: zur Feier ihrer Rettung
  rationale: Das Adjektiv verbindet das Fest ausdrücklich mit Rettung bzw. Bewahrung. Die Formulierung macht diese Beziehung im Deutschen verständlich, ohne festzulegen, ob das Fest selbst rettend wirkt oder die bereits erfahrene Rettung feiert.
- source_word: χορηγήσαντος
  choice: bereitgestellt hatte
  rationale: Das Partizip bezeichnet das Bereitstellen bzw. Bestreiten von Mitteln auf eigene Kosten. Zusammen mit εὐψύχως wird die bereitwillige, großzügige Versorgung ausgedrückt.
- source_word: εὐψύχως
  choice: großzügig
  rationale: Das Adverb bedeutet sinngemäß bereitwillig, beherzt oder freigebig. Beim königlichen Bereitstellen von Reisebedarf ist „großzügig“ die natürliche deutsche Entsprechung.
- source_word: τὰ πρὸς τὴν ἄφιξιν πάντα
  choice: alles, was er für die Heimreise ... brauchte
  rationale: Wörtlich geht es um alles, was zum Ankommen erforderlich war. Der folgende Bezug auf das eigene Haus zeigt, dass die Versorgung die Rückkehr nach Hause ermöglichen sollte.
- source_word: ἑκάστῳ
  choice: jedem von ihnen
  rationale: Der Dativ Singular hat distributiven Sinn und bezeichnet die individuelle Versorgung jedes Einzelnen.
- source_word: ἕως ἐπὶ τὴν ἰδίαν οἰκίαν
  choice: bis zu seinem eigenen Haus
  rationale: Die Wendung beschreibt die Reichweite der Versorgung bis zum jeweiligen eigenen Zuhause; der Singular entspricht dem distributiven ἑκάστῳ.
theological_decisions:
- issue: Bedeutung von σωτήριον für das Festmahl
  choice: Festmahl zur Feier ihrer Rettung
  alternative: rettendes Festmahl / Festmahl der Rettung
  rationale: Die griechische Verbindung kann ein rettungsbezogenes oder der Rettung geweihtes Fest bezeichnen. Die Hauptfassung wahrt den klaren Zusammenhang mit der erfahrenen Rettung, vermeidet aber den missverständlichen Eindruck, das Mahl selbst habe rettende Kraft; die engere formale Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. „Festmahl“ ist natürlicher als das wörtlichere „Trinkgelage“; „Heimreise“ erschließt das durch den Zielort bezeichnete Ankommen. Das distributive Singularpronomen „seinem“ bleibt erhalten.
