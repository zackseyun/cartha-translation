  text: Wir aber drohten ihnen deswegen noch härter und ließen sie, entsprechend unserer Milde gegenüber allen Menschen, nur widerwillig am Leben[a]; zugleich erkannten wir, dass der himmlische Gott[b] die Juden gewiss beschützt hatte,
