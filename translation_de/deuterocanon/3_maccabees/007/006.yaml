lexical_decisions:
- source_word: ἐπὶ τούτοις
  choice: deswegen
  rationale: Die Wendung bezeichnet hier den Anlass in den zuvor genannten Vorgängen, nicht einen Vergleich.
- source_word: σκληρότερον διαπειλησάμενοι
  choice: drohten ihnen … noch härter
  rationale: Die komparative adverbiale Form und die verstärkende Bedeutung des Verbs werden in natürlichem Deutsch wiedergegeben.
- source_word: ἐπιείκειαν
  choice: Nachsicht
  rationale: Im königlich-administrativen Zusammenhang bezeichnet das Wort milde, schonende Zurückhaltung; „Nachsicht“ ist gegenwärtig und verständlich.
- source_word: μόγις τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: ließen sie … nur knapp am Leben
  rationale: Die idiomatische deutsche Formulierung gibt die nur widerstrebend beziehungsweise gerade noch gewährte Fortdauer des Lebens wieder.
- source_word: ἐπουράνιον θεόν
  choice: der himmlische Gott
  rationale: Bewahrt die adjektivische Gestalt des griechischen Ausdrucks und den gehobenen Ton.
- source_word: ἐγνωκότες
  choice: erkannten wir
  rationale: Das Perfektpartizip bezeichnet eine aufgrund des Geschehens gewonnene und feststehende Erkenntnis.
- source_word: ἀσφαλῶς ὑπερησπικότα
  choice: zuverlässig beschützt hatte
  rationale: Die Formulierung bringt sowohl die wirksame, sichere Hilfe als auch den rückblickenden Aspekt des griechischen Perfektpartizips zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von ἐπουράνιος θεός
  choice: der himmlische Gott
  alternative: der Gott des Himmels
  rationale: Die Hauptfassung bleibt bei der adjektivischen Form des Griechischen; die geläufige substantivische Alternative wird in einer Fußnote bewahrt, ohne einen theologischen Unterschied einzutragen.
- issue: Grad der idiomatischen Glättung bei τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: ließen sie nur knapp am Leben
  alternative: schenkten ihnen kaum das Leben
  rationale: Die Hauptfassung verwendet die natürliche deutsche Wendung, während die Fußnote die bildnähere Struktur des Griechischen sichtbar macht.
translation_notes:
