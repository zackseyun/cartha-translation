revisions:
- from: Wir aber drohten ihnen deswegen noch härter und ließen sie, entsprechend unserer Nachsicht gegenüber allen Menschen, nur knapp am Leben[a]; zugleich erkannten wir, dass der himmlische Gott[b] die Juden zuverlässig beschützt hatte,
  to: Wir aber drohten ihnen deswegen noch härter und ließen sie, entsprechend unserer Milde gegenüber allen Menschen, nur widerwillig am Leben[a]; zugleich erkannten wir, dass der himmlische Gott[b] die Juden gewiss beschützt hatte,
  rationale: Die Überarbeitung verdeutlicht, dass das Leben den Juden nur zögernd bzw. widerwillig gewährt wurde, ohne eine nicht im griechischen Text liegende Beinahe-Tötung anzudeuten. „Milde“ passt zum herrscherlichen Kontext von ἐπιείκεια. „Gewiss“ gibt ἀσφαλῶς als sichere rückblickende Erkenntnis idiomatischer wieder. Der offene Schlusssatz und die Fußnotenanker bleiben erhalten.
