  yaml_path: translation/deuterocanon/3_maccabees/007/008.yaml
  text: And we have ordered each and every one to return to his own home[a], with absolutely no one in any way harming them[b], nor insulting them over the things that happened contrary to reason.
translation:
  language: de
  text: Und wir haben angeordnet, dass alle, jeder für sich, in ihr eigenes Zuhause zurückkehren sollen[a], ohne dass ihnen irgendjemand in irgendeiner Weise auch nur im Geringsten schadet und sie nicht wegen dessen beschimpft, was wider alle Vernunft geschehen ist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an ihre eigenen Orte“ beziehungsweise „zu dem, was ihnen gehört“. Der griechische Ausdruck kann das eigene Zuhause, den eigenen Ort oder den eigenen Besitz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wegen dessen, was unvernünftigerweise geschehen ist“ oder „wegen der widersinnigen Ereignisse“. Der griechische Ausdruck lautet wörtlich „gegen die Vernunft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: wir haben angeordnet
  rationale: Das Perfekt bezeichnet eine bereits erlassene und weiterhin geltende amtliche Anordnung. „Angeordnet“ gibt die behördliche Aussagekraft in natürlichem modernem Deutsch wieder.
- source_word: ἑκάστῳ πάντας
  choice: dass alle, jeder für sich
  rationale: Die ungewöhnlich gedrängte Verbindung vereint Gesamtheit und distributiven Nachdruck. Die Wiedergabe wahrt beide Aspekte, ohne die syntaktische Unebenheit des Griechischen nachzuahmen.
- source_word: εἰς τὰ ἴδια ἐπιστρέφειν
  choice: in ihr eigenes Zuhause zurückkehren
  rationale: τὰ ἴδια kann das eigene Zuhause, den eigenen Ort oder den eigenen Besitz bezeichnen. Im Zusammenhang mit der Freilassung ist „eigenes Zuhause“ natürlich und wahrscheinlich, während die Fußnote die Bedeutungsbreite offenhält.
- source_word: ἐν παντὶ τρόπῳ
  choice: in irgendeiner Weise
  rationale: 'Im negativen Zusammenhang drückt die Wendung ein umfassendes Verbot aus: Schaden soll auf keinerlei Weise geschehen.'
- source_word: μηθενὸς αὐτοὺς τὸ σύνολον καταβλάπτοντος
  choice: ohne dass ihnen irgendjemand … auch nur im Geringsten schadet
  rationale: Die Genitivus-abs.-Konstruktion wird als begleitendes Verbot wiedergegeben; τὸ σύνολον verstärkt die Verneinung und wird durch „auch nur im Geringsten“ erfasst.
- source_word: μήτε ὀνειδίζοντος
  choice: oder sie … beschimpft
  rationale: ὀνειδίζω umfasst Schmähen, Beschimpfen und Vorwürfe. „Beschimpft“ ist verständlich und bewahrt den Gedanken verbaler Herabsetzung.
- source_word: περὶ τῶν γεγενημένων
  choice: wegen dessen, was … geschehen ist
  rationale: Die Form verweist auf bereits eingetretene Ereignisse, die weiterhin Gegenstand möglicher Vorwürfe sind.
- source_word: παρὰ λόγον
  choice: wider alle Vernunft
  rationale: Die idiomatische deutsche Wendung bewahrt die wertende Aussage „gegen die Vernunft“, ohne festzulegen, ob stärker „unvernünftig“, „widersinnig“ oder „unerwartet“ gemeint ist.
