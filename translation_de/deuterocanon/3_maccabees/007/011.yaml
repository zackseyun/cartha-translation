  text: declaring that they should never show favor either to those who[a], for the sake of their belly, had transgressed the divine commandments[b], or to the king’s decrees.
translation:
  language: de
  text: Dabei erklärten sie, sie würden niemals denen Wohlwollen zeigen, die um ihres Bauches willen[a] die göttlichen Gebote übertreten hatten, und ebenso wenig den Anordnungen des Königs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um ihres Verlangens willen« beziehungsweise »wegen des Essens«. Wörtlich steht im Griechischen: »um des Bauches willen«; gemeint ist das Nachgeben gegenüber dem körperlichen Verlangen.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Wortlaut des letzten Satzteils ist knapp und ungewöhnlich. Er kann möglicherweise auch auf Menschen bezogen werden, die sich nach den Anordnungen des Königs richteten, statt auf die Anordnungen selbst.
    reason: alternative_reading
lexical_decisions:
- source_word: προφερόμενοι
  choice: Dabei erklärten sie
  rationale: Das Partizip bezeichnet hier das öffentliche oder ausdrückliche Vorbringen einer Aussage. »Erklärten« ist im Deutschen natürlich und bewahrt den formellen Ton.
- source_word: τοὺς γαστρὸς ἕνεκεν
  choice: die um ihres Bauches willen
  rationale: Die konkrete und moralisch zugespitzte Metapher des griechischen Ausdrucks bleibt erhalten; eine bloße Wiedergabe mit »wegen des Essens« würde sie abschwächen.
- source_word: τὰ θεῖα παραβεβηκότας προστάγματα
  choice: die göttlichen Gebote übertreten hatten
  rationale: παραβαίνω bezeichnet das Übertreten oder Verletzen einer Norm; »göttliche Gebote« gibt θεῖα προστάγματα klar und würdig wieder.
- source_word: μηδέποτε εὐνοήσειν
  choice: niemals … Wohlwollen zeigen
  rationale: εὐνοέω beschreibt eine wohlwollende Haltung oder Begünstigung. »Wohlwollen zeigen« bewahrt diesen Sinn, ohne ihn auf bloßen Gehorsam einzuengen.
- source_word: μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν
  choice: und ebenso wenig den Anordnungen des Königs
  rationale: Die überlieferte Formulierung stellt die königlichen Anordnungen grammatisch neben das zuvor genannte Objekt von εὐνοήσειν, bleibt dabei jedoch ungewöhnlich knapp. »Anordnungen« passt zum königlichen Erlasskontext.
theological_decisions:
- issue: Bezug und Sinn von μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν
  choice: Die königlichen Anordnungen werden als zweites Satzglied zu »Wohlwollen zeigen« wiedergegeben.
  alternative: Gemeint sein könnten die Menschen, die sich nach den Anordnungen des Königs richteten.
  rationale: Der überlieferte griechische Wortlaut ist gedrängt und syntaktisch auffällig. Die Hauptfassung ergänzt keine ausdrücklich genannten Personen; die mögliche personenbezogene Deutung wird jedoch in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die anschauliche Wendung »um ihres Bauches willen« bleibt bewusst erhalten; die syntaktische Unsicherheit des Schlussteils wird nicht stillschweigend aufgelöst, sondern in der Fußnote kenntlich gemacht.
