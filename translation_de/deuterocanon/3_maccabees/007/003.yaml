base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/003.yaml
  text: Some of our friends[a], being more constantly at our side out of malice, persuaded us that the Jews under our rule, after being gathered together in groups[b], should be punished with unusual penalties as rebels.
translation:
  language: de
  text: Einige unserer Freunde, die uns aus Bosheit besonders häufig zur Seite standen, überredeten uns, die Juden unter unserer Herrschaft in Gruppen[a] zu versammeln und sie mit ungewöhnlichen Strafen[b] zu bestrafen, weil sie sich aufgelehnt hätten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als organisierte Vereinigungen« beziehungsweise »in Verbänden«. Das griechische Wort kann eine Gruppe, Körperschaft oder organisierte Vereinigung bezeichnen; seine genaue Bedeutung ist hier unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit außergewöhnlichen« beziehungsweise »befremdlichen Strafen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »weil sie sich losgesagt hatten« beziehungsweise »als Aufständische«. Das griechische Wort kann politische Auflehnung oder Lossagung bezeichnen, ohne notwendig religiösen Abfall zu meinen.'
    reason: ambiguity
lexical_decisions:
- source_word: τῶν φίλων τινὲς
  choice: Einige unserer Freunde
  rationale: φίλοι bezeichnet zunächst Freunde, kann im königlichen Umfeld aber auch Vertraute oder Hofangehörige meinen. Die schlichte Wiedergabe wahrt diese mögliche Spannweite.
- source_word: κατὰ κακοήθειαν
  choice: aus Bosheit
  rationale: Die Wendung bezeichnet ein von übler Gesinnung oder Arglist bestimmtes Motiv.
- source_word: πυκνότερον ἡμῖν παρακείμενοι
  choice: die uns besonders häufig zur Seite standen
  rationale: παράκειμαι bezeichnet räumliche oder übertragene Nähe; der Komparativ πυκνότερον hebt häufigen beziehungsweise verstärkten Zugang hervor.
- source_word: συνέπεισαν ἡμᾶς
  choice: überredeten uns
  rationale: Das Verb bezeichnet erfolgreiches Zureden oder Überzeugen; im negativen Kontext klingt »überredeten« natürlich.
- source_word: τοὺς ὑπὸ τὴν βασιλείαν Ἰουδαίους
  choice: die Juden unter unserer Herrschaft
  rationale: Gemeint sind die Juden im Herrschaftsgebiet des königlichen Sprechers.
- source_word: συναθροίσαντας τὰ συστήματα
  choice: in Gruppen zusammenzutreiben
  rationale: συναθροίζω bedeutet zusammenbringen oder versammeln; σύστημα kann eine Gruppe, Körperschaft oder organisierte Vereinigung bezeichnen. Das Deutsche gibt die veranlasste staatliche Sammlung idiomatisch wieder, ohne den Organisationsgrad festzulegen.
- source_word: κολάζεσθαι
  choice: zu bestrafen
  rationale: Der Infinitiv bezeichnet die beabsichtigte Strafmaßnahme.
- source_word: ξενιζούσαις ... τιμωρίαις
  choice: mit ungewöhnlichen Strafen
  rationale: ξενίζω trägt hier den Sinn von fremdartig, befremdlich oder außergewöhnlich; »ungewöhnlich« bewahrt die Offenheit.
- source_word: ἀποστάντων
  choice: als hätten sie sich aufgelehnt
  rationale: Das Partizip bezeichnet Abfall, Lossagung oder Aufstand. Die Formulierung wahrt den politischen Sinn und markiert im berichteten königlichen Rückblick den Vorwurfscharakter.
theological_decisions:
- issue: Bedeutung von ἀποστάντων
  choice: politische Auflehnung beziehungsweise Lossagung
  alternative: religiöser Abfall
  rationale: Der königlich-administrative Zusammenhang spricht eher für Revolte oder Abfall von der Herrschaft als für spezifisch religiöse Apostasie.
- issue: Bedeutung von τὰ συστήματα
  choice: Gruppen
  alternative: organisierte Vereinigungen oder Körperschaften
  rationale: Der Ausdruck kann organisierte Verbände bezeichnen, doch sein genauer Bezug ist hier unsicher. Die Übersetzung legt keinen bestimmten institutionellen Status fest.
- issue: Status des Revoltenvorwurfs
  choice: als hätten sie sich aufgelehnt
  alternative: weil sie sich aufgelehnt hatten / als Aufständische
  rationale: Der Satz steht in einer nachträglichen Distanzierung des Königs von der früheren Verfolgung. Die gewählte Form macht kenntlich, dass die Auflehnung als damalige Zuschreibung erscheint, ohne die grammatische Verbindung des Partizips zu verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der königliche Plural bleibt erhalten. Die Formulierung ist verständlich, wahrt aber die Unsicherheit bei σύστημα und ἀποστάντων.
