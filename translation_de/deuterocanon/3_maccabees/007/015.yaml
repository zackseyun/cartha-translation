base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/015.yaml
  text: On that day they killed more than three hundred men[a], and they also made it a joyful celebration[b], having laid hands on the profane.
translation:
  language: de
  text: An jenem Tag töteten sie mehr als dreihundert Männer; auch diesen Tag begingen sie voller Freude als Festtag[a], nachdem sie die Unheiligen überwältigt hatten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine ungewöhnliche Wendung mit „Freude/Frohsinn führen oder bringen“. Gemeint ist offenbar, dass sie diesen Tag freudig als Fest begingen.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann „in ihre Hand oder Gewalt gebracht“ und somit „überwältigt“ bedeuten; weniger genau lässt es sich auch mit „Hand an sie gelegt“ umschreiben. Der Schluss des Verses ist im überlieferten griechischen Text sprachlich schwierig.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεῖλον
  choice: töteten sie
  rationale: Der Aorist von ἀναιρέω bezeichnet im erzählenden Zusammenhang das Töten; die moderne, direkte Wiedergabe wahrt die Gewaltsamkeit des Ausdrucks.
- source_word: ὑπὲρ τοὺς τριακοσίους ἄνδρας
  choice: mehr als dreihundert Männer
  rationale: ὑπέρ mit Akkusativ gibt hier eine Überschreitung der Zahl an; ἄνδρας wird spezifisch mit „Männer“ wiedergegeben.
- source_word: ἤγαγον εὐφροσύνην μετὰ χαρᾶς
  choice: begingen sie voller Freude als Festtag
  rationale: Die wörtlich ungewöhnliche Wendung „sie führten/brachten Frohsinn“ bezeichnet hier ein festliches Begehen. Die Formulierung macht den Bezug auf den Tag verständlich und bewahrt μετὰ χαρᾶς ausdrücklich.
- source_word: βεβήλους
  choice: die Unheiligen
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die aus Sicht des Erzählers unheilig oder profan sind. „Die Unheiligen“ wahrt die religiöse Wertung, ohne sie stärker als „die Gottlosen“ auszudeuten.
- source_word: χειρωσάμενοι
  choice: nachdem sie … überwältigt hatten
  rationale: χειρόω kann „in seine Hand/Gewalt bringen“ und daher „überwältigen“ bedeuten. Diese Wiedergabe ist im Deutschen natürlicher als „Hand anlegen“; eine Fußnote hält die bildlich-wörtliche Möglichkeit offen.
theological_decisions:
- issue: Religiöse Charakterisierung durch βεβήλους
  choice: die Unheiligen
  alternative: die Profanen; die Gottlosen
  rationale: Die Übersetzung erhält die wertende Gegenüberstellung des Erzählers, ohne eine weiterentwickelte dogmatische Kategorie einzutragen.
- issue: Deutung der schwierigen Schlusswendung
  choice: Diesen Tag begingen sie auch voller Freude als Festtag, nachdem sie die Unheiligen überwältigt hatten.
  alternative: Sie feierten voller Freude, nachdem sie Hand an die Unheiligen gelegt hatten.
  rationale: Der überlieferte griechische Satzbau ist ungewöhnlich. Der Haupttext gibt einen kohärenten deutschen Sinn, während die Fußnoten sowohl die wörtlichere Ausdrucksweise als auch die Mehrdeutigkeit des Partizips dokumentieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz bleibt knapp und direkt; der zweite wird für natürliche Verständlichkeit behutsam gegliedert. Die ungewöhnliche Syntax und die lexikalische Offenheit des griechischen Schlusses werden nicht stillschweigend eingeebnet, sondern in den Fußnoten ausgewiesen.
