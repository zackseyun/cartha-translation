- from: 'Denn ihr sollt wissen: Wenn wir gegen diese Menschen irgendeinen bösen Anschlag planen oder ihnen auch nur im Geringsten Kummer bereiten, dann wird nicht ein Mensch unser Gegner sein, um diese Taten zu vergelten, sondern Gott, der Höchste, der über jede Macht herrscht. Ihm werden wir keinesfalls entkommen – niemals. Lebt wohl!'
  to: 'Denn ihr sollt wissen: Wenn wir gegen diese Menschen irgendein Böses aushecken oder sie in irgendeiner Weise betrüben, werden wir nicht einen Menschen, sondern Gott, den Höchsten, der über jede Macht herrscht, als Gegner gegen uns haben, zur Vergeltung für diese Taten. Ihm werden wir auf keine Weise entkommen – niemals. Lebt wohl!'
