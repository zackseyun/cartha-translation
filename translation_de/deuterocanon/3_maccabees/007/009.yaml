base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/009.yaml
  text: For know that if we devise any evil against these people, or grieve them in any way at all, we will have against us for vengeance in these matters, utterly without escape and forever, not a man but God Most High, the one who rules over all power. Farewell.
translation:
  language: de
  text: 'Denn ihr sollt wissen: Wenn wir gegen diese Menschen irgendein Böses aushecken oder sie in irgendeiner Weise betrüben, werden wir nicht einen Menschen, sondern Gott, den Höchsten, der über jede Macht herrscht, als Gegner gegen uns haben, zur Vergeltung für diese Taten. Ihm werden wir auf keine Weise entkommen – niemals. Lebt wohl!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γινώσκετε
  choice: ihr sollt wissen
  rationale: Gibt den einleitenden Imperativ natürlich und mit angemessenem Nachdruck wieder.
- source_word: κακοτεχνήσωμεν πονηρόν
  choice: irgendeinen bösen Anschlag planen
  rationale: Bewahrt sowohl den Gedanken absichtsvoller Machenschaft als auch die ausdrückliche negative Wertung.
- source_word: ἐπιλυπήσωμεν
  choice: Kummer bereiten
  rationale: Entspricht dem Verursachen von Leid oder Betrübnis, ohne die Art der Schädigung unnötig festzulegen.
- source_word: τὸ σύνολον
  choice: auch nur im Geringsten
  rationale: 'Im Kontext verstärkt die Wendung die umfassende Verneinung: keinerlei Betrübung oder Schädigung.'
- source_word: ἀντικείμενον ἡμῖν
  choice: unser Gegner sein
  rationale: Gibt die adversative Bedeutung des Partizips klar wieder.
- source_word: ἐπʼ ἐκδίκησιν τῶν πραγμάτων
  choice: um diese Taten zu vergelten
  rationale: Bezieht die Vergeltung auf das zuvor beschriebene Vorgehen gegen die Juden; „vergelten“ wahrt den gerichtlichen Ernst.
- source_word: κατὰ πᾶν ἀφεύκτως διὰ παντὸς
  choice: Ihm werden wir keinesfalls entkommen – niemals
  rationale: Bildet die gehäufte und etwas spannungsreiche Verstärkung des Griechischen in verständlichem Deutsch nach.
- source_word: ἐρρῶσθε
  choice: Lebt wohl!
  rationale: Übliche abschließende Grußformel eines Erlasses oder Briefes; im Deutschen würdevoller als das missverständliche „Seid stark“.
theological_decisions:
- issue: Gott als vergeltender Gegner
  choice: Gott wird selbst als Gegner auftreten und die Taten vergelten
  alternative: Gott wird lediglich eine unpersönliche Strafe zulassen
  rationale: Der griechische Text bezeichnet ausdrücklich den höchsten Gott als denjenigen, der sich ihnen zur Vergeltung entgegenstellt.
- issue: πάσης ... δυνάμεως
  choice: der über jede Macht herrscht
  alternative: der über alle Heerscharen herrscht
  rationale: δύναμις kann Macht, Kraft oder Streitmacht bezeichnen. Ohne eindeutigen militärischen Zusatz bewahrt „jede Macht“ die größere semantische Weite.
translation_notes:
  register: Moderner, würdevoller Erlassstil. Die lange griechische Satzperiode wurde behutsam gegliedert, ohne die rhetorische Gegenüberstellung „nicht ein Mensch, sondern Gott“ oder die starke Aussage völliger und dauernder Unentrinnbarkeit abzuschwächen.
