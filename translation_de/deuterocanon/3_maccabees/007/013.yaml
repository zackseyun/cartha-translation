base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/013.yaml
  text: Then the priests of these people and the whole multitude[a], having praised him as was fitting, cried out[b], “Hallelujah!” and departed with joy.
translation:
  language: de
  text: Da priesen ihn[a], wie es sich gehörte, die Priester dieser Leute und die ganze Menge, riefen »Halleluja!«[b] und gingen voller Freude auseinander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »ihn« ist wahrscheinlich Gott gemeint; der griechische Text nennt das Bezugswort hier nicht noch einmal ausdrücklich.
    reason: alternative_reading
  - marker: b
    text: 'Auch: »Alleluja«; im Griechischen steht ein aus dem Hebräischen übernommener liturgischer Jubelruf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατευφημήσαντες
  choice: priesen
  rationale: Das Partizip bezeichnet nachdrücklichen öffentlichen Lobpreis oder Beifall. »priesen« ist im Deutschen klar, würdevoll und lässt offen, ob eine besondere liturgische Handlung gemeint ist.
- source_word: αὐτόν
  choice: ihn
  rationale: Das griechische Wort ist ein maskulines Pronomen im Akkusativ Singular. Der wahrscheinlich gemeinte Bezug auf Gott wird nicht ausdrücklich in den Haupttext eingesetzt.
- source_word: ὡς πρέπει ἦν
  choice: wie es sich gehörte
  rationale: Die idiomatische Wendung bezeichnet, was angemessen oder gebührend war; die gewählte Formulierung ist natürlich und bewahrt den rückblickenden Charakter von ἦν.
- source_word: οἱ τούτων ἱερεῖς
  choice: die Priester dieser Leute
  rationale: τούτων ist ein demonstrativer Genitiv Plural. »dieser Leute« bewahrt diesen Hinweis deutlicher als das bloße »ihre«, ohne im Deutschen unnatürlich zu wirken.
- source_word: πᾶν τὸ πλῆθος
  choice: die ganze Menge
  rationale: Die Übersetzung gibt sowohl πᾶν als auch den kollektiven Sinn von πλῆθος wieder und ist im modernen Deutschen verständlich.
- source_word: ἐπιφωνήσαντες
  choice: riefen
  rationale: Das Partizip bezeichnet einen laut hervorgebrachten Ruf. Die finite Wiedergabe ordnet die griechische Partizipialkonstruktion natürlich ins Deutsche ein.
- source_word: ἀλληλουιά
  choice: Halleluja
  rationale: Das griechische Wort gibt einen hebräischen liturgischen Jubelruf in Umschrift wieder. »Halleluja« ist die geläufige deutsche Form und bewahrt den gottesdienstlichen Charakter.
- source_word: μετὰ χαρᾶς
  choice: voller Freude
  rationale: Die Formulierung gibt den nominalen Ausdruck für die Freude idiomatisch und anschaulich wieder.
- source_word: ἀνέλυσαν
  choice: gingen auseinander
  rationale: Im Zusammenhang mit einer versammelten Menge bezeichnet das Verb ihr Fortgehen beziehungsweise die Auflösung der Versammlung. »gingen auseinander« passt auf Priester und Menge gleichermaßen.
theological_decisions:
- issue: Bezugswort von αὐτόν
  choice: Das Pronomen bleibt als »ihn« stehen.
  alternative: »Gott« ausdrücklich einsetzen
  rationale: Der Zusammenhang legt Gott als Bezugswort nahe, doch der griechische Text nennt an dieser Stelle nur ein Pronomen. Die Übersetzung bewahrt diese ausdrückliche Unbestimmtheit und erläutert den wahrscheinlichen Bezug in einer Fußnote.
- issue: Wiedergabe von ἀλληλουιά
  choice: Halleluja
  alternative: Alleluja; »Lobt Jah«
  rationale: Die Umschrift erhält den Charakter eines überlieferten liturgischen Jubelrufs. Eine vollständige Bedeutungsübersetzung würde die Form des Ausrufs stärker verändern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die griechischen Partizipien werden zur natürlichen deutschen Reihung finiter Verben aufgelöst; die zeitliche und logische Abfolge bleibt erhalten.
