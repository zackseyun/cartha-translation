lexical_decisions:
- source_word: προφερόμενοι
  choice: Dabei behaupteten sie
  rationale: Das Partizip bezeichnet eine vorgebrachte Behauptung oder Begründung. „Dabei behaupteten sie“ gibt diesen Anschluss in natürlichem Deutsch wieder, ohne den Ton unnötig als bloße Unterstellung festzulegen.
- source_word: μηδέποτε
  choice: niemals
  rationale: Das Adverb drückt eine uneingeschränkte zeitliche Verneinung aus; „niemals“ ist die klare und idiomatische Entsprechung.
- source_word: εὐσταθήσειν
  choice: gefestigt sein
  rationale: Das Verb bezeichnet Stabilität oder sicheren Bestand. Bei öffentlichen oder politischen Verhältnissen vermittelt „gefestigt sein“ den Sinn genauer als ein wörtliches „fest stehen“.
- source_word: τὰ πράγματα ἡμῶν
  choice: unsere Verhältnisse
  rationale: πράγματα meint hier die allgemeine öffentliche oder politische Lage. „Unsere Verhältnisse“ ist im Deutschen weiter und kontextgerechter als „unsere Angelegenheiten“.
- source_word: διʼ ἣν ἔχουσιν οὗτοι πρὸς τὰ ἔθνη δυσμένειαν
  choice: wegen der Feindseligkeit, die diese Leute gegenüber den Völkern hegten
  rationale: δυσμένεια bezeichnet Feindseligkeit oder Übelwollen. Der Relativsatz bildet die griechische Konstruktion verständlich ab; „hegten“ steht entsprechend der indirekten Rede im Präteritum.
- source_word: μέχρι ἂν συντελεσθῇ τοῦτο
  choice: bis dies vollendet sei
  rationale: συντελεσθῇ bezeichnet das Zu-Ende-Bringen oder Vollenden. „Dies“ lässt den im unmittelbaren Kontext vorausgesetzten Bezug ebenso unbestimmt wie das griechische τοῦτο; der Konjunktiv wahrt die berichtete Behauptung.
theological_decisions:
- issue: Wiedergabe von τὰ ἔθνη
  choice: die Völker
  alternative: die Nichtjuden
  rationale: „Die Völker“ wahrt den breiten griechischen Sinn und vermeidet, den Ausdruck vorschnell als festen theologischen Fachbegriff zu bestimmen. Da er im jüdischen Sprachgebrauch auch die Nichtjuden bezeichnen kann, wird diese Möglichkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die indirekte Rede wird durch Konjunktivformen kenntlich gemacht. Der Satzanschluss „Dabei“ spiegelt den partizipialen Charakter des griechischen Versanfangs wider.
