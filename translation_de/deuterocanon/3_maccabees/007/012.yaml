  yaml_path: translation/deuterocanon/3_maccabees/007/012.yaml
  text: And when he accepted that they were speaking the truth and encouraged them[a], he gave them full permission, so that they might destroy those who had transgressed the law of God throughout every place under his kingdom, with boldness[b], without any royal authority or oversight.
translation:
  language: de
  text: Er erkannte an, dass sie die Wahrheit sagten, und ermutigte sie; dann gab er ihnen uneingeschränkte Erlaubnis, damit sie diejenigen, die das Gesetz Gottes übertreten hatten, überall in seinem Herrschaftsgebiet mit Freimut vernichten konnten, ohne jede königliche Vollmacht und Aufsicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Schlusswendung kann auch heißen: „ohne jede königliche Amtsgewalt oder Überprüfung“ beziehungsweise „ohne Eingreifen oder Kontrolle des Königs“. Sie kann das Fehlen einer weiteren unmittelbaren königlichen Ermächtigung oder Kontrolle bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τἀληθὲς αὐτοὺς λέγειν
  choice: ihnen zugestanden hatte, dass sie die Wahrheit sagten
  rationale: Die Konstruktion bezeichnet die Anerkennung ihrer Aussage als wahr; „zugestanden“ gibt παραδεξάμενος in diesem Zusammenhang natürlich wieder.
- source_word: παραινέσας
  choice: sie ermutigt hatte
  rationale: Das Verb kann ermahnen, zureden oder ermutigen bedeuten. Hier bezeichnet es nach der Anerkennung ihres Berichts eine bestärkende Aufforderung.
- source_word: ἄδειαν πάντων
  choice: uneingeschränkte Erlaubnis
  rationale: ἄδεια bezeichnet Erlaubnis oder Handlungsfreiheit; πάντων unterstreicht deren umfassenden Umfang.
- source_word: τοὺς παραβεβηκότας τοῦ θεοῦ τὸν νόμον
  choice: alle, die das Gesetz Gottes übertreten hatten
  rationale: Das Perfektpartizip bezeichnet Personen, die das Gesetz verletzt hatten und damit als Übertreter galten.
- source_word: ἐξολεθρεύσωσιν
  choice: vernichten könnten
  rationale: Das starke Verb bezeichnet vollständige Vernichtung; die Übersetzung schwächt die Gewaltaussage nicht zu „bestrafen“ ab.
- source_word: κατὰ πάντα τὸν ὑπὸ τῆς βασιλείας αὐτοῦ τόπον
  choice: überall in seinem Herrschaftsgebiet
  rationale: Die Formulierung gibt die distributive räumliche Reichweite innerhalb des königlichen Machtbereichs idiomatisch wieder.
- source_word: μετὰ παρρησίας
  choice: ungehindert
  rationale: παρρησία kann offene, freie oder kühne Handlungsfreiheit bezeichnen. „Ungehindert“ passt hier zur gewährten Erlaubnis, ohne die Mehrdeutigkeit völlig auf eine emotionale Kühnheit festzulegen.
- source_word: ἄνευ πάσης βασιλικῆς ἐξουσίας καὶ ἐπισκέψεως
  choice: ohne jede königliche Bevollmächtigung oder Aufsicht
  rationale: ἐξουσία kann hier amtliche Ermächtigung bezeichnen, ἐπίσκεψις Aufsicht oder Überprüfung. Die auffällige Spannung zur zuvor gewährten Erlaubnis bleibt erhalten.
theological_decisions:
- issue: Gewalt gegen Übertreter des Gesetzes Gottes
  choice: Die ausdrückliche Erlaubnis zur Vernichtung bleibt unverhüllt stehen.
  alternative: Die Handlung als „bestrafen“ oder „entfernen“ abschwächen.
  rationale: ἐξολεθρεύσωσιν ist ein starkes Vernichtungsverb; der Vers selbst fügt keine moralische Rechtfertigung oder Einschränkung hinzu.
- issue: Spannung zwischen königlicher Erlaubnis und fehlender königlicher ἐξουσία
  choice: „ohne jede königliche Bevollmächtigung oder Aufsicht“
  alternative: „ohne jedes Eingreifen oder jede Kontrolle des Königs“
  rationale: Die syntaktisch und sachlich schwierige Schlusswendung wird nicht harmonisiert. Sie kann das Fehlen einer jeweils gesonderten amtlichen Bevollmächtigung oder unmittelbaren königlichen Kontrolle meinen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gewalt des Ausgangstextes wird nicht euphemistisch abgeschwächt. Die ungewöhnliche Spannung zwischen umfassender Erlaubnis und fehlender königlicher Bevollmächtigung beziehungsweise Aufsicht bleibt erkennbar; Fußnoten markieren die wesentlichen lexikalischen Alternativen.
