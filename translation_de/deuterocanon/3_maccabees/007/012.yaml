revisions:
- from: Als er ihnen zugestanden hatte, dass sie die Wahrheit sagten, und sie ermutigt hatte, gab er ihnen uneingeschränkte Erlaubnis, damit sie alle, die das Gesetz Gottes übertreten hatten, überall in seinem Herrschaftsgebiet ungehindert[a] vernichten könnten, ohne jede königliche Bevollmächtigung oder Aufsicht.[b]
  to: Er erkannte an, dass sie die Wahrheit sagten, und ermutigte sie; dann gab er ihnen uneingeschränkte Erlaubnis, damit sie diejenigen, die das Gesetz Gottes übertreten hatten, überall in seinem Herrschaftsgebiet mit Freimut vernichten konnten, ohne jede königliche Vollmacht und Aufsicht.[a]
  rationale: Die Revision entfernt die nicht im Ausgangstext ausgedrückte Totalisierung „alle“, ersetzt die zu schwache Wiedergabe von μετὰ παρρησίας durch „mit Freimut“ und glättet die Satzführung. Die auffällige Spannung zwischen der erteilten Erlaubnis und der abschließenden Aussage über fehlende königliche Vollmacht bzw. Aufsicht wird nicht harmonisiert; die Fußnote dokumentiert die möglichen Nuancen.
