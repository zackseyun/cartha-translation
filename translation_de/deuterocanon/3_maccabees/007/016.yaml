base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/016.yaml
  text: But those who had held fast to God even to death[a], having obtained complete deliverance, departed from the city, strewn with all kinds of very fragrant flowers, with rejoicing and shouting, giving thanks with praises and full songs of hymns to God, the holy Savior of Israel[b], the God of their fathers.
translation:
  language: de
  text: Sie aber, die bis zum Tod an Gott festgehalten hatten[a], hatten vollständige Rettung erfahren. Mit den verschiedensten, überaus duftenden Blüten geschmückt, zogen sie voller Freude und unter Jubelrufen aus der Stadt fort. Mit Lobpreisungen und volltönenden Hymnen dankten sie dem Gott ihrer Vorfahren, dem heiligen Retter Israels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Bis zum Tod“ kann hier auch bedeuten: bis an die Grenze des Todes oder selbst angesichts der Todesgefahr; es wird nicht gesagt, dass sie tatsächlich starben.'
    reason: semantic_ambiguity
  - marker: b
    text: Das griechische Wort kann sowohl „Retter“ als auch „Heiland“ bedeuten; ebenso kann das zuvor mit „Rettung“ wiedergegebene Wort auch „Heil“ bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέχρι θανάτου τὸν θεὸν ἐσχηκότες
  choice: die bis zum Tod an Gott festgehalten hatten
  rationale: ἔχω bezeichnet hier nicht Besitz, sondern beständige Bindung und Treue. „Bis zum Tod“ bewahrt die Zuspitzung des griechischen Ausdrucks, ohne ausdrücklich zu behaupten, dass sie tatsächlich starben.
- source_word: παντελῆ σωτηρίαν ἀπόλαυσιν ἐσχηκότες
  choice: hatten vollständige Rettung erfahren
  rationale: σωτηρία bezeichnet im unmittelbaren Erzählzusammenhang die erfahrene Bewahrung und Rettung; παντελής verstärkt sie als vollständig. „Erfahren“ gibt die idiomatische Verbindung mit ἀπόλαυσις natürlich wieder.
- source_word: ἀνέζευξαν ἐκ τῆς πόλεως
  choice: zogen sie aus der Stadt fort
  rationale: ἀναζεύγνυμι bezeichnet das Aufbrechen oder Fortziehen und hat hier einen prozessionsartigen, feierlichen Klang.
- source_word: παντοίοις εὐωδεστάτοις ἄνθεσι κατεστρωμένοι
  choice: mit den verschiedensten, überaus duftenden Blüten geschmückt
  rationale: Das passive Partizip bezieht sich auf die Fortziehenden. „Geschmückt“ ist im Kontext einer festlichen Prozession natürlicher als das wörtlichere „bedeckt“; der Superlativ εὐωδεστάτοις wird durch „überaus duftend“ wiedergegeben.
- source_word: μετʼ εὐφροσύνης καὶ βοῆς
  choice: voller Freude und unter Jubelrufen
  rationale: εὐφροσύνη bezeichnet festliche Freude, βοή einen lauten Ruf. Im gegebenen Feierzusammenhang trifft „Jubelrufe“ die Funktion des Rufens.
- source_word: ἐν αἴνοις καὶ παμμελέτοις ὕμνοις
  choice: mit Lobpreisungen und volltönenden Hymnen
  rationale: αἶνοι sind Äußerungen des Lobes. Das seltene παμμελέτοις hebt den umfassend musikalischen oder klangvollen Charakter der Hymnen hervor; „volltönend“ bewahrt diese Steigerung, ohne eine bestimmte Aufführungspraxis festzulegen.
- source_word: τῷ θεῷ τῶν πατέρων αὐτῶν
  choice: dem Gott ihrer Vorfahren
  rationale: Die traditionelle Wendung wird in modernem, inklusiv verständlichem Deutsch wiedergegeben; gemeint ist der Gott der vorausgegangenen Generationen.
- source_word: ἁγίῳ σωτῆρι τοῦ Ἰσραήλ
  choice: dem heiligen Retter Israels
  rationale: σωτήρ kann „Retter“ oder „Heiland“ bedeuten. „Retter“ passt zur unmittelbar gefeierten Befreiung und wahrt zugleich den titelartigen Charakter der Apposition.
theological_decisions:
- issue: Bedeutungsumfang von σωτηρία und σωτήρ
  choice: σωτηρία als „Rettung“ und σωτήρ als „Retter“
  alternative: „Heil“ und „Heiland“ oder gemischt „Rettung“ und „Heiland“
  rationale: Der Vers spricht unmittelbar von historischer Bewahrung vor dem Tod, verwendet dafür aber auch theologisch weitreichende Heilsbegriffe. „Rettung/Retter“ hält den Erzählbezug klar; die Fußnote weist auf den weiteren Bedeutungsumfang hin.
- issue: Reichweite von μέχρι θανάτου
  choice: „bis zum Tod“
  alternative: „bis in den Tod“ oder „selbst angesichts des Todes“
  rationale: Die formale Zuspitzung bleibt erhalten. Da die Betroffenen gerettet wurden, darf die Wendung nicht so erklärt werden, als seien sie tatsächlich gestorben; sie kann Treue bis an die äußerste Todesgrenze bezeichnen.
- issue: Appositionen am Versende
  choice: „dem Gott ihrer Vorfahren, dem heiligen Retter Israels“
  alternative: „dem heiligen Retter Israels, dem Gott ihrer Vorfahren“
  rationale: Die gewählte Reihenfolge folgt dem Griechischen und versteht beide Bezeichnungen als auf denselben Gott bezogene Appositionen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Prozessionscharakter. Die Satzfolge wurde gegenüber der langen griechischen Periode behutsam gegliedert, ohne die logischen Bezüge oder die doxologische Steigerung aufzulösen.
