base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/007.yaml
  text: Considering that he has always fought alongside us like a father for his sons[a], and reckoning the firm goodwill they have toward us and our forefathers as that of a friend[b], we have rightly released them in every way from any charge whatever.
translation:
  language: de
  text: Da wir bedenken, dass er wie ein Vater allezeit für seine Söhne als Verbündeter kämpft[a], und das feste Wohlwollen eines Freundes berücksichtigen, das sie uns und unseren Vorfahren entgegenbringen, haben wir sie mit Recht vollständig von jedem nur denkbaren Beschuldigungsgrund entbunden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass er ihnen wie ein Vater seinen Söhnen allezeit als Verbündeter beisteht“. Das griechische Verb kann sowohl das Kämpfen als auch allgemeiner die Hilfe eines Verbündeten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Schlussformulierung ist stark nachdrücklich und lautet wörtlicher etwa: „von jeder Ursache auf welche Weise auch immer“. Gemeint ist die vollständige Befreiung von jedem möglichen Beschuldigungsgrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς πατέρα ὑπὲρ υἱῶν
  choice: wie ein Vater … für seine Söhne
  rationale: ὡς mit dem Akkusativ bezeichnet hier einen Vergleich; ὑπέρ drückt Eintreten zugunsten anderer aus. Das im Deutschen sinngemäß ergänzte Possessivpronomen ergibt sich aus dem Vater-Sohn-Vergleich.
- source_word: διὰ παντὸς συμμαχοῦντα
  choice: allezeit … kämpft
  rationale: διὰ παντός bezeichnet fortdauerndes Handeln; συμμαχέω kann sowohl das gemeinsame Kämpfen als auch allgemeiner das Beistehen als Verbündeter ausdrücken. Die Übersetzung wahrt den kämpferischen Grundton, ohne das im Griechischen nicht ausdrücklich stehende „mit uns“ einzufügen.
- source_word: βεβαίαν … εὔνοιαν
  choice: beständige freundschaftliche Gesinnung
  rationale: εὔνοια bezeichnet Wohlwollen oder eine wohlgesinnte Haltung; βεβαίαν hebt deren Festigkeit und Verlässlichkeit hervor. „Freundschaftlich“ nimmt zugleich die Charakterisierung durch τοῦ φίλου auf.
- source_word: ἣν ἔχουσιν … πρὸς ἡμᾶς καὶ τοὺς προγόνους ἡμῶν
  choice: die sie uns und unseren Vorfahren gegenüber hegen
  rationale: ἔχειν εὔνοιαν πρός bedeutet, jemandem gegenüber Wohlwollen zu hegen. „Vorfahren“ ist die natürliche moderne Wiedergabe von προγόνους.
- source_word: ἀναλογιζόμενοι
  choice: da wir bedenken … und … berücksichtigen
  rationale: Das Partizip bezeichnet die Erwägungen, auf denen die folgende Entscheidung beruht. Die zweigliedrige deutsche Form bildet die beiden berücksichtigten Gesichtspunkte klar ab.
- source_word: δικαίως ἀπολελύκαμεν
  choice: haben wir sie mit Recht … freigesprochen
  rationale: Das Perfekt bezeichnet eine vollzogene Entscheidung mit fortbestehender Wirkung. Im rechtlichen Zusammenhang gibt „freigesprochen“ die Entlassung aus einer Beschuldigung prägnant wieder.
- source_word: πάσης καθʼ ὁντινοῦν αἰτίας τρόπον
  choice: von jeder nur denkbaren Beschuldigung
  rationale: Die gehäufte griechische Wendung betont umfassend, dass keinerlei Beschuldigungsgrund bestehen bleibt. Die deutsche Form gibt diesen emphatischen rechtlichen Gesamtsinn natürlich wieder.
theological_decisions:
- issue: Bezug des singularischen Partizips συμμαχοῦντα
  choice: „er … kämpft“ ohne ausdrückliches Objekt
  alternative: „er kämpft an unserer Seite“
  rationale: Der griechische Vers setzt einen singularischen männlichen Bezug aus dem Kontext voraus, nennt aber bei συμμαχοῦντα kein ausdrückliches „mit uns“. Die Übersetzung wahrt diese syntaktische Offenheit und vermeidet eine unbelegte Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlichem Ton. Die Satzperiode bleibt dem amtlichen Stil des Ausgangstextes entsprechend gehoben, wird aber durch klare Verbführung verständlich gehalten.
