base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/005.yaml
  text: These men[a], after bringing them down in chains with abuse, as servants—or rather, as conspirators—attempted to destroy them without any hearing or examination[c][b], having clothed themselves in a savagery more brutal than the law of the Scythians.
translation:
  language: de
  text: Diese Männer führten sie gefesselt und unter Misshandlungen hinab, wie Sklaven, ja vielmehr wie Verschwörer, und versuchten, sie ohne jedes Verhör und jede Untersuchung zu töten, erfüllt von einer Grausamkeit, die wilder war als das Gesetz der Skythen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gesetz der Skythen“ kann hier auch „Brauch der Skythen“ bedeuten. Die Skythen galten in der antiken Rhetorik als Sinnbild äußerster Grausamkeit.
    reason: cultural_note
lexical_decisions:
- source_word: δεσμίους καταγαγόντες
  choice: führten sie gefesselt … ab
  rationale: δεσμίους bezeichnet sie als Gebundene bzw. Gefangene; „gefesselt“ bewahrt den konkreten Sinn. καταγαγόντες hat zwar wörtlich eine abwärts gerichtete Bedeutung, meint im Zusammenhang aber das Abführen unter Bewachung, ohne dass das Ziel genannt wird.
- source_word: μετὰ σκυλμῶν
  choice: unter Misshandlungen
  rationale: Die Wendung bezeichnet hier belastende, erniedrigende Behandlung. „Unter Misshandlungen“ ist im Deutschen natürlich und passt zum Umgang mit gefesselten Menschen besser als eine auf Sachraub bezogene Wiedergabe.
- source_word: ὡς ἀνδράποδα
  choice: als wären sie Sklaven
  rationale: ἀνδράποδα bezeichnet versklavte Menschen, besonders als Beute behandelte Personen. „Sklaven“ erhält die entmenschlichende Schärfe; der Irrealis „als wären“ verdeutlicht den vergleichenden Charakter von ὡς.
- source_word: μᾶλλον δὲ ὡς ἐπιβούλους
  choice: oder vielmehr Verschwörer
  rationale: μᾶλλον δέ korrigiert und steigert die erste Bezeichnung. ἐπίβουλοι sind Menschen, denen feindselige Nachstellung oder ein Anschlag unterstellt wird; „Verschwörer“ gibt dies knapp wieder.
- source_word: ἄνευ πάσης ἀνακρίσεως καὶ ἐξετάσεως
  choice: ohne jedes Verhör und jede Untersuchung
  rationale: Die beiden Begriffe bezeichnen Prüfung und Befragung in einem rechtlichen Verfahren. Die Paarung bewahrt den Nachdruck des griechischen Textes, ohne vorschnell ein förmliches Gerichtsverfahren vorauszusetzen.
- source_word: ἐπεχείρησαν ἀνελεῖν
  choice: versuchten, sie … zu töten
  rationale: ἐπιχειρέω mit Infinitiv bezeichnet den Versuch oder das Unternehmen; ἀναιρέω bedeutet hier eindeutig gewaltsames Töten. „Töten“ ist genauer als das im Deutschen mehrdeutige „vernichten“.
- source_word: νόμου Σκυθῶν ἀγριοτέραν
  choice: noch wilder … als das Gesetz der Skythen
  rationale: „Gesetz“ bildet νόμος formal ab und lässt die mögliche Bedeutung „Brauch/Sitte“ offen. „Wilder“ erhält den Vergleich mit ἀγριοτέραν und die scharfe antike Rhetorik.
- source_word: ἐνπεπηρμένοι ὠμότητα
  choice: Sie hatten sich eine Grausamkeit angelegt
  rationale: Die griechische Form und Metaphorik sind schwierig; im Zusammenhang bezeichnet sie das Annehmen bzw. Sich-Ausrüsten mit Grausamkeit. Die bildhafte Wiedergabe vermeidet die Abschwächung zu bloßem innerem Empfinden.
theological_decisions:
- issue: Entmenschlichende Statusbezeichnung ὡς ἀνδράποδα
  choice: als wären sie Sklaven
  alternative: als wären sie Gefangene
  rationale: Der Ausdruck beschreibt nicht bloß Gefangenschaft, sondern die Behandlung von Menschen als versklavte Beute. Die härtere Statussprache wird deshalb nicht beschönigt.
- issue: Rechtliche Färbung von ἀνάκρισις und ἐξέτασις
  choice: Verhör und Untersuchung
  alternative: Anhörung und Prüfung
  rationale: Die Übersetzung macht das Fehlen jeder Sachprüfung deutlich, behauptet aber nicht mehr, als der Text sagt, etwa ein vollständig ausgestaltetes Gerichtsverfahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlicher und rhetorischer Schärfe. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die Steigerung „Sklaven – oder vielmehr Verschwörer“ und das Bild des Anlegens von Grausamkeit bleiben erhalten.
