base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/020.yaml
  text: After also inscribing these things on a pillar[a], and establishing a place of prayer at the site of the banquet, they departed unharmed, free, and overflowing with joy, being brought safely back by land and sea and rivers, by the king’s command[b],
translation:
  language: de
  text: Nachdem sie dies auch öffentlich auf einer Stele festgehalten[a] und am Ort des Festmahls eine Gebetsstätte eingerichtet hatten, brachen sie unversehrt, frei und überglücklich auf und wurden auf Befehl des Königs über Land und Meer und auf Flüssen sicher zurückgebracht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „feierlich auf einer Stele gewidmet“. Das griechische Verb kann sowohl das öffentliche Anbringen als auch eine feierliche Widmung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurden … sicher bewahrt“. Das griechische Partizip betont ihre unversehrte Rückkehr auf der Reise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιερώσαντες
  choice: öffentlich hatten anbringen lassen
  rationale: In Verbindung mit ἐν στήλῃ bezeichnet das Partizip hier am ehesten die öffentliche und dauerhafte Anbringung des Inhalts auf einer Stele. Die Formulierung wahrt zugleich den möglichen Beiklang einer feierlichen Widmung, ohne bloß den technischen Akt des Einmeißelns zu behaupten.
- source_word: στήλῃ
  choice: Stele
  rationale: Eine Stele ist ein aufgerichteter, meist steinerner Inschriften- oder Gedenkträger. Das im Deutschen gebräuchliche Wort ist hier genauer als „Säule“.
- source_word: κατὰ τὸν τῆς συμποσίας τόπον
  choice: am Ort des Festmahls
  rationale: Die Wendung bezeichnet den mit dem Festmahl verbundenen Ort; „am Ort“ gibt den lokalen Sinn von κατά natürlich wieder.
- source_word: προσευχῆς … καθιδρύσαντες
  choice: eine Gebetsstätte eingerichtet hatten
  rationale: καθιδρύω bezeichnet ein festes Einrichten oder Begründen. „Gebetsstätte“ gibt τόπον προσευχῆς knapp und idiomatisch wieder.
- source_word: ἀνέλυσαν
  choice: brachen … auf
  rationale: Das Verb bezeichnet hier angesichts der anschließenden Reiseangaben das Aufbrechen von einem Ort; „kehrten zurück“ wäre stärker kontextuell festgelegt.
- source_word: ἀσινεῖς
  choice: unversehrt
  rationale: Das Adjektiv betont, dass sie keinen Schaden erlitten hatten.
- source_word: ἐλεύθεροι
  choice: frei
  rationale: Die direkte Wiedergabe erhält den Nachdruck auf ihrer erlangten Freiheit.
- source_word: ὑπέρχαρεις
  choice: überglücklich
  rationale: Das verstärkte Adjektiv bezeichnet außergewöhnlich große Freude; „überglücklich“ ist modern und wahrt die Intensität.
- source_word: ἀνασωζόμενοι
  choice: wurden … sicher zurückgebracht
  rationale: Das Partizip verbindet Bewahrung mit erfolgreicher Rückkehr. Die passive Form lässt den Handelnden ungenannt, wie es auch der griechische Satz tut.
- source_word: διὰ τε γῆς καὶ θαλάσσης καὶ ποταμῶν
  choice: auf dem Landweg, über das Meer und auf Flüssen
  rationale: Die Übersetzung bewahrt die drei genannten Reisewege und gibt den Plural ποταμῶν ausdrücklich wieder.
- source_word: τῇ τοῦ βασιλέως ἐπιταγῇ
  choice: auf Befehl des Königs
  rationale: ἐπιταγή bezeichnet eine verbindliche königliche Anordnung; die deutsche Wendung ist präzise und idiomatisch.
theological_decisions:
- issue: Dauerhaftigkeit der Gebetsstätte am Ort des Festmahls
  choice: „eine Gebetsstätte eingerichtet“ als bleibende Gedenkhandlung
  alternative: „einen Ort zum Gebet bestimmt“ als weniger dauerhafte Handlung
  rationale: καθιδρύσαντες spricht eher für ein festes Einrichten. Die Übersetzung beschreibt die Handlung, ohne ihr eine spätere institutionelle oder konfessionelle Bedeutung beizulegen.
- issue: Handelnder bei der sicheren Rückkehr
  choice: Passiv formuliert und keinen göttlichen Handelnden ausdrücklich genannt
  alternative: Eine aktive Formulierung wie „Gott brachte sie sicher zurück“
  rationale: Der weitere Zusammenhang kann göttliche Bewahrung nahelegen, doch diese Klausel nennt Gott nicht ausdrücklich und führt den königlichen Befehl als maßgeblichen äußeren Umstand an. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Stele“ ist sachlich präzise und im Deutschen hinreichend geläufig. Die Aufzählung „unversehrt, frei und überglücklich“ bewahrt den feierlichen Rhythmus des Griechischen. Das abschließende Komma bleibt stehen, weil der griechische Vers syntaktisch in den folgenden Zusammenhang weiterführt.
