  to: Und alle erhielten aufgrund des Verzeichnisses[a] ihren gesamten Besitz zurück, sodass diejenigen, die etwas davon besaßen, es ihnen in größter Furcht zurückgaben, weil der große Gott zu ihrer Rettung[b] seine Machttaten vollständig vollbracht hatte.
