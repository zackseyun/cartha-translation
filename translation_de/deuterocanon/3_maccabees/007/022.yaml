  yaml_path: translation/deuterocanon/3_maccabees/007/022.yaml
  text: And all of them recovered all their own property from the registration, so that those who had anything gave it back to them with the greatest fear, since the great God had fully accomplished mighty deeds for their deliverance.
translation:
  language: de
  text: Und alle erhielten aufgrund des Verzeichnisses[a] ihren gesamten Besitz zurück, sodass diejenigen, die etwas davon besaßen, es ihnen in größter Furcht zurückgaben, weil der große Gott zu ihrer Rettung[b] seine Machttaten vollständig vollbracht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgrund der amtlichen Erfassung“ beziehungsweise „aufgrund der Bestandsliste“. Das griechische Wort kann eine behördliche Erfassung von Personen oder Eigentum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu ihrem Heil“. Das griechische Wort kann sowohl die konkrete Rettung aus einer Gefahr als auch Heil in einem umfassenderen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκομίσαντο
  choice: erhielten … zurück
  rationale: Das Medium bezeichnet hier die Wiedererlangung dessen, was ihnen gehörte. „Erhielten … zurück“ ist im Deutschen natürlich und wahrt den Gedanken der Rückgabe.
- source_word: ἐξ ἀπογραφῆς
  choice: anhand des Verzeichnisses
  rationale: ἀπογραφή bezeichnet eine amtliche Erfassung, Registrierung oder Bestandsliste. „Anhand des Verzeichnisses“ gibt sowohl den administrativen Charakter als auch die Funktion des Dokuments bei der Rückgabe wieder, ohne es als Volkszählung festzulegen.
- source_word: πάντα τὰ ἑαυτῶν
  choice: ihren gesamten Besitz
  rationale: Die substantivierte Wendung meint alles, was ihnen selbst gehörte. „Gesamter Besitz“ ist klarer und natürlicher als das formalere „alles Ihrige“.
- source_word: τοὺς ἔχοντάς τι
  choice: diejenigen, die etwas davon hatten
  rationale: Das ergänzte „davon“ macht im Deutschen deutlich, dass es um Gegenstände aus dem Besitz der Betroffenen geht, ohne den unbestimmten Umfang von τι einzuengen.
- source_word: μετὰ φόβου μεγίστου
  choice: in größter Furcht
  rationale: Die Formulierung bewahrt den Superlativ und gibt φόβος angesichts des göttlichen Eingreifens als wirkliche Furcht wieder, nicht lediglich als Ehrfurcht.
- source_word: ἀποδοῦναι αὐτοῖς
  choice: gaben es ihnen … zurück
  rationale: Die Wendung bezeichnet die Rückerstattung an die rechtmäßigen Eigentümer und wird idiomatisch wiedergegeben.
- source_word: τὰ μεγαλεῖα
  choice: seine Machttaten
  rationale: Das Substantiv bezeichnet große, machtvolle Taten, besonders Taten Gottes. „Machttaten“ wahrt den gehobenen biblischen Ton, ohne altertümlich zu wirken.
- source_word: ποιήσαντος τελέως
  choice: in vollem Maß vollbracht hatte
  rationale: Die Formulierung gibt sowohl die vollzogene Handlung als auch die verstärkende Bedeutung von τελέως wieder und vermeidet die schwerfällige Dopplung „vollständig vollbracht“.
- source_word: ἐπὶ σωτηρίᾳ αὐτῶν
  choice: zu ihrer Rettung
  rationale: Im Erzählzusammenhang steht die konkrete Befreiung aus Gefahr im Vordergrund. „Rettung“ bewahrt zugleich die weiter reichende theologische Bedeutungsmöglichkeit von σωτηρία.
theological_decisions:
- issue: Bedeutung von σωτηρία im erzählerischen Zusammenhang
  choice: Rettung
  alternative: Heil
  rationale: Der Vers preist Gottes konkretes rettendes Eingreifen zugunsten des Volkes. „Rettung“ entspricht diesem unmittelbaren Zusammenhang, während „Heil“ als breitere theologische Lesart in der Fußnote erhalten bleibt.
- issue: Kausale Funktion des Genitivus absolutus ποιήσαντος
  choice: weil
  alternative: nachdem / wobei
  rationale: Der Zusammenhang stellt die vollbrachten Machttaten Gottes als Grund für die furchtsame Rückgabe dar. Die griechische Partizipialkonstruktion ist jedoch nicht ausdrücklich mit einer Konjunktion markiert; andere adverbiale Nuancen bleiben grammatisch möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Verständlichkeit des langen griechischen Satzgefüges. „Machttaten“ hält den erhöhten Ton, während „erhielten … zurück“ und „gaben … zurück“ bewusst klar und alltagssprachlich bleiben.
