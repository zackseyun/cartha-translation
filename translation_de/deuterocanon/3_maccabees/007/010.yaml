  - severity: medium
    issue: Fußnote b bezeichnet eine syntaktisch geglättete deutsche Umschreibung als „wörtlicher“.
    rationale: 'Der griechische Wortlaut ist tatsächlich schwierig: τὸν ἅγιον θεόν steht vor παραβεβηκότας, während τοῦ θεοῦ τὸν νόμον danach folgt. Die bisherige Fußnote verschleiert diese Stellung und erläutert die Schwierigkeit nicht präzise genug. Die Übersetzung selbst kann die Beziehung vorsichtig als Vergehen gegen Gott durch Übertretung seines Gesetzes wiedergeben, sollte dies aber als Deutung kenntlich machen.'
