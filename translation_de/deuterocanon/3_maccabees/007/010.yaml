  source_fidelity: 'Die Übersetzung gibt die wesentlichen Satzelemente zuverlässig wieder: den Erhalt des Briefes, das nicht sofortige Tätigwerden hinsichtlich der ἄφοδος, die Bitte an den König, die jüdischen Gesetzesübertreter und die ihnen zustehende Strafe durch die Bittsteller. Die schwierige griechische Verbindung von „dem heiligen Gott“ und „Gottes Gesetz“ wird nicht wie in der englischen Konsultationsfassung zu „dem Gesetz des heiligen Gottes“ eingeebnet. Allerdings gibt „machten sie sich ... bereit“ das Moment des Sich-Beeilens (ἐσπούδασαν) zu schwach wieder.'
  naturalness: Der deutsche Satzbau und das Register sind überwiegend natürlich und würdevoll. „Sie beeilten sich nicht sofort mit dem Aufbruch“ ist idiomatischer und näher am Verb als „machten sie sich nicht sogleich zum Aufbruch bereit“.
  terminology: „Angehörige des jüdischen Volkes“, „heiliger Gott“, „Gottes Gesetz“ und „gebührende Strafe“ sind sachgerecht. „Aus eigenem Entschluss“ gibt αὐθαιρέτως angemessen wieder. Die Fußnote zur schwierigen Konstruktion muss jedoch den griechischen Befund präziser beschreiben und darf keine nur scheinbar wörtliche, im Deutschen irreführende Paraphrase bieten.
