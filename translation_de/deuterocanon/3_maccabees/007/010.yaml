base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/010.yaml
  text: But when they received this letter[a], they did not immediately hasten about the departure; instead, they urged the king that those from the Jewish race who had willfully transgressed the law of the holy God might, through them[c][b], receive the punishment that was due.
translation:
  language: de
  text: Als sie diesen Brief erhalten hatten, beeilten sie sich nicht sofort mit dem Aufbruch[a]. Vielmehr baten sie den König, die Angehörigen des jüdischen Volkes, die sich aus eigenem Entschluss gegen den heiligen Gott vergangen hatten, indem sie Gottes Gesetz übertraten[b], durch sie die ihnen gebührende Strafe erleiden zu lassen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der Rückkehr“. Das griechische Wort kann je nach Blickrichtung den Weggang oder die Rückkehr bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Satzbau ist schwierig: Er nennt sowohl „den heiligen Gott“ als auch „Gottes Gesetz“. Die Übersetzung versteht die Gesetzesübertretung als das Vergehen gegen Gott; auch der genaue syntaktische Zusammenhang ist nicht völlig eindeutig.'
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: 'Wörtlicher: „durch sie die gebührende Strafe empfangen“. Gemeint sein kann auch: „von ihrer Hand die gebührende Strafe erleiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαβόντες δὲ τὴν ἐπιστολὴν ταύτην
  choice: Als sie diesen Brief erhalten hatten
  rationale: Das Aoristpartizip bezeichnet den vorausgehenden Umstand; ein temporaler Nebensatz ist im Deutschen natürlich. δέ führt die Erzählung weiter, ohne dass stets ein ausdrückliches „aber“ nötig ist.
- source_word: οὐκ ἐσπούδασαν εὐθέως περὶ τὴν ἄφοδον
  choice: machten sie sich nicht sogleich zum Aufbruch bereit
  rationale: σπουδάζω bezeichnet hier eiliges beziehungsweise entschlossenes Tätigwerden. ἄφοδος kann je nach Blickrichtung Aufbruch, Weggang oder Rückkehr bedeuten; „Aufbruch“ passt zum unmittelbaren Erzählzusammenhang, die Alternative wird in einer Fußnote erhalten.
- source_word: προσηξίωσαν τὸν βασιλέα
  choice: baten sie den König
  rationale: Das Verb bezeichnet hier eine an den König gerichtete nachdrückliche Bitte. „Baten“ ist idiomatisch und lässt deren respektvollen, förmlichen Charakter erkennen.
- source_word: τοὺς ἐκ τοῦ γένους τῶν Ἰουδαίων
  choice: die Angehörigen des jüdischen Volkes
  rationale: γένος bezeichnet Abstammung, Volkszugehörigkeit oder Sippe. „Angehörige des jüdischen Volkes“ gibt den ethnischen Bezug natürlich wieder, ohne den modernen biologischen Beiklang von „Rasse“ einzutragen.
- source_word: αὐθαιρέτως
  choice: aus eigenem Entschluss
  rationale: Das Adverb betont, dass die Übertretung freiwillig und selbstgewählt geschah. Die Formulierung wahrt diesen Sinn, ohne übermäßig juristisch zu klingen.
- source_word: τὸν ἅγιον θεὸν … παραβεβηκότας τοῦ θεοῦ τὸν νόμον
  choice: die sich … gegen den heiligen Gott vergangen hatten, indem sie Gottes Gesetz übertraten
  rationale: Der überlieferte griechische Satz stellt sowohl „den heiligen Gott“ als auch „das Gesetz Gottes“ in eine schwierige Beziehung zu παραβεβηκότας. Die Wiedergabe erhält beide Angaben und versteht die Gesetzesübertretung als Erläuterung des Vergehens gegen Gott, statt eine der beiden Wendungen auszulassen.
- source_word: τυχεῖν διʼ αὐτῶν τῆς ὀφειλομένης κολάσεως
  choice: durch sie die ihnen gebührende Strafe erleiden zu lassen
  rationale: τυγχάνω mit Genitiv kann „zuteilwerden/erlangen“ bedeuten; bei κολάσεως ergibt sich im Deutschen natürlich „eine Strafe erleiden“. διʼ αὐτῶν ist instrumental als „durch sie“ wiedergegeben, während die genaue Rolle der Handelnden offenbleibt.
theological_decisions:
- issue: Verhältnis zwischen dem heiligen Gott und Gottes Gesetz im schwierigen griechischen Wortlaut
  choice: Die Betroffenen vergingen sich gegen den heiligen Gott, indem sie Gottes Gesetz übertraten.
  alternative: „die den heiligen Gott und Gottes Gesetz übertreten hatten“ oder, wie in der englischen Konsultationsfassung, „die das Gesetz des heiligen Gottes übertreten hatten“
  rationale: Der griechische Wortlaut enthält ausdrücklich sowohl τὸν ἅγιον θεόν als auch τοῦ θεοῦ τὸν νόμον. Die gewählte Fassung bewahrt beide, vermeidet jedoch die sachlich und sprachlich ungewöhnliche Aussage, Gott selbst sei „übertreten“ worden. Zugleich verschmilzt sie die beiden Ausdrücke nicht stillschweigend zu „Gesetz des heiligen Gottes“.
- issue: Art der schuldhaften Handlung
  choice: „aus eigenem Entschluss“
  alternative: „vorsätzlich“ oder „eigenmächtig“
  rationale: Die Übersetzung hält fest, dass die Handlung selbstgewählt war, ohne eine weitergehende dogmatische Aussage über Willensfreiheit oder einen spezifisch juristischen Vorsatzbegriff einzuführen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Jüdisches Volk“ vermeidet den heute missverständlichen Ausdruck „jüdische Rasse“. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert; die ungewöhnliche Syntax und die mögliche Mehrdeutigkeit werden durch Fußnoten offengelegt.
