    issue: „zurückgebracht“ ist für καταχθέντες zu festgelegt.
    rationale: κατάγω kann je nach Kontext hinab-, weg- oder zurückführen. Der Text nennt weder ausdrücklich ein „Zurück“ noch ein Ziel; „hinabgeführt“ wahrt die bildliche und semantische Offenheit.
