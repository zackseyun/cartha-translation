  source_fidelity: Die Fassung trifft Beschluss, Festbegehung, Dauer und Freude im Wesentlichen gut. „zurückgebracht“ legt bei καταχθέντες jedoch eine Rückkehr stärker fest, als das griechische Wort selbst verlangt. Außerdem macht „brachten sie den gebührenden Dank dar“ aus der begleitenden Präpositionalgruppe eine neue aktive Handlung und kann damit den Bezug der Danksagungen verschieben.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. Die revidierte Formulierung mit „unter gebührenden Danksagungen“ ist ebenso natürlich und bildet die griechische Satzstruktur genauer ab. „Aufenthalt als Fremde“ ist knapper und präziser als „Aufenthalt in der Fremde“.
  terminology: „Freudentage“ und „begehen“ geben εὐφροσύνους beziehungsweise ἄγειν τὰς ἡμέρας treffend wieder. „Danksagungen“ wahrt für ἐξομολογήσεις die im Kontext naheliegende Bedeutung, während die Fußnote die möglichen Bedeutungsnuancen nennt. „Aufenthalt als Fremde“ gibt παροικία wieder, ohne ein Exil zu behaupten.
  issues:
