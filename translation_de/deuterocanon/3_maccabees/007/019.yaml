base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/019.yaml
  text: And after they had been brought down in peace[a], with the fitting thanksgivings[b], there also they resolved to keep these days as joyful ones for the whole time of their sojourning.
translation:
  language: de
  text: Nachdem sie aber in Frieden hinabgeführt worden waren, unter gebührenden Danksagungen[a], beschlossen sie auch dort, diese Tage für die Dauer ihres Aufenthalts als Fremde[b] als Freudentage zu begehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Bekenntnisse“ oder „Lobpreisungen“ bedeuten; der festliche Zusammenhang spricht hier für Danksagungen.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das Leben als Fremde oder zeitweilig Ansässige; ein förmliches Exil ist damit nicht notwendig bezeichnet.
    reason: cultural_note
lexical_decisions:
- source_word: καταχθέντες
  choice: zurückgebracht worden waren
  rationale: Das Aoristpassiv von κατάγω bezeichnet ein Hinab- oder Zurückbringen. Der Zusammenhang legt die Rückkehr an ihren Wohnort nahe; „zurückgebracht“ gibt dies natürlich wieder, ohne ein ausdrückliches Ziel hinzuzufügen.
- source_word: μετʼ εἰρήνης
  choice: in Frieden
  rationale: Die Wendung beschreibt die sichere und friedliche Art beziehungsweise den Zustand ihrer Rückkehr.
- source_word: ἐν ταῖς πρεπούσαις ἐξομολογήσεσιν
  choice: brachten sie den gebührenden Dank dar
  rationale: ἐξομολόγησις kann Bekenntnis, Lobpreis oder Danksagung bedeuten. Im festlichen Zusammenhang ist Dank beziehungsweise Lob am wahrscheinlichsten. Die verbale Formulierung ist im Deutschen natürlicher als „mit den gebührenden Danksagungen“.
- source_word: ἔστησαν
  choice: beschlossen sie
  rationale: Mit dem folgenden Infinitiv bezeichnet ἔστησαν hier ein Festlegen oder Beschließen, nicht bloß ein körperliches Stehen.
- source_word: ἄγειν τὰς ἡμέρας
  choice: diese Tage … zu begehen
  rationale: ἄγειν kann in Verbindung mit Festtagen deren Begehen oder Feiern bezeichnen. „begehen“ ist idiomatisch, würdig und bewahrt die institutionelle Nuance.
- source_word: ἐπὶ τὸν τῆς παροικίας αὐτῶν χρόνον
  choice: während der ganzen Zeit ihres Aufenthalts in der Fremde
  rationale: παροικία bezeichnet den Aufenthalt als Fremde beziehungsweise nicht dauerhaft Ansässige. „Aufenthalt in der Fremde“ bewahrt diese soziale Nuance, ohne förmliches Exil zu behaupten. „ganzen“ macht die zeitliche Erstreckung der Wendung im Deutschen deutlich.
- source_word: εὐφροσύνους
  choice: als Freudentage
  rationale: Das Adjektiv charakterisiert die Tage prädikativ als freudige Tage. Das Kompositum „Freudentage“ ist natürlich und prägnant.
