    rationale: Die griechische Präpositionalgruppe beschreibt den Umstand des Hinabgeführtwerdens. Eine präpositionale deutsche Wiedergabe vermeidet es, eine zusätzliche aktive Handlung und deren Handelnde einzuführen.
  - severity: low
    issue: „Aufenthalt in der Fremde“ ist räumlich stärker als παροικία.
    rationale: παροικία bezeichnet den Status bzw. die Lebensform als ansässige Fremde/Beisassen. „Aufenthalt als Fremde“ erhält diese Nuance ohne eine bestimmte geographische Fremde vorauszusetzen.
