translation:
  language: de
  text: Alle kehrten zurück, ein jeder an seinen früheren Ort[a], nachdem sie unter ihren Feinden mit Ehre und Furcht Macht erlangt hatten und ohne dass irgendeiner ihrer Besitztümer auch nur im Geringsten beeinträchtigt worden wäre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Ausdruck ist verkürzt und schwierig. Möglich ist auch: „zu dem, was ihnen früher gehörte“, oder: „in ihre frühere Stellung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „gänzlich/überhaupt nicht erschüttert hinsichtlich ihrer Besitztümer“. Der griechische Satz ist gedrängt; gemeint ist wahrscheinlich, dass nichts von ihrem Eigentum beschädigt oder beeinträchtigt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: jeder
  rationale: Bewahrt den distributiven Sinn des griechischen Singulars knapp und natürlich.
- source_word: εἰς τὴν ἔμπροσθεν
  choice: an seinen früheren Ort
  rationale: Die elliptische Wendung bezeichnet wahrscheinlich den früheren Ort oder Zustand; die räumliche Wiedergabe passt zum Kontext der Rückkehr, ohne die Schwierigkeit zu verschweigen.
- source_word: ἐν τοῖς ἐχθροῖς
  choice: unter ihren Feinden
  rationale: Gibt ἐν mit Dativ relational wieder und lässt gegenüber der möglichen Deutung „über ihre Feinde“ die griechische Offenheit bestehen.
- source_word: ἐξουσίαν ἐσχηκότες
  choice: Macht erlangt hatten
  rationale: Das Perfektpartizip bezeichnet eine erreichte und nun bestehende Stellung; „Macht“ ist hier verständlich und entspricht ἐξουσία.
- source_word: μετὰ δόξης καὶ φόβου
  choice: mit Ehre und Furcht
  rationale: „Ehre“ gibt δόξα im sozialen Zusammenhang natürlich wieder; „Furcht“ wahrt die Mehrdeutigkeit, ob sie anderen eingeflößt wurde oder den Status begleitete.
- source_word: τὸ σύνολον ... τῶν ὑπαρχόντων
  choice: ihren gesamten Besitz
  rationale: Die auseinandergezogene griechische Konstruktion bezeichnet die Gesamtheit dessen, was ihnen gehörte; die deutsche Wortstellung macht dies idiomatisch verständlich.
- source_word: ὑπὸ μηδενὸς διασεισθέντες
  choice: ohne dass irgendjemand ... angetastet hatte
  rationale: διασείω bedeutet wörtlich „erschüttern/beunruhigen“, bezeichnet bei Besitz im Kontext aber wahrscheinlich Schädigung oder Beeinträchtigung; „antasten“ bewahrt ein konkretes Bild und ist natürlich.
