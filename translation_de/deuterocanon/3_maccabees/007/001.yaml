base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/001.yaml
  text: 'King Ptolemy Philopator to the generals in Egypt and to all who are appointed over affairs: greetings and good health[a][b].'
translation:
  language: de
  text: König Ptolemäus Philopator entbietet den Heerführern in Ägypten[a] und allen, die mit der Leitung von Amtsgeschäften betraut sind, seinen Gruß und wünscht ihnen Wohlergehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Heerführern in ganz Ägypten“. Die griechische Wendung κατʼ Αἴγυπτον kann eine Verteilung über das Land ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sich freuen und stark/wohlauf sein“. Es handelt sich um eine übliche griechische Briefformel, die einen Gruß mit einem Wunsch nach Wohlergehen verbindet.'
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεὺς
  choice: König
  rationale: Das artikellose Substantiv dient in der Briefüberschrift als Herrschertitel; „König“ ist im Deutschen die natürliche Wiedergabe.
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: Ptolemäus Philopator
  rationale: Name und Beiname werden in ihrer geläufigen deutschen Form wiedergegeben, nicht übersetzt.
- source_word: τοῖς κατʼ Αἴγυπτον στρατηγοῖς
  choice: den Heerführern in Ägypten
  rationale: στρατηγοί bezeichnet militärische beziehungsweise militärisch-administrative Befehlshaber. „Heerführer“ wahrt den Titel, während „in Ägypten“ die Ortsangabe natürlich ausdrückt; die mögliche distributive Nuance wird in Fußnote [a] festgehalten.
- source_word: πᾶσιν τοῖς τεταγμένοις ἐπὶ πραγμάτων
  choice: allen, die mit der Leitung von Amtsgeschäften betraut sind
  rationale: τεταγμένοις bezeichnet Beauftragte oder Eingesetzte; ἐπὶ πραγμάτων weist auf die Zuständigkeit für amtliche Angelegenheiten. Die Formulierung ist verständlich und bewahrt den administrativen Sinn.
- source_word: χαίρειν
  choice: entbietet … seinen Gruß
  rationale: χαίρειν ist hier die übliche griechische Briefformel. Die deutsche Wendung gibt ihre kommunikative Funktion idiomatisch wieder, statt sie wörtlich mit „sich freuen“ zu übersetzen.
- source_word: ἐρρῶσθαι
  choice: wünscht ihnen Wohlergehen
  rationale: Der Infinitiv bezeichnet in der Briefformel den Wunsch, gesund beziehungsweise wohlauf zu sein. „Wohlergehen“ lässt den Umfang zwischen Gesundheit und allgemeinem Wohlbefinden offen.
theological_decisions: []
