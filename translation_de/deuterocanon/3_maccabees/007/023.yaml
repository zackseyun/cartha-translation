lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Gepriesen sei
  rationale: Die doxologische Formel wird im Deutschen natürlich und würdig als Lobpreis wiedergegeben; die elliptische griechische Nominalkonstruktion erhält dabei eine idiomatische Verbform.
- source_word: ὁ ῥύστης
  choice: der Retter
  rationale: ῥύστης bezeichnet den, der aus Gefahr oder Bedrängnis rettet bzw. befreit. „Retter“ ist hier prägnant, geläufig und lässt den konkreten Charakter der Rettung offen.
- source_word: Ἰσραήλ
  choice: Israels
  rationale: Der griechische Genitiv wird als deutscher Genitiv wiedergegeben und bezeichnet Israel als das Volk, dem die Rettung gilt.
- source_word: εἰς τοὺς ἀεὶ χρόνους
  choice: in alle Ewigkeit
  rationale: Die feste doxologische Zeitformel meint unbegrenzte Dauer. „In alle Ewigkeit“ bewahrt den feierlichen Registerton und gibt die Aussage idiomatisch wieder.
- source_word: ἀμήν
  choice: Amen
  rationale: Die eingebürgerte liturgische Transliteration wird beibehalten.
theological_decisions:
- issue: Identität des Retters
  choice: Keine ausdrückliche Ergänzung von „Gott“ oder „Herr“
  alternative: „Gepriesen sei Gott, der Retter Israels“
  rationale: Der griechische Text nennt nur „den Retter Israels“. Obwohl der Kontext einen göttlichen Bezug nahelegen kann, wird die nicht ausdrücklich genannte Identität nicht in den Haupttext eingefügt.
- issue: Zeitliche Reichweite der Doxologie
  choice: „in alle Ewigkeit“
  alternative: „für alle Zeiten“
  rationale: Die gewählte Fassung drückt die unbegrenzte Dauer aus, ohne sie abzuschwächen, und entspricht dem feierlich-liturgischen Charakter des Schlusswortes.
translation_notes:
  register: Kurze, feierliche Schlussdoxologie in modernem Standarddeutsch. Die Formulierung ist allgemein verständlich, wahrt jedoch den liturgischen Klang des griechischen Textes.
