base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/005.yaml
  text: You shattered Sennacherib[a], the mighty king of the Assyrians, who had become arrogant because of his innumerable forces, who had already brought the whole land under his hand by the spear, and who had exalted himself against your holy city, speaking grievous things with boasting and insolence—you, Master[c][b], making your power plain to many nations.
translation:
  language: de
  text: Du hast Sanherib, den gewaltigen[a] König der Assyrer, zerschmettert. Wegen seiner unzähligen Streitkräfte war er überheblich geworden; mit dem Speer hatte er bereits das ganze Land unter seine Hand gebracht[b], und gegen deine heilige Stadt hatte er sich hochmütig erhoben und anmaßende Worte in Prahlerei und Frechheit geredet. Du, Gebieter[c], hast so deine Macht vielen Völkern deutlich vor Augen geführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier auch „furchtbaren“, „bedrückenden“ oder „harten“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „hatte mit dem Speer bereits das ganze Land unter seine Hand genommen“; gemeint ist: militärisch unterworfen.'
    reason: lexical_alternative
  - marker: c
    text: Hier steht im Griechischen „Gebieter“ (despotēs), nicht der sonst häufigere Titel „Herr“ (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναριθμήτοις δυνάμεσιν
  choice: unzähligen Streitkräfte
  rationale: Im militärischen Zusammenhang bezeichnet δυνάμεις die Truppen beziehungsweise Streitkräfte; ἀναρίθμητος hebt ihre nicht zu zählende Menge hervor.
- source_word: γαυρωθέντα
  choice: war er überheblich geworden
  rationale: Das Partizip bezeichnet stolze Selbstüberhebung; die Formulierung gibt zugleich den vorausgehenden Zustand wieder.
- source_word: βαρὺν
  choice: gewaltigen
  rationale: Bei einem feindlichen König kann βαρύς seine furchteinflößende, drückende Macht bezeichnen. „Gewaltig“ bewahrt diese Spannweite, ohne ausschließlich körperliche Schwere oder politische Unterdrückung festzulegen.
- source_word: δόρατι τὴν πᾶσαν ὑποχείριον ἤδη λαβόντα γῆν
  choice: mit dem Speer hatte er bereits das ganze Land unter seine Hand gebracht
  rationale: Die konkrete Speermetaphorik und das anschauliche Idiom „unter die Hand bringen“ werden bewahrt; gemeint ist militärische Unterwerfung.
- source_word: μετεωρισθέντα ἐπὶ τὴν ἁγίαν σου πόλιν
  choice: gegen deine heilige Stadt hatte er sich hochmütig erhoben
  rationale: μετεωρίζω verbindet das Sich-Erheben mit Überheblichkeit; ἐπί gibt hier die feindliche Ausrichtung gegen die Stadt an.
- source_word: βαρέα λαλοῦντα
  choice: vermessene Worte geredet
  rationale: Wörtliches „Schweres reden“ wäre im heutigen Deutsch unklar. Im Zusammenhang bezeichnet die Wendung anmaßende, überhebliche Rede, ohne ihren Inhalt näher zu bestimmen.
- source_word: κόμπῳ καὶ θράσει
  choice: voll Prahlerei und Frechheit
  rationale: Die beiden Substantive kennzeichnen die Rede als prahlerisch und dreist; die deutsche Paarung ist kräftig und allgemein verständlich.
- source_word: ἔθραυσας
  choice: zerschmettert
  rationale: Das starke Verb bezeichnet eine entschiedene, vernichtende Niederwerfung.
- source_word: ἔκδηλον δεικνὺς τὸ σὸν κράτος
  choice: hast so deine Macht ... deutlich vor Augen geführt
  rationale: Die Formulierung gibt das begleitende beziehungsweise folgernde Partizip idiomatisch wieder und betont die öffentlich erkennbare Machterweisung.
- source_word: δέσποτα
  choice: Gebieter
  rationale: „Gebieter“ wahrt die Unterscheidung von δέσποτης gegenüber dem üblicherweise mit „Herr“ wiedergegebenen κύριος und passt zum würdigen Gebetsregister.
theological_decisions:
- issue: Göttlicher Titel δέσποτα
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: Der besondere Titel wird nicht mit κύριος eingeebnet. „Gebieter“ drückt Verfügungsgewalt aus, ohne eine zusätzliche Lehrbestimmung einzutragen.
- issue: Historische Anspielung auf Sanheribs Angriff
  choice: Die Anspielung wird ohne narrative Ergänzungen übersetzt.
  alternative: Ausdrückliche Ergänzung der Rettung Jerusalems oder weiterer Einzelheiten aus Könige/Jesaja
  rationale: Der griechische Vers setzt die Begebenheit voraus, nennt hier aber nur Sanheribs Überhebung, seine Niederwerfung und die öffentliche Offenbarung göttlicher Macht.
- issue: Bezug des Schluss-Partizips ἔκδηλον δεικνύς
  choice: 'Als Folge beziehungsweise Begleitumstand des Zerschmetterns wiedergegeben: „hast so ... vor Augen geführt“'
  alternative: 'Streng formal als deutsches Partizip: „wobei du ... zeigtest“'
  rationale: Die syntaktische Bindung an Gottes Handeln bleibt erhalten, während die deutsche Formulierung natürlich bleibt und weder einen ausschließlichen Zweck- noch einen reinen Kausalbezug behauptet.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die lange griechische Periode wurde zur besseren Verständlichkeit in mehrere Sätze gegliedert; die emphatische Wiederaufnahme von σύ vor δέσποτα bleibt durch „Du, Gebieter“ erhalten. Militärische Bilder und die Spannung zwischen Sanheribs scheinbarer Macht und Gottes öffentlich erwiesener Macht wurden bewahrt.
