translation:
  language: de
  text: Da offenbarte der überaus herrliche, allmächtige und wahre Gott sein heiliges Angesicht[a] und öffnete die himmlischen Tore. Aus ihnen stiegen zwei verherrlichte Engel von furchterregender Gestalt herab, sichtbar für alle außer den Juden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine heilige Gegenwart«; wörtlich: »sein heiliges Gesicht«.'
    reason: Die konkrete Bedeutung von πρόσωπον lautet „Gesicht/Angesicht“, doch kann das Wort in diesem Zusammenhang auch die Gegenwart bezeichnen.
lexical_decisions:
- source_word: μεγαλοδόξος
  choice: überaus herrlich
  rationale: Das zusammengesetzte Adjektiv verstärkt Gottes Herrlichkeit; „überaus herrlich“ gibt diese Steigerung natürlich und würdevoll wieder.
- source_word: παντοκράτωρ
  choice: allmächtig
  rationale: „Allmächtig“ ist im Deutschen die etablierte und sachlich passende Wiedergabe des auf Gott bezogenen Titels.
- source_word: ἀληθινὸς θεός
  choice: wahrer Gott
  rationale: Die geläufige Formulierung bewahrt die kontrastive theologische Aussage von ἀληθινός.
- source_word: ἐπιφάνας τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: offenbarte ... sein heiliges Angesicht
  rationale: Das Partizip bezeichnet ein Sichtbarwerden beziehungsweise Offenbaren. „Angesicht“ erhält das konkrete Bild von πρόσωπον und passt zum würdevollen Register.
- source_word: τὰς οὐρανίους πύλας
  choice: die himmlischen Tore
  rationale: Die attributive Form des griechischen Ausdrucks wird eng und zugleich idiomatisch wiedergegeben.
- source_word: δεδοξασμένοι
  choice: verherrlichte
  rationale: Das Perfektpartizip bezeichnet die Engel als mit Herrlichkeit ausgestattet; „verherrlichte“ wahrt diese grammatische und inhaltliche Nuance genauer als nur „herrliche“.
- source_word: φοβεροειδεῖς
  choice: von furchterregender Gestalt
  rationale: Der Ausdruck beschreibt eine Erscheinung, die Furcht hervorruft; die gewählte Fassung ist klar und würdevoll.
- source_word: φανεροὶ πᾶσιν πλὴν τοῖς Ἰουδαίοις
  choice: sichtbar für alle außer den Juden
  rationale: Der Zusammenhang betrifft die Wahrnehmbarkeit der Engel. Die ausdrückliche Ausnahme der Juden bleibt ohne erklärenden Zusatz erhalten.
theological_decisions:
- issue: Anthropomorphe Rede in τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: sein heiliges Angesicht
  alternative: seine heilige Gegenwart
  rationale: Die konkrete Bildsprache des griechischen Textes wird nicht zu einer abstrakten Aussage über Gottes Gegenwart abgeschwächt; eine mögliche übertragene Bedeutung wird in der Fußnote genannt.
- issue: Sichtbarkeit der Engel mit ausdrücklicher Ausnahme der Juden
  choice: sichtbar für alle außer den Juden
  alternative: allen offenbar außer den Juden
  rationale: Die auffällige narrative Aussage des Ausgangstextes wird bewahrt und weder erklärt noch theologisch harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Angesicht“ erhält die feierliche konkrete Bildsprache, ohne insgesamt einen altertümlichen Satzbau zu verwenden. Der lange griechische Satz ist zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert.
