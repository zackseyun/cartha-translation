  text: Release[a], release the unjust bonds; send them away to their own homes in peace[b], setting aside what has been ordered.
translation:
  language: de
  text: Löst, ja löst die ungerechten Fesseln! Schickt sie in Frieden nach Hause[a] und hebt die ergangenen Anordnungen auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »zu dem, was ihnen gehört« oder »an ihre eigenen Orte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und gebt das Angeordnete auf«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λύσατε, ἐκλύσατε
  choice: Löst, ja löst
  rationale: Die beiden pluralischen Imperative bilden eine nachdrückliche Wiederholung; „ja“ macht die Verstärkung im natürlichen Deutschen hörbar, ohne einen zusätzlichen Sachinhalt einzuführen.
- source_word: ἄδικα δεσμά
  choice: die ungerechten Fesseln
  rationale: δεσμά bezeichnet bindende Vorrichtungen oder Fesseln; ἄδικα bewertet sie als unrecht bzw. ungerecht. „Fesseln“ wahrt sowohl den konkreten als auch einen möglichen übertragenen Sinn.
- source_word: εἰς τὰ ἴδια
  choice: nach Hause
  rationale: Die substantivierte Wendung bezeichnet das Eigene, insbesondere den eigenen Ort oder Hausstand. „Nach Hause“ ist hier bei freizulassenden Personen die natürliche deutsche Wiedergabe, ohne die breitere Bedeutung zu verschweigen.
- source_word: μετʼ εἰρήνης
  choice: in Frieden
  rationale: Die geläufige deutsche Wendung entspricht der griechischen Präpositionalphrase und kann sowohl friedliches Geleit als auch unversehrte Rückkehr ausdrücken.
- source_word: ἐξαποστείλατε
  choice: Schickt sie
  rationale: Der Imperativ bedeutet „fortsenden/wegschicken“. Das im Griechischen aus dem Kontext erschlossene Objekt wird im Deutschen durch „sie“ ausdrücklich gemacht.
- source_word: τὰ προστεταγμένα
  choice: die ergangenen Anordnungen
  rationale: Das substantivierte Perfektpassiv bezeichnet das zuvor Angeordnete. „Ergangen“ bewahrt den Vorzeitigkeitssinn, ohne den Urheber näher festzulegen.
- source_word: παραιτησάμενοι
  choice: hebt … auf
  rationale: Das aoristische mediale Partizip bezeichnet hier das Aufgeben oder Außerkraftsetzen der zuvor erlassenen Anordnungen. Die koordinierte deutsche Formulierung ist idiomatisch und erhält den Handlungsauftrag.
