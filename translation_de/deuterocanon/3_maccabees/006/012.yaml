base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/012.yaml
  text: But you[a], who possess all might and dominion, unceasing One, eternal One, look now; have mercy on us[c][b], who through the insolent violence of lawless men are being irrationally removed from life in the manner of plotters.
translation:
  language: de
  text: Du aber, der du alle Stärke und Herrschaft besitzt, du Unermüdlicher[a], du Ewiger, sieh jetzt auf uns! Erbarme dich über uns, die wir durch die überhebliche Gewalt gesetzloser Menschen auf sinnlose Weise aus dem Leben gerissen werden[b], nach Art von Verschwörern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du Unablässiger“; ἀπάναυε kann das unablässige oder unermüdliche Wesen Gottes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „aus dem Leben entfernt werden“; im Zusammenhang ist damit die Tötung gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „wie Verschwörer“. Der griechische Ausdruck lässt offen, ob damit die Art des Vorgehens oder die den Opfern zugeschriebene Rolle gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλκήν
  choice: Stärke
  rationale: Bezeichnet Kraft oder Wehrhaftigkeit; „Stärke“ wahrt neben „Herrschaft“ die Unterscheidung zur folgenden δυναστεία.
- source_word: δυναστείαν
  choice: Herrschaft
  rationale: Meint Macht im Sinn von Herrschaftsgewalt und nicht nur körperliche oder allgemeine Kraft.
- source_word: ἀπάναυε
  choice: du Unablässiger
  rationale: Die vokativische Form wird als göttlicher Ehrenname wiedergegeben; „unablässig“ bewahrt den Gedanken des Nichtaufhörens, ohne ihn adverbial an „sieh“ zu binden.
- source_word: αἰώνιε
  choice: du Ewiger
  rationale: Der zweite Vokativ wird parallel als direkte Anrede formuliert. Das wiederholte „du“ macht die griechische Anreihung im Deutschen verständlich.
- source_word: ἐπίδε
  choice: sieh jetzt her
  rationale: Der Imperativ ist ein dringender Ruf, hinzusehen und einzugreifen; „sieh jetzt her“ klingt natürlich und bewahrt die zeitliche Dringlichkeit.
- source_word: καθʼ ὕβριν
  choice: durch die frevelhafte Gewalt
  rationale: ὕβρις umfasst übermütige, entehrende und gewaltsame Misshandlung. „Frevelhafte Gewalt“ gibt die moralische wie die tätliche Dimension wieder.
- source_word: ἀνόμων
  choice: gesetzloser Menschen
  rationale: Der substantivierte Genitiv bezeichnet die Urheber der Misshandlung. „Menschen“ vermeidet eine unnötige geschlechtliche Festlegung, die die griechische Form im Kontext nicht erzwingt.
- source_word: ἀλόγιστον
  choice: auf sinnlose Weise
  rationale: Das adverbial gebrauchte Wort kennzeichnet das Vorgehen als vernunftwidrig und unsinnig; die Wendung ist im Deutschen idiomatischer als „irrational“.
- source_word: ἐκ τοῦ ζῆν μεθισταμένους
  choice: aus dem Leben gerissen werden
  rationale: Die griechische Wendung spricht bildhaft von einem Entferntwerden aus dem Leben und meint im Kontext die drohende Tötung. Die deutsche Form bewahrt das Bild in natürlicher Sprache.
- source_word: ἐν ἐπιβούλων τρόπῳ
  choice: nach Art von Verschwörern
  rationale: 'Die Wendung bleibt bewusst mehrdeutig: Sie kann die Weise der Behandlung oder deren Vorwand bezeichnen. „Nach Art von“ fügt kein ausdrückliches „als ob“ hinzu.'
theological_decisions:
- issue: Wiedergabe der göttlichen Vokative ἀπάναυε und αἰώνιε
  choice: 'Beide werden als eigenständige direkte Anreden wiedergegeben: „du Unablässiger, du Ewiger“.'
  alternative: ἀπάναυε adverbial mit dem Imperativ verbinden („sieh unablässig her“) oder beide freier als Eigenschaften Gottes formulieren.
  rationale: Die aufeinanderfolgenden vokativischen Formen sprechen dafür, beide als feierliche Gottesbezeichnungen zu bewahren. „Gott“ wird nicht ergänzt, da es hier nicht ausdrücklich steht.
- issue: Bedeutung von ἐκ τοῦ ζῆν μεθισταμένους
  choice: Die Wendung bezeichnet das gewaltsame Entferntwerden aus dem Leben, also die drohende Tötung.
  alternative: Allgemeine Vertreibung aus der bisherigen Lebensweise oder bloße Entfernung aus der Gemeinschaft der Lebenden.
  rationale: Der Hinrichtungskontext legt den Todessinn nahe; dennoch bleibt das Quellbild erhalten, statt schlicht „getötet werden“ zu setzen.
- issue: Bezug von ἐν ἐπιβούλων τρόπῳ
  choice: „nach Art von Verschwörern“ bewahrt die offene Beziehung der Wendung zum Vorgehen beziehungsweise zur zugeschriebenen Rolle.
  alternative: Explizit „als wären wir Verschwörer“ oder „auf hinterhältige Weise“.
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, ob die Opfer als Verschwörer behandelt werden oder ob das Vorgehen selbst verschwörerisch ist; die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Feierliche, dringliche Gebetssprache in modernem Standarddeutsch. Die doppelten Vokative werden hörbar bewahrt, während schwerfällige griechische Konstruktionen idiomatisch formuliert werden. Die Mehrdeutigkeit der Schlusswendung bleibt erhalten.
