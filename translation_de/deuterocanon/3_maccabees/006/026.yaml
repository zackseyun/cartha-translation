  yaml_path: translation/deuterocanon/3_maccabees/006/026.yaml
  text: Who has so lawlessly surrounded with cruelties those who from the beginning have surpassed all nations in goodwill toward us in every respect, and who have repeatedly shown themselves to face the worst dangers among men?
translation:
  language: de
  text: Wer hat die Menschen, die sich von Anfang an durch ihr Wohlwollen uns gegenüber in jeder Hinsicht vor allen Völkern ausgezeichnet haben[a] und sich wiederholt in den schlimmsten Gefahren unter Menschen bewährt haben[b], auf so gesetzlose Weise mit Misshandlungen überzogen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich von Anfang an durch ihr Wohlwollen uns gegenüber in jeder Hinsicht von allen Völkern unterschieden haben“. Das griechische Verb kann sowohl „sich unterscheiden“ als auch „sich auszeichnen, übertreffen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung ist schwer verständlich; gemeint sein können die schwersten Gefahren im menschlichen Leben oder Gefahren, wie Menschen sie erleiden.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Wer hat
  rationale: Das Interrogativpronomen leitet eine rhetorische Frage ein; „Wer hat“ gibt deren Kraft natürlich wieder.
- source_word: τοὺς ἐξ ἀρχῆς
  choice: die Menschen, die sich von Anfang an
  rationale: Der substantivierte Ausdruck bezeichnet eine Gruppe und betont ihr Verhalten seit Beginn.
- source_word: εὐνοίᾳ πρὸς ἡμᾶς
  choice: durch ihr Wohlwollen uns gegenüber
  rationale: εὔνοια bezeichnet Wohlwollen oder freundliche Gesinnung; „uns gegenüber“ gibt πρὸς ἡμᾶς idiomatisch wieder.
- source_word: κατὰ πάντα διαφέροντας πάντων ἐθνῶν
  choice: sich in jeder Hinsicht vor allen Völkern ausgezeichnet haben
  rationale: διαφέρω hat hier wahrscheinlich den vergleichenden Sinn „sich auszeichnen/übertreffen“; die Formulierung wahrt zugleich die mögliche Nuance des Andersseins.
- source_word: τοὺς ... ἐπιδειγμένους
  choice: sich ... bewährt haben
  rationale: Das mediale Partizip bezeichnet, dass sie sich durch ihr Verhalten erwiesen oder gezeigt haben; „sich bewährt“ ist im Zusammenhang mit Gefahren natürlich.
- source_word: πλεονάκις
  choice: wiederholt
  rationale: Das Adverb bezeichnet mehrfaches Geschehen.
- source_word: χειρίστους ... κινδύνους
  choice: den schlimmsten Gefahren
  rationale: χειρίστους ist der Superlativ und bezeichnet äußerst schwere oder schlimme Gefahren.
- source_word: ἀνθρώπων
  choice: unter Menschen
  rationale: Der Genitiv ist syntaktisch und idiomatisch schwierig; die knappe Wiedergabe bewahrt diese Offenheit weitgehend.
- source_word: οὕτως ἀθέσμως
  choice: auf so gesetzlose Weise
  rationale: ἀθέσμως bezeichnet ein Handeln gegen Gesetz, Ordnung oder Recht; die Wendung erhält die moralisch-rechtliche Schärfe.
- source_word: περιέβαλεν αἰκίαις
  choice: mit Misshandlungen überzogen
  rationale: Die Verbindung zeichnet bildhaft ein Umgeben oder Überhäufen mit Misshandlungen und entehrender Gewalt; „überzogen“ bewahrt das Bild in natürlichem Deutsch.
