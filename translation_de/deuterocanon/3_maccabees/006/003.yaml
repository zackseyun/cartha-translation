review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die drei akkusativischen Objekte des Gebetsappells angemessen wieder: Abrahams Nachkommen, Jakobs Kinder und Gottes Volk. „Kinder des geheiligten Jakob“ wahrt die im Griechischen bevorzugte, aber gedrängte Zuordnung von ἡγιασμένου zu Jakob; die plausible alternative Zuordnung ist korrekt vermerkt. „Dein Volk, deinen geheiligten Anteil“ gibt die dichte Genitivkonstruktion mit μερίδος ἡγιασμένης σου als appositionelles Gottesanteil-Bild verständlich wieder. „Als Fremde zu Unrecht zugrunde gerichtet wird“ bewahrt sowohl ξένως/ἀδίκως als auch den präsentischen, passivisch/mittleren Charakter von ἀπολλύμενον.'
  naturalness: Das Deutsch ist modernes, würdiges Gebetsdeutsch. Die Wiederholung von „auf“ schafft eine klare Anrufungsstruktur, ohne den Satz unnötig schwerfällig zu machen. „Zugrunde gerichtet wird“ ist idiomatisch und lässt die im Kontext mögliche äußere Vernichtung anklingen, ohne mehr als der griechische Mittel-/Passivbefund festzulegen.
  terminology: „Nachkommen“, „Kinder“, „geheiligt“, „Volk“, „Anteil“, „fremdes Land“ und „als Fremde“ sind treffende, registergerechte Entscheidungen. Die Wiederholung von „geheiligt“ bildet die wiederholte ἁγιάζω-Wortgruppe des griechischen Textes angemessen ab. Die Fußnote dokumentiert die syntaktische Mehrdeutigkeit ohne konfessionelle Festlegung.
