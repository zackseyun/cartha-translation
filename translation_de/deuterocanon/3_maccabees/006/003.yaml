base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/003.yaml
  text: Look upon the offspring of Abraham[a], the children of Jacob who has been sanctified, your sanctified allotted people, perishing unjustly as strangers in a foreign land.
translation:
  language: de
  text: Sieh auf Abrahams Nachkommen, auf die Kinder des geheiligten Jakob[a], auf dein Volk, deinen geheiligten Anteil, das in einem fremden Land als Fremde zu Unrecht zugrunde gerichtet wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die geheiligten Kinder Jakobs“. Die griechische Wendung ist stark zusammengedrängt; „geheiligt“ kann statt auf Jakob sinngemäß auch auf die Kinder bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπιδε
  choice: Sieh auf
  rationale: Der Imperativ ist im Gebetszusammenhang ein eindringlicher Appell an Gott, die Bedrängten wahrzunehmen; „Sieh auf“ bewahrt den gehobenen, bittenden Ton.
- source_word: σπέρμα
  choice: Nachkommen
  rationale: Gibt den kollektiven Sinn natürlich und ohne das im Deutschen missverständliche wörtliche „Same“ wieder.
- source_word: ἡγιασμένου
  choice: des geheiligten
  rationale: Bewahrt den perfektiv-passiven Gedanken eines vollzogenen Geheiligtwerdens und bezieht das maskuline Genitivattribut in der Hauptlesart auf Jakob.
- source_word: τέκνα Ἰακώβ
  choice: die Kinder des … Jakob
  rationale: „Kinder“ bildet τέκνα geschlechtsübergreifend ab; die Genitivverbindung bleibt eng am Griechischen.
- source_word: μερίδος ἡγιασμένης σου λαὸν
  choice: dein Volk, deinen geheiligten Anteil
  rationale: 'Die appositionelle Struktur wird sichtbar erhalten: Das Volk ist Gottes geheiligter Anteil. Dies ist semantisch klarer als ein attributives „zugeteiltes Volk“.'
- source_word: ἐν ξένῃ γῇ
  choice: in einem fremden Land
  rationale: Natürliche moderne Wiedergabe des Aufenthalts außerhalb der eigenen Heimat.
- source_word: ξένως
  choice: als Fremde
  rationale: Drückt in diesem Zusammenhang ihren entfremdeten Status aus und nimmt die Wortfigur mit ξένῃ in verständlichem Deutsch auf.
- source_word: ἀδίκως
  choice: zu Unrecht
  rationale: Kennzeichnet knapp und idiomatisch das ihnen widerfahrende Unrecht.
- source_word: ἀπολλύμενον
  choice: zugrunde gerichtet wird
  rationale: Die passive Form macht die fortdauernde Vernichtung durch fremde Einwirkung deutlich, ohne das Geschehen als bereits abgeschlossen darzustellen.
theological_decisions:
- issue: Bezug von ἡγιασμένου in der gedrängten Wendung ἐφ’ ἡγιασμένου τέκνα Ἰακώβ
  choice: „die Kinder des geheiligten Jakob“; das Partizip wird auf Jakob bezogen.
  alternative: „die geheiligten Kinder Jakobs“; das Partizip wird sinngemäß auf die Kinder bezogen.
  rationale: Genus und Kasus sowie die gedrängte Wortstellung stützen den Bezug auf Jakob, doch die Syntax ist ungewöhnlich und lässt die alternative Gruppierung zu. Diese echte Mehrdeutigkeit wird in der Fußnote offengelegt.
- issue: Verhältnis von μερίδος ἡγιασμένης σου zu λαόν
  choice: 'Appositionell: „dein Volk, deinen geheiligten Anteil“.'
  alternative: 'Attributiv bzw. umschreibend: „dein geheiligtes, dir als Anteil zugeteiltes Volk“.'
  rationale: μερίδος steht als Genitiv in einer syntaktisch gedrängten Reihe, während λαόν das direkte Bezugswort des Gebetsappells bildet. Die appositionelle Wiedergabe erhält das Bild des Volkes als Gottes Anteil, ohne die Kasusspannung künstlich zu glätten.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die dreifache Anrufungsstruktur wird durch wiederholtes „auf“ verdeutlicht. Die Wortfigur ξένῃ/ξένως bleibt als „fremden Land/als Fremde“ hörbar; die syntaktischen Mehrdeutigkeiten werden nicht konfessionell aufgelöst.
