  text: And they all feasted[a], being supplied by the king, until the fourteenth day, on which they also made their petition concerning their release.
translation:
  language: de
  text: Sie alle feierten bis zum vierzehnten Tag ein Festmahl, wobei der König für alles aufkam. An diesem Tag brachten sie auch ihre Bitte um ihre Freilassung vor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐωχοῦντο
  choice: hielten Festmahl
  rationale: Das Verb bezeichnet festliches Speisen und Genießen; die Wendung bewahrt den konkreten festlichen Charakter in natürlichem, würdigem Deutsch.
- source_word: πάνθʼ
  choice: sie alle
  rationale: Die Form bezieht sich kollektiv auf die gesamte zuvor genannte Gruppe; „sie alle“ gibt diese umfassende Bedeutung knapp wieder.
- source_word: ὑπὸ τοῦ βασιλέως χορηγούμενοι
  choice: wobei der König für alles aufkam
  rationale: Das Partizip bezeichnet die Versorgung beziehungsweise Finanzierung durch den König. Die Formulierung ist idiomatisch und legt nicht unnötig fest, auf welche Weise die Mittel bereitgestellt wurden.
- source_word: μέχρι τῆς τεσσαρεσκαιδεκάτης
  choice: bis zum vierzehnten Tag
  rationale: Das feminine Zahlwort setzt aus dem Zusammenhang „Tag“ voraus; die Ergänzung macht den Zeitbezug im Deutschen eindeutig.
- source_word: ἐν ᾗ
  choice: An diesem Tag
  rationale: Der Relativausdruck verweist auf den vierzehnten Tag zurück. Ein neuer deutscher Satz mit explizitem Rückverweis ist klar und natürlich.
- source_word: τὴν ἐντυχίαν ἐποιήσαντο
  choice: brachten sie ihre Bitte vor
  rationale: ἐντυχία kann eine förmliche Eingabe, Bitte oder Annäherung an eine höhergestellte Person bezeichnen. „ihre Bitte vorbringen“ wahrt den formellen Vorgang, ohne eine Audienz vorauszusetzen.
- source_word: περὶ τῆς ἀπολύσεως αὐτῶν
  choice: um Freilassung
  rationale: ἀπόλυσις bezeichnet hier die Entlassung beziehungsweise Freilassung der Betroffenen. Im Deutschen verbindet sich „Bitte“ idiomatisch mit „um“, während der Inhalt der griechischen περί-Fügung erhalten bleibt.
