base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/024.yaml
  text: You have exceeded kings and surpassed tyrants in cruelty; and you are now even attempting to remove me myself[a], your benefactor, from power and from life, secretly plotting what is not advantageous to the kingdom.
translation:
  language: de
  text: Ihr habt Könige übertroffen und Tyrannen an Grausamkeit überboten. Nun versucht ihr sogar, mich selbst, euren Wohltäter, um Herrschaft und Leben[a] zu bringen, indem ihr heimlich plant, was dem Königreich nicht nützt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herrschaft und Geist/Atem«. Das griechische Wort πνεῦμα kann »Geist«, »Atem« oder in diesem Zusammenhang auch »Leben« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραβεβασιλεύετε
  choice: Ihr habt Könige übertroffen
  rationale: Die seltene Perfektform bezeichnet hier ein Überschreiten beziehungsweise Übertreffen königlichen Handelns. Die Wiedergabe folgt dem Vergleich mit den unmittelbar danach genannten Tyrannen und bleibt im Deutschen klar.
- source_word: τυράννους ὑπερβεβήκατε ὠμότητι
  choice: Tyrannen an Grausamkeit überboten
  rationale: ὑπερβαίνω mit dem Dativ der Hinsicht drückt ein Übertreffen aus; ὠμότης bezeichnet Grausamkeit oder brutale Härte.
- source_word: ἐμὲ αὐτὸν
  choice: mich selbst
  rationale: Die emphatische Pronomenverbindung hebt die persönliche Empörung des Sprechers hervor.
- source_word: τὸν ὑμῶν εὐεργέτην
  choice: euren Wohltäter
  rationale: εὐεργέτης ist die übliche hellenistische Bezeichnung für einen Wohltäter und kann zugleich persönliche und politische Konnotationen tragen.
- source_word: τῆς ἀρχῆς ... μεθιστᾶν
  choice: um Herrschaft ... zu bringen
  rationale: ἀρχή bezeichnet hier die Herrschaft beziehungsweise Regierungsgewalt. Die deutsche Fügung gibt den beabsichtigten Entzug idiomatisch wieder.
- source_word: τοῦ πνεύματος
  choice: Leben
  rationale: Im Zusammenhang mit der Beseitigung des Herrschers bezeichnet πνεῦμα am ehesten Atem beziehungsweise Lebenskraft und damit das Leben; die wörtlicheren Möglichkeiten werden in der Fußnote bewahrt.
- source_word: λάθρα μηχανώμενοι
  choice: indem ihr heimlich plant
  rationale: Die Verbindung bezeichnet verdecktes, absichtsvolles Planen; die partizipiale Beziehung wird durch einen modalen Nebensatz natürlich wiedergegeben.
- source_word: τὰ μὴ συμφέροντα τῇ βασιλείᾳ
  choice: was dem Königreich nicht nützt
  rationale: συμφέρει bezeichnet das, was vorteilhaft oder nützlich ist. Die Negation wird bewusst nicht zur stärkeren Aussage „was dem Königreich schadet“ verschärft.
theological_decisions:
- issue: Bedeutung von πνεῦμα in der Anklage
  choice: Leben
  alternative: Geist oder Atem
  rationale: Die Verbindung mit dem Verlust der Herrschaft und dem heimlichen Komplott legt einen Anschlag auf das Leben nahe. Da πνεῦμα jedoch wörtlich auch „Geist“ oder „Atem“ bedeuten kann, bleibt diese Mehrdeutigkeit in einer Fußnote sichtbar.
- issue: Bedeutung von βασιλεία
  choice: Königreich
  alternative: Königsherrschaft oder Regierung
  rationale: „Königreich“ bewahrt den politischen Bezug, ohne die Aussage enger auf die Person des Königs oder den Regierungsapparat festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die parallelen Verben „übertroffen“ und „überboten“ erhalten die zugespitzte rhetorische Steigerung des Griechischen. „Um Herrschaft und Leben bringen“ ist idiomatisch und trägt beide Genitivobjekte, ohne die beabsichtigte Entmachtung und Tötung unnötig auszudeuten.
