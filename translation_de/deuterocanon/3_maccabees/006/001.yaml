  source_fidelity: 'Die Zuordnung von ἐπικαλεῖσθαι zu den Ältesten ist im Entwurf nicht tragfähig. Nach καταστείλας τοὺς περὶ αὐτὸν πρεσβυτέρους folgt ἐπικαλεῖσθαι als erzählender Infinitiv, der Eleasars Handeln fortführt: Er beruhigt die Ältesten, ruft den heiligen Gott an und betet. Die Fassung mit „damit sie ... anriefen“ fügt sowohl einen Zweckzusammenhang als auch die Ältesten als Subjekt des Anrufens ein. Die übrigen Angaben werden zutreffend wiedergegeben.'
