  text: 'A certain Eleazar, a distinguished man among the Jews of the country, already advanced in age and adorned with every virtue in life, quieted the elders around him to call upon the holy God, and prayed as follows:'
translation:
  language: de
  text: 'Ein gewisser Eleasar, ein angesehener Mann unter den Juden des Landes, war bereits hochbetagt und mit jeder Tugend im Leben geschmückt. Nachdem er die Ältesten um sich beruhigt hatte, rief er den heiligen Gott an und betete folgendermaßen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνὴρ ἐπίσημος
  choice: ein angesehener Mann
  rationale: Gibt die gesellschaftliche Hervorgehobenheit von ἐπίσημος natürlich und ohne zusätzliche Amtsvorstellung wieder.
- source_word: τῶν ἀπὸ τῆς χώρας Ἰουδαίων
  choice: unter den Juden des Landes
  rationale: Bewahrt die Zugehörigkeitsangabe und lässt die im Griechischen nicht näher bestimmte χώρα bewusst offen.
- source_word: ἐν πρεσβείῳ τὴν ἡλικίαν ἤδη λελογχὼς
  choice: war bereits hochbetagt
  rationale: Natürliche deutsche Wiedergabe der Aussage, dass Eleasar schon ein hohes Lebensalter erreicht hatte.
- source_word: πάσῃ τῇ κατὰ τὸν βίον ἀρετῇ κεκοσμημένος
  choice: mit jeder Tugend der Lebensführung geschmückt
  rationale: Erhält das Schmuckbild von κοσμέω und bezieht κατὰ τὸν βίον auf die praktisch gelebte Tugend.
- source_word: καταστείλας
  choice: brachte ... zur Ruhe
  rationale: Gibt das Beruhigen beziehungsweise Stillwerdenlassen wieder, ohne bloßes Schweigen zu überbetonen.
- source_word: ἐπικαλεῖσθαι
  choice: damit sie ... anriefen
  rationale: Der Infinitiv hängt am Beruhigen der Ältesten und bezeichnet hier ihre beabsichtigte Anrufung Gottes; diese syntaktische Zuordnung wird gegenüber einer Umdeutung zu Eleasars eigener Anrufung bewahrt.
- source_word: προσηύξατο τάδε
  choice: betete Folgendes
  rationale: Klare, idiomatische Einleitung des anschließenden Gebets.
theological_decisions:
- issue: Wer den heiligen Gott anruft
  choice: Die Ältesten werden zur Ruhe gebracht, damit sie den heiligen Gott anrufen; anschließend betet Eleasar.
  alternative: Eleasar bringt die Ältesten zur Ruhe, ruft selbst den heiligen Gott an und betet.
  rationale: Der Infinitiv ἐπικαλεῖσθαι steht syntaktisch am ehesten in Ergänzung zu τοὺς ... πρεσβυτέρους καταστείλας; die deutsche Fassung folgt dieser Konstruktion und der auditierten Konsultationsschicht, ohne die beiden Verben zu einem einzigen Gebetsakt Eleasars zu verschmelzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Periode ist zur besseren Verständlichkeit in zwei Sätze gegliedert; Bildsprache und syntaktische Spannung bleiben soweit möglich erhalten.
