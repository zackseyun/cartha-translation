base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/015.yaml
  text: Let it be shown to all the nations that you are with us[a], Lord, and that you have not turned your face away from us; but just as you said, ‘Not even when they were in the land of their enemies did I disregard them,’ so accomplish it[b], Lord.
translation:
  language: de
  text: 'Möge allen Völkern gezeigt werden, dass du mit uns[a] bist, Herr, und dass du dein Angesicht nicht von uns abgewandt hast; sondern wie du gesagt hast: »Nicht einmal, als sie im Land ihrer Feinde waren, habe ich sie unbeachtet gelassen«, so vollende es[b], Herr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zitierte Aussage greift Bundessprache auf: Gott lässt sein Volk selbst im Land seiner Feinde nicht unbeachtet. Das griechische Verb kann auch »übersehen« oder »vernachlässigen« bedeuten.'
    reason: cross_reference
  - marker: b
    text: 'Oder: »Bringe es zur Vollendung« beziehungsweise »Führe es aus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δειχθήτω
  choice: soll gezeigt werden
  rationale: Der passive Aoristimperativ wird als nachdrückliche Bitte wiedergegeben; die Passivform bleibt erhalten.
- source_word: πᾶσιν ἔθνεσιν
  choice: allen Völkern
  rationale: »Völker« gibt ἔθνη breit und bibelsprachlich angemessen wieder, ohne den engeren Gegensatz »Juden/Heiden« einzutragen.
- source_word: μεθʼ ἡμῶν εἶ
  choice: du mit uns bist
  rationale: Direkte, natürliche Wiedergabe der Aussage über Gottes Gegenwart.
- source_word: οὐκ ἀπέστρεψας τὸ πρόσωπόν σου ἀφʼ ἡμῶν
  choice: dein Angesicht nicht von uns abgewandt hast
  rationale: Die ausdrückliche Angesichtsmetapher und ihr biblischer Nachklang werden bewahrt.
- source_word: ὑπεριδον
  choice: habe ich sie unbeachtet gelassen
  rationale: Die Form des überlieferten Textes wird als erste Person Singular verstanden, passend zur mit εἶπας eingeführten Gottesrede. Die Wendung umfasst hier das Nichtübersehen beziehungsweise Nichtvernachlässigen.
- source_word: ἐπίτελεσον
  choice: vollende es
  rationale: Das Verb fordert dazu auf, das zugesagte Handeln zur Ausführung beziehungsweise Vollendung zu bringen; das pronominale »es« vermeidet einen im Griechischen nicht ausdrücklich genannten Inhalt.
- source_word: καθὼς εἶπας
  choice: so, wie du gesagt hast
  rationale: Bewahrt sowohl den Vergleichsbezug von καθώς als auch die Einführung der anschließenden direkten Rede.
theological_decisions:
- issue: Wiedergabe von κύριε
  choice: Herr
  alternative: Gebieter
  rationale: Im Gebetszusammenhang ist κύριε eine Gottesanrede; »Herr« ist die direkte und vertraute deutsche Entsprechung.
- issue: Gestalt des eingebetteten Gotteswortes
  choice: direkte Rede in der ersten Person
  alternative: indirekte, paraphrasierende Wiedergabe
  rationale: εἶπας führt natürlich ein Zitat ein. Die direkte Rede bewahrt den Appell an Gottes früheres Wort, ohne dessen theologischen Gehalt weiter festzulegen.
- issue: Bezug von οὕτως ἐπίτελεσον
  choice: »vollende es … so, wie du gesagt hast«
  alternative: »erfülle dies«
  rationale: Die gewählte Form lässt den im Griechischen nicht eigens benannten Gegenstand offen und erhält den Zusammenhang zwischen Verheißung und erbetener Ausführung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten biblischen Leitbildern wie »Angesicht« und »Herr«. Der Satzbau wurde gegenüber dem Griechischen leicht geordnet, damit Bitte, Begründung und Zitat klar verständlich bleiben.
