  source_fidelity: 'Der Entwurf gibt die zentralen Elemente zutreffend wieder: die passive Bitte δειχθήτω, »alle Völker«, Gottes Gegenwart, die Angesichtsmetapher, die direkte Gottesrede und die abschließende Bitte. Die Stellung von »so, wie du gesagt hast« vor dem Zitat lässt jedoch die griechische Vergleichsstruktur καθὼς … οὕτως weniger klar erkennen.'
  naturalness: »Möge allen Völkern gezeigt werden« ist als Gebetsbitte idiomatischer als das etwas verwaltungs- oder zukunftssprachliche »soll gezeigt werden«. Die korrelative Satzstellung »wie du gesagt hast …, so vollende es« ist würdig und verständlich.
  terminology: »Herr«, »Angesicht« und »Völker« sind angemessen. Die Anker sollten jeweils unmittelbar bei der erläuterten Formulierung stehen. Die erste Fußnote sollte die Bedeutung von ὑπεριδεῖν nicht durch »verwirft« überstark festlegen.
