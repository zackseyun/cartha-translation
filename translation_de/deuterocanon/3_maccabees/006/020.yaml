  yaml_path: translation/deuterocanon/3_maccabees/006/020.yaml
  text: And even the king’s body became seized with shuddering[b][a], and his heavy-hearted boldness was overcome by forgetfulness.
translation:
  language: de
  text: Auch der Körper des Königs wurde von Schauder erfasst, und Vergessenheit[a] ergriff seinen grimmigen Übermut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verwirrung«. Das griechische Wort bedeutet wörtlich »Vergessenheit«, kann hier aber eine plötzliche geistige Orientierungslosigkeit bezeichnen, die seine Entschlossenheit zunichtemachte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seine finstere Dreistigkeit« beziehungsweise »seine grimmige Anmaßung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόφρικον
  choice: von Schauder erfasst
  rationale: Die Wendung gibt die körperliche Reaktion des Schauderns anschaulich wieder, ohne sie auf bloße Angst zu reduzieren.
- source_word: σῶμα
  choice: Körper
  rationale: Das griechische Wort bezeichnet ausdrücklich den Körper des Königs und hebt so die sichtbare körperliche Reaktion hervor.
- source_word: λήθη
  choice: Vergessenheit
  rationale: Dies entspricht der Grundbedeutung des Substantivs. Die im Zusammenhang mögliche Bedeutung einer plötzlichen geistigen Verwirrung wird in einer Fußnote offengehalten.
- source_word: θράσος
  choice: Übermut
  rationale: Das Wort bezeichnet hier keine neutrale Tapferkeit, sondern die anmaßende, dreiste Entschlossenheit des Königs.
- source_word: βαρύθυμον
  choice: finsteren
  rationale: Das Adjektiv beschreibt eine schwere, grimmige oder düstere Gemütsart. „Finster“ verbindet sich im Deutschen natürlich mit „Übermut“, ohne die negative Färbung abzuschwächen.
- source_word: ἔλαβεν
  choice: ergriff
  rationale: 'Die aktive Satzstruktur des Griechischen bleibt erhalten: Die Vergessenheit ergreift den Übermut des Königs.'
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildfolge des griechischen Textes bleibt bewusst erhalten: Nicht unmittelbar der König, sondern sein Übermut wird von Vergessenheit ergriffen.'
