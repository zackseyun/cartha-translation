base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/023.yaml
  text: For when he heard the outcry[a], and saw all of them prostrate for destruction, he wept in anger and threatened his friends, saying,
translation:
  language: de
  text: 'Denn als er das Geschrei hörte und sah, wie sie alle mit dem Gesicht zur Erde dalagen, dem Verderben preisgegeben, kamen ihm die Tränen, und voller Zorn drohte er seinen Freunden[a] mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Freunde“ kann in einem höfischen Zusammenhang auch königliche Vertraute oder Mitglieder des Hofes bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀκούσας
  choice: als er … hörte
  rationale: Das temporale Aoristpartizip wird in natürlichem Deutsch als Nebensatz wiedergegeben.
- source_word: κραυγῆς
  choice: das Geschrei
  rationale: Bezeichnet einen lauten, kollektiven oder verzweifelten Aufschrei; „Geschrei“ passt zum öffentlichen Geschehen.
- source_word: συνιδὼν
  choice: sah
  rationale: Das Verb kann ein bewusstes Wahrnehmen einschließen; der folgende Inhaltssatz verdeutlicht, was er erkannte.
- source_word: πρηνεῖς
  choice: mit dem Gesicht zur Erde dalagen
  rationale: Gibt die konkrete Körperhaltung anschaulich und allgemein verständlich wieder.
- source_word: ἅπαντας
  choice: sie alle
  rationale: Bezieht sich ausdrücklich auf die gesamte zuvor genannte Gruppe.
- source_word: εἰς τὴν ἀπώλειαν
  choice: dem Verderben preisgegeben
  rationale: Drückt ihre Ausrichtung auf beziehungsweise ihre Bestimmung zum drohenden Untergang idiomatisch aus, ohne die Art des Verderbens näher festzulegen.
- source_word: δακρύσας
  choice: kamen ihm die Tränen
  rationale: Gibt das Vergießen von Tränen würdevoll und natürlich wieder, ohne einen länger andauernden Klagevorgang vorauszusetzen.
- source_word: μετʼ ὀργῆς
  choice: voller Zorn
  rationale: Bewahrt die starke emotionale Färbung und lässt den engen Zusammenhang von Tränen und Drohung erkennen.
- source_word: τοῖς φίλοις
  choice: seinen Freunden
  rationale: Bleibt beim Grundsinn des griechischen Ausdrucks; dessen mögliche höfische Fachbedeutung wird in einer Fußnote erläutert.
- source_word: διηπείλει
  choice: drohte
  rationale: Das Imperfekt bezeichnet die im Gang befindliche Handlung; im deutschen Erzählstil genügt die einfache Vergangenheitsform.
- source_word: λέγων
  choice: mit den Worten
  rationale: Leitet idiomatisch die im folgenden Vers einsetzende direkte Rede ein.
