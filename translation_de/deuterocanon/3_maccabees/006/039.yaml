base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/039.yaml
  text: In these things also[a], after gloriously revealing his mercy[c][b], the Sovereign of all rescued them all together without stumbling.
translation:
  language: de
  text: Bei all dem offenbarte der Herrscher über alles auch auf herrliche Weise sein Erbarmen[a] und rettete sie alle gemeinsam[b] unversehrt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ließ sein Erbarmen sichtbar werden“. Das griechische Partizip betont dessen Offenbarung oder Sichtbarwerden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „einmütig“. Das griechische Wort kann sowohl gemeinschaftliche Einheit als auch gemeinsames Geschehen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ohne zu straucheln“ oder „ohne zu Fall zu kommen“; gemeint ist wahrscheinlich, dass sie ohne Schaden gerettet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: Bei all dem
  rationale: Die relative Wendung verweist auf die zuvor genannten Umstände oder Ereignisse. „Bei all dem“ wahrt diesen Rückbezug, ohne ein im Einzelvers nicht ausdrücklich genanntes Bezugswort einzusetzen.
- source_word: καὶ
  choice: auch
  rationale: Das Wort stellt eine ergänzende Verbindung zum Vorhergehenden her; „auch“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: μεγαλοδόξως
  choice: auf herrliche Weise
  rationale: Die adverbiale Form beschreibt die glanzvolle, eindrucksvolle Offenbarung des Erbarmens und bewahrt den gehobenen Ton.
- source_word: ἐπιφάνας
  choice: offenbarte
  rationale: Das Partizip von ἐπιφαίνω bezeichnet hier das Sichtbarwerden beziehungsweise Offenbaren, da „sein Erbarmen“ das direkte Objekt ist. Eine finite Koordination mit „und“ ist im Deutschen natürlicher und vermeidet eine unnötig starre zeitliche Festlegung durch „nachdem“.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: sein Erbarmen
  rationale: ἔλεος bezeichnet barmherzige Zuwendung und Mitgefühl. „Erbarmen“ ist in diesem Zusammenhang idiomatisch und würdevoll.
- source_word: ὁ τῶν πάντων δυνάστης
  choice: der Herrscher über alles
  rationale: δυνάστης ist eine Herrschaftsbezeichnung. Die Wiedergabe wahrt den Unterschied zu παντοκράτωρ und steigert den Titel nicht zu einer anderen traditionellen Gottesbezeichnung.
- source_word: ἀπταίστους
  choice: unversehrt
  rationale: Wörtlich bedeutet das Adjektiv „ohne zu straucheln/zu Fall zu kommen“. Im Zusammenhang der Rettung bezeichnet es wahrscheinlich, dass ihnen bei der Befreiung kein Schaden widerfuhr; die Bildsprache wird in einer Fußnote dokumentiert.
- source_word: ἐρρύσατο
  choice: rettete
  rationale: Das Verb bezeichnet die Befreiung aus konkreter Gefahr. „rettete“ ist im Deutschen klar, kräftig und kontextgerecht.
- source_word: ὁμοθυμαδόν
  choice: alle gemeinsam
  rationale: Das Adverb kann sowohl gemeinsames Handeln als auch Einmütigkeit ausdrücken. Beim Objekt einer Rettung ist „alle gemeinsam“ eine natürliche Lesart; die mögliche Bedeutung „einmütig“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottestitels ὁ τῶν πάντων δυνάστης
  choice: der Herrscher über alles
  alternative: der Machthaber über alles; der allmächtige Herrscher
  rationale: Der griechische Text verwendet δυνάστης, nicht παντοκράτωρ. Daher wird Gottes umfassende Herrschaft ausgedrückt, ohne einen anderen, theologisch stärker festgelegten Titel in den Text einzutragen.
- issue: Verhältnis zwischen der Offenbarung des Erbarmens und der Rettung
  choice: offenbarte … und rettete
  alternative: nachdem er … offenbart hatte, rettete er
  rationale: Das griechische Aoristpartizip lässt das genaue zeitliche beziehungsweise begleitende Verhältnis offen. Die deutsche Koordination stellt beide Handlungen eng zusammen, ohne die Offenbarung zwingend als vollständig vorausgehenden Vorgang festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur ist flüssig, bewahrt aber den Rückbezug zum Kontext, den besonderen Gottestitel und die semantischen Spannungen der griechischen Adverbien und Partizipien.
