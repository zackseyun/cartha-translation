base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/036.yaml
  text: And having established a common ordinance concerning these things for all their community throughout their generations[a], they decreed that the previously mentioned days should be observed as days of rejoicing, not for the sake of drinking and gluttony, but because of the deliverance that had come to them through God.
translation:
  language: de
  text: Und nachdem sie darüber eine gemeinsame Satzung für ihre ganze Gemeinschaft über Generationen hinweg festgelegt hatten, bestimmten sie, die zuvor genannten Tage als Freudentage zu begehen – nicht um des Trinkens und der Völlerei willen, sondern wegen der Rettung, die ihnen durch Götter[a] zuteilgeworden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „durch Götter“ (διὰ θεῶν). In diesem jüdischen Zusammenhang wäre „durch Gott“ zu erwarten; der Plural kann auf die überlieferte Textform oder eine ungewöhnliche Ausdrucksweise zurückgehen.
    reason: Der auffällige Plural des griechischen Textes steht in Spannung zum monotheistischen Erzählzusammenhang und muss für Leserinnen und Leser transparent gemacht werden.
lexical_decisions:
- source_word: κοινὸν … θεσμόν
  choice: eine gemeinsame Satzung
  rationale: „Satzung“ gibt den formellen, gemeinschaftlich verbindlichen Charakter von θεσμός wieder; „gemeinsam“ bewahrt den korporativen Sinn von κοινός.
- source_word: ὁρισάμενοι
  choice: festgelegt hatten
  rationale: Das Partizip bezeichnet hier die förmliche Festlegung einer Regel und wird im Deutschen natürlich als vorzeitiger Nebensatz wiedergegeben.
- source_word: ἐπὶ πᾶσαν τὴν παροικίαν αὐτῶν
  choice: für ihre ganze Gemeinschaft
  rationale: παροικία bezeichnet hier die als ansässige Minderheit in der Fremde lebende Gemeinschaft. „Gemeinschaft“ ist verständlich, ohne die Stelle unnötig auf einen bestimmten Diasporabegriff festzulegen.
- source_word: εἰς γενεάς
  choice: über Generationen hinweg
  rationale: Die Formulierung bringt die fortdauernde Geltung für aufeinanderfolgende Generationen idiomatisch zum Ausdruck.
- source_word: τὰς προειρημένας ἡμέρας ἄγειν … εὐφροσύνους
  choice: die zuvor genannten Tage als Freudentage zu begehen
  rationale: ἄγειν kann bei Festtagen „begehen/feiern“ bedeuten; εὐφροσύνους kennzeichnet sie als von Freude bestimmte Tage.
- source_word: ἐστήσαν
  choice: bestimmten sie
  rationale: Das Verb bezeichnet im Zusammenhang mit der zuvor festgelegten Satzung einen verbindlichen Beschluss, ohne mit „verordneten“ einen zu technischen Rechtsstil einzuführen.
- source_word: πότου καὶ λιχνείας
  choice: des Trinkens und der Völlerei
  rationale: „Trinken“ bleibt nahe an πότος; „Völlerei“ gibt die maßlose Genusssucht von λιχνεία klar und idiomatisch wieder.
- source_word: σωτηρίας
  choice: Rettung
  rationale: Im historischen Erzählzusammenhang geht es um konkrete Bewahrung aus Lebensgefahr; „Rettung“ wahrt zugleich das religiöse Gewicht des Begriffs.
- source_word: τῆς διὰ θεῶν γενομένης αὐτοῖς
  choice: die ihnen durch Götter zuteilgeworden war
  rationale: Die Wiedergabe bewahrt den tatsächlich überlieferten Plural θεῶν und löst dessen Spannung zum jüdischen Erzählzusammenhang nicht stillschweigend auf.
theological_decisions:
- issue: Der Plural θεῶν in einem jüdisch-monotheistischen Erzählzusammenhang
  choice: durch Götter[a]
  alternative: durch Gott; durch göttliches Eingreifen
  rationale: Der griechische Ausgangstext der angegebenen Ausgabe hat eindeutig den Plural „Götter“. Eine Ersetzung durch den Singular würde die schwierige Überlieferung im Haupttext glätten. Die Fußnote weist auf den Kontext und mögliche Erklärungen hin, ohne den Wortlaut eigenmächtig zu emendieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem formellen Beschlusscharakter des griechischen Textes verpflichtet, wird aber durch einen natürlichen Nebensatz und einen Gedankenstrich lesbar gehalten. Der textkritisch und theologisch auffällige Plural wird im Haupttext bewahrt und in der Fußnote erläutert.
