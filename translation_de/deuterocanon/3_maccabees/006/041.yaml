lexical_decisions:
- source_word: συναινέσας
  choice: ihnen zugestimmt hatte
  rationale: Das Aoristpartizip von συναινέω bezeichnet die Zustimmung zu dem zuvor vorgebrachten Anliegen; die vorzeitige Wiedergabe ist im Deutschen natürlich.
- source_word: ἔγραψεν αὐτοῖς
  choice: schrieb er ihnen
  rationale: Der Dativ αὐτοῖς bezeichnet die Personen, denen beziehungsweise zu deren Gunsten der König schrieb. Die knappe deutsche Formulierung bewahrt die im Griechischen offene Beziehung.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: den nachfolgend wiedergegebenen Brief
  rationale: ὑπογεγραμμένην bedeutet wörtlich „unten geschrieben“ beziehungsweise „nachstehend“. Die gewählte Form ist eine natürliche Einleitung zu dem unmittelbar folgenden Wortlaut.
- source_word: πρὸς τοὺς κατὰ πόλιν στρατηγούς
  choice: an die Strategen in den einzelnen Städten
  rationale: κατὰ πόλιν ist distributiv. Das Lehnwort „Strategen“ wahrt die Verbindung von militärischem Kommando und örtlichem Verwaltungsamt, ohne die Funktion vorschnell auf „Generäle“ oder „Statthalter“ festzulegen.
- source_word: μεγαλοψύχως
  choice: großmütig
  rationale: Das Adverb bezeichnet eine hochherzige, edle oder großzügige Haltung und erhält hier den gehobenen Ton.
- source_word: τὴν ἐκτενῆ ἔχουσαν
  choice: darin legte er die Sache ausführlich … dar
  rationale: Die verdichtete griechische Wendung beschreibt den Brief als ausführlich beziehungsweise eingehend. Eine verbale deutsche Wiedergabe macht den Sinn verständlich, ohne lediglich äußere Länge zu behaupten.
