  - marker: b
    text: Das griechische Wort στρατηγοί bezeichnet militärische Befehlshaber, kann in diesem Zusammenhang aber zugleich örtliche Verwaltungsbeamte meinen; daher steht im Text die offenere Bezeichnung „Strategen“.
