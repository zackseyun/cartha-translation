  text: And they rose up[a], and filled the force of their adversaries with confusion and cowardice[b], and bound them with immovable fetters.
translation:
  language: de
  text: Und sie traten ihnen entgegen[a], erfüllten die Streitmacht ihrer Gegner mit Verwirrung und Verzagtheit[b] und banden sie mit unverrückbaren Fesseln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „leisteten Widerstand“; das griechische Verb kann sowohl das Entgegentreten als auch den Widerstand gegen Gegner bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „erfüllten die Streitmacht ihrer Gegner mit Verwirrung und Feigheit“. Das griechische Wort kann auch Furchtsamkeit oder Mutlosigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: traten ihnen entgegen
  rationale: Der Aorist von ἀνθίστημι bezeichnet hier ein widerständiges Entgegentreten. Die Formulierung bewahrt sowohl das Bild des Stellungnehmens als auch den Sinn des Widerstands, ohne eine bloße Aufstehbewegung anzunehmen.
- source_word: δύναμιν τῶν ὑπεναντίων
  choice: die Streitmacht ihrer Gegner
  rationale: δύναμις meint im militärischen Zusammenhang die Truppenmacht, nicht abstrakte Kraft. ὑπεναντίων bezeichnet die ihnen entgegenstehenden Gegner.
- source_word: ταραχῆς καὶ δειλίας
  choice: mit Verwirrung und Verzagtheit
  rationale: ταραχή bezeichnet Unruhe oder Verwirrung; δειλία kann Feigheit, Furchtsamkeit oder Mutlosigkeit bedeuten. „Verzagtheit“ gibt die lähmende Furcht wieder, ohne stärker als der Kontext moralisch zu verurteilen.
- source_word: ἀκινήτοις ... πέδαις
  choice: mit unverrückbaren Fesseln
  rationale: πέδαι sind bindende Fesseln, ursprünglich besonders Fußfesseln. ἀκίνητος betont, dass diese nicht bewegt oder abgeschüttelt werden können; „unverrückbar“ erhält das markante griechische Bild.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bildsprache und die ungewöhnlich starke Wendung „unverrückbare Fesseln“ bleiben erhalten; die syntaktische Parallelität des griechischen Satzes wird weitgehend bewahrt.
