base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/038.yaml
  text: Copies were made for them from the twenty-fifth of Pachon until the fourth of Epiphi[a], over forty days; and they appointed their destruction from the fifth of Epiphi until the seventh[b], in three days.
translation:
  language: de
  text: Für sie wurden vom fünfundzwanzigsten Pachon bis zum vierten Epiphi[a], über einen Zeitraum von vierzig Tagen, Abschriften angefertigt[b]. Ihre Vernichtung aber setzten sie für die drei Tage vom fünften bis zum siebten Epiphi fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pachon und Epiphi sind ägyptische Monatsnamen, die hier zur amtlichen Datierung dienen.
    reason: cultural_note
  - marker: b
    text: Das griechische Verb kann das Anfertigen von Abschriften oder amtlichen Schriftstücken bezeichnen; was genau schriftlich festgehalten wurde, sagt der Vers nicht ausdrücklich.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντιγράφονται
  choice: Abschriften wurden angefertigt
  rationale: Die Passivform bezeichnet am ehesten das Anfertigen von Abschriften oder amtlichen Schriftstücken. Da der Gegenstand im Griechischen ungenannt bleibt, wird er nicht als Erlass, Liste oder Befehl präzisiert.
- source_word: αὐτοῖς
  choice: für sie
  rationale: Der Dativ wird schlicht wiedergegeben und verweist auf die zuvor genannten Menschen, ohne das Bezugswort erklärend einzusetzen.
- source_word: ἀπὸ πέμπτης τοῦ Παχὼν καὶ εἰκάδος
  choice: vom fünfundzwanzigsten Pachon
  rationale: Die griechische Datumsformel bezeichnet den fünfundzwanzigsten Tag des ägyptischen Monats Pachon.
- source_word: ἕως τῆς τετάρτης τοῦ Ἐπιφὶ
  choice: bis zum vierten Epiphi
  rationale: Die ägyptische Monatsbezeichnung wird transliteriert und die Datumsangabe in natürlicher deutscher Form wiedergegeben.
- source_word: ἐπʼ ἡμέρας τεσσαράκοντα
  choice: über einen Zeitraum von vierzig Tagen
  rationale: Die Wendung gibt die Dauer des genannten Vorgangs an; die Formulierung vermeidet das missverständliche deutsche „über vierzig Tage“ im Sinn von mehr als vierzig.
- source_word: συνίστανται
  choice: setzten … fest
  rationale: Im amtlich-planerischen Zusammenhang bezeichnet das Verb das Anordnen beziehungsweise zeitliche Festlegen des Vorhabens.
- source_word: τὴν ἀπώλειαν
  choice: ihre Vernichtung
  rationale: Im Kontext ist nicht bloßer Verlust, sondern die beabsichtigte Beseitigung der Betroffenen gemeint. „Vernichtung“ gibt diese Stärke klar wieder.
- source_word: ἀπὸ πέμπτης τοῦ Ἐπιφὶ ἕως ἑβδόμης, ἡμέραις τρισίν
  choice: für die drei Tage vom fünften bis zum siebten Epiphi
  rationale: Die Datumsgrenzen und die ausdrücklich genannte Dauer von drei Tagen werden zu einer natürlichen, eindeutigen deutschen Zeitangabe verbunden.
