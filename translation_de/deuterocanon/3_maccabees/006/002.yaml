  terminology: „Höchster“ und „allmächtiger Gott“ sind angemessene etablierte Gottesbezeichnungen. „König von gewaltiger Macht“ gibt den Nachdruck von μεγαλοκράτωρ verständlich wieder, ohne die Titelfolge zu glätten.
