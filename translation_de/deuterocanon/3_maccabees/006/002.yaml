  text: O König von gewaltiger Macht, Höchster, allmächtiger Gott, der du die ganze Schöpfung barmherzig lenkst,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεῦ
  choice: O König
  rationale: Der Vokativ eröffnet ein Gebet als feierliche direkte Anrede; „O König“ gibt Form und Ton natürlich wieder.
- source_word: μεγαλοκράτωρ
  choice: von gewaltiger Macht
  rationale: Das seltene Kompositum verbindet Größe mit Macht beziehungsweise Herrschaft. Die Formulierung bewahrt diesen Nachdruck, ohne im Deutschen künstlich zu wirken.
- source_word: ὕψιστε
  choice: Höchster
  rationale: Die substantivierte Superlativform ist die geläufige und bibelsprachlich angemessene Wiedergabe des göttlichen Titels.
- source_word: παντοκράτωρ
  choice: allmächtiger
  rationale: „Allmächtig“ ist der etablierte deutsche Gottesname und bringt die umfassende Macht des Titels knapp zum Ausdruck.
- source_word: δέε
  choice: Gott
  rationale: Im Zusammenhang der aufeinanderfolgenden Vokative ist eine unmittelbare Anrede Gottes gemeint; „allmächtiger Gott“ ergibt im Deutschen eine klare, würdige Titelfolge.
- source_word: τὴν πᾶσαν … κτίσιν
  choice: die ganze Schöpfung
  rationale: κτίσις bezeichnet hier die gesamte geschaffene Ordnung; „die ganze Schöpfung“ ist präzise und idiomatisch.
- source_word: διακυβερνῶν
  choice: der du … lenkst
  rationale: Das Verb kann das Steuern oder Leiten bezeichnen. Der deutsche Relativsatz gibt das griechische Partizip in direkter Gebetsanrede natürlich wieder und lässt das Bild des Lenkens erkennen.
- source_word: ἐν οἰκτιρμοῖς
  choice: voll Erbarmen
  rationale: Die Wendung beschreibt, dass Gottes Leitung von Erbarmen geprägt ist. „Voll Erbarmen“ ist natürliches, würdevolles Deutsch; die Fußnote hält die konkrete Pluralform des Griechischen offen.
theological_decisions:
- issue: Häufung göttlicher Titel in direkter Anrede
  choice: 'Alle Titel werden ausdrücklich wiedergegeben: „O König von gewaltiger Macht, Höchster, allmächtiger Gott“'
  alternative: Die Titelfolge zu einer kürzeren Gottesbezeichnung zusammenziehen
  rationale: Die Häufung ist ein bewusstes rhetorisches Merkmal des Gebets und betont verschiedene Aspekte göttlicher Hoheit; sie sollte nicht eingeebnet werden.
- issue: Bedeutung von παντοκράτωρ
  choice: allmächtiger
  alternative: Herrscher über alles
  rationale: Beide Bedeutungsrichtungen sind möglich. „Allmächtiger“ ist im Deutschen als biblischer Gottesname fest verankert und bewahrt hier die knappe Titelform, ohne die umfassende göttliche Macht abzuschwächen.
- issue: Plural von οἰκτιρμοί
  choice: Im Haupttext idiomatisch „voll Erbarmen“, mit Erläuterung der Pluralnuance in der Fußnote
  alternative: Wörtlich „in Erbarmungen“ oder deutender „durch Erweise des Erbarmens“
  rationale: Der ungewohnte deutsche Plural wäre missverständlich. Die gewählte Fassung wahrt den Sinn, während die Fußnote offenlegt, dass das Griechische vielfache Erweise oder die Fülle des Erbarmens anklingen lassen kann.
translation_notes:
  register: Feierliche, aber gut verständliche Gebetssprache. Die gestaffelten Gottestitel bleiben erhalten; ein Relativsatz macht das griechische Partizip in moderner deutscher Anrede flüssig. Das abschließende Komma zeigt, dass der Gebetssatz im folgenden Vers weitergeht.
