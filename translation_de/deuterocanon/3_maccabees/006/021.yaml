  text: And the beasts turned against the armed forces following them[a], and they trampled them and destroyed them.
translation:
  language: de
  text: Da wandten sich die Tiere gegen die bewaffneten Truppen, die ihnen folgten[a], und zertrampelten und vernichteten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sie begleiteten“. Das griechische Partizip kann sowohl „folgen“ als auch „begleiten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: wandten sich gegen
  rationale: Das aktive Verb bezeichnet hier eine Richtungsänderung der Tiere auf ein neues Ziel hin; der feindliche Zusammenhang rechtfertigt „gegen“.
- source_word: τὰ θηρία
  choice: die Tiere
  rationale: Im unmittelbaren Erzählzusammenhang sind die Elefanten gemeint. „Tiere“ ist im modernen Deutschen natürlich und bewahrt die Bezeichnung des griechischen Textes, ohne sie unnötig als wild zu charakterisieren.
- source_word: ἐπὶ
  choice: gegen
  rationale: Bei einer feindlichen Bewegung auf ein Ziel hin gibt „gegen“ die Funktion der Präposition treffend wieder.
- source_word: τὰς συνεπομένας ἔνοπλους δυνάμεις
  choice: die bewaffneten Truppen, die ihnen folgten
  rationale: „Bewaffnete Truppen“ gibt ἔνοπλους δυνάμεις idiomatisch wieder; der Relativsatz bewahrt die Grundbedeutung des Partizips συνεπομένας. Eine Fußnote nennt die ebenfalls mögliche Nuance des Begleitens.
- source_word: κατεπάτουν
  choice: zertrampelten
  rationale: Das deutsche Verb vermittelt die gewaltsame Handlung unter den Füßen und passt zu den im Griechischen verwendeten Imperfektformen.
- source_word: ὠλέθρευον
  choice: vernichteten
  rationale: „Vernichten“ bewahrt die starke, umfassende Bedeutung des Verbs, ohne sie enger auf „töten“ festzulegen.
