translation:
  language: de
  text: Auch Jona, der im Bauch des von der Tiefe genährten Seeungeheuers[a] dahinschwand, hast du freigebig unversehrt allen Seinen gezeigt, Vater,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „großen Meerestieres“ beziehungsweise „großen Fisches“. Das griechische κῆτος bezeichnet ein großes Meeresgeschöpf; „Wal“ wäre genauer festgelegt, als es der griechische Ausdruck verlangt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βυθοτρεφοῦς
  choice: in der Tiefe genährten
  rationale: Das Kompositum verbindet βυθός („Tiefe, Meerestiefe“) mit τρέφω („nähren“). Die Wiedergabe erhält das ungewöhnliche Bild, statt es zu einem bloßen Herkunftshinweis abzuflachen.
- source_word: κήτους
  choice: Seeungeheuers
  rationale: κῆτος bezeichnet ein großes Meerestier oder Seeungeheuer, ohne die zoologische Bestimmtheit von „Wal“. Das Kompositum ist im Deutschen natürlich und bewahrt die gewichtige Bildsprache.
- source_word: τηκόμενον
  choice: dahinschwand
  rationale: Das Partizip von τήκω bezeichnet ein Schmelzen, Aufgezehrtwerden oder Hinschwinden. „dahinschwand“ gibt die fortschreitende Entkräftung würdig und idiomatisch wieder.
- source_word: ἀφθόνῳ
  choice: in Fülle
  rationale: Die Dativform ist syntaktisch schwierig; das Wortfeld umfasst Fülle, Freigebigkeit und Vorbehaltlosigkeit. „in Fülle“ folgt der lexikalischen Grundidee, ohne einen im Griechischen nicht ausdrücklich genannten Handelnden oder Gegenstand einzusetzen.
- source_word: ἀσήμαντον
  choice: unversehrt
  rationale: Wörtlich bezeichnet das Wort jemanden, der kein Mal oder Zeichen trägt; im Rettungskontext ist „unversehrt“ die klare natürliche Entsprechung.
- source_word: πᾶσιν οἰκείοις
  choice: vor all den Seinen
  rationale: οἰκεῖοι kann Angehörige, Hausgenossen oder die eigenen Leute bezeichnen. „all den Seinen“ bewahrt diese relationale Weite; „vor“ entspricht dem öffentlichen Sichtbarwerden im Zusammenhang mit ἀναδείξας.
- source_word: ἀναδείξας
  choice: erscheinen lassen
  rationale: ἀναδείκνυμι bedeutet hervorzeigen, offenbar machen oder ans Licht bringen. „erscheinen lassen“ verbindet hier Jonas Hervorkommen mit seiner sichtbaren Wiederherstellung.
- source_word: πάτερ
  choice: Vater
  rationale: Die direkte Anrede Gottes wird schlicht und ohne konfessionelle Erweiterung beibehalten.
theological_decisions:
- issue: Bezeichnung des Tieres in der Jona-Anspielung
  choice: Seeungeheuer
  alternative: großer Fisch; Wal
  rationale: κῆτος ist weiter und bildkräftiger als eine bestimmte zoologische Art. „Wal“ wäre traditionsbedingt zu eng, während „großer Fisch“ die Wortwahl des vorliegenden griechischen Textes abschwächen könnte.
- issue: Art der Wiederherstellung Jonas
  choice: unversehrt vor all den Seinen erscheinen lassen
  alternative: ihn allen seinen Angehörigen unverletzt zurückgeben
  rationale: Die gewählte Formulierung erhält sowohl ἀσήμαντον als auch den Offenbarungsaspekt von ἀναδείξας, ohne eine Rückkehr oder Übergabe zu behaupten, die nicht ausdrücklich im Text steht.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die ungewöhnliche Tiefen-Bildsprache bleibt erhalten. „Dahinschwand“ ist leicht gehoben, aber allgemein verständlich und dem feierlichen Rückblick auf Gottes Rettungstaten angemessen.
