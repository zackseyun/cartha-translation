base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/030.yaml
  text: Then the king[a], after summoning to the city the one in charge of the revenues, ordered that wine and the other provisions suitable for feasting be supplied to the Jews for seven days, deciding that in the very place where they had expected to meet destruction, in that place they should celebrate their deliverance with all rejoicing.
translation:
  language: de
  text: Dann ließ der König den Verantwortlichen für die Einkünfte in die Stadt rufen und befahl ihm, den Juden sieben Tage lang Wein und die übrigen für ein Festmahl geeigneten Vorräte bereitzustellen. Er hatte nämlich beschlossen, dass sie genau dort, wo sie den Untergang erleiden zu müssen glaubten, mit aller Freude ihre Rettung[a] feiern sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Rettungsfest feiern«; auch: »ihr Heil feiern«. Der griechische Ausdruck bezeichnet hier die Feier ihrer Bewahrung vor dem Untergang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐπὶ τῶν προσόδων
  choice: der Verantwortliche für die Einkünfte
  rationale: Die Umschreibung gibt die Zuständigkeit des Amtsträgers für Einnahmen wieder, ohne einen im Griechischen nicht ausdrücklich genannten Amtstitel wie »Schatzmeister« einzuführen.
- source_word: εἰς τὴν πόλιν … προσκαλεσάμενος
  choice: ließ … in die Stadt rufen
  rationale: Die Formulierung wahrt die Zielrichtung von εἰς τὴν πόλιν und gibt das dem Hauptverb vorausgehende Herbeirufen in natürlichem Deutsch wieder.
- source_word: οἴνους
  choice: Wein
  rationale: Obwohl im Griechischen der Plural steht, ist der Stoffname »Wein« in diesem Zusammenhang im Deutschen idiomatisch.
- source_word: τὰ λοιπὰ πρὸς εὐωχίαν ἐπιτήδεια
  choice: alles Übrige …, was sie für ein Festmahl brauchten
  rationale: Die Wendung bezeichnet die weiteren Vorräte oder Mittel für ein festliches Mahl; die Übersetzung ist verständlich und erhält den festlichen Sinn.
- source_word: χορηγεῖν
  choice: bereitzustellen
  rationale: Das Verb bezeichnet die angeordnete Versorgung mit den benötigten Gütern und passt zum Handeln eines königlichen Amtsträgers.
- source_word: κρίνας
  choice: Er hatte nämlich beschlossen
  rationale: Das Partizip nennt die begründende königliche Entscheidung. Ein eigener Satz macht den langen griechischen Satz im Deutschen gut lesbar.
- source_word: ἔδοξαν
  choice: glaubten
  rationale: Im Zusammenhang bezeichnet das Verb die Erwartung oder Einschätzung der Juden angesichts des drohenden Endes.
- source_word: τὸν ὄλεθρον ἀναλαμβάνειν
  choice: den Untergang erleiden zu müssen
  rationale: Die idiomatische deutsche Wendung vermittelt den erwarteten tödlichen Ausgang, ohne das ungewöhnliche griechische Verb mechanisch mit »empfangen« wiederzugeben.
- source_word: σωτήρια ἀγαγεῖν
  choice: ihre Rettung feiern
  rationale: Die Verbindung bezeichnet eine Feier anlässlich der erfahrenen Rettung. Diese Wiedergabe passt zum konkreten Schutz vor der Vernichtung und bewahrt zugleich den Rettungssinn.
- source_word: ἐν εὐφροσύνῃ πάσῃ
  choice: mit aller Freude
  rationale: Die Formulierung gibt die nachdrückliche, umfassende Festfreude klar und würdig wieder.
theological_decisions:
- issue: Wiedergabe von σωτήρια im erzählerischen Zusammenhang
  choice: ihre Rettung feiern
  alternative: ihr Heil feiern; ein Rettungsfest feiern
  rationale: Gemeint ist unmittelbar die Bewahrung vor dem angedrohten Tod. »Rettung« ist daher kontextgerecht, ohne die weiter reichende Bedeutungsmöglichkeit von Heil oder Rettungsfeier auszuschließen; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die logische Verbindung wird durch »nämlich« gewahrt. Verwaltungssprache und Festmotiv bleiben erkennbar, ohne einen unbelegten technischen Amtstitel oder eine konfessionell geprägte Heilssprache in den Haupttext einzutragen.
