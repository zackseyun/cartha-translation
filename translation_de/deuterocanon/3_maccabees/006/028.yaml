base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/028.yaml
  text: Release the sons of the almighty[a], heavenly, living God[b], who from the time of our ancestors until now has brought unimpeded stability with glory to our affairs.
translation:
  language: de
  text: Lasst die Söhne[a] des allmächtigen, himmlischen, lebendigen Gottes frei, der seit den Tagen unserer Vorfahren bis heute unseren Angelegenheiten ungehinderte Beständigkeit, verbunden mit Ansehen, verleiht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Söhne“; dem Zusammenhang nach kann die Bezeichnung auch umfassender als „Kinder“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: „Ungehinderte Beständigkeit“ kann auch mit „ungehinderte Sicherheit“ oder „unbeeinträchtigtes Wohlergehen“ wiedergegeben werden. Gemeint sind feste, nicht behinderte Verhältnisse in den eigenen Angelegenheiten; „Ansehen“ kann hier auch „Ehre“ oder „Ruhm“ heißen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσατε
  choice: Lasst … frei
  rationale: Der Imperativ Plural verlangt die unmittelbare Freilassung; die deutsche Wendung ist direkt und natürlich.
- source_word: τοὺς υἱοὺς
  choice: die Söhne
  rationale: Das Griechische verwendet ausdrücklich den maskulinen Plural „Söhne“; diese Form wird nicht stillschweigend zu „Kinder“ verallgemeinert.
- source_word: τοῦ παντοκράτορος ἐπουρανίου θεοῦ ζῶντος
  choice: des allmächtigen, himmlischen, lebendigen Gottes
  rationale: Die Reihung bewahrt alle drei griechischen Bestimmungen und klingt zugleich in modernem Deutsch würdig und verständlich.
- source_word: ἀφʼ ἡμετέρων μέχρι τοῦ νῦν προγόνων
  choice: seit den Tagen unserer Vorfahren bis heute
  rationale: Die gedrängte griechische Zeitangabe bezeichnet die fortdauernde Zeitspanne von den Vorfahren bis zur Gegenwart.
- source_word: ἀπαραπόδιστον εὐστάθειαν
  choice: ungehinderte Beständigkeit
  rationale: ἀπαραπόδιστος bezeichnet das Ungehinderte oder Unaufhaltsame, εὐστάθεια die feste, geordnete und sichere Lage; „Beständigkeit“ vermeidet eine vorschnelle Verengung auf materiellen Wohlstand.
- source_word: μετὰ δόξης
  choice: verbunden mit Ansehen
  rationale: δόξα kann hier Ruhm, Ehre oder Ansehen bezeichnen. „Ansehen“ passt zum politischen Kontext, während „verbunden mit“ die begleitende Beziehung von μετά wahrt.
- source_word: προφέρει
  choice: verleiht
  rationale: Das Präsens beschreibt Gottes bis in die Gegenwart fortdauerndes förderndes Handeln; „verleiht“ gibt dies idiomatisch wieder.
- source_word: τοῖς ἡμετέροις πράγμασιν
  choice: unseren Angelegenheiten
  rationale: πράγματα ist bewusst weit und kann Angelegenheiten, Verhältnisse oder Staatsgeschäfte bezeichnen; die Übersetzung vermeidet die nicht ausdrücklich genannte Einengung auf „Reich“ oder „Staat“.
theological_decisions:
- issue: Reihung der Gottesbezeichnungen παντοκράτορος ἐπουρανίου θεοῦ ζῶντος
  choice: des allmächtigen, himmlischen, lebendigen Gottes
  alternative: des allmächtigen Gottes im Himmel, des lebendigen Gottes
  rationale: Die gewählte Fassung erhält die attributive Reihung des Griechischen, ohne daraus voneinander getrennte Titel oder Aussagen zu machen.
- issue: Geschlechtsspezifische Wiedergabe von υἱούς
  choice: Söhne
  alternative: Kinder
  rationale: Die Ausgangssprache sagt ausdrücklich „Söhne“. Die mögliche allgemeinere Auffassung wird in einer Fußnote genannt, aber nicht in den Haupttext eingetragen.
- issue: Art der von Gott gewährten εὐστάθεια
  choice: Beständigkeit
  alternative: Sicherheit oder Wohlergehen
  rationale: Der Begriff umfasst eine feste, geordnete Lage und kann politische Sicherheit oder gedeihliche Verhältnisse einschließen. Der Haupttext bewahrt den Kernbegriff, die Fußnote die Bedeutungsbreite.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, öffentlichem Befehlsstil. Die gestapelte Reihe der Gottesattribute bleibt erhalten. Ungebräuchliche Fremdwörter und eine unnötige Festlegung von πράγματα auf „Staat“ oder „Reich“ werden vermieden.
