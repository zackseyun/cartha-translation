base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/004.yaml
  text: Father[a], you who destroyed Pharaoh—the former ruler of this Egypt—when he was exalted with lawless arrogance and boastful speech, increasing in reckless acts, together with his proud army, drowning them in the sea, and who shone forth the light of mercy upon the people of Israel[c][b],
translation:
  language: de
  text: Vater, der du den Pharao, den einstigen Herrscher dieses Ägyptens, der sich in gesetzloser Dreistigkeit und mit großsprecherischer Zunge erhob und immer mehr vermessene Taten beging[a], samt seinem hochmütigen Heer, die vom Meer verschlungen wurden[b], vernichtet hast und dem Volk Israel das Licht des Erbarmens hast aufleuchten lassen[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist schwierig; auch möglich: „dreiste Taten häufte“ oder „anmaßende Taten mehrte“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich bezeichnet das Griechische Pharao und sein Heer als „vom Meer Verschlungene“.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „das Licht des Erbarmens aufleuchten lassen“; das Griechische verbindet ausdrücklich Licht und Erbarmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Vater
  rationale: Die direkte Anrede im Gebet wird schlicht, würdig und ohne ein im Griechischen nicht ausdrücklich vorhandenes „O“ wiedergegeben.
- source_word: Φαραώ
  choice: Pharao
  rationale: Die im Deutschen übliche biblische Form des ägyptischen Herrschertitels.
- source_word: τὸν πρὶν Αἰγύπτου ταύτης δυνάστην
  choice: den einstigen Herrscher dieses Ägyptens
  rationale: „Einstig“ gibt πρίν wieder, „Herrscher“ wahrt den zunächst neutralen Sinn von δυνάστης, und „dieses“ erhält das Demonstrativpronomen ταύτης.
- source_word: πληθύνοντα θράμασιν
  choice: sich in vermessenen Taten immer weiter verstieg
  rationale: Die schwierige Wendung bezeichnet eine Steigerung dreisten beziehungsweise anmaßenden Handelns. Die deutsche Fassung bewahrt sowohl den Zuwachs als auch den negativen Charakter der Taten.
- source_word: ἐπαρθέντα ἀνόμῳ θράσει
  choice: sich in gesetzloser Dreistigkeit erhob
  rationale: „Sich erhob“ erhält das Bild des Emporhebens und lässt im Zusammenhang den hochmütigen Sinn erkennen; „gesetzlose Dreistigkeit“ gibt die moralische Wertung und die unverschämte Kühnheit wieder.
- source_word: γλώσσῃ μεγαληγόμονι
  choice: mit großsprecherischer Zunge
  rationale: Die körperliche Metapher von γλώσσα bleibt erhalten, während „großsprecherisch“ das prahlerische Reden natürlich wiedergibt.
- source_word: σὺν τῇ ὑπερηφάνῳ στρατιᾷ
  choice: samt seinem hochmütigen Heer
  rationale: „Heer“ entspricht στρατιά in gehobenem, aber verständlichem Deutsch; „hochmütig“ trifft die negative Bedeutung von ὑπερήφανος.
- source_word: ποντοβρόχους ἀπώλεσας
  choice: vernichtet hast, vom Meer verschlungen
  rationale: 'Die ungewöhnliche Bildprägung des griechischen Kompositums wird sichtbar bewahrt: Pharao und Heer werden als vom Meer Verschlungene vernichtet.'
- source_word: φέγγος ἐπιφάνας ἐλέους
  choice: das Licht des Erbarmens aufleuchten ließest
  rationale: Die Lichtmetaphorik von φέγγος und ἐπιφαίνω wird nicht zu einem bloßen „Erbarmen zeigen“ verflacht.
- source_word: Ἰσραὴλ γένει
  choice: dem Volk Israel
  rationale: γένος meint hier die Abstammungs- und Volksgemeinschaft Israels; „Volk Israel“ ist verständlich und vermeidet moderne biologische Nebenbedeutungen von „Rasse“.
theological_decisions:
- issue: Das Gebet stellt Gottes Gericht über den hochmütigen Unterdrücker und sein Erbarmen mit Israel in einer fortlaufenden Anrede nebeneinander.
  choice: Beide Handlungen bleiben in einem langen Relativsatz verbunden, und sowohl das Verschlungenwerden durch das Meer als auch das Licht des Erbarmens bleiben bildhaft.
  alternative: Den Satz in mehrere Hauptsätze aufteilen und die Bilder als „ertränkt“ beziehungsweise „Erbarmen erwiesen“ paraphrasieren.
  rationale: Die syntaktische und bildliche Verbindung bewahrt den theologischen Kontrast zwischen Gericht und Erbarmen, ohne ihn zu erklären oder abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gebetstypischer Relativanrede („Vater, der du …“) und bewusst beibehaltener langer Satzführung. Der Konjunktiv „ließest“ wirkt leicht gehoben, bleibt in diesem Gebetsregister jedoch verständlich. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Wendung.
