lexical_decisions:
- source_word: οἵ τε Ἰουδαῖοι
  choice: Und die Juden
  rationale: Gemeint ist hier die jüdische Gemeinschaft in Ägypten als ethnisch-religiöse Gruppe; „Juden“ ist daher treffender als das geografisch mögliche „Judäer“.
- source_word: καθὼς προειρήκαμεν
  choice: wie bereits erwähnt
  rationale: Die Formulierung gibt den rückverweisenden Erzählerkommentar knapp und in natürlichem modernem Deutsch wieder.
- source_word: συστησάμενοι
  choice: bildeten
  rationale: Das Partizip bezeichnet das Zusammenstellen oder Organisieren einer Gruppe. Die finite Wiedergabe ergibt zusammen mit διῆγον einen flüssigen deutschen Satz.
- source_word: τὸν προειρημένον χορὸν
  choice: den zuvor genannten Festchor
  rationale: χορὸς kann einen Chor, Reigen oder eine singende und tanzende Festgesellschaft bezeichnen. „Festchor“ wahrt den musikalisch-feierlichen Kontext, ohne die Gruppe ausschließlich als modernen Gesangschor festzulegen; die verbleibende Bedeutungsbreite wird in einer Fußnote ausgewiesen.
- source_word: μετʼ εὐωχίας
  choice: bei einem Festmahl
  rationale: εὐωχία bezeichnet festliches Wohlleben und häufig konkret ein Festessen oder Bankett. „Bei einem Festmahl“ ist anschaulich und kontextgemäß.
- source_word: ἐν ἐξομολογήσεσιν ἱλαραῖς
  choice: mit freudigen Danksagungen
  rationale: ἐξομολόγησις bezeichnet im jüdisch-griechischen Gottesdienst häufig Dank oder Lob, nicht nur ein Sündenbekenntnis. ἱλαραῖς bringt die freudige Stimmung zum Ausdruck.
- source_word: καὶ ψαλμοῖς
  choice: und Psalmen
  rationale: „Psalmen“ ist die direkte, etablierte und im liturgischen Zusammenhang verständliche Wiedergabe.
- source_word: διῆγον
  choice: verbrachten ihre Zeit
  rationale: Der Imperfekt beschreibt eine fortdauernde Beschäftigung; die deutsche Wendung bewahrt diesen durativen Sinn.
theological_decisions:
- issue: Bedeutung von ἐξομολόγησις im gottesdienstlichen Kontext
  choice: Danksagungen
  alternative: Bekenntnisse / Lobpreisungen
  rationale: Der Zusammenhang ist eine freudige Feier mit Psalmen und Festmahl. Daher liegt Dank beziehungsweise Lob näher als ein Sündenbekenntnis; die lexikalische Spannung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satzbau wird behutsam geglättet, während Rückverweis, Festcharakter und fortdauernde Handlung erhalten bleiben. Die Bedeutungsbreite von χορός und ἐξομολόγησις wird nicht stillschweigend eingeengt, sondern durch Fußnoten offengelegt.
