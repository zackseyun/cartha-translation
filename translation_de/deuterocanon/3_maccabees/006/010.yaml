base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/010.yaml
  text: But if our way of life in the place of our exile has been caught up in ungodliness[a], then, after rescuing us from the hand of our enemies, destroy us by whatever death you choose[b], Master.
translation:
  language: de
  text: Wenn aber unsere Lebensführung während unseres Exils in Gottlosigkeit verstrickt ist[a], dann entreiße uns, nachdem du uns der Hand unserer Feinde entrissen hast, und vernichte uns durch den Tod, den du wählst, Gebieter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in unserer Kolonie/Ansiedlung“. Das griechische Wort kann eine Kolonie oder Ansiedlung bezeichnen; hier ist wahrscheinlich das gemeinschaftliche Leben in der Fremde gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Herr“ beziehungsweise „Herrscher“. Die griechische Anrede lautet δέσποτα, nicht κύριος.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβείας
  choice: Gottlosigkeit
  rationale: Bezeichnet religiös-sittliche Missachtung Gottes; „Gottlosigkeit“ bewahrt diesen Bezug deutlicher als das allgemeinere „Bosheit“.
- source_word: κατὰ τὴν ἀποικίαν
  choice: am Ort unseres Exils
  rationale: ἀποικία kann eine Kolonie oder Ansiedlung bezeichnen, meint im Gebetszusammenhang aber wahrscheinlich das Leben der Gemeinschaft fern der Heimat. Die Formulierung wahrt den Ortsbezug, ohne moderne politische Vorstellungen von Kolonisierung aufzurufen.
- source_word: ὁ βίος ἡμῶν
  choice: unsere Lebensführung
  rationale: βίος bezeichnet hier nicht nur das Leben als solches, sondern die Lebensweise beziehungsweise das Verhalten.
- source_word: ἐνέσχηκται
  choice: ist ... verstrickt
  rationale: Das Perfekt beschreibt einen eingetretenen und fortbestehenden Zustand des Verwickeltseins; „verstrickt“ gibt dies prägnant wieder.
- source_word: ῥυσάμενος
  choice: entreiße uns zunächst
  rationale: Das vorzeitige Aoristpartizip verlangt, dass die Rettung aus der Gewalt der Feinde der erbetenen Vernichtung vorausgeht. „Zunächst ... danach“ bildet diese Abfolge im Deutschen natürlich ab.
- source_word: ἀπὸ ἐχθρῶν χειρός
  choice: der Hand unserer Feinde
  rationale: Bewahrt das verständliche biblische Bild für die Gewalt oder Macht der Feinde.
- source_word: ᾧ προαιρῇ ... μόρῳ
  choice: durch die Todesart, die du wählst
  rationale: Verbindet das Relativpronomen und προαιρῇ sachgerecht mit μόρῳ und lässt die Art des Todes Gottes Wahl sein.
- source_word: δέσποτα
  choice: Gebieter
  rationale: Gibt die uneingeschränkte Autorität von δέσποτα wieder und unterscheidet den Ausdruck von κύριος; „Gebieter“ passt zugleich zum würdigen Gebetsregister.
- source_word: ἀπόλεσον ἡμᾶς μόρῳ
  choice: vernichte uns ... durch die Todesart
  rationale: Bewahrt die Härte des Imperativs ἀπόλεσον und macht deutlich, dass μόρος hier Tod beziehungsweise Todesgeschick bezeichnet.
theological_decisions:
- issue: Anrede δέσποτα gegenüber dem vertrauteren Gottestitel „Herr“
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: Der griechische Text hat δέσποτα, nicht κύριος. „Gebieter“ bewahrt die besondere Nuance absoluter Verfügungsgewalt, ohne einen anderen griechischen Titel einzutragen.
- issue: Bedeutung von ἀποικία im Diasporakontext
  choice: am Ort unseres Exils
  alternative: in unserer Kolonie; in unserer Ansiedlung; während unseres Aufenthalts in der Fremde
  rationale: Der Ausdruck kann wörtlich eine Kolonie oder Ansiedlung meinen. Im Kontext des Gebets liegt jedoch die Existenz der jüdischen Gemeinschaft fern ihrer Heimat nahe; die gewählte Fassung wahrt diese kontextuelle Bedeutung und den im Griechischen vorhandenen Ortsbezug.
- issue: Abfolge von Rettung und Tod
  choice: zunächst Rettung aus Feindeshand, danach Tod durch Gottes Verfügung
  alternative: gleichzeitige oder nur lose verbundene Handlungen
  rationale: 'Das Aoristpartizip ῥυσάμενος steht zum Imperativ ἀπόλεσον vorzeitig. Die paradoxe Bitte wird deshalb nicht geglättet: Lieber sollen sie nach göttlicher Rettung durch Gottes gewählten Tod sterben als ihren Feinden überlassen werden.'
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. „Lebensführung“ macht den ethischen Sinn von βίος deutlich; „verstrickt“ wahrt den resultativen Zustand des Perfekts. Die drastische und theologisch spannungsreiche Bitte wird nicht abgeschwächt.
