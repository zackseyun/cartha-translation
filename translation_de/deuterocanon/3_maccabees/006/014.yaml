translation:
  language: de
  text: Die ganze Schar der kleinen Kinder und deren Eltern fleht dich unter Tränen an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκετεύει
  choice: flehen … an
  rationale: Das Verb bezeichnet eine eindringliche, demütige Bitte. „Anflehen“ gibt Dringlichkeit und erhöhten Ton in natürlichem modernem Deutsch wieder.
- source_word: τὸ πᾶν πλῆθος
  choice: die ganze Schar
  rationale: „Die ganze“ bewahrt die Betonung der Gesamtheit; „Schar“ bezeichnet eine größere Gruppe und klingt hier würdevoller und natürlicher als „Menge“.
- source_word: τῶν νηπίων
  choice: der kleinen Kinder
  rationale: νήπια kann Säuglinge oder sehr junge Kinder bezeichnen. „Kleine Kinder“ wahrt den möglichen Altersumfang, ohne ihn unnötig auf Säuglinge einzuengen.
- source_word: οἱ τούτων γονεῖς
  choice: ihre Eltern
  rationale: Das Pronomen τούτων verweist auf die zuvor genannten Kinder; „ihre Eltern“ ist die klare und idiomatische deutsche Wiedergabe.
- source_word: μετὰ δακρύων
  choice: unter Tränen
  rationale: Die Wendung beschreibt die flehentliche Bitte als von Weinen begleitet. „Unter Tränen“ ist im Deutschen anschaulich, natürlich und dem feierlichen Kontext angemessen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Singular ἱκετεύει wird als kollektives Prädikat zu der als Einheit aufgefassten Gesamtschar verstanden; im Deutschen verbindet „flehen … an“ die Kinder und ihre Eltern natürlich als gemeinsames Subjekt.
