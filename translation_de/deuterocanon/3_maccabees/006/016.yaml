  yaml_path: translation/deuterocanon/3_maccabees/006/016.yaml
  text: But just as Eleazar was finishing his prayer[a], the king came along by the hippodrome with the beasts and all the tumult of his forces.
translation:
  language: de
  text: Gerade als Eleasar sein Gebet beendete, zog der König mit den wilden Tieren und dem ganzen Getöse[a] seiner Streitmacht die Rennbahn entlang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem ganzen lärmenden Auftrumpfen seiner Streitmacht“. Das griechische Wort bezeichnet ein schnaubendes, tobendes oder prahlerisches Lärmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λήγοντος ἄρτι
  choice: Gerade als … beendete
  rationale: Der Genitivus absolutus mit ἄρτι bezeichnet den Augenblick, in dem Eleasars Gebet eben zu Ende ging. Die deutsche Konstruktion bewahrt diese unmittelbare Gleichzeitigkeit.
- source_word: προσευχῆς
  choice: Gebet
  rationale: Dies ist in diesem Zusammenhang die klare und übliche Wiedergabe von προσευχή.
- source_word: παρῆγεν
  choice: zog … entlang
  rationale: παράγω bezeichnet hier eine Bewegung vorüber beziehungsweise entlang einer Örtlichkeit; „zog“ passt zudem zu dem königlichen Aufmarsch.
- source_word: κατὰ τὸν ἱππόδρομον
  choice: die Rennbahn entlang
  rationale: κατά mit Akkusativ wird lokal als Bewegung entlang der Rennbahn verstanden. „Rennbahn“ ist für ἱππόδρομος im Deutschen natürlich und allgemein verständlich.
- source_word: θηρίοις
  choice: den wilden Tieren
  rationale: θηρίον bezeichnet hier die gefährlichen Tiere, die für die Hinrichtung vorgesehen sind. „Wilde Tiere“ wahrt den bedrohlichen Sinn, ohne eine bestimmte Tierart einzutragen.
- source_word: παντὶ τῷ τῆς δυνάμεως φρύαγματι
  choice: dem ganzen Getöse seiner Streitmacht
  rationale: φρύαγμα kann ein Schnauben, Toben oder prahlerisches Lärmen ausdrücken. „Getöse“ gibt die hörbare, bedrohliche Wirkung natürlich wieder; „Streitmacht“ erfasst δύναμις hier als militärische Macht.
