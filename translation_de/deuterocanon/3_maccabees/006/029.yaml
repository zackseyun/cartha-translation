base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/029.yaml
  text: So he said these things[a]; but they, having been released in a moment, blessed their holy Savior God[b], having just escaped death.
translation:
  language: de
  text: Das also sagte er. Sie aber wurden binnen kürzester Zeit[a] freigelassen und priesen ihren heiligen Retter und Gott[b], nachdem sie soeben dem Tod entronnen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich eine griechische Wendung für einen äußerst kurzen Zeitraum; auch: „augenblicklich“ oder „ohne Verzögerung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Gott, ihren heiligen Retter“. Im Griechischen stehen die Bezeichnungen eng verbunden nebeneinander.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλεξεν
  choice: sagte
  rationale: Das Verb bezeichnet hier das Aussprechen der unmittelbar vorausgehenden Worte. „Sagte“ ist im Deutschen natürlich und gibt den Erzählzusammenhang klar wieder.
- source_word: ἐν ἀμερεῖ χρόνῳ
  choice: binnen kürzester Zeit
  rationale: Die Wendung bezeichnet einen äußerst kurzen Zeitraum. Diese Formulierung ist präzise, verständlich und weniger umgangssprachlich als „im Nu“.
- source_word: λυθέντες
  choice: freigelassen
  rationale: Das Passivpartizip beschreibt ihre Befreiung aus der Gewalt oder Fesselung, in der sie sich befanden.
- source_word: ηὐλόγουν
  choice: priesen
  rationale: Das Verb bedeutet wörtlich „segnen“ beziehungsweise „lobend preisen“. Bei Gott als Objekt ist „priesen“ im heutigen Deutschen natürlich und bewahrt den gottesdienstlichen Klang.
- source_word: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν
  choice: ihren heiligen Retter und Gott
  rationale: Die eng verbundene griechische Titelfolge bezeichnet Gott als den heiligen Retter der Befreiten. Die deutsche Verbindung mit „und“ macht die Apposition lesbar, ohne zwei verschiedene Personen anzunehmen.
- source_word: ἄρτι τὸν θάνατον ἐκπεφυγότες
  choice: nachdem sie soeben dem Tod entronnen waren
  rationale: Das Perfektpartizip bezeichnet die vollendete Rettung mit fortdauerndem Ergebnis; „soeben“ wahrt ihre unmittelbare zeitliche Nähe.
theological_decisions:
- issue: Wiedergabe von σωτήρ als Bezeichnung Gottes
  choice: Retter
  alternative: Befreier
  rationale: „Retter“ bewahrt sowohl die konkrete Rettung aus Todesgefahr als auch das theologische Gewicht des griechischen Titels, ohne über den Text hinauszugehen.
- issue: Verhältnis der Titel σωτῆρα und θεόν
  choice: ihren heiligen Retter und Gott
  alternative: Gott, ihren heiligen Retter
  rationale: Der griechische Ausdruck ist eine kompakte Titelfolge für ein und denselben Gott. Die Hauptfassung bleibt verständlich; die Fußnote weist auf die mögliche appositionelle Wiedergabe hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber der griechischen Partizipienfolge behutsam geglättet; „priesen“ erhält den biblisch-gottesdienstlichen Ton, ohne altertümlich zu wirken.
