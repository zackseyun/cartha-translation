  source_fidelity: 'Der Entwurf gibt die Satzbewegung und die wesentlichen Elemente des Griechischen insgesamt zutreffend wieder: der Sichtvorgang, der laute Ruf zum Himmel, das Mitschwingen bzw. Widerhallen der angrenzenden Höfe und die daraus folgende, das ganze Lager erfassende πτοή. „Das“ ergänzt das im Griechischen nicht ausgedrückte Objekt zulässig, aber „dies“ ist als anaphorischer Bezug etwas präziser. Die Ergebniskonstruktion ὥστε sollte im Deutschen ausdrücklich durch „sodass“ angebunden werden.'
