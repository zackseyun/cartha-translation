  terminology: „Juden“, „Himmel“, „Höfe“ und „Lager“ sind angemessene, sachlich-neutrale Wiedergaben. „Zum Himmel“ wahrt die indirekte religiöse Ausdrucksweise des griechischen Textes, ohne „Gott“ ergänzend einzusetzen. Die Fußnoten sollen die lexikalische Offenheit von συνηχήσαντας und πτοή erhalten.
