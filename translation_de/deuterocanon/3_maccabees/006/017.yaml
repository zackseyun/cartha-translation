base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/017.yaml
  text: And when the Jews saw it[a], they cried out loudly to heaven, so that even the neighboring courtyards, echoing with them[b], produced uncontrollable terror throughout the whole camp.
translation:
  language: de
  text: Als die Juden dies sahen, schrien sie laut zum Himmel, sodass selbst die angrenzenden Höfe widerhallten[a] und im ganzen Lager unaufhaltsame Panik[b] auslösten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Gleichklang ertönten“. Die Formulierung συνηχήσαντας kann ein gemeinsames Ertönen oder das Widerhallen der umgebenden Hofräume bezeichnen.'
    reason: Lexikalische Alternative für συνηχήσαντας; die Mehrdeutigkeit zwischen Zusammenklingen und Widerhallen bleibt erhalten.
  - marker: b
    text: 'Oder: „unaufhaltsamen Schrecken“. Das griechische Wort πτοή kann heftigen Schrecken, Entsetzen oder Panik bezeichnen.'
    reason: Lexikalische Bedeutungsbreite von πτοή; ἀκατάσχετος bezeichnet etwas nicht Zurückzuhaltendes oder Aufzuhaltendes.
lexical_decisions:
- source_word: θεωρήσαντες
  choice: Als ... das sahen
  rationale: Das aoristische Partizip bezeichnet den vorausgehenden Umstand; die Ergänzung „das“ ist im Deutschen natürlich, ohne den nicht ausdrücklich genannten Gegenstand näher festzulegen.
- source_word: μέγα ... ἀνέκραξαν
  choice: schrien sie laut
  rationale: μέγα wird adverbial gebraucht; „laut schreien“ gibt Stärke und Lautstärke des Ausrufs idiomatisch wieder.
- source_word: εἰς οὐρανόν
  choice: zum Himmel
  rationale: Bewahrt die ausdrücklich genannte Richtung des Rufes, ohne „Gott“ interpretierend einzusetzen.
- source_word: τοὺς παρακειμένους αὐλῶνας
  choice: die angrenzenden Höfe
  rationale: παρακείμενος bezeichnet räumliche Nähe, αὐλών Höfe beziehungsweise umschlossene Hofräume.
- source_word: συνηχήσαντας
  choice: hallten mit
  rationale: Gibt das gemeinsame Ertönen beziehungsweise Widerhallen der angrenzenden Höfe knapp und natürlich wieder.
- source_word: ἀκατάσχετον πτοήν
  choice: unbändige Panik
  rationale: ἀκατάσχετος bezeichnet etwas nicht Zurückzuhaltendes; πτοή kann heftigen Schrecken oder Panik meinen.
- source_word: παντὶ τῷ στρατοπέδῳ
  choice: das ganze Lager
  rationale: Der Dativ bezeichnet hier den von der Panik erfassten Bereich beziehungsweise Personenkreis.
theological_decisions:
- issue: Religiöse Bedeutung von εἰς οὐρανόν
  choice: zum Himmel
  alternative: zu Gott
  rationale: Der Zusammenhang legt einen Hilferuf an Gott nahe, doch der griechische Text nennt ausdrücklich den Himmel. Die Übersetzung erhält diese indirekte Ausdrucksweise.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die beiden deutschen Hauptsätze lösen die lange griechische Ergebniskonstruktion lesbar auf; „so“ bewahrt den ursächlichen Zusammenhang.
