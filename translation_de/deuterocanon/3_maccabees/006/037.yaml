  text: And they approached the king[a], asking for their release to their own homes.
translation:
  language: de
  text: Sie wandten sich an den König und baten darum, nach Hause[a] entlassen zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in das Ihre«; die Wendung kann den eigenen Ort, das eigene Zuhause oder den eigenen Bereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέτυχον
  choice: wandten sie sich an
  rationale: Das Verb kann eine Begegnung, ein Herantreten oder eine Bitte an eine Person bezeichnen. Im Zusammenhang mit αἰτούμενοι gibt die Wendung den direkten Appell wieder, ohne ein förmliches Rechtsgesuch vorauszusetzen.
- source_word: τῷ βασιλεῖ
  choice: an den König
  rationale: Der Dativ bezeichnet hier die Person, an die man sich wendet; »König« entspricht der schlichten griechischen Bezeichnung.
- source_word: τὴν ἀπόλυσιν αὐτῶν
  choice: entlassen zu werden
  rationale: ἀπόλυσις bezeichnet Entlassung oder Freigabe. Die verbale deutsche Fassung ist natürlich und bewahrt den Sinn, dass ihnen die Abreise gestattet werden sollte.
- source_word: εἰς τὰ ἴδια
  choice: in ihre Heimat
  rationale: Die idiomatische Wendung bezeichnet die Rückkehr in den eigenen Bereich beziehungsweise nach Hause. »Heimat« ist im Deutschen natürlich und lässt den Bezug kollektiv offen.
- source_word: αἰτούμενοι
  choice: baten darum
  rationale: Das Partizip nennt die begleitende Bitte und ihren Inhalt. »baten darum« gibt die höfliche, aber deutliche Bitte idiomatisch wieder.
