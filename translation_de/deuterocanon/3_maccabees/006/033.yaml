base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/033.yaml
  text: Likewise, the king also, holding a great banquet because of these things, was continually offering exalted thanksgiving to heaven for their astonishing deliverance that had taken place.
translation:
  language: de
  text: Ebenso veranstaltete auch der König aus diesem Anlass ein großes Festmahl[a] und brachte dem Himmel unablässig reichen Dank dar für ihre erstaunliche Rettung, die ihnen widerfahren war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »ein schweres Festmahl«; gemeint ist ein großes, aufwendiges oder üppiges Festmahl.
    reason: lexical_alternative
  - marker: b
    text: Oder »für ihr außergewöhnliches Heil, das eingetreten war«; im Zusammenhang ist die konkrete Rettung aus der Gefahr gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Ebenso
  rationale: Kennzeichnet knapp und natürlich die Parallele zum vorausgehenden Geschehen.
- source_word: περὶ τούτων
  choice: aus diesem Anlass
  rationale: Die Präpositionalphrase bezeichnet hier am natürlichsten den Anlass des Festmahls und verweist auf die zuvor geschilderten Ereignisse.
- source_word: συμπόσιον βαρὺ
  choice: ein großes Festmahl
  rationale: συμπόσιον bezeichnet ein Fest- oder Gastmahl; βαρύ ist hier idiomatisch im Sinn eines großen, aufwendigen oder üppigen Mahls zu verstehen, nicht als körperlich »schwer«.
- source_word: ἀδιαλείπτως
  choice: unablässig
  rationale: Gibt die fortdauernde oder wiederholte Handlung des Adverbs prägnant wieder.
- source_word: εἰς οὐρανόν
  choice: dem Himmel
  rationale: Bewahrt die ausdrückliche Bezeichnung »Himmel«, die wohl ehrfürchtig für Gott steht, ohne diese Deutung in den Haupttext einzutragen.
- source_word: ἀνθωμολογεῖτο
  choice: brachte ... Dank dar
  rationale: Im Zusammenhang mit der Rettung bezeichnet das Verb dankbare Anerkennung; die Umschreibung wahrt den gehobenen Ton und lässt sich mit dem Imperfekt als fortdauernde Handlung verbinden.
- source_word: μεγαλομερῶς
  choice: überschwänglichen
  rationale: Das seltene Adverb verstärkt die Art des Dankens; »überschwänglich« ist im Deutschen natürlich und vermittelt dessen großes Ausmaß.
- source_word: παραδόξῳ
  choice: erstaunliche
  rationale: Bezeichnet etwas Unerwartetes, Außergewöhnliches und Staunen Erregendes.
- source_word: γενηθείσῃ αὐτῶν σωτηρίᾳ
  choice: die erstaunliche Rettung, die ihnen widerfahren war
  rationale: »Rettung« entspricht im unmittelbaren Erzählzusammenhang der konkreten Befreiung. Der Relativsatz macht das vollzogene Geschehen des Partizips γενηθείσῃ sichtbar und gibt αὐτῶν idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von σωτηρία im erzählerischen Rettungszusammenhang
  choice: Rettung
  alternative: Heil
  rationale: Gemeint ist zunächst die konkrete Bewahrung beziehungsweise Befreiung der Menschen. »Rettung« trifft diesen unmittelbaren Sinn, ohne mögliche weitergehende theologische Anklänge auszuschließen.
- issue: Wiedergabe von εἰς οὐρανόν
  choice: dem Himmel
  alternative: Gott
  rationale: Der griechische Text nennt ausdrücklich den Himmel, vermutlich als ehrfürchtige Umschreibung für Gott. Die Übersetzung bewahrt diese Zurückhaltung und ersetzt die Formulierung nicht durch ihre wahrscheinliche Referenz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Festmahl«, »brachte ... Dank dar« und »widerfahren war« erhalten den gehobenen Erzählton, ohne altertümlich zu wirken. Die Metonymie »Himmel« und die Bedeutungsbreite von σωτηρία bleiben erkennbar.
