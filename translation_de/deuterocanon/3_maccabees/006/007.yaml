base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/007.yaml
  text: You brought Daniel up into the light unharmed[b][a], when he had been thrown to the lions on the ground as food for the beasts through the slanders of envy.
translation:
  language: de
  text: Du hast Daniel unversehrt ans Licht heraufgeführt, nachdem er durch Verleumdungen aus Neid[a] den Löwen auf den Boden[b] geworfen worden war, als Fraß für die wilden Tiere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Anschuldigungen, die aus Neid entstanden waren“. Im Griechischen sind verleumderische Anschuldigungen und Neid eng miteinander verbunden.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier die schwierige Wendung „auf den Boden“. Sie wird beibehalten und nicht an die Danielerzählung angeglichen.
    reason: textual_variant
lexical_decisions:
- source_word: διαβολαῖς φθόνου
  choice: durch Verleumdungen aus Neid
  rationale: διαβολαῖς bezeichnet feindselige, verleumderische Anschuldigungen; der Genitiv φθόνου kennzeichnet Neid als deren Ursprung oder Beweggrund. Die Formulierung wahrt beide Aspekte in natürlichem Deutsch.
- source_word: λέουσι
  choice: den Löwen
  rationale: Der Dativ bezeichnet hier die Tiere, denen Daniel ausgeliefert wurde.
- source_word: κατὰ γῆς
  choice: auf den Boden
  rationale: Die schwierige Ortsangabe wird entsprechend ihrem naheliegenden räumlichen Sinn wiedergegeben und nicht nachträglich an die Danielerzählung angeglichen.
- source_word: ῥιφέντα
  choice: geworfen worden war
  rationale: Das passive Partizip von ῥίπτω bezeichnet ein gewaltsames Werfen; die vorzeitige deutsche Verbform fügt sich natürlich in den Rückblick ein.
- source_word: θηρσὶ βορὰν
  choice: als Fraß für die wilden Tiere
  rationale: βορά bedeutet Fraß oder Nahrung, während θηρσί wilde Tiere bezeichnet. Die Wendung bringt die beabsichtigte Tötung deutlich zum Ausdruck.
- source_word: εἰς φῶς
  choice: ans Licht
  rationale: Die Bildsprache der Rettung aus Todesgefahr bleibt erhalten; „ans Licht“ ist im Deutschen zugleich wörtlich und idiomatisch verständlich.
- source_word: ἀνήγαγες
  choice: hast ... heraufgeführt
  rationale: ἀνάγω bedeutet hinauf- oder heraufführen. Zusammen mit εἰς φῶς bewahrt „heraufgeführt“ sowohl die räumliche Bildlichkeit als auch den Rettungssinn.
- source_word: ἀσινῆ
  choice: unversehrt
  rationale: ἀσινής bezeichnet den Zustand, keinen Schaden erlitten zu haben; „unversehrt“ ist präzise, knapp und würdig.
theological_decisions:
- issue: Anspielung auf Daniels Rettung vor den Löwen
  choice: Die Rettung Daniels wird entsprechend dem griechischen Wortlaut genannt, ohne ausdrücklich eine Löwengrube hinzuzufügen.
  alternative: Die Stelle durch „aus der Löwengrube“ an die bekannte Danielerzählung angleichen.
  rationale: Der griechische Text nennt Daniel, die Löwen und seine unversehrte Rettung ans Licht, aber keine Grube. Die Übersetzung erhält die Anspielung, ohne zusätzliche Einzelheiten einzutragen.
- issue: Schwierige Wendung κατὰ γῆς
  choice: Die Wendung wird zurückhaltend als „auf den Boden“ wiedergegeben und durch eine Fußnote als textlich schwierig gekennzeichnet.
  alternative: Die Wendung auslassen oder sinnglättend als „in die Grube“ wiedergeben.
  rationale: Die überlieferte Formulierung soll weder stillschweigend beseitigt noch mit Einzelheiten der Danielerzählung harmonisiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der direkte Gebetsstil mit „Du“ bleibt erhalten. Die Satzordnung stellt Gottes Rettungshandeln in den Vordergrund, während der Partizipialsatz als verständlicher temporaler Nebensatz wiedergegeben wird.
