  yaml_path: translation/deuterocanon/3_maccabees/006/009.yaml
  text: And now[a], hater of insolence, abundant in mercy, judge of all, quickly appear to the holy ones of Israel’s race, who are being mistreated by the abominable[c][b], lawless nations.
translation:
  language: de
  text: 'Und nun, du Feind des Übermuts, reich an Erbarmen, Richter über alles: Zeige dich[a] schnell den Heiligen aus dem Geschlecht Israels, die von den abscheulichen, gesetzlosen Völkern[b] schändlich misshandelt werden[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erscheine“. Gemeint ist ein sichtbares Eingreifen.'
    reason: lexical_alternative
  - marker: b
    text: „Völker“ bezeichnet hier die nichtisraelitischen Völker; auch „Heiden“ ist dem Zusammenhang nach möglich.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „übermütig misshandelt“ beziehungsweise „entehrend behandelt“. Das griechische Verb bezeichnet eine anmaßende, erniedrigende Misshandlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισόβρι
  choice: du Feind des Übermuts
  rationale: Das seltene Vokativkompositum bezeichnet den, der Hybris, anmaßenden Übermut und gewaltsame Erniedrigung hasst. „Feind des Übermuts“ ist im Deutschen als Anrede natürlicher als „Hasser des Übermuts“ und bewahrt die pointierte Aussage.
- source_word: πολυέλεε
  choice: reich an Erbarmen
  rationale: Das Kompositum bezeichnet überreiches Erbarmen. Die Formulierung ist würdig, verständlich und gibt die Intensität wieder.
- source_word: τῶν ὅλων δίκαστα
  choice: Richter über alles
  rationale: τὰ ὅλα bezeichnet hier die Gesamtheit beziehungsweise alles Seiende. „Richter über alles“ wahrt den universalen Umfang und klingt im Deutschen natürlicher als „Richter von allem“.
- source_word: τάχος
  choice: schnell
  rationale: Das adverbial gebrauchte Substantiv drückt die Bitte um unverzügliches Eingreifen aus.
- source_word: ἐπιφάνηθι
  choice: Zeige dich
  rationale: Der Aoristimperativ in Gebetssprache bittet um ein sichtbar werdendes, rettendes Eingreifen. „Zeige dich“ bringt diese Nuance im Deutschen deutlicher zum Ausdruck als das mögliche „Erscheine“.
- source_word: τοῖς ἁγίοις
  choice: den Heiligen
  rationale: Das substantivierte Adjektiv bezeichnet die Gott Geweihten. „Den Heiligen“ ist knapp und bildet die Form des Griechischen ab; der folgende Zusatz grenzt die Bezeichnung ausdrücklich auf Israel ein.
- source_word: Ἰσραὴλ γένους
  choice: aus dem Geschlecht Israels
  rationale: γένος trägt eine ethnisch-genealogische Bedeutung. „Geschlecht Israels“ erhält diese Abstammungs- und Volkszugehörigkeit, ohne das im heutigen Deutschen missverständliche Wort „Rasse“ zu verwenden.
- source_word: ὑπὸ ἐβδελυγμένων ἀνόμων ἐθνῶν
  choice: von den abscheulichen, gesetzlosen Völkern
  rationale: Beide starken Beschreibungen werden bewahrt. ἔθνη meint im Zusammenhang nichtisraelitische Völker; „Völker“ ist präziser und weniger missverständlich als „Nationen“.
- source_word: ὑβριζομένοις
  choice: die … schändlich misshandelt werden
  rationale: Das Verb bezeichnet eine von Hybris geprägte, entehrende oder gewaltsame Misshandlung. „Schändlich misshandelt“ erhält mehr von dieser Stärke als das allgemeinere „schlecht behandelt“.
theological_decisions:
- issue: Bundesbezogene Bezeichnung τοῖς ἁγίοις für Israel
  choice: den Heiligen aus dem Geschlecht Israels
  alternative: deinem heiligen Volk Israel
  rationale: Die gewählte Fassung bewahrt sowohl das substantivierte „die Heiligen“ als auch die ausdrückliche genealogische Zuordnung. Das Possessiv „dein“ wird nicht ergänzt, da es im griechischen Text fehlt.
- issue: Ethnisch-genealogische Bedeutung von γένος
  choice: Geschlecht Israels
  alternative: Volk Israel
  rationale: „Geschlecht“ wahrt die im Griechischen vorhandene Abstammungsnuance. „Volk“ wäre flüssiger, würde diese jedoch abschwächen.
- issue: Sichtbares göttliches Eingreifen in ἐπιφάνηθι
  choice: Zeige dich
  alternative: Erscheine
  rationale: Die Bitte zielt nicht nur auf Anwesenheit, sondern auf sichtbare Offenbarung in rettendem Handeln. Beide Lesarten bleiben lexikalisch möglich; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die direkte Anrede Gottes und die starken Wertungen des Ausgangstextes bleiben erhalten. Der Doppelpunkt gliedert die Reihe der Vokative von der eigentlichen Bitte; „du“ verdeutlicht im Deutschen die Anredefunktion des seltenen Epithetons.
