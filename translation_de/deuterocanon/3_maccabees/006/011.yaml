base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/011.yaml
  text: Let not the empty-headed bless the empty things over the destruction of those beloved by you[a], saying[c][b], “Not even their God rescued them.”
translation:
  language: de
  text: 'Die Nichtiggesinnten sollen anlässlich des Untergangs der von dir Geliebten nicht die nichtigen Dinge preisen[a] und sagen: »Nicht einmal ihr Gott hat sie gerettet.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die nichtigen Dinge“ kann hier auch „die eitlen Dinge“ oder polemisch „die Götzen“ bedeuten. Im Griechischen besteht ein Wortspiel mit „Nichtiggesinnten“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hat sie befreit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... εὐλογησάτωσαν
  choice: sollen ... nicht ... preisen
  rationale: Der verneinte Imperativ der dritten Person wird als gebetsartiger Jussiv wiedergegeben. „Preisen“ wahrt die Grundbedeutung von εὐλογέω, ohne eine Selbstrühmung einzutragen.
- source_word: τοῖς ματαίοις
  choice: die nichtigen Dinge
  rationale: Die Wiedergabe bleibt allgemein und legt die möglicherweise gemeinten Götzen nicht ausdrücklich fest. Zugleich bewahrt „nichtig“ die Wortverbindung mit ματαιόφρονες. Der griechische Dativ ist ungewöhnlich; die deutsche Form folgt der naheliegenden sachlichen Beziehung zu εὐλογησάτωσαν.
- source_word: οἱ ματαιόφρονες
  choice: die Nichtiggesinnten
  rationale: Die substantivierte Bildung gibt Menschen mit nichtigem oder eitlem Sinn wieder und erhält den beabsichtigten Gleichklang mit ματαίοις. Der leicht gehobene Ausdruck passt zum Gebetsregister.
- source_word: ἐπὶ τῇ τῶν ἠγαπημένων σου ἀπωλείᾳ
  choice: anlässlich des Untergangs der von dir Geliebten
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass oder Umstand des Preisens. „Untergang“ bildet ἀπώλεια kräftig ab; „der von dir Geliebten“ erhält den passiven Partizipialausdruck und die direkte Anrede Gottes.
- source_word: Οὐδὲ ὁ θεὸς αὐτῶν ἐρύσατο αὐτούς
  choice: Nicht einmal ihr Gott hat sie gerettet
  rationale: Οὐδέ wird mit „nicht einmal“ betont wiedergegeben. „Gerettet“ ist gegenwärtiges, klares Deutsch für ῥύομαι; „befreit“ bleibt als mögliche Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Bezeichnet τοῖς ματαίοις ausdrücklich Götzen?
  choice: 'allgemein: „die nichtigen Dinge“'
  alternative: „die Götzen“
  rationale: μάταια kann in jüdischer Polemik Götzen bezeichnen, doch der Vers nennt sie nicht ausdrücklich. Die allgemeinere Formulierung erhält diese Möglichkeit, ohne sie zur einzig möglichen Deutung zu machen.
translation_notes:
  register: Gehobenes, aber verständliches Gebetsdeutsch. „Nichtiggesinnten“ ist bewusst als kompakte, leicht ungewohnte Bildung gewählt, um das griechische Wortspiel mit „nichtigen Dingen“ zu bewahren. Die Satzstellung bleibt klar und lässt die spöttische Schlussrede deutlich hervortreten.
