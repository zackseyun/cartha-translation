  terminology: „Verderben“, „zum Fraß für die Vögel“, „Scham“ und „feuerschnaubende Dreistigkeit“ geben die Begriffe und die negative Bildsprache treffend wieder. Die Fußnote zu b benötigt lediglich eine formale Korrektur ihres einleitenden Anführungszeichens.
