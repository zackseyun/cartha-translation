base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/034.yaml
  text: And those who had previously been reckoning them for destruction and to be devoured by birds[a], and had registered them with joy, groaned deeply, clothing themselves with shame[b], and their fire-breathing boldness was vigorously quenched.
translation:
  language: de
  text: Und diejenigen, die sie zuvor als zum Verderben und zum Fraß für die Vögel bestimmt angesehen und sie mit Freude registriert hatten[a], stöhnten tief auf, hüllten sich in Scham und erstickten entschlossen ihre feuerschnaubende Dreistigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung ist im Text Swetes textlich und syntaktisch schwierig. Aus dem weiteren Satz ergibt sich jedoch klar, dass diese Menschen die Juden zuvor als zum Verderben und als Fraß für die Vögel bestimmt ansahen.
    reason: textual_variant
  - marker: b
    text: 'Oder: „feurige Verwegenheit“. Das griechische Bild ist metaphorisch und hat im Zusammenhang einen deutlich negativen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε πρὶν
  choice: Und die, die sie zuvor
  rationale: Gibt den zeitlichen Rückblick und den Kontrast zur eingetretenen Wendung in natürlichem Deutsch wieder.
- source_word: εἰς ὄλεθρον καὶ οἰωνόβρωτους αὐτοὺς ἐξεσθιέμενοι
  choice: die sie zuvor als zum Verderben und zum Fraß für die Vögel bestimmt angesehen hatten
  rationale: Die überlieferte Formulierung ist textlich und syntaktisch schwierig. Die Übersetzung wahrt deshalb den aus dem Zusammenhang sicheren Sinn einer früheren Einschätzung ihres Schicksals, ohne eine unsichere Textrekonstruktion vorauszusetzen.
- source_word: ἀπογραφάμενοι
  choice: sie … hatten registrieren lassen
  rationale: Bewahrt den amtlich-bürokratischen Sinn der Erfassung; die kausative deutsche Form passt dazu, dass die Betreffenden die Registrierung veranlassten beziehungsweise betrieben.
- source_word: μετὰ χαρᾶς
  choice: mit Freude
  rationale: Direkte und idiomatische Wiedergabe der feindseligen Freude an der Registrierung.
- source_word: κατεστέναξαν
  choice: stöhnten tief auf
  rationale: Der verstärkende Präfix wird durch „tief“ ausgedrückt; „aufstöhnen“ ist im Deutschen natürlich.
- source_word: αἰσχύνην ἐφʼ ἑαυτοῖς περιβαλόμενοι
  choice: hüllten sich in Scham
  rationale: Erhält das griechische Bild der Scham als Gewand oder Umhüllung.
- source_word: πυρόπνουν τόλμαν
  choice: feuerschnaubende Dreistigkeit
  rationale: „Feuerschnaubend“ bewahrt das kraftvolle Bild; „Dreistigkeit“ bringt den im Zusammenhang negativen Sinn von τόλμα zum Ausdruck.
- source_word: ἀκμαίως ἐσβεσμένοι
  choice: war mit Macht ausgelöscht worden
  rationale: „Ausgelöscht“ führt die Feuermetapher fort, während „mit Macht“ die kräftige, nachdrückliche Bedeutung von ἀκμαίως wiedergibt, ohne sie fälschlich als bloße Vollständigkeit zu deuten.
