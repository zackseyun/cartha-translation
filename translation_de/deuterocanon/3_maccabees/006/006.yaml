base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/006.yaml
  text: You rescued the three companions in Babylonia[a], who had willingly given up their lives to the fire so as not to worship empty things; after cooling the blazing furnace, you delivered them all unharmed[b], and sent a flame upon all their adversaries.
translation:
  language: de
  text: Du hast die drei Gefährten in Babylonien gerettet, die freiwillig ihr Leben dem Feuer preisgegeben hatten, um die leeren Dinge[a] nicht zu verehren; nachdem du den glühenden Feuerofen gekühlt und eine Flamme auf alle ihre Widersacher gesandt hattest, rettetest du sie alle bis auf das letzte Haar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den „leeren Dingen“ sind falsche Gegenstände der Verehrung gemeint; möglich wäre auch „die nichtigen Dinge“, deutender „Götzen“.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „bis zum Haar“ – also so, dass nicht einmal ein Haar verloren ging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑταίρους
  choice: Gefährten
  rationale: Das Wort bezeichnet Gefährten oder Verbundene. „Gefährten“ bewahrt die erzählerische Anspielung, ohne die drei Männer namentlich zu identifizieren.
- source_word: πυρὶ τὴν ψυχὴν αὐθαιρέτως δεδωκότας
  choice: die freiwillig ihr Leben dem Feuer preisgegeben hatten
  rationale: ψυχή bezeichnet hier das Leben beziehungsweise die eigene Person; αὐθαιρέτως hebt die freie Bereitschaft hervor. „Preisgeben“ drückt die bewusste Auslieferung an tödliche Gefahr natürlich aus.
- source_word: τοῖς κενοῖς
  choice: die leeren Dinge
  rationale: Die substantivierte Form bedeutet wörtlich „die leeren/nichtigen Dinge“. Die ungewöhnliche Formulierung erhält die polemische Charakterisierung falscher Kultobjekte, ohne sie ausdrücklich als „Götzen“ auszulegen.
- source_word: διάπυρον ... κάμινον
  choice: den glühenden Ofen
  rationale: διάπυρος bezeichnet etwas völlig Durchglühtes oder heftig Brennendes. „Glühender Ofen“ ist im Deutschen klar und bildkräftig.
- source_word: δροσίσας
  choice: du kühltest
  rationale: Das Partizip bezeichnet das Kühlen beziehungsweise das Schaffen tauartiger Erfrischung. Die finite Wiedergabe ordnet die Handlung natürlich in die Satzfolge ein.
- source_word: ἐρρύσω μέχρι τριχὸς ἁπάντων
  choice: rettetest sie alle bis aufs letzte Haar
  rationale: Die wörtliche Wendung „bis zum Haar“ betont die vollständige Bewahrung. „Bis aufs letzte Haar“ erhält dieses konkrete Bild und ist im Deutschen verständlich.
- source_word: φλόγα πᾶσιν ἐπιπέμψας τοῖς ὑπεναντίοις
  choice: während du eine Flamme über alle ihre Widersacher sandtest
  rationale: φλόξ ist „Flamme“, ὑπεναντίοι bezeichnet feindlich Gegenüberstehende. „Widersacher“ passt zum gehobenen Gebetsstil; „während“ gibt das begleitende Partizip wieder, ohne eine streng zeitliche Reihenfolge festzulegen.
- source_word: κατὰ τὴν Βαβυλωνίαν
  choice: in Babylonien
  rationale: Die Präpositionalfügung lokalisiert die Begebenheit; „in Babylonien“ ist die direkte und natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Anspielung auf die drei Männer im Feuerofen
  choice: Die Anspielung bleibt mit „drei Gefährten“ unausgeführt.
  alternative: Ihre Namen nennen oder sie ausdrücklich als „drei junge Männer“ bezeichnen.
  rationale: Der griechische Text setzt die Erzählung als bekannt voraus und nennt weder Namen noch eine Altersbezeichnung. Die Übersetzung harmonisiert daher nicht mit ausführlicheren Fassungen der Danielüberlieferung.
- issue: Deutung von τοῖς κενοῖς
  choice: Wörtlich „die leeren Dinge“.
  alternative: „Götzen“, „nichtige Götter“ oder „Götzenbilder“.
  rationale: Gemeint sind falsche Verehrungsobjekte, doch der Ausgangstext verwendet nicht das übliche Wort für Götzen. Die wörtliche Wiedergabe bewahrt seine theologische Polemik und die sprachliche Offenheit.
- issue: Verhältnis der abschließenden Partizipialhandlung zur Rettung
  choice: „während du ... sandtest“ lässt Begleitung beziehungsweise Gleichzeitigkeit zu.
  alternative: „und sandtest“, als bloße koordinierte Folge.
  rationale: Das aoristische Partizip ἐπιπέμψας kann kontextuell verschieden auf das Hauptverb bezogen werden. Die Übersetzung vermeidet eine unnötig genaue zeitliche Festlegung.
translation_notes:
  register: Moderner, würdevoller Gebetsstil mit direkter Anrede. Der lange griechische Satz bleibt als zusammenhängende Anrufung erhalten; seltenere Wörter wie „Widersacher“ entsprechen dem feierlichen Kontext, ohne altertümliche Verbformen zu verwenden.
