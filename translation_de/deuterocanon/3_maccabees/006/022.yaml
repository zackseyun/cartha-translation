  yaml_path: translation/deuterocanon/3_maccabees/006/022.yaml
  text: And the king’s anger was turned into grief and tears over those things that had previously been devised before him[a].
translation:
  language: de
  text: Da verwandelte sich der Zorn des Königs in Mitleid und Tränen über das, was er zuvor geplant hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über das, was zuvor vor ihm ausgeheckt worden war“. Die knappe griechische Formulierung lässt offen, ob der König selbst die früheren Pläne gefasst hatte oder ob sie in seiner Gegenwart beziehungsweise vor ihm ausgearbeitet worden waren.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: μετεστράφη
  choice: verwandelte sich
  rationale: Das Passiv bezeichnet einen tiefgreifenden Umschwung des Zorns; im Deutschen gibt das reflexive Verb diesen Vorgang natürlich wieder, ohne einen Verursacher hinzuzufügen.
- source_word: ἡ ὀργή
  choice: der Zorn
  rationale: „Zorn“ ist die übliche, dem würdigen Erzählstil entsprechende Wiedergabe von ὀργή.
- source_word: εἰς οἶκτον καὶ δάκρυα
  choice: in Mitleid und Tränen
  rationale: οἶκτος bezeichnet vor allem Mitleid beziehungsweise Erbarmen. „Mitleid und Tränen“ bewahrt den Gegensatz zum Zorn und die mitfühlende Trauer, ohne οἶκτος auf bloße Trauer zu verengen.
- source_word: ὑπὲρ
  choice: über
  rationale: ὑπέρ bezeichnet hier den Gegenstand beziehungsweise Anlass der mit Tränen verbundenen Gemütsbewegung; „über“ ist dafür im Deutschen idiomatisch.
- source_word: τῶν ἔμπροσθεν αὐτῷ μεμηχανευμένων
  choice: das, was er zuvor geplant hatte
  rationale: Das substantivierte Partizip bezeichnet die zuvor ausgedachten Maßnahmen oder Pläne. αὐτῷ wird als Dativ des Handelnden zum perfektischen Partizip verstanden und deshalb mit „er“ wiedergegeben; die grammatisch mögliche abweichende Zuordnung wird in der Fußnote offengehalten.
