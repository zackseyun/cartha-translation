translation_notes:
  register: Moderne, würdige Erzählsprache. „Mitleid“ gibt οἶκτος genauer wieder als „Trauer“; „geplant“ vermeidet den stärkeren verschwörerischen Beiklang von „ausgeheckt“ im Haupttext.
