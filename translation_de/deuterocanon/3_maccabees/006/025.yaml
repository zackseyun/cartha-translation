  yaml_path: translation/deuterocanon/3_maccabees/006/025.yaml
  text: Who was it that removed each one from the secure strongholds of our homeland and household[a], where they had held us in faith[b], and gathered them here without reason?
translation:
  language: de
  text: Wer hat die Männer, die in Treue[a] die Befestigungen unseres Landes hielten, aus ihren Häusern geholt und jeden Einzelnen ohne Grund hier zusammengebracht?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Vertrauen«, »zuverlässig« oder möglicherweise »in Sicherheit«. Der griechische Ausdruck ἐν πίστει ist hier nicht eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Satzbau ist schwierig. Die Hauptfassung versteht die Männer als solche, die die Befestigungen unseres Landes zuverlässig hielten und aus ihren Häusern geholt wurden. ἡμῶν kann jedoch auch zu κρατήσαντας gehören: Dann wäre der Sinn etwa »die uns in Treue festhielten«. Auch die genaue Zuordnung von τῆς οἰκίας ist unsicher.'
    reason: textual_difficulty
lexical_decisions:
- source_word: τίς
  choice: Wer
  rationale: Leitet eine rhetorische Frage ein; die schlichte deutsche Frageform bewahrt ihre unmittelbare Schärfe.
- source_word: τοὺς κρατήσαντας
  choice: die Männer, die … hielten
  rationale: Das substantivierte Partizip bezeichnet eine Personengruppe. κρατέω kann hier das Innehaben oder Behaupten befestigter Orte ausdrücken; „hielten“ wahrt diese Offenheit besser als das stärker deutende „verteidigten“.
- source_word: ἐν πίστει
  choice: in Treue
  rationale: πίστις bezeichnet hier wahrscheinlich Verlässlichkeit oder Loyalität, nicht ausdrücklich den Glauben als theologischen Begriff. „In Treue“ bleibt lexikalisch nah und im Zusammenhang verständlich; andere Nuancen werden in der Fußnote genannt.
- source_word: τὰ τῆς χώρας ὀχυρώματα
  choice: die Befestigungen unseres Landes
  rationale: ὀχυρώματα sind befestigte beziehungsweise gesicherte Orte. „Befestigungen“ gibt das konkrete militärische Bild wieder; χώρα bezeichnet das Land.
- source_word: τῆς οἰκίας ἀποστήσας
  choice: aus ihren Häusern geholt
  rationale: Der Genitiv kann die Trennung vom Haus oder Zuhause bezeichnen. Der griechische Singular lässt sich im Deutschen bei mehreren Betroffenen natürlich distributiv als „aus ihren Häusern“ wiedergeben. „Geholt“ vermeidet eine unnötige Festlegung auf gewaltsames Vertreiben.
- source_word: ἕκαστον
  choice: jeden Einzelnen
  rationale: Bewahrt die distributive und individualisierende Aussage des griechischen Singulars.
- source_word: ἀλόγως
  choice: ohne Grund
  rationale: Das Adverb bezeichnet ein unvernünftiges oder nicht zu rechtfertigendes Handeln. „Ohne Grund“ gibt den vorwurfsvollen Sinn idiomatisch wieder.
- source_word: ἤθροισεν ἐνθάδε
  choice: hier zusammengebracht
  rationale: ἀθροίζω bedeutet versammeln oder zusammenführen; ἐνθάδε verweist ausdrücklich auf den gegenwärtigen Ort.
theological_decisions:
- issue: Bedeutung von πίστις außerhalb eines ausdrücklich theologischen Zusammenhangs
  choice: in Treue
  alternative: im Vertrauen; zuverlässig; im Glauben
  rationale: Der Zusammenhang betrifft offenbar die verlässliche Wahrnehmung einer Aufgabe. „In Treue“ bewahrt die Nähe zu πίστις, ohne dem Satz eine nicht erkennbare lehrmäßige Aussage über Glauben aufzuzwingen.
- issue: Schwierige Zuordnung von ἡμῶν und τῆς οἰκίας
  choice: ἡμῶν sinngemäß auf das Land beziehen und τῆς οἰκίας als Ausgangspunkt der Wegnahme verstehen
  alternative: „die uns in Treue festhielten“ beziehungsweise eine Verbindung von οἰκία mit den Befestigungen
  rationale: Die griechische Wortstellung ist gedrängt und mehrdeutig. Die gewählte Fassung ergibt eine kohärente Aussage, während die Fußnote die Unsicherheit ausdrücklich festhält und keine textliche Rekonstruktion als sicher ausgibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt direkt; militärische und räumliche Bilder werden konkret wiedergegeben. Wegen des schwierigen griechischen Satzbaus wird der Haupttext verständlich formuliert, die verbleibende Mehrdeutigkeit jedoch in den Fußnoten offengelegt.
