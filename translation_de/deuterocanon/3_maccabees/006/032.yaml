base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/032.yaml
  text: And when they had ended their utterly mournful song of lamentation[a], they took up the song of their fathers, praising God, the savior of Israel and worker of wonders; and having cast off every cry of grief and wailing[b], they formed dances as a sign of peaceful rejoicing.
translation:
  language: de
  text: Nachdem sie aber das von Klagen erfüllte, tieftraurige Lied beendet hatten, stimmten sie das Lied ihrer Väter[a] an und priesen Gott, den Retter Israels und Wundertäter. Alles Wehgeschrei und Jammern wiesen sie von sich und bildeten Reigen[b] als Zeichen friedlicher Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr überliefertes Lied“. Das griechische Wort bezeichnet etwas, das von den Vätern stammt oder zur Tradition der Vorfahren gehört.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann Reigentänze, Tanzgruppen oder auch Chöre bezeichnen; der Zusammenhang festlicher Freude spricht hier für Reigen.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: καταλήξαντες
  choice: Nachdem sie ... beendet hatten
  rationale: Der Aoristpartizip bezeichnet eine Handlung, die dem Aufnehmen des neuen Liedes vorausgeht; die deutsche Nebensatzkonstruktion gibt diese zeitliche Abfolge natürlich wieder.
- source_word: θρήνων πανόδυρτον μέλος
  choice: das von Klagen erfüllte, tieftraurige Lied
  rationale: μέλος bezeichnet ein Lied oder eine Melodie, θρήνων stellt den Bezug zu Klagen her, und πανόδυρτον verstärkt den Ausdruck äußerster Trauer. Die Formulierung bewahrt sowohl das musikalische Bild als auch die Intensität.
- source_word: ἀνέλαβον
  choice: stimmten ... an
  rationale: Bei einem Lied bezeichnet das Verb hier dessen Aufnahme oder Beginn; „anstimmen“ ist im Deutschen idiomatisch und präzise.
- source_word: ᾠδὴν πάτριον
  choice: das Lied ihrer Väter
  rationale: πάτριος bezeichnet etwas von den Vätern Überliefertes oder zur väterlichen Tradition Gehörendes. Die Wendung bewahrt den familiär-geschichtlichen Klang.
- source_word: σωτῆρα
  choice: Retter
  rationale: σωτήρ bezeichnet den, der rettet oder befreit. „Retter“ ist direkt, verständlich und im Deutschen weniger traditionsgebunden als mögliche Alternativen.
- source_word: τερατοποιὸν
  choice: Wundertäter
  rationale: Das Kompositum bezeichnet jemanden, der Wunder oder außergewöhnliche Zeichen wirkt. „Wundertäter“ gibt dies knapp und würdig wieder.
- source_word: αἰνοῦντες
  choice: priesen
  rationale: Das Partizip beschreibt ihr lobendes Singen; „priesen“ entspricht dem doxologischen Ton und fügt sich natürlich in den deutschen Satz.
- source_word: οἰμωγὴν ... πᾶσαν καὶ κωκυτὸν
  choice: alles Wehgeschrei und Jammern
  rationale: Beide Wörter bezeichnen hörbare Äußerungen tiefen Schmerzes. Die deutsche Paarung erhält die emotionale Stärke, ohne unnötig zu überzeichnen.
- source_word: ἀπωσάμενοι
  choice: wiesen sie von sich
  rationale: Das Medium drückt ein entschlossenes Abweisen oder Ablegen aus. „Von sich weisen“ bewahrt diese aktive Bedeutung.
- source_word: χοροὺς συνίσταντο
  choice: bildeten Reigen
  rationale: χορός kann einen Chor, eine Tanzgruppe oder einen Reigentanz bezeichnen; der festliche Zusammenhang begünstigt eine tänzerische Auffassung. „Reigen“ lässt zugleich die geordnete Gruppenform erkennen.
- source_word: εὐφροσύνης εἰρηνικῆς σημεῖον
  choice: als Zeichen friedlicher Freude
  rationale: 'Die Wiedergabe erhält alle drei Bestandteile: σημεῖον als Zeichen, εὐφροσύνη als Freude und εἰρηνικός als friedlich.'
theological_decisions:
- issue: Bezug von „Retter Israels und Wundertäter“
  choice: Beide Titel beziehen sich auf Gott.
  alternative: Die Titel freier als „der Israel befreit und Wunder wirkt“ wiederzugeben.
  rationale: Die griechische Apposition τὸν Ἰσραὴλ σωτῆρα καὶ τερατοποιὸν ... θεόν identifiziert Gott unmittelbar als Retter Israels und Wundertäter. Die substantivische Wiedergabe wahrt die Form, ohne zusätzliche Lehraussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit leicht gegliedert; die Abfolge von Klage, überliefertem Lobgesang und friedlicher Festfreude sowie die Mehrdeutigkeit von χορός bleiben erhalten.
