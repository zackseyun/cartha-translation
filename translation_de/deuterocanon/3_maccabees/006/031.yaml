base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/031.yaml
  text: Then those who had formerly been disgraced and were near Hades—or rather[a], had already stepped onto it—in place of a bitter and hard-to-drink fate, prepared a saving drinking-bout, divided up as dining-couches, full of joy[c][b], the place prepared for them for downfall and a grave.
translation:
  language: de
  text: Da richteten jene, die zuvor geschmäht worden waren und dem Hades nahe gewesen waren[a] – ja vielmehr schon den Fuß auf ihn gesetzt hatten[b] –, anstelle eines bitteren, schwer zu trinkenden Verhängnisses ein rettendes Trinkgelage[c] aus. Voller Freude teilten sie den Ort, der für ihren Untergang und als ihr Grab vorbereitet worden war, in Mahlgemeinschaften ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Tod nahe gewesen waren« beziehungsweise »dem Grab nahe gewesen waren«; im Griechischen steht »dem Hades nahe«.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich ist davon die Rede, dass sie den Fuß auf den Hades gesetzt hatten – ein eindringliches Bild dafür, dass sie so gut wie tot gewesen waren.
    reason: cultural_note
  - marker: c
    text: Das griechische Wort kann ein Trinkgelage oder allgemeiner ein festliches Gelage bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπονείδιστοι
  choice: die zuvor geschmäht worden waren
  rationale: Gibt den Zustand öffentlicher Schmach verständlich wieder, ohne ihn auf ein bloß inneres Schamgefühl zu verengen.
- source_word: πλησίον τοῦ ᾅδου
  choice: dem Hades nahe
  rationale: Bewahrt die ausdrückliche Nennung des Hades als Totenreich und damit das Bild des griechischen Textes.
- source_word: ἐπʼ αὐτῷ βεβηκότες
  choice: schon den Fuß auf ihn gesetzt hatten
  rationale: 'Erhält das anschauliche Bild des Perfektpartizips von βαίνω: Sie waren dem Tod nicht nur nahe, sondern gleichsam bereits in sein Gebiet getreten.'
- source_word: μόρου
  choice: Todesloses
  rationale: Verbindet den Schicksals- beziehungsweise Verhängnischarakter von μόρος mit dem im Kontext eindeutig drohenden Tod.
- source_word: πικροῦ καὶ δυσαπότικου
  choice: bitteren, schwer zu trinkenden
  rationale: Bewahrt die Trinkmetapher, die unmittelbar auf das folgende κῶθων vorbereitet.
- source_word: κῶθωνα σωτήριον
  choice: ein rettendes Trinkgelage
  rationale: Im Zusammenhang mit den anschließenden Lagerplätzen bezeichnet κῶθων am ehesten ein festliches Trinkgelage; σωτήριον kennzeichnet es als Feier erfahrener Rettung.
- source_word: συστησάμενοι
  choice: richteten ... aus
  rationale: Gibt die mediale Bedeutung eines von ihnen selbst veranstalteten Festes in natürlichem Deutsch wieder.
- source_word: εἰς πτῶσιν αὐτοῖς καὶ τάφον ἡτοιμασμένον
  choice: der für ihren Untergang und als ihr Grab vorbereitet worden war
  rationale: Bewahrt die doppelte Bestimmung des Ortes zur Vernichtung und zum Grab, formuliert sie aber idiomatisch.
- source_word: κλισίας κατεμέρισαν
  choice: teilten ... in Lagerplätze für das Festmahl ein
  rationale: κλισία bezeichnet hier Plätze zum gelagerten Essen. Die Formulierung macht die Umwidmung des vorgesehenen Todesortes in einen Festplatz verständlich.
- source_word: πλήρεις χαρμονῆς
  choice: Voller Freude
  rationale: Gibt die emotionale Umkehr knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von ᾅδης
  choice: Hades
  alternative: Tod; Grab; Totenreich
  rationale: Der griechische Text nennt ausdrücklich den Hades. Die Beibehaltung wahrt das Bild vom Bereich der Toten, ohne es auf eine bestimmte spätere Lehre über das Jenseits festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert; die Umkehr vom vorgesehenen Todesort zum Festplatz sowie die miteinander verbundenen Trinkbilder bleiben erhalten.
