    issue: κλισίας als »Lagerplätze für das Festmahl«
    rationale: κλισίαι meint in diesem Mahlkontext gelagerte Tisch- bzw. Mahlgemeinschaften. Die Formulierung mit »Lagerplätzen« verschiebt den Akzent auf räumliche Plätze statt auf die Gruppenordnung beim Festmahl.
