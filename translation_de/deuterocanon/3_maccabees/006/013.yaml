base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/013.yaml
  text: But let the nations cower today before your invincible power[a], O honored one, having power for the salvation of the race of Jacob.
translation:
  language: de
  text: Doch die Völker sollen heute vor deiner unbesiegbaren Macht zurückschrecken, du Hochgeehrter, der du die Macht hast, das Geschlecht Jakobs[a] zu retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Volk Jakobs“; das griechische γένος kann eine Abstammungslinie, eine Sippe oder ein von einem gemeinsamen Vorfahren abstammendes Volk bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτηξάτω
  choice: sollen ... zurückschrecken
  rationale: Der Aoristimperativ bezeichnet ein angstvolles Zurückweichen. „Zurückschrecken“ gibt sowohl die Furcht als auch die Bewegung des Zurückweichens in natürlichem Deutsch wieder.
- source_word: ἔθνη
  choice: die Völker
  rationale: Gemeint sind hier die Völker ringsum; „Völker“ vermeidet eine unnötige Festlegung auf den theologisch stärker markierten Begriff „Heiden“.
- source_word: σὴν δύναμιν ἀνίκητον
  choice: deiner unbesiegbaren Macht
  rationale: δύναμις bezeichnet Macht oder Kraft, ἀνίκητος das Unbesiegbare. Die Formulierung ist eng am Griechischen und zugleich idiomatisch.
- source_word: σήμερον
  choice: heute
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: ἔντιμε
  choice: du Hochgeehrter
  rationale: Der substantivierte Vokativ bezeichnet den Angeredeten als geehrt oder hoch angesehen. Die ungewöhnliche direkte Anrede Gottes bleibt erhalten, ohne einen im Griechischen fehlenden Gottesnamen oder Titel einzufügen.
- source_word: δυνάμεις ἔχων
  choice: der du die Macht hast
  rationale: Die partizipiale Aussage wird als deutscher Relativsatz wiedergegeben. Dadurch bleibt sie an die Anrede gebunden, ohne ausdrücklich einen im Partizip nicht markierten Kausalsinn einzuführen.
- source_word: ἐπὶ σωτηρίαν
  choice: zu retten
  rationale: Die Präposition mit Akkusativ bezeichnet hier Ziel oder Zweck. Die verbale Wiedergabe ist im Deutschen natürlicher und bewahrt den Rettungssinn von σωτηρία.
- source_word: Ἰακὼβ γένους
  choice: das Geschlecht Jakobs
  rationale: γένος kann die von einem gemeinsamen Vorfahren abstammende Linie, Sippe oder das entsprechende Volk bezeichnen. „Geschlecht Jakobs“ bewahrt den Abstammungsbezug und das gehobene Gebetsregister.
theological_decisions:
- issue: Göttliche Anrede ἔντιμε
  choice: du Hochgeehrter
  alternative: du Verehrter; du Hochangesehener
  rationale: Der griechische Text gebraucht keinen üblichen Gottestitel, sondern ein ehrendes Adjektiv als direkte Anrede. Die Übersetzung bewahrt diese auffällige Form, statt sie etwa zu „Herr“ zu normalisieren.
- issue: Bezug von δυνάμεις ἔχων
  choice: der du die Macht hast
  alternative: weil du die Macht hast; im Besitz von Kräften
  rationale: Der Relativsatz gibt das Partizip wieder, ohne dessen Verhältnis zur Bitte ausdrücklich kausal festzulegen. Der Plural δυνάμεις kann „Kräfte/Machtmittel“ heißen, wird hier aber im Deutschen kollektiv als „Macht“ ausgedrückt.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die Satzstruktur bleibt gehoben, ist aber für heutige Leser verständlich. Die ungewöhnliche Anrede Gottes und die mögliche Bedeutungsbreite von γένος werden nicht konfessionell oder dogmatisch vereindeutigt.
