    rationale: Das griechische ἐξιστάνειν τὸν ... νοῦν bezeichnet das Abbringen des Königs von seinem gefassten Plan. Im Deutschen ist „ihn von dem Anschlag abzubringen“ die natürliche Konstruktion; die Bedeutung bleibt dabei erhalten.
  - severity: low
    issue: „im Gefolge des Königs“ ist enger als die griechische Kreisbezeichnung
    rationale: οἱ περὶ τὸν βασιλέα meint den Personenkreis um den König, nicht notwendigerweise ein Gefolge. „Ältesten um den König“ bildet dies direkter ab.
