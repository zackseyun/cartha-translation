lexical_decisions:
- source_word: ἀνεστρέφετο
  choice: hielt sich … auf
  rationale: Das Medium bezeichnet hier ein fortgesetztes Sich-Aufhalten beziehungsweise Bewegen bei anderen; die Wiedergabe bleibt natürlich und vermeidet eine unbelegte genauere Handlung.
- source_word: οἱ περὶ τὸν βασιλέα πρεσβύτεροι
  choice: die Ältesten im Gefolge des Königs
  rationale: Die Wendung οἱ περὶ bezeichnet den Personenkreis um den König; πρεσβύτεροι wird formal als „Älteste“ wiedergegeben, ohne sie enger als Ratgeber oder Amtsträger festzulegen.
- source_word: ἀγέρωχον … νοῦν
  choice: seinen hochmütigen Sinn
  rationale: ἀγέρωχος bezeichnet hier eine stolze, überhebliche Haltung; „Sinn“ bewahrt den Bezug auf νοῦς und den würdevollen Erzählton.
- source_word: ἐντεθυμημένης ἐπιβουλῆς
  choice: dem Anschlag, den er gefasst hatte
  rationale: ἐπιβουλή bezeichnet einen feindseligen Plan oder Anschlag; das Partizip von ἐνθυμέομαι drückt aus, dass der König diesen innerlich beschlossen hatte.
