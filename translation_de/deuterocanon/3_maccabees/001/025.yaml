  text: And the multitude, as before, kept on with these men, pleading; but the elders around the king were trying in many ways to turn his arrogant mind away from the plot he had conceived.
translation:
  language: de
  text: Die Menge blieb wie zuvor bei ihnen und flehte; die Ältesten um den König aber versuchten auf vielerlei Weise, ihn von dem Anschlag abzubringen, den er gefasst hatte.
