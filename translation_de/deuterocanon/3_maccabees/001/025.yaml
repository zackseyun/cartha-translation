  source_fidelity: 'Der Entwurf gibt die zentralen Elemente zutreffend wieder: die fortdauernde Haltung der Menge, ihr Flehen, die Ältesten im Kreis des Königs, deren vielfältige Bemühungen sowie den hochmütigen Sinn und den zuvor gefassten Anschlag. Die Formulierung „seinen hochmütigen Sinn von dem Anschlag abzubringen“ verschiebt jedoch die Konstruktion im Deutschen: Abgebracht wird der König, nicht sein Sinn. Die Revision gibt ἐξιστάνειν ... τῆς ἐντεθυμημένης ἐπιβουλῆς idiomatisch wieder, ohne den Sinn einzuengen.'
  naturalness: „Sich bei diesen Männern aufhalten“ ist verständlich, wirkt hier jedoch etwas schwerfällig. „Bei ihnen bleiben“ ist modernes, natürliches Deutsch und wahrt die im griechischen Demonstrativpronomen enthaltene kontextabhängige Bezugnahme. Die Umstellung zu „ihn ... abzubringen“ behebt zudem eine idiomatische Unstimmigkeit.
  terminology: „Ältesten um den König“, „hochmütiger Sinn“ und „Anschlag“ sind angemessene, registergerechte Wiedergaben von πρεσβύτεροι, ἀγέρωχος νοῦς und ἐπιβουλή. „Um den König“ entspricht οἱ περὶ τὸν βασιλέα unmittelbarer als „im Gefolge des Königs“, ohne eine bestimmte amtliche Rolle zu behaupten.
  issues:
