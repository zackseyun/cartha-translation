revisions:
- from: Die Menge hielt sich wie zuvor bei diesen Männern auf und flehte. Die Ältesten im Gefolge des Königs aber versuchten auf vielerlei Weise, seinen hochmütigen Sinn von dem Anschlag abzubringen, den er gefasst hatte.
  to: Die Menge blieb wie zuvor bei ihnen und flehte; die Ältesten um den König aber versuchten auf vielerlei Weise, ihn von dem Anschlag abzubringen, den er gefasst hatte.
  rationale: Die Revision verbessert die deutsche Idiomatik und die unmittelbare Entsprechung zur griechischen Personenbezeichnung, ohne zusätzliche historische oder theologische Deutung einzutragen. Das anaphorische „ihnen“ bewahrt die durch τούτοις vorausgesetzte Kontextbindung.
