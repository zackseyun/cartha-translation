base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/011.yaml
  text: But when some said that this ought not to be done[a], because not even the Gentiles enter, nor all the priests, but only the high priest who is over all—and he only once a year—he would not be persuaded at all.
translation:
  language: de
  text: Als aber einige sagten, dies dürfe nicht geschehen[a], weil weder die Nichtjuden noch alle Priester hineingehen, sondern nur der Hohepriester, der allen vorsteht – und dieser nur einmal im Jahr –, ließ er sich keineswegs überzeugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es sei nicht angemessen, dass dies geschieht.« Das griechische Wort hebt hervor, was sich gehört oder angemessen ist.'
    reason: Lexikalische Alternative für καθήκειν und dessen Nuance von Angemessenheit beziehungsweise Schicklichkeit; die Formulierung wahrt zugleich γίνεσθαι („geschehen“).
lexical_decisions:
- source_word: μὴ καθήκειν γίνεσθαι τοῦτο
  choice: dies dürfe nicht geschehen
  rationale: καθήκειν bezeichnet hier das Angemessene oder Schickliche; die deutsche Wendung gibt im Kontext zugleich die daraus folgende Unzulässigkeit natürlich wieder. Die Fußnote bewahrt die engere Bedeutungsnuance.
- source_word: τοῖς ἔθνεσιν
  choice: die Nichtjuden
  rationale: Im Zusammenhang mit dem Zugang zum Tempel bezeichnet ἔθνη Menschen außerhalb des jüdischen Volkes. „Nichtjuden“ ist im heutigen Standarddeutsch unmittelbar verständlich.
- source_word: εἰσιέναι
  choice: hineingehen
  rationale: Das Verb bezeichnet das Betreten eines Ortes. „Hineingehen“ lässt den aus dem Kontext erschlossenen räumlichen Bezug natürlich erkennen, ohne eine zusätzliche Erlaubnisformulierung einzutragen.
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: alle Priester
  rationale: Die kollektive Formulierung wahrt den Gegensatz zwischen der gesamten Priesterschaft und dem allein zugangsberechtigten Hohepriester.
- source_word: μόνῳ τῷ προηγουμένῳ πάντων ἀρχιερεῖ
  choice: nur der Hohepriester, der allen vorsteht
  rationale: προηγουμένῳ πάντων bezeichnet den über allen Stehenden beziehungsweise allen Vorstehenden; die Relativkonstruktion ist natürlich und wahrt die ausdrückliche Rangangabe.
- source_word: κατ᾽ ἐνιαυτὸν ἅπαξ
  choice: nur einmal im Jahr
  rationale: Dies gibt die zeitliche Beschränkung idiomatisch und präzise wieder. Das zweite „nur“ verdeutlicht im Deutschen die eigenständige Einschränkung, ohne den Sinn zu erweitern.
- source_word: οὐδαμῶς ἐπείθετο
  choice: ließ er sich keineswegs überzeugen
  rationale: Die mediale/passive Form bezeichnet das Überzeugtwerden; „keineswegs“ bewahrt die emphatische Verneinung οὐδαμῶς, ohne eine weitergehende Motivation zu unterstellen.
theological_decisions:
- issue: Beschränkung des Tempelzugangs
  choice: 'Die Begründung wird als abgestufte Zugangsbeschränkung wiedergegeben: weder Nichtjuden noch die Priester insgesamt, sondern allein der Hohepriester und dieser nur jährlich einmal.'
  alternative: Die Aussage allgemein als rechtliches Verbot wiederzugeben, ohne die kultische Rang- und Zeitbeschränkung deutlich hervortreten zu lassen.
  rationale: Der griechische Text begründet den Einspruch ausdrücklich mit dem eingeschränkten Zugang. Die Übersetzung erhält diese Struktur, ohne spätere kultische oder konfessionelle Deutungen einzutragen.
- issue: Bedeutung von καθήκειν
  choice: Im Haupttext „dürfe nicht geschehen“, mit einer Fußnote zur Nuance des Unangemessenen beziehungsweise Unschicklichen.
  alternative: „Es sei nicht angemessen, dies zu tun.“
  rationale: So bleibt sowohl die praktische Unzulässigkeit im Erzählzusammenhang als auch die genuine Bedeutungsnuance von Angemessenheit sichtbar, ohne beide vollständig gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. „Nichtjuden“ ist allgemein verständlicher als das traditionellere „Heiden“; „Hohepriester“ wahrt die etablierte kultische Bezeichnung. Der Gedankenstrich bildet die nachgestellte jährliche Einschränkung des griechischen Satzes lesbar ab.
