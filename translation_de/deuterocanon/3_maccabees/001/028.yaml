revisions:
- from: Aus dem überaus dichten und angestrengten Schreien, das sich aus den Menschenmengen erhob,[a] entstand ein unbeschreiblicher Lärm.
  to: Aus dem überaus dichten und angestrengten Geschrei der Menschenmengen, das sich zusammenballte, entstand ein unbeschreibliches Getöse.[a]
  rationale: Die Revision ersetzt die im Deutschen unübliche Formulierung „dichtes Schreien“ durch „dichtes ... Geschrei“ und macht mit „das sich zusammenballte“ die Bedeutung von συναγομένης sichtbar. „Getöse“ stellt die Steigerung zu κραυγή deutlicher dar, ohne die absichtliche Überlappung der griechischen Lautbegriffe aufzulösen.
