translation:
  language: de
  text: Aus dem überaus dichten und angestrengten Geschrei der Menschenmengen, das sich zusammenballte, entstand ein unbeschreibliches Getöse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus dem dicht gedrängten, angestrengten Geschrei der Menschenmengen entstand ein unbeschreibliches Getöse.“ Das Griechische häuft ähnlich bedeutende Ausdrücke für lautes öffentliches Rufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πυκνοτάτης
  choice: überaus dichten
  rationale: Der Superlativ von πυκνός verstärkt das Bild eines massierten, aus vielen Stimmen bestehenden Schreiens; „überaus dicht“ bewahrt dieses ungewöhnliche Bild.
- source_word: ἐμπόνου
  choice: angestrengten
  rationale: Das Adjektiv bezeichnet Mühe und Anstrengung; auf das Schreien bezogen vermittelt „angestrengt“ die hörbare Kraftanstrengung natürlich.
- source_word: τῶν ὄχλων
  choice: den Menschenmengen
  rationale: Der Plural ὄχλοι bezeichnet hier versammelte Menschenmengen; die Wiedergabe erhält den Plural und ist im modernen Deutsch eindeutig.
- source_word: συναγομένης
  choice: das sich … erhob
  rationale: Wörtlich wird das Schreien „zusammengebracht“ oder „gesammelt“; im Kontext vieler Stimmen gibt „sich erhob“ idiomatisch wieder, wie es gemeinsam aufkommt und anschwillt.
- source_word: κραυγῆς
  choice: Schreien
  rationale: κραυγή bezeichnet lautes Rufen oder Schreien. Das substantivierte „Schreien“ passt zum kollektiven Vorgang und wahrt die Intensität.
- source_word: ἀνείκαστός
  choice: unbeschreiblicher
  rationale: Das Wort bezeichnet etwas, das sich nicht abbilden, vergleichen oder angemessen vorstellen lässt; „unbeschreiblich“ trifft die überwältigende akustische Wirkung.
- source_word: βοή
  choice: Lärm
  rationale: βοή bezeichnet lautes Rufen, Getöse oder einen Aufruhr. „Lärm“ unterscheidet es im Deutschen vom vorherigen κραυγή und fasst die Gesamtwirkung der Stimmen.
- source_word: τις
  choice: ein
  rationale: Das indefinite τις ist im Deutschen zusammen mit „ein unbeschreiblicher Lärm“ natürlich ausgedrückt; eine mechanische Wiedergabe mit „irgendein“ würde eine sachlich nicht gemeinte Unbestimmtheit nahelegen.
