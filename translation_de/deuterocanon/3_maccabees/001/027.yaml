  yaml_path: translation/deuterocanon/3_maccabees/001/027.yaml
  text: Therefore[a], when those around him saw these things[b], they turned to join our people in calling on the one who has all power to help in the present circumstances and not overlook the lawless and arrogant deed.
translation:
  language: de
  text: 'Als nun auch die, die bei ihm waren, dies sahen, wandten sie sich dazu, gemeinsam mit den Unseren[a] den anzurufen, der alle Macht besitzt: Er möge in der gegenwärtigen Lage[b] beistehen und über die gesetzlose und hochmütige Tat nicht hinwegsehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „mit den Unseren“; wer genau damit gemeint ist, lässt der griechische Text unausgesprochen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Anwesenden beistehen“. Der griechische Ausdruck kann sich auf die gegenwärtigen Umstände oder auf anwesende Personen beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: dies
  rationale: Das griechische Neutrum Plural verweist zusammenfassend auf die zuvor geschilderten Vorgänge; im natürlichen Deutschen erfüllt „dies“ dieselbe rückverweisende Funktion.
- source_word: οἱ περὶ αὐτὸν ὄντες
  choice: die Menschen in seiner Umgebung
  rationale: Die Wendung bezeichnet wörtlich diejenigen, die um ihn waren, ohne ihren Rang genauer festzulegen.
- source_word: θεωροῦντες
  choice: sahen
  rationale: Das Partizip bezeichnet das Wahrnehmen oder Beobachten; „sahen“ ist hier knapp und natürlich.
- source_word: ἐτράπησαν εἰς τὸ ... ἐπικελεῦσθαι
  choice: ließen sie sich dazu bewegen, ... anzurufen
  rationale: Die Konstruktion beschreibt eine Hinwendung zu einer Handlung; „anrufen“ bewahrt den Gebetscharakter von ἐπικελεῖσθαι.
- source_word: σὺν τοῖς ἡμετέροις
  choice: gemeinsam mit den Unseren
  rationale: Die knappe substantivische Wendung „mit den Unseren“ bewahrt den im Griechischen nicht näher bestimmten Bezug besser als eine ausdrückliche Festlegung auf „unser Volk“.
- source_word: τὸν πὰν κράτος ἔχοντα
  choice: den, der alle Macht besitzt
  rationale: Die Übersetzung gibt die beschreibende Gottesbezeichnung unmittelbar wieder, ohne daraus den feststehenden Titel „der Allmächtige“ zu machen.
- source_word: τοῖς παροῦσιν
  choice: in der gegenwärtigen Notlage
  rationale: Der substantivierte Ausdruck kann die gegenwärtigen Umstände oder die Anwesenden bezeichnen. Der Zusammenhang legt die bedrängende aktuelle Lage nahe; „Notlage“ macht deren Krisencharakter verständlich.
- source_word: ἐπαμῦναι
  choice: zu Hilfe kommen
  rationale: Das Verb bedeutet helfen, beistehen oder verteidigen; die gewählte Wendung ist idiomatisch und wahrt die offene Art der erbetenen Hilfe.
- source_word: μὴ περιιδεῖν
  choice: nicht hinwegsehen
  rationale: Das Verb bezeichnet, etwas geschehen zu lassen, zu übergehen oder untätig anzusehen. „Nicht hinwegsehen“ bewahrt sowohl das Bild als auch den moralischen Nachdruck.
- source_word: τὴν ἄνομον καὶ ὑπερήφανον πρᾶξιν
  choice: die gesetzlose und hochmütige Tat
  rationale: „Gesetzlos“ entspricht ἄνομος, „hochmütig“ gibt ὑπερήφανος wieder, und „Tat“ ist eine direkte, würdige Entsprechung für πρᾶξις.
theological_decisions:
- issue: Wiedergabe der Gottesbeschreibung τὸν πὰν κράτος ἔχοντα
  choice: den, der alle Macht besitzt
  alternative: den Allmächtigen
  rationale: Der griechische Text beschreibt Gott durch ein Attribut, statt einen festen Gottesnamen oder Titel zu verwenden. Die Übersetzung wahrt diese Form und Aussage.
- issue: Bezug von σὺν τοῖς ἡμετέροις
  choice: gemeinsam mit den Unseren
  alternative: gemeinsam mit unserem Volk
  rationale: Der Ausdruck lässt die genaue Bezugsgruppe unausgesprochen. Die gewählte Form bewahrt diese Offenheit, während die Alternative den Bezug ausdrücklich auf das jüdische Volk festlegen würde.
- issue: Bezug von τοῖς παροῦσιν
  choice: in der gegenwärtigen Notlage
  alternative: den Anwesenden
  rationale: Die Form kann sachlich die vorliegenden Umstände oder personal die Anwesenden meinen. Im Gebetszusammenhang ist die gegenwärtige Krise wahrscheinlich, doch die Fußnote hält die andere grammatisch mögliche Lesart offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Der Doppelpunkt macht den Inhalt der Anrufung klar, ohne die Infinitivkonstruktion des Griechischen schwerfällig nachzubilden. Unbestimmte Bezüge und die Mehrdeutigkeit von τοῖς παροῦσιν werden nicht stillschweigend beseitigt, sondern durch Fußnoten ausgewiesen.
