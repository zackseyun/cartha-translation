revisions:
- from: Als er aber nach Jerusalem gebracht worden war, dem treuen Gott[a] ein Opfer dargebracht und Dank erwiesen sowie noch etwas Weiteres für den Ort getan hatte[b], ja, als er an den Ort[c] gekommen und von dessen Würde und Frömmigkeit überwältigt worden war,
  to: Nachdem er aber nach Jerusalem gebracht worden war, dem treuen Gott[a] ein Opfer dargebracht und Dank erwiesen sowie noch etwas Weiteres für den Ort getan hatte[b] und dann tatsächlich an den Ort[c] gekommen und von dessen Würde und Frömmigkeit überwältigt worden war,
