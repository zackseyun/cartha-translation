base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/009.yaml
  text: Then[a], after being conveyed to Jerusalem, and after sacrificing to the faithful God and offering thanks, and after doing something further for the place, indeed, when he came to the place and was struck with awe by its dignity and piety[c][b],
translation:
  language: de
  text: Nachdem er aber nach Jerusalem gebracht worden war, dem treuen Gott[a] ein Opfer dargebracht und Dank erwiesen sowie noch etwas Weiteres für den Ort getan hatte[b] und dann tatsächlich an den Ort[c] gekommen und von dessen Würde und Frömmigkeit überwältigt worden war,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem zuverlässigen Gott“. Das griechische Adjektiv bezeichnet Treue oder Vertrauenswürdigkeit.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text lässt unbestimmt, was er darüber hinaus für den Ort tat.
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist der heilige Ort in Jerusalem, wahrscheinlich der Tempelbezirk; im Griechischen steht lediglich „der Ort“.
    reason: cultural_note
lexical_decisions:
- source_word: διακομισθεὶς
  choice: nach Jerusalem gebracht worden war
  rationale: Das passive Partizip bezeichnet eine Beförderung beziehungsweise Überführung an einen anderen Ort und nicht nur eine Ankunft; die deutsche Form bewahrt dieses Passiv, ohne das Reisemittel festzulegen.
- source_word: θύσας
  choice: ein Opfer dargebracht
  rationale: Die Wendung gibt die kultische Opferhandlung idiomatisch und eindeutig wieder.
- source_word: τῷ πιστῷ θεῷ
  choice: dem treuen Gott
  rationale: πιστός bedeutet hier am unmittelbarsten „treu“ beziehungsweise „zuverlässig“. „Treu“ bewahrt die direkte Aussage über Gott, ohne sie zu „wahr“ umzudeuten.
- source_word: χάριτας ἀποδιδοὺς
  choice: Dank erwiesen
  rationale: ἀποδίδωμι bezeichnet das Erstatten oder Erweisen von Dank. Die Formulierung ist im Deutschen würdig und fügt sich in die Partizipienfolge ein.
- source_word: τῶν ἑξῆς τι
  choice: noch etwas Weiteres
  rationale: Die komprimierte Wendung bezeichnet eine zusätzliche Handlung, lässt aber durch τι ausdrücklich offen, worin sie bestand.
- source_word: τῷ τόπῳ ποιήσας
  choice: für den Ort getan hatte
  rationale: Die breite Formulierung bewahrt sowohl das unbestimmte ποιεῖν als auch die Dativbeziehung, ohne eine konkrete Gabe, Stiftung oder Ehrung einzutragen.
- source_word: τὸν τόπον
  choice: den Ort
  rationale: Obwohl im Zusammenhang der heilige Bezirk beziehungsweise der Tempel gemeint sein dürfte, steht im Griechischen das allgemeine τόπος; diese Offenheit bleibt im Haupttext erhalten.
- source_word: τῇ σπουδαιότητι
  choice: dessen Würde
  rationale: σπουδαιότης kann Ernsthaftigkeit, Bedeutung oder Würde bezeichnen. Im Kontext des heiligen Ortes vermittelt „Würde“ dessen eindrucksvollen, feierlichen Rang, ohne bloß äußere Pracht zu behaupten.
- source_word: εὐσεβείᾳ
  choice: Frömmigkeit
  rationale: εὐσέβεια bezeichnet religiöse Ehrfurcht, Frömmigkeit oder Gottesverehrung. Die direkte Wiedergabe lässt die ungewöhnliche Zuschreibung an den Ort bestehen.
- source_word: καταπληγείς
  choice: überwältigt worden war
  rationale: Das Verb beschreibt eine starke, erschütternde Beeindruckung. „Überwältigt“ bringt diese Intensität in natürlichem Deutsch zum Ausdruck, ohne die Reaktion ausschließlich als Furcht oder Staunen festzulegen.
theological_decisions:
- issue: Bedeutung von πιστός als Bezeichnung Gottes
  choice: der treue Gott
  alternative: der zuverlässige Gott; der wahre Gott
  rationale: „Treu“ entspricht dem üblichen Bedeutungsfeld von πιστός und vermeidet die theologisch weitergehende, im Adjektiv nicht zwingend enthaltene Deutung „wahr“.
- issue: Bestimmung des wiederholt genannten „Ortes“
  choice: der Ort
  alternative: der Tempel; das Heiligtum; der heilige Bezirk
  rationale: Der Zusammenhang weist auf die Jerusalemer Tempelanlage, doch der Ausgangstext nennt sie lediglich τόπος. Daher wird die genauere Identifikation nicht stillschweigend in den Haupttext aufgenommen.
- issue: Zuschreibung von εὐσέβεια an den Ort
  choice: dessen Würde und Frömmigkeit
  alternative: dessen Würde und ehrfurchtgebietende Heiligkeit; der dortigen Würde und Gottesverehrung
  rationale: Die grammatische Beziehung kann als Charakter des Ortes oder als dort wahrgenommene religiöse Haltung verstanden werden. Die direkte Formulierung bewahrt diese Spannung, statt sie auf die Frömmigkeit der dort anwesenden Menschen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange, aus mehreren Partizipien bestehende Satzperiode und das abschließende Komma bleiben erhalten, da der Vers syntaktisch in den folgenden Zusammenhang weiterführt. „Ja“ gibt das verstärkende καὶ δή wieder; die Wiederholung von „Ort“ wird trotz stilistischer Auffälligkeit als Merkmal des Ausgangstextes bewahrt.
