base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/002.yaml
  text: But a certain Theodotus[a], having planned to carry out the plot, took the best of the Ptolemaic weapons that had been assigned to him and was conveyed by night to Ptolemy’s tent, to kill him himself and in this way bring the war to an end.
translation:
  language: de
  text: Ein gewisser Theodotos aber hatte beschlossen, den Anschlag auszuführen. Er nahm die besten der ihm zuvor zugeteilten ptolemäischen Waffen und wurde nachts zum Zelt des Ptolemaios gebracht, um ihn persönlich[a] zu töten und so den Krieg zu beenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihn allein zu töten“ beziehungsweise „um ihn eigenhändig zu töten“. Das griechische μόνος betont wahrscheinlich, dass Theodotos die Tat selbst ausführen wollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπληρῶσαι τὴν ἐπιβουλήν
  choice: den Anschlag auszuführen
  rationale: ἐκπληρόω bezeichnet hier die Verwirklichung eines feindlichen Vorhabens; „einen Anschlag ausführen“ ist im Deutschen präzise und idiomatisch.
- source_word: διανοηθείς
  choice: hatte beschlossen
  rationale: Das Partizip bezeichnet eine wohlüberlegte Absicht. „Hatte beschlossen“ gibt die vorausgehende Entschlossenheit im erzählerischen Zusammenhang natürlich wieder.
- source_word: τῶν προυποτεταγμένων αὐτῷ ὅπλων Πτολεμαικῶν τὰ κράτιστα
  choice: die besten der ptolemäischen Waffen, die ihm schon vorher zugeteilt worden waren
  rationale: Die Formulierung bewahrt sowohl den Superlativ τὰ κράτιστα als auch die vorherige Zuteilung der als ptolemäisch bezeichneten Waffen.
- source_word: διεκομίσθη νύκτωρ
  choice: wurde nachts … gebracht
  rationale: Die passive Form wird beibehalten und νύκτωρ in natürlichem modernem Deutsch mit „nachts“ wiedergegeben.
- source_word: ὡς μόνος κτεῖναι αὐτόν
  choice: um ihn selbst zu töten
  rationale: ὡς mit Infinitiv bezeichnet hier die Absicht; μόνος hebt am ehesten hervor, dass Theodotos die Tötung persönlich ausführen wollte. Die knappe Wiedergabe bewahrt zugleich die im Griechischen mögliche Akzentverschiebung.
- source_word: ἐν τούτῳ διαλῦσαι τὸν πόλεμον
  choice: und so den Krieg zu beenden
  rationale: '„So“ gibt den instrumentalen Zusammenhang wieder: Durch die Tötung des Ptolemaios sollte der Krieg beendet werden.'
