translation:
  language: de
  text: Nachdem sie umgekehrt waren[a], kehrten sie zu derselben Haltung des Flehens zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem sie abgewandt worden waren“. Die griechische Form ist ein Aoristpassivpartizip und kann je nach Kontext sowohl Umkehr als auch Abgewandtwerden ausdrücken.'
