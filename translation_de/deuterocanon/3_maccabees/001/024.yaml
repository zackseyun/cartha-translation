lexical_decisions:
- source_word: ἀποτραπέντες
  choice: Nachdem sie umgekehrt waren
  rationale: Das Aoristpartizip wird als vorzeitige Begleithandlung wiedergegeben. „Umkehren“ lässt offen, ob die Betreffenden selbst umkehrten oder durch die Umstände zur Umkehr gebracht wurden, und bezeichnet natürlich die Änderung ihrer Richtung.
- source_word: παρῆσαν
  choice: nahmen sie wieder … ein
  rationale: παρῆσαν bezeichnet hier zusammen mit ἐπὶ und dem Akkusativ das erneute Gelangen in eine zuvor eingenommene Haltung oder Lage. Die idiomatische deutsche Wendung vermeidet ein steifes „waren sie bei“.
- source_word: στάσιν
  choice: Haltung
  rationale: στάσις kann eine körperliche Stellung ebenso wie einen Zustand oder eine innere Haltung bezeichnen. „Haltung“ bewahrt diese Spannweite im Deutschen weitgehend.
- source_word: δεήσεως
  choice: Flehens
  rationale: δέησις bezeichnet eine dringliche Bitte oder inständige Fürbitte. „Flehen“ gibt diese Intensität deutlicher wieder als das allgemeinere „Gebet“.
- source_word: ἐπὶ τὴν αὐτὴν τῆς δεήσεως … στάσιν
  choice: wieder dieselbe Haltung des Flehens
  rationale: Die Formulierung drückt die Wiederaufnahme derselben flehenden Haltung beziehungsweise desselben Zustands aus; „wieder“ macht den resumptiven Zusammenhang im Deutschen klar.
