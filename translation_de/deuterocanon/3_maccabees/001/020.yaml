source:
  edition: lxx-swete-1909
  text: τὰ δὲ νεογνὰ τῶν τέκνων αἱ πρὸς τούτοις μητέρες καὶ τιθηνοὶ παραλείπουσαι ἄλλως καὶ ἄλλως, αἱ μὲν κατʼ οἴκους, αἱ δὲ κατὰ τὰς ἀγυιὰς ἀνεπιστρέπτως εἰς τὸ πανυπέρτατον ἱερὸν ἠθροίζοντο.
  language: Greek
