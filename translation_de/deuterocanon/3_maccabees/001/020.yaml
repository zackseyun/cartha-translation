  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Mütter und Ammen lassen Neugeborene zurück, teils in Häusern, teils auf den Straßen, und bewegen sich fortdauernd und entschlossen zum Heiligtum. »Auch« gibt αἱ πρὸς τούτοις angemessen wieder. »Ohne umzukehren« bewahrt die Bildlichkeit von ἀνεπιστρέπτως; »strömten« ist für die zielgerichtete, kollektive Imperfekthandlung von ἠθροίζοντο mit εἰς idiomatisch und vertretbar.'
