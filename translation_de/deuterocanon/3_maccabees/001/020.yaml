base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/020.yaml
  text: And the mothers and nurses besides these[a], leaving behind the newborn children, some in their houses and others in the streets[b], kept gathering without turning back to the all-supreme sanctuary.
translation:
  language: de
  text: Auch die Mütter und Ammen[a] ließen die neugeborenen Kinder zurück, manche in den Häusern, andere auf den Straßen, und strömten, ohne umzukehren, zum über alles erhabenen Heiligtum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Stillammen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zum allerhöchsten Tempel« beziehungsweise »zum höchst erhabenen Heiligtum«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεογνὰ τῶν τέκνων
  choice: die neugeborenen Kinder
  rationale: νεογνά bezeichnet ganz junge beziehungsweise neugeborene Kinder; die Genitivverbindung wird im Deutschen natürlich als »die neugeborenen Kinder« wiedergegeben.
- source_word: τιθηνοί
  choice: Ammen
  rationale: Das Wort bezeichnet Frauen, die Säuglinge versorgen, häufig ausdrücklich als Stillammen. »Ammen« ist im historischen Zusammenhang präzise und allgemein verständlich.
- source_word: παραλείπουσαι
  choice: ließen ... zurück
  rationale: Die Form beschreibt das Zurücklassen, ohne ausdrücklich ein moralisches Urteil wie »aussetzen« oder »im Stich lassen« hinzuzufügen.
- source_word: ἄλλως καὶ ἄλλως ... αἱ μὲν ... αἱ δὲ
  choice: manche ... andere ...
  rationale: Die zunächst allgemein distributive Wendung wird durch die folgenden Ortsangaben konkretisiert; die gewählte Fassung bildet diese Verteilung idiomatisch ab.
- source_word: ἀγυιάς
  choice: Straßen
  rationale: Gemeint sind öffentliche Straßen oder Gassen; »Straßen« ist die klare moderne Entsprechung.
- source_word: ἀνεπιστρέπτως
  choice: ohne umzukehren
  rationale: Die Wiedergabe bewahrt das Bild des Nicht-Umkehrens und damit die unbeirrte Bewegung zum Heiligtum.
- source_word: πανυπέρτατον
  choice: über alles erhabenen
  rationale: Der intensivierte Superlativ wird in natürlichem, würdigem Deutsch wiedergegeben, ohne daraus einen feststehenden Gottesnamen zu machen.
- source_word: ἱερόν
  choice: Heiligtum
  rationale: ἱερόν kann den Tempel beziehungsweise den heiligen Tempelbezirk bezeichnen; »Heiligtum« wahrt diesen räumlichen Spielraum.
- source_word: ἠθροίζοντο
  choice: strömten
  rationale: Der Imperfekt schildert eine fortdauernde kollektive Bewegung. »Strömten« bringt sowohl das Zusammenkommen als auch die durch εἰς bezeichnete Zielrichtung knapp zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von πανυπέρτατον ἱερόν
  choice: zum über alles erhabenen Heiligtum
  alternative: zum allerhöchsten Tempel
  rationale: Die Fassung erhält die gesteigerte kultische Sprache, vermeidet aber, »Allerhöchster« als möglichen göttlichen Titel auf das Heiligtum zu übertragen. Zugleich bleibt mit »Heiligtum« offen, ob das Tempelgebäude oder der heilige Bezirk im Blick ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzbewegung bleibt trotz der dichten Partizipialkonstruktion klar; »strömten« vermittelt die fortdauernde, entschlossene Bewegung der Frauen, ohne zusätzliche Motive einzutragen.
