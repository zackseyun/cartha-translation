  text: And varied was the plea of those who had gathered for this[b][a], concerning those who were being impiously handed over by him.
translation:
  language: de
  text: Vielfältig war das Flehen[a] derer, die zu diesem Zweck versammelt worden waren, um diejenigen, die von ihm auf frevelhafte Weise[b] ausgeliefert wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die inständige Bitte« beziehungsweise »das Bittgebet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf gottlose Weise« beziehungsweise »auf ruchlose Weise«; das griechische Wort kann einen Verstoß gegen das Rechte wie auch gegen das Heilige bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποικίλη
  choice: vielfältig
  rationale: Das prädikative Adjektiv beschreibt das Flehen als vielgestaltig; »vielfältig« ist gegenwärtig und bewahrt den distributiven Sinn.
- source_word: δέησις
  choice: Flehen
  rationale: Das Wort bezeichnet eine dringliche Bitte oder inständige Fürbitte. »Flehen« gibt die emotionale Dringlichkeit wieder, ohne zwingend ein Gebet an Gott anzunehmen.
- source_word: τῶν εἰς τοῦτο συλλεγέντων
  choice: derer, die sich zu diesem Zweck versammelt hatten
  rationale: Die Form ist passiv, lässt den Handelnden jedoch ungenannt. Die natürliche deutsche Formulierung bewahrt diese Offenheit weitgehend und gibt den vorausliegenden Aorist mit Plusquamperfekt wieder.
- source_word: ἐπὶ τοῖς ... κατεγχειρουμένοις
  choice: um diejenigen, die ... ausgeliefert wurden
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass beziehungsweise die Betroffenen des Flehens. »Um« bringt zugleich das Flehen für die Bedrängten natürlich zum Ausdruck.
- source_word: ἀνοσίως
  choice: auf frevelhafte Weise
  rationale: Das Adverb bezeichnet einen Verstoß gegen das Rechte oder Heilige. »Frevelhaft« erhält sowohl die moralische als auch die religiöse Färbung.
- source_word: ὑπʼ ἐκείνου
  choice: von ihm
  rationale: Der Demonstrativ verweist auf die zuvor genannte männliche Person; »von ihm« ist im Deutschen der natürliche Rückverweis.
- source_word: κατεγχειρουμένοις
  choice: ausgeliefert wurden
  rationale: Das Partizip bezeichnet das Übergeben beziehungsweise Ausliefern in fremde Gewalt. Die passive Form bewahrt den Zwangscharakter und die ausdrücklich genannte Urheberschaft.
theological_decisions:
- issue: Religiöse Tragweite von ἀνοσίως
  choice: auf frevelhafte Weise
  alternative: gottlos / unrechtmäßig
  rationale: »Frevelhaft« lässt offen, ob vor allem ein moralisches Unrecht, eine Verletzung des Heiligen oder beides gemeint ist, und verengt den Ausdruck nicht auf eine bestimmte theologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Satzstellung bildet die griechische Hervorhebung von ποικίλη nach, während Relativsätze die komplexe Partizipialkonstruktion verständlich wiedergeben.
