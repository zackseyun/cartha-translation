  rationale: Die Revision nimmt die unzulässige Ergänzung einer Wahlentscheidung zurück, bewahrt den weiten Bezug von τῶν πάντων und gibt die auffällige Metapher im Haupttext möglichst eng wieder. Die Fußnote dokumentiert die verbleibende lexikalisch-syntaktische Unsicherheit, ohne sie dogmatisch oder interpretativ aufzulösen.
