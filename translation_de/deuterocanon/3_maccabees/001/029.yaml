  yaml_path: translation/deuterocanon/3_maccabees/001/029.yaml
  text: For it seemed that not only the people[a], but even the walls and the whole ground, were resounding[c][b], since then all things were being changed to death instead of the profanation of the place.
translation:
  language: de
  text: Denn es schien, als hallten nicht nur die Menschen, sondern sogar die Mauern und der ganze Boden wider, weil damals alles statt der Entweihung des Ortes[b] in den Tod verwandelt wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung ist ungewöhnlich und bildhaft. Wörtlich steht eine Form von „verändern“ bzw. „eintauschen“ mit „Tod“; die genaue Nuance zwischen Verwandlung und Tausch bleibt unsicher.
    reason: lexical_alternative
  - marker: b
    text: Mit „dem Ort“ ist im Zusammenhang der heilige Bezirk, wahrscheinlich das Tempelgelände, gemeint; im Griechischen steht hier jedoch nicht ausdrücklich „Tempel“.
    reason: cross_reference
lexical_decisions:
- source_word: δοκεῖν γὰρ ἦν
  choice: Denn es schien
  rationale: Die unpersönliche griechische Wendung wird idiomatisch und zugleich eng am Wortlaut wiedergegeben.
- source_word: τοὺς ἀνθρώπους
  choice: die Menschen
  rationale: Der umfassende Ausdruck bezeichnet hier die anwesenden Menschen; „Menschen“ bewahrt den Gegensatz zu Mauern und Boden.
- source_word: τὰ τείχη
  choice: die Mauern
  rationale: Direkte Wiedergabe des Bildes, wonach selbst die bauliche Umgebung vom Lärm erfüllt schien.
- source_word: τὸ πᾶν ἔδαφος
  choice: der ganze Boden
  rationale: ἔδαφος bezeichnet hier am ehesten den Boden der unmittelbaren Umgebung, nicht allgemein das Land.
- source_word: ἠχεῖν
  choice: widerhallen
  rationale: Das Verb bezeichnet einen kräftigen, nach- oder widerklingenden Schall und passt natürlich zu Menschen, Mauern und Boden.
- source_word: ἅτε δὴ
  choice: da
  rationale: Die Partikelverbindung leitet eine begründende Erklärung ein.
- source_word: τῶν πάντων
  choice: alle
  rationale: Im Kontext bezieht sich die substantivierte Form plausibel auf alle betroffenen Menschen; „alle Dinge“ wäre im Deutschen bei der folgenden Willensentscheidung unnatürlich.
- source_word: τότε θάνατον ἀλλασσομένων ἀντὶ τῆς ... βεβηλώσεως
  choice: da damals alle den Tod anstelle der Entweihung ... wählten
  rationale: Die ungewöhnliche Tausch- beziehungsweise Ersatzmetapher wird verständlich als Entscheidung für den Tod anstelle einer Entweihung ausgedrückt, ohne sie zu bloßem „Sterben“ abzuflachen.
- source_word: τοῦ τόπου
  choice: des Ortes
  rationale: Der allgemeinere griechische Ausdruck bleibt erhalten; der heilige Bezugsort wird nicht eigenmächtig als „Tempel“ präzisiert.
theological_decisions:
- issue: Bezug von τοῦ τόπου
  choice: des Ortes
  alternative: des Tempels / des heiligen Ortes
  rationale: Der Kontext weist auf den heiligen Bezirk, doch der griechische Text sagt lediglich „des Ortes“. Die allgemeinere Formulierung bewahrt diese Zurückhaltung.
- issue: Sinn von θάνατον ἀλλασσομένων ἀντὶ τῆς ... βεβηλώσεως
  choice: den Tod anstelle der Entweihung wählten
  alternative: dem Tod übergeben wurden / in den Tod verwandelt wurden
  rationale: Die Konstruktion mit ἀντί drückt hier am plausibelsten den Tod als vorgezogene Alternative zur Entweihung aus. Eine Fußnote hält die ungewöhnliche Tauschmetapher sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Satzbau und die starke Personifikation von Mauern und Boden bleiben erhalten; die ungewöhnliche Schlusswendung wird im Haupttext verständlich formuliert und in der Fußnote transparent gemacht.
