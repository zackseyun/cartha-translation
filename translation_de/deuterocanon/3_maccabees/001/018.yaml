lexical_decisions:
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Gibt den verneinten Zwecksatz in natürlichem modernem Deutsch wieder.
- source_word: καυχήσωνται
  choice: sich … rühmen
  rationale: Bewahrt den Sinn selbstüberheblicher Prahlerei und den gehobenen Ton.
- source_word: οἱ παράνομοι
  choice: die Gesetzlosen
  rationale: Gibt den ausdrücklichen Bezug auf die Übertretung von Gesetz und Ordnung genauer wieder als das allgemeinere „die Bösen“.
- source_word: ἐν θυμῷ αὐτῶν
  choice: in ihrem Zorn
  rationale: θυμός bezeichnet hier heftigen Zorn; „Zorn“ ist würdig und lässt die mögliche Intensität offen.
- source_word: μηδὲ
  choice: und nicht
  rationale: Verbindet im Deutschen den zweiten verneinten Prädikatsausdruck klar mit dem durch ἵνα eingeleiteten Zwecksatz.
- source_word: ἀγαλλιάσωνται
  choice: jubeln
  rationale: Drückt laute, triumphierende Freude aus, ohne unnötig altertümlich zu wirken.
- source_word: ἐν ὑπερηφανίᾳ
  choice: im Hochmut
  rationale: „Hochmut“ bewahrt den moralisch negativen Sinn überheblicher Selbsterhöhung.
- source_word: γλώσσης αὐτῶν
  choice: ihrer Zunge
  rationale: Die anschauliche Metapher des griechischen Textes bleibt erhalten; gemeint ist hochmütiges Reden.
- source_word: λέγοντες
  choice: 'und sagen:'
  rationale: Gibt das Partizip als natürliche deutsche Fortführung wieder und leitet die folgende direkte Rede ein.
