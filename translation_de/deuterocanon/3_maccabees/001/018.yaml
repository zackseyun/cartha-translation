  terminology: „Gesetzlosen“ bewahrt die spezifische Gesetzesbezogenheit von παράνομοι. „Zorn“ und „Hochmut“ sind registergerecht und semantisch tragfähig. Es werden keine konfessionell einengenden Begriffe oder zusätzlichen theologischen Deutungen eingeführt.
