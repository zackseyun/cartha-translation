  source_fidelity: Der verneinte Zwecksatz gibt ἵνα μὴ präzise wieder. „die Gesetzlosen“ entspricht οἱ παράνομοι treffend; „sich ... rühmen“, „in ihrem Zorn“, „jubeln“ und „Hochmut“ geben die wesentlichen Bedeutungsnuancen von καυχάομαι, θυμός, ἀγαλλιάομαι und ὑπερηφανία angemessen wieder. „und sagen:“ ist eine natürliche, quellengerechte Entfaltung von λέγοντες und leitet sachgerecht in die im folgenden Vers fortgesetzte Rede über.
