  text: so that the lawless might not boast in their wrath[a], nor exult in the arrogance of their tongue, saying[b],
translation:
  language: de
  text: 'damit die Gesetzlosen sich nicht in ihrem Zorn[a] rühmen und nicht im Hochmut ihrer Zunge[b] jubeln und sagen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in ihrer Wut.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „im Hochmut ihrer Zunge“; gemeint ist ihr hochmütiges oder anmaßendes Reden.'
