base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/030.yaml
  text: 'But so that he might not become hateful to everyone by being hostile[a], he issued a written order: “But if any of them choose to conduct themselves among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: de
  text: 'Damit er sich aber nicht bei allen verhasst machte, erließ er folgende schriftliche Anordnung: »Wenn sich aber einige von ihnen dafür entscheiden, unter denen zu leben, die in die Riten[a] eingeweiht sind, macht er sie zu Bürgern mit den gleichen Rechten wie die Alexandriner.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die Mysterien«. Im Griechischen stehen Begriffe aus der Sprache kultischer Einweihung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Damit ... aber nicht
  rationale: Gibt den finalen Sinn von ἵνα und den fortführend-gegensätzlichen Charakter von δέ in natürlichem Deutsch wieder.
- source_word: τοῖς πᾶσιν ἐχθόμενος ἐχθαίνηται
  choice: sich durch seine feindselige Haltung bei allen verhasst machte
  rationale: Bewahrt die Beziehung zwischen feindseligem Verhalten und dem daraus entstehenden Verhasstsein; die griechische Verbindung stammverwandter Wörter lässt sich im Deutschen nicht ebenso knapp und natürlich nachbilden.
- source_word: ὑπέγραψεν
  choice: erließ er folgende schriftliche Anordnung
  rationale: Der Kontext verlangt mehr als ein bloßes »schrieb«; das Verb führt den Wortlaut einer amtlichen Verfügung ein.
- source_word: Ἐὰν δέ τινες ἐξ αὐτῶν προαιρῶνται
  choice: Wenn sich aber einige von ihnen dafür entscheiden
  rationale: προαιρῶνται bezeichnet eine bewusste Wahl; »einige« erhält den indefiniten Plural, ohne anzudeuten, dass tatsächlich welche so handelten.
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: unter denen ... die in die Riten eingeweiht sind
  rationale: Erhält sowohl die soziale Einordnung »unter denen« als auch die kultische Sprache der Einweihung, ohne im Haupttext einen bestimmten Mysterienkult vorauszusetzen.
- source_word: ἀναστρέφεσθαι
  choice: zu leben
  rationale: Das Verb kann Lebensführung, Umgang und Aufenthalt umfassen. »Unter denen zu leben« ist idiomatisch und lässt diese soziale wie religiöse Bedeutungsbreite bestehen.
- source_word: τούτους ἰσοπολίτας Ἀλεξανδρεῦσι ποιεῖ
  choice: macht er sie zu Bürgern mit den gleichen Rechten wie die Alexandriner
  rationale: ἰσοπολίτας bezeichnet die Gleichstellung im Bürgerstatus. Die Formulierung macht den rechtlich-politischen Sinn für heutige Leser verständlich und erhält das Präsens des Erlasstextes.
theological_decisions:
- issue: Bezug der kultischen Einweihungssprache
  choice: »in die Riten eingeweiht« im Haupttext
  alternative: »in die Mysterien eingeweiht«
  rationale: τελεταί und μεμυημένοις können technisch auf Mysterienkulte weisen, doch der genaue Kult wird nicht genannt. Die Übersetzung wahrt den kultischen Bezug, ohne ihn enger festzulegen als der griechische Text.
- issue: Mehrdeutigkeit von ἐχθόμενος ... ἐχθαίνηται
  choice: feindselige Haltung als Ursache dafür, bei allen verhasst zu werden
  alternative: von allen angefeindet werden und verhasst sein
  rationale: Die Formen können Aspekte von Feindschaft und Erleiden von Hass miteinander verbinden. Im Zusammenhang beschreibt der Satz am plausibelsten, dass sein feindseliges Vorgehen allgemeinen Hass gegen ihn hervorgerufen hätte; die Fußnote weist auf die sprachliche Spannung hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der amtliche Charakter von ὑπέγραψεν und der rechtliche Gehalt von ἰσοπολίτας werden klar ausgedrückt; die kultische Terminologie bleibt bewusst offen.
