  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. „Bürger mit den gleichen Rechten wie die Alexandriner“ gibt den öffentlich-rechtlichen Charakter klar wieder. Die korrigierte Formulierung vermeidet zugleich die unnötig interpretierende Benennung einer „feindseligen Haltung“.
  terminology: „Riten“ mit der Alternative „Mysterien“ wahrt die kultische, aber nicht näher spezifizierte Sprache von τελεταί und μεμυημένοις. „Gleiche Rechte“ ist für ἰσοπολίτας angemessen; es geht um Gleichstellung im Bürgerstatus, nicht bloß um gesellschaftliche Anerkennung.
