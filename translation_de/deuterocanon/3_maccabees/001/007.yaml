  text: And after doing this, and distributing gifts to the sanctuaries, he made those under his rule confident.
translation:
  language: de
  text: Nachdem er dies getan und den Heiligtümern Geschenke zugeteilt hatte, erfüllte er die Menschen unter seiner Herrschaft mit Zuversicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας δὲ τοῦτο
  choice: Nachdem er dies getan hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Haupthandlung vorausgeht; die deutsche Nebensatzkonstruktion gibt diese zeitliche Abfolge natürlich wieder. δέ führt den Erzählgang fort, ohne dass ein ausdrückliches „aber“ nötig ist.
- source_word: τοῖς τεμένεσι
  choice: den Heiligtümern
  rationale: τέμενος bezeichnet einen geweihten Ort oder heiligen Bezirk. „Heiligtümer“ bleibt weit genug und legt sich nicht unnötig auf Tempelgebäude fest.
- source_word: δωρεὰς ἀπονείμας
  choice: Geschenke zugeteilt hatte
  rationale: δωρεά bezeichnet Geschenke oder Zuwendungen, während ἀπονέμω das Zuteilen beziehungsweise Gewähren ausdrückt. Die Wiedergabe vermeidet eine stärkere kultische Deutung als „Opfergaben“.
- source_word: εὐθαρσεῖς
  choice: mit Zuversicht
  rationale: Das Adjektiv bezeichnet einen zuversichtlichen, guten Mutes befindlichen Zustand. In Verbindung mit κατέστησεν ist „mit Zuversicht erfüllen“ im Deutschen natürlich und bewahrt den kausativen Sinn.
- source_word: τοὺς ὑποτεταγμένους
  choice: die Menschen unter seiner Herrschaft
  rationale: Das substantivierte Perfektpartizip bezeichnet diejenigen, die seiner Autorität unterstellt sind. Die Formulierung ist klar, ohne den politisch engeren Begriff „Untertanen“ aufzuzwingen.
- source_word: κατέστησεν
  choice: erfüllte er … mit
  rationale: καθίστημι bedeutet hier, jemanden in einen bestimmten Zustand zu versetzen. Die idiomatische Formulierung gibt diesen bewirkenden Sinn wieder.
theological_decisions: []
