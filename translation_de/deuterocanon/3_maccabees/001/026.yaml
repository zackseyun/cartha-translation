  text: But after becoming emboldened and having by now sent everyone away, he was already making his approach, thinking to bring the matter spoken of before to completion.
translation:
  language: de
  text: Doch nachdem er kühn geworden war und inzwischen alle weggeschickt hatte, näherte er sich bereits, in der Meinung, das zuvor Gesagte zu Ende zu führen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρασυνθεὶς
  choice: dadurch kühn geworden
  rationale: Das Aoristpartizip bezeichnet, dass er kühn beziehungsweise verwegen wurde. „Kühn geworden“ wahrt die negative Färbung des Zusammenhangs, ohne ausdrücklich „frech“ oder „übermütig“ einzutragen; „dadurch“ bindet das δέ natürlich an den vorausgehenden Kontext an.
- source_word: πάντας παραπέμψας
  choice: nachdem er inzwischen alle weggeschickt hatte
  rationale: Mit πάντας als Objekt bedeutet παραπέμπω hier am ehesten, alle Anwesenden beziehungsweise Begleiter wegzuschicken. Die temporale Nebensatzform gibt die Vorzeitigkeit des Aoristpartizips im Deutschen natürlich wieder.
- source_word: πρόσβασιν ... ἐποιεῖτο
  choice: setzte ... zum Vordringen an
  rationale: πρόσβασις kann Annäherung, Zugang oder Vorrücken bezeichnen. Im Kontext der beabsichtigten Bewegung auf den verbotenen Ort zu vermittelt „zum Vordringen ansetzen“ sowohl den konkreten Vorgang als auch den imperfektiven Beginn beziehungsweise Verlauf.
- source_word: ἤδη ... ἤδη
  choice: inzwischen ... bereits
  rationale: Beide Vorkommen von ἤδη bleiben erkennbar, werden aber mit unterschiedlichen natürlichen deutschen Entsprechungen wiedergegeben, um eine schwerfällige Wiederholung von „schon“ zu vermeiden.
- source_word: τέλος ἐπιθήσειν
  choice: zu Ende führen zu können
  rationale: Die Wendung bedeutet hier, das Vorhaben zum Abschluss zu bringen, nicht es abzubrechen. „Zu Ende führen“ ist idiomatisch und bewahrt die Zielrichtung.
- source_word: τῷ προειρημένῳ
  choice: das zuvor Gesagte
  rationale: Das substantivierte Partizip verweist allgemein auf das zuvor Erwähnte. Die Wiedergabe vermeidet die Eintragung eines im Griechischen nicht ausdrücklich genannten Substantivs wie „Plan“ oder „Vorhaben“.
- source_word: δοκῶν
  choice: weil er meinte
  rationale: Das Präsenspartizip bezeichnet seine begleitende Einschätzung oder Erwartung. Ein kausaler Nebensatz ist im Deutschen verständlich und lässt offen, ob diese Einschätzung zutraf.
