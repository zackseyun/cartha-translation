  text: And so it happened that the opponents were destroyed in hand-to-hand combat[a], and many were also captured as prisoners of war.
translation:
  language: de
  text: Und so kam es, dass die Gegner im Nahkampf vernichtet und viele auch als Kriegsgefangene[a] gefangen genommen wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch den Speer Gefangene“; ein militärischer Ausdruck für Menschen, die im Krieg gefangen genommen wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβη
  choice: es kam
  rationale: Die unpersönliche Erzählformel wird mit „es kam dazu“ beziehungsweise im Satzfluss „so kam es, dass“ natürlich und formnah wiedergegeben.
- source_word: ἀντιπάλους
  choice: die Gegner
  rationale: „Gegner“ bezeichnet allgemein die im Kampf gegenüberstehende Partei, ohne den Ausdruck unnötig zu verengen.
- source_word: ἐν χειρονομίαις
  choice: im Nahkampf
  rationale: Der Ausdruck bezeichnet hier Kampfhandlungen aus nächster Nähe; „im Nahkampf“ gibt den militärischen Sinn idiomatisch wieder.
- source_word: διαφθαρῆναι
  choice: vernichtet wurden
  rationale: Im Kampfzusammenhang bezeichnet das Verb die völlige Zerstörung beziehungsweise Tötung; „vernichtet“ bewahrt die etwas weitere Ergebnisaussage des griechischen Verbs.
- source_word: πολλούς
  choice: viele
  rationale: Direkte und idiomatische Wiedergabe der Mengenangabe.
- source_word: δοριαλώτους
  choice: als Kriegsgefangene
  rationale: Das militärische Wort bezeichnet wörtlich durch den Speer erbeutete Gefangene; „Kriegsgefangene“ vermittelt den gemeinten Status im heutigen Deutsch.
- source_word: συλλημφθῆναι
  choice: ergriffen wurden
  rationale: Das Passiv wird beibehalten. „Ergriffen“ vermeidet die schwerfällige Wiederholung „als Kriegsgefangene gefangen“ und bezeichnet hier eindeutig die Gefangennahme.
