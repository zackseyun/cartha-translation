  yaml_path: translation/deuterocanon/3_maccabees/001/033.yaml
  text: They had been instructed to obtain support[a], and they loathed those who withdrew from them, judging them as enemies of the nation[b], and depriving them of common association and serviceability.
translation:
  language: de
  text: Sie waren unterwiesen worden, Unterstützung zu erlangen[a], und sie verabscheuten diejenigen, die sich von ihnen abwandten; sie betrachteten sie als Feinde des Volkes und schlossen sie vom gemeinschaftlichen Umgang und Nutzen aus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hilfe“ beziehungsweise „Beistand“; das griechische Wort bezeichnet allgemein Unterstützung.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Ausschluss aus den gewöhnlichen sozialen Beziehungen und von den mit dem Gemeinschaftsleben verbundenen Nutzen oder Möglichkeiten. Die genaue Reichweite des zweiten griechischen Begriffs bleibt offen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνπαιδεῖς … καθηστήκεισαν
  choice: sie waren darin unterwiesen worden
  rationale: Die Verbindung bezeichnet einen durch vorherige Unterweisung entstandenen, gefestigten Zustand. Das deutsche Plusquamperfekt gibt diesen Rückbezug natürlich wieder.
- source_word: ἀντιλήψεως τεύξεσθαι
  choice: Unterstützung zu erlangen
  rationale: ἀντίληψις bezeichnet Hilfe oder Beistand, während τεύγχανω mit Genitiv das Erlangen oder Empfangen ausdrückt. „Unterstützung“ lässt die Art der Hilfe offen.
- source_word: ἀποχωροῦντας ἐξ αὐτῶν
  choice: die sich von ihnen abwandten
  rationale: Die Formulierung wahrt neben dem Sich-Entfernen auch den Beziehungsabbruch; „abwandten“ ist im Deutschen hier natürlicher als ein bloß räumliches „fortgingen“.
- source_word: ἐβδελύσσοντο
  choice: verabscheuten sie
  rationale: Das Verb drückt starke Abscheu aus. „Verabscheuen“ ist kräftig, verständlich und dem würdigen Register angemessen.
- source_word: πολεμίους τοῦ ἔθνους
  choice: Feinde des Volkes
  rationale: ἔθνος bezeichnet hier die jüdische Gemeinschaft als kollektive Größe. „Volk“ ist im Deutschen idiomatischer als „Nation“ und vermeidet unnötige moderne staatsnationale Anklänge.
- source_word: τῆς κοινῆς συναναστροφῆς καὶ εὐχρηστίας
  choice: vom gemeinschaftlichen Umgang und nützlichen Wirken
  rationale: συναναστροφή meint den gewöhnlichen sozialen Umgang; εὐχρηστία bezeichnet Nützlichkeit beziehungsweise nutzbringende Betätigung. Die Wiedergabe bleibt verständlich, ohne die schwierige zweite Bezeichnung auf eine einzige konkrete Leistung festzulegen.
- source_word: ἐστέροῦν
  choice: schlossen sie … aus
  rationale: Das Verb bedeutet „berauben, vorenthalten“. In Verbindung mit sozialem Umgang und gemeinschaftlicher Betätigung gibt „ausschließen“ die tatsächliche Wirkung im Deutschen klar und idiomatisch wieder.
theological_decisions:
- issue: Kollektive Identität in ἔθνος
  choice: Volk
  alternative: Nation
  rationale: Gemeint ist die jüdische Gemeinschaft in ihrer sozialen und politischen Zusammengehörigkeit. „Volk“ bewahrt diesen Sinn, ohne einen modernen Nationalstaat vorauszusetzen.
- issue: Bedeutung von κοινὴ συναναστροφή und εὐχρηστία
  choice: gemeinschaftlicher Umgang und nützliches Wirken
  alternative: gemeinsamer Umgang und gegenseitiger Nutzen
  rationale: Die Wendung beschreibt den Ausschluss aus normalen sozialen Beziehungen und aus nutzbringender Beteiligung am Gemeinschaftsleben. Die genaue Reichweite von εὐχρηστία bleibt jedoch offen und wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die logischen Beziehungen bleiben erhalten. Die starke Sprache der sozialen Verurteilung wird nicht abgeschwächt.
