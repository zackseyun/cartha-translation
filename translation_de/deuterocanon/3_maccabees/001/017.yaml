lexical_decisions:
- source_word: οἱ κατὰ τὴν πόλιν ἀπολειπόμενοι
  choice: Die in der Stadt Zurückgebliebenen
  rationale: Die substantivierte Form bewahrt den passiven Sinn von ἀπολειπόμενοι und bezeichnet natürlich die Menschen, die in der Stadt zurückgeblieben waren.
- source_word: ταραχθέντες
  choice: gerieten in Aufregung
  rationale: Die Wendung gibt die durch die Ereignisse ausgelöste Beunruhigung und Erregung wieder, ohne das Verb unnötig auf bloße Angst oder reine Verwirrung festzulegen.
- source_word: ἐξεπήδησαν
  choice: stürzten hinaus
  rationale: Das Verb bezeichnet eine plötzliche, heftige Bewegung nach draußen; „stürzten hinaus“ ist im Deutschen anschaulich und idiomatisch.
- source_word: ἄδηλον τιθέμενοι τὸ γινόμενον
  choice: weil ihnen unklar war, was geschah
  rationale: Diese Wiedergabe bleibt nahe bei der griechischen Aussage, dass sie das Geschehen als unklar beziehungsweise nicht erkennbar ansahen, und klingt zugleich natürlich.
