base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/012.yaml
  text: And even when the law had been read out[a], he still did not stop insisting that he ought to enter, saying, “Even if they have been deprived of this honor, I ought not to be.”
translation:
  language: de
  text: 'Und selbst nachdem ihm das Gesetz vorgelesen worden war, hörte er dennoch nicht auf zu behaupten, er müsse hineingehen. Er sagte: »Auch wenn ihnen diese Ehre verwehrt worden ist, darf sie mir doch nicht verwehrt werden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Bei mir aber darf es nicht so sein.« Der griechische Schlusssatz ist verkürzt; sinngemäß kann er auch heißen: »Ich aber darf dieser Ehre nicht beraubt werden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... νόμου
  choice: das Gesetz
  rationale: νόμος bezeichnet hier am natürlichsten die zuvor angeführte verbindliche jüdische Vorschrift, nicht lediglich einen Brauch.
- source_word: παραναγνωσθέντος
  choice: nachdem ihm ... vorgelesen worden war
  rationale: Das Partizip bezeichnet das Vorlesen beziehungsweise Verlesen vor jemandem; „ihm vorgelesen“ macht den Bezug im Deutschen natürlich deutlich.
- source_word: οὐδ᾽ ὣς ἀπέλειπεν
  choice: hörte er dennoch nicht auf
  rationale: Die Wendung drückt fortgesetztes Beharren trotz des vorgelesenen Gesetzes aus; das Imperfekt wird durativ wiedergegeben.
- source_word: προφερόμενος
  choice: zu behaupten
  rationale: Im Zusammenhang bezeichnet das Wort das nachdrückliche Vorbringen und Aufrechterhalten seines Anspruchs.
- source_word: ἑαυτὸν δεῖν εἰσελθεῖν
  choice: er müsse hineingehen
  rationale: δεῖ drückt hier aus seiner Sicht Notwendigkeit beziehungsweise beanspruchte Berechtigung aus; „müsse“ bewahrt die Stärke der Aussage.
- source_word: ἐστέρηνται
  choice: verwehrt worden ist
  rationale: Die passive Perfektform beschreibt einen fortbestehenden Ausschluss von der genannten Ehre; „verwehrt worden“ ist in diesem Zugangskontext idiomatisch.
- source_word: ταύτης τῆς τιμῆς
  choice: diese Ehre
  rationale: „Ehre“ gibt τιμή direkt wieder und bewahrt den Gedanken eines ehrenvollen Vorrechts beziehungsweise Status.
- source_word: ἐμὲ δὲ οὐ δεῖ
  choice: darf sie mir doch nicht verwehrt werden
  rationale: 'Der griechische Schluss ist elliptisch, wörtlich etwa: „bei mir aber darf/soll es nicht [so sein]“. Die Ergänzung greift die unmittelbar zuvor genannte Entziehung der Ehre auf und ergibt natürliches Deutsch; die Ellipse wird in der Fußnote offengelegt.'
