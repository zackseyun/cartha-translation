  text: But since you were pleased to set your glory among your people Israel, you sanctified this place.
translation:
  language: de
  text: Doch weil du an deiner Herrlichkeit in deinem Volk Israel Gefallen hattest, hast du diesen Ort geheiligt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ᾽
  choice: Doch
  rationale: Die adversative Konjunktion setzt den Satz in Gegensatz zum vorausgehenden Zusammenhang; „Doch“ ist im Deutschen würdig und natürlich.
- source_word: ἐπεὶ
  choice: weil
  rationale: Die Konjunktion begründet hier die folgende Aussage. „Weil“ gibt diesen kausalen Zusammenhang klar wieder.
- source_word: εὐδόκησας
  choice: es dir gefiel
  rationale: Die Form von εὐδοκέω bezeichnet Wohlgefallen oder einen wohlgefälligen Entschluss. „Es dir gefiel“ bewahrt sowohl die Freude als auch den Willensaspekt.
- source_word: τὴν δόξαν σου
  choice: deine Herrlichkeit
  rationale: δόξα bezeichnet in diesem sakralen Zusammenhang Gottes offenbarte Herrlichkeit; „Herrlichkeit“ ist die etablierte und sachlich passende Wiedergabe.
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  choice: unter deinem Volk Israel
  rationale: Bei einer Personengruppe gibt „unter“ die lokale beziehungsweise relationale Bedeutung von ἐν im heutigen Deutsch natürlicher wieder als „in“.
- source_word: ἡγίασας
  choice: hast du … geheiligt
  rationale: ἁγιάζω bezeichnet das Heiligmachen oder Absondern für Gott. „Geheiligt“ erhält die ausdrückliche Heiligkeitssprache des griechischen Textes.
- source_word: τὸν τόπον τοῦτον
  choice: diesen Ort
  rationale: Die wörtliche und kontextuell ausreichende Bedeutung von τόπος ist „Ort“. „Heiligtum“ wäre spezifischer als der griechische Ausdruck.
theological_decisions:
- issue: Art der Gegenwart von Gottes Herrlichkeit bei Israel
  choice: deine Herrlichkeit unter deinem Volk Israel gegenwärtig sein zu lassen
  alternative: an deiner Herrlichkeit unter deinem Volk Israel Gefallen zu haben
  rationale: Der knappe griechische Satz verbindet εὐδοκέω unmittelbar mit „deine Herrlichkeit unter deinem Volk Israel“, ohne die Art dieser Beziehung ausdrücklich zu entfalten. Die gewählte Formulierung ergibt natürliches Deutsch, deutet die Herrlichkeit als von Gott gewollte Gegenwart und kennzeichnet die im Griechischen nicht ausgedrückte Ergänzung durch eine Fußnote.
- issue: Heiligkeit des Ortes
  choice: diesen Ort geheiligt
  alternative: diesen Ort geweiht
  rationale: Das Verb ἁγιάζω enthält ausdrücklich die Kategorie der Heiligkeit. „Geheiligt“ bewahrt sie, ohne den allgemeineren Ausdruck „Ort“ vorschnell auf eine bestimmte kultische Einrichtung einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Kausalgefüge; kultische Schlüsselbegriffe wie „Herrlichkeit“ und „geheiligt“ werden beibehalten. Die erklärende Ergänzung im Haupttext wird transparent in der Fußnote kenntlich gemacht.
