  text: We trampled the house of holiness[b][a], as the houses of abominations are trampled.
translation:
  language: de
  text: Wir haben das Haus der Heiligkeit[a] niedergetreten, wie die Häuser der Gräuel[b] niedergetreten werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „das Haus der Heiligkeit“; gemeint ist das Heiligtum beziehungsweise der Tempel. Möglich ist auch: „das Haus der Heiligung“.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene griechische Wort kann auch Dinge bezeichnen, die verflucht, abscheulich oder dem Untergang geweiht sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν
  choice: haben … niedergetreten
  rationale: Das Verb bezeichnet konkret das Niedertreten oder Zertreten. „Niedergetreten“ bewahrt das kraftvolle Bild und gibt die darin liegende Entweihung nicht bloß deutend wieder.
- source_word: τὸν οἶκον τοῦ ἁγιασμοῦ
  choice: das Haus der Heiligkeit
  rationale: „Haus“ entspricht οἶκος, während „Heiligkeit“ hier die sakrale Weihe und Bestimmung des Hauses ausdrückt. Die ungewöhnliche, ehrfürchtige Umschreibung des Tempels bleibt so erkennbar.
- source_word: ὡς
  choice: wie
  rationale: Die Konjunktion leitet einen direkten Vergleich ein; „wie“ ist im Deutschen knapp und natürlich.
- source_word: καταπατοῦνται
  choice: niedergetreten werden
  rationale: Das Präsens Passiv beschreibt allgemein, wie solche Häuser behandelt werden, und wiederholt bewusst dasselbe Bild wie der erste Satzteil.
- source_word: προσολοθρευμάτων
  choice: Gräuel
  rationale: Das seltene Wort bezeichnet wahrscheinlich abscheuliche, verfluchte oder der Vernichtung preisgegebene Dinge. „Gräuel“ bewahrt den kultisch abwertenden Ton, ohne eine einzelne technische Bedeutung festzuschreiben.
theological_decisions:
- issue: Bezeichnung des heiligen Gebäudes
  choice: Haus der Heiligkeit
  alternative: Heiligtum; Tempel; Haus der Heiligung
  rationale: Die griechische Wendung wird nicht stillschweigend auf „Tempel“ vereinheitlicht. „Haus der Heiligkeit“ bleibt verständlich und erhält den rhetorischen Gegensatz zwischen dem geheiligten Haus und den Häusern der Gräuel.
- issue: Bedeutung des seltenen Wortes προσολοθρευμάτων
  choice: Gräuel
  alternative: dem Untergang Geweihtes; verfluchte oder abscheuliche Dinge
  rationale: Die genaue Bedeutung des seltenen Ausdrucks ist unsicher. Der Haupttext gibt seinen stark abwertenden Sinn wieder; die Fußnote bewahrt die mögliche Beziehung zu Vernichtung oder Bann.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Form von „niedertreten“ bildet die Parallelität des griechischen Satzes nach. Die leicht ungewöhnliche Wendung „Haus der Heiligkeit“ ist bewusst beibehalten und durch eine Fußnote erläutert.
