revisions:
- from: Dositheus, der als Sohn des Drimylos bezeichnet wurde[a], war von Geburt Jude, hatte aber später die überlieferten Ordnungen geändert und sich den Lehren seiner Vorfahren entfremdet[b]. Er ließ einen unbedeutenden Mann[c] im Zelt an seiner Stelle niederlegen; und so geschah es, dass dieser die für ihn bestimmte Strafe erlitt.
  to: Während Dositheus, der als Sohn des Drimylos bezeichnet wurde[a], diesen begleitete – ein Jude von Geburt, der aber später die überlieferten Ordnungen geändert und sich den Lehren seiner Vorfahren entfremdet hatte[b] –, ließ er einen unbedeutenden Mann[c] im Zelt an dessen Stelle niederlegen. So geschah es, dass dieser die Strafe jenes Mannes erlitt.
  rationale: Die Revision ergänzt die ausgelassene Partizipialhandlung διὰγων durch „diesen begleitete“. Sie ersetzt außerdem die interpretierende Formulierung „die für ihn bestimmte Strafe“ durch „die Strafe jenes Mannes“, um den Bezug von ἐκείνου nicht über den griechischen Wortlaut hinaus festzulegen. Die vorhandenen sachgerechten Wiedergaben der ethnischen Herkunft, der überlieferten Normen und der väterlichen Lehren bleiben erhalten.
