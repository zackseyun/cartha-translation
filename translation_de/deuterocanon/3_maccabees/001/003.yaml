base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/003.yaml
  text: Dositheus[a], the one called son of Drimylus, a Jew by birth, but later having changed his customs and become estranged from the ancestral beliefs, lodged some obscure man in the tent in his place[c][b]; and it happened that this man received that one's punishment.
translation:
  language: de
  text: Während Dositheus, der als Sohn des Drimylos bezeichnet wurde[a], diesen begleitete – ein Jude von Geburt, der aber später die überlieferten Ordnungen geändert und sich den Lehren seiner Vorfahren entfremdet hatte[b] –, ließ er einen unbedeutenden Mann[c] im Zelt an dessen Stelle niederlegen. So geschah es, dass dieser die Strafe jenes Mannes erlitt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dositheus, der sogenannte Sohn des Drimylos.“ Die griechische Formulierung ist wahrscheinlich eine Angabe seines Vaters.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „hatte die Ordnungen beziehungsweise Bräuche geändert und sich den Lehren der Vorfahren entfremdet“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „einen unbekannten Mann“ beziehungsweise „einen Mann ohne Ansehen“. „An dessen Stelle“ ergibt sich aus dem Zusammenhang; „jene(s)“ bewahrt den im Griechischen nicht näher bestimmten Bezug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δωσίθεος ὁ Δριμύλου λεγόμενος
  choice: Dositheus, der als Sohn des Drimylos bezeichnet wurde
  rationale: Der Genitiv Δριμύλου bei λεγόμενος ist am ehesten patronymisch zu verstehen. Die Formulierung bleibt nah am Griechischen, ohne die Identifikation als völlig sicher auszugeben.
- source_word: τὸ γένος Ἰουδαῖος
  choice: von Geburt Jude
  rationale: γένος bezeichnet hier Abstammung beziehungsweise Herkunft, im Gegensatz zu seiner späteren Abkehr von den überlieferten Ordnungen und Lehren.
- source_word: μεταβαλὼν τὰ νόμιμα
  choice: die überlieferten Ordnungen geändert
  rationale: νόμιμα umfasst die durch Brauch und Gesetz geprägten religiösen Lebensordnungen. „Ordnungen“ wahrt sowohl den rechtlichen als auch den praktischen Aspekt besser als nur „Bräuche“.
- source_word: τῶν πατρίων δογμάτων ἀπηλλοτριωμένος
  choice: sich den Lehren seiner Vorfahren entfremdet
  rationale: ἀπαλλοτριόω bezeichnet Entfremdung, während δόγματα hier die ererbten Lehren oder Überzeugungen meint. Die Übersetzung bewahrt die wertende Aussage, ohne spätere Lehrkategorien einzutragen.
- source_word: ἄσημόν τινα
  choice: einen unbedeutenden Mann
  rationale: ἄσημος bezeichnet jemanden ohne Rang, Auszeichnung oder Bekanntheit. „Unbedeutend“ gibt den sozialen Sinn wieder; die Alternative „unbekannt“ wird in der Fußnote genannt.
- source_word: κατέκλινεν ἐν τῇ σκηνῇ
  choice: ließ ... im Zelt an seiner Stelle niederlegen
  rationale: κατακλίνω bedeutet wörtlich niederlegen oder sich lagern lassen. „An seiner Stelle“ verdeutlicht die im Kontext erkennbare Stellvertretung, ist jedoch als kontextuelle Ergänzung gekennzeichnet.
- source_word: ὃν συνέβη κομίσασθαι τὴν ἐκείνου κόλασιν
  choice: und so geschah es, dass dieser die für ihn bestimmte Strafe erlitt
  rationale: συνέβη bezeichnet den eingetretenen Ausgang; κομίζομαι kann hier „empfangen“ beziehungsweise „davontragen“ bedeuten. ἐκείνου verweist auf den anderen Mann. Die Formulierung gibt die beabsichtigte Zuordnung der Strafe natürlich wieder.
theological_decisions:
- issue: Beschreibung der Abkehr des Dositheus von jüdischer Überlieferung
  choice: „hatte ... die überlieferten Ordnungen geändert und sich den Lehren seiner Vorfahren entfremdet“
  alternative: „hatte die Bräuche geändert und sich von den überlieferten Glaubensüberzeugungen losgesagt“
  rationale: Die Übersetzung erhält sowohl den lebenspraktisch-rechtlichen Gehalt von νόμιμα als auch den lehrhaften Gehalt von δόγματα. Sie übernimmt die negative Charakterisierung des Textes, ohne eine bestimmte spätere Vorstellung von Apostasie einzutragen.
- issue: Bezug von ἐκείνου in „dessen Strafe“
  choice: „die für ihn bestimmte Strafe“ mit Bezug auf Dositheus
  alternative: 'formal enger: „die Strafe jenes Mannes“'
  rationale: Der Erzählzusammenhang beschreibt einen Ersatzmann, der die Dositheus zugedachte Strafe erleidet. Die deutsche Fassung macht diesen Bezug verständlich, während die Fußnote auf die wörtlichere Struktur hinweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde zur besseren Verständlichkeit in zwei Hauptsätze gegliedert. „Drimylos“ folgt einer üblichen deutschen Umschrift des griechischen Namens. Die Fußnoten bewahren die Mehrdeutigkeit von ἄσημος und kennzeichnen die kontextuelle Ergänzung „an seiner Stelle“.
