  naturalness: Das Deutsch ist überwiegend klar und würdevoll. Eine Satzverbindung mit „Während er diesen begleitete“ ist natürlich, bewahrt aber den im Kontext vorausgesetzten Bezug von τοῦτον. „Die Strafe jenes Mannes“ ist etwas formeller, aber in diesem erzählerischen Register idiomatisch und genauer.
