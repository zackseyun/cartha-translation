  text: And someone said, without thinking, that this very thing was being monstrously misrepresented[a].
translation:
  language: de
  text: Und jemand sagte unbedacht, gerade dies werde auf üble Weise als etwas Ungeheuerliches dargestellt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerade dies werde zu einem ungeheuerlichen Vorzeichen gemacht“; auch: „werde sensationell ausgeschmückt“. Das griechische Verb kann bedeuten, etwas als Wunder, Vorzeichen oder Ungeheuerlichkeit darzustellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρονοήτως
  choice: unbedacht
  rationale: Das Adverb bezeichnet ein Reden ohne vorherige Überlegung. „Unbedacht“ ist knapp, natürlich und vermeidet eine stärkere moralische Verurteilung.
- source_word: ἔφη
  choice: sagte
  rationale: Das schlichte Verb des Sagens gibt ἔφη ohne unnötige Verstärkung wieder.
- source_word: κακῶς
  choice: auf üble Weise
  rationale: Die Wendung bewahrt die negative Wertung des Adverbs, ohne sie vorschnell ausschließlich als sachlich „falsch“ oder moralisch „böse“ festzulegen.
- source_word: αὐτὸ τοῦτο
  choice: gerade dies
  rationale: „Gerade dies“ gibt die emphatische Hervorhebung der griechischen Wortgruppe in idiomatischem Deutsch wieder.
- source_word: τερατεύεσθαι
  choice: zu etwas Ungeheuerlichem aufgebauscht
  rationale: Die Wiedergabe verbindet das Aufbauschen einer Sache mit dem Wortfeld von Wunderzeichen, Ungeheuerlichem und Außerordentlichem. Sie bleibt verständlich, während die genauere Bedeutungsbreite in der Fußnote erhalten wird.
