revisions:
- from: Philopator erfuhr von den Zurückgekehrten, dass Antiochus die Gebiete, die unter seiner Herrschaft standen, an sich riss. Daraufhin erteilte er seinem gesamten Fußvolk und seiner gesamten Reiterei den Befehl zum Aufbruch, nahm seine Schwester Arsinoë mit und zog bis in die Gegend von Raphia. Dort hatten Antiochus und seine Truppen[a] ihr Lager aufgeschlagen.
  to: Philopator erfuhr von den Zurückgekehrten, dass Antiochus dabei war, die Gebiete unter Philopators Herrschaft an sich zu reißen. Er erteilte allen seinen Fuß- und Reitertruppen Befehle, nahm seine Schwester Arsinoë mit und zog bis in die Gegend von Raphia, wo die um Antiochus[a] ihr Lager aufgeschlagen hatten.
  rationale: Die Revision entfernt die nicht im griechischen Text genannte Bestimmung „zum Aufbruch“, verdeutlicht den Bezug der von Antiochus beanspruchten Gebiete auf Philopator und lässt die idiomatische, in ihrem Umfang offene Bezeichnung οἱ περὶ Ἀντίοχον in der Übersetzung samt Fußnote erkennbar. „Dabei war, ... an sich zu reißen“ gibt die durch γινομένην angezeigte andauernde Aneignung natürlich wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:48Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundhandlung und die geographischen sowie militärischen Angaben sind weitgehend zutreffend wiedergegeben. Allerdings ergänzt „den Befehl zum Aufbruch“ einen konkreten Inhalt des Befehls, den παραγγείλας nicht nennt. Außerdem legt „Antiochus und seine Truppen“ die absichtlich offene griechische Gruppenbezeichnung οἱ περὶ Ἀντίοχον zu stark fest und gibt Antiochus ausdrücklich als anwesend aus.
  naturalness: Der Entwurf ist gut lesbares modernes Standarddeutsch. Die Satzteilung ist möglich; die revidierte Fassung bewahrt die klare Erzählfolge ohne die unbestimmte Befehlsformel unnötig auszudeuten.
  terminology: „Fuß- und Reitertruppen“, „an sich reißen“, Arsinoë und Raphia sind angemessen. Der Bezug von „seiner Herrschaft“ sollte ausdrücklich Philopator zugeordnet werden, damit kein falscher Bezug auf Antiochus entsteht.
  issues:
  - severity: medium
    issue: „den Befehl zum Aufbruch“ ergänzt den Inhalt des Befehls.
    rationale: παραγγείλας bezeichnet das Erteilen von Befehlen bzw. Weisungen an die Truppen, ohne deren konkreten Wortlaut oder Zweck zu benennen. Der anschließende Aufbruch Philopators erlaubt nicht sicher, den Befehl als Aufbruchsbefehl zu bestimmen.
  - severity: medium
    issue: „Antiochus und seine Truppen[a]“ engt οἱ περὶ Ἀντίοχον ein.
    rationale: Die Wendung bedeutet wörtlich „die um Antiochus“ und kann seine Gefolgschaft bzw. Streitmacht, möglicherweise einschließlich Antiochus, bezeichnen. Die Hauptübersetzung soll diese Offenheit bewahren; die Fußnote kann sie erläutern.
  - severity: low
    issue: „unter seiner Herrschaft“ ist im Deutschen potenziell mehrdeutig.
    rationale: Nach dem unmittelbar genannten Antiochus kann „seiner“ missverständlich auf Antiochus bezogen werden, während αὐτοῦ im griechischen Zusammenhang Philopator meint.
  revised_text: Philopator erfuhr von den Zurückgekehrten, dass Antiochus dabei war, die Gebiete unter Philopators Herrschaft an sich zu reißen. Er erteilte allen seinen Fuß- und Reitertruppen Befehle, nahm seine Schwester Arsinoë mit und zog bis in die Gegend von Raphia, wo die um Antiochus[a] ihr Lager aufgeschlagen hatten.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: »die um Antiochus«; die griechische Wendung kann Antiochus selbst samt seiner Partei oder seinen Truppen bezeichnen.'
    reason: lexical_alternative
  revision_rationale: Die Revision entfernt die nicht im griechischen Text genannte Bestimmung „zum Aufbruch“, verdeutlicht den Bezug der von Antiochus beanspruchten Gebiete auf Philopator und lässt die idiomatische, in ihrem Umfang offene Bezeichnung οἱ περὶ Ἀντίοχον in der Übersetzung samt Fußnote erkennbar. „Dabei war, ... an sich zu reißen“ gibt die durch γινομένην angezeigte andauernde Aneignung natürlich wieder.
