base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/001.yaml
  text: Philopator[a], having learned from those who had returned of the seizure by Antiochus of the regions under his rule, gave orders to all his infantry and cavalry forces, took along his sister Arsinoe, and set out as far as the region of Raphia, where those with Antiochus had encamped.
translation:
  language: de
  text: Philopator erfuhr von den Zurückgekehrten, dass Antiochus dabei war, die Gebiete unter Philopators Herrschaft an sich zu reißen. Er erteilte allen seinen Fuß- und Reitertruppen Befehle, nahm seine Schwester Arsinoë mit und zog bis in die Gegend von Raphia, wo die um Antiochus[a] ihr Lager aufgeschlagen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die um Antiochus«; die griechische Wendung kann Antiochus selbst samt seiner Partei oder seinen Truppen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ο ΔΕ
  choice: Philopator erfuhr
  rationale: δέ führt die Erzählung weiter; im Deutschen ist kein eigener temporaler Ausdruck nötig. Der Artikel vor dem Namen wird nicht wiedergegeben.
- source_word: παρὰ τῶν ἀνακομισθέντων
  choice: von den Zurückgekehrten
  rationale: Bewahrt die substantivierte Partizipialform, ohne die Personen ausdrücklich als Boten zu bezeichnen.
- source_word: τὴν γινομένην ... ἀφαίρεσιν ὑπὸ Ἀντιόχου
  choice: dass Antiochus ... an sich riss
  rationale: Gibt das im Gang befindliche gewaltsame Wegnehmen idiomatisch verbal wieder; „an sich reißen“ passt zum territorialen Zusammenhang.
- source_word: τῶν ἐπ᾽ αὐτοῦ κρατουμένων τόπων
  choice: die Gebiete, die unter seiner Herrschaft standen
  rationale: Gibt die politische Kontrolle durch Philopator klar wieder, ohne über den Umfang oder Rechtsstatus der Gebiete hinauszugehen.
- source_word: παραγγείλας ταῖς πάσαις δυνάμεσιν πεζικαῖς καὶ ἱππικαῖς
  choice: erteilte er seinem gesamten Fußvolk und seiner gesamten Reiterei den Befehl zum Aufbruch
  rationale: Die militärischen Truppengattungen werden natürlich und präzise bezeichnet; der Aufbruch ergibt sich aus der folgenden Bewegung, wobei der griechische Befehl selbst nicht näher bestimmt ist.
- source_word: τὴν ἀδελφὴν Ἀρσινόην συνπαραλαβών
  choice: nahm seine Schwester Arsinoë mit
  rationale: Direkte, natürliche Wiedergabe des Mitnehmens; die deutsche Namensform Arsinoë verhindert eine missverständliche Aussprache.
- source_word: ἐξώρμησεν μέχρι τῶν κατὰ Ῥαφίαν τόπων
  choice: zog bis in die Gegend von Raphia
  rationale: „zog“ wahrt den militärischen Reisecharakter, während „Gegend von Raphia“ die räumliche Näherungsangabe κατὰ wiedergibt.
- source_word: οἱ περὶ Ἀντίοχον
  choice: Antiochus und seine Truppen
  rationale: Die griechische Wendung bezeichnet die um Antiochus versammelte Partei beziehungsweise Streitmacht und kann Antiochus selbst einschließen.
