  text: Along with these[a], those who had become emboldened concerning the citizens could no longer endure it when he pressed the matter completely and intended to carry out his purpose.
translation:
  language: de
  text: Zusammen mit diesen konnten auch diejenigen, die im Blick auf die Bürger mutig geworden waren,[a] es nicht länger ertragen, dass er mit aller Entschiedenheit darauf drängte und seinen Vorsatz auszuführen gedachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die mutig geworden waren, um für die Bürger einzutreten«. Die griechische Wendung kann sowohl den Gegenstand ihres mutigen Auftretens als auch ihr Eintreten für die Bürger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύν τε τούτοις
  choice: Zusammen mit diesen
  rationale: Bewahrt die additive Verbindung und den demonstrativen Rückbezug, ohne dessen Bezug näher festzulegen.
- source_word: οἱ περὶ τῶν πολιτῶν θρασυνθέντες
  choice: diejenigen, die hinsichtlich der Bürger Mut gefasst hatten
  rationale: Gibt das passive θρασυνθέντες als ein Mutigwerden wieder und lässt mit »hinsichtlich« offen, ob die Bürger Gegenstand ihrer Kühnheit waren oder ob sie für deren Sache eintraten.
- source_word: οὐκ ἠνείχοντο
  choice: konnten ... es nicht länger ertragen
  rationale: Die Form bezeichnet ein fortdauerndes Nicht-ertragen-Können oder Nicht-hinnehmen-Wollen; »nicht länger« bringt den Verlauf in idiomatischem Deutsch zum Ausdruck.
- source_word: τέλεον
  choice: mit aller Entschiedenheit
  rationale: Das adverbial gebrauchte Wort verstärkt das anhaltende Drängen und wird im Deutschen natürlich wiedergegeben.
- source_word: αὐτοῦ ἐπικειμένου
  choice: dass er ... darauf drängte
  rationale: Der Genitivus absolutus wird als abhängiger Umstandssatz wiedergegeben; ἐπίκειμαι bezeichnet hier nachdrückliches Drängen oder Beharren, ohne dass das im Griechischen unausgesprochene Objekt ergänzt wird.
- source_word: τὸ τῆς προθέσεως ἐκπληροῦν
  choice: seinen Vorsatz auszuführen
  rationale: πρόθεσις bezeichnet hier die gefasste Absicht beziehungsweise den Plan; »Vorsatz« vermeidet eine unnötige theologische Färbung.
- source_word: διανοουμένου
  choice: gedachte
  rationale: Gibt die überlegte Absicht knapp und in würdigem, noch geläufigem Deutsch wieder.
