  text: But some, lightly despising the supports of the city's piety, readily gave themselves over, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: de
  text: Einige aber verachteten leichtfertig die Stützen der Frömmigkeit der Stadt[a] und lieferten sich bereitwillig aus, als würden sie durch den künftigen Umgang mit dem König[b] an großem Ansehen teilhaben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Grundlagen der Frömmigkeit der Stadt«. Das griechische Wort gebraucht das Bild tragender Strukturen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »durch die künftige Verbindung mit dem König«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: Einige
  rationale: Bezeichnet unbestimmt einen Teil der Bevölkerung und bewahrt den Kontrast zur größeren Gruppe.
- source_word: ἐπιπολαίως
  choice: leichtfertig
  rationale: Gibt die oberflächliche, unbedachte Haltung idiomatisch wieder, ohne ein bestimmtes Motiv hinzuzufügen.
- source_word: στυγοῦντες
  choice: verachteten
  rationale: Bewahrt die starke ablehnende Wertung; zusammen mit »leichtfertig« bezeichnet es geringschätzige Zurückweisung statt bloß emotionalen Hasses.
- source_word: τὰς τῆς πόλεως εὐσεβείας ἐπιβάθρας
  choice: die Stützen der Frömmigkeit der Stadt
  rationale: Bewahrt die Metapher tragender Strukturen und lässt offen, welche konkreten Einrichtungen oder Verpflichtungen gemeint sind.
- source_word: εὐσεβείας
  choice: Frömmigkeit
  rationale: Bezeichnet ehrfürchtige religiöse Hingabe in ihrem städtischen Zusammenhang, ohne den Ausdruck auf spätere christliche Terminologie zu verengen.
- source_word: εὐχερῶς
  choice: bereitwillig
  rationale: Bringt sowohl die geringe Hemmschwelle als auch das freiwillige Handeln zum Ausdruck.
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: gaben sich hin
  rationale: Erhält den reflexiven und freiwilligen Sinn der Wendung in natürlichem Deutsch.
- source_word: ὡς
  choice: als würden
  rationale: Kennzeichnet die Erwartung aus Sicht der Handelnden, ohne sie als objektive Tatsache zu bestätigen.
- source_word: μεγάλης τινὸς ... εὐκλείας
  choice: an großem Ansehen
  rationale: εὐκλεία bezeichnet guten Ruf oder Ruhm im sozialen Sinn; »Ansehen« vermeidet unnötige theologische Konnotationen.
- source_word: κοινωνήσοντες
  choice: teilhaben
  rationale: Gibt die erwartete Beteiligung an dem erhofften Ansehen präzise und idiomatisch wieder.
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: durch den künftigen Umgang mit dem König
  rationale: συναναστροφή bezeichnet gesellschaftlichen Umgang oder Verbindung; »künftig« bildet das Partizip ἐσομένης ab, ohne eine besondere Vertrautheit zu unterstellen.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im hellenistisch-jüdischen städtisch-religiösen Kontext
  choice: Frömmigkeit
  alternative: Gottesfurcht; Religion; Ehrfurcht
  rationale: »Frömmigkeit« bewahrt den religiösen Ernst und die Einbettung in das Gemeinwesen, ohne den Begriff konfessionell oder ausschließlich innerlich festzulegen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit natürlichem Satzfluss. Die tragende Metapher wird beibehalten; die subjektive und möglicherweise verfehlte Erwartung der Handelnden bleibt durch »als würden« erkennbar.
