  text: For your dwelling place is the heaven of heaven[b][a], unreachable by men.
translation:
  language: de
  text: Denn deine Wohnstätte ist der Himmel der Himmel[a], für Menschen unerreichbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nahe: „der Himmel des Himmels“; die semitisch geprägte Wendung bezeichnet den höchsten Himmel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  choice: Wohnstätte
  rationale: Das Substantiv bezeichnet einen Ort des Wohnens. „Wohnstätte“ bewahrt den konkreten räumlichen Sinn und passt zum würdevollen Gebetsregister.
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: der Himmel der Himmel
  rationale: Die griechische Genitivfügung ist semitisch geprägt und hebt den höchsten Himmel hervor. Die traditionelle deutsche Form bewahrt Bild und Struktur, ohne die Aussage vorschnell auf eine bloße Superlativparaphrase zu reduzieren.
- source_word: ἀνέφικτος
  choice: unerreichbar
  rationale: Das Adjektiv bezeichnet, was nicht erreicht oder erlangt werden kann. „Unerreichbar“ ist natürlich und erhält den Gedanken menschlicher Unzugänglichkeit.
- source_word: ἀνθρώποις
  choice: für Menschen
  rationale: Der Dativ bezeichnet diejenigen, denen die Wohnstätte unerreichbar ist. „Menschen“ gibt den allgemeinen Bezug auf die Menschheit geschlechtsübergreifend und genau wieder.
theological_decisions:
- issue: Wiedergabe der semitisch geprägten Wendung οὐρανὸς τοῦ οὐρανοῦ
  choice: der Himmel der Himmel
  alternative: der höchste Himmel
  rationale: Die wörtlich nahe Form bewahrt die transzendente Bildsprache und den Anklang an biblische Genitivsteigerungen. Die gemeinte Steigerung wird in einer Fußnote erklärt, ohne sie im Haupttext festzulegen.
- issue: Reichweite von ἀνθρώποις
  choice: für Menschen
  alternative: für die Menschen
  rationale: Das griechische Wort meint Menschen allgemein, nicht speziell Männer. Die artikellose deutsche Form bringt diesen generischen Sinn knapp und natürlich zum Ausdruck.
translation_notes:
  register: Moderne, würdige Gebetssprache. „Wohnstätte“ und „Himmel der Himmel“ erhalten den erhöhten Ton und die biblische Bildwelt; „für Menschen“ bleibt zugleich klar und inklusiv.
