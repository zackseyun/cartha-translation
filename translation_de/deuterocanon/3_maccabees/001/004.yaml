revisions:
- from: Als aber der Kampf heftig geworden war und sich die Lage immer mehr zugunsten des Antiochus entwickelte, ging Arsinoë durch die Reihen der Truppen und redete ihnen eindringlich zu. Voller Mitgefühl und unter Tränen, mit offenem Haar, forderte sie sie auf, mutig für sich selbst, ihre Kinder und ihre Frauen einzutreten. Dabei versprach sie jedem im Fall des Sieges zwei Minen Gold.[a]
  to: Als aber der Kampf heftig geworden war und sich die Lage zunehmend zugunsten des Antiochus festigte, ging Arsinoë durch die Reihen der Truppen und redete ihnen eindringlich zu. Mit Klagen und Tränen und mit offenem Haar forderte sie sie auf, sich selbst, ihren Kindern und ihren Frauen mutig beizustehen. Dabei versprach sie jedem im Fall des Sieges zwei Minen Gold.[a]
  rationale: Die Revision beseitigt eine unnötige psychologische Festlegung bei οἶκτος, gibt βοηθεῖν semantisch genauer wieder und schärft die Wiedergabe des sich zugunsten Antiochus festigenden Kriegsverlaufs. Bedeutung, Register, Namensform und die nicht umgerechnete antike Einheit bleiben erhalten.
