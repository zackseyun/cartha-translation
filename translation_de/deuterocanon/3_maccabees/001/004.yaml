    issue: „Voller Mitgefühl“ für μετὰ οἴκτου καὶ δακρύων
    rationale: Die Formulierung weist das Mitleid eindeutig Arsinoë als innere Haltung zu. Im Kontext kann οἶκτος vielmehr ihre klagende bzw. flehentliche Art des Appells bezeichnen. „Mit Klagen und Tränen“ bildet dies ohne psychologische Festlegung ab.
  - severity: medium
    issue: „für sich selbst, ihre Kinder und ihre Frauen einzutreten“ für βοηθεῖν
    rationale: „Für jemanden eintreten“ bedeutet im Deutschen vor allem Fürsprache oder Engagement. βοηθεῖν bezeichnet hier unmittelbares Helfen bzw. Beistehen; „beizustehen“ wahrt den Sinn auch im militärischen Kontext.
  - severity: low
    issue: „entwickelte“ für ἐρρωμένων
    rationale: „Entwickelte“ ist verständlich, gibt aber das Erstarken bzw. Sich-Festigen weniger deutlich wieder. „Sich zunehmend ... festigte“ trägt den Bildwert genauer.
