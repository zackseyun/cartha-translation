base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/004.yaml
  text: And when the battle had become fierce and affairs were turning more strongly in Antiochus’s favor[a], Arsinoe went repeatedly among the troops and earnestly urged them, with pity and tears, her hair let down, to help themselves and their children and wives courageously, promising to give two minas of gold to each man if they won.
translation:
  language: de
  text: Als aber der Kampf heftig geworden war und sich die Lage zunehmend zugunsten des Antiochus festigte, ging Arsinoë durch die Reihen der Truppen und redete ihnen eindringlich zu. Mit Klagen und Tränen und mit offenem Haar forderte sie sie auf, sich selbst, ihren Kindern und ihren Frauen mutig beizustehen. Dabei versprach sie jedem im Fall des Sieges zwei Minen Gold.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Mine war in der Antike eine Gewichts- und Geldeinheit. Jedem wurden im Fall des Sieges zwei Minen Gold versprochen.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης δὲ καρτερᾶς μάχης
  choice: Als aber der Kampf heftig geworden war
  rationale: Der Genitivus absolutus gibt den Hintergrund an; „heftig“ gibt die Stärke und Härte von καρτερός in natürlichem Deutsch wieder.
- source_word: τῶν πραγμάτων μᾶλλον ἐρρωμένων τῷ Ἀντιόχῳ
  choice: und sich die Lage immer mehr zugunsten des Antiochus entwickelte
  rationale: πράγματα bezeichnet hier die militärische Lage; μᾶλλον und ἐρρωμένων zeigen, dass sie sich zunehmend zugunsten des Antiochus festigte.
- source_word: ἱκανῶς
  choice: eindringlich
  rationale: Das Adverb verstärkt in diesem Zusammenhang Arsinoës Appell; „eindringlich“ passt zur emotionalen Schilderung.
- source_word: ἐπιπορευσαμένη τὰς δυνάμεις
  choice: ging ... durch die Reihen der Truppen
  rationale: Die Wendung beschreibt ihre Bewegung durch beziehungsweise unter den Streitkräften. Eine Wiederholung ist im griechischen Verb nicht eindeutig ausgedrückt und wird daher nicht ergänzt.
- source_word: παρεκάλει
  choice: redete ihnen ... zu; forderte sie auf
  rationale: Das Verb bezeichnet hier einen nachdrücklichen Appell und regiert den folgenden Infinitiv. Die zweiteilige deutsche Wiedergabe hält den Satz klar und natürlich.
- source_word: μετὰ οἴκτου καὶ δακρύων
  choice: Voller Mitgefühl und unter Tränen
  rationale: οἶκτος kann Mitgefühl oder einen Mitleid erregenden Ausdruck bezeichnen. „Voller Mitgefühl“ wahrt die emotionale Aussage, ohne sie konfessionell oder psychologisch zu überfrachten.
- source_word: τοὺς πλοκάμους λελυμένη
  choice: mit offenem Haar
  rationale: Wörtlich sind ihre Haarlocken gelöst; „mit offenem Haar“ ist die natürliche deutsche Bezeichnung für diese sichtbare Geste der Not und Bitte.
- source_word: βοηθεῖν ἑαυτοῖς τε καὶ τοῖς τέκνοις καὶ ταῖς γυναιξὶν θαρραλέως
  choice: mutig für sich selbst, ihre Kinder und ihre Frauen einzutreten
  rationale: βοηθεῖν bedeutet helfen oder zu Hilfe kommen. „Für ... eintreten“ ist im Kampfzusammenhang verständlich, ohne das weitergehende „verteidigen“ zwingend einzutragen; θαρραλέως wird mit „mutig“ wiedergegeben.
- source_word: ἐπαγγελλομένη δώσειν νικήσασιν
  choice: Dabei versprach sie ... im Fall des Sieges
  rationale: Das aoristische Partizip νικήσασιν bezeichnet die Empfänger unter der Bedingung ihres Sieges; „im Fall des Sieges“ drückt dies knapp aus.
- source_word: ἑκάστῳ δύο μνᾶς χρυσίου
  choice: jedem ... zwei Minen Gold
  rationale: ἑκάστῳ ist distributiv; μνᾶ bleibt als antike Gewichts- und Geldeinheit transliteriert, statt einen unsicheren modernen Gegenwert einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Periodensatz wird zur besseren Verständlichkeit in drei Sätze gegliedert. Der Name wird in deutscher Form als „Arsinoë“ geschrieben; die historische Einheit „Mine“ bleibt erhalten.
