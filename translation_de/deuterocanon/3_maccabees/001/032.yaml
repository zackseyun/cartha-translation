base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/032.yaml
  text: But most of them[a] took courage with a noble spirit, did not depart from piety[c][b], exchanging even their possessions for life, and boldly sought to rescue themselves from the registrations.
translation:
  language: de
  text: Die meisten aber fassten mit edlem Mut neue Kraft und wichen nicht von der Gottesfurcht[a] ab. Sie gaben sogar ihren Besitz hin, um am Leben zu bleiben, und suchten sich unerschrocken den amtlichen Erfassungen[b] zu entziehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frömmigkeit“ beziehungsweise „Gottesverehrung“. Das griechische Wort εὐσέβεια bezeichnet ehrfürchtige Hingabe und Treue gegenüber Gott.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die behördlich auferlegte Eintragung oder Aufnahme in amtliche Listen, nicht unbedingt eine Volkszählung im heutigen Sinn.
    reason: cultural_note
  - marker: c
    text: Der griechische Wortlaut des letzten Satzteils ist in der überlieferten Form, besonders beim Verb ἐτιμῶντο, schwierig. Die Übersetzung gibt als wahrscheinlichen Sinn wieder, dass sie sich aktiv um Befreiung von den amtlichen Erfassungen bemühten.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: Die meisten aber
  rationale: Die Wendung bezeichnet die Mehrheit; δέ markiert hier den Gegensatz zum vorausgehenden Verhalten.
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: fassten mit edlem Mut neue Kraft
  rationale: Die modale Dativverbindung bezeichnet eine edle, tapfere innere Haltung. Die Formulierung gibt ἐνίσχυσαν als Erstarken beziehungsweise Mutgewinnen wieder, ohne ψυχή technisch als „Seele“ zu verstehen.
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: wichen nicht von der Gottesfurcht ab
  rationale: διίστημι mit Genitiv bedeutet hier, sich von etwas zu entfernen oder es aufzugeben. „Gottesfurcht“ gibt εὐσέβεια im jüdischen Kontext als ehrfürchtige Treue zu Gott verständlich wieder.
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: Sie gaben sogar ihren Besitz hin, um am Leben zu bleiben
  rationale: χρήματα bezeichnet Besitz oder Vermögen; τε wird mit „sogar“ berücksichtigt. Die natürliche deutsche Formulierung bewahrt den Gedanken, den Besitz für das Weiterleben einzutauschen.
- source_word: ἀδέως
  choice: unerschrocken
  rationale: Das Adverb bezeichnet ein Handeln ohne Furcht und passt idiomatisch zur entschlossenen Bemühung.
- source_word: ἐτιμῶντο ... ῥύσασθαι
  choice: suchten sich ... zu entziehen
  rationale: Die überlieferte Verbform ἐτιμῶντο ist in diesem Zusammenhang schwierig. Die Wiedergabe drückt vorsichtig die wahrscheinliche praktische Zielrichtung aus, ohne eine unsichere Einzeldeutung als sicher auszugeben.
- source_word: ἐκ τῶν ἀπογραφῶν
  choice: den amtlichen Erfassungen zu entziehen
  rationale: ἀπογραφή bezeichnet eine behördliche Registrierung oder Eintragung. Der Plural des griechischen Textes bleibt erhalten; „amtliche Erfassungen“ vermeidet die moderne Engführung auf eine allgemeine Volkszählung.
theological_decisions:
- issue: Bedeutung von εὐσέβεια im jüdischen Verfolgungskontext
  choice: Gottesfurcht
  alternative: Frömmigkeit; Gottesverehrung
  rationale: Gemeint ist ehrfürchtige, gelebte Treue zu Gott und zur überlieferten Religion. „Gottesfurcht“ ist im Deutschen religiös klar und vermeidet eine bloß äußerliche oder konfessionell verengte Deutung.
- issue: Deutung der schwierigen Konstruktion mit ἐτιμῶντο
  choice: idiomatisch als „suchten sich … zu entziehen“
  alternative: „hielten es für erstrebenswert, sich zu befreien“; „bemühten sich, freizukommen“
  rationale: Die syntaktisch schwierige Überlieferung lässt keine völlig sichere Präzisierung zu. Der Haupttext gibt den wahrscheinlichen Sinn aktiver Bemühung wieder; eine Fußnote legt die Unsicherheit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierungen bleiben auch für heutige Leser verständlich, bewahren aber den ernsten Ton der Verfolgungserzählung. Die schwierige Schlussklausel wird im Haupttext lesbar und in der Fußnote transparent wiedergegeben.
