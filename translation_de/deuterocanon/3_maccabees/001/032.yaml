  source_fidelity: 'Die Übersetzung gibt die Satzglieder des griechischen Textes zuverlässig wieder: οἱ πλεῖστοι als „Die meisten“, die mutige Haltung als „fassten ... neue Kraft“, das Festhalten an εὐσέβεια, den Besitztausch zum Überleben, ἀδέως als „unerschrocken“ und die Befreiung von den pluralischen ἀπογραφαί. Die unsichere Bedeutung von ἐτιμῶντο wird nicht als sichere philologische Deutung ausgegeben, sondern angemessen durch eine Anmerkung ausgewiesen.'
