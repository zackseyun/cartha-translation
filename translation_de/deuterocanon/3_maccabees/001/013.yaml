  text: And he inquired for what reason no one among those present had prevented him from entering any sanctuary[a].
translation:
  language: de
  text: Und er erkundigte sich, aus welchem Grund niemand von den Anwesenden ihn daran gehindert hatte, jeden heiligen Bezirk[a] zu betreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den ganzen heiligen Bezirk«. Das griechische πᾶν τέμενος kann sowohl distributiv als auch kollektiv verstanden werden; τέμενος bezeichnet allgemein einen geweihten Bezirk und nicht nur ein Tempelgebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπυνθάνετο
  choice: er erkundigte sich
  rationale: Das Imperfekt von πυνθάνομαι bezeichnet ein Nachfragen beziehungsweise Einholen von Auskunft; »erkundigte sich« wahrt den gehobenen Erzählton.
- source_word: διὰ τίνα αἰτίαν
  choice: aus welchem Grund
  rationale: Die Wendung fragt ausdrücklich nach Ursache oder Grund und wird im Deutschen natürlich mit »aus welchem Grund« wiedergegeben.
- source_word: αὐτὸν εἰσερχόμενον
  choice: ihn daran gehindert hatte, … zu betreten
  rationale: Das auf αὐτόν bezogene Partizip steht in Verbindung mit ἐκώλυσεν. Die deutsche Konstruktion mit »daran hindern, … zu« gibt dieses Verhältnis idiomatisch wieder.
- source_word: πᾶν τέμενος
  choice: jeden heiligen Bezirk
  rationale: τέμενος bezeichnet einen geweihten beziehungsweise heiligen Bezirk und nicht zwingend nur ein Tempelgebäude. »Jeden« bildet den distributiven Sinn von πᾶν unmittelbar ab; die mögliche kollektive Lesart wird in der Fußnote bewahrt.
- source_word: οὐθεὶς ἐκώλυσεν
  choice: niemand … gehindert hatte
  rationale: κωλύω bedeutet hindern, abhalten oder verwehren. Das Plusquamperfekt fügt sich natürlich in die indirekte, auf einen vorausliegenden Vorgang bezogene Frage.
- source_word: τῶν παρόντων
  choice: von den Anwesenden
  rationale: Der partitive Genitiv bezeichnet die Gruppe, aus der niemand eingeschritten war; »niemand von den Anwesenden« ist präzises und natürliches Deutsch.
theological_decisions: []
