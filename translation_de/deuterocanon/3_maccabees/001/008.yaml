  register: Modernes, würdevolles Standarddeutsch. Die lange Satzstruktur des Griechischen bleibt erkennbar, wird aber durch eine klare Relativkonstruktion lesbar gemacht. Die beiden Ausdrücke für den Ältestenrat und die Ältesten werden nicht eingeebnet.
