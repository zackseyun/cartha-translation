base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/008.yaml
  text: But when the Jews had sent to him[a], from the council of elders and the elders, men to greet him, bring gifts of hospitality, and rejoice over what had happened[b], it happened that he became all the more eager to come to them as quickly as possible.
translation:
  language: de
  text: Als aber die Juden vonseiten des Ältestenrats[a] und der Ältesten Männer zu ihm gesandt hatten, um ihn zu begrüßen, Gastgeschenke[b] zu überbringen und sich über das Geschehene zu freuen, geschah es, dass er umso eifriger danach strebte, so schnell wie möglich zu ihnen zu kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Senat“; das griechische Wort γερουσία bezeichnet ein institutionelles Gremium von Ältesten.
    reason: lexical_alternative
  - marker: b
    text: „Gastgeschenke“ sind Geschenke, die mit der Aufnahme oder Ehrung eines Gastes verbunden waren.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεμψαμένων
  choice: gesandt hatten
  rationale: Der Genitivus absolutus bezeichnet eine vorausgehende Handlung; die Formulierung gibt dies natürlich und ohne unnötige Präzisierung wieder.
- source_word: γερουσίας
  choice: Ältestenrat
  rationale: Das Wort bezeichnet ein institutionelles Gremium von Ältesten; „Ältestenrat“ ist im Deutschen verständlich und vermeidet die römische Färbung von „Senat“.
- source_word: πρεσβυτέρων
  choice: Ältesten
  rationale: Die Bezeichnung bleibt neben γερουσία eigenständig erhalten, statt beide Ausdrücke zusammenzuziehen.
- source_word: τοὺς ἀσπασομένους αὐτὸν
  choice: Männer …, die ihn begrüßen … sollten
  rationale: Das substantivierte Partizip bezeichnet die entsandten Personen und im Zusammenhang ihren Auftrag.
- source_word: ξένια
  choice: Gastgeschenke
  rationale: Der Ausdruck bezeichnet Geschenke im Zusammenhang mit Gastfreundschaft beziehungsweise der Ehrung eines Gastes.
- source_word: κομιοῦντας
  choice: überbringen
  rationale: Das Verb beschreibt hier, dass die Abgesandten die Gastgeschenke zum König bringen.
- source_word: ἐπὶ τοῖς συμβεβηκόσιν
  choice: über das Geschehene
  rationale: Die allgemeine Formulierung bewahrt die Unbestimmtheit des griechischen Ausdrucks.
- source_word: χαρησομένους
  choice: sich … freuen sollten
  rationale: Das zukünftige Partizip bezeichnet wie die übrigen Partizipien den beabsichtigten Auftrag beziehungsweise die erwartete Reaktion der Gesandten.
- source_word: συνέβη
  choice: wurde … dazu bewogen
  rationale: Im Deutschen wird das eintretende Ergebnis natürlicher direkt am Subjekt ausgedrückt; der Ereignis- und Ergebnischarakter des griechischen Ausdrucks bleibt erhalten.
- source_word: μᾶλλον ... προθυμηθῆναι
  choice: wurde er umso mehr dazu bewogen
  rationale: „Umso mehr“ erhält die Steigerung; „dazu bewogen“ gibt die verstärkte Bereitschaft wieder, ohne übermäßige emotionale Intensität einzutragen.
- source_word: ὡς τάχιστα
  choice: so schnell wie möglich
  rationale: Die feste Wendung drückt größtmögliche Eile aus.
- source_word: πρὸς αὐτοὺς παραγενέσθαι
  choice: zu ihnen zu kommen
  rationale: Die schlichte Wiedergabe entspricht dem räumlichen und persönlichen Sinn des Verbs.
