revisions:
- from: Als aber die Juden aus dem Ältestenrat[a] und aus der Mitte der Ältesten Männer zu ihm gesandt hatten, die ihn begrüßen, Gastgeschenke[b] überbringen und sich über das Geschehene freuen sollten, wurde er umso mehr dazu bewogen, so schnell wie möglich zu ihnen zu kommen.
  to: Als aber die Juden vonseiten des Ältestenrats[a] und der Ältesten Männer zu ihm gesandt hatten, um ihn zu begrüßen, Gastgeschenke[b] zu überbringen und sich über das Geschehene zu freuen, geschah es, dass er umso eifriger danach strebte, so schnell wie möglich zu ihnen zu kommen.
  rationale: Die Revision beseitigt die unbelegte Ergänzung „aus der Mitte“ und stellt die unpersönliche Ergebnisformulierung sowie die gesteigerte Bereitschaft des Königs quellennah wieder her. Die Satzstruktur, die Unbestimmtheit von „das Geschehene“ und die vorhandenen Fußnotenanker bleiben erhalten.
