    rationale: Der griechische Text lautet ἀπὸ τῆς γερουσίας καὶ τῶν πρεσβυτέρων („vonseiten/aus dem Ältestenrat und von den Ältesten“). „Aus der Mitte“ fügt eine nicht belegte Vorstellung hinzu.
  - severity: high
    issue: „wurde er ... dazu bewogen“ für συνέβη ... προθυμηθῆναι
    rationale: Die Formulierung macht aus der Aussage über seine gesteigerte Bereitschaft eine äußere Veranlassung. συνέβη leitet unpersönlich das Ergebnis ein, während προθυμηθῆναι seine verstärkte Bereitwilligkeit bzw. seinen Eifer ausdrückt.
