  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Entsendung, die beiden ausdrücklich unterschiedenen jüdischen Gruppen, den Auftrag der Gesandten und die Eile zutreffend wieder. „Aus der Mitte der Ältesten“ hat jedoch im Griechischen keine Entsprechung; ἀπό bezieht sich hier koordiniert auf γερουσία und πρεσβύτεροι. Vor allem gibt „wurde ... dazu bewogen“ συνέβη ... προθυμηθῆναι kausativ und zu schwach wieder: Der Text sagt, dass er umso eifriger/bereiter wurde, nicht dass ihn etwas bewog.'
  naturalness: „Vonseiten des Ältestenrats und der Ältesten“ ist idiomatisches modernes Standarddeutsch und erhält die Unterscheidung beider Gruppen. Die finalen Infinitive machen den Auftrag der Abgesandten klar und lesen sich natürlich.
  terminology: „Ältestenrat“ für γερουσία, „Älteste“ für πρεσβύτεροι und „Gastgeschenke“ für ξένια sind angemessen. Die Fußnoten sind inhaltlich stimmig; die kulturelle Anmerkung wird sprachlich geglättet.
