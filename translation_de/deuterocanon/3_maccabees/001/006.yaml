  yaml_path: translation/deuterocanon/3_maccabees/001/006.yaml
  text: But after gaining control of the plot[b][a], he decided to visit the neighboring cities and encourage them.
translation:
  language: de
  text: Nachdem er jedoch die Oberhand über die Verschwörung gewonnen hatte,[a] beschloss er, die umliegenden Städte aufzusuchen und ihnen Mut zuzusprechen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem er die Verschwörung unter Kontrolle gebracht hatte“ beziehungsweise „Nachdem er das Komplott niedergeschlagen hatte“. Das griechische Partizip κατακρατήσας kann ausdrücken, dass jemand gegenüber einem feindlichen Plan die Oberhand gewinnt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sie eindringlich aufzurufen“ beziehungsweise „und an sie zu appellieren“. Das griechische παρακαλέσαι kann „ermutigen“, „ermahnen“, „aufrufen“ oder „appellieren“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρατήσας
  choice: die Oberhand … gewonnen hatte
  rationale: Das Aoristpartizip von κατακρατέω bezeichnet hier, dass er sich gegenüber dem feindlichen Vorhaben durchsetzte. Die Formulierung wahrt die zeitliche Abfolge und legt nicht fest, auf welche Weise die Verschwörung überwunden wurde.
- source_word: ἐπιβουλῆς
  choice: über die Verschwörung
  rationale: ἐπιβουλή bezeichnet einen feindseligen Plan oder ein Komplott. „Verschwörung“ ist im politischen Zusammenhang natürlich, ohne so konkret wie „Mordanschlag“ zu werden.
- source_word: ἔκρινεν
  choice: beschloss
  rationale: Mit dem folgenden Infinitiv bedeutet κρίνω hier „entscheiden“ oder „sich entschließen“, nicht ein richterliches Urteilen.
- source_word: τὰς πλησίον πόλεις
  choice: die umliegenden Städte
  rationale: πλησίον bezeichnet die räumlich nahe gelegenen Städte. „Umliegend“ ist idiomatisches modernes Deutsch.
- source_word: ἐπελθὼν
  choice: aufzusuchen
  rationale: Das Partizip bezeichnet das Hingehen zu den Städten als Begleitumstand des παρακαλέσαι. „Aufsuchen“ gibt Bewegung und beabsichtigten Kontakt knapp und natürlich wieder.
- source_word: παρακαλέσαι
  choice: ihnen Mut zuzusprechen
  rationale: παρακαλέω kann ermutigen, ermahnen oder zu etwas aufrufen bedeuten. „Mut zusprechen“ ist in diesem Zusammenhang gut verständlich; das auf die Bewohner der Städte bezogene „ihnen“ wird zur Klarheit ergänzt.
theological_decisions: []
