revisions:
- from: Und nachdem er auch die gute Ordnung im Heiligtum[a] bewundert hatte, erwog er, seinen Eintritt in den Tempel zu planen.
  to: Und nachdem er auch die gute Ordnung des Heiligtums[a] bewundert hatte, überlegte er, den Tempel zu betreten.
  rationale: Die Revision ersetzt die im modernen Standarddeutsch sperrige Konstruktion „seinen Eintritt ... zu planen“ durch eine natürliche infinitivische Fügung. Sie gibt die deliberative, nicht endgültig entschiedene Bedeutung der griechischen Verbverbindung wieder. Zugleich wird die genitivische Beziehung bei „gute Ordnung des Heiligtums“ präzisiert; die terminologische und durch die Fußnote dokumentierte Unterscheidung zwischen ἱερόν und ναός bleibt erhalten.
