  yaml_path: translation/deuterocanon/3_maccabees/001/010.yaml
  text: And when he had marveled also at the good order of the sanctuary[a], he considered making plans to enter the temple.
translation:
  language: de
  text: Und nachdem er auch die gute Ordnung des Heiligtums[a] bewundert hatte, überlegte er, den Tempel zu betreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen hier zwei verschiedene Begriffe: ἱερόν bezeichnet den heiligen Gesamtbereich, während ναός das eigentliche Tempelgebäude meint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμάσας
  choice: nachdem er … bewundert hatte
  rationale: Das Partizip Aorist bezeichnet eine der Haupthandlung vorausgehende Reaktion; der temporale Nebensatz gibt diese Abfolge im Deutschen natürlich wieder.
- source_word: εὐταξίαν
  choice: gute Ordnung
  rationale: Die Wendung bewahrt sowohl den Gedanken einer geordneten Anlage beziehungsweise Verfassung als auch die positive Wertung des griechischen Substantivs.
- source_word: ἱεροῦ
  choice: Heiligtum
  rationale: ἱερόν bezeichnet hier den heiligen Gesamtbereich und wird von ναός, dem eigentlichen Tempelgebäude, unterschieden.
- source_word: ἐνεθυμήθη
  choice: erwog er
  rationale: Die Wiedergabe bezeichnet inneres Überlegen, ohne bereits einen festen Entschluss auszudrücken.
- source_word: βουλεύσασθαι
  choice: zu planen
  rationale: Der Infinitiv bezeichnet ein überlegtes Planen; die Formulierung erhält neben ἐνεθυμήθη die zusätzliche Nuance der Absichtsbildung.
- source_word: ναὸν
  choice: Tempel
  rationale: ναός bezeichnet hier im Unterschied zum zuvor genannten ἱερόν das eigentliche Tempelgebäude.
- source_word: εἰσελθεῖν
  choice: seinen Eintritt
  rationale: Die substantivische deutsche Fügung gibt das Hineingehen wieder und verbindet sich natürlich mit „planen“.
theological_decisions:
- issue: Unterscheidung zwischen ἱερόν und ναός im selben Vers
  choice: ἱερόν mit „Heiligtum“ und ναός mit „Tempel“ wiedergeben
  alternative: Beide Begriffe mit „Tempel“ wiedergeben
  rationale: Der griechische Text verwendet bewusst zwei verschiedene Bezeichnungen für den heiligen Gesamtbereich und das eigentliche Tempelgebäude. Die Unterscheidung lässt die Bewegung vom Bewundern des Bereichs zum geplanten Betreten des Tempels erkennen.
- issue: Verhältnis von ἐνεθυμήθη und βουλεύσασθαι
  choice: „erwog er, … zu planen“
  alternative: „beschloss er, den Tempel zu betreten“
  rationale: Die gewählte Fassung bewahrt die zweifache Nuance von innerem Erwägen und Planen und macht daraus noch keinen endgültigen Entschluss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der temporale Nebensatz ist natürlicher als eine wörtliche Partizipialkonstruktion; „erwog … zu planen“ bewahrt trotz leichter formaler Schwere die im Griechischen vorhandene doppelte Nuance des Überlegens und Planens.
