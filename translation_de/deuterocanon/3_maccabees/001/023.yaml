  text: But when they cried out to make a rush for the weapons, and to die courageously under the ancestral law, they caused considerable turmoil in the place, and only with difficulty by the old men and the elders
translation:
  language: de
  text: Als sie aber laut riefen, man solle zu den Waffen stürmen[a] und mutig für das Gesetz der Vorfahren sterben[b], verursachten sie an diesem Ort erhebliche Unruhe; und nur mit Mühe durch die alten Männer und die Ältesten …[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf die Waffen zustürmen“. Gemeint ist wahrscheinlich ein Sturm zu den Waffen, um sie zu ergreifen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wegen des Gesetzes der Vorfahren“ beziehungsweise „unter der Verpflichtung des Gesetzes der Vorfahren“. Die ungewöhnliche griechische Verbindung kann Sterben aus Treue zu diesem Gesetz bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Der hier vorgelegte griechische Text bricht nach „durch die alten Männer und die Ältesten“ mitten im Satz ab. Deshalb wird die Aussage nicht durch Wörter aus anderen Textzeugen ergänzt.
    reason: textual_variant
lexical_decisions:
- source_word: φωνήσαντες
  choice: als sie aber laut riefen
  rationale: Das aoristische Partizip bezeichnet den auslösenden Zuruf; „laut riefen“ gibt die hörbare Dringlichkeit natürlich wieder.
- source_word: τὴν ὁρμὴν ἐπὶ τὰ ὅπλα ποιήσασθαι
  choice: man solle auf die Waffen losstürmen
  rationale: ὁρμή bezeichnet einen heftigen Vorstoß, während ἐπί mit Akkusativ die Bewegung auf die Waffen zu ausdrückt. Die unbestimmte Aufforderung mit „man solle“ bewahrt, dass im Griechischen die Rufenden nicht ausdrücklich selbst Subjekt der Infinitive sein müssen.
- source_word: θαρραλέως
  choice: mutig
  rationale: Das Adverb bezeichnet entschlossene Tapferkeit angesichts des Todes; „mutig“ ist klar, würdig und modern.
- source_word: ὑπὸ τοῦ πατρῴου νόμου
  choice: für das überlieferte Gesetz
  rationale: Das ungewöhnliche ὑπό bezeichnet hier am ehesten den Grund oder die bindende Sache, um derentwillen man sterben will. „Überliefert“ gibt πατρῷος natürlich wieder, ohne eine rein biologische Väterlinie zu betonen.
- source_word: τελευτᾷν
  choice: sterben
  rationale: Der Infinitiv bedeutet hier direkt „sterben“; eine Umschreibung würde keinen zusätzlichen Sinn gewinnen.
- source_word: ἱκανὴν ... τραχύτητα
  choice: erhebliche Unruhe
  rationale: τραχύτης hat wörtlich die Färbung von Rauheit oder Härte, bezeichnet im erzählerischen Zusammenhang jedoch eine ernsthafte tumultartige Störung.
- source_word: μόλις
  choice: nur mit Mühe
  rationale: Die Wendung eröffnet eine Fortsetzung darüber, was nur mit Mühe erreicht wurde; wegen des abbrechenden Quellenauszugs bleibt sie absichtlich unvollständig.
- source_word: γεραιῶν
  choice: alten Männer
  rationale: Die Altersbezeichnung wird von πρεσβύτεροι unterschieden und daher nicht ebenfalls mit „Ältesten“ wiedergegeben.
- source_word: πρεσβυτέρων
  choice: Ältesten
  rationale: Der Ausdruck kann anerkannte ältere beziehungsweise führende Gemeindeglieder bezeichnen und bleibt von γεραιοί lexikalisch unterschieden.
theological_decisions:
- issue: Bedeutung von πατρῷος νόμος
  choice: das überlieferte Gesetz
  alternative: das väterliche Gesetz / das Gesetz der Vorfahren
  rationale: Die Formulierung wahrt den Bezug auf das von den Vorfahren empfangene jüdische Gesetz, ohne eine spätere konfessionelle Terminologie einzutragen.
- issue: Deutung von ὑπὸ τοῦ πατρῴου νόμου
  choice: für das überlieferte Gesetz
  alternative: unter dem überlieferten Gesetz / wegen des überlieferten Gesetzes
  rationale: Die griechische Verbindung ist semantisch gedrängt. „Für“ gibt im Kontext die Loyalität wieder, um derentwillen die Menschen zu sterben bereit sind; die mögliche kausale beziehungsweise verpflichtende Nuance wird in der Fußnote offengehalten.
- issue: Unvollständiger Schluss des bereitgestellten griechischen Zeugnisses
  choice: Den Abbruch sichtbar bewahren
  alternative: Den Satz anhand anderer Textausgaben ergänzen
  rationale: Der vorgelegte Text endet syntaktisch nach „den alten Männern und den Ältesten“. Eine Ergänzung würde nicht aus dem angegebenen Quellenausschnitt stammen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die energische Bewegung der Szene wird idiomatisch wiedergegeben; der syntaktisch unvollständige Schluss des bereitgestellten griechischen Quellenausschnitts bleibt durch Auslassungspunkte und Fußnote transparent.
