translation:
  language: de
  text: Tilge unsere Sünden[a], zerstreue unsere Verirrungen[b] und lass dein Erbarmen in dieser Stunde aufleuchten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wische unsere Sünden aus.“'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch „Fehler“, „Torheiten“ oder „Fehltritte“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Lass dein Erbarmen erscheinen“ beziehungsweise „Erweise dein Erbarmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάλειψον
  choice: Tilge
  rationale: Der Aoristimperativ von ἀπαλείφω bezeichnet das Abwischen oder Auslöschen. „Tilge“ bewahrt das Bild vollständiger Beseitigung und passt zum würdevollen Gebetsstil.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: unsere Sünden
  rationale: ἁμαρτία hat hier im Bußgebet eindeutig moralisch-religiöses Gewicht; „Sünden“ ist die klare und übliche Wiedergabe.
- source_word: διασκέδασον
  choice: zerstreue
  rationale: Das Verb bedeutet auseinanderstreuen oder zerstreuen. Die direkte Bildsprache bleibt so erhalten.
- source_word: τὰς ἀμβλακίας ἡμῶν
  choice: unsere Verirrungen
  rationale: Das seltene ἀμβλακία kann Fehler, Torheit oder törichte Fehlleistung bezeichnen. „Verirrungen“ wahrt die schuldhafte Färbung, unterscheidet den Ausdruck von „Sünden“ und klingt im Deutschen als Gegenstand von „zerstreuen“ verständlich.
- source_word: ἐπίφανον
  choice: lass ... aufleuchten
  rationale: ἐπιφαίνω bezeichnet ein Sichtbarwerden oder Aufleuchten. Die Formulierung bewahrt die Erscheinungs- und Lichtmetaphorik, ohne das Erbarmen lediglich mit „zeigen“ wiederzugeben.
- source_word: τὸ ἔλεός σου
  choice: dein Erbarmen
  rationale: ἔλεος bezeichnet erbarmende Zuwendung. „Erbarmen“ ist im deutschen Gebetsregister natürlich und gibt den personalen Charakter der erbetenen göttlichen Hilfe wieder.
- source_word: κατὰ τὴν ὥραν ταύτην
  choice: in dieser Stunde
  rationale: Die Wendung bezeichnet den gegenwärtigen, dringlichen Zeitpunkt. „In dieser Stunde“ ist idiomatisches Deutsch und erhält den feierlichen Ton.
theological_decisions:
- issue: Verhältnis von ἁμαρτίας und ἀμβλακίας
  choice: Die beiden Begriffe werden unterschieden als „Sünden“ und „Verirrungen“.
  alternative: Beide als weitgehend gleichbedeutende Schuldbegriffe wiedergeben oder ἀμβλακίας schärfer mit „Torheiten“ übersetzen.
  rationale: Der griechische Text verwendet zwei verschiedene Ausdrücke in einer steigernden Bitte. Die Unterscheidung bewahrt diese rhetorische Struktur, ohne daraus eine feste theologische Kategorie abzuleiten.
- issue: Bildgehalt von ἐπίφανον
  choice: Das Erbarmen soll „aufleuchten“.
  alternative: „Erweise dein Erbarmen“ oder „lass dein Erbarmen erscheinen“.
  rationale: Die gewählte Fassung erhält die epiphanische Bildsprache des Verbs und lässt zugleich offen, wie sich das göttliche Erbarmen konkret zeigt.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die drei Imperativbitten und ihre bildhafte Bewegung – tilgen, zerstreuen, aufleuchten lassen – bleiben erhalten; veraltete Satzstellung und unnötig konfessionell geprägte Begriffe werden vermieden.
