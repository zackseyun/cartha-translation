base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/030.yaml
  text: 'But so that he might not appear hateful to everyone[a], he added in writing: “But if some of them choose to live among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: de
  text: 'Damit er aber nicht bei allen als verhasst erschien, fügte er schriftlich hinzu: »Wenn aber einige von ihnen sich dafür entscheiden, unter denen zu leben, die in die Riten eingeweiht sind,[a] macht er sie zu Bürgern mit gleichen Rechten wie die Alexandriner.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter den in die Mysterien Eingeweihten«. Der griechische Ausdruck verwendet kultische Einweihungssprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεχθόμενος
  choice: sich bei allen verhasst machen
  rationale: Die mediale/passivische Form beschreibt hier, wie er anderen erscheint; die deutsche Wendung ist natürlich und bewahrt diesen Wahrnehmungsaspekt.
- source_word: ὑπέγραψεν
  choice: fügte er schriftlich hinzu
  rationale: Im Zusammenhang eines Erlasses bezeichnet das Verb einen schriftlich angefügten Zusatz oder Vorbehalt.
- source_word: προαιρῶνται
  choice: sich dafür entscheiden
  rationale: Gibt die bewusste Wahl oder Willensentscheidung des griechischen Verbs klar wieder.
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: unter denen, die in die Riten eingeweiht sind
  rationale: Bewahrt sowohl die kultische Bedeutung von τελεταί als auch die Einweihungssprache von μεμυημένοις, ohne eine bestimmte Mysterienreligion festzulegen.
- source_word: ἀναστρέφεσθαι
  choice: zu leben
  rationale: In Verbindung mit einer Personengruppe ist die Bedeutung 'leben/verkehren' gemeint; 'leben' ist im Deutschen natürlich und lässt eine soziale wie religiöse Lebensgemeinschaft zu.
- source_word: ἰσοπολίτας
  choice: als Bürger gleich
  rationale: Gibt den rechtlich-politischen Sinn gleicher Bürgerstellung knapp und präzise wieder.
- source_word: Ἀλεξανδρεῦσι
  choice: den Alexandrinern
  rationale: 'Der Dativ bezeichnet den Vergleichsmaßstab: Ihnen wird dieselbe Bürgerstellung wie den Alexandrinern eingeräumt.'
- source_word: ποιεῖ
  choice: stellt er
  rationale: Das Präsens der zitierten Verfügung bleibt erhalten; 'stellt ... gleich' formuliert ihre unmittelbare Rechtswirkung idiomatisch.
theological_decisions:
- issue: Kultische Einweihungssprache in einer hellenistisch-jüdischen Erzählung
  choice: Riten / eingeweiht
  alternative: Mysterien / eingeweiht
  rationale: Der griechische Text verwendet eindeutig kultische Einweihungssprache. 'Riten' bewahrt diesen Gehalt, ohne die Aussage unnötig auf eine bestimmte Form antiker Mysterienkulte festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verfügung wird als direktes Zitat wiedergegeben; die juristische Aussage ist idiomatisch formuliert, während die kultische Mehrdeutigkeit in der Fußnote erhalten bleibt.
