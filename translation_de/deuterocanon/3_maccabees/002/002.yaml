base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/002.yaml
  text: For you are the one who created all things and rules over all; you are a righteous sovereign[a], and you judge those who do anything in insolence and arrogance.
translation:
  language: de
  text: Denn du bist es, der alles erschaffen hat und über alles herrscht. Du bist ein gerechter Herrscher[a] und richtest die, die etwas in Anmaßung und Hochmut tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein rechtschaffener Herrscher“. Das griechische Wort δίκαιος kann „gerecht“ oder „rechtschaffen“ bedeuten; δυνάστης kann auch mit „Machthaber“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ γὰρ εἶ
  choice: Denn du bist es
  rationale: γάρ begründet die vorausgehende Bitte; die Wendung „du bist es“ gibt zugleich die Hervorhebung durch das ausdrückliche σὺ natürlich wieder.
- source_word: ὁ κτίσας τὰ πάντα
  choice: der alles erschaffen hat
  rationale: Das substantivierte Aoristpartizip wird verbal wiedergegeben; „alles“ bewahrt den umfassenden Sinn von τὰ πάντα.
- source_word: τῶν ὅλων ἐπικρατῶν
  choice: über das All herrscht
  rationale: ἐπικρατέω bezeichnet das Ausüben von Macht oder Herrschaft. „Das All“ erhält die leicht feierliche, umfassende Formulierung und unterscheidet sie stilistisch von τὰ πάντα.
- source_word: δυνάστης δίκαιος
  choice: ein gerechter Herrscher
  rationale: δυνάστης bezeichnet einen Machthaber oder Herrscher; δίκαιος beschreibt hier seine moralisch und richterlich gerechte Herrschaft. Die Wortfolge ist im Deutschen natürlich und würdevoll.
- source_word: τοὺς ... τι πράσσοντας
  choice: die ... handeln
  rationale: Das Partizip bezeichnet Menschen, deren Handeln von den folgenden Haltungen bestimmt ist. Das indefinite τι braucht im Deutschen hier nicht eigens mit „etwas“ wiedergegeben zu werden, da „handeln“ die Aussage idiomatisch und ohne sachliche Verengung trägt.
- source_word: ὕβρει
  choice: aus Übermut
  rationale: ὕβρις umfasst anmaßenden, frevelhaften Übermut und kann auch verletzende Grenzüberschreitung einschließen. „Übermut“ passt zum gehobenen Gebetsregister.
- source_word: ἀγερωχίᾳ
  choice: Hochmut
  rationale: Das Wort bezeichnet stolze, hochfahrende Selbstüberhebung. „Hochmut“ bildet neben „Übermut“ eine verständliche, klanglich passende Entsprechung.
- source_word: κρίνεις
  choice: richtest
  rationale: κρίνω hat hier richterlichen Sinn. „Richten“ bewahrt diesen, ohne das Ergebnis als Verurteilung vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe von δίκαιος als Eigenschaft des göttlichen Herrschers und Richters
  choice: gerecht
  alternative: rechtschaffen
  rationale: „Gerecht“ umfasst im Deutschen sowohl die moralische Rechtschaffenheit als auch die richterliche Gerechtigkeit und wahrt damit die Spannweite des griechischen Ausdrucks.
- issue: Stärke von κρίνεις
  choice: richtest
  alternative: verurteilst
  rationale: Der griechische Text spricht vom Richten, legt aber das Urteil nicht ausdrücklich als Verurteilung fest; deshalb wird die offenere richterliche Aussage bewahrt.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Der Satzbau bleibt nahe an der griechischen Begründungsfolge, klingt aber idiomatisch. „Übermut und Hochmut“ bewahrt die zwei verwandten, doch nicht völlig identischen Begriffe.
