base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/028.yaml
  text: Let no one who does not sacrifice enter their sanctuaries[a], but let all the Jews be subjected to registration and servant status[c][b], and let those who object be taken by force and put to death.
translation:
  language: de
  text: Niemand, der nicht opfert, darf ihre Heiligtümer[a] betreten. Alle Juden aber sollen registriert[b] und in den Sklavenstand[c] versetzt werden; diejenigen, die Einspruch erheben, sollen gewaltsam weggeführt und ums Leben gebracht werden.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre heiligen Bezirke“ beziehungsweise „ihre heiligen Dinge“. Das griechische τὰ ἱερά kann heilige Orte ebenso wie heilige Gegenstände oder kultische Belange bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sein kann genauer die Erfassung der Bevölkerung zur staatlichen Kontrolle oder Besteuerung.
    reason: cultural_note
  - marker: c
    text: Die griechische Wendung kann besonders den Stand von Hausbediensteten oder Haussklaven bezeichnen.
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „aus dem Leben entfernt werden“, das heißt: getötet werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδένα τῶν μὴ θυόντων
  choice: Niemand, der nicht opfert
  rationale: Die Konstruktion bezeichnet die Gruppe derer, die keine Opfer darbringen. Im Erlasskontext gibt der deutsche Indikativ mit „darf … nicht“ die prohibitive Kraft des griechischen Infinitivs natürlich wieder.
- source_word: ἐπὶ τὰ ἱερὰ αὐτῶν εἰσιέναι
  choice: ihre Heiligtümer betreten
  rationale: εἰσιέναι bezeichnet das Hineingehen oder Betreten; τὰ ἱερά kann heilige Orte, Bezirke oder Dinge bezeichnen. Der räumliche Ausdruck „Heiligtümer betreten“ passt hier am besten, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: λαογραφίαν
  choice: registriert
  rationale: λαογραφία bezeichnet die staatliche Erfassung der Bevölkerung, möglicherweise für Kontrolle oder Besteuerung. „Registriert“ bleibt bewusst weiter als „zur Steuer veranlagt“ oder „in eine Volkszählung aufgenommen“.
- source_word: οἰκετικὴν διάθεσιν
  choice: in den Sklavenstand versetzt
  rationale: Die Wendung bezeichnet eine auferlegte Stellung, wie sie Hausbediensteten beziehungsweise Haussklaven zukam. „Sklavenstand“ macht die rechtlich-soziale Erniedrigung klar und vermeidet die verharmlosende Wiedergabe „Dienstverhältnis“.
- source_word: ἀντιλέγοντας
  choice: die sich widersetzen
  rationale: Das Partizip kann Widerspruch, Gegenrede oder Widerstand bezeichnen. „Sich widersetzen“ erfasst im Kontext des Zwangserlasses sowohl verbale als auch praktische Opposition, ohne bloße ausdrückliche Verweigerung vorauszusetzen.
- source_word: βίᾳ φερομένους
  choice: mit Gewalt fortgeschleppt
  rationale: Die Formulierung beschreibt gewaltsames Ergreifen beziehungsweise Wegführen. „Fortgeschleppt“ bewahrt die passive, gewaltsame Bewegung.
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: ums Leben gebracht
  rationale: Wörtlich bedeutet die idiomatische Wendung, jemanden aus dem Leben zu entfernen. Die gewählte Formulierung gibt den eindeutigen Sinn verständlich und würdig als Tötung wieder.
theological_decisions:
- issue: Sozialrechtliche Tragweite von οἰκετικὴν διάθεσιν
  choice: Sklavenstand
  alternative: Stand von Haussklaven; Knechtschaft; sklavische Stellung
  rationale: Der Text beschreibt eine erzwungene, erniedrigende Rechts- und Sozialstellung. „Sklavenstand“ gibt diese Härte klar wieder, während die Fußnote die mögliche engere Beziehung zur Haussklaverei festhält.
- issue: Deutlichkeit der Todesandrohung in τοῦ ζῇν μεταστῆσαι
  choice: ums Leben gebracht werden
  alternative: aus dem Leben entfernt werden
  rationale: Die griechische Umschreibung bezeichnet die Tötung. Eine rein wörtliche Wiedergabe wäre im modernen Deutsch unnatürlich und könnte die tödliche Gewalt verschleiern; die Fußnote bewahrt die Bildgestalt.
translation_notes:
  register: Moderner, würdiger Erlassstil mit klaren Verboten und Anordnungen. Die Gewalt und der auferlegte Sklavenstatus werden nicht euphemistisch abgeschwächt; zugleich werden mögliche engere oder weitere Bedeutungen der griechischen Ausdrücke in den Fußnoten offengehalten.
