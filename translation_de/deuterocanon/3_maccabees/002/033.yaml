  text: And they remained hopeful of obtaining help, and they loathed those who were withdrawing from among them, and judged them as enemies of the nation, and deprived them of common association and support.
translation:
  language: de
  text: Und sie blieben hoffnungsvoll, Hilfe zu erlangen; diejenigen, die sich aus ihrer Mitte zurückzogen, verabscheuten sie, hielten sie für Feinde des Volkes und schlossen sie vom gemeinsamen Umgang und von gemeinsamer Unterstützung aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐέλπιδές ... καθιστήκεισαν
  choice: sie waren zuversichtlich
  rationale: Gibt den fortbestehenden hoffnungsvollen Zustand natürlich und würdevoll wieder.
- source_word: ἀντιλήμψεως τεύξασθαι
  choice: Hilfe zu erlangen
  rationale: ἀντίλημψις bezeichnet hier Hilfe oder Beistand; die offene Formulierung legt die Art und Herkunft der Hilfe nicht fest.
- source_word: τοὺς ἀποχωροῦντας ἐξ αὐτῶν
  choice: diejenigen, die sich von ihnen abwandten
  rationale: Bewahrt den durativen Sinn des Partizips und gibt die Trennung von der Gemeinschaft wieder, ohne das Motiv näher zu bestimmen.
- source_word: ἐβδελύσσοντο
  choice: verabscheuten sie
  rationale: Entspricht der starken emotionalen und sozialen Zurückweisung des griechischen Verbs.
- source_word: ὡς πολεμίους τοῦ ἔθνους ἔκρινον
  choice: sie betrachteten sie als Feinde des Volkes
  rationale: ἔθνος bezeichnet hier das jüdische Volk; „Volk“ ist im Deutschen natürlicher als „Nation“ und vermeidet moderne staatsrechtliche Nebenbedeutungen.
- source_word: τῆς κοινῆς συναναστροφῆς
  choice: vom gemeinsamen Umgang
  rationale: Bezeichnet die gemeinschaftliche soziale Verbindung beziehungsweise den Umgang miteinander.
- source_word: εὐχρηστίας
  choice: gegenseitiger Unterstützung
  rationale: Das seltene Substantiv kann Nützlichkeit, Dienstleistung oder hilfreiche Unterstützung bezeichnen; im sozialen Kontext ist „gegenseitige Unterstützung“ verständlich, ohne es auf bloße Gemeinschaft zu verengen.
theological_decisions:
- issue: Art der erwarteten Hilfe
  choice: Hilfe
  alternative: göttlicher Beistand
  rationale: Der Vers nennt die Quelle der ἀντίλημψις nicht ausdrücklich; die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutung von εὐχρηστία im Gemeinschaftsausschluss
  choice: gegenseitige Unterstützung
  alternative: Gemeinschaft / Nutznießung gemeinsamer Mittel
  rationale: Die Wiedergabe wahrt den praktischen sozialen Aspekt des Begriffs, ohne eine bestimmte institutionelle oder konfessionelle Praxis vorauszusetzen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die Satzglieder folgen der griechischen Abfolge weitgehend, werden aber durch Punkt und Semikolon für heutige Leser übersichtlich gegliedert. Keine Fußnoten erforderlich.
