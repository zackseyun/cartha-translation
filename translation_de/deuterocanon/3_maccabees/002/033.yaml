  source_fidelity: 'Die Übersetzung trifft die Abfolge und den Sinn des griechischen Textes insgesamt gut: fortdauernde Hoffnung auf Hilfe, Verachtung der sich Absondernden, Einstufung als Feinde des Volkes sowie sozialer Ausschluss. „Sich von ihnen abwandten“ ist jedoch stärker und weniger räumlich-sozial als ἀποχωροῦντας ἐξ αὐτῶν („sich aus ihrer Mitte zurückzogen“).'
