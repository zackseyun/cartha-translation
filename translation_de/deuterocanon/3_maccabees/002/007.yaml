  text: They too, when they saw the works of your hand, praised you, the Almighty.
translation:
  language: de
  text: Auch sie priesen dich, den Allmächtigen, als sie die Werke deiner Hand sahen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ καὶ
  choice: auch sie
  rationale: Die Verbindung aus Artikel und καί greift die bereits genannte Gruppe wieder auf und hebt hervor, dass auch sie so handelten.
- source_word: συνιδόντες
  choice: als … erkannten
  rationale: Das Aoristpartizip von συνοράω bezeichnet hier ein Wahrnehmen oder Erkennen; ein temporaler Nebensatz gibt seine Beziehung zum Hauptverb in natürlichem Deutsch wieder.
- source_word: ἔργα σῆς χειρός
  choice: die Werke deiner Hand
  rationale: Die Formulierung bewahrt sowohl den üblichen biblischen Ausdruck für Gottes Taten als auch das im Griechischen ausdrücklich vorhandene Bild der Hand.
- source_word: ἤνεσάν σε
  choice: priesen sie dich
  rationale: αἰνέω bedeutet loben oder preisen; „priesen“ wahrt den feierlichen Gebetston und nimmt das direkte Objekt „dich“ ausdrücklich auf.
- source_word: τὸν παντοκράτορα
  choice: den Allmächtigen
  rationale: „Der Allmächtige“ ist die geläufige und inhaltlich genaue deutsche Wiedergabe des göttlichen Titels παντοκράτωρ; der Akkusativ steht als Bezeichnung zu „dich“.
theological_decisions:
- issue: Wiedergabe des Gottestitels παντοκράτωρ
  choice: den Allmächtigen
  alternative: den Herrscher über alles
  rationale: „Den Allmächtigen“ bringt Gottes umfassende Macht prägnant zum Ausdruck, ohne die Bedeutung des Titels über den griechischen Wortlaut hinaus einzuengen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gebetston. Die Metapher „deiner Hand“ und die appositionelle Anrede „den Allmächtigen“ bleiben erhalten.
