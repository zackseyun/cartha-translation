translation:
  language: de
  text: Denn deine Wohnstätte ist zwar der Himmel des Himmels[a], für Menschen unerreichbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der Himmel der Himmel“ oder „der höchste Himmel“. Die griechische Wendung bewahrt eine semitisch geprägte Bezeichnung für den höchsten Himmel, Gottes erhabene Wohnstätte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  choice: Wohnstätte
  rationale: Das Substantiv bezeichnet einen Ort des Wohnens. „Wohnstätte“ ist im Deutschen prägnant, würdevoll und bewahrt den konkreten Ortsbezug.
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: der Himmel des Himmels
  rationale: Die weitgehend formale Wiedergabe erhält die semitisch geprägte Steigerungsform und ihre biblische Resonanz; geläufigere Deutungen werden in der Fußnote genannt.
- source_word: ἀνέφικτος
  choice: unerreichbar
  rationale: Das Adjektiv bezeichnet etwas, das nicht erreicht oder erlangt werden kann. „Unerreichbar“ gibt den Gedanken klar und natürlich wieder.
- source_word: ἀνθρώποις
  choice: für Menschen
  rationale: Der griechische Plural bezeichnet Menschen allgemein, nicht ausschließlich Männer. Die deutsche Form gibt diesen generischen Sinn genau wieder.
- source_word: μὲν γὰρ
  choice: Denn … zwar
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder; „zwar“ markiert die durch μέν angekündigte Gegenüberstellung, ohne sie innerhalb dieses Verses künstlich zu ergänzen.
theological_decisions:
- issue: Semitische Steigerungsform οὐρανὸς τοῦ οὐρανοῦ
  choice: der Himmel des Himmels
  alternative: der Himmel der Himmel; der höchste Himmel
  rationale: Die quellennähere Form bewahrt die Spannung und den Klang der Wendung, statt sie ausschließlich als Superlativ auszudeuten.
- issue: Transzendenz der göttlichen Wohnstätte
  choice: für Menschen unerreichbar
  alternative: Menschen unzugänglich
  rationale: Die Übersetzung sagt aus, dass Menschen die Wohnstätte nicht erreichen können, ohne weiter auszulegen, ob räumliche, kultische oder umfassendere Unzugänglichkeit gemeint ist.
- issue: Generischer Sinn von ἀνθρώποις
  choice: Menschen
  alternative: die Menschen; Sterbliche
  rationale: „Menschen“ wahrt den allgemeinen Bezug des griechischen Ausdrucks und vermeidet sowohl eine männliche Verengung als auch die zusätzliche Deutung „Sterbliche“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „Himmel des Himmels“ bleibt wegen ihrer formalen und theologischen Resonanz im Haupttext erhalten und wird durch eine knappe Fußnote erschlossen. „Zwar“ bewahrt die mit μέν eröffnete, über den Einzelvers hinausweisende Gegenüberstellung.
