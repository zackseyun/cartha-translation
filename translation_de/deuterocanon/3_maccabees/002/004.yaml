base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/004.yaml
  text: You burned up the Sodomites[a], who practiced arrogance and had become notorious for their evils, with fire and sulfur[b], setting them forth as an example for those who would come afterward.
translation:
  language: de
  text: Du hast die Bewohner Sodoms, die hochmütig handelten und durch ihre bösen Taten berüchtigt geworden waren[a], mit Feuer und Schwefel verbrannt und sie so zum warnenden Beispiel für die Nachgeborenen gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung ist hier ungewöhnlich und schwer verständlich. Das Adjektiv ἀδήλους bedeutet wörtlich meist „unkenntlich“, „verborgen“ oder „unklar“; im Zusammenhang wird die Formulierung häufig so verstanden, dass ihre bösen Taten sie offenkundig beziehungsweise berüchtigt machten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπερηφανίαν ἐργαζομένους
  choice: die Hochmut übten
  rationale: Die Formulierung bewahrt den durativen Sinn des Partizips und gibt ὑπερηφανία als tätigen, anhaltenden Hochmut wieder, ohne die Wendung unnötig auszudeuten.
- source_word: Σοδομίτας
  choice: die Bewohner Sodoms
  rationale: Das Ethnikon bezeichnet hier die Einwohner Sodoms. „Bewohner Sodoms“ ist im heutigen Deutsch eindeutig und vermeidet die später entstandenen Nebenbedeutungen von „Sodomiter“.
- source_word: ἀδήλους ταῖς κακίαις γενομένους
  choice: durch ihre bösen Taten berüchtigt geworden waren[a]
  rationale: Die überlieferte griechische Wendung ist schwierig, da ἄδηλος gewöhnlich „unkenntlich, verborgen, unklar“ bedeutet. Im Zusammenhang wird sie häufig als öffentliches Hervortreten durch böse Taten verstanden; die Fußnote wahrt die echte textliche und lexikalische Unsicherheit.
- source_word: πυρὶ καὶ θείῳ
  choice: mit Feuer und Schwefel
  rationale: „Schwefel“ ist die klare moderne Entsprechung von θεῖον und bewahrt zugleich die bekannte Gerichtsformel.
- source_word: κατέφλεξας
  choice: verbrannt
  rationale: Das mit κατά verstärkte Verb bezeichnet ein vollständiges Verbrennen. Im Deutschen vermittelt „verbrannt“ in Verbindung mit Feuer und Schwefel die Vernichtung natürlich und würdevoll.
- source_word: παράδειγμα
  choice: zum warnenden Beispiel
  rationale: παράδειγμα bedeutet „Beispiel“; der Gerichtskontext gibt ihm hier deutlich warnende Funktion. Das Adjektiv macht diese pragmatische Kraft im Deutschen verständlich.
- source_word: τοῖς ἐπιγινομένοις
  choice: für die Nachgeborenen
  rationale: Das substantivierte Partizip bezeichnet die später Kommenden. „Die Nachgeborenen“ ist knapp, würdevoll und schließt spätere Generationen ein.
theological_decisions:
- issue: Die Schuld Sodoms ohne spätere lehrmäßige Festlegung wiedergeben
  choice: Der Vers nennt tätigen Hochmut und böse Taten allgemein als Hintergrund des göttlichen Gerichts.
  alternative: „Sodomiter“ mit seinen späteren sexualisierten Nebenbedeutungen verwenden oder eine bestimmte, hier nicht genannte Sünde ergänzen.
  rationale: Die Übersetzung bleibt bei den ausdrücklich genannten Begriffen des griechischen Textes und importiert keine spätere kulturelle oder konfessionelle Deutung.
- issue: Die Gerichtsformel πυρὶ καὶ θείῳ modern wiedergeben
  choice: Feuer und Schwefel
  alternative: Feuer und Schwefelpfuhl oder eine andere traditionell ausgeweitete Formel
  rationale: „Feuer und Schwefel“ entspricht dem Wortlaut unmittelbar und erhält dessen theologisches Gewicht, ohne ihn zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetsanrede. „Bewohner Sodoms“ vermeidet missverständliche moderne Nebenbedeutungen; „Nachgeborene“ hält den feierlichen Ton, bleibt aber allgemein verständlich.
