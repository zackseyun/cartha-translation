base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/006.yaml
  text: And when he pursued him with chariots and a multitude of people[a], you overwhelmed him in the depths of the sea; but those who had put their trust in you, who rule over all creation[b], you brought safely through.
translation:
  language: de
  text: Und als er ihn mit Streitwagen und einer großen Schar verfolgte[a], überwältigtest du ihn in der Tiefe des Meeres; diejenigen aber, die auf dich vertraut hatten – auf dich, der du über die ganze Schöpfung herrschst[b] –, brachtest du unversehrt hindurch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Vers spielt auf den Auszug aus Ägypten an: Der ägyptische Verfolger wurde vom Meer überwältigt, während Gottes Volk sicher hindurchgebracht wurde.'
    reason: cross_reference
  - marker: b
    text: 'Oder: „auf dich, den Herrscher über die ganze Schöpfung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδιώξαντα
  choice: verfolgte
  rationale: Das Partizip bezeichnet ein entschlossenes, feindliches Nachsetzen. „Verfolgte“ ist im Deutschen natürlich und bewahrt den impliziten Bezug auf den Exodus.
- source_word: σὺν ἅρμασιν καὶ ὄχλων πλήθει
  choice: mit Streitwagen und einer großen Schar
  rationale: ἅρματα sind hier Streitwagen. „Eine große Schar“ gibt ὄχλων πλήθει idiomatisch wieder, ohne die Menge ausdrücklich als Heer oder Volk festzulegen.
- source_word: ἐπέκλυσας
  choice: überflutetest du ihn
  rationale: Das Verb bezeichnet ein Überströmen oder Überwältigen durch Wasser. Die Wiedergabe hält das Wasserbild ausdrücklich fest und vermeidet eine zusätzliche Deutung wie „ertränken“.
- source_word: βάθει θαλάσσης
  choice: in der Tiefe des Meeres
  rationale: Die Formulierung bewahrt den Singular von βάθος und lässt den Dativ im Zusammenhang räumlich beziehungsweise instrumental verständlich werden.
- source_word: ἐμπιστεύσαντας ἐπὶ σοὶ
  choice: die auf dich vertraut hatten
  rationale: Die Wendung bezeichnet das Setzen von Vertrauen auf jemanden. Das Plusquamperfekt verdeutlicht, dass dieses Vertrauen der Rettung vorausging.
- source_word: τῷ τῆς ἁπάσης κτίσεως δυναστεύοντι
  choice: der du über die ganze Schöpfung herrschst
  rationale: Die partizipiale Anrede beschreibt Gottes umfassende Herrschaft. Der Relativsatz ist im Deutschen klar und schließt unmittelbar an „dich“ an.
- source_word: σώους διεκόμισας
  choice: brachtest du unversehrt hindurch
  rationale: σώους betont die unversehrte Bewahrung, während διακομίζω das Hinüber- oder Hindurchbringen ausdrückt. Die Übersetzung erhält beide Aspekte.
theological_decisions:
- issue: Identität des Verfolgers und des Verfolgten
  choice: Die Pronomen bleiben im Haupttext unaufgelöst.
  alternative: „Pharao“ und „Israel“ ausdrücklich einzusetzen.
  rationale: Der griechische Vers nennt die Beteiligten an dieser Stelle nicht. Die Exodus-Anspielung ist deutlich, doch Namen im Haupttext würden über den Wortlaut hinausgehen.
- issue: Gottes Herrschaft über die Schöpfung
  choice: „der du über die ganze Schöpfung herrschst“
  alternative: „du Herrscher über die ganze Schöpfung“
  rationale: Der Relativsatz gibt die auf Gott bezogene Partizipialkonstruktion natürlich wieder und bewahrt die Aussage umfassender göttlicher Herrschaft, ohne sie weiter dogmatisch auszubauen.
- issue: Art des Gerichts im Meer
  choice: „überflutetest du ihn in der Tiefe des Meeres“
  alternative: „ließest du ihn im Meer ertrinken“
  rationale: Die gewählte Fassung wahrt das konkrete Wasserbild des Verbs und legt das im Griechischen nicht ausdrücklich verwendete Verb „ertrinken“ nicht in den Text hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Satzführung entspricht dem Gebetsstil des Zusammenhangs; unübliche Archaismen werden vermieden. Die nicht aufgelösten Pronomen und die offene Bezeichnung „große Schar“ bewahren die Ausdrucksweise und Ambiguität des griechischen Textes.
