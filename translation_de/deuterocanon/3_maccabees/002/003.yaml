  yaml_path: translation/deuterocanon/3_maccabees/002/003.yaml
  text: You destroyed those in former times who practiced unrighteousness—among whom were giants[b][a], trusting in their strength and boldness—by bringing immeasurable water upon them.
translation:
  language: de
  text: Du hast die Menschen früherer Zeiten, die Unrecht taten – unter ihnen waren Riesen, die auf ihre Kraft und ihren Übermut[a] vertrauten –, vernichtet, indem du unermessliches Wasser[b] über sie brachtest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Dreistigkeit“ beziehungsweise „ihren anmaßenden Mut“. Das griechische Wort bezeichnet hier wohl eine selbstsichere, rücksichtslose Kühnheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unermessliches Wasser“; gemeint sind die überwältigenden Wassermassen der Flut.'
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἔμπροσθεν
  choice: die Menschen früherer Zeiten
  rationale: ἔμπροσθεν ist hier zeitlich zu verstehen. Die Formulierung bezeichnet Menschen einer früheren Epoche und klingt im Deutschen natürlicher als das wörtlichere „die Früheren“.
- source_word: ἀδικίαν ποιήσαντας
  choice: die Unrecht taten
  rationale: Die Verbindung bedeutet wörtlich „die Unrecht getan hatten“. „Unrecht taten“ bewahrt den moralischen Sinn, ohne ihn unnötig auf einen juristischen Bereich einzuengen.
- source_word: γίγαντες
  choice: Riesen
  rationale: Dies ist die direkte Bedeutung des griechischen Wortes. Im Zusammenhang mit der Flut verweist es auf die Gestalten der Urzeit; „Gewaltige“ würde die konkrete Bezeichnung abschwächen.
- source_word: ῥώμῃ
  choice: Kraft
  rationale: Das Wort bezeichnet körperliche oder wirksame Stärke. „Kraft“ ist in der Verbindung „auf ihre Kraft vertrauen“ präzise und idiomatisch.
- source_word: θράσει
  choice: Übermut
  rationale: θράσος kann Kühnheit, Dreistigkeit oder anmaßenden Mut bezeichnen. Im Kontext von Unrecht und Gericht gibt „Übermut“ die negative Färbung natürlich wieder, ohne den Ausdruck auf bloße Frechheit zu verengen.
- source_word: πεποιθότες
  choice: die ... vertrauten
  rationale: Das Perfektpartizip bezeichnet gefestigtes Vertrauen beziehungsweise Sichverlassen auf etwas. Die finite Relativkonstruktion ist im Deutschen klar und natürlich.
- source_word: διέφθειρας
  choice: vernichtet
  rationale: Der Aorist bezeichnet die entschiedene Vernichtung der Betroffenen. „Vernichtet“ gibt die Stärke des Verbs in gehobenem, verständlichem Deutsch wieder.
- source_word: ἐπαγαγὼν αὐτοῖς ἀμέτρητον ὕδωρ
  choice: indem du unermessliches Wasser über sie brachtest
  rationale: Die Partizipialkonstruktion nennt das Mittel der Vernichtung. „Wasser“ bleibt beim griechischen Wortlaut; „Flut“ wäre eine sachlich naheliegende, aber stärker deutende Wiedergabe.
theological_decisions:
- issue: Identität der Gerichteten und Bezug zur urzeitlichen Flut
  choice: Die ausdrückliche Bezeichnung „Riesen“ und das Bild des „unermesslichen Wassers“ werden beibehalten.
  alternative: „Riesen“ als „Gewaltige“ und „unermessliches Wasser“ ausdrücklich als „Sintflut“ wiedergeben.
  rationale: Der Text erinnert deutlich an das urzeitliche Flutgericht, verwendet jedoch selbst γίγαντες und ἀμέτρητον ὕδωρ. Die Übersetzung harmonisiert diese Ausdrücke nicht stillschweigend mit einer bestimmten Formulierung aus Genesis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gottesanrede bleibt erhalten. Gedankenstriche gliedern den eingeschobenen Hinweis auf die Riesen, ohne den langen Satz in mehrere Aussagen aufzulösen.
