  terminology: „Freunde und Leibwächter“ gibt φίλοι καὶ σωματοφύλακες sachgerecht wieder. „Züchtigung“ wahrt den strafenden beziehungsweise zurechtweisenden Charakter von εὔθυνα, ohne einen bestimmten Urheber oder eine konfessionelle Deutung einzutragen. „Leben ... erlöschen“ gibt τὸ ζῆν ἐκλείπῃ verständlich als Befürchtung des Sterbens wieder.
