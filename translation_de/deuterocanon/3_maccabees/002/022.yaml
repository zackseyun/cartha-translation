  text: Therefore his friends and bodyguards[a], seeing the acute distress that had come upon him, hurried to set matters straight[b], fearing that even his life might fail.
translation:
  language: de
  text: Daher fürchteten seine Freunde und Leibwächter, als sie die heftige Züchtigung sahen[a], die ihn getroffen hatte, selbst sein Leben könnte erlöschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die scharfe Ahndung« oder »die heftige Strafe«. Das Adjektiv bedeutet »scharf/heftig«; das Substantiv bezeichnet eine Züchtigung, Ahndung oder Strafe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »dass auch das Leben aufhören/versagen könnte«. Gemeint ist die Furcht, er könne sterben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Daher
  rationale: Leitet aus dem vorausgehenden Geschehen eine Folgerung ab und bewahrt den kausalen Anschluss.
- source_word: φίλοι
  choice: Freunde
  rationale: Gibt den Grundsinn wieder; im königlichen Umfeld können damit auch Vertraute am Hof gemeint sein, doch der griechische Ausdruck legt »Höflinge« nicht zwingend fest.
- source_word: σωματοφύλακες
  choice: Leibwächter
  rationale: Entspricht der wörtlichen Bedeutung und ist im Deutschen die natürliche Bezeichnung für persönliche Bewacher.
- source_word: ὀξεῖαν ... εὔθυναν
  choice: die schwere Strafe
  rationale: εὔθυναν ist wegen Artikel und Adjektiv als Akkusativ des Substantivs εὔθυνα zu verstehen, nicht als Verb. Im Kontext bezeichnet es eine scharfe, schwere Ahndung oder Züchtigung.
- source_word: καταλαβοῦσαν αὐτόν
  choice: die ihn getroffen hatte
  rationale: Bewahrt den Sinn einer plötzlich über ihn gekommenen beziehungsweise ihn ergreifenden Heimsuchung, ohne deren genaue Art weiter auszudeuten.
- source_word: φοβούμενοι
  choice: und fürchteten
  rationale: Das griechische Partizip bezeichnet die begleitende Furcht. Die finite Wiedergabe ergibt im Deutschen einen verständlichen Vers, während das abschließende Komma den syntaktischen Fortgang zum nächsten Vers erkennen lässt.
- source_word: μὴ καὶ τὸ ζῆν ἐκλείπῃ
  choice: selbst sein Leben könnte erlöschen
  rationale: Gibt die Befürchtung wieder, sein Leben könne aufhören, und bewahrt zugleich das griechische Bild des Versiegens beziehungsweise Erlöschens.
theological_decisions:
- issue: εὔθυνα als Strafe oder neutralere Zurechtweisung
  choice: Strafe
  alternative: Zurechtweisung; Ahndung
  rationale: Der unmittelbare Kontext schildert eine schwere, lebensbedrohliche Reaktion auf das beabsichtigte Eindringen in das Heiligtum. »Strafe« gibt diese kontextuelle Schärfe wieder, ohne den Urheber im Vers ausdrücklich zu benennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers endet im Griechischen als Teil eines weiterführenden Satzgefüges; das abschließende Komma hält diesen Anschluss offen. Die englische Konsultationsfassung deutet εὔθυναν als Verb, doch Artikel und Adjektiv weisen klar auf das feminine Substantiv εὔθυνα hin; die deutsche Fassung folgt daher unmittelbar der griechischen Syntax und Lexik.
