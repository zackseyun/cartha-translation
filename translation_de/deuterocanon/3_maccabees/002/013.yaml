  yaml_path: translation/deuterocanon/3_maccabees/002/013.yaml
  text: But in our downfall this bold and profane man is attempting to insult the holy place on earth appointed by the name of your glory[a].
translation:
  language: de
  text: Doch in unserer Erniedrigung trachtet dieser dreiste und frevlerische Mann danach, den heiligen Ort auf Erden zu schmähen, der durch den Namen deiner Herrlichkeit ausgewiesen worden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der für den Namen deiner Herrlichkeit bestimmt worden ist“.'
    reason: ἀναδεδειγμένον kann „ausweisen/öffentlich kenntlich machen“ oder „bestimmen/einsetzen“ bedeuten. Die Funktion der Dativphrase τῷ ὀνόματι τῆς δόξης σου bleibt dabei knapp und ist nicht völlig eindeutig.
lexical_decisions:
- source_word: ἐν δὲ τῇ ἡμετέρᾳ καταπτώσει
  choice: Doch während wir am Boden liegen
  rationale: κατάπτωσις bezeichnet ein Niederfallen oder einen Zusammenbruch. Die bildhafte deutsche Wendung gibt hier den bedrängten und erniedrigten Zustand des Volkes wieder, ohne bereits dessen endgültigen Untergang auszusagen.
- source_word: θρασὺς
  choice: dreiste
  rationale: Das Wort bezeichnet verwegene, schamlose Kühnheit; „dreist“ bewahrt den klar negativen Sinn besser als das im Deutschen teilweise positive „kühn“.
- source_word: βέβηλος
  choice: gottlose
  rationale: βέβηλος bezeichnet das Unheilige beziehungsweise die Missachtung des Heiligen. Auf eine Person bezogen klingt „gottlos“ im modernen Deutsch natürlich und erhält den Gegensatz zum heiligen Ort.
- source_word: ἐπιτηδεύει
  choice: trachtet … danach
  rationale: Mit dem Infinitiv bezeichnet das Verb ein zielgerichtetes Betreiben oder Beabsichtigen. „Trachtet danach“ bringt den beharrlichen Vorsatz würdig und verständlich zum Ausdruck.
- source_word: καθυβρίσαι
  choice: zu schmähen
  rationale: Das verstärkte Verb bezeichnet eine überhebliche, entehrende Misshandlung. „Schmähen“ passt zu einem heiligen Ort und bewahrt die Dimension der verächtlichen Entehrung.
- source_word: τὸν ἐπὶ τῆς γῆς … ἅγιον τόπον
  choice: den heiligen Ort auf Erden
  rationale: Die direkte Wiedergabe lässt offen, ob der Tempel insgesamt oder ein enger gefasstes Heiligtum gemeint ist, obwohl der Kontext auf den Jerusalemer Tempel weist.
- source_word: ἀναδεδειγμένον
  choice: als solcher ausgewiesen ist
  rationale: Das Perfektpartizip von ἀναδείκνυμι kann öffentliches Ausweisen, Erweisen oder Bestimmen ausdrücken. Diese Formulierung erhält die resultative und öffentliche Nuance, ohne das Wort rein administrativ als „eingesetzt“ festzulegen.
- source_word: τῷ ὀνόματι τῆς δόξης σου
  choice: durch den Namen deiner Herrlichkeit
  rationale: Die komprimierte Dativkonstruktion wird formal durchsichtig wiedergegeben. „Dein herrlicher Name“ wäre glatter, würde aber die eigenständigen Begriffe „Name“ und „Herrlichkeit“ zusammenziehen.
theological_decisions:
- issue: Bezug des heiligen Ortes
  choice: allgemein „der heilige Ort auf Erden“
  alternative: das Heiligtum beziehungsweise ein bestimmter innerer Tempelbereich
  rationale: τόπος ist kein enger technischer Ausdruck für einen einzelnen Tempelraum. Der Zusammenhang identifiziert den Ort mit dem Jerusalemer Tempel, doch die Übersetzung verengt die griechische Formulierung nicht.
- issue: Wie Gottes Name den Ort kennzeichnet
  choice: „durch den Namen deiner Herrlichkeit als solcher ausgewiesen“
  alternative: „für den Namen deiner Herrlichkeit bestimmt“ oder „durch deinen herrlichen Namen geheiligt“
  rationale: Der griechische Text verbindet ἀναδεδειγμένον mit einer mehrdeutigen Dativphrase. Die gewählte Fassung bewahrt sowohl das öffentliche Gekennzeichnetsein als auch die enge Beziehung des Ortes zu Gottes Name, ohne ausdrücklich eine nicht genannte Weihehandlung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Während wir am Boden liegen“ hält das Bild des Niederfallens lebendig; „trachtet … danach“ trägt den feierlichen Gebetsstil, ohne altertümlich zu werden. Der Fußnotenmarker [a] steht unmittelbar nach dem Satz.
