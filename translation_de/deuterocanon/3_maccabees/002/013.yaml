revisions:
- from: Doch während wir am Boden liegen, trachtet dieser dreiste und gottlose Mann danach, den heiligen Ort auf Erden zu schmähen, der durch den Namen deiner Herrlichkeit als solcher ausgewiesen ist.[a]
  to: Doch in unserer Erniedrigung trachtet dieser dreiste und frevlerische Mann danach, den heiligen Ort auf Erden zu schmähen, der durch den Namen deiner Herrlichkeit ausgewiesen worden ist.[a]
  rationale: Die Revision wahrt die abstrakte, leidvolle Bedeutung von καταπτώσει, vermeidet eine unnötige explizierende Ergänzung und schärft die sakrale Konnotation von βέβηλος. Die Deutung von ἀναδεδειγμένον und der mehrdeutigen Dativphrase bleibt im Haupttext zurückhaltend und wird durch die Fußnote transparent gehalten.
