  verdict: revise
  source_fidelity: „Während wir am Boden liegen“ deutet καταπτώσει zu eng als gegenwärtiges körperliches Niederliegen. Der Ausdruck bezeichnet hier den Zustand von Fall, Erniedrigung oder Not des Volkes. Auch „als solcher“ fügt zur Kennzeichnung des Ortes eine ausdrückliche Prädikation hinzu, die im Griechischen nicht formuliert ist.
  naturalness: Die Satzführung und der würdige Registerton sind gelungen. „In unserer Erniedrigung“ ist im Gebetskontext idiomatischer und semantisch weiter als das Bild vom Am-Boden-Liegen. „Ausgewiesen worden ist“ gibt das Perfektpartizip klar wieder; der Zusatz „als solcher“ kann entfallen.
  terminology: „Dreiste“ entspricht θρασὺς treffend. „Gottlose“ ist als Wiedergabe von βέβηλος möglich, aber „frevlerische“ trifft die sakrale Missachtung genauer, ohne eine weitergehende Aussage über die Gottesleugnung der Person zu machen. Die Dativverbindung mit „durch den Namen deiner Herrlichkeit“ bleibt wegen ihrer syntaktischen und semantischen Verdichtung mit einer Alternative in der Fußnote kenntlich.
  issues:
