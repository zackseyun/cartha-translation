    issue: καταπτώσει als „während wir am Boden liegen“
    rationale: Die deutsche Fassung macht aus dem abstrakten Zustand des Niedergangs bzw. der Erniedrigung ein konkretes, zeitlich andauerndes Bild körperlichen Liegens und verengt damit den Sinn.
  - severity: low
    issue: „als solcher“
    rationale: Der Zusatz ist im griechischen Text nicht ausdrücklich vorhanden. Das Partizip bezieht sich direkt auf „heiligen Ort“; eine zusätzliche Aussage, dass er gerade als heiliger Ort ausgewiesen sei, ist nicht nötig.
  - severity: low
    issue: βέβηλος als „gottlos“
    rationale: „Gottlos“ ist möglich, kann im heutigen Deutsch aber stärker eine allgemeine religiöse Haltung bezeichnen. „Frevelhaft/frevlerisch“ bewahrt den Kontext der Entheiligung präziser.
