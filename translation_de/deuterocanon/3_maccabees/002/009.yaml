base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/009.yaml
  text: And because I love the house of Israel[a], I have promised that if a turning away comes upon us and distress overtakes us, and we come to our place and pray[b], I will hear our prayer.
translation:
  language: de
  text: 'Und weil du das Haus Israel liebst, hast du verheißen: Wenn es unter uns zu einer Abkehr[a] kommt und Bedrängnis uns erfasst und wir an unseren Ort kommen und flehen, wirst du unser Gebet erhören.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Abfall«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπῶν
  choice: weil du … liebst
  rationale: Das nominativische Partizip bezieht sich auf das in ἐπηγγείλω angesprochene »du«. Die kausale Wiedergabe ergibt im Deutschen einen natürlichen Satz und bringt die Liebe als Beweggrund der Verheißung zum Ausdruck, ohne den Bezug zu verändern.
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: das Haus Israel
  rationale: Die feste biblische Wendung bewahrt den gemeinschaftlichen und heilsgeschichtlichen Sinn von οἶκος besser als eine verengende Wiedergabe wie »Volk« oder »Familie«.
- source_word: ἐπηγγείλω
  choice: hast du verheißen
  rationale: Die Form ist zweite Person Singular, Aorist Medium. »Hast du verheißen« gibt die an Gott gerichtete Aussage und ihre fortdauernde Geltung angemessen wieder.
- source_word: ἀποστροφή
  choice: Abkehr
  rationale: Der Ausdruck bewahrt das Bild einer Abwendung und lässt offen, ob eine allgemeine Abkehr oder ausdrücklich ein Glaubensabfall gemeint ist.
- source_word: καταλάβῃ … στενοχωρία
  choice: Bedrängnis uns erfasst
  rationale: καταλαμβάνω bezeichnet hier das Ergreifen oder Überkommen; »erfasst« ist gegenwärtiges, klares Deutsch und bewahrt die eindringliche Wirkung.
- source_word: τὸν τόπον ἡμῶν
  choice: unseren Ort
  rationale: Der griechische Text sagt wörtlich »unseren Ort«. Obwohl im Zusammenhang vermutlich der heilige Ort beziehungsweise der Tempel gemeint ist, wird diese Deutung nicht in den Haupttext eingetragen.
- source_word: δεηθῶμεν
  choice: flehen
  rationale: Das Verb bezeichnet ein bittendes, dringliches Beten. »Flehen« bewahrt diese Nuance deutlicher als das allgemeinere »beten«.
- source_word: εἰσακούσῃ τῆς δεήσεως ἡμῶν
  choice: wirst du unser Gebet erhören
  rationale: εἰσακούω mit Genitiv bedeutet, eine Bitte beziehungsweise ein Gebet gnädig anzuhören. Die Verbform ist zweite Person Singular und gehört als Folgesatz zur Verheißung.
theological_decisions:
- issue: Sprecherbezug und Personalformen
  choice: 'Die Verheißung wird als an Gott gerichtete Aussage in der zweiten Person wiedergegeben: »hast du verheißen … wirst du … erhören«.'
  alternative: 'Die englische Konsultationsfassung bietet erste Person: »I have promised … I will hear«.'
  rationale: Die griechischen Formen ἐπηγγείλω und εἰσακούσῃ sind zweite Person Singular. Auch der nominativische Partizip ἀγαπῶν bezieht sich auf dieses angesprochene »du«. Daher hat die Ausgangssprache Vorrang vor der als fehlerhaft markierten englischen Fassung.
- issue: Bedeutung von ἀποστροφή
  choice: Der Haupttext verwendet das nichttechnische »Abkehr«.
  alternative: »Abfall« beziehungsweise »Glaubensabfall«
  rationale: Das griechische Wort kann eine Abwendung oder einen Abfall bezeichnen. Der weitere Kontext erlaubt eine zugespitzte theologische Deutung, erzwingt sie aber nicht; die Mehrdeutigkeit bleibt deshalb erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch vertrauter, aber verständlicher Ausdrucksweise. Die Anrede Gottes in der zweiten Person folgt den griechischen Verbformen. »Haus Israel« bleibt als etablierte biblische Wendung stehen; »unseren Ort« wird trotz des möglichen Tempelbezugs nicht erläuternd erweitert.
