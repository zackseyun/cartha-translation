base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/011.yaml
  text: For even when our fathers were often afflicted[b][a], you helped them in their humiliation and rescued them from great evils.
translation:
  language: de
  text: Denn auch als unsere Väter[a] wiederholt bedrängt wurden, hast du ihnen in ihrer Erniedrigung[b] geholfen und sie aus großem Unheil[c] gerettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Vorfahren“. Wörtlich steht im Griechischen „unsere Väter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in ihrer Niedrigkeit“ beziehungsweise „in ihrer Bedrängnis“. Das griechische Wort bezeichnet den Zustand, erniedrigt oder tief herabgebracht zu sein.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aus großen Übeln“, „aus schweren Nöten“ oder „aus großen Katastrophen“. Das griechische Wort kann hier schweres widerfahrenes Unheil bezeichnen und nicht nur moralisch Böses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: Denn auch als
  rationale: Die Wendung führt im Gebet einen begründenden Rückblick ein. Zusammen mit dem folgenden καί gibt „Denn auch als“ den erklärenden und zugleich hervorhebenden Sinn in natürlichem Deutsch wieder.
- source_word: πλεονάκις
  choice: wiederholt
  rationale: Das Adverb bezeichnet ein mehrfaches Geschehen. „Wiederholt“ bewahrt diesen Gedanken klar und ohne altertümlichen Klang.
- source_word: θλιβέντων
  choice: bedrängt wurden
  rationale: Das passive Partizip von θλίβω beschreibt Druck, Bedrängnis oder schwere Not. „Bedrängt“ bleibt bewusst allgemein und passt zum gehobenen Gebetsstil.
- source_word: τῶν πατέρων ἡμῶν
  choice: unsere Väter
  rationale: πατέρων ist die ausdrücklich männliche Pluralform und bezeichnet hier die Vorväter des Volkes. Die wörtliche Bildsprache bleibt im Haupttext erhalten; die geläufige Bedeutungsalternative steht in der Fußnote.
- source_word: ἐβοήθησας αὐτοῖς
  choice: hast du ihnen geholfen
  rationale: βοηθέω bedeutet helfen oder zu Hilfe kommen. Die direkte deutsche Formulierung gibt die schlichte Aussage des Griechischen wieder.
- source_word: ἐν τῇ ταπεινώσει
  choice: in ihrer Erniedrigung
  rationale: ταπείνωσις kann Erniedrigung, Niedrigkeit oder einen Zustand des Gedemütigtseins bezeichnen. „Erniedrigung“ wahrt das Motiv des Herabgebrachtseins und unterscheidet sich sprachlich von θλιβέντων.
- source_word: ἐρρύσω
  choice: gerettet
  rationale: ῥύομαι bezeichnet das Retten oder Befreien aus einer Gefahr. „Gerettet“ ist im Deutschen natürlich und stellt durch die Ergänzung „aus“ den konkreten Befreiungssinn klar.
- source_word: ἐκ μεγάλων κακῶν
  choice: aus großem Unheil
  rationale: κακά kann Böses, Übel, Nöte oder Katastrophen bezeichnen. Im Zusammenhang geschichtlicher Rettung meint es wahrscheinlich schwere schädliche Umstände; „Unheil“ bewahrt die Weite des Ausdrucks, ohne ihn auf moralische Bosheit zu verengen.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Vorfahren
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Der griechische Text verwendet πατέρων. Der Haupttext erhält diese Form, während die kontextuelle Bedeutung „Vorfahren“ als echte Übersetzungsmöglichkeit in der Fußnote genannt wird.
- issue: Bedeutung von κακῶν im Gebet um geschichtliche Rettung
  choice: großes Unheil
  alternative: große Übel; schwere Nöte; große Katastrophen
  rationale: Der Ausdruck muss nicht ausschließlich moralisch Böses bezeichnen, sondern kann widerfahrenes Leid und zerstörerische Umstände meinen. „Unheil“ lässt diese Bedeutungsbreite offen.
- issue: Bedeutung von ταπείνωσις
  choice: Erniedrigung
  alternative: Niedrigkeit; Bedrängnis
  rationale: Der Begriff kann sowohl einen erniedrigten Zustand als auch die damit verbundene Not bezeichnen. „Erniedrigung“ hält das Bild des Herabgebrachtseins fest, ohne die mögliche soziale oder leidvolle Dimension auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gebetssprache. Der Satzbau bleibt nah an der griechischen Begründungsstruktur, vermeidet jedoch unnötige Wörtlichkeit. Die Wiederholung verwandter Leidensbegriffe wird nicht eingeebnet.
