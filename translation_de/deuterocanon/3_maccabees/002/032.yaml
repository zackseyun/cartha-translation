base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/032.yaml
  text: But most of them[a], took courage with a noble spirit, did not abandon their piety by exchanging their possessions for life[b], but boldly counted themselves worthy to escape the registration lists.
translation:
  language: de
  text: Die meisten aber fassten mit edler Gesinnung Mut und wichen nicht von der Gottesfurcht ab, sondern hielten sich furchtlos für würdig[a], sich aus den Erfassungslisten[b] zu retten, indem sie ihren Besitz für ihr Leben hingaben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hielten es für angemessen“. Das griechische Verb drückt eine Wertung oder Ehrung aus; die genaue Nuance der Verbindung mit dem folgenden Infinitiv ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die amtlichen Registrierungsverzeichnisse, die im Zusammenhang offenbar dazu dienten, Juden für die Zwangsmaßnahmen des Königs zu erfassen.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: Die meisten aber
  rationale: πλεῖστοι bezeichnet idiomatisch den größten Teil der zuvor genannten Gruppe; „die meisten“ gibt den Gegensatz knapp und natürlich wieder.
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: fassten mit edler Gesinnung Mut
  rationale: Der Dativ bezeichnet die innere Haltung, in der sie stark wurden. „Gesinnung“ vermeidet ein unnötig metaphysisches Verständnis von ψυχή, während „Mut fassen“ die intransitive Kraft von ἐνίσχυσαν im Verfolgungskontext wiedergibt.
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: wichen nicht von der Gottesfurcht ab
  rationale: διίστημι mit Genitiv bezeichnet hier das Sich-Entfernen oder Abweichen. „Gottesfurcht“ gibt εὐσέβεια als treue religiöse Hingabe wieder, ohne bloß allgemeine Sittlichkeit zu bezeichnen.
- source_word: τὰ χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: Sie tauschten ihren Besitz gegen ihr Leben ein
  rationale: χρήματα umfasst Besitz oder Vermögen, nicht nur Bargeld. Die Formulierung wahrt das deutliche Tauschbild von ἀντικαταλλάσσομαι und versteht περὶ τοῦ ζῇν als Bezug auf die Bewahrung des Lebens.
- source_word: ἀδέως
  choice: furchtlos
  rationale: Das Adverb bezeichnet ein Handeln ohne Furcht; „furchtlos“ ist näher am unmittelbaren Sinn als eine bloße Aussage über Entschlossenheit.
- source_word: ἐτιμῶντο ἑαυτοὺς ῥύσασθαι
  choice: hielten sich für würdig, sich … zu retten
  rationale: Die mediale Form von τιμάω enthält eine wertende beziehungsweise ehrende Selbsteinschätzung. Die Übersetzung bewahrt diese ungewöhnliche Nuance, statt sie zu „konnten“ oder „versuchten“ zu glätten.
- source_word: ἐκ τῶν ἀπογραφῶν
  choice: aus den Erfassungslisten
  rationale: ἀπογραφαί sind amtliche Registrierungen beziehungsweise die daraus entstehenden Verzeichnisse. Im Zusammenhang sind Listen gemeint, die den repressiven Maßnahmen des Königs dienten.
theological_decisions:
- issue: Bedeutung von εὐσέβεια im jüdischen Verfolgungskontext
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ macht die auf Gott gerichtete Treue verständlich und vermeidet, εὐσέβεια auf äußere Frömmigkeitsformen oder allgemeine Moral zu verengen.
- issue: Bewertungsausdruck in ἐτιμῶντο
  choice: hielten sich für würdig
  alternative: hielten es für angemessen / glaubten, sich retten zu können
  rationale: Die gewählte Fassung erhält die ehrende Wertung des Verbs und lässt die im Griechischen ungewöhnliche Verbindung mit dem Infinitiv bestehen, ohne daraus eine Aussage über verdienstliche Erlösung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Verständlichkeit, ohne die Abfolge der griechischen Aussagen zu verändern. Die ungewöhnliche Selbsteinschätzung in ἐτιμῶντο wird bewusst nicht zu einer bloßen Fähigkeits- oder Versuchsaussage geglättet.
