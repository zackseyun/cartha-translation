  to: Die meisten aber fassten mit edler Gesinnung Mut und wichen nicht von der Gottesfurcht ab, sondern hielten sich furchtlos für würdig[a], sich aus den Erfassungslisten[b] zu retten, indem sie ihren Besitz für ihr Leben hingaben.
