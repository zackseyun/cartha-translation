translation:
  language: de
  text: Doch weil es dir gefallen hat, deine Herrlichkeit unter deinem Volk Israel zu offenbaren[a], hast du diesen Ort geheiligt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „weil dir deine Herrlichkeit in deinem Volk Israel gefallen hat“. Die knappe griechische Formulierung kann auch so verstanden werden: „weil du an deiner Herrlichkeit in deinem Volk Israel Gefallen hattest“; im Zusammenhang liegt jedoch nahe, dass von ihrer Offenbarung unter Israel die Rede ist.'
    reason: Bewahrt die ungewöhnliche Konstruktion und ihre mögliche Mehrdeutigkeit, während die Hauptfassung die kontextuell wahrscheinliche Aussage in natürlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorausgehenden Gedankengang; „Doch“ passt zum würdevollen Gebetsstil.
- source_word: ἐπεὶ
  choice: weil
  rationale: Leitet hier die Begründung der Aussage ein und gibt den kausalen Sinn natürlich wieder.
- source_word: εὐδόκησας
  choice: es dir gefallen hat
  rationale: Bewahrt die Bedeutung von Wohlgefallen beziehungsweise gnädigem Entschluss.
- source_word: τὴν δόξαν σου ἐν τῷ λαῷ σου Ἰσραήλ
  choice: deine Herrlichkeit in deinem Volk Israel wohnen zu lassen
  rationale: Der griechische Ausdruck ist ungewöhnlich knapp und enthält kein ausdrückliches Verb wie „zeigen“. Im Tempelkontext liegt die bleibende Gegenwart der Herrlichkeit nahe; die Ergänzung wird durch eine Fußnote als Deutung kenntlich gemacht.
- source_word: ἡγίασας
  choice: hast du … geheiligt
  rationale: „Heiligen“ ist die direkte, verständliche Entsprechung und bezeichnet das Aussondern für Gott.
- source_word: τὸν τόπον τοῦτον
  choice: diesen Ort
  rationale: Formale und natürliche Wiedergabe des Demonstrativausdrucks.
theological_decisions:
- issue: Verhältnis der Herrlichkeit Gottes zu Israel
  choice: deine Herrlichkeit in deinem Volk Israel wohnen zu lassen
  alternative: an deiner Herrlichkeit in deinem Volk Israel Gefallen zu haben / deine Herrlichkeit unter deinem Volk Israel zu zeigen
  rationale: Der Akkusativ „deine Herrlichkeit“ bei εὐδοκέω und die Präpositionalphrase sind syntaktisch spannungsreich. Die Hauptfassung versteht die Aussage im Kontext der Heiligung des Ortes als Hinweis auf Gottes gegenwärtige Herrlichkeit, ohne „sich selbst verherrlichen“ in den Text einzutragen; die formalere Möglichkeit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gebetstypischer Anrede. „Geheiligt“ wahrt die kultische Präzision; die interpretierende Ergänzung „wohnen zu lassen“ wird ausdrücklich in der Fußnote offengelegt.
