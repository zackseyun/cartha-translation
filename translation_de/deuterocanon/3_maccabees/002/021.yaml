lexical_decisions:
- source_word: Ἐνταῦθα
  choice: Da
  rationale: Markiert idiomatisch den Zeitpunkt beziehungsweise die erzählerische Wendung, ohne den im Deutschen missverständlichen rein räumlichen Sinn von „dort“ festzulegen.
- source_word: ὁ πάντων ἐπόπτης θεός
  choice: Gott, der über alles wacht
  rationale: Gibt den titelartigen Ausdruck natürlich wieder und bewahrt sowohl Gottes Wahrnehmung als auch seine fürsorgliche Aufsicht.
- source_word: προπάτωρ
  choice: Urvater
  rationale: Bewahrt den ungewöhnlichen Ahnentitel möglichst knapp und würdevoll; die Bezeichnung bleibt auch im Deutschen auffällig, wie im Griechischen.
- source_word: ἅγιος ἐν ἁγίοις
  choice: der heilige Urvater unter den Heiligen
  rationale: Versteht ἐν ἁγίοις personal als „unter den Heiligen“, lässt aber die mögliche lokale beziehungsweise sächliche Deutung in der Fußnote sichtbar.
- source_word: εἰσακούσας
  choice: erhörte
  rationale: Drückt nicht nur akustisches Hören, sondern die gnädige Annahme und Beantwortung des Flehens aus; der griechische Aoristpartizip wird für natürliches Deutsch in eine koordinierte Verbform überführt.
- source_word: τῆς ἐνθέσμου λιτανείας
  choice: das rechtmäßige Flehen
  rationale: „Flehen“ ist für λιτανεία gegenwärtig und verständlich; „rechtmäßig“ bewahrt den Bezug auf das gesetzlich oder ordnungsgemäß Begründete.
- source_word: ἐμάστιξεν
  choice: geißelte
  rationale: Erhält das starke, bildhafte Strafverb des Griechischen, statt es zum allgemeinen „bestrafte“ abzuschwächen.
- source_word: τὸν ὕβρει καὶ θράσει μεγάλως ἐπηρμένον
  choice: den, der sich in Überheblichkeit und Verwegenheit maßlos erhoben hatte
  rationale: Bewahrt das Bild des Sich-Erhebens sowie die moralische Schärfe von ὕβρις und θράσος; „maßlos“ gibt μεγάλως im Zusammenhang idiomatisch wieder.
theological_decisions:
- issue: Der auf Gott bezogene Titel προπάτωρ
  choice: Urvater
  alternative: Stammvater; Vorvater; Ahnherr
  rationale: Der ungewöhnliche Ahnentitel wird nicht dogmatisch geglättet. „Urvater“ hält die familiär-ursprüngliche Aussage fest, ohne eine zusätzliche Herrschaftsbedeutung einzuführen.
- issue: Deutung von ἅγιος ἐν ἁγίοις
  choice: der heilige Urvater unter den Heiligen
  alternative: der heilige Urvater im Heiligtum / an den heiligen Orten
  rationale: Die personale Lesart passt zur Folge göttlicher Hoheitstitel. Da der Dativ Plural jedoch auch sächlich und lokal verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
- issue: Wirkung des göttlichen Hörens
  choice: erhörte
  alternative: hörte
  rationale: εἰσακούω bezeichnet im Gebetskontext typischerweise zustimmendes, wirksames Hören; die unmittelbar folgende Strafe bestätigt diese Nuance, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für natürliche Lesbarkeit moderat gegliedert; die starken Bilder „geißelte“ und „erhoben“ sowie der ungewöhnliche Gottestitel „Urvater“ bleiben erhalten. Alle Fußnotenmarker stehen im Haupttext.
