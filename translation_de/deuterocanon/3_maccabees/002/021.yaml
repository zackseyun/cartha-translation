  text: There the God who watches over all[a], the holy forefather among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness[b],
translation:
  language: de
  text: Da geißelte Gott, der über alles wacht, der heilige Urvater[a] unter den Heiligen[b], nachdem er das rechtmäßige Flehen erhört hatte, den, der sich vor Überheblichkeit und Verwegenheit weit erhoben hatte.
