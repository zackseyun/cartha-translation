base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/017.yaml
  text: We trampled the house of holiness[b][a], just as the houses of the people of Jerusalem are trampled.
translation:
  language: de
  text: Wir haben das Haus der Heiligkeit[a] mit Füßen getreten, wie die Häuser der Einwohner Jerusalems[b] mit Füßen getreten werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »das Haus der Heiligung«, »das Haus der Weihe« oder sinngemäß »der heilige Tempel«. Wörtlich steht im Griechischen eine Genitivverbindung: »das Haus der Heiligkeit/Heiligung«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die Häuser der Menschen, die in Jerusalem wohnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν / καταπατοῦνται
  choice: mit Füßen getreten / mit Füßen getreten werden
  rationale: Die konkrete Bedeutung des Verbs καταπατέω und seine rhetorische Wiederholung werden bewahrt. Die deutsche Wendung ist natürlicher als das isolierte „zertreten“ und lässt die damit verbundene Entweihung anklingen, ohne sie ausdrücklich in den Text einzutragen.
- source_word: τὸν οἶκον / οἱ οἶκοι
  choice: das Haus / die Häuser
  rationale: Die Wiederholung von οἶκος bleibt sichtbar. Beim ersten Vorkommen ist der Tempel gemeint, doch „Haus“ hält sich an die konkrete Ausdrucksweise des Griechischen.
- source_word: τοῦ ἁγιασμοῦ
  choice: der Heiligkeit
  rationale: ἁγιασμός kann Heiligkeit, Heiligung oder Weihe bezeichnen. „Heiligkeit“ ist im Tempelzusammenhang verständlich und bewahrt die abstrakte Genitivkonstruktion, ohne sie zum bloßen Adjektiv zu glätten.
- source_word: ὡς
  choice: wie
  rationale: „Wie“ gibt den Vergleich knapp und idiomatisch wieder.
- source_word: τῶν προσολυμίων
  choice: der Einwohner Jerusalems
  rationale: Das Ethnikon bezeichnet die Menschen aus beziehungsweise in Jerusalem. „Einwohner Jerusalems“ ist im modernen Deutsch klarer als „Jerusalemiter“.
theological_decisions:
- issue: Ob οἶκος im ersten Satzteil ausdrücklich als „Tempel“ wiederzugeben ist
  choice: Haus der Heiligkeit
  alternative: Tempel der Heiligkeit; Heiligtum
  rationale: Der Bezug auf den Tempel ist sachlich naheliegend, aber der Ausgangstext sagt οἶκος („Haus“). Die Übersetzung bewahrt dieses Bild und erklärt die möglichen kontextuellen Wiedergaben in der Fußnote.
- issue: Wie der kultisch gefärbte Ausdruck ἁγιασμός wiederzugeben ist
  choice: Heiligkeit
  alternative: Heiligung; Weihe
  rationale: Die Bedeutungsbreite wird nicht dogmatisch auf einen Vorgang der Heiligung oder einen Akt der Weihe festgelegt. „Heiligkeit“ passt zum heiligen Haus, während die Alternativen in der Fußnote erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Wendung „mit Füßen getreten“ erhält die auffällige Wiederholung des griechischen Verbs und den Gegensatz zwischen dem heiligen Haus und den gewöhnlichen Häusern.
