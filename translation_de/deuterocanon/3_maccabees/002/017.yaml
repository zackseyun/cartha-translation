  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Wiederholungen des Griechischen zuverlässig wieder: κατεπατήσαμεν und καταπατοῦνται erscheinen jeweils als „mit Füßen getreten“, οἶκος als „Haus/Häuser“, und der Vergleich mit ὡς ist erhalten. Das Perfekt „Wir haben … getreten“ ist eine angemessene deutsche Wiedergabe des griechischen Aorists; das Präsenspassiv „werden“ bewahrt die allgemeine beziehungsweise fortdauernde Aussage des griechischen Präsens.'
  naturalness: „Mit Füßen treten“ ist im modernen Standarddeutsch verständlich und in diesem feierlich-selbstanklagenden Kontext idiomatisch genug. Die Wiederholung wirkt bewusst und angemessen. „Haus der Heiligkeit“ ist leicht gehoben, aber als quellennahe, kultisch markierte Genitivverbindung gut lesbar.
  terminology: „Heiligkeit“ ist für ἁγιασμός im Kontext vertretbar und vermeidet eine unnötige dogmatische Festlegung auf „Heiligung“ oder „Weihe“. Die Fußnote nennt diese Alternativen sowie die kontextuelle Deutung als Tempel. „Einwohner Jerusalems“ gibt τῶν προσολυμίων klar und neutral wieder; die Fußnote erläutert den Bezug zutreffend.
