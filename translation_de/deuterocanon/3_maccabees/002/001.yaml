  yaml_path: translation/deuterocanon/3_maccabees/002/001.yaml
  text: Lord[a], Lord, king of the heavens and master of all creation, holy among the holy ones, sole ruler, Almighty[b], pay attention to us who are being oppressed by an unholy and profane man, swollen with arrogance and strength.
translation:
  language: de
  text: Herr, Herr, König der Himmel und Gebieter über die ganze Schöpfung, Heiliger unter den Heiligen[a], alleiniger Herrscher, Allmächtiger, achte auf uns, die wir von einem gottlosen und frevelhaften Mann[b] bedrängt werden, der von Anmaßung und Kraft aufgebläht ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heiliger inmitten der Heiligen“ oder „Heiliger in den Heiligen“. Die griechische Wendung ist knapp und lässt das Verhältnis offen.'
    reason: lexical_alternative
  - marker: b
    text: Das Wort „Mann“ steht nicht ausdrücklich im Griechischen; die männliche Singularform der Beschreibung weist jedoch auf eine einzelne feindliche Person.
    reason: supplied_word
lexical_decisions:
- source_word: Κύριε, Κύριε
  choice: Herr, Herr
  rationale: Der doppelte Vokativ der feierlichen Gottes anrede wird bewahrt; „Herr“ ist im modernen deutschen Bibelregister die natürliche Wiedergabe von κύριος.
- source_word: βασιλεῦ τῶν οὐρανῶν
  choice: König der Himmel
  rationale: Der Plural „der Himmel“ bildet τῶν οὐρανῶν ab und erhält die erhabene Ausdrucksweise.
- source_word: δέσποτα πάσης τῆς κτίσεως
  choice: Gebieter über die ganze Schöpfung
  rationale: „Gebieter“ bringt die umfassende Verfügungsgewalt von δεσπότης zum Ausdruck und unterscheidet den Titel von κύριος.
- source_word: ἅγιε ἐν ἁγίοις
  choice: Heiliger unter den Heiligen
  rationale: Die kompakte liturgische Wendung wird natürlich wiedergegeben, ohne die mögliche Bedeutung „in den Heiligen“ zu verschweigen.
- source_word: μόναρχε
  choice: Alleinherrscher
  rationale: Das Wort bezeichnet den einen, allein herrschenden Souverän; „Alleinherrscher“ ist prägnant und erhält den eigenen Titel.
- source_word: παντοκράτωρ
  choice: Allmächtiger
  rationale: Die eingebürgerte deutsche Wiedergabe bewahrt Gewicht und Anredeform des göttlichen Titels.
- source_word: πρόσχες ἡμῖν
  choice: achte auf uns
  rationale: Der Imperativ bittet Gott unmittelbar um Aufmerksamkeit; die Formulierung ist klar, modern und gebetsgemäß.
- source_word: καταπονουμένοις
  choice: die wir … bedrängt werden
  rationale: Das Partizip beschreibt anhaltenden schweren Druck beziehungsweise Unterdrückung.
- source_word: ἀνοσίου καὶ βεβήλου
  choice: gottlosen und unheiligen
  rationale: Die beiden religiös-moralischen Negativbegriffe bleiben als gesonderte Bezeichnungen erhalten.
- source_word: θράσει καὶ σθένει πεφρυασμένου
  choice: von Anmaßung und Kraft aufgebläht
  rationale: „Aufgebläht“ erhält das anschauliche Bild des Perfektpartizips; „Anmaßung“ gibt das feindselig-dreiste θράσος wieder, „Kraft“ das σθένος.
theological_decisions:
- issue: Häufung göttlicher Titel in der Anrufung
  choice: 'Jeder Titel wird eigenständig wiedergegeben: „Herr … König … Gebieter … Heiliger … Alleinherrscher … Allmächtiger“.'
  alternative: Mehrere Titel unter wiederholtem „Herr“ oder „Herrscher“ zusammenzufassen.
  rationale: Die Reihung ist ein wesentliches rhetorisches und theologisches Merkmal des Gebets; unterschiedliche deutsche Ausdrücke bewahren die Nuancen der griechischen Titel.
- issue: Ergänzung eines Bezugswortes beim substantivisch gebrauchten Partizip
  choice: „Mann“ wird zur verständlichen deutschen Satzbildung ergänzt und in einer Fußnote ausgewiesen.
  alternative: Eine unpersönliche oder schwerfällige Konstruktion ohne ergänztes Bezugswort.
  rationale: Die griechische maskuline Singularform bezeichnet eine einzelne feindliche Person, nennt aber das Substantiv „Mann“ nicht ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch mit bewusst erhaltener Titelhäufung. Ungewöhnliche Bildsprache wie „aufgebläht“ bleibt wegen der Ausdruckskraft des griechischen Textes erhalten.
