  naturalness: 'Der Vers ist insgesamt natürlich und würdevoll formuliert. Die Fußnote b ist jedoch in ihrer angeblich wörtlichen Form sprachlich und syntaktisch missverständlich: „an den Seelen“ bildet den Akkusativ der Beziehung τὰς ψυχάς nicht angemessen ab. Auch Fußnote a enthält mit „zuvor- oder einem Bedürfnis zuvorkommt“ einen fehlerhaften bzw. unvollständigen Ausdruck.'
