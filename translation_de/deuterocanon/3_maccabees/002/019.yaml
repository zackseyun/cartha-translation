  yaml_path: translation/deuterocanon/3_maccabees/002/019.yaml
  text: Let your mercies quickly come before us[a]; and put praise in the mouth of those who have fallen and whose souls are crushed[b], having made peace for us.
translation:
  language: de
  text: Dein Erbarmen komme uns schnell zuvor[a]; lege Lob in den Mund derer, die zu Boden gesunken und in ihrer Seele zerschlagen sind[b], und schaffe uns Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dein Erbarmen eile uns voraus.“ Das griechische Verb kann sowohl „zuvorkommen“ als auch „vorausgehen“ im Sinn eines rechtzeitigen Entgegenkommens bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Gefallenen und hinsichtlich ihrer Seele Zerschlagenen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλαβέτωσαν
  choice: komme uns schnell zuvor
  rationale: Das Verb kann ein Zuvorkommen beziehungsweise vorzeitiges Erreichen bezeichnen. Im Gebet drückt die Wendung aus, dass Gottes Erbarmen die Not rasch erreichen und ihr zuvorkommen möge; die Mehrdeutigkeit der Bewegungsrichtung wird in der Fußnote bewahrt.
- source_word: οἱ οἰκτιρμοί σου
  choice: dein Erbarmen
  rationale: Der griechische Plural bezeichnet Gottes vielfältig erfahrene barmherzige Zuwendung. Im modernen Deutschen ist der Kollektivsingular „Erbarmen“ in dieser Gebetssprache natürlicher als „Erbarmungen“.
- source_word: αἰνέσεις
  choice: Lob
  rationale: Obwohl das griechische Wort im Plural steht, gibt das deutsche Kollektivwort „Lob“ die Wendung natürlich wieder und erhält das Bild vom Lob im Mund der Niedergeschlagenen.
- source_word: καταπεπτωκότων
  choice: die zu Boden gesunken sind
  rationale: Das Perfektpartizip bezeichnet Menschen im fortdauernden Zustand des Gefallenseins oder Niedergesunkenseins. Die Formulierung lässt sowohl äußere Erniedrigung als auch tiefe Niedergeschlagenheit anklingen.
- source_word: συντετριμμένων τὰς ψυχάς
  choice: in ihrer Seele zerschlagen sind
  rationale: Die ungewöhnliche griechische Konstruktion beschreibt Personen, die hinsichtlich ihrer Seelen zerschlagen sind. Die Wiedergabe bleibt ψυχή als „Seele“ treu, ohne daraus eine technische Anthropologie abzuleiten.
- source_word: ποιήσας ἡμῖν εἰρήνην
  choice: und schaffe uns Frieden
  rationale: Das Aoristpartizip schließt sich an die Bitten an und kann idiomatisch als weitere Aufforderung wiedergegeben werden. „Frieden schaffen“ bewahrt ποιέω und εἰρήνη, während eine schwer verständliche deutsche Partizipialkonstruktion vermieden wird.
theological_decisions:
- issue: Anthropologischer Ausdruck ψυχή
  choice: Seele
  alternative: Innerstes; Leben
  rationale: „Seele“ bildet den ausdrücklich verwendeten griechischen Begriff transparent ab. Der Kontext beschreibt den innerlich zerschlagenen Zustand, legt aber keine ausgearbeitete Lehre über die Bestandteile des Menschen fest.
- issue: Zeitlicher beziehungsweise logischer Bezug von ποιήσας
  choice: 'als koordinierte Bitte: „und schaffe uns Frieden“'
  alternative: „nachdem du uns Frieden geschaffen hast“; „indem du uns Frieden schaffst“
  rationale: Das adverbiale Verhältnis des Aoristpartizips zu den Imperativen ist nicht vollständig festgelegt. Im Gebetszusammenhang ist eine beigeordnete Bitte natürlich und vermeidet die fragwürdige Festlegung, der Frieden sei bereits geschaffen worden.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Der Kollektivsingular „Erbarmen“ und „Lob“ ist im Deutschen natürlicher als eine erzwungene Wiedergabe der griechischen Plurale. Die Satzfolge bleibt nahe am Griechischen, während der abschließende Partizipialsatz als klare Bitte formuliert wird.
