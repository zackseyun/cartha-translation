- from: Nachdem er aber nach Ägypten gebracht worden war[a] und seine Bosheit durch die bereits erwähnten Zechgenossen[b] und Gefährten, die allem, was recht ist, völlig fernstanden,[c] noch steigerte,
  to: Nachdem er aber nach Ägypten gebracht worden war[a] und durch die bereits erwähnten Trinkgefährten[b] und Gefährten, die von allem, was recht ist, getrennt waren,[c] seine Bosheit noch steigerte,
