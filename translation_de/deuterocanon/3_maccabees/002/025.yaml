  verdict: revise
  source_fidelity: 'Die Satzstruktur und die wesentlichen Bedeutungen werden zutreffend wiedergegeben: διακομισθείς bleibt passiv und ohne Angabe des Transportmittels, ἐπαύξων bezeichnet die fortgesetzte Steigerung der κακία, und διὰ markiert die Vermittlung durch die genannten Personen. »Völlig fernstanden« verschiebt jedoch die umfassende Bestimmung von παντὸς δικαίου leicht zu einer bloßen Gradangabe. Näher am Griechischen ist »von allem, was recht ist, getrennt waren«.'
  naturalness: Die bewusst unvollständige, in den Folgesatz weiterführende Periode ist im Deutschen verständlich und dem Kontext angemessen. »Zechgenossen« ist verständlich, wirkt aber leicht altertümlich; »Trinkgefährten« ist modernstandardsprachlich und erhält den sozialen Sinn.
  terminology: »Bosheit«, »Gefährten« und »allem, was recht ist« sind angemessen. Die Fußnote zu συνπόται sollte nicht behaupten, der Ausdruck selbst bezeichne notwendigerweise verderbliche Personen; die negative Charakterisierung ergibt sich im Kontext aus ihrer Trennung von allem Rechten.
