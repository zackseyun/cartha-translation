translation_notes:
  register: Moderne, gehobene Standardsprache. Die lange, mit einem Komma weiterführende Satzperiode bleibt erhalten, da der griechische Vers syntaktisch in den folgenden Zusammenhang hineinführt. »Zechgenossen« ist bewusst prägnant und negativ gefärbt; »allem, was recht ist« bewahrt die umfassende Bedeutung von παντὸς δικαίου.
