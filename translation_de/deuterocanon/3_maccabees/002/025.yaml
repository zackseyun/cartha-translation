  yaml_path: translation/deuterocanon/3_maccabees/002/025.yaml
  text: But after he had been conveyed to Egypt[a], and was increasing his wickedness through the previously mentioned drinking companions and associates, who had been estranged from all justice[c][b],
translation:
  language: de
  text: Nachdem er aber nach Ägypten gebracht worden war[a] und durch die bereits erwähnten Trinkgefährten[b] und Gefährten, die von allem, was recht ist, getrennt waren,[c] seine Bosheit noch steigerte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »nach Ägypten überführt worden war«. Das Griechische legt nicht fest, auf welche Weise er dorthin gebracht wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Mittrinker«; gemeint sind Personen, die miteinander trinken. Der Zusammenhang kennzeichnet sie als moralisch verderbte Gefährten.'
    reason: cultural_note
  - marker: c
    text: 'Auch: »die von aller Gerechtigkeit getrennt waren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακομισθεὶς
  choice: nach Ägypten gebracht worden war
  rationale: Das passive Partizip bezeichnet die Verbringung beziehungsweise Überführung nach Ägypten, ohne die Art der Beförderung festzulegen.
- source_word: ἐπαύξων
  choice: noch steigerte
  rationale: Das Präsenspartizip beschreibt eine fortdauernde Zunahme; im Deutschen wird es innerhalb der Satzperiode mit einer finiten Verbform natürlich wiedergegeben.
- source_word: κακίας
  choice: Bosheit
  rationale: Der Ausdruck bezeichnet hier umfassende moralische Verderbtheit beziehungsweise böses Handeln, nicht nur eine einzelne Tat.
- source_word: προαποδεδειγμένων
  choice: bereits erwähnten
  rationale: Das Wort verweist auf zuvor im Erzählzusammenhang bezeichnete Personen; »bereits erwähnt« gibt diesen Rückbezug idiomatisch wieder.
- source_word: συνποτῶν
  choice: Zechgenossen
  rationale: Gemeint sind wörtlich Personen, die gemeinsam trinken. »Zechgenossen« bewahrt den geselligen, hier aber deutlich negativen Beiklang.
- source_word: ἑταίρων
  choice: Gefährten
  rationale: Der allgemeine Ausdruck für Begleiter oder Genossen wird so von den spezielleren »Zechgenossen« unterschieden, ohne echte Freundschaft zu unterstellen.
- source_word: τοῦ παντὸς δικαίου κεχωρισμένων
  choice: die allem, was recht ist, völlig fernstanden
  rationale: Das Perfektpartizip bezeichnet einen verfestigten Zustand der Trennung; die substantivierte Wendung umfasst alles Rechte beziehungsweise Gerechte.
