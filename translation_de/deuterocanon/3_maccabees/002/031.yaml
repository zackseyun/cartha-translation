review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Satzes zutreffend wieder: die Teilgruppe (ἔνιοι), ihre oberflächlich-leichtfertige Verachtung (ἐπιπολαίως στυγοῦντες), die metaphorischen „Stützen/Grundlagen“ der städtischen Frömmigkeit, ihre willige Selbsthingabe sowie die erwartete Teilhabe an öffentlichem Ansehen aufgrund eines künftigen Umgangs mit dem König. Die Fußnote wahrt die lexikalische Offenheit von ἐπιβάθρα. Die Formulierung „gaben sich … hin“ ist jedoch im heutigen Deutsch ohne Ergänzung semantisch zu unbestimmt und kann eher Selbstaufgabe oder Hingabe als freiwilliges Ausliefern nahelegen.'
  naturalness: Der Satz ist insgesamt gut verständlich und hat ein angemessen würdiges Register. „Sich bereitwillig ausliefern“ ist hier idiomatischer und deutlicher als „sich bereitwillig hingeben“. Die Umformung von „als würden sie“ zu „in der Erwartung, …“ gibt die durch ὡς markierte Vorstellung beziehungsweise Erwartung natürlicher wieder. „An großem Ansehen teilhaben“ bleibt eine angemessene, leicht gehobene Wiedergabe.
  terminology: „Frömmigkeit der Stadt“ ist für εὐσεβεία tragfähig und erhält den religiös-ethischen Sinn ohne konfessionelle Engführung. „Stützen“ bewahrt die Metapher von ἐπιβάθραι; die Fußnote nennt mit „Grundlagen“ und „Gottesverehrung“ sinnvolle Alternativen. „Ansehen“ gibt εὐκλεία im Kontext öffentlichen Rufs passend wieder. „Umgang mit dem König“ entspricht συναναστροφή als gesellschaftlicher Verbindung und behauptet keine intime Beziehung.
