  yaml_path: translation/deuterocanon/3_maccabees/002/031.yaml
  text: But some[a], lightly despising the foundations of the city's piety, readily gave themselves up, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: de
  text: Einige aber verachteten leichtfertig die Stützen der Frömmigkeit der Stadt[a] und lieferten sich bereitwillig aus, in der Erwartung, durch den künftigen Umgang mit dem König an großem Ansehen teilzuhaben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Grundlagen der Frömmigkeit der Stadt“ beziehungsweise „die Stützen der Gottesverehrung der Stadt“. Das griechische Wort bezeichnet wörtlich einen Sockel, eine Stufe oder eine Stütze und wird hier bildlich gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: Einige
  rationale: Gibt die unbestimmte Teilgruppe knapp und natürlich wieder.
- source_word: ἐπιπολαίως
  choice: leichtfertig
  rationale: Bezeichnet hier eine oberflächliche, bedenkenlose Haltung; „leichtfertig“ ist im Deutschen idiomatischer als „leicht“.
- source_word: στυγοῦντες
  choice: verachteten
  rationale: Bewahrt die starke Ablehnung, ohne zwingend ein rein emotionales Hassen auszudrücken.
- source_word: ἐπιβάθρας
  choice: Stützen
  rationale: Erhält das metaphorische Bild eines tragenden Unterbaus; auch „Grundlagen“ ist möglich.
- source_word: τὰς τῆς πόλεως εὐσεβείας
  choice: die Stützen der Frömmigkeit der Stadt
  rationale: εὐσέβεια bezeichnet religiöse Frömmigkeit beziehungsweise Gottesverehrung; die Genitivverbindung wird bewusst nicht zu einer bloßen Institution verflacht.
- source_word: εὐχερῶς
  choice: bereitwillig
  rationale: Drückt sowohl Bereitschaft als auch fehlendes Zögern aus.
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: gaben sich hin
  rationale: Wahrt die reflexive, freiwillige Selbstpreisgabe, ohne ein im Kontext nicht ausdrücklich genanntes Gegenüber einzufügen.
- source_word: κοινωνήσοντες
  choice: würden … teilhaben
  rationale: Gibt die erwartete künftige Beteiligung wieder.
- source_word: εὐκλείας
  choice: Ansehen
  rationale: Bezeichnet guten Ruf oder öffentliches Ansehen; vermeidet die stärker theologisch gefärbte Wiedergabe „Herrlichkeit“.
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: durch den künftigen Umgang mit dem König
  rationale: συναναστροφή meint gesellschaftlichen Umgang oder Verbindung; ἐσομένης kennzeichnet diesen als erwartet beziehungsweise künftig.
theological_decisions:
- issue: Wiedergabe von εὐσεβείας im städtisch-religiösen Zusammenhang
  choice: Frömmigkeit der Stadt
  alternative: Gottesverehrung der Stadt; religiöse Praxis der Stadt
  rationale: „Frömmigkeit“ wahrt den religiös-ethischen Gehalt und lässt offen, ob besonders die Haltung, die Verehrung oder ihre gesellschaftlichen Ausdrucksformen gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ungewöhnliche Metapher „Stützen der Frömmigkeit“ bleibt erhalten und wird durch die Fußnote erläutert; der Satzbau wurde für natürliche deutsche Lesbarkeit behutsam geordnet.
