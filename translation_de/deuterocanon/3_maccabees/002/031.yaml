revisions:
- from: Einige aber verachteten leichtfertig die Stützen der Frömmigkeit der Stadt[a] und gaben sich bereitwillig hin, als würden sie durch den künftigen Umgang mit dem König an großem Ansehen teilhaben.
  to: Einige aber verachteten leichtfertig die Stützen der Frömmigkeit der Stadt[a] und lieferten sich bereitwillig aus, in der Erwartung, durch den künftigen Umgang mit dem König an großem Ansehen teilzuhaben.
  rationale: 'Die Revision beschränkt sich auf zwei sichere stilistisch-semantische Verbesserungen: „lieferten sich … aus“ verdeutlicht die reflexive Selbstpreisgabe von ἑαυτοὺς ἐδίδοσαν, ohne ein im Griechischen nicht genanntes Gegenüber einzuführen; „in der Erwartung“ gibt die erwartende Perspektive von ὡς … κοινωνήσοντες idiomatisch wieder. Metapher, Ambiguität und Fußnotenalternativen bleiben erhalten.'
