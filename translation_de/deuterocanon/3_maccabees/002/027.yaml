  yaml_path: translation/deuterocanon/3_maccabees/002/027.yaml
  text: He publicly proposed to spread reproach against the nation; having set up a stele on the tower by the court, he engraved an inscription
translation:
  language: de
  text: Er nahm sich vor, öffentlich Schmach gegen das Volk zu verbreiten; auf dem Turm beim Hof[b] richtete er eine Stele[a] auf und meißelte eine Inschrift ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Säule“ oder „ein Denkmal“. Das griechische Wort bezeichnet ein aufgerichtetes Steinmal, das sich für eine Inschrift eignet.'
    reason: lexical_alternative
  - marker: b
    text: „Hof“ kann hier auch einen Palasthof oder einen umschlossenen Innenhof bezeichnen. Die genaue bauliche Gegebenheit geht aus dem griechischen Text allein nicht hervor.
    reason: cultural_note
lexical_decisions:
- source_word: προέθετο
  choice: fasste den Entschluss
  rationale: Das Medium von προτίθημι bezeichnet hier ein Sich-Vornehmen bzw. einen gefassten Plan; die Wiedergabe vermeidet den im Deutschen naheliegenden Sinn eines bloßen Vorschlags.
- source_word: δημοσίᾳ
  choice: öffentlich
  rationale: Das Adverb bezeichnet ein öffentliches bzw. offenes Vorgehen.
- source_word: διαδοῦναι
  choice: zu verbreiten
  rationale: Der Infinitiv beschreibt das Verbreiten oder Bekanntmachen der gegen das Volk gerichteten Schmach.
- source_word: ψόγον
  choice: Schmach
  rationale: ψόγος kann Tadel, Vorwurf oder Schande bezeichnen; im Zusammenhang öffentlicher Herabsetzung gibt „Schmach“ die ehrverletzende Wirkung natürlich wieder.
- source_word: ἔθνους
  choice: das Volk
  rationale: Gemeint ist das jüdische Volk als kollektive Gemeinschaft; „Volk“ klingt im modernen Deutschen natürlicher als „Nation“, ohne den korporativen Sinn aufzugeben.
- source_word: πύργου
  choice: Turm
  rationale: Entspricht dem Grundsinn von πύργος; eine nähere militärische Bestimmung bietet der griechische Text nicht.
- source_word: στήλην
  choice: Stele
  rationale: στήλη bezeichnet ein aufgerichtetes, für eine Inschrift bestimmtes Steinmal; der präzise Fachbegriff wird durch eine Fußnote erläutert.
- source_word: ἀναστήσας
  choice: ließ er ... aufstellen
  rationale: Das Aoristpartizip bezeichnet das der Einmeißelung vorausgehende Aufrichten; kausatives „ließ ... aufstellen“ ist im Herrscherkontext idiomatisch, ohne auszuschließen, dass der Text grammatisch schlicht „aufgestellt habend“ sagt.
- source_word: ἐκόλαψεν
  choice: meißelte ... ein
  rationale: Das Verb bezeichnet das Einschneiden oder Eingravieren; bei einer Stele ist „einmeißeln“ konkret und idiomatisch.
- source_word: γραφὴν
  choice: eine Inschrift
  rationale: Im Kontext des Steinmals bezeichnet γραφή den dort eingravierten Text.
- source_word: ἐπὶ τοῦ κατὰ τὴν αὐλὴν πύργου
  choice: auf dem Turm beim Hof
  rationale: Die Wendung lokalisiert den Turm bei bzw. am Hof; „beim Hof“ bewahrt die räumliche Offenheit, ohne αὐλή vorschnell als Palast festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wird gegenüber der langen griechischen Periode in zwei Sätze gegliedert. Die technische Bezeichnung „Stele“ bleibt wegen ihrer Genauigkeit erhalten und wird erklärt; „Schmach über das Volk verbreiten“ wahrt die feindselige öffentliche Herabsetzung.
