lexical_decisions:
- source_word: ταχέως
  choice: schnell
  rationale: Gibt die zeitliche Bedeutung des Adverbs klar und in natürlichem modernem Deutsch wieder.
- source_word: αὐτὸν
  choice: ihn
  rationale: Entspricht dem maskulinen Akkusativpronomen und verweist auf die zuvor genannte Person.
- source_word: ἐξείλκυαν
  choice: zerrten … hinaus
  rationale: Das Verb bezeichnet ein Herausziehen; „zerren“ bewahrt den Eindruck einer kräftigen, gewaltsamen Bewegung.
- source_word: ὑπερβάλλοντι
  choice: übermächtiger
  rationale: Kennzeichnet die Angst als außerordentlich stark und über das gewöhnliche Maß hinausgehend.
- source_word: καταπεπληγμένοι
  choice: gepackt
  rationale: Das Perfektpartizip beschreibt den anhaltenden Zustand der Handelnden, die von der Angst heftig ergriffen worden sind.
- source_word: φόβῳ
  choice: Angst
  rationale: Gibt den hier stark intensivierten φόβος im Deutschen natürlich wieder.
