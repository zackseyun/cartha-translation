base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/026.yaml
  text: He was not only inflamed with shameless debaucheries[a], but also advanced to such a degree of audacity that slanders were being stirred up in the places, and many of his friends, straining toward the king’s purpose[b], were themselves following his will.
translation:
  language: de
  text: Er wurde nicht nur von schamlosen Ausschweifungen zerfressen, sondern ging in seiner Dreistigkeit auch so weit, dass es an verschiedenen Orten[a] zu Verleumdungen[b] kam und viele seiner Freunde, die auf das Vorhaben des Königs hinarbeiteten, auch selbst seinem Willen folgten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Bezirken“ beziehungsweise „in den einzelnen Gegenden“. Die griechische Ortsangabe ist allgemein gehalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu übler Nachrede“ beziehungsweise „zu Beschimpfungen“. Das griechische Wort kann allgemein abwertende oder verleumderische Rede bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηκέσθη
  choice: wurde … zerfressen
  rationale: Das Verb bezeichnet wörtlich ein Beißen oder Nagen. „Zerfressen“ bewahrt dieses kräftige Bild und drückt zugleich aus, dass die Ausschweifungen ihn innerlich beherrschten.
- source_word: ἀναισχύστοις ἀσελγείαις
  choice: von schamlosen Ausschweifungen
  rationale: Die Wendung bezeichnet hemmungsloses, moralisch anstößiges Verhalten; die starke Wertung und der Plural bleiben erhalten.
- source_word: ἐπὶ τοσοῦτον θράσους προῆλθεν
  choice: ging in seiner Dreistigkeit … so weit
  rationale: Die natürliche deutsche Wendung bewahrt sowohl die Steigerung als auch die Vorstellung eines Fortschreitens zu immer größerer Unverschämtheit.
- source_word: δυσφημίας … συνίστασθαι
  choice: dass es … zu Verleumdungen kam
  rationale: Das Medium συνίστασθαι kann hier das Aufkommen oder Zustandekommen übler Nachrede bezeichnen. Die Formulierung vermeidet die nicht ausdrücklich genannte Angabe eines Urhebers.
- source_word: ἐν τοῖς τόποις
  choice: in den Ortschaften
  rationale: Die räumliche Angabe bleibt bewusst allgemein; „Ortschaften“ ist im Deutschen natürlicher als das wörtliche „an den Orten“.
- source_word: ἐντείνοντας εἰς τὴν τοῦ βασιλέως πρόθεσιν
  choice: die auf das Vorhaben des Königs hinarbeiteten
  rationale: Das Partizip bezeichnet ein angestrengtes Ausrichten oder Drängen auf das königliche Vorhaben hin. „Hinarbeiteten“ gibt Richtung und aktive Unterstützung wieder.
- source_word: ἕπεσθαι τῇ ἐκείνου θελήσει
  choice: dessen Willen folgten
  rationale: Die Formulierung wahrt das Bild des Folgens und bezieht ἐκείνου dem unmittelbaren Zusammenhang entsprechend auf den König.
theological_decisions:
- issue: Moralische Kennzeichnung des Verhaltens
  choice: Die starken Ausdrücke wurden mit „schamlosen Ausschweifungen“ und „zerfressen“ wiedergegeben.
  alternative: Abschwächende Wiedergaben wie „unsittliches Verhalten“ oder „wurde davon angetrieben“.
  rationale: Der griechische Text urteilt ausgesprochen scharf, ohne dabei eine spätere konfessionelle Kategorie einzuführen.
- issue: Bezug von ἐκείνου im Schlusssatz
  choice: „dessen“ bezieht sich auf den König.
  alternative: Bezug auf eine andere zuvor erwähnte männliche Person.
  rationale: Die unmittelbar vorausgehende Erwähnung des Vorhabens des Königs legt diesen Bezug nahe; eine geringe syntaktische Restoffenheit bleibt durch das deutsche Relativpronomen erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem langen griechischen Steigerungssatz, bleibt aber durch idiomatische Wendungen wie „ging … so weit“ und „es kam zu“ gut verständlich.
