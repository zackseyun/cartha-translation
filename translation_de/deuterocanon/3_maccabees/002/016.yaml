base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/016.yaml
  text: Do not punish us for their uncleanness[a], nor call us to account for profanation, lest the lawless boast in their wrath and exult in the pride of their tongue, saying[b],
translation:
  language: de
  text: 'Bestrafe uns nicht für die Unreinheit dieser Leute[a], und zieh uns auch nicht wegen der Entweihung[b] zur Rechenschaft, damit die Gesetzlosen nicht in ihrem Zorn prahlen und nicht im Hochmut ihrer Zunge frohlocken und sagen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Räche dich nicht an uns wegen der Unreinheit dieser.“ Das griechische Verb kann das Vollziehen von Recht oder Vergeltung bezeichnen; „dieser“ kann sich auf Personen, formal aber auch auf Dinge beziehen.'
    reason: lexical_and_referential_alternative
  - marker: b
    text: 'Oder: „Profanierung“. Gemeint ist, dass Heiliges wie etwas Gewöhnliches behandelt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδίκησῃς
  choice: Bestrafe
  rationale: Das Verb bezeichnet hier vergeltendes Einschreiten beziehungsweise das Vollziehen von Recht. „Bestrafe“ gibt die Bitte in natürlichem Deutsch wieder, ohne Gott persönliche Rachsucht zuzuschreiben; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: ἀκαθαρσίᾳ
  choice: Unreinheit
  rationale: „Unreinheit“ wahrt den religiös-kultischen und zugleich möglichen moralischen Sinn des griechischen Begriffs.
- source_word: εὐθύνῃς
  choice: zieh … zur Rechenschaft
  rationale: Die Wendung erhält den forensischen Sinn des Verbs, das ein Prüfen und Fordern von Rechenschaft ausdrücken kann.
- source_word: βεβηλώσει
  choice: Entweihung
  rationale: Der Ausdruck bezeichnet die profane Behandlung des Heiligen. „Entweihung“ ist gegenwärtig, verständlich und unterscheidet sich klar von der zuvor genannten „Unreinheit“.
- source_word: παράνομοι
  choice: die Gesetzlosen
  rationale: Die substantivierte Bezeichnung bewahrt den moralisch-rechtlichen Bezug auf Menschen, die gegen das Gesetz handeln.
- source_word: καυχήσωνται
  choice: prahlen
  rationale: „Prahlen“ gibt das selbstgefällige Rühmen wieder und bleibt vom nachfolgenden Ausdruck überschwänglicher Freude unterschieden.
- source_word: ἀγαλλιάσωνται
  choice: frohlocken
  rationale: Das Verb bezeichnet überschwängliches Jubeln; „frohlocken“ passt zum gehobenen Gebetsstil.
- source_word: ἐν θυμῷ αὐτῶν
  choice: in ihrem Zorn
  rationale: Die Formulierung folgt der griechischen Wendung und bewahrt θυμός als heftigen Zorn, ohne die Beziehung syntaktisch weiter auszudeuten.
- source_word: ἐν ὑπερηφανίᾳ γλώσσης αὐτῶν
  choice: im Hochmut ihrer Zunge
  rationale: Die bildhafte Genitivkonstruktion des Griechischen bleibt erhalten und ist im gehobenen modernen Deutsch verständlich.
- source_word: λέγοντες
  choice: 'und sagen:'
  rationale: Das Partizip leitet den im folgenden Vers fortgesetzten Ausspruch ein; der Doppelpunkt zeigt diese offene Fortsetzung an.
theological_decisions:
- issue: Bezug von τούτων („dieser“ beziehungsweise „dieser Dinge“)
  choice: '„dieser Leute“: Die Unreinheit wird den zuvor beziehungsweise im Zusammenhang gemeinten feindlichen Menschen zugeordnet.'
  alternative: '„dieser Dinge“: Das Demonstrativpronomen kann formal auch sachlich verstanden werden.'
  rationale: Der Gegensatz zwischen „uns“ und den anschließend genannten „Gesetzlosen“ stützt den personalen Bezug. Die mögliche sachliche Lesart wird jedoch in der Fußnote offengehalten.
- issue: Verantwortung der Betenden für fremde Entweihung
  choice: Die Bitte lautet, die Betenden weder für die Unreinheit anderer zu bestrafen noch wegen der Entweihung zur Rechenschaft zu ziehen.
  alternative: Die zweite Wendung könnte allgemeiner eine Prüfung „bei/in Entweihung“ bezeichnen, ohne deren Urheber ausdrücklich festzulegen.
  rationale: Das Griechische nennt bei βεβήλωσις kein Besitzpronomen. Daher wird im Haupttext kein ausdrückliches „ihre Entweihung“ ergänzt.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die Satzstruktur bleibt dem griechischen Parallelismus nahe, wird aber durch „auch“ und die wiederholte Verneinung im Deutschen klar geführt. „Frohlocken“ und „Hochmut ihrer Zunge“ erhalten den erhöhten poetischen Ton.
