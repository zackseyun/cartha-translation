  yaml_path: translation/deuterocanon/3_maccabees/002/020.yaml
  text: There the God who watches over all[a], the holy ancestor among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness,
translation:
  language: de
  text: Da erhörte Gott, der über alle wacht, der heilige Ahnherr unter den Heiligen[a], das rechtmäßige Flehen und geißelte den, der sich in Frevelmut und Dreistigkeit maßlos überhoben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der heilige Ahnherr im Heiligtum“ beziehungsweise „in den heiligen Dingen“. Die griechische Wendung kann sich auf heilige Personen, Orte oder Dinge beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐνταῦθα
  choice: Da
  rationale: „Da“ kann im Deutschen sowohl auf den soeben genannten Ort als auch auf den erzählten Zeitpunkt zurückweisen und bewahrt damit die adverbiale Offenheit.
- source_word: ἐπόπτης
  choice: der über alle wacht
  rationale: Die verbale Wiedergabe bezeichnet Gottes aufmerksames Schauen und seine Aufsicht, ohne den institutionell klingenden Titel „Aufseher“ zu verwenden.
- source_word: προπάτωρ
  choice: Ahnherr
  rationale: „Ahnherr“ bewahrt die ungewöhnliche, personale Bezeichnung Gottes als Vorvater, ohne sie zur geläufigeren, aber nicht ausdrücklich dastehenden Formel „Gott unserer Väter“ zu erweitern.
- source_word: ἅγιος ἐν ἁγίοις
  choice: der heilige Ahnherr unter den Heiligen
  rationale: Die personenbezogene Lesart fügt sich unmittelbar an die Gottesbezeichnungen an. Da ἐν ἁγίοις auch örtlich oder sachlich-kultisch verstanden werden kann, wird diese Möglichkeit in der Fußnote erhalten.
- source_word: εἰσακούσας
  choice: erhörte
  rationale: Das Verb bezeichnet im Gebetszusammenhang nicht bloß akustisches Hören, sondern das gnädige Hören einer Bitte. Die Koordination ist im Deutschen natürlicher als eine schwere Partizipialkonstruktion.
- source_word: εὐθέσμου λιτανείας
  choice: das rechtmäßige Flehen
  rationale: „Rechtmäßig“ gibt die Übereinstimmung mit Recht, Ordnung oder gebührender Sitte wieder; „Flehen“ bezeichnet die eindringliche Gebetsbitte ohne spätere liturgische Nebenbedeutungen von „Litanei“.
- source_word: ἐμάστιξεν
  choice: geißelte
  rationale: Die Wiedergabe bewahrt das anschauliche Bild einer schweren göttlichen Züchtigung.
- source_word: ὕβρει καὶ θράσει
  choice: in Frevelmut und Dreistigkeit
  rationale: „Frevelmut“ erfasst die übergriffige, ehrverletzende Selbstüberhebung von ὕβρις; „Dreistigkeit“ gibt den hier negativen Sinn vermessener Kühnheit von θράσος wieder.
- source_word: μεγάλως ἐπηρμένον
  choice: sich … maßlos überhoben hatte
  rationale: Die Formulierung erhält das Bild des Sich-Erhebens in hochmütigem Sinn; „maßlos“ gibt die verstärkende Wirkung von μεγάλως idiomatisch wieder.
theological_decisions:
- issue: Die ungewöhnliche Bezeichnung Gottes als προπάτωρ
  choice: Ahnherr
  alternative: Gott unserer Väter; Vorfahr; Stammvater
  rationale: Der griechische Text nennt Gott selbst θεὸς καὶ προπάτωρ. Die Übersetzung bewahrt diese spannungsreiche Bezeichnung und ersetzt sie nicht durch eine vertraute theologische Formel.
- issue: Deutung von ἅγιος ἐν ἁγίοις
  choice: der heilige Ahnherr unter den Heiligen
  alternative: der heilige Ahnherr im Heiligtum / in den heiligen Dingen
  rationale: Die persönliche Deutung ist syntaktisch gut möglich und schließt an die Gottesprädikate an. Die ebenfalls mögliche kultisch-räumliche oder sachliche Deutung wird wegen der echten Mehrdeutigkeit ausdrücklich in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung ist bewusst klar, während „Ahnherr“, „Frevelmut“ und „geißelte“ die gehobene Gebetssprache und die kräftigen Bilder des griechischen Textes erhalten. Die aoristische Partizipialkonstruktion wird zur natürlichen deutschen Koordination aufgelöst.
