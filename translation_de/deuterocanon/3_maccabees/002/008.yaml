    rationale: Die Wendung ist syntaktisch schwierig; „nichts“ bildet ihren Sinn („nichts von allem“) natürlicher ab als die Abhängigkeitsformulierung. Die Fußnote soll die knappe wörtliche Nähe und die Unsicherheit erläutern.
