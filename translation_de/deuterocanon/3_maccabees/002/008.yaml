base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/008.yaml
  text: You[a], O King, having created the boundless and immeasurable earth, chose this city and made this place holy for your name, though you have no need of anything[b], O God of all, and glorified it with majestic manifestation, having established it for the glory of your great and honored name.
translation:
  language: de
  text: Du, König, hast die grenzenlose und unermessliche Erde erschaffen, diese Stadt erwählt und diesen Ort für deinen Namen geheiligt – für dich, der du nichts brauchst[a]. Du hast ihn durch eine majestätische Erscheinung[b] herrlich gemacht und ihn zur Verherrlichung deines großen und geehrten Namens fest gegründet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Satzbau ist hier schwierig. Wörtlich etwa: „für dich, der du nichts von allem nötig hast“. Die Wendung beschreibt den angeredeten Gott als den, der nichts benötigt; eine stärker titelartige Auffassung ist ebenfalls möglich.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „durch ein prachtvolles Erscheinen“. Das griechische Wort kann auf eine sichtbare göttliche Erscheinung hinweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦ
  choice: König
  rationale: Der Vokativ richtet sich im Gebet unmittelbar an Gott. „König“ bewahrt den erhabenen Ton, ohne im Deutschen ein zusätzliches „o“ zu benötigen.
- source_word: κτίσας τὴν ἀπέρατον καὶ ἀμέτρητον γῆν
  choice: hast die grenzenlose und unermessliche Erde erschaffen
  rationale: Die beiden verstärkenden Adjektive und der kosmische Schöpfungsbezug bleiben erhalten. Das griechische Partizip wird für natürliches modernes Deutsch als finites Verb wiedergegeben.
- source_word: ἐξελέξω
  choice: hast ... erwählt
  rationale: „Erwählt“ gibt die bewusste Wahl dieser Stadt wieder und entspricht dem würdevollen Gebetsregister.
- source_word: ἡγίασας τὸν τόπον τοῦτον εἰς σὸν ὄνομά
  choice: diesen Ort für deinen Namen geheiligt
  rationale: „Geheiligt“ bewahrt den Heiligkeitsbegriff; „für deinen Namen“ drückt die Widmung aus, ohne die Wendung auszudeuten.
- source_word: ἀπροσδεεῖ
  choice: der du von nichts abhängig bist
  rationale: Das Adjektiv bezeichnet den, der nichts zusätzlich benötigt. Die Formulierung ist im Deutschen natürlicher als „der du nichts nötig hast“ und bringt Gottes Bedürfnislosigkeit zum Ausdruck.
- source_word: παρεδόξασας
  choice: hast ihn ... herrlich gemacht
  rationale: Die Wiedergabe hält den Bezug zum Wortfeld δόξα aufrecht und vermeidet das im Deutschen missverständliche „verherrlicht“, das eher eine menschliche Ehrung bezeichnen könnte.
- source_word: ἐν ἐπιφανείᾳ μεγαλοπρεπεῖ
  choice: durch eine majestätische Erscheinung
  rationale: „Erscheinung“ lässt sowohl eine sichtbare Offenbarung als auch eine allgemeinere glanzvolle Manifestation zu; „durch“ gibt den wahrscheinlich instrumentalen Sinn von ἐν wieder.
- source_word: σύστασιν ποιησάμενος αὐτοῦ
  choice: ihn ... fest gegründet
  rationale: Die komprimierte Konstruktion bezeichnet die feste Einrichtung oder Gründung des Ortes. Das Pronomen wird auf den unmittelbar genannten Ort bezogen, ohne eine institutionelle Bedeutung festzuschreiben.
- source_word: πρὸς δόξαν τοῦ μεγάλου καὶ ἐντίμου ὀνόματός σου
  choice: zur Verherrlichung deines großen und hochgeehrten Namens
  rationale: πρός bezeichnet hier Ziel oder Zweck. „Hochgeehrt“ gibt ἔντιμος würdig wieder und unterscheidet sprachlich den Namen von der zuvor herrlich gemachten Stätte.
theological_decisions:
- issue: Syntaktisch schwierige Wendung σοι τῷ τῶν ἁπάντων ἀπροσδεεῖ
  choice: 'als appositionelle Anrede: „für dich, der du von nichts abhängig bist“'
  alternative: '„für dich, den über allem Stehenden, der nichts benötigt“ oder mit Ergänzung: „für dich, den Gott aller“'
  rationale: Artikel, Genitiv und Adjektiv lassen sich am unmittelbarsten als Beschreibung des angeredeten Gottes verstehen, der aller Dinge unbedürftig ist. Die Übersetzung fügt „Gott aller“ nicht ein, da θεός im griechischen Text nicht steht, und kennzeichnet die syntaktische Schwierigkeit in einer Fußnote.
- issue: ἐπιφάνεια als mögliche göttliche Epiphanie
  choice: „majestätische Erscheinung“
  alternative: „majestätische Offenbarung“ oder „prachtvolles Erscheinen“
  rationale: „Erscheinung“ bewahrt die Möglichkeit einer sichtbaren göttlichen Epiphanie, legt deren genaue Art jedoch nicht dogmatisch fest.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die lange griechische Periode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Parallelismen und das wiederkehrende Wortfeld von Herrlichkeit und Name bleiben erkennbar; archaische Formen und konfessionell geprägte Zusätze wurden vermieden.
