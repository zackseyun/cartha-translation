  source_fidelity: Die Übersetzung gibt Schöpfung, Erwählung, Heiligung des Ortes, die herrliche Erscheinung und den Zweck der Verherrlichung des Namens im Wesentlichen zutreffend wieder. Bei σοι τῷ τῶν ἁπάντων ἀπροσδεεῖ verschiebt „von nichts abhängig“ jedoch die Aussage von Bedürfnislosigkeit zu Unabhängigkeit und lässt τῶν ἁπάντων im Fließtext undeutlich werden.
  naturalness: Der würdige, moderne Gebetston ist gelungen. „Der du nichts brauchst“ ist idiomatischer und präziser als „der du von nichts abhängig bist“. Die Beibehaltung von zwei Sätzen ist im Deutschen gut lesbar.
  terminology: „Erde“, „erwählt“, „geheiligt“, „Erscheinung“ und „herrlich gemacht“ sind angemessene Wiedergaben. „Hochgeehrt“ ist möglich, aber „geehrt“ ist im modernen Deutsch schlichter und ausreichend für ἐντίμου.
