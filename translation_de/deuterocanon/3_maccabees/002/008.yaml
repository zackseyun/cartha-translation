    rationale: Das Adjektiv bedeutet, dass der Angeredete nichts benötigt bzw. auf nichts angewiesen ist. „Abhängig“ kann zwar assoziativ passen, formuliert aber eine weitergehende Aussage und verdeckt die konkrete Negation des Bedürfnisses.
  - severity: low
