    issue: »schweren Sünden« für μεγάλας
    rationale: Die griechische Aussage lautet »viele und große Sünden«. Zwar kann »groß« in diesem Zusammenhang die Schwere einschließen, doch »schwer« legt diese Nuance stärker fest als der Ausgangstext.
  - severity: medium
    issue: »liegen kraftlos danieder« für παρείμεθα ἐν ἀδυναμίαις
    rationale: Die Wendung ist stilistisch möglich, führt aber das nicht genannte Bild des Niederliegens ein. Der griechische Ausdruck bezeichnet eher den Zustand des Geschwächt- oder Entkräftetseins.
  revised_text: 'Doch sieh nun, heiliger König: Wegen unserer vielen und großen Sünden werden wir bedrängt; wir sind unseren Feinden unterworfen worden und kraftlos geworden.'
