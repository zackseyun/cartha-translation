review_pass:
  verdict: revise
  source_fidelity: Die Satzglieder und die drei Aussagen der Notlage sind grundsätzlich zutreffend wiedergegeben. »Schweren Sünden« engt jedoch μεγάλας (»großen«) unnötig auf den Sinn »besonders schuldhaft« ein. »Liegen ... danieder« fügt ein konkretes Bild des Liegens hinzu, das παρείμεθα nicht ausdrücklich enthält; gemeint ist ein Zustand der Entkräftung bzw. Schwäche.
  naturalness: Der Text ist insgesamt würdevoll und gut verständlich. »Kraftlos geworden« ist im modernen Deutschen natürlich und gibt den resultativen Zustand ohne die zusätzliche Bildlichkeit von »daniederliegen« wieder.
  terminology: »heiliger König«, »bedrängt« und »unseren Feinden unterworfen worden« sind quellennah, idiomatisch und im Gebetsregister angemessen. »Großen Sünden« bewahrt die offene, wörtlichere Bedeutung von μεγάλας.
