  yaml_path: translation/deuterocanon/3_maccabees/002/012.yaml
  text: 'But look now, holy King: because of our many and great sins we are being oppressed, and we have been subjected to our enemies, and we are left in weakness.'
translation:
  language: de
  text: 'Doch sieh nun, heiliger König: Wegen unserer vielen und großen Sünden werden wir bedrängt; wir sind unseren Feinden unterworfen worden und kraftlos geworden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ δὲ νῦν
  choice: Doch sieh nun
  rationale: Gibt die auffordernde Aufmerksamkeitspartikel ἰδού zusammen mit dem weiterführend-kontrastierenden δέ und νῦν natürlich und dennoch quellennah wieder.
- source_word: ἅγιε Βασιλεῦ
  choice: heiliger König
  rationale: Bewahrt die direkte Anrede im Vokativ und die sakrale Königstitulatur ohne zusätzliche Deutung.
- source_word: διὰ τὰς πολλὰς καὶ μεγάλας ἡμῶν ἁμαρτίας
  choice: wegen unserer vielen und schweren Sünden
  rationale: διά mit Akkusativ bezeichnet hier den Grund. μεγάλας bedeutet wörtlich »großen«, wird bei Sünden im Deutschen aber idiomatisch als »schweren« wiedergegeben.
- source_word: καταπονούμεθα
  choice: werden wir bedrängt
  rationale: Das Passiv bezeichnet belastendes Bedrücken beziehungsweise Misshandeln; »bedrängt« wahrt den Umfang, ohne die Art der Not zu spezifizieren.
- source_word: ὑπετάγημεν τοῖς ἐχθροῖς ἡμῶν
  choice: wir sind unseren Feinden unterworfen worden
  rationale: Gibt den passiven Aorist und den Dativ der Unterordnung präzise wieder.
- source_word: παρείμεθα ἐν ἀδυναμίαις
  choice: liegen kraftlos danieder
  rationale: παρίημι im Passiv kann Erschlaffung oder Entkräftung ausdrücken; die deutsche Wendung vermittelt den resultierenden Zustand natürlicher als eine wörtliche Formulierung mit »Schwächen«.
theological_decisions:
- issue: Ursächlicher Zusammenhang zwischen Sünde und gegenwärtiger Not
  choice: Wegen unserer vielen und schweren Sünden
  alternative: Durch unsere vielen und großen Sünden
  rationale: Die mit διά und Akkusativ ausdrücklich formulierte Selbstdeutung des Gebets wird bewahrt, ohne eine darüber hinausgehende allgemeine Lehre über jedes Leiden zu formulieren.
- issue: Anrede Gottes als König
  choice: heiliger König
  alternative: heiliger Herrscher
  rationale: Βασιλεύς wird direkt als »König« wiedergegeben; die Anrede bleibt theologisch offen und erhält die Bildsprache des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die drei Aussagen über die Notlage bleiben parallel gegliedert; das abschließende Bild vermeidet steife Wörtlichkeit, ohne die Aussage abzuschwächen.
