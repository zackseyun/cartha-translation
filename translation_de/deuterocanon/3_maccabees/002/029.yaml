base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/029.yaml
  text: and that those who registered should also be branded on the body with the ivy-leaf emblem of Dionysus by fire[c][b][a], and should also be enrolled in his reduced status of authority.
translation:
  language: de
  text: und dass diejenigen, die registriert wurden,[a] außerdem am Körper durch Feuer mit dem Efeublattzeichen des Dionysos gebrandmarkt[b] und vorab in die eingeschränkte Stellung eingetragen werden sollten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »die sich registrieren ließen« oder »die eingetragen wurden«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mit dem Efeublattzeichen des Dionysos«. Das Efeublatt war ein Kennzeichen des Dionysos; gemeint ist ein Brandzeichen, das die Betroffenen seinem Kult zuordnete.'
    reason: cultural_note
  - marker: c
    text: Die griechische Wendung ist knapp und in ihrer genauen Bedeutung unsicher. Gemeint sein kann eine eingeschränkte bürgerliche oder rechtliche Stellung beziehungsweise ein verminderter Rang. Das Verb kann zudem bedeuten, dass sie vorab eingetragen werden sollten.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπογραφομένους
  choice: die registriert wurden
  rationale: Das mediale bzw. passive Partizip kann bedeuten, dass sie sich registrieren ließen oder von anderen registriert wurden. Die passive Formulierung wahrt den amtlichen Zusammenhang, ohne Freiwilligkeit vorauszusetzen.
- source_word: χαράσσεσθαι … διὰ πυρὸς εἰς τὸ σῶμα
  choice: durch Feuer am Körper … gebrandmarkt werden
  rationale: In Verbindung mit »durch Feuer« bezeichnet das Verb eine Brandmarkung am Körper, nicht nur ein unspezifisches Kennzeichnen.
- source_word: παρασήμῳ Διονύσου κισσοφύλλῳ
  choice: mit einem Efeublatt, dem Kennzeichen des Dionysos
  rationale: Die beiden Dative bezeichnen das Efeublatt als unterscheidendes kultisches Kennzeichen des Dionysos. Die Apposition ist im Deutschen klar und bewahrt beide Bestandteile.
- source_word: προκαταχωρίσαι
  choice: eingetragen werden
  rationale: Das Verb bezeichnet hier die amtliche Aufnahme in eine festgelegte Kategorie oder Liste; die passive deutsche Fassung fügt sich in die Erlasssprache ein.
- source_word: προσυνεσταλμένην αὐθεντίαν
  choice: die zuvor festgelegte eingeschränkte Rechtsstellung
  rationale: Die schwierige Wendung verbindet den Gedanken einer vorherigen Festlegung mit Einschränkung oder Herabsetzung; αὐθεντία kann in diesem Zusammenhang eine Stellung mit rechtlich-sozialen Folgen bezeichnen. »Rechtsstellung« ist verständlich, bleibt aber durch die Fußnote als unsichere Kontextdeutung gekennzeichnet.
theological_decisions:
- issue: Kultische Brandmarkung mit dem Zeichen des Dionysos
  choice: Dionysos und das Efeublatt werden ausdrücklich genannt.
  alternative: allgemein von einem heidnischen Zeichen sprechen
  rationale: Der griechische Text benennt sowohl die Gottheit als auch ihr Kennzeichen. Diese historische und religiöse Konkretheit darf nicht verallgemeinert werden.
- issue: Mehrdeutige Verwaltungsformel προσυνεσταλμένην αὐθεντίαν
  choice: eingeschränkte Rechtsstellung
  alternative: eingeschränkter Bürgerstatus; beschnittene rechtliche Stellung; verminderter Rang
  rationale: Der Kontext legt eine herabgesetzte rechtlich-soziale Stellung nahe, doch die genaue institutionelle Bedeutung bleibt unsicher. Der Haupttext gibt den wahrscheinlichen Sinn zurück; die Fußnote bewahrt die Unsicherheit.
translation_notes:
  register: Moderne, würdevolle Erlasssprache. Der Satz bleibt als Fortsetzung mit »und dass« fragmentarisch, entsprechend dem griechischen Anschluss. Die kultische Gewalt wird deutlich benannt, während die unsichere verwaltungsrechtliche Terminologie nicht überpräzisiert wird.
