  naturalness: Die revidierte Fassung bleibt eine natürliche, würdige Erlassformulierung und bewahrt den anschließenden Charakter des Satzes mit »und dass«. »Efeublattzeichen« macht die syntaktische Einheit aus Kennzeichen und Efeublatt im Deutschen flüssiger sichtbar.
  terminology: »Brandmarken« gibt χαράσσεσθαι mit διὰ πυρός präzise wieder. »Efeublattzeichen des Dionysos« wahrt die kultische und emblematische Bestimmung. »eingeschränkte Stellung« vermeidet eine nicht gesicherte rechtstechnische Festlegung; die Fußnote erläutert die möglichen sozial-rechtlichen Nuancen.
