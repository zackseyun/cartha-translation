  yaml_path: translation/deuterocanon/3_maccabees/002/024.yaml
  text: But after some time[a], when he had recovered himself, he in no way came to regret it when he was rebuked; rather, having issued a bitter threat[b], he departed.
translation:
  language: de
  text: Später aber, nachdem er sich wieder gefasst hatte,[a] kam er, nachdem er zurechtgewiesen worden war, keineswegs zur Reue.[b] Vielmehr äußerte er eine harte Drohung und ging fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „nachdem er sich wieder gesammelt hatte“. Die griechische Wendung meint hier wahrscheinlich, dass er nach dem vorangegangenen Geschehen seine Fassung wiedergewann.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „änderte er seine Haltung keineswegs“. Die griechische Wendung kann sowohl fehlende Reue als auch die Weigerung bezeichnen, einen Entschluss zu überdenken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν χρόνῳ δὲ ὕστερον
  choice: Später aber
  rationale: Gibt die spätere Zeitangabe knapp wieder und bewahrt mit „aber“ die leicht gegensätzliche Kraft von δέ.
- source_word: ἀναλεξάμενος αὐτόν
  choice: nachdem er sich wieder gefasst hatte
  rationale: 'Die Wendung ist im Zusammenhang am ehesten reflexiv zu verstehen: Der König gewinnt nach dem vorangegangenen Geschehen seine Fassung zurück. Die deutsche Formulierung ist idiomatisch, ohne den Vorgang näher auszudeuten.'
- source_word: οὐδαμῶς εἰς μετάμελον ἦλθεν
  choice: kam er … keineswegs zur Reue
  rationale: Bewahrt das Bild der griechischen Wendung („zur Reue gelangen“) und lässt offen, ob stärker Bedauern oder Sinnesänderung gemeint ist.
- source_word: ἐπιτιμηθείς
  choice: trotz der Zurechtweisung
  rationale: Das passive Partizip bezeichnet eine gegen ihn gerichtete Rüge. „Trotz“ gibt hier den naheliegenden konzessiven Zusammenhang mit seiner ausbleibenden Reue natürlich wieder.
- source_word: μετὰ ἀπειλῆς δὲ πικρᾶς θέμενος
  choice: Vielmehr stieß er eine erbitterte Drohung aus
  rationale: θέμενος ist mit ἀπειλή idiomatisch als Aussprechen beziehungsweise Ausstoßen einer Drohung zu verstehen; „erbittert“ vermittelt die scharfe, feindselige Färbung von πικρός.
- source_word: ἀνέλυσεν
  choice: ging fort
  rationale: Das Verb bezeichnet im Erzählzusammenhang sein Fortgehen oder seinen Aufbruch; „ging fort“ ist klar und gegenwärtiges Standarddeutsch.
