base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/005.yaml
  text: You made known your power against the bold Pharaoh, when he had enslaved your holy people Israel, testing him with varied and many punishments; by these you made known your great might.
translation:
  language: de
  text: Du hast deine Kraft erkennen lassen, indem du den dreisten Pharao, der dein heiliges Volk Israel versklavt hatte, mit vielfältigen und zahlreichen Strafen prüftest[a]; durch sie hast du deine große Macht erkennen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bedeutet „prüfen“ oder „erproben“. Der Pharao ist als Objekt des Verbs zu verstehen; die vielfältigen und zahlreichen Strafen bezeichnen das Mittel dieser Prüfung.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρασὺν
  choice: dreisten
  rationale: Das Adjektiv bezeichnet hier eine kühne, anmaßende oder unverschämte Haltung. „Dreist“ gibt den im Zusammenhang negativen Sinn natürlich wieder, ohne ihn unnötig zu verstärken.
- source_word: καταδουλωσάμενον
  choice: der … versklavt hatte
  rationale: Das Partizip bezeichnet die der göttlichen Strafhandlung vorausgehende Versklavung Israels durch den Pharao.
- source_word: λαόν σου τὸν ἅγιον Ἰσραήλ
  choice: dein heiliges Volk Israel
  rationale: Bewahrt sowohl λαός als auch ἅγιος; „Israel“ steht wie im Griechischen als nähere Bestimmung des Volkes.
- source_word: ποικίλαις καὶ πολλαῖς
  choice: vielfältige und zahlreiche
  rationale: 'Beide Adjektive bleiben erhalten: ποικίλαις hebt die Verschiedenartigkeit, πολλαῖς die große Zahl hervor.'
- source_word: δοκιμάσας
  choice: indem du ihn … auf die Probe stelltest
  rationale: Die Wiedergabe bewahrt den Sinn des Prüfens oder Erprobens, statt das Wort mit der daneben ausdrücklich genannten Bestrafung gleichzusetzen. Das im Griechischen nicht eigens wiederholte Objekt ist aus dem Satzbau als Pharao zu erschließen.
- source_word: τιμωρίαις
  choice: durch … Strafen
  rationale: τιμωρία bezeichnet hier die göttlichen Strafmaßnahmen gegen den Pharao; „Strafen“ ist klar und entspricht dem Exoduszusammenhang.
- source_word: ἐγνώρισας
  choice: bekannt gemacht
  rationale: Die kausative Bedeutung und die auffällige Wiederholung des Verbs in beiden Satzteilen werden bewahrt.
- source_word: δύναμιν
  choice: Kraft
  rationale: „Kraft“ bezeichnet hier Gottes wirksame Fähigkeit und ermöglicht zugleich eine sprachliche Unterscheidung vom folgenden κράτος.
- source_word: κράτος
  choice: Macht
  rationale: κράτος bezeichnet machtvolle Stärke oder Herrschaftsgewalt. „Macht“ ist im Deutschen natürlich und hält die rhetorische Unterscheidung zu δύναμις aufrecht.
- source_word: ἐφʼ αἷς
  choice: durch diese
  rationale: Das feminine Pluralpronomen verweist am natürlichsten auf die zuvor genannten Strafen und bezeichnet sie als Mittel der Offenbarung göttlicher Macht.
theological_decisions:
- issue: Bezug und Bedeutung der beiden Formen von ἐγνώρισας
  choice: Beide Aussagen sind an Gott gerichtet und besagen, dass er durch sein Strafhandeln seine Kraft beziehungsweise Macht öffentlich bekannt machte.
  alternative: Das Verb an einer Stelle schwächer als „zeigen“ oder nicht kausativ als „erkennen“ wiederzugeben.
  rationale: Der Gebetszusammenhang erinnert an Gottes öffentliches Machterweisen beim Exodus. Die gleiche Wiedergabe beider Verbformen bewahrt die rhetorische Wiederholung.
- issue: Negative Färbung von θρασὺν
  choice: „dreisten Pharao“
  alternative: „kühnen“, „vermessenen“ oder „anmaßenden Pharao“
  rationale: Der Zusammenhang verlangt eine negative Wertung, doch die Übersetzung vermeidet eine weitergehende psychologische oder dogmatische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die partizipial geprägte griechische Satzstruktur wurde maßvoll gegliedert, während die Abfolge von Versklavung, Prüfung durch Strafen und Offenbarung göttlicher Macht sowie die Wiederholung von ἐγνώρισας erhalten bleiben.
