  to: Du hast deine Kraft erkennen lassen, indem du den dreisten Pharao, der dein heiliges Volk Israel versklavt hatte, mit vielfältigen und zahlreichen Strafen prüftest[a]; durch sie hast du deine große Macht erkennen lassen.
  rationale: Die Revision ersetzt ausschließlich die im Deutschen unnatürliche Konstruktion „an dem ... bekannt gemacht“ durch „erkennen lassen“. Dadurch bleibt die zweimalige kausative Aussage von ἐγνώρισας erhalten und der griechische Satzbau wird klarer abgebildet. Die Fußnoten wurden auf die für das Verständnis relevante lexikalisch-syntaktische Erläuterung beschränkt; die alternative Bedeutung von θρασύς ist im Fließtext durch „dreist“ ausreichend abgedeckt und benötigt keinen eigenen Anker.
