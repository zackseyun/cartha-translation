base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/025.yaml
  text: We have ordered that[a], as soon as this letter arrives, those enrolled, together with their wives and children, be sent to us at once in iron bonds, shut in on every side, with abuse and plundering[c][b], for an incurable and disgraceful pit fit for enemies.
translation:
  language: de
  text: 'Wir haben angeordnet: Sobald dieses Schreiben eintrifft, sollen die in den Listen Erfassten[a] samt ihren Frauen und Kindern unverzüglich unter Misshandlungen und Ausplünderung[b] zu uns gebracht werden, in eisernen Fesseln und von allen Seiten eingeschlossen, in eine ausweglose und schändliche Grube[c], wie sie Feinden angemessen ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »die Registrierten« oder »die namentlich Eingetragenen«; das griechische Partizip bezeichnet Personen, die amtlich in einem Register erfasst sind.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung verbindet entehrende Misshandlung (ὕβρις) mit Beraubung beziehungsweise Ausplünderung (σκυλμοί).
    reason: lexical_alternative
  - marker: c
    text: »Grube« kann eine wirkliche Grube bezeichnen oder als drastisches Bild für einen Ort des Verderbens und der Schande dienen.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: Wir haben angeordnet
  rationale: Das Perfekt bezeichnet einen ergangenen Befehl, der weiterhin gilt; die Formulierung entspricht dem amtlichen Ton des Erlasses.
- source_word: ἅμα τῷ προσπεσεῖν τὴν ἐπιστολὴν τήνδε
  choice: Sobald dieses Schreiben eintrifft
  rationale: ἅμα τῷ mit Infinitiv drückt unmittelbare zeitliche Folge aus; προσπίπτω bezeichnet hier das Eintreffen beziehungsweise die Zustellung des Schreibens.
- source_word: αἰθωρεὶ
  choice: unverzüglich
  rationale: Das Adverb fordert unmittelbares Handeln und passt zum würdigen Verwaltungston.
- source_word: τοὺς ἐννεμομένους
  choice: die in den Listen Erfassten
  rationale: Das Partizip bezeichnet amtlich in ein Register oder Verzeichnis eingetragene Personen. Die Wiedergabe vermeidet eine unbelegte Präzisierung des Verfahrens.
- source_word: σὺν ταῖς γυναιξὶ καὶ τέκνοις
  choice: samt ihren Frauen und Kindern
  rationale: Im Kontext bezeichnet γυναιξί die zu den erfassten Personen gehörenden Ehefrauen; 'Frauen' ist im Deutschen natürlich und wahrt die kontextuelle Beziehung.
- source_word: μετὰ ὕβρεως καὶ σκυλμῶν
  choice: unter Beschimpfungen und Ausplünderungen
  rationale: ὕβρις bezeichnet entehrende, überhebliche Misshandlung; σκυλμοί weist auf Beraubung beziehungsweise Ausplünderung. Beide Aspekte bleiben unterscheidbar.
- source_word: ἀποστεῖλαι πρὸς ἡμᾶς
  choice: zu uns gebracht werden
  rationale: Der vom Befehl abhängige Infinitiv verlangt die Überstellung zum Herrscher; die passive deutsche Konstruktion ist in einem Erlass natürlich.
- source_word: ἐν δεσμοῖς σιδηροῖς
  choice: in eiserne Fesseln gelegt
  rationale: δεσμοί bezeichnet eiserne Zwangsmittel, ohne auf eine bestimmte Form wie Ketten oder Fußfesseln festgelegt zu sein.
- source_word: πάντοθεν κατακεκλεισμένους
  choice: von allen Seiten eingeschlossen
  rationale: Das Perfektpartizip beschreibt den vollständigen und fortdauernden Zustand der Einschließung.
- source_word: εἰς ἀνήκεστον καὶ δυσκλεῆ πρέποντα δυσμενέσιν βόθρον
  choice: für eine unheilvolle und schändliche Grube, wie sie Feinden gebührt
  rationale: βόθρος bleibt als 'Grube' bildlich oder wörtlich offen. ἀνήκεστος trägt den Sinn von nicht heilbar oder nicht wiedergutzumachen; 'unheilvoll' bewahrt im Deutschen den Anklang an Heilung, ohne die Grube selbst unnatürlich als 'unheilbar' zu bezeichnen. δυσκλεής bezeichnet Schande beziehungsweise üblen Ruf.
