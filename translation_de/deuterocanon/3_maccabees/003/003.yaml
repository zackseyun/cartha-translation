  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Griechischen zutreffend wieder: δέ als Kontrast („aber“), Ἰουδαῖοι als „die Juden“, εὔνοια und πίστις im politischen Verhältnis als „Wohlwollen und Treue“, die Beständigkeit durch „unverbrüchlich“, φυλάσσω als „bewahrten“ und den Plural τοὺς βασιλεῖς als „den Königen“. Die deutsche Wiederholung des Adjektivs macht verständlich, dass die Unverbrüchlichkeit beide koordinierten Begriffe kennzeichnet.'
  naturalness: „Die Juden aber bewahrten gegenüber den Königen unverbrüchliches Wohlwollen und unverbrüchliche Treue“ ist natürliches, würdiges modernes Standarddeutsch. Die Stellung von „aber“ und die Wahl von „gegenüber den Königen“ sind idiomatisch. Das Semikolon ist als Anschluss an den folgenden Satzteil angemessen.
  terminology: „Treue“ ist für πίστις in diesem nichtreligiösen, politischen Kontext treffend und vermeidet eine unangemessene Wiedergabe als „Glaube“. „Wohlwollen“ für εὔνοια und „unverbrüchlich“ für ἀδιάστροφος sind semantisch angemessen und im Register stimmig. Namen und theologische Schlüsselbegriffe sind nicht problematisch betroffen.
