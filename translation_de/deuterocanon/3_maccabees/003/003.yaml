  text: Die Juden aber bewahrten gegenüber den Königen unverbrüchliches Wohlwollen und unverbrüchliche Treue;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Die Juden aber
  rationale: δέ setzt die Juden in einen Kontrast zum vorausgehenden Zusammenhang; die Nachstellung von „aber“ ist im Deutschen natürlich und bewahrt diesen Gegensatz.
- source_word: εὔνοιαν
  choice: Wohlwollen
  rationale: εὔνοια bezeichnet eine wohlwollende, freundliche Haltung. „Wohlwollen“ gibt den Beziehungssinn gegenüber den Herrschern wieder, ohne ihn als förmliche politische Gefolgschaft zu überzeichnen.
- source_word: πίστιν
  choice: Treue
  rationale: Im politischen Zusammenhang bezeichnet πίστις nicht religiösen Glauben, sondern Verlässlichkeit und loyale Beständigkeit gegenüber den Königen. „Treue“ ist würdig, verständlich und lässt den weiteren Bedeutungsraum des Wortes eher erkennen als das engere „Loyalität“.
- source_word: ἀδιάστροφον
  choice: unverbrüchliches … und unverbrüchliche
  rationale: Das Adjektiv kennzeichnet die genannte Haltung als nicht abgewandt, verdreht oder verändert. „Unverbrüchlich“ bringt ihre beständige, unerschütterte Qualität zum Ausdruck. Im Deutschen wird es zur eindeutigen Zuordnung bei beiden Substantiven wiederholt.
- source_word: φυλάσσοντες
  choice: bewahrten
  rationale: φυλάσσω bedeutet grundsätzlich „bewahren, hüten“. Bei abstrakten Objekten bezeichnet es das fortgesetzte Festhalten an Wohlwollen und Treue; „bewahrten“ bleibt bildhaft nah am Griechischen und klingt natürlich.
- source_word: πρὸς τοὺς βασιλεῖς
  choice: gegenüber den Königen
  rationale: πρός mit Akkusativ bezeichnet hier die relationale Ausrichtung auf Personen. „Gegenüber“ ist dafür idiomatisches Deutsch; der ausdrücklich gesetzte Plural „Könige“ bleibt erhalten.
theological_decisions:
- issue: Wiedergabe von πίστις in einem politisch-sozialen Zusammenhang
  choice: Treue
  alternative: Glaube; Loyalität; Verlässlichkeit
  rationale: Da sich πίστις auf das Verhältnis zu den Königen bezieht, ist hier nicht religiöser Glaube gemeint. „Treue“ wahrt den Gedanken beständiger Verlässlichkeit und vermeidet zugleich eine konfessionelle Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Die Juden aber“ markiert den griechischen Kontrast. Das Semikolon wurde beibehalten, weil der überlieferte Ausschnitt syntaktisch und gedanklich in den folgenden Verszusammenhang weiterführt.
