base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/026.yaml
  text: For if these men are punished all together[a], we will leave for the time that remains with complete confidence that our affairs will be established in stability and in the best condition.
translation:
  language: de
  text: Denn wenn diese alle gemeinsam bestraft worden sind, werden wir unsere Angelegenheiten für die verbleibende Zeit in voller Zuversicht in stabiler und bestmöglicher Verfassung zurücklassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und mit stark verdichteter Satzfügung etwa: „werden wir … unsere Angelegenheiten für die verbleibende Zeit völlig [gewiss] in Stabilität und in bester Verfassung eingerichtet werden lassen“. Die Verbindung von λείψαμεν mit dem zukünftigen Passivinfinitiv κατασταθήσεσθαι ist ungewöhnlich. Gemeint ist, dass die staatlichen Verhältnisse nach der gemeinsamen Bestrafung dieser Menschen künftig stabil und bestmöglich geordnet sein sollen.'
    reason: Die Fußnote erläutert die ungewöhnliche griechische Konstruktion sowie die nicht völlig eindeutige Bezugnahme von τελείως, ohne eine einzelne Deutung als zwingend auszugeben.
lexical_decisions:
- source_word: τούτων
  choice: diese
  rationale: Das substantivisch gebrauchte Demonstrativpronomen bezeichnet im Zusammenhang die zuvor genannte jüdische Bevölkerungsgruppe; das Deutsche kann den Personenbezug ohne ergänzendes Substantiv natürlich ausdrücken.
- source_word: ὁμοῦ
  choice: alle gemeinsam
  rationale: Die Wiedergabe bringt sowohl den kollektiven Vollzug als auch die umfassende Behandlung der bezeichneten Gruppe zum Ausdruck.
- source_word: κολαθέντων
  choice: bestraft worden sind
  rationale: Das Verb bezeichnet hier im Rahmen einer königlichen Zwangsmaßnahme eine Bestrafung; die temporale Konstruktion gibt den vorzeitigen Genitivus absolutus wieder.
- source_word: λείψαμεν
  choice: werden wir … zurücklassen
  rationale: Die Wiedergabe bewahrt die erste Person Plural und den Gedanken, dass die staatlichen Angelegenheiten infolge der Maßnahme künftig in einem bestimmten Zustand verbleiben sollen. Die griechische Konstruktion mit dem folgenden Infinitiv ist stark verdichtet.
- source_word: εἰς τὸν ἐπίλοιπον χρόνον
  choice: für die verbleibende Zeit
  rationale: Die Formulierung erhält den ausdrücklichen zeitlichen Bezug auf den noch bevorstehenden Zeitraum.
- source_word: τελείως
  choice: vollkommen
  rationale: Das Adverb wird unmittelbar als Verstärkung des erreichten Zustands wiedergegeben, ohne den im Griechischen nicht ausdrücklich genannten Begriff der Zuversicht einzuführen.
- source_word: τὰ πράγματα
  choice: unsere Angelegenheiten
  rationale: Der Ausdruck bezeichnet im königlichen Kontext die staatlichen Verhältnisse beziehungsweise Regierungsgeschäfte; „Angelegenheiten“ wahrt seine Breite.
- source_word: ἐν εὐσταθείᾳ
  choice: gefestigt
  rationale: Die prädikative Wiedergabe drückt den Zustand von Stabilität und Sicherheit in idiomatischem Deutsch aus.
- source_word: τῇ βελτίστῃ διαθέσει
  choice: in den bestmöglichen Zustand
  rationale: διάθεσις bezeichnet hier die Beschaffenheit oder Ordnung der Verhältnisse, nicht eine innere Gesinnung. „Bestmöglich“ gibt den Superlativ kontextgerecht wieder.
- source_word: κατασταθήσεσθαι
  choice: versetzt
  rationale: Das Partizip innerhalb der deutschen Konstruktion bildet den zukünftigen passiven Gedanken ab, dass die Angelegenheiten in einen geordneten Zustand gebracht werden.
