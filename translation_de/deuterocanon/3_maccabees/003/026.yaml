  rationale: Die Revision ordnet „vollkommen“ nicht mehr einseitig der Stabilität zu, sondern gibt die erwartete Gewissheit mit „in voller Zuversicht“ wieder. Zugleich ersetzt sie die im Deutschen spannungsvolle Verbindung „gefestigt und ... versetzt“ durch eine natürliche Zustandsbeschreibung. Der kollektive Strafcharakter, die erste Person Plural, der Zukunftsbezug und die Verwaltungsmetaphorik bleiben erhalten.
