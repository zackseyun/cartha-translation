  register: Modernes, würdiges Standarddeutsch. Die im Deutschen nötige idiomatische Variation „geht es gut / stehen gut“ gibt die einmalige griechische Verbform sinngemäß für beide Satzglieder wieder; die Fußnote macht diese Struktur und die mögliche Lesart von καί transparent.
