translation:
  language: de
  text: Auch mir selbst geht es gut[a], und auch um unsere Angelegenheiten steht es gut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mir selbst geht es gut, und ebenso steht es um unsere Angelegenheiten gut.“ Das Griechische verwendet ein einziges, idiomatisches Verb des Wohlergehens sowohl für den Sprecher als auch für seine Angelegenheiten; das erste „auch“ kann auch als bloße Verstärkung der Selbstbezeichnung verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρρωμαι
  choice: geht es gut / stehen gut
  rationale: Das Perfekt von ῥώννυμι bezeichnet hier idiomatisch Wohlergehen. Bei der Person klingt „mir geht es gut“ natürlich; bei τὰ πράγματα gibt „stehen gut“ dieselbe Aussage passend wieder.
- source_word: δὲ
  choice: und
  rationale: δέ ist hier ein schwaches, fortführendes Bindewort und bezeichnet keinen ausgeprägten Gegensatz.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: mir selbst
  rationale: Die Formulierung bewahrt die betonte Selbstbezeichnung; καί wird zusammen mit dem zweiten καί als Zuordnung von Sprecher und Angelegenheiten verstanden.
- source_word: τὰ πράγματα ἡμῶν
  choice: unsere Angelegenheiten
  rationale: πράγματα bezeichnet hier umfassend die eigenen Belange, Verhältnisse oder Geschäfte; „Angelegenheiten“ bleibt bewusst breit.
