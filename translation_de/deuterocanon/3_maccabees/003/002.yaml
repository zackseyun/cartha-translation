  to: Während dies geregelt wurde, verbreitete man unter Menschen, die darin übereinstimmten, Schaden anzurichten, ein feindseliges Gerücht gegen das Volk. Damit wurde ihrer Gesinnung ein Anlass gegeben,[a] als ob das Volk daran gehindert würde, seine gesetzlichen Bräuche zu befolgen.[b]
