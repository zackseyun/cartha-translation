  yaml_path: translation/deuterocanon/3_maccabees/003/002.yaml
  text: While these matters were being arranged[a], a hostile rumor was spread against the nation among people of like mind for mistreatment, a pretext being given for their purpose[c][b], as though they were being hindered from their customary laws.
translation:
  language: de
  text: Während dies geregelt wurde, verbreitete man unter Menschen, die darin übereinstimmten, Schaden anzurichten, ein feindseliges Gerücht gegen das Volk. Damit wurde ihrer Gesinnung ein Anlass gegeben,[a] als ob das Volk daran gehindert würde, seine gesetzlichen Bräuche zu befolgen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Anlass“ kann hier auch „Vorwand“ oder „Gelegenheit“ bedeuten; „Gesinnung“ kann auch als „Haltung“, „Ausrichtung“ oder „Absicht“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als ob es von seinen Gesetzen [oder: Bräuchen, Ordnungen] abgehalten würde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονομουμένων
  choice: geregelt wurde
  rationale: Das Partizip bezeichnet das Ordnen oder Verwalten der zuvor genannten Angelegenheiten; die unpersönliche Form bewahrt den offenen Bezug und klingt im Deutschen natürlich.
- source_word: φήμη δυσμενὴς ἐξέκειτο
  choice: verbreitete sich ... ein feindseliges Gerücht
  rationale: φήμη kann Gerücht oder Bericht bedeuten; zusammen mit δυσμενής und ἐξέκειτο bezeichnet es hier eine öffentlich umlaufende, von Feindseligkeit geprägte Nachricht.
- source_word: κατὰ τοῦ γένους
  choice: gegen das Volk
  rationale: γένος meint hier das jüdische Volk als Abstammungs- und Volksgemeinschaft. „Volk“ vermeidet die modernen biologischen Nebenbedeutungen von „Rasse“.
- source_word: ἀνθρώποις συμφρονοῦσιν εἰς κακοποίησιν
  choice: unter Menschen, die in der Absicht, Schaden anzurichten, eines Sinnes waren
  rationale: Die Formulierung gibt sowohl die gemeinsame Gesinnung als auch deren Ausrichtung auf schädigendes Handeln wieder, ohne den Schaden auf körperliche Gewalt zu verengen.
- source_word: ἀφόρμης ... διδομένης εἰς διάθεσιν
  choice: Damit wurde ihnen ein Anlass für ihr Vorhaben gegeben
  rationale: ἀφορμή bezeichnet einen Anlass, Ausgangspunkt oder auch Vorwand; διάθεσις eine Ausrichtung, Absicht oder ein Vorhaben. Die gewählte Fassung ist idiomatisch, lässt aber die genaue Nuance von ἀφορμή in der Fußnote offen.
- source_word: ἀπὸ τῶν νομίμων αὐτοὺς κωλύωνται
  choice: als würden sie daran gehindert, nach ihren überlieferten Ordnungen zu leben
  rationale: τὰ νόμιμα umfasst geltende Bräuche, Satzungen und hergebrachte Lebensordnungen. Die verbale Fassung macht im Deutschen verständlich, woran die behauptete Behinderung bestand.
theological_decisions:
- issue: Bezeichnung der jüdischen Gemeinschaft durch γένος
  choice: das Volk
  alternative: das Geschlecht; die Volksgemeinschaft
  rationale: „Volk“ bezeichnet die kollektive Identität angemessen und vermeidet eine moderne rassentheoretische Lesart.
- issue: Wert und Funktion von ἀφορμή im Zusammenhang feindseliger Agitation
  choice: ein Anlass
  alternative: ein Vorwand; eine Gelegenheit
  rationale: Der Zusammenhang lässt einen vorgeschobenen Grund vermuten, doch ἀφορμή legt diese stärker wertende Deutung nicht zwingend fest. Deshalb steht die breitere Bedeutung im Text, während die Alternativen dokumentiert werden.
- issue: Bedeutungsumfang von τὰ νόμιμα
  choice: überlieferte Ordnungen
  alternative: hergebrachte Gesetze; gesetzmäßige Bräuche
  rationale: Der Ausdruck kann sowohl rechtliche Vorschriften als auch überkommene religiöse und gesellschaftliche Bräuche bezeichnen. „Ordnungen“ erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Periode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die feindselige Zweckrichtung bleibt deutlich, während die lexikalische Offenheit von ἀφορμή, διάθεσις und νόμιμα durch Fußnoten erhalten wird.
