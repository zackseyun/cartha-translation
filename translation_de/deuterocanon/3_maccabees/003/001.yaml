base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/001.yaml
  text: And when the impious man had taken this in[a], he became so enraged that he was angry not only with those in Alexandria, but also opposed those in the countryside more harshly; and after ordering that they quickly gather all together in one place[c][b], he intended to remove them from life by the cruelest fate.
translation:
  language: de
  text: Als der Gottlose dies erfahren hatte[a], geriet er so sehr in Wut, dass er nicht nur auf die Menschen in Alexandria zornig war, sondern noch härter gegen die Menschen im Umland[b] vorging. Er befahl, alle unverzüglich an einem Ort zu versammeln und sie auf die grausamste Weise ums Leben zu bringen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dies aufgenommen hatte“ beziehungsweise „diese Nachricht erhalten hatte“. Das griechische Wort kann allgemein das Aufnehmen oder Empfangen bezeichnen, hier wahrscheinlich das Erfahren einer Nachricht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Menschen in der χώρα“. Im Gegensatz zu Alexandria sind wahrscheinlich die umliegenden ländlichen Gebiete gemeint.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich etwa: „sie vom Leben wegzubringen“; gemeint ist, sie zu töten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβὼν
  choice: dies erfahren hatte
  rationale: Im Zusammenhang bezeichnet das Partizip wahrscheinlich die Aufnahme einer Nachricht. „Erfahren hatte“ ist natürliches Deutsch, ohne ausdrücklich festzulegen, auf welchem Weg er davon Kenntnis erhielt.
- source_word: δυσσεβὴς
  choice: der Gottlose
  rationale: Bewahrt die religiös wertende Bedeutung von δυσσεβής und klingt in würdigem biblischem Deutsch zugleich verständlich.
- source_word: ἐξεχόλησεν
  choice: geriet er so sehr in Wut
  rationale: Gibt die starke Steigerung der Erbitterung wieder und verbindet sich natürlich mit dem folgenden ὥστε-Satz.
- source_word: τοῖς κατὰ Ἀλεξάνδρειαν
  choice: die Menschen in Alexandria
  rationale: Bezeichnet die dort ansässige betroffene Gruppe, ohne eine im Griechischen nicht ausdrücklich genannte Identifikation einzufügen.
- source_word: τοῖς ἐν τῇ χώρᾳ
  choice: die Menschen im Umland
  rationale: Im Gegensatz zu Alexandria meint χώρα hier wahrscheinlich die ländlichen Gebiete außerhalb der Stadt. „Umland“ bildet diesen räumlichen Kontrast klar ab.
- source_word: βαρυτέρως ἐναντιοῦσθαι
  choice: noch härter gegen ... vorging
  rationale: Bewahrt den Komparativ und drückt eine verschärfte feindselige Haltung beziehungsweise Behandlung aus, ohne zwingend körperliche Gewalt zu behaupten.
- source_word: προστάξας σπεύδοντας συναγαγεῖν πάντας ἐπὶ τὸ αὐτό
  choice: Er befahl, sie alle unverzüglich an einem Ort zusammenzutreiben
  rationale: Gibt die gedrängte Syntax als dringlichen Sammelbefehl wieder. „Zusammentreiben“ entspricht dem gewaltsamen Kontext besser als das neutrale „versammeln“, ohne bestimmte Vollstrecker zu ergänzen.
- source_word: χειρίστῳ μόρῳ
  choice: durch den grausamsten Tod
  rationale: μόρος bezeichnet hier im Kontext ihrer Tötung das tödliche Geschick. Die Formulierung hält die superlative Härte fest und ist im Deutschen unmittelbar verständlich.
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: aus dem Leben zu reißen
  rationale: Bewahrt etwas von der umschreibenden Ausdrucksweise „vom Leben wegbringen“, während die tödliche Absicht eindeutig bleibt.
