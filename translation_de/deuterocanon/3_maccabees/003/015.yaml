base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/015.yaml
  text: We considered that the nations inhabiting Coele-Syria and Phoenicia should be nurtured not by the force of the spear[a], but with gentleness and great kindness[b], having gladly done them good.
translation:
  language: de
  text: Wir hielten es für richtig, die Völker, die Koilesyrien und Phönizien bewohnen, nicht mit der Gewalt des Speeres[a], sondern mit Milde und großer Menschenfreundlichkeit aufzuziehen[b] und ihnen gern Gutes zu erweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild von der Gewalt des Speeres bezeichnet militärischen Zwang.
    reason: cultural_note
  - marker: b
    text: Das griechische Verb bezeichnet das Nähren oder Aufziehen, wie bei einem Kind, und verwendet damit ein paternalistisches Bild für den Umgang mit unterworfenen Völkern.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγησάμεθα
  choice: Wir hielten es für richtig
  rationale: Die Wendung gibt die überlegte Einschätzung beziehungsweise politische Entscheidung des Aorists von ἡγέομαι in natürlichem, würdigem Deutsch wieder.
- source_word: μὴ βίᾳ δόρατος
  choice: nicht mit der Gewalt des Speeres
  rationale: Die konkrete militärische Metapher des Griechischen bleibt erhalten; eine Wiedergabe wie »nicht mit Waffengewalt« wäre glatter, aber weniger bildhaft.
- source_word: ἐπιεικείᾳ
  choice: mit Milde
  rationale: »Milde« bezeichnet hier nachsichtiges, nicht gewaltsames Handeln und passt zum königlichen Zusammenhang.
- source_word: πολλῇ φιλανθρωπίᾳ
  choice: mit großer Menschenfreundlichkeit
  rationale: Die Wiedergabe bewahrt sowohl den Gedanken wohlwollender Güte als auch den im griechischen Wort erkennbaren Bezug auf den Menschen.
- source_word: τιθηνήσασθαι
  choice: aufzuziehen
  rationale: Das Verb bezeichnet das Nähren beziehungsweise Aufziehen eines Kindes. Die bewusst paternalistische Metapher für den Umgang mit unterworfenen Völkern wird nicht zu einem neutralen »regieren« verflacht.
- source_word: τὰ κατοικοῦντα ... ἔθνη
  choice: die Völker, die ... bewohnen
  rationale: ἔθνη wird kontextgerecht mit »Völker« wiedergegeben, κατοικοῦντα als aktives »bewohnen«.
- source_word: Κοίλην Συρίαν
  choice: Koilesyrien
  rationale: Der etablierte hellenistische geografische Name wird transliteriert und nicht wörtlich als »Hohlsyrien« übersetzt.
- source_word: εὖ ποιήσαντες ἀσμένως
  choice: nachdem wir ihnen bereitwillig Gutes getan hatten
  rationale: Die Formulierung wahrt den benefaktiven Sinn von εὖ ποιέω und gibt ἀσμένως als positive Bereitschaft wieder. »Nachdem« bildet die mögliche Vorzeitigkeit des Aoristpartizips ab.
theological_decisions:
- issue: Paternalistische Herrschaftsmetapher in τιθηνήσασθαι
  choice: Die Metapher wird mit »aufzuziehen« beibehalten.
  alternative: »zu regieren«, »zu verwalten« oder »zu behandeln«
  rationale: Der griechische Text beschreibt den Umgang mit den Völkern im Bild des Nährens beziehungsweise Aufziehens. Eine neutrale Verwaltungsformulierung würde diese rhetorische Spannung verdecken.
- issue: Bezug und Zeitwert von εὖ ποιήσαντες ἀσμένως
  choice: Das Partizip wird auf das handelnde »wir« bezogen und vorzeitig mit »nachdem ... getan hatten« wiedergegeben.
  alternative: 'Gleichzeitig: »wobei wir ihnen bereitwillig Gutes taten«'
  rationale: Das Aoristpartizip legt Vorzeitigkeit nahe, doch der Zusammenhang erlaubt auch eine begleitende beziehungsweise zusammenfassende Nuance; diese bleibt in der Fußnote transparent.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die königliche Wir-Rede und die ungewöhnliche, bewusst paternalistische Bildsprache bleiben sichtbar. Hinweis: Die inhaltlich einschlägigen Fußnoten [a] und [b] stehen unmittelbar an den jeweiligen Ausdrücken; die zusätzliche Ambiguitätsnote [c] müsste bei Aufnahme in den Haupttext nach »getan hatten« markiert werden.'
