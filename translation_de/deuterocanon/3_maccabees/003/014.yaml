  yaml_path: translation/deuterocanon/3_maccabees/003/014.yaml
  text: concerning our campaign into Asia[a], which you yourselves also know, which by the unfailing alliance of the gods was brought, as was fitting, to its conclusion[b],
translation:
  language: de
  text: Unser Feldzug nach Asien, den auch ihr selbst kennt, wurde durch die unerschütterliche[a] Hilfe der Götter, wie es sich gehörte[b], zu Ende geführt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „durch das unerschütterliche Bündnis der Götter“ oder „durch den unerschütterlichen Beistand der Götter“. Das griechische Adjektiv bedeutet wörtlich „nicht schwach“ und kann „fest“, „unerschütterlich“ oder „nicht versagend“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Oder „vernünftigerweise“, „wie es angemessen war“ oder „wie erwartet“.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐπιστρατείας
  choice: Feldzug
  rationale: Das Substantiv bezeichnet einen militärischen Zug oder eine militärische Unternehmung. „Feldzug“ ist prägnant und bewahrt den militärischen Sinn.
- source_word: εἰς τὴν Ἀσίαν
  choice: nach Asien
  rationale: εἰς bezeichnet hier die Bewegung in Richtung eines Gebiets. Im Deutschen ist bei geografischen Namen „nach Asien“ die natürliche Entsprechung.
- source_word: γενομένης ἡμῖν
  choice: unser
  rationale: Die Verbindung bezeichnet idiomatisch den von der sprechenden Partei unternommenen Feldzug. Das Possessivpronomen gibt dies knapp und natürlich wieder.
- source_word: ἧς ἴστε καὶ αὐτοί
  choice: den ihr ja auch selbst kennt
  rationale: „selbst“ bewahrt die Betonung durch αὐτοί; „ja auch“ gibt den appellativen Hinweis auf das eigene Wissen der Adressaten natürlich wieder.
- source_word: ἀρρωστῷ
  choice: unerschütterliche
  rationale: Das Adjektiv bedeutet wörtlich „nicht schwach/kränklich“ und beschreibt hier eine feste, nicht versagende Hilfe. „Unerschütterlich“ bewahrt diese Stärke, ohne zwingend absolute Unbesiegbarkeit auszudrücken.
- source_word: συμμαχίᾳ
  choice: Hilfe
  rationale: συμμαχία kann eine Bundesgenossenschaft oder militärische Unterstützung bezeichnen. „Hilfe“ ist im modernen Deutsch natürlich und passt zur instrumentalen Wendung, während die militärische Färbung aus dem Zusammenhang hervorgeht.
- source_word: τῶν θεῶν
  choice: der Götter
  rationale: Der griechische Text verwendet ausdrücklich den Plural und gibt die religiöse Perspektive der königlichen Rede wieder.
- source_word: κατὰ λόγον
  choice: wie erwartet
  rationale: Die Wendung kann „der Vernunft, Erwartung oder Angemessenheit entsprechend“ bedeuten. „Wie erwartet“ ist hier idiomatisch, lässt aber die alternative Nuance „wie es angemessen war“ in der Fußnote erkennen.
- source_word: ἐπὶ τέλος ἀχθείσης
  choice: zu Ende geführt
  rationale: Die Partizipialwendung bezeichnet das passive Zu-Ende-Bringen oder Vollenden. Die Übersetzung bewahrt sowohl den passiven Sinn als auch die Fortführung des Satzes.
theological_decisions:
- issue: Bezug auf heidnische Gottheiten in königlicher Rede
  choice: der Götter
  alternative: Gottes; durch göttliche Hilfe
  rationale: τῶν θεῶν steht ausdrücklich im Plural. Die Übersetzung bewahrt die historische und religiöse Stimme des Sprechers, statt sie monotheistisch anzugleichen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satz bleibt als Nebensatzgefüge mit abschließendem Komma offen, weil der griechische Vers in den folgenden Kontext weiterführt. Die heidnisch-königliche Ausdrucksweise wird weder abgeschwächt noch monotheistisch umgedeutet.
