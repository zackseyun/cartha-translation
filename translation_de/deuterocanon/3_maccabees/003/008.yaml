    rationale: »Hilferuf« legt ein Ersuchen um Hilfe für die Griechen selbst nahe. παράκλησις kann hier Bitte, Appell, Zuspruch oder Ermutigung bezeichnen; eine weniger spezifizierende Wiedergabe ist quellentreuer.
