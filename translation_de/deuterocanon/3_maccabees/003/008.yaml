base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/008.yaml
  text: But the Greeks in the city[a], having suffered no wrong, seeing the unexpected turmoil concerning the men and the disorderly gatherings that were taking place, were not strong enough to help; for their disposition urged an appeal[b], and some also were in an agitated state and supposed that these things would change.
translation:
  language: de
  text: Die Griechen aber, die in der Stadt lebten und denen kein Unrecht geschehen war, sahen die unerwartete Unruhe um die Männer und die ungeordneten Menschenansammlungen, die sich bildeten. Sie hatten nicht die Kraft zu helfen; denn ihre innere Haltung drängte sie zu einer Bitte[a]. Auch sie waren in Aufruhr[b] und meinten, die Lage werde sich ändern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn ihre Haltung drängte sie zu einem Appell / zu ermutigendem Zuspruch«. Der griechische Satz ist stark verkürzt; die genaue Nuance von »Bitte, Appell, Zuspruch, Ermutigung« bleibt unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Auch sie wurden von dem Auflauf mitgerissen«. Das seltene griechische Wort kann sowohl innere Erregung als auch ein Mitgerissenwerden durch die Menschenmenge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κατὰ τὴν πόλιν Ἕλληνες
  choice: Die Griechen aber, die in der Stadt lebten
  rationale: Gibt die örtliche Bedeutung von κατὰ τὴν πόλιν natürlich wieder; δέ markiert einen leichten Gegensatz.
- source_word: οὐδὲν ἠδικημένοι
  choice: denen kein Unrecht geschehen war
  rationale: Bewahrt den passiven Sinn des Partizips und macht deutlich, dass sie selbst nicht misshandelt worden waren.
- source_word: ταραχὴν ἀπροσδόκητον περὶ τοὺς ἄνδρας
  choice: die unerwartete Unruhe um die Männer
  rationale: „Um“ wahrt die weite Bezugsaussage von περί, ohne Ursache oder räumliche Nähe festzulegen.
- source_word: συνδρομὰς ἀπροκόπους γινομένας
  choice: die ungeordneten Menschenansammlungen, die sich bildeten
  rationale: συνδρομή bezeichnet ein Zusammenlaufen bzw. eine Ansammlung; ἀπρόκοπος deutet hier auf einen ungeordneten oder nicht zielführenden Verlauf.
- source_word: βοηθεῖν μὲν οὐκ ἔσθενον
  choice: Sie hatten nicht die Kraft zu helfen
  rationale: Erhält den Kraft- bzw. Vermögensaspekt von σθένω und bezeichnet Unvermögen, nicht fehlenden Willen.
- source_word: παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν
  choice: denn ihre innere Haltung drängte sie zu einem Hilferuf
  rationale: Der griechische Ausdruck ist syntaktisch gedrängt. Die Wiedergabe verbindet διάθεσις mit der inneren Haltung und παράκλησις mit einem dringenden Appell, ohne die Schwierigkeit zu verschweigen.
- source_word: οἱ δὲ καὶ συνδρόμως εἶχον
  choice: Einige waren zudem selbst von der Unruhe erfasst
  rationale: Das seltene συνδρόμως kann einen Zustand der Erregung oder ein Mitgerissenwerden durch den Auflauf bezeichnen; die Formulierung hält beides teilweise offen.
- source_word: μεταπεσεῖσθαι ταῦτα ὑπελάμβανον
  choice: meinten, die Lage werde sich noch ändern
  rationale: Gibt den erwarteten Umschwung von μεταπίπτω idiomatisch wieder, ohne dessen Richtung festzulegen.
