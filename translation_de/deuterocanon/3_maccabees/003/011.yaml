base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/011.yaml
  text: 'So then[a], puffed up by his present prosperity, and not perceiving the power of the greatest God, but supposing that he would continue forever in the same purpose, he wrote this letter against them:'
translation:
  language: de
  text: 'So war er nun durch seinen gegenwärtigen Erfolg überheblich geworden und erkannte die Macht des größten Gottes[a] nicht. Doch er meinte, er werde dauerhaft bei demselben Entschluss bleiben, und schrieb gegen sie folgenden Brief:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des höchsten Gottes“. Wörtlich steht im Griechischen: „des größten Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖνος μὲν οὖν
  choice: So war er nun
  rationale: Die Wendung führt folgernd zum Handeln der bereits genannten Person über. „So … nun“ gibt den Zusammenhang in natürlichem Deutsch wieder, ohne das im Deutschen schwerfällige demonstrative „jener“ zu erzwingen.
- source_word: τῇ κατὰ τὸ παρὸν εὐημερίᾳ
  choice: durch seinen gegenwärtigen Erfolg
  rationale: εὐημερία bezeichnet günstige, gedeihliche Umstände. Im politischen Erzählzusammenhang trifft „Erfolg“ den Sinn natürlicher als das vorwiegend wirtschaftlich klingende „Wohlstand“.
- source_word: γεγαυρωμένος
  choice: überheblich geworden
  rationale: Das Partizip bezeichnet durch Erfolg genährten Stolz oder Hochmut. „Überheblich geworden“ bewahrt die Zustandsveränderung und ist idiomatischer als das wörtlich-metaphorische „aufgebläht“.
- source_word: οὐ καθορῶν
  choice: erkannte … nicht
  rationale: καθοράω meint hier nicht bloß körperliches Sehen, sondern das Erfassen oder Anerkennen einer Wirklichkeit. „Erkannte … nicht“ gibt diesen mentalen Sinn klar wieder.
- source_word: κράτος
  choice: Macht
  rationale: κράτος bezeichnet wirksame Stärke oder Herrschaftsmacht; „Macht“ ist im Gottesbezug zugleich präzise und natürlich.
- source_word: τοῦ μεγίστου θεοῦ
  choice: des größten Gottes
  rationale: Die direkte Wiedergabe des Superlativs μέγιστος vermeidet eine stillschweigende Angleichung an den geläufigen, aber anders formulierten Titel „der höchste Gott“.
- source_word: ὑπολαμβάνων
  choice: meinte
  rationale: Das Partizip führt seine irrige Annahme ein. „Meinte“ ist gegenwärtiges, natürliches Deutsch und markiert die Aussage als seine Einschätzung.
- source_word: διηνεκῶς
  choice: dauerhaft
  rationale: Das Adverb bezeichnet ununterbrochenes beziehungsweise fortgesetztes Bestehen. „Dauerhaft“ wahrt den Gedanken an anhaltende Beständigkeit, ohne zwingend metaphysische Ewigkeit auszudrücken.
- source_word: ἐν τῇ αὐτῇ διαμένειν βουλῇ
  choice: bei demselben Entschluss bleiben
  rationale: βουλή kann Plan, Absicht oder Beschluss bezeichnen. „Entschluss“ passt zu seiner festgehaltenen politischen Absicht; „bei … bleiben“ bildet διαμένειν idiomatisch ab.
- source_word: ἔγραφεν κατʼ αὐτῶν ἐπιστολὴν τήνδε
  choice: schrieb gegen sie folgenden Brief
  rationale: κατά mit Genitiv ist im feindseligen Zusammenhang adversativ („gegen sie“). Das vorausweisende τήνδε wird im Deutschen natürlich mit „folgenden“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von τοῦ μεγίστου θεοῦ
  choice: des größten Gottes
  alternative: des höchsten Gottes
  rationale: Der griechische Text verwendet μέγιστος („größte“), nicht die übliche Formulierung für „der Höchste“. Die Hauptfassung bewahrt diese Wortwahl; die geläufige titularische Alternative wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählführung. Die Partizipialkonstruktionen des Griechischen werden zur besseren Verständlichkeit in koordinierte beziehungsweise finite deutsche Satzteile überführt; der Gegensatz von Gottes Macht und der selbstsicheren Annahme des Herrschers bleibt erhalten.
