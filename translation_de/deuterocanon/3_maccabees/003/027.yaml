  yaml_path: translation/deuterocanon/3_maccabees/003/027.yaml
  text: But whoever shelters any of the Jews[a], from old man to infant, even to those at the breast, will be beaten to death with the most hateful tortures[b], together with his whole household.
translation:
  language: de
  text: Wer aber einen der Juden bei sich verbirgt, vom Greis bis zum Kleinkind, ja selbst einen Säugling[a], wird samt seinem ganzen Hausstand unter den grausamsten Foltern zu Tode geschlagen werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ja bis zu den Kindern an der Brust“; das seltene griechische Wort bezeichnet Säuglinge, die noch gestillt werden.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb bezeichnet eine brutale Hinrichtung durch Schläge. Die genaue Ausgestaltung des antiken Verfahrens ist unsicher; daher wird es auch technischer mit „zu Tode knüppeln“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεπάσῃ
  choice: bei sich verbirgt
  rationale: Das Verb bedeutet wörtlich „bedecken“ und kann Schutz beziehungsweise Verbergen bezeichnen. Im Zusammenhang dieser Strafandrohung ist „bei sich verbirgt“ natürlich und macht deutlich, dass jemand den Verfolgten Zuflucht gewährt und ihn den Behörden entzieht.
- source_word: τινα τῶν Ἰουδαίων
  choice: einen der Juden
  rationale: Die indefinite partitive Fügung bezeichnet irgendeinen Einzelnen aus der Gruppe der Juden. „Einen der Juden“ bildet diese Struktur im Deutschen knapp und idiomatisch ab.
- source_word: ἀπὸ γεραιοῦ μέχρι νηπίου
  choice: vom Greis bis zum Kleinkind
  rationale: Die Wendung umspannt das Altersspektrum. „Greis“ wahrt den gehobenen, rechtlich-feierlichen Ton von γεραιός; „Kleinkind“ gibt νήπιον verständlich wieder, ohne es mit dem anschließend genannten Säugling gleichzusetzen.
- source_word: καὶ μέχρι ὑπομαστιγίων
  choice: ja selbst einen Säugling
  rationale: Das seltene ὑπομαστίγιος bezeichnet ein noch an der Brust liegendes beziehungsweise gestilltes Kind. Die Formulierung gibt die steigernde Kraft von καὶ μέχρι natürlich wieder; das konkrete Bild wird in der Fußnote bewahrt.
- source_word: ἐχθίσταις βασάνοις
  choice: unter den grausamsten Foltern
  rationale: βασάνοις bezeichnet hier gerichtliche Qualen beziehungsweise Foltern. Der Superlativ ἐχθίσταις ist wörtlich „äußerst verhasst/abscheulich“; „grausamsten“ vermittelt in diesem Hinrichtungskontext die wertende und intensive Kraft in idiomatischem Deutsch.
- source_word: ὑποτυμπανισθήσεται
  choice: zu Tode geprügelt werden
  rationale: Das Verb bezeichnet eine brutale Hinrichtung durch Schläge, möglicherweise unter Verwendung eines besonderen Geräts oder Gestells. Die Übersetzung vermittelt den sicheren Kernsinn; die Unsicherheit über das genaue Verfahren wird in der Fußnote genannt.
- source_word: πανοικίᾳ
  choice: samt seinem ganzen Hausstand
  rationale: Die adverbiale Dativform bedeutet „mit dem gesamten Haushalt“. „Hausstand“ schließt alle Angehörigen der häuslichen Gemeinschaft ein und ist daher weiter als „Familie“.
