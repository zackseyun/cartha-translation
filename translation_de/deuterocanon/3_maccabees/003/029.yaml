base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/029.yaml
  text: But every place where a Jew is discovered while being concealed shall become inaccessible and burned with fire[a], and it shall appear altogether useless to every mortal creature for all time.
translation:
  language: de
  text: Jeder Ort aber, an dem ein Jude aufgespürt wird, der völlig verborgen gehalten wird[a], soll unbetretbar sein und in Flammen stehen; für jedes sterbliche Wesen wird er sich für alle Zeit als völlig unbrauchbar erweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dem ein Jude entdeckt wird, der verborgen ist“. Die griechische Wendung τὸ σύνολον σκεπαζόμενος ist schwierig. τὸ σύνολον kann die Verborgenheit verstärken; σκεπαζόμενος bedeutet wörtlich „bedeckt“ beziehungsweise „verborgen gehalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς δὲ τόπος
  choice: Jeder Ort aber
  rationale: Die distributive Formulierung bewahrt die umfassende Reichweite des Erlasses; δέ wird mit dem natürlichen, würdevollen „aber“ wiedergegeben.
- source_word: οὗ ἐὰν φωραθῇ
  choice: an dem ... entdeckt wird
  rationale: φωράω bezeichnet das Aufspüren oder Entdecken von etwas Verborgenem. Die deutsche Formulierung passt zum rechtlich-verordnenden Ton.
- source_word: τὸ σύνολον σκεπαζόμενος
  choice: der sich völlig verborgen hält
  rationale: Die überlieferte Konstruktion ist schwierig. τὸ σύνολον wird adverbial als Verstärkung des von σκεπάζω bezeichneten Verbergens verstanden, ohne die Unsicherheit durch eine zusätzliche sachliche Ergänzung aufzulösen.
- source_word: Ἰουδαῖος
  choice: ein Jude
  rationale: Im Zusammenhang bezeichnet das Wort die verfolgte jüdische Volks- und Glaubensgemeinschaft, nicht lediglich einen Einwohner Judäas.
- source_word: ἄβατος
  choice: unbetretbar
  rationale: Das Wort bezeichnet einen Ort, der nicht betreten oder begangen werden darf beziehungsweise kann. „Unbetretbar“ erhält diesen konkreten räumlichen Sinn.
- source_word: πυριφλεγής
  choice: vom Feuer verheert
  rationale: Das Adjektiv beschreibt den durch Feuer brennenden beziehungsweise vom Feuer erfassten Zustand. Die Wiedergabe bezeichnet die angeordnete Verwüstung, ohne es bloß als einmalige Handlung zu formulieren.
- source_word: πάσῃ θνητῇ φύσει
  choice: für jedes sterbliche Wesen
  rationale: Die Wendung ist weiter als eine Beschränkung auf Menschen und lautet wörtlich „für jede sterbliche Natur“; „jedes sterbliche Wesen“ ist verständlich und wahrt diese Breite.
- source_word: καθʼ ἅπαν ἄχρηστος
  choice: völlig unbrauchbar
  rationale: Die verstärkende Wendung bezeichnet vollständige Nutzlosigkeit beziehungsweise Unverwendbarkeit.
- source_word: φανήσεται
  choice: wird er sich ... als ... erweisen
  rationale: Das Futur von φαίνω kann „erscheinen“, „sich zeigen“ oder „sich erweisen“ bedeuten. Im Deutschen gibt „sich als ... erweisen“ den prädikativen Zusammenhang natürlich wieder.
- source_word: εἰς τὸν ἀεὶ χρόνον
  choice: für alle Zeit
  rationale: Die idiomatische Wendung drückt eine unbefristete, dauernde Geltung aus.
theological_decisions:
- issue: Bedeutung der Volksbezeichnung Ἰουδαῖος
  choice: ein Jude
  alternative: ein Judäer
  rationale: Der Erzählzusammenhang handelt von der Verfolgung des jüdischen Volkes als ethnisch-religiöser Gemeinschaft; eine rein geografische Wiedergabe wäre hier zu eng.
- issue: Reichweite von πάσῃ θνητῇ φύσει
  choice: für jedes sterbliche Wesen
  alternative: für jeden Menschen
  rationale: Der griechische Ausdruck ist bewusst breit und sollte nicht ohne textlichen Grund anthropologisch verengt werden.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Ton mit dem Nachdruck eines amtlichen Erlasses. Die schwierige griechische Konstruktion wird im Haupttext lesbar, aber nicht überpräzise wiedergegeben; die echte Mehrdeutigkeit bleibt in der Fußnote sichtbar.
