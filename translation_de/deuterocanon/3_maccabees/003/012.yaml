base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/012.yaml
  text: 'King Ptolemy Philopator to the generals and soldiers throughout Egypt and in every place: greetings and good health[a].'
translation:
  language: de
  text: 'König Ptolemäus Philopator an die Heerführer und Soldaten in ganz Ägypten und an den einzelnen Orten[a]: Gruß und Wohlergehen!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den einzelnen Bezirken“ beziehungsweise „jeweils vor Ort“. Die griechische Wendung κατὰ τόπον kann örtliche Einsatzorte oder Verwaltungsbezirke bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βασιλεὺς
  choice: König
  rationale: Der Titel leitet den Absender des königlichen Schreibens ein; im Deutschen steht er natürlich ohne Artikel vor dem Namen.
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: Ptolemäus Philopator
  rationale: Name und Beiname werden in ihrer etablierten deutschen Form wiedergegeben.
- source_word: τοῖς ... στρατηγοῖς
  choice: an die Heerführer
  rationale: στρατηγοί bezeichnet militärische Befehlshaber. „Heerführer“ ist präzise und passt zum historischen, förmlichen Register, ohne einen modernen militärischen Rang festzulegen.
- source_word: καὶ στρατιώταις
  choice: und Soldaten
  rationale: Die konkrete Bezeichnung der angesprochenen Personen wird beibehalten und nicht zum Kollektiv „Truppen“ verallgemeinert.
- source_word: κατʼ Αἴγυπτον
  choice: in ganz Ägypten
  rationale: Die Wendung bezeichnet die räumliche Verteilung innerhalb Ägyptens; „in ganz Ägypten“ gibt diesen Geltungsbereich idiomatisch wieder.
- source_word: καὶ κατὰ τόπον
  choice: und an den einzelnen Orten
  rationale: Die distributive, örtliche Bedeutung von κατὰ τόπον bleibt erhalten, ohne die Orte eindeutig als Verwaltungsbezirke oder militärische Standorte festzulegen.
- source_word: χαίρειν καὶ ἐρρῶσθαι
  choice: Gruß und Wohlergehen!
  rationale: Die beiden Infinitive bilden eine formelhafte briefliche Begrüßung samt Wunsch nach Gesundheit und Wohlergehen. Die nominale deutsche Formel klingt natürlich und bewahrt den knappen offiziellen Stil.
