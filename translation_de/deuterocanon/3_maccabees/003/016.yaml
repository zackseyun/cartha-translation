base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/016.yaml
  text: And after assigning very great revenues to the temples in the cities[a], we also went on and, going up to Jerusalem, to honor the temple of those never-winnowed and never-ceasing in their folly.
translation:
  language: de
  text: Nachdem wir den Heiligtümern in den Städten sehr hohe Einkünfte zugewiesen hatten, zogen wir weiter und stiegen nach Jerusalem hinauf, um den Tempel der niemals Ausgesiebten[a], die nie von ihrer Torheit ablassen, zu ehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ist selten und schwer zu deuten. Wörtlich scheint es ein Bild vom Aussieben oder Reinigen aufzunehmen und wird hier wohl spöttisch für Menschen gebraucht, die als ungereinigt oder ungeläutert gelten. Möglich sind jedoch auch weniger abwertende Deutungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπονείμαντες
  choice: Nachdem wir … zugewiesen hatten
  rationale: Der Aoristpartizip bezeichnet eine dem Hauptgeschehen vorausgehende Handlung; »zuweisen« gibt den administrativen Sinn im Zusammenhang mit Einkünften wieder.
- source_word: προσόδους πλείστας
  choice: sehr hohe Einkünfte
  rationale: πρόσοδοι bezeichnet Einkünfte beziehungsweise Erträge; πλείστας verstärkt deren Umfang.
- source_word: προηχθημεν
  choice: gingen wir sogar so weit
  rationale: Die idiomatische Wendung bildet das weitere Fortschreiten ab und verbindet sich im Deutschen natürlich mit dem folgenden Infinitiv.
- source_word: ἀναβάντες
  choice: nach Jerusalem hinaufzuziehen
  rationale: Bewahrt die übliche biblische Rede vom Hinaufziehen nach Jerusalem und fügt sich natürlich in den deutschen Satzbau ein.
- source_word: τιμῆσαι
  choice: zu ehren
  rationale: Der Infinitiv bezeichnet den Zweck der Reise; »ehren« wahrt den kultischen Bezug, ohne ihn zu überdeuten.
- source_word: τὸ ἱερὸν
  choice: den Tempel
  rationale: ἱερόν bezeichnet hier den Jerusalemer Tempel beziehungsweise Tempelbezirk; »Tempel« ist im Kontext die klarste Wiedergabe.
- source_word: ἀλητρίων
  choice: der niemals Ausgesiebten
  rationale: Die seltene und schwierige Bezeichnung wird als feindselige Metapher aus dem Bereich des Sichtens beziehungsweise Reinigens verstanden. Die ungewöhnliche deutsche Form bewahrt Bild und Polemik, statt sie in einen allgemeinen moralischen Ausdruck aufzulösen.
- source_word: μηδέποτε ληγόντων τῆς ἀνοίας
  choice: die von ihrer Torheit nie ablassen
  rationale: Die Relativkonstruktion gibt den fortdauernden Zustand verständlich wieder; »Torheit« vermeidet unnötige klinische Konnotationen.
theological_decisions:
- issue: Bezug und Aussagekraft von τῶν ἀλητρίων καὶ μηδέποτε ληγόντων τῆς ἀνοίας
  choice: Die Genitivgruppe bezeichnet in feindseliger Weise die Menschen, die zum Jerusalemer Tempel gehören.
  alternative: Die Wendung könnte weniger abwertend als Bezeichnung der »Reinen« oder der in ihrer Hingabe Unermüdlichen verstanden werden.
  rationale: Syntax und polemischer Erzählzusammenhang sprechen dafür, dass die Gruppe von ἱερόν abhängt und dessen Anhänger verspottet. Wegen des seltenen Wortes ἀλητρίων wird die lexikalische Unsicherheit jedoch ausdrücklich kenntlich gemacht.
translation_notes:
  register: Moderne, würdige Standardsprache. Die fiskalische Ausdrucksweise und der polemische Ton der königlichen Stimme bleiben erhalten; die ungewöhnliche Metapher wird nicht geglättet.
