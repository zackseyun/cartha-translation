  yaml_path: translation/deuterocanon/3_maccabees/003/010.yaml
  text: And already some neighbors and friends and business associates[a], secretly drawing certain people aside, were giving assurances that they would join in protecting them and would offer every earnest effort toward their support.
translation:
  language: de
  text: Schon nahmen auch einige Nachbarn, Freunde und Geschäftspartner heimlich einige Menschen beiseite[a] und versicherten ihnen, sich zu ihrem Schutz zusammenzuschließen und mit ganzer Kraft zu ihrer Hilfe beizutragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewannen heimlich einige für sich“.'
    reason: Das griechische ἐπισπώμενοι kann sowohl das Heranziehen beziehungsweise Beiseitenehmen als auch das Gewinnen von Menschen für die eigene Seite bezeichnen.
lexical_decisions:
- source_word: γείτονές
  choice: Nachbarn
  rationale: Bezeichnet Menschen aus der unmittelbaren Umgebung; „Nachbarn“ ist die natürliche deutsche Entsprechung.
- source_word: φίλοι
  choice: Freunde
  rationale: In der Aufzählung ist die gewöhnliche persönliche Bedeutung am wahrscheinlichsten, ohne dass formelle Verbündete vorausgesetzt werden.
- source_word: συνπραγματευόμενοι
  choice: Geschäftspartner
  rationale: Das Partizip bezeichnet Menschen, die gemeinsam Geschäfte oder sonstige Angelegenheiten betreiben. „Geschäftspartner“ gibt den wirtschaftlich-praktischen Zusammenhang knapp wieder, ohne eine bestimmte Rechtsform anzunehmen.
- source_word: μυστικῶς
  choice: heimlich
  rationale: Das Adverb kennzeichnet das Vorgehen als verborgen oder vertraulich; angesichts der Gefahr offenen Beistands passt „heimlich“.
- source_word: τινας ἐπισπώμενοι
  choice: einzelne Menschen beiseiteziehen
  rationale: ἐπισπάω kann ein Heranziehen an sich, ein Beiseitenehmen oder ein Gewinnen für sich ausdrücken. Die Hauptfassung bewahrt die konkrete soziale Szene, ohne den Erfolg einer Überredung festzuschreiben.
- source_word: πίστεις ἐδίδουν
  choice: versicherten ihnen
  rationale: Die Wendung bedeutet wörtlich, Verlässlichkeit beziehungsweise Zusagen zu geben. Das deutsche Verb drückt hier eine verbindliche Zusicherung natürlich aus.
- source_word: συνασπίζειν
  choice: sich zu ihrem Schutz zusammenzuschließen
  rationale: Das vom „Schild“ abgeleitete Verb bezeichnet gemeinsames schützendes oder verteidigendes Handeln. Die Fassung erhält sowohl den gemeinschaftlichen als auch den schützenden Sinn, ohne im Deutschen ein unnatürliches Schildbild zu erzwingen.
- source_word: πᾶν ἐκτενὲς προσιοίσεσθαι
  choice: mit ganzer Kraft beizutragen
  rationale: Die Wendung beschreibt vollen, nachdrücklichen Einsatz und das Darbringen eines Beitrags. „Mit ganzer Kraft“ ist idiomatisch und gibt die Intensität wieder.
- source_word: πρὸς ἀντίλημψιν
  choice: zu ihrer Hilfe
  rationale: ἀντίλημψις bezeichnet Hilfe, Unterstützung oder Beistand. „Zu ihrer Hilfe“ wahrt den Zweckbezug von πρός.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Aufzählung bleibt erhalten; schwerfällige Wörtlichkeiten wie „Zusicherungen geben“ und „gemeinsam den Schild halten“ werden zugunsten natürlicher, sinngetreuer Formulierungen vermieden. Das nicht ausdrücklich genannte Bezugsobjekt des zugesagten Schutzes wird kontextgerecht mit „ihrem“ wiedergegeben.
