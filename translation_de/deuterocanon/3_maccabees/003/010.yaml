  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Satzes insgesamt zuverlässig wieder: die Gruppen von Nahestehenden handeln heimlich, ziehen einige Personen beiseite und geben verbindliche Zusagen zu gemeinsamem Schutz und tatkräftiger Hilfe. Die Wiedergabe von συνασπίζειν als „sich ... zusammenzuschließen“ bewahrt den gemeinschaftlichen Schutzaspekt, ohne ein im Deutschen künstliches Schildbild einzuführen. Das Bezugsobjekt der Infinitive bleibt im Griechischen unausgedrückt; „ihnen/ihrem“ ist daher eine vertretbare kontextuelle Aufnahme, die keine zusätzliche theologische oder historische Festlegung einführt.'
  naturalness: „Schon zogen ... Menschen beiseite“ ist zwar verständlich, klingt im heutigen Standarddeutsch aber merklich weniger idiomatisch als „Schon nahmen ... Menschen beiseite“. Außerdem gibt „einige Menschen“ τινας unmittelbarer wieder als „einzelne Menschen“, das stärker nach isolierten Individuen klingen kann.
  terminology: „Nachbarn“, „Freunde“ und „Geschäftspartner“ sind angemessen. „Heimlich“, „versicherten“, „sich zu ihrem Schutz zusammenzuschließen“ und „mit ganzer Kraft zu ihrer Hilfe beizutragen“ entsprechen dem würdigen modernen Register und der Aussage des griechischen Textes. Die Fußnote wahrt die lexikalische Ambiguität von ἐπισπώμενοι sachgerecht.
