    rationale: Für Personen ist „jemanden beiseite nehmen“ im modernen Standarddeutsch die geläufigere und stilistisch glattere Formulierung. Die Änderung ist rein sprachlich und erhält die mögliche Bedeutung von ἐπισπώμενοι.
  - severity: low
    issue: „einzelne Menschen“ ist enger als τινας
    rationale: τινας bedeutet hier schlicht „einige“ beziehungsweise „gewisse“. „Einige Menschen“ trifft den unbestimmten Plural direkter, ohne zu suggerieren, sie seien als Einzelne besonders hervorgehoben.
