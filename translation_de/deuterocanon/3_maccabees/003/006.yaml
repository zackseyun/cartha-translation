  text: So then[a], the foreigners did not at all take into account the beneficence for which the nation was spoken of everywhere;
translation:
  language: de
  text: So berücksichtigten die Fremden das überall bekannte gute Handeln dieses Volkes keineswegs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zogen das überall bekannte gute Handeln dieses Volkes keineswegs in Betracht“. Das griechische Verb ist wörtlich mit Zählen oder Aufrechnen verwandt, bedeutet hier jedoch, einer Sache Rechnung zu tragen. Das Wort für „gutes Handeln“ kann auch gute Taten oder Wohltaten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ... εὐπραξίαν
  choice: die Wohltätigkeit
  rationale: εὐπραξία bezeichnet gutes Handeln beziehungsweise Wohltun; im Zusammenhang ist die weithin bekannte positive Wirkung des Volkes gemeint, nicht bloß sein Wohlergehen.
- source_word: περὶ τὸ γένος
  choice: dieses Volkes
  rationale: γένος bezeichnet hier das jüdische Volk als ethnische Gemeinschaft. Die Einbindung als Genitivattribut ergibt natürliches Deutsch.
- source_word: ἐν πᾶσιν
  choice: überall
  rationale: In Verbindung mit θρυλουμένην bezeichnet die Wendung die allgemeine, weitverbreitete Bekanntheit.
- source_word: θρυλουμένην
  choice: gerühmte
  rationale: Das Partizip bezeichnet etwas, von dem weithin gesprochen wird. „Gerühmt“ bringt im Zusammenhang sowohl die öffentliche Bekanntheit als auch den positiven Gegenstand zur Geltung, ohne einen technischen Sinn einzutragen.
- source_word: οἱ ἀλλόφυλοι
  choice: die Fremden
  rationale: ἀλλόφυλοι sind Angehörige eines anderen Volkes. „Die Fremden“ wahrt den ethnisch-nationalen Gegensatz, ohne die später geprägte Bezeichnung „Heiden“ einzuführen.
- source_word: οὐδαμῶς
  choice: überhaupt nicht
  rationale: Die Formulierung gibt die nachdrückliche Verneinung idiomatisch wieder.
- source_word: διηριθμήσαντο
  choice: berücksichtigten
  rationale: Das Verb ist wörtlich mit Zählen oder Aufrechnen verbunden, hat hier aber den übertragenen Sinn, einer Sache Gewicht zu geben oder sie in Betracht zu ziehen.
