base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/007.yaml
  text: But they kept spreading talk about the disagreement over acts of homage and foods[a], saying that these people would not become of one way with either the king or his forces, but were hostile and strongly opposed to the affairs of state[b]; and they attached to them no ordinary fear.
translation:
  language: de
  text: Doch sie verbreiteten immer wieder Gerede über den Streit wegen Huldigungen und Speisen.[a] Sie behaupteten, diese Menschen würden weder mit dem König noch mit seinen Streitkräften übereinstimmen, sondern seien feindselig und widersetzten sich den Angelegenheiten des Staates in erheblichem Maß; und sie versetzten sie in nicht geringe Furcht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Huldigungen“ kann hier auch „Anbetung“, „Niederwerfungen“ oder allgemein „Ehrenbezeugungen“ bedeuten. Das griechische Wort lässt offen, ob vor allem religiöse oder höfische Akte der Verehrung gemeint sind.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Sie legten ihnen keine gewöhnliche Furcht auf.“ Die griechische Wendung besagt, dass sie die Betroffenen in erhebliche Furcht versetzten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάστασιν
  choice: Abweichung
  rationale: Das Wort bezeichnet Trennung, Unterschied oder Konflikt. „Abweichung“ gibt hier die beanstandete religiös-soziale Nichtanpassung wieder, ohne sie als offenen Aufruhr darzustellen.
- source_word: προσκυνήσεων
  choice: Huldigungen
  rationale: Der Plural kann sowohl kultische Verehrung als auch höfische Niederwerfungen und Ehrenbezeugungen bezeichnen. „Huldigungen“ bewahrt im politischen Zusammenhang diese Spannweite weitgehend.
- source_word: τροφῶν
  choice: Speisen
  rationale: Die schlichte Wiedergabe vermeidet die weitergehende Deutung „Speisegesetze“, obwohl solche Vorschriften sachlich im Hintergrund stehen können.
- source_word: ἐθρύλουν
  choice: verbreiteten immer wieder Gerede
  rationale: Der Imperfekt bezeichnet fortgesetztes Handeln; das Verb trägt den abwertenden Beiklang wiederholten Geredes oder der Gerüchteverbreitung.
- source_word: ὁμοτρόπως ... γίνεσθαι
  choice: sich ... in ihrer Lebensweise anpassen
  rationale: Die Formulierung betrifft Gleichartigkeit in Haltung, Lebensführung oder Verhalten. Die Übersetzung macht den Vorwurf mangelnder Anpassung verständlich, ohne ihn auf bloße Meinungsübereinstimmung zu verengen.
- source_word: ταῖς δυνάμεσιν
  choice: den Streitkräften
  rationale: δύναμις kann Mächte, Behörden oder militärische Kräfte bezeichnen. Im königlichen Kontext liegt der militärische Sinn nahe; die mögliche weitere Bedeutung bleibt in der Fußnote erwähnt.
- source_word: δυσμενεῖς
  choice: feindselig
  rationale: Das Adjektiv bezeichnet eine ablehnende oder feindliche Gesinnung und gibt die Schärfe der erhobenen Beschuldigung wieder.
- source_word: μέγα τι τοῖς πράγμασιν ἐναντιουμένους
  choice: den Angelegenheiten des Staates entschieden entgegenarbeiten
  rationale: τὰ πράγματα bezeichnet hier die öffentlichen beziehungsweise staatlichen Angelegenheiten; μέγα τι verstärkt den Vorwurf des Widerstands.
- source_word: οὐ τῷ τυχόντι ... φόβῳ
  choice: keineswegs geringe Furcht
  rationale: Die idiomatische Wendung bedeutet eine nicht gewöhnliche oder nicht unbedeutende Furcht. „Keineswegs gering“ wahrt die emphatische Verneinung.
- source_word: περιήψαντο
  choice: machten sie zum Gegenstand
  rationale: Das Verb hat bildlich den Sinn, etwas an jemanden zu heften oder jemanden damit zu belasten. Die gewählte Formulierung verdeutlicht, dass die Beschuldigten öffentlich als furchterregend dargestellt wurden.
theological_decisions:
- issue: Ob προσκυνήσεων ausschließlich kultisch als „Anbetung“ oder weiter als höfisch-rituelle Ehrenbezeugung wiederzugeben ist
  choice: Huldigungen
  alternative: Anbetung; Niederwerfungen; Ehrenbezeugungen
  rationale: Im Umfeld königlicher Macht kann das Wort religiöse wie höfische Gesten bezeichnen. Die weitere Wiedergabe vermeidet eine unbegründete Festlegung auf ausschließlich kultische Anbetung.
- issue: Ob ταῖς δυνάμεσιν militärische Kräfte oder allgemeiner obrigkeitliche Mächte bezeichnet
  choice: Streitkräfte
  alternative: Machthaber; Behörden; Mächte
  rationale: Der politische und königliche Kontext begünstigt die militärische Bedeutung, doch die lexikalische Mehrdeutigkeit wird ausdrücklich vermerkt.
- issue: Wie politisch τοῖς πράγμασιν zu verstehen ist
  choice: Angelegenheiten des Staates
  alternative: öffentliche Angelegenheiten; die bestehende Ordnung
  rationale: Der Zusammenhang beschreibt den Vorwurf einer Gefährdung von König und Gemeinwesen. Die Formulierung macht den politischen Bezug deutlich, ohne „Regime“ oder „Staatsordnung“ in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortgesetzte Gerüchteverbreitung wird idiomatisch wiedergegeben; die politisch-religiösen Mehrdeutigkeiten bei προσκυνήσεις, δυνάμεις und πράγματα werden nicht konfessionell vereindeutigt. Der ungewöhnliche Schluss wird im Haupttext verständlich formuliert und in der Fußnote in seiner griechischen Bildlichkeit offengelegt.
