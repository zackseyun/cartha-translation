  to: Darum sind wir aufgrund eindeutiger Beweise fest davon überzeugt, dass diese Leute uns in jeder Hinsicht feindlich gesinnt sind, und treffen Vorsorge, damit wir nicht, falls später einmal plötzlich Unruhen ausbrechen, diese Gottlosen als Verräter und barbarische Feinde in unserem Rücken haben,
