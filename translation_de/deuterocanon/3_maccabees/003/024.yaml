base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/024.yaml
  text: Therefore[a], being well convinced by proofs that these people are in every way ill-disposed toward us, and taking thought lest, if some sudden disturbance should later arise, we should have these ungodly people at our back as traitors and barbarian enemies,
translation:
  language: de
  text: Darum sind wir aufgrund eindeutiger Beweise fest davon überzeugt, dass diese Leute uns in jeder Hinsicht feindlich gesinnt sind, und treffen Vorsorge, damit wir nicht, falls später einmal plötzlich Unruhen ausbrechen, diese Gottlosen als Verräter und barbarische Feinde in unserem Rücken haben,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang in natürlichem, gehobenem Deutsch.
- source_word: τεκμηρίοις
  choice: aufgrund eindeutiger Beweise
  rationale: Der Dativ bezeichnet die Grundlage beziehungsweise das Mittel der Überzeugung; τεκμήριον meint einen belastbaren Beweis oder ein eindeutiges Indiz.
- source_word: καλῶς πεπεισμένοι
  choice: fest davon überzeugt
  rationale: Gibt den erreichten, gefestigten Zustand der Überzeugung idiomatisch wieder und lässt die verstärkende Wirkung von καλῶς erkennen.
- source_word: τούτους
  choice: diese Leute
  rationale: Gibt das Demonstrativpronomen ohne eine im Griechischen nicht ausdrücklich genannte nähere Gruppenbezeichnung wieder.
- source_word: κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Bewahrt den umfassenden Geltungsanspruch der Anschuldigung.
- source_word: δυσνοεῖν ἡμῖν
  choice: uns … feindlich gesinnt sind
  rationale: Drückt die gegen ‚uns‘ gerichtete feindselige Haltung klar und natürlich aus.
- source_word: προνοούμενοι
  choice: Zugleich treffen wir Vorsorge
  rationale: Vermittelt das vorausschauende Bedenken und vorbeugende Handeln; ‚zugleich‘ bindet das zweite Partizip natürlich an den Hauptgedanken an.
- source_word: μή ποτε ἐφνιδίου μετέπειτα ταραχῆς ἐνστάσης
  choice: damit wir nicht, falls später einmal plötzlich Unruhen ausbrechen
  rationale: Bewahrt die Befürchtung eines möglichen späteren, unvermittelt eintretenden Aufruhrs, ohne ταραχή unnötig auf einen organisierten Aufstand festzulegen.
- source_word: κατὰ νώτου
  choice: in unserem Rücken
  rationale: Erhält das anschauliche militärisch-politische Bild einer Gefahr von hinten.
- source_word: δυσσεβεῖς
  choice: Gottlosen
  rationale: Bewahrt die religiös und moralisch aufgeladene Beschimpfung des Sprechers.
- source_word: προδότας
  choice: Verräter
  rationale: Entspricht dem politischen und militärischen Sinn einer Person, die die eigene Seite preisgibt.
- source_word: βαρβάρους
  choice: barbarische
  rationale: Bewahrt die abwertende polemische Kraft des griechischen Ausdrucks, ohne ihn hier vorschnell als genaue ethnische Bezeichnung zu verstehen.
- source_word: πολεμίους
  choice: Feinde
  rationale: Ist die direkte und natürliche Wiedergabe des politischen beziehungsweise militärischen Ausdrucks.
theological_decisions:
- issue: Wiedergabe polemischer Bezeichnungen in der königlichen Anschuldigung
  choice: Die scharf wertenden Wörter werden als „Gottlose“, „Verräter“ und „barbarische Feinde“ beibehalten.
  alternative: Abmilderung zu Begriffen wie „illoyal“, „unzuverlässig“ oder „feindselig“.
  rationale: Der Text gibt die feindselige Rhetorik des Sprechers wieder. Eine Abschwächung würde die ideologische Schärfe der Anschuldigung verdecken; die Übersetzung macht sich diese Wertung dadurch nicht zu eigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Partizipialkonstruktion wird zur besseren Verständlichkeit auf zwei Sätze verteilt; das abschließende Komma bleibt erhalten, weil der Vers syntaktisch in den folgenden Vers hineinführt.
