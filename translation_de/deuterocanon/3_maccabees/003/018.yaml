  yaml_path: translation/deuterocanon/3_maccabees/003/018.yaml
  text: Carried away by ancient conceit[a], they barred us from entry, falling short of our strength, by which we have goodwill toward all people.
translation:
  language: de
  text: Von althergebrachtem Dünkel getrieben[a], verwehrten sie uns den Zutritt und blieben hinter unserer Stärke zurück, kraft deren wir allen Menschen Wohlwollen entgegenbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Von altem Hochmut fortgerissen“. Die knappe griechische Wendung kann sowohl eine aus früherer Zeit überkommene als auch eine seit Langem bestehende Überheblichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τύφοις φερόμενοι παλαιοτέροις
  choice: Von althergebrachtem Dünkel getrieben
  rationale: Die Formulierung gibt das passive Fortgerissenwerden durch eine aus früherer Zeit stammende überhebliche Haltung natürlich wieder. Der griechische Plural τύφοις wird im Deutschen idiomatisch als kollektiver Singular ausgedrückt.
- source_word: εἶρξαν ἡμᾶς τῆς εἰσόδου
  choice: verwehrten sie uns den Zutritt
  rationale: εἴργω mit Genitiv bezeichnet hier das Fernhalten vom Eintreten; „den Zutritt verwehren“ ist präzise und in modernem Deutsch geläufig.
- source_word: λειπόμενοι τῆς ἡμετέρας ἀλκῆς
  choice: obwohl sie unserer Stärke nicht gewachsen waren
  rationale: λειπόμενοι bezeichnet ein Zurückbleiben gegenüber der ἀλκή des Sprechers. Die konzessive Wiedergabe macht den im Zusammenhang liegenden Gegensatz verständlich, ohne ἀλκή unnötig auf militärische Tapferkeit festzulegen.
- source_word: διʼ ἣν
  choice: kraft deren
  rationale: Die Wendung hält den grammatischen Rückbezug auf „Stärke“ sowie den instrumentalen beziehungsweise begründenden Zusammenhang fest.
- source_word: πρὸς ἅπαντας ἀνθρώπους φιλανθρωπίαν
  choice: allen Menschen Wohlwollen
  rationale: φιλανθρωπία bezeichnet hier eine menschenfreundliche, wohlwollende Haltung; ἅπαντας ἀνθρώπους ist allgemein und nicht geschlechtsspezifisch.
- source_word: ἔχομεν
  choice: entgegenbringen
  rationale: Das wörtliche „haben“ wäre mit „Wohlwollen“ im Deutschen schwerfällig. „Entgegenbringen“ drückt den Besitz beziehungsweise die Bekundung dieser Haltung idiomatisch aus.
theological_decisions:
- issue: Allgemeiner Bezug von ἅπαντας ἀνθρώπους
  choice: allen Menschen
  alternative: allen Männern
  rationale: ἀνθρώπους bezeichnet hier die gesamte Menschheit und nicht ausschließlich männliche Personen.
- issue: Bezug von διʼ ἣν auf ἀλκή
  choice: kraft deren wir allen Menschen Wohlwollen entgegenbringen
  alternative: weshalb wir allen Menschen Wohlwollen entgegenbringen
  rationale: Der feminine Relativbezug weist grammatisch auf ἀλκή zurück. „Kraft deren“ bewahrt den möglichen instrumentalen Sinn und lässt die rhetorische Spannung bestehen, dass der Sprecher sein Wohlwollen aus seiner Stärke ableitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hochfahrende Sprache des königlichen Sprechers bleibt erkennbar; „Dünkel“ bildet die moralisch abwertende Färbung von τύφοις ab, ohne sie psychologisch als Wahn festzulegen.
