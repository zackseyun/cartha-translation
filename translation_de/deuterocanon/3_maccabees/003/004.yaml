base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/004.yaml
  text: But because they worshiped God and lived according to his law, they kept themselves separate in matters of food; for this reason some regarded them as hateful.
translation:
  language: de
  text: Da sie jedoch Gott verehrten und nach ihrem Gesetz lebten, sonderten sie sich in Speisefragen ab. Aus diesem Grund erschienen sie manchen als verhasst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεβόμενοι
  choice: Gott verehrten
  rationale: Gibt die religiöse Verehrung natürlich und würdig wieder.
- source_word: τῷ τούτων νόμῳ
  choice: nach ihrem Gesetz
  rationale: Das Demonstrativpronomen τούτων verweist grammatisch am ehesten auf die zuvor genannten Menschen; daher bleibt der griechische Bezug als „ihrem“ erhalten, statt ihn zu „seinem“ umzudeuten.
- source_word: πολιτευόμενοι
  choice: lebten
  rationale: Im Zusammenhang bezeichnet das Partizip die Lebensführung nach dem Gesetz; „lebten“ ist idiomatisch, ohne die Bedeutung unnötig einzuengen.
- source_word: χωρισμὸν ἐποίουν
  choice: hielten sie sich ... abgesondert
  rationale: Bewahrt den Gedanken einer praktisch vollzogenen Absonderung und klingt im Deutschen natürlich.
- source_word: ἐπὶ τῷ κατὰ τὰς τροφάς
  choice: in Fragen der Speisen
  rationale: Bezieht die Absonderung sachlich auf Speiseangelegenheiten, ohne zusätzliche kultische Einzelheiten einzutragen.
- source_word: ἀπεχθεῖς ἐφαίνοντο
  choice: erschienen sie ... als verhasst
  rationale: Wahrt sowohl das Wahrnehmungsverb ἐφαίνοντο als auch die starke negative Bedeutung von ἀπεχθεῖς.
theological_decisions:
- issue: Bezugswort von τούτων in „τῷ τούτων νόμῳ“
  choice: ihrem Gesetz
  alternative: seinem Gesetz / Gottes Gesetz
  rationale: Der vorliegende griechische Text sagt wörtlich „dem Gesetz dieser“; der grammatische Bezug auf die betreffende Menschengruppe sollte nicht aufgrund der englischen Konsultationsfassung stillschweigend theologisch umgedeutet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird jedoch für flüssige deutsche Lesbarkeit leicht geglättet.
