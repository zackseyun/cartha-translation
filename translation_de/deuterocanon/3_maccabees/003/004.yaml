  source_fidelity: Der Entwurf gibt die Partizipialbegründung, die Gottesverehrung, die Lebensführung nach dem Gesetz der betreffenden Gruppe und die daraus folgende Absonderung bei Speisen sachgerecht wieder. „Ihrem Gesetz“ bewahrt den im Griechischen mit τούτων ausgedrückten Gruppenbezug und ist gegenüber der englischen Audit-Fassung „his law“ vorzuziehen. ἀπεχθεῖς ἐφαίνοντο wird mit „erschienen … als verhasst“ angemessen als Fremdwahrnehmung wiedergegeben.
