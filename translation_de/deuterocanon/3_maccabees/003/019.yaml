  yaml_path: translation/deuterocanon/3_maccabees/003/019.yaml
  text: And by making their hostility toward us plain, they, alone among the nations, act arrogantly toward kings and toward their own benefactors, and are willing to offer nothing sincere.
translation:
  language: de
  text: Dabei lassen sie ihre Feindseligkeit gegen uns offen erkennen. Als Einzige unter den Völkern treten sie Königen und ihren eigenen Wohltätern hochmütig gegenüber und wollen ihnen nichts Aufrichtiges entgegenbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυσμένειαν
  choice: Feindseligkeit
  rationale: Gibt die ablehnende, feindliche Haltung gegenüber dem König sachlich und deutlich wieder.
- source_word: ἔκδηλον καθιστάντες
  choice: offen erkennen lassen
  rationale: Entspricht dem Sinn von etwas offenkundig oder deutlich machen und klingt im modernen Deutschen natürlich.
- source_word: μονώτατοι τῶν ἐθνῶν
  choice: als Einzige unter den Völkern
  rationale: Bewahrt die stark ausschließende, superlativische Aussage des griechischen μονώτατοι.
- source_word: ὑψαυχνοῦντες
  choice: hochmütig gegenübertreten
  rationale: Das bildhafte Verb bezeichnet stolzes, überhebliches Auftreten; die gewählte Formulierung ist würdig und allgemein verständlich.
- source_word: οὐδὲν γνήσιον ... φέρειν
  choice: nichts Aufrichtiges entgegenbringen
  rationale: Bewahrt die Offenheit von γνήσιον zwischen echt und aufrichtig und gibt φέρειν in dieser Beziehungsaussage idiomatisch wieder.
