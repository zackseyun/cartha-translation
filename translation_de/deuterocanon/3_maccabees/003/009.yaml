base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/009.yaml
  text: For so great an organization[a], lacking no knowledge, must not be overlooked.
translation:
  language: de
  text: Denn ein so großer Verband[a], dem nichts unbekannt ist, darf nicht übersehen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ein so großes Gefüge“ oder „eine so große Körperschaft“.'
    reason: Das griechische σύστημα kann ein zusammengefügtes Ganzes, einen Verband, eine Körperschaft oder ein System bezeichnen.
lexical_decisions:
- source_word: μὴ ... παροραθήσεσθαι
  choice: darf nicht unbeachtet bleiben
  rationale: Das Futurpassiv im Infinitiv bezeichnet, dass die Gemeinschaft nicht übersehen oder außer Acht gelassen werden soll. Die deutsche Wendung bewahrt die passive Aussage und vermeidet eine unnötig harte Festlegung auf ein ausdrückliches Gebot.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet oder erläutert die vorausgehende Aussage; „denn“ gibt diese Verknüpfung knapp und natürlich wieder.
- source_word: οὕτω τηλικοῦτο
  choice: eine so große
  rationale: Die Verbindung verstärkt das Ausmaß. „So groß“ bewahrt den rhetorischen Nachdruck, ohne festzulegen, ob Größe, Zahl oder Bedeutung gemeint ist.
- source_word: σύστημα
  choice: Gemeinschaft
  rationale: σύστημα bezeichnet ein zusammengefügtes Ganzes, einen Verband oder eine Körperschaft. „Gemeinschaft“ ist im Kontext einer Personengruppe natürlich und weniger modern-bürokratisch als „Organisation“.
- source_word: μηδὲν ἠγνοηκός
  choice: der nichts unbekannt ist
  rationale: Die Formulierung bildet die Aussage des perfektischen Partizips eng ab und bewahrt die mögliche Bedeutung umfassender Kenntnis, statt sie interpretierend zu „die nichts übersehen hat“ umzudeuten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Gemeinschaft“ vermeidet den technischen Klang von „Organisation“; „darf nicht unbeachtet bleiben“ gibt die rhetorische Kraft des griechischen Infinitivs idiomatisch wieder. Die etwas auffällige Aussage „der nichts unbekannt ist“ bleibt bewusst erhalten, weil der griechische Wortlaut semantisch mehrdeutig ist.
