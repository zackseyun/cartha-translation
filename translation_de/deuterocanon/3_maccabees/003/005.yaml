  text: And by adorning their way of life with the good conduct of the righteous, they had become well regarded by all people.
translation:
  language: de
  text: Indem sie ihre Lebensweise durch das rechtschaffene Handeln der Gerechten schmückten, hatten sie sich bei allen Menschen Ansehen erworben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ... εὐπραξίᾳ
  choice: durch das rechtschaffene Handeln
  rationale: Der Dativ bezeichnet hier das Mittel; εὐπραξία meint im Zusammenhang gutes beziehungsweise richtiges Handeln. „Rechtschaffen“ bewahrt den ethischen Gehalt und verbindet sich natürlich mit „Handeln“.
- source_word: τῶν δικαίων
  choice: der Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet gerechte beziehungsweise rechtschaffene Menschen. Die kompakte Form bewahrt den moralisch-religiösen Klang des Griechischen.
- source_word: κοσμοῦντες
  choice: schmückten
  rationale: 'κοσμέω bezeichnet ein Schmücken oder Zieren. Die deutsche Wiedergabe erhält die Metapher: Ihr gemeinsames Leben gewann durch rechtschaffenes Handeln an sichtbarer Würde.'
- source_word: τὴν συναναστροφήν
  choice: ihr Zusammenleben
  rationale: συναναστροφή kann Lebensführung, Verhalten oder gesellschaftlichen Umgang bezeichnen. „Zusammenleben“ bringt hier den sozialen Charakter stärker zum Ausdruck als das allgemeinere „Lebensführung“.
- source_word: ἅπασιν ἀνθρώποις
  choice: bei allen Menschen
  rationale: Der Dativ nennt diejenigen, in deren Urteil sie Anerkennung genossen. „Bei allen Menschen“ ist dafür im Deutschen idiomatisch.
- source_word: εὐδόκιμοι
  choice: Ansehen
  rationale: εὐδόκιμος bezeichnet einen guten Ruf oder anerkannte Stellung. In Verbindung mit „sich Ansehen erwerben“ wird die gesellschaftliche Wertschätzung natürlich ausgedrückt.
- source_word: καθειστήκεισαν
  choice: hatten sie sich ... erworben
  rationale: Der Plusquamperfekt von καθίστημι beschreibt einen bereits erreichten Zustand. Die Formulierung gibt sowohl das Gewordensein als auch das daraus entstandene Ansehen wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schmuckmetapher von κοσμέω bleibt erhalten; zugleich wird συναναστροφή sozial als „Zusammenleben“ gefasst. Der Satz folgt der griechischen Partizipialstruktur in natürlicher deutscher Form.
