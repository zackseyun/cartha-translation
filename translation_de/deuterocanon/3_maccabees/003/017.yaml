base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/017.yaml
  text: But although they accepted our presence in word[a], in deed they were false, when we eagerly desired to enter into their temple and honor it with the most splendid and finest offerings[b],
translation:
  language: de
  text: Sie aber nahmen unsere Anwesenheit zwar mit Worten an[a], handelten in der Tat jedoch unaufrichtig, als wir eifrig danach strebten, ihren Tempel zu betreten und ihn mit den prächtigsten und schönsten Weihgaben[b] zu ehren,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie nahmen unsere Anwesenheit zwar mündlich an, handelten aber in Wirklichkeit unaufrichtig.“'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet Gaben, die einem Heiligtum geweiht und dort aufgestellt wurden; möglich ist auch „Votivgaben“.
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ μὲν ... τῷ δὲ πράγματι
  choice: zwar mit Worten ... in der Tat jedoch
  rationale: Bewahrt den pointierten Gegensatz zwischen dem Gesagten und dem tatsächlichen Verhalten in natürlichem Deutsch.
- source_word: ἀποδεξάμενοι
  choice: angenommen
  rationale: Gibt das Empfangen beziehungsweise Akzeptieren der königlichen Anwesenheit wieder, ohne die Herzlichkeit von „willkommen geheißen“ vorauszusetzen.
- source_word: παρουσίαν
  choice: Anwesenheit
  rationale: Entspricht unmittelbar der persönlichen Gegenwart des Herrschers; „Besuch“ wäre idiomatischer, aber weniger quellennah.
- source_word: νόθως
  choice: sich ... als unaufrichtig erwiesen
  rationale: Drückt die Unechtheit ihres praktischen Verhaltens aus. Die prädikative Form ergibt im Deutschen einen klaren Anschluss an den Wort-Tat-Gegensatz.
- source_word: προθυμηθέντων ἡμῶν
  choice: als wir bereitwillig ... wollten
  rationale: Gibt sowohl die innere Bereitwilligkeit als auch die beabsichtigte Handlung wieder, ohne das Verb zu einem bloßen Wunsch abzuschwächen.
- source_word: εἰσελθεῖν εἰς τὸν ναὸν αὐτῶν
  choice: in ihren Tempel hineingehen
  rationale: „Tempel“ passt zum historischen Zusammenhang; „hineingehen“ bildet die durch εἰς bezeichnete Bewegung ausdrücklich ab.
- source_word: τοῖς ἐκπρεπέσιν καὶ καλλίστοις ἀναθήμασιν
  choice: mit überaus prächtigen und schönen Weihgaben
  rationale: „Weihgaben“ bezeichnet eigens in einem Heiligtum gestiftete Gaben genauer als das allgemeinere „Opfergaben“. Die beiden wertenden Adjektive bleiben erhalten.
- source_word: τιμῆσαι
  choice: ihn ... ehren
  rationale: Gibt den Zweck des Betretens knapp wieder; das Pronomen bezieht sich im Satz auf den Tempel.
theological_decisions:
- issue: Sinn und Bewertung der beabsichtigten Handlung im Tempel
  choice: Die Behauptung des Sprechers, er habe den jüdischen Tempel durch Weihgaben ehren wollen, wird ohne wertende Kommentierung wiedergegeben.
  alternative: Die Wendung könnte zeremonieller als „ihrem Tempel mit Votivgaben Ehre erweisen“ formuliert werden.
  rationale: Der Text berichtet die Selbstdarstellung des Herrschers innerhalb seiner Rede. Die Übersetzung bestätigt diese weder theologisch noch schwächt sie sie ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Teil des über den Vers hinausreichenden griechischen Satzgefüges mit einem Komma offen. Die antithetische Struktur und die Außensicht des Sprechers („ihren Tempel“) sind gewahrt.
