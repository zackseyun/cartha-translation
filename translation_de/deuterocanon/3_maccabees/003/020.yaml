  to: 'Wir aber hatten ihre Torheit nachsichtig ertragen[a], waren siegreich hindurchgebracht worden und waren allen Völkern in Ägypten menschenfreundlich[b] begegnet; wir handelten, wie es sich gehörte.


    [a] Das griechische Verb kann auch bedeuten: »Wir verhielten uns ihrer Unvernunft gegenüber entgegenkommend.« Es bezeichnet hier ein nachsichtiges Verhalten.


    [b] Oder: »gütig« beziehungsweise »human«.'
  rationale: Die Revision belässt die königliche Selbstdarstellung ohne kommentierende Distanzierung und wahrt die passivische, nicht weiter spezifizierte Aussage von διακομισθέντες durch »hindurchgebracht worden«. Sie vermeidet zugleich die zu enge syntaktische Festlegung von εἰς τὴν Αἴγυπτον und glättet den deutschen Schlusssatz. Die Fußnoten werden vollständig beibehalten, aber idiomatisch und semantisch präziser formuliert.
