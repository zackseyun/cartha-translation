review_pass:
  verdict: revise
  source_fidelity: 'Die Grundentscheidungen sind zutreffend: »Torheit«, die Nachsicht gegenüber ihr, das Passiv bei διακομισθέντες, »allen Völkern« und die zurückhaltende Wiedergabe von ἀπαντήσαντες als »begegnen« bewahren den Sinn. Die Anbindung von »nach Ägypten« an »gebracht worden« legt jedoch stärker als der griechische Satz fest, worauf sich die Richtungsangabe bezieht. Eine Satzfassung mit »in Ägypten« bei »begegnen« folgt der im Audit gewählten Lesart und bleibt idiomatisch.'
  naturalness: 'Die Häufung von Plusquamperfektformen ist als Rückblick möglich, klingt in der vorliegenden Verbindung aber unnötig schwer. »So taten wir, was sich gehörte« ist verständlich, wirkt nach dem Semikolon jedoch weniger natürlich als eine direkte Wiedergabe von καθὼς ἔπρεπεν: »handelten wir, wie es sich gehörte.«'
  terminology: »Menschenfreundlich« ist als gehobene, königlich-selbstrechtfertigende Entsprechung zu φιλανθρώπως passend. Die Fußnotenalternative »auf menschliche Weise« ist im Deutschen missverständlich und gibt den Sinn von Wohlwollen beziehungsweise Menschlichkeit nicht gut wieder; »human« oder »gütig« ist geeigneter.
