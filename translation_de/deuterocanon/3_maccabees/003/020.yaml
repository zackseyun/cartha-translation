  yaml_path: translation/deuterocanon/3_maccabees/003/020.yaml
  text: But we[a], having borne with their folly, and having been carried through with victory, and having met all the nations in Egypt with humanity[b], did what was fitting.
translation:
  language: de
  text: 'Wir aber hatten ihre Torheit nachsichtig ertragen[a], waren siegreich hindurchgebracht worden und waren allen Völkern in Ägypten menschenfreundlich[b] begegnet; wir handelten, wie es sich gehörte.


    [a] Das griechische Verb kann auch bedeuten: »Wir verhielten uns ihrer Unvernunft gegenüber entgegenkommend.« Es bezeichnet hier ein nachsichtiges Verhalten.


    [b] Oder: »gütig« beziehungsweise »human«.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb kann auch bedeuten: »Wir verhielten uns ihrer Unvernunft gegenüber entgegenkommend.« Es bezeichnet hier ein nachsichtiges Verhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gütig« beziehungsweise »human«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίᾳ
  choice: Torheit
  rationale: Bezeichnet mangelnde Einsicht oder Unvernunft. »Torheit« bewahrt sowohl den verstandesmäßigen als auch den wertenden Gehalt, ohne klinische »Verrücktheit« anzudeuten.
- source_word: συμπεριενεχθέντες
  choice: hatten … nachsichtig ertragen
  rationale: Das passive Partizip von συμπεριφέρω beschreibt hier ein entgegenkommendes, geduldiges Verhalten gegenüber der Torheit anderer. Die Formulierung ist im Deutschen natürlich und wahrt den Gedanken der Nachsicht.
- source_word: μετὰ νίκης
  choice: siegreich
  rationale: Gibt die wörtliche Wendung »mit Sieg« idiomatisch wieder, ohne sie zum stärker deutenden »im Triumph« zu steigern.
- source_word: διακομισθέντες
  choice: waren … gebracht worden
  rationale: Bewahrt das Passiv und den Sinn des sicheren Hinüber- oder Ans-Ziel-Gebrachtwerdens.
- source_word: εἰς τὴν Αἴγυπτον
  choice: nach Ägypten
  rationale: Die Richtungsangabe wird natürlich mit dem vorangehenden Verb des Geleitens beziehungsweise Gelangens verbunden.
- source_word: τοῖς πᾶσιν ἔθνεσιν
  choice: allen Völkern
  rationale: ἔθνη bezeichnet hier allgemein Völker; »Heiden« würde einen nicht ausdrücklich markierten religiösen Gegensatz eintragen.
- source_word: φιλανθρώπως
  choice: menschenfreundlich
  rationale: Gibt die rhetorische Bedeutung von wohlwollendem, humanem Verhalten eng und im gehobenen Register wieder.
- source_word: ἀπαντήσαντες
  choice: waren … begegnet
  rationale: Bewahrt die Grundbedeutung »begegnen« und vermeidet die stärkere Auslegung »aufgenommen« oder »willkommen geheißen«.
- source_word: καθὼς ἔπρεπεν ἐποιήσαμεν
  choice: so taten wir, was sich gehörte
  rationale: Gibt den Anspruch auf angemessenes, standesgemäßes Handeln in natürlichem, würdevollem Deutsch wieder.
theological_decisions:
- issue: Königliche Selbstdarstellung als nachsichtig und menschenfreundlich
  choice: Die Behauptungen werden als Selbstaussage des königlichen Sprechers ohne zusätzliche Wertung wiedergegeben.
  alternative: Die Aussage durch ironische oder propagandakritische Zusätze als unglaubwürdig kennzeichnen.
  rationale: Der griechische Text enthält an dieser Stelle keine ausdrückliche Distanzierung. Die Übersetzung soll die selbstrechtfertigende Rhetorik erkennbar lassen, sie aber weder bestätigen noch durch nicht vorhandene Deutungssignale widerlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Folge der griechischen Partizipien wird durch Plusquamperfektformen nachvollziehbar gemacht; der königliche, selbstrechtfertigende Ton bleibt erhalten. »Menschenfreundlich« ist bewusst etwas formeller als »freundlich« und entspricht der rhetorischen Färbung von φιλανθρώπως.
