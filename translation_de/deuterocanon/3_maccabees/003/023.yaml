base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/023.yaml
  text: Not only have they rejected the honorable civic order[a], but they also detest, both in speech and in silence, the few among them who are genuinely well-disposed toward us, and at every opportunity, driven by the most impious pretext[c][b], they rush to bring our affairs to ruin.
translation:
  language: de
  text: Sie haben nicht nur die hochgeschätzte staatliche Ordnung[a] verworfen, sondern verabscheuen auch – mit Worten wie durch Schweigen[b] – die wenigen unter ihnen, die uns gegenüber aufrichtig wohlgesinnt sind. Bei jeder Gelegenheit stürmen sie unter dem äußerst frevelhaften Vorwand[c] darauf los, unsere Angelegenheiten eilig zugrunde zu richten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann formal auch als „ehrlose“ oder „missachtete“ verstanden werden; im Zusammenhang liegt jedoch der Sinn einer besonders geschätzten oder wertvollen staatlichen Ordnung näher.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch Wort und Schweigen“; die Wendung kann offene ebenso wie stillschweigende Feindseligkeit bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort kann „Vorwand“, „Anschein“ oder „Andeutung“ bedeuten; eine Wiedergabe als „Absicht“ wäre stärker deutend.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστρέψαντο
  choice: haben … verworfen
  rationale: Das Medium bezeichnet hier eine bewusste Abkehr beziehungsweise Zurückweisung; „verworfen“ gibt die entschiedene Haltung idiomatisch wieder.
- source_word: τὴν ἄτιμητον πολιτίαν
  choice: die hochgeschätzte staatliche Ordnung
  rationale: πολιτεία bezeichnet im königlich-politischen Zusammenhang die staatliche beziehungsweise bürgerliche Ordnung. ἄτιμητον wird kontextuell als „unschätzbar, hochgeschätzt“ verstanden; diese Bedeutung erklärt die Anklage schlüssiger als „ehrlos“.
- source_word: βδελύσσονται
  choice: verabscheuen
  rationale: Das starke Verb drückt Abscheu aus; „verabscheuen“ ist kräftig, natürlich und würdevoll.
- source_word: λόγῳ τε καὶ σιγῇ
  choice: mit Worten wie durch Schweigen
  rationale: Die auffällige Paarung wird bewahrt und lässt sowohl offene als auch stillschweigende Feindseligkeit erkennen.
- source_word: τοὺς ἐν αὐτοῖς ὀλίγους
  choice: die wenigen unter ihnen
  rationale: Direkte und natürliche Wiedergabe der kleinen Minderheit innerhalb der genannten Gruppe.
- source_word: πρὸς ἡμᾶς γνησίως διακειμένους
  choice: die uns gegenüber aufrichtig wohlgesinnt sind
  rationale: διακεῖμαι mit πρός bezeichnet eine Haltung gegenüber jemandem; γνησίως hebt deren Aufrichtigkeit hervor, ohne formelle Loyalität zu unterstellen.
- source_word: παρʼ ἕκαστα
  choice: bei jeder Gelegenheit
  rationale: Die adverbiale Wendung bezeichnet im Zusammenhang jede sich bietende Gelegenheit.
- source_word: ἐφορμώμενοι
  choice: setzen sie alles daran
  rationale: Das Partizip vermittelt energisches, feindseliges Drängen. Die deutsche Wendung fügt sich natürlich in die Infinitivkonstruktion, ohne die Aussage auf einen körperlichen Angriff zu verengen.
- source_word: μετὰ τῆς δυσσεβεστάτης ἐμφάσεως
  choice: mit einer äußerst frevelhaften Absicht
  rationale: ἔμφασις kann Erscheinung, Andeutung, Vorwand oder erklärtes Ansinnen bezeichnen. „Absicht“ passt zur feindseligen Zielrichtung, während die Fußnote die echte Bedeutungsbreite offenhält.
- source_word: διὰ τάχους
  choice: rasch
  rationale: Die Wendung bezeichnet Schnelligkeit beziehungsweise Eile.
- source_word: ἡμᾶς καταστρέψαι τὰ πράγματα
  choice: unsere Angelegenheiten … zugrunde zu richten
  rationale: Die Konstruktion zielt auf den Umsturz oder Ruin der Verhältnisse beziehungsweise Belange der Sprecher und ist weiter als bloße körperliche Vernichtung.
theological_decisions:
- issue: Bedeutung von ἄτιμητον bei πολιτείαν
  choice: hochgeschätzte staatliche Ordnung
  alternative: ehrlose beziehungsweise missachtete staatliche Ordnung
  rationale: Das Adjektiv ist formal mehrdeutig. Im rhetorischen Zusammenhang besteht die Anklage jedoch darin, eine wertvolle Ordnung verworfen zu haben; „hochgeschätzt“ bewahrt diesen Sinn, während eine Fußnote die formale Alternative nennt.
- issue: Bedeutung von ἔμφασις
  choice: Absicht
  alternative: Vorwand, Anschein oder Andeutung
  rationale: Der politische Anklageton lässt eine feindselige Zielsetzung erkennen, doch das griechische Wort bleibt semantisch offen. Daher wird die Alternative ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem politisch-anklagendem Ton. Die lange griechische Periode wurde zur besseren Lesbarkeit in zwei Sätze gegliedert; Mehrdeutigkeiten bei ἄτιμητον und ἔμφασις werden nicht verschwiegen.
