lexical_decisions:
- source_word: τούναντίον
  choice: das Gegenteil
  rationale: Das substantivierte Adverb bezeichnet hier das Gegenteil beziehungsweise einen entgegengesetzten Ausgang und ergänzt ἐκδεχόμενοι natürlich.
- source_word: ἐκδεχόμενοι
  choice: erwarteten
  rationale: Das Partizip beschreibt ein Erwarten oder Abwarten; im gegebenen Zusammenhang ist „erwarteten“ die klare und idiomatische Wiedergabe.
- source_word: συμφύτῳ
  choice: angeborenen
  rationale: Das Wort bedeutet wörtlich „mitgewachsen“ und bezeichnet eine fest innewohnende oder angeborene Eigenschaft.
- source_word: κακοηθείᾳ
  choice: Bosheit
  rationale: Der Ausdruck bezeichnet eine schlechte, böswillige Gesinnung; „Bosheit“ bewahrt sowohl den moralischen als auch den dispositionellen Sinn.
- source_word: τὸ καλόν
  choice: das Gute
  rationale: Das substantivierte Neutrum bezeichnet das sittlich Gute, ohne es auf eine einzelne gute Tat einzuengen.
- source_word: ἀπωσάμενοι
  choice: stießen … von sich
  rationale: Die Form vermittelt ein entschiedenes Wegstoßen; die bildhafte deutsche Formulierung ist kräftiger und quellennäher als das abstrakte „lehnten ab“.
- source_word: διηνεκῶς
  choice: fortwährend
  rationale: Das Adverb kennzeichnet eine anhaltende, gewohnheitsmäßige Ausrichtung.
- source_word: φαῦλον
  choice: dem Verwerflichen
  rationale: Das substantivierte Adjektiv bezeichnet hier das sittlich Niedrige oder Schlechte. „Das Verwerfliche“ ist in modernem Deutsch natürlich und wahrt die moralische Wertung.
- source_word: ἐκνεύοντες
  choice: wandten sich … zu
  rationale: Das Partizip zeichnet eine fortgesetzte Bewegung oder Neigung in eine falsche Richtung; „sich zuwenden“ gibt die Zielrichtung mit εἰς verständlich wieder.
theological_decisions:
- issue: Aussage über die angeborene Bosheit
  choice: „aus ihrer angeborenen Bosheit“ als Charakterisierung der genannten Personen bewahren
  alternative: zu „aufgrund ihrer tief verwurzelten Bosheit“ abschwächen
  rationale: συμφύτῳ bezeichnet ausdrücklich etwas Mitgewachsenes beziehungsweise Angeborenes. Der Text formuliert eine scharfe rhetorische Charakterisierung dieser Gruppe; er soll weder zu einer allgemeinen Erbsündenlehre ausgeweitet noch durch eine Abschwächung entschärft werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Partizipienfolge wurde als koordinierter deutscher Satz wiedergegeben. Das abschließende Komma bleibt erhalten, da der griechische Vers syntaktisch in den folgenden Kontext weiterführt.
