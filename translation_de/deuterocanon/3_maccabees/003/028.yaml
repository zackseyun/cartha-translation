  yaml_path: translation/deuterocanon/3_maccabees/003/028.yaml
  text: And whoever wishes to inform against them will[a], for this, receive the property of the one who falls under the penalty, and two thousand drachmas from the royal treasury[b], and will be crowned with freedom.
translation:
  language: de
  text: Wer aber sie anzeigen will, wird dafür den Besitz dessen erhalten, der zur Rechenschaft gezogen wird,[a] sowie zweitausend Drachmen aus der königlichen Kasse, und wird mit der Freiheit gekrönt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der unter amtliche Untersuchung beziehungsweise Haftung fällt“. Das griechische Wort kann eine Rechenschaftsprüfung, rechtliche Verantwortlichkeit oder deren strafrechtliche Folgen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist wahrscheinlich, dass dem Anzeigenden als Belohnung die Freiheit verliehen wird, möglicherweise durch Freilassung aus der Sklaverei.
    reason: cultural_note
lexical_decisions:
- source_word: μηνύειν
  choice: sie anzuzeigen
  rationale: Im rechtlich-administrativen Zusammenhang bezeichnet das Verb eine belastende Meldung an die Obrigkeit. „Anzeigen“ gibt diesen anklagenden Sinn im modernen Deutschen knapp wieder.
- source_word: τὸν βουλόμενον
  choice: wer aber bereit ist
  rationale: Das substantivierte Partizip ist allgemein formuliert und eröffnet jedem Willigen die Möglichkeit zur Anzeige. „Bereit ist“ klingt in einem Erlass natürlicher als das wörtlichere „will“.
- source_word: ἐφʼ ᾧ
  choice: dafür
  rationale: Die Wendung verknüpft die Anzeige mit der zugesagten Belohnung und lässt sich im Deutschen natürlich kausal als „dafür“ wiedergeben.
- source_word: οὐσίαν
  choice: den Besitz
  rationale: Gemeint ist das Vermögen beziehungsweise Eigentum der belangten Person; „Besitz“ ist verständlich und passt zum Kontext der Konfiskation.
- source_word: τοῦ ἐμπίπτοντος ὑπὸ τὴν εὔθυναν
  choice: dessen, der zur Rechenschaft gezogen wird
  rationale: εὔθυνα kann amtliche Prüfung, Verantwortlichkeit oder Ahndung bezeichnen. Die Formulierung bewahrt den forensischen Sinn, ohne die nicht völlig eindeutige Wendung vorschnell auf „Strafe“ zu verengen.
- source_word: λήμψεται
  choice: wird … erhalten
  rationale: Das Futur Medium bezeichnet hier den zugesagten Empfang der Belohnung.
- source_word: ἐκ τοῦ βασιλικοῦ
  choice: aus der königlichen Kasse
  rationale: Das substantivierte Adjektiv setzt königliche Geldmittel oder die königliche Kasse voraus. Die Ergänzung „Kasse“ macht die griechische Ellipse im Deutschen verständlich.
- source_word: δραχμὰς δισχιλίας
  choice: zweitausend Drachmen
  rationale: Die historische Währungseinheit wird beibehalten, statt sie durch eine ungenaue moderne Geldangabe zu ersetzen.
- source_word: τῆς ἐλευθερίας στεφανωθήσεται
  choice: wird mit der Freiheit gekrönt werden
  rationale: Die wörtliche, ehrende Kronenmetapher bleibt erhalten; im Zusammenhang dürfte die Wendung die Verleihung der Freiheit, möglicherweise eine Freilassung, bezeichnen.
theological_decisions:
- issue: Bedeutung der Krönung mit Freiheit in einem königlichen Erlass
  choice: Die Kronenmetapher wird wörtlich bewahrt und als Verleihung der Freiheit verstanden.
  alternative: „wird als Belohnung die Freiheit erhalten“ oder „wird freigelassen werden“
  rationale: Die freiere Wiedergabe wäre verständlicher, würde aber das rhetorische Bild beseitigen und die Art der gewährten Freiheit eindeutiger festlegen, als es der griechische Wortlaut erlaubt.
translation_notes:
  register: Moderner, würdiger Erlassstil. Die Syntax wurde für natürliches Deutsch gegliedert; die rechtliche Mehrdeutigkeit von εὔθυνα und das Bild der Krönung mit Freiheit bleiben erhalten.
