base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/021.yaml
  text: And in these matters[a], after making known to all their own countrymen our lack of resentment, and because of the alliance and the countless affairs entrusted to them from the beginning with sincerity, we decided to transform their status and deem them worthy of Alexandrian citizenship[b], and to appoint them as sharers in the things of the sanctuary.
translation:
  language: de
  text: Unter diesen Umständen beschlossen wir, nachdem wir allen ihren Volksgenossen gegenüber kundgetan hatten, dass wir ihnen nichts nachtragen,[a] und angesichts des Bündnisses sowie der zahllosen Angelegenheiten, die ihnen von Anfang an in aller Aufrichtigkeit anvertraut worden waren, ihren Status zu verändern, sie des Bürgerrechts der Alexandriner für würdig zu erachten und sie zu Teilhabern an dem zu machen, was zum Heiligtum gehört.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Nachsicht“ bzw. „unsere Freiheit von Groll“. Das griechische Wort bezeichnet die Haltung, erlittenes Unrecht nicht nachzutragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „an den Dingen für das Heiligtum“. Gemeint sein können allgemein Vorrechte, Angelegenheiten oder Aufgaben im Zusammenhang mit dem Heiligtum; der genaue Umfang bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμνησικακίαν
  choice: Nachsicht
  rationale: Das Substantiv bezeichnet das Nichtnachtragen erlittenen Unrechts. „Nachsicht“ ist natürlich und würdevoll; eine Fußnote bewahrt die genauere Nuance des Nichthegens von Groll.
- source_word: ὁμοφύλους
  choice: Volksgenossen
  rationale: Der Ausdruck bezeichnet Menschen desselben Volkes bzw. derselben Herkunft. „Volksgenossen“ gibt die ethnisch-soziale Zugehörigkeit wieder, ohne den modernen biologischen Begriff „Rasse“ einzuführen.
- source_word: συμμαχίαν
  choice: Bündnis
  rationale: Im königlich-politischen Kontext bezeichnet das Wort eine formelle verbündete Beziehung, nicht bloß persönliche Freundschaft.
- source_word: τὰ πεπιστευμένα ... μύρια πράγματα
  choice: die zahllosen Angelegenheiten, die ihnen ... anvertraut worden waren
  rationale: Das substantivierte Perfektpartizip und πράγματα bezeichnen zahlreiche in ihre Obhut gegebene Aufgaben oder Angelegenheiten; die deutsche Relativkonstruktion wahrt sowohl den Umfang als auch den Gedanken des Vertrauens.
- source_word: μετὰ ἁπλότητος
  choice: in gutem Glauben
  rationale: ἁπλότης meint hier Aufrichtigkeit und Lauterkeit, nicht Einfältigkeit. „In gutem Glauben“ passt zur vertrauensvollen Übertragung von Angelegenheiten.
- source_word: ἐξαλλοιῶσαι
  choice: in einen anderen Stand versetzen
  rationale: Das Verb bedeutet, gründlich zu verändern. Der folgende Kontext konkretisiert dies als Änderung des bürgerlichen Status; die Formulierung macht diesen Bezug verständlich, ohne völlige kulturelle oder ethnische Umgestaltung zu behaupten.
- source_word: πολιτίας ... Ἀλεξανδρέων
  choice: alexandrinische Bürgerschaft
  rationale: πολιτεία bezeichnet hier den Bürgerstatus bzw. das Bürgerrecht der Alexandriner. „Bürgerschaft“ erhält den Statusbezug und verbindet sich natürlich mit καταξιῶσαι.
- source_word: καταξιῶσαι
  choice: für würdig erachten
  rationale: Die Formulierung bewahrt die wertende Bedeutung des Verbs und reduziert es nicht auf ein bloßes Gewähren.
- source_word: μετόχους
  choice: Teilhaber
  rationale: Das Wort bezeichnet Personen, die an etwas Anteil haben. „Teilhaber“ ist verständlich und lässt Art und Umfang dieses Anteils offen.
- source_word: τῶν εἰς ἱερὸν
  choice: an dem, was zum Heiligtum gehört
  rationale: Die knappe griechische Wendung ist inhaltlich weit und kann Privilegien, Belange oder Aufgaben des Heiligtums umfassen. Die Übersetzung vermeidet eine unbelegte Verengung.
- source_word: καταστῆσαι
  choice: zu ... machen
  rationale: Das Verb bezeichnet hier die Einsetzung in einen neuen Status oder eine neue Rolle; die deutsche Konstruktion ist klar und idiomatisch.
theological_decisions:
- issue: Umfang der bürgerlichen und kultischen Vorrechte
  choice: Der Vers beschreibt eine beabsichtigte Erhöhung des bürgerlichen Status und eine Teilhabe an nicht näher bestimmten Belangen des Heiligtums.
  alternative: Vollständige Eingliederung in den alexandrinischen Staatskörper oder, enger gefasst, Einsetzung in einen bestimmten Tempeldienst.
  rationale: Der griechische Text nennt die alexandrinische πολιτεία und „das zum Heiligtum Gehörende“, bestimmt aber weder den genauen Rechtsumfang noch die konkrete kultische Funktion. Die Übersetzung hält diese Offenheit fest.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer politisch-administrativer Sprache. Der lange griechische Satzbau bleibt als zusammenhängender Gedankengang erhalten, wird aber durch deutsche Nebensatzstellung lesbar gemacht. Die wiederholte Infinitivstruktur wird parallel wiedergegeben; weder die Statusänderung noch die Teilhabe am Heiligtum wird über den Wortlaut hinaus präzisiert.
