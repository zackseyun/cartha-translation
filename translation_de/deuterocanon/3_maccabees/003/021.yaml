  verdict: revise
  source_fidelity: Die Grundbedeutung wird weitgehend getroffen. Jedoch fügt „auch“ einen im Griechischen nicht ausgedrückten Zusatz hinzu, und „in einen anderen Stand versetzen“ legt stärker als nötig einen bestimmten Wechsel in einen anderen Stand nahe. πολιτεία Ἀλεξανδρέων ist genauer als „Bürgerrecht der Alexandriner“ wiederzugeben. Für ἀμνησικακίαν ist eine explizite Formulierung des Nichtnachtragens im Haupttext treuer als das mehrdeutige „Nachsicht“.
  naturalness: Der Entwurf ist grundsätzlich verständlich, doch die Einleitung „Und da wir in diesen Dingen“ und die Häufung von „sie“ wirken schwerfällig. Eine Umstellung mit „Unter diesen Umständen beschlossen wir, nachdem ...“ gibt die griechische Partizipialrelation und den administrativ-königlichen Register natürlicher wieder.
  terminology: „Bündnis“, „Volksgenossen“ und „Teilhaber“ sind vertretbar. „Bürgerrecht der Alexandriner“ bezeichnet den politischen Status präziser als „alexandrinische Bürgerschaft“. Die offene Wendung zu den Heiligtumsangelegenheiten soll beibehalten werden.
  issues:
  - severity: medium
    issue: „auch“ ist nicht im Ausgangstext verankert.
    rationale: Die drei Infinitive sind gleichgeordnet; der Zusatz kann eine zusätzliche, im Text nicht bezeichnete Folgerung suggerieren.
  - severity: medium
    issue: „in einen anderen Stand versetzen“ ist zu konkret.
    rationale: ἐξαλλοιῶσαι bezeichnet eine Veränderung; der folgende Kontext erläutert diese, verlangt aber nicht die Aussage eines ausdrücklich „anderen“ Standes.
  - severity: medium
    issue: „alexandrinische Bürgerschaft“ ist im Deutschen nicht eindeutig der individuelle Bürgerstatus.
    rationale: Es kann auch die Gesamtheit der Bürger meinen. „Bürgerrecht der Alexandriner“ gibt πολιτεία Ἀλεξανδρέων klarer wieder.
  - severity: low
    issue: Die Fußnotenmarke b steht nach dem Satzschluss.
    rationale: Sie sollte unmittelbar an der erläuterten Wendung stehen, damit ihr Bezug eindeutig ist.
