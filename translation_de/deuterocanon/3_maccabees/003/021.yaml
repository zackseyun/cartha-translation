revisions:
- from: Und da wir in diesen Dingen allen ihren Volksgenossen unsere Nachsicht[a] bekannt gemacht hatten, wollten wir sie auch aufgrund des Bündnisses und der zahllosen Angelegenheiten, die ihnen von Anfang an in gutem Glauben anvertraut worden waren, in einen anderen Stand versetzen, sie der alexandrinischen Bürgerschaft für würdig erachten und sie zu Teilhabern an dem machen, was zum Heiligtum gehört.[b]
  to: Unter diesen Umständen beschlossen wir, nachdem wir allen ihren Volksgenossen gegenüber kundgetan hatten, dass wir ihnen nichts nachtragen,[a] und angesichts des Bündnisses sowie der zahllosen Angelegenheiten, die ihnen von Anfang an in aller Aufrichtigkeit anvertraut worden waren, ihren Status zu verändern, sie des Bürgerrechts der Alexandriner für würdig zu erachten und sie zu Teilhabern an dem zu machen, was zum Heiligtum gehört.[b]
  rationale: Die Revision beseitigt den unbelegten Zusatz „auch“, gibt die Entscheidung mit den drei gleichgeordneten Infinitiven klarer wieder und präzisiert den bürgerrechtlichen Terminus. Die kultische Wendung bleibt bewusst offen. Die Fußnoten werden an die jeweils erläuterten Ausdrücke gesetzt.
