  text: And all those with her were weeping[a], and all who knew her were weeping.
translation:
  language: de
  text: Und alle, die bei ihr waren, weinten[a], ebenso alle, die sie kannten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle, die zu ihr gehörten“; die griechische Wendung kann allgemein Menschen in ihrer Begleitung oder ihrem Haus bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: weinten
  rationale: Der Imperfekt bezeichnet andauerndes Weinen bzw. Klagen; im Deutschen kann das Präteritum „weinten“ diesen Verlauf im Erzählzusammenhang natürlich ausdrücken.
- source_word: οἱ παρ᾽ αὐτῆς πάντες
  choice: alle, die bei ihr waren
  rationale: Die Wendung bezeichnet allgemein die Menschen in ihrer Nähe oder Gemeinschaft, ohne sie enger als Bedienstete oder Hausangehörige festzulegen.
- source_word: ὅσοι αὐτὴν ᾔδεισαν πάντες
  choice: alle, die sie kannten
  rationale: Die Formulierung umfasst sämtliche Personen, die mit Susanna bekannt waren; „sie kannten“ ist direkt und idiomatisch.
- source_word: πάντες ... πάντες
  choice: alle ... alle
  rationale: Die Wiederholung des griechischen πάντες wird bewahrt, um die umfassende gemeinschaftliche Trauer wiederzugeben.
