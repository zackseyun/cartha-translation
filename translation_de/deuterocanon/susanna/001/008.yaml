lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Einfache beiordnende Konjunktion, die den Satzteil mit der vorausgehenden Erzählung verbindet.
- source_word: ἐπιθυμήσαντες
  choice: begehrten
  rationale: Das Aoristpartizip von ἐπιθυμέω bezeichnet hier im Kontext ein unerlaubtes sexuelles Verlangen. „Begehrten“ bleibt knapp und nah am Griechischen, ohne die kontextuelle Wertung abzuschwächen.
- source_word: αὐτῆς
  choice: sie
  rationale: Der feminine Genitiv des Pronomens bezieht sich auf Susanna. Beim deutschen Verb „begehren“ wird die gemeinte Person idiomatisch im Akkusativ wiedergegeben.
