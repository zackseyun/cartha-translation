  yaml_path: translation/deuterocanon/susanna/001/019.yaml
  text: And she said to the servant girls[a], “Bring me oil and ointments, and shut the doors of the garden, so that I may bathe.”
translation:
  language: de
  text: 'Und sie sagte zu den Dienerinnen[a]: »Bringt mir doch Öl und Salben und schließt die Türen des Gartens, damit ich bade.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Mädchen« beziehungsweise »zu den jungen Dienerinnen«. Das griechische Wort kann Mädchen oder junge weibliche Bedienstete bezeichnen; der Zusammenhang spricht für Dienerinnen des Hauses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κορασίοις
  choice: Dienerinnen
  rationale: κοράσιον kann Mädchen oder junge weibliche Person bezeichnen; im Erzählzusammenhang sind weibliche Hausbedienstete gemeint. »Dienerinnen« gibt ihre Rolle natürlich wieder, während die mögliche Altersnuance in der Fußnote erhalten bleibt.
- source_word: Ἐνέγκατε δή μοι
  choice: Bringt mir bitte
  rationale: Der Aoristimperativ fordert zum Bringen auf; δή verleiht der Aufforderung Nachdruck oder einen bittenden Ton. »Bringt mir bitte« klingt im modernen Deutsch natürlich, ohne den Satz unnötig schroff wiederzugeben.
- source_word: ἔλαιον
  choice: Öl
  rationale: Das griechische Wort nennt allgemein Öl. Wahrscheinlich ist im Kontext Körper- oder Salböl gemeint, doch eine Festlegung auf Olivenöl wäre eine nicht ausdrücklich genannte Präzisierung.
- source_word: σμήγματα
  choice: Salben
  rationale: σμήγματα bezeichnet Mittel zum Einreiben oder zur Körperpflege, besonders im Zusammenhang mit dem Baden. »Salben« ist verständlich und lässt offen, ob die Mittel parfümiert oder kosmetisch waren.
- source_word: θύρας τοῦ παραδείσου
  choice: die Türen des Gartens
  rationale: παράδεισος bezeichnet hier einen umschlossenen Garten; θύραι sind dessen Türen beziehungsweise Zugänge. Die formnahe Wiedergabe »Türen des Gartens« bewahrt die Ausdrucksweise des griechischen Textes.
- source_word: κλείσατε
  choice: schließt
  rationale: κλείω bedeutet schließen oder zumachen. »Schließt« gibt dies genau wieder; »schließt ab« würde ein nicht ausdrücklich erwähntes Verriegeln hinzufügen.
- source_word: ὅπως λούσωμαι
  choice: damit ich baden kann
  rationale: Die mediale Form von λούω bezeichnet hier das eigene Baden. Die deutsche Zweckkonstruktion ist natürlich und erhält den Sinn des griechischen Satzes.
