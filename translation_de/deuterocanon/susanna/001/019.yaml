  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; »bitte« gibt die Nuance von δή wieder. Die Gartenanlage wird ohne zusätzliche historische Erläuterung beschrieben.
