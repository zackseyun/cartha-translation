  text: So they sent for her, and she came with her parents and her children and all her relatives.
translation:
  language: de
  text: Da ließen sie Susanna holen. Sie kam zusammen mit ihren Eltern, ihren Kindern und allen ihren Verwandten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἀπέστειλαν
  choice: Da ließen sie Susanna holen
  rationale: δέ führt die Erzählung weiter; ἀποστέλλω bezeichnet im Zusammenhang das Aussenden nach einer Person, also ihr Herbeiholen. Der im Griechischen nur durch das feminine Pronomen bezeichnete Bezug wird im Deutschen zur Klarheit als „Susanna“ ausgedrückt.
- source_word: ἦλθεν
  choice: sie kam
  rationale: Der einfache narrative Aorist wird direkt und natürlich wiedergegeben.
- source_word: γονεῖς
  choice: Eltern
  rationale: Das Substantiv bezeichnet beide Eltern zusammen, ohne sie einzeln aufzuzählen.
- source_word: τέκνα
  choice: Kinder
  rationale: „Kinder“ ist in dieser familiären Aufzählung die natürliche und genaue Entsprechung.
- source_word: πάντες οἱ συγγενεῖς
  choice: alle ihren Verwandten
  rationale: συγγενεῖς bezeichnet die Verwandtschaft allgemein; πάντες umfasst die gesamte genannte Gruppe.
