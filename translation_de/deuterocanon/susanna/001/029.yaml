base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/029.yaml
  text: And it happened on the next day[a], when the people had gathered to her husband Joakim, that the two elders came, full of their lawless intent against Susanna to put her to death, and they said before the people, “Send for Susanna daughter of Hilkiah, who is the wife of Joakim.”
translation:
  language: de
  text: 'Am folgenden Tag, als sich das Volk bei ihrem Mann Jojakim versammelt hatte, kamen die beiden Ältesten, voller gesetzloser Absicht gegen Susanna, sie zu töten. Vor dem Volk sagten sie: »Lasst Susanna holen, die Tochter Hilkijas, die Frau Jojakims.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἐπαύριον
  choice: am folgenden Tag
  rationale: Eine natürliche, gegenwärtige deutsche Zeitangabe, die die erzählerische Abfolge genau wiedergibt.
- source_word: συνῆλθεν ὁ λαὸς πρὸς τὸν ἄνδρα αὐτῆς Ἰωακείμ
  choice: als sich das Volk bei ihrem Mann Jojakim versammelt hatte
  rationale: Das Plusquamperfekt bildet die vorausliegende Versammlung ab; »bei« gibt πρός im Sinn des Zusammenkommens bei einer Person idiomatisch wieder.
- source_word: οἱ δύο πρεσβῦται
  choice: die beiden Ältesten
  rationale: Im Kontext bezeichnet πρεσβῦται anerkannte Autoritätspersonen der Gemeinschaft, nicht nur alte Männer.
- source_word: πλήρεις τῆς ἀνόμου ἐννοίας
  choice: erfüllt von ihrem gesetzlosen Vorhaben
  rationale: ἐννοία bezeichnet einen inneren Gedanken, Plan oder Vorsatz; »Vorhaben« passt zum beabsichtigten Vorgehen, während »gesetzlos« den rechtlichen und moralischen Verstoß bewahrt.
- source_word: κατὰ Σουσάννης
  choice: gegen Susanna
  rationale: κατά mit Genitiv ist hier adversativ und bezeichnet die Zielrichtung ihres Vorhabens.
- source_word: τοῦ θανατῶσαι αὐτήν
  choice: sie zu Tode zu bringen
  rationale: Der artikulierte Infinitiv drückt den Zweck des Vorhabens aus; die Formulierung wahrt den gerichtlichen Kontext.
- source_word: Ἀποστείλατε ἐπὶ Σουσάνναν
  choice: Lasst Susanna holen
  rationale: Die Wendung bedeutet, jemanden auszusenden, um Susanna herbeizuholen; dies ist im Deutschen knapp und idiomatisch.
- source_word: θυγατέρα Χελκίου
  choice: die Tochter Hilkijas
  rationale: Formale patronymische Identifikation; »Hilkija« entspricht der im deutschen Bibelgebrauch üblichen Namensform.
- source_word: ἥ ἐστιν γυνὴ Ἰωακείμ
  choice: die Frau Jojakims
  rationale: γυνή bedeutet hier eindeutig Ehefrau; die knappe Form ist im Deutschen natürlich und bewahrt die formale Identifikation.
theological_decisions:
- issue: Bedeutung von πρεσβῦται in der öffentlichen Gerichtsszene
  choice: Ältesten
  alternative: alten Männer
  rationale: Die Männer treten als anerkannte Amts- und Autoritätspersonen vor dem versammelten Volk auf. »Älteste« bewahrt diese gesellschaftliche und richterliche Funktion, ohne über den Kontext hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in drei Sätze gegliedert; die syntaktischen und inhaltlichen Beziehungen, besonders »gegen Susanna« und der Zweck »sie zu Tode zu bringen«, bleiben ausdrücklich erhalten.
