review_pass:
  verdict: approve
  source_fidelity: 'Der Entwurf gibt alle Elemente des griechischen Textes zuverlässig wieder: δέ als erzählerische Gegenüberstellung („Doch“), die beiden πρεσβύτεροι als „Älteste“, die Redeeinleitung, das hervorgehobene „Wir“, die im Imperfekt geschilderte Bewegung im Garten sowie die Zugehörigkeit zum Ehemann Susannas. Die offen bleibende direkte Rede entspricht dem versübergreifend fortgesetzten griechischen Satz.'
  naturalness: '„Doch die beiden Ältesten sagten: ‚Wir gingen im Garten ihres Mannes umher,‘“ ist würdiges, modernes Standarddeutsch. Das Präteritum „gingen … umher“ ist in erzählendem Deutsch idiomatisch und kann die durative griechische Imperfektform angemessen wiedergeben. Die nicht geschlossene Anführung ist hier sachgerecht, weil die Rede im folgenden Vers weitergeht.'
  terminology: „Älteste“ bewahrt die soziale bzw. gerichtliche Rolle von πρεσβύτεροι, ohne sie auf bloßes Alter zu reduzieren. „Garten“ ist für παράδεισος im gegebenen Kontext treffend; die Fußnote nennt die möglichen Bedeutungsnuancen Obstgarten und umfriedete Anlage, ohne den Text unnötig festzulegen. „Ihres Mannes“ gibt τοῦ ἀνδρὸς αὐτῆς korrekt wieder.
