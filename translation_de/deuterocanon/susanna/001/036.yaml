base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/036.yaml
  text: But the two elders said[a], “We were walking in the garden of her husband,”
translation:
  language: de
  text: 'Doch die beiden Ältesten sagten: „Wir gingen im Garten ihres Mannes umher[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort παράδεισος kann auch einen Obstgarten oder eine umfriedete Parkanlage bezeichnen; hier ist der private Garten beim Haus ihres Mannes gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ δύο πρεσβύτεροι
  choice: Doch die beiden Ältesten
  rationale: „Älteste“ bewahrt die gesellschaftliche und richterliche Funktion der Männer; δέ markiert mit „Doch“ den Übergang zu ihrer gegensätzlichen Aussage.
- source_word: εἶπαν
  choice: sagten
  rationale: Die schlichte Redeeinleitung entspricht dem griechischen Verb und klingt im Deutschen natürlich.
- source_word: Ἡμεῖς
  choice: Wir
  rationale: Das ausdrücklich gesetzte Pronomen eröffnet ihre direkte Aussage; eine zusätzliche Verstärkung wie „wir selbst“ wäre im Deutschen unnötig.
- source_word: περιεπατοῦμεν
  choice: gingen … umher
  rationale: Das Imperfekt bezeichnet eine andauernde Handlung in der Vergangenheit. „Gingen umher“ gibt zudem die Vorstellung des Sichbewegens innerhalb des Gartens natürlich wieder, ohne den Zusatzton eines gemütlichen Spaziergangs einzutragen.
- source_word: ἐν τῷ παραδείσῳ
  choice: im Garten
  rationale: παράδεισος bezeichnet hier die umfriedete, kultivierte Gartenanlage eines wohlhabenden Haushalts; „Paradies“ wäre in diesem Erzählzusammenhang irreführend.
- source_word: τοῦ ἀνδρὸς αὐτῆς
  choice: ihres Mannes
  rationale: ἀνήρ bezeichnet in dieser Genitivverbindung ihren Ehemann; zugleich bleibt die knappe Besitzangabe des Griechischen erhalten.
