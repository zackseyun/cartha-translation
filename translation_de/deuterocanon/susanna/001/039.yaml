  text: And when we came near, we saw her; but the young man fled, being covered.
translation:
  language: de
  text: Als wir näher kamen, erkannten wir sie; der junge Mann aber floh verhüllt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: als wir näher kamen
  rationale: Das Partizip bezeichnet das Herantreten; die temporale Wiedergabe ist im Deutschen natürlich und wahrt die Abfolge.
- source_word: ἐπέγνωμεν
  choice: erkannten wir sie
  rationale: ἐπιγινώσκω bedeutet hier, dass die Sprecher die Frau identifiziert beziehungsweise wiedererkannt haben; „erkannten“ bildet dies genauer ab als das allgemeinere „sahen“.
- source_word: νεανίσκος
  choice: der junge Mann
  rationale: Eine geläufige und sachlich passende Wiedergabe für einen jungen männlichen Erwachsenen.
- source_word: συγκεκαλυμμένος
  choice: verhüllt
  rationale: Das passive Perfektpartizip besagt, dass der junge Mann bedeckt oder verhüllt war. Die knappe Wiedergabe bewahrt die Unbestimmtheit darüber, was genau verhüllt war und womit.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die adversative Stellung von ὁ δὲ νεανίσκος wird durch „der junge Mann aber“ bewahrt; die knappe Formulierung vermeidet nicht im Griechischen enthaltene Zusätze wie „Gesicht“ oder „Mantel“.
