review_pass:
  verdict: revise
  source_fidelity: 'Der Haupttext gibt die Abfolge und den Sinn des Griechischen zuverlässig wieder: Rückkehr, gegenseitiges Befragen nach dem Grund, Eingeständnis ihres Begehrens sowie die gemeinsame Planung eines Zeitpunkts, zu dem sie Susanna allein antreffen könnten. „Verlangen“ wahrt die lexikalische Weite von ἐπιθυμία, während der Kontext dessen sexuelle und unerlaubte Ausrichtung erkennen lässt.'
  naturalness: „Sie gestanden sich ihr Verlangen“ ist im Deutschen potenziell als Eingeständnis gegenüber sich selbst lesbar. „Sie gestanden einander ihr Verlangen“ stellt die im Kontext und in ἀλλήλους ausgedrückte Gegenseitigkeit klar. „Einen Zeitpunkt“ ist hier idiomatischer und präziser als „eine Zeit“.
  terminology: Die Bezeichnung „Verlangen“ ist angemessen und nicht überinterpretierend. Die Fußnote kann als mögliche explizitere Wiedergabe „Begierde“ nennen. Die alternative Erklärung zu ἐπὶ τὸ αὐτό sollte sprachlich klarer als alternative Betonung des Zusammenkommens formuliert werden.
