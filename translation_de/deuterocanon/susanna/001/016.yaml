  to: Da kehrten sie um und kamen wieder an denselben Ort.[a] Als sie einander nach dem Grund fragten, gestanden sie einander ihr Verlangen[b]; dann verabredeten sie gemeinsam einen Zeitpunkt, zu dem sie sie allein antreffen könnten.
