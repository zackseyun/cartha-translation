  - severity: low
    issue: „eine Zeit“ ist an dieser Stelle weniger idiomatisch
    rationale: καιρόν bezeichnet im Kontext einen vereinbarten günstigen Zeitpunkt; „einen Zeitpunkt“ ist im modernen Standarddeutsch klar und natürlich.
