base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/016.yaml
  text: And after turning back[a], they came to the same place, and when they questioned one another about the reason, they confessed their desire[b]; then together they arranged a time when they would be able to find her alone.
translation:
  language: de
  text: Da kehrten sie um und kamen wieder an denselben Ort.[a] Als sie einander nach dem Grund fragten, gestanden sie einander ihr Verlangen[b]; dann verabredeten sie gemeinsam einen Zeitpunkt, zu dem sie sie allein antreffen könnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und kamen zusammen“. Die griechische Wendung kann statt des Bezugs auf denselben Ort auch das Zusammenkommen betonen.'
    reason: lexical_alternative
  - marker: b
    text: Im Zusammenhang ist ein unerlaubtes sexuelles Verlangen gemeint; daher wäre auch „ihre Begierde“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακάμψαντες
  choice: Da kehrten sie um
  rationale: Das Partizip bezeichnet eine Umkehr beziehungsweise Rückkehr. Die finite Form ergibt im Deutschen einen natürlichen Erzählfluss.
- source_word: ἐπὶ τὸ αὐτό
  choice: wieder an denselben Ort
  rationale: Im Zusammenhang bezeichnet die Wendung am ehesten das erneute Zusammentreffen am selben Ort; „wieder“ verdeutlicht die durch ἀνακάμψαντες angezeigte Rückkehr.
- source_word: ἀνετάζοντες ἀλλήλους τὴν αἰτίαν
  choice: Als sie einander nach dem Grund fragten
  rationale: ἀνετάζω kann ein eingehendes Befragen bezeichnen, doch hier ist keine förmliche Vernehmung gemeint. Die gegenseitige Form und αἰτία werden idiomatisch wiedergegeben.
- source_word: ὡμολόγησαν
  choice: gestanden sie sich
  rationale: Das Verb bezeichnet ein offenes Eingestehen. Das reflexive „sich“ macht deutlich, dass beide einander ihr Motiv offenlegten.
- source_word: τὴν ἐπιθυμίαν αὐτῶν
  choice: ihr Verlangen
  rationale: ἐπιθυμία kann allgemein Begehren oder Verlangen bedeuten; der Kontext macht dessen unerlaubt sexuelle Ausrichtung deutlich, ohne dass diese im Haupttext stärker als im Griechischen festgelegt wird.
- source_word: κοινῇ συνετάξαντο
  choice: verabredeten sie gemeinsam
  rationale: κοινῇ betont das gemeinsame Vorgehen, während das mediale συνετάξαντο eine von ihnen selbst getroffene Absprache ausdrückt.
- source_word: καιρόν
  choice: eine Zeit
  rationale: καιρός bezeichnet hier einen passenden beziehungsweise festgelegten Zeitpunkt. „Eine Zeit“ bewahrt die Grundbedeutung, während der Zusammenhang die günstige Gelegenheit erkennen lässt.
- source_word: ὅτε αὐτὴν δυνήσονται εὑρεῖν μόνην
  choice: zu der sie sie allein antreffen könnten
  rationale: Die indirekte Zukunftsperspektive wird im deutschen Vergangenheitskontext natürlich mit „könnten“ ausgedrückt. „Antreffen“ gibt εὑρεῖν in dieser konkreten Situation idiomatisch wieder.
