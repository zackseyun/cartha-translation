  text: And as she was being led away to be put to death, God stirred up the holy spirit of a younger boy whose name was Daniel.
translation:
  language: de
  text: Als sie nun weggeführt wurde, um getötet zu werden, erweckte Gott den heiligen Geist eines jüngeren Knaben namens Daniel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαγομένης αὐτῆς ἀπολέσθαι
  choice: als sie weggeführt wurde, um getötet zu werden
  rationale: Gibt die passive Abführung und den tödlichen Zweck der griechischen Infinitivkonstruktion klar und natürlich wieder.
- source_word: ἐξήγειρεν
  choice: erweckte
  rationale: Bewahrt das Bild eines von Gott hervorgerufenen inneren Aufstehens bzw. Tätigwerdens.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: den heiligen Geist
  rationale: Folgt der bestimmten griechischen Wortgruppe eng, ohne ausdrücklich zu entscheiden, ob damit der Heilige Geist als göttliche Person oder Daniels von Gott geheiligter bzw. ergriffener Geist bezeichnet ist.
- source_word: παιδαρίου νεωτέρου
  choice: eines jüngeren Knaben
  rationale: Gibt sowohl die Jugendbezeichnung als auch den Komparativ νεωτέρου wieder; „jüngeren“ bleibt ohne ausdrücklich genannten Vergleichspunkt stehen.
- source_word: ᾧ ὄνομα Δανιήλ
  choice: namens Daniel
  rationale: Natürliche, knappe deutsche Wiedergabe der Namensformel.
theological_decisions:
- issue: Bedeutung von τὸ πνεῦμα τὸ ἅγιον παιδαρίου
  choice: „den heiligen Geist eines jüngeren Knaben“
  alternative: „den Heiligen Geist in einem jüngeren Knaben“ oder „den heiligen Geist des jungen Daniel“
  rationale: Die gewählte Fassung bewahrt die grammatische Zuordnung und die theologische Mehrdeutigkeit des Griechischen, statt eine personale oder anthropologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig, während der auffällige Komparativ „jüngeren“ und die Mehrdeutigkeit von „heiliger Geist“ bewusst erhalten bleiben.
