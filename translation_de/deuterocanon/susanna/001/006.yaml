  text: and legal cases came to them from other cities[a].
translation:
  language: de
  text: Und aus anderen Städten kamen Rechtssachen zu ihnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und aus anderen Städten kamen Urteile zu ihnen.“ Das griechische Wort kann richterliche Entscheidungen oder Rechtssachen bezeichnen, die zur Entscheidung vorgelegt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο
  choice: kamen
  rationale: Der Imperfekt bezeichnet hier einen wiederholten bzw. andauernden Vorgang in der Vergangenheit. Im fortlaufenden deutschen Erzählstil gibt „kamen“ dies natürlich wieder, ohne die Verlaufsbedeutung auszuschließen.
- source_word: κρίσεις
  choice: Rechtssachen
  rationale: Das Wort kann sowohl richterliche Entscheidungen als auch die zur Entscheidung vorgelegten Fälle bezeichnen. Im Zusammenhang sind gerichtliche Angelegenheiten gemeint; „Rechtssachen“ wahrt den forensischen Sinn und bleibt gegenüber der genaueren Art des Vorgangs zurückhaltend.
- source_word: ἐξ ἄλλων πόλεων
  choice: aus anderen Städten
  rationale: Die Präposition ἐκ bezeichnet die Herkunft; πόλεις wird regulär mit „Städte“ wiedergegeben.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung zu den genannten Personen hin. „Zu ihnen“ folgt diesem Ausdruck enger als das ebenfalls mögliche, stärker deutende „vor sie“.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. „Rechtssachen“ macht den gerichtlichen Zusammenhang verständlich, ohne die lexikalische Mehrdeutigkeit von κρίσεις im Haupttext vollständig aufzulösen; die Alternative wird in der Fußnote bewahrt.
