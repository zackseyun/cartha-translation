  source_fidelity: 'Die Übersetzung gibt alle Bestandteile des griechischen Textes zutreffend wieder: καί mit „Und“, den imperfektiven Vergangenheitsbezug von ἤρχοντο idiomatisch mit „kamen“, κρίσεις im gerichtlichen Sinn mit „Rechtssachen“, ἐξ ἄλλων πόλεων mit „aus anderen Städten“ und πρὸς αὐτούς mit „zu ihnen“. Die im Imperfekt mögliche wiederholte bzw. fortlaufende Nuance ist im deutschen Erzählpräteritum ausreichend gewahrt.'
