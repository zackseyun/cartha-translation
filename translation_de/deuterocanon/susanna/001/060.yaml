base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/060.yaml
  text: And the whole assembly cried out with a loud voice[a], and they blessed God, who saves those who hope in him.
translation:
  language: de
  text: Und die ganze Versammlung rief mit lauter Stimme, und sie priesen Gott, der diejenigen rettet, die auf ihn hoffen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ihm vertrauen«. Das griechische Verb bedeutet in erster Linie »hoffen«, kann im biblischen Sprachgebrauch aber auch vertrauendes Sichverlassen auf Gott einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: rief
  rationale: Das Verb bezeichnet einen lauten Ausruf. Zusammen mit »mit lauter Stimme« gibt »rief« die Aussage natürlich wieder, ohne die Lautstärke doppelt auszudrücken.
- source_word: πᾶσα ἡ συναγωγή
  choice: die ganze Versammlung
  rationale: συναγωγή bezeichnet hier die versammelte Gemeinschaft und nicht das später so bezeichnete Synagogengebäude oder eine entsprechende Institution.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die konkrete griechische Wendung wird in natürlichem, würdigem Deutsch bewahrt.
- source_word: εὐλόγησαν
  choice: sie priesen
  rationale: εὐλογέω bedeutet wörtlich »segnen«; wenn Menschen Gott zum Gegenstand haben, bezeichnet es das lobende Preisen Gottes. »Sie priesen Gott« ist im modernen Deutschen klarer als »sie segneten Gott«.
- source_word: τῷ σώζοντι
  choice: der alle rettet
  rationale: Das substantivisch-attributive Präsenspartizip beschreibt Gott als den, der rettet. »Alle« nimmt die nachfolgende Gruppe τοὺς idiomatisch auf, ohne eine über den Satz hinausgehende Aussage zu machen.
- source_word: τοὺς ἐλπίζοντας ἐπ’ αὐτόν
  choice: die auf ihn hoffen
  rationale: ἐλπίζω gehört vorrangig zum Bedeutungsfeld des Hoffens; die Präposition richtet diese Hoffnung auf Gott. Die mögliche Überschneidung mit vertrauendem Sichverlassen wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von εὐλόγησαν τῷ θεῷ
  choice: sie priesen Gott
  alternative: sie segneten Gott
  rationale: Die wörtliche Alternative bewahrt zwar die Wortform, klingt im heutigen Deutschen jedoch missverständlich. »Priesen« gibt den Sinn des Segnens Gottes als lobendes Reden wieder, ohne eine besondere konfessionelle Deutung einzutragen.
- issue: Wiedergabe von ἐλπίζοντας
  choice: die auf ihn hoffen
  alternative: die ihm vertrauen
  rationale: Der griechische Text verwendet ausdrücklich das Wortfeld »hoffen«. Deshalb bleibt dieses im Haupttext erhalten; die im biblischen Sprachgebrauch mögliche Nähe zum Vertrauen wird als Alternative ausgewiesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem griechischen Ablauf, während »priesen Gott« die griechische Segensformel für heutige Leser idiomatisch erschließt. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung »auf ihn hoffen«.
