revisions:
- from: Da rief die ganze Versammlung mit lauter Stimme, und sie priesen Gott, der alle rettet, die auf ihn hoffen.[a]
  to: Und die ganze Versammlung rief mit lauter Stimme, und sie priesen Gott, der diejenigen rettet, die auf ihn hoffen[a].
  rationale: Die Revision stellt den neutralen griechischen Satzanschluss mit »Und« wieder her, präzisiert die Bezugsgruppe von τοὺς ἐλπίζοντας und positioniert den Fußnotenanker unmittelbar bei der erläuterten Wendung. Bedeutung, Register und die im Entwurf gewählte idiomatische Wiedergabe von εὐλογέω als »priesen« bleiben erhalten.
