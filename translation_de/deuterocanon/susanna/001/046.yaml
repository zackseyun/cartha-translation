  language: de
  text: 'Und er rief mit lauter Stimme: „Ich bin unschuldig am Blut dieser Frau.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησεν
  choice: rief
  rationale: Das Verb bezeichnet ein lautes Rufen oder Schreien. Zusammen mit „mit lauter Stimme“ gibt „rief“ die Aussage natürlich wieder, ohne die Lautstärke doppelt auszudrücken.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die instrumentale Dativwendung wird eng am Griechischen und zugleich idiomatisch wiedergegeben.
- source_word: Ἀθῷος
  choice: unschuldig
  rationale: Das Adjektiv bezeichnet Freiheit von Schuld oder Haftung; „unschuldig“ bewahrt hier den rechtlich-moralischen Sinn.
- source_word: ἀπὸ τοῦ αἵματος ταύτης
  choice: am Blut dieser Frau
  rationale: Die Wendung ist biblische Blutschuldsprache und erklärt den Sprecher für nicht verantwortlich für den Tod der mit dem femininen Demonstrativ bezeichneten Frau.
theological_decisions:
- issue: Blutschuld-Idiom
  choice: Ich bin unschuldig am Blut dieser Frau
  alternative: Ich bin frei vom Blut dieser Frau
  rationale: Die gewählte Fassung vermittelt die Freiheit von Verantwortung für ihren Tod in natürlichem modernem Deutsch, ohne die Aussage auf kultische Reinheit zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und feierlich; die rechtlich-moralische Blutschuldsprache wird ohne erläuternde Erweiterung im Vers bewahrt.
