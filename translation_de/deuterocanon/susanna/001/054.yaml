base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/054.yaml
  text: 'Now then[a], if you saw this woman, tell us: under what tree did you see them talking with each other? And he said, “Under a mastic tree.”'
translation:
  language: de
  text: 'Nun denn, wenn du diese Frau wirklich gesehen hast, sag: Unter welchem Baum hast du sie miteinander reden sehen? Er sagte: »Unter einem Mastixbaum.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Der griechische Ausdruck bezeichnet den Mastix- oder Lentiskenbaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun denn
  rationale: Gibt den folgernden Übergang und den unmittelbaren Nachdruck natürlich und würdevoll wieder.
- source_word: ταύτην
  choice: diese Frau
  rationale: Das griechische Demonstrativpronomen meint im Kontext Susanna; die ausdrückliche Wiedergabe als »diese Frau« ist im Deutschen klar.
- source_word: εἴπερ εἶδες
  choice: wenn du ... wirklich gesehen hast
  rationale: Bewahrt die prüfende, nachdrückliche Kraft von εἴπερ, ohne die Bedingung als Tatsache festzuschreiben.
- source_word: εἰπὸν
  choice: sag
  rationale: Entspricht dem knappen singularischen Imperativ; ein nicht ausdrücklich vorhandenes Objekt wie »uns« wird vermieden.
- source_word: Ὑπὸ τί δένδρον
  choice: Unter welchem Baum
  rationale: Direkte und idiomatische Wiedergabe der Ortsfrage.
- source_word: ἴδες
  choice: hast du gesehen
  rationale: Natürliches deutsches Perfekt in einer direkten Frage.
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: wie die beiden miteinander verkehrten
  rationale: ὁμιλέω kann hier über bloßes Reden hinaus den behaupteten intimen Umgang bezeichnen; »verkehrten« bewahrt diese kontextuelle Mehrdeutigkeit.
- source_word: σχῖνον
  choice: Mastixbaum
  rationale: Bezeichnet den Mastix- oder Lentiskenbaum und erhält die konkrete Baumart, die für das folgende Wortspiel wichtig ist.
