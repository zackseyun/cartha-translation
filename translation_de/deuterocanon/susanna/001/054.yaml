  source_fidelity: Die Grundstruktur und der Nachdruck von νῦν οὖν sowie εἴπερ sind zutreffend wiedergegeben. Für ὁμιλοῦντας ἀλλήλοις ist jedoch »miteinander verkehrten« im heutigen Deutsch zu stark sexuell festgelegt und bildet die primäre Bedeutung »miteinander reden/sprechen« nicht angemessen ab.
  naturalness: Die revidierte Formulierung mit »sie miteinander reden sehen« ist idiomatisches modernes Standarddeutsch und behält die knappe, prüfende Verhörsituation bei.
