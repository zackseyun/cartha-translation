base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/009.yaml
  text: They twisted their minds and turned away their eyes so as not to look to heaven or remember righteous judgments[a][b].
translation:
  language: de
  text: Sie verdarben ihren Verstand[a] und wandten ihre Augen ab, damit sie nicht zum Himmel blickten und sich nicht an gerechte Urteile erinnerten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie verkehrten ihr Denken.« Das griechische Verb kann sowohl moralisches Verderben als auch Entstellung oder Verkehrung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Gerechte Urteile« kann auch mit »gerechte Rechtssprüche« oder »gerechte Ordnungen« wiedergegeben werden. Gemeint sind wahrscheinlich Gottes gerechte Entscheidungen oder Maßstäbe; im Griechischen steht jedoch kein ausdrückliches Besitzwort.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέστρεψαν
  choice: verdarben
  rationale: Das Verb bezeichnet hier eine moralische Verkehrung oder Entstellung. »Verdarben« gibt die innere moralische Korruption natürlich wieder, ohne die Bildhaftigkeit durch eine allzu technische Formulierung zu ersetzen.
- source_word: τὸν νοῦν αὐτῶν
  choice: ihren Sinn
  rationale: νοῦς meint das innere Denk- und Wahrnehmungsvermögen einschließlich seiner moralischen Ausrichtung. »Sinn« bewahrt diese Breite besser als das stärker intellektuell eingeengte »Verstand«.
- source_word: ἐξέκλιναν τοὺς ὀφθαλμοὺς αὐτῶν
  choice: wandten ihre Augen ab
  rationale: Die Formulierung erhält das konkrete Bild einer bewussten Abwendung und entspricht der Bedeutung von ἐκκλίνω, »weg- oder abwenden«.
- source_word: τοῦ μὴ βλέπειν εἰς τὸν οὐρανὸν
  choice: damit sie nicht zum Himmel blickten
  rationale: Der artikulierte Infinitiv mit μή drückt hier Zweck oder beabsichtigte Folge aus. »Damit« macht die absichtliche Vermeidung im Deutschen klar.
- source_word: μηδὲ μνημονεύειν
  choice: und sich nicht … erinnerten
  rationale: μνημονεύω bedeutet, sich zu erinnern oder etwas im Gedächtnis zu behalten. Die reflexive deutsche Wendung ist in diesem Satz natürlich und schließt sich an die Zweckkonstruktion an.
- source_word: κριμάτων δικαίων
  choice: gerechte Urteile
  rationale: κρίματα kann Urteile, richterliche Entscheidungen oder Rechtssatzungen bezeichnen; δίκαια kennzeichnet sie als gerecht. »Gerechte Urteile« wahrt die rechtliche und moralische Bedeutung, ohne einen nicht ausdrücklich genannten Besitzer hinzuzufügen.
theological_decisions:
- issue: Bezug von »Himmel« und »gerechte Urteile«
  choice: Die implizite Ausrichtung auf Gott bleibt erkennbar, doch weder »Gott« noch ein göttliches Possessiv wird ergänzt.
  alternative: »damit sie nicht zu Gott im Himmel blickten und sich nicht an seine gerechten Urteile erinnerten«
  rationale: Der griechische Text nennt den Himmel und gerechte Urteile, bezeichnet Gott aber nicht ausdrücklich als deren Urheber oder Besitzer. Die Übersetzung bewahrt diese sprachliche Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Augenmetapher und die absichtliche Abwendung bleiben erhalten; zugleich wird der nicht ausdrücklich genannte Gottesbezug nicht in den Haupttext eingefügt.
