  text: And as we were going around the enclosed garden, we saw this woman lying with a man, and standing there we watched them talking with one another,
translation:
  language: de
  text: Und als wir im Garten umhergingen, sahen wir diese Frau mit einem Mann ruhen. Wir blieben stehen und beobachteten, wie sie miteinander redeten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυκλοῦντες τὸ στάδιον
  choice: als wir um den Garten herumgingen
  rationale: κυκλόω bezeichnet das Umher- bzw. Herumgehen. στάδιον kann einen abgemessenen oder umgrenzten Platz bezeichnen; im unmittelbaren Erzählzusammenhang ist der Garten gemeint. Die Wiedergabe vermeidet das im Deutschen hier missverständliche „Stadion“.
- source_word: ἀναπαυομένην μετὰ ἀνδρός
  choice: bei einem Mann ruhen
  rationale: ἀναπαύομαι bedeutet zunächst ruhen oder sich ausruhen; μετά mit Genitiv bezeichnet Begleitung. Die Formulierung bewahrt die mögliche Zweideutigkeit, ohne bereits einen sexuellen Vorgang zu behaupten.
- source_word: στάντες ἐθεωροῦμεν
  choice: Wir blieben stehen und beobachteten
  rationale: Der Aorist στάντες beschreibt das Stehenbleiben, während das Imperfekt ἐθεωροῦμεν ein andauerndes, aufmerksames Beobachten ausdrückt.
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: wie sie miteinander redeten
  rationale: ὁμιλέω bedeutet hier miteinander sprechen bzw. verkehren; der Kontext nennt ausdrücklich eine gegenseitige Handlung. „Redeten“ gibt den naheliegenden Sinn natürlich wieder, ohne darüber hinauszugehen.
theological_decisions:
- issue: Art der behaupteten Begegnung
  choice: „bei einem Mann ruhen“ und „miteinander redeten“
  alternative: „mit einem Mann liegen“ oder eine ausdrücklich sexuelle Formulierung
  rationale: Der griechische Wortlaut beschreibt Ruhe und Gespräch, während die Ankläger daraus einen Vorwurf konstruieren. Die Übersetzung wahrt diese erzählerische Spannung und verschärft ihre Aussage nicht.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Erzählprosa. Der Satz wurde für natürliches Deutsch in zwei Sätze gegliedert; die zeitliche Abfolge und der Aspekt der griechischen Verbformen bleiben erkennbar.
