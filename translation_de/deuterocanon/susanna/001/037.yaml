  naturalness: Die Zweiteilung in zwei Sätze ist natürliches modernes Deutsch. Mit „im Garten umhergingen“ und „mit einem Mann ruhen“ bleibt der Text flüssig, klar und in würdiger Erzählprosa.
  terminology: „ruhen“ entspricht ἀναπαυομένην und wahrt gegenüber dem englischen audit-trail-Text („lying“) die im griechischen Wortlaut vorhandene Zurückhaltung. „miteinander redeten“ ist eine natürliche Entsprechung von ὁμιλοῦντας ἀλλήλοις.
