base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/041.yaml
  text: And the whole assembly believed them[a], since they were elders and judges of the people.
translation:
  language: de
  text: Und die ganze Versammlung[a] glaubte ihnen, weil sie Älteste und Richter des Volkes waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ganze Gemeinde«. Das griechische Wort bezeichnet die versammelte Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστευσεν
  choice: glaubte ihnen
  rationale: Mit dem Dativ αὐτοῖς bezeichnet πιστεύω hier, dass die Versammlung die Aussage der Männer für wahr hielt. »Glaubte ihnen« ist im Deutschen direkt und kontextgemäß.
- source_word: ἡ συναγωγὴ πᾶσα
  choice: die ganze Versammlung
  rationale: συναγωγή bezeichnet hier die versammelte Gemeinschaft, nicht ein Synagogengebäude. »Die ganze Versammlung« gibt sowohl den gemeinschaftlichen als auch den umfassenden Sinn wieder.
- source_word: ὡς
  choice: weil
  rationale: 'ὡς führt hier den Grund an, aus dem die Versammlung den Männern glaubte: Sie galten als Älteste und Richter. »Weil« gibt diesen kausalen Zusammenhang natürlich wieder.'
- source_word: πρεσβυτέρων
  choice: Älteste
  rationale: Der Ausdruck bezeichnet anerkannte Leiter der Gemeinschaft und nicht lediglich ältere Männer. »Älteste« bewahrt diese soziale und amtliche Funktion.
- source_word: κριτῶν
  choice: Richter
  rationale: κριτής bezeichnet hier Männer mit richterlicher Autorität im Volk. »Richter« ist die klare und übliche deutsche Entsprechung.
- source_word: τοῦ λαοῦ
  choice: des Volkes
  rationale: λαός bezeichnet hier das Volk beziehungsweise die Gemeinschaft. »Des Volkes« entspricht der knappen griechischen Formulierung.
theological_decisions:
- issue: Wiedergabe von συναγωγή in einer vorchristlichen jüdischen Erzählung
  choice: Versammlung
  alternative: Gemeinde; Synagoge
  rationale: Gemeint ist die zusammengekommene Gemeinschaft. »Versammlung« vermeidet sowohl die mögliche christlich-kirchliche Färbung von »Gemeinde« als auch das mögliche Missverständnis von »Synagoge« als Gebäude oder spätere Institution.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, klingt aber natürlich; die Amtsbezeichnungen »Älteste« und »Richter« werden beibehalten.
