base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/005.yaml
  text: 'And in that year two elders from the people were appointed as judges[a], concerning whom the Master had spoken: “Lawlessness came out from Babylon, from elders who were judges[b], who seemed to govern the people.”'
translation:
  language: de
  text: 'Und in jenem Jahr wurden zwei Älteste aus dem Volk zu Richtern bestellt. Über sie hatte der Gebieter[a] gesagt: »Gesetzlosigkeit ging von Babylon aus, von Ältesten, die Richter waren und als Lenker des Volkes galten.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Herr« beziehungsweise »der Herrscher«. Das griechische Wort lautet δεσπότης, nicht das häufigere κύριος.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Schluss ist im Griechischen knapp gefasst. Statt »als Lenker des Volkes galten« kann auch übersetzt werden: »das Volk zu lenken schienen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεδείχθησαν
  choice: wurden … bestellt
  rationale: Mit dem Prädikatsnomen κριταί bezeichnet das Verb hier die öffentliche Einsetzung in ein Amt, nicht bloß ein Sichtbarwerden.
- source_word: πρεσβύτεροι
  choice: Älteste
  rationale: Der Zusammenhang spricht für anerkannte Gemeindeleiter, die zugleich ein Richteramt ausübten, nicht lediglich für ältere Männer.
- source_word: κριταί
  choice: Richter
  rationale: Die ausdrückliche richterliche Funktion wird direkt und allgemein verständlich wiedergegeben.
- source_word: δεσπότης
  choice: der Gebieter
  rationale: „Gebieter“ bewahrt die Unterscheidung des griechischen δεσπότης vom häufigeren κύριος und eignet sich zugleich als Gottesbezeichnung.
- source_word: ἀνομία
  choice: Gesetzlosigkeit
  rationale: Die Wiedergabe bleibt nahe am griechischen Ausdruck und passt zur Verletzung von Recht und Ordnung durch korrupte Richter.
- source_word: ἐξῆλθεν ἐκ Βαβυλῶνος
  choice: ging von Babylon aus
  rationale: Die Formulierung bewahrt das Bild eines Unrechts, das seinen Ausgang in Babylon nimmt, und klingt im Deutschen natürlich.
- source_word: οἱ ἐδόκουν κυβερνᾷν τὸν λαόν
  choice: die als Lenker des Volkes galten
  rationale: Diese Wiedergabe erhält die mögliche Bedeutung „dafür gehalten wurden“ und lässt zugleich die ironische Distanz gegenüber ihrem vermeintlich ordnungsgemäßen Leitungsamt erkennen.
theological_decisions:
- issue: Wiedergabe von δεσπότης als Gottesbezeichnung
  choice: der Gebieter
  alternative: der Herr; der Herrscher
  rationale: Da die Quelle δεσπότης statt κύριος verwendet, wird die lexikalische Unterscheidung nicht eingeebnet. „Gebieter“ ist würdevoll und lässt den göttlichen Bezug offen erkennbar.
- issue: Mehrdeutigkeit von ἐδόκουν
  choice: als Lenker des Volkes galten
  alternative: das Volk zu lenken schienen
  rationale: Das griechische Verb kann sowohl einen äußeren Anschein als auch die Einschätzung anderer bezeichnen. Der Haupttext wählt eine natürliche Formulierung; die Fußnote bewahrt die andere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu Richtern bestellt“ bezeichnet klar die Amtseinsetzung; „Lenker des Volkes“ wahrt das Leitungsbild von κυβερνᾶν, ohne eine moderne staatspolitische Amtsbezeichnung einzutragen.
