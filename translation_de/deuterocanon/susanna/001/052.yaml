base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/052.yaml
  text: But when they had been separated[a], one from the other, he called one of them and said to him, “You who have grown old in evil days[b], now the sins that you were doing before have come upon you.”
translation:
  language: de
  text: 'Als sie aber voneinander getrennt worden waren, rief er einen von ihnen und sagte zu ihm: „Du, der du in bösen Tagen alt geworden bist[a]: Nun sind deine Sünden, die du früher[b] begangen hast, über dich gekommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und zugleich knapper: „Du in bösen Tagen alt Gewordener.“ Die griechische Anrede ist gedrängt und lässt offen, ob die bösen Tage vor allem sein eigenes böses Leben oder seine Zeit kennzeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hier überlieferte Versauszug endet mit dem Artikel τὸ. Dieser gehört offenbar zu einer über die Versgrenze reichenden Wendung, wahrscheinlich τὸ πρότερον („früher“, „vormals“).
    reason: textual_variant
lexical_decisions:
- source_word: διεχωρίσθησαν
  choice: voneinander getrennt worden waren
  rationale: Der Aorist Passiv bezeichnet ihre Trennung; das Plusquamperfekt fügt sich natürlich in den mit ὡς δέ eröffneten zeitlichen Rückblick ein.
- source_word: εἷς ἀπὸ τοῦ ἑνός
  choice: voneinander
  rationale: Die Wendung meint, dass die beiden Männer für die getrennte Befragung einer vom anderen abgesondert wurden.
- source_word: ἐκάλεσεν τὸν ἕνα αὐτῶν
  choice: rief er einen von ihnen
  rationale: καλέω bedeutet hier schlicht, eine der beiden Personen zu sich zu rufen; „vorladen“ wäre stärker juristisch ausgedeutet.
- source_word: Πεπαιλαιωμένε ἡμερῶν κακῶν
  choice: Du, der du in bösen Tagen alt geworden bist
  rationale: Die partizipiale Anrede und der ausdrücklich belegte Genitiv ἡμερῶν κακῶν werden bewahrt. Die Formulierung lässt offen, ob vor allem das böse Leben des Mannes oder die von Bösem geprägten Tage betont werden.
- source_word: νῦν ἥκασιν αἱ ἁμαρτίαι σου
  choice: Nun sind deine Sünden … über dich gekommen
  rationale: ἥκασιν bezeichnet ein eingetretenes Kommen oder Eintreffen. „Über dich gekommen“ erhält das Gerichtsbild, ohne es umgangssprachlich als „eingeholt“ festzulegen.
- source_word: ἃς ἐποίεις
  choice: die du … begangen hast
  rationale: Bei Sünden ist „begehen“ im Deutschen idiomatischer als das wörtliche „tun“; der Zusammenhang mit früherem, wiederholtem Handeln bleibt erhalten.
- source_word: τὸ
  choice: früher
  rationale: Der vorliegende Versauszug bricht bei τὸ ab; offenbar setzt sich die adverbiale Wendung τὸ πρότερον über die Versgrenze hinweg fort. „Früher“ gibt diesen wahrscheinlichen Sinn knapp wieder und wird textkritisch erläutert.
theological_decisions:
- issue: Moralische Schärfe der Anrede Daniels
  choice: Die Anrede bezeichnet ein Altwerden „in bösen Tagen“ und steht deutlich im Dienst einer richterlichen Zurechtweisung.
  alternative: Eine neutralere Wiedergabe wie „alter Mann aus bösen Tagen“ oder eine stärker personbezogene Deutung wie „du im Bösen alt Gewordener“.
  rationale: Der gerichtliche Zusammenhang verlangt eine scharfe Anrede, doch der Genitiv ἡμερῶν κακῶν soll nicht so vereindeutigt werden, als bezeichne er ausschließlich den Charakter des Mannes.
- issue: Bild vom Eintreffen der Sünden
  choice: Die Sünden sind „über dich gekommen“.
  alternative: „Deine Sünden haben dich eingeholt.“
  rationale: Die gewählte Fassung bewahrt das Kommensmotiv von ἥκασιν und die Vorstellung gegenwärtiger gerichtlicher Konfrontation, ohne eine zusätzliche Redewendung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt nahe am griechischen Gerichts- und Anklagestil, vermeidet jedoch unnötig altertümliche Wörter. Der Doppelpunkt nach der Anrede macht den Übergang zur Anklage im Deutschen klar.
