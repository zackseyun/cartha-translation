  text: 'Da sagte einer zum anderen: »Gehen wir nun nach Hause, denn es ist Zeit für das Mittagessen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος τῷ ἑτέρῳ
  choice: einer zum anderen
  rationale: Gibt die wechselseitige Wendung knapp und idiomatisch wieder; das im Deutschen nötige Redeverb wird aus dem unmittelbaren Zusammenhang der direkten Rede ergänzt.
- source_word: Πορευθῶμεν δὴ εἰς οἶκον
  choice: Gehen wir nun nach Hause
  rationale: Der auffordernde Konjunktiv wird natürlich mit »Gehen wir« wiedergegeben; δή erhält durch »nun« seinen bestätigenden bzw. folgernden Ton, und εἰς οἶκον entspricht idiomatisch »nach Hause«.
- source_word: ἀρίστου ὥρα
  choice: Zeit für das Mittagessen
  rationale: ἄριστον bezeichnet hier die Tagesmahlzeit am späten Vormittag oder Mittag; »Mittagessen« ist im modernen Standarddeutsch klar und würdig, ohne die historische Uhrzeit unnötig festzulegen.
