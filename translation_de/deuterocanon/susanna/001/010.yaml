base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/010.yaml
  text: And both of them were inflamed with desire for her[a], and neither one disclosed to the other the wicked passion that held them concerning her[b], nor did the woman know this matter.
translation:
  language: de
  text: Und beide waren von Verlangen nach ihr ergriffen[a]. Doch keiner offenbarte dem anderen das Böse, das sie ihretwegen gefangen hielt[b]; auch die Frau wusste nichts von dieser Sache.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Beide waren ihretwegen durchbohrt.“ Der bildhafte Ausdruck bezeichnet hier, dass sie heftig von Verlangen nach ihr ergriffen waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „das böse Verlangen, das sie ihretwegen beherrschte“. Das Griechische sagt allgemeiner „das Böse“ und lässt den genauen Umfang des Gemeinten offen.'
    reason: preserved_ambiguity
lexical_decisions:
- source_word: ἀμφότεροι
  choice: beide
  rationale: Bezeichnet ausdrücklich die zwei bereits genannten Ältesten; „beide“ gibt den gemeinsamen Zustand knapp und natürlich wieder.
- source_word: κατανενυγμένοι
  choice: von Verlangen ... ergriffen
  rationale: Das Perfektpartizip bezeichnet wörtlich ein Durchbohrt- oder Gestochen-Sein. Im Zusammenhang geht es um eine anhaltende erotische Fixierung; die gewählte Formulierung wahrt Intensität und Zustandscharakter, während die Fußnote das Bild festhält.
- source_word: περὶ αὐτῆς
  choice: nach ihr
  rationale: In Verbindung mit „Verlangen“ ist „nach ihr“ im Deutschen idiomatisch und bezeichnet Susanna als Ziel ihres Begehrens.
- source_word: ἕτερος τῷ ἑτέρῳ οὐ προσεποιεῖτο
  choice: keiner offenbarte dem anderen
  rationale: Die wechselseitige Wendung mit Verneinung wird im Deutschen natürlich als „keiner ... dem anderen“ wiedergegeben. Hier bezeichnet das Verb das Kundtun oder Eingestehen, nicht ein Vorgeben.
- source_word: τὸ κακὸν
  choice: das Böse
  rationale: Die substantivierte Form wird bewusst formal als „das Böse“ erhalten. Dadurch bleibt offen, ob vor allem das böse Begehren, die Leidenschaft oder die bereits daraus erwachsende Absicht gemeint ist.
- source_word: τὸ ἔχον αὐτοὺς
  choice: das sie ... gefangen hielt
  rationale: Das substantivierte Partizip stellt das Böse als eine Macht dar, die sie in ihrer Gewalt hat. „Gefangen hielt“ drückt diese beherrschende Wirkung natürlich aus.
- source_word: περὶ αὐτῆς
  choice: ihretwegen
  rationale: Beim zweiten Vorkommen bezeichnet die Präpositionalphrase den Bezug des Bösen auf Susanna. „Ihretwegen“ ist flüssig, ohne die Formulierung unnötig zu wiederholen.
- source_word: ἡ γυνή
  choice: die Frau
  rationale: Entspricht der allgemeinen Bezeichnung im Griechischen und wahrt die äußere Erzählperspektive auf Susanna.
- source_word: ἔγνω τὸ πρᾶγμα τοῦτο
  choice: wusste nichts von dieser Sache
  rationale: Die deutsche Negationsstellung gibt οὐδὲ ... ἔγνω idiomatisch wieder. „Sache“ bleibt ebenso wenig spezifiziert wie πρᾶγμα und nimmt keinen späteren Plan vorweg.
theological_decisions:
- issue: Moralische Kennzeichnung des verborgenen Begehrens
  choice: τὸ κακόν als „das Böse“ wiedergeben
  alternative: „die böse Leidenschaft“ oder „das böse Verlangen“
  rationale: Der Text bewertet das, was die Männer beherrscht, ausdrücklich moralisch. Die formalere Wiedergabe wahrt diese Wertung, ohne den mehrdeutigen substantivischen Ausdruck allein auf ein inneres Gefühl festzulegen.
- issue: Bildhafte oder idiomatische Wiedergabe von κατανενυγμένοι
  choice: „von Verlangen nach ihr ergriffen“ mit erläuternder Fußnote
  alternative: „ihretwegen wie durchbohrt“ oder „in Begierde nach ihr entbrannt“
  rationale: Eine rein wörtliche Wiedergabe wäre im heutigen Deutsch missverständlich. Die Hauptfassung vermittelt den erotischen Sinn aus dem Kontext; die Fußnote bewahrt das Bild des griechischen Ausdrucks.
- issue: Grad der Verantwortung bei τὸ ἔχον αὐτούς
  choice: „das sie ... gefangen hielt“
  alternative: „das von ihnen Besitz ergriffen hatte“
  rationale: Die personifizierende Macht des Bösen bleibt erkennbar. Die Formulierung behauptet jedoch keine Aufhebung ihrer Verantwortung und löst die Spannung zwischen ihrem Begehren und dessen beherrschender Wirkung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den Gedankengang zu verändern. „Das Böse“ erhält die moralische Wertung und zugleich die semantische Offenheit des griechischen Ausdrucks; die idiomatische Wiedergabe von κατανενυγμένοι wird durch eine wörtlichere Fußnote abgesichert.
