lexical_decisions:
- source_word: ἔλαβε γυναῖκα
  choice: nahm eine Frau
  rationale: Die Wendung bedeutet im ehelichen Zusammenhang, dass er sie zur Frau nahm beziehungsweise heiratete. Die gewählte Form bleibt nah am griechischen Ausdruck und ist im Deutschen verständlich.
- source_word: ᾗ ὄνομα Σουσάννα
  choice: namens Susanna
  rationale: Die griechische Namensformel wird knapp und idiomatisch wiedergegeben.
- source_word: θυγάτηρ Χελκίου
  choice: eine Tochter Hilkijas
  rationale: Der artikellose griechische Ausdruck bezeichnet Susannas Abstammung. „Hilkija“ ist die im Deutschen geläufige biblische Namensform.
- source_word: καλή
  choice: die schön war
  rationale: καλή beschreibt hier naheliegend Susannas äußere Schönheit. Der Relativsatz macht den Bezug im Deutschen eindeutig und berücksichtigt, dass die Beschreibung im folgenden Vers weitergeführt wird.
