base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/057.yaml
  text: This is how you acted toward the daughters of Israel[a], and they, out of fear, associated with you; but a daughter of Judah did not endure your lawlessness.
translation:
  language: de
  text: So habt ihr es mit den Töchtern Israels gemacht, und aus Angst gingen sie mit euch um[a]; doch eine Tochter Judas ertrug eure Gesetzlosigkeit nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verkehrten aus Angst mit euch« beziehungsweise »hatten aus Angst Umgang mit euch«. Das griechische Verb bezeichnet den Umgang oder Verkehr mit jemandem. Der Zwangskontext legt mehr als gewöhnlichen gesellschaftlichen Kontakt nahe, benennt eine sexuelle Handlung aber nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἐποιεῖτε
  choice: So habt ihr es … gemacht
  rationale: Der Imperfekt weist auf wiederholtes oder gewohnheitsmäßiges Handeln hin. Die deutsche Wendung ist natürlich und hält den anklagenden Rückblick fest.
- source_word: θυγατράσιν Ἰσραήλ
  choice: mit den Töchtern Israels
  rationale: Die biblische Familien- und Bundesbezeichnung bleibt erhalten und bildet den rhetorischen Gegensatz zu »eine Tochter Judas«.
- source_word: φοβούμεναι
  choice: aus Angst
  rationale: Das Partizip bezeichnet den Beweggrund für das folgende Verhalten und wird im Deutschen klar kausal wiedergegeben.
- source_word: ὡμίλουν ὑμῖν
  choice: sie ließen sich … mit euch ein
  rationale: ὁμιλέω bezeichnet den Umgang oder Verkehr mit jemandem. Im Zwangskontext klingt mehr als gewöhnlicher gesellschaftlicher Kontakt an, ohne dass das griechische Verb den sexuellen Vorgang ausdrücklich benennt.
- source_word: ἀλλ᾽ οὐ θυγάτηρ Ἰούδα
  choice: doch eine Tochter Judas
  rationale: Der artikellose Singular wird bewahrt; Susanna erscheint damit als einzelne und zugleich repräsentative Tochter Judas.
- source_word: ὑπέμεινεν
  choice: ertrug … nicht
  rationale: Die Grundbedeutung von ὑπομένω ist »aushalten, ertragen«. Die Wiedergabe wahrt die Aussage ihrer Weigerung, ohne das Verb enger als nötig als »sich unterwerfen« auszulegen.
- source_word: τὴν ἀνομίαν ὑμῶν
  choice: eure Gesetzlosigkeit
  rationale: »Gesetzlosigkeit« erhält sowohl die rechtliche als auch die sittliche Schwere von ἀνομία im gerichtlichen Zusammenhang.
theological_decisions:
- issue: Repräsentativer Singular bei »Tochter Judas«
  choice: eine Tochter Judas
  alternative: keine Tochter Judas; die Töchter Judas
  rationale: Der griechische Singular bleibt bestehen und wahrt den Kontrast zum Plural »Töchter Israels«, ohne die Aussage zu verallgemeinern.
- issue: Rechtlich-sittliche Bedeutung von ἀνομία
  choice: Gesetzlosigkeit
  alternative: Bosheit; Unrecht
  rationale: Die Formulierung bewahrt die Spannung zwischen Gesetzesbruch und moralischer Verwerflichkeit, statt den Begriff auf nur einen Aspekt einzuengen.
- issue: Art des durch Angst erzwungenen Umgangs
  choice: ließen sich aus Angst mit euch ein
  alternative: verkehrten aus Angst mit euch; gaben euch aus Angst nach
  rationale: Die Übersetzung macht den durch Furcht bestimmten Charakter deutlich, legt aber nicht ausdrücklich einen sexuellen Vollzug in das semantisch weitere Verb ὁμιλέω hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Plural und der scharfe gerichtliche Ton bleiben erhalten. »Sich mit jemandem einlassen« ist verständlich und lässt wie das Griechische den genauen Charakter des erzwungenen Umgangs offen; die Fußnote dokumentiert die lexikalische Spannweite.
