base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/038.yaml
  text: And they did not know that we were standing there. Then we rushed together[a], saying, 'Let us find out who these men are.'
translation:
  language: de
  text: 'Auch sie wussten nicht, dass wir dort standen. Da stürzten wir gemeinsam aufeinander zu[a] und sagten: »Lasst uns herausfinden, wer diese Leute[b] sind.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung ist ungewöhnlich. Sie kann auch im Sinn von „Da gingen wir gemeinsam aufeinander los“ verstanden werden. Das reziproke „einander“ steht ausdrücklich im griechischen Text.
    reason: lexical_ambiguity
  - marker: b
    text: 'Wörtlich: „wer diese sind“. „Leute“ ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ οὐκ ᾔδεισαν
  choice: Auch sie wussten nicht
  rationale: καὶ αὐτοί hebt die genannten Personen hervor und lässt sich hier natürlich mit „auch sie“ wiedergeben; οὐκ ᾔδεισαν bezeichnet schlicht ihr Nichtwissen.
- source_word: εἰστήκειμεν
  choice: wir dort standen
  rationale: Der Plusquamperfektstamm von ἵστημι beschreibt einen bereits eingenommenen Standplatz. Im Deutschen gibt das Präteritum im narrativen Nebensatz Haltung und Anwesenheit natürlich wieder.
- source_word: τότε συνεπιτάμεθα ἀλλήλοις
  choice: Da stürzten wir gemeinsam aufeinander zu
  rationale: Die Form bezeichnet eine gemeinsame, plötzliche Bewegung; ἀλλήλοις ist ausdrücklich reziprok. Die ungewöhnliche Verbindung wird nicht stillschweigend geglättet, sondern im Text bewahrt und in einer Fußnote als mehrdeutig gekennzeichnet.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das griechische Partizip wird für natürliches deutsches Erzählen als koordinierter Satz wiedergegeben.
- source_word: Μάθωμεν
  choice: Lasst uns herausfinden
  rationale: Der Aorist Konjunktiv hat auffordernde Kraft; „herausfinden“ trifft in diesem Zusammenhang den untersuchenden Sinn von μανθάνω.
- source_word: τίνες εἰσὶν οὗτοι
  choice: wer diese Leute sind
  rationale: „Leute“ macht den im maskulinen Plural liegenden Personenbezug im Deutschen idiomatisch deutlich, ohne Geschlecht oder Identität näher festzulegen.
