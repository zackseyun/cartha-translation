base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/004.yaml
  text: And Joakim was exceedingly rich[a], and he had a garden adjoining his house[c][b]; and the Jews would come to him because he was more esteemed than all of them.
translation:
  language: de
  text: Und Joakim war sehr reich, und er besaß einen Garten[a], der an sein Haus grenzte. Die Juden[b] kamen immer wieder zu ihm, weil er angesehener war als alle anderen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Park“ beziehungsweise „Obstgarten“. Das griechische Wort bezeichnet hier eine kultivierte Gartenanlage oder ein eingefriedetes Grundstück.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Judäer“, falls die Bezeichnung geografisch statt ethnisch-religiös verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλούσιος σφόδρα
  choice: sehr reich
  rationale: πλούσιος bezeichnet Reichtum, σφόδρα verstärkt die Aussage deutlich. „Sehr reich“ ist im modernen Standarddeutsch natürlich und gibt die starke Intensivierung angemessen wieder.
- source_word: παράδεισος
  choice: Garten
  rationale: Im Zusammenhang ist ein kultivierter, vermutlich eingefriedeter Garten oder Park bei einem wohlhabenden Haus gemeint, nicht das theologische „Paradies“. „Garten“ ist die klarste und am wenigsten überbestimmte Wiedergabe.
- source_word: γειτνιῶν τῷ οἴκῳ αὐτοῦ
  choice: der an sein Haus grenzte
  rationale: Das Partizip drückt räumliche Nachbarschaft beziehungsweise unmittelbare Angrenzung aus. Die Relativkonstruktion ist im Deutschen natürlich und präzise.
- source_word: πρὸς αὐτὸν προσήγοντο
  choice: kamen immer wieder zu ihm
  rationale: Die Imperfektform bezeichnet hier am ehesten ein wiederholtes oder übliches Kommen. Die mediale/passive Form wird kontextgemäß idiomatisch als freiwilliges Sich-Hinbegeben verstanden; die formal mögliche passive Deutung bleibt weniger wahrscheinlich.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Im Erzählzusammenhang bezeichnet der Ausdruck am natürlichsten die jüdische Gemeinschaft. Die geografische Wiedergabe „die Judäer“ bleibt als mögliche Alternative in einer Fußnote erhalten.
- source_word: ἐνδοξότερον πάντων
  choice: angesehener war als alle anderen
  rationale: Der Komparativ bezeichnet hier gesellschaftliches Ansehen oder öffentliche Wertschätzung. „Angesehener“ erklärt natürlich, weshalb die Menschen zu Joakim kamen, ohne moralische oder geistliche Überlegenheit zu behaupten.
- source_word: Ἰωακείμ
  choice: Joakim
  rationale: „Joakim“ bildet die griechische Namensform relativ unmittelbar ab; die im Deutschen ebenfalls traditionelle Form „Joachim“ wird nicht benötigt, da sie keine Bedeutungsdifferenz trägt.
theological_decisions:
- issue: Bedeutung von Joakims Rang in ἐνδοξότερον πάντων
  choice: gesellschaftliches Ansehen
  alternative: moralische, geistliche oder herrlichkeitsbezogene Überlegenheit
  rationale: Die Aussage begründet den Zulauf zu Joakim und betrifft daher am ehesten seinen öffentlichen Rang. Der Text bietet keinen Anlass, daraus eine Aussage über besondere Gerechtigkeit oder Heiligkeit zu machen.
- issue: Referenz von οἱ Ἰουδαῖοι
  choice: die jüdische Gemeinschaft („die Juden“)
  alternative: die Bewohner beziehungsweise Herkunftsangehörigen Judäas („die Judäer“)
  rationale: Die ethnisch-religiöse Bedeutung passt im vorliegenden Erzählzusammenhang besser; die geografische Möglichkeit wird wegen der lexikalischen Mehrdeutigkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde gegenüber dem mehrfachen griechischen καί maßvoll gegliedert. „Kamen immer wieder“ macht den gewohnheitsmäßigen Aspekt des Imperfekts verständlich; „angesehener“ wahrt die soziale, nicht ausdrücklich moralische Bedeutung.
