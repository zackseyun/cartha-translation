base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/012.yaml
  text: And behold[a], she was walking about as usual, and one of the elders had come, and behold, the other arrived, and he questioned the other, saying[b], “Why did you go out so early without taking me along?”
translation:
  language: de
  text: 'Und siehe[a], sie ging wie gewöhnlich umher, und einer der Ältesten war gekommen, und siehe, der andere traf ein, und er befragte den anderen und sagte[b]: »Warum bist du so früh hinausgegangen, ohne mich mitzunehmen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „siehe“; das griechische Aufmerksamkeitswort ἰδοὺ steht in diesem Vers zweimal.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text wechselt rasch und erzählerisch etwas schwerfällig zwischen den beiden Ältesten („einer“, „der andere“). Die Übersetzung bewahrt diese abrupte Abfolge und die dabei entstehende Unklarheit der Bezüge.
    reason: textual_variant
lexical_decisions:
- source_word: ἰδοὺ
  choice: siehe
  rationale: Der wiederholte griechische Aufmerksamkeitsmarker wird sichtbar bewahrt; „siehe“ ist würdevoll und markiert den abrupten Fortgang der Erzählung.
- source_word: κατὰ τὸ εἰωθὸς
  choice: wie gewöhnlich
  rationale: Die Wendung bezeichnet Susannas gewohnheitsmäßiges Tun und wird knapp sowie idiomatisch wiedergegeben.
- source_word: περιεπάτει
  choice: ging … umher
  rationale: Das Imperfekt bezeichnet eine andauernde Handlung; „umhergehen“ bewahrt zudem die räumliche Bewegungsnuance.
- source_word: πρεσβυτέρων
  choice: Ältesten
  rationale: Im Kontext sind ältere Männer mit anerkannter gemeindlicher Leitungs- und Richterfunktion gemeint; „Älteste“ wahrt beide Aspekte.
- source_word: ἐλληλύθει
  choice: war … gekommen
  rationale: Das Plusquamperfekt stellt die Ankunft des einen Ältesten als bereits erfolgt dar.
- source_word: παρεγένετο
  choice: traf ein
  rationale: Die Form bezeichnet das Hinzukommen beziehungsweise Eintreffen des zweiten Ältesten.
- source_word: ἀνέκρινε
  choice: befragte
  rationale: „Befragen“ erhält den prüfenden Ton, ohne hier unnötig ein förmliches Verhör anzunehmen.
- source_word: ὄρθρου
  choice: so früh
  rationale: Der Genitiv bezeichnet die frühe Morgenzeit; im deutschen Fragesatz gibt „so früh“ den Sinn natürlich und hinreichend deutlich wieder.
- source_word: παραλαβὼν με
  choice: ohne mich mitzunehmen
  rationale: Gemeint ist, jemanden als Begleiter mitzunehmen; die deutsche Formulierung gibt diese Erwartung idiomatisch wieder.
