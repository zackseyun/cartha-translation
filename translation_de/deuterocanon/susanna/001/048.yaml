base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/048.yaml
  text: But he stood in their midst and said[a], “Are you such fools, sons of Israel? Without examining the matter or even learning the facts clearly[b], have you condemned a daughter of Israel?”
translation:
  language: de
  text: 'Er aber stand mitten unter ihnen und sagte: „Seid ihr so töricht, ihr Söhne Israels? Ohne den Fall untersucht und den Sachverhalt geklärt zu haben[a], habt ihr eine Tochter Israels verurteilt?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne eine Untersuchung durchgeführt und das Offenkundige erkannt zu haben“. Die griechische Formulierung hat einen gerichtlichen Klang und betont, dass der Fall vor der Verurteilung nicht ordnungsgemäß geprüft wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: trat
  rationale: Das aoristische Partizip bezeichnet Daniels hervortretende körperliche Handlung vor seiner Rede; als finites Verb ist „trat“ im Deutschen natürlich.
- source_word: ἐν μέσῳ αὐτῶν
  choice: in ihre Mitte
  rationale: Bewahrt den anschaulichen öffentlichen Schauplatz und die konfrontative Wirkung der griechischen Wendung.
- source_word: Οὕτως μωροί
  choice: Seid ihr so töricht
  rationale: Gibt die scharfe rhetorische Rüge idiomatisch wieder; „töricht“ wahrt den würdigen Ton, ohne μωροί abzuschwächen.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: ihr Söhne Israels
  rationale: Erhält die ausdrücklich männliche Anrede und den rhetorischen Gegensatz zu „eine Tochter Israels“.
- source_word: ἀνακρίναντες
  choice: die Sache untersucht
  rationale: Vermittelt den gerichtlichen Sinn einer Prüfung oder Untersuchung, ohne ein bestimmtes Gerichtsverfahren vorauszusetzen.
- source_word: τὸ σαφὲς ἐπιγνόντες
  choice: den Sachverhalt eindeutig festgestellt
  rationale: Verbindet den Gedanken klarer Gewissheit aus σαφές mit dem gründlichen Erkennen aus ἐπιγινώσκω und passt zum gerichtlichen Kontext.
- source_word: κατεκρίνατε
  choice: habt ihr ... verurteilt
  rationale: Das Perfekt hebt im Deutschen die bereits vollzogene Verurteilung hervor, die Daniel nun anklagt.
- source_word: θυγατέρα Ἰσραήλ
  choice: eine Tochter Israels
  rationale: Entspricht dem artikellosen Singular und bewahrt die bundesbezogene Gegenüberstellung mit den „Söhnen Israels“.
theological_decisions:
- issue: Geschlechtsspezifische Bundesbezeichnungen
  choice: Söhne Israels / eine Tochter Israels
  alternative: Israeliten / eine israelitische Frau
  rationale: Der Vers stellt die männliche Anrede bewusst der weiblichen Bezeichnung Susannas gegenüber. Die gewählte Fassung bewahrt diese rhetorische und gemeinschaftsbezogene Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der gerichtliche Ton bleiben erhalten; „Sachverhalt“ macht die forensische Aussage natürlich verständlich.
