base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/023.yaml
  text: But if not[a], we will testify against you that a young man was with you[b], and for this reason you sent the servant girls away from you.
translation:
  language: de
  text: Wenn aber nicht, werden wir gegen dich aussagen, dass ein junger Mann bei dir war und du deshalb die Dienerinnen weggeschickt hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: Wenn aber nicht
  rationale: Bewahrt die knappe, elliptische Drohung im Anschluss an die vorausgehende Forderung, ohne das im Griechischen Ungesagte auszuformulieren.
- source_word: καταμαρτυρήσομέν σου
  choice: werden wir gegen dich aussagen
  rationale: Gibt den feindseligen, forensischen Charakter des zusammengesetzten Verbs natürlich und präzise wieder.
- source_word: ὅτι ἦν μετὰ σοῦ νεανίσκος
  choice: dass ein junger Mann bei dir war
  rationale: „Junger Mann“ ist eine gegenwärtige und kontextgerechte Wiedergabe von νεανίσκος; der Satz bleibt ausdrücklich Inhalt der angedrohten Falschaussage.
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Markiert knapp und klar den behaupteten Kausalzusammenhang.
- source_word: ἐξαπέστειλας ... ἀπὸ σοῦ
  choice: du ... weggeschickt hast
  rationale: Das deutsche trennbare Verb „wegschicken“ drückt sowohl das Senden als auch die Entfernung von Susanna idiomatisch aus.
- source_word: τὰ κοράσια
  choice: die Dienerinnen
  rationale: Der Kontext identifiziert die Mädchen als Susannas weibliche Bedienstete. „Dienerinnen“ ist im modernen Deutsch natürlicher und würdiger als „Dienstmädchen“, gibt ihr junges Alter jedoch nicht eigens wieder.
theological_decisions:
- issue: Charakter der Aussage der Ältesten
  choice: Als Drohung mit einer belastenden gerichtlichen Aussage wiedergeben
  alternative: Allgemeiner mit „wir werden dich beschuldigen“ wiedergeben
  rationale: Das griechische καταμαρτυρέω bezeichnet ein gegen jemanden gerichtetes Zeugnis und wahrt damit den forensischen Ton sowie die narrative Schwere der angedrohten Falschaussage.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die abrupte Ellipse „Wenn aber nicht“ und der juristische Ausdruck „gegen dich aussagen“ bleiben erhalten; unnötige Explizierungen werden vermieden.
