lexical_decisions:
- source_word: εἰσήκουσεν
  choice: hörte
  rationale: εἰσακούω bezeichnet das Hören oder Erhören, oft mit dem Beiklang einer wohlwollenden Reaktion. „Hörte“ bewahrt hier die schlichte Aussage des griechischen Textes; „erhörte“ würde die positive Antwort stärker ausdrücklich machen, als es dieser Satz allein tut.
- source_word: Κύριος
  choice: der Herr
  rationale: Der griechische Gottesname bzw. -titel Κύριος wird in diesem griechischen deuterokanonischen Text natürlich und würdig mit „der Herr“ wiedergegeben, ohne durch eine besondere Schreibweise einen nicht ausdrücklich vorliegenden hebräischen Gottesnamen vorauszusetzen.
- source_word: φωνῆς αὐτῆς
  choice: ihre Stimme
  rationale: Die wörtliche Wendung „ihre Stimme“ entspricht dem Griechischen und lässt den Gebets- und Hilferufkontext erkennen, ohne φωνή interpretierend als „Gebet“, „Ruf“ oder „Flehen“ wiederzugeben.
theological_decisions:
- issue: Ob Gottes wohlwollende Reaktion auf Susannas Gebet ausdrücklich gemacht werden soll
  choice: „hörte ihre Stimme“
  alternative: „erhörte sie“ / „erhörte ihren Ruf“
  rationale: Das Verb kann ein erhörendes, günstiges Hören nahelegen. Der Satz benennt jedoch zunächst das Hören; die Form der göttlichen Antwort entfaltet erst die folgende Erzählung. Die Übersetzung bewahrt daher die theologische Spannung und Zurückhaltung des Wortlauts.
- issue: Wiedergabe von Κύριος im griechischen deuterokanonischen Kontext
  choice: „der Herr“
  alternative: „der HERR“
  rationale: Die Vorlage bietet Κύριος. „Der Herr“ gibt den griechischen Titel direkt wieder; „der HERR“ könnte eine unmittelbare Vertretung des hebräischen Gottesnamens signalisieren, die aus diesem griechischen Wortlaut allein nicht festzustellen ist.
translation_notes:
  register: Kurzer, würdiger und allgemein verständlicher Erzählstil. Die Satzstellung folgt dem Griechischen auf natürliche Weise; es sind keine Fußnoten nötig.
