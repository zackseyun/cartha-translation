base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/040.yaml
  text: After seizing her[a], we questioned her, ‘Who was the man?’ But she did not tell us who he was. These things we testify.
translation:
  language: de
  text: 'Nachdem wir sie ergriffen hatten, befragten wir sie: »Wer war der Mann?« Doch sie sagte uns nicht, wer er war. Dies bezeugen wir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: Nachdem wir sie gepackt hatten
  rationale: Das Aoristpartizip von ἐπιλαμβάνομαι bezeichnet hier ein körperliches Ergreifen. »Gepackt« bewahrt diese Kraft, ohne im Deutschen unnötig technisch zu klingen.
- source_word: ἐπηρώτωμεν
  choice: fragten wir sie
  rationale: Das Imperfekt beschreibt das Befragen. »Fragten« ist natürlich und lässt den gerichtlichen Zusammenhang aus dem Kontext hervorgehen, ohne die stärkere Bedeutung »verhörten« aufzuzwingen.
- source_word: Τίς ὁ ἄνθρωπος;
  choice: Wer war der Mann?
  rationale: Die Frage zielt auf die Identität des angeblich beteiligten Mannes. Die Vergangenheitsform entspricht der rückblickenden Zeugenaussage; der bestimmte Artikel wird mit »der Mann« wiedergegeben.
- source_word: οὐκ ἀπήγγειλεν ἡμῖν
  choice: sie sagte uns nicht
  rationale: ἀπαγγέλλω bezeichnet hier das Mitteilen beziehungsweise Nennen der Identität. Die Formulierung ist idiomatisch und enthält keine zusätzliche Deutung wie eine ausdrückliche Weigerung.
- source_word: τίς ἦν
  choice: wer er war
  rationale: Gemeint ist die Identität, nicht die Beschaffenheit oder der Charakter des Mannes.
- source_word: ταῦτα μαρτυροῦμεν
  choice: Das bezeugen wir
  rationale: »Bezeugen« erhält den forensischen Sinn von μαρτυρέω. Das zusammenfassende deutsche »Das« gibt das griechische ταῦτα im vorliegenden Kontext natürlich wieder.
theological_decisions:
- issue: Gerichtlicher Sprachgebrauch in der Anklage der Ältesten
  choice: Den ausdrücklichen Zeugnisbegriff im Schlusssatz mit »bezeugen« bewahren
  alternative: 'Glatter formulieren: »Das ist unsere Aussage.«'
  rationale: Die Äußerung gehört zu einer gerichtlichen Anschuldigung. »Bezeugen« erhält ihre rechtliche und rhetorische Funktion, ohne die Wahrhaftigkeit der Aussage zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp; der Schlusssatz behält bewusst den gerichtlichen Klang. Keine Fußnote nötig, da die relevante Bedeutungsbreite im Haupttext angemessen wiedergegeben wird.
