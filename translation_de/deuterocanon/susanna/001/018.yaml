translation:
  language: de
  text: Und niemand war dort außer den beiden Ältesten, die sich verborgen hielten und sie beobachteten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie heimlich belauerten“. Das griechische Verb kann ein genaues, feindseliges oder heimliches Beobachten bezeichnen; der Haupttext bleibt bei der zurückhaltenderen Wiedergabe „beobachteten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν οὐδεὶς
  choice: niemand war dort
  rationale: Die griechische doppelte Verneinung bezeichnet idiomatisch die völlige Abwesenheit anderer Personen; die gewählte Formulierung ist natürlich und präzise.
- source_word: πλὴν
  choice: außer
  rationale: πλὴν kennzeichnet hier eine Ausnahme; „außer“ gibt dies im modernen Deutsch knapp und eindeutig wieder.
- source_word: οἱ δύο πρεσβύτεροι
  choice: die beiden Ältesten
  rationale: πρεσβύτεροι bezeichnet im Erzählzusammenhang anerkannte Älteste und Richter, nicht lediglich ältere Männer; „Älteste“ bewahrt ihre gesellschaftliche Funktion.
- source_word: κεκρυμμένοι
  choice: die sich verborgen hielten
  rationale: Das Perfektpartizip beschreibt ihren fortdauernden Zustand des Verborgenseins; die reflexive Formulierung klingt im Deutschen natürlich und lässt erkennen, dass sie sich versteckt hatten.
- source_word: παρατηροῦντες αὐτήν
  choice: sie beobachteten
  rationale: Das Partizip bezeichnet aufmerksames, möglicherweise heimliches oder feindseliges Beobachten. „Beobachteten“ bleibt nahe am Wortlaut, ohne die negative Nuance stärker festzulegen, als es das Verb allein verlangt.
