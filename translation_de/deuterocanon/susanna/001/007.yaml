base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/007.yaml
  text: These men saw a woman beautiful in appearance[a], a wife of one of their brothers from the sons of Israel, whose name was Susanna, daughter of Hilkiah, wife of Joakim, walking in her husband's garden in the evening.
translation:
  language: de
  text: 'Diese Männer sahen eine Frau, schön anzusehen: die Frau eines ihrer Brüder aus den Söhnen Israels.[a] Ihr Name war Susanna; sie war die Tochter Hilkijas und die Frau Jojakims. Am Abend ging sie im Garten ihres Mannes spazieren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »die Frau eines ihrer Brüder aus den Söhnen Israels«. Die griechische Formulierung ist ungewöhnlich; vermutlich bezeichnet »Bruder« hier einen israelitischen Volksgenossen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: Diese Männer
  rationale: Das Demonstrativpronomen verweist im Zusammenhang auf die beiden Ältesten; „Männer“ macht den Bezug im Deutschen deutlich.
- source_word: ἰδόντες
  choice: sahen
  rationale: Das Partizip wird entsprechend seiner erzählenden Funktion als finites Verb wiedergegeben.
- source_word: γυναῖκα ἀστεῖαν τῷ εἴδει
  choice: eine Frau von schöner Gestalt
  rationale: ἀστεῖος bezeichnet hier zusammen mit τῷ εἴδει ihre äußere Schönheit; die Formulierung ist würdig und quellenah.
- source_word: γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ
  choice: die Frau eines ihrer Brüder aus den Söhnen Israels
  rationale: Die bewusst nahe Wiedergabe erhält die ungewöhnliche und syntaktisch schwierige Verwandtschaftsbezeichnung, ohne sie stillschweigend auf „Israelitin“ zu reduzieren.
- source_word: ὄνομα Σουσάνναν
  choice: Ihr Name war Susanna
  rationale: Natürliche deutsche Wiedergabe der griechischen Namensformel.
- source_word: θυγατέρα Χελκίου
  choice: die Tochter Hilkijas
  rationale: Übliche deutsche Wiedergabe der genealogischen Beziehung; der Name folgt der geläufigen biblischen Form.
- source_word: γυναῖκα Ἰωακείμ
  choice: die Frau Jojakims
  rationale: Direkte Wiedergabe des relationalen Genitivs; „Jojakim“ ist die geläufige deutsche Namensform.
- source_word: περιπατοῦσαν
  choice: ging … spazieren
  rationale: Im Gartenkontext gibt „spazieren gehen“ die fortgesetzte Bewegung natürlich wieder.
- source_word: ἐν τῷ παραδείσῳ τοῦ ἀνδρὸς αὐτῆς
  choice: im Garten ihres Mannes
  rationale: παράδεισος bezeichnet hier einen Garten oder Park, nicht das theologische Paradies.
- source_word: τὸ δειλινόν
  choice: Am Abend
  rationale: Klare und natürliche Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Deutung von γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ
  choice: die Frau eines ihrer Brüder aus den Söhnen Israels
  alternative: die Frau eines israelitischen Volksgenossen
  rationale: Der griechische Text ist ungewöhnlich und mehrdeutig. Die Hauptfassung bewahrt die Brüder- und Israel-Sprache; die Fußnote erläutert, dass wahrscheinlich die Zugehörigkeit zum eigenen israelitischen Volk gemeint ist, ohne die Schwierigkeit zu verdecken.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der lange griechische Satz wurde zur besseren Lesbarkeit gegliedert; die syntaktisch schwierige Verwandtschaftsangabe bleibt im Haupttext erkennbar und wird in der Fußnote erläutert.
