  source_fidelity: Die Übersetzung gibt die zeitliche Abfolge und die plötzliche, bedrohliche Aktion präzise wieder. „Als … hinausgegangen waren“ bildet ὡς mit dem vorzeitigen ἐξήλθοσαν idiomatisch ab. Das nicht gesondert ausgedrückte καὶ ἐγένετο ist als griechische Erzählformel im modernen Deutschen vertretbar in die Satzführung integriert. „Stürzten auf sie zu“ wahrt die aggressive Dynamik von ἐπέδραμον αὐτῇ, ohne einen weitergehenden körperlichen Übergriff vorwegzunehmen.
  naturalness: Flüssiges modernes Standarddeutsch in angemessen würdigem Erzählregister. Plusquamperfekt und Verbzweitstellung sind natürlich; „die beiden Ältesten“ und „stürzten auf sie zu“ sind klar und idiomatisch.
  terminology: „Älteste“ trifft πρεσβῦται als soziale bzw. richterliche Funktion besser als eine bloße Altersbezeichnung. „Junge Dienerinnen“ ist im Haushaltskontext eine gut begründete kontextuelle Wiedergabe von τὰ κοράσια; die Fußnote sichert die lexikalische Offenheit mit „die Mädchen“ und benennt die Kontextdeutung ausdrücklich nur als wahrscheinlich.
