  text: And it happened[a], when the maids had gone out, that the two elders rose up and rushed at her.
translation:
  language: de
  text: Und als die jungen Dienerinnen[a] hinausgegangen waren, standen die beiden Ältesten auf und stürzten auf sie zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Mädchen“. Das griechische Wort bezeichnet junge weibliche Personen; im Zusammenhang sind vermutlich Dienerinnen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: nicht eigens wiedergegeben
  rationale: Die griechische Erzählformel καὶ ἐγένετο leitet das folgende Geschehen ein. Im modernen Deutschen wird ihre Funktion durch „Und als …“ natürlich ausgedrückt; ein zusätzliches „es geschah“ wäre schwerfällig.
- source_word: ὡς
  choice: als
  rationale: Die Konjunktion leitet hier den zeitlichen Nebensatz ein.
- source_word: ἐξήλθοσαν
  choice: hinausgegangen waren
  rationale: Das Plusquamperfekt verdeutlicht, dass ihr Hinausgehen der Handlung der Ältesten vorausgeht.
- source_word: τὰ κοράσια
  choice: die jungen Dienerinnen
  rationale: κοράσια bezeichnet junge weibliche Personen; der häusliche Kontext legt nahe, dass hier Susannas Bedienstete gemeint sind. „Junge Dienerinnen“ bewahrt sowohl den Altersaspekt als auch die kontextuelle Funktion.
- source_word: ἀνέστησαν
  choice: standen … auf
  rationale: Die Form bezeichnet das Aufstehen als Beginn der plötzlichen Handlung.
- source_word: οἱ δύο πρεσβῦται
  choice: die beiden Ältesten
  rationale: „Älteste“ wahrt die gesellschaftliche beziehungsweise amtliche Rolle der Männer und reduziert die Bezeichnung nicht auf ihr Alter.
- source_word: ἐπέδραμον αὐτῇ
  choice: stürzten auf sie zu
  rationale: Die Wendung vermittelt eine plötzliche, bedrohliche Bewegung auf Susanna zu, ohne bereits ausdrücklich einen körperlichen Angriff zu behaupten.
