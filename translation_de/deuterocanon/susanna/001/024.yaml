base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/024.yaml
  text: And Susanna groaned and said[a], “I am hemmed in on every side. For if I do this, it is death for me; but if I do not do it[b], I will not escape your hands.”
translation:
  language: de
  text: 'Da stöhnte Susanna auf und sagte: »Von allen Seiten bin ich bedrängt.[a] Denn wenn ich das tue, bedeutet es für mich den Tod; wenn ich es aber nicht tue, werde ich euren Händen nicht entkommen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Von allen Seiten bin ich in die Enge getrieben.«'
    reason: lexical_alternative
  - marker: b
    text: '»Euren Händen nicht entkommen« bedeutet hier: ihrer Gewalt nicht entkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεστέναξεν
  choice: stöhnte … auf
  rationale: Das Verb bezeichnet ein tiefes Seufzen oder Stöhnen aus Bedrängnis; »stöhnte auf« bewahrt die emotionale Intensität in natürlichem Deutsch.
- source_word: Στενά μοι πάντοθεν
  choice: Von allen Seiten bin ich bedrängt
  rationale: Die knappe Wendung beschreibt eine ausweglose Bedrängnis. Die deutsche Formulierung wahrt das Bild des Drucks von allen Seiten, ohne die Aussage unnötig auszudeuten.
- source_word: ἐὰν γὰρ τοῦτο πράξω
  choice: Denn wenn ich das tue
  rationale: Das Demonstrativpronomen bleibt wie im Griechischen allgemein und verweist auf die zuvor verlangte Handlung, ohne sie hier nochmals zu benennen.
- source_word: θάνατός μοί ἐστιν
  choice: bedeutet es für mich den Tod
  rationale: Die Formulierung erhält die nominale, schroffe Todesaussage und klingt zugleich in modernem Deutsch natürlich.
- source_word: ἐὰν μὴ πράξω
  choice: wenn ich es aber nicht tue
  rationale: Die Wiederholung von »tun« spiegelt die rhetorische Gegenüberstellung des griechischen πράξω; »aber« macht den im Satz angelegten Kontrast deutlich.
- source_word: οὐκ ἐκφεύξομαι
  choice: werde ich … nicht entkommen
  rationale: Das Futur wird formal bewahrt und stellt die erwartete Folge ihrer Weigerung dar.
- source_word: τὰς χεῖρας ὑμῶν
  choice: euren Händen
  rationale: Die konkrete Metapher des Ausgangstextes bleibt erhalten; sie bezeichnet zugleich die Gewalt beziehungsweise Verfügungsgewalt der Angesprochenen.
theological_decisions:
- issue: Susannas Zwangslage ohne Abschwächung des erpresserischen Zusammenhangs wiedergeben
  choice: Die scharfe Entweder-oder-Struktur und die Todesdrohung werden unmittelbar beibehalten.
  alternative: Die Folgen als gesellschaftliche Schande oder bloße rechtliche Gefahr paraphrasieren.
  rationale: 'Der griechische Text stellt eine direkte Zwangslage dar: Nachgeben bedeutet für Susanna den Tod, Verweigerung lässt sie nicht aus der Gewalt der Ältesten entkommen. Die Übersetzung vermeidet beschönigende oder übererklärende Zusätze.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt knapp und angespannt; die konkrete Hand-Metapher und die rhetorische Wiederholung von »tun« werden bewahrt.
