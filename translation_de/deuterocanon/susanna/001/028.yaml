base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/028.yaml
  text: But the lawless men turned back[a], threatening among themselves and lying in wait so that they might put her to death. And when they came to the assembly of the city, they did not stay away[b], and all the sons of Israel who were there gathered together.
translation:
  language: de
  text: Die gesetzlosen Männer aber kehrten zurück. Sie äußerten untereinander Drohungen und lauerten ihr auf, um sie zu Tode zu bringen. Als sie dann zur Versammlung der Stadt kamen, blieben sie nicht fern[a], und alle Söhne Israels[b], die dort waren, versammelten sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die mit »blieben sie nicht fern« wiedergegebene griechische Wendung ist schwer verständlich. Im Zusammenhang besagt sie wahrscheinlich, dass die Männer bei der Versammlung der Stadt anwesend waren.
    reason: textual_variant
  - marker: b
    text: 'Oder: »Israeliten«. Wörtlich: »Söhne Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράνομοι
  choice: gesetzlosen
  rationale: Bewahrt die rechtlich-moralische Bedeutung des griechischen Adjektivs genauer als das allgemeinere »bösen«.
- source_word: ἀπέστρεψαν
  choice: kehrten zurück
  rationale: Gibt das Bewegungsverb im Erzählzusammenhang wieder, ohne eine genauere Richtung hinzuzufügen, als der griechische Text erkennen lässt.
- source_word: ἀπειλοῦντες ἐν ἑαυτοῖς
  choice: Untereinander stießen sie Drohungen aus
  rationale: Gibt die etwas sperrige Wendung als gemeinsames, nicht öffentliches Drohen der Männer wieder und bewahrt ihren partizipialen Begleitumstand in natürlichem Deutsch.
- source_word: ἐνεδρεύοντες
  choice: lauerten ihr auf
  rationale: Bewahrt die konkrete Bedeutung heimlichen Auflauerns und verengt sie nicht auf bloßes Planen.
- source_word: ἵνα θανατώσωσιν αὐτήν
  choice: um sie zu Tode zu bringen
  rationale: Gibt den Zweck und den im gerichtlichen Zusammenhang passenden Tötungssinn des Verbs wieder.
- source_word: συναγωγή
  choice: Versammlung
  rationale: Bezeichnet hier die städtische Zusammenkunft und vermeidet die missverständliche Festlegung auf ein Synagogengebäude.
- source_word: οὐ παρῴκουν
  choice: blieben sie nicht fern
  rationale: Folgt der wahrscheinlichen kontextuellen Aussage, dass die Männer an der städtischen Versammlung teilnahmen, kennzeichnet die sprachliche Schwierigkeit aber durch eine Fußnote.
- source_word: συνήδρευσαν
  choice: versammelten sich
  rationale: Gibt das Zusammenkommen zu einer gemeinsamen Sitzung in natürlichem Deutsch wieder.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: Söhne Israels
  rationale: Bewahrt die ausdrücklich männliche, verwandtschaftliche Ausdrucksweise des griechischen Textes; »Israeliten« bleibt als idiomatische Alternative in der Fußnote genannt.
theological_decisions:
- issue: Geschlechtsspezifische Volksbezeichnung
  choice: Söhne Israels
  alternative: Israeliten; Kinder Israels
  rationale: Der griechische Text verwendet ausdrücklich die männliche verwandtschaftliche Bezeichnung. Die Übersetzung bewahrt diese Form, ohne daraus eine weitergehende Aussage über die Zusammensetzung der Versammlung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer verständliche zweite Satzhälfte bleibt erkennbar, wird aber so formuliert, dass die wahrscheinlich gemeinte Anwesenheit bei der Versammlung verständlich ist. Die kurzen Hauptsätze vermeiden eine überladene Nachbildung der griechischen Partizipialkette.
