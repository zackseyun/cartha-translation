revisions:
- from: 'Daniel aber sagte zu ihm: »Auch du hast treffend gelogen – zu deinem eigenen Verderben. Denn der Engel Gottes wartet schon, das Schwert in der Hand, um dich mitten durchzusägen und euch[a] zu vernichten.«'
  to: 'Daniel aber sagte zu ihm: »Auch du hast treffend gelogen – auf dein eigenes Haupt. Denn der Engel Gottes steht bereit, das Schwert in der Hand, dich mitten durchzusägen, damit er euch[a] vernichtet.«'
  rationale: Die Revision entfernt die nicht ausdrücklich im griechischen μένει enthaltene zeitliche Nuance von »schon« und bewahrt mit »auf dein eigenes Haupt« die konkrete Bildsprache der Vorlage. Die Satzfügung lässt weiterhin erkennen, dass der eine Älteste zunächst unmittelbar bedroht wird, das abschließende Vernichtungsurteil jedoch beide Ältesten umfasst.
