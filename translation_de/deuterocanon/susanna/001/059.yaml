base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/059.yaml
  text: Then Daniel said to him[a], “You also have lied rightly against your own head; for the angel of God stands by, holding the sword to split you in two, so that he may destroy you.”
translation:
  language: de
  text: 'Daniel aber sagte zu ihm: »Auch du hast treffend gelogen – auf dein eigenes Haupt. Denn der Engel Gottes steht bereit, das Schwert in der Hand, dich mitten durchzusägen, damit er euch[a] vernichtet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht hier die Mehrzahl: Die angekündigte Vernichtung gilt beiden Ältesten, nicht nur dem Mann, den Daniel gerade anspricht.'
    reason: Der Wechsel vom Singular »dich« zum Plural »euch« ist inhaltlich bedeutsam und kann beim Lesen leicht übersehen werden.
lexical_decisions:
- source_word: Ὀρθῶς
  choice: treffend
  rationale: 'Das Adverb bedeutet wörtlich »richtig« oder »zutreffend«. »Treffend« bewahrt den bitteren, ironischen Ton: Die Lüge trifft letztlich den Lügner selbst.'
- source_word: ἔψευσαι
  choice: hast gelogen
  rationale: Der griechische Aorist wird in der direkten Rede natürlich mit dem deutschen Perfekt wiedergegeben.
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: zu deinem eigenen Verderben
  rationale: Die Wendung beschreibt, dass die Schuld und ihre Folgen auf den Lügner selbst zurückfallen. Eine wörtliche Wiedergabe mit »gegen deinen eigenen Kopf« wäre im heutigen Deutsch missverständlich und unnatürlich.
- source_word: μένει
  choice: wartet schon
  rationale: μένω bezeichnet hier das Verharren in Bereitschaft. »Wartet schon« bringt sowohl die gegenwärtige Bereitschaft als auch die unmittelbar bevorstehende Vollstreckung zum Ausdruck.
- source_word: ὁ ἄγγελος τοῦ θεοῦ
  choice: der Engel Gottes
  rationale: Formnahe und im Deutschen geläufige Wiedergabe der griechischen Genitivverbindung.
- source_word: τὴν ῥομφαίαν ἔχων
  choice: das Schwert in der Hand
  rationale: Die natürliche deutsche Wendung erhält das anschauliche Bild des bewaffnet bereitstehenden Engels.
- source_word: πρίσαι … μέσον
  choice: mitten durchzusägen
  rationale: πρίζω bedeutet konkret »sägen«; μέσον bezeichnet die Teilung durch die Mitte. Die Wiedergabe erhält die drastische Bildsprache und wahrscheinlich auch das Wortspiel des Zusammenhangs.
- source_word: ἐξολεθρεύσῃ
  choice: vernichten
  rationale: Das starke Verb bezeichnet vollständige Beseitigung oder Vernichtung und verlangt eine entsprechend gewichtige deutsche Formulierung.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen ist ausdrücklich Plural und erweitert die Drohung vom unmittelbar angeredeten Ältesten auf beide Ältesten.
theological_decisions:
- issue: Bezugsbereich des abschließenden Plurals ὑμᾶς
  choice: Den Numeruswechsel im Haupttext ausdrücklich mit »dich … euch« wiedergeben.
  alternative: Den abschließenden Plural durch ein numerusneutrales »Sie« verdecken oder mit »euch beide« auslegen.
  rationale: Daniel spricht zunächst einen einzelnen Ältesten an, bezieht am Ende jedoch beide schuldigen Ältesten in das Vernichtungsurteil ein. Der auffällige Numeruswechsel gehört zum griechischen Text und soll nicht geglättet werden.
- issue: Zweck- oder Folgeverhältnis von ὅπως
  choice: Die beiden Infinitivgruppen mit »um … und …« als zusammengehörige Vollstreckungsabsicht formulieren.
  alternative: »sodass er euch vernichtet«
  rationale: Im Kontext bezeichnet ὅπως am natürlichsten den beabsichtigten Ausgang des angekündigten Gerichtshandelns; die deutsche Zweckkonstruktion lässt den engen Zusammenhang erkennen.
translation_notes:
  register: Moderne, würdige direkte Rede. Die drastische Gerichtsmetaphorik wird nicht abgeschwächt. »Treffend gelogen« erhält die Ironie von ὀρθῶς, während »zu deinem eigenen Verderben« die griechische Kopfwending idiomatisch erschließt.
