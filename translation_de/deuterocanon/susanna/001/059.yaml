review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die ironische Feststellung, die Gerichtsszene, das konkrete Zersägen und den abschließenden Plural im Wesentlichen zutreffend wieder. »wartet schon« fügt jedoch eine zeitliche Dringlichkeit hinzu, die μένει nicht ausdrücklich enthält. Die idiomatische Umschreibung »zu deinem eigenen Verderben« ist verständlich, lässt aber das im griechischen Bild ausdrücklich genannte »Haupt« entfallen.
  naturalness: Die direkte Rede ist modern und würdig. »steht bereit« ist für μένει idiomatischer und näher als »wartet schon«. Die Formulierung mit »auf dein eigenes Haupt« bewahrt die bildhafte, im biblischen Deutsch geläufige Wendung, ohne unverständlich zu werden.
  terminology: »Engel Gottes«, »Schwert«, »durchsägen« und »vernichten« entsprechen dem griechischen Register und der Aussage. Der Wechsel von Singular zu Plural wird im Haupttext richtig sichtbar gemacht und durch die Fußnote angemessen erklärt.
