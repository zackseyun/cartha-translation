base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/043.yaml
  text: You know that they testified falsely against me; and behold[a], I am dying, having done none of the things that these men wickedly contrived against me.
translation:
  language: de
  text: Du weißt, dass sie falsch gegen mich ausgesagt haben; und sieh, ich sterbe, ohne irgendetwas von dem getan zu haben, was diese Männer in ihrer Bosheit gegen mich ausgeheckt haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was diese Männer gegen mich geplant haben“ beziehungsweise „was sie mir in ihrer Bosheit angetan haben“. Das griechische Verb kann sowohl böswilliges Planen als auch böswilliges Handeln gegen Susanna bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασαι
  choice: du weißt
  rationale: Das Verb bezeichnet sicheres Wissen bzw. Kenntnis; in der direkten Anrede Gottes ist „du weißt“ natürlich und präzise.
- source_word: ψευδῆ … κατεμαρτύρησαν
  choice: sie haben falsch gegen mich ausgesagt
  rationale: Die Verbindung hat forensischen Sinn und bezeichnet eine falsche belastende Zeugenaussage.
- source_word: καὶ ἰδού
  choice: und nun
  rationale: ἰδού lenkt den Blick auf Susannas unmittelbar bevorstehendes Schicksal. „Und nun“ gibt diese aktuelle Zuspitzung in natürlichem, würdigem Deutsch wieder, ohne das heute markierte „siehe“ zu erzwingen.
- source_word: ἀποθνῄσκω
  choice: sterbe ich
  rationale: Das Präsens bezeichnet hier angesichts des Todesurteils den unmittelbar bevorstehenden Tod; „nun sterbe ich“ bewahrt die Dringlichkeit.
- source_word: μὴ ποιήσασα μηδὲν ὧν
  choice: ohne irgendetwas von dem getan zu haben, was
  rationale: Die verneinte Partizipialkonstruktion betont Susannas Unschuld, ohne ausdrücklich eine konzessive Beziehung hinzuzufügen.
- source_word: οὗτοι
  choice: diese Männer
  rationale: Das Demonstrativpronomen verweist im Kontext auf die männlichen Ankläger; die Explizierung ist im Deutschen natürlich.
- source_word: ἐπονηρεύσαντο κατ’ ἐμοῦ
  choice: in ihrer Bosheit gegen mich ausgeheckt haben
  rationale: Die Form bezeichnet böswilliges Handeln bzw. Planen gegen Susanna. „Ausgeheckt“ wahrt den Aspekt der Intrige, während „in ihrer Bosheit“ die moralische Färbung erhält.
theological_decisions:
- issue: Verhältnis der Partizipialkonstruktion zu Susannas bevorstehendem Tod
  choice: ohne irgendetwas von dem getan zu haben
  alternative: obwohl ich nichts von dem getan habe
  rationale: Die gewählte Fassung folgt der griechischen Partizipialkonstruktion enger und wahrt Susannas Unschuldsbeteuerung, ohne die logisch konzessive Beziehung stärker auszudeuten, als der Wortlaut verlangt.
- issue: Bedeutungsumfang von ἐπονηρεύσαντο
  choice: in ihrer Bosheit gegen mich ausgeheckt haben
  alternative: gegen mich geplant / mir in ihrer Bosheit angetan haben
  rationale: Im Zusammenhang falscher Zeugenaussage liegt böswilliges Ersinnen nahe. Da das Verb jedoch auch allgemeiner böswilliges Handeln bezeichnen kann, wird diese Bedeutungsbreite in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gebetsanrede bleibt schlicht und eindringlich; forensische Sprache und die moralische Färbung des griechischen Verbs werden erhalten. Der Fußnotenmarker steht im Haupttext.
