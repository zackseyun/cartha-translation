  text: And Daniel said to them[a], “Separate them far from one another, and I will examine them.”
translation:
  language: de
  text: 'Und Daniel sagte zu ihnen: »Trennt sie weit voneinander, und ich werde sie befragen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie verhören« oder »sie untersuchen«. Das griechische Verb kann eine gerichtliche Befragung oder Untersuchung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαχωρίσατε
  choice: Trennt
  rationale: Der Imperativ Plural bezeichnet die räumliche Trennung der beiden Ältesten; »trennt« ist direkt, natürlich und wahrt den gerichtlichen Zusammenhang.
- source_word: ἀπ᾽ ἀλλήλων
  choice: voneinander
  rationale: Die reziproke Wendung bezeichnet die gegenseitige Trennung und wird im Deutschen idiomatisch mit »voneinander« wiedergegeben.
- source_word: μακράν
  choice: weit
  rationale: Das Adverb verstärkt die geforderte räumliche Trennung; »weit voneinander« ist eine natürliche und genaue Wiedergabe.
- source_word: ἀνακρινῶ
  choice: werde ich sie verhören
  rationale: Das Futur von ἀνακρίνω bezeichnet hier eine gerichtliche Befragung oder Untersuchung. »Verhören« bildet den forensischen Charakter knapp und verständlich ab, ohne die mögliche Bedeutung »eingehend befragen/untersuchen« auszuschließen.
- source_word: Δανιήλ
  choice: Daniel
  rationale: Eingebürgerte deutsche Form des Personennamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und bestimmt; »weit voneinander« bewahrt die ausdrückliche Stärke von μακράν. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen gerichtlichen Ausdruck.
