  source_fidelity: Die Imperative und Zukunftsaussage sind zutreffend wiedergegeben. Das griechische καί verbindet die beiden Aussagen ohne eine ausdrücklich zeitliche Nuance; „und“ ist daher genauer als „dann“. „Verhören“ ist im gerichtlichen Kontext möglich, kann im heutigen Deutsch jedoch unnötig stark nach polizeilicher Vernehmung klingen. „Befragen“ bewahrt die lexikalische Offenheit von ἀνακρίνω; die gerichtliche Nuance wird in der Fußnote erläutert.
  naturalness: Die direkte Rede ist klar und würdig. „Trennt sie weit voneinander“ ist verständlich und idiomatisch. Die Ersetzung von „dann“ durch „und“ macht den Satz zugleich quellennäher, ohne die Natürlichkeit zu beeinträchtigen.
  terminology: Daniel ist die übliche deutsche Namensform. Für ἀνακρίνω ist „befragen“ als neutrale Grundwiedergabe vorzuziehen; „verhören“ und „untersuchen“ bleiben berechtigte kontextuelle Alternativen und werden in der Anmerkung genannt.
