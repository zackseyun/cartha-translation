translation:
  language: de
  text: 'Früher hast du ungerechte Urteile gefällt[a], die Unschuldigen verurteilt und die Schuldigen freigelassen, obwohl der Herr sagt[b]: »Einen Unschuldigen und Gerechten sollst du nicht töten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ungerechte Urteile richtend«. Im Griechischen stehen verwandte Wörter für »richten« und »Urteil« zur Hervorhebung nebeneinander.'
    reason: lexical_alternative
  - marker: b
    text: 'Das abschließende Zitat greift die Rechtssprache von 2. Mose 23,7 in der griechischen Überlieferung auf: Ein Unschuldiger und Gerechter soll nicht getötet werden.'
    reason: cross_reference
lexical_decisions:
- source_word: πρότερον
  choice: schon früher
  rationale: Die Wendung gibt den rückblickenden zeitlichen Sinn natürlich wieder; »schon« unterstreicht, dass es um das frühere Verhalten des Ältesten geht.
- source_word: κρίνων κρίσεις ἀδίκους
  choice: ungerechte Urteile gefällt
  rationale: Die feste deutsche Wendung »Urteile fällen« ist im gerichtlichen Zusammenhang natürlich. Die griechische figura etymologica wird in einer Fußnote kenntlich gemacht.
- source_word: τοὺς μὲν ἀθῴους κατακρίνων
  choice: die Unschuldigen verurteilt
  rationale: ἀθῷος bezeichnet Schuldlose, κατακρίνω ihre gerichtliche Verurteilung; die Wiedergabe ist klar und juristisch passend.
- source_word: ἀπολύων δὲ τοὺς αἰτίους
  choice: die Schuldigen freigelassen
  rationale: ἀπολύω kann gerichtlich »freilassen« oder »freisprechen« bedeuten. »Freigelassen« bewahrt die mögliche Weite des Ausdrucks, ohne ein förmliches Freispruchsurteil vorauszusetzen.
- source_word: λέγοντος τοῦ κυρίου
  choice: obwohl der Herr sagt
  rationale: Der Genitivus absolutus nennt das göttliche Gebot, dem das Verhalten widersprach. »Obwohl« macht diesen aus dem Zusammenhang hervorgehenden Gegensatz deutlich.
- source_word: Ἀθῷον καὶ δίκαιον
  choice: einen Unschuldigen und Gerechten
  rationale: Beide rechtlichen und sittlichen Bezeichnungen bleiben erhalten und beziehen sich grammatisch auf dieselbe Person.
- source_word: οὐκ ἀποκτενεῖς
  choice: sollst du nicht töten
  rationale: Im Rechtskontext bezeichnet das Verb das Töten beziehungsweise Hinrichten; die Gebotsform entspricht natürlichem deutschen Gesetzesstil.
theological_decisions:
- issue: Wiedergabe von κύριος im Schriftzitat
  choice: der Herr
  alternative: der HERR
  rationale: Übersetzt wird unmittelbar aus dem griechischen κύριος. »Der Herr« ist daher quellennah, ohne die hebräische Gottesnamenschreibung in den griechischen Text einzutragen.
- issue: Sinn von λέγοντος τοῦ κυρίου
  choice: obwohl der Herr sagt
  alternative: wie der Herr sagt
  rationale: Die konzessive Formulierung bringt den im Kontext liegenden Widerspruch zwischen dem früheren richterlichen Handeln und Gottes Gebot zum Ausdruck, ohne den Inhalt des Gebots zu erweitern.
- issue: Bezug von ἀθῷον καὶ δίκαιον
  choice: eine Person, die unschuldig und gerecht ist
  alternative: 'zwei Gruppen: die Unschuldigen und die Gerechten'
  rationale: Beide griechischen Adjektive stehen im Akkusativ Singular und beschreiben am natürlichsten dieselbe Person; die deutsche Formulierung wahrt beide Prädikate.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer gerichtlicher Begrifflichkeit. Die Reihung der früheren Verfehlungen bleibt knapp und anklagend; die wörtliche Eigenart der griechischen Wortwiederholung wird wegen deutscher Idiomatik in die Fußnote verlegt.
