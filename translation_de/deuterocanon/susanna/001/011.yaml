base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/011.yaml
  text: And when dawn came[a], they would come, stealing away from one another in haste, to see which of them would appear to her first and speak with her.
translation:
  language: de
  text: Und wenn es Morgen wurde, kamen sie heimlich und voreinander verborgen; jeder beeilte sich, sich ihr als Erster zu zeigen und mit ihr zu sprechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Sie bestahlen einander.“ Die ungewöhnliche griechische Wendung ist in ihrer genauen Bedeutung unsicher; wahrscheinlich beschreibt sie, dass sie voreinander verborgen und getrennt voneinander zu Susanna kamen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγίνετο ὄρθρος
  choice: sobald der Morgen anbrach
  rationale: ὄρθρος bezeichnet die frühe Morgenzeit; das Imperfekt ἐγίνετο zeichnet den wiederkehrenden zeitlichen Rahmen. „Sobald der Morgen anbrach“ gibt diesen Zusammenhang natürlich wieder.
- source_word: ἐρχόμενοι
  choice: kamen sie
  rationale: Das Partizip bezeichnet ihr wiederholtes Kommen. Zusammen mit dem imperfektischen Erzählrahmen ist im Deutschen eine finite Form am klarsten.
- source_word: ἔκλεπτον ἀλλήλους
  choice: heimlich, jeder für sich
  rationale: Die ungewöhnliche Wendung mit κλέπτω und ἀλλήλους bezeichnet hier kein gewöhnliches Bestehlen, sondern ein verstohlenes Vorgehen voreinander. Die Übersetzung gibt diesen wahrscheinlichen Sinn wieder, ohne eine konkrete Art der Täuschung festzulegen; die sprachliche Schwierigkeit wird in der Fußnote offengelegt.
- source_word: σπεύδοντες
  choice: jeder beeilte sich
  rationale: σπεύδω bezeichnet hier angesichts des Wettstreits vor allem Eile. Die finite deutsche Form verbindet sich natürlich mit dem folgenden indirekten Fragesinn.
- source_word: τίς φανήσεται αὐτῇ πρότερος
  choice: sich ihr als Erster zu zeigen
  rationale: φανήσεται wird intransitiv im Sinn von „erscheinen/sich zeigen“ gebraucht; πρότερος bezeichnet den Vorrang des einen vor dem anderen.
- source_word: λαλήσει πρὸς αὐτήν
  choice: mit ihr zu sprechen
  rationale: λαλέω mit πρός bezeichnet an sie gerichtetes Reden. „Mit ihr sprechen“ ist im Deutschen natürlich und lässt eine mögliche Erwiderung offen, ohne sie ausdrücklich vorauszusetzen.
