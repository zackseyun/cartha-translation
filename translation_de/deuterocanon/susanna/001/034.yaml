lexical_decisions:
- source_word: ἀναστάντες
  choice: standen … auf
  rationale: Das Aoristpartizip führt in erzählender Folge zur nächsten Handlung; die finite deutsche Form ist natürlich und bewahrt die körperliche beziehungsweise gerichtliche Handlung.
- source_word: οἱ πρεσβύτεροι
  choice: die Ältesten
  rationale: Gemeint sind anerkannte führende Männer der Gemeinschaft, nicht lediglich ältere Männer.
- source_word: κριταὶ
  choice: Richter
  rationale: Das Wort bezeichnet Personen in richterlicher Funktion; „Richter“ ist direkt und allgemein verständlich.
- source_word: ἐπέθηκαν τὰς χεῖρας αὐτῶν
  choice: legten ihre Hände
  rationale: Die Wendung gibt die konkrete körperliche Geste nah am Griechischen wieder, ohne ihr zusätzliche sakramentale Bedeutung zu verleihen.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτῆς
  choice: auf Susannas Kopf
  rationale: Der Name ersetzt das im Deutschen potenziell mehrdeutige Pronomen „ihren“ und bezeichnet dieselbe weibliche Bezugsperson ausdrücklich.
theological_decisions:
- issue: Mögliche rituelle oder sakramentale Nebenbedeutung des Handauflegens
  choice: 'als konkrete gerichtliche Geste formuliert: „legten ihre Hände auf Susannas Kopf“'
  alternative: „legten ihr die Hände auf den Kopf“
  rationale: Der griechische Text berichtet zunächst eine konkrete Handlung im Gerichtsverfahren. Die gewählte Form bewahrt die Geste, ohne spätere kirchliche Vorstellungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ bildet die narrative Folge ab; die Satzstellung bleibt flüssig und nahe an der griechischen Handlungskette.
