base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/017.yaml
  text: And it happened[a], while they were watching for an opportune day, that she once entered, as yesterday and the third day before, with only two young maids, and desired to bathe in the garden, because it was hot.
translation:
  language: de
  text: Während sie nun auf einen günstigen Tag lauerten, geschah es, dass sie eines Tages wie schon gestern und vorgestern[a] nur mit zwei jungen Dienerinnen in den Garten ging und dort baden wollte, denn es war heiß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen eine ungewöhnliche Wendung: „wie gestern und am dritten Tag“. Mit „dem dritten Tag“ ist nach inklusiver Zählweise wahrscheinlich vorgestern gemeint; möglich ist auch die allgemeinere Wiedergabe „wie an den vorherigen Tagen“.'
    reason: Die griechische Zeitangabe ist sprachlich auffällig. Die Anmerkung dokumentiert ihren Wortlaut und erläutert die wahrscheinliche idiomatische Bedeutung.
lexical_decisions:
- source_word: ἐγένετο
  choice: geschah es
  rationale: Bewahrt die griechische Erzählformel in natürlichem, nicht altertümlichem Deutsch.
- source_word: παρατηρεῖν
  choice: lauerten
  rationale: Der Kontext legt ein gezieltes, feindseliges Beobachten nahe; das Verb bleibt auf das Abpassen des Zeitpunkts bezogen.
- source_word: ἡμέραν εὔθετον
  choice: einen günstigen Tag
  rationale: Bezeichnet einen für ihr Vorhaben geeigneten Zeitpunkt; „günstig“ gibt die berechnende Absicht knapp wieder.
- source_word: εἰσῆλθέν ποτε
  choice: sie eines Tages … in den Garten ging
  rationale: ποτε markiert eine bestimmte Gelegenheit; die deutsche Wortstellung verbindet dies idiomatisch mit dem Eintreten.
- source_word: καθὼς ἐχθὲς καὶ τρίτης ἡμέρας
  choice: wie am Tag zuvor und zwei Tage zuvor
  rationale: Gibt die auffällige zeitliche Vergleichsformel relativ eng wieder, ohne sie pauschal zu „an den vorherigen Tagen“ zu glätten.
- source_word: μετὰ δύο μόνων κορασίων
  choice: nur mit zwei jungen Dienerinnen
  rationale: κοράσια bezeichnet hier aufgrund des Haushaltskontexts junge weibliche Bedienstete; „Dienerinnen“ macht ihre Rolle deutlich.
- source_word: ἐπεθύμησε λούσασθαι
  choice: baden wollte
  rationale: Das Verb bezeichnet hier einen Wunsch beziehungsweise eine Absicht; „wollte baden“ ist natürlich und angemessen zurückhaltend.
- source_word: ἐν τῷ παραδείσῳ
  choice: in den Garten … dort
  rationale: παράδεισος meint den umschlossenen Garten des Anwesens, nicht das theologische Paradies. „dort“ ordnet im Deutschen den Ort idiomatisch dem Baden zu.
- source_word: ὅτι καῦμα ἦν
  choice: denn es war heiß
  rationale: Gibt den begründenden Satz mit dem Substantiv καῦμα in natürlichem Deutsch wieder.
