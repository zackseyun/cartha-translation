translation:
  language: de
  text: in hohem Maße[a] und den Herrn fürchtend; ihre Eltern waren gerecht und unterrichteten ihre Tochter nach dem Gesetz des Mose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sehr“; das Wort führt die Beschreibung Susannas aus dem vorausgehenden Satzteil fort.'
    reason: Der Vers beginnt im griechischen Text mit einem rückbezüglichen Adverb, dessen verstärkte Eigenschaft erst aus dem vorangehenden Zusammenhang hervorgeht.
lexical_decisions:
- source_word: σφόδρα
  choice: in hohem Maß
  rationale: Das Adverb verstärkt eine im vorausgehenden Satzteil genannte Eigenschaft Susannas. Die Wiedergabe bewahrt diese rückbezügliche, für sich genommen unvollständige Aussage, ohne die fehlende Eigenschaft zu ergänzen.
- source_word: φοβουμένη
  choice: den Herrn fürchtend
  rationale: Das Partizip bezeichnet hier ehrfürchtige Gottesfurcht. Die relativ formale Wiedergabe erhält sowohl die Grundbedeutung als auch die syntaktische Verbindung mit dem vorausgehenden Satzteil.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Da κύριος im griechischen Ausgangstext als Gottesbezeichnung steht, ist „der Herr“ die quellennahe und im Deutschen übliche Wiedergabe.
- source_word: γονεῖς
  choice: Eltern
  rationale: Der Plural bezeichnet Susannas Vater und Mutter gemeinsam; „Eltern“ ist präzise und natürlich.
- source_word: δίκαιοι
  choice: gerecht
  rationale: „Gerecht“ bewahrt den ethisch-religiösen Gehalt des Begriffs und vermeidet eine Verengung auf bloße Rechtschaffenheit.
- source_word: ἐδίδαξαν
  choice: unterrichteten
  rationale: Das Verb bezeichnet die Unterweisung der Tochter. „Unterrichteten“ klingt in diesem Zusammenhang natürlicher als das mögliche, aber weniger idiomatische „lehrten“.
- source_word: τὴν θυγατέρα αὐτῶν
  choice: ihre Tochter
  rationale: Die familiäre Beziehung wird entsprechend dem griechischen Wortlaut ausdrücklich beibehalten.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: nach dem Gesetz des Mose
  rationale: κατά mit Akkusativ bezeichnet hier den Maßstab, an dem sich die Unterweisung orientierte. „Nach dem Gesetz des Mose“ ist knapp, idiomatisch und sachlich genau.
theological_decisions:
- issue: Wiedergabe von κύριος als Gottesbezeichnung
  choice: der Herr
  alternative: der HERR
  rationale: Der griechische Text bietet κύριος und nicht unmittelbar den hebräischen Gottesnamen. „Der Herr“ folgt daher der vorliegenden Sprachquelle, ohne eine nicht sichtbare hebräische Form einzutragen.
- issue: Charakterisierung der Eltern mit δίκαιοι
  choice: gerecht
  alternative: rechtschaffen
  rationale: „Gerecht“ erhält die biblische moralisch-religiöse Bedeutungsweite; „rechtschaffen“ wäre verständlich, würde den möglichen theologischen Klang jedoch abschwächen.
- issue: Bedeutung der Gottesfurcht in φοβουμένη τὸν κύριον
  choice: den Herrn fürchtend
  alternative: gottesfürchtig
  rationale: Die gewählte Fassung bewahrt Verbform und ausdrückliches Objekt. Sie legt die Wendung nicht vorschnell ausschließlich als allgemeine Charaktereigenschaft aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der ungewöhnlich fragmentarische Anfang wurde bewusst erhalten, weil er syntaktisch an den vorausgehenden Satzteil anschließt. Das Semikolon bildet die enge Verbindung der griechischen Satzglieder ab, ohne einen unnatürlich langen deutschen Satz zu erzeugen.
