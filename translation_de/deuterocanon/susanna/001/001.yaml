base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/001.yaml
  text: There was a man living in Babylon[a], and his name was Joakim.
translation:
  language: de
  text: In Babylon lebte ein Mann; sein Name war Joakim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird der Name im Deutschen oft mit „Joachim“ wiedergegeben. Im Griechischen lautet er Ἰωακείμ; „Joakim“ bildet diese Form unmittelbarer ab.
    reason: lexical_alternative
lexical_decisions:
- source_word: ΚΑΙ ἦν ἀνὴρ
  choice: In Babylon lebte ein Mann
  rationale: Die griechische Einführungsformel stellt eine neue Person vor. Die deutsche Wortstellung mit vorangestellter Ortsangabe klingt natürlich und gibt ἦν zusammen mit dem Partizip οἰκῶν als „lebte“ wieder. Das einleitende καί markiert hier vor allem den Erzählfortgang und muss im modernen Deutschen nicht eigens mit „Und“ wiedergegeben werden.
- source_word: οἰκῶν ἐν Βαβυλῶνι
  choice: In Babylon lebte
  rationale: οἰκέω bezeichnet hier den Wohn- oder Aufenthaltsort. „lebte“ ist im erzählenden Zusammenhang natürlicher als das gehobenere „wohnte“ oder „hielt sich auf“.
- source_word: ὄνομα αὐτῷ
  choice: sein Name war
  rationale: Die griechische Namensformel wird mit der entsprechenden idiomatischen deutschen Wendung wiedergegeben.
- source_word: Ἰωακείμ
  choice: Joakim
  rationale: „Joakim“ bildet den griechischen Personennamen für deutsche Leser transparent ab, ohne ihn an die traditionell eingedeutschte Form „Joachim“ anzugleichen.
theological_decisions:
- issue: Transliteration des Personennamens gegenüber der traditionellen deutschen Namensform
  choice: Joakim
  alternative: Joachim
  rationale: Da es sich um einen Personennamen handelt, wird die griechische Form möglichst transparent wiedergegeben. Die traditionelle Form bleibt in der Fußnote sichtbar; eine lehrmäßige Frage ist damit nicht verbunden.
translation_notes:
  register: Knapper, würdiger moderner Erzählstil. Das Semikolon bewahrt die zwei einfachen griechischen Aussagen, ohne die im Deutschen schwerfällige Wiederholung von „und“ zu erzwingen.
