  yaml_path: translation/deuterocanon/susanna/001/025.yaml
  text: It is preferable for me to fall into your hands without doing it rather than to sin before the Lord[a].
translation:
  language: de
  text: Es ist mir lieber, ohne es getan zu haben, in eure Hände zu fallen, als vor dem Herrn zu sündigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ohne [es] getan zu haben“. Der griechische Text lässt die Handlung unausgesprochen und verweist damit auf die Forderung der Ältesten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετόν μοί ἐστιν
  choice: Es ist mir lieber
  rationale: Die Wendung bezeichnet die persönliche Bevorzugung einer Möglichkeit gegenüber einer anderen; „Es ist mir lieber“ ist natürliches, gegenwärtiges Deutsch und bewahrt den Vergleich.
- source_word: μὴ πράξασαν
  choice: ohne es getan zu haben
  rationale: Das Aoristpartizip bezeichnet die unterlassene, zuvor verlangte Handlung. Das ergänzte „es“ verweist knapp auf den Kontext, ohne die Handlung näher auszudeuten.
- source_word: ἐμπεσεῖν εἰς τὰς χεῖρας ὑμῶν
  choice: in eure Hände zu fallen
  rationale: Die geläufige Metapher für das Geraten in fremde Gewalt lässt sich im Deutschen unmittelbar bewahren.
- source_word: ἢ
  choice: als
  rationale: Nach dem Komparativ „lieber“ gibt „als“ die Gegenüberstellung idiomatisch wieder.
- source_word: ἁμαρτεῖν
  choice: zu sündigen
  rationale: „Sündigen“ entspricht dem religiös-ethischen Gewicht des Verbs, besonders in Verbindung mit dem Herrn.
- source_word: ἐνώπιον Κυρίου
  choice: vor dem Herrn
  rationale: Die Formulierung bewahrt den Gedanken des Handelns in Gottes Gegenwart und unter seiner Beurteilung knapp und würdig.
theological_decisions:
- issue: Ob die von den Ältesten verlangte Handlung ausdrücklich benannt werden soll
  choice: Die Handlung bleibt im Haupttext mit „es“ unausgesprochen.
  alternative: „mich euch hinzugeben“ oder „diese Sünde zu begehen“
  rationale: Der griechische Text setzt die Handlung aus dem Zusammenhang voraus, benennt sie aber nicht. Eine nähere Bestimmung würde die bewusste Zurückhaltung des Wortlauts interpretierend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem griechischen Gedankengang, bleibt aber idiomatisch; die traditionelle und weiterhin verständliche Metapher „in eure Hände fallen“ wird beibehalten.
