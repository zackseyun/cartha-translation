lexical_decisions:
- source_word: κλαίουσα
  choice: weinend
  rationale: Das präsentische Partizip beschreibt Susannas anhaltenden Zustand knapp und natürlich.
- source_word: ἀνέβλεψεν εἰς τὸν οὐρανόν
  choice: blickte sie zum Himmel auf
  rationale: Die Wendung gibt sowohl die Aufwärtsrichtung des Verbs als auch das Ziel εἰς τὸν οὐρανόν idiomatisch wieder.
- source_word: οὐρανόν
  choice: Himmel
  rationale: Im Zusammenhang ihres Vertrauens auf Gott ist die religiöse Bedeutung »Himmel« gegenüber dem rein sichtbaren »Firmament« oder »Himmelsraum« angemessen.
- source_word: καρδία
  choice: Herz
  rationale: »Herz« bezeichnet hier wie im Griechischen die innere Person und den Sitz des Vertrauens.
- source_word: πεποιθυῖα
  choice: vertraute
  rationale: Das Perfektpartizip bezeichnet einen gefestigten, fortdauernden Zustand des Vertrauens. Das deutsche Präteritum ist im erzählenden Kontext natürlich; die Zustandsbedeutung ergibt sich aus der Wendung.
- source_word: ἐπὶ Κυρίῳ
  choice: auf den Herrn
  rationale: Bei πεποιθέναι mit ἐπί gibt »auf jemanden vertrauen« den Gegenstand beziehungsweise die Grundlage des Vertrauens idiomatisch und eng am Griechischen wieder.
theological_decisions:
- issue: Wiedergabe von Κυρίῳ in einer griechischen deuterokanonischen Erzählung
  choice: dem Herrn
  alternative: dem HERRN
  rationale: Der vorliegende griechische Text bietet κύριος, ohne an dieser Stelle unmittelbar einen hebräischen Gottesnamen auszuweisen. Daher wird die normale deutsche Gottesbezeichnung »der Herr« verwendet, ohne durch Kapitälchen eine nicht ausdrücklich belegte Identifikation einzutragen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die knappe Satzstruktur des Griechischen bleibt erhalten; »Weinend« bewahrt die Gleichzeitigkeit, während »vertraute auf« den gefestigten Vertrauenszustand natürlich ausdrückt.
