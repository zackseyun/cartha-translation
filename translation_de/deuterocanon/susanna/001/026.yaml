  register: Modernes, würdevolles Standarddeutsch. Die Satzbewegung wahrt die erzählerische Dringlichkeit; unbestimmte Personenbezeichnungen und die bauliche Mehrdeutigkeit des Zugangs werden nicht überpräzisiert.
