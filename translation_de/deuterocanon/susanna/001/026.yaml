base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/026.yaml
  text: But when those from the house heard the outcry in the garden[a], they rushed in through the side door to see what had happened to her.
translation:
  language: de
  text: Als aber die Leute aus dem Haus das Geschrei im Garten hörten, stürmten sie durch die Seitentür[a] hinein, um zu sehen, was ihr zugestoßen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch das Seitentor«; die griechische Wendung kann einen seitlichen Zugang bezeichnen, ohne die genaue bauliche Form festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγή
  choice: Geschrei
  rationale: Das Wort bezeichnet einen lauten, alarmierenden Ruf; »Geschrei« gibt die Dringlichkeit der Szene in natürlichem Deutsch wieder.
- source_word: παράδεισος
  choice: Garten
  rationale: Im Erzählzusammenhang ist der umfriedete Garten beim Haus gemeint, nicht das Paradies im theologischen Sinn.
- source_word: οἱ ἐκ τῆς οἰκίας
  choice: die Leute aus dem Haus
  rationale: Die Formulierung lässt offen, ob es sich um Angehörige, Bedienstete oder andere Personen des Hauses handelt.
- source_word: εἰσεπήδησαν
  choice: stürmten ... hinein
  rationale: Das Verb bezeichnet eine plötzliche, energische Bewegung nach innen; die gewählte Formulierung ist im modernen Deutsch natürlich und bewahrt die Dringlichkeit.
- source_word: πλαγία θύρα
  choice: Seitentür
  rationale: Die Wendung bezeichnet einen seitlichen Zugang; θύρα kann je nach baulichem Zusammenhang sowohl Tür als auch Tor bedeuten.
- source_word: τὸ συμβεβηκὸς αὐτῇ
  choice: was ihr zugestoßen war
  rationale: Die Wendung gibt idiomatisch ein bereits eingetretenes Ereignis wieder und wahrt den Bezug auf Susanna.
