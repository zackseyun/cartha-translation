translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist bewusst idiomatisch formuliert; das Singularverb ἐπέστρεψεν beim Kollektiv πᾶς ὁ λαός wird ebenfalls singularisch wiedergegeben, während εἶπαν im Deutschen natürlich mit dem kollektiv bezogenen Singular „fragte“ erscheint.
