base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/047.yaml
  text: Then all the people turned to him and said[a], “What is this word that you have spoken?”
translation:
  language: de
  text: 'Da wandte sich das ganze Volk ihm zu, und alle sagten[a]: „Was ist das für ein Wort, das du gesagt hast?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was ist das für eine Aussage, die du gemacht hast?“ Das griechische Wort λόγος kann „Wort“, „Aussage“ oder „Sache“ bedeuten.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: wandte sich … zu
  rationale: Mit πρὸς αὐτόν bezeichnet das Verb eine Hinwendung zu Daniel; die deutsche Wendung gibt die Richtung natürlich wieder, ohne eine vorherige Entfernung vorauszusetzen.
- source_word: πᾶς ὁ λαός
  choice: das ganze Volk
  rationale: Die Formulierung bewahrt die umfassende Bedeutung von πᾶς und bezeichnet die versammelte Volksmenge kollektiv.
- source_word: πρὸς αὐτόν
  choice: ihm zu
  rationale: Bei einem Verb der Hinwendung wird die durch πρὸς ausgedrückte Richtung im Deutschen idiomatisch mit „sich jemandem zuwenden“ wiedergegeben.
- source_word: Τίς ὁ λόγος οὗτος ὃν σὺ λελάληκας;
  choice: Was meinst du mit dem, was du da gesagt hast?
  rationale: Die Frage zielt im Zusammenhang auf den Sinn beziehungsweise die Bedeutung von Daniels unmittelbar vorausgegangener Äußerung. Diese natürliche deutsche Formulierung gibt λόγος als konkrete Aussage wieder; „da“ entspricht dem hinweisenden οὗτος, und „gesagt hast“ wahrt die gegenwärtige Relevanz des griechischen Perfekts.
