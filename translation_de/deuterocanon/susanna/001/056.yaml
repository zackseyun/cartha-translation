base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/056.yaml
  text: And after removing him[a], he ordered the other one to be brought forward. And he said to him, “Offspring of Canaan and not Judah, beauty has deceived you[b], and desire has corrupted your heart.”
translation:
  language: de
  text: 'Nachdem er ihn hatte wegführen lassen[a], befahl er, den anderen vorzuführen. Zu ihm sagte er: »Nachkomme Kanaans und nicht Judas! Die Schönheit hat dich getäuscht, und Begierde[b] hat dein Herz verdreht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: hatte ihn beiseiteführen lassen.'
    reason: Die genaue Art der räumlichen Trennung wird im griechischen Ausdruck nicht näher bestimmt.
  - marker: b
    text: 'Oder: Verlangen; auch: Lust.'
    reason: Das griechische Wort kann allgemein ein starkes Verlangen bezeichnen, meint hier im Zusammenhang jedoch unerlaubtes sexuelles Begehren.
lexical_decisions:
- source_word: μεταστήσας αὐτόν
  choice: Nachdem er ihn hatte wegführen lassen
  rationale: Die Form bezeichnet im Verhörzusammenhang, dass der erste Älteste entfernt beziehungsweise beiseitegebracht wird. Die deutsche Wiedergabe bleibt hinsichtlich des genauen Ortes offen.
- source_word: ἐκέλευσεν προσαγαγεῖν τὸν ἕτερον
  choice: befahl er, den anderen vorzuführen
  rationale: 'Die Formulierung gibt den gerichtlichen Vorgang knapp und idiomatisch wieder: Der andere der beiden Männer soll zur Befragung herbeigebracht werden.'
- source_word: Σπέρμα Χανάαν καὶ οὐκ Ἰούδα
  choice: Nachkomme Kanaans und nicht Judas
  rationale: „Nachkomme“ bewahrt die Abstammungssprache von σπέρμα, klingt im heutigen Deutsch aber natürlicher als das wörtliche „Same“. Der scharfe Gegensatz zwischen Kanaan und Juda bleibt erhalten.
- source_word: τὸ κάλλος ἐξηπάτησέν σε
  choice: Die Schönheit hat dich getäuscht
  rationale: Die Übersetzung wahrt sowohl die personifizierende Ausdrucksweise als auch die Aussage, dass Schönheit den Angeredeten in die Irre geführt hat.
- source_word: ἐπιθυμία
  choice: Begierde
  rationale: Im Kontext ist ein moralisch verwerfliches sexuelles Begehren gemeint. „Begierde“ bringt diese Färbung zum Ausdruck, ohne den Begriff auf eine bestimmte Handlung einzuengen.
- source_word: διέστρεψεν τὴν καρδίαν σου
  choice: hat dein Herz verdreht
  rationale: „Verdreht“ bewahrt das anschauliche Bild innerer Verzerrung in διαστρέφω und ist zugleich verständliches modernes Deutsch.
theological_decisions:
- issue: Abstammungsbezogene Anklage „Nachkomme Kanaans und nicht Judas“
  choice: Die genealogische Metapher wird unmittelbar beibehalten.
  alternative: Du handelst wie ein Kanaaniter und nicht wie einer aus Juda.
  rationale: Der griechische Text formuliert eine scharfe Anrede in Abstammungssprache. Eine bloße Umschreibung des Verhaltens würde den rhetorischen und bundestheologischen Gegensatz abschwächen.
- issue: Moralische Bedeutung von ἐπιθυμία
  choice: Begierde
  alternative: Verlangen; Lust
  rationale: Der Zusammenhang kennzeichnet das Begehren eindeutig als unerlaubt. „Begierde“ bewahrt dennoch die Spannung zwischen dem allgemeineren Wortwert und seiner klar negativen Bedeutung an dieser Stelle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem gerichtlichem Erzählstil. Die direkte Anklage bleibt scharf und die bildhafte Rede vom „verdrehten“ Herzen wird nicht geglättet.
