base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/027.yaml
  text: But when the elders spoke their words[a], the servants were greatly ashamed, because never had such a thing been said about Susanna.
translation:
  language: de
  text: Als aber die Ältesten ihre Worte vorbrachten, schämten sich die Diener sehr; denn noch nie war etwas Derartiges über Susanna gesagt worden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡνίκα δὲ
  choice: Als aber
  rationale: ἡνίκα leitet einen temporalen Nebensatz ein, während δέ den Fortgang der Erzählung mit leichtem Gegensatz markiert.
- source_word: οἱ πρεσβῦται
  choice: die Ältesten
  rationale: Im Kontext bezeichnet πρεσβῦται nicht nur alte Männer, sondern anerkannte Gemeindeleiter beziehungsweise Richter.
- source_word: τοὺς λόγους αὐτῶν
  choice: ihre Aussage
  rationale: λόγοι bezeichnet hier das von den Ältesten Vorgebrachte. Der Singular als Kollektivbegriff ist im Deutschen natürlicher als „ihre Worte“, ohne bereits ausdrücklich „Anklage“ zu sagen.
- source_word: κατῃσχύνθησαν ... σφόδρα
  choice: schämten sich ... sehr
  rationale: Die Form bezeichnet das Empfinden von Scham; σφόδρα verstärkt dieses deutlich.
- source_word: οἱ δοῦλοι
  choice: die Diener
  rationale: Im Haushalt bezeichnet δοῦλοι die Bediensteten; „Diener“ ist hier kontextgerecht, ohne ihren genauen Rechtsstatus festzulegen.
- source_word: ὅτι πώποτε οὐκ ἐρρέθη
  choice: denn noch nie war ... gesagt worden
  rationale: ὅτι gibt den Grund an, und οὐκ mit πώποτε bedeutet „noch nie/niemals zuvor“. Das Plusquamperfekt bildet den Rückblick natürlich ab.
- source_word: λόγος τοιοῦτος
  choice: etwas Derartiges
  rationale: Die Wendung meint eine solche Äußerung oder Behauptung. „Etwas Derartiges“ klingt im Deutschen natürlich und bewahrt die inhaltliche Unbestimmtheit.
- source_word: περὶ Σουσάννης
  choice: über Susanna
  rationale: περί mit Genitiv bedeutet grundlegend „über/betreffend“; „gegen Susanna“ würde den anklagenden Kontext stärker explizieren als der Wortlaut.
