lexical_decisions:
- source_word: τῷ πλησίον
  choice: dem Nächsten
  rationale: Der Dativ wird formal knapp wiedergegeben. Die Wendung hängt syntaktisch vom vorherigen Vers ab; der Fußnotenhinweis bietet deshalb eine im Deutschen idiomatisch ergänzte Lesart.
- source_word: ποιῆσαι
  choice: zu tun
  rationale: Der grundlegende Handlungsinfinitiv bewahrt die formale Nähe zum griechischen Ausdruck und zur anschließenden Rechtsformel.
- source_word: κατὰ τὸν νόμον Μωϋσῆ
  choice: nach dem Gesetz des Mose
  rationale: Eine natürliche und zugleich quellnahe deutsche Wiedergabe der üblichen rechtlichen Formel.
- source_word: ἀπέκτειναν αὐτούς
  choice: sie töteten sie
  rationale: Gibt Verb und Pronomen direkt wieder. Der gerichtliche Zusammenhang ist aus dem Text erkennbar, ohne durch das modern-technische »hinrichten« stärker festgelegt zu werden.
- source_word: ἐσώθη αἷμα ἀναίτιον
  choice: unschuldiges Blut blieb verschont
  rationale: Die idiomatische deutsche Formulierung bezeichnet die Abwendung ungerechten Blutvergießens und bewahrt zugleich das biblische Bild vom unschuldigen Blut.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: an jenem Tag
  rationale: Idiomatiche moderne deutsche Zeitangabe mit leicht gehobenem, erzählerischem Klang.
theological_decisions:
- issue: Gerichtliche Nuance von ἀπέκτειναν
  choice: sie töteten sie
  alternative: sie richteten sie hin
  rationale: Der Zusammenhang beschreibt die Vollstreckung eines Urteils nach dem Gesetz des Mose. Die gewählte Form bleibt jedoch beim allgemeinen Bedeutungsumfang des griechischen Verbs und vermeidet eine unnötig moderne technische Festlegung.
- issue: Bildhafte Aussage ἐσώθη αἷμα ἀναίτιον
  choice: unschuldiges Blut blieb verschont
  alternative: unschuldiges Blut wurde gerettet
  rationale: Gemeint ist, dass die Tötung eines unschuldigen Menschen verhindert wurde. »Blieb verschont« ist im Deutschen verständlich, ohne das gewichtige biblische Bild in eine rein abstrakte Aussage aufzulösen.
