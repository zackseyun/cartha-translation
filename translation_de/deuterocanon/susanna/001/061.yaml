base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/061.yaml
  text: And they rose up against the two elders, because Daniel had convicted them from their own mouth of being false witnesses, and they did to them as they had maliciously planned to do.
translation:
  language: de
  text: Da erhoben sie sich gegen die beiden Ältesten, denn Daniel hatte sie aufgrund ihrer eigenen Aussagen als falsche Zeugen überführt.[a] Und sie taten ihnen an, was diese in böser Absicht geplant hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ihrem eigenen Mund als falsche Zeugen überführt“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die entsprechende Strafe für das Unrecht, das die Ältesten geplant hatten; das Opfer ihres Plans wird in diesem Versabschnitt nicht nochmals ausdrücklich genannt.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέστησαν ἐπὶ
  choice: erhoben sie sich gegen
  rationale: Die Verbindung bezeichnet hier ein feindliches beziehungsweise gerichtliches Vorgehen gegen die Ältesten; die Wiedergabe bewahrt zugleich das Bild des Aufstehens.
- source_word: πρεσβύτας
  choice: Ältesten
  rationale: Gemeint sind nicht bloß alte Männer, sondern Männer mit anerkannter Autorität in der Gemeinschaft und im Gericht.
- source_word: συνέστησεν
  choice: hatte … überführt
  rationale: Daniel hatte durch die widersprüchlichen Aussagen ihre Schuld erwiesen. „Überführt“ entspricht dem rechtlichen Zusammenhang, ohne einen förmlichen Schuldspruch vorwegzunehmen.
- source_word: ἐκ τοῦ στόματος αὐτῶν
  choice: aufgrund ihrer eigenen Aussagen
  rationale: Die wörtliche Wendung „aus ihrem eigenen Mund“ bezeichnet ihre eigenen gesprochenen Zeugenaussagen. Die gewählte Form ist im modernen Deutschen natürlich und erhält den forensischen Sinn.
- source_word: ψευδομάρτυρας ὄντας
  choice: als falsche Zeugen
  rationale: ψευδομάρτυρες ist ein spezifisch rechtlicher Ausdruck und bezeichnet falsche Zeugen, nicht lediglich Lügner.
- source_word: ἐποίησαν … τὸν τρόπον
  choice: sie taten ihnen an, was
  rationale: Die Wendung stellt eine Entsprechung zwischen dem geplanten Unrecht und der an den Tätern vollzogenen Strafe her. Die deutsche Form gibt diese Beziehung klar wieder.
- source_word: ἐπονηρεύσαντο
  choice: in böser Absicht geplant hatten
  rationale: Die mediale Verbform bezeichnet hier ihren böswilligen Plan; die Wiedergabe macht sowohl die Absicht als auch deren moralische Qualität deutlich.
theological_decisions:
- issue: Vergeltende Gerechtigkeit bei falschem Zeugnis
  choice: Die Ältesten erleiden, was sie selbst in böser Absicht geplant hatten.
  alternative: 'Wörtlicher und undeutlicher: „Sie handelten an ihnen nach der Weise, wie sie Böses ersonnen hatten.“'
  rationale: Der Satz bringt die rechtliche Entsprechung zwischen beabsichtigtem Unrecht und Strafe zum Ausdruck. Die Formulierung wahrt diesen Sinn, ohne den Wortlaut eines anderen Gesetzestextes ausdrücklich einzufügen.
- issue: Nicht ausdrücklich genanntes Opfer des Plans
  choice: Das Objekt des böswilligen Plans bleibt im Haupttext unausgesprochen.
  alternative: „… was diese Susanna in böser Absicht hatten antun wollen.“
  rationale: Aus dem Erzählzusammenhang ist Susanna eindeutig gemeint, doch im vorgelegten griechischen Versabschnitt wird ihr Name in der Schlussklausel nicht ausdrücklich genannt. Die Übersetzung ergänzt ihn daher nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Sprache bleibt verständlich; „Älteste“, „falsche Zeugen“ und „überführt“ bewahren den gerichtlichen Kontext. Das mehrdeutige beziehungsweise elliptische Ende des überlieferten griechischen Wortlauts wird klar, aber ohne ausdrückliche Ergänzung des Namens Susanna wiedergegeben.
