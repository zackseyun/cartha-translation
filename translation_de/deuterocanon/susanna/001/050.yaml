base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/050.yaml
  text: And all the people returned with haste. And the elders said to him[a], “Come, sit in our midst and tell us, for God has given you eldership.”
translation:
  language: de
  text: 'Da kehrte das ganze Volk eilig zurück. Die Ältesten sagten zu ihm: »Komm, setz dich in unsere Mitte und berichte uns; denn Gott hat dir den Rang eines Ältesten[a] gegeben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Würde eines Ältesten«, »Vorrang« oder »eine Ehrenstellung«. Das griechische Wort bezeichnet Seniorität oder einen ehrenvollen Rang; hier ist anerkannte Autorität gemeint, nicht ein hohes Lebensalter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: kehrte … zurück
  rationale: Das Verb bezeichnet hier die Umkehr beziehungsweise Rückkehr des Volkes. Die gewählte Formulierung ist im modernen Deutschen natürlich und bewahrt die Richtungsänderung.
- source_word: μετὰ σπουδῆς
  choice: eilig
  rationale: σπουδή kann Eile, Eifer oder Ernsthaftigkeit bezeichnen. Da es hier um die unmittelbare Bewegung des Volkes geht, steht die zeitliche Dringlichkeit im Vordergrund.
- source_word: οἱ πρεσβύτεροι
  choice: die Ältesten
  rationale: Im gerichtlichen und gemeinschaftlichen Zusammenhang sind anerkannte führende Männer gemeint, nicht lediglich Männer höheren Alters.
- source_word: Δεῦρο
  choice: Komm
  rationale: Das Wort dient hier als knappe Aufforderung, näher zu kommen.
- source_word: ἐν μέσῳ ἡμῶν
  choice: in unsere Mitte
  rationale: 'Die Wendung hat räumliche und soziale Bedeutung: Daniel soll einen zentralen Platz innerhalb der Versammlung einnehmen.'
- source_word: ἀνάγγειλον ἡμῖν
  choice: berichte uns
  rationale: ἀναγγέλλω bezeichnet das Mitteilen oder Berichten. Die Formulierung passt zum öffentlichen und gerichtlichen Rahmen, ohne einen nicht genannten Inhalt hinzuzufügen.
- source_word: τὸ πρεσβεῖον
  choice: den Rang eines Ältesten
  rationale: Das Substantiv kann Vorrang, Seniorität oder die Würde beziehungsweise Stellung eines Ältesten bezeichnen. Da Daniel als junger Mensch auftritt, bringt diese Wiedergabe die ihm verliehene anerkannte Autorität zum Ausdruck, ohne wörtliches Lebensalter zu behaupten.
theological_decisions:
- issue: Bedeutung der von Gott verliehenen Größe τὸ πρεσβεῖον
  choice: Gott hat Daniel den Rang eines Ältesten verliehen.
  alternative: Gott hat Daniel Ältestenwürde, Vorrang oder eine Ehrenstellung verliehen.
  rationale: Der Kontext stellt den jungen Daniel als von Gott mit Weisheit und öffentlicher Autorität ausgestattet dar. »Rang eines Ältesten« bewahrt die auffällige Spannung zwischen seiner Jugend und seiner anerkannten Stellung, ohne daraus eine Aussage über sein Lebensalter oder ein genau bestimmtes Amt zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und öffentlich-feierlich; der gerichtliche Kontext wird durch »berichte uns« und »Rang eines Ältesten« erkennbar, ohne zusätzliche Amtsvorstellungen einzutragen.
