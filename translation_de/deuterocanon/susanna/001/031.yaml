  text: The woman was exceedingly delicate[a].
translation:
  language: de
  text: Die Frau war überaus zart[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »sehr fein«, »sehr weich« oder »von zarter Schönheit«; das griechische Adjektiv τρυφερά kann Weichheit oder vornehme Zartheit bezeichnen, ohne damit notwendigerweise eine Charakterschwäche auszudrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: war
  rationale: δέ ist hier eine schwache narrative Verknüpfung und kein deutlicher Gegensatz. Im Deutschen muss sie nicht eigens wiedergegeben werden; so bleibt der Satz natürlich, ohne ein im Griechischen nicht ausdrücklich vorhandenes zeitliches »nun« einzuführen.
- source_word: ἡ γυνή
  choice: die Frau
  rationale: γυνή kann »Frau« oder »Ehefrau« bedeuten. Hier wird Susanna als Person beschrieben, nicht ausdrücklich in ihrer Beziehung zu Jojakim; daher passt »die Frau« zum unmittelbaren Zusammenhang.
- source_word: τρυφερά
  choice: zart
  rationale: Das Adjektiv bezeichnet Zartheit, Weichheit oder vornehme Verfeinerung. »Zart« bewahrt diese Bedeutungsbreite, ohne Charakterschwäche oder Genusssucht zu unterstellen.
- source_word: σφόδρα
  choice: überaus
  rationale: σφόδρα verstärkt das Adjektiv deutlich. »Überaus« gibt diese starke Intensivierung in einem würdigen, aber verständlichen Erzählstil wieder.
