  yaml_path: translation/deuterocanon/susanna/001/049.yaml
  text: Return to the court, for these men have borne false witness against her.
translation:
  language: de
  text: Kehrt zum Gericht zurück; denn diese Männer haben falsch gegen sie ausgesagt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστρέψατε
  choice: Kehrt … zurück
  rationale: Der Aoristimperativ im Plural fordert die Anwesenden auf, zur Gerichtsverhandlung zurückzukehren. Die Formulierung ist direkt und natürlich.
- source_word: κριτήριον
  choice: Gericht
  rationale: Das Wort bezeichnet hier den Ort beziehungsweise die Versammlung der Rechtsprechung. „Gericht“ gibt beides im Deutschen knapp und verständlich wieder.
- source_word: ψευδῆ
  choice: falsch
  rationale: In Verbindung mit dem Verb des Zeugnisablegens kennzeichnet der Ausdruck die Aussage als unwahr.
- source_word: κατεμαρτύρησαν
  choice: haben … ausgesagt
  rationale: Das Verb bezeichnet eine belastende Zeugenaussage gegen jemanden. Zusammen mit ψευδῆ ergibt sich idiomatisch „falsch gegen sie ausgesagt“.
- source_word: αὐτῆς
  choice: gegen sie
  rationale: Der Genitiv bezeichnet bei καταμαρτυρέω die Person, gegen die Zeugnis abgelegt wird; „gegen sie“ bewahrt diese gerichtliche Stoßrichtung.
theological_decisions:
- issue: Gerichtliche Wendung für falsches Zeugnis
  choice: haben falsch gegen sie ausgesagt
  alternative: haben falsches Zeugnis gegen sie abgelegt
  rationale: Die gewählte Formulierung wahrt den rechtlichen Sinn und klingt zugleich in modernem Deutsch natürlich. Die Alternative besitzt stärkeren traditionellen Bibelklang, wäre hier jedoch etwas schwerer.
