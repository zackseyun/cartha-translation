base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/020.yaml
  text: And they did as she said[a], and they shut the doors of the garden and went out by the side doors to bring what had been ordered for them, and they did not see the elders, because they were hidden.
translation:
  language: de
  text: Und sie taten, wie sie gesagt hatte. Sie schlossen die Tore des Gartens[a] und gingen durch die Seitentore hinaus, um zu bringen, was ihnen aufgetragen worden war. Die Ältesten sahen sie nicht, denn diese hielten sich verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet hier einen umschlossenen Garten oder Park, nicht das „Paradies“ im späteren theologischen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν καθὼς εἶπεν
  choice: sie taten, wie sie gesagt hatte
  rationale: Die einfache Erzählform wird bewahrt; das deutsche Plusquamperfekt macht natürlich deutlich, dass Susannas Anweisung vorausging.
- source_word: τὰς θύρας τοῦ παραδείσου
  choice: die Tore des Gartens
  rationale: παράδεισος bezeichnet hier einen umschlossenen Garten oder Park. Für Zugänge zu einer Gartenanlage ist „Tore“ im Deutschen natürlicher als „Türen“ und überträgt θύραι ohne die nicht ausdrücklich genannte Bedeutung „abschließen“.
- source_word: ἀπέκλεισαν
  choice: schlossen
  rationale: Das Verb bezeichnet das Schließen beziehungsweise Absperren; „schlossen ab“ würde ein Verriegeln nahelegen, das der griechische Text nicht ausdrücklich nennt.
- source_word: κατὰ τὰς πλαγίας θύρας
  choice: durch die Seitentore hinaus
  rationale: κατά bezeichnet hier den Weg, auf dem sie hinausgingen. „Seitentore“ wahrt die lexikalische Verbindung zu den zuvor genannten Toren.
- source_word: ἐνέγκαι τὰ προστεταγμένα αὐταῖς
  choice: um zu bringen, was ihnen aufgetragen worden war
  rationale: Der Infinitiv bezeichnet den Zweck des Hinausgehens; das Perfektpartizip verweist auf einen bereits erteilten Auftrag, ohne dessen Gegenstände näher zu bestimmen.
- source_word: τοὺς πρεσβυτέρους
  choice: die Ältesten
  rationale: πρεσβύτεροι bezeichnet in diesem Erzählzusammenhang anerkannte ältere Führungspersonen beziehungsweise Richter, nicht lediglich alte Männer.
- source_word: ἦσαν κεκρυμμένοι
  choice: diese hielten sich verborgen
  rationale: Die Form beschreibt einen bereits bestehenden Zustand des Verborgenseins. Die ausdrückliche Wiederaufnahme mit „diese“ verhindert im Deutschen einen unklaren Pronomenbezug.
