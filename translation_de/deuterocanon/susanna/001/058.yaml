base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/058.yaml
  text: 'Now then[a], tell me: under what tree did you catch them talking with one another? And he said, “Under a holm oak.”'
translation:
  language: de
  text: 'Nun also, sag mir: Unter welchem Baum hast du sie dabei ertappt, wie sie miteinander redeten? Er antwortete: »Unter einer Eiche[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort πρῖνος bezeichnet eine Eichenart, möglicherweise eine immergrüne Eiche; die genaue botanische Zuordnung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun also
  rationale: Die Verbindung kennzeichnet einen unmittelbaren, folgernden Übergang im Verhör. »Nun also« gibt sowohl den zeitlichen als auch den schlussfolgernden Ton in natürlichem Deutsch wieder.
- source_word: λέγε μοι
  choice: sag mir
  rationale: Die imperative Aufforderung verlangt eine direkte Antwort; »sag mir« ist idiomatisch und bewahrt ihre Eindringlichkeit.
- source_word: Ὑπὸ τί δένδρον
  choice: Unter welchem Baum
  rationale: Die Formulierung fragt direkt nach dem bestimmten Baum, unter dem das behauptete Geschehen stattgefunden haben soll.
- source_word: κατέλαβες
  choice: hast du sie dabei ertappt
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Verb das Antreffen oder Ertappen bei einer Handlung, nicht notwendig ein körperliches Ergreifen.
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: wie sie miteinander redeten
  rationale: ὁμιλέω kann Gespräch oder persönlichen Umgang bezeichnen. »Miteinander redeten« ist hier eine natürliche, zurückhaltende Wiedergabe und legt über den griechischen Wortlaut hinaus keine sexuelle Handlung fest.
- source_word: πρῖνον
  choice: Steineiche
  rationale: Das Substantiv bezeichnet eine bestimmte Eichenart, gewöhnlich die Steineiche. Da die genaue Baumart für Daniels Verhör entscheidend ist, steht die präzisere Bezeichnung im Haupttext.
