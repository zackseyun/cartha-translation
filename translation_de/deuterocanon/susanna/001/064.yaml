  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Verbindung „großes Ansehen beim Volk genießen“ macht die öffentliche Wertschätzung deutlich und vermeidet eine missverständliche Aussage über Daniels körperliche Größe.
