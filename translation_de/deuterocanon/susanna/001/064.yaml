  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο μέγας
  choice: genoss großes Ansehen
  rationale: Die Wendung bezeichnet hier eine Veränderung von Daniels öffentlichem Rang oder Ansehen. Die deutsche Formulierung gibt den Sinn natürlich wieder, ohne ihn auf politische Macht einzuengen.
- source_word: ἐνώπιον τοῦ λαοῦ
  choice: beim Volk
  rationale: Wörtlich bedeutet die Wendung „vor den Augen des Volkes“; im Zusammenhang geht es um Daniels öffentliche Wertschätzung. „Beim Volk“ verbindet sich idiomatisch mit „großes Ansehen genießen“.
- source_word: ἀπὸ τῆς ἡμέρας ἐκείνης καὶ ἐπέκεινα
  choice: von jenem Tag an
  rationale: Die Formulierung bezeichnet sowohl den Ausgangspunkt als auch die Fortdauer. „Von jenem Tag an“ gibt beides in natürlichem modernem Deutsch wieder.
- source_word: Δανιὴλ
  choice: Daniel
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
