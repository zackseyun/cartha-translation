  to: 'Da sagte Daniel: „Ganz richtig hast du zu deinem eigenen Schaden gelogen[a]; denn ein Engel Gottes hat bereits einen Urteilsspruch von Gott empfangen und wird dich in zwei Teile reißen.“'
  rationale: 'Die idiomatisch unklare Haupttextformulierung wurde durch „zu deinem eigenen Schaden“ ersetzt; die konkrete Kopfmetapher bleibt in der Fußnote dokumentiert. Der Satz wurde außerdem so umgestellt, dass das griechische Partizip λαβών natürlich als vorzeitige Handlung („hat bereits … empfangen“) wiedergegeben wird. Die Fußnotenanker wurden angepasst: Der Anker bei „Urteilsspruch“ entfiel im Entwurf versehentlich trotz vorhandener Fußnote b und wurde wiederhergestellt.'
