  terminology: „Ein Engel Gottes“, „Urteilsspruch“ und „von Gott empfangen“ sind angemessene Wiedergaben von ἄγγελος τοῦ θεοῦ, φάσις und παρὰ τοῦ θεοῦ. „Dich in zwei Teile reißen“ macht σχίσει σε μέσον im modernen Deutsch klar und bewahrt die drastische Bildlichkeit, ohne eine über das griechische Verb hinausgehende Vollzugsart festzulegen.
