  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Aussagen des griechischen Textes zutreffend wieder: Daniels ironische Erwiderung, die gegen den Lügner selbst zurückkehrende Folge, der bereits ergangene göttliche Spruch, der Engel als Vollstrecker und das Zerreißen durch die Mitte. „Gegen deinen eigenen Kopf gelogen“ ist jedoch im heutigen Deutsch kein verständlicher Ausdruck für εἰς τὴν σεαυτοῦ κεφαλήν und kann fälschlich nahelegen, die Lüge habe den Kopf als Gegenstand. „Zu deinem eigenen Schaden“ gibt die idiomatische Konsequenz zuverlässig wieder.'
