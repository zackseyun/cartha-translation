base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/055.yaml
  text: Then Daniel said[a], “You have lied rightly against your own head; for already an angel of God, having received a sentence from God[b], will split you in two.”
translation:
  language: de
  text: 'Da sagte Daniel: „Ganz richtig hast du zu deinem eigenen Schaden gelogen[a]; denn ein Engel Gottes hat bereits einen Urteilsspruch von Gott empfangen und wird dich in zwei Teile reißen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gegen dein eigenes Haupt“. Die Formulierung ist vermutlich ironisch: Durch seine falsche Aussage hat der Zeuge das Gericht über sich selbst gebracht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀρθῶς
  choice: ganz richtig
  rationale: 'Die adverbiale Wendung bewahrt Daniels scharfe Ironie: Die Lüge ist nicht moralisch richtig, sondern trifft in ihrer Folge den Lügner selbst.'
- source_word: ἔψευσαι
  choice: hast du … gelogen
  rationale: Das Perfekt gibt den vollzogenen Akt der unmittelbar vorausgegangenen Falschaussage im natürlichen modernen Deutsch wieder.
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: gegen deinen eigenen Kopf
  rationale: Die konkrete Bildsprache des griechischen Idioms bleibt erhalten und zeigt, dass die Schuld und ihre Folgen auf den Sprecher selbst zurückfallen.
- source_word: ἤδη
  choice: schon
  rationale: Das Wort unterstreicht, dass das angekündigte Gericht bereits in Gang gesetzt ist.
- source_word: ἄγγελος τοῦ θεοῦ
  choice: ein Engel Gottes
  rationale: Da ἄγγελος ohne Artikel steht, ist die unbestimmte Wiedergabe die naheliegende Entsprechung.
- source_word: λαβὼν φάσιν
  choice: einen Urteilsspruch empfangen
  rationale: φάσις kann eine Äußerung, Entscheidung oder richterliche Verkündung bezeichnen; der Gerichtszusammenhang legt „Urteilsspruch“ nahe, ohne den sprachlichen Charakter der göttlichen Entscheidung zu verlieren.
- source_word: παρὰ τοῦ θεοῦ
  choice: von Gott
  rationale: παρά mit Genitiv bezeichnet hier eindeutig Gott als Quelle des Urteilsspruchs.
- source_word: σχίσει σε μέσον
  choice: wird dich entzweireißen
  rationale: Die kräftige deutsche Formulierung gibt sowohl das Zerreißen beziehungsweise Spalten als auch die Teilung durch die Mitte wieder.
theological_decisions:
- issue: Art des Handelns des Engels
  choice: Ein Engel Gottes vollstreckt persönlich einen von Gott empfangenen Urteilsspruch.
  alternative: Die Aussage könnte allgemeiner als bildhafte Ankündigung göttlichen Gerichts verstanden werden.
  rationale: Der griechische Text nennt ausdrücklich einen Engel Gottes als handelnden Vollstrecker und Gott als Quelle des Urteilsspruchs; diese konkrete personale Vermittlung darf nicht zu einer abstrakten Gerichtsaussage verflacht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „gegen deinen eigenen Kopf“ bewahrt bewusst das konkrete Bild und die ironische Spannung des griechischen Textes; die Fußnote erläutert sie, ohne sie im Haupttext aufzulösen.
