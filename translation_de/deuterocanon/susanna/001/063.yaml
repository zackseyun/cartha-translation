base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/063.yaml
  text: And Hilkiah and his wife praised their daughter[a], along with Joakim her husband and all their relatives, because no shameful deed was found in her.
translation:
  language: de
  text: Und Hilkija und seine Frau priesen im Blick auf ihre Tochter, gemeinsam mit Jojakim, ihrem Mann, und allen Verwandten, weil bei ihr keine schändliche Tat festgestellt worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „im Blick auf/wegen ihrer Tochter“. Wem das Lob galt, wird nicht ausdrücklich gesagt; im Zusammenhang kann Gott als der Empfänger des Lobes verstanden werden.'
    reason: Die Fußnote erläutert den Bezug von περί mit Genitiv und die im Griechischen verbleibende Auslassung, ohne ein Ziel des Lobes in den Text einzutragen.
lexical_decisions:
- source_word: Χελκίας
  choice: Hilkija
  rationale: Die im Deutschen gebräuchliche biblische Form des hebräischen Namens, der dem griechischen Χελκίας zugrunde liegt.
- source_word: ᾔνεσαν περὶ τῆς θυγατρὸς αὐτῶν
  choice: lobten ihre Tochter
  rationale: Das Verb bedeutet „loben/preisen“; περί mit Genitiv bezeichnet hier den Bezug des Lobes. Die knappe deutsche Fassung wahrt, dass im Griechischen kein ausdrückliches Objekt wie „Gott“ steht.
- source_word: μετὰ Ἰωακεὶμ τοῦ ἀνδρὸς αὐτῆς
  choice: gemeinsam mit Jojakim, ihrem Mann
  rationale: μετά bezeichnet die Begleitung; die Apposition wird in natürlichem Deutsch durch Kommas abgesetzt.
- source_word: τῶν συγγενῶν πάντων
  choice: allen Verwandten
  rationale: συγγενεῖς bezeichnet Angehörige beziehungsweise Verwandte; der griechische Ausdruck enthält kein ausdrückliches Possessivpronomen.
- source_word: οὐχ εὑρέθη ἐν αὐτῇ
  choice: man bei ihr keine … gefunden hatte
  rationale: Die unpersönliche deutsche Konstruktion gibt den griechischen Passivsatz idiomatisch wieder; „bei ihr“ bewahrt den Personenbezug, ohne das ungebräuchliche „in ihr“ zu erzwingen.
- source_word: αἰσχρὸν πρᾶγμα
  choice: schändliche Tat
  rationale: αἰσχρός bezeichnet etwas Schändliches oder Ehrenrühriges, πρᾶγμα hier eine Tat beziehungsweise begangene Sache.
theological_decisions:
- issue: Nicht genanntes Objekt des Lobens bei ᾔνεσαν
  choice: Kein „Gott“ ergänzt; den Satz als Lob der Tochter formuliert und die Mehrdeutigkeit in einer Fußnote offengelegt.
  alternative: „lobten Gott wegen ihrer Tochter“ oder „priesen Gott für ihre Tochter“
  rationale: Im griechischen Text fehlt ein ausdrückliches Akkusativobjekt. Der religiöse Kontext kann Gott als Ziel des Lobes nahelegen, doch eine Ergänzung im Haupttext würde die syntaktische Offenheit auflösen. περί mit Genitiv kann das Thema beziehungsweise den Anlass des Lobes bezeichnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namensformen Hilkija und Jojakim folgen geläufigen deutschen Bibelkonventionen. Das Plusquamperfekt im Begründungssatz gibt die zeitliche Vorordnung der bereits erfolgten Feststellung natürlich wieder.
