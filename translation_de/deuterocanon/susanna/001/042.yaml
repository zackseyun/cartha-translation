    issue: Numerus bei »bevor es entsteht«
    rationale: Das griechische αὐτῶν ist Plural und nimmt τὰ πάντα auf. Die deutsche Singularform kann zwar kollektiv verstanden werden, ist aber weniger präzise und klingt nach »alles« als einer einzelnen Größe. »Bevor sie entstehen« erhält den Bezug auf die einzelnen Dinge beziehungsweise Geschehnisse.
