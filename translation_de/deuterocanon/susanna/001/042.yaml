base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/042.yaml
  text: And Susanna cried out with a loud voice and said, “O eternal God, knower of the hidden things, who knows all things before they come to be,”
translation:
  language: de
  text: 'Und Susanna schrie mit lauter Stimme und sagte: »Ewiger Gott, der du das Verborgene kennst[a] und alles weißt, bevor sie entstehen[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der du die verborgenen Dinge kennst«; auch: »der du die Geheimnisse kennst«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bevor sie ins Dasein kommen« oder »bevor sie geschehen«. Das Griechische kann allgemein von Dingen oder Geschehnissen sprechen, noch bevor sie entstehen beziehungsweise eintreten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: schrie
  rationale: Das Verb bezeichnet einen nachdrücklichen, lauten Ausruf. »Schrie« bewahrt die emotionale Intensität des Gebets.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die konkrete griechische Wendung lässt sich im Deutschen natürlich und quellennah so wiedergeben.
- source_word: Ὁ θεὸς ὁ αἰώνιος
  choice: Ewiger Gott
  rationale: Der formal nominativische Ausdruck dient hier als Anrede. »Ewiger Gott« gibt diese Gebetsanrede natürlich wieder.
- source_word: ὁ τῶν κρυπτῶν γνώστης
  choice: der du das Verborgene kennst
  rationale: Die Relativkonstruktion ist im Deutschen eine natürliche Fortführung der Anrede und bewahrt den umfassenden Sinn von κρυπτά als das Verborgene.
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: und alles weißt
  rationale: Die koordinierte Verbform vermeidet eine schwerfällige Wiederholung von »der du« und erhält die umfassende Aussage von τὰ πάντα.
- source_word: πρὶν γενέσεως αὐτῶν
  choice: bevor es entsteht
  rationale: Die Formulierung umfasst sowohl das Ins-Dasein-Kommen als auch das Eintreten von Geschehnissen, ohne den griechischen Ausdruck unnötig einzuengen.
theological_decisions:
- issue: Göttliches Vorherwissen in πρὶν γενέσεως αὐτῶν
  choice: bevor es entsteht
  alternative: bevor es ins Dasein kommt; bevor es geschieht
  rationale: Die Übersetzung bekräftigt Gottes Wissen vor dem Entstehen beziehungsweise Eintreten aller Dinge, ohne daraus eine weiter ausgearbeitete dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede »der du …« wahrt den Gebetscharakter und klingt zugleich natürlich. Der Vers bleibt entsprechend der Vorlage syntaktisch offen, da der Satz im folgenden Vers weitergeführt wird.
