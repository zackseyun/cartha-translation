base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/032.yaml
  text: And the lawless men ordered her to be uncovered[a], so that they might satisfy their desire for her beauty.
translation:
  language: de
  text: Und die Gesetzlosen befahlen, sie zu entblößen, damit sie ihr Verlangen nach ihrer Schönheit stillen könnten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie von Begierde nach ihrer Schönheit erfüllt würden“. Wörtlich spricht das Griechische davon, mit Begierde in Bezug auf ihre Schönheit „gefüllt“ zu werden.'
    reason: Die ungewöhnliche griechische Genitivkonstruktion und das wörtliche Bild des Gefülltwerdens lassen sich im Deutschen unterschiedlich wiedergeben.
lexical_decisions:
- source_word: προσέταξαν
  choice: befahlen
  rationale: Der Aorist von προστάσσω bezeichnet eine autoritative Anordnung; „befahlen“ gibt diese Kraft knapp und natürlich wieder.
- source_word: οἱ παράνομοι
  choice: die Gesetzlosen
  rationale: παράνομος bezeichnet Menschen, die gegen das Gesetz handeln. Die substantivierte Wiedergabe bewahrt sowohl den rechtlichen als auch den moralischen Ton, ohne die bereits aus dem Zusammenhang bekannten Männer eigens zu ergänzen.
- source_word: ἀποκαλύψαι αὐτήν
  choice: sie zu entblößen
  rationale: ἀποκαλύπτω bedeutet wörtlich „aufdecken, enthüllen“. Im Zusammenhang ist das Entfernen ihrer Bedeckung gemeint; „entblößen“ wahrt den körperlichen und demütigenden Charakter, ohne den Umfang der Entkleidung näher festzulegen.
- source_word: ἵνα ἐμπλησθῶσιν
  choice: damit sie sich … sattsehen konnten
  rationale: ἐμπίμπλημι bedeutet „füllen, sättigen“. In Verbindung mit ihrer Schönheit bezeichnet die Wendung hier das begehrliche Anschauen; „sich sattsehen“ bildet das Füllungsbild idiomatisch ab.
- source_word: τοῦ κάλλους
  choice: an ihrer Schönheit
  rationale: κάλλος bezeichnet Schönheit beziehungsweise körperliche Anmut. Das nachfolgende αὐτῆς wird im Deutschen als Possessivpronomen wiedergegeben.
- source_word: ἐπιθυμίας αὐτῆς
  choice: sich an ihrer Schönheit sattsehen
  rationale: ἐπιθυμία kann Begehren, Verlangen oder Begierde bedeuten. Die deutsche Gesamtformulierung vermittelt im Kontext das sexuell begehrliche Motiv, ohne das semantisch breitere Substantiv ausdrücklich auf „Lust“ festzulegen.
theological_decisions:
- issue: Moralische Kennzeichnung durch οἱ παράνομοι
  choice: die Gesetzlosen
  alternative: die Frevler; die gesetzlosen Männer
  rationale: „Die Gesetzlosen“ erhält die rechtlich-moralische Anklage des griechischen Ausdrucks und fügt keine über den Kontext hinausgehende Bewertung ein.
- issue: Stärke und syntaktische Zuordnung von ἐπιθυμία
  choice: damit sie sich an ihrer Schönheit sattsehen konnten
  alternative: damit sie ihr Verlangen nach ihrer Schönheit stillten; damit sie von der Begierde nach ihrer Schönheit erfüllt würden
  rationale: Die gewählte Formulierung bewahrt das Bild der Sättigung und macht das begehrliche Sehen verständlich. Da die griechische Genitivfügung ungewöhnlich und mehrdeutig ist, dokumentiert die Fußnote eine stärker formale Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sattsehen“ ist idiomatisch und anschaulich, bleibt aber durch den Kontext eindeutig verurteilend. Die Formulierung „sie zu entblößen“ lässt offen, wie weit ihre Bedeckung entfernt wurde.
