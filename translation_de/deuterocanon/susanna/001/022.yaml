base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/022.yaml
  text: And they said[a], “Look, the doors of the garden are shut, and no one sees us, and we are filled with desire for you. Therefore consent to us, and be with us.”
translation:
  language: de
  text: 'Und sie sagten: »Sieh, die Tore des Gartens[a] sind verschlossen, und niemand sieht uns. Wir sind von Verlangen nach dir erfüllt. Darum willige ein und sei mit uns.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort παράδεισος bezeichnet hier einen umfriedeten Garten oder Park, nicht das »Paradies« im späteren theologischen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Die Aufforderung lenkt Susannas Aufmerksamkeit auf die vermeintlich unbeobachtete Lage; »Sieh« ist gegenwärtig und unmittelbar.
- source_word: αἱ θύραι τοῦ παραδείσου
  choice: die Tore des Gartens
  rationale: παράδεισος bezeichnet hier den umfriedeten Garten der Erzählung, nicht das Paradies im späteren theologischen Sinn. Bei einem umfriedeten Garten ist »Tore« im Deutschen natürlicher als »Türen«.
- source_word: κέκλεινται
  choice: sind verschlossen
  rationale: Das Perfekt Passiv bezeichnet den aus dem Schließen entstandenen gegenwärtigen Zustand.
- source_word: θεωρεῖ
  choice: sieht
  rationale: Die schlichte Wiedergabe bewahrt die Aussage, dass kein Beobachter anwesend sei, ohne das Verb unnötig zu verstärken.
- source_word: ἐν ἐπιθυμίᾳ σού ἐσμεν
  choice: wir sind von Verlangen nach dir erfüllt
  rationale: Die Formulierung gibt die starke, im Kontext sexuelle Begierde wieder, ohne mit »brennen« eine im Griechischen nicht ausdrücklich enthaltene Metapher einzuführen.
- source_word: διὸ
  choice: Darum
  rationale: Das Wort kennzeichnet die Folgerung, welche die Männer aus der abgeschlossenen und unbeobachteten Lage ziehen.
- source_word: συγκατάθου ἡμῖν
  choice: willige ein
  rationale: Der Imperativ fordert Zustimmung beziehungsweise Nachgeben. Die knappe deutsche Form bewahrt den als Zustimmung formulierten, tatsächlich aber bedrängenden Charakter der Forderung.
- source_word: γενοῦ μεθ᾿ ἡμῶν
  choice: sei mit uns
  rationale: Die enge Wiedergabe lässt wie das Griechische den sexuellen Sinn aus dem erzählerischen Zusammenhang hervorgehen.
theological_decisions:
- issue: Bedeutung von παράδεισος in diesem Erzählzusammenhang
  choice: Garten
  alternative: Paradies
  rationale: In der Susanna-Erzählung bezeichnet das Wort die umfriedete Gartenanlage. »Paradies« würde hier eine eschatologische oder heilsgeschichtliche Bedeutung nahelegen, die der Zusammenhang nicht trägt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und bedrohlich; die sexuelle Absicht wird nicht beschönigt, aber auch nicht über den griechischen Wortlaut hinaus ausgedeutet. Der Fußnotenmarker steht unmittelbar bei »Garten«, auf das sich die Anmerkung bezieht.
