  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die griechische Satzfolge und Aussage zuverlässig wieder: die verschlossenen Zugänge zum umfriedeten Garten, die behauptete Ungestörtheit, das auf Susanna gerichtete Verlangen sowie die anschließende Aufforderung zur Zustimmung und zum Zusammensein. »Tore des Gartens« ist für θύραι in diesem räumlichen Zusammenhang idiomatisch, ohne den Sinn einzuengen. »Sei mit uns« bewahrt die im Griechischen kontextuell sexuelle, aber nicht explizit ausformulierte Wendung.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit einem der bedrängenden direkten Rede angemessenen knappen Register. »Sieh« und »Darum« sind leicht gehoben, aber weder veraltet noch unnatürlich. Die Aufteilung nach »niemand sieht uns« verbessert die deutsche Lesbarkeit und verändert den Sinn nicht.
  terminology: »Garten« für παράδεισος ist im erzählerischen Kontext zutreffend; die Fußnote grenzt die spätere theologische Bedeutung von »Paradies« sachgerecht ab. »Von Verlangen nach dir erfüllt« gibt ἐν ἐπιθυμίᾳ σού ἐσμεν ohne nicht ausdrücklich vorhandene Bildsprache wieder. »Willige ein« trifft den als Zustimmung formulierten Imperativ συγκατάθου, ohne den coerciven Kontext zu verharmlosen.
