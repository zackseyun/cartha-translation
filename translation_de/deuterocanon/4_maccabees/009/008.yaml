  text: For through this suffering and endurance[a], we will indeed carry off the prizes of virtue,
translation:
  language: de
  text: Denn durch dieses Leiden und Ausharren werden wir die Wettkampfpreise der Tugend davontragen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς μὲν γὰρ
  choice: Denn ... wir
  rationale: γάρ begründet die Aussage; das ausdrücklich gesetzte ἡμεῖς erhält die Betonung auf „wir“. μὲν bereitet einen Gegensatz im folgenden Kontext vor, der im Deutschen nicht künstlich vorweggenommen wird.
- source_word: διὰ τῆσδε τῆς κακοπαθείας
  choice: durch dieses Leiden
  rationale: κακοπάθεια bezeichnet leidvolle Bedrängnis oder Mühsal; „durch dieses Leiden“ bewahrt den demonstrativen und instrumentalen Sinn.
- source_word: ὑπομονῆς
  choice: Ausharren
  rationale: „Ausharren“ gibt die standhafte Ausdauer unter Leiden in knapper, würdiger Sprache wieder.
- source_word: τὰ τῆς ἀρετῆς ἆθλα
  choice: den Siegespreis der Tugend
  rationale: ἆθλα gehört zur Wettkampfsprache und bezeichnet die errungenen Preise; der deutsche kollektive Singular „Siegespreis“ klingt natürlicher, während die Fußnote den griechischen Plural erkennen lässt. ἀρετή wird als ethischer Schlüsselbegriff mit „Tugend“ wiedergegeben.
- source_word: οἴσομεν
  choice: werden wir ... erringen
  rationale: Bei Wettkampfpreisen kann φέρω idiomatisch das Davontragen beziehungsweise Gewinnen bezeichnen; „erringen“ erhält das Bild und ist im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe von ἀρετή im hellenistisch-jüdischen Martyriumskontext
  choice: Tugend
  alternative: sittliche Vortrefflichkeit
  rationale: „Tugend“ entspricht dem ethischen Leitvokabular des Werkes, ohne spätere konfessionelle Kategorien einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt wegen des abschließenden Kommas des Quellenausschnitts für die Fortsetzung offen; der mit μὲν angekündigte Gegensatz wird nicht innerhalb dieses Einzelverses ergänzt.
