  text: For I, by the pleasures that come through virtue, lighten the pain.
translation:
  language: de
  text: Denn durch die angenehmen Freuden, die aus der Tugend erwachsen, lindere ich den Schmerz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέσι … ἡδοναῖς
  choice: durch die Freuden
  rationale: Die durch Adjektiv und Substantiv verstärkte Lust-Terminologie wird knapp mit „Freuden“ wiedergegeben; der Dativ bezeichnet das Mittel, durch das der Schmerz gelindert wird.
- source_word: διὰ τὴν ἀρετήν
  choice: die aus der Tugend kommen
  rationale: διά mit Akkusativ lässt hier eine ursächliche Beziehung zu; „aus der Tugend kommen“ bewahrt den Gedanken, dass die Freuden in der Tugend ihren Ursprung oder Anlass haben.
- source_word: τὸν πόνον
  choice: den Schmerz
  rationale: πόνος kann Mühe, Leiden oder Schmerz bedeuten. Im unmittelbaren Folterkontext ist „Schmerz“ die treffendste natürliche Wiedergabe.
- source_word: ἐπικουφίζομαι
  choice: ich lindere
  rationale: Das Verb bezeichnet ein Leichtermachen oder Abschwächen. „Lindern“ gibt die Wirkung auf den Schmerz im Deutschen idiomatisch wieder.
theological_decisions:
- issue: Moralphilosophische Bedeutung von ἀρετή
  choice: Tugend
  alternative: Vortrefflichkeit
  rationale: In 4 Makkabäer trägt ἀρετή einen ausgeprägt ethisch-philosophischen Sinn und bezeichnet sittliche Bewährung; „Tugend“ erhält diesen Begriff und die Spannung zwischen Tugend, Freude und körperlichem Schmerz.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paradoxe Aussage, dass aus Tugend erwachsende Freuden den Folterschmerz lindern, bleibt unverändert erhalten.
