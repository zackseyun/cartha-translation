  text: And though the framework of his bones was already burned all around[a], the noble-minded and Abraham-like young man did not groan.
translation:
  language: de
  text: Und obwohl sein Knochengerüst bereits ringsum geschmolzen war[a], stöhnte der hochherzige, Abraham ähnliche junge Mann nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Knochengerüst bereits ringsum verbrannt war“. Das Griechische zeichnet das drastische Bild eines Knochengerüsts, das von der Hitze auf allen Seiten erfasst ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετηγμένον
  choice: ringsum verbrannt
  rationale: Das Perfektpartizip bezeichnet eine durch starke Hitze von allen Seiten bewirkte Schädigung. Im Zusammenhang der Feuertortur gibt „ringsum verbrannt“ den Sinn natürlich wieder; die wörtlichere Möglichkeit „ringsum geschmolzen“ bleibt in der Fußnote erhalten.
- source_word: πῆγμα
  choice: Gefüge
  rationale: Das Wort bezeichnet etwas Zusammengefügtes oder Verfestigtes. Zusammen mit „der Knochen“ meint es die tragende körperliche Struktur; „Gefüge“ bewahrt das konkrete Bild in würdigem, verständlichem Deutsch.
- source_word: μεγαλόφρων
  choice: hochherzig
  rationale: Das Adjektiv beschreibt Größe des Sinnes, Mut und Würde. „Hochherzig“ bringt diese moralische Haltung knapp und ohne konfessionelle Färbung zum Ausdruck.
- source_word: Ἀβραμιαῖος
  choice: Abraham gleichend
  rationale: Die adjektivische Form charakterisiert den jungen Mann durch seine Ähnlichkeit mit Abraham. „Abraham gleichend“ bewahrt den Vergleich und vermeidet die mögliche technische oder bloß genealogische Bedeutung von „abrahamitisch“.
- source_word: νεανίας
  choice: junge Mann
  rationale: Die übliche Bedeutung ist ein junger männlicher Mensch; „junge Mann“ ist im Satz natürlich und sachlich genau.
- source_word: οὐκ ἐστέναξεν
  choice: stöhnte ... nicht
  rationale: στενάζω bezeichnet ein hörbares Stöhnen oder Seufzen unter Leid. Im Folterkontext trifft „stöhnen“ die körperliche Reaktion am besten.
theological_decisions:
- issue: Bedeutung von Ἀβραμιαῖος als charakterisierendes Adjektiv
  choice: Abraham gleichend
  alternative: abrahamitisch; von Abraham abstammend
  rationale: Der Zusammenhang rühmt Haltung und Standhaftigkeit des Märtyrers und legt daher eine charakterliche Ähnlichkeit mit Abraham näher als eine bloße Abstammungsangabe. Die Formulierung lässt den Vergleich ausdrücklich erkennen, ohne ihn weiter theologisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Konzessivgefüge, bleibt aber gut lesbar. Das eindringliche körperliche Bild und die charakterliche Abraham-Analogie werden bewahrt.
