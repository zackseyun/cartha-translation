base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/002.yaml
  text: For we would rightly bring shame on our ancestors if we did not make use of obedience to the law as our counselor and judgment[a].
translation:
  language: de
  text: Denn wir würden unsere Vorfahren mit Recht beschämen, wenn wir den Gehorsam gegenüber dem Gesetz nicht als Rat und Erkenntnis nutzten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn wir müssten uns mit Recht vor unseren Vorfahren schämen, wenn wir den Gehorsam gegenüber dem Gesetz nicht als Rat und Erkenntnis nutzten.«'
    reason: Die griechische Form kann sowohl das Beschämen der Vorfahren als auch das Sich-Schämen vor ihnen bezeichnen.
lexical_decisions:
- source_word: αἰσχυνόμεθα
  choice: wir würden … beschämen
  rationale: Die Form kann Scham empfinden oder Schande bereiten ausdrücken. Mit dem Akkusativ τοὺς προγόνους ist hier die Bedeutung »die Vorfahren beschämen/entehren« gut möglich; die alternative Deutung wird in der Fußnote bewahrt.
- source_word: τοὺς προγόνους
  choice: unsere Vorfahren
  rationale: »Vorfahren« ist die natürliche moderne Wiedergabe für frühere Generationen; das im Zusammenhang vorausgesetzte Possessivverhältnis wird im Deutschen ausdrücklich gemacht.
- source_word: εἰκότως
  choice: mit Recht
  rationale: Gibt die Bedeutung des Angemessenen oder wohl Begründeten idiomatisch wieder.
- source_word: τῇ τοῦ νόμου εὐπειθείᾳ
  choice: den Gehorsam gegenüber dem Gesetz
  rationale: εὐπείθεια bezeichnet willige Folgsamkeit oder Gehorsam; »gegenüber dem Gesetz« klingt im modernen Deutsch natürlicher als »zum Gesetz«.
- source_word: συμβούλῳ
  choice: als Ratgeber
  rationale: Bewahrt die personifizierende Vorstellung, dass der Gesetzesgehorsam leitend berät.
- source_word: γνώσει
  choice: Einsicht
  rationale: γνῶσις kann Erkenntnis oder Wissen bedeuten; im ethisch-praktischen Zusammenhang bezeichnet »Einsicht« verständlich das urteilsfähige Erkennen, ohne den Sinn auf ein richterliches Urteil zu verengen.
- source_word: χρησαίμεθα
  choice: wenn wir … nicht … nutzten
  rationale: Das mediale Verb mit Dativ bedeutet, sich einer Sache zu bedienen oder sie zu gebrauchen; der deutsche Konditionalsatz bildet die hypothetische Aussage natürlich ab.
theological_decisions:
- issue: Beziehung zu den Vorfahren in αἰσχυνόμεθα … τοὺς προγόνους
  choice: Ein Versagen im Gesetzesgehorsam würde die Vorfahren beschämen.
  alternative: Die Sprecher würden sich vor ihren Vorfahren schämen.
  rationale: Der Akkusativ kann die von der Schande Betroffenen bezeichnen und passt zur Treue gegenüber dem ererbten Gesetz. Da die mediale Form auch »sich vor jemandem schämen« zulässt, wird diese echte Mehrdeutigkeit nicht unterdrückt, sondern in der Fußnote genannt.
- issue: Funktion des Gesetzesgehorsams in συμβούλῳ καὶ γνώσει
  choice: Der Gehorsam wird als »Ratgeber und Einsicht« dargestellt.
  alternative: Man könnte die Wendung weniger personifizierend als »zu Rat und Erkenntnis« verstehen.
  rationale: Die Wiedergabe hält die ungewöhnliche Verbindung des konkreten συμβούλῳ mit dem abstrakten γνώσει sichtbar, statt sie in eine eindeutigere Lehrformel umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und argumentativ; die leichte Ungewöhnlichkeit von »als Ratgeber und Einsicht« spiegelt die markante griechische Verbindung, während die Fußnote die wesentlichen syntaktisch-lexikalischen Alternativen offenhält.
