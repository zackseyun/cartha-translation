lexical_decisions:
- source_word: δορυφόρων
  choice: Leibwächter
  rationale: Im höfisch-herrschaftlichen Kontext bezeichnet das Wort bewaffnete Begleiter beziehungsweise Leibwächter; diese natürliche deutsche Wiedergabe erhält die Funktion der Männer.
- source_word: Ὁμολόγησον
  choice: Stimm zu
  rationale: Der Imperativ fordert hier Zustimmung zum Essen, nicht ein religiöses Bekenntnis. Die Wiedergabe bewahrt die situationsbezogene Bedeutung, ohne einen theologischen Nebensinn einzutragen.
- source_word: φαγεῖν
  choice: zu essen
  rationale: Der Aoristinfinitiv ergänzt Ὁμολόγησον und bezeichnet die verlangte Handlung schlicht als Essen.
- source_word: ἀπαλλαγῇς
  choice: du freikommst
  rationale: Der passive Konjunktiv meint hier, aus der Gewalt beziehungsweise Bedrängnis entlassen zu werden. »Freikommen« ist idiomatisch und wahrt den Zweckcharakter von ὅπως.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktisch anschließender Nebensatz offen, wie im griechischen Ausgangstext; die direkte Rede ist klar und natürlich formuliert.
