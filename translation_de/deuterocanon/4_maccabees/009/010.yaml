  yaml_path: translation/deuterocanon/4_maccabees/009/010.yaml
  text: When they said these things[a], the tyrant was angered not only as against men who were disobedient, but was also enraged as against the ungrateful.
translation:
  language: de
  text: Als sie dies gesagt hatten, war der Tyrann nicht nur über sie erbost, weil er sie für ungehorsam hielt, sondern geriet auch in Zorn, weil er sie für undankbar hielt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen hier männliche Pluralformen ohne ausdrückliches Substantiv: wörtlich etwa „gegen Ungehorsame“ und „gegen Undankbare“. Gemeint sind die Brüder; die Formulierung kennzeichnet die Sichtweise des Tyrannen.'
    reason: Erläutert die grammatische Ellipse und die durch ὡς angezeigte Zuschreibung des Tyrannen.
lexical_decisions:
- source_word: Ταῦτα αὐτῶν εἰπόντων
  choice: Als sie dies gesagt hatten
  rationale: Der Genitivus absolutus mit Aoristpartizip wird als abgeschlossene, zeitlich vorausgehende Begleitumstandsangabe wiedergegeben. „Dies“ verweist natürlich auf die unmittelbar zuvor gesprochenen Worte.
- source_word: ὁ τύραννος
  choice: der Tyrann
  rationale: Die wertende Bezeichnung des grausamen Herrschers bleibt erhalten; „König“ oder „Herrscher“ würde die negative Aussage abschwächen.
- source_word: ὡς κατὰ ἀπειθούντων
  choice: auf sie als Ungehorsame
  rationale: Die Formulierung bewahrt sowohl die feindselige Ausrichtung von κατά mit Genitiv als auch ὡς, das die Sichtweise beziehungsweise Einstufung durch den Tyrannen kennzeichnet. Das ergänzte Pronomen macht den Bezug im Deutschen verständlich.
- source_word: ἐχαλέπαινεν
  choice: war ... erbost
  rationale: Das Imperfekt bezeichnet den anhaltenden Zustand heftigen Ärgers; „erbost“ ist kräftig, ohne die Abstufung zum folgenden Ausdruck einzuebnen.
- source_word: ὡς καὶ κατὰ ἀχαρίστων ὠργίσθη
  choice: geriet auch über sie als Undankbare in Zorn
  rationale: Die Wiedergabe erhält die parallele Einstufung aus der Perspektive des Tyrannen und gibt den Aorist von ὀργίζομαι als Eintritt in heftigen Zorn wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die zwei unterschiedlichen griechischen Ausdrücke für Zorn werden erkennbar gehalten, ohne im Deutschen unnötig steif zu wirken.
