  text: How sweet every kind of death is for our ancestral godliness! And he spoke to the tyrant,[a]
translation:
  language: de
  text: '„Wie süß ist doch jede Art des Todes um unserer von den Vorfahren überlieferten Gottesverehrung[a] willen!“ Und er sagte zum Tyrannen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für „Gottesverehrung“ kann auch „Frömmigkeit“ stehen; das griechische Wort bezeichnet hier die von den Vorfahren überlieferte ehrfürchtige Hingabe an Gott.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς ἡδὺς
  choice: Wie süß ist doch
  rationale: Die Ausrufekonstruktion wird im Deutschen mit „Wie … doch“ natürlich und nachdrücklich wiedergegeben; „süß“ bewahrt das eindringliche Paradox.
- source_word: πᾶς τρόπος θανάτου
  choice: jede Art des Todes
  rationale: Gibt die umfassende, distributive Bedeutung idiomatisch und eng am Griechischen wieder.
- source_word: διὰ τὴν πάτριον ἡμῶν εὐσέβειαν
  choice: um unserer von den Vorfahren überlieferten Gottesverehrung willen
  rationale: διά mit Akkusativ bezeichnet hier Grund oder Beweggrund. „Gottesverehrung“ erfasst die religiöse Ausrichtung von εὐσέβεια, während „von den Vorfahren überliefert“ den ererbten Charakter von πάτριος ausdrückt.
- source_word: ἔφη τε πρὸς
  choice: Dann wandte er sich an
  rationale: Die griechische Wendung leitet eine an den Tyrannen gerichtete Rede ein. Diese deutsche Formulierung ist natürlich und vermeidet ein unvollständiges „sagte zu“, da der folgende Redeinhalt erst im nächsten Vers steht.
- source_word: τὸν τύραννον
  choice: den Tyrannen
  rationale: Bewahrt die wertende Bezeichnung des verfolgenden Herrschers und ersetzt sie nicht durch den neutraleren Titel „König“.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Martyriumskontext
  choice: Gottesverehrung
  alternative: Frömmigkeit
  rationale: „Gottesverehrung“ macht den Bezug auf ehrfürchtige Treue zu Gott deutlich, ohne εὐσέβεια auf bloß innerliche Frömmigkeit oder kulturelle Tradition zu verengen. Die mögliche Wiedergabe „Frömmigkeit“ wird in der Fußnote genannt.
- issue: Bezug von πάτριος
  choice: von den Vorfahren überliefert
  alternative: väterlich / angestammt
  rationale: Die Formulierung wahrt den Gedanken einer von den Vorfahren ererbten religiösen Lebensordnung, ohne sie geschlechtsspezifisch auf Väter zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der rhetorische Ausruf und das Paradox des „süßen“ Todes bleiben erhalten. Der Doppelpunkt macht kenntlich, dass die angekündigte Rede im folgenden Vers weitergeht.
