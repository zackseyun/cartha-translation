lexical_decisions:
- source_word: διὰ πασῶν ... τῶν βασάνων
  choice: durch all die Foltern
  rationale: διά mit Genitiv kann hier den Weg durch die gesamte Reihe der Foltern oder das Mittel der Beweisführung bezeichnen. „Durch all die Foltern“ wahrt beide Aspekte und gibt den griechischen Plural wieder.
- source_word: πείσω ὑμᾶς
  choice: werde ich euch davon überzeugen
  rationale: Das Futur πείσω bezeichnet hier ein Überzeugen durch den bevorstehenden Beweis standhaften Leidens. „Euch“ gibt den Plural ὑμᾶς wieder.
- source_word: μόνοι
  choice: allein
  rationale: „Allein“ bringt die ausschließende Aussage von μόνοι hervor, ohne den unvollständigen Satz eigenmächtig zu ergänzen.
- source_word: οἱ παῖδες Ἑβραίων
  choice: die Söhne der Hebräer
  rationale: παῖδες kann Kinder, Jungen oder junge Männer bezeichnen. Im Kontext sind die männlichen Brüder gemeint; die genitivische Formulierung „Söhne der Hebräer“ bewahrt zugleich den familiären und ethnischen Ausdruck des Griechischen.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von παῖδες
  choice: Söhne
  alternative: Kinder; junge Männer
  rationale: Der Zusammenhang handelt von männlichen Brüdern. „Söhne“ bildet diese kontextuelle Bestimmtheit ab, ohne eine geschlechtsneutrale Bedeutung in den Text einzutragen.
- issue: Syntaktisch unvollständiger Wortlaut
  choice: Den überlieferten Teilsatz ohne Ergänzung stehen lassen
  alternative: Den Gedanken aus dem folgenden Vers ergänzen
  rationale: Der griechische Wortlaut endet in dieser Versabgrenzung nach dem Subjekt einer dass-Konstruktion. Eine Ergänzung würde nicht ausdrücklich vorhandenen Text vorwegnehmen und möglicherweise die Spannung des überlieferten Wortlauts auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „Söhne der Hebräer“ bleibt aus Quellennähe erhalten; der Satz wird bewusst nicht geglättet oder vervollständigt.
