  text: For through all the tortures I will convince you that only the sons of the Hebrews[a][b]
translation:
  language: de
  text: Denn durch all die Foltern werde ich euch davon überzeugen, dass allein die Söhne der Hebräer[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „die Söhne der Hebräer“; möglich sind auch „die jungen Hebräer“ oder „die Kinder der Hebräer“.'
    reason: lexical_alternative
  - marker: b
    text: Der erhaltene griechische Wortlaut ist für sich genommen syntaktisch unvollständig und setzt sich wahrscheinlich im nächsten Vers fort. Hier wird die überlieferte Teilaussage wiedergegeben, ohne unausgesprochene Wörter zu ergänzen.
