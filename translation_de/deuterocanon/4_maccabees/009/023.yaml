  yaml_path: translation/deuterocanon/4_maccabees/009/023.yaml
  text: Imitate me[a], brothers, he said, on the rack; do not desert by abandoning the struggle when I have not left it, nor through me renounce the brotherhood of courage. Wage the holy and noble campaign for godliness[c][b],
translation:
  language: de
  text: »Nehmt mich auf der Folterbank[a] zum Vorbild, Brüder«, sagte er, »werdet nicht fahnenflüchtig[b], da ich den Kampf nicht verlassen habe, und sagt euch nicht meinetwegen von der Bruderschaft des Mutes los. Führt den heiligen und edlen Feldzug für die Gottesfurcht[c] …«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter der Folter“. Der griechische Ausdruck ist schwierig, ruft aber konkret das Bild eines Foltergeräts beziehungsweise einer Streckbank hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich im militärischen Sinn: „Verlasst nicht die Reihen“ oder „Werdet nicht zu Deserteuren“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Frömmigkeit“. Das griechische εὐσέβεια bezeichnet hier die ehrfürchtige und treue Hingabe an Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρεβλὰς
  choice: auf der Folterbank
  rationale: Die schwierige griechische Form verweist im Zusammenhang auf Folter, insbesondere auf das Strecken auf einem Foltergerät. Die konkrete Wiedergabe bewahrt das Bild, ohne die Konstruktion unnötig zu glätten.
- source_word: Μιμήσασθέ με
  choice: Nehmt mich … zum Vorbild
  rationale: Der Aoristimperativ fordert die Brüder auf, dem Beispiel des Sprechers zu folgen. Diese Formulierung ist im Deutschen natürlicher als „Ahmt mich nach“ und wahrt den direkten Appell.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Angesprochen sind im Erzählzusammenhang die leiblichen Brüder des Sprechers; daher ist die maskuline und konkrete Anrede beizubehalten.
- source_word: ἀγῶνα
  choice: Kampf
  rationale: Das Wort bezeichnet einen Wettkampf oder schweren Kampf. „Kampf“ wahrt hier die Spannung zwischen Wettkampf- und Kriegssprache und ist idiomatisch.
- source_word: λειποτακτήσητε
  choice: werdet nicht fahnenflüchtig
  rationale: Das Verb ist militärisch geprägt und bezeichnet das Verlassen der eigenen Reihe beziehungsweise Fahnenflucht. Die Wiedergabe erhält diesen scharfen Bildgehalt.
- source_word: ἐξομόσησθέ
  choice: sagt euch … los
  rationale: Das Verb kann ein eidliches Abschwören oder Lossagen bezeichnen. „Sich lossagen“ vermittelt die ernste Zurückweisung, ohne einen ausdrücklichen Eid in den Haupttext einzutragen.
- source_word: τὴν τῆς εὐψυχίας ἀδελφότητα
  choice: die Bruderschaft des Mutes
  rationale: Die Formulierung bewahrt sowohl das familiäre Gemeinschaftsbild als auch εὐψυχία im Sinn von Mut und innerer Standhaftigkeit.
- source_word: ἱερὰν καὶ εὐγενῆ στρατείαν στρατεύσασθε
  choice: Führt den heiligen und edlen Feldzug
  rationale: Die Wiedergabe erhält die militärische Metapher des verwandten Substantiv-Verb-Paares, klingt jedoch im modernen Deutschen natürlicher als eine erzwungene Wortwiederholung.
- source_word: περὶ τῆς εὐσεβείας
  choice: für die Gottesfurcht
  rationale: εὐσέβεια meint in 4 Makkabäer die treue, praktisch gelebte Hingabe an Gott. „Gottesfurcht“ macht den Gottesbezug deutlich und bezeichnet ehrfürchtige Loyalität, nicht bloße Angst.
theological_decisions:
- issue: Bedeutungsumfang von εὐσέβεια im Martyriumskontext
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ bringt die ehrfürchtige Treue zu Gott unter Verfolgung klar zum Ausdruck. „Frömmigkeit“ wäre ebenfalls möglich, kann im heutigen Sprachgebrauch jedoch enger oder stärker auf persönliche Religiosität bezogen verstanden werden.
- issue: Geschlechtsspezifische Anrede ἀδελφοί
  choice: Brüder
  alternative: Geschwister
  rationale: Der Sprecher wendet sich in der Erzählung an seine tatsächlichen Brüder. Die konkrete Anrede sollte daher nicht verallgemeinert werden.
- issue: Militärische Bildsprache von λειποτακτέω und στρατεία
  choice: fahnenflüchtig / Feldzug
  alternative: gebt nicht auf / Einsatz
  rationale: Der griechische Text verbindet das Martyrium ausdrücklich mit militärischer Standhaftigkeit. Die gewählte Wiedergabe erhält diese zugespitzte Metaphorik, ohne sie als Aufruf zu tatsächlicher Gewalt umzudeuten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter Rede. Die militärische Metaphorik und die familiäre Anrede bleiben erhalten. „Fahnenflüchtig“ ist bewusst markant, aber allgemein verständlich; „Bruderschaft des Mutes“ wahrt die ungewöhnliche, prägnante Ausdrucksweise des Griechischen. Die Auslassungspunkte zeigen, dass der vorgelegte Vers syntaktisch in den folgenden Zusammenhang weiterführt.
