base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/004.yaml
  text: For we consider your pity for our unlawful deliverance to be harsher than death itself[a].
translation:
  language: de
  text: Denn dein Mitleid im Blick auf unsere gesetzwidrige Rettung halten wir für schlimmer als den Tod selbst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn dein Erbarmen wegen unserer gesetzwidrigen Rettung halten wir für härter als den Tod selbst.« Die griechische Wendung kann das Mitleid auf eine gesetzwidrige Rettung beziehen oder es als auf eine solche Rettung ausgerichtet darstellen; χαλεπώτερον kann auch mit »härter« oder »schwerer« wiedergegeben werden.'
    reason: Die Fußnote bewahrt die Mehrdeutigkeit der Präpositionalgruppe, ohne in der Hauptfassung eine Absicht des Mitleids festzulegen.
lexical_decisions:
- source_word: χαλεπώτερον
  choice: schlimmer
  rationale: Der Komparativ bezeichnet hier etwas Schwereres oder Unerträglicheres. »Schlimmer« gibt das wertende Urteil natürlich wieder, ohne körperlichen Schmerz oder besondere Härte zu unterstellen.
- source_word: αὐτοῦ τοῦ θανάτου
  choice: als den Tod selbst
  rationale: Die Vergleichskonstruktion mit dem Genitiv wird im Deutschen idiomatisch mit »als« wiedergegeben; αὐτοῦ verstärkt »Tod« im Sinn von »selbst«.
- source_word: νομίζομεν
  choice: halten wir für
  rationale: Das Verb bezeichnet ein Urteil oder eine Einschätzung. Die Konstruktion »für … halten« bildet νομίζομεν εἶναι prägnant und natürlich ab.
- source_word: ἔλεον
  choice: Mitleid
  rationale: Gemeint ist die schonende Anteilnahme des Tyrannen, die sie wegen ihres gesetzwidrigen Ziels zurückweisen. »Mitleid« vermeidet die stärker theologisch geprägte Lesart von »Barmherzigkeit«.
- source_word: παρανόμῳ
  choice: auf gesetzwidrige Weise
  rationale: Das Adjektiv bezeichnet einen Verstoß gegen das Gesetz. Die adverbiale Wiedergabe macht deutlich, dass ihre Rettung nur durch Gesetzesübertretung zustande käme.
- source_word: σωτηρίᾳ
  choice: retten
  rationale: Hier geht es um die Bewahrung vor dem Tod, nicht ausdrücklich um Heil im theologischen Sinn. Die verbale Wiedergabe ist im Deutschen natürlich und bewahrt den konkreten Zusammenhang.
- source_word: ἐπὶ τῇ παρανόμῳ σωτηρίᾳ ἡμῶν
  choice: das uns auf gesetzwidrige Weise retten will
  rationale: Die Präpositionalgruppe beschreibt das Ziel beziehungsweise den Bezug des Mitleids. Die Relativkonstruktion gibt diesen Zusammenhang klar wieder, ohne eindeutig zwischen beabsichtigter Rettung und Mitleid angesichts einer solchen Rettung zu entscheiden.
theological_decisions:
- issue: Ob σωτηρία mit ausdrücklich theologischer Heilssprache wiederzugeben ist
  choice: retten
  alternative: Heil / Erlösung
  rationale: Der unmittelbare Zusammenhang betrifft die körperliche Verschonung um den Preis eines Gesetzesverstoßes. »Retten« wahrt den Ernst des Ausdrucks, ohne eine nicht ausdrücklich bezeichnete Heilslehre einzutragen.
- issue: Wie die Gesetzwidrigkeit der σωτηρία zu verstehen ist
  choice: Rettung auf gesetzwidrige Weise
  alternative: gesetzlose Rettung
  rationale: Die Formulierung lässt erkennen, dass nicht das Gerettetwerden an sich verurteilt wird, sondern eine Rettung, die durch Übertretung des Gesetzes erreicht werden soll.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung betont zunächst das zurückgewiesene Mitleid und wahrt am Ende die gesteigerte Gegenüberstellung mit dem Tod selbst.
