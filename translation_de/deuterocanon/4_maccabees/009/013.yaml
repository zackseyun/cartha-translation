  text: As he was stretched over it[a], the noble young man was being disjointed.
translation:
  language: de
  text: Während der edle junge Mann darüber gespannt wurde, wurden ihm die Glieder ausgerenkt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „geriet er aus den Gelenken“. Das Griechische beschreibt den fortschreitenden Vorgang der körperlichen Ausrenkung während der Folter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ὃν
  choice: darüber
  rationale: Die Verbindung ist im Zusammenhang räumlich zu verstehen und bezieht sich auf das zuvor genannte Foltergerät. „Darüber“ gibt die knappe Rückverweisung natürlich wieder, ohne das Gerät erneut ausdrücklich zu benennen.
- source_word: κατατεινόμενος
  choice: gespannt wurde
  rationale: Das passive Partizip bezeichnet das straffe Ausspannen des jungen Mannes auf beziehungsweise über dem Foltergerät. Die Konstruktion mit „während“ bewahrt den gleichzeitigen, andauernden Vorgang.
- source_word: εὐγενὴς
  choice: edel
  rationale: Das Wort kann sowohl vornehme Herkunft als auch charakterliche Würde bezeichnen. „Edel“ hält diese Bedeutungsbreite offen.
- source_word: νεανίας
  choice: junge Mann
  rationale: Dies ist eine klare, gegenwärtige Altersbezeichnung ohne unnötig gehobenen oder militärischen Beiklang.
- source_word: ἔξαρθρος ἐγίνετο
  choice: wurden ihm die Glieder ausgerenkt
  rationale: Wörtlich wird der junge Mann fortschreitend „aus den Gelenken“ beziehungsweise „ausgerenkt“. Die deutsche Formulierung macht den körperlichen Vorgang verständlich und gibt durch die Verlaufsform des Gesamtsatzes den durativen Sinn des Imperfekts wieder, ohne eine Abtrennung von Gliedmaßen zu behaupten.
