  text: But you[a], by the threats of your ungodliness, are being tortured; and you will not escape, most defiled tyrant, the punishments of divine wrath.
translation:
  language: de
  text: Du aber wirst inmitten der Drohungen deiner Gottlosigkeit gequält[a]. Den Strafen des göttlichen Zorns aber wirst du nicht entkommen, du, völlig befleckter Tyrann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Drohungen deiner Gottlosigkeit“. Die griechische Wendung ist knapp und mehrdeutig. Sie kann die Drohungen als Umfeld der Qual oder als deren Mittel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασανίζῃ
  choice: wirst … gequält
  rationale: Die griechische Form ist Präsens Passiv und bezeichnet Qual oder Folter. Das deutsche Präsenspassiv „wirst gequält“ bewahrt die Zeitform und lässt zugleich den drohenden Zusammenhang erkennen.
- source_word: ἐν ταῖς τῆς ἀσεβείας ἀπειλαῖς
  choice: durch die Drohungen deiner Gottlosigkeit
  rationale: ἀπειλαί bedeutet unmittelbar „Drohungen“. Die Wendung ist stark verdichtet; „durch“ gibt die wahrscheinlich instrumentale Kraft von ἐν wieder, während „deiner Gottlosigkeit“ den persönlichen Bezug der direkten Anrede natürlich ausdrückt.
- source_word: ἀσεβείας
  choice: Gottlosigkeit
  rationale: „Gottlosigkeit“ gibt den religiös-moralischen Gehalt von ἀσέβεια in verständlichem, heutigem Deutsch wieder.
- source_word: μιερώτατε
  choice: völlig befleckter
  rationale: Der Superlativ bezeichnet äußerste kultische und moralische Verunreinigung. „Völlig befleckt“ erhält dieses Bild, ohne es zum allgemeineren „verabscheuungswürdig“ abzuschwächen.
- source_word: τύραννε
  choice: Tyrann
  rationale: „Tyrann“ bewahrt sowohl die Herrscherbezeichnung als auch ihren verurteilenden Ton.
- source_word: τὰς … δίκας
  choice: den Strafen
  rationale: Im Gerichtszusammenhang bezeichnet δίκαι die als gerechte Vergeltung verhängten Strafen.
- source_word: θείας ὀργῆς
  choice: des göttlichen Zorns
  rationale: Die Übersetzung erhält das griechische Adjektiv θεῖος, ohne den im Ausgangstext nur implizit genannten Gott ausdrücklich einzusetzen.
theological_decisions:
- issue: Bezug von θείας ὀργῆς
  choice: des göttlichen Zorns
  alternative: des Zorns Gottes
  rationale: Das Griechische verwendet das Adjektiv „göttlich“, nicht ausdrücklich den Gottesnamen. Die gewählte Fassung bewahrt diese Ausdrucksweise und lässt den Bezug auf Gott dennoch erkennen.
- issue: Zeitlicher Bezug von βασανίζῃ
  choice: 'Präsenspassiv: „wirst … gequält“'
  alternative: 'Futur: „wirst … gequält werden“'
  rationale: Obwohl der Kontext auf kommendes Gericht weist, steht im Griechischen formal ein Präsens. Die deutsche Form wahrt dieses Spannungsverhältnis, statt die Aussage eindeutig in die Zukunft zu verlegen.
translation_notes:
  register: Direkte, feierlich-anklagende Rede in modernem Standarddeutsch. Der Ausruf am Ende trägt der scharfen Anrede Rechnung; die Bildsprache kultisch-moralischer Befleckung bleibt erhalten.
