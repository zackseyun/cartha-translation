  text: And when all had marveled at his steadfast courage[a], the guards led in the second after the first in age, and after fitting iron claws onto his hands[c][b], they bound him to the instruments and the catapult.
translation:
  language: de
  text: Nachdem alle seinen standhaften Mut bewundert hatten, führten die Wachen den herein, der dem Ersten dem Alter nach folgte.[a] Nachdem sie ihm eiserne Hände mit scharfen Krallen angelegt hatten,[b] banden sie ihn an die Geräte und an das Katapult.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Bruder, der dem zuerst genannten Bruder dem Alter nach unmittelbar folgte, also wohl der Zweitälteste.
    reason: lexical_alternative
  - marker: b
    text: Die genaue Form der Vorrichtung ist unklar. Wörtlich ist von „eisernen Händen mit scharfen Krallen“ die Rede; „Krallen“ kann auch „Nägel“ bedeuten. Gemeint ist wahrscheinlich ein eisernes Foltergerät.
    reason: cultural_note
  - marker: c
    text: 'Oder möglicherweise: „die Streckbank“ beziehungsweise eine andere mechanische Foltervorrichtung. Wörtlich steht im Griechischen „Katapult“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμασάντων
  choice: als … bewunderten
  rationale: Der Aoristpartizip im Genitivus absolutus bezeichnet die begleitende beziehungsweise vorausgehende Reaktion aller. „Bewunderten“ gibt hier das anerkennende Staunen über seine Haltung natürlich wieder.
- source_word: καρτεροψυχίαν
  choice: standhaften Mut
  rationale: Das Wort bezeichnet die feste, ausdauernde Seelenhaltung unter Leiden. „Standhafter Mut“ bewahrt sowohl den Gedanken innerer Festigkeit als auch den des Mutes.
- source_word: δορυφόροι
  choice: Wachen
  rationale: Wörtlich sind es „Speerträger“; das Wort bezeichnet häufig Leibwächter oder bewaffnete Wachen. Im erzählerischen Zusammenhang ist „Wachen“ klar und sachgerecht.
- source_word: τὸν καθʼ ἡλικίαν τοῦ προτέρου δεύτερον
  choice: den, der dem Alter nach auf den Ersten folgte
  rationale: Die Wendung ordnet den Bruder nach seinem Alter ein. Die Formulierung bleibt nahe am Griechischen und ist im Deutschen verständlicher als eine starre Wiedergabe mit „der Zweite“.
- source_word: σιδηρᾶς … χεῖρας
  choice: eiserne Hände
  rationale: χείρας bedeutet wörtlich „Hände“. Gemeint sind offenbar hand- oder greifwerkzeugartige eiserne Folterinstrumente; die bildhafte Bezeichnung des Ausgangstextes bleibt im Haupttext erhalten.
- source_word: ὀξέσι τοῖς ὄνυξιν
  choice: mit scharfen Krallen
  rationale: ὄνυξ kann Nagel, Kralle oder Klaue bedeuten. Bei dem beschriebenen eisernen Gerät vermittelt „Krallen“ am deutlichsten die scharfen, hakenartigen Vorsprünge.
- source_word: ὀργάνοις
  choice: Geräte
  rationale: Das allgemeine Wort bezeichnet Werkzeuge oder Vorrichtungen. Der Zusammenhang macht deutlich, dass es sich um Foltergeräte handelt, ohne dies im griechischen Ausdruck selbst ausdrücklich festzulegen.
- source_word: καταπέλτῃ
  choice: Katapult
  rationale: Das griechische Wort bezeichnet gewöhnlich ein Katapult oder eine mechanische Wurfmaschine. Die ungewöhnliche Bezeichnung wird im Haupttext bewahrt; eine Fußnote nennt die im Folterkontext mögliche Bedeutung.
- source_word: προσεδήσαν
  choice: banden ihn an
  rationale: Das Verb bedeutet, jemanden an etwas zu binden oder daran zu befestigen. „Banden ihn an“ ist direkt und idiomatisch.
