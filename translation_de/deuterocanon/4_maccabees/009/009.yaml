  text: But because of our sacred murder[a], you will, by divine justice[b], endure a sufficient eternal torment by fire.
translation:
  language: de
  text: Du aber wirst wegen des Frevelmordes an uns[a] durch die göttliche Gerechtigkeit eine angemessene, ewige Qual durch Feuer erdulden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „wegen unseres Frevelmordes“; gemeint ist der frevelhafte Mord an uns beziehungsweise an heiligen Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιεροφονίαν
  choice: Frevelmord
  rationale: 'Das seltene Kompositum bezeichnet einen Mord mit frevelhaft-sakrilegischem Charakter. „Frevelmord“ bewahrt diese Verdichtung; ἡμῶν wird im Zusammenhang als objektiver Genitiv verstanden: der Mord an uns.'
- source_word: αὐτάρκη καρτερήσεις
  choice: eine hinreichende … Qual … erdulden
  rationale: καρτερεῖν bezeichnet standhaftes beziehungsweise schweres Ertragen; αὐτάρκη wird ausdrücklich mit „hinreichende“ wiedergegeben, statt seine ungewöhnliche Aussage stillschweigend abzuschwächen.
- source_word: ὑπὸ τῆς θείας δίκης
  choice: durch die göttliche Gerechtigkeit
  rationale: ὑπό bezeichnet hier die wirkende Instanz. δίκη umfasst Gerechtigkeit, Gericht und vergeltende Strafe; „göttliche Gerechtigkeit“ hält diese Bedeutungsbreite offen.
- source_word: αἰώνιον βάσανον
  choice: ewige Qual
  rationale: αἰώνιος bezeichnet hier unbegrenzte beziehungsweise immerwährende Dauer, während βάσανος starke Qual oder Folter meint. „Ewige Qual“ ist kräftig, idiomatisch und vermeidet zusätzliche systematisch-theologische Festlegungen.
- source_word: διὰ πυρός
  choice: durch Feuer
  rationale: διά mit Genitiv bezeichnet hier Mittel oder Vermittlung. „Durch Feuer“ bildet diese instrumentale Aussage unmittelbar ab.
theological_decisions:
- issue: Art und Dauer der angekündigten Strafe
  choice: ewige Qual durch Feuer
  alternative: immerwährende Strafe im Feuer
  rationale: Die Übersetzung bewahrt Dauer, Schärfe und gerichtlichen Charakter der Aussage, ohne sie in eine spätere dogmatische Begrifflichkeit einzuordnen.
- issue: Bezug von ἡμῶν bei μιεροφονίαν
  choice: Frevelmord an uns
  alternative: unser Frevelmord
  rationale: Im Erzählzusammenhang spricht ein bedrohtes Opfer den Verfolger an; daher ist ἡμῶν am plausibelsten als objektiver Genitiv zu verstehen. Die Fußnote macht die grammatische Kürze des Griechischen sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Anrede „Du aber“ und die feierlich-gerichtliche Satzführung entsprechen dem Ton der Märtyrerrede; die ungewöhnliche Verbindung „hinreichende, ewige Qual“ bleibt bewusst erkennbar, weil sie αὐτάρκη ausdrücklich wiedergibt.
