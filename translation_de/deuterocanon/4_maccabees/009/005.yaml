base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/005.yaml
  text: But you are trying to frighten us by threatening us with death through tortures[a], as though you had not learned from Eleazar a little while ago.
translation:
  language: de
  text: Du aber willst uns einschüchtern, indem du uns mit dem Tod durch Folterqualen drohst – als hättest du nicht erst vor Kurzem von Eleasar gelernt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: „obwohl du doch erst vor Kurzem von Eleasar gelernt hast“. Die Aussage ist rhetorisch und sarkastisch; sie bestreitet nicht wörtlich, dass er Eleasars Beispiel miterlebt hat.'
    reason: Rhetorische Mehrdeutigkeit von ὥσπερ οὐχί und mögliche konzessive Wiedergabe.
lexical_decisions:
- source_word: ἐκφοβεῖς
  choice: willst uns einschüchtern
  rationale: Das Präsens bezeichnet ein aktives Angstmachen. „Willst … einschüchtern“ gibt im Deutschen die beabsichtigte Wirkung und den vorwurfsvollen Ton natürlich wieder, ohne die stärkere Bedeutung „in Schrecken versetzen“ aufzudrängen.
- source_word: ἀπειλῶν
  choice: indem du uns … drohst
  rationale: Das Partizip erläutert, wodurch der Angesprochene sie einzuschüchtern sucht; der deutsche Nebensatz bewahrt diesen instrumentalen Zusammenhang.
- source_word: θάνατον
  choice: mit dem Tod
  rationale: Direkte und idiomatische Wiedergabe des angedrohten Todes.
- source_word: διὰ τῶν βασάνων
  choice: durch Folterqualen
  rationale: διά mit Genitiv bezeichnet hier das Mittel, durch das der Tod herbeigeführt werden soll. „Folterqualen“ spiegelt den Plural und den konkreten Märtyrerkontext natürlicher als „Folterungen“.
- source_word: πρὸ βραχέως
  choice: erst vor Kurzem
  rationale: Die Wendung bezeichnet eine kurze Zeit zuvor; „erst vor Kurzem“ ist modern und betont passend, wie unmittelbar Eleasars Beispiel vorausging.
- source_word: παρὰ Ἐλεαζάρου μαθών
  choice: von Eleasar gelernt
  rationale: παρά mit Genitiv bezeichnet bei μανθάνω die Quelle des Lernens. Die Formulierung bewahrt den Bezug auf Eleasars unmittelbar vorausgehendes Beispiel.
theological_decisions:
- issue: Rhetorische Kraft von ὥσπερ οὐχί
  choice: als hättest du nicht erst vor Kurzem von Eleasar gelernt
  alternative: obwohl du doch erst vor Kurzem von Eleasar gelernt hast
  rationale: Die gewählte Fassung erhält die irreale Vergleichsform und den sarkastischen Vorwurf des Griechischen. Sie behauptet nicht schlicht, der Herrscher habe nichts gelernt, sondern stellt sein Handeln als Widerspruch zu der Lektion aus Eleasars Beispiel dar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einschüchtern“ wahrt den scharfen Vorwurf; der Gedankenstrich lässt die sarkastische Schlusswendung hervortreten. Der Name wird in der geläufigen deutschen Form „Eleasar“ wiedergegeben.
