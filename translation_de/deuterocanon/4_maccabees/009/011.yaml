  text: So[a], when they were ordered to do so, the torturers brought forward the eldest of them, and after tearing open his tunic, they bound his hands and arms on both sides with straps.
translation:
  language: de
  text: Daraufhin führten die Folterer[a], nachdem sie dazu angewiesen worden waren, den Ältesten von ihnen vor. Sie rissen sein Untergewand auf und banden seine Hände und Arme auf beiden Seiten mit Riemen fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier mit »Folterer« wiedergegebene griechische Personenbezeichnung ist in dieser Form textlich und sprachlich ungewöhnlich. Der Zusammenhang zeigt, dass die Männer gemeint sind, die die Folter vollzogen.
    reason: textual_variant
lexical_decisions:
- source_word: ὅθεν
  choice: Daraufhin
  rationale: Kennzeichnet idiomatisch die folgernde Fortsetzung der Erzählung, ohne einen stärkeren logischen Schluss zu behaupten.
- source_word: τὸν πρεσβύτατον αὐτῶν
  choice: den Ältesten von ihnen
  rationale: Bewahrt den Superlativ und den partitiven Bezug auf die Brüder.
- source_word: κελευσθέντες
  choice: auf Befehl
  rationale: Gibt das passive aoristische Partizip knapp als Umstandsangabe wieder; die Befehlenden werden wie im Griechischen nicht ausdrücklich genannt.
- source_word: οἱ μιστισταί
  choice: die Folterknechte
  rationale: Bezeichnet im Kontext die Männer des Königs, die die Folter vollziehen; die auffällige überlieferte Form wird in einer Fußnote kenntlich gemacht.
- source_word: παρήγαγον
  choice: brachten … vor
  rationale: Passt zur Vorführung des Opfers vor den Herrscher beziehungsweise zur Folterhandlung.
- source_word: διαρρήξαντες τὸν χιτῶνα
  choice: Sie rissen ihm das Untergewand auf
  rationale: χίτων bezeichnet hier ein am Körper getragenes Untergewand; διαρρήγνυμι drückt gewaltsames Aufreißen aus.
- source_word: διέδησαν
  choice: banden … fest
  rationale: Gibt das feste Verschnüren beziehungsweise Binden natürlich wieder.
- source_word: τὰς χεῖρας αὐτοῦ καὶ τοὺς βραχίονας
  choice: seine Hände und Arme
  rationale: Bewahrt die beiden ausdrücklich genannten Körperteile, ohne anatomisch unnötig zu präzisieren.
- source_word: ἱμᾶσιν
  choice: mit Riemen
  rationale: ἱμάς bezeichnet einen Riemen oder Lederriemen; „Riemen“ ist im Deutschen präzise und verständlich.
- source_word: ἑκατέρωθεν
  choice: auf beiden Seiten
  rationale: Bewahrt die räumliche, beidseitige Anordnung, auch wenn deren genaue Ausführung im Satz offenbleibt.
