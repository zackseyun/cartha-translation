  yaml_path: translation/deuterocanon/4_maccabees/009/012.yaml
  text: But when they grew weary from striking him with whips[a], accomplishing nothing[b], they put him on the wheel.
translation:
  language: de
  text: Als sie ihn aber mit Peitschen schlugen und dabei müde wurden, ohne etwas zu erreichen, brachten sie ihn auf das Rad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Rad“ ist hier ein Foltergerät, kein gewöhnliches Wagenrad.
    reason: cultural_note
lexical_decisions:
- source_word: τύπτοντες
  choice: ihn … zu schlagen
  rationale: Das Partizip bezeichnet hier wiederholte Schläge; die deutsche Infinitivkonstruktion nach „müde wurden“ gibt den fortdauernden Vorgang natürlich wieder.
- source_word: ταῖς μάστιξιν
  choice: mit Peitschen
  rationale: μάστιξ bezeichnet eine zum Auspeitschen verwendete Peitsche oder Geißel. „Peitschen“ ist heute allgemein verständlich und vermeidet den altertümlichen Klang von „Geißeln“.
- source_word: ἐκοπίασαν
  choice: müde wurden
  rationale: Das Verb bezeichnet Ermüdung durch anstrengende Tätigkeit. Die schlichte Wiedergabe entspricht dem Aorist und dem nüchternen Erzählstil.
- source_word: μηδὲν ἀνύοντες
  choice: ohne etwas zu erreichen
  rationale: Die Wendung besagt, dass die Folter nicht zum beabsichtigten Ergebnis führte, ohne dieses Ergebnis näher zu bestimmen.
- source_word: ἀνέβαλον
  choice: legten sie ihn
  rationale: Im Zusammenhang bezeichnet das Verb das Hinauf- beziehungsweise Aufbringen des Gefolterten auf das Gerät. „Legten“ ist im Deutschen anschaulicher und natürlicher als das allgemeinere „brachten“.
- source_word: ἐπὶ τὸν τροχόν
  choice: auf das Rad
  rationale: ἐπί mit Akkusativ bezeichnet die Bewegung auf das Foltergerät hin; „auf das Rad“ wahrt diese Richtung und bleibt sprachlich natürlich.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil mit klarer Syntax. Die kausale beziehungsweise begleitende Nuance von μηδὲν ἀνύοντες bleibt durch „ohne etwas zu erreichen“ offen; der vom Text nicht ausdrücklich genannte Zweck der Folter wird nicht ergänzt.
