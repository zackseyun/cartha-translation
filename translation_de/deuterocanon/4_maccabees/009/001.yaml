base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/001.yaml
  text: What are you waiting for[b][a], O tyrant? For we are ready to die rather than transgress the commandments of our fathers.
translation:
  language: de
  text: »Warum zögerst du, Tyrann?«[a] Denn wir sind bereit zu sterben, statt die Gebote unserer Väter zu übertreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Worauf wartest du, Tyrann?« Die griechische Wendung kann Zögern, Säumen oder Warten ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί μέλλεις
  choice: Was zögerst du
  rationale: Die Wendung fordert den Tyrannen rhetorisch heraus und kann sein Zögern oder Säumen bezeichnen. „Was zögerst du?“ bewahrt die knappe Frageform und klingt im Deutschen natürlich.
- source_word: ὦ τύραννε
  choice: Tyrann
  rationale: τύραννος ist hier abwertend und bezeichnet den unterdrückerischen Herrscher. Die deutsche Anrede benötigt kein zusätzliches Äquivalent für ὦ.
- source_word: ἑτοῖμοι γάρ ἐσμεν
  choice: Denn wir sind bereit
  rationale: Die Übersetzung gibt sowohl γάρ als Begründungspartikel als auch ἑτοῖμοι im Sinn von Bereitschaft unmittelbar wieder.
- source_word: ἀποθνήσκειν
  choice: zu sterben
  rationale: Der griechische Infinitiv bedeutet schlicht „sterben“; dass es sich im Zusammenhang um eine Hinrichtung handelt, wird nicht eigens in das Verb eingetragen.
- source_word: ἢ παραβαίνειν
  choice: statt … zu übertreten
  rationale: ἢ stellt hier die verworfene Alternative dem Sterben gegenüber. „Statt“ bildet diesen Vorzug idiomatisch ab; „übertreten“ wahrt den ethisch-religiösen Ton.
- source_word: τὰς πατρίους ἡμῶν ἐντολάς
  choice: die Gebote unserer Väter
  rationale: πατρίους bezeichnet das von den Vorfahren Ererbte. „Gebote unserer Väter“ bewahrt die ausdrücklich väterlich-ancestrale Ausdrucksweise des Griechischen.
theological_decisions:
- issue: Ancestrale Bedeutung von πατρίους ἡμῶν
  choice: unserer Väter
  alternative: unserer Vorfahren / unsere überlieferten Gebote
  rationale: Die Formulierung bewahrt die maskuline Vorfahrensprache und den Bezug auf die ererbten Gebote jüdischer Tradition, ohne eine bestimmte konfessionelle Deutung hinzuzufügen.
- issue: Verhältnis von Sterben und Gebotsübertretung
  choice: bereit zu sterben, statt … zu übertreten
  alternative: bereit, entweder zu sterben oder … zu übertreten
  rationale: Der Zusammenhang und die Konstruktion stellen nicht zwei gleichwertige Möglichkeiten dar, sondern erklären den Tod für vorzugswürdig gegenüber der Übertretung. Die Übersetzung macht diese Spannung deutlich, ohne weitere theologische Folgerungen einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter rhetorischer Schärfe. Die Anrede „Tyrann“ erhält die pejorative Kraft des Griechischen; „Gebote unserer Väter“ hält den feierlichen, traditionsbezogenen Ton fest.
