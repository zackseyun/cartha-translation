lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Gibt den fortführenden Anschluss und die zeitliche Abfolge natürlich wieder.
- source_word: ταῦτα εἰπών
  choice: nachdem er dies gesagt hatte
  rationale: Das Aoristpartizip bezeichnet hier die der Haupthandlung vorausgehende Handlung; die deutsche Konstruktion gibt die Abfolge klar und idiomatisch wieder.
- source_word: ὁ ἱεροπρεπὴς
  choice: der ehrwürdige
  rationale: ἱεροπρεπής bezeichnet eine dem Heiligen angemessene, ehrfurchtgebietende Haltung. »Ehrwürdig« bewahrt den religiös-moralischen Klang, ohne dem jungen Mann ein priesterliches Amt zuzuschreiben.
- source_word: νεανίας
  choice: junge Mann
  rationale: Bezeichnet einen jungen männlichen Menschen und ist in modernem Deutsch natürlich und klar.
- source_word: ἀπέρρηξεν τὴν ψυχήν
  choice: hauchte … sein Leben aus
  rationale: Die Wendung bezeichnet das Sterben. Diese natürliche deutsche Todesformel wahrt mit »Leben« den Bezug von ψυχή, ohne daraus eine präzise anthropologische Lehraussage zu machen.
theological_decisions:
- issue: Wiedergabe von τὴν ψυχήν innerhalb einer Todesformel
  choice: sein Leben
  alternative: seine Seele
  rationale: Im Zusammenhang bezeichnet die gesamte Wendung den Tod. »Leben« vermeidet es, ψυχή hier unnötig als technische Aussage über eine vom Körper trennbare Seele festzulegen; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist erzählerisch flüssig und bewahrt zugleich die feierliche Charakterisierung des jungen Mannes.
