  text: And after saying this[a], the devout young man breathed his last.
translation:
  language: de
  text: Und nachdem er dies gesagt hatte, hauchte der fromme junge Mann sein Leben aus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »gab seine Seele hin«. Die griechische Wendung bezeichnet hier das Sterben.'
