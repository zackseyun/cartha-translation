  text: But he said, “Your device is not so strong, you limbs of a demon, as to lead my reason away. Cut off my limbs, and burn my flesh, and wrench my joints.”
translation:
  language: de
  text: 'Doch er sagte: »Euer Vorgehen ist nicht mächtig genug, ihr Glieder eines Dämons, um meine Vernunft fortzureißen. Trennt mir die Glieder ab, verbrennt mein Fleisch und verdreht meine Gelenke!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρόπος
  choice: Vorgehen
  rationale: Bezeichnet hier die von den Folterern angewandte Verfahrensweise; »Vorgehen« ist natürlich und bewahrt die Breite des griechischen Ausdrucks besser als ein technisch enges Wort.
- source_word: λογισμός
  choice: Vernunft
  rationale: Das Wort ist ein Leitbegriff des 4. Makkabäerbuchs und bezeichnet hier die vernünftige Urteilskraft beziehungsweise innere vernünftige Haltung.
- source_word: ἆξαι
  choice: fortzureißen
  rationale: Gibt das gewaltsame Wegführen im Zusammenhang mit der Folter anschaulich wieder, ohne ein Ziel hinzuzufügen.
- source_word: πυροῦτε
  choice: verbrennt
  rationale: Entspricht dem Bearbeiten mit Feuer und ist im Deutschen unmittelbar verständlich.
- source_word: στρεβλοῦτε
  choice: verdreht
  rationale: Gibt das gewaltsame Verdrehen oder Verrenkten der Gelenke konkret und idiomatisch wieder.
theological_decisions:
- issue: Anrede der Folterer als Teile eines Dämons
  choice: ihr Glieder eines Dämons
  alternative: ihr dämonischen Glieder
  rationale: Die gewählte Form bewahrt die Aussage, dass die Folterer als Glieder beziehungsweise Teile eines Dämons angesprochen werden, ohne daraus eine weitergehende Dämonologie abzuleiten.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter, trotziger Rede. Die körperliche Gewalt wird entsprechend dem griechischen Text klar benannt; die Satzstruktur bleibt gut vorlesbar.
