base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/015.yaml
  text: Most defiled tyrant[a], enemy of heavenly justice, and savage-minded man, you are not torturing me in this way because I have committed murder, nor because I have acted impiously, but because I am defending the divine law.
translation:
  language: de
  text: »Du durch und durch befleckter, grausam gesinnter Tyrann, Feind der himmlischen Gerechtigkeit[a]! Du folterst mich auf diese Weise nicht, weil ich einen Menschen ermordet habe, auch nicht, weil ich gottlos gehandelt habe, sondern weil ich das göttliche Gesetz verteidige.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Feind des himmlischen Gerichts«. Das griechische Wort kann sowohl Gerechtigkeit im weiteren Sinn als auch Gericht oder richterliche Strafe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιερώτατε
  choice: durch und durch befleckter
  rationale: Der Superlativ bezeichnet kultische beziehungsweise moralische Befleckung. Die idiomatische Verstärkung »durch und durch« gibt den Superlativ im Deutschen natürlich wieder, ohne die religiös-moralische Bildwelt einzuebnen.
- source_word: τῆς οὐρανίου δίκης
  choice: der himmlischen Gerechtigkeit
  rationale: δίκη kann Gerechtigkeit, Gericht oder Strafe bezeichnen. »Himmlische Gerechtigkeit« bewahrt hier den weiten moralisch-juristischen Sinn; die engere Möglichkeit »himmlisches Gericht« wird in der Fußnote genannt.
- source_word: ὠμόφρον
  choice: grausam Gesinnter
  rationale: Das Kompositum beschreibt eine grausame, rohe innere Haltung. Die substantivierte Anrede erhält sowohl die Charakterisierung als auch die scharfe rhetorische Form.
- source_word: καταικίζεις
  choice: folterst
  rationale: Im Zusammenhang der körperlichen Misshandlung des Märtyrers bezeichnet das Verb gewaltsames Quälen; »folterst« gibt die konkrete Intensität klar wieder.
- source_word: ἀνδροφονήσαντά
  choice: einen Menschen ermordet
  rationale: Das Partizip bezeichnet die Tötung eines Menschen im Sinne von Mord. Diese Wiedergabe erhält sowohl den Personenbezug als auch den strafrechtlichen Ernst.
- source_word: ἀσεβήσαντα
  choice: gottlos gehandelt
  rationale: ἀσεβέω bezeichnet ein Verhalten, das sich gegen Gott oder heilige Pflichten richtet. »Gottlos gehandelt« ist verständlich und wahrt die religiöse Dimension.
- source_word: θείου νόμου
  choice: das göttliche Gesetz
  rationale: Die Wiedergabe folgt der attributiven griechischen Formulierung und bewahrt den gehobenen Ton, ohne ausdrücklich »Gottes Gesetz« einzusetzen.
- source_word: προασπίζοντα
  choice: verteidige
  rationale: Das Verb bezeichnet das schützende Eintreten für etwas. »Verteidige« ist präzise, direkt und entspricht dem Gegensatz zu den zuvor zurückgewiesenen Vorwürfen.
theological_decisions:
- issue: Bedeutung von δίκη in »Feind der himmlischen Gerechtigkeit«
  choice: 'Weiter moralisch-juristischer Sinn: »Gerechtigkeit«'
  alternative: »Gericht« oder »Strafe« des Himmels
  rationale: Der Wortlaut kann sowohl die gerechte himmlische Ordnung als auch deren richterliche Durchsetzung bezeichnen. Der Haupttext wahrt mit »Gerechtigkeit« den weiteren Sinn; die Fußnote macht die echte Bedeutungsalternative sichtbar, ohne eine endzeitliche Deutung festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit scharfem rhetorischem Anredeton. Die doppelte Anrede und der Gegensatz »nicht … sondern« bleiben erhalten; die griechischen Partizipien werden für natürliches Deutsch als Kausalsätze wiedergegeben.
