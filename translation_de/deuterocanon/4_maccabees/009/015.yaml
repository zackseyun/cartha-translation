  source_fidelity: Der Sinn des griechischen Kontrasts wird grundsätzlich getroffen. Die beiden durch οὐκ … οὐδέ getrennt verneinten Partizipien sollten im Deutschen jedoch ebenso ausdrücklich als zwei Ausschlussgründe erscheinen; die vorliegende Verbindung mit „oder“ verwischt das „weder … noch“.
  naturalness: „du grausam Gesinnter“ ist im modernen Standarddeutsch keine natürliche Anrede. Eine koordinierte Charakterisierung des Tyrannen als „grausam gesinnter Tyrann“ ist idiomatisch und bewahrt die rhetorische Schärfe. Indikativ Perfekt („ermordet habe“, „gehandelt habe“) ist hier klarer als der Konjunktiv II.
  terminology: „durch und durch befleckter“, „himmlische Gerechtigkeit“, „folterst“, „gottlos gehandelt“ und „das göttliche Gesetz“ sind tragfähige Wiedergaben. Die Fußnote gibt die lexikalische Spannweite von δίκη angemessen wieder.
