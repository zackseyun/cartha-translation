  - severity: medium
    issue: „du grausam Gesinnter“ ist keine idiomatische moderne deutsche Anrede.
    rationale: Das griechische ὠμόφρον bezeichnet die grausame Gesinnung des angeredeten Tyrannen. Die Formulierung „grausam gesinnter Tyrann“ ist natürlich und präzise.
