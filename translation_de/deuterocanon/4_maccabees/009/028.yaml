base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/028.yaml
  text: Dragging him by the tendons with their iron hands[a], the leopard-like beasts stripped away all his flesh, even to his beard, and the skin of his head; but as he endured this grievous pain steadfastly, he said[d][c][b],
translation:
  language: de
  text: 'Die leopardengleichen Bestien zerrten ihn mit ihren eisernen Händen[b] an den Sehnen[a] und rissen ihm das ganze Fleisch bis zum Bart sowie die Haut seines Kopfes[d] ab. Er aber ertrug diesen qualvollen Schmerz standhaft und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Sehnen her“. Das griechische Wort bezeichnet Sehnen oder Muskelstränge; die Präposition kann den Ausgangspunkt des Reißens hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit eisernen Händen“. Gemeint sein können metallene Folterinstrumente; die bildhafte griechische Formulierung lässt dies jedoch offen.'
    reason: ambiguity
  - marker: d
    text: 'Oder: „die Kopfhaut“. Wörtlich steht im Griechischen „die Haut des Kopfes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τενόντων
  choice: an den Sehnen
  rationale: τένων bezeichnet Sehne oder Muskelstrang. ἀπό gibt hier den Ansatzpunkt des Ziehens an; „an den Sehnen“ ist im Deutschen natürlich und bewahrt das grausame anatomische Detail.
- source_word: ταῖς σιδηραῖς χερσὶν
  choice: mit ihren eisernen Händen
  rationale: χείρ bedeutet wörtlich „Hand“. Die wörtliche Bildsprache bleibt erhalten, ohne vorschnell Metallwerkzeuge oder Klauen anzunehmen.
- source_word: ἐπισπασάμενοι
  choice: sie zerrten ihn
  rationale: Das Partizip bezeichnet ein Heranziehen oder gewaltsames Ziehen. „zerrten“ gibt die Handlung im Zusammenhang anschaulich wieder.
- source_word: μέχρι γε τῶν γενείων
  choice: bis hinauf zum Kinn
  rationale: γένειον bezeichnet Kinn beziehungsweise Kinn- oder Bartpartie. „bis hinauf zum Kinn“ markiert die räumliche Ausdehnung und gibt das verstärkende γε wieder.
- source_word: τὴν σάρκα πᾶσαν
  choice: das ganze Fleisch
  rationale: σάρξ ist hier konkret-anatomisch gebraucht; die direkte Wiedergabe bewahrt die Härte des Berichts.
- source_word: τὴν τῆς κεφαλῆς δορὰν
  choice: die Haut seines Kopfes
  rationale: δορά bedeutet Haut oder Fell. Die Formulierung bleibt näher am Griechischen als das enger deutende „Kopfhaut“.
- source_word: οἱ παρδάλιοι θῆρες
  choice: diese raubtierhaften Wesen, Leoparden gleich
  rationale: παρδάλιος ist ein Adjektiv zu θῆρες. Die Wiedergabe bewahrt sowohl das Substantiv „Raubtiere/wilde Tiere“ als auch den leopardengleichen Vergleich, ohne daraus schlicht zoologische Leoparden zu machen.
- source_word: ἀπέσυραν
  choice: rissen ... ab
  rationale: Das Verb bedeutet wegziehen oder abstreifen. Bei Fleisch und Haut vermittelt „abreißen“ die gewaltsame Entfernung idiomatisch.
- source_word: βαρέως ... τὴν ἀλγηδόνα καρτερῶν
  choice: diesen qualvollen Schmerz standhaft ertrug
  rationale: βαρέως beschreibt hier die Schwere beziehungsweise Qual des Schmerzes, während καρτερεῖν das standhafte Ausharren ausdrückt. So werden beide Bedeutungsanteile getrennt und klar wiedergegeben.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt leitet die unmittelbar folgende Rede ein; im Deutschen ist „sagte“ die natürliche Erzählform.
