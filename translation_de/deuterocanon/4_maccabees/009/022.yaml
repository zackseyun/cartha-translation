lexical_decisions:
- source_word: ἀλλʼ
  choice: Doch
  rationale: Die adversative Konjunktion setzt den Satz in Kontrast zum vorausgehenden Zusammenhang; „Doch“ ist im Deutschen natürlich und würdevoll.
- source_word: ὥσπερ
  choice: gleichsam
  rationale: Kennzeichnet einen Vergleich und bewahrt, ohne eine buchstäbliche Verwandlung festzuschreiben, den bildhaften Charakter der Aussage.
- source_word: ἐν πυρί
  choice: im Feuer
  rationale: Gibt die naheliegende lokale Bedeutung wieder und lässt eine instrumentale Nuance offen.
- source_word: μετασχηματιζόμενος
  choice: verwandelt
  rationale: Das präsentische mediale/passive Partizip bezeichnet eine Veränderung der Gestalt oder des Zustands; die deutsche Partizipialkonstruktion erhält das rhetorische Bild.
- source_word: εἰς ἀφθαρσίαν
  choice: zur Unvergänglichkeit
  rationale: „Unvergänglichkeit“ bildet die Bedeutungsbreite von ἀφθαρσία besser ab als das engere „Unsterblichkeit“ und passt natürlich zur Konstruktion mit „verwandelt“.
- source_word: ὑπέμεινεν
  choice: ertrug
  rationale: Bezeichnet standhaftes Ausharren unter Leiden; „ertrug“ ist knapp, idiomatisch und dem Kontext angemessen.
- source_word: εὐγενῶς
  choice: mit edler Haltung
  rationale: Bewahrt den Gedanken sittlich vornehmer, würdiger Haltung, ohne ihn auf bloße Tapferkeit zu verengen.
- source_word: τὰς
  choice: die …
  rationale: Der überlieferte Ausschnitt bricht mit dem femininen Pluralartikel ab. „die …“ bildet diesen unvollständigen Beginn des Objekts sichtbar ab, ohne ein im griechischen Text nicht vorhandenes Demonstrativpronomen zu ergänzen.
theological_decisions:
- issue: Bedeutung von εἰς ἀφθαρσίαν im Martyriumskontext
  choice: zur Unvergänglichkeit
  alternative: zur Unsterblichkeit
  rationale: Der Ausdruck weist auf einen unvergänglichen Zustand hin, legt aber nicht ausschließlich die engere Vorstellung endlosen Lebens fest. Die Übersetzung wahrt diese theologische Bedeutungsbreite.
- issue: Grad der Tatsächlichkeit der Verwandlung
  choice: gleichsam … verwandelt
  alternative: wie … verwandelt
  rationale: ὥσπερ stellt die Verwandlung als Vergleich beziehungsweise rhetorisches Bild dar. „gleichsam“ erhält diese Schwebe, statt eine bereits vollzogene ontologische Verwandlung ausdrücklich zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gleichsam“ erhält den gehobenen rhetorischen Ton, bleibt aber verständlich. Die Auslassungspunkte machen den fragmentarischen Schluss transparent; es wird kein nicht belegtes Objekt ergänzt.
