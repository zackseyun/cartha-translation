translation:
  language: de
  text: Doch gleichsam im Feuer zur Unvergänglichkeit[a] verwandelt, ertrug er mit edler Haltung die …[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Unsterblichkeit“.'
