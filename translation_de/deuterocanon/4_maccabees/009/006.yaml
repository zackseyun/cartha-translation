revisions:
- from: Wenn aber die alten Männer der Hebräer um ihrer Gottesfurcht willen Foltern erduldeten und starben, dann sollten erst recht wir jungen Männer sterben, indem wir die Foltern verachten, mit denen du uns zwingen willst und die auch der greise Lehrer überwunden hat.
  to: Wenn aber die alten Männer der Hebräer um ihrer Gottesfurcht willen Foltern erduldeten und starben, dann sollten wir jungen Männer mit größerem Recht sterben, indem wir die Foltern deiner Zwangsmaßnahmen außer Acht lassen, die auch der greise Lehrer überwunden hat.
  rationale: Die Revision bewahrt die Struktur des griechischen Konditionalsatzes und die konkrete Altersbezeichnung. Sie stellt die in δικαιότερον enthaltene vergleichende Berechtigung ausdrücklich wieder her und gibt die dichte Genitivverbindung τῶν σῶν ἀναγκῶν ohne Zusatz einer zukünftigen Absicht wieder. Die Formulierung zu ὑπεριδόντες wird näher an dessen Bedeutung als bewusstes Nichtbeachten gehalten.
