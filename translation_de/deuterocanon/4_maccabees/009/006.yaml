base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/006.yaml
  text: But if the old men of the Hebrews died after enduring tortures because of godliness, how much more rightly should we, the young men, die, having disregarded the tortures of your compulsion, which the aged instructor also conquered.
translation:
  language: de
  text: Wenn aber die alten Männer der Hebräer um ihrer Gottesfurcht willen Foltern erduldeten und starben, dann sollten wir jungen Männer mit größerem Recht sterben, indem wir die Foltern deiner Zwangsmaßnahmen außer Acht lassen, die auch der greise Lehrer überwunden hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ γέροντες
  choice: die alten Männer
  rationale: Gibt die konkrete Altersbezeichnung im Unterschied zum möglichen Amtsbegriff „Älteste“ wieder.
- source_word: διὰ τὴν εὐσέβειαν
  choice: um ihrer Gottesfurcht willen
  rationale: εὐσέβεια bezeichnet hier religiöse Ehrfurcht und treue Hingabe an Gott; „Gottesfurcht“ ist im Kontext prägnant und natürlich.
- source_word: βασανισμοὺς ὑπομείναντες
  choice: Foltern erduldeten
  rationale: Bewahrt sowohl die körperliche Qual von βασανισμός als auch das standhafte Ausharren von ὑπομένω.
- source_word: ἀποθάνοιμεν ἂν δικαιότερον
  choice: dann sollten erst recht wir ... sterben
  rationale: Vermittelt den potentialen beziehungsweise folgernden Sinn von ἄν und den komparativen Gedanken von δικαιότερον idiomatisch.
- source_word: τὰς βασάνους τῶν σῶν ἀναγκῶν
  choice: die Foltern, mit denen du uns zwingen willst
  rationale: Löst den dichten Genitiv natürlich auf und bewahrt den Gedanken des vom Herrscher ausgeübten Zwangs.
- source_word: ὑπεριδόντες
  choice: indem wir ... verachten
  rationale: Drückt das bewusste Geringschätzen beziehungsweise Nichtachten der angedrohten Foltern aus.
- source_word: ὁ παιδευτὴς γέρων
  choice: der greise Lehrer
  rationale: Bewahrt sowohl seine Rolle als Erzieher oder Lehrer als auch die ausdrückliche Altersangabe.
- source_word: ἐνίκησεν
  choice: überwunden hat
  rationale: Gibt die Siegesmetaphorik des griechischen Verbs direkt wieder.
theological_decisions:
- issue: Bedeutung von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ macht die Ausrichtung auf Gott deutlich, ohne eine bestimmte konfessionelle Lehre einzutragen; „Frömmigkeit“ wäre ebenfalls möglich, kann modern aber stärker eine allgemeine religiöse Haltung bezeichnen.
- issue: Moralischer Vergleich in δικαιότερον
  choice: erst recht ... sollten
  alternative: mit größerem Recht
  rationale: Die gewählte Form bewahrt die argumentative Steigerung und klingt im Deutschen natürlicher, ohne zu erklären, weshalb der Tod der Jüngeren „gerechter“ wäre.
translation_notes:
  register: Dignifiziertes, modernes Standarddeutsch. Der lange griechische Konditionalsatz bleibt als zusammenhängende Argumentation erhalten; schwer verständliche Genitivfügung wird maßvoll idiomatisiert. Keine konfessionellen Zusatzdeutungen.
