lexical_decisions:
- source_word: κατὰ πᾶν μέλος
  choice: Glied um Glied
  rationale: Die distributive Wendung bezeichnet jedes einzelne Körperglied; „Glied um Glied“ gibt den körperlichen und fortschreitenden Charakter der Folter natürlich wieder.
- source_word: κλώμενος
  choice: während ihm … gebrochen wurde
  rationale: Das Passivpartizip beschreibt das körperliche Brechen, das er erlitt. Die finite Wendung ist im Deutschen natürlicher und wahrt die Gleichzeitigkeit mit seinem fortgesetzten Reden.
- source_word: κατηγόρει
  choice: klagte er sie unablässig an
  rationale: „Anklagen“ wahrt die Grundbedeutung von κατηγορέω; „unablässig“ bringt den durativen Aspekt des Imperfekts zum Ausdruck, ohne den Vorgang als einmalige Äußerung erscheinen zu lassen.
- source_word: λέγων
  choice: und sagte
  rationale: Die Formulierung leitet die folgende direkte Rede idiomatisch ein und hält den Satz für den nächsten Vers offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschauliche distributive Formulierung bleibt erhalten; der offene Übergang zur folgenden Rede wird durch den Doppelpunkt markiert.
