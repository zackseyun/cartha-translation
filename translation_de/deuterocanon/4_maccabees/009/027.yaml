  footnotes:
  - marker: a
    text: 'Oder: „seine edle Absicht“ oder „seine edle Gesinnung“. Das griechische Wort γνώμη kann eine Absicht, einen Entschluss oder eine Denk- und Sinnesart bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δʼ εἰ
  choice: Und als
  rationale: Die Wendung leitet den nächsten erzählten Umstand ein. „Und als“ gibt den Übergang im Deutschen natürlich und quellennah wieder.
- source_word: φαγεῖν
  choice: essen
  rationale: Der Infinitiv bedeutet schlicht „essen“; eine Erweiterung ist nicht erforderlich.
- source_word: βούλοιτο
  choice: wolle
  rationale: Der Konjunktiv in der indirekten Frage gibt den volitiven Sinn des griechischen Optativs knapp und idiomatisch wieder.
- source_word: πρὶν βασανίζεσθαι
  choice: vor der Folter
  rationale: Im Zusammenhang des Martyriums bezeichnet βασανίζεσθαι tatsächliche Folter. Die substantivische Wendung ist natürlich und bewahrt die zeitliche Beziehung.
- source_word: πυνθανόμενοι
  choice: als sie ihn fragten
  rationale: Das Partizip des Erkundigens wird als temporaler Nebensatz wiedergegeben. Das Objekt „ihn“ ist aus dem Zusammenhang und der indirekten Frage eindeutig erschließbar.
- source_word: τὴν εὐγενῆ γνώμην
  choice: seinen edlen Entschluss
  rationale: γνώμη bezeichnet hier die gefestigte Absicht oder Haltung des Märtyrers, nicht bloß eine Meinung. „Entschluss“ bewahrt die willentliche Kraft; „edel“ gibt εὐγενῆ als sittliche Qualität wieder.
- source_word: ἤκουσαν
  choice: hörten sie
  rationale: Direkte Wiedergabe des einfachen Aorists von ἀκούω.
theological_decisions:
- issue: Wiedergabe von γνώμη im Kontext des Martyriums
  choice: Entschluss
  alternative: Gesinnung; Absicht; Haltung
  rationale: „Entschluss“ hebt die standhafte Willensentscheidung unter Verfolgung hervor, ohne spätere dogmatische Vorstellungen einzutragen. Die Fußnote wahrt die Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt wegen des abschließenden Kommas offen, da er im griechischen Zusammenhang in den folgenden Vers überleitet.
