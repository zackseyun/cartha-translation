  source_fidelity: Die Satzstruktur, die rhetorische Frage, der Superlativ, das passive Konfliktbild und die kausale bzw. begleitende Partizipialverbindung sind im Wesentlichen treffend wiedergegeben. Allerdings bleibt das Possessivpronomen ἡμῶν in διὰ τὴν εὐσέβειαν ἡμῶν im deutschen Text unübersetzt. Es muss ausdrücklich kenntlich sein, dass die Gottesfurcht die der Märtyrer ist.
  naturalness: Der Ton ist würdig, scharf und im modernen Standarddeutsch gut verständlich. „Das hochmütige Denken deiner Tyrannei“ ist verständlich, wirkt jedoch etwas abstrakt und weniger idiomatisch als „die hochmütige Denkweise deiner Tyrannenherrschaft“.
  terminology: „Standhaftigkeit“ gibt ὑπομονή angemessen wieder. „Gottesfurcht“ ist für εὐσέβεια im Kontext tragfähig, sofern der im Griechischen ausgedrückte Bezug „unserer“ erhalten bleibt. „Denkweise“ bewahrt bei λογισμός sowohl den Bezug zum Denken/Vernunftthema als auch die mögliche Bedeutung einer herrschenden Geisteshaltung.
