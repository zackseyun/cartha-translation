base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/030.yaml
  text: Do you not think[a], O most savage tyrant of all, that you are now being tortured more than I am[b], seeing the proud reasoning of your tyranny being conquered by our endurance for the sake of godliness?
translation:
  language: de
  text: Meinst du nicht, du grausamster aller Tyrannen, dass du jetzt mehr gequält wirst als ich, da du siehst, wie die hochmütige Denkweise deiner Tyrannenherrschaft durch unsere Standhaftigkeit um unserer Gottesfurcht willen besiegt wird?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ δοκεῖς
  choice: Meinst du nicht
  rationale: Gibt die zugespitzte rhetorische Frage natürlich und unmittelbar wieder.
- source_word: ὦ πάντων ὠμότατε τύραννε
  choice: du grausamster aller Tyrannen
  rationale: Bewahrt den Superlativ und πάντων; die direkte Anrede klingt im heutigen Deutschen würdig und scharf, ohne ein künstliches „O“.
- source_word: πλεῖον ἐμοῦ σε νῦν βασανίζεσθαι
  choice: dass du jetzt mehr gequält wirst als ich
  rationale: Bewahrt die ironische Umkehrung und die Foltersprache von βασανίζεσθαι, lässt aber offen, ob die Qual körperlich oder innerlich zu verstehen ist.
- source_word: ὁρῶν
  choice: da du siehst
  rationale: Gibt das Partizip als kausal-begleitenden Umstand wieder und verbindet die Qual des Tyrannen mit der von ihm wahrgenommenen Niederlage.
- source_word: τὸν τῆς τυραννίδος ὑπερήφανον λογισμὸν
  choice: das hochmütige Denken deiner Tyrannei
  rationale: „Denken“ wahrt das Motiv des λογισμός als Denk- und Vernunfttätigkeit, ohne den Ausdruck vorschnell auf Plan, Gesinnung oder Entschluss einzuengen.
- source_word: νικώμενον
  choice: besiegt wird
  rationale: Erhält das passive Konfliktbild und klingt im Deutschen natürlicher als „bezwungen werdend“.
- source_word: ὑπὸ τῆς ... ἡμῶν ὑπομονῆς
  choice: durch unsere Standhaftigkeit
  rationale: „Standhaftigkeit“ bezeichnet hier das beharrliche Ausharren unter Folter und passt idiomatisch zum Märtyrerkontext.
- source_word: διὰ τὴν εὐσέβειαν
  choice: um der Gottesfurcht willen
  rationale: Bezeichnet die auf Gott gerichtete Frömmigkeit und Treue als Grund beziehungsweise Beweggrund der Standhaftigkeit, ohne sie auf bloße Religiosität zu reduzieren.
theological_decisions:
- issue: Bedeutung von εὐσέβεια im Märtyrerkontext
  choice: Gottesfurcht
  alternative: Frömmigkeit; Ehrfurcht vor Gott
  rationale: „Gottesfurcht“ macht die Ausrichtung auf Gott ausdrücklich und umfasst ehrfürchtige, gelebte Treue; der Ausdruck legt keine konfessionelle Sonderdeutung fest.
- issue: Bedeutung von λογισμός als Leitmotiv in 4 Makkabäer
  choice: Denken
  alternative: Gesinnung; Überlegung; Vernunft
  rationale: „Denken“ erhält die begriffliche Verbindung zum Vernunftthema des Buches und zugleich die mögliche Bedeutung einer herrschenden Denkweise. Die Ambivalenz zwischen Denkakt und Geisteshaltung wird nicht dogmatisch aufgelöst.
- issue: Bezug von διὰ τὴν εὐσέβειαν ἡμῶν
  choice: unsere Standhaftigkeit um der Gottesfurcht willen
  alternative: unsere Standhaftigkeit wegen unserer Frömmigkeit
  rationale: Im Griechischen steht ἡμῶν syntaktisch bei ὑπομονῆς; die Übersetzung gibt daher ausdrücklich „unsere Standhaftigkeit“ wieder. εὐσέβεια erscheint als deren Anlass oder Beweggrund.
translation_notes:
  register: Modernes Standarddeutsch mit würdig-konfrontativem Ton. Die direkte Du-Anrede entspricht der griechischen Singularform. Keine Fußnoten sind erforderlich, da die wichtigsten Mehrdeutigkeiten im Text durch hinreichend offene deutsche Begriffe gewahrt bleiben.
