  text: through which our righteous and ancestral providence[a], having become gracious to the nation[b], might punish the accursed tyrant.
translation:
  language: de
  text: durch die unsere gerechte, angestammte Vorsehung, dem Volk gnädig geworden[a], den verfluchten Tyrannen[b] bestrafen möge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wohlgesinnt“ oder „barmherzig geworden“. Das griechische Wort bezeichnet eine günstige, huldvolle Haltung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den unheilbringenden Tyrannen“. Das griechische Wort kann einen Verfluchten oder eine mit Vergeltung und Verderben verbundene Gestalt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἧς
  choice: durch die
  rationale: διά mit dem Relativpronomen bezeichnet hier das Mittel. Das feminine „die“ bewahrt den Rückbezug auf das vorausgehende feminine Bezugswort, ohne dieses näher auszudeuten.
- source_word: ἵλεως
  choice: gnädig
  rationale: ἵλεως bezeichnet eine günstige, huldvolle oder barmherzige Haltung. „gnädig“ verbindet sich im Deutschen natürlich mit „dem Volk“ und wahrt den gehobenen theologischen Ton.
- source_word: ἡ δικαία καὶ πάτριος ἡμῶν πρόνοια
  choice: unsere gerechte, von den Vätern überkommene Vorsehung
  rationale: πρόνοια wird im theologischen Zusammenhang angemessen mit „Vorsehung“ wiedergegeben. πάτριος bedeutet hier nicht „väterlich“, sondern verweist auf die Väter beziehungsweise die ererbte Überlieferung; „von den Vätern überkommen“ macht diesen Sinn verständlich.
- source_word: τῷ ἔθνει
  choice: dem Volk
  rationale: Der Dativ gehört zu ἵλεως und γενηθεῖσα. Im jüdischen kollektiven Zusammenhang ist „Volk“ für ἔθνος im Deutschen natürlicher als „Nation“.
- source_word: γενηθεῖσα
  choice: gnädig geworden
  rationale: Das Aoristpartizip von γίνομαι wird resultativ wiedergegeben und bleibt als partizipiale Fügung erkennbar.
- source_word: τιμωρήσειεν
  choice: bestrafen möge
  rationale: Der Optativ hat im rhetorisch-gebetsartigen Zusammenhang Wunschcharakter. „möge“ wahrt diese Modalität; „bestrafen“ vermeidet eine unnötige Festlegung auf persönliche Rache.
- source_word: τὸν ἀλάστορα τύραννον
  choice: den verfluchten Tyrannen
  rationale: ἀλάστωρ kann einen unter einem Fluch stehenden, verworfenen oder unheilbringenden Menschen bezeichnen. „verflucht“ ist im Kontext eine natürliche, scharf verurteilende Wiedergabe, während die weitergehende Bedeutungsbreite in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Bezug und Charakter der „gerechten, von den Vätern überkommenen Vorsehung“
  choice: Die Formulierung bleibt als ehrfürchtiger Hinweis auf die in Israels überlieferter Glaubenswelt erfahrene Vorsehung stehen, ohne „Gottes“ ausdrücklich zu ergänzen.
  alternative: Eine rein abstrakte oder unpersönliche Vorsehung beziehungsweise die ausdrückliche Ergänzung „Gottes Vorsehung“.
  rationale: Der griechische Text verwendet πρόνοια in einem erhöhten theologischen Zusammenhang, nennt Gott an dieser Stelle jedoch nicht ausdrücklich. Die Übersetzung wahrt sowohl den theologischen Klang als auch diese grammatische Zurückhaltung.
- issue: Modalität von τιμωρήσειεν
  choice: 'Wunsch beziehungsweise erhofftes Handeln: „bestrafen möge“.'
  alternative: 'Festere Aussage: „bestrafen würde“; stärker vergeltend: „Rache nehmen möge“.'
  rationale: Der Optativ lässt die Aussage als Wunsch oder Möglichkeit erscheinen. Die Übersetzung legt sie weder als sichere Vorhersage noch als ausdrücklich rächendes Handeln fest.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Die Satzperiode und das Partizip bewahren den feierlich-rhetorischen Charakter des Griechischen; „von den Vätern überkommen“ vermeidet das missverständliche „väterlich“. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
