  source_fidelity: 'Die Satzstruktur wird zutreffend wiedergegeben: διʼ ἧς bleibt als instrumentales Relativ („durch die“) erhalten, ἵλεως γενηθεῖσα τῷ ἔθνει als „dem Volk gnädig geworden“, und der Optativ τιμωρήσειεν als Wunschform („… bestrafen möge“). „verfluchten Tyrannen“ ist eine vertretbare kontextuelle Wiedergabe von τὸν ἀλάστορα τύραννον; die Fußnote bewahrt die weitergehende Bedeutungsspanne.'
  naturalness: 'Der Satz ist im gehobenen Register flüssig und als vom vorhergehenden Satz abhängiger Relativsatz verständlich. „Von den Vätern überkommene Vorsehung“ ist jedoch semantisch etwas unglücklich: Es kann nahelegen, die Vorsehung sei ein von menschlichen Vorfahren überlieferter Gegenstand. „Angestammte“ gibt den auf die Vorfahren bzw. das überkommene Erbe bezogenen Charakter von πάτριος idiomatischer wieder.'
  terminology: „Vorsehung“, „gnädig“, „Volk“, „bestrafen“ und „Tyrann“ entsprechen dem theologischen und rhetorischen Register. Die Änderung zu „angestammte Vorsehung“ vermeidet eine zu konkrete Deutung von πάτριος als Überlieferungsakt und erhält dessen knappe Ambiguität.
