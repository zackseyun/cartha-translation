  text: Counselor of lawlessness[a], tyrant, do not hate us; rather, have mercy on us more than on them.
translation:
  language: de
  text: Du Ratgeber, du Tyrann der Gesetzlosigkeit, hasse uns nicht mehr als sie[a]; hab Erbarmen mit uns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Satz ist stark verdichtet: wörtlich etwa: „Ratgeber, Tyrann der Gesetzlosigkeit, hasse uns nicht mehr als sie, hab Erbarmen mit uns.“ Die Vergleichswendung kann möglicherweise auch mit der Bitte um Erbarmen verbunden werden: „Hab mit uns mehr Erbarmen als mit ihnen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμβουλε
  choice: Ratgeber
  rationale: Der Vokativ bezeichnet einen Ratgeber oder Berater. „Ratgeber“ wahrt die direkte Anrede und den vorwurfsvollen Zusammenhang.
- source_word: τύραννε
  choice: Tyrann
  rationale: Der Vokativ richtet sich an den verfolgenden Herrscher; „Tyrann“ erhält die stark negative politische und moralische Wertung.
- source_word: παρανομίας
  choice: der Gesetzlosigkeit
  rationale: Der Genitiv wird formal beibehalten, weil nicht völlig eindeutig ist, ob er vor allem σύμβουλε oder die gesamte Anrede näher bestimmt. „Gesetzlosigkeit“ gibt den Gedanken des Verstoßes gegen das Gesetz präzise wieder.
- source_word: μὴ … μισῶν
  choice: hasse … nicht
  rationale: Die griechische Verbindung aus μή und Partizip wird als natürliche deutsche Aufforderung mit finitem Verb wiedergegeben.
- source_word: ὑπὲρ αὐτούς
  choice: mehr … als mit ihnen
  rationale: ὑπέρ mit Akkusativ kann einen Vergleich ausdrücken. Die Stellung im komprimierten griechischen Satz lässt jedoch offen, ob die Wendung enger zu „hassen“ oder zu „Erbarmen haben“ gehört; die Hauptfassung folgt der konsultierten Lesart und erläutert die Unsicherheit in der Fußnote.
- source_word: ἐλέα
  choice: hab … Erbarmen
  rationale: Der Imperativ von ἐλεέω fordert zu Erbarmen auf. Die Formulierung ist würdig, verständlich und bewahrt das ethische Gewicht des griechischen Verbs.
theological_decisions:
- issue: Bezug der Vergleichswendung ὑπὲρ αὐτούς
  choice: 'Die Bitte um Erbarmen wird vergleichend verstanden: „mit uns mehr Erbarmen als mit ihnen“.'
  alternative: „Hasse uns nicht mehr als sie“ oder kausal „Hasse uns nicht ihretwegen“.
  rationale: Der überlieferte Satz ist stark verdichtet, und ὑπέρ mit Akkusativ lässt hier mehrere syntaktische Bezüge zu. Die Hauptfassung bietet eine kohärente vergleichende Lesart, ohne die anderen Möglichkeiten in der Fußnote zu verschweigen.
- issue: Zuordnung von παρανομίας in der doppelten Anrede
  choice: „Ratgeber der Gesetzlosigkeit“; „Tyrann“ als zweite, eigenständige Anrede.
  alternative: „Ratgeber, du Tyrann der Gesetzlosigkeit“ oder freier „gesetzloser Tyrann“.
  rationale: Die Wortfolge σύμβουλε τύραννε παρανομίας ist syntaktisch knapp. Die gewählte Fassung folgt der naheliegenden Verbindung des Genitivs mit „Ratgeber“, bewahrt aber die doppelten Vokative.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdiger direkter Anrede. Das zweimalige „du“ macht die beiden Vokative im Deutschen hörbar; das Semikolon gliedert den komprimierten griechischen Satz. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Eröffnungsformel.
