base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/020.yaml
  text: And the wheel was defiled all around with blood[a], and the heap of coals was being quenched by the drops of bodily fluids[c][b], and the flesh was flowing around the axles of the machine.
translation:
  language: de
  text: Und das Rad war ringsum mit Blut besudelt[a], der Haufen glühender Kohlen wurde durch die Tropfen der Wundflüssigkeit[b] gelöscht, und um die Achsen des Foltergeräts floss das Fleisch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war ringsum mit Blut befleckt“. Das griechische Verb kann ein Beflecken bezeichnen, trägt aber auch den Sinn von Verunreinigung oder Besudelung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch die Tropfen der Wundflüssigkeiten“. Das griechische Wort bezeichnet Flüssigkeit, die aus Wunden austritt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνετο
  choice: war … besudelt
  rationale: „Besudeln“ bewahrt sowohl das sichtbare Beflecken durch Blut als auch den stärkeren Beiklang von Verunreinigung, ohne im Deutschen unnatürlich zu wirken.
- source_word: πάντοθεν
  choice: ringsum
  rationale: Gibt die räumliche Bedeutung „von allen Seiten/rundherum“ knapp und natürlich wieder.
- source_word: ὁ τροχός
  choice: das Rad
  rationale: Direkte Bezeichnung des im Kontext verwendeten Folterrads.
- source_word: ὁ σωρὸς τῆς ἀνθρακιᾶς
  choice: der Haufen glühender Kohlen
  rationale: ἀνθρακιά bezeichnet hier einen Kohlenherd beziehungsweise eine Ansammlung glühender Kohlen; die Wiedergabe macht die für das Löschen erforderliche Glut verständlich.
- source_word: τοῖς τῶν ἰχώρων … σταλαγμοῖς
  choice: durch die Tropfen der Wundflüssigkeit
  rationale: ἰχώρ bezeichnet austretende Flüssigkeit aus Wunden. „Wundflüssigkeit“ ist im modernen Deutsch verständlich und genauer als das mehrdeutige „Körperflüssigkeit“.
- source_word: ἐσβέννυτο
  choice: wurde … gelöscht
  rationale: Das Imperfekt beschreibt den fortdauernden Vorgang; die deutsche Passivform gibt diesen im Zusammenhang ausreichend wieder.
- source_word: περὶ τοὺς ἄξονας
  choice: um die Achsen
  rationale: Bewahrt die konkrete räumliche Aussage des Griechischen.
- source_word: τοῦ ὀργάνου
  choice: des Foltergeräts
  rationale: ὄργανον meint hier die verwendete Vorrichtung. „Foltergerät“ verdeutlicht die aus dem Kontext sichere Funktion, ohne eine bestimmte Bauart zu unterstellen.
- source_word: περιέρεον
  choice: floss
  rationale: Gibt die fortdauernde Bewegung idiomatisch wieder; die räumliche Komponente steht bereits in „um die Achsen“.
- source_word: αἱ σάρκες
  choice: das Fleisch
  rationale: Der griechische Plural wird im Deutschen als kollektiver Singular natürlich und eindringlich wiedergegeben.
