base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/007.yaml
  text: Go on, then, tyrant; and if you kill our lives because of godliness, do not suppose that by torturing us you are harming us.
translation:
  language: de
  text: Versuch es also nur, Tyrann! Selbst wenn du uns wegen unserer Gottesfurcht das Leben nimmst, glaube nicht, dass du uns durch deine Foltern schadest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεῖραζε
  choice: Versuch es ... nur
  rationale: Der Imperativ fordert den Tyrannen heraus, sein Vorhaben auszuführen; die idiomatische Wendung bewahrt den trotzigen Ton.
- source_word: τὰς ἡμῶν ψυχὰς ... θανατώσεις
  choice: uns ... das Leben nimmst
  rationale: ψυχή bezeichnet hier im Zusammenhang mit θανατόω das irdische Leben bzw. die Person, nicht zwingend die vom Leib unterschiedene Seele. Die Formulierung entspricht dem Sinn des griechischen Ausdrucks natürlich auf Deutsch.
- source_word: διὰ τὴν εὐσέβειαν
  choice: wegen unserer Gottesfurcht
  rationale: εὐσέβεια bezeichnet hier die ehrfürchtige Treue gegenüber Gott; „Gottesfurcht“ ist im jüdischen Martyriumskontext präziser als das heute oft missverständliche „Frömmigkeit“.
- source_word: βασανίζων
  choice: durch deine Foltern
  rationale: Das Partizip bezeichnet das Foltern als Mittel des vermeintlichen Schadens; die substantivische deutsche Wendung ist klar und idiomatisch.
- source_word: βλάπτειν
  choice: schadest
  rationale: Bewahrt die allgemeine Bedeutung „Schaden zufügen“, ohne die paradoxe Behauptung theologisch weiter auszudeuten.
theological_decisions:
- issue: Bedeutung von ψυχή im Verhältnis zu Tod und Martyrium
  choice: „das Leben“
  alternative: „die Seele“
  rationale: Die Verbindung τὰς ψυχὰς θανατοῦν bedeutet hier, Menschen zu töten bzw. ihnen das Leben zu nehmen. „Seele“ könnte im Deutschen fälschlich nahelegen, der Tyrann könne die unsterbliche Seele vernichten.
- issue: Behauptung, Folter richte keinen Schaden an
  choice: Die uneingeschränkte paradoxe Aussage bleibt stehen.
  alternative: Eine erklärende Einschränkung auf geistlichen oder endgültigen Schaden
  rationale: Der griechische Text spezifiziert die Art des Schadens nicht. Die Spannung zwischen körperlichem Leid und der Aussage, nicht geschädigt zu werden, darf nicht durch eine eingefügte Deutung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, trotziger Anrede. „Tyrann“ bildet τύραννε sachgerecht ab; der Ausruf unterstreicht die Herausforderung, ohne den Inhalt zu erweitern.
