  source_fidelity: Die Übersetzung gibt πεῖραζε γὰρ οὖν als trotzige Herausforderung treffend wieder. „uns das Leben nimmst“ entspricht τὰς ἡμῶν ψυχὰς ... θανατώσεις im Kontext idiomatisch und ohne eine spekulative Seelenlehre einzutragen. „wegen unserer Gottesfurcht“ gibt διὰ τὴν εὐσέβειαν angemessen wieder. Die Aussage, dass Folter keinen Schaden zufüge, bleibt wie im Griechischen bewusst uneingeschränkt.
  naturalness: Modernes, verständliches und zugleich würdiges Deutsch. Die direkte Anrede „Tyrann“ und die imperativische Eröffnung vermitteln den herausfordernden Ton des Satzes. „durch deine Foltern schadest“ ist grammatisch und stilistisch natürlich.
