  text: They are unconquerable on behalf of virtue[a]. While he was still saying these things, they spread fire beneath him, and, by intensifying the wheel[c][b], they tightened it further.
translation:
  language: de
  text: Für die Tugend sind sie unbesiegbar.[a] Noch während er dies sagte, breiteten sie unter ihm Feuer aus, und indem sie das Rad[b] weiter antrieben, erhöhten sie die Spannung noch weiter.[c]
