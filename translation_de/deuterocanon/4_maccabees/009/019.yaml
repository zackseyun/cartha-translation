- from: Für die Tugend sind sie unbesiegbar.[a] Noch während er dies sagte, breiteten sie Feuer unter ihm aus und versetzten das Rad[b] in heftigere Bewegung; so erhöhten sie die Spannung noch weiter.[c]
  to: Für die Tugend sind sie unbesiegbar.[a] Noch während er dies sagte, breiteten sie unter ihm Feuer aus, und indem sie das Rad[b] weiter antrieben, erhöhten sie die Spannung noch weiter.[c]
  rationale: Die Revision ersetzt eine mechanisch zu konkrete und stilistisch sperrige Formulierung durch eine natürliche deutsche Wiedergabe, die das Anreizen bzw. Antreiben des Rades ausdrückt, ohne ein bestimmtes Drehen oder eine bestimmte Foltermechanik zu behaupten. Der abschließende Ausdruck bleibt bewusst unpersönlich, da das griechische Objekt nicht genannt und die genaue Handlung umstritten ist. Sämtliche Fußnotenanker und ihre Erläuterungen bleiben erhalten.
