    text: 'Oder: „Um der Tugend willen.“ Die griechische Wendung kann bezeichnen, dass jemand für die Tugend eintritt oder um ihretwillen leidet.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das bei der Folter verwendete Rad.
    reason: cultural_note
  - marker: c
