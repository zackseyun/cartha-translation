  source_fidelity: 'Die Grundbedeutung wird überwiegend getroffen: ὑπὲρ ἀρετῆς ist angemessen mit „für die Tugend“ wiedergegeben, ἀνίκητοι mit „unbesiegbar“, und die fortdauernde Rede in ταῦτα λέγων ἔτι ist erhalten. πῦρ ἐπέστρωσαν kann in diesem Kontext als Ausbreiten bzw. Auslegen von Feuer unter dem Gefolterten verstanden werden. Die schwierige Verbindung διερεθίζοντες τὸν τροχὸν προσεπικατέτεινον verlangt jedoch eine vorsichtige, nicht zu mechanisch präzisierte Wiedergabe.'
  naturalness: „Versetzten das Rad in heftigere Bewegung“ ist zwar verständlich, klingt aber technisch und legt stärker als der griechische Wortlaut eine bestimmte Bewegungsart nahe. Die Konstruktion mit Semikolon und „so“ trennt zudem die Partizipialhandlung unnötig von der folgenden Steigerung. Eine Wiedergabe mit „indem sie das Rad weiter antrieben“ ist idiomatischer und wahrt die funktionale Unbestimmtheit besser.
  terminology: „Tugend“ bewahrt den philosophisch geprägten Begriff ἀρετή sachgerecht. „Rad“ soll im Haupttext bleiben; die kulturelle Erläuterung als Folterinstrument ist angemessen. Die Fußnote zum Schlussverb muss die Unsicherheit über das nicht ausdrücklich genannte Objekt weiterhin transparent machen.
