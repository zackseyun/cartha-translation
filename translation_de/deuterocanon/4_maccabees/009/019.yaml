    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἀρετῆς
  choice: für die Tugend
  rationale: ὑπέρ mit Genitiv bezeichnet hier die Sache, für die jemand eintritt oder leidet. „Für die Tugend“ ist im Deutschen natürlich und bewahrt zugleich den moralphilosophischen Leitbegriff ἀρετή.
- source_word: ἀνίκητοι
  choice: unbesiegbar
  rationale: Das Adjektiv bezeichnet Menschen, die nicht bezwungen werden können; „unbesiegbar“ gibt die Aussage knapp und verständlich wieder.
- source_word: ταῦτα λέγων ἔτι
  choice: noch während er dies sagte
  rationale: Die Partizipialkonstruktion mit ἔτι bezeichnet ein noch andauerndes Sprechen, während die nächste Handlung einsetzt.
- source_word: πῦρ ἐπέστρωσαν
  choice: breiteten sie Feuer unter ihm aus
  rationale: ἐπιστρώννυμι bedeutet ausbreiten oder darunterlegen. „Unter ihm“ wird aus der Folterszene ergänzt und macht den Vorgang verständlich, ohne ein im Griechischen nicht ausdrücklich genanntes Mehr an Feuer einzutragen.
- source_word: διερεθίζοντες τὸν τροχόν
  choice: versetzten das Rad in heftigere Bewegung
  rationale: διερεθίζω bezeichnet ein starkes Erregen, Antreiben oder Intensivieren. Die Wiedergabe beschreibt eine gesteigerte Einwirkung auf das Rad, ohne das nicht belegte präzisere Verb „drehen“ einzusetzen.
- source_word: προσεπικατέτεινον
  choice: so erhöhten sie die Spannung noch weiter
  rationale: Das intensive Kompositum bezeichnet ein zusätzliches Anspannen oder Strecken. Die unpersönlichere Formulierung bewahrt die Unsicherheit darüber, ob grammatisch das Rad, die Vorrichtung oder der Gefolterte als betroffen zu denken ist.
theological_decisions:
- issue: Wiedergabe von ἀρετή im moralphilosophisch geprägten Märtyrerkontext
  choice: Tugend
  alternative: moralische Vortrefflichkeit
  rationale: „Tugend“ bewahrt den hellenistisch-moralphilosophischen Begriff und vermeidet eine konfessionelle oder später dogmatische Umdeutung.
- issue: Ausdrückliche Bestimmung des Rades als Folterinstrument
  choice: das Rad
  alternative: das Folterrad
  rationale: Der griechische Text sagt lediglich τροχός, „Rad“. Die Funktion wird deshalb in einer Fußnote erklärt, statt sie interpretierend in den Haupttext einzubauen.
- issue: Bestimmung des Objekts beim abschließenden Verb
  choice: die Spannung erhöhen
  alternative: ihn noch stärker darauf spannen
  rationale: Da kein ausdrückliches Objekt steht und die genaue mechanische Handlung unsicher ist, vermeidet die Übersetzung eine vorschnelle Festlegung auf den Gefolterten oder das Rad.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der philosophische Schlüsselbegriff „Tugend“ bleibt erhalten. Die Folterhandlung wird verständlich, aber wegen der ungewöhnlichen und mehrdeutigen griechischen Verben nicht technisch überspezifiziert.
