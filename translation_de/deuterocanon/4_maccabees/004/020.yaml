  text: Because of these things[a], divine justice, having become indignant, made war against Antiochus himself.
translation:
  language: de
  text: Darüber empört, führte die göttliche Gerechtigkeit gegen Antiochus selbst Krieg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das göttliche Gericht“ beziehungsweise „die göttliche Vergeltung“. Das griechische Wort δίκη kann Gerechtigkeit in ihrem Wirken, richterliches Strafgericht oder Vergeltung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: Darüber
  rationale: 'Die Verbindung ist rückbezüglich und kausal: Die göttliche Gerechtigkeit ist über die zuvor geschilderten Taten empört. „Darüber“ gibt diesen Bezug im Deutschen knapp und natürlich wieder.'
- source_word: ἀγανακτήσασα
  choice: empört
  rationale: Das aoristische Partizip bezeichnet heftigen Unwillen. Die deutsche Partizipialfügung „Darüber empört“ bewahrt die Unterordnung unter das Hauptverb, ohne unnötig schwerfällig zu klingen.
- source_word: ἡ θεία δίκη
  choice: die göttliche Gerechtigkeit
  rationale: δίκη kann Gerechtigkeit, Gericht, Strafe oder vergeltendes Recht bezeichnen. Hier ist sie personifiziert; „die göttliche Gerechtigkeit“ bewahrt sowohl die Abstraktion als auch den vergeltenden Unterton.
- source_word: αὐτόν τοι τὸν Ἀντίοχον
  choice: Antiochus selbst
  rationale: αὐτόν und das verstärkende τοι heben Antiochus ausdrücklich hervor. „Antiochus selbst“ gibt diese Betonung idiomatisch wieder.
- source_word: ἐπολέμησεν
  choice: führte … Krieg gegen
  rationale: Das Verb ist ausdrücklich militärisch und wird hier im Rahmen der Personifikation metaphorisch gebraucht. „Krieg führen gegen“ erhält die starke Bildlichkeit des Griechischen.
theological_decisions:
- issue: Personifikation von δίκη
  choice: „die göttliche Gerechtigkeit“ als handelndes Subjekt
  alternative: „die göttliche Strafe“ oder „Gottes Gericht“
  rationale: Der griechische Text lässt δίκη selbst empört werden und Krieg führen. Die gewählte Formulierung erhält diese literarisch-theologische Personifikation, ohne sie unmittelbar mit Gott gleichzusetzen oder auf eine bloße Strafmaßnahme zu verengen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die ungewöhnlich starke Personifikation und das Kriegsbild des Ausgangstextes bleiben erhalten.
