base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/026.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was compelling each and every one of the nation, by tortures, after tasting defiling foods[b], to renounce Judaism.
translation:
  language: de
  text: Weil also seine Verordnungen vom Volk verachtet wurden, zwang er selbst jeden Einzelnen aus dem Volk durch Folter dazu, von verunreinigenden Speisen zu kosten und danach dem Judentum abzuschwören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich vom Judentum loszusagen“. Das griechische Verb kann eine eidliche oder feierliche Lossagung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόγματα
  choice: Verordnungen
  rationale: Bezeichnet hier autoritative Anordnungen des Herrschers; „Verordnungen“ ist im Deutschen verständlich und bewahrt ihren amtlichen Charakter.
- source_word: κατεφρονεῖτο
  choice: verachtete
  rationale: Das Imperfekt bezeichnet eine fortdauernde Haltung der Missachtung; „verachtete“ gibt den stärkeren Sinn gegenüber bloßem Nichtbefolgen wieder.
- source_word: διὰ βασάνων
  choice: durch Folter
  rationale: 'Gibt den instrumentalen Sinn wieder: Die Folter diente als Zwangsmittel.'
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: jeden Einzelnen aus dem Volk
  rationale: „Jeden Einzelnen“ bewahrt die emphatische distributive Wendung; „aus dem Volk“ gibt die Zugehörigkeit zur Volksgemeinschaft natürlich wieder.
- source_word: μιερῶν ... τροφῶν
  choice: verunreinigenden Speisen
  rationale: Das Adjektiv bezeichnet kultisch befleckende beziehungsweise entweihende Speisen; die gewählte Formulierung betont ihre verunreinigende Wirkung.
- source_word: ἀπογευομένους
  choice: von ... zu kosten
  rationale: Das Partizip ist syntaktisch von ἠνάγκαζεν abhängig und bezeichnet neben dem Abschwören eine erzwungene Handlung. Die koordinierte deutsche Infinitivkonstruktion vermeidet die missverständliche Aussage, der Herrscher selbst habe gekostet.
- source_word: ἐξόμνυσθαι
  choice: abzuschwören
  rationale: Bewahrt sowohl die Lossagung als auch den im Verb enthaltenen Bezug auf einen Schwur.
- source_word: τὸν Ἰουδαϊσμόν
  choice: dem Judentum
  rationale: „Judentum“ lässt den umfassenden Bezug auf Glauben, Lebensweise und gemeinschaftliche Identität bestehen, ohne ihn auf nur einen Aspekt zu verengen.
theological_decisions:
- issue: Umfang von τὸν Ἰουδαϊσμόν
  choice: dem Judentum abzuschwören
  alternative: die jüdische Religion beziehungsweise Lebensweise zu verleugnen
  rationale: Die knappe Wiedergabe bewahrt die mögliche Breite von religiöser Praxis, Bundesidentität und Volkszugehörigkeit.
- issue: Bedeutung von μιερῶν τροφῶν
  choice: verunreinigende Speisen
  alternative: unreine oder entweihte Speisen
  rationale: Die Formulierung hält die kultische Wertung fest, ohne den Ausdruck auf eine starre technische Kategorie einzuengen.
- issue: Verhältnis der Partizipialhandlung zum Zwang
  choice: zu kosten und ... abzuschwören
  alternative: nachdem sie davon gekostet hatten, dem Judentum abzuschwören
  rationale: Der griechische Akkusativ Plural ἀπογευομένους bezieht sich auf die gezwungenen Angehörigen des Volkes. Die Koordination macht deutlich, dass Kosten und Abschwören Teil des erzwungenen Vorgangs sind, und wahrt zugleich die sachliche Abfolge.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem Griechischen leicht geordnet, um eindeutig zu zeigen, dass die Angehörigen des Volkes – nicht der Herrscher – von den Speisen kosten mussten. Die starke Betonung jedes einzelnen Betroffenen bleibt erhalten.
