  yaml_path: translation/deuterocanon/4_maccabees/004/019.yaml
  text: so that he not only built a gymnasium at the very citadel of our homeland[b][a], but also abolished the guardianship of the temple.
translation:
  language: de
  text: sodass er nicht nur auf der Zitadelle selbst unserer Heimat[a] ein Gymnasion errichtete, sondern auch die Obhut über den Tempel[b] aufhob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Akra selbst unserer Heimat“, falls ἄκρα hier als Eigenname der Jerusalemer Zitadelle verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „die Aufsicht über den Tempel“ oder „die Sorge für den Tempel“. Gemeint ist die Aufhebung einer schützenden beziehungsweise administrativen Betreuung, nicht der Abriss des Tempels selbst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: sodass
  rationale: Leitet die Folge des zuvor Geschilderten ein und bewahrt den konsekutiven Zusammenhang.
- source_word: μὴ μόνον ... ἀλλὰ καὶ
  choice: nicht nur ... sondern auch
  rationale: Gibt die rhetorisch ausgewogene griechische Korrelativkonstruktion unmittelbar und idiomatisch wieder.
- source_word: ἐπʼ αὐτῇ τῇ ἄκρᾳ
  choice: unmittelbar an der Zitadelle
  rationale: ἄκρα bezeichnet eine befestigte Höhe oder Zitadelle; „unmittelbar“ bringt die durch αὐτῇ gesetzte Hervorhebung natürlich zum Ausdruck, ohne die mögliche Deutung als Eigenname festzuschreiben.
- source_word: τῆς πατρίδος ἡμῶν
  choice: unserer Heimat
  rationale: πατρίς meint das angestammte Land; „Heimat“ ist im heutigen Deutsch natürlich und bewahrt den emotionalen Bezug.
- source_word: γυμνάσιον
  choice: Gymnasion
  rationale: Die fachsprachliche Form bezeichnet die hellenistische Bildungs- und Sporteinrichtung und vermeidet die irreführende Gleichsetzung mit dem heutigen deutschen Gymnasium.
- source_word: κατασκευάσαι
  choice: errichtete
  rationale: Das Verb bezeichnet hier die Herstellung beziehungsweise bauliche Einrichtung des Gymnasions.
- source_word: καταλῦσαι
  choice: aufhob
  rationale: Beim abstrakten Objekt κηδεμονία hat das Verb den Sinn, eine bestehende Ordnung außer Kraft zu setzen, nicht den Tempel baulich zu zerstören.
- source_word: κηδεμονίαν
  choice: Obhut
  rationale: „Obhut“ umfasst Schutz, Sorge und anvertraute Aufsicht, ohne eine genauer bestimmte Verwaltungsform in den Text hineinzulesen.
- source_word: τοῦ ἱεροῦ
  choice: über den Tempel
  rationale: ἱερόν bezeichnet in diesem Zusammenhang den Tempel beziehungsweise Tempelbezirk; die Verbindung mit „Obhut“ verlangt im Deutschen idiomatisch „über“.
theological_decisions:
- issue: Historisch-kultische Bedeutung von ἄκρα im Jerusalemer Zusammenhang
  choice: beschreibend als „Zitadelle“ wiedergegeben
  alternative: „Akra“ als Eigenname oder „Höhe“
  rationale: Das griechische Substantiv kann eine befestigte Höhe bezeichnen und möglicherweise auf die Jerusalemer Akra verweisen. Die Übersetzung bleibt verständlich, während die Fußnote die echte historische Mehrdeutigkeit offenhält.
- issue: Bedeutung von κηδεμονία τοῦ ἱεροῦ
  choice: „Obhut über den Tempel“ als schützende beziehungsweise administrative Aufsicht
  alternative: „Tempelverwaltung“, „Fürsorge für den Tempel“ oder eine Deutung als Zerstörung des Tempels
  rationale: Die Wendung benennt eine Form von Schutz, Sorge oder Aufsicht. Sie sagt nicht, dass das Tempelgebäude selbst niedergerissen wurde, und legt keine präzisere institutionelle Struktur fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gymnasion“ bewahrt die konkrete hellenistische Institution und verhindert die im Deutschen naheliegende moderne Schulbedeutung von „Gymnasium“. Der Satzanfang „sodass“ erhält bewusst die syntaktische Anbindung an den vorausgehenden Vers.
