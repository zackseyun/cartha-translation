  language: de
  text: sodass sogar Frauen, weil sie ihre Kinder beschnitten hatten, zusammen mit ihren Säuglingen in die Tiefe gestürzt wurden[a], obwohl sie vorher wussten, dass sie dies erleiden würden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinabgeschleudert“ beziehungsweise „von einer Höhe hinabgestürzt“. Das griechische Verb bezeichnet ein gewaltsames Hinabwerfen, wahrscheinlich von einem Abhang oder einem erhöhten Ort.'
