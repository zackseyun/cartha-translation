lexical_decisions:
- source_word: ὥστε
  choice: sodass
  rationale: Leitet die Folge des zuvor geschilderten Vorgehens ein und bewahrt den konsekutiven Sinn.
- source_word: γυναῖκας
  choice: Frauen
  rationale: Die allgemeine Bezeichnung ist hier direkt wiedergegeben; aus dem Zusammenhang geht hervor, dass es sich um Mütter handelt.
- source_word: ὅτι
  choice: weil
  rationale: 'Bezeichnet den Grund für die Bestrafung: Die Frauen hatten ihre Kinder beschneiden lassen beziehungsweise selbst beschnitten.'
- source_word: περιέτεμον
  choice: beschnitten hatten
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass die Beschneidung der Bestrafung vorausging; der griechische Imperfekt kann zugleich wiederholtes beziehungsweise übliches Handeln bezeichnen.
- source_word: τὰ παιδία
  choice: ihre Kinder
  rationale: Wörtlich steht „die Kinder“; das Possessivpronomen ergibt sich aus dem Zusammenhang, ohne das geschlechtsneutrale παιδία unnötig auf „Jungen“ zu verengen.
- source_word: μετὰ τῶν βρεφῶν
  choice: zusammen mit ihren Säuglingen
  rationale: βρέφη bezeichnet sehr junge Kinder; „Säuglinge“ bewahrt die Altersangabe und den erschütternden Kontrast.
- source_word: κατακρημνίζεσθαι
  choice: in die Tiefe gestürzt wurden
  rationale: Das Verb bezeichnet gewaltsames Hinabstürzen von einer Höhe; die Formulierung wahrt dies, ohne einen im Vers nicht ausdrücklich genannten Abgrund oder Felsen einzuführen.
- source_word: προειδυίας
  choice: obwohl sie vorher wussten
  rationale: Das Partizip bezieht sich auf die Frauen und bezeichnet ihr vorausgehendes Wissen; „obwohl“ gibt den im Zusammenhang naheliegenden konzessiven Sinn wieder.
- source_word: τοῦτο πείσονται
  choice: dass sie dies erleiden würden
  rationale: πάσχω bedeutet hier „erleiden/erfahren“; der deutsche Konjunktiv mit Zukunftsbezug entspricht der aus Sicht ihres vorherigen Wissens noch bevorstehenden Erfahrung.
theological_decisions:
- issue: Religionsgeschichtlicher Zusammenhang der Beschneidung unter Verfolgung
  choice: „beschnitten“ unverhüllt beibehalten
  alternative: „nach dem Bund gekennzeichnet“ oder „den Ritus an ihren Kindern vollzogen“
  rationale: Der Vers nennt die jüdische Beschneidung unmittelbar als Anlass der Verfolgung. Die direkte Wiedergabe bewahrt die historische und theologische Spannung, ohne sie durch spätere Deutungen abzuschwächen.
