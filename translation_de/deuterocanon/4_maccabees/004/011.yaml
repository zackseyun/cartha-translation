base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/011.yaml
  text: So Apollonius[a], having fallen half-dead upon the lifeless court of the sanctuary, stretched out his hands to heaven and with tears begged the Hebrews to pray for him[c][b], so that they might appease the heavenly host.
translation:
  language: de
  text: Apollonius war halb tot auf den leblosen Bezirk des Heiligtums[a] gestürzt; mit zum Himmel ausgestreckten Händen flehte er die Hebräer unter Tränen an, für ihn zu beten[b], damit sie das himmlische Heer[c] besänftigten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf den leblosen Vorhof des Heiligtums« beziehungsweise »auf die leblose Umfriedung des Heiligtums«. Das griechische Wort bezeichnet einen umschlossenen heiligen Bereich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »seinetwegen« oder »ihn betreffend zu beten«. Gemeint ist hier das Gebet für ihn.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »das Heer des Himmels« oder »die himmlische Heerschar«. Der griechische Ausdruck lässt den genauen Referenten offen; gemeint sein kann ein Engelheer, eine himmlische Macht oder eine ehrerbietige Umschreibung für Gott.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταπεσὼν
  choice: lag … auf
  rationale: Das Aoristpartizip bezeichnet den vorausgehenden Sturz; im Deutschen gibt »lag … auf« das daraus entstandene Bild natürlich wieder, ohne den Satz unnötig zu beschweren.
- source_word: ἡμιθανὴς
  choice: halb tot
  rationale: Die anschauliche, wörtlich naheliegende Wiedergabe bewahrt die drastische Aussage des griechischen Kompositums.
- source_word: ἄψυχον
  choice: leblos
  rationale: Das Wort bedeutet wörtlich »ohne Leben/Seele«. »Leblos« erhält den auffälligen Kontrast zwischen dem halb toten Menschen und dem unbelebten heiligen Bezirk.
- source_word: τοῦ ἱεροῦ περίβολον
  choice: Bezirk des Heiligtums
  rationale: περίβολος bezeichnet hier den umschlossenen heiligen Bereich beziehungsweise Tempelbezirk; die Formulierung lässt offen, ob besonders der Hof oder die Umfriedung im Blick ist.
- source_word: τὰς χεῖρας ἐκτείνων εἰς τὸν οὐρανὸν
  choice: streckte die Hände zum Himmel aus
  rationale: Eine natürliche deutsche Wiedergabe der Gebärde des Flehens, die zugleich Richtung und Handlung genau erhält.
- source_word: μετὰ δακρύων … παρεκάλει
  choice: flehte … unter Tränen an
  rationale: Im Zusammenhang bezeichnet παρακαλέω eine dringende Bitte; »flehte an« vermittelt die Verzweiflung der Szene.
- source_word: ὅπως περὶ αὐτοῦ εὐξόμενοι
  choice: für ihn zu beten
  rationale: περὶ αὐτοῦ heißt formal »seinetwegen/ihn betreffend«; im Gebetszusammenhang ist »für ihn beten« die natürliche interzessorische Bedeutung.
- source_word: ἐξευμενίσωνται
  choice: besänftigten
  rationale: Das Verb bedeutet, jemanden günstig zu stimmen oder zu besänftigen. Die Wahl vermeidet eine technisch-dogmatische Aufladung.
- source_word: τὸν ἐπουράνιον … στρατόν
  choice: das himmlische Heer
  rationale: στρατός bedeutet »Heer/Heerschar«. »Himmlisches Heer« bewahrt das kollektive Bild, ohne den Referenten als Engel oder als Umschreibung Gottes festzulegen.
theological_decisions:
- issue: Referent des »himmlischen Heeres«
  choice: Die kollektive himmlische Macht wird als »das himmlische Heer« wiedergegeben, ohne nähere Identifikation.
  alternative: »die himmlische Heerschar« als ausdrücklicher Hinweis auf Engel oder eine ehrerbietige Umschreibung für Gott
  rationale: Der griechische Text nennt τὸν ἐπουράνιον στρατόν, bestimmt den Referenten aber nicht genauer. Die Übersetzung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzfluss bleibt eng am griechischen Periodenbau, wird aber idiomatisch gestaltet. Die ungewöhnliche Bezeichnung des heiligen Bezirks als »leblos« und die Mehrdeutigkeit des »himmlischen Heeres« bleiben bewusst erhalten.
