  - marker: b
    text: Das griechische Wort kann den Tempelbezirk insgesamt bezeichnen, nicht nur das innere Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷόν τε ἦν
  choice: soweit sie konnten
  rationale: Die griechische Wendung bezeichnet das Maß des Möglichen oder der Fähigkeit. Die deutsche Formulierung gibt den idiomatischen Sinn knapp und natürlich wieder.
- source_word: ἐκώλυον
  choice: sie versuchten ihn aufzuhalten
  rationale: Das Imperfekt beschreibt ein andauerndes Hindern oder Aufhalten. Da Apollonius dennoch zum Tempel zieht, bringt „versuchten … aufzuhalten“ den nicht vollends erfolgreichen Widerstand natürlich zum Ausdruck; das im Griechischen unausgesprochene Objekt wird aus dem Zusammenhang ergänzt und in der Fußnote kenntlich gemacht.
- source_word: μετὰ ἀπειλῆς
  choice: unter Drohungen
  rationale: Die Präpositionalverbindung bezeichnet die drohende Begleitumstände oder Art seines Vorgehens. Der griechische Singular kann im Deutschen idiomatisch mit dem Plural wiedergegeben werden.
- source_word: ἀπῄει
  choice: zog
  rationale: Das Imperfekt bezeichnet die im Gang befindliche Bewegung. „Zog … zum Tempel“ ist im Deutschen natürlich und bewahrt den erzählerischen Bewegungscharakter, ohne ein unpassendes „ging weg zum Tempel“ zu erzwingen.
- source_word: εἰς τὸ ἱερόν
  choice: zum Tempel
  rationale: ἱερόν kann den gesamten Tempelbezirk bezeichnen, nicht nur das innere Heiligtum. „Tempel“ ist die geläufige und im Haupttext ausreichend offene Wiedergabe.
- source_word: ὁ Ἀπολλώνιος
  choice: Apollonius
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert.
