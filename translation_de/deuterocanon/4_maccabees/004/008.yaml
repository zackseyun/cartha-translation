  text: They were preventing him as much as they could[b][a]. But with threats Apollonius was going to the temple.
translation:
  language: de
  text: Sie hielten ihn auf, soweit sie konnten.[a] Apollonius aber ging unter Drohungen zum Tempel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Sie hinderten, soweit es möglich war.“ Im Griechischen steht kein ausdrückliches Objekt; „ihn“ ergibt sich aus dem Zusammenhang.'
