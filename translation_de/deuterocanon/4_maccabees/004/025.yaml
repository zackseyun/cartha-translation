  yaml_path: translation/deuterocanon/4_maccabees/004/025.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was forcing each one of the nation, by tortures, after tasting defiling foods, to renounce Judaism.
translation:
  language: de
  text: Da nun seine Anordnungen vom Volk verachtet wurden, zwang er selbst jeden Einzelnen aus dem Volk durch Folter dazu, nachdem sie von verunreinigenden Speisen gekostet hatten, dem Judentum abzuschwören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich unter Eid vom Judentum loszusagen«.'
    reason: Das Verb ἐξόμνυσθαι kann neben der allgemeinen Bedeutung »abschwören« ausdrücklich eine Lossagung unter Eid bezeichnen.
lexical_decisions:
- source_word: δόγματα
  choice: Anordnungen
  rationale: Im politischen Zusammenhang bezeichnet das Wort verbindliche Vorgaben des Herrschers. »Anordnungen« gibt deren amtlichen und verpflichtenden Charakter in natürlichem Deutsch wieder.
- source_word: κατεφρονεῖτο
  choice: wurden verachtet
  rationale: Der Imperfekt Passiv bezeichnet fortdauernde Geringschätzung; »wurden verachtet« bewahrt die starke negative Bedeutung.
- source_word: διὰ βασάνων
  choice: durch Folter
  rationale: Die Wendung bezeichnet Folter als Mittel des Zwangs. Der deutsche Kollektivsingular ist hier idiomatischer als »durch Folterungen«.
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: jeden Einzelnen aus dem Volk
  rationale: Die Formulierung bewahrt den distributiven Nachdruck und bezeichnet zugleich die Zugehörigkeit zum jüdischen Volk.
- source_word: μιερῶν ... τροφῶν
  choice: verunreinigender Speisen
  rationale: μιερός bezeichnet hier Speisen, deren Genuss kultisch beziehungsweise religiös verunreinigt; die Wiedergabe vermeidet eine unnötige Verengung auf einen späteren Fachbegriff.
- source_word: ἀπογευομένους
  choice: nach dem Kosten
  rationale: Die partizipiale Konstruktion wird temporal wiedergegeben und wahrt den Zusammenhang zwischen dem Kosten der Speisen und der erzwungenen Lossagung.
- source_word: ἐξόμνυσθαι
  choice: abzuschwören
  rationale: »Abschwören« gibt die Lossagung prägnant wieder und lässt zugleich einen möglichen Eidbezug anklingen, ohne ihn im Haupttext festzuschreiben.
- source_word: τὸν Ἰουδαϊσμόν
  choice: dem Judentum
  rationale: »Judentum« ist die direkte deutsche Entsprechung und umfasst hier religiöse Zugehörigkeit sowie jüdische Lebenspraxis, ohne den Ausdruck auf nur einen Aspekt zu verengen.
theological_decisions:
- issue: Bedeutungsumfang von τὸν Ἰουδαϊσμόν
  choice: dem Judentum
  alternative: der jüdischen Lebensweise / der jüdischen Religion
  rationale: Der Text handelt von erzwungener Abkehr von jüdischer Zugehörigkeit und Praxis. »Judentum« bewahrt die Offenheit des griechischen Ausdrucks, ohne ihn ausschließlich als Religion, Ethnizität oder Lebensweise auszulegen.
- issue: Möglicher Eidbezug von ἐξόμνυσθαι
  choice: abzuschwören
  alternative: sich unter Eid loszusagen
  rationale: Das Verb kann eine eidliche Lossagung bezeichnen, doch der Eidbezug muss hier nicht zwingend ausdrücklich gemacht werden. Die Alternative wird daher in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber idiomatisch geglättet. »Durch Folter« verwendet den im Deutschen natürlichen Kollektivsingular; »jeden Einzelnen« erhält den starken distributiven Akzent.
