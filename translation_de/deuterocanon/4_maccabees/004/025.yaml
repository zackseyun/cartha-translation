revisions:
- from: Da nun seine Anordnungen vom Volk verachtet wurden, zwang er selbst jeden Einzelnen aus dem Volk durch Folter, nach dem Kosten verunreinigender Speisen dem Judentum abzuschwören.[a]
  to: Da nun seine Anordnungen vom Volk verachtet wurden, zwang er selbst jeden Einzelnen aus dem Volk durch Folter dazu, nachdem sie von verunreinigenden Speisen gekostet hatten, dem Judentum abzuschwören.[a]
  rationale: Die Revision glättet ausschließlich die deutsche Satzfügung. Die finite Nebensatzkonstruktion macht die im griechischen Akkusativ stehenden Betroffenen als Handelnde des Kostens ausdrücklich erkennbar und gibt die temporale Funktion von ἀπογευομένους natürlich wieder. Inhalt, Register und die offen gehaltene Eidnuance bleiben erhalten.
