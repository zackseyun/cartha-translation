  terminology: „Anordnungen“, „Volk“, „Folter“, „verunreinigende Speisen“, „dem Judentum abschwören“ sind in diesem Kontext tragfähige Wiedergaben. „Verunreinigend“ bewahrt den kultisch-defilierenden Sinn von μιερός, ohne vorschnell auf eine bestimmte Kategorie von Speisegeboten zu verengen. Die Fußnote wahrt die mögliche eidliche Nuance, ohne sie als zwingend auszugeben.
