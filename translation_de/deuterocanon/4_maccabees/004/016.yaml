  text: He deposed Onias from the high priesthood and appointed Jason[a], his brother, as high priest, after he promised to give, if he would grant him the office, three thousand six hundred sixty talents per year.
translation:
  language: de
  text: Er enthob Onias des Hohepriesteramtes und setzte dessen Bruder Jason zum Hohepriester ein. Jason hatte ihm versprochen, ihm jährlich dreitausendsechshundertsechzig Talente zu geben[a], falls er Jason das Amt übertrüge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zu zahlen. Im Griechischen steht wörtlich „zu geben“; dass es sich um eine korrupte Zahlung handelt, ergibt sich aus dem Zusammenhang.'
    reason: Lexikalische Alternative und Vermeidung einer überdeutenden moralischen Wertung im Haupttext.
lexical_decisions:
- source_word: καταλύσας τὸν Ὀνίαν τῆς ἀρχιερωσύνης
  choice: enthob Onias des Hohepriesteramtes
  rationale: καταλύω bezeichnet hier die formelle Entfernung aus dem Amt, nicht eine wörtliche Zerstörung. Die deutsche Fügung mit „entheben“ gibt sowohl den Amtscharakter als auch den Genitivbezug präzise wieder.
- source_word: Ἰάσονα τὸν ἀδελφὸν αὐτοῦ
  choice: dessen Bruder Jason
  rationale: Das Pronomen αὐτοῦ bezieht sich im griechischen Satz auf Onias. „Dessen Bruder“ macht diesen Bezug im Deutschen klar, ohne einen zusätzlichen Gedanken einzuführen.
- source_word: κατέστησεν ἀρχιερέα
  choice: setzte … zum Hohepriester ein
  rationale: καθίστημι bezeichnet hier die offizielle Einsetzung in ein Amt. „Zum Hohepriester einsetzen“ ist natürliches, gegenwärtiges Standarddeutsch.
- source_word: ὑποσχόμενον δώσειν
  choice: Dieser hatte versprochen, ihm … zu geben
  rationale: Das Partizip bezieht sich auf Jason und nennt die Voraussetzung seiner Einsetzung. Die Auflösung als eigener Satz verhindert eine irreführende Zuordnung und bewahrt mit „geben“ die wertungsneutrale Wortwahl des Griechischen.
- source_word: εἰ ἐπιτρέψειεν αὐτῷ τὴν ἀρχήν
  choice: wenn er ihm das Amt übertrüge
  rationale: ἀρχή bezeichnet im Kontext das angestrebte hohepriesterliche Amt beziehungsweise dessen Amtsgewalt. „Das Amt übertragen“ ist idiomatisch und entspricht dem konditionalen Optativ.
- source_word: κατʼ ἐνιαυτὸν
  choice: jährlich
  rationale: Die Wendung bezeichnet eine in jedem Jahr zu erbringende Leistung; „jährlich“ ist knapp und natürlich.
- source_word: τρισχίλια ἑξακόσια ἑξήκοντα τάλαντα
  choice: dreitausendsechshundertsechzig Talente
  rationale: Die genaue Summe und die antike Gewicht- beziehungsweise Geldeinheit bleiben erhalten.
theological_decisions:
- issue: Moralische Einordnung von Jasons Zahlung
  choice: Die Vereinbarung wird sachlich als Versprechen zu geben wiedergegeben.
  alternative: Die Zahlung ausdrücklich als Bestechung bezeichnen oder „bestechen“ übersetzen.
  rationale: Der Zusammenhang lässt Korruption erkennen, doch der griechische Vers verwendet kein ausdrückliches Wort für Bestechung. Die Übersetzung soll die moralische Schlussfolgerung nicht stärker formulieren als die Quelle.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wurde zur eindeutigen Zuordnung des auf Jason bezogenen Partizips in zwei Sätze gegliedert. Die Pronomen im Bedingungssatz bleiben entsprechend der griechischen Form stehen; aus dem Kontext ist der Amtsverleiher als Subjekt und Jason als Empfänger erkennbar.
