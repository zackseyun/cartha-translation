  text: And when he had subdued them[a], he issued a decree that if any of them were found living according to the ancestral law, they should be put to death.
translation:
  language: de
  text: 'Als er sie verwüstet hatte, erließ er eine Verordnung: Falls sich herausstellte, dass jemand von ihnen nach dem Gesetz ihrer Vorfahren lebte, sollte er hingerichtet werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπόρθησεν
  choice: verwüstet hatte
  rationale: πορθέω bezeichnet in erster Linie das Verwüsten, Verheeren oder Plündern. Anders als „unterwerfen“ bewahrt „verwüsten“ die konkrete Gewalt des griechischen Ausdrucks, ohne eine bestimmte Form der Eroberung festzulegen.
- source_word: δόγμα ἔθετο
  choice: erließ er eine Verordnung
  rationale: Die Wendung bezeichnet das Festsetzen beziehungsweise Erlassen einer obrigkeitlichen Anordnung. „Eine Verordnung erlassen“ ist im modernen Deutschen natürlich und gibt den amtlichen Charakter wieder.
- source_word: φαίνοιεν
  choice: sich … als einer erwies
  rationale: Der Optativ von φαίνω kann „erscheinen“, „sich zeigen“ oder „sich erweisen“ bedeuten. Im Zusammenhang einer Strafverordnung bringt „sich als … erweisen“ das Bekanntwerden des betreffenden Verhaltens zum Ausdruck, ohne ausdrücklich ein Gerichtsverfahren vorauszusetzen.
- source_word: πολιτευόμενοι
  choice: der … lebte
  rationale: πολιτεύομαι bezeichnet hier die Lebensführung nach einer verbindlichen Ordnung. „Nach … lebte“ ist verständlich und wahrt den Gedanken einer fortdauernden Lebensweise.
- source_word: τῷ πατρίῳ ... νόμῳ
  choice: nach dem überlieferten Gesetz
  rationale: πάτριος bezeichnet das von den Vorfahren Ererbte. „Überliefertes Gesetz“ gibt diesen Herkunftsbezug idiomatisch wieder; „Gesetz der Vorfahren“ wäre eine wörtlichere Alternative.
- source_word: θάνοιεν
  choice: sollte er hingerichtet werden
  rationale: Wörtlich steht „sollte er sterben“. Im Kontext einer obrigkeitlichen Strafverordnung bezeichnet dies jedoch die angeordnete Tötung; „hingerichtet werden“ macht den rechtlich auferlegten Charakter deutlich.
theological_decisions:
- issue: Bezeichnung des jüdischen Identitätsmerkmals πατρίῳ νόμῳ
  choice: das überlieferte Gesetz
  alternative: das Gesetz der Vorfahren
  rationale: Die Formulierung kennzeichnet die ererbte jüdische Lebensordnung, ohne spätere konfessionelle Begrifflichkeit einzutragen. Sie hält den Zusammenhang von Gesetz und überlieferter gemeinschaftlicher Identität fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satzbau folgt dem griechischen Gedankengang, wird aber für natürliche deutsche Lesbarkeit gegliedert. Die Singularform „jemand … er … sollte“ gibt die unbestimmte Bedingung idiomatisch wieder.
