  text: And he permitted him to serve as high priest and to lead the nation[a].
translation:
  language: de
  text: Er aber erlaubte ihm, als Hohepriester zu amtieren und das Volk zu führen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Volk zu regieren«. Das griechische Verb kann die Leitung in einer führenden Stellung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέτρεψεν
  choice: erlaubte
  rationale: Das Verb bezeichnet das Gewähren einer Erlaubnis. »Erlaubte« gibt dies natürlich wieder, ohne eine förmliche Ernennung stärker zu behaupten, als der griechische Text erkennen lässt.
- source_word: ἀρχιερασθαι
  choice: als Hohepriester zu amtieren
  rationale: Der Infinitiv bezeichnet die Ausübung des Hohepriesteramtes; »amtieren« vermittelt Funktion und Amtsausübung statt nur einen Status.
- source_word: τοῦ ἔθνους
  choice: das Volk
  rationale: Im jüdischen Zusammenhang bezeichnet ἔθνος die Gemeinschaft als politisch-nationale Einheit. »Volk« ist im modernen Deutschen natürlich und wahrt sowohl den gemeinschaftlichen als auch den nationalen Bezug.
- source_word: ἀφηγεῖσθαι
  choice: zu führen
  rationale: Das Verb bezeichnet Leitung in führender Stellung. »Führen« bewahrt den weiteren Sinn und legt die politische Ausgestaltung der Autorität nicht vorschnell als Herrschaft fest.
theological_decisions:
- issue: Umfang der ihm gewährten Autorität
  choice: Die Erlaubnis umfasst sowohl die Ausübung des Hohepriesteramtes als auch die Führung des Volkes.
  alternative: Der zweite Infinitiv kann politischer als »das Volk zu regieren« verstanden werden.
  rationale: Im Griechischen hängen beide Infinitive koordiniert von demselben Verb der Erlaubnis ab. Die Übersetzung erhält die religiöse und die gesellschaftlich-politische Dimension, ohne den Grad politischer Herrschaft genauer festzulegen, als es der Wortlaut tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Als Hohepriester zu amtieren« ist idiomatisch und amtsbezogen; »das Volk zu führen« bewahrt die mögliche politische Bedeutung, ohne sie zu überzeichnen.
