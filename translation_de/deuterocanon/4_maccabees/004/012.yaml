  yaml_path: translation/deuterocanon/4_maccabees/004/012.yaml
  text: For he said that he had sinned, so that he was worthy even to die, and that, if he were saved, he would sing the blessedness of the holy place to all people.
translation:
  language: de
  text: Denn er sagte, er habe gesündigt und sei daher sogar des Todes würdig; wenn er gerettet würde, würde er vor allen Menschen preisen, wie gesegnet der heilige Ort sei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »würde er vor allen Menschen besingen, wie gesegnet der heilige Ort sei«. Das griechische Verb kann hymnisches Besingen, aber auch allgemeiner feierliches Preisen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Das Imperfekt kann einen andauernden oder wiederholten Vorgang bezeichnen; im deutschen Erzählzusammenhang gibt das Präteritum die Aussage natürlich wieder, ohne den Aspekt unnötig hervorzuheben.
- source_word: ἡμαρτηκώς
  choice: er habe gesündigt
  rationale: Das Perfektpartizip bezeichnet eine vollendete Tat mit fortdauernder Bedeutung. Der Konjunktiv I kennzeichnet im Deutschen die indirekte Rede.
- source_word: ὥστε καὶ ἀποθανεῖν ἄξιος ὑπάρχειν
  choice: deshalb sogar den Tod verdient
  rationale: ἄξιος mit Infinitiv drückt hier aus, was jemand verdient. Die idiomatische deutsche Wendung bewahrt sowohl die Folgebeziehung von ὥστε als auch die Steigerung durch καί.
- source_word: σωθεὶς
  choice: wenn er aber gerettet werde
  rationale: Das Aorist-Passivpartizip hat im Zusammenhang konditionalen Sinn. »Gerettet« lässt die unmittelbare Bedeutung einer Bewahrung vor dem Tod erkennen, ohne mögliche weitere religiöse Anklänge auszuschließen.
- source_word: πᾶσίν τε ἀνθρώποις
  choice: vor allen Menschen
  rationale: Der Dativ bezeichnet die Öffentlichkeit beziehungsweise die Adressaten des Rühmens. »Vor allen Menschen« ist im Deutschen in Verbindung mit öffentlichem Lob natürlich.
- source_word: ὑμνήσειεν
  choice: werde er … rühmen
  rationale: Der Optativ in der abhängigen Aussage wird als zukünftiges, bedingtes Geschehen wiedergegeben. »Rühmen« umfasst hymnisches Lob, ohne zwingend wörtlichen Gesang vorauszusetzen.
- source_word: τὴν τοῦ ἱεροῦ τόπου μακαριότητα
  choice: wie gesegnet der heilige Ort sei
  rationale: Die prädikative deutsche Formulierung gibt μακαριότης verständlich als gesegneten, glückseligen Zustand wieder und bewahrt ἱερὸς τόπος als »heiliger Ort«.
theological_decisions:
- issue: Bedeutung von σωθεὶς im Zusammenhang
  choice: Rettung beziehungsweise Bewahrung vor dem Tod, sprachlich offen wiedergegeben
  alternative: ausdrücklich geistliches oder endzeitliches Heil
  rationale: Der Erzählzusammenhang handelt davon, dass der Sprecher dem Tod entgeht und anschließend den heiligen Ort öffentlich rühmt. Der griechische Ausdruck verlangt keine dogmatische Verengung auf einen später ausformulierten Heilsbegriff.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die indirekte Rede wird konsequent mit dem Konjunktiv I wiedergegeben; die abstrakte Genitivfügung des Griechischen wird zugunsten einer verständlichen prädikativen Formulierung natürlich aufgelöst.
