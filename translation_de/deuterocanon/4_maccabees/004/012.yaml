  - severity: low
    issue: „Rühmen“ mit einem nachfolgenden „wie“-Satz ist weniger unmittelbar als die griechische Konstruktion mit einem direkten Objekt.
    rationale: „Preisen, wie gesegnet der heilige Ort sei“ entspricht der hymnischen Lobhandlung von ὑμνεῖν und hält den Inhalt des Lobes klarer fest.
