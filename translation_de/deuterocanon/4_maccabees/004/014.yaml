  text: And the one who had been saved unexpectedly went away, to report to the king the things that had happened to him.
translation:
  language: de
  text: Der Mann aber, der wider Erwarten gerettet worden war, ging fort, um dem König zu berichten, was ihm geschehen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδόξως
  choice: wider Erwarten
  rationale: Das Adverb bezeichnet hier die überraschende, den Erwartungen widersprechende Art seiner Rettung. „Wider Erwarten“ ist natürliches, würdevolles Deutsch und legt nicht ausdrücklich eine wunderhafte Ursache fest.
- source_word: διασωθεὶς
  choice: gerettet worden war
  rationale: Das passive Aoristpartizip beschreibt, dass der Mann sicher aus der Gefahr herausgebracht worden war. Die vorzeitige Wiedergabe passt zum anschließenden Fortgehen.
- source_word: ᾤχετο
  choice: ging fort
  rationale: Die Form bezeichnet sein Weggehen. „Ging fort“ gibt dies schlicht und in modernem Standarddeutsch wieder.
- source_word: δηλώσων
  choice: um … zu berichten
  rationale: Das Futurpartizip drückt den Zweck seines Fortgehens aus. Im Zusammenhang mit dem König ist „berichten“ sachlich und idiomatisch.
- source_word: τὰ συμβάντα αὐτῷ
  choice: was ihm widerfahren war
  rationale: Die substantivierte Partizipialwendung bezeichnet die Ereignisse, die ihn betroffen hatten. „Was ihm widerfahren war“ bewahrt den persönlichen Bezug und den leicht gehobenen Erzählton.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das einleitende μέν wird mit „aber“ aufgenommen; ein ausdrücklicher korrespondierender Gegensatz muss im Deutschen nicht ergänzt werden. Keine Fußnoten erforderlich.
