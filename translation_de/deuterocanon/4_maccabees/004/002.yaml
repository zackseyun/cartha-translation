lexical_decisions:
- source_word: ὅθεν
  choice: Deshalb
  rationale: Das Folgewort leitet hier eine Konsequenz aus dem zuvor Erzählten ein; „Deshalb“ gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: ἥκων πρὸς Ἀπολλώνιον
  choice: ging er zu Apollonius
  rationale: Das Partizip von ἥκω bezeichnet sein Kommen zu Apollonius. Die finite deutsche Form wahrt den erzählerischen Ablauf und vermeidet eine schwerfällige Partizipialkonstruktion.
- source_word: στρατηγόν
  choice: Statthalter
  rationale: Der Titel bezeichnet hier einen hohen Amtsträger mit regionaler Regierungs- beziehungsweise Befehlsgewalt; „Statthalter“ passt zum Kontext und ist allgemein verständlich.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt führt die anschließende Rede ein. Im Deutschen ist das einfache erzählende „sagte“ vor dem Doppelpunkt idiomatisch, ohne einen besonderen Verlaufsaspekt aufzuzwingen.
