  yaml_path: translation/deuterocanon/4_maccabees/004/010.yaml
  text: And when Apollonius came up with an armed force to seize the money[a], horse-mounted angels appeared beforehand from heaven[b], flashing around with their weapons and putting great fear and terror into them.
translation:
  language: de
  text: Als Apollonius mit einem bewaffneten Heer heranzog, um die Gelder zu rauben, erschienen vom Himmel her berittene Engel[a], die ringsum mit ihren Waffen blitzten und ihnen große Furcht und Schrecken einflößten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Engel zu Pferd“. Das griechische Wort bezeichnet sie ausdrücklich als beritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιόντος
  choice: heranzog
  rationale: Das Verb bezeichnet hier im Genitivus absolutus das Hinaufziehen beziehungsweise Vorrücken des Apollonius. „Heranzog“ gibt die militärische Bewegung zum Ziel natürlich wieder, ohne eine im Deutschen unklare Höhenangabe zu erzwingen.
- source_word: καθωπλισμένης στρατιᾶς
  choice: mit einem bewaffneten Heer
  rationale: καθοπλίζω bezeichnet das Ausrüsten oder Bewaffnen; „bewaffnetes Heer“ wahrt den militärischen Charakter und klingt in modernem Deutsch würdig und verständlich.
- source_word: πρὸς τὴν τῶν χρημάτων ἁρπαγήν
  choice: um die Gelder zu rauben
  rationale: ἁρπαγή bezeichnet gewaltsames Wegnehmen, Raub oder Plünderung. „Rauben“ bewahrt die feindselige Absicht; der Plural „Gelder“ passt zu χρήματα als Geldmittel oder Vermögen.
- source_word: οὐρανόθεν
  choice: vom Himmel her
  rationale: In der Erscheinungsszene bezeichnet der Ausdruck den himmlischen Ursprung. „Vom Himmel her“ erhält sowohl die räumliche Aussage als auch den übernatürlichen Erzählton.
- source_word: προυφάνησαν
  choice: erschienen
  rationale: Die Form von προφαίνω bezeichnet das Hervortreten oder Sichtbarwerden. Ein ausdrücklich zeitliches „erschienen zuvor“ wäre möglich, ist hier aber nicht zwingend und würde den griechischen Präfix überdeuten.
- source_word: ἔφιπποι ἄγγελοι
  choice: berittene Engel
  rationale: ἔφιππος bedeutet „zu Pferd, beritten“. Die direkte Wiedergabe erhält die ungewöhnliche, ausdrücklich militärische Bildsprache des griechischen Textes.
- source_word: περιαστράπτοντες τοῖς ὅπλοις
  choice: Ihre Waffen blitzten ringsum
  rationale: περιαστράπτω vermittelt ein ringsum aufleuchtendes, blitzartiges Glänzen; ὅπλα bezeichnet hier Waffen beziehungsweise Rüstung. Die Auflösung in einen deutschen Hauptsatz bewahrt das lebhafte Bild in natürlicher Syntax.
- source_word: ἐνιόντες
  choice: sie flößten ihnen ... ein
  rationale: Das Verb bedeutet hier, etwas in jemanden hineinzulegen oder hervorzurufen. „Einflößen“ ist die idiomatische deutsche Verbindung mit Furcht und Schrecken.
- source_word: φόβον τε καὶ τρόμον
  choice: große Furcht und Schrecken
  rationale: Die beiden annähernd synonymen Begriffe bilden eine verstärkende Doppelung. „Furcht und Schrecken“ erhält diese Intensität, während πολύ mit „große“ wiedergegeben wird.
theological_decisions:
- issue: Herkunft der Erscheinung in οὐρανόθεν
  choice: vom Himmel her
  alternative: vom Himmel / vom Himmelsraum her
  rationale: Die Engelerscheinung wird ausdrücklich aus dem Himmel kommend dargestellt. Die Übersetzung bewahrt diese Aussage, ohne zusätzliche Lehren über Art oder Ort des Himmels einzutragen.
- issue: Identität und Gestalt der ἔφιπποι ἄγγελοι
  choice: berittene Engel
  alternative: Engel zu Pferd
  rationale: Der griechische Text bezeichnet die Gestalten zugleich als Engel und als beritten. Die direkte Formulierung lässt diese ungewöhnliche Verbindung stehen, statt sie zu bloßen himmlischen Reitern abzuschwächen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Der lange griechische Partizipialsatz wurde zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert; Handlung, Bildfolge und handelnde Subjekte bleiben erhalten.
