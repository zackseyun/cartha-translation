  text: with the accursed Simon and a very heavy force[a]. After coming forward, he said that he had come by the king’s commands[b], in order to take the private funds of the treasury.
translation:
  language: de
  text: mit dem verfluchten Simon und einer überaus gewaltigen Streitmacht.[a] Er trat vor und erklärte, er sei auf Befehl des Königs gekommen, um die privaten Gelder im Schatzhaus an sich zu nehmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „einer überaus schweren Streitmacht“; gemeint sein kann eine sehr große, bedrückende oder besonders furchteinflößende Streitmacht.
    reason: lexical_alternative
  - marker: b
    text: Wahrscheinlich sind private oder zur Verwahrung hinterlegte Gelder innerhalb des Schatzhauses gemeint, nicht unbedingt dessen gesamter Bestand.
    reason: cultural_note
lexical_decisions:
- source_word: καταράτου
  choice: verfluchten
  rationale: 'Bewahrt die starke verurteilende Bedeutung: Simon steht unter einem Fluch oder ist des Fluches würdig.'
- source_word: βαρυτάτου στρατοῦ
  choice: einer überaus gewaltigen Streitmacht
  rationale: „Gewaltig“ gibt die übertragene Bedeutung von βαρύς als schwer lastend, mächtig oder furchteinflößend natürlich wieder, ohne sie allein auf die zahlenmäßige Größe festzulegen.
- source_word: προσελθών
  choice: Er trat vor
  rationale: Gibt die dem Hauptverb vorausgehende Annäherung knapp und idiomatisch wieder.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: auf Befehl des Königs
  rationale: Der Dativ bezeichnet hier den königlichen Auftrag beziehungsweise die Vollmacht; der deutsche Singular ist eine natürliche feste Wendung.
- source_word: ἥκειν
  choice: er sei … gekommen
  rationale: Der Infinitiv in indirekter Rede wird im Deutschen angemessen mit Konjunktiv I wiedergegeben; ἥκω bezeichnet das Gekommensein mit gegenwärtigem Ergebnis.
- source_word: ὅπως
  choice: um … zu
  rationale: Gibt den finalen Sinn der Konstruktion natürlich und eindeutig wieder.
- source_word: τὰ ἰδιωτικὰ … χρήματα
  choice: die privaten Gelder
  rationale: Bezeichnet Gelder privater oder persönlicher Art im Gegensatz zu öffentlichen beziehungsweise sakral bestimmten Mitteln.
- source_word: τοῦ γαζοφυλακίου
  choice: im Schatzhaus
  rationale: Der Genitiv lässt sich hier als Zugehörigkeit beziehungsweise Verwahrung verstehen; „Schatzhaus“ bezeichnet den Aufbewahrungsort, ohne „Tempel-“ ausdrücklich hinzuzufügen.
- source_word: λάβοι
  choice: an sich zu nehmen
  rationale: Gibt λαμβάνω im feindseligen Kontext kräftiger als bloßes „nehmen“, ohne die Bedeutung so stark wie „rauben“ festzulegen.
theological_decisions:
- issue: Ob das Schatzhaus ausdrücklich als Tempelschatzhaus bezeichnet werden soll
  choice: im Schatzhaus
  alternative: im Tempelschatzhaus
  rationale: Der Zusammenhang betrifft den Jerusalemer Tempel, doch γαζοφυλάκιον selbst enthält diese nähere Bestimmung nicht; sie wird daher nicht in den Haupttext eingetragen.
- issue: Verhältnis der privaten Gelder zum Schatzhaus
  choice: die privaten Gelder im Schatzhaus
  alternative: die privaten Gelder des Schatzhauses
  rationale: ἰδιωτικά spricht eher für private beziehungsweise hinterlegte Gelder, die sich im Schatzhaus befinden, als für Vermögen, das dem Schatzhaus selbst gehört. Die Fußnote hält diese Deutung als wahrscheinlich, nicht als völlig sicher, fest.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der Konjunktiv I kennzeichnet die indirekte Rede. „Streitmacht“ wahrt den militärischen Sinn von στρατός; „gewaltig“ erhält die Bedeutungsbreite der griechischen Schwere-Metapher.
