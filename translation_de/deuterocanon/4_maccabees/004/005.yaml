- from: Und nachdem er die Vollmacht über sie erhalten hatte, kam er schnell in unsere Heimat.[a]
  to: Und nachdem er Macht über sie erlangt hatte, kam er schnell in unsere Heimat.[a]
  rationale: Die Revision ersetzt das potenziell zu spezifische „Vollmacht ... erhalten“ durch „Macht ... erlangt“, das ἐξουσία im vorliegenden politischen Zusammenhang weiter und natürlicher wiedergibt. Die notwendige, im griechischen Text nicht ausdrücklich erhaltene Ergänzung „kam“ und die dazugehörige Fußnote bleiben unverändert.
