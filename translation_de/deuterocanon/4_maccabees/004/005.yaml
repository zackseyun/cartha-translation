lexical_decisions:
- source_word: λαβὼν
  choice: nachdem er … erhalten hatte
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die der ergänzten Bewegungshandlung vorausgeht. „Erhalten“ passt bei übertragener Vollmacht idiomatischer als das wörtlichere „genommen“.
- source_word: τὴν περὶ αὐτῶν ἐξουσίαν
  choice: die Vollmacht über sie
  rationale: ἐξουσία bezeichnet Befugnis, Autorität oder Verfügungsgewalt. Mit περὶ αὐτῶν gibt „Vollmacht über sie“ den Bezug auf die zuvor genannten Menschen klar und würdig wieder.
- source_word: ταχὺ
  choice: schnell
  rationale: Das Adverb bezeichnet rasches Handeln. „Schnell“ bleibt gegenüber dem stärkeren „sofort“ semantisch zurückhaltend.
- source_word: εἰς τὴν πατρίδα ἡμῶν
  choice: in unsere Heimat
  rationale: πατρίς bezeichnet das eigene Heimat- oder Vaterland. „Unsere Heimat“ ist im modernen Deutschen natürlich und bewahrt den gemeinschaftlich-nationalen Bezug.
