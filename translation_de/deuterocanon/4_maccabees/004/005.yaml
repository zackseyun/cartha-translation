translation:
  language: de
  text: Und nachdem er Macht über sie erlangt hatte, kam er schnell in unsere Heimat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte griechische Text dieses Satzes scheint unvollständig zu sein; nach „schnell in unsere Heimat“ fehlt ein ausdrückliches finites Verb. „Kam“ wurde aus dem Zusammenhang ergänzt, um den Satz verständlich wiederzugeben.
