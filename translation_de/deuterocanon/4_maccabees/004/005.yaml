  source_fidelity: Die Übersetzung gibt die Abfolge des Aoristpartizips λαβών und die elliptische Überlieferung sachgerecht wieder. Die Ergänzung von „kam“ ist aufgrund des Kontextes erforderlich und wird transparent kenntlich gemacht. „Vollmacht“ kann jedoch im Deutschen speziell eine verliehene bzw. mandatierte Befugnis nahelegen, während ἐξουσία hier allgemeiner Herrschaftsgewalt bzw. Autorität bezeichnet.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch. „Macht über sie erlangt hatte“ ist in diesem politischen Kontext idiomatischer und weniger verwaltungsrechtlich geprägt als „die Vollmacht über sie erhalten hatte“.
  terminology: „Macht über sie“ deckt die Bedeutung von τὴν περὶ αὐτῶν ἐξουσίαν angemessen ab, ohne eine bestimmte Art der Übertragung von Autorität zu behaupten. „Heimat“ ist für πατρίς natürlich und passend.
