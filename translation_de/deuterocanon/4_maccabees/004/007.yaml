  text: And when the nation was raging at the proposal and speaking against it[a], they considered it utterly dreadful if those who had entrusted their deposits to the sacred treasury should be deprived of them[b], since
translation:
  language: de
  text: Und als das Volk über den Plan empört war und dagegen sprach, hielten sie es für überaus schlimm, wenn diejenigen, die ihre Güter dem heiligen Schatz[a] anvertraut hatten, dieser Güter beraubt würden, weil …[b]
  philosophy: optimal-equivalence
