lexical_decisions:
- source_word: τοῦ ἔθνους
  choice: das Volk
  rationale: Gemeint ist hier die jüdische Bevölkerung als Gemeinschaft. „Das Volk“ ist im Deutschen natürlicher als „die Nation“ und bewahrt den kollektiven Sinn.
- source_word: πρὸς τὸν λόγον
  choice: über den Plan
  rationale: λόγος bezeichnet im Zusammenhang den angekündigten Plan bezüglich der Tempelgelder. „Plan“ gibt den praktischen Bezug wieder, ohne die Formulierung unnötig auszudeuten.
- source_word: σχετλιάζοντος ἀντιλέγοντός τε
  choice: sich empörte und ihm widersprach
  rationale: σχετλιάζω drückt heftige Entrüstung aus, ἀντιλέγω den ausdrücklich geäußerten Widerspruch. Die beiden unterschiedlichen Aspekte bleiben erhalten.
- source_word: πάνδεινον
  choice: ganz entsetzlich
  rationale: Das verstärkende πάν- steigert δεινός erheblich. „Ganz entsetzlich“ ist verständlich, würdig und wahrt die Intensität.
- source_word: νομίσαντες
  choice: hielten sie es für
  rationale: Die Wendung führt das Urteil des nicht ausdrücklich genannten Subjekts ein und entspricht natürlichem deutschem Satzbau.
- source_word: οἱ τὰς παρακαταθήκας πιστεύσαντες
  choice: diejenigen, die ihre anvertrauten Güter … hinterlegt hatten
  rationale: παρακαταθήκη bezeichnet zur sicheren Verwahrung anvertrautes Gut; πιστεύω bezeichnet hier das Anvertrauen beziehungsweise Hinterlegen. Die Wiedergabe vermeidet das im Deutschen missverständliche „Einlagen anvertrauen“.
- source_word: τῷ ἱερῷ θησαυρῷ
  choice: im heiligen Schatzhaus
  rationale: ἱερός kennzeichnet das Schatzhaus als dem Heiligtum zugehörig und heilig. Der Dativ bezeichnet bei πιστεύω das, dem die Güter anvertraut wurden; idiomatisch steht im Deutschen hier „im … hinterlegt“.
- source_word: στερηθήσονται
  choice: sie verlieren sollten
  rationale: Das Passiv von στερέω bedeutet, einer Sache beraubt zu werden beziehungsweise sie zu verlieren. Die deutsche Formulierung ist natürlich und lässt offen, auf welche konkrete Weise der Verlust eintreten würde.
- source_word: ὡς
  choice: weil
  rationale: ὡς leitet hier eine Begründung ein, die erst im folgenden Vers ausgeführt wird. „Weil“ macht den syntaktischen Anschluss deutlich.
theological_decisions:
- issue: Bezeichnung des mit dem Heiligtum verbundenen Schatzhauses
  choice: heiliges Schatzhaus
  alternative: Tempelschatzhaus
  rationale: „Heiliges Schatzhaus“ bildet ἱερῷ θησαυρῷ eng ab und vermeidet eine stillschweigende Präzisierung, auch wenn aus dem Zusammenhang der Tempel gemeint ist.
- issue: Offener Satzschluss mit ὡς
  choice: weil …
  alternative: denn
  rationale: Die kausale Verbindung bleibt ausdrücklich erhalten, und die Auslassungspunkte zeigen, dass der Gedanke erst im nächsten Vers abgeschlossen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emotionale Stärke der griechischen Partizipien bleibt gewahrt; zugleich wird die lange griechische Satzfügung in natürlichem Deutsch wiedergegeben. Der offene Übergang zum folgenden Vers wird sichtbar beibehalten.
