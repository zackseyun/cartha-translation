  terminology: „Volk“, „Plan“, „dagegen sprach“, „heilige[r] Schatz“ und „beraubt würden“ geben die griechischen Ausdrücke angemessen wieder. Die Fußnote erläutert den Jerusalemer Tempelbezug als Kontextinformation, ohne ihn als engere Übersetzung auszugeben.
