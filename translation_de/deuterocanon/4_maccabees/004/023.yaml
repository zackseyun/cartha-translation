  text: And since he was in no way able to break the goodwill of the nation by means of decrees[a], but saw all his threats and punishments being nullified[b],
translation:
  language: de
  text: Und da er das Wohlwollen des Volkes durch seine Erlasse[a] auf keinerlei Weise brechen konnte, sondern sah, wie alle seine Drohungen und Strafen zunichtegemacht wurden[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch seine Verordnungen“. Das griechische Wort bezeichnet amtliche Erlasse oder Anordnungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht hier erneut dieselbe Wortgruppe: Er konnte das Wohlwollen des Volkes nicht „brechen“, während seine eigenen Drohungen und Strafen „zunichtegemacht“ wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: da
  rationale: Leitet hier den begründenden beziehungsweise den Fortgang vorbereitenden Umstand ein; „da“ wahrt zudem den Anschluss an den folgenden Satz.
- source_word: κατὰ μηδένα τρόπον
  choice: auf keinerlei Weise
  rationale: Gibt die nachdrückliche vollständige Verneinung formal und in natürlichem Deutsch wieder.
- source_word: ἴσχυεν καταλῦσαι
  choice: brechen konnte
  rationale: ἰσχύω mit Infinitiv bezeichnet das Vermögen; „brechen“ passt zum abstrakten Gegenstand und bewahrt die Kraft von καταλύω.
- source_word: διὰ τῶν δογμάτων
  choice: durch seine Erlasse
  rationale: δόγματα bezeichnet hier obrigkeitliche Anordnungen. Das Possessivpronomen ist aus dem handelnden Subjekt erschlossen und im Deutschen natürlich.
- source_word: τὴν τοῦ ἔθνους εὔνοιαν
  choice: die wohlwollende Haltung des Volkes
  rationale: εὔνοια bezeichnet Wohlwollen beziehungsweise eine günstige, loyale Gesinnung. Die Formulierung bewahrt diese Offenheit besser als das enger deutende „Loyalität“.
- source_word: πάσας τὰς ἑαυτοῦ ἀπειλὰς καὶ τιμωρίας
  choice: alle seine Drohungen und Strafen
  rationale: Direkte, idiomatische Wiedergabe der beiden Mittel des Zwangs.
- source_word: ἑώρα καταλυομένας
  choice: sah, wie ... zunichtegemacht wurden
  rationale: Bewahrt den passivischen Vorgang und nimmt durch „zunichtegemacht“ die wiederholte καταλύω-Wortgruppe auf, ohne die Ursache der Wirkungslosigkeit zu ergänzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Nebensatz offen, weil auch der griechische Ausgangstext syntaktisch in den folgenden Vers weiterführt. „Volk“ ist im Deutschen hier natürlicher als „Nation“ und bezeichnet das jüdische Gemeinwesen; „wohlwollende Haltung“ vermeidet eine vorschnelle Verengung von εὔνοια auf bloße politische Loyalität.
