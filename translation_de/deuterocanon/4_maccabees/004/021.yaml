base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/021.yaml
  text: For while he was waging war against Ptolemy in Egypt[a], he also heard that, when a report had spread that he was dead, the people of Jerusalem were rejoicing as much as possible; so he quickly marched up against them.
translation:
  language: de
  text: Denn während er in Ägypten gegen Ptolemäus Krieg führte, hörte er auch, dass sich die Einwohner Jerusalems, nachdem sich die Meldung[a] verbreitet hatte, er sei gestorben, in höchstem Maß freuten, und zog rasch gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das Gerücht“. Das griechische Wort φήμη kann eine Meldung, ein Gerücht oder eine öffentlich umlaufende Nachricht bezeichnen; „Meldung“ ist hier die neutralere Wiedergabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Denn während
  rationale: „Denn“ bewahrt die erklärende Funktion von γάρ; „während“ gibt den zeitlichen Hintergrund wieder, in den das folgende Geschehen eingebettet ist.
- source_word: πολεμῶν ἦν
  choice: er … Krieg führte
  rationale: Die periphrastische Konstruktion bezeichnet eine andauernde Kriegshandlung; die deutsche Wendung ist natürlich und präzise.
- source_word: κατʼ Αἴγυπτον Πτολεμαίῳ
  choice: in Ägypten gegen Ptolemäus
  rationale: κατά bezeichnet hier am plausibelsten den Kriegsschauplatz, während der Dativ Πτολεμαίῳ den persönlichen Gegner nennt.
- source_word: ἠκούσέν τε
  choice: hörte er auch
  rationale: „auch“ gibt die verbindende beziehungsweise additive Nuance von τε in natürlichem Deutsch wieder.
- source_word: φήμης διαδοθείσης
  choice: nachdem sich die Meldung verbreitet hatte
  rationale: Der Genitivus absolutus bezeichnet einen vorausgehenden Begleitumstand. „Meldung“ bleibt hinsichtlich des Wahrheitsgehalts neutraler als „Gerücht“.
- source_word: περὶ τοῦ τεθνάναι αὐτόν
  choice: er sei gestorben
  rationale: Der Konjunktiv der indirekten Rede gibt den Inhalt der verbreiteten Meldung idiomatisch wieder, ohne deren Wahrheit zu bestätigen.
- source_word: ὡς ἔνι μάλιστα
  choice: so sehr wie nur möglich
  rationale: Die Wiedergabe erhält die starke, nahezu maximal steigernde Kraft der griechischen Redewendung.
- source_word: χαίροιεν
  choice: sich … freuten
  rationale: Das Optativ in indirekter Rede wird in den von „dass“ abhängigen Satz integriert; „sich freuen“ bewahrt die Grundbedeutung, ohne eine öffentliche Feier vorauszusetzen.
- source_word: οἱ Ἱεροσολυμεῖται
  choice: die Einwohner Jerusalems
  rationale: Diese Formulierung ist im modernen Standarddeutsch verständlicher und natürlicher als „die Jerusalemer“ und bezeichnet klar die Stadtbevölkerung.
- source_word: ταχέως
  choice: rasch
  rationale: „Rasch“ gibt das hohe Tempo knapp und in einem würdigen Erzählregister wieder.
- source_word: ἐπʼ αὐτοὺς ἀνέζευξεν
  choice: zog er … gegen sie
  rationale: Die Wendung gibt sowohl das militärische Aufbrechen beziehungsweise Ziehen als auch die feindliche Ausrichtung auf die Einwohner Jerusalems wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Der lange griechische Satz bleibt als zusammenhängende Begründung erhalten, wird aber durch einen zweiten deutschen Hauptsatz lesbarer gegliedert. Der Konjunktiv „sei“ kennzeichnet den Tod als Inhalt der Meldung und nicht als Bestätigung durch den Erzähler.
