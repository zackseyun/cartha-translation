revisions:
- from: Als Apollonius von all diesen Dingen im Einzelnen erfahren hatte, lobte er Simon für dessen Fürsorge für den König. Dann aber begab er sich zu Seleukus und meldete ihm den Geldschatz[a].
  to: Nachdem Apollonius all diese Dinge im Einzelnen erfahren hatte, lobte er Simon zwar für dessen Fürsorge für den König, ging dann aber zu Seleukus hinauf und berichtete ihm von dem Geldschatz[a].
  rationale: Die Revision erhält die vorzeitige Handlung des Partizips γνούς, die μὲν … δέ-Gegenüberstellung und die Bewegungsnuance von ἀναβὰς. „Berichtete ihm von dem Geldschatz“ ist ein natürliches deutsches Äquivalent für κατήμηνυε τὸν … θησαυρόν, ohne eine belastende Anzeige als alleinigen Sinn festzulegen. Die Fußnote dokumentiert die lexikalische Spannweite, ohne den Haupttext zu überladen.
