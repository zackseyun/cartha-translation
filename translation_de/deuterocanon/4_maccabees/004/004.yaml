  naturalness: Die Sprache ist insgesamt modern und würdevoll. „Dann aber“ klingt nach einem bloß zeitlichen Anschluss und bildet die μὲν … δέ-Gegenüberstellung schwächer ab. „Nachdem …, lobte er zwar …, ging dann aber …“ ist natürlich und bildet die Satzstruktur besser nach.
  terminology: „Fürsorge für den König“ hält κηδεμονία angemessen offen und ist gegenüber einer Einengung auf „Loyalität“ vorzuziehen. Die Namensformen Apollonius, Simon und Seleukus sind im Deutschen üblich. „Geldschatz“ ist für τὸν τῶν χρημάτων θησαυρόν möglich; „von dem Geldschatz berichten“ macht die griechische Objektbeziehung idiomatisch deutlich.
