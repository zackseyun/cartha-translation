lexical_decisions:
- source_word: τούτων ἕκαστα
  choice: all diesen Dingen im Einzelnen
  rationale: 'Die Formulierung gibt den distributiven Sinn von ἕκαστα mit τούτων wieder: Apollonius erfuhr die betreffenden Sachverhalte einzeln beziehungsweise im Detail.'
- source_word: γνούς
  choice: erfahren hatte
  rationale: Das vorzeitige Aoristpartizip bezeichnet, was den folgenden Handlungen vorausging; ein temporaler Nebensatz ist im modernen Deutschen natürlich.
- source_word: τῆς εἰς τὸν βασιλέα κηδεμονίας
  choice: für dessen Fürsorge für den König
  rationale: „Fürsorge“ bewahrt den Grundsinn von κηδεμονία als Sorge oder fürsorgliches Eintreten, ohne die Haltung ausdrücklich als Loyalität zu deuten. „Dessen“ macht die Zugehörigkeit zu Simon eindeutig.
- source_word: ἐπαινεί
  choice: lobte
  rationale: Das historische Präsens wird im deutschen Erzählzusammenhang idiomatisch als Präteritum wiedergegeben.
- source_word: ἀναβὰς
  choice: begab er sich zu
  rationale: Die Bewegung zu Seleukus bleibt erhalten; das im Griechischen ausdrückliche Hinaufgehen ist ohne sicheren geografischen Bezug im Deutschen nicht eigens markiert.
- source_word: κατήμηνυε
  choice: meldete ihm
  rationale: „Melden“ erhält den Sinn des Berichtens oder Offenlegens, ohne die mögliche, aber hier nicht zwingende Bedeutung einer belastenden Anzeige einzutragen.
- source_word: τὸν τῶν χρημάτων θησαυρόν
  choice: den Geldschatz
  rationale: Die kompakte Zusammensetzung bezeichnet einen Schatz beziehungsweise Vorrat aus Geldmitteln und bewahrt das konkrete Bild von θησαυρός.
- source_word: ὁ Ἀπολλώνιος / Σίμωνι / τὸν Σέλευκον
  choice: Apollonius / Simon / Seleukus
  rationale: Die Eigennamen werden in den im Deutschen üblichen Formen wiedergegeben.
