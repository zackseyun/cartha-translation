  text: When Apollonius learned each of these things[a], he praised Simon for his loyalty to the king, but went up to Seleucus and reported the treasury of funds;
translation:
  language: de
  text: Nachdem Apollonius all diese Dinge im Einzelnen erfahren hatte, lobte er Simon zwar für dessen Fürsorge für den König, ging dann aber zu Seleukus hinauf und berichtete ihm von dem Geldschatz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „setzte ihn über den Geldschatz in Kenntnis“ oder „zeigte ihm den Geldschatz an“. Das griechische Verb kann Melden, Offenlegen oder Anzeigen bezeichnen; der Ausdruck für den Schatz hebt die angesammelten Geldmittel hervor.'
