base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/013.yaml
  text: Distressed by these words[a], Onias the high priest, although otherwise being careful lest King Seleucus might ever think that Apollonius had been done away with by human plotting and not by divine justice[b], offered some prayer concerning him.
translation:
  language: de
  text: Von diesen Worten bedrückt, brachte Onias, der Hohepriester, ein Gebet in Bezug auf ihn dar, obwohl er zugleich besorgt war, König Seleukos könne nicht etwa meinen, Apollonius sei durch einen menschlichen Anschlag und nicht durch göttliche Gerechtigkeit getötet worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Er betete etwas in Bezug auf ihn.« Das Griechische lässt offen, ob Onias für Apollonius oder wegen der ihn betreffenden Angelegenheit betete.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαχθεὶς
  choice: bedrückt
  rationale: Das Partizip bezeichnet hier, dass Onias von den vorausgehenden Worten innerlich belastet oder bekümmert wurde. »Bedrückt« gibt dies knapp und natürlich wieder.
- source_word: τούτοις τοῖς λόγοις
  choice: von diesen Worten
  rationale: Der Dativ nennt den Anlass der Bedrückung; die Wiedergabe wahrt den unmittelbaren Bezug auf die vorausgehende Rede.
- source_word: ὁ ἀρχιερεύς
  choice: der Hohe Priester
  rationale: Dies ist die geläufige, würdevolle deutsche Bezeichnung des jüdischen Hohepriesteramtes.
- source_word: ἄλλως εὐλαβηθεὶς
  choice: andererseits befürchtete
  rationale: εὐλαβέομαι bezeichnet im Kontext vorsichtige Besorgnis, nicht vorrangig religiöse Ehrfurcht. »Andererseits« gibt ἄλλως wieder und markiert die gegenläufige Erwägung.
- source_word: μὴ ποτε νομίσειεν
  choice: könnte meinen
  rationale: Die Formulierung drückt die Sorge vor einer möglichen Folgerung des Königs aus. Der deutsche Konjunktiv bewahrt diesen hypothetischen Charakter.
- source_word: ἐξ ἀνθρωπίνης ἐπιβουλῆς
  choice: durch einen Anschlag von Menschen
  rationale: ἐπιβουλή bezeichnet einen feindseligen Plan oder Anschlag. Die Formulierung erhält den Gegensatz zwischen menschlichem Planen und göttlicher Gerechtigkeit.
- source_word: θείας δίκης
  choice: göttliche Gerechtigkeit
  rationale: Die Übersetzung bleibt bei der abstrakten Formulierung des Griechischen und setzt nicht ausdrücklich »Gott« oder »Gericht« ein.
- source_word: ἀνηρῆσθαι
  choice: getötet worden
  rationale: ἀναιρέω bezeichnet in diesem Zusammenhang das Töten beziehungsweise die gewaltsame Beseitigung Apollonius'. »Getötet« macht den gemeinten Vorgang in heutigem Deutsch klar.
- source_word: ηὔξατό τι περὶ αὐτοῦ
  choice: sprach ... ein Gebet seinetwegen
  rationale: »Ein Gebet« gibt die unbestimmte Aussage mit τι wieder. »Seinetwegen« lässt eher als das eindeutigere »für ihn« offen, ob Onias zugunsten des Apollonius oder wegen der ihn betreffenden Angelegenheit betete.
theological_decisions:
- issue: Bedeutung von θείας δίκης
  choice: göttliche Gerechtigkeit
  alternative: göttliches Gericht; Gottes Gerechtigkeit
  rationale: θείας bezeichnet das Göttliche, ohne Gott ausdrücklich als Genitivattribut zu nennen; δίκη kann Gerechtigkeit, Rechtsprechung oder Strafgericht bezeichnen. Die gewählte Fassung bewahrt die abstrakte und theologisch spannungsvolle Aussage.
- issue: Bezug und Zielrichtung von περὶ αὐτοῦ
  choice: ein Gebet seinetwegen
  alternative: ein Gebet für ihn; ein Gebet wegen der ihn betreffenden Angelegenheit
  rationale: Das Griechische legt nicht eindeutig fest, ob Onias für Apollonius selbst oder allgemeiner hinsichtlich seiner Lage betete. Die Übersetzung und Fußnote erhalten diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem argumentativen Verlauf des griechischen Satzes, bleibt aber trotz der eingeschobenen Befürchtung verständlich. Unnötig altertümliche Wörter und konfessionell geprägte Deutungen wurden vermieden.
