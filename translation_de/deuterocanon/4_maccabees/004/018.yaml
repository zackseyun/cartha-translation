translation:
  language: de
  text: Er suchte auch das Volk auf und brachte es zu jeder Form von Gesetzlosigkeit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „prägte das Volk zu jeder Form von Gesetzlosigkeit“. Das griechische Verb kann das Formen einer Lebensweise oder des öffentlichen Verhaltens bezeichnen, nicht nur die Veranlassung einzelner gesetzloser Taten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεζήτησεν
  choice: suchte … gezielt auf
  rationale: Das zusammengesetzte Verb bezeichnet ein bewusstes, nachdrückliches Suchen. „Gezielt aufsuchen“ bewahrt diese aktive Bedeutung, ohne das feindselige Motiv ausdrücklich in den Wortlaut einzutragen.
- source_word: τὸ ἔθνος
  choice: das Volk
  rationale: ἔθνος bezeichnet hier das jüdische Volk als geschlossene ethnische Gemeinschaft. „Das Volk“ ist im Deutschen natürlich und fügt die im Griechischen nicht ausdrücklich genannte Bezeichnung „jüdisch“ nicht hinzu.
- source_word: ἐξεπολίτευσεν
  choice: brachte es dazu, … zu leben
  rationale: Das von πολιτεύω abgeleitete Verb betrifft die Gestaltung der Lebens- oder öffentlichen Verhaltensweise und hat hier mit ἐπί plus Akkusativ einen verursachenden Sinn. Die Formulierung gibt diesen Sinn verständlich wieder, ohne bloß einzelne Taten oder ausschließlich staatliches Bürgerleben zu behaupten.
- source_word: ἐπὶ πᾶσαν παρανομίαν
  choice: in jeder Art von Gesetzlosigkeit
  rationale: παρανομία bezeichnet ein Leben oder Handeln gegen das Gesetz; πᾶσαν unterstreicht hier die umfassende Breite. „Jede Art von Gesetzlosigkeit“ ist idiomatisch und bewahrt den Bezug zum Gesetz.
theological_decisions:
- issue: Moralische Bedeutung von παρανομία im jüdischen Gesetzeskontext
  choice: Gesetzlosigkeit
  alternative: Bosheit; Übertretung
  rationale: „Gesetzlosigkeit“ gibt den unmittelbaren Bezug auf gesetzeswidriges Verhalten wieder und lässt den wahrscheinlichen Bezug auf das überlieferte Gesetz erkennen, ohne diesen im Haupttext weiter einzugrenzen.
- issue: Art des durch ἐξεπολίτευσεν bezeichneten Einflusses
  choice: brachte es dazu, … zu leben
  alternative: zwang es; führte es
  rationale: Der Text beschreibt eine verursachte Lebens- und Verhaltensweise, legt aber das genaue Maß von Zwang gegenüber Einfluss nicht eindeutig fest. Die gewählte Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt allgemein verständlich, während die Fußnote den seltenen, vom bürgerlichen beziehungsweise öffentlichen Leben geprägten Sinn von ἐξεπολίτευσεν sichtbar macht.
