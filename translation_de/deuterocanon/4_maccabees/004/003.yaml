base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/003.yaml
  text: Simon[a], being hostile to the king’s interests, reported that many tens of thousands of private funds had been stored in the treasuries of Jerusalem, not connected with the temple[c][b], but that these belonged to King Seleucus.
translation:
  language: de
  text: Simon wandte sich an die für die Angelegenheiten des Königs Zuständigen[a] und meldete, in den Schatzkammern Jerusalems seien viele Zehntausende aus Privatvermögen angesammelt, die nicht zum Tempelvermögen gehörten[b]; vielmehr stünden sie König Seleukos zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist an dieser Stelle ungewöhnlich und lässt sich auch enger als „in Angelegenheiten des Königs“ verstehen. Manche deuten ihn dahin, dass Simon gegen die Interessen des Königs eingestellt gewesen sei.
    reason: textual_and_lexical_ambiguity
  - marker: b
    text: 'Wörtlicher: „die nichts mit dem Tempel gemeinsam hatten“; möglich ist auch: „an denen der Tempel keinen Anteil hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω
  choice: Simon wandte sich an die für die Angelegenheiten des Königs Zuständigen
  rationale: Die überlieferte griechische Formulierung ist syntaktisch ungewöhnlich und stark zusammengedrängt; insbesondere steht ἥκω in der ersten Person, obwohl Σίμων Subjekt des Satzes ist. Die Wiedergabe folgt dem erkennbaren Zusammenhang einer Meldung an die königliche Verwaltung, ohne die im Griechischen nicht ausdrücklich bezeichneten Adressaten in den Haupttext als bestimmte Amtsträger festzulegen.
- source_word: μηνύων
  choice: meldete
  rationale: Das Partizip bezeichnet das Bekanntmachen beziehungsweise Anzeigen von Informationen. „Meldete“ ist im politischen und finanziellen Zusammenhang natürlich und lässt den anklagenden Unterton aus dem Kontext hervorgehen.
- source_word: πολλὰς ἰδιωτικῶν χρημάτων μυριάδας
  choice: viele Zehntausende aus Privatvermögen
  rationale: μυριάς bezeichnet eine Einheit von zehntausend; ἰδιωτικὰ χρήματα meint Geld oder Vermögen in privatem Besitz. Die Formulierung bewahrt sowohl die Größenangabe als auch den Gegensatz zum Tempelvermögen.
- source_word: ἐν τοῖς Ἱεροσολύμων γαζοφυλακίοις
  choice: in den Schatzkammern Jerusalems
  rationale: γαζοφυλάκια sind Räume oder Einrichtungen zur Aufbewahrung von Schätzen und Geld. Der Genitiv Ἱεροσολύμων wird örtlich wiedergegeben.
- source_word: τεθησαυρίσθαι
  choice: seien … angesammelt
  rationale: Der Perfektinfinitiv bezeichnet einen bereits bestehenden Bestand an zurückgelegtem Vermögen. Der Konjunktiv markiert im Deutschen die indirekte Rede nach „meldete“.
- source_word: τῷ ἱερῷ μὴ ἐπικοινωνούσας
  choice: die nicht zum Tempelvermögen gehörten
  rationale: ἐπικοινωνεῖν kann gemeinschaftliche Teilhabe oder Zugehörigkeit ausdrücken. Im Zusammenhang mit ausdrücklich privatem Geld bezeichnet die Wendung am wahrscheinlichsten Gelder, die nicht gemeinsames Eigentum des Tempels waren.
- source_word: προσήκειν
  choice: stünden … zu
  rationale: προσήκειν bezeichnet hier einen behaupteten rechtlichen Anspruch. „Zustehen“ bildet diese Anspruchssprache genauer ab als das uneingeschränkte „gehören“.
- source_word: Σελεύκῳ τῷ βασιλεῖ
  choice: König Seleukos
  rationale: Die natürliche deutsche Titelform bewahrt Name und königliche Stellung.
theological_decisions:
- issue: Rechtsstellung der in den Schatzkammern verwahrten Gelder
  choice: Die Gelder werden als Privatvermögen dargestellt, das nicht zum Tempelvermögen gehörte.
  alternative: Die Gelder standen lediglich nicht zur gemeinsamen Nutzung mit dem Tempel zur Verfügung.
  rationale: ἰδιωτικῶν χρημάτων kennzeichnet sie ausdrücklich als privates Vermögen; μὴ ἐπικοινωνούσας τῷ ἱερῷ grenzt sie vom Tempel ab. Die mögliche Nuance gemeinschaftlicher Teilhabe bleibt in der Fußnote sichtbar.
- issue: Anspruch König Seleukos’
  choice: Simon behauptet, die Gelder stünden dem König zu.
  alternative: Die Gelder gehörten dem König bereits als Eigentum.
  rationale: προσήκειν kann Zugehörigkeit, Zuständigkeit oder einen berechtigten Anspruch bezeichnen. „Stünden … zu“ bewahrt den Charakter der von Simon vorgebrachten Behauptung und legt keinen unbestrittenen Eigentumstitel fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die indirekte Rede wird mit Konjunktiv I gekennzeichnet. Finanz- und Anspruchssprache bleibt verständlich, ohne Simons Meldung als erwiesene Tatsache darzustellen. Die syntaktische Schwierigkeit des griechischen Eingangssatzes wird transparent in einer Fußnote ausgewiesen.
