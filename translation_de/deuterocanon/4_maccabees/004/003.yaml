  verdict: revise
  source_fidelity: 'Die Wiedergabe von μηνύων, den privaten Geldmitteln, den Schatzkammern Jerusalems, der Abgrenzung vom Heiligtum und dem behaupteten Rechtsanspruch Seleukos’ ist im Grundsatz sachgerecht. Der erste Satzteil ist jedoch textlich und syntaktisch schwierig: Das überlieferte ἥκω ist erste Person Singular und trägt keine ausdrücklichen königlichen Adressaten. Die Formulierung, Simon habe sich an zuständige Personen gewandt, fügt daher ein im Griechischen nicht vorhandenes Handlungselement hinzu. Die im englischen Audit vertretene kontextuelle Deutung eines Gegensatzes zu den Interessen des Königs kann mit deutlicher Fußnote vorsichtig im Haupttext stehen.'
  naturalness: Die gegenwärtige deutsche Syntax und der Konjunktiv der indirekten Rede sind gut lesbar. „Viele Zehntausende aus Privatvermögen“ ist allerdings etwas unpräzise, da nicht die Personen, sondern Geldmittel gemeint sind. „Viele Zehntausende an privaten Geldmitteln“ ist idiomatischer.
  terminology: „Schatzkammern“, „private Geldmittel“, „Heiligtum/Tempel“ und „stünden König Seleukos zu“ geben die Finanz- und Anspruchssprache angemessen wieder. „Heiligtum“ bildet τὸ ἱερόν besonders direkt ab; die Fußnote wahrt die mögliche Nuance gemeinschaftlicher Zugehörigkeit.
  issues:
  - severity: high
    issue: Unbelegte Adressaten im ersten Satzteil
    rationale: „wandte sich an die für die Angelegenheiten des Königs Zuständigen“ ergänzt eine Gruppe von Empfängern, die im griechischen Text nicht genannt wird. Die schwierige Lesart darf nicht durch eine konkrete, zusätzliche Handlung harmonisiert werden.
  - severity: low
    issue: „aus Privatvermögen“ bezeichnet die Geldsumme nicht optimal
    rationale: ἰδιωτικῶν χρημάτων meint private Gelder bzw. Geldmittel. „an privaten Geldmitteln“ ist im Deutschen semantisch genauer.
  revised_text: Simon, der den Interessen des Königs feindlich gegenüberstand[a], meldete, in den Schatzkammern Jerusalems seien viele Zehntausende an privaten Geldmitteln hinterlegt worden, die nicht zum Heiligtum gehörten[b]; diese stünden vielmehr König Seleukos zu.
  revised_footnotes:
  - marker: a
    text: 'Der überlieferte griechische Satzanfang ist syntaktisch schwierig: ἥκω steht in der ersten Person („ich bin gekommen“), obwohl Simon Subjekt ist. Die Wiedergabe folgt der im Zusammenhang naheliegenden Deutung, dass Simon den Interessen des Königs entgegenstand; möglich sind auch weniger bestimmte Bezüge auf die Angelegenheiten oder Interessen des Königs.'
    reason: textual_and_lexical_ambiguity
  - marker: b
    text: 'Wörtlich etwa: „die mit dem Heiligtum nicht gemeinsam hatten“. Möglich ist auch: „an denen das Heiligtum keinen Anteil hatte“ oder „die nicht mit dem Heiligtum gemeinsam waren“.'
    reason: lexical_alternative
