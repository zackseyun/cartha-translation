base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/001.yaml
  text: For a certain Simon[a], opposing Onias, who had once held the high priesthood for life, a noble and good man, when he was unable, though slandering him in every way, to harm him on behalf of the nation, went away as an exile[b], intending to betray his homeland.
translation:
  language: de
  text: Denn ein gewisser Simon, der sich Onias politisch widersetzte – einem edlen und guten Mann, der einst das Hohepriesteramt auf Lebenszeit innehatte –, konnte ihm, obwohl er ihn auf jede Weise verleumdete, in Angelegenheiten des Volkes[a] keinen Schaden zufügen. Deshalb ging er als Verbannter[b] fort, um seine Heimat zu verraten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Hinblick auf das Volk“; das griechische ὑπὲρ τοῦ ἔθνους kann auch „zugunsten des Volkes“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Flüchtender“; das griechische φυγάς kann sowohl einen Verbannten als auch einen Menschen auf der Flucht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιπολιτευόμενος
  choice: der sich … politisch widersetzte
  rationale: Das Partizip bezeichnet aktive Gegnerschaft mit politischem Beiklang. Die Formulierung gibt beides in natürlichem Deutsch wieder.
- source_word: τὸν ποτε τὴν ἀρχιερωσύνην ἔχοντα διὰ βίου
  choice: der einst das Hohepriesteramt auf Lebenszeit innehatte
  rationale: ποτε verweist auf einen früheren Zustand, während διὰ βίου die lebenslange Amtsdauer bezeichnet. Die Spannung zwischen beiden Angaben bleibt erhalten.
- source_word: καλὸν καὶ ἀγαθὸν ἄνδρα
  choice: einem edlen und guten Mann
  rationale: Die ehrende Doppelbezeichnung wird in würdigem, verständlichem Deutsch möglichst eng wiedergegeben.
- source_word: διαβάλων
  choice: trotz aller Verleumdungen
  rationale: διαβάλλω bezeichnet hier feindselige, verleumderische Anschuldigungen. Die konzessive Formulierung bildet ἐπειδὴ πάντα τρόπον διαβάλων … οὐκ ἴσχυεν idiomatisch ab.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: in Angelegenheiten des Volkes
  rationale: Die Formulierung wahrt die Unbestimmtheit des griechischen ὑπέρ und bezeichnet vorsichtig den öffentlichen beziehungsweise das Volk betreffenden Bereich.
- source_word: οὐκ ἴσχυεν κακῶσαι
  choice: vermochte ihm … keinen Schaden zuzufügen
  rationale: Die Wendung drückt Simons Unfähigkeit aus, Onias zu schaden; das im Griechischen unausgesprochene Objekt ergibt sich aus dem Zusammenhang.
- source_word: φυγὰς ᾤχετο
  choice: ging er als Verbannter fort
  rationale: φυγάς kann einen Verbannten oder einen Flüchtigen bezeichnen. „Verbannter“ passt zum Erzählzusammenhang, ohne die lexikalische Alternative zu verschweigen.
- source_word: τὴν πατρίδα προδώσων
  choice: um seine Heimat zu verraten
  rationale: Das Futurpartizip bezeichnet hier Absicht oder Zweck; „Heimat“ bewahrt den emotionalen und angestammten Bezug von πατρίς.
