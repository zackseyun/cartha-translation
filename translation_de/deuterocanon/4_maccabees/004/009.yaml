translation:
  language: de
  text: Während die Priester aber zusammen mit Frauen und Kindern im Tempel Gott anflehten, den verächtlich behandelten Ort[a] zu verteidigen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Ort, auf den man verächtlich herabsah“; auch: „den missachteten Ort“. Der griechische Ausdruck bezeichnet die heilige Stätte als einen Ort, der verachtet oder geringschätzig behandelt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ ἱερέων
  choice: Während aber die Priester
  rationale: Der Genitivus absolutus beschreibt eine gleichzeitig ablaufende Hintergrundhandlung; „während“ gibt diese Funktion wieder. δέ wird mit dem dezenten Übergangswort „aber“ berücksichtigt, ohne einen scharfen Gegensatz zu erzeugen.
- source_word: μετὰ γυναικῶν καὶ παιδίων
  choice: zusammen mit Frauen und Kindern
  rationale: Die Formulierung bewahrt den Wortlaut, ohne die Frauen ausdrücklich als Ehefrauen der Priester auszugeben, was im Griechischen nicht gesagt wird.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier am natürlichsten den Tempel beziehungsweise den Tempelbezirk, nicht ausdrücklich nur das innere Heiligtum.
- source_word: ἱκετευόντων
  choice: anflehten
  rationale: Das Verb bezeichnet eine eindringliche, demütige Bitte; „anflehen“ ist gegenwärtiges, verständliches und würdiges Deutsch.
- source_word: ὑπερασπίσαι
  choice: zu verteidigen
  rationale: Der Aoristinfinitiv bezeichnet den erbetenen göttlichen Beistand zugunsten des bedrohten Ortes; „verteidigen“ gibt den Schutzaspekt prägnant wieder.
- source_word: τοῦ καταφρονουμένου τόπου
  choice: den verachteten Ort
  rationale: Das substantivierte passive Partizip bezeichnet einen Ort, auf den man verächtlich herabsieht beziehungsweise den man geringschätzig behandelt. Die knappe Wiedergabe wahrt die Bildkraft; die Fußnote nennt die stärker handlungsbezogene Alternative.
theological_decisions:
- issue: Bezug von τόπος („Ort“)
  choice: Der Ort ist wahrscheinlich die heilige Tempelstätte, bleibt im Text aber wörtlich „Ort“.
  alternative: Die Stadt insgesamt oder, enger gefasst, nur das Heiligtum.
  rationale: Da die Priester sich unmittelbar zuvor „im Tempel“ befinden und um dessen Schutz bitten, liegt die Tempelstätte als Bezug nahe. Die Übersetzung vermeidet jedoch eine über den Wortlaut hinausgehende ausdrückliche Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als untergeordneter, zum folgenden Verszusammenhang gehörender Temporalsatz offen; das abschließende Komma entspricht dieser syntaktischen Fortsetzung. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, den die Fußnote erläutert.
