  yaml_path: translation/deuterocanon/4_maccabees/004/015.yaml
  text: When Seleucus the king had died[a], his son Antiochus Epiphanes succeeded to the rule, a proud and formidable man;
translation:
  language: de
  text: Als aber König Seleukos gestorben war, folgte ihm sein Sohn Antiochos Epiphanes in der Herrschaft nach, ein hochmütiger und furchtgebietender[a] Mann;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schrecklicher“ beziehungsweise „furchterregender“. Das griechische Wort kann je nach Zusammenhang unter anderem furchtgebietend, schrecklich oder gefährlich bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τελευτήσαντος
  choice: Als … gestorben war
  rationale: Der temporale Genitivus absolutus bezeichnet eine der Nachfolge vorausgehende Handlung. Das Plusquamperfekt gibt dieses zeitliche Verhältnis im Deutschen natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: Die leichte weiterführende beziehungsweise kontrastierende Funktion der Partikel wird mit „aber“ wiedergegeben, ohne ein im Griechischen nicht vorhandenes „nun“ einzufügen.
- source_word: Σελεύκου τοῦ βασιλέως
  choice: König Seleukos
  rationale: Die appositionelle griechische Wortgruppe wird in idiomatischer deutscher Namensstellung wiedergegeben.
- source_word: διάδεχεται τὴν ἀρχὴν
  choice: folgte ihm … in der Herrschaft nach
  rationale: Die Formulierung bewahrt sowohl den Gedanken dynastischer Nachfolge als auch den politischen Sinn von ἀρχή, ohne diesen enger als „Königreich“ festzulegen. Das griechische historische Präsens wird im deutschen Erzähltempus wiedergegeben.
- source_word: Ἀντίοχος Ἐπιφανής
  choice: Antiochos Epiphanes
  rationale: Name und historisch gebräuchlicher Beiname werden in etablierter griechisch-deutscher Form transliteriert, nicht übersetzt.
- source_word: ἀνὴρ
  choice: Mann
  rationale: Das ausdrücklich maskuline Substantiv wird sachlich und idiomatisch wiedergegeben.
- source_word: ὑπερήφανος
  choice: hochmütig
  rationale: „Hochmütig“ bringt die hier negative Bedeutung von Stolz und Überheblichkeit deutlicher zum Ausdruck als das im Deutschen mitunter positive „stolz“.
- source_word: δεινός
  choice: furchtgebietend
  rationale: Das Wort bezeichnet hier wahrscheinlich eine bedrohliche, Furcht hervorrufende Persönlichkeit. „Furchtgebietend“ lässt sowohl Macht als auch Schrecken anklingen, ohne die breite Bedeutungsweite völlig auf eine einzelne Nuance zu verengen.
