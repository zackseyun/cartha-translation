base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/005.yaml
  text: And the tyrant Antiochus has been punished also on earth[a], and is punished with eternal things; for he was utterly unable to compel the people of Jerusalem to adopt foreign ways and to abandon the customs of their fathers' nation,
translation:
  language: de
  text: Auch der Tyrann Antiochus ist auf Erden bestraft worden und wird ewig bestraft[a]; denn es gelang ihm überhaupt nicht, die Bewohner Jerusalems dazu zu zwingen, fremde Lebensweisen anzunehmen und sich von der Lebensordnung ihres angestammten Volkes zu lösen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird mit ewigen Strafen bestraft“. Im Griechischen steht das Adjektiv „ewig“ ohne ein ausdrücklich genanntes Bezugswort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τύραννος
  choice: Tyrann
  rationale: Bewahrt die deutlich abwertende Bezeichnung des Antiochus als gewalttätigen Unterdrücker.
- source_word: τετιμώρηται
  choice: ist schon ... bestraft worden
  rationale: Das Perfekt bezeichnet eine vollzogene Bestrafung mit fortdauernder Bedeutung; „schon“ verdeutlicht den Kontrast zur folgenden fortdauernden Strafe, ohne eine zusätzliche zeitliche Aussage einzuführen.
- source_word: ἀϊδίων κολάζεται
  choice: wird mit Ewigem bestraft
  rationale: Die ungewöhnliche Formulierung erhält die Ellipse des substantivierten beziehungsweise auf ein ausgelassenes Substantiv bezogenen Adjektivs, statt eindeutig „ewig“ oder „ewige Strafen“ festzulegen.
- source_word: οὐδὲν οὐδαμῶς ἴσχυσεν
  choice: es gelang ihm überhaupt nicht
  rationale: Gibt die nachdrücklich gehäufte Verneinung in natürlichem Deutsch wieder.
- source_word: τοὺς Ἱεροσολυμείτας
  choice: die Bewohner Jerusalems
  rationale: Eine klare und gegenwärtig natürliche Wiedergabe der Personenbezeichnung.
- source_word: ἀλλοφυλῆσαι
  choice: fremde Lebensweisen anzunehmen
  rationale: Bezeichnet hier die erzwungene Angleichung an fremde Völker und deren religiös-kulturelle Praxis, nicht einen Ortswechsel.
- source_word: τῶν πατρίων ἐθνῶν ἐκδιαιτηθῆναι
  choice: sich von der Lebensordnung ihres angestammten Volkes zu lösen
  rationale: „Lebensordnung“ erfasst den Bezug des Verbs auf Lebensführung und Gebräuche; „angestammtes Volk“ wahrt sowohl πατρίων als auch das überlieferte ἐθνῶν.
theological_decisions:
- issue: Art und Dauer der Strafe des Antiochus nach seiner irdischen Bestrafung
  choice: Die fortdauernde, dem Ewigen zugehörige Strafe wird bejaht, ihr genauer Ausdruck aber nicht festgelegt.
  alternative: „wird ewig bestraft“ oder „wird mit ewigen Strafen bestraft“
  rationale: Der griechische Text stellt der irdischen Bestrafung eine weitere Bestrafung gegenüber, lässt bei ἀϊδίων jedoch das Bezugswort unausgesprochen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewohnte Wendung „mit Ewigem“ ist bewusst gewählt, um die Ellipse des griechischen Textes sichtbar zu halten; die Fußnote bietet die geläufigeren Deutungen. Das abschließende Komma bleibt stehen, weil der griechische Satz im folgenden Vers weitergeführt wird.
