  yaml_path: translation/deuterocanon/4_maccabees/018/013.yaml
  text: And he also glorified Daniel in the lions’ pit[a], whom he also called blessed.
translation:
  language: de
  text: Und er pries auch Daniel in der Löwengrube[a] und nannte ihn glücklich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in einer Grube von Löwen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόξαζεν
  choice: pries
  rationale: δοξάζω kann »verherrlichen«, »ehren« oder »preisen« bedeuten. Da Daniel das Objekt ist, gibt »pries« die gehobene Anerkennung natürlich wieder, ohne im Deutschen unnötig den Eindruck göttlicher Verehrung zu erwecken.
- source_word: ἐν λάκκῳ λεόντων
  choice: in der Löwengrube
  rationale: λάκκος bezeichnet wörtlich eine Grube oder Zisterne. »Löwengrube« ist im Deutschen zugleich quellennah und als Bezeichnung der Danielüberlieferung geläufig.
- source_word: ἐμακάριζεν
  choice: nannte ihn glücklich
  rationale: μακαρίζω bedeutet, jemanden glücklich beziehungsweise selig zu nennen oder dafür zu halten. Die Formulierung bewahrt den verbalen Sinn und ist in modernem Deutsch verständlich.
- source_word: καὶ ... καί
  choice: auch ... und
  rationale: Das erste καί setzt die Reihe fort und wird mit »auch« wiedergegeben. Beim zweiten καί genügt im natürlichen Deutschen »und«; ein zweites »auch« wäre schwerfällig, ohne einen wesentlichen Bedeutungsanteil hinzuzufügen.
- source_word: ὃν
  choice: ihn
  rationale: Das Relativpronomen nimmt Daniel wieder auf. Wegen der im Deutschen natürlicheren Koordination wird der Bezug mit dem Personalpronomen »ihn« ausgedrückt.
theological_decisions:
- issue: Die auf Daniel bezogene Ruhmessprache
  choice: »pries« gibt die starke Anerkennung wieder, ohne Verehrung im kultischen Sinn festzulegen.
  alternative: »verherrlichte« wäre formnäher, könnte im heutigen Deutschen jedoch stärker nach einer allein Gott geltenden Verehrung klingen.
  rationale: Der griechische Text verwendet gehobene Ruhmessprache für Daniel als vorbildliche Gestalt. Die Übersetzung bewahrt diese Wertschätzung, vermeidet aber eine im Kontext nicht erforderliche kultische Deutung.
- issue: Bedeutung von μακαρίζω
  choice: »nannte ihn glücklich«
  alternative: »nannte ihn selig«
  rationale: »Selig« ist möglich und traditionell geprägt, kann jedoch im modernen Deutschen einen engeren religiösen oder jenseitigen Sinn nahelegen. »Glücklich« hält die Aussage offen und entspricht dem Grundsinn des Verbs.
translation_notes:
  register: Natürliches, würdiges Standarddeutsch. Die Wiederholung des griechischen καί wird zugunsten eines flüssigen deutschen Satzes leicht geglättet; der kumulative Anschluss bleibt durch »auch« erhalten.
