lexical_decisions:
- source_word: Αὕτη
  choice: Dies
  rationale: Das Demonstrativpronomen verweist auf das zuvor Gesagte. „Dies“ bewahrt die knappe Formulierung, ohne den Bezug näher festzulegen.
- source_word: ζωὴ
  choice: Leben
  rationale: Die direkte und im Zusammenhang natürliche Entsprechung; „Lebensweise“ würde eine nicht ausdrücklich formulierte Deutung hinzufügen.
- source_word: ὑμῶν
  choice: euer
  rationale: Gibt den Genitiv der zweiten Person Plural idiomatisch wieder und bezieht sich entsprechend der griechischen Wortstellung sowohl auf das Leben als auch sinngemäß auf die Tage.
- source_word: μακαριότης
  choice: Seligkeit
  rationale: Bewahrt den gehobenen, religiös-ethischen Klang des griechischen Substantivs besser als das allgemeinere „Glück“.
- source_word: ἡμερῶν
  choice: Tage
  rationale: Entspricht dem Genitiv Plural wörtlich und erhält das biblisch geprägte Bild für die Lebenszeit.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Standardsprache. Die Satzparallelität und die offene Rückverweisung von Αὕτη bleiben erhalten; „Seligkeit“ ist bewusst gehoben, aber im biblischen Register verständlich.
