translation:
  language: de
  text: der euch, als er noch bei uns war, das Gesetz und die Propheten[b] lehrte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Imperfekt kann eine andauernde oder wiederholte Handlung ausdrücken, etwa: „unterrichtete euch“ oder „pflegte euch zu lehren“.'
    reason: lexical_alternative
  - marker: b
