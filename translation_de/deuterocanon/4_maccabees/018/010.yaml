lexical_decisions:
- source_word: ὃς
  choice: der
  rationale: Das Relativpronomen knüpft an eine männliche Bezugsgröße im vorherigen Zusammenhang an und bewahrt die Satzstruktur des griechischen Fragments.
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Das Präteritum ist im Deutschen die natürliche Erzählform. Der griechische Imperfekt kann eine andauernde oder wiederholte Tätigkeit bezeichnen; diese Aspektnuance wird in einer Fußnote offengehalten.
- source_word: ὑμᾶς
  choice: euch
  rationale: Die Akkusativform gibt die Mehrzahl der angesprochenen Personen eindeutig wieder.
- source_word: ἔτι ὢν σὺν ἡμῖν
  choice: als er noch bei uns war
  rationale: Die temporale Wiedergabe ist natürliches modernes Deutsch und erhält sowohl ἔτι („noch“) als auch σὺν ἡμῖν („bei/mit uns“).
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Die bestimmte Form bezeichnet hier das Gesetz Israels beziehungsweise die Tora. Die Großschreibung folgt zugleich der deutschen Rechtschreibung.
- source_word: καὶ τοὺς προφήτας
  choice: und die Propheten
  rationale: Die traditionelle sachgerechte Wiedergabe bewahrt die feste Verbindung mit „dem Gesetz“ und kann sowohl die prophetischen Schriften als auch ihr autoritatives Zeugnis bezeichnen.
theological_decisions:
- issue: Deutung von „das Gesetz und die Propheten“ als Schriftbezeichnung
  choice: Die wörtliche Paarformel bleibt im Haupttext stehen; ihr Bezug auf Israels heilige Schriften wird in einer Fußnote erläutert.
  alternative: Die Schriften Israels
  rationale: Die wörtliche Form bewahrt die geschichtlich und theologisch bedeutsame Gliederung, ohne sie auf eine einzige kanongeschichtliche Definition festzulegen.
- issue: Aspekt des griechischen Imperfekts ἐδίδασκεν
  choice: lehrte
  alternative: unterrichtete euch fortwährend / pflegte euch zu lehren
  rationale: Das einfache deutsche Präteritum klingt natürlich und legt nicht fest, ob die Handlung vor allem andauernd oder gewohnheitsmäßig war; die mögliche Aspektnuance wird in der Fußnote benannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Relativsatz an den vorherigen Zusammenhang gebunden. Die Satzstellung ist idiomatisch, ohne die zeitliche Nebeninformation oder die Schriftformel abzuschwächen.
