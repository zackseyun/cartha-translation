base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/016.yaml
  text: He held up Solomon before us as a proverb, the one who says, “It is a tree of life for all who do his will.”
translation:
  language: de
  text: 'Er führte uns Salomo sprichwörtlich an, der sagt: „Ein Baum des Lebens ist es für alle, die seinen[a] Willen tun.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Willen“. Das griechische Pronomen kann auch auf eine unpersönliche beziehungsweise sachliche Größe bezogen werden; der Zusammenhang spricht jedoch eher für Gottes Willen.'
    reason: alternative_reading
  - marker: b
    text: Der Ausspruch greift Sprüche 3,18 in abgewandelter Form auf.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαροιμίαζεν
  choice: führte … sprichwörtlich an
  rationale: Das Verb bezeichnet ein sprichwortartiges Sprechen oder Anführen. Die Formulierung gibt wieder, dass Salomo als Autorität eines Weisheitsspruchs angeführt wurde, ohne den direkten Objektbezug zu verwischen.
- source_word: τὸν Σαλομῶντα
  choice: Salomo
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben; der Akkusativ hängt von ἐπαροιμίαζεν ab.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Adressaten, denen Salomo sprichwörtlich angeführt wurde.
- source_word: τὸν λέγοντα
  choice: der sagt
  rationale: Das substantivierte Präsenspartizip kennzeichnet Salomo als Sprecher des folgenden Ausspruchs; das Präsens bleibt erhalten.
- source_word: Ξύλον ζωῆς
  choice: ein Baum des Lebens
  rationale: Die Formulierung bewahrt das Weisheitsmotiv und gibt das artikellose Prädikatsnomen im Deutschen natürlich wieder.
- source_word: πᾶσιν τοῖς ποιοῦσιν
  choice: für alle, die … tun
  rationale: Die Wendung bezeichnet ausnahmslos alle, die den genannten Willen ausführen. „Tun“ ist zugleich unmittelbar und quellennah.
- source_word: αὐτοῦ τὸ θέλημα
  choice: seinen Willen
  rationale: Im Zusammenhang der Treue zu Gott liegt ein persönlicher Bezug des Pronomens nahe. Die grammatisch mögliche unpersönliche beziehungsweise sachliche Lesart wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bezugswort von αὐτοῦ im Zitat
  choice: seinen Willen
  alternative: dessen Willen / seinen eigenen Willen (auf den Baum beziehungsweise das damit bezeichnete Konzept bezogen)
  rationale: Der Kontext handelt vom treuen Tun des Willens Gottes und legt daher den Bezug auf Gott nahe. Da die griechische Pronominalform den Bezug nicht ausdrücklich nennt und auch sachlich verstanden werden kann, wird diese Spannung nicht im Haupttext aufgelöst, sondern durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sprichwörtlich anführen“ wahrt die ungewöhnliche Konstruktion, in der Salomo selbst als spruchhafte Autorität vor die Hörer gestellt wird. Die leicht markierte Wortstellung im Zitat erhält den Charakter eines Weisheitsspruchs.
