base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/023.yaml
  text: But the children of Abraham[a], together with their victory-bearing mother, are gathered to the place of their fathers[b], having received pure and immortal souls from God.
translation:
  language: de
  text: Die Söhne Abrahams aber[a] werden zusammen mit ihrer siegreichen Mutter[b] zum Ort ihrer Väter versammelt, nachdem sie von Gott reine und unsterbliche Seelen empfangen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich eine Bezeichnung für die zu Abraham Gehörenden; gemeint sind hier die als Märtyrer gestorbenen Brüder.
    reason: lexical_clarification
  - marker: b
    text: 'Das griechische Wort stammt aus der Bildwelt des Wettkampfs und bezeichnet eine Mutter, die den Kampfpreis beziehungsweise den Sieg errungen hat; auch: „preisgekrönte Mutter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀβραμιαῖοι ... παῖδες
  choice: die Söhne Abrahams
  rationale: Die adjektivische Bezeichnung ordnet die hier gemeinten männlichen Geschwister Abraham zu. „Söhne“ entspricht dem unmittelbaren Referenten genauer als das allgemeinere „Kinder“.
- source_word: σὺν τῇ ἀθλοφόρῳ μητρὶ
  choice: zusammen mit ihrer siegreichen Mutter
  rationale: ἀθλοφόρος bezeichnet eine Person, die im Wettkampf den Preis beziehungsweise Sieg davonträgt. „Siegreich“ ist im Deutschen natürlich und bewahrt das Motiv des bestandenen Kampfes; die genauere Wettkampfmetaphorik wird in der Fußnote erläutert.
- source_word: εἰς πατέρων χῶρον
  choice: am Ort ihrer Väter
  rationale: χῶρος bezeichnet einen Ort oder Bereich. Die Formulierung wahrt den Bezug auf die Vorfahren, ohne den jenseitigen Ort näher zu bestimmen.
- source_word: συναγελιᾶζονται
  choice: werden ... in die Gemeinschaft aufgenommen
  rationale: Das seltene Verb betont das Zusammenkommen beziehungsweise die Gemeinschaft mit anderen. Diese Wiedergabe erfasst stärker als bloßes „versammelt werden“, dass sie zur Gemeinschaft ihrer Väter hinzukommen.
- source_word: ψυχὰς
  choice: Seelen
  rationale: In Verbindung mit „rein und unsterblich“ und im Kontext des Todes der Märtyrer bezeichnet ψυχή hier am ehesten die Seele, nicht lediglich das irdische Leben.
- source_word: ἁγνὰς καὶ ἀθανάτους
  choice: reine und unsterbliche
  rationale: Die Wiedergabe bildet die beiden Eigenschaften direkt und ohne zusätzliche dogmatische Deutung ab.
- source_word: ἀπειληφότες
  choice: nachdem sie ... empfangen haben
  rationale: Das Partizip von ἀπολαμβάνω bezeichnet hier den Empfang von Gott; ein temporaler Nebensatz ist im Deutschen klar und natürlich.
- source_word: παρὰ τοῦ θεοῦ
  choice: von Gott
  rationale: παρά mit Genitiv bezeichnet die Quelle; „von Gott“ gibt dies knapp und genau wieder.
theological_decisions:
- issue: Jenseitsvorstellung in εἰς πατέρων χῶρον
  choice: „am Ort ihrer Väter“ ohne Benennung als Himmel, Paradies oder Schoß Abrahams
  alternative: „im Reich ihrer Väter“ oder „in der Heimat ihrer Väter“
  rationale: Der griechische Text nennt einen Ort beziehungsweise Bereich der Vorfahren, legt aber keine weiter ausgearbeitete jenseitige Örtlichkeit fest.
- issue: Anthropologische Bedeutung von ψυχὰς ἁγνὰς καὶ ἀθανάτους
  choice: „reine und unsterbliche Seelen“
  alternative: „reine und unvergängliche Leben“
  rationale: Im Martyriumskontext spricht die Wendung von einer Gabe Gottes über den Tod hinaus. „Seelen“ erhält diese Aussage, ohne sie in ein umfassenderes anthropologisches Lehrsystem einzuordnen.
- issue: Verhältnis von Ort und Gemeinschaft
  choice: Den Ort mit „am Ort ihrer Väter“ und das Verb mit „in die Gemeinschaft aufgenommen“ wiedergeben
  alternative: „werden zum Ort ihrer Väter versammelt“
  rationale: So bleiben sowohl das räumliche Ziel εἰς ... χῶρον als auch der Gemeinschaftsaspekt von συναγελιᾶζονται erkennbar, ohne beides miteinander gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem Griechischen erkennbar nahe, wird aber durch einen temporalen Nebensatz und die idiomatische Wiedergabe des seltenen Verbs natürlich lesbar. Die Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
