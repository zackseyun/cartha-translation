base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/020.yaml
  text: How bitter was that day—and yet not bitter—when the bitter Greek tyrant[a], after kindling fire in the cruel cauldrons and, in boiling rage, bringing the seven boys to the catapult and again to his tortures[b],
translation:
  language: de
  text: Wie bitter war jener Tag – und doch nicht bitter[b] –, als der bittere Tyrann der Griechen in den grausamen Kesseln Feuer entfachte und in siedender Wut die sieben jungen Männer zur Wurfmaschine[a] und dann wieder zu seinen Foltern führte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Streckbank“ beziehungsweise „zu einem Foltergerät“. Das griechische Wort bezeichnet gewöhnlich ein Katapult oder eine ähnliche Wurfmaschine; hier dürfte ein Gerät zur Folter gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Satz wird im folgenden Vers fortgeführt. „Und doch nicht bitter“ bewahrt das Paradox des griechischen Textes: Der Tag war bitter wegen des Leidens, zugleich aber nicht bitter angesichts der bewiesenen Treue und ehrenvollen Standhaftigkeit.'
    reason: literary_and_contextual_clarification
lexical_decisions:
- source_word: πικρᾶς … πικρᾶς … πικρὸς
  choice: bitter … nicht bitter … erbitterte
  rationale: Die Wiederholung des griechischen πικρ- wird weitgehend bewahrt. Bei der Bezeichnung des Tyrannen gibt „erbittert“ die übertragene Bedeutung natürlicher wieder als „bitter“, ohne das Wortspiel ganz aufzugeben.
- source_word: ὁ πικρὸς Ἑλλήνων τύραννος
  choice: der erbitterte Tyrann der Griechen
  rationale: Der Genitiv Ἑλλήνων bleibt als „der Griechen“ erkennbar; die Formulierung bezeichnet den Tyrannen, ohne ihn über den griechischen Wortlaut hinaus eindeutig ethnisch festzulegen.
- source_word: πῦρ φλέξας λέβησι ὠμοῖς
  choice: in den grausamen Kesseln Feuer entfachte
  rationale: λέβητες sind große Kessel; ὠμός bezeichnet hier im übertragenen Sinn deren grausame Verwendung. Ein Possessivpronomen wird nicht ergänzt, da im griechischen Text keines steht.
- source_word: ζέουσιν θυμοῖς
  choice: in siedender Wut
  rationale: Die Wiedergabe bewahrt das Bild des Siedens und seinen bewussten Anklang an die erhitzten Kessel.
- source_word: ἐπὶ τὸν καταπέλτην
  choice: zur Wurfmaschine
  rationale: καταπέλτης bezeichnet gewöhnlich eine Katapult- oder Wurfmaschine. Im Folterkontext kann ein entsprechendes Streck- oder Foltergerät gemeint sein; diese Unsicherheit wird in der Fußnote offengelegt.
- source_word: τοὺς ἑπτὰ παῖδας
  choice: die sieben jungen Männer
  rationale: παῖδες kann Kinder, Söhne, Jungen oder junge Männer bezeichnen. Der Kontext handelt von den sieben Brüdern; „junge Männer“ ist im Deutschen würdig und vermeidet sowohl eine unbelegte Alterspräzisierung als auch die explizitere Verwandtschaftsbezeichnung „Söhne“.
- source_word: τὰς βασάνους αὐτοῦ
  choice: seinen Foltern
  rationale: Der Plural βάσανοι bezeichnet hier Folterungen beziehungsweise Folterqualen; „seinen“ gibt αὐτοῦ und die Zuordnung zum Tyrannen wieder.
theological_decisions:
- issue: Paradox καὶ οὐ πικρᾶς
  choice: und doch nicht bitter
  alternative: und nicht bitter
  rationale: „Doch“ macht den im Griechischen knapp nebeneinandergestellten Gegensatz idiomatisch sichtbar, ohne zu erklären, in welchem Sinn der Tag trotz des Leidens nicht bitter war.
- issue: Bedeutung von καταπέλτης im Martyriumskontext
  choice: Wurfmaschine mit erklärender Fußnote
  alternative: Streckbank / Foltergerät
  rationale: Die lexikalische Grundbedeutung bleibt im Haupttext erhalten; die wahrscheinliche kontextuelle Verwendung als Foltergerät wird als Möglichkeit, nicht als Gewissheit, angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Satzschluss des griechischen Verses bleibt durch das abschließende Komma sichtbar. Gedankenstriche heben das rhetorische Paradox hervor; die Bildsprache von Kesseln und siedender Wut bleibt erhalten.
