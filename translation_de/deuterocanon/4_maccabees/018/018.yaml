base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/018.yaml
  text: For she did not forget the song that Moses taught[a], which teaches, ‘I kill, and I make alive.’
translation:
  language: de
  text: 'Denn sie vergaß das Lied nicht, das Mose gelehrt hatte[a] und das lehrt: »Ich werde töten und lebendig machen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Diese Zeile nimmt das Lied des Mose in 5. Mose 32,39 auf. Dort wird die Aussage teilweise mit »Ich töte und mache lebendig« wiedergegeben; hier stehen im Griechischen Zukunftsformen: »Ich werde töten und lebendig machen.«'
    reason: cross_reference
lexical_decisions:
- source_word: ᾠδήν
  choice: Lied
  rationale: „Lied“ ist die natürliche und sachlich passende deutsche Wiedergabe; „Ode“ wäre unnötig literarisch, „Loblied“ würde eine nicht ausdrücklich genannte Bestimmung hinzufügen.
- source_word: ἐδίδαξεν
  choice: gelehrt hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass Moses Lehren dem Erinnern vorausging, ohne den Inhalt zu erweitern.
- source_word: οὐκ ἐπελάθετο
  choice: vergaß … nicht
  rationale: Dies gibt die Grundbedeutung direkt wieder und bewahrt das Motiv des Erinnerns.
- source_word: τὴν διδάσκουσαν
  choice: und das lehrt
  rationale: Das Partizip bezieht sich auf das Lied und schreibt ihm eine lehrende Funktion zu. Die koordinierte Relativkonstruktion ist im Deutschen klar und flüssig.
- source_word: Ἐγὼ ἀποκτενῶ, καὶ ζῆν ποιήσω
  choice: Ich werde töten und lebendig machen
  rationale: Die Zukunftsformen des griechischen Textes werden ausdrücklich bewahrt. „Lebendig machen“ gibt die kausative Wendung ζῆν ποιήσω knapp und verständlich wieder.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ kennzeichnet den Satz passend als Begründung oder Erläuterung des vorausgehenden Gedankens.
theological_decisions:
- issue: Wiedergabe der göttlichen Selbstaussage aus dem Lied des Mose
  choice: Ich werde töten und lebendig machen
  alternative: Ich töte und mache lebendig
  rationale: Der unmittelbare griechische Wortlaut in diesem Vers verwendet Zukunftsformen. Die Übersetzung folgt daher diesem Text, statt ihn an eine geläufige präsentische Wiedergabe von Deuteronomium 32,39 anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang, vermeidet aber eine im Deutschen schwerfällige substantivierte Partizipialkonstruktion. Das unübersetzte μέν deutet vermutlich einen anschließenden Kontrast an; eine isolierte Wiedergabe mit „zwar“ wäre in diesem Vers jedoch unnatürlich und vom Folgesatz abhängig.
