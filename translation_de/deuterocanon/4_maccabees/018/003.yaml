base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/003.yaml
  text: For this reason[a], because of their godliness, when those men gave up their bodies to those sufferings, they were not only admired by men, but were also counted worthy of a divine share.
translation:
  language: de
  text: Deshalb wurden jene, die wegen ihrer Gottesfurcht ihre Körper diesen Leiden preisgaben, nicht nur von den Menschen bewundert, sondern auch eines göttlichen Anteils[a] für würdig erachtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Anteils von Gott“ oder „eines Anteils am Göttlichen“. Die knappe griechische Wendung kann sowohl einen von Gott zugeteilten Anteil als auch die Teilhabe am Göttlichen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Dafür
  rationale: Die Wendung nimmt folgernd und begründend auf den vorausgehenden Zusammenhang Bezug. „Dafür“ ist im Deutschen knapp und natürlich.
- source_word: διὰ τὴν εὐσέβειαν
  choice: um ihrer Gottesfurcht willen
  rationale: εὐσέβεια bezeichnet hier ehrfürchtige Hingabe an Gott und sein Gesetz. „Gottesfurcht“ bewahrt den ausdrücklich religiösen Sinn und passt zum würdigen Register.
- source_word: προέμενοι τὰ σώματα
  choice: ihre Körper … preisgaben
  rationale: Das Partizip bezeichnet das Dahingeben oder Ausliefern. „Preisgaben“ trifft den Märtyrerkontext, ohne ausdrücklich kultische Opfersprache einzuführen.
- source_word: τοῖς πόνοις ἐκείνοις
  choice: diesen Leiden
  rationale: πόνοι bezeichnet Schmerzen oder Leiden; das Demonstrativ verweist auf die zuvor geschilderten Qualen. „Diesen Leiden“ ist idiomatisch und wahrt den Rückbezug.
- source_word: ὑπὸ τῶν ἀνθρώπων ἐθαυμάσθησαν
  choice: von den Menschen bewundert
  rationale: Die Formulierung gibt das Passiv sowie den Kontrast zwischen menschlicher Bewunderung und göttlicher Anerkennung klar wieder.
- source_word: θείας μερίδος
  choice: eines göttlichen Anteils
  rationale: Die knappe griechische Wendung kann einen von Gott zugeteilten Anteil oder Anteil am Göttlichen bezeichnen. Die wörtlich offene Formulierung legt keine dieser Deutungen fest.
- source_word: κατηξιώθησαν
  choice: für würdig erachtet
  rationale: Das Verb bezeichnet die Anerkennung oder Beurteilung als würdig. Die deutsche Wendung erhält den gehobenen, evaluativen Sinn.
theological_decisions:
- issue: Bedeutung von θείας μερίδος
  choice: eines göttlichen Anteils
  alternative: eines Anteils von Gott; eines Anteils am Göttlichen
  rationale: Der Genitiv kann die göttliche Herkunft beziehungsweise Zuteilung oder eine Teilhabe am Göttlichen ausdrücken. Der Haupttext erhält diese theologische Offenheit, die Fußnote nennt die möglichen Lesarten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt die Steigerung „nicht nur … sondern auch“. „Gottesfurcht“ wird im positiven biblischen Sinn ehrfürchtiger Gottesverehrung gebraucht.
