  text: For I remained a pure virgin[a], and I did not go beyond my father's house; rather[b], I guarded the rib that had been built.
translation:
  language: de
  text: Denn ich war eine reine Jungfrau und ging nicht über mein Vaterhaus hinaus[a]; und ich hütete die erbaute Rippe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung kann auch bedeuten: „Ich überschritt die Grenzen meines Vaterhauses nicht.“ Sie kann sowohl das tatsächliche Verbleiben im väterlichen Haushalt als auch sittliche Zurückhaltung ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die erbaute Seite“. Die Wendung spielt wahrscheinlich auf die Erschaffung der Frau aus Adams Seite beziehungsweise Rippe an und dient hier als zurückhaltendes Bild für bewahrte Keuschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθην
  choice: ich war
  rationale: Das Verb bedeutet wörtlich „ich wurde/entstand“, kann hier aber den erreichten beziehungsweise bewahrten Lebensstand bezeichnen. „Ich war“ ist im Deutschen natürlich und behauptet keinen erst später eingetretenen Wechsel zur Jungfräulichkeit.
- source_word: παρθένος ἁγνή
  choice: eine reine Jungfrau
  rationale: παρθένος bezeichnet eine Jungfrau; ἁγνή hebt hier vor allem sexuelle und sittliche Reinheit hervor. Die Wiedergabe erhält beide Begriffe, ohne kultische Heiligkeit einzutragen.
- source_word: οὐχ ὑπερέβην πατρικὸν οἶκον
  choice: ging nicht über mein Vaterhaus hinaus
  rationale: ὑπερβαίνω bedeutet „überschreiten, darüber hinausgehen“. Die Formulierung bewahrt sowohl den räumlichen Sinn des Verbleibens im väterlichen Haushalt als auch den möglichen sittlichen Sinn, dessen Grenzen nicht zu übertreten.
- source_word: ἐφύλασσον
  choice: hütete
  rationale: Der Imperfekt bezeichnet ein fortdauerndes Bewahren. „Hütete“ passt zur bildhaften Aussage über die bewahrte Keuschheit und klingt im Deutschen würdig, ohne die Metapher aufzulösen.
- source_word: τὴν ᾠκοδομημένην πλευράν
  choice: die erbaute Rippe
  rationale: πλευρά kann „Seite“ oder „Rippe“ bedeuten. Zusammen mit „erbaut“ nimmt die ungewöhnliche Wendung wahrscheinlich die Erschaffung der Frau aus Adams Rippe beziehungsweise Seite in Genesis 2 auf. Die knappe, fremdartige Metapher bleibt bewusst erhalten.
theological_decisions:
- issue: Deutung der Anspielung auf Genesis in „die erbaute Rippe“
  choice: Die Metapher bleibt im Haupttext stehen und wird nicht als „ich bewahrte meine Keuschheit“ paraphrasiert.
  alternative: „die erbaute Seite“ oder eine ausdrückliche Umschreibung als Bewahrung der Keuschheit
  rationale: Der griechische Text formuliert absichtlich bildhaft und spielt wahrscheinlich auf Genesis 2 an. Eine explizite sexuelle Umschreibung würde mehr festlegen, als der Wortlaut selbst aussagt.
- issue: Bedeutung des Nicht-Hinausgehens über das Vaterhaus
  choice: Eine Formulierung, die räumliches Hinausgehen und sittliches Überschreiten zugleich anklingen lässt.
  alternative: „Ich verließ mein Vaterhaus nicht“ oder „ich übertrat die Regeln meines Vaterhauses nicht“
  rationale: Der griechische Ausdruck kann sowohl den tatsächlichen Verbleib im väterlichen Haushalt als auch sittliche Selbstbeschränkung bezeichnen. Keine der beiden Nuancen soll allein zum Textsinn erklärt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vaterhaus“ hält den Bezug auf den väterlichen Haushalt knapp und idiomatisch fest. Die auffällige Formulierung „erbaute Rippe“ bleibt wegen der Genesis-Anspielung bewusst ungeglättet; die Fußnote erläutert sie, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
