  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: Ihm
  rationale: Das Dativpronomen nimmt den zuvor genannten Bezug auf. Im Deutschen ist „Ihm“ in dieser abschließenden Doxologie natürlicher als die formal mögliche Relativkonstruktion „dem“ oder „dem ... sei“.
- source_word: ἡ δόξα
  choice: die Herrlichkeit
  rationale: „Herrlichkeit“ ist die übliche, würdige Wiedergabe von δόξα in einer Doxologie und bewahrt den gottesdienstlichen Klang besser als „Ehre“.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: in alle Ewigkeit
  rationale: Die feste deutsche Wendung gibt die verstärkende griechische Zeitformel natürlich als unbegrenzte Dauer wieder.
- source_word: ἀμήν
  choice: Amen
  rationale: Die geläufige liturgische Transliteration bewahrt die feierliche Schlussformel.
theological_decisions:
- issue: Verblose doxologische Aussage
  choice: Ihm sei die Herrlichkeit
  alternative: Ihm gehört die Herrlichkeit
  rationale: Im Griechischen fehlt ein ausdrückliches Verb. Der deutsche Konjunktiv „sei“ bewahrt den doxologischen Zuspruch, ohne die Aussage durch „gehört“ stärker als Besitzbehauptung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst liturgischem Klang. Die knappe Schlussdoxologie bleibt ohne erläuternde Zusätze.
