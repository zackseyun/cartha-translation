base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/008.yaml
  text: No destroyer in the desolate wilderness ruined me in the open field[a], nor did the serpent, destroyer through deceit, violate the purity of my virginity; but I remained with my husband through the time of my prime.
translation:
  language: de
  text: Kein Verwüster der Einöde, kein Verderber auf freiem Feld, hat mich zugrunde gerichtet; auch hat die Schlange, ein Verwüster durch Täuschung, die Reinheit meiner Jungfräulichkeit nicht verletzt. Doch blieb ich in der Blüte meines Lebens bei meinem Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei einem Mann“. Das griechische Wort kann sowohl „Mann“ als auch „Ehemann“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέφθειρέν
  choice: hat … zugrunde gerichtet
  rationale: Das Verb kann Zerstörung wie auch sittliche Verderbnis bezeichnen. Die Formulierung wahrt diese Spannweite im Zusammenhang der bedrohten sexuellen Unversehrtheit.
- source_word: λυμεὼν τῆς ἐρημίας φθορεὺς ἐν πεδίῳ
  choice: Verwüster der Einöde, … Verderber auf dem Feld
  rationale: Die beiden nahezu gleichbedeutenden Täterbezeichnungen und ihre Ortsangaben werden parallel wiedergegeben. So bleibt die verdichtete, wiederholungsreiche Bildsprache des Griechischen sichtbar.
- source_word: ἐλυμήνατό
  choice: hat … verletzt
  rationale: Im Zusammenhang mit der Reinheit der Jungfräulichkeit bezeichnet das Verb einen Angriff auf die sexuelle Unversehrtheit. „Verletzt“ ist deutlich, ohne eine konkrete Form des Übergriffs hinzuzufügen.
- source_word: τὰ ἁγνὰ τῆς παρθενίας
  choice: die Reinheit meiner Jungfräulichkeit
  rationale: Die substantivierte Mehrzahl τὰ ἁγνά bezeichnet das Reine oder Keusche; die deutsche Abstraktform gibt den Sinn natürlich wieder.
- source_word: λυμεὼν ἀπάτης ὄφις
  choice: die Schlange, die durch Täuschung Verderben bringt
  rationale: Die schwerfällige Häufung von „Verwüster/Verderber“ wird im Deutschen verbal gefasst. „Durch Täuschung“ lässt den Genitiv ἀπάτης als Mittel oder Kennzeichen erkennen, ohne die Anspielung auszudeuten.
- source_word: ὄφις
  choice: die Schlange
  rationale: „Schlange“ bewahrt sowohl die konkrete Bildsprache als auch die mögliche Anspielung auf die täuschende Schlange.
- source_word: χρόνον ἀκμῆς
  choice: während der Blütezeit meines Lebens
  rationale: ἀκμή bezeichnet den Höhepunkt beziehungsweise die volle Reife des Lebens. „Blütezeit“ ist idiomatisch und behält das Bild der Lebens- und Reifekraft.
- source_word: σὺν ἀνδρί
  choice: bei meinem Mann
  rationale: ἀνήρ kann „Mann“ oder „Ehemann“ bedeuten. Der Zusammenhang von Jungfräulichkeit und ehelichem Leben spricht für „mein Mann“, während die lexikalische Mehrdeutigkeit in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Mögliche Anspielung auf die täuschende Schlange
  choice: „die Schlange, die durch Täuschung Verderben bringt“ bleibt ohne erklärende Identifizierung im Haupttext
  alternative: Die Schlange ausdrücklich mit der Schlange aus Eden oder mit Satan gleichsetzen
  rationale: ὄφις und ἀπάτη rufen eine solche Anspielung hervor, doch der Vers selbst benennt weder Eden noch Satan. Die Übersetzung bewahrt die Resonanz, ohne sie lehrhaft festzulegen.
- issue: Verhältnis von Jungfräulichkeit und Ehe
  choice: σὺν ἀνδρί wird im Haupttext ehelich als „bei meinem Mann“ verstanden
  alternative: „bei einem Mann“
  rationale: Der autobiografische Zusammenhang legt den Ehemann nahe; da der griechische Ausdruck grammatisch auch allgemeiner verstanden werden kann, wird die Alternative in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die auffällige Häufung von Ausdrücken des Verwüstens und Verderbens bleibt weitgehend erhalten; zugleich werden die griechischen Genitivverbindungen so gefasst, dass der Satz für heutige Leser verständlich bleibt.
