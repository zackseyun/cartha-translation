lexical_decisions:
- source_word: τὰς τῶν ὀμμάτων κόρας
  choice: ihre Pupillen
  rationale: κόραι bezeichnet im anatomischen Zusammenhang die Pupillen. Die deutsche Wiedergabe ist präzise und vermeidet sowohl die unzutreffende Redewendung „Augäpfel“ als auch die Erweiterung auf die ganzen Augen.
- source_word: ἐπήρωσεν
  choice: verstümmelte
  rationale: Das Verb bezeichnet Verstümmeln, Schädigen oder Unbrauchbarmachen. „Verstümmelte“ wahrt die konkrete Gewalttätigkeit, ohne die Art der Verletzung genauer festzulegen, als es der griechische Text tut.
- source_word: γλώσσας ἐξέτεμεν
  choice: schnitt ihnen die Zungen heraus
  rationale: ἐκτέμνω bedeutet „herausschneiden“. Die Formulierung ist im Deutschen idiomatisch, anschaulich und entspricht der körperlichen Gewalt des Ausdrucks.
- source_word: βασάνοις ποικίλαις
  choice: durch verschiedenartige Folterungen
  rationale: Der Dativ bezeichnet hier das Mittel, durch das sie getötet wurden. „Verschiedenartige Folterungen“ gibt sowohl βάσανοι als auch ποικίλαις wieder, ohne Folterinstrumente in den Text einzutragen.
- source_word: ἀπέκτεινεν
  choice: tötete sie
  rationale: Das Verb ist der gewöhnliche Ausdruck für „töten“. Das im Griechischen nicht eigens wiederholte Objekt wird aus dem Zusammenhang im Deutschen natürlich mit „sie“ ergänzt.
