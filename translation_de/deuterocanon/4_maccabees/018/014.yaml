  yaml_path: translation/deuterocanon/4_maccabees/018/014.yaml
  text: And he kept reminding you of the Scripture of Isaiah that says[a], “Even if you pass through fire, a flame will not burn you.”
translation:
  language: de
  text: 'Und er erinnerte euch immer wieder an das Schriftwort des Jesaja, in dem es heißt[a]: »Selbst wenn du durch Feuer gehst, wird eine Flamme dich nicht verbrennen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Zitat erinnert an Jesaja 43,2. Hier folgt 4 Makkabäer seiner eigenen griechischen Formulierung: „Eine Flamme wird dich nicht verbrennen.“'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπεμίμνησκεν
  choice: er erinnerte euch immer wieder
  rationale: Der Imperfekt bezeichnet hier eine fortdauernde oder wiederholte Handlung; „immer wieder“ gibt diese iterative Nuance in natürlichem Deutsch wieder.
- source_word: τὴν Ἡσαΐου γραφὴν
  choice: an das Schriftwort Jesajas
  rationale: γραφή bezeichnet in diesem jüdischen Kontext die Heilige Schrift beziehungsweise eine konkrete Schriftstelle. „Schriftwort Jesajas“ ist würdig und verständlich und lässt den Bezug auf eine zitierte Passage erkennen.
- source_word: τὴν λέγουσαν
  choice: in dem es heißt
  rationale: Die attributive Partizipialkonstruktion wird als geläufige deutsche Einleitungsformel für ein Schriftzitat wiedergegeben.
- source_word: Κἂν
  choice: Selbst wenn
  rationale: Die Krasis aus καὶ ἐάν leitet hier eine Bedingung mit konzessivem Nachdruck ein; „selbst wenn“ bewahrt diese Nuance.
- source_word: διὰ πυρὸς διέλθῃς
  choice: du durch Feuer gehst
  rationale: Die Formulierung gibt die Bewegung durch das Feuer direkt wieder; der im Griechischen fehlende Artikel wird auch im Deutschen nicht ergänzt.
- source_word: φλὸξ
  choice: eine Flamme
  rationale: Das Substantiv im Singular ist hier indefinit zu verstehen. „Eine Flamme“ hält das Bild vom zuvor genannten Feuer sprachlich auseinander.
- source_word: οὐ κατακαύσει σε
  choice: wird eine Flamme dich nicht verbrennen
  rationale: κατακαίω kann auch „niederbrennen“ oder „verzehren“ bedeuten; bei einer Person und in diesem Zusammenhang ist „verbrennen“ klar, natürlich und hinreichend quellennah.
theological_decisions:
- issue: Wiedergabe des Jesajazitats im Verhältnis zu geläufigen Bibelfassungen
  choice: Das Zitat wird nach dem griechischen Wortlaut von 4 Makkabäer wiedergegeben.
  alternative: An eine bekannte deutsche Fassung von Jesaja 43,2 angleichen, etwa „die Flamme wird dich nicht versengen“.
  rationale: Der Text von 4 Makkabäer ist die unmittelbare Übersetzungsgrundlage. Der Jesajabezug wird kenntlich gemacht, aber die eigenständige griechische Formulierung nicht harmonisiert.
- issue: Aspekt des Verbs ὑπεμίμνησκεν
  choice: Die wiederholte beziehungsweise fortdauernde Handlung wird mit „immer wieder“ ausgedrückt.
  alternative: Schlicht „er erinnerte euch“.
  rationale: So bleibt die durch den Imperfekt vermittelte narrative Betonung erhalten, ohne dem Text eine zusätzliche Aussage hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schriftwort Jesajas“ wahrt den sakralen Bezug, ohne altertümlich zu wirken; das Zitat bleibt schlicht und bildhaft.
