  text: knowing that godly reason is master of the passions[b][a], and not only of inward sufferings but also of outward pains.
translation:
  language: de
  text: Denn sie wussten, dass die gottesfürchtige Vernunft[a] Herrin über die Leidenschaften[b] ist, und zwar nicht nur über die inneren, sondern auch über die von außen kommenden Schmerzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die fromme Vernunft“. Der griechische Ausdruck ist in 4 Makkabäer ein Schlüsselbegriff für eine Vernunft, die von Ehrfurcht vor Gott geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: Das Griechische unterscheidet zwischen den inneren πάθη („Leidenschaften“ oder „Regungen“) und den äußeren πόνοι („Schmerzen“ oder „Leiden“).
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: Denn sie wussten
  rationale: Das Partizip bezeichnet hier den Grund für das zuvor geschilderte Verhalten. Die finite, kausale Wiedergabe ist im Deutschen natürlich und lässt den gedanklichen Anschluss erkennen.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: πάθη ist in 4 Makkabäer ein philosophischer Schlüsselbegriff für innere Regungen und Triebe, die von der Vernunft beherrscht werden. „Leidenschaften“ wahrt zudem die Abgrenzung von πόνοι, den äußeren Schmerzen.
- source_word: δεσπότης
  choice: Herrin
  rationale: Das Substantiv bezeichnet eine Instanz mit beherrschender Gewalt. Wegen des grammatischen Geschlechts von „Vernunft“ ist „Herrin“ die natürliche deutsche Personifikation; sie vermeidet hier die mögliche Gottesbezeichnung „Herr“.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  rationale: Die Wendung verbindet vernünftiges Urteilen mit Ehrfurcht und pflichtgemäßer Haltung gegenüber Gott. „Gottesfürchtige Vernunft“ ist verständlich und erhält beide Seiten des griechischen Ausdrucks.
- source_word: τῶν ἔνδοθεν
  choice: über die inneren
  rationale: Der substantivierte Ausdruck greift elliptisch die zuvor genannten Leidenschaften auf. Die knappe deutsche Form bewahrt diese Ellipse und den Gegensatz zwischen innen und außen.
- source_word: τῶν ἔξωθεν πόνων
  choice: über die von außen kommenden Schmerzen
  rationale: πόνοι meint schmerzhafte Mühen oder Leiden. Die Formulierung macht den Gegensatz zu den inneren Leidenschaften deutlich, ohne den körperlichen oder äußeren Charakter unnötig einzuengen.
theological_decisions:
- issue: Wiedergabe des programmatischen Ausdrucks ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  alternative: die fromme Vernunft
  rationale: Der Ausdruck bezeichnet keine bloß weltliche Rationalität, sondern eine Vernunft, die durch Ehrfurcht vor Gott geprägt ist. „Gottesfürchtig“ hält diese religiöse Dimension ausdrücklich fest, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Verhältnis von inneren Leidenschaften und äußeren Schmerzen
  choice: Die Vernunft ist Herrin sowohl über die inneren Leidenschaften als auch über die von außen kommenden Schmerzen.
  alternative: Die Vernunft beherrscht innere und äußere Leiden.
  rationale: Die gewählte Fassung erhält die begriffliche Spannung zwischen πάθη und πόνοι, statt beide mit demselben deutschen Wort wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Personifikation „Herrin“ folgt dem deutschen Genus von „Vernunft“. Die griechische Ellipse bei „den inneren“ bleibt erhalten, ist durch den unmittelbaren Bezug auf „Leidenschaften“ jedoch verständlich.
