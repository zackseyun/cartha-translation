base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/015.yaml
  text: David sang to us[a], the hymn-writer, saying[b], “Many are the afflictions of the righteous.”
translation:
  language: de
  text: 'David, der Liederdichter, sang uns vor[a]: »Zahlreich sind die Bedrängnisse der Gerechten.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: »Der Psalmist David sang uns vor: …«'
    reason: lexical_alternative
  - marker: b
    text: Das Zitat nimmt Psalm 33,20 LXX auf (Psalm 34,20 nach der in vielen deutschen Bibeln üblichen Zählung).
    reason: cross_reference
lexical_decisions:
- source_word: τὸν ὑμνογράφον
  choice: der Liederdichter
  rationale: Das Wort bezeichnet einen Verfasser oder Dichter von Hymnen beziehungsweise geistlichen Liedern und steht hier als Bezeichnung Davids. »Liederdichter« bewahrt das griechische Bild unmittelbarer als die traditionelle Wiedergabe »Psalmist«.
- source_word: ἐμελῴδει
  choice: sang … vor
  rationale: Das Verb bezeichnet melodisches Singen oder Vortragen. Zusammen mit ἡμῖν gibt »sang uns vor« die Handlung und die Ausrichtung an die Zuhörenden natürlich wieder.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet hier diejenigen, denen David vorsang; im Deutschen steht das Pronomen daher als Dativobjekt bei »vorsingen«.
- source_word: Δαυεὶδ
  choice: David
  rationale: Übliche deutsche Form des Eigennamens.
- source_word: Πολλαὶ
  choice: Zahlreich sind
  rationale: Die vorangestellte prädikative Form wird in würdigem, schriftgemäßem Deutsch mit »Zahlreich sind« wiedergegeben.
- source_word: αἱ θλίψεις
  choice: die Bedrängnisse
  rationale: θλίψεις bezeichnet Druck, Not und bedrängende Leiden. »Bedrängnisse« wahrt den gehobenen biblischen Ton, ohne die Bedeutung auf bloße innere Not zu verengen.
- source_word: τῶν δικαίων
  choice: der Gerechten
  rationale: Der substantivierte Ausdruck bezeichnet gerechte Menschen und lässt sich knapp und schriftgemäß mit »der Gerechten« wiedergeben.
theological_decisions:
- issue: Bezug von ὑμνογράφος auf David
  choice: »der Liederdichter« wird als Apposition zu David verstanden.
  alternative: 'Idiomaticher: »der Psalmist David«'
  rationale: Die komprimierte griechische Wortstellung kennzeichnet David selbst als Verfasser geistlicher Lieder. Die Übersetzung erhält diese Aussage, ohne den Titel stillschweigend auf »Psalmist« festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Apposition macht eindeutig, dass David der Liederdichter ist. »Sang uns vor« bildet ἐμελῴδει ἡμῖν natürlich ab; die Zitatfassung behält einen gehobenen schriftsprachlichen Klang.
