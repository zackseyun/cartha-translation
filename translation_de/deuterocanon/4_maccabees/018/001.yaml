base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/001.yaml
  text: O children[a], descendants of the seed of Abraham, Israelites, obey this law[b], and be godly in every way.
translation:
  language: de
  text: 'O ihr Kinder[a], Nachkommen aus Abrahams Linie, ihr Israeliten: Gehorcht diesem Gesetz[b] und lebt in jeder Hinsicht gottesfürchtig.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Anrede ist ungewöhnlich gehäuft und nachdrücklich: Sie bezeichnet die Angeredeten als „Kinder“ und als „Nachkommen der abrahamitischen Nachkommenschaft“; σπέρματα („Nachkommenschaft“, wörtlich auch „Samen“) steht im Plural.'
    reason: lexical_alternative
  - marker: b
    text: Im Zusammenhang ist das überlieferte Gesetz Israels, die Tora, gemeint. „Gehorcht“ kann auch „folgt“ oder „hört auf“ heißen.
    reason: semantic_clarification
  - marker: c
    text: 'Oder: „handelt in jeder Hinsicht fromm“ beziehungsweise „lebt in jeder Weise ehrfürchtig vor Gott“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: O
  rationale: Bewahrt den feierlichen Ausruf und den gehobenen Ton der direkten Anrede.
- source_word: τῶν Ἀβραμιαίων σπερμάτων ἀπόγονοι
  choice: Nachkommen aus Abrahams Geschlecht
  rationale: Gibt die betonte Berufung auf die Abstammung von Abraham in verständlichem, würdigem Deutsch wieder. Die ungewöhnlich gehäufte griechische Abstammungssprache wird in einer Fußnote kenntlich gemacht.
- source_word: παῖδες
  choice: Kinder
  rationale: Entspricht der familiären Anrede und legt das Geschlecht der Angeredeten nicht unnötig fest.
- source_word: Ἰσραηλεῖται
  choice: ihr Israeliten
  rationale: Die Wiederholung von „ihr“ macht die appositionelle Anrede im Deutschen klar und bewahrt ihren rhetorischen Nachdruck.
- source_word: πείθεσθε
  choice: Gehorcht
  rationale: Mit dem Gesetz im Dativ bezeichnet das Verb hier nicht nur innere Überzeugung, sondern tätige Befolgung.
- source_word: τῷ νόμῳ τούτῳ
  choice: diesem Gesetz
  rationale: Gibt den bestimmten, im Kontext auf Israels überliefertes Gesetz bezogenen Ausdruck wieder, ohne die Deutung im Haupttext auszuschreiben.
- source_word: πάντα τρόπον
  choice: in jeder Hinsicht
  rationale: Natürliches deutsches Adverbial, das die umfassende Geltung für die Lebensführung ausdrückt.
- source_word: εὐσεβεῖτε
  choice: lebt … gottesfürchtig
  rationale: Bezeichnet eine ehrfürchtige, auf Gott ausgerichtete Lebensführung; die verbale Formulierung klingt im heutigen Deutsch natürlicher als „seid fromm“.
theological_decisions:
- issue: Bezug von „diesem Gesetz“
  choice: Israels überliefertes Gesetz, die Tora
  alternative: Gesetz im allgemeinen moralischen Sinn
  rationale: Die ausdrückliche Anrede an die Israeliten und der Zusammenhang des Buches sprechen für das angestammte Bundesgesetz; der Haupttext belässt es dennoch bei der Formulierung des Griechischen.
- issue: Bedeutungsumfang von εὐσεβεῖτε
  choice: eine gottesfürchtige Lebensführung
  alternative: allgemeine Ehrfurcht oder Frömmigkeit
  rationale: Der Kontext richtet die geforderte Ehrfurcht auf Gott, ohne eine konfessionell geprägte Frömmigkeitsform hinzuzufügen.
translation_notes:
  register: Feierlich-rhetorische, aber gegenwärtig verständliche Standardsprache. Das einleitende „O“ und die gestaffelte Anrede bewahren den eindringlichen Ton; der Doppelpunkt gliedert die lange Anrede natürlich von den Aufforderungen.
