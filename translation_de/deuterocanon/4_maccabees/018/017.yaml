  text: He bore witness to Ezekiel[a], who says[b], “Will these dry bones live?”
translation:
  language: de
  text: 'Er berief sich auf Ezechiel[a] als Zeugen[b], der sagt: »Werden diese dürren Gebeine leben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Anspielung auf Ezechiel 37,3 und die Vision vom Tal der dürren Gebeine.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Er bestätigte Ezechiel“ beziehungsweise „er rief Ezechiel zum Zeugen an“. Das griechische Verb hat einen bezeugenden Sinn und lässt sich hier nicht eindeutig mit einem einzigen deutschen Ausdruck wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστοποιεῖτο
  choice: berief sich auf … als Zeugen
  rationale: Die schwierige mediale Form hat hier einen bezeugenden beziehungsweise bestätigenden Sinn. Die gewählte Formulierung macht verständlich, dass Ezechiel als prophetischer Zeuge angeführt wird, ohne den Ausdruck auf eine bloße Bestätigung zu verengen.
- source_word: τὸν Ἰεζεκιὴλ
  choice: Ezechiel
  rationale: Der Name folgt der im Deutschen üblichen biblischen Form.
- source_word: τὸν λέγοντα
  choice: der sagt
  rationale: Das präsentische Partizip führt das prophetische Schriftwort als weiterhin sprechendes Zeugnis ein.
- source_word: Εἰ ζήσεται
  choice: Werden … leben?
  rationale: εἰ leitet hier entsprechend dem Sprachgebrauch der Septuaginta eine indirekt beziehungsweise direkt wiedergegebene Entscheidungsfrage ein. Die deutsche Frageform bewahrt den offenen Ausgang.
- source_word: τὰ ὀστᾶ τὰ ξηρὰ ταῦτα
  choice: diese dürren Gebeine
  rationale: „Dürr“ gibt ξηρά prägnant wieder; „Gebeine“ ist im Deutschen würdevoll und lässt die Anspielung auf Ezechiel 37 deutlich hervortreten.
theological_decisions:
- issue: Anführung von Ezechiels Vision und ihre Auferstehungsdimension
  choice: 'Ezechiel wird als Zeuge angeführt; seine Frage bleibt eine offene Frage: „Werden diese dürren Gebeine leben?“'
  alternative: 'Er bestätigte Ezechiel mit den Worten: „Wenn diese dürren Gebeine leben …“'
  rationale: Der griechische Text greift Ezechiel 37 auf und stützt damit Hoffnung angesichts des Todes. Die Übersetzung macht daraus jedoch keine ausdrückliche dogmatische Aussage, die über die Frageform des Verses hinausgeht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dürre Gebeine“ bewahrt den erkennbaren biblischen Anklang, während der Satzbau unmittelbar verständlich bleibt.
