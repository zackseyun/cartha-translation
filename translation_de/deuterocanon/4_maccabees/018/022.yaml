  text: for which divine justice has pursued[a], and will pursue, the accursed one.
translation:
  language: de
  text: Weshalb die göttliche Gerechtigkeit den Verfluchten[a] verfolgt hat und verfolgen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »den Befleckten« beziehungsweise »den Abscheulichen«; das griechische Wort ist selten und drückt eine starke moralisch-religiöse Verurteilung aus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: Für all das
  rationale: ὑπέρ mit dem Relativpronomen bezeichnet hier den Grund der Vergeltung. »Für all das« gibt den rückbezüglichen und kausalen Sinn knapp und idiomatisch wieder.
- source_word: ἡ θεία δίκη
  choice: die göttliche Gerechtigkeit
  rationale: δίκη kann Gerechtigkeit, Strafe oder Vergeltung bezeichnen. Die gewählte Formulierung bewahrt sowohl den richterlichen als auch den vergeltenden Aspekt, ohne den Sinn auf bloße Strafe oder Rache einzuengen.
- source_word: μετῆλθεν καὶ μετελεύσεται
  choice: hat … verfolgt und wird … auch weiterhin verfolgen
  rationale: Die beiden Formen desselben Verbs stellen vergangenes und zukünftiges göttliches Vorgehen parallel dar. »Verfolgen« erhält diese Wiederholung und den feindlich-strafenden Nachdruck; »auch weiterhin« macht den zeitlichen Zusammenhang im Deutschen natürlich deutlich.
- source_word: τὸν ἀλιόστορα
  choice: den Verfluchten
  rationale: Das seltene, stark abwertende Wort bezeichnet offenbar einen Menschen unter moralisch-religiöser Verurteilung oder Befleckung. »Den Verfluchten« ist verständlich und bewahrt diesen starken Ton; die lexikalische Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe von δίκη im Zusammenhang göttlicher Vergeltung
  choice: die göttliche Gerechtigkeit
  alternative: die göttliche Strafe; die göttliche Vergeltung
  rationale: Der Ausdruck beschreibt wirksames göttliches Gericht, lässt aber offen, ob stärker das Prinzip der Gerechtigkeit oder dessen strafender Vollzug betont ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierte »göttliche Gerechtigkeit« und die Wiederholung von »verfolgen« erhalten den gerichtlichen Nachdruck des griechischen Satzes.
