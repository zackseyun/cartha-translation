  naturalness: Der Entwurf ist gut verständlich und registergerecht. Mit „Weshalb“ wird der anaphorisch-kausale Anschluss des Relativausdrucks natürlicher und ohne die leicht verstärkende Ergänzung „all das“ wiedergegeben.
