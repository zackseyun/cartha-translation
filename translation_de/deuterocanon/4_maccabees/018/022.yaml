    rationale: Der griechische Ausdruck bedeutet „weshalb/wegen dessen, wofür“ und verweist auf einen vorausgehenden Sachverhalt. „Weshalb“ gibt diesen Anschluss idiomatisch wieder, ohne mit „all“ eine zusätzliche Quantifizierung nahezulegen.
