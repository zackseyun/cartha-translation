base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/011.yaml
  text: And he recounted to us Abel[a], who was slain by Cain, and Isaac being offered up as a whole burnt offering, and Joseph in prison.
translation:
  language: de
  text: Er las uns auch von Abel vor, der von Kain getötet wurde, von Isaak, der als Brandopfer dargebracht werden sollte,[a] und von Josef im Gefängnis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische sagt wörtlich etwa: »Isaak, der als Brandopfer dargebracht wurde bzw. wurde dargebracht«. Es verwendet die Sprache des Brandopfers und erinnert damit an Genesis 22; gemeint ist die beabsichtigte Opferung, die nicht vollzogen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν … ἡμῖν
  choice: er las uns … vor
  rationale: ἀναγινώσκω bezeichnet hier am naheliegendsten das Vorlesen bekannter Schriftberichte; der Imperfekt beschreibt die wiederholte oder fortdauernde Handlung.
- source_word: τὸν ἀναιρεθέντα
  choice: der … getötet wurde
  rationale: Das passive Partizip von ἀναιρέω bezeichnet hier Abels gewaltsamen Tod. „Getötet“ ist klar, würdig und im heutigen Deutsch natürlich.
- source_word: ὁλοκαυτούμενον
  choice: der als Ganzopfer dargebracht werden sollte
  rationale: Das Partizip verwendet ausdrücklich Opfersprache. Die Formulierung bewahrt diese Anspielung, ohne fälschlich zu behaupten, Isaak sei tatsächlich verbrannt oder geopfert worden.
- source_word: ἐν φυλακῇ
  choice: im Gefängnis
  rationale: Die schlichte Ortsangabe bezeichnet Josefs Gefangenschaft; „im Gefängnis“ ist die unmittelbar verständliche deutsche Entsprechung.
- source_word: Ἄβελ / Κάϊν / Ἰσαάκ / Ἰωσήφ
  choice: Abel / Kain / Isaak / Josef
  rationale: Die Namen folgen den geläufigen deutschen Bibelnamensformen.
theological_decisions:
- issue: Opfersprache bei Isaak
  choice: der als Ganzopfer dargebracht werden sollte
  alternative: der als Ganzopfer dargebracht wurde
  rationale: Der griechische Text bezeichnet Isaak mit einem passiven Partizip aus der Sprache des Ganzopfers und ruft damit Genesis 22 auf. Da das Opfer nicht vollzogen wurde, gibt „werden sollte“ die beabsichtigte Darbringung wieder, ohne den Ausgang der Erzählung zu verfälschen; die Fußnote legt die wörtlichere Form offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der drei Schriftbeispiele bleibt erhalten; „vorlesen“ macht den im Griechischen bezeichneten Vorgang natürlich verständlich.
