base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/006.yaml
  text: 'Then indeed, having set out from Jerusalem, he encamped against the Persians. And the mother of the seven boys was saying these things also to each one of her children:'
translation:
  language: de
  text: 'Da brach er nun von Jerusalem auf und schlug sein Lager gegen die Perser auf. Die Mutter der sieben Jungen aber sagte außerdem zu jedem einzelnen ihrer Kinder Folgendes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε δὴ
  choice: Da … nun
  rationale: Die Verbindung gibt sowohl den zeitlichen Fortgang als auch die hervorhebende Kraft von δὴ in natürlichem Deutsch wieder.
- source_word: ὑπάρας
  choice: brach … auf
  rationale: Das vorzeitige Partizip bezeichnet den Aufbruch von Jerusalem; die deutsche Verbfolge gibt die zeitliche Abfolge idiomatisch wieder.
- source_word: ἐστρατοπέδευσεν ἐπὶ Πέρσας
  choice: schlug sein Lager gegen die Perser auf
  rationale: Die Formulierung bewahrt den militärischen Sinn des Verbs und die feindliche Ausrichtung von ἐπί mit Akkusativ.
- source_word: ἡ μήτηρ τῶν ἑπτὰ παίδων
  choice: die Mutter der sieben Jungen
  rationale: παῖδες bezeichnet hier die sieben männlichen Kinder. „Jungen“ erhält den familiären Ton, ohne das im Griechischen nicht verwendete υἱοί mit „Söhne“ einzuebnen.
- source_word: Ἔλεγεν
  choice: sagte
  rationale: Das deutsche Präteritum ist in erzählendem Kontext natürlich; der griechische Imperfekt lässt ein fortdauerndes oder wiederholtes Sprechen erkennen, ohne eindeutig eine Gewohnheit zu bezeichnen.
- source_word: καὶ ταῦτα
  choice: außerdem … Folgendes
  rationale: „Außerdem“ bewahrt den additiven Wert von καί, während „Folgendes“ den vorausweisenden Gebrauch von ταῦτα vor der anschließenden Rede idiomatisch wiedergibt.
- source_word: ἑνὶ ἑκάστῳ
  choice: zu jedem einzelnen
  rationale: Die ausdrücklich distributive Wendung wird vollständig erhalten.
- source_word: τοῖς τέκνοις
  choice: ihrer Kinder
  rationale: τέκνα ist ein relationaler und breiterer Ausdruck als „Söhne“; „Kinder“ erhält zugleich die lexikalische Abwechslung gegenüber παῖδες.
theological_decisions:
- issue: Geschlechtsspezifische Familienbezeichnungen im Zusammenhang der mütterlichen Rede
  choice: παῖδες mit „Jungen“ und τέκνοις mit „Kinder“ wiedergeben
  alternative: Beide Ausdrücke mit „Söhne“ oder beide mit „Kinder“ wiedergeben
  rationale: Die unterschiedlichen griechischen Verwandtschaftsbezeichnungen sollen nicht vereinheitlicht werden. Im Kontext sind die sieben παῖδες männlich, während τέκνα die allgemeinere relationale Bezeichnung für die Kinder der Mutter ist.
- issue: Aspekt von ἔλεγεν
  choice: mit dem erzählenden Präteritum „sagte“ wiedergeben
  alternative: „sagte immer wieder“ oder „pflegte zu sagen“
  rationale: Der Imperfekt kann fortgesetzte oder wiederholte Rede ausdrücken, legt aber keine eindeutig habituelle Lesart fest. Die Alternativen würden diese Deutung stärker festschreiben als der Ausgangstext.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die militärische Färbung des ersten Satzes und die individuelle mütterliche Anrede im zweiten Satz bleiben erhalten.
