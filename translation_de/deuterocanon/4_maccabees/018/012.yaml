  text: And Phinehas the zealot was speaking to us[b][a], and Hananiah and Azariah and Mishael in the fire were teaching you.
translation:
  language: de
  text: Und Pinhas, der Eiferer,[a] sprach zu uns, und euch lehrten Hananja, Asarja und Mischaël, die im Feuer waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pinhas, der Eifrige“. Das griechische Wort hebt seinen beispielhaften Eifer hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die im Feuer“. Die Wendung kennzeichnet die drei Genannten durch ihre Situation im Feuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sprach
  rationale: Das Imperfekt stellt Pinhas anschaulich als einen dar, der durch sein überliefertes Beispiel zu den Angeredeten sprach. Das schlichte „sprach“ ist im Deutschen natürlicher als eine Verlaufsform, ohne den durativen Hintergrund auszuschließen.
- source_word: ζηλωτὴν
  choice: der Eiferer
  rationale: Das substantivische Wort bezeichnet einen Menschen, der durch Eifer gekennzeichnet ist. „Der Eiferer“ wahrt die appositionelle Form und den Bezug auf Pinhas’ beispielhaften Eifer, ohne ihn ausdrücklich einer späteren Partei zuzuordnen.
- source_word: Φινεές
  choice: Pinhas
  rationale: „Pinhas“ ist die im modernen deutschen Bibelgebrauch geläufige Form des Namens.
- source_word: ἐδίδασκεν
  choice: lehrten
  rationale: Das griechische Verb steht formal im Singular, obwohl drei Namen folgen; im natürlichen Deutschen verlangt das zusammengesetzte Subjekt den Plural. Das Imperfekt zeichnet ihre fortwirkende Belehrung durch ihr Beispiel nach.
- source_word: τοὺς ἐν πυρὶ
  choice: die im Feuer waren
  rationale: Der substantivierte Ausdruck kennzeichnet die drei Männer durch ihre Feuerprobe. Ein Relativsatz gibt diese Zuordnung im Deutschen klar und ohne sachliche Ergänzung wieder.
- source_word: Ἀνανίαν καὶ Ἀζαρίαν καὶ Μισαήλ
  choice: Hananja, Asarja und Mischaël
  rationale: Diese Namensformen entsprechen dem üblichen modernen deutschen Bibelgebrauch; die Trema-Schreibung „Mischaël“ macht die Silbentrennung sichtbar.
theological_decisions:
- issue: Rhetorische Funktion der beispielhaften Gestalten
  choice: Pinhas und die drei Männer erscheinen als Lehrer der jeweiligen Adressaten durch ihr in der Schrift bewahrtes Beispiel.
  alternative: Die Imperfekte können lediglich als anschauliche historische Erzählformen verstanden werden, ohne besondere Betonung fortwirkender Beispielkraft.
  rationale: Der Kontext und die Imperfektformen erlauben die rhetorische Vorstellung, dass frühere Glaubenszeugen zu den gegenwärtig Angeredeten „sprachen“ und sie „lehrten“. Die Übersetzung bewahrt diese Bildsprache, ohne eine weitergehende Lehre über das Wirken Verstorbener einzutragen.
- issue: Unterschiedliche Adressaten in ἡμῖν und ὑμᾶς
  choice: Die Unterscheidung zwischen „zu uns“ und „euch“ wird ausdrücklich beibehalten.
  alternative: Beide Pronomen könnten zur Glättung an denselben Adressaten angeglichen werden.
  rationale: Der griechische Text unterscheidet klar die erste Person Plural von der zweiten Person Plural. Diese mögliche rhetorische Spannung darf nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Gegenüberstellung „zu uns“ und „euch“ bleibt entsprechend dem griechischen Text erhalten; die Satzstellung wurde für klare deutsche Zuordnung behutsam angepasst.
