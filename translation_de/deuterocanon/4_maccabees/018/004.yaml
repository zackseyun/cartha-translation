base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/004.yaml
  text: And because of them the nation was at peace[a], and, having renewed good order in the homeland[b], it has besieged the enemies completely.
translation:
  language: de
  text: Und ihretwegen[a] lebte das Volk in Frieden; nachdem es die gute Ordnung in der Heimat erneuert hatte, hat es die Feinde vollständig belagert.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch sie“; die griechische Wendung kann Ursache oder Vermittlung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb ist eine verstärkte Bildung zu „belagern“ und steht im Perfekt. Es kann auch wörtlicher wiedergegeben werden: „hat die Feinde völlig belagert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ αὐτούς
  choice: ihretwegen
  rationale: διά mit dem Akkusativ bezeichnet hier am ehesten den Grund. „Ihretwegen“ gibt diese kausale Bedeutung natürlich wieder, ohne die mögliche instrumentale Nuance auszuschließen.
- source_word: εἰρήνευσεν
  choice: lebte … in Frieden
  rationale: Das Verb kann „Frieden halten“ oder „in Frieden leben“ bedeuten. Die Formulierung beschreibt den Friedenszustand des Volkes, ohne einen förmlichen Friedensschluss vorauszusetzen.
- source_word: τὸ ἔθνος
  choice: das Volk
  rationale: Gemeint ist hier die jüdische Volksgemeinschaft. „Volk“ ist im Deutschen natürlicher als „Nation“ und bewahrt den gemeinschaftlich-politischen Sinn.
- source_word: εὐνομίαν
  choice: die gute Ordnung
  rationale: εὐνομία bezeichnet eine gute, gesetzlich geordnete Verfassung der Verhältnisse. „Gute Ordnung“ hält den Sinn offen und verengt ihn weder auf bloße Gesetzestreue noch auf Regierungstätigkeit.
- source_word: τὴν ἐπὶ τῆς πατρίδος
  choice: in der Heimat
  rationale: Die Wendung lokalisiert die erneuerte Ordnung im angestammten Land. „Heimat“ gibt πατρίς in natürlichem, würdigem Deutsch wieder.
- source_word: ἀνανεωσάμενος
  choice: nachdem es … wiederhergestellt hatte
  rationale: Das Partizip bezeichnet eine dem folgenden militärischen Erfolg vorausgehende oder ihn begleitende Erneuerung. Der deutsche Nebensatz bildet diesen Zusammenhang klar ab.
- source_word: ἐκπεπολιόρκηκε
  choice: vertrieb … vollständig durch Belagerung
  rationale: Das intensive, resultative Verb ist von „belagern“ gebildet und kann das vollständige Bezwingen oder Vertreiben durch eine Belagerung bezeichnen. Die Übersetzung bewahrt sowohl das Belagerungsbild als auch die Ergebnisbedeutung.
- source_word: τοὺς πολεμίους
  choice: die Feinde
  rationale: Die direkte Standardentsprechung passt zum militärischen Zusammenhang.
theological_decisions:
- issue: Ursächliche Bedeutung der Märtyrer für den Frieden des Volkes
  choice: „ihretwegen“ hält ausdrücklich fest, dass der Frieden mit ihnen ursächlich verbunden wird.
  alternative: „durch sie“ wäre eine stärker instrumentale Wiedergabe.
  rationale: Der Vers schreibt ihnen eine ursächliche Bedeutung zu, entfaltet hier aber keine umfassende Lehre darüber, wie ihr Tod die Befreiung bewirkt. Die Übersetzung bewahrt diese Aussage und ihre Spannung, ohne sie dogmatisch auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Semikolon-Satz bewahrt den engen Zusammenhang von Frieden, erneuerter Ordnung und militärischem Erfolg; ungebräuchliche Fach- oder Konfessionssprache wird vermieden.
