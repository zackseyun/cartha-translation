  yaml_path: translation/deuterocanon/4_maccabees/018/009.yaml
  text: But when these sons had reached adulthood[a], their father died. Blessed was that man, for after experiencing the life of having good children[b], he did not suffer the season of childlessness.
translation:
  language: de
  text: Als diese aber erwachsen geworden waren, starb ihr Vater. Glücklich war jener Mann; denn nachdem er das Leben im Kindersegen[a] kennengelernt hatte, erlitt er die schmerzvolle Zeit der Kinderlosigkeit[b] nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet den positiv bewerteten Zustand, Kinder zu haben; dabei kann sowohl an zahlreiche als auch an gute Kinder gedacht sein.
    reason: lexical_alternative
  - marker: b
    text: 'Im Zusammenhang kann dies bedeuten: Er starb, bevor er nach dem Tod seiner Söhne den Schmerz erlitt, ohne Kinder zurückzubleiben.'
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐνηλίκων γενομένων
  choice: als diese … erwachsen waren
  rationale: Der Genitivus absolutus bezeichnet den abgeschlossenen Übergang ins Erwachsenenalter. Die deutsche Nebensatzform gibt den zeitlichen Zusammenhang natürlich wieder; das Demonstrativpronomen bleibt wie im Griechischen ohne ausdrückliche Ergänzung „Söhne“.
- source_word: ἐτελεύτησεν
  choice: starb
  rationale: Das Verb bezeichnet hier eindeutig den Tod. „Starb“ ist klar, würdig und vermeidet einen unnötigen Euphemismus.
- source_word: μακάριος
  choice: glücklich zu preisen
  rationale: μακάριος bezeichnet einen Menschen, dessen Lage als begünstigt und beneidenswert gilt. Die Wendung wahrt den gehobenen Wertungscharakter, ohne eine bestimmte dogmatische Vorstellung von „Seligkeit“ einzutragen.
- source_word: εὐτεκνίας
  choice: mit wohlgeratenen Kindern
  rationale: Das Substantiv bezeichnet nicht bloß das Vorhandensein von Kindern, sondern trägt eine positive Wertung ihrer Zahl oder Beschaffenheit. Im Kontext steht besonders die Vortrefflichkeit der Söhne im Vordergrund.
- source_word: τὸν … βίον ἐπιστήσας
  choice: nachdem er ein Leben … erfahren hatte
  rationale: Die schwierige Wendung beschreibt rückblickend das ihm zuteilgewordene Leben als Vater guter Kinder. „Erfahren hatte“ gibt den vollendeten vorherigen Lebensabschnitt idiomatisch wieder, ohne die griechische Form fälschlich als bloßes Sehen zu deuten.
- source_word: ἀτεκνίας
  choice: Kinderlosigkeit
  rationale: Das Wort bezeichnet den Zustand, keine Kinder zu haben. Im Erzählzusammenhang ist damit wahrscheinlich das Zurückbleiben nach dem Tod der Söhne gemeint, doch diese Folgerung wird nicht in den Haupttext hineingeschrieben.
- source_word: οὐκ ὠδυνήθη
  choice: musste … nicht schmerzlich durchleiden
  rationale: Das Verb bezeichnet das Erleiden von Schmerz oder Qual. Die deutsche Form verbindet diesen Schmerz natürlich mit der folgenden Zeitangabe.
- source_word: καιρόν
  choice: die Zeit
  rationale: καιρός bezeichnet hier einen bestimmten, durch Kinderlosigkeit geprägten Lebensabschnitt. „Zeit“ ist im Deutschen natürlicher als das bildhaftere „Jahreszeit“ oder „Saison“ und bewahrt den qualitativen Zeitbezug.
theological_decisions:
- issue: Grund für die glückliche Lage des Vaters
  choice: Der Haupttext sagt, dass der Vater die schmerzliche Zeit der Kinderlosigkeit nicht mehr erleben musste.
  alternative: Die Aussage könnte abstrakt den Kindersegen der Kinderlosigkeit gegenüberstellen, ohne unmittelbar auf den späteren Tod der Söhne zu verweisen.
  rationale: Der unmittelbare Märtyrerkontext legt nahe, dass der Vater vor seinen Söhnen starb und deshalb ihren Tod und sein anschließendes Zurückbleiben ohne Kinder nicht erlitt. Da ἀτεκνία für sich genommen jedoch allgemein „Kinderlosigkeit“ bedeutet, bleibt die narrative Zuspitzung der Fußnote vorbehalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Glücklich zu preisen“ wahrt den gehobenen Ton von μακάριος; „wohlgeratene Kinder“ gibt die positive Wertung von εὐτεκνία wieder, ohne Fruchtbarkeit oder Kinderzahl unnötig festzulegen. Beide Fußnotenmarker erscheinen im Haupttext.
