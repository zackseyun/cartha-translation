revisions:
- from: Als diese aber erwachsen waren, starb ihr Vater. Glücklich zu preisen war er; denn nachdem er ein Leben mit wohlgeratenen Kindern[a] erfahren hatte, musste er die Zeit der Kinderlosigkeit[b] nicht schmerzlich durchleiden.
  to: Als diese aber erwachsen geworden waren, starb ihr Vater. Glücklich war jener Mann; denn nachdem er das Leben im Kindersegen[a] kennengelernt hatte, erlitt er die schmerzvolle Zeit der Kinderlosigkeit[b] nicht.
  rationale: Die Fassung beseitigt die modale Verschiebung bei „musste … nicht durchleiden“ und vermeidet die zu enge Festlegung von εὐτεκνία auf „wohlgeratene“ Kinder. Die Fußnote zur narrativen Einordnung bleibt bewusst als Möglichkeit formuliert, weil „Kinderlosigkeit“ im Wortlaut nicht selbst den Verlust bereits vorhandener Kinder bezeichnet.
