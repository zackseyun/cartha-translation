  text: But divine justice will also pardon us if[a], under compulsion, we become afraid of the king.
translation:
  language: de
  text: Doch auch die göttliche Gerechtigkeit[a] wird uns verzeihen, weil wir aus Zwang den König gefürchtet haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das göttliche Gericht wird uns ebenfalls vergeben“ beziehungsweise „die göttliche Strafe wird uns verschonen“. Das griechische Wort δίκη kann Gerechtigkeit, Gericht oder Strafe bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγνώσεται
  choice: wird uns verzeihen
  rationale: Das Futur von συγγιγνώσκω bezeichnet hier ein Verzeihen oder nachsichtiges Berücksichtigen der Umstände. „Verzeihen“ passt zum persönlichen Dativ ἡμῖν und zum moralisch-rechtlichen Zusammenhang.
- source_word: ἡ θεία δίκη
  choice: die göttliche Gerechtigkeit
  rationale: δίκη kann Gerechtigkeit, Gericht oder Strafe bedeuten. „Göttliche Gerechtigkeit“ bewahrt die personifizierende Formulierung und legt die Aussage nicht vorschnell auf Strafgericht fest.
- source_word: διʼ ἀνάγκην
  choice: unter Zwang
  rationale: Die Wendung bezeichnet den äußeren Zwang, unter dem die Furcht entsteht. „Unter Zwang“ ist im Deutschen natürlich und wahrt diesen Umstand.
- source_word: τὸν βασιλέα
  choice: vor dem König
  rationale: βασιλεύς bedeutet hier eindeutig „König“; bei „Angst bekommen“ verlangt das Deutsche die Präposition „vor“.
- source_word: φοβηθεῖσιν
  choice: wenn wir … Angst … bekommen
  rationale: Das Aoristpartizip beschreibt das Eintreten von Furcht. Die konditionale Wiedergabe mit „wenn“ macht den im Deutschen erforderlichen Satzbezug verständlich, ohne eine tatsächliche bereits vollzogene Handlung zu behaupten.
theological_decisions:
- issue: Ob δίκη als strafendes Gericht beziehungsweise Strafe oder umfassender als Gerechtigkeit wiederzugeben ist
  choice: die göttliche Gerechtigkeit
  alternative: das göttliche Gericht; die göttliche Strafe
  rationale: Der weitere Ausdruck bewahrt die Spannung, dass die göttliche Gerechtigkeit den Zwang als mildernden Umstand berücksichtigen kann, ohne die Aussage auf eine bestimmte Straftheologie festzulegen.
- issue: Ob das Partizip φοβηθεῖσιν kausal, temporal oder konditional auszulegen ist
  choice: konditional mit „wenn“
  alternative: „weil wir … Angst bekommen haben“; „nachdem wir … Angst bekommen haben“
  rationale: Im Kontext einer vorausblickenden Rechtfertigung gibt die konditionale Form den Sinn natürlich wieder. Die griechische Partizipialkonstruktion lässt den Umstandsbezug jedoch knapper und offener als das Deutsche.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die ungewöhnliche Personifizierung der göttlichen Gerechtigkeit bleibt erhalten; die Mehrdeutigkeit von δίκη wird in der Fußnote ausgewiesen.
