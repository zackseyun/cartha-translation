base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/029.yaml
  text: So when the tyrant stopped urging them to eat defiling food[a], they all together, with one voice, as if from the same soul, said[b],
translation:
  language: de
  text: 'Als nun der Tyrann aufhörte, ihnen zuzureden, Speisen zu essen, die sie verunreinigen würden[a], sagten sie alle zugleich mit einer Stimme, wie aus derselben Seele[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das seltene griechische Verb bezeichnet das Essen von etwas, das religiös verunreinigt. Möglich ist auch: „Unreines essen“ oder „verunreinigende Speisen essen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Bild lautet: „wie aus derselben Seele“ und hebt ihre völlige Einheit im Entschluss hervor.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ὥστε
  choice: Sobald nun
  rationale: ὥστε führt hier die sich aus der vorausgehenden Szene ergebende Handlung ein; zusammen mit ἅμα τῷ wird der unmittelbare zeitliche Anschluss natürlich wiedergegeben.
- source_word: ἅμα τῷ παύσασθαι
  choice: Sobald … aufgehört hatte
  rationale: Die Konstruktion bezeichnet den Zeitpunkt, an dem die folgende gemeinsame Antwort einsetzt. „Sobald“ wahrt die enge zeitliche Verknüpfung in idiomatischem Deutsch.
- source_word: τὸν τύραννον
  choice: der Tyrann
  rationale: Die ausdrücklich abwertende politische Bezeichnung des griechischen Textes wird beibehalten und nicht zum neutralen „König“ abgeschwächt.
- source_word: συμβουλεύοντα αὐτοῖς
  choice: ihnen zuzureden
  rationale: Das Verb bezeichnet Rat oder Zureden. Im Zwangskontext klingt „zureden“ natürlich und gibt die nachdrückliche Einflussnahme wieder, ohne dem Wort ausdrücklich Gewalt zuzuschreiben.
- source_word: μιεροφαγῆσαι
  choice: Speisen zu essen, die sie verunreinigen würden
  rationale: Das seltene zusammengesetzte Verb bezeichnet ein Essen, das kultisch beziehungsweise religiös verunreinigt. Die Formulierung macht deutlich, dass die Verunreinigung durch den Verzehr eintritt, ohne die Art der Speisen über den griechischen Text hinaus festzulegen.
- source_word: πάντες … ὁμοῦ
  choice: sie alle zugleich
  rationale: Die kollektive und gleichzeitige Reaktion wird knapp und natürlich ausgedrückt.
- source_word: διὰ μιᾶς φωνῆς
  choice: mit einer Stimme
  rationale: Die geläufige deutsche Wendung bewahrt das Bild einer vollkommen einmütigen Äußerung.
- source_word: ὥσπερ ἀπὸ τῆς αὐτῆς ψυχῆς
  choice: wie aus derselben Seele
  rationale: Die konkrete Bildsprache und die anthropologische Weite von ψυχή bleiben erhalten; eine Wiedergabe mit „Gesinnung“ oder „Sinn“ wäre deutender und flacher.
- source_word: εἶπον
  choice: sagten
  rationale: Das einfache Erzählverb leitet die im folgenden Vers stehende direkte Rede ein; deshalb steht im Deutschen ein Doppelpunkt.
theological_decisions:
- issue: Kultisch-religiöse Bedeutung von μιεροφαγῆσαι
  choice: Speisen zu essen, die sie verunreinigen würden
  alternative: Unreines zu essen / entweihende Speisen zu essen
  rationale: Die gewählte Fassung bewahrt die religiöse Verunreinigung als Folge des Essens, ohne „unrein“ als bloße Eigenschaft der Nahrung oder eine bestimmte Speisevorschrift ausdrücklich in den Wortlaut hineinzulesen.
- issue: Bedeutungsweite von ψυχή
  choice: wie aus derselben Seele
  alternative: wie aus demselben Sinn / wie von einer Seele
  rationale: „Seele“ erhält die starke Bildsprache vollständiger innerer Einheit. Der Text wird nicht auf bloße gedankliche Übereinstimmung reduziert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche Seelenmetapher bleibt bewusst erhalten; die kultische Bedeutung des seltenen Verbs wird im Text verständlich entfaltet und in der Fußnote näher erläutert.
