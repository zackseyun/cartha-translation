  terminology: „Gerechtigkeit“ ist hier gegenüber „Recht“ vorzuziehen. Die Fußnote bewahrt die lexikalische Spannweite von δίκη (Recht, Gericht/Urteil, Strafe), ohne eine dogmatische Deutung festzulegen. „Tyrann“, „gnädig“ und „gegen das Gesetz verstoßen“ sind angemessen.
