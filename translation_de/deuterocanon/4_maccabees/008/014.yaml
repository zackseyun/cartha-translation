  text: But the tyrant interrupted and said[a], “Young men, be afraid, and the justice you revere will be merciful to you if, under compulsion, you break the law.”
translation:
  language: de
  text: 'Sie legten es dar.[a] Doch der Tyrann fiel ihnen ins Wort und sagte: »Fürchtet euch, junge Männer, und die Gerechtigkeit[b], die ihr verehrt, wird euch gnädig sein, wenn ihr unter Zwang gegen das Gesetz verstoßt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie legten vor.« Das griechische Verb nennt hier kein ausdrückliches Objekt; der Bezug ergibt sich aus dem vorausgehenden Zusammenhang.'
    reason: source_segmentation_and_ellipsis
  - marker: b
    text: 'Oder: »das Recht«, »das Gericht« beziehungsweise »die Strafe«. Das griechische δίκη kann Gerechtigkeit oder Recht, aber auch Gericht, Urteil oder Strafe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθεσαν
  choice: Sie legten es vor
  rationale: Das Verb bedeutet „vorlegen, vorsetzen, vor Augen stellen“. Da im vorliegenden Vers kein Objekt genannt ist, bleibt die deutsche Wiedergabe mit „es“ bewusst anaphorisch und legt den Bezug nicht fest.
- source_word: ὑπολαβών
  choice: fiel ihnen ins Wort
  rationale: Im Dialog kann ὑπολαμβάνω das Aufgreifen oder Unterbrechen einer vorausgehenden Äußerung bezeichnen. Die Wendung gibt hier den Einschnitt durch den Tyrannen natürlich wieder.
- source_word: τύραννος
  choice: Tyrann
  rationale: Die wertende, negative Bezeichnung des Herrschers wird beibehalten und nicht zum neutralen „König“ oder „Herrscher“ abgeschwächt.
- source_word: Μειράκια
  choice: Junge Männer
  rationale: Die Anrede bezeichnet männliche Jugendliche beziehungsweise junge Männer; diese Wiedergabe ist modern und vermeidet das zu kindlich klingende „Jungen“.
- source_word: φοβήθητε
  choice: fürchtet euch
  rationale: Der Aoristimperativ wird als unmittelbare Aufforderung wiedergegeben. Die Formulierung ist würdevoll, verständlich und bewahrt die Stärke des griechischen Befehls.
- source_word: δίκην
  choice: das Recht
  rationale: δίκη kann Recht beziehungsweise Gerechtigkeit, Gericht oder Strafe bezeichnen. In Verbindung mit „das ihr verehrt“ bezeichnet „das Recht“ am natürlichsten die verehrte sittlich-rechtliche Ordnung, ohne die anderen Bedeutungsnuancen zu verschweigen.
- source_word: σέβεσθε
  choice: das ihr verehrt
  rationale: Das Verb bezeichnet ehrfürchtige, religiös oder sittlich geprägte Achtung. „Verehrt“ bewahrt diesen stärkeren Ton gegenüber bloßem „achtet“.
- source_word: ἵλεως
  choice: gnädig
  rationale: Das prädikative Adjektiv bedeutet günstig gestimmt, huldvoll oder gnädig. „Gnädig sein“ passt zur personifizierten Vorstellung des Rechts und zur behaupteten Nachsicht.
- source_word: διʼ ἀνάγκην
  choice: unter Zwang
  rationale: Die Präpositionalwendung bezeichnet äußere Nötigung als Grund oder Begleitumstand des Gesetzesverstoßes.
- source_word: παρανομήσασιν
  choice: wenn ihr … gegen das Gesetz verstoßt
  rationale: Das Partizip bezeichnet ein Handeln gegen das Gesetz. Die konditionale Formulierung macht die Logik des tyrannischen Arguments im Deutschen klar, ohne den Gesetzesbezug abzuschwächen.
theological_decisions:
- issue: Bedeutung von δίκη in der moralisch-religiösen Argumentation
  choice: „das Recht“ als verehrte und personifiziert gnädige Rechtsordnung
  alternative: „die Gerechtigkeit“, „das Gericht“ oder „die Strafe“
  rationale: σέβεσθε spricht für etwas, dem ehrfürchtige Achtung gilt, während ἵλεως eine personifizierende Redeweise ermöglicht. „Das Recht“ bewahrt die Spannung zwischen sittlicher Ordnung, Urteil und möglicher Sanktion; die Fußnote nennt die echte lexikalische Mehrdeutigkeit.
- issue: Verhältnis von Zwang und Gesetzesübertretung
  choice: Die Aussage wird als Behauptung des Tyrannen wiedergegeben, dass erzwungener Gesetzesbruch gnädig beurteilt werde.
  alternative: Die Aussage als allgemeine Lehre über entschuldbare Sünde zu formulieren.
  rationale: Der Text legt diese Argumentation dem Tyrannen in den Mund. Die Übersetzung übernimmt sie nicht als eigene theologische Aussage und fügt keine konfessionelle Lehre über Schuld, Zwang oder Zurechnung hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt scharf und knapp. Das im griechischen Ausschnitt objektlose προέθεσαν wird nicht ausgelassen; eine Fußnote dokumentiert die Ellipse und die mögliche Abhängigkeit vom vorausgehenden Kontext.
