lexical_decisions:
- source_word: ἐλεήσωμεν
  choice: Lasst uns Erbarmen … haben
  rationale: Der hortative Konjunktiv fordert gemeinsam zum Erbarmen auf. Die Wendung wahrt den ausdrücklichen Appell an Mitgefühl, ohne den stärkeren Gedanken des Verschonens einzutragen.
- source_word: τὰς ἑαυτῶν ἡλικίας
  choice: mit unserer eigenen Jugend
  rationale: ἡλικία kann Alter, Lebensphase oder Jugendblüte bezeichnen. Im Zusammenhang verweist der Plural auf das junge Lebensalter der einzelnen Brüder; im Deutschen gibt der kollektive Singular „Jugend“ dies natürlich wieder.
- source_word: κατοικτειρήσωμεν
  choice: Mitleid [haben]
  rationale: Der zweite hortative Konjunktiv bezeichnet mitfühlendes Bedauern. Durch die gemeinsame Konstruktion mit „haben“ bleibt die deutsche Form knapp und würdevoll.
- source_word: τὸ τῆς μητρὸς
  choice: mit dem Los unserer Mutter
  rationale: 'Der überlieferte griechische Text ist elliptisch: Nach dem substantivierten Artikel fehlt das Bezugswort. „Los“ bietet im Deutschen eine natürliche, bewusst offene Wiedergabe der Lage der Mutter, ohne „hohes Alter“ als im Text ausdrücklich vorhanden erscheinen zu lassen.'
