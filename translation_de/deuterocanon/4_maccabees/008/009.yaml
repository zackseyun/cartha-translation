  yaml_path: translation/deuterocanon/4_maccabees/008/009.yaml
  text: And after changing your way of life[a], enjoy your youth. But if by your disobedience you provoke me to anger, you will force me, through dreadful punishments, to destroy each one of you by tortures.
translation:
  language: de
  text: Und nachdem ihr eure Lebensweise geändert habt, genießt eure Jugend. Denn wenn ihr mich durch euren Ungehorsam in Zorn versetzt[a], werdet ihr mich zwingen, jeden Einzelnen von euch durch Folter unter grausamen Strafen umzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, näher am Wortlaut: „wenn ihr durch euren Ungehorsam zornig mit mir umgeht“. Die griechische Wendung ist schwierig; der Haupttext gibt den im Zusammenhang wahrscheinlichen Sinn wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταδιαιτηθέντες
  choice: nachdem ihr eure Lebensweise geändert habt
  rationale: Das Partizip bezeichnet eine Änderung der Lebensführung oder Lebensweise. Die Wiedergabe bewahrt die vorzeitige Partizipialkonstruktion, ohne ausdrücklich von Reue oder Bekehrung zu sprechen.
- source_word: ἐντρυφήσατε
  choice: genießt
  rationale: Der Imperativ fordert dazu auf, sich zu erfreuen beziehungsweise das Leben zu genießen. „Genießt“ ist im Zusammenhang mit der Jugend natürlich und vermeidet die unnötig negative Färbung von „schwelgt“.
- source_word: ταῖς νεότησιν ὑμῶν
  choice: eure Jugend
  rationale: Der griechische Plural wird im Deutschen idiomatisch als die Lebenszeit der Jugend wiedergegeben.
- source_word: ἐπεὶ
  choice: denn
  rationale: Die Konjunktion begründet die vorangehende Aufforderung mit der nun folgenden Drohung. „Denn“ gibt diesen Zusammenhang genauer wieder als ein adversatives „aber“.
- source_word: ὀργίλως με διαθῆσθε
  choice: ihr mich … in Zorn versetzt
  rationale: Die schwierige Verbindung aus Adverb und Medium von διατίθημι bezeichnet im Kontext wahrscheinlich, dass ihr Ungehorsam den Sprecher zornig macht. Die Formulierung ist natürlich, ohne die Unsicherheit des griechischen Ausdrucks zu verschweigen.
- source_word: ἀπειθείας
  choice: Ungehorsam
  rationale: ἀπείθεια bezeichnet die Weigerung zu gehorchen; „Ungehorsam“ ist direkt und nicht unnötig verstärkend.
- source_word: δειναῖς κολάσεσιν
  choice: unter schrecklichen Strafen
  rationale: κολάσεις sind Strafen oder Strafmaßnahmen, δειναῖς hebt ihre furchtbare Härte hervor. „Unter“ fügt die Wendung natürlich in die deutsche Satzstruktur ein.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: jeden Einzelnen von euch
  rationale: Die doppelte distributive Ausdrucksweise betont, dass die Drohung jeden für sich trifft.
- source_word: διὰ τῶν βασάνων
  choice: durch Folter
  rationale: βάσανος bezeichnet in diesem gerichtlichen Gewaltkontext Folter beziehungsweise Folterqualen. Der deutsche Kollektivsingular ist idiomatisch.
- source_word: ἀπολέσαι
  choice: zu vernichten
  rationale: ἀπόλλυμι bedeutet zerstören oder umbringen. „Vernichten“ bewahrt die Härte und den weiteren Wortlaut des griechischen Verbs; im Zusammenhang ist der Tod eindeutig eingeschlossen.
theological_decisions:
- issue: Deutung von ἐὰν ὀργίλως με διαθῆσθε
  choice: wenn ihr mich durch euren Ungehorsam in Zorn versetzt
  alternative: wenn ihr durch euren Ungehorsam zornig mit mir umgeht
  rationale: 'Die griechische Formulierung ist ungewöhnlich und lässt syntaktisch eine stärker wörtliche Deutung zu. Die anschließende Aussage, sie würden den Sprecher zu den Strafen zwingen, stützt jedoch die kausative Bedeutung: Ihr Ungehorsam macht ihn zornig. Die Fußnote bewahrt die echte sprachliche Mehrdeutigkeit.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die brutale Drohung bleibt deutlich. Der Fußnotenmarker steht bei der tatsächlich erklärten schwierigen Wendung, nicht bei der Änderung der Lebensweise.
