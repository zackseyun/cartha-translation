  yaml_path: translation/deuterocanon/4_maccabees/008/016.yaml
  text: 'And through their blessed courage they brought down his tyranny. Yet let us consider this: if some among them had been fainthearted and unmanly, what words would they have used? Would it not have been these?'
translation:
  language: de
  text: 'Und durch ihre vorbildliche Gesinnung[a] brachten sie seine Gewaltherrschaft zu Fall. Doch überlegen wir: Wenn einige unter ihnen kleinmütig und unmännlich[b] gewesen wären, welche Worte hätten sie dann gebraucht? Wären es nicht diese gewesen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort kann auch „edle Gesinnung“, „Vortrefflichkeit“ oder „Glückseligkeit“ bedeuten. Gemeint ist hier offenbar eine lobenswerte Eigenschaft, nicht ein ausgesprochener Segen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „unmännlich“. Der griechische Ausdruck ist geschlechtlich geprägt und gehört zur antiken Tugendsprache; sinngemäß auch „mutlos“ oder „feige“.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς εὐλογιστίας
  choice: durch ihre bewundernswerte Haltung
  rationale: Das seltene εὐλογιστία bezeichnet hier wahrscheinlich eine lobenswerte sittliche Qualität. „Bewundernswerte Haltung“ bewahrt diese positive Wertung, ohne den im Griechischen nicht ausdrücklich genannten Begriff „Mut“ einzufügen oder fälschlich an einen gesprochenen Segen denken zu lassen.
- source_word: τὴν τυραννίδα αὐτοῦ κατέλυσαν
  choice: brachten sie seine Gewaltherrschaft zu Fall
  rationale: καταλύω bezeichnet hier bildlich das Brechen beziehungsweise Niederwerfen tyrannischer Macht. „Zu Fall bringen“ ist im Deutschen natürlich und kräftig; „Gewaltherrschaft“ gibt τυραννίς verständlich wieder.
- source_word: καίτοι λογισώμεθα
  choice: Doch überlegen wir
  rationale: Der hortative Konjunktiv eröffnet ein rhetorisches Gedankenexperiment. Die knappe Formulierung entspricht dem argumentativen Ton.
- source_word: δειλόψυχοί
  choice: kleinmütig
  rationale: Das Kompositum bezeichnet eine schwache oder furchtsame innere Haltung. „Kleinmütig“ wahrt diese seelisch-moralische Nuance.
- source_word: ἄνανδροι
  choice: unmännlich
  rationale: Das griechische Wort ist ausdrücklich geschlechtlich geprägt und gehört zur antiken Tugendrhetorik des Werkes. „Unmännlich“ bildet diese historische Wertung ab, statt sie in ein zweites neutrales Wort für Feigheit aufzulösen.
- source_word: ποίοις ἂν ἐχρήσαντο λόγοις
  choice: welche Worte hätten sie dann gebraucht
  rationale: Die irreale Konstruktion und das Verb χράομαι mit Dativ werden idiomatisch wiedergegeben; λόγοι weist auf die anschließend angeführte Rede voraus.
- source_word: οὐχὶ τούτοις;
  choice: Nicht etwa diese?
  rationale: Die Frage erwartet Zustimmung und weist voraus auf die folgenden Worte. „Nicht etwa diese?“ ist knapp und bewahrt die rhetorische Funktion.
theological_decisions:
- issue: Geschlechtlich geprägte Tugendsprache in ἄνανδροι
  choice: unmännlich
  alternative: ohne Mut / feige
  rationale: Die Übersetzung erhält die explizit männlich codierte antike Tugendrhetorik, ohne sie als zeitlose normative Aussage zu erläutern oder konfessionell auszudeuten.
- issue: Bedeutung des seltenen εὐλογιστία
  choice: bewundernswerte Haltung
  alternative: Glückseligkeit / edle Gesinnung / gesegneter Mut
  rationale: Da die genaue Nuance unsicher ist, wird eine lobenswerte sittliche Qualität ausgedrückt, ohne den Text auf „Mut“, einen Segensspruch oder einen technischen theologischen Begriff festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rhetorischer Bewegung. Die seltene Wortbildung εὐλογιστία wird verständlich, aber bewusst nicht überpräzise wiedergegeben; die geschlechtlich markierte antike Tugendsprache bleibt im Haupttext sichtbar und wird in der Fußnote eingeordnet.
