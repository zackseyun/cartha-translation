base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/026.yaml
  text: Why has such contentiousness been instilled in us[a], and why does deadly endurance please us, when it is possible to live in tranquility by obeying the king, after becoming afraid of the tortures that lead to death?
translation:
  language: de
  text: Wer die Foltern fürchtet, wird getötet. Woher ist uns eine solche Streitsucht eingepflanzt, und warum gefällt uns diese tödliche Standhaftigkeit, obwohl wir doch ungestört leben könnten, wenn wir dem König gehorchten?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz beginnt mit „tötet“, nennt aber kein ausdrückliches Subjekt. Die genaue Verknüpfung dieser Aussage mit der folgenden rhetorischen Frage ist im überlieferten Wortlaut nicht ganz klar.
    reason: textual_variant
lexical_decisions:
- source_word: θανατοῖ φοβηθέντας τὰ βασανιστήρια
  choice: Aus Furcht vor den Foltern, die den Tod bringen, sollen wir sterben
  rationale: Die überlieferte Fügung ist syntaktisch schwierig. Die Wiedergabe lässt θανατοῖ als verbale Aussage stehen und verbindet φοβηθέντας eng mit τὰ βασανιστήρια, ohne die schwierige Stelle stillschweigend zu glätten.
- source_word: πόθεν
  choice: Woher ... nur
  rationale: Bewahrt die Frage nach dem Ursprung, klingt im Deutschen aber als rhetorische Ursachenfrage natürlich.
- source_word: ἡ τοσαύτη ἐντέτηκεν φιλονεικία
  choice: ist uns nur eine solche Streitsucht eingepflanzt
  rationale: φιλονεικία bezeichnet Streitsucht beziehungsweise einen Hang zum Streit; „eingepflanzt“ gibt das Bild einer tief eingedrungenen Haltung verständlich wieder.
- source_word: ἡ θανατηφόρος ... καρτερία
  choice: diese tödliche Standhaftigkeit
  rationale: „Standhaftigkeit“ wahrt den Sinn von καρτερία, während „tödlich“ die abwertende, mehrdeutige Kennzeichnung θανατηφόρος erhält.
- source_word: ἀρέσκει
  choice: gefällt uns
  rationale: Gibt die persönliche Anziehungskraft dieser Haltung direkt und idiomatisch wieder.
- source_word: παρὸν μετὰ ἀταραξίας ζῆν
  choice: obwohl wir doch ungestört leben könnten
  rationale: παρόν drückt eine offenstehende Möglichkeit aus; ἀταραξία bezeichnet Freiheit von Unruhe und Bedrängnis.
- source_word: τῷ βασιλεῖ πεισθέντας
  choice: wenn wir dem König gehorchten
  rationale: Im Verhältnis zu einem König bezeichnet πείθομαι hier plausibel Gehorsam beziehungsweise Nachgeben; der deutsche Konditionalsatz macht die sachliche Bedingung deutlich.
theological_decisions:
- issue: Wertung der Standhaftigkeit der Brüder innerhalb der Rede des Königs
  choice: Die abwertende Rhetorik wird mit „Streitsucht“ und „tödliche Standhaftigkeit“ bewahrt.
  alternative: Positiv wertende Begriffe wie „Eifer“, „Mut“ oder „Treue bis zum Tod“.
  rationale: Hier spricht der König und versucht, die Brüder zum Nachgeben zu bewegen. Seine negative Darstellung darf nicht durch die insgesamt positive Märtyrerwertung des Buches ersetzt werden.
- issue: Sinn der schwierigen Eingangsworte
  choice: Die syntaktische Härte bleibt im Haupttext erkennbar und wird in einer Fußnote erläutert.
  alternative: Die Worte vollständig in den nachfolgenden Möglichkeits- und Gehorsamssatz einordnen.
  rationale: Der Swete-Text lässt die genaue Verknüpfung offen; eine eindeutige Glättung würde mehr festlegen, als die überlieferte Form sicher hergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die feindselige Perspektive des Königs bleiben erhalten; die textlich schwierige Eröffnung wird bewusst nicht unmarkiert harmonisiert.
