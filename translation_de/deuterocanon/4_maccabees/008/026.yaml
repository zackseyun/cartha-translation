revisions:
- from: Aus Furcht vor den Foltern, die den Tod bringen, sollen wir sterben. Woher ist uns nur eine solche Streitsucht eingepflanzt, und warum gefällt uns diese tödliche Standhaftigkeit, obwohl wir doch ungestört leben könnten, wenn wir dem König gehorchten?[a]
  to: Wer die Foltern fürchtet, wird getötet. Woher ist uns eine solche Streitsucht eingepflanzt, und warum gefällt uns diese tödliche Standhaftigkeit, obwohl wir doch ungestört leben könnten, wenn wir dem König gehorchten?[a]
  rationale: Eine sichere Korrektur ist erforderlich, weil der Entwurf das griechische finite Verb θανατοῖ semantisch und syntaktisch umformt. „Wer die Foltern fürchtet, wird getötet“ gibt den ungenannten Handelnden mit einer im Deutschen natürlichen unpersönlichen Passivform wieder, ohne ihn etwa mit dem König gleichzusetzen. Die verbleibende Unsicherheit der Überlieferung wird knapp in der Fußnote ausgewiesen. Der folgende Satz bleibt in seiner negativen königlichen Rhetorik, seiner theologischen Spannung und seinem modernen deutschen Register erhalten.
