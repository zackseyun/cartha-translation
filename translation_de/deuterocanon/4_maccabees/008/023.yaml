  text: Why do we remove ourselves from the most pleasant life[a], and deprive ourselves
translation:
  language: de
  text: Warum entfernen wir uns aus dem angenehmsten Leben[a] und berauben uns selbst …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene griechische Text dieses Verses scheint unvollständig zu sein: Er endet mit »und berauben uns selbst«, ohne zu sagen, wessen. Deshalb bleibt auch die Übersetzung offen und ergänzt den fehlenden Satzteil nicht durch eine Vermutung.'
