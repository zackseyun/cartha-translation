lexical_decisions:
- source_word: τί
  choice: Warum
  rationale: 'In der rhetorischen Frage hat τί hier natürlich kausalen Sinn: »Warum?«'
- source_word: ἐξάγομεν ἑαυτοὺς τοῦ ἡδίστου βίου
  choice: bringen wir uns selbst um das angenehmste Leben
  rationale: Die idiomatische deutsche Wendung gibt das Herausführen bzw. Entfernen aus dem Bereich dieses Lebens wieder, ohne das im Deutschen schwerfällige Bild »uns aus dem Leben herausführen« wörtlich nachzubilden.
- source_word: ἡδίστου βίου
  choice: das angenehmste Leben
  rationale: ἥδιστος ist der Superlativ zu »angenehm, erfreulich«; βίος bezeichnet hier das Leben bzw. die Lebensführung.
- source_word: καὶ
  choice: und
  rationale: Einfache Verbindung der beiden gleichgeordneten Verben.
- source_word: ἀποστεροῦμεν ἑαυτοὺς
  choice: berauben uns selbst
  rationale: ἀποστερέω bedeutet »berauben, vorenthalten«. Die reflexive Form bleibt erhalten; wegen des fehlenden Objekts bleibt die Aussage offen.
