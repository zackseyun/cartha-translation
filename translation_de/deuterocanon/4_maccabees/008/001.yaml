base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/001.yaml
  text: For since in the first trial the notorious tyrant was defeated[a], being unable to compel the old man to eat defiling food,
translation:
  language: de
  text: Denn da der weithin bekannte Tyrann beim ersten Versuch besiegt worden war, weil er den alten Mann nicht dazu hatte zwingen können, verunreinigende Speisen zu essen,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unreines Fleisch zu essen“ oder „verbotene Speisen zu essen“. Das seltene griechische Verb bezeichnet das Essen von Nahrung, die nach jüdischem Gesetz als verunreinigend gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδὴ γὰρ
  choice: Denn nachdem
  rationale: Die Verbindung leitet eine begründende Fortsetzung ein; γάρ wird mit „denn“ wiedergegeben, während ἐπειδή hier angesichts des folgenden Aorists zeitlich-kausal als „nachdem“ verstanden wird.
- source_word: κατὰ τὴν πρώτην πεῖραν
  choice: beim ersten Versuch
  rationale: πεῖρα bezeichnet hier am ehesten den ersten Versuch des Tyrannen, Zwang auszuüben. „Versuch“ bleibt näher am Handlungszusammenhang als „Prüfung“.
- source_word: ἐνικήθη
  choice: war … unterlegen
  rationale: Das Passiv von νικάω besagt, dass der Tyrann eine Niederlage erlitt. „Unterlegen war“ klingt im Deutschen natürlich und bewahrt die Umkehrung der Machtverhältnisse.
- source_word: περιφανὴς
  choice: weithin bekannte
  rationale: Das Adjektiv bezeichnet öffentlich hervortretende oder weithin erkennbare Bekanntheit. In Verbindung mit „Tyrann“ ergibt sich eine negative Färbung aus dem Kontext, ohne dass diese lexikalisch auf „berüchtigt“ festgelegt werden muss.
- source_word: ὁ τύραννος
  choice: der Tyrann
  rationale: „Tyrann“ bewahrt die politische und moralische Schärfe des griechischen Ausdrucks.
- source_word: μὴ δυνηθεὶς
  choice: weil er … nicht hatte … können
  rationale: Das Partizip erläutert den Grund beziehungsweise die Art seiner Niederlage. Ein deutscher Kausalsatz gibt diesen Zusammenhang klar und natürlich wieder.
- source_word: ἀναγκάσαι
  choice: zwingen
  rationale: „Zwingen“ gibt die starke Nötigung idiomatisch und ohne Abschwächung wieder.
- source_word: γέροντα
  choice: den alten Mann
  rationale: Obwohl das griechische Substantiv keinen Artikel trägt, verweist es im Zusammenhang auf den bereits bekannten alten Mann.
- source_word: μαιροφαγῆσαι
  choice: verunreinigende Speisen zu essen
  rationale: Das seltene Verb bezeichnet das Essen von Nahrung, die als verunreinigend gilt. Die Wiedergabe erhält den Reinheitsaspekt, ohne die Nahrung unnötig auf Fleisch festzulegen.
theological_decisions:
- issue: Art der in μαιροφαγῆσαι bezeichneten Nahrung
  choice: verunreinigende Speisen zu essen
  alternative: unreines Fleisch zu essen; verbotene Speisen zu essen
  rationale: Die Übersetzung hält den Gedanken kultisch-religiöser Verunreinigung fest, lässt aber offen, ob ausschließlich Fleisch gemeint ist und ob der Schwerpunkt auf dem Verbot oder auf der verunreinigenden Wirkung liegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wie im griechischen Ausgangstext syntaktisch offen, da der Gedanke im folgenden Vers fortgeführt wird. „Weithin bekannt“ bewahrt die mögliche Ambivalenz von περιφανής besser als das stärker wertende „berüchtigt“.
