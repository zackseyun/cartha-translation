  terminology: „Leitende Ämter“ gibt ἀρχὰς ... ἡγεμονικὰς sachgerecht wieder. „Verleugnet“ wahrt die starke Absage in ἀρνησάμενοι. Die Umschreibung von πάτριος ... θεσμός τῆς πολιτείας als von den Vätern überkommene Ordnung der Lebensweise erhält die Mehrdeutigkeit zwischen überlieferter Norm, Gemeinwesen und religiös geprägter Lebensordnung. Keine problematischen theologischen Engführungen oder Namensfragen liegen vor.
