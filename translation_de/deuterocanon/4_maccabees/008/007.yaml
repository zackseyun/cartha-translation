  source_fidelity: Die Übersetzung gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder. „Fügt euch“ ist für das objektlos gebrauchte πιστεύσατε im Kontext einer herrscherlichen Aufforderung vertretbar und entspricht der im englischen Audit gewählten kontextuellen Wiedergabe „comply“. „Leitende Ämter über meine Angelegenheiten“ bewahrt den weiten Bezug von ἐπὶ τῶν ἐμῶν πραγμάτων, ohne ihn unzulässig zu präzisieren. Die konditionale Wiedergabe des Partizips ἀρνησάμενοι ist idiomatisch und sinngetreu.
