  text: So comply, and you will receive ruling offices over my affairs, if you renounce the ancestral ordinance of your way of life.
translation:
  language: de
  text: Fügt euch also, und ihr werdet leitende Ämter über meine Angelegenheiten erhalten, wenn ihr die von euren Vätern überkommene Ordnung eurer Lebensweise verleugnet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστεύσατε
  choice: Fügt euch
  rationale: Im Zusammenhang gibt der Herrscher keine Aufforderung zu religiösem Glauben, sondern verlangt Zustimmung und Gehorsam gegenüber seinem Ansinnen; daher trifft „Fügt euch“ die kontextuelle Bedeutung besser als das isoliert mögliche „Glaubt“.
- source_word: ἀρχὰς ... ἡγεμονικὰς
  choice: leitende Ämter
  rationale: Die Wendung bezeichnet Herrschafts- bzw. Führungsstellungen; „leitende Ämter“ ist natürlich und bewahrt den administrativen Sinn.
- source_word: ἐπὶ τῶν ἐμῶν πραγμάτων
  choice: über meine Angelegenheiten
  rationale: Gibt den weiten und leicht mehrdeutigen Bezug von πράγματα wieder, ohne ihn unnötig auf Reich, Verwaltung oder Besitz einzuengen.
- source_word: ἀρνησάμενοι
  choice: wenn ihr ... verleugnet
  rationale: Das Partizip bezeichnet die Bedingung bzw. Voraussetzung des versprochenen Aufstiegs; „verleugnet“ bewahrt die starke Bedeutung des Lossagens.
- source_word: τὸν πάτριον ὑμῶν τῆς πολιτείας θεσμόν
  choice: die von euren Vätern überkommene Ordnung eurer Lebensweise
  rationale: „Von euren Vätern überkommen“ gibt πάτριον idiomatisch wieder; „Ordnung“ entspricht θεσμός, und „Lebensweise“ erfasst πολιτεία hier als gemeinschaftlich-religiöse Lebensordnung, ohne den Sinn auf Staatsbürgerschaft zu verengen.
theological_decisions:
- issue: Bedeutung von πιστεύσατε im Mund des verfolgenden Herrschers
  choice: Fügt euch
  alternative: Glaubt mir / Vertraut mir
  rationale: Der unmittelbare Sinn ist die verlangte Einwilligung in den Abfall von der überkommenen Lebensordnung. Die Übersetzung vermeidet, dem Verb hier einen religiösen Glaubensbegriff zu geben, und folgt zugleich der geprüften englischen Konsultationsfassung.
- issue: Charakter des πάτριος ... θεσμός
  choice: von euren Vätern überkommene Ordnung eurer Lebensweise
  alternative: väterliches Gesetz eurer Verfassung
  rationale: Die Formulierung lässt offen, wie Gesetz, Brauch, Gemeinwesen und religiöse Lebensführung ineinandergreifen, statt die Wendung konfessionell oder rein politisch festzulegen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Rede klingt wie das autoritative Angebot eines Herrschers: Unterwerfung gegen politische Beförderung. Satzbau und Wortwahl bleiben klar, ohne die institutionelle und kulturell-religiöse Mehrdeutigkeit des Griechischen aufzulösen.'
