  yaml_path: translation/deuterocanon/4_maccabees/008/004.yaml
  text: When the tyrant saw them surrounding their mother in the middle as if in a chorus[a], he was impressed by them, and astonished at their good bearing and noble birth, he smiled at them; and calling them near, he said[b],
translation:
  language: de
  text: 'Als der Tyrann sah, wie sie ihre Mutter in ihrer Mitte umgaben, wie in einem Reigen[a], war er von ihnen beeindruckt[b]. Er staunte über ihre würdevolle Erscheinung und ihre vornehme Herkunft, lächelte ihnen zu, rief sie näher zu sich und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie in einem Chor oder Tanzreigen“. Das griechische Bild bezeichnet eine geordnete Gruppe, die die Mutter ringförmig umgibt.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Wendung kann auch zurückhaltender verstanden werden: „nahm er sie wahr“ oder „wurde er auf sie aufmerksam“. Das unmittelbar folgende Staunen spricht hier für eine stärkere Reaktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ἰδὼν
  choice: Als der Tyrann sah, wie sie
  rationale: Das aoristische Partizip wird als temporaler Nebensatz wiedergegeben; dies entspricht dem griechischen Erzählablauf und klingt im Deutschen natürlich.
- source_word: ὁ τύραννος
  choice: der Tyrann
  rationale: Die moralisch wertende Bezeichnung des verfolgenden Herrschers bleibt erhalten; ein neutrales „Herrscher“ oder „König“ würde den Ton abschwächen.
- source_word: καθάπερ ἐν χορῷ
  choice: gleichsam wie in einem Reigen
  rationale: „Reigen“ vermittelt das Bild einer geordneten, möglicherweise kreisförmigen Chor- oder Tanzformation natürlicher als das im heutigen Deutschen missverständliche „in einem Chor“.
- source_word: περιέχοντας μέσην τὴν μητέρα
  choice: ihre Mutter in ihrer Mitte umgaben
  rationale: Die Formulierung bewahrt sowohl das Umringen als auch die zentrale Stellung der Mutter, ohne im Deutschen unnötig redundant zu wirken.
- source_word: ᾔσθετο ἐπʼ αὐτοῖς
  choice: war er von ihnen beeindruckt
  rationale: Im Zusammenhang mit dem folgenden Staunen bezeichnet die Wendung eine deutlich wahrnehmbare Wirkung auf den Tyrannen. Eine Fußnote hält die mildere Deutung „nahm er sie wahr“ offen.
- source_word: τῆς εὐπρεπείας
  choice: ihre würdevolle Erscheinung
  rationale: Die Wiedergabe umfasst sowohl ansprechendes Äußeres als auch würdevolles Auftreten und wahrt den gehobenen Ton.
- source_word: τῆς εὐγενίας
  choice: ihre vornehme Herkunft
  rationale: εὐγένεια bezeichnet hier am ehesten edle beziehungsweise vornehme Abstammung; „edler Charakter“ würde den Akzent verschieben.
- source_word: ἐκπλαγεὶς
  choice: Er staunte
  rationale: Das Partizip wird zur besseren deutschen Satzführung als finites Verb wiedergegeben und behält die starke Reaktion des Herrschers bei.
- source_word: προσεμειδίασεν αὐτοῖς
  choice: lächelte ihnen zu
  rationale: Die gerichtete Handlung des Verbs wird idiomatisch und präzise wiedergegeben.
- source_word: πλησίον καλέσας
  choice: rief sie näher zu sich
  rationale: Die Formulierung macht die räumliche Annäherung klar und ist im modernen Deutschen natürlich.
- source_word: ἔφη
  choice: sagte
  rationale: Die schlichte deutsche Redeeinleitung entspricht dem unmarkierten griechischen Verb.
