base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/011.yaml
  text: And I pity your beauty. Will you not consider this—that nothing lies before you[a], if you disobey, except to die amid tortures?
translation:
  language: de
  text: Und ich bedaure eure Schönheit. Wollt ihr nicht bedenken, dass euch, wenn ihr nicht gehorcht, nichts anderes bevorsteht, als unter Folterqualen zu sterben?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit Foltern zu sterben“; gemeint ist ein Tod, der von Folterqualen begleitet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐμορφίας
  choice: Schönheit
  rationale: Das Substantiv bezeichnet körperliche Schönheit oder ansprechende Gestalt. „Schönheit“ gibt den manipulativen Hinweis des Redners auf das jugendliche Aussehen der Angesprochenen knapp und natürlich wieder.
- source_word: οἰκτείρομαι
  choice: ich bedaure
  rationale: Das Verb bezeichnet Mitleid oder Erbarmen. „Ich bedaure“ passt hier idiomatisch zur Schönheit, die nach Aussage des Redners durch den drohenden Tod zugrunde gehen würde, und bewahrt zugleich den herablassend-manipulativen Ton.
- source_word: διαλογιεῖσθε
  choice: wollt ihr nicht bedenken
  rationale: Das Verb bedeutet überlegen, erwägen oder durchdenken. Die futurische rhetorische Frage wird im Deutschen natürlich mit „Wollt ihr nicht bedenken“ wiedergegeben.
- source_word: ἀπειθήσασιν
  choice: wenn ihr nicht gehorcht
  rationale: Das Partizip bezeichnet Ungehorsam beziehungsweise die Weigerung zu gehorchen. Die konditionale Wiedergabe entspricht dem Zusammenhang; ein Objekt wie „mir“ wird nicht ergänzt, da es im Griechischen nicht ausdrücklich steht.
- source_word: ἀπόκειται
  choice: steht euch bevor
  rationale: Das Verb kann von etwas sprechen, das bereitliegt, aufbewahrt ist oder jemanden erwartet. Im Drohkontext ist „steht euch bevor“ die natürliche deutsche Entsprechung.
- source_word: στρεβλῶν
  choice: Folterqualen
  rationale: Der substantivierte Plural verweist auf Foltern beziehungsweise mit Verdrehen und Strecken verbundene Qualen. „Folterqualen“ ist im Deutschen klar und wahrt den Gedanken eines qualvollen Todes, ohne ein bestimmtes Folterinstrument festzulegen.
- source_word: ἀποθανεῖν
  choice: zu sterben
  rationale: Der Infinitiv bedeutet schlicht „sterben“. Eine kausative Erweiterung wie „getötet zu werden“ ist nicht nötig.
