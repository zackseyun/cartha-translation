  text: And as he said these things[a], he ordered the instruments of torture to be brought forward, so that even through fear he might persuade them to eat defiled food.
translation:
  language: de
  text: Während er dies sagte, befahl er, die Folterwerkzeuge nach vorn zu bringen, um sie selbst durch Furcht dazu zu bewegen, unreine Speisen zu essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwas Verunreinigendes zu essen“. Das griechische Verb bezeichnet das Essen von Nahrung, die als religiös oder kultisch verunreinigend gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ λέγων
  choice: Während er dies sagte
  rationale: Die präsentische Partizipialkonstruktion bezeichnet eine zeitliche Begleithandlung zum Hauptverb und wird so natürlich und genau wiedergegeben.
- source_word: ἐκέλευσεν
  choice: befahl er
  rationale: Gibt den verbindlichen Befehl im gewaltsamen Kontext knapp und angemessen wieder.
- source_word: εἰς τὸ ἔμπροσθεν προτεθῆναι
  choice: vor ihnen aufzustellen
  rationale: Bewahrt den Gedanken, dass die Gegenstände nach vorn gebracht und sichtbar vor den Brüdern aufgestellt werden; der Bezug auf „ihnen“ ist aus dem Kontext erschlossen.
- source_word: τὰ βασανιστήρια
  choice: die Folterwerkzeuge
  rationale: Das Substantiv bezeichnet hier angesichts des Aufstellens am plausibelsten die Geräte beziehungsweise Mittel der Folter.
- source_word: ὅπως καὶ διὰ τοῦ φόβου
  choice: um sie sogar durch Angst
  rationale: ὅπως leitet den Zweck ein; καί hebt die Angst als zusätzliches beziehungsweise gesteigertes Mittel des Überredens hervor.
- source_word: πείσειεν αὐτοὺς
  choice: sie ... dazu zu bringen
  rationale: Gibt das zielgerichtete Einwirken von πείθω idiomatisch wieder, ohne das Verb zum stärkeren „zwingen“ zu verschärfen.
- source_word: μιεροφαγῆσαι
  choice: Verunreinigendes zu essen
  rationale: Das zusammengesetzte Verb bezeichnet das Essen von etwas, das kultisch oder religiös verunreinigt; die substantivierte Form vermeidet die im Griechischen nicht ausdrücklich vorhandene Ergänzung „Speise“.
theological_decisions:
- issue: Religiös-kultische Bedeutung von μιεροφαγῆσαι
  choice: Verunreinigendes zu essen
  alternative: unreine Speisen zu essen
  rationale: Die gewählte Fassung bewahrt die Vorstellung religiöser Verunreinigung und lässt offen, ob der Akzent auf dem Zustand der Nahrung oder auf ihrer verunreinigenden Wirkung liegt. Die Alternative ist verständlicher, könnte aber stärker an eine fest umrissene Speisekategorie denken lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Folterwerkzeuge“ ist konkret und allgemein verständlich; „dazu zu bringen“ wahrt den Überredungsaspekt trotz der deutlich einschüchternden Situation. Der Fußnotenmarker steht unmittelbar nach dem betroffenen Ausdruck beziehungsweise Satz.
