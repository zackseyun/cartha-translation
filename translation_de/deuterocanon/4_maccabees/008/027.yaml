  text: But the young men[a], who were about to be tortured, said none of these things, nor did they even think them.
translation:
  language: de
  text: Doch die jungen Männer, die kurz davorstanden, gefoltert zu werden, sagten nichts davon und dachten nicht einmal daran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und hegten nicht einmal solche Gedanken“. Das griechische Verb kann ein inneres Nachdenken oder Erwägen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den starken Gegensatz zum vorausgehenden Gedankengang und klingt im modernen deutschen Erzählstil natürlich.
- source_word: τούτων οὐδὲν
  choice: nichts davon
  rationale: Gibt den partitivischen Rückverweis knapp und idiomatisch wieder.
- source_word: οἱ νεανίαι
  choice: die jungen Männer
  rationale: Bezeichnet die Brüder als junge männliche Personen; die Formulierung ist klarer und natürlicher als „die Jünglinge“.
- source_word: βασανίζεσθαι μέλλοντες
  choice: die kurz davorstanden, gefoltert zu werden
  rationale: Bewahrt sowohl das unmittelbar Bevorstehende von μέλλω als auch die körperliche Gewalt von βασανίζω im Märtyrerkontext.
- source_word: εἶπον
  choice: sagten
  rationale: Direkte, idiomatische Wiedergabe des narrativen Aorists.
- source_word: οὐδὲ ἐνεθυμήθησαν
  choice: und dachten nicht einmal daran
  rationale: Gibt die innere Erwägung und den impliziten Rückbezug auf das zuvor Genannte in natürlichem Deutsch wieder; „nicht einmal“ wahrt die steigernde Kraft von οὐδέ.
theological_decisions:
- issue: Intensität von βασανίζεσθαι im Märtyrerkontext
  choice: gefoltert zu werden
  alternative: gequält oder auf die Probe gestellt zu werden
  rationale: Der Zusammenhang beschreibt gezielte körperliche Misshandlung. „Gefoltert“ gibt deren Schwere wieder, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und erhält die Steigerung: Die jungen Männer äußerten diese Dinge nicht und erwogen sie nicht einmal innerlich.'
