base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/005.yaml
  text: Young men[a], I warmly admire the beauty of each one of you, and, valuing so highly the number of so many brothers, I not only urge you not to go mad with the same madness as the old man who has already been tortured, but also—
translation:
  language: de
  text: Ihr jungen Männer, mit Wohlwollen bewundere ich die Schönheit jedes Einzelnen von euch und schätze die große Zahl so vieler Brüder außerordentlich; ich rate euch nicht nur, nicht in denselben Wahnsinn zu verfallen wie der alte Mann, der bereits gefoltert worden ist, sondern auch—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz bricht hier nach »sondern auch« ab und wird im nächsten Vers fortgesetzt.
    reason: textual_variant
lexical_decisions:
- source_word: Ὦ νεανίαι
  choice: Ihr jungen Männer
  rationale: Die direkte Anrede bezeichnet männliche Jugendliche beziehungsweise junge Männer; die Wiedergabe ist geschlechtsgenau und im Deutschen natürlich.
- source_word: φιλοφρόνως
  choice: mit herzlicher Anteilnahme
  rationale: Das Adverb drückt freundliches, wohlwollendes Entgegenkommen aus; die Formulierung wahrt hier zugleich den schmeichelnden Ton des Redners.
- source_word: καθʼ ἑνὸς ἑκάστου ὑμῶν
  choice: eines jeden von euch
  rationale: Die Formulierung bewahrt die nachdrückliche Bezugnahme auf jeden Einzelnen.
- source_word: θαυμάζω τὸ κάλλος
  choice: ich bewundere die Schönheit
  rationale: θαυμάζω kann Bewunderung oder Staunen ausdrücken; im Zusammenhang des rhetorischen Lobes ist „bewundere“ passend, während κάλλος mit „Schönheit“ unmittelbar wiedergegeben wird.
- source_word: τὸ πλῆθος τοσούτων ἀδελφῶν
  choice: eine so große Zahl von Brüdern
  rationale: Die natürliche deutsche Formulierung gibt sowohl πλῆθος als Zahl beziehungsweise Menge als auch τοσούτων als Hinweis auf deren bemerkenswerte Größe wieder.
- source_word: ὑπερτιμῶν
  choice: überaus hochschätze
  rationale: Das Partizip bezeichnet eine außerordentlich hohe Wertschätzung und wird als begleitender Umstand zum Hauptverb wiedergegeben.
- source_word: οὐ μόνον συμβουλεύω
  choice: rate ich euch nicht nur
  rationale: συμβουλεύω bedeutet beraten oder raten; „rate“ wahrt die vorgeblich wohlmeinende, tatsächlich aber drängende Redeweise.
- source_word: μὴ μανῆναι ... μανίαν
  choice: nicht demselben Wahnsinn zu verfallen
  rationale: Die deutsche Wendung bewahrt das Motiv des Wahnsinns, ohne eine unnatürliche Wiederholung wie „wahnsinnig werden durch denselben Wahnsinn“ zu erzwingen.
- source_word: τῷ προβασανισθέντι γέροντι
  choice: wie der alte Mann, der bereits gefoltert worden ist
  rationale: Das Aoristpassiv-Partizip bezeichnet die zeitlich vorausliegende Folterung; „bereits“ macht diese Vorzeitigkeit deutlich.
- source_word: ἀλλὰ καὶ
  choice: sondern auch—
  rationale: Die korrelative Wendung setzt οὐ μόνον fort; der Gedankenstrich bewahrt den am Versende noch unvollständigen Satz.
theological_decisions:
- issue: Wiedergabe von ἀδελφῶν im Zusammenhang der sieben Söhne
  choice: Brüdern
  alternative: Geschwistern
  rationale: Gemeint ist ausdrücklich eine Gruppe männlicher Geschwister; „Brüder“ wahrt Geschlecht und Kontext.
- issue: Unvollständiger Satz am Versende
  choice: Den Abbruch nach „sondern auch“ mit Gedankenstrich erhalten
  alternative: Den Satz durch Inhalt aus dem Folgevers vervollständigen
  rationale: Der griechische Quelltext endet mit ἀλλὰ καὶ. Die Übersetzung ergänzt keinen hier nicht vorhandenen Inhalt und weist transparent auf die Fortsetzung hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt schmeichelnd und rhetorisch, ohne ihre herablassende Bezeichnung der Standhaftigkeit des alten Mannes als „Wahnsinn“ abzuschwächen. Der Fußnotenmarker steht unmittelbar beim sichtbar unvollständigen Versschluss.
