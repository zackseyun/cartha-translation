  text: Therefore have pity on yourselves[a], on whom even I, your enemy, have pity because of your age.
translation:
  language: de
  text: Habt also Erbarmen mit euch selbst, denn sogar ich, euer Feind, bemitleide euch wegen eures Alters[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen eurer Jugend«. Das griechische Wort kann genauer die jeweilige Lebensstufe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελεήσατε
  choice: Habt Erbarmen
  rationale: Der Aorist-Imperativ fordert zu einem konkreten Akt des Erbarmens auf; die Wendung ist würdig und im heutigen Deutsch verständlich.
- source_word: ἑαυτούς
  choice: mit euch selbst
  rationale: Das Reflexivpronomen bezeichnet hier das auf die Angesprochenen selbst gerichtete Erbarmen.
- source_word: οὓς
  choice: mit euch, die
  rationale: Die Wiederaufnahme macht den relativen Anschluss im Deutschen klar und erhält die rhetorische Hervorhebung.
- source_word: ὁ πολέμιος
  choice: euer Feind
  rationale: Wörtlich steht »der Feind«; im Zusammenhang bezeichnet der Sprecher sich selbst als Feind der Angesprochenen. Das Possessivverhältnis wird im Deutschen idiomatisch verdeutlicht.
- source_word: ἔγωγε
  choice: sogar ich
  rationale: 'Die emphatische Pronominalform betont den überraschenden Gegensatz: Selbst der feindliche Sprecher beansprucht, Mitleid mit ihnen zu haben.'
- source_word: τῆς ἡλικίας
  choice: wegen eures Alters
  rationale: ἡλικία kann das Alter oder eine Lebensstufe bezeichnen. »Alter« bewahrt den weiteren Bedeutungsumfang; die kontextuell mögliche Spezifizierung als Jugend wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutungsumfang von ἡλικία
  choice: wegen eures Alters
  alternative: wegen eurer Jugend
  rationale: Der griechische Ausdruck bezeichnet allgemein Alter beziehungsweise Lebensstufe und kann im Kontext besonders die Jugend meinen. Der Haupttext vermeidet eine unnötige Verengung und bewahrt die spezifischere Möglichkeit in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »mit euch« glättet den relativen Anschluss, ohne die eindringliche Selbstmitleidsaufforderung oder den Gegensatz »sogar ich, euer Feind« abzuschwächen. Der bereitgestellte griechische Wortlaut scheint am Versende unvollständig zu sein; die Aussage wird entsprechend der erkennbaren Syntax und der geprüften Konsultationsschicht wiedergegeben.
