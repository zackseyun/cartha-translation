  text: For they were contemptuous of sufferings[b][a], and masters of pains.
translation:
  language: de
  text: Denn sie verachteten die Leiden[a] und waren Herren über die Schmerzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »blickten auf die Leiden herab«; das griechische Wort drückt mehr als bloßes Ertragen aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »hatten die Schmerzen in ihrer Gewalt«. Das griechische Wort betont Herrschaft und Selbstbestimmung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίφρονες
  choice: sie verachteten
  rationale: Das Adjektiv bezeichnet eine Haltung des Herabsehens oder der Verachtung. Die verbale Formulierung klingt im modernen Deutschen natürlich und bewahrt die starke Aussage.
- source_word: τῶν παθῶν
  choice: die Leiden
  rationale: Im Zusammenhang des Martyriums bezeichnet πάθη erlittene Leiden, nicht innere Leidenschaften.
- source_word: αὐτοκράτορες
  choice: Herren über
  rationale: Das Wort bezeichnet Personen, die selbst Macht oder Herrschaft ausüben. »Herren über« bewahrt das Bild tatsächlicher Überlegenheit, ohne es philosophisch auszudeuten.
- source_word: τῶν ἀλγηδόνων
  choice: die Schmerzen
  rationale: ἀλγηδών bezeichnet besonders körperlichen Schmerz. »Schmerzen« ist die direkte und kontextgerechte Wiedergabe.
theological_decisions:
- issue: Verhältnis der Märtyrer zu körperlichem Leiden
  choice: Der Vers beschreibt Verachtung der Leiden und Herrschaft über die Schmerzen.
  alternative: Die Aussage könnte als völlige Unempfindlichkeit oder ausdrücklich als Sieg der Vernunft über die Leidenschaften gedeutet werden.
  rationale: Der griechische Text spricht knapp von einer Haltung gegenüber Leiden und von Macht über Schmerzen. Er erklärt weder eine vollständige Schmerzlosigkeit noch ein bestimmtes philosophisches System.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur des griechischen Satzes bleibt erhalten; die starken Ausdrücke für Verachtung und Herrschaft werden nicht abgeschwächt.
