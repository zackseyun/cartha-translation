base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/002.yaml
  text: Then[a], becoming deeply agitated, he ordered that others from among the Hebrews of that age be brought in; and if they would eat meat from the thigh, to release those who were brought in, but if they objected[c][b], to torture them more severely.
translation:
  language: de
  text: Da geriet er in heftige Erregung und befahl, weitere Hebräer derselben Altersgruppe herbeizubringen. Wenn sie Fleisch von der Keule essen würden[a], sollte man sie freilassen[b]; wenn sie aber widersprächen, sollte man sie noch grausamer foltern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Keulenfleisch essen“. Gemeint sein könnte im Zusammenhang unreines Fleisch; „Schweinefleisch essen“ wäre jedoch eine weitergehende Deutung des überlieferten Wortes.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Wortlaut nach „freilassen“ ist syntaktisch schwierig und lautet wörtlich etwa „als Herbeiführende/Führende“. Der Zusammenhang spricht dafür, dass die Herbeigebrachten freigelassen werden sollen.
    reason: textual_difficulty
  - marker: c
    text: 'Wörtlich: „bitterer foltern“, das heißt härter oder grausamer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  choice: Da
  rationale: Die Verbindung markiert nachdrücklich den Fortgang der Erzählung. Das knappe „Da“ gibt diesen unmittelbaren Anschluss im Deutschen natürlich wieder.
- source_word: σφόδρα περιπαθὼς
  choice: geriet er in heftige Erregung
  rationale: Das Partizip bezeichnet starke emotionale Bewegung, ohne eindeutig festzulegen, ob Zorn, Bestürzung oder eine andere Erregung gemeint ist. Die Übersetzung bewahrt diese Offenheit und die durch σφόδρα verstärkte Intensität.
- source_word: ἐκέλευσεν
  choice: befahl
  rationale: Das Verb bezeichnet hier die verbindliche Anordnung eines Herrschers.
- source_word: ἄλλους ἐκ τῆς ἡλικίας τῶν Ἑβραίων
  choice: weitere Hebräer derselben Altersgruppe
  rationale: ἡλικία verweist auf Alter beziehungsweise Lebensstufe. Die Wiedergabe hält diesen ausdrücklichen Altersbezug fest und bezieht ἄλλους natürlich auf weitere Angehörige der zuvor behandelten Gruppe.
- source_word: ἀγαγεῖν
  choice: herbeizubringen
  rationale: Im vorliegenden Verhörs- und Folterkontext meint ἄγειν, Personen vor den Herrscher bringen zu lassen.
- source_word: μηροφαγοῖεν
  choice: Fleisch von der Keule essen würden
  rationale: Der überlieferte griechische Text bildet das Wort aus μηρός („Schenkel, Keule“) und φαγεῖν („essen“). Daher wird die konkrete Wortbedeutung wiedergegeben, statt ohne textliche Kennzeichnung „Schweinefleisch“ einzusetzen.
- source_word: ἀπολύειν ἀγώντας
  choice: sollte man sie wieder freilassen
  rationale: ἀπολύειν bedeutet „freilassen“. Das folgende aktive Partizip ἀγώντας ist syntaktisch schwierig; im Erzählzusammenhang ist jedenfalls die Freilassung der Herbeigebrachten als Folge ihres Einlenkens gemeint. „wieder“ macht den Zusammenhang mit dem Herbeibringen idiomatisch verständlich, während eine Fußnote die Formschwierigkeit offenlegt.
- source_word: ἀντιλέγοιεν
  choice: widersprächen
  rationale: Das Verb bedeutet wörtlich „dagegenreden, widersprechen“ und bezeichnet hier den geäußerten Widerstand gegen die Forderung.
- source_word: πικρότερον
  choice: noch grausamer
  rationale: Der Komparativ bedeutet wörtlich „bitterer“, beschreibt bei βασανίζειν aber die verschärfte Grausamkeit der Folter. „Noch grausamer“ bewahrt Vergleich und Intensivierung in natürlichem Deutsch.
- source_word: βασανίζειν
  choice: foltern
  rationale: Im Martyriumskontext bezeichnet das Verb konkrete körperliche Folter, nicht nur allgemeine Qual.
theological_decisions:
- issue: Art der starken Gefühlsbewegung des Herrschers in περιπαθὼς
  choice: heftige Erregung, ohne eine bestimmte Emotion festzulegen
  alternative: Zorn oder Bestürzung ausdrücklich benennen
  rationale: Der griechische Ausdruck zeigt eine intensive emotionale Beteiligung, bestimmt sie aber nicht eindeutig als Zorn. Die Übersetzung vermeidet eine unnötige Festlegung.
- issue: Gegenstand des verbotenen Essens in μηροφαγοῖεν
  choice: Fleisch von der Keule gemäß dem überlieferten Wortlaut
  alternative: Schweinefleisch als kontextuelle oder variantenbezogene Deutung
  rationale: Die Übersetzung folgt zuerst der angegebenen griechischen Ausgabe. Der größere Zusammenhang jüdischer Speisegebote darf die konkrete Form des überlieferten Wortes nicht stillschweigend ersetzen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Der Satzbau wurde für gewöhnliche Leser gegliedert, während die konditionale Gegenüberstellung und der Altersbezug des Griechischen erhalten bleiben. Die emotionale Reaktion des Herrschers bleibt bewusst unspezifisch; textliche und lexikalische Schwierigkeiten werden nicht im Haupttext überladen, sondern in knappen Fußnoten offengelegt.
