base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/013.yaml
  text: Then[a], when the bodyguards set out wheels, joint-rackers, stretching-machines, clawing hooks, catapults, cauldrons[b], frying pans, thumbscrews, iron hands, wedges, and the live coals of the fire, the tyrant took up the matter and said,
translation:
  language: de
  text: 'Als aber die Leibwächter Räder, Gelenkbrecher, Folterbänke, Reißhaken, Katapulte[a], Kessel, Pfannen, Fingerpressen, eiserne Hände, Keile und die glühenden Kohlen des Feuers bereitgelegt hatten, ergriff der Tyrann das Wort und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Gerätenamen in diesem Vers sind selten oder technisch und daher nur annähernd bestimmbar. Für »Gelenkbrecher« kommen auch »Gliedmaßenbrecher« oder »Gelenkverrenker«, für »Folterbänke« auch »Streckgeräte« und für »Fingerpressen« auch »Fingerklemmen« infrage. Das griechische Wort, das hier mit »Katapulte« wiedergegeben ist, bedeutet gewöhnlich tatsächlich »Katapulte«; obwohl ein solches Gerät in dieser Folterinstrumentenliste ungewöhnlich wirkt, wird die überlieferte Lesart beibehalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχούς
  choice: Räder
  rationale: Die Grundbedeutung ist »Räder«; der Folterkontext legt Folterräder nahe, doch der Text selbst spezifiziert dies nicht.
- source_word: ἀρθρενβόλους
  choice: Gelenkbrecher
  rationale: Das seltene Kompositum bezeichnet offenbar Geräte, die Gelenke oder Gliedmaßen schädigen; die Wiedergabe bleibt anschaulich, ohne eine genaue Bauart zu behaupten.
- source_word: στρεβλωτήριά
  choice: Folterbänke
  rationale: Der Ausdruck bezeichnet Geräte zum Verdrehen, Strecken oder Foltern; »Folterbänke« ist im Deutschen verständlich und lässt die genaue Funktionsweise offen.
- source_word: τροχαντῆρας
  choice: Reißhaken
  rationale: Das seltene technische Wort dürfte hakenförmige Folterinstrumente bezeichnen; »Reißhaken« vermittelt Form und Funktion annähernd.
- source_word: καταπέλτας
  choice: Katapulte
  rationale: Dies ist die gewöhnliche Bedeutung des griechischen Wortes. Trotz des ungewöhnlichen Vorkommens in der Liste wird die überlieferte Lesart nicht durch eine Vermutung ersetzt.
- source_word: λέβητας
  choice: Kessel
  rationale: Bezeichnet große Metallgefäße, insbesondere zum Erhitzen oder Sieden.
- source_word: τήγανά
  choice: Pfannen
  rationale: Die neutrale deutsche Bezeichnung gibt erhitzbare flache Gefäße natürlich wieder.
- source_word: δακτυλήθρας
  choice: Fingerpressen
  rationale: Das Wort ist von »Finger« her gebildet und bezeichnet im Zusammenhang ein Gerät zum Einspannen oder Quetschen der Finger; »Fingerpressen« ist näher am Griechischen als »Daumenschrauben«.
- source_word: χεῖρας σιδηρᾶς
  choice: eiserne Hände
  rationale: Die wörtliche und eindrückliche Wendung bleibt erhalten, obwohl wahrscheinlich greifende oder krallenartige Geräte gemeint sind.
- source_word: σφῆνας
  choice: Keile
  rationale: Dies ist die reguläre lexikalische Bedeutung; eine speziellere Verwendung im Foltervorgang wird nicht ergänzt.
- source_word: τὰ ζώπυρα τοῦ πυρός
  choice: die glühenden Kohlen des Feuers
  rationale: Die Formulierung bewahrt sowohl das Bild brennender Glut als auch die ausdrückliche Bezugnahme auf das Feuer.
- source_word: οἱ δορυφόροι
  choice: die Leibwächter
  rationale: Wörtlich »Speerträger«; im höfischen Zusammenhang bezeichnet das Wort die persönliche Wache des Herrschers.
- source_word: ὑπολαβὼν ... ἔφη
  choice: ergriff ... das Wort und sagte
  rationale: Im Redekontext bedeutet das Partizip, dass der Tyrann das Wort aufnimmt; die deutsche Wendung gibt den Übergang zur folgenden Rede natürlich wieder.
theological_decisions:
- issue: Wertende Bezeichnung des Herrschers als τύραννος
  choice: der Tyrann
  alternative: der Herrscher / der König
  rationale: Die wertende Sprache des Erzählers wird bewahrt und nicht zu einer neutralen Amtsbezeichnung abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Aufzählung und der zum folgenden Vers hin offene Satzbau des griechischen Textes bleiben erhalten. Seltene Gerätenamen werden verständlich, aber ohne falsche technische Präzision wiedergegeben.
