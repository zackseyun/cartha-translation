  yaml_path: translation/deuterocanon/4_maccabees/008/018.yaml
  text: Why do we delight ourselves in empty schemes and dare a death-bringing disobedience?[a][b]
translation:
  language: de
  text: Warum erfreuen wir uns an nichtigen Vorhaben[a] und wagen todbringenden Ungehorsam[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „leeren Plänen“ oder „vergeblichen Absichten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „todbringenden Ungehorsam“; auch möglich: „tödlichen Ungehorsam“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: Warum
  rationale: In der rhetorischen Frage hat τί mahnenden kausalen Sinn; „Warum“ gibt diesen im Deutschen natürlich wieder.
- source_word: βουλήμασιν κενοῖς
  choice: an nichtigen Vorhaben
  rationale: βουλήμασιν bezeichnet Pläne, Absichten oder Entschlüsse; κενοῖς bewertet sie als gehaltlos und vergeblich. „Nichtige Vorhaben“ bewahrt sowohl den beabsichtigten Charakter als auch die negative Wertung.
- source_word: ἑαυτοὺς εὐφραίνομεν
  choice: erfreuen wir uns
  rationale: Die reflexive Wendung bedeutet, sich selbst zu erfreuen oder Freude zu haben. Die deutsche Formulierung wahrt die Reflexivität und die ironische Spannung, dass die Freude nichtigen Vorhaben gilt.
- source_word: θανατηφόρον
  choice: todbringenden
  rationale: Das Kompositum bezeichnet etwas, das Tod bringt. „Todbringend“ erhält dieses aktive Bild deutlicher als das allgemeinere „tödlich“.
- source_word: ἀπειθίαν
  choice: Ungehorsam
  rationale: ἀπειθία bezeichnet die Weigerung zu gehorchen. „Ungehorsam“ ist direkt und vermeidet die stärkere, möglicherweise überdeutende Wiedergabe „Auflehnung“.
- source_word: τολμῶμεν
  choice: wagen
  rationale: τολμῶμεν drückt kühnes oder vermessenes Unternehmen aus. „Wagen“ bewahrt die knappe Form und den tadelnden Unterton.
theological_decisions:
- issue: Moralische Einordnung von ἀπειθία
  choice: Ungehorsam
  alternative: Auflehnung oder Trotz
  rationale: Der Vers verurteilt die Gehorsamsverweigerung als todbringend, doch das griechische Wort verlangt keine stärker theologisch aufgeladene Wiedergabe. „Ungehorsam“ lässt Art und Bezug des Ungehorsams so offen wie der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Verbindung „Ungehorsam wagen“ folgt bewusst der knappen griechischen Konstruktion und bewahrt ihre rhetorische Schärfe; die Fußnoten dokumentieren natürliche lexikalische Alternativen.
