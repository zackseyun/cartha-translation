  text: Not even the law itself [compels] us willingly—[a]
translation:
  language: de
  text: Nicht einmal das Gesetz selbst [zwingt] uns freiwillig —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier vorgelegte griechische Wortlaut ist syntaktisch unvollständig (wörtlich etwa: »auch/nicht einmal das Gesetz selbst freiwillig uns«). Das eingeklammerte Verb wurde zur Lesbarkeit redaktionell ergänzt und steht nicht im überlieferten Textausschnitt.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδὲ
  choice: Nicht einmal
  rationale: Die Verbindung setzt die Verneinung steigernd fort; »Nicht einmal« gibt diese nachdrückliche Kraft im Deutschen natürlich wieder.
- source_word: αὐτὸς
  choice: selbst
  rationale: Bei ὁ νόμος ist αὐτός intensiv gebraucht und hebt das Gesetz als solches hervor.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Die Wendung bezeichnet schlicht das Gesetz; die Großschreibung entspricht der deutschen Substantivschreibung und entscheidet keine weitergehende Titelfrage.
- source_word: ἑκουσίως
  choice: freiwillig
  rationale: Das Adverb bedeutet »freiwillig, aus freien Stücken«; wegen des unvollständigen Satzbaus bleibt offen, worauf es sich genau bezieht.
- source_word: ἡμᾶς
  choice: uns
  rationale: Akkusativpronomen der ersten Person Plural.
theological_decisions:
- issue: Unvollständige Syntax des überlieferten griechischen Wortlauts
  choice: Den vorhandenen Wortlaut wiedergeben und das zum Verständnis ergänzte Verb in eckige Klammern setzen
  alternative: Nicht einmal das Gesetz selbst nötigt uns aus freien Stücken
  rationale: Der gelieferte griechische Text οὐδὲ αὐτὸς ὁ νόμος ἑκουσίως ἡμᾶς bildet keinen vollständigen Satz. Die Klammern machen sichtbar, dass »zwingt« eine redaktionelle Ergänzung und kein im vorgelegten Wortlaut belegtes Wort ist; zugleich bleibt die unsichere Zuordnung von ἑκουσίως erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas sperrige Stellung von »freiwillig« wird bewusst beibehalten, weil der griechische Text unvollständig ist und seine genaue syntaktische Zuordnung offenbleibt.
