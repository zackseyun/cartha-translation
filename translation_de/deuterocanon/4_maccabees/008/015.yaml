  yaml_path: translation/deuterocanon/4_maccabees/008/015.yaml
  text: But when they heard the inducements and saw the tortures[a], they not only were not afraid, but even reasoned philosophically with the tyrant[c][b],
translation:
  language: de
  text: Als sie aber die Lockangebote hörten und die schrecklichen Dinge sahen[a], hatten sie nicht nur keine Angst, sondern argumentierten sogar philosophisch gegen den Tyrannen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind im Zusammenhang Folterwerkzeuge, angedrohte Qualen oder sonstige Schrecken, die man ihnen vor Augen stellte; wörtlich steht hier »schreckliche Dinge«.
    reason: lexical_alternative
  - marker: b
    text: 'Das seltene griechische Wort bedeutet wörtlich etwa: »sie philosophierten gegen ihn«. Es betont ihren vernünftig begründeten, philosophischen Widerstand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγωγὰς
  choice: die Lockangebote
  rationale: Das Substantiv bezeichnet hier Versuche, die Brüder durch Anreize oder verlockende Zusagen für sich zu gewinnen. „Lockangebote“ wahrt den werbenden und zugleich manipulativen Charakter, ohne den Ausdruck auf bloße mündliche Überredung einzuengen.
- source_word: δεινά
  choice: die schrecklichen Dinge
  rationale: Das substantivierte Adjektiv ist wörtlich und absichtlich weit gefasst. Im Zusammenhang sind Folterwerkzeuge, drohende Qualen oder andere Schrecken gemeint; die offene Wiedergabe vermeidet eine unbelegte Verengung auf bereits vollzogene Folterungen.
- source_word: οὐ μόνον οὐκ ἐφοβήθησαν
  choice: fürchteten sie sich nicht nur nicht
  rationale: Die Formulierung bewahrt die betonte griechische Doppelstruktur οὐ μόνον οὐκ und klingt trotz ihrer Markiertheit im Deutschen verständlich.
- source_word: ἀντεφιλοσόφησαν
  choice: hielten ... mit philosophischen Argumenten entgegen
  rationale: Das seltene Kompositum bezeichnet ein philosophisch begründetes Entgegentreten. Die Wiedergabe hält sowohl die Gegenrichtung von ἀντι- als auch den ausdrücklichen Bezug auf Philosophie fest und ist zugleich natürlicher als „gegenphilosophierten“.
- source_word: τῷ τυράννῳ
  choice: dem Tyrannen
  rationale: „Tyrann“ entspricht der ausdrücklichen moralischen Kennzeichnung des Herrschers und sollte nicht zum neutraleren „König“ abgeschwächt werden.
theological_decisions:
- issue: Wiedergabe der φιλοσοφ-Komponente in 4 Makkabäer
  choice: Den philosophischen Begriff im Haupttext ausdrücklich bewahren
  alternative: „widersprachen dem Tyrannen“ oder „argumentierten mit dem Tyrannen“
  rationale: Die philosophische Sprache gehört zur bewussten Darstellung vernunftgeleiteter jüdischer Standhaftigkeit im Buch. Eine allgemeine Wiedergabe als bloßes Widersprechen würde diesen argumentativen Leitgedanken einebnen.
- issue: Konkretheit von δεινά im Martyriumskontext
  choice: Die lexikalische Offenheit als „schreckliche Dinge“ erhalten und den Kontext in einer Fußnote erläutern
  alternative: „Folterungen“
  rationale: Obwohl der Zusammenhang eindeutig auf drohende Qualen und Folterschrecken weist, bedeutet δεινά selbst nicht ausdrücklich „Folterungen“. Die offenere Haupttextfassung bewahrt die echte Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Wendung „nicht nur nicht“ bildet die griechische Hervorhebung nach. „Mit philosophischen Argumenten entgegenhalten“ wahrt den Leitbegriff Philosophie, ohne im Deutschen ein künstliches Verb zu bilden.
