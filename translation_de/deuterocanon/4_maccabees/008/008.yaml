lexical_decisions:
- source_word: μεταλαβόντες
  choice: angenommen hatten
  rationale: Das Aoristpartizip von μεταλαμβάνω bezeichnet hier zusammen mit dem Genitiv Ἑλληνικοῦ βίου die Hinwendung zu beziehungsweise Übernahme einer Lebensweise. Die vorzeitige Wiedergabe mit „angenommen hatten“ ist im Deutschen natürlich und bewahrt den abgeschlossenen participialen Sinn.
- source_word: Ἑλληνικοῦ
  choice: griechische
  rationale: Das Adjektiv bezeichnet unmittelbar das Griechische beziehungsweise Hellenische; „griechisch“ ist die klare, heutige Entsprechung.
- source_word: βίου
  choice: Lebensweise
  rationale: βίος meint hier nicht bloß das Leben an sich, sondern die kulturell geprägte Art zu leben. „Lebensweise“ gibt diesen Sinn prägnant und würdig wieder.
