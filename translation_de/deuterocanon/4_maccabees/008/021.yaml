translation:
  language: de
  text: Alter;[a] und lasst uns bedenken, dass wir sterben werden, wenn wir nicht gehorchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text beginnt unvermittelt mit dem einzelnen Wort „Alter“, das wahrscheinlich den Gedanken des vorhergehenden Satzteils fortsetzt. Diese Übersetzung bewahrt den abrupten Anschluss, statt fehlende Wörter zu ergänzen.
    reason: textual_variant
lexical_decisions:
- source_word: γῆρας
  choice: Alter
  rationale: Das Substantiv bezeichnet das Alter beziehungsweise hohe Alter. Die knappe, isolierte Wiedergabe bewahrt den fragmentarischen Anschluss des griechischen Textes.
- source_word: ἐνθυμηθῶμεν
  choice: lasst uns bedenken
  rationale: Der hortative Konjunktiv der ersten Person Plural fordert zum bewussten Erwägen auf; „lasst uns bedenken“ ist natürlich und wahrt diesen auffordernden Charakter.
- source_word: ἀπειθοῦντες
  choice: wenn wir nicht gehorchen
  rationale: Das Partizip kann hier sinngemäß konditional verstanden werden. Die Formulierung gibt die praktische Warnung in klarem modernem Deutsch wieder, ohne den Gegenstand des Ungehorsams zu ergänzen.
- source_word: τεθνηξόμεθα
  choice: wir sterben werden
  rationale: Die Futurform von θνῄσκω bezeichnet die angekündigte Folge schlicht als künftigen Tod.
