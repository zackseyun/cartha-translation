  source_fidelity: „Alter“ gibt γῆρας treffend wieder und bewahrt die isolierte, offenbar an den vorhergehenden Zusammenhang anschließende Satzöffnung. „Lasst uns bedenken“ entspricht dem hortativen Konjunktiv ἐνθυμηθῶμεν. Die konditionale Wiedergabe von ἀπειθοῦντες mit „wenn wir nicht gehorchen“ ist im Deutschen idiomatisch und wahrt die Warnfunktion; „wir sterben werden“ gibt τεθνηξόμεθα angemessen als Zukunftsfolge wieder.
  naturalness: Der Text ist klares modernes Standarddeutsch. Die Abfolge „dass wir sterben werden, wenn wir nicht gehorchen“ ist natürlich; die auffällige Eröffnung „Alter;“ ist absichtlich textnah und wird durch die Anmerkung verständlich gemacht.
