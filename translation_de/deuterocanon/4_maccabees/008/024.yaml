  text: of the sweet world[a]. Let us not force necessity[b], nor let us boast in our own torture-rack.
translation:
  language: de
  text: der süßen Welt. Lasst uns die Notwendigkeit nicht erzwingen[a] und uns auch nicht unserer eigenen Folterbank rühmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lasst uns das Unausweichliche nicht beschleunigen« oder »Lasst uns der Notwendigkeit keine Gewalt antun.« Die griechische Wendung ist stark verdichtet und kann davor warnen, die unausweichliche Prüfung eigenmächtig herbeizuführen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: »unserer eigenen Streckbank«. Das griechische Wort bezeichnet ein Folterinstrument.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλυκέος κόσμου
  choice: der süßen Welt
  rationale: Die Genitivfügung setzt den vorangehenden Satz fort. »Süß« bewahrt das Bild für die Anziehungskraft des gegenwärtigen Lebens, ohne es zu »angenehm« oder »lieb« zu verflachen.
- source_word: μὴ βιαζώμεθα
  choice: Lasst uns … nicht erzwingen
  rationale: Der hortative Konjunktiv wird als gemeinsame Aufforderung wiedergegeben. »Erzwingen« erhält den Gedanken gewaltsamen Drängens, auch wenn die knappe griechische Wendung mehrere Deutungen zulässt.
- source_word: τὴν ἀνάγκην
  choice: die Notwendigkeit
  rationale: Die abstrakte Ausdrucksweise des Griechischen bleibt erhalten und wird nicht vorschnell auf die unausweichliche Prüfung oder den Tod eingeengt.
- source_word: μηδὲ κενοδοξήσωμεν
  choice: und uns auch nicht … rühmen
  rationale: »Sich rühmen« ist eine würdige, natürliche Wiedergabe; der im Verb enthaltene Gedanke eitlen oder nichtigen Ruhms ergibt sich aus der Warnung und wird nicht durch eine schwerfällige Formulierung überbetont.
- source_word: ἐπὶ τῇ ἑαυτῶν στρέβλῃ
  choice: unserer eigenen Folterbank
  rationale: στρέβλη bezeichnet hier ein Folterinstrument, insbesondere die Streck- oder Folterbank. Der reflexive Ausdruck »unserer eigenen« bleibt erhalten; der deutsche Genitiv fügt sich idiomatisch zu »sich rühmen«.
theological_decisions:
- issue: Sinn von μὴ βιαζώμεθα τὴν ἀνάγκην
  choice: Die komprimierte Wendung bleibt wörtlich als »die Notwendigkeit nicht erzwingen« stehen.
  alternative: »Lasst uns das Unausweichliche nicht beschleunigen« oder »Lasst uns der Notwendigkeit keine Gewalt antun«
  rationale: Im Zusammenhang kann die Aufforderung davor warnen, die unausweichliche Prüfung aus Ruhmsucht selbst herbeizuführen oder zu beschleunigen. Da das Griechische aber auch anders verstanden werden kann, legt der Haupttext die genaue Beziehung zwischen Gewalt und Notwendigkeit nicht endgültig fest.
- issue: Bezug des Rühmens auf die Folterbank
  choice: Die Brüder sollen sich nicht ihrer eigenen Folterbank rühmen.
  alternative: Sie sollen wegen ihrer eigenen Qual keinen eitlen Ruhm suchen.
  rationale: Die konkrete Wiedergabe wahrt das Folterinstrument und die Spannung zwischen standhaftem Martyrium und selbstgefälligem Streben nach Ruhm, ohne eine Lehre über das Martyrium hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang ist als Fortsetzung des vorangehenden Satzes kleingeschrieben und im Genitiv belassen. Die ungewöhnliche Wendung »die Notwendigkeit erzwingen« wird bewusst nicht geglättet; eine Fußnote erschließt die wichtigsten Deutungsmöglichkeiten.
