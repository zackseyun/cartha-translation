base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/017.yaml
  text: Alas for us! How miserable and utterly foolish we are! When the king urges us and calls us to receive a benefit[a], should we not be persuaded by him?
translation:
  language: de
  text: Wehe uns! Wie elend und völlig unverständig sind wir! Der König redet uns zu und ruft uns, um uns Gutes zu erweisen – sollten wir uns nicht von ihm überzeugen lassen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollten wir ihm nicht gehorchen?“ Das griechische Wort kann bedeuten, sich überzeugen zu lassen, und davon ausgehend auch, nachzugeben oder zu gehorchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ τάλανες ἡμεῖς
  choice: Wehe uns! Wie elend ... sind wir!
  rationale: Die klagende Ausrufung und die Selbstbezeichnung als elend werden in natürlichem, würdigem Deutsch bewahrt.
- source_word: λίαν ἀνόητοι
  choice: völlig unverständig
  rationale: λίαν verstärkt ἀνόητοι deutlich; „völlig unverständig“ gibt die scharfe Selbstverurteilung wieder, ohne unnötig umgangssprachlich zu wirken.
- source_word: βασιλέως
  choice: der König
  rationale: Gemeint ist der aus dem Kontext bekannte König; im Deutschen ist daher der bestimmte Artikel sachgerecht.
- source_word: παρακαλοῦντος
  choice: redet uns zu
  rationale: παρακαλέω bezeichnet hier ein eindringliches Zureden mit dem Ziel, die Angesprochenen umzustimmen.
- source_word: ἐπὶ εὐεργεσίᾳ φωνοῦντος
  choice: ruft uns, um uns Gutes zu erweisen
  rationale: Die Wendung stellt den Ruf des Königs in den Zusammenhang einer angebotenen Wohltat. Die Übersetzung bleibt gegenüber möglichen Nuancen wie Gunst oder Wohltat hinreichend offen.
- source_word: μὴ πεισθείημεν αὐτῷ;
  choice: sollten wir uns nicht von ihm überzeugen lassen?
  rationale: Die mediale/passive Form von πείθω bewahrt zunächst den Gedanken des Überzeugtwerdens; das im Kontext mitgemeinte Nachgeben oder Gehorchen wird in einer Fußnote genannt.
