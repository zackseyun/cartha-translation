base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/003.yaml
  text: When the tyrant had given these orders[a], seven brothers were brought in with their aged mother[b], handsome and modest and noble and gracious in every way.
translation:
  language: de
  text: Nachdem der Tyrann dies angeordnet hatte, wurden sieben Brüder zusammen mit ihrer betagten Mutter hereingeführt[a] – gut aussehend, anständig, edel und in jeder Hinsicht einnehmend[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »trafen ein, während sie geführt wurden«; das Griechische verbindet ihr Eintreffen damit, dass sie von anderen geführt wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »in jeder Hinsicht liebenswürdig« oder »in jeder Hinsicht gewinnend«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα διαταξαμένου
  choice: Nachdem … dies angeordnet hatte
  rationale: Der Genitivus absolutus bezeichnet eine vorausgehende Handlung. »Anordnen« gibt die verbindliche Bedeutung von διατάσσω in natürlichem Deutsch wieder.
- source_word: τοῦ τυράννου
  choice: der Tyrann
  rationale: τύραννος ist hier eine wertende, nicht bloß neutrale Herrscherbezeichnung; »Tyrann« bewahrt die rhetorische Schärfe des griechischen Textes.
- source_word: παρῆσαν ἀγόμενοι
  choice: wurden … hereingeführt
  rationale: Die Verbindung beschreibt ihr Eintreffen, während sie geführt wurden. Die deutsche Passivform gibt sowohl die Ankunft als auch ihre fehlende Selbstbestimmung idiomatisch wieder.
- source_word: μετὰ γεραιᾶς μητρός
  choice: zusammen mit ihrer betagten Mutter
  rationale: γεραιός bezeichnet hohes Alter; »betagt« ist respektvoll und entspricht dem würdevollen Erzählton.
- source_word: ἑπτὰ ἀδελφοί
  choice: sieben Brüder
  rationale: ἀδελφοί bezeichnet hier ausdrücklich männliche Geschwister.
- source_word: καλοί
  choice: gut aussehend
  rationale: In dieser Personenbeschreibung bezieht sich καλός wahrscheinlich auf ansprechendes Äußeres. »Gut aussehend« ist klarer und natürlicher als das mehrdeutige »schön«.
- source_word: αἰδήμονες
  choice: sittsam
  rationale: Das Wort bezeichnet Schamgefühl, Bescheidenheit und angemessenes Verhalten. »Sittsam« bündelt diese soziale und ethische Bedeutung in würdigem Deutsch.
- source_word: γενναῖοι
  choice: edel
  rationale: γενναῖος kann vornehme Herkunft, edlen Charakter oder Tapferkeit bezeichnen. In der Tugendaufzählung lässt »edel« die breite charakterliche Bedeutung bestehen.
- source_word: ἐν παντὶ χαρίεντες
  choice: in jeder Hinsicht einnehmend
  rationale: χαρίεις bezeichnet Anmut, Liebenswürdigkeit und gewinnendes Auftreten; ἐν παντί weitet dieses Urteil auf jede Hinsicht aus.
theological_decisions:
- issue: Wertende Bezeichnung des Herrschers als τύραννος
  choice: der Tyrann
  alternative: der König / der Herrscher
  rationale: Der griechische Text verwendet bewusst eine moralisch aufgeladene Bezeichnung. Die Übersetzung behält diese Wertung bei, ohne sie durch einen neutralen Amtstitel abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hält die griechische Beschreibung in einem Satz zusammen und macht zugleich deutlich, dass sich die vier Eigenschaften auf die sieben Brüder beziehen.
