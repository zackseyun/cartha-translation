  text: I urge you, by agreeing with me, to enjoy my friendship[a]; for just as I have power to punish those who disobey my commands[b], so also to do good to those who obey me well.
translation:
  language: de
  text: Ich bitte euch eindringlich, mir nachzugeben und meine Freundschaft[a] zu genießen. Denn ebenso wie ich die Macht habe, diejenigen zu bestrafen, die meinen Anordnungen nicht gehorchen, habe ich auch die Macht, denen Gutes zu tun, die mir bereitwillig gehorchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Meine Freundschaft“ kann im Zusammenhang königlicher Patronage auch „meine Gunst“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Ich bitte euch eindringlich
  rationale: Gibt den nachdrücklichen, werbenden Appell im Kontext einer königlichen Droh- und Lockrede in natürlichem modernem Deutsch wieder.
- source_word: συνείξαντάς μοι
  choice: Gebt mir nach
  rationale: Das schwierige Partizip verlangt hier eine Form des Einlenkens oder Sichfügens. Die imperativische Auflösung ist im Deutschen natürlich und wahrt den geforderten Vollzug der Unterordnung.
- source_word: τῆς ἐμῆς ἀπολαῦσαι φιλίας
  choice: genießt meine Freundschaft
  rationale: ἀπολαύω bezeichnet das Genießen beziehungsweise Teilhaben; φιλία bleibt als „Freundschaft“ erhalten, ohne den königlich-patronalen Beiklang von Gunst auszuschließen.
- source_word: δύναμιν
  choice: die Macht habe
  rationale: Bezeichnet hier sowohl tatsächliche Fähigkeit als auch herrscherliche Gewalt.
- source_word: κολάζειν
  choice: zu bestrafen
  rationale: Entspricht der angedrohten herrscherlichen Sanktion klar und direkt.
- source_word: τοὺς ἀπειθοῦντάς μου τοῖς ἐπιτάγμασιν
  choice: diejenigen, die meinen Anordnungen nicht gehorchen
  rationale: Gibt die Verweigerung des Gehorsams gegenüber verbindlichen Befehlen verständlich und quellennah wieder.
- source_word: εὐεργετεῖν
  choice: Gutes tun
  rationale: Bewahrt die breite Bedeutung des Gewährens von Wohltaten, ohne die konkrete Art der Begünstigung festzulegen.
- source_word: τοὺς εὐπειθοῦντάς μου
  choice: die mir bereitwillig gehorchen
  rationale: „Bereitwillig“ bringt die durch εὐ- bezeichnete willige beziehungsweise gute Fügsamkeit idiomatischer zum Ausdruck als ein wörtliches „gut gehorchen“.
theological_decisions:
- issue: Bedeutung der angebotenen φιλία des Herrschers
  choice: Freundschaft
  alternative: Gunst
  rationale: „Freundschaft“ wahrt den unmittelbaren lexikalischen Sinn und die persönliche Ausdrucksweise; die politisch-patronale Bedeutung von königlicher Gunst wird in der Fußnote offengehalten.
- issue: Grad der Fügsamkeit in εὐπειθοῦντας
  choice: bereitwillig gehorchen
  alternative: gehorchen
  rationale: Die Übersetzung bewahrt die verstärkende Nuance des Kompositums, ohne daraus eine besondere theologische Aussage über Gehorsam abzuleiten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Rede verbindet einen eindringlichen Appell mit offener Machtdemonstration; dieser Wechsel zwischen angebotener Nähe, Strafandrohung und versprochener Wohltat bleibt erhalten.
