base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/019.yaml
  text: Shall we not fear the tortures[a], brothers, and reckon with the threats of the torments, and flee this empty glory and deadly arrogance?
translation:
  language: de
  text: Sollten wir uns nicht vor den Foltern fürchten, Brüder, die Drohungen mit Qualen ernst nehmen und diese eitle Ruhmsucht und verderbliche Überheblichkeit fliehen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesen eitlen Ruhm und diese verderbenbringende Prahlerei meiden“.'
    reason: Die Wörter κενοδοξία und ἀλαζονία können neben „Ruhmsucht“ und „Überheblichkeit“ auch als „eitler Ruhm“ und „Prahlerei“ wiedergegeben werden; φεύγω kann in diesem Zusammenhang auch „meiden“ bedeuten.
lexical_decisions:
- source_word: οὐ φοβησόμεθα
  choice: Sollten wir uns nicht … fürchten
  rationale: Das Futur steht hier in einer rhetorisch-überlegenden Frage. „Sollten wir uns nicht“ bewahrt sowohl die Frageform als auch den mahnenden Ton.
- source_word: ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: Die Anrede gilt im Erzählzusammenhang männlichen Geschwistern. „Brüder“ ist im Deutschen natürlich und gibt den ausdrücklich männlichen Bezug wieder; die verstärkende Wirkung von ἄνδρες kommt im feierlichen Anredeton zum Ausdruck.
- source_word: τὰ βασανιστήρια
  choice: die Foltern
  rationale: Der Ausdruck bezeichnet hier Folterungen beziehungsweise Folterstrafen. „Foltern“ ist direkt und legt sich nicht unnötig auf Folterwerkzeuge fest.
- source_word: λογιούμεθα
  choice: ernst nehmen
  rationale: Das Verb bezeichnet ein bedachtes Erwägen oder In-Rechnung-Stellen. In Verbindung mit Drohungen gibt „ernst nehmen“ diesen Sinn in natürlichem modernem Deutsch wieder.
- source_word: τὰς τῶν βασάνων ἀπειλάς
  choice: die angedrohten Qualen
  rationale: Der Genitiv verbindet die Drohungen mit den Qualen. Die kompakte Formulierung vermeidet das schwerfällige „die Drohungen der Qualen“, ohne den Bezug auf die angekündigten Qualen aufzugeben.
- source_word: φεύξομεν
  choice: fliehen
  rationale: Das Verb bedeutet wörtlich „fliehen“ und bezeichnet hier die entschiedene Abkehr von einer Haltung. Die bildhafte Ausdrucksweise bleibt erhalten.
- source_word: τὴν κενοδοξίαν ταύτην
  choice: diese eitle Ruhmsucht
  rationale: κενοδοξία bezeichnet eitlen Ruhm, Ruhmsucht oder leere Selbstgefälligkeit. „Eitle Ruhmsucht“ ist verständlich und bewahrt den Bezug auf nichtigen Ruhm.
- source_word: ὀλεθροφόρον ἀλαζονίαν
  choice: todbringende Überheblichkeit
  rationale: ὀλεθροφόρος bezeichnet etwas, das Verderben oder Tod bringt; ἀλαζονία meint anmaßende Überheblichkeit oder Prahlerei. Die gewählte Wendung ist prägnant und wahrt die zerstörerische Tragweite.
theological_decisions:
- issue: Rhetorische Frage mit drei koordinierten Verben
  choice: Den gesamten Satz als eine zusammenhängende rhetorische Frage wiedergeben
  alternative: Die Folge in eine Aussage oder ausdrückliche Aufforderung umformen
  rationale: Griechische Syntax und Zeichensetzung verbinden fürchten, erwägen und fliehen in einer Frage. Die Übersetzung lässt deren rhetorische Spannung bestehen und legt die erwartete Antwort nicht ausdrücklich fest.
- issue: Geschlechtsspezifische Anrede ἄνδρες ἀδελφοί
  choice: „Brüder“
  alternative: „Geschwister“ oder „Männer, Brüder“
  rationale: Im narrativen Zusammenhang werden männliche Brüder angesprochen. „Geschwister“ würde diesen Bezug verwischen, während „Männer, Brüder“ im Deutschen unnötig hölzern wäre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche rhetorische Frage bleibt erhalten; schwer verständliche Lehnprägungen und unnötig altertümliche Formulierungen werden vermieden.
