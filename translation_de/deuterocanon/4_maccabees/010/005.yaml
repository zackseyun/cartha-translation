base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/005.yaml
  text: But bitterly resenting the man's boldness[a], they dislocated his hands and feet with joint-wrenching instruments, and prying them out of their sockets[b], they dismembered him.
translation:
  language: de
  text: Doch voller Erbitterung über den Freimut des Mannes[a] renkten sie ihm mit Werkzeugen zum Ausrenken der Gelenke[b] Hände und Füße aus; sie hebelten sie aus den Gelenken und rissen ihn Glied für Glied auseinander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »Nachdem sie den Freimut des Mannes bitter ertragen hatten.« Gemeint ist ihre erbitterte Reaktion auf seine offene, furchtlose Rede.'
    reason: lexical_alternative
  - marker: b
    text: Das Griechische verwendet seltene Ausdrücke für Geräte, die auf die Gelenke einwirkten, und für das gewaltsame Auseinanderreißen der Glieder; dadurch wird die Grausamkeit der Folter besonders hervorgehoben.
    reason: cultural_note
lexical_decisions:
- source_word: πικρῶς ἐνέγκαντες
  choice: voller Erbitterung über
  rationale: Die Wendung bedeutet wörtlich etwa, etwas »bitter zu ertragen«. Im Zusammenhang bezeichnet sie die feindselige Reaktion darauf, dass der Mann offen und furchtlos sprach. Die deutsche Fassung gibt diesen Sinn natürlich wieder, ohne die emotionale Schärfe von πικρῶς abzuschwächen.
- source_word: παρρησίαν
  choice: Freimut
  rationale: Das Wort bezeichnet offene, rückhaltlose und furchtlose Rede. »Freimut« ist im Deutschen würdevoll und knapp und bewahrt sowohl den Aspekt der Offenheit als auch den des Mutes.
- source_word: τοῦ ἀνδρός
  choice: des Mannes
  rationale: ἀνήρ bezeichnet hier den männlichen Märtyrer, nicht einen Ehemann.
- source_word: ἀρθρεμβόλοις ὀργάνοις
  choice: mit Werkzeugen zum Zerren an den Gelenken
  rationale: Die seltene Zusammensetzung bezeichnet Foltergeräte, die auf die Gelenke einwirkten und deren Ausrenkung bewirkten. Die Formulierung ist verständlich, konkret und vermeidet eine nicht sicher belegbare technische Bauart.
- source_word: ἐξήρθρουν
  choice: renkten ... aus
  rationale: Das Verb bezeichnet das Ausrenken oder Aus-dem-Gelenk-Bringen. Die deutsche Wendung ist die genaue und geläufige körperliche Entsprechung.
- source_word: ἐξ ἁρμῶν
  choice: aus den Gelenken
  rationale: ἁρμός bezeichnet eine Verbindung oder ein Gelenk. »Aus den Gelenken« bleibt näher am griechischen Ausdruck als eine anatomisch engere Wiedergabe mit »Gelenkpfannen«.
- source_word: ἀναμοχλεύοντες
  choice: hebelten ... aus
  rationale: Das Partizip beschreibt ein gewaltsames Loshebeln. »Hebelten ... aus« bewahrt das mechanische Bild und die Brutalität des Vorgangs.
- source_word: ἐξέμελιζον
  choice: rissen ihn Glied für Glied auseinander
  rationale: Das seltene Verb vermittelt das Bild des Entwurzelns beziehungsweise Zerreißens der Glieder. Die Wiedergabe macht die Verstümmelung deutlich, ohne mehr anatomische Einzelheiten festzulegen, als der griechische Text nennt.
theological_decisions:
- issue: Deutlichkeit der Gewaltdarstellung
  choice: Die Folter wird mit »ausrenkten«, »aus den Gelenken« und »Glied für Glied auseinander« körperlich konkret wiedergegeben.
  alternative: Eine allgemeinere und mildere Wiedergabe wie »misshandelten« oder »verstümmelten ihn«.
  rationale: Der griechische Text beschreibt die Einwirkung auf Hände, Füße und Gelenke ausdrücklich. Eine Abschwächung würde die erzählerisch und theologisch bedeutsame Härte des Martyriums verdecken.
- issue: Bedeutung von πικρῶς ἐνέγκαντες
  choice: Als erbitterte Reaktion auf den Freimut verstanden, mit einer Fußnote zur wörtlicheren Lesart.
  alternative: 'Wörtlicher: »Nachdem sie den Freimut des Mannes bitter ertragen hatten«.'
  rationale: Das Partizip kann formal das Ertragen oder Aufnehmen bezeichnen; mit πικρῶς drückt es hier idiomatisch feindseligen Unwillen aus. Die Hauptfassung ist natürlich, während die Fußnote die sprachliche Spannung bewahrt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem erzählerischem Ton. »Freimut« ist leicht gehoben, aber allgemein verständlich und entspricht dem rhetorischen Gewicht von παρρησία. Die drastische Körperlichkeit des Ausgangstextes wird nicht beschönigt; seltene griechische Folterterminologie wird im Haupttext verständlich umschrieben und in der Fußnote erläutert.
