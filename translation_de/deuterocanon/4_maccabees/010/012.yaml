  text: And when this one had died in a manner worthy of his brothers[a], they dragged forward the fourth, saying,
translation:
  language: de
  text: 'Und nachdem dieser gestorben war, wie es Brüdern geziemt[a], zogen sie den vierten herbei und sagten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »brüdergemäß«. Das griechische Wort bezeichnet ein Sterben auf eine Weise, wie sie Brüdern angemessen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: auch dieser
  rationale: Das Demonstrativpronomen verweist auf den zuvor genannten Bruder. „Dieser“ bewahrt den deiktischen Bezug; „auch“ verdeutlicht im Deutschen natürlich die fortlaufende Reihe, ohne den Sinn zu verändern.
- source_word: θανόντος
  choice: nachdem … gestorben war
  rationale: Der Aoristpartizip im Genitivus absolutus bezeichnet die der nächsten Handlung vorausgehende Todesfolge und wird idiomatisch als temporaler Nebensatz wiedergegeben.
- source_word: ἀδελφοπρεπῶς
  choice: so …, wie es seiner Brüder würdig war
  rationale: Die seltene adverbiale Bildung bezeichnet ein Sterben, das einem Bruder beziehungsweise diesen Brüdern angemessen und ihrer würdig ist. Die Formulierung bewahrt den familiären Bezug und den ehrenden Sinn, ohne die ungewöhnliche griechische Prägung einzuebnen.
- source_word: τὸν τέταρτον
  choice: den vierten
  rationale: Wie im Griechischen bleibt „Bruder“ unausgesprochen, ist aber aus der fortlaufenden Erzählung eindeutig zu ergänzen.
- source_word: ἐπεσπῶντο
  choice: schleppten … herbei
  rationale: Das Verb bezeichnet ein gewaltsames Heranziehen. „Herschleppen“ gibt Zwang und Bewegungsrichtung in der Folter- und Verhörszene natürlich wieder.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip leitet die anschließende direkte Rede ein. Die finite deutsche Koordination ist flüssiger als „sagend“ und wahrt den narrativen Anschluss.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Erzählablauf; der Doppelpunkt kündigt die im nächsten Vers folgende direkte Rede an. Die ungewöhnliche Bedeutung von ἀδελφοπρεπῶς wird im Text verständlich formuliert und in der Fußnote wörtlicher erschlossen.
