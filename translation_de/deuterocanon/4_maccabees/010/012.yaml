review_pass:
  verdict: revise
  source_fidelity: Die Satzglieder und der zeitliche Ablauf werden im Entwurf grundsätzlich zutreffend wiedergegeben. Das hinzugesetzte „auch“ hat jedoch keine ausdrückliche Grundlage im griechischen Text. ἀδελφοπρεπῶς bezeichnet ein Sterben in einer für Brüder passenden bzw. brüderlichen Weise; die Formulierung „wie es seiner Brüder würdig war“ ist im Deutschen semantisch verschoben und unnötig schwer verständlich.
  naturalness: „Nachdem dieser ... gestorben war“ und „zogen sie den vierten herbei“ sind idiomatisches modernes Standarddeutsch. „wie es Brüdern geziemt“ gibt den gehobenen erzählerischen Registerton natürlich wieder.
  terminology: Die Fußnote sollte die seltene Bildung knapp als „brüdergemäß“ beziehungsweise „wie es Brüdern geziemt“ erklären, ohne die nicht explizite Deutung „ihrer Stellung“ oder „ihrem Beispiel“ einzutragen. Die implizite Bezeichnung des „vierten“ als Bruder bleibt wie im Griechischen unausgesprochen.
  issues:
  - severity: medium
    issue: „auch dieser“ ergänzt „auch“, das im griechischen τούτου nicht ausgedrückt ist.
    rationale: Das Demonstrativum verweist auf den zuvor genannten Bruder, fügt aber keine additive Partikel hinzu.
  - severity: medium
    issue: „wie es seiner Brüder würdig war“ gibt ἀδελφοπρεπῶς unklar und nicht präzise wieder.
    rationale: Die griechische -πρεπής-Bildung meint, was Brüdern angemessen ist, nicht primär, was der Brüder würdig ist. Die bisherige Fußnote verstärkt dies zudem durch zusätzliche, interpretierende Aussagen.
