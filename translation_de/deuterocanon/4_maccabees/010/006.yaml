lexical_decisions:
- source_word: περίειλκον
  choice: sie rissen … ab
  rationale: Das Imperfekt bezeichnet hier die fortgesetzte gewaltsame Abtrennung der aufgezählten Körperteile. „Abreißen“ gibt die Brutalität der Folterszene in natürlichem Deutsch wieder, ohne die Art des Vorgangs genauer festzulegen, als es der griechische Ausdruck tut.
- source_word: δακτύλους
  choice: Finger
  rationale: Dies ist hier die gewöhnliche anatomische Bedeutung.
- source_word: βραχίονας
  choice: Arme
  rationale: „Arme“ ist die naheliegende und allgemein verständliche Wiedergabe; eine engere Bestimmung als „Unterarme“ ist möglich, aber vom Kontext nicht gefordert.
- source_word: σκέλη
  choice: Beine
  rationale: Der Ausdruck bezeichnet hier die Beine; „Unterschenkel“ wäre enger und im Deutschen unnötig spezifisch.
- source_word: ἀγκῶνας
  choice: Ellbogen
  rationale: Das Wort bezeichnet gewöhnlich die Ellbogen beziehungsweise die Armbeugen. „Ellbogen“ bewahrt die direkte, drastische Aufzählung des griechischen Textes.
