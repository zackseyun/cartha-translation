base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/001.yaml
  text: And after he had endured this death[a], worthy to be sung of, the third was led in[b], being urged much by many to save himself by tasting it.
translation:
  language: de
  text: Nachdem dieser den ruhmwürdigen Tod[a] standhaft ertragen hatte, wurde der dritte vorgeführt. Viele redeten ihm eindringlich zu, er solle davon kosten und so sein Leben retten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „den besangenswerten Tod“, also einen Tod, der rühmend besungen und im Gedächtnis bewahrt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: Er sollte von den verbotenen Speisen kosten und dadurch sein Leben bewahren.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀοίδιμον
  choice: ruhmwürdigen
  rationale: Das Adjektiv bezeichnet wörtlich etwas, das besungen beziehungsweise rühmend gefeiert wird. „Ruhmwürdig“ bewahrt den gehobenen, ehrenden Ton, ohne im Deutschen unnatürlich zu wirken.
- source_word: καρτερήσαντος
  choice: standhaft ertragen hatte
  rationale: Das Partizip betont beharrliches Ausharren im Leiden; „standhaft ertragen“ gibt sowohl das Erdulden als auch die sittliche Festigkeit wieder.
- source_word: ὁ τρίτος ἤγετο
  choice: wurde der dritte vorgeführt
  rationale: Das Passiv bezeichnet, dass der dritte Bruder zur weiteren Prüfung beziehungsweise Folter gebracht wurde. „Vorführen“ entspricht der Szene, ohne ein im Griechischen nicht genanntes Ziel festzulegen.
- source_word: παρακαλούμενος πολλὰ ὑπὸ πολλῶν
  choice: Viele redeten ihm eindringlich zu
  rationale: 'Die Wiedergabe erhält beide Verstärkungen: die Vielzahl der Redenden (ὑπὸ πολλῶν) und die Eindringlichkeit beziehungsweise Ausführlichkeit ihres Zuredens (πολλὰ).'
- source_word: ὅπως ἀπογευσάμενος σώζοιτο
  choice: er solle nur davon kosten und so sein Leben retten
  rationale: Das Kosten ist das Mittel zur Rettung. „Sein Leben retten“ macht den kontextuellen Sinn von σώζοιτο deutlich; „davon“ verweist knapp auf die zuvor genannten verbotenen Speisen, deren Objekt im Griechischen unausgesprochen bleibt.
theological_decisions:
- issue: Martyrologische Erhöhung durch ἀοίδιμον θάνατον
  choice: „den ruhmwürdigen Tod“
  alternative: „den besangenswerten Tod“ oder „den berühmten Tod“
  rationale: „Ruhmwürdig“ wahrt die ehrende, rhetorisch erhöhte Aussage über den Tod des Bruders, ohne eine spätere konfessionelle Deutung einzutragen. Eine Fußnote erhält das konkrete Bild des Besingens.
- issue: Bedeutung von σώζοιτο im unmittelbaren Zusammenhang
  choice: „sein Leben retten“
  alternative: „gerettet werden“
  rationale: Hier geht es konkret darum, durch Nachgeben dem Tod zu entgehen. Die Wiedergabe benennt diese situative Bedeutung, ohne eine geistliche Heilslehre in das Verb hineinzulesen.
- issue: Unausgesprochenes Objekt bei ἀπογευσάμενος
  choice: „davon kosten“ mit erklärender Fußnote
  alternative: „von den verbotenen Speisen kosten“ im Haupttext
  rationale: Das Griechische lässt das Objekt aus dem Zusammenhang erschließen. „Davon“ hält diese Knappheit im Haupttext fest; die Fußnote erläutert den Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz wahrt den gehobenen martyrologischen Ton; der zweite löst die dichte griechische Partizipialkonstruktion zugunsten natürlicher deutscher Lesbarkeit auf. Die Fußnotenmarker [a] und [b] stehen beide im Haupttext.
