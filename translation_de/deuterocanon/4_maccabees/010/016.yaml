  yaml_path: translation/deuterocanon/4_maccabees/010/016.yaml
  text: Go on[a], tyrant, with your tortures, so that even through these you may learn that I am a brother of those who have been tortured before.
translation:
  language: de
  text: „Nur zu, Tyrann, mit deinen Foltern! Damit du auch durch diese erkennst, dass ich ein Bruder derer bin, die zuvor gefoltert worden sind.[a]“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Bruder der zuvor Gefolterten“. Das griechische Partizip bezeichnet diejenigen, die bereits früher gefoltert worden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπιθι
  choice: Nur zu
  rationale: Der Imperativ ist hier eine trotzige Aufforderung beziehungsweise Herausforderung. „Nur zu“ gibt diesen knappen, provozierenden Ton im Deutschen natürlich wieder.
- source_word: τύραννε
  choice: Tyrann
  rationale: Der Vokativ wird als direkte Anrede wiedergegeben und bewahrt sowohl den politischen Sinn als auch die abwertende Wertung.
- source_word: βασάνοις
  choice: mit deinen Foltern
  rationale: Der Dativ Plural bezeichnet hier die Mittel oder Handlungen der Folter. Das Possessivpronomen ist im Deutschen kontextuell sinnvoll, obwohl es im Griechischen nicht ausdrücklich steht.
- source_word: ἵνα καὶ διὰ τούτων μάθῃς
  choice: Damit du auch durch sie erkennst
  rationale: „Damit“ wahrt den Zwecksinn von ἵνα; „auch“ gibt καί wieder. Das Pronomen „sie“ bezieht sich auf die Foltern, und „erkennst“ entspricht dem hier gemeinten erfahrungsbedingten Lernen.
- source_word: ἀδελφός
  choice: ein Bruder
  rationale: Das maskuline Singularwort bezeichnet den Sprecher ausdrücklich als Bruder und betont seine familiäre Verbundenheit mit den zuvor Gefolterten.
- source_word: τῶν προβασανισθέντων
  choice: derer, die vor mir gefoltert wurden
  rationale: Das substantivierte passive Partizip mit προ- bezeichnet Personen, die zeitlich vor dem Sprecher gefoltert wurden. „Vor mir“ macht die relative zeitliche Abfolge im Deutschen klar.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von ἀδελφός im Kontext des Martyriums einer Familie
  choice: ein Bruder
  alternative: eines der Geschwister
  rationale: Das Griechische steht ausdrücklich im maskulinen Singular, und der männliche Sprecher stellt sich zu seinen bereits gefolterten Brüdern. Eine geschlechtsneutrale Form würde diese Aussage unnötig abschwächen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Nur zu“ wahrt den knappen, trotzigen Ton der Herausforderung; der zweite Satz bleibt eng an der griechischen Zweckkonstruktion.
