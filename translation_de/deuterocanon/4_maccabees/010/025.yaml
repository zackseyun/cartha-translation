    issue: Das nicht im Griechischen stehende „dir“ wird in den Übersetzungstext aufgenommen.
    rationale: οὐ δοκεῖ enthält keinen ausdrücklich genannten Beurteiler. Der Kontext erlaubt eine gegen den Gegner gerichtete rhetorische Lesart, aber der deutsche Haupttext sollte diese nicht festlegen. Die vorhandene Fußnote bestätigt selbst, dass „dir“ nicht im griechischen Wortlaut steht.
  - severity: medium
    issue: „Sittlich vollkommenen“ ist stärker als ἔναρετον.
    rationale: ἔναρετος bedeutet tugendhaft bzw. moralisch vortrefflich. Das Wort behauptet keine moralische Vollkommenheit.
