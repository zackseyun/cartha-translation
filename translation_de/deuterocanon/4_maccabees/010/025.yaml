translation:
  language: de
  text: Oder erscheint es nicht als etwas Böses, dass wir den Schöpfer von allem verehren und nach seinem tugendhaften Gesetz leben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακὸν
  choice: etwas Böses
  rationale: Die substantivische Wiedergabe bewahrt die starke moralische Wertung des griechischen Ausdrucks und ist im Deutschen natürlicher als ein bloßes „böse“.
- source_word: οὐ δοκεῖ
  choice: erscheint es dir etwa nicht
  rationale: δοκέω bezeichnet hier den Anschein oder ein wertendes Urteil. Das im Zusammenhang vorausgesetzte Gegenüber wird durch „dir“ ausgedrückt; „etwa“ unterstreicht den rhetorischen Charakter der Frage.
- source_word: τὸν πάντων κτίστην
  choice: den Schöpfer von allem
  rationale: κτίστης bezeichnet den Schöpfer oder Urheber; πάντων umfasst alles Geschaffene, ohne dass der griechische Text ausdrücklich „Dinge“ sagt.
- source_word: εὐσεβοῦμεν
  choice: wir … verehren
  rationale: Das Verb bezeichnet fromme Ehrfurcht gegenüber einer Gottheit. „Verehren“ gibt dies in idiomatischem Deutsch wieder, ohne den Bedeutungsumfang unnötig einzuengen.
- source_word: κατὰ
  choice: nach
  rationale: κατά mit dem Akkusativ bezeichnet hier die Norm, an der sich die Lebensführung ausrichtet. „Nach seinem … Gesetz leben“ ist die natürliche deutsche Formulierung.
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: seinem sittlich vollkommenen Gesetz
  rationale: ἔναρετος bezeichnet moralische Vortrefflichkeit. „Sittlich vollkommen“ bewahrt diese ethische Aussage und vermeidet die im Deutschen unnatürliche Verbindung „tugendhaftes Gesetz“.
- source_word: ζῶμεν
  choice: leben
  rationale: Das Präsens bezeichnet die Lebensführung; „leben“ bleibt schlicht und erhält durch die Ergänzung mit dem Gesetz seinen ethischen Sinn.
theological_decisions:
- issue: Bezug und Stoßrichtung der rhetorischen Frage
  choice: 'Die Sprecherin stellt die Wertung des Gegners infrage: Soll die Verehrung des Schöpfers und das Leben nach seinem Gesetz als etwas Böses gelten?'
  alternative: 'Ohne ausdrücklich genanntes Gegenüber: „Oder erscheint es etwa nicht als etwas Böses …?“'
  rationale: Im Griechischen steht kein ausdrückliches Pronomen der zweiten Person. Der rhetorische Zusammenhang setzt jedoch das Urteil des angeredeten Gegners voraus. „dir“ macht diesen Bezug in natürlichem Deutsch sichtbar, während die Fußnote die grammatische Offenheit festhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe bleibt erhalten; „sittlich vollkommen“ gibt die ausdrückliche moralische Qualität des Gesetzes wieder, ohne unnatürlich von einem „tugendhaften Gesetz“ zu sprechen.
