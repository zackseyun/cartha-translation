base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/021.yaml
  text: But God will swiftly pursue you[a], for you are cutting out the tongue that sings the melodies of divine hymns.
translation:
  language: de
  text: Dich aber wird Gott rasch verfolgen[a]; denn du schneidest die Zunge heraus, die göttliche Hymnen singt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dich aber wird Gott rasch bestrafen« oder »Gott wird dir rasch nachsetzen«. Das griechische Verb kann bedeuten, jemandem nachzugehen oder ihn zu verfolgen; hier steht es im Zusammenhang mit Gottes Gericht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: rasch
  rationale: Das Adverb bezeichnet die schnelle Art des göttlichen Eingreifens, ohne die Aussage allein auf den Zeitpunkt »bald« festzulegen.
- source_word: μετελεύσεται
  choice: wird verfolgen
  rationale: Das Medium von μετέρχομαι kann »hinter jemandem hergehen, verfolgen« bedeuten. Im Drohwort schwingt göttliches Gericht mit, doch die Verfolgungsmetapher bleibt im Haupttext erhalten.
- source_word: ὁ θεός
  choice: Gott
  rationale: Direkte und natürliche Wiedergabe des Subjekts.
- source_word: τὴν ... γλῶτταν
  choice: die Zunge
  rationale: Gemeint ist das konkrete Körperorgan; diese Anschaulichkeit ist für die Folterszene wesentlich.
- source_word: τῶν θείων ὕμνων
  choice: göttlicher Hymnen
  rationale: Bewahrt den erhöhten Klang von θείων und lässt offen, ob die Hymnen als göttlich beziehungsweise heilig oder als auf Gott bezogen charakterisiert werden.
- source_word: μελῳδόν
  choice: die die Melodien ... singt
  rationale: Das attributive Wort beschreibt die Zunge als melodisch singend. Eine verbale Wiedergabe klingt im modernen Deutschen natürlich und erhält den musikalischen Sinn.
- source_word: ἐκτέμνεις
  choice: du schneidest ... heraus
  rationale: Das Präsens entspricht der unmittelbar geschilderten Misshandlung; »die Zunge herausschneiden« ist die natürliche und konkrete deutsche Formulierung.
theological_decisions:
- issue: Art der göttlichen Vergeltung in μετελεύσεται ὁ θεός
  choice: Gott wird den Verfolger im Gericht verfolgen
  alternative: Gott wird dich rasch bestrafen / Gott wird dir rasch nachgehen
  rationale: Der Kontext legt göttliches Gericht nahe, doch das griechische Verb stellt Gott bildhaft als den dar, der dem Täter nachgeht. Der Haupttext bewahrt dieses Bild, statt es auf den abstrakten Begriff »bestrafen« zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperliche Gewalt und das musikalisch-erhabene Bild der hymnensingenden Zunge werden bewusst nebeneinandergestellt; der Satzbau bleibt klar und nah am Griechischen.
