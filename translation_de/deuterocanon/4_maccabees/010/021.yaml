  source_fidelity: 'Die Wiedergabe von ταχέως, μετελεύσεται, γλῶτταν und ἐκτέμνεις ist sachgerecht. Im zweiten Satz verschiebt „die Melodien göttlicher Hymnen singt“ jedoch den Schwerpunkt: τῶν θείων ὕμνων bezeichnet das, was die Zunge singt, nämlich göttliche/heilige Hymnen; μελῳδόν charakterisiert die Zunge als singend bzw. melodieführend. Die Revision hält die Hymnen als direktes Gesungenes fest und bewahrt zugleich den musikalischen Zug.'
  naturalness: „Dich aber wird Gott rasch verfolgen“ ist möglich und die Voranstellung von „Dich aber“ bildet den griechischen Kontrast ab. „die Zunge, die göttliche Hymnen singt“ ist im modernen Standarddeutsch klarer und idiomatischer als „die Melodien göttlicher Hymnen singt“.
  terminology: „Gott“, „Zunge“ und „göttliche Hymnen“ sind registergerecht und quellentreu. „Verfolgen“ bewahrt die bildhafte Aussage von μετελεύσεται, ohne die im Kontext mitschwingende Bestrafung in den Haupttext zu verlagern.
