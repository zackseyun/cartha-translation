translation:
  language: de
  text: Aber diese Dinge sind euer würdig, nicht der Folter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Aber diese Dinge sind euer würdig, nicht der Folter.“ Die Genitive ὑμῶν („euer“) und βασάνων („der Folter[n]“) stehen im Griechischen parallel und werden beide von ἄξια („würdig“) bestimmt.'
    reason: syntactic_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: Aber
  rationale: Die adversative Konjunktion setzt einen scharfen Gegensatz zum vorausgehenden Gedanken; „Aber“ ist die natürliche knappe Entsprechung.
- source_word: ταῦτα
  choice: was … kommt
  rationale: Das substantivische Demonstrativpronomen bezeichnet das soeben Gemeinte. Die idiomatische Umformung mit „was“ bewahrt den offenen Bezug, ohne im Deutschen das schwerfällige „diese Dinge“ zu verwenden.
- source_word: ὑμῶν
  choice: von euch
  rationale: Der Genitiv ist knapp und mehrdeutig; im Zusammenhang kann er Herkunft oder Urheberschaft ausdrücken, also „von euch“ beziehungsweise „eurerseits“.
- source_word: βασάνων
  choice: der Folter
  rationale: Im Märtyrerkontext bezeichnet βάσανος konkrete Folter beziehungsweise Qualen. Der deutsche Kollektivsingular „Folter“ ist hier natürlicher als der Plural.
- source_word: ἄξια
  choice: nicht einmal würdig
  rationale: ἄξιος mit Genitiv bedeutet „einer Sache würdig“. „Nicht einmal“ gibt die rhetorische Geringschätzung idiomatisch wieder, obwohl „einmal“ nicht ausdrücklich im griechischen Wortlaut steht.
