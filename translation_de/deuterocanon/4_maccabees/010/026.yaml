translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Herausforderung des griechischen Satzes bleibt erhalten; die Mehrdeutigkeit des Genitivs und die leicht dynamische Wiedergabe „nicht einmal“ werden in der Fußnote offengelegt.
