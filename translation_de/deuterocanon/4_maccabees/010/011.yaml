  text: But because of your ungodliness and blood-guilt[a], you will endure unending torments.
translation:
  language: de
  text: Du aber wirst wegen deiner Gottlosigkeit und Blutschuld[a] Qualen erdulden, die kein Ende nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Befleckung durch Blutvergießen“ beziehungsweise „befleckender Mord“. Der griechische Ausdruck verbindet das Vergießen von Blut mit der dadurch verursachten Befleckung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσέβειαν
  choice: Gottlosigkeit
  rationale: Das Wort bezeichnet mangelnde Ehrfurcht beziehungsweise Frevel gegenüber Gott. „Gottlosigkeit“ ist im heutigen Deutsch verständlich und bewahrt die religiös-moralische Aussage.
- source_word: μιαιφονίαν
  choice: Blutschuld
  rationale: Der seltene Ausdruck verbindet das Vergießen von Blut mit der dadurch entstehenden moralischen oder kultischen Befleckung. „Blutschuld“ ist eine natürliche, knappe Wiedergabe; die im Wort enthaltene Vorstellung der Befleckung wird in der Fußnote erläutert.
- source_word: ἀκαταλύτους
  choice: die kein Ende nehmen
  rationale: Das Adjektiv bezeichnet etwas, das nicht aufgelöst, beendet oder unterbrochen wird. Die Relativformulierung gibt die zeitliche Unbegrenztheit idiomatisch wieder, ohne den Akzent einseitig auf die Intensität zu verschieben.
- source_word: καρτερήσεις
  choice: wirst … erdulden
  rationale: Die Zukunftsform von καρτερέω bezeichnet standhaftes Aushalten. „Erdulden“ wahrt den Zukunftsbezug und passt natürlich zu schweren Qualen.
- source_word: βασάνους
  choice: Qualen
  rationale: Im Zusammenhang meint das Wort schweres, peinigendes Leiden. „Qualen“ wahrt die Breite des Ausdrucks und beschränkt ihn nicht ausdrücklich auf körperliche Folter.
theological_decisions:
- issue: Religiöse und befleckende Kraft der Anklage gegen den Tyrannen
  choice: „Gottlosigkeit und Blutschuld“ mit einer Fußnote zur im griechischen Ausdruck mitklingenden Befleckung
  alternative: „Frevel und befleckender Mord“
  rationale: Die Übersetzung bewahrt sowohl die gegen Gott gerichtete Verfehlung als auch die Schuld aus vergossenem Blut. Die Fußnote hält die zusätzliche Dimension der Befleckung offen, ohne im Haupttext eine schwer verständliche Neubildung zu verwenden.
- issue: Bedeutung von ἀκαταλύτους für die Dauer der Qualen
  choice: „die kein Ende nehmen“
  alternative: „unaufhörliche“ oder „unbezwingbare Qualen“
  rationale: Die Formulierung bildet die Grundbedeutung „nicht beendet/aufgelöst“ direkt ab und vermeidet es, den Ausdruck lediglich als Aussage über Intensität zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „Du aber“ und das Futur bleiben erhalten; „Blutschuld“ ist verständlich, während die Fußnote die ungewöhnliche Bedeutungsfülle des griechischen Wortes sichert.
