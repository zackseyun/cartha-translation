- source_word: ἔφη
  choice: sagte er
  rationale: Die übliche, natürliche Wiedergabe der erzählerischen Redeeinleitung.
- source_word: δὲ
  choice: nun
  rationale: δέ führt die Erzählung leicht weiter, ohne einen starken Gegensatz auszudrücken; „nun“ bildet diese fortführende Funktion im Deutschen idiomatisch ab.
