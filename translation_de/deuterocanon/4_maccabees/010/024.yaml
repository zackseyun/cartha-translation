  yaml_path: translation/deuterocanon/4_maccabees/010/024.yaml
  text: O hateful and misanthropic man[a], what are you doing by exposing us in this way?
translation:
  language: de
  text: Du Abscheulicher und Menschenfeind! Was tun wir denn, dass du uns auf diese Weise preisgibst[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass du uns auf diese Weise zur Schau stellst“. Das griechische Verb kann bedeuten, jemanden vor- oder öffentlich hinzustellen; im Zusammenhang kann es die öffentliche Preisgabe an Misshandlung oder Strafe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισάρετε
  choice: du Abscheulicher
  rationale: Der vokativische Ausdruck ist ein starkes Schimpfwort. »Du Abscheulicher« gibt seine direkte, verurteilende Kraft in natürlichem Deutsch wieder, ohne eine im Griechischen nicht eindeutig markierte Steigerung einzuführen.
- source_word: μισάνθρωπε
  choice: Menschenfeind
  rationale: Das Kompositum bezeichnet wörtlich einen Menschenhasser. »Menschenfeind« ist verständlich, würdig und bewahrt die persönliche Anrede.
- source_word: τί δρῶντες
  choice: Was haben wir getan
  rationale: δρῶντες ist ein Partizip im Nominativ Plural und bezieht sich daher am ehesten auf die Sprecher (»wir«), nicht auf den singularisch angeredeten Verfolger. Im Deutschen gibt die rückblickende Frage »Was haben wir getan« den Vorwurf idiomatisch wieder.
- source_word: ἡμᾶς
  choice: uns
  rationale: Das Pronomen ist das direkte Objekt der durch προθεῖς bezeichneten Handlung.
- source_word: προθεῖς
  choice: dass du uns … zur Schau stellst
  rationale: Das Partizip von προτίθημι bedeutet, jemanden vor- oder öffentlich hinzustellen. Im Verfolgungskontext vermittelt »zur Schau stellen« die öffentliche Preisgabe, ohne bereits eine bestimmte Art der Misshandlung festzulegen.
- source_word: τοῦτον … τὸν τρόπον
  choice: auf diese Weise
  rationale: Die Wendung bezeichnet die Art und Weise des Handelns und wird so im modernen Deutsch natürlich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Direkte, scharf anklagende Rede in modernem, würdigem Standarddeutsch. Die beiden Schmähwörter bleiben als persönliche Anrede erhalten. Gegenüber der englischen Konsultationsfassung wird τί δρῶντες entsprechend seiner griechischen Pluralform auf die Sprecher bezogen.
