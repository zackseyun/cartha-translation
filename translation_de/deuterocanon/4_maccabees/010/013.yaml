  text: Do not be as insane as your brothers with the same madness, but be persuaded by the king and save yourself.
translation:
  language: de
  text: Verfalle nicht auch du demselben Wahnsinn wie deine Brüder, sondern lass dich vom König überzeugen und rette dich selbst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ μανῇς … τὴν αὐτὴν μανίαν
  choice: Verfalle … demselben Wahnsinn
  rationale: Die Verbindung aus dem Verb μαίνομαι und dem stammverwandten Substantiv μανία wird im Deutschen natürlich und zugleich eindringlich wiedergegeben, ohne die schwerfällige Wiederholung „wahnsinnig … Wahnsinn“ zu erzwingen.
- source_word: καὶ σὺ
  choice: auch du
  rationale: Bewahrt den hervorgehobenen persönlichen Appell an den angesprochenen Bruder.
- source_word: τοῖς ἀδελφοῖς σου
  choice: wie deine Brüder
  rationale: Der Dativ bezeichnet hier den Vergleich beziehungsweise die Gleichstellung mit den Brüdern.
- source_word: πεισθεὶς τῷ βασιλεῖ
  choice: lass dich vom König überzeugen
  rationale: Gibt das Passivpartizip von πείθω und den König als die überzeugende Person direkt wieder; die mögliche Bedeutungsnähe zu „dem König gehorchen“ wird nicht unnötig vereindeutigt.
- source_word: σῶζε σεαυτόν
  choice: rette dich selbst
  rationale: Bewahrt Imperativ, reflexiven Bezug und Nachdruck des griechischen Ausdrucks.
