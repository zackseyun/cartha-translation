  text: if indeed you had human feelings, and had hope from God for deliverance.
translation:
  language: de
  text: Wenn du wirklich menschliche Regungen[a] empfändest und bei Gott Hoffnung auf Rettung[b] hättest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „menschliche Sehnsüchte“ beziehungsweise „menschliche Zuneigung“. Die griechische Wendung ist knapp und grammatisch auffällig; gemeint ist offenbar die gewöhnliche menschliche Verbundenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Heil“. Das griechische Wort kann sowohl Rettung aus unmittelbarer Gefahr als auch Heil in einem umfassenderen Sinn bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπερ
  choice: wenn du wirklich
  rationale: Die Verbindung gibt der Bedingung Nachdruck. „Wenn … wirklich“ bewahrt den rhetorischen Ton, ohne sie kausal als „da ja“ festzulegen.
- source_word: ἠσθάνου
  choice: empfändest
  rationale: Das Verb αἰσθάνομαι bezeichnet hier im Zusammenhang mit πόθων ein emotionales Empfinden, nicht bloß verstandesmäßiges Wahrnehmen.
- source_word: ἀνθρώπους πόθων
  choice: menschliche Regungen
  rationale: Die überlieferte griechische Wendung ist gedrängt und grammatisch auffällig. „Menschliche Regungen“ gibt den erkennbaren Bezug auf gewöhnliche menschliche Sehnsucht oder Zuneigung natürlich wieder, ohne eine bestimmte Einzelregung einzutragen.
- source_word: ἐλπίδα
  choice: Hoffnung
  rationale: „Hoffnung“ ist die sachlich und stilistisch naheliegende Entsprechung.
- source_word: παρὰ θεῷ
  choice: bei Gott
  rationale: παρά mit dem Dativ bezeichnet hier die Beziehung beziehungsweise den Bereich, in dem die Hoffnung besteht. „Bei Gott“ wahrt diese Formulierung genauer als das stärker ursächlich deutende „von Gott“.
- source_word: σωτηρίου
  choice: auf Rettung
  rationale: Das substantivierte σωτήριον bezeichnet Rettung oder Heil. Im unmittelbaren Kontext angedrohter Leiden ist „Rettung“ natürlich, während die weitere Bedeutung „Heil“ in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Bedeutungsumfang von σωτηρίου im Kontext des Martyriums
  choice: Rettung
  alternative: Heil
  rationale: Der örtliche Zusammenhang legt Rettung aus der gegenwärtigen Bedrohung nahe; das griechische Wort kann zugleich umfassenderes Heil bezeichnen. Die Übersetzung entscheidet den theologischen Horizont daher nicht endgültig.
- issue: Beziehungsangabe παρὰ θεῷ
  choice: bei Gott
  alternative: von Gott
  rationale: „Bei Gott“ erhält die im Dativ ausgedrückte relationale Offenheit. „Von Gott“ wäre möglich, würde aber die Herkunft der Rettungshoffnung deutlicher festlegen, als es die Formulierung zwingend verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der irreale Konjunktiv („empfändest“, „hättest“) bildet den vorwurfsvollen Bedingungssatz im Deutschen natürlich ab. „Regungen“ ist verständlich, aber gehoben genug für den rhetorischen Kontext.
