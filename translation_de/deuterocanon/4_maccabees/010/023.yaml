base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/023.yaml
  text: But I myself came forward of my own accord[a], so that by killing me also, you may incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: de
  text: Ich selbst aber trat aus eigenem Entschluss hervor, damit du, indem du auch mich tötest, dir wegen noch mehr Vergehen Strafe von der himmlischen Gerechtigkeit zuziehst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „… damit du, indem du auch mich tötest, wegen noch mehr Vergehen der himmlischen Gerechtigkeit Strafe schuldest.“ Das Griechische beschreibt die Strafe wörtlich als etwas, das man der himmlischen Gerechtigkeit „schuldet“. Gott wird dabei nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθον
  choice: bin … vorgetreten
  rationale: Im Zusammenhang bezeichnet das Verb das bewusste Hervortreten des Sprechers vor den Tyrannen beziehungsweise die Henker; „vorgetreten“ gibt diese zielgerichtete Selbststellung natürlich wieder.
- source_word: ἀπʼ ἐμαυτοῦ
  choice: aus eigenem Entschluss
  rationale: Die Wendung betont, dass der Sprecher freiwillig und aus eigener Initiative handelt.
- source_word: κατακτείνας
  choice: wenn du … tötest
  rationale: Das Aoristpartizip bezeichnet hier eine Begleitumstands- oder Bedingungsrelation zum Hauptverb. Die Wiedergabe wahrt den Bezug auf die erwartete Tötung, ohne eine unnötig starre zeitliche Abfolge festzulegen.
- source_word: ὀφλήσῃς
  choice: schuldest
  rationale: Das Verb bedeutet wörtlich „schulden“ und bezeichnet im gerichtlichen Zusammenhang die Verpflichtung beziehungsweise Haftung für eine Strafe. Die Formulierung bewahrt zugleich die Konstruktion mit dem Dativ der himmlischen Gerechtigkeit.
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: der himmlischen Gerechtigkeit
  rationale: δίκη kann Gerechtigkeit, Rechtsprechung oder Strafgewalt bezeichnen. Der Dativ wird formal als Bezug der geschuldeten Strafe erhalten; „himmlisch“ wahrt den transzendenten Bezug, ohne Gott ausdrücklich zu nennen.
- source_word: τιμωρίαν
  choice: Strafe
  rationale: Das Substantiv bezeichnet die vergeltende Straffolge. „Strafe“ ist im modernen Deutschen klar und vermeidet die stärkere persönliche Färbung von „Rache“.
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: wegen noch mehr Vergehen
  rationale: ἀδίκημα bezeichnet eine konkrete unrechte Tat oder ein Vergehen; πλειόνων weist hier am ehesten auf eine weitere Vermehrung der Vergehen hin.
theological_decisions:
- issue: Wiedergabe von τῇ οὐρανίᾳ δίκῃ als Ausdruck transzendenter moralischer Vergeltung
  choice: der himmlischen Gerechtigkeit
  alternative: dem himmlischen Gericht / der göttlichen Gerechtigkeit
  rationale: Der griechische Text nennt Gott nicht ausdrücklich. „Himmlische Gerechtigkeit“ erhält sowohl die personifizierende Offenheit von δίκη als auch die theologische Zurückhaltung des Originals; „göttlich“ würde den Bezug stärker ausdeuten, „Gericht“ den abstrakten beziehungsweise personifizierten Gerechtigkeitsbegriff verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas markante Formulierung „der himmlischen Gerechtigkeit Strafe schulden“ bewahrt das gerichtliche Schuldverhältnis des griechischen ὀφείλω mit Dativ und vermeidet eine explizitere Gottesbezeichnung als im Ausgangstext.
