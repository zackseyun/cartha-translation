  yaml_path: translation/deuterocanon/4_maccabees/010/010.yaml
  text: But we[a], O most defiled tyrant, suffer these things for the sake of the discipline and virtue of God.
translation:
  language: de
  text: Wir aber, du durch und durch befleckter Tyrann, erleiden dies wegen der Erziehung und Tugend Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen der göttlichen Erziehung und Tugend“. Der Genitiv „Gottes“ kann sowohl „Erziehung“ als auch „Tugend“ näher bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς μέν
  choice: Wir aber
  rationale: μέν hebt die Sprecher kontrastierend hervor; „Wir aber“ gibt diesen Gegensatz im Deutschen knapp und natürlich wieder.
- source_word: ὦ μιαρώτατε τύραννε
  choice: du durch und durch befleckter Tyrann
  rationale: μιαρώτατε ist der Superlativ eines Ausdrucks für kultische oder moralische Befleckung. Die Wendung bewahrt sowohl die Schärfe der Anrede als auch den Unreinheitsklang.
- source_word: διὰ παιδείαν
  choice: um der Erziehung willen
  rationale: παιδεία bezeichnet Erziehung, Schulung oder Zucht. „Erziehung“ wahrt den umfassenden Gedanken religiös-sittlicher Formung, ohne ihn auf bloße Bestrafung oder schulischen Unterricht einzuengen.
- source_word: καὶ ἀρετὴν
  choice: und Tugend
  rationale: ἀρετή bezeichnet hier sittliche Tüchtigkeit beziehungsweise Tugend; „Tugend“ passt zum ethischen Kontext und bleibt prägnant.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der nachgestellte Genitiv kann sich auf beide verbundenen Substantive beziehen. Die ausdrückliche Genitivform wird beibehalten, damit die Beziehung zu Gott nicht paraphrasierend festgelegt wird.
- source_word: ταῦτα πάσχομεν
  choice: erleiden dies
  rationale: πάσχομεν bedeutet „leiden/erleiden“; das singularische „dies“ verweist im Deutschen natürlich auf das gesamte gegenwärtige Martyrium.
theological_decisions:
- issue: Bezug und Bedeutung von θεοῦ bei παιδείαν καὶ ἀρετήν
  choice: „der Erziehung und Tugend Gottes“; der Genitiv bleibt formal erhalten und kann beide Substantive bestimmen
  alternative: „göttlicher Erziehung und Tugend“ oder „Erziehung und Tugend von Gott her“
  rationale: Der griechische Genitiv lässt offen, ob Zugehörigkeit, göttliche Prägung oder Herkunft im Vordergrund steht. Eine wörtlichere Genitivfügung bewahrt diese Spannung und vermeidet die Festlegung, Gott selbst werde erzogen.
- issue: Bedeutung von διά mit Akkusativ
  choice: 'final beziehungsweise motivierend: „um … willen“'
  alternative: 'kausal: „wegen/aufgrund“'
  rationale: διά mit Akkusativ kann den Beweggrund oder Zweck bezeichnen. „Um … willen“ entspricht dem Bekenntnischarakter der Aussage, ohne eine rein kausale Lesart auszuschließen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Schmähanrede bleibt kraftvoll; „durch und durch befleckt“ vermittelt den moralisch-religiösen Beiklang von μιαρός verständlicher als das heute missverständliche „unreinster“.
