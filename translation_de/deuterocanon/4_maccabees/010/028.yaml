  yaml_path: translation/deuterocanon/4_maccabees/010/028.yaml
  text: Now look[a], being alien to God[c][b], you are making war against those who are reverent toward God.
translation:
  language: de
  text: 'Jetzt sieh doch: Du, der du Gott fremd bist[a], führst Krieg[b] gegen die, die Gott gegenüber ehrfürchtig sind.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „von Gott entfremdet“ oder „Gott fern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „kämpfst du gegen“ oder „bekriegst du“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „die sich Gott gegenüber ehrfürchtig verhalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν ἰδὲ
  choice: Nun sieh doch
  rationale: νῦν markiert den gegenwärtigen, zugespitzten Schluss; ἰδέ ist ein Aufmerksamkeitsimperativ. „Sieh doch“ klingt im modernen Deutschen natürlich und bewahrt den konfrontativen Nachdruck.
- source_word: ἀλλότριος ὢν θεοῦ
  choice: Gott entfremdet
  rationale: ἀλλότριος mit Genitiv bezeichnet das Fremd- oder Nichtzugehörigsein gegenüber jemandem. „Entfremdet“ gibt die relationale und theologische Schärfe wieder, ohne eine weitergehende metaphysische Aussage einzutragen; die knappe Partizipialfügung lässt den logischen Bezug zum Hauptsatz offen.
- source_word: πολεμεῖς
  choice: führst du Krieg gegen
  rationale: Das Verb bezeichnet aktive kriegerische Feindschaft. „Krieg führen gegen“ bewahrt das starke Bild deutlicher als das allgemeinere „bekämpfen“.
- source_word: τοὺς εὐσεβοῦντας εἰς τὸν θεόν
  choice: die, die Gott ehrfürchtig verehren
  rationale: Die substantivierte Partizipialform bezeichnet Menschen, die Gott gegenüber εὐσέβεια zeigen. Die verbale Wiedergabe bewahrt ihr Handeln und verbindet Ehrfurcht mit der ausdrücklich auf Gott gerichteten Frömmigkeit.
theological_decisions:
- issue: Relationale Bedeutung von ἀλλότριος θεοῦ
  choice: Gott entfremdet
  alternative: Gott fremd / von Gott getrennt
  rationale: Der Ausdruck beschreibt die Fremdheit des Angeredeten gegenüber Gott. „Entfremdet“ wahrt diese ernste Beziehungsaussage, ohne sie als absolute oder metaphysisch definierte Trennung auszudeuten.
- issue: Syntaktischer Bezug des Partizips ὢν
  choice: knappe begleitende Partizipialfügung ohne ausdrückliche Konjunktion
  alternative: weil du Gott entfremdet bist / obwohl du Gott entfremdet bist
  rationale: Das Griechische legt nicht ausdrücklich fest, ob der Umstand kausal, konzessiv oder lediglich begleitend zu verstehen ist. Die deutsche Fügung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nun sieh doch“ erhält den direkten, anklagenden Ton; „führst du Krieg“ bewahrt das kräftige Bild. Die ungewöhnlich knappe Fügung „Gott entfremdet“ ist bewusst leicht literarisch, damit die im griechischen Partizip offene Sinnbeziehung nicht durch „weil“ oder „obwohl“ festgelegt wird.
