  text: For the sake of God[a], we gladly have the limbs of our body mutilated.
translation:
  language: de
  text: Für Gott lassen wir uns gern die Glieder unseres Körpers verstümmeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέως
  choice: gern
  rationale: Das Adverb bezeichnet bereitwillige, bejahende Entschlossenheit. „Gern“ klingt im heutigen Deutsch natürlich und vermeidet die möglicherweise unpassende Vorstellung körperlicher Freude, die „mit Freuden“ hervorrufen könnte.
- source_word: ὑπὲρ τοῦ θεοῦ
  choice: um Gottes willen
  rationale: ὑπέρ mit Genitiv bezeichnet hier den Beweggrund beziehungsweise die Sache, für die das Leiden erduldet wird. „Um Gottes willen“ gibt dies prägnant wieder, ist jedoch wegen einer möglichen idiomatischen Nebenbedeutung mit einer Fußnote versehen.
- source_word: τὰ τοῦ σώματος μέλη
  choice: die Glieder unseres Körpers
  rationale: μέλη meint die Körperglieder. Der Genitiv τοῦ σώματος wird natürlich als Zugehörigkeit ausgedrückt; „unseres“ ergibt sich aus dem Subjekt der ersten Person Plural.
- source_word: ἀκρωτηριαζόμεθα
  choice: lassen wir uns ... verstümmeln
  rationale: Das mediale/passive Präsens bezeichnet das Erleiden von Verstümmelung beziehungsweise Amputation. Die Konstruktion „lassen wir uns“ bewahrt sowohl die passive Handlung als auch die freiwillige Hinnahme, ohne zu behaupten, die Sprecher verstümmelten sich selbst.
theological_decisions:
- issue: Martyrium als Leiden für Gott
  choice: um Gottes willen
  alternative: für Gott / zugunsten Gottes
  rationale: Die Wendung beschreibt Leiden aus Treue zu Gott. Sie wird nicht als stellvertretendes Handeln zugunsten Gottes gedeutet und importiert keine spätere Sühne- oder Repräsentationslehre.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Glieder“ wahrt die konkrete Körperteilbedeutung, während „verstümmeln“ den Vorgang deutlich, aber nicht übermäßig spezialisiert bezeichnet. Die Fußnote erhält die lexikalische Spannweite von ὑπέρ und ἡδέως.
