  register: Moderner, würdevoller deutscher Erzählstil. Die dreifache Charakterisierung des Antiochus bleibt erhalten, ohne die seltene griechische Steigerungsform unnatürlich nachzubilden. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Satz.
