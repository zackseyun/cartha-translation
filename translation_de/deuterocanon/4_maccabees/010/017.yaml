  yaml_path: translation/deuterocanon/4_maccabees/010/017.yaml
  text: When bloodthirsty and murderous and most savage Antiochus heard these things[a], he ordered his tongue to be cut out.
translation:
  language: de
  text: Als der blutdürstige, mörderische und überaus grausame Antiochus dies hörte, befahl er, dem jungen Mann die Zunge herauszuschneiden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »äußerst grausam«; das seltene griechische Adjektiv steht im Superlativ und verstärkt die Schilderung von Antiochus’ Brutalität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ἀκούσας
  choice: als … dies hörte
  rationale: Die temporale Konstruktion gibt das vorzeitige Aoristpartizip in natürlichem deutschem Erzählstil wieder; »dies« verweist breit auf das zuvor Gesagte.
- source_word: αἱμοβόρος
  choice: blutdürstig
  rationale: Das geläufige deutsche Adjektiv bewahrt das starke Bild einer auf Blutvergießen ausgerichteten Grausamkeit.
- source_word: φονώδης
  choice: mörderisch
  rationale: Die Wahl bezeichnet unmittelbar den mörderischen Charakter und erhält die Häufung der scharfen Epitheta.
- source_word: πανμμερώτατος
  choice: überaus grausam
  rationale: Die seltene superlativische Form verstärkt Antiochus’ äußerste Brutalität; »überaus« gibt die Steigerung in idiomatischem Deutsch wieder.
- source_word: ἐκέλευσεν
  choice: befahl
  rationale: Das Verb bezeichnet das Erteilen eines Befehls und wird knapp und erzählerisch wiedergegeben.
- source_word: τὴν γλῶτταν αὐτοῦ ἐκτεμεῖν
  choice: ihm die Zunge herauszuschneiden
  rationale: Der deutsche Dativ drückt den Bezug des Possessivpronomens zum Opfer eindeutig und idiomatisch aus; »herausschneiden« entspricht dem Vorgang der Exzision.
