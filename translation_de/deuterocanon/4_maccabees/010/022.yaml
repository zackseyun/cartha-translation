  text: I am not about to refuse[a], tyrant, the torture for the sake of virtue.
translation:
  language: de
  text: Ich werde mich, Tyrann, der Folter um der Tugend willen nicht entziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde, Tyrann, die Folter um der Tugend willen nicht ablehnen.“'
    reason: Lexikalische Alternative für παραιτεῖσθαι; „ablehnen“ bildet den unmittelbaren Sinn enger ab, klingt im Deutschen bei „Folter“ jedoch weniger natürlich.
lexical_decisions:
- source_word: Οὐ μέλλω
  choice: Ich werde … nicht
  rationale: μέλλω mit Infinitiv bezeichnet hier die feste, auf das unmittelbar Bevorstehende gerichtete Absicht. Das deutsche Futur gibt die entschlossene Haltung natürlich wieder.
- source_word: τύραννε
  choice: Tyrann
  rationale: Der Vokativ redet den verfolgenden Herrscher unmittelbar und bewusst wertend an; „Tyrann“ ist die klare, übliche Entsprechung.
- source_word: πρὸς τὸν … βασανισμόν
  choice: der Folter
  rationale: βασανισμός bezeichnet Folter beziehungsweise schwere Qual. In Verbindung mit παραιτεῖσθαι wird die griechische Präpositionalfügung im Deutschen idiomatisch durch den Dativ bei „sich entziehen“ wiedergegeben.
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: um der Tugend willen
  rationale: ὑπέρ bezeichnet hier den Grund oder das Anliegen, für das der Sprecher leidet; ἀρετή meint Tugend beziehungsweise sittliche Vortrefflichkeit.
- source_word: παραιτεῖσθαι
  choice: mich … nicht entziehen
  rationale: Das Medium kann „ablehnen“, „zurückweisen“ oder „sich entziehen“ bedeuten. „Sich der Folter nicht entziehen“ drückt hier natürlich aus, dass der Sprecher die bevorstehende Folter nicht meiden wird.
