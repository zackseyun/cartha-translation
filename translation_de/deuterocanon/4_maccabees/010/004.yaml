base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/004.yaml
  text: In response to this[a], if you have any instrument of punishment, bring it against my body; for my soul, even if you wish it[b], you will not touch.
translation:
  language: de
  text: 'Darauf: »Wenn ihr irgendein Mittel zur Bestrafung[a] habt, wendet es an meinem Körper an; denn meine Seele[b] werdet ihr nicht antasten, selbst wenn ihr es wollt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Folterwerkzeug« oder »Marterwerkzeug«; das griechische Wort bezeichnet konkret ein Werkzeug oder Mittel zum Bestrafen, gegebenenfalls auch zum Foltern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mein Leben«; das griechische Wort kann sowohl »Leben« als auch »Seele« bedeuten. Hier entspricht »Seele« am besten dem Gegensatz zu »Körper«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: Darauf entgegnete er
  rationale: Die Wendung leitet die Antwort des Sprechers ein. Die im Deutschen ergänzte Redeeinleitung gibt ihre Funktion natürlich wieder, ohne den Inhalt der Antwort zu verändern.
- source_word: εἴ τι ἔχετε κολαστήριον
  choice: wenn ihr irgendein Folterwerkzeug habt
  rationale: κολαστήριον bezeichnet hier konkret ein Werkzeug oder Mittel zur Bestrafung beziehungsweise Folter; »Folterwerkzeug« ist gegenwärtig und im Märtyrerkontext treffend.
- source_word: προσαγάγετε τῷ σώματί μου
  choice: setzt es gegen meinen Körper ein
  rationale: Der Imperativ fordert die Gegner auf, das genannte Werkzeug am Körper zur Anwendung zu bringen. Die Formulierung wahrt die feindliche Zielrichtung und klingt im Deutschen natürlich.
- source_word: τῆς γὰρ ψυχῆς μου
  choice: denn meine Seele
  rationale: ψυχή steht ausdrücklich im Gegensatz zu σῶμα, dem Körper. »Seele« bewahrt diesen anthropologischen Kontrast, ohne die mögliche Bedeutung »Leben« zu verschweigen.
- source_word: οὐδʼ ἂν θέλητε, ἅψεσθε
  choice: werdet ihr nicht antasten, selbst wenn ihr es wollt
  rationale: Die Wiedergabe erhält sowohl die zukünftige Unmöglichkeit als auch den konzessiven Sinn von ἄν mit dem Verb des Wollens. »Antasten« ist hier kräftiger und kontextgerechter als das rein körperliche »berühren«.
theological_decisions:
- issue: Bedeutung von ψυχή im Gegensatz zu σῶμα
  choice: Seele
  alternative: Leben
  rationale: Die scharfe Gegenüberstellung dessen, was die Verfolger dem Körper antun können, und dessen, was sie nicht erreichen können, wird mit »Seele« bewahrt. Die lexikalisch mögliche Lesart »Leben« bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte, herausfordernde Rede bleibt knapp und kraftvoll; die Satzstellung hebt den Gegensatz zwischen Körper und Seele hervor.
