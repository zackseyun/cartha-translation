    issue: Unbelegter Zusatz »mir«
    rationale: Das griechische ἀφέλῃς enthält kein Dativpronomen. Ein im Kontext möglicher Bezug auf den Sprecher sollte nicht im Haupttext als ausdrücklich markierte Perspektive ergänzt werden.
  - severity: low
    issue: Unnatürliche beziehungsweise fehlerhafte Formulierung in der Fußnote
    rationale: »Gemeint ist wahrscheinlich das Körperorgan oder sind die Körperorgane« ist syntaktisch fehlerhaft. Die Erläuterung kann neutral und grammatisch korrekt formuliert werden.
