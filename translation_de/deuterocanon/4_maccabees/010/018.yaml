  text: But he said[a], “Even if you take away the instrument of speech, God hears those who are silent.”
translation:
  language: de
  text: 'Er aber sagte: »Selbst wenn du das Werkzeug der Stimme[a] wegnimmst, hört Gott die, die schweigen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Werkzeug der Stimme«. Der Ausdruck bezeichnet wahrscheinlich das Körperorgan oder die Körperorgane, mit denen ein Mensch spricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἂν ἀφέλῃς
  choice: Selbst wenn du mir ... nimmst
  rationale: Κἂν (= καὶ ἐάν) leitet eine einräumende Bedingung ein; »selbst wenn« gibt diese Kraft natürlich wieder. ἀφαιρέω bedeutet »wegnehmen/entfernen«. Das im Deutschen ergänzte »mir« ergibt sich im Kontext des einem Menschen genommenen Sprechwerkzeugs, ohne den Gegenstand näher festzulegen.
- source_word: τὸ τῆς φωνῆς ὄργανον
  choice: das Werkzeug der Stimme
  rationale: ὄργανον bezeichnet ein Werkzeug oder Instrument; der Genitiv τῆς φωνῆς bestimmt dessen Funktion. Die Wiedergabe bewahrt die körperliche Metapher und legt sich weder auf die Zunge noch auf ein anderes Sprechorgan fest.
- source_word: σιωπώντων
  choice: die, die schweigen
  rationale: Das substantivisch gebrauchte Präsenspartizip im Genitiv Plural bezeichnet Menschen, die schweigen. Die Formulierung ist im modernen Deutsch klar und bewahrt den fortdauernden Aspekt.
- source_word: ἀκούει
  choice: hört
  rationale: ἀκούω regiert hier den Genitiv und bedeutet schlicht »hören«. Die paradoxe Aussage, dass Gott Schweigende hört, bleibt ohne erklärenden Zusatz erhalten.
- source_word: ὁ θεός
  choice: Gott
  rationale: Die übliche deutsche Wiedergabe des bestimmten griechischen Gottesbegriffs.
theological_decisions:
- issue: Ob die Aussage Gottes Hören schweigender Menschen oder unausgesprochener Gebete bezeichnet
  choice: Gott hört die, die schweigen
  alternative: Gott hört auch unausgesprochene Gebete
  rationale: Der griechische Text nennt ausdrücklich die Schweigenden (σιωπώντων), nicht ihre Gebete. Die Übersetzung bewahrt diese direkte und spannungsreiche Aussage, ohne eine mögliche Folgerung als Wortlaut auszugeben.
- issue: Identität des »Werkzeugs der Stimme«
  choice: nicht näher bestimmt
  alternative: Zunge beziehungsweise Sprechorgan
  rationale: Der Ausdruck kann im Kontext auf ein konkretes Körperorgan oder den gesamten Sprechapparat zielen. Eine Festlegung im Haupttext würde die echte Unbestimmtheit des griechischen Ausdrucks aufheben.
translation_notes:
  register: Moderne, würdevolle Standardsprache. »Werkzeug der Stimme« bewahrt bewusst die griechische Metapher; die Fußnote erläutert sie, ohne den Haupttext auf »Zunge« festzulegen.
