  yaml_path: translation/deuterocanon/4_maccabees/010/019.yaml
  text: Look[a], my tongue has been broken; cut it off[b]. For not even by this will you cut out our reasoned judgment.
translation:
  language: de
  text: Sieh, meine Zunge ist zerschlagen; schneide sie ab![a] Denn selbst dadurch wirst du unser vernünftiges Urteil nicht zum Schweigen bringen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen zunächst „die Zunge“ und dann nur „schneide“; dass der Sprecher seine eigene Zunge meint und ihr Abschneiden fordert, ergibt sich aus dem Zusammenhang.
    reason: implicit_object
  - marker: b
    text: 'Das letzte griechische Verb bedeutet wörtlich etwa „die Zunge abschneiden“. Bildlich sagt der Sprecher: Auch die Verstümmelung seiner Zunge kann ihr vernünftiges Urteil nicht beseitigen oder verstummen lassen. Der griechische Text hat „unser“, nicht „mein“; der Plural kann die Verbundenheit mit seinen Brüdern ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Die direkte Aufforderung lenkt die Aufmerksamkeit auf den Zustand der Zunge und entspricht dem griechischen Hinweiswort in würdigem, noch geläufigem Deutsch.
- source_word: κέχλασται
  choice: ist zerschlagen
  rationale: Das Perfekt bezeichnet den eingetretenen, fortbestehenden Zustand. „Zerschlagen“ gibt die schwere Beschädigung wieder, ohne die genaue Art der Verletzung festzulegen.
- source_word: ἡ γλῶσσα
  choice: meine Zunge
  rationale: Im Griechischen steht wörtlich „die Zunge“; aus dem unmittelbaren Zusammenhang ist eindeutig die Zunge des Sprechers gemeint. Das Possessivpronomen entspricht natürlichem deutschem Sprachgebrauch.
- source_word: τέμνε
  choice: schneide sie ab
  rationale: Der Imperativ richtet sich an den Folterer. Das im Griechischen unausgesprochene Objekt wird aus dem vorangehenden Satz aufgenommen; „abschneiden“ macht die beabsichtigte Verstümmelung klar.
- source_word: οὐ γὰρ παρὰ τοῦτο
  choice: Denn selbst dadurch … nicht
  rationale: Die Wendung bestreitet, dass der Folterer durch diese Tat sein Ziel erreichen kann. „Selbst dadurch“ gibt die kontextuelle Emphase wieder.
- source_word: τὸν λογισμὸν
  choice: unser vernünftiges Urteil
  rationale: λογισμός bezeichnet in 4 Makkabäer das vernünftige, sittlich ausgerichtete Denken, das die Leidenschaften beherrscht. „Vernünftiges Urteil“ bewahrt sowohl den gedanklichen als auch den standhaften Aspekt, ohne einen späteren philosophischen Fachbegriff einzutragen.
- source_word: ἡμῶν
  choice: unser
  rationale: Der überlieferte griechische Text hat ausdrücklich die erste Person Plural. Diese Form bleibt erhalten und kann die Verbundenheit des einzelnen Märtyrers mit seinen Brüdern ausdrücken.
- source_word: γλωσσοτομήσεις
  choice: zum Schweigen bringen
  rationale: Das seltene, bildkräftige Verb bedeutet wörtlich etwa „die Zunge abschneiden“. Auf λογισμός bezogen bezeichnet es hier das vergebliche Bemühen, das vernünftige Urteil durch Verstümmelung auszuschalten. Die natürliche deutsche Wiedergabe steht im Text; das Wortbild wird in der Fußnote offengelegt.
theological_decisions:
- issue: Bedeutung von λογισμός im philosophisch-theologischen Zusammenhang des 4. Makkabäerbuches
  choice: vernünftiges Urteil
  alternative: Vernunft; vernünftige Entschlossenheit; vernünftiges Denken
  rationale: Die Übersetzung hält den Zusammenhang von vernünftigem Denken, sittlichem Urteil und standhafter Haltung offen. Sie reduziert den Begriff weder auf bloßen Intellekt noch legt sie ihn ausschließlich als Willensentschluss fest.
- issue: Plural ἡμῶν bei einem einzelnen Sprecher
  choice: unser vernünftiges Urteil
  alternative: mein vernünftiges Urteil
  rationale: Die Übersetzung folgt dem bezeugten Plural, statt ihn an den unmittelbaren Singularzusammenhang anzugleichen. So bleibt die mögliche Solidarität mit den Brüdern sichtbar, ohne sie als einzig mögliche Erklärung festzuschreiben.
- issue: Körperliches Wortbild in γλωσσοτομήσεις
  choice: im Haupttext sinngemäß „zum Schweigen bringen“, mit wörtlichem Bild in der Fußnote
  alternative: unser vernünftiges Urteil nicht herausschneiden; unserem vernünftigen Urteil nicht die Zunge abschneiden
  rationale: Die Aussage verbindet die Verstümmelung der Zunge mit der Unmöglichkeit, das vernünftige Urteil auszuschalten. Die gewählte Form ist verständlich und bewahrt durch die Fußnote die drastische Doppeldeutigkeit des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Imperative bewahren die trotzige Direktheit der Rede. Ungewöhnliche griechische Bildsprache und der auffällige Wechsel zum Plural werden nicht stillschweigend harmonisiert, sondern im Text beziehungsweise in der Fußnote sichtbar gehalten.
