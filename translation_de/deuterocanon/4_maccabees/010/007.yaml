  text: And since they were in no way able to strangle him[a], they dragged off the skin with the very tips of his fingers and flayed him, and immediately they led him to the wheel.
translation:
  language: de
  text: Und weil sie ihn auf keine Weise erwürgen konnten, zogen sie ihm die Haut mitsamt den äußersten Spitzen seiner Finger[a] ab und häuteten ihn. Gleich darauf führten sie ihn zum Rad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ungewöhnliche griechische Wendung kann auch so verstanden werden, dass sie ihm die Haut bis zu den Fingerspitzen abzogen oder sie mit den Fingerspitzen abzogen.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μηδένα τρόπον
  choice: auf keine Weise
  rationale: Die idiomatische Wendung drückt eine vollständige Unfähigkeit aus; die deutsche Formulierung bewahrt diese uneingeschränkte Verneinung.
- source_word: ἰσχύοντες … ἄγξαι
  choice: … erwürgen konnten
  rationale: ἰσχύω bezeichnet hier die Fähigkeit, während ἄγχω das Zuschnüren der Kehle bis zum Erwürgen meint.
- source_word: περισύραντες τὸ δέρμα
  choice: zogen sie ihm die Haut … ab
  rationale: Die Formulierung gibt das gewaltsame Abziehen der Haut anschaulich und in natürlichem Deutsch wieder.
- source_word: σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς
  choice: mitsamt den äußersten Kuppen seiner Finger
  rationale: σύν wird in seiner gewöhnlichen Bedeutung „mitsamt“ wiedergegeben; die Häufung von ἄκραις und κορυφαῖς unterstreicht die äußersten Enden beziehungsweise Kuppen. Wegen der ungewöhnlichen, grafischen Formulierung wird eine alternative Deutung in der Fußnote genannt.
- source_word: ἀπεσκύθισον
  choice: häuteten ihn
  rationale: Das Verb bezeichnet das Abziehen der Haut und kann speziell das Skalpieren meinen. Im Zusammenhang mit dem zuvor genannten δέρμα bleibt „häuteten“ hinreichend weit und vermeidet eine nicht zwingend auf die Kopfhaut begrenzte Festlegung.
- source_word: εὐθέως
  choice: gleich darauf
  rationale: Die Wendung bezeichnet die unmittelbare zeitliche Folge und klingt im Deutschen natürlich.
- source_word: ἦγον ἐπὶ τὸν τροχόν
  choice: führten sie ihn zum Rad
  rationale: Die schlichte Bewegungsangabe wird direkt wiedergegeben; „Rad“ bezeichnet hier das Folterinstrument.
