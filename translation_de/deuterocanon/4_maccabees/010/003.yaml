  text: I will not renounce the noble kinship of our brotherhood[a].
translation:
  language: de
  text: Ich werde mich nicht von der edlen Verwandtschaft unter uns Brüdern[a] lossagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… von der edlen Verwandtschaft unter uns Geschwistern lossagen.“'
    reason: ἀδελφότης kann die Gemeinschaft von Brüdern oder allgemeiner von Geschwistern bezeichnen; der unmittelbare Kontext legt hier Brüder nahe.
lexical_decisions:
- source_word: οὐκ ἐξόμνυμαι
  choice: ich werde … nicht verleugnen
  rationale: Die futurische Form bezeichnet hier die entschiedene Weigerung, die familiäre Bindung abzustreiten oder sich von ihr loszusagen. „Verleugnen“ ist im Deutschen natürlich und wahrt die mögliche Bedeutung des Leugnens, ohne ausdrücklich eine Eidesformel vorauszusetzen.
- source_word: τὴν … συγγένειαν
  choice: die … verwandtschaftliche Verbundenheit
  rationale: συγγένεια bezeichnet Verwandtschaft beziehungsweise eine auf gemeinsamer Abstammung beruhende Beziehung. „Verwandtschaftliche Verbundenheit“ gibt sowohl das konkrete Familienverhältnis als auch den hier betonten Zusammenhalt wieder.
- source_word: εὐγενῆ
  choice: edle
  rationale: εὐγενής kann sowohl vornehme Herkunft als auch sittliche Würde bezeichnen. „Edel“ bewahrt diese bewusst offene Doppelbedeutung.
- source_word: τῆς ἀδελφότητος
  choice: unter uns Brüdern
  rationale: ἀδελφότης bezeichnet hier im unmittelbaren Familienkontext die brüderliche Gemeinschaft beziehungsweise den Zusammenhalt der Brüder. Die Formulierung vermeidet das im heutigen Deutsch leicht institutionell klingende „Bruderschaft“ und macht den relationalen Genitiv natürlich verständlich.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von ἀδελφότης
  choice: unter uns Brüdern
  alternative: unter uns Geschwistern; der Geschwistergemeinschaft
  rationale: Der Kontext handelt von den sieben Brüdern; deshalb wird die maskuline familiäre Bezeichnung nicht neutralisiert. Zugleich weist die Fußnote auf die weiter gefasste lexikalische Möglichkeit „Geschwister“ hin.
- issue: Bedeutungsumfang von ἐξόμνυμαι
  choice: nicht verleugnen
  alternative: nicht abschwören; mich nicht lossagen von
  rationale: Das Verb kann ein eidliches Abschwören oder allgemein ein Leugnen und Lossagen bezeichnen. Da der Satz keine ausdrückliche Eidesformel nennt, wird diese nicht in den Haupttext hineingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist bewusst relational statt institutionell; „edel“ erhält die Spannung zwischen vornehmer Herkunft und ehrenhafter Qualität.
