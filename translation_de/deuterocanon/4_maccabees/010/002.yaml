base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/002.yaml
  text: But he cried out and said[a], “Do you not know that the same father sowed me among those who die, and the same mother gave birth to me, and I was brought up in the same principles?”
translation:
  language: de
  text: 'Er aber rief laut: »Wisst ihr nicht, dass derselbe Vater mich zusammen mit denen, die gestorben sind, gesät hat[a], dass dieselbe Mutter mich geboren hat und dass ich nach denselben Grundsätzen erzogen worden bin?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »gesät«. Das Griechische verwendet für die menschliche Zeugung ein landwirtschaftliches Bild. Die ungewöhnliche Verbindung mit »denen, die gestorben sind« kann ausdrücken, dass er zusammen mit den inzwischen Verstorbenen vom selben Vater gezeugt wurde.
    reason: Erläutert die bewahrte Zeugungsmetapher und die syntaktisch auffällige Verbindung mit μετὰ τοῖς ἀποθανοῦσιν, ohne die Präposition als »unter« wiederzugeben.
lexical_decisions:
- source_word: ἀναβοήσας
  choice: rief laut
  rationale: Das Partizip bezeichnet einen lauten, nachdrücklichen Ausruf; die deutsche Verbform fügt sich natürlich in die direkte Rede.
- source_word: ἀγνοεῖτε
  choice: wisst ihr nicht
  rationale: Bewahrt die rhetorische Frage und ihren vorwurfsvollen Ton in idiomatischem modernem Deutsch.
- source_word: αὐτός … πατήρ / ἡ αὐτὴ μήτηρ
  choice: derselbe Vater / dieselbe Mutter
  rationale: Die parallele Formulierung betont die gemeinsame Abstammung des Sprechers und seiner bereits getöteten Brüder.
- source_word: τοῖς ἀποθανοῦσιν
  choice: zusammen mit denen, die gestorben sind
  rationale: Der Aoristpartizip bezeichnet hier am natürlichsten die bereits Gestorbenen, also die zuvor getöteten Brüder; die Präposition wird als Gemeinschaft beziehungsweise Zuordnung verstanden.
- source_word: ἔσπειρεν
  choice: gesät hat
  rationale: Die wörtliche landwirtschaftliche Metapher für die väterliche Zeugung bleibt erhalten, obwohl sie auch im Griechischen auffällig ist.
- source_word: ἐγέννησεν
  choice: geboren hat
  rationale: Gibt im Zusammenhang mit der Mutter den natürlichen Sinn des Verbs klar und gegenwärtig wieder.
- source_word: ἀνετράφην
  choice: erzogen worden bin
  rationale: Bezeichnet die gemeinsame Erziehung und Prägung der Brüder.
- source_word: δόγμασιν
  choice: Grundsätzen
  rationale: Im Kontext sind die prägenden religiös-ethischen Überzeugungen gemeint; „Grundsätze“ vermeidet sowohl einen rein lehrmäßigen als auch einen obrigkeitlich-dekretalen Beiklang.
theological_decisions:
- issue: Bildhafte Aussage über die väterliche Zeugung
  choice: Die Metapher „gesät“ wird im Haupttext bewahrt.
  alternative: „gezeugt“
  rationale: Die ungewöhnliche Bildsprache des griechischen Textes soll nicht zu einer gewöhnlichen Abstammungsformel geglättet werden.
- issue: Zeitbezug von τοῖς ἀποθανοῦσιν
  choice: „denen, die gestorben sind“ bezeichnet die bereits getöteten Brüder.
  alternative: „den Sterblichen“ oder „denen, die sterben“
  rationale: Das Aoristpartizip und der erzählerische Zusammenhang sprechen für bereits eingetretenen Tod. Eine allgemeine Aussage über die Sterblichkeit aller Menschen würde die zeitliche Gestalt des griechischen Ausdrucks abschwächen.
- issue: Bedeutung von δόγματα
  choice: „Grundsätze“
  alternative: „Lehren“
  rationale: Die Übersetzung lässt offen, ob stärker konkrete Unterweisung oder umfassende religiös-ethische Lebensgrundsätze gemeint sind, und vermeidet konfessionelle Zuspitzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anaphorische Dreierstruktur („dass …, dass … und dass …“) bildet den nachdrücklichen Gedankengang des griechischen Satzes nach. Die ungewöhnliche Wendung „gesät hat“ bleibt bewusst stehen und wird durch die Fußnote erläutert.
