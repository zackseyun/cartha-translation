  yaml_path: translation/deuterocanon/4_maccabees/010/015.yaml
  text: By the blessed death of my brothers[a], and by the tyrant’s eternal destruction, and by the everlasting life of the godly[b], I will not renounce my noble brotherhood.
translation:
  language: de
  text: 'Beim seligen Tod meiner Brüder, beim ewigen Untergang des Tyrannen und beim immerwährenden Leben der Gottesfürchtigen[a]: Ich werde meine edle brüderliche Verbundenheit[b] nicht verleugnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische verwendet für den Untergang und das Leben zwei bedeutungsnahe Adjektive unbegrenzter Dauer.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die edle Bruderschaft“. Gemeint ist im Zusammenhang die ehrenvolle Verbundenheit des Sprechers mit seinen Brüdern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὰ
  choice: Beim …
  rationale: Die Präposition mit dem Akkusativ leitet eine feierliche Schwurformel ein. „Beim …“ gibt diese im Deutschen knapp und idiomatisch wieder.
- source_word: μακάριον … θάνατον
  choice: seligen Tod
  rationale: μακάριος bezeichnet hier einen als gesegnet und ehrenvoll verstandenen Tod, nicht bloß einen glücklichen oder günstigen.
- source_word: τῶν ἀδελφῶν μου
  choice: meiner Brüder
  rationale: Der maskuline Plural bezeichnet im Kontext die leiblichen Brüder des Sprechers.
- source_word: αἰώνιον … ὄλεθρον
  choice: ewigen Untergang
  rationale: ὄλεθρος meint Untergang, Verderben oder Vernichtung; „Untergang“ ist natürlich und bewahrt zusammen mit „ewig“ die Aussage dauernden Verderbens, ohne dessen Art näher festzulegen.
- source_word: ἀΐδιον … βίον
  choice: immerwährenden Leben
  rationale: ἀΐδιος bezeichnet unaufhörliche Dauer. „Immerwährend“ hält eine leichte sprachliche Unterscheidung zu αἰώνιος aufrecht, obwohl sich beide Adjektive semantisch stark überschneiden.
- source_word: τῶν εὐσεβῶν
  choice: der Gottesfürchtigen
  rationale: εὐσεβής bezeichnet Menschen, die von Ehrfurcht und rechter Verehrung Gottes geprägt sind. „Gottesfürchtig“ ist im biblischen Register verständlich und präzise.
- source_word: οὐκ ἀρνήσομαι
  choice: Ich werde … nicht verleugnen
  rationale: ἀρνέομαι kann „leugnen“, „verleugnen“ oder „sich lossagen“ bedeuten. „Nicht verleugnen“ passt zur Weigerung, die familiäre Verbundenheit aufzugeben.
- source_word: τὴν εὐγενῆ ἀδελφότητα
  choice: meine edle brüderliche Verbundenheit
  rationale: ἀδελφότης bezeichnet Bruderschaft beziehungsweise das Verhältnis unter Brüdern; εὐγενής hebt dessen edlen oder vornehmen Charakter hervor. Die kontextuell erschlossene Possessivform und „Verbundenheit“ vermeiden im Deutschen den irreführenden Eindruck einer organisierten Bruderschaft.
theological_decisions:
- issue: Eschatologischer Gegensatz zwischen dem Tyrannen und den Gottesfürchtigen
  choice: Der Text stellt den ewigen Untergang des Tyrannen dem immerwährenden Leben der Gottesfürchtigen gegenüber.
  alternative: Die Aussage entweder nur als allgemeinen moralischen Gegensatz oder als vollständig ausgearbeitete Lehre über das jenseitige Schicksal zu deuten.
  rationale: Die Übersetzung gibt den zeitlich unbegrenzten Gegensatz direkt wieder, bestimmt aber weder die Art des Untergangs noch weitere Einzelheiten von Lohn und Strafe.
translation_notes:
  register: Feierliches, aber gegenwärtig verständliches Standarddeutsch. Die dreigliedrige Schwurformel wird durch die Wiederholung von „beim“ und einen Doppelpunkt klar gegliedert; altertümliche Formen wie „Brüderschaft“ oder übermäßig technische eschatologische Begriffe werden vermieden.
