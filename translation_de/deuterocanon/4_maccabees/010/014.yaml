  yaml_path: translation/deuterocanon/4_maccabees/010/014.yaml
  text: But he said to them[a], “The fire you have against me is not so scorching as to make me a coward.”
translation:
  language: de
  text: 'Er aber sagte zu ihnen: „Das Feuer, das ihr gegen mich einsetzt, ist nicht so sengend, dass es mich zum Feigling machen könnte.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass es mich feige handeln ließe“; wörtlicher, mit geschlechtlich markierter Etymologie: „dass es mich unmännlich machte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ αὐτοῖς ἔφη
  choice: Er aber sagte zu ihnen
  rationale: δέ kennzeichnet hier eine leicht gegensätzliche Fortführung; „aber“ gibt die trotzige Erwiderung auf die Folterer natürlich wieder.
- source_word: ἔχετε ... κατʼ ἐμοῦ τὸ πῦρ
  choice: das Feuer, das ihr gegen mich einsetzt
  rationale: Die Wendung bezeichnet das konkret gegen ihn gerichtete Folterfeuer. „einsetzt“ macht die feindliche Ausrichtung im Deutschen idiomatisch deutlich, ohne das Bild zu vergeistigen.
- source_word: καυστικώτερον
  choice: so sengend
  rationale: καυστικός bezeichnet brennende oder versengende Wirkung. Im Zusammenhang mit οὐχ οὕτω ... ὥστε gibt „nicht so sengend, dass“ die Grad-Folge-Konstruktion natürlich wieder; der Komparativ ist innerhalb dieser Konstruktion idiomatisch erfasst.
- source_word: οὐχ οὕτω ... ὥστε
  choice: nicht so ... dass ... könnte
  rationale: Diese Grad- und Folgekonstruktion wird im modernen Deutschen natürlich mit „nicht so …, dass … könnte“ ausgedrückt.
- source_word: δειλανδρῆσαι
  choice: mich zum Feigling machen
  rationale: Das Verb bedeutet, jemanden feige beziehungsweise unmännlich werden oder handeln zu lassen. „zum Feigling machen“ bewahrt den kausativen Sinn und konzentriert sich verständlich auf den im Kontext entscheidenden Verlust des Mutes.
theological_decisions:
- issue: δειλανδρῆσαι kann etymologisch sowohl „feige machen“ als auch „unmännlich machen“ nahelegen.
  choice: mich zum Feigling machen
  alternative: mich unmännlich machen; mich feige handeln lassen
  rationale: Im Martyriumskontext geht es unmittelbar um Standhaftigkeit und Mut. Die gewählte Formulierung vermittelt dies klar, ohne aus der etymologisch geschlechtsspezifischen Nebenbedeutung eine Aussage über Männlichkeit als solche zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und trotzig; das konkrete Bild des gegen den Märtyrer eingesetzten Feuers wird bewahrt.
