  text: We will set out some roasted foods[a], but you, by pretending to taste pork, save yourself.
translation:
  language: de
  text: Wir werden dir etwas von den gekochten Speisen vorsetzen. Du aber tu so, als würdest du vom Schweinefleisch[a] kosten, und rette dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Speisen vom Schwein«. Das Griechische bezeichnet allgemein etwas, das vom Schwein stammt.'
    reason: lexikalische Alternative; das substantivierte Adjektiv lässt die genaue Art des Schweineprodukts offen
lexical_decisions:
- source_word: ἡψημένων
  choice: gekochten
  rationale: Das Partizip bezeichnet durch Kochen zubereitete Speisen. »Gekocht« bewahrt den konkreten kulinarischen Sinn, ohne die Zubereitungsart unbegründet als Braten festzulegen.
- source_word: βρωμάτων
  choice: Speisen
  rationale: βρῶμα bezeichnet allgemein etwas Essbares beziehungsweise Nahrung. »Speisen« ist im Zusammenhang des Vorsetzens natürlich und nicht unnötig auf Fleisch beschränkt.
- source_word: παραθήσομεν
  choice: wir werden dir etwas … vorsetzen
  rationale: παρατίθημι bezeichnet im Mahlkontext das Vorsetzen von Speisen. Das im Deutschen ergänzte »dir« ergibt sich aus der angeredeten Person; »etwas von« gibt den griechischen partitiven Genitiv wieder.
- source_word: ὑποκρινόμενος
  choice: tu so, als würdest du
  rationale: Das Partizip drückt ein Vortäuschen aus. Die deutsche Konstruktion gibt sowohl den Sinn als auch die Verbindung mit dem folgenden Infinitiv natürlich wieder.
- source_word: τῶν ὑείων
  choice: Schweinefleisch
  rationale: Das substantivierte Adjektiv bezeichnet hier Nahrung beziehungsweise Fleisch vom Schwein. »Schweinefleisch« macht den Bezug auf das nach jüdischem Gesetz verbotene Lebensmittel klar.
- source_word: ἀπογεύσασθαι
  choice: kosten
  rationale: Das Verb bedeutet probieren oder kosten. »Kosten« passt zur vorgespielten, möglicherweise nur geringfügigen Nahrungsaufnahme.
- source_word: σώθητι
  choice: rette dich
  rationale: Der passive Imperativ von σῴζω wird hier idiomatisch als dringende Aufforderung zur Selbsterhaltung gebraucht. Gemeint ist die Rettung des eigenen Lebens in der gegenwärtigen Gefahr.
theological_decisions:
- issue: Bezeichnung der verbotenen Nahrung im jüdischen Märtyrerkontext
  choice: Schweinefleisch
  alternative: vom Schwein stammende Speisen
  rationale: Der unmittelbare Konflikt betrifft den vermeintlichen Verzehr von Schweinefleisch. Die gewählte Formulierung ist gegenwärtig, klar und führt keine konfessionelle Deutung ein.
- issue: Bedeutung von σώθητι
  choice: rette dich
  alternative: lass dich retten
  rationale: Im Kontext geht es um das physische Überleben Eleasars, nicht ausdrücklich um geistliches Heil. Die idiomatische aktive Wiedergabe des griechischen Passivimperativs macht diese situationsbezogene Aufforderung deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich und verständlich; die Satzglieder folgen dem griechischen Gegensatz zwischen »wir« und »du«, ohne im Deutschen steif zu wirken.
