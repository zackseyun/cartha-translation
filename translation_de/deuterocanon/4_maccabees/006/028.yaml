  text: Be merciful to your nation[b][a], being satisfied with our punishment on their behalf.
translation:
  language: de
  text: Sei deinem Volk gnädig und lass dir unsere Strafe für sie genügen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei deinem Volk gnädig, indem du unsere Strafe für sie als ausreichend annimmst.“'
    reason: Die Alternative bildet die Partizipialkonstruktion ἀρκεσθεὶς enger ab und macht den Sinn von „als ausreichend ansehen“ ausdrücklich.
lexical_decisions:
- source_word: ἵλεως γενοῦ
  choice: Sei … gnädig
  rationale: Die idiomatische Verbindung ist eine bittende Aufforderung, sich gnädig zu erweisen. Die deutsche Formulierung ist natürlich, würdevoll und vermeidet das technischere „versöhnt“.
- source_word: τῷ ἔθνει σου
  choice: deinem Volk
  rationale: ἔθνος bezeichnet hier die gemeinschaftlich gedachte Bundesgemeinschaft. „Volk“ ist im Deutschen natürlicher als „Nation“ und bewahrt den kollektiven Sinn.
- source_word: ἀρκεσθεὶς
  choice: lass dir … genügen
  rationale: Das passive Partizip bezeichnet das Annehmen von etwas als ausreichend. Die finite, koordinierte Wendung gibt den Sinn im Deutschen klar und idiomatisch wieder.
- source_word: τῇ ἡμετέρᾳ … δίκῃ
  choice: unsere Strafe
  rationale: δίκη kann Recht, Strafurteil oder Strafe bezeichnen; im Martyriumskontext ist die erlittene Strafe gemeint.
- source_word: περὶ αὐτῶν
  choice: für sie
  rationale: περί mit Genitiv kann „ihretwegen“, „für sie“ oder „in Bezug auf sie“ bedeuten. „Für sie“ bewahrt hier den möglichen stellvertretend-repräsentativen Sinn, ohne eine spätere Sühnetheorie festzulegen.
theological_decisions:
- issue: Repräsentative Bedeutung des Leidens in περὶ αὐτῶν
  choice: „für sie“ lässt erkennen, dass die Strafe der Sprecher zugunsten des Volkes gelten soll.
  alternative: „ihretwegen“ oder „in Bezug auf sie“ könnte den Zusammenhang lockerer ausdrücken.
  rationale: Der unmittelbare Zusammenhang ist fürbittend und repräsentativ. Die knappe Wiedergabe wahrt diese theologische Spannung, ohne sie systematisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gebetscharakter bleibt durch den Imperativ „Sei“ erhalten; „lass dir … genügen“ ist gut verständlich und gibt die Suffizienzvorstellung idiomatisch wieder.
