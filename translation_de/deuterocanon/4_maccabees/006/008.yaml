revisions:
- from: Ja, einer der grausamen Wachen[a] sprang ihm gegen die Seiten und trat ihn immer wieder, damit er, wenn er fiel, wieder aufstand.[b]
  to: Tatsächlich sprang einer der grausamen Wachen[a] ihm in die Seiten und trat ihn immer wieder, damit er, wenn er fiel, wieder aufstand.[b]
  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachliche Verbesserungen: Die emphatische Partikelverbindung wird idiomatisch mit „Tatsächlich“ wiedergegeben, und die Richtung des Angriffs auf die Flanken wird mit „in die Seiten“ natürlich und quellennah formuliert. Das wiederholte Treten, der Zweck des gewaltsamen Wiederaufstehens sowie beide Fußnoten bleiben erhalten.'
