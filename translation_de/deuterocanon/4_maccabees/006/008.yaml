  yaml_path: translation/deuterocanon/4_maccabees/006/008.yaml
  text: Then indeed one of the cruel guards[a], leaping at his sides, kept striking him so that, when he fell[b], he might rise again.
translation:
  language: de
  text: Tatsächlich sprang einer der grausamen Wachen[a] ihm in die Seiten und trat ihn immer wieder, damit er, wenn er fiel, wieder aufstand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leibwächter“. Das griechische Wort bezeichnet wörtlich einen Speerträger.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist hier, dass er nach dem Hinfallen körperlich wieder aufstehen sollte, nicht die Auferstehung.
    reason: lexical_clarification
lexical_decisions:
- source_word: λάξ ... ἔτυπτεν
  choice: trat ihn immer wieder
  rationale: λάξ bezeichnet einen Schlag mit dem Fuß; zusammen mit dem Imperfekt ἔτυπτεν ist fortgesetztes oder wiederholtes Treten gemeint. Anders als die englische Konsultationsfassung wird λάξ daher nicht als bloße Bekräftigung behandelt.
- source_word: γέ τοι
  choice: Ja
  rationale: Die Partikelverbindung bekräftigt und belebt die Schilderung. Das knappe „Ja“ wahrt diese emphatische Kraft in natürlichem Deutsch.
- source_word: τῶν πικρῶν
  choice: der grausamen
  rationale: πικρός bedeutet wörtlich „bitter“, bezeichnet bei Personen jedoch oft Härte oder Grausamkeit; der Folterkontext spricht für „grausam“.
- source_word: δορυφόρων
  choice: Wachen
  rationale: Das Wort bezeichnet wörtlich Speerträger und kann Leibwächter oder bewaffnete Begleiter eines Herrschers meinen. „Wachen“ gibt ihre Funktion verständlich wieder; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: εἰς τοὺς κενεῶνας
  choice: gegen die Seiten
  rationale: κενεών bezeichnet die weichen beziehungsweise hohlen Körperpartien an den Flanken. „Seiten“ ist im heutigen Deutsch klar und körperlich konkret.
- source_word: ἐναλλόμενος
  choice: sprang ihm gegen
  rationale: Das Partizip beschreibt eine heftige, sprunghafte Bewegung auf das Opfer zu beziehungsweise gegen dessen Seiten.
- source_word: ὅπως ἐξανίσταιτο πίπτων
  choice: damit er, wenn er fiel, wieder aufstand
  rationale: 'Die Konstruktion bezeichnet den Zweck der Tritte: Der Gefolterte sollte nach dem Hinfallen erneut aufstehen. Die zeitliche Beziehung des Partizips πίπτων bleibt mit „wenn er fiel“ offen genug wiedergegeben.'
theological_decisions:
- issue: Mögliche Deutung von ἐξανίσταιτο als Auferstehungssprache
  choice: körperliches Wiederaufstehen nach dem Hinfallen
  alternative: Anklang an eine Auferstehung
  rationale: Im unmittelbaren Folterkontext geht es darum, den Zusammenbrechenden durch Tritte wieder auf die Beine zu zwingen. Die Fußnote verhindert eine unbeabsichtigte dogmatische Überdeutung, ohne dem Verb seine Grundbedeutung zu nehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Wiedergabe der fortgesetzten Misshandlung. Die Satzstruktur bleibt nah am griechischen Ablauf, während „trat ihn immer wieder“ die Bedeutung von λάξ und den durativen Charakter des Imperfekts ausdrücklich erfasst.
