  text: Daher ist allgemein anerkannt, dass die gottesfürchtige Vernunft Herrin über die Leidenschaften ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: unbestritten
  rationale: Das Adverb bezeichnet etwas, das anerkanntermaßen oder nach allgemeinem Eingeständnis gilt. »Unbestritten« ist im Deutschen natürlich und bewahrt den bekräftigenden Charakter.
- source_word: οὖν
  choice: daher
  rationale: Die Partikel zieht eine Folgerung aus dem vorangehenden Gedankengang; »daher« gibt diesen Schluss prägnant wieder.
- source_word: δεσπότης
  choice: Herrin
  rationale: Das Prädikatsnomen bezeichnet eine Instanz mit beherrschender Gewalt. Wegen des grammatisch femininen Bezugsworts »Vernunft« steht im Deutschen »Herrin«; die Ergänzung »über« macht die beherrschende Beziehung idiomatisch deutlich.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: πάθη meint im philosophisch-ethischen Zusammenhang des 4. Makkabäerbuchs die Affekte, Triebe oder Leidenschaften, die von der Vernunft beherrscht werden. »Leidenschaften« wahrt den etablierten Begriff und vermeidet die Verengung auf bloße Gefühle oder Leiden.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  rationale: λογισμός bezeichnet hier das vernünftige Urteils- und Steuerungsvermögen; εὐσεβής qualifiziert es durch die Ausrichtung auf die Ehrfurcht vor Gott. »Gottesfürchtige Vernunft« bewahrt sowohl die rationale als auch die religiöse Dimension.
theological_decisions:
- issue: Bedeutung von εὐσεβής in der philosophisch-theologischen Wendung
  choice: gottesfürchtig
  alternative: fromm; gottesfürchtig geleitet
  rationale: Die Vernunft erscheint nicht als autonome Rationalität, sondern als durch Ehrfurcht vor Gott bestimmte Vernunft. »Gottesfürchtig« bringt diese Beziehung ausdrücklich zum Ausdruck, ohne eine konfessionelle Deutung einzutragen.
- issue: Herrschaft der Vernunft über die πάθη
  choice: Herrin über die Leidenschaften
  alternative: Gebieterin der Leidenschaften; beherrscht die Leidenschaften
  rationale: Die substantivische Aussage des griechischen Textes bleibt erhalten. Sie behauptet beherrschende Autorität, ohne näher festzulegen, ob damit Unterdrückung, Lenkung oder vollständige Überwindung der Affekte gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die nachdrückliche Schlussfolgerung natürlich ab. Keine Fußnote erforderlich, da keine textkritische oder für den Lesetext unauflösbare Mehrdeutigkeit vorliegt.
