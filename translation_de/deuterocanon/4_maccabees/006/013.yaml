base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/013.yaml
  text: Some of the king’s men[a], being moved by sympathy because of their long acquaintance with him, and others approaching him in admiration of his endurance, were saying[b],
translation:
  language: de
  text: 'Einige aus dem Gefolge des Königs – die einen von Mitgefühl bewegt, weil sie seit Langem mit ihm vertraut waren[a], die anderen voller Bewunderung für seine Standhaftigkeit[b], als sie zu ihm traten – sagten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weil sie mit ihm vertraut waren«. Das griechische Wort kann eine durch längeren Umgang entstandene Vertrautheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »voller Staunen über seine Ausdauer«. Das griechische Wort bezeichnet standhaftes Ausharren unter Belastung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν συμπαθείᾳ
  choice: von Mitgefühl bewegt
  rationale: Die Wendung bezeichnet die innere Haltung, aus der die erste Gruppe handelt. Die Formulierung gibt den emotionalen Gehalt von συμπάθεια in natürlichem Deutsch wieder.
- source_word: τῆς συνηθείας
  choice: weil sie seit Langem mit ihm vertraut waren
  rationale: συνήθεια kann Vertrautheit aufgrund gewohnter oder länger bestehender Verbindung bezeichnen. Die Wiedergabe macht den relationalen Zusammenhang deutlich, ohne eine enge Freundschaft vorauszusetzen.
- source_word: ἐν θαυμαστῷ τῆς καρτερίας
  choice: voller Bewunderung für seine Standhaftigkeit
  rationale: Die Formulierung bewahrt sowohl das staunende, anerkennende Moment von θαυμαστόν als auch die beharrliche Leidensfestigkeit von καρτερία.
- source_word: προσίοντες αὐτῷ
  choice: als sie zu ihm traten
  rationale: Die Übersetzung gibt die konkrete Annäherung wieder und ordnet das Partizip natürlich in den deutschen Satz ein.
- source_word: τινες τῶν τοῦ βασιλέως
  choice: Einige aus dem Gefolge des Königs
  rationale: Der substantivierte Genitiv bezeichnet Personen, die zum König gehören oder in seinem Dienst stehen. „Gefolge“ ist idiomatisch, ohne einen bestimmten Rang festzulegen.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt leitet die unmittelbar folgende Rede ein. Im Deutschen ist das einfache Erzählpräteritum hier natürlicher; ein ausdrücklich wiederholtes Sprechen ist aus dem Kontext nicht zwingend.
