base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/005.yaml
  text: But the noble-minded and truly well-born Eleazar[a], as though being tortured in a dream, was not turned aside in any way.
translation:
  language: de
  text: Doch der hochgesinnte und wahrhaft vornehm geborene Eleasar ließ sich, als würde er im Traum gefoltert,[a] in keiner Weise umstimmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie im Traum gefoltert“. Das Griechische gebraucht einen Vergleich; es wird nicht gesagt, dass Eleasar tatsächlich träumte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλόφρων
  choice: hochgesinnt
  rationale: Das Wort bezeichnet Größe und Adel der inneren Haltung. „Hochgesinnt“ bewahrt diesen moralisch-psychologischen Sinn und unterscheidet ihn von der anschließenden Aussage über Eleasars Herkunft.
- source_word: εὐγενής
  choice: vornehm geboren
  rationale: Der Ausdruck verweist hier auf gute beziehungsweise vornehme Abstammung. Diese Wiedergabe erhält die soziale oder genealogische Nuance, ohne sie mit Eleasars innerer Gesinnung gleichzusetzen.
- source_word: ὡς ἀληθῶς
  choice: wahrhaft
  rationale: Die adverbiale Wendung verstärkt die Charakterisierung Eleasars und wird im Deutschen knapp und würdig wiedergegeben.
- source_word: ὥσπερ ἐν ὀνείρῳ
  choice: wie im Traum
  rationale: Die Formulierung wahrt den ausdrücklichen Vergleich und behauptet nicht, Eleasar habe tatsächlich geträumt.
- source_word: βασανιζόμενος
  choice: obwohl er … gefoltert wurde
  rationale: Im Kontext des Martyriums ist konkrete körperliche Folter gemeint. Die konzessive Einbindung macht im natürlichen Deutschen deutlich, dass die Folter seinen Entschluss nicht änderte.
- source_word: κατ᾽ οὐδὲν τρόπον
  choice: in keiner Weise
  rationale: Die idiomatische Wendung bezeichnet eine uneingeschränkte Verneinung.
- source_word: μετετρέπετο
  choice: ließ sich … nicht von seinem Weg abbringen
  rationale: Die Wiedergabe erhält den medial-passiven Gedanken des Abgebracht- oder Umgestimmtwerdens und bringt im Kontext Eleasars unerschütterliche Haltung natürlich zum Ausdruck.
theological_decisions:
- issue: Darstellung von Eleasars Standhaftigkeit unter der Folter
  choice: Die Traumformulierung wird als Vergleich für sein Erleben der Folter wiedergegeben.
  alternative: Man könnte „als wäre es ein Traum“ übersetzen und damit stärker den unwirklichen Charakter des Geschehens betonen.
  rationale: ὥσπερ kennzeichnet ausdrücklich einen Vergleich. Die Übersetzung wahrt das rhetorische Bild, ohne einen tatsächlichen Traumzustand oder eine weitergehende philosophische Deutung zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hochgesinnt“ ist leicht gehoben, aber verständlich und hält den inneren Adel von der vornehmen Herkunft auseinander. Der deutsche Satz wurde moderat umgestellt, damit Vergleich, Folter und Standhaftigkeit klar aufeinander bezogen bleiben.
