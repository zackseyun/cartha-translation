    rationale: μετετρέπετο bezeichnet, dass Eleasar nicht umgestimmt oder abgewandt wurde; einen „Weg“ benennt der Vers nicht. Eine weniger spezifizierende Wiedergabe bewahrt den offenen Bezug des Verbs.
  - severity: low
    issue: „obwohl“ interpretiert die partizipiale Konstruktion ausdrücklich als Konzessivsatz.
    rationale: Die Aussage ist inhaltlich naheliegend, doch die griechische Konstruktion verbindet den Traumvergleich unmittelbar mit dem Erleiden der Folter. Eine vergleichende deutsche Einbindung bildet dies enger nach.
