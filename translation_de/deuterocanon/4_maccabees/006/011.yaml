lexical_decisions:
- source_word: ἱδρῶν … τὸ πρόσωπον
  choice: schwitzte er im Gesicht
  rationale: Die Partizipialkonstruktion beschreibt den fortdauernden körperlichen Zustand; die deutsche Wendung ist natürlich und bewahrt den ausdrücklichen Bezug auf das Gesicht.
- source_word: γέ τοι
  choice: dabei
  rationale: Die Partikelverbindung setzt den beschriebenen körperlichen Zustand nachdrücklich in Beziehung zu seinem Mut. „Dabei“ gibt diesen kontrastierenden Anschluss im Deutschen natürlich wieder.
- source_word: ἐπασθμαίνων σφοδρῶς
  choice: keuchte heftig
  rationale: ἐπασθμαίνω bezeichnet angestrengtes, keuchendes Atmen; σφοδρῶς verstärkt es. Die knappe Wiedergabe trifft beide Elemente.
- source_word: ὑπʼ αὐτῶν τῶν βασανιζόντων
  choice: selbst die, die ihn folterten
  rationale: αὐτῶν mit Artikel und Partizip ist emphatisch. „Selbst“ erhält die überraschende Hervorhebung, dass gerade seine Folterer beeindruckt waren.
- source_word: ἐθαυμάζετο
  choice: bewunderten ihn
  rationale: Das Imperfekt Passiv bezeichnet anhaltende staunende Anerkennung; die aktive deutsche Form vermeidet eine schwerfällige Passivkonstruktion, ohne den Sinn zu ändern.
- source_word: ἐπὶ τῇ εὐψυχίᾳ
  choice: wegen seines Mutes
  rationale: εὐψυχία bezeichnet Mut beziehungsweise Standhaftigkeit angesichts von Leiden. „Mut“ ist klar, würdig und ohne zusätzliche konfessionelle Deutung.
