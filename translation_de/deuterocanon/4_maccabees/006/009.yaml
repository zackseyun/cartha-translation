lexical_decisions:
- source_word: ὑπέμενεν
  choice: ertrug
  rationale: Gibt das beharrliche Aushalten der Schmerzen im Kontext natürlich und prägnant wieder.
- source_word: τοὺς πόνους
  choice: die Schmerzen
  rationale: πόνοι bezeichnet hier die durch Folter verursachten körperlichen Leiden beziehungsweise Schmerzen.
- source_word: περιεφρόνει
  choice: verachtete
  rationale: Bewahrt die starke Aussage, dass er dem auferlegten Zwang geringschätzig begegnete, ohne sie zu einer bloßen Weigerung abzuschwächen.
- source_word: τῆς ἀνάγκης
  choice: den Zwang
  rationale: ἀνάγκη meint hier den äußeren Druck beziehungsweise die Nötigung, nicht abstrakte Notwendigkeit.
- source_word: διεκαρτέρει
  choice: hielt … standhaft aus
  rationale: Vermittelt fortgesetztes, entschlossenes Ausharren; die deutsche Verbklammer sorgt für einen natürlichen Satz.
- source_word: τοὺς αἰκισμούς
  choice: die Misshandlungen
  rationale: αἰκισμοί bezeichnet grausame körperliche Misshandlungen oder Folterungen; „Misshandlungen“ bewahrt den etwas weiteren Bedeutungsumfang.
