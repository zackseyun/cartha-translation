base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/033.yaml
  text: But now[a], since reason has conquered the passions[b], we rightly assign to it the authority of leadership.
translation:
  language: de
  text: Doch nun, da die Vernunft[a] die Leidenschaften überwunden hat, sprechen wir ihr zu Recht die Vollmacht zu herrschen zu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das vernünftige Urteil“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „weisen wir ihr die Vollmacht der Herrschaft zu“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Doch nun
  rationale: Kennzeichnet einen Übergang mit leichtem Gegensatz und bewahrt so die argumentative Wendung.
- source_word: λογισμοῦ
  choice: Vernunft
  rationale: λογισμός bezeichnet in 4 Makkabäer die vernünftige sittliche Urteilskraft, die über die Leidenschaften herrscht. „Vernunft“ ist prägnant und entspricht dem philosophischen Leitbegriff.
- source_word: τὰ πάθη
  choice: die Leidenschaften
  rationale: Im ethisch-philosophischen Gegensatz zu λογισμός sind hier Affekte beziehungsweise irrationale Regungen gemeint, nicht Leiden.
- source_word: νικήσαντος
  choice: überwunden hat
  rationale: Gibt das Aoristpartizip als abgeschlossenen Sieg in einer natürlichen deutschen Nebensatzkonstruktion wieder.
- source_word: αὐτῷ
  choice: ihr
  rationale: Das Pronomen bezieht sich auf die im Deutschen feminine „Vernunft“, ohne die rhetorische Personifikation über den griechischen Text hinaus zu verstärken.
- source_word: προσηκόντως
  choice: zu Recht
  rationale: Drückt die Angemessenheit und Berechtigung der Zuschreibung idiomatisch aus.
- source_word: τὴν τῆς ἡγεμονίας ... ἐξουσίαν
  choice: die Vollmacht zu herrschen
  rationale: „Vollmacht“ bewahrt den Sinn von ἐξουσία als Befugnis oder Autorität; „zu herrschen“ gibt ἡγεμονία als leitende Herrschaft natürlich wieder.
- source_word: προσνέμομεν
  choice: sprechen wir ... zu
  rationale: Entspricht dem Zuweisen oder Zuerkennen einer Befugnis und klingt im Deutschen in diesem argumentativen Zusammenhang natürlich.
theological_decisions:
- issue: Anthropologisch-philosophisches Verhältnis von λογισμός und πάθη
  choice: λογισμός als „Vernunft“ und πάθη als „Leidenschaften“ wiedergeben
  alternative: „vernünftiges Urteil“ sowie „Gefühle“, „Regungen“ oder „Leiden“
  rationale: Der Vers greift die Leitthese des 4. Makkabäerbuchs auf, dass vernünftige sittliche Urteilskraft die irrationalen Leidenschaften beherrschen kann. Die gewählte Formulierung wahrt diesen begrifflichen Gegensatz, ohne spätere konfessionelle Anthropologien einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der philosophische Leitbegriff „Vernunft“ bleibt knapp und verständlich; „die Vollmacht zu herrschen“ vermeidet eine schwerfällige Nominalkonstruktion, ohne die Verbindung von Autorität und Herrschaft einzuebnen.
