  text: and shall we be despised by the tyrant as unmanly[a], yet not defend our divine law even to death?
translation:
  language: de
  text: Und sollen wir vom Tyrannen als unmännlich[a] verachtet werden und doch unser göttliches Gesetz nicht bis zum Tod verteidigen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »feige«. Der griechische Ausdruck ist wörtlich geschlechtlich geprägt (»unmännlich«) und bezeichnet mangelnden Mut.'
    reason: Lexikalische Alternative und Erklärung der geschlechtlich geprägten Ausdrucksweise.
lexical_decisions:
- source_word: καταφρονηθῶμεν
  choice: uns … verachten lassen
  rationale: Die Form ist ein passiver Konjunktiv in einer rhetorischen Frage. Die deutsche Wendung gibt das Erleiden der Verachtung natürlich wieder, ohne den Gedanken freiwilliger Zustimmung auszudrücken.
- source_word: τοῦ τυράννου
  choice: vom Tyrannen
  rationale: τύραννος bezeichnet wertend einen gewalttätigen, willkürlich herrschenden Machthaber; „Tyrann“ bewahrt diese negative Konnotation.
- source_word: ἄνανδροι
  choice: unmännlich
  rationale: Das griechische Wort ist ausdrücklich geschlechtlich geprägt und bezeichnet einen Mangel an dem als männlich verstandenen Mut. „Unmännlich“ erhält diese rhetorische Form; „feige“ erläutert den gemeinten Sinn in der Fußnote.
- source_word: τὸν θεῖον ἡμῶν νόμον
  choice: unser göttliches Gesetz
  rationale: θεῖος kennzeichnet das Gesetz als göttlich beziehungsweise von Gott stammend; νόμος bezeichnet hier das jüdische Gottesgesetz.
- source_word: μέχρι θανάτου
  choice: bis zum Tod
  rationale: 'Die Wendung bezeichnet die äußerste Grenze des Eintretens für das Gesetz: bis hin zum Tod.'
- source_word: προασπίσαιμεν
  choice: verteidigen
  rationale: Das Verb bedeutet ursprünglich, etwas mit einem davorgehaltenen Schild zu schützen, und im übertragenen Sinn „verteidigen“.
theological_decisions:
- issue: Wiedergabe der geschlechtlich geprägten Beschimpfung ἄνανδροι
  choice: unmännlich
  alternative: feige
  rationale: Die Übersetzung bewahrt im Haupttext die im Griechischen vorhandene Verbindung von Männlichkeit und Mut, ohne sie als zeitlose Wertung zu erklären. Die Fußnote nennt die natürliche sinngemäße Alternative.
- issue: Beziehung zwischen der Verachtung durch den Tyrannen und der unterlassenen Verteidigung des Gesetzes
  choice: und doch
  alternative: und
  rationale: Die Partikelfolge μὲν … δὲ stellt die beiden Gedanken einander gegenüber. „Und doch“ macht den rhetorischen Gegensatz im Deutschen deutlich, ohne eine zusätzliche theologische Folgerung einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Frage bleibt erhalten; „unmännlich“ bewahrt bewusst die historische Zuspitzung des griechischen Ausdrucks, während die Fußnote dessen Sinn für heutige Leser erklärt.
