  to: Ihr aber, Kinder Abrahams, sterbt als Antwort darauf ehrenvoll um der Frömmigkeit willen.[a]
  rationale: Die Überarbeitung ersetzt zwei missverständnisanfällige Ausdrücke durch idiomatisches modernes Standarddeutsch. „Als Antwort darauf“ folgt der diskursiven Funktion von πρὸς ταῦτα und dem englischen Audit trail. „Ehrenvoll“ gibt εὐγενῶς ohne die körperliche Nebenbedeutung von „Haltung“ wieder. „Frömmigkeit“ ist die sachliche Grundwiedergabe von εὐσέβεια; „Gottesfurcht“ bleibt als tragfähige Alternative vermerkt. Die Ambiguität von τελευτᾶτε wird nicht aufgelöst.
