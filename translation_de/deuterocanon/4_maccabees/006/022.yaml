  text: In response to this[a], you, O children of Abraham, die nobly for the sake of godliness.
translation:
  language: de
  text: Ihr aber, Kinder Abrahams, sterbt als Antwort darauf ehrenvoll um der Frömmigkeit willen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gottesfurcht«. Das griechische Wort εὐσέβεια bezeichnet ehrfürchtige Hingabe an Gott, die sich in treuem Handeln zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: angesichts dessen
  rationale: Die Wendung bezieht die Aufforderung auf das zuvor Gesagte. »Angesichts dessen« gibt diesen Zusammenhang im modernen Deutschen natürlich wieder, ohne die Beziehung enger als Ursache oder Antwort festzulegen.
- source_word: ὑμεῖς μέν
  choice: ihr aber
  rationale: Das betonte Pronomen wird ausdrücklich wiedergegeben; »aber« bewahrt die durch μέν markierte, wenn auch nur leicht ausgeprägte Gegenüberstellung.
- source_word: ὦ Ἀβραὰμ παῖδες
  choice: Kinder Abrahams
  rationale: παῖδες kann »Kinder« oder »Söhne« bedeuten. »Kinder Abrahams« erhält den familiären und heilsgeschichtlichen Klang, ohne die Bedeutung unnötig auf männliche Nachkommen zu verengen. Die feierliche Anrede wird im Deutschen durch die direkte Anrede ausreichend getragen.
- source_word: εὐγενῶς
  choice: in edler Haltung
  rationale: Das Adverb bezeichnet ein edles, hochgesinntes Verhalten. »In edler Haltung« klingt im Deutschen natürlicher als das hier leicht missverständliche »edel sterben« und beschränkt die Aussage nicht nur auf Tapferkeit.
- source_word: ὑπὲρ τῆς εὐσεβείας
  choice: um der Gottesfurcht willen
  rationale: ὑπέρ bezeichnet hier den Grund beziehungsweise das Gut, für das der Tod auf sich genommen wird. »Gottesfurcht« bringt die ehrfürchtige, im treuen Handeln sichtbare Hingabe an Gott zum Ausdruck; »um … willen« wahrt den feierlichen Ton.
- source_word: τελευτᾶτε
  choice: sterbt
  rationale: Die Form kann morphologisch Indikativ oder Imperativ sein. Die direkte Anrede und der Zusammenhang sprechen für eine Aufforderung; »sterbt« gibt den schlichten und zugleich feierlichen Ausdruck prägnant wieder.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Zusammenhang des Martyriums
  choice: Gottesfurcht
  alternative: Frömmigkeit; ehrfürchtige Hingabe an Gott
  rationale: Gemeint ist eine auf Gott gerichtete Ehrfurcht, die sich in treuem Verhalten bewährt. »Gottesfurcht« ist im Deutschen verständlich und religiös klar, ohne eine spätere konfessionelle Fachbedeutung einzutragen; die breitere Alternative »Frömmigkeit« wird in der Fußnote bewahrt.
- issue: Aussage oder Aufforderung bei τελευτᾶτε
  choice: 'Aufforderung: »sterbt«'
  alternative: 'Aussage: »ihr sterbt«'
  rationale: Obwohl die griechische Form für sich genommen als Indikativ oder Imperativ gelesen werden kann, legt die feierliche direkte Anrede an die Kinder Abrahams hier eine Ermahnung beziehungsweise Aufforderung nahe. Der deutsche Satzbau macht diese kontextuell wahrscheinliche Lesart deutlich.
translation_notes:
  register: Feierlich und ermahnend, aber in gegenwärtigem Standarddeutsch. Die Anrede »Kinder Abrahams« und die Wendung »um … willen« erhalten den erhöhten rhetorischen Ton; unnötig altertümliche Formen werden vermieden.
