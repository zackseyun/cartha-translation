  source_fidelity: Die Satzbestandteile sind vollständig erfasst. πρὸς ταῦτα wird mit „Als Antwort darauf“ als Reaktion auf den vorangehenden Zusammenhang wiedergegeben. Die Form τελευτᾶτε bleibt im Deutschen formal offen, da „sterbt“ je nach Kontext Aussage oder Aufforderung sein kann; eine Entscheidung zwischen beiden Lesarten wird nicht in den Text eingetragen.
  naturalness: „In edler Haltung“ kann im heutigen Deutsch eine körperliche Haltung nahelegen und ist daher für das adverbiale εὐγενῶς nicht optimal. „Ehrenvoll“ ist idiomatisch, wahrt den gehobenen Ton und bezeichnet die Art des Sterbens.
  terminology: „Frömmigkeit“ ist für εὐσέβεια im jüdisch-griechischen Kontext eine präzise und im Deutschen natürliche Grundwiedergabe. Die mögliche Nuance „Gottesfurcht“ wird als Alternative in der Fußnote bewahrt, ohne die Bedeutung auf Angst oder eine spätere theologische Terminologie festzulegen.
