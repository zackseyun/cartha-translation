base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/035.yaml
  text: Even if it is ridiculous, I demonstrate not only that reason has gained mastery over pains, but also that it rules over pleasures and does not yield to them.
translation:
  language: de
  text: 'Auch wenn es lächerlich ist: Ich zeige nicht nur, dass die Vernunft die Schmerzen bezwungen hat, sondern auch, dass sie die Genüsse beherrscht und ihnen nicht nachgibt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ καὶ γελοῖον
  choice: Auch wenn es lächerlich ist
  rationale: Die elliptische, konzessive Wendung des Griechischen bleibt erhalten. »Lächerlich« gibt γελοῖον direkt und ohne abschwächende Deutung wieder.
- source_word: ἀλγηδόνων
  choice: Schmerzen
  rationale: Das Wort bezeichnet unmittelbar empfundene Schmerzen; »Qualen« würde die Bedeutung trotz des Folterkontexts unnötig verstärken.
- source_word: ἐπιδείκνυμι
  choice: ich zeige
  rationale: Das Verb meint ein sichtbares oder öffentliches Aufzeigen beziehungsweise Erweisen. »Ich zeige« ist im Deutschen natürlich und bewahrt den demonstrativen Sinn.
- source_word: κεκρατηκέναι τὸν λογισμόν
  choice: dass die Vernunft … bezwungen hat
  rationale: Das Perfekt bezeichnet eine errungene Überlegenheit. »Bezwungen hat« bringt den vollendeten Aspekt und das Motiv der Herrschaft über die Affekte zum Ausdruck.
- source_word: τὸν λογισμόν
  choice: die Vernunft
  rationale: λογισμός ist in 4 Makkabäer ein Leitbegriff für die vernünftige Urteilskraft, die über die Leidenschaften herrscht. »Vernunft« ist prägnant und im Deutschen philosophisch verständlich.
- source_word: τῶν ἡδονῶν κρατεῖν
  choice: die Genüsse beherrscht
  rationale: ἡδοναί bezeichnet angenehme Lustempfindungen oder Genüsse; »Genüsse« ist hier natürlicher als das missverständliche »Vergnügungen«. »Beherrscht« wahrt die Aussage von κρατεῖν.
- source_word: μηδὲ αὐταῖς ὑπείκειν
  choice: und ihnen nicht nachgibt
  rationale: ὑπείκειν bedeutet weichen oder nachgeben. Die Formulierung bewahrt das Bild standhaften Widerstands.
theological_decisions:
- issue: Wiedergabe von λογισμός im philosophisch geprägten Martyriumskontext
  choice: Vernunft
  alternative: vernünftige Urteilskraft
  rationale: »Vernunft« erhält den programmatischen Begriff des Buches, ohne eine spätere konfessionelle oder philosophische Spezialdeutung einzutragen.
- issue: Intensität von ἀλγηδόνων angesichts des Folterkontexts
  choice: Schmerzen
  alternative: Qualen
  rationale: Der Kontext beschreibt schweres Leiden, doch das Substantiv selbst bedeutet grundlegend »Schmerzen«. Die Übersetzung fügt keine lexikalisch nicht ausdrücklich gegebene Steigerung ein.
- issue: Verhältnis der Vernunft zu den ἡδοναί
  choice: beherrscht die Genüsse und gibt ihnen nicht nach
  alternative: unterdrückt die Lust
  rationale: Der griechische Text spricht von Herrschaft und Nichtnachgeben, nicht von einer vollständigen Beseitigung oder grundsätzlichen Verurteilung der Lust. Diese Spannung bleibt gewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eröffnende elliptische Satz wird entsprechend der griechischen Zeichensetzung als eigenständige, bewusst unvollständige Konzession bewahrt. Die Begrifflichkeit bleibt philosophisch verständlich, ohne unnötigen Fachjargon.
