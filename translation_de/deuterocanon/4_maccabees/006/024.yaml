  yaml_path: translation/deuterocanon/4_maccabees/006/024.yaml
  text: When they saw that he was so noble-minded in the face of these compulsions, and that he was not even changing toward pity for them, they led him to the fire.
translation:
  language: de
  text: Als sie sahen, welche innere Größe er angesichts der Zwangsmaßnahmen[a] zeigte und dass er sich nicht einmal durch ihr Mitleid[b] umstimmen ließ, führten sie ihn zum Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Zwangs“ beziehungsweise „der auf ihn ausgeübten Druckmittel“. Das griechische Wort bezeichnet hier auferlegte Zwänge, nicht gewöhnliche Notwendigkeiten.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich kann die griechische Genitivverbindung auch als „Mitleid mit ihnen“ verstanden werden. Im Zusammenhang ist jedoch wahrscheinlich ihr Mitleid mit ihm gemeint.
    reason: ambiguity
lexical_decisions:
- source_word: Πρὸς τὰς ἀνάγκας
  choice: angesichts der Zwangsmaßnahmen
  rationale: πρός bezeichnet hier die Haltung gegenüber den von außen ausgeübten Zwängen; ἀνάγκαι meint im Folter- und Hinrichtungskontext nicht gewöhnliche Notwendigkeiten, sondern auferlegte Zwangsmittel oder Druckmaßnahmen.
- source_word: μεγαλοφρονοῦντα
  choice: welche innere Größe er … zeigte
  rationale: Das Partizip bezeichnet eine großgesinnte, hochherzige Haltung. Die Wendung gibt diesen ethisch-geistigen Sinn in verständlichem modernem Deutsch wieder, ohne ihn auf bloßen Mut zu verengen.
- source_word: ἰδόντες
  choice: Als sie sahen
  rationale: Das aoristische Partizip wird seinem temporalen Verhältnis zur Haupthandlung entsprechend als Nebensatz wiedergegeben.
- source_word: μηδὲ
  choice: nicht einmal
  rationale: Die Form verstärkt die Verneinung und wird daher nicht nur mit „nicht“ wiedergegeben.
- source_word: πρὸς τὸν οἰκτιρμὸν αὐτῶν
  choice: durch ihr Mitleid
  rationale: 'Im Zusammenhang liegt nahe, αὐτῶν als subjektiven Genitiv zu verstehen: Das Mitleid der Umstehenden vermochte seine Haltung nicht zu verändern. „Durch“ drückt idiomatisch den erfolglosen Einfluss dieses Mitleids aus.'
- source_word: μεταβαλλόμενον
  choice: sich … umstimmen ließ
  rationale: Das mediale beziehungsweise passive Partizip bezeichnet eine Änderung der Haltung unter äußerem Einfluss; „umstimmen“ trifft dies natürlicher als das wörtliche „sich verändern“.
- source_word: ἐπὶ τὸ πῦρ
  choice: zum Feuer
  rationale: Die Präpositionalfügung bezeichnet die Bewegung zum Ort oder Mittel der Hinrichtung, ohne ausdrücklich zu sagen, dass er bereits ins Feuer geworfen wurde.
- source_word: ἦγον
  choice: führten sie ihn
  rationale: Das Imperfekt von ἄγω bezeichnet hier das Abführen beziehungsweise Hinführen unter Zwang.
theological_decisions:
- issue: Bezug von αὐτῶν bei οἰκτιρμόν
  choice: ihr Mitleid, also das Mitleid der Handelnden mit ihm
  alternative: sein Mitleid mit ihnen
  rationale: Der subjektive Genitiv passt am besten zum unmittelbaren Zusammenhang, in dem andere ihn aus Mitleid zum Nachgeben bewegen wollen. Da die griechische Genitivverbindung grammatisch auch anders verstanden werden kann, wird die Alternative in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Innere Größe“ vermittelt die Bedeutung von μεγαλοφρονεῖν verständlich, ohne den philosophisch-ethischen Gehalt auf bloße Tapferkeit zu reduzieren. Der Satzbau folgt der griechischen Abfolge, bleibt aber im Deutschen flüssig.
