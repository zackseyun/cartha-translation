  text: And first they stripped the old man[a], adorned with the dignity of godliness.
translation:
  language: de
  text: Und zuerst entkleideten sie den Greis, der mit der Würde seiner Frömmigkeit[a] geschmückt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gottesfurcht“. Die Wendung kann auch wiedergegeben werden: „mit der würdevollen Haltung, die mit seiner Frömmigkeit verbunden war“.'
    reason: Lexikalische Alternative und Bewahrung der Mehrdeutigkeit der komprimierten griechischen Wendung.
lexical_decisions:
- source_word: καὶ πρῶτον μὲν
  choice: Und zuerst
  rationale: Bewahrt sowohl den Anschluss durch καί als auch den Auftakt einer Abfolge durch πρῶτον μέν.
- source_word: περιέδυσαν
  choice: entkleideten sie
  rationale: Gibt das Ausziehen beziehungsweise Entblößen einer Person direkt und idiomatisch wieder und lässt die erniedrigende Handlung erkennen.
- source_word: τὸν γεραιὸν
  choice: den Greis
  rationale: Entspricht der Bezeichnung eines hochbetagten Mannes und passt zum würdevollen, gehobenen Ton des Satzes.
- source_word: ἐκκεκοσμημένον
  choice: der … geschmückt war
  rationale: Die metaphorische Bedeutung des Partizips wird bewahrt und auf die nachfolgend genannte Würde bezogen.
- source_word: τὴν περὶ τὴν εὐσέβειαν εὐσχημοσύνην
  choice: mit der Würde seiner Frömmigkeit
  rationale: Die knappe griechische Verbindung bezeichnet eine würdevolle, angemessene Erscheinung im Bereich der εὐσέβεια. Die deutsche Genitivfügung bleibt ebenfalls bewusst knapp und legt das genaue Verhältnis nicht unnötig fest.
- source_word: εὐσέβειαν
  choice: Frömmigkeit
  rationale: Bezeichnet in 4 Makkabäer die auf Gott und sein Gesetz ausgerichtete Lebenshaltung. „Frömmigkeit“ ist im Deutschen verständlich, würdevoll und als ethisch-theologischer Leitbegriff geeignet.
theological_decisions:
- issue: Wiedergabe des Leitbegriffs εὐσέβεια
  choice: Frömmigkeit
  alternative: Gottesfurcht; Gottesverehrung
  rationale: „Frömmigkeit“ umfasst hier Verehrung Gottes und gesetzestreue Lebensführung, ohne den Begriff auf bloße Furcht oder kultische Verehrung einzuengen.
- issue: Verhältnis von εὐσχημοσύνη und εὐσέβεια
  choice: Würde seiner Frömmigkeit
  alternative: würdige Haltung, die mit der Frömmigkeit verbunden war
  rationale: 'Die kompakte Formulierung wahrt die Unbestimmtheit von περὶ: Die Würde kann als zur Frömmigkeit gehörig, aus ihr hervorgehend oder sie sichtbar verkörpernd verstanden werden.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Greis“ trägt den gehobenen Erzählton; die Bildsprache des Geschmücktseins wird erhalten und steht wirkungsvoll dem gewaltsamen Entkleiden gegenüber.
