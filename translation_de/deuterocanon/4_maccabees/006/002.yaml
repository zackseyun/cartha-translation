  source_fidelity: Der Satz gibt καὶ πρῶτον μέν mit „Und zuerst“ treffend wieder und bewahrt die Abfolge. „entkleideten sie den Greis“ entspricht περιέδυσαν τὸν γεραιόν. Der Relativsatz gibt das auf den Greis bezogene Partizip ἐκκεκοσμημένον korrekt wieder; „Würde seiner Frömmigkeit“ bildet die verdichtete Beziehung von εὐσχημοσύνη zu εὐσέβεια angemessen nach, ohne die Funktion von περὶ zu eng festzulegen.
  naturalness: Das Deutsch ist klar, idiomatisch und im würdevollen erzählerischen Register gut lesbar. „Greis“ ist leicht gehoben, aber im Kontext eines ehrenden Kontrasts zur Erniedrigung passend und nicht unnatürlich.
  terminology: „Frömmigkeit“ ist für εὐσέβεια in diesem Zusammenhang eine tragfähige, moderne theologisch-ethische Wiedergabe. Die Fußnote nennt mit „Gottesfurcht“ eine mögliche Alternative und erläutert sinnvoll die komprimierte griechische Formulierung. Es besteht kein Anlass, eine konfessionell engere Deutung einzutragen.
