  text: But you[a], the tyrant’s bodyguards, why do you delay?
translation:
  language: de
  text: Aber ihr, die Leibwächter[a] des Tyrannen, warum zögert ihr?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Speerträger«; gemeint sind die bewaffneten Wächter oder Leibwächter des Tyrannen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... δορυφόροι
  choice: ihr, die Leibwächter
  rationale: δορυφόροι bedeutet wörtlich »Speerträger«, bezeichnet hier aber die bewaffneten Begleiter beziehungsweise Leibwächter des Tyrannen. Die Anrede mit »ihr« entspricht der durch die anschließende Frage erkennbaren direkten Ansprache.
- source_word: τοῦ τυράννου
  choice: des Tyrannen
  rationale: Der Genitiv wird im Deutschen natürlich mit »des Tyrannen« wiedergegeben; »Tyrann« bewahrt die negative politisch-moralische Färbung von τύραννος.
- source_word: τί μέλλετε;
  choice: warum zögert ihr?
  rationale: Das absolut gebrauchte μέλλω bezeichnet in diesem vorwurfsvollen Zuruf ein Zögern oder Säumen vor der erwarteten Handlung, nicht bloß Zukünftigkeit.
- source_word: οἱ δὲ
  choice: Aber ihr
  rationale: δέ markiert den Gegensatz beziehungsweise Übergang. Obwohl οἱ formal ein Artikel im Nominativ ist, zeigt die Frage die direkte Anrede; »Aber ihr« gibt diese im Deutschen natürlich wieder.
