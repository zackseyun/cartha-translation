  yaml_path: translation/deuterocanon/4_maccabees/006/020.yaml
  text: For it would be shameful if we should live on for a little while, and that while being mocked by everyone for cowardice.
translation:
  language: de
  text: Denn es wäre eine Schande, wenn wir noch eine kurze Zeit weiterlebten und dabei von allen wegen unserer Feigheit verspottet würden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρόν
  choice: es wäre eine Schande
  rationale: Die substantivische deutsche Wendung gibt die moralische Schande und den Ehrverlust natürlich und würdig wieder.
- source_word: ἐπιβιώσομεν
  choice: wir noch … weiterlebten
  rationale: „Weiterleben“ erfasst das Fortleben über die gegenwärtige Bedrohung hinaus; „noch“ verdeutlicht den zeitlichen Fortbestand, ohne den Sinn zu erweitern.
- source_word: ὀλίγον χρόνον
  choice: eine kurze Zeit
  rationale: Gibt den Akkusativ der Zeitdauer knapp und idiomatisch wieder.
- source_word: καταγελώμενοι
  choice: verspottet würden
  rationale: Bewahrt den passiven Sinn und die öffentliche Herabsetzung; im deutschen Satz wird das Partizip als paralleler Bestandteil des irrealen Bedingungssatzes ausgedrückt.
- source_word: πρὸς ἀπάντων
  choice: von allen
  rationale: Entspricht der umfassenden Aussage des Griechischen in natürlichem Deutsch.
- source_word: ἐπὶ δειλίᾳ
  choice: wegen unserer Feigheit
  rationale: „Feigheit“ bewahrt die moralische Schärfe von δειλία. Das Possessivpronomen macht im Deutschen deutlich, dass den Sprechenden diese Feigheit zugeschrieben würde.
