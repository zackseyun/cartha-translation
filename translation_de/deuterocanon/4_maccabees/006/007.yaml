  text: And falling to the ground because his body could not bear the pains[a], he kept his reason upright and unbending.
translation:
  language: de
  text: Und als er zu Boden fiel, weil sein Körper die Schmerzen nicht ertragen konnte, hielt er seine Vernunft[a] aufrecht und unbeugsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine vernünftige Urteilskraft“; das griechische Wort bezeichnet hier die Vernunft als sittlich urteilende Kraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίπτων
  choice: als er … fiel
  rationale: Das präsentische Partizip bezeichnet eine Handlung, die gleichzeitig mit dem Hauptgeschehen verläuft. Die Wiedergabe mit „als“ ist im Deutschen natürlich, ohne den im Griechischen nur aus dem Gegensatz erschließbaren konzessiven Sinn ausdrücklich festzulegen.
- source_word: εἰς τὸ ἔδαφος
  choice: zu Boden
  rationale: „Zu Boden fallen“ ist die natürliche deutsche Entsprechung für das Fallen auf die Bodenfläche.
- source_word: ἀπὸ τοῦ μὴ φέρειν
  choice: weil … nicht ertragen konnte
  rationale: Die Konstruktion bezeichnet den Grund seines Fallens und wird daher mit einem kausalen Nebensatz wiedergegeben.
- source_word: τὸ σῶμα
  choice: sein Körper
  rationale: Der bestimmte Artikel bezieht sich im Kontext auf den Körper des Gemarterten; das Possessivpronomen entspricht natürlichem deutschem Sprachgebrauch.
- source_word: τὰς ἀλγηδόνας
  choice: die Schmerzen
  rationale: Das Wort bezeichnet heftige körperliche Schmerzen; „Schmerzen“ ist direkt, verständlich und weniger steigernd als „Qualen“.
- source_word: ὀρθὸν εἶχεν
  choice: hielt … aufrecht
  rationale: Die Formulierung bewahrt das Bild eines trotz des körperlichen Zusammenbruchs aufrecht gehaltenen Denk- und Urteilsvermögens.
- source_word: ἀκλινῆ
  choice: unbeugsam
  rationale: Das Adjektiv bedeutet wörtlich, dass etwas sich nicht neigt oder abwendet, und bezeichnet hier bildlich unnachgiebige Standfestigkeit.
- source_word: τὸν λογισμόν
  choice: seine Vernunft
  rationale: λογισμός bezeichnet in 4 Makkabäer die vernünftige, sittlich urteilende Kraft, die über die Leidenschaften herrscht. „Vernunft“ erhält den philosophischen Leitbegriff knapp und verständlich.
theological_decisions:
- issue: Wiedergabe des philosophisch geprägten Begriffs λογισμός
  choice: Vernunft
  alternative: vernünftige Urteilskraft
  rationale: „Vernunft“ bewahrt das zentrale Thema des Buches, dass fromme Vernunft körperlichen Leiden und Leidenschaften widersteht, ohne den Begriff durch eine erklärende Erweiterung vorschnell einzuengen.
- issue: Verhältnis von körperlichem Fall und innerer Standfestigkeit
  choice: als er … fiel
  alternative: obwohl er … fiel
  rationale: Der Gegensatz ist deutlich, doch das Partizip selbst markiert keine eindeutige Konzession. „Als“ bewahrt die grammatische Offenheit, während „aufrecht und unbeugsam“ die Spannung im Satz erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperliche Bildsprache des Originals wird durch „zu Boden“, „aufrecht“ und „unbeugsam“ erhalten; der Satz bleibt für heutige Leser verständlich.
