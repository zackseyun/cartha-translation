  text: “Obey the king’s commands,” another herald cried out[a].
translation:
  language: de
  text: „Gehorche den Befehlen des Königs!“, rief von anderer Seite ein Herold[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rief ein anderer Herold“. Wörtlich bezeichnet das griechische Wort eine andere Seite oder Richtung; im Zusammenhang kann damit gemeint sein, dass der Ruf von einem anderen Herold kam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείσθητι
  choice: Gehorche
  rationale: Der aoristische Passivimperativ von πείθω lautet formal „Lass dich überzeugen“, bezeichnet hier mit dem Dativ der königlichen Befehle jedoch idiomatisch das Befolgen beziehungsweise den Gehorsam.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: den Befehlen des Königs
  rationale: ἐντολαί bezeichnet verbindliche Anordnungen; „Befehle“ gibt deren verpflichtenden Charakter in diesem königlichen Kontext natürlich wieder.
- source_word: ἑτέρωθεν
  choice: von anderer Seite
  rationale: Das Adverb bezeichnet eine andere Seite oder Richtung. Die räumliche Formulierung bleibt erhalten, statt die im Griechischen nicht ausdrücklich genannte Identität eines weiteren Herolds festzulegen.
- source_word: κῆρυκος
  choice: ein Herold
  rationale: κῆρυξ ist ein öffentlicher beziehungsweise amtlicher Ausrufer; „Herold“ ist präzise und dem würdigen Erzählregister angemessen.
- source_word: ἐπιβοῶντος
  choice: rief
  rationale: Das Partizip beschreibt lautes Zurufen oder Ausrufen. „rief“ ist im Deutschen idiomatisch und vermittelt die öffentliche Äußerung ohne unnötige Verstärkung.
