base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/019.yaml
  text: and we ourselves would become a pattern of ungodliness for the young[a], so that we might become an example of eating what is defiled.
translation:
  language: de
  text: Und wir selbst würden für die jungen Menschen zu einem Muster der Gottlosigkeit werden, damit wir zu einem Beispiel dafür würden, Verunreinigtes zu essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Beispiel für unreines Essen“; auch: „ein Beispiel dafür, unreine Speisen zu essen“.'
    reason: Lexikalische Alternativen für μιαροφαγίας; der Ausdruck kann sowohl die Art des Essens als auch das Essen verunreinigter bzw. unreiner Nahrung bezeichnen.
lexical_decisions:
- source_word: τύπος
  choice: Muster
  rationale: τύπος bezeichnet hier ein Muster oder Vorbild. „Muster“ wahrt gegenüber παράδειγμα („Beispiel“) die rhetorische Unterscheidung der beiden griechischen Wörter.
- source_word: ἀσεβείας
  choice: Gottlosigkeit
  rationale: Das Wort bezeichnet mangelnde Ehrfurcht gegenüber Gott beziehungsweise frevelhaftes Verhalten. „Gottlosigkeit“ gibt diese religiös-moralische Dimension in verständlichem Deutsch wieder.
- source_word: τοῖς νέοις
  choice: für die jungen Menschen
  rationale: νέοι kann junge Menschen oder, je nach Kontext, junge Männer bezeichnen. Die inklusive Formulierung vermeidet eine vom Griechischen nicht erzwungene geschlechtliche Festlegung.
- source_word: παράδειγμα
  choice: Beispiel
  rationale: παράδειγμα bedeutet Beispiel oder exemplarisches Vorbild. „Beispiel“ ist natürlich und bleibt von τύπος („Muster“) lexikalisch unterschieden.
- source_word: μιαροφαγίας
  choice: Essen von Beflecktem
  rationale: Das zusammengesetzte Substantiv bezeichnet das Essen von Beflecktem beziehungsweise verunreinigtes Essen. Die Wiedergabe bleibt nahe am Ausdruck und legt ihn nicht vorschnell auf einen technischen Reinheitsbegriff fest.
- source_word: γενοίμεθα / γενώμεθα
  choice: würden … werden / würden
  rationale: Die modale Formulierung bildet den hypothetischen Charakter des Optativs γενοίμεθα und den durch ἵνα eingeleiteten Folgesatz mit γενώμεθα ab.
theological_decisions:
- issue: Religiös-moralische Aussage von ἀσεβείας
  choice: Gottlosigkeit
  alternative: Frevel; Missachtung Gottes
  rationale: Gemeint ist nicht bloß gesellschaftliches Fehlverhalten, sondern Verhalten ohne gebührende Ehrfurcht vor Gott. „Gottlosigkeit“ erhält diese Spannung, ohne eine konfessionelle Deutung einzutragen.
- issue: Reichweite von μιαροφαγίας
  choice: Essen von Beflecktem
  alternative: unreines Essen; Essen unreiner Speisen
  rationale: Der Kontext betrifft verbotene beziehungsweise verunreinigte Nahrung, doch der griechische Ausdruck ist nicht auf eine einzige technische Kategorie beschränkt. Die Übersetzung bewahrt diese Offenheit.
- issue: Verhältnis von τύπος und παράδειγμα
  choice: Muster … Beispiel
  alternative: Vorbild … Beispiel
  rationale: Die zwei annähernd synonymen, aber verschiedenen Substantive werden auch im Deutschen unterschieden, damit die rhetorische Wiederaufnahme nicht eingeebnet wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „würden“ und die parallele Struktur „Muster … Beispiel“ spiegeln bewusst den hypothetischen und rhetorischen Aufbau des griechischen Satzes.
