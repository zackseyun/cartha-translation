  source_fidelity: Der Entwurf gibt die Abfolge und die bewusste Unterscheidung von τύπος („Muster“) und παράδειγμα („Beispiel“) zutreffend wieder. Gottlosigkeit trifft ἀσεβεία. Die finale Formulierung „das Essen von Beflecktem“ ist jedoch im heutigen Deutsch unidiomatisch; zudem ist ἵνα sachgemäßer als Zwecksatz („damit“) wiederzugeben als mit dem eher konsekutiven „sodass“.
  naturalness: „Beflecktes“ ist in Verbindung mit Nahrung im modernen Standarddeutsch weniger natürlich und kann unnötig bildhaft wirken. „Verunreinigtes zu essen“ ist klar, idiomatisch und bewahrt die vom griechischen Kompositum bezeichnete Offenheit.
  terminology: „Muster der Gottlosigkeit“ und „Beispiel“ sind angemessen. „Junge Menschen“ wahrt die mögliche allgemeine Bedeutung von τοῖς νέοις, ohne den Kontext über die Wortbedeutung hinaus einzuengen. „Verunreinigtes“ vermeidet die zu enge Festlegung auf einen technischen Reinheitsbegriff, während die Fußnote „unreine Speisen“ als kontextnahe Alternative dokumentiert.
