revisions:
- from: Und wir selbst würden für die jungen Menschen zu einem Muster der Gottlosigkeit werden, sodass wir zu einem Beispiel für das Essen von Beflecktem würden.[a]
  to: Und wir selbst würden für die jungen Menschen zu einem Muster der Gottlosigkeit werden, damit wir zu einem Beispiel dafür würden, Verunreinigtes zu essen.[a]
  rationale: Die Revision ersetzt die unnatürliche Nominalgruppe „das Essen von Beflecktem“ durch die idiomatische, semantisch offene Formulierung „Verunreinigtes zu essen“ und gibt ἵνα mit „damit“ als Zwecksatz wieder. Die rhetorische Differenzierung „Muster … Beispiel“, die modale Aussage und die mögliche allgemeine Referenz auf junge Menschen bleiben erhalten.
