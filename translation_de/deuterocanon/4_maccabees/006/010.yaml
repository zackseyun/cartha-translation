  yaml_path: translation/deuterocanon/4_maccabees/006/010.yaml
  text: And like a noble athlete[a], though being beaten, the old man was defeating those who were torturing him.
translation:
  language: de
  text: Und wie ein edler Wettkämpfer[a] besiegte der alte Mann, während er geschlagen wurde, seine Folterer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tapferer Athlet“.'
    reason: Lexikalische Alternative für γενναῖος ἀθλητής; „tapfer“ hebt den Mut, „Athlet“ die wörtliche Wettkampfbezeichnung stärker hervor.
lexical_decisions:
- source_word: καθάπερ
  choice: wie
  rationale: Leitet unmittelbar den Vergleich ein und bewahrt die knappe Bildsprache des Griechischen.
- source_word: γενναῖος
  choice: edel
  rationale: Gibt neben Tapferkeit auch die sittliche Größe wieder und entspricht dem gehobenen rhetorischen Ton; „tapfer“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: ἀθλητής
  choice: Wettkämpfer
  rationale: Bewahrt das Bild des sportlichen Wettstreits, ohne die im heutigen Deutschen oft enger sportlich-professionelle Färbung von „Athlet“ aufzudrängen.
- source_word: τυπτόμενος
  choice: während er geschlagen wurde
  rationale: Gibt das präsentische Passivpartizip als gleichzeitig andauerndes Geschehen wieder. Die Formulierung lässt den aus dem Gegensatz entstehenden konzessiven Sinn erkennen, ohne ihn ausdrücklich durch „obwohl“ festzulegen.
- source_word: ἐνίκα
  choice: besiegte
  rationale: Bewahrt das Siegesmotiv des Wettkampfvergleichs. Das Imperfekt wird im deutschen Erzähltempus natürlich mit dem Präteritum wiedergegeben; der Satzkontext stellt den Sieg als während der Misshandlung stattfindend dar.
- source_word: τοὺς βασανίζοντας
  choice: seine Folterer
  rationale: Das substantivierte Partizip bezeichnet hier die Personen, die ihn foltern. Das Possessivpronomen stellt den im Kontext eindeutigen Bezug knapp und natürlich her.
- source_word: ὁ γέρων
  choice: der alte Mann
  rationale: Gibt die Altersbezeichnung wörtlich wieder und vermeidet bei „Ältester“ die mögliche Fehlvorstellung eines Amtes.
theological_decisions:
- issue: Bildhafte Darstellung des Martyriums als Sieg im Wettkampf
  choice: 'Das Wettkampf- und Siegesbild wird unmittelbar beibehalten: „edler Wettkämpfer“ und „besiegte“.'
  alternative: Deutende Wiedergabe als heldenhaftes Ausharren oder inneres Überwinden der Folterer.
  rationale: Der griechische Text stellt das Leiden ausdrücklich als Wettkampf dar, in dem der alte Mann trotz der Schläge als Sieger erscheint. Eine Auflösung des Bildes würde die moralisch-philosophische Spannung abschwächen.
- issue: Verhältnis von Schlägen und Sieg beim Partizip τυπτόμενος
  choice: 'Temporal und offen: „während er geschlagen wurde“.'
  alternative: 'Ausdrücklich konzessiv: „obwohl er geschlagen wurde“.'
  rationale: Das Partizip bezeichnet sicher Gleichzeitigkeit; eine konzessive Beziehung liegt durch den inhaltlichen Gegensatz nahe, ist aber grammatisch nicht ausdrücklich markiert. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die knappe, paradoxe Gegenüberstellung von körperlicher Misshandlung und moralischem Sieg sowie die athletische Metapher bleiben erhalten.
