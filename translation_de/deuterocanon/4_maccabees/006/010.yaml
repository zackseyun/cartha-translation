  source_fidelity: Der Entwurf gibt die Vergleichskonstruktion καὶ καθάπερ, das athletische Bild von γενναῖος ἀθλητής, das gleichzeitig erlittene Geschlagenwerden (τυπτόμενος), das Siegesmotiv von ἐνίκα sowie die personalen „Folterer“ (τοὺς βασανίζοντας) zuverlässig wieder. Das deutsche Präteritum „besiegte“ ist in erzählendem Deutsch eine vertretbare Wiedergabe des griechischen Imperfekts; die Gleichzeitigkeit bleibt durch „während er geschlagen wurde“ klar.
  naturalness: „Und wie ein edler Wettkämpfer besiegte der alte Mann, während er geschlagen wurde, seine Folterer“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die Stellung des Einschubs ist flüssig und erhält die rhetorische Spannung.
  terminology: „Edler Wettkämpfer“ bewahrt sowohl den gehobenen Wertungsgehalt von γενναῖος als auch das konkrete Wettkampfbild von ἀθλητής. „Der alte Mann“ vermeidet die amtsbezogene Nebenbedeutung von „Ältester“. „Folterer“ ist im gegebenen Kontext für βασανίζοντας angemessen. Die Fußnote ist korrekt verankert und bietet eine sinnvolle lexikalische Alternative.
