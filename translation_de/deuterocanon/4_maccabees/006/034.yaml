  yaml_path: translation/deuterocanon/4_maccabees/006/034.yaml
  text: And it is right for us to acknowledge that reason is sovereign[b][a], since it even prevails over outward pains.
translation:
  language: de
  text: Und es ist recht, anzuerkennen, dass die Herrschaft bei der Vernunft liegt[a], da sie sogar über die von außen kommenden Schmerzen[b] die Oberhand gewinnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass die Herrschaft der Vernunft gehört“ oder „dass die Vernunft die Oberhand hat“. Die griechische Wendung betont die beherrschende Kraft der Vernunft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „äußeren Schmerzen“. Gemeint sind Schmerzen, die von außen auf den Menschen einwirken, wahrscheinlich einschließlich körperlicher Leiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιόν ἐστιν
  choice: mit Recht
  rationale: Die unpersönliche Wendung bezeichnet, was richtig oder gerechtfertigt ist. In Verbindung mit „wir müssen anerkennen“ gibt „mit Recht“ den moralisch-wertenden Sinn natürlich wieder.
- source_word: ὁμολογεῖν
  choice: anerkennen
  rationale: Im argumentativen Zusammenhang geht es um das offene Eingeständnis einer Schlussfolgerung, nicht um ein Sündenbekenntnis.
- source_word: τὸ κράτος εἶναι τοῦ λογισμοῦ
  choice: dass die Vernunft die Herrschaft besitzt
  rationale: Die Genitivkonstruktion weist die Herrschaft beziehungsweise überlegene Macht der Vernunft zu. Die Formulierung bleibt nahe am Griechischen und vermeidet eine unnötige Personifizierung durch „souverän sein“.
- source_word: λογισμός
  choice: Vernunft
  rationale: Das Wort bezeichnet in 4 Makkabäer das vernünftige Urteils- und Steuerungsvermögen. „Vernunft“ ist prägnant, verständlich und philosophisch angemessen.
- source_word: ὅπου γε καὶ
  choice: da sie sogar
  rationale: Die Wendung führt mit Nachdruck den Beleg für die vorherige Aussage an; „da … sogar“ bewahrt sowohl die begründende als auch die steigernde Funktion.
- source_word: τῶν ἔξωθεν ἀλγηδόνων
  choice: die von außen kommenden Schmerzen
  rationale: Die Wiedergabe hält die räumliche Herkunftsangabe ἔξωθεν offen, statt sie ohne ausdrückliche Grundlage auf körperliche Schmerzen einzuengen.
- source_word: ἐπικρατεῖ
  choice: überwindet
  rationale: Das Verb bezeichnet das Erlangen oder Behaupten der Oberhand. „Überwindet“ ist im Deutschen natürlich und drückt die Überlegenheit gegenüber den Schmerzen aus.
theological_decisions:
- issue: Philosophisch-anthropologische Aussage über λογισμός
  choice: die Vernunft besitzt die Herrschaft
  alternative: die Vernunft ist souverän; die Vernunft hat die Oberhand
  rationale: Die Aussage gilt der beherrschenden Kraft der Vernunft über Leiden. Die gewählte Form bewahrt die Stärke von κράτος, ohne daraus eine absolute oder theologisch aufgeladene Souveränität zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt argumentativ und relativ quellennah; Schlüsselbegriffe werden verständlich wiedergegeben, ohne die mögliche Bedeutung von „von außen“ stillschweigend auf körperliche Schmerzen zu beschränken.
