base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/001.yaml
  text: After he had spoken against the tyrant’s persuasions in this way[c][b][a], the bodyguards came forward and harshly dragged Eleazar to the tortures.
translation:
  language: de
  text: Nachdem Eleasar den Überredungsversuchen des Tyrannen auf diese Weise widersprochen hatte, traten die Leibwächter heran und schleppten ihn grausam zu den Folterwerkzeugen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Speerträger“; gemeint sind bewaffnete Begleiter oder Leibwächter des Tyrannen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu den Foltern“ beziehungsweise „zu den Foltervorrichtungen“. Das griechische Wort kann die Foltermittel oder die Folterqualen bezeichnen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  choice: auf diese Weise
  rationale: Die Wendung bezeichnet die Art und Weise von Eleasars vorausgehender Antwort und bewahrt den demonstrativen Bezug.
- source_word: ἀντιρρητορεύσαντα
  choice: widersprochen hatte
  rationale: Das Partizip bezeichnet eine mündliche Gegenrede. „Widersprochen“ gibt den oppositionellen Sinn natürlich wieder, ohne eine förmliche Debatte vorauszusetzen.
- source_word: παρηγορίαις
  choice: Überredungsversuchen
  rationale: Im Kontext geht es nicht um Trost, sondern um die Versuche des Tyrannen, Eleasar zum Nachgeben zu bewegen. Die Wiedergabe bewahrt dabei, dass es sich um rhetorische Einwirkung handelt.
- source_word: δορυφόροι
  choice: Leibwächter
  rationale: Wörtlich sind es „Speerträger“; im höfisch-herrschaftlichen Zusammenhang bezeichnet das Wort bewaffnete Begleiter beziehungsweise Leibwächter.
- source_word: παραστάντες
  choice: traten heran
  rationale: Das Aoristpartizip leitet das Eingreifen der Wächter ein; „traten heran“ ist erzählerisch natürlich und bleibt nahe am räumlichen Bild.
- source_word: πικρῶς
  choice: grausam
  rationale: Das Adverb bezeichnet hier die schonungslose Härte ihrer Behandlung. „Grausam“ ist im Deutschen in Verbindung mit „schleppten“ natürlicher als das wörtlichere „bitter“.
- source_word: ἔσυραν
  choice: schleppten
  rationale: Das Verb bezeichnet gewaltsames Ziehen; „schleppten“ vermittelt den Zwang und die körperliche Gewalt.
- source_word: ἐπὶ τὰ βασανιστήρια
  choice: zu den Folterwerkzeugen
  rationale: Das substantivierte βασανιστήρια kann die Mittel beziehungsweise Vorrichtungen der Folter bezeichnen. Diese konkrete Wiedergabe vermeidet das im Deutschen unnatürliche „zu den Foltern“, ohne einen Folterraum vorauszusetzen.
- source_word: τὸν Ἐλεάζαρον
  choice: Eleasar … ihn
  rationale: Der Name wird in der im Deutschen biblisch geläufigen Form „Eleasar“ wiedergegeben und zur Vermeidung einer schwerfälligen Endstellung bereits im vorangestellten Nebensatz genannt; das Objekt des Hauptverbs wird pronominal aufgenommen.
