lexical_decisions:
- source_word: ὅθεν
  choice: Daher
  rationale: Leitet eine Folgerung aus dem vorangehenden Zusammenhang ein und gibt die logische Verbindung knapp und natürlich wieder.
- source_word: ἐλεῶντες
  choice: hatten Mitleid mit
  rationale: Das präsentische Partizip bezeichnet die mitfühlende Haltung eines Teils der Anwesenden; im Deutschen fügt es sich als finite Verbform natürlich in den mit μέν eröffneten Gegensatz ein.
- source_word: τὰ τοῦ γήρως αὐτοῦ
  choice: den Beschwerden seines hohen Alters
  rationale: Die substantivierte, elliptische Wendung bezeichnet das, was mit seinem Greisenalter verbunden ist. „Beschwerden“ macht den im Kontext bemitleideten Zustand verständlich, ohne die Aussage auf das bloße Lebensalter zu verkürzen.
- source_word: τὰ μὲν
  choice: die einen
  rationale: μέν eröffnet den ersten Teil eines noch folgenden Gegensatzpaares; „die einen“ bewahrt diese vorausweisende Struktur.
