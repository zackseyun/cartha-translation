  text: And after saying these things[a], the holy man nobly gave himself over to the tortures, and he stood firm by reason for the law, even to the tortures of death.
translation:
  language: de
  text: Nachdem er dies gesagt hatte, stellte sich der heilige Mann in edler Haltung den Foltern[a] und hielt kraft der Vernunft um des Gesetzes willen bis zu den Todesqualen stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier verwendete griechische Verb ist selten und schwer zu deuten. Es kann auch besagen, dass er den Foltern unmittelbar entgegentrat oder ihnen im Tod begegnete.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: Nachdem er dies gesagt hatte
  rationale: Die temporale Partizipialkonstruktion wird in natürlichem Deutsch als vorzeitiger Nebensatz wiedergegeben.
- source_word: ὁ ἱερὸς ἀνὴρ
  choice: der heilige Mann
  rationale: ἱερός bezeichnet hier den durch seine Treue zum Gesetz geheiligten Mann; ἀνήρ wird seinem ausdrücklich männlichen Bezug entsprechend wiedergegeben.
- source_word: εὐγενῶς
  choice: in edler Haltung
  rationale: Die Formulierung bewahrt den moralisch-rhetorischen Sinn von vornehmer, hochgesinnter Standhaftigkeit und klingt im heutigen Deutsch natürlicher als das bloße Adverb „edel“.
- source_word: ταῖς βασάνοις ἐναντεθάνει
  choice: stellte sich den Foltern
  rationale: Die Wiedergabe bringt die unmittelbare Konfrontation mit den Foltern zum Ausdruck, ohne das seltene und schwierige Verb enger festzulegen, als der griechische Befund erlaubt.
- source_word: ἀντέστη
  choice: hielt stand
  rationale: Die Wendung gibt sowohl Widerstand als auch standhafte Beharrlichkeit idiomatisch wieder.
- source_word: τῷ λογισμῷ
  choice: kraft der Vernunft
  rationale: Der Dativ wird instrumental verstanden. „Vernunft“ wahrt den für 4 Makkabäer wichtigen Gedanken vernünftiger Urteilskraft, ohne ihn auf einen bloß persönlichen Gedankengang zu verengen.
- source_word: διὰ τὸν νόμον
  choice: um des Gesetzes willen
  rationale: Die Formulierung gibt den Beweggrund seiner Standhaftigkeit prägnant und in würdigem Register wieder.
- source_word: μέχρι τῶν θανάτου βασάνων
  choice: bis hin zu den Qualen des Todes
  rationale: Die Genitivverbindung und die Steigerung bis zum äußersten, tödlichen Leiden bleiben erhalten.
theological_decisions:
- issue: Die philosophisch geprägte Bedeutung von λογισμός
  choice: Vernunft
  alternative: vernünftige Urteilskraft; vernünftige Entschlossenheit
  rationale: Das Buch beschreibt die Herrschaft der Vernunft über die Leidenschaften. „Vernunft“ hält diesen Leitbegriff sichtbar, ohne spätere philosophische oder konfessionelle Systeme einzutragen.
- issue: Der ausdrücklich männliche Bezug von ἀνήρ
  choice: Mann
  alternative: Mensch
  rationale: ἀνήρ bezeichnet hier einen erwachsenen Mann; die konkrete Geschlechtsangabe des Ausgangstextes wird bewahrt.
- issue: Das Verhältnis von Vernunft und Gesetzestreue
  choice: kraft der Vernunft um des Gesetzes willen
  alternative: mit vernünftiger Entschlossenheit für das Gesetz
  rationale: Die Übersetzung unterscheidet das Mittel beziehungsweise die befähigende Urteilskraft von dem Beweggrund der Treue zum Gesetz und lässt die Spannung zwischen beiden bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche griechische Verbform wird im Haupttext verständlich, aber nicht überpräzise wiedergegeben; die echte lexikalische Unsicherheit bleibt in der Fußnote sichtbar.
