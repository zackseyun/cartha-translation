lexical_decisions:
- source_word: ἔπειτα
  choice: Dann
  rationale: Das Adverb kennzeichnet den nächsten Schritt der Folter und wird im modernen Deutschen natürlich mit „Dann“ wiedergegeben.
- source_word: περιαγκωνίσαντες
  choice: zwangen sie ihm … die Arme nach hinten
  rationale: Das seltene, von ἀγκών („Ellenbogen/Arm“) gebildete Verb bezeichnet wahrscheinlich ein Festhalten, Zurückbiegen oder Fesseln der Arme beziehungsweise Ellenbogen. Die gewählte Formulierung gibt die körperliche Zwangshandlung verständlich wieder, ohne eine bestimmte Fesseltechnik vorauszusetzen.
- source_word: ἑκατέρωθεν
  choice: von beiden Seiten
  rationale: Das Adverb bezeichnet eine Einwirkung von jeder der beiden Seiten und wahrt damit die räumliche Aussage des Griechischen.
- source_word: μάστιξιν
  choice: mit Peitschen
  rationale: Der instrumentale Dativ Plural bezeichnet die Werkzeuge der Misshandlung. „Peitschen“ ist klar, gegenwärtig und weniger altertümlich als „Geißeln“.
- source_word: κατήκιζον
  choice: folterten ihn
  rationale: Der Imperfekt beschreibt eine andauernde schwere Misshandlung. Im Zusammenhang mit den Peitschen bringt „folterten“ sowohl die Härte als auch den fortdauernden Charakter zum Ausdruck.
