  text: For it would indeed be irrational, if, after living our whole life up to old age in truth and lawfully preserving the reputation founded on it, we should now change course,
translation:
  language: de
  text: Denn es wäre ja unvernünftig, wenn wir, nachdem wir bis ins Alter wahrheitsgemäß gelebt und den darauf gegründeten Ruf in Übereinstimmung mit dem Gesetz bewahrt haben, jetzt unseren Kurs änderten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογιστον
  choice: unvernünftig
  rationale: Gibt den Gedanken eines vernunftwidrigen Handelns natürlich und präzise wieder.
- source_word: πρὸς ἀλήθειαν
  choice: wahrheitsgemäß
  rationale: Bewahrt den Bezug auf ἀλήθεια, ohne die im Deutschen unnatürliche Formulierung „zur Wahrheit hin“ nachzuahmen.
- source_word: τὸν μέχρι γήρως βίον
  choice: bis ins hohe Alter … gelebt
  rationale: Drückt die gesamte bis zum Greisenalter reichende Lebensführung idiomatisch aus.
- source_word: τὴν ἐπ’ αὐτῶν δόξαν
  choice: den darauf beruhenden guten Ruf
  rationale: δόξα bezeichnet hier im Kontext den erworbenen Ruf; ἐπ’ αὐτῶν bezieht ihn auf die zuvor genannte wahrheitsgemäße Lebensführung.
- source_word: νομίμως
  choice: in Übereinstimmung mit dem Gesetz
  rationale: Macht den möglichen Bezug auf gesetzesgemäßes Verhalten deutlicher als das im Deutschen mehrdeutige „rechtmäßig“.
- source_word: μεταβαλοίμεθα
  choice: unseren Kurs änderten
  rationale: Gibt den Wechsel der bisherigen Haltung oder Lebensweise idiomatisch wieder, ohne das Ziel des Wechsels zu ergänzen.
theological_decisions:
- issue: Bezug und Bedeutung von νομίμως
  choice: in Übereinstimmung mit dem Gesetz
  alternative: rechtmäßig
  rationale: Der Kontext von 4 Makkabäer spricht für Treue zum Gesetz; die Formulierung lässt dennoch offen, welche konkreten Gebote gemeint sind.
- issue: Bezug von ἐπ’ αὐτῶν
  choice: darauf beruhenden
  alternative: bei ihnen bestehenden
  rationale: Das Pronomen wird sachlich auf die vorausgehende wahrheitsgemäße Lebensführung bezogen, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Vers bleibt als syntaktisch offener Bedingungssatz mit abschließendem Komma stehen, da der griechische Satz im folgenden Vers weitergeführt wird.
