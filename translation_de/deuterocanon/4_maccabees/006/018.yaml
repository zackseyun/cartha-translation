  terminology: „Wahrheitsgemäß“ gibt πρὸς ἀλήθειαν angemessen wieder; „in Übereinstimmung mit dem Gesetz“ gibt νομίμως kontextgerecht wieder, ohne einzelne Gebote oder eine konfessionelle Auslegung zu ergänzen. „Ruf“ ist für δόξα hier passend.
