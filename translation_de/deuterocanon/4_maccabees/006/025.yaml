  - marker: b
    text: 'Oder: „sprangen auf ihn los“. Das griechische Verb kann eine heftige, springende Angriffsbewegung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „stinkende Brühen“. Das griechische Wort kann sowohl eine Flüssigkeit als auch eine brühen- oder breiartige Mischung bezeichnen.'
