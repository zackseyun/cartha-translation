lexical_decisions:
- source_word: ἔνθα
  choice: Dort
  rationale: Die Ortsangabe führt anschaulich zu dem gerade beschriebenen Schauplatz zurück; „Dort“ bewahrt diesen räumlichen Bezug besser als das rein zeitliche „Dann“.
- source_word: διὰ κακοτέχνων ὀργάνων
  choice: mit heimtückisch ersonnenen Folterwerkzeugen
  rationale: κακότεχνος bezeichnet kunstvoll beziehungsweise geschickt, aber zu einem bösen Zweck Erdachtes; ὄργανα sind Geräte oder Werkzeuge. Im Folterzusammenhang gibt die Formulierung sowohl die schädliche Absicht als auch die planvolle Herstellung natürlich wieder.
- source_word: καταφλέγοντες
  choice: verbrannten
  rationale: Das Verb bezeichnet starkes Brennen oder Versengen. „Verbrannten“ ist im Deutschen klar und lässt die genaue Art und Stärke der Verbrennung offen.
- source_word: ὑπερίπτοσαν
  choice: stürzten sich auf ihn
  rationale: Das seltene Verb vermittelt eine heftige Bewegung auf oder über jemanden zu. „Stürzten sich auf ihn“ bewahrt im Kontext den gewaltsamen Angriff, ohne eine bloß räumliche Bewegung über ihn hinweg festzulegen.
- source_word: δυσώδεις χυλούς
  choice: übel riechende Flüssigkeiten
  rationale: δυσώδης bedeutet übel riechend; χυλός kann Saft, Brühe oder eine flüssige Mischung bezeichnen. „Flüssigkeiten“ wahrt die Bedeutungsbreite und passt zum Eingießen in die Nasenlöcher.
- source_word: μυκτῆρας
  choice: Nasenlöcher
  rationale: Der griechische Plural bezeichnet konkret die Nasenlöcher und nicht nur allgemein die Nase.
- source_word: κατέχεον
  choice: gossen
  rationale: Der Imperfekt schildert die fortlaufende Handlung; das einfache deutsche Präteritum ist im Erzählzusammenhang natürlich, ohne den durativen Aspekt auszuschließen.
