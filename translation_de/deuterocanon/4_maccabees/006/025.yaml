translation:
  language: de
  text: Dort versengten sie ihn mit heimtückisch ersonnenen Folterwerkzeugen[a], stürzten sich auf ihn[b] und gossen übel riechende Flüssigkeiten[c] in seine Nasenlöcher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit kunstvoll zum Bösen ersonnenen Werkzeugen“. Der griechische Ausdruck betont Geräte, die geschickt für einen schädlichen Zweck gefertigt wurden.'
