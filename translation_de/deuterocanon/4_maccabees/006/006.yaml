  register: Modernes, würdiges Standarddeutsch mit kurzen, eindringlichen Sätzen. Die dreifache Wiederholung bleibt als rhetorischer Ausruf erhalten. Konkrete Folterbegriffe werden weder abgeschwächt noch ausgeschmückt; textliche Mehrdeutigkeiten werden in Fußnoten offengehalten.
