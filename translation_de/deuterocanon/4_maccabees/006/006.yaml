  text: But no—no—no! Lifting his eyes high toward heaven[a], the old man was exposing his flesh to the whips, and was streaming with blood[c][b], and his sides were being pierced.
translation:
  language: de
  text: Aber nein, nein, nein! Der alte Mann hob die Augen hoch zum Himmel und setzte sein Fleisch den Geißeln aus[a]. Er war von Blut überströmt[b], und seine Seiten wurden durchbohrt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ließ sein Fleisch unter den Geißelhieben sichtbar werden«. Die griechische Wendung kann das Sichtbarwerden oder Preisgegebensein seines Fleisches bei der Geißelung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Blut strömte an ihm herab«. Die griechische Formulierung betont den anhaltenden Blutstrom beziehungsweise das Überströmtsein mit Blut.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »seine Rippen wurden verwundet«. Das griechische Wort kann sowohl die Körperseiten als auch den Rippenbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἀλλὰ ἀλλὰ
  choice: Aber nein, nein, nein!
  rationale: Die dreifache Wiederholung ist ein abrupter, nachdrücklicher Widerspruch. Die Wiedergabe mit »Aber nein« bewahrt sowohl den Gegensatz als auch die emotionale Kraft.
- source_word: ὑψηλοὺς ἀντείνας ... τοὺς ὀφθαλμούς
  choice: erhob seine Augen hoch
  rationale: ἀντείνας bezeichnet ein Aus- oder Emporstrecken; zusammen mit »Augen« ergibt »erhob« im Deutschen eine natürliche, zugleich anschauliche Formulierung. »hoch« bildet ὑψηλούς ausdrücklich ab.
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel
  rationale: Die Wendung bezeichnet die Richtung seines Blicks. »Himmel« bewahrt im Kontext des Martyriums den möglichen religiösen Bezug, ohne ihn weiter auszudeuten.
- source_word: ἀπέφαινετο ταῖς μάστιξιν τὰς σάρκας
  choice: bot sein Fleisch den Geißeln dar
  rationale: Die schwierige Konstruktion schildert, wie sein Fleisch unter bzw. gegenüber den Geißeln sichtbar oder preisgegeben wird. »darbot« erhält die aktive/mittlere Beteiligung des alten Mannes und die Härte des Bildes, ohne den Vorgang unnötig zu erklären.
- source_word: τὰς σάρκας
  choice: sein Fleisch
  rationale: Im Folterkontext ist σάρξ konkret körperlich gemeint. Der deutsche Singular »Fleisch« gibt den idiomatischen Sinn des griechischen Plurals wieder.
- source_word: ὁ γέρων
  choice: der alte Mann
  rationale: γέρων hebt sein hohes Alter hervor; »der alte Mann« ist unmittelbar verständlich und vermeidet die mögliche Amtsbedeutung von »Ältester«.
- source_word: κατερρεῖτο τῷ αἵματι
  choice: Blut strömte an ihm herab
  rationale: Die Verlaufsform beschreibt ein fortdauerndes Herabströmen bzw. Überströmtwerden mit Blut. Die deutsche Formulierung ist bildhaft und natürlich, ohne den Vorgang zu verharmlosen.
- source_word: τὰ πλευρὰ
  choice: seine Seiten
  rationale: πλευρά kann die Körperseiten oder enger den Rippenbereich bezeichnen. »Seiten« wahrt die größere Bedeutungsbreite.
- source_word: κατετιτρώσκετο
  choice: wurden durchbohrt
  rationale: Das Imperfekt Passiv bezeichnet fortgesetztes oder wiederholtes Verwunden. »durchbohrt« gibt die Schwere des Vorgangs wieder; die deutsche Passivform erhält die Perspektive des griechischen Textes.
theological_decisions:
- issue: Konkrete oder übertragene Bedeutung von σάρκας
  choice: 'konkret: »Fleisch«'
  alternative: »Körper« oder »Haut«
  rationale: Der unmittelbare Zusammenhang beschreibt körperliche Folter. Eine theologische oder metaphorische Bedeutung von σάρξ ist hier nicht angezeigt.
- issue: Religiöse Deutung von οὐρανός
  choice: »Himmel« ohne erläuternden Zusatz
  alternative: »Himmelsgewölbe« oder »zu Gott im Himmel«
  rationale: »Himmel« lässt den religiösen Bezug der Blickrichtung offen erkennbar, fügt jedoch kein im griechischen Wortlaut ausdrücklich genanntes Ziel wie »Gott« hinzu.
