lexical_decisions:
- source_word: μέχρι ὀστέων ἤδη κατακεκαυμένος
  choice: bereits bis auf die Knochen verbrannt
  rationale: Gibt die vollendete, bereits eingetretene Verbrennung und die Grenze »bis auf die Knochen« eng am Griechischen wieder.
- source_word: μέλλων λιποθυμεῖν
  choice: dem Ohnmächtigwerden nahe
  rationale: Bewahrt den bevorstehenden, aber noch nicht vollzogenen Bewusstseinsverlust; »ohnmächtig werden« ist im heutigen Deutsch natürlicher als eine wörtliche Wiedergabe mit »den Mut verlieren«.
- source_word: ἀνέτεινεν τὰ ὄμματα πρὸς τὸν θεόν
  choice: hob er seine Augen zu Gott
  rationale: Folgt dem bildhaften Ausdruck des Griechischen und wahrt den würdevollen Erzählton.
- source_word: εἶπεν
  choice: sagte
  rationale: Schlichte und genaue Wiedergabe des gewöhnlichen Verbs für »sagen«; der Doppelpunkt leitet die folgende Rede ein.
