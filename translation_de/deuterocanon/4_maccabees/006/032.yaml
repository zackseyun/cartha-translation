  text: For if the passions had gained mastery over reason[b][a], I would have given them testimony to my self-control.
translation:
  language: de
  text: Denn wenn die Leidenschaften die Vernunft überwältigt hätten, hätte ich ihnen das Zeugnis ihrer Überlegenheit gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „hätte ich ihnen das Zeugnis ihrer Herrschaft gegeben“; das Griechische nennt keinen ausdrücklichen Besitzer der „Herrschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάθη
  choice: die Leidenschaften
  rationale: Im moralphilosophischen Zusammenhang bezeichnet πάθη innere Affekte oder leidenschaftliche Regungen, nicht äußere Leiden. „Leidenschaften“ bewahrt den fachsprachlichen Gegensatz zur Vernunft.
- source_word: λογισμοῦ
  choice: die Vernunft
  rationale: λογισμός bezeichnet hier das vernünftige Urteilsvermögen. „Vernunft“ gibt den zentralen Gegensatz zu den Leidenschaften knapp und verständlich wieder.
- source_word: κεκράτηκει
  choice: überwältigt hätten
  rationale: κρατέω mit Genitiv bezeichnet Herrschaft oder Überlegenheit über etwas. Die Form ist Plusquamperfekt; im irrealen Bedingungssatz wird sie im Deutschen natürlich mit „überwältigt hätten“ wiedergegeben.
- source_word: ἀπεδόμην
  choice: hätte ich … ausgestellt
  rationale: ἀποδίδωμι bedeutet hier „geben“, „erweisen“ oder „zuerkennen“. In Verbindung mit „Zeugnis“ ist „ausstellen“ im Deutschen idiomatisch und erhält zugleich den forensischen Bildbereich.
- source_word: ἐπικρατίας
  choice: ihrer Überlegenheit
  rationale: ἐπικράτεια bezeichnet das Vorherrschen oder die Übermacht. Das possessive „ihrer“ macht den im Zusammenhang liegenden Bezug auf die Leidenschaften deutlich, ohne daraus die Selbstbeherrschung des Sprechers zu machen.
- source_word: μαρτυρίαν
  choice: das Zeugnis
  rationale: μαρτυρία bedeutet „Zeugnis“, „Bezeugung“ oder „Beweis“. „Zeugnis“ bewahrt den forensischen Klang des griechischen Ausdrucks.
theological_decisions:
- issue: Anthropologischer Gegensatz zwischen Vernunft und Leidenschaften
  choice: Der moralphilosophische Gegensatz wird mit „Vernunft“ und „Leidenschaften“ ausdrücklich beibehalten.
  alternative: 'Dynamisch: „wenn meine Begierden mein besseres Urteil besiegt hätten“'
  rationale: Die dynamische Alternative würde die philosophischen Schlüsselbegriffe individualisieren und interpretierend abschwächen. Der Ausgangstext stellt die Herrschaftsfrage zwischen Leidenschaften und Vernunft bewusst zugespitzt dar.
- issue: Bezug der „Überlegenheit“
  choice: 'Die Überlegenheit wird auf die Leidenschaften bezogen: Bei ihrem Sieg hätte der Sprecher ihnen das entsprechende Zeugnis ausgestellt.'
  alternative: „Zeugnis meiner Selbstbeherrschung“
  rationale: Im Griechischen steht kein Possessivpronomen der ersten Person, und der irreale Bedingungssatz legt nahe, dass ein Sieg der Leidenschaften ihre Überlegenheit bezeugen würde. Die alternative Deutung als Selbstbeherrschung des Sprechers wird daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die philosophischen Leitbegriffe bleiben erkennbar; die Satzfügung ist zugleich natürlich und für heutige Leser verständlich.
