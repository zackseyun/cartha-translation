  footnotes:
  - marker: a
    text: 'Oder: „wegen dieser Übel“ oder „unter diesen Übeln“. Der Dativ kann Mittel, Ursache oder Begleitumstand ausdrücken; im Zusammenhang sind die Leiden gemeint, die Eleasar zugefügt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Warum
  rationale: In dieser vorwurfsvollen Frage fragt τί idiomatisch nach Grund oder Beweggrund.
- source_word: τοῖς κακοῖς τούτοις
  choice: wegen dieser Übel
  rationale: Der Dativ kann Ursache, Mittel oder Begleitumstand bezeichnen. „Übel“ wahrt die Breite von κακά und legt sich nicht vorschnell auf „Folterqualen“ fest.
- source_word: σεαυτὸν
  choice: dich
  rationale: Das Reflexivpronomen ist direktes Objekt von ἀπόλλυες; im Deutschen wird die Rückbezüglichkeit idiomatisch mit „dich“ ausgedrückt.
- source_word: ἀλογίστως
  choice: so unvernünftig
  rationale: Das Adverb bezeichnet ein Handeln wider die Vernunft. „Unvernünftig“ erhält den für 4 Makkabäer wichtigen Gegensatz zwischen Vernunft und Affekten; „so“ gibt im Deutschen die vorwurfsvolle Aussage natürlich wieder.
- source_word: ἀπόλλυες
  choice: richtest ... zugrunde
  rationale: 'Die aktive Imperfektform beschreibt im Fragezusammenhang ein fortschreitendes Geschehen: Eleasar bringe sich selbst ins Verderben. „Zugrunde richten“ ist natürlich und bewahrt die aktive, reflexive Aussage.'
- source_word: Ἐλεάζαρ
  choice: Eleasar
  rationale: Gebräuchliche deutsche Namensform der biblischen Gestalt.
theological_decisions:
- issue: Deutung von κακοῖς im Zusammenhang mit Eleasars Martyrium
  choice: Breit als „Übel“ wiedergegeben
  alternative: Leiden; Strafen; Folterqualen
  rationale: κακά bezeichnet allgemein Schlimmes oder Übel. Der Kontext weist auf die Eleasar zugefügten Leiden, doch eine spezifische Bezeichnung für Folter steht in diesem Satz nicht.
- issue: Kasusfunktion von τοῖς κακοῖς τούτοις
  choice: 'kausal: „wegen dieser Übel“'
  alternative: 'instrumental oder modal: „durch/unter diesen Übeln“'
  rationale: Der bloße Dativ lässt mehrere Beziehungen zu. Die Hauptfassung liest die Leiden als Anlass beziehungsweise Ursache des behaupteten Selbstverderbens; die instrumentale oder umstandsbezogene Möglichkeit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der vorwurfsvolle Ton bleiben erhalten. „Unvernünftig“ wahrt die begriffliche Verbindung zum Leitmotiv der Vernunft; „Übel“ vermeidet eine kontextuell plausible, aber im griechischen Wortlaut nicht ausdrückliche Spezifizierung als Folter.
