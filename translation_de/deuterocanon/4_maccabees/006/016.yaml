  text: 'Und Eleasar, als wäre er durch diesen Rat noch härter gefoltert worden,[a] rief laut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „als hätte ihn dieser Rat noch schwerer gequält“. Die griechische Vergleichsformulierung und die Wendung „durch diesen Rat“ lassen sich im Deutschen auf mehrere natürliche Arten ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ Ἐλεάζαρος
  choice: Eleasar
  rationale: Der Eigenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: ὥσπερ
  choice: als wäre
  rationale: Die Formulierung gibt den Vergleich des Empfindens beziehungsweise der Wirkung natürlich wieder, ohne ihn als bloße Tatsachenbehauptung aufzulösen.
- source_word: πικρότερον
  choice: noch bitterer
  rationale: Der Komparativ und das anschauliche Bild der Bitterkeit bleiben erhalten; „noch“ macht den Vergleich im Deutschen idiomatisch deutlich.
- source_word: διὰ τῆς συμβουλίας
  choice: durch diesen Rat
  rationale: διά mit Genitiv bezeichnet hier das Mittel beziehungsweise den Anlass der verschärften Qual. Das Demonstrativpronomen stellt den unmittelbaren Kontext natürlich her.
- source_word: αἰκισθείς
  choice: gefoltert worden
  rationale: Das passive Partizip bezeichnet schwere Misshandlung oder Folter; der Märtyrerkontext stützt die kräftigere Wiedergabe.
- source_word: ἀνεβόησεν
  choice: rief laut
  rationale: Das Verb bezeichnet einen lauten Ausruf; die Wiedergabe passt natürlich zur folgenden direkten Rede.
