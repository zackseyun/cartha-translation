  - severity: high
    issue: „uns zu einer Tat verstellen“ für ἀπρεπὲς ἡμῖν δρᾶμα ὑποκρίνασθαι
    rationale: δρᾶμα bezeichnet ein Schauspiel bzw. eine dramatische Szene, und ὑποκρίνασθαι trägt den Gedanken des Spielens/Aufführens. Die deutsche Fassung verliert dieses Bild und erzeugt zudem die unnatürliche Verbindung „sich zu einer Tat verstellen“.
