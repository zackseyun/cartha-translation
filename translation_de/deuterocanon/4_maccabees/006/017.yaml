base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/017.yaml
  text: Let us not think so badly, we who are Abraham’s children, as to become fainthearted and act out a disgraceful scene unworthy of us.
translation:
  language: de
  text: Lasst uns, die wir Abrahams Kinder sind, nicht so schlecht denken, dass wir aus Kleinmut ein für uns unwürdiges Schauspiel aufführen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… eine für uns unwürdige Rolle spielen.“'
    reason: ὑποκρίνασθαι kann das Spielen einer Rolle bezeichnen; mit δρᾶμα liegt zugleich das Bild des Aufführens eines Schauspiels nahe.
lexical_decisions:
- source_word: κακῶς φρονήσαιμεν
  choice: verwerflich denken
  rationale: Gibt die moralisch wertende Bedeutung von κακῶς wieder; der griechische Optativ in der Verneinung wird als mahnender Kohortativ formuliert.
- source_word: οἱ Ἀβραὰμ παῖδες
  choice: wir, die Kinder Abrahams
  rationale: Bewahrt die Selbstbezeichnung und den Bezug auf die gemeinsame Abstammung; παῖδες ist hier natürlich als „Kinder“ wiederzugeben.
- source_word: μαλακοψυχήσαντας
  choice: kleinmütig werden
  rationale: Bezeichnet ein inneres Nachgeben aus Mutlosigkeit oder Schwäche und vermeidet die heute missverständliche wörtliche Bildung „weichherzig“.
- source_word: ἀπρεπὲς ἡμῖν δρᾶμα
  choice: eine Tat, die unserer unwürdig ist
  rationale: ἀπρεπές bezeichnet etwas Ungehöriges bzw. Unwürdiges; die Relativkonstruktion klingt im Deutschen natürlich und erhält den ethischen Bezug auf die Sprecher.
- source_word: ὑποκρίνασθαι
  choice: uns zu einer Tat verstellen
  rationale: Das Medium kann „eine Rolle spielen“, „vortäuschen“ oder „sich verstellen“ bedeuten. Im Kontext bezeichnet es offenbar die heuchlerische Darstellung einer unwürdigen Handlung, ohne zwingend deren tatsächliche innere Zustimmung zu behaupten.
theological_decisions:
- issue: Bezeichnung als Kinder Abrahams
  choice: als korporative Selbstbezeichnung bewahrt
  alternative: 'freier: „als Nachkommen Abrahams“'
  rationale: Der Text beruft sich auf die Identität und Würde der abrahamitischen Gemeinschaft; „Kinder“ erhält die Bildsprache, ohne darüber hinausgehende konfessionelle Aussagen einzutragen.
- issue: Verhältnis von äußerer Handlung und innerer Haltung
  choice: ὑποκρίνασθαι als Sich-Verstellen wiedergegeben
  alternative: „eine unwürdige Tat begehen“ oder „eine schändliche Szene aufführen“
  rationale: Die Formulierung hält die Spannung fest, dass bereits das gespielte oder vorgetäuschte Mitmachen als unwürdig gilt, und reduziert den Ausdruck nicht auf ein schlichtes tatsächliches Begehen.
translation_notes:
  register: Dignitatives, modernes Standarddeutsch. Die Satzstellung rückt die Identität als Kinder Abrahams früh ins Blickfeld. „Kleinmütig“ ist gehoben, aber allgemein verständlich und passt zur paränetischen Rede.
