  source_fidelity: Die Grundstruktur mit der Selbstbezeichnung als Kinder Abrahams und dem Ausdruck von Kleinmut ist getroffen. „Verwerflich denken“ verschiebt κακῶς jedoch zu stark in Richtung moralischer Verwerflichkeit; gemeint ist eher „so schlecht/übel denken“. Zudem gibt „uns zu einer Tat verstellen“ weder δρᾶμα („Schauspiel“, „Szene“) noch ὑποκρίνασθαι (eine Rolle/Szene spielen bzw. aufführen) angemessen wieder.
  naturalness: Die vorliegende Formulierung ist zwar verständlich, aber „uns zu einer Tat verstellen“ ist im heutigen Standarddeutsch idiomatisch und semantisch unklar. „Ein für uns unwürdiges Schauspiel aufführen“ ist klar, würdig im Register und bewahrt den dramatischen Bildbereich des Griechischen.
  terminology: „Abrahams Kinder“ bewahrt die Selbstbezeichnung οἱ Ἀβραὰμ παῖδες. „Kleinmut“ entspricht dem inneren Mutverlust von μαλακοψυχήσαντας. „Schauspiel aufführen“ gibt δρᾶμα und ὑποκρίνασθαι zusammen wieder, ohne eine spezifische theologische Deutung einzutragen.
