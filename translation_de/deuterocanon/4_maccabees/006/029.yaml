  source_fidelity: Der Haupttext gibt καθαρσόν als „Reinigung“ angemessen wieder und bewahrt den kultischen Anklang ohne die stärker deutende „Sühne“. αἷμα und ψυχή sind treffend mit „Blut“ und „Leben“ übersetzt. ἀντίψυχον bezeichnet hier ein Leben als Gegenleistung bzw. Ersatz für andere Leben; die Austausch- und Stellvertretungsdimension bleibt erhalten.
  naturalness: „Im Austausch für ihres“ ist zwar verständlich, wirkt im modernen Deutsch jedoch elliptisch und kann wegen des unklaren Bezugs von „ihres“ stocken. „Im Austausch für ihr Leben“ ist idiomatischer und macht den durch ψυχήν vorausgesetzten Bezug explizit.
  terminology: „Reinigung“ ist für καθαρσόν die sachgerechte, nicht konfessionell festgelegte Wahl. Die Fußnote sollte die Alternative nicht als bloßes „Reinigungsmittel“ verengen, da das griechische Prädikatsnomen sowohl den Reinigungsakt bzw. -zustand als auch seine kultische Funktion ausdrücken kann. „Lösegeld“ bleibt zu Recht als stärker interpretierende Möglichkeit gekennzeichnet.
