  text: Make my blood their purification[b][a], and take my life in exchange for theirs.
translation:
  language: de
  text: Mach mein Blut zu ihrer Reinigung[a], und nimm mein Leben im Austausch für ihr Leben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mach mein Blut zu ihrer Reinigung.“ Das griechische Wort kann Reinigung oder Läuterung im kultischen Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Nimm mein Leben als Austausch für ihr Leben.“ Die Formulierung bezeichnet einen stellvertretenden Austausch von Leben für Leben. „Als Lösegeld für ihr Leben“ wäre möglich, aber stärker deutend.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθαρσόν
  choice: Reinigung
  rationale: Das Wort bezeichnet hier das Ergebnis beziehungsweise Mittel des Reinigens und kann im kultischen Sinn gebraucht sein. „Reinigung“ bewahrt diesen Bezug, ohne ihn mit dem stärker deutenden Begriff „Sühne“ festzulegen.
- source_word: αἷμα
  choice: Blut
  rationale: Die wörtliche Wiedergabe ist im Zusammenhang des Martyriums und der opferbezogenen Bitte erforderlich.
- source_word: ἀντίψυχον
  choice: im Austausch für ihres
  rationale: Das Kompositum drückt den Austausch beziehungsweise die Stellvertretung eines Lebens für ein anderes aus. Die Formulierung wahrt diese Austauschbedeutung, ohne sie auf die stärker kommerzielle Vorstellung eines Lösegelds festzulegen.
- source_word: ψυχήν
  choice: Leben
  rationale: ψυχή bezeichnet hier das hingegebene Leben des Sprechers, nicht vorrangig eine vom Körper getrennte Seele. Das Pronomen „ihres“ nimmt entsprechend „Leben“ auf.
- source_word: λάβε
  choice: nimm
  rationale: Der Imperativ wird direkt und natürlich wiedergegeben und erhält den Charakter der an Gott gerichteten Bitte.
theological_decisions:
- issue: Opfer- und stellvertretungsbezogene Sprache im Gebet des Märtyrers
  choice: Die Begriffe „Reinigung“ und „im Austausch für“ werden ausdrücklich beibehalten.
  alternative: „Lass mein Blut für sie Sühne schaffen, und nimm mein Leben als Lösegeld für ihres.“
  rationale: Der griechische Text verbindet kultische Reinigung mit dem Austausch eines Lebens für andere. Die Übersetzung erhält diese theologische Spannung, ohne sie abzuschwächen oder durch spätere dogmatische Fachbegriffe genauer festzulegen, als es der Wortlaut erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gebetsform und die kultisch-stellvertretende Bildsprache bleiben erhalten; ungebräuchliche Fachwörter und konfessionell geprägte Deutungen werden vermieden.
