  text: You know[a], O God, that though it is possible for me to be saved[b], I am dying in burning torments because of the law.
translation:
  language: de
  text: 'Du weißt, o Gott: Obwohl ich gerettet werden könnte[a], sterbe ich unter brennenden Folterqualen wegen des Gesetzes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befreit zu werden“ oder „heil zu entkommen“. Gemeint ist hier vor allem, dass ihm noch ein Weg offensteht, körperlich gerettet zu werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um des Gesetzes willen“. Gemeint ist seine standhafte Treue zum mosaischen Gesetz unter der Verfolgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ οἶσθα
  choice: Du weißt
  rationale: Das ausdrücklich gesetzte Pronomen Σὺ wird beibehalten und unterstreicht die unmittelbare, persönliche Anrede im Gebet.
- source_word: θεέ
  choice: o Gott
  rationale: Der griechische Vokativ wird durch die im Deutschen würdige und verständliche Gebetsanrede „o Gott“ wiedergegeben.
- source_word: παρὸν μοι
  choice: obwohl es mir möglich wäre
  rationale: Die Wendung bezeichnet eine dem Sprecher weiterhin offenstehende Möglichkeit. „Obwohl“ gibt den im Zusammenhang klaren Gegensatz zwischen möglicher Rettung und tatsächlich erlittenem Tod wieder.
- source_word: σῴζεσθαι
  choice: gerettet zu werden
  rationale: Die Passivform entspricht dem griechischen Infinitiv und lässt dessen Bedeutungsbreite stehen; im unmittelbaren Zusammenhang geht es vor allem um körperliche Rettung vor Folter und Tod.
- source_word: βασάνοις καυστικαῖς
  choice: unter qualvollen Verbrennungen
  rationale: βασάνοις bezeichnet Folterqualen, καυστικαῖς ihre brennende beziehungsweise sengende Art. Die Formulierung ist im Deutschen natürlich und bildet die konkrete körperliche Qual ab.
- source_word: ἀποθνῄσκω
  choice: sterbe ich
  rationale: Das Präsens bewahrt die unmittelbare, gegenwärtige Aussage des Märtyrers; ein schlichtes deutsches Präsens ist hier natürlicher als eine Verlaufsumschreibung.
- source_word: διὰ τὸν νόμον
  choice: wegen des Gesetzes
  rationale: Die Formulierung gibt die kausale Bedeutung von διά mit Akkusativ eng wieder. Der Zusammenhang macht deutlich, dass die Treue zum mosaischen Gesetz den Anlass seines Leidens bildet.
theological_decisions:
- issue: Bedeutung von σῴζεσθαι im Martyriumskontext
  choice: „gerettet zu werden“, mit vorrangigem Bezug auf körperliche Rettung
  alternative: „zu entkommen“ oder „bewahrt zu werden“
  rationale: Der unmittelbare Gegensatz besteht zwischen einer noch möglichen Befreiung aus der Todesgefahr und dem tatsächlichen Sterben unter Folter. Die gewählte Formulierung wahrt zugleich die weitere Bedeutungsbreite des griechischen Verbs, ohne eine spezifische Heilslehre einzutragen.
- issue: Bedeutung von διὰ τὸν νόμον
  choice: „wegen des Gesetzes“
  alternative: „um des Gesetzes willen“
  rationale: Die griechische Wendung benennt den Grund seines Todes. Im Kontext ist damit seine standhafte Treue zum mosaischen Gesetz gemeint; die engere deutsche Wiedergabe vermeidet zusätzliche theologische Ausdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobener Gebetssprache. Die Syntax bleibt klar und unmittelbar. Die Fußnotenmarker stehen jeweils an der tatsächlich erläuterten Wendung; damit wird die offenbar vertauschte Markerzuordnung der englischen Beratungsschicht nicht übernommen.
