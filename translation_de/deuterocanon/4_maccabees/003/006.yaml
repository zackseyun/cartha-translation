translation:
  language: de
  text: Das lässt sich also am Durst des Königs David deutlicher erkennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das lässt sich also am Durst des Königs David deutlicher erwägen“ beziehungsweise „… deutlicher erschließen“. Das griechische Verb kann ein nachdenkendes Erwägen, folgerndes Erschließen oder gedankliches Nachvollziehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν γοῦν
  choice: lässt sich also
  rationale: Die unpersönliche Konstruktion mit Infinitiv bezeichnet eine Möglichkeit; „lässt sich“ gibt sie im Deutschen natürlich wieder. „Also“ bewahrt die folgernde beziehungsweise weiterführende Kraft von γοῦν.
- source_word: τοῦτο
  choice: das
  rationale: Das Demonstrativpronomen verweist knapp auf den zuvor behandelten Gedanken, ohne seinen Bezug näher festzulegen.
- source_word: διὰ τῆς ... δίψης
  choice: am Durst
  rationale: διά mit Genitiv bezeichnet hier das Mittel beziehungsweise das Beispiel, anhand dessen etwas erkannt wird. Die deutsche Wendung „am … erkennen“ gibt diesen Zusammenhang idiomatisch wieder.
- source_word: Δαυεὶδ τοῦ βασιλέως
  choice: des Königs David
  rationale: Die appositionale Bezeichnung wird in natürlichem modernem Deutsch als „des Königs David“ wiedergegeben.
- source_word: δίψης
  choice: Durst
  rationale: Das Substantiv bezeichnet schlicht Durst; eine im Griechischen nicht ausdrücklich vorhandene Verstärkung wird vermieden.
- source_word: σαφέστερον
  choice: deutlicher
  rationale: Der Komparativ wird als Adverb wiedergegeben und bezeichnet eine größere Klarheit des Erkennens.
- source_word: ἐπιλογίσασθαι
  choice: erkennen
  rationale: Im Zusammenhang bezeichnet das Verb ein reflektierendes Erfassen oder Erschließen. „Erkennen“ ist hier verständlich und flüssig, während die genauere Bedeutungsbreite in der Fußnote erhalten bleibt.
