  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder: ἐπεὶ γάρ als begründend-zeitliches „Denn als“, die Dauerangabe διʼ ὅλης ἡμέρας als „den ganzen Tag über“, προσβάλλων als militärisches „angriff“, πολλοὺς αὐτῶν ἀπέκτεινεν als „viele von ihnen tötete“ und μετά mit Genitiv als gemeinsames Handeln „zusammen mit“. Der bewusst offene Satzschluss mit Komma entspricht der Fortsetzung im folgenden Vers.'
