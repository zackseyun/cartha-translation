  yaml_path: translation/deuterocanon/4_maccabees/003/007.yaml
  text: For when David, attacking the foreigners throughout the whole day, killed many of them along with the soldiers of the nation,
translation:
  language: de
  text: Denn als David den ganzen Tag über die Fremden[a] angriff und zusammen mit den Soldaten des Volkes[b] viele von ihnen tötete,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Philister«. Im Griechischen steht »die Fremden« (ἀλλόφυλοι), eine Bezeichnung, die im biblischen Griechisch häufig für die Philister verwendet wird; hier steht jedoch nicht der eigentliche Volksname.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zusammen mit den Soldaten seines Volkes«. Wörtlich steht im Griechischen: »zusammen mit den Soldaten des Volkes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ γὰρ
  choice: Denn als
  rationale: Verbindet den begründenden Sinn von γάρ mit dem zeitlichen Sinn von ἐπεί und bewahrt den Anschluss als einleitenden Nebensatz.
- source_word: διʼ ὅλης ἡμέρας
  choice: den ganzen Tag über
  rationale: Gibt die betonte Dauer über den gesamten Tag natürlich und vollständig wieder.
- source_word: προσβάλλων
  choice: angriff
  rationale: Bezeichnet hier einen militärischen Angriff; die finite Wiedergabe mit „angriff“ fügt sich im Deutschen natürlich in die als-Konstruktion ein.
- source_word: τοῖς ἀλλοφύλοις
  choice: die Fremden
  rationale: Bewahrt die allgemeine lexikalische Bedeutung von ἀλλόφυλοι, ohne die im biblischen Sprachgebrauch naheliegende Identifikation mit den Philistern stillschweigend festzulegen.
- source_word: ὁ Δαυεὶδ
  choice: David
  rationale: Im Deutschen übliche Namensform.
- source_word: πολλοὺς αὐτῶν ἀπέκτεινεν
  choice: viele von ihnen tötete
  rationale: Direkte und natürliche Wiedergabe des Verbs ἀποκτείνω und seines Objekts.
- source_word: μετὰ τῶν τοῦ ἔθνους στρατιωτῶν
  choice: zusammen mit den Soldaten des Volkes
  rationale: Gibt μετά als Begleitung und τοῦ ἔθνους wörtlich als „des Volkes“ wieder, ohne das im Griechischen nicht ausdrücklich vorhandene Possessivpronomen „seines“ einzufügen.
