  naturalness: Die Satzperiode ist als Anschluss an den vorherigen Kontext angemessen. „Kraft der edlen und guten Vernunft“ ist deutlich idiomatischer als „kraft des edlen und guten Wesens der Vernunft“. „Jede Herrschaft der Leidenschaften“ ist im Deutschen natürlich und bewahrt die distributive Aussage.
  terminology: „Vernunft“ ist für λογισμός im Kontext von 4 Makkabäer passend. „Leidenschaften“ für πάθη und „niederzuringen“ für καταπαλαῖσαι sind gut gewählt. Die Fußnote erläutert die bildhafte, verächtliche Nuance von ἀποπτύσαι sachgerecht.
