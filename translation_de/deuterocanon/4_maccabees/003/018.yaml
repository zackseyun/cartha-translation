- from: und die Schmerzen des Körpers, so überaus groß sie auch sind, niederzuringen und kraft des edlen und guten Wesens der Vernunft alle Herrschaft der Leidenschaften verächtlich zurückzuweisen.[a]
  to: und die körperlichen Schmerzen, so überaus groß sie auch sind, niederzuringen und kraft der edlen und guten Vernunft jede Herrschaft der Leidenschaften verächtlich zurückzuweisen.[a]
  rationale: Die Revision beseitigt die unnötig abstrakte und im modernen Deutsch schwerfällige Wendung „des edlen und guten Wesens der Vernunft“, ohne die Doppelheit von καλοκἀγαθία auf einen einzelnen Tugendbegriff zu reduzieren. „Körperlichen Schmerzen“ gibt den Bezug auf die σώματα idiomatisch wieder. Die Änderung zu „jede Herrschaft“ wahrt den Plural von ἐπικρατείας und den Gedanken der von den Leidenschaften ausgehenden Herrschaft. Fußnotenanker und Fußnote bleiben inhaltlich korrekt.
