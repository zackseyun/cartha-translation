  text: and to wrestle down the pains of the body[a], though they are extreme, and by the nobility and goodness of reason to spurn all the dominion of the passions.
translation:
  language: de
  text: und die körperlichen Schmerzen, so überaus groß sie auch sind, niederzuringen und kraft der edlen und guten Vernunft jede Herrschaft der Leidenschaften verächtlich zurückzuweisen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wegzuspucken“. Das griechische Verb zeichnet das lebhafte Bild einer verächtlichen Zurückweisung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλγηδόνας
  choice: Schmerzen
  rationale: Das Substantiv bezeichnet körperlichen Schmerz oder körperliche Pein; „Schmerzen“ ist im Deutschen klar und übertreibt die Aussage nicht.
- source_word: καθʼ ὑπερβολὴν οὔσας
  choice: so überaus groß sie auch sind
  rationale: Die konzessive Formulierung gibt die außergewöhnliche Stärke der Schmerzen natürlich wieder.
- source_word: καταπαλαῖσαι
  choice: niederzuringen
  rationale: Das Verb enthält das Bild eines Ringkampfs; „niederzuringen“ bewahrt diese athletische Metapher.
- source_word: καλοκἀγαθίας
  choice: des edlen und guten Wesens
  rationale: Die Verbindung bezeichnet eine zugleich edle und sittlich gute Beschaffenheit. Die Doppelformulierung erhält beide Aspekte des kompakten griechischen Ideals.
- source_word: λογισμοῦ
  choice: Vernunft
  rationale: In 4 Makkabäer bezeichnet λογισμός durchgehend die vernünftige Urteilskraft, die über die Leidenschaften herrschen soll; „Vernunft“ ist prägnant und verständlich.
- source_word: ἀποπτύσαι
  choice: verächtlich zurückzuweisen
  rationale: Das Verb bedeutet wörtlich „aus-/wegspucken“ und bezeichnet hier bildhaft eine verächtliche Zurückweisung. Die gewählte Wiedergabe erhält den Nachdruck in natürlichem, würdigem Deutsch.
- source_word: πάσας τὰς τῶν παθῶν ἐπικρατείας
  choice: alle Herrschaft der Leidenschaften
  rationale: ἐπικρατεία bezeichnet Übermacht oder beherrschenden Einfluss; die Formulierung bewahrt die Leidenschaften als Träger dieser Herrschaft, ohne ihre genaue Wirkungsweise festzulegen.
theological_decisions:
- issue: Wiedergabe von λογισμός im philosophisch-theologischen Gedankengang
  choice: Vernunft
  alternative: vernünftige Urteilskraft
  rationale: „Vernunft“ wahrt den leitenden Begriff des Buches und bleibt für heutige Leser verständlich, ohne eine bestimmte philosophische oder konfessionelle Deutung einzutragen.
- issue: Verhältnis der Vernunft zu den Leidenschaften
  choice: alle Herrschaft der Leidenschaften verächtlich zurückzuweisen
  alternative: jede Übermacht der Leidenschaften abzuschütteln
  rationale: Die Übersetzung erhält die Aussage, dass die Leidenschaften Herrschaft ausüben können, und gibt zugleich die schroffe Ablehnung durch die Vernunft wieder, ohne eine vollständige Auslöschung der Leidenschaften zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der mit „und“ beginnende Infinitivanschluss des griechischen Verses wurde beibehalten, da der Vers syntaktisch an den vorausgehenden Zusammenhang anschließt. Die Ringkampfmetapher wurde mit „niederzuringen“ bewahrt; die ungewöhnlich starke Metapher von ἀποπτύσαι wird im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
