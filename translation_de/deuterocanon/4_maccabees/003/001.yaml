  yaml_path: translation/deuterocanon/4_maccabees/003/001.yaml
  text: But this line of reasoning is utterly ridiculous[a], for reason evidently does not prevail over its own passions[b], but over bodily ones.
translation:
  language: de
  text: Doch dieser Gedankengang ist völlig lächerlich[a]; denn offenbar wird die Vernunft nicht ihrer eigenen Leidenschaften Herr, sondern der körperlichen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese Argumentation«. Das griechische Wort λογισμός kann einen Denkprozess, die Vernunft als Fähigkeit oder ein vorgebrachtes Argument bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind körperliche Leidenschaften oder Begierden; im Griechischen steht »körperlich« substantivisch.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιδῇ γελοῖος
  choice: völlig lächerlich
  rationale: κομιδῇ verstärkt γελοῖος nachdrücklich. »Völlig lächerlich« gibt diese Schärfe in natürlichem, modernem Deutsch wieder.
- source_word: λογισμός (erste Belegstelle)
  choice: Gedankengang
  rationale: Zu Beginn bezeichnet das Wort den zur Diskussion stehenden Gedankengang beziehungsweise die Argumentation. Diese Wiedergabe unterscheidet ihn verständlich von der Vernunft als Fähigkeit im folgenden Satzteil.
- source_word: λογισμός (zweite Belegstelle)
  choice: Vernunft
  rationale: Hier ist die vernünftige Fähigkeit gemeint, die über Leidenschaften Herr werden kann. »Vernunft« entspricht dem philosophischen Sprachgebrauch des Abschnitts.
- source_word: ἐπικρατεῖν
  choice: Herr werden
  rationale: Die Wendung bezeichnet das Erlangen oder Ausüben von Herrschaft über etwas. »Jemandes/einer Sache Herr werden« ist idiomatisch und bewahrt das Bild der Überlegenheit.
- source_word: φαίνεται
  choice: offenbar
  rationale: Das Verb kennzeichnet, was sich zeigt oder als erkennbar hervortritt. »Offenbar« wahrt diese inferentielle Nuance, ohne bloße Vermutung auszudrücken.
- source_word: τῶν ἑαυτοῦ παθῶν
  choice: ihrer eigenen Leidenschaften
  rationale: πάθη bezeichnet hier Leidenschaften oder innere Regungen; das Reflexivpronomen wird ausdrücklich beibehalten, auch wenn die Zuordnung von Leidenschaften zur Vernunft gedanklich spannungsvoll wirkt.
- source_word: τῶν σωματικῶν
  choice: der körperlichen
  rationale: Das substantivisch gebrauchte Adjektiv nimmt »Leidenschaften« aus dem vorherigen Satzteil auf. Die knappe deutsche Ellipse erhält den Kontrast des Griechischen.
theological_decisions:
- issue: Verhältnis von Vernunft und Leidenschaften
  choice: Das erste λογισμός wird als »Gedankengang«, das zweite als »Vernunft« wiedergegeben; »ihre eigenen Leidenschaften« bleibt wörtlich erhalten.
  alternative: Beide Vorkommen einheitlich mit »Vernunft« oder »Überlegung« wiederzugeben beziehungsweise die eigenen Leidenschaften erklärend der menschlichen Person statt der Vernunft zuzuordnen.
  rationale: Der Satz kritisiert einen Gedankengang über die Reichweite vernünftiger Herrschaft. Die kontextabhängige Wiedergabe macht den rhetorischen Wechsel verständlich, ohne die auffällige und philosophisch bedeutsame Formulierung von den »eigenen Leidenschaften« stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit philosophischer Klarheit. »Gedankengang« und »Vernunft« machen den kontextuellen Bedeutungswechsel von λογισμός sichtbar; die idiomatische Wendung »einer Sache Herr werden« erhält zugleich den Gedanken der Herrschaft über Leidenschaften.
