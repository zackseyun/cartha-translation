  text: Then[a], when evening had come, sweating and very exhausted, he came to the royal tent[b], around which the whole army of his forefathers had encamped.
translation:
  language: de
  text: Als es nun Abend geworden war, kam er schwitzend und völlig erschöpft zum königlichen Zelt[a], um das sich das ganze Heer seiner Vorfahren[b] gelagert hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Zelt des Königs“. Das griechische Adjektiv bedeutet „königlich“ und kann hier besonders das Zelt des Herrschers im Heerlager bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen die gedrängte Wendung „das ganze Heer der Vorfahren“; „seiner“ ist aus dem Zusammenhang ergänzt.
    reason: textual_clarity
lexical_decisions:
- source_word: τότε δὴ γενομένης ἑσπέρας
  choice: Als es nun Abend geworden war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand; „nun“ gibt die weiterführende bzw. hervorhebende Kraft von τότε δή wieder. Das Plusquamperfekt bewahrt den Eintritt des Abends als bereits gegebenen Hintergrund.
- source_word: ἱδρῶν
  choice: schwitzend
  rationale: Das Präsenspartizip beschreibt anschaulich seinen körperlichen Zustand bei der Ankunft.
- source_word: σφόδρα κεκμηκώς
  choice: völlig erschöpft
  rationale: Das Perfektpartizip bezeichnet den anhaltenden Zustand infolge großer Anstrengung; „völlig“ gibt die Verstärkung durch σφόδρα in natürlichem Deutsch wieder.
- source_word: ἐπὶ τὴν βασίλειον σκηνήν
  choice: zum königlichen Zelt
  rationale: βασίλειος bedeutet „königlich“, σκηνή „Zelt“. Die Formulierung bleibt nahe am Griechischen und passt zum Heerlager.
- source_word: περὶ ἣν
  choice: um das
  rationale: περί bezeichnet hier die räumliche Anordnung rings um das Zelt.
- source_word: ὁ πᾶς τῶν προγόνων στρατός
  choice: das ganze Heer seiner Vorfahren
  rationale: Die gedrängte Genitivverbindung wird in verständlichem Deutsch wiedergegeben. „Vorfahren“ bewahrt den genealogischen Sinn, ohne die nicht genannten Personen näher zu bestimmen.
- source_word: ἐστρατοπέδευκεν
  choice: sich gelagert hatte
  rationale: Das griechische Perfekt beschreibt den aus dem Lagern hervorgegangenen Zustand; das deutsche Plusquamperfekt macht deutlich, dass das Heer bereits vor seiner Ankunft dort sein Lager aufgeschlagen hatte.
theological_decisions:
- issue: Bezug von τῶν προγόνων
  choice: seiner Vorfahren
  alternative: der Vorfahren
  rationale: Der griechische Ausdruck nennt keine einzelnen Vorfahren und lässt das Zugehörigkeitsverhältnis knapp. Das Possessivpronomen ist aus dem Erzählzusammenhang erschlossen, ohne historische oder konfessionelle Identifikationen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Partizipien werden natürlich in den Hauptsatz eingebunden, während die zeitliche Abfolge und die anschauliche Schilderung des körperlichen Zustands erhalten bleiben.
