lexical_decisions:
- source_word: οἱ ... ἄλλοι πάντες
  choice: alle anderen
  rationale: Die Verbindung von ἄλλοι und πάντες bezeichnet umfassend die übrigen Personen. „Alle anderen“ ist im modernen Deutschen natürlich und präzise.
- source_word: μὲν οὖν
  choice: nicht eigens wiedergegeben
  rationale: Die Partikelverbindung dient hier vor allem dem Übergang und der Fortführung. In diesem knappen deutschen Satz wird ihre Funktion durch den Textfluss und das Semikolon ausreichend getragen; ein ausdrückliches „nun“ oder „also“ könnte eine stärkere zeitliche oder folgernde Bedeutung nahelegen.
- source_word: ἐπὶ τὸ δεῖπνον
  choice: beim Essen
  rationale: δεῖπνον bezeichnet die Hauptmahlzeit. Mit ἐπί und Akkusativ meint die Wendung hier die Anwesenheit bei beziehungsweise zum Essen. „Beim Essen“ ist idiomatisch und lässt offen, ob eine gewöhnliche Mahlzeit oder ein förmlicheres Gastmahl gemeint ist.
- source_word: ἦσαν
  choice: waren
  rationale: Der Imperfekt von εἰμί wird schlicht mit „waren“ wiedergegeben. Erweiterungen wie „hatten sich versammelt“ würden mehr aussagen als der griechische Wortlaut.
