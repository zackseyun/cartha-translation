  yaml_path: translation/deuterocanon/4_maccabees/003/017.yaml
  text: For the self-controlled mind is able to conquer the compulsions of the passions[b][a], and to extinguish the burnings of desires.
translation:
  language: de
  text: Denn der besonnene Verstand[a] vermag die Zwänge der Leidenschaften zu besiegen und die Glut rasender Triebe[b] zu löschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Vernunft“; das griechische νοῦς bezeichnet hier das vernünftige Erkenntnis- und Steuerungsvermögen.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Ausdruck kann heftige oder rasende Impulse und Begierden verschiedener Art bezeichnen, nicht nur sexuelles Verlangen.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατὸς
  choice: vermag
  rationale: Das prädikative Adjektiv bezeichnet Fähigkeit oder Vermögen; „vermag“ gibt dies knapp und in würdigem, natürlichem Deutsch wieder.
- source_word: σώφρων
  choice: besonnen
  rationale: Das Wort bezeichnet hier einen maßvollen, selbstbeherrschten und vernünftig urteilenden Zustand. „Besonnen“ verbindet diese Aspekte, ohne den Ausdruck auf bloße Willenskontrolle zu verengen.
- source_word: νοῦς
  choice: Verstand
  rationale: Im ethischen Gedankengang bezeichnet νοῦς das vernünftige Erkenntnis- und Steuerungsvermögen. „Verstand“ ist verständlich und bewahrt diese rationale Funktion; die mögliche Wiedergabe „Vernunft“ wird in einer Fußnote genannt.
- source_word: νικῆσαι
  choice: zu besiegen
  rationale: Das Verb trägt das Bild eines Sieges. „Besiegen“ erhält die kräftige Konfliktmetaphorik deutlicher als das mildere „überwinden“.
- source_word: ἀνάγκας
  choice: Zwänge
  rationale: Gemeint ist die zwingende oder drängende Macht, die von den Leidenschaften ausgeht. „Zwänge“ gibt diesen inneren Druck idiomatisch wieder.
- source_word: παθῶν
  choice: Leidenschaften
  rationale: Im hellenistisch-ethischen Zusammenhang bezeichnet πάθη die den Menschen bewegenden, potenziell ungeordneten Affekte. „Leidenschaften“ ist dafür die etablierte und kontextgerechte Wiedergabe.
- source_word: σβέσαι
  choice: zu löschen
  rationale: Das Verb bezeichnet das Auslöschen eines Feuers. Zusammen mit „Glut“ bleibt das Bild im Deutschen anschaulich erhalten.
- source_word: οἴστρων
  choice: rasender Triebe
  rationale: οἶστρος kann einen stechenden Antrieb, heftigen Impuls oder rasende Begierde bezeichnen. „Rasende Triebe“ wahrt die intensive, nicht notwendig nur sexuelle Bedeutung.
- source_word: φλεγμονάς
  choice: Glut
  rationale: Das Substantiv bezeichnet Entzündung, brennende Hitze oder ein Aufflammen. „Glut“ ergibt mit „löschen“ ein natürliches deutsches Feuerbild und bewahrt die metaphorische Hitze.
theological_decisions:
- issue: Anthropologische Bedeutung von νοῦς
  choice: „Verstand“ als vernünftig lenkendes Vermögen
  alternative: „Vernunft“, „Geist“ oder „Denkvermögen“
  rationale: Der Vers spricht von der Fähigkeit des besonnenen νοῦς, Leidenschaften zu beherrschen. „Verstand“ bewahrt diesen rationalen Akzent, ohne eine umfassende philosophische oder konfessionelle Anthropologie festzulegen.
- issue: Reichweite von οἶστρος
  choice: Breite Wiedergabe als heftige, rasende Triebe
  alternative: Spezifisch sexuelle „Begierden“ oder „Lüste“
  rationale: Der griechische Ausdruck kann sexuelle Begierde einschließen, bezeichnet aber allgemeiner einen stechenden, rasenden Impuls. Die Übersetzung vermeidet daher eine unbegründete sexuelle Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau sowie die Bilder des Besiegens und Löschens bleiben erhalten; schwerfällige medizinische Formulierungen wie „Entzündungen“ wurden zugunsten des natürlichen Bildworts „Glut“ vermieden.
