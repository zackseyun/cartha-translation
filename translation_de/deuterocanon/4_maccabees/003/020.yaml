base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/020.yaml
  text: For since our fathers had deep peace because of their law-abidingness[a], and prospered, so that even Seleucus Nicanor, the king of Asia, set apart money for them for the sacred service and approved their polity[b],
translation:
  language: de
  text: Denn weil unsere Väter aufgrund ihrer Gesetzestreue[a] tiefen Frieden hatten und es ihnen gut ging, stellte sogar Seleukos Nikanor, der König von Asien, für sie Gelder für den heiligen Dienst bereit und erkannte ihre Staatsordnung[b] an,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufgrund der guten Ordnung« beziehungsweise »aufgrund der Befolgung des Gesetzes«. Das griechische Wort bezeichnet ein geordnetes Leben unter dem Gesetz und kann hier die Treue zum jüdischen Gesetz einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihre Verfassung« beziehungsweise »ihre bürgerliche Ordnung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαθεῖαν εἰρήνην
  choice: tiefen Frieden
  rationale: Bewahrt das griechische Bild von der »Tiefe« des Friedens und dessen rhetorisches Gewicht.
- source_word: διὰ τὴν εὐνομίαν
  choice: aufgrund ihrer Gesetzestreue
  rationale: εὐνομία bezeichnet ein geordnetes, dem Gesetz entsprechendes Leben. »Gesetzestreue« ist im Deutschen natürlich, ohne ausdrücklich nur das mosaische Gesetz zu nennen.
- source_word: ἔπραττον καλῶς
  choice: es ihnen gut ging
  rationale: Gibt die idiomatische Bedeutung »gut dastehen / Wohlergehen erfahren« natürlich wieder, ohne materiellen Wohlstand allein in den Vordergrund zu stellen.
- source_word: ἀφορίσαι
  choice: bereitstellte
  rationale: Drückt hier die zweckgebundene Zuweisung von Geldern aus.
- source_word: χρήματα εἰς τὴν ἱερουργίαν
  choice: Gelder für den heiligen Dienst
  rationale: Bewahrt die breite Bedeutung des Dienstes am Heiligtum, ohne ihn unnötig auf eine einzelne priesterliche Tätigkeit einzuengen.
- source_word: τὴν πολιτίαν αὐτῶν
  choice: ihre Staatsordnung
  rationale: πολιτεία bezeichnet hier die öffentliche beziehungsweise verfassungsmäßige Ordnung der Gemeinschaft; »Staatsordnung« ist präzise und verständlich.
- source_word: ἀποδέχεσθαι
  choice: erkannte … an
  rationale: Vermittelt die wohlwollende offizielle Billigung dieser Ordnung durch den König.
- source_word: Σέλευκον τὸν Νικάνορα
  choice: Seleukos Nikator
  rationale: Verwendet die im Deutschen übliche griechische Namensform und gibt den Beinamen Νικάνορα als »Nikator« wieder.
theological_decisions:
- issue: Bedeutung von εὐνομία im Blick auf jüdische Identität
  choice: Gesetzestreue
  alternative: gute Ordnung; Befolgung des Gesetzes
  rationale: Im Zusammenhang dürfte die Treue zur jüdischen Lebensordnung mitschwingen. Das griechische Wort ist jedoch weiter gefasst als ein ausdrücklicher Hinweis allein auf das mosaische Gesetz; die Fußnote hält diese Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber anschauliche Wendung »tiefer Frieden« bewahrt das griechische Bild. Der abschließende Beistrich zeigt, dass der syntaktische Gedankengang im folgenden Vers weitergeführt wird.
