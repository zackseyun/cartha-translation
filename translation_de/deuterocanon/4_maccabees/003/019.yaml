  text: And now the time also calls us to the demonstration of the history of rational self-control.
translation:
  language: de
  text: Nun aber ruft uns auch die Zeit zur Beweisführung anhand der Geschichte der besonnenen Vernunft.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ καιρός
  choice: die Zeit
  rationale: Bezeichnet hier den nun gekommenen geeigneten Zeitpunkt im Fortgang der Rede; die natürliche deutsche Wendung bewahrt diese zeitliche Dringlichkeit.
- source_word: ἀπόδειξιν
  choice: unter Beweis zu stellen
  rationale: Gibt den rhetorisch-philosophischen Sinn von ‚Nachweis/Beweisführung‘ idiomatisch wieder.
- source_word: τῆς ἱστορίας
  choice: anhand der Geschichte
  rationale: Der Genitiv bezeichnet am plausibelsten den geschichtlichen Bericht als Stoff beziehungsweise Mittel der folgenden Beweisführung, nicht eine abstrakte ‚Geschichte des vernünftigen Denkens‘.
- source_word: τοῦ σώφρονος λογισμοῦ
  choice: die besonnene Vernunft
  rationale: λογισμός meint im Kontext die vernünftige Urteilskraft; σώφρων kennzeichnet sie als besonnen und selbstbeherrscht. Die Formulierung vermeidet die schwer verständliche Abstraktion ‚vernünftige Selbstbeherrschung‘.
theological_decisions:
- issue: Verhältnis von Geschichte und Beweisführung
  choice: Die Geschichte dient als Grundlage, anhand deren die besonnene Vernunft unter Beweis gestellt wird.
  alternative: „zur Darlegung der Geschichte der besonnenen Vernunft“
  rationale: Der anschließende Märtyrerbericht fungiert in 4 Makkabäer als Beleg für die zuvor vertretene These. Die gewählte Fassung macht diese Syntax und Argumentationsbewegung auf Deutsch verständlich, ohne eine theologische Folgerung hinzuzufügen.
translation_notes:
  register: Moderne, würdevolle Sachprosa mit rhetorischem Übergang. „Nun aber“ bildet ἤδη δὲ ab; „ruft uns … dazu“ bewahrt die Personifikation des geeigneten Zeitpunkts.
