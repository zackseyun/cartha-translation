translation:
  language: de
  text: Denn die Vernunft rottet die Leidenschaften nicht aus,[a] sondern tritt ihnen entgegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet jemanden, der etwas mit der Wurzel ausreißt; es bewahrt das Bild des Auswurzelns.
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Die Vernunft beseitigt die Leidenschaften nicht völlig, sondern tritt ihnen entgegen.'
    reason: clarification
lexical_decisions:
- source_word: λογισμός
  choice: die Vernunft
  rationale: Der Ausdruck bezeichnet in 4 Makkabäer das vernünftige Urteils- und Denkvermögen. „Vernunft“ ist im Deutschen prägnant und bewahrt den philosophischen Leitbegriff.
- source_word: ἐκριζωτής
  choice: rottet … aus
  rationale: Das griechische Nomen bezeichnet jemanden, der etwas mit der Wurzel ausreißt. Die verbale Wiedergabe „rottet … aus“ klingt natürlicher als „Ausrotter“ und erhält sowohl das Bild als auch den Gedanken vollständiger Beseitigung.
- source_word: τῶν παθῶν
  choice: die Leidenschaften
  rationale: πάθη bezeichnet hier im ethisch-philosophischen Sinn die Affekte oder Leidenschaften, nicht bloß Gefühle oder Leiden. „Leidenschaften“ wahrt diesen traditionellen, aber weiterhin verständlichen Fachsinn.
- source_word: ἀνταγωνιστής
  choice: kämpft gegen sie
  rationale: Das Wort bezeichnet einen Gegenspieler oder jemanden, der im Widerstreit steht. Die verbale Formulierung ist natürliches modernes Deutsch und bewahrt die kämpferische Gegenüberstellung zu vollständigem Ausrotten.
theological_decisions:
- issue: Verhältnis der Vernunft zu den Leidenschaften
  choice: Die Vernunft beseitigt die Leidenschaften nicht vollständig, sondern tritt kämpfend gegen sie an.
  alternative: Die Vernunft ist nicht die Ausrotterin der Leidenschaften, sondern ihre Gegenspielerin.
  rationale: Die Aussage unterscheidet zwischen der völligen Entfernung der Leidenschaften und dem fortdauernden Widerstand gegen sie. Diese Spannung bleibt erhalten, ohne stoische Leidenschaftslosigkeit oder spätere theologische Kategorien einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die natürliche verbale Fassung vermeidet die schwerfälligen Substantive „Ausrotterin“ und „Gegenspielerin“, erhält aber den Gegensatz zwischen Auswurzeln und Widerstreit.
