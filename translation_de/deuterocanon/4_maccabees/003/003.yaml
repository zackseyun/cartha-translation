  text: No one can cut anger out of your soul[a], but it is possible to help with anger.
translation:
  language: de
  text: Niemand kann den Zorn aus eurer Seele herausschneiden; doch es ist möglich, dem Zorn zu helfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem Zorn helfen“. Der griechische Ausdruck ist ungewöhnlich. Er kann im weiteren Gedankengang etwa auf einen Umgang mit dem Zorn oder darauf hinweisen, ihn guten Zwecken dienstbar zu machen; der Wortlaut selbst bestimmt die Art dieser Hilfe jedoch nicht näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμόν / τῷ θυμῷ
  choice: den Zorn / dem Zorn
  rationale: θύμος bezeichnet hier Zorn beziehungsweise den zornigen Affekt. Die Wiederholung desselben deutschen Wortes bewahrt die auffällige Wiederaufnahme im Griechischen.
- source_word: τις … ὑμῶν
  choice: Keiner von euch
  rationale: 'Der Genitiv ὑμῶν lässt sich am unmittelbarsten mit dem indefiniten τις verbinden: Gemeint ist niemand aus dem Kreis der Angesprochenen.'
- source_word: ἐκκόψαι
  choice: herausschneiden
  rationale: Das Verb bezeichnet wörtlich ein Heraus- oder Abschneiden. „Herausschneiden“ erhält das anschauliche Bild, nach dem der Zorn aus der Seele entfernt werden sollte.
- source_word: τῆς ψυχῆς
  choice: aus der Seele
  rationale: ψυχή bezeichnet in diesem ethischen Zusammenhang die Seele beziehungsweise das innere menschliche Leben. Der bestimmte Singular kann im Deutschen ebenso allgemein verstanden werden.
- source_word: δυνατὸν βοηθῆσαι
  choice: kann man zu Hilfe kommen
  rationale: βοηθέω bedeutet „helfen“ oder „zu Hilfe kommen“. Die Formulierung wahrt die ungewöhnliche Dativkonstruktion und legt nicht vorschnell fest, wie diese Hilfe in Bezug auf den Zorn zu verstehen ist.
theological_decisions:
- issue: Deutung von τῷ θυμῷ δυνατὸν βοηθῆσαι
  choice: dem Zorn kann man zu Hilfe kommen
  alternative: man kann mit dem Zorn umgehen / den Zorn guten Zwecken dienstbar machen / gegen den Zorn Hilfe leisten
  rationale: Der griechische Wortlaut ist knapp und überraschend; grammatisch steht „dem Zorn“ im Dativ bei „helfen“. Eine glättende Wiedergabe würde die Aussage anhand des größeren Gedankengangs eindeutig deuten. Haupttext und Fußnote bewahren daher die tatsächliche Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache. „Herausschneiden“ bewahrt das kräftige Bild des griechischen Verbs; die bewusst ungewöhnliche Schlusswendung bildet die Mehrdeutigkeit des Ausgangstextes ab.
