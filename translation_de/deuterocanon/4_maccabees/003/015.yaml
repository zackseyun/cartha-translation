revisions:
- from: Doch obwohl er vor Durst wie im Feuer brannte, kam er zu dem Schluss, es wäre eine überaus schreckliche Gefahr für die Seele, wenn man das Getränk dem Blut gleichsetzte.[a]
  to: Doch auch als er vor Durst brannte, gelangte er zu dem Schluss, dass es eine überaus schreckliche Gefahr für die Seele wäre, wenn das Getränk als dem Blut gleichwertig angesehen würde.[a]
  rationale: Die Revision bewahrt den emphatischen Durst-Ausdruck und die ethische Gefahr für die Seele. Sie bindet die passive Bewertung wieder unmittelbar an „das Getränk“ und fasst die kulturelle Erläuterung so, dass sie den Kontext erhellt, ohne den knappen griechischen Satz zu paraphrasieren oder eine nicht markierte Wahrscheinlichkeit einzuführen.
