  yaml_path: translation/deuterocanon/4_maccabees/003/015.yaml
  text: And even while burning with thirst[b][a], he reasoned that it would be an utterly dreadful danger to the soul if the drink were regarded as equivalent to blood.
translation:
  language: de
  text: Doch auch als er vor Durst brannte, gelangte er zu dem Schluss, dass es eine überaus schreckliche Gefahr für die Seele wäre, wenn das Getränk als dem Blut gleichwertig angesehen würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im erzählerischen Zusammenhang wird das Getränk wegen des für seine Beschaffung vergossenen Blutes als Blut gleichwertig angesehen.
    reason: cultural_note
lexical_decisions:
- source_word: διαπυρούμενος
  choice: wie im Feuer brannte
  rationale: Bewahrt das intensive Feuerbild des griechischen Partizips und klingt zusammen mit „vor Durst“ im modernen Deutschen natürlich.
- source_word: δίψαν
  choice: vor Durst
  rationale: Gibt den Bezug des Feuerbildes auf den heftigen Durst klar und idiomatisch wieder.
- source_word: ἐλογίσατο
  choice: kam er zu dem Schluss
  rationale: Drückt eine bewusste vernünftige Abwägung aus, die für den Gedankengang des 4. Makkabäerbuches wichtig ist.
- source_word: πάνδεινον
  choice: überaus schreckliche
  rationale: Gibt die starke Steigerung des griechischen Kompositums in natürlichem, würdigem Deutsch wieder.
- source_word: κίνδυνον
  choice: Gefahr
  rationale: Direkte und idiomatische Entsprechung des griechischen Substantivs.
- source_word: τῇ ψυχῇ
  choice: für die Seele
  rationale: Bewahrt den moralisch-inneren Bezug von ψυχή, ohne den Ausdruck dogmatisch enger festzulegen.
- source_word: λογισθὲν
  choice: wenn man … gleichsetzte
  rationale: Die unpersönliche Form gibt den passiven Gedanken des Erwägens beziehungsweise Wertens flüssig wieder.
- source_word: ἰσοδύναμον
  choice: gleichsetzte
  rationale: Vermittelt die Gleichwertigkeit oder gleiche Bedeutung, die das griechische Adjektiv bezeichnet.
- source_word: τὸ ποτόν
  choice: das Getränk
  rationale: Sachliche Wiedergabe des bestimmten Getränks, auf das im Zusammenhang Bezug genommen wird.
- source_word: αἵματι
  choice: dem Blut
  rationale: Bewahrt den ausdrücklichen Vergleich mit Blut.
theological_decisions:
- issue: Bedeutung von ψυχή im moralischen Mahnzusammenhang
  choice: Seele
  alternative: Leben
  rationale: Der Satz beschreibt eine ethisch-geistige Gefährdung und nicht bloß eine Bedrohung des körperlichen Lebens; „Seele“ bewahrt zugleich die mögliche Bedeutungsweite.
- issue: Sinn der Schlusswendung über Getränk und Blut
  choice: wenn man das Getränk dem Blut gleichsetzte
  alternative: wenn das Getränk als dem Blut gleichwertig angesehen würde
  rationale: Die griechische Konstruktion ist knapp. Die gewählte Fassung erhält den ausdrücklichen Vergleich, ohne die im Hintergrund stehende Blutvorschrift im Haupttext auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Feuerbild des Originals bleibt erhalten; die gedanklich verdichtete Schlusswendung wird lesbar formuliert, ohne ihre sachliche Spannung aufzulösen.
