  text: But the king[a], though very thirsty, even though he had abundant springs, was not able through them to relieve his thirst.
translation:
  language: de
  text: Der König aber war überaus durstig; obwohl er reichlich Quellen hatte, konnte er seinen Durst durch sie nicht heilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder natürlicher: »seinen Durst stillen«. Das griechische Verb bedeutet gewöhnlich »heilen« oder »kurieren«; hier wird es auf den Durst angewandt und kann so ein medizinisches Bild hervorrufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: Doch der König
  rationale: δέ stellt hier einen leichten Gegensatz zum vorausgehenden Zusammenhang her; »Doch« gibt ihn im Deutschen knapp und natürlich wieder.
- source_word: ὡς μάλιστα διψῶν
  choice: obwohl er überaus durstig war
  rationale: ὡς μάλιστα verstärkt das Partizip διψῶν erheblich. »Überaus durstig« wahrt diese Intensität in gehobenem, aber verständlichem Deutsch.
- source_word: καίπερ ἀφθόνους ἔχων πηγάς
  choice: obwohl er … reichlich Quellen hatte
  rationale: καίπερ bezeichnet eine Einräumung; ἀφθόνους gibt die große, uneingeschränkte Menge an. Die konkrete Bildsprache der πηγαί bleibt mit »Quellen« erhalten.
- source_word: οὐκ ἠδύνατο διʼ αὐτῶν
  choice: konnte … durch sie nicht
  rationale: Die Formulierung bewahrt sowohl die Unfähigkeit als auch den instrumentalen Sinn von διά; »sie« verweist eindeutig auf die Quellen zurück.
- source_word: ἰάσασθαι τὴν δίψαν
  choice: seinen Durst … heilen
  rationale: ἰάομαι bedeutet gewöhnlich »heilen« oder »kurieren«. Die bewusst auffällige Formulierung erhält das medizinische Bild des Griechischen, während die Fußnote die idiomatische Alternative nennt.
theological_decisions: []
