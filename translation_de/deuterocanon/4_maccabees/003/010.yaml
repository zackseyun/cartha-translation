  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist trotz der doppelten Einräumung gut verständlich; das ungewöhnliche »den Durst heilen« wurde als wahrscheinlich beabsichtigtes medizinisches Bild des griechischen Textes beibehalten.
