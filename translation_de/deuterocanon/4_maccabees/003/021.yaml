  yaml_path: translation/deuterocanon/4_maccabees/003/021.yaml
  text: Then indeed some[a], having stirred up revolt against the common harmony[b], made use of calamities in many ways.
translation:
  language: de
  text: Damals nun lehnten sich einige gegen die gemeinsame Eintracht auf[a] und machten sich die Unglücksfälle auf vielfältige Weise zunutze.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zettelten gegen die gemeinsame Eintracht einen Aufruhr an«. Das griechische Verb kann einen stärkeren politischen Sinn haben und eine revolutionäre Erhebung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »gebrauchten die Unglücksfälle auf vielfältige Weise«; gemeint sein kann, dass sie die Notlagen ausnutzten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  choice: Damals nun
  rationale: Gibt sowohl den zeitlichen Übergang als auch die leichte Hervorhebung durch δή in natürlichem Deutsch wieder.
- source_word: τινες
  choice: einige
  rationale: Bewahrt die unbestimmte Personenangabe knapp und idiomatisch.
- source_word: πρὸς τὴν κοινὴν ... ὁμόνοιαν
  choice: gegen die gemeinsame Eintracht
  rationale: Im Zusammenhang mit νεωτερίσαντες hat πρός gegensätzliche Bedeutung; »Eintracht« bezeichnet den gemeinschaftlichen Zusammenhalt ohne unnötige politische Präzisierung.
- source_word: νεωτερίσαντες
  choice: lehnten sich ... auf
  rationale: Das Verb kann eine politische oder gesellschaftliche Auflehnung bezeichnen. Die Formulierung ist verständlich und wahrt die Stärke des Ausdrucks, ohne zwingend einen organisierten Umsturz zu behaupten.
- source_word: πολυτρόπως
  choice: auf vielfältige Weise
  rationale: Gibt die Mehrzahl der Vorgehensweisen in würdigem, natürlichem Deutsch wieder.
- source_word: ἐχρήσαντο συμφοραῖς
  choice: machten sich das Unglück ... zunutze
  rationale: χράομαι mit Dativ bedeutet »gebrauchen/nutzen«; die deutsche Wendung bringt den hier naheliegenden opportunistischen Gebrauch der widrigen Ereignisse idiomatisch zum Ausdruck. Der kollektive Singular »Unglück« kann συμφοραί als Not- und Unglückslage bündeln.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Damals nun« hält den erzählerischen Übergang knapp; »gemeinsame Eintracht« bewahrt den gemeinschaftlich-sozialen Sinn. Die Fußnoten lassen sowohl die politische Stärke von νεωτερίζω als auch die etwas ungewöhnliche Konstruktion mit συμφοραί erkennen.
