  text: And after escaping the notice of the gate guards[a], they kept going through, having made their way through the whole camp of the enemy.
translation:
  language: de
  text: Und ohne von den Wachen an den Toren bemerkt zu werden, zogen sie hindurch, nachdem sie einen Weg durch das ganze Lager der Feinde gefunden hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz ist am Ende stark verkürzt. Wörtlich steht dort nur „gefunden habend“; wahrscheinlich ist gemeint, dass sie einen Weg durch das gesamte feindliche Lager fanden und dort hindurchzogen.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαθόντες
  choice: ohne … bemerkt zu werden
  rationale: Das Aoristpartizip von λανθάνω mit Akkusativ bezeichnet, dass die Handelnden den genannten Personen unbemerkt bleiben. Die deutsche Formulierung gibt dies natürlich und präzise wieder.
- source_word: τοὺς τῶν πυλῶν ἀκροφύλακας
  choice: die Wachen an den Toren
  rationale: Die Genitivverbindung bezeichnet die an den Toren eingesetzten Wächter. „Wachen an den Toren“ ist im heutigen Deutsch klar und bewahrt den militärischen Sinn.
- source_word: διεξῄεσαν
  choice: zogen sie hindurch
  rationale: Das Imperfekt beschreibt den fortschreitenden Vorgang, während das zusammengesetzte Verb eine Bewegung durch einen Bereich hindurch bezeichnet.
- source_word: εὑράμενοι
  choice: nachdem sie einen Weg … gefunden hatten
  rationale: Das Partizip bedeutet wörtlich „gefunden habend“, doch sein Bezugsobjekt bleibt im knappen griechischen Satz unausgesprochen. „einen Weg gefunden“ macht die im Zusammenhang naheliegende Ergänzung kenntlich, ohne sie als ausdrücklich im Text stehend auszugeben.
- source_word: κατὰ πᾶν τὸ τῶν πολεμίων στρατόπεδον
  choice: durch das ganze Lager der Feinde
  rationale: στρατόπεδον bezeichnet das Heerlager; der substantivierte Genitiv τῶν πολεμίων bedeutet „der Feinde“. κατὰ mit Akkusativ wird hier räumlich auf die gesamte Ausdehnung des Lagers bezogen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederaufnahme von „hindurch“ und „durch“ spiegelt die gedrängte Bewegungsbeschreibung des Griechischen; die Fußnote weist transparent auf das im Ausgangstext unausgesprochene Objekt von εὑράμενοι hin.
