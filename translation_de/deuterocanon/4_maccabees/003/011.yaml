  text: But some irrational desire for the water among the enemies[a], tightening itself upon him, shriveled him, and while loosening him[b], burned him up.
translation:
  language: de
  text: Doch ein vernunftwidriges Verlangen nach dem Wasser bei den Feinden[a], das ihn bis zum Äußersten anspannte, dörrte ihn aus und verbrannte ihn, während es ihn erschlaffen ließ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem Wasser im Lager der Feinde“. Die griechische Wendung bezeichnet wörtlich das Wasser „bei“ oder „unter den Feinden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Bild ist stark verdichtet: Das Verlangen wird wie eine handelnde Macht dargestellt, die ihn sowohl anspannt als auch erschlaffen lässt und ihn dabei austrocknet und verbrennt. Gemeint sind die widersprüchlich erscheinenden körperlichen Wirkungen heftigen Durstes.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorausgehenden Gedankengang in natürlichem, gehobenem Deutsch.
- source_word: τις ἀλόγιστος ἐπιθυμία
  choice: ein vernunftwidriges Verlangen
  rationale: Der unbestimmte Artikel gibt τις im Deutschen idiomatisch wieder. „Vernunftwidrig“ bewahrt den für 4 Makkabäer wichtigen Gegensatz zwischen Vernunft und Leidenschaft, ohne bloß allgemeine Unbesonnenheit auszudrücken.
- source_word: τοῦ παρὰ τοῖς πολεμίοις ὕδατος
  choice: nach dem Wasser bei den Feinden
  rationale: „Nach“ entspricht dem von ἐπιθυμία abhängigen Genitiv; „bei den Feinden“ wahrt die räumlich beziehungsweise zuordnend offene Formulierung mit παρά und dem Plural πολεμίοις.
- source_word: ἐπιτείνουσα
  choice: spannte ihn bis zum Äußersten an
  rationale: Gibt das Bild des Spannens und die verstärkende Bedeutung des Verbs wieder; das ausdrückliche Objekt αὐτόν bleibt erhalten.
- source_word: συνέφρυγε
  choice: ließ ihn verdorren
  rationale: Bezeichnet das Austrocknen oder Einschrumpfen und passt zum körperlichen Bild heftigen Durstes.
- source_word: λύουσα
  choice: löste es ihn
  rationale: Die bewusst ungeglättete Wiedergabe bewahrt das Gegenbild zum Anspannen und die auffällige Verdichtung des Griechischen.
- source_word: κατέφλεγεν
  choice: verbrannte ihn völlig
  rationale: Das verstärkte Verb bezeichnet verzehrendes Brennen; „völlig“ bringt die Intensivierung durch die Vorsilbe κατά zum Ausdruck.
theological_decisions:
- issue: Gegensatz zwischen Vernunft und Leidenschaft
  choice: ἀλόγιστος als „vernunftwidrig“
  alternative: „unvernünftig“ oder „sinnlos“
  rationale: „Vernunftwidrig“ hält den philosophischen Leitgegensatz des Buches erkennbar, ohne eine konfessionelle Deutung einzutragen.
- issue: Paradoxe Wirkung des Verlangens
  choice: Anspannen und Lösen beide ausdrücklich beibehalten
  alternative: λύουσα deutend als „schwächte ihn“ wiedergeben
  rationale: Der griechische Text stellt gegensätzliche körperliche Wirkungen nebeneinander. Diese Spannung wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildfolge bleibt bewusst spürbar; die Fußnoten erläutern die räumliche Mehrdeutigkeit und das paradoxe Körperbild, ohne sie im Haupttext einzuebnen.
