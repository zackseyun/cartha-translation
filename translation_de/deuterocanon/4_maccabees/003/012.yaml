revisions:
- from: Daher waren die Verteidiger über den Wunsch des Königs ungehalten. Doch zwei junge, standhafte Soldaten[a] nahmen sich den Wunsch des Königs zu Herzen[b], legten ihre volle Rüstung an, nahmen einen Krug[c] und überwanden die Verschanzungen der Feinde.
  to: 'Darum: Während die Verteidiger über den Wunsch des Königs ungehalten waren, rüsteten sich zwei junge, standhafte Soldaten[a], vom Wunsch des Königs beschämt[b], mit vollständiger Rüstung aus; sie nahmen einen Krug[c] und drangen über die Palisaden der Feinde hinweg.'
  rationale: Die Revision stellt bei καταιδεσθέντες das im griechischen Text enthaltene Scham- beziehungsweise Scheumoment wieder her, ohne durch die Fußnote eine einzige umstrittene Nuance festzulegen. Ferner wird ὑπερέβησαν mit einer räumlichen Bewegungsformulierung und χάρακες als „Palisaden“ präziser abgebildet. Die Satzfügung behält das gleichzeitig verlaufende Partizipialgefüge und den Folgezusammenhang von ὅθεν bei.
