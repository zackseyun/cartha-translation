  verdict: revise
  source_fidelity: Die Grundhandlung und die militärischen Begriffe sind überwiegend zutreffend wiedergegeben. Die Wiedergabe von καταιδεσθέντες als „nahmen sich … zu Herzen“ ist jedoch zu unverbindlich und gibt das ausdrücklich vorhandene Moment von Scham/Scheu nicht wieder. Zudem bezeichnet ὑπερέβησαν das Hinüber- bzw. Darübergelangen, was „überwanden“ weniger präzise ausdrückt.
  naturalness: Der Text ist im Allgemeinen modernes, verständliches Standarddeutsch. „vom Wunsch des Königs beschämt“ ist trotz der im Deutschen ungewohnten Gedankenverbindung die quellennahe und klare Wiedergabe; die Fußnote erläutert die semantische Offenheit. „über die Palisaden ... hinweg“ macht die räumliche Bewegung idiomatisch deutlich.
  terminology: „Verteidiger“, „Wunsch“, „standhafte Soldaten“ und „Krug“ sind angemessen. „Palisaden“ ist für χάρακες als feindliche Feldbefestigung genauer als das allgemeinere „Verschanzungen“. Für τὰς πανοπλίας καθωπλίσαντο ist „rüsteten sich mit vollständiger Rüstung aus“ treffend.
