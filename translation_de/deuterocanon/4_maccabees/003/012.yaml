translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die lange griechische Satzperiode wird in zwei Sätze gegliedert. Das adversative „Doch“ macht den im griechischen Partizipialgefüge angelegten Gegensatz zwischen dem Unmut der Verteidiger und dem Handeln der beiden Soldaten verständlich, ohne einen neuen Sachgehalt einzuführen.
