  yaml_path: translation/deuterocanon/4_maccabees/003/012.yaml
  text: Therefore, while the defenders were indignant at the king’s desire, two young soldiers, steadfast men, ashamed by the king’s desire, armed themselves with full armor, and, taking a water jar, went over the enemy stockades.
translation:
  language: de
  text: 'Darum: Während die Verteidiger über den Wunsch des Königs ungehalten waren, rüsteten sich zwei junge, standhafte Soldaten[a], vom Wunsch des Königs beschämt[b], mit vollständiger Rüstung aus; sie nahmen einen Krug[c] und drangen über die Palisaden der Feinde hinweg.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lässt sich die Wortgruppe auch wiedergeben: „zwei junge Männer, standhafte Soldaten“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann ein von Scheu, Achtung oder Scham bestimmtes Reagieren meinen. Möglich sind auch Wiedergaben wie „aus Scheu vor dem Wunsch des Königs“ oder „von Scham über den Wunsch des Königs bewegt“.
    reason: alternative_reading
  - marker: c
    text: Das griechische Wort bezeichnet einen Krug oder ein ähnliches Gefäß, im Zusammenhang wahrscheinlich für Wasser.
    reason: cultural_note
lexical_decisions:
- source_word: ὅθεν
  choice: Daher
  rationale: Kennzeichnet eine Folgerung aus dem vorhergehenden Geschehen und wahrt den erzählerischen Anschluss.
- source_word: ὑπερασπιστῶν
  choice: Verteidiger
  rationale: Bezeichnet Personen, die jemanden schützen oder für ihn eintreten; die allgemein-militärische Wiedergabe vermeidet die nicht gesicherte Festlegung auf Leibwächter.
- source_word: σχετλιάζόντων
  choice: waren … ungehalten
  rationale: Gibt den deutlichen Unmut wieder, ohne die Intensität unnötig bis zu Empörung oder Entrüstung zu steigern.
- source_word: ἐπιθυμία
  choice: Wunsch
  rationale: Im Erzählzusammenhang bezeichnet das Wort das Verlangen des Königs; „Wunsch“ klingt im Deutschen natürlich und legt dessen moralische Bewertung nicht vorab fest.
- source_word: δύο νεανίσκοι στρατιῶται καρτεροί
  choice: zwei junge, standhafte Soldaten
  rationale: Verbindet die eng zusammengehörigen Bezeichnungen natürlich; καρτεροί betont Festigkeit, Ausdauer und Entschlossenheit.
- source_word: καταιδεσθέντες
  choice: nahmen sich … zu Herzen
  rationale: Das Partizip kann ein von Scheu, Achtung oder Scham geprägtes Reagieren bezeichnen. Die Formulierung gibt den handlungsauslösenden inneren Anstoß wieder, ohne eindeutig Scham über den Wunsch oder Ehrfurcht vor ihm festzulegen.
- source_word: τὰς πανοπλίας καθωπλίσαντο
  choice: legten ihre volle Rüstung an
  rationale: Gibt sowohl die vollständige militärische Ausrüstung als auch das eigenhändige Anlegen idiomatisch wieder.
- source_word: κάλπιν
  choice: einen Krug
  rationale: κάλπις bezeichnet einen Krug oder ein ähnliches Gefäß; dass er hier wohl für Wasser bestimmt war, ergibt sich aus dem Zusammenhang, steht aber nicht ausdrücklich im Vers.
- source_word: ὑπερέβησαν τοὺς τῶν πολεμίων χάρακας
  choice: überwanden die Verschanzungen der Feinde
  rationale: ὑπερέβησαν bezeichnet das Hinüber- oder Darübergelangen; χάρακες sind militärische Sperren beziehungsweise Befestigungen, etwa Palisaden oder Schanzwerke.
