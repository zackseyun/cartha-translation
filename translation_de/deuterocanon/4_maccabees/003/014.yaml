  text: And after courageously finding the spring[a], they filled the king’s drink from it.
translation:
  language: de
  text: Und nachdem sie mutig die Quelle gefunden hatten, füllten sie daraus für den König den Trank.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνευράμενοι
  choice: nachdem sie … gefunden hatten
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Füllen vorausgeht; der deutsche Temporalsatz gibt diese Abfolge klar und natürlich wieder.
- source_word: θαρραλέως
  choice: mutig
  rationale: Das Adverb bezeichnet ein von Mut und Kühnheit bestimmtes Handeln. „Mutig“ ist prägnant und im modernen Deutsch natürlich.
- source_word: τὴν πηγὴν
  choice: die Quelle
  rationale: πηγή bezeichnet hier eine natürliche Wasserquelle; „Quelle“ ist die direkte und kontextgerechte deutsche Entsprechung.
- source_word: ἐξ αὐτῆς
  choice: daraus
  rationale: Das Pronomen verweist auf die Quelle zurück. „Daraus“ gibt Herkunft und Bezug im Deutschen knapp wieder.
- source_word: ἐγέμισαν
  choice: füllten
  rationale: Die einfache Vergangenheitsform entspricht dem griechischen Aorist und bewahrt die Grundbedeutung des Verbs.
- source_word: τῷ βασιλεῖ
  choice: für den König
  rationale: Der Dativ bezeichnet am natürlichsten den Empfänger beziehungsweise Begünstigten. Die wörtliche deutsche Dativkonstruktion „dem König“ wäre mit „den Trank füllen“ missverständlich.
- source_word: τὸ ποτόν
  choice: den Trank
  rationale: ποτόν bezeichnet das, was getrunken wird. „Trank“ bewahrt die substantivische und leicht gehobene Ausdrucksweise, ohne ein im Griechischen nicht genanntes Gefäß einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewohnte Verbindung „den Trank füllen“ wurde beibehalten, weil das Griechische ausdrücklich den Trank und kein Gefäß nennt; eine glättende Wiedergabe wie „schöpften“ würde die Bedeutung von ἐγέμισαν verändern.
