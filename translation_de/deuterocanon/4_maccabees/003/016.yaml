translation:
  language: de
  text: Darum stellte er der Begierde die Vernunft entgegen und goss das Getränk als Trankopfer für Gott aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Er goss das Getränk für Gott aus.“ Das griechische Verb bezeichnet das Ausgießen eines Trankopfers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Darum
  rationale: Leitet eine Folgerung aus dem vorausgehenden Gedankengang ein und stellt den logischen Anschluss knapp und natürlich her.
- source_word: ἀντιθεὶς
  choice: stellte … entgegen
  rationale: Das Aoristpartizip bezeichnet hier die bewusste Gegenüberstellung der Vernunft und der Begierde. Die finite deutsche Form mit anschließendem „und“ gibt den Handlungsablauf idiomatisch wieder.
- source_word: τῇ ἐπιθυμίᾳ
  choice: der Begierde
  rationale: „Begierde“ bewahrt die starke, triebhafte Färbung von ἐπιθυμία und passt zum philosophischen Gegensatz zur Vernunft.
- source_word: τὸν λογισμόν
  choice: die Vernunft
  rationale: λογισμός bezeichnet im 4. Makkabäerbuch die vernünftige Urteilskraft, die den Begierden beziehungsweise Leidenschaften entgegentritt. „Vernunft“ gibt diesen Leitbegriff prägnant wieder.
- source_word: ἔσπεισεν
  choice: goss … als Trankopfer … aus
  rationale: σπένδω bezeichnet ausdrücklich das Ausgießen einer Libation. Die Wiedergabe macht diesen kultischen Sinn für heutige Leser erkennbar.
- source_word: τὸ πόμα
  choice: das Getränk
  rationale: Das Substantiv bedeutet wörtlich „Getränk“; der Opfercharakter liegt im Verb und wird daher durch „als Trankopfer … ausgießen“ ausgedrückt.
- source_word: τῷ θεῷ
  choice: für Gott
  rationale: Der Dativ bezeichnet hier den Empfänger beziehungsweise denjenigen, dem die kultische Handlung gilt. „Für Gott“ ist in Verbindung mit „Trankopfer“ natürliches Deutsch.
theological_decisions:
- issue: Kultische Bedeutung von σπένδω in Verbindung mit τὸ πόμα
  choice: Die Handlung wird ausdrücklich als Ausgießen eines Trankopfers für Gott wiedergegeben.
  alternative: 'Wörtlicher und knapper: „Er goss das Getränk für Gott aus.“'
  rationale: Das griechische Verb trägt selbst die Bedeutung des kultischen Trankopfers. Diese Nuance ausdrücklich zu benennen, verdeutlicht die religiöse Handlung, ohne dem Text eine zusätzliche theologische Deutung aufzuerlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die philosophische Gegenüberstellung von Begierde und Vernunft bleibt klar erhalten; die kultische Bedeutung des Verbs wird im Haupttext verständlich ausgedrückt.
