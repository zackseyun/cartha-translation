  yaml_path: translation/deuterocanon/4_maccabees/003/004.yaml
  text: Reason cannot cut off any one of your evil tendencies[c][b][a], but it is able to join in helping you not to bend to that evil tendency.
translation:
  language: de
  text: Eine böse Neigung[a] kann keiner von euch ausmerzen[b]; doch die Vernunft kann euch darin beistehen, euch von dieser bösen Neigung nicht beugen zu lassen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bösartigkeit“, „Bosheit“ oder „üble Gesinnung“. Das griechische Wort bezeichnet eine schlechte moralische Verfassung, nicht nur eine einzelne böse Tat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „herausschneiden“ oder „abhauen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „nicht von der bösen Neigung gebeugt zu werden“, das heißt, ihr nicht nachzugeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακοήθειαν / τῇ κακοηθείᾳ
  choice: eine böse Neigung / von dieser bösen Neigung
  rationale: Das Wort bezeichnet eine schlechte sittliche Verfassung, Bösartigkeit oder einen üblen Charakterzug, nicht bloß eine einzelne böse Tat. „Böse Neigung“ gibt den inneren moralischen Hang wieder und erlaubt zugleich die anaphorische Wiederaufnahme durch den griechischen Artikel.
- source_word: τις ὑμῶν
  choice: keiner von euch
  rationale: 'τις ist hier substantivisch und ὑμῶν partitiv: „jemand von euch“. Zusammen mit der Verneinung ergibt sich im Deutschen idiomatisch „keiner von euch“. Die Wendung bestimmt nicht κακοήθειαν näher; diese steht im Akkusativ als Objekt von ἐκκόψαι.'
- source_word: οὐ δύναται ἐκκόψαι
  choice: kann … nicht ausmerzen
  rationale: ἐκκόπτω bedeutet wörtlich „herausschneiden/abhauen“ und übertragen „beseitigen“. „Ausmerzen“ bewahrt die energische Tilgungsmetaphorik in natürlichem Deutsch.
- source_word: τὸ μὴ καμφθῆναι
  choice: sich nicht beugen zu lassen
  rationale: Der passive Infinitiv bedeutet wörtlich „nicht gebeugt zu werden“. Die reflexiv-passive deutsche Form bewahrt das Bild des Beugens und vermittelt zugleich den moralischen Sinn des Nichtnachgebens.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: λογισμός ist in 4 Makkabäer ein Leitbegriff für vernünftiges moralisches Urteilen. „Die Vernunft“ ist im Deutschen klar und programmatisch, ohne daraus einen Eigennamen zu machen.
- source_word: συμμαχῆσαι
  choice: beistehen
  rationale: Das Verb bezeichnet ursprünglich das Mitkämpfen als Verbündeter und dann allgemein hilfreichen Beistand. „Beistehen“ erhält den Gedanken unterstützender, nicht allein bewirkender Hilfe, ohne das unmittelbare Deutsch unnötig zu militarisieren.
theological_decisions:
- issue: Vermögen der Vernunft gegenüber einer bösen Neigung
  choice: Die Vernunft kann die böse Neigung nicht ausmerzen, aber beim Widerstand gegen sie beistehen.
  alternative: Die Vernunft könne das Böse entweder völlig beseitigen oder lediglich passiv erkennen.
  rationale: Der griechische Gegensatz zwischen ἐκκόψαι und μὴ καμφθῆναι sowie das Verb συμμαχῆσαι schreibt der Vernunft echte, aber begrenzte moralische Wirksamkeit zu. Die Spannung wird nicht durch spätere anthropologische Lehrsysteme aufgelöst.
- issue: Bezug von τις ὑμῶν
  choice: „Keiner von euch“ ist das Subjekt.
  alternative: „Irgendeine eurer bösen Neigungen“ als Objektgruppe.
  rationale: Morphologisch ist κακοήθειαν Akkusativ Singular, während τις Nominativ Singular und ὑμῶν ein partitiver Genitiv ist. Daher ist „jemand/keiner von euch“ die quellennahe Analyse; die alternative englische Zuordnung verwischt die Kasussyntax.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ausmerzen“ bewahrt die kräftige Tilgungsmetapher, „beistehen“ die verbündete Hilfe, und „sich nicht beugen lassen“ das griechische Widerstandsbild. Das ergänzte „euch“ macht den im Kontext naheliegenden Bezug auf die Angeredeten im Deutschen verständlich.
