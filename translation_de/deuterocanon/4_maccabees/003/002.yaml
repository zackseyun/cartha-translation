base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/002.yaml
  text: For example[a], reason cannot cut off any one of your desires, but reason can make it possible not to be enslaved to desire.
translation:
  language: de
  text: Zum Beispiel kann niemand von euch ein Verlangen beseitigen; doch die Vernunft kann es ermöglichen, dem Verlangen nicht versklavt zu werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder etwas wörtlicher: »Doch die Vernunft kann dazu verhelfen, dass man dem Verlangen nicht versklavt wird.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷον
  choice: Zum Beispiel
  rationale: Leitet einen veranschaulichenden Fall ein und gibt die exemplifizierende Funktion idiomatisch wieder.
- source_word: ἐπιθυμίαν
  choice: ein Verlangen
  rationale: Bewahrt den griechischen Singular und den allgemeinen Sinn, ohne ihn als besonders heftige Begierde zu überzeichnen.
- source_word: ἐκκόψαι
  choice: ausmerzen
  rationale: Gibt die starke, bildhafte Vorstellung des vollständigen Beseitigens natürlich wieder.
- source_word: δουλωθῆναι
  choice: sich … versklaven lässt
  rationale: Bewahrt die ausdrückliche Sklavereimetapher des passiven Verbs und formuliert zugleich verständlich, dass das Verlangen die versklavende Macht ist.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: Bezeichnet hier im philosophischen Sprachgebrauch des 4. Makkabäerbuchs das vernünftige Urteils- und Steuerungsvermögen.
- source_word: παρασχέσθαι
  choice: kann bewirken
  rationale: Gibt wieder, dass die Vernunft den Zustand beziehungsweise die Möglichkeit bereitstellen kann, dem Verlangen nicht versklavt zu werden.
theological_decisions:
- issue: Anthropologische Aussage über Vernunft und Verlangen
  choice: Der Mensch kann das Verlangen nicht ausmerzen; die Vernunft kann jedoch bewirken, dass er ihm nicht versklavt wird.
  alternative: Die Vernunft kann kein Verlangen beseitigen, aber sie kann die Unterwerfung unter das Verlangen verhindern.
  rationale: Der griechische Satz unterscheidet zwischen der Beseitigung eines Verlangens und der Vermeidung seiner Herrschaft. Die Übersetzung erhält diese Spannung, ohne zu behaupten, die Vernunft unterdrücke oder vernichte das Verlangen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit philosophischem Grundton. »Vernunft« und »Verlangen« werden als zentrale Begriffe klar und konsequent wiedergegeben; die Sklavereimetapher bleibt erhalten.
