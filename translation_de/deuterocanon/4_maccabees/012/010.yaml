lexical_decisions:
- source_word: δραμὼν
  choice: er lief … heran
  rationale: Das aoristische Partizip bezeichnet eine rasche Bewegung, die der Redeeinleitung vorausgeht. Die finite deutsche Form mit anschließendem „und sagte“ bewahrt den lebendigen Erzählfluss.
- source_word: ἐπὶ πλησίον
  choice: ganz nah an … heran
  rationale: Die Wendung verbindet Bewegung mit unmittelbarer Nähe. „Ganz nah an … heran“ gibt sowohl die Richtung als auch die erreichte Nähe in natürlichem Deutsch wieder.
- source_word: τῶν τηγάνων
  choice: die Bratpfannen
  rationale: τήγανα bezeichnet Pfannen beziehungsweise Bratpfannen; im Zusammenhang dienen die erhitzten Geräte als Folterinstrumente. „Bratpfannen“ ist die direkte und verständliche Entsprechung.
- source_word: ἔφη
  choice: sagte
  rationale: Die übliche Redeeinleitung wird im Deutschen am natürlichsten mit „sagte“ wiedergegeben.
