  text: 'Und er lief dicht an die Bratpfannen[a][b] heran und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahe an die Pfannen“ beziehungsweise „dicht an die Bratpfannen heran“. Die griechische Wendung ἐπὶ πλησίον verbindet Bewegung und Nähe.'
    reason: lexical_alternative
