base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/018.yaml
  text: But I call upon the God of my fathers[b][a], that he may be merciful to my nation.
translation:
  language: de
  text: Doch ich rufe den Gott meiner Vorfahren[a] an, damit er meinem Volk[b] gnädig sei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Gott meiner Väter“; auch: „den angestammten Gott“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann je nach Zusammenhang auch „Geschlecht“, „Abstammungsgemeinschaft“ oder „Sippe“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλοῦμαι
  choice: ich rufe … an
  rationale: Das Verb bezeichnet hier den eindringlichen, betenden Anruf Gottes. „Anrufen“ ist im Deutschen natürlich und wahrt den religiösen Sinn, ohne den stärker kultisch klingenden Ausdruck „beschwören“ zu verwenden.
- source_word: πατρῷον θεόν
  choice: den Gott meiner Vorfahren
  rationale: πατρῷος bezeichnet das von den Vätern beziehungsweise Vorfahren Überlieferte oder zu ihnen Gehörende. „Der Gott meiner Vorfahren“ gibt den geschichtlich-gemeinschaftlichen Bezug klar und in heutigem Deutsch wieder.
- source_word: ὅπως
  choice: damit
  rationale: Die Konjunktion leitet das Ziel beziehungsweise den Inhalt des Gebets ein. „Damit“ bildet diesen Zusammenhang im Deutschen knapp und natürlich ab.
- source_word: ἐλέως γένηται
  choice: gnädig sei
  rationale: Die Verbindung aus prädikativem ἐλέως und γένηται bittet darum, dass Gott sich gnädig beziehungsweise barmherzig erweise. „Gnädig sei“ bewahrt die Gebetsform und vermeidet die missverständliche Vorstellung, Gottes Wesen müsse sich erst verändern.
- source_word: τῷ γένει μου
  choice: meinem Volk
  rationale: γένος kann Abstammung, Verwandtschaft, Geschlecht oder Volk bezeichnen. Im Zusammenhang der gemeinschaftlichen Verfolgung ist das jüdische Volk gemeint; „Volk“ ist im modernen Deutschen klarer und weniger missverständlich als „Rasse“ oder „Geschlecht“.
theological_decisions:
- issue: Reichweite von τῷ γένει μου
  choice: meinem Volk
  alternative: meiner Sippe / meinem Geschlecht / meinen Stammesgenossen
  rationale: Der Kontext spricht für die umfassende Solidarität mit dem jüdischen Volk, doch die Fußnote hält die im griechischen Wort vorhandene Abstammungs- und Verwandtschaftsnuance offen.
- issue: Wiedergabe von πατρῷον θεόν
  choice: den Gott meiner Vorfahren
  alternative: den angestammten Gott / den Gott meiner Väter
  rationale: Die gewählte Formulierung bewahrt den Bezug auf die vorangegangenen Generationen, ohne ein bestimmtes konfessionelles Verständnis des Bundesverhältnisses zusätzlich in den Text einzutragen.
- issue: Aussage von ἐλέως γένηται
  choice: gnädig sei
  alternative: sich barmherzig erweise / barmherzig werde
  rationale: „Gnädig sei“ gibt die Bitte idiomatisch wieder und unterstellt nicht, dass Gott zuvor unbarmherzig gewesen sei; die Alternative „sich barmherzig erweise“ macht denselben Sinn ausdrücklicher.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt nah am griechischen Gebet, während „meinem Volk gnädig sei“ gegenüber einer wörtlichen Formulierung wie „meinem Geschlecht barmherzig werde“ natürlich und verständlich klingt.
