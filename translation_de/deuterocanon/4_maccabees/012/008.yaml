  yaml_path: translation/deuterocanon/4_maccabees/012/008.yaml
  text: Release me[a], he says, so that I may tell the king and all his friends who are with him.
translation:
  language: de
  text: »Lass mich frei«, sagt er, »damit ich zum König und zu allen Freunden[a], die bei ihm sind, sprechen kann.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu allen Vertrauten, die bei ihm sind«. Das griechische Wort kann persönliche Freunde, aber auch königliche Vertraute oder Hofangehörige bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπόλυσόν με
  choice: Lass mich frei
  rationale: Der Aoristimperativ von ἀπολύω mit με ist eine unmittelbare Bitte, aus der Gewalt oder Fesselung entlassen zu werden. Die Formulierung ist natürlich und legt keine besondere rechtliche Freilassung nahe.
- source_word: φησίν
  choice: sagt er
  rationale: Das historische Präsens des griechischen Erzähltextes bleibt erhalten.
- source_word: εἴπω
  choice: sprechen kann
  rationale: Der Aoristkonjunktiv drückt hier nach dem Imperativ den Zweck aus. Mit den Dativobjekten bezeichnet εἴπω das Sprechen zu den genannten Personen; die Wiedergabe vermeidet, einen im Griechischen nicht genannten Mitteilungsinhalt vorauszusetzen.
- source_word: τῷ βασιλεῖ
  choice: zum König
  rationale: Der Dativ bezeichnet die Person, an die die Rede gerichtet ist.
- source_word: τοῖς σὺν αὐτῷ φίλοις πᾶσιν
  choice: zu allen seinen Freunden, die bei ihm sind
  rationale: Die Wiedergabe bildet πᾶσιν, φίλοις und σὺν αὐτῷ ausdrücklich ab. φίλοι kann persönliche Freunde oder königliche Vertraute und Hofangehörige bezeichnen; »Freunde« wahrt die unmittelbare lexikalische Bedeutung.
