  yaml_path: translation/deuterocanon/4_maccabees/012/001.yaml
  text: And as he too died blessedly, after being thrown into the cauldron, the seventh came forward, the youngest of all.
translation:
  language: de
  text: Als auch er, nachdem er in den Kessel geworfen worden war, selig starb, trat der siebte vor, der jüngste von allen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίως
  choice: selig
  rationale: Das Adverb bezeichnet den Tod als beneidenswert beziehungsweise gesegnet. Im Deutschen gibt „selig starb“ die adverbiale Aussage natürlich und würdig wieder, ohne bloß ein glückliches Gefühl auszudrücken.
- source_word: ἐναπέθανεν
  choice: starb
  rationale: Das Kompositum bezeichnet hier das Sterben unter den auferlegten Umständen; diese werden durch den vorausgehenden Partizipialsatz hinreichend ausgedrückt.
- source_word: καταβληθείς
  choice: nachdem er ... geworfen worden war
  rationale: Die passive Form und die zeitliche Abfolge werden ausdrücklich bewahrt; „geworfen“ vermittelt zudem die gewaltsame Handlung.
- source_word: λέβητα
  choice: Kessel
  rationale: λέβης bezeichnet ein größeres metallisches Gefäß beziehungsweise einen Kessel; „Kessel“ ist im Deutschen präzise und für den Folterkontext angemessen.
- source_word: παρεγίνετο
  choice: trat ... vor
  rationale: Im Erzählzusammenhang kommt nun der nächste Bruder zur Reihe und in die Szene; „trat vor“ gibt diese Bewegung knapp und natürlich wieder.
- source_word: ὁ πάντων νεώτερος
  choice: der jüngste von allen
  rationale: Die superlativische Wendung kennzeichnet den siebten Bruder als den Jüngsten der gesamten Gruppe.
theological_decisions:
- issue: Wiedergabe von μακαρίως im Kontext des Martyriums
  choice: selig starb
  alternative: glücklich starb; auf gesegnete Weise starb
  rationale: „Selig“ bewahrt die positive, ehrende Bewertung des Todes, ohne ihn lediglich als emotional glücklich zu beschreiben oder eine weitergehende dogmatische Aussage einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstellung folgt dem griechischen Erzählfluss, bleibt dabei aber im Deutschen gut verständlich.
