base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/002.yaml
  text: Whom the tyrant pitied[a], even though he had been cruelly mistreated by his brothers, seeing that he was already wearing the chains,
translation:
  language: de
  text: Mit ihm hatte der Tyrann Mitleid, obwohl dieser von seinen Brüdern grausam misshandelt worden war, als der Tyrann ihn bereits in Ketten sah,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατοικτειρήσας
  choice: hatte er Mitleid mit ihm
  rationale: Das Partizip bezeichnet Mitleid oder Erbarmen; die finite Wiedergabe macht im Deutschen den Bezug auf den Tyrannen und das Objekt klar.
- source_word: ὁ τύραννος
  choice: der Tyrann
  rationale: Die wertende Bezeichnung des verfolgenden Herrschers bleibt erhalten.
- source_word: καίπερ
  choice: obwohl
  rationale: Gibt die starke konzessive Beziehung natürlich wieder.
- source_word: δεινῶς
  choice: heftig
  rationale: Drückt die Intensität aus, ohne die Art der Misshandlung stärker festzulegen als der griechische Ausdruck.
- source_word: ὑπὸ τῶν ἀδελφῶν αὐτοῦ
  choice: dessen Brüder
  rationale: Das Possessivpronomen bezieht sich grammatisch am ehesten auf den Tyrannen; der Genitiv αὐτοῦ wird nicht stillschweigend auf den Gefesselten umgedeutet.
- source_word: κακισθείς
  choice: beschimpft hatten
  rationale: κακίζω kann hier ‚schmähen, beschimpfen‘ bedeuten; diese aktive deutsche Form bewahrt, dass der Tyrann von den Brüdern schlecht behandelt worden war.
- source_word: ὁρῶν
  choice: Als ... sah
  rationale: Das Partizip bezieht sich auf den Tyrannen und bezeichnet den wahrgenommenen Anlass seines Mitleids.
- source_word: ἤδη
  choice: bereits
  rationale: Bewahrt den zeitlichen Hinweis, dass die Fesselung schon eingetreten war.
- source_word: τὰ δεσμὰ περικείμενον
  choice: in Fesseln lag
  rationale: Gibt den Zustand wieder, dass die Fesseln um ihn gelegt waren, in natürlichem Deutsch.
theological_decisions:
- issue: Bezug von αὐτοῦ in ὑπὸ τῶν ἀδελφῶν αὐτοῦ
  choice: dessen Brüder, auf den Tyrannen bezogen
  alternative: seine Brüder, auf den Gefesselten bezogen
  rationale: Im griechischen Satz ist ὁ τύραννος das naheliegende Bezugswort; auch inhaltlich erklärt die Schmähung durch die älteren Brüder die konzessive Aussage über das Mitleid des Tyrannen. Die englische Konsultationsfassung scheint den Bezug anders zu setzen.
- issue: Bedeutung von κακισθείς
  choice: beschimpft
  alternative: misshandelt
  rationale: Im Kontext ist eine verbale Schmähung des Tyrannen durch die Brüder wahrscheinlich. ‚Misshandelt‘ würde leicht körperliche Gewalt nahelegen und die Rollen im Verfolgungsbericht verwischen.
- issue: Wertende Herrscherbezeichnung τύραννος
  choice: Tyrann
  alternative: Herrscher
  rationale: Die moralisch wertende Rhetorik des Ausgangstextes soll nicht neutralisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist im Griechischen ein weiterführender Satzteil und endet deshalb mit einem Komma. Die Syntax wurde zur Verständlichkeit temporal aufgelöst, ohne die Beziehungen der Partizipien einzuebnen.
