  text: And while urging these things[a], he sent for the boy’s mother, so that, having pity on her after she had been deprived of so many sons, he might persuade her to make the one remaining compliant for his deliverance.
translation:
  language: de
  text: Und während er dies eindringlich vorbrachte, ließ er die Mutter des Jungen rufen, um sie, die so vieler Söhne beraubt worden war, aus Mitleid dazu zu bewegen, den noch verbliebenen Sohn gefügig zu machen, damit er gerettet würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bezogen auf „Rettung“: „Heil“. Das griechische Wort kann Rettung oder Heil in einem weiteren Sinn bezeichnen; im vorliegenden Zusammenhang ist am ehesten die körperliche Rettung vor dem Tod gemeint.'
    reason: lexikalische Alternative und Bewahrung des weiteren Bedeutungsumfangs von σωτηρία
lexical_decisions:
- source_word: παρακαλῶν
  choice: eindringlich vorbrachte
  rationale: Das Partizip bezeichnet hier ein nachdrückliches verbales Drängen. Die Formulierung klingt im Deutschen natürlich und gibt weder eine zu freundliche Ermutigung noch eine förmliche Ermahnung wieder.
- source_word: μετεπέμψατο
  choice: ließ ... rufen
  rationale: Das Medium bedeutet, jemanden holen beziehungsweise zu sich rufen zu lassen. Diese Wiedergabe ist idiomatisch und legt den Grad des Zwangs nicht unnötig fest.
- source_word: ἐλεήσας
  choice: wollte er sich ihrer erbarmen
  rationale: Das Partizip nennt das ihm zugeschriebene Motiv. „Sich erbarmen“ bewahrt den Sinn von Mitleid beziehungsweise Erbarmen, ohne daraus eine ausdrücklich theologische Aussage zu machen.
- source_word: στερηθεῖσαν
  choice: so vieler Söhne beraubt worden war
  rationale: Die passive Form bezeichnet, dass ihr die Söhne genommen worden waren. „Beraubt“ erhält diesen passiven und gewaltsamen Unterton.
- source_word: παρορμήσειεν
  choice: sie dazu bewegen
  rationale: Das Verb beschreibt den Versuch, die Mutter zu einem bestimmten Handeln anzutreiben. „Dazu bewegen“ ist gegenwärtiges, natürliches Deutsch und lässt die nachdrückliche Einflussnahme erkennen.
- source_word: σωτηρίαν
  choice: damit er gerettet würde
  rationale: Im unmittelbaren Zusammenhang geht es um die Bewahrung des letzten Sohnes vor der Hinrichtung. Die verbale Formulierung gibt diesen Rettungssinn klar wieder, während die Fußnote den weiteren Bedeutungsumfang des griechischen Wortes festhält.
- source_word: εὐπειθῆ ποιῆσαι
  choice: gefügig zu machen
  rationale: Die Wendung bedeutet, jemanden nachgiebig oder folgsam zu machen. „Gefügig“ passt zum Zwangskontext und vermeidet den positiven moralischen Klang von „gehorsam“.
- source_word: τὸν περιλειπόμενον
  choice: den noch verbliebenen Sohn
  rationale: Gemeint ist der einzige Sohn, der noch übrig ist. Die Ergänzung „Sohn“ ist aus dem Zusammenhang eindeutig und sorgt im Deutschen für Klarheit.
theological_decisions:
- issue: Bedeutung von σωτηρία im Zusammenhang des Martyriums
  choice: Rettung im Sinn der körperlichen Bewahrung vor der Hinrichtung
  alternative: Heil oder Rettung in einem weiteren, möglicherweise geistlichen Sinn
  rationale: Der unmittelbare Erzählzusammenhang handelt vom Versuch des Herrschers, den letzten Sohn durch dessen Nachgiebigkeit vor dem Tod zu bewahren. Der weitere Bedeutungsumfang bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die logischen Beziehungen und die zugeschriebenen Motive bleiben erhalten.
