base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/004.yaml
  text: You see the outcome of your brothers’ madness[a]; for because of disobedience they have been tortured and have died. But you, if you do not obey, will yourself also die before your time[c][b], after being miserably tortured.
translation:
  language: de
  text: 'Du siehst, wohin der Wahnsinn deiner Brüder geführt hat[a]: Wegen ihres Ungehorsams wurden sie gefoltert[b] und sind nun tot. Wenn du dich aber nicht überzeugen lässt[c], wirst auch du, nachdem du elend gefoltert worden bist, vorzeitig sterben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ende“, „der Ausgang“ oder „das Ergebnis des Wahnsinns deiner Brüder“.

      '
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann genauer das Strecken oder Verdrehen auf der Folterbank bezeichnen.
    reason: cultural_note
  - marker: c
    text: Im Zusammenhang bedeutet „sich überzeugen lassen“ praktisch, der Forderung nachzugeben oder zu gehorchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπονοίας
  choice: Wahnsinn
  rationale: Das Wort bezeichnet aus Sicht des Sprechers vernunftwidriges, verblendetes Verhalten. „Wahnsinn“ bewahrt die scharf abwertende Rhetorik der direkten Rede.
- source_word: τὸ τέλος
  choice: welches Ende ... genommen hat
  rationale: Die deutsche Wendung gibt sowohl das konkrete Ende als auch den Ausgang beziehungsweise das Ergebnis ihres Handelns wieder und bewahrt damit die Bedeutungsbreite von τέλος.
- source_word: ἀπείθειαν
  choice: Ungehorsam
  rationale: Gemeint ist die Weigerung der Brüder, der Forderung des Herrschers nachzukommen; „Ungehorsam“ gibt diese praktische Verweigerung knapp wieder.
- source_word: στρεβλωθέντες
  choice: wurden ... gefoltert
  rationale: Das Verb kann speziell das Strecken oder Verdrehen auf der Folterbank bezeichnen. Der Haupttext bleibt mit „gefoltert“ natürlich und legt das Folterinstrument nicht unnötig fest.
- source_word: τεθήκασιν
  choice: sind nun tot
  rationale: Das Perfekt bezeichnet hier idiomatisch den eingetretenen und fortbestehenden Todeszustand.
- source_word: πεισθείης
  choice: dich ... überzeugen lässt
  rationale: Dies entspricht der Grundbedeutung des Verbs und bewahrt die sprachliche Spannung zwischen Überzeugung und erzwungener praktischer Unterwerfung.
- source_word: ταλαί
  choice: elend
  rationale: Die seltene Form verstärkt in diesem Zusammenhang das qualvolle Schicksal und kann zugleich einen verächtlich-mitleidigen Ton tragen.
- source_word: βασανισθεὶς
  choice: nachdem du ... gefoltert worden bist
  rationale: Das Partizip bezeichnet die dem Tod vorausgehende schwere Folter; die temporale Wiedergabe macht die Abfolge im Deutschen klar.
- source_word: πρὸ ὥρας
  choice: vorzeitig
  rationale: Die Wendung bezeichnet einen Tod vor der gewöhnlichen oder erwarteten Zeit; „vorzeitig“ ist präzise und modernes Standarddeutsch.
theological_decisions:
- issue: Abwertende Bezeichnung der Haltung der Brüder
  choice: „Wahnsinn“ als Aussage des Sprechers beibehalten
  alternative: „Torheit“ oder „Unvernunft“
  rationale: Der Satz gibt die feindselige Einschätzung des Redenden wieder, nicht die Wertung des Erzählers. Die Übersetzung bewahrt diesen rhetorischen Konflikt, ohne die Aussage erzählerisch zu bestätigen.
- issue: Bedeutung von πεισθείης zwischen Überzeugung und Gehorsam
  choice: „wenn du dich ... nicht überzeugen lässt“
  alternative: „wenn du nicht gehorchst“
  rationale: 'Die formal nähere Wiedergabe erhält die echte Mehrdeutigkeit: Im Zwangskontext läuft das Sich-überzeugen-Lassen praktisch auf Nachgeben beziehungsweise Gehorsam hinaus.'
translation_notes:
  register: Moderne, würdige Standardsprache in direkter Rede. Die scharfe Drohung und die abwertende Sprache des Sprechers bleiben erhalten. Die Satzfolge wurde leicht geglättet; „nun“ verdeutlicht den im griechischen Perfekt ausgedrückten fortbestehenden Todeszustand.
