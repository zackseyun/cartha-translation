base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/013.yaml
  text: Were you not ashamed[a], though you are a man, most beastly one, to cut out the tongues of those who share the same sufferings and have come from the same elements, and after mutilating him in this way[b], to torture him?
translation:
  language: de
  text: Hast du dich nicht geschämt, obwohl du ein Mensch bist, du Bestie, Menschen, die dieselben Erfahrungen teilen und aus denselben Elementen hervorgegangen sind,[a] die Zungen herauszuschneiden und ihn, nachdem du ihn auf diese Weise verstümmelt hattest,[b] zu foltern?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dieselben Erfahrungen teilen“ kann auch „dieselben Empfindungen haben“ oder „derselben menschlichen Leidensfähigkeit unterworfen sein“ bedeuten. „Elemente“ gibt den griechischen philosophischen Ausdruck für die gemeinsame materielle Beschaffenheit der Menschen wieder.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Der griechische Text wechselt hier vom Plural („Menschen … die Zungen“) zum Singular („ihn“) und richtet den Blick damit wohl auf den gerade Gefolterten.
    reason: textual_clarity
lexical_decisions:
- source_word: οὐκ ᾐδέσθης
  choice: Hast du dich nicht geschämt
  rationale: Die rhetorische Frage bewahrt den scharfen moralischen Vorwurf des deponent gebrauchten Aorists von αἰδέομαι.
- source_word: ἄνθρωπος ὢν
  choice: obwohl du ein Mensch bist
  rationale: Die konzessive Wiedergabe macht den rhetorischen Gegensatz zwischen Menschlichkeit und tierischer Grausamkeit deutlich.
- source_word: θηριωδέστατε
  choice: du Bestialischster
  rationale: Der substantivierte Superlativ erhält die direkte Anrede und das Bild äußerster Tierähnlichkeit; die bewusst ungewöhnliche Form entspricht der zugespitzten Beschimpfung.
- source_word: τοὺς ὁμοιοπαθεῖς
  choice: denen, die denselben Leiden unterworfen sind
  rationale: Die Formulierung passt zum Folterkontext und lässt zugleich die Bedeutung gemeinsamer menschlicher Leidensfähigkeit erkennen.
- source_word: ἐκ τῶν αὐτῶν γεγονότας στοιχείων
  choice: aus denselben Grundstoffen hervorgegangen sind
  rationale: „Grundstoffe“ bewahrt den philosophisch-anthropologischen Sinn von στοιχεῖα und ist im modernen Deutschen verständlicher als das mehrdeutige „Elemente“.
- source_word: γλωττοτομῆσαι
  choice: die Zungen herauszuschneiden
  rationale: Der Ausdruck gibt die konkrete, gewaltsame Bedeutung des zusammengesetzten Verbs unmissverständlich wieder.
- source_word: καὶ τοῦτον καταικίσας τὸν τρόπον
  choice: und ihn, nachdem du ihn auf diese Weise verstümmelt hattest
  rationale: „Verstümmelt“ entspricht der körperlichen Misshandlung durch das Herausschneiden der Zunge; das Singularpronomen τοῦτον wird erhalten.
- source_word: βασανίσαι
  choice: zu foltern
  rationale: Im Märtyrerkontext bezeichnet das Verb schwere körperliche Tortur; „foltern“ ist die direkte deutsche Entsprechung.
theological_decisions:
- issue: Anthropologischer Gegensatz in ἄνθρωπος ὢν … θηριωδέστατε
  choice: Den Gegensatz ausdrücklich als „obwohl du ein Mensch bist, du Bestialischster“ wiedergeben.
  alternative: „obwohl du ein Mensch bist, du Grausamster“
  rationale: Die Tiermetaphorik trägt den Vorwurf, dass ein Mensch unmenschlich beziehungsweise tierischer als ein Tier handelt; sie sollte nicht zu bloßer Grausamkeit verflacht werden.
- issue: Bedeutung von στοιχεῖα für die menschliche Beschaffenheit
  choice: Mit „Grundstoffen“ übersetzen und den philosophischen Bezug in einer Fußnote erläutern.
  alternative: „Elementen“ oder „Bestandteilen“
  rationale: Der Text beruft sich auf die gemeinsame materielle Beschaffenheit der Menschen. „Grundstoffe“ erhält diese Vorstellung, ohne sie dogmatisch näher festzulegen.
- issue: Wechsel vom Plural τοὺς zum Singular τοῦτον
  choice: Den Numeruswechsel als „denen … die Zungen … und ihn“ erhalten.
  alternative: Den gesamten Satz in den Plural angleichen.
  rationale: Der griechische Text wechselt wahrscheinlich von der betroffenen Gruppe zum gerade gefolterten Einzelnen. Eine Glättung würde diese mögliche Fokussierung beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache mit scharfem rhetorischem Ton. Die ungewöhnliche Anrede „du Bestialischster“ ist bewusst markiert, um Superlativ, Vokativ und Tierbild des Griechischen zusammen zu bewahren. Beide Fußnotenmarker stehen unmittelbar an den erklärten Textstellen.
