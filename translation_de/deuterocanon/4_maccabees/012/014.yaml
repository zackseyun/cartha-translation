  text: But those who died nobly fulfilled their godliness toward God;[a]
translation:
  language: de
  text: Doch diejenigen, die ehrenvoll starben, brachten ihre Frömmigkeit gegenüber Gott zur Vollendung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Gottesverehrung zur Vollendung“.'
    reason: Lexikalische Alternative für εὐσέβεια.
lexical_decisions:
- source_word: ἀλλ᾽
  choice: Doch
  rationale: Kennzeichnet knapp und natürlich den Gegensatz zum vorausgehenden Zusammenhang.
- source_word: οἱ μὲν
  choice: diejenigen
  rationale: Gibt die substantivische Bezugnahme wieder; μέν deutet eine Gegenüberstellung an, die im Deutschen hier nicht eigens ausgedrückt werden muss.
- source_word: εὐγενῶς
  choice: in edler Haltung
  rationale: Bewahrt die positive moralische Wertung des Adverbs, ohne eine bestimmte Tugend wie Tapferkeit allein hervorzuheben.
- source_word: ἀποθανόντες
  choice: die … starben
  rationale: Der griechische Aoristpartizip wird in natürlichem Deutsch als Relativsatz wiedergegeben und bezeichnet den vollendeten Tod.
- source_word: ἐπλήρωσαν
  choice: brachten … zur Vollendung
  rationale: Gibt den Gedanken des Erfüllens beziehungsweise Vollendens deutlicher wieder als das im Deutschen missverständliche „erfüllten ihre Frömmigkeit“.
- source_word: τὴν … εὐσέβειαν
  choice: ihre Frömmigkeit
  rationale: Bezeichnet ehrfürchtige, im Handeln bewährte Hingabe und ist im heutigen Deutschen verständlich und religiös gewichtig.
- source_word: εἰς τὸν θεόν
  choice: gegenüber Gott
  rationale: Bringt die Ausrichtung beziehungsweise Bezogenheit der Frömmigkeit auf Gott zum Ausdruck, ohne ein Besitzverhältnis anzudeuten.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Zusammenhang des Martyriums
  choice: Frömmigkeit
  alternative: Gottesverehrung
  rationale: „Frömmigkeit“ lässt innere Ehrfurcht und treues Handeln zusammenklingen, ohne den Ausdruck auf Kult oder Gefühl einzuengen. Der Vers beschreibt, wie diese Hingabe im edlen Tod vollendet wurde.
- issue: Bedeutung von ἐπλήρωσαν für den Tod der Frommen
  choice: brachten … zur Vollendung
  alternative: erfüllten
  rationale: Die Formulierung wahrt die Aussage, dass ihr Tod ihre Frömmigkeit vollendete, ohne darüber hinaus eine bestimmte Sühne- oder Verdienstlehre in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In edler Haltung“ ist verständlicher und weniger altertümlich als „edel starben“; „zur Vollendung bringen“ bewahrt zugleich das bildhafte Gewicht von ἐπλήρωσαν.
