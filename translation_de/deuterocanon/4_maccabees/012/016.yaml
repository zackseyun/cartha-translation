lexical_decisions:
- source_word: ὅθεν
  choice: Deshalb
  rationale: Leitet eine Folgerung aus dem vorausgehenden Zusammenhang ein und klingt im modernen Deutsch natürlich.
- source_word: καὶ
  choice: auch
  rationale: Bewahrt die additive beziehungsweise hervorhebende Kraft der Konjunktion in Verbindung mit αὐτός.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Gibt die ausdrückliche Hervorhebung der betreffenden Person wieder.
- source_word: ἀποθνήσκειν
  choice: sterben
  rationale: Entspricht der unmittelbaren lexikalischen Bedeutung des Infinitivs.
- source_word: μέλλων
  choice: als er sterben sollte
  rationale: Drückt den unmittelbar bevorstehenden Tod aus, ohne mit einer Formulierung wie »dazu bestimmt« einen starken Schicksalsgedanken einzutragen.
- source_word: ἔφη
  choice: sagte
  rationale: Ist die schlichte und sachlich passende Wiedergabe des gewöhnlichen griechischen Redeverbs.
