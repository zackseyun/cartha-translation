  yaml_path: translation/deuterocanon/4_maccabees/012/005.yaml
  text: But if you are persuaded[a], you will be a friend, and you will have charge of the affairs of the kingdom.
translation:
  language: de
  text: Doch wenn du dich überzeugen lässt, wirst du ein Freund sein und die königlichen Angelegenheiten leiten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und mit der Verwaltung der königlichen Angelegenheiten betraut sein.“ Das griechische Wort kann Leitung, Führung oder Verwaltung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθεὶς
  choice: wenn du dich überzeugen lässt
  rationale: Das passive Aoristpartizip von πείθω ist hier sinngemäß konditional gebraucht. Die Formulierung bewahrt den passiven Sinn, ohne ihn stärker als „gehorchen“ oder „nachgeben“ auszudeuten.
- source_word: φίλος
  choice: ein Freund
  rationale: Die Grundbedeutung ist „Freund“. Im höfischen Zusammenhang kann das Wort zugleich einen bevorzugten Vertrauten oder einen Rang am Königshof bezeichnen; die schlichte Wiedergabe lässt diese Nuance offen.
- source_word: τῶν ἐπὶ τῆς βασιλείας πραγμάτων
  choice: die königlichen Angelegenheiten
  rationale: πράγματα bezeichnet Angelegenheiten oder Geschäfte; die Verbindung mit βασιλεία verweist hier auf den königlichen Herrschafts- und Verwaltungsbereich. „Königliche Angelegenheiten“ ist natürlich und vermeidet die mögliche Verengung von βασιλεία auf ein Territorium.
- source_word: ἀφήγησιν
  choice: leiten
  rationale: Das Substantiv bezeichnet in diesem Zusammenhang Leitung, Führung oder Verwaltung. Im Deutschen gibt die verbale Formulierung „die … Angelegenheiten leiten“ die idiomatisch elliptische griechische Konstruktion klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Mehrdeutigkeit von „Freund“ bleibt erhalten; die elliptische zweite Satzhälfte wird für natürliches Deutsch verbal wiedergegeben.
