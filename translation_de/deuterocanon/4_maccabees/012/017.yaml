  text: I will not renounce the testimony of my brothers[a].
translation:
  language: de
  text: Ich werde das Zeugnis meiner Brüder[a] nicht verleugnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Zeugnis, das meine Brüder abgelegt haben; im Zusammenhang klingt dabei auch ihr Märtyrertod an.'
    reason: Die Genitivverbindung ist knapp, und μαρτυρία kann sowohl „Zeugnis“ als auch „Zeugenschaft“ bezeichnen; hier erhält das Wort durch den Zusammenhang zusätzlich Märtyreranklänge.
lexical_decisions:
- source_word: Οὐκ
  choice: nicht
  rationale: Die einfache Verneinung bezieht sich auf das Verb.
- source_word: ἀπαντυμολοῶ
  choice: ich werde … nicht verleugnen
  rationale: Das seltene Verb bezeichnet hier das Lossagen oder Abrücken unter Druck. „Verleugnen“ ist im Deutschen natürlich und lässt sowohl den Widerruf als auch die Abkehr vom Zeugnis erkennen.
- source_word: μαρτυρίας
  choice: Zeugnis
  rationale: „Zeugnis“ gibt den unmittelbaren Sinn wieder und bewahrt zugleich die im Zusammenhang mitschwingende Verbindung zum Märtyrertod, ohne sie ausdrücklich in den Haupttext einzutragen.
- source_word: τῶν ἀδελφῶν μου
  choice: meiner Brüder
  rationale: Gemeint sind die männlichen Geschwister des Sprechers; der deutsche Genitiv wahrt zudem die knappe Form des Griechischen.
theological_decisions:
- issue: Soll μαρτυρίας ausdrücklich mit Märtyrersprache wiedergegeben werden?
  choice: Zeugnis
  alternative: Martyrium / Märtyrertod
  rationale: Obwohl der Zusammenhang deutlich vom Märtyrertod geprägt ist, hat das griechische Substantiv weiterhin den Sinn „Zeugnis“. Eine ausdrückliche Wiedergabe als „Martyrium“ würde die kontextuelle Bedeutung im Haupttext stärker festlegen als das Griechische.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verleugnen“ vermittelt die entschiedene Weigerung unter Verfolgungsdruck; die Fußnote bewahrt die Bedeutungsbreite von μαρτυρία.
