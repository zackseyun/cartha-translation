  text: and when his mother had encouraged him in the Hebrew language[a], as we will tell a little later,
translation:
  language: de
  text: Als seine Mutter ihn aber in hebräischer Sprache[a] ermutigt hatte, wie wir wenig später erzählen werden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „in hebräischer Zunge“. Die Wendung bezeichnet die Sprache, in der die Mutter zu ihm sprach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: δέ ist hier ein schwaches fortführendes Bindewort. „Aber“ wahrt den leichten Übergang beziehungsweise Gegensatz, ohne ihn zu überbetonen.
- source_word: προτρεψαμένης
  choice: ermutigt hatte
  rationale: Das Partizip von προτρέπω bezeichnet ein aktives Zureden oder Ermuntern. „ermutigt hatte“ ist im modernen Deutsch natürlich und bewahrt die Kraft des Ausdrucks, ohne eine bestimmte Form des Zuredens festzulegen.
- source_word: τῇ Ἑβραΐδι φωνῇ
  choice: in hebräischer Sprache
  rationale: φωνή bezeichnet hier die verwendete Sprache beziehungsweise Redeweise, nicht bloß Stimme oder Laut. Die Formulierung macht deutlich, dass die Mutter Hebräisch sprach.
- source_word: ὡς ἐροῦμεν
  choice: wie wir … erzählen werden
  rationale: Die Zukunftsform bildet einen auktorialen Vorverweis auf die spätere Erzählung. „erzählen“ passt zum narrativen Zusammenhang.
- source_word: μετὰ μικρὸν ὕστερον
  choice: wenig später
  rationale: Die Wendung verweist auf einen bald folgenden Abschnitt der Darstellung; „wenig später“ gibt dies knapp und idiomatisch wieder.
