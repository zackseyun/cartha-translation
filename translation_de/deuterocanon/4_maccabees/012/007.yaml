  verdict: revise
  source_fidelity: Der griechische Genitivus absolutus τῆς μητρὸς ... προτρεψαμένης wird durch „als seine Mutter ihn ... ermutigt hatte“ angemessen wiedergegeben. „in hebräischer Sprache“ trifft τῇ Ἑβραΐδι φωνῇ idiomatisch; der Vorausverweis „wie wir wenig später erzählen werden“ gibt ὡς ἐροῦμεν μετὰ μικρὸν ὕστερον präzise wieder.
  naturalness: Die Übersetzung ist insgesamt natürliches modernes Standarddeutsch und darf als satzanschließendes Fragment mit Komma enden. Die Stellung von „aber“ nach „seine Mutter ihn“ ist im Deutschen flüssiger als „Als aber seine Mutter ihn“.
  terminology: '„ermutigt“ ist eine angemessene, nicht überdeutende Wiedergabe von προτρέπω. Die Fußnote sollte jedoch nicht „wörtlich auch“ behaupten: „mit hebräischer Rede“ ist keine überzeugende wörtliche deutsche Entsprechung und klingt unnatürlich.'
