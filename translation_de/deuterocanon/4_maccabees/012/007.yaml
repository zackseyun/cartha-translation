    rationale: '„Wörtlich auch: mit hebräischer Rede“ ist weder eine besonders genaue noch eine natürliche Wiedergabe von τῇ Ἑβραΐδι φωνῇ. Die Anmerkung kann die Bedeutung der Wendung klarer erläutern.'
