  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Satzes wieder: das hervorgehobene Objekt im Singular (σέ: »Dich«), den Kontrast (δέ: »aber«), die beiden zeitlichen Bereiche (καὶ … καὶ; ἐν τῷ νῦν βίῳ; θανόντα) und die künftige Strafhandlung mit implizitem Subjekt (τιμωρήσεται). »Nach deinem Tod« ist eine idiomatische temporale Entfaltung des aoristischen Partizips und bewahrt die Aussage einer Bestrafung auch im Zustand nach dem Tod.'
  naturalness: »Dich aber wird er sowohl im jetzigen Leben als auch nach deinem Tod bestrafen« ist modernes, verständliches Standarddeutsch und behält einen angemessen würdigen, direkten Ton. Die Voranstellung von »Dich aber« bildet die griechische Hervorhebung gut nach.
  terminology: »Bestrafen« ist für τιμωρέω im Kontext treffend und vermeidet eine unnötige Festlegung auf »Rache«. »Im jetzigen Leben« und »nach deinem Tod« markieren klar den Gegensatz zwischen gegenwärtigem Leben und dem Zustand nach dem Tod. Das nicht genannte Subjekt wird korrekt als »er« beibehalten, ohne dessen Identität im Vers zu ergänzen.
