  yaml_path: translation/deuterocanon/4_maccabees/012/019.yaml
  text: But even in the present life[a], and after you die, he will punish you.
translation:
  language: de
  text: Dich aber wird er sowohl im jetzigen Leben[a] als auch nach deinem Tod bestrafen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dich aber wird er schon jetzt in diesem Leben und auch dann bestrafen, wenn du gestorben bist.«'
    reason: 'Lexikalisch-syntaktische Alternative: Das erste καί kann statt als Teil der Verbindung »sowohl … als auch« verstärkend verstanden werden; das Partizip θανόντα lässt sich zudem wörtlicher mit »wenn du gestorben bist« wiedergeben.'
lexical_decisions:
- source_word: σὲ
  choice: Dich
  rationale: Das Akkusativpronomen der zweiten Person Singular ist das direkte Objekt des Verbs und wird entsprechend mit »Dich« wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel führt hier einen Gegensatz beziehungsweise eine kontrastierende Fortsetzung ein; »aber« gibt diese Funktion natürlich wieder.
- source_word: καὶ … καὶ
  choice: sowohl … als auch
  rationale: Die beiden Vorkommen verbinden die zwei zeitlichen Bereiche. Die korrelative deutsche Formulierung bildet diese umfassende Zuordnung prägnant ab; beim ersten καί ist daneben eine verstärkende Nuance wie »sogar« oder »schon« möglich.
- source_word: ἐν τῷ νῦν βίῳ
  choice: im jetzigen Leben
  rationale: Die Wendung bezeichnet das gegenwärtige irdische Leben im Gegensatz zum Zustand nach dem Tod. »Im jetzigen Leben« wahrt diesen Kontrast und bleibt nahe am griechischen Ausdruck.
- source_word: θανόντα
  choice: nach deinem Tod
  rationale: Das Aoristpartizip von θνῄσκω stimmt mit dem angesprochenen Objekt überein und wird temporal verstanden. »Nach deinem Tod« drückt den Eintritt des Todes vor der hier angekündigten Bestrafung idiomatisch aus, ohne die Aussage abzuschwächen.
- source_word: τιμωρήσεται
  choice: wird er … bestrafen
  rationale: Die dritte Person Singular Futur Medium bezeichnet hier eine künftige Strafhandlung. »Bestrafen« gibt den Sinn klar wieder, ohne die mögliche Vergeltungsnuance durch »rächen« zu stark festzulegen.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verbs
  choice: wird er … bestrafen
  alternative: du wirst bestraft werden
  rationale: Das griechische Verb steht in der dritten Person Singular und ist nicht passiv. Daher bleibt die durch den Kontext vorausgesetzte handelnde Person als »er« erhalten, ohne sie in diesem Vers ausdrücklich zu benennen.
- issue: Zeitlicher Umfang der Bestrafung
  choice: sowohl im jetzigen Leben als auch nach deinem Tod
  alternative: schon jetzt in diesem Leben und auch, wenn du gestorben bist
  rationale: Der griechische Text bezieht die angekündigte Bestrafung auf das gegenwärtige Leben und auf die Zeit nach dem Tod. Beide Bereiche werden ausdrücklich bewahrt, ohne die Aussage über die Bestrafung nach dem Tod theologisch näher auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Voranstellung von »Dich aber« bewahrt den Kontrast und die Hervorhebung des griechischen Satzes; die Identität des unausgesprochenen Subjekts wird nicht ergänzt.
