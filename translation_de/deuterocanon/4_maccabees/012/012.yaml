    issue: Der Relativsatz kann sich im Entwurf auf „Feuer und Qualen“ beziehen.
    rationale: Das griechische αἱ ist feminin plural und nimmt spezifisch βασάνοις („Qualen“) wieder auf. Die deutsche Satzfügung sollte diesen Bezug eindeutig machen.
  - severity: medium
    issue: „In alle Ewigkeit“ überbestimmt εἰς ὅλον τὸν αἰῶνα.
    rationale: Die griechische Wendung lautet wörtlich beziehungsweise strukturell „während/für das ganze Zeitalter“. Da die Dauerbegriffe auslegungsrelevant sind, sollte die Übersetzung den zeitlichen Ausdruck nicht über seine Form hinaus systematisieren.
