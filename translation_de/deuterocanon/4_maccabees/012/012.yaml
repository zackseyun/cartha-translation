  source_fidelity: Der Entwurf gibt den Vergeltungszusammenhang, die personifizierte göttliche δίκη, das Bereithalten der Strafe sowie die markante Steigerung πυκνοτέρῳ im Wesentlichen zutreffend wieder. Die Relativform αἱ ist jedoch feminin plural und bezieht sich auf βασάνοις („Qualen“), nicht auf die zusammengefasste Wortgruppe „Feuer und Qualen“. Außerdem legt „in alle Ewigkeit“ die umstrittene Tragweite von εἰς ὅλον τὸν αἰῶνα stärker fest als die griechische Formulierung selbst.
  naturalness: „Dichteres Feuer“ ist im Deutschen bewusst ungewöhnlich, aber als textnahe Wiedergabe der auffälligen Bildsprache vertretbar. Die Umstellung mit „sowie Qualen, die …“ macht den Bezug des Relativsatzes klar und bleibt modernes, würdiges Standarddeutsch.
  terminology: „Göttliche Gerechtigkeit“, „ewiges Feuer“ und „Qualen“ sind angemessene und registergerechte Wiedergaben. „Während des ganzen Zeitalters“ bildet die zeitliche Wendung εἰς ὅλον τὸν αἰῶνα genauer ab und erhält deren Auslegungsspielraum, ohne die Aussage einer fortdauernden Nichtfreigabe abzuschwächen.
  issues:
