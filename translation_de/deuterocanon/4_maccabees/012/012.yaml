base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/012.yaml
  text: For these things, divine justice is storing up for you a denser and eternal fire and torments, which through the whole age will not release you.
translation:
  language: de
  text: Dafür hält die göttliche Gerechtigkeit ein dichteres und ewiges Feuer für dich bereit sowie Qualen, die dich während des ganzen Zeitalters nicht loslassen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθ᾽ ὧν
  choice: Dafür
  rationale: 'Gibt den vergeltenden Bezug knapp und natürlich wieder: als Folge beziehungsweise Strafe für das zuvor Genannte.'
- source_word: ταμιεύεταί σε
  choice: hält … für dich bereit
  rationale: Bewahrt das Bild des Aufsparens oder Bereithaltens, ohne im Deutschen unnatürlich zu klingen.
- source_word: ἡ θεία δίκη
  choice: die göttliche Gerechtigkeit
  rationale: δίκη bezeichnet hier die richtende und vergeltende Gerechtigkeit; die abstrakte Personifizierung bleibt erhalten.
- source_word: πυκνοτέρῳ
  choice: dichteres
  rationale: Entspricht der ungewöhnlichen Grundbedeutung des Komparativs und bewahrt die auffällige Bildsprache, statt sie deutend als „heftiger“ aufzulösen.
- source_word: αἰωνίῳ πυρὶ
  choice: ewiges Feuer
  rationale: Gibt αἰώνιος in seiner gewöhnlichen eschatologischen Bedeutung wieder.
- source_word: βασάνοις
  choice: Qualen
  rationale: Bezeichnet hier leidvolle Strafqualen; der Plural wird sachgerecht wiedergegeben.
- source_word: εἰς ὅλον τὸν αἰῶνα
  choice: in alle Ewigkeit
  rationale: Natürliches modernes Deutsch für die idiomatische Zeitangabe „für das ganze Zeitalter“; der Kontext unterstreicht unaufhörliche Dauer.
- source_word: οὐκ ἀνήσουσί σε
  choice: dich … nicht loslassen werden
  rationale: Bewahrt das konkrete Verb ἀνίημι im Sinn von freilassen, nachlassen oder von jemandem ablassen.
theological_decisions:
- issue: Dauer der angekündigten Strafe
  choice: „ewiges Feuer“ und „in alle Ewigkeit nicht loslassen“
  alternative: „Feuer des Zeitalters“ und „während des ganzen Zeitalters nicht loslassen“
  rationale: Der Vers verbindet αἰώνιος mit εἰς ὅλον τὸν αἰῶνα und betont damit anhaltende, nicht nachlassende Strafe. Die gewählte idiomatische Wiedergabe wahrt diese Aussage, ohne zusätzliche systematische Folgerungen einzutragen.
- issue: Personifizierung der göttlichen Gerechtigkeit
  choice: als handelndes Subjekt beibehalten
  alternative: 'unpersönlich formulieren: „Gott wird dich gerechterweise bestrafen“'
  rationale: Der griechische Text nennt ausdrücklich ἡ θεία δίκη als Subjekt; eine Umformung auf Gott selbst würde die rhetorische Gestalt verändern.
translation_notes:
  register: Dignitatives, klares Standarddeutsch. Die ungewöhnliche Formulierung „dichteres Feuer“ bleibt bewusst erhalten, weil sie die markante griechische Wortwahl πυκνοτέρῳ spiegelt. Der Satz bewahrt sowohl die personifizierte göttliche Gerechtigkeit als auch die unerbittliche Dauer der Qualen.
