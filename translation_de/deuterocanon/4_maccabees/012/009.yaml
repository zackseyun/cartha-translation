  text: And, rejoicing especially over the young man's promise, they quickly untied him.
translation:
  language: de
  text: Und sie freuten sich besonders über das Versprechen des jungen Mannes und lösten ihn rasch los.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιχαρέντες
  choice: weil sie sich … freuten
  rationale: Das aoristische Partizip bezeichnet hier ihre Freude als Begleitumstand beziehungsweise Beweggrund ihres Handelns. Ein kausaler Nebensatz ist im modernen Deutschen natürlich und gibt den Zusammenhang klar wieder.
- source_word: μάλιστα
  choice: besonders
  rationale: Das Adverb hebt das Versprechen als besonderen Grund ihrer Freude hervor.
- source_word: ἐπαγγελίᾳ
  choice: Versprechen
  rationale: ἐπαγγελία bezeichnet hier die vom jungen Mann gegebene Zusage; „Versprechen“ ist die naheliegende und verständliche Wiedergabe.
- source_word: τοῦ παιδός
  choice: des jungen Mannes
  rationale: παῖς kann Kind, Junge, junger Mensch oder Diener bedeuten. Im Erzählzusammenhang ist ein Makkabäerbruder gemeint; „junger Mann“ vermeidet die unbeabsichtigte Vorstellung eines kleinen Kindes.
- source_word: ταχέως
  choice: schnell
  rationale: Das Adverb bezeichnet die unverzügliche beziehungsweise rasche Ausführung der Handlung; „schnell“ ist präzise und idiomatisch.
- source_word: ἔλυσαν
  choice: banden … los
  rationale: λύω bedeutet lösen, losbinden oder freigeben. Im Folterkontext bezeichnet es konkret das Lösen seiner Fesseln; „banden ihn los“ bewahrt dieses anschauliche Bild.
