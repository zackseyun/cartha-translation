  yaml_path: translation/deuterocanon/4_maccabees/012/015.yaml
  text: But you will wail miserably for putting to death, without cause, the champions of virtue[a][b].
translation:
  language: de
  text: Du aber wirst bitterlich wehklagen, weil du die Kämpfer für die Tugend[a] grundlos[b] getötet hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Wettkämpfer der Tugend« beziehungsweise »die Streiter für die Tugend«. Das griechische Wort bezeichnet Teilnehmer an einem Wettkampf oder Kampf und wird hier ehrenvoll gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu Unrecht« beziehungsweise »ohne Rechtfertigung«. Wörtlich heißt es: »ohne Grund«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Du aber
  rationale: Bewahrt den direkten Gegensatz und die pointierte Anrede des Tyrannen.
- source_word: κακῶς οἰμώξεις
  choice: wirst elend wehklagen
  rationale: οἰμώζω bezeichnet lautes Klagen; κακῶς verstärkt dieses im Sinn eines elenden beziehungsweise schlimmen Ergehens. Die etwas markante Formulierung erhält die Härte der Ankündigung.
- source_word: τοὺς τῆς ἀρετῆς ἀγωνιστάς
  choice: die Kämpfer für die Tugend
  rationale: ἀγωνιστής bezeichnet einen, der in einem Wettkampf oder Kampf antritt. „Kämpfer“ wahrt das Bild und klingt im Deutschen ehrenvoller und kontextgerechter als „Wettkämpfer“ oder „Athleten“.
- source_word: ἀναίτιως
  choice: ohne Grund
  rationale: Gibt die Abwesenheit eines berechtigten Grundes wieder und bewahrt die Offenheit zwischen „grundlos“ und „ungerecht“.
- source_word: ἀποκτεῖναι
  choice: weil du ... getötet hast
  rationale: Der Infinitiv nennt den Anlass des angekündigten Wehklagens. Ein deutscher Kausalsatz macht diesen Bezug natürlich und eindeutig.
- source_word: τῆς ἀρετῆς
  choice: für die Tugend
  rationale: ἀρετή hat hier im hellenistisch-jüdischen Märtyrerkontext einen ethisch-moralischen Sinn. „Tugend“ bewahrt diese Begriffswelt, während „für“ die Zugehörigkeit der Kämpfer zur Sache der Tugend idiomatisch ausdrückt.
theological_decisions:
- issue: Moralphilosophische Bedeutung von ἀρετή im Märtyrerkontext
  choice: Tugend
  alternative: Vortrefflichkeit; sittliche Vortrefflichkeit
  rationale: „Tugend“ erhält den ethischen Leitbegriff des Werkes, ohne ihn durch eine spätere konfessionelle Deutung festzulegen.
- issue: Moralische Wertung durch ἀναίτιως
  choice: ohne Grund
  alternative: ungerecht; ohne Rechtfertigung
  rationale: Die Übersetzung lässt offen, ob vor allem fehlende Schuld, fehlender Anlass oder fehlende Rechtfertigung betont wird, und macht die implizite Ungerechtigkeit nicht expliziter als der griechische Ausdruck.
translation_notes:
  register: Moderne, würdige Standardsprache mit scharfem, prophetisch-anklagendem Ton. „Wehklagen“ trägt die Intensität des griechischen Verbs; „elend“ bewahrt bewusst die Härte von κακῶς. Die Bildsprache des moralischen Kampfes bleibt erhalten.
