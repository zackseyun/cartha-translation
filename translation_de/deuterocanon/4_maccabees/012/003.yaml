  text: He sent for him to come nearer[a], and tried to encourage him, saying,
translation:
  language: de
  text: 'Er ließ ihn näher zu sich rufen[a] und versuchte, ihm Mut zu machen, indem er sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er ließ ihn näher herbeirufen und versuchte, ihn zu trösten, indem er sagte:“'
    reason: Lexikalische Alternativen bei μετεπέμψατο und παρηγορεῖν; insbesondere kann παρηγορεῖν auch „trösten“ oder „zureden“ bedeuten.
lexical_decisions:
- source_word: πλησιέστερον
  choice: näher zu sich
  rationale: 'Der Komparativ bezeichnet eine geringere räumliche Entfernung. Zusammen mit μετεπέμψατο ergibt sich im Deutschen natürlich: „näher zu sich rufen“.'
- source_word: αὐτὸν
  choice: ihn
  rationale: Das maskuline Akkusativpronomen bezeichnet im Zusammenhang den angesprochenen Sohn.
- source_word: μετεπέμψατο
  choice: ließ … rufen
  rationale: Das Medium von μεταπέμπω bedeutet hier „nach jemandem schicken, jemanden herbeirufen“. Die Formulierung „ließ ihn … rufen“ ist idiomatisch und bewahrt den veranlassten Ruf.
- source_word: παρηγορεῖν
  choice: ihm Mut zu machen
  rationale: παρηγορέω kann trösten, zureden oder ermutigen bedeuten. Im Zusammenhang des Versuchs, ihn durch eine Ansprache umzustimmen, gibt „Mut machen“ die ermunternde Zuwendung natürlich wieder, ohne die Alternative „trösten“ auszuschließen.
- source_word: ἐπειρᾶτο
  choice: versuchte
  rationale: Das Imperfekt bezeichnet einen fortdauernden beziehungsweise unternommenen Versuch; „versuchte“ ist im Deutschen prägnant und sachgerecht.
- source_word: λέγων
  choice: indem er sagte
  rationale: Das Präsenspartizip führt die Rede als Mittel des versuchten Zuspruchs ein. „Indem er sagte“ bewahrt diese syntaktische Beziehung besser als ein unabhängiges „und sagte“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Näher zu sich rufen“ verdeutlicht die aus dem griechischen Komparativ und dem Verb hervorgehende Bewegung, ohne zusätzliche Handlungselemente einzuführen. Der Doppelpunkt kündigt die folgende direkte Rede an.
