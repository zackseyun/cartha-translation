  text: And after praying these things[a], he threw himself onto the frying pans; and so he died.
translation:
  language: de
  text: Und nachdem er dies gebetet hatte, warf er sich auf die Bratpfannen; und so starb er.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „gab er zurück“ oder „gab er hin“, das heißt: sein Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα κατευξάμενος
  choice: Und nachdem er dies gebetet hatte
  rationale: Das Partizip Aorist bezeichnet ein vor der Haupthandlung abgeschlossenes Gebet. „Dies“ nimmt den Inhalt der unmittelbar vorausgehenden Worte auf und gibt ταῦτα im Deutschen natürlich wieder.
- source_word: ἑαυτὸν ἔρριψεν
  choice: warf er sich
  rationale: Die Verbindung aus Reflexivpronomen und ῥίπτω beschreibt eine bewusste, kraftvolle Eigenbewegung. „Warf er sich“ ist klar und weder altertümlich noch unnötig ausschmückend.
- source_word: κατὰ τῶν τηγάνων
  choice: auf die Bratpfannen
  rationale: κατά mit Genitiv bezeichnet hier die Bewegung hinab auf die Foltergeräte. τηγάνων meint Bratpfannen beziehungsweise entsprechende Metallpfannen; die konkrete Bezeichnung des griechischen Textes bleibt erhalten.
- source_word: ἀπέδωκεν
  choice: starb er
  rationale: Das Verb steht elliptisch und bezeichnet im Zusammenhang den Tod, ohne ausdrücklich „Leben“ oder „Geist“ als Objekt zu nennen. „Starb er“ vermittelt den gemeinten Vorgang klar; die wörtlichere Ausdrucksweise wird in der Fußnote vermerkt.
theological_decisions:
- issue: Elliptischer Gebrauch von ἀπέδωκεν in der Märtyrererzählung
  choice: starb er
  alternative: gab er [sein Leben/seinen Geist] hin beziehungsweise zurück
  rationale: Der griechische Text nennt weder das Leben noch den Geist ausdrücklich. Die Übersetzung bezeichnet daher den erzählten Tod, ohne ein nicht genanntes Objekt und damit eine spezifischere theologische Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzfolge und die drastische Bildsprache des griechischen Textes bleiben erhalten. Der Fußnotenmarker steht bei der Wiedergabe von ἀπέδωκεν, auf die sich die Anmerkung bezieht.
