base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/011.yaml
  text: “You unholy man,” she said[a], “most ungodly tyrant of all wicked men, were you not ashamed, after receiving good things and kingship from God[b], to kill his servants and torture the practitioners of godliness?”
translation:
  language: de
  text: „Du Unheiliger“, sagte sie, „du gottlosester Tyrann unter allen Übeltätern! Hast du dich nicht geschämt, nachdem du von Gott die guten Gaben und die Königsherrschaft empfangen hattest, seine Diener zu töten und die in der Gottesfurcht Geübten[a] zu foltern?“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich in der Frömmigkeit üben“; wörtlicher auch: „die Übenden der Gottesfurcht“. Das griechische Wort bezeichnet Menschen, die eine Lebenshaltung diszipliniert einüben, nicht notwendig Asketen im späteren Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνόσιε
  choice: Du Unheiliger
  rationale: Der substantivierte Anredeausdruck gibt den religiös-moralischen Vorwurf des griechischen Vokativs knapp und würdevoll wieder.
- source_word: πάντων τῶν πονηρῶν ἀσεβέστατε τύραννε
  choice: du gottlosester Tyrann unter allen Bösen
  rationale: Die Wiedergabe bewahrt den Superlativ und versteht πάντων τῶν πονηρῶν als die Gruppe, aus der der Tyrann herausgehoben wird. „Gottlos“ bildet den Gottesbezug von ἀσεβής deutlicher ab als das heute weniger geläufige „frevelhaft“.
- source_word: οὐκ ᾐδέσθης
  choice: Hast du dich nicht geschämt
  rationale: Natürliche deutsche Form der anklagenden rhetorischen Frage; sie erhält den Gedanken sittlicher Scham und Zurückhaltung.
- source_word: παρὰ τοῦ θεοῦ λαβὼν τὰ ἀγαθὰ καὶ τὴν βασιλείαν
  choice: obwohl du von Gott die guten Gaben und die Königsherrschaft empfangen hast
  rationale: „Obwohl“ bringt den im Kontext vorwurfsvollen Gegensatz des Partizips zur Tötung und Folter natürlich zum Ausdruck. „Gute Gaben“ lässt den unspezifischen Plural bestehen; „Königsherrschaft“ bezeichnet das verliehene Königtum beziehungsweise die Herrschergewalt, nicht vorrangig ein Gebiet.
- source_word: τοὺς θεράποντας αὐτοῦ
  choice: seine Diener
  rationale: Bezeichnet Menschen, die Gott dienen, ohne ihnen ein bestimmtes kultisches oder kirchliches Amt zuzuschreiben.
- source_word: κατακτείνειν
  choice: zu töten
  rationale: Direkte und klare Wiedergabe des Verbs, ohne die Gewaltsprache unnötig über das Griechische hinaus zu steigern.
- source_word: τοὺς τῆς εὐσεβείας ἀσκητάς
  choice: die in der Gottesfurcht Geübten
  rationale: ἀσκητής bezeichnet hier jemanden, der sich in einer Lebenshaltung übt. „Gottesfurcht“ gibt εὐσέβεια im jüdischen Zusammenhang als auf Gott bezogene, gelebte Frömmigkeit wieder, ohne den späteren Fachsinn von „Asket“ einzutragen.
- source_word: στρεβλοῦν
  choice: zu foltern
  rationale: Das Verb kann insbesondere das Strecken oder Foltern auf der Folterbank bezeichnen; der allgemeinere Ausdruck „foltern“ bewahrt die Aussage, ohne ein nicht ausdrücklich genanntes Gerät festzulegen.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im jüdischen Märtyrerkontext
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ macht die Ausrichtung auf Gott deutlich und bezeichnet hier eine gelebte religiöse Haltung. „Frömmigkeit“ wäre ebenfalls möglich, kann im heutigen Deutsch jedoch stärker nach äußerer oder subjektiver Religiosität klingen.
- issue: Bezeichnung der Gott Dienenden mit θεράποντες
  choice: Diener
  alternative: Verehrer
  rationale: „Diener“ erhält die Zugehörigkeit und den Dienst an Gott, ohne ein besonderes Amt oder lediglich eine innere Haltung festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit scharfer rhetorischer Anrede. Der griechische Superlativ und die Häufung moralisch-religiöser Vorwürfe bleiben erhalten. Die Satzstruktur wurde für natürliches Deutsch leicht gegliedert; die Spannung zwischen Gottes Gaben und dem gewaltsamen Handeln des Tyrannen wird ausdrücklich gewahrt.
