  - severity: low
    issue: Wiedergabe von τὸ ἦθος
    rationale: „Seinem Wesen nach“ ist möglich, klingt mit „nur eine Art von Speise isst“ aber weniger idiomatisch. „Von seiner Veranlagung her“ gibt den dauerhaften Charakterzug natürlich wieder.
