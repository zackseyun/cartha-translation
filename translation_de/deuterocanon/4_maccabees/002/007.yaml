  yaml_path: translation/deuterocanon/4_maccabees/002/007.yaml
  text: For how is a man who is by habit eating only one kind of food[a], and is a glutton and a drunkard, retrained, if it is not clear that reason is master of the passions?
translation:
  language: de
  text: Denn wie wird ein Mann, der von seiner Veranlagung her nur eine Art von Speise isst[a], ein Vielfraß und ein Trunkenbold ist, umerzogen, wenn nicht offenkundig ist, dass die Vernunft Herrin über die Leidenschaften ist?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort kann wörtlich „nur eine Speise essend“ bedeuten; möglich sind auch „wählerisch beim Essen“ oder „nur nach besonderen Speisen verlangend“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Denn
  rationale: Leitet eine begründende rhetorische Frage ein und stellt den Zusammenhang mit dem vorausgehenden Gedankengang her.
- source_word: τίνα τρόπον
  choice: wie
  rationale: Gibt die griechische Wendung im Deutschen idiomatisch und vollständig wieder.
- source_word: μονοφάγος
  choice: nur eine Art von Speise isst
  rationale: Bewahrt die naheliegende wörtliche Bedeutung des seltenen Wortes, ohne seine lexikalische Unsicherheit zu verdecken; alternative Deutungen werden in der Fußnote genannt.
- source_word: τὸ ἦθος
  choice: seinem Wesen nach
  rationale: Kennzeichnet eine gefestigte Wesensart oder Gewohnheit und nicht bloß ein einmaliges Verhalten.
- source_word: γαστρίμαργος
  choice: Vielfraß
  rationale: Ein geläufiger deutscher Lasterbegriff für maßlose Essgier.
- source_word: μέθυσος
  choice: Trunkenbold
  rationale: Bezeichnet eine durch Trunksucht geprägte Person, nicht lediglich jemanden, der gerade betrunken ist.
- source_word: μεταπαιδεύεται
  choice: kann … umerzogen werden
  rationale: Erhält den pädagogischen Sinn einer erneuten oder verändernden Erziehung; die Modalform passt zur rhetorischen Frage.
- source_word: δῆλον
  choice: offenbar
  rationale: Gibt die Bedeutung von etwas klar Erkennbarem in gehobenem, aber verständlichem Deutsch wieder.
- source_word: κύριός ἐστιν τῶν παθῶν
  choice: Herrin über die Leidenschaften ist
  rationale: Drückt die Herrschaft beziehungsweise Kontrolle aus; das feminine „Herrin“ folgt im Deutschen dem grammatischen Geschlecht von „Vernunft“.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: Bezeichnet im philosophischen Sprachgebrauch des Buches die lenkende rationale Fähigkeit.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: Bewahrt den philosophisch-ethischen Fachsinn von πάθη als Triebe und Affekte, die der Lenkung bedürfen.
theological_decisions:
- issue: κύριος in einem nichtgöttlichen philosophischen Zusammenhang
  choice: Herrin über
  alternative: Gebieterin über; beherrscht
  rationale: Hier ist keine Gottes- oder Ehrenbezeichnung gemeint, sondern die Herrschaft der Vernunft über die Leidenschaften. „Herrin über“ bewahrt das Prädikatsbild des Griechischen.
- issue: Generisches maskulines τις
  choice: ein Mann
  alternative: jemand; ein Mensch
  rationale: Die maskuline Form des griechischen Beispiels wird sichtbar erhalten, ohne ihr eine weitergehende lehrmäßige Bedeutung beizulegen.
- issue: Verhältnis von Vernunft und Leidenschaften
  choice: Herrschaft der Vernunft über die Leidenschaften
  alternative: Unterdrückung oder Beseitigung der Leidenschaften
  rationale: Der Text behauptet ihre Beherrschung, nicht ausdrücklich ihre Auslöschung; diese Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Satzform und der philosophische Leitbegriff „Vernunft“ bleiben erhalten. Die ungewöhnliche Verbindung von einseitigem Essen und Völlerei wird nicht geglättet, sondern durch eine Fußnote als echte lexikalische Unsicherheit kenntlich gemacht.
