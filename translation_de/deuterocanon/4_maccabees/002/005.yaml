translation:
  language: de
  text: 'Das Gesetz sagt nämlich: „Du sollst nicht die Frau deines Nächsten begehren und auch nichts, was deinem Nächsten gehört.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das griechische Präsens führt das Schriftzitat unmittelbar und natürlich ein.
- source_word: γοῦν
  choice: denn
  rationale: Die Partikel knüpft das Zitat bestätigend und begründend an den vorausgehenden Gedankengang an; im Deutschen gibt „denn“ diese Funktion idiomatisch wieder.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Gemeint ist das mosaische Gesetz als maßgebliche Schrift; die Großschreibung des Substantivs ist im Deutschen regulär und macht keine zusätzliche Deutung erforderlich.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Du sollst nicht … begehren
  rationale: „Begehren“ gibt das starke, auf fremden Besitz gerichtete Verlangen wieder, entspricht dem vertrauten Wortlaut des Dekalogs und bewahrt zugleich den Bezug zum Thema der Begierden.
- source_word: τὴν γυναῖκα
  choice: die Frau
  rationale: Im possessiven Ausdruck „die Frau deines Nächsten“ ist eindeutig die Ehefrau gemeint; „Frau“ ist im modernen Deutschen dafür natürlich und würdig.
- source_word: τοῦ πλησίον σου
  choice: deines Nächsten
  rationale: Die traditionelle und weiterhin verständliche Wiedergabe bezeichnet den Mitmenschen beziehungsweise Angehörigen der Gemeinschaft.
- source_word: οὐδὲ ὅσα
  choice: und auch nichts
  rationale: Der griechische neutrale Plural wird im Deutschen umfassend und idiomatisch mit „nichts“ wiedergegeben; „und auch“ trägt die ergänzende negative Kraft von οὐδέ.
- source_word: τῷ πλησίον σού ἐστιν
  choice: was deinem Nächsten gehört
  rationale: Die Wendung drückt Besitz aus; „gehört“ ist die klare, natürliche deutsche Formulierung.
theological_decisions:
- issue: Wiedergabe von ἐπιθυμέω im Zitat aus dem Dekalog
  choice: begehren
  alternative: Verlangen haben nach
  rationale: „Begehren“ bewahrt sowohl die ethische Zuspitzung auf fremden Besitz als auch die Verbindung zur Sprache des Dekalogs. Das allgemeinere „Verlangen haben nach“ wäre lexikalisch möglich, könnte hier aber die unerlaubte, besitzergreifende Ausrichtung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der knappen Gestalt des griechischen Schriftzitats und verwendet mit „begehren“ eine geläufige biblische Formulierung, die auch außerhalb kirchlicher Fachsprache verständlich bleibt.
