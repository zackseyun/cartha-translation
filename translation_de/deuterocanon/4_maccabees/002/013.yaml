translation:
  language: de
  text: Und haltet es nicht für überraschend,[a] dass die Vernunft um des Gesetzes willen sogar die Feindschaft überwinden kann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für paradox“. Das griechische Wort kann etwas bezeichnen, das der Erwartung widerspricht oder ungewöhnlich erscheint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wo auch die Vernunft wegen des Gesetzes über die Feindschaft die Oberhand gewinnen kann“. Die griechische Konstruktion ist knapp; auch „aufgrund des Gesetzes“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νομίσητε
  choice: haltet es nicht für
  rationale: νομίζω bezeichnet hier ein wertendes Urteil. Die deutsche Wendung „etwas für … halten“ gibt die Aufforderung natürlich und genau wieder.
- source_word: παράδοξον
  choice: überraschend
  rationale: παράδοξος bedeutet hier „wider Erwarten“ oder „ungewöhnlich“. „Überraschend“ ist in modernem Deutsch verständlich, ohne den stärker fachsprachlichen Klang von „paradox“ einzutragen.
- source_word: ὅπου
  choice: dass
  rationale: Das wörtliche „wo“ steht in einer knappen griechischen Konstruktion und leitet hier den Sachverhalt ein, der nicht überraschen soll. „Dass“ gibt diesen Zusammenhang im Deutschen idiomatisch wieder.
- source_word: ἔχθραν
  choice: Feindschaft
  rationale: ἔχθρα kann Feindschaft, Gegnerschaft oder Hass bezeichnen. „Feindschaft“ bewahrt den relationalen Sinn und verengt den Ausdruck nicht auf ein bloßes Gefühl.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: λογισμός bezeichnet in 4 Makkabäer die vernünftige Urteils- und Lenkungsfähigkeit. „Die Vernunft“ wahrt diesen Leitbegriff prägnant und ohne unnötigen Fachjargon.
- source_word: ἐπικρατεῖν δύναται
  choice: überwinden kann
  rationale: δύναται drückt Fähigkeit aus, während ἐπικρατέω das Erlangen der Oberhand bezeichnet. „Überwinden kann“ ist natürlich und erhält die Aussage von der Herrschaft der Vernunft.
- source_word: διὰ τὸν νόμον
  choice: um des Gesetzes willen
  rationale: διά mit Akkusativ bezeichnet hier Grund oder Beweggrund. „Um des Gesetzes willen“ bewahrt den möglichen Sinn von Motivation und Bindung, ohne eine instrumentale Wirkung des Gesetzes zu behaupten.
- source_word: νόμον
  choice: das Gesetz
  rationale: Gemeint ist das jüdische Gesetz beziehungsweise die Tora. „Das Gesetz“ folgt der griechischen Form und ist im Zusammenhang verständlich.
theological_decisions:
- issue: Philosophisch-theologischer Sinn von λογισμός
  choice: die Vernunft
  alternative: das vernünftige Urteil
  rationale: Das Buch entfaltet die Herrschaft der frommen Vernunft über die Leidenschaften. „Die Vernunft“ erhält diesen thematischen Leitbegriff, ohne eine spätere konfessionelle Deutung einzutragen.
- issue: Bedeutung von διὰ τὸν νόμον
  choice: um des Gesetzes willen
  alternative: aufgrund des Gesetzes
  rationale: Die Formulierung lässt Gesetzestreue als Beweggrund erkennen, ohne die griechische Wendung eindeutig auf mechanische Verursachung oder Instrumentalität festzulegen.
- issue: 'Gegenstand der Überwindung: ἔχθρα'
  choice: Feindschaft
  alternative: Hass
  rationale: „Feindschaft“ wahrt die Breite des griechischen Ausdrucks. „Hass“ wäre stärker auf die innere Gefühlsregung festgelegt und könnte die Aussage unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt prägnant und bewahrt die philosophische Begrifflichkeit des Buches; die komprimierte griechische Konstruktion wird im Haupttext idiomatisch entfaltet und in der Fußnote dokumentiert.
