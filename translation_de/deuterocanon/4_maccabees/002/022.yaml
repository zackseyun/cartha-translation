  text: And at that time he also enthroned the holy ruling mind over all things through the senses;[a]
translation:
  language: de
  text: Und damals setzte er auch den heiligen, herrschenden Verstand durch die Sinne über alles auf den Thron.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heilige, herrschende Vernunft“. Das griechische νοῦς bezeichnet hier das vernünftig urteilende und sittlich leitende Denkvermögen; αἰσθητήρια kann auch „Sinnesorgane“ oder „Wahrnehmungsvermögen“ bedeuten.'
    reason: Lexikalische Alternativen bei zwei zentralen anthropologischen Begriffen; die Fußnote erläutert die im Haupttext bewusst offen gehaltene Bedeutung von αἰσθητήρια.
lexical_decisions:
- source_word: τηνικαῦτα
  choice: damals
  rationale: Das Temporaladverb bezeichnet den betreffenden Zeitpunkt innerhalb der Argumentation; „damals“ ist knapp und natürlich.
- source_word: περὶ πάντων
  choice: über alles
  rationale: In Verbindung mit dem Bild der Thronbesteigung bezeichnet die Wendung den Herrschaftsbereich. „Über alles“ bewahrt zugleich die im Griechischen nicht näher bestimmte Reichweite.
- source_word: τὸν ἱερὸν ἡγεμόνα νοῦν
  choice: den heiligen Verstand … als Herrscher
  rationale: νοῦς meint hier das vernünftig urteilende und sittlich leitende Denkvermögen. Die prädikative Wiedergabe von ἡγεμόνα als „als Herrscher“ erhält die personale Herrschaftsmetapher, während „heilig“ den besonderen religiös-sittlichen Rang von ἱερός wiedergibt.
- source_word: διὰ τῶν αἰσθητηρίων
  choice: durch die Sinnesorgane
  rationale: αἰσθητήρια kann die Wahrnehmungsorgane oder Wahrnehmungsvermögen bezeichnen. „Sinnesorgane“ gibt die konkrete anthropologische Bildsprache und den instrumentalen Sinn von διά präzise wieder.
- source_word: ἐνεθρόνισεν
  choice: setzte … auf den Thron
  rationale: Die deutsche Wendung bewahrt das anschauliche königliche Bild des griechischen Verbs und macht die Einsetzung zur Herrschaft deutlich.
theological_decisions:
- issue: νοῦς als sittlich-vernünftige Leitinstanz des Menschen
  choice: Verstand
  alternative: Vernunft
  rationale: „Verstand“ bezeichnet verständlich das Denk- und Urteilsvermögen, ohne νοῦς auf bloße abstrakte Logik zu reduzieren; die Herrschaftsfunktion wird ausdrücklich durch „als Herrscher“ vermittelt. „Vernunft“ bleibt sachlich möglich, trägt im Deutschen jedoch stärkere philosophische Systemassoziationen.
- issue: Umfang von περὶ πάντων
  choice: über alles
  alternative: in jeder Hinsicht
  rationale: Die Übersetzung lässt offen, worauf sich „alles“ im Zusammenhang genau bezieht, und löst die anthropologische Herrschaftsaussage nicht durch eine dogmatisch engere Ergänzung auf.
translation_notes:
  register: Moderne, würdige Standardsprache. Das königliche Bild der Thronbesteigung bleibt erhalten; zugleich wird die ungewöhnliche griechische Apposition durch „als Herrscher“ verständlich gemacht. Das Subjekt bleibt wie im griechischen Ausgangstext unausgesprochen und wird mit „er“ wiedergegeben.
