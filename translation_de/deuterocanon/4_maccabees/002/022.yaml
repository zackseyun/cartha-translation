    issue: „Sinnesorgane“ ist als Haupttext zu eng.
    rationale: αἰσθητήρια kann konkrete Organe, aber auch Sinne beziehungsweise Wahrnehmungsvermögen meinen. Die nicht festgelegte Wiedergabe „durch die Sinne“ erhält die lexikalische Spannweite.
  - severity: low
    issue: Die Wortgruppe „durch die Sinnesorgane als Herrscher über alles“ ist syntaktisch schwer lesbar.
    rationale: Die Umstellung und die attributive Fassung „herrschenden Verstand“ verdeutlichen, dass der Verstand eingesetzt wird und über alles herrscht.
