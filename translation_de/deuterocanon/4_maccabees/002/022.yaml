  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: τηνικαῦτα („damals“), die zusätzliche Aussagekraft von δέ/καί, die Einsetzung durch ἐνεθρόνισεν, der Herrschaftsbereich περὶ πάντων und das instrumentale διὰ τῶν αἰσθητηρίων. „Sinnesorgane“ legt αἰσθητήρια jedoch enger auf körperliche Organe fest, während der griechische Ausdruck ebenso die Sinne bzw. Wahrnehmungsfähigkeiten bezeichnen kann. „Durch die Sinne“ bewahrt diese Offenheit besser und entspricht auch der englischen Audit-Spur.'
  naturalness: Die vorliegende Satzstellung ist verständlich, aber „den heiligen Verstand durch die Sinnesorgane als Herrscher über alles auf den Thron“ ist im Deutschen schwer zu gliedern. Die Stellung von „über alles“ unmittelbar bei der Thronmetapher und die attributive Wiedergabe von ἡγεμόνα machen den Satz flüssiger, ohne das Bild abzuschwächen.
  terminology: „Verstand“ ist für νοῦς im Kontext vertretbar, sofern die Fußnote die umfassendere moralisch-rationale Bedeutung erläutert. „Herrschend“ gibt ἡγεμόνα als Charakterisierung des νοῦς idiomatischer wieder als die im Satz eingeschobene Prädikativgruppe „als Herrscher“. „Heilig“ wahrt ἱερός. Die Fußnote soll die Alternative „Vernunft“ sowie die Bedeutungsbreite von αἰσθητήρια nennen.
