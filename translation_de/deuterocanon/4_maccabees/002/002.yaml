  text: Accordingly[a], the self-controlled Joseph is praised[b], because by reason he mastered love of pleasure.
translation:
  language: de
  text: 'Daher wird der selbstbeherrschte Josef gelobt: Durch vernünftiges Denken[a] gewann er die Herrschaft über das Streben nach Genuss[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wortverbindung ist in dieser Textgestalt ungewöhnlich; wörtlich steht etwa: „durch die Vernunft, im Denken“. Gemeint ist offenbar die Ausübung vernünftiger Kontrolle.'
