lexical_decisions:
- source_word: ταύτῃ γοῦν
  choice: Dafür
  rationale: Die Wendung zieht eine Folgerung aus dem vorausgehenden Gedankengang und verweist zugleich auf die Art und Weise, in der Josef als Beispiel dient. „Dafür“ ist im Deutschen knapp und natürlich.
- source_word: ὁ σώφρων
  choice: der besonnene
  rationale: σώφρων bezeichnet hier einen Menschen, dessen vernünftige Selbstbeherrschung die Leidenschaften zügelt. „Besonnen“ wahrt sowohl den Vernunftbezug als auch den ethischen Akzent.
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: Gebräuchliche deutsche Namensform.
- source_word: ἐπαινεῖται
  choice: wird gelobt
  rationale: Direkte und natürliche Wiedergabe des passiven Präsens.
- source_word: τῷ λογισμῷ διανοίᾳ
  choice: durch vernünftiges Denken
  rationale: Die in dieser Textgestalt syntaktisch auffällige Verbindung von λογισμός und διάνοια wird als zusammengehöriger Hinweis auf die Betätigung des vernünftigen Denkvermögens wiedergegeben; die Unebenheit wird in einer Fußnote kenntlich gemacht.
- source_word: περιεκράτησεν
  choice: gewann ... die Herrschaft über
  rationale: Das Verb bezeichnet, dass jemand etwas überwindet und unter seine Herrschaft bringt. Die Formulierung bewahrt das für 4 Makkabäer wichtige Motiv der Herrschaft der Vernunft über die Leidenschaften.
- source_word: τῆς ἡδυπαθείας
  choice: die Genusssucht
  rationale: ἡδυπάθεια bezeichnet die Hingabe an beziehungsweise das Verlangen nach angenehmem Genuss. „Genusssucht“ ist prägnant, ethisch markiert und im Deutschen verständlich, ohne die Bedeutung ausschließlich auf Sexualität zu verengen.
theological_decisions:
- issue: Ethisch-philosophische Begrifflichkeit in 4 Makkabäer
  choice: Die vernünftige Selbstbeherrschung wird durch „besonnen“, „vernünftiges Denken“ und „die Herrschaft über“ hervorgehoben.
  alternative: „selbstbeherrscht“ / „durch die Vernunft“ / „überwand“
  rationale: Der Vers gehört zur Leitthese des Buches, dass vernünftiges Denken die Leidenschaften beherrschen kann. Die gewählte Formulierung erhält diesen Zusammenhang, ohne spätere konfessionelle Kategorien einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt vermeidet eine schwerfällige kausale Nebensatzkonstruktion. „Besonnen“ und „Genusssucht“ sind allgemein verständlich und bewahren den ethisch-philosophischen Ton.
