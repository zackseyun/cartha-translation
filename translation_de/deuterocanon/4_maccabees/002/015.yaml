base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/015.yaml
  text: 'And reason is seen to prevail even over the more violent passions: love of power[a], empty glory, boastfulness, arrogance[b], and envy.'
translation:
  language: de
  text: 'Auch über die heftigeren Leidenschaften erweist sich die Vernunft als Herrin: über Herrschsucht, eitle Ruhmsucht, Prahlerei, Überheblichkeit und Neid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »Neid« übersetzte griechische Wort kann auch missgünstige Bosheit oder den »bösen Blick« bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῶν βιαιοτέρων ... παθῶν
  choice: über die heftigeren Leidenschaften
  rationale: In Verbindung mit κρατεῖν bezeichnet διά mit dem Genitiv hier den Bereich, über den sich die Vernunft als überlegen erweist. πάθη meint im Kontext Leidenschaften oder Gemütsregungen, βιαιοτέρων deren größere Heftigkeit.
- source_word: κρατεῖν ... φαίνεται
  choice: erweist sich ... als Herrin
  rationale: Die Formulierung gibt die erkennbare oder nachweisbare Herrschaft der Vernunft über die Leidenschaften natürlich und würdig wieder. Das feminine Prädikatsnomen stimmt im Deutschen mit »Vernunft« überein.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: λογισμός bezeichnet in 4 Makkabäer die vernünftige Urteils- und Steuerungsfähigkeit. »Vernunft« bewahrt den philosophischen Leitbegriff knapp und verständlich.
- source_word: φιλαρχίας
  choice: Herrschsucht
  rationale: Das Wort bezeichnet das Verlangen nach Herrschaft oder Vorrang. »Herrschsucht« benennt diese ungeordnete Begierde prägnant.
- source_word: κενοδοξίας
  choice: eitle Ruhmsucht
  rationale: Das Kompositum bedeutet wörtlich eine leere oder nichtige Ruhmsuche. »Eitle Ruhmsucht« ist im modernen Deutschen verständlich und wahrt die Vorstellung eines vergeblich gesuchten Ansehens.
- source_word: ἀλαζονίας
  choice: Prahlerei
  rationale: Der Ausdruck bezeichnet prahlerische Selbstdarstellung und anmaßendes Auftreten. »Prahlerei« unterscheidet ihn von der folgenden inneren Überheblichkeit.
- source_word: μεγαλαυχίας
  choice: Überheblichkeit
  rationale: Das Wort bezeichnet stolze Selbsterhöhung beziehungsweise hochmütiges Großtun. »Überheblichkeit« hält es von der stärker nach außen tretenden »Prahlerei« unterscheidbar.
- source_word: βασκανίας
  choice: Neid
  rationale: »Neid« trifft den zentralen Sinn in dieser Lasterreihe; die mögliche Nebenbedeutung von missgünstiger, schädigender Bosheit wird in einer Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des philosophischen Schlüsselbegriffs ὁ λογισμός
  choice: die Vernunft
  alternative: vernünftiges Urteil; vernünftiges Denken
  rationale: »Vernunft« bewahrt den philosophischen Charakter und die Aussage von ihrer Herrschaft über die Leidenschaften, ohne eine spätere konfessionelle Deutung einzutragen.
- issue: Unterscheidung der einander überschneidenden Lasterbegriffe
  choice: eitle Ruhmsucht; Prahlerei; Überheblichkeit
  alternative: Eitelkeit; Anmaßung; Hochmut
  rationale: Die drei Ausdrücke werden nicht unter einem allgemeinen Begriff wie »Stolz« eingeebnet. So bleibt die rhetorische Häufung verwandter, aber unterscheidbarer Leidenschaften erhalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer philosophischer Diktion. Die Lasterreihe ist knapp und rhythmisch gehalten; »als Herrin« macht die von κρατεῖν ausgesagte Herrschaft idiomatisch sichtbar.
