  yaml_path: translation/deuterocanon/4_maccabees/002/004.yaml
  text: And reason is seen to prevail not only over the frenzy that drives pleasure[a], but also over every desire.
translation:
  language: de
  text: Doch es zeigt sich, dass die Vernunft nicht nur den rasenden Drang der Genusssucht beherrscht[a], sondern auch jedes Verlangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den aufstachelnden Drang nach Genuss“ bzw. „das rasende Getriebensein der Genusssucht“. Der griechische Ausdruck ist ungewöhnlich verdichtet und bildhaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: λογισμός bezeichnet in 4 Makkabäer die sittlich disziplinierte Fähigkeit vernünftigen Urteilens. „Vernunft“ ist prägnant und bewahrt den philosophischen Leitbegriff.
- source_word: φαίνεται
  choice: es zeigt sich
  rationale: Die unpersönliche Formulierung gibt wieder, dass die behauptete Überlegenheit erkennbar oder offenkundig wird, ohne φαίνεται zu einem bloßen unsicheren Anschein abzuschwächen.
- source_word: ἐπικρατεῖν
  choice: beherrscht
  rationale: Das Verb bezeichnet Überlegenheit und wirksame Herrschaft über etwas. „Beherrscht“ ist im Deutschen natürlich und passt zur Aussage über die Vernunft und die Begierden.
- source_word: τὴν τῆς ἡδυπαθείας οἰστρηλασίαν
  choice: den rasenden Drang der Genusssucht
  rationale: Die seltene, stark metaphorische Wendung verbindet genussorientierte Selbsthingabe mit dem Bild eines durch einen Stachel ausgelösten Getriebenseins oder Rasens. Die Übersetzung bewahrt sowohl den antreibenden als auch den heftigen Charakter.
- source_word: πάσης ἐπιθυμίας
  choice: jedes Verlangen
  rationale: ἐπιθυμία kann Verlangen, Begierde oder Begehren bezeichnen. „Jedes Verlangen“ ist allgemein genug und erhält den durch πάσης ausgedrückten umfassenden Anspruch.
theological_decisions:
- issue: Überlegenheit der Vernunft über die Leidenschaften
  choice: Die Vernunft wird als fähig dargestellt, sowohl den heftigen Drang zur Genusssucht als auch jedes Verlangen zu beherrschen.
  alternative: Die Vernunft scheint lediglich überlegen zu sein oder beherrscht nur bestimmte Begierden.
  rationale: Der Satz formuliert eine zentrale These des Buches über die Herrschaft der vernünftigen Urteilskraft über die Leidenschaften. „Es zeigt sich“ bewahrt φαίνεται, während „jedes Verlangen“ den uneingeschränkten Wortlaut des griechischen Textes erhält, ohne spätere anthropologische oder konfessionelle Kategorien einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die seltene griechische Metapher wird im Haupttext verständlich wiedergegeben; die Fußnote dokumentiert ihre bildhafte Verdichtung und mögliche Alternativen.
