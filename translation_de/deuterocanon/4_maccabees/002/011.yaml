translation:
  language: de
  text: Auch über die Zuneigung zu seiner Frau gewinnt er die Oberhand[a], wobei er sie wegen ihrer Gesetzlosigkeit zurechtweist;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch die Liebe zu seiner Frau beherrscht er.“ Das griechische Verb kann sowohl „die Oberhand gewinnen über“ als auch „beherrschen“ bedeuten; der Ausdruck bezeichnet die liebevolle Bindung innerhalb der Ehe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικρατεῖ
  choice: gewinnt … die Oberhand
  rationale: Das Verb bezeichnet, dass jemand über etwas die Herrschaft beziehungsweise das Übergewicht erlangt. Die Wendung gibt den starken Gedanken der Selbstbeherrschung wieder, ohne ihn unnötig zu verschärfen.
- source_word: τῆς πρὸς γαμετὴν φιλίας
  choice: über die Zuneigung zu seiner Frau
  rationale: γαμετή bezeichnet die Ehefrau; φιλία meint hier die liebevolle persönliche Bindung. „Zuneigung“ ist im Deutschen natürlich und legt den Ausdruck nicht einseitig auf romantische oder erotische Liebe fest.
- source_word: διὰ παρανομίαν
  choice: wegen ihres gesetzeswidrigen Handelns
  rationale: παρανομία bezeichnet ein Handeln gegen das Gesetz. Die Formulierung bewahrt den moralisch-rechtlichen Gehalt und macht den Bezug auf die zurechtgewiesene Frau im Deutschen verständlich.
- source_word: ἀπελέγχων
  choice: indem er … zurechtweist
  rationale: Das Partizip bezeichnet das Aufdecken und Rügen eines Fehlverhaltens. „Zurechtweisen“ trifft den tadelnden Sinn in natürlichem modernem Deutsch.
- source_word: αὐτήν
  choice: sie
  rationale: Das Pronomen bezieht sich grammatisch auf γαμετήν, die Ehefrau.
theological_decisions:
- issue: Herrschaft der Vernunft über eheliche Zuneigung
  choice: Die Aussage beschreibt, dass der Handelnde selbst über die Zuneigung zu seiner Frau die Oberhand gewinnt, wenn ihr gesetzeswidriges Verhalten Zurechtweisung verlangt.
  alternative: ἐπικρατεῖ kann auch direkter mit „beherrscht“ wiedergegeben werden.
  rationale: Der Zusammenhang von 4 Makkabäer betont die Herrschaft vernünftiger Urteilskraft über Leidenschaften und Bindungen. Die Übersetzung erhält diese starke ethische Aussage, ohne spätere konfessionelle Kategorien einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Ergänzung „Auch über …“ erhält den argumentativen Nachdruck des griechischen Satzes; das abschließende Semikolon spiegelt seinen fortlaufenden Charakter im Kontext.
