base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/003.yaml
  text: For while he was still young and in the prime of life for sexual union[a], he nullified by reason the sting of the passions.
translation:
  language: de
  text: Denn als er jung war und in der Blüte seiner sexuellen Kraft stand, machte er durch die Vernunft den Stachel[a] der Leidenschaften unwirksam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Antrieb der Leidenschaften“ oder „Raserei der Leidenschaften“. Das griechische Bild kann einen stechenden Reiz, einen antreibenden Impuls oder heftige Erregung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νέος
  choice: jung
  rationale: Das Adjektiv bezeichnet sein jugendliches Alter; „jung“ gibt die prädikative Konstruktion mit ὢν knapp und natürlich wieder.
- source_word: ἀκμάζων πρὸς συνουσιασμόν
  choice: für den Geschlechtsverkehr in voller Kraft stand
  rationale: ἀκμάζων bezeichnet volle Reife oder Kraft, während πρὸς συνουσιασμόν diese Kraft ausdrücklich auf den Geschlechtsverkehr bezieht. Die Formulierung ist klar und würdevoll, ohne den sexuellen Bezug abzuschwächen.
- source_word: ἠκύρωσεν
  choice: machte … unwirksam
  rationale: Das Verb bedeutet, etwas außer Kraft zu setzen oder seiner Wirkung zu berauben. Die gewählte Wendung bewahrt die entschiedene Wirksamkeitsaufhebung und klingt im Deutschen natürlich.
- source_word: τῷ λογισμῷ
  choice: durch die Vernunft
  rationale: λόγισμος ist ein Leitbegriff des 4. Makkabäerbuches für das vernünftige Denken, das die Leidenschaften beherrscht. „Vernunft“ wahrt diesen ethisch-philosophischen Zusammenhang.
- source_word: οἶστρον
  choice: Stachel
  rationale: Das Wort kann den Stich beziehungsweise den antreibenden Reiz einer Bremse und übertragen einen heftigen Antrieb oder eine Raserei bezeichnen. „Stachel“ erhält das anschauliche Bild und lässt dessen Bedeutungsbreite in einer Fußnote erkennen.
- source_word: τῶν παθῶν
  choice: der Leidenschaften
  rationale: πάθη bezeichnet hier die Affekte und Begierden, die von der Vernunft beherrscht werden sollen. „Leidenschaften“ entspricht dem ethischen Wortschatz des Werkes besser als das allgemeinere „Gefühle“.
theological_decisions:
- issue: Wiedergabe des ethisch-philosophischen Leitbegriffs λόγισμος
  choice: Vernunft
  alternative: vernünftiges Denken
  rationale: „Vernunft“ macht das zentrale Thema des Buches, die Herrschaft der frommen Vernunft über die Leidenschaften, prägnant sichtbar, ohne spätere philosophische oder konfessionelle Begriffsbestimmungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der explizite sexuelle Bezug des griechischen Textes bleibt erhalten. Der Fußnotenmarker steht bei „Stachel“, da sich die lexikalische Alternative auf οἶστρον bezieht; damit wird die fehlerhafte Positionierung der Markierung in der englischen Konsultationsfassung korrigiert.
