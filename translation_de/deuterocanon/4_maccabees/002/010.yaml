  terminology: „Gesetz“ und „Tugend“ sind für νόμος und ἀρετή terminologisch treffend und registergerecht. „Zuneigung zu den Eltern“ gibt εὔνοια kontextgemäß wieder, ohne den Begriff unzulässig auf Gehorsam oder bloße Pflicht zu verengen. Die Fußnoten bieten legitime lexikalische Alternativen.
