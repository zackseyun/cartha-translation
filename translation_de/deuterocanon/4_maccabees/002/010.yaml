  source_fidelity: 'Die Übersetzung folgt dem Griechischen genau: „das Gesetz“ gibt ὁ νόμος wieder; „ist auch stärker als“ gibt κρατεῖ mit dem Genitiv τῆς ... εὐνοίας idiomatisch als Vorrang/Überlegenheit wieder. „verrät nicht ... die Tugend“ bewahrt die Negation und die verstärkte Bedeutung von μὴ καταπροδιδοὺς, während „um ihretwillen“ den kausalen bzw. motivationalen Sinn von δι᾽ αὐτούς angemessen ausdrückt.'
