  yaml_path: translation/deuterocanon/4_maccabees/002/010.yaml
  text: For the law also prevails over affection toward parents[a], not betraying virtue on account of them[b];
translation:
  language: de
  text: Denn das Gesetz ist auch stärker als die Zuneigung zu den Eltern[a] und verrät nicht um ihretwillen[b] die Tugend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wohlwollen gegenüber den Eltern“ oder „die Hingabe an die Eltern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihretwegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Der bestimmte Artikel wird bewahrt; im Zusammenhang bezeichnet der Ausdruck das jüdische Gesetz beziehungsweise die Tora als maßgebliche sittliche Autorität.
- source_word: τῆς πρὸς γονεῖς εὐνοίας
  choice: als die Zuneigung zu den Eltern
  rationale: εὔνοια bezeichnet Wohlwollen oder eine wohlwollende, zugewandte Haltung. „Zuneigung“ gibt hier die familiäre und emotionale Dimension natürlich wieder, ohne Gehorsam hinzuzufügen.
- source_word: κρατεῖ
  choice: ist stärker als
  rationale: κρατέω bezeichnet hier Überlegenheit oder Vorherrschaft. Die vergleichende deutsche Formulierung gibt den durch den Genitiv ausgedrückten Vorrang verständlich wieder.
- source_word: μὴ καταπροδιδοὺς
  choice: und verrät nicht
  rationale: Das verstärkte Verb καταπροδίδωμι bezeichnet Preisgabe oder Verrat. Der koordinierte deutsche Satz bildet die adverbiale Partizipialkonstruktion natürlich ab.
- source_word: τὴν ἀρετήν
  choice: die Tugend
  rationale: ἀρετή ist ein philosophisch-ethischer Schlüsselbegriff des Werkes; „Tugend“ bewahrt diesen prägnanten Registerwert.
- source_word: δι᾽ αὐτούς
  choice: um ihretwillen
  rationale: διά mit Akkusativ bezeichnet Ursache oder Beweggrund. „Um ihretwillen“ hält den Bezug auf die Eltern fest und wahrt die mögliche Nuance „ihretwegen/für sie“.
theological_decisions:
- issue: Ethischer Vorrang des Gesetzes gegenüber der Zuneigung zu den Eltern
  choice: Das Gesetz wird als stärker als die Zuneigung zu den Eltern dargestellt, sodass die Tugend nicht ihretwegen preisgegeben wird.
  alternative: Das Gesetz beherrscht oder ordnet die Zuneigung zu den Eltern, ohne notwendig einen konkreten Konflikt vorauszusetzen.
  rationale: κρατεῖ mit Genitiv bezeichnet Überlegenheit beziehungsweise Herrschaft; die negative Partizipialkonstruktion macht den sittlichen Vorrang deutlich. Die Übersetzung behauptet nicht, familiäre Zuneigung sei an sich verwerflich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht philosophisch-ethischem Ton. „Tugend“ bleibt als Leitbegriff erhalten; die griechische Satzspannung zwischen Gesetz, Elternliebe und sittlicher Bewährung wird nicht konfessionell aufgelöst.
