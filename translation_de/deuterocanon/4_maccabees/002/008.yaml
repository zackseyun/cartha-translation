base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/008.yaml
  text: Therefore[a], even if someone is money-loving, by living under the law he compels his own way of life, lending to those in need without interest, and when the seventh year arrives[b], canceling the debt.
translation:
  language: de
  text: 'So bezwingt einer, der nach dem Gesetz lebt, selbst wenn er geldgierig ist, seine eigene Neigung: Er leiht Bedürftigen ohne Zinsen, und wenn das siebte Jahr eintritt[a], nimmt er den Verlust des Darlehens auf sich[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn die Siebener“ oder „wenn die Wochen eintreten“; gemeint ist wohl die gesetzliche Regelung des Schuldenerlasses im siebten Jahr.'
    reason: Die komprimierte griechische Formulierung und ihre gesetzliche Anspielung sollen sichtbar bleiben.
  - marker: b
    text: 'Oder: „erlässt er die Schuld“. Das griechische Partizip kann besonders den finanziellen Verlust betonen, den der Darlehensgeber durch den Erlass trägt.'
    reason: Die lexikalische Mehrdeutigkeit zwischen Schuldenerlass und dem Tragen des daraus entstehenden Verlusts wird bewahrt.
lexical_decisions:
- source_word: αὐτίκα γοῦν
  choice: So
  rationale: Die Wendung zieht eine unmittelbare Folgerung aus dem vorausgehenden Gedankengang; „So“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: τῷ νόμῳ πολιτευόμενος
  choice: der nach dem Gesetz lebt
  rationale: πολιτεύομαι bezeichnet hier die praktische Lebensführung; der Dativ benennt den Maßstab, nach dem das Leben gestaltet wird.
- source_word: φιλάργυρός
  choice: geldgierig
  rationale: Das Adjektiv bezeichnet einen Menschen, der am Geld hängt. „Geldgierig“ ist im modernen Deutsch natürlich und wahrt die negative Wertung.
- source_word: βιάζεται τὸν ἑαυτοῦ τρόπον
  choice: zwingt ... seine eigene Wesensart nieder
  rationale: βιάζεται drückt starken Zwang aus, während τρόπος hier die eigene Art oder Neigung meint. Die Formulierung macht verständlich, dass der Betreffende seine Neigung gewaltsam bezwingt.
- source_word: τοῖς δεομένοις
  choice: Bedürftigen
  rationale: Im Zusammenhang des zinslosen Darlehens sind Menschen gemeint, die materielle Hilfe benötigen.
- source_word: δανείζων χωρὶς τόκων
  choice: leiht ... ohne Zinsen
  rationale: Die Wendung wird direkt und in geläufigem modernem Deutsch wiedergegeben.
- source_word: τῶν ἑβδομάδων ἐνστασῶν
  choice: wenn die Siebenerzyklen eintreten
  rationale: Der griechische Plural lautet wörtlich „wenn die Siebener/Wochen eintreten“. Die Wiedergabe bewahrt die ungewöhnliche Form und lässt zugleich den gesetzlichen Siebenerzyklus erkennen.
- source_word: τὸ δάνειον ... χρεοκοπούμενος
  choice: nimmt ... beim Darlehen den Verlust auf sich
  rationale: Das seltene χρεοκοπούμενος kann das Erleiden beziehungsweise Tragen des durch den Schuldenerlass entstehenden Verlusts hervorheben. Die Formulierung wahrt diesen Aspekt, ohne die rechtliche Folge zu verschweigen.
theological_decisions:
- issue: Anspielung auf den gesetzlichen Schuldenerlass im siebten Jahr
  choice: Die ungewöhnliche Pluralform wird im Haupttext als „Siebenerzyklen“ bewahrt und in der Fußnote auf den Schuldenerlass im siebten Jahr bezogen.
  alternative: „Wenn das siebte Jahr eintritt, erlässt er die Schuld.“
  rationale: Der Kontext legt das Sabbatjahr und den gesetzlichen Schuldenerlass nahe, doch der griechische Wortlaut sagt nicht schlicht „siebtes Jahr“. Haupttext und Fußnote bewahren daher sowohl die Anspielung als auch die sprachliche Spannung.
- issue: Bedeutung von χρεοκοπούμενος
  choice: Der Haupttext betont das Auf-sich-Nehmen des finanziellen Verlusts.
  alternative: „erlässt er die Schuld“
  rationale: Das Partizip kann auf den praktischen Schuldenerlass zielen, zugleich aber besonders den Verlust des Darlehensgebers hervorheben. Diese Ambiguität wird durch Haupttext und Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem argumentativen Fluss des Griechischen, vermeidet jedoch unnötig altertümliche oder fachsprachliche Wendungen.
