translation:
  language: de
  text: Denn wenn die Vernunft die Leidenschaften nicht beherrschen könnte, hätte er nicht so gesprochen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ μὴ γὰρ
  choice: Denn wenn … nicht
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ; „wenn … nicht“ gibt die konditionale Struktur von εἰ μή im Deutschen natürlich wieder.
- source_word: ἐδύνατο
  choice: könnte
  rationale: Der Konjunktiv II bringt zusammen mit dem Folgesatz die nichtwirkliche Bedingung zum Ausdruck und gibt die bezeichnete Fähigkeit idiomatisch wieder.
- source_word: τῶν θυμῶν
  choice: die Leidenschaften
  rationale: θυμός kann Zorn, heftige Gemütsbewegung oder einen leidenschaftlichen Antrieb bezeichnen. Der Plural umfasst hier im philosophischen Zusammenhang die affektiven Regungen, über die die Vernunft Herrschaft ausüben kann; „Leidenschaften“ wahrt diese Breite.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: λογισμός bezeichnet in 4 Makkabäer die vernünftige Urteils- und Steuerungsfähigkeit. „Vernunft“ ist der geläufige deutsche philosophische Ausdruck und bleibt zugleich allgemein verständlich.
- source_word: κρατεῖν
  choice: beherrschen
  rationale: κρατέω bezeichnet hier das Ausüben von Herrschaft oder Kontrolle über etwas. „Beherrschen“ gibt diese starke Steuerung natürlich wieder.
- source_word: οὐκ ἂν εἶπεν
  choice: hätte er nicht gesprochen
  rationale: ἄν mit dem Aorist bezeichnet die nichtwirkliche Folge. Der deutsche Konjunktiv II der Vergangenheit bewahrt diese Bedeutung.
- source_word: οὕτως
  choice: so
  rationale: „So“ verweist knapp und idiomatisch auf die vorausgehende Aussage beziehungsweise deren Art und Inhalt zurück.
theological_decisions:
- issue: Philosophisch-anthropologische Bedeutung von λογισμός
  choice: die Vernunft
  alternative: das vernünftige Denken; die Urteilskraft
  rationale: Die Formulierung bewahrt die im Werk zentrale Spannung zwischen der vernünftigen Fähigkeit und den affektiven Antrieben, ohne daraus eine besondere anthropologische Lehrdefinition abzuleiten.
- issue: Bedeutungsumfang von θυμοί
  choice: die Leidenschaften
  alternative: die Zornesregungen; die heftigen Impulse
  rationale: Obwohl θυμός häufig Zorn bezeichnet, legt der philosophische Kontext hier einen weiteren Bezug auf heftige affektive Regungen nahe. „Leidenschaften“ erhält diesen größeren Umfang, ohne den möglichen Bezug zu Zorn auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Begründungs- und Bedingungsgefüge; philosophische Schlüsselbegriffe werden verständlich, aber nicht verflachend wiedergegeben.
