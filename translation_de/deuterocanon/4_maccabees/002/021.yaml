  text: For when God constructed man, he implanted both his passions and his dispositions.
translation:
  language: de
  text: Denn als Gott den Menschen formte, pflanzte er ihm sowohl Leidenschaften als auch Charakteranlagen ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁπηνίκα
  choice: als
  rationale: Die Konjunktion leitet hier bei einem punktuellen Aorist einen vergangenen Zeitpunkt ein; „als“ ist im Deutschen natürlicher und genauer als „wenn“.
- source_word: κατεσκεύασεν
  choice: formte
  rationale: Das Verb bezeichnet ein bewusstes Herstellen oder Gestalten. „Formte“ bewahrt diesen Gedanken in natürlichem, würdigem Deutsch, ohne mit „erschuf“ einen im griechischen Verb nicht ausdrücklich enthaltenen Schöpfungsterminus einzutragen.
- source_word: τὸν ἄνθρωπον
  choice: den Menschen
  rationale: Der artikulierte Singular ist generisch und bezeichnet den Menschen als Gattung beziehungsweise Repräsentanten der Menschheit.
- source_word: τὰ πάθη
  choice: seine Leidenschaften
  rationale: Im philosophischen Zusammenhang sind die affektiven Regungen und Triebe gemeint, nicht erlittene Leiden. „Leidenschaften“ erhält den für die Argumentation des Buches wichtigen moralpsychologischen Begriff.
- source_word: τὰ ἤθη
  choice: seine Charakteranlagen
  rationale: ἤθη bezeichnet hier charakterliche Prägungen oder Dispositionen. „Charakteranlagen“ ist verständlich und lässt offen, wie weit angeborene Neigungen oder ausgeprägte Eigenschaften gemeint sind.
- source_word: περιεφύτευσεν
  choice: pflanzte ... ein
  rationale: Die Wiedergabe bewahrt die Pflanzmetapher des griechischen Verbs und klingt im Deutschen natürlich.
theological_decisions:
- issue: Leidenschaften und Charakteranlagen als Bestandteil der göttlichen Formung des Menschen
  choice: 'Die Aussage wird unmittelbar wiedergegeben: Gott pflanzte dem Menschen die Leidenschaften und Charakteranlagen ein.'
  alternative: πάθη zu neutralen „Empfindungsfähigkeiten“ abzuschwächen oder Gottes unmittelbares Handeln nur indirekt auszudrücken.
  rationale: Der griechische Text schreibt Gott ausdrücklich das Einpflanzen von πάθη und ἤθη zu. Die damit verbundene anthropologische und theologische Spannung darf nicht stillschweigend gemildert werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Sachstil. „Denn“ wahrt den begründenden Anschluss durch γάρ. Die Satzstellung mit „ihm ... ein“ gibt αὐτοῦ idiomatisch als Zugehörigkeit zum Menschen wieder.
