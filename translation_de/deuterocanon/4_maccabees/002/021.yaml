    issue: Doppelte possessive Formulierung „ihm seine Leidenschaften und seine Charakteranlagen“
    rationale: Im Deutschen genügt nach „ihm“ die substantivische Paarform. „sowohl Leidenschaften als auch Charakteranlagen“ macht zugleich die im Griechischen ausdrücklich koordinierte Doppelheit klar und vermeidet eine mögliche, wenn auch geringe, Zuordnungsunschärfe von „seine“.
