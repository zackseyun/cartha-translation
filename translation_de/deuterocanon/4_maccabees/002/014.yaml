translation:
  language: de
  text: Auch fällt er die kultivierten Pflanzen der Kriegsgegner nicht, sondern bewahrt die der Feinde für die, die zugrunde gegangen sind,[a] und richtet das Gefallene wieder auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische aktive Partizip kann hier intransitiv verstanden werden: „für die, die zugrunde gegangen sind“. Es kann auch transitiv „für die, die [etwas] zugrunde gerichtet haben“ heißen; ein Objekt ist jedoch nicht genannt. Die genaue Beziehung zu den zuvor genannten Feinden und ihren Pflanzen bleibt knapp formuliert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Auch … nicht
  rationale: Setzt die vorausgehende verneinte Aussage koordinierend fort und klingt im Deutschen natürlicher als ein isoliertes „noch“.
- source_word: δενδροτομῶν
  choice: fällt
  rationale: Das Verb bezeichnet das Fällen beziehungsweise Abholzen von Bäumen; „fällt“ bewahrt das konkrete Bild und passt zum pflanzlichen Objekt.
- source_word: τὰ ἥμερα … φυτά
  choice: die kultivierten Pflanzen
  rationale: ἥμερα bezeichnet hier nicht wilde, sondern vom Menschen kultivierte Gewächse. „Pflanzen“ lässt die Weite von φυτά bestehen, ohne den Ausdruck ausschließlich auf Obstbäume zu verengen.
- source_word: τῶν πολεμίων
  choice: der Kriegsgegner
  rationale: πολέμιοι bezeichnet besonders Gegner im Krieg; die Wiedergabe unterscheidet das Wort sinnvoll vom folgenden ἐχθροί.
- source_word: τὰ δὲ τῶν ἐχθρῶν
  choice: sondern … die der Feinde
  rationale: Das substantivierte Neutrum nimmt am natürlichsten die zuvor genannten Pflanzen wieder auf. δέ trägt hier den Gegensatz zwischen Fällen und Bewahren.
- source_word: τοῖς ἀπολέσασιν
  choice: für diejenigen, die sie verloren haben
  rationale: Das aktive Aoristpartizip kann Personen bezeichnen, die etwas verloren haben; das ausgelassene Objekt wird aus den genannten Pflanzen ergänzt. Die gedrängte griechische Formulierung wird durch eine Fußnote kenntlich gemacht.
- source_word: διασώζων
  choice: bewahrt
  rationale: Gibt den Gedanken des sicheren Erhaltens knapp und idiomatisch wieder.
- source_word: τὰ πεπτωκότα
  choice: die umgestürzten
  rationale: Das substantivierte Partizip wird im unmittelbaren Zusammenhang auf die Pflanzen bezogen. „Umgestürzt“ ist bei Bäumen und größeren Gewächsen natürlicher als das allgemeinere „gefallen“.
- source_word: συνεγείρων
  choice: richtet … wieder auf
  rationale: Bewahrt das konkrete Bild des erneuten Aufrichtens und die wiederherstellende Bedeutung des Verbs.
theological_decisions:
- issue: Ethische Aussage über den Umgang mit dem Besitz von Gegnern
  choice: Der Text schildert Schonung und Wiederherstellung der Pflanzen von Gegnern.
  alternative: Die substantivierten Neutra allgemein als Eigentum oder als alles Gefallene verstehen.
  rationale: Der unmittelbare Bezug auf φυτά und δενδροτομῶν spricht für eine fortgesetzte konkrete Pflanzenmetaphorik. Die Aussage über maßvolles Verhalten gegenüber Gegnern bleibt dabei erhalten, ohne einen umfassenderen Eigentumsbegriff in den Text einzutragen.
- issue: Deutung von τοῖς ἀπολέσασιν
  choice: „für diejenigen, die sie verloren haben“
  alternative: „für diejenigen, die sie vernichtet haben“ oder passivisch „für die Umgekommenen“
  rationale: Die Form ist ein aktives Partizip und stützt die passive Wiedergabe „die umgekommen sind“ nicht unmittelbar. „Verloren haben“ ist eine mögliche aktive Bedeutung von ἀπόλλυμι und ergibt mit dem Dativ des Nutznießers einen verständlichen Sinn; die syntaktische Kürze bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Partizipialwendungen werden als finite Verben wiedergegeben. „Kriegsgegner“ und „Feinde“ bilden den griechischen Wechsel zwischen πολέμιοι und ἐχθροί ab; die substantivierten Neutra werden im unmittelbaren Pflanzenkontext konkret verstanden.
