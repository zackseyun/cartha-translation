  text: And what is surprising if the desires of the soul are nullified in relation to participation in beauty?[a]
translation:
  language: de
  text: Und was ist daran verwunderlich, wenn die Begierden der Seele im Blick auf die Teilhabe an der Schönheit außer Kraft gesetzt werden?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn die auf Teilhabe am Schönen gerichteten Begierden der Seele außer Kraft gesetzt werden“. Der Bezug der griechischen Wendung ist nicht ganz eindeutig.'
    reason: syntaktische und lexikalische Alternative
lexical_decisions:
- source_word: τί θαυμαστόν
  choice: was ist daran verwunderlich
  rationale: Die idiomatische rhetorische Frage gibt die Bedeutung von τί mit dem Adjektiv θαυμαστόν in natürlichem modernem Deutsch wieder.
- source_word: ἐπιθυμίαι
  choice: Begierden
  rationale: Der Plural bezeichnet Begehren oder Triebregungen. „Begierden“ wahrt hier den philosophischen Zusammenhang, ohne die Bedeutung auf ein einzelnes körperliches Verlangen zu verengen.
- source_word: ψυχῆς
  choice: der Seele
  rationale: „Seele“ bewahrt die anthropologische Begrifflichkeit des hellenistisch-jüdischen Gedankengangs; „Geist“ oder „Psyche“ wären enger beziehungsweise moderner gefärbt.
- source_word: ἀκυροῦνται
  choice: außer Kraft gesetzt werden
  rationale: Die passive Form bezeichnet, dass etwas unwirksam oder seiner Geltung beraubt wird. Die Wendung ist im Deutschen verständlicher als das fremdwortnahe „annulliert werden“.
- source_word: πρὸς
  choice: im Blick auf
  rationale: Die Wendung hält die abstrakte Beziehung zur μετουσία offen und legt nicht unnötig fest, ob die Präpositionalgruppe primär das Begehren oder dessen Außerkraftsetzung näher bestimmt.
- source_word: τοῦ κάλλους
  choice: der Schönheit
  rationale: κάλλος bedeutet unmittelbar „Schönheit“; eine ausdrücklich moralische Deutung wie „Edelmut“ wäre kontextuell möglich, ginge aber über den Wortlaut hinaus.
- source_word: μετουσίαν
  choice: Teilhabe
  rationale: „Teilhabe“ entspricht dem abstrakten philosophischen Gehalt von μετουσία und klingt im Deutschen würdevoll und verständlich.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχή
  choice: Seele
  alternative: inneres Selbst
  rationale: „Seele“ erhält die Begriffswelt der Auseinandersetzung zwischen Vernunft und Begierden, ohne sie in moderne psychologische Kategorien umzudeuten.
- issue: Ästhetisch-moralische Bedeutung von κάλλος
  choice: Schönheit
  alternative: das Schöne
  rationale: Der Haupttext bleibt bei der direkten abstrakten Bedeutung. Die Alternative „das Schöne“ macht den möglichen philosophischen Sinn sichtbar, ohne moralische Schönheit ausdrücklich festzuschreiben.
- issue: Syntaktischer Bezug von πρὸς τὴν τοῦ κάλλους μετουσίαν
  choice: im Blick auf die Teilhabe an der Schönheit
  alternative: die auf Teilhabe an der Schönheit gerichteten Begierden
  rationale: Die griechische Wortstellung lässt den genauen Bezug der Präpositionalgruppe offen. Die gewählte abstrakte Formulierung bewahrt diese Spannung, statt sie syntaktisch eindeutig dem Substantiv zuzuordnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem philosophischem Abstraktionsgrad. „Außer Kraft gesetzt“ ist verständlich, ohne die Aussage zu einer völligen Vernichtung der Begierden zu verschärfen.
