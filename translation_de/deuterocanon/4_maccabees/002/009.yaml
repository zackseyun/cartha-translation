base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/009.yaml
  text: 'And even if someone is stingy[a], he is restrained by the law through reason, neither gleaning the unharvested crops nor going over the vineyards again. And in other matters as well it is possible to recognize this: that reason is the master over the passions.'
translation:
  language: de
  text: 'Selbst wenn jemand geizig ist, wird er durch das Gesetz mithilfe der Vernunft in Schranken gehalten: Er sammelt weder die stehen gelassene Ernte ein noch hält er in den Weinbergen Nachlese.[a] Auch in anderen Fällen lässt sich daran erkennen, dass die Vernunft die Leidenschaften beherrscht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind Erntegebote, nach denen ein Teil des Feld- und Weinertrags stehen bleiben sollte. Das erste Verbot betrifft das Einsammeln der stehen gelassenen Ernte, das zweite das erneute Absuchen der Weinberge nach zurückgebliebenen Trauben.
    reason: lexical_and_contextual_clarification
lexical_decisions:
- source_word: φειδωλός
  choice: geizig
  rationale: Das Wort bezeichnet hier eine Person, deren Drang zum Behalten oder restlosen Aneignen durch das Gesetz begrenzt wird. „Sparsam“ klänge im Deutschen zu positiv, „knauserig“ zu umgangssprachlich.
- source_word: κρατεῖται ὑπὸ τοῦ νόμου διὰ τὸν λογισμόν
  choice: wird er durch vernünftige Überlegung vom Gesetz in Schranken gehalten
  rationale: Die Formulierung bewahrt das Gesetz als handelnde Kraft und λογισμός als Mittel. „In Schranken gehalten“ gibt den passiven Sinn von κρατεῖται idiomatisch wieder; „vernünftige Überlegung“ bezeichnet hier nicht bloß ein abstraktes Vermögen, sondern dessen konkrete Wirksamkeit.
- source_word: μήτε ἐπικαρπούμενος τοὺς ἀμήτους
  choice: Er bringt weder die Ernte bis zum letzten Rest ein
  rationale: Die seltene landwirtschaftliche Wendung steht im Zusammenhang mit dem Gebot, bei der Ernte etwas zur Nachlese zurückzulassen. Die Übersetzung macht den gemeinten vollständigen Zugriff auf den Ertrag verständlich, ohne eine technisch unsichere Einzelhandlung vorzutäuschen.
- source_word: μήτε ἐπιρρωγολογούμενος τοὺς ἀμπελῶνας
  choice: noch hält er in den Weinbergen Nachlese
  rationale: Das seltene Verb bezeichnet das Absammeln der nach dem ersten Erntegang verbliebenen Trauben. „Nachlese halten“ ist im Deutschen präzise und entspricht dem agrarrechtlichen Zusammenhang.
- source_word: ἐπὶ τῶν ἑτέρων
  choice: Auch an anderen Beispielen
  rationale: Die Wendung überträgt die Beobachtung vom genannten Erntegebot auf weitere Fälle; „Beispiele“ macht diesen argumentativen Bezug natürlich verständlich.
- source_word: τῶν παθῶν ἐστὶν ὁ λογισμὸς κρατῶν
  choice: dass die Vernunft die Leidenschaften beherrscht
  rationale: Die Übersetzung erhält die für das Werk zentrale Aussage, dass λογισμός über πάθη herrscht. „Leidenschaften“ wahrt den moralphilosophischen Sinn besser als das neutrale „Gefühle“.
theological_decisions:
- issue: Moralphilosophische Bedeutung von λογισμός
  choice: im ersten Satz „vernünftige Überlegung“, im Schlusssatz „die Vernunft“
  alternative: durchgehend „Vernunft“ oder „vernünftiges Urteil“
  rationale: Im instrumentalen Ausdruck bezeichnet λογισμός die wirksame vernünftige Überlegung, während es im zusammenfassenden Lehrsatz als herrschendes Vermögen erscheint. Die abgestufte Wiedergabe erhält beide Nuancen und denselben gedanklichen Zusammenhang.
- issue: Ethischer Gehalt von πάθη
  choice: Leidenschaften
  alternative: Gefühle; Begierden
  rationale: Gemeint sind nicht Gefühle schlechthin und auch nicht ausschließlich Begierden, sondern mächtige innere Regungen, die nach der Argumentation des Buches von der Vernunft beherrscht werden sollen.
- issue: Verhältnis von Gesetz und Vernunft
  choice: Das Gesetz hält den Menschen durch vernünftige Überlegung in Schranken
  alternative: Die Vernunft hält ihn aufgrund des Gesetzes in Schranken
  rationale: Die griechische Syntax nennt mit ὑπὸ τοῦ νόμου ausdrücklich das Gesetz als wirkende Instanz und mit διὰ τὸν λογισμόν die Vernunft beziehungsweise Überlegung als vermittelndes Mittel. Diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt verdeutlicht, dass die Erntegebote das konkrete Beispiel für die zügelnde Wirkung des Gesetzes sind. Der Fachklang von „Vernunft“ und „Leidenschaften“ bleibt wegen der zentralen moralphilosophischen Argumentation des Werkes erhalten.
