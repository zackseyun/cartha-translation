  source_fidelity: 'Die Übersetzung gibt die Satzglieder und Argumentation des Griechischen präzise wieder: πάντα ... πάθη als umfassende Gruppe verderblicher Leidenschaften, ὁ σώφρων νοῦς als ethisch qualifiziertes rationales Vermögen, ἀπωθεῖται als aktives Abwehren sowie θυμός und δεσπόζει als Zorn und dessen Beherrschung. Das zweimalige καί ist mit „ebenso auch“ und „auch über diesen“ angemessen abgebildet.'
