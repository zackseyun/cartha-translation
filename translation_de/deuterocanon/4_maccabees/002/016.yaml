base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/016.yaml
  text: For prudent reason drives away all these vicious passions[a], just as it also drives away anger; for it is master even over this.
translation:
  language: de
  text: Denn all diese verderblichen Leidenschaften weist der besonnene Verstand[a] von sich, ebenso auch den Zorn; denn auch über diesen ist er Herr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die selbstbeherrschte Vernunft«. Der griechische Ausdruck verbindet das vernünftige Denkvermögen mit Besonnenheit und Selbstbeherrschung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακόηθη
  choice: verderblich
  rationale: Das Adjektiv kennzeichnet die Leidenschaften als sittlich schlecht und schädlich. »Verderblich« gibt beides in natürlichem Deutsch wieder, ohne die Bedeutung unnötig zuzuspitzen.
- source_word: πάθη
  choice: Leidenschaften
  rationale: Im philosophisch-ethischen Zusammenhang bezeichnet das Wort ungeordnete innere Regungen und Triebe. »Leidenschaften« bewahrt diesen fachsprachlichen Klang besser als »Gefühle« oder »Leiden«.
- source_word: ὁ σώφρων νοῦς
  choice: der besonnene Verstand
  rationale: νοῦς bezeichnet hier das vernünftige Denkvermögen, während σώφρων Besonnenheit und disziplinierte Selbstbeherrschung ausdrückt. Die Formulierung ist verständlich und wahrt beide Aspekte.
- source_word: ἀπωθεῖται
  choice: weist … von sich
  rationale: Das Verb bezeichnet ein aktives Abwehren oder Zurückstoßen. »Von sich weisen« gibt die mediale Form und die wirksame Abwehr der Leidenschaften idiomatisch wieder.
- source_word: θυμός
  choice: Zorn
  rationale: Hier ist eine zu beherrschende Gemütsregung gemeint. »Zorn« entspricht dem ethischen Kontext und dem gehobenen, aber heutigen Register.
- source_word: δεσπόζει
  choice: ist … Herr
  rationale: Das Verb drückt starke Herrschaft und Kontrolle aus. »Über diesen ist er Herr« bewahrt dieses Bild und den betonten Gedanken, dass der Verstand sogar den Zorn beherrscht.
theological_decisions:
- issue: Anthropologisch-philosophische Wiedergabe von ὁ σώφρων νοῦς
  choice: der besonnene Verstand
  alternative: die selbstbeherrschte Vernunft
  rationale: Die gewählte Fassung lässt νοῦς als Denkvermögen und σώφρων als sittlich disziplinierte Besonnenheit erkennen. Die Fußnote hält die mögliche stärkere Betonung der Selbstbeherrschung offen, ohne die Spannung zwischen Vernunftvermögen und ethischer Haltung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Griechischen und das starke Herrschaftsbild im Schlusssatz bleiben erhalten; philosophische Schlüsselbegriffe werden verständlich, aber nicht verflachend wiedergegeben.
