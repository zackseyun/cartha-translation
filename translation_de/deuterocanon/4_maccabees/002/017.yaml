base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/017.yaml
  text: For although Moses was angered against Dathan and Abiron, he did nothing against them in anger, but with reason he restrained anger.
translation:
  language: de
  text: Mose war zwar über Dathan und Abeiron[a] zornig; doch tat er nichts im Zorn gegen sie, sondern lenkte seinen Zorn durch vernünftiges Urteil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch „Abeiron“; traditionell „Abiram“.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „sondern beherrschte seinen Zorn durch die Vernunft“. Das griechische Verb kann ein Lenken, Regeln oder Beherrschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμούμενος γέ τοι
  choice: war zwar … zornig
  rationale: Das Partizip wahrt, dass Mose tatsächlich Zorn empfand; „zwar … doch“ gibt die hervorhebend-konzessive Wirkung von γέ τοι und den anschließenden Gegensatz natürlich wieder.
- source_word: κατὰ Δαθὰν καὶ Ἀβειρών
  choice: über Dathan und Abeiron
  rationale: κατά bezeichnet hier die gegen Personen gerichtete feindselige Regung. Im Deutschen ist „über jemanden zornig sein“ idiomatischer als „gegen jemanden zornig sein“. „Abeiron“ folgt der griechischen Namensform.
- source_word: οὐ θυμῷ τι κατ᾽ αὐτῶν ἐποίησεν
  choice: doch tat er nichts im Zorn gegen sie
  rationale: Der modale beziehungsweise instrumentale Dativ θυμῷ bezeichnet Zorn als Handlungsantrieb oder Handlungsweise. Die deutsche Fassung bewahrt zudem den betonten Gegensatz zwischen empfundenem Zorn und zornbestimmtem Handeln.
- source_word: λογισμῷ
  choice: durch vernünftiges Urteil
  rationale: λογισμός bezeichnet im Argument des Buches nicht bloß abstrakte Vernunft, sondern die urteilende, steuernde Vernunft. „Vernünftiges Urteil“ macht diese philosophische Funktion verständlich, ohne unnötig technisch zu klingen.
- source_word: τὸν θυμὸν διήτησεν
  choice: lenkte seinen Zorn
  rationale: διαιτάω kann ein Regeln, Lenken oder Beherrschen bezeichnen. „Lenkte“ bewahrt die Vorstellung, dass die Vernunft die Leidenschaft ordnet, ohne zu behaupten, Mose habe überhaupt keinen Zorn mehr empfunden. Das Possessivpronomen ist im Deutschen zur natürlichen Bezugsklärung ergänzt.
theological_decisions:
- issue: Die Herrschaft der Vernunft über die Leidenschaften
  choice: durch vernünftiges Urteil … lenkte seinen Zorn
  alternative: durch die Vernunft beherrschte er seinen Zorn
  rationale: Die gewählte Fassung bewahrt das für 4 Makkabäer zentrale Verhältnis von λογισμός und θυμός, legt aber nicht ein vollständiges Unterdrücken oder Beseitigen des Zorns in den Text hinein.
- issue: Namensform Ἀβειρών
  choice: Abeiron
  alternative: Abiram
  rationale: Die Hauptfassung folgt der griechischen Quellform; die vertrautere, hebräisch geprägte Form wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Zorn“ bildet die griechische Wortfolge θυμούμενος – θυμῷ – θυμόν bewusst ab. Der Semikolon-Satz wahrt den engen argumentativen Gegensatz, bleibt aber gut lesbar.
