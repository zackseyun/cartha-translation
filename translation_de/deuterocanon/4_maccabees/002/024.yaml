  yaml_path: translation/deuterocanon/4_maccabees/002/024.yaml
  text: How then, someone might say, if reason rules over the passions, does it not also rule over forgetfulness and ignorance?
translation:
  language: de
  text: Wie kann es dann, so könnte jemand fragen, sein, dass die Vernunft zwar die Leidenschaften beherrscht, nicht aber das Vergessen und die Unwissenheit?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Wie kann es dann … sein
  rationale: Gibt die rhetorische Einwendung in natürlichem Deutsch wieder; die leicht entfaltete Form bewahrt den fragenden Sinn von πῶς und den folgernden Übergang mit οὖν.
- source_word: εἴποι τις ἄν
  choice: so könnte jemand fragen
  rationale: Der Optativ mit ἄν bezeichnet einen möglichen, hypothetischen Einwand. Im Deutschen passt „fragen“ zum folgenden Fragesatz und klingt natürlicher als „sagen“.
- source_word: τῶν παθῶν
  choice: die Leidenschaften
  rationale: πάθη bezeichnet im philosophisch-ethischen Gedankengang des Buches die inneren Regungen und Triebe, über die die Vernunft Herrschaft ausübt. „Leidenschaften“ bewahrt diesen etablierten, aber verständlichen Sinn.
- source_word: ὁ λογισμὸς
  choice: die Vernunft
  rationale: λογισμός meint hier das Vermögen vernünftigen Urteilens. „Vernunft“ ist prägnant, idiomatisch und dem philosophischen Zusammenhang angemessen.
- source_word: κρατεῖ
  choice: beherrscht
  rationale: κρατέω bezeichnet hier wirksame Herrschaft oder Kontrolle. „Beherrschen“ lässt sich im Deutschen natürlich sowohl mit den Leidenschaften als auch mit Vergessen und Unwissenheit verbinden.
- source_word: λήθης
  choice: das Vergessen
  rationale: λήθη bezeichnet Vergessen beziehungsweise den Verlust der Erinnerung. „Das Vergessen“ ist im heutigen Deutsch natürlicher als „Vergesslichkeit“, ohne den abstrakten Sinn aufzugeben.
- source_word: ἀγνοίας
  choice: die Unwissenheit
  rationale: ἀγνοία bedeutet fehlendes Wissen oder Unkenntnis. „Unwissenheit“ erhält den abstrakten und philosophischen Charakter des Ausdrucks.
theological_decisions:
- issue: Anthropologisch-philosophisches Verhältnis von πάθη und λογισμός
  choice: πάθη mit „Leidenschaften“ und λογισμός mit „Vernunft“ wiedergeben
  alternative: πάθη als „Gefühle“ oder „Regungen“ und λογισμός als „vernünftiges Urteil“ wiedergeben
  rationale: Die gewählte Begriffspaarung erhält die leitende Spannung des Buches zwischen vernünftiger Urteilskraft und den zu beherrschenden inneren Regungen, ohne Gefühle pauschal moralisch abzuwerten oder eine spätere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „zwar … nicht aber“ macht den im Griechischen knappen Gegensatz verständlich, ohne ihn inhaltlich aufzulösen. Keine Fußnote erforderlich.
