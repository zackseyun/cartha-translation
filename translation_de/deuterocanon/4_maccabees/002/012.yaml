translation:
  language: de
  text: Und sie beherrscht die Liebe zu Kindern[a], indem sie sie wegen ihrer Bosheit bestraft; und sie gebietet über die Verbundenheit mit Freunden, indem sie sie wegen ihrer Bosheit zurechtweist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Liebe der Kinder« und später »die Vertrautheit/der vertraute Umgang der Freunde«. Die Genitivverbindungen können die Zuneigung zu Kindern beziehungsweise die durch Umgang entstandene Bindung an Freunde bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κυριεύει
  choice: beherrscht
  rationale: Das Verb bezeichnet die Ausübung von Herrschaft oder Überlegenheit. »Beherrscht« gibt die starke Vorstellung der Kontrolle natürlich wieder und steht passend parallel zu δεσπόζει.
- source_word: τῆς τέκνων φιλίας
  choice: die Liebe zu den eigenen Kindern
  rationale: Der Genitiv bezeichnet hier am ehesten die auf die Kinder gerichtete Zuneigung. »Zu den eigenen Kindern« macht den elterlichen Bezug im Deutschen verständlich, ohne den Sinn auf eine bestimmte Gefühlsregung zu verengen.
- source_word: διὰ κακίαν αὐτῶν
  choice: wegen ihrer Bosheit
  rationale: διά mit Akkusativ nennt den Grund der Bestrafung; »Bosheit« bewahrt den moralischen Gehalt von κακία.
- source_word: κολάζων
  choice: indem sie sie … bestraft
  rationale: κολάζω bezeichnet hier ein strafendes Vorgehen. Die modale Wiedergabe des Partizips zeigt, wie die Herrschaft über die natürliche Zuneigung ausgeübt wird.
- source_word: τῆς φίλων συνηθείας
  choice: die Verbundenheit mit Freunden
  rationale: συνήθεια kann vertrauten Umgang, Vertrautheit oder eine durch Umgang entstandene Bindung bezeichnen. »Verbundenheit« ist idiomatisch und hält den relationalen Sinn offen.
- source_word: δεσπόζει
  choice: gebietet … über
  rationale: Das Verb bezeichnet Herrschaft oder Verfügungsgewalt und wahrt als kräftige, aber nicht identische Formulierung den Parallelismus mit κυριεύει.
- source_word: διὰ πονηρίας
  choice: wegen ihrer Schlechtigkeit
  rationale: πονηρία bezeichnet moralische Schlechtigkeit oder Bosheit. Die Wortwahl erhält gegenüber κακία eine leichte lexikalische Unterscheidung, ohne einen sicheren Bedeutungsunterschied zu behaupten.
- source_word: ἐξελέγχων
  choice: weist … zurecht
  rationale: ἐξελέγχω kann überführen, tadeln oder zurechtweisen bedeuten. Da Personen das Objekt sind, gibt »zurechtweisen« den tadelnden Sinn natürlich wieder, ohne zwingend eine gerichtliche Szene vorauszusetzen.
theological_decisions:
- issue: Das in diesem Vers nicht ausdrücklich genannte Subjekt
  choice: Das Pronomen »sie« führt das Subjekt aus dem Zusammenhang fort, ohne es im Vers erneut als »Vernunft« oder »vernünftige Selbstbeherrschung« zu benennen.
  alternative: Das Subjekt im Vers ausdrücklich mit »die Vernunft« oder »die vernünftige Selbstbeherrschung« wiederholen.
  rationale: Im griechischen Vers steht kein ausdrückliches Subjektsnomen. Die Übersetzung bewahrt diese kontextuelle Abhängigkeit und vermeidet es, die Deutung innerhalb des Verses enger festzulegen als die Vorlage.
- issue: Das Verhältnis von natürlicher Zuneigung und moralischer Zurechtweisung
  choice: Die Aussage wird als Herrschaft über die Zuneigung wiedergegeben, nicht als deren Aufhebung.
  alternative: So übersetzen, als werde die Liebe zu Kindern oder Freunden grundsätzlich verworfen.
  rationale: Die Verben beschreiben Kontrolle beziehungsweise Überordnung; der Anlass des Strafens und Zurechtweisens ist jeweils das schlechte Verhalten der geliebten Personen. Die natürlichen Bindungen werden daher nicht an sich verurteilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur des griechischen Satzes bleibt erkennbar; »beherrscht« und »gebietet über« bewahren zugleich die Variation der beiden Herrschaftsverben. Die wiederholten Pronomen sind trotz leichter Dichte beibehalten, damit klar bleibt, dass Kinder beziehungsweise Freunde wegen ihres eigenen Fehlverhaltens bestraft oder zurechtgewiesen werden.
