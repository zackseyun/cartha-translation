base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/018.yaml
  text: For, as I said, prudent reason is able to triumph over the passions, and to redirect some of them, and even to nullify others.
translation:
  language: de
  text: Denn die besonnene Vernunft vermag, wie ich sagte, über die Leidenschaften zu triumphieren, einige umzulenken und andere sogar unwirksam zu machen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρων νοῦς
  choice: die besonnene Vernunft
  rationale: σώφρων bezeichnet hier eine vernünftige, disziplinierte und urteilsfähige Haltung; νοῦς meint das vernünftige Erkenntnis- und Urteilsvermögen. „Besonnene Vernunft“ wahrt den philosophischen Gehalt und klingt im Deutschen natürlich.
- source_word: κατὰ τῶν παθῶν ἀριστεῦσαι
  choice: über die Leidenschaften zu triumphieren
  rationale: ἀριστεύω bezeichnet das Hervorragen beziehungsweise Sich-als-überlegen-Erweisen. Mit κατά und Genitiv gibt „über … triumphieren“ die erfolgreiche Überlegenheit gegenüber den πάθη treffend wieder.
- source_word: πάθη
  choice: Leidenschaften
  rationale: Im Gedankengang des 4. Makkabäerbuches sind damit Affekte und starke innere Antriebe gemeint. „Leidenschaften“ bewahrt den philosophischen Begriff besser als das allgemeinere „Gefühle“ und vermeidet die hier unpassende Bedeutung „Leiden“.
- source_word: μεταθεῖναι
  choice: umzulenken
  rationale: Das Verb bezeichnet ein Versetzen oder Verändern. „Umlenken“ bringt hier zum Ausdruck, dass manche Leidenschaften in ihrer Richtung verändert, nicht einfach beseitigt werden.
- source_word: ἀκυρῶσαι
  choice: außer Kraft zu setzen
  rationale: ἀκυρόω bedeutet, etwas unwirksam oder ungültig zu machen. Die Wendung „außer Kraft setzen“ bildet den stärkeren Gegensatz zum bloßen Umlenken verständlich ab.
- source_word: τὰ μὲν αὐτῶν ... τὰ δὲ καί
  choice: die einen von ihnen … die anderen sogar
  rationale: Die korrelative Konstruktion unterscheidet zwei Gruppen von Leidenschaften und steigert die zweite Aussage durch καί. Diese Gegenüberstellung bleibt im Deutschen ausdrücklich erhalten.
theological_decisions:
- issue: Anthropologisch-philosophisches Verhältnis von νοῦς und πάθη
  choice: Die Aussage wird als Überlegenheit der besonnenen Vernunft gegenüber den Leidenschaften wiedergegeben, ohne sie in spätere dogmatische Kategorien einzuordnen.
  alternative: νοῦς neutraler als „Geist“ oder „Verstand“ und πάθη weiter als „Gefühle“ wiederzugeben.
  rationale: Der Vers argumentiert im Rahmen hellenistisch-jüdischer Affektenlehre. „Vernunft“ und „Leidenschaften“ bewahren diese Spannung zwischen rationalem Urteilsvermögen und inneren Antrieben, ohne eine vollständige Gefühllosigkeit zu unterstellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der griechischen Steigerung von Umlenkung zu Unwirksammachung, bleibt aber flüssig und allgemein verständlich.
