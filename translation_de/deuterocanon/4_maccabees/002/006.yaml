review_pass:
  verdict: revise
  source_fidelity: Der kausale Anschluss „Da“ gibt ὅτε („wenn/als“, hier mit gegenwartsbezogener allgemeiner Aussage) nicht treffend wieder. Die übrigen zentralen Begriffe und die parallele Aussage über Begierden und die der Gerechtigkeit hinderlichen Leidenschaften sind sachgerecht wiedergegeben.
  naturalness: Die Übersetzung ist insgesamt modernes, gut lesbares Standarddeutsch. Mit „Wenn das Gesetz uns sagt“ wird der Satzanschluss idiomatisch und näher am griechischen ὅτε formuliert.
  terminology: „begehren/Begierden“ bewahrt die lexikalische Verbindung von ἐπιθυμεῖν und ἐπιθυμίαι; „Vernunft“ für λογισμός, „beherrschen“ für κρατεῖν und „Gerechtigkeit“ für δικαιοσύνη sind angemessen. „umso mehr“ gibt πολὺ πλέον etwas unmittelbarer wieder als „erst recht“.
  issues:
  - severity: medium
    issue: „Da das Gesetz … gesagt hat“
    rationale: „Da“ macht den Nebensatz kausal, während ὅτε primär temporal bzw. allgemein einleitend ist. Der griechische Satz argumentiert nicht, weil das Gesetz dies gesagt habe, sondern knüpft daran an, wann bzw. wenn das Gesetz das Begehren untersagt.
