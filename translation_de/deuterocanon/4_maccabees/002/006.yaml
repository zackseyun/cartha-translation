  yaml_path: translation/deuterocanon/4_maccabees/002/006.yaml
  text: And yet, when the law tells us not to desire, I could much more persuade you that reason is able to master desires, just as it also masters the passions that hinder righteousness.
translation:
  language: de
  text: 'Und doch: Wenn das Gesetz uns sagt, nicht zu begehren, könnte ich euch umso mehr davon überzeugen, dass die Vernunft die Begierden beherrschen kann – ebenso wie die Leidenschaften, die der Gerechtigkeit im Weg stehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμεῖν / ἐπιθυμιῶν
  choice: begehren / Begierden
  rationale: Die verwandten deutschen Wörter bewahren die Wiederaufnahme desselben griechischen Wortstamms; „begehren“ passt zudem zum Wortlaut des Gesetzes, während der Plural „Begierden“ die einzelnen Regungen bezeichnet.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: Gemeint ist das vernünftige Urteils- und Steuerungsvermögen, ein Schlüsselbegriff der Argumentation in 4 Makkabäer.
- source_word: κρατεῖν
  choice: beherrschen
  rationale: Das Verb bezeichnet wirksame Herrschaft oder Kontrolle über Begierden und Leidenschaften, nicht deren völlige Beseitigung.
- source_word: τῶν κωλυτικῶν τῆς δικαιοσύνης παθῶν
  choice: die Leidenschaften, die der Gerechtigkeit im Weg stehen
  rationale: Diese natürliche Formulierung gibt die attributive Bedeutung von κωλυτικῶν wieder und bewahrt δικαιοσύνη als „Gerechtigkeit“.
- source_word: πολὺ πλέον
  choice: erst recht
  rationale: Die idiomatische Wendung drückt die gesteigerte Überzeugungskraft gegenüber dem vorausgehenden Argument aus.
theological_decisions:
- issue: Reichweite der Herrschaft der Vernunft
  choice: „beherrschen kann“
  alternative: „beseitigen kann“ oder „nicht mehr empfindet“
  rationale: Der griechische Text behauptet Kontrolle über Begierden und Leidenschaften, nicht notwendig deren Auslöschung.
- issue: Bedeutung von δικαιοσύνη
  choice: „Gerechtigkeit“
  alternative: „gerechtes Handeln“
  rationale: Das abstrakte Substantiv wird bewusst nicht auf bloßes Verhalten verengt; so bleibt seine ethische und mögliche theologische Weite erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den dichten griechischen Satz, der Gedankenstrich macht die parallele Ergänzung verständlich. Es sind keine Fußnoten nötig.
