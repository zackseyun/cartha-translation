- from: 'Und doch: Da das Gesetz uns gesagt hat, dass wir nicht begehren sollen, könnte ich euch erst recht davon überzeugen, dass die Vernunft die Begierden beherrschen kann – ebenso wie die Leidenschaften, die der Gerechtigkeit im Weg stehen.'
  to: 'Und doch: Wenn das Gesetz uns sagt, nicht zu begehren, könnte ich euch umso mehr davon überzeugen, dass die Vernunft die Begierden beherrschen kann – ebenso wie die Leidenschaften, die der Gerechtigkeit im Weg stehen.'
  rationale: Die sichere, geringfügige Änderung ersetzt den kausalen Anschluss durch „Wenn“ und wahrt damit die Funktion von ὅτε. Die Gegenwartsform „sagt“ ist im Deutschen für den fortgeltenden Wortlaut des Gesetzes natürlich; die Aussage des griechischen Perfekts bleibt dadurch als geltende gesetzliche Anweisung erfasst. Die übrige Formulierung wird beibehalten; „umso mehr“ verdeutlicht die Steigerung von πολὺ πλέον.
