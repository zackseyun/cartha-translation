base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/019.yaml
  text: For why does our all-wise father Jacob blame those around Simeon and Levi for slaughtering the Shechemites en masse[a], not with reason, saying[b], “Cursed be their anger”?
translation:
  language: de
  text: 'Denn warum tadelt unser allweiser Vater Jakob Simeon und Levi samt ihren Leuten dafür, dass sie die Sichemiter als ganzes Volk nicht aus vernünftiger Überlegung niedermetzelten[a], mit den Worten[b]: »Verflucht sei ihr Zorn!«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die knappe griechische Wendung kann auch enger auf Jakobs Tadel bezogen werden: Er tadelte sie nicht ohne vernünftigen Grund.'
    reason: lexical_alternative
  - marker: b
    text: Die Worte greifen 1. Mose 49,7 auf.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπεὶ διὰ τί
  choice: Denn warum
  rationale: Bewahrt sowohl den begründenden Anschluss an den vorherigen Gedankengang als auch die rhetorische Frage und klingt im modernen Deutschen natürlich.
- source_word: ὁ πάνσοφος ἡμῶν πατὴρ Ἰακώβ
  choice: unser allweiser Vater Jakob
  rationale: »Allweise« erhält den gehobenen, umfassenden Sinn von πάνσοφος, ohne das Epitheton zu verflachen.
- source_word: τοὺς περὶ Συμεὼν καὶ Λευεὶν
  choice: Simeon und Levi samt ihren Leuten
  rationale: Die Wendung οἱ περὶ mit Personennamen kann die genannten Personen einschließlich ihres Gefolges bezeichnen. Diese Formulierung schließt Simeon und Levi selbst ein und bleibt verständlich.
- source_word: αἰτιᾶται
  choice: tadelt
  rationale: Gibt den Sinn des Vorwurfs beziehungsweise der Missbilligung in würdigem, geläufigem Deutsch wieder.
- source_word: μὴ λογισμῷ
  choice: nicht von vernünftiger Überlegung geleitet
  rationale: Bringt den Kontrast zwischen vernünftiger Erwägung und leidenschaftlich bestimmtem Handeln zum Ausdruck, lässt die gedrängte griechische Zuordnung aber durch Stellung und Fußnote erkennbar.
- source_word: τοὺς Σικιμίτας
  choice: die Sichemiter
  rationale: Eingebürgerte deutsche Bezeichnung für die Bewohner Sichems.
- source_word: ἐθνηδόν
  choice: als ganzes Volk
  rationale: Das Adverb bezeichnet die kollektive Tötung der Gruppe als Volk und ist hier genauer als ein bloßes »massenhaft«.
- source_word: ἀποσφάξαντας
  choice: niedermetzelten
  rationale: Gibt die starke, gewaltsame Bedeutung des Verbs deutlich wieder, ohne den Ton zu verharmlosen.
- source_word: Ἐπικατάρατος ὁ θυμὸς αὐτῶν
  choice: Verflucht sei ihr Zorn!
  rationale: Bewahrt den Fluchcharakter der Aussage und den Bezug auf Genesis 49,7 in natürlicher deutscher Form.
theological_decisions:
- issue: Bezug und Sinn von μὴ λογισμῷ
  choice: Die Wendung beschreibt das Gemetzel als nicht von vernünftiger Überlegung geleitet.
  alternative: 'Die Wendung könnte enger zum Tadel Jakobs gezogen werden: Jakob tadelt sie nicht ohne vernünftigen Grund.'
  rationale: Die griechische Stellung bei den Partizipien legt den Bezug auf die Tat nahe, während der Zusammenhang zugleich voraussetzt, dass Jakobs Tadel vernünftig begründet ist. Die Fußnote bewahrt die syntaktische Mehrdeutigkeit, statt sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche markieren die syntaktisch gedrängte Wendung μὴ λογισμῷ; das kräftige »niedermetzeln« entspricht der Gewaltsamkeit von ἀποσφάζω.
