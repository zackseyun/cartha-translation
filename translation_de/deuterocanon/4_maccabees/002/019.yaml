  source_fidelity: Die Übersetzung gibt die rhetorische Frage, Jakobs Tadel, die Gruppenbezeichnung um Simeon und Levi, die kollektive Tötung der Sichemiter sowie das Genitivzitat zutreffend wieder. μὴ λογισμῷ steht jedoch im Deutschen besser unmittelbar bei der Tötungshandlung; die bisherige Einschubformulierung „nicht von vernünftiger Überlegung geleitet“ ist syntaktisch schwerfällig und kann den Bezug unnötig verwischen.
  naturalness: „Denn warum“, „unser allweiser Vater Jakob“ und „Verflucht sei ihr Zorn!“ entsprechen einem gehobenen, aber modernen biblischen Register. Eine direkte adverbiale Formulierung zu „niedermetzelten“ liest sich natürlicher als der Gedankenstrich-Einschub.
  terminology: „Simeon und Levi samt ihren Leuten“ gibt τοὺς περὶ Συμεὼν καὶ Λευεὶν angemessen einschließlich der Genannten wieder. „Sichemiter“, „als ganzes Volk“ und „niedermetzelten“ sind sachgerecht. Die Fußnote soll die umstrittene syntaktische Zuordnung neutral benennen, ohne eine Lesart als gesichert auszugeben.
