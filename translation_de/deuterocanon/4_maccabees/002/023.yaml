  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die einzelnen Begriffe insgesamt zuverlässig wieder: τούτῳ („ihm“), νόμον („ein Gesetz“), καθʼ ὃν („nach dem“), die politische Nuance von πολιτευόμενος, den resultativ-prospektiven Optativ und die vier Tugendbegriffe sind erkennbar erhalten. Die deutsche Fassung lässt jedoch den Bezug von „nach dem“ syntaktisch unnötig schwanken und gestaltet die durch βασιλείαν bezeichnete Herrschaft als „Reich“ mit den personbezogenen Tugendadjektiven semantisch etwas unglücklich.'
  naturalness: „Nach dem er sein Leben als Bürger führen und … herrschen sollte“ ist verständlich, aber durch die Koordination schwerfällig; zudem kann „nach dem“ zunächst temporal aufgefasst werden. „Nach dessen Maßgabe“ macht den Bezug auf das Gesetz und den normativen Maßstab im Deutschen klarer. „Eine … Königsherrschaft ausüben“ erlaubt es, die Tugendattribute idiomatisch auf die Herrschaft zu beziehen.
  terminology: „Besonnen“, „gerecht“, „gut“ und „mutig“ sind angemessene moderne Wiedergaben. „Als Bürger leben“ bewahrt den staatsbürgerlichen Klang von πολιτευόμενος. „Königsherrschaft“ ist im Haupttext hier vorzuziehen, ohne die mögliche Bedeutung „Reich“ auszuschließen; die Fußnote dokumentiert diese Ambiguität.
  issues:
