base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/023.yaml
  text: And to him he gave a law[a], according to which, by conducting himself as a citizen[b], he would rule a kingdom that was self-controlled and just and good and courageous.
translation:
  language: de
  text: Und er gab ihm ein Gesetz, nach dessen Maßgabe er als Bürger leben und eine besonnene, gerechte, gute und mutige Königsherrschaft ausüben sollte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Königsherrschaft“ kann hier auch „Reich“ bedeuten; das griechische βασιλεία kann sowohl die königliche Herrschaft als auch den Herrschaftsbereich bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: ihm
  rationale: Der Dativ bezeichnet den zuvor genannten Menschen als Empfänger des Gesetzes.
- source_word: νόμον
  choice: ein Gesetz
  rationale: Das artikellose Substantiv bezeichnet hier eine dem Menschen gegebene, maßgebende Ordnung.
- source_word: καθʼ ὃν
  choice: nach dem
  rationale: Die Formulierung wahrt den Bezug auf das Gesetz und klingt im Deutschen natürlich.
- source_word: πολιτευόμενος
  choice: sein Leben als Bürger führen
  rationale: Die Wendung bewahrt den bürgerlich-politischen Sinn von πολιτεύομαι, ohne ihn auf bloßes Regieren oder allgemeine Lebensführung zu verengen.
- source_word: βασιλεύσειε
  choice: herrschen sollte
  rationale: Der Optativ bezeichnet im rückblickenden Zusammenhang die beabsichtigte beziehungsweise erwartete Folge der Gesetzesgabe.
- source_word: βασιλείαν
  choice: Reich
  rationale: βασιλεία kann Reich, Königsherrschaft oder Königtum meinen; „Reich“ ist als Objekt von „herrschen über“ idiomatisch, während die Mehrdeutigkeit in der Fußnote vermerkt wird.
- source_word: σώφρονά
  choice: besonnenes
  rationale: „Besonnen“ umfasst Selbstbeherrschung und vernünftige Mäßigung und eignet sich zugleich als Charakterisierung eines Reiches beziehungsweise einer Herrschaft.
- source_word: δικαίαν
  choice: gerechtes
  rationale: Im staatsbürgerlich-politischen Kontext steht die öffentliche und ethische Gerechtigkeit im Vordergrund.
- source_word: ἀγαθήν
  choice: gutes
  rationale: Die schlichte Wiedergabe erhält die breite positive Bedeutung des griechischen Adjektivs.
- source_word: ἀνδρείαν
  choice: mutiges
  rationale: „Mutig“ gibt die Tugend der Tapferkeit wieder, ohne die im Deutschen missverständliche geschlechtliche Nebenbedeutung von „männlich“ einzuführen.
theological_decisions:
- issue: Das Verhältnis von πολιτευόμενος zu königlicher Herrschaft
  choice: Den staatsbürgerlichen Sinn mit „sein Leben als Bürger führen“ bewahren.
  alternative: „nach dem Gesetz leben“, „sich selbst regieren“ oder „den Staat verwalten“
  rationale: Der griechische Ausdruck stellt auch den Herrscher als jemanden dar, dessen öffentliches Leben unter dem Gesetz steht. Die Übersetzung bewahrt diese moralisch-politische Spannung, ohne sie lehrhaft auszudeuten.
- issue: Bedeutung von βασιλείαν
  choice: „Reich“ im Haupttext, mit Hinweis auf „Königsherrschaft“ beziehungsweise „Königtum“ in der Fußnote.
  alternative: „Königsherrschaft“ oder „Königtum“ unmittelbar im Haupttext
  rationale: Der griechische Begriff kann sowohl den Herrschaftsbereich als auch das königliche Herrschen bezeichnen. Der Haupttext bleibt verständlich, die echte Bedeutungsbreite wird jedoch nicht verschwiegen.
- issue: Wiedergabe von δικαίαν in der Tugendreihe
  choice: „gerecht“
  alternative: „rechtschaffen“
  rationale: Da der Vers ein Reich beziehungsweise eine Herrschaft beschreibt, bringt „gerecht“ die öffentliche und politische Dimension am klarsten zum Ausdruck.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau folgt dem argumentativen Gefüge des Griechischen, vermeidet aber unnötige Schwerfälligkeit. Die bürgerlich-politische Färbung von πολιτευόμενος und die Bedeutungsbreite von βασιλεία bleiben erhalten.
