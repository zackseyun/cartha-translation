    issue: Syntaktische Bindung von „nach dem“
    rationale: Die Verbindung „nach dem er … führen und … herrschen sollte“ kann im Deutschen vorübergehend temporal gelesen werden und bündelt Partizip und Prädikat etwas unklar. Eine explizite Bezugnahme auf das Gesetz verbessert die Lesbarkeit ohne Bedeutungsänderung.
  - severity: low
    issue: „besonnenes, gerechtes, gutes und mutiges Reich“
    rationale: Die griechischen Adjektive können bei βασιλεία zwar den Herrschaftsbereich charakterisieren, wirken bei deutschem „Reich“ aber besonders bei „besonnen“ und „mutig“ weniger idiomatisch. „Königsherrschaft“ bringt die ethisch-politische Charakterisierung der Herrschaft natürlich zum Ausdruck und wahrt die lexikalische Spannweite in einer Fußnote.
  revised_text: Und er gab ihm ein Gesetz, nach dessen Maßgabe er als Bürger leben und eine besonnene, gerechte, gute und mutige Königsherrschaft ausüben sollte.[a]
