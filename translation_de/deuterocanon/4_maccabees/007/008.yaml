base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/008.yaml
  text: Such men must be those who establish the law with their own blood[a], and defend it with noble sweat through sufferings unto death.
translation:
  language: de
  text: Solche Männer müssen es sein, die das Gesetz mit ihrem eigenen Blut[a] zur Geltung bringen und es mit edlem Schweiß unter Leiden bis zum Tod verteidigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die das Gesetz aufrechterhalten«. Das griechische Verb kann »schaffen«, »hervorbringen« oder »bewirken« bedeuten; hier ist wohl gemeint, dass sie dem Gesetz durch ihr treues Handeln Geltung verschaffen, nicht dass sie es erlassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτους
  choice: Solche Männer
  rationale: Das Demonstrativpronomen bezeichnet Männer von der zuvor beschriebenen Art. Die Wiedergabe ist natürlich und bewahrt den männlichen Bezug des Kontexts.
- source_word: δεῖ εἶναι
  choice: müssen es sein
  rationale: Gibt die Notwendigkeit knapp wieder und fügt sich idiomatisch in die deutsche Satzkonstruktion.
- source_word: τοὺς δημιουργοῦντας τὸν νόμον
  choice: die das Gesetz zur Geltung bringen
  rationale: δημιουργέω bedeutet grundsätzlich schaffen oder hervorbringen; im Zusammenhang treuer Leidensbereitschaft geht es jedoch nicht um Gesetzgebung, sondern darum, das Gesetz durch eigenes Handeln wirksam zu bestätigen. »Zur Geltung bringen« bewahrt diesen vollziehenden Sinn.
- source_word: ἰδίῳ αἵματι
  choice: mit ihrem eigenen Blut
  rationale: Der instrumentale Dativ bezeichnet das Mittel; die konkrete und opferbereite Bildsprache bleibt erhalten.
- source_word: γενναίῳ ἱδρῶτι
  choice: mit edlem Schweiß
  rationale: Die ungewöhnliche, körperliche Metapher des griechischen Textes wird bewusst bewahrt. »Edel« gibt die Verbindung von innerer Größe und Tapferkeit in γενναῖος wieder.
- source_word: τοῖς μέχρι θανάτου πάθεσιν
  choice: unter Leiden bis zum Tod
  rationale: πάθη bezeichnet erduldete Leiden; μέχρι θανάτου markiert den Tod als äußerste Grenze, ohne mehr über den Ausgang auszusagen.
- source_word: ὑπερασπίζοντας
  choice: verteidigen
  rationale: Das Partizip bezeichnet das Eintreten zur Verteidigung. Als mitgedachtes Objekt wird das zuvor genannte Gesetz im Deutschen durch »es« aufgenommen.
theological_decisions:
- issue: Bedeutung von δημιουργοῦντας τὸν νόμον
  choice: die das Gesetz zur Geltung bringen
  alternative: die das Gesetz aufrechterhalten / die das Gesetz schaffen
  rationale: Die Männer erlassen das Gesetz nicht, sondern bestätigen und verwirklichen seine Geltung durch treues Handeln und Leiden. Die Übersetzung vermeidet daher das irreführende »schaffen«, ohne die aktive Kraft des Verbs einzuebnen.
- issue: Männlicher Bezug der griechischen Konstruktion
  choice: Solche Männer
  alternative: Solche Menschen / Solche müssen es sein
  rationale: Die maskuline Artikel-Partizip-Konstruktion bezieht sich im unmittelbaren Zusammenhang auf beispielhafte Männer. Dieser Bezug wird beibehalten, statt ihn zu verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante körperliche Bildsprache »Blut« und »edler Schweiß« bleibt erhalten; die Satzstruktur ist zugleich für heutige Leser verständlich.
