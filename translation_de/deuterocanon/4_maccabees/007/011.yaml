base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/011.yaml
  text: For just as the father Aaron[a], armed with the censer, running through the midst of the multitude, overcame the fire-bearing angel,
translation:
  language: de
  text: Denn wie Vater Aaron, mit dem Räuchergefäß bewaffnet, durch die Volksmenge eilte und den feuerentfachenden Engel[a] überwand,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Feuerbringer“ oder „Engel, der Feuer entzündet“. Die Formulierung spielt wohl auf Aarons Eingreifen während der Plage in 4. Mose 16 an.'
    reason: ἐμπυριστής kann einen mit Feuer verbundenen oder Feuer entzündenden Akteur bezeichnen. Die Anspielung erklärt den Hintergrund, ohne die Identität des Engels über den griechischen Wortlaut hinaus festzulegen.
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Denn wie
  rationale: Gibt sowohl die begründende Funktion von γάρ als auch den mit ὥσπερ eingeleiteten Vergleich in natürlichem Deutsch wieder.
- source_word: ὁ πατὴρ Ἀαρὼν
  choice: Vater Aaron
  rationale: Bewahrt die ehrende Bezeichnung Aarons als Stammvater, ohne den im Deutschen unnatürlichen Artikel „der Vater Aaron“ zu erzwingen.
- source_word: τῷ θυμιατηρίῳ καθωπλισμένος
  choice: mit dem Räuchergefäß bewaffnet
  rationale: Der instrumentale Dativ wird mit „mit“ wiedergegeben; „bewaffnet“ erhält die ausgeprägte kämpferische Bildsprache des Partizips.
- source_word: διὰ τοῦ ἔθνοπλήθους
  choice: durch die Volksmenge
  rationale: Das seltene Kompositum bezeichnet die dicht gedrängte Menge des Volkes. „Volksmenge“ ist knapp und bildet die Wortgestalt des Griechischen erkennbar ab.
- source_word: ἐπιτρέχων
  choice: eilte
  rationale: Bezeichnet eine schnelle, dringliche Bewegung. „eilte“ klingt im Zusammenhang natürlicher als „rannte“, ohne die Dynamik abzuschwächen.
- source_word: τὸν ἐμπυριστὴν ἄγγελον
  choice: den feuerbringenden Engel
  rationale: Gibt die Verbindung des Engels mit dem Entfachen oder Bringen von Feuer wieder, ohne ihn im Haupttext ausdrücklich als „Vernichtungsengel“ zu identifizieren.
- source_word: ἐνίκησεν
  choice: überwand
  rationale: Bewahrt die Sieges- und Kampfsprache von νικάω und passt zugleich zur erhöhten, aber verständlichen Sprache des Abschnitts.
theological_decisions:
- issue: Identität und Funktion des Engels in der Anspielung auf Aarons Eingreifen während der Plage
  choice: feuerbringender Engel
  alternative: Feuerengel; Engel, der das Feuer entfachte; Vernichtungsengel
  rationale: Der griechische Ausdruck verbindet den Engel ausdrücklich mit Feuer, benennt ihn aber nicht eindeutig als „Vernichtungsengel“. Die wahrscheinlich zugrunde liegende Anspielung auf 4. Mose 16 wird daher nicht interpretierend in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kämpferische Metaphorik von „bewaffnet“ und „überwand“ bleibt erhalten. Das abschließende Komma bewahrt den offenen Vergleichssatz, der im folgenden Vers fortgeführt wird.
