base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/003.yaml
  text: In no way did he turn aside the rudders of godliness[a], until he sailed into the harbor of victory over death.
translation:
  language: de
  text: Keineswegs lenkte er die Steuerruder der Gottesfurcht um, bis er zum Hafen des Sieges über den Tod[a] segelte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher, aber im Zusammenhang weniger wahrscheinlich: „zum Hafen des Sieges des Todes“. Die griechische Genitivverbindung ist gedrängt und lässt beide Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατʼ οὐδένα τρόπον
  choice: Auf keine Weise
  rationale: Die Wendung ist eine nachdrückliche Verneinung. „Auf keine Weise“ bewahrt ihre volle Stärke und entspricht dem würdevollen Ton des Satzes.
- source_word: μετέτρεψεν
  choice: lenkte ... um
  rationale: Das Verb bezeichnet ein Wenden, Verändern oder Abbringen. „Lenkte ... um“ fügt sich in das durch οἴακας und ἔπλευσεν bestimmte Seefahrtsbild und drückt eine Kursänderung aus.
- source_word: τοὺς ... οἴακας
  choice: die Steuerruder
  rationale: οἴαξ bezeichnet ein Ruder beziehungsweise Steuerruder. Der Plural des Griechischen und das konkrete nautische Bild bleiben erhalten.
- source_word: τῆς εὐσεβείας
  choice: der Gottesfurcht
  rationale: εὐσέβεια meint hier die ehrfürchtige, treue Ausrichtung auf Gott. „Gottesfurcht“ gibt den religiösen Bezug deutlicher wieder als das im heutigen Sprachgebrauch teils abgeschwächte „Frömmigkeit“.
- source_word: ἕως οὗ
  choice: bis
  rationale: Die Konjunktion markiert den zeitlichen Endpunkt und wird im Deutschen natürlich mit „bis“ wiedergegeben.
- source_word: ἔπλευσεν ἐπὶ ... λιμένα
  choice: in den Hafen ... einlief
  rationale: Das griechische Verb bedeutet wörtlich „segelte“; zusammen mit ἐπί und dem Akkusativ bezeichnet es die Fahrt zum Ziel. Das deutsche „in den Hafen einlief“ bewahrt das nautische Bild und formuliert die erreichte Ankunft idiomatisch.
- source_word: τὸν τῆς θανάτου νίκης λιμένα
  choice: den Hafen des Sieges über den Tod
  rationale: Die gedrängte Genitivverbindung lässt νίκης als „Sieg“ und θανάτου als dessen Bezugsgröße verstehen. Im Lob standhaften Martyriums liegt die Deutung als Sieg über den Tod nahe; die formal mögliche Gegenlesart wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Deutung der Genitivverbindung τῆς θανάτου νίκης
  choice: Sieg über den Tod
  alternative: Sieg des Todes
  rationale: Der griechische Genitiv θανάτου kann bei νίκης objektiv („Sieg über den Tod“) oder subjektiv („Sieg des Todes“) verstanden werden. Der Zusammenhang preist die Standhaftigkeit bis zum Martyrium und stützt daher die erste Lesart, ohne die grammatische Mehrdeutigkeit völlig aufzuheben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das durchgängige Seefahrtsbild wird mit „Steuerruder“, „lenkte ... um“ und „in den Hafen ... einlief“ konkret bewahrt; unnötige konfessionelle Festlegungen werden vermieden.
