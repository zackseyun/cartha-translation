  terminology: „Tugend“, „Mühsal“, „Leidenschaften“ und „Frömmigkeit“ sind angemessene, registergerechte Entsprechungen. Die Fußnote zu „Frömmigkeit“ erklärt εὐσέβεια zutreffend als auf Gott bezogene ehrfürchtige Hingabe; „Gottesverehrung“ bleibt sinnvoll als Alternative genannt.
