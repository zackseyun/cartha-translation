    rationale: Die Formulierung „dass es selig ist, ... zu ertragen“ ist zwar semantisch nachvollziehbar, entspricht aber nicht gut dem angestrebten modernen Standarddeutsch. Eine behutsame idiomatische Anpassung ist angezeigt.
