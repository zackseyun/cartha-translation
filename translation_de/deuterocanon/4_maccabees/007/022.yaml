base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/022.yaml
  text: And knowing that it is blessed to endure every pain for the sake of virtue[a], would he not prevail over the passions for the sake of godliness?
translation:
  language: de
  text: Und da er weiß, dass es ein Glück ist, um der Tugend willen jede Mühsal zu ertragen, würde er da nicht um der Frömmigkeit willen die Leidenschaften bezwingen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Frömmigkeit“ meint hier die ehrfürchtige Hingabe an Gott; auch „Gottesverehrung“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: da er weiß
  rationale: Das kausal zu verstehende Partizip wird im Deutschen natürlich als begründender Nebensatz wiedergegeben.
- source_word: διὰ τὴν ἀρετήν
  choice: um der Tugend willen
  rationale: ἀρετή bezeichnet hier im ethisch-philosophischen Sinn moralische Vortrefflichkeit; „Tugend“ bewahrt diesen Leitbegriff.
- source_word: πάντα πόνον
  choice: jede Mühsal
  rationale: πόνος umfasst Schmerz, Anstrengung und Beschwernis. „Mühsal“ hält diese Bedeutungsbreite besser offen als das engere „Schmerz“.
- source_word: ὑπομένειν
  choice: zu ertragen
  rationale: Die Wendung bezeichnet standhaftes Ausharren unter Mühe oder Leid und wird idiomatisch mit „ertragen“ wiedergegeben.
- source_word: μακάριόν ἐστιν
  choice: es selig ist
  rationale: μακάριος bezeichnet einen begnadeten, glückseligen Zustand und nicht bloß persönlichen Nutzen; „selig“ erhält den religiös-ethischen Wertton.
- source_word: περικρατήσειεν
  choice: sollte ... bezwingen
  rationale: Der Optativ mit ἄν steht in einer rhetorischen Frage und bezeichnet das zu erwartende Erlangen der Herrschaft über etwas. „Bezwingen“ gibt den Gedanken der Überlegenheit prägnant wieder.
- source_word: τῶν παθῶν
  choice: die Leidenschaften
  rationale: πάθη ist in 4 Makkabäer ein philosophisch-ethischer Fachbegriff für starke, den Menschen antreibende Regungen; „Leidenschaften“ bewahrt diesen Sinn.
- source_word: διὰ τὴν εὐσέβειαν
  choice: um der Frömmigkeit willen
  rationale: εὐσέβεια meint hier die ehrfürchtige Hingabe an Gott. „Frömmigkeit“ ist die knappe deutsche Entsprechung und lässt sich bei Bedarf durch die Fußnote erläutern.
theological_decisions:
- issue: Verhältnis von Tugend, Leidenschaften und Gottesbezug
  choice: Die Begriffe werden als „Tugend“, „Leidenschaften“ und „Frömmigkeit“ wiedergegeben.
  alternative: „Vortrefflichkeit“, „Regungen“ und „Gottesverehrung“
  rationale: So bleiben sowohl der hellenistisch-ethische Rahmen als auch die ausdrücklich religiöse Ausrichtung des Satzes sichtbar, ohne die Leidenschaften pauschal mit allen Gefühlen gleichzusetzen.
- issue: Wertgehalt von μακάριον
  choice: „selig“
  alternative: „ein Glück“ oder „beglückend“
  rationale: „Selig“ bewahrt die mögliche religiöse Tiefendimension des Ausdrucks. Der Satz behauptet nicht bloß, das Erdulden sei zweckmäßig oder angenehm.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage wird mit „sollte er da nicht“ natürlich markiert. „Mühsal“ und „bezwingen“ sind leicht gehoben, bleiben aber allgemein verständlich und passen zum philosophisch-martyrologischen Kontext.
