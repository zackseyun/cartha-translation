  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe des griechischen Textes zuverlässig wieder: Das kausale Partizip εἰδώς, die beiden Präpositionalgruppen διὰ τὴν ἀρετήν / διὰ τὴν εὐσέβειαν, das standhafte Ertragen von πόνος und die rhetorische Frage mit dem potentialen Optativ περικρατήσειεν sind sachgerecht erfasst. „Leidenschaften“ trifft πάθη im philosophisch-ethischen Sinn. Die Wiedergabe von μακάριον mit der Konstruktion „es selig ist“ ist jedoch im modernen Standarddeutsch nicht idiomatisch genug.'
