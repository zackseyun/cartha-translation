  text: O you who are in harmony with the law and a philosopher of the divine way of life[a][b].
translation:
  language: de
  text: O du, der du mit dem Gesetz im Einklang bist und ein Philosoph einer göttlichen Lebensweise![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du, der du mit dem Gesetz übereinstimmst“. Das griechische Wort enthält das Bild von Zusammenklang oder Harmonie.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Philosoph einer gottgeweihten Lebensweise“. „Göttlich“ kann hier eine von der Hingabe an Gott geprägte Lebensführung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: O du
  rationale: Die Vokativpartikel leitet eine feierliche direkte Anrede ein; „O du“ bewahrt den gehobenen rhetorischen Ton und ist im Deutschen verständlich.
- source_word: σύμφωνε
  choice: mit … im Einklang
  rationale: σύμφωνος bezeichnet Übereinstimmung und trägt zugleich das Bild des Zusammenklangs; „im Einklang“ gibt beides natürlich wieder.
- source_word: νόμου
  choice: mit dem Gesetz
  rationale: Der Genitiv hängt von σύμφωνε ab. Im jüdischen Kontext ist das maßgebliche göttliche Gesetz gemeint; die Kleinschreibung vermeidet eine typografische Überdeutung.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die beiden Anreden beziehungsweise Charakterisierungen.
- source_word: φιλόσοφε
  choice: Philosoph
  rationale: Die direkte Wiedergabe erhält den ausdrücklich philosophischen Wortschatz des 4. Makkabäerbuchs.
- source_word: θείου
  choice: göttlichen
  rationale: Das Adjektiv wird formal bewahrt, ohne die Beziehung durch die eindeutigere Paraphrase „Gott ergeben“ festzulegen.
- source_word: βίου
  choice: Lebensweise
  rationale: βίος kann nicht nur das Leben, sondern auch die konkrete Art der Lebensführung bezeichnen; „Lebensweise“ ist hier im Deutschen idiomatischer als „Leben“.
theological_decisions:
- issue: Deutung von θείου βίου
  choice: einer göttlichen Lebensweise
  alternative: einer gottesfürchtigen Lebensweise; des göttlichen Lebens
  rationale: Die gewählte Formulierung wahrt die kompakte, gehobene Ausdrucksweise und lässt offen, ob die Lebensweise als „göttlich“ oder als von Hingabe an Gott geprägt verstanden wird.
- issue: Typografische Behandlung von νόμος
  choice: Gesetz
  alternative: GESETZ als ausdrücklich markierter Titel beziehungsweise eine anderweitige typografische Hervorhebung
  rationale: Der Kontext legt das jüdische Gesetz nahe, doch der griechische Text enthält kein typografisches Signal, das eine zusätzliche Hervorhebung verlangt.
translation_notes:
  register: Feierlich-rhetorische direkte Anrede in modernem Standarddeutsch. „O du“ erhält den pathetischen Vokativ; „im Einklang“ bewahrt das Klangbild des griechischen Ausdrucks. Die Satzellipse der griechischen Anrede bleibt erhalten.
