  text: O Eleazar[a], elder stronger than torments, old man more intense than fire[b], and king greater than sufferings.
translation:
  language: de
  text: O du Greis, stärker als die Folterqualen, du alter Mann, kraftvoller als das Feuer, und du König, größer als die Leiden, Eleasar!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασάνων
  choice: Folterqualen
  rationale: Im Martyriumskontext bezeichnet βάσανος konkrete Folter beziehungsweise die dadurch verursachten Qualen; „Folterqualen“ hält beides zusammen.
- source_word: βιαιότερε
  choice: gewaltiger als
  rationale: Der Komparativ von βίαιος bezeichnet größere Gewalt oder Kraft. „Gewaltiger“ bewahrt das Wortspiel, wonach Eleasars Widerstandskraft die Gewalt der Folter übertrifft, ohne ihn selbst als gewalttätig darzustellen.
- source_word: γέρων
  choice: Greis
  rationale: „Greis“ gibt die ehrende Anrede eines hochbetagten Mannes knapp wieder und erlaubt eine Unterscheidung vom folgenden πρεσβῦτα.
- source_word: πυρὸς
  choice: Feuer
  rationale: Wörtliche Wiedergabe; im Zusammenhang ist das Folterfeuer gemeint.
- source_word: εὐτονώτερε
  choice: kraftvoller als
  rationale: εὔτονος kann kräftig, angespannt, energisch oder standhaft bedeuten. „Kraftvoller“ wahrt die personale Aussage über Eleasar und den Vergleich mit dem Feuer.
- source_word: πρεσβῦτα
  choice: alter Mann
  rationale: Die zweite ehrende Altersanrede wird bewusst anders als γέρων wiedergegeben, sodass die rhetorische Doppelung sichtbar bleibt.
- source_word: παθῶν
  choice: Leiden
  rationale: Im Zusammenhang bezeichnet πάθη erlittene Qualen und Widerfahrnisse, nicht innere Leidenschaften.
- source_word: μέγιστε
  choice: größer als
  rationale: Der Superlativ steht mit einem vergleichenden Genitiv; im parallelen deutschen Satzbau ist „größer als“ die natürliche Wiedergabe.
- source_word: βασιλεῦ
  choice: König
  rationale: Die wörtliche, metaphorische Ehrenanrede bleibt erhalten; sie bezeichnet hier keine politische Amtsstellung.
- source_word: Ἐλεαζάρ
  choice: Eleasar
  rationale: „Eleasar“ ist die etablierte deutsche Namensform.
theological_decisions:
- issue: Metaphorische Ehrenanreden für Eleasar
  choice: Die dreifache Anrede als „Greis“, „alter Mann“ und „König“ wird bewahrt.
  alternative: Die Metaphern zu einer schlichten Aussage über Eleasars Stärke und Standhaftigkeit auflösen.
  rationale: Der griechische Text preist Eleasar in einer Folge gehobener Vokative. Eine erklärende Paraphrase würde die rhetorische Form einebnen und „König“ vorschnell auslegen.
translation_notes:
  register: Feierlich-gehobene, aber verständliche direkte Anrede. Die Wiederholung der Altersbezeichnungen und die drei Steigerungsvergleiche bilden die emphatische Rhetorik des Griechischen nach.
