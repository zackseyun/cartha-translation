  yaml_path: translation/deuterocanon/4_maccabees/007/016.yaml
  text: If[a], then, an old man despised tortures even to the point of death because of piety, then surely pious reason is ruler over the passions.
translation:
  language: de
  text: Wenn nun ein alter Mann die bis zum Tod reichenden Foltern wegen seiner Gottesfurcht verachtet hat, dann ist unbestreitbar die gottesfürchtige Vernunft Herrin über die Leidenschaften.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέρων
  choice: ein alter Mann
  rationale: Bezeichnet einen alten männlichen Menschen; die natürliche deutsche Wiedergabe bewahrt Numerus und Geschlecht.
- source_word: τῶν μέχρι θανάτου βασάνων
  choice: die Foltern bis zum Tod
  rationale: βάσανοι bezeichnet schwere körperliche Qualen beziehungsweise Foltern; μέχρι θανάτου gibt ihre äußerste, bis zum Tod reichende Dimension wieder.
- source_word: περιεφρόνησεν
  choice: verachtete
  rationale: Das Verb bezeichnet geringschätzige Missachtung und bewahrt die starke rhetorische Aussage, dass die Foltern gegenüber der Gottesfurcht für gering erachtet wurden.
- source_word: διʼ εὐσέβειαν
  choice: um seiner Gottesfurcht willen
  rationale: εὐσέβεια meint hier ehrfürchtige Hingabe an Gott. Die gewählte Formulierung lässt im Deutschen Beweggrund und Zielanklang zu; die alternative kausale Wiedergabe wird in der Fußnote genannt.
- source_word: ὁμολογουμένως
  choice: unbestreitbar
  rationale: Das Adverb kennzeichnet eine Folgerung als allgemein zugestanden beziehungsweise offenkundig anerkannt.
- source_word: ἡγεμὼν
  choice: Herrin
  rationale: Bezeichnet leitende oder herrschende Autorität. Wegen des grammatischen Geschlechts von »Vernunft« steht im Deutschen idiomatisch die feminine Form.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: πάθη bezeichnet im philosophischen Gedankengang die Leidenschaften beziehungsweise inneren Triebkräfte, nicht bloß Leiden oder sämtliche Gefühle.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  rationale: Die programmatische Wendung verbindet vernünftiges Urteilen mit ehrfürchtiger Ausrichtung auf Gott; »gottesfürchtig« ist im modernen Deutsch klarer und natürlicher als »fromm« oder »gottgefällig«.
theological_decisions:
- issue: Wiedergabe der programmatischen Wendung ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  alternative: die fromme Vernunft; die von Gottesfurcht geprägte Vernunft
  rationale: Die Wiedergabe bewahrt sowohl die rationale als auch die auf Gott ausgerichtete Dimension, ohne spätere Lehrbegriffe einzutragen.
- issue: Bedeutung von διʼ εὐσέβειαν
  choice: um seiner Gottesfurcht willen
  alternative: wegen seiner Gottesfurcht
  rationale: Die griechische Präpositionalphrase kann einen Grund oder eine Zweckausrichtung ausdrücken. Der Haupttext erhält den möglichen Zielanklang; die Fußnote nennt ausdrücklich die kausale Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der philosophische Schlüsselbegriff »Leidenschaften« bleibt erhalten; »gottesfürchtige Vernunft« macht den religiösen Bezug von εὐσεβής verständlich. Die konditionale Folgerungsstruktur des Griechischen wird mit »Wenn nun … dann« klar abgebildet.
