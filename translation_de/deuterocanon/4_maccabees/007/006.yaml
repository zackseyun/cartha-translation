  text: O priest[a], worthy of the priesthood, you did not defile your sacred teeth, nor did you make your stomach—which had room for godliness and purity—a partner in defiling food.
translation:
  language: de
  text: O Priester, des Priesteramtes würdig! Du hast deine heiligen Zähne nicht befleckt und auch deinen Magen, der Gottesfurcht und Reinheit Raum bot, nicht an befleckendem Essen teilhaben lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht mit befleckendem Essen in Gemeinschaft gebracht“. Das griechische Wort kann befleckendes oder unreines Essen, gegebenenfalls auch das Essen solcher Speisen, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ ἄξιε τῆς ἱερωσύνης ἱερεῦ
  choice: O Priester, des Priesteramtes würdig!
  rationale: Die Anrede und die ausdrückliche Würdigung werden beide bewahrt. Der Ausruf gibt die feierliche, emphatische Form des griechischen Vokativs natürlich wieder.
- source_word: ἐμίανας
  choice: befleckt
  rationale: Das Verb bezeichnet hier kultische und sittliche Verunreinigung. „Befleckt“ passt zum gehobenen Ton und bewahrt das Reinheitsmotiv.
- source_word: τοὺς ἱεροὺς ὀδόντας
  choice: deine heiligen Zähne
  rationale: Die auffällige körperliche Bildsprache des Griechischen bleibt bewusst erhalten; „heilig“ gibt ἱερός im kultischen Zusammenhang unmittelbar wieder.
- source_word: θεοσέβειαν
  choice: Gottesfurcht
  rationale: Das Wort bezeichnet ehrfürchtige, fromme Hinwendung zu Gott. „Gottesfurcht“ ist im Deutschen verständlich und wahrt den religiösen Gehalt.
- source_word: καθαρισμόν
  choice: Reinigung
  rationale: Die Wiedergabe behält gegenüber dem abstrakteren „Reinheit“ den Vorgangs- beziehungsweise kultischen Bedeutungsanteil des Substantivs bei.
- source_word: χωρήσασαν γαστέρα
  choice: deinen Magen, der ... Raum gegeben hatte
  rationale: χωρέω kann das Aufnehmen oder Raumgeben bezeichnen. Die Formulierung bewahrt die ungewöhnliche Metapher, bleibt aber in modernem Deutsch verständlich.
- source_word: ἐκοινώνησας
  choice: entweiht
  rationale: κοινόω bedeutet in diesem Reinheitskontext, etwas gemein beziehungsweise unrein zu machen. „Entweiht“ stellt den Gegensatz zum Heiligen idiomatisch heraus, ohne die kultische Dimension zu verlieren.
- source_word: μιεροφαγίᾳ
  choice: durch den Genuss befleckender Speisen
  rationale: Das seltene Kompositum bezeichnet verunreinigendes beziehungsweise frevelhaftes Essen. Die Formulierung hält sowohl den Essensvorgang als auch dessen befleckende Wirkung fest.
theological_decisions:
- issue: Kultische Reinheit wird auf Zähne, Magen und Essen bezogen
  choice: Die konkrete körperliche und kultische Bildsprache wird beibehalten.
  alternative: Den Vers allgemein als Weigerung umschreiben, unreine Speisen zu essen.
  rationale: Der griechische Text verbindet die Treue des Priesters absichtlich mit seinen Körperteilen und kultischer Reinheit. Eine abstrakte Umschreibung würde diese rhetorische Spannung abschwächen.
- issue: καθαρισμός als Zustand oder Vorgang
  choice: „Reinigung“
  alternative: „Reinheit“
  rationale: „Reinigung“ entspricht der nominalen Grundbedeutung enger; zugleich bleibt offen, ob ein Zustand kultischer Reinheit oder die Praxis beziehungsweise Wirkung der Reinigung im Vordergrund steht.
translation_notes:
  register: Feierlich-rhetorischer, zugleich klarer moderner Standard. Die ungewöhnlichen Wendungen „heilige Zähne“ und „Gottesfurcht und Reinigung Raum geben“ bleiben als bewusste Bilder des Ausgangstextes erhalten. Der Fußnotenmarker steht bei der Wendung, auf die sich die lexikalische Erläuterung tatsächlich bezieht.
