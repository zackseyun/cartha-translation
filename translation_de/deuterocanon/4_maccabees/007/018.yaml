base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/018.yaml
  text: But all who care for godliness with their whole heart[b][a], these alone are able to master the passions of the flesh.
translation:
  language: de
  text: Doch alle, die von ganzem Herzen auf Frömmigkeit bedacht sind[a] – nur sie können die Leidenschaften des Fleisches beherrschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich von ganzem Herzen um Gottesfurcht bemühen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „die Regungen des Fleisches in ihrer Gewalt halten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorausgehenden Gedankengang in natürlichem, würdigem Deutsch.
- source_word: ὅσοι
  choice: alle, die
  rationale: Gibt den pluralischen, umfassenden Bezug auf eine Personengruppe idiomatisch wieder.
- source_word: τῆς εὐσεβείας
  choice: auf Frömmigkeit
  rationale: „Frömmigkeit“ bezeichnet hier die auf Gott und sein Gesetz gerichtete Haltung, ohne eine konfessionelle Sonderdeutung einzutragen.
- source_word: προνοοῦσιν
  choice: bedacht sind
  rationale: Das Verb drückt achtsame, zielgerichtete Sorge aus; „auf … bedacht sein“ verbindet diesen Sinn natürlich mit „Frömmigkeit“.
- source_word: ἐξ ὅλης καρδίας
  choice: von ganzem Herzen
  rationale: Bewahrt das Bild des Herzens und bezeichnet ungeteilte Hingabe in geläufigem Deutsch.
- source_word: οὗτοι μόνοι
  choice: nur sie
  rationale: Erhält die nachdrückliche Beschränkung auf die zuvor genannte Gruppe.
- source_word: δύνανται κρατεῖν
  choice: können … beherrschen
  rationale: κρατεῖν bezeichnet hier wirksame Herrschaft oder Kontrolle, nicht bloß ein Abschwächen.
- source_word: τῶν τῆς σαρκὸς παθῶν
  choice: die Leidenschaften des Fleisches
  rationale: „Leidenschaften“ entspricht dem moralphilosophischen Sinn von πάθη; „Fleisch“ bewahrt den anthropologischen Ausdruck σάρξ, ohne ihn vorschnell als „sündige Natur“ auszulegen.
theological_decisions:
- issue: Wiedergabe von σάρξ im ethisch-anthropologischen Zusammenhang
  choice: Fleisch
  alternative: Körper; sündige Natur
  rationale: Der Vers spricht von mit dem leiblichen Menschsein verbundenen Leidenschaften, setzt „Fleisch“ aber nicht ausdrücklich mit einer „sündigen Natur“ gleich. Die wörtlichere Wiedergabe erhält diese Offenheit.
- issue: Wiedergabe von εὐσέβεια
  choice: Frömmigkeit
  alternative: Gottesfurcht; Ehrfurcht vor Gott
  rationale: „Frömmigkeit“ bezeichnet die umfassende, praktisch gelebte Ausrichtung auf Gott und sein Gesetz. „Gottesfurcht“ wäre möglich, würde den Bedeutungsumfang jedoch etwas stärker auf Ehrfurcht zuspitzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Gedankenbau „alle, die … – nur sie“ bewahrt die Hervorhebung des griechischen οὗτοι μόνοι; der Gedankenstrich macht diese Nachdrücklichkeit im Deutschen klar.
