  - severity: low
    issue: „noch schwerere“ ist stärker als der bloße Komparativ χαλεπωτέρων.
    rationale: Der Komparativ verlangt zwar einen Bezug auf zuvor genannte Leiden, aber „noch“ kann im Deutschen eine zusätzliche Steigerung nahelegen. „schwerere“ wahrt die Vergleichsoffenheit.
