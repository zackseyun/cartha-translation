  text: For this reason indeed[a], even young men, by philosophizing according to the reasoning of piety[b], overcame more severe tortures.
translation:
  language: de
  text: Gerade deshalb haben sogar junge Männer schwerere Folterqualen überwunden, indem sie nach dem Denken der Gottesfurcht philosophierten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „indem sie mit dem Denken der Gottesfurcht philosophierten“. Der griechische Ausdruck verbindet das Philosophieren mit einem von ehrfürchtiger Hingabe an Gott bestimmten Denken; das Verb kann auch gelebte philosophische Praxis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό γε τοι
  choice: Gerade deshalb
  rationale: Gibt die Folgerung διὰ τοῦτο wieder und bringt die bekräftigende Wirkung von γε τοι natürlich zum Ausdruck.
- source_word: μειρακίσκοι
  choice: junge Männer
  rationale: Bezeichnet männliche Jugendliche beziehungsweise junge Männer; die Formulierung ist modern und bewahrt den männlichen Bezug.
- source_word: τῷ τῆς εὐσεβείας λογισμῷ
  choice: vom Denken der Gottesfurcht
  rationale: λόγισμός bezeichnet vernünftiges Überlegen oder Denken; εὐσέβεια meint hier die ehrfürchtige Ausrichtung auf Gott. Die Formulierung bewahrt beide programmatischen Begriffe, ohne eine bestimmte dogmatische Deutung festzulegen.
- source_word: φιλοσοφοῦντες
  choice: und so Philosophie übten
  rationale: Bewahrt ausdrücklich das philosophische Vokabular des Verfassers. „übten“ bezeichnet eine gelebte philosophische Praxis und vermeidet das im Deutschen schwerfällige „philosophierten“.
- source_word: χαλεπωτέρων βασανιστηρίων
  choice: noch schwerere Folterqualen
  rationale: Der Komparativ χαλεπωτέρων wird ausdrücklich wiedergegeben; „Folterqualen“ bezeichnet im Kontext die erlittenen grausamen Martern natürlicher als mögliche Foltergeräte.
- source_word: ἐπεκράτησαν
  choice: überwunden
  rationale: Drückt aus, dass die jungen Männer sich gegenüber den Folterqualen als überlegen erwiesen und über sie triumphierten.
theological_decisions:
- issue: Verhältnis von Vernunft beziehungsweise Denken und Gottesfurcht
  choice: vom Denken der Gottesfurcht leiten ließen
  alternative: durch gottesfürchtige Vernunft
  rationale: Die gewählte Fassung lässt die Genitivbeziehung in τῆς εὐσεβείας λογισμός erkennbar und bewahrt die Spannung zwischen vernünftigem Denken und Gottesverehrung, statt beide vorschnell zu einem festen theologischen Fachbegriff zu verschmelzen.
- issue: Bedeutung von φιλοσοφοῦντες
  choice: Philosophie übten
  alternative: philosophierten
  rationale: Der Ausdruck hält am philosophischen Leitwort fest und macht zugleich deutlich, dass eine Lebenspraxis und nicht bloß theoretisches Nachdenken gemeint sein kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für natürliche Lesbarkeit leicht entfaltet, während die Leitbegriffe Denken, Gottesfurcht und Philosophie erhalten bleiben.
