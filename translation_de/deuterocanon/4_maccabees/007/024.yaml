  source_fidelity: 'Die Grundbedeutung ist getroffen: Die jungen Männer bestehen bzw. überwinden schwerere Folterungen aufgrund ihres von εὐσέβεια bestimmten λόγισμος. Die Umschreibung „die sich ... leiten ließen und so“ fügt jedoch eine nicht ausdrücklich vorliegende passive bzw. konsekutive Beziehung ein und lockert die unmittelbare Verbindung von τῷ ... λογισμῷ mit φιλοσοφοῦντες.'
  naturalness: „Vom Denken der Gottesfurcht leiten ließen und so Philosophie übten“ ist verständlich, wirkt aber umständlich. „Indem sie nach dem Denken der Gottesfurcht philosophierten“ ist modernes, würdiges Deutsch und bewahrt die philosophische Terminologie ausdrücklich.
  terminology: „Gottesfurcht“ gibt εὐσέβεια im gegebenen Gottesbezug angemessen wieder; „Denken“ kann λόγισμος hier vertreten. „Folterqualen“ und „überwunden“ sind kontextgerecht. Der Komparativ „schwerere“ bleibt offen und darf nicht durch ein zusätzliches „noch“ gegenüber einer nicht genannten Vergleichsgröße verschärft werden.
