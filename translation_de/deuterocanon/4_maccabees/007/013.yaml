  text: And yet[a], most astonishingly, though he was an old man, with the pains of his body already loosened, and his flesh relaxed, and even his sinews worn out, he renewed his youth.
translation:
  language: de
  text: 'Und doch geschah das Erstaunlichste: Obwohl er ein Greis war und seine körperlichen Kräfte bereits nachgelassen hatten, sein Fleisch erschlafft und selbst seine Sehnen ermüdet waren, wurde er wieder jung[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewann er neue Jugendkraft“. Das griechische Verb bezeichnet ein Wieder-jung-Werden oder die Erneuerung jugendlicher Kraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοι
  choice: Und doch
  rationale: Gibt den nachdrücklichen, einräumend-gegensätzlichen Übergang natürlich wieder.
- source_word: τὸ θαυμασιώτατον
  choice: geschah das Erstaunlichste
  rationale: Bewahrt den substantivischen Superlativ und macht seine Funktion als rhetorische Zuspitzung im Deutschen deutlich.
- source_word: γέρων ὤν
  choice: Obwohl er ein Greis war
  rationale: Der konzessive Sinn des Partizips ergibt sich aus dem Gegensatz zur erneuerten Jugendkraft; „Greis“ entspricht dem würdevollen, zugespitzten Register.
- source_word: λελυμένων ἤδη τῶν τοῦ σώματος πόνων
  choice: obwohl die Mühen seines Körpers ihn bereits entkräftet hatten
  rationale: πόνοι bezeichnet Mühen, Strapazen oder Schmerzen; zusammen mit λελυμένων und den folgenden Alterserscheinungen ist ein körperlicher Kräfteverfall gemeint. Die Formulierung bleibt nahe am Bild, ohne das im Deutschen missverständliche „gelöste Schmerzen“ zu erzeugen.
- source_word: περικεχαλασμένων δὲ τῶν σαρκῶν
  choice: sein Fleisch erschlafft
  rationale: σάρκες ist hier rein körperlich gebraucht; „Fleisch“ wahrt die konkrete Ausdrucksweise, während „erschlafft“ die vollendete Wirkung von χαλάω wiedergibt.
- source_word: κεκμηκότων δὲ καὶ τῶν νεύρων
  choice: selbst seine Sehnen ermüdet
  rationale: νεῦρα meint in antiker Körperbeschreibung Sehnen beziehungsweise kräftigende Bänder, nicht moderne psychologische „Nerven“; κάμνω bezeichnet Ermüdung oder Erschöpfung.
- source_word: ἀνενέασεν
  choice: wurde er wieder jung
  rationale: Das aktive Verb wird hier intransitiv gebraucht und bezeichnet das Wiedererlangen von Jugend beziehungsweise jugendlicher Kraft. Die natürliche deutsche Wendung erhält die rhetorische Pointe.
theological_decisions:
- issue: σάρξ in einem nichtpaulinischen Kontext körperlicher Altersschwäche
  choice: Fleisch
  alternative: Körper; Muskeln
  rationale: Der Ausdruck ist konkret-anatomisch und trägt hier keine Bedeutung wie „sündige Natur“. „Fleisch“ bewahrt daher die Bildsprache, ohne eine konfessionelle Deutung einzutragen.
- issue: Art der Verjüngung in ἀνενέασεν
  choice: wurde er wieder jung
  alternative: gewann er neue Jugendkraft
  rationale: Der griechische Ausdruck kann wörtliche Verjüngung oder die Erneuerung jugendlicher Kraft bezeichnen. Der Haupttext wahrt die starke rhetorische Formulierung; die Fußnote nennt die kontextuell naheliegende Nuance, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rhetorischer Steigerung. Die dreigliedrige Beschreibung des altersgeschwächten Körpers bleibt erhalten; missverständliche anatomische Modernisierungen und eine übermäßig wörtliche Wiedergabe von λελυμένων werden vermieden.
