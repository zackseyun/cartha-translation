  text: O blessed old age[a], and venerable gray hair, and a law-abiding life, which a faithful seal of death brought to completion.
translation:
  language: de
  text: O glückliches Alter, ehrwürdiges graues Haar und gesetzestreues Leben, das ein verlässliches Siegel des Todes vollendet hat![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das ein zuverlässiges Siegel des Todes zur Vollendung gebracht hat“. Das Griechische verdichtet die Metapher: Der Tod kann als ein Siegel verstanden werden, das ein solches Leben zuverlässig bestätigt und zu seinem Abschluss bringt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρίου γήρως
  choice: glückseliges Alter
  rationale: Die Wendung preist das hohe Alter als beneidenswert und gesegnet; „glückselig“ bewahrt den feierlichen Ausruf und bezeichnet nicht bloß ein Glücksgefühl.
- source_word: σεμνῆς πολιᾶς
  choice: ehrwürdiges graues Haar
  rationale: σεμνός bezeichnet Würde und Verehrungswürdigkeit; πολιᾶ meint das ergraute Haar beziehungsweise die Altersgraue. Die Übersetzung erhält das konkrete Bild.
- source_word: βίου νομίμου
  choice: gesetzestreues Leben
  rationale: νόμιμος bezeichnet ein Leben im Einklang mit dem Gesetz. Im Kontext des 4. Makkabäerbuches ist besonders die Treue zum jüdischen Gesetz im Blick, ohne dass dies im Ausdruck weiter ausgedeutet werden muss.
- source_word: πιστὴ σφραγὶς
  choice: verlässliches Siegel
  rationale: πιστός bedeutet hier wahrscheinlich „zuverlässig“, „gültig“ oder „echt“. „Verlässliches Siegel“ wahrt die gedrängte Metapher und klingt im Deutschen natürlicher als „treues Siegel“.
- source_word: θανάτου
  choice: des Todes
  rationale: Der Genitiv bleibt als Bestandteil der griechischen Metapher erhalten, statt vorschnell instrumental als „durch den Tod“ aufgelöst zu werden.
- source_word: ἐτελείωσεν
  choice: vollendet hat
  rationale: Das Verb bezeichnet das Zu-Ende-Bringen beziehungsweise Vollenden. „Vollendet“ erhält das Gewicht des Ausdrucks, ohne eine bestimmte spätere theologische Fachbedeutung festzulegen.
theological_decisions:
- issue: Bedeutung von βίου νομίμου im jüdischen Martyriumskontext
  choice: gesetzestreues Leben
  alternative: ein Leben nach dem Gesetz
  rationale: „Gesetzestreu“ gibt die Treue zur Tora knapp und idiomatisch wieder. Die Alternative wäre expliziter, entfaltet den kompakten griechischen Ausdruck jedoch stärker.
- issue: Bezug und Funktion von πιστὴ θανάτου σφραγίς
  choice: ein verlässliches Siegel des Todes
  alternative: der Tod als verlässliches Siegel
  rationale: Die gewählte Fassung bewahrt Grammatik und Bilddichte des Griechischen. Die Alternative erklärt deutlicher, dass der Tod das Leben bestätigt beziehungsweise abschließt, löst die Metapher aber interpretierend auf.
- issue: Wiedergabe von ἐτελείωσεν
  choice: vollendet hat
  alternative: zur Vollendung gebracht hat
  rationale: „Vollendet“ lässt sowohl Abschluss als auch Erfüllung anklingen und vermeidet eine dogmatische Festlegung auf einen technischen Begriff der Vollkommenheit.
translation_notes:
  register: Feierlich-rhetorischer, aber moderner Standarddeutsch-Stil. Die dreigliedrige Ausrufstruktur und die Siegelmetapher des griechischen Textes bleiben erhalten.
