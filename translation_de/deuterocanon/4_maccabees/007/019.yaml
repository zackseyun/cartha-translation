  text: those who believe that they do not die to God[a], but live to God, just as our patriarchs Abraham, Isaac, and Jacob.
translation:
  language: de
  text: die glauben, dass sie vor Gott[a] nicht sterben, sondern vor Gott leben; denn ebenso leben auch unsere Stammväter Abraham, Isaak und Jakob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Gott“, „Gott gegenüber“ oder „in Gottes Augen“; der griechische Dativ kann hier eine Beziehung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πιστεύοντες
  choice: die glauben
  rationale: Das substantivisch gebrauchte Präsenspartizip bezeichnet Menschen, die glauben; die verbale Form klingt im Deutschen natürlich und bewahrt den fortdauernden Sinn.
- source_word: θεῷ / τῷ θεῷ
  choice: vor Gott
  rationale: Der Dativ bezeichnet hier wahrscheinlich eine Beziehung beziehungsweise Geltung im Blick auf Gott. „Vor Gott“ ist im Deutschen knapp und lässt diese relationale Bedeutung offen; die Wiederholung bildet die griechische Entsprechung beider Satzglieder ab.
- source_word: οὐκ ἀποθνήσκουσιν
  choice: nicht sterben
  rationale: Dies gibt das Präsens von ἀποθνῄσκω unmittelbar wieder, ohne es zu „nicht tot sind“ oder „nicht zugrunde gehen“ umzudeuten.
- source_word: ὥσπερ γὰρ
  choice: ebenso wie
  rationale: Die Wendung führt den Vergleich mit den Stammvätern ein. Die kausale oder erläuternde Nuance von γάρ ist im isolierten Vers syntaktisch schwer nachzubilden; „ebenso wie“ vermittelt den klaren Vergleichssinn natürlich.
- source_word: οἱ πατριάρχαι ἡμῶν
  choice: unsere Stammväter
  rationale: „Stammväter“ bezeichnet Abraham, Isaak und Jakob im heutigen biblischen Deutsch genauer und verständlicher als das fremdsprachlichere „Patriarchen“.
- source_word: ἀλλὰ ζῶσιν
  choice: sondern … leben
  rationale: Nach der Verneinung gibt „sondern“ den scharfen Gegensatz von ἀλλά idiomatisch wieder.
theological_decisions:
- issue: Bedeutung der Dative θεῷ und τῷ θεῷ bei Sterben und Leben
  choice: relational als „vor Gott“
  alternative: „für Gott“, „Gott gegenüber“ oder „in Gottes Augen“
  rationale: „Vor Gott“ bewahrt die Aussage, dass die Glaubenden im Verhältnis zu Gott nicht sterben, sondern leben, ohne ausdrücklich zu entscheiden, ob Gottes Sicht, seine Gegenwart oder eine umfassendere Beziehung gemeint ist. „Für Gott“ könnte im Deutschen missverständlich einen Zweck ausdrücken; „in Gottes Augen“ würde die Deutung stärker festlegen.
- issue: Stellung des Vergleichs mit Abraham, Isaak und Jakob
  choice: am Satzende nach dem Gegensatz von Sterben und Leben
  alternative: zwischen „nicht sterben“ und „sondern … leben“, entsprechend der griechischen Wortfolge
  rationale: Die griechische Stellung wirkt im Deutschen missverständlich. Die Nachstellung macht deutlich, dass der Vergleich die gesamte Aussage über Nichtsterben und Leben betrifft, ohne deren theologischen Gehalt auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kleingeschriebene Anfang bewahrt den Charakter des griechischen Satzfragments im Zusammenhang. Die bewusste Wiederholung von „vor Gott“ spiegelt die beiden griechischen Dative und erhält die rhetorische Gegenüberstellung.
