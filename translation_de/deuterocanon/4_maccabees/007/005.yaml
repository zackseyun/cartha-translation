base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/005.yaml
  text: For[a], like a sheer cliff, father Eleazar, stretching out his own mind[b], broke around himself the surging waves of the passions that were raging.
translation:
  language: de
  text: Denn Vater Eleasar streckte seinen Sinn wie eine steil vorspringende Felsklippe[a] aus und ließ die tobenden Wogen der Leidenschaften[b] rings um sich zerschellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „wie eine jähe Felshöhe“ oder „wie ein steil vorspringendes Felskap“. Das griechische Bild zeigt einen schroffen Felsen, der den Meereswogen standhält.'
    reason: lexical_alternative
  - marker: b
    text: „Leidenschaften“ meint hier ungeordnete innere Regungen, Begierden oder Impulse, nicht Gefühle schlechthin.
    reason: cultural_note
lexical_decisions:
- source_word: πρόκρημνον ἄκραν
  choice: eine steil vorspringende Felsklippe
  rationale: Die Wendung bezeichnet eine jähe, vorspringende Felshöhe. „Felsklippe“ bewahrt das Meeresbild, während „steil vorspringend“ πρόκρημνον ausdrücklich wiedergibt.
- source_word: διάνοιαν
  choice: Sinn
  rationale: „Sinn“ umfasst hier Denkvermögen und innere Entschlossenheit, ohne die Stelle vorschnell auf einen philosophischen Fachbegriff wie „Vernunft“ festzulegen.
- source_word: ἐκτείνας
  choice: streckte ... aus
  rationale: 'Die konkrete Bewegung des Partizips bleibt erhalten und trägt den kühnen Vergleich weiter: Eleasars Sinn wird gleichsam wie eine Felsklippe gegen die Wogen ausgestreckt.'
- source_word: περιέκλασεν
  choice: ließ ... rings um sich zerschellen
  rationale: Die idiomatische deutsche Wendung wahrt sowohl die Kraft des Zerbrechens als auch die räumliche Bedeutung der Vorsilbe περι- im Bild von Wogen, die an einem Felsen brechen.
- source_word: μαινομένους
  choice: tobenden
  rationale: „Tobend“ gibt die unbeherrschte, heftige Bewegung wieder und fügt sich natürlich in das Wogenbild.
- source_word: παθῶν
  choice: Leidenschaften
  rationale: „Leidenschaften“ bewahrt den moralpsychologischen Sinn ungeordneter Regungen und vermeidet die zu neutrale Verallgemeinerung „Gefühle“.
- source_word: κλύδωνας
  choice: Wogen
  rationale: Das Wort bezeichnet heftig bewegte, anschwellende Wellen; „Wogen“ ist im Deutschen bildkräftig und würdevoll.
theological_decisions:
- issue: Moralpsychologischer Gegensatz zwischen διάνοια und πάθη
  choice: „Sinn“ und „Leidenschaften“
  alternative: „Vernunft“ und „Gefühle“
  rationale: Der griechische Vers formuliert den Gegensatz metaphorisch und nicht als ausgearbeitete Lehrdefinition. Die gewählte Wiedergabe erhält die Spannung zwischen innerem Denk- und Willensvermögen und ungeordneten Regungen, ohne neutrale Gefühle insgesamt abzuwerten oder spätere Fachterminologie einzutragen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit einem bewusst kräftigen Meeresbild. „Vater Eleasar“ folgt der ehrenden Anrede des griechischen Textes; die ungewöhnliche Verbindung „seinen Sinn ... ausstrecken“ bleibt wegen der markanten Originalmetapher erhalten.
