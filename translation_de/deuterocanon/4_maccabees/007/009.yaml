base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/009.yaml
  text: You[a], father, confirmed our law-abiding way by our endurance unto glory, and, speaking honorably of holiness, you did not abolish it, and by your deeds you certified the words of philosophy[b].
translation:
  language: de
  text: Du, Vater, hast durch standhaftes Ausharren unsere Gesetzestreue zum Ruhm[a] bekräftigt; du hast die Heiligkeit gepriesen und sie nicht zunichtegemacht, und durch deine Taten hast du die Worte der Philosophie[b] beglaubigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Ehre“. Die Wendung εἰς δόξαν kann ein Ziel oder ein Ergebnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Lehren“ beziehungsweise „die Grundsätze der Philosophie“. Das griechische λόγοι kann „Worte“, „Aussagen“, „Argumente“ oder „Lehren“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνομίαν ἡμῶν
  choice: unsere Gesetzestreue
  rationale: εὐνομία bezeichnet ein Leben in guter gesetzlicher Ordnung. Im Zusammenhang ist „Gesetzestreue“ natürlich und bewahrt sowohl den Bezug zum Gesetz als auch die gelebte Haltung; ἡμῶν wird ausdrücklich mit „unsere“ wiedergegeben.
- source_word: διὰ τῶν ὑπομονῶν
  choice: durch standhaftes Ausharren
  rationale: διά mit Genitiv bezeichnet hier das Mittel. Der griechische Plural kann konkrete Bewährungen oder intensiv die Ausdauer unter Leiden bezeichnen; die unzählbare deutsche Form gibt den Sinn idiomatisch wieder, ohne einen im Griechischen nicht ausdrücklich vorhandenen Possessor einzusetzen.
- source_word: εἰς δόξαν
  choice: zum Ruhm
  rationale: εἰς kann Ziel oder Ergebnis ausdrücken. „Zum Ruhm“ erhält diese Offenheit und passt zum ehrenvollen Ansehen, das aus dem Ausharren hervorgeht.
- source_word: ἐκύρωσας
  choice: bekräftigt
  rationale: Das Verb bezeichnet das Gültigmachen, Bestätigen oder Festigen. „Bekräftigt“ verbindet sachliche Bestätigung mit dem Zeugnis eines gelebten Beispiels.
- source_word: ἁγιαστίαν
  choice: Heiligkeit
  rationale: Die seltene Substantivform bezeichnet Heiligkeit beziehungsweise einen geheiligten Zustand; „Heiligkeit“ ist im Deutschen klar und nicht konfessionell verengt.
- source_word: σεμνολογήσας
  choice: in würdigen Worten von ... gesprochen
  rationale: Die Form bezeichnet ehrwürdiges oder feierlich-würdiges Reden. Die Wiedergabe erhält ausdrücklich den Redeaspekt und schwächt ihn nicht zu bloßem innerem Ehren ab.
- source_word: οὐ κατέλυσας
  choice: nicht zunichtegemacht
  rationale: καταλύω kann aufheben, niederreißen oder außer Kraft setzen heißen. Hier geht es darum, dass das Handeln die bekannte Heiligkeit nicht widerlegte oder zerstörte; „zunichtegemacht“ lässt diese Bild- und Bedeutungsbreite bestehen.
- source_word: διὰ τῶν ἔργων ἐπιστοποίησας
  choice: durch deine Taten ... beglaubigt
  rationale: ἐπιστοποιέω bezeichnet Bestätigen oder glaubwürdiges Bezeugen. „Beglaubigt“ bringt den Nachweis durch sichtbare Taten zum Ausdruck; das possessive „deine“ ergibt sich im Deutschen natürlich aus dem angeredeten Subjekt.
- source_word: τοὺς τῆς φιλοσοφίας λόγους
  choice: die Worte der Philosophie
  rationale: λόγοι kann Worte, Aussagen, Argumente oder Lehren bezeichnen. Die formnahe Wiedergabe „Worte“ bewahrt die Mehrdeutigkeit; eine Fußnote nennt idiomatische Alternativen.
theological_decisions:
- issue: Bedeutung von φιλοσοφία im Vierten Makkabäerbuch
  choice: Philosophie
  alternative: Weisheit; vernunftgeleitete Lehre
  rationale: Das Buch gebraucht bewusst die Begriffswelt hellenistischer Philosophie. „Philosophie“ bewahrt diesen konzeptuellen Rahmen, ohne ihn zu einer allgemeineren religiösen „Weisheit“ umzudeuten.
- issue: Nicht genanntes Subjekt der ὑπομοναί
  choice: kein Possessivpronomen im Ausdruck „durch standhaftes Ausharren“
  alternative: durch dein Ausharren; durch unser Ausharren
  rationale: Der griechische Ausdruck enthält bei ὑπομονῶν weder „dein“ noch „unser“. Obwohl der Zusammenhang einen Bezug auf den angeredeten Vater nahelegen kann, soll die echte syntaktische Offenheit nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Der Satzbau bleibt der dreigliedrigen griechischen Würdigung nahe, wird aber durch ein Semikolon lesbarer. Unbelegte Possessivangaben beim Ausharren werden vermieden; die Mehrdeutigkeit von εἰς δόξαν und λόγοι wird in Fußnoten offengehalten.
