lexical_decisions:
- source_word: ἐπεὶ
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung des vorausgehenden Gedankens ein und erhält den argumentativen Zusammenhang.
- source_word: τίς
  choice: wer
  rationale: Gibt das Interrogativpronomen in der eingeleiteten rhetorischen Frage idiomatisch wieder.
- source_word: πρὸς ὅλον τὸν τῆς φιλοσοφίας κανόνα
  choice: nach der ganzen Richtschnur der Philosophie
  rationale: πρός bezeichnet hier die Ausrichtung an einem normativen Maßstab; „Richtschnur“ bewahrt das Bild und die normative Bedeutung von κανών, während „ganz“ die umfassende Geltung ausdrückt.
- source_word: εὐσεβῶς φιλοσοφῶν
  choice: ein frommes philosophisches Leben führt
  rationale: Das Verb bezeichnet im Kontext nicht nur theoretisches Nachdenken, sondern die praktische philosophische Lebensführung; εὐσεβῶς kennzeichnet diese als fromm beziehungsweise gottesfürchtig.
- source_word: πεπιστευκὼς θεῷ
  choice: sein Vertrauen auf Gott gesetzt hat
  rationale: Das Perfektpartizip bezeichnet ein begründetes, fortwirkendes Vertrauen. Die Formulierung wahrt sowohl den vollzogenen Akt als auch die bleibende Ausrichtung auf Gott.
theological_decisions:
- issue: Bedeutung von πιστεύω im philosophischen Märtyrerkontext
  choice: sein Vertrauen auf Gott gesetzt hat
  alternative: Gott geglaubt hat
  rationale: Der Zusammenhang legt persönliche Zuversicht und verlässliche Hinwendung zu Gott näher als bloße Zustimmung zu einer Aussage; zugleich wird keine konfessionell geprägte Zusatzbedeutung eingeführt.
- issue: Verhältnis von Frömmigkeit und Philosophie
  choice: ein frommes philosophisches Leben führt
  alternative: fromm philosophiert
  rationale: Die Wiedergabe hält Frömmigkeit und philosophische Praxis eng zusammen, ohne die Philosophie mit Frömmigkeit gleichzusetzen oder die Wendung auf rein theoretisches Philosophieren zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Richtschnur-Metapher von κανών bleibt erhalten. Das abschließende Komma wahrt den im folgenden Vers weitergeführten Satz und die noch unvollständige rhetorische Frage.
