  text: and[a], being overwhelmed by the tyrant’s threats and being swamped by the billows of torments,
translation:
  language: de
  text: und von den Drohungen des Tyrannen überflutet und von den Sturmwogen der Qualen überspült,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακλυζόμενος
  choice: überflutet
  rationale: Das Partizip bezeichnet ein Überflutet- oder Überschwemmtwerden und eröffnet das durchgehende Wasser- und Sturm Bild des Satzteils.
- source_word: ἀπειλαῖς
  choice: Drohungen
  rationale: Die übliche Bedeutung passt unmittelbar zum Zwangshandeln des Tyrannen und ist in modernem Deutsch klar.
- source_word: καταντλούμενος
  choice: überspült
  rationale: Das seltene Verb führt die Wassermetaphorik fort. „Überspült“ verbindet sich natürlich mit den folgenden Sturmwogen, ohne das Bild in ein sachliches „überwältigt“ aufzulösen.
- source_word: βασάνων
  choice: Qualen
  rationale: Im Märtyrerkontext sind schwere, zugefügte Leiden gemeint. „Qualen“ bewahrt die Intensität, ohne eine bestimmte Foltermethode festzulegen.
- source_word: τρικυμίαις
  choice: Sturmwogen
  rationale: Das Wort bezeichnet stürmischen Seegang beziehungsweise hohe, aufgewühlte Wellen. „Sturmwogen“ erhält das gehobene, anschauliche Meeresbild.
- source_word: τοῦ τυράννου
  choice: des Tyrannen
  rationale: Der Genitiv wird im Deutschen natürlich als Zugehörigkeitsangabe wiedergegeben; „Tyrann“ bewahrt die moralische Charakterisierung.
theological_decisions: []
translation_notes:
  register: Gehobenes, aber verständliches modernes Standarddeutsch. Die parallelen Partizipien und die durchgehende Flut- und Seesturmmetaphorik bleiben erhalten. Der einleitende Anschluss „und“ sowie das abschließende Komma zeigen, dass es sich um einen abhängigen Satzteil handelt.
