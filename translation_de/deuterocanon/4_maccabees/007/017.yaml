  yaml_path: translation/deuterocanon/4_maccabees/007/017.yaml
  text: But perhaps some might say[a], “Not all gain mastery over their passions[b], because not all have prudent reason.”
translation:
  language: de
  text: 'Doch vielleicht könnten manche sagen: »Nicht alle gewinnen die Oberhand über ihre Leidenschaften[a], weil nicht alle besonnene Urteilskraft[b] besitzen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nicht alle überwinden ihre Leidenschaften« beziehungsweise »Nicht alle bringen ihre Leidenschaften unter Kontrolle«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verständige Vernunft« oder »kluge/besonnene Vernunft«. Das griechische Wort bezeichnet die urteilende Vernunft und ist ein Schlüsselbegriff in der Argumentation des 4. Makkabäerbuchs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσως δʼ ἂν εἴποιέν τινες
  choice: Doch vielleicht könnte jemand sagen
  rationale: Das δέ führt den Einwand weiter, während ἴσως und der Optativ mit ἄν dessen hypothetischen Charakter ausdrücken. Der griechische Plural τινες wird im Deutschen idiomatisch durch das unbestimmte Singularsubjekt »jemand« wiedergegeben.
- source_word: τῶν παθῶν
  choice: ihre Leidenschaften
  rationale: πάθη bezeichnet im Gedankengang des 4. Makkabäerbuchs innere Regungen, Begierden und Affekte, die von der Vernunft beherrscht werden sollen, nicht äußere Leiden.
- source_word: οὐ πάντες περικρατοῦσιν
  choice: Nicht alle gewinnen die Herrschaft über
  rationale: περικρατέω bezeichnet hier das Erlangen von Überlegenheit oder Kontrolle. »die Herrschaft gewinnen über« bewahrt den dynamischen Aspekt und klingt im Deutschen würdig und verständlich.
- source_word: φρόνιμον
  choice: verständige
  rationale: φρόνιμος bezeichnet praktische Einsicht, Besonnenheit oder vernünftiges Urteilsvermögen. »verständig« bewahrt diese ethisch-praktische Nuance, ohne bloß allgemeine Klugheit zu behaupten.
- source_word: τὸν λογισμόν
  choice: Vernunft
  rationale: λογισμός ist ein Schlüsselbegriff des Buches für die urteilende, vernünftige Denkfähigkeit. »Vernunft« ist im Deutschen natürlich und im philosophischen Zusammenhang hinreichend präzise.
theological_decisions:
- issue: Anthropologisch-philosophische Aussage über die Beherrschung der Leidenschaften
  choice: Der Satz beschreibt, dass nicht bei allen Menschen die Vernunft verständig beziehungsweise von praktischer Einsicht geprägt ist.
  alternative: Man könnte die Aussage schwächer darauf beziehen, dass nicht alle ihre Vernunft verständig gebrauchen, oder stärker so verstehen, als besäßen manche Menschen überhaupt keine Vernunft.
  rationale: Die Verbindung ἔχουσιν mit dem prädikativen φρόνιμον qualifiziert den λογισμός. Sie bestreitet daher nicht die menschliche Vernunftfähigkeit an sich, lässt aber offen, ob es um ihren Zustand, ihre Ausprägung oder ihren wirksamen Gebrauch geht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede macht den rhetorisch eingeführten Einwand deutlich. »Leidenschaften« und »Vernunft« halten den philosophischen Wortschatz des Buches erkennbar, während die Fußnoten wichtige Bedeutungsalternativen bewahren.
