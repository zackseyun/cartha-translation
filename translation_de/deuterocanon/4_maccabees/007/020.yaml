  text: Therefore[a], nothing is opposed by the fact that some appear to be ruled by passions because of weak reason.
translation:
  language: de
  text: Daher spricht nichts dagegen, dass manche wegen ihrer schwachen Vernunft von den Leidenschaften beherrscht zu werden scheinen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲν οὖν ἐναντιοῦται
  choice: Daher steht es dem nicht entgegen
  rationale: 'οὖν markiert eine Folgerung. Die unpersönliche deutsche Wendung gibt die argumentative Aussage von οὐδὲν … ἐναντιοῦται natürlich wieder: Der angeführte Anschein widerlegt die zuvor vertretene These nicht.'
- source_word: τὸ φαίνεσθαί τινας
  choice: dass manche … zu werden scheinen
  rationale: Der artikulierte Infinitiv wird als deutscher dass-Satz wiedergegeben; „scheinen“ bewahrt die Unterscheidung zwischen Anschein und Wirklichkeit.
- source_word: παθοκρατεῖσθαι
  choice: von den Leidenschaften beherrscht zu werden
  rationale: Die Wiedergabe erhält das Herrschaftsbild des Kompositums und die philosophische Gegenüberstellung von Vernunft und Leidenschaften.
- source_word: διὰ τὸν ἀσθενῆ λογισμόν
  choice: wegen ihrer schwachen Vernunft
  rationale: διά mit Akkusativ bezeichnet hier den Grund. Das ergänzte Possessivpronomen stellt im Deutschen den Bezug zu „manche“ klar; „Vernunft“ wahrt den Leitbegriff des Werkes.
theological_decisions:
- issue: Verhältnis von Vernunft und Leidenschaften
  choice: „schwache Vernunft“ und „von den Leidenschaften beherrscht“
  alternative: „schwaches Urteilsvermögen“ und „von den Regungen überwältigt“
  rationale: Die gewählte Fassung bewahrt den philosophisch-anthropologischen Grundgegensatz des Buches, ohne ihn durch spätere konfessionelle Kategorien zu deuten.
- issue: Anschein oder tatsächliche Beherrschung
  choice: „beherrscht zu werden scheinen“
  alternative: „offenbar beherrscht werden“
  rationale: φαίνεσθαι lässt offen, ob nur der Anschein beschrieben wird; diese Spannung wird ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist idiomatisch, bleibt aber nahe an der logischen Struktur des griechischen Satzes.
