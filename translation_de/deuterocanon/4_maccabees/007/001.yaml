  - severity: low
    issue: Unidiomatische Wiedergabe von λογισμός
    rationale: „Das vernünftige Denken“ ist verständlich, wirkt jedoch tautologisch und weniger natürlich als „die Vernunft“. Letzteres wahrt die zentrale Gegenüberstellung von Vernunft und Leidenschaften im Werk.
