  yaml_path: translation/deuterocanon/4_maccabees/007/001.yaml
  text: For just as the reasoning of our father Eleazar[a], like an excellent helmsman, was steering the ship of godliness on the sea of the passions[b],
translation:
  language: de
  text: Denn wie ein hervorragender Steuermann lenkte die Vernunft unseres Vaters Eleasar das Schiff der Gottesfurcht[a] auf dem Meer der Leidenschaften[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Frömmigkeit“. Das griechische Wort εὐσέβεια bezeichnet ehrfürchtige Hingabe an Gott, die sich in treuem Handeln zeigt.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort πάθη meint hier wahrscheinlich „Leidenschaften“ oder starke, ungeordnete Gemütsregungen – ein Leitmotiv in 4 Makkabäer – und nicht lediglich „Leiden“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Denn ... wie
  rationale: Gibt sowohl die begründende Verknüpfung durch γάρ als auch den mit ὥσπερ eingeleiteten Vergleich in natürlichem Deutsch wieder.
- source_word: ἄριστος κυβερνήτης
  choice: ein hervorragender Steuermann
  rationale: Bewahrt das nautische Bild und bezeichnet die besondere Tüchtigkeit, ohne ἄριστος unnötig absolut als „der beste“ zu verstehen.
- source_word: ὁ ... λογισμός
  choice: das vernünftige Denken
  rationale: λογισμός bezeichnet in 4 Makkabäer das vernunftgeleitete sittliche Urteilen, das die Leidenschaften beherrscht. „Vernünftiges Denken“ ist verständlich und wahrt den aktiven Charakter des Begriffs.
- source_word: τοῦ πατρὸς ἡμῶν Ἐλεαζάρου
  choice: unseres Vaters Eleasar
  rationale: Bewahrt die ehrende familiäre Bezeichnung und gibt den Genitiv unmittelbar wieder.
- source_word: πηδαλιουχῶν
  choice: der ... lenkte
  rationale: Der griechische Partizipialsatz wird als deutscher Relativsatz wiedergegeben; „lenkte“ hält das Bild des Steuermanns und die fortdauernde Tätigkeit fest.
- source_word: τὴν τῆς εὐσεβείας ναῦν
  choice: das Schiff der Gottesfurcht
  rationale: εὐσέβεια meint ehrfürchtige Hingabe an Gott, die sich in treuem Handeln zeigt. „Gottesfurcht“ vermittelt diesen religiös-sittlichen Sinn im Deutschen klar.
- source_word: ἐν τῷ τῶν παθῶν πελάγει
  choice: über das Meer der Leidenschaften
  rationale: πέλαγος bezeichnet das offene Meer; πάθη meint im Gedankengang des Buches vor allem Leidenschaften oder starke Regungen, nicht bloß äußere Leiden. „Über“ ist beim Lenken eines Schiffes idiomatisches Deutsch.
theological_decisions:
- issue: Wiedergabe von λογισμός im philosophisch-theologischen Zusammenhang
  choice: das vernünftige Denken
  alternative: die Vernunft; die vernünftige Überlegung; das vernünftige Urteil
  rationale: Die Formulierung wahrt die zentrale Vorstellung des Buches, dass vernunftgeleitetes sittliches Denken die Leidenschaften unter der Bindung an Gottes Gesetz beherrscht, ohne einen späteren philosophischen Fachbegriff einzutragen.
- issue: Wiedergabe von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit; Ehrfurcht vor Gott
  rationale: Gemeint ist nicht bloß ein inneres Gefühl, sondern ehrfürchtige Hingabe an Gott, die sich in treuem Handeln äußert. Die Fußnote hält die semantische Breite offen.
- issue: Bedeutung von πάθη
  choice: Leidenschaften
  alternative: Gemütsregungen; Leiden
  rationale: Im moralpsychologischen Argument von 4 Makkabäer bezeichnet πάθη vornehmlich die zu beherrschenden Leidenschaften beziehungsweise starken Regungen. Die mögliche allgemeine Bedeutung „Leiden“ wird nicht in den Haupttext übernommen, da sie den unmittelbaren Gedankengang weniger gut trifft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ausgedehnte nautische Bild bleibt vollständig erhalten. Der griechische Partizipialsatz wird für natürliche deutsche Syntax als Relativsatz formuliert; das abschließende Komma signalisiert, dass der Gedanke im folgenden Vers weitergeführt wird.
