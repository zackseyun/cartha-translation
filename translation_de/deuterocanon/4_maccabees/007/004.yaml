base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/004.yaml
  text: No city under siege ever held out against many and varied siege engines as that most holy man[a], while his sacred soul was being burned by tortures and the wheel[b], stirred up those besieging him through the reason that defends godliness.
translation:
  language: de
  text: Nie hat eine belagerte Stadt zahlreichen und verschiedenartigen Belagerungsmaschinen so standgehalten wie jener überaus heilige Mann. Während seine heilige Seele durch Misshandlungen und Folterwerkzeuge[a] in Brand gesetzt wurde, bewegte er diejenigen, die ihn belagerten, durch die Vernunft, die für die Gottesfurcht eintritt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet offenbar Foltergeräte, die mit Drehen oder Strecken verbunden waren. Als konkretere Deutung kommt etwa „Folterbänke“ in Betracht; das genaue Gerät lässt sich nicht sicher bestimmen.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wegen der Vernunft, die für die Gottesfurcht eintritt“. Die griechische Formulierung hebt die Vernunft als Grund und wirksame Kraft seines Widerstands hervor.'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: πόλις
  choice: Stadt
  rationale: Im ausdrücklichen Bild einer Belagerung bezeichnet πόλις natürlich eine Stadt.
- source_word: μηχανήμασιν
  choice: Belagerungsmaschinen
  rationale: Der Zusammenhang mit πολιορκουμένη und πολιορκοῦντας legt militärische Belagerungsgeräte nahe, nicht bloß allgemeine Vorrichtungen.
- source_word: ἀντέσχεν
  choice: standgehalten
  rationale: Die Wendung gibt den Widerstand unter einem anhaltenden Angriff idiomatisch wieder und bewahrt das Belagerungsbild.
- source_word: πανάγιος
  choice: ganz heilig
  rationale: Die Wiedergabe bewahrt die verstärkende Bedeutung, ohne einen kirchlichen Titel wie „der Allerheiligste“ nahezulegen.
- source_word: ἱερὰν ψυχὴν
  choice: seine heilige Seele
  rationale: ἱεράν hat sakralen Klang; „Seele“ wahrt hier den moralisch-psychologischen Schwerpunkt des Buches.
- source_word: αἰκισμοῖς
  choice: Misshandlungen
  rationale: Das Wort bezeichnet grausame Misshandlung oder Folter; zusammen mit dem folgenden Gerätebegriff vermeidet „Misshandlungen“ eine unnötige Dopplung.
- source_word: στρέβλαις
  choice: Folterwerkzeuge
  rationale: Der schwierige Plural bezeichnet offenbar Geräte, die beim Foltern, wahrscheinlich durch Verdrehen oder Strecken, verwendet wurden. Die allgemeinere Wiedergabe vermeidet eine unbelegte Festlegung auf das Rad oder die Streckbank.
- source_word: πυρπολούμενος
  choice: in Brand gesetzt wurde
  rationale: Die kräftige Brandmetapher des Partizips wird erhalten; die deutsche Konstruktion bezieht sie wie der griechische Akkusativ der Beziehung auf seine Seele.
- source_word: ἐκίνησεν
  choice: erschütterte
  rationale: Das Verb kann „bewegen“, „erschüttern“ oder „in Unruhe versetzen“ bedeuten. „Erschütterte“ drückt die Wirkung auf die Angreifer aus, ohne sie genauer zu bestimmen.
- source_word: τοὺς πολιορκοῦντας
  choice: die, die ihn belagerten
  rationale: Die Formulierung hält das durchgehende Belagerungsbild ausdrücklich aufrecht.
- source_word: λογισμόν
  choice: Vernunft
  rationale: λογισμός ist in 4 Makkabäer ein Leitbegriff für die vernünftige Urteils- und Lenkungsfähigkeit. „Vernunft“ ist prägnant und thematisch angemessen.
- source_word: ὑπερασπίζοντα τῆς εὐσεβείας
  choice: die für die Gottesfurcht eintritt
  rationale: Die aktive Verteidigung wird mit „eintritt“ ausgedrückt; „Gottesfurcht“ bezeichnet hier ehrfürchtige, im Handeln bewährte Treue zu Gott.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: Der Begriff umfasst ehrfürchtige Hingabe an Gott und entsprechendes treues Handeln. „Gottesfurcht“ ist im biblischen Register verständlich und weniger leicht mit bloß äußerlicher Frömmigkeit zu verwechseln.
- issue: Wiedergabe von λογισμός
  choice: Vernunft
  alternative: vernünftige Entschlossenheit
  rationale: Das Buch behandelt die Herrschaft der Vernunft über die Leidenschaften. Die knappe Wiedergabe bewahrt diesen zentralen Begriff und fügt keine nur hier gemeinte Willensnuance ein.
- issue: Kausale oder instrumentale Bedeutung von διά mit Akkusativ
  choice: kraft der Vernunft
  alternative: wegen der Vernunft
  rationale: διά mit Akkusativ kann den Grund bezeichnen; im Zusammenhang ist zugleich die Vernunft die wirksame Kraft seines Widerstands. „Kraft“ lässt diese enge Verbindung stehen, ohne eine bestimmte philosophische Theorie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ausgedehnte Belagerungsbild bleibt erhalten. Die ungewöhnlich starke Brandmetapher für die gepeinigte Seele wird nicht abgeschwächt; der schwierige Gerätebegriff und die Funktion der Vernunft werden in Fußnoten offengehalten.
