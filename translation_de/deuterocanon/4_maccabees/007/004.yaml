  naturalness: „Ganz heilige Mann“ wirkt im modernen Standarddeutsch unidiomatisch. „Überaus heilige Mann“ ist natürlich, würdevoll und gibt die Verstärkung von πανάγιος wieder. Die übrige Satzführung ist klar und bewahrt das ausgedehnte Bild.
