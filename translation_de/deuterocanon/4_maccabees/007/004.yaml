  to: Nie hat eine belagerte Stadt zahlreichen und verschiedenartigen Belagerungsmaschinen so standgehalten wie jener überaus heilige Mann. Während seine heilige Seele durch Misshandlungen und Folterwerkzeuge[a] in Brand gesetzt wurde, bewegte er diejenigen, die ihn belagerten, durch die Vernunft, die für die Gottesfurcht eintritt.[b]
