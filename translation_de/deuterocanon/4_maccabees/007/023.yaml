  text: For only the wise and self-controlled man is courageous[a], master of the passions.
translation:
  language: de
  text: Denn nur der Weise und Selbstbeherrschte[a] ist mutig, Herr über die Leidenschaften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Bezeichnungen stehen im maskulinen Singular, sind in diesem ethischen Lehrsatz aber allgemein auf eine Person bezogen.
    reason: Die grammatisch maskuline Form und ihr generischer Aussageumfang sollen beide erkennbar bleiben.
lexical_decisions:
- source_word: μόνος
  choice: nur
  rationale: Das prädikativ bzw. hervorhebend gebrauchte μόνος formuliert einen Ausschließlichkeitsanspruch; „nur“ gibt ihn im Deutschen knapp und natürlich wieder.
- source_word: σοφὸς
  choice: der Weise
  rationale: Im ethisch-philosophischen Zusammenhang bezeichnet σοφός moralische und geistige Weisheit. Die substantivierte Form bewahrt die Struktur des Griechischen.
- source_word: σώφρων
  choice: Selbstbeherrschte
  rationale: σώφρων bezeichnet hier besonnene, disziplinierte Selbstkontrolle. Wegen des folgenden Herrschens über die πάθη trifft „selbstbeherrscht“ den Zusammenhang deutlicher als „besonnen“ oder „maßvoll“.
- source_word: ἀνδρεῖός
  choice: mutig
  rationale: ἀνδρεῖος bezeichnet Tapferkeit oder Mut. „Mutig“ ist gegenwärtiges, gut verständliches Deutsch und vermeidet die heute missverständliche Wiedergabe „mannhaft“.
- source_word: κύριος
  choice: Herr
  rationale: κύριος bezeichnet hier keine göttliche Anrede, sondern Herrschaft und Verfügungsgewalt. In der festen Verbindung „Herr über“ wird dieser Sinn natürlich ausgedrückt.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: πάθη meint im philosophischen Sprachgebrauch des Buches Leidenschaften beziehungsweise innere Regungen, die der Vernunft unterworfen werden sollen. Das deutsche „Herr über“ verlangt idiomatisch „über“ statt einer Genitivkonstruktion.
- source_word: ἀνδρεῖός ἐστιν τῶν παθῶν κύριος
  choice: ist mutig, Herr über die Leidenschaften
  rationale: Die knappe Reihung der beiden Prädikate wird ohne ergänzendes „und“ bewahrt; zugleich bleibt die Aussage im Deutschen klar.
theological_decisions:
- issue: Generisches Maskulinum des ethischen Lehrsatzes
  choice: der Weise und Selbstbeherrschte
  alternative: der weise und selbstbeherrschte Mensch
  rationale: Der griechische Text hat substantivierte maskuline Singularformen, nennt jedoch nicht ausdrücklich ἀνήρ („Mann“). Die deutsche substantivierte Form bildet dies formal nach; eine Fußnote macht den generischen Aussageumfang deutlich, ohne ein nicht vorhandenes Substantiv in den Haupttext einzutragen.
- issue: κύριος in nicht göttlichem Zusammenhang
  choice: Herr über die Leidenschaften
  alternative: Gebieter über die Leidenschaften
  rationale: Hier geht es um menschliche Herrschaft über innere Leidenschaften, nicht um einen Gottestitel. „Herr über“ vermittelt die Herrschaftsaussage in natürlichem Deutsch und vermeidet durch die Ergänzung jede sachliche Verwechslung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sentenzhafte Kürze und die Prädikatsreihung des griechischen Textes bleiben erhalten; „Leidenschaften“ wahrt den philosophisch-ethischen Sprachgebrauch von πάθη.
