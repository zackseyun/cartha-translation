translation:
  language: de
  text: Durch den Geist der Vernunft und durch Isaak-ähnliche Vernunft setzte er das vielköpfige Foltergerät[a] außer Kraft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vielköpfige Folterwinde“ beziehungsweise „das vielköpfige Folterrad“. Das griechische Wort bezeichnet ein Foltergerät, dessen genaue Bauart hier nicht sicher ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματι
  choice: Geist
  rationale: „Geist“ bewahrt das Bild einer inneren, belebenden Kraft oder Haltung. Im Zusammenhang bezeichnet das Wort nicht ausdrücklich den Heiligen Geist.
- source_word: λογισμοῦ / λογισμῷ
  choice: Vernunft
  rationale: Die Wiederholung wird im Deutschen beibehalten, da λογισμός ein Leitbegriff des 4. Makkabäerbuchs für die vernünftige Beherrschung der Leidenschaften ist.
- source_word: Ἰσακείῳ
  choice: wie die Isaaks
  rationale: Das Adjektiv drückt Ähnlichkeit mit Isaak aus. Die Formulierung bewahrt den Vergleich und die Anspielung, ohne sie im Haupttext auszudeuten.
- source_word: πολυκέφαλον
  choice: vielköpfige
  rationale: Die anschauliche Bedeutung des griechischen Kompositums wird unmittelbar wiedergegeben.
- source_word: στρέβλαν
  choice: Foltergerät
  rationale: Das Wort bezeichnet ein Gerät zum Verdrehen beziehungsweise Foltern; seine genaue Bauart ist nicht sicher genug, um im Haupttext eindeutig „Rad“, „Winde“ oder „Folterbank“ zu wählen.
- source_word: ἠκύρωσεν
  choice: setzte … außer Kraft
  rationale: Die Wendung gibt das Ungültig- oder Wirkungslosmachen idiomatisch wieder und bewahrt den Gedanken, dass das Foltergerät seinen beabsichtigten Zweck verfehlte.
theological_decisions:
- issue: Bedeutung von πνεῦμα in „Geist der Vernunft“
  choice: innere, belebende Kraft vernünftiger Standhaftigkeit
  alternative: ein Hinweis auf den Heiligen Geist
  rationale: Der unmittelbare Kontext preist die Herrschaft der Vernunft über Leiden und Leidenschaften; die Formulierung enthält keinen eindeutigen Hinweis auf den göttlichen Geist.
- issue: Aussage der Isaak-Anspielung
  choice: Vergleich mit der Vernunft beziehungsweise Haltung Isaaks
  alternative: Vernunft, die Isaak gehört
  rationale: Die adjektivische Form Ἰσακείῳ bezeichnet Ähnlichkeit. Die Übersetzung lässt offen, welche Einzelheiten der Isaaküberlieferung besonders im Blick stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung von „Vernunft“ und das ungewöhnliche Bild „vielköpfig“ bleiben erhalten; „setzte … außer Kraft“ klingt natürlicher als das abstraktere „annullierte“.
