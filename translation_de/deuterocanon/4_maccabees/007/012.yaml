  yaml_path: translation/deuterocanon/4_maccabees/007/012.yaml
  text: Thus Eleazar[a], the descendant of Aaron, though being burned through the fire[b], did not change his resolve.
translation:
  language: de
  text: So änderte Eleasar, der Nachkomme Aarons[a], obwohl er vom Feuer verzehrt wurde, seinen Entschluss[b] nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Aaronide«, also ein Angehöriger der Linie Aarons.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch »Denken«, »Überlegung« oder »Vernunft« bedeuten. Im 4. Makkabäerbuch bezeichnet es häufig die vernunftgeleitete Entschlossenheit.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: Stellt knapp den folgernden und rückblickenden Bezug zum vorangehenden Bericht her.
- source_word: ὁ Ἀαρωνίδης
  choice: der Nachkomme Aarons
  rationale: Bezeichnet Eleasar als Angehörigen der priesterlichen Linie Aarons; diese Formulierung ist im heutigen Deutsch unmittelbar verständlich.
- source_word: Ἐλεάζαρος
  choice: Eleasar
  rationale: Gebräuchliche deutsche Namensform in biblischen Zusammenhängen.
- source_word: διὰ τοῦ πυρὸς ὑπερτηκόμενος
  choice: obwohl er vom Feuer aufgezehrt wurde
  rationale: Das Partizip bezeichnet ein durch starke Hitze bewirktes Dahinschmelzen oder Aufgezehrtwerden. Die konzessive Wiedergabe macht den gedanklichen Zusammenhang im Deutschen deutlich, während »vom Feuer aufgezehrt« Ursache und Heftigkeit bewahrt.
- source_word: οὐ μετετράπη
  choice: änderte … nicht
  rationale: Gibt das Abweichen oder Sich-Umstimmen-Lassen unter dem Druck der Folter natürlich wieder.
- source_word: τὸν λογισμόν
  choice: seinen vernünftigen Entschluss
  rationale: Verbindet die philosophische Bedeutung des vernünftigen Denkens mit der hier hervorgehobenen standhaften Willensentscheidung.
theological_decisions:
- issue: Bedeutung von λογισμός im leitenden Thema des 4. Makkabäerbuches
  choice: seinen vernünftigen Entschluss
  alternative: sein Denken; seine Vernunft; seinen Entschluss
  rationale: »Vernünftiger Entschluss« bewahrt sowohl die rationale als auch die entschlossene Seite des Begriffs, ohne ihn ausschließlich als Verstand oder bloße Willenskraft zu deuten. Eine Fußnote weist auf die weiter gefasste Bedeutung hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang; ungebräuchliches »Aaronide« wird im Haupttext verständlich aufgelöst. Die philosophische Spannung in λογισμός bleibt durch Haupttext und Fußnote erhalten.
