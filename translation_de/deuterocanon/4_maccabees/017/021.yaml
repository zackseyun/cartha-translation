  text: and that the tyrant should be punished and the homeland purified.
translation:
  language: de
  text: und dass der Tyrann bestraft und die Heimat gereinigt werden sollte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύραννον
  choice: der Tyrann
  rationale: „Tyrann“ gibt die Bezeichnung des unterdrückerischen Herrschers direkt und mit ihrer moralisch-politischen Schärfe wieder.
- source_word: τιμωρηθῆναι
  choice: bestraft wurde
  rationale: Der passive Aoristinfinitiv bezeichnet, dass der Tyrann Strafe erfuhr; die deutsche dass-Konstruktion gibt den vom Zusammenhang abhängigen Infinitiv idiomatisch wieder.
- source_word: πατρίδα
  choice: die Heimat
  rationale: „Heimat“ bewahrt den Bezug auf das eigene angestammte Land, ohne sich auf das Staatsgebiet oder ausschließlich auf das Volk zu verengen.
- source_word: καθαρισθῆναι
  choice: gereinigt wurde
  rationale: „gereinigt“ lässt die rituellen, moralischen und gemeinschaftlichen Bedeutungsanteile des griechischen Verbs offen.
- source_word: καὶ ... καὶ
  choice: und ... und
  rationale: Die beiden parallelen Aussagen werden entsprechend der knappen griechischen Reihung koordiniert.
theological_decisions:
- issue: Art der Reinigung der Heimat
  choice: „die Heimat gereinigt“ als bewusst weiter Ausdruck
  alternative: „das Land entsühnt“ oder „das Volk gereinigt“
  rationale: Der griechische Text legt weder ausschließlich eine kultische Entsühnung noch ausschließlich eine moralische oder politische Reinigung fest; die Übersetzung erhält diese Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die knappe Satzfortsetzung des griechischen Verses bleibt erkennbar. Das einleitende „und dass“ signalisiert die syntaktische Abhängigkeit vom vorausgehenden Zusammenhang.
