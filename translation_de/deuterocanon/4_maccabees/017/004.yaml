  yaml_path: translation/deuterocanon/4_maccabees/017/004.yaml
  text: Therefore take courage[a], O mother of a holy soul, holding fast the hope of endurance with noble courage toward God.
translation:
  language: de
  text: Darum sei guten Mutes, du Mutter mit heiliger Seele[a], und halte tapfer an der Hoffnung der Ausdauer fest, auf Gott gerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Eigenschaftswort ἱερόψυχε verbindet die Begriffe „heilig“ und „Seele“ beziehungsweise „inneres Wesen“. Auch eine nachgebildete Form wie „heilig-beseelte Mutter“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάρρει
  choice: sei guten Mutes
  rationale: Der Imperativ fordert zu Zuversicht und Mut auf. Die Wendung ist im heutigen Standarddeutsch verständlich und bewahrt den ermahnenden, würdevollen Ton.
- source_word: τοιγαροῦν
  choice: darum
  rationale: Die folgernde Partikel knüpft den Zuspruch als Schluss an den vorausgehenden Zusammenhang an.
- source_word: μῆτηρ ἱερόψυχε
  choice: du Mutter mit heiliger Seele
  rationale: Die Anrede gibt das seltene Kompositum ἱερόψυχος mit seinen Bestandteilen ‚heilig/sakral‘ und ‚Seele‘ transparent wieder, ohne es bloß zu ‚edel‘ abzuschwächen.
- source_word: ἐλπίδα τῆς ὑπομονῆς
  choice: Hoffnung des standhaften Ausharrens
  rationale: Die Genitivverbindung bleibt bewusst relativ offen; ὑπομονή bezeichnet im Martyriumskontext beharrliches, standhaftes Ausharren.
- source_word: γενναίως
  choice: tapfer
  rationale: Das Adverb bezeichnet ein mutiges, charakterlich edles Verhalten. ‚Tapfer‘ ist natürlich und vermeidet eine schwerfällige Wiederholung von ‚Mut‘.
- source_word: ἔχουσα
  choice: halte … fest
  rationale: Das Partizip beschreibt die begleitende Haltung der Mutter. ‚Festhalten‘ entspricht dem Kontext des Ausharrens, ohne den Satz unnötig zu verkomplizieren.
- source_word: πρὸς θεόν
  choice: auf Gott gerichtet
  rationale: πρός mit Akkusativ bezeichnet hier die Ausrichtung auf Gott. Die Formulierung wahrt diese Orientierung, ohne sie enger als ‚Hoffnung auf Gott‘ oder ‚Vertrauen in Gott‘ auszulegen.
theological_decisions:
- issue: Religiöse Bedeutung von ἱερόψυχε
  choice: mit heiliger Seele
  alternative: heilig gesinnte; edelmütige
  rationale: Die Übersetzung bewahrt ausdrücklich das sakrale Element ἱερο-. ‚Edelmütig‘ würde die religiöse Färbung abschwächen, während ‚heilig gesinnt‘ die Aussage stärker auf die Gesinnung festlegt.
- issue: Bezug von πρὸς θεόν
  choice: auf Gott gerichtet
  alternative: Hoffnung auf Gott; vor Gott
  rationale: Die offene Richtungsbedeutung des Griechischen bleibt erhalten. So wird weder die Genitivverbindung noch die genaue Art der Gottesbeziehung dogmatisch vereindeutigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt feierlich, aber verständlich; die ungewöhnliche griechische Wortbildung wird im Text lesbar entfaltet und in der Fußnote erläutert.
