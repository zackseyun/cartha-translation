  text: These also vindicated the nation[a], looking to God and enduring torments even to death.
translation:
  language: de
  text: Auch sie verschafften dem Volk Recht[a], indem sie den Blick auf Gott richteten und die Folterqualen bis zum Tod ertrugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »rächten das Volk« oder »erwirkten dem Volk sein Recht«. Das griechische Verb kann gerichtliche oder vergeltende Bedeutung haben; im Zusammenhang des Martyriums liegt hier nahe, dass ihr Leiden dem Volk vor Gott Recht verschaffte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ καὶ
  choice: Auch sie
  rationale: Gibt den rückbezüglichen Charakter von οἵ und die hinzufügende Kraft von καί in natürlichem Deutsch wieder.
- source_word: ἐξεδίκησαν
  choice: verschafften … Recht
  rationale: Das Verb kann gerichtliche wie vergeltende Bedeutung haben. Im Zusammenhang gewaltlosen Martyriums bezeichnet die Wendung am ehesten, dass ihr standhaftes Leiden dem Volk Recht beziehungsweise Rechtfertigung verschaffte, ohne eine von ihnen ausgeübte Vergeltung nahezulegen.
- source_word: τὸ ἔθνος
  choice: dem Volk
  rationale: Gemeint ist das jüdische Volk als kollektive Größe. „Volk“ ist im Deutschen hier natürlicher und weniger modern-staatlich als „Nation“.
- source_word: εἰς θεὸν ἀφορῶντες
  choice: indem sie den Blick auf Gott richteten
  rationale: Bewahrt die bildhafte Ausrichtung der Aufmerksamkeit auf Gott und lässt Vertrauen anklingen, ohne es ausdrücklich in den Text einzutragen.
- source_word: μέχρι θανάτου
  choice: bis zum Tod
  rationale: Gibt die äußerste Grenze ihres Ausharrens klar und unmittelbar wieder.
- source_word: τὰς βασάνους
  choice: die Folterqualen
  rationale: Im Märtyrerkontext sind konkret zugefügte Foltern gemeint; „Folterqualen“ wahrt sowohl den Vorgang als auch seine schmerzhafte Intensität.
- source_word: ὑπομείναντες
  choice: ertrugen
  rationale: Drückt standhaftes Ausharren unter den zugefügten Folterqualen in idiomatischem Deutsch aus.
theological_decisions:
- issue: Bedeutung von ἐξεδίκησαν im Kontext des Martyriums
  choice: Sie verschafften dem Volk Recht.
  alternative: Sie rächten das Volk; sie erwirkten die Rechtfertigung des Volkes.
  rationale: Der Kontext beschreibt keine gewaltsame Vergeltung durch die Märtyrer, sondern ihre Ausrichtung auf Gott und ihr Ausharren bis zum Tod. Die gewählte Fassung bewahrt die gerichtliche beziehungsweise vindizierende Kraft des Verbs, ohne eine bestimmte Lehre über die Heilswirkung ihres Todes festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur verbindet die beiden griechischen Partizipien verständlich mit der Haupthandlung. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
