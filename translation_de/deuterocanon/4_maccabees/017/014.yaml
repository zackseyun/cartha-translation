  yaml_path: translation/deuterocanon/4_maccabees/017/014.yaml
  text: The tyrant kept struggling[a], but the world and the life of mankind were watching.
translation:
  language: de
  text: Der Tyrann rang weiter; die Welt aber und das Leben der Menschen sahen zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bezeichnet fortdauernden Widerstreit; gegen wen oder was der Tyrann rang, wird in diesem Satz nicht genannt.
    reason: Bewahrt die im griechischen Satz unausgesprochene Gegnerrelation und erläutert zugleich die durative Imperfektform.
lexical_decisions:
- source_word: ὁ τύραννος
  choice: der Tyrann
  rationale: „Tyrann“ bewahrt die negative Bedeutung eines gewaltsamen, unterdrückerischen Herrschers.
- source_word: ἀντηγωνίζετο
  choice: kämpfte dagegen an
  rationale: Der Imperfekt bezeichnet einen andauernden Widerstreit. „Dagegen“ lässt das im Griechischen unausgesprochene Gegenüber unbestimmt und macht den adversativen Sinn im Deutschen dennoch verständlich.
- source_word: ὁ δὲ κόσμος
  choice: die Welt aber
  rationale: Die Nachstellung von „aber“ gibt δέ in einem gehobenen, zugleich natürlichen deutschen Satzbau wieder und markiert den Kontrast.
- source_word: ὁ τῶν ἀνθρώπων βίος
  choice: das Leben der Menschen
  rationale: Die Formulierung erhält den kollektiven und personifizierten Charakter von βίος mit dem Genitivattribut τῶν ἀνθρώπων, ohne ihn abstrakt umzudeuten.
- source_word: ἐθεώρει
  choice: sahen zu
  rationale: „Zusehen“ passt zum Bild eines öffentlichen Schauspiels. Die deutsche Pluralform bezieht sich sinngemäß auf die beiden verbundenen Subjekte; der griechische Singular kann sie als zusammengehörige Vorstellung fassen.
theological_decisions:
- issue: Personifizierung der Welt und des Lebens der Menschen als Zuschauer
  choice: Die personifizierte Bildsprache bleibt im Haupttext erhalten.
  alternative: 'Abstrakter: „Die menschliche Lebenswelt beobachtete es.“'
  rationale: Der griechische Text stellt das Geschehen rhetorisch als weltweites menschliches Schauspiel dar. Eine Auflösung der Personifizierung würde diese Spannung abschwächen.
- issue: Unausgesprochenes Gegenüber bei ἀντηγωνίζετο
  choice: Kein konkretes Objekt wie „gegen sie“ ergänzen; stattdessen „dagegen ankämpfen“.
  alternative: „kämpfte gegen sie an“ oder absolut „rang weiter“
  rationale: Der Kontext mag die Märtyrer als Gegenüber nahelegen, doch der vorliegende griechische Satz nennt sie nicht. „Dagegen“ wahrt die Leerstelle besser und bleibt im Deutschen verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die auffällige Personifizierung bleiben erhalten; unnötige Kontextauffüllungen werden vermieden.
