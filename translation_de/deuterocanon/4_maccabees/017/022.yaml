  source_fidelity: 'Die wesentlichen Begriffe sind treffend wiedergegeben: ἀντίψυχον als »Lösegeld«, εὐσεβῶν als »Gottesfürchtigen«, ἱλαστηρίου θανάτου als »sühnenden Tod«, θεία πρόνοια als »göttliche Vorsehung« und διέσωσεν als »bewahrte«. Die Wiedergabe von προκακωθέντα als »schwer misshandelt« ist jedoch unnötig eng und körperlich geprägt; der griechische Ausdruck bezeichnet allgemeiner ein zuvor erlittenes Übel bzw. Bedrängtwerden. Außerdem sollte der im Griechischen fortlaufende Satz nicht nach dem einleitenden Vergleich in einen unvollständigen deutschen Nebensatz zerlegt werden.'
  naturalness: Der Satzanfang »als wären sie ... geworden.« ist wegen des anschließenden Punktes syntaktisch unvollständig. Mit einem Komma und einem anschließenden Hauptsatz wird die Konstruktion idiomatisch und zugleich nahe am griechischen Satzbau. »Zuvor schwer bedrängt worden war« ist für Israel im Deutschen natürlicher und weniger spezifizierend als »schwer misshandelt worden war«.
  terminology: '»Sühnender Tod« wahrt die in diesem Kontext naheliegende sühnebezogene Bedeutung von ἱλαστήριος, ohne eine bestimmte Sühnetheorie festzulegen. Die Fußnote sollte nicht von einem bloß »verwandten Substantiv« sprechen: Dasselbe griechische Wort kann in anderen Kontexten »Sühnedeckel« bezeichnen.'
