  text: as though they had become a ransom for the sin of the nation[a], and through the blood of those devout ones and their propitiatory death, divine providence preserved Israel[b], though it had been mistreated before.
translation:
  language: de
  text: Als wären sie zum Lösegeld für die Sünde des Volkes geworden[a], bewahrte die göttliche Vorsehung Israel, das zuvor schwer bedrängt worden war, durch das Blut jener Gottesfürchtigen und durch ihren sühnenden Tod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als wären sie zu einem Ersatzleben für die Sünde des Volkes geworden« beziehungsweise »als hätten sie ihr Leben im Austausch für die Sünde des Volkes gegeben«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet hier einen Tod mit sühnender Wirkung. Möglich sind auch »Sühnetod« oder »versöhnender Tod«; in anderen Zusammenhängen kann dasselbe Wort den »Sühnedeckel« bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίψυχον
  choice: Lösegeld
  rationale: Das Wort bezeichnet eine Gegenleistung für ein Leben beziehungsweise einen Ersatz anstelle eines Lebens. »Lösegeld« gibt den Austauschgedanken knapp und verständlich wieder, ohne den genauen Wirkmechanismus festzulegen.
- source_word: ἁμαρτίας
  choice: Sünde
  rationale: Der religiös-moralische Sinn ist hier deutlich; »Sünde« ist genauer als das schwächere »Vergehen«.
- source_word: εὐσεβῶν
  choice: Gottesfürchtigen
  rationale: Das Adjektiv bezeichnet Menschen, die Gott ehrfürchtig ergeben sind. »Gottesfürchtig« ist im Deutschen würdevoll und in diesem religiösen Zusammenhang klar.
- source_word: ἱλαστηρίου
  choice: sühnenden
  rationale: Das Adjektiv bestimmt den Tod als einen Tod mit sühnender Wirkung. »Sühnend« ist im Deutschen natürlich und vermeidet die irreführende wörtliche Deutung als kultischer »Sühnedeckel«.
- source_word: θανάτου
  choice: Tod
  rationale: Die direkte Wiedergabe bezeichnet den Tod der Gottesfürchtigen als Mittel der Bewahrung.
- source_word: θεία πρόνοια
  choice: die göttliche Vorsehung
  rationale: Die feste deutsche Wendung bewahrt die Aussage über Gottes fürsorgliches und lenkendes Handeln, ohne das griechische Abstraktum unnötig zu personalisieren.
- source_word: προκακωθέντα
  choice: das zuvor schwer misshandelt worden war
  rationale: Die Form bezeichnet Israel als zuvor erlittenem Übel beziehungsweise harter Behandlung ausgesetzt. Die passive, zeitlich vorgeordnete Bedeutung bleibt ausdrücklich erhalten.
- source_word: διέσωσεν
  choice: bewahrte
  rationale: Das Verb bezeichnet die Rettung beziehungsweise sichere Bewahrung durch eine Gefahr hindurch. »Bewahrte« passt zur nationalen Rettung Israels und vermeidet zusätzliche soteriologische Festlegungen.
theological_decisions:
- issue: Sühnende Bedeutung von ἱλαστηρίου im Zusammenhang mit dem Märtyrertod
  choice: ihren sühnenden Tod
  alternative: 'ihren Sühnetod; ihren versöhnenden Tod; wörtlich in anderem Zusammenhang: ihren Tod als Sühnedeckel'
  rationale: Der Ausdruck schreibt dem Tod eine sühnende Wirkung zu, ohne deren Mechanismus genauer zu erklären. Die adjektivische Wiedergabe wahrt diese theologische Aussage und vermeidet zugleich die in diesem Kontext missverständliche kultgegenständliche Bedeutung.
- issue: Austausch- oder Stellvertretungsgedanke in ἀντίψυχον γεγονότας
  choice: als wären sie zum Lösegeld für die Sünde des Volkes geworden
  alternative: als wären sie zum Ersatzleben für die Sünde des Volkes geworden; als hätten sie ihr Leben im Austausch für die Sünde des Volkes gegeben
  rationale: Das Griechische verwendet Austausch- und Stellvertretungssprache. »Lösegeld« bewahrt diese Kraft, lässt aber offen, wie genau die sühnende Wirkung zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist gegenüber dem Griechischen leicht gegliedert, damit die beiden Mittelangaben klar lesbar bleiben. Das einleitende »als« folgt dem überlieferten Versfragment und setzt den Gedanken des vorangehenden Zusammenhangs fort.
