  - severity: medium
    issue: „Kindersegen“ ersetzt παιδοποιία interpretierend.
    rationale: παιδοποιία bezeichnet das Kinderzeugen bzw. Kindergebären. „Kindersegen“ fügt eine positive Segenswertung hinzu und kann die Nachkommenschaft statt des Vorgangs bezeichnen.
  - severity: low
