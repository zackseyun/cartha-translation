  yaml_path: translation/deuterocanon/4_maccabees/017/006.yaml
  text: For your childbearing was from Abraham the child[a].
translation:
  language: de
  text: Denn das Gebären deiner Kinder ging auf Abraham, den Diener, zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „den Diener“. Das griechische Wort kann auch „Kind“ oder „Knecht“ bedeuten; hier ist wahrscheinlich Abraham als ehrend so bezeichneter Diener gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦ γὰρ
  choice: Ja, denn
  rationale: ἦ ist hier am ehesten eine bekräftigende Partikel, nicht die Imperfektform von εἰμί (die ἦν lauten würde); γάρ begründet die vorausgehende Aussage.
- source_word: ἡ παιδοποιία σου
  choice: dein Kindersegen
  rationale: παιδοποιία bezeichnet das Zeugen beziehungsweise Gebären von Kindern. Im Lob der Mutter gibt „Kindersegen“ den Bezug auf ihre hervorgebrachten Kinder natürlich und würdevoll wieder, ohne den Ausdruck auf bloße Fruchtbarkeit zu verengen.
- source_word: ἀπὸ Ἀβραὰμ
  choice: stammte von Abraham
  rationale: ἀπό bezeichnet hier Herkunft; im Zusammenhang ist die Abstammungslinie von Abraham gemeint.
- source_word: τοῦ παιδός
  choice: dem Diener Gottes
  rationale: παῖς kann „Kind“, „Diener“ oder „Knecht“ bedeuten. Bei Abraham liegt die ehrende Bezeichnung als Diener Gottes nahe; „Gottes“ verdeutlicht die im Titel vorausgesetzte Beziehung, wird aber wegen der sprachlichen Mehrdeutigkeit in einer Fußnote offengelegt.
theological_decisions:
- issue: Bedeutung von παῖς als Bezeichnung Abrahams
  choice: Diener Gottes
  alternative: Kind; Knecht
  rationale: Die ehrende Bezeichnung Abrahams als Gottes Diener passt am besten zum jüdischen Sprachgebrauch und zum Kontext. Da der griechische Ausdruck „Gottes“ nicht ausdrücklich enthält und παῖς auch „Kind“ heißen kann, bleibt diese Spannung in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kindersegen“ vermeidet die im Deutschen unnatürliche Formulierung „dein Kindergebären“, während „stammte von Abraham“ die Herkunftsaussage ausdrücklich wiedergibt. Die Bekräftigung durch ἦ bleibt mit „Ja“ erhalten.
