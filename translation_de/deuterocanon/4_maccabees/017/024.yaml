  yaml_path: translation/deuterocanon/4_maccabees/017/024.yaml
  text: And it made them noble and courageous in infantry combat and siege warfare[a], and after sacking them[c][b], he conquered all the enemies.
translation:
  language: de
  text: Und es machte sie edel und mutig im Kampf zu Fuß und bei Belagerungen[a]; und nachdem er sie verwüstet hatte[b][c], besiegte er alle Feinde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Kampf zu Fuß und für Belagerungen“. Das griechische Wort bezeichnet wörtlich das Kämpfen zu Fuß.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann „völlig verwüsten“, „verheeren“ oder „plündern“ bedeuten und wird häufig vom Verwüsten von Städten oder Festungen gebraucht.
    reason: lexical_alternative
  - marker: c
    text: Das Objekt ist im Griechischen nicht ausdrücklich genannt; auch „nachdem er Städte oder Festungen verwüstet hatte“ ist dem Sinn nach möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσχεν
  choice: sie machte
  rationale: Mit dem doppelten Akkusativ αὐτοὺς γενναίους καὶ ἀνδρείους hat ἔχω hier resultative beziehungsweise kausative Kraft. Das feminine „sie“ bewahrt im Deutschen einen unausgesprochenen, aus dem Kontext zu erschließenden Bezug, ohne ihn namentlich festzulegen.
- source_word: γενναίους
  choice: edel
  rationale: „Edel“ erhält die charakterliche Nuance von γενναῖος und unterscheidet sie von dem ausdrücklich auf Tapferkeit zielenden ἀνδρείους.
- source_word: ἀνδρείους
  choice: mutig
  rationale: „Mutig“ gibt die Bedeutung militärischer Tapferkeit natürlich wieder, ohne die im Deutschen unpassende geschlechtliche Färbung von „mannhaft“ aufzudrängen.
- source_word: εἰς πεζομαχίαν
  choice: im Fußkampf
  rationale: πεζομαχία bezeichnet wörtlich den Kampf zu Fuß. „Fußkampf“ ist knapp, militärisch verständlich und vermeidet die engere, im Griechischen nicht zwingende Vorstellung eines unmittelbaren Nahkampfs.
- source_word: πολιορκίαν
  choice: bei Belagerungen
  rationale: Das Substantiv bezeichnet Belagerung beziehungsweise Belagerungskrieg; die pluralische deutsche Form ist im Zusammenhang natürlich und bleibt sachlich nah am griechischen Ausdruck.
- source_word: ἐκπορθήσας
  choice: nachdem er sie verwüstet hatte
  rationale: ἐκπορθέω bedeutet ausplündern, verheeren oder völlig verwüsten. Das Pronomen bewahrt das im Griechischen nicht ausdrücklich genannte Objekt, ohne „Städte“ oder „Festungen“ in den Haupttext einzutragen.
- source_word: ἐνίκησεν
  choice: besiegte er
  rationale: νικάω bedeutet siegen über oder besiegen. „Besiegte“ ist hier natürlicher als „eroberte“, da sich das Verb auf Feinde bezieht.
- source_word: πάντας τοὺς πολεμίους
  choice: alle Feinde
  rationale: Die Wiedergabe folgt dem bestimmten pluralischen Ausdruck, ohne ein im Griechischen nicht vorhandenes Possessivpronomen wie „seine“ hinzuzufügen.
theological_decisions:
- issue: Unausgesprochener Bezug von ἔσχεν und Wechsel zur maskulinen Singularform in ἐκπορθήσας/ἐνίκησεν
  choice: Den Wechsel als „sie machte …; und nachdem er …, besiegte er …“ sichtbar lassen.
  alternative: Aus dem weiteren Kontext durchgehend „die Vernunft“, „die Mutter“ oder eine andere ausdrücklich benannte Person als Subjekt einsetzen und die Konstruktion glätten.
  rationale: 'Der griechische Satz ist rhetorisch verdichtet: Das Subjekt von ἔσχεν bleibt unausgesprochen, während Partizip und finites Verb anschließend maskulin Singular sind. Die Übersetzung erhält diese Spannung, statt den Bezug stillschweigend festzulegen.'
- issue: Unausgesprochenes Objekt von ἐκπορθήσας
  choice: Mit „sie“ wiedergeben und die mögliche militärische Sachbedeutung in einer Fußnote erläutern.
  alternative: „Nachdem er Städte/Festungen verwüstet hatte“ oder absolut „nachdem er Verwüstungen angerichtet hatte“.
  rationale: Im griechischen Text steht kein ausdrückliches Objekt. Ein bestimmtes Objekt wie „Städte“ wäre zwar lexikalisch naheliegend, würde aber eine kontextuelle Ergänzung in den Haupttext einführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst knappem militärischem Wortschatz. Der abrupte Wechsel vom femininen, unausgesprochenen Bezug („sie“) zum maskulinen Handelnden („er“) bleibt erhalten; die Fußnoten erläutern die lexikalische und syntaktische Offenheit.
