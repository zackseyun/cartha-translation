translation:
  language: de
  text: Doch die Gottesfurcht siegte[a], indem sie ihre eigenen Athleten krönte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch die Frömmigkeit siegte, indem sie ihre eigenen Athleten krönte.“ Das griechische Wort bezeichnet ehrfürchtige Hingabe an Gott und wird hier als Siegerin personifiziert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεοσέβεια
  choice: Gottesfurcht
  rationale: Das Substantiv bezeichnet ehrfürchtige Verehrung und Hingabe gegenüber Gott. „Gottesfurcht“ bewahrt den ausdrücklichen Gottesbezug und ist im Deutschen natürlicher und prägnanter als „Gottesverehrung“.
- source_word: ἐνίκα
  choice: siegte
  rationale: Das Verb gehört zur Bildwelt des Wettkampfs. „Siegte“ gibt die Aussage knapp und idiomatisch wieder und verbindet sich natürlich mit den Athleten und ihrer Krönung.
- source_word: τοὺς ἑαυτῆς
  choice: ihre eigenen
  rationale: Das Reflexivpronomen betont, dass die Athleten zur personifizierten Gottesfurcht gehören. Da „Gottesfurcht“ im Deutschen feminin ist, bleibt die Personifikation in „ihre“ ohne sprachliche Künstlichkeit erhalten.
- source_word: ἀθλητάς
  choice: Athleten
  rationale: „Athleten“ erhält die ausdrückliche Wettkampfmetaphorik des griechischen Wortes. „Kämpfer“ wäre allgemeiner und würde das sportliche Bild abschwächen.
- source_word: στεφανοῦσα
  choice: indem sie … krönte
  rationale: Das Partizip beschreibt die siegreiche Gottesfurcht beim Krönen ihrer Athleten. „Krönte“ bewahrt das Bild der Verleihung des Siegeskranzes, ohne es im Haupttext erklärend auszubauen.
theological_decisions:
- issue: Personifikation der θεοσέβεια
  choice: Die Gottesfurcht wird als Siegerin dargestellt, die ihre eigenen Athleten krönt.
  alternative: „Die Frömmigkeit siegte und krönte ihre eigenen Athleten.“
  rationale: Die feminine Personifikation ergibt sich im Deutschen natürlich aus dem grammatischen Geschlecht von „Gottesfurcht“. So bleibt die rhetorische Spannung des griechischen Textes erhalten, ohne eine zusätzliche Auslegung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wettkampfmetaphorik wird durch „siegte“, „Athleten“ und „krönte“ konsequent bewahrt; „indem“ macht den Bezug des griechischen Partizips klar, ohne die Aussage theologisch aufzulösen.
