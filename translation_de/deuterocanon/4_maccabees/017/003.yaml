    issue: „standgehalten“ für ὑπήνεγκας
    rationale: Das Verb bedeutet primär tragen bzw. ertragen. „Standhalten“ ist im Erdbebenbild möglich, verschiebt den Akzent jedoch von erduldendem Tragen zu widerstehendem Abwehren.
