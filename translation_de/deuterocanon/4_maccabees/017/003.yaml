base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/003.yaml
  text: For just as you[a], like a roof firmly established upon the pillar of the children, bravely bore the earthquake through tortures without wavering,
translation:
  language: de
  text: Denn wie ein Dach, das fest auf der Säule deiner Kinder[a] gegründet ist, hast du das Erdbeben durch die Foltern mutig und ohne zu wanken ertragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deiner Söhne«. Das griechische Wort kann je nach Zusammenhang »Kinder«, »Söhne« oder »Jungen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Denn wie
  rationale: Bewahrt sowohl den begründenden Anschluss durch γάρ als auch den Vergleich durch καθάπερ und klingt im Deutschen natürlich.
- source_word: στέγη
  choice: Dach
  rationale: Die konkrete architektonische Bedeutung erhält das Bild, das mit Säule und Erdbeben fortgeführt wird.
- source_word: ἐπὶ τοῦ στύλου
  choice: auf der Säule
  rationale: Gibt die räumliche und tragende Funktion des στῦλος innerhalb der Baumetapher direkt wieder.
- source_word: τῶν παίδων
  choice: deiner Kinder
  rationale: Der Genitiv bezeichnet im Kontext die Kinder der angeredeten Mutter. Das possessive Verhältnis wird im Deutschen natürlich ausdrücklich gemacht; eine Fußnote nennt die kontextuell engere Alternative „Söhne“.
- source_word: γενναίως ἱδρυμένη
  choice: fest … gegründet … mutig
  rationale: ἱδρυμένη bezeichnet das feste Gegründetsein, γενναίως die mutige beziehungsweise tapfere Haltung. Die deutsche Wortstellung ordnet beide Angaben ihren jeweiligen Bildteilen verständlich zu.
- source_word: ἀκλινῶς
  choice: unerschütterlich
  rationale: Das Adverb bedeutet ohne Neigung oder Wanken. „Unerschütterlich“ drückt Standhaftigkeit aus und greift zugleich das Erdbebenbild auf.
- source_word: ὑπήνεγκας
  choice: hast … standgehalten
  rationale: Das Verb bezeichnet das Tragen beziehungsweise Aushalten unter einer Belastung. Bei einem Erdbeben ist „standhalten“ idiomatisch und bewahrt die Vorstellung baulicher Festigkeit.
- source_word: τὸν διὰ τῶν βασάνων σεισμόν
  choice: dem durch die Foltern ausgelösten Erdbeben
  rationale: σεισμός bleibt konkret als „Erdbeben“ erhalten. διά mit Genitiv bezeichnet hier die vermittelnde Ursache beziehungsweise das Mittel; die Formulierung macht den Zusammenhang mit den Foltern verständlich, ohne die Metapher aufzulösen.
theological_decisions:
- issue: Architektonische Darstellung der Mutter im Martyrium
  choice: Die Bildfolge „Dach – Säule – Erdbeben“ bleibt vollständig erhalten.
  alternative: 'Das Bild dynamisch auflösen, etwa: „Du hast deine Kinder geschützt und die Foltern standhaft ertragen.“'
  rationale: Der griechische Text entwirft bewusst eine dichte Baumetapher. Ihre Bewahrung lässt die rhetorische Spannung bestehen und vermeidet eine interpretierende Verengung auf eine einzelne Schutz- oder Stützfunktion.
- issue: Bezug von τῶν παίδων
  choice: „deiner Kinder“ mit Fußnote zur Alternative „Söhne“
  alternative: „deiner Söhne“
  rationale: Im Erzählzusammenhang sind die Söhne der Mutter gemeint; παῖδες ist lexikalisch jedoch weiter und kann Kinder, Söhne oder Jungen bezeichnen. Der Haupttext wahrt diese Breite, die Fußnote verdeutlicht den Kontext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die architektonische Metapher wird trotz ihrer ungewöhnlichen Logik nicht geglättet. Der Vers bleibt als begründender Vergleich syntaktisch offen, da er im folgenden Kontext weitergeführt wird.
