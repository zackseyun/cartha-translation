    rationale: Die Formulierung legt fest, dass die Foltern das metaphorische Erdbeben verursachen. διά mit Genitiv kann hier zwar den Zusammenhang bzw. das Mittel bezeichnen, doch die explizite Kausaldeutung ist stärker als nötig.
