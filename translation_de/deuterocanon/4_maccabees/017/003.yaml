  source_fidelity: Die architektonische Bildfolge wird im Entwurf grundsätzlich treffend bewahrt. Allerdings deutet „durch die Foltern ausgelösten“ διά τῶν βασάνων stärker kausal aus, als der griechische Ausdruck verlangt. Zudem trifft „ertragen“ ὑπήνεγκας unmittelbarer als „standhalten“, das im Deutschen eher aktives Widerstehen ausdrückt.
  naturalness: Die revidierte Fassung bleibt würdevoll und verständlich, ohne das absichtlich kühne Bild von Dach, Säule und Erdbeben zu glätten. „Ohne zu wanken“ gibt ἀκλινῶς idiomatisch wieder und nimmt das Bau-/Erdbebenbild auf.
  terminology: „Dach“, „Säule“, „Foltern“ und „Erdbeben“ sind sachgerecht. „Kinder“ ist als weniger spezifizierende Wiedergabe von παίδων vertretbar; die Fußnote nennt die im Kontext naheliegende Alternative „Söhne“.
  issues:
