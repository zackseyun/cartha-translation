translation:
  language: de
  text: 'Denn auch Mose sagt: »Und alle Geheiligten[a] sind unter deinen Händen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die für Gott Ausgesonderten«. Das griechische Wort bezeichnet Menschen, die geheiligt oder ausgesondert worden sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »unter deinen Händen«. Das Bild kann ausdrücken, dass sie unter Gottes Macht, Fürsorge oder Autorität stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn auch
  rationale: Die Verbindung begründet die vorausgehende Aussage und fügt Mose als weiteren Beleg hinzu; »Denn auch« gibt beide Funktionen knapp und natürlich wieder.
- source_word: φησιν
  choice: sagt
  rationale: Das griechische Präsens ist die übliche Einleitungsform für ein fortdauernd gültiges Schriftzitat und wird als literarisches Präsens beibehalten.
- source_word: οἱ ἡγιασμένοι
  choice: die Geheiligten
  rationale: Das substantivierte Perfekt-Passiv-Partizip bezeichnet Menschen, die geheiligt beziehungsweise für Gott ausgesondert worden sind. »Die Geheiligten« bewahrt sowohl den passiven Vorgang als auch dessen fortdauerndes Ergebnis.
- source_word: ὑπὸ τὰς χεῖράς σου
  choice: unter deinen Händen
  rationale: Die konkrete, im Griechischen pluralische Bildsprache wird bewahrt, ohne sie einseitig als Macht, Schutz oder Fürsorge auszulegen.
theological_decisions:
- issue: Bedeutung des Bildes »unter deinen Händen«
  choice: Das Bild wird wörtlich und mehrdeutig beibehalten.
  alternative: »in deiner Macht« oder »unter deinem Schutz«
  rationale: Die Wendung kann Macht, Verfügungsgewalt, Schutz oder Fürsorge andeuten. Eine paraphrasierende Festlegung würde die im Ausgangstext bestehende Deutungsoffenheit beseitigen.
- issue: Wiedergabe der von Mose eingeführten Worte
  choice: Die Worte werden als direktes Zitat wiedergegeben.
  alternative: Indirekte Rede oder erläuternde Paraphrase
  rationale: φησιν führt die folgende Formulierung ausdrücklich als Ausspruch des Mose ein; die knappe Zitatform und ihre Spannung bleiben daher erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Formulierung »unter deinen Händen« bleibt wegen der bewussten Bildsprache des griechischen Textes erhalten; die Fußnote erläutert mögliche Bedeutungen, ohne eine davon festzuschreiben.
