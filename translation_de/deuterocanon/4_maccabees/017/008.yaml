  yaml_path: translation/deuterocanon/4_maccabees/017/008.yaml
  text: 'For it would indeed have been fitting to inscribe even these words on his very tombstone, spoken as a memorial for those of the nation:'
translation:
  language: de
  text: 'Denn es wäre angemessen gewesen, auch diese Worte, die zum Gedenken für die Angehörigen des Volkes gesprochen wurden, auf dem Grabmal selbst[a] einzuschreiben:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf der Grabinschrift selbst«. Das griechische Wort kann sowohl die Grabinschrift als auch das Denkmal bezeichnen, das sie trägt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξιον ἦν
  choice: es wäre angemessen gewesen
  rationale: Die unpersönliche Wendung bezeichnet, was passend oder gebührend gewesen wäre; der deutsche Konjunktiv gibt die rückblickende, nicht verwirklichte Angemessenheit natürlich wieder.
- source_word: ἐπὶ αὐτοῦ τοῦ ἐπιταφίου
  choice: auf dem Grabmal selbst
  rationale: ἐπιτάφιον kann die Grabinschrift oder das sie tragende Grabdenkmal bezeichnen. Mit ἀναγράψαι liegt im Deutschen das konkrete »Grabmal« nahe; »selbst« bewahrt die Hervorhebung durch αὐτοῦ τοῦ.
- source_word: ἀναγράψαι
  choice: einzuschreiben
  rationale: Das Verb bezeichnet hier das sichtbare, dauerhafte Aufzeichnen einer Inschrift und passt idiomatisch zum Grabmal.
- source_word: καὶ ταῦτα
  choice: auch diese Worte
  rationale: Das Demonstrativum weist wahrscheinlich auf die folgende Gedenkaussage voraus. »Worte« macht den durch λεγόμενα gegebenen sprachlichen Bezug verständlich, ohne den Inhalt auszudeuten.
- source_word: τοῖς ἀπὸ τοῦ ἔθνους
  choice: für die Angehörigen des Volkes
  rationale: Wörtlich sind Menschen gemeint, die zu dem Volk gehören. »Angehörige des Volkes« bewahrt den kollektiven Bezug, ohne das nicht ausdrücklich vorhandene »unser« einzufügen.
- source_word: εἰς μνείαν
  choice: zum Gedenken
  rationale: Die Wendung drückt den erinnernden Zweck aus und wird im Deutschen knapp und würdig mit »zum Gedenken« wiedergegeben.
- source_word: λεγόμενα
  choice: die … gesprochen wurden
  rationale: Das Partizip bezieht sich auf »diese Worte«. Ein Relativsatz ist im Deutschen klar und wahrt den verbalen Sinn.
