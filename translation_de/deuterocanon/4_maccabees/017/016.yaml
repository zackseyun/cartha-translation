  text: Who did not marvel at the athletes of the law of truth? Who was not astonished?[a]
translation:
  language: de
  text: Wer bewunderte nicht die Wettkämpfer für das Gesetz der Wahrheit[a]? Wer war nicht erstaunt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für das wahre Gesetz«. Die griechische Wendung kann entweder als Genitivverbindung (»das Gesetz der Wahrheit«) oder als Bezeichnung des Gesetzes als wahr verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασαν
  choice: bewunderte
  rationale: Das Verb bezeichnet sowohl Staunen als auch Bewunderung. Im Blick auf die standhaften Kämpfer bringt »bewunderte« den anerkennenden Ton der rhetorischen Frage natürlich zum Ausdruck.
- source_word: ἀθλητάς
  choice: Wettkämpfer
  rationale: Das Substantiv bezeichnet Teilnehmer an einem athletischen Wettkampf. »Wettkämpfer« erhält das für das 4. Makkabäerbuch wichtige Bild des tugendhaften Ringens, ohne es militärisch umzudeuten.
- source_word: νομοθεσίας
  choice: Gesetz
  rationale: Das Wort kann Gesetzgebung, Gesetzesordnung oder das gegebene Gesetz bezeichnen. In dieser Genitivverbindung gibt »Gesetz« den Bezug auf die göttlich gegebene Ordnung verständlich und unbürokratisch wieder.
- source_word: ἀληθείας
  choice: Wahrheit
  rationale: Der Genitiv wird substantivisch als »der Wahrheit« wiedergegeben. So bleibt offen, ob das Gesetz der Wahrheit zugehört, von ihr geprägt ist oder als wahr bezeichnet wird.
- source_word: τῆς ἀληθείας νομοθεσίας
  choice: das Gesetz der Wahrheit
  rationale: Die Genitivfügung bleibt sichtbar und ihre mögliche Deutung wird nicht vorschnell auf das bloße Adjektiv »wahr« festgelegt. Die Präposition »für« macht im Deutschen die Beziehung der Wettkämpfer zu dem Gesetz idiomatisch verständlich.
- source_word: ἐξεπλάγησαν
  choice: war nicht tief erstaunt
  rationale: Das Verb bezeichnet ein starkes Erschrecken oder überwältigtes Staunen. »Tief erstaunt« wahrt die Steigerung gegenüber »bewunderte«, ohne im Deutschen unnatürlich zu wirken.
- source_word: τίνες
  choice: Wer
  rationale: In den wiederholten rhetorischen Fragen gibt das deutsche singularische Fragepronomen »Wer« den verallgemeinernden Sinn der griechischen Pluralform idiomatisch wieder.
theological_decisions:
- issue: Bildliche Bezeichnung der Märtyrer als ἀθλητάς
  choice: Das athletische Bild wird ausdrücklich mit »Wettkämpfer« beibehalten.
  alternative: »Vorkämpfer«, »Helden« oder »Kämpfer«
  rationale: Der Text deutet ihre Treue als Wettkampf. Die Beibehaltung dieses Bildes vermeidet eine militärische oder rein ehrende Umdeutung.
- issue: Deutung von τῆς ἀληθείας νομοθεσίας
  choice: »das Gesetz der Wahrheit«
  alternative: »das wahre Gesetz«
  rationale: Die substantivische Genitivfügung bewahrt die theologische Spannung des Griechischen und legt nicht abschließend fest, ob ἀληθείας attributiv gemeint ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die beiden knappen rhetorischen Fragen und das athletische Bild bleiben erhalten; »tief erstaunt« bildet eine natürliche Steigerung zur anerkennenden Bewunderung.
