  text: For virtue was then presiding over the contest for those being tested through endurance; the victory was in incorruptibility[a], in long-lasting life.
translation:
  language: de
  text: Denn damals leitete die Tugend den Wettkampf derer, die sich durch Ausdauer bewährten; der Sieg bestand in Unvergänglichkeit, in einem Leben von langer Dauer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ewigem Leben“. Wörtlich lautet der griechische Ausdruck „in einem Leben von langer Dauer“; die Verbindung mit „Unvergänglichkeit“ kann jedoch auf ein immerwährendes Leben hindeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀθλοθέτει
  choice: leitete den Wettkampf
  rationale: Das seltene Verb gehört zur Bildwelt des sportlichen Wettkampfs und bezeichnet die Tätigkeit dessen, der einen Wettkampf ausrichtet oder ihm vorsteht. „Leitete den Wettkampf“ bewahrt die Personifikation der Tugend und ist im heutigen Deutsch verständlich.
- source_word: ἀρετή
  choice: die Tugend
  rationale: ἀρετή bezeichnet hier sittliche Vortrefflichkeit und wird personifiziert. „Tugend“ ist dafür die etablierte und kontextgerechte deutsche Entsprechung.
- source_word: διʼ ὑπομονῆς
  choice: durch Ausdauer
  rationale: ὑπομονή meint standhaftes Ausharren unter schwerer Prüfung. „Durch Ausdauer“ erhält die instrumentale Bedeutung von διά.
- source_word: δοκιμάζουσι
  choice: die sich … bewährten
  rationale: Die Form ist ein aktives Partizip im Dativ Plural und kann diejenigen bezeichnen, die in der Prüfung ihre Bewährung zeigen. Die Wiedergabe wahrt diese aktive Form, ohne den Kontext von Folter und Erprobung auszublenden.
- source_word: τὸ νῖκος
  choice: der Sieg
  rationale: „Sieg“ gibt das Wort unmittelbar wieder und führt zugleich die Wettkampfmetaphorik fort.
- source_word: ἐν ἀφθαρσίᾳ
  choice: in Unvergänglichkeit
  rationale: ἀφθαρσία bezeichnet Unvergänglichkeit oder Unverweslichkeit und kann im Kontext auch Unsterblichkeit nahelegen. „Unvergänglichkeit“ bleibt eng am griechischen Ausdruck, ohne die weitergehende Deutung ausdrücklich festzulegen.
- source_word: ἐν ζωῇ πολυχρονίῳ
  choice: in einem Leben von langer Dauer
  rationale: πολυχρόνιος bedeutet wörtlich „lange dauernd“. Die Formulierung bildet dies verständlich ab, ohne im Haupttext das stärker theologisch geprägte „ewig“ einzusetzen.
theological_decisions:
- issue: Ob ζωῇ πολυχρονίῳ ausdrücklich als „ewiges Leben“ wiederzugeben ist
  choice: ein Leben von langer Dauer
  alternative: ewiges Leben
  rationale: Der griechische Ausdruck spricht wörtlich von einem lange währenden Leben und verwendet nicht den üblichen Ausdruck für „ewig“. Der Zusammenhang mit „Unvergänglichkeit“ kann jedoch eine immerwährende Bedeutung nahelegen; deshalb wird diese mögliche Deutung in der Fußnote genannt.
- issue: Ob δοκιμάζουσι passiv als „die Geprüften“ oder aktiv als „die sich Bewährenden“ verstanden wird
  choice: die sich durch Ausdauer bewährten
  alternative: die durch Ausdauer geprüft wurden
  rationale: Die griechische Form ist morphologisch aktiv. Die gewählte Fassung wahrt dies und lässt zugleich erkennen, dass die Bewährung unter einer Prüfung geschieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Personifikation der Tugend und die Wettkampfmetaphorik bleiben erhalten. Der Semikolonbau bildet den knappen, feierlichen Gedankengang des Griechischen ab; die mögliche eschatologische Zuspitzung wird nicht in den Haupttext eingetragen, sondern als echte Deutungsmöglichkeit in der Fußnote bewahrt.
