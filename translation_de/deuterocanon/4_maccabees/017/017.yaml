  text: Indeed, the tyrant himself and all their council marveled at their endurance, because of which they now stand beside the divine throne and live the blessed age.
translation:
  language: de
  text: In der Tat staunten selbst der Tyrann und sein ganzer Rat über ihre Standhaftigkeit. Um ihretwillen stehen sie nun vor dem göttlichen Thron[a] und leben im seligen Zeitalter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beim göttlichen Thron« beziehungsweise »neben dem göttlichen Thron«. Die griechische Formulierung kann das Stehen in der Gegenwart des Thrones oder in seiner unmittelbaren Nähe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »leben das selige Zeitalter«; gemeint ist wahrscheinlich ein fortdauernder seliger Zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτός γέ τοι ὁ τύραννος
  choice: Ja, selbst der Tyrann
  rationale: Die Partikelverbindung γέ τοι unterstreicht die überraschende Aussage; „Ja, selbst“ gibt die Hervorhebung im modernen Deutschen natürlich wieder. τύραννος bleibt entsprechend der feindseligen Charakterisierung „Tyrann“.
- source_word: ὅλον τὸ συνέδριον αὐτῶν
  choice: sein ganzer Rat
  rationale: συνέδριον bezeichnet hier das versammelte Rats- oder Gerichtsgremium des Tyrannen. Das auf den Tyrannen bezogene deutsche Possessivpronomen vermeidet das missverständliche „ihr Rat“, das auf die Märtyrer bezogen werden könnte.
- source_word: ἐξεθαύμασαν
  choice: staunten über
  rationale: Das mit ἐξ- verstärkte Verb bezeichnet ausgeprägtes Erstaunen. „Staunten über“ ist klar und idiomatisch, ohne zwingend bewundernde Zustimmung einzutragen.
- source_word: τὴν ὑπομονήν
  choice: ihre Standhaftigkeit
  rationale: Im Kontext des Martyriums meint ὑπομονή das beharrliche Ausharren unter Leiden. „Standhaftigkeit“ bewahrt den moralischen Gehalt besser als bloße Belastbarkeit.
- source_word: διʼ ἣν
  choice: um ihretwillen
  rationale: Die Wendung nimmt die Standhaftigkeit als Grund der folgenden Ehrung auf. Das feminine Relativpronomen verweist eindeutig auf ὑπομονήν; die deutsche Formulierung ist zugleich natürlich.
- source_word: τῷ θείῳ ... θρόνῳ
  choice: vor dem göttlichen Thron
  rationale: θείῳ ist adjektivisch und wird daher nicht zum ausdrücklicheren „Thron Gottes“ erweitert. Bei παρίστημι mit Dativ bezeichnet die Wendung plausibel das Stehen in der Gegenwart des Thrones.
- source_word: νῦν παρεστήκασιν
  choice: stehen sie nun
  rationale: Der Perfektstamm beschreibt einen erreichten, gegenwärtig fortbestehenden Stand. Das deutsche Präsens zusammen mit „nun“ gibt diesen resultativen Zustand angemessen wieder.
- source_word: τὸν μακάριον ... αἰῶνα βιοῦσιν
  choice: leben in der seligen Ewigkeit
  rationale: Wörtlich steht „leben das selige Zeitalter“. Da dieser Akkusativ im Deutschen nicht idiomatisch ist und αἰών hier den fortdauernden seligen Zustand bezeichnet, vermittelt „leben in der seligen Ewigkeit“ den Sinn, während die Fußnote die Formulierung des Griechischen dokumentiert.
theological_decisions:
- issue: Ort beziehungsweise Stellung der Märtyrer am göttlichen Thron
  choice: Sie stehen „vor dem göttlichen Thron“.
  alternative: Sie stehen „beim“ oder „neben dem göttlichen Thron“.
  rationale: παρίστημι mit dem Dativ kann Anwesenheit und Dienst in unmittelbarer Nähe ausdrücken. „Vor“ betont die Gegenwart des Thrones, ohne eine präzise räumliche Position dogmatisch festzulegen; die Alternative bleibt in der Fußnote sichtbar.
- issue: Art der jenseitigen Belohnung
  choice: Die Märtyrer befinden sich jetzt in einem fortdauernden seligen Leben.
  alternative: Sie „leben das selige Zeitalter“, ohne dass αἰών ausdrücklich als Ewigkeit entfaltet wird.
  rationale: νῦν und die präsentisch-resultative Aussage stellen ihre gegenwärtige Rechtfertigung dar. „Ewigkeit“ ist im Kontext naheliegend, wird aber durch eine Fußnote an den wörtlicheren Ausdruck „seliges Zeitalter“ rückgebunden, ohne spätere Lehrsysteme einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Sätze lösen die lange griechische Periode lesefreundlich auf. Archaische Wendungen werden vermieden; die ungewöhnliche Thronstellung und die Bedeutung von αἰών werden durch Fußnoten offengehalten.
