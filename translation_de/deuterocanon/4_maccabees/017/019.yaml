  source_fidelity: 'Die Übersetzung von ἁγιασθέντες διὰ θεοῦ und τετίμηνται ist im Wesentlichen zutreffend. Der zweite Grund der Ehrung kehrt jedoch die syntaktisch nächstliegende Rollenverteilung des griechischen Infinitivsatzes um: τὸ ἔθνος ἡμῶν steht vor τοὺς πολεμίους und ist als Subjekt zu μὴ ἐπικρατῆσαι zu verstehen, während „die Feinde“ dessen Objekt sind. Die Vorlage sagt demnach, so unerquicklich oder kontextuell auffällig dies sein mag, dass unsere Nation über die Feinde nicht die Oberhand gewann. Eine Umkehrung zu einer Bewahrung der Nation vor Überwältigung durch die Feinde ist ohne Textgrundlage nicht angezeigt.'
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. „Durch sie“ bildet διʼ αὐτούς unmittelbarer und weniger interpretierend ab als „um ihretwillen“. Die Wiederholung „Ehre/geehrt“ bewahrt die griechische Wortverbindung angemessen.
  terminology: „Geheiligt“ ist für ἁγιασθέντες passend und wahrt den Passivcharakter. „Durch Gott“ ist als nahe Wiedergabe von διὰ θεοῦ vertretbar; die Fußnote nennt die im Deutschen oft idiomatischere agentive Alternative „von Gott“, ohne eine theologische Festlegung vorzunehmen. „Nation“ für ἔθνος ist möglich und im gegebenen Register stimmig.
  issues:
  - severity: high
    issue: Umkehrung der Handlung im Infinitivsatz
    rationale: „nicht von den Feinden überwältigt wurde“ macht die Nation zum Objekt und die Feinde zu den Handelnden. Im überlieferten griechischen Wortlaut ist τὸ ἔθνος ἡμῶν die nächstliegende Subjektsakkusativgruppe und τοὺς πολεμίους das Objekt zu ἐπικρατῆσαι. Die Übersetzung darf die inhaltlich schwierige Aussage nicht umdeuten.
  - severity: low
    issue: Interpretierende Wiedergabe von διʼ αὐτούς
    rationale: „um ihretwillen“ ist als kausale Deutung möglich, aber „durch sie“ hält die im Griechischen offene Nuance von Vermittlung bzw. Anlass sichtbarer fest.
