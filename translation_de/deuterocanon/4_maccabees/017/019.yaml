  yaml_path: translation/deuterocanon/4_maccabees/017/019.yaml
  text: And so these men also[a], having been made holy through God, have been honored not only with this honor, but also because through them our nation did not let the enemies prevail,
translation:
  language: de
  text: Und so sind auch diese, durch Gott geheiligt,[a] nicht nur mit dieser Ehre geehrt worden, sondern auch dadurch, dass unsere Nation durch sie über die Feinde nicht die Oberhand gewann,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Gott geheiligt“. Das griechische διά mit dem Genitiv kann den Handelnden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιασθέντες
  choice: geheiligt
  rationale: Das Partizip Aorist Passiv von ἁγιάζω bezeichnet hier, dass ihnen Heiligkeit verliehen wurde. „Geheiligt“ wahrt den passiven Sinn und die religiöse Aussage, ohne sie auf eine kultische Weihe einzuengen.
- source_word: διὰ θεοῦ
  choice: durch Gott
  rationale: διά mit Genitiv kann den Handelnden oder die Vermittlung bezeichnen. „Durch Gott“ folgt der griechischen Präposition eng; „von Gott“ ist als natürliche deutsche Wiedergabe der Urheberschaft ebenfalls möglich.
- source_word: τετίμηνται
  choice: sind … geehrt worden
  rationale: Das Perfekt Passiv von τιμάω beschreibt eine verliehene Ehre mit fortdauernder Geltung. Die deutsche Perfektform gibt Passiv und Ergebnis angemessen wieder.
- source_word: ταύτῃ τῇ τιμῇ
  choice: mit dieser Ehre
  rationale: Die Wendung gibt den Dativ natürlich wieder und bewahrt zugleich die Wortverbindung zwischen τιμάω und τιμή.
- source_word: τῷ διʼ αὐτοὺς
  choice: dadurch, dass um ihretwillen
  rationale: Der substantivierte Infinitivsatz nennt einen weiteren Gesichtspunkt ihrer Ehrung. διʼ αὐτούς bezeichnet hier am natürlichsten den Grund beziehungsweise den ihnen zugerechneten Anlass.
- source_word: τὸ ἔθνος ἡμῶν
  choice: unsere Nation
  rationale: ἔθνος bezeichnet hier die jüdische Volks- und Schicksalsgemeinschaft. „Nation“ wahrt den kollektiven und politischen Klang des griechischen Ausdrucks.
- source_word: τοὺς πολεμίους
  choice: die Feinde
  rationale: Der bestimmte Artikel verweist auf die im Zusammenhang vorausgesetzten feindlichen Mächte.
- source_word: μὴ ἐπικρατῆσαι
  choice: nicht von den Feinden überwältigt wurde
  rationale: 'ἐπικρατέω bedeutet die Oberhand gewinnen, sich durchsetzen oder überwältigen. Die passive deutsche Form gibt den gemeinten Ausgang idiomatisch wieder: Die Feinde gewannen über die Nation nicht die Oberhand.'
theological_decisions:
- issue: Bedeutung von ἁγιασθέντες im Zusammenhang des Martyriums
  choice: Die Märtyrer werden als durch Gott geheiligt bezeichnet.
  alternative: Sie könnten enger kultisch als von Gott geweiht verstanden werden.
  rationale: Der Zusammenhang spricht ihnen einen wirklichen heiligen Status zu, verlangt aber keine Einengung auf eine kultische Amts- oder Opferweihe. „Geheiligt“ erhält diese Offenheit.
- issue: Urheberschaft beziehungsweise Vermittlung in διὰ θεοῦ
  choice: durch Gott
  alternative: von Gott
  rationale: Die gewählte Form bewahrt διά mit Genitiv sichtbar und lässt dessen Nuance von Urheberschaft oder Vermittlung stehen, während die Fußnote auf die natürliche agentive Alternative hinweist.
- issue: Wirkung des Martyriums auf die Nation
  choice: Um ihretwillen wurde die Nation nicht von den Feinden überwältigt.
  alternative: Durch sie ließ die Nation die Feinde nicht die Oberhand gewinnen.
  rationale: Die griechische Syntax ist gedrängt. Die gewählte Fassung versteht τὸ ἔθνος ἡμῶν als das vom feindlichen Übergewicht verschonte Gemeinwesen und διʼ αὐτούς als Grund dieser Bewahrung, ohne den Wirkzusammenhang näher dogmatisch zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Ehre“ und „geehrt“ wurde als bewusstes Wortspiel des griechischen Textes beibehalten. Der Satz endet wie die griechische Vorlage mit einem Komma, da der Gedankengang im folgenden Vers weitergeführt wird.
