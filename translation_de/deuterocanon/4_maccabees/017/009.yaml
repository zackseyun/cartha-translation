  yaml_path: translation/deuterocanon/4_maccabees/017/009.yaml
  text: Here lie buried an aged priest[a], and an aged woman, and seven children, because of a tyrant’s violence, who wanted to abolish the commonwealth of the Hebrews.
translation:
  language: de
  text: Hier liegen ein betagter Priester, eine betagte Frau und sieben Söhne begraben – Opfer der Gewalt eines Tyrannen, der die Lebensordnung der Hebräer[a] beseitigen wollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das Gemeinwesen der Hebräer“ oder „die Verfassung der Hebräer“. Das griechische Wort bezeichnet die geordnete gemeinschaftliche Lebensweise eines Volkes, nicht nur den persönlichen Glauben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντάφθα
  choice: Hier
  rationale: Das deiktische Adverb bezeichnet den Bestattungsort und bewahrt den knappen, inschriftartigen Ton.
- source_word: γέρων ἱερεύς
  choice: ein betagter Priester
  rationale: γέρων bezeichnet einen Mann hohen Alters; „betagt“ wirkt im Gedenkkontext würdig und natürlich.
- source_word: γυνὴ γεραιά
  choice: eine betagte Frau
  rationale: Die Formulierung erhält die bewusste Parallele zum betagten Priester.
- source_word: ἑπτὰ παῖδες
  choice: sieben Kinder
  rationale: παῖδες kann Kinder, Jungen oder Söhne bezeichnen. „Kinder“ bewahrt die lexikalische Weite des Ausdrucks; aus dem Erzählzusammenhang ergibt sich, dass die sieben Söhne der Frau gemeint sind.
- source_word: ἐγκεκήδευνται
  choice: sind bestattet worden
  rationale: Das Perfekt Passiv bezeichnet die vollzogene Bestattung mit fortdauerndem Ergebnis. Die deutsche Perfektform gibt dies idiomatisch wieder.
- source_word: διὰ τυράννου βίαν
  choice: infolge der Gewalt eines Tyrannen
  rationale: διά mit Akkusativ bezeichnet hier die Ursache; „infolge“ macht den Kausalzusammenhang deutlich, ohne βία über „Gewalt“ hinaus zu verstärken.
- source_word: τὴν Ἑβραίων πολιτίαν
  choice: die Lebensordnung der Hebräer
  rationale: πολιτεία umfasst die geordnete gemeinschaftliche, gesetzlich bestimmte Lebensweise eines Volkes und nicht nur persönliche Religionsausübung. „Lebensordnung“ ist verständlich und bewahrt diese Breite; andere mögliche Akzente werden in der Fußnote genannt.
- source_word: καταλῦσαι
  choice: beseitigen
  rationale: Das Verb bezeichnet hier das Aufheben oder Zerstören einer bestehenden Ordnung. „Beseitigen“ verbindet institutionellen und gewaltsamen Sinn.
- source_word: θέλοντος
  choice: der … wollte
  rationale: Das Genitivpartizip bezieht sich auf den Tyrannen und bezeichnet seine Absicht; ein Relativsatz ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Bedeutung von πολιτεία im jüdischen Märtyrerkontext
  choice: die Lebensordnung der Hebräer
  alternative: das Gemeinwesen der Hebräer; die Verfassung der Hebräer
  rationale: 'Der Begriff bezeichnet mehr als privaten Glauben: Er schließt das gemeinschaftliche, vom überlieferten Gesetz geordnete Leben des Volkes ein. Da keine einzelne deutsche Entsprechung alle Aspekte wiedergibt, bleibt die mögliche politische beziehungsweise verfassungsmäßige Nuance in der Fußnote sichtbar.'
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem Gedenk- beziehungsweise Inschriftenton. Die Wiederholung von „betagt“ spiegelt die formale Parallelität des Griechischen. Der lange Schlusssatz bleibt eng am syntaktischen Zusammenhang der Vorlage.
