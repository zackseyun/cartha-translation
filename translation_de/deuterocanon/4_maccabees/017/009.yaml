  source_fidelity: Die Aussage wird im Wesentlichen zutreffend wiedergegeben. Das Perfektpassiv ἐγκεκήδευνται bezeichnet jedoch den gegenwärtigen Zustand der Begrabenen besser mit „liegen begraben“ als mit dem deutschen Vorgangspassiv „sind bestattet worden“. Im erzählerischen Kontext sind die sieben παῖδες die sieben männlichen Nachkommen der Frau; „sieben Söhne“ ist daher die präzisere referentielle Wiedergabe.
  naturalness: „Hier sind ... bestattet worden“ ist im Deutschen zwar verständlich, aber für die deiktisch-epitaphartige Aussage weniger idiomatisch. „Hier liegen ... begraben“ ist knapp, würdig und natürlich. Die appositionelle Fügung „Opfer der Gewalt“ stellt den kausalen Zusammenhang klar dar.
  terminology: „Lebensordnung der Hebräer“ ist als weite Wiedergabe von πολιτεία vertretbar; die Fußnote wahrt zutreffend die Nuancen von Gemeinwesen und Verfassung. „Beseitigen“ gibt καταλῦσαι im Blick auf eine bestehende Ordnung angemessen wieder.
