base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/007.yaml
  text: But if it were possible for us[a], as for a painter, to depict the godliness of your story, would not those who looked on shudder at a mother of seven children enduring varied tortures, because of godliness, all the way to death?
translation:
  language: de
  text: Wenn es uns aber möglich wäre, gleich einem Maler[a] die Frömmigkeit[b] deiner Geschichte bildlich darzustellen, würden dann nicht die Betrachter erschauern beim Anblick einer Mutter von sieben Kindern, die um der Frömmigkeit willen vielfältige Foltern bis zum Tod erträgt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist stark verkürzt; sinngemäß auch: „wie es ein Maler tun würde“.'
    reason: source_ambiguity
  - marker: b
    text: 'Oder: „Gottesfurcht“. Dasselbe griechische Wort steht auch bei „um der Frömmigkeit willen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ ἔξον ἡμῖν ἦν
  choice: Wenn es uns aber möglich wäre
  rationale: Die Formulierung bewahrt den hypothetischen Charakter; ἔξον kann Möglichkeit oder Erlaubnis bezeichnen, wobei im Zusammenhang die Möglichkeit im Vordergrund steht.
- source_word: ὥσπερ τινός, ζωγραφῆσαι
  choice: gleich einem Maler … bildlich darzustellen
  rationale: ζωγραφέω bezeichnet das Malen beziehungsweise anschauliche Darstellen. Die knappe griechische Wendung wird mit einer natürlichen deutschen Malermetapher wiedergegeben, ohne sie rein abstrakt aufzulösen.
- source_word: τὴν τῆς ἱστορίας σου εὐσέβειαν
  choice: die Frömmigkeit deiner Geschichte
  rationale: εὐσέβεια bezeichnet hier ehrfürchtige, Gott zugewandte Treue. ἱστορία meint die erzählte Geschichte beziehungsweise den Bericht über die angesprochene Mutter.
- source_word: οὐκ ἂν ἔφριττον οἱ θεωροῦντες
  choice: würden dann nicht die Betrachter erschauern
  rationale: Die rhetorische Frage bleibt erhalten; φρίσσω bezeichnet eine körperlich spürbare Reaktion des Schauderns, θεωρεῖν das aufmerksame Anschauen.
- source_word: μητέρα ἑπτὰ τέκνων
  choice: eine Mutter von sieben Kindern
  rationale: τέκνα ist geschlechtsübergreifend ‚Kinder‘, auch wenn der weitere Erzählzusammenhang von sieben Söhnen handelt.
- source_word: διʼ εὐσέβειαν
  choice: um der Frömmigkeit willen
  rationale: διά mit Akkusativ gibt hier den Beweggrund beziehungsweise die Ursache an. Die Wiederholung desselben deutschen Schlüsselbegriffs bewahrt die thematische Wiederholung des Griechischen.
- source_word: ποικίλας βασάνους
  choice: vielfältige Foltern
  rationale: ποικίλος betont die Verschiedenartigkeit, βάσανος bezeichnet im Martyriumskontext konkrete Folterqualen.
- source_word: μέχρι θανάτου ὑπομενούσαν
  choice: bis zum Tod erträgt
  rationale: ὑπομένω bezeichnet standhaftes Ausharren unter Leiden; μέχρι θανάτου markiert dessen äußerste Grenze.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Martyriumskontext
  choice: Frömmigkeit
  alternative: Gottesfurcht; fromme Treue
  rationale: „Frömmigkeit“ ist ein verständlicher und würdiger deutscher Leitbegriff für die Gott zugewandte Haltung, ohne den Ausdruck auf bloße Furcht oder eine bestimmte konfessionelle Vorstellung zu verengen. Die zweifache Verwendung im Vers wird bewusst gleich übersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage, die Malermetapher und die zweimalige Verwendung des theologischen Schlüsselbegriffs εὐσέβεια bleiben erhalten. „Beim Anblick“ bindet die Betrachter idiomatisch an das folgende Akkusativobjekt, ohne den Inhalt zu ergänzen.
