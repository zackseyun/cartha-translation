base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/002.yaml
  text: O mother[a], who with your seven children brought down the tyrant’s violence, and nullified his evil schemes, and displayed the nobility of faith.
translation:
  language: de
  text: O Mutter, die du mit deinen sieben Kindern die Gewalt des Tyrannen gebrochen, seine bösen Pläne vereitelt und den edlen Mut des Glaubens[a] sichtbar gemacht hast!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die edle Haltung des Glaubens“ oder „die Glaubenstreue“. Der griechische Ausdruck kann sowohl den vom Glauben getragenen edlen Mut als auch die standhafte Treue hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μήτηρ
  choice: O Mutter
  rationale: Bewahrt die direkte Anrede und den feierlich-rhetorischen Ausruf des griechischen Vokativs.
- source_word: σὺν ἑπτὰ παισίν
  choice: mit deinen sieben Kindern
  rationale: παῖς bezeichnet ein Kind und kann im Kontext auch einen Sohn meinen. „Kindern“ bleibt lexikalisch offen; „deinen“ ergibt sich natürlich aus der Anrede der Mutter und dem Zusammenhang.
- source_word: καταλύσασα
  choice: gebrochen
  rationale: Das Verb bezeichnet ein Niederreißen, Auflösen oder Außerkraftsetzen. In Verbindung mit der Gewalt des Tyrannen gibt „gebrochen“ die bildhafte Überwindung idiomatisch wieder.
- source_word: τὴν τοῦ τυράννου βίαν
  choice: die Gewalt des Tyrannen
  rationale: βία kann Kraft, Zwang oder Gewalt bedeuten; hier steht die gewaltsame Unterdrückung durch den Tyrannen im Vordergrund.
- source_word: ἀκυρώσασα
  choice: vereitelt
  rationale: Das Verb bedeutet, etwas unwirksam oder ungültig zu machen. Bei Plänen ist „vereitelt“ im Deutschen die natürliche Entsprechung.
- source_word: τὰς κακὰς ἐπινοίας αὐτοῦ
  choice: seine bösen Pläne
  rationale: ἐπινοία bezeichnet einen Gedanken, Plan oder Anschlag. „Böse Pläne“ ist klar, gegenwärtig und gibt κακάς ausdrücklich wieder.
- source_word: ἐπιδείξασα
  choice: sichtbar gemacht
  rationale: Das Verb meint ein öffentliches Aufzeigen oder Erweisen. „Sichtbar gemacht“ betont den beispielhaften Charakter ihres Handelns.
- source_word: τὴν τῆς πίστεως γενναιότητα
  choice: den edlen Mut des Glaubens
  rationale: γενναιότης umfasst Adel der Gesinnung, Hochherzigkeit und Mut. „Edler Mut“ bewahrt beide Bedeutungsfelder, während πίστις mit „Glaube“ wiedergegeben wird.
theological_decisions:
- issue: Wiedergabe von πίστις
  choice: Glaube
  alternative: Treue; Glaubenstreue; Vertrauen
  rationale: Im Zusammenhang geht es um standhafte religiöse Bindung unter Verfolgung. „Glaube“ ist die natürliche Hauptübersetzung, ohne die mögliche Nuance von Treue auszuschließen.
- issue: Verhältnis von γενναιότης und πίστις
  choice: der edle Mut des Glaubens
  alternative: die edle Haltung des Glaubens; die Glaubenstreue
  rationale: Der Genitiv lässt offen, ob die vom Glauben hervorgebrachte edle Tapferkeit oder die edle Standhaftigkeit treuer Hingabe betont wird. Die Übersetzung hält diese Spannung möglichst offen.
translation_notes:
  register: Feierlich und rhetorisch, aber in modernem Standarddeutsch. Der griechische Vokativ mit drei Partizipien wird als deutscher Ausruf mit Relativsatz wiedergegeben. Das abschließende Ausrufezeichen macht den im Griechischen angelegten Lobpreis deutlich.
