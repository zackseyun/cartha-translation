  text: For when the tyrant Antiochus saw their courage and virtue and their endurance in tortures[a], he proclaimed their endurance as an example to his soldiers.
translation:
  language: de
  text: Denn als der Tyrann Antiochus ihren Mut[a], ihre Tugend und ihre Standhaftigkeit unter den Foltern sah, erklärte er seinen Soldaten ihre Standhaftigkeit zum Vorbild.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch wörtlich: „Mannhaftigkeit“ oder „Tapferkeit“. Das griechische Wort ἀνδρία bezeichnet ausdrücklich männlich geprägten Mut beziehungsweise männliche Standhaftigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνδρίαν
  choice: Mut
  rationale: Das Wort bezeichnet männlich konnotierte Tapferkeit oder Mannhaftigkeit. „Mut“ ist im heutigen Deutsch natürlich und würdig; eine Fußnote bewahrt die ausdrücklich männliche Färbung des griechischen Ausdrucks.
- source_word: ἀρετὴν
  choice: Tugend
  rationale: Im ethischen Zusammenhang bezeichnet ἀρετή sittliche Tüchtigkeit beziehungsweise Vortrefflichkeit; „Tugend“ gibt diesen Sinn knapp und passend wieder.
- source_word: βασάνοις
  choice: Foltern
  rationale: Im Märtyrerkontext sind konkrete, zugefügte Folterqualen gemeint, nicht bloß Prüfungen.
- source_word: ὑπομονὴν
  choice: Standhaftigkeit
  rationale: Der Ausdruck bezeichnet beharrliches Ausharren unter Leiden. „Standhaftigkeit“ passt an beiden Stellen und ist im Deutschen natürlicher als „Ausdauer“ im Zusammenhang mit Folter.
- source_word: ἀφιδὼν
  choice: als … sah
  rationale: Das Partizip bezeichnet ein Wahrnehmen oder Beobachten; die temporale Wiedergabe bildet den Satzfluss natürlich ab.
- source_word: ἀνεκήρυξεν
  choice: erklärte … zum Vorbild
  rationale: Das Verb bezeichnet eine öffentliche Bekanntmachung oder Ausrufung. Mit dem prädikativen εἰς ὑπόδειγμα ergibt „zum Vorbild erklären“ eine idiomatische deutsche Formulierung.
- source_word: ὑπόδειγμα
  choice: Vorbild
  rationale: Gemeint ist ein Beispiel oder Muster, das anderen zur Nachahmung vorgestellt wird.
- source_word: στρατιώτας
  choice: Soldaten
  rationale: Der Ausdruck bezeichnet die Antiochus unterstehenden Militärangehörigen.
theological_decisions:
- issue: Geschlechtlich markierte ethische Bezeichnung ἀνδρία
  choice: Mut mit Fußnote zur männlichen Konnotation
  alternative: Mannhaftigkeit
  rationale: „Mannhaftigkeit“ spiegelt die Wortbildung formaler, klingt im modernen Standarddeutsch jedoch altertümlich und kann die Tugend unnötig auf männliche Personen begrenzen. „Mut“ vermittelt den gemeinten Wert natürlich; die Fußnote erhält die geschlechtliche Färbung des griechischen Begriffs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Aufzählung und die Wiederholung von „Standhaftigkeit“ bleiben erhalten. Die Stellung von αὐτοῦ ist im Griechischen syntaktisch eindeutig bei „seinen Soldaten“; deshalb lautet der Text „ihren Soldaten“ aus der Perspektive des Antiochus.
