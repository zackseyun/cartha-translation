  text: For truly the contest that came about through them was divine[a].
translation:
  language: de
  text: Denn der durch sie zustande gekommene Kampf war wahrhaftig göttlich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der göttliche Kampf wurde von ihnen vollbracht.« Die griechische Wendung kann hervorheben, dass der Kampf durch ihr Wirken zustande kam, oder dass er an ihnen Wirklichkeit wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: wahrhaftig
  rationale: Das Adverb bekräftigt die Aussage nachdrücklich. »Wahrhaftig« bewahrt den feierlich-rhetorischen Ton und klingt im Zusammenhang natürlich.
- source_word: ἀγών
  choice: Kampf
  rationale: Das Wort bezeichnet hier den öffentlichen, an einen Wettkampf erinnernden Kampf der Märtyrer. »Kampf« ist im Deutschen würdevoll und verständlich, ohne den Sinn unnötig auf einen sportlichen Wettkampf einzuengen.
- source_word: θεῖος
  choice: göttlich
  rationale: Die direkte adjektivische Wiedergabe lässt offen, ob der Kampf als zu Gott gehörig, von Gott geprägt oder göttlicher Art beschrieben wird.
- source_word: ὁ διʼ αὐτῶν γεγενημένος
  choice: der durch sie zustande gekommene
  rationale: Diese Formulierung gibt das Perfektpartizip und διά mit Genitiv wieder, ohne die Märtyrer eindeutig zu Urhebern des Kampfes zu machen. Sie lässt sowohl ihre vermittelnde Beteiligung als auch die Verwirklichung des Kampfes an ihnen anklingen.
theological_decisions:
- issue: Die Rolle der Märtyrer in διʼ αὐτῶν
  choice: Der Kampf ist »durch sie zustande gekommen«; ihre vermittelnde Beteiligung bleibt hervorgehoben.
  alternative: 'Der göttliche Kampf wurde von ihnen vollbracht; oder: Der Kampf wurde an ihnen Wirklichkeit.'
  rationale: διά mit Genitiv bezeichnet gewöhnlich Mittel oder Vermittlung. Die gewählte Fassung bewahrt die Spannung, dass der Kampf göttlich ist und zugleich durch das treue Zeugnis der Märtyrer Gestalt gewinnt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Partizipialfügung folgt der griechischen Satzstruktur, bleibt aber gut verständlich; die Fußnote bewahrt die echte Mehrdeutigkeit von διʼ αὐτῶν.
