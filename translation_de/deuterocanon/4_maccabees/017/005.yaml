base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/005.yaml
  text: Not so does the moon stand in majesty in heaven with the stars[a], as you, having guided your seven sons, equal to the stars, toward godliness[b], have come to stand honored before God and have been established in heaven with them.
translation:
  language: de
  text: 'Nicht so erhaben steht der Mond am Himmel mit den Sternen da wie du: Du hast deinen sieben Söhnen, die den Sternen gleichen, den Weg zur Gottesfurcht erhellt[a], stehst bei Gott geehrt da und bist zusammen mit ihnen im Himmel fest gegründet worden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast deine sieben, den Sternen gleichen Söhne zur Gottesfurcht geführt (oder: erleuchtet).“ Das griechische Verb kann ein Führen durch Licht oder ein Erleuchten ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Der Schlusssatz kann auch mit „am Himmel“ statt „im Himmel“ wiedergegeben werden. Im Zusammenhang dürfte jedoch die himmlische Ehrung der Mutter mit ihren Söhnen gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: σελήνη
  choice: der Mond
  rationale: Die natürliche deutsche Bezeichnung für den Himmelskörper; der im Griechischen fehlende Artikel wird im Deutschen idiomatisch ergänzt.
- source_word: σεμνὴ
  choice: erhaben
  rationale: Gibt die mit σεμνός bezeichnete Würde und feierliche Hoheit in der kosmischen Vergleichsszene natürlich wieder.
- source_word: καθεστήκεν / καθεστήκας
  choice: steht / bist … zu Ehren gekommen
  rationale: Die erste Wiedergabe passt zum Standort des Mondes; in der zweiten bezeichnet das Verb zusammen mit ἔντιμος den erreichten Ehrenstand der Mutter. Der unterschiedliche deutsche Ausdruck wahrt den Sinn in beiden Konstruktionen.
- source_word: ἰσαστέρους
  choice: die den Sternen gleichen
  rationale: Das Kompositum bezeichnet die Söhne als den Sternen gleich oder sternengleich und setzt das Himmelsbild fort.
- source_word: παῖδας
  choice: Söhne
  rationale: Im Erzählzusammenhang sind eindeutig die sieben männlichen Kinder der Mutter gemeint.
- source_word: φωταγωγήσασα
  choice: den Weg … erhellt
  rationale: Die Formulierung verbindet die leitende Funktion der Mutter mit dem Lichtbild des griechischen Verbs und klingt im heutigen Deutsch natürlich.
- source_word: πρὸς τὴν εὐσέβειαν
  choice: zur Gottesfurcht
  rationale: εὐσέβεια meint hier ehrfürchtige, in Treue gelebte Hingabe an Gott; „Gottesfurcht“ ist verständlich und im Kontext konkret religiös.
- source_word: ἔντιμος … θεῷ
  choice: bei Gott zu Ehren gekommen
  rationale: Gibt den von Gott anerkannten Ehrenstand wieder, ohne eine besondere amtliche Einsetzung anzudeuten.
- source_word: ἐστήρισαι
  choice: fest gegründet worden
  rationale: Bewahrt den passiven Gedanken des festen, bleibenden Aufgerichtet- oder Gefestigtseins.
- source_word: ἐν οὐρανῷ σὺν αὐτοῖς
  choice: zusammen mit ihnen im Himmel
  rationale: Im Märtyrerkontext liegt für den Schlusssatz der himmlische Ehrenort nahe; dieselbe Wiedergabe von οὐρανός erhält zugleich die Verbindung zum vorangehenden Himmelsbild.
theological_decisions:
- issue: Bedeutung von οὐρανός im Schlusssatz
  choice: Himmel
  alternative: Himmelsgewölbe
  rationale: Der Zusammenhang mit der Ehrung der Märtyrer und ihrer Mutter spricht für den himmlischen Bereich. Da das Wort auch den sichtbaren Himmel bezeichnen kann und im Vers zuvor im kosmischen Bild steht, wird die Alternative in einer Fußnote offengehalten.
- issue: Art des von φωταγωγήσασα bezeichneten Wirkens der Mutter
  choice: Sie erhellte ihren Söhnen den Weg zur Gottesfurcht.
  alternative: Sie führte beziehungsweise erleuchtete ihre Söhne zur Gottesfurcht.
  rationale: Die Übersetzung erhält sowohl das Lichtmotiv als auch die Ausrichtung auf εὐσέβεια, ohne daraus eine technisch bestimmte Lehre von Erleuchtung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kosmische Bildsprache von Mond, Sternen, Licht und Himmel bleibt erhalten; ungewöhnliche griechische Wendungen werden lesbar formuliert, während mögliche Alternativen in den Fußnoten offengehalten werden.
