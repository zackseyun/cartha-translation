  yaml_path: translation/deuterocanon/4_maccabees/017/013.yaml
  text: Eleazar was taking the lead in the contest[a]; the mother of the seven sons was competing like an athlete; and the brothers were contending.
translation:
  language: de
  text: Eleasar aber ging im Wettkampf voran[a]; die Mutter der sieben Söhne kämpfte wie eine Athletin, und die Brüder rangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht eine Folge verschiedener Wettkampfverben: Eleasar „ging im Wettkampf voran“, die Mutter „kämpfte athletisch“, und die Brüder „rangen“. Die Übersetzung bewahrt diese gemeinsame Bildwelt mit wechselnden deutschen Ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προηγωνίζετο
  choice: ging im Wettkampf voran
  rationale: Das Imperfekt von προαγωνίζομαι bezeichnet, dass Eleasar den anderen im Kampf beziehungsweise Wettstreit voranging. Die Formulierung bewahrt sowohl den Gedanken des Vorangehens als auch die agonistische Bildwelt.
- source_word: ἐνήθλει
  choice: kämpfte wie eine Athletin
  rationale: Das von ἀθλέω abgeleitete Verb trägt ausdrücklich sportlich-athletische Bedeutung. Die Wiedergabe lässt dieses Bild im Deutschen klar hervortreten.
- source_word: ἠγωνίζοντο
  choice: rangen
  rationale: ἀγωνίζομαι kann Wettkampf, Kampf oder angestrengtes Ringen bezeichnen. „Rangen“ wahrt die Weite des Ausdrucks, ohne einen wörtlichen bewaffneten Kampf festzulegen.
- source_word: μήτηρ τῶν ἑπτὰ παίδων
  choice: die Mutter der sieben Söhne
  rationale: παῖδες kann allgemein „Kinder“ bedeuten; im Erzählzusammenhang handelt es sich jedoch um sieben männliche Geschwister, weshalb „Söhne“ hier genauer ist.
- source_word: ἀδελφοὶ
  choice: die Brüder
  rationale: Der maskuline Plural bezeichnet im Kontext die sieben männlichen Geschwister und wird daher geschlechtsgenau wiedergegeben.
theological_decisions:
- issue: Durchgehende agonistische Bildsprache
  choice: Die Wettkampf- und Athletensprache bleibt in allen drei Satzgliedern erhalten.
  alternative: Die Aussagen allgemein als mutiges Leiden oder standhaftes Erdulden wiederzugeben.
  rationale: Der griechische Text verwendet bewusst drei unterschiedliche Verben aus dem Bedeutungsfeld von Wettkampf und Ringen. Diese rhetorische Gestaltung deutet das Martyrium als einen edlen Kampf und darf nicht zu allgemeiner Leidenssprache eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe dreigliedrige Struktur und die variierte Wettkampfmetaphorik des griechischen Textes bleiben erhalten.
