  text: and that the tyrant should be punished and the homeland should be purified[a].
translation:
  language: de
  text: und dass der Tyrann bestraft und die Heimat gereinigt werde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geläutert werde“. Das griechische Wort kann eine Reinigung von kultischer, sittlicher oder nationaler Befleckung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τύραννον
  choice: der Tyrann
  rationale: Das polemisch und moralisch wertende τύραννος bezeichnet hier einen gewaltsamen, unterdrückerischen Herrscher; „Tyrann“ bewahrt diese Aussagekraft.
- source_word: τιμωρηθῆναι
  choice: bestraft wurde
  rationale: Der passive Aoristinfinitiv bezeichnet das Erleiden einer Strafe. Die Wiedergabe bleibt beim gerichtlichen beziehungsweise vergeltenden Sinn, ohne ausdrücklich „Rache“ einzutragen.
- source_word: πατρίδα
  choice: die Heimat
  rationale: πατρίς bezeichnet das angestammte Land beziehungsweise Heimatland. „Heimat“ ist im Deutschen natürlich und bewahrt die emotionale Verbundenheit, ohne den politisch belasteten Klang von „Vaterland“ aufzurufen.
- source_word: καθαρισθῆναι
  choice: gereinigt wurde
  rationale: Das Verb kann kultische, sittliche und gemeinschaftlich-nationale Reinigung bezeichnen. „gereinigt“ hält diese Bedeutungsbreite offen und entspricht dem Passiv des griechischen Textes.
theological_decisions:
- issue: Bedeutung der Reinigung der Heimat
  choice: „die Heimat gereinigt wurde“ lässt kultische, sittliche und nationale Bezüge zugleich offen.
  alternative: „die Heimat von ihrer Befleckung befreit wurde“
  rationale: Der Kontext verbindet Martyrium, Sühne und die Wiederherstellung des Volkes. Eine ausdrückliche Ergänzung dessen, wovon die Heimat gereinigt wurde, würde die im Griechischen bestehende Offenheit unnötig einschränken.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dass-Konstruktion bildet den vom vorangehenden Satz abhängigen griechischen Infinitivsatz natürlich ab; die knappe Parallelität der beiden passiven Aussagen bleibt erhalten.
