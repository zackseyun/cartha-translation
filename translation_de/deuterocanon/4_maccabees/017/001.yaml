- from: Einige von den Leibwächtern[a] berichteten außerdem, dass sie sich auf den Scheiterhaufen stürzte, als auch sie ergriffen und getötet werden sollte, damit sie keinen Teil ihres Körpers berührten.[b]
  to: 'Einige der Leibwächter[a] berichteten außerdem[b]: Als auch sie gerade ergriffen werden sollte, um getötet zu werden, habe sie sich auf den Scheiterhaufen gestürzt, damit sie keinen Teil ihres Körpers berührten.'
  rationale: Die Revision bewahrt die Aussage als Bericht bestimmter Leibwächter, bringt mit »gerade ergriffen werden sollte, um getötet zu werden« die zeitliche und zielgerichtete Nuance von ἔμελλεν ... συλλαμβάνεσθαι πρὸς θάνατον genauer zum Ausdruck und setzt die Bericht-Fußnote an ihren sachlichen Anker. Die pluralische Form »berührten« bezeichnet weiterhin die im Kontext vorausgesetzten Männer, ohne deren Rolle über den griechischen Text hinaus zu bestimmen.
