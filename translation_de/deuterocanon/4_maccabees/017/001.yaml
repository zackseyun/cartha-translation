  naturalness: Die vorliegende Wortstellung ist verständlich, aber »als auch sie ergriffen und getötet werden sollte« wirkt im Deutschen schwerfällig. Konjunktiv I nach einem Doppelpunkt stellt den überlieferten Berichtscharakter idiomatisch und präzise heraus.
  terminology: »Leibwächter« ist für δορυφόροι im Kontext angemessen; die Fußnote bewahrt die wörtliche Bedeutung »Speerträger«. »Scheiterhaufen« ist eine passende spezifische Wiedergabe von πυρά.
