  yaml_path: translation/deuterocanon/4_maccabees/017/001.yaml
  text: Some of the king’s guards also said that when she too was about to be seized for death[b][a], she threw herself onto the pyre so that they might not touch any part of her body.
translation:
  language: de
  text: 'Einige der Leibwächter[a] berichteten außerdem[b]: Als auch sie gerade ergriffen werden sollte, um getötet zu werden, habe sie sich auf den Scheiterhaufen gestürzt, damit sie keinen Teil ihres Körpers berührten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Speerträger«; das griechische Wort kann die bewaffneten Leibwächter eines Herrschers bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Der Vers gibt dies als Bericht einiger Leibwächter wieder, nicht als uneingeschränkte Feststellung des Erzählers.
    reason: alternative_reading
lexical_decisions:
- source_word: δορυφόρων
  choice: Leibwächtern
  rationale: Das Wort bezeichnet wörtlich »Speerträger«, wird aber häufig für die bewaffnete Leibwache eines Herrschers gebraucht. »Leibwächter« gibt die Funktion im Kontext natürlich wieder, ohne den im griechischen Vers nicht ausdrücklich genannten König in den Haupttext einzufügen.
- source_word: συλλαμβάνεσθαι πρὸς θάνατον
  choice: ergriffen und getötet werden sollte
  rationale: Das Passiv bezeichnet ihr gewaltsames Ergreifen; πρὸς θάνατον nennt den Tod als beabsichtigtes Ziel. Die koordinierte deutsche Formulierung gibt diesen Zusammenhang verständlich wieder, ohne einen förmlichen Rechtsvorgang anzudeuten.
- source_word: ψαύσειέν τι τοῦ σώματος αὐτῆς
  choice: damit sie keinen Teil ihres Körpers berührten
  rationale: Die partitive Wendung τι τοῦ σώματος wird im Deutschen natürlich mit »keinen Teil ihres Körpers« wiedergegeben und bewahrt den Gedanken, jeden körperlichen Kontakt zu verhindern.
- source_word: ἑαυτὴν ἔρριψεν κατὰ τῆς πυρᾶς
  choice: sie sich auf den Scheiterhaufen stürzte
  rationale: Die reflexive, kraftvolle Handlung wird mit »sich stürzen« idiomatisch wiedergegeben. πυρά bezeichnet hier spezifisch einen Scheiterhaufen, während κατά mit Genitiv die Bewegung darauf beziehungsweise darauf hinab ausdrückt.
theological_decisions:
- issue: Erzählstatus der letzten Handlung der Mutter
  choice: Die Aussage wird ausdrücklich als Bericht einiger Leibwächter formuliert.
  alternative: Das Geschehen ohne Distanzierung als unmittelbare Feststellung des Erzählers darstellen.
  rationale: ἔλεγον ... τινές (»einige sagten/berichteten«) kennzeichnet die Schilderung als Aussage bestimmter Zeugen. Diese narrative Distanz wird bewahrt, ohne die Gewaltsamkeit oder die bewusste Selbsthandlung abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau stellt den Berichtscharakter klar heraus; »Scheiterhaufen« wahrt die konkrete Bedeutung von πυρά. Keine konfessionelle Deutung des selbstgewählten Todes wird hinzugefügt.
