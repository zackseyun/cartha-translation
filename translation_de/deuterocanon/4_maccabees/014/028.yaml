base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/028.yaml
  text: But not only that[a]; rather, because of the noble goodness of her sons and their obedience to the law[b], her motherly affection for them was even greater.
translation:
  language: de
  text: Doch nicht nur deshalb, sondern auch wegen der edlen Gesinnung[a] ihrer Söhne und ihres Gehorsams gegenüber dem Gesetz[b] war ihre mütterliche Liebe zu ihnen noch größer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »charakterliche Vorzüglichkeit«. Das griechische Wort verbindet sittliche Güte und edle Haltung.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das überlieferte jüdische Gesetz, die Tora.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  choice: Doch nicht nur das
  rationale: Die Wendung führt nachdrücklich einen weiteren Grund an. Die deutsche Fassung bewahrt den rhetorischen Übergang, ohne die griechische Partikelfolge hölzern nachzubilden.
- source_word: καλοκἀγαθίαν
  choice: edle Gesinnung
  rationale: Der Ausdruck verbindet sittliche Güte mit charakterlicher Vornehmheit. „Edle Gesinnung“ gibt beide Aspekte in natürlichem modernem Deutsch wieder.
- source_word: τῶν υἱῶν
  choice: ihrer Söhne
  rationale: Der Kontext macht den Bezug auf die Söhne der Mutter eindeutig; das Possessivpronomen ist im Deutschen natürlich. Das spezifisch männliche Substantiv bleibt erhalten.
- source_word: εὐπείθειαν
  choice: Gehorsam
  rationale: Das Wort bezeichnet bereitwilliges Folgen beziehungsweise Gehorchen. „Gehorsam“ ist hier klar und idiomatisch.
- source_word: πρὸς τὸν νόμον
  choice: gegenüber dem Gesetz
  rationale: Die Präposition bezeichnet die Ausrichtung ihres Gehorsams auf das Gesetz. Gemeint ist im Kontext das überlieferte jüdische Gesetz.
- source_word: μείζω
  choice: noch größer
  rationale: Der ausdrückliche Komparativ wird bewahrt und an den vorher beschriebenen Grad ihrer Liebe zurückgebunden.
- source_word: φιλοστοργίαν
  choice: mütterliche Liebe
  rationale: Der Begriff bezeichnet innige natürliche Zuneigung innerhalb der Familie. Da die handelnde Person die Mutter ist, bringt „mütterliche Liebe“ den kontextuellen Sinn prägnant zum Ausdruck.
- source_word: ἐν αὐτοῖς ἔσχεν
  choice: zu ihnen war
  rationale: Die griechische Konstruktion besagt idiomatisch, dass sie diese Zuneigung zu ihnen hegte; im Deutschen wird dies natürlich mit „ihre ... Liebe zu ihnen war“ formuliert.
theological_decisions:
- issue: Bezug von „dem Gesetz“
  choice: das überlieferte jüdische Gesetz beziehungsweise die Tora
  alternative: Gesetz im allgemein-moralischen Sinn
  rationale: Im Zusammenhang des 4. Makkabäerbuches wird die Standhaftigkeit der Märtyrer durch ihre Treue zum überlieferten Gesetz bestimmt. Eine allgemeine Vorstellung von Gesetzlichkeit wäre daher zu unbestimmt.
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung
  choice: Söhne
  alternative: Kinder
  rationale: Das griechische υἱῶν ist ausdrücklich männlich, und der Kontext handelt von der Mutter und ihren sieben Söhnen. Die Übersetzung bewahrt diese Spezifizierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wahrt die rhetorische Steigerung des Griechischen; „edle Gesinnung“ und „mütterliche Liebe“ sind verständlich, ohne den ethischen und emotionalen Gehalt zu verflachen.
