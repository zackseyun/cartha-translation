  yaml_path: translation/deuterocanon/4_maccabees/014/023.yaml
  text: He loved piety more[b][a], the piety that saves unto eternal life according to God.
translation:
  language: de
  text: Mehr liebte er die Frömmigkeit[a], die zu ewigem Leben rettet – Gott gemäß.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gottesfurcht« beziehungsweise »Gottergebenheit«.'
    reason: lexical_alternative
  - marker: b
    text: »Gott gemäß« kann auch »nach Gottes Willen« oder »nach Gottes Urteil« bedeuten. Die griechische Formulierung lässt zudem offen, worauf die Wendung genau zu beziehen ist.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐσέβειαν
  choice: Frömmigkeit
  rationale: Das Wort bezeichnet im hellenistisch-jüdischen Sprachgebrauch ehrfürchtige Hingabe an Gott, die sich in treuem Handeln zeigt. »Frömmigkeit« bewahrt sowohl die religiöse als auch die ethische Bedeutung; »Gottesfurcht« ist ebenfalls möglich.
- source_word: μᾶλλον
  choice: mehr
  rationale: Der Komparativ bezeichnet eine stärkere Liebe beziehungsweise einen Vorrang gegenüber dem im Zusammenhang genannten Vergleichspunkt.
- source_word: ἠγάπησεν
  choice: liebte
  rationale: Die Grundbedeutung von ἀγαπάω wird direkt wiedergegeben; der Gedanke des Vorziehens liegt bereits in μᾶλλον.
- source_word: τὴν σώζουσαν
  choice: die … rettet
  rationale: Das artikulierte Partizip beschreibt die Frömmigkeit näher. Ein Relativsatz ist im Deutschen klar und natürlich.
- source_word: εἰς αἰώνιον ζωὴν
  choice: zu ewigem Leben
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis. »Zu ewigem Leben« gibt diese Richtung knapp und idiomatisch wieder.
- source_word: κατὰ θεόν
  choice: Gott gemäß
  rationale: 'Die knappe Wendung bleibt bewusst offen: Sie kann Gottes Willen oder Maßstab bezeichnen und möglicherweise unterschiedlich an den vorausgehenden Gedanken angeschlossen werden.'
theological_decisions:
- issue: Bedeutung und syntaktischer Bezug von κατὰ θεόν
  choice: Gott gemäß
  alternative: nach Gottes Willen; nach Gottes Urteil; vor Gott
  rationale: Die wörtlich knappe Wiedergabe bewahrt sowohl die inhaltliche Offenheit als auch die mögliche Zuordnung zur rettenden Frömmigkeit oder zum ewigen Leben, ohne eine bestimmte theologische Auslegung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung von »Mehr« erhält die vergleichende Betonung. Der Gedankenstrich macht die ungewöhnlich knappe Schlusswendung lesbar, ohne ihre Mehrdeutigkeit aufzulösen.
