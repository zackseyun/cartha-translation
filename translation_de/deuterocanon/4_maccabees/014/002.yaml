  language: de
  text: Die Gedanken des Königs waren königlicher und freier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλέως
  choice: des Königs
  rationale: Der Genitiv Singular von βασιλεύς ist possessiv auf λογισμοί bezogen. Der bestimmte Ausdruck entspricht dem unmittelbaren Zusammenhang.
- source_word: λογισμοὶ
  choice: Gedanken
  rationale: λογισμοί kann Gedanken, Überlegungen oder Erwägungen bezeichnen. „Gedanken“ gibt hier die inneren Überlegungen knapp und natürlich wieder.
- source_word: βασιλικώτεροι
  choice: königlicher
  rationale: Der Komparativ von βασιλικός wird unmittelbar wiedergegeben. Zugleich bleibt die rhetorische Wortverbindung zwischen βασιλέως („König“) und βασιλικώτεροι („königlicher“) im Deutschen erhalten.
- source_word: ἐλευθερώτεροι
  choice: freier
  rationale: Der Komparativ von ἐλεύθερος bezeichnet ein höheres Maß an Freiheit beziehungsweise Unabhängigkeit. „Freier“ wahrt sowohl die Komparativform als auch die parallele Satzstruktur.
theological_decisions: []
translation_notes:
  register: Knappes, gehobenes und zugleich heutiges Standarddeutsch. Die beiden parallelen Komparative und das Wortspiel „Königs – königlicher“ werden ohne erklärende Erweiterung bewahrt.
