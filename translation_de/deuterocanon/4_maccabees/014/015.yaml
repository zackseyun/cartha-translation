  text: For even among birds[a], some, making their nests on houses, protect their young.
translation:
  language: de
  text: Denn auch unter den Vögeln beschützen die zahmen[a], die auf den Dächern von Häusern nisten, ihre Jungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die domestizierten, die an den Häusern ihre Nester bauen“.'
    reason: „Die zahmen“ gibt ἥμερα unmittelbar wieder. Die alternative Formulierung bewahrt die mögliche allgemeinere räumliche Auffassung von κατὰ τὰς οἰκίας, während der Haupttext den in ὀροφοποιοῦντα enthaltenen Dachbezug idiomatisch ausdrückt.
lexical_decisions:
- source_word: πετεινῶν
  choice: Vögeln
  rationale: Der Genitiv Plural bezeichnet hier allgemein Vögel; „Vögel“ ist im Deutschen natürlich und präzise.
- source_word: ἥμερα
  choice: die zahmen
  rationale: Das substantivierte Adjektiv bedeutet ausdrücklich „die zahmen“ und sollte nicht zu dem unbestimmten „einige“ abgeschwächt werden.
- source_word: κατὰ τὰς οἰκίας
  choice: an den Häusern
  rationale: κατά bezeichnet hier die räumliche Zuordnung zu den Häusern, ohne eindeutig festzulegen, ob auf, an oder im Dachbereich gemeint ist.
- source_word: ὀροφοποιοῦντα
  choice: ihre Nester bauen
  rationale: Das Partizip beschreibt im Zusammenhang mit Vögeln das Bauen beziehungsweise Anlegen ihrer Nester im Dachbereich; eine wörtliche Wiedergabe als „Dächer bauen“ wäre im Deutschen irreführend.
- source_word: προασπίζει
  choice: beschützen
  rationale: Das Verb bezeichnet aktiven Schutz oder Verteidigung; „beschützen“ passt idiomatisch zur Fürsorge der Vögel für ihre Jungen.
- source_word: νεοττῶν
  choice: ihre Jungen
  rationale: Das Wort bezeichnet junge Vögel beziehungsweise Nestlinge; „ihre Jungen“ ist klar, natürlich und nicht unnötig fachsprachlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die etwas ungewöhnliche Unterscheidung „die zahmen“ bleibt erhalten, weil sie im griechischen Text ausdrücklich steht; die räumliche Angabe wird bewusst nicht auf „unter den Dachvorsprüngen“ verengt.
