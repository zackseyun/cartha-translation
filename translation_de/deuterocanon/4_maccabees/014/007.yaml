base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/007.yaml
  text: O most holy seven of harmonious brothers[a], for just as in the creation of the world the days are concerned with godliness[b],
translation:
  language: de
  text: O hochheilige Schar von sieben einträchtigen Brüdern! Denn wie bei der Erschaffung der Welt die Tage mit Frömmigkeit verbunden sind,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für „Frömmigkeit“ kann auch „Gottesverehrung“ oder „Gottesfurcht“ stehen (εὐσέβεια).
    reason: lexical_alternative
  - marker: b
    text: Der Satz wird im folgenden Vers fortgesetzt; im Griechischen beginnt hier mit „denn wie“ ein noch unvollständiger Vergleich.
    reason: cross_reference
lexical_decisions:
- source_word: πανάγιε
  choice: hochheilige
  rationale: Der Vokativ wird als feierliche Anrede wiedergegeben; „hochheilig“ vermittelt die verstärkende Bedeutung idiomatisch und würdevoll.
- source_word: συμφώνων
  choice: einträchtiger
  rationale: Das Wort bezeichnet das übereinstimmende, harmonische Miteinander der Brüder; „einträchtig“ bewahrt diesen Gedanken in natürlichem Deutsch.
- source_word: ἀδελφῶν
  choice: Brüder
  rationale: Der maskuline Plural bezeichnet im Erzählzusammenhang ausdrücklich die sieben Brüder.
- source_word: ἑβδομάς
  choice: Siebenzahl
  rationale: Das Substantiv bezeichnet eine aus sieben bestehende Gruppe. „Siebenzahl“ erhält die substantivische und rhetorisch gehobene Form besser als das bloße „Sieben“.
- source_word: κοσμοποιίας
  choice: Erschaffung der Welt
  rationale: Die Wiedergabe macht die Bildung beziehungsweise Hervorbringung des Kosmos klar und verständlich.
- source_word: ἡμέραι
  choice: Tage
  rationale: Direkte und eindeutige Wiedergabe.
- source_word: περὶ τὴν εὐσέβειαν
  choice: auf die Frömmigkeit bezogen sind
  rationale: Die griechische Wendung ist stark verdichtet. Diese Formulierung wahrt ihre relationale Unbestimmtheit, ohne ein konkreteres Bild oder eine nicht ausdrücklich genannte Handlung einzutragen.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια
  choice: Frömmigkeit
  alternative: Gottesfurcht; Gottesverehrung
  rationale: „Frömmigkeit“ bezeichnet hier die zentrale religiös-ethische Haltung des Buches und umfasst sowohl Gottesverehrung als auch entsprechende Lebensführung. „Gottesfurcht“ könnte den Aspekt der Furcht zu stark hervorheben, „Gottesverehrung“ den ethischen Umfang verengen.
translation_notes:
  register: Feierlich-rhetorische, aber verständliche Standardsprache. Die ungewöhnliche Anrede „Siebenzahl“ und der im Vers unvollständige Vergleich werden bewusst bewahrt; das abschließende Komma signalisiert die Fortsetzung.
