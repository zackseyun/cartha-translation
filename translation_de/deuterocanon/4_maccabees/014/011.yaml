  terminology: „Vernunft“ bildet λογισμός als philosophischen Leitbegriff treffend ab. Die Unterscheidung zu νοῦς durch „Verstand“ ist möglich und schafft keinen künstlichen Sachgegensatz. „Qualen“, „Schmerzen“ und die ausdrücklich geschlechtsspezifische Formulierung entsprechen dem Kontext und dem griechischen Wortlaut.
