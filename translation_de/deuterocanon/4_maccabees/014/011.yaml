base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/011.yaml
  text: And do not consider it remarkable if reason gained the mastery over those men in their torments[b][a], since even a woman's mind looked down on more severe pains.
translation:
  language: de
  text: Und haltet es nicht für erstaunlich, dass die Vernunft jene Männer in ihren Qualen bezwang,[a] da sogar der Verstand einer Frau über noch vielfältigere Schmerzen erhaben war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass die Vernunft über jene Männer in ihren Folterqualen die Oberhand gewann“.'
    reason: Lexikalisch-syntaktische Alternative für περιεκράτησεν, τῶν ἀνδρῶν und βασάνοις.
  - marker: b
    text: 'Oder: „auf noch mannigfaltigere Leiden herabsah“ beziehungsweise „sich über noch verschiedenartigere Leiden erhob“.'
    reason: Die Verbindung πολυτροπωτέρων ὑπερεφρόνησεν lässt sowohl die Vielfalt der Leiden als auch verächtliches Herabsehen oder geistiges Darüberstehen anklingen.
lexical_decisions:
- source_word: θαυμαστόν / ἡγεῖσθε
  choice: haltet es für erstaunlich
  rationale: Die Verbindung bezeichnet, etwas als erstaunlich oder verwunderlich anzusehen; die deutsche Wendung ist natürlich und bewahrt den Aufforderungscharakter.
- source_word: λογισμός
  choice: die Vernunft
  rationale: Der Ausdruck ist ein Leitbegriff des Buches für die vernünftige, insbesondere fromme Urteilskraft, welche die Leidenschaften beherrscht.
- source_word: περιεκράτησεν
  choice: bezwang
  rationale: Das Verb bezeichnet entschiedenes Überwältigen oder Erlangen der Herrschaft. „Bezwang“ gibt dies knapp wieder; die alternative Konstruktion wird in der Fußnote bewahrt.
- source_word: βασάνοις
  choice: Qualen
  rationale: Im Märtyrerkontext sind zugefügte schwere Leiden gemeint. „Qualen“ bleibt anschaulich, ohne ausschließlich die Methode der Folter zu bezeichnen.
- source_word: ὅπου γε καί
  choice: da sogar
  rationale: Die Wendung führt eine verstärkende Begründung ein; „da sogar“ gibt sowohl den begründenden als auch den steigernden Sinn wieder.
- source_word: νοῦς
  choice: Verstand
  rationale: νοῦς bezeichnet hier das Denk- und Entschlussvermögen. „Verstand“ unterscheidet es sprachlich vom leitmotivischen λογισμός, ohne einen sachfremden Gegensatz einzuführen.
- source_word: πολυτροπωτέρων
  choice: noch vielfältigere
  rationale: Der Komparativ beschreibt Schmerzen von zahlreicheren beziehungsweise verschiedenartigeren Formen. Die Wiedergabe vermeidet die unbelegte Verengung auf bloß größere Schwere.
- source_word: ὑπερεφρόνησεν
  choice: war … erhaben über
  rationale: Das Verb kann ein verächtliches Herabsehen oder ein geistiges Darüberstehen ausdrücken. Die gewählte Fassung passt zum Sieg des Denkvermögens über körperliches Leiden und bewahrt die Alternative in der Fußnote.
- source_word: ἀλγηδόνων
  choice: Schmerzen
  rationale: Das Substantiv bezeichnet körperliche oder seelische Schmerzen beziehungsweise Leiden; „Schmerzen“ entspricht dem direkten Sinn.
theological_decisions:
- issue: Philosophischer Leitbegriff λογισμός im Märtyrerkontext
  choice: die Vernunft
  alternative: vernünftiges Urteil; vernünftige Überzeugung
  rationale: „Vernunft“ erhält die wiederkehrende anthropologische Aussage des Buches, ohne spätere philosophische oder konfessionelle Fachbedeutungen einzutragen.
- issue: Geschlechtsspezifischer Kontrast zwischen τῶν ἀνδρῶν ἐκείνων und γυναικός
  choice: jene Männer … der Verstand einer Frau
  alternative: jene Menschen … ihr Verstand
  rationale: Der griechische Text markiert ausdrücklich den Kontrast zwischen den Männern und einer Frau; eine Neutralisierung würde ein rhetorisches Element beseitigen.
- issue: Bezug von περιεκράτησεν mit Genitiv und Dativ
  choice: die Vernunft bezwang jene Männer in ihren Qualen
  alternative: die Vernunft gewann in den Qualen die Herrschaft über jene Männer
  rationale: Die Syntax kann so verstanden werden, dass die Vernunft über die Männer inmitten ihrer Qualen die Oberhand gewann. Die alternative, formnähere Fassung wird als echte Übersetzungsmöglichkeit vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem argumentativen Aufbau des Griechischen nahe, während „da sogar“ und „erhaben war“ einen natürlichen deutschen Lesefluss ermöglichen. Die ausdrücklich geschlechtsspezifische Rhetorik bleibt erhalten.
