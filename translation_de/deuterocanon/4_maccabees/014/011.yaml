  source_fidelity: 'Die Übersetzung gibt den griechischen Gedankengang zuverlässig wieder: die Aufforderung, dies nicht erstaunlich zu finden, die beherrschende Rolle der Vernunft in den Qualen jener Männer sowie die verstärkende Parallele mit dem Verstand einer Frau. „Vielfältigere“ wahrt bei πολυτροπωτέρων die Bedeutung verschiedener bzw. mannigfaltiger Formen von Leiden und verengt den Ausdruck nicht unbegründet auf stärkere Schmerzen.'
