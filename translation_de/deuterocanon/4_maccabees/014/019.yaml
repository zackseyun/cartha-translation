  to: Denn selbst Bienen wehren sich zur Zeit der Wachsbildung[a] gegen diejenigen, die sich nähern, und schlagen diejenigen, die ihrer Brut[b] nahe kommen, mit ihrem Stachel, als wäre er aus Eisen, und leisten bis zum Tod Widerstand.
