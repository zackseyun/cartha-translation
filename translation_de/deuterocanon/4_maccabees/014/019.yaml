  yaml_path: translation/deuterocanon/4_maccabees/014/019.yaml
  text: For even bees[a], around the time of making honeycomb, defend themselves against those who approach, and, as with iron, strike with their stinger those who come near their brood[c][b], and defend them to the death.
translation:
  language: de
  text: Denn selbst Bienen wehren sich zur Zeit der Wachsbildung[a] gegen diejenigen, die sich nähern, und schlagen diejenigen, die ihrer Brut[b] nahe kommen, mit ihrem Stachel, als wäre er aus Eisen, und leisten bis zum Tod Widerstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Zeit des Wabenbaus“. Das griechische Wort bezeichnet die Erzeugung von Wachs beziehungsweise den Bau der Waben, nicht allgemein die Honigproduktion.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier „Brut“; das Bild hebt den Schutz des Nachwuchses hervor und ist rhetorisch, nicht als zoologische Fachbeschreibung, zu verstehen.
    reason: cultural_note
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: Denn selbst
  rationale: Die Wendung führt mit Nachdruck ein veranschaulichendes Beispiel an; „Denn selbst“ gibt sowohl den argumentativen Anschluss als auch die Hervorhebung natürlich wieder.
- source_word: μέλισσαι
  choice: Bienen
  rationale: Direkte und eindeutige Bezeichnung.
- source_word: περὶ τὸν τῆς κηρογονίας καιρὸν
  choice: zur Zeit der Wachsbildung
  rationale: κηρογονία bezeichnet spezifisch die Erzeugung von Wachs beziehungsweise den Wabenbau. „Wachsbildung“ bleibt nahe am griechischen Ausdruck und ist im Deutschen verständlich.
- source_word: ἐπαμύνονται
  choice: wehren sich / leisten Widerstand
  rationale: Das Verb bezeichnet defensive Gegenwehr. Die variierte Wiedergabe entspricht an beiden Stellen dem intransitiven Gebrauch, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt einzufügen.
- source_word: τοὺς προσιόντας
  choice: alle, die sich nähern / diejenigen, die … nahe kommen
  rationale: Das Partizip bezeichnet neutral die Herankommenden; die Formulierung unterstellt nicht zusätzlich, dass sie bereits Angreifer sind.
- source_word: καθάπερ σιδήρῳ
  choice: wie mit Eisen
  rationale: Bewahrt das knappe und eindringliche Bild des griechischen Vergleichs, ohne es erklärend aufzulösen.
- source_word: τῷ κέντρῳ
  choice: mit ihrem Stachel
  rationale: κέντρον bezeichnet im Zusammenhang mit Bienen idiomatisch das Stechorgan.
- source_word: πλήσσουσι
  choice: treffen
  rationale: Gibt den körperlichen Schlag oder Stich natürlich wieder und verbindet sich im Deutschen gut mit „mit ihrem Stachel“.
- source_word: τῇ νοσσίᾳ αὐτῶν
  choice: ihrer Brut
  rationale: νοσσιά bezeichnet Brut beziehungsweise Nachwuchs. „Brut“ bewahrt das Bild der schützenswerten Nachkommenschaft, ohne zoologisch unangemessene „Nestlinge“ einzuführen.
- source_word: ἐπαμύνονται ἕως θανάτου
  choice: leisten bis zum Tod Widerstand
  rationale: Das Griechische nennt hier kein ausdrückliches Objekt. Die intransitive Wiedergabe erhält diese Offenheit und die äußerste Konsequenz der Verteidigung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde zur besseren Lesbarkeit in zwei Sätze gegliedert. Die Wiederholung des griechischen Verbs ἐπαμύνονται bleibt sinngemäß erkennbar, während die unterschiedliche deutsche Formulierung unnötige Schwerfälligkeit vermeidet. Das fehlende Objekt beim abschließenden Verb wurde nicht stillschweigend ergänzt.
