base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/027.yaml
  text: and[a], though she was compelled to feel sympathy for them because of the many pains each one of them suffered[b], because of fear toward God she overlooked the temporary preservation of her children.
translation:
  language: de
  text: Und obwohl die vielen Qualen, die jeder Einzelne von ihnen erlitt, sie zwangen, mit ihnen mitzufühlen, sah sie aus Gottesfurcht[b] über die vorübergehende Rettung[a] ihrer Kinder hinweg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das vorübergehende Überleben“ oder „die zeitweilige Bewahrung“. Gemeint ist hier die unmittelbare körperliche Rettung, nicht notwendigerweise das Heil im theologischen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: „Gottesfurcht“ kann hier auch als ehrfürchtige Scheu vor Gott verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠδῖνας
  choice: Qualen
  rationale: Das Wort bezeichnet heftige Schmerzen oder Wehen. Im Martyriumskontext gibt „Qualen“ das schwere Leiden jedes einzelnen Sohnes natürlich wieder, ohne das Bild von Geburtswehen unnötig festzulegen.
- source_word: συμπάθειαν
  choice: mit ihnen mitzufühlen
  rationale: Die Wendung bewahrt den Gedanken des inneren Mitleidens und klingt im modernen Deutschen natürlicher als das Substantiv „Sympathie“.
- source_word: ὑπερείδειν
  choice: sah … hinweg
  rationale: Die bildhafte Wendung gibt das Vorübersehen beziehungsweise Zurückstellen wieder. Sie besagt nicht, dass der Mutter ihre Kinder gleichgültig waren.
- source_word: πρόσκαιρον σωτηρίαν
  choice: die vorübergehende Rettung
  rationale: σωτηρία bezeichnet hier im unmittelbaren Folter- und Martyriumskontext die zeitweilige physische Rettung beziehungsweise das Überleben; „vorübergehend“ gibt πρόσκαιρον wieder.
- source_word: φόβον
  choice: Gottesfurcht
  rationale: „Gottesfurcht“ ist eine natürliche deutsche Wiedergabe von φόβος gegenüber Gott und bewahrt sowohl Furcht als auch ehrfürchtige Scheu.
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: jeder Einzelne von ihnen
  rationale: 'Die Formulierung erhält die distributive Betonung: Das Leiden jedes Sohnes wird einzeln in den Blick genommen.'
- source_word: ἠναγκασμένην … ἔχειν
  choice: sie zwangen, … mitzufühlen
  rationale: Die Konstruktion drückt aus, dass die vielen Qualen ihr mütterliches Mitgefühl unausweichlich machten; der deutsche Satz wahrt diese Nötigung idiomatisch.
theological_decisions:
- issue: Bedeutung von σωτηρία im Martyriumskontext
  choice: zeitweilige körperliche Rettung
  alternative: Heil im theologischen Sinn
  rationale: Der Zusammenhang handelt vom möglichen unmittelbaren Entkommen der Kinder aus Folter und Tod. „Rettung“ wahrt die Bedeutungsbreite, während die Fußnote eine ausschließlich soteriologische Lesart verhindert.
- issue: Bedeutung von φόβος gegenüber Gott
  choice: Gottesfurcht, einschließlich ehrfürchtiger Scheu
  alternative: Ehrfurcht vor Gott
  rationale: „Gottesfurcht“ bleibt eng am griechischen φόβος und bewahrt die Spannung zwischen mütterlichem Mitgefühl und ihrer Bindung an Gott.
- issue: Verhältnis von Mitgefühl und Treue zu Gott
  choice: Die zeitweilige Rettung wird trotz echten Mitgefühls zurückgestellt
  alternative: Gefühllosigkeit gegenüber den Kindern
  rationale: Der Satz betont ausdrücklich ihr erzwungenes Mitfühlen; ὑπερείδειν darf daher nicht so wiedergegeben werden, als fehle ihr die Liebe zu ihren Kindern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Gedankengang wird als klarer Konzessivsatz wiedergegeben. „Mitfühlen“, „Qualen“ und „Gottesfurcht“ sind allgemein verständlich; die Spannung zwischen mütterlichem Mitleiden und Treue zu Gott bleibt erhalten.
