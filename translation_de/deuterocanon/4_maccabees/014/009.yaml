  verdict: revise
  source_fidelity: Die dreifache Steigerung von Sehen, Hören und eigenem Erleiden sowie der bewusst unvollendete Satzanschluss sind grundsätzlich zutreffend wiedergegeben. Das griechische οὐ μόνον … ἀλλʼ οὐδὲ μόνον … ἀλλὰ καί hebt jedoch hervor, dass die jungen Männer nicht bloß Zuschauer oder bloß Hörer der Drohung waren, sondern selbst litten. Die Formulierung „sahen sie nicht nur“ lässt das unklare griechische Objekt zwar zu, wirkt im Deutschen aber referenziell weniger klar.
  naturalness: „Nun schaudern wir, wenn wir … hören“ ist modernes, würdiges Deutsch. In der zweiten Satzhälfte ist „sahen sie nicht nur und hörten nicht nur …“ stilistisch schwerfällig und die Pronomenreferenz von „sie“ nach „Bedrängnis“ unnötig undeutlich. Eine leichte Umstellung erhält die griechische Offenheit, macht die Steigerung klarer und bleibt als Satzfragment anschlussfähig.
  terminology: „Bedrängnis“, „junge Männer“ und „schaudern“ sind treffend und registergerecht. „Drohung“ ist für ἀπειλῆς λόγον idiomatisch vertretbar; die Fußnote dokumentiert die wörtlichere Form und die Unmittelbarkeit von παραχρῆμα angemessen.
