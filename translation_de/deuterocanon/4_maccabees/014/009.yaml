  yaml_path: translation/deuterocanon/4_maccabees/014/009.yaml
  text: Now we[a], hearing of the affliction of those young men, shudder; but they, not only seeing it, and not only hearing the immediate word of threat, but also suffering it,
translation:
  language: de
  text: Nun schaudern wir, wenn wir von der Bedrängnis jener jungen Männer hören; sie aber sahen dies nicht nur, hörten nicht nur die unmittelbar ausgesprochene Drohung[a], sondern erlitten es auch,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das unmittelbar ergangene Wort der Drohung«; der griechische Ausdruck betont, dass die Drohung auf der Stelle ausgesprochen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: Bedrängnis
  rationale: Das Wort bezeichnet hier die schwere Not und Qual, der die jungen Männer ausgesetzt waren. »Bedrängnis« bewahrt die Breite des griechischen Ausdrucks und vermeidet eine vorschnelle Einengung auf rein körperliche Schmerzen.
- source_word: νεανιῶν
  choice: jungen Männer
  rationale: Der maskuline, altersbezogene Ausdruck verweist auf die gefolterten Brüder. »Junge Männer« ist im heutigen Deutsch klar und natürlich.
- source_word: φρίττομεν
  choice: schaudern wir
  rationale: Das Verb bezeichnet eine körperlich spürbare Reaktion des Entsetzens. »Schaudern« gibt diese Intensität knapp und idiomatisch wieder.
- source_word: ὁρῶντες
  choice: sahen sie
  rationale: Die schlichte Wiedergabe wahrt den Gegensatz zwischen Sehen, Hören und eigenem Erleiden.
- source_word: παραχρῆμα
  choice: unmittelbar ausgesprochen
  rationale: Das Adverb hebt hervor, dass die Drohung auf der Stelle beziehungsweise in eben diesem Augenblick erging. Die adverbiale Nuance wird im Deutschen natürlich mit dem Partizip verbunden.
- source_word: ἀπειλῆς λόγον
  choice: Drohung
  rationale: Wörtlich steht »Wort der Drohung«. Im Deutschen gibt »Drohung« den gemeinten drohenden Ausspruch natürlich wieder; die wörtlichere Ausdrucksweise und der zeitliche Akzent werden in der Fußnote dokumentiert.
- source_word: πάσχοντες
  choice: erlitten sie
  rationale: 'Das Partizip bildet den Höhepunkt der Steigerung: Die jungen Männer nahmen die Bedrängnis nicht nur wahr, sondern erfuhren sie am eigenen Leib. »Erlitten« ist hier präziser als eine erneute Verwendung von »leiden«.'
