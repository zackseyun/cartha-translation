  yaml_path: translation/deuterocanon/4_maccabees/014/031.yaml
  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: de
  text: Doch die Mutter forderte sowohl jeden einzelnen Sohn[a] als auch alle gemeinsam auf, um ihrer Gottesverehrung[b] willen in den Tod zu gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen Sohn nach dem anderen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: Frömmigkeit oder Ehrfurcht vor Gott. Die griechische Verbindung bezeichnet einen Tod um der frommen Verehrung Gottes willen.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Doch
  rationale: Kennzeichnet die Fortführung mit leichtem Gegensatz beziehungsweise Nachdruck, ohne das Deutsche mit einem zusätzlichen »auch« zu überladen.
- source_word: καθʼ ἕνα παῖδα
  choice: jeden einzelnen Sohn
  rationale: καθʼ ἕνα hat distributiven Sinn (»einen nach dem anderen«, »jeden einzeln«). Im Erzählzusammenhang bezeichnet παῖς einen Sohn der Mutter.
- source_word: ὁμοῦ πάντας
  choice: alle gemeinsam
  rationale: Bewahrt den kollektiven Gegenpol zur vorherigen Aussage über jeden einzelnen Sohn.
- source_word: ἡ μήτηρ
  choice: die Mutter
  rationale: Entspricht der bestimmten Nominalgruppe im Griechischen und bleibt im Deutschen natürlich.
- source_word: ἐπὶ ... προέτρεπεν
  choice: ermutigte ... dazu, ... in den Tod zu gehen
  rationale: Gibt sowohl den auffordernden Sinn von προτρέπω als auch die durch ἐπί bezeichnete Ausrichtung auf den Tod in natürlichem modernem Deutsch wieder.
- source_word: τὸν ... θάνατον
  choice: in den Tod zu gehen
  rationale: Die verbale deutsche Wendung vermittelt die Bewegung auf den Tod hin idiomatisch und erhält die Härte der Aussage.
- source_word: τῆς εὐσεβείας
  choice: um ihrer Gottesverehrung willen
  rationale: εὐσέβεια bezeichnet hier ehrfürchtige, treue Hinwendung zu Gott. »Gottesverehrung« macht die religiöse Ausrichtung deutlicher als das mehrdeutige »Frömmigkeit«; »um ... willen« gibt die sinngemäße Beziehung des Genitivs zum Tod wieder.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Zusammenhang des Martyriums
  choice: um ihrer Gottesverehrung willen
  alternative: um ihrer Frömmigkeit willen; aus Ehrfurcht vor Gott
  rationale: Die Formulierung bewahrt die Ausrichtung auf Gott, ohne den Begriff auf bloße Moral zu verengen oder eine spätere konfessionelle Fachbedeutung einzutragen.
- issue: Beziehung des Genitivs τῆς εὐσεβείας zu θάνατον
  choice: Der Tod geschieht um der Gottesverehrung willen
  alternative: 'wörtlich: der Tod der Gottesverehrung'
  rationale: Der Genitiv ist knapp und formal mehrdeutig. Im Zusammenhang liegt ein Tod aufgrund beziehungsweise zugunsten der treuen Gottesverehrung nahe; die Fußnote macht die wörtlichere Struktur sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion mit »sowohl ... als auch« erhält den Kontrast zwischen der einzelnen und der gemeinsamen Ermutigung; »in den Tod zu gehen« vermeidet die im Deutschen harte und missverständliche Verbindung »zum Tod ermutigen«.
