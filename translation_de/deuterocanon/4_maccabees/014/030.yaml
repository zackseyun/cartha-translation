  yaml_path: translation/deuterocanon/4_maccabees/014/030.yaml
  text: But even so[a], although so many impulses of motherly love were drawing the mother toward sympathy[b], the all-varied tortures were not able by any one of them to turn aside her reason.
translation:
  language: de
  text: Doch obwohl so viele Regungen ihrer Liebe zu den Kindern[a] die Mutter zum Mitgefühl hinzogen, vermochte keine der vielfältigen Foltern, ihre Vernunft von ihrem Weg abzubringen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet die Liebe oder Zuneigung eines Elternteils zu seinen Kindern.
    reason: lexical_alternative
  - marker: b
    text: Oder „ihr vernünftiges Urteil“ beziehungsweise „ihre Entschlossenheit“. „Vernunft“ ist ein Leitbegriff des Buches für die Herrschaft vernünftigen Urteilens über Gefühle und Leidenschaften.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Doch trotz alledem
  rationale: Gibt den nachdrücklichen adversativ-konzessiven Übergang in natürlichem, würdigem Deutsch wieder.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: obwohl so viele Regungen der Liebe zu ihren Kindern
  rationale: Die substantivierte griechische Wendung bezeichnet zahlreiche auf die Mutter einwirkende Regungen oder Beweggründe, die mit ihrer Liebe zu den Kindern verbunden sind. Die Formulierung vermeidet das im Deutschen missverständliche „Kinderliebe“.
- source_word: εἰς συμπάθειαν ἑλκόντων
  choice: zum Mitgefühl hinzogen
  rationale: Bewahrt sowohl das Bild des Ziehens als auch den emotionalen Sinn von συμπάθεια als mitfühlende Anteilnahme.
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: die Foltern aller Art
  rationale: Gibt die große Vielfalt von παντοίκιλοι idiomatisch wieder; βάσανοι bezeichnet im Kontext konkrete Folterqualen.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: bei keinem von ihnen
  rationale: Die Wendung wird formal bewahrt und im unmittelbaren Erzählzusammenhang auf die Söhne bezogen, ohne die grammatische Offenheit des Pronomens zu verschweigen.
- source_word: τὸν λογισμὸν αὐτῆς
  choice: ihre Vernunft
  rationale: λογισμός ist ein Schlüsselbegriff des Buches für vernünftiges Urteilen und die Herrschaft der Vernunft über die Leidenschaften.
- source_word: ἴσχυσαν μετατρέψαι
  choice: vermochten … nicht … von ihrem Weg abzubringen
  rationale: Drückt sowohl das erfolglose Vermögen als auch das Bild einer versuchten Abwendung oder Richtungsänderung aus.
theological_decisions:
- issue: Wiedergabe von λογισμός im philosophisch-theologischen Leitmotiv des Buches
  choice: ihre Vernunft
  alternative: ihr vernünftiges Urteil; ihre Entschlossenheit
  rationale: „Vernunft“ erhält die begriffliche Verbindung zur im Buch wiederholt dargestellten Herrschaft vernünftigen Urteilens über die Leidenschaften. „Entschlossenheit“ wäre kontextuell möglich, würde den Begriff aber stärker auf Willenskraft verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, leicht rhetorischem Ton. Der Doppelpunkt bildet die nachdrückliche griechische Konzession ab; unnötige Archaismen und konfessionell geprägte Begriffe wurden vermieden.
