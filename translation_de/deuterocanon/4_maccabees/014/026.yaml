lexical_decisions:
- source_word: πασῶν δὲ τῶν μητέρων
  choice: Doch unter allen Müttern
  rationale: Der Genitiv bezeichnet die Vergleichsgruppe. δέ markiert einen leichten Übergang beziehungsweise Gegensatz; „doch“ gibt ihn knapp wieder.
- source_word: ἐγένετο
  choice: war
  rationale: In Verbindung mit dem prädikativen Komparativ bezeichnet das Verb hier den hervortretenden Zustand. Das natürliche deutsche „war“ vermeidet das missverständliche Bild, ihre Zuneigung habe erst später begonnen.
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: die Mutter der Sieben
  rationale: Die knappe griechische Formulierung wird bewahrt; „Söhne“ ist aus dem Kontext verständlich, steht aber in diesem Satzteil nicht ausdrücklich.
- source_word: φιλοτεκνοτέρα
  choice: ihren Kindern am meisten zugetan
  rationale: Der Komparativ von φιλοτέκνος erhält durch die umfassende Vergleichsgruppe „unter allen Müttern“ im Deutschen natürlich superlativischen Sinn. „Zugetan“ bezeichnet starke liebevolle Verbundenheit, ohne bloße Gefühligkeit oder eine konfessionelle Deutung einzutragen.
- source_word: ἥτις
  choice: durch … war ihr …
  rationale: Das qualitative beziehungsweise erläuternde Relativpronomen leitet die Begründung ihrer besonderen Kinderliebe ein. Im Deutschen wird der erklärende Anschluss durch das Semikolon natürlich ausgedrückt.
- source_word: ἑπτὰ κυοφορίας
  choice: durch sieben Schwangerschaften
  rationale: κυοφορία bezeichnet Schwangerschaft beziehungsweise das Austragen eines Kindes; die Wendung wahrt die körperlich-mütterliche Aussage und den wiederholten Vorgang.
- source_word: τὴν πρὸς αὐτοὺς … φιλοστοργίαν
  choice: die Zuneigung zu ihnen
  rationale: φιλοστοργία meint innige, natürliche familiäre Zuneigung. „Zuneigung“ hält die Aussage knapp und fügt „mütterlich“ nicht eigens hinzu, da der Zusammenhang dies bereits deutlich macht.
- source_word: ἐπιφυτευομένην
  choice: tief eingepflanzt worden
  rationale: Die Übersetzung bewahrt das griechische Pflanzbild und gibt den passivischen Sinn des Partizips wieder. „Tief“ verdeutlicht die feste innere Verwurzelung, ohne das Bild durch ein abstraktes Verb zu ersetzen.
