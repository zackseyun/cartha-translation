  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who, through seven pregnancies, had her affection for them deeply planted within her;
translation:
  language: de
  text: Doch unter allen Müttern war die Mutter der Sieben ihren Kindern am meisten zugetan[a], sie, die durch sieben Schwangerschaften die Zuneigung zu ihnen tief in sich eingepflanzt trug;
