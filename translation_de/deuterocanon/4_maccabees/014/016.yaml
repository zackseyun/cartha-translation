  yaml_path: translation/deuterocanon/4_maccabees/014/016.yaml
  text: But in the peaks of mountains and the clefts of ravines and the hollows of trees and their tops[a], making nests, it gives birth and keeps away the one who approaches.
translation:
  language: de
  text: Doch auf Berggipfeln, in den Felsspalten der Schluchten, in Baumhöhlen und an deren äußersten Stellen[a] baut es Nester, bringt seine Jungen zur Welt und hält jeden fern, der sich nähert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und an deren Spitzen/Enden“. Gemeint sein können die hohen oder äußersten Bereiche der genannten Orte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ κατὰ τὰς κορυφὰς ὀρέων
  choice: Doch auf Berggipfeln
  rationale: κατά mit Akkusativ bezeichnet hier den Aufenthalts- bzw. Nistbereich. „Auf Berggipfeln“ gibt die räumliche Vorstellung knapp und natürlich wieder.
- source_word: φαράγγων ἀπορρῶγας
  choice: in den Felsspalten der Schluchten
  rationale: ἀπορρώξ bezeichnet Spalten, Risse oder abgebrochene Felspartien. „Felsspalten“ bewahrt das schroffe Landschaftsbild und ist im Deutschen eindeutig.
- source_word: δένδρων ὀπὰς
  choice: in Baumhöhlen
  rationale: ὀπή bedeutet Öffnung, Loch oder Höhlung; im Zusammenhang mit dem Nestbau ist „Baumhöhlen“ die natürliche deutsche Entsprechung.
- source_word: τὰς τούτων ἄκρας
  choice: an deren äußersten Stellen
  rationale: ἄκρα kann Spitzen, Enden oder äußerste Bereiche bezeichnen. Die offene Formulierung vermeidet eine unbelegte Festlegung darauf, ob nur Baumwipfel oder die erhöhten bzw. äußeren Teile aller genannten Orte gemeint sind.
- source_word: νοσσοποιούμενα
  choice: baut es Nester
  rationale: Das Partizip bezeichnet das Anlegen bzw. Bauen eines Nestes. Eine finite deutsche Form sorgt für einen verständlichen Satz, ohne zusätzliches „brüten“ oder „sich fortpflanzen“ einzutragen.
- source_word: ἀποτίκτει
  choice: bringt seine Jungen zur Welt
  rationale: Das Verb bedeutet gebären bzw. hervorbringen. „Seine Jungen zur Welt bringen“ passt natürlich zu einem Tier und vermeidet im Deutschen eine unnötige Geschlechtsfestlegung.
- source_word: τὸν προσιόντα κωλύει
  choice: hält jeden fern, der sich nähert
  rationale: Das substantivierte singularische Partizip hat allgemeinen Sinn. „Jeden, der sich nähert“ bewahrt diesen Sinn; κωλύει bezeichnet hier das Abhalten vom Nest.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der abgelegenen Nistplätze bleibt erhalten; das grammatische „es“ nimmt das im Zusammenhang genannte Tier auf. Die sachliche Mehrdeutigkeit von τούτων und ἄκρας wird nicht stillschweigend auf Baumwipfel verengt.
