  yaml_path: translation/deuterocanon/4_maccabees/014/014.yaml
  text: For even the irrational animals have toward the offspring born from them a sympathy and affection like that of human beings[a][b].
translation:
  language: de
  text: Denn selbst die vernunftlosen Tiere empfinden für ihren Nachwuchs[a] ein ähnliches Mitgefühl und eine ähnliche Zuneigung, wie sie auch Menschen empfinden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für das, was aus ihnen geboren wird“, also für ihren eigenen Nachwuchs.'
    reason: lexical_alternative
  - marker: b
    text: Der Vergleich bezieht sich auf Mitgefühl und Zuneigung, wie Menschen sie ihrem eigenen Nachwuchs gegenüber empfinden.
    reason: ambiguity
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: Denn selbst
  rationale: Die Wendung führt hier einen begründenden und zugleich verstärkenden Gedanken ein; „Denn selbst“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: τὰ ἄλογα ζῷα
  choice: die vernunftlosen Tiere
  rationale: ἄλογα bezeichnet hier Tiere als Wesen ohne menschliches Vernunftvermögen. „Vernunftlos“ bewahrt den philosophischen Gegensatz, ohne das heute abwertend klingende „unvernünftig“ zu verwenden.
- source_word: τὴν πρὸς τὰ ἐξ αὐτῶν γεννώμενα
  choice: für die Jungen, die sie geboren haben
  rationale: Die substantivierte Formulierung meint den eigenen Nachwuchs der Tiere. „Die Jungen“ ist im Deutschen bei Tieren idiomatisch; der Relativsatz erhält die ausdrückliche Aussage des griechischen „aus ihnen geboren“.
- source_word: ὁμοίαν
  choice: ein ähnliches … und eine ähnliche
  rationale: Das Adjektiv bezieht sich auf beide Empfindungen und bezeichnet eine Ähnlichkeit mit der entsprechenden menschlichen Bindung, nicht zwingend völlige Gleichheit.
- source_word: συνπίθειαν
  choice: Mitgefühl
  rationale: Das Wort bezeichnet Mit- oder Zusammenempfinden. „Mitgefühl“ ist verständlich und wahrt neben στοργή eine eigene Bedeutungsnuance.
- source_word: στοργὴν
  choice: Zuneigung
  rationale: στοργή bezeichnet besonders natürliche, familiäre Liebe und Bindung. „Zuneigung“ ist hier würdig und idiomatisch; der Nachwuchskontext macht den familiären Sinn deutlich.
- source_word: τοῖς ἀνθρώποις
  choice: wie die Menschen
  rationale: Der Dativ schließt den Vergleich ab. „Menschen“ gibt den generischen Sinn ohne geschlechtsspezifische Verengung wieder.
theological_decisions: []
