  text: a mother[a], with two things set before her—godliness, and the temporary safety of her seven sons according to the tyrant’s promise[b];
translation:
  language: de
  text: 'eine Mutter, der zwei Dinge vorlagen: die Frömmigkeit[a] und die nur vorübergehende Rettung ihrer sieben Söhne, die der Tyrann zugesagt hatte[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gottesverehrung“, „Ehrfurcht vor Gott“ oder „Treue zu Gott“; das griechische Wort εὐσέβεια bezeichnet hier eine auf Gott gerichtete fromme Haltung.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist eine zeitlich begrenzte Rettung beziehungsweise das vorläufige Verschontwerden vom Tod, das der Tyrann zugesagt hatte, nicht notwendigerweise „Rettung“ im umfassenden theologischen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: eine Mutter
  rationale: Das artikellose Substantiv steht im fortlaufenden Satz appositionell beziehungsweise wiederaufnehmend; der unbestimmte Artikel ergibt im Deutschen eine natürliche Formulierung, ohne eine im Griechischen nicht ausdrücklich markierte Bestimmtheit einzutragen.
- source_word: δυεῖν προκειμένων
  choice: vor der zwei Dinge lagen
  rationale: Die Genitivkonstruktion bezeichnet die Umstände und bewahrt mit „vor ihr lagen“ das Bild von πρόκειμαι. „Dinge“ lässt die genaue Art der beiden einander gegenüberstehenden Größen offen.
- source_word: εὐσεβείας
  choice: die Frömmigkeit
  rationale: εὐσέβεια bezeichnet in 4 Makkabäer die auf Gott gerichtete fromme Haltung und Treue. „Frömmigkeit“ ist knapp, würdig und lexikalisch eng; eine Fußnote nennt verständliche Alternativen.
- source_word: σωτηρίας προσκαίρου
  choice: die nur vorübergehende Rettung
  rationale: σωτηρία meint hier das Verschontwerden vom unmittelbar drohenden Tod, während πρόσκαιρος dessen zeitlich begrenzten Charakter hervorhebt. „Rettung“ erhält den Bedeutungsumfang des griechischen Wortes; „nur vorübergehend“ verhindert eine unangebrachte heilsgeschichtliche Festlegung.
- source_word: τῆς ἑπτὰ υἱῶν
  choice: ihrer sieben Söhne
  rationale: Der Besitzbezug ergibt sich eindeutig aus dem Kontext. Das im Deutschen ergänzte „ihrer“ macht die Beziehung natürlich verständlich, ohne den Sinn zu erweitern.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: wie der Tyrann sie versprochen hatte
  rationale: κατά mit Akkusativ gibt hier die Übereinstimmung mit der Zusage des Tyrannen an. Die verbale deutsche Fassung vermeidet die schwerfällige Wendung „gemäß dem Versprechen“ und macht deutlich, dass die Rettung Gegenstand der Zusage war.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Martyriumskontext
  choice: Frömmigkeit
  alternative: Gottesverehrung; Ehrfurcht vor Gott; Treue zu Gott
  rationale: Der Ausdruck trägt in 4 Makkabäer theologisches Gewicht und bezeichnet eine Gott zugewandte Lebenshaltung. „Frömmigkeit“ wahrt die knappe Abstraktion des Originals; die Alternativen in der Fußnote verdeutlichen die Gottesbeziehung, ohne eine einzelne Deutung in den Haupttext einzutragen.
- issue: Wiedergabe von σωτηρία im unmittelbaren Kontext
  choice: nur vorübergehende Rettung
  alternative: zeitweilige Bewahrung; vorläufiges Verschontwerden
  rationale: Gemeint ist die vom Tyrannen zugesagte Erhaltung des irdischen Lebens. „Rettung“ bewahrt die lexikalische Breite von σωτηρία, während die ausdrückliche zeitliche Begrenzung verhindert, dass der Ausdruck notwendig als umfassendes oder ewiges Heil verstanden wird.
- issue: Verlässlichkeit der tyrannischen Zusage
  choice: wie der Tyrann sie versprochen hatte
  alternative: aufgrund des Versprechens des Tyrannen
  rationale: Die Formulierung berichtet lediglich den Inhalt beziehungsweise Maßstab seiner Zusage und bestätigt nicht, dass der Tyrann sie tatsächlich eingehalten hätte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Satzteil mit Semikolon stehen, entsprechend der griechischen Vorlage und dem fortlaufenden Zusammenhang. Die Konstruktion „vor der zwei Dinge lagen“ bewahrt den Gegensatz, ohne ihn durch stärker deutende Begriffe wie „Wahlmöglichkeiten“ ausdrücklich auf eine bewusste Entscheidungssituation festzulegen.
