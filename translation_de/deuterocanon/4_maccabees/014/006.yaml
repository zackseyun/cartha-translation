base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/006.yaml
  text: For just as hands and feet move in harmony with the directions of the soul[a], so those holy youths also, as if by the immortal soul of godliness[b], were in harmony with death for its sake.
translation:
  language: de
  text: Denn wie Hände und Füße sich im Einklang mit den Weisungen der Seele[a] bewegen, so stimmten auch jene heiligen jungen Männer – gleichsam von der unsterblichen Seele der Frömmigkeit bewegt – dem Tod um der Frömmigkeit willen zu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Anweisungen“; das griechische Wort kann lenkende Weisungen oder Anordnungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen gehören „im Einklang“ und „stimmten … zu“ zum selben Wortfeld. Dadurch wird die gemeinsame Entschlossenheit der jungen Männer mit dem harmonischen Zusammenwirken der Glieder verglichen.
    reason: wordplay
lexical_decisions:
- source_word: καθάπερ γὰρ ... οὕτως
  choice: Denn wie ... so
  rationale: Bewahrt die ausdrücklich vergleichende Satzstruktur und gibt γάρ natürlich als begründendes „Denn“ wieder.
- source_word: συμφώνως
  choice: im Einklang
  rationale: Bezeichnet ein harmonisches Zusammenwirken und bereitet zugleich das Wortspiel mit συνεφώνησαν vor.
- source_word: τοῖς τῆς ψυχῆς ἀφηγήμασιν
  choice: mit den Weisungen der Seele
  rationale: „Weisungen“ vermittelt die lenkende Führung von ἀφηγήματα, ohne den Ausdruck unnötig zu einem strengen Befehl zu verschärfen.
- source_word: οἱ ἱεροὶ μειρᾶκες ἐκεῖνοι
  choice: jene heiligen jungen Männer
  rationale: μειρᾶκες bezeichnet männliche Jugendliche beziehungsweise junge Männer; die Formulierung ist im heutigen Deutsch klarer als „Jünglinge“.
- source_word: ὡς ὑπὸ ψυχῆς ἀθανάτου τῆς εὐσεβείας
  choice: gleichsam von der unsterblichen Seele der Frömmigkeit bewegt
  rationale: „Gleichsam“ wahrt den Vergleichscharakter von ὡς. „Bewegt“ wird aus dem Bild der von der Seele bewegten Glieder ergänzt und macht die elliptische Personifikation im Deutschen verständlich.
- source_word: πρὸς τὸν ὑπὲρ αὐτῆς ... θάνατον
  choice: dem Tod um ihretwillen
  rationale: Der Tod wird um der personifizierten Frömmigkeit willen angenommen. Das feminine Pronomen hält den Rückbezug auf „Frömmigkeit“ offen sichtbar.
- source_word: συνεφώνησαν
  choice: stimmten ... zu
  rationale: Die Wendung gibt die Zustimmung zum Tod wieder und lässt durch „stimmten“ den sprachlichen Widerhall von συμφώνως („im Einklang“) erkennen.
theological_decisions:
- issue: Personifikation der εὐσέβεια als unsterbliche Seele
  choice: Die Frömmigkeit bleibt bildhaft als „unsterbliche Seele“ personifiziert.
  alternative: Den Ausdruck als Aussage über eine tatsächlich eigenständige unsterbliche Seele oder einen „Geist der Frömmigkeit“ deuten.
  rationale: ὡς kennzeichnet eine rhetorische Vergleichsvorstellung. Die Übersetzung bewahrt das starke Bild, macht daraus aber keine ausgearbeitete metaphysische Lehre.
- issue: Tod um der Frömmigkeit willen
  choice: „dem Tod um ihretwillen zustimmen“
  alternative: „sich einigen, für die Frömmigkeit zu sterben“
  rationale: Die gewählte Fassung wahrt die ungewöhnliche Ausrichtung auf den Tod sowie die Personifikation, statt die Aussage vollständig in eine gewöhnliche Zweckkonstruktion aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Junge Männer“ vermeidet das veraltete „Jünglinge“. Die Gedankenstriche verdeutlichen den eingeschobenen Vergleich, ohne die dichte Bildsprache des griechischen Satzes aufzulösen.
