  text: For the more mothers are weak in spirit and more prolific[a], the more they love their children.
translation:
  language: de
  text: Denn je schwächer die Mütter im Inneren sind und je kinderreicher sie sind, desto mehr lieben sie ihre Kinder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „desto kinderliebender sind sie“.'
    reason: Die Fußnote macht die adjektivische und etymologisch transparente Form von φιλοτεκνότεραι sichtbar, während der Haupttext natürliches Deutsch verwendet.
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: je ... desto mehr
  rationale: Die deutsche Korrelativkonstruktion gibt die abgestufte Vergleichsbeziehung idiomatisch und genau wieder.
- source_word: ἀσθενέψυχοι
  choice: schwächer ... in ihrer Seele
  rationale: Die Wiedergabe bewahrt sowohl den Vergleichsgrad als auch das Bild der ψυχή, ohne den Ausdruck einseitig als Feigheit oder psychische Erkrankung auszulegen.
- source_word: πολυγονώτεραι
  choice: kinderreicher
  rationale: Das Wort bezeichnet hier Mütter, die mehr Kinder hervorgebracht haben; „kinderreicher“ ist im Deutschen knapp, natürlich und erkennbar komparativ.
- source_word: ὑπάρχουσιν
  choice: sind
  rationale: Das Verb hat hier kopulative Funktion und wird im Deutschen am natürlichsten mit „sind“ wiedergegeben.
- source_word: αἱ μητέρες
  choice: die Mütter
  rationale: Direkte und eindeutige Wiedergabe des griechischen Substantivs mit Artikel.
- source_word: φιλοτεκνότεραι
  choice: desto mehr lieben sie ihre Kinder
  rationale: Die verbale Formulierung gibt die vergleichende Bedeutung des Adjektivs natürlich wieder und bewahrt dessen Kernaussage, die Liebe zu den eigenen Kindern.
