  text: But motherly affection for her children did not move the mother of the young men, who was of one spirit with Abraham.
translation:
  language: de
  text: Doch die mütterliche Liebe zu ihren Kindern brachte die Mutter der jungen Männer, die mit Abraham eines Sinnes war, nicht ins Wanken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die mit Abraham in ihrer Gesinnung übereinstimmte“. Das griechische Wort bezeichnet eine gemeinsame innere Haltung oder Gesinnung.'
    reason: Erläutert ὁμόψυχον präzise, ohne eine nicht wörtliche Paraphrase als solche auszugeben oder die Beziehung zu Abraham zu einer bloßen Ähnlichkeit zu reduzieren.
lexical_decisions:
- source_word: μετεκίνησεν
  choice: brachte … nicht ins Wanken
  rationale: Das Verb bezeichnet ein Wegbewegen aus einer festen Lage oder Haltung. Im Zusammenhang ist gemeint, dass ihre Standhaftigkeit durch die Gefühle für ihre Kinder nicht erschüttert wurde.
- source_word: συμπάθεια τέκνων
  choice: die mütterliche Liebe zu ihren Kindern
  rationale: συμπάθεια bezeichnet Mitgefühl, innige Anteilnahme oder Zuneigung. Im Zusammenhang von Mutter und Kindern gibt „mütterliche Liebe“ die Beziehung natürlich wieder; „zu ihren“ macht den im Griechischen impliziten Bezug verständlich.
- source_word: ὁμόψυχον
  choice: die mit Abraham eines Sinnes war
  rationale: Das Adjektiv bezeichnet Übereinstimmung in Seele, Gesinnung oder innerer Haltung. „Eines Sinnes“ bewahrt die geistige und moralische Verbundenheit, ohne sie genealogisch zu deuten.
- source_word: τῶν νεανιῶν μητέρα
  choice: die Mutter der jungen Männer
  rationale: νεανίαι bezeichnet junge Männer. Diese Wiedergabe ist im modernen Deutschen klar und dem Kontext angemessen.
theological_decisions:
- issue: Art der Verbundenheit mit Abraham
  choice: Die Mutter ist mit Abraham eines Sinnes.
  alternative: Die Mutter ist Abraham ähnlich bzw. abrahamgleich.
  rationale: ὁμόψυχον bezeichnet eine gemeinsame innere Haltung. Die Übersetzung bewahrt die Aussage geistiger und moralischer Übereinstimmung und macht daraus weder eine bloße Ähnlichkeit noch eine genealogische Angabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Brachte … nicht ins Wanken“ erhält das Bewegungsbild von μετεκίνησεν und bezeichnet zugleich verständlich die unerschütterte Haltung der Mutter.
