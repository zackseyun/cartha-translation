translation:
  language: de
  text: Seht aber, wie vielschichtig die Liebe zu den eigenen Kindern ist, die alles zu tief empfundenem Mitgefühl hinzieht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Mutterliebe“. Im unmittelbaren Zusammenhang geht es um die Mutter der sieben Brüder; der griechische Ausdruck bezeichnet jedoch allgemeiner die Liebe zu den eigenen Kindern.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: θεωρεῖτε
  choice: Seht
  rationale: Der Imperativ Plural fordert die Angesprochenen unmittelbar auf, das Beispiel aufmerksam zu betrachten.
- source_word: πολυπλόκος
  choice: vielschichtig
  rationale: Das Wort bezeichnet etwas vielfach Verflochtenes oder Komplexes; „vielschichtig“ bewahrt dieses Bild in natürlichem Deutsch.
- source_word: φιλοτεκνίας
  choice: Liebe zu den eigenen Kindern
  rationale: Die Wendung gibt die Zuneigung zu den eigenen Kindern wieder, ohne sie wegen des unmittelbaren Kontexts unnötig auf Mutterliebe einzuengen.
- source_word: στοργή
  choice: Liebe
  rationale: Gemeint ist natürliche familiäre Zuneigung; zusammen mit „zu den eigenen Kindern“ ist „Liebe“ klar und idiomatisch.
- source_word: ἕλκουσα
  choice: zieht … hin
  rationale: Die bildhafte Kraft der elterlichen Liebe bleibt erhalten, ohne den gewaltsameren Klang von „zerren“ einzutragen.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural hat umfassenden Sinn und wird entsprechend breit wiedergegeben.
- source_word: σπλάγχνων
  choice: aus tiefstem Innern
  rationale: Wörtlich sind die inneren Organe beziehungsweise Eingeweide gemeint, idiomatisch jedoch der Sitz tief empfundener Regungen. Die Formulierung bewahrt das Körperbild abgeschwächt und verständlich.
- source_word: συμπάθειαν
  choice: Mitgefühl
  rationale: Das Wort bezeichnet Mit- oder Mitempfinden; „Mitgefühl“ ist im modernen Deutschen die natürliche Entsprechung.
theological_decisions:
- issue: Bedeutungsumfang von φιλοτεκνία im Kontext der Mutter der sieben Brüder
  choice: Liebe zu den eigenen Kindern
  alternative: Mutterliebe
  rationale: Obwohl im unmittelbaren Zusammenhang eine Mutter im Mittelpunkt steht, ist der griechische Ausdruck nicht auf Mütter beschränkt. Die Übersetzung bewahrt daher seine allgemeinere Bedeutung.
- issue: Bildsprache von σπλάγχνων
  choice: aus tiefstem Innern
  alternative: der Eingeweide
  rationale: Die anatomische Metapher bezeichnet den Sitz tiefer Gefühle. Eine rein wörtliche Wiedergabe wäre im heutigen Deutsch missverständlich oder grotesk; die gewählte Form lässt die Tiefendimension erkennen, ohne das Bild theologisch umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz behält den auffordernden Ton und die bildhafte Bewegung des Griechischen bei. Der Doppelbegriff φιλοτεκνίας στοργή wird nicht hölzern verdoppelt, sondern idiomatisch als „Liebe zu den eigenen Kindern“ wiedergegeben.
