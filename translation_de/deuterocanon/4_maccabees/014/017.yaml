  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: das Nichtverhindern, das Umherfliegen von allen Seiten, der Schmerz der Zuneigung, das Rufen und die Hilfe für die Jungen. Die Fußnote geht jedoch über den griechischen Wortlaut hinaus, indem sie ausdrücklich von einem „Muttertier“ spricht; das grammatisch neutrale Bild benennt keine Mutter. „Wie immer sie könnten“ ist zudem weniger präzise als die Aussage, auf jede mögliche Weise zu helfen.'
  naturalness: Der Satz ist verständlich und hat einen angemessenen würdigen Ton. „Aus Zuneigung Schmerz empfinden“ wirkt jedoch etwas abstrakt und kausal; „schmerzerfüllt von ihrer Zuneigung“ bildet die Verbindung von Schmerz und natürlicher Zuneigung idiomatischer ab. „Auf jede ihnen mögliche Weise“ ist modernes, klares Standarddeutsch.
  terminology: „Junge“ passt zum durch das Umherfliegen gezeichneten Tierbild. Die Fußnote sollte neutral von einem Elterntier sprechen und keine mütterliche Spezifizierung als expliziten Wortlaut ausgeben.
