base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/017.yaml
  text: But even if they could not prevent it[a], flying around them on every side, grieving in their affection, and calling to them in their own voice, they would help their children in whatever way they could.
translation:
  language: de
  text: Doch selbst wenn sie es nicht verhindern könnten, würden sie von allen Seiten um ihre Jungen herumfliegen, schmerzerfüllt von ihrer Zuneigung und sie mit ihrer eigenen Stimme rufend, ihren Jungen auf jede ihnen mögliche Weise helfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bezeichnet ein Umherfliegen; die Bildsprache ist die eines fliegenden Elterntiers, das seine Jungen umkreist und sie ruft.
    reason: cultural_note
lexical_decisions:
- source_word: κωλύειν
  choice: es verhindern
  rationale: Das Verb bezeichnet hier das Verhindern oder Abwenden der drohenden Gefahr. Das Pronomen „es“ wahrt wie der griechische Text den Bezug auf den Zusammenhang, ohne die Gefahr näher zu bestimmen.
- source_word: περιιπτάμενα κυκλόθεν αὐτῶν
  choice: von allen Seiten um ihre Jungen herumfliegen
  rationale: Die Wiedergabe bewahrt sowohl das ausdrückliche Bild des Fliegens als auch die durch κυκλόθεν bezeichnete Bewegung von allen Seiten.
- source_word: ἀλγοῦντα τῇ στοργῇ
  choice: aus Zuneigung Schmerz empfinden
  rationale: ἀλγεῖν bezeichnet schmerzhaftes Leiden, στοργή die natürliche familiäre beziehungsweise elterliche Zuneigung. Die Formulierung bleibt nah am Wortlaut, ohne „mütterlich“ in das Substantiv hineinzulesen.
- source_word: ἀνακαλούμενα τῇ ἰδίᾳ φωνῇ
  choice: ihnen mit ihrer eigenen Stimme zurufen
  rationale: Die Formulierung erhält das lautliche Rufen der Elterntiere zu ihren Jungen und vermeidet die stärkere, hier nicht zwingende Deutung „zurückrufen“.
- source_word: καθʼ ὃν δύναται τρόπον
  choice: wie immer sie könnten
  rationale: Die idiomatische Wendung bezeichnet Hilfe auf jede jeweils mögliche Weise und bringt zugleich die begrenzten Möglichkeiten der Tiere zum Ausdruck.
- source_word: βοηθεῖ τοῖς τέκνοις
  choice: ihren Jungen helfen
  rationale: βοηθεῖν bedeutet helfen oder zu Hilfe kommen. Im Tier- und Vogelbild ist „Junge“ für τέκνα natürlich und anschaulich.
theological_decisions:
- issue: Das Bild fürsorglicher Elterntiere, besonders von Vögeln
  choice: Das Fliegen und Rufen ausdrücklich als konkretes Tierbild wiedergeben.
  alternative: Das Bild verallgemeinernd mit „sie umgeben“ oder „sie beschützen“ wiedergeben.
  rationale: περιιπτάμενα bezeichnet ausdrücklich ein Umherfliegen. Die konkrete Bildsprache trägt die Aussage über die schmerzhafte elterliche Zuneigung und sollte nicht zu einer abstrakten Fürsorgeaussage eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wird durch ein Semikolon gegliedert; die wiederholte Konditionalform hält den Gedankengang klar. „Junge“ bewahrt den tierischen Kontext, während „Zuneigung“ die natürliche elterliche Bindung ausdrückt, ohne sie lexikalisch unnötig auf Mütter einzuengen.
