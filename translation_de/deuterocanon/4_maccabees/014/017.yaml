    rationale: Der griechische Text enthält keine ausdrückliche Bezeichnung als Mutter; die Partizipien sind Neutrum Plural. Eine mütterliche Einordnung kann sich allenfalls aus dem weiteren Kontext ergeben und darf nicht als explizite Aussage dieses Verses dargestellt werden.
  - severity: low
    issue: „wie immer sie könnten“ ist eine ungenaue und stilistisch schwächere Wiedergabe von καθʼ ὃν δύναται τρόπον.
    rationale: Die griechische Wendung meint Hilfe auf jede mögliche Weise. „auf jede ihnen mögliche Weise“ gibt dies präzise und natürlich wieder.
  - severity: low
    issue: „aus Zuneigung Schmerz empfinden“ klingt im Deutschen abstrakt.
    rationale: Die Formulierung kann ein bloßes Schmerzempfinden aus einer Ursache nahelegen. Die griechische Verbindung verbindet Schmerz eng mit der natürlichen Zuneigung; „schmerzerfüllt von ihrer Zuneigung“ bewahrt dies idiomatischer.
