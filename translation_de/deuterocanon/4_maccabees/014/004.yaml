  text: None of the seven young men became cowardly[a], nor did they shrink back from death;
translation:
  language: de
  text: Keiner von den sieben jungen Männern wurde feige, und keiner schreckte vor dem Tod zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς
  choice: Keiner
  rationale: 'Das negative Indefinitpronomen ist distributiv: Nicht ein Einziger aus der Gruppe zeigte die beschriebene Reaktion.'
- source_word: ἐκ τῶν ἑπτὰ μειρακίων
  choice: von den sieben jungen Männern
  rationale: μειράκιον bezeichnet einen männlichen Jugendlichen oder jungen Mann. »Junge Männer« ist im heutigen Deutsch natürlich und vermeidet den kindlichen Beiklang von »Jungen«.
- source_word: ἐδειλίασεν
  choice: verlor den Mut
  rationale: δειλιάω kann feige werden, den Mut verlieren oder sich furchtsam zeigen bedeuten. »Verlor den Mut« gibt die Verzagtheit natürlich wieder, ohne das wertende Element ganz aufzugeben.
- source_word: οὐδὲ
  choice: und keiner
  rationale: Die erneute distributive Negation macht im Deutschen klar, dass auch der zweite Satzteil von jedem Einzelnen der sieben gilt.
- source_word: πρὸς τὸν θάνατον
  choice: vor dem Tod
  rationale: In Verbindung mit ὀκνέω bezeichnet die Präpositionalphrase das Zurückschrecken angesichts des Todes; »vor dem Tod zurückschrecken« ist die idiomatische deutsche Fügung.
- source_word: ὤκνησεν
  choice: schreckte … zurück
  rationale: ὀκνέω kann zögern, zurückscheuen oder zurückschrecken bedeuten. Hier passt im Martyriumskontext »zurückschrecken« am besten.
theological_decisions:
- issue: Distributiver Singular nach der Gruppenangabe
  choice: Beide Teilsätze werden im Singular mit wiederholtem »keiner« formuliert.
  alternative: »Keiner von den sieben jungen Männern verlor den Mut, und sie schreckten nicht vor dem Tod zurück.«
  rationale: Im Griechischen stehen beide Verben im Singular und beziehen sich auf οὐδεὶς. Die Wiederholung von »keiner« bewahrt den distributiven Sinn und klingt im Deutschen klarer als ein Wechsel zum pluralischen Pronomen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist knapp und rhythmisch; sie bewahrt die nachdrückliche Aussage, dass nicht ein Einziger der sieben versagte.
