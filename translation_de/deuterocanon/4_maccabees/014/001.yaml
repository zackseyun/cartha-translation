base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/001.yaml
  text: Moreover[a], by urging them on to torture, they sought that they should not only despise the pains, but also master the emotions of brotherly affection for their brothers.
translation:
  language: de
  text: 'Mehr noch: Indem sie sie in die Folter drängten, wollten sie erreichen, dass diese nicht nur die Schmerzen verachteten, sondern auch die Regungen[a] ihrer Liebe zu den Brüdern beherrschten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Leidenschaften«. Das griechische Wort kann starke Gefühle, innere Regungen oder Leidenschaften bezeichnen.'
    reason: Bewahrt die Bedeutungsbreite von πάθη und seinen möglichen philosophischen Fachsinn.
lexical_decisions:
- source_word: προσέτι καί
  choice: Mehr noch
  rationale: Kennzeichnet einen weiteren, gesteigerten Punkt in der Argumentation und gibt die rhetorische Fortführung knapp und natürlich wieder.
- source_word: ἐπὶ τὸν αἰκισμόν
  choice: zur Folter
  rationale: αἰκισμός bezeichnet grausame Misshandlung; im Martyriumskontext bringt „Folter“ deren körperliche Härte angemessen zum Ausdruck.
- source_word: ἐποτρύνοντες
  choice: indem sie sie … antrieben
  rationale: Das Partizip bezeichnet aktives Antreiben oder Anspornen und wird hier mit seiner begleitend-instrumentalen Funktion wiedergegeben.
- source_word: ὡς μὴ μόνον … ἀλλὰ καί
  choice: wollten sie erreichen, dass … nicht nur …, sondern auch
  rationale: ὡς mit den Infinitiven bezeichnet hier Ziel oder beabsichtigtes Ergebnis; die deutsche Fassung macht diesen Zusammenhang verständlich, ohne ihn als tatsächlich eingetretenes Ergebnis festzulegen.
- source_word: τῶν ἀλγηδόνων
  choice: die Schmerzen
  rationale: Das Wort bezeichnet die bei der Folter erlittenen Schmerzen; die direkte Wiedergabe vermeidet sowohl Abschwächung als auch unnötige Steigerung.
- source_word: περιφρονῆσαι
  choice: verachteten
  rationale: Das Verb bedeutet, etwas geringschätzig zu behandeln beziehungsweise sich darüber hinwegzusetzen; „verachten“ bewahrt die starke Wertung.
- source_word: τῆς τῶν ἀδελφῶν φιλαδελφίας
  choice: ihrer Liebe zu den Brüdern
  rationale: Die Formulierung wahrt den ausdrücklichen familiären Bezug von φιλαδελφία und τῶν ἀδελφῶν, ohne im Deutschen eine schwerfällige Wiederholung von „Bruder“ zu erzeugen.
- source_word: παθῶν
  choice: die Regungen
  rationale: πάθη bezeichnet im philosophisch-moralischen Sprachgebrauch des Werkes starke innere Empfindungen oder Leidenschaften. „Regungen“ ist verständlich und lässt deren emotionale Intensität offen.
- source_word: κρατῆσαι
  choice: beherrschten
  rationale: κρατεῖν mit dem Genitiv bedeutet, Gewalt oder Herrschaft über etwas zu gewinnen; „beherrschen“ entspricht dem Leitmotiv der Herrschaft über die πάθη.
theological_decisions:
- issue: Wiedergabe von πάθη im philosophisch-moralischen Rahmen des 4. Makkabäerbuches
  choice: Regungen
  alternative: Leidenschaften; Gefühle
  rationale: „Regungen“ bezeichnet die starken inneren Bewegungen, die beherrscht werden sollen, ohne sie grundsätzlich moralisch abzuwerten. Die Fußnote bewahrt die mögliche technisch-philosophische Wiedergabe „Leidenschaften“.
- issue: Bezug der Bruderliebe
  choice: Liebe zu den Brüdern
  alternative: brüderliche Liebe der Brüder; Bruderliebe
  rationale: 'Der Genitiv τῶν ἀδελφῶν wird als Bezug auf die Brüder verstanden. Dadurch bleibt die familiäre Spannung erhalten: Selbst die Liebe zu den leidenden Brüdern muss unter der Folter beherrscht werden.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt der griechischen Zielaussage nahe, wird aber durch „wollten sie erreichen“ idiomatisch verdeutlicht. „Liebe zu den Brüdern“ vermeidet eine unnatürliche deutsche Doppelung und hält den familiären Bezug ausdrücklich fest.
