translation:
  language: de
  text: die heiligen und harmonischen Übereinstimmungen der sieben Brüder über die Frömmigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch kollektiv-singularisch: „die heilige und harmonische Einmütigkeit der sieben Brüder über die Frömmigkeit“. Im Griechischen stehen Adjektiv und Substantiv im Akkusativ Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὰς
  choice: heiligen
  rationale: Das Adjektiv bezeichnet hier etwas, das auf Gott bezogen und daher heilig ist; „heilig“ bewahrt den gehobenen religiösen Ton.
- source_word: ἐναρμόστους
  choice: harmonischen
  rationale: Das Wort bezeichnet, was gut zusammengefügt oder aufeinander abgestimmt ist. „Harmonisch“ erhält sowohl das Bild des Zusammenklangs als auch den Gedanken innerer Übereinstimmung.
- source_word: περὶ τῆς εὐσεβείας
  choice: in der Gottesfurcht
  rationale: εὐσέβεια bezeichnet im 4. Makkabäerbuch die ehrfürchtige, treue Hinwendung zu Gott, die sich auch im Gehorsam gegenüber seinem Gesetz zeigt. „Gottesfurcht“ gibt diesen religiösen und ethischen Gehalt prägnant wieder; περί bezeichnet hier den Bereich, in dem die Brüder übereinstimmen.
- source_word: τῶν ἑπτὰ ἀδελφῶν
  choice: der sieben Brüder
  rationale: Gemeint sind die sieben männlichen Geschwister der Erzählung; die natürliche und genaue deutsche Wiedergabe lautet „Brüder“.
- source_word: συμφωνίας
  choice: Übereinstimmungen
  rationale: Die überlieferte Form ist Akkusativ Plural und bezeichnet Übereinstimmung beziehungsweise Einklang. Der Plural wird gegen die singularische englische Konsultationsfassung im Haupttext bewahrt.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Zusammenhang des Martyriums
  choice: Gottesfurcht
  alternative: Frömmigkeit; Gottesverehrung
  rationale: „Gottesfurcht“ umfasst ehrfürchtige Bindung an Gott und einen daraus erwachsenden gesetzestreuen Lebenswandel, ohne εὐσέβεια auf bloße Gefühlsfrömmigkeit oder kultische Verehrung zu verengen.
- issue: Numerus von συμφωνίας
  choice: 'Plural: „Übereinstimmungen“'
  alternative: 'Singularisch-kollektiv: „Einmütigkeit“ oder „Einklang“'
  rationale: Die griechische Form ist trotz der stilistischen Schwierigkeit als Akkusativ Plural durch die ebenfalls pluralischen Adjektive eindeutig. Deshalb wird der Numerus nicht stillschweigend an die englische Fassung angeglichen.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Die etwas ungewöhnliche Pluralform „Übereinstimmungen“ spiegelt bewusst den griechischen Wortlaut; die Fußnote bietet eine flüssigere kollektiv-singularische Alternative.
