  source_fidelity: Der Akkusativ Plural συμφωνίας wird zu Recht als Plural erkannt und sollte nicht ohne Kennzeichnung singularisch wiedergegeben werden. περί τῆς εὐσεβείας bezeichnet jedoch den Gegenstand der συμφωνίαι; „in der Gottesfurcht“ verschiebt dies zu einem Bereich bzw. einer Weise der Übereinstimmung. „über die Frömmigkeit“ bildet die Konstruktion genauer ab. εὐσέβεια ist hier am neutralsten mit „Frömmigkeit“ wiedergegeben; „Gottesfurcht“ kann im heutigen Deutsch unnötig die Komponente Furcht hervorrufen.
  naturalness: „Übereinstimmungen“ ist im Deutschen in dieser Verbindung etwas schwerfällig, bewahrt aber als bewusste Pluralwiedergabe den Quelltext und ist in einem gehobenen Kontext verständlich. Die Stellung „der sieben Brüder über die Frömmigkeit“ ist natürlich genug. Die Fußnote darf eine idiomatischere kollektiv-singularische Möglichkeit nennen, muss diese aber als Alternative kenntlich machen.
  terminology: „Heiligen“ und „harmonischen“ geben ἱεράς bzw. ἐναρμόστους angemessen wieder. „Frömmigkeit“ ist für εὐσέβεια eine etablierte, nicht konfessionell verengende deutsche Entsprechung. Die englische Audit-Fassung „godliness“ bestätigt den religiös-ethischen Charakter, erfordert aber keine wörtliche Übernahme von „Gottesfurcht“.
