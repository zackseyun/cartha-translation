    rationale: περί bezeichnet hier den Gegenstand („über/bezüglich“) der Übereinstimmungen, nicht primär den Bereich, in dem sie stattfinden.
  - severity: low
    issue: „Gottesfurcht“ ist für εὐσέβεια weniger neutral als „Frömmigkeit“.
    rationale: Die Wiedergabe ist nicht unmöglich, kann im modernen Deutsch aber stärker die Vorstellung von Furcht als die gemeinte fromme bzw. ehrfürchtige Gotteshingabe hervorrufen.
