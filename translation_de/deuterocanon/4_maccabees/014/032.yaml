revisions:
- from: O heilige Natur, o innige Liebe der Eltern und kindliche Zuneigung zu den Eltern, o Dank für ihre Fürsorge bei der Erziehung[a], o unbezwingliche Gefühle der Mütter[b]!
  to: O heilige Natur, o Elternliebe und kindliche Liebe zu den Eltern, o Fürsorge bei der Aufzucht[a], o unbezwingliche Gefühle der Mütter[b]!
  rationale: Die Revision entfernt die nicht hinreichend abgesicherte Einengung von τροφεῖα auf geschuldeten oder erwiesenen Dank und ersetzt sie durch eine unmittelbare, kontextuell sichere Wiedergabe. Die Fußnote dokumentiert die Bedeutungsbreite. Die übrige rhetorische Struktur und die bewusst offene Wiedergabe von πάθη bleiben erhalten.
