base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/032.yaml
  text: O sacred nature[a], and parents’ affections, and filial love toward parents, and nurture[b], and mothers’ unconquerable passions.
translation:
  language: de
  text: O heilige Natur, o Elternliebe und kindliche Liebe zu den Eltern, o Fürsorge bei der Aufzucht[a], o unbezwingliche Gefühle der Mütter[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Aufzucht«, »Erziehung« oder »Nahrung«. Das griechische Wort bezeichnet das Ernähren und Aufziehen beziehungsweise die damit verbundene Fürsorge.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unbezwingliche Leidenschaften der Mütter«; möglicherweise auch: »unbezwingliche Leiden der Mütter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  choice: heilige Natur
  rationale: Die direkte Anrufung und der weite Sinn von φύσις bleiben erhalten; im Zusammenhang bezeichnet »Natur« besonders die natürliche Ordnung und Kraft familiärer Bindungen, ohne sie auf einen einzelnen »Naturtrieb« einzuengen.
- source_word: φίλτρα γονέων
  choice: innige Liebe der Eltern
  rationale: φίλτρα kann wörtlich Liebeszauber oder Liebesmittel bezeichnen, meint hier aber die starken liebevollen Bindungen im Eltern-Kind-Verhältnis. Der Genitiv kann sowohl von den Eltern ausgehende als auch auf sie gerichtete Liebe nahelegen; die unmittelbare Fortsetzung hebt eigens die Zuneigung zu den Eltern hervor.
- source_word: γονεύσιν φιλοστόργε
  choice: kindliche Zuneigung zu den Eltern
  rationale: φιλοστόργος bezeichnet natürliche, besonders familiäre Zuneigung; der Dativ γονεύσιν gibt ihre Ausrichtung auf die Eltern an. Die substantivische Wiedergabe fügt sich natürlich in die deutsche Anrufungsreihe ein.
- source_word: τροφεῖα
  choice: Dank für ihre Fürsorge bei der Erziehung
  rationale: Das neutrale Pluralwort kann nicht nur Aufzucht oder Unterhalt, sondern besonders die dafür erwiesene Vergeltung beziehungsweise den geschuldeten Dank bezeichnen. Im Kontext der Liebe von Kindern zu ihren Eltern wird dieser relationale Sinn im Haupttext wiedergegeben, während die kürzere Alternative in der Fußnote erhalten bleibt.
- source_word: μητέρων ἀδάμαστα πάθη
  choice: unbezwingliche Gefühle der Mütter
  rationale: πάθη bezeichnet hier am ehesten die überwältigenden Regungen mütterlicher Liebe; ἀδάμαστα hebt hervor, dass sie sich nicht bezwingen oder bändigen lassen. »Gefühle« vermeidet die im heutigen Deutschen oft negative oder erotische Engführung von »Leidenschaften«.
theological_decisions:
- issue: Die emotional aufgeladene Sprache über natürliche Familienbindungen ohne spätere dogmatische Zusätze wiedergeben
  choice: Den Satz als rhetorische Anrufung der heiligen Kraft natürlicher Familienliebe und mütterlicher Gefühle übersetzen
  alternative: πάθη als »Leiden« und φύσις als eine näher bestimmte theologische Naturordnung deuten
  rationale: Der griechische Wortlaut preist beziehungsweise beklagt die überwältigende Macht familiärer Bindungen, formuliert aber keine ausgearbeitete Lehre von Natur oder Leiden. Die Übersetzung hält die emotionale und begriffliche Spannung offen.
translation_notes:
  register: Gehobene, aber gegenwärtige Standardsprache. Das wiederholte »o« bildet die pathetische griechische Anrufungsreihe im Deutschen klar nach. »Innige Liebe«, »Zuneigung« und »Gefühle« bleiben für heutige Leser verständlich, ohne die starke antike Familienrhetorik abzuschwächen.
