  source_fidelity: Die rhetorische Frage ist zutreffend wiedergegeben. Im zweiten Satz macht die Vergangenheitsform „war“ mit dem Semikolon die Beschreibung der Feuerkraft jedoch zu einem selbständigen Satz und lockert die griechische Konstruktion, in der ὀξεῖα und σύντομος die handelnde δύναμις näher bestimmen. „Löste die Körper ... auf“ ist zwar lexikalisch möglich, klingt im Deutschen bei durch Feuer verursachter Zerstörung jedoch unnötig technisch und kann eine chemische Auflösung nahelegen.
  naturalness: „Die Kraft des Feuers war heftig und von kurzer Dauer; sie ...“ ist verständlich, aber stilistisch weniger geschlossen als die griechische Kausalkonstruktion. Eine attributive Fassung ist natürliches modernes Standarddeutsch. „Heftig“ ist für ὀξεῖα als Wirkungskraft vertretbar; „kurz andauernd“ gibt σύντομος ohne eine nicht im Text liegende Präzisierung wieder.
  terminology: „Kraft des Feuers“ ist angemessen. „Zerstörte“ ist für διέλυσε in diesem Kontext idiomatisch und wahrt die lexikalische Bandbreite besser als das spezifischere „verzehrte“. Die Fußnote kann „auflöste“ als mögliche, stärker wörtliche Alternative nennen.
