  text: What could be more painful than these things? For the power of fire[a], being sharp and brief, quickly destroyed the bodies.
translation:
  language: de
  text: Was könnte schmerzlicher sein als dies? Denn die heftige und kurz andauernde Kraft des Feuers zerstörte die Körper rasch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „löste die Körper rasch auf“. Das griechische Verb kann „auflösen“, „auseinanderbrechen“ oder „zerstören“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν τί γένοιτο ἐπαλγέστερον;
  choice: Was könnte schmerzlicher sein als dies?
  rationale: Die rhetorische Frage und der Vergleich werden unmittelbar wiedergegeben. „Schmerzlicher“ umfasst körperlichen Schmerz und leidvolle Bedrängnis, ohne den Bezug näher festzulegen.
- source_word: ὀξεῖα
  choice: heftig
  rationale: Wörtliches „scharf“ wäre bei der Kraft des Feuers im heutigen Deutsch unnatürlich. „Heftig“ bewahrt den Gedanken einer scharf einwirkenden, intensiven Gewalt.
- source_word: σύντομος
  choice: von kurzer Dauer
  rationale: Die Grundbedeutung „kurz, knapp“ wird auf die Dauer der Feuerwirkung bezogen. Dadurch bleibt die Aussage von dem folgenden ταχέως („rasch“) unterschieden.
- source_word: ἡ τοῦ πυρὸς οὖσα δύναμις
  choice: die Kraft des Feuers
  rationale: Die Formulierung bleibt eng am Griechischen und bezeichnet das Feuer als wirksame zerstörerische Kraft.
- source_word: ταχέως διέλυσε τὰ σώματα
  choice: sie löste die Körper rasch auf
  rationale: „Auflösen“ bildet die Grundvorstellung von διαλύω – auseinanderlösen, zersetzen oder zerstören – anschaulich ab; „rasch“ gibt ταχέως ausdrücklich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bildhafte Ausdruck für die Wirkung des Feuers bleibt erhalten; zugleich wird die im Griechischen bestehende Unterscheidung zwischen kurzer Dauer (σύντομος) und raschem Ergebnis (ταχέως) nicht eingeebnet.
