    rationale: διέλυσε kann „auflösen“ bedeuten, bezeichnet bei σώματα hier aber allgemein das Auseinanderbrechen bzw. Zerstören. „zerstörte“ ist im Deutschen klarer, ohne „verzehren“ interpretativ vorzuziehen.
