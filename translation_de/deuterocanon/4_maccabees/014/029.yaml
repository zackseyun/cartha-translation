base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/029.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving toward their brothers, and so devoted to their mother that, even to the point of death, they obeyed her by keeping the law.
translation:
  language: de
  text: Denn sie waren gerecht und selbstbeherrscht, mutig und edelmütig, ihren Brüdern liebevoll verbunden und ihrer Mutter so zugetan, dass sie ihr sogar bis in den Tod gehorchten, indem sie die gesetzlichen Vorschriften[a] einhielten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die überlieferten Satzungen“; der griechische Ausdruck steht im Plural und meint die verbindlichen Vorschriften, an denen sie festhielten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοί
  choice: gerecht
  rationale: Das Wort bezeichnet in dieser Tugendreihe moralische Rechtschaffenheit; „gerecht“ bewahrt zugleich seine ethische und religiöse Färbung.
- source_word: σώφρονες
  choice: selbstbeherrscht
  rationale: In der Tugendreihe geht es um besonnene Selbstdisziplin und die Beherrschung der eigenen Regungen; „selbstbeherrscht“ ist dafür klar und gegenwärtig.
- source_word: ἀνδρεῖοι
  choice: mutig
  rationale: Gemeint ist Tapferkeit. „Mutig“ gibt den Sinn natürlich wieder, ohne die im Deutschen irreführende geschlechtliche Nebenbedeutung von „mannhaft“ aufzudrängen.
- source_word: μεγαλόψυχοι
  choice: edelmütig
  rationale: Das zusammengesetzte Wort bezeichnet wörtlich eine Größe der Seele; „edelmütig“ wahrt den gehobenen moralischen Sinn in verständlichem Deutsch.
- source_word: φιλάδελφοι
  choice: voller Liebe zu ihren Brüdern
  rationale: Der Ausdruck bezeichnet die Liebe zu Brüdern. Da der Erzählzusammenhang von männlichen Geschwistern handelt, bleibt der konkrete Bezug erhalten.
- source_word: φιλόμητρος
  choice: ihrer Mutter ergeben
  rationale: Das Adjektiv bezeichnet Liebe und treue Verbundenheit zur Mutter; „ergeben“ passt besonders zur folgenden Aussage über ihren Gehorsam.
- source_word: οὕτως, ὥστε
  choice: so … dass
  rationale: Die Korrelativkonstruktion drückt Grad und Folge aus und wird im Deutschen natürlich mit „so … dass“ wiedergegeben.
- source_word: μέχρι θανάτου
  choice: bis in den Tod
  rationale: Die Wendung bezeichnet die äußerste Konsequenz ihres Verhaltens; „bis in den Tod“ bringt diese Steigerung knapp und würdig zum Ausdruck.
- source_word: τὰ νόμιμα
  choice: die gesetzlichen Vorschriften
  rationale: Der substantivierte Plural verweist auf die verbindlichen jüdischen Satzungen beziehungsweise überlieferten Rechtsordnungen. Der deutsche Plural bildet die griechische Form ab, ohne den Ausdruck vorschnell mit einem einzelnen Gesetz gleichzusetzen.
- source_word: φυλάσσοντας
  choice: indem sie … einhielten
  rationale: φυλάσσω bedeutet in rechtlich-religiösem Zusammenhang „einhalten“ oder „beachten“. Die Partizipialform wird als begleitende beziehungsweise modale Handlung wiedergegeben.
- source_word: πείθεσθαι αὐτῇ
  choice: sie ihr … gehorchten
  rationale: πείθομαι mit dem Dativ einer Person kann „gehorchen“ bedeuten. Im Zusammenhang der Treue zur Mutter ist dies die naheliegende Lesart, auch wenn „sich von ihr überzeugen lassen“ lexikalisch möglich bleibt.
theological_decisions:
- issue: Wiedergabe von τὰ νόμιμα im jüdischen Märtyrerkontext
  choice: die gesetzlichen Vorschriften
  alternative: die überlieferten Satzungen; das Gesetz
  rationale: Der griechische Plural bezeichnet die verbindlichen religiös-rechtlichen Anforderungen, an denen die Brüder unter Verfolgung festhalten. Die gewählte Fassung bewahrt den Plural und vermeidet sowohl eine Verengung auf ein einzelnes Gesetz als auch die nicht ausdrücklich formulierte Festlegung auf „väterlich überliefert“.
- issue: Konkreter Familienbezug von φιλάδελφοι
  choice: voller Liebe zu ihren Brüdern
  alternative: voller Geschwisterliebe
  rationale: Die Erzählung handelt von Brüdern, und der griechische Ausdruck ist ausdrücklich auf Bruderliebe bezogen. Der konkrete männliche Familienbezug wird daher nicht neutralisiert.
- issue: Verhältnis von mütterlichem Gehorsam und Gesetzestreue
  choice: sie gehorchten der Mutter, indem sie die Vorschriften einhielten
  alternative: sie ließen sich von ihr überzeugen und hielten die Vorschriften bis zum Tod ein
  rationale: Die Konstruktion erlaubt πείθεσθαι als „gehorchen“, während das Partizip φυλάσσοντας die Einhaltung der Vorschriften als begleitende oder modale Handlung beschreibt. Die Übersetzung bewahrt diesen Zusammenhang, ohne die Mutter als Quelle der Vorschriften darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Tugenden folgt der rhetorischen Struktur des Griechischen, wird aber durch idiomatische deutsche Formulierungen geglättet. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Anmerkung bezieht.
