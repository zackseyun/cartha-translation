translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme der familiären Beziehung durch „Mutter“ und „Kinder“ bewahrt den Pathos des griechischen Satzes; „jedes einzelnen“ bildet dessen betonte Einzelzuordnung ab.
