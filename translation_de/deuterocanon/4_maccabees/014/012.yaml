  text: For the mother of the seven young men endured the tortures of each one of her children[a].
translation:
  language: de
  text: Denn die Mutter der sieben jungen Männer ertrug die Folterqualen jedes einzelnen ihrer Kinder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise genauer: „die Streckfolter an jedem einzelnen ihrer Kinder“; das griechische Wort kann eine Folterung auf der Streckbank bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: Mutter
  rationale: Die direkte, sachliche Wiedergabe bewahrt die familiäre Beziehung, die für die Aussage entscheidend ist.
- source_word: τῶν ἐπτὰ νεανίσκων
  choice: der sieben jungen Männer
  rationale: νεανίσκοι bezeichnet männliche Jugendliche oder junge Männer. „Junge Männer“ ist im heutigen Deutsch natürlich und vermeidet die nicht ausdrücklich im Ausdruck selbst enthaltene Deutung „Söhne“.
- source_word: ὑπήνεγκεν
  choice: ertrug
  rationale: Das Verb bezeichnet das Tragen beziehungsweise standhafte Aushalten von Leid; „ertrug“ gibt dies knapp und idiomatisch wieder.
- source_word: στρέβλας
  choice: Folterqualen
  rationale: Der Ausdruck kann Folter allgemein, möglicherweise aber auch das Quälen auf der Streckbank bezeichnen. „Folterqualen“ ist verständlich und lässt die Art der Folter im Haupttext offen.
- source_word: τὰς ἐφʼ ἑνὶ ἑκάστῳ τῶν τέκνων
  choice: die Folterqualen jedes einzelnen ihrer Kinder
  rationale: Die Formulierung bewahrt den distributiven Nachdruck von ἑνὶ ἑκάστῳ und die mütterliche Perspektive von τέκνων, ohne ein im Griechischen nicht ausdrücklich vorhandenes Verb wie „zugefügt wurden“ einzusetzen.
