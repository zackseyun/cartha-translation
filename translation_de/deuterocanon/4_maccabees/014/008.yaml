  yaml_path: translation/deuterocanon/4_maccabees/014/008.yaml
  text: Thus the young men[a], dancing around the seven, encircled them, abolishing the fear of tortures.
translation:
  language: de
  text: So bewegten sich die jungen Männer im Reigen um die Sieben[a] und machten die Furcht vor Foltern zunichte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann die Sieben als Zahl oder eine Gruppe von sieben bezeichnen; hier bezieht es sich auf die sieben Brüder, nicht auf eine Woche.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: Leitet knapp die aus dem Vorangehenden hervorgehende Art und Weise ein.
- source_word: περὶ τὴν ἑβδομάδα
  choice: um die Sieben
  rationale: Bewahrt die knappe und leicht mehrdeutige Rede von der Sieben beziehungsweise einer Siebenergruppe, ohne sie fälschlich als Kalenderwoche zu verstehen.
- source_word: χορεύοντες
  choice: im Reigen
  rationale: Gibt den bildhaften Gedanken eines chorischen beziehungsweise kreisförmigen Tanzes in würdigem, verständlichem Deutsch wieder.
- source_word: οἱ μεῖρακες
  choice: die jungen Männer
  rationale: Bezeichnet die jungen männlichen Personen alters- und geschlechtsbezogen, ohne sie durch „Jungen“ unnötig zu kindlich erscheinen zu lassen.
- source_word: ἐκύκλουν
  choice: bewegten sich … um
  rationale: Bringt die fortdauernde kreisende Bewegung des Imperfekts zum Ausdruck; zusammen mit „im Reigen“ wird das Zusammenspiel beider griechischer Bewegungswörter natürlich wiedergegeben.
- source_word: τὸν βασάνων φόβον
  choice: die Furcht vor Foltern
  rationale: βάσανοι bezeichnet hier konkret zugefügte Folterqualen; die deutsche Präpositionalfügung gibt den Genitiv idiomatisch wieder.
- source_word: καταλύοντες
  choice: machten … zunichte
  rationale: Drückt aus, dass die Furcht gebrochen und ihrer Macht beraubt wurde, ohne den Vorgang abstrakt als bloßes Verschwinden abzuschwächen.
theological_decisions:
- issue: Bedeutung von ἑβδομάδα
  choice: „die Sieben“ als knappe Bezeichnung mit Bezug auf die sieben Brüder
  alternative: „die Woche“ oder ausdrücklich „die Siebenergruppe“
  rationale: Im Martyriumskontext ist keine Kalenderwoche gemeint. „Die Sieben“ wahrt zugleich den möglichen Anklang an die Siebenzahl und den kollektiven Bezug auf die Brüder, statt die Bildsprache enger als nötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Reigen“ bewahrt das poetische Bild des griechischen Textes; „machten … zunichte“ ist kräftig, aber allgemein verständlich.
