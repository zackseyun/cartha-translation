base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/021.yaml
  text: O reason[b][a], tyrant over the passions of children! And godliness is to a mother more longed for than children.
translation:
  language: de
  text: O Vernunft, du Tyrannin über die Leidenschaften der Kinder![a] Für eine Mutter ist Frömmigkeit begehrenswerter als ihre Kinder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „O Vernunft, Tyrannin über die Leidenschaften der Kinder!“ Die Genitivverbindung kann auch als „Tyrannin der Leidenschaften der Kinder“ wiedergegeben werden.'
    reason: syntaktische_alternative
  - marker: b
    text: 'Oder: „Für eine Mutter ist Frömmigkeit mehr zu ersehnen als ihre Kinder.“'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: λογισμέ
  choice: Vernunft
  rationale: Der Vokativ bezeichnet in 4 Makkabäer die vernünftige Urteilskraft, die über die Leidenschaften herrscht. „Vernunft“ bewahrt diesen philosophischen Leitbegriff knapp und verständlich.
- source_word: τέκνων
  choice: der Kinder / ihre Kinder
  rationale: τέκνα bezeichnet geschlechtsübergreifend Kinder beziehungsweise Nachkommen. Im zweiten Satz macht das Possessivpronomen die im Deutschen naheliegende Beziehung zur Mutter deutlich.
- source_word: παθῶν
  choice: Leidenschaften
  rationale: πάθη meint hier die inneren Regungen und Triebe, die von der Vernunft beherrscht werden, nicht in erster Linie Leiden. „Leidenschaften“ erhält den philosophisch-ethischen Sinn.
- source_word: τύραννε
  choice: du Tyrannin über
  rationale: Das starke Herrschaftsbild des griechischen Vokativs wird erhalten. Wegen des weiblichen Genus von „Vernunft“ steht im Deutschen die feminine Form; „du“ macht die Anrede natürlich verständlich.
- source_word: εὐσέβεια
  choice: Frömmigkeit
  rationale: Gemeint ist die auf Gott gerichtete ehrfürchtige Treue. „Frömmigkeit“ ist im Kontext knapp, traditionsnah und lässt den umfassenden religiös-ethischen Sinn offen.
- source_word: μητρί
  choice: für eine Mutter
  rationale: Der Dativ bezeichnet die Person, für die der folgende Vergleich gilt. „Für eine Mutter“ ist im Deutschen idiomatisch und bewahrt den allgemeinen Aussagecharakter.
- source_word: ποθεινοτέρα
  choice: begehrenswerter
  rationale: Der Komparativ bezeichnet etwas, wonach man stärker verlangt oder das man mehr ersehnt. „Begehrenswerter“ gibt den Vergleich prägnant wieder, ohne ihn zu einer Aussage bloßer Liebe abzuschwächen.
theological_decisions:
- issue: Bedeutung von εὐσέβεια im Kontext des Martyriums
  choice: Frömmigkeit
  alternative: Gottesfurcht; Hingabe an Gott; Gottesverehrung
  rationale: Das Wort bezeichnet die Treue und Ehrfurcht gegenüber Gott, die sogar die mütterliche Bindung an die Kinder überragt. „Frömmigkeit“ bewahrt die Breite des griechischen Begriffs, ohne ihn auf Furcht, Kult oder ein späteres konfessionelles Verständnis festzulegen.
- issue: Zuordnung des Genitivs τέκνων im ersten Satz
  choice: „der Kinder“ wird eng mit „Leidenschaften“ verbunden
  alternative: „Vernunft der Kinder, Tyrannin über die Leidenschaften“
  rationale: Die Wortfolge lässt eine gewisse syntaktische Spannung zu. Die gewählte Fassung versteht die Vernunft als Herrscherin über die Leidenschaften der Kinder; die alternative Zuordnung wird in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter rhetorischer Ausrufform. Das ungewöhnlich starke Bild „Tyrannin“ gibt τύραννε bewusst ungemildert wieder. Der zweite Satz bleibt als pointierter Vergleich formuliert; „ihre Kinder“ verdeutlicht im Deutschen den Bezug, der im Griechischen aus dem Zusammenhang hervorgeht.
