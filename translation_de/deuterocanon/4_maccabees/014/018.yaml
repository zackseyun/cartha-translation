lexical_decisions:
- source_word: τί δεῖ
  choice: warum muss man
  rationale: Gibt die rhetorische Frage nach der Notwendigkeit natürlich und prägnant wieder.
- source_word: διὰ τῶν ἀλόγων ζῴων
  choice: ausgerechnet an vernunftlosen Tieren
  rationale: „Vernunftlos“ bewahrt den philosophischen Gegensatz zwischen Tieren und vernunftbegabten Menschen; „an“ bezeichnet die Tiere als Anschauungsbeispiel. „Ausgerechnet“ verdeutlicht idiomatisch den rhetorischen Sinn, ohne den Sachgehalt zu verändern.
- source_word: ἐπιδεικνύναι
  choice: aufzeigen
  rationale: Bezeichnet hier das anschauliche Darlegen oder Belegen anhand eines Beispiels.
- source_word: τὴν πρὸς τὰ τέκνα συμπάθειαν
  choice: die Zuneigung zu den eigenen Kindern
  rationale: „Zuneigung“ gibt συμπάθεια im Sinn elterlicher Verbundenheit wieder; „eigene“ macht die im Kontext vorausgesetzte Beziehung zum Nachwuchs verständlich.
