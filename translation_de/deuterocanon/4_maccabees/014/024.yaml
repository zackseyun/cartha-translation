base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/024.yaml
  text: How can I describe the affection of parents for their children—the fervor that stamps into the small form of a child the marvelous likeness of soul and appearance[a], This is especially so because fathers make mothers more sympathetic toward those who have been born?
translation:
  language: de
  text: Wie könnte ich die innige Liebe von Eltern zu ihren Kindern schildern – jene Glut, die dem kleinen Gepräge eines Kindes die wunderbare Ähnlichkeit der Seele und der Gestalt einprägt?[a] Dies gilt besonders, weil die Väter die Mütter den Kindern gegenüber mitfühlender machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „jene Glut, die in das kleine Kindergepräge die wunderbare Ähnlichkeit von Seele und Gestalt einsiegelt“. Das Griechische ist rhetorisch dicht und verbindet seltene Wörter mit dem Bild eines Siegels oder Prägestempels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τρόπον ἠθολογήσῃμι
  choice: Wie könnte ich ... schildern
  rationale: Die rhetorische Frage und die Schwierigkeit, das Empfinden angemessen darzustellen, werden in natürlichem Deutsch bewahrt; das seltene Verb bezeichnet ein anschauliches Schildern.
- source_word: φιλοτέκνα γονέων αἴθη
  choice: die innige Liebe von Eltern zu ihren Kindern – jene Glut
  rationale: φιλοτέκνα bezeichnet die Liebe zu den eigenen Kindern; αἴθη trägt zugleich das intensive Bild emotionaler Hitze oder Glut.
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: die wunderbare Ähnlichkeit der Seele und der Gestalt
  rationale: Die innere und äußere Entsprechung bleibt erhalten, ohne ψυχή auf Charakter oder μορφή auf bloßes Aussehen zu verengen.
- source_word: εἰς μικρὸν παιδοχαρακτῆρα
  choice: dem kleinen Gepräge eines Kindes
  rationale: Die ungewöhnliche Prägungs- und Siegelmetaphorik des Kompositums παιδοχαρακτήρ wird möglichst knapp und verständlich wiedergegeben.
- source_word: ἐναποσφραγίζοντα
  choice: einprägt
  rationale: Das Verb bezeichnet ein Hinein- oder Aufprägen mittels eines Siegels; „einprägt“ bewahrt das Bild idiomatisch.
- source_word: μάλιστα διὰ τὸ
  choice: Dies gilt besonders, weil
  rationale: Gibt die verstärkende und kausale Verbindung in flüssigem modernem Deutsch wieder.
- source_word: τῶν πατέρων τοῖς γεννηθεῖσιν τὰς μητέρας καθιστᾶναι συμπαθεστέρας
  choice: weil die Väter die Mütter mitfühlender gegenüber ihren Kindern machen
  rationale: Die grammatische Aussage wird eng am Griechischen bewahrt; τοῖς γεννηθεῖσιν meint in diesem Zusammenhang die geborenen Kinder beziehungsweise Nachkommen.
theological_decisions:
- issue: Aussage über den Einfluss der Väter auf die mütterliche Zuneigung
  choice: die Väter die Mütter mitfühlender gegenüber ihren Kindern machen
  alternative: die Väter bewirken, dass die Mütter ihren Nachkommen stärker verbunden sind
  rationale: Die auffällige Aussage des griechischen Textes wird nicht harmonisiert oder psychologisch umgedeutet; συμπαθεστέρας bleibt als Komparativ erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter rhetorischer Frage und Prägungsmetaphorik. „Gepräge“ ist bewusst leicht gehoben, da eine vollständig alltägliche Formulierung das seltene Bild des griechischen Textes einebnen würde.
