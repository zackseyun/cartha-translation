    issue: Die Vergleichsbeziehung von ὥσπερ τρέχοντες ist mit „gleichsam ... liefen ... und eilten“ weniger klar gefasst.
    rationale: Ein Nebensatz mit „als liefen sie“ gibt den Vergleich natürlich wieder und verbindet das Laufbild eindeutig mit dem Eilen zum Tod.
  - severity: low
    issue: „Folterqualen“ ist begrifflich redundant.
    rationale: βάσανοι lässt sich direkt mit „Foltern“ wiedergeben; dies ist präzise, natürlich und bewahrt die Schwere des Begriffs.
