lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den deutlichen Gegensatz zum vorausgehenden Zusammenhang und wirkt im modernen Deutschen natürlich.
- source_word: πάντες
  choice: sie alle
  rationale: Gibt die Gesamtheit der bereits genannten Gruppe klar und idiomatisch wieder.
- source_word: ὥσπερ
  choice: gleichsam
  rationale: Leitet einen Vergleich ein, ohne die Aussage als buchstäbliche Gleichsetzung festzulegen.
- source_word: ἐπʼ ἀθανασίας ὁδὸν
  choice: auf einer Straße zur Unsterblichkeit
  rationale: Bewahrt sowohl das Wegbild als auch den theologischen Begriff der Unsterblichkeit.
- source_word: τρέχοντες
  choice: liefen
  rationale: Gibt die rasche, zielgerichtete Bewegung des Partizips unmittelbar wieder.
- source_word: ἐπὶ τὸν ... θάνατον
  choice: dem Tod ... entgegen
  rationale: Bringt die durch ἐπί mit Akkusativ bezeichnete Bewegung auf ein Ziel hin idiomatisch zum Ausdruck.
- source_word: διὰ τῶν βασάνων
  choice: durch Folterqualen
  rationale: Erfasst die schweren, durch Folter verursachten Qualen und wahrt zugleich die Vorstellung des Weges, auf dem der Tod erreicht wird.
- source_word: ἔσπευδον
  choice: eilten
  rationale: Bewahrt die anhaltende, entschlossene Eile des Imperfekts in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Bedeutung von ἀθανασία im Märtyrerkontext
  choice: Unsterblichkeit
  alternative: ewiges Leben
  rationale: Das griechische Substantiv bezeichnet unmittelbar Unsterblichkeit beziehungsweise Todlosigkeit. Die Übersetzung bewahrt diesen theologisch gewichtigen Begriff, statt ihn deutend zu »ewigem Leben« zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Bild des Laufens auf einer Straße und die darauf bezogene Bewegung dem Tod entgegen bleiben erhalten; das abschließende Komma entspricht dem fortlaufenden Satz des Ausgangstextes.
