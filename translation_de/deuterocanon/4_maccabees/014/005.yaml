  verdict: revise
  source_fidelity: 'Die wesentlichen Elemente sind zutreffend wiedergegeben: der starke Gegensatz, die Gesamtheit der Gruppe, das Bild des Laufens auf dem Weg zur Unsterblichkeit, das Eilen zum Tod sowie die Foltern als Todesweg. Die Vergleichskonstruktion ὥσπερ + Partizip wird jedoch im Deutschen klarer und idiomatischer durch einen ausdrücklichen irreal-verglichenen Nebensatz wiedergegeben.'
  naturalness: „Gleichsam ... liefen ... und eilten“ ist verständlich, aber stilistisch weniger flüssig und kann die genaue syntaktische Beziehung des griechischen Vergleichs abschwächen. „Als liefen sie ...“ ist modernes Standarddeutsch und macht deutlich, dass das Laufen das Vergleichsbild für ihr Eilen ist.
  terminology: „Unsterblichkeit“ gibt ἀθανασία präzise wieder. „Folterqualen“ ist inhaltlich möglich, aber tautologisch; „Foltern“ entspricht βάσανοι unmittelbar und ist im heutigen Deutsch klar. Die alternative Fußnote „durch Qualen“ bleibt als weitere, weniger spezifische Wiedergabemöglichkeit vertretbar.
  issues:
