  text: Among desires, some are of the soul and others of the body; and over both of these, reason is evidently master.
translation:
  language: de
  text: Von den Begierden sind die einen seelischer, die anderen körperlicher Art; und über beide hat die Vernunft offenbar die Oberhand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und über beide herrscht die Vernunft offenbar.“'
    reason: Lexikalische Alternative für ἐπικρατεῖ, das sowohl das Überwiegen als auch das Herrschen über etwas bezeichnen kann.
lexical_decisions:
- source_word: ἐπιθυμιῶν
  choice: Begierden
  rationale: „Begierden“ bezeichnet starke Wünsche oder Verlangen und eignet sich für die folgende philosophische Einteilung, ohne die Bedeutung auf rein körperliche Triebe zu verengen.
- source_word: ψυχικαί
  choice: seelischer Art
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf die Seele und bildet einen klaren Gegensatz zu „körperlicher Art“; das missverständliche „psychisch“ wird vermieden.
- source_word: σωματικαί
  choice: körperlicher Art
  rationale: Dies ist das natürliche und parallele Gegenstück zu ψυχικαί und gibt den Bezug auf den Körper unmittelbar wieder.
- source_word: λογισμός
  choice: Vernunft
  rationale: Im Gedankengang des 4. Makkabäerbuches bezeichnet λογισμός das vernünftige Urteils- und Steuerungsvermögen. „Vernunft“ ist dafür der prägnante, philosophisch passende deutsche Ausdruck.
- source_word: ἐπικρατεῖ
  choice: hat die Oberhand
  rationale: Die idiomatische Wendung gibt das Überwiegen beziehungsweise die wirksame Herrschaft der Vernunft wieder, ohne eine weitergehende Lehraussage einzutragen.
- source_word: φαίνεται
  choice: offenbar
  rationale: „Offenbar“ bringt zum Ausdruck, dass sich die Überlegenheit der Vernunft als erkennbar oder erwiesen darstellt, statt bloß eine unsichere Vermutung zu bezeichnen.
theological_decisions:
- issue: Anthropologische Unterscheidung zwischen ψυχικαί und σωματικαί
  choice: Begierden seelischer und körperlicher Art
  alternative: geistige und körperliche Begierden
  rationale: „Seelisch“ bewahrt die Kategorie ψυχή und vermeidet, sie vorschnell auf bloße Gedanken oder auf den Geist im theologischen Sinn festzulegen. Der Vers klassifiziert Begierden, ohne daraus ein ausgearbeitetes dualistisches Menschenbild zu entwickeln.
- issue: Aussagekraft von λογισμός ἐπικρατεῖ
  choice: die Vernunft hat über beide die Oberhand
  alternative: die Vernunft herrscht über beide
  rationale: „Die Oberhand haben“ wahrt den Gedanken wirksamer Überlegenheit, lässt aber offen, ob die Aussage als Herrschaft, Kontrolle oder erfolgreiches Überwinden näher zu bestimmen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit philosophischer Klarheit. Die parallele Formulierung „seelischer … körperlicher Art“ erhält die Struktur des Griechischen; „hat die Oberhand“ ist allgemein verständlich und vermeidet unnötig technische Sprache.
