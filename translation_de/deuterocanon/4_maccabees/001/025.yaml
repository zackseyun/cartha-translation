  text: And within pleasure there is also a malicious disposition[a], being the most versatile of all the passions.
translation:
  language: de
  text: Zur Lust gehört auch die bösartige Neigung; sie ist die vielgestaltigste[a] aller Leidenschaften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wandlungsfähigste“; das griechische Wort kann etwas bezeichnen, das viele Formen oder Wendungen annimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῇ ἡδονῇ
  choice: Zur Lust gehört
  rationale: Die Wendung gibt die Einordnung innerhalb des Bereichs der Lust in natürlichem Deutsch wieder; δέ führt den Gedankengang weiter.
- source_word: κακοήθης διάθεσις
  choice: die bösartige Neigung
  rationale: διάθεσις bezeichnet hier eine innere Disposition oder Tendenz; κακοήθης kennzeichnet sie moralisch als bösartig. „Neigung“ ist im Deutschen verständlicher und idiomatischer als das fachsprachliche „Disposition“.
- source_word: πολυτροπωτάτη
  choice: die vielgestaltigste
  rationale: Der Superlativ von πολύτροπος bezeichnet etwas mit besonders vielen Formen, Wendungen oder Wirkungsweisen. „Vielgestaltigste“ bewahrt diese Mehrdeutigkeit, ohne den im Deutschen oft positiven Beiklang von „vielseitigste“ einzutragen.
- source_word: πάντων τῶν παθῶν
  choice: aller Leidenschaften
  rationale: πάθη bezeichnet im philosophisch-ethischen Zusammenhang die Regungen oder Leidenschaften, über die die Vernunft herrschen soll.
- source_word: οὖσα
  choice: sie ist
  rationale: Ein selbstständiger deutscher Satz gibt den beschreibenden Bezug des Partizips auf διάθεσις klar und natürlich wieder, ohne eine zusätzliche kausale Bedeutung einzuführen.
theological_decisions:
- issue: Wiedergabe von πάθη im hellenistisch-jüdischen philosophischen Zusammenhang
  choice: Leidenschaften
  alternative: Gemütsregungen; Affekte
  rationale: „Leidenschaften“ wahrt den ethisch-philosophischen Zusammenhang des Buches, in dem die Vernunft über die πάθη herrschen soll, ohne sie lediglich als neutrale Gefühle zu bezeichnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Partizipialkonstruktion; „vielgestaltigste“ erhält die Bildhaftigkeit und moralische Spannung des griechischen Ausdrucks.
