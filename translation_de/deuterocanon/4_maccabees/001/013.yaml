translation:
  language: de
  text: Untersuchen wir also, ob die Vernunft Herrin über die Leidenschaften ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ob das vernünftige Urteil über die Leidenschaften herrscht“.'
