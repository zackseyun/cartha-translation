  source_fidelity: Der Entwurf gibt die argumentative Aufforderung von Ζητοῦμεν und die Kernfrage nach der Herrschaft des λογισμός über die πάθη zutreffend wieder. „Leidenschaften“ trifft den ethisch-philosophischen Sinn von πάθη gut; „Vernunft“ ist für λογισμός hier eine tragfähige, knappe Wiedergabe.
