lexical_decisions:
- source_word: Ζητοῦμεν
  choice: wollen wir untersuchen
  rationale: Das Präsens der ersten Person Plural leitet hier die gemeinsame Untersuchung der aufgeworfenen Frage ein. „Wollen wir untersuchen“ klingt im modernen Deutschen natürlich und bewahrt den auffordernd-überlegenden Charakter.
- source_word: δὴ τοίνυν
  choice: So … nun
  rationale: Die Partikelverbindung kennzeichnet sowohl den folgernden als auch den überleitenden Fortgang der Argumentation. Die deutsche Verbindung „So … nun“ gibt beides knapp wieder.
- source_word: αὐτοκράτωρ
  choice: Herrin über
  rationale: Das Wort bezeichnet uneingeschränkte, eigenständige Herrschaft oder Verfügungsgewalt. Das prädikative „Herrin über“ passt grammatisch zu „die Vernunft“ und bewahrt das anschauliche Herrschaftsbild; „souverän“ wäre ebenfalls möglich, aber abstrakter.
- source_word: τῶν παθῶν
  choice: die Leidenschaften
  rationale: Im hellenistisch-ethischen Zusammenhang bezeichnet πάθη affektive Regungen und Triebe, die der Vernunft gegenüberstehen. „Leidenschaften“ erhält diese philosophische Färbung besser als das neutralere „Gefühle“.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: λογισμός bezeichnet hier das vernünftige Denken beziehungsweise die urteilende Vernunft als Leitvermögen. „Die Vernunft“ ist prägnant, idiomatisch und entspricht der zentralen Fragestellung des Buches.
theological_decisions:
- issue: Philosophisch-anthropologisches Verhältnis von λογισμός und πάθη
  choice: die Vernunft Herrin über die Leidenschaften
  alternative: das vernünftige Urteil souverän über die Leidenschaften
  rationale: Die Formulierung erhält die These von der Herrschaft der Vernunft über die Affekte, ohne πάθη zu neutralen Gefühlen abzuschwächen oder spätere konfessionelle Kategorien einzutragen. Zugleich bleibt offen, ob λογισμός eher als Vermögen oder als konkretes vernünftiges Urteil verstanden wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weibliche Form „Herrin“ folgt dem grammatischen Geschlecht von „Vernunft“ und bewahrt das Herrschaftsbild des griechischen αὐτοκράτωρ. Der Fußnotenmarker steht nach dem vollständigen Fragesatz.
