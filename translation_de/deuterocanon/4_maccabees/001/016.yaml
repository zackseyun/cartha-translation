  text: Weisheit ist demnach die Kenntnis göttlicher und menschlicher Dinge und ihrer Ursachen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφία
  choice: Weisheit
  rationale: Das abstrakte Substantiv wird direkt wiedergegeben und bewahrt den definitorisch-philosophischen Ton.
- source_word: δὴ τοίνυν
  choice: demnach
  rationale: Die Partikelverbindung kennzeichnet einen folgernden Übergang; „demnach“ gibt diesen Zusammenhang in natürlichem, würdigem Deutsch wieder.
- source_word: γνῶσις
  choice: Kenntnis
  rationale: „Kenntnis“ entspricht dem griechischen Begriff im Rahmen einer Definition genauer als das stärker deutende „Verständnis“.
- source_word: θείων καὶ ἀνθρωπίνων πραγμάτων
  choice: göttlicher und menschlicher Dinge
  rationale: Die Genitivgruppe bezeichnet Gegenstände beziehungsweise Sachverhalte aus dem göttlichen und menschlichen Bereich. „Dinge“ wahrt die Breite von πραγμάτων und vermeidet die mögliche Verengung von „Angelegenheiten“.
- source_word: τῶν τούτων αἰτίων
  choice: ihrer Ursachen
  rationale: τούτων verweist auf die zuvor genannten göttlichen und menschlichen Dinge; αἰτίων wird im philosophischen Sinn direkt mit „Ursachen“ wiedergegeben.
