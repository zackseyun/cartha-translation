base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/033.yaml
  text: For why is it that[a], when we are moved toward the forbidden foods, we turn away from the pleasures that come from them? Is it not because reason is able to prevail over desires? I think so.
translation:
  language: de
  text: 'Denn warum wenden wir uns, wenn es uns zu den verbotenen Speisen zieht, von den Freuden ab, die sie bereiten? Ist es nicht, weil die Vernunft die Begierden[a] beherrschen kann? Ich meine: ja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verlangen«; im Zusammenhang mit Speisen auch: »Appetit«. Das griechische Wort bezeichnet Begehrungen und kann hier besonders körperliches Verlangen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Denn warum
  rationale: Leitet eine begründende rhetorische Frage ein und bewahrt sowohl den Anschluss als auch den Fragesinn.
- source_word: κινούμενοι πρὸς
  choice: obwohl es uns … zieht
  rationale: Gibt den inneren Antrieb zu den Speisen natürlich wieder; „obwohl“ verdeutlicht den im Satz vorausgesetzten Gegensatz zum Sich-Abwenden.
- source_word: τὰς ἀπειρημένας τροφάς
  choice: die verbotenen Speisen
  rationale: ἀπειρημένας bezeichnet ausdrücklich Verbotenes; τροφαί meint hier aufgrund des Zusammenhangs konkrete Speisen.
- source_word: ἀποτρεπόμεθα
  choice: wenden wir uns … ab
  rationale: Bewahrt das Bewegungsbild des griechischen Verbs und seine mediale Bedeutung.
- source_word: τὰς ἐξ αὐτῶν ἡδονάς
  choice: die Freuden, die sie bereiten
  rationale: Drückt verständlich die von den Speisen ausgehenden Genüsse aus, ohne den Sinn zu erweitern.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: Bezeichnet im philosophischen Gedankengang des 4. Makkabäerbuchs das vernünftige Urteilsvermögen, das die Begierden lenken kann.
- source_word: τῶν ὀρέξεων ἐπικρατεῖν
  choice: die Begierden beherrschen kann
  rationale: ἐπικρατεῖν meint überlegen sein beziehungsweise Herrschaft gewinnen; ὀρέξεις umfasst hier besonders körperliche Begehrlichkeiten.
- source_word: ἐγὼ μὲν οἶμαι
  choice: Das meine ich jedenfalls
  rationale: Bewahrt die persönliche, bejahende Schlussfolgerung und gibt μέν mit einer leichten Hervorhebung wieder.
theological_decisions:
- issue: Philosophisch-anthropologische Bedeutung von λογισμός
  choice: die Vernunft
  alternative: das vernünftige Urteil; das Denkvermögen
  rationale: „Vernunft“ gibt die leitende rationale Fähigkeit prägnant wieder, ohne spätere dogmatische Kategorien einzutragen.
- issue: Stärke von ἐπικρατεῖν gegenüber den Begierden
  choice: beherrschen kann
  alternative: über die Begierden siegen kann
  rationale: „Beherrschen“ erhält die Aussage, dass die Vernunft den Begierden überlegen sein und sie lenken kann, ohne eine absolute Auslöschung der Begierden zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Gedankenführung bleibt erhalten; philosophische Schlüsselbegriffe werden verständlich, aber nicht konfessionell zugespitzt wiedergegeben.
