  source_fidelity: 'Die Grundbegriffe sind treffend wiedergegeben: λογισμός als „Vernunft“, πάθη als „Leidenschaften“ sowie der Tugendkatalog mit „Gerechtigkeit“, „Tapferkeit“, „Selbstbeherrschung“ und „Klugheit“. Der Bezug von τούτων auf „das, was … entgegensteht“ wird angemessen allgemein gehalten. In der vorliegenden Fassung verschiebt jedoch „darüber herrscht sie nicht“ die Aussage: Das Griechische verneint nicht die Herrschaft über diese entgegenstehenden Dinge, sondern deren Ziel bzw. Art, nämlich sie zu beseitigen.'
