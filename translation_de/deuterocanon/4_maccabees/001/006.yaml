base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/006.yaml
  text: For reason does not rule over one's own passions[a], but over those things opposed to justice and courage and self-control and prudence; and over these, not so as to destroy them, but so as not to yield to them.
translation:
  language: de
  text: Denn die Vernunft herrscht nicht über ihre eigenen Leidenschaften, sondern über das, was der Gerechtigkeit[a], der Tapferkeit, der Selbstbeherrschung und der Klugheit entgegensteht; und zwar nicht, um es zu beseitigen, sondern um ihm nicht nachzugeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Rechtschaffenheit.'
    reason: Lexikalische Alternative für δικαιοσύνη; im vorliegenden Tugendkatalog ist „Gerechtigkeit“ vorzuziehen.
lexical_decisions:
- source_word: λογισμός
  choice: die Vernunft
  rationale: Der philosophische Schlüsselbegriff bezeichnet hier das Vermögen vernünftiger Überlegung; „Vernunft“ ist prägnant und im Deutschen natürlich.
- source_word: κρατεῖ
  choice: herrscht über
  rationale: κρατέω bezeichnet die Ausübung von Herrschaft oder Überlegenheit. Die Formulierung erhält das Leitbild der beherrschenden Vernunft.
- source_word: πάθη
  choice: Leidenschaften
  rationale: Im ethisch-philosophischen Zusammenhang sind Gemütsbewegungen und Triebe gemeint, nicht Leiden im Sinn von Widerfahrnissen.
- source_word: τῶν ... ἐναντίων
  choice: das, was ... entgegensteht
  rationale: Die substantivierte Wendung bleibt in ihrem Bezug allgemein und wird nicht unnötig ausdrücklich auf bestimmte Impulse festgelegt.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: Im Zusammenhang der vier Kardinaltugenden bezeichnet der Begriff vor allem die Tugend der Gerechtigkeit.
- source_word: ἀνδρεία
  choice: Tapferkeit
  rationale: Das Wort bezeichnet die Tugend mutiger Standhaftigkeit; „Tapferkeit“ passt zum gehobenen Tugendkatalog und vermeidet die wörtlich mögliche geschlechtliche Färbung.
- source_word: σωφροσύνη
  choice: Selbstbeherrschung
  rationale: Gemeint ist sittliche Besonnenheit und die disziplinierte Herrschaft über eigene Regungen; „Selbstbeherrschung“ ist modern und verständlich.
- source_word: φρόνησις
  choice: Klugheit
  rationale: Der Ausdruck bezeichnet praktische Einsicht beziehungsweise Klugheit und ist von umfassender „Weisheit“ zu unterscheiden.
- source_word: καταλῦσαι
  choice: beseitigt
  rationale: Das Verb meint hier, die entgegenstehenden Regungen aufzulösen oder außer Kraft zu setzen. „Beseitigen“ gibt den Sinn klar wieder, ohne unnötig gewaltsam zu klingen.
- source_word: μὴ εἴξαι
  choice: ihm nicht nachgibt
  rationale: εἴκω bedeutet nachgeben oder weichen; die deutsche Wendung ist direkt und idiomatisch.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη innerhalb eines hellenistischen Tugendkatalogs
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Die unmittelbare Verbindung mit Tapferkeit, Selbstbeherrschung und Klugheit weist auf die klassischen Kardinaltugenden. „Gerechtigkeit“ ist daher kontextuell vorzuziehen; die ethisch-religiöse Alternative wird in der Fußnote offengelegt.
- issue: Bezug von ἑαυτοῦ in „τῶν ἑαυτοῦ παθῶν“
  choice: ihre eigenen Leidenschaften, mit Bezug auf die Vernunft
  alternative: die eigenen Leidenschaften eines Menschen
  rationale: Die grammatische Form erlaubt eine Rückbeziehung auf das Subjekt „Vernunft“, obwohl die gemeinten Leidenschaften sachlich die der Person sind. Die formnahe Wiedergabe bewahrt die auffällige Spannung des griechischen Satzes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der argumentativen Gegenüberstellung des Griechischen. Das neutrale Singularpronomen „ihm“ nimmt das zusammenfassende „das, was … entgegensteht“ auf; die Wiederholung von „herrscht“ verdeutlicht den im Griechischen elliptisch fortgeführten Gedanken.
