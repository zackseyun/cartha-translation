  text: Dem Vergnügen geht also das Verlangen voraus; ihm folgt die Freude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδονή
  choice: Lust
  rationale: Bezeichnet hier sinnliches oder emotionales Wohlgefühl beziehungsweise Vergnügen; „Lust“ bewahrt die knappe, philosophische Ausdrucksweise.
- source_word: ἐπιθυμία
  choice: Verlangen
  rationale: Gibt das auf einen begehrten Genuss gerichtete Streben natürlich und ohne unnötig negative moralische Wertung wieder.
- source_word: χαρά
  choice: Freude
  rationale: Die übliche und im Zusammenhang klare Entsprechung für die nach dem Genuss eintretende Freude.
- source_word: πρὸ … μετὰ
  choice: vor … nach
  rationale: Bewahrt die zeitliche Gegenüberstellung des griechischen Satzes.
- source_word: μὲν οὖν … δὲ
  choice: also … aber
  rationale: Gibt sowohl die folgernde Einordnung durch οὖν als auch den Kontrast der korrelativen Partikeln knapp wieder.
