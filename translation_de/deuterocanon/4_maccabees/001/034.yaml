base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/034.yaml
  text: Therefore[a], though we desire creatures from the water, birds[b], and four-footed animals—all kinds of food forbidden to us by the law—we abstain because of the mastery of reason.
translation:
  language: de
  text: Darum enthalten wir uns trotz unseres Verlangens nach Wassertieren[a], Vögeln und vierfüßigen Tieren von allerlei Speisen, die uns nach dem Gesetz verboten sind, aufgrund der Herrschaft der Vernunft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Wasser lebenden Tieren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „aufgrund der Vorherrschaft oder Herrschaft der Vernunft“. Gemeint ist die beherrschende Kraft der durch das Gesetz geprägten vernünftigen Urteilskraft gegenüber den Begierden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Darum
  rationale: Die Folgerungspartikel zieht eine Schlussfolgerung aus dem vorherigen Gedankengang. „Darum“ ist im modernen Deutschen klar und natürlich.
- source_word: ἐνύδρων
  choice: Wassertieren
  rationale: Das substantivierte Adjektiv bezeichnet im Wasser lebende Tiere, ohne die Aussage auf Fische zu verengen.
- source_word: ἐπιθυμοῦντες
  choice: obwohl wir Verlangen … haben
  rationale: 'Das Partizip bezeichnet ein tatsächliches Begehren und ist im Zusammenhang konzessiv zu verstehen: Trotz dieses Verlangens enthalten sich die Sprecher.'
- source_word: ὀρνέων
  choice: Vögeln
  rationale: Die gewöhnliche und allgemein verständliche deutsche Bezeichnung gibt den griechischen Ausdruck ohne archaische Färbung wieder.
- source_word: τετραπόδων
  choice: vierfüßigen Tieren
  rationale: Die Formulierung bewahrt das konkrete Bild des griechischen Wortes und bleibt verständlich.
- source_word: παντοίων βρωμάτων
  choice: allerlei Speisen
  rationale: Die zusammenfassende Apposition bezeichnet Speisen jeder Art. „Allerlei Speisen“ ist natürlich und lässt sich idiomatisch an die vorangehende Aufzählung anschließen.
- source_word: τῶν ἀπηγορευμένων ἡμῖν κατὰ τὸν νόμον
  choice: die uns nach dem Gesetz verboten sind
  rationale: „Nach dem Gesetz“ wahrt den Bezug auf die gesetzliche Norm und vermeidet eine unnötige konfessionelle Präzisierung.
- source_word: ἀπέχομεθα
  choice: wir enthalten uns
  rationale: „Sich enthalten“ ist die sachlich passende deutsche Wendung für den bewussten Verzicht auf verbotene Speisen.
- source_word: διὰ τὴν τοῦ λογισμοῦ ἐπικράτειαν
  choice: weil die Vernunft die Oberhand hat
  rationale: Die idiomatische Wendung bringt die beherrschende Kraft der vernünftigen Überlegung gegenüber dem Begehren zum Ausdruck, ohne zusätzliche philosophische Fachsprache einzuführen.
theological_decisions:
- issue: Bedeutung von λόγισμος im philosophisch-theologischen Gedankengang des 4. Makkabäerbuches
  choice: Vernunft
  alternative: vernünftige Überlegung
  rationale: λόγισμος bezeichnet hier die durch das Gesetz geprägte vernünftige Urteilskraft, die das Begehren beherrscht. „Vernunft“ ist prägnant und ermöglicht eine konsistente Wiedergabe des Leitbegriffs; die ausführlichere Alternative bleibt sachlich möglich.
- issue: Verhältnis zwischen Begehren und gesetzestreuem Verzicht
  choice: 'Die konzessive Spannung wird ausdrücklich bewahrt: Verlangen ist vorhanden, dennoch erfolgt Enthaltung.'
  alternative: Das Partizip lediglich gleichzeitig mit „sich enthalten“ wiederzugeben
  rationale: Der Satz dient als Beispiel für die Herrschaft der Vernunft über tatsächliche Begierden. Die konzessive Wiedergabe macht diese im Kontext erkennbare Spannung deutlich, ohne das Begehren abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt den bewussten Verzicht an den Anfang und hält zugleich die Spannung zwischen wirklichem Verlangen, gesetzlichem Verbot und der Herrschaft der Vernunft fest. Alle Fußnotenmarker stehen an den jeweils sachlich zugehörigen Ausdrücken.
