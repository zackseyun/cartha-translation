base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/001.yaml
  text: Since I am about to demonstrate a most philosophical argument—whether devout reason is master of the passions—I would rightly advise you to give eager attention to philosophy[a].
translation:
  language: de
  text: Da ich im Begriff bin, eine höchst philosophische Erörterung darzulegen – nämlich ob die fromme Vernunft uneingeschränkt über die Leidenschaften herrscht[a] –, möchte ich euch mit gutem Grund raten, der Philosophie mit Eifer Aufmerksamkeit zu schenken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ob die fromme Vernunft Herrin über die Leidenschaften ist“.'
    reason: Die seltene Bezeichnung αὐτόδεσποτος kann sowohl mit einer substantivischen Herrschaftsmetapher als auch mit einer Umschreibung vollständiger Herrschaft wiedergegeben werden.
lexical_decisions:
- source_word: ΦΙΛΟΣΟΦΩΤΑΤΟΝ λόγον
  choice: eine höchst philosophische Erörterung
  rationale: λόγος bezeichnet hier die angekündigte Darlegung beziehungsweise Argumentation; „Erörterung“ passt zum philosophischen und rhetorischen Charakter. Der Superlativ φιλοσοφώτατον bleibt durch „höchst philosophisch“ erhalten.
- source_word: ἐπιδείκνυσθαι μέλλων
  choice: Da ich im Begriff bin, ... darzulegen
  rationale: μέλλων bezeichnet die unmittelbar bevorstehende Absicht; ἐπιδείκνυσθαι meint das vorführende Darlegen oder Aufweisen einer These. Die deutsche Wendung wahrt beides, ohne bereits den stärkeren Sinn „beweisen“ festzulegen.
- source_word: εἰ
  choice: ob
  rationale: εἰ leitet hier die Frage ein, die Gegenstand der angekündigten Erörterung ist; daher ist das deutsche „ob“ angemessen.
- source_word: αὐτόδεσποτός
  choice: uneingeschränkt ... herrscht
  rationale: Das Kompositum bezeichnet eigenständige beziehungsweise vollständige Herrschaft. „Uneingeschränkt herrscht“ bewahrt die Stärke des Ausdrucks und verbindet sich im Deutschen natürlich mit „über“.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: πάθη bezeichnet im hellenistisch-philosophischen Zusammenhang Affekte, emotionale Regungen oder Leidenschaften. „Leidenschaften“ wahrt den historischen Begriffshorizont; die Präposition „über“ ergibt sich aus der deutschen Konstruktion mit „herrschen“.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: die fromme Vernunft
  rationale: λογισμός bezeichnet hier das vernünftige Urteils- und Denkvermögen; εὐσεβής kennzeichnet es als von Gottesfurcht beziehungsweise Frömmigkeit geprägt. „Fromme Vernunft“ erhält beide Dimensionen knapp und verständlich.
- source_word: συμβουλεύσαιμʼ ἂν ὑμῖν
  choice: möchte ich euch ... raten
  rationale: Der Optativ mit ἄν formuliert einen höflichen, zurückhaltenden Rat. „Möchte ich euch raten“ bildet diesen Ton natürlicher ab als ein direkter Imperativ.
- source_word: ὀρθῶς
  choice: mit gutem Grund
  rationale: Das Adverb bewertet den Rat als berechtigt oder angemessen. „Mit gutem Grund“ ist in modernem Deutsch natürlicher als das mögliche, aber steifere „zu Recht“ an dieser Satzstelle.
- source_word: ὅπως προθύμως προσέχητε
  choice: mit Eifer Aufmerksamkeit zu schenken
  rationale: προσέχω fordert aufmerksame Hinwendung; προθύμως fügt Bereitwilligkeit und Eifer hinzu. Die Formulierung gibt beide Aspekte wieder.
- source_word: τῇ φιλοσοφίᾳ
  choice: der Philosophie
  rationale: Der Dativ bezeichnet den Gegenstand der Aufmerksamkeit. Der bestimmte Artikel des Griechischen wird im Deutschen beibehalten, ohne den Bezug durch „dieser“ unnötig zu verengen.
theological_decisions:
- issue: Wiedergabe von εὐσεβὴς λογισμός unter Wahrung der religiösen und philosophischen Dimension
  choice: die fromme Vernunft
  alternative: das gottesfürchtige Denken
  rationale: „Fromme Vernunft“ hält λογισμός als Vernunftvermögen fest und bewahrt durch „fromm“ die religiöse Ausrichtung. „Gottesfürchtiges Denken“ wäre verständlich, könnte λογισμός jedoch stärker als bloßen Denkprozess erscheinen lassen.
- issue: Stärke des Herrschaftsanspruchs in αὐτόδεσποτος
  choice: uneingeschränkt über die Leidenschaften herrscht
  alternative: Herrin über die Leidenschaften ist
  rationale: Das seltene Kompositum betont volle, eigenständige Verfügungsgewalt. Die Hauptfassung macht diese Intensität ausdrücklich, ohne die These darüber hinaus als absolute Vernichtung oder Gefühllosigkeit auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem philosophisch-rhetorischem Ton. Der lange Periodensatz des Griechischen bleibt erkennbar, wird aber durch Gedankenstriche gegliedert. „Leidenschaften“ und „Philosophie“ bewahren den antiken Begriffshorizont, während die Syntax allgemein verständlich bleibt.
