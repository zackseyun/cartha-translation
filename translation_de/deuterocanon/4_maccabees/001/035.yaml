base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/035.yaml
  text: For the passions of desires are held in check[a], being turned back by the self-controlled mind; and all the body's impulses are governed by reason.
translation:
  language: de
  text: Denn die Leidenschaften der Begierden werden in Schranken gehalten, indem der besonnene Verstand sie zurückweist; und alle Regungen des Körpers werden von der Vernunft zum Streben nach Ehre angeleitet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „und alle Regungen des Körpers werden von der Vernunft gelenkt.“ Das hier ungewöhnlich gebrauchte griechische Verb bezeichnet sonst eifriges Streben oder das Trachten nach Ehre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέχεται
  choice: werden in Schranken gehalten
  rationale: Das Verb bezeichnet Widerstand beziehungsweise ein Entgegenhalten. Die Wendung gibt die Begrenzung der Leidenschaften wieder, ohne ihre Beseitigung auszusagen.
- source_word: τὰ τῶν ὀρέξεων πάθη
  choice: die Leidenschaften des Begehrens
  rationale: πάθη bezeichnet im ethischen Zusammenhang Leidenschaften oder Affekte; ὀρέξεις meint Begehren, Verlangen oder Triebe. Die bewusst geschichtete Formulierung bewahrt die moralpsychologische Sprache des Griechischen.
- source_word: τοῦ σώφρονος νοὸς
  choice: das besonnene Denken
  rationale: σώφρων verbindet Besonnenheit, Selbstbeherrschung und gesunden Sinn. νοῦς bezeichnet hier die denkende Einsicht; „besonnenes Denken“ klingt im Deutschen natürlich und erhält beide Aspekte.
- source_word: ἀνακαμπτόμενα
  choice: sie zurückweist
  rationale: Das Partizip vermittelt die bildhafte Vorstellung des Zurückbiegens oder Zurückwendens. „zurückweist“ gibt diese Gegenbewegung in natürlichem Deutsch wieder.
- source_word: φιλοτιμοῦνται
  choice: werden … zu ehrenvollem Streben angeleitet
  rationale: Das ungewöhnlich gebrauchte Verb bezeichnet gewöhnlich ehrgeiziges Bemühen, Eifer oder Streben nach Ehre. Die Übersetzung hält diesen Bedeutungsanteil sichtbar und berücksichtigt zugleich die Agensangabe „durch die Vernunft“.
- source_word: κινήματα
  choice: Regungen
  rationale: κινήματα kann Bewegungen, innere Regungen oder Impulse bezeichnen. „Regungen“ passt zum körperlich-seelischen Zusammenhang, ohne die Aussage auf rein mechanische Bewegungen zu beschränken.
- source_word: λογισμοῦ
  choice: Vernunft
  rationale: λογισμός bezeichnet vernünftiges Überlegen oder Urteil und ist ein Leitbegriff des Buches. „Vernunft“ ist knapp, verständlich und philosophisch angemessen.
theological_decisions:
- issue: Moralpsychologisches Verhältnis von Vernunft, Leidenschaften und körperlichen Regungen
  choice: Die Vernunft begrenzt und lenkt die Leidenschaften und körperlichen Regungen.
  alternative: Die Leidenschaften könnten ausdrücklich als sündig bezeichnet oder als völlig beseitigt dargestellt werden.
  rationale: Der griechische Text spricht in Begriffen hellenistisch-jüdischer Moralpsychologie von Beherrschung und Ausrichtung. Die Übersetzung fügt weder die Kategorie einer „sündigen Natur“ hinzu noch behauptet sie die Vernichtung körperlicher Regungen.
- issue: Mehrdeutigkeit von φιλοτιμοῦνται
  choice: Der Bezug auf Ehre und eifriges Streben bleibt im Haupttext erhalten.
  alternative: Kontextuell wäre auch die glattere Wiedergabe „werden von der Vernunft beherrscht“ möglich.
  rationale: Die glattere Alternative passt zum Gedankengang, verdeckt jedoch die auffällige Grundbedeutung des griechischen Verbs. Haupttext und Fußnote bewahren deshalb die echte lexikalische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der argumentativen Bewegung des Griechischen, wird aber durch eine klare aktive Formulierung im Partizipialsatz lesbar gehalten. „Leidenschaften“, „besonnenes Denken“ und „Vernunft“ bewahren den philosophisch-ethischen Ton.
