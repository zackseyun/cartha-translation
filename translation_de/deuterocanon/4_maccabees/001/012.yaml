  yaml_path: translation/deuterocanon/4_maccabees/001/012.yaml
  text: But even about this it will now be possible to speak at once[a], beginning with the subject, as I am accustomed to do, and thus I will turn to the discourse about them[b], giving glory to the all-wise God.
translation:
  language: de
  text: Doch auch darüber wird sich nun sogleich sprechen lassen[a], nachdem ich mit dem Thema begonnen habe, wie ich es gewöhnlich tue; so werde ich mich der Erörterung über sie[b] zuwenden und dem allweisen Gott die Ehre geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird es nun sogleich erlaubt sein, darüber zu sprechen«; ἐξέσται kann sowohl Möglichkeit als auch Erlaubnis ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: »Sie« kann sich auf die Personen beziehen, die im Folgenden behandelt werden; vom unmittelbaren Wortlaut her sind auch »diese Dinge« oder »diese Sachverhalte« möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Doch auch
  rationale: Bewahrt den weiterführenden Gegensatz und die leichte Hervorhebung, ohne den Übergang unnötig zu verschärfen.
- source_word: περὶ τούτου
  choice: darüber
  rationale: Natürliches modernes Deutsch mit bewusst offenem Rückbezug.
- source_word: νῦν αὐτίκα δή
  choice: nun sogleich
  rationale: Gibt die gehäufte Betonung der unmittelbaren Gegenwart knapp und würdig wieder.
- source_word: λέγειν ἐξέσται
  choice: wird sich … sprechen lassen
  rationale: Wahrt den Zukunftsbezug und gibt hier primär die Möglichkeit wieder; die ebenfalls mögliche Erlaubnisnuance wird in der Fußnote genannt.
- source_word: ἀρξαμένων τῆς ὑποθέσεως
  choice: nachdem ich mit der Darlegung des Themas begonnen habe
  rationale: Gibt die komprimierte Partizipialkonstruktion idiomatisch wieder. ὑπόθεσις bezeichnet hier das zur Erörterung gestellte Thema beziehungsweise dessen Darlegung.
- source_word: ὅπερ εἴωθα ποιεῖν
  choice: wie ich es gewöhnlich tue
  rationale: Bewahrt den Einschub über die übliche Vorgehensweise des Autors in natürlichem Deutsch.
- source_word: εἰς τὸν περὶ αὐτῶν τρέψομαι λόγον
  choice: Dann werde ich mich der Erörterung über sie zuwenden
  rationale: Spiegelt die rhetorische Wendung zu einem neuen Teil der Darlegung und wahrt den Zukunftsbezug.
- source_word: αὐτῶν
  choice: sie
  rationale: Lässt wie das Griechische offen, ob Personen oder die betreffenden Dinge beziehungsweise Sachverhalte gemeint sind.
- source_word: δόξαν διδοὺς
  choice: Ehre geben
  rationale: Ist eine natürliche deutsche Wiedergabe der doxologischen Wendung, ohne ihren religiösen Gehalt abzuschwächen.
- source_word: τῷ πανσόφῳ θεῷ
  choice: dem allweisen Gott
  rationale: Bewahrt das zusammengesetzte göttliche Epitheton prägnant und in gehobenem, aber verständlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des göttlichen Epithetons πανσόφῳ in der doxologischen Wendung
  choice: dem allweisen Gott
  alternative: dem vollkommen weisen Gott
  rationale: „Allweise“ bewahrt die umfassende Aussage des griechischen Epithetons und den doxologischen Ton, ohne eine konfessionelle Sonderdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rhetorischem Ton. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die referenzielle Mehrdeutigkeit von αὐτῶν und die Bedeutungsbreite von ἐξέσται bleiben durch Fußnoten erhalten.
