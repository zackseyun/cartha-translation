  text: But prudence is the most sovereign of all, and from it reason indeed gains mastery over the passions.
translation:
  language: de
  text: Die Besonnenheit aber ist von allen am mächtigsten; aus ihr gewinnt die Vernunft tatsächlich die Oberhand über die Leidenschaften.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυριωτάτη
  choice: die mächtigste
  rationale: Der Superlativ bezeichnet höchste Autorität beziehungsweise Herrschaft. „Die mächtigste“ bewahrt den Ranganspruch in natürlichem Deutsch, ohne die im Griechischen nur adjektivisch formulierte Aussage unnötig zur Herrscherinnenmetapher auszubauen.
- source_word: φρόνησις
  choice: Besonnenheit
  rationale: Das Wort bezeichnet praktische Einsicht und kluge Selbstführung. „Besonnenheit“ passt hier besonders zum ethischen Zusammenhang der Beherrschung von Leidenschaften.
- source_word: λογισμός
  choice: Vernunft
  rationale: Im Gedankengang des 4. Makkabäerbuchs bezeichnet der Ausdruck die vernünftige Urteils- und Lenkungsfähigkeit des Menschen.
- source_word: ἐπικρατεῖ
  choice: gewinnt … die Oberhand
  rationale: Die Wendung gibt das aktive Überwiegen und Beherrschen wieder und verbindet sich im Deutschen idiomatisch mit „über“.
- source_word: πάθη
  choice: Leidenschaften
  rationale: Gemeint sind starke innere Regungen beziehungsweise Affekte, über die die Vernunft Herrschaft ausübt; „Leidenschaften“ bewahrt die traditionelle ethische Spannung.
- source_word: ἐξ ἧς
  choice: aus ihr
  rationale: Die Formulierung wahrt ausdrücklich die im Griechischen bezeichnete Herkunft beziehungsweise Quelle, ohne den Zusammenhang als bloßes Mittel umzudeuten.
- source_word: δὴ
  choice: tatsächlich
  rationale: Das bestätigende Partikel wird hörbar wiedergegeben und unterstreicht die Folgerung des Satzes.
theological_decisions:
- issue: Verhältnis von Besonnenheit, Vernunft und Leidenschaften
  choice: Die Vernunft gewinnt „aus“ der Besonnenheit die Oberhand über die Leidenschaften.
  alternative: Die Vernunft beherrscht die Leidenschaften „durch“ Besonnenheit.
  rationale: „Aus ihr“ folgt ἐξ ἧς enger und lässt offen, ob Besonnenheit als Quelle, Grundlage oder hervorbringende Tugend gedacht ist; eine instrumentale Festlegung wird vermieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und sentenzartig; die philosophischen Leitbegriffe werden verständlich, aber nicht umschreibend wiedergegeben.
