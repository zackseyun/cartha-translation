  source_fidelity: 'Die Leitbegriffe sind im Wesentlichen treffend wiedergegeben: φρόνησις als „Besonnenheit“, λογισμός als „Vernunft“ und πάθη als „Leidenschaften“. „Aus ihr“ bildet ἐξ ἧς angemessen als Herkunfts- bzw. Begründungsbeziehung ab; „tatsächlich“ lässt δὴ hörbar werden. Für κυριωτάτη ist „die mächtigste von allen“ verständlich, doch die prädikative Superlativkonstruktion des Griechischen wird im Deutschen natürlicher und genauer mit „von allen am mächtigsten“ wiedergegeben.'
