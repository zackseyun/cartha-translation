  text: This[a], then, is the instruction of the law[b], by which we learn divine matters reverently and human matters profitably.
translation:
  language: de
  text: Dies also ist die Unterweisung des Gesetzes[a], durch die wir das Göttliche[b] ehrfürchtig und das Menschliche zu unserem Nutzen lernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Erziehung des Gesetzes“ oder „die Schulung des Gesetzes“. Das griechische παιδεία umfasst Unterweisung ebenso wie formende sittliche Erziehung.'
