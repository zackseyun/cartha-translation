  - marker: b
    text: 'Wörtlicher: „die göttlichen Dinge … die menschlichen Dinge“. Das Griechische stellt beide Bereiche als umfassende Kategorien gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη δὴ τοίνυν
  choice: Das also
  rationale: Die Partikelfolge ist nachdrücklich und überleitend. „Das also“ gibt diese Funktion in natürlichem modernem Deutsch knapp wieder.
- source_word: ἡ τοῦ νόμου παιδεία
  choice: die Unterweisung durch das Gesetz
  rationale: παιδεία bezeichnet nicht nur Wissensvermittlung, sondern auch formende Erziehung und Schulung. „Unterweisung“ passt zum lehrhaften Zusammenhang; „durch das Gesetz“ verdeutlicht in idiomatischem Deutsch, dass das Gesetz als Mittel beziehungsweise Träger dieser Bildung erscheint, ohne den Begriff auf bloße Gesetzeskunde zu verengen.
- source_word: διʼ ἧς
  choice: durch die
  rationale: Die Wendung bezeichnet das Mittel, durch das das Lernen geschieht, und nimmt grammatisch „Unterweisung“ auf.
- source_word: τὰ θεῖα
  choice: das Göttliche
  rationale: Der substantivierte Ausdruck bewahrt die breite Kategorie des griechischen Neutrum Plural, ohne sie enger als „die Dinge Gottes“ monotheistisch auszudeuten.
- source_word: σεμνῶς
  choice: ehrfürchtig
  rationale: Das Adverb verbindet Würde, Ernst und religiöse Scheu. „Ehrfürchtig“ ist im Zusammenhang mit dem Göttlichen natürlich und präzise.
- source_word: τὰ ἀνθρώπινα
  choice: das Menschliche
  rationale: Die Formulierung erhält den umfassenden Gegensatz zum Göttlichen und vermeidet eine Verengung auf einzelne menschliche Angelegenheiten.
- source_word: συμφερόντως
  choice: zu unserem Nutzen
  rationale: Das Wort bezeichnet eine nützliche, förderliche oder vorteilhafte Weise. Die adverbiale Wendung klingt im Deutschen natürlicher als „nutzbringend“ und bringt den praktischen Nutzen zum Ausdruck.
- source_word: μανθάνομεν
  choice: wir ... kennenlernen
  rationale: μανθάνω kann das Lernen oder das Erlangen von Kenntnis bezeichnen. „Kennenlernen“ ermöglicht es, die beiden Akkusativobjekte und die unterschiedlichen modalen Bestimmungen in einem natürlichen deutschen Satz beizubehalten.
theological_decisions:
- issue: Bedeutung von νόμος im Kontext
  choice: das Gesetz
  alternative: die Tora
  rationale: Im Zusammenhang von 4 Makkabäer ist das jüdische Gesetz beziehungsweise die Tora gemeint. „Das Gesetz“ hält sich jedoch enger an νόμος und vermeidet eine interpretierende terminologische Festlegung.
- issue: Umfang von τὰ θεῖα und τὰ ἀνθρώπινα
  choice: das Göttliche und das Menschliche
  alternative: die göttlichen Dinge und die menschlichen Angelegenheiten
  rationale: Die substantivierten neutralen Formen bezeichnen umfassende Bereiche. Die gewählte Fassung bewahrt diese Weite und den rhetorischen Gegensatz, ohne zusätzliche theologische Einzelbestimmungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wahrt den lehrhaften Ton und die parallele Gegenüberstellung des Göttlichen und Menschlichen; schwerfällige oder altertümliche Wörter wie „ersprießlich“ wurden vermieden.
