  yaml_path: translation/deuterocanon/4_maccabees/001/018.yaml
  text: And the forms of wisdom are prudence and justice and courage and self-control[a].
translation:
  language: de
  text: Die Formen der Weisheit aber sind Klugheit, Gerechtigkeit[a], Mut und Selbstbeherrschung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Rechtschaffenheit« (δικαιοσύνη). Da das Wort hier in einer Tugendliste steht, ist »Gerechtigkeit« vorzuziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴδεα
  choice: Formen
  rationale: Das Wort bezeichnet hier die Formen oder Arten, in denen Weisheit Gestalt annimmt. »Formen« bleibt nah am Griechischen, ohne die Beziehung der vier Tugenden zur Weisheit stärker auszudeuten.
- source_word: καθεστᾶσιν
  choice: sind
  rationale: Das Verb hat in dieser Aufzählung kopulative Kraft und bezeichnet eine bestehende Zuordnung. Das schlichte »sind« gibt dies im Deutschen idiomatisch wieder.
- source_word: φρόνησις
  choice: Klugheit
  rationale: In einem philosophischen Tugendkatalog bezeichnet φρόνησις die Fähigkeit zu vernünftigem, praktischem Urteil. »Klugheit« ist dafür der traditionelle und zugleich verständliche deutsche Tugendbegriff.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: Im unmittelbaren Zusammenhang steht das Wort in einer philosophisch-ethischen Tugendliste. Daher trifft »Gerechtigkeit« die Bedeutung hier besser als das ebenfalls mögliche »Rechtschaffenheit«.
- source_word: ἀνδρία
  choice: Mut
  rationale: Gemeint ist die Tugend des mutigen und standhaften Handelns. »Mut« ist gegenwärtiges, allgemein verständliches Deutsch; eine etymologisierende Wiedergabe wie »Mannhaftigkeit« wäre irreführend.
- source_word: σωφροσύνη
  choice: Selbstbeherrschung
  rationale: Der Begriff bezeichnet in diesem Tugendzusammenhang maßvolle, vernünftig gelenkte Selbstkontrolle. »Selbstbeherrschung« ist im modernen Deutsch klarer als das traditionell-philosophische, aber mehrdeutige »Mäßigung«.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη in einer philosophischen Tugendliste
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der Kontext ist der Katalog der vier klassischen Tugenden, nicht ausdrücklich ein bundestheologischer oder soteriologischer Zusammenhang. »Gerechtigkeit« wahrt diese ethisch-philosophische Bedeutung; die mögliche biblische Wiedergabe »Rechtschaffenheit« wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung bleibt nah an der knappen griechischen Aussage; »aber« bildet δέ ab, ohne einen stärkeren Gegensatz einzutragen.
