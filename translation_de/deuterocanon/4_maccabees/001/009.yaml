    text: 'Wörtlich: »alle diese«; gemeint sind die zuvor genannten Personen.'
    reason: referent_clarification
  - marker: b
    text: 'Oder: »dass das vernünftige Urteil über die Leidenschaften herrscht.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅπαντες ... οὗτοι
  choice: sie alle
  rationale: Gibt die Gesamtheit der zuvor genannten Personen natürlich wieder; der Rückbezug von οὗτοι wird im Deutschen durch „sie“ ausgedrückt.
- source_word: τὸν ἕως θανάτου πόνον
  choice: den Schmerz bis hin zum Tod
  rationale: Bewahrt die Steigerung bis zum äußersten Punkt, dem Tod, ohne den Märtyrerkontext ausdrücklich in den Wortlaut einzutragen.
- source_word: ὑπεριδόντες
  choice: achteten ... gering
  rationale: Gibt das verächtliche Beiseitesetzen beziehungsweise Geringschätzen wieder und klingt im modernen Deutschen natürlicher als eine wörtliche Blickmetapher.
- source_word: ἐπεδείξαντο
  choice: zeigten damit
  rationale: Drückt den Beweischarakter ihres Handelns aus; „damit“ macht den Zusammenhang mit dem vorausgehenden Partizip deutlich.
- source_word: περικρατεῖ
  choice: herrscht über
  rationale: Bewahrt den starken Gedanken überlegener Macht und entspricht dem programmatischen Sprachgebrauch des Buches.
- source_word: τῶν παθῶν
  choice: die Leidenschaften
  rationale: Erhält den philosophisch-ethischen Sinn irrationaler Regungen und Begierden besser als das allgemeinere „Gefühle“.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: Gibt den zentralen Begriff für vernünftiges, abwägendes Denken knapp wieder, ohne ihn mit späteren theologischen Kategorien gleichzusetzen.
theological_decisions:
- issue: Wiedergabe von ὁ λογισμός als philosophischem Leitbegriff
  choice: die Vernunft
  alternative: das vernünftige Urteil
  rationale: „Vernunft“ bewahrt die philosophische These des Verses; die alternative Wiedergabe verdeutlicht den aktiven, urteilenden Aspekt und wird in einer Fußnote genannt.
- issue: Explizierung des Märtyrertodes in ἕως θανάτου πόνον
  choice: den Schmerz bis hin zum Tod
  alternative: den tödlichen Schmerz
  rationale: Die Übersetzung wahrt die im Griechischen formulierte Reichweite des Schmerzes, statt den Kontext als ausdrückliche Deutung in den Haupttext einzutragen.
