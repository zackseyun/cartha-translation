  yaml_path: translation/deuterocanon/4_maccabees/001/009.yaml
  text: For all these[a], having disregarded the pain even unto death[b], demonstrated that reason rules over the passions.
translation:
  language: de
  text: Denn alle diese[a] achteten den Schmerz bis hin zum Tod gering und zeigten damit, dass die Vernunft[b] die Leidenschaften beherrscht.
  philosophy: optimal-equivalence
  footnotes:
