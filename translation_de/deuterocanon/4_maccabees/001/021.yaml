translation:
  language: de
  text: Auch im Blick auf Lust und Schmerz gibt es seit alters bestehende Abfolgen von Leidenschaften.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch hinsichtlich Lust und Schmerz gibt es seit alters bestehende Reihen von Leidenschaften.“'
    reason: Lexikalische Alternative für περί und ἀκολουθίαι; „Reihen“ gibt den Zusammenhang etwas weniger stark als geordnete Abfolge wieder.
lexical_decisions:
- source_word: παλαιαὶ
  choice: seit alters bestehende
  rationale: Die Wendung gibt den alten beziehungsweise seit Langem bestehenden Charakter dieser Abfolgen natürlich wieder, ohne lediglich das missverständliche „alte“ zu verwenden.
- source_word: περὶ τὴν ἡδονὴν καὶ τὸν πόνον
  choice: im Blick auf Lust und Schmerz
  rationale: περί mit Akkusativ bezeichnet hier den Bezugsbereich. „Im Blick auf“ ist würdig und bewahrt diese offene Beziehung, ohne eine stärkere Kausalität einzutragen.
- source_word: παθῶν
  choice: von Leidenschaften
  rationale: Im philosophischen Zusammenhang bezeichnet πάθη affektive Regungen oder Triebe, die der Vernunft unterstellt werden sollen. „Leidenschaften“ erhält diese fachsprachliche Nuance besser als das heute weiter gefasste „Gefühle“.
- source_word: ἀκολουθίαι
  choice: Abfolgen
  rationale: Das Substantiv bezeichnet ein Aufeinanderfolgen beziehungsweise eine geordnete Folge. „Abfolgen“ bewahrt diesen Sinn, ohne wie „Folgen“ eindeutig eine kausale Konsequenz anzudeuten.
theological_decisions:
- issue: Philosophisch-anthropologische Bedeutung von πάθη
  choice: Leidenschaften
  alternative: Gefühlsregungen
  rationale: Der Text spricht im Rahmen hellenistisch-philosophischer Anthropologie von Regungen, über die die Vernunft herrschen soll. „Leidenschaften“ erhält diesen Zusammenhang, ohne sämtliche Gefühle pauschal als vernunftwidrig zu kennzeichnen.
- issue: Art der Beziehung zwischen Lust, Schmerz und den Leidenschaften
  choice: im Blick auf
  alternative: im Bereich von
  rationale: Die Formulierung lässt wie das griechische περί offen, ob Lust und Schmerz Gegenstand, Bezugsbereich oder Anlass der Leidenschaften sind, statt diese Beziehung dogmatisch oder psychologisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas philosophische Ausdrucksweise des griechischen Textes bleibt erkennbar; unnötig technische oder konfessionell geprägte Begriffe werden vermieden.
