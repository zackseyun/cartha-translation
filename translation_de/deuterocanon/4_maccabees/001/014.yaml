base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/014.yaml
  text: But let us determine what reason is[a], and what passion is, and how many kinds of passions there are[c][b], and whether reason rules over all these.
translation:
  language: de
  text: Klären wir nun[a], was Vernunft[b] ist und was Leidenschaft[c] ist, wie viele Arten von Leidenschaften es gibt und ob die Vernunft über alle diese Leidenschaften herrscht[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unterscheiden wir nun“ beziehungsweise „Untersuchen wir nun“. Das griechische Verb kann sowohl das Trennen von Begriffen als auch ihr genaues Bestimmen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vernünftiges Denken“ beziehungsweise „vernünftiges Urteilen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Regung“ beziehungsweise „Affekt“. Das griechische Wort bezeichnet hier einen affektiven Antrieb, nicht das Erleiden von Schmerz.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „über alle diese Leidenschaften die Oberhand behält“ beziehungsweise „alle diese Leidenschaften beherrscht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρίνωμεν
  choice: Klären wir
  rationale: Der auffordernde Konjunktiv lädt zu einer gemeinsamen Untersuchung ein. „Klären“ umfasst hier sowohl das begriffliche Unterscheiden als auch das nähere Bestimmen.
- source_word: λογισμός
  choice: Vernunft
  rationale: Im argumentativen Zusammenhang bezeichnet das Wort das Vermögen vernünftigen Urteilens. „Vernunft“ ist im Deutschen prägnant und bewahrt den philosophischen Gegensatz zu πάθος.
- source_word: πάθος
  choice: Leidenschaft
  rationale: Gemeint ist hier nicht Leiden, sondern eine affektive Regung oder ein innerer Antrieb. „Leidenschaft“ erhält den philosophisch-ethischen Klang und den Gegensatz zur Vernunft.
- source_word: πόσα παθῶν εἰδέα
  choice: wie viele Arten von Leidenschaften
  rationale: εἰδέα bezeichnet hier Arten oder Formen; die Formulierung gibt den klassifizierenden Sinn klar und idiomatisch wieder.
- source_word: ἐπικρατεῖ
  choice: herrscht über
  rationale: Das Verb bezeichnet Überlegenheit oder Herrschaft. „Über … herrscht“ bewahrt das Herrschaftsbild, ohne den Sinn auf bloße Kontrolle zu verengen.
- source_word: τούτων
  choice: sie alle
  rationale: Das Pronomen verweist auf die zuvor genannten Arten von Leidenschaften; „sie alle“ gibt diesen Rückbezug im Deutschen natürlich wieder.
theological_decisions:
- issue: Der philosophische Gegensatz zwischen λογισμός und πάθος
  choice: Vernunft … Leidenschaft
  alternative: vernünftiges Urteilen … Regung
  rationale: Das Begriffspaar bewahrt die programmatische Spannung des Buches zwischen rationalem Urteilsvermögen und affektiven Antrieben, ohne diese durch moderne psychologische Fachsprache oder konfessionelle Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer philosophischer Begrifflichkeit. Der Satzbau folgt der schrittweisen Fragestellung des Griechischen; „Klären wir nun“ gibt den gemeinschaftlich auffordernden Ton wieder.
