  text: Against the soul are arrogance and love of money and love of honor and contentiousness and envy;[a]
translation:
  language: de
  text: Gegen die Seele richten sich Überheblichkeit, Geldgier, Geltungssucht, Streitsucht und Neid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »böser Blick«; βασκανία kann neidische oder böswillige Missgunst bezeichnen, der eine schädigende Wirkung zugeschrieben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ … ψυχῆς
  choice: Gegen die Seele richten sich
  rationale: κατά mit dem Genitiv hat hier eine gegen die Seele gerichtete, nachteilige Bedeutung. Die verbale Fassung ergibt im Deutschen einen natürlichen vollständigen Satz, ohne die adversative Aussage abzuschwächen.
- source_word: ἀλαζονία
  choice: Überheblichkeit
  rationale: Das Wort bezeichnet prahlerische Selbstüberschätzung beziehungsweise anmaßenden Hochmut. „Überheblichkeit“ ist gegenwärtig, verständlich und eindeutig negativ.
- source_word: φιλαργυρία
  choice: Geldgier
  rationale: Der Ausdruck bedeutet wörtlich Liebe zum Silber beziehungsweise Geld. „Geldgier“ gibt das bezeichnete Laster im modernen Deutschen klar und idiomatisch wieder.
- source_word: φιλοδοξία
  choice: Geltungssucht
  rationale: Gemeint ist das Verlangen nach Ansehen, Ehre oder Ruhm. „Geltungssucht“ bewahrt den negativen Sinn des Lasterkatalogs und vermeidet das möglicherweise neutrale „Ehrgeiz“.
- source_word: φιλονεικία
  choice: Streitsucht
  rationale: Das Wort bezeichnet eine ausgeprägte Neigung zu Streit und Rivalität. „Streitsucht“ ist knapp, natürlich und moralisch eindeutig.
- source_word: βασκανία
  choice: Neid
  rationale: In einem Lasterkatalog ist „Neid“ die klarste Wiedergabe. Die mögliche kulturelle Nebenbedeutung des missgünstigen oder schädigenden „bösen Blicks“ bleibt in der Fußnote erhalten.
