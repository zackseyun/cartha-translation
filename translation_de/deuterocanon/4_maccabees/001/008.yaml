base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/008.yaml
  text: But I could prove this far more from the courage of Eleazar, the seven brothers, and their mother, who died for the sake of virtue.
translation:
  language: de
  text: 'Noch viel mehr könnte ich dies jedoch durch die Tapferkeit derer beweisen, die für die Tugend starben: Eleasar, die sieben Brüder und ihre Mutter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολὺ δὲ πλέον
  choice: Noch viel deutlicher jedoch
  rationale: Gibt die steigernde Aussage und den weiterführenden Gegensatz natürlich wieder, ohne die Stärke des griechischen Ausdrucks abzuschwächen.
- source_word: ἀποδείξαιμι
  choice: könnte ich … beweisen
  rationale: Bewahrt den Potentialis des Aoristoptativs und den argumentativen Charakter der Darlegung.
- source_word: ἀνδραγαθείας
  choice: Tapferkeit
  rationale: Bezeichnet hier den heldenhaften Mut beziehungsweise die bewährte Standhaftigkeit der Märtyrer; „Tapferkeit“ ist im modernen Deutsch prägnant und kontextgerecht.
- source_word: ὑπὲρ ἀρετῆς
  choice: für die Tugend
  rationale: Bewahrt den zentralen philosophischen Begriff ἀρετή und dessen Zweck- beziehungsweise Hingabebeziehung zum Sterben.
- source_word: Ἐλεαζάρου τε καὶ ἑπτὰ ἀδελφῶν καὶ τῆς τούτων μητρός
  choice: Eleasar, die sieben Brüder und ihre Mutter
  rationale: Gibt die drei Genitivglieder als Apposition zu „derer“ klar und idiomatisch wieder; „ihre Mutter“ entspricht τῆς τούτων μητρός.
theological_decisions:
- issue: Bedeutung von ἀρετή
  choice: Tugend
  alternative: das Gute / sittliche Vollkommenheit
  rationale: Der philosophisch-ethische Leitbegriff soll nicht konfessionell oder interpretierend verengt werden; „Tugend“ erhält die im Werk maßgebliche Begrifflichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau macht den Bezug von „die für die Tugend starben“ auf Eleasar, die sieben Brüder und ihre Mutter eindeutig, während der argumentative und philosophische Ton des griechischen Textes erhalten bleibt.
