  text: Selbstbeherrschung ist demnach die Herrschaft über die Begierden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνη
  choice: Selbstbeherrschung
  rationale: Im Zusammenhang wird eine Tugend als Herrschaft über Begierden definiert. „Selbstbeherrschung“ gibt diesen praktisch-ethischen Sinn im heutigen Deutsch klar wieder; „Besonnenheit“ wäre weiter und könnte den hier hervorgehobenen Aspekt der Triebkontrolle abschwächen.
- source_word: δὴ τοίνυν
  choice: demnach
  rationale: Die Partikelverbindung kennzeichnet einen folgernden Übergang mit leichter Bekräftigung. „Demnach“ bildet diese Funktion natürlich und knapp ab.
- source_word: ἐστὶν
  choice: ist
  rationale: Die einfache Kopula wird in der definitorischen Aussage direkt wiedergegeben.
- source_word: ἐπικράτεια
  choice: Herrschaft
  rationale: Das Wort bezeichnet Überlegenheit beziehungsweise wirksame Kontrolle. „Herrschaft“ bewahrt die kräftige Vorstellung des Herrwerdens über etwas besser als das flachere „Kontrolle“.
- source_word: τῶν ἐπιθυμιῶν
  choice: über die Begierden
  rationale: ἐπιθυμίαι bezeichnet hier im allgemeinen ethischen Sinn Begehren oder Begierden. „Begierden“ passt zur Tugendlehre, ohne den Ausdruck auf sexuelle Lust zu beschränken; „über“ gibt das Verhältnis zu ἐπικράτεια idiomatisch wieder.
