translation:
  language: de
  text: 'Im Hinblick auf den Körper aber: das Essen von allem, Völlerei und Essen für sich allein.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Essen nur einer Art von Speise« beziehungsweise »einseitige Ernährung«. Das griechische Wort μονοφαγία kann aufgrund seiner Wortbestandteile auch so verstanden werden; im Zusammenhang dieses Lasterkatalogs lässt es sich jedoch auch als Essen für sich allein auffassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ σῶμα
  choice: Im Blick auf den Körper aber
  rationale: κατά mit Akkusativ bezeichnet hier den Bereich, dem die folgenden Laster zugeordnet werden. Die Formulierung ist natürlich und bewahrt mit „aber“ die weiterführend-kontrastive Funktion von δέ.
- source_word: παντοφαγία
  choice: wahlloses Essen
  rationale: Das Wort bezeichnet das Essen von allem bzw. jeder Art von Speise. „Wahlloses Essen“ gibt den negativen Sinn im Lasterkatalog verständlicher wieder als das im Deutschen anders konnotierte „Allesfresserei“.
- source_word: λαμαργία
  choice: Völlerei
  rationale: Der Ausdruck bezeichnet gieriges oder übermäßiges Essen; „Völlerei“ ist dafür der geläufige deutsche Lasterbegriff.
- source_word: μονοφαγία
  choice: Essen für sich allein
  rationale: Im ethischen Zusammenhang ist wahrscheinlich das ungesellige Essen allein gemeint. Die Formulierung wahrt den Bezug auf das Essen und klingt im Deutschen natürlicher als ein abstraktes Kompositum.
theological_decisions:
- issue: Bedeutung von μονοφαγία
  choice: Essen für sich allein
  alternative: Essen nur einer Art von Speise / einseitige Ernährung
  rationale: Der Kontext eines Lasterkatalogs stützt die Deutung als ungeselliges Essen für sich allein; aufgrund der Bestandteile des griechischen Wortes bleibt jedoch auch die Bedeutung „Essen nur einer Art von Speise“ möglich. Diese echte lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Moderner, würdiger Standardwortschatz. Die knappe Reihung mit Doppelpunkten erhält den Charakter eines Lasterkatalogs; „wahlloses Essen“ vermeidet ein missverständliches zoologisches oder grobsprachliches „Allesfresserei“.
