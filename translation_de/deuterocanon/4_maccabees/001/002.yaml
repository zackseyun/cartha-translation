base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/002.yaml
  text: For the discourse is indeed necessary for understanding[b][a], and it contains praise of the greatest virtue—I mean prudence.
translation:
  language: de
  text: Denn diese Erörterung ist für die Erkenntnis notwendig[a] und der größten Tugend würdig – ich meine der Klugheit[b] –; sie enthält deren Lob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das Verständnis“ beziehungsweise „für das Wissen“. Das griechische εἰς ἐπιστήμην lässt diese Wiedergaben zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „praktische Weisheit“. Das griechische φρόνησις bezeichnet eine vernünftige, sittlich ausgerichtete Urteilskraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖος
  choice: notwendig
  rationale: Das Wort bezeichnet Notwendigkeit, nicht bloß Nutzen; „notwendig“ bewahrt diese Aussagekraft in natürlichem Deutsch.
- source_word: εἰς ἐπιστήμην
  choice: um Erkenntnis zu gewinnen
  rationale: ἐπιστήμη bezeichnet hier ein begründetes Wissen beziehungsweise Erkenntnis. Die finale Formulierung gibt die Zielrichtung von εἰς idiomatisch wieder.
- source_word: λόγος
  choice: Erörterung
  rationale: Gemeint ist die zusammenhängende, argumentierende Darlegung des Verfassers, nicht ein einzelnes Wort. „Erörterung“ passt zum philosophisch-rhetorischen Zusammenhang.
- source_word: τῆς μεγίστης ἀρετῆς
  choice: der größten Tugend
  rationale: ἀρετή bezeichnet im hellenistischen Moraldiskurs Tugend beziehungsweise sittliche Vortrefflichkeit; „Tugend“ ist hier die direkte und verständliche Entsprechung.
- source_word: φρονήσεως
  choice: Klugheit
  rationale: φρόνησις meint vernünftige, sittlich ausgerichtete Urteilskraft. „Klugheit“ ist dafür der etablierte deutsche Begriff in der Tugendlehre; eine Fußnote nennt die verdeutlichende Alternative „praktische Weisheit“.
- source_word: περιέχει ἔπαινον
  choice: enthält ein Lob
  rationale: Die Wendung besagt, dass die Erörterung eine Würdigung der genannten Tugend einschließt. „Enthält ein Lob“ ist klar, idiomatisch und quellennah.
theological_decisions:
- issue: Philosophische Tugendbegriffe ohne spätere konfessionelle Festlegung wiedergeben
  choice: „Tugend“ und „Klugheit“ in ihrem moralphilosophischen Sinn
  alternative: „Vortrefflichkeit“ und „praktische Weisheit“
  rationale: Der Vers steht in einem philosophischen Eröffnungszusammenhang. Die gewählten Begriffe bewahren diese Begriffswelt, ohne spätere lehrmäßige Kategorien einzutragen.
- issue: Syntaktisches Verhältnis von ἄξιος, ἀρετή und περιέχει ἔπαινον
  choice: 'Sinngemäß: Die Erörterung enthält ein Lob der größten Tugend'
  alternative: 'Wörtlicher: Die Erörterung ist der größten Tugend würdig und enthält Lob'
  rationale: Die streng wörtliche Wiedergabe wäre im Deutschen syntaktisch schwer verständlich. Die gewählte Fassung folgt dem erkennbaren Aussageziel, ohne die Tugend näher zu bestimmen als der griechische Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erörterung“ hält den philosophisch-rhetorischen Ton aufrecht, während die finale Formulierung „um Erkenntnis zu gewinnen“ die griechische Zielangabe für heutige Leser natürlich ausdrückt. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
