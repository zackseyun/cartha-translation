- from: 'Bei jeder von ihnen zähmt die in jeder Hinsicht wirksame Vernunft[a] den Stoff, aus dem Charakterzüge und Leidenschaften bestehen: Sie reinigt ihn gründlich, schneidet Überflüssiges weg, verflicht und richtet ihn auf und gestaltet ihn auf jede Weise um.[b]'
  to: 'Bei jeder von ihnen zähmt die in jeder Hinsicht wirksame Vernunft[a] den Rohstoff, aus dem Charakterzüge und Leidenschaften bestehen: Sie reinigt ihn gründlich, schneidet Überflüssiges weg, verflicht ihn, bewässert ihn und gestaltet ihn auf jede Weise um.[b]'
