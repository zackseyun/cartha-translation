  naturalness: Der Doppelpunkt und die anschließende Ausführung sind modernes, gut lesbares Standarddeutsch. Die Wiederaufnahme durch „sie“ macht klar, dass die Vernunft den metaphorischen Stoff bearbeitet. „Rohstoff“ ist als Kollektivsingular im Deutschen natürlich und bewahrt die Materie-Metapher.
