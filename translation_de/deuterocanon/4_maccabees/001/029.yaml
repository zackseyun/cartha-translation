base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/029.yaml
  text: Each of these the all-working reason[a], thoroughly purifying and pruning and entwining and raising up and transforming in every way[b], tames the raw materials of character and passions.
translation:
  language: de
  text: 'Bei jeder von ihnen zähmt die in jeder Hinsicht wirksame Vernunft[a] den Rohstoff, aus dem Charakterzüge und Leidenschaften bestehen: Sie reinigt ihn gründlich, schneidet Überflüssiges weg, verflicht ihn, bewässert ihn und gestaltet ihn auf jede Weise um.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die allwirksame Vernunft“. Das seltene griechische Eigenschaftswort hebt hervor, dass die Vernunft auf jede Weise wirksam ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische reiht mehrere Bilder handwerklicher oder kultivierender Arbeit aneinander: reinigen, wegschneiden, verflechten, bewässern und umgestalten. So wird die Vernunft als eine Kraft dargestellt, die den inneren Stoff des Menschen formt.'
    reason: cultural_note
lexical_decisions:
- source_word: ὧν ἕκαστος
  choice: bei jeder von ihnen
  rationale: Die Wendung greift distributiv auf die zuvor genannten Größen zurück. Die thematische Fassung vermeidet im Deutschen eine irreführende Zuordnung als Subjekt oder direktes Objekt.
- source_word: ὁ πανεγώργος λογισμός
  choice: die in jeder Hinsicht wirksame Vernunft
  rationale: λογισμός bezeichnet hier die vernünftige, die Leidenschaften lenkende Urteilskraft. Das seltene πανεγώργος betont ihre umfassende Wirksamkeit; die Umschreibung bewahrt diesen ungewöhnlichen aktiven Sinn in natürlichem Deutsch.
- source_word: περικαθαίρων
  choice: gründlich reinigt
  rationale: Die Wiedergabe bringt die durch περι- verstärkte, umfassende Reinigung zum Ausdruck.
- source_word: ἀποκνίζων
  choice: Überflüssiges wegschneidet
  rationale: Das seltene Verb bezeichnet ein Abschaben, Beschneiden oder Wegnehmen; die Formulierung wahrt das Bild einer gezielten formenden Entfernung.
- source_word: περιπλέκων
  choice: verflicht
  rationale: Die Wahl erhält das Bild des Windens oder Ineinanderflechtens.
- source_word: ἐπάρδων
  choice: aufrichtet
  rationale: Die Wiedergabe bewahrt die aufwärts gerichtete, formende Bewegung, ohne das Verb unnötig zu vergeistigen.
- source_word: πάντα τρόπον μεταχέων
  choice: auf jede Weise umgestaltet
  rationale: Die Formulierung gibt sowohl die umfassende Art und Weise als auch das Bild tiefgreifender Umformung wieder.
- source_word: ἐξημεροῖ
  choice: zähmt
  rationale: Das Verb bedeutet, etwas zahm, sanft oder kultiviert zu machen; „zähmt“ passt zur Beherrschung ungeordneter innerer Regungen.
- source_word: τὰς τῶν ἠθῶν καὶ παθῶν ὕλας
  choice: den Stoff, aus dem Charakterzüge und Leidenschaften bestehen
  rationale: ὕλη bezeichnet Material oder Rohstoff. Die singularische deutsche Kollektivform wahrt das Stoffbild; ἤθη sind charakterliche beziehungsweise sittliche Dispositionen, πάθη affektive Regungen.
theological_decisions:
- issue: Wiedergabe von λογισμός im philosophisch-theologischen Gedankengang des 4. Makkabäerbuches
  choice: Vernunft
  alternative: vernünftiges Urteil; vernünftiger Sinn
  rationale: „Vernunft“ ist knapp und verständlich und bewahrt die zentrale Aussage des Buches, dass diese Fähigkeit die Leidenschaften gemäß der Frömmigkeit lenkt, ohne spätere Fachsysteme einzutragen.
- issue: Wiedergabe von πάθη
  choice: Leidenschaften
  alternative: Gefühle; Regungen; Leiden
  rationale: Gemeint sind hier innere Affekte und Antriebe, die der vernünftigen Leitung unterliegen, nicht äußere Leiden. „Leidenschaften“ wahrt den ethisch-philosophischen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Stoff- und Handwerksmetaphorik bleibt sichtbar, wird aber durch einen Doppelpunkt und zwei Sätze syntaktisch zugänglich gemacht. „Bei jeder von ihnen“ wahrt den rückbezüglichen und distributiven Charakter des mehrdeutigen griechischen Satzanfangs.
