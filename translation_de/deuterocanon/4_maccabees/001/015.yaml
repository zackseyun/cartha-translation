  text: Therefore[a], reason is a mind that, with right living, gives preference to the word of wisdom.
translation:
  language: de
  text: Also ist die Vernunft ein Verstand, der bei rechter Lebensführung dem Wort der Weisheit[a] den Vorzug gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Grundsatz der Weisheit“ oder „der Rede der Weisheit“. Das griechische λόγος kann „Wort“, „Rede“, „Darlegung“ oder „Grundsatz“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμός
  choice: Vernunft
  rationale: Der Begriff bezeichnet hier die Fähigkeit vernünftigen Abwägens, die der Verfasser anschließend definiert. „Vernunft“ ist im Deutschen knapp, natürlich und philosophisch angemessen.
- source_word: νοῦς
  choice: Denken
  rationale: νοῦς bezeichnet das geistige Vermögen. „Denken“ vermeidet hier die schwer verständliche Formulierung „ein Verstand“ und bewahrt zugleich die Unterscheidung von λογισμός; möglich wären auch „Geist“ oder „Verstand“.
- source_word: μετὰ ὀρθοῦ βίου
  choice: zusammen mit einer rechten Lebensführung
  rationale: Die Wendung verbindet das geistige Vermögen mit einer sittlich richtigen Lebensweise. „Lebensführung“ gibt den gelebten, ethischen Sinn von βίος präziser wieder als bloßes „Verhalten“.
- source_word: προτιμῶν
  choice: den Vorzug gibt
  rationale: Das Partizip drückt eine aktive Bevorzugung aus. Die deutsche Wendung bildet diese vergleichende Bedeutung idiomatisch ab.
- source_word: τὸν σοφίας λόγον
  choice: dem Wort der Weisheit
  rationale: Die Formulierung hält die Genitivkonstruktion und die Bedeutungsbreite von λόγος offen, statt sie vorschnell auf „Lehre“, „Grundsatz“ oder „Rede“ festzulegen.
theological_decisions:
- issue: Die ethisch-philosophische Definition wiedergeben, ohne λόγος zu stark zu systematisieren
  choice: dem Wort der Weisheit
  alternative: dem Grundsatz der Weisheit; der Rede der Weisheit; der Lehre der Weisheit
  rationale: λόγος kann Wort, Rede, Darlegung oder Grundsatz bedeuten. Die gewählte Fassung bewahrt diese Offenheit und vermeidet es, dem Ausdruck eine spätere technische oder konfessionelle Bedeutung aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht philosophischem Ton. Die Satzform bleibt definitorisch und nah am griechischen Aufbau, wird aber durch „Lebensführung“ und „den Vorzug gibt“ idiomatisch gestaltet.
