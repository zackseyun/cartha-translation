base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/020.yaml
  text: The two most comprehensive kinds of passions are pleasure and pain[a]; and each of these is by nature also connected with the soul.
translation:
  language: de
  text: Die beiden umfassendsten Arten der Leidenschaften sind Lust und Schmerz[a]; und jede von ihnen ist ihrer Natur nach auch auf die Seele bezogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die beiden umfassendsten Naturen der Leidenschaften sind Lust und Schmerz.“ Die griechische Formulierung ist gedrängt; φύσεις kann formaler mit „Naturen“ statt mit „Arten“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παθῶν
  choice: der Leidenschaften
  rationale: Im philosophisch-ethischen Zusammenhang bezeichnet πάθος affektive Regungen oder Leidenschaften, nicht lediglich Leiden.
- source_word: φύσεις
  choice: Arten
  rationale: Obwohl φύσεις wörtlich „Naturen“ bedeutet, dient es hier der Einteilung der Leidenschaften; „Arten“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: περιεκτικώταται
  choice: umfassendsten
  rationale: Der Superlativ bezeichnet die weitesten, andere Regungen einschließenden Kategorien.
- source_word: ἡδονή
  choice: Lust
  rationale: „Lust“ ist in ethisch-philosophischer Sprache die prägnante deutsche Entsprechung und bildet den Gegensatz zu „Schmerz“.
- source_word: πόνος
  choice: Schmerz
  rationale: Im Gegensatz zu ἡδονή bezeichnet πόνος hier Schmerz, nicht Mühe oder Arbeit.
- source_word: ἑκάτερον
  choice: beide
  rationale: Das distributive ἑκάτερον bezieht sich auf Lust und Schmerz; „beide“ ist im Deutschen idiomatisch, ohne den Bezug zu verändern.
- source_word: περὶ τὴν ψυχὴν
  choice: mit der Seele in Beziehung
  rationale: Die Wendung bezeichnet einen Bezug zur Seele; eine räumlich-wörtliche Wiedergabe wie „um die Seele“ wäre missverständlich.
- source_word: πέφυκεν
  choice: stehen ihrer Natur nach
  rationale: Das Perfekt von φύω drückt eine naturgegebene, inhärente Beschaffenheit aus.
theological_decisions:
- issue: Anthropologischer Begriff ψυχή
  choice: Seele
  alternative: Leben; Selbst
  rationale: Im philosophisch-anthropologischen Zusammenhang ist die innere Lebens- und Empfindungsdimension gemeint; „Seele“ bewahrt den traditionellen Begriff, ohne ihn dogmatisch näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die philosophischen Schlüsselbegriffe werden klar und möglichst quellennah wiedergegeben; die gedrängte griechische Konstruktion wird leicht geglättet. Die Fußnotenmarkierung [a] erscheint im Haupttext.
