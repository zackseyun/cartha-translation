  source_fidelity: Der erste Satz gibt παθῶν ... φύσεις ... δύο, ἡδονή τε καὶ πόνος sachgerecht wieder. Im zweiten Satz sollte das distributive Singular ἑκάτερον deutlicher abgebildet werden. „auf die Seele bezogen“ gibt περὶ τὴν ψυχήν in diesem philosophischen Kontext natürlich und ohne räumliche Fehlassoziation wieder; „ihrer Natur nach“ bewahrt den inhärenten Sinn von πέφυκεν.
  naturalness: „Beide stehen ihrer Natur nach auch mit der Seele in Beziehung“ ist verständlich, wirkt aber wegen des pluralischen Subjekts mit der singularisch-distributiven griechischen Vorlage und der Verbindung „mit ... in Beziehung stehen“ weniger präzise. „Jede von ihnen ist ihrer Natur nach auch auf die Seele bezogen“ ist modernes, würdiges Standarddeutsch.
  terminology: „Leidenschaften“, „Lust“, „Schmerz“ und „Seele“ sind im philosophischen Register treffend. Die Fußnote erhält die mögliche formalere Wiedergabe von φύσεις mit „Naturen“ und ist korrekt am betreffenden Ausdruck verankert.
