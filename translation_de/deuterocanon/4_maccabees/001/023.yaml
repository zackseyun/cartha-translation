translation:
  language: de
  text: Vor dem Schmerz kommt die Angst, nach dem Schmerz aber die Trauer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Kummer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ
  choice: vor
  rationale: Die Präposition bezeichnet hier schlicht die zeitliche Abfolge vor dem Schmerz.
- source_word: πόνου / τὸν πόνον
  choice: dem Schmerz
  rationale: πόνος kann Mühe, Leiden oder Schmerz bedeuten; in der knappen Folge von Angst, Schmerz und Trauer passt „Schmerz“ am besten.
- source_word: φόβος
  choice: die Angst
  rationale: „Angst“ ist im modernen Deutschen die natürliche, neutrale Wiedergabe von φόβος; „Furcht“ wäre ebenfalls möglich, klingt hier aber etwas gehobener.
- source_word: μετὰ
  choice: nach
  rationale: Mit dem Akkusativ bezeichnet μετά hier die zeitliche Folge.
- source_word: λύπη
  choice: die Trauer
  rationale: λύπη umfasst Trauer, Kummer und Betrübnis. „Trauer“ bewahrt die gewichtige emotionale Folge des Schmerzes.
theological_decisions: []
translation_notes:
  register: Knapp, sprichwortartig und in modernem Standarddeutsch. Die parallele Zeitfolge wird durch „vor … nach … aber“ deutlich wiedergegeben.
