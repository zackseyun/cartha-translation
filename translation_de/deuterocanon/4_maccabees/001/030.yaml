  yaml_path: translation/deuterocanon/4_maccabees/001/030.yaml
  text: For reason is the guide of the virtues and the master of the passions. Therefore, I will first demonstrate through the restraining works of self-control that reason is self-governing over the passions.
translation:
  language: de
  text: Denn die Vernunft ist Führerin der Tugenden und Herrscherin über die Leidenschaften. Deshalb werde ich zunächst durch die zügelnden Wirkungen der Selbstbeherrschung zeigen, dass die Vernunft unumschränkt über die Leidenschaften herrscht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμός
  choice: Vernunft
  rationale: Bezeichnet hier das vernünftige Urteils- und Denkvermögen; „Vernunft“ ist im Deutschen natürlich und bewahrt den philosophisch-ethischen Sinn.
- source_word: ἡγεμών
  choice: leitet
  rationale: Gibt die führende und lenkende Funktion der Vernunft gegenüber den Tugenden idiomatisch wieder.
- source_word: παθῶν
  choice: Leidenschaften
  rationale: Erfasst die starken Affekte und Triebe im ethischen Gedankengang, ohne sie auf bloße Gefühle zu verengen.
- source_word: αὐτοκράτωρ / αὐτοδέσποτος
  choice: herrscht über / gebietet über
  rationale: Beide Ausdrücke betonen uneingeschränkte Herrschaft beziehungsweise eigene Verfügungsgewalt; die leicht variierte Wiedergabe bewahrt den rhetorischen Nachdruck ohne unnatürliche Wiederholung.
- source_word: κωλυτικῶν τῆς σωφροσύνης ἔργων
  choice: Handlungen, die der Besonnenheit entgegenstehen
  rationale: Der Genitiv bezeichnet am natürlichsten Handlungen, welche Besonnenheit hemmen oder verhindern; dies folgt dem griechischen Wortlaut genauer als die englische konsultative Fassung.
- source_word: σωφροσύνη
  choice: Besonnenheit
  rationale: Bezeichnet ethische Selbstbeherrschung und maßvolle Besonnenheit; „Besonnenheit“ passt in den Tugenddiskurs und bleibt verständlich.
theological_decisions:
- issue: Reichweite der Herrschaft der Vernunft über die Leidenschaften
  choice: „herrscht über“ und „gebietet über“
  alternative: „ist selbstbestimmt gegenüber“
  rationale: Der griechische Text verwendet starke Herrschaftsbegriffe. Die Übersetzung bewahrt diese Behauptung, ohne eine weitergehende Lehre über die völlige Beseitigung der Leidenschaften einzutragen.
- issue: Deutung von κωλυτικῶν τῆς σωφροσύνης
  choice: Handlungen, die der Besonnenheit entgegenstehen
  alternative: hemmende Werke der Selbstbeherrschung
  rationale: 'Die grammatische Beziehung bleibt in der englischen Fassung undeutlich. Die gewählte Deutung versteht die Handlungen als Hindernisse der Besonnenheit und bewahrt den argumentativen Sinn: Gerade an solchen Herausforderungen soll die Herrschaft der Vernunft sichtbar werden.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit philosophisch-ethischem Ton. Der Satzbau wurde gegenüber dem Griechischen leicht gegliedert; die Wiederaufnahme von λογισμός als „die Vernunft“ bleibt erhalten.
