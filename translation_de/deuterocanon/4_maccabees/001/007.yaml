base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/007.yaml
  text: So then[b][a], from many angles and in many ways I could show you that devout reason is master of the passions.
translation:
  language: de
  text: Von vielen Seiten und aus unterschiedlichen Richtungen[a] könnte ich euch also zeigen, dass die gottesfürchtige Vernunft[b] die volle Herrschaft über die Leidenschaften hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von vielen Seiten und von anderswoher“; die beiden griechischen Adverbien heben mehrere unterschiedliche Beweislinien hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die fromme Vernunft“. Gemeint ist eine Vernunft, die von Ehrfurcht vor Gott bestimmt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλαχόθεν … καὶ ἀλλαχόθεν
  choice: von vielen Seiten und aus unterschiedlichen Richtungen
  rationale: Die beiden gekoppelten Adverbien betonen verschiedene Ausgangspunkte und Beweislinien. Die Wiedergabe erhält diese rhetorische Häufung, ohne sie auf bloße Arten oder Methoden zu verengen.
- source_word: ἔχοιμʼ ἂν
  choice: könnte ich
  rationale: Der Optativ mit ἄν bezeichnet eine reale Möglichkeit; „könnte ich“ gibt diese Potentialität knapp und idiomatisch wieder.
- source_word: ἐπιδεῖξαι
  choice: zeigen
  rationale: „Zeigen“ wahrt die argumentative Bedeutung, ohne wie „beweisen“ einen strengeren Beweisanspruch in den Text hineinzutragen.
- source_word: αὐτοκράτωρ
  choice: die volle Herrschaft … hat
  rationale: Das Wort bezeichnet uneingeschränkte Herrschaft oder Verfügungsgewalt. Die verbale Formulierung klingt im Deutschen natürlicher als „Selbstherrscherin“ oder „Gebieterin“ und bewahrt dennoch die Stärke des Ausdrucks.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: Im Gedankengang des Buches sind damit affektive Triebe und Regungen gemeint. „Leidenschaften“ ist präziser als das umfassendere „Gefühle“ und vermeidet die hier unpassende Bedeutung „Leiden“.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  rationale: λογισμός bezeichnet hier die vernünftige Urteilskraft, während εὐσεβής ihre Ausrichtung auf Ehrfurcht und Treue gegenüber Gott kennzeichnet. „Gottesfürchtig“ macht diese religiöse Dimension deutlicher als das möglicherweise nur allgemein-moralisch verstandene „fromm“.
theological_decisions:
- issue: Wiedergabe des programmatischen Ausdrucks ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  alternative: die fromme Vernunft; die von Gottesfurcht geprägte Vernunft
  rationale: 'Die Formulierung hält die philosophische und die religiöse Dimension zusammen: Nicht Vernunft schlechthin, sondern auf Gott ausgerichtete Vernunft herrscht über die Leidenschaften. Sie legt dabei keine spätere konfessionelle Deutung fest.'
- issue: Stärke der Herrschaftsaussage in αὐτοκράτωρ
  choice: die volle Herrschaft über die Leidenschaften hat
  alternative: über die Leidenschaften herrscht; Herrin der Leidenschaften ist
  rationale: „Volle Herrschaft“ bewahrt den Gedanken uneingeschränkter Gewalt, ohne die Aussage zu einer Behauptung völliger Gefühllosigkeit umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „euch“ und die rhetorische Satzführung bleiben erhalten; unnötige Fachsprache und konfessionell geprägte Terminologie werden vermieden.
