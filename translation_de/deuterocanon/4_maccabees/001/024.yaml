translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit philosophisch verständlicher Begrifflichkeit. Das einleitende δέ wird durch „aber“ wiedergegeben; die sachliche Spannung zwischen Lust und Schmerz bleibt bestehen.
