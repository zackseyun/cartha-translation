  text: Anger is a passion shared by pleasure and pain, if one reflects on the occasion when it came upon him.
translation:
  language: de
  text: Der Zorn aber ist eine Leidenschaft, die Lust und Schmerz gemeinsam ist, wenn man bedenkt, wann er einen überkam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: Zorn
  rationale: Bezeichnet hier den Affekt des Zorns; die schlichte, geläufige Wiedergabe passt zur philosophischen Einordnung als πάθος.
- source_word: κοινὸν πάθος ... ἡδονῆς καὶ πόνου
  choice: eine Leidenschaft, die Lust und Schmerz gemeinsam ist
  rationale: Bewahrt die Aussage, dass Zorn sowohl mit Lust als auch mit Schmerz verbunden beziehungsweise beiden gemeinsam ist, ohne das Verhältnis genauer festzulegen als der griechische Text.
- source_word: ἐὰν ἐννοηθῇ τις
  choice: wenn man bedenkt
  rationale: Gibt die konditionale, reflektierende Wendung in natürlichem modernem Deutsch wieder.
- source_word: ὅτε αὐτῷ περιέπεσεν
  choice: wann er einen überkam
  rationale: Behält den zeitlichen Sinn von ὅτε und das Bild eines Affekts bei, der einen Menschen befällt.
