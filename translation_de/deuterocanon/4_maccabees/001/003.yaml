  text: if[a], then, reason is evidently able to prevail over the passions that hinder self-control, both gluttony and desire,
translation:
  language: de
  text: Wenn also die Vernunft offenbar über die Leidenschaften die Oberhand gewinnt, die der Selbstbeherrschung entgegenstehen[a] – über Völlerei und Begierde –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher am verdichteten griechischen Wortlaut: „über die Leidenschaften, die diejenigen behindern, die sich selbst beherrschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ ἄρα
  choice: wenn also
  rationale: „Wenn“ bewahrt den bedingenden Charakter von εἰ; „also“ gibt die folgernde beziehungsweise anknüpfende Nuance von ἄρα natürlich wieder.
- source_word: τῶν σωφρονούντων
  choice: die der Selbstbeherrschung entgegenstehen
  rationale: Die griechische Genitivverbindung ist stark verdichtet und syntaktisch schwierig. Im Zusammenhang bezeichnet sie Leidenschaften, die σωφροσύνη, also besonnene Selbstbeherrschung, behindern. Die funktionale Wiedergabe ist im Deutschen verständlich, ohne die Schwierigkeit des Wortlauts zu verschweigen.
- source_word: κωλυτικῶν παθῶν
  choice: Leidenschaften …, die … entgegenstehen
  rationale: κωλυτικός bezeichnet etwas Hinderndes oder Hemmendes; πάθη sind Leidenschaften beziehungsweise innere Regungen. Die Relativkonstruktion klingt im modernen Deutsch natürlich.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: λογισμός ist in 4 Makkabäer ein philosophischer Schlüsselbegriff für vernünftiges Urteilen. „Vernunft“ ist prägnant und bewahrt das Gewicht des Gedankengangs.
- source_word: φαίνεται ἐπικρατεῖν
  choice: offenbar … die Oberhand gewinnt
  rationale: φαίνεται kann „scheint“ oder „erweist sich/offenbar“ bedeuten; ἐπικρατεῖν heißt „die Oberhand gewinnen“ beziehungsweise „herrschen über“. Die Formulierung entspricht dem argumentativ-demonstrativen Ton.
- source_word: γαστριμαργίας
  choice: Völlerei
  rationale: Das Wort bezeichnet ein maßloses Verlangen nach Essen; „Völlerei“ ist die knappe und etablierte deutsche Entsprechung.
- source_word: ἐπιθυμίας
  choice: Begierde
  rationale: ἐπιθυμία bezeichnet allgemein starkes Verlangen oder Begehren. „Begierde“ erhält diese Breite und verengt den Ausdruck nicht vorschnell auf sexuelles Begehren.
theological_decisions:
- issue: Philosophisch-anthropologische Bedeutung von λογισμός
  choice: Vernunft
  alternative: vernünftiges Urteil; Denkvermögen
  rationale: Der Vers behandelt die Herrschaft vernünftigen Urteilens über die Leidenschaften. „Vernunft“ gibt diese philosophische Aussage wieder, ohne spätere fachtheologische Kategorien einzutragen.
- issue: Bezug der verdichteten Wendung τῶν σωφρονούντων
  choice: funktional auf die durch Leidenschaften behinderte Selbstbeherrschung bezogen
  alternative: 'formal: „diejenigen, die sich selbst beherrschen, behindernde Leidenschaften“'
  rationale: Eine rein formale Wiedergabe wäre im Deutschen schwer verständlich. Die Hauptfassung macht den im Zusammenhang naheliegenden Sinn deutlich; die Fußnote bewahrt die echte syntaktische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als Bedingungssatz offen, weil der griechische Text an dieser Stelle in den folgenden Vers hinein weiterläuft. Gedankenstriche heben die beiden Beispiele hervor, ohne sie als vollständige Aufzählung umzudeuten.
