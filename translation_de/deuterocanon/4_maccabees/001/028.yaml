  yaml_path: translation/deuterocanon/4_maccabees/001/028.yaml
  text: Therefore[a], just as pleasure and pain are two growths of the body and the soul, many passions are offshoots of these[b];
translation:
  language: de
  text: Da nun Lust und Schmerz zwei Gewächse des Körpers und der Seele sind, gibt es viele Seitentriebe dieser Leidenschaften[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gemütsregungen“ oder „Affekte“. Das griechische Wort bezeichnet hier Regungen, die nach der Gedankenführung dieses Werkes von der Vernunft beherrscht werden sollen.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ οὖν
  choice: So wie nun … so
  rationale: „So wie“ gibt den Vergleich wieder; „nun“ bewahrt den folgernden Anschluss von οὖν. Das ergänzte zweite „so“ bildet die griechische Vergleichsstruktur im natürlichen Deutschen ab.
- source_word: δυοῖν
  choice: zwei
  rationale: Der griechische Dual bezeichnet genau zwei Größen.
- source_word: τοῦ σώματος καὶ τῆς ψυχῆς
  choice: des Körpers und der Seele
  rationale: Die Genitive werden auf φυτῶν bezogen und bewahren die anthropologische Paarung von Körper und Seele.
- source_word: φυτῶν
  choice: Gewächse
  rationale: „Gewächse“ erhält das botanische Bild und lässt sich zugleich metaphorisch auf Lust und Schmerz beziehen.
- source_word: ἡδονῆς τε καὶ πόνου
  choice: Lust und Schmerz
  rationale: Dies ist die direkte und im philosophischen Zusammenhang geläufige Wiedergabe des Gegensatzpaares.
- source_word: τῶν παθῶν
  choice: Leidenschaften
  rationale: Im Kontext bezeichnet πάθη Affekte beziehungsweise emotionale Regungen, die von der Vernunft beherrscht werden sollen; „Leidenschaften“ trifft diesen philosophischen Gebrauch.
- source_word: παραφυάδες
  choice: Seitentriebe
  rationale: Das Wort bezeichnet seitlich hervortretende Triebe und führt das botanische Bild von φυτά präzise fort.
- source_word: τούτων
  choice: deren
  rationale: Das Pronomen verweist auf Lust und Schmerz zurück und drückt ihre Beziehung zu den Seitentrieben knapp und natürlich aus.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχή in σώματος καὶ ψυχῆς
  choice: Körper und Seele
  alternative: Körper und Leben; körperliches und inneres Leben
  rationale: Der philosophische Zusammenhang und die Paarung der Genitive sprechen für „Seele“. Die Formulierung bewahrt den Begriffsrahmen des Autors, ohne ihn durch spätere lehrmäßige Präzisierungen auszugestalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gewächse“ und „Seitentriebe“ bewahren das durchgehende botanische Bild; „So wie nun … so“ stellt Vergleich und Folgerungszusammenhang verständlich dar.
