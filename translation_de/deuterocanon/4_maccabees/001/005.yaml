  source_fidelity: 'Der Entwurf gibt den Gedankengang im Wesentlichen zutreffend wieder: λογισμός und πάθη sind angemessen als „Vernunft“ und „Leidenschaften“ wiedergegeben, und λήθη/ἄγνοια als „Vergessen“ und „Unwissenheit“. Die Wiedergabe von τινες durch das Singular „jemand“ schwächt jedoch die pluralische, unbestimmte Gruppe möglicher Einwender ab. Außerdem bildet eine direkte Konditionalfrage die griechische Syntax und rhetorische Stoßrichtung genauer ab.'
  naturalness: Der bisherige Satz ist verständlich, aber die Konstruktion „Wie kommt es also ... dass ... zwar ..., nicht aber ...?“ ist schwerfälliger als nötig. Eine direkte Frage mit „wenn ..., herrscht sie dann nicht auch ...?“ ist modernes, idiomatisches Standarddeutsch.
  terminology: „Vernunft“, „Leidenschaften“, „Vergessen“ und „Unwissenheit“ sind treffend und registergerecht. „Herrscht“ gibt sowohl κρατεῖ als auch δεσπόζει vertretbar wieder; die Verstärkung bei δεσπόζει ist im Deutschen durch den Kontext ausreichend wahrnehmbar.
