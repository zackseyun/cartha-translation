base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/005.yaml
  text: How then[a], perhaps some might say, if reason rules over the passions, does it not also master forgetfulness and ignorance? In attempting to say this, they are being ridiculous.
translation:
  language: de
  text: Wie kann es also sein, könnten vielleicht einige sagen, dass die Vernunft, wenn sie über die Leidenschaften herrscht, nicht auch über Vergessen und Unwissenheit herrscht? Wer so etwas zu sagen versucht, macht sich lächerlich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es ist lächerlich, so etwas zu sagen.“ Die knappe griechische Formulierung kann unpersönlich verstanden oder auf die Einwender selbst bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς οὖν
  choice: Wie kommt es also
  rationale: Leitet einen rhetorischen Einwand ein und wahrt in natürlichem Deutsch den argumentativen Anschluss.
- source_word: ἴσως εἴποιεν ἄν τινες
  choice: könnte vielleicht jemand sagen
  rationale: Gibt die durch ἴσως sowie Optativ mit ἄν ausgedrückte vorsichtige, hypothetische Einrede wieder; das unbestimmte τινες wird idiomatisch mit „jemand“ wiedergegeben.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: πάθη bezeichnet im philosophisch-ethischen Gedankengang des Buches die von der Vernunft zu beherrschenden Leidenschaften oder Triebe, nicht äußere Leiden.
- source_word: ὁ λογισμός
  choice: die Vernunft
  rationale: Bezeichnet hier das Vermögen vernünftiger Überlegung, das für die Argumentation des Buches zentral ist.
- source_word: κρατεῖ
  choice: herrscht
  rationale: Bringt die Ausübung von Macht über die Leidenschaften zum Ausdruck und passt zum anschließenden δεσπόζει.
- source_word: λήθης καὶ ἀγνοίας
  choice: über das Vergessen und die Unwissenheit
  rationale: Gibt die beiden geistigen Mängel als abstrakte Substantive direkt und verständlich wieder.
- source_word: οὐ δεσπόζει
  choice: nicht aber auch … herrscht
  rationale: Bewahrt den Gedanken der Herrschaft; „auch“ macht die im Einwand vorausgesetzte Folgerung im Deutschen deutlich, „aber“ bildet den griechischen Gegensatz natürlich ab.
- source_word: γελοῖον ἐπιχειροῦντες λέγειν
  choice: Wer so etwas zu behaupten versucht, macht sich lächerlich
  rationale: Bezieht die polemische Wertung auf die zuvor gedachten Einwender und gibt ἐπιχειροῦντες λέγειν idiomatisch als versuchte Behauptung wieder; die mögliche unpersönliche Auffassung wird in der Fußnote erhalten.
theological_decisions:
- issue: Philosophisch-anthropologische Begrifflichkeit
  choice: λογισμός als „Vernunft“ und πάθη als „Leidenschaften“
  alternative: λογισμός als „vernünftige Überlegung“ oder „Denken“ und πάθη als „Regungen“ oder „Triebe“
  rationale: Das Begriffspaar bewahrt den philosophisch-ethischen Rahmen des Buches, ohne spätere konfessionelle Anthropologien einzutragen.
- issue: Bezug von γελοῖον in der Schlusswendung
  choice: Die Lächerlichkeit wird auf die gedachten Einwender bezogen
  alternative: 'Unpersönlich: „Es ist lächerlich, so etwas zu behaupten“'
  rationale: Der personale Bezug verbindet das Partizip ἐπιχειροῦντες unmittelbar mit den unbestimmten Einwendern; da die knappe griechische Konstruktion auch unpersönlich verstanden werden kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der rhetorische Einwand bleibt als ein einziger Fragesatz erhalten; die philosophischen Leitbegriffe werden verständlich, aber nicht umschreibend wiedergegeben.
