  - severity: low
    issue: Die rhetorische Frage ist unnötig umgeformt
    rationale: Die griechische Folge πῶς οὖν ... εἰ ... οὐ δεσπόζει; lässt sich im Deutschen klarer und näher als direkte Konditionalfrage wiedergeben.
