  rationale: Die Revision wahrt die pluralische Unbestimmtheit von τινες und stellt die im Griechischen vorliegende rhetorische Konditionalfrage unmittelbarer dar. Die Schlusswendung bleibt in der als Haupttext gewählten personalen Auslegung erhalten; die ebenfalls mögliche unpersönliche Lesart wird weiterhin durch die Fußnote dokumentiert.
