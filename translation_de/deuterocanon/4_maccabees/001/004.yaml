translation:
  language: de
  text: 'Doch es zeigt sich auch, dass sie über die Leidenschaften herrscht, die die Gerechtigkeit[a] behindern, etwa Bosheit, und über die Leidenschaften, die die Tapferkeit behindern: Zorn, Schmerz und Furcht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtschaffenheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κυριεύειν
  choice: über … herrscht
  rationale: Das Verb bezeichnet Herrschaft oder wirksame Kontrolle. „Über … herrschen“ bewahrt dieses Bild und ist im Deutschen klar verständlich.
- source_word: ἀναφαίνεται
  choice: es zeigt sich
  rationale: Die Wendung gibt das argumentative Sichtbar- oder Erkennbarwerden wieder, ohne die Aussage unnötig zu verstärken.
- source_word: ἐμποδιστικῶν
  choice: die … behindern
  rationale: Der attributive Ausdruck wird als natürlicher deutscher Relativsatz wiedergegeben und behält den Sinn des Hemmens bei.
- source_word: παθῶν
  choice: Leidenschaften
  rationale: Im philosophisch-ethischen Zusammenhang bezeichnet πάθη innere Affekte oder leidenschaftliche Regungen; „Leidenschaften“ wahrt den traditionellen Fachsinn.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die direkte und im Tugendkontext naheliegende Wiedergabe; die ebenfalls mögliche Bedeutung „Rechtschaffenheit“ wird in einer Fußnote bewahrt.
- source_word: κακοηθείας
  choice: Bosheit
  rationale: Das Wort bezeichnet eine böse Gesinnung oder Niederträchtigkeit. „Bosheit“ ist knapp, gegenwärtig und deckt sowohl Charakterhaltung als auch üble Absicht ab.
- source_word: ἀνδρείας
  choice: Tapferkeit
  rationale: In der hellenistischen Tugendlehre bezeichnet ἀνδρεία die Tugend der Standhaftigkeit und des Mutes. „Tapferkeit“ ist präzise und vermeidet eine geschlechtsspezifische Wiedergabe.
- source_word: θυμοῦ
  choice: Zorn
  rationale: In der Aufzählung hindernder Leidenschaften ist die negative Bedeutung „Zorn“ angemessen.
- source_word: πόνου
  choice: Schmerz
  rationale: Unter den die Tapferkeit hemmenden Affekten ist „Schmerz“ die unmittelbarste Bedeutung; „Mühsal“ bleibt lexikalisch möglich, wird hier aber vom Kontext weniger nahegelegt.
- source_word: φόβου
  choice: Furcht
  rationale: „Furcht“ entspricht der Grundbedeutung und passt stilistisch zur ethischen Aufzählung.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Im Zusammenhang einer Tugendlehre ist „Gerechtigkeit“ besonders naheliegend; da δικαιοσύνη zugleich persönliche Rechtschaffenheit bezeichnen kann, wird diese Bedeutungsnuance in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die philosophischen Begriffe „Leidenschaften“, „Gerechtigkeit“ und „Tapferkeit“ bleiben erkennbar, während Relativsätze die dichte griechische Syntax natürlich wiedergeben. Das feminine Pronomen „sie“ setzt den im vorangehenden Zusammenhang genannten weiblichen Bezugsausdruck, die Vernunft, fort.
