  yaml_path: translation/deuterocanon/4_maccabees/001/010.yaml
  text: Therefore[a], it is incumbent on me to praise the men who, at this time, died with their mother for the sake of nobility and goodness; and, as for honors[b], to pronounce them blessed.
translation:
  language: de
  text: Daher obliegt es mir, die Männer zu rühmen, die zu jener Zeit zusammen mit ihrer Mutter für ihre edle und gute Haltung starben[a], und sie, was die Ehrenbezeugungen betrifft, seligzupreisen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um der Tugend willen“. Das griechische καλοκἀγαθία verbindet die Vorstellungen von edler Haltung, Güte und sittlicher Vortrefflichkeit.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Schluss ist stark verdichtet und in seiner genauen Satzfügung unsicher. Gemeint ist wohl, dass zu dem Lob ihrer Tugenden auch das ehrende Seligpreisen der Verstorbenen tritt.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεστί μοι
  choice: es obliegt mir
  rationale: Die unpersönliche Wendung bezeichnet eine Verpflichtung oder zukommende Aufgabe und bewahrt zugleich den gehobenen rhetorischen Ton.
- source_word: ἐπαινεῖν
  choice: zu rühmen
  rationale: „Rühmen“ gibt den öffentlichen, feierlichen Charakter des Lobes in diesem Prolog angemessen wieder.
- source_word: τοὺς ... ἀποθανόντας ... ἄνδρας
  choice: die Männer, die ... starben
  rationale: Der substantivierte maskuline Bezug wird geschlechtsgenau als „Männer“ wiedergegeben; der griechische Partizipialbau wird im Deutschen natürlich durch einen Relativsatz ausgedrückt.
- source_word: κατὰ τοῦτον τὸν καιρόν
  choice: zu jener Zeit
  rationale: Die Wendung verweist auf die zuvor behandelte historische Situation. Im deutschen Erzählkontext klingt „zu jener Zeit“ natürlicher als das deiktisch nähere „zu dieser Zeit“.
- source_word: ὑπὲρ τῆς καλοκἀγαθίας
  choice: um ihrer edlen Gesinnung willen
  rationale: καλοκἀγαθία verbindet sittliche Güte mit vornehmer, ehrenhafter Haltung. „Edle Gesinnung“ bildet dieses Ideal idiomatisch ab, ohne es auf bloßen gesellschaftlichen Rang zu verengen.
- source_word: μετὰ τῆς μητρός
  choice: zusammen mit ihrer Mutter
  rationale: Die Formulierung macht die gemeinsame Todes- beziehungsweise Martyriumssituation ausdrücklich und natürlich verständlich.
- source_word: τῶν δὲ τιμῶν μακαρισμῷ ὤν
  choice: ihnen, was die Ehrenbezeugungen betrifft, Seligpreisung zuteilwerden zu lassen
  rationale: Die überlieferte Schlussphrase ist syntaktisch stark verdichtet und möglicherweise textlich schwierig. Die Übersetzung erhält sowohl den Bezug auf Ehrenbezeugungen als auch μακαρισμός im Sinn einer feierlichen Seligpreisung, ohne die Beziehung beider Begriffe weiter festzulegen.
theological_decisions:
- issue: Bedeutung von καλοκἀγαθία im Martyriumskontext
  choice: edle Gesinnung
  alternative: Tugend; sittliche Vortrefflichkeit; Adel und Güte
  rationale: Der Ausdruck gehört zur hellenistischen Tugend- und Ehrensprache. „Edle Gesinnung“ bewahrt seine sittliche und ehrenhafte Dimension, ohne einen späteren theologischen Fachbegriff einzutragen.
- issue: Wiedergabe von μακαρισμός
  choice: Seligpreisung
  alternative: sie seligzupreisen; sie glücklich zu preisen
  rationale: μακαρισμός bezeichnet das Selig- oder Glücklichpreisen. „Seligpreisung“ hält die feierliche religiös-ethische Färbung fest, ohne eine Aussage über einen kirchlichen Heiligsprechungsakt einzutragen.
- issue: Geschlechtsspezifischer Bezug von ἄνδρας
  choice: Männer
  alternative: Menschen; die Söhne
  rationale: Der griechische Text bezeichnet die männlichen Märtyrer ausdrücklich als ἄνδρας. „Männer“ bewahrt diesen Bezug; „Söhne“ wäre zwar aus dem Kontext verständlich, steht hier aber nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst rhetorischem Ton. Der Satzbau bleibt der antiken Gegenüberstellung von Tugenden und Ehrenbezeugungen verpflichtet, wird jedoch so gegliedert, dass er für heutige Leser verständlich bleibt. Die Unsicherheit der komprimierten Schlussphrase wird nicht durch eine dogmatisch festgelegte Deutung verdeckt.
