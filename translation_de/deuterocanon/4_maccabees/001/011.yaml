base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/011.yaml
  text: For those men became even more admirable[a], not only to all people for their courage and endurance, but also to those who tortured them; they became the cause of the overthrow of the tyranny against the nation, having conquered the tyrant by endurance[b], so that through them the fatherland was purified.
translation:
  language: de
  text: Denn jene Männer wurden noch bewundernswerter, nicht nur bei allen Menschen wegen ihres Mutes und ihrer Standhaftigkeit, sondern auch bei denen, die sie folterten; sie wurden zur Ursache dafür, dass die gegen das Volk gerichtete Tyrannenherrschaft beseitigt wurde, indem sie durch ihre Standhaftigkeit den Tyrannen besiegten, sodass durch sie das Vaterland[a] gereinigt wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Heimat“. Das griechische πατρίς bezeichnet das eigene Land beziehungsweise die Heimat; „Vaterland“ bewahrt hier den gehobenen rhetorischen Ton.'
    reason: lexical_alternative
  - marker: b
    text: „Gereinigt“ kann auch im Sinn von „geläutert“ verstanden werden; der Ausdruck kann politische, moralische oder kultische Anklänge haben.
    reason: alternative_reading
lexical_decisions:
- source_word: θαυμαστότεροι
  choice: noch bewundernswerter
  rationale: Der Komparativ wird ausdrücklich wiedergegeben; „bewundernswert“ bezeichnet hier die durch Mut und Standhaftigkeit hervorgerufene Hochachtung natürlicher als „wunderbarer“.
- source_word: ἀνδρίᾳ
  choice: Mut
  rationale: Das Wort bezeichnet in diesem Zusammenhang Tapferkeit; „Mut“ ist gegenwärtiges, verständliches Deutsch und vermeidet eine unnötig geschlechtsspezifische Wiedergabe.
- source_word: ὑπομονῇ
  choice: Standhaftigkeit
  rationale: Der Ausdruck bezeichnet beharrliches Ausharren unter Leiden. Die gleiche Wiedergabe an beiden Stellen bewahrt die rhetorische Wiederholung.
- source_word: αἰκισαμένων
  choice: die sie folterten
  rationale: Das Partizip bezeichnet diejenigen, die ihnen grausame Misshandlungen zufügten; „folterten“ macht die Schwere der Gewalt deutlich.
- source_word: αἴτιοι κατέστησαν
  choice: Sie wurden zur Ursache dafür
  rationale: Die Formulierung gibt die ausdrücklich behauptete ursächliche Rolle der Männer wieder, ohne sie lediglich als Anlass abzuschwächen.
- source_word: καταλυθῆναι
  choice: beseitigt wurde
  rationale: Bei einer Tyrannenherrschaft bezeichnet das passive Verb deren Aufhebung oder Niederwerfung. „Beseitigt“ ist idiomatisch und lässt sowohl das politische Ende als auch den Sturz offen.
- source_word: τὴν κατὰ τοῦ ἔθνους τυραννίδα
  choice: die gegen das Volk gerichtete Tyrannenherrschaft
  rationale: „Volk“ gibt ἔθνος im jüdischen Zusammenhang natürlich wieder; „gegen ... gerichtet“ bewahrt die feindliche Ausrichtung, und „Tyrannenherrschaft“ ist im Deutschen klarer als das abstraktere „Tyrannei“.
- source_word: νικήσαντες τὸν τύραννον
  choice: Durch ihre Standhaftigkeit besiegten sie den Tyrannen
  rationale: Das Partizip bezeichnet den begleitenden beziehungsweise ursächlichen Weg zum Ergebnis. Die aktive Satzform bewahrt das starke Siegesmotiv und liest sich im Deutschen natürlich.
- source_word: ὥστε καθαρσθῆναι
  choice: sodass ... gereinigt wurde
  rationale: ὥστε mit Infinitiv bezeichnet hier eine Folge. „Gereinigt“ bewahrt die mögliche politische, moralische und kultische Bedeutung, ohne eine davon festzulegen.
- source_word: πατρίδα
  choice: Vaterland
  rationale: πατρίς bezeichnet das eigene Land beziehungsweise die Heimat. „Vaterland“ erhält den gehobenen rhetorischen Ton; die weniger markierte Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung der Reinigung des Landes durch die Leidenden
  choice: Die Heimat wird durch die Männer „gereinigt“, ohne den Vorgang näher zu systematisieren.
  alternative: Die Aussage ausschließlich als politische Befreiung, kultische Reinigung oder sühnende Wirkung ihres Leidens zu bestimmen.
  rationale: καθαρσθῆναι trägt einen offenen Reinigungsbegriff und kann im Zusammenhang politische, moralische, kultische oder weitergehende religiöse Resonanzen haben. Die Übersetzung wahrt diese Spannung und importiert keine ausgearbeitete Sühnelehre.
- issue: Art des Sieges über den Tyrannen
  choice: Der Tyrann wird „durch ihre Standhaftigkeit“ besiegt.
  alternative: Den Sieg als ausschließlich militärischen oder ausschließlich geistlichen Sieg auszulegen.
  rationale: Der griechische Text nennt ausdrücklich die ὑπομονή als Mittel des Sieges. Die paradoxe Aussage bleibt stehen, ohne die Art dieses Sieges über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gehobenem rhetorischem Klang. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; Doppelpunkt und Gedankenstriche machen die logischen Beziehungen sichtbar. Die Wiederholung von „Standhaftigkeit“ wurde bewusst bewahrt.
