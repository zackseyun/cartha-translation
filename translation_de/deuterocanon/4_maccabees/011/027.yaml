base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/027.yaml
  text: For our guards stand over us not for a tyrant[a], but for divine law; for this reason we have undefeated reason.
translation:
  language: de
  text: Denn die Wächter, die über uns stehen, stehen nicht im Dienst eines Tyrannen, sondern im Dienst des göttlichen Gesetzes. Darum haben wir eine unbesiegbare Vernunft[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein unbesiegbares vernünftiges Urteilsvermögen“. Das griechische Wort λογισμός ist in 4 Makkabäer ein Leitbegriff für die vernünftige Fähigkeit, die Leidenschaften zu beherrschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυράννου
  choice: einem Tyrannen
  rationale: „Tyrann“ bewahrt die negative Bedeutung eines gewaltsam oder uneingeschränkt herrschenden Machthabers; neutralere Wiedergaben wie „König“ oder „Herrscher“ würden diesen Ton abschwächen.
- source_word: θείου νόμου
  choice: dem göttlichen Gesetz
  rationale: Die Wiedergabe folgt der griechischen Adjektiv-Nomen-Verbindung eng und bezeichnet das Gesetz als göttlich, ohne die Formulierung unnötig zu erläutern.
- source_word: προεστήκασιν ἡμῶν
  choice: die über uns stehen
  rationale: Das Perfekt von προΐστημι bezeichnet hier eine bestehende Stellung über beziehungsweise vor den Betroffenen. Der Relativsatz bildet das räumliche und zugleich aufsichtsbezogene Bild verständlich ab.
- source_word: οἱ δορυφόροι
  choice: die Wächter
  rationale: Wörtlich sind es „Speerträger“; im Zusammenhang bezeichnet das Wort bewaffnete Begleiter oder Aufseher. „Wächter“ gibt ihre Funktion natürlich wieder, ohne ihre genaue Ausrüstung festzulegen.
- source_word: ἀνίκητον
  choice: unbesiegbare
  rationale: Das Adjektiv bedeutet „nicht besiegt“ oder „nicht zu überwinden“. „Unbesiegbar“ ist im Deutschen idiomatisch und bewahrt das Bild des Widerstands gegen eine bezwingende Macht.
- source_word: λογισμόν
  choice: Vernunft
  rationale: λογισμός bezeichnet in 4 Makkabäer wiederholt das vernünftige Urteilsvermögen, das die Leidenschaften lenkt. „Vernunft“ ist knapp, verständlich und wahrt den philosophischen Leitbegriff.
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Die Wendung kennzeichnet die Folgerung aus dem vorangehenden Gegensatz. „Darum“ gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: ἔχομεν
  choice: haben wir
  rationale: Die einfache Besitzkonstruktion des Griechischen bleibt ausdrücklich erhalten, statt sie zu „unsere Vernunft ist“ umzuschreiben.
theological_decisions:
- issue: Gegensatz zwischen der Autorität eines menschlichen Gewaltherrschers und der des göttlichen Gesetzes
  choice: dienen nicht einem Tyrannen, sondern dem göttlichen Gesetz
  alternative: stehen nicht im Dienst eines Tyrannen, sondern in dem des göttlichen Gesetzes
  rationale: Die Dativkonstruktion im Deutschen verdeutlicht, wem die Wächter tatsächlich verpflichtet sind. Sie bewahrt den scharfen Gegensatz, ohne daraus eine über den unmittelbaren Zusammenhang hinausgehende Lehraussage abzuleiten.
- issue: Aussage über die Widerstandskraft des λογισμός
  choice: haben wir eine unbesiegbare Vernunft
  alternative: ist unsere Vernunft unbesiegbar
  rationale: Die gewählte Form erhält das griechische ἔχομεν („wir haben“) und damit die Aussageform des Ausgangstextes. Zugleich bleibt offen, ob λογισμός stärker als Vernunftvermögen oder als vernünftiges Urteil verstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz wird zur besseren Verständlichkeit syntaktisch gegliedert; das Autoritätsverhältnis wird mit „dienen“ ausgedrückt. Der philosophische Leitbegriff λογισμός bleibt mit „Vernunft“ knapp und in der Fußnote näher bestimmt.
