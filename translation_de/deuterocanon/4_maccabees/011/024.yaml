  text: Six young men have overthrown your tyranny.
translation:
  language: de
  text: Sechs junge Männer haben deine Tyrannenherrschaft zu Fall gebracht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἓξ
  choice: Sechs
  rationale: Die Kardinalzahl wird direkt wiedergegeben und eröffnet als Attribut das Subjekt.
- source_word: μειράκια
  choice: junge Männer
  rationale: Die Form bezeichnet männliche Jugendliche beziehungsweise junge Männer. »Junge Männer« bewahrt den Hinweis auf ihr geringes Alter, ohne ihre sittliche Eigenverantwortung durch »Jungen« unnötig abzuschwächen.
- source_word: κατελύσαμέν
  choice: haben ... zu Fall gebracht
  rationale: Der Aorist von καταλύω bezeichnet hier das entschiedene Niederwerfen oder Entkräften einer Herrschaft. Die deutsche Perfektform bringt im unmittelbaren Ausspruch das vollendete Handeln mit gegenwärtigem Ergebnis natürlich zum Ausdruck.
- source_word: σου
  choice: deine
  rationale: Das Genitivpronomen der zweiten Person Singular wird als Possessivartikel wiedergegeben.
- source_word: τὴν τυραννίδα
  choice: Tyrannenherrschaft
  rationale: τυραννίς bezeichnet tyrannische, gewaltsam-unterdrückende Herrschaft. »Tyrannenherrschaft« ist im Deutschen konkret und idiomatisch und passt zur direkten Anrede des Verfolgers.
theological_decisions:
- issue: Aussagekraft des Aorists im triumphierenden Zuruf an den Verfolger
  choice: 'Perfekt: »haben ... zu Fall gebracht«'
  alternative: 'Präteritum: »brachten ... zu Fall«; oder abgeschwächt: »haben ... ein Ende gesetzt«'
  rationale: 'Der griechische Aorist stellt das Geschehen als vollendet dar. Im deutschen direkten Zuruf vermittelt das Perfekt zugleich das gegenwärtige Ergebnis: Durch ihre Standhaftigkeit gilt die Tyrannenherrschaft bereits als besiegt. Die rhetorische und moralische Siegesaussage bleibt erhalten, ohne daraus ausdrücklich einen bereits vollzogenen politischen Machtwechsel zu machen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzgestalt und die direkte Anrede bewahren den trotzigen, triumphierenden Ton des griechischen Textes.
