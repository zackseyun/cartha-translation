- from: »Gut«, sagte er, »der Tyrann erweist uns wider Willen Wohltaten – ja, gut –, indem er uns durch edlere Leiden Gelegenheit gibt, unsere Standhaftigkeit gegenüber unserem Gesetz zu zeigen.«
  to: »Es ist gut«, sagte sie, »dass du, Tyrann, uns auch gegen deinen Willen Wohltaten erweist; gut, dass du uns durch edlere Leiden Gelegenheit gibst, unsere Standhaftigkeit für unser Gesetz zu zeigen.«
  rationale: Die Revision stellt die kontextuell und syntaktisch erforderliche Anrede des Tyrannen wieder her und macht die Mutter als Sprecherin kenntlich. Die beiden Vorkommen von καλῶς werden als wiederholte positive Bewertung bewahrt. Die Formulierung wahrt die Ironie, dass der Tyrann durch seine Verfolgung ungewollt den Märtyrern eine Gelegenheit zur Bewährung verschafft.
