base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/012.yaml
  text: “Good,” said the tyrant[a], though unwillingly, “he grants us favors—good indeed—by giving us the opportunity, through nobler sufferings[b], to display our endurance for our law.”
translation:
  language: de
  text: »Es ist gut«, sagte sie, »dass du, Tyrann, uns auch gegen deinen Willen Wohltaten erweist; gut, dass du uns durch edlere Leiden Gelegenheit gibst, unsere Standhaftigkeit für unser Gesetz zu zeigen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καλῶς … καλῶς
  choice: Gut … ja, gut
  rationale: Bewahrt die emphatische Wiederholung als zustimmenden Ausruf; „ja“ macht die zweite, verstärkende Aufnahme im modernen Deutschen verständlich.
- source_word: ἔλεγεν
  choice: sagte er
  rationale: Das Imperfekt steht in erzählendem Zusammenhang und wird natürlich mit dem deutschen Präteritum wiedergegeben.
- source_word: ἄκων, ὁ τύραννος
  choice: der Tyrann … wider Willen
  rationale: 'Die Wortstellung lässt ἄκων am naheliegendsten auf den Tyrannen als Handelnden des folgenden χαρίζῃ/παρέχων beziehen: Er erweist ihnen unbeabsichtigt beziehungsweise gegen seinen Willen Wohltaten.'
- source_word: χάριτας ἡμῖν χαρίζῃ
  choice: erweist uns Wohltaten
  rationale: Die Verbindung von χάρις und χαρίζομαι ist im Deutschen nicht vollständig nachzubilden; „Wohltaten erweisen“ erhält den ironischen Sinn, dass die Folter den Märtyrern letztlich zugutekommt.
- source_word: διὰ γενναιοτέρων πόνων
  choice: durch edlere Leiden
  rationale: πόνοι bezeichnet hier leidvolle Prüfungen; der Komparativ γενναιοτέρων wird als „edlere“ bewahrt und nicht zu bloß schwereren Leiden geglättet.
- source_word: ἐπιδείξασθαι παρέχων
  choice: indem er uns … Gelegenheit gibt, … zu zeigen
  rationale: Gibt das Mittel ausdrückende Partizip und den Infinitiv idiomatisch wieder, ohne den Gedanken einer gewährten Gelegenheit auszulassen.
- source_word: τὴν εἰς τὸν νόμον ἡμῶν καρτερίαν
  choice: unsere Standhaftigkeit gegenüber unserem Gesetz
  rationale: καρτερία meint standhaftes Ausharren; εἰς bezeichnet die Ausrichtung auf beziehungsweise Treue gegenüber dem Gesetz. „Gegenüber“ bewahrt diese Relation, ohne sie enger als Gehorsam oder Bekenntnistreue festzulegen.
theological_decisions:
- issue: Wiedergabe von νόμος im jüdischen Märtyrerkontext
  choice: Gesetz
  alternative: Tora
  rationale: Gemeint ist das göttliche, überlieferte Gesetz Israels. „Gesetz“ entspricht dem griechischen νόμος unmittelbar und vermeidet eine interpretierende Spezifizierung, während „unserem“ den besonderen Bundesbezug erkennen lässt.
- issue: Bezug von ἄκων
  choice: auf das widerwillige beziehungsweise unbeabsichtigte Wohltun des Tyrannen
  alternative: auf sein widerwilliges Eingeständnis beim Sprechen
  rationale: Kasus und Satzbau verbinden ἄκων mit ὁ τύραννος, dem Subjekt von χαρίζῃ und παρέχων. Die mögliche pragmatische Nebenbedeutung eines widerwilligen Eingeständnisses wird nicht dogmatisch ausgeschlossen, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt rhetorisch pointiert; die Ironie des als Wohltat verstandenen Martyriums und der auffällige Komparativ „edlere Leiden“ werden bewahrt. Keine Fußnoten sind nötig, da die wesentlichen Mehrdeutigkeiten im Deutschen ohne Zusatzmarker tragfähig wiedergegeben werden.
