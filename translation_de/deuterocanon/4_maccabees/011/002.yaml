  text: I am not about to shrink back[a], tyrant, from the torture for the sake of virtue.
translation:
  language: de
  text: Ich werde, Tyrann, vor der Folter um der Tugend willen nicht zurückschrecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde die Folter um der Tugend willen nicht ablehnen.« Das griechische Verb kann bedeuten, etwas abzulehnen oder sich ihm zu entziehen; im Zusammenhang liegt zugleich der Gedanke nahe, vor dem Leiden nicht zurückzuweichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλλω
  choice: Ich werde nicht
  rationale: Das verneinte μέλλω mit Infinitiv bringt hier den entschlossenen Willen des Sprechers zum Ausdruck. Das deutsche Futur gibt diese feste Weigerung natürlich und nachdrücklich wieder.
- source_word: τύραννε
  choice: Tyrann
  rationale: Der Vokativ redet den Herrscher unmittelbar und mit deutlich wertender, konfrontativer Kraft an.
- source_word: πρὸς τὸν ... βασανισμόν
  choice: vor der Folter
  rationale: In Verbindung mit zurückschrecken bezeichnet die Präpositionalgruppe das Leiden, dem sich der Sprecher nicht entziehen will. Folter entspricht βασανισμός im Märtyrerkontext.
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: um der Tugend willen
  rationale: Die Wendung bewahrt sowohl den ethischen Sinn von ἀρετή als auch die Bedeutung des Beweggrundes in ὑπέρ.
- source_word: παραιτεῖσθαι
  choice: zurückschrecken
  rationale: Das Verb kann ablehnen oder sich entziehen bedeuten; im Zusammenhang bezeichnet es anschaulich die Weigerung, vor dem bevorstehenden Leiden zurückzuweichen.
theological_decisions:
- issue: Bedeutung von ἀρετή im philosophisch geprägten Märtyrerkontext
  choice: Tugend
  alternative: Vortrefflichkeit
  rationale: Tugend wahrt den ethisch-philosophischen Leitbegriff des Buches und vermeidet eine unnötige Festlegung auf eine einzelne Tugend wie Mut oder Tapferkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt scharf und konfrontativ; die knappe Satzform bewahrt die Entschlossenheit der Rede.
