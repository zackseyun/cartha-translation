base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/005.yaml
  text: Or does it not seem evil that we worship the Creator of all things and live according to his virtuous law?[a][b]
translation:
  language: de
  text: Oder scheint es nicht böse[a], dass wir den Schöpfer aller Dinge verehren und nach seinem edlen Gesetz[b] leben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verwerflich“, „schlecht“ oder „unrecht“. Das griechische κακόν kann moralisch Böses, Schlechtes oder Unrechtes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „tugendhaften Gesetz“ oder „vortrefflichen Gesetz“. Das griechische ἔναρετος hebt die sittliche Güte oder Vorzüglichkeit hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακὸν
  choice: etwas Böses
  rationale: Das substantivierte Adjektiv bezeichnet hier etwas moralisch Schlechtes oder Verwerfliches. „Etwas Böses“ erhält die starke moralische Wertung und passt zur Konstruktion mit δοκεῖ.
- source_word: οὐ δοκεῖ
  choice: scheint es nicht … zu sein
  rationale: δοκέω bezeichnet hier ein Erscheinen oder Dafürhalten. Die deutsche Formulierung bewahrt den rhetorischen Charakter und fügt keinen im Griechischen unausgedrückten Beurteiler hinzu.
- source_word: τὸν πάντων κτίστην
  choice: den Schöpfer aller Dinge
  rationale: κτίστης bedeutet „Schöpfer“ oder „Urheber“; πάντων verleiht der Aussage universale Reichweite. „Aller Dinge“ ist im Deutschen klar und würdevoll.
- source_word: εὐσεβοῦμεν
  choice: wir … verehren
  rationale: Das Verb bezeichnet ehrfürchtige, religiöse Hingabe. „Verehren“ gibt diese Haltung gegenüber dem Schöpfer wieder, ohne den Bedeutungsumfang vorschnell auf einen bestimmten kultischen Akt einzuengen.
- source_word: κατὰ
  choice: nach
  rationale: κατά mit dem Akkusativ bezeichnet hier die Norm, an der sich die Lebensführung ausrichtet. „Nach“ ist dafür im Deutschen natürlich und präzise.
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: seinem edlen Gesetz
  rationale: ἔναρετος bezeichnet etwas Tugendhaftes, sittlich Vortreffliches oder Edles. Bei „Gesetz“ ist „edel“ im Deutschen natürlicher als das missverständliche „tugendhaft“, bewahrt aber die positive ethische Qualität.
- source_word: ζῶμεν
  choice: leben
  rationale: Das Verb bezeichnet hier die Lebensführung. „Nach … leben“ ist knapp, idiomatisch und bildet den griechischen Ausdruck angemessen ab.
theological_decisions:
- issue: Wiedergabe von εὐσεβοῦμεν gegenüber dem Schöpfer
  choice: wir verehren
  alternative: wir beten an
  rationale: Der Kontext ist eindeutig religiös, doch εὐσεβέω umfasst ehrfürchtige Frömmigkeit und Verehrung und bezeichnet nicht zwingend nur den engeren Akt der Anbetung. „Verehren“ wahrt diesen Bedeutungsumfang.
- issue: Rhetorische Aussagekraft von ἢ und οὐ δοκεῖ
  choice: Oder scheint es nicht …?
  alternative: Oder gilt es nicht als …?
  rationale: „Oder“ bewahrt den Anschluss an die vorausgehende Argumentation. Die negative Frage bleibt bestehen, ohne ihre im Griechischen vorhandene Spannung in eine positive Feststellung umzudeuten.
- issue: Ethische Qualität des Gesetzes in ἔναρετον
  choice: edles Gesetz
  alternative: tugendhaftes Gesetz
  rationale: Das Gesetz wird als sittlich vortrefflich charakterisiert. „Edel“ vermittelt diese Wertung in natürlichem Deutsch, ohne dem Gesetz im technisch-philosophischen Sinn eine menschliche Tugend zuzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die etwas auffällige negative rhetorische Frage wird entsprechend dem griechischen Wortlaut beibehalten; „edel“ vermeidet die unnatürliche Verbindung „tugendhaftes Gesetz“, ohne die ethische Wertung abzuschwächen.
