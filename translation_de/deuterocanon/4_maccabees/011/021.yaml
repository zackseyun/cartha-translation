  text: For godly understanding is unconquerable[a], O tyrant.
translation:
  language: de
  text: Denn die von Gottesfurcht geprägte Erkenntnis[a] ist unbesiegbar, du Tyrann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die fromme Vernunft« oder »die gottesfürchtige Einsicht«. Der griechische Ausdruck verbindet Ehrfurcht vor Gott mit Erkenntnis und vernünftigem Verstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνίκητος
  choice: unbesiegbar
  rationale: Das Prädikatsadjektiv bezeichnet, was nicht besiegt oder überwunden werden kann. »Unbesiegbar« bildet die Wortwurzel von νικάω natürlich und prägnant ab.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die Aussage im Zusammenhang; »denn« ist dafür die direkte deutsche Entsprechung.
- source_word: ὦ τύραννε
  choice: du Tyrann!
  rationale: Die Vokativpartikel ὦ kennzeichnet die direkte, nachdrückliche Anrede. Im heutigen Deutsch gibt »du Tyrann!« deren polemische Kraft natürlicher wieder als das altertümliche »o Tyrann«.
- source_word: ἡ εὐσεβὴς ἐπιστήμη
  choice: die von Gottesfurcht geprägte Erkenntnis
  rationale: ἐπιστήμη bezeichnet Erkenntnis beziehungsweise verständige Einsicht; εὐσεβής kennzeichnet sie als durch Ehrfurcht vor Gott bestimmt. Die Formulierung bewahrt beide Aspekte, ohne den Ausdruck vorschnell auf bloßes Wissen oder eine technische Vernunftlehre festzulegen.
theological_decisions:
- issue: Wiedergabe des programmatischen Ausdrucks εὐσεβὴς ἐπιστήμη
  choice: die von Gottesfurcht geprägte Erkenntnis
  alternative: die fromme Vernunft; die gottesfürchtige Einsicht
  rationale: Der Ausdruck verbindet verstandesmäßige Erkenntnis mit Ehrfurcht vor Gott. Die gewählte Wiedergabe erhält diese theologisch-ethische Verbindung und lässt offen, ob im Kontext stärker Erkenntnis, Einsicht oder vernünftiges Urteilen hervorgehoben wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede ist bewusst kraftvoll formuliert; die zentrale Wendung wird verständlich entfaltet, während ihre begriffliche Spannweite in der Fußnote erhalten bleibt.
