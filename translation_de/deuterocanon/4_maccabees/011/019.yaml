  text: And after heating sharp spits[a], they applied them to his back; and after piercing his sides, they burned his entrails from it.
translation:
  language: de
  text: Dann erhitzten sie spitze Spieße und hielten sie ihm an den Rücken. Sie durchbohrten seine Seiten und verbrannten ihm von dort aus[a] die Eingeweide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihm“ oder „von diesem aus“. Worauf sich die griechische Wendung bezieht, ist nicht eindeutig; möglicherweise ist gemeint, dass das Verbrennen von den durchbohrten Seiten aus ins Körperinnere drang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀβελίσκους ὀξεῖς
  choice: spitze Spieße
  rationale: ὀβελίσκος bezeichnet einen kleinen Brat- oder Metallspieß; „Spieße“ ist im Deutschen präzise genug und vermeidet die unpassende Verkleinerungsform „Spießchen“. ὀξεῖς hebt ihre scharfe Spitze hervor.
- source_word: πυρώσαντες
  choice: Dann erhitzten sie
  rationale: Das aoristische Partizip bezeichnet die dem Anlegen vorausgehende Erhitzung. „Dann erhitzten sie“ gibt den Handlungsablauf natürlich wieder, ohne ausdrücklich ein Glühen zu behaupten.
- source_word: τοῖς νώτοις προσέφερον
  choice: hielten sie ihm an den Rücken
  rationale: προσφέρω bedeutet hier, die Folterwerkzeuge an den Rücken heranzubringen beziehungsweise dort anzusetzen. „hielten … an“ ist natürlich und deutet den ausgeübten Druck nicht unnötig aus.
- source_word: τὰ πλευρὰ διαπείραντες
  choice: Sie durchbohrten seine Seiten
  rationale: διαπείρω bezeichnet ein Hindurchstechen oder Durchbohren; πλευρά meint hier die Körperseiten beziehungsweise Flanken, nicht zwingend nur die Rippen.
- source_word: τὰ σπλάγχνα διέκαιον
  choice: verbrannten ihm … die Eingeweide
  rationale: σπλάγχνα bezeichnet in diesem körperlichen Zusammenhang die inneren Organe. Das Imperfekt διέκαιον schildert das fortdauernde Verbrennen innerhalb der Foltersequenz.
- source_word: ἀπʼ αὐτοῦ
  choice: von dort aus
  rationale: Die Wendung lautet formal „von ihm/von diesem aus“ und ihr Bezug ist nicht eindeutig. Im Zusammenhang liegt ein räumlicher Ausgangspunkt an den durchbohrten Seiten nahe; „von dort aus“ ist verständlich, während eine Fußnote die genuine Mehrdeutigkeit bewahrt.
theological_decisions:
- issue: Mehrdeutiger Bezug von ἀπʼ αὐτοῦ
  choice: räumlich „von dort aus“ mit Fußnote
  alternative: „von ihm aus“, „von diesem aus“ oder instrumentales „damit“
  rationale: Der griechische Singular lässt seinen Bezug offen. Die Übersetzung macht den wahrscheinlichen räumlichen Zusammenhang lesbar, kennzeichnet ihn aber als Auslegung und entscheidet nicht stillschweigend zwischen Körper, Einstichstelle oder Werkzeug.
translation_notes:
