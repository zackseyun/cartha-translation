  yaml_path: translation/deuterocanon/4_maccabees/011/015.yaml
  text: For since we were both born and brought up for the same things[a], we likewise ought to die for the same things.
translation:
  language: de
  text: Denn für dasselbe sind wir geboren und erzogen worden; ebenso sollen wir auch für dasselbe sterben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für dieselbe Sache“ oder „für dieselben Grundsätze“. Der griechische Text gebraucht in beiden Satzteilen bewusst eine breite Wendung, wörtlich „dieselben Dinge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ αὐτά
  choice: für dasselbe
  rationale: Die Wendung bezeichnet hier Ausrichtung oder Zweck. Das breite substantivierte Singularpronomen ist im Deutschen natürlicher als „für dieselben Dinge“ und bewahrt zugleich die Unbestimmtheit sowie die Wiederholung des Griechischen.
- source_word: γενηθέντες
  choice: geboren wurden
  rationale: Im familiären und biografischen Zusammenhang gibt das die Bedeutung des Aoristpartizips natürlich und genau wieder.
- source_word: τραφέντες
  choice: aufgezogen wurden
  rationale: Gemeint ist die Erziehung und das Heranwachsen, nicht nur körperliche Ernährung.
- source_word: ὑπὲρ τῶν αὐτῶν
  choice: für dasselbe
  rationale: ὑπέρ bezeichnet hier das Eintreten beziehungsweise Sterben für die gemeinsamen Anliegen. Die Wiederholung von „für dasselbe“ wahrt die bewusst breite Formulierung des Ausgangstextes.
- source_word: ἀποθνήσκειν
  choice: sterben
  rationale: Die schlichte Wiedergabe legt keine ausdrücklich nicht genannte handelnde Instanz fest.
- source_word: ὀφείλομεν
  choice: müssen wir
  rationale: Das deutsche Modalverb bringt die moralische Verpflichtung idiomatisch und mit angemessener Stärke zum Ausdruck.
- source_word: ὁμοίως
  choice: gleicherweise auch
  rationale: Die Formulierung hebt die Entsprechung zwischen gemeinsamer Geburt und Erziehung einerseits und gemeinsamem Sterben andererseits hervor.
theological_decisions:
- issue: Ob der nicht näher bestimmte Bezug als „Grundsätze“, „Sache“ oder „Gesetz“ konkretisiert werden soll
  choice: Die breite Formulierung „dasselbe“ wird in beiden Satzteilen beibehalten.
  alternative: „dieselben Grundsätze“, „dieselbe Sache“ oder „dasselbe Gesetz“
  rationale: Der griechische Text wiederholt τὰ αὐτά beziehungsweise τῶν αὐτῶν, ohne den Gegenstand ausdrücklich zu benennen. Der Kontext betrifft zwar gemeinsame Bindungen und das Gesetz, doch eine Konkretisierung würde die im Vers vorhandene Offenheit vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wendung „gleicherweise auch“ bildet die Symmetrie des griechischen Satzes ab; „aufgezogen“ ist allgemein verständlich und erfasst Erziehung wie Versorgung.
