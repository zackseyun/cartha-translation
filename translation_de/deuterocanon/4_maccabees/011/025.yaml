base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/025.yaml
  text: For your not being able to persuade our reason[a], nor to compel us to eat defiled food—is that not your defeat?
translation:
  language: de
  text: Ist es denn nicht deine Niederlage, dass du weder unser vernünftiges Urteil umstimmen noch uns zum Fleischessen[a] zwingen konntest?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, dem Zusammenhang entsprechend: „zum Verzehr verbotenen Fleisches“ beziehungsweise „zum Essen unreiner Speisen“. Das griechische Wort bedeutet wörtlich „Fleischessen“; hier geht es um Fleisch, dessen Verzehr nach dem jüdischen Gesetz verboten ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνηθῆναί σε
  choice: dass du … nicht konntest
  rationale: Die substantivierte Infinitivkonstruktion bezeichnet das Unvermögen des Angesprochenen. Im Deutschen gibt ein mit „dass“ eingeleiteter Satz den Sinn natürlich wieder; zusammen mit μήτε wird daraus die paarige Verneinung „weder … noch“.
- source_word: μεταπεῖσαι
  choice: umstimmen
  rationale: Das Verb bezeichnet hier das Herbeiführen einer Meinungsänderung. „Umstimmen“ bringt diesen Aspekt genauer zum Ausdruck als das allgemeinere „überzeugen“.
- source_word: τὸν λογισμὸν ἡμῶν
  choice: unsere Vernunft
  rationale: λογισμός ist im 4. Makkabäerbuch ein Schlüsselbegriff für vernünftiges, sittliches Urteilen. „Vernunft“ bewahrt diese begriffliche Bedeutung, ohne sie auf bloße Entschlossenheit zu verengen.
- source_word: βιάσασθαι
  choice: zwingen
  rationale: Das Verb bezeichnet die Anwendung von Gewalt oder Zwang. „Zwingen“ ist im modernen Deutsch klar und bildet den Gegensatz zum versuchten Umstimmen ab.
- source_word: πρὸς τὴν μεμοφαγίαν
  choice: zum Fleischessen
  rationale: Das seltene Substantiv μεμοφαγία bedeutet wörtlich „Fleischessen“. Die Übersetzung bleibt im Haupttext nahe am griechischen Ausdruck; der gesetzlich verbotene Charakter des Fleisches wird in der Fußnote erläutert.
- source_word: οὐ κατάλυσίς ἐστιν σου;
  choice: ist das nicht deine Niederlage?
  rationale: κατάλυσις kann Auflösung, Sturz oder Unterliegen bezeichnen. In der herausfordernden rhetorischen Frage gibt „Niederlage“ den gemeinten Triumph über den Verfolger klar und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des philosophisch und theologisch geprägten Begriffs λογισμός
  choice: unsere Vernunft
  alternative: unser vernünftiges Urteil; unsere Überzeugung
  rationale: Das Buch stellt die fromme Vernunft den Leidenschaften gegenüber. „Vernunft“ erhält dieses Leitmotiv, während „Überzeugung“ den Begriff zu stark auf die konkrete Standhaftigkeit beschränken würde.
- issue: Grad der kontextuellen Auslegung von μεμοφαγία
  choice: zum Fleischessen
  alternative: zum Essen verbotenen Fleisches; zum Essen unreiner Speise
  rationale: Der Erzählzusammenhang handelt von Fleisch, dessen Verzehr nach jüdischem Gesetz verboten ist; der griechische Ausdruck selbst sagt jedoch nur „Fleischessen“. Daher bleibt der Haupttext formal näher an der Quelle, während die Fußnote den Kontext erschließt.
- issue: Bedeutung von κατάλυσις in der rhetorischen Frage
  choice: deine Niederlage
  alternative: dein Untergang; dein Scheitern
  rationale: „Niederlage“ bewahrt die konfrontative Stoßrichtung, ohne den Ausdruck eschatologisch als endgültigen Untergang zu überdeuten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Konstruktion „weder … noch“ glättet die griechische Syntax, ohne die doppelte Unfähigkeit – weder durch Überredung noch durch Zwang – abzuschwächen. Der Gedankenstrich erhält die zugespitzte rhetorische Wirkung der Schlussfrage.
