  yaml_path: translation/deuterocanon/4_maccabees/011/026.yaml
  text: Your fire is cold to us[a], your catapults are painless, and your violence is powerless.
translation:
  language: de
  text: Dein Feuer ist für uns kalt, die Katapulte bereiten keine Schmerzen[a], und deine Gewalt ist machtlos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Foltergeräte bereiten keine Schmerzen«. Das griechische Wort bezeichnet wörtlich Katapulte oder Wurfmaschinen, kann hier aber allgemeiner mechanische Foltergeräte meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πῦρ σου
  choice: dein Feuer
  rationale: Die direkte Wiedergabe bewahrt das konkrete Bild des Folterfeuers und die Anrede an den Tyrannen.
- source_word: ψυχρὸν ἡμῖν
  choice: ist für uns kalt
  rationale: ψυχρόν bedeutet wörtlich „kalt“; der Dativ ἡμῖν bezeichnet die Betroffenen. Die paradoxe Formulierung bleibt bewusst erhalten.
- source_word: ἄπονοι
  choice: bereiten keine Schmerzen
  rationale: Das prädikative Adjektiv bedeutet hier „schmerzlos“ beziehungsweise „keine Schmerzen verursachend“. Die verbale Formulierung ist im Deutschen in Verbindung mit „Katapulte“ natürlicher.
- source_word: οἱ καταπέλται
  choice: deine Katapulte
  rationale: καταπέλται bezeichnet wörtlich Katapulte oder Wurfmaschinen. Das ergänzte Possessivpronomen entspricht der Anrede und dem parallelen Aufbau der beiden benachbarten Satzglieder.
- source_word: ἀδύνατος
  choice: ist machtlos
  rationale: Das Adjektiv bezeichnet fehlende Kraft oder Wirksamkeit und bildet zusammen mit „Gewalt“ die pointierte Schlussaussage.
- source_word: ἡ βία σου
  choice: deine Gewalt
  rationale: βία kann „Kraft“, „Zwang“ oder „Gewalt“ bedeuten; im Verfolgungs- und Folterkontext trifft „Gewalt“ sowohl die physische als auch die moralische Dimension.
theological_decisions:
- issue: Rhetorisches Paradox in der Rede der Märtyrer
  choice: Die Bilder werden unmittelbar als trotzige Aussage über die Wirkungslosigkeit der Folter wiedergegeben.
  alternative: Das Paradox abschwächen, etwa mit „dein Feuer fühlt sich für uns kühl an“.
  rationale: Der Vers behauptet im Rahmen der Märtyrerrede die Überlegenheit standhaften Leidens über die Gewalt des Tyrannen. Die direkte Wiedergabe erhält die Spannung, ohne sie als Aussage über die tatsächliche Temperatur auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der dreigliedrige, herausfordernde Satzbau und die paradoxen Prädikate des Griechischen bleiben erhalten; bei ἄπονοι wird zugunsten natürlichen Deutschen verbal formuliert.
