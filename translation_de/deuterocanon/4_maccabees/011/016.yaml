translation:
  language: de
  text: Wenn du es also für richtig hältst, Menschen zu foltern, die keine verunreinigende Speise essen[a], dann foltere uns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die keine Verunreinigung essen«; gemeint sind im Zusammenhang Menschen, die sich weigern, verunreinigende Speise zu essen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστʼ
  choice: also
  rationale: Leitet eine Folgerung aus dem vorausgehenden Gedankengang ein und klingt im modernen Deutschen natürlich.
- source_word: εἰ σοὶ δοκεῖ
  choice: wenn du es für richtig hältst
  rationale: Gibt die unpersönliche Wendung mit Dativ idiomatisch wieder und bewahrt zugleich den herausfordernden Ton gegenüber dem Angeredeten.
- source_word: βασανίζειν / βασάνιζε
  choice: zu foltern / foltere
  rationale: Im Kontext des Martyriums bezeichnet das Verb gezielt körperliche Qual; die Wiederholung im Griechischen wird als rhetorisches Stilmittel erhalten.
- source_word: μὴ μεμοφαγοῦντας
  choice: die keine verunreinigende Speise essen
  rationale: Die partizipiale Wendung bezeichnet hier Menschen, die den Verzehr kultisch beziehungsweise gesetzlich verunreinigender Nahrung verweigern. „Speise“ macht den im Zusammenhang vorausgesetzten Gegenstand im Deutschen deutlich, ohne die Aussage konfessionell auszudeuten.
- source_word: βασάνιζε
  choice: dann foltere uns
  rationale: Das im Griechischen nicht eigens genannte Objekt ist durch Sprecher und Situation eindeutig; „uns“ ist für einen natürlichen und klaren deutschen Satz erforderlich.
theological_decisions:
- issue: Der Gegenstand des Essens in μὴ μεμοφαγοῦντας
  choice: als „verunreinigende Speise“ ausdrücklich gemacht
  alternative: „die nicht essen“ oder wörtlicher „die keine Verunreinigung essen“
  rationale: Der unmittelbare Zusammenhang handelt von der Weigerung, unerlaubte und verunreinigende Nahrung zu essen. Die Ergänzung verdeutlicht die Ellipse, ohne eine weitergehende theologische Festlegung einzuführen.
- issue: Das unausgesprochene Objekt des abschließenden Imperativs
  choice: mit „uns“ wiedergegeben
  alternative: 'objektlos: „dann foltere“'
  rationale: Das Objekt ergibt sich eindeutig aus der direkten Herausforderung der Sprecher. Seine Ergänzung entspricht natürlichem Deutsch und verändert den sachlichen Gehalt nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt die scharfe Herausforderung und die Wiederholung von βασανίζω, vermeidet aber eine unnötig hölzerne Wiedergabe der griechischen Ellipsen.
