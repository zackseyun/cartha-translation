base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/020.yaml
  text: But while he was being tortured[a], as one belonging to a holy age, he said, “For the sake of godliness, when so many brothers were called into training in sufferings, we were not conquered.”
translation:
  language: de
  text: 'Doch während er gefoltert wurde, sagte er als einer von heiliger Lebensweise[a]: »Um der Gottesfurcht willen wurden so viele Brüder zu einem Training im Leiden gerufen, und wir wurden nicht besiegt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, näher am Wortlaut und ungewöhnlich: »als einer eines heiligen Zeitalters«. Die griechische Wendung ist mehrdeutig: αἰών kann ein Zeitalter oder eine Lebenszeit, aber auch eine Lebensweise bezeichnen; daher kann die Aussage eine dem Heiligen angemessene Lebensweise meinen.'
    reason: Lexikalische Alternative für die mehrdeutige Wendung ἱεροπρεποῦς αἰῶνος.
lexical_decisions:
- source_word: βασανιζόμενος
  choice: während er gefoltert wurde
  rationale: Das durative Partizip bezeichnet im Märtyrerkontext konkrete körperliche Folter; die temporale Wiedergabe wahrt den fortdauernden Vorgang.
- source_word: ἱεροπρεποῦς αἰῶνος
  choice: als einer, der einem heiligen Lebensalter angehörte
  rationale: Die ungewöhnliche Genitivverbindung wird bewusst eng und ebenso ungewöhnlich wiedergegeben. αἰών kann ein Zeitalter, eine Lebenszeit oder eine Lebensweise bezeichnen; die Fußnote bewahrt diese Mehrdeutigkeit.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Das Wort bezeichnet hier die auf Gott ausgerichtete, im treuen Handeln sichtbare Frömmigkeit. „Gottesfurcht“ ist im biblischen Register verständlich und vermeidet die heute teils äußerliche Färbung von „Frömmigkeit“.
- source_word: γυμνασίαν πόνων
  choice: Training in Leiden
  rationale: „Training“ erhält das für das Buch wichtige Bild der athletischen Übung; „Leiden“ gibt die Schmerzen und Mühen von πόνοι im Folterkontext natürlich wieder.
- source_word: ἀδελφοὶ
  choice: Brüder
  rationale: Gemeint sind die leiblichen Brüder des Sprechers, nicht eine gemischtgeschlechtliche Gruppe.
- source_word: κληθέντες
  choice: wurden ... gerufen
  rationale: Die passive Form bewahrt sowohl den Gedanken einer Aufforderung beziehungsweise Berufung als auch den, dass die Brüder in die Prüfung hineingerufen wurden.
- source_word: οὐκ ἐνικήθημεν
  choice: wir wurden nicht besiegt
  rationale: Die passive Form und das Siegesmotiv von νικάω bleiben erhalten; die Folterer konnten die Brüder nicht überwinden.
theological_decisions:
- issue: Deutung von ἱεροπρεποῦς αἰῶνος
  choice: als einer, der einem heiligen Lebensalter angehörte
  alternative: als einer von geheiligter Lebensweise; als einer, der ein heiliges Leben führte
  rationale: Die griechische Wendung ist verdichtet und mehrdeutig. Der Haupttext bewahrt ihre auffällige Zeit- beziehungsweise Lebensalter-Bildlichkeit, während die Fußnote die wahrscheinlich idiomatische Deutung als geheiligte Lebensweise nennt, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Formulierung „heiliges Lebensalter“ bleibt zur Wahrung der Mehrdeutigkeit stehen und wird durch die Fußnote erläutert. Das athletische Bild wird mit „Training“ bewusst erhalten.
