  text: Now look[a], being alien to God[b], you are making war against those who are devout toward God.
translation:
  language: de
  text: 'Nun sieh: Von Gott entfremdet[a], führst du Krieg[b] gegen die, die Gott verehren.'
  philosophy: optimal-equivalence
  footnotes:
