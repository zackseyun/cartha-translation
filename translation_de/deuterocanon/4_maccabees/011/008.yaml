lexical_decisions:
- source_word: νῦν
  choice: Nun
  rationale: Bewahrt die zeitliche beziehungsweise diskursive Einleitung und ihre rhetorische Unmittelbarkeit.
- source_word: ἰδὲ
  choice: sieh
  rationale: Der Aufmerksamkeitsimperativ wird direkt und in heutigem Deutsch wiedergegeben; „siehe“ wäre deutlich altertümlicher.
- source_word: ἀλλότριος ὢν θεοῦ
  choice: Von Gott entfremdet
  rationale: Gibt die durch ἀλλότριος mit Genitiv bezeichnete Trennung von Gott knapp wieder, ohne daraus eine ausgearbeitete dogmatische Kategorie zu machen. Die partizipiale Fügung bleibt erhalten und legt ihr Verhältnis zum Hauptsatz nicht ausdrücklich kausal fest.
- source_word: πολεμεῖς
  choice: führst du Krieg
  rationale: Bewahrt die starke militärische Bildsprache und die gegenwärtige, aktive Feindschaft.
- source_word: τοὺς εὐσεβοῦντας
  choice: die … ehrfürchtig dienen
  rationale: Gibt die fortdauernde Gottesverehrung der durch das substantivierte Präsenspartizip bezeichneten Menschen natürlich wieder.
- source_word: εἰς τὸν θεόν
  choice: Gott
  rationale: Im Deutschen bezeichnet der Dativ bei „dienen“ idiomatisch das Ziel beziehungsweise den Gegenstand der frommen Hingabe, den εἰς im Griechischen markiert.
theological_decisions:
- issue: Beziehungsbedeutung von ἀλλότριος θεοῦ
  choice: Von Gott entfremdet
  alternative: Gott fremd; nicht zu Gott gehörend
  rationale: Im Zusammenhang bezeichnet die Wendung die Trennung des Tyrannen von Gott und seine gottwidrige Haltung, nicht ethnische Fremdheit. „Entfremdet“ bewahrt diese relationale und moralische Schärfe, ohne eine spätere Lehrformel einzuführen.
- issue: Verhältnis des Partizips ὢν zum Hauptverb
  choice: Partizipiale Fügung ohne ausdrückliche Kausalpartikel
  alternative: Weil du von Gott entfremdet bist
  rationale: Das Griechische kann einen begründenden Zusammenhang nahelegen, kennzeichnet ihn jedoch nicht ausdrücklich. Die knappe deutsche Fügung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die scharfe Konfrontation bleiben erhalten; altertümliche Formen und konfessionell geprägte Fachsprache werden vermieden.
