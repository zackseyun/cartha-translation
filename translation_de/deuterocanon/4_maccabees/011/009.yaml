  text: As he was saying such things[a], the bodyguards bound him and dragged him to the wheel.
translation:
  language: de
  text: Während er so redete, fesselten ihn die Leibwächter und schleppten ihn zur Foltermaschine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bedeutet gewöhnlich »Katapult«, bezeichnet hier aber ein Foltergerät; möglicherweise ist ein Folterrad gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαῦτα λέγοντα
  choice: Während er so redete
  rationale: Die Wendung gibt den allgemeinen Rückverweis von τοιαῦτα und die Gleichzeitigkeit des präsentischen Partizips natürlich wieder.
- source_word: δορυφόροι
  choice: Leibwächter
  rationale: Wörtlich sind es Speerträger; im hellenistischen Sprachgebrauch bezeichnet das Wort häufig königliche Leibwächter.
- source_word: δήσαντες
  choice: fesselten
  rationale: Das Aoristpartizip bezeichnet die der Schleppbewegung vorausgehende gewaltsame Fesselung.
- source_word: εἵλκον
  choice: schleppten
  rationale: Das Imperfekt schildert die fortgesetzte gewaltsame Bewegung; „schleppten“ trifft diese Gewalt im Deutschen.
- source_word: καταπέλτην
  choice: Foltermaschine
  rationale: Das Wort bezeichnet gewöhnlich ein Katapult, meint im vorliegenden Folterkontext jedoch offenbar ein Foltergerät. „Foltermaschine“ wahrt die Unsicherheit über dessen genaue Bauart.
theological_decisions:
- issue: Deutung von καταπέλτην im Folterkontext
  choice: Foltermaschine
  alternative: Rad; Katapult
  rationale: Die genaue Art des Geräts ist lexikalisch und historisch unsicher. „Rad“ wäre anschaulich, legt aber eine nicht ausdrücklich bezeichnete Bauform fest; „Katapult“ würde heutige Leser irreführen. Die Übersetzung bewahrt daher die sachliche Unbestimmtheit, während die Fußnote die wörtliche Bedeutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Satzbau und die gewaltsamen Verben erhalten die Härte der griechischen Darstellung; die Gerätebezeichnung wird bewusst nicht stärker präzisiert als die Quelle.
