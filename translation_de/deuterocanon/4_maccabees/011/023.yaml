base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/023.yaml
  text: By bringing against yourself a great avenger as well[a], you innovator of tortures and enemy of those who are truly reverent.
translation:
  language: de
  text: indem auch ich einen mächtigen Rächer[a] gegen dich aufbiete, du Erfinder neuartiger Foltern und Feind derer, die Gott wahrhaft verehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen mächtigen Rachegeist«; das griechische Wort kann einen persönlichen Rächer oder eine vergeltende Macht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγαν
  choice: mächtigen
  rationale: Das Adjektiv verstärkt ἀλάστορα; »mächtig« gibt die Wirksamkeit des drohenden Rächers im Deutschen natürlicher wieder als das hier blassere »groß«.
- source_word: σοι
  choice: gegen dich
  rationale: Der Dativ bezeichnet bei προσβάλλω das Ziel der feindlichen Handlung. καὶ αὐτός bezieht sich dagegen auf das handelnde Subjekt (»auch ich selbst«), sodass σοι nicht reflexiv als »gegen dich selbst« zu verstehen ist.
- source_word: προσβαλλὼν
  choice: auf den Plan rufe
  rationale: Das Partizip beschreibt, dass der Sprecher einen Rächer gegen den Angeredeten heranführt bzw. auf ihn ansetzt. Die Wendung ist im Deutschen idiomatisch und bewahrt die aktive Verursachung.
- source_word: καὶ αὐτὸς
  choice: auch ich
  rationale: Das nominativische αὐτός hebt den Sprecher als weiteres handelndes Subjekt hervor. »Auch ich« bewahrt diesen syntaktischen Bezug.
- source_word: ἀλάστορα
  choice: Rächer
  rationale: ἀλάστωρ kann einen persönlichen Rächer oder eine vergeltende Macht bzw. einen Rachegeist bezeichnen. »Rächer« ist im Haupttext knapp und verständlich; die weitere Bedeutungsnuance steht in der Fußnote.
- source_word: καινοτόμε τῶν βασάνων
  choice: du Erfinder neuartiger Foltern
  rationale: καινοτόμος bezeichnet jemanden, der Neues einführt oder ersinnt. Zusammen mit βασάνων ist die konkrete, natürliche Wiedergabe »Erfinder neuartiger Foltern« angemessen.
- source_word: πολέμιε
  choice: Feind
  rationale: Der Vokativ bezeichnet den Angeredeten unmittelbar als Gegner.
- source_word: τῶν ἀληθῶς εὐσεβούντων
  choice: aller, die Gott wahrhaft verehren
  rationale: εὐσεβέω bezeichnet hier echte religiöse Ehrfurcht und Frömmigkeit. Die verbale Wiedergabe ist für heutige Leser klarer als das substantivierte »die wahrhaft Frommen«; »aller« gibt den generischen bestimmten Plural idiomatisch wieder.
theological_decisions:
- issue: Religiöser Gehalt von εὐσεβούντων
  choice: die Gott wahrhaft verehren
  alternative: die wahrhaft fromm leben
  rationale: Im Kontext bezeichnet εὐσεβέω eine echte, auf Gott gerichtete Frömmigkeit. Die gewählte Formulierung macht diesen Bezug verständlich, ohne eine konfessionell geprägte Fachbedeutung einzutragen.
- issue: Identität des ἀλάστωρ
  choice: Rächer mit offener Bedeutungsweite
  alternative: Rachegeist
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, ob eine Person oder eine überpersönliche vergeltende Macht gemeint ist. Der Haupttext entscheidet dies nicht ausdrücklich; die Fußnote bewahrt die Alternative.
translation_notes:
  register: Moderne, würdige Anklagerede. Die aneinandergereihten Vokative bleiben erhalten. Da der griechische Text mit einem Partizip einsetzt und offenbar syntaktisch an den vorausgehenden Vers anschließt, beginnt die Wiedergabe bewusst mit »indem«. Die Grammatik von καὶ αὐτός wird gegenüber der englischen Konsultationsfassung eigenständig als »auch ich« wiedergegeben.
