  terminology: „Rächer“ mit der Fußnotenalternative „Rachegeist“ bewahrt die lexikalische Offenheit von ἀλάστωρ. „Erfinder neuartiger Foltern“ und „Feind derer, die Gott wahrhaft verehren“ treffen und erhalten den anklagenden Registerton sowie den religiösen Gehalt von εὐσεβούντων.
