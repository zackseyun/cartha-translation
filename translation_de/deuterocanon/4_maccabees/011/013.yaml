  yaml_path: translation/deuterocanon/4_maccabees/011/013.yaml
  text: And after this one had died, the sixth youth was brought forward. When the tyrant asked whether he wanted to be released if he ate, he said,
translation:
  language: de
  text: 'Nachdem auch dieser gestorben war, wurde der sechste junge Mann vorgeführt. Als der Tyrann ihn fragte, ob er freigelassen werden wolle, wenn er esse, sagte er:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τελευτήσαντος δὲ καὶ τούτου
  choice: Nachdem auch dieser gestorben war
  rationale: Der temporale Genitivus absolutus bezeichnet den Tod des zuvor genannten Bruders. „Gestorben“ ist klar und vermeidet den nicht ausdrücklich genannten Zusatz „Märtyrertod“; καί wird mit „auch“ wiedergegeben.
- source_word: ὁ ἕκτος ... μειρακίσκος
  choice: der sechste junge Mann
  rationale: Das substantivierte Ordinal und μειρακίσκος werden natürlich verbunden. „Junger Mann“ wahrt die Altersangabe, ohne ihn als Kind festzulegen oder „Bruder“ aus dem Kontext einzufügen.
- source_word: ἤγετο
  choice: wurde vorgeführt
  rationale: Im Kontext der öffentlichen Befragung und Hinrichtung bezeichnet ἄγω nicht nur das Führen, sondern das Vorbringen vor den Tyrannen. Das deutsche Imperfekt wird idiomatisch mit Präteritum wiedergegeben.
- source_word: πυνθανομένου τοῦ τυράννου
  choice: Als der Tyrann ihn fragte
  rationale: Die Partizipialkonstruktion wird als natürlicher deutscher Temporalsatz wiedergegeben. „Tyrann“ bewahrt die wertende Bezeichnung des griechischen Textes.
- source_word: εἰ βούλοιτο
  choice: ob er ... wolle
  rationale: Der Optativ in indirekter Frage wird im Deutschen angemessen durch Konjunktiv I wiedergegeben und bewahrt den Bezug auf den Willen des jungen Mannes.
- source_word: φαγὼν ἀπολύεσθαι
  choice: essen und dafür freigelassen werden
  rationale: Das Aoristpartizip bezeichnet das Essen als Bedingung beziehungsweise Gegenleistung für die Freilassung. „Dafür“ macht diesen Zusammenhang idiomatisch deutlich, ohne den im Vers nicht genannten Gegenstand des Essens zu ergänzen.
- source_word: ὁ δὲ ἔφη
  choice: 'sagte er:'
  rationale: Die Erzählformel leitet die im folgenden Vers stehende Antwort ein. Der Doppelpunkt hält den Satz entsprechend offen.
theological_decisions:
- issue: Moralische Charakterisierung des Herrschers durch τύραννος
  choice: der Tyrann
  alternative: der König; der Herrscher
  rationale: Die ausdrücklich wertende Bezeichnung des Autors wird nicht zu einem neutralen Herrschertitel abgeschwächt.
- issue: Ob die Speise als verboten oder unrein bezeichnet werden soll
  choice: essen
  alternative: von der verbotenen Speise essen; das Opferfleisch essen
  rationale: Der Gegenstand des Essens ergibt sich aus dem weiteren Zusammenhang, wird in diesem Vers aber nicht genannt und deshalb nicht ergänzt.
- issue: Verhältnis von Essen und Freilassung
  choice: essen und dafür freigelassen werden
  alternative: freigelassen werden, wenn er esse; essen, um freigelassen zu werden
  rationale: Die Formulierung bewahrt den konditionalen beziehungsweise instrumentalen Spielraum des Partizips und stellt keine weitergehende Motivation fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax wurde gegenüber der griechischen Partizipialkonstruktion behutsam geglättet; die wertende Erzählperspektive und der offene Übergang zur folgenden Antwort bleiben erhalten.
