lexical_decisions:
- source_word: κατὰ τοῦτον τὸν τρόπον καί
  choice: auf diese Weise auch
  rationale: Die Wendung gibt die vergleichende beziehungsweise fortführende Funktion idiomatisch wieder und bewahrt mit „auch“ die Kraft von καί.
- source_word: πνεῦμα
  choice: Geist
  rationale: „Geist“ wahrt neben „Körper“ die Bezeichnung der inneren beziehungsweise belebenden Lebensdimension, ohne das Wort auf den bloßen Atem oder die Psyche festzulegen.
- source_word: στενοχωρούμενος
  choice: bedrängt
  rationale: Das Partizip bezeichnet ein Beengt- oder Bedrängtwerden. „Bedrängt“ klingt im Deutschen natürlich und lässt sowohl die bildhafte Enge als auch innere Not anklingen.
- source_word: σῶμα
  choice: Körper
  rationale: „Körper“ ist hier die klare und natürliche Entsprechung und erhält den Gegensatz zu „Geist“.
- source_word: ἀγχόμενος
  choice: gewürgt wurde
  rationale: Das Verb bezeichnet ein Würgen beziehungsweise Zuschnüren der Kehle. Die passive Verlaufsform gibt den andauernden Vorgang wieder, ohne seinen Ausgang vorwegzunehmen.
theological_decisions:
- issue: Anthropologische Unterscheidung zwischen πνεῦμα und σῶμα
  choice: Das Begriffspaar wird als „Geist“ und „Körper“ unterschieden wiedergegeben.
  alternative: πνεῦμα könnte körperlich als „Atem“ oder psychologisch als „Inneres“ verstanden werden.
  rationale: Die Gegenüberstellung beschreibt eine innere und eine körperliche Dimension des Leidens. „Geist“ und „Körper“ bewahren diese Spannung, ohne daraus eine ausgearbeitete Lehre über die menschliche Natur abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktisch offene, an den Kontext anschließende Form des griechischen Versfragments sowie die parallelen Passivkonstruktionen bleiben erhalten.
