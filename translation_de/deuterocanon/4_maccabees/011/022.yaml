  text: Auch ich werde, mit edler Tugend[a] gerüstet, mit meinen Brüdern zur Ruhe gebettet werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit sittlicher Vortrefflichkeit“; das griechische Wort bezeichnet einen edlen, guten Charakter.'
