lexical_decisions:
- source_word: καλοκαγαθίᾳ
  choice: mit edler Tugend
  rationale: Der Dativ bezeichnet die Eigenschaft oder das Mittel, womit der Sprecher gerüstet ist. „Edle Tugend“ gibt die sittliche Vortrefflichkeit und den gehobenen Klang von καλοκαγαθία knapp wieder.
- source_word: καθωπλισμένος
  choice: gerüstet
  rationale: Das Partizip von καθοπλίζω bedeutet „(vollständig) bewaffnen, ausrüsten“. „Gerüstet“ bewahrt das militärische Bild und klingt im Deutschen natürlich.
- source_word: τεθήσομαι
  choice: werde … zur Ruhe gebettet werden
  rationale: Das Futur Passiv von τίθημι bedeutet grundsätzlich „werde gelegt/hingestellt werden“. Im Martyriumskontext legt es ein Niederlegen im Tod nahe; die Formulierung bewahrt Passiv und feierlichen Ton.
- source_word: κἀγώ
  choice: Auch ich
  rationale: Die Krasis aus καί und ἐγώ hebt hervor, dass der Sprecher sich seinen Brüdern anschließt.
- source_word: μετὰ τῶν ἀδελφῶν μου
  choice: bei meinen Brüdern
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft. „Bei meinen Brüdern“ passt idiomatisch zum Bild des gemeinsamen Bestattetwerdens, während die Fußnote die allgemeinere Wiedergabe dokumentiert.
theological_decisions:
- issue: Bedeutung des Passivs τεθήσομαι im Martyriumskontext
  choice: „werde bei meinen Brüdern zur Ruhe gebettet werden“ mit Bezug auf Tod beziehungsweise Bestattung
  alternative: „werde zu meinen Brüdern gestellt/gelegt werden“
  rationale: Der Zusammenhang spricht dafür, dass der Sprecher seinen getöteten Brüdern im Tod folgen wird. Da τίθημι selbst allgemeiner ist, wird die mögliche weitere Lesart in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die martialische Metapher „gerüstet“ und das Passiv bleiben erhalten; die wahrscheinlich funeräre Bedeutung wird natürlich ausgedrückt, ohne die allgemeinere Bedeutung des griechischen Verbs zu verschweigen.
