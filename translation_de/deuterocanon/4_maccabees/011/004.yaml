lexical_decisions:
- source_word: ὦ
  choice: Du
  rationale: Die direkte Anrede wird im heutigen Deutschen natürlich mit „Du“ wiedergegeben; der scharfe, anklagende Ton bleibt dabei erhalten.
- source_word: μισάρετε
  choice: Feind der Tugend
  rationale: Das seltene Schimpfwort bezeichnet wahrscheinlich jemanden, der die Tugend beziehungsweise das Gute hasst. „Feind der Tugend“ ist verständlich und bewahrt die inhaltliche Parallele zu „Menschenhasser“.
- source_word: μισάνθρωπε
  choice: Menschenhasser
  rationale: Das griechische Kompositum bezeichnet wörtlich einen Menschenhasser. Die deutsche Wiedergabe erhält sowohl die Stärke des Vorwurfs als auch die rhetorische Parallelität der beiden Anreden.
- source_word: τί δράσαντες
  choice: was haben wir getan
  rationale: Die partizipiale Wendung fragt nach einer vermeintlichen Tat, die eine solche Behandlung begründen könnte. Die gewählte Formulierung ist im Deutschen idiomatisch.
- source_word: πορθεῖς
  choice: richtest … zugrunde
  rationale: Das Verb bezeichnet gewaltsames Verwüsten oder Vernichten. Auf Personen bezogen vermittelt „zugrunde richten“ die zerstörerische Gewalt natürlich, ohne sie auf Plünderung oder militärische Zerstörung zu verengen.
- source_word: τοῦτον … τὸν τρόπον
  choice: auf diese Weise
  rationale: Die Wendung bezeichnet die Art und Weise der Misshandlung und wird im modernen Deutschen so klar und idiomatisch ausgedrückt.
