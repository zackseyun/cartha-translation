  text: if indeed you had any human awareness of desires, and had hope from God for deliverance.
translation:
  language: de
  text: Wenn du überhaupt ein Gespür für menschliche Sehnsüchte gehabt und bei Gott Hoffnung auf Rettung gehegt hättest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴπερ
  choice: wenn du überhaupt … gehabt hättest
  rationale: Gibt die zugespitzte, zweifelnde Bedingung wieder; der irreale Sinn ergibt sich im Deutschen natürlich aus dem Konjunktiv II.
- source_word: ἠσθάνου
  choice: empfunden
  rationale: Das Verb bezeichnet Wahrnehmen oder Empfinden; im Zusammenhang mit πόθων ist „empfunden“ idiomatisch und wahrt den Bezug auf inneres Verlangen.
- source_word: ἀνθρώπους πόθων
  choice: menschliches Verlangen
  rationale: Die griechische Wortfolge ist textlich bzw. syntaktisch schwierig; wahrscheinlich liegt sinngemäß ein Bezug auf menschliche Sehnsüchte oder Regungen vor. Die Übersetzung bleibt bewusst allgemein und vermeidet eine spezifische inhaltliche Festlegung.
- source_word: ἐλπίδα εἶχες παρὰ θεῷ σωτηρίου
  choice: bei Gott Hoffnung auf Rettung gehabt hättest
  rationale: „Bei Gott“ gibt παρὰ θεῷ knapp wieder, ohne eindeutig zwischen Hoffnung auf Gott, von Gott oder vor Gott zu entscheiden; σωτηρίου wird hier substantivisch als Rettung verstanden.
theological_decisions:
- issue: Ursprung oder Bezug der Hoffnung in παρὰ θεῷ
  choice: bei Gott Hoffnung
  alternative: Hoffnung von Gott / auf Gott
  rationale: Die Präposition kann Herkunft, Nähe oder Bezug ausdrücken. „Bei Gott“ bewahrt diese Offenheit besser als eine eindeutige Festlegung.
- issue: Bedeutungsumfang von σωτηρίου
  choice: Rettung
  alternative: Heil / Befreiung
  rationale: „Rettung“ ist im Verfolgungs- und Martyriumszusammenhang verständlich, lässt aber sowohl konkrete Befreiung als auch umfassenderes Heil offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer verständliche griechische Verbindung ἀνθρώπους πόθων wird nicht künstlich präzisiert; die Satzform bleibt als scharfer irrealer Vorwurf erkennbar.
