  source_fidelity: 'Die Übersetzung gibt den Gegensatz der beiden griechischen Dative präzise wieder: Der Sprecher ist hinsichtlich des Alters jünger, hinsichtlich der διανοία jedoch den Brüdern gleichgestellt. „Meine Brüder“ entspricht ἀδελφῶν μου; „jünger“ gibt νεώτερος klar wieder.'
