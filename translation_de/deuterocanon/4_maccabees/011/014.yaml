  text: I am younger than my brothers in age, but in understanding I am their equal.
translation:
  language: de
  text: Ich bin zwar an Jahren jünger als meine Brüder, doch an Einsicht bin ich ihnen ebenbürtig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλικίᾳ
  choice: an Jahren
  rationale: ἡλικία bezeichnet hier im Vergleich mit den Brüdern das Lebensalter; „an Jahren“ bildet zugleich den griechischen Dativ des Vergleichsbereichs natürlich ab.
- source_word: νεώτερος
  choice: jünger
  rationale: Der Komparativ bezeichnet das geringere Lebensalter gegenüber den Brüdern.
- source_word: διανοίᾳ
  choice: an Einsicht
  rationale: διανοία meint hier Verstandes- und Urteilsfähigkeit; „Einsicht“ ist im Deutschen natürlich und wahrt den Gegensatz zum körperlichen Lebensalter.
- source_word: ἡλικιώτης
  choice: ihnen ebenbürtig
  rationale: Im rhetorischen Gegensatz bezeichnet das Wort Gleichrangigkeit im Bereich der Einsicht, nicht dasselbe Lebensalter; „ebenbürtig“ erhält die Aussage von Gleichheit, ohne den ersten Satzteil zu widersprechen.
- source_word: ἀδελφῶν
  choice: meine Brüder
  rationale: Der maskuline Plural bezieht sich im Erzählzusammenhang konkret auf die Brüder des Sprechers.
theological_decisions:
- issue: Deutung von ἡλικιώτης im Gegensatz zu νεώτερος
  choice: Gleichrangigkeit an Einsicht
  alternative: gleich an Reife oder gleichrangig im Urteil
  rationale: Der Satz stellt geringeres Lebensalter und Gleichheit hinsichtlich der διανοία einander gegenüber. Die Wiedergabe darf daher keine buchstäbliche Gleichaltrigkeit behaupten, sondern muss geistige beziehungsweise sittliche Ebenbürtigkeit ausdrücken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Struktur μὲν … δὲ wird mit „zwar … doch“ bewahrt; die parallelen Wendungen „an Jahren“ und „an Einsicht“ spiegeln die beiden griechischen Dative.
