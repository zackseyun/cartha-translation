translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am griechischen Satzbau, vermeidet jedoch unnatürliche Partizipialhäufung. Die Mehrdeutigkeit von παρεσήμαινεν wird nicht durch die interpretierende Ergänzung einer Bereitschaft oder eines Hervortretens aufgelöst.
