  text: And when this one also had died under torture[a], the fifth came forward, saying,
translation:
  language: de
  text: 'Als nun auch dieser, von den Foltern misshandelt, gestorben war, gab der fünfte ein Zeichen[a] und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gab zu erkennen“. Das Griechische lässt offen, worin das Zeichen bestand und was damit angezeigt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Als nun
  rationale: Gibt sowohl den zeitlichen Anschluss durch ὡς als auch den milden erzählerischen Übergang durch δέ natürlich wieder.
- source_word: καὶ οὗτος
  choice: auch dieser
  rationale: 'Bewahrt den rückverweisenden und fortschreitenden Sinn: Auch der zuvor genannte Bruder erleidet den Tod.'
- source_word: ταῖς βασάνοις καταικισθεὶς
  choice: von den Foltern misshandelt
  rationale: Gibt sowohl die Foltern (βασάνοις) als auch die im Partizip ausdrücklich bezeichnete schwere Misshandlung (καταικισθείς) wieder, ohne beides mit dem Todesverb zu verschmelzen.
- source_word: ἐναπέθανεν
  choice: gestorben war
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass sein Tod dem Handeln des fünften Bruders vorausgeht.
- source_word: ὁ πέμπτος
  choice: der fünfte
  rationale: Folgt dem substantivierten Ordinalzahlwort; dass der fünfte Bruder gemeint ist, ergibt sich aus dem Zusammenhang.
- source_word: παρεσήμαινεν
  choice: gab ein Zeichen
  rationale: Bewahrt die lexikalische Bedeutung des Verbs und lässt wie das Griechische offen, worin das Zeichen bestand und worauf es zielte.
- source_word: λέγων
  choice: und sagte
  rationale: Eine natürliche deutsche Wiedergabe des begleitenden Partizips, die unmittelbar zur folgenden direkten Rede überleitet.
