lexical_decisions:
- source_word: ταῦτα
  choice: dies
  rationale: Das substantivisch gebrauchte neutrale Pluralpronomen verweist auf die unmittelbar vorausgehenden Worte. Im natürlichen modernen Deutsch fasst „dies“ den Rückbezug idiomatisch zusammen, ohne seinen Inhalt näher festzulegen.
- source_word: εἰπόντα
  choice: nachdem er … gesagt hatte
  rationale: Der Aoristpartizipialausdruck bezeichnet eine Handlung, die der Haupthandlung vorausgeht. Ein temporaler Nebensatz gibt dieses Verhältnis im Deutschen klar und natürlich wieder.
- source_word: παρῆγον
  choice: führten sie ihn
  rationale: Das Imperfekt von παράγω bezeichnet hier das Hinführen des Betroffenen. „führten“ bewahrt den Bewegungsvorgang und lässt den im Kontext erkennbaren Zwang unausgesprochen.
- source_word: ἐπὶ
  choice: zum
  rationale: ἐπί mit Bewegungsrichtung kann „zu“ oder „auf“ bedeuten. „zum“ hält sich zurück und sagt lediglich, dass er an das Folterinstrument herangeführt wurde, nicht schon darauf befestigt war.
- source_word: τὸν τροχόν
  choice: das Rad
  rationale: τροχός bedeutet wörtlich „Rad“. Die schlichte Wiedergabe bewahrt die Ausdrucksweise des Griechischen; die Fußnote erläutert seine Funktion im vorliegenden Zusammenhang.
