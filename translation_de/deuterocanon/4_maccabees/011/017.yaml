translation_notes:
  register: Knapper, würdevoller Erzählstil in modernem Standarddeutsch. Die Vorzeitigkeit des Partizips wird idiomatisch durch „Nachdem … gesagt hatte“ ausgedrückt; die Folterfunktion des Rades wird nicht in den Haupttext hineingelesen, sondern in der Fußnote erläutert.
