  text: Darauf wurde er, methodisch[a] ausgespannt und ausgerenkt[b], von unten her verbrannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geordnet“, „sorgfältig“ oder „mit Bedacht“; das griechische Adverb betont das absichtsvolle und geregelte Vorgehen bei der Folter.'
