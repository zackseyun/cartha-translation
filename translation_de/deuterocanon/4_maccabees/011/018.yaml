    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ οὗ
  choice: Darauf
  rationale: Die Wendung verweist anaphorisch auf das zuvor genannte Foltergerät beziehungsweise dessen Fläche; „darauf“ ist im Deutschen knapp und natürlich.
- source_word: κατατεινόμενος
  choice: ausgespannt
  rationale: Das Partizip bezeichnet das straffe Ausstrecken beziehungsweise Spannen auf einem Foltergerät. „Ausgespannt“ bewahrt sowohl die Passivform als auch den körperlichen Vorgang.
- source_word: εὐμελῶς
  choice: mit planmäßiger Sorgfalt
  rationale: Das Adverb beschreibt ein geordnetes, kontrolliertes oder sachkundiges Vorgehen. Die Formulierung bringt die beklemmende Bedachtsamkeit der Folter zum Ausdruck, ohne eine bloß positive Wertung wie „geschickt“ nahezulegen.
- source_word: ἐκσφονδυλιζόμενος
  choice: aus den Gelenken gerissen
  rationale: Das seltene Verb bezeichnet das gewaltsame Ausrenken beziehungsweise Trennen von Wirbeln oder Gelenken. Die Wiedergabe ist verständlich und körperlich konkret, ohne ausschließlich Wirbelsäule oder Gliedmaßen festzulegen.
- source_word: ὑπεκαίετο
  choice: während er von unten her verbrannt wurde
  rationale: Das Imperfekt bezeichnet einen andauernden Vorgang; die Präfixbildung bewahrt die räumliche Nuance, dass die Hitze beziehungsweise das Feuer von unten einwirkte.
