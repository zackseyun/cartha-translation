lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorausgehenden Gedanken; „Doch“ ist knapp, würdig und im Deutschen natürlich.
- source_word: ταῦτα
  choice: was … kommt
  rationale: Das substantivierte „was“ gibt den inhaltlich offenen Bezug von ταῦτα idiomatisch wieder; die wörtlichere Mehrzahl „diese Dinge“ wird in der Fußnote genannt.
- source_word: ὑμῶν
  choice: von euch
  rationale: Der Genitiv wird im Zusammenhang am ehesten als Herkunfts- oder Beziehungsangabe verstanden. Die grammatische Mehrdeutigkeit wird in der Fußnote offengehalten.
- source_word: βασάνων
  choice: der Folterqualen
  rationale: Im Martyriumskontext bezeichnet βάσανος konkrete Folter beziehungsweise Qual; „Folterqualen“ bewahrt die Mehrzahl und die Härte des Ausdrucks.
- source_word: ἄξια
  choice: nicht wert
  rationale: ἄξιος mit Genitiv bezeichnet Würdigkeit oder Angemessenheit. Die deutsche Wendung „etwas nicht wert sein“ bildet die Konstruktion natürlich und eng am Griechischen ab.
