base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/003.yaml
  text: But I came forward of my own accord[a], so that, after killing me also[b], you might incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: de
  text: Ich aber bin aus eigenem Entschluss vorgetreten[a], damit du, nachdem du auch mich getötet hast, dir wegen noch weiterer Vergehen die Strafe der himmlischen Gerechtigkeit[b] zuziehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich selbst bin aus eigenem Antrieb vorgetreten.“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „die Strafe des himmlischen Gerichts“ oder „himmlische Strafe“.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς δʼ ἀπʼ ἐμαυτοῦ
  choice: Ich aber bin aus eigenem Entschluss
  rationale: αὐτός und ἀπ’ ἐμαυτοῦ betonen gemeinsam die persönliche, freiwillige Initiative des Sprechers. „Aus eigenem Entschluss“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: παρῆλθον
  choice: vorgetreten
  rationale: Im Kontext tritt der Sprecher freiwillig vor den Tyrannen. „Vorgetreten“ erfasst Bewegung und Selbsthingabe prägnanter als das bloße „gekommen“.
- source_word: ὅπως
  choice: damit
  rationale: Leitet einen finalen Nebensatz ein und bewahrt die Zweckbeziehung.
- source_word: κἀμέ
  choice: auch mich
  rationale: Die Krasis aus καί und ἐμέ hat additive Bedeutung und reiht den Sprecher unter die bereits Getöteten ein.
- source_word: κατακτείνας
  choice: wenn du ... getötet hast
  rationale: Das Aoristpartizip bezeichnet eine gegenüber dem Hauptverb vorausliegende Handlung. Die deutsche Konstruktion gibt diese zeitliche Folge klar wieder, ohne sie unnötig kausal festzulegen.
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: wegen noch weiterer Vergehen
  rationale: Die Wendung bezeichnet zusätzliche schuldhafte Taten, für die Haftung entsteht. „Noch weiterer“ wahrt den komparativen und additiven Sinn.
- source_word: ὀφλήσῃς
  choice: schuldest
  rationale: Das Verb bezeichnet Schuld oder Verpflichtung. Zusammen mit „Strafe“ bewahrt „schuldest“ das im Griechischen vorhandene Bild rechtlicher beziehungsweise moralischer Schuld.
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: der himmlischen Gerechtigkeit
  rationale: Der Dativ bezeichnet die Instanz, der gegenüber die Strafschuld besteht. Die Wiedergabe lässt offen, ob δίκη eher als Gerechtigkeit, Gericht oder personifizierte Vergeltungsmacht verstanden wird.
- source_word: τιμωρίαν
  choice: Strafe
  rationale: Bezeichnet strafende Vergeltung; „Strafe“ ist klar, würdig und im Kontext sachgerecht.
theological_decisions:
- issue: Deutung von τῇ οὐρανίᾳ δίκῃ
  choice: der himmlischen Gerechtigkeit
  alternative: dem himmlischen Gericht / der Gerechtigkeit des Himmels
  rationale: „Himmlische Gerechtigkeit“ wahrt den Bezug auf eine überirdische vergeltende Rechtsinstanz, ohne sie ausdrücklich mit Gott gleichzusetzen oder vollständig zu personifizieren.
- issue: Bild der Strafschuld in ὀφλήσῃς ... τιμωρίαν
  choice: Strafe schuldest
  alternative: dir Strafe zuziehst / der Strafe verfällst
  rationale: Die formalere Wiedergabe erhält die Schuld- und Verpflichtungsmetaphorik des griechischen ὀφείλω und damit die Spannung zwischen Vergehen, Haftung und himmlischer Vergeltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am argumentativen und juridischen Ton des griechischen Textes. „Strafe schuldest“ ist bewusst leicht markiert, um die Schuldmetaphorik von ὀφλήσῃς zu bewahren; die Fußnote bietet eine idiomatischere Alternative.
