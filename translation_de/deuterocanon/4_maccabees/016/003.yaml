revisions:
- from: Und die Löwen um Daniel waren nicht so wild, und auch der lodernde Ofen mit seinem heftigsten Feuer gegen Mischaël war es nicht, wie die Natur jener Mutter vor Liebe zu ihren Kindern entbrannte,[a] als sie sah, wie ihre sieben Söhne gefoltert wurden.
