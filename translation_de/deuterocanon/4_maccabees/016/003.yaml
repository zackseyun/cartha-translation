  rationale: Die Revision glättet die im Deutschen misslungene Vergleichskonstruktion, ohne die rhetorische Gegenüberstellung von Löwen, Feuerofen und dem inneren Entbrennen der Mutter abzuschwächen. „Mit heftigstem Feuer bedrohte“ macht die im Kontext feindliche Ausrichtung des Feuers gegen Mischaël idiomatisch sichtbar. Der Fußnotenanker bleibt unmittelbar beim metaphorischen Verb stehen.
