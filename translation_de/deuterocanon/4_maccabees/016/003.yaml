    issue: Unklare Vergleichssyntax
    rationale: Die Verbindung „der ... Ofen ... war es nicht, wie ... entbrannte“ vergleicht im Deutschen kein gleichartiges Prädikat und ist dadurch schwer verständlich. Die griechische rhetorische Ellipse kann im Deutschen mit einer parallelen Formulierung („nicht so ... wie“) lesbar gemacht werden.
  - severity: low
    issue: „Ofen“ ist zu allgemein
    rationale: κάμινος bezeichnet hier den aus der Danielerzählung bekannten Feuerofen. „Feuerofen“ ist im Deutschen präziser und kontextangemessen.
