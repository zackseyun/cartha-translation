  yaml_path: translation/deuterocanon/4_maccabees/016/003.yaml
  text: And the lions around Daniel were not so savage[a], nor the blazing furnace with its fiercest fire against Mishael, as that mother's own nature was inflamed by love for her children when she saw her seven sons being tortured.
translation:
  language: de
  text: Nicht so wild waren die Löwen um Daniel, und auch der Feuerofen, der Mischaël mit heftigstem Feuer bedrohte, loderte nicht so heftig, wie die mütterliche Natur jener Frau vor Liebe zu ihren Kindern entbrannte,[a] als sie sah, wie ihre sieben Söhne gefoltert wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „brannte wegen ihrer Liebe zu den Kindern noch heftiger“. Das seltene griechische Verb greift das Bild des Feuers auf und beschreibt die innere Qual der Mutter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περὶ Δανιὴλ λέοντες
  choice: die Löwen um Daniel
  rationale: Die Wendung οἱ περὶ mit einem Namen bezeichnet hier die Löwen, die Daniel umgaben; die räumliche Formulierung bleibt nah am Griechischen und ist verständlich.
- source_word: ἄγριοι
  choice: wild
  rationale: „Wild“ gibt die gefährliche Unbändigkeit der Löwen wieder, ohne die gesonderte Steigerung des Feuers vorwegzunehmen.
- source_word: Μισαὴλ
  choice: Mischaël
  rationale: Der Personenname wird in einer im Deutschen geläufigen, dem hebräischen Namen entsprechenden Form wiedergegeben.
- source_word: ἐκφλεγομένη κάμινος
  choice: der lodernde Ofen
  rationale: Die Partizipialkonstruktion bezeichnet einen in voller Flamme stehenden Ofen; „lodernd“ erhält das aktive Feuerbild.
- source_word: λαβροτάτῳ πυρί
  choice: mit seinem heftigsten Feuer
  rationale: Der Superlativ wird ausdrücklich bewahrt und beschreibt die gewaltsame Intensität des Feuers.
- source_word: φιλοτεκνίας
  choice: vor Liebe zu ihren Kindern
  rationale: Das Wort bezeichnet die Zuneigung zu den eigenen Kindern; die Formulierung ist natürlich und bindet sie unmittelbar an das metaphorische Entbrennen.
- source_word: πειράλειεν
  choice: entbrannte
  rationale: Das seltene Verb trägt ein Feuerbild. „Entbrannte“ bewahrt die Metapher für die innere Erfahrung der Mutter; die genaue Nuance ist in einer Fußnote kenntlich gemacht.
- source_word: ἐκείνη φύσις
  choice: die Natur jener Mutter
  rationale: „Natur“ erhält φύσις, während „jener Mutter“ den im Kontext eindeutigen Bezug des Demonstrativs verständlich macht.
- source_word: ὁρῶσα
  choice: als sie sah
  rationale: Das Partizip wird als begleitend-zeitlicher Umstand wiedergegeben und verbindet das Sehen mit ihrer inneren Reaktion.
- source_word: βασανιζομένους
  choice: gefoltert wurden
  rationale: Im Martyriumskontext bezeichnet das Verb konkrete Folter und nicht bloß allgemeine Qual oder Prüfung.
theological_decisions:
- issue: Metaphorisches Feuerbild für den inneren Zustand der Mutter
  choice: Das Feuerbild wird mit „entbrannte“ beibehalten.
  alternative: „wurde gequält“ oder „wurde tief erschüttert“
  rationale: Der Satz vergleicht äußere Gefahren – Löwen und Feuerofen – mit dem inneren Erleben der Mutter. Eine rein emotionale Umschreibung würde die rhetorische Verbindung und Spannung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Vergleichskonstruktion des griechischen Satzes bleibt erkennbar, wird aber durch die Wiederaufnahme „war es nicht“ lesbarer gemacht. Der Marker [a] steht unmittelbar bei der erklärten Feuermetapher.
