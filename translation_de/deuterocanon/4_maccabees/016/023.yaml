  text: For[a], though they knew that reverence toward God is not irrational, they did not shrink back from the pains.
translation:
  language: de
  text: Denn[a] obwohl sie wussten, dass es nicht vernunftwidrig ist, fromm zu leben, schreckten sie vor den Schmerzen nicht zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Formulierung ist stark verdichtet. Die beiden Infinitive können auch enger zusammengehören: „… da sie wussten, dass es nicht unvernünftig ist, fromm zu leben und den Schmerzen nicht zu widerstehen.“'
    reason: Die knappe griechische Syntax lässt den Bezug von „fromm zu leben“ und „den Schmerzen nicht zu widerstehen“ nicht völlig eindeutig erkennen.
lexical_decisions:
- source_word: ἀλόγιστον
  choice: nicht vernunftwidrig
  rationale: Das Adjektiv bezeichnet etwas Unvernünftiges oder der Vernunft Widersprechendes. Die verneinte Form wahrt die griechische Konstruktion und den für 4 Makkabäer wichtigen Zusammenhang von Gottesfurcht und Vernunft.
- source_word: εἰδότας
  choice: obwohl sie wussten
  rationale: 'Das Akkusativpartizip gibt den begleitenden Hintergrund an. Im Zusammenhang ist eine konzessive Wiedergabe natürlich: Trotz dieser Einsicht wichen sie vor dem Leiden nicht zurück.'
- source_word: εὐσεβεῖν
  choice: Gott ergeben zu leben
  rationale: Das Verb bezeichnet frommes, ehrfürchtiges Verhalten, insbesondere gegenüber Gott. Die Formulierung ist im heutigen Deutsch verständlich, bewahrt den Handlungscharakter des Infinitivs und macht dessen religiösen Bezug deutlich.
- source_word: μὴ ἀνθίστασθαι
  choice: schreckten sie … nicht zurück
  rationale: Wörtlich bedeutet das Verb „sich entgegenstellen, widerstehen“. In Verbindung mit Schmerzen bezeichnet es hier idiomatisch, dass die Betroffenen vor ihnen nicht zurückwichen.
- source_word: τοῖς πόνοις
  choice: vor den Schmerzen
  rationale: πόνος kann Mühe, Leiden oder Schmerz bezeichnen. Im Martyriumskontext ist „Schmerzen“ direkt und anschaulich, ohne das stärkere „Qualen“ in den Text einzutragen.
theological_decisions:
- issue: Verhältnis von Gottesfurcht und Vernunft
  choice: Die Aussage wird so verstanden, dass ein Gott ergebenes Leben nicht vernunftwidrig ist.
  alternative: 'Die stark verdichtete Wortfolge könnte formal auch so wiedergegeben werden: „da sie wussten, dass es nicht unvernünftig ist, fromm zu leben und den Schmerzen nicht zu widerstehen“.'
  rationale: Die gewählte Gliederung entspricht dem Gedankengang des Buches, in dem fromme Vernunft das Leiden standhaft erträgt. Die Fußnote erhält jedoch die syntaktische Verdichtung und die mögliche engere Zuordnung der Infinitive sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vernunftwidrig“ hält die philosophische Sprache des Werkes fest; „Gott ergeben zu leben“ vermeidet konfessionell geprägte Terminologie. Die Hauptfassung ist idiomatisch, während die Fußnote die formale Mehrdeutigkeit des Griechischen dokumentiert.
