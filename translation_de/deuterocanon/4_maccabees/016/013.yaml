  text: But[a], having a mind like adamant, and sending the number of her sons on to immortality, she was all the more urging them toward death for the sake of godliness, pleading with them.
translation:
  language: de
  text: Doch sie hatte einen Sinn, hart wie Diamant, und ließ die Zahl ihrer Söhne zur Unsterblichkeit hin widerhallen[a]; umso mehr drängte sie sie, um der Frömmigkeit willen in den Tod zu gehen, während sie sie flehentlich bat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ließ die Zahl ihrer Söhne der Unsterblichkeit entgegen widerhallen“; möglicherweise auch: „und sandte die Zahl ihrer Söhne der Unsterblichkeit entgegen“. Das griechische Verb ist selten und bildhaft; die genaue Vorstellung bleibt unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδάμαντινον
  choice: hart wie Diamant
  rationale: Das Adjektiv bezeichnet sprichwörtlich äußerste Härte und Unzerbrechlichkeit. Die Formulierung bewahrt das konkrete Bild und klingt im modernen Deutschen natürlicher als „diamanten“ oder „adamantinisch“.
- source_word: νοῦν
  choice: Sinn
  rationale: νοῦς bezeichnet hier die innere Denk- und Willenshaltung. „Sinn“ erhält diese Breite; „Entschlossenheit“ würde die Bedeutung bereits stärker auslegen.
- source_word: ἀντικτυποῦσα
  choice: entgegenschallen ließ
  rationale: Das seltene, bildhafte Verb enthält die Vorstellung eines Antwortens, Widerhallens oder Gegenschlagens. „Entgegenschallen ließ“ bewahrt das ungewöhnliche Klangbild, ohne es zu einer eindeutigen Aussage über den Vorgang der Unsterblichkeit umzudeuten.
- source_word: εἰς ἀθανασίαν
  choice: der Unsterblichkeit entgegen
  rationale: εἰς bezeichnet Richtung oder Ziel. Die gewählte Wendung erhält diese Bewegung, ohne genauer festzulegen, wie die Söhne zur Unsterblichkeit gelangen.
- source_word: τὸν τῶν υἱῶν ἀριθμόν
  choice: die Zahl ihrer Söhne
  rationale: Die weitgehend formale Wiedergabe erhält die auffällige Bezugnahme auf die Gesamtheit beziehungsweise Anzahl der Söhne. „Ihrer“ ergibt sich aus dem Zusammenhang.
- source_word: μᾶλλον
  choice: umso mehr
  rationale: Der Komparativ verstärkt ihr Drängen im Gegensatz zu einer erwartbaren mütterlichen Reaktion.
- source_word: εὐσεβείας
  choice: Gottesfurcht
  rationale: Der Begriff bezeichnet in 4 Makkabäer die auf Gott gerichtete, gesetzestreue Frömmigkeit. „Gottesfurcht“ macht den Gottesbezug deutlich, ohne eine konfessionelle Sonderbedeutung einzutragen.
- source_word: προετρέπετο
  choice: drängte sie sie … zu gehen
  rationale: Das Verb bezeichnet nachdrückliches Auffordern oder Ermutigen. Die deutsche Konstruktion gibt die aktive Aufforderung angesichts des Todes verständlich wieder.
- source_word: ἱκετεύουσα
  choice: unter flehentlichen Bitten
  rationale: Das Partizip begleitet und intensiviert ihr Drängen. Die adverbiale Wendung vermeidet eine schwerfällige Wiederholung der Pronomen und erhält den eindringlichen Ton.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Martyriumskontext
  choice: Gottesfurcht
  alternative: Frömmigkeit; Gottesverehrung
  rationale: „Gottesfurcht“ wahrt die Ausrichtung auf Gott und lässt zugleich offen, wie sich diese Haltung im Einzelnen zu Gesetzestreue und Frömmigkeit verhält.
- issue: Deutung von καὶ εἰς ἀθανασίαν ἀντικτυποῦσα τὸν τῶν υἱῶν ἀριθμόν
  choice: und ließ die Zahl ihrer Söhne der Unsterblichkeit entgegenschallen
  alternative: und sandte die Zahl ihrer Söhne der Unsterblichkeit entgegen; und ließ die Zahl ihrer Söhne zur Unsterblichkeit hin widerhallen
  rationale: Die griechische Wendung ist ungewöhnlich und metaphorisch. Die Übersetzung erhält ihre Klang- und Gegenbewegungsmetaphorik, statt sie als eindeutige Lehrformel über Märtyrertod und Unsterblichkeit aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das auffällige Bild der griechischen Vorlage wird bewusst nicht geglättet; die Satzführung bleibt dennoch verständlich. Der Fußnotenmarker [a] steht unmittelbar an der betroffenen Wendung.
