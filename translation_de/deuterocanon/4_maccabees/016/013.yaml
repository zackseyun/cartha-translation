  verdict: revise
  source_fidelity: Die Wiedergabe trifft die feste innere Haltung, die Ausrichtung auf Unsterblichkeit, das verstärkte Drängen zum Tod und das flehentliche Bitten insgesamt gut. Bei ἀντικτυποῦσα ist die bildhafte und semantisch unsichere Gegenklang-/Gegenschlagmetapher zu wahren; die deutsche Fassung sollte sie nicht als eindeutliches tatsächliches „Senden“ festlegen.
  naturalness: „ließ die Zahl ihrer Söhne der Unsterblichkeit entgegenschallen“ ist im heutigen Standarddeutsch syntaktisch und semantisch schwer verständlich. Auch „unter flehentlichen Bitten“ verdeckt, dass sie ihre Söhne selbst bittet. Eine leicht geglättete Satzführung kann beides klarer ausdrücken, ohne das ungewöhnliche Bild zu tilgen.
  terminology: „Gottesfurcht“ ist als Wiedergabe von εὐσέβεια möglich, hat im modernen Deutschen jedoch leicht den engeren Beiklang von Furcht. „Frömmigkeit“ ist hier die natürlichere, ausreichend weite Wiedergabe für gottesbezogene, gesetzestreue Hingabe. „Sinn, hart wie Diamant“ bewahrt die konkrete Metapher von ἀδάμαντινον.
