  - severity: low
    issue: „ganz von Klage erfüllt“ ist etwas umständlich und setzt gegenüber πολύθρηνος einen unnötigen Totalitätsakzent.
    rationale: „Voller Klage“ ist idiomatischer und gibt die klagevolle, von Trauer erfüllte Beschaffenheit der Sprecherin angemessen wieder.
