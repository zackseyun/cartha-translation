  verdict: revise
  source_fidelity: 'Der Entwurf gibt alle Glieder des griechischen Klagerufs wieder: die an viele Kinder reiche Frau, die schönen bzw. trefflichen Kinder, die Witwenschaft, das Alleinsein und die von Klage geprägte Verfassung. Die ausdrückliche Selbstbezeichnung ἐγὼ γυνή wird jedoch ohne appositionale Zeichensetzung syntaktisch unnötig holprig. „Voller Klage“ gibt πολύθρηνος idiomatischer wieder als „ganz von Klage erfüllt“, ohne die Intensität abzuschwächen.'
  naturalness: Die vorgeschlagene Fassung wahrt den knappen, gehobenen Klageruf und ist im modernen Standarddeutsch klarer gegliedert. Die Appositionen machen deutlich, dass die Sprecherin sich selbst charakterisiert, nicht eine andere Frau anredet.
  terminology: „Kinderreich“ entspricht πολύπαις gut. „Schöne Kinder“ ist als Grundbedeutung von καλλίπαις vertretbar; die Fußnote bewahrt die kontextuell mögliche Bedeutung „trefflich“ ohne sie in den Text einzutragen. „Witwe“ und „allein“ sind präzise. Für πολύθρηνος ist „voller Klage“ eine natürliche, nicht doktrinär geprägte Entsprechung.
  issues:
