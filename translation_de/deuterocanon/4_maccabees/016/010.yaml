  yaml_path: translation/deuterocanon/4_maccabees/016/010.yaml
  text: O I[a], the mother of many and of beautiful children, a widow and alone[b], much-lamenting woman!
translation:
  language: de
  text: Ach, ich, eine kinderreiche Frau mit schönen Kindern[a], eine Witwe, allein und voller Klage!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit trefflichen Kindern“. Das griechische Wort kann sowohl Schönheit als auch besondere Vortrefflichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: Ach
  rationale: Die Interjektion eröffnet einen Klageruf; „Ach“ gibt diesen Gefühlswert im Deutschen knapp und natürlich wieder.
- source_word: πολύπαις
  choice: kinderreich
  rationale: Das zusammengesetzte Adjektiv bezeichnet eine Frau mit vielen Kindern; „kinderreich“ wahrt die knappe adjektivische Form.
- source_word: καλλίπαις
  choice: mit schönen Kindern
  rationale: Die Grundbedeutung bezieht sich auf die Schönheit beziehungsweise vorzügliche Beschaffenheit der Kinder. Die Übersetzung bleibt nah am Wortlaut; die mögliche qualitative Bedeutung wird in der Fußnote bewahrt.
- source_word: γυνή
  choice: Frau
  rationale: Das gewöhnliche Äquivalent gibt die ausdrückliche Selbstbezeichnung der Sprecherin wieder, ohne den griechischen Ausdruck interpretierend durch „Mutter“ zu ersetzen.
- source_word: χήρα
  choice: Witwe
  rationale: Die Bezeichnung ihres verwitweten Standes wird unmittelbar und knapp wiedergegeben.
- source_word: μόνη
  choice: allein
  rationale: Das Wort betont ihre Verlassenheit und Isolation.
- source_word: πολύθρηνος
  choice: ganz von Klage erfüllt
  rationale: Die Wendung gibt die Fülle und Intensität des Klagens in natürlichem, würdigem Deutsch wieder, ohne die Aussage auf bloße Traurigkeit zu verengen.
