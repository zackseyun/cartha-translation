  source_fidelity: 'Die Übersetzung bildet alle Bestandteile des Griechischen zuverlässig ab: καὶ διὰ τοῦτο mit „Und deshalb“, die verpflichtende Mahnung ὀφίλετε mit „sollt ihr“, πάντα πόνον mit „jedes Leiden“, ὑπομένειν mit „ertragen“ und διὰ τὸν θεόν mit „um Gottes willen“. „Leiden“ deckt den Bedeutungsbereich von πόνος im gegebenen Martyriumskontext angemessen ab, ohne ihn unzulässig auf bloßen körperlichen Schmerz einzuengen.'
