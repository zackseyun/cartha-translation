translation:
  language: de
  text: Und deshalb sollt ihr um Gottes willen jedes Leiden ertragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Die Wendung verweist folgernd auf das zuvor Gesagte zurück; „deshalb“ ist im Deutschen natürlich und bewahrt diesen Zusammenhang.
- source_word: ὀφίλετε
  choice: sollt ihr
  rationale: Das Verb bezeichnet eine moralische Verpflichtung. „sollt ihr“ gibt den mahnenden Charakter wieder, ohne die Aussage zur unausweichlichen Notwendigkeit zu verschärfen.
- source_word: πάντα πόνον
  choice: jedes Leiden
  rationale: πόνος kann Schmerz, Mühsal oder Leiden bezeichnen. Im Martyriumskontext umfasst „Leiden“ körperliche Schmerzen und sonstige Bedrängnis; das distributive πάντα wird durch „jedes“ bewahrt.
- source_word: ὑπομένειν
  choice: ertragen
  rationale: „Ertragen“ bezeichnet hier das standhafte Aushalten von Leiden und entspricht dem knappen exhortativen Ausdruck.
- source_word: διὰ τὸν θεόν
  choice: um Gottes willen
  rationale: Die Wendung drückt Beweggrund beziehungsweise Hingabe aus. „um Gottes willen“ ist eine natürliche, würdevolle Entsprechung zu „Gottes wegen/für Gott“ und vermeidet eine rein kausale Zuschreibung.
theological_decisions:
- issue: Stärke der moralischen Verpflichtung in ὀφίλετε
  choice: mahnende Verpflichtung („sollt ihr“)
  alternative: starke Notwendigkeit („müsst ihr“)
  rationale: Der griechische Ausdruck verpflichtet die Angeredeten, steht hier aber in einer Mahnung. „sollt ihr“ wahrt diesen verpflichtenden Appell, ohne Zwang oder unausweichliche Notwendigkeit einzutragen.
- issue: Bezug von διὰ τὸν θεόν
  choice: Leiden aus Hingabe an Gott („um Gottes willen“)
  alternative: 'rein kausal: „wegen Gottes“'
  rationale: Die Konstruktion kann Grund oder Beweggrund ausdrücken. Im Aufruf zur treuen Standhaftigkeit liegt die motivationale Bedeutung nahe; die deutsche Fassung lässt den genauen Charakter der Hingabe unentfaltet.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Mahnrede. „Leiden“ ist verständlicher und idiomatischer als „Pein“ und im Kontext umfassender als ausschließlich körperlicher „Schmerz“.
