base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/014.yaml
  text: O mother, soldier of devotion to God, though old and a woman, by endurance you conquered even a tyrant, and in deeds and words you were found stronger than a man.
translation:
  language: de
  text: O Mutter, du Soldatin der Gottesverehrung[a]! Obwohl du alt und eine Frau warst, hast du durch Standhaftigkeit sogar einen Tyrannen besiegt und dich in Taten und Worten als stärker erwiesen als ein Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frömmigkeit gegenüber Gott“ beziehungsweise „Hingabe an Gott“. Das griechische Wort εὐσέβεια kann ehrfürchtige Verehrung, Frömmigkeit oder hingebungsvolle Gottesbezogenheit bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: εὐσέβειαν θεοῦ
  choice: Gottesverehrung
  rationale: Die Verbindung bezeichnet eine auf Gott gerichtete Frömmigkeit oder ehrfürchtige Hingabe. „Gottesverehrung“ ist im Deutschen knapp, würdevoll und lässt sowohl innere Frömmigkeit als auch gelebte Verehrung anklingen.
- source_word: στρατιῶτι
  choice: Soldatin
  rationale: Das militärische Bild wird ausdrücklich bewahrt und zugleich grammatisch auf die angeredete Mutter bezogen.
- source_word: πρεσβῦτι καὶ γυνή
  choice: obwohl du alt und eine Frau warst
  rationale: 'Die konzessive Wiedergabe macht die rhetorische Gegenüberstellung deutlich: Trotz ihres Alters und ihres Frauseins überwindet die Mutter den Tyrannen.'
- source_word: διὰ καρτερίαν
  choice: durch Standhaftigkeit
  rationale: καρτερία bezeichnet beharrliches Ausharren unter Belastung; „Standhaftigkeit“ gibt sowohl Ausdauer als auch innere Festigkeit wieder.
- source_word: τύραννον ἐνίκησας
  choice: hast du sogar einen Tyrannen besiegt
  rationale: „Besiegt“ entspricht dem Siegverb νικάω. „Sogar“ verdeutlicht die im Zusammenhang angelegte Steigerung, ohne den Aussagegehalt zu verändern.
- source_word: ἔργοις ... καὶ λόγοις
  choice: in Taten und Worten
  rationale: Die parallele Gegenüberstellung wird unmittelbar und idiomatisch erhalten.
- source_word: δυνατωτέρα ... ἀνδρός
  choice: stärker als ein Mann
  rationale: Der explizite Vergleich mit einem einzelnen Mann und die geschlechtsspezifische Rhetorik des griechischen Textes bleiben erhalten.
- source_word: εὑρέθης ἂν
  choice: dich ... erwiesen
  rationale: „Sich erweisen“ gibt die passivische Feststellung idiomatisch wieder. Das ungewöhnliche ἄν wird nicht durch eine spekulative deutsche Möglichkeitsform überbetont.
theological_decisions:
- issue: Bedeutung von εὐσέβεια gegenüber Gott
  choice: Gottesverehrung
  alternative: Frömmigkeit vor Gott; Hingabe an Gott
  rationale: Der Ausdruck wird nicht auf eine konfessionell geprägte Tugendlehre verengt. Die Fußnote bewahrt die lexikalische Spannweite zwischen Verehrung, Frömmigkeit und Hingabe.
- issue: Geschlechtsspezifischer Vergleich
  choice: „eine Frau“ und „ein Mann“ ausdrücklich beibehalten
  alternative: 'geschlechtsneutral: „stärker als jeder Mensch“'
  rationale: Die Pointe des Verses beruht auf der ausdrücklich formulierten antiken Gegenüberstellung. Eine Neutralisierung würde diese Rhetorik beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und das militärische Bild bleiben erhalten; die etwas ungewöhnliche Wendung „Soldatin der Gottesverehrung“ spiegelt bewusst die markante Metapher des griechischen Textes.
