translation:
  language: de
  text: 'Du sagtest zu deinen Söhnen auf Hebräisch[a]: »Söhne, edel ist der Kampf, zu dem ihr für das Zeugnis des Volkes berufen worden seid. Kämpft mit aller Kraft!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in hebräischer Sprache«.'
    reason: Formnähere Wiedergabe von ἐν τῇ Ἑβραΐδι φωνῇ.
lexical_decisions:
- source_word: ἔλεγες
  choice: du sagtest
  rationale: Das griechische Imperfekt bezeichnet hier die Rede in der erinnerten Szene; das natürliche deutsche Präteritum lässt offen, ob sie fortdauernd oder wiederholt sprach. Die mögliche Verlaufsnuance wird in einer Fußnote genannt.
- source_word: τοῖς παισὶν / Ὦ παῖδες
  choice: zu deinen Söhnen / Meine Söhne
  rationale: Im Kontext spricht die Mutter ihre männlichen Kinder an. »Söhne« gibt Geschlecht und Familienbeziehung präziser wieder als das allgemeinere »Kinder«; beim Anruf macht »meine« die im Kontext gegebene Beziehung natürlich deutlich.
- source_word: ἐν τῇ Ἑβραΐδι φωνῇ
  choice: auf Hebräisch
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der Angabe, in welcher Sprache gesprochen wurde.
- source_word: γενναῖος
  choice: edel
  rationale: Das Adjektiv bezeichnet hier die moralische Erhabenheit und Tapferkeit des Kampfes, nicht nur Mut oder Härte.
- source_word: ὁ ἀγών / ἐναγωνίσασθε
  choice: der Kampf / kämpft mit aller Kraft
  rationale: »Kampf« bewahrt das Bild eines Wett- oder Ringkampfs. Die Wiederaufnahme im Imperativ spiegelt die griechische Wortverwandtschaft; »mit aller Kraft« vermittelt die intensive Bedeutung des Verbs.
- source_word: ἐφʼ ὃν κληθέντες
  choice: zu dem ihr berufen seid
  rationale: Die finite deutsche Konstruktion ist verständlich und wahrt den Kampf als Ziel der Berufung, ohne das schwerfällige »zu dem berufen worden«.
- source_word: ὑπὲρ τῆς διαμαρτυρίας τοῦ ἔθνους
  choice: für das Zeugnis unseres Volkes
  rationale: »Zeugnis« bewahrt die öffentliche beziehungsweise bezeugende Bedeutung von διαμαρτυρία. »Unseres Volkes« gibt die Zugehörigkeit von Sprecherin und Angeredeten im Kontext idiomatisch wieder; die wörtlichere Form steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von παῖδες in der Ermahnung zum Martyrium
  choice: Söhne
  alternative: Kinder; Knaben
  rationale: Der Kontext bezeichnet die männlichen Kinder der Mutter. »Söhne« bewahrt sowohl die Geschlechtsangabe als auch das familiäre Pathos, ohne darüber hinaus eine theologische Deutung einzutragen.
- issue: Bedeutung von διαμαρτυρία im jüdischen Martyriumskontext
  choice: Zeugnis
  alternative: Bezeugung; eindringliche Erklärung
  rationale: »Zeugnis« lässt die öffentliche und möglicherweise rechtliche Bedeutung offen und vermeidet es, dem Ausdruck eine spätere spezifisch christliche Märtyrertheologie aufzuzwingen.
- issue: Genitiv τοῦ ἔθνους
  choice: unseres Volkes
  alternative: des Volkes
  rationale: Der griechische Text hat wörtlich »des Volkes«. Das Possessivpronomen macht im Deutschen die aus dem Kontext klare gemeinsame Zugehörigkeit idiomatisch; die Fußnote bewahrt die formale Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt eindringlich, ohne altertümliche Formen wie »o Söhne« oder unnötig technische Sprache. Das griechische Kampfwortspiel wird durch »Kampf … kämpft« hörbar gemacht.
