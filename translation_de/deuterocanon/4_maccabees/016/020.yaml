  text: for whose sake even our father Abraham hurried to slaughter Isaac[a], his son, the ancestor of the nation, and, seeing the ancestral hand bearing the sword descending upon him[b], did not shrink back.
translation:
  language: de
  text: Um seinetwillen eilte auch unser Vater Abraham, seinen Sohn Isaak, den Stammvater eines Volkes[a], zu schlachten; und als dieser die schwerttragende Hand seines Vaters auf sich herabkommen sah, schreckte er nicht zurück[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Sohn Isaak, der zum Stammvater eines Volkes werden sollte“. Das griechische zusammengesetzte Wort ἐθνοπάτωρ bezeichnet den Ahnherrn oder Stammvater eines Volkes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wich nicht zurück“, „zuckte nicht zusammen“ oder „kauerte sich nicht vor Angst zusammen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὃν
  choice: um seinetwillen
  rationale: Die Wendung bezeichnet den Beweggrund und lässt den im vorausgehenden Zusammenhang liegenden Bezug offen, statt ihn durch einen ausdrücklich eingesetzten Namen festzulegen.
- source_word: ἔσπευδεν
  choice: eilte
  rationale: Das Verb kann Schnelligkeit und Eifer ausdrücken. „Eilte“ bewahrt die unmittelbare, dramatische Bewegung des griechischen Satzes.
- source_word: σφαγιάσαι
  choice: zu schlachten
  rationale: Die Wiedergabe erhält die drastische und möglicherweise kultisch gefärbte Bedeutung des Verbs, ohne mit „opfern“ eine Deutung einzutragen, die über die konkrete Wortwahl hinausgeht.
- source_word: τὸν ἐθνοπάτορα υἱόν
  choice: seinen Sohn Isaak, den Stammvater des Volkes
  rationale: ἐθνοπάτωρ bezeichnet den Ahnherrn oder Stammvater eines Volkes. Die Apposition macht deutlich, dass Isaak sowohl Abrahams Sohn als auch der Stammvater des Volkes ist.
- source_word: πατρῴαν χεῖρα
  choice: die Hand seines Vaters
  rationale: Im unmittelbaren Bild ist Abraham Isaaks Vater. Diese natürliche deutsche Formulierung gibt den konkreten Bezug wieder, während die gehobene Bildhaftigkeit durch den übrigen Ausdruck erhalten bleibt.
- source_word: ξιφηφόρον
  choice: schwertführende
  rationale: Das Adjektiv bedeutet wörtlich „ein Schwert tragend/führend“ und bezieht sich bildhaft auf die Hand.
- source_word: καταφερομένην ἐπʼ αὐτόν
  choice: auf sich herabfahren
  rationale: Die Formulierung bewahrt die nach unten auf Isaak gerichtete, bedrohliche Bewegung des Partizips.
- source_word: οὐκ ἔπτηξεν
  choice: schreckte er nicht zurück
  rationale: Das Verb kann ein angstvolles Zurückweichen oder Zusammenzucken bezeichnen. Die gewählte Wendung verbindet Furchtreaktion und standhaftes Nichtweichen.
theological_decisions:
- issue: Darstellung von Abrahams beabsichtigter Tötung Isaaks
  choice: „eilte … zu schlachten“
  alternative: „war bereit, Isaak zu opfern“
  rationale: Die drastische Wortwahl des griechischen Textes wird nicht durch vertraute, aber mildere Opferterminologie ersetzt.
- issue: Bezug von διʼ ὃν
  choice: Pronominal als „um seinetwillen“ wiedergeben
  alternative: Den Bezug ausdrücklich als „um Gottes willen“ benennen
  rationale: Der Bezug wird vom vorausgehenden Kontext getragen. Die Übersetzung vermeidet es, die syntaktische Abhängigkeit durch eine ausdrückliche Ergänzung stärker festzulegen als der Vers selbst.
- issue: Subjektwechsel im zweiten Satzteil
  choice: Isaak ausdrücklich als Subjekt nennen
  alternative: Den Subjektwechsel wie im Griechischen nur sinngemäß erschließen lassen
  rationale: Das Partizip ὁρῶν und αὐτόν zeigen inhaltlich, dass Isaak die auf ihn herabfahrende Hand sieht und nicht zurückschreckt. Die ausdrückliche Nennung verhindert im Deutschen eine irreführende Zuordnung zu Abraham, ohne die Aussage theologisch zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst anschaulicher Gewaltterminologie. Der lange griechische Satz ist zur Klarheit in zwei Sätze gegliedert; die rhetorische Steigerung und Isaaks Standhaftigkeit bleiben erhalten.
