base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/007.yaml
  text: O seven futile pregnancies[a], and seven useless ten-month terms, and fruitless nursing[b], and miserable suckling.
translation:
  language: de
  text: O ihr sieben vergeblichen Schwangerschaften und ihr sieben nutzlosen zehnmonatigen Schwangerschaftszeiten[a], ihr fruchtlosen Zeiten des Stillens und ihr leidvollen Zeiten der Ernährung mit Milch![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „zehn Monate“ entsprechen einer antiken Zählweise für die gewöhnliche Dauer einer Schwangerschaft.
    reason: cultural_note
  - marker: b
    text: Im Griechischen steht eine Reihe knapper Ausrufe ohne vollständige Sätze; diese gedrängte Form der Klage ist hier beibehalten.
    reason: literary_form
lexical_decisions:
- source_word: μάταιοι
  choice: vergeblichen
  rationale: Bezeichnet im Klageruf etwas, das aus Sicht der Mutter zu keinem bleibenden Ergebnis geführt hat; „vergeblich“ ist natürlich und wahrt den emotionalen Ton.
- source_word: κυοφορίαι
  choice: Schwangerschaften
  rationale: Gibt das Tragen im Mutterleib klar und allgemein verständlich wieder.
- source_word: ἀνόνητοι
  choice: nutzlosen
  rationale: Drückt das Ausbleiben eines Nutzens oder Ertrags aus und unterscheidet sich sprachlich von ἄκαρποι.
- source_word: δεκάμηνοι
  choice: Zehnmonatszeiten
  rationale: Bewahrt die antike Angabe einer zehnmonatigen Schwangerschaftsdauer, ohne sie stillschweigend zu modernisieren.
- source_word: ἄκαρποι
  choice: fruchtlosen
  rationale: Erhält die bildhafte Aussage vom ausgebliebenen Ertrag, ohne wörtliche Unfruchtbarkeit der Mutter zu behaupten.
- source_word: τιθηνίαι
  choice: Stillzeiten
  rationale: Bezeichnet hier die Zeiten beziehungsweise Vorgänge des Stillens und ist im modernen Deutschen verständlich.
- source_word: ταλαίπωροι
  choice: leidvollen
  rationale: Vermittelt Mühsal und Schmerz in einem würdigen Klagewort; „elend“ könnte unnötig abwertend klingen.
- source_word: γαλακτοτροφίαι
  choice: Ernährungen mit Milch
  rationale: Bildet den zusammengesetzten griechischen Ausdruck transparent ab und hält ihn von τιθηνίαι, dem Stillen, unterscheidbar.
theological_decisions:
- issue: Reihe verbloser Ausrufe
  choice: Als verdichtete Anrufungs- und Klagephrasen mit wiederholtem „ihr“ wiedergegeben.
  alternative: 'Zu vollständigen Sätzen ergänzen, etwa: „Meine sieben Schwangerschaften waren vergeblich.“'
  rationale: Der griechische Text enthält keine finiten Verben. Die verdichtete Form bewahrt seine rhetorische Klagestruktur und vermeidet interpretierende Ergänzungen.
- issue: Antike Schwangerschaftsangabe δεκάμηνοι
  choice: Wörtlich als „Zehnmonatszeiten“ mit Fußnote erhalten.
  alternative: „volle Schwangerschaftszeiten“ oder „neunmonatige Schwangerschaften“
  rationale: Die kulturgeschichtlich geprägte Zählweise gehört zum Wortlaut und sollte nicht modernisiert werden.
- issue: Unterscheidung von τιθηνίαι und γαλακτοτροφίαι
  choice: Mit „Stillzeiten“ und „Ernährungen mit Milch“ als verwandte, aber nicht identische Ausdrücke wiedergegeben.
  alternative: Beide Ausdrücke sinngemäß unter „Stillen“ zusammenfassen.
  rationale: Die griechische Parallelreihe verwendet zwei verschiedene Substantive. Eine differenzierte Wiedergabe bewahrt sowohl die Wiederholung als auch die lexikalische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Anrede „ihr“ macht die griechischen vokativischen Formen verständlich; die ungewöhnliche Parallelität und die kulturell geprägte Zehnmonatsangabe bleiben erhalten.
