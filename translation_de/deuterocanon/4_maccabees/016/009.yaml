  yaml_path: translation/deuterocanon/4_maccabees/016/009.yaml
  text: O my children—some unmarried[a], and others married but childless—I will not see your children, nor will I be counted blessed when I am called grandmother.
translation:
  language: de
  text: Ach, meine Kinder! Die einen sind unverheiratet, die anderen haben geheiratet und sind kinderlos[a]. Ich werde eure Kinder nicht sehen, und ich werde nicht glücklich gepriesen werden, wenn ich Großmutter genannt werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort ἄνοιντοι bedeutet hier wahrscheinlich „kinderlos“ oder „ohne Nachkommen“. Gemeint ist, dass auch die verheirateten Kinder ihr keine Enkel hinterlassen werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ τῶν ἐμῶν παίδων
  choice: O meine Kinder!
  rationale: παῖδες kann je nach Zusammenhang Kinder oder Söhne bezeichnen. Das allgemeinere „Kinder“ bewahrt die griechische Bedeutung, ohne das Geschlecht unnötig festzulegen; der Ausruf gibt den klagenden Ton von ὦ wieder.
- source_word: ἄγαμοι
  choice: unverheiratet
  rationale: ἄγαμος bezeichnet hier eindeutig den unverheirateten Stand. „Unverheiratet“ ist modern, klar und quellennah.
- source_word: γαμήσαντες
  choice: haben geheiratet
  rationale: Das Aoristpartizip bezeichnet diejenigen, die eine Ehe eingegangen sind. Die finite Form klingt im Deutschen natürlich und wahrt den Gegensatz zu den Unverheirateten.
- source_word: ἄνοιντοι
  choice: kinderlos
  rationale: Das seltene Wort bezeichnet im Kontext wahrscheinlich das Fehlen von Nachkommen. „Kinderlos“ passt zum folgenden Satz über die Enkel und vermeidet die biologisch engere Aussage „unfruchtbar“.
- source_word: οὐκ ὄψομαι ὑμῶν τέκνα
  choice: Ich werde eure Kinder nicht sehen
  rationale: Die direkte Wiedergabe erhält die familiäre Sprache und meint aus Sicht der Sprecherin ihre Enkel.
- source_word: μάμμη
  choice: Großmutter
  rationale: μάμμη ist eine familiäre Bezeichnung für die Großmutter; „Großmutter“ ist das natürliche moderne Standardäquivalent.
- source_word: κληθεῖσα μακαρισθήσομαι
  choice: man wird mich nicht als Großmutter glücklich preisen
  rationale: κληθεῖσα bezieht die Bezeichnung „Großmutter“ auf die Sprecherin, während μακαρισθήσομαι das Glücklichpreisen oder Seligpreisen durch andere ausdrückt. Die unpersönliche Form mit „man“ bildet den Passivgedanken idiomatisch ab.
