  text: But by the reasoning of godliness the mother extinguished passions so many and so great[a][b].
translation:
  language: de
  text: Doch durch die von Gottesfurcht geprägte Vernunft löschte die Mutter so viele und so gewaltige Leidenschaften aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den starken Gegensatz zum vorausgehenden Zusammenhang in knapper, würdiger Form.
- source_word: τῷ λογισμῷ τῆς εὐσεβείας
  choice: durch die von Gottesfurcht geprägte Vernunft
  rationale: Gibt den instrumentalen Dativ wieder und bewahrt sowohl das vernünftige Urteilen als auch seine Ausrichtung an ehrfürchtiger Frömmigkeit gegenüber Gott.
- source_word: κατέσβεσε
  choice: löschte … aus
  rationale: Bewahrt das anschauliche Bild des Löschens, als wären die Leidenschaften ein Feuer.
- source_word: τοσαῦτα καὶ τηλικαῦτα
  choice: so viele und so gewaltige
  rationale: Erhält die doppelte Hervorhebung von Anzahl und Größe in natürlichem modernem Deutsch.
- source_word: πάθη
  choice: Leidenschaften
  rationale: Entspricht dem philosophischen Sprachgebrauch des Buches für starke Regungen oder Affekte, die der Vernunft untergeordnet werden.
- source_word: ἡ μήτηρ
  choice: die Mutter
  rationale: Folgt dem einfachen bestimmten Ausdruck des Griechischen, ohne ein nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
theological_decisions:
- issue: Verhältnis von λογισμός und εὐσέβεια
  choice: die von Gottesfurcht geprägte Vernunft
  alternative: die Vernunft der Frömmigkeit
  rationale: Die Formulierung hält Vernunft und religiöse Ehrfurcht zusammen, ohne εὐσέβεια auf bloße Rationalität zu reduzieren. Zugleich vermeidet sie das im heutigen Deutsch leicht missverständliche Wort „Frömmigkeit“ im Haupttext.
- issue: Bedeutung von πάθη
  choice: Leidenschaften
  alternative: Leiden
  rationale: Im philosophischen Zusammenhang von 4 Makkabäer bezeichnet πάθη vor allem innere Affekte und Regungen. Die mögliche allgemeinere Bedeutung wird dennoch in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung stellt entsprechend dem Griechischen das Mittel der Überwindung heraus; die Metapher des Auslöschens bleibt erhalten.
