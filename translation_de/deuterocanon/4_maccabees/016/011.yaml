review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf erfasst gegenüber der englischen Auditfassung zutreffend die im griechischen Text stehende Verneinung bei ἕξω τινά: Die Mutter wird keinen ihrer Söhne als ihren Bestatter haben. Die englische Fassung („would bury some one of my sons“) ist mit οὐδʼ und der Konstruktion ἕξω τινά θάπτοντα nicht vereinbar. Allerdings gibt „selbst wenn ich sterbe“ οὐδʼ ἄν nicht vollständig wieder; die Partikel verstärkt den negativen Hauptgedanken im Sinn von „nicht einmal/selbst dann nicht“.'
  naturalness: „die ich ... haben werde“ ist im Deutschen keine tragfähige Wiedergabe des abrupten Wechsels zur ersten Person. „sie, die ... keinen meiner Söhne haben werde“ bewahrt den Wechsel verständlich und in würdigem modernem Standarddeutsch. Der Relativsatz bleibt bewusst syntaktisch auffällig, wie die griechische Vorlage.
  terminology: „heilige und gottesfürchtige Mutter“ ist quellentreu, idiomatisch und im Register angemessen. „Klage“ und „beklagte“ geben θρῆνος und ὀλοφύρετο gut wieder.
  issues:
  - severity: high
    issue: Die Verstärkung οὐδʼ ἄν fehlt in der deutschen Übersetzung.
    rationale: '„Selbst wenn ich sterbe“ bezeichnet nur die Bedingung. Das vorangestellte οὐδʼ verlangt, dass auch für diesen äußersten Fall der negative Gedanke gilt: „selbst dann ... keinen ... haben werde“.'
  - severity: medium
    issue: „die ich“ ist als Relativanschluss unnatürlich und syntaktisch missverständlich.
    rationale: Das griechische ἣ bezieht sich weiterhin auf die Mutter; erst in der eingebetteten Verbform erfolgt der abrupte Wechsel in die erste Person. „sie, die“ erhält diesen Bezug, ohne die deutsche Syntax zu beschädigen.
  - severity: medium
    issue: Die Fußnote behauptet, die Formulierung gehe „von einem Relativsatz über die Mutter in ihre eigene Stimme über“, erläutert aber die entscheidende negative Partikel nicht.
    rationale: Die Anmerkung soll sowohl den Wechsel der Person als auch die durch οὐδʼ ausgedrückte negative Aussage korrekt erklären.
  revised_text: sie[a], die selbst dann, wenn ich sterbe, keinen meiner Söhne haben werde, der mich begräbt. Doch mit dieser Klage beklagte die heilige und gottesfürchtige Mutter keinen von ihnen,
  revised_footnotes:
  - marker: a
    text: 'Im Griechischen bezieht sich der Relativsatz zunächst auf die Mutter, wechselt dann aber unvermittelt in die erste Person: wörtlich etwa „sie, die selbst dann, wenn ich sterbe, keinen meiner Söhne haben werde, der mich begräbt“. Die erste Person in ἀποθάνω und ἕξω sowie die gedrängte Syntax bleiben erhalten. Das vorangestellte οὐδʼ verstärkt die Verneinung („selbst dann ... keinen“).'
    reason: Der abrupte Personenwechsel, die elliptisch erschlossene Bestattung der Mutter und die negative Verstärkung durch οὐδʼ bedürfen einer knappen Erklärung.
  revision_rationale: 'Die Revision folgt dem griechischen Wortlaut vor der widersprüchlichen englischen Auditfassung. Sie bewahrt die erste Person Singular und die elliptische Konstruktion mit θάπτοντα, macht aber klar, dass die Aussage negativ ist: Nicht einmal im Fall ihres Todes wird die Mutter einen ihrer Söhne als Bestatter haben. Zugleich wird der deutsche Relativanschluss geglättet, ohne die überlieferte Abruptheit zu nivellieren.'
