  yaml_path: translation/deuterocanon/4_maccabees/016/011.yaml
  text: who[a], even if I were not to die, would bury some one of my sons. But with this lament the holy and God-fearing mother bewailed none of them,
translation:
  language: de
  text: die ich[a] – selbst wenn ich sterbe – keinen meiner Söhne haben werde, der mich begräbt. Doch mit dieser Klage beklagte die heilige und gottesfürchtige Mutter keinen von ihnen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen geht die Formulierung unvermittelt von einem Relativsatz über die Mutter in ihre eigene Stimme über: wörtlich etwa „die ich … keinen meiner Söhne haben werde“. Manche Übersetzungen glätten dies zur dritten Person.'
    reason: Die auffällige erste Person in ἀποθάνω und ἕξω sowie die gedrängte Syntax sollen sichtbar bleiben.
lexical_decisions:
- source_word: ἣ
  choice: die ich
  rationale: Das feminine Relativpronomen knüpft an die Mutter im vorausgehenden Zusammenhang an; zusammen mit den Verben in der ersten Person entsteht im Griechischen ein abrupter Übergang in ihre eigene Stimme.
- source_word: οὐδʼ ἂν ἀποθάνω
  choice: selbst wenn ich sterbe
  rationale: ἂν mit dem Konjunktiv ἀποθάνω bezeichnet hier den hypothetischen Fall „wenn ich sterbe“. οὐδέ verstärkt die Verneinung des gesamten Gedankens im Sinn von „nicht einmal/selbst dann nicht“; im Deutschen wird diese Verneinung natürlich durch „keinen“ im Hauptgedanken ausgedrückt.
- source_word: θάπτοντα
  choice: der mich begräbt
  rationale: Das prädikative Partizip bezeichnet den Sohn, den die Mutter als ihren Bestatter haben würde. Das im Zusammenhang vorausgesetzte Objekt „mich“ wird im Deutschen zur Verständlichkeit ergänzt.
- source_word: τῶν υἱῶν ... τινά
  choice: keinen meiner Söhne
  rationale: τινά mit dem partitiven Genitiv meint einen beliebigen Einzelnen aus der Gruppe der Söhne; unter der Verneinung ergibt sich idiomatisch „keinen meiner Söhne“.
- source_word: ἕξω
  choice: werde ... haben
  rationale: ἕξω ist hier die erste Person Singular Futur von ἔχω („ich werde haben“), nicht das Zahlwort für „sechs“.
- source_word: ἀλλὰ τούτῳ τῷ θρήνῳ
  choice: Doch mit dieser Klage
  rationale: ἀλλά setzt einen deutlichen Gegensatz zur erwartbaren Totenklage; θρῆνος bezeichnet eine feierliche bzw. schmerzliche Klage.
- source_word: οὐδένα ὀλοφύρετο
  choice: beklagte ... keinen von ihnen
  rationale: ὀλοφύρομαι bezeichnet das klagende Betrauern; „keinen von ihnen“ nimmt die Söhne als erschließbare Bezugsgruppe auf.
- source_word: ἡ ἱερὰ καὶ θεοσεβὴς μήτηρ
  choice: die heilige und gottesfürchtige Mutter
  rationale: „heilig“ bewahrt die religiös erhöhte Bedeutung von ἱερά; „gottesfürchtig“ gibt den ausdrücklichen Gottesbezug von θεοσεβής wieder.
theological_decisions:
- issue: Wiedergabe von θεοσεβής
  choice: gottesfürchtig
  alternative: fromm
  rationale: „Gottesfürchtig“ bewahrt den ausdrücklichen Bezug auf die Ehrfurcht vor Gott, ohne eine konfessionelle Deutung einzutragen.
- issue: Abrupter Wechsel in die erste Person
  choice: die ich ... haben werde
  alternative: die ... keinen ihrer Söhne haben würde
  rationale: ἀποθάνω und ἕξω stehen beide in der ersten Person Singular. Die Übersetzung bewahrt diesen Wechsel in die Stimme der Mutter, statt ihn stillschweigend zur dritten Person zu glätten.
- issue: Bezug der Verneinung in οὐδʼ ἂν ἀποθάνω
  choice: selbst wenn ich sterbe, keinen ... haben werde
  alternative: selbst wenn ich nicht sterben sollte
  rationale: Die Konstruktion besagt sinnvoll, dass sie nicht einmal im Fall ihres Todes einen Sohn als Bestatter haben wird. Eine Verneinung des Sterbens selbst würde den Zusammenhang verdunkeln und die Reichweite von οὐδέ wahrscheinlich falsch bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche machen die verschachtelte, abrupt in die erste Person wechselnde Konstruktion lesbar, ohne sie in die dritte Person umzudeuten. Das abschließende Komma bleibt erhalten, da der überlieferte Vers syntaktisch in den folgenden Zusammenhang weiterführt.
