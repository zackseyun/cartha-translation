base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/002.yaml
  text: So I have shown that not only did men master the passions[a], but even a woman despised the greatest tortures.
translation:
  language: de
  text: Damit habe ich gezeigt, dass nicht nur Männer die Leidenschaften beherrschten, sondern sogar eine Frau die schlimmsten Foltern verachtete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geringschätzte“ oder „für gering achtete“.'
    reason: Das Verb ὑπερεφρόνησεν kann sowohl Verachtung als auch die Haltung ausdrücken, etwas für unbedeutend zu halten und innerlich darüberzustehen.
lexical_decisions:
- source_word: ἀπέδειξα
  choice: habe ich gezeigt
  rationale: Das Aoristverb kann „zeigen“, „nachweisen“ oder „beweisen“ bedeuten. Das Perfekt gibt den rückblickenden Abschluss der vorangegangenen Darlegung im Deutschen natürlich wieder, ohne den Sinn unnötig auf einen förmlichen Beweis zu verengen.
- source_word: οὖν
  choice: Damit
  rationale: Die Partikel zieht eine Folgerung aus der bisherigen Darlegung. „Damit“ verbindet den Satz idiomatisch mit dem zuvor geführten Nachweis.
- source_word: τῶν παθῶν
  choice: die Leidenschaften
  rationale: πάθη bezeichnet im Gedankengang des 4. Makkabäerbuches die inneren Leidenschaften beziehungsweise Regungen, die von der Vernunft beherrscht werden, nicht äußere Leiden.
- source_word: ἄνδρες
  choice: Männer
  rationale: Die konkrete Geschlechtsbezeichnung wird beibehalten, da der griechische Satz sie ausdrücklich der folgenden „Frau“ gegenüberstellt.
- source_word: ἐπεκράτησαν
  choice: beherrschten
  rationale: Das Verb bezeichnet das Erlangen oder Ausüben von Herrschaft und Kontrolle über etwas. „Beherrschen“ entspricht dem ethischen Leitgedanken des Buches.
- source_word: γυνή
  choice: eine Frau
  rationale: Der artikellose Singular hebt die Mutter als weibliches Beispiel hervor. „Eine Frau“ bewahrt den rhetorischen Gegensatz zu „Männer“.
- source_word: τῶν μεγίστων βασάνων
  choice: die schlimmsten Foltern
  rationale: βάσανοι bezeichnet hier konkrete Folterqualen; der Superlativ μεγίστων wird mit dem im Deutschen natürlichen „schlimmsten“ wiedergegeben.
- source_word: ὑπερεφρόνησεν
  choice: verachtete
  rationale: Das Verb beschreibt ein Darüberstehen, Geringschätzen oder Missachten. „Verachtete“ ist knapp, würdig und bewahrt die Aussage, dass die Foltern für sie keine bestimmende Macht hatten.
theological_decisions:
- issue: Bedeutung von πάθη im anthropologisch-ethischen Gedankengang
  choice: Leidenschaften
  alternative: Gefühle; Leiden
  rationale: Der zentrale Gedankengang des Buches betrifft die Herrschaft der vernünftigen Überlegung über innere Regungen. Die Wiedergabe als äußere „Leiden“ würde diese Spannung verwischen.
- issue: Geschlechtsspezifischer rhetorischer Gegensatz
  choice: Männer … eine Frau
  alternative: Menschen … eine Frau
  rationale: Die Gegenüberstellung ist im griechischen Wortlaut ausdrücklich angelegt und gehört zur Argumentation des Verfassers; sie wird daher nicht neutralisiert.
- issue: Haltung der Frau gegenüber den Foltern
  choice: verachtete
  alternative: achtete gering; setzte sich über sie hinweg
  rationale: Die Formulierung lässt sowohl Geringschätzung als auch ein inneres Darüberstehen anklingen. Der Haupttext wahrt die scharfe rhetorische Aussage, während die Fußnote die Bedeutungsnuance offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem argumentativem Ton. „Leidenschaften“ bewahrt den philosophisch-ethischen Leitbegriff; „Foltern“ benennt die konkrete Märtyrersituation klar. Der Fußnotenmarker steht bei dem Ausdruck, auf den sich die lexikalische Alternative tatsächlich bezieht.
