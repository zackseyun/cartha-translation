translation:
  language: de
  text: So seid auch ihr, da ihr denselben Glauben an Gott habt, nicht bekümmert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „da ihr dasselbe Vertrauen zu Gott habt, seid nicht aufgebracht“ oder „… seid nicht verbittert“. Das griechische Wort für „Glauben“ kann je nach Zusammenhang auch Vertrauen oder Treue bezeichnen; das Verb kann Bekümmernis, Verärgerung oder Erbitterung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: Da nun auch ihr
  rationale: Die Formulierung gibt den folgernden Anschluss durch οὖν, die Hervorhebung von ὑμεῖς und das einbeziehende καί in natürlichem Deutsch wieder.
- source_word: τὴν αὐτὴν πίστιν
  choice: denselben Glauben
  rationale: πίστις bezeichnet hier die mit den zuvor Genannten geteilte Haltung gegenüber Gott. „Glaube“ wahrt die lexikalische und theologische Breite; „Vertrauen“ ist als mögliche Nuance in der Fußnote genannt.
- source_word: πρὸς τὸν θεόν
  choice: an Gott
  rationale: Das griechische πρός mit Akkusativ bezeichnet hier die Ausrichtung beziehungsweise Beziehung zu Gott. „Glaube an Gott“ ist die natürliche deutsche Wendung, ohne die relationale Bedeutung aufzugeben.
- source_word: ἔχοντες
  choice: habt
  rationale: Der gleichzeitige, umstandsbezogene Partizipialsatz wird idiomatisch als Nebensatz wiedergegeben und bildet den Hintergrund der folgenden Aufforderung.
- source_word: μὴ χαλεπαίνητε
  choice: seid nicht verbittert
  rationale: χαλεπαίνω kann Schmerz, Verärgerung, Erbitterung oder Aufgebrachtsein ausdrücken. „Seid nicht verbittert“ passt zum mahnenden Trostzusammenhang, ohne die Bedeutung ausschließlich auf Zorn zu verengen.
theological_decisions:
- issue: Wiedergabe von πίστις
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: Die Aussage beschreibt dieselbe auf Gott ausgerichtete Haltung wie bei den zuvor genannten Glaubenszeugen. „Glaube“ bewahrt die theologische und lexikalische Weite; mögliche kontextuelle Nuancen werden nicht ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der griechische Partizipialsatz ist zur besseren Verständlichkeit als kausaler beziehungsweise umstandsbezogener Nebensatz formuliert; die Bedeutungsbreite der beiden Schlüsselwörter bleibt durch Fußnoten sichtbar.
