base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/008.yaml
  text: In vain[a], O children, did I endure many birth pains for you, and the more grievous anxieties of raising you.
translation:
  language: de
  text: Vergeblich[a], ihr Kinder, habe ich um euch viele Geburtswehen und die noch schwereren Sorgen eurer Erziehung ertragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Umsonst“.'
    reason: Lexikalische Alternative für μάτην; „umsonst“ kann hier ebenfalls „ohne bleibenden Erfolg“ bedeuten, ist jedoch potenziell mit „kostenlos“ missverständlich.
lexical_decisions:
- source_word: μάτην
  choice: Vergeblich
  rationale: Das Adverb bezeichnet die beklagte Vergeblichkeit; die knappe Voranstellung bewahrt den rhetorischen Nachdruck.
- source_word: ἐφʼ ὑμῖν
  choice: um euch
  rationale: Die Wendung bezeichnet hier, auf wen sich das Leiden der Mutter bezieht. „Um euch“ ist im Deutschen natürlich und verbindet sich zugleich passend mit Geburtswehen und Erziehungssorgen.
- source_word: ὦ παῖδες
  choice: ihr Kinder
  rationale: παῖδες bezeichnet die angesprochenen Nachkommen. „Ihr Kinder“ gibt den Vokativ in natürlichem, würdigem Gegenwartsdeutsch wieder, ohne das Geschlecht lexikalisch stärker festzulegen als nötig.
- source_word: πολλὰς ... ὠδῖνας
  choice: viele Geburtswehen
  rationale: ὠδῖνες meint konkret Wehen beziehungsweise Geburtsschmerzen; „Geburtswehen“ erhält das mütterliche Bild.
- source_word: ὑπέμεινα
  choice: habe ich ... ertragen
  rationale: Das Verb bezeichnet standhaftes Erdulden. Das deutsche Perfekt ist in heutiger direkter Rede natürlich und wahrt den Rückblick der Mutter.
- source_word: χαλεπωτέρας
  choice: die noch schwereren
  rationale: Der Komparativ stellt die Belastungen der Erziehung als schwerer als die Geburtswehen dar; „noch“ macht diesen Vergleich im Deutschen klar, ohne ihn aufzulösen.
- source_word: φροντίδας
  choice: Sorgen
  rationale: φροντίδες bezeichnet belastende Fürsorge oder Besorgnis. „Sorgen“ ist idiomatisch und umfasst sowohl innere Unruhe als auch die Last fürsorglicher Verantwortung.
- source_word: ἀνατροφῆς
  choice: eurer Erziehung
  rationale: Der Genitiv bestimmt den Bereich der Sorgen als Aufziehen beziehungsweise Erziehung der Kinder. „Eurer Erziehung“ ist knapp, natürlich und sachlich genau.
theological_decisions: []
translation_notes:
  register: Würdige, emotionale direkte Rede in modernem Standarddeutsch. Die Anrede „ihr Kinder“ vermeidet ein heute gekünstelt wirkendes „o Kinder“. Der Vergleich zwischen Geburtswehen und den noch schwereren Erziehungssorgen bleibt ausdrücklich erhalten.
