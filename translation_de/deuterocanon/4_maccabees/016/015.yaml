  text: Denn auch als du zusammen mit deinen Kindern festgenommen wurdest, standest du da und sahst zu, wie Eleasar gefoltert wurde, und—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελήμφθης
  choice: festgenommen wurdest
  rationale: Gibt den Aorist Passiv von συλλαμβάνω in diesem Verfolgungskontext natürlich und präzise wieder.
- source_word: μετὰ τῶν παίδων
  choice: zusammen mit deinen Kindern
  rationale: παῖδες bezeichnet hier im Kontext die Kinder der angesprochenen Mutter; „zusammen mit“ gibt μετά klar wieder.
- source_word: εἱστήκεις
  choice: standest du da
  rationale: Bewahrt den durativen Charakter des Plusquamperfekts mit imperfektivem Sinn und klingt im Deutschen idiomatisch.
- source_word: ὁρῶσα
  choice: sahst zu, wie
  rationale: Das feminine Partizip bezieht sich auf die angesprochene Mutter und beschreibt ihr anhaltendes Mitansehen des Geschehens.
- source_word: βασανιζόμενον
  choice: gefoltert wurde
  rationale: Das passive Präsenspartizip bezeichnet die fortdauernde Folter Eleasars.
