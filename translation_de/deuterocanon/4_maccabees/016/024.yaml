base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/024.yaml
  text: By these words the mother of seven[a], encouraging each one of her sons, persuaded them rather to die than to transgress the commandment of God[b];
translation:
  language: de
  text: Mit diesen Worten ermutigte die Mutter von sieben Söhnen[a] jeden einzelnen ihrer Söhne[b] und überzeugte sie, lieber zu sterben, als das Gebot Gottes zu übertreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ein griechisches Kompositum: „die Siebenmutter“, also die Mutter von sieben Kindern; der folgende Satzteil bezeichnet sie ausdrücklich als Söhne.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: ermahnte jeden einzelnen ihrer Söhne. Das griechische Wort kann sowohl ermutigenden Zuspruch als auch eindringliche Ermahnung bezeichnen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Διὰ τούτων τῶν λόγων
  choice: Mit diesen Worten
  rationale: διά mit dem Genitiv bezeichnet hier das Mittel. „Mit diesen Worten“ gibt diese instrumentale Bedeutung in natürlichem Deutsch wieder.
- source_word: ἡ ἑπτάμητωρ
  choice: die Mutter von sieben
  rationale: Das griechische Kompositum bezeichnet knapp eine Frau als Mutter von sieben. Die elliptische deutsche Form bewahrt diese rhetorische Kürze; dass es sich um ihre Söhne handelt, sagt der folgende Ausdruck ausdrücklich.
- source_word: ἕνα ἕκαστον τῶν υἱῶν
  choice: jedem einzelnen ihrer Söhne
  rationale: Die distributive und betonte Wendung richtet den Blick auf jeden Sohn für sich. Der Dativ ergibt sich im Deutschen aus „Mut zusprechen“.
- source_word: παρακαλοῦσα
  choice: sprach … Mut zu
  rationale: παρακαλέω kann ermutigen, ermahnen oder eindringlich zureden bedeuten. Im Zusammenhang stärkt die Mutter ihre Söhne zur Standhaftigkeit; „Mut zusprechen“ verbindet Zuspruch und Ermutigung, ohne den mahnenden Bedeutungsanteil auszuschließen.
- source_word: ἔπεισε
  choice: überzeugte sie
  rationale: πείθω bezeichnet erfolgreiches Überzeugen oder Bewegen. Das pluralische „sie“ nimmt die zuvor einzeln genannten Söhne zusammenfassend auf.
- source_word: μᾶλλον ἀποθανεῖν, ἢ παραβῆναι
  choice: lieber zu sterben, als … zu übertreten
  rationale: Die Vergleichskonstruktion stellt den Tod als vorzuziehende Möglichkeit dem Ungehorsam gegenüber. „Lieber … als“ ist dafür die natürliche deutsche Form.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: das Gebot Gottes
  rationale: „Gebot“ bewahrt den religiös-rechtlichen Ernst von ἐντολή und entspricht dem gehobenen, schriftgemäßen Register.
theological_decisions:
- issue: Wiedergabe des kompakten Epithetons ἑπτάμητωρ
  choice: die Mutter von sieben
  alternative: die Mutter von sieben Söhnen
  rationale: Die knappe Form wahrt die Eigenart des griechischen Kompositums, während „Söhne“ unmittelbar danach ausdrücklich folgt. So wird keine Information vorgezogen oder doppelt wiedergegeben.
- issue: Moralisch-rechtlicher Ton von παραβῆναι τὴν ἐντολὴν τοῦ θεοῦ
  choice: das Gebot Gottes zu übertreten
  alternative: Gottes Gebot zu brechen
  rationale: „Übertreten“ erhält die feierliche Schwere des Widerstands gegen ein göttliches Gebot, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung „Mutter von sieben“ bewahrt die rhetorische Knappheit des griechischen Epithetons; die Fußnote erläutert sie. Der Satz bleibt flüssig und behält den feierlichen Ernst der Treue zu Gottes Gebot.
