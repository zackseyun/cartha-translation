base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/021.yaml
  text: And Daniel the righteous man was thrown to the lions[a]; and Hananiah and Azariah and Mishael were hurled into a furnace of fire[b], and they endured because of God.
translation:
  language: de
  text: Und Daniel, der Gerechte, wurde den Löwen vorgeworfen; und Hananja, Asarja und Mischaël[a] wurden in einen Feuerofen geschleudert und hielten um Gottes willen stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hananja, Asarja und Mischaël sind die hebräischen Namen der drei jungen Männer, die auch als Schadrach, Meschach und Abed-Nego bekannt sind.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: der Gerechte
  rationale: Der substantivierte Artikel mit Adjektiv bezeichnet Daniel als einen gerechten Menschen. „Der Gerechte“ ist im Deutschen natürlich, würdig und bewahrt den moralisch-religiösen Sinn.
- source_word: εἰς λέοντας
  choice: den Löwen vorgeworfen
  rationale: Zusammen mit dem Passiv von βάλλω bezeichnet die Wendung die Auslieferung an die Löwen. Die Übersetzung bleibt idiomatisch, ohne die im Griechischen nicht ausdrücklich genannte Löwengrube einzufügen.
- source_word: ἐβλήθη
  choice: wurde … vorgeworfen
  rationale: Der Aorist Passiv von βάλλω wird klar und kraftvoll wiedergegeben; „vorwerfen“ passt im Deutschen idiomatisch zur Ergänzung „den Löwen“.
- source_word: ἀπεσφενδονήθησαν
  choice: wurden … geschleudert
  rationale: Das anschauliche Verb bezeichnet ein heftiges Schleudern und wird bewusst stärker wiedergegeben als das vorherige ἐβλήθη.
- source_word: εἰς κάμινον πυρὸς
  choice: in einen Feuerofen
  rationale: „Feuerofen“ gibt sowohl κάμινος als auch πυρός in natürlichem modernem Deutsch wieder. Die wörtlichere Form „Ofen aus Feuer“ wäre missverständlich, „Ofen des Feuers“ unidiomatisch.
- source_word: ὑπέμειναν
  choice: hielten … stand
  rationale: Die Wendung drückt beharrliches Ausharren unter der Bedrohung aus und ist im Deutschen natürlicher als das hier mögliche, aber weniger präzise „sie ertrugen es“.
- source_word: διὰ τὸν θεόν
  choice: um Gottes willen
  rationale: διά mit Akkusativ bezeichnet hier den Grund oder Beweggrund ihres Standhaltens. „Um Gottes willen“ bewahrt diesen Bezug in würdigem Kontext, obwohl die Wendung umgangssprachlich auch als Ausruf vorkommen kann.
theological_decisions:
- issue: Hebräische Namen der drei jungen Männer statt ihrer bekannteren babylonischen Namen
  choice: Hananja, Asarja und Mischaël
  alternative: Schadrach, Meschach und Abed-Nego
  rationale: Der griechische Text nennt ihre hebräischen Namen. Diese werden beibehalten; eine Fußnote nennt die in vielen Bibelübersetzungen bekannteren babylonischen Namen.
- issue: Bedeutung von δίκαιος als Bezeichnung Daniels
  choice: der Gerechte
  alternative: der Rechtschaffene
  rationale: „Der Gerechte“ bewahrt die moralisch-religiöse Bedeutung und legt keine spezifische konfessionelle Rechtfertigungslehre in die erzählerische Bezeichnung hinein.
- issue: Begründung des Standhaltens durch διὰ τὸν θεόν
  choice: um Gottes willen
  alternative: wegen Gottes
  rationale: Die Formulierung lässt offen, ob stärker Ursache, Beweggrund oder Hingabe gemeint ist, und bewahrt dadurch die knappe theologische Spannung des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden unterschiedlich starken griechischen Verben werden durch „vorwerfen“ und „schleudern“ unterschieden. Die Satzreihung mit wiederholtem „und“ folgt dem rhetorischen Aufbau der Vorlage, ohne unnötige Ergänzungen.
