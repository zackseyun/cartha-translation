base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/001.yaml
  text: If[a], then, even a woman—an old woman and a mother of children—endured the tortures up to death while seeing the sufferings of her children, godly reason is master of the passions.
translation:
  language: de
  text: Wenn also sogar eine Frau – eine alte Frau und Mutter von Kindern – die Folterungen bis zum Tod ertrug, während sie ihre Kinder laut klagen sah[a], dann ist die gottesfürchtige Vernunft Herrin über die Leidenschaften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „während sie ihre Kinder laut klagen sah“. Der griechische Satzbau ist hier gedrängt und schwierig; die Formulierung kann das laute Klagen oder Aufschreien der Kinder hervorheben.'
    reason: Lexikalische und syntaktische Anmerkung zu ὁρῶσα τῶν τέκνων ὁλολυγμένων im schwierigen überlieferten Wortlaut.
lexical_decisions:
- source_word: Εἰ δὲ τοίνυν
  choice: Wenn also … dann
  rationale: Bewahrt den folgernden und zugleich nachdrücklichen Übergang. Das im Deutschen ergänzte „dann“ macht den Bedingungssatz natürlich verständlich, ohne die Aussage inhaltlich zu verändern.
- source_word: γυνὴ καὶ γεραιὰ
  choice: eine Frau – eine alte Frau
  rationale: γυνή bedeutet hier schlicht „Frau“; γεραιά hebt ihr hohes Alter hervor. Die appositionelle Wiederaufnahme erhält den rhetorischen Nachdruck.
- source_word: ἐπὶ παιδῶν μήτηρ
  choice: Mutter von Kindern
  rationale: Die Wendung betont ihre Mutterschaft und ihren Bezug zu den Kindern, deren Qualen sie miterlebte. „Kinder“ wahrt die Geschlechtsneutralität von παῖδες.
- source_word: ὑπέμεινεν
  choice: ertrug
  rationale: Gibt das standhafte Ausharren unter schwerem Leiden knapp und idiomatisch wieder.
- source_word: τὰς μέχρι θανάτου βασάνους
  choice: die Folterungen bis zum Tod
  rationale: βάσανοι bezeichnet hier zugefügte Qualen beziehungsweise Folterungen; μέχρι θανάτου benennt deren äußerste Grenze oder Reichweite.
- source_word: ὁρῶσα τῶν τέκνων· ὁλολυγμένων
  choice: während sie die Leiden ihrer Kinder mitansah
  rationale: Der überlieferte griechische Ausdruck ist syntaktisch gedrängt und textlich schwierig. Die Hauptfassung gibt die im Kontext erkennbare Szene wieder; die lautliche Bedeutung des Weinens oder Aufschreiens bleibt in der Fußnote erhalten.
- source_word: αὐτοκράτωρ
  choice: Herrin
  rationale: Bezeichnet die beherrschende, souveräne Stellung der Vernunft gegenüber den Leidenschaften. Das feminine „Herrin“ stimmt im Deutschen mit „Vernunft“ überein.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: πάθη ist im Werk ein philosophischer Leitbegriff für Leidenschaften beziehungsweise antreibende Affekte. Die Präposition „über“ drückt die vom Genitiv bezeichnete Herrschaftsbeziehung idiomatisch aus.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  rationale: Die Wiedergabe verbindet vernünftiges Urteilen mit der Ausrichtung auf Ehrfurcht vor Gott und bleibt für moderne Leser verständlich.
theological_decisions:
- issue: Der programmatische Ausdruck ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  alternative: die fromme Vernunft
  rationale: „Gottesfürchtig“ macht die religiöse Ausrichtung von εὐσεβής deutlich, ohne λογισμός auf bloße Frömmigkeit oder auf eine rein technische Rationalität zu verengen.
- issue: Herrschaft der Vernunft über τὰ πάθη
  choice: Herrin über die Leidenschaften
  alternative: unumschränkte Herrscherin über die Affekte
  rationale: Die Fassung erhält die starke Herrschaftsaussage von αὐτοκράτωρ, vermeidet aber eine zusätzliche philosophische Präzisierung, die der schwierige Satz nicht ausdrücklich verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche bewahren die rhetorische Steigerung „Frau – alte Frau – Mutter“. Der philosophisch-theologische Leitwortcharakter von „Vernunft“ und „Leidenschaften“ bleibt erhalten; die syntaktische Unsicherheit der Kinder-Klausel wird nicht verschwiegen.
