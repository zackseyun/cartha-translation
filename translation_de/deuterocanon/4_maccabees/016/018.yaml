  text: Do not let the younger men be terrified by the tortures. Remember that for the sake of the God of the world you have partaken of this[a], and have enjoyed life;
translation:
  language: de
  text: … dass die Jüngeren vor den Foltern erschrecken. Erinnert euch daran, dass ihr dank Gott Anteil an der Welt gehabt und das Leben genossen habt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς νεωτέρους
  choice: die Jüngeren
  rationale: Der substantivierte Komparativ bezeichnet die jüngeren Angehörigen der Gruppe; die Formulierung bleibt ebenso offen wie das Griechische und legt nicht unnötig „Männer“ oder „Brüder“ fest.
- source_word: καταπλαγῆναι τὰς βασάνους
  choice: vor den Foltern erschrecken
  rationale: Der Aorist-Passiv-Infinitiv bezeichnet ein Erschrecken oder Überwältigtwerden; βάσανοι sind hier konkret die Foltern. Der Satzanfang bleibt als von Vers 17 abhängiges Fragment kenntlich, da im vorgelegten griechischen Text weder ein verneintes Gebot noch ein selbstständiges Prädikat steht.
- source_word: ἀναμνήσθητε
  choice: Erinnert euch daran
  rationale: Der Aorist-Imperativ fordert zu bewusstem Erinnern auf; die deutsche Wendung ist klar und gegenwärtig.
- source_word: διὰ τὸν θεὸν
  choice: durch Gott
  rationale: διά mit Akkusativ kann den Grund bezeichnen. In Verbindung mit dem folgenden Parallelismus wird Gott hier natürlich als der Grund dafür verstanden, dass die Angeredeten Anteil an Welt und Leben erhielten.
- source_word: τοῦ κόσμου μετελάβετε
  choice: Anteil an der Welt erhalten
  rationale: μεταλαμβάνω regiert den Genitiv. Die Wortstellung und der Parallelismus mit τοῦ βίου ἀπελαύσατε sprechen dafür, τοῦ κόσμου als Objekt von μετελάβετε zu lesen, statt es zwingend an θεόν anzuschließen.
- source_word: τοῦ βίου ἀπελαύσατε
  choice: das Leben genossen habt
  rationale: ἀπολαύω mit Genitiv bedeutet, etwas zu genießen oder seinen Nutzen zu erfahren. Die Wiedergabe ist direkt und idiomatisch.
theological_decisions:
- issue: Zuordnung von τοῦ κόσμου
  choice: 'τοῦ κόσμου wird als Genitivobjekt zu μετελάβετε verstanden: „Anteil an der Welt erhalten“'
  alternative: 'τοῦ κόσμου wird als Attribut zu θεόν verstanden: „der Gott der Welt“; dann bleibt das Objekt von μετελάβετε unausgesprochen.'
  rationale: Die unmittelbare Nachbarschaft erlaubt beide Analysen. Der parallele Bau τοῦ κόσμου μετελάβετε / τοῦ βίου ἀπελαύσατε stützt jedoch deutlich die gewählte Zuordnung. Die alternative, theologisch ebenfalls mögliche Lesart wird in einer Fußnote bewahrt.
- issue: Negation am Versanfang
  choice: Das abhängige Satzfragment wird mit Auslassungszeichen wiedergegeben, ohne eine Negation einzufügen.
  alternative: „Lasst die Jüngeren nicht vor den Foltern erschrecken.“
  rationale: Im gelieferten griechischen Versstück stehen weder μή noch ein selbstständiges Verb mit der Bedeutung „lasst nicht“. Die englische Fassung ergänzt dies offenbar aus dem vorangehenden Zusammenhang; originalsprachliche Priorität verlangt, die textliche Abhängigkeit sichtbar zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Anfang wird nicht durch eine im vorgelegten griechischen Text fehlende Negation geglättet. „Die Jüngeren“ vermeidet eine unnötige Präzisierung, während „Foltern“ die konkrete Härte des Zusammenhangs wahrt.
