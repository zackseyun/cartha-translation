  yaml_path: translation/deuterocanon/4_maccabees/016/005.yaml
  text: 'For consider this also: if the woman had been fainthearted, though she was a mother, she would have wailed over them; and perhaps she would have spoken like this:'
translation:
  language: de
  text: 'Denn bedenkt auch dies: Wenn die Frau mutlos gewesen wäre, hätte sie, obwohl sie Mutter war, um sie geklagt; und vielleicht hätte sie etwa so gesprochen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλογίσασθαι
  choice: Bedenkt
  rationale: Der Infinitiv führt einen weiteren Gesichtspunkt ein, den die Angesprochenen erwägen sollen. Der deutsche Imperativ gibt die auffordernde Kraft natürlich wieder.
- source_word: δειλόψυχος
  choice: mutlos
  rationale: Das Wort bezeichnet mangelnden Mut oder innere Standhaftigkeit. „Mutlos“ ist im heutigen Deutsch verständlich und weniger verurteilend als „feige“.
- source_word: γυνή
  choice: die Frau
  rationale: γυνή wird eigenständig als „die Frau“ wiedergegeben; die folgende Bezeichnung als Mutter bleibt dadurch rhetorisch erhalten.
- source_word: καίπερ μήτηρ οὖσα
  choice: obwohl sie Mutter war
  rationale: καίπερ verleiht der Wendung ausdrücklich einen konzessiven Sinn, der so klar und nah am Griechischen wiedergegeben wird.
- source_word: ὠλοφύρετο
  choice: hätte ... geklagt
  rationale: Das Verb bezeichnet hörbare Toten- oder Trauerklage. „Um sie geklagt“ ist würdig und idiomatisch; „gejammert“ wäre abwertend, „geheult“ zu umgangssprachlich.
- source_word: ἐπʼ αὐτοῖς
  choice: um sie
  rationale: Die Präpositionalfügung bezeichnet hier die Söhne als Gegenstand ihrer Klage. Im Deutschen verbindet sich „um jemanden klagen“ natürlich mit Trauer.
- source_word: ἴσως
  choice: vielleicht
  rationale: Das Adverb bewahrt den vorsichtigen, hypothetischen Ton der rhetorischen Hinführung.
- source_word: ταῦτα οὕτως εἶπεν
  choice: hätte sie etwa so gesprochen
  rationale: Die Formulierung leitet die folgende vorgestellte Rede ein. „Etwa so“ bildet den demonstrativen Sinn idiomatisch ab, ohne einen genauen Wortlaut zu behaupten.
theological_decisions:
- issue: Konzessive Darstellung von Muttersein und fehlender Standhaftigkeit
  choice: 'Die Aussage bleibt ein hypothetischer Kontrast: Wäre sie mutlos gewesen, hätte sie trotz ihres Mutterseins geklagt.'
  alternative: Deutender hervorheben, dass natürliche Mutterliebe gewöhnlich zur Klage geführt hätte.
  rationale: Der griechische Text stellt Muttersein, Mut und Trauer rhetorisch in Spannung, erklärt diese Spannung aber nicht weiter. Die Übersetzung bewahrt sie, ohne eine zusätzliche moralische oder psychologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Imperativ macht die im griechischen Infinitiv liegende Aufforderung natürlich kenntlich. Der doppelte Konjunktiv II bildet den irrealen Bedingungssatz ab. Keine Fußnoten erforderlich.
