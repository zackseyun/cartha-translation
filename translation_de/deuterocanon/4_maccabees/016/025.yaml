  yaml_path: translation/deuterocanon/4_maccabees/016/025.yaml
  text: And even more, by seeing this—that after dying for God they live to God, just as Abraham and Isaac and Jacob, and all the patriarchs do—
translation:
  language: de
  text: 'Und darüber hinaus erkennen sie dies: dass diejenigen, die um Gottes willen gestorben sind, Gott leben[a], ebenso wie Abraham, Isaak und Jakob und alle Patriarchen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Gott leben“. Das Griechische hat „leben“ mit einem Dativ („Gott“). Die Wendung bezeichnet ein Leben in Beziehung zu Gott; die genaue Art dieser Beziehung wird nicht näher bestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ καὶ
  choice: Und darüber hinaus
  rationale: Gibt die steigernde und ergänzende Bedeutung der Wendung in natürlichem, würdigem Deutsch wieder.
- source_word: ταῦτα ἰδόντες
  choice: erkennt auch dies
  rationale: Das Partizip ἰδόντες bezeichnet hier ein Wahrnehmen beziehungsweise Erkennen. Die deutsche Formulierung macht den appellativen Zusammenhang verständlich; das formal plurale ταῦτα wird kollektiv mit „dies“ wiedergegeben.
- source_word: διὰ τὸν θεόν
  choice: um Gottes willen
  rationale: διά mit Akkusativ bezeichnet im Märtyrerkontext Grund oder Beweggrund. „Um Gottes willen“ ist präziser als das im Deutschen missverständliche „für Gott“.
- source_word: ἀποθανόντες
  choice: gestorben sind
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung; der deutsche Relativsatz gibt diese zeitliche Abfolge natürlich wieder.
- source_word: ζῶσιν τῷ θεῷ
  choice: leben für Gott
  rationale: Die Wendung wahrt die Beziehung auf Gott, die der griechische Dativ ausdrückt, ohne das Leben ausdrücklich als „bei Gott“ zu lokalisieren. Eine Fußnote weist auf die Offenheit des Dativs hin.
- source_word: ὥσπερ
  choice: ebenso wie
  rationale: Leitet den Vergleich klar und idiomatisch ein.
- source_word: οἱ πατριάρχαι
  choice: die Patriarchen
  rationale: „Patriarchen“ ist die etablierte deutsche Bezeichnung für die genannten Erzväter und weiteren Stammväter.
theological_decisions:
- issue: Das Leben der für Gott Gestorbenen in ihrer Beziehung zu Gott
  choice: leben für Gott
  alternative: leben in Bezug auf Gott; leben bei Gott
  rationale: Der Text bejaht, dass die Gestorbenen leben, und setzt sie mit Abraham, Isaak, Jakob und allen Patriarchen in Beziehung. „Für Gott“ bildet den Dativ τῷ θεῷ idiomatisch ab; „bei Gott“ würde eine räumliche oder metaphysische Bestimmung hinzufügen, die der griechische Wortlaut nicht ausdrücklich enthält. Die Fußnote bewahrt die genuine Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Um Gottes willen“ vermeidet die Wiederholung und mögliche Verwechslung zweier verschiedener griechischer Konstruktionen. Die Satzgestalt folgt dem fragmentarisch anschließenden Charakter des griechischen Verses, wird im Deutschen jedoch als verständlicher Appell formuliert.
