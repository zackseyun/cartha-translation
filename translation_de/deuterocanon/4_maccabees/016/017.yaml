lexical_decisions:
- source_word: προθύμως
  choice: bereitwillig
  rationale: Das Adverb bezeichnet eine willige, entschlossene Bereitschaft; „bereitwillig“ bewahrt diesen Sinn, ohne eine besonders starke Gefühlsregung vorauszusetzen.
- source_word: ὑπὲρ τοῦ πατρίου νόμου
  choice: für das überlieferte Gesetz
  rationale: ὑπέρ mit Genitiv bedeutet hier „für“ beziehungsweise „um ... willen“. πατρίος bezeichnet das von den Vorfahren überkommene Gut; „überliefert“ klingt im modernen Deutschen natürlicher als „väterlich“ und wahrt den Bezug auf das ererbte jüdische Gesetz.
- source_word: αἰσχρόν
  choice: eine Schande
  rationale: Die substantivische Wendung gibt das moralische Scham- und Ehrmotiv des griechischen Prädikats idiomatisch und nachdrücklich wieder.
- source_word: τὸν ... γέροντα τοῦτον
  choice: dieser alte Mann
  rationale: Die Formulierung erhält den demonstrativen Nachdruck und den rhetorischen Gegensatz zwischen dem alten Mann und den angesprochenen Jüngeren.
- source_word: ὑπομεῖναι
  choice: ertrüge
  rationale: Der Infinitiv bezeichnet standhaftes Aushalten. Im deutschen Konditionalsatz gibt der Konjunktiv II die Konstruktion nach αἰσχρόν natürlich wieder.
- source_word: τὰς ... ἀλγηδόνας
  choice: die Schmerzen
  rationale: ἀλγηδών bezeichnet körperliche Schmerzen oder Leiden; „Schmerzen“ bleibt eng am Wortlaut und verstärkt nicht unnötig zu „Qualen“.
- source_word: διὰ τὴν εὐσέβειαν
  choice: um der Gottesverehrung willen
  rationale: διά mit Akkusativ bezeichnet hier den Grund. εὐσέβεια meint ehrfürchtige, treue Hingabe an Gott; „Gottesverehrung“ macht die Ausrichtung auf Gott deutlich und vermeidet die mögliche Verengung von „Frömmigkeit“ auf bloße Innerlichkeit.
theological_decisions:
- issue: Bedeutung von εὐσέβεια im Martyriumskontext
  choice: Gottesverehrung
  alternative: Frömmigkeit
  rationale: Der Ausdruck umfasst Ehrfurcht und gelebte Treue gegenüber Gott, besonders in der Befolgung seines Gesetzes. „Gottesverehrung“ hält diese theologische Ausrichtung ausdrücklich fest; die ebenfalls mögliche Wiedergabe „Frömmigkeit“ wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Anfang wird entsprechend dem griechischen Verszuschnitt beibehalten. Der Gedankenstrich am Ende wahrt den unvollständigen Satz, ohne ihn aus dem folgenden Vers zu ergänzen.
