  yaml_path: translation/deuterocanon/4_maccabees/016/006.yaml
  text: Alas for me indeed[a], thrice-wretched many times over[b]! Though I bore seven children[c], I have become the mother of none.
translation:
  language: de
  text: Ach, ich Elende[a], ich so oft dreifach Unglückliche[b]! Obwohl ich sieben Kinder[c] geboren habe, bin ich nun die Mutter keines Einzigen mehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weh mir“ beziehungsweise „O ich Elende!“ Der griechische Ausruf ist eine Selbstklage.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „oft dreifach unglücklich“. Die ungewöhnliche Häufung verstärkt den Ausdruck des Leids.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sieben Söhne“. Das griechische Wort kann „Kinder“ oder „Söhne“ bedeuten; im Zusammenhang sind männliche Nachkommen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μελέα ἔγωγε
  choice: Ach, ich Elende
  rationale: Die Ausrufung ist eine emphatische Selbstklage. „Ach, ich Elende“ gibt sowohl Ὦ μελέα als auch den Nachdruck des selbstbezogenen ἔγωγε in natürlichem, würdevollem Deutsch wieder.
- source_word: πολλάκις τρισαθλία
  choice: immer wieder dreifach Unglückliche
  rationale: πολλάκις bezeichnet die wiederholte beziehungsweise vielfache Steigerung; τρισαθλία ist ein stark intensiviertes „unglücklich/elendig“. Die ungewöhnliche Wendung „dreifach Unglückliche“ bewahrt das eindringliche griechische Bild.
- source_word: ἥτις ἑπτὰ παῖδας τεκοῦσα
  choice: Sieben Kinder habe ich geboren
  rationale: Das Partizip τεκοῦσα bezeichnet das Gebären. Die eigenständige Satzstellung bildet den emotionalen Bruch nach der Klage nach; der anschließende Gegensatz gibt die im Relativsatz liegende Begründung beziehungsweise Konzession wieder.
- source_word: ἑπτὰ παῖδας
  choice: sieben Kinder
  rationale: παῖδας kann „Kinder“ oder „Söhne“ bedeuten. „Kinder“ wahrt die lexikalische Breite; aus dem Kontext geht hervor, dass männliche Nachkommen gemeint sind.
- source_word: οὐδενὸς μήτηρ γεγένημαι
  choice: bin ich nun keines mehr Mutter
  rationale: Das Perfekt γεγένημαι beschreibt einen eingetretenen Zustand. „nun“ und „mehr“ machen den gegenwärtigen Verlust nach der Geburt der sieben Kinder deutlich und bewahren zugleich das Paradox der Aussage.
theological_decisions:
- issue: Deutung der Klage der Mutter nach dem Tod ihrer Kinder
  choice: 'Die Aussage bleibt als schmerzliches Paradox formuliert: Sie hat sieben Kinder geboren und ist nun doch keines mehr Mutter.'
  alternative: „Ich bin niemandes Mutter“ oder streng wörtlich „Ich bin zur Mutter keines Einzigen geworden“.
  rationale: Das griechische Perfekt trägt Ergebnisbedeutung, während der Gegensatz zwischen dem Gebären und dem gegenwärtigen Verlust die rhetorische Spannung erzeugt. Die Übersetzung bewahrt diese Spannung, ohne über den Text hinaus eine theologische Deutung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in einem würdevollen, emotional eindringlichen Register. Die kurze Ausrufung und der anschließende Aussagesatz erhalten den Bruch der Klage; die ungewöhnliche griechische Steigerung wird bewusst sichtbar gehalten.
