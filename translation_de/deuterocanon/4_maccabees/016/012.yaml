  text: Nor did she try to turn any of them away so that they might not die, nor did she grieve as they were dying.
translation:
  language: de
  text: Sie versuchte auch nicht, einen von ihnen davon abzubringen, um ihn vor dem Tod zu bewahren; ebenso wenig empfand sie Kummer, während sie starben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέτρεπεν
  choice: versuchte ... davon abzubringen
  rationale: Das Imperfekt bezeichnet eine andauernde oder wiederholte Handlung in der Vergangenheit. Im Zusammenhang geht es darum, dass die Mutter keinen ihrer Söhne von seinem Weg abzubringen suchte; „versuchte ... davon abzubringen“ gibt diesen Sinn wieder, ohne einen erfolgreichen Ausgang zu behaupten.
- source_word: αὐτῶν τινα
  choice: einen von ihnen
  rationale: Die partitive Wendung bezeichnet irgendeinen Einzelnen aus ihrer Gruppe. Im negierten deutschen Satz gibt „nicht ... einen von ihnen“ den distributiven Sinn natürlich wieder.
- source_word: ἵνα μὴ ἀποθάνωσιν
  choice: damit er nicht sterbe
  rationale: Der ἵνα-Satz drückt einen Zweck aus. Da τινα grammatisch einen Einzelnen bezeichnet, wird die im Griechischen pluralisch formulierte Klausel im Deutschen idiomatisch auf „einen von ihnen“ bezogen; der Konjunktiv bewahrt den Zweckcharakter.
- source_word: ἐλυπήθη
  choice: wurde ... traurig
  rationale: Das Verb bezeichnet Trauer, Kummer oder seelischen Schmerz. „wurde traurig“ ist klares, heutiges Deutsch und vermeidet die mögliche Engführung von „trauerte“ auf eine Klage nach dem Tod.
- source_word: ὡς ἀποθνῃσκόντων
  choice: als sie starben
  rationale: Der Genitivus absolutus beschreibt den gleichzeitigen Umstand. „als sie starben“ ist natürlich und lässt den durativen Verlauf des Sterbens im Kontext erkennen, ohne eine nachträgliche Trauer zu unterstellen.
theological_decisions:
- issue: Bezugswort des unausgedrückten Subjekts
  choice: Das Subjekt wird als „sie“ wiedergegeben und auf die Mutter im unmittelbaren Zusammenhang bezogen.
  alternative: Das Subjekt ungenannt lassen.
  rationale: Im Griechischen ist das Subjekt nur durch die Verbformen angezeigt; der Kontext identifiziert die Mutter. Im Deutschen ist das ausdrückliche Pronomen für einen natürlichen und eindeutigen Satz erforderlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Verneinung οὐδ’ ... οὐδ’ wird durch „auch nicht ... und ... auch nicht“ erhalten. Keine konfessionell geprägte Deutung wird hinzugefügt.
