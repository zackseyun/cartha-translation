base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/010.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving their brothers, and so devoted to their mother that, even while keeping the law's requirements to the point of death[b], they obeyed her.
translation:
  language: de
  text: Denn sie waren gerecht und selbstbeherrscht[a], mutig und von edler Gesinnung, voller Liebe zu ihren Brüdern und ihrer Mutter so ergeben, dass sie ihr gehorchten, während sie die Vorschriften des Gesetzes[b] bis in den Tod befolgten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „besonnen“. Das griechische Wort verbindet vernünftige Besonnenheit mit Selbstbeherrschung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die gesetzlichen Satzungen“ beziehungsweise „die vom Gesetz vorgeschriebenen Bräuche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: gerecht
  rationale: Das Wort bezeichnet in diesem Tugendkatalog moralische Rechtschaffenheit und bewahrt zugleich den religiös-ethischen Klang des griechischen Ausdrucks.
- source_word: σώφρονες
  choice: selbstbeherrscht
  rationale: Der Ausdruck bezeichnet vernünftige Besonnenheit, die sich in der Beherrschung von Begierden und Affekten zeigt; „selbstbeherrscht“ ist im heutigen Deutsch klar und passt zum Tugendkatalog.
- source_word: ἀνδρεῖοι
  choice: mutig
  rationale: Gemeint ist Tapferkeit. „Mutig“ gibt den Sinn natürlich wieder, ohne die im Deutschen irreführende geschlechtliche Färbung von „mannhaft“ einzutragen.
- source_word: μεγαλόψυχοι
  choice: von edler Gesinnung
  rationale: Das Wort bezeichnet wörtlich eine große oder hochgesinnte Seele. „Von edler Gesinnung“ vermittelt die charakterliche Größe verständlich, ohne den Sinn auf bloße Großzügigkeit zu verengen.
- source_word: φιλάδελφοι
  choice: voller Liebe zu ihren Brüdern
  rationale: Der Ausdruck bezeichnet hier die Zuneigung der sieben leiblichen Brüder zueinander; deshalb bleibt der konkrete männliche Familienbezug erhalten.
- source_word: φιλόμητρος
  choice: ihrer Mutter ergeben
  rationale: Das Adjektiv drückt liebevolle Verbundenheit und Treue gegenüber der Mutter aus. „Ergeben“ erfasst im Zusammenhang sowohl Zuneigung als auch die Bereitschaft, auf sie zu hören.
- source_word: μέχρι θανάτου
  choice: bis in den Tod
  rationale: Die Wendung bezeichnet die äußerste Grenze ihrer Gesetzestreue unter Verfolgung und wird im Deutschen würdig und idiomatisch wiedergegeben.
- source_word: τὰ νόμιμα
  choice: die Vorschriften des Gesetzes
  rationale: Im makkabäischen Kontext sind die durch das überlieferte Gesetz festgelegten Gebote und Ordnungen gemeint. Die Übersetzung ist klar, ohne sie unnötig auf kultische oder staatliche Bestimmungen einzugrenzen.
- source_word: φυλάσσοντας
  choice: befolgten
  rationale: In Verbindung mit τὰ νόμιμα bedeutet das Partizip, vorgeschriebene Ordnungen einzuhalten oder zu beachten. „Befolgen“ ist im Deutschen direkt und natürlich.
- source_word: πείθεσθαι αὐτῇ
  choice: sie gehorchten ihr
  rationale: πείθομαι mit einer Person im Dativ kann „gehorchen“ oder „Folge leisten“ bedeuten. Im Kontext der mütterlichen Ermahnung bezeichnet es ihr bereitwilliges Hören auf die Mutter.
theological_decisions:
- issue: Konkreter Familienbezug von φιλάδελφοι
  choice: „voller Liebe zu ihren Brüdern“
  alternative: „voller geschwisterlicher Liebe“
  rationale: Die Erzählung handelt von sieben Brüdern, und der griechische Ausdruck hat hier einen konkreten männlichen Bezug. Dieser wird nicht verallgemeinert.
- issue: Verhältnis von Gehorsam gegenüber der Mutter und Gesetzestreue
  choice: „dass sie ihr gehorchten, während sie die Vorschriften des Gesetzes bis in den Tod befolgten“
  alternative: „dass sie auf sie hörten und deshalb die Vorschriften des Gesetzes bis zum Tod hielten“
  rationale: Die griechische Konstruktion stellt den Gehorsam gegenüber der Mutter und die bis zum Tod reichende Gesetzestreue zugleich dar, ohne ausdrücklich ein Ursache-Wirkungs-Verhältnis festzulegen. „Während“ bewahrt diese syntaktische und theologische Spannung.
- issue: Religiös-ethischer Gehalt von δίκαιοι
  choice: „gerecht“
  alternative: „rechtschaffen“
  rationale: „Gerecht“ wahrt neben moralischer Lauterkeit auch den religiös-ethischen Klang jüdischer Gesetzestreue; „rechtschaffen“ wäre möglich, würde diesen Zusammenhang aber weniger deutlich anklingen lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Tugendkatalog bleibt rhythmisch und verständlich; seltenere wörtliche Bildungen wie „hochgesinnt“ oder „großseelig“ werden vermieden. Die Formulierung „bis in den Tod“ bewahrt den feierlichen Ernst des Martyriumszusammenhangs.
