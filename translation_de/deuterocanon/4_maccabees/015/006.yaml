  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who through seven pregnancies had her affection for them deeply planted within her;
translation:
  language: de
  text: Doch unter allen Müttern wurde die Mutter der sieben Söhne[a] ihren Kindern am innigsten zugetan – sie, in der durch sieben Schwangerschaften die Zuneigung zu ihnen eingepflanzt worden war;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Mutter der sieben«. Aus dem Zusammenhang geht hervor, dass ihre sieben Söhne gemeint sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτεκνωτέρα
  choice: ihren Kindern am innigsten zugetan
  rationale: Der Komparativ bezeichnet im Zusammenhang mit »unter allen Müttern« den höchsten Grad der Liebe zu den eigenen Kindern. Die Formulierung ist natürliches Deutsch und bewahrt den Bezug auf ihre Kinder.
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: die Mutter der sieben Söhne[a]
  rationale: Wörtlich steht »die Mutter der sieben«. Der Kontext identifiziert die sieben als ihre Söhne; die Ergänzung sorgt im Deutschen für Klarheit und wird in der Fußnote offengelegt.
- source_word: κυοφορίαις
  choice: durch sieben Schwangerschaften
  rationale: κυοφορία bezeichnet Schwangerschaft beziehungsweise das Austragen eines Kindes. Die konkrete siebenfache mütterliche Erfahrung bleibt erhalten.
- source_word: ἐπιφυτευομένην
  choice: eingepflanzt worden war
  rationale: Das Partizip bewahrt das Bild des Einpflanzens beziehungsweise Einpfropfens. Die passive Form gibt wieder, dass die Zuneigung in ihr entstand beziehungsweise ihr eingepflanzt wurde, ohne den Urheber festzulegen.
- source_word: φιλοστοργίαν
  choice: Zuneigung
  rationale: φιλοστοργία bezeichnet natürliche, innige Zuneigung innerhalb einer Familie. Im mütterlichen Kontext ist »Zuneigung« klar, ohne einen im Griechischen nicht ausdrücklich vorhandenen Zusatz einzuführen.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: Die Wendung bezeichnet die Richtung ihrer Zuneigung auf die sieben Kinder hin und bleibt in der pronominalen Form des Griechischen.
