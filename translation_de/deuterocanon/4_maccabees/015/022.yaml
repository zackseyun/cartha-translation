base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/022.yaml
  text: How greatly and how many times, then, was the mother tortured with torments while her sons were being tortured with wheels and cauteries?
translation:
  language: de
  text: Wie schwere und wie viele Qualen erlitt damals die Mutter[a], während ihre Söhne mit Rädern und Brenneisen[b] gefoltert wurden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Mit wie schweren und wie vielen Qualen wurde damals die Mutter gequält?“ Das Griechische wiederholt zur rhetorischen Verstärkung verschiedene Formen desselben Wortstamms.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind erhitzte Instrumente zum Brennen oder Kauterisieren; auch „heiße Eisen“ oder „Brandeisen“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: πηλίκοις καὶ πόσαις … βασάνοις
  choice: wie schwere und wie viele Qualen
  rationale: Die beiden Dativadjektive beziehen sich grammatisch auf βασάνοις. Die Wiedergabe erhält sowohl das Ausmaß als auch die Mehrzahl der Qualen, ohne πόσαις eindeutig als Häufigkeitsangabe festzulegen.
- source_word: τότε
  choice: damals
  rationale: Kennzeichnet den erzählten Zeitpunkt und klingt in der deutschen rhetorischen Frage natürlich.
- source_word: ἡ μήτηρ
  choice: die Mutter
  rationale: Bewahrt den bestimmten Artikel des Griechischen, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: τῶν υἱῶν βασανιζομένων
  choice: während ihre Söhne … gefoltert wurden
  rationale: Der temporale Genitivus absolutus bezeichnet das gleichzeitig andauernde Leiden der Söhne. Das Possessivpronomen ist im Deutschen zur eindeutigen und natürlichen Verknüpfung mit der Mutter sinnvoll.
- source_word: τροχοῖς
  choice: Rädern
  rationale: Direkte Wiedergabe des pluralischen Namens für die Folterinstrumente; eine Deutung als Streckbänke würde den Text unnötig festlegen.
- source_word: καυτηρίοις
  choice: Brenneisen
  rationale: Bezeichnet Instrumente, die durch Hitze brennen oder kauterisieren. „Brenneisen“ ist im modernen Deutschen verständlicher als das fachsprachliche „Kauterien“ und weniger eng als „Brandeisen“.
- source_word: ἐβασανίζετο βασάνοις
  choice: erlitt … Qualen
  rationale: Natürliches, würdevolles Deutsch, das die intensive Wirklichkeit des Leidens ausdrückt. Eine Fußnote weist auf die im Griechischen vorhandene rhetorische Wiederholung desselben Wortstamms hin.
theological_decisions:
- issue: Art des Leidens der Mutter
  choice: Die Mutter erleidet wirkliche und schwere Qualen, während die Söhne mit den genannten Werkzeugen gefoltert werden; der Mechanismus ihrer Qualen bleibt offen.
  alternative: Auch die Mutter selbst wird mit Rädern und Brenneisen körperlich gefoltert.
  rationale: Syntaktisch gehören Räder und Brenneisen zum Foltern der Söhne. Die starke βασαν-Wortwahl beschreibt dennoch das Leiden der Mutter als tiefgreifend und wirklich, ohne es auf rein emotionale Betrübnis zu reduzieren oder ihr dieselben Instrumente zuzuordnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt erhalten. „Wie viele“ folgt der grammatischen Beziehung von πόσαις zu βασάνοις und bewahrt gegenüber der eindeutigen Deutung „wie oft“ die Offenheit des griechischen Ausdrucks.
