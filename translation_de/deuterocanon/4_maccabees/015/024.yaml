base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/024.yaml
  text: Even while seeing the destruction of her seven children and the intricate variety of the tortures[a], the noble mother, after embracing them all[b], let them go because of her faith toward God.
translation:
  language: de
  text: Obwohl sie den Untergang ihrer sieben Kinder und die komplizierte Vielfalt der Folterinstrumente vor Augen hatte, ließ die edle Mutter sie alle, nachdem sie sie umarmt hatte[a], wegen ihres Glaubens an Gott gehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende Verb kann auch »sie alle begrüßen« oder »von ihnen allen Abschied nehmen« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wegen ihres Vertrauens auf Gott« beziehungsweise »wegen ihrer Treue zu Gott«. Für »ließ ... gehen«: »gab sie frei« oder »entließ sie«.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: καίπερ … ὁρῶσα
  choice: Obwohl sie … vor Augen hatte
  rationale: Die konzessive Verbindung und das präsentische Partizip werden in natürlichem Deutsch als fortdauerndes Wahrnehmen unter widrigsten Umständen wiedergegeben.
- source_word: ἑπτὰ τέκνων
  choice: ihrer sieben Kinder
  rationale: τέκνα bezeichnet lexikalisch Kinder; dass es sich im Zusammenhang um ihre Söhne handelt, wird hier nicht in den Wortlaut eingetragen.
- source_word: ἀπώλειαν
  choice: Untergang
  rationale: Das Wort bezeichnet Vernichtung oder Verderben und meint hier den tödlichen Verlust der Kinder, ohne schlicht auf »Tod« verengt zu werden.
- source_word: τὴν τῶν στρεβλῶν πολύπλοκον ποικιλίαν
  choice: die vielgestaltigen Folterungen
  rationale: Die Formulierung bewahrt die Vorstellung zahlreicher verschiedenartiger Qualen in idiomatischem Deutsch; στρεβλά kann dabei auch konkreter auf Folterinstrumente bezogen werden.
- source_word: ἀπάσασα
  choice: nahm … sie alle in die Arme
  rationale: Die im Kontext naheliegende körperlich-herzliche Bedeutung wird im Haupttext wiedergegeben; die ebenfalls mögliche Bedeutung »begrüßen« beziehungsweise »Abschied nehmen« bleibt in der Fußnote erhalten.
- source_word: ἡ γενναία μήτηρ
  choice: die edle Mutter
  rationale: γενναία verbindet moralische Größe mit Mut; »edel« trägt beide Aspekte und entspricht dem würdevollen Ton.
- source_word: ἐξέλυσεν
  choice: ließ sie gehen
  rationale: Das Verb bezeichnet ein Losmachen oder Freigeben. Im Zusammenhang gibt die Mutter ihre Kinder dem Martyrium preis, ohne sie zurückzuhalten.
- source_word: διὰ τὴν πρὸς θεὸν πίστιν
  choice: um ihres Glaubens an Gott willen
  rationale: διά mit Akkusativ wird kausal wiedergegeben. »Glaube an Gott« ist natürliches modernes Deutsch und bewahrt die auf Gott gerichtete Beziehung von πρὸς θεόν.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: πίστις kann hier sowohl den vertrauenden Glauben als auch standhafte Treue bezeichnen. Der Haupttext entscheidet sich für den umfassenderen Ausdruck »Glaube«, während die semantischen Alternativen ausdrücklich erhalten bleiben.
- issue: Handeln der Mutter beim Martyrium ihrer Kinder
  choice: ließ sie gehen
  alternative: gab sie frei; entließ sie
  rationale: Die Formulierung beschreibt, dass sie ihre Kinder nicht zurückhielt, und behauptet weder, sie habe deren Tod verursacht, noch löst sie die Spannung zwischen mütterlicher Bindung und glaubensbedingtem Loslassen auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Gedankenstrich hebt den tragenden Beweggrund hervor, ohne die syntaktische oder theologische Spannung aufzulösen.
