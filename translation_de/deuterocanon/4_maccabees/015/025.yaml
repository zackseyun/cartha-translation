    text: 'Wörtlich: „die Streckbank ihrer Kinder“; „Streckbank“ steht hier metonymisch für die Folter, die ihre Kinder erleiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Denn wie
  rationale: Bewahrt sowohl den begründenden Anschluss durch γάρ als auch den mit καθάπερ eingeleiteten Vergleich; der Satz bleibt entsprechend der griechischen Vorlage offen und führt in den Folgesatz weiter.
- source_word: ἐν βουλευτηρίῳ τῇ ἑαυτῆς ψυχῇ
  choice: in ihrer eigenen Seele gleichsam in einem Ratssaal
  rationale: ψυχή wird mit „Seele“ in seiner anthropologischen Weite wiedergegeben; „gleichsam“ verdeutlicht die metaphorische Verschränkung mit dem Ratssaal, ohne den Vergleich aufzulösen.
- source_word: δεινοὺς ... συμβούλους
  choice: furchtgebietende Ratgeber
  rationale: δεινός bezeichnet hier mächtige, erschreckende innere Gegenkräfte; „furchtgebietend“ wahrt diese Spannweite, während „Ratgeber“ das Beratungsbild fortführt.
- source_word: ὁρῶσα
  choice: vor sich sah
  rationale: Das Partizip wird in die deutsche Satzfügung integriert; „vor sich“ macht die innere Anschauung idiomatisch deutlich, ohne zusätzliche Deutung einzuführen.
- source_word: φύσιν
  choice: die Natur
  rationale: Die knappe Wiedergabe erhält die mögliche Bedeutung natürlicher Anlage oder natürlichen Triebs, statt sie einengend festzulegen.
- source_word: γένεσιν
  choice: die Geburt
  rationale: Im mütterlichen Kontext bezeichnet das Wort wahrscheinlich das Gebären beziehungsweise das daraus erwachsene Band; „Geburt“ bewahrt die Kürze und die genuine Bedeutungsweite.
- source_word: φιλοτεκνίαν
  choice: die Liebe zu ihren Kindern
  rationale: Gibt die Zuneigung zu den eigenen Kindern unmittelbar und geschlechtsneutral auf der Wortebene wieder; der mütterliche Kontext ist bereits eindeutig.
- source_word: τέκνων στρέβλαν
  choice: die Folter ihrer Kinder
  rationale: στρέβλα kann konkret die Streckbank beziehungsweise ein Foltergerät bezeichnen, steht hier aber wahrscheinlich metonymisch für die erlittene Folter. Die verständliche Haupttextfassung wird durch eine Fußnote zur wörtlicheren Möglichkeit ergänzt.
