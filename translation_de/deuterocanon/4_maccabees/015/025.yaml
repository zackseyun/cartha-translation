  text: For just as[a], in her own soul as in a council chamber, she saw fearsome counselors—nature and birth and love for her children and the torture of her children—
translation:
  language: de
  text: Denn wie sie im Ratssaal ihrer eigenen Seele furchtbare Ratgeber vor sich sah – die Natur, die Geburt, die Liebe zu ihren Kindern und die Folter ihrer Kinder[a] –
  philosophy: optimal-equivalence
  footnotes:
