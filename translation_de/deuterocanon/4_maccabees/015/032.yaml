base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/032.yaml
  text: So you also[a], guardian of the law, though surrounded on every side by the flood of passions and pressed by the fierce winds of your sons’ torments[b], bravely endured the storms of godliness.
translation:
  language: de
  text: So hast auch du, Hüterin des Gesetzes, obwohl du von allen Seiten von der Flut der Leidenschaften[a] umringt und von den heftigen Winden der Qualen deiner Söhne bedrängt wurdest, den Stürmen der Gottesfurcht[b] mutig standgehalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Flut der Gefühlsregungen“; möglicherweise auch: „Flut der Leiden“. Das griechische πάθη ist im 4. Makkabäerbuch ein Schlüsselbegriff für die Regungen oder Leidenschaften, die von der Vernunft beherrscht werden sollen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Stürmen der Frömmigkeit“ beziehungsweise „Stürmen um der Gottesfurcht willen“.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: νομοφύλαξ
  choice: Hüterin des Gesetzes
  rationale: Das feminine Substantiv bezeichnet die Mutter als eine, die das Gesetz bewahrt; „Hüterin“ erhält den aktiven, ehrenden Sinn des Kompositums.
- source_word: πανταχόθεν
  choice: von allen Seiten
  rationale: Zusammen mit περικυκλουμένῃ steht die räumliche Vorstellung des vollständigen Umringtseins im Vordergrund.
- source_word: τῶν παθῶν … κατακλυσμῷ
  choice: Flut der Leidenschaften
  rationale: πάθη ist im 4. Makkabäerbuch ein thematisch wichtiger Ausdruck für Regungen beziehungsweise Leidenschaften, die von der vernunftgeleiteten Frömmigkeit beherrscht werden; „Flut“ bewahrt das Bild von κατακλυσμός.
- source_word: καρτεροῖς ἀνέμοις
  choice: heftigen Winden
  rationale: καρτερός bezeichnet hier starke, harte oder gewaltige Winde; „heftig“ ist natürlich und fügt sich in das Sturmgleichnis.
- source_word: ταῖς τῶν υἱῶν βασάνοις
  choice: von den … Qualen deiner Söhne
  rationale: βάσανοι bezeichnet die ihnen zugefügten Folterqualen. Die Formulierung wahrt die knappe Genitivverbindung des Griechischen.
- source_word: συνεχομένη
  choice: bedrängt wurdest
  rationale: Das Partizip beschreibt ein hartes Bedrängt- oder Eingeschlossensein und lässt zugleich das Bild der drängenden Winde bestehen.
- source_word: γενναίως ὑπέμεινας
  choice: mutig standgehalten
  rationale: γενναίως verbindet Mut und edle Haltung; ὑπομένω bezeichnet standhaftes Ausharren unter Bedrängnis. „Standhalten“ passt besonders gut zum Sturmgleichnis.
- source_word: τοὺς τῆς εὐσεβείας χειμῶνας
  choice: den Stürmen der Gottesfurcht
  rationale: χειμών bezeichnet hier bildlich schwere Stürme. εὐσέβεια meint ehrfürchtige, treue Hingabe an Gott; „Gottesfurcht“ gibt diesen religiösen Bezug im Deutschen klar wieder, ohne bloße Sittsamkeit anzudeuten.
theological_decisions:
- issue: Bedeutung von πάθη im philosophisch-martyrologischen Zusammenhang
  choice: Leidenschaften
  alternative: Gefühlsregungen; Leiden
  rationale: Der zentrale Gedankengang des Buches über die Herrschaft der frommen Vernunft über die πάθη spricht für „Leidenschaften“. Da im unmittelbaren Zusammenhang zugleich tatsächliches Leiden vorliegt, wird die mögliche Bedeutungsnähe in einer Fußnote kenntlich gemacht.
- issue: Wiedergabe von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit; Gottesverehrung
  rationale: Der Ausdruck bezeichnet ehrfürchtige und gesetzestreue Hingabe an Gott. „Gottesfurcht“ wahrt den Gottesbezug und lässt offen, ob der Genitiv die Stürme kennzeichnet oder ihren Anlass bezeichnet.
- issue: Genitivverhältnis in τοὺς τῆς εὐσεβείας χειμῶνας
  choice: Stürmen der Gottesfurcht
  alternative: Stürmen um der Gottesfurcht willen
  rationale: Die formnahe Genitivkonstruktion erhält die Mehrdeutigkeit zwischen Stürmen, die zur Gottesfurcht gehören, und Stürmen, die um ihretwillen erduldet werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ausgedehnte Sturmmetapher des griechischen Satzes bleibt erhalten. „Hüterin“ macht das grammatische und kontextuelle Femininum sichtbar; „Leidenschaften“ bewahrt den philosophischen Leitbegriff des Werkes.
