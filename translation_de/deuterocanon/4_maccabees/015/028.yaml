  text: But the daughter remembered the steadfastness of Abraham, who feared God.
translation:
  language: de
  text: Doch die Tochter erinnerte sich an die Standhaftigkeit des gottesfürchtigen Abraham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Abraham, der Gott ehrte«.'
    reason: Lexikalische Alternative für θεοσεβοῦς; die Formulierung kann im Deutschen attributiv oder durch einen Relativsatz wiedergegeben werden.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Die adversative Konjunktion stellt einen Gegensatz zum vorherigen Zusammenhang her; »Doch« gibt diesen Übergang knapp und würdig wieder.
- source_word: θεοσεβοῦς
  choice: gottesfürchtigen
  rationale: Das Adjektiv bezeichnet Ehrfurcht und fromme Haltung gegenüber Gott. »Gottesfürchtig« bewahrt den ausdrücklichen Gottesbezug und lässt sich im Deutschen natürlich attributiv auf Abraham beziehen.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Die im Deutschen übliche Form des Eigennamens.
- source_word: καρτερίας
  choice: Standhaftigkeit
  rationale: Das Substantiv bezeichnet beharrliches Ausharren und innere Festigkeit unter Druck; »Standhaftigkeit« passt zum moralischen Vorbild Abrahams.
- source_word: θυγάτηρ
  choice: die Tochter
  rationale: Der griechische Text hat den bestimmten Ausdruck »die Tochter«, jedoch kein ausdrückliches Possessivpronomen; daher wird kein »seine« ergänzt.
- source_word: ἐμνήσθη
  choice: erinnerte sich an
  rationale: Das Verb bedeutet, sich an etwas zu erinnern oder es sich ins Gedächtnis zu rufen. Die reflexive deutsche Wendung ist hier idiomatisch und präzise.
theological_decisions:
- issue: Wiedergabe von θεοσεβοῦς mit ausdrücklichem Gottesbezug
  choice: des gottesfürchtigen Abraham
  alternative: des Abraham, der Gott ehrte
  rationale: Das griechische Wort enthält ausdrücklich θεο- (»Gott«). »Gottesfürchtig« bewahrt diesen Bezug und gibt zugleich die attributive Stellung des Adjektivs wieder, ohne die Aussage auf eine allgemeine Frömmigkeit zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur folgt dem Griechischen eng, bleibt aber natürlich verständlich. Das nicht ausdrücklich vorhandene Possessivpronomen bei »Tochter« wurde nicht ergänzt.
