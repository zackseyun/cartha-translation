base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/021.yaml
  text: Not in this way do siren songs or swanlike voices with feminine sound draw those who hear[a], as the voices of children calling to their mother amid tortures.
translation:
  language: de
  text: Weder Sirenengesänge noch schwanengleiche, weiblich klingende Stimmen ziehen die Zuhörer so sehr an[a] wie die Stimmen von Kindern, die inmitten von Folterqualen nach ihrer Mutter rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Gesänge der Sirenen« und »Stimmen von Schwänen«. Das Griechische verwendet klassische poetische Bilder für anziehenden Klang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σειρήνιοι μελῳδίαι
  choice: Sirenengesänge
  rationale: Bewahrt die Anspielung auf die betörenden Gesänge der Sirenen und klingt im Deutschen natürlich.
- source_word: κύκνιοι ... φωναί
  choice: schwanengleiche Stimmen
  rationale: Gibt das Adjektiv κύκνιοι als poetischen Vergleich wieder, ohne die Stimmen eindeutig als tatsächliche Stimmen von Schwänen festzulegen.
- source_word: πρὸς θηλυκίαν
  choice: mit weiblichem Klang
  rationale: Gibt die auf Weiblichkeit beziehungsweise weibliche Klangart bezogene Wendung verständlich wieder, ohne zusätzlich »Anmut« oder »Verführung« in den Text einzutragen.
- source_word: ἐφέλκονται
  choice: ziehen ... an
  rationale: Entspricht dem Bild des Heranziehens beziehungsweise Anlockens und ist in modernem Deutsch idiomatisch.
- source_word: τέκνων φωναί
  choice: die Stimmen von Kindern
  rationale: Bewahrt die Genitivbeziehung und den rhetorischen Gegensatz zu den zuvor genannten Stimmen.
- source_word: μετὰ βασάνων
  choice: unter Folter
  rationale: Bezeichnet knapp die bedrängende Situation, in der die Kinder rufen; der griechische Plural kann die einzelnen Folterqualen einschließen.
- source_word: μητέρα φωνούντων
  choice: die ... nach ihrer Mutter rufen
  rationale: φωναῖν bezeichnet hier ein hörbares Rufen; »nach ihrer Mutter rufen« gibt die emotionale und syntaktische Beziehung natürlich wieder.
theological_decisions:
- issue: Klassisch-mythologische und poetische Bildsprache
  choice: Die Anspielungen auf Sirenen und Schwäne bleiben im Haupttext erhalten.
  alternative: Verallgemeinerung zu »betörenden Gesängen« und »schönen Stimmen«.
  rationale: Die konkrete griechische Bildsprache trägt den rhetorischen Gegensatz zu den gefolterten Kindern und enthält keine auszuräumende lehrmäßige Aussage.
- issue: Bezug der Folterqualen
  choice: »unter Folter« wird auf die rufenden Kinder bezogen.
  alternative: 'Allgemeiner: »inmitten von Folterqualen«.'
  rationale: Der Genitiv τέκνων ... φωνούντων legt nahe, dass die Kinder während ihrer Folter nach der Mutter rufen; die knappe Formulierung vermeidet zusätzliche Einzelheiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Ton. Die ausgewogene Weder-noch-/wie-Konstruktion bildet den rhetorischen Vergleich des Griechischen klar nach.
