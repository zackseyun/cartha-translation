  yaml_path: translation/deuterocanon/4_maccabees/015/005.yaml
  text: For the more mothers are weak in spirit and have more children[b][a], the more they are devoted to their children.
translation:
  language: de
  text: Denn je schwächer im Gemüt[a] und je kinderreicher die Mütter sind, desto mehr lieben sie ihre Kinder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mutloser«. Das griechische Wort bezeichnet wörtlich eine Schwäche der Seele oder des Gemüts; gemeint sein kann sowohl seelische Empfindsamkeit als auch mangelnder Mut.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »desto kinderliebender sind sie«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: je ... desto
  rationale: Die deutsche Vergleichskonstruktion gibt die proportionale Beziehung des griechischen Korrelativgefüges natürlich und genau wieder.
- source_word: ἀσθενόψυχοι
  choice: schwächer im Gemüt
  rationale: Die Wiedergabe bewahrt die wörtliche Vorstellung einer Schwäche der Seele beziehungsweise des Gemüts, ohne sie eindeutig auf Mutlosigkeit oder emotionale Gebrechlichkeit festzulegen.
- source_word: πολυγονώτεραι
  choice: kinderreicher
  rationale: Das deutsche Komparativadjektiv entspricht der vergleichenden Form und bezeichnet Mütter mit mehr beziehungsweise zahlreicheren Kindern.
- source_word: ὑπάρχουσιν
  choice: sind
  rationale: Das Verb dient hier als Kopula zu den prädikativen Adjektiven und wird im Deutschen schlicht mit „sind“ wiedergegeben.
- source_word: αἱ μητέρες
  choice: die Mütter
  rationale: Direkte und natürliche Wiedergabe des griechischen Subjekts.
- source_word: φιλοτεκνώτεραι
  choice: mehr lieben sie ihre Kinder
  rationale: Die Form bezeichnet im Komparativ eine stärkere Liebe oder Zuneigung zu den eigenen Kindern; die verbale deutsche Formulierung klingt natürlich und erhält die Steigerung.
