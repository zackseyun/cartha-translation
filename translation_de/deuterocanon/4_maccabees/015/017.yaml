  text: O mother[a], now tested by pains more bitter than the birth pangs for them.
translation:
  language: de
  text: O Mutter, die du jetzt bitterere Schmerzen erlitten hast als die Geburtswehen bei ihrer Geburt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Wehen um sie«. Der griechische Ausdruck bezeichnet wörtlich die mit ihnen verbundenen Geburtswehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πικροτέρων
  choice: bitterer
  rationale: Der Komparativ bewahrt das Bild von der Bitterkeit und die rhetorische Schärfe des griechischen Ausdrucks.
- source_word: μήτηρ
  choice: Mutter
  rationale: Die direkte Anrede wird schlicht und würdevoll wiedergegeben.
- source_word: πόνων
  choice: Schmerzen
  rationale: Der Ausdruck bezeichnet hier leidvolle Erfahrungen; »Schmerzen« hält zugleich die Verbindung zu den nachfolgenden Geburtswehen aufrecht.
- source_word: πειρασθεῖσα
  choice: hast du … erduldet
  rationale: Das Partizip bezeichnet das Durchmachen beziehungsweise Erfahren einer schweren Prüfung. »Erduldet« klingt im Deutschen natürlich und lässt den Bewährungscharakter erkennen, ohne ihn auszudeuten.
- source_word: ἤπερ
  choice: als
  rationale: Die Partikel führt nach dem Komparativ den Vergleich mit den früheren Geburtswehen ein.
- source_word: τῶν ἐπʼ αὐτοῖς ὠδίνων
  choice: die Wehen, die du um sie hattest
  rationale: ὠδῖνες sind Geburtswehen; ἐπʼ αὐτοῖς bezieht sich auf die Söhne und verbindet die Wehen mit ihrer Geburt. Die Formulierung bewahrt diese Beziehung, ohne sie enger als das Griechische festzulegen.
