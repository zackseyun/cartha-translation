  verdict: revise
  source_fidelity: Der Entwurf trifft die Anrede, den Gegenwartsbezug und den Vergleich grundsätzlich. Die Wiedergabe von πειρασθεῖσα durch »hast du … erduldet« ist als erfahrungsbezogene Umschreibung vertretbar, doch der griechische Vergleich bezieht sich ausdrücklich auf »bitterere Schmerzen«; dies sollte im Deutschen syntaktisch eindeutig ausgedrückt werden. τῶν ἐπʼ αὐτοῖς ὠδίνων bezeichnet die Geburtswehen in Verbindung mit den Söhnen bzw. bei ihrer Geburt.
  naturalness: »Schmerzen erduldet, bitterer als die Wehen« ist im Deutschen elliptisch und lässt »bitterer« formal ohne klaren Bezug. »Wehen, die du um sie hattest« ist zudem keine natürliche moderne Formulierung für Geburtswehen.
  terminology: »Mutter«, »Schmerzen« und »Geburtswehen« sind angemessen. »Bitterere« erhält die metaphorische und rhetorische Kraft von πικροτέρων; »bei ihrer Geburt« gibt die naheliegende Beziehung von ἐπʼ αὐτοῖς wieder, ohne weitergehende Deutung.
