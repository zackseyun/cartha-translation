    rationale: »um sie« kann im modernen Deutsch Sorge um die Söhne statt Geburtswehen bei ihrer Geburt ausdrücken. »Geburtswehen bei ihrer Geburt« macht den gemeinten Zusammenhang natürlich und präzise.
