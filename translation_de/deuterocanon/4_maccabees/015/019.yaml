base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/019.yaml
  text: Nor[a], as a third son was breathing his last, did you weep when you saw the eyes of each one, bull-like, looking upon the tortures and the same torment[c][b], and their nostrils foretelling death.
translation:
  language: de
  text: Auch als ein dritter Sohn sein Leben aushauchte,[a] hast du nicht geweint, als du die Augen eines jeden sahst, die stiergleich[b] auf die Folterqualen und dieselbe Misshandlung blickten, und ihre Nüstern, die den Tod ankündigten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Auch als ein Dritter sein Leben aushauchte“. Das Griechische lässt „Sohn“ aus; der Bezug ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Bild beschreibt den Blick als stierartig; gemeint sein kann ein fester, trotziger oder furchtloser Blick.
    reason: cultural_note
  - marker: c
    text: Das anschauliche Bild kann auf die sichtbare Atmung der dem Tod nahen Söhne hinweisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ τρίτος ἀποψύχων
  choice: Auch als ein dritter Sohn sein Leben aushauchte
  rationale: Die elliptische griechische Wendung setzt die vorausgehende Reihe fort. „Sohn“ wird aus dem Zusammenhang ergänzt; „sein Leben aushauchte“ bewahrt das anschauliche Moment von ἀποψύχω.
- source_word: θεωροῦσα
  choice: obwohl du … sahst
  rationale: Das Partizip bezeichnet das aufmerksame Wahrnehmen der Mutter und wird im Deutschen natürlich an die Aussage „hast du nicht geweint“ angeschlossen.
- source_word: ταυρηδόν
  choice: stiergleich
  rationale: Das Adverb bezeichnet eine stierartige Weise und steht syntaktisch bei dem Blick der Söhne. „Stiergleich“ erhält das ungewöhnliche, kraftvolle Bild, ohne dessen genaue Bedeutung festzulegen.
- source_word: ἐπὶ τῶν βασάνων ὁρῶντας
  choice: auf die Foltern … blickten
  rationale: βάσανοι kann Folterqualen oder Folterungen bezeichnen. „Auf die Foltern blicken“ wahrt die Blickrichtung und lässt offen, ob vor allem die Vorgänge oder die Qualen gemeint sind.
- source_word: τὸν αὐτὸν αἰκισμόν
  choice: dieselbe Misshandlung
  rationale: αἰκισμός bezeichnet grausame Misshandlung und kann auch Folter einschließen. „Misshandlung“ vermeidet eine unnötige Verdoppelung von „Foltern“ und bleibt lexikalisch breit.
- source_word: τοὺς μυκτῆρας προσημειουμένους αὐτῶν τὸν θάνατον
  choice: ihre Nüstern den Tod ankündigten
  rationale: Die auffällige Körpermetapher des Griechischen wird bewahrt. προσημειόω bezeichnet ein vorausweisendes Anzeigen; wahrscheinlich ist die sichtbare Atmung Sterbender gemeint, doch wird dies nicht in den Haupttext eingetragen.
- source_word: οὐκ ἔκλαυσας
  choice: hast du nicht geweint
  rationale: κλαίω bedeutet hier schlicht „weinen“; die direkte rhetorische Anrede bleibt erhalten.
theological_decisions:
- issue: Ergänzung des ausgelassenen Bezugswortes am Versanfang
  choice: „Sohn“ wird aus dem Zusammenhang ergänzt
  alternative: „Auch als ein Dritter sein Leben aushauchte“
  rationale: Der griechische Text lässt das Substantiv aus, doch der Zusammenhang handelt eindeutig von den Söhnen der Mutter. Eine Fußnote macht die Ellipse transparent.
- issue: Bezug und Aussagekraft des Stierbildes
  choice: „stiergleich“ bezieht sich auf den Blick der Söhne
  alternative: Das Bild könnte allgemeiner ihre Haltung unter der Folter beschreiben
  rationale: Die Wortstellung verbindet ταυρηδόν am ehesten mit Augen und Blick. Die Übersetzung deutet das Bild nicht ausdrücklich als Mut, Trotz oder Standhaftigkeit und wahrt so seine Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Anrede und die ungewöhnlichen Körperbilder des Griechischen bleiben erhalten; erklärende Deutungen werden in die Fußnoten verwiesen.
