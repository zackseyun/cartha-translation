  yaml_path: translation/deuterocanon/4_maccabees/015/011.yaml
  text: Nevertheless[a], although so many impulses of motherly affection were drawing the mother toward sympathy, the all-varied tortures were not able, by any of them, to turn aside her reason.
translation:
  language: de
  text: Dennoch vermochten die vielfältigen Foltern ihre Vernunft bei keinem ihrer Söhne umzulenken, obwohl so vieles, was mit ihrer Liebe zu ihren Kindern zusammenhing, die Mutter zum Mitgefühl hinzog.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Dennoch
  rationale: Gibt den nachdrücklichen konzessiven Übergang knapp und idiomatisch wieder.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: obwohl so vieles, was mit der Liebe zu ihren Kindern zusammenhing
  rationale: φιλοτεκνία bezeichnet hier die starke elterliche, im Kontext mütterliche Liebe zu den eigenen Kindern. Die Formulierung bewahrt die abstrakte Weite des Griechischen, ohne zusätzliche einzelne Gefühlsregungen festzulegen.
- source_word: εἰς συμπάθειαν ἑλκόντων τὴν μητέρα
  choice: die Mutter zum Mitleiden hinzog
  rationale: ἑλκόντων wahrt das Bild des Ziehens; συμπάθεια meint im Folterkontext nicht bloß Sympathie, sondern mitfühlende Anteilnahme beziehungsweise Mitleiden.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: bei keinem von ihnen
  rationale: ἐπί mit Genitiv kann »im Fall von« bedeuten; im Kontext liegt der Bezug auf keinen ihrer Söhne nahe. Weil der Rückbezug sprachlich nicht völlig eindeutig ist, wird die andere Möglichkeit in einer Fußnote genannt.
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: die Foltern in all ihrer Vielfalt
  rationale: Gibt die große Verschiedenartigkeit von παντοίκιλοι idiomatisch wieder und wahrt bei βάσανοι den konkreten Märtyrerkontext.
- source_word: τὸν λογισμὸν αὐτῆς
  choice: ihre Vernunft
  rationale: λογισμός bezeichnet die vernünftige Urteilsfähigkeit und ist ein Leitbegriff des 4. Makkabäerbuches. »Vernunft« wahrt diesen philosophischen Schwerpunkt, ohne den Begriff bloß als Willenskraft wiederzugeben.
- source_word: ἴσχυσαν μετατρέψαι
  choice: vermochten … umzulenken
  rationale: Drückt sowohl das mangelnde Vermögen beziehungsweise Durchsetzungsvermögen von ἴσχυσαν als auch die Richtungsänderung von μετατρέψαι aus.
theological_decisions:
- issue: Wiedergabe des philosophisch geprägten Begriffs λογισμός
  choice: ihre Vernunft
  alternative: ihre vernünftige Urteilskraft; ihren Entschluss
  rationale: Das Buch stellt die Herrschaft vernünftigen Urteilens über die Leidenschaften heraus. »Vernunft« bewahrt diese Spannung; »Entschluss« würde die rationale Dimension zugunsten reiner Willensfestigkeit abschwächen.
- issue: Bezug von ἐπʼ οὐδενὸς αὐτῶν
  choice: bei keinem von ihnen, bezogen auf die Söhne
  alternative: durch keinen dieser Beweggründe
  rationale: Die Konstruktion ἐπί mit Genitiv und der erzählerische Zusammenhang stützen den Bezug auf jeden einzelnen Sohn. Da ein Rückbezug auf die zuvor genannten, mit der Kinderliebe verbundenen Einflüsse grammatisch erwogen werden kann, bleibt diese Lesart in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Mitleiden« erhält die starke, situationsbezogene Bedeutung von συμπάθεια; der Doppelpunkt nach »Dennoch« macht die lange konzessive Satzführung verständlich. Die philosophische Terminologie bleibt erkennbar, ohne unnötig fachsprachlich zu wirken.
