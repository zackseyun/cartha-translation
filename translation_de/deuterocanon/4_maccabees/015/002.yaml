  text: a mother[a], with two things set before her—piety[b], and the temporary safety of her seven sons according to the tyrant’s promise—
translation:
  language: de
  text: 'eine Mutter, vor der zwei Dinge lagen: die Frömmigkeit[a] und die zeitweilige Rettung[b] ihrer sieben Söhne gemäß dem Versprechen des Tyrannen –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gottesfurcht“ beziehungsweise „Gottesverehrung“; gemeint ist hier die ehrfürchtige Treue gegenüber Gott.
    reason: lexical_alternative
  - marker: b
    text: Oder „vorübergehende Bewahrung“. Das griechische Wort kann auch „Heil“ bedeuten; hier geht es jedoch um das nur zeitweilige Verschonen des Lebens, das der Tyrann verspricht.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: eine Mutter
  rationale: Das artikellose Substantiv steht im fortlaufenden Satz appositionell beziehungsweise prädikativ; „eine Mutter“ gibt dies im Deutschen natürlich wieder.
- source_word: δυεῖν προκειμένων
  choice: vor der zwei Dinge lagen
  rationale: Die genitivische Umstandskonstruktion beschreibt zwei vor der Mutter liegende Möglichkeiten. Die Formulierung bewahrt das Bild des griechischen προκεῖμαι, ohne bereits ausdrücklich eine Wahlhandlung einzutragen.
- source_word: εὐσεβείας
  choice: die Frömmigkeit
  rationale: „Frömmigkeit“ entspricht dem religiösen Sinn von εὐσέβεια knapp und formal; die Fußnote macht deutlich, dass hier insbesondere die ehrfürchtige Treue gegenüber Gott gemeint sein kann.
- source_word: σωτηρίας προσκαίρου
  choice: die zeitweilige Rettung
  rationale: σωτηρία kann Rettung, Bewahrung oder Sicherheit bezeichnen; πρόσκαιρος begrenzt sie ausdrücklich auf kurze Zeit. „Zeitweilige Rettung“ erhält die lexikalische Spannung, während die Fußnote den konkreten Sinn der vorläufigen Lebensbewahrung erläutert.
- source_word: τῆς ἑπτὰ υἱῶν
  choice: ihrer sieben Söhne
  rationale: Das possessive „ihrer“ ergibt sich aus μήτηρ und macht die Beziehung im Deutschen eindeutig, ohne den Sinn zu erweitern.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: gemäß dem Versprechen des Tyrannen
  rationale: κατά mit Akkusativ bezeichnet hier die Entsprechung zu den Bedingungen der Zusage; ὑπόσχεσις wird unmittelbar als „Versprechen“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von εὐσέβεια im Martyriumskontext
  choice: Frömmigkeit
  alternative: Gottesfurcht; Gottesverehrung; Treue zu Gott
  rationale: Die knappe Wiedergabe wahrt den Begriff, ohne ihn vollständig auf eine einzelne Haltung festzulegen. Der Kontext stellt die religiöse Treue der zeitweiligen Lebensrettung gegenüber; diese Ausrichtung wird in der Fußnote erläutert.
- issue: Bedeutung von σωτηρία bei einem zeitlich begrenzten Angebot des Tyrannen
  choice: zeitweilige Rettung
  alternative: vorübergehende Bewahrung; zeitweilige Sicherheit
  rationale: Der Ausdruck bezeichnet hier keine endgültige oder jenseitige Rettung, sondern das vom Tyrannen zugesagte vorläufige Verschonen. „Rettung“ bewahrt dennoch die mögliche Bedeutungsbreite von σωτηρία.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich am Ende bleibt stehen, weil der griechische Text ein syntaktisches Fragment bildet, das im folgenden Vers weitergeführt wird. „Vor der zwei Dinge lagen“ bewahrt die Bildlichkeit und vermeidet die stärker deutende Formulierung „zwei Möglichkeiten zur Wahl hatte“.
