  source_fidelity: 'Die Übersetzung von λογισμέ als „Vernunft“, τύραννε als „Tyrannin“ und εὐσέβεια als „Gottesfurcht“ ist grundsätzlich treffend. Die erste Genitivgruppe τέκνων παθῶν ist tatsächlich verdichtet und sollte nicht ohne Kennzeichnung auf eine einzige Beziehung festgelegt werden. Der zweite Teil ist jedoch im Griechischen am besten als elliptischer Aussagesatz zu verstehen: εὐσέβεια ist Subjekt, ποθεινοτέρα Prädikatskomparativ und μητρί Bezugsdativ. Die Anrede „o Gottesfurcht“ ist möglich, aber weniger naheliegend und macht den deutschen Haupttext unnötig fragmentarisch.'
