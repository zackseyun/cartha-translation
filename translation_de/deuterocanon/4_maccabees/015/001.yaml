base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/001.yaml
  text: O reasoning[a], tyrant over the passions of children! And godliness is to a mother more longed-for than children.
translation:
  language: de
  text: O Vernunft, Tyrannin über die Leidenschaften der Kinder![a] Und Gottesfurcht ist einer Mutter begehrenswerter als ihre Kinder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung ist stark verdichtet. „Leidenschaften der Kinder“ kann auch im Sinn von auf Kinder bezogenen Leidenschaften verstanden werden, hier insbesondere als Gefühle einer Mutter für ihre Kinder.
    reason: alternative_reading
lexical_decisions:
- source_word: λογισμέ
  choice: Vernunft
  rationale: Der Vokativ bezeichnet das vernünftige Urteilsvermögen, das in 4 Makkabäer die Leidenschaften beherrscht. „Vernunft“ ist im Deutschen natürlicher und philosophisch präziser als „Denken“ oder „Überlegung“.
- source_word: τέκνων παθῶν
  choice: die mit Kindern verbundenen Leidenschaften
  rationale: Die Genitivverbindung ist stark verdichtet und kann Leidenschaften der Kinder oder auf Kinder bezogene Gefühle bezeichnen. Die gewählte Formulierung lässt diese Beziehung bewusst offen, statt sie eindeutig als Besitz- oder Objektgenitiv festzulegen.
- source_word: τύραννε
  choice: du Tyrannin über
  rationale: Das Bild des τύραννος wird als auffällige, paradoxe Metapher bewahrt. Wegen des grammatischen Geschlechts von „Vernunft“ steht im Deutschen die feminine Form „Tyrannin“.
- source_word: εὐσέβεια
  choice: Gottesfurcht
  rationale: Im jüdischen Kontext des Werkes meint εὐσέβεια die ehrfürchtige Treue zu Gott und seinem Gesetz. „Gottesfurcht“ macht den Gottesbezug deutlich, ohne eine spätere konfessionelle Bedeutung einzutragen.
- source_word: ποθεινοτέρα
  choice: begehrenswerter
  rationale: Der Komparativ bezeichnet etwas stärker Ersehntes oder Erwünschtes. „Begehrenswerter“ wahrt die Vergleichsform und klingt in der feierlichen Aussage natürlicher als „mehr ersehnt“.
theological_decisions:
- issue: Bedeutung von εὐσέβεια im jüdischen Märtyrerkontext
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: Gemeint ist die Gott und seinem Gesetz geltende Loyalität, die sogar die mütterliche Bindung an die Kinder überragt. „Gottesfurcht“ hält diese Ausrichtung sichtbar, ohne sie dogmatisch weiter auszudeuten.
- issue: Syntaktische Zuordnung von τέκνων im ersten Ausruf
  choice: Die Beziehung zu παθῶν wird allgemein als „mit Kindern verbunden“ wiedergegeben
  alternative: „Leidenschaften der Kinder“ oder „Gefühle für die Kinder“
  rationale: Der knappe Genitiv kann subjektiv oder objektiv verstanden werden. Da der griechische Wortlaut die Beziehung nicht eindeutig festlegt, wird sie im Haupttext nicht stillschweigend aufgelöst.
- issue: Exklamatorischer Status von εὐσέβεια
  choice: 'Als zweiter angerufener Begriff: „Und o Gottesfurcht“'
  alternative: 'Aussagesatz: „Und Gottesfurcht ist einer Mutter …“'
  rationale: Die nominativisch-vokativisch gleiche Form εὐσέβεια kann den eröffnenden Ausruf fortsetzen. Diese Wiedergabe bewahrt die rhetorische Parallelität, während die alternative Analyse in der Fußnote kenntlich gemacht wird.
translation_notes:
  register: Feierlich-rhetorischer, aber gegenwärtig verständlicher Stil. Die wiederholte Anrede mit „o“ und das harte Bild „Tyrannin“ bewahren die abrupte Emphase des griechischen Textes. Die schwierige Genitivverbindung wird im Haupttext bewusst nicht auf eine einzige Deutung verengt.
