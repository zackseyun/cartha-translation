base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/023.yaml
  text: But devout reason[a], strengthening her inward affections even in those very sufferings[b], strained to disregard her temporary love for her children.
translation:
  language: de
  text: Doch die fromme Vernunft[a] stärkte ihr Innerstes gerade in diesen Leiden und rang darum, ihre zeitlich begrenzte Liebe zu ihren Kindern[b] außer Acht zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »gottesfürchtige Vernunft«. Der griechische Ausdruck ist ein Schlüsselbegriff in 4 Makkabäer und bezeichnet eine Vernunft, die von Ehrfurcht vor Gott bestimmt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »ihre zeitweilige Kinderliebe«. Gemeint ist die natürliche Bindung an ihre Kinder in der gegenwärtigen, vergänglichen Lage; sie wird hier der Treue im Leiden gegenübergestellt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: ihr Innerstes
  rationale: Das Wort bezeichnet wörtlich die inneren Organe, idiomatisch jedoch den Sitz tiefer Gefühle. »Ihr Innerstes« bewahrt die körperlich-emotionale Bildhaftigkeit und klingt im heutigen Deutsch natürlich.
- source_word: εὐσεβὴς λογισμός
  choice: die fromme Vernunft
  rationale: Der für 4 Makkabäer programmatische Ausdruck verbindet vernünftiges Urteilen mit Ehrfurcht vor Gott. »Fromme Vernunft« erhält beide Aspekte knapp und ohne spätere Lehrbegriffe einzutragen.
- source_word: ἐν αὐτοῖς τοῖς πάθεσιν
  choice: gerade in diesen Leiden
  rationale: πάθη meint hier Leiden beziehungsweise Qualen, nicht innere Leidenschaften. »Gerade« gibt die Betonung durch αὐτοῖς τοῖς wieder.
- source_word: ἀνδρειώσας
  choice: stärkte
  rationale: Das Partizip bedeutet, mutig oder stark zu machen. »Stärkte« vermeidet eine unpassend geschlechtsspezifische Wiedergabe und bezeichnet die Festigung ihres Innersten im Leiden.
- source_word: ἐτέτεινεν
  choice: trieb es dazu an
  rationale: Das Verb vermittelt ein kraftvolles Anspannen oder Ausrichten. Die Wendung macht im Deutschen die von der Vernunft ausgehende innere Anstrengung verständlich.
- source_word: τὴν πρόσκαιρον φιλοτεκνίαν
  choice: ihre zeitlich begrenzte Liebe zu ihren Kindern
  rationale: φιλοτεκνία ist die Zuneigung zu den eigenen Kindern; πρόσκαιρον kennzeichnet sie als zeitlich beziehungsweise der gegenwärtigen Lage angehörig. Die Formulierung bewahrt den Kontrast, ohne Mutterliebe an sich abzuwerten.
- source_word: παροδεῖν
  choice: hinwegzugehen
  rationale: Der Infinitiv bedeutet vorbeizugehen, zu übergehen oder außer Acht zu lassen. »Darüber hinwegzugehen« bringt die bewusste Überwindung der natürlichen Bindung zum Ausdruck, ohne Gleichgültigkeit zu unterstellen.
theological_decisions:
- issue: Wiedergabe des programmatischen Ausdrucks εὐσεβὴς λογισμός
  choice: fromme Vernunft
  alternative: gottesfürchtige Vernunft
  rationale: »Fromme Vernunft« wahrt sowohl die rationale als auch die religiöse Dimension des griechischen Ausdrucks. Die Alternative erklärt den Gottesbezug deutlicher, legt εὐσεβής aber stärker aus.
- issue: Deutung von πρόσκαιρον φιλοτεκνίαν
  choice: ihre zeitlich begrenzte Liebe zu ihren Kindern
  alternative: ihre vergängliche Mutterliebe
  rationale: Die Übersetzung erhält die Spannung zwischen natürlicher Elternliebe und standhafter Gottesverehrung im Martyrium, ohne zu behaupten, die Liebe zu den Kindern sei an sich moralisch verwerflich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz stellt die fromme Vernunft klar als handelndes Subjekt dar. »Ihr Innerstes« wahrt die emotionale Körpermetapher, während »trieb es dazu an« die angespannte Willensanstrengung in verständlicher Form wiedergibt.
