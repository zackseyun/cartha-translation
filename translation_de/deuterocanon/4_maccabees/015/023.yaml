  rationale: Die sichere Revision beseitigt die unklare Verschiebung der Handlung auf »ihr Innerstes«. Sie bewahrt die griechische Subjektstruktur, die emphatische Lokalisierung »gerade in diesen Leiden«, die metaphorische Tiefe von σπλάγχνα und den Kontrast zwischen zeitlicher Kinderliebe und der im Kontext standhaften Frömmigkeit. Die bestehenden Fußnotenanker und Fußnoten bleiben vollständig erhalten.
