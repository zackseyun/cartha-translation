translation:
  language: de
  text: Sie liebte die Frömmigkeit mehr, die in Übereinstimmung mit Gott zum ewigen Leben rettet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Gott gemäß zum ewigen Leben rettet«; die knappe Wendung kann eine Übereinstimmung mit Gottes Willen oder Maßstab ausdrücken.'
    reason: Bewahrt die Bedeutungsbreite und ungewöhnliche Kürze von κατὰ θεόν.
lexical_decisions:
- source_word: εὐσέβειαν
  choice: Frömmigkeit
  rationale: Das Wort bezeichnet hier ehrfürchtige Hingabe an Gott, die sich in treuem Handeln zeigt. »Frömmigkeit« bewahrt diesen leitenden Tugendbegriff des Werkes.
- source_word: μᾶλλον
  choice: mehr
  rationale: Das vergleichende Adverb bezeichnet eine Bevorzugung gegenüber der im Zusammenhang vorausgesetzten natürlichen Bindung, ohne den unausgesprochenen Vergleich ausdrücklich zu ergänzen.
- source_word: ἠγάπησεν
  choice: liebte
  rationale: Die einfache Bedeutung des Verbs bleibt erhalten; die vergleichende Vorliebe wird bereits durch μᾶλλον ausgedrückt.
- source_word: τὴν σώζουσαν
  choice: die … rettet
  rationale: Das substantivbezogene Präsenspartizip wird als Relativsatz wiedergegeben und unmittelbar auf »Frömmigkeit« bezogen.
- source_word: εἰς αἰώνιον ζωὴν
  choice: zum ewigen Leben
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis; »zum ewigen Leben« gibt diese Ausrichtung knapp und idiomatisch wieder.
- source_word: κατὰ θεόν
  choice: nach Gottes Maßstab
  rationale: Die komprimierte Wendung bezeichnet eine Übereinstimmung mit Gott, seinem Willen oder seinem Maßstab. Die gewählte Formulierung ist im Deutschen verständlich, ohne sie zu einer bestimmten Lehrformel auszubauen.
theological_decisions:
- issue: Bedeutung und syntaktischer Bezug von κατὰ θεόν
  choice: »nach Gottes Maßstab« bleibt innerhalb der Aussage über die zum ewigen Leben rettende Frömmigkeit und bezeichnet allgemein die Übereinstimmung mit Gott.
  alternative: »nach Gottes Willen«, »Gott gemäß« oder »wie es Gott entspricht«
  rationale: Die griechische Wendung ist knapp und lässt offen, ob besonders Gottes Willen, seinem Maßstab oder seiner Zustimmung entsprochen wird. Die Übersetzung wahrt diese theologische Spannung weitgehend; die Fußnote nennt die mögliche Bedeutungsbreite.
- issue: Rettende Wirkung der Frömmigkeit
  choice: Die Aussage »die … rettet« wird ohne dogmatische Abschwächung oder systematische Erklärung wiedergegeben.
  alternative: Eine Paraphrase, die Frömmigkeit lediglich als Zeichen, Mittel oder Folge der Rettung deutet
  rationale: Der griechische Text schreibt der Frömmigkeit ausdrücklich rettende Wirkung zu. Die Übersetzung darf diese Aussage weder konfessionell umdeuten noch abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der unausgesprochene Vergleich nach »mehr« bleibt wie im Griechischen offen. Der Relativsatz erhält die direkte Aussage des Partizips; die Fußnote dokumentiert die schwer wörtlich wiederzugebende Schlusswendung.
