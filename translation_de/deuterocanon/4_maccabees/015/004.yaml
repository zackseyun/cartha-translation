  to: O[a], wie könnte ich die innige Kinderliebe der Eltern schildern, die die Ähnlichkeit der Seele und der Gestalt in das kleine, wunderbare Gepräge eines Kindes einprägt[b] – zumal Mütter den Geborenen gegenüber mitfühlender geworden sind als Väter?
  rationale: Die Revision ordnet die einprägende Handlung den personifizierten elterlichen Affekten zu und stellt die durch εἰς angezeigte Zielrichtung der Prägung wieder her. Der abschließende Vergleich zwischen Müttern und Vätern bleibt quellentreu; „geworden sind“ berücksichtigt die perfekte Form καθεστάναι, ohne mehr als die griechische Aussage zu behaupten. Die vorhandenen Fußnotenanker bleiben erhalten und stehen an der sachlich passenden Stelle.
