base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/004.yaml
  text: Oh[a], how can I describe the child-loving affections of parents, who imprint the likeness of soul and form in the small, marvelous character of a child[c][b], especially since mothers make fathers more sympathetic toward their children who have been born.
translation:
  language: de
  text: O[a], wie könnte ich die innige Kinderliebe der Eltern schildern, die die Ähnlichkeit der Seele und der Gestalt in das kleine, wunderbare Gepräge eines Kindes einprägt[b] – zumal Mütter den Geborenen gegenüber mitfühlender geworden sind als Väter?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie sollte ich … darstellen?« Das griechische Verb ist rhetorisch gehoben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »die Ähnlichkeit der Seele und der Gestalt in einen kleinen, wunderbaren Kindesabdruck einprägt«. Das Griechische verbindet die Bilder des Siegels und der Prägung.'
    reason: metaphor_clarification
lexical_decisions:
- source_word: ἠθολογήσαιμι
  choice: schildern
  rationale: Das rhetorisch gehobene Verb bezeichnet ein anschauliches Darstellen oder Charakterisieren. »Schildern« ist im Deutschen natürlich und bewahrt den erhöhten Ton.
- source_word: φιλότεκνα πάθη
  choice: innige Kinderliebe
  rationale: Gemeint sind die starken, den eigenen Kindern zugewandten Empfindungen der Eltern. Die Wendung gibt die emotionale Kraft idiomatisch wieder, ohne πάθη negativ als ungeordnete Leidenschaften zu deuten.
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: die Ähnlichkeit der Seele und der Gestalt
  rationale: Die Übersetzung erhält ausdrücklich sowohl die innere als auch die äußere Ähnlichkeit und glättet die anthropologische Ausdrucksweise nicht.
- source_word: παιδοχαρακτῆρα
  choice: einem kleinen Kind als einem wunderbaren Abbild
  rationale: χαρακτήρ bezeichnet eine eingeprägte Prägung bzw. ein Abbild. Die deutsche Formulierung verbindet das konkrete Kind mit der Prägemetapher, ohne das ungewöhnliche Kompositum mechanisch nachzubilden.
- source_word: ἐναποσφραγίζοντα
  choice: einprägt
  rationale: Das Verb trägt die Vorstellung des Einprägens durch ein Siegel und wird im Zusammenhang mit χαρακτήρ bewusst metaphorisch wiedergegeben.
- source_word: συμπαθεστέρας
  choice: mitfühlender
  rationale: Der Komparativ bezeichnet stärkere emotionale Anteilnahme oder Verbundenheit; »mitfühlender« ist knapp und im Kontext elterlicher Zuneigung verständlich.
- source_word: τῶν πατέρων
  choice: als Väter
  rationale: Der Genitiv steht beim Komparativ συμπαθεστέρας als Vergleichsgenitiv. Daher werden Mütter mit Vätern verglichen; der Satz sagt nicht, dass Mütter die Väter mitfühlender machen.
- source_word: τοῖς γεννηθεῖσιν
  choice: ihren geborenen Kindern gegenüber
  rationale: Das substantivierte Partizip bedeutet wörtlich »den Geborenen« und bezieht sich im Kontext auf die Kinder bzw. Nachkommen.
theological_decisions:
- issue: Anthropologische Nuance von »Ähnlichkeit der Seele und der Gestalt«
  choice: Innere und äußere Ähnlichkeit ausdrücklich beibehalten
  alternative: 'Dynamisch: »deren Wesen und Aussehen ihnen gleichen«'
  rationale: Der Vers formuliert keine ausgearbeitete Seelenlehre, nennt aber ausdrücklich ψυχή und μορφή. Die formnahe Wiedergabe erhält die Spannung zwischen innerem Wesen und äußerer Erscheinung.
- issue: Vergleich zwischen Müttern und Vätern
  choice: Mütter sind ihren Kindern gegenüber mitfühlender als Väter
  alternative: Mütter machen Väter gegenüber ihren Kindern mitfühlender
  rationale: Die griechische Konstruktion hat τὰς μητέρας als Subjekt des Infinitivs und τῶν πατέρων als Vergleichsgenitiv zu συμπαθεστέρας. So wird eine vergleichende Aussage gemacht, keine kausative Aussage über den Einfluss der Mütter auf die Väter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rhetorischem Auftakt. Der lange griechische Satz bleibt als eine zusammenhängende Frage erhalten; der Gedankenstrich macht den abschließenden Vergleich lesbar. Die fehlerhafte kausative Deutung der englischen Konsultationsfassung wurde aufgrund der griechischen Syntax nicht übernommen.
