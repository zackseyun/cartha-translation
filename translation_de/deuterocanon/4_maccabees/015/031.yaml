  yaml_path: translation/deuterocanon/4_maccabees/015/031.yaml
  text: For just as Noah’s ark[a], being borne along in the world-filling flood, steadfastly endured the waves,
translation:
  language: de
  text: Denn so wie die Arche Noahs in der weltfüllenden Flut[a] dahingetragen wurde und standhaft die Wogen ertrug,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Flut, die die ganze Welt erfüllte“.'
    reason: Lexikalische Alternative für die ungewöhnliche Zusammensetzung κοσμοπληθεῖ.
lexical_decisions:
- source_word: καθάπερ γάρ
  choice: Denn so wie
  rationale: Leitet die begründende Vergleichsaussage ein und bewahrt sowohl γάρ als auch die Kraft des Gleichnisses.
- source_word: ἡ Νῶε κιβωτός
  choice: die Arche Noahs
  rationale: Die etablierte deutsche Bezeichnung für Noahs Schiff gibt den biblischen Bezug eindeutig wieder.
- source_word: κοσμοπληθεῖ κατακλυσμῷ
  choice: weltfüllenden Flut
  rationale: Bewahrt die auffällige Zusammensetzung κοσμοπληθής und die umfassende Größenordnung der Flut, ohne sie durch zusätzliche Deutung zu steigern.
- source_word: κοσμοφορουμένη
  choice: dahingetragen wurde
  rationale: Gibt die passive Bewegung der Arche auf den Flutwassern in natürlichem Deutsch wieder; die ungewöhnliche Wiederholung des Elements κόσμος wird nicht spekulativ ausgedeutet.
- source_word: καρτερῶς
  choice: standhaft
  rationale: Vermittelt beharrliche Widerstandskraft und greift das zentrale Motiv des standhaften Ausharrens in 4 Makkabäer auf.
- source_word: ὑπήνεγκεν
  choice: trotzte
  rationale: Bringt das standhafte Ertragen beziehungsweise Widerstehen gegenüber den Wogen idiomatisch und kraftvoll zum Ausdruck.
- source_word: τοὺς κλύδωνας
  choice: den Wogen
  rationale: Bezeichnet aufgewühlte, mächtige Wellen; „Wogen“ wahrt die Bildkraft und den gehobenen Ton.
theological_decisions:
- issue: Die Sintflutdarstellung als typologischer Vergleich
  choice: Das Gleichnis wird unmittelbar wiedergegeben, ohne seine theologische Bedeutung über den Wortlaut hinaus zu entfalten.
  alternative: Das Bild ausdrücklich als Symbol für Martyrium oder Rettung auslegen.
  rationale: Der Vers zieht einen Vergleich mit der standhaften Arche Noahs. Eine weitergehende typologische oder konfessionelle Ausdeutung ist in diesem Satzteil nicht ausdrücklich formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weltfüllend“ bewahrt bewusst die markante griechische Komposition; die Fußnote bietet eine geläufigere Auflösung. Das abschließende Komma zeigt, dass der Vergleichssatz im folgenden Vers beziehungsweise Satzteil weitergeführt wird.
