  yaml_path: translation/deuterocanon/4_maccabees/015/014.yaml
  text: As she watched each one being tortured and burned[a], the mother did not change because of her piety.
translation:
  language: de
  text: Als die Mutter mitansah, wie jeder Einzelne gefoltert und verbrannt wurde[a], änderte sie aus Frömmigkeit ihre Haltung nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Folterbank gestreckt und verbrannt wurde“. Das griechische Wort für „gefoltert“ kann insbesondere das Strecken oder Verdrehen auf einem Folterinstrument bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἓν
  choice: einer nach dem anderen
  rationale: Die Wendung bezeichnet die einzelnen Söhne in ihrer Abfolge. Die deutsche Formulierung gibt sowohl den distributiven als auch den sukzessiven Sinn natürlich wieder.
- source_word: στρεβλούμενον
  choice: gefoltert
  rationale: Das Verb bezeichnet Folter und kann insbesondere das Strecken oder Verdrehen auf einem Folterinstrument meinen. „Gefoltert“ ist im heutigen Deutsch klar und lässt die genauere Art der Folter offen.
- source_word: φλεγόμενον
  choice: verbrannt wurde
  rationale: Das Partizip bezeichnet das Brennen beziehungsweise Verbranntwerden. Die passive Form passt im Deutschen zur geschilderten Hinrichtung und zur parallelen Formulierung „gefoltert“.
- source_word: ὁρῶσα
  choice: mitansah
  rationale: Das temporale Partizip beschreibt, dass die Mutter die Qualen unmittelbar vor Augen hatte. „Mitansah“ bringt dieses fortdauernde, persönliche Bezeugen knapp und natürlich zum Ausdruck.
- source_word: μήτηρ
  choice: die Mutter
  rationale: Der griechische Text nennt sie schlicht „die Mutter“. Diese Form bleibt nah am Wortlaut; der Zusammenhang macht ihre Beziehung zu den Söhnen deutlich.
- source_word: οὐ μετεβάλετο
  choice: änderte sie ihre Haltung nicht
  rationale: Das Verb bedeutet „sich ändern“ oder „umschwenken“. Die Ergänzung „ihre Haltung“ macht die Aussage im Deutschen idiomatisch, ohne genauer festzulegen, worin diese Haltung bestand.
- source_word: διὰ τὴν εὐσέβειαν
  choice: aus Frömmigkeit
  rationale: εὐσέβεια ist in 4 Makkabäer ein Leitbegriff für ehrfürchtige, in Treue und Gehorsam gelebte Gottesverehrung. „Frömmigkeit“ bewahrt den Charakter einer religiösen Tugend und bleibt knapp.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im hellenistisch-jüdischen Martyriumskontext
  choice: Frömmigkeit
  alternative: Gottesfurcht; Ehrfurcht vor Gott
  rationale: „Frömmigkeit“ eignet sich als wiederkehrender Tugendbegriff und umfasst hier die treue Ausrichtung auf Gott und sein Gesetz. „Gottesfurcht“ wäre deutlicher auf Gott bezogen, würde den weiteren Tugendcharakter des griechischen Begriffs jedoch stärker eingrenzen.
- issue: Deutung von οὐ μετεβάλετο
  choice: änderte sie ihre Haltung nicht
  alternative: blieb sie standhaft; ließ sie sich nicht umstimmen
  rationale: Die gewählte Fassung wahrt die offene Bedeutung des Verbs „sich ändern“, während die Alternativen den Gedanken ausdrücklich als Standhaftigkeit oder Widerstand gegen Überredung deuten würden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einer nach dem anderen“ macht die Abfolge anschaulich; „ihre Haltung nicht ändern“ bewahrt die relative Offenheit des griechischen Verbs. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Folterschilderung.
