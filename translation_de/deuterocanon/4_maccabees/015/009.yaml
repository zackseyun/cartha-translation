  yaml_path: translation/deuterocanon/4_maccabees/015/009.yaml
  text: And not only that, but because of the nobility of her sons and their obedience to the law, she had an even greater motherly affection for them.
translation:
  language: de
  text: 'Doch nicht nur das: Wegen des edlen Charakters ihrer Söhne und ihres bereitwilligen Gehorsams gegenüber dem Gesetz empfand sie eine noch größere mütterliche Liebe zu ihnen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καί
  choice: Doch nicht nur das
  rationale: Die Wendung führt einen weiteren, steigernden Gedanken ein. Die deutsche Formulierung gibt sowohl den leichten Gegensatz als auch die kumulative Kraft natürlich wieder.
- source_word: καλοκἀγαθίαν
  choice: edlen Charakters
  rationale: Das Wort bezeichnet sittliche Güte und charakterliche Vorzüglichkeit. „Edler Charakter“ wahrt die ethische Bedeutung und vermeidet den möglichen Eindruck gesellschaftlichen Adels.
- source_word: εὐπείθειαν
  choice: bereitwilligen Gehorsams
  rationale: Der Ausdruck meint nicht bloß äußere Unterordnung, sondern willige Folgsamkeit. „Bereitwilliger Gehorsam“ bildet diese Nuance gegenüber dem Gesetz ab.
- source_word: πρὸς τὸν νόμον
  choice: gegenüber dem Gesetz
  rationale: Die Präposition bezeichnet hier die Ausrichtung ihres Gehorsams auf das Gesetz. Der bestimmte Ausdruck verweist im Kontext auf das jüdische beziehungsweise überlieferte Gesetz, ohne dies im Haupttext zusätzlich festzulegen.
- source_word: μείζω
  choice: noch größere
  rationale: Der Komparativ steigert die bereits vorhandene Zuneigung; „noch größere“ bringt diese Beziehung idiomatisch zum Ausdruck.
- source_word: φιλοστοργίαν
  choice: mütterliche Liebe
  rationale: Das Substantiv bezeichnet natürliche, innige Familienliebe. Da die handelnde Person die Mutter und die Bezugsgruppe ihre Söhne sind, ist die kontextuelle mütterliche Nuance in dieser Form klar und natürlich wiedergegeben.
theological_decisions:
- issue: Soll die mütterliche Nuance von φιλοστοργία ausdrücklich gemacht werden?
  choice: mütterliche Liebe
  alternative: familiäre Zuneigung / natürliche Familienliebe
  rationale: Das griechische Wort ist grundsätzlich weiter und bezeichnet familiäre Liebe. Im unmittelbaren Satz bezieht es sich jedoch eindeutig auf die Liebe der Mutter zu ihren Söhnen. Die ausdrückliche Wiedergabe klärt den Bezug, ohne eine zusätzliche Lehraussage einzuführen.
- issue: Groß- oder Kleinschreibung von νόμος
  choice: das Gesetz
  alternative: das gesetzliche Gebot / die Tora
  rationale: Der Kontext legt das jüdische beziehungsweise väterliche Gesetz nahe, doch der griechische Wortlaut spezifiziert es an dieser Stelle nicht als „Tora“. Die neutrale Wiedergabe „das Gesetz“ bewahrt die Kontextbindung ohne Überpräzisierung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Empfand … Liebe“ vermeidet die im Deutschen unnatürlichere Besitzkonstruktion „hatte Liebe“. Keine Fußnoten erforderlich, da die kontextuelle Präzisierung von φιλοστοργία im Haupttext transparent und nicht strittig genug für eine Anmerkung ist.
