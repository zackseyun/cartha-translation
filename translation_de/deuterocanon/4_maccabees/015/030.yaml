translation:
  language: de
  text: O du, die du an Standhaftigkeit edler bist als Angehörige des männlichen Geschlechts und im Ausharren mannhafter als Männer![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im zweiten Vergleich: „mutiger als Männer“. Im Griechischen steht „mannhafter als Männer“; damit bleibt ein bewusstes Wortspiel mit einer als männlich verstandenen Tugend erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρρένων
  choice: das männliche Geschlecht
  rationale: ἀρρήν bezeichnet grundlegend das männliche Geschlecht. Die Wiedergabe unterscheidet den Ausdruck bewusst vom folgenden ἀνδρῶν („Männer“) und bewahrt so den rhetorischen Wechsel.
- source_word: πρὸς καρτερίαν
  choice: an unbeugsamem Mut
  rationale: καρτερία verbindet Standhaftigkeit mit innerer Stärke. „Unbeugsamer Mut“ gibt diese aktive, widerstandsfähige Haltung wieder und unterscheidet sie sprachlich von ὑπομονή.
- source_word: γενναιοτέρα
  choice: edler
  rationale: γενναῖος kann Vornehmheit, Hochherzigkeit und Tapferkeit bezeichnen. „Edler“ erhält die moralische Erhöhung, ohne den Begriff auf bloße Kühnheit zu verengen.
- source_word: ἀνδρῶν
  choice: Männer
  rationale: ἀνήρ bezeichnet Männer und kann zugleich Vorstellungen männlicher Tapferkeit aufrufen. „Männer“ wahrt den Gegensatz zum vorausgehenden Ausdruck für das männliche Geschlecht.
- source_word: πρὸς ὑπομονὴν
  choice: im Ausharren
  rationale: ὑπομονή bezeichnet standhaftes Verbleiben und Ertragen unter Bedrängnis. „Ausharren“ ist im Deutschen natürlich und erhält den prozesshaften Sinn.
- source_word: ἀνδρειοτέρα
  choice: mannhafter
  rationale: ἀνδρεῖος ist von ἀνήρ („Mann“) abgeleitet und bezeichnet männlich verstandene Tapferkeit. „Mannhafter“ bewahrt das absichtliche Wortspiel mit ἀνδρῶν, das „mutiger“ verdecken würde.
theological_decisions:
- issue: Geschlechtlich markierte Vergleichsrhetorik im Lob der Mutter
  choice: 'Der männliche Vergleich bleibt ausdrücklich erhalten: „edler als das männliche Geschlecht … mannhafter als Männer“.'
  alternative: Eine entgenderte Formulierung wie „mutiger als alle anderen“ oder die Glättung zu „tapferer als Männer“.
  rationale: Der griechische Text kehrt bewusst zeitgenössische, männlich codierte Tugendvorstellungen um, indem er die Frau über Männer stellt. Diese Spannung gehört zur Aussage und darf nicht neutralisiert werden.
translation_notes:
  register: Gehobene, aber gut verständliche Ausrufsprache. Das einleitende „O du“ bildet die feierliche Anrede ab. „Mannhafter“ ist bewusst markiert, weil gerade diese geschlechtliche Zuspitzung die Rhetorik des griechischen Textes trägt.
