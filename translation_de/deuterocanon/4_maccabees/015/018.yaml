  text: O only woman who gave birth to godliness in its fullness[a][b].
translation:
  language: de
  text: O du einzige Frau[a], die du die Frömmigkeit[b] in ihrer ganzen Fülle geboren hast!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einzigartige Frau“ oder „Frau, du allein“. Das Griechische hebt hervor, dass sie unter den Frauen in dieser Hingabe allein dasteht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gottesfurcht“. Das griechische Wort εὐσέβεια bezeichnet im 4. Makkabäerbuch besonders die ehrfürchtige Treue zu Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: O
  rationale: Die Anredepartikel leitet einen feierlichen, emphatischen Ausruf ein; „O“ wahrt den gehobenen rhetorischen Ton.
- source_word: μόνη γύναι
  choice: du einzige Frau
  rationale: Die Verbindung bezeichnet die Angeredete als allein- beziehungsweise einzigartig unter den Frauen; die deutsche Form ist direkt, verständlich und bewahrt die Hervorhebung.
- source_word: τὴν εὐσέβειαν
  choice: die Frömmigkeit
  rationale: εὐσέβεια bezeichnet im 4. Makkabäerbuch die ehrfürchtige, treue Ausrichtung auf Gott. „Frömmigkeit“ ist im Deutschen der prägnante religiöse Ausdruck, ohne den Begriff auf ein einzelnes Verhalten zu verengen.
- source_word: ὁλόκληρον
  choice: in ihrer ganzen Fülle
  rationale: Das Adjektiv betont Ganzheit, Vollständigkeit und Unversehrtheit. Die Wendung gibt diese umfassende Qualität im Deutschen natürlicher wieder als das steife „ganze Frömmigkeit“.
- source_word: ἀποκυήσασα
  choice: geboren hast
  rationale: Das Partizip verwendet ausdrücklich die Sprache des Gebärens. Die wörtliche Wiedergabe erhält das für die Darstellung der Mutter zentrale Geburtsbild.
theological_decisions:
- issue: Geburtsmetapher für εὐσέβεια
  choice: Die konkrete Geburtsmetapher wird mit „die Frömmigkeit … geboren hast“ beibehalten.
  alternative: „vollkommene Frömmigkeit hervorgebracht hast“
  rationale: Der griechische Text verbindet die Mutterschaft ausdrücklich mit der Frömmigkeit. „Hervorgebracht“ wäre glatter, würde aber das körperlich-mütterliche Bild abschwächen.
- issue: Umfang von μόνη
  choice: „du einzige Frau“
  alternative: „Frau, du allein“ oder „einzigartige Frau“
  rationale: Die Übersetzung wahrt die singuläre Hervorhebung, ohne näher festzulegen, ob μόνη streng ausschließend oder rühmend im Sinn von „einzigartig“ gemeint ist; die Fußnote hält diese Spannweite offen.
translation_notes:
  register: Feierlich-rhetorische Anrede in modernem Standarddeutsch. Das wiederholte „du“ ist bei einer erweiterten direkten Anrede idiomatisch und hält den Bezug zur Angeredeten klar; das Ausrufezeichen entspricht dem exklamatorischen Charakter.
