  text: a mother holding two votes on behalf of her children[a], one deadly and one saving,
translation:
  language: de
  text: eine Mutter, die für ihre Kinder zwei Stimmsteine[a] in der Hand hielt, einen todbringenden und einen rettenden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwei Stimmen“; wörtlicher: „zwei Stimmsteine“. Das griechische Wort bezeichnet ursprünglich einen Stein, der bei einer Abstimmung verwendet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δύο
  choice: zwei
  rationale: Die Kardinalzahl bezieht sich unmittelbar auf ψήφους.
- source_word: ψήφους
  choice: Stimmsteine
  rationale: ψῆφος bezeichnet ursprünglich einen beim Abstimmen verwendeten Stein und dann die abgegebene Stimme. „Stimmsteine“ bewahrt hier sowohl das konkrete Bild des Haltens als auch den Gedanken einer entscheidenden Wahl.
- source_word: κρατοῦσα
  choice: in der Hand hielt
  rationale: Die Wendung gibt das konkrete Halten oder Innehaben natürlich wieder und passt zum Bild der Stimmsteine.
- source_word: μήτηρ
  choice: eine Mutter
  rationale: Die artikellose Bezeichnung wird im Deutschen in diesem Satzglied idiomatisch mit dem unbestimmten Artikel wiedergegeben.
- source_word: θανατηφόρον
  choice: todbringenden
  rationale: Das Adjektiv bedeutet wörtlich „Tod bringend“ und bildet einen prägnanten Gegensatz zu σωτήριον.
- source_word: σωτήριον
  choice: rettenden
  rationale: Das Wort bezeichnet, was rettet oder bewahrt. „rettend“ erhält die offene Bedeutung, ohne sie unnötig auf einen späteren theologischen Fachbegriff festzulegen.
- source_word: ὑπὲρ τέκνων
  choice: für ihre Kinder
  rationale: ὑπέρ bezeichnet hier, dass die Entscheidung die Kinder betrifft und um ihretwillen getroffen wird; „für ihre Kinder“ ist knapp und natürlich.
theological_decisions:
- issue: Wiedergabe von σωτήριον im Zusammenhang des Martyriums
  choice: rettenden
  alternative: heilbringenden
  rationale: „rettend“ wahrt den Gegensatz zu „todbringend“ und lässt offen, ob vor allem Bewahrung, Rettung oder endgültiges Heil gemeint ist. „heilbringend“ könnte stärker als im griechischen Teilsatz vorgegeben einen dogmatischen Sinn nahelegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Metapher wird im Haupttext konkret bewahrt; die Fußnote nennt die abstraktere Bedeutung „Stimmen“. Der Satz bleibt als fortlaufendes Satzglied mit Schlusskomma stehen, entsprechend der vorgelegten Versform.
