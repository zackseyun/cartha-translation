lexical_decisions:
- source_word: σάρκας
  choice: Fleischstücke
  rationale: Der Plural von σάρξ bezeichnet hier im Zusammenhang des Martyriums konkret das zugerichtete Fleisch. Das deutsche Massennomen „Fleisch“ würde den griechischen Plural und die bildhafte Konkretheit weniger deutlich wiedergeben.
- source_word: ὥσπερ
  choice: wie
  rationale: Gibt den einleitenden Vergleich knapp und natürlich wieder.
- source_word: προσωπεῖα
  choice: Masken
  rationale: Das Wort bezeichnet gewöhnlich Masken, besonders Theatermasken. „Masken“ bewahrt das verstörende Bild des griechischen Textes besser als „Gesichter“.
- source_word: προκειμένας
  choice: die … vor ihnen lagen
  rationale: πρόκειμαι kann bedeuten, dass etwas vor jemandem liegt oder sichtbar daliegt. Die Formulierung erhält den beschreibenden Charakter des Partizips, ohne ein absichtliches Auslegen zwingend vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Knappes, bildstarkes Satzfragment in modernem, würdevollem Standarddeutsch. „Fleischstücke“ ist bewusst konkret und drastisch; „vor ihnen lagen“ lässt offen, ob sie dort absichtlich ausgelegt worden waren.
