base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/013.yaml
  text: O sacred nature[a], and the affections of parents, and filial love toward parents, and nurture[b], and the unconquerable passions of mothers.
translation:
  language: de
  text: O heilige Natur[a], o Liebe der Eltern und innige Liebe zu den Eltern, o Fürsorge und unbezwingbare Gefühle der Mütter![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heiliger natürlicher Bund“. Das griechische Wort kann sowohl die Natur selbst als auch die natürliche Ordnung meinen, die sich in familiärer Zuneigung zeigt.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Gefühle“ sind hier machtvolle Zuneigungen und Regungen gemeint, nicht notwendigerweise ungeordnete Begierden.
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  choice: heilige Natur
  rationale: φύσις bezeichnet Natur beziehungsweise natürliche Beschaffenheit und wird hier in einer feierlichen Anrede personifiziert; ἱερά bewertet die natürlichen Familienbande als heilig, ohne daraus eine eigenständige Lehrformel zu machen.
- source_word: φίλτρα γονέων
  choice: Liebe der Eltern
  rationale: φίλτρα kann Liebesregungen, Zuneigung oder Liebesmittel bezeichnen. Im familiären Zusammenhang ist die von den Eltern ausgehende Liebe gemeint; eine magische Bedeutung wäre hier irreführend.
- source_word: γονεύσιν φιλοστόργε
  choice: innige Liebe zu den Eltern
  rationale: φιλοστόργος bezeichnet besonders die natürliche, zärtliche Zuneigung innerhalb einer Familie; der Dativ γονεύσιν gibt an, wem diese Liebe gilt.
- source_word: τροφεῖα
  choice: Fürsorge
  rationale: Das Wort umfasst das Ernähren, Pflegen und Aufziehen eines Kindes. „Fürsorge“ gibt diesen Zusammenhang knapp und in natürlichem Deutsch wieder.
- source_word: μητέρων ἀδάμαστα πάθη
  choice: unbezwingbare Gefühle der Mütter
  rationale: ἀδάμαστα bedeutet „ungezähmt“ oder „unbezwingbar“, πάθη hier starke Regungen oder Gefühle. „Gefühle“ vermeidet die im heutigen Deutsch leicht missverständliche Vorstellung ungeordneter Begierden, bewahrt mit „unbezwingbar“ aber die Intensität.
theological_decisions:
- issue: Ist der Vers eine Lehraussage über eine geheiligte Familienordnung oder ein rhetorischer Ausruf über die Macht natürlicher Familienbande?
  choice: Ein feierlicher Ausruf, der die Heiligkeit und Stärke natürlicher familiärer Zuneigung preist
  alternative: Eine Klage, welche die Macht der Eltern- und Mutterliebe anruft, ohne sie ausdrücklich als heilig zu bewerten
  rationale: Das einleitende Ὦ und die aneinandergereihten Anreden bilden eine gehobene Apostrophe. „Heilige“ gibt ἱερά ausdrücklich wieder, ohne die rhetorische Aussage zu einer weitergehenden dogmatischen Behauptung auszubauen.
translation_notes:
  register: Feierlich-rhetorische, aber verständliche Standardsprache. Die wiederholte Anrede mit „o“ bildet die griechische Apostrophe nach und verdeutlicht die Reihung der personifizierten familiären Bindungen.
