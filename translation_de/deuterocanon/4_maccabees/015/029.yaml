base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/029.yaml
  text: O mother of the nation[a], avenger of the law, defender of godliness[b], and prizewinner in the struggle through motherly affections.
translation:
  language: de
  text: O Mutter des Volkes[a], Rächerin des Gesetzes, Verteidigerin der Gottesfurcht und Siegerin im Kampf durch mütterliche Empfindungen[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mutter der Nation« beziehungsweise »Mutter des Volksstammes«; das griechische Wort kann ein Volk, eine Nation oder eine ethnische Gemeinschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Siegerin des Kampfes durch die inneren Regungen«. Das griechische Wort bezeichnet wörtlich die inneren Organe, bildlich tiefe Empfindungen oder Mitgefühl; zugleich klingt das Bild eines Wettkampfs mit errungenem Preis an.'
    reason: lexical_and_metaphorical_clarification
lexical_decisions:
- source_word: μήτηρ ἔθνους
  choice: Mutter des Volkes
  rationale: Die Anrede bleibt schlicht und feierlich. ἔθνος kann Volk, Nation oder Volksgruppe bezeichnen; „Volk“ ist hier im Deutschen natürlich und lässt die kollektive Bedeutung offen.
- source_word: ἔκδικε τοῦ νόμου
  choice: Rächerin des Gesetzes
  rationale: ἔκδικος bezeichnet eine Person, die für das Recht einer Sache eintritt beziehungsweise Vergeltung übt. „Rächerin“ bewahrt die kraftvolle, forensische Färbung des Ehrentitels.
- source_word: ὑπερασπίστεια τῆς εὐσεβείας
  choice: Verteidigerin der Gottesfurcht
  rationale: Der seltene feminine Titel bezeichnet eine Beschützerin oder Verteidigerin. „Gottesfurcht“ gibt εὐσέβεια als ehrfürchtige, im Handeln bewährte Hingabe an Gott wieder.
- source_word: τοῦ διὰ σπλάγχνων ἀγῶνος
  choice: in dem Kampf, der durch deine mütterlichen Gefühle ging
  rationale: σπλάγχνα bezeichnet wörtlich die inneren Organe und bildlich tiefes Mitgefühl oder innige Zuneigung. Die Formulierung wahrt die ungewöhnliche Verbindung mit διά und macht deutlich, dass der Kampf ihre natürlichen Gefühle als Mutter zutiefst berührte, ohne das Verhältnis als bloßen Kampf gegen diese Gefühle festzulegen.
- source_word: ἀθλοφόρε
  choice: Siegerin
  rationale: Das Wort bezeichnet diejenige, die aus einem Wettkampf den Preis davonträgt. „Siegerin“ ist im Deutschen würdevoll und verständlich; die Fußnote hält das ausdrückliche Bild des Siegespreises fest.
theological_decisions:
- issue: Bedeutung von εὐσέβεια im jüdischen Martyriumskontext
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ umfasst ehrfürchtige Treue zu Gott und dem Gesetz, ohne εὐσέβεια zu einem späteren theologischen Fachbegriff zu machen.
- issue: Verhältnis des Kampfes zu den σπλάγχνα
  choice: der Kampf ging durch ihre mütterlichen Gefühle
  alternative: Kampf gegen die Mutterliebe
  rationale: Die griechische Wendung ist rhetorisch verdichtet. Die Übersetzung lässt offen, ob die mütterlichen Gefühle Mittel, Bereich oder besondere innere Belastung des Kampfes sind, statt ausdrücklich einen Gegensatz zur Mutterliebe zu behaupten.
translation_notes:
  register: Feierliche, direkte Anrede mit einer Reihe femininer Ehrentitel. „O“ bewahrt den gehobenen Ausruf, während Wortwahl und Satzbau für heutige Leser verständlich bleiben. Die ungewöhnliche Schlusswendung bleibt bewusst bildhaft und wird nicht zu einem eindeutig gegen die Mutterliebe gerichteten Kampf vereindeutigt.
