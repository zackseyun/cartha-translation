  source_fidelity: Die Reihe der Anreden und Ehrentitel ist insgesamt quellentreu. Die gegenwärtige Schlussformulierung „der durch deine mütterlichen Gefühle ging“ gibt διὰ jedoch nicht angemessen wieder und fügt mit „deine“ eine unnötige explizite Possessivbestimmung hinzu. „durch mütterliche Empfindungen“ erhält die instrumentale bzw. vermittelnde Offenheit von διά, ohne den Konflikt näher auszudeuten.
  naturalness: „O Mutter des Volkes“ und die Titelfolge sind in feierlichem modernem Standarddeutsch verständlich. Die Relativkonstruktion zum Kampf ist dagegen unidiomatisch. „Siegerin im Kampf durch mütterliche Empfindungen“ ist knapp, verständlich und bewahrt die absichtlich verdichtete Bildsprache.
