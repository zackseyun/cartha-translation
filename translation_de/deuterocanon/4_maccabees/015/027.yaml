  text: I did not recognize the salvation that was saving seven sons for a little while[a].
translation:
  language: de
  text: Ich erkannte die Rettung nicht, die sieben Söhne für kurze Zeit rettete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich erkannte das Heil nicht, das sieben Söhne für eine kurze Weile rettete.“'
    reason: Bewahrt die mögliche weitere, auch theologisch gefärbte Bedeutung von σωτηρία sowie eine alternative Wiedergabe der Zeitangabe.
lexical_decisions:
- source_word: οὐκ ἐπέγνων
  choice: Ich erkannte … nicht
  rationale: ἐπιγινώσκω bezeichnet hier das Erkennen oder Erfassen. „Erkannte … nicht“ wahrt die Aussage, ohne sie auf bloß verstandesmäßiges Begreifen einzuengen.
- source_word: τὴν σώζουσαν … σωτηρίαν
  choice: die Rettung …, die … rettete
  rationale: Die Wiedergabe mit demselben deutschen Wortstamm bewahrt die auffällige Verbindung von σώζουσαν und σωτηρίαν. Obwohl die Wiederholung im Deutschen markant klingt, entspricht sie der griechischen Formulierung und lässt deren Spannung bestehen.
- source_word: ἑπτὰ υἱοὺς
  choice: sieben Söhne
  rationale: υἱούς bezeichnet ausdrücklich Söhne; dies entspricht auch dem unmittelbaren Erzählzusammenhang.
- source_word: πρὸς ὀλίγον χρόνον
  choice: für kurze Zeit
  rationale: Die Wendung bezeichnet eine begrenzte Dauer. „Für kurze Zeit“ ist im modernen Deutschen natürlich und gibt die zeitliche Einschränkung knapp wieder.
theological_decisions:
- issue: Bedeutung von σωτηρία im Martyriumskontext
  choice: Rettung mit dem unmittelbaren Sinn zeitweiliger Bewahrung vor dem Tod
  alternative: „Heil“ mit stärkerem geistlich-theologischem Klang oder „Bewahrung“ ohne die weitere Bedeutungsresonanz
  rationale: Der Zusatz „für kurze Zeit“ rückt eine nur vorübergehende Rettung der Söhne in den Vordergrund. „Rettung“ wahrt zugleich die mögliche weitere Bedeutungsbreite von σωτηρία besser als eine rein erklärende Wiedergabe wie „am Leben erhalten“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Griechischen angelegte Wiederholung von „Rettung/retten“ und die Spannung einer nur vorübergehenden Rettung werden bewusst nicht geglättet.
