  text: Because of her fear toward God[a], she disregarded the temporary safety of her children.
translation:
  language: de
  text: Aus Gottesfurcht achtete sie die vorübergehende Rettung ihrer Kinder gering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die zeitweilige Bewahrung ihrer Kinder“. Das griechische Wort kann hier Rettung, Bewahrung oder Erhaltung des Lebens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸν πρὸς τὸν θεὸν φόβον
  choice: Aus Gottesfurcht
  rationale: διά mit Akkusativ bezeichnet den Grund. Das deutsche „Gottesfurcht“ gibt die auf Gott gerichtete, ehrfürchtige Furcht knapp und idiomatisch wieder, ohne den starken Begriff φόβος zu einer bloßen Achtung abzuschwächen.
- source_word: ὑπερεῖδεν
  choice: achtete … gering
  rationale: Das Verb bezeichnet hier kein versehentliches Übersehen, sondern ein bewusstes Zurückstellen gegenüber der Treue zu Gott. „Gering achten“ bringt diese wertende Haltung natürlich zum Ausdruck.
- source_word: τὴν τῶν τέκνων πρόσκαιρον σωτηρίαν
  choice: die vorübergehende Rettung ihrer Kinder
  rationale: σωτηρία meint im Zusammenhang die Rettung beziehungsweise Erhaltung des irdischen Lebens; πρόσκαιρος begrenzt sie ausdrücklich auf eine kurze Zeit. Der im Kontext naheliegende Bezug der Kinder auf die Mutter wird im Deutschen durch „ihrer“ ausgedrückt.
theological_decisions:
- issue: Bedeutung von φόβος gegenüber Gott
  choice: Gottesfurcht
  alternative: Ehrfurcht vor Gott
  rationale: „Gottesfurcht“ bewahrt sowohl den starken Furchtbegriff als auch dessen religiös-ehrfürchtige Ausrichtung; „Ehrfurcht“ allein würde die Spannung des griechischen Ausdrucks abschwächen.
- issue: Bedeutung von σωτηρία im Zusammenhang
  choice: vorübergehende Rettung des irdischen Lebens
  alternative: vorübergehende Bewahrung oder Sicherheit
  rationale: Das Adjektiv πρόσκαιρος macht deutlich, dass keine endgültige oder ewige Rettung gemeint ist, sondern die zeitlich begrenzte Verschonung vor Folter und Tod.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gottesfurcht“ ist ein geläufiger biblisch-religiöser Ausdruck; „achtete … gering“ bewahrt den bewussten und wertenden Charakter der Aussage.
