  source_fidelity: 'Der Satz gibt die wesentlichen griechischen Elemente zuverlässig wieder: den kontrastiv-weiterführenden Anschluss (ἀλλὰ καί), die Gegenüberstellung von individueller und gemeinsamer Ermahnung (καθʼ ἕνα ... ὁμοῦ πάντας), die Mutter als Handelnde sowie die Ausrichtung auf den Tod. „Den Tod ... auf sich zu nehmen“ ist eine idiomatische deutsche Entfaltung von ἐπὶ τὸν θάνατον προέτρεπεν und vermeidet zu Recht die über den Wortlaut hinausgehende Bezeichnung „Martyrium“.'
