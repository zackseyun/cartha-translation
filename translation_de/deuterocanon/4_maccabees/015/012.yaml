base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/012.yaml
  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: de
  text: Doch die Mutter ermutigte jeden Sohn einzeln[a] und alle gemeinsam, den Tod um der Gottesfurcht willen auf sich zu nehmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Sohn nach dem anderen und dann alle gemeinsam«; der griechische Text stellt die Ermutigung jedes Einzelnen der Ermutigung aller als Gruppe gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »zu dem Tod der Gottesfurcht«; gemeint sein kann ein Tod um der Frömmigkeit beziehungsweise der Verehrung Gottes willen oder ein davon geprägter Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Doch
  rationale: Kennzeichnet im Zusammenhang eine leicht kontrastierende, zugleich weiterführende Wendung, ohne das καί im Deutschen unnötig schwer wiederzugeben.
- source_word: καθʼ ἕνα παῖδα
  choice: jeden Sohn einzeln
  rationale: καθʼ ἕνα hat distributiven Sinn („einen nach dem anderen“, „jeden einzeln“); παῖδα bezeichnet hier aufgrund des Zusammenhangs jeweils einen Sohn der Mutter.
- source_word: ὁμοῦ πάντας
  choice: alle gemeinsam
  rationale: Bewahrt sowohl die Gesamtheit (πάντας) als auch den gemeinschaftlichen Charakter (ὁμοῦ) und bildet den Gegensatz zu „jeden ... einzeln“ ab.
- source_word: ἡ μήτηρ
  choice: die Mutter
  rationale: Direkte und natürliche Wiedergabe der bestimmten Nominalgruppe.
- source_word: ἐπὶ ... προέτρεπεν
  choice: ermutigte ... auf sich zu nehmen
  rationale: προτρέπω bezeichnet eindringliches Ermuntern oder Antreiben; zusammen mit ἐπί und dem Ziel „Tod“ wird die Richtung idiomatisch ausgedrückt, ohne den Eindruck zu erwecken, die Mutter verursache den Tod.
- source_word: τὸν ... θάνατον
  choice: den Tod
  rationale: Die konkrete Bezeichnung „Tod“ wird beibehalten; „Martyrium“ wäre eine kontextuelle Deutung, die über den Wortlaut hinausginge.
- source_word: τῆς εὐσεβείας
  choice: um der Gottesfurcht willen
  rationale: Gibt den religiösen Bezug von εὐσέβεια in verständlichem, würdigem Deutsch wieder. Der Genitiv kann den Tod als durch fromme Gottesverehrung begründet beziehungsweise geprägt kennzeichnen.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Kontext des Märtyrertodes
  choice: Gottesfurcht
  alternative: Frömmigkeit; Gottesverehrung
  rationale: „Gottesfurcht“ macht die Ausrichtung auf Gott deutlich und ist im Deutschen verständlicher als das teils missverständliche „Frömmigkeit“. Die Fußnote hält offen, ob der Genitiv eher den Grund des Todes oder dessen religiöse Prägung bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Gegenüberstellung „jeden Sohn einzeln ... alle gemeinsam“ wird klar bewahrt. „Den Tod ... auf sich nehmen“ ist idiomatischer als „zum Tod ermutigen“ und erhält zugleich das Zielgefüge von ἐπί mit Akkusativ; die mögliche Genitivmehrdeutigkeit wird in der Fußnote offengehalten.
