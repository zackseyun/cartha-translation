  source_fidelity: Die Übersetzung erkennt zutreffend, dass ὠδῖνες hier im Kontext der Mutter als Geburtswehen zu verstehen sind, nicht als die von den Söhnen erlittenen Qualen. Die auf jeden einzelnen Sohn bezogene Wendung καθʼ ἕκαστον αὐτῶν wird mit „bei jedem von ihnen“ idiomatischer wiedergegeben. „mit ihnen mitzufühlen“ entspricht τὴν εἰς αὐτοὺς ἔχειν συμπάθειαν angemessen.
  naturalness: Die vorliegende Wortstellung („und wegen … gezwungen war“) ist als eigenständige deutsche Satzfortsetzung holprig und legt eine im Deutschen nicht sauber markierte Nebensatzstellung nahe. Die Umstellung zu „und war wegen … gezwungen“ bewahrt den fragmentarischen Anschluss des griechischen Satzes und ist modernes Standarddeutsch.
  terminology: „Geburtswehen“ ist hier die sachlich und kontextuell passende konkrete Bedeutung von ὠδῖνες. „Mitfühlen“ gibt συμπάθεια ohne theologische oder psychologische Überdeutung wieder.
