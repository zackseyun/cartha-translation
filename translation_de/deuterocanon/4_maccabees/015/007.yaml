lexical_decisions:
- source_word: ὠδῖνας
  choice: Geburtswehen
  rationale: Das Wort bezeichnet besonders Geburtswehen und nimmt hier auf die leibliche Mutterschaft zu jedem ihrer Söhne Bezug; die konkretere Bedeutung ist dem allgemeineren »Schmerzen« vorzuziehen.
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: für jeden Einzelnen von ihnen
  rationale: Die Wendung ordnet die Geburtswehen jedem einzelnen Sohn zu. Sie besagt im Kontext nicht, dass die Söhne diese Wehen erlitten hätten.
- source_word: ἠναγκασμένην
  choice: gezwungen war
  rationale: Bewahrt die starke Bedeutung des Verbs und fügt sich als abhängige Satzfortsetzung in den fragmentarisch überlieferten Vers ein.
- source_word: τὴν εἰς αὐτοὺς ἔχειν συμπάθειαν
  choice: mit ihnen mitzufühlen
  rationale: Gibt die auf die Söhne gerichtete Anteilnahme natürlich und präzise wieder, ohne zusätzliche Deutung.
