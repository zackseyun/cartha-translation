translation:
  language: de
  text: Auch werde ich die heiligen Eide der Vorfahren, das Gesetz zu halten, nicht missachten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heiligen Eide der Väter“. Gemeint sind Eide, die das Halten des überlieferten jüdischen Gesetzes betreffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε
  choice: Auch … nicht
  rationale: Setzt im Deutschen eine vorausgehende Verneinungsreihe natürlich fort; ein isoliertes „noch“ wäre stärker vom vorigen Satz abhängig.
- source_word: ἱεροὺς
  choice: heiligen
  rationale: Bewahrt das religiöse Gewicht des Adjektivs und verbindet sich im Deutschen natürlich mit „Eide“.
- source_word: τῶν προγόνων
  choice: der Vorfahren
  rationale: Gibt den Genitiv ohne das im Griechischen nicht ausdrücklich vorhandene Possessivpronomen wieder. „Vorfahren“ bezeichnet hier die früheren Generationen der überlieferten Glaubensgemeinschaft.
- source_word: περὶ τοῦ φυλάξαι τὸν νόμον
  choice: das Gesetz zu halten
  rationale: Gibt den Inhalt beziehungsweise Gegenstand der Eide knapp und idiomatisch wieder; „halten“ bewahrt den Sinn treuer Befolgung.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Bleibt nahe am griechischen Wortlaut; im Zusammenhang ist das überlieferte jüdische Gesetz gemeint.
- source_word: ὅρκους
  choice: Eide
  rationale: ὅρκος bezeichnet ausdrücklich einen Eid und nicht bloß ein allgemeines Gelübde.
- source_word: οὐ παρήσω
  choice: werde ich … nicht missachten
  rationale: παρίημι bedeutet hier, etwas unbeachtet zu lassen oder darüber hinwegzugehen; „missachten“ passt sachlich und idiomatisch zu Eiden.
theological_decisions:
- issue: Bezeichnung der früheren Generationen in τῶν προγόνων
  choice: der Vorfahren
  alternative: der Väter
  rationale: „Vorfahren“ ist eine direkte, moderne Wiedergabe von προγόνων und vermeidet sowohl die Ergänzung „unsere“ als auch eine unnötige Verengung auf männliche Ahnen. Die mögliche traditionell-maskuline Wiedergabe wird in der Fußnote genannt.
- issue: Bezug von τὸν νόμον
  choice: das Gesetz
  alternative: die Tora / das überlieferte jüdische Gesetz
  rationale: Die schlichte Form bewahrt die Ausdrucksweise des Griechischen, ohne eine erläuternde Deutung in den Haupttext einzutragen; der jüdische Bezug ergibt sich aus dem Kontext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung lässt die feierliche Entschlossenheit des Sprechers erkennen, ohne altertümlich zu wirken.
