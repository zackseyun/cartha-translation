- from: Ich bin nicht so alt und mannhaft, dass mein Denken nicht um der Gottesfurcht willen jung bleiben könnte.[a]
  to: Ich bin nicht so alt und mannhaft, dass meine Vernunft aus Gottesfurcht nicht jung wird.[a]
