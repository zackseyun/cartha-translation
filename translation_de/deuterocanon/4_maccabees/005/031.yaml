  yaml_path: translation/deuterocanon/4_maccabees/005/031.yaml
  text: I am not so old and manly that[a], for the sake of godliness, my reason should not be youthful.
translation:
  language: de
  text: Ich bin nicht so alt und mannhaft, dass meine Vernunft aus Gottesfurcht nicht jung wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frömmigkeit“ statt „Gottesfurcht“. Das griechische Wort bezeichnet ehrfürchtige Hingabe an Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέρων
  choice: alt
  rationale: Das Wort bezeichnet hohes Alter; im Deutschen ist die prädikative Wendung „so alt“ natürlich und genau.
- source_word: ἀνδρῶδης
  choice: mannhaft
  rationale: Die ausdrücklich männliche, rhetorische Färbung bleibt erhalten. „Mannhaft“ bezeichnet hier die gefestigte Haltung eines erwachsenen Mannes, nicht bloß körperliche Kraft.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Der Ausdruck bezeichnet ehrfürchtige Hingabe an Gott und die daraus folgende Treue. „Gottesfurcht“ macht die religiöse Ausrichtung in diesem jüdischen Kontext deutlich.
- source_word: νεάζειν
  choice: jung bleiben
  rationale: Die Form bezeichnet das Jungsein beziehungsweise jugendliche Wirken. „Jung bleiben“ bildet den pointierten Gegensatz zu „alt“ natürlich ab, ohne eine körperliche Verjüngung zu behaupten.
- source_word: λογισμόν
  choice: Denken
  rationale: λογισμός bezeichnet hier das vernünftige, urteilende Denken. „Denken“ ist im modernen Deutsch natürlicher als das personifizierte „meine Vernunft“, wahrt aber den philosophischen Sinn.
- source_word: ὥστε μοι ... μὴ νεάζειν τὸν λογισμόν
  choice: dass mein Denken nicht ... jung bleiben könnte
  rationale: 'Die deutsche Konstruktion gibt die verneinte Folge sinngemäß wieder: Alter und Mannhaftigkeit sind nicht derart, dass sie ein jugendliches Denken im Dienst der Gottesfurcht ausschlössen.'
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im jüdischen Märtyrerkontext
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ bezeichnet verständlich die ehrfürchtige Bindung an Gott; „Frömmigkeit“ ist ebenfalls möglich, kann heute jedoch allgemeiner oder bloß äußerlich verstanden werden.
- issue: Geschlechtsspezifische Aussage von ἀνδρῶδης
  choice: mannhaft
  alternative: reif
  rationale: Das griechische Wort ist ausdrücklich männlich geprägt. Die Übersetzung bewahrt diese rhetorische Nuance, statt sie durch „reif“ zu neutralisieren.
- issue: Mögliche Deutung von νεάζειν
  choice: jung bleiben
  alternative: wieder jung werden
  rationale: Der Kontext stellt das hohe Alter der Jugendlichkeit des Denkens gegenüber. „Jung bleiben“ vermeidet die stärkere, im Text nicht zwingende Vorstellung einer Wiederverjüngung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas ungewöhnliche Verbindung „alt und mannhaft“ bewahrt die markante Rhetorik des griechischen Textes; „Denken“ hält den philosophischen Gedanken verständlich, ohne ihn konfessionell auszudeuten.
