  yaml_path: translation/deuterocanon/4_maccabees/005/002.yaml
  text: He ordered the guards to drag away each one of the Hebrews and force them to taste pork and meat sacrificed to idols[b][a];
translation:
  language: de
  text: Er befahl den Wachen, jeden einzelnen der Hebräer wegzuzerren und ihn zu zwingen, Schweinefleisch und Götzenopferfleisch zu kosten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leibwächtern“; wörtlicher: „Speerträgern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Speisen, die Götzen geopfert worden waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκέλευεν
  choice: Er befahl
  rationale: Das Imperfekt schildert den Befehl im fortlaufenden Erzählgeschehen; „befahl“ gibt die autoritative Kraft natürlich und prägnant wieder.
- source_word: τοῖς δορυφόροις
  choice: den Wachen
  rationale: Wörtlich bezeichnet das Wort Speerträger und kann Leibwächter meinen. „Wachen“ gibt ihre Funktion im Kontext verständlich wieder; die wörtlicheren Möglichkeiten stehen in Fußnote [a].
- source_word: ἕνα ἕκαστον τῶν Ἐβραίων
  choice: jeden einzelnen der Hebräer
  rationale: Die distributive und nachdrückliche Wendung wird durch „jeden einzelnen“ bewahrt; „Hebräer“ entspricht ausdrücklich dem griechischen Ἐβραίων.
- source_word: περισπᾶσθαι
  choice: wegzuzerren
  rationale: Das Verb bezeichnet hier ein gewaltsames Wegziehen. „Wegzuzerren“ wahrt sowohl die Bewegung als auch den Zwang deutlicher als das allgemeinere „ergreifen“.
- source_word: κρεῶν ὑείων
  choice: Schweinefleisch
  rationale: Die Wendung bedeutet Fleisch von Schweinen; „Schweinefleisch“ ist die natürliche moderne deutsche Bezeichnung.
- source_word: εἰδωλοθύτων
  choice: Götzenopferfleisch
  rationale: Der Ausdruck bezeichnet etwas, das Götzen geopfert wurde. Im Zusammenhang mit κρεῶν ist „Götzenopferfleisch“ knapp und sachlich; die weiter gefasste Möglichkeit wird in Fußnote [b] genannt.
- source_word: ἀναγκάζειν
  choice: zu zwingen
  rationale: Das Verb drückt unmittelbaren Zwang aus; „zwingen“ ist klar und entspricht der Härte der Szene.
- source_word: ἀπογεύεσθαι
  choice: zu kosten
  rationale: Das Verb bedeutet kosten beziehungsweise von etwas nehmen. „Kosten“ erhält die Aussage, dass bereits die geringste Teilnahme erzwungen werden sollte, ohne vollständiges Essen vorauszusetzen.
theological_decisions:
- issue: Wiedergabe von Ἐβραίων
  choice: Hebräer
  alternative: Juden
  rationale: Der griechische Text nennt sie ausdrücklich „Hebräer“. Die Übersetzung bewahrt diese ethnisch-historische Bezeichnung, statt sie zu harmonisieren.
- issue: Grad der Teilnahme an den verbotenen Speisen in ἀπογεύεσθαι
  choice: kosten
  alternative: essen; davon nehmen
  rationale: „Kosten“ hält offen, welche Menge verzehrt werden sollte, und bewahrt die Spannung, dass schon eine geringe erzwungene Teilnahme als Übertretung gelten konnte.
- issue: Bezugsweite von εἰδωλοθύτων
  choice: Götzenopferfleisch
  alternative: Götzen geopferte Speisen
  rationale: Die Verbindung mit Schweinefleisch legt im unmittelbaren Satz Fleisch nahe; da der griechische Ausdruck allgemeiner auch geopferte Speisen bezeichnen kann, wird diese Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt die distributive Betonung („jeden einzelnen“), den gewaltsamen Charakter des Wegziehens und die präzise Nuance von „kosten“. Die Pronomenkonstruktion vermeidet das im Deutschen schwerfällige doppelte Pluralobjekt und hält dennoch fest, dass jeder Einzelne betroffen war.
