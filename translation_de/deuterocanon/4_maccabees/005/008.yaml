base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/008.yaml
  text: For it is foolish not to enjoy the pleasant things that are without reproach[a], and unjust to turn away from the gifts of nature.
translation:
  language: de
  text: Denn es ist unvernünftig, die angenehmen Dinge nicht zu genießen, die keinen Tadel verdienen[a], und ungerecht, sich von den Gaben der Natur abzuwenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die untadeligen Freuden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητον
  choice: unvernünftig
  rationale: Das Wort bezeichnet etwas, dem Einsicht oder vernünftiger Sinn fehlt. »Unvernünftig« gibt hier die intellektuell-moralische Wertung natürlich wieder.
- source_word: ἀπολαύειν
  choice: zu genießen
  rationale: Der Infinitiv bezeichnet hier den Genuss angenehmer Dinge; »genießen« ist die direkte und idiomatische deutsche Entsprechung.
- source_word: τῶν χωρὶς ὀνείδους ἡδέων
  choice: die angenehmen Dinge, die keinen Anstoß erregen
  rationale: ἡδέων meint angenehme oder lustvolle Dinge, während χωρὶς ὀνείδους sie als frei von Tadel oder Schande qualifiziert. Die Formulierung wahrt sowohl den Genussaspekt als auch die moralische Einschränkung.
- source_word: ἄδικον
  choice: ungerecht
  rationale: Das Adjektiv trägt eine ethische Wertung, die stärker ist als bloß »unangebracht«; »ungerecht« entspricht dem üblichen Sinn.
- source_word: ἀποστρέφεσθαι
  choice: sich abzuwenden
  rationale: Die mediale Form legt das Bild nahe, dass man sich selbst von etwas abkehrt. »Sich abwenden« bewahrt dieses Bild.
- source_word: τὰς τῆς φύσεως χάριτας
  choice: die Gaben der Natur
  rationale: χάριτες bezeichnet hier Wohltaten oder erfreuliche Gaben, die der Natur zukommen beziehungsweise von ihr gegeben sind. »Gaben der Natur« ist verständlich und vermeidet einen unnötig theologischen Beiklang.
theological_decisions:
- issue: Moralische Einordnung natürlicher Freuden
  choice: Der Vers bezeichnet bestimmte angenehme Dinge ausdrücklich als moralisch unanstößig und stellt es als unvernünftig dar, sie nicht zu genießen.
  alternative: Die Wendung könnte verdichtet mit »die untadeligen Freuden« wiedergegeben werden.
  rationale: Das Griechische schränkt die angenehmen Dinge durch χωρὶς ὀνείδους ausdrücklich ein. Die Übersetzung bewahrt diese Begrenzung und macht daraus keine pauschale Billigung jedes Vergnügens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wertung »unvernünftig … und ungerecht« sowie das Bild des Sich-Abwendens bleiben erhalten.
