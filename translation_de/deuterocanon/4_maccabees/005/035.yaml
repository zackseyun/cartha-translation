base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/035.yaml
  text: Nor will I disgrace you[a], O philosophical reason, nor will I renounce you[b], honored priesthood and knowledge of the law.
translation:
  language: de
  text: Auch dich, philosophische Vernunft, werde ich nicht beschämen[a]; auch euch, ehrwürdiges Priestertum und Kenntnis des Gesetzes, werde ich nicht verleugnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entehren“ beziehungsweise „zuschanden machen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mich von euch lossagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταισχυνῶ
  choice: werde ich nicht beschämen
  rationale: Das Futur von καταισχύνω bezeichnet hier, jemanden oder etwas der Schande auszusetzen. „Beschämen“ bewahrt den Ehr-Schande-Aspekt und passt zur personifizierenden Anrede.
- source_word: φιλόσοφε λόγε
  choice: philosophische Vernunft
  rationale: Der Vokativ bezeichnet einen λόγος, der durch φιλόσοφος näher bestimmt ist. „Philosophische Vernunft“ erhält beide Begriffe und die direkte, personifizierende Anrede.
- source_word: ἑξαρνήσομαί
  choice: werde ich nicht verleugnen
  rationale: ἐξαρνέομαι drückt ein entschiedenes Leugnen oder Lossagen aus. „Verleugnen“ bewahrt hier sowohl die persönliche Anrede als auch den Gedanken gebrochener Treue.
- source_word: ἱεροσύνη τιμία
  choice: du ehrwürdiges Priestertum
  rationale: ἱεροσύνη bezeichnet das Priestertum beziehungsweise Priesteramt; τιμία hebt dessen hohen Wert und seine Ehre hervor. Das eingefügte „du“ macht den griechischen Vokativ im Deutschen deutlich.
- source_word: νομοθεσίας ἐπιστήμη
  choice: du Kenntnis der Gesetzgebung
  rationale: ἐπιστήμη meint fundierte Kenntnis oder Sachkunde, während νομοθεσία wörtlich die Gesetzgebung beziehungsweise das Geben des Gesetzes bezeichnet. Die relativ formale Wiedergabe vermeidet, den Ausdruck vorschnell allein mit „dem Gesetz“ gleichzusetzen.
theological_decisions:
- issue: Personifizierte Anrede von Vernunft, Priestertum und Gesetzeskenntnis
  choice: Die drei Ausdrücke bleiben als direkt angeredete, personifizierte Größen erkennbar.
  alternative: Die Aussage könnte geglättet als allgemeines Bekenntnis zu Philosophie, Priestertum und Gesetz verstanden werden.
  rationale: Die griechischen Vokative und die Verben in der zweiten Person tragen die rhetorische Personifikation. Sie sollte nicht zu einer bloßen abstrakten Aufzählung abgeflacht werden.
- issue: Bedeutungsumfang von νομοθεσία
  choice: „Gesetzgebung“
  alternative: „Gesetz“ oder „Gabe des Gesetzes“
  rationale: „Gesetzgebung“ bildet das griechische Substantiv formal ab und lässt offen, ob der Vorgang der Gesetzesgabe, die gesetzliche Ordnung oder das gegebene Gesetz im Vordergrund steht.
translation_notes:
  register: Gehobene, aber gegenwärtige Standardsprache. Die wiederholte Anrede mit „du“ verdeutlicht die griechischen Vokative und erhält den feierlichen, personifizierenden Charakter. „Kenntnis der Gesetzgebung“ ist bewusst formal, um die Breite von νομοθεσία nicht einzuengen.
