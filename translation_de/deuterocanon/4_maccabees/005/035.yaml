  source_fidelity: Die direkte personifizierende Anrede und die Verneinungen des künftigen Handelns sind zutreffend wiedergegeben. „Kenntnis der Gesetzgebung“ ist jedoch für νομοθεσίας ἐπιστήμη weniger idiomatisch und lenkt im Deutschen auf den Vorgang staatlicher Gesetzgebung; im jüdischen Kontext bezeichnet der Ausdruck die Kenntnis des Gesetzes bzw. der Gesetzesgabe. Außerdem verlangt die koordinierte Anrede von Priestertum und Gesetzeskenntnis im Deutschen sinnvollerweise das Pluralpronomen „euch“, auch wenn das Griechische hier σε im Singular hat.
  naturalness: Der erste Satzteil ist gehoben und verständlich. Die Abfolge „dich nicht verleugnen, du ehrwürdiges Priestertum und du Kenntnis“ ist im Deutschen syntaktisch und stilistisch holprig. Eine getrennte zweite Anrede mit „euch“ macht die rhetorische Personifikation klar und ist natürliches modernes Deutsch.
  terminology: „Philosophische Vernunft“, „ehrwürdiges Priestertum“ und „verleugnen“ sind tragfähige Wiedergaben. „Kenntnis des Gesetzes“ gibt νομοθεσία in diesem Kontext idiomatisch wieder, ohne eine konkrete konfessionelle Auslegung einzutragen. Die Fußnote kann die weiter gefasste Alternative „Gesetzgebung“ bzw. „Gesetzesgabe“ transparent halten.
