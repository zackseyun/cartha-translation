- from: Auch dich, philosophische Vernunft, werde ich nicht beschämen[a] und dich nicht verleugnen[b], du ehrwürdiges Priestertum und du Kenntnis der Gesetzgebung.
  to: Auch dich, philosophische Vernunft, werde ich nicht beschämen[a]; auch euch, ehrwürdiges Priestertum und Kenntnis des Gesetzes, werde ich nicht verleugnen[b].
  rationale: Die Revision ersetzt die im Deutschen missverständliche und unidiomatische „Kenntnis der Gesetzgebung“ durch „Kenntnis des Gesetzes“ und passt das Pronomen der verbundenen zweiten Anrede an deutsches Sprachgefühl an. Die personifizierte Anrede, der feierliche Registerton und die semantische Stärke von ἐξαρνέομαι bleiben erhalten. Die Fußnoten dokumentieren weiterhin die relevanten lexikalischen Spielräume.
