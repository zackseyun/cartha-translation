base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/022.yaml
  text: But you mock our philosophy[a], as though we did not live in it with blessedness.
translation:
  language: de
  text: Doch du verspottest unsere Philosophie[a], als würden wir nicht mit vernünftigem Urteil nach ihr leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder freier: »Lebensweisheit«. Mit »Philosophie« ist hier eine von Vernunft und Frömmigkeit bestimmte Lebensführung gemeint.'
    reason: Der griechische Begriff bezeichnet im Buch nicht nur eine Gedankenlehre, sondern zugleich eine eingeübte Lebensweise.
lexical_decisions:
- source_word: χλευάζεις
  choice: du verspottest
  rationale: Das Verb bezeichnet spöttische Herabsetzung. »Verspotten« gibt den direkten Vorwurf würdig und deutlich wieder.
- source_word: φιλοσοφίαν
  choice: Philosophie
  rationale: Der Verfasser bezeichnet die jüdische, von Vernunft und Frömmigkeit geprägte Lebensführung bewusst als Philosophie. Der griechische Ausdruck bleibt daher erhalten und wird nicht durch eine religiöse Deutung ersetzt.
- source_word: ὥσπερ
  choice: als würden
  rationale: Die Wendung leitet hier eine vom Sprecher zurückgewiesene Unterstellung ein; diese Funktion wird im Deutschen idiomatisch mit »als würden« ausgedrückt.
- source_word: εὐλογιστίας
  choice: aus vernünftiger Überlegung
  rationale: Das seltene Substantiv hängt mit gutem beziehungsweise richtigem Überlegen zusammen, nicht mit εὐλογία im Sinn von »Segen«. Im Zusammenhang des Buches liegt daher vernünftige, wohlbedachte Erwägung näher als »Glückseligkeit« oder »guter Ruf«.
- source_word: ἐν αὐτῇ βιούντων
  choice: nach ihr leben
  rationale: Wörtlich steht »in ihr leben«. Gemeint ist, das Leben innerhalb dieser Philosophie beziehungsweise nach ihren Grundsätzen zu führen; »nach ihr leben« ist dafür natürliches Deutsch.
theological_decisions:
- issue: Bedeutung von φιλοσοφία in 4 Makkabäer
  choice: »Philosophie« im Haupttext beibehalten
  alternative: »Lebensweise« oder »Lehre«
  rationale: So bleibt die bewusste philosophische Darstellung jüdischer Frömmigkeit und vernünftiger Lebensführung erhalten, ohne sie konfessionell enger zu bestimmen.
- issue: Bedeutung von εὐλογιστίας
  choice: »aus vernünftiger Überlegung«
  alternative: »in Glückseligkeit« oder »in gutem Ansehen«
  rationale: Die Wortbildung und der Zusammenhang mit der leitenden Rolle der Vernunft in 4 Makkabäer sprechen für gutes, vernünftiges Überlegen. Eine Ableitung von »segnen« würde die ähnlich klingende, aber andere Wortfamilie εὐλογία eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der direkte Vorwurf bleibt erhalten. Die etwas abstrakte Ausdrucksweise entspricht der philosophischen Argumentation des Buches; »nach ihr leben« vermeidet zugleich das im Deutschen unnatürliche »in ihr leben«.
