  text: For to break the law in small matters and in great matters is equivalent[a].
translation:
  language: de
  text: Denn das Gesetz in kleinen wie in großen Dingen zu übertreten, ist gleich schwerwiegend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn das Gesetz in kleinen wie in großen Dingen zu übertreten, wiegt gleich schwer.“'
    reason: Lexikalische Alternative für ἰσοδύναμον; sie hebt die Bedeutung „gleich an Kraft oder Gewicht“ hervor.
lexical_decisions:
- source_word: παρανομεῖν
  choice: das Gesetz zu übertreten
  rationale: Das Verb bezeichnet ein Handeln gegen das Gesetz. „Das Gesetz übertreten“ ist im Deutschen klar, würdevoll und bewahrt den rechtlichen Sinn.
- source_word: ἐν μικροῖς καὶ ἐν μεγάλοις
  choice: in kleinen wie in großen Dingen
  rationale: Die substantivierten Neutra bezeichnen kleinere und größere Angelegenheiten. Die Formulierung wahrt den knappen Gegensatz und klingt natürlich.
- source_word: ἰσοδύναμόν
  choice: gleichbedeutend
  rationale: Das Adjektiv bezeichnet Gleichheit an Kraft, Gewicht oder Geltung. „Gleichbedeutend“ gibt die starke Gleichsetzung wieder, ohne gleiche Folgen oder Strafen ausdrücklich zu behaupten.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt die begründende Verknüpfung mit dem vorausgehenden Gedankengang.
theological_decisions:
- issue: Moralische Gleichsetzung kleinerer und größerer Gesetzesübertretungen
  choice: Die Übertretung des Gesetzes in kleinen wie in großen Dingen wird als gleichbedeutend bezeichnet.
  alternative: Jede Übertretung gilt als Gesetzesbruch, ohne dass damit in jeder Hinsicht die gleiche Schwere behauptet wird.
  rationale: ἰσοδύναμόν ἐστιν formuliert eine starke Gleichsetzung. Die Übersetzung lässt jedoch offen, ob diese auch identische Folgen oder Strafen einschließt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die parallele Wendung „in kleinen wie in großen Dingen“ bildet die knappe griechische Antithese ab; die Fußnote erhält die semantische Spannweite von ἰσοδύναμόν.
