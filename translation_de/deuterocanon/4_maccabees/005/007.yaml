    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί γὰρ
  choice: Denn warum
  rationale: Bewahrt sowohl die direkte Frage als auch die begründende beziehungsweise anknüpfende Funktion von γάρ.
- source_word: τῆς φύσεως
  choice: die Natur
  rationale: Gibt den griechischen Ausdruck direkt und im Deutschen idiomatisch wieder, ohne ihn unnötig als Schöpfungsordnung oder natürliche Beschaffenheit auszudeuten.
- source_word: κεχαρισμένης
  choice: beschert hat
  rationale: Das Perfektpartizip bezeichnet hier ein gewährtes oder geschenktes Gut. „Beschert hat“ erhält diesen Aspekt des Gewährens, ohne ausdrücklich theologische Gnadensprache einzuführen.
- source_word: καλλίστην
  choice: überaus köstlich
  rationale: Der Superlativ von καλός bezeichnet im Zusammenhang mit Speise höchste Güte oder Annehmlichkeit. „Überaus köstlich“ wirkt im Deutschen natürlicher als „am vortrefflichsten“ und passt zur rhetorischen Verlockung.
- source_word: τὴν τοῦδε τοῦ ζῴου σαρκοφαγίαν
  choice: den Verzehr des Fleisches dieses Tieres
  rationale: Gibt σαρκοφαγία konkret und idiomatisch als Fleischverzehr wieder und bewahrt den ausdrücklichen Bezug auf dieses Tier.
- source_word: βδελύττεις
  choice: verabscheust du
  rationale: Drückt die starke Abneigung und den Ekel des griechischen Verbs in würdigem, gegenwärtigem Deutsch aus.
