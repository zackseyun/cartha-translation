  yaml_path: translation/deuterocanon/4_maccabees/005/007.yaml
  text: For why do you loathe the eating of the flesh of this animal[a], though nature has graciously made it most excellent?
translation:
  language: de
  text: Denn warum verabscheust du den Fleischverzehr dieses Tieres[a], obwohl die Natur ihn zu etwas überaus Köstlichem gemacht hat?
  philosophy: optimal-equivalence
