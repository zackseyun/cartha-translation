  source_fidelity: 'Die Frage, die anknüpfende Partikel γάρ, die starke Abscheu und der Bezug auf den Fleischverzehr dieses bestimmten Tieres sind zutreffend erfasst. Die Wendung „die Natur ihn als überaus köstlich beschert hat“ ist jedoch im Deutschen semantisch und kollokativ missglückt: Einen „Verzehr“ kann die Natur nicht sinnvoll „köstlich bescheren“. Die Revision gibt die wertende, als Gabe bzw. Hervorbringung der Natur verstandene Aussage von κεχαρισμένης καλλίστην idiomatisch wieder.'
  naturalness: „Denn warum“ und „verabscheust du“ sind natürliche, würdige Standardsprache. Die überarbeitete Prädikation „zu etwas überaus Köstlichem gemacht“ ist verständlich und bewahrt die rhetorisch werbende Behauptung des Sprechers, ohne sie zu bestätigen.
  terminology: „Fleischverzehr“ ist eine präzise und idiomatische Wiedergabe von σαρκοφαγία. Die Fußnote mit der wörtlicheren Alternative „das Fleischessen“ bleibt sachgerecht. „Natur“ ist hier neutral und entspricht φύσις.
