base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/006.yaml
  text: Before I begin the tortures against you[a], old man, I would advise you of this, so that by tasting the pork you might save yourself. For I respect your age and your gray hair, though after having had it for so long a time[b], you do not seem to me to philosophize by practicing the religion of the Jews.
translation:
  language: de
  text: Bevor ich mit den Folterungen gegen dich beginne, alter Mann, würde ich dir raten, vom Schweinefleisch zu kosten, damit du dein Leben retten könntest.[a] Denn ich achte dein Alter und dein graues Haar. Obwohl du schon so lange graues Haar trägst, scheinst du mir nicht zu philosophieren, indem du die Religion der Juden praktizierst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „damit du, nachdem du vom Schweinefleisch gekostet hast, dich rettest.“ Gemeint ist die Rettung des Lebens vor der drohenden Folter und Hinrichtung.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb bedeutet „philosophieren“. Es gehört zur wiederkehrenden Sprache dieses Buches über Philosophie und Vernunft.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἄρξασθαι τῶν κατὰ σοῦ βασάνων
  choice: Bevor ich mit den Folterungen gegen dich beginne
  rationale: Die temporale Konstruktion mit πρίν wird im Deutschen natürlich als Nebensatz wiedergegeben. „Folterungen“ bezeichnet hier konkrete, gegen den Angeredeten gerichtete Zwangsmaßnahmen.
- source_word: ὦ πρεσβῦτα
  choice: alter Mann
  rationale: πρεσβύτης bezeichnet hier einen betagten Mann, nicht den Träger eines Amtes. Die direkte und im Kontext herablassende Anrede bleibt erhalten.
- source_word: συμβουλεύσαιμʼ ἂν σοι ταῦτα
  choice: würde ich dir Folgendes raten
  rationale: Der Optativ mit ἄν formuliert den Rat zurückhaltend beziehungsweise rhetorisch höflich; der deutsche Konditional bildet dies gut ab.
- source_word: ὅπως ἀπογευσάμενος τῶν ὑείων σώζοιο
  choice: Koste vom Schweinefleisch, damit du dein Leben retten kannst
  rationale: ὕεια bezeichnet Schweinefleisch; ἀπογεύομαι meint, davon zu kosten. σώζοιο bezieht sich im Zusammenhang auf die Bewahrung vor Folter und Tod, weshalb „dein Leben retten“ die körperliche Bedeutung verdeutlicht.
- source_word: αἰδοῦμαι γάρ σου τὴν ἡλικίαν καὶ τὴν πολιάν
  choice: Denn ich achte dein Alter und dein graues Haar
  rationale: αἰδέομαι drückt hier Achtung oder ehrfürchtige Rücksicht aus. πολιά bezeichnet ergrautes beziehungsweise weißes Haar als Zeichen hohen Alters.
- source_word: ἣν μετὰ τοσοῦτον ἔχων χρόνον
  choice: Obwohl du schon so lange graues Haar hast
  rationale: Das feminine Relativpronomen bezieht sich am natürlichsten auf πολιάν. Die etwas auffällige Wiederaufnahme des grauen Haares bewahrt diesen Bezug und den ausdrücklichen Zeitgedanken von χρόνον.
- source_word: οὔ μοι δοκεῖς φιλοσοφεῖν
  choice: scheinst du mir nicht zu philosophieren
  rationale: „Philosophieren“ erhält die für 4 Makkabäer zentrale Begriffswelt von Vernunft, Tugend und Philosophie, statt sie allgemein zu „weise handeln“ abzuschwächen.
- source_word: τῇ Ἰουδαίων χρωμένῃ θρησκείᾳ
  choice: wenn du die Religion der Juden praktizierst
  rationale: χράομαι mit dem Dativ kann den Gebrauch oder die Ausübung bezeichnen; θρησκεία meint religiöse Praxis beziehungsweise Religion. Die Formulierung ist in modernem Deutsch verständlich und lässt den polemischen Zusammenhang erkennen.
theological_decisions:
- issue: Bedeutung von σώζοιο
  choice: körperliche Rettung des Lebens vor Folter und Tod
  alternative: das allgemeinere „gerettet werden“ ohne nähere Bestimmung
  rationale: Der Herrscher fordert Eleasar auf, verbotene Speise zu kosten, um der unmittelbar drohenden Bestrafung zu entgehen. Eine geistliche Heilsbedeutung wäre hier unbegründet.
- issue: Wiedergabe von φιλοσοφεῖν
  choice: die ausdrückliche Sprache des Philosophierens beibehalten
  alternative: „vernünftig sein“ oder „weise handeln“
  rationale: Das Werk beschreibt jüdische Gesetzestreue wiederholt im begrifflichen Umfeld von Vernunft und Philosophie. Die wörtlich erkennbare Wortwahl erhält dieses Leitmotiv und auch die ironische Wertung des Sprechers.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt bewusst schroff. Schlüsselbegriffe der philosophischen Argumentation werden nicht verallgemeinert; zugleich wird die konkrete Bedeutung der angedrohten körperlichen Gewalt klar benannt.
