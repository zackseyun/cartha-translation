  text: 'And having taken the right to speak, he began to address the assembly as follows:'
translation:
  language: de
  text: 'Nachdem er die Erlaubnis zu sprechen erhalten hatte, begann er, sich folgendermaßen an die Versammelten zu wenden:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: erhalten hatte
  rationale: Das Aoristpartizip bezeichnet den vorausgehenden Umstand. In Verbindung mit ἐξουσίαν gibt „erhalten hatte“ natürlich wieder, dass ihm die Redemöglichkeit eingeräumt worden war.
- source_word: τοῦ λέγειν
  choice: zu sprechen
  rationale: Der substantivierte Infinitiv bestimmt den Bereich der ἐξουσία; im Deutschen ist „die Erlaubnis zu sprechen“ idiomatisch.
- source_word: ἐξουσίαν
  choice: die Erlaubnis
  rationale: Im Kontext des bevorstehenden öffentlichen Vortrags bezeichnet ἐξουσία die eingeräumte Befugnis beziehungsweise Erlaubnis zu reden, nicht notwendig eine amtliche Vollmacht.
- source_word: ἤρξατο
  choice: begann er
  rationale: Gibt den inchoativen Sinn von ἄρχομαι unmittelbar und in gehobenem, aber geläufigem Deutsch wieder.
- source_word: δημηγορεῖν
  choice: sich an die Versammelten zu wenden
  rationale: Das Verb bezeichnet eine öffentliche Ansprache vor einer versammelten Zuhörerschaft. Diese Wiedergabe erhält den öffentlichen Charakter, ohne eine ausdrücklich politische Volksversammlung vorauszusetzen.
- source_word: οὕτως
  choice: folgendermaßen
  rationale: Leitet idiomatisch den nun folgenden Wortlaut der Rede ein.
