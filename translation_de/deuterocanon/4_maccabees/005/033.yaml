  yaml_path: translation/deuterocanon/4_maccabees/005/033.yaml
  text: I will not pity my own old age so much that I would, by my own act, abolish the ancestral law.
translation:
  language: de
  text: Ich werde mein eigenes hohes Alter nicht so sehr bemitleiden, dass ich durch mein eigenes Handeln das Gesetz der Vorfahren außer Kraft setze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ οὕτως ... ὥστε
  choice: nicht so viel ..., dass
  rationale: 'Die Verbindung bezeichnet einen Grad mit der daraus folgenden Konsequenz: nicht in solchem Maß, dass. Die deutsche Formulierung bildet diesen Zusammenhang natürlich ab.'
- source_word: οἰκτειρήσω
  choice: werde ... Mitleid haben
  rationale: Das Verb bezeichnet Mitleid oder Erbarmen. „Mitleid haben“ wahrt den emotionalen Gehalt; „schonen“ würde bereits die praktische Folge in die Aussage hineinlesen.
- source_word: τὸ ἐμαυτοῦ γῆρας
  choice: mein eigenes Alter
  rationale: γῆρας bezeichnet hier das hohe beziehungsweise fortgeschrittene Alter; ἐμαυτοῦ hebt den Selbstbezug hervor. „Mein eigenes Alter“ erhält diese Betonung in verständlichem Deutsch.
- source_word: με διʼ ἐμαυτοῦ
  choice: durch mein eigenes Handeln
  rationale: 'Die Wendung betont die persönliche Urheberschaft: Er selbst würde durch sein Tun die Folge herbeiführen. Die gewählte Formulierung ist natürlich und bewahrt den reflexiven Nachdruck.'
- source_word: τὸν πάτριον νόμον
  choice: das von den Vorfahren überlieferte Gesetz
  rationale: πάτριος bezeichnet das von den Vätern beziehungsweise Vorfahren Herkommende. Die Formulierung macht sowohl den angestammten als auch den überlieferten Charakter des Gesetzes deutlich.
- source_word: καταλῦσαι
  choice: außer Kraft setze
  rationale: καταλύω kann auflösen, beseitigen oder unwirksam machen bedeuten. Im Kontext geht es darum, durch das eigene Verhalten die Geltung des Gesetzes preiszugeben; „außer Kraft setzen“ gibt dies wieder, ohne physische Zerstörung anzudeuten.
theological_decisions:
- issue: Wiedergabe von πάτριον νόμον im jüdischen Märtyrerkontext
  choice: das von den Vorfahren überlieferte Gesetz
  alternative: das väterliche Gesetz; das Gesetz der Väter; das angestammte Gesetz
  rationale: Die Wendung bezeichnet das ererbte jüdische Gesetz und seine Überlieferung. Die gewählte Fassung bewahrt den geschichtlich-gemeinschaftlichen Bezug, ohne eine spätere konfessionelle Terminologie einzutragen.
- issue: Reichweite von καταλῦσαι
  choice: außer Kraft setze
  alternative: abschaffe; aufhebe; zunichtemache
  rationale: Der Sprecher behauptet nicht notwendig, das Gesetz allgemein und rechtlich abschaffen zu können. Gemeint ist, dass er durch sein eigenes Handeln dessen Geltung verleugnen oder untergraben würde. Die Formulierung erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt die emphatische Wiederholung des Selbstbezugs („mein eigenes“, „mein eigenes Handeln“) und den Grad-Folge-Zusammenhang des griechischen οὐχ οὕτως ... ὥστε.
