  terminology: „Gottlose“ und „Frömmigkeit“ erhalten den religiös-ethischen Kontrast von ἀσεβῶν und εὐσέβεια. „Überlegungen“ bleibt für λογισμοί offen genug; die Fußnote erläutert dessen fachsprachliches Gewicht im Buch, ohne eine dogmatische Deutung festzulegen.
