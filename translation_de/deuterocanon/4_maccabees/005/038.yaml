base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/038.yaml
  text: For you may indeed tyrannize over the ungodly[a], but over my reasonings concerning godliness you will rule neither by words nor by deeds.
translation:
  language: de
  text: Denn über Gottlose wirst du zwar tyrannisch herrschen; über meine Überlegungen über die Frömmigkeit aber wirst du weder mit Worten noch durch Taten Herr werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβῶν
  choice: über Gottlose
  rationale: Der substantivierte Genitiv Plural bezeichnet die Menschen, über die der Tyrann Gewalt ausübt. „Gottlose“ bewahrt den religiös-ethischen Gegensatz zu εὐσέβεια.
- source_word: τυραννήσεις
  choice: magst du zwar als Tyrann herrschen
  rationale: Die Form bezeichnet tyrannische, gewaltsame Herrschaft und steht im einräumenden μὲν-δέ-Gegensatz. Die Wiedergabe erhält sowohl den Wortstamm als auch die rhetorische Struktur.
- source_word: τῶν ... ἐμῶν ... λογισμῶν
  choice: über meine vernünftigen Überlegungen
  rationale: λογισμός ist in 4 Makkabäer ein Leitbegriff für vernünftiges sittliches Erwägen. „Vernünftige Überlegungen“ macht diesen Sinn in natürlichem Deutsch sichtbar, ohne ihn auf bloße Gedanken oder starre Überzeugungen zu verengen.
- source_word: περὶ τῆς εὐσεβείας
  choice: zur Gottesfurcht
  rationale: εὐσέβεια bezeichnet hier die ehrfürchtige, gesetzestreue Hingabe an Gott. „Gottesfurcht“ ist verständlich und wahrt die ausdrücklich religiöse Dimension.
- source_word: δεσπόσεις
  choice: wirst du ... Herr werden
  rationale: δεσπόζω meint, Herrschaft oder Verfügungsgewalt über etwas zu erlangen. Die deutsche Wendung bildet den Kontrast zwischen äußerer Tyrannei und der nicht erreichbaren Herrschaft über das innere Urteil ab.
- source_word: οὔτε λόγοις ... οὔτε δι᾽ ἔργων
  choice: weder mit Worten noch durch Taten
  rationale: Die paarige Verneinung und der Gegensatz von sprachlicher Einflussnahme und tätigem Zwang bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des religiös-ethischen Gegensatzes ἀσεβής/εὐσέβεια
  choice: Gottlose / Gottesfurcht
  alternative: Frevler / Frömmigkeit
  rationale: Die gewählte Wortwahl macht den Bezug auf Gott deutlich und bleibt für heutige Leser verständlich. Sie legt nicht fest, ob εὐσέβεια hier primär innere Haltung, gelebte Frömmigkeit oder Gesetzestreue bezeichnet.
- issue: Verhältnis von Vernunft und Frömmigkeit
  choice: vernünftige Überlegungen zur Gottesfurcht
  alternative: vernünftige Urteile über die Frömmigkeit
  rationale: Die Formulierung wahrt λογισμός als tätiges sittliches Erwägen und gibt περὶ offen als thematische Beziehung wieder, ohne Vernunft und Gottesverehrung gegeneinander auszuspielen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einräumende Gegensatz μὲν … δέ wird mit „zwar … doch“ wiedergegeben. „Als Tyrann herrschen“ und „Herr werden“ bewahren den Kontrast der beiden griechischen Herrschaftsverben, ohne sie gleichzusetzen.
