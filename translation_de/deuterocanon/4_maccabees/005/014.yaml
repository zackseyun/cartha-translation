  text: When the tyrant was urging him in this way toward the lawless eating of flesh, Eleazar asked to speak.
translation:
  language: de
  text: Als der Tyrann ihn auf diese Weise zum gesetzwidrigen Fleischverzehr drängte, bat Eleasar um das Wort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκθεσμον
  choice: gesetzwidrig
  rationale: Das Wort bezeichnet etwas, das außerhalb bzw. entgegen dem Gesetz steht. „Gesetzwidrig“ bewahrt hier den ausdrücklichen Bezug auf das jüdische Gesetz, ohne die Aussage zu verallgemeinern.
- source_word: σαρκοφαγίαν
  choice: Fleischverzehr
  rationale: Die sachliche Wiedergabe bezeichnet das Essen von Fleisch; im Zusammenhang ist das verbotene Fleisch gemeint, ohne dass der griechische Ausdruck selbst die Tierart nennt.
- source_word: λόγον ᾔτησεν
  choice: bat um das Wort
  rationale: Die idiomatische deutsche Wendung gibt wieder, dass Eleasar darum bat, sprechen zu dürfen.
- source_word: ἐποτρύνοντος
  choice: drängte
  rationale: Das Verb bezeichnet nachdrückliches Antreiben oder Drängen und passt zur Zwangssituation.
theological_decisions:
- issue: Bezug des Fleischverzehrs auf das Gesetz
  choice: gesetzwidrigen Fleischverzehr
  alternative: gesetzlosen Fleischverzehr
  rationale: „Gesetzwidrig“ macht deutlich, dass der Verzehr gegen das maßgebliche Gesetz verstößt, ohne „gesetzlos“ als mögliche Charakterisierung einer Person oder eines allgemeinen Zustands missverständlich werden zu lassen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Der Satzbau folgt dem griechischen zeitlichen Begleitumstand natürlich; „um das Wort bitten“ ist eine geläufige formelle Redewendung.
