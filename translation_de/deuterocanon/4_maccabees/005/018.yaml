base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/018.yaml
  text: And yet[a], even if our law were not truly divine, as you suppose, though we think it to be divine, even so you would have no right to nullify our honor in matters of piety.
translation:
  language: de
  text: 'Und doch: Selbst wenn unser Gesetz in Wahrheit nicht göttlich wäre, wie du annimmst – wir hingegen halten es für göttlich –, stünde es dir selbst dann nicht zu, unser auf Gottesfurcht beruhendes Ansehen[a] zunichtezumachen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseren Ruf der Frömmigkeit“. Der griechische Ausdruck kann das ehrenvolle Ansehen oder den guten Ruf bezeichnen, der auf ehrfürchtiger Hingabe an Gott beruht.'
    reason: Lexikalische Alternative für τὴν ἐπὶ τῇ εὐσεβείᾳ δόξαν.
lexical_decisions:
- source_word: καίτοι
  choice: Und doch
  rationale: Kennzeichnet die rhetorisch zugespitzte Einräumung und wahrt sowohl den adversativen als auch den konzessiven Sinn.
- source_word: κατὰ ἀλήθειαν
  choice: in Wahrheit
  rationale: Gibt die adverbiale Wendung im Sinn von „tatsächlich“ idiomatisch und würdig wieder.
- source_word: ὁ νόμος ἡμῶν
  choice: unser Gesetz
  rationale: Bezeichnet das jüdische Gesetz beziehungsweise die Tora; die schlichte Form bleibt nahe am griechischen Ausdruck.
- source_word: θεῖος
  choice: göttlich
  rationale: Entspricht dem Adjektiv unmittelbar und erweitert die Aussage nicht vorschnell zu „von Gott gegeben“.
- source_word: ὑπολαμβάνεις
  choice: wie du annimmst
  rationale: Bringt das Urteil des Angesprochenen und den leicht distanzierenden Ton der Entgegnung zum Ausdruck.
- source_word: νομίζομεν
  choice: wir hingegen halten es für
  rationale: „Für etwas halten“ bildet die wertende Überzeugung ab; „hingegen“ verdeutlicht den im Satz angelegten Gegensatz.
- source_word: οὐδὲ οὕτως ἔχων
  choice: selbst dann
  rationale: Gibt den Rückbezug auf den eingeräumten hypothetischen Fall in natürlichem Deutsch wieder.
- source_word: ἦν ... ἀκυρῶσαι
  choice: stünde es dir ... nicht zu, ... zunichtezumachen
  rationale: Die unpersönliche Konstruktion bezeichnet fehlende Berechtigung oder Angemessenheit; „zunichtemachen“ bewahrt die Kraft von ἀκυρόω.
- source_word: τὴν ἐπὶ τῇ εὐσεβείᾳ δόξαν
  choice: unser auf Gottesfurcht beruhendes Ansehen
  rationale: δόξα meint hier ehrenvolles Ansehen oder guten Ruf, während εὐσέβεια die ehrfürchtige Hinwendung zu Gott bezeichnet. Die Formulierung wahrt die soziale und religiöse Dimension.
theological_decisions:
- issue: Status des Gesetzes als θεῖος
  choice: göttlich
  alternative: von Gott gegeben
  rationale: Der Wortlaut behauptet in der rhetorischen Einräumung die Göttlichkeit des Gesetzes, formuliert aber nicht ausdrücklich dessen Art der Herkunft. Die knappe Wiedergabe erhält diese Begrenzung.
- issue: Bedeutung von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ bezeichnet hier ehrfürchtige Hingabe und religiöse Treue, nicht bloße Angst. Die Fußnote hält die ebenfalls mögliche, traditionellere Wiedergabe „Frömmigkeit“ offen.
- issue: Sinn von δόξα im Zusammenhang mit εὐσέβεια
  choice: Ansehen
  alternative: Ehre
  rationale: Im Kontext kann δόξα den ehrenvollen Ruf beziehungsweise die gesellschaftliche Anerkennung bezeichnen. „Ansehen“ vermeidet eine überhöhte Wiedergabe als „Herrlichkeit“, ohne den Ehrenaspekt auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich fasst den eingeschobenen Gegensatz übersichtlich ein. Die direkte Anrede „du“ und die rhetorische Spannung der hypothetischen Einräumung bleiben erhalten.
