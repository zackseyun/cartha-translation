  text: I will not deny you[a], O law-trained discipline, nor will I spare you[b], beloved self-control.
translation:
  language: de
  text: Ich werde dir nicht untreu werden[a], du Gesetz, du Erzieher[b], und auch dich werde ich nicht schonen[c], geliebte Selbstbeherrschung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich werde mich dir gegenüber nicht als falsch erweisen“ oder „Ich werde dich nicht verraten.“ Das griechische Verb kann außer „lügen“ auch Untreue gegenüber einer Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich stehen zwei Anreden nebeneinander: „Erzieher, Gesetz“. Sie bezeichnen hier appositionell das personifizierte Gesetz als erziehende und disziplinierende Macht.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „ich werde dich nicht schonen“. Der im Zusammenhang auffällige Ausdruck kann hier auch das entschlossene Festhalten an der Selbstbeherrschung bezeichnen, ohne sich dabei zurückzunehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύσομαί σε
  choice: ich werde dir nicht untreu werden
  rationale: ψεύδομαι kann mit einer Person als Gegenüber bedeuten, sich ihr gegenüber als falsch oder treulos zu erweisen. „Dir nicht untreu werden“ gibt das Treueversprechen im Zusammenhang natürlich wieder, ohne es auf bloßes Lügen zu verengen.
- source_word: παιδευτὰ νόμε
  choice: du erziehendes Gesetz
  rationale: Beide Wörter stehen im Vokativ. παιδευτής bezeichnet einen Erzieher oder Zuchtmeister; zusammen mit dem personifizierten νόμος wird das Gesetz als erziehende Macht angeredet. Die adjektivische deutsche Fassung bewahrt diese Beziehung knapp und verständlich.
- source_word: φείσομαί σε
  choice: dich werde ich nicht schonen
  rationale: φείδομαι bedeutet grundsätzlich „schonen“ oder „sich zurückhalten“. Die bewusst ungewöhnliche Aussage über die personifizierte Selbstbeherrschung bleibt erhalten, statt sie durch eine stärker deutende Wiedergabe aufzulösen.
- source_word: φίλη ἐγκράτεια
  choice: geliebte Selbstbeherrschung
  rationale: φίλη drückt in der direkten Anrede Zuneigung aus; ἐγκράτεια bezeichnet die Herrschaft über Begierden und Impulse. „Geliebte Selbstbeherrschung“ erhält den feierlichen, personifizierenden Ton.
theological_decisions:
- issue: Personifizierung des Gesetzes und der Selbstbeherrschung
  choice: Die direkte Anrede beider Größen bleibt erhalten.
  alternative: Die Aussage als unpersönliche Verpflichtung gegenüber Gesetz und Selbstbeherrschung wiedergeben.
  rationale: Die griechischen Vokative gestalten Gesetz und Selbstbeherrschung ausdrücklich als angeredete Größen. Diese literarische und ethische Spannung darf nicht eingeebnet werden.
- issue: Mehrdeutigkeit von φείσομαί σε
  choice: Wörtlich-nahe Wiedergabe „dich nicht schonen“ mit Fußnote.
  alternative: 'Deutend wiedergeben: „mich bei dir nicht zurückhalten“ oder „nicht auf dich verzichten“.'
  rationale: Der griechische Ausdruck ist im Zusammenhang auffällig. Die Übersetzung bewahrt diese Auffälligkeit und nennt mögliche Sinnrichtungen in der Fußnote, ohne eine davon zum eindeutigen Textsinn zu erklären.
translation_notes:
  register: Gehobene, aber gegenwärtige Standardsprache. Die rhetorische Anrede und die Personifizierung bleiben sichtbar; altertümliche Interjektionen wie „o“ werden vermieden. Die Wiederholung von „dich“ verdeutlicht im Deutschen die parallele Struktur der beiden Anreden.
