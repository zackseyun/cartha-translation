translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Angaben zu Eleasar bleibt erhalten, wird aber durch Doppelpunkt und Satzteilung lesbarer gemacht. Das ungewöhnliche Bild „Herde“ sowie das grammatische Passiv im Schlusssatz werden bewusst bewahrt.
