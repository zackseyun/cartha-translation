revisions:
- from: 'Als aber viele gewaltsam ergriffen worden waren, wurde als Erster aus der Herde[a] ein Hebräer namens Eleasar vorgeführt: von Herkunft Priester, in der Kenntnis des Gesetzes bewandert[b], hochbetagt und wegen seines Alters vielen aus dem Umfeld des Tyrannen bekannt. Man öffnete ihm den Mund.'
  to: Als aber viele gewaltsam ergriffen worden waren, wurde einem Hebräer namens Eleasar, dem Ersten aus der Herde[a], von priesterlicher Abstammung, im Gesetz kundig, hochbetagt und wegen seines Alters vielen aus dem Umfeld des Tyrannen bekannt, der Mund geöffnet.
  rationale: Die Revision entfernt die unbelegte Ergänzung „vorgeführt“, stellt das Passiv des griechischen Schlusssatzes mit „wurde ... der Mund geöffnet“ wieder her und ersetzt die unidiomatische Herkunftsformel durch „von priesterlicher Abstammung“. Die Fußnote b wird beibehalten, aber ihr Anker muss im Text stehen.
