  text: But when many had been seized, one man, first from the flock, a Hebrew named Eleazar, a priest by birth, trained in the law in knowledge, advanced in age, and known to many around the tyrant because of his age, opened his mouth.
translation:
  language: de
  text: Als aber viele gewaltsam ergriffen worden waren, wurde einem Hebräer namens Eleasar, dem Ersten aus der Herde[a], von priesterlicher Abstammung, im Gesetz kundig, hochbetagt und wegen seines Alters vielen aus dem Umfeld des Tyrannen bekannt, der Mund geöffnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Gruppe“. Wörtlich steht im Griechischen „aus der Herde“; das Wort wird hier bildlich für die Gemeinschaft der Hebräer gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναρπασθέντων
  choice: gewaltsam ergriffen worden waren
  rationale: Das Verb bezeichnet ein gewaltsames Ergreifen oder Wegraffen. Die Formulierung bewahrt den Zwangsaspekt, ohne die konkrete Art der Festnahme näher festzulegen.
- source_word: ἀγέλης
  choice: Herde
  rationale: Das griechische Wort bedeutet wörtlich „Herde“ und wird hier bildlich für die Gruppe der Hebräer gebraucht. Die Übersetzung erhält dieses auffällige Bild.
- source_word: Ἑβραῖος
  choice: ein Hebräer
  rationale: Dies entspricht der ausdrücklichen ethnischen Bezeichnung im griechischen Text; „Jude“ oder „Israelit“ wären interpretierende Angleichungen.
- source_word: τὸ γένος ἱερεύς
  choice: von Herkunft Priester
  rationale: Die Wendung beschreibt Eleasars priesterliche Abstammung beziehungsweise Herkunft, nicht lediglich die Ausübung eines Amtes.
- source_word: τὴν ἐπιστήμην νομικός
  choice: in der Kenntnis des Gesetzes bewandert
  rationale: ἐπιστήμη bezeichnet Kenntnis oder Sachkunde, νομικός die Beziehung zum Gesetz. Die Wiedergabe vermeidet die moderne berufliche Bedeutung von „Jurist“ und bewahrt die appositionelle Struktur.
- source_word: τὴν ἡλικίαν προήκων
  choice: hochbetagt
  rationale: Die Wendung bezeichnet ein weit fortgeschrittenes Lebensalter. „Hochbetagt“ ist knapp, würdevoll und im heutigen Deutsch verständlich.
- source_word: πολλοῖς τῶν περὶ τὸν τύραννον
  choice: vielen aus dem Umfeld des Tyrannen
  rationale: Gemeint sind zahlreiche Angehörige des Kreises oder Gefolges um den Tyrannen. „Umfeld“ gibt dies natürlich wieder.
- source_word: ἠνῴχετο τὸ στόμιον αὐτοῦ
  choice: Man öffnete ihm den Mund
  rationale: Die passive Verbform spricht am ehesten von einer an Eleasar vorgenommenen Handlung. Da der Kontext vermutlich ein erzwungenes Öffnen seines Mundes beschreibt, wird das Passiv nicht zum idiomatischen „er begann zu sprechen“ umgedeutet.
