  yaml_path: translation/deuterocanon/4_maccabees/005/036.yaml
  text: Nor will you defile my mouth, made venerable by old age, nor the years of a law-abiding life.
translation:
  language: de
  text: Du wirst weder meinen durch das hohe Alter ehrwürdig gewordenen Mund noch die Jahre eines gesetzestreuen Lebens beflecken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιανεῖς
  choice: beflecken
  rationale: Gibt die kultisch und moralisch belastete Bedeutung von μιαίνω wieder und passt hier zur erzwungenen Übertretung.
- source_word: τὸ σεμνὸν γήρως στόμα
  choice: meinen durch das hohe Alter ehrwürdig gewordenen Mund
  rationale: Bewahrt die Beziehung von σεμνόν zu στόμα und versteht γήρως als Angabe dessen, wodurch der Mund ehrwürdig geworden ist.
- source_word: νομίμου βίου
  choice: eines gesetzestreuen Lebens
  rationale: νόμιμος bezeichnet hier ein Leben im Einklang mit dem Gesetz; „gesetzestreu“ ist im Deutschen natürlich und präzise.
- source_word: ἡλικίαν
  choice: die Jahre
  rationale: Im Zusammenhang des hohen Alters bezeichnet ἡλικία die Lebenszeit beziehungsweise die erreichten Jahre und nicht bloß ein abstraktes Lebensalter.
theological_decisions:
- issue: Bezug auf das Gesetz
  choice: gesetzestreu
  alternative: rechtmäßig
  rationale: Der Kontext von 4 Makkabäer betrifft Treue zum göttlichen Gesetz. „Gesetzestreu“ macht diesen Bezug sichtbar, ohne eine konfessionelle Auslegung hinzuzufügen.
- issue: Reichweite der Befleckung
  choice: Die beiden Akkusativglieder bleiben parallel unter „beflecken“.
  alternative: Beim zweiten Glied ein anderes Verb ergänzen, etwa „entwürdigen“.
  rationale: Die griechische Ellipse lässt μιανεῖς auch beim zweiten Glied mitverstehen; die parallele Wiedergabe bewahrt die rhetorische Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die feierliche Parallelstruktur des griechischen Satzes bleibt erhalten; „ebenso wenig“ gibt das zweite οὐδέ natürlich wieder.
