  text: For this[a], prepare the wheels, and blow the fire even more fiercely.
translation:
  language: de
  text: „Dazu mach die Räder bereit und blase das Feuer noch heftiger an.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: Daraufhin
  rationale: Die Wendung leitet idiomatisch die Reaktion auf das zuvor Gesagte ein; „Daraufhin“ gibt diese Diskursfunktion natürlich wieder.
- source_word: τροχοὺς
  choice: die Räder
  rationale: Das griechische Wort bezeichnet wörtlich Räder. Im Zusammenhang sind Folterräder gemeint, doch die Übersetzung bewahrt die konkrete Bezeichnung, ohne sie als „Folterbänke“ auszudeuten.
- source_word: εὐτρέπιζε
  choice: Macht ... bereit
  rationale: Der Imperativ verlangt, die Geräte einsatzbereit zu machen. Der deutsche Plural entspricht einer natürlichen Anweisung an die ausführenden Diener.
- source_word: τὸ πῦρ
  choice: das Feuer
  rationale: Direkte und bestimmte Wiedergabe des griechischen Ausdrucks.
- source_word: ἔκφυσα
  choice: blast ... an
  rationale: Das Verb beschreibt das Blasen auf ein Feuer, damit es stärker brennt; „das Feuer anblasen“ bewahrt dieses konkrete Bild.
- source_word: σφοδρότερον
  choice: noch heftiger
  rationale: Der Komparativ bezeichnet eine weitere Steigerung der Intensität und wird im Deutschen natürlich mit „noch heftiger“ wiedergegeben.
