  source_fidelity: Die griechischen Imperative εὐτρέπιζε und ἔκφυσα sind Singularformen. Die Pluralanrede „Macht … blast“ verändert daher die im Ausgangstext erkennbare Anredezahl. „Dazu“ gibt πρὸς ταῦτα als zweckbezogene Überleitung direkt wieder. Das eingefügte „befahl er“ ist im vorliegenden griechischen Wortlaut nicht ausgedrückt.
  naturalness: „Mach die Räder bereit und blase das Feuer noch heftiger an“ ist idiomatisches modernes Standarddeutsch und bewahrt den knappen, scharfen Befehlsstil.
  terminology: „Räder“ bildet τροχούς konkret ab, ohne die Foltervorrichtung über das ausdrücklich Genannte hinaus zu erklären. „Das Feuer … anblasen“ erhält das Bild von ἐκφυσάω; „noch heftiger“ gibt den Komparativ σφοδρότερον wieder.
