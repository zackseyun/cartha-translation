base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/003.yaml
  text: But if any should be unwilling to eat defiling food[b][a], let them be broken on the wheel and put to death.
translation:
  language: de
  text: Wenn aber einige nicht bereit wären, verunreinigende Speisen zu essen[a], sollten sie auf dem Rad gefoltert[b] und getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Essen befleckter Speisen unrein zu werden“. Das griechische Verb bezeichnet in einem einzigen Wort das Essen dessen, was verunreinigt; ein eigenes Objekt steht im Satz nicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf dem Rad gerädert“. Das griechische Wort bezeichnet eine Folter oder Bestrafung mithilfe eines Rades, legt die genaue Vorgehensweise jedoch nicht zweifelsfrei fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ τινες
  choice: Wenn aber einige
  rationale: Gibt die konditionale Wendung und den unbestimmten Plural wieder; „einige“ bewahrt gegenüber dem idiomatisch möglichen „jemand“ die Numerusform des Griechischen.
- source_word: μὴ θέλοιεν
  choice: nicht bereit wären
  rationale: Bewahrt den voluntativen Sinn von θέλω und passt natürlich zum griechischen Optativ in der Bedingung.
- source_word: μιεροφαγῆσαι
  choice: verunreinigende Speisen zu essen
  rationale: Das zusammengesetzte Verb bezeichnet das Essen von etwas kultisch oder moralisch Befleckendem. „Speisen“ macht das im Verb enthaltene Objekt im Deutschen verständlich, ohne es enger als „Fleisch“ zu bestimmen.
- source_word: τούτους
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor genannten Personen; „sie“ ist im Deutschen natürlich und eindeutig.
- source_word: τροχισθέντας
  choice: auf dem Rad gefoltert
  rationale: Die Form bezeichnet eine mit dem Rad vollzogene Folter oder Strafe. Diese Wiedergabe bleibt konkret, ohne eine bestimmte technische Ausführung wie das Rädern oder Brechen ausdrücklich festzulegen.
- source_word: ἀναιρεθῆναι
  choice: getötet werden
  rationale: Gibt die Tötungsbedeutung klar wieder und wahrt zusammen mit der Passivkonstruktion den amtlich-drohenden Ton.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem knappen Ton einer angeordneten Strafandrohung. Der Optativ wird durch „wären“ wiedergegeben; die anschließende Anordnung steht idiomatisch mit „sollten“. Die genaue Art der Radfolter bleibt im Haupttext bewusst allgemein.
