base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/024.yaml
  text: And it trains in righteousness[a], so that one may be fair in all matters of conduct, and it teaches piety[b], so that one may worship only the God who truly exists with due majesty.
translation:
  language: de
  text: Und sie erzieht zur Gerechtigkeit[a], sodass man in allen Bereichen des Handelns Gleichheit wahrt, und sie lehrt Gottesfurcht[b], sodass man allein den Gott, der wirklich ist, seiner Größe entsprechend verehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtschaffenheit“. Das griechische Wort kann sowohl sittliche Rechtschaffenheit als auch Gerechtigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet ehrfürchtige Hingabe an Gott; auch „Frömmigkeit“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Das deutsche „Gerechtigkeit“ deckt sowohl sittliche Rechtschaffenheit als auch gerechtes Handeln ab und passt besonders zum folgenden Gedanken der Gleichbehandlung.
- source_word: παιδεύει
  choice: erzieht
  rationale: παιδεύω bezeichnet hier nachhaltige sittliche Formung, die „erzieht“ natürlicher wiedergibt als bloßes Unterrichten.
- source_word: διὰ πάντων τῶν ἠθῶν
  choice: in allen Bereichen des Lebens
  rationale: ἤθη betrifft Charakter, Gewohnheiten und Lebensführung; die Wiedergabe drückt den umfassenden ethischen Bezug idiomatisch aus.
- source_word: ἰσονομεῖν
  choice: sich unparteiisch verhält
  rationale: Das Verb bezeichnet gleiches, gerechtes Behandeln beziehungsweise Handeln nach dem Grundsatz der Gleichheit; „unparteiisch“ bewahrt diesen praktischen Sinn.
- source_word: εὐσεβείαν
  choice: Gottesfurcht
  rationale: Im Kontext des allein dem wirklichen Gott geschuldeten Kultes bezeichnet εὐσέβεια ehrfürchtige, religiöse Hingabe; „Gottesfurcht“ ist dafür im Deutschen klar und würdig.
- source_word: σέβειν
  choice: verehrt
  rationale: σέβειν bezeichnet ehrfürchtige religiöse Verehrung. „Verehrt“ lässt sowohl kultische als auch innere Ehrfurcht anklingen.
- source_word: μόνον τὸν ὄντα θεὸν
  choice: allein den Gott, der wahrhaft existiert
  rationale: Die Formulierung erhält die Betonung des Seins Gottes und den Gegensatz zu nichtigen beziehungsweise falschen Göttern, ohne sie auf das bloße Adjektiv „wahr“ zu verkürzen.
- source_word: μεγαλοπρεπῶς
  choice: seiner Größe entsprechend
  rationale: Das Adverb beschreibt eine Verehrung, die der Erhabenheit und Größe Gottes angemessen ist; diese Formulierung ist natürlich und vermeidet das missverständliche „prachtvoll“.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνην im ethischen Zusammenhang
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der Zusammenhang umfasst sowohl sittliche Haltung als auch unparteiisches Handeln. „Gerechtigkeit“ wahrt beide Aspekte; die mögliche Betonung persönlicher Rechtschaffenheit wird in der Fußnote genannt.
- issue: Aussage von μόνον τὸν ὄντα θεὸν
  choice: allein den Gott, der wahrhaft existiert
  alternative: allein den wahren Gott
  rationale: Die gewählte Fassung bewahrt die substantielle Aussage des griechischen Partizips ὄντα und damit den Kontrast zwischen dem wirklich seienden Gott und falschen Göttern, ohne diesen Gegensatz dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erkennbar. „Erzieht“ betont moralische Formung; „seiner Größe entsprechend“ gibt μεγαλοπρεπῶς idiomatisch wieder, ohne einen äußerlich-prunkvollen Kult in den Text einzutragen.
