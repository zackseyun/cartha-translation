revisions:
- from: 'Denn bedenke auch: Selbst wenn es eine Macht gibt, die über diese Religion wacht[a], würde sie dir die unter Zwang begangene Übertretung in all diesen Dingen verzeihen[b].'
  to: 'Denn bedenke auch: Selbst wenn es irgendeine Macht gibt, die über diese Religion wacht[a], könnte sie dir die unter Zwang begangene Übertretung in all diesen Dingen verzeihen[b].'
  rationale: Die Revision stellt die im griechischen Bedingungsgefüge ausgedrückte Möglichkeit mit „könnte“ klar heraus und gibt τις durch „irgendeine“ wieder. Die erste Fußnote wird korrigiert, damit ihre deutsche Alternative tatsächlich eine überwachende, nicht eine beaufsichtigte Macht bezeichnet. Die theologische Unbestimmtheit und der Umfang von ἐπὶ πᾶσιν bleiben erhalten.
