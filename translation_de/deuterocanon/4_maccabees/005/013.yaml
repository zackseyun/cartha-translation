base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/013.yaml
  text: 'For consider this also: even if there is some overseeing power of this religion[b][a], it would pardon you for the lawlessness done under compulsion in all these things.'
translation:
  language: de
  text: 'Denn bedenke auch: Selbst wenn es irgendeine Macht gibt, die über diese Religion wacht[a], könnte sie dir die unter Zwang begangene Übertretung in all diesen Dingen verzeihen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine über diese Religion wachende Macht“. Das Griechische lässt offen, wer oder was diese Macht ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „könnte sie dir die aus Notwendigkeit begangene Gesetzesübertretung in allem nachsehen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνθυμήθητι
  choice: bedenke
  rationale: Der Imperativ fordert zum Nachdenken auf; „bedenke“ ist knapp, natürlich und bewahrt den mahnenden Ton.
- source_word: θρησκείας
  choice: Religion
  rationale: Das Wort bezeichnet hier die jüdische Religion beziehungsweise religiöse Lebensweise aus der distanzierten Perspektive des Sprechers.
- source_word: ἐποπτικὴ δύναμις
  choice: eine Macht, die … wacht
  rationale: Die Umschreibung gibt die beaufsichtigende oder wachende Funktion wieder, ohne die nicht näher bestimmte Macht ausdrücklich mit Gott gleichzusetzen.
- source_word: συγγνωμονήσειέν
  choice: würde … verzeihen
  rationale: Der Optativ bezeichnet im Bedingungsgefüge eine mögliche Folge; „verzeihen“ gibt das Gewähren von Nachsicht verständlich wieder.
- source_word: παρανομίᾳ
  choice: Übertretung
  rationale: Das Wort bezeichnet einen Verstoß gegen das Gesetz; „Übertretung“ bewahrt den rechtlich-moralischen Sinn und klingt im Deutschen natürlicher als „Gesetzlosigkeit“ für eine einzelne erzwungene Tat.
- source_word: διʼ ἀνάγκην
  choice: unter Zwang
  rationale: Die Wendung bezeichnet eine durch äußeren Zwang herbeigeführte Handlung und nicht bloß eine abstrakte Notwendigkeit.
- source_word: ἐπὶ πᾶσιν
  choice: in all diesen Dingen
  rationale: Die Formulierung bezieht sich umfassend auf die im Kontext verlangten Verstöße und wahrt zugleich die Weite des griechischen Ausdrucks.
theological_decisions:
- issue: Identität der „wachenden Macht“
  choice: Eine absichtlich unbestimmt gelassene Macht, die über die Religion wacht
  alternative: Gott selbst, eine allgemeine Vorsehungsmacht oder ein Schutzwesen der Religion
  rationale: Der griechische Text nennt Gott nicht, sondern formuliert hypothetisch und unbestimmt. Die Übersetzung wahrt diese theologische Spannung.
- issue: Moralische Bewertung einer unter Zwang begangenen Übertretung
  choice: Die Rede bleibt eine Behauptung des versuchenden Sprechers, wonach die Übertretung verziehen würde
  alternative: Die erzwungene Tat sei an sich keine Übertretung
  rationale: παρανομία bezeichnet die Handlung weiterhin als Gesetzesübertretung; nur ihre mögliche Verzeihung aufgrund des Zwangs wird behauptet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der hypothetische und leicht distanzierte Ton des Sprechers bleibt erhalten; die unbestimmte Macht wird nicht ausdrücklich als Gott identifiziert.
