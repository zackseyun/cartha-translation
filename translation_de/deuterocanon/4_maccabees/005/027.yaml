  yaml_path: translation/deuterocanon/4_maccabees/005/027.yaml
  text: But tyrannically you are not only compelling us to break the law[a], but also to eat, so that you may further mock us with this most hateful defilement by food.
translation:
  language: de
  text: Doch in deiner Tyrannei zwingst du uns nicht nur, das Gesetz zu übertreten, sondern auch zu essen, damit du uns mit dieser uns zutiefst verhassten Speisebefleckung[a] auch noch verhöhnst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Befleckung durch das Essen“ beziehungsweise „befleckendes Essen“. Das seltene griechische Wort verbindet die Vorstellungen des Essens und der kultischen oder sittlichen Befleckung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυραννικὸν
  choice: in deiner Tyrannei
  rationale: Das prädikativ beziehungsweise adverbial gebrauchte Adjektiv kennzeichnet das Handeln als tyrannisch. Die Formulierung ist im Deutschen natürlich und bewahrt den Vorwurf gewaltsamer Willkürherrschaft.
- source_word: ἀναγκάζεις
  choice: zwingst du
  rationale: Das Verb bezeichnet unmittelbaren Zwang; „zwingen“ gibt die präsentische Anklage klar und knapp wieder.
- source_word: παρανομεῖν
  choice: das Gesetz zu übertreten
  rationale: Das Verb bedeutet, gegen das Gesetz zu handeln. Im Kontext ist das jüdische Gesetz, die Tora, gemeint; der Haupttext fügt jedoch keine im Griechischen unausgesprochene nähere Bestimmung hinzu.
- source_word: ἐσθίειν
  choice: zu essen
  rationale: Die einfache und direkte Wiedergabe des Infinitivs wahrt, dass der Gegenstand des Essens in diesem Satz nicht eigens genannt wird.
- source_word: ὅπως
  choice: damit
  rationale: Die Konjunktion führt den beabsichtigten Zweck des erzwungenen Essens ein.
- source_word: ἐχθίστῃ ἡμῶν
  choice: dieser uns zutiefst verhassten
  rationale: Der Superlativ drückt äußerste Abscheu aus; „uns“ wird als Bezug der Verhasstheit verstanden, ohne den Ausdruck unnötig zu überdehnen.
- source_word: μιεροφαγίᾳ
  choice: Speisebefleckung
  rationale: Das seltene Kompositum verbindet Essen beziehungsweise Speise mit kultischer oder sittlicher Befleckung. Das deutsche Kompositum bewahrt diese ungewöhnliche Verdichtung; eine Fußnote erläutert die Bedeutungsbreite.
- source_word: ἔτι
  choice: auch noch
  rationale: Die Wendung bezeichnet den zusätzlichen Hohn als weitere Steigerung des Unrechts und ist im modernen Deutschen idiomatisch.
- source_word: ἐγγελάσῃς
  choice: verhöhnst
  rationale: Das Verb bedeutet, jemanden auszulachen oder zu verspotten. „Verhöhnen“ entspricht dem ernsten, anklagenden Register.
theological_decisions:
- issue: Bezug des „Gesetzes“ in παρανομεῖν
  choice: „das Gesetz zu übertreten“ ohne ergänzendes „Gottes“
  alternative: „Gottes Gesetz zu übertreten“ oder „das väterliche Gesetz zu übertreten“
  rationale: Der Märtyrerkontext macht den Bezug auf die Tora deutlich, doch der griechische Satz nennt lediglich das Gesetz beziehungsweise gesetzwidriges Handeln. Die Übersetzung bewahrt diese sprachliche Zurückhaltung.
- issue: Art der Befleckung in μιεροφαγίᾳ
  choice: Die Verunreinigung wird als mit dem Essen verbundene Befleckung wiedergegeben.
  alternative: Nur „verbotenes Essen“ oder ausschließlich „rituelle Unreinheit“
  rationale: Das seltene Kompositum lässt die Aspekte des Essens und der Befleckung zugleich anklingen. Eine engere dogmatische Festlegung würde die lexikalische Spannung vermindern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In deiner Tyrannei“ vermeidet das schwerfällige „auf tyrannische Weise“; „auch noch verhöhnst“ gibt die zusätzliche, bewusst zugefügte Erniedrigung natürlich wieder.
