base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/016.yaml
  text: But we[a], Antiochus, being persuaded by a divine law, order our lives by it, and we consider no compulsion to be stronger than obedience to our law.
translation:
  language: de
  text: Wir, Antiochus, sind von einem göttlichen Gesetz überzeugt und richten unser Leben danach aus. Wir halten keinen Zwang für stärker als den Gehorsam gegenüber unserem Gesetz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θείῳ
  choice: göttlichen
  rationale: Das Adjektiv kennzeichnet das Gesetz als göttlich, ohne ausdrücklich festzulegen, ob Herkunft oder Beschaffenheit im Vordergrund steht.
- source_word: πεπεισμένοι
  choice: sind … überzeugt
  rationale: Das Perfekt Passiv bezeichnet einen herbeigeführten, fortbestehenden Zustand; die deutsche Formulierung gibt diesen natürlich wieder.
- source_word: νόμῳ
  choice: Gesetz
  rationale: Im Kontext ist das jüdische Gesetz, die Tora, gemeint; „Gesetz“ ist die klare und etablierte Wiedergabe.
- source_word: πολιτευόμεθα
  choice: richten unser Leben danach aus
  rationale: Das Verb bezeichnet hier die Lebensführung innerhalb einer verbindlichen Ordnung; die Formulierung bewahrt sowohl den praktischen als auch den normativen Sinn.
- source_word: οὐδεμίαν ἀνάγκην
  choice: keinen Zwang
  rationale: ἀνάγκη meint im Zusammenhang den von Antiochus ausgeübten äußeren Druck, nicht bloß abstrakte Notwendigkeit.
- source_word: βιαιοτέραν
  choice: stärker
  rationale: Der Komparativ beschreibt die überlegene zwingende Kraft; zusammen mit „Zwang“ ist „stärker“ im Deutschen natürlich und präzise.
- source_word: τῆς πρὸς τὸν νόμον ἡμῶν εὐπειθείας
  choice: als den Gehorsam gegenüber unserem Gesetz
  rationale: εὐπείθεια bezeichnet bereitwilligen Gehorsam. Die Wendung gibt den Genitiv des Vergleichs und den gemeinschaftlichen Bezug von „unserem Gesetz“ klar wieder.
theological_decisions:
- issue: Charakterisierung des jüdischen Gesetzes
  choice: einem göttlichen Gesetz
  alternative: dem göttlichen Gesetz / einem von Gott gegebenen Gesetz
  rationale: Das artikellose θείῳ νόμῳ lässt eine qualitative beziehungsweise indefinite Wiedergabe zu. „Einem göttlichen Gesetz“ bewahrt diese Offenheit und bekräftigt den göttlichen Charakter, ohne die Herkunft stärker auszudeuten, als der griechische Wortlaut es verlangt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede „Antiochus“ und der Gegensatz zwischen äußerem Zwang und bindendem Gehorsam bleiben deutlich erhalten.
