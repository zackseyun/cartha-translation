base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/037.yaml
  text: My fathers will welcome me as a champion[a], since I did not fear your constraints, even unto death.
translation:
  language: de
  text: Meine Väter werden mich als Kämpfer[a] willkommen heißen, weil ich deine Zwangsmittel bis hin zum Tod nicht gefürchtet habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher und mit unsicherer Satzverbindung: „Meine Väter werden mich zum Kampf/Wettkampf aufnehmen.“ Das griechische Wortfeld kann sowohl an einen athletischen Wettkampf als auch an einen Kampf denken lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγών᾽
  choice: als Kämpfer
  rationale: Die verkürzte Form ist textlich beziehungsweise syntaktisch ungewöhnlich und bewahrt Bildsprache aus Kampf und Wettkampf. „Als Kämpfer“ ergibt im Deutschen einen natürlichen Satz, ohne die agonistische Metaphorik auf eine bestimmte Sport- oder Kriegsszene festzulegen.
- source_word: οἱ πατέρες
  choice: meine Väter
  rationale: Gemeint sind im Zusammenhang die Vorväter des Sprechers. „Meine Väter“ bewahrt die konkrete griechische Ausdrucksweise, während „meine Vorfahren“ glatter, aber weniger formnah wäre.
- source_word: προσδέξονται
  choice: werden … willkommen heißen
  rationale: Das Verb bezeichnet hier eine bereitwillige, günstige Aufnahme; „willkommen heißen“ gibt diesen positiven Beiklang deutlicher wieder als das neutrale „aufnehmen“.
- source_word: μὴ φοβηθέντα
  choice: weil ich … nicht gefürchtet habe
  rationale: Das Aoristpartizip bezieht sich auf den Sprecher und kann im Zusammenhang begründend verstanden werden. Der deutsche Nebensatz gibt diese Beziehung natürlich wieder.
- source_word: σου
  choice: deine
  rationale: Das Pronomen verweist auf die vom angesprochenen Verfolger eingesetzten Zwangsmittel.
- source_word: τὰς μέχρι θανάτου ἀνάγκας
  choice: deine Zwangsmittel bis hin zum Tod
  rationale: ἀνάγκαι bezeichnet hier erzwungene Bedrängnisse oder Mittel der Nötigung, nicht bloße Notwendigkeiten. „Bis hin zum Tod“ wahrt die Steigerung bis zur äußersten Konsequenz.
theological_decisions:
- issue: Identität der „Väter“ und Aufnahme nach dem Tod
  choice: Die Übersetzung spricht wie der griechische Text von den „Vätern“, die den Sprecher willkommen heißen.
  alternative: „Meine Vorfahren“ oder eine allgemeinere Rede von geehrten Ahnen ohne deutlichen Bezug auf eine Aufnahme nach dem Tod.
  rationale: Der Märtyrerkontext legt eine erwartete Aufnahme durch die verstorbenen Vorväter nahe. Die Formulierung wird jedoch nicht zu einer weitergehenden Lehraussage über das Jenseits ausgebaut.
- issue: Deutung der agonistischen Formulierung ἀγών᾽
  choice: „als Kämpfer“ im Haupttext mit einer Fußnote zur wörtlicheren und unsicheren Konstruktion.
  alternative: „zum Kampf“ oder „für einen Wettkampf“ aufnehmen.
  rationale: Die griechische Form bewahrt Kampf- oder Wettkampfmetaphorik, lässt sich aber in ihrer syntaktischen Beziehung nicht völlig eindeutig abbilden. Die Fußnote hält diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zwangsmittel“ ist verständlich und trifft den aktiven Zwang des Verfolgers; „bis hin zum Tod“ klingt gegenwärtig, ohne die feierliche Entschlossenheit des Satzes abzuschwächen.
