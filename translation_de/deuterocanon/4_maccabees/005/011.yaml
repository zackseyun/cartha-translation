  text: and you will scatter the nonsense of your reasonings[a], and, taking up a mind worthy of your age, you will philosophize about the truth of what is beneficial[b],
translation:
  language: de
  text: und du wirst den Unsinn deiner Überlegungen zerstreuen[a] und, nachdem du dir einen deinem Alter angemessenen Verstand zu eigen gemacht hast, über die Wahrheit dessen philosophieren, was zuträglich ist[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Torheit deiner Gedanken vertreiben“ beziehungsweise „den Unsinn deiner Argumente zerstreuen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb bedeutet ausdrücklich „philosophieren“, also sich philosophischer Betrachtung widmen, nicht lediglich „nachdenken“. Wörtlicher kann die Schlusswendung lauten: „über die Wahrheit des Zuträglichen philosophieren“.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀποσκεδάσεις
  choice: du wirst … zerstreuen
  rationale: Das Futur und das anschauliche Bild des Zerstreuens werden bewahrt; gemeint ist, verworrene oder törichte Überlegungen aufzulösen beziehungsweise zu vertreiben.
- source_word: λῆρον τῶν λογισμῶν
  choice: den Unsinn deiner Überlegungen
  rationale: λῆρος bezeichnet Unsinn, törichtes Gerede oder leeres Geschwätz; λογισμοί sind hier gedankliche Überlegungen oder Argumentationen. „Unsinn deiner Überlegungen“ erhält den abwertenden und zugleich intellektuellen Ton.
- source_word: ἄξιον τῆς ἡλικίας
  choice: deinem Alter angemessen
  rationale: Die Wendung bezeichnet eine Geisteshaltung, die der Lebensstufe des Angeredeten entspricht. „Angemessen“ klingt im modernen Deutschen natürlicher als das wörtlichere „würdig“, ohne ausdrücklich eine nicht genannte Reife hineinzulesen.
- source_word: ἀναλαβὼν νοῦν
  choice: nachdem du … Verstand angenommen hast
  rationale: ἀναλαμβάνω bedeutet „aufnehmen“ oder „annehmen“, νοῦς „Verstand“, „Sinn“ oder „Geist“. Die bewusst etwas markante Formulierung bewahrt das Bild, eine angemessene vernünftige Haltung anzunehmen.
- source_word: φιλοσοφήσεις
  choice: du wirst … philosophieren
  rationale: Das ausdrücklich philosophische Verb wird nicht zum allgemeineren „nachdenken“ abgeschwächt, da die philosophische Begriffswelt für 4 Makkabäer kennzeichnend ist.
- source_word: τὴν τοῦ συμφέροντος ἀλήθειαν
  choice: darüber …, was in Wahrheit nützlich ist
  rationale: Die deutsche Umformung gibt die Wahrheit in Bezug auf das Nützliche beziehungsweise Zuträgliche verständlich wieder. Sie vermeidet das schwerfällige „die Wahrheit des Nützlichen“, ohne den Nutzen bloß mit persönlichem Gewinn gleichzusetzen.
theological_decisions:
- issue: Philosophische Begrifflichkeit in 4 Makkabäer
  choice: Die ausdrücklich philosophische Sprache mit „Überlegungen“, „Verstand“ und „philosophieren“ bleibt erhalten.
  alternative: Die Aussage mit allgemein-moralischen Wörtern wie „Gedanken“, „Vernunft annehmen“ und „nachdenken“ wiedergeben.
  rationale: Der Verfasser stellt jüdische Frömmigkeit bewusst in philosophischen Kategorien dar. Die Beibehaltung dieser Begriffe schützt die gedankliche Eigenart des Textes und vermeidet eine konfessionelle oder rein moralistische Verengung.
- issue: Verhältnis von Wahrheit und Nutzen in τὴν τοῦ συμφέροντος ἀλήθειαν
  choice: „darüber philosophieren, was in Wahrheit nützlich ist“
  alternative: „über die Wahrheit des Nützlichen philosophieren“
  rationale: Der Genitiv lässt sich als Wahrheit über beziehungsweise Wahrheit des Zuträglichen verstehen. Die Hauptfassung ist idiomatischer, legt aber nicht fest, worin der wahre Nutzen besteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die philosophische Fachsprache des Werkes bleibt hörbar; schwer verständliche griechische Konstruktionen werden behutsam idiomatisiert. Der Satz setzt den vorangehenden Zusammenhang fort und behält daher das einleitende „und“ sowie das abschließende Komma der Vorlage bei.
