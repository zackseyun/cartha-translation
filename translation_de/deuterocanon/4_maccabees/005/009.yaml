lexical_decisions:
- source_word: σὺ δέ
  choice: Du aber
  rationale: δέ hat hier kontrastierende Kraft; „Du aber“ bewahrt den ausdrücklichen Gegensatz und die direkte Anrede in würdigem, natürlichem Deutsch.
- source_word: μοι
  choice: mir
  rationale: Der Dativ bei δοκεῖς bezeichnet die persönliche Einschätzung des Sprechers und wird knapp und ausdrücklich mit „mir“ wiedergegeben.
- source_word: ἀνοητότερον
  choice: noch unvernünftiger
  rationale: Der adverbial gebrauchte Komparativ bezeichnet ein Handeln mit noch weniger Einsicht oder Verstand. „Unvernünftiger“ wahrt diese Bedeutung, ohne die unnötig verletzende Färbung von „dümmer“ anzunehmen.
- source_word: ποιήσειν
  choice: zu handeln
  rationale: Der Infinitiv bezeichnet hier das Tun beziehungsweise Verhalten des Angeredeten. „Zu handeln“ ist im Deutschen natürlicher und präziser als das formale „zu tun“.
- source_word: δοκεῖς
  choice: scheinst
  rationale: In der Konstruktion mit Infinitiv bedeutet δοκεῖς „du scheinst“, nicht „du meinst“.
