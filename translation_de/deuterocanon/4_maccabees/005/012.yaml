  text: and by bowing down to my humane persuasion[a], you will have pity on your own old age.
translation:
  language: de
  text: Und wenn du dich meinem menschenfreundlichen Zureden beugst[a], wirst du Erbarmen mit deinem eigenen Alter haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meinem menschenfreundlichen Zureden huldigst« oder »dich davor niederwirfst«; im weiteren Zusammenhang des erzwungenen Abfalls möglicherweise auch mit dem Sinn von »anbetest«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσας
  choice: wenn du dich … beugst
  rationale: Das Aoristpartizip bezeichnet hier die vorausgesetzte Handlung, die zum folgenden Ergebnis führt, und kann im Deutschen natürlich als Bedingungssatz wiedergegeben werden. »Sich beugen« bewahrt sowohl die körperliche Vorstellung als auch den Sinn der Unterwerfung, ohne die mögliche kultische Bedeutung vorschnell festzulegen.
- source_word: μου
  choice: meinem
  rationale: Das Pronomen bezeichnet den König als Urheber des Zuredens und wird im Deutschen possessiv wiedergegeben.
- source_word: τὴν φιλάνθρωπον παρηγορίαν
  choice: meinem menschenfreundlichen Zureden
  rationale: παρηγορία bezeichnet hier kein bloßes Trösten, sondern ein auf Zustimmung zielendes Zureden. »Menschenfreundlich« gibt φιλάνθρωπος eng wieder und lässt zugleich erkennen, wie der Sprecher sein eigenes, tatsächlich unter Zwang stehendes Angebot darstellt.
- source_word: οἰκτειρήσεις
  choice: wirst du Erbarmen … haben
  rationale: Das Futur von οἰκτείρω bezeichnet Mitleid oder Erbarmen. Die relativ formale Wendung entspricht dem rhetorischen Ton und hält die Bildlichkeit des griechischen Ausdrucks fest.
- source_word: τὸ σεαυτοῦ γῆρας
  choice: mit deinem eigenen Alter
  rationale: γῆρας bedeutet »Alter« beziehungsweise »Greisenalter«; σεαυτοῦ hebt den Selbstbezug ausdrücklich hervor. »Deinem eigenen Alter« bewahrt diesen Nachdruck, ohne zusätzliche Bedeutungsbestandteile einzuführen.
theological_decisions:
- issue: Bedeutungsumfang von προσκυνέω im Zusammenhang der königlichen Forderung
  choice: dich … beugst
  alternative: huldigst; dich niederwirfst; anbetest
  rationale: Das Verb kann körperliches Niederwerfen, Huldigung oder kultische Anbetung bezeichnen. Da sein unmittelbares Objekt hier das »Zureden« des Königs ist, steht die Unterwerfung unter dessen Forderung im Vordergrund. Der weitere Zusammenhang des erzwungenen Abfalls lässt jedoch eine kultische Färbung zu; diese bleibt in der Fußnote ausdrücklich offen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. »Menschenfreundlich« ist bewusst etwas markant, weil es die Selbstdarstellung des Königs eng wiedergibt, ohne seine Zwangsmaßnahme als tatsächlich barmherzig zu bestätigen.
