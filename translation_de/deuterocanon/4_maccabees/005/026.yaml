  text: He permitted us to eat the things suited to our souls[a], but he forbade us to eat flesh that is opposed to them.
translation:
  language: de
  text: Er erlaubte uns, das zu essen, was unseren Seelen entspricht; Fleisch aber, das ihnen zuwider ist, verbot er uns zu essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκειωθησόμενα
  choice: entsprechen würde
  rationale: Das zukünftige Passivpartizip bezeichnet das, was in eine angemessene oder vertraute Beziehung zu den Seelen treten würde. „Entsprechen“ bewahrt die Vorstellung sittlicher Übereinstimmung, ohne eine bestimmte philosophische Deutung festzuschreiben.
- source_word: ψυχαῖς
  choice: Seelen
  rationale: Hier hat ψυχή eine ethisch-anthropologische Bedeutung und bezeichnet nicht bloß das biologische Leben. „Seelen“ erhält dieses Gewicht.
- source_word: ἐπέτρεψεν
  choice: erlaubte
  rationale: Das Verb bezeichnet im Zusammenhang göttlicher Speisegebote eine ausdrückliche Erlaubnis.
- source_word: ἐναντιωθησόμενα
  choice: zuwider sein würde
  rationale: Die Form bezeichnet das, was den Seelen entgegensteht oder mit ihnen unvereinbar ist. „Zuwider sein“ gibt diesen Gegensatz in würdigem, verständlichem Deutsch wieder.
- source_word: ἐκώλυσεν
  choice: verbot
  rationale: Im parallelen Gegensatz zur Erlaubnis ist hier eine rechtlich-ethische Untersagung gemeint.
- source_word: σαρκοφαγεῖν
  choice: Fleisch … zu essen
  rationale: Die Wiedergabe bewahrt die konkrete Bedeutung „Fleisch essen“ und zugleich die Wiederholung von „essen“ aus dem ersten Satzglied.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχαῖς im Verhältnis zum Speisegesetz
  choice: „Seelen“ mit der Beziehungssprache „entsprechen“ und „zuwider sein“
  alternative: „Leben“ oder „uns selbst“ sowie eine rein gesundheitliche Formulierung
  rationale: Der Vers stellt erlaubte und verbotene Speisen nach ihrer Beziehung zum inneren sittlichen Leben gegenüber. Die Übersetzung wahrt diese ethisch-anthropologische Spannung, ohne sie in spätere Lehrbegriffe auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus von Erlaubnis und Verbot sowie die echte Bedeutungsweite der beiden zukünftigen Passivpartizipien bleiben erkennbar.
