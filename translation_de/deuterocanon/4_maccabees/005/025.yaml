base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/025.yaml
  text: Therefore we do not eat defiling food[a]; for because we believe that the law has been established by God, we know that the Creator of the world, in giving the law[b], also sympathizes with our nature.
translation:
  language: de
  text: Darum essen wir nichts Beflecktes[a]. Denn weil wir glauben, dass das Gesetz von Gott eingesetzt worden ist, wissen wir, dass der Schöpfer der Welt uns auch bei seiner Gesetzgebung im Einklang mit der Natur mitfühlend begegnet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Darum essen wir nichts, was befleckt ist.“'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische kann auch so verstanden werden: „Der Schöpfer der Welt fühlt uns beim Gesetzgeben gemäß der Natur mit.“'
    reason: alternative_reading
lexical_decisions:
- source_word: μιεροφαγοῦμεν
  choice: essen wir nichts, was befleckt ist
  rationale: Das zusammengesetzte Verb bezeichnet das Essen von Beflecktem. Die Formulierung gibt den impliziten Gegenstand natürlich wieder, ohne die Befleckung enger als ausdrücklich kultisch oder rituell festzulegen.
- source_word: πιστεύοντες
  choice: weil wir glauben
  rationale: Das Partizip ist hier kausal zu verstehen und begründet die Weigerung zu essen.
- source_word: καθέστασθαι
  choice: eingesetzt worden ist
  rationale: Der Perfektinfinitiv bezeichnet das Gesetz als von Gott eingesetzt und weiterhin in Geltung stehend.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Der Artikel weist auf das bestimmte, von Gott gegebene Gesetz hin.
- source_word: νομοθετῶν
  choice: wenn er Gesetze gibt
  rationale: Das Partizip beschreibt den Schöpfer in seinem gesetzgeberischen Handeln. Der Plural ist im Deutschen idiomatisch; eine Fußnote nennt die engere Wiedergabe.
- source_word: κατὰ φύσιν ἡμῖν συμπαθεῖ
  choice: auch unserer Natur mitfühlend begegnet
  rationale: Die Wiedergabe verbindet den Dativ ἡμῖν und κατὰ φύσιν mit συμπαθεῖ und bewahrt den Gedanken, dass der Gesetzgeber gegenüber uns beziehungsweise unserer Natur mitfühlend oder rücksichtsvoll ist.
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: der Schöpfer der Welt
  rationale: Die titulare Wendung wird direkt und würdevoll wiedergegeben.
theological_decisions:
- issue: Bedeutung der Speiseverweigerung
  choice: Die Sprecher essen nichts, was durch das göttliche Gesetz als befleckt gilt.
  alternative: Das Verb kann abstrakter als „wir beflecken uns nicht durch Essen“ wiedergegeben werden.
  rationale: Das griechische Kompositum trägt die Vorstellung des Essens von Beflecktem in sich; die Übersetzung macht den impliziten Gegenstand sichtbar, ohne zusätzliche Reinheitskategorien einzutragen.
- issue: Verhältnis des göttlichen Gesetzgebers zur Natur
  choice: Der Schöpfer begegnet beim Gesetzgeben unserer Natur mitfühlend beziehungsweise rücksichtsvoll.
  alternative: Die Wendung kann auch bedeuten, dass der Schöpfer beim Gesetzgeben naturgemäß mit uns mitfühlt oder im Einklang mit der Natur gesetzgeberisch handelt.
  rationale: Die syntaktische Zuordnung von κατὰ φύσιν ist nicht völlig eindeutig. Der Haupttext wahrt den persönlichen Bezug von ἡμῖν bei συμπαθεῖ; die Fußnote hält die stärker adverbiale Lesart offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Befleckt“ erhält die religiös-ethische Färbung des griechischen Verbs, ohne sie vorschnell auf eine bestimmte konfessionelle Reinheitslehre festzulegen. Die beiden Fußnotenmarker [a] und [b] stehen im Haupttext.
