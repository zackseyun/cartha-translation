  naturalness: '„Durch jeden von beiden ist das Gesetz gleichermaßen stolz“ ist zwar verständlich, klingt im Deutschen aber semantisch und stilistisch sperrig: Man ist gewöhnlich auf jemanden stolz, nicht durch jemanden stolz. „Durch jeden von beiden rühmt sich das Gesetz gleichermaßen“ erhält die Personifikation und die kausale/instrumentale Konstruktion in natürlichem modernem Deutsch.'
