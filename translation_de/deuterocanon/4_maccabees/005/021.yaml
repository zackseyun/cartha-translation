translation:
  language: de
  text: Denn durch jeden von beiden[a] rühmt sich das Gesetz gleichermaßen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch jeden der beiden“; das griechische Wort bezieht sich ausdrücklich auf zwei zuvor genannte Größen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ist das Gesetz gleichermaßen stolz“. Im Griechischen wird das Gesetz mit einem Verb des Stolzes oder Rühmens personifiziert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἑκατέρου
  choice: durch jeden von beiden
  rationale: ἑκάτερος bezieht sich ausdrücklich auf zwei Größen und ist hier distributiv gebraucht. „Durch jeden von beiden“ bewahrt diese Zweizahl klarer als das im Deutschen potenziell ausschließende „durch einen von beiden“.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet oder erläutert die vorausgehende Aussage; „denn“ gibt diese Verknüpfung knapp und natürlich wieder.
- source_word: ὡς ὁμοίως
  choice: gleichermaßen
  rationale: Die Wendung betont Gleichheit beziehungsweise Gleichwertigkeit. „Gleichermaßen“ ist im modernen Deutsch idiomatisch und erhält den adverbialen Bezug.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: νόμος bezeichnet hier das jüdische Gesetz beziehungsweise die Tora. „Das Gesetz“ ist die geläufige, kontextgerechte Wiedergabe.
- source_word: ὑπερηφανεῖται
  choice: ist stolz
  rationale: Das Verb bezeichnet Stolz oder Sich-Rühmen. „Ist stolz“ erhält die Personifikation des Gesetzes und ist zugleich natürliches modernes Deutsch.
theological_decisions:
- issue: Personifikation des Gesetzes
  choice: „das Gesetz … ist stolz“
  alternative: „das Gesetz wird durch beide gleichermaßen geehrt“
  rationale: Der griechische Wortlaut stellt das Gesetz als handelnd beziehungsweise empfindend dar. Die Personifikation bleibt deshalb erhalten, statt sie in eine Aussage über die Ehrung des Gesetzes umzudeuten.
- issue: Verteilung auf die zwei zuvor genannten Größen
  choice: „durch jeden von beiden“
  alternative: „durch einen von beiden“
  rationale: Die distributive Bedeutung von ἑκατέρου soll nicht so verstanden werden, als käme nur eine beliebige der beiden Größen infrage; gemeint ist jede von ihnen jeweils für sich.
translation_notes:
  register: Kurzer, würdevoller Standardsatz in modernem Deutsch. Die ungewöhnliche Personifikation des Gesetzes wurde bewusst beibehalten; „jeden von beiden“ macht den dualen und distributiven Sinn des Griechischen deutlich.
