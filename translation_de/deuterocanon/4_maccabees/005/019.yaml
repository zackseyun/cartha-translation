  yaml_path: translation/deuterocanon/4_maccabees/005/019.yaml
  text: So do not suppose this to be a small sin[a], if we were to eat polluted food.
translation:
  language: de
  text: Darum halte es nicht für eine geringe Sünde[a], wenn wir unreine Speise essen würden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn wir etwas Unreines essen würden“. Das griechische Verb fasst den Gedanken zusammen, Nahrung zu essen, die als unrein oder entweiht gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... νομίσῃς
  choice: halte es nicht für
  rationale: νομίζω bezeichnet hier ein bewertendes Urteil. Die deutsche Wendung ist natürlich und bewahrt die Warnung davor, die Tat geringzuschätzen.
- source_word: μικρὰν ... ἁμαρτίαν
  choice: eine geringe Sünde
  rationale: Das Adjektiv μικράν bestimmt ἁμαρτίαν unmittelbar. „Geringe Sünde“ ist im Deutschen idiomatischer als „kleine Sünde“ und erhält den Gegensatz zur Schwere des Vergehens.
- source_word: ταύτην
  choice: es
  rationale: Das Demonstrativpronomen verweist auf die anschließend genannte Handlung. Die Konstruktion „es für ... halten“ gibt diesen Rückverweis im Deutschen natürlich wieder.
- source_word: εἰ
  choice: wenn ... würden
  rationale: Die Verbindung mit der Verbform beschreibt eine hypothetisch erwogene Handlung. Der deutsche Konjunktiv wahrt diesen prospektiv-bedingten Sinn.
- source_word: μιεροφαγήσαμεν
  choice: verunreinigte Speise essen
  rationale: Das zusammengesetzte Verb bezeichnet das Essen von kultisch entweihter oder unreiner Nahrung. „Verunreinigte Speise essen“ macht das im Griechischen verdichtete Objekt verständlich, ohne die Verunreinigung bloß hygienisch festzulegen.
theological_decisions:
- issue: Wie ausdrücklich der Unreinheitsbegriff in μιεροφαγήσαμεν wiederzugeben ist
  choice: verunreinigte Speise essen
  alternative: Unreines essen
  rationale: Im Zusammenhang geht es um Nahrung, deren Verzehr gegen religiöse Reinheits- und Heiligkeitsgebote verstößt. „Verunreinigt“ bewahrt diese Dimension, während die Fußnote die kompaktere Alternative nennt und die Bedeutungsdichte des griechischen Verbs offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular und die hypothetische Bedingung des griechischen Satzes bleiben erhalten; „Speise“ trägt hier einen leicht gehobenen, aber allgemein verständlichen Ton.
