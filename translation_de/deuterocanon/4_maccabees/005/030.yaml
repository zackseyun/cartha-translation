  text: You will not even gouge out my eyes and melt my inward parts[a].
translation:
  language: de
  text: Du wirst mir nicht einmal die Augen herausreißen und meine inneren Organe zum Schmelzen bringen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Eingeweide«. Das griechische Wort bezeichnet die inneren Organe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ἂν
  choice: Du wirst … nicht einmal
  rationale: Die Verbindung verstärkt die Verneinung. Die deutsche Formulierung bewahrt die emphatische Aussage, ohne das im Zusammenhang weniger wahrscheinliche konditionale Verständnis („nicht einmal wenn“) festzuschreiben.
- source_word: ἐκκόψεις
  choice: herausreißen
  rationale: Das Verb bedeutet wörtlich „herausschneiden“ oder „abtrennen“. Bei Augen gibt „herausreißen“ die gewaltsame Handlung in natürlichem modernem Deutsch wieder.
- source_word: τὰ ὄμματα
  choice: die Augen
  rationale: Das Substantiv bezeichnet hier konkret die Augen; ein übertragener Sinn ist nicht angezeigt.
- source_word: τὰ σπλάγχνα
  choice: meine inneren Organe
  rationale: Der Ausdruck bezeichnet die Organe im Körperinneren beziehungsweise die Eingeweide. „Innere Organe“ ist präzise, verständlich und im heutigen Deutsch weniger stilistisch belastet als „Eingeweide“.
- source_word: τήξεις
  choice: zum Schmelzen bringen
  rationale: Das Verb bedeutet „schmelzen (lassen)“, „auflösen“ oder „verzehren“. Die gewählte Wendung erhält das konkrete, drastische Bild und entspricht der transitiven Form.
