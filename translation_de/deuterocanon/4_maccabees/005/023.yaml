  yaml_path: translation/deuterocanon/4_maccabees/005/023.yaml
  text: For it teaches us self-control, so that we may master all pleasures and desires, and to practice courage, so that we may willingly endure every pain;
translation:
  language: de
  text: Denn sie lehrt uns Selbstbeherrschung, damit wir alle Freuden und Begierden beherrschen, und Mut, damit wir jeden Schmerz freiwillig ertragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: Selbstbeherrschung
  rationale: Im ethischen Zusammenhang bezeichnet das Wort die besonnene Herrschaft über sich selbst; der folgende Satzteil über Freuden und Begierden konkretisiert diesen Sinn.
- source_word: ἐκδιδάσκει
  choice: lehrt
  rationale: Das Verb kann gründliche Unterweisung bezeichnen. „Lehrt“ gibt den Sinn klar und natürlich wieder, ohne die Intensität des Präfixes zu überzeichnen.
- source_word: κρατεῖν
  choice: beherrschen
  rationale: Das Verb bezeichnet das Starksein über etwas beziehungsweise die Ausübung von Herrschaft. „Beherrschen“ bewahrt diesen aktiven Sinn.
- source_word: ἡδονῶν
  choice: Freuden
  rationale: Das Wort bezeichnet allgemein angenehme Empfindungen oder Genüsse. „Freuden“ lässt die im Griechischen vorhandene Breite bestehen und engt es nicht auf sinnliche Lust ein.
- source_word: ἐπιθυμιῶν
  choice: Begierden
  rationale: Der Ausdruck meint starke Wünsche oder Verlangen und kann ethisch negativ gefärbt sein. „Begierden“ bewahrt diese Färbung, ohne den Begriff auf Sexualität zu verengen.
- source_word: ἀνδρείαν
  choice: Mut
  rationale: In der hellenistischen Tugendsprache bezeichnet das Wort Tapferkeit oder Mut. „Mut“ ist gegenwärtig, verständlich und vermeidet eine sachlich unnötige geschlechtliche Markierung.
- source_word: ἐξασκεῖν
  choice: einzuüben
  rationale: Das Verb bezeichnet das aktive Üben und Ausbilden einer Tugend. „Einüben“ bringt den Gedanken fortgesetzter Praxis prägnant zum Ausdruck.
- source_word: πόνον
  choice: Schmerz
  rationale: Im Zusammenhang des Martyriums bezeichnet das Wort erlittene Mühe, Pein oder Schmerz. „Schmerz“ gibt die konkrete Leidensdimension unmittelbar wieder.
- source_word: ἑκουσίως
  choice: freiwillig
  rationale: Das Adverb hebt hervor, dass das Ertragen aus eigenem Willen geschieht. „Freiwillig“ entspricht diesem Akzent genau.
- source_word: ὑπομένειν
  choice: ertragen
  rationale: Das Verb bedeutet, unter einer Belastung auszuharren. In Verbindung mit „Schmerz“ ist „ertragen“ die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe griechischer Tugendbegriffe im philosophischen Martyriumskontext
  choice: Die Tugenden werden mit den gebräuchlichen modernen Begriffen „Selbstbeherrschung“ und „Mut“ wiedergegeben.
  alternative: „Besonnenheit“ beziehungsweise „Tapferkeit“ oder das etymologisierende „Mannhaftigkeit“
  rationale: Die gewählten Begriffe vermitteln die ethische Aussage verständlich und ohne altertümliche oder geschlechtlich verengende Nebenbedeutungen. Der konkrete Sinn von σωφροσύνη wird durch die Herrschaft über Freuden und Begierden ausdrücklich entfaltet.
- issue: Bezug der beiden Infinitivkonstruktionen mit ὥστε
  choice: Die parallele Aussage wird als Unterweisung in Selbstbeherrschung und im Einüben von Mut wiedergegeben, jeweils mit einer Folgewirkung.
  alternative: Die zweite Infinitivgruppe vollständig der ersten ὥστε-Konstruktion unterordnen
  rationale: Die Zeichensetzung und der rhetorische Parallelismus stützen zwei aufeinander bezogene Tugendaussagen. Die deutsche Form bewahrt zugleich die syntaktische Spannung des griechischen Satzes, statt ein zusätzliches finites Verb einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem rhetorischen Parallelismus des Griechischen; „sodass“ gibt ὥστε mit Infinitiv als beabsichtigte beziehungsweise erreichte Folge wieder. Keine Fußnote erforderlich.
