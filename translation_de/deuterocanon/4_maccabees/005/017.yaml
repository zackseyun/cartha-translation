  text: Therefore[a], indeed, we consider it right in no way to break the law.
translation:
  language: de
  text: Darum halten wir es für richtig, das Gesetz unter keinen Umständen zu übertreten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Die Folgerungspartikel zieht den Schluss aus dem vorangehenden Gedankengang; „Darum“ gibt diese logische Verknüpfung natürlich und prägnant wieder.
- source_word: δὴ
  choice: durch den bestimmten Aussagesinn mitgetragen
  rationale: Die Partikel verstärkt die Aussage. Ein eigenständiges „ja“ oder „in der Tat“ wäre im modernen Deutschen hier schwerfällig; die Betonung bleibt durch die kategorische Formulierung erhalten.
- source_word: κατʼ οὐδένα τρόπον
  choice: unter keinen Umständen
  rationale: Die Wendung bezeichnet eine uneingeschränkte Verneinung. „Unter keinen Umständen“ ist idiomatisch und bewahrt ihre kategorische Kraft.
- source_word: παρανομεῖν
  choice: das Gesetz … zu übertreten
  rationale: Das Verb bedeutet, gegen ein Gesetz zu handeln. „Das Gesetz übertreten“ wahrt den rechtlich-ethischen Gehalt und klingt im Deutschen würdig und verständlich.
- source_word: ἀξιοῦμεν
  choice: wir halten es für richtig
  rationale: Das Verb bezeichnet hier ein abgewogenes Urteil darüber, was angemessen oder geboten ist; diese Fügung gibt die Infinitivkonstruktion klar wieder.
theological_decisions:
- issue: Art des Gesetzes im Kontext
  choice: „das Gesetz“ ohne weitere Bestimmung
  alternative: „das mosaische Gesetz“ oder typografisch hervorgehobenes „Gesetz“
  rationale: Der griechische Vers nennt keine ausdrückliche nähere Bestimmung. Der Kontext verweist zwar auf das überlieferte jüdische Gesetz, doch die Übersetzung soll diese Einordnung nicht in den Vers hineintragen.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Register. Die verstärkende Wirkung von δὴ und die absolute Verneinung werden ohne unidiomatische Partikelhäufung wiedergegeben.
