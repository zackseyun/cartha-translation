  terminology: „Philosophie“ ist als Lehn- und Fachwort richtig beibehalten. „Geschwätzig“ bewahrt bei φλύαρος die polemische Nuance besser als das allgemeinere „töricht“, ohne eine moderne weltanschauliche Deutung einzutragen. Die Fußnotenanker stehen im deutschen Entwurf an den passenden Stellen.
