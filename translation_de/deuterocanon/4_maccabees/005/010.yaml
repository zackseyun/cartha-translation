revisions:
- from: Wenn du dich haltlos mit der Wahrheit brüstest und sogar mich weiterhin verachtest, sodass du dir selbst Strafe zuziehst[a] – wirst du dann nicht aus eurer törichten Philosophie[b] erwachen?
  to: Wenn du dich eitel über die Wahrheit brüstest und mich weiterhin sogar verachtest – zu deiner eigenen Strafe[a] –, wirst du dann nicht aus eurer geschwätzigen Philosophie[b] erwachen?
  rationale: Die Revision ersetzt zwei semantisch weniger genaue Wörter durch näherliegende, zugleich moderne deutsche Entsprechungen. Die knappe Wiedergabe „zu deiner eigenen Strafe“ lässt die genaue Beziehung von ἐπί zur Strafe offen, statt sie einseitig als ausdrücklich ausgedrückte Konsequenz zu paraphrasieren. Numeruswechsel, rhetorische Frage und der polemische Charakter von „Philosophie“ bleiben erhalten.
