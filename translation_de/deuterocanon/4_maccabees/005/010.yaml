  yaml_path: translation/deuterocanon/4_maccabees/005/010.yaml
  text: If[a], while vainly boasting about the truth, you still despise even me at the cost of your own punishment[b], will you not wake up from your foolish philosophy?
translation:
  language: de
  text: Wenn du dich eitel über die Wahrheit brüstest und mich weiterhin sogar verachtest – zu deiner eigenen Strafe[a] –, wirst du dann nicht aus eurer geschwätzigen Philosophie[b] erwachen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei deiner eigenen Bestrafung“. Die griechische Wendung kann die eigene Strafe als Begleitumstand oder Folge der Verachtung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „törichten“, „leeren“ oder „schwatzhaften Philosophie“. Das griechische Adjektiv bezeichnet leeres, albernes oder geschwätziges Reden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κενοδοξῶν
  choice: dich haltlos … brüstest
  rationale: Das Partizip bezeichnet leeres oder unbegründetes Sich-Rühmen. „Haltlos … brüsten“ bewahrt sowohl den verbalen Charakter als auch die abwertende Aussage.
- source_word: περὶ τὸ ἀληθές
  choice: mit der Wahrheit
  rationale: Die Wendung nennt die Wahrheit als Gegenstand des Rühmens. Im Deutschen ist „sich mit der Wahrheit brüsten“ natürlicher als eine streng wörtliche Wiedergabe mit „über“.
- source_word: κἀμοῦ
  choice: sogar mich
  rationale: Die Krasis aus καί und ἐμοῦ hebt den Sprecher mit „auch/sogar“ ausdrücklich hervor.
- source_word: καταφρονήσεις
  choice: verachtest
  rationale: Das Verb bezeichnet geringschätzige Missachtung; „verachten“ gibt die Schärfe knapp wieder.
- source_word: ἐπὶ τῇ ἰδίᾳ τιμωρίᾳ
  choice: sodass du dir selbst Strafe zuziehst
  rationale: Die Präpositionalphrase bezeichnet hier am ehesten die für den Angesprochenen selbst eintretende Straffolge. Die verständliche deutsche Fassung wahrt diesen Sinn, während die Fußnote wörtlichere Möglichkeiten nennt.
- source_word: οὐκ ἐξυπνώσεις
  choice: wirst du dann nicht … erwachen?
  rationale: Die rhetorische Frage erwartet Zustimmung. „Erwachen“ erhält das griechische Bild des Aufwachens aus einer Verblendung.
- source_word: φλυάρου φιλοσοφίας
  choice: törichten Philosophie
  rationale: φλύαρος kann leeres, albernes oder geschwätziges Reden bezeichnen. „Töricht“ vermittelt die abwertende Wertung in würdigem, natürlichem Deutsch; die stärker bildhafte Alternative steht in der Fußnote.
- source_word: ὑμῶν
  choice: eurer
  rationale: Der griechische Plural wird trotz der vorherigen Anrede im Singular beibehalten. Dadurch kann sich der Vorwurf über den einzelnen Angesprochenen hinaus auf dessen Gruppe oder Denkrichtung erstrecken.
theological_decisions:
- issue: Rhetorische Stoßrichtung des Vorwurfs
  choice: Die Stelle erscheint als scharfe moralische Herausforderung, ohne „Philosophie“ mit späteren philosophischen oder theologischen Fachbegriffen zu füllen.
  alternative: Der Schluss könnte deutender mit „von eurer unsinnigen Weltanschauung zur Besinnung kommen“ wiedergegeben werden.
  rationale: Der Text verwendet philosophisches Vokabular polemisch innerhalb einer jüdischen moralischen Argumentation. Die Übersetzung erhält diese Spannung und vermeidet eine moderne oder konfessionelle Umdeutung.
- issue: Wechsel zwischen Singular und Plural
  choice: „du“ und „eurer“ werden entsprechend dem griechischen Text nebeneinander beibehalten.
  alternative: Man könnte den Numerus im Deutschen angleichen und durchgehend „deiner“ schreiben.
  rationale: Die Unebenheit ist im Ausgangstext vorhanden und kann bewusst vom einzelnen Gesprächspartner auf seine Gemeinschaft oder Lehre ausgreifen; sie soll daher nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter rhetorischer Schärfe. Der auffällige Wechsel von der Anrede im Singular („du“) zum pluralischen Besitzpronomen („eurer“) folgt bewusst dem Griechischen. Die Gedankenstrichkonstruktion hält den langen Bedingungssatz lesbar.
