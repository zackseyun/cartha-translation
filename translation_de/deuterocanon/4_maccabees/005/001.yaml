base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/001.yaml
  text: So then[a], when the tyrant Antiochus had taken his seat with his council on a certain high place, and their fully armed troops were standing around on every side,
translation:
  language: de
  text: Nachdem nun der Tyrann Antiochus mit seinen Ratsmitgliedern auf einer Anhöhe[a] Platz genommen hatte und ihre voll bewaffneten Truppen ringsum standen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf einem gewissen erhöhten Ort“. Gemeint ist ein erhöhter Standort, nicht notwendigerweise eine kultische „Höhe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προκαθίσας
  choice: Platz genommen hatte
  rationale: Das Partizip zeichnet Antiochus als bereits in leitender Stellung sitzend; die deutsche Wendung ist natürlich und lässt den Vorrang beziehungsweise Vorsitz anklingen, ohne ihn stärker festzulegen als der griechische Ausdruck.
- source_word: γέ τοι
  choice: nun
  rationale: Die Partikelverbindung markiert und bekräftigt den Übergang zur neuen Szene. „Nun“ gibt diese Diskursfunktion im Deutschen knapp wieder.
- source_word: μετὰ τῶν συνέδρων
  choice: mit seinen Ratsmitgliedern
  rationale: σύνεδροι bezeichnet Personen, die mit Antiochus im Rat sitzen. „Ratsmitglieder“ ist konkret und vermeidet die mögliche Deutung, der Rat sei eine abstrakte Institution.
- source_word: ὁ τύραννος
  choice: der Tyrann
  rationale: Der griechische Text bezeichnet Antiochus ausdrücklich und wertend als τύραννος; die Übersetzung bewahrt diese negative Charakterisierung.
- source_word: ἐπὶ τινος ὑψηλοῦ τόπου
  choice: auf einer Anhöhe
  rationale: Die Wendung bezeichnet einen nicht näher bestimmten erhöhten Ort. „Anhöhe“ ist im Deutschen natürlich und vermeidet den kultischen Beiklang, den „Höhe“ oder „Kulthöhe“ haben könnte.
- source_word: τῶν στρατευμάτων αὐτῶν
  choice: ihre Truppen
  rationale: Der Genitiv bezeichnet die ihnen zugehörigen militärischen Verbände. Das Pronomen „ihre“ erhält den Pluralbezug des griechischen αὐτῶν.
- source_word: παρεστηκότων
  choice: standen
  rationale: Das Partizip beschreibt die Truppen als rings um die Versammelten stehend beziehungsweise bereitstehend. „Standen“ bewahrt das sichtbare Szenenbild, ohne eine ausdrücklich befohlene Stationierung hinzuzufügen.
- source_word: κυκλόθεν
  choice: ringsum
  rationale: „Ringsum“ gibt die umfassende Umstellung knapp und idiomatisch wieder.
- source_word: εὐόπλων
  choice: voll bewaffneten
  rationale: Das Adjektiv kennzeichnet die Truppen als gut beziehungsweise vollständig mit Waffen ausgerüstet und unterstreicht die bedrohliche Kulisse.
theological_decisions:
- issue: Wertende Bezeichnung des Antiochus als τύραννος
  choice: Die ausdrücklich negative Bezeichnung „der Tyrann“ bleibt im Haupttext erhalten.
  alternative: der Herrscher; der König
  rationale: Der Ausgangstext verwendet keinen neutralen Herrscher- oder Königstitel, sondern eine wertende Benennung. Eine Abschwächung würde die Rhetorik des Verfassers verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzperiode bleibt entsprechend dem griechischen, in den Folgevers hineinführenden Satz mit einem Komma offen. Der Fußnotenmarker steht unmittelbar bei der räumlichen Wendung, auf die er sich bezieht.
