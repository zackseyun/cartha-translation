lexical_decisions:
- source_word: καὶ
  choice: Als
  rationale: Die griechische Satzverknüpfung wird zusammen mit dem adverbialen Partizip in eine natürliche deutsche temporale Konstruktion überführt; ein zusätzliches „und“ wäre im Deutschen unnötig schwerfällig.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das maskuline Akkusativpronomen verweist auf die zuvor genannte Person und wird direkt mit „ihn“ wiedergegeben.
- source_word: ἰδὼν
  choice: sah
  rationale: Das adverbiale Aoristpartizip bezeichnet eine der Hauptaussage vorausgehende Wahrnehmung; „als … sah“ gibt die narrative Beziehung idiomatisch wieder.
- source_word: ὁ Ἀντίοχος
  choice: Antiochus
  rationale: Der Personenname wird in der üblichen deutschen Form ohne Artikel wiedergegeben.
- source_word: ἔφη
  choice: sagte er
  rationale: Das geläufige erzählende Redeverb wird natürlich mit „sagte er“ übersetzt; der Doppelpunkt zeigt an, dass die Rede im folgenden Vers einsetzt.
