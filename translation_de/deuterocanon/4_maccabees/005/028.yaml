  language: de
  text: 'Doch du wirst nicht so über mich lachen.[a]


    [a] Wörtlich: »Du wirst über mich nicht dieses Lachen lachen.« Die griechische Wortwiederholung bezeichnet wahrscheinlich höhnisches Lachen.'
