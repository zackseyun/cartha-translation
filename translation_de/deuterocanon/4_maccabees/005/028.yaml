lexical_decisions:
- source_word: ἀλλʼ
  choice: Doch
  rationale: Kennzeichnet den entschiedenen Gegensatz zur vorausgehenden Drohung oder Verhöhnung; »Doch« ist im Deutschen knapp und nachdrücklich.
- source_word: οὐ
  choice: nicht
  rationale: Gibt die einfache ausdrückliche Verneinung wieder, ohne sie unnötig zu verstärken.
- source_word: γελάσεις
  choice: wirst … lachen
  rationale: Bewahrt die Grundbedeutung des Futurs von γελάω. Der spöttische Sinn ergibt sich aus dem Zusammenhang und wird in der Fußnote erläutert.
- source_word: κατʼ ἐμοῦ
  choice: über mich
  rationale: Bei einem feindseligen oder höhnischen Lachen entspricht κατά mit Genitiv der natürlichen deutschen Wendung »über jemanden lachen«.
- source_word: τοῦτον τὸν γέλωτα
  choice: so
  rationale: Die wörtliche Verbindung »dieses Lachen lachen« ist im heutigen Deutsch unnatürlich. »so« nimmt den demonstrativen Nachdruck idiomatisch auf; die auffällige griechische Wortwiederholung bleibt in der Fußnote sichtbar.
