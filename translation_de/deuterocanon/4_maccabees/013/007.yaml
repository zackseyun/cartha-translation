base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/007.yaml
  text: Thus the seven-towered blessedness of the young men[a], having fortified the harbor of godliness, conquered the licentiousness of the passions.
translation:
  language: de
  text: So besiegte die siebentürmige besonnene Vernunft der jungen Männer[a], nachdem sie den Hafen der Gottesfurcht befestigt hatte, die Zügellosigkeit der Leidenschaften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist stark bildhaft. Auch möglich: „die siebentürmige Besonnenheit der jungen Männer“; sinngemäß: „die besonnene Entschlossenheit der sieben jungen Männer“. Die sieben Türme spielen wahrscheinlich auf die sieben Brüder an.'
    reason: Die ungewöhnliche Verbindung von ἑπτάπυργος und εὐλογιστία lässt sich entweder eng bildhaft oder stärker deutend wiedergeben.
lexical_decisions:
- source_word: ἑπτάπυργος
  choice: siebentürmig
  rationale: Das bildhafte Kompositum bedeutet wörtlich „mit sieben Türmen versehen“. Die ungewöhnliche Festungsmetapher bleibt erhalten und spielt wahrscheinlich auf die sieben Brüder an.
- source_word: εὐλογιστία
  choice: besonnene Vernunft
  rationale: Das seltene Substantiv bezeichnet gutes, vernünftiges Überlegen beziehungsweise eine wohlgeordnete Denkhaltung. Im philosophischen Zusammenhang des Buches passt „besonnene Vernunft“ besser als „Seligkeit“ und bewahrt den Bezug auf die Herrschaft der Vernunft über die Leidenschaften.
- source_word: νεανίσκων
  choice: der jungen Männer
  rationale: Der maskuline Plural bezeichnet die jungen Brüder; die Formulierung ist im modernen Deutsch natürlich und präzise.
- source_word: ὀχυρώσασα
  choice: nachdem sie … befestigt hatte
  rationale: Die finite Nebensatzkonstruktion gibt das vorzeitige Partizip idiomatisch wieder und erhält zugleich die militärische Befestigungsmetapher.
- source_word: λιμένα
  choice: Hafen
  rationale: Die Grundbedeutung ist „Hafen“ beziehungsweise „Zufluchtsort“. „Hafen“ erhält das konkrete Bild des griechischen Textes.
- source_word: εὐσεβείας
  choice: Gottesfurcht
  rationale: Gemeint ist die ehrfürchtige, im Gehorsam bewährte Hingabe an Gott. „Gottesfurcht“ macht den Gottesbezug deutlich, ohne bloß äußere Religiosität anzudeuten.
- source_word: παθῶν
  choice: Leidenschaften
  rationale: Im philosophisch-ethischen Zusammenhang bezeichnet πάθη die inneren Regungen und Affekte, nicht das Erleiden von Qualen.
- source_word: ἀκολασίαν
  choice: Zügellosigkeit
  rationale: Der Ausdruck meint ungehemmte Maßlosigkeit und fehlende Selbstbeherrschung; „Zügellosigkeit“ wahrt diese breite Bedeutung und verengt sie nicht auf sexuelles Fehlverhalten.
- source_word: ἐνίκησεν
  choice: besiegte
  rationale: Das Verb bezeichnet einen errungenen Sieg und führt die Wehr- und Kampfmetaphorik zum Höhepunkt.
theological_decisions:
- issue: Deutung der stark bildhaften Wendung ἡ ἑπτάπυργος τῶν νεανίσκων εὐλογιστία
  choice: die siebentürmige besonnene Vernunft der jungen Männer
  alternative: 'die von sieben Türmen geschützte Besonnenheit der jungen Männer; sinngemäß: die besonnene Entschlossenheit der sieben jungen Männer'
  rationale: Der Haupttext bewahrt sowohl die Festungsmetapher als auch den für 4 Makkabäer zentralen Gedanken vernünftiger Selbstbeherrschung. Die Fußnote weist darauf hin, dass die sieben Türme wahrscheinlich die sieben Brüder darstellen, ohne diese Deutung in den Text einzutragen.
- issue: Wiedergabe von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit; Gottesverehrung
  rationale: Der Begriff bezeichnet in 4 Makkabäer die ehrfürchtige Treue zu Gott und seinem Gesetz. „Gottesfurcht“ hält den theologischen Bezug ausdrücklich fest und ist in diesem feierlichen Kontext verständlich.
translation_notes:
  register: Gehobenes, aber verständliches modernes Standarddeutsch. Die dichte Festungs-, Hafen- und Siegesmetaphorik des griechischen Satzes bleibt bewusst erhalten; die ungewöhnliche Formulierung „siebentürmige besonnene Vernunft“ entspricht der rhetorischen Kühnheit des Originals.
