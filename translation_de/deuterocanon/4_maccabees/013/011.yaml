    rationale: »in edler Haltung« wirkt im heutigen Deutsch steif und bezeichnet eher eine äußere Haltung als die ehrenhafte Art des Ausharrens. »in Würde« verbindet sich idiomatisch mit »standhalten« und gibt den Kontextwert sicher wieder.
