  yaml_path: translation/deuterocanon/4_maccabees/013/011.yaml
  text: And one said[a], “Take courage, brother,” while another said, “Endure nobly.”
translation:
  language: de
  text: 'Und der eine sagte[a]: »Fass Mut, Bruder!«, der andere aber: »Halte stand in Würde!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Der eine sagte … der andere aber …«; gemeint sind aufeinanderfolgende Sprecher unter den Brüdern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρρει
  choice: Fass Mut
  rationale: Der Imperativ fordert unmittelbar zu Mut und Zuversicht auf. »Fass Mut« ist im heutigen Deutsch natürlich und bewahrt den ermutigenden Charakter.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Der maskuline Singular im Vokativ bezeichnet in diesem Zusammenhang die direkte Anrede eines leiblichen Bruders.
- source_word: Εὐγενῶς
  choice: in edler Haltung
  rationale: Das Adverb bezeichnet ein ehrenhaftes, charakterlich edles Ertragen. »In edler Haltung« bewahrt diesen ethischen und vom Ehrbegriff geprägten Sinn besser als das enger auf Tapferkeit bezogene »mutig«.
- source_word: καρτέρησον
  choice: Halte stand
  rationale: Der Aoristimperativ von καρτερέω ruft zu standhaftem Ausharren unter Leiden auf. »Halte stand« ist knapp, idiomatisch und überdeutet den Zusammenhang nicht.
- source_word: ὁ μέν ... ὁ δέ
  choice: der eine ... der andere
  rationale: Die korrelative Konstruktion stellt zwei aufeinanderfolgende Sprecher einander gegenüber, ohne ein Substantiv ausdrücklich zu wiederholen.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Obwohl der Imperfekt einen andauernden oder wiederholten Vorgang ausdrücken kann, ist »sagte« in dieser knappen Folge direkter Ermutigungen die natürliche deutsche Erzählform.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; »in edler Haltung« erhält die ethisch-ehrenhafte Bedeutung von εὐγενῶς, ohne sie auf bloße Tapferkeit zu verengen.
