base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/003.yaml
  text: But now it is not so; rather[a], by the reasoning that is praised by God, they overcame the passions.
translation:
  language: de
  text: Nun aber ist es nicht so. Vielmehr überwanden sie die Leidenschaften durch die vernünftige Überlegung, die bei Gott Anerkennung findet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »durch die von Gott gelobte Vernunft« oder »durch das von Gott anerkannte vernünftige Urteil«. Das griechische Wort kann Vernunft, vernünftige Überlegung oder rationales Urteil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nun aber
  rationale: Markiert knapp und natürlich den Gegensatz zum zuvor beschriebenen Sachverhalt.
- source_word: οὐχ οὕτως
  choice: ist es nicht so
  rationale: Bewahrt die elliptische Formulierung des Griechischen, ohne den unausgesprochenen Vergleich näher festzulegen.
- source_word: ἀλλὰ
  choice: Vielmehr
  rationale: Bringt nach der Verneinung den korrigierenden Gegensatz idiomatisch zum Ausdruck.
- source_word: τῷ ἐπαινουμένῳ λογισμῷ
  choice: durch die vernünftige Überlegung, die … Anerkennung findet
  rationale: Der Dativ wird instrumental wiedergegeben. »Vernünftige Überlegung« erfasst λόγισμος als tätiges, sittlich ausgerichtetes Urteilen und bleibt zugleich allgemein verständlich.
- source_word: παρὰ θεῷ
  choice: bei Gott
  rationale: Die Wendung bezeichnet hier Gottes positive Beurteilung; »bei Gott Anerkennung findet« ist natürliches Deutsch und bewahrt gegenüber dem eindeutig agentiven »von Gott gelobt« etwas von der relationalen Weite der griechischen Präposition.
- source_word: περιεγένοντο
  choice: überwanden sie
  rationale: Gibt den errungenen Sieg über widerstreitende Kräfte klar und prägnant wieder.
- source_word: τῶν παθῶν
  choice: die Leidenschaften
  rationale: πάθη bezeichnet im philosophischen Gedankengang des Buches die von der Vernunft zu beherrschenden Leidenschaften oder inneren Regungen, nicht nur äußere Leiden.
theological_decisions:
- issue: Wiedergabe des programmatischen Begriffs λόγισμος
  choice: vernünftige Überlegung
  alternative: Vernunft; vernünftiges Urteil
  rationale: Die Formulierung bewahrt den aktiven Vorgang sittlicher Abwägung, ohne den Begriff auf eine bloße menschliche Fähigkeit oder auf einen technischen philosophischen Terminus zu verengen.
- issue: Bedeutung von παρὰ θεῷ bei ἐπαινουμένῳ
  choice: die bei Gott Anerkennung findet
  alternative: die von Gott gelobt wird; die vor Gott Anerkennung findet
  rationale: Die gewählte Fassung lässt Gott als anerkennenden Beurteiler erkennen, ohne die semantisch mögliche relationale Bedeutung der Präposition unnötig zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz bewahrt die knappe Ellipse des Griechischen; der zweite verwendet eine geläufige Satzstellung und hält am philosophischen Leitbegriff »Leidenschaften« fest.
