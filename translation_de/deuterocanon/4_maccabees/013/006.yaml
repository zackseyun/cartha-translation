  yaml_path: translation/deuterocanon/4_maccabees/013/006.yaml
  text: For just as towers on harbor breakwaters[a], beating back the threats of the waves, provide a calm harbor for those sailing in,
translation:
  language: de
  text: Denn wie Türme auf Hafenmolen die Drohungen der Wellen zurückschlagen und denen, die einlaufen, einen ruhigen Ankerplatz[a] bieten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen ruhigen Hafen“. Das griechische Wort kann einen Hafen, Ankerplatz oder geschützten Zufluchtsort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Denn wie
  rationale: Bewahrt sowohl den begründenden Anschluss durch γάρ als auch den einleitenden Vergleich durch καθάπερ in natürlichem Deutsch.
- source_word: προβλῆτες λιμένων πύργοι
  choice: Türme auf Hafenmolen
  rationale: προβλῆτες bezeichnet hier vorspringende Schutzbauten wie Molen oder Wellenbrecher; die Formulierung erhält das konkrete Bild von Türmen an den Hafenbefestigungen.
- source_word: τὰς κυμάτων ἀπειλάς
  choice: die Drohungen der Wellen
  rationale: Die wörtliche Wiedergabe von ἀπειλάς bewahrt die Personifikation und die bedrohliche Kraft der Wellen.
- source_word: ἀνακόπτοντες
  choice: zurückschlagen
  rationale: Das Partizip bezeichnet ein aktives Aufhalten oder Zurückdrängen und passt zum Bild der abwehrenden Türme.
- source_word: γαληνὸν παρέχουσιν … τὸν ὅρμον
  choice: einen ruhigen Ankerplatz bieten
  rationale: γαληνός bezeichnet besonders die Ruhe des Meeres; ὅρμος kann einen Hafen oder Ankerplatz meinen. Die Wendung ist im Deutschen klar und behält das maritime Bild bei.
- source_word: τοῖς εἰσπλέουσιν
  choice: denen, die einlaufen
  rationale: Gibt den substantivierten Präsenspartizipialausdruck natürlich wieder und bewahrt den Vorgang des Einlaufens in den geschützten Bereich.
