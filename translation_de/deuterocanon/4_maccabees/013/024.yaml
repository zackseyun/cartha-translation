base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/024.yaml
  text: For they had a firmer harmony with one another[a]; for, having been trained by the same law, having practiced the same virtues, and having been brought up in a righteous way of life[b], they were drawn more closely together.
translation:
  language: de
  text: Denn ihre Eintracht untereinander war fester[a]. Sie waren ja durch dasselbe Gesetz erzogen worden, hatten dieselben Tugenden eingeübt und waren in einer gerechten Lebensführung aufgewachsen. Dadurch wurden sie noch enger miteinander verbunden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie hatten eine stärkere Eintracht untereinander.«'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Schlusswendung ist stark verdichtet. Gemeint ist, dass ihre gemeinsame Prägung durch Gesetz, Tugend und gerechte Lebensführung sie noch enger miteinander verband.
    reason: alternative_reading
lexical_decisions:
- source_word: θέστερον
  choice: fester
  rationale: Die Komparativform bezeichnet eine größere Festigkeit oder Beständigkeit. „Fester“ bewahrt den Vergleich und passt im Deutschen natürlich zu „Eintracht“.
- source_word: ὁμόνοιαν
  choice: Eintracht
  rationale: Ὁμόνοια bezeichnet Übereinstimmung im Denken und gegenseitigen Zusammenhalt. „Eintracht“ gibt diesen gemeinschaftlichen Sinn würdig und prägnant wieder.
- source_word: νόμῳ τῷ αὐτῷ
  choice: durch dasselbe Gesetz
  rationale: Νόμος bezieht sich im Kontext des 4. Makkabäerbuchs auf das gemeinsame jüdische Gesetz. Die schlichte Wiedergabe „Gesetz“ wahrt die Formulierung des Ausgangstextes, ohne den Bezug auslegend auszuschreiben.
- source_word: παιδευθέντες
  choice: erzogen worden
  rationale: Das Verb umfasst Unterweisung, Erziehung und disziplinierende Formung. „Erzogen worden“ passt zum gemeinsamen Heranwachsen der Brüder und bleibt allgemein verständlich.
- source_word: ἐξασκήσαντες
  choice: eingeübt
  rationale: Das Verb beschreibt beharrliche Übung oder Schulung. „Eingeübt“ bringt den aktiven und wiederholten Vollzug der Tugenden zum Ausdruck.
- source_word: ἀρετάς
  choice: Tugenden
  rationale: Im hellenistisch-ethischen Sprachgebrauch bezeichnet ἀρεταί moralische Tugenden oder Vorzüge. „Tugenden“ ist hier die klare und etablierte Entsprechung.
- source_word: τῷ δικαίῳ ... βίῳ
  choice: in einer gerechten Lebensführung
  rationale: Die Wendung bezeichnet die sittlich rechte Weise des Lebens. „Gerechte Lebensführung“ wahrt den ethischen Gehalt und klingt natürlicher als das wörtlichere „gerechte Leben“.
- source_word: συντραφέντες
  choice: aufgewachsen
  rationale: Das Partizip bezeichnet gemeinsames Aufziehen oder Heranwachsen. „Aufgewachsen“ ist idiomatisch; der gemeinschaftliche Aspekt ergibt sich aus den parallelen Aussagen und dem Zusammenhang.
- source_word: μᾶλλον ἐφʼ αὐτοὺς ἤγαγον
  choice: Dadurch wurden sie noch enger miteinander verbunden
  rationale: 'Die griechische Schlusswendung ist stark verdichtet. Die deutsche Formulierung macht den aus den vorangehenden Partizipien hervorgehenden Sinn verständlich: Ihre gemeinsame Prägung verstärkte ihre gegenseitige Verbundenheit.'
theological_decisions:
- issue: Bedeutung von „Gesetz“ in einem jüdischen Märtyrertext
  choice: „dasselbe Gesetz“ bezeichnet das gemeinsame jüdische Gesetz, durch das die Brüder geprägt wurden
  alternative: ein allgemeines moralisches Gesetz
  rationale: Im 4. Makkabäerbuch bezeichnet νόμος regelmäßig das überlieferte jüdische Gesetz. Die Übersetzung belässt es bei „Gesetz“ und vermeidet sowohl eine Verallgemeinerung als auch eine erklärende Erweiterung im Haupttext.
- issue: Ursache der engeren Verbundenheit
  choice: Die gemeinsame Erziehung im Gesetz, Tugendübung und gerechte Lebensführung führten zu engerer gegenseitiger Verbundenheit
  alternative: Die Schlusswendung als eigenständige, nicht auf die vorherigen Partizipien bezogene Aussage wiederzugeben
  rationale: Die verdichtete griechische Syntax verbindet die gemeinsame sittliche Prägung mit der verstärkten Eintracht. Die Übersetzung stellt diesen Zusammenhang verständlich dar, ohne eine zusätzliche theologische Ursache einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde leicht gegliedert, um die gedrängte griechische Partizipialkonstruktion verständlich wiederzugeben. „Eintracht“, „Tugenden“ und „Lebensführung“ bewahren den ethischen Ton des hellenistisch-jüdischen Textes, ohne altertümlich zu wirken.
