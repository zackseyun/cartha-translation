lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: Das Adverb bezeichnet Art, Weise oder Folgerung; „so“ bewahrt seine knappe verbindende Funktion, ohne den fragmentarischen Zusammenhang auszudeuten.
- source_word: παθόντας
  choice: nachdem wir gelitten haben
  rationale: Der Aoristpartizip von πάσχω bezeichnet erlittenes Leiden. Zusammen mit ἡμᾶς wird die griechische Akkusativ-Partizipialkonstruktion idiomatisch als deutscher Nebensatz wiedergegeben.
- source_word: ἡμᾶς
  choice: wir
  rationale: Das griechische Akkusativpronomen gehört zur Partizipialkonstruktion; im deutschen Nebensatz steht dafür das Subjekt „wir“.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Übliche deutsche Namensform des Patriarchen.
- source_word: καὶ
