  footnotes:
  - marker: a
    text: 'Der überlieferte griechische Text lautet ἀφʼ οὗ, formal „seit/seitdem“ oder „von dem“, im Singular. Der Anschluss an die pluralischen „Quellen“ ist daher syntaktisch schwierig. Möglich ist, unter Annahme einer abweichenden Lesart ἀφʼ ὧν, auch: „von denen sie gemeinsam genährt werden“ bzw. „von denen sie gemeinsam aufgezogen werden“.'
