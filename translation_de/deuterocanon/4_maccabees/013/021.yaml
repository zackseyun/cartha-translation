lexical_decisions:
- source_word: ψυχῆς τελεσφορηθέντες
  choice: an der Seele zur vollen Reife gebracht
  rationale: Der Genitiv ψυχῆς bezeichnet wahrscheinlich den Bereich, in dem die Vollendung beziehungsweise Reife eintritt. Die Formulierung bewahrt sowohl den passiven Sinn als auch den ausdrücklichen Bezug auf die Seele, ohne das theologisch stärker besetzte „vervollkommnet“ zu verwenden.
- source_word: διὰ τῶν ἴσων ... χρόνων
  choice: nach gleich langen Zeiträumen
  rationale: Im Zusammenhang mit ἀποτεχθέντες bezeichnet die Wendung gleich lange Zeitspannen bis zur Geburt. „Nach“ gibt diesen zeitlichen Verlauf im Deutschen natürlicher wieder als ein wörtliches „durch“.
- source_word: ἀποτεχθέντες
  choice: zur Welt gebracht
  rationale: Das passive Partizip bezeichnet das Geboren- beziehungsweise Hervorgebrachtwerden und hält zugleich die mütterliche Bildwelt des Satzes fest.
- source_word: γαλακτοποτοῦντες
  choice: Milch ... trinkend
  rationale: Das Kompositum bedeutet „Milch trinken“. Die partizipiale Form bleibt erhalten, weil der Vers ein fortlaufendes Satzfragment bildet.
- source_word: ἀπὸ τῶν αὐτῶν ... πηγῶν
  choice: aus denselben Quellen
  rationale: πηγή bezeichnet wörtlich eine Quelle. Die bildhafte Umschreibung der mütterlichen Milchquelle wird bewahrt, ohne ausdrücklich „Brüste“ in den Text einzutragen.
- source_word: ἀφʼ οὗ συντρέφονται
  choice: seit sie gemeinsam aufgezogen werden
  rationale: Das überlieferte ἀφʼ οὗ ist formal eine zeitliche Wendung („seit“), während συντρέφονται gemeinsames Ernährt- oder Aufgezogenwerden bezeichnet. Die Übersetzung folgt dieser belegten Form, obwohl der Anschluss schwierig ist.
