  naturalness: „An der Seele“ ist im heutigen Deutschen weniger idiomatisch als „in der Seele“. „Nach gleich langen Zeiträumen zur Welt gebracht“ klingt zudem, als seien die Zeiträume der Vorgang der Geburt; „nach gleich langer Zeit“ gibt die zeitliche Vergleichsaussage klarer wieder. Der abschließende temporale Anschluss bleibt notwendigerweise etwas gespannt, kann aber mit „seitdem“ verständlicher formuliert werden.
