  terminology: „Gottesfürchtige Vernunft“ gibt den programmatischen Ausdruck εὐσεβὴς λογισμός transparent wieder; „Leidenschaften“ bewahrt die moralphilosophische Bedeutung von πάθη. Die Fußnote zu αὐτόδεσπότος sollte nicht so formuliert sein, als stünde die Wendung „aus eigener Macht“ selbst im Griechischen, sondern die Bedeutung des Adjektivs erläutern.
