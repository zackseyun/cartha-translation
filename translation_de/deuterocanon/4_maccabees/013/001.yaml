base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/001.yaml
  text: Therefore[a], since the seven brothers looked down on pains even to death[c][b], it is acknowledged from every side that godly reason is sovereign over the passions.
translation:
  language: de
  text: Da nun die sieben Brüder die Qualen bis hin zum Tod gering achteten[a], wird von allen Seiten anerkannt, dass die gottesfürchtige Vernunft[b] aus sich selbst heraus über die Leidenschaften herrscht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Leiden bis zum Tod verachteten“. Das griechische Verb beschreibt, dass sie die Qualen als ihrer Beachtung nicht wert ansahen.'
    reason: lexical_alternative
  - marker: b
    text: „Gottesfürchtige Vernunft“ kann auch mit „fromme Vernunft“ oder „von Gottesfurcht geprägtes Denken“ wiedergegeben werden. Der Ausdruck ist ein Leitbegriff des Buches.
    reason: lexical_alternative
  - marker: c
    text: Das griechische Adjektiv kann die Nuance eigenständiger oder uneingeschränkter Herrschaft tragen. „Leidenschaften“ meint hier vor allem Triebe und Affekte, nicht Gefühle schlechthin.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ τοίνυν
  choice: Da nun
  rationale: Die Verbindung leitet eine Folgerung aus dem zuvor Dargelegten ein; „Da nun“ bindet zugleich den begründenden Nebensatz natürlich an den Hauptsatz.
- source_word: τῶν μέχρι θανάτου πόνων
  choice: die Qualen bis hin zum Tod
  rationale: πόνοι bezeichnet hier die erlittenen Schmerzen und Qualen; μέχρι θανάτου beschreibt ihre äußerste Reichweite bis zum Tod.
- source_word: ὑπερεφρόνησαν
  choice: gering achteten
  rationale: Das Verb bezeichnet die überlegene Missachtung dessen, was man für nicht beachtenswert hält. „Gering achten“ bewahrt diesen Sinn, ohne die im Deutschen oft moralisch zugespitzte Färbung von „verachten“ aufzuzwingen.
- source_word: οἱ ἑπτὰ ἀδελφοί
  choice: die sieben Brüder
  rationale: Der maskuline Plural bezeichnet im Erzählzusammenhang die sieben männlichen Brüder.
- source_word: συνομολογεῖται ἀπανταχόθεν
  choice: wird von allen Seiten anerkannt
  rationale: Die passive Form drückt gemeinsame Anerkennung aus; ἀπανταχόθεν erweitert sie ausdrücklich auf alle Seiten beziehungsweise Kreise.
- source_word: αὐτόδεσπότος
  choice: aus eigener Macht … herrscht
  rationale: Das seltene Adjektiv bezeichnet eine Herrschaft, die in sich selbst gründet. Die Formulierung bewahrt sowohl das αὐτο-Element als auch den Gedanken wirklicher Herrschaft, ohne ein schwer verständliches deutsches Kompositum zu bilden.
- source_word: τῶν παθῶν
  choice: über die Leidenschaften
  rationale: πάθη bezeichnet im moralphilosophischen Gedankengang des Buches Triebe und Affekte, die der Lenkung bedürfen, nicht bloß Gefühle im allgemeinen Sinn.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  rationale: λογισμός meint vernünftiges Urteilen, während εὐσεβής dieses als von Ehrfurcht vor Gott geprägt kennzeichnet. Die Formulierung erhält beide Seiten des programmatischen Ausdrucks.
theological_decisions:
- issue: Wiedergabe des programmatischen Ausdrucks εὐσεβὴς λογισμός
  choice: die gottesfürchtige Vernunft
  alternative: die fromme Vernunft; das von Gottesfurcht geprägte Denken
  rationale: Die Aussage betrifft keine religiös neutrale Rationalität, sondern eine durch Ehrfurcht vor Gott bestimmte Vernunft. „Gottesfürchtig“ macht diese Ausrichtung transparent, ohne sie konfessionell näher zu bestimmen.
- issue: Eigenständige Herrschaft der Vernunft in αὐτόδεσπότος
  choice: aus eigener Macht über die Leidenschaften herrscht
  alternative: Herrin über die Leidenschaften ist; selbstmächtig über die Leidenschaften herrscht
  rationale: Die ungewöhnlich starke Aussage des griechischen αὐτόδεσπότος wird nicht abgeschwächt. Zugleich vermeidet „aus eigener Macht“ die negative moderne Nebenbedeutung von „eigenmächtig“; eine Fußnote hält die mögliche Nuance der Selbstherrschaft offen.
- issue: Bedeutung von πάθη
  choice: Leidenschaften
  alternative: Affekte; Triebe
  rationale: „Leidenschaften“ wahrt den moralphilosophischen Schlüsselbegriff und bezeichnet hier nicht pauschal alle Gefühle, sondern antreibende Affekte und Impulse, über die Vernunft herrschen soll.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der griechischen Folgerungsstruktur, bleibt aber idiomatisch. Schlüsselbegriffe des moralphilosophischen Arguments werden beibehalten und durch knappe Fußnoten erläutert.
