base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/009.yaml
  text: Let us die as brothers[a], brothers, for the sake of the law; let us imitate the three young men in Syria[b], who despised the furnace of equal torment.
translation:
  language: de
  text: Lasst uns brüderlich sterben, Brüder, um des Gesetzes willen; lasst uns die drei jungen Männer in Syrien[a] nachahmen, die den Feuerofen einer vergleichbaren Bedrängnis[b] verachteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die drei jüdischen jungen Männer aus Daniel 3. Der griechische Text sagt hier ausdrücklich „in Syrien“; deshalb wird die Angabe nicht zu dem aus Daniel vertrauten „Babylon“ geändert.
    reason: cross_reference
  - marker: b
    text: Das griechische Adjektiv ist selten und schwer zu deuten. Es bezeichnet offenbar eine Gleichheit oder Vergleichbarkeit, doch sein genauer Bezug ist unsicher. Daher sind auch Wiedergaben wie „gleichartige Bedrängnis“ oder „vergleichbarer Feuerofen“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφικῶς
  choice: als Brüder
  rationale: Das Adverb bezeichnet hier die geschwisterliche Weise beziehungsweise solidarische Haltung beim Sterben. „Als Brüder“ ist natürlich und bewahrt zusammen mit der folgenden Anrede die bewusste Wiederholung.
- source_word: ἀποθάνωμεν
  choice: Lasst uns … sterben
  rationale: Der Aorist Konjunktiv ist hortativ; die deutsche Form gibt den gemeinsamen Aufruf unmittelbar wieder.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Angeredet sind in der Erzählung leibliche männliche Geschwister; daher ist die geschlechtsspezifische Wiedergabe sachlich angemessen.
- source_word: περὶ τοῦ νόμου
  choice: um des Gesetzes willen
  rationale: περί mit Genitiv bezeichnet hier den Grund beziehungsweise das Anliegen des Sterbens. Die Formulierung bringt die Treue zum Gesetz würdig und prägnant zum Ausdruck.
- source_word: μιμησώμεθα
  choice: lasst uns … nachahmen
  rationale: Auch dies ist ein hortativer Konjunktiv. „Nachahmen“ erhält den ausdrücklichen Gedanken der Nachahmung, statt ihn zu einer bloßen Erinnerung abzuschwächen.
- source_word: τοὺς τρεῖς τοὺς ἐπὶ τῆς Συρίας νεανίσκους
  choice: die drei jungen Männer in Syrien
  rationale: Die Wiedergabe folgt der ausdrücklichen Ortsangabe des griechischen Textes und harmonisiert sie nicht mit der geläufigeren Ortsangabe Babylon aus Daniel 3.
- source_word: ἰσοπαίδος
  choice: ebenso qualvollen
  rationale: Das seltene und schwer deutbare Adjektiv scheint den Feuerofen als dem gegenwärtigen Leiden vergleichbar zu kennzeichnen. Die flüssige Wiedergabe lässt den Vergleichsmaßstab unausgesprochen; eine Fußnote weist auf die lexikalische Unsicherheit hin.
- source_word: καμίνου
  choice: Feuerofen
  rationale: „Feuerofen“ ist im Deutschen die geläufige und im Daniel-Bezug klare Bezeichnung für κάμινος.
- source_word: κατεφρόνησαν
  choice: verachteten
  rationale: Das Verb bezeichnet geringschätzige Missachtung und bewahrt so die rhetorische Stärke des griechischen Ausdrucks.
theological_decisions:
- issue: Anspielung auf Daniel 3 und geografische Angabe
  choice: die drei jungen Männer in Syrien
  alternative: die drei jungen Männer in Babylon
  rationale: Da der griechische Ausgangstext ausdrücklich Syrien nennt, wird diese Angabe trotz der bekannten babylonischen Szenerie in Daniel 3 nicht stillschweigend harmonisiert.
- issue: Geschlechtsspezifische Wiedergabe von ἀδελφοί
  choice: Brüder
  alternative: Geschwister
  rationale: Der erzählte Personenkreis besteht aus leiblichen Brüdern; „Brüder“ ist deshalb genauer als eine geschlechtsneutrale Bezeichnung.
- issue: Deutung von ἰσοπαίδος
  choice: ebenso qualvollen
  alternative: vergleichbaren / gleichartigen
  rationale: Die Übersetzung deutet das seltene Adjektiv vorsichtig als Vergleich der Bedrängnis, ohne den unklaren Vergleichsmaßstab im Haupttext festzulegen. Die echte lexikalische Unsicherheit wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die doppelte Anrede „als Brüder … Brüder“ bleibt trotz ihrer rhetorischen Auffälligkeit erhalten, weil sie die geschwisterliche Solidarität des griechischen Textes betont. Das Semikolon bildet den engen Zusammenhang der beiden gemeinsamen Aufforderungen ab.
