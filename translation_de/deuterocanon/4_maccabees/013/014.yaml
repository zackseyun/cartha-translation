  text: Let us not fear the one who seems to kill[a].
translation:
  language: de
  text: Fürchten wir uns nicht vor dem, der zu töten scheint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der den Anschein erweckt, töten zu können«; auch möglich: »der für fähig gehalten wird zu töten«. Das Griechische hebt den bloßen Anschein seiner Macht hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῶμεν
  choice: Fürchten wir uns nicht
  rationale: Der mit μή verneinte Hortativ im Konjunktiv der ersten Person Plural wird als gemeinsame Aufforderung wiedergegeben. Die Formulierung ist im Deutschen natürlich und bewahrt den nachdrücklichen Aufforderungscharakter.
- source_word: τὸν δοκοῦντα
  choice: vor dem, der … scheint
  rationale: δοκέω bedeutet hier am ehesten »scheinen« oder »den Anschein haben«. Die Wiedergabe lässt offen, ob die Macht des Verfolgers nur scheinbar ist oder ob er als jemand wahrgenommen wird, der töten kann.
- source_word: ἀποκτενεῖν
  choice: zu töten
  rationale: Der Infinitiv bezeichnet das Töten unmittelbar und ohne die zusätzliche rechtliche oder feierliche Färbung von »hinrichten« beziehungsweise »zu Tode bringen«.
theological_decisions:
- issue: Scheinbare gegenüber tatsächlicher Macht in τὸν δοκοῦντα ἀποκτενεῖν
  choice: der zu töten scheint
  alternative: der den Anschein erweckt, töten zu können; der für fähig gehalten wird zu töten
  rationale: Die Formulierung bewahrt den naheliegenden Sinn von δοκέω als »scheinen«, ohne im Haupttext ausdrücklich zu ergänzen, worin die Begrenzung der Macht des Verfolgers besteht. So bleibt die Spannung zwischen tatsächlichem körperlichem Töten und nur vermeintlich endgültiger Macht erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der gemeinsame Aufforderungston ist knapp und verständlich; die bewusst etwas spannungsreiche Wendung »zu töten scheint« folgt der Mehrdeutigkeit des Griechischen.
