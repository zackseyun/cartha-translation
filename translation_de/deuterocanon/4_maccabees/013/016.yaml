  text: Therefore, let us arm ourselves with the mastery over passions that comes from godly reason.
translation:
  language: de
  text: Darum wollen wir uns mit der Herrschaft über die Leidenschaften wappnen, die aus der auf Gott ausgerichteten Vernunft kommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit der Herrschaft der göttlichen Vernunft über die Leidenschaften«.'
    reason: Bewahrt die mögliche engere, attributive Zuordnung des griechischen Genitivs τοῦ θείου λογισμοῦ.
lexical_decisions:
- source_word: καθοπλισώμεθα
  choice: wollen wir uns ... wappnen
  rationale: Der hortative Konjunktiv der 1. Person Plural wird als gemeinsame Aufforderung wiedergegeben; »wappnen« bewahrt das militärische Bild.
- source_word: τοιγαροῦν
  choice: Darum
  rationale: Die Folgerungspartikel zieht eine nachdrückliche Konsequenz aus dem Vorangehenden; »Darum« ist idiomatisch und würdevoll.
- source_word: τῇ ... παθοκρατίᾳ
  choice: mit der Herrschaft über die Leidenschaften
  rationale: Der Dativ bezeichnet das Mittel der Ausrüstung. »Herrschaft über die Leidenschaften« wahrt den Sinn des seltenen Kompositums als wirksame Beherrschung, nicht als bloße Unterdrückung.
- source_word: τοῦ θείου λογισμοῦ
  choice: die aus der auf Gott ausgerichteten Vernunft kommt
  rationale: Die Formulierung versteht den Genitiv als Herkunft bzw. Wirkursache, lässt aber durch eine Fußnote die formal mögliche attributive Zuordnung erkennen.
- source_word: θείου
  choice: auf Gott ausgerichteten
  rationale: Im jüdisch-ethischen Zusammenhang bezeichnet das Adjektiv die religiöse Prägung der Vernunft. Die Wiedergabe vermeidet sowohl eine Vergöttlichung menschlicher Vernunft als auch einen unpersönlich-metaphysischen Klang.
- source_word: λογισμοῦ
  choice: Vernunft
  rationale: λογισμός bezeichnet im Werk das vernünftige sittliche Urteilsvermögen, das die Leidenschaften regiert; »Vernunft« ist dafür die klare und knappe deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe von θεῖος λογισμός im jüdisch-moralphilosophischen Zusammenhang
  choice: auf Gott ausgerichtete Vernunft
  alternative: göttliche Vernunft
  rationale: Die gewählte Formulierung bewahrt die religiös-ethische Ausrichtung, ohne der menschlichen Vernunft selbst Göttlichkeit zuzuschreiben oder spätere metaphysische beziehungsweise christologische Vorstellungen einzutragen.
- issue: Beziehung des Genitivs τοῦ θείου λογισμοῦ zu παθοκρατίᾳ
  choice: Herrschaft, die aus der auf Gott ausgerichteten Vernunft kommt
  alternative: Herrschaft der göttlichen Vernunft über die Leidenschaften
  rationale: Der Genitiv kann Herkunft, Wirkursache oder nähere Zugehörigkeit ausdrücken. Der Haupttext macht die im Kontext naheliegende Herkunftsbeziehung lesbar; die Fußnote erhält die genuine strukturelle Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. Das Verb »wappnen« hält die Kampfmetapher lebendig; »Leidenschaften« entspricht dem ethischen Sprachgebrauch des Werkes.
