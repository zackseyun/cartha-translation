  text: It is impossible to overlook the rule of reason[a], for they prevailed over both passion and pains.
translation:
  language: de
  text: Die Herrschaft der Vernunft[a] lässt sich nicht übersehen; denn sie waren stärker als Leidenschaft und Schmerzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Verstandes“. Das griechische Wort kann das Denken, den Verstand oder die Einsicht bezeichnen; hier steht wahrscheinlich die vernünftige Urteilskraft im Vordergrund, die über die Leidenschaften herrscht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν παριδεῖν
  choice: ist nicht zu übersehen
  rationale: Die unpersönliche Konstruktion mit Infinitiv bezeichnet, dass etwas nicht übergangen oder außer Acht gelassen werden kann. Die deutsche Formulierung ist idiomatisch und wahrt den argumentativen Ton.
- source_word: τὴν ἡγεμονίαν
  choice: die Herrschaft
  rationale: ἡγεμονία bezeichnet Leitung, Herrschaft oder bestimmende Macht. „Herrschaft“ bringt hier die leitende Macht der Vernunft knapp und würdig zum Ausdruck.
- source_word: τῆς διανοίας
  choice: der Vernunft
  rationale: διάνοια kann Denken, Verstand oder geistiges Urteilsvermögen bezeichnen. Im philosophischen Gedankengang des Buches steht besonders die vernünftige Urteilsfähigkeit im Vordergrund.
- source_word: ἐπεκράτησαν
  choice: sie waren stärker als
  rationale: Das Verb bezeichnet das Überlegen- oder Stärkersein gegenüber etwas. Diese Wiedergabe folgt eng der Grundbedeutung und lässt den Rückschluss von ihrem Verhalten auf die Herrschaft der Vernunft erkennen.
- source_word: πάθους
  choice: Leidenschaft
  rationale: πάθος bezeichnet hier die innere Leidenschaft beziehungsweise den irrationalen Impuls, nicht allgemein körperliches Leiden.
- source_word: πόνων
  choice: Schmerzen
  rationale: πόνοι verweist in diesem Zusammenhang auf die körperlichen Schmerzen der Misshandlung. Der deutsche Plural entspricht der griechischen Form und bleibt unmittelbar.
theological_decisions:
- issue: Wiedergabe von διάνοια innerhalb der These von der Herrschaft vernünftigen Urteilens über innere Regungen
  choice: Vernunft
  alternative: Verstand; Denken
  rationale: „Vernunft“ macht die ethisch-philosophische Funktion der διάνοια deutlich, ohne eine spätere konfessionelle Anthropologie einzutragen. Die mögliche weitere Bedeutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe argumentierende Satzbau und die philosophische Spannung zwischen Vernunft, Leidenschaft und körperlichem Schmerz bleiben erhalten.
