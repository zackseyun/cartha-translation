  yaml_path: translation/deuterocanon/4_maccabees/013/002.yaml
  text: For just as those enslaved to their passions ate delicacies—for we said that they had been conquered by these things—[a]
translation:
  language: de
  text: Denn ebenso wie diejenigen, die ihren Leidenschaften versklavt waren, üppige Speisen aßen – wir sagten ja, dass sie von diesen besiegt worden waren –, [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kostbare Speisen aßen“ beziehungsweise „genussvoll lebten“; das seltene griechische Verb bezeichnet verfeinerten, üppigen Genuss, besonders beim Essen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn ebenso wie
  rationale: „Denn“ bewahrt die begründende Kraft von γάρ, „ebenso wie“ die vergleichende Funktion von ὥσπερ. Der offene Vergleich bleibt als Teil des fortlaufenden Satzes erhalten.
- source_word: τοῖς πάθεσιν δουλωθέντες
  choice: die ihren Leidenschaften versklavt waren
  rationale: Im ethisch-philosophischen Zusammenhang bezeichnet πάθη die Leidenschaften oder inneren Triebe, nicht äußere Leiden. „Versklavt“ erhält das starke Bild der Unfreiheit in δουλόω.
- source_word: ἡμεροφάγησαν
  choice: üppige Speisen aßen
  rationale: Das seltene Verb bezeichnet ein verfeinertes, genussorientiertes oder luxuriöses Essen. Die Formulierung bleibt konkret auf den Verzehr bezogen und ist im heutigen Deutsch verständlich.
- source_word: ἐλέγομεν γὰρ
  choice: wir sagten ja
  rationale: Das Imperfekt wird im Rückverweis idiomatisch mit „sagten“ wiedergegeben; „ja“ vermittelt die erinnernde und begründende Nuance von γάρ innerhalb des Einschubs.
- source_word: τούτοις νενικῆσθαι
  choice: dass sie von ihnen besiegt worden waren
  rationale: „Von ihnen“ verweist grammatisch auf die zuvor genannten Leidenschaften. Das Plusquamperfekt bildet den resultativen Sinn des griechischen Perfektinfinitivs ab, während „besiegt“ das Bild von Sieg und Niederlage bewahrt.
theological_decisions:
- issue: Ethisch-psychologischer Sinn von πάθη
  choice: Leidenschaften
  alternative: Leiden; Gefühle; Begierden
  rationale: Der Gedankengang des 4. Makkabäerbuchs behandelt das Verhältnis von vernünftiger Einsicht und Leidenschaften. „Leidenschaften“ wahrt diesen philosophisch-ethischen Begriff, ohne ihn konfessionell zu verengen.
- issue: Stärke des Bildes in δουλωθέντες
  choice: versklavt
  alternative: unterworfen; dienstbar geworden
  rationale: Der Text stellt Beherrschung und Niederlage gegenüber. „Versklavt“ erhält deshalb bewusst die drastische Metapher der gebundenen Unfreiheit.
- issue: Bezugswort von τούτοις
  choice: ihnen, bezogen auf die Leidenschaften
  alternative: diesen Dingen, möglicherweise Leidenschaften und Genussmitteln zusammen
  rationale: Das neutrale Pluralpronomen stimmt unmittelbar mit πάθεσιν überein. Die deutsche Wiedergabe macht diesen naheliegenden Bezug kenntlich, ohne eine zusätzliche Deutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet den erklärenden Einschub; Komma und offener Vergleich zeigen, dass der Satz im folgenden Vers weitergeführt wird.
