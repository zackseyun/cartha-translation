  yaml_path: translation/deuterocanon/4_maccabees/013/019.yaml
  text: And you are not ignorant of the affections of human nature[a], which the divine and all-wise providence apportioned to those who are born through the fathers, having planted them through the mother's womb;
translation:
  language: de
  text: Ihr kennt doch die Bande menschlicher Zuneigung[a], die die göttliche und allweise Vorsehung den Geborenen durch die Väter zugeteilt hat, indem sie sie durch den Mutterleib eingepflanzt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die natürlichen Regungen des Menschseins“ oder „die menschlichen Bindungen“. Das griechische φίλτρα bezeichnet hier starke Bande der Zuneigung, nicht wörtlich Zaubermittel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἀγνοεῖτε δὲ
  choice: Ihr kennt doch
  rationale: Die idiomatische deutsche Wendung gibt die Litotes und den rhetorischen Nachdruck der direkten Anrede wieder; „doch“ nimmt dabei das weiterführende δέ auf.
- source_word: τὰ τῆς ἀνθρωπότητος φίλτρα
  choice: die Bande menschlicher Zuneigung
  rationale: φίλτρα bezeichnet hier starke natürliche Gefühlsbindungen, nicht wörtlich Liebeszauber. „Bande“ bewahrt die Kraft des Ausdrucks, während „menschlicher Zuneigung“ den Bezug auf das Menschsein natürlich wiedergibt.
- source_word: ἡ θεία καὶ πάνσοφος πρόνοια
  choice: die göttliche und allweise Vorsehung
  rationale: „Vorsehung“ erhält das philosophisch-theologische Gewicht von πρόνοια; „allweise“ entspricht πάνσοφος, ohne eine nicht ausdrücklich genannte Genitivbestimmung wie „Gottes“ hinzuzufügen.
- source_word: ἔμερισεν
  choice: zugeteilt hat
  rationale: Die Formulierung bewahrt den Gedanken einer geordneten, maßvollen Zuweisung und klingt im modernen Deutschen natürlicher als „aufgeteilt“.
- source_word: τοῖς γεννωμένοις
  choice: den Geborenen
  rationale: Die substantivierte passive Wendung bleibt knapp und quellennahe; sie lässt den Kontext von Zeugung und Geburt bestehen.
- source_word: διὰ τῶν πατέρων
  choice: durch die Väter
  rationale: Die ausdrückliche väterliche Vermittlung des griechischen Textes wird nicht zu einer allgemeinen Aussage über Eltern geglättet.
- source_word: φυτεύσασα
  choice: nachdem sie sie ... eingepflanzt hatte
  rationale: „Eingepflanzt“ erhält die Pflanzenmetapher. Der vorzeitige Nebensatz bildet das aoristische Partizip ab und macht seinen Bezug auf die Vorsehung sowie auf die Bande im Deutschen eindeutig.
- source_word: διὰ τῆς μητρῴας γαστρός
  choice: durch den mütterlichen Schoß
  rationale: „Mütterlicher Schoß“ ist eine natürliche, würdige Wiedergabe der antiken Bezeichnung für den Mutterleib und wahrt die ausdrücklich mütterliche Seite der Aussage.
theological_decisions:
- issue: Wiedergabe von πρόνοια im hellenistisch-jüdischen Zusammenhang
  choice: Vorsehung
  alternative: Voraussicht
  rationale: „Vorsehung“ bezeichnet hier am besten das weise göttliche Ordnen und Wirken, ohne spätere konfessionelle Lehrbestimmungen einzutragen.
- issue: Verhältnis der väterlichen und mütterlichen Zeugungssprache
  choice: Die getrennten Hinweise auf die Väter und den mütterlichen Schoß bleiben erhalten.
  alternative: Verallgemeinerung zu „durch die Eltern“ oder „bei der Geburt“
  rationale: Der griechische Text nennt beide Seiten ausdrücklich. Eine Verallgemeinerung würde seine konkrete und spannungsreiche Ausdrucksweise einebnen.
- issue: Zeitliches Verhältnis des Partizips φυτεύσασα zum Hauptverb ἔμερισεν
  choice: 'vorzeitig: „nachdem sie sie … eingepflanzt hatte“'
  alternative: 'gleichzeitig oder beigeordnet: „indem sie sie einpflanzte“ / „und pflanzte sie ein“'
  rationale: Das aoristische Partizip kann vorzeitige Begleithandlung bezeichnen. Diese Wiedergabe bewahrt die syntaktische Unterordnung, ohne die väterliche und mütterliche Vermittlung miteinander zu verschmelzen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit direkter Anrede im Plural. Die ungewöhnliche Abfolge von väterlicher Vermittlung und Einpflanzung durch den mütterlichen Schoß wird bewusst nicht paraphrasierend geglättet.
