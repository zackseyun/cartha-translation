  text: For their shared commitment to noble goodness intensified their harmony with one another.
translation:
  language: de
  text: Denn ihre gemeinsame Ausrichtung auf das Gute und Edle verstärkte ihre Eintracht untereinander.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Denn ihre Gleichgesinntheit im Guten und Edlen festigte ihre Eintracht miteinander.'
    reason: Lexikalische Alternative für ὁμόγνοια und καλοκἀγαθία; sie gibt die griechische Ausdrucksweise formaler wieder.
lexical_decisions:
- source_word: ὁμόγνοια
  choice: gemeinsame Ausrichtung
  rationale: Das Wort bezeichnet eine übereinstimmende Gesinnung oder gemeinsame innere Haltung. „Gemeinsame Ausrichtung“ gibt diesen Sinn natürlich wieder und unterscheidet ihn zugleich von der nachfolgenden ὁμόνοια.
- source_word: καλοκἀγαθίας
  choice: auf das Gute und Edle
  rationale: καλοκἀγαθία verbindet sittliche Güte mit edler Haltung. Die Paarformel „das Gute und Edle“ macht beide Aspekte sichtbar, ohne den Ausdruck auf den abstrakten Begriff „Tugend“ zu verengen.
- source_word: ἐπέτεινεν
  choice: stärkte
  rationale: Das Verb bedeutet wörtlich „ausdehnen, steigern“ und bezeichnet hier die Zunahme beziehungsweise Festigung ihrer gegenseitigen Eintracht.
- source_word: ὁμόνοιαν
  choice: Eintracht
  rationale: Der Begriff bezeichnet Übereinstimmung und friedliche Verbundenheit zwischen Personen. „Eintracht“ wahrt den Beziehungsaspekt und vermeidet eine Wiederholung der Wiedergabe von ὁμόγνοια.
- source_word: πρὸς ἀλλήλους
  choice: untereinander
  rationale: Die Wendung bezeichnet die wechselseitige Beziehung der Genannten; „untereinander“ ist im Deutschen knapp und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden verwandten Begriffe ὁμόγνοια und ὁμόνοια werden bewusst unterschiedlich als „gemeinsame Ausrichtung“ und „Eintracht“ wiedergegeben; so bleibt ihr gedanklicher Zusammenhang erkennbar, ohne die Unterscheidung einzuebnen.
