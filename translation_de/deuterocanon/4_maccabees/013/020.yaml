lexical_decisions:
- source_word: ἐν ᾗ
  choice: in der
  rationale: Das feminine Relativpronomen im Dativ verweist auf einen femininen Bezugsausdruck im vorausgehenden Kontext; „in der“ bewahrt diesen Bezug, ohne ihn im Fragment näher zu bestimmen.
- source_word: ἀδελφοὶ
  choice: die Brüder
  rationale: Der griechische Ausdruck ist ausdrücklich maskulin pluralisch und bezeichnet hier leibliche Brüder.
- source_word: τὸν ἴσον … χρόνον κατοικήσαντες
  choice: gleich lange gelebt hatten
  rationale: Die idiomatische deutsche Wiedergabe drückt die gleiche Lebensdauer aus und bewahrt den vorzeitigen Charakter des Partizips.
- source_word: ἐν τῷ αὐτῷ χρόνῳ
  choice: zur selben Zeit
  rationale: Die Formulierung bezeichnet hier am natürlichsten zeitgleiche Bildung und ist in modernem Deutsch idiomatisch.
- source_word: πλασθέντες
  choice: geformt worden
  rationale: Das passive Partizip bezeichnet ihr Geformtwerden, wahrscheinlich im Mutterleib, ohne den Ort ausdrücklich zu ergänzen.
- source_word: ἀπὸ τοῦ αὐτοῦ αἵματος αὐξηθέντες
  choice: aus demselben Blut herangewachsen waren
  rationale: Die Wiedergabe bewahrt das konkrete Bild gemeinsamer leiblicher Herkunft und verbindet es natürlich mit dem Gedanken des Wachsens.
- source_word: καὶ διὰ τῆς αὐτῆς
  choice: und durch dieselbe …
  rationale: Der erhaltene Wortlaut bricht nach dem femininen Adjektiv ab; die unvollständige Wendung wird daher nicht ergänzt.
