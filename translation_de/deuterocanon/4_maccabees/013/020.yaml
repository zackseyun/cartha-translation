  text: in der die Brüder[a] gleich lange gelebt hatten, zur selben Zeit geformt worden waren, aus demselben Blut herangewachsen waren und durch dieselbe …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier überlieferte griechische Text dieses Verses bricht mitten in der Wendung „und durch dieselbe …“ ab. Deshalb bleibt auch die Übersetzung unvollständig, statt nicht vorhandene Wörter zu ergänzen.
