base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/018.yaml
  text: And Jacob will welcome you[a], and all the fathers will praise you. And as each one of their brothers was being taken away, those who remained were saying, “Do not disgrace us, brother[b], nor prove false to those who died before us.”
translation:
  language: de
  text: 'Und Jakob wird dich aufnehmen[a], und alle Väter werden dich loben. Und als jeder einzelne ihrer Brüder weggerissen wurde, sagten die Zurückbleibenden: »Mach uns keine Schande, Bruder, und mach die nicht zu Lügnern[b], die vor uns gestorben sind.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „empfangen“ oder „willkommen heißen“. Das Objekt „dich“ ist aus dem Zusammenhang ergänzt; die griechische Verbform steht im Plural.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „täusche nicht die, die vor uns gestorben sind“; auch möglich: „widerlege ihr Zeugnis nicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδέξονται
  choice: wird dich aufnehmen
  rationale: ὑποδέχομαι bezeichnet ein Aufnehmen oder gastliches Empfangen. „Aufnehmen“ bewahrt die konkrete Bedeutung; „dich“ ist als im Zusammenhang vorausgesetztes Objekt ergänzt. Die griechische Pluralform gehört im fortlaufenden Satz zu einem mehrgliedrigen Subjekt, dessen letzter genannter Teil Jakob ist.
- source_word: οἱ πατέρες
  choice: alle Väter
  rationale: Die wörtliche Wiedergabe bewahrt den ehrenden Bezug auf die verehrten Vorfahren, ohne ihn durch „Erzväter“ oder „Ahnen“ enger auszulegen.
- source_word: ἐπαινέσουσιν
  choice: werden dich loben
  rationale: ἐπαινέω bedeutet loben oder anerkennend rühmen. „Loben“ ist direkt, verständlich und dem gehobenen Zusammenhang angemessen; das Objekt wird aus der Anrede ergänzt.
- source_word: ἐνὶ ἑκάστῳ τῶν ἀποσπωμένων
  choice: wenn jeweils einer … weggerissen wurde
  rationale: Die Formulierung gibt die distributive Wiederholung von ἐνὶ ἑκάστῳ und die gewaltsame Trennung durch ἀποσπάω wieder.
- source_word: οἱ περιλειπόμενοι
  choice: die Zurückbleibenden
  rationale: Gemeint sind diejenigen Brüder, die zu diesem Zeitpunkt noch zurückblieben; die Wiedergabe vermeidet die weitergehende Aussage, sie hätten letztlich überlebt.
- source_word: Μὴ καταισχύνῃς ἡμᾶς
  choice: Mach uns keine Schande
  rationale: Die idiomatische deutsche Wendung bringt den öffentlichen Ehr- und Schandaspekt von καταισχύνω deutlich zum Ausdruck.
- source_word: μηδὲ ψεύσῃ τοὺς προαποθανόντας
  choice: und werde denen nicht untreu, die vor uns gestorben sind
  rationale: ψεύω kann hier ein Falschwerden, Täuschen oder Widerlegen des vorausgegangenen Zeugnisses bezeichnen. „Untreu werden“ gibt den relationalen Sinn natürlich wieder, ohne ihn auf eine bloße Lüge zu verengen.
theological_decisions:
- issue: Identität Jakobs in der erwarteten Aufnahme der Märtyrer
  choice: Jakob bezeichnet den Patriarchen als Teil der geehrten Väter.
  alternative: Jakob als kollektive Bezeichnung für Israel
  rationale: Die unmittelbare Verbindung mit „allen Vätern“ und die grammatische Einbindung in ein mehrgliedriges Subjekt des fortlaufenden Zusammenhangs sprechen für den Patriarchen als Einzelperson.
- issue: Bezug von ψεύσῃ auf die zuvor gestorbenen Brüder
  choice: Die Mahnung fordert dazu auf, ihrem Zeugnis nicht untreu zu werden.
  alternative: Die Mahnung bedeutet wörtlicher, die zuvor Gestorbenen nicht „falsch zu machen“ oder als Lügner erscheinen zu lassen.
  rationale: Der Text lässt offen, ob vor allem Treue zu den Toten oder die Bestätigung ihres Zeugnisses gemeint ist. Die Hauptfassung ist im Deutschen verständlich; die Fußnote bewahrt die sachliche Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich und mündlich verständlich. „Väter“ wahrt die quellennah ehrende Bezeichnung; „weggerissen“ erhält die im griechischen Verb angelegte Gewalt, ohne den Vorgang weiter auszumalen.
