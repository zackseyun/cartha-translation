  source_fidelity: Die Grundbedeutungen sind überwiegend getroffen. Die griechische Wortgruppe ἐναγκαλισμάτων φιλάδελφοι ψυχαί ist jedoch ungewöhnlich verdichtet; „einander ... zugetan“ fügt eine wechselseitige Relation hinzu, die nicht ausdrücklich im Text steht. Außerdem hat αὔξονται weiterhin ψυχαί als Subjekt; die Ersetzung durch „ihre Verbundenheit“ ist eine sinnvolle Deutung, aber unnötig explizierend.
  naturalness: Der Entwurf ist gut verständlich und im würdigen modernen Standarddeutsch gehalten. „Brüderlich liebende Seelen“ klingt allerdings weniger idiomatisch als „bruderliebende Seelen“. Die revidierte Fassung bleibt nah am griechischen Bild und ist zugleich flüssig.
  terminology: „Seelen“ bewahrt ψυχαί angemessen. „Bruderliebend“ gibt φιλάδελφοι als Verbindung der Bruderliebe wieder, ohne die im Griechischen mögliche genauere syntaktische Zuordnung dogmatisch festzulegen. „Zusammenleben“, „täglicher vertrauter Umgang“ und „sonstige Erziehung“ decken die Bedeutungsräume von συντροφία, συνηθεία und ἄλλη παιδεία ab; die Alternativen werden in den Anmerkungen erhalten.
