  yaml_path: translation/deuterocanon/4_maccabees/013/022.yaml
  text: The souls of brothers are affectionate in embraces[c][b][a], and they grow much stronger through living together and through daily familiarity and the rest of their upbringing.
translation:
  language: de
  text: Bruderliebende Seelen sind in Umarmungen innig[a]; und sie werden durch ihr Zusammenleben[b], durch den täglichen vertrauten Umgang und durch ihre sonstige Erziehung[c] noch stärker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Formulierung ist stark verdichtet. Sie kann auch etwa verstanden werden: „bruderliebende Seelen, innig in Umarmungen“ oder „die Seelen von Brüdern, liebevoll in Umarmungen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch die Gemeinschaft“, „durch enges Zusammensein“ oder „dadurch, dass sie gemeinsam aufgezogen wurden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „durch ihre übrige Bildung“, „durch ihre weitere Schulung“ oder „durch den Rest ihrer Erziehung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισμάτων
  choice: in Umarmungen
  rationale: Das Substantiv bezeichnet das Umschließen mit den Armen beziehungsweise Umarmungen. Die konkrete körperliche Geste bleibt erhalten, während die stark verdichtete, verblos wirkende griechische Formulierung im Deutschen lesbar gemacht wird.
- source_word: φιλάδελφοι ψυχαί
  choice: brüderlich liebende Seelen
  rationale: φιλάδελφος bezeichnet hier die Liebe unter leiblichen Brüdern; ψυχαί bewahrt als „Seelen“ den gehobenen anthropologischen Ausdruck. Die Formulierung lässt φιλάδελφοι attributiv bei ψυχαί stehen, ohne sie lediglich als Besitzangabe „Seelen von Brüdern“ wiederzugeben.
- source_word: αὔξονται σφοδρότερον
  choice: ihre Verbundenheit wächst noch stärker
  rationale: Wörtlich wachsen die Seelen in höherem Maß beziehungsweise intensiver. Die deutsche Fassung benennt die im Zusammenhang gemeinte brüderliche Verbundenheit und vermeidet das unnatürliche Bild, Seelen wüchsen körperlich.
- source_word: διὰ συντροφίας
  choice: durch das gemeinsame Aufwachsen
  rationale: συντροφία kann Gemeinschaft, Zusammenleben oder gemeinsames Aufgezogenwerden bezeichnen. Im familiären Zusammenhang der sieben Brüder bringt „gemeinsames Aufwachsen“ die prägende gemeinsame Lebensgeschichte besonders klar zum Ausdruck, ohne sie auf bloße räumliche Nähe zu reduzieren.
- source_word: τῆς καθʼ ἡμέραν συνηθείας
  choice: durch den täglichen vertrauten Umgang
  rationale: Die Wendung bezeichnet die durch tägliche Gewohnheit entstandene Vertrautheit. „Vertrauter Umgang“ verbindet regelmäßigen Kontakt mit gewachsener Nähe.
- source_word: τῆς ἄλλης παιδίας
  choice: durch die weitere Erziehung
  rationale: παιδία kann hier Erziehung, Bildung oder Schulung meinen. „Weitere Erziehung“ bewahrt die Breite des Begriffs und gibt ἄλλης wieder, ohne nur schulische Bildung vorauszusetzen.
theological_decisions:
- issue: Geschlechtsspezifische Familienbezeichnung im Zusammenhang der sieben Brüder
  choice: brüderlich
  alternative: geschwisterlich
  rationale: Der unmittelbare Erzählzusammenhang handelt von sieben männlichen Geschwistern. Daher wird die konkrete männliche Referenz beibehalten und nicht zu einer allgemeinen geschwisterlichen Aussage erweitert.
- issue: Anthropologische Wiedergabe von ψυχαί
  choice: Seelen
  alternative: Menschen / Inneres
  rationale: „Seelen“ erhält den gehobenen Ausdruck und die Spannung zwischen Person, Innenleben und Lebenskraft, ohne den Begriff auf Gefühle oder bloße Personenbezeichnung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich verdichtete erste griechische Wortgruppe wird zu einem verständlichen Satz ergänzt; die Fußnote bewahrt ihre syntaktische Mehrdeutigkeit. „Brüderlich“ entspricht dem konkreten Zusammenhang der sieben Brüder. Die Wiederholung von „durch“ macht die dreigliedrige Ursache im Deutschen transparent.
