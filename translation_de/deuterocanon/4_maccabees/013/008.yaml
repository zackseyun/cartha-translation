  text: For[a], having formed a sacred chorus of piety, they kept encouraging one another, saying,
translation:
  language: de
  text: 'Denn sie hatten einen heiligen Chor der Frömmigkeit gebildet[a] und ermutigten einander immer wieder mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen heiligen Reigen der Frömmigkeit aufgestellt“. Das Griechische verbindet das kultische Bild eines Chors oder Reigens mit εὐσέβεια, der ehrfürchtigen Treue zu Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: heiligen
  rationale: ἱερός bezeichnet das dem Göttlichen Zugehörige bzw. Heilige; „heilig“ bewahrt hier die kultische Färbung und klingt im Deutschen natürlich.
- source_word: εὐσεβείας
  choice: der Gottesfurcht
  rationale: εὐσέβεια bezeichnet in 4 Makkabäer die gläubige, Gott zugewandte Haltung und Treue. „Gottesfurcht“ macht den religiösen Bezug deutlich, ohne bloß allgemeine Frömmigkeit zu meinen.
- source_word: στήσαντες
  choice: hatten … gebildet
  rationale: Beim χορός bezeichnet ἵστημι das Aufstellen bzw. Bilden einer Gruppe. Das Plusquamperfekt gibt das vorzeitige Verhältnis des Aoristpartizips zum fortdauernden Ermutigen natürlich wieder.
- source_word: χορὸν
  choice: Reigen
  rationale: χορός kann einen Chor oder eine zum Gesang und Tanz geordnete Gruppe bezeichnen. „Reigen“ erhält das anschauliche antike Gruppenbild besser als das modern stark musikalisch verstandene „Chor“.
- source_word: παρεθάρσυνον
  choice: ermutigten … immer wieder
  rationale: Der Imperfekt drückt eine andauernde oder wiederholte gegenseitige Ermutigung aus.
- source_word: ἀλλήλους
  choice: einander
  rationale: Natürliche und genaue Wiedergabe des reziproken Pronomens.
- source_word: λέγοντες
  choice: mit den Worten
  rationale: Leitet idiomatisch die unmittelbar folgende wörtliche Rede ein und entspricht funktional dem griechischen Partizip „sagend“.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια als zentralem religiös-ethischem Begriff
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ bezeichnet ausdrücklich die ehrfürchtige Ausrichtung auf Gott und die daraus erwachsende Treue. „Frömmigkeit“ wäre ebenfalls möglich, kann im heutigen Deutsch jedoch stärker eine allgemeine oder äußerliche Religiosität bezeichnen.
- issue: Kultisch-rhetorisches Bild von ἱερὸν … χορὸν
  choice: heiliger Reigen
  alternative: heiliger Chor
  rationale: Die Übersetzung wahrt das Bild einer geordneten, gemeinschaftlichen Formation, ohne festzulegen, dass ausschließlich gesungen wurde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Reigen“ ist bewusst bildhaft und leicht gehoben, um die kultische Metapher des griechischen χορός zu erhalten; die fortdauernde Handlung des Imperfekts wird mit „immer wieder“ ausgedrückt.
