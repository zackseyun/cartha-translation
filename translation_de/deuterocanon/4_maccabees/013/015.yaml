review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von κίνδυνος, αἰωνίῳ βασάνῳ, παραβαίνουσι und τὴν ἐντολὴν τοῦ θεοῦ ist im Wesentlichen quellentreu. Allerdings gibt „Kampf um die Seele“ den Genitiv ψυχῆς zu eng als Kampf um die Seele als Streitobjekt wieder. Der griechische Ausdruck bezeichnet allgemeiner den Kampf bzw. die Anfechtung der Seele.
  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch gut verständlich. „Kampf der Seele“ ist etwas gehobener, entspricht aber dem Register und vermeidet die zusätzliche Deutung von „um die Seele“. Die Relativsatzstellung ist natürlich.
  terminology: „ewige Qual“ gibt αἰωνίῳ βασάνῳ angemessen wieder, ohne den Ausdruck abzuschwächen. „Gottes Gebot übertreten“ ist idiomatisch und präzise. Für κείμενος ist „bereitliegt“ als bildhafte Wiedergabe vertretbar.
  issues:
  - severity: medium
    issue: ψυχῆς ἀγών als „Kampf um die Seele“
    rationale: „Um die Seele“ macht die Seele zum umkämpften Gegenstand. Der Genitiv ψυχῆς lässt vielmehr den Kampf der Seele beziehungsweise den die Seele betreffenden Kampf offen und sollte nicht weiter spezifiziert werden.
  revised_text: Denn groß ist der Kampf der Seele und die Gefahr, die für diejenigen, die Gottes Gebot übertreten, in ewiger Qual bereitliegt.
  revised_footnotes: []
  revision_rationale: 'Die Revision beschränkt sich auf den Genitiv ψυχῆς: „Kampf der Seele“ bewahrt dessen offene Beziehung zu ἀγών, während „um die Seele“ eine im griechischen Text nicht ausdrücklich vorhandene Kampfkonstellation einträgt. Die übrigen Formulierungen bleiben erhalten, einschließlich der Zuordnung von κείμενος zu κίνδυνος.'
