  text: For great is the struggle of the soul and the danger laid up in eternal torment for those who transgress the commandment of God.
translation:
  language: de
  text: Denn groß ist der Kampf der Seele und die Gefahr, die für diejenigen, die Gottes Gebot übertreten, in ewiger Qual bereitliegt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχῆς ἀγών
  choice: Kampf um die Seele
  rationale: Der Genitiv kann den Bereich oder Gegenstand des Kampfes bezeichnen. „Kampf um die Seele“ ist natürliches Deutsch und bewahrt den ernsten Zusammenhang.
- source_word: κίνδυνος
  choice: Gefahr
  rationale: Die direkte und kontextgemäße Entsprechung.
- source_word: ἐν αἰωνίῳ βασάνῳ κείμενος
  choice: die in ewiger Qual ... bereitliegt
  rationale: κείμενος bezeichnet etwas Liegendes beziehungsweise Bereitliegendes; die Formulierung bewahrt die Bildlichkeit und den Bezug der Partizipialkonstruktion auf „Gefahr“.
- source_word: παραβαίνουσι
  choice: übertreten
  rationale: Gibt den bewussten Verstoß gegen ein Gebot präzise wieder.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: Gottes Gebot
  rationale: Natürliche, knappe Wiedergabe der griechischen Genitivverbindung.
theological_decisions:
- issue: Reichweite von αἰωνίῳ
  choice: ewiger Qual
  alternative: lang andauernder Qual
  rationale: „Ewig“ ist die gewöhnliche und im gegebenen eschatologischen Warnzusammenhang naheliegende Wiedergabe von αἰώνιος; die Spannung der Aussage wird nicht abgeschwächt.
- issue: Zuordnung von κείμενος
  choice: Die bereitliegende Gefahr steht in Verbindung mit ewiger Qual.
  alternative: Der Kampf und die Gefahr bestehen in ewiger Qual.
  rationale: Das maskuline Singularpartizip κείμενος stimmt unmittelbar mit dem maskulinen Singular κίνδυνος überein, nicht mit beiden Substantiven gemeinsam.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem begründenden γάρ und behält den feierlich-mahnenden Ton bei.
