revisions:
- from: Denn groß ist der Kampf um die Seele und die Gefahr, die in ewiger Qual für diejenigen bereitliegt, die Gottes Gebot übertreten.
  to: Denn groß ist der Kampf der Seele und die Gefahr, die für diejenigen, die Gottes Gebot übertreten, in ewiger Qual bereitliegt.
  rationale: 'Die Revision beschränkt sich auf den Genitiv ψυχῆς: „Kampf der Seele“ bewahrt dessen offene Beziehung zu ἀγών, während „um die Seele“ eine im griechischen Text nicht ausdrücklich vorhandene Kampfkonstellation einträgt. Die übrigen Formulierungen bleiben erhalten, einschließlich der Zuordnung von κείμενος zu κίνδυνος.'
