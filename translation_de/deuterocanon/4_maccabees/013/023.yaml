lexical_decisions:
- source_word: ἀσκήσεως
  choice: Schulung
  rationale: Das Substantiv bezeichnet eingeübte, disziplinierte Praxis oder Übung. »Schulung« gibt den prägenden und einübenden Charakter wieder, ohne vorschnell den späteren Fachbegriff der Askese einzutragen.
- source_word: ἐν νόμῳ θεοῦ
  choice: im Gesetz Gottes
  rationale: Die Präposition bezeichnet hier den Bereich und Rahmen der Schulung. Die formal nahe Wiedergabe bewahrt zudem die mögliche Nuance, dass diese Praxis im Gesetz verankert ist.
- source_word: φιλαδελφίας
  choice: brüderliche Liebe
  rationale: Gemeint ist ausdrücklich die Liebe unter Brüdern. Die Wiedergabe erhält den familiären Bezug und passt zu den anschließend genannten sieben Brüdern.
- source_word: καθεστηκυίας
  choice: fest begründet war
  rationale: Das Perfektpartizip beschreibt einen eingetretenen und fortbestehenden Zustand. »Fest begründet war« bringt diesen resultativen Sinn idiomatisch zum Ausdruck.
- source_word: συμπαθούσης
  choice: mitfühlte
  rationale: Das Partizip bezieht sich grammatisch auf die brüderliche Liebe und bezeichnet gemeinsames Empfinden beziehungsweise Mitgefühl. Die personifizierende Formulierung des Griechischen bleibt erhalten.
- source_word: οἱ ἑπτὰ ἀδελφοὶ
  choice: die sieben Brüder
  rationale: Der griechische Ausdruck ist maskulin und bezeichnet die sieben männlichen Geschwister der Erzählung.
- source_word: συνπα-
  choice: hielten ... zusammen—
  rationale: Die überlieferte Vorlage bricht mitten im Wort ab; sichtbar ist nur der eine Gemeinsamkeit anzeigende Wortanfang. Die Wiedergabe ist daher bewusst vorsichtig und wird durch den Gedankenstrich sowie eine Fußnote als vorläufig gekennzeichnet.
theological_decisions:
- issue: Geschlechtsspezifische Geschwisterbezeichnung
  choice: die sieben Brüder
  alternative: die sieben Geschwister
  rationale: Der Ausgangstext nennt ausdrücklich Brüder und bezieht sich auf männliche Personen; diese Aussage wird nicht neutralisiert.
- issue: Unvollständiges Wort am Versende
  choice: Vorsichtige sinngemäße Wiedergabe mit Gedankenstrich und Fußnote
  alternative: Das Wort ergänzen oder den Wortrest unübersetzt lassen
  rationale: Die vorgelegte griechische Quelle endet mit συνπα-. Die erkennbare gemeinsame Ausrichtung wird angedeutet, doch die Unsicherheit der konkreten Wortform bleibt transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Genitiv bleibt als Satzfragment stehen, weil der griechische Vers ebenfalls an einen vorausgehenden Zusammenhang anschließt. Die leichte Personifizierung der brüderlichen Liebe entspricht der griechischen Syntax.
