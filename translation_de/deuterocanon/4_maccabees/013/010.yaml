  text: Let us not be cowardly in demonstrating our piety[a].
translation:
  language: de
  text: Lasst uns nicht feige sein, wenn es darum geht, unsere Gottesfurcht unter Beweis zu stellen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lasst uns bei der Bewährung unserer Gottesfurcht nicht den Mut verlieren.“'
    reason: Die griechischen Ausdrücke können statt aktiver Feigheit auch als Mutlosigkeit und statt eines Erweises als Bewährung wiedergegeben werden.
lexical_decisions:
- source_word: μὴ δειλανδρήσωμεν
  choice: Lasst uns nicht feige sein
  rationale: Der verneinte hortative Aoristkonjunktiv fordert die Sprechergruppe eindringlich dazu auf, keine Feigheit zu zeigen. Die Formulierung ist im modernen Deutsch natürlich und bewahrt die moralische Schärfe des griechischen Verbs.
- source_word: πρὸς τὴν ... ἀπόδειξιν
  choice: wenn es darum geht, ... unter Beweis zu stellen
  rationale: πρός bezeichnet hier die Beziehung beziehungsweise den Bereich, auf den sich die mögliche Feigheit richtet; ἀπόδειξις meint Erweis oder Demonstration. Die verbale Wendung gibt diesen Zusammenhang verständlich wieder, ohne den Erweis als rein theoretischen Beweis einzuengen.
- source_word: τῆς εὐσεβίας
  choice: unsere Gottesfurcht
  rationale: εὐσέβεια bezeichnet hier die ehrfürchtige, im Handeln bewährte Treue zu Gott. „Gottesfurcht“ ist verständlich und hält den Gottesbezug deutlicher fest als das im heutigen Deutsch teils missverständliche „Frömmigkeit“. Das Possessivpronomen ist sinngemäß ergänzt, weil die Sprecher ihre eigene εὐσέβεια erweisen sollen.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Kontext der Ermutigung zum Martyrium
  choice: Gottesfurcht
  alternative: Frömmigkeit; Ehrfurcht vor Gott
  rationale: „Gottesfurcht“ umfasst ehrfürchtige Bindung an Gott und deren praktische Bewährung, ohne eine spätere konfessionelle Fachbedeutung einzutragen. „Frömmigkeit“ wäre lexikalisch möglich, kann modern jedoch bloße Religiosität oder ein äußeres Erscheinungsbild nahelegen.
translation_notes:
  register: Kurzer, eindringlicher Gemeinschaftsappell in modernem, würdigem Standarddeutsch. Die Umschreibung „wenn es darum geht“ vermeidet eine schwerfällige Nominalkonstruktion; die Fußnote bewahrt die wesentliche lexikalische Alternative.
