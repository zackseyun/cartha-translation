  text: But he kept saying[a], “Remember from whom you come, and by what father's hand you are to be slaughtered.”
translation:
  language: de
  text: 'Er aber sagte immer wieder: »Denkt daran, woher ihr stammt[a] oder durch die Hand welchen Vaters ihr geschlachtet werden sollt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »woher ihr kommt«. Der griechische Ausdruck kann den Herkunftsort bezeichnen; im Zusammenhang dürfte jedoch eher die familiäre Abstammung gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔλεγεν
  choice: Er aber sagte immer wieder
  rationale: Das Imperfekt ἔλεγεν bezeichnet hier fortgesetztes oder wiederholtes Reden; »sagte immer wieder« gibt diesen Aspekt natürlich wieder. δέ markiert den Fortgang beziehungsweise Gegensatz im Gespräch.
- source_word: Μνήσθητε
  choice: Denkt daran
  rationale: Der Aoristimperativ fordert nachdrücklich zum Erinnern auf. »Denkt daran« ist im modernen Deutschen direkt und natürlich.
- source_word: πόθεν ἐστέ
  choice: woher ihr stammt
  rationale: πόθεν bezeichnet zunächst die Herkunft. »stammt« lässt sowohl örtliche als auch familiäre Herkunft zu und passt zum Zusammenhang, ohne die Mehrdeutigkeit völlig aufzulösen.
- source_word: ἢ
  choice: oder
  rationale: Die disjunktive Konjunktion wird ihrem gewöhnlichen Sinn entsprechend mit »oder« wiedergegeben; die auffällige Verbindung der beiden Erinnerungsinhalte wird nicht zu »und« geglättet.
- source_word: τίνος πατρὸς χειρὶ
  choice: von der Hand welches Vaters
  rationale: Der Dativ χειρί bezeichnet die handelnde beziehungsweise vermittelnde Instanz. Die wörtlich-bildhafte »Hand« und die interrogative Form τίνος bleiben erhalten.
- source_word: σφαγιασθῆναι
  choice: geschlachtet werden sollt
  rationale: Das Verb bezeichnet gewaltsames Schlachten und kann kultische Anklänge haben. »geschlachtet« bewahrt seine Härte, ohne ausdrücklich eine Opferdeutung hinzuzufügen.
theological_decisions:
- issue: Bedeutung von πόθεν ἐστέ
  choice: »woher ihr stammt« mit Fußnote zur möglichen familiären Herkunft
  alternative: »von wem ihr abstammt«
  rationale: Der griechische Ausdruck kann örtliche Herkunft bezeichnen, während der Zusammenhang wahrscheinlich auf Abstammung und Familienidentität zielt. Die Übersetzung wahrt beide Möglichkeiten.
- issue: Verknüpfung durch ἢ
  choice: »oder«
  alternative: »und«
  rationale: Obwohl »und« den Gedankengang glätten würde, steht im überlieferten griechischen Text die disjunktive Konjunktion ἢ. Ihre Spannung wird nicht stillschweigend beseitigt.
- issue: Stärke und mögliche Opferkonnotation von σφαγιασθῆναι
  choice: »geschlachtet werden«
  alternative: »getötet werden« oder »als Opfer geschlachtet werden«
  rationale: »getötet« wäre zu schwach, während »als Opfer« eine im Verb mögliche, aber hier nicht zwingend ausdrücklich festgelegte theologische Deutung in den Haupttext eintragen würde.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Rede, das Bild der Hand und die Härte von »geschlachtet« bleiben erhalten. Das ungewöhnliche »oder« folgt bewusst dem griechischen Wortlaut.
