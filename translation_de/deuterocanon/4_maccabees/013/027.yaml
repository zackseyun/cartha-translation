base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/027.yaml
  text: But likewise[a], although nature and custom and the dispositions of virtue were drawing together for them the affections of brotherhood, those who were left behind endured, because of piety, as they watched their brothers, being tortured to death, objects of pity[b].
translation:
  language: de
  text: Doch ebenso hielten die Zurückgebliebenen aufgrund ihrer Frömmigkeit stand, obwohl Natur, Gewohnheit und die von Tugend geprägte Haltung sie in brüderlicher Zuneigung miteinander verbanden, als sie sahen, wie ihre Brüder bemitleidet und bis zum Tod gefoltert wurden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische ist stark verdichtet: Natur, Gewohnheit und die von Tugend geprägte Haltung „führten für sie die Zuneigungen der Brüderlichkeit zusammen“; zugleich sahen die Zurückgebliebenen ihre Brüder „bemitleidet und bis zum Tod gefoltert“. Wer sie bemitleidet, bleibt unausgesprochen.'
    reason: compressed_greek_syntax
lexical_decisions:
- source_word: φίλτρα
  choice: Bande brüderlicher Liebe
  rationale: φίλτρα bezeichnet hier nicht wörtliche Zaubermittel, sondern die starken Zuneigungen und Bindungen zwischen Brüdern. Die Formulierung bewahrt sowohl den emotionalen Gehalt als auch das Bild verbindender Bande.
- source_word: συναξόντων
  choice: festigten
  rationale: Das Partizip beschreibt, wie Natur, Gewohnheit und tugendhafte Wesensart die brüderliche Bindung zusammenführen und verstärken. „Festigten“ gibt diese Wirkung in natürlichem Deutsch wieder.
- source_word: ἀνέσχοντο
  choice: hielten ... stand
  rationale: Das Verb bezeichnet hier standhaftes Ausharren unter äußerster seelischer Belastung; „standhalten“ passt zum Martyriumskontext.
- source_word: εὐσέβειαν
  choice: Frömmigkeit
  rationale: εὐσέβεια ist in 4 Makkabäer ein Leitbegriff für ehrfürchtige Hingabe an Gott und sein Gesetz. „Frömmigkeit“ bewahrt diesen religiös-ethischen Sinn.
- source_word: οἱ ὑπολελειμμένοι
  choice: die Zurückgebliebenen
  rationale: Gemeint sind die Brüder, die zu diesem Zeitpunkt noch nicht hingerichtet worden waren. „Zurückgebliebene“ vermeidet die mögliche Fehlannahme, sie hätten endgültig überlebt.
- source_word: κατοικτιζομένους
  choice: erbarmungswürdigen
  rationale: Das passive Partizip kennzeichnet die gequälten Brüder als solche, die Mitleid oder Erbarmen hervorrufen. Die attributive Wiedergabe ist im Deutschen lesbarer als „die bemitleidet wurden“.
- source_word: μέχρι θανάτου βασανιζομένους
  choice: bis zum Tod gefoltert wurden
  rationale: Die Folter dauert bis zum Eintritt des Todes. Die gewählte Formulierung gibt diesen zeitlichen Endpunkt präzise wieder.
- source_word: τῶν τῆς ἀρετῆς ἠθῶν
  choice: tugendhafte Wesensart
  rationale: Die Wendung bezeichnet die durch Tugend geprägte moralische Haltung beziehungsweise Charakterbeschaffenheit. Der deutsche Singular bündelt den griechischen Ausdruck idiomatisch.
- source_word: συνηθείας
  choice: Gewohnheit
  rationale: συνήθεια bezeichnet eingeübte Vertrautheit oder Gewohnheit. „Gewohnheit“ unterscheidet sich hier klar von der angeborenen „Natur“.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια im Martyriumskontext
  choice: Frömmigkeit
  alternative: Gottesfurcht; Gottesverehrung
  rationale: „Frömmigkeit“ bezeichnet umfassend die ehrfürchtige Bindung an Gott und sein Gesetz, ohne den Ausdruck auf bloße Furcht oder kultische Verehrung zu verengen.
- issue: Brüderliche Bindung als Quelle seelischer Spannung
  choice: Bande brüderlicher Liebe
  alternative: brüderliche Zuneigung; Bande der Brüderlichkeit
  rationale: Die Formulierung hält fest, dass gerade die natürliche und eingeübte Liebe unter den leiblichen Brüdern ihr Leiden verschärft, während die Frömmigkeit sie zum Standhalten befähigt.
- issue: Passivische Bedeutung von κατοικτιζομένους
  choice: erbarmungswürdigen
  alternative: die bemitleidet wurden
  rationale: Das Griechische lässt offen, von wem die Brüder bemitleidet werden. „Erbarmungswürdig“ bewahrt den passiven beziehungsweise Mitleid erregenden Sinn, ohne einen Handelnden einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wurde durch einen Doppelpunkt gegliedert, ohne den Gegensatz zwischen brüderlicher Liebe und standhafter Frömmigkeit aufzulösen. Geschlechtsspezifische Bezeichnungen wurden entsprechend dem Kontext leiblicher Brüder beibehalten.
