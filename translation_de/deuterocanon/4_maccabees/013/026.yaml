  text: For along with godliness she made brotherly love even more desirable to them.
translation:
  language: de
  text: Denn zusammen mit der Frömmigkeit machte sie ihnen die Liebe zueinander als Brüder begehrenswerter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν
  choice: zusammen mit
  rationale: Die Präposition bezeichnet Begleitung beziehungsweise Verbindung und wird im Deutschen unmittelbar und natürlich wiedergegeben.
- source_word: εὐσεβείᾳ
  choice: der Frömmigkeit
  rationale: εὐσέβεια bezeichnet in 4 Makkabäer die auf Gott ausgerichtete, treue Lebenshaltung. „Frömmigkeit“ ist im Deutschen würdig, verständlich und weniger eng als bloße „Ehrfurcht“.
- source_word: ποθεινοτέραν
  choice: noch begehrenswerter
  rationale: Der Komparativ von ποθεινός bezeichnet etwas, wonach man sich stärker sehnt oder das einem besonders lieb und erstrebenswert ist. „Noch begehrenswerter“ bewahrt die Vergleichsform, ohne deren Bezug näher festzulegen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet diejenigen, für die beziehungsweise in deren Empfinden die geschwisterliche Liebe begehrenswerter wurde.
- source_word: κατεσκεύαζεν
  choice: machte
  rationale: Das Verb beschreibt hier das prägende Wirken der Mutter auf die Haltung ihrer Söhne. Das Imperfekt stellt dieses Wirken als fortdauernd in der Vergangenheit dar; im Deutschen ergibt sich dieser Verlauf aus dem Zusammenhang.
- source_word: φιλαδελφίαν
  choice: die Liebe zueinander als Brüder
  rationale: Im unmittelbaren Zusammenhang sind leibliche Brüder gemeint. Die Formulierung wahrt diese konkrete familiäre Bedeutung deutlicher als das im Deutschen auch übertragene Wort „Bruderliebe“.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια als zentraler Tugend in 4 Makkabäer
  choice: Frömmigkeit
  alternative: Gottesfurcht
  rationale: „Frömmigkeit“ umfasst eine auf Gott gerichtete Haltung und Lebensführung. „Gottesfurcht“ wäre möglich, würde den Bedeutungsumfang aber stärker auf Ehrfurcht beziehungsweise Furcht verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung benennt die konkrete Liebe der Brüder zueinander und bewahrt durch „noch begehrenswerter“ den griechischen Komparativ.
