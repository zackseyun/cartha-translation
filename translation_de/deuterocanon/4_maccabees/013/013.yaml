base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/013.yaml
  text: Because of godliness Isaac endured[a]. And each one, while looking at the others, all together cheerful and very courageous, said[c][b], “Let us dedicate ourselves to God with our whole heart—to the one who gave us our lives—and let us use our bodies to keep watch over the law.”
translation:
  language: de
  text: 'Aus Frömmigkeit[a] hielt Isaak stand. Jeder Einzelne sah die anderen an; alle zusammen, heiter und überaus mutig, sagten: »Wir wollen uns von ganzem Herzen Gott weihen, der uns das Leben[b] gegeben hat, und unsere Körper zum Hüten des Gesetzes einsetzen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus Gottesverehrung“. Das griechische Wort kann ehrfürchtige Hingabe an Gott und die daraus erwachsende Lebensführung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Seelen“. Das griechische Wort ψυχή kann sowohl „Seele“ als auch „Leben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν εὐσέβειαν
  choice: Aus Frömmigkeit
  rationale: εὐσέβεια bezeichnet hier die auf Gott gerichtete ehrfürchtige Hingabe, die sich in treuem Handeln zeigt. „Frömmigkeit“ ist im Deutschen knapp, verständlich und als zentraler Tugendbegriff geeignet; die mögliche Nuance „Gottesverehrung“ wird in einer Fußnote bewahrt.
- source_word: ὑπέμεινεν
  choice: hielt ... stand
  rationale: ὑπομένω bezeichnet standhaftes Ausharren unter einer Prüfung. „Standhalten“ bringt diese aktive Standhaftigkeit im Deutschen natürlicher zum Ausdruck als das allgemeinere „ertragen“.
- source_word: ἐφορῶντες ... ἀλλήλους
  choice: blickte auf die anderen
  rationale: Die Formulierung gibt das gegenseitige Anschauen der Brüder wieder, ohne eine zusätzliche Deutung als Ermutigung ausdrücklich in den Text einzutragen.
- source_word: φαιδροὶ καὶ μάλα θαρραλέοι
  choice: heiter und überaus mutig
  rationale: φαιδρός kann eine heitere oder strahlende Haltung bezeichnen; μάλα verstärkt θαρραλέος deutlich. Die Wiedergabe bewahrt sowohl ihre freudige Gefasstheit als auch ihren großen Mut.
- source_word: ἀφιερώσωμεν ἑαυτούς
  choice: Wir wollen uns ... weihen
  rationale: ἀφιερόω bezeichnet das Absondern oder Widmen für Gott. „Sich Gott weihen“ ist feierlich, verständlich und entspricht dem ausdrücklich reflexiven Bezug.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: von ganzem Herzen
  rationale: Dies ist die natürliche deutsche Entsprechung und bewahrt den Gedanken ungeteilter innerer Hingabe.
- source_word: τῷ δόντι τὰς ψυχάς
  choice: der uns das Leben gegeben hat
  rationale: ψυχή kann „Seele“ oder „Leben“ bedeuten. Im Kontext des bevorstehenden Martyriums steht Gottes Gabe ihres Lebens im Vordergrund; eine metaphysische Festlegung auf „Seelen“ ist nicht erforderlich. Die Mehrzahl wird im Deutschen idiomatisch als gemeinsames „das Leben“ ausgedrückt.
- source_word: χρήσωμεν ... τὰ σώματα
  choice: unsere Körper ... einsetzen
  rationale: Das Medium von χράομαι bedeutet, etwas zu gebrauchen oder einzusetzen. „Einsetzen“ ist im Deutschen natürlicher als „gebrauchen“ und erhält den instrumentalen Sinn.
- source_word: τῇ περὶ τὸν νόμον φυλακῇ
  choice: zum Hüten des Gesetzes
  rationale: φυλακή trägt das Bild des Wachens und Bewahrens. „Hüten“ erhält dieses Bild, statt es auf das bloße „Befolgen“ des Gesetzes zu reduzieren.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια als zentraler Tugendbegriff
  choice: Frömmigkeit
  alternative: Gottesverehrung; Gottesfurcht
  rationale: „Frömmigkeit“ lässt sowohl die innere Ehrfurcht als auch die daraus folgende treue Lebensführung erkennen. „Gottesfurcht“ wäre enger, „Gottesverehrung“ stärker kultisch gefärbt.
- issue: Bedeutung von ψυχαί in der Aussage über Gottes Gabe
  choice: Leben
  alternative: Seelen
  rationale: Der Märtyrerkontext legt das von Gott geschenkte und nun eingesetzte Leben nahe. „Seelen“ bleibt lexikalisch möglich, könnte im Deutschen aber eine bestimmte Leib-Seele-Lehre suggerieren, die der Satz nicht eindeutig formuliert.
- issue: Bildgehalt von φυλακή in Bezug auf das Gesetz
  choice: Hüten des Gesetzes
  alternative: Befolgen des Gesetzes
  rationale: Die Übersetzung wahrt das Wach- und Schutzbild des griechischen Ausdrucks und vermeidet es, die Aussage auf eine abstrakte Gehorsamsformel zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für deutsche Leser geglättet, ohne die gegenseitigen Blicke, die heitere Entschlossenheit oder das Bild vom Hüten des Gesetzes aufzulösen. Die auffällige griechische Konstruktion um εἷς ... πάντες und das reflexive ἑαυτούς wird als gemeinsames Sprechen der Brüder wiedergegeben.
