  rationale: Die Überarbeitung stellt die „Herrschaft über die Leidenschaften“ wieder als den anerkannten Gegenstand heraus und ordnet sie, entsprechend der griechischen Genitivverbindung, der εὐλογιστία zu. Die Erklärung wahrt die mögliche Bedeutungsspanne von πάθη und εὐλογιστία, ohne eine konfessionelle oder philosophisch überpräzise Festlegung vorzunehmen.
