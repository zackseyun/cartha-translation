base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/005.yaml
  text: How then can one fail to acknowledge in these men the mastery over suffering that comes from blessedness[a], since they were not turned aside even by the pains of fire?
translation:
  language: de
  text: Wie sollte man da nicht an diesen Männern die Herrschaft über die Leidenschaften anerkennen, die aus rechter Vernunft hervorgeht[a], da selbst die Qualen des Feuers sie nicht von ihrem Weg abbrachten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »die Herrschaft über die Leidenschaften der εὐλογιστία«. Das seltene Wort εὐλογιστία kann hier rechte bzw. gute Vernunft oder vernünftige Besonnenheit bezeichnen. παθοκρατία meint die Beherrschung der πάθη, also der Leidenschaften oder, im Zusammenhang der Folter, auch der Leiden.'
    reason: Die ungewöhnliche griechische Wortgruppe ist semantisch und in der genauen Genitivbeziehung nicht eindeutig; die Anmerkung erläutert dies, ohne eine Deutung als zwingend auszugeben.
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν ... ὁμολογεῖν
  choice: Wie sollte man da nicht anerkennen
  rationale: Die rhetorische Frage stellt die Anerkennung als unausweichlich dar. Diese deutsche Wendung bewahrt ihre argumentative Kraft und klingt zugleich natürlich.
- source_word: τούτοις
  choice: bei diesen Männern
  rationale: Der Dativ bezeichnet die Männer, an denen die genannte Eigenschaft sichtbar wird. Das maskuline Relativpronomen οἱ bestätigt, dass Personen gemeint sind.
- source_word: τὴν τῆς εὐλογιστίας παθοκρατίαν
  choice: dass bei diesen Männern die rechte Vernunft über die Leidenschaften herrschte
  rationale: εὐλογιστία bezeichnet hier am ehesten gutes oder rechtes Überlegen beziehungsweise vernünftige Besonnenheit; παθοκρατία ist die Herrschaft über πάθη, also Leiden, Regungen oder Leidenschaften. Die verbale Formulierung ist im Deutschen verständlicher als ein schweres abstraktes Nominalgefüge und bewahrt die philosophische Aussage des griechischen Textes.
- source_word: τῶν ... διὰ πυρὸς ἀλγηδόνων
  choice: selbst die Qualen des Feuers
  rationale: ἀλγηδόνες sind Schmerzen oder Qualen; διὰ πυρός bezeichnet das Feuer als Mittel. Das griechische μέν hat hier keine ausdrücklich folgende Entsprechung und wird nicht mechanisch wiedergegeben; „selbst“ bringt die steigernde Wirkung im Zusammenhang zum Ausdruck.
- source_word: οὐκ ἐπεστράφησαν
  choice: sie nicht von ihrem Weg abbrachten
  rationale: Das Passiv bezeichnet, dass die Männer durch die Qualen nicht umgewandt oder von ihrer Haltung abgebracht wurden. „Von ihrem Weg abbringen“ gibt diese Standhaftigkeit idiomatisch wieder, ohne einen konkreten Sinneswandel näher festzulegen.
theological_decisions:
- issue: Deutung der seltenen Wortgruppe τῆς εὐλογιστίας παθοκρατίαν
  choice: Herrschaft der rechten Vernunft über die Leidenschaften
  alternative: Herrschaft über Leiden, die aus vernünftiger Besonnenheit beziehungsweise Frömmigkeit hervorgeht
  rationale: Der Wortbildung nach weist εὐλογιστία auf gutes oder rechtes Überlegen, nicht unmittelbar auf „Seligkeit“, während παθοκρατία die Beherrschung von πάθη bezeichnet. Im Kontext des 4. Makkabäerbuches liegt daher vernünftige Selbstbeherrschung nahe. Die Fußnote hält jedoch offen, ob πάθη hier stärker als Leidenschaften oder angesichts der Feuerqualen als Leiden verstanden werden soll.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt erhalten; abstrakte griechische Begriffe werden in einen klaren deutschen Satz aufgelöst. Der Fußnotenmarker [a] steht unmittelbar an der erklärungsbedürftigen Wendung.
