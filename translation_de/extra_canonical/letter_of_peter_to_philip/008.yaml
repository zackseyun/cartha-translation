review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den kurzen Schlussabschnitt überwiegend treffend wieder. Eine sichere Korrektur ist jedoch nötig: Die eckigen Klammern um die rekonstruierte Anrede am Anfang sind entfallen, und »vier Verkündigungsaufträge« legt die schwierige, im Zeugen ungewöhnliche Wendung »into four messages« als konkrete Missionsbeauftragungen aus. Diese Auslegung ist weder durch den Zeugen noch durch den vorliegenden Textstand hinreichend abgesichert.'
  naturalness: Das Deutsch ist modern, verständlich und dem würdevollen Register angemessen. »zu vier Botschaften, um zu predigen« bleibt absichtlich etwas sperrig, weil die zugrunde liegende Überlieferung an dieser Stelle semantisch schwierig ist; es vermeidet die nicht abgesicherte Konkretisierung zu vier Aufträgen oder Missionsreisen.
  terminology: »Urheber unserer Ruhe«, »Geist der Einsicht«, »ein heiliger Geist« und »meinem Namen treu« sind sachgerecht und bewahren die theologische Offenheit des Zeugen. »Heilungen vollbringen« ist verständlich und quellentreu. Die Namen Petrus, Jesus Christus und Philippus sind standardsprachlich konsistent.
  issues:
  - severity: medium
    issue: Rekonstruierte Anfangsanrede nicht markiert
    rationale: Der Zeuge bietet »[Our Lord], Jesus Christ«; die Übersetzung muss die Rekonstruktion mit eckigen Klammern sichtbar halten.
  - severity: medium
    issue: »vier Verkündigungsaufträge« ist eine nicht abgesicherte Auslegung
    rationale: Die Zeugenformulierung »into four messages [7] to preach« ist schwierig. »Verkündigungsaufträge« fügt den Sinn von Beauftragungen und damit eine spezifische Deutung hinzu. Die Übersetzung sollte die Unklarheit bewahren.
  - severity: low
    issue: »Später« verstärkt die zeitliche Einordnung
    rationale: Der Zeuge reiht die Handlung lediglich fortlaufend aneinander. »Dann« ist neutraler und ausreichend natürlich.
  revised_text: 'Petrus [versammelte daraufhin die anderen] und sagte: »[Unser Herr], Jesus Christus, Urheber unserer Ruhe, schenke uns einen Geist der Einsicht, damit auch wir Wunder vollbringen können!«


    Daraufhin sahen Petrus und die anderen Apostel [ihn]. Sie wurden mit einem heiligen Geist erfüllt, und jeder von ihnen vollbrachte Heilungen. Dann zogen sie aus, um den Herrn Jesus zu verkünden. Dann kamen sie zusammen, begrüßten einander und sagten: »Amen.«


    Daraufhin erschien Jesus und sagte zu ihnen: »Friede sei mit euch [allen] und mit allen, die meinem Namen treu sind. Wenn ihr aufbrecht, werden Freude, Gnade und Kraft mit euch sein. Fürchtet euch nicht. Seht, ich werde allezeit bei euch sein.«


    Dann trennten sich die Apostel voneinander zu vier Botschaften, um zu predigen, und gingen in der Kraft Jesu in Frieden.


    Der Brief des Petrus an Philippus'
  revised_footnotes: []
  revision_rationale: Die Revision stellt die ausgelassene Kennzeichnung rekonstruierter Wörter wieder her, ersetzt die interpretierende Wiedergabe der schwierigen Wendung über die »vier Botschaften« durch eine bewusst offene Übersetzung und glättet lediglich die unnötig verstärkende Zeitangabe. Die übrigen etablierten theologischen und lexikalischen Entscheidungen bleiben erhalten.
