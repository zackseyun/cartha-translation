base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/008.yaml
  text: 'Peter [then] gathered [the others] and said, “Our Lord Jesus Christ, author of our rest, give us a spirit of understanding so that we too may perform wonders!”


    Peter and the other apostles then saw [him]. They were filled with a holy Spirit, and each one performed healings. They went out to proclaim the Lord Jesus. Later they gathered again, greeted one another, and said, “Amen.”


    Jesus then appeared and said to them, “Peace be with [all] of you and with everyone who is faithful in my name. As you go, joy, grace, and power will be yours. Do not be afraid. I will be with you always.”


    The apostles then parted from one another for their four preaching missions, and they went in peace with the power of Jesus.


    The Letter of Peter to Philip.'
translation:
  language: de
  text: 'Petrus [versammelte daraufhin die anderen] und sagte: »Unser Herr Jesus Christus, Urheber unserer Ruhe, schenke uns einen Geist der Einsicht, damit auch wir Wunder vollbringen können!«


    Daraufhin sahen Petrus und die anderen Apostel [ihn]. Sie wurden mit einem heiligen Geist erfüllt, und jeder von ihnen vollbrachte Heilungen. Dann zogen sie aus, um den Herrn Jesus zu verkünden. Später kamen sie wieder zusammen, begrüßten einander und sagten: »Amen.«


    Daraufhin erschien Jesus und sagte zu ihnen: »Friede sei mit euch [allen] und mit allen, die meinem Namen treu sind. Wenn ihr aufbrecht, werden Freude, Gnade und Kraft mit euch sein. Fürchtet euch nicht. Seht, ich werde allezeit bei euch sein.«


    Dann trennten sich die Apostel voneinander und zogen zu ihren vier Verkündigungsaufträgen aus. In der Kraft Jesu gingen sie in Frieden.


    Der Brief des Petrus an Philippus'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: author of our repose
  choice: Urheber unserer Ruhe
  rationale: Bewahrt das ungewöhnliche theologische Bild des Zeugnisses; »Ruhe« lässt sowohl Frieden als auch endzeitliche Ruhe anklingen, ohne die Bedeutung festzulegen.
- source_word: spirit of insight
  choice: Geist der Einsicht
  rationale: Gibt die Erkenntnisdimension direkt und in natürlichem Deutsch wieder.
- source_word: performed healings
  choice: vollbrachte Heilungen
  rationale: Folgt der konkreten Aussage des Zeugnisses und vermeidet eine unnötige Umschreibung.
- source_word: faithful in my name
  choice: meinem Namen treu sind
  rationale: Erhält die mögliche Bedeutung von Treue beziehungsweise Glauben, ohne sie ausschließlich als inneres Glauben zu deuten.
- source_word: into four messages
  choice: zu ihren vier Verkündigungsaufträgen
  rationale: Die Formulierung des englischen Zeugnisses ist schwierig; diese Wiedergabe folgt der im konsultierten POB-Text erkannten Missionsbedeutung, ohne vier konkrete Botschaftsinhalte zu erfinden.
theological_decisions:
- issue: Groß- oder Kleinschreibung von »heiliger Geist«
  choice: ein heiliger Geist
  alternative: der Heilige Geist
  rationale: Der unbestimmte Artikel und die Kleinschreibung bewahren die Form des vorliegenden Zeugnisses und vermeiden eine stillschweigende dogmatische Identifizierung.
- issue: Bedeutung der verheißenen Gegenwart Jesu
  choice: »ich werde allezeit bei euch sein«
  alternative: »ich werde euch fortwährend begleiten«
  rationale: Die direkte Formulierung erhält die theologische Spannung und die Anspielung an frühchristliche Sendungstraditionen.
- issue: »repose« als theologischer Begriff
  choice: Ruhe
  alternative: Frieden; Erquickung
  rationale: »Ruhe« ist semantisch offen und bewahrt mögliche soteriologische oder eschatologische Konnotationen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut verständlichem Satzbau. Rekonstruierte Wörter bleiben in eckigen Klammern. Die Schlussüberschrift ist knapp und manuskriptnah gestaltet. Da die direkte Prüfung des koptischen Textes noch aussteht, bleibt die Fassung ausdrücklich am bereitgestellten gemeinfreien englischen Zeugen orientiert.
