translation:
  language: de
  text: 'Dann wurde ein helles Licht sichtbar, und der Berg erstrahlte angesichts dessen, der sichtbar geworden war. Eine Stimme rief ihnen zu und sagte:


    „Achtet auf meine Worte, damit ich zu euch sprechen kann.

    Warum sucht ihr mich?

    Ich bin Jesus Christus, der allezeit bei euch bleibt.“


    Die Apostel antworteten:


    „Herr, wir möchten gern den Mangel der Äonen[a] und auch ihre Fülle verstehen und erfahren, wie wir an diesem Aufenthaltsort festgehalten werden.

    Wie sind wir an diesen Ort gelangt?

    Wie werden wir ihn verlassen?

    […][b] Wie erlangen wir die Vollmacht, offen und frei zu reden?[c]

    Warum kämpfen die Mächte gegen uns?“


    Da rief eine Stimme aus dem Licht ihnen zu: „Ihr seid es, die bezeugen, dass ich euch dies alles gesagt habe. Doch wegen eures mangelnden Vertrauens[d] werde ich es wiederholen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Äonen“ bezeichnet hier Größen oder Bereiche der jenseitigen Weltordnung; die genaue Bedeutung bleibt im vorliegenden Abschnitt offen.
    reason: Der seltene kosmologische Fachbegriff benötigt eine knappe Verständnishilfe, ohne auf ein bestimmtes Lehrsystem festgelegt zu werden.
  - marker: b
    text: An dieser Stelle zeigt die Textvorlage eine Lücke oder unsichere Überlieferung an.
    reason: Das im englischen Text vorhandene Signal für Textverlust oder eine mögliche Ergänzung muss sichtbar erhalten bleiben.
  - marker: c
    text: Wörtlich geht es um „Vollmacht zur Freimütigkeit“ beziehungsweise um die Befugnis, offen zu reden.
    reason: Die ungewöhnliche Verbindung von Vollmacht und freimütiger Rede lässt sich im Deutschen nicht zugleich knapp und vollständig abbilden.
  - marker: d
    text: 'Auch möglich: „wegen eures Unglaubens“ oder „wegen eurer Untreue“.'
    reason: Die zugrunde liegende Bedeutung ist laut vorläufiger englischer Vorlage mehrdeutig; eine Prüfung am koptischen Text steht noch aus.
lexical_decisions:
- source_word: aeons
  choice: Äonen
  rationale: Der fachsprachliche kosmologische Begriff wird beibehalten, weil eine Auflösung als „Zeitalter“ oder „Ewigkeiten“ die im Text vorausgesetzten überweltlichen Größen vorschnell deuten würde.
- source_word: deficiency
  choice: Mangel
  rationale: „Mangel“ bewahrt den Gegensatz zur „Fülle“ und legt nicht genauer fest, ob ein Zustand, ein Bereich oder ein kosmologischer Vorgang gemeint ist.
- source_word: fullness
  choice: Fülle
  rationale: Die wörtliche und in antiker kosmologischer Sprache etablierte Entsprechung erhält den bewussten Gegensatz zum Mangel.
- source_word: dwelling-place
  choice: Aufenthaltsort
  rationale: Die Wahl bleibt gegenüber „Wohnstätte“, „Welt“ oder „Leib“ deutungsoffen und bezeichnet den Ort ihres gegenwärtigen Festgehaltenwerdens.
- source_word: authority for boldness of speech
  choice: Vollmacht, offen und frei zu reden
  rationale: Die Formulierung gibt sowohl die verliehene Befugnis als auch den Gedanken freimütiger Rede wieder, ohne das schwierige Verhältnis beider Begriffe einzuebnen.
- source_word: powers
  choice: Mächte
  rationale: Die personale oder kosmische Mehrdeutigkeit bleibt erhalten; „Gewalten“ wäre ebenfalls möglich.
- source_word: unfaithfulness
  choice: mangelndes Vertrauen
  rationale: Diese Wiedergabe lässt offen, ob Unglaube, Zweifel oder fehlende Treue im Vordergrund steht, und passt zur direkten Anrede der Apostel.
theological_decisions:
- issue: Art der Äonen und ihrer Fülle
  choice: Die kosmologischen Begriffe „Äonen“, „Mangel“ und „Fülle“ bleiben unaufgelöst.
  alternative: Die Äonen als Zeitalter, Geistwesen oder bestimmte kosmische Bereiche erklären.
  rationale: Der überlieferte Wortlaut bietet hier keine hinreichende Grundlage, eine einzelne kosmologische Systematik verbindlich einzutragen.
- issue: Gegenwart Jesu
  choice: „der allezeit bei euch bleibt“
  alternative: „der fortwährend in euch wohnt“ oder „der immer mit euch ist“
  rationale: „Bei euch bleibt“ bewahrt die kontinuierliche Gegenwart, ohne aus der Präposition eine ausdrückliche Innewohnung abzuleiten.
- issue: unfaithfulness
  choice: „mangelndes Vertrauen“
  alternative: „Unglaube“ oder „Untreue“
  rationale: Der Ausdruck soll weder ausschließlich intellektuellen Unglauben noch einen bewussten Treuebruch behaupten.
translation_notes:
  register: Moderner, würdevoller Erzählstil mit kurzen, mündlich wirkenden Fragen. Die direkte Rede bleibt rhythmisch gegliedert. Da eine Prüfung am koptischen Ausgangstext noch aussteht, ist die Fassung ausdrücklich vorläufig und stützt sich auf den angegebenen gemeinfreien englischen Übersetzungszeugen.
