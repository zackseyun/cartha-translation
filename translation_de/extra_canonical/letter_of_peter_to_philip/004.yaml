translation:
  language: de
  text: '„Was nun [den Mangel] der Äonen betrifft, so besteht der Mangel in Folgendem: Als der Trotz und die Unbesonnenheit der Mutter offenbar wurden – außerhalb der Ordnung der Größe des Vaters –, wollte sie Äonen hervorbringen. Als sie sprach, folgte ihr der Tyrann. Doch als sie ein Stück zurückließ, ergriff der Tyrann es, und es wurde zu einem Mangel. Das ist der Mangel der Äonen.


    Als der Tyrann ein Stück an sich genommen hatte, pflanzte er es ein, setzte Mächte und Gewalten darüber ein und schloss es in die sterblichen Äonen ein. Alle kosmischen Mächte freuten sich darüber, dass sie hervorgebracht worden waren. [a] Doch sie kannten den schon zuvor existierenden [Vater] nicht, weil sie ihm fremd sind. [Stattdessen wurde diesem] Tyrannen Macht verliehen, und sie beteten ihn an und priesen ihn.


    Da wurde der Sinn des Tyrannen wegen des Lobes der Mächte hochmütig. Er wurde zum Widersacher und wollte ein Bild [durch ein anderes Bild] und eine Gestalt durch eine andere Gestalt ersetzen. Dann beauftragte er die Mächte unter seiner Herrschaft, sterbliche Körper zu formen; und diese entstanden aus einer Abweichung von dem hervorgebrachten Abbild.“'
  philosophy: optimal-equivalence
