lexical_decisions:
- source_word: deficiency
  choice: Mangel
  rationale: Bewahrt den kosmologischen Fachbegriff in natürlichem Deutsch, ohne ihn als moralische Schuld oder bloßen Fehler auszulegen.
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte deutschsprachige Fachausdruck erhält die besondere kosmologische Bedeutung; eine Wiedergabe als „Zeitalter“ wäre hier irreführend.
- source_word: defiance
  choice: Trotz
  rationale: Gibt die widersetzliche Haltung wieder, ohne die Passage durch „Rebellion“ stärker zu systematisieren.
- source_word: thoughtlessness
  choice: Unbesonnenheit
  rationale: Bezeichnet mangelnde Überlegung und vermeidet das im Deutschen missverständliche „Gedankenlosigkeit“.
- source_word: the tyrannical one
  choice: der Tyrann
  rationale: Natürliches, wiedererkennbares Deutsch für die substantivierte Bezeichnung; die negative Herrschaftscharakterisierung bleibt erhalten.
- source_word: powers and authorities
  choice: Mächte und Gewalten
  rationale: Bewahrt zwei unterschiedene kosmische Herrschaftsbegriffe und entspricht traditionsfähigem, aber verständlichem Deutsch.
- source_word: mind
  choice: Sinn
  rationale: Lässt die mögliche Bedeutung von Denkvermögen, Gesinnung oder innerer Haltung offen.
- source_word: opponent
  choice: Widersacher
  rationale: Gibt die gegnerische Rolle würdig und deutlich wieder, ohne den Tyrannen ausdrücklich mit einer bestimmten theologischen Gestalt gleichzusetzen.
- source_word: likeness
  choice: Abbild
  rationale: Unterscheidet den Ausdruck lesbar von „Bild“ und „Gestalt“, ohne eine präzise metaphysische Theorie festzulegen.
- source_word: disparity
  choice: Abweichung
  rationale: Bewahrt den Gedanken einer Nichtübereinstimmung mit dem Abbild; die schwierige Formulierung wird nicht spekulativ geglättet.
theological_decisions:
- issue: Die Handlung der Mutter außerhalb der väterlichen Ordnung
  choice: „außerhalb der Ordnung der Größe des Vaters“
  alternative: „ohne Anordnung der Majestät des Vaters“
  rationale: Die gewählte Fassung bewahrt die Ambiguität, ob eine kosmische Ordnung oder ein ausdrücklicher Befehl gemeint ist, und vermeidet eine dogmatische Festlegung.
- issue: Der präexistente Vater
  choice: „der schon zuvor existierende [Vater]“
  alternative: „der präexistente [Vater]“
  rationale: Formuliert den Sinn allgemeinverständlich und erhält die editorische Ergänzung „Vater“ in eckigen Klammern.
- issue: Empfänger der verliehenen Macht
  choice: „[Stattdessen wurde diesem] Tyrannen Macht verliehen“
  alternative: „[Stattdessen erhielt dieser] Tyrann Macht“
  rationale: Die Ergänzung bleibt durch Klammern als textkritisch unsicher sichtbar; die passive Form vermeidet eine unbelegte Aussage darüber, wer die Macht verlieh.
- issue: Entstehung sterblicher Körper
  choice: „entstanden aus einer Abweichung von dem hervorgebrachten Abbild“
  alternative: „entstanden aus der Verschiedenheit des hervorgebrachten Gleichnisses“
  rationale: Die schwierige kosmologische Aussage bleibt erkennbar und wird weder als Schöpfung aus Materie noch als moralischer Sündenfall ausgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit behutsam beibehaltenen kosmologischen Fachbegriffen. Eckige Klammern kennzeichnen editorisch ergänzten oder beschädigten Text. Da eine direkte Prüfung des koptischen Wortlauts noch aussteht, ist die Fassung ausdrücklich vorläufig und eng am bereitgestellten gemeinfreien englischen Zeugen orientiert.
