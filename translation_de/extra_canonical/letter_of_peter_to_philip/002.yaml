review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt dessen ungewöhnliche Titel, die dreifache Anrufung sowie die offene Ergänzungsstelle. Korrigiert werden sollte die habituelle Vergangenheit bei den früheren Zusammenkünften auf dem Ölberg. Die direkte Prüfung am koptischen Text bleibt ausstehend.
  naturalness: Die Gebetssprache ist würdevoll und im modernen Standarddeutsch verständlich. „Sie hatten sich früher … versammelt“ bezeichnet jedoch eher abgeschlossene Vorzeitigkeit; „sich … zu versammeln pflegten“ gibt das englische „would assemble“ als wiederholte frühere Praxis treffender wieder. Der Anschluss „wie … weil“ sollte nicht durch ein Semikolon aufgetrennt werden, da die Vorlage beide Teile fortlaufend verbindet.
  terminology: „Ölberg“, „die Unvergänglichen“, „im Leib wohnte“, „Christus der Unvergänglichkeit“ und „Erlöser“ sind sachgerecht. Die Genitivverbindung bei „Christus der Unvergänglichkeit“ erhält die vorlagenbedingte Mehrdeutigkeit.
  issues:
  - severity: medium
    issue: Habituelle frühere Versammlungen abgeschwächt
    rationale: Das englische „where formerly they would assemble together“ beschreibt eine wiederholte frühere Gewohnheit. „Dort hatten sie sich früher … versammelt“ kann lediglich frühere, abgeschlossene Ereignisse bezeichnen. „wo sie sich früher … zu versammeln pflegten“ bewahrt den Aspekt.
  - severity: low
    issue: Satzzeichen unterbricht den vorlagennahen Vergleichs- und Begründungsanschluss
    rationale: Das Semikolon nach „Gefallen gefunden hast“ trennt „because“ stärker ab als die Vorlage. Ein Komma vor „weil“ bildet den fortlaufenden, wenn auch stilistisch ungewöhnlichen Zusammenhang transparenter nach.
  - severity: low
    issue: Fußnote deutet die leere Klammer zu bestimmt als Textverlust
    rationale: Die leere Ergänzungsmarkierung zeigt eine textkritische Unsicherheit, erlaubt aber nicht zwingend die Aussage, dass Text verloren ist. Die Anmerkung sollte dies neutral dokumentieren.
