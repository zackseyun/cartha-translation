translation:
  language: de
  text: 'Dann versammelte Petrus die anderen. Sie gingen zu dem Berg, der Ölberg genannt wird. Dort hatten sie sich früher mit dem seligen Christus versammelt, als er im Leib wohnte.


    Als die Apostel zusammengekommen und auf die Knie gefallen waren, beteten sie und sprachen:


    „Vater, Vater, Vater des Lichts,

    dir gehören die Unvergänglichen.

    Höre uns,

    wie du an deinem heiligen Sohn Jesus Christus Gefallen gefunden hast;

    denn um unseretwillen ist er ein Licht [a] in der Finsternis geworden.

    Wahrlich, höre uns.“


    Und noch einmal beteten sie und sprachen:


    „Sohn des Lebens, Sohn der Unvergänglichkeit,

    der du im Licht wohnst,

    Sohn, Christus der Unvergänglichkeit,

    unser Erlöser,

    gib uns Kraft;

    denn sie jagen uns, um uns zu töten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Textvorlage zeigt nach „Licht“ eine leere Ergänzungsmarkierung; offenbar ist an dieser Stelle Text verloren oder unsicher.
    reason: Der leere Marker des englischen Zeugnisses wird nicht bedeutungslos in den Haupttext übernommen, sondern durch einen zugeordneten Fußnotenhinweis transparent dokumentiert.
lexical_decisions:
- source_word: Olivet
  choice: Ölberg
  rationale: Die geläufige moderne deutsche Bezeichnung für den in der Überlieferung genannten Berg.
- source_word: blessed Christ
  choice: seliger Christus
  rationale: Bewahrt die wertende und religiöse Färbung des Zeugnisses, ohne sie durch eine konfessionell stärker geprägte Formulierung zu erweitern.
- source_word: dwelt in the body
  choice: im Leib wohnte
  rationale: Eine bewusst formnahe Wiedergabe, die die mögliche anthropologische und theologische Spannung der Aussage nicht zu „lebte als Mensch“ einebnet.
- source_word: indestructible ones
  choice: die Unvergänglichen
  rationale: „Unvergänglich“ ist im religiösen Register natürlicher als „unzerstörbar“ und lässt die Identität der bezeichneten Wesen offen.
- source_word: deathlessness
  choice: Unvergänglichkeit
  rationale: Gibt den Zustand des Nicht-Sterbens in einem würdigen deutschen Abstraktum wieder; „Unsterblichkeit“ wäre ebenfalls möglich, könnte aber vertrautere dogmatische Kategorien stärker aufrufen.
- source_word: redeemer
  choice: Erlöser
  rationale: Die übliche, verständliche deutsche Wiedergabe im religiösen Kontext.
- source_word: hunting for us
  choice: sie jagen uns
  rationale: Bewahrt die konkrete Bedrohungsmetapher gegenüber dem schwächeren „sie verfolgen uns“.
theological_decisions:
- issue: Christus „wohnte im Leib“
  choice: als er im Leib wohnte
  alternative: als er leibhaftig lebte
  rationale: Die formnahe Fassung bewahrt die möglicherweise eigenständige Leibvorstellung des Textes, ohne sie christologisch zu harmonisieren.
- issue: Zugehörigkeit der Unvergänglichen zum Vater
  choice: dir gehören die Unvergänglichen
  alternative: du, bei dem die Unvergänglichen sind
  rationale: Folgt der vorliegenden Zeugnisformulierung „to whom belong“, lässt aber offen, wer oder was mit den Unvergänglichen gemeint ist.
- issue: Gefallen des Vaters am Sohn
  choice: wie du an deinem heiligen Sohn Jesus Christus Gefallen gefunden hast
  alternative: so wie du dich über deinen heiligen Sohn Jesus Christus gefreut hast
  rationale: „Gefallen gefunden“ bewahrt die mögliche Anspielung auf traditionelle Gottesstimmen-Formeln und zugleich den Vergleichsanschluss, ohne ihn zu erklären.
- issue: Titel „Christ of deathlessness“
  choice: Christus der Unvergänglichkeit
  alternative: unvergänglicher Christus
  rationale: Die ungewöhnliche Genitivverbindung wird erhalten, damit die Beziehung zwischen Christus und Unvergänglichkeit nicht vorschnell als bloße Eigenschaft gedeutet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit formnaher Gestaltung der Gebetszeilen. Die dreifache Anrufung und die wiederholten Titel bleiben erhalten. Der isolierte Vermerk „[1]“ des Zeugnisses wurde als intrusive Seiten- oder Editionszahl nicht übersetzt. Da die direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich auf das bereitgestellte gemeinfreie englische Zeugnis gegründet; Unsicherheiten werden nicht stillschweigend aufgelöst.
