lexical_decisions:
- source_word: all praises
  choice: mit allem Lobpreis
  rationale: Gibt die umfassende Danksagung in natürlichem, würdigem Deutsch wieder, ohne eine konkrete liturgische Form einzutragen.
- source_word: on account of our being small
  choice: weil wir gering sind
  rationale: Bewahrt die ungewöhnliche und möglicherweise theologisch aufgeladene Aussage, statt sie als bloße Schwäche oder Bedeutungslosigkeit auszudeuten.
- source_word: dwelt in the body
  choice: im Leib wohnte
  rationale: Erhält die körperbezogene Bildsprache und ihre mögliche theologische Spannung.
- source_word: a holy Spirit
  choice: ein heiliger Geist
  rationale: Der unbestimmte Artikel des Zeugen wird bewahrt; eine Gleichsetzung mit der feststehenden trinitarischen Bezeichnung wird nicht stillschweigend vorgenommen.
- source_word: tree
  choice: Holz
  rationale: Bewahrt die traditionelle Mehrdeutigkeit zwischen Holz, Baum und Kreuzesholz; »Kreuz« wäre interpretierend enger.
- source_word: alien to such suffering
  choice: einem solchen Leiden fremd
  rationale: Die auffällige Distanzierungsformulierung bleibt wörtlich erkennbar und wird nicht christologisch harmonisiert.
- source_word: trespass of the Mother
  choice: Verfehlung der Mutter
  rationale: Gibt den technischen bzw. mythologischen Ausdruck neutral wieder, ohne die Identität der »Mutter« zu bestimmen.
- source_word: author of our life
  choice: Urheber unseres Lebens
  rationale: Bewahrt den Gedanken des Hervorbringens oder Begründens, ohne ihn auf »Schöpfer« oder »Anführer« festzulegen.
- source_word: walk
  choice: wandeln
  rationale: Das leicht gehobene Verb erhält die ethisch-religiöse Wegmetapher; wegen der folgenden Lücke bleibt ihr genauer Sinn offen.
theological_decisions:
- issue: Verhältnis Jesu zum Leiden
  choice: »Jesus ist einem solchen Leiden fremd«
  alternative: »Jesus selbst hat dieses Leiden nicht wirklich erfahren«
  rationale: Die Quelle formuliert eine Spannung zur vorangehenden Leidensdarstellung. Diese wird nicht durch eine doketische oder orthodox-harmonisierende Erklärung aufgelöst.
- issue: Identität des erfüllenden Geistes
  choice: »von einem heiligen Geist erfüllt«
  alternative: »vom Heiligen Geist erfüllt«
  rationale: Der vorliegende englische Zeuge bietet einen unbestimmten Ausdruck. Mangels direkter koptischer Prüfung bleibt diese grammatische und theologische Offenheit erhalten.
- issue: Symbolische Bedeutung der Passion
  choice: »verkündete er alles in sinnbildlicher Bedeutung«
  alternative: »sprach er nur in Gleichnissen«
  rationale: Die Aussage wird weder abgeschwächt noch zu einer Verneinung der Passion ausgebaut; die Art der Symbolik bleibt unbestimmt.
- issue: Die Mutter
  choice: Großschreibung und keine Identifikation
  alternative: Identifikation etwa mit Eva, Sophia oder einer kosmischen Muttergestalt
  rationale: Der Text nennt nur »die Mutter«. Eine konkrete mythologische oder biblische Zuordnung wäre konfessionell bzw. interpretatorisch übergriffig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderat gehobenem biblischem Ton. Wiederholungen und parataktische Strukturen wurden weitgehend erhalten. Manuskriptseitenzahlen wurden nicht in den Lesetext übernommen. Die Fassung ist vorläufig, da die direkte Prüfung des koptischen Textes noch aussteht; beschädigte Stellen sind sichtbar belassen.
