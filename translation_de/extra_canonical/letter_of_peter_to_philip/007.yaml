review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem vorliegenden englischen Zeugen insgesamt eng und bewahrt die auffälligen theologischen Spannungen, insbesondere Jesu Fremdheit gegenüber dem Leiden, die unbestimmte Formulierung »ein heiliger Geist« und die nicht identifizierte »Mutter«. Korrigiert werden sollten jedoch mehrere im Zeugen sichtbare Textschadens- bzw. Ergänzungsmarkierungen: das leere Klammerfeld in der beschädigten Rede, die Ergänzungsmarkierung in »[de]scended« sowie das ergänzte unbestimmte Artikelwort bei »healed [a] multitude«. Ferner sollte die modale Notwendigkeit bei der Vorhersage des Verschlepptwerdens ausdrücklich erhalten bleiben.'
  naturalness: Das Deutsch ist überwiegend klar, würdig und modern. »in sinnbildlicher Bedeutung« ist jedoch keine idiomatische Wiedergabe von »with a symbolic meaning«; »auf symbolische Weise« ist natürlich und lässt den Sinn offen. Bei der Heilung ist »eine große Menge heilen« im Deutschen ohne Personenbezug holprig; »eine Vielzahl von Menschen« ist idiomatisch.
  terminology: Die Entscheidungen »gering«, »im Leib«, »ein heiliger Geist«, »Holz«, »einem solchen Leiden fremd«, »Verfehlung der Mutter«, »Urheber« und »wandeln« sind angemessen zurückhaltend. »Statthalter« ist als Wiedergabe von »governors« vertretbar. Die Bezeichnung »Sohn der unermesslichen Herrlichkeit des Vaters« bewahrt die syntaktische und theologische Offenheit des Zeugen.
  issues:
  - severity: medium
    issue: Die Satzlücke nach »der wird auch nicht« ist nicht vollständig markiert.
    rationale: Der englische Zeuge hat ausdrücklich »[will] not [] [. . . my] Father«. Die deutsche Fassung bewahrt zwar die größere Lücke, lässt aber das separate leere Klammerfeld »[]« aus. Dieses sollte als »[]« erhalten bleiben, damit der fragmentarische Befund nicht geglättet wird.
  - severity: medium
    issue: Die Ergänzungsmarkierung in »[de]scended« wurde in der deutschen Zeile nicht wiedergegeben.
    rationale: Die eckigen Klammern kennzeichnen ergänzten bzw. unsicheren Text. Eine deutsche Entsprechung wie »stieg [her]ab« erhält diese editorische Information ohne den Sinn zu verändern.
  - severity: medium
    issue: Die modale Notwendigkeit beim Verschlepptwerden ist abgeschwächt.
    rationale: »You will have to be dragged« besagt nicht nur eine zukünftige Handlung, sondern ein Erleiden-Müssen. »Ihr werdet in die Synagogen und vor die Statthalter geschleppt werden müssen« bewahrt dies genauer.
  - severity: low
    issue: Die Ergänzungsmarkierung bei »healed [a] multitude« fehlt, und die Formulierung ist im Deutschen unidiomatisch.
    rationale: Die Ergänzung »[eine]« sollte sichtbar bleiben. »heilten [eine] Vielzahl von Menschen« gibt die personale Menge natürlich wieder, ohne den Inhalt auszuweiten.
  - severity: low
    issue: »in sinnbildlicher Bedeutung« klingt im Deutschen unnatürlich.
    rationale: »auf symbolische Weise« ist idiomatischer und gibt die nicht näher bestimmte symbolische Ausdrucksweise des Zeugen wieder.
  revised_text: 'Die Apostel dankten daraufhin dem Herrn mit allem Lobpreis und kehrten nach Jerusalem zurück.


    Als sie auf dem Weg den Berg hinab nach Jerusalem gingen, sprachen sie miteinander über das Licht, das sichtbar geworden war. Dabei entstand ein Streitgespräch über den Herrn, und sie sagten: »Wenn er, unser Herr, gelitten hat, wie viel mehr werden dann wir leiden?«


