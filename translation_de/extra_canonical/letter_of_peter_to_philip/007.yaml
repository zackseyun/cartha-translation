    Da kam eine Stimme zu ihnen und sagte: »Ich habe euch oft gesagt, dass ihr leiden müsst. Ihr werdet in die Synagogen und vor die Statthalter geschleppt werden müssen, und dadurch werdet ihr leiden. Wer jedoch nicht leiden wird, der wird auch nicht [] [… mein] Vater […], damit er […] kann.«[a]


    Die Apostel aber freuten sich sehr und zogen hinauf nach Jerusalem. Sie gingen hinauf zum Tempel, lehrten die Rettung im Namen des Herrn Jesus Christus und heilten [eine] Vielzahl von Menschen.


