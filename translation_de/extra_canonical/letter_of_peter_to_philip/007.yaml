translation:
  language: de
  text: 'Die Apostel dankten daraufhin dem Herrn mit allem Lobpreis und kehrten nach Jerusalem zurück.


    Als sie auf dem Weg den Berg hinab nach Jerusalem gingen, sprachen sie miteinander über das Licht, das sichtbar geworden war. Dabei entstand ein Streitgespräch über den Herrn, und sie sagten: »Wenn er, unser Herr, gelitten hat, wie viel mehr werden dann wir leiden?«


    Petrus antwortete: »Er hat um unseretwillen gelitten, und auch wir werden leiden müssen, weil wir gering sind.«


    Da kam eine Stimme zu ihnen und sagte: »Ich habe euch oft gesagt, dass ihr leiden müsst. Man wird euch in die Synagogen und vor die Statthalter schleppen, und dadurch werdet ihr leiden. Wer jedoch nicht leiden wird, der wird auch nicht […] [… mein] Vater […], damit er […] kann.«[a]


    Die Apostel aber freuten sich sehr und zogen hinauf nach Jerusalem. Sie gingen hinauf zum Tempel, lehrten die Rettung im Namen des Herrn Jesus Christus und heilten eine große Menge.


    Petrus begann zu sprechen und sagte zu seinen Jüngern: »Als unser Herr Jesus im Leib wohnte, sagte er uns alles, denn er selbst war herabgekommen. Meine Brüder, hört auf meine Stimme.«


    Er wurde von einem heiligen Geist erfüllt und sprach:


    »Unser Licht, Jesus, kam herab,

    und er wurde gekreuzigt,

    und er trug eine Dornenkrone,

    und er legte ein purpurfarbenes Gewand an,

    und er wurde an ein Holz gehängt,

    und er wurde in einem Grab bestattet,

    und er stand von den Toten auf.


    Meine Brüder, Jesus ist einem solchen Leiden fremd. Wir aber sind es, die wegen der Verfehlung der Mutter gelitten haben. Darum verkündete er alles in sinnbildlicher Bedeutung, als er unter uns war. Der Herr Jesus, der Sohn der unermesslichen Herrlichkeit des Vaters, ist der Urheber unseres Lebens.


    Meine Brüder, schenken wir diesen Gottlosen keine Beachtung und wandeln wir nicht in […] […].«[b]'
