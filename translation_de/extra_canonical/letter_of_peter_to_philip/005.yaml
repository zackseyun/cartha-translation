  english_witness: “Now, concerning the fullness, it is I, [even] I, who was dispatched down into the body for the sake of this seed that had been lost, and I descended to their mortal mold. They, however, failed to notice me, imagining me to be a mortal person. I spoke with the one who is mine, and he paid attention to me, just like you, too, who have paid attention this day. I granted him authority to come into the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] by means of his salvation. Given that he was deficiency, he turned into fullness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/005.yaml
  text: “Now concerning the fullness, I, [yes] I, was sent down into the body for the sake of this seed that had been lost, and I descended into their mortal mold. But they did not recognize me, because they thought I was a mortal person. I spoke with the one who belongs to me, and he listened to me, just as you also have listened today. I gave him authority to enter the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] through his salvation. Since he was deficiency, he became fullness.
translation:
  language: de
  text: '„Was nun die Fülle betrifft: Ich, [ja] ich, wurde um dieses Samens willen, der verloren gegangen war, in den Leib hinabgesandt, und ich stieg in ihre sterbliche Gestalt hinab. Sie aber erkannten mich nicht, weil sie meinten, ich sei ein sterblicher Mensch. Ich sprach mit dem, der mir gehört, und er hörte auf mich, so wie auch ihr heute auf mich gehört habt. Ich gab ihm Vollmacht, das Erbe seiner Vaterschaft anzutreten, und ich nahm [ihn] [] [. . .] erfüllt [. . .] durch seine Rettung. Da er Mangel war, wurde er zur Fülle.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fullness
  choice: Fülle
  rationale: Bewahrt den vermutlich fachsprachlichen Gegensatz zu „Mangel“ und lässt dessen kosmologische oder soteriologische Bedeutung offen.
- source_word: seed
  choice: Samen
  rationale: Gibt die konkrete Metapher wieder, ohne sie als Nachkommenschaft, geistliche Gruppe oder inneres Prinzip auszudeuten.
- source_word: mortal mold
  choice: sterbliche Gestalt
  rationale: Natürliches Deutsch, das die Vorstellung einer geformten sterblichen Existenz bewahrt; „Form“ oder „Gebilde“ wären ebenfalls möglich.
- source_word: the one who is mine
  choice: der mir gehört
  rationale: Bewahrt die Zugehörigkeitsaussage, ohne die nicht ausdrücklich genannte Identität der Person festzulegen.
- source_word: authority
  choice: Vollmacht
  rationale: Entspricht einem übertragenen Recht oder einer Befugnis und passt zum Eintritt in ein Erbe.
- source_word: inheritance of his fatherhood
  choice: Erbe seiner Vaterschaft
  rationale: Bewahrt die ungewöhnliche und mehrdeutige Formulierung, statt sie zu einem Erbe „seines Vaters“ zu normalisieren.
- source_word: salvation
  choice: Rettung
  rationale: Ist im modernen Deutsch verständlich und vermeidet eine unnötige konfessionelle Festlegung durch das stärker kirchlich geprägte „Heil“.
- source_word: deficiency
  choice: Mangel
  rationale: Hält den begrifflichen Gegensatz zu „Fülle“ deutlich aufrecht.
theological_decisions:
- issue: Identität und Wesen des herabgesandten Sprechers
  choice: Der Sprecher bleibt als „ich“ ohne ergänzende christologische Benennung stehen.
  alternative: Den Sprecher ausdrücklich als Christus oder Erlöser bezeichnen.
  rationale: Der Ausschnitt selbst nennt keine solche Bezeichnung; eine Ergänzung würde die Identifikation interpretierend festlegen.
- issue: Bedeutung von „Fülle“ und „Mangel“
  choice: Die substantivischen Begriffe werden wörtlich und parallel wiedergegeben.
  alternative: Sie als Vollkommenheit und Unvollkommenheit erklären oder paraphrasieren.
  rationale: So bleibt die mögliche fachsprachliche beziehungsweise kosmologische Spannung des Textes erhalten.
- issue: Beschädigte Passage nach „ich nahm“
  choice: Die überlieferten Klammer- und Auslassungssignale bleiben sichtbar.
  alternative: Die Lücke syntaktisch rekonstruieren oder glätten.
  rationale: Eine sichere Rekonstruktion ist auf der vorliegenden Grundlage nicht möglich; Glättung würde einen Zusammenhang vortäuschen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit möglichst klarem Satzbau. Die Übersetzung ist vorläufig, da nur ein gemeinfreier englischer Zeuge als Arbeitsgrundlage vorliegt und die direkte Prüfung des koptischen Textes noch aussteht. Eckige Klammern und Auslassungspunkte bewahren Ergänzungs- und Schadenssignale der Vorlage; das isolierte „[]“ wurde deshalb unverändert belassen.
