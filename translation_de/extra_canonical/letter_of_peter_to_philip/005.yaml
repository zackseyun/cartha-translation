review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt zentrale Mehrdeutigkeiten: „Fülle/Mangel“, „Samen“, die Zugehörigkeitsformel sowie „Vaterschaft“ werden nicht ausdeutend erweitert. Die beschädigte Überlieferung ist korrekt sichtbar gehalten. Eine unmittelbare Kontrolle am koptischen Text ist nach den vorliegenden Angaben noch nicht möglich.'
  naturalness: Das Deutsch ist überwiegend klar und würdig. „Er hörte auf mich“ ist jedoch hier weniger idiomatisch als „er hörte mir zu“ und sollte mit der parallelen Anrede an die Zuhörer übereinstimmen. „In das Erbe ... eintreten“ gibt zudem die Bewegungsrichtung von „come into the inheritance“ unmittelbarer wieder als „das Erbe ... antreten“.
  terminology: „Fülle“ und „Mangel“ bewahren den auffälligen begrifflichen Gegensatz. „Vollmacht“, „Vaterschaft“ und „Rettung“ sind ohne konfessionell festlegende Zusätze vertretbar. „Sterbliche Gestalt“ ist eine angemessene, natürliche Wiedergabe von „mortal mold“, ohne die Bildlichkeit unzulässig zu konkretisieren.
  issues:
  - severity: low
    issue: Wiedergabe von „paid attention to me“
    rationale: „Auf mich hören“ kann im Deutschen auch „gehorchen“ nahelegen. „Mir zuhören“ gibt die im Zeugen ausgesagte Aufmerksamkeit präziser und idiomatischer wieder.
  - severity: low
    issue: Wiedergabe von „come into the inheritance“
    rationale: „Das Erbe antreten“ ist möglich, aber „in das Erbe ... eintreten“ bildet die Richtung und die ungewöhnliche Formulierung der Vorlage enger nach.
  revised_text: '„Was nun die Fülle betrifft: Ich, [ja] ich, wurde um dieses Samens willen, der verloren gegangen war, in den Leib hinabgesandt, und ich stieg in ihre sterbliche Gestalt hinab. Sie aber erkannten mich nicht, weil sie meinten, ich sei ein sterblicher Mensch. Ich sprach mit dem, der mir gehört, und er hörte mir zu, so wie auch ihr mir heute zugehört habt. Ich gab ihm Vollmacht, in das Erbe seiner Vaterschaft einzutreten, und ich nahm [ihn] [] [. . .] erfüllt [. . .] durch seine Rettung. Da er Mangel war, wurde er zur Fülle.“'
  revised_footnotes: []
  revision_rationale: Die Revision beschränkt sich auf zwei sichere stilistisch-semantische Präzisierungen. Alle textkritischen Signale der beschädigten Passage, einschließlich des isolierten „[]“, bleiben unverändert. Keine Identität des Sprechers und keine besondere Deutung von „Fülle“, „Mangel“, „Samen“ oder „Vaterschaft“ wird ergänzt.
