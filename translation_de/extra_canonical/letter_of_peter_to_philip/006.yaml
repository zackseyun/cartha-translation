translation:
  language: de
  text: '„Was jedoch eure Gefangenschaft betrifft: Sie geschieht, weil ihr zu mir gehört. Wenn ihr das Vergängliche von euch ablegt, werdet ihr zu Lichtern unter den Sterblichen.


    Was euren Kampf gegen die Mächte betrifft: Er kommt daher, dass sie – anders als ihr – keine Ruhe haben, denn sie wollen nicht, dass ihr gerettet werdet.“


    Da beteten die Apostel erneut an und sagten: „Herr, unterweise uns: Wie sollen wir gegen die Archonten[a] kämpfen, da sie uns überlegen sind?“


    Da ertönte aus der Erscheinung eine Stimme und sagte zu ihnen: „Auf folgende Weise müsst ihr gegen sie kämpfen, denn die Archonten kämpfen gegen den inneren Menschen[b]. Auf folgende Weise müsst ihr gegen sie kämpfen:


    Versammelt euch und lehrt der Welt die Rettung, verbunden mit einer Verheißung[c]. Gürtet euch mit der Kraft meines Vaters und bringt eure Bitte vor. Dann wird er, der Vater, euch beistehen, so wie er euch beistand, als er mich sandte. […] [Fürchtet] euch nicht; [ich werde allezeit bei euch sein], wie ich euch schon früher sagte, als ich im Körper wohnte.“[d]


    Da kamen Blitz und Donner vom Himmel, und der, den sie dort in der Erscheinung gesehen hatten, wurde in den Himmel entrückt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Archonten“ bedeutet wörtlich „Herrscher“ und bezeichnet hier übermenschliche Mächte.
    reason: Der fremdsprachige Fachbegriff ist für viele Leser erklärungsbedürftig, soll aber wegen seiner besonderen Bedeutung im Haupttext erhalten bleiben.
  - marker: b
    text: Der „innere Mensch“ wird im Text nicht näher bestimmt; die Formulierung kann die innere oder geistige Dimension des Menschen bezeichnen.
    reason: Die Fußnote wahrt die Mehrdeutigkeit und verhindert eine vorschnelle Gleichsetzung mit einem bestimmten anthropologischen Lehrbegriff.
  - marker: c
    text: 'Auch möglich: „lehrt die Rettung und die Verheißung in der Welt“. Der genaue syntaktische Bezug ist im zugrunde liegenden Übersetzungszeugnis unsicher.'
    reason: Die direkte Prüfung des koptischen Wortlauts steht aus, und die englische Vorlage erlaubt mehr als eine Verbindung der Satzglieder.
  - marker: d
    text: Die Auslassungszeichen und eckigen Klammern kennzeichnen eine Textlücke beziehungsweise ergänzten, nicht vollständig erhaltenen Wortlaut.
    reason: Die im Zeugnis markierten Schäden und Ergänzungen müssen transparent erhalten bleiben.
lexical_decisions:
- source_word: detention
  choice: Gefangenschaft
  rationale: Gibt die erzwungene Festhaltung natürlich und würdevoll wieder; „Haft“ wäre enger und stärker institutionell geprägt.
- source_word: what is destructible
  choice: das Vergängliche
  rationale: Bewahrt die Aussage über das der Zerstörung bzw. dem Vergehen Unterworfene, ohne es ausdrücklich mit dem Körper gleichzusetzen.
- source_word: powers
  choice: Mächte
  rationale: Entspricht der üblichen religionsgeschichtlichen Bezeichnung übermenschlicher Gewalten und bleibt gegenüber „Archonten“ unterscheidbar.
- source_word: archons
  choice: Archonten
  rationale: Der Fachbegriff bewahrt die besondere kosmologische Bedeutung; eine Fußnote erläutert ihn knapp.
- source_word: Inner Man
  choice: innerer Mensch
  rationale: Bewahrt den anthropologischen Fachausdruck und seine mögliche theologische Spannung, ohne ihn als Seele oder Geist auszudeuten.
- source_word: salvation
  choice: Rettung
  rationale: Ist modernes, allgemein verständliches Deutsch und lässt sowohl gegenwärtige Befreiung als auch endzeitliches Heil offen.
- source_word: gird yourselves
  choice: Gürtet euch
  rationale: Bewahrt das anschauliche Bild des Sich-Rüstens; die leicht gehobene Wendung passt zum würdevollen Register.
- source_word: apparition
  choice: Erscheinung
  rationale: Gibt eine sichtbare übernatürliche Manifestation neutral wieder, ohne sie als Vision oder körperliche Gegenwart festzulegen.
- source_word: snatched to heaven
  choice: in den Himmel entrückt
  rationale: Gibt die plötzliche Wegnahme idiomatisch und mit biblisch-religiösem Register wieder.
theological_decisions:
- issue: Grund der Gefangenschaft
  choice: „weil ihr zu mir gehört“
  alternative: „um meinetwillen“
  rationale: Die gewählte Fassung folgt dem vorliegenden Zeugnis eng und bewahrt die Aussage der Zugehörigkeit, statt sie in eine bloße Ursache des Leidens umzudeuten.
- issue: Ablegen des Vergänglichen
  choice: Keine ausdrückliche Gleichsetzung mit dem Körper
  alternative: „wenn ihr den vergänglichen Körper ablegt“
  rationale: Das Zeugnis nennt nur das Vergängliche; eine körperfeindliche oder rein eschatologische Deutung soll nicht in den Text eingetragen werden.
- issue: Ruhelosigkeit der Mächte
  choice: „dass sie – anders als ihr – keine Ruhe haben“
  alternative: „dass ihnen eure Ruhe fehlt“
  rationale: Die syntaktische Beziehung ist im englischen Zeugnis nicht völlig eindeutig. Die gewählte Fassung bewahrt den ausdrücklichen Gegensatz, ohne „Ruhe“ näher dogmatisch zu bestimmen.
- issue: Lehre der Rettung mit Verheißung
  choice: „die Rettung, verbunden mit einer Verheißung“
  alternative: „die Rettung und die Verheißung“
  rationale: Folgt der grammatischen Unterordnung im Zeugnis, lässt aber offen, worin die Verheißung besteht und wie genau sie zur Rettung gehört.
- issue: Beistand des Vaters
  choice: „so wie er euch beistand, als er mich sandte“
  alternative: „so wie er mir beistand, als er mich sandte“
  rationale: Das überlieferte englische Zeugnis hat „assisted you“. Die ungewöhnliche Aussage wird nicht stillschweigend zu einer theologisch glatteren Lesart geändert.
- issue: Wohnen im Körper
  choice: „als ich im Körper wohnte“
  alternative: „als ich leibhaftig bei euch war“
  rationale: Die wörtlichere Form bewahrt die im Text angelegte anthropologische Spannung und vermeidet eine harmonisierende Paraphrase.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Wiederholungen des Ausgangszeugnisses wurden bewusst bewahrt. Fachbegriffe werden nur dort beibehalten, wo ihre besondere antike Bedeutung durch eine allgemeinere Übersetzung verloren ginge. Der Entwurf ist vorläufig, da er auf dem bereitgestellten gemeinfreien englischen Zeugnis beruht; eine direkte Prüfung des koptischen Textes von Nag Hammadi Codex VIII,2 und Codex Tchacos steht noch aus.
