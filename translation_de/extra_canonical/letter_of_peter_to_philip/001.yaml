base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/001.yaml
  text: '[] The Letter of Peter, which he sent to Philip.


    Peter, an apostle of Jesus Christ, to Philip, our beloved brother and fellow apostle, and also to the brothers who are with you. Greetings.


    I want you to understand, our brother, that we received instructions from our Lord, the Savior of the whole world, to gather together so that we might teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    But you separated yourself from us and did not want to gather together to learn how we could coordinate with one another so that we might proclaim the message.


    Therefore, our brother, would it be acceptable to you to come in accordance with the instructions of our God, Jesus?


    When Philip received and read this, he went to Peter, rejoicing with delight.'
translation:
  language: de
  text: '[a] Der Brief des Petrus, den er an Philippus sandte.


    Petrus, Apostel Jesu Christi, an Philippus, unseren geliebten Bruder und Mitapostel, sowie an die Brüder bei dir. Seid gegrüßt!


    Ich möchte, dass du Folgendes verstehst, unser Bruder: Wir haben von unserem Herrn, dem Retter der ganzen Welt, die Weisung empfangen, uns zu versammeln, damit wir über die Rettung lehren und predigen, die uns von [b] unserem Herrn Jesus Christus verheißen wurde.


    Du aber hast dich von uns getrennt und wolltest dich nicht mit uns versammeln, um zu erfahren, wie wir uns abstimmen könnten, damit wir die Botschaft verkünden.


    Wäre es daher für dich annehmbar, unser Bruder, gemäß der Weisung unseres Gottes Jesus zu kommen?[c]


    Als Philippus den Brief empfangen und gelesen hatte, ging er voller Freude zu Petrus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckige Leerstelle im überlieferten Text weist hier auf eine beschädigte oder unsicher wiederhergestellte Passage hin.
    reason: Kennzeichnet die im bereitgestellten Zeugen sichtbare Textlücke am Anfang.
  - marker: b
    text: Vor „unserem Herrn Jesus Christus“ weist der Zeuge eine beschädigte oder unsicher wiederhergestellte Stelle auf.
    reason: Bewahrt die handschriftliche Unsicherheit, statt die Lücke stillschweigend zu schließen.
  - marker: c
    text: 'Wörtlich nach dem zugrunde gelegten Zeugen: „gemäß den Weisungen unseres Gottes, Jesus“. Die genaue Satzbeziehung bleibt wegen der vorläufigen Quellenlage unsicher.'
    reason: Macht die auffällige christologische Formulierung und ihre syntaktische Ambiguität transparent.
lexical_decisions:
- source_word: directives / instructions
  choice: Weisung
  rationale: „Weisung“ gibt eine verbindliche Anordnung würdig und natürlich wieder, ohne den modernen Verwaltungsbeiklang von „Direktive“.
- source_word: co-apostle
  choice: Mitapostel
  rationale: Die kompakte deutsche Bildung bewahrt die ausdrückliche Gleichordnung im apostolischen Dienst.
- source_word: salvation
  choice: Rettung
  rationale: „Rettung“ ist gegenwärtiges, allgemein verständliches Deutsch und bewahrt den konkreten Sinn von Befreiung; „Heil“ wäre ebenfalls möglich, ist aber stärker kirchensprachlich geprägt.
- source_word: coordinate ourselves
  choice: uns abstimmen
  rationale: Die Formulierung ist idiomatisch und erhält den Gedanken eines gemeinsam geordneten Vorgehens.
- source_word: message
  choice: Botschaft
  rationale: Der Zeuge bietet hier den allgemeinen Begriff „message“; „Evangelium“ würde eine im vorliegenden Wortlaut nicht ausdrücklich vorhandene Präzisierung eintragen.
- source_word: delighting with glee
  choice: voller Freude
  rationale: Die Wendung gibt die intensive Freude natürlich wieder und vermeidet die im Deutschen unpassende Doppelung „sich mit Freude freuen“.
theological_decisions:
- issue: Bezeichnung Jesu als „unser Gott“
  choice: „unseres Gottes Jesus“
  alternative: „unseres Gottes, Jesus“ oder „Gottes und Jesu“
  rationale: Die enge Zuordnung des überlieferten Zeugen wird bewahrt und nicht in zwei Bezugspersonen aufgelöst. Wegen der möglichen syntaktischen beziehungsweise textgeschichtlichen Unsicherheit weist eine Fußnote auf die wörtliche Grundlage hin.
- issue: Urheber der Verheißung
  choice: „die uns von … unserem Herrn Jesus Christus verheißen wurde“
  alternative: '„die uns … verheißen wurde: unser Herr Jesus Christus“'
  rationale: Die im englischen Zeugen erkennbare Lesart wird beibehalten, ohne die beschädigte Stelle zu ergänzen; der Ausfall wird sichtbar markiert.
- issue: Apostelbezeichnung des Petrus
  choice: „Apostel Jesu Christi“
  alternative: „ein Apostel Jesu Christi“
  rationale: Das Deutsche benötigt hier keinen unbestimmten Artikel. Die Amtsbezeichnung bleibt prädikativ und behauptet nicht, Petrus sei der einzige Apostel.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, briefartigem Ton. „Brüder“ wird beibehalten, weil der Zeuge ausdrücklich eine männliche Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung verwendet. Die Anrede wechselt nicht ins förmliche „Sie“. Da eine direkte Prüfung des koptischen Textes noch aussteht, bleibt der Entwurf ausdrücklich quellenkritisch vorläufig; Manuskriptlücken und theologisch gewichtige Mehrdeutigkeiten werden sichtbar gemacht.
