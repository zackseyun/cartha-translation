translation:
  language: de
  text: 'Der Stoff, dessen Gestalt fließend ist, ist eine Ursache der Blindheit, die durch die Mächte herrscht [. . .] in ihnen alles davon [. . .], während sie gemeinsam zeugen und [vernichtet werden]. Der Gedanke, der zwischen denen von der [Rechten und] denen von der Linken eingesetzt ist, ist eine Kraft der [Nachahmung]. Alles, was die Ersten hervorzubringen wünschen, ist gleichsam der Wurf eines Schattens, der einem Körper folgt; dies <bildet> die Wurzeln der sichtbaren Geschöpfe.[a]


    Die gesamte Vorbereitung der Ordnung der Bilder, Darstellungen und Ähnlichkeiten entstand um derer willen, die Erziehung, Unterweisung und Formung brauchen, wie sie ein Spiegel vermittelt, damit das Kleine Schritt für Schritt wachsen konnte. Aus diesem Grund erschuf er den Menschen zuletzt, nachdem er zuerst all das vorbereitet und bereitgestellt hatte, was er um seinetwillen erschaffen hatte.


    Die Erschaffung des Menschen geschah wie die aller anderen Dinge. Auf unsichtbare Weise bewegte das geistige Wort sie und vollendete sie durch den Demiurgen [] und seine engelhaften Diener, die zusammen mit der Anmaßung und ihren Archonten am Werk der Formung beteiligt waren. Die Menschen gleichen einem Schatten der Erde, sodass sie wie [jene] sein sollten, die von den Ganzheiten abgetrennt sind. Sie sind Geschöpfe, die von ihnen allen gemacht wurden, von denen der Rechten und denen der Linken; jede Ordnung verlieh dem [Menschen eine Gestalt, so wie] sie selbst durch (die Ganzheit) [gestaltet worden war].


    Die [Gestalt], die das Wort hervorbrachte, war mangelhaft, wie ein [Leiden] der Schwachheit; denn es führte sie in [Vergessenheit], Unwissenheit, [Mangel] und jede andere Schwachheit. Das Wort verlieh nämlich nur die erste Gestalt, <etwas, das es ihm> unwissentlich durch den Demiurgen gab, damit er erkennen sollte, dass etwas Erhabenes existiert und dass er [es] braucht. Dies ist es, was der Prophet „den lebendigen Geist“, „den Hauch der erhabenen Äonen“ und „das Unsichtbare“ nannte. Und dies ist die lebendige Seele, die dem anfangs leblosen Körper Leben gab; was aber ohne Leben ist, ist Unwissenheit.


    Daher ist anzunehmen, dass die Seele des ersten Menschen aus dem geistigen Wort hervorging, während der Schöpfer meinte, er selbst habe sie geschaffen. Was eingehaucht wurde, ging durch ihn hindurch wie durch einen Mund.


    Aus seiner eigenen Substanz sandte der Schöpfer ebenfalls Seelen hinab, denn auch [er] besitzt die Kraft der Fortpflanzung, [] da er <aus> der Darstellung des Vaters hervorgebracht wurde. Auch die von der Linken brachten eine bestimmte Art Mensch aus sich selbst hervor, denn auch sie besitzen die Ähnlichkeit des <Seins>.


    Die geistige Substanz ist etwas Einheitliches und eine einzige Darstellung, [doch] ihre Schwachheit ist ein Zustand [vieler] Gestalten. Der Zustand der Substanz der seelischen Wesen ist zwiespältig: Sie besitzt Erkenntnis und preist den Erhabenen, ist aber wegen der Neigung der Anmaßung <auch> zum Bösen geneigt. Die Substanz der stofflichen Wesen wiederum weist eine andere Beschaffenheit auf, sogar in mehreren Gestalten; es war eine Schwachheit, die sich in mehreren Arten der Neigung durchsetzte.[b]


    So ist der erste Mensch eine vielfältige Formung, eine vielfältige Schöpfung und ein Aufbewahrungsort für die von der Linken und die von der Rechten. Er ist auch ein geistiges Wort, dessen Bestrebungen zwischen den beiden Substanzen geteilt sind, von denen sein Dasein herkommt.


    Darum heißt es, dass für ihn ein Paradies gepflanzt wurde, damit er die Speise dreier Arten von Bäumen essen konnte; denn es ist ein Garten dreier Ordnungen und spendet Freude. Die edle und erwählte Substanz in ihm war höher als <die> Schöpfung, und sie <war> ihnen ein Schaden. Deshalb erließen sie ein Gebot und drohten, eine große Gefahr werde ihn treffen, [] nämlich der Tod. Nur von den schlechten Bäumen durfte er kosten und genießen. Von dem anderen Baum aber, dem der Zweiheit, erlaubte er [ihm] nicht zu essen, und noch viel weniger vom Baum des Lebens: damit er keine Ehre [gleich der ihren] erlange und damit [er . . .] sie.


    Durch die böse Macht, die „die Schlange“ genannt wird und die sogar klüger ist als alle bösen Mächte, <wurde> der Mensch nach dem Plan derer, die zur Erinnerung und zu den Begierden gehören, irregeführt. Sie brachte ihn dazu, dem Gebot nicht zu gehorchen, damit er sterben sollte. Und von jenem Ort wurde er vertrieben, fort von all seinen Freuden.


    Dies ist die Vertreibung, mit der sie ihn bestraften, als er aus den Freuden derer vertrieben wurde, die zur Ähnlichkeit und zur Darstellung gehören. In Wirklichkeit war dies ein Akt der Vorsehung, damit die Menschen erkennen sollten, dass Genüsse nur kurze Zeit dauern – im Gegensatz zum ewigen Ort der Ruhe. Der Geist hatte diesen Vorgang angeordnet, als er im Voraus plante, dass der Mensch das große Übel erfahren sollte, nämlich den Tod, der völlige Unwissenheit über die Ganzheit ist. Ebenso sollte er alle daraus hervorgehenden Übel kosten und nach den Leidenschaften, Ängsten und deren Folgen das größte [] Gut erlangen: das ewige Leben, das in der vollständigen Erkenntnis der Ganzheiten und im Erlangen alles Guten besteht.


    Wegen des Ungehorsams des ersten Menschen herrschte der Tod. Er pflegte jeden Menschen zu töten, solange er [Herrschaft] besaß und sich durchsetzte. Diese Herrschaft hatte er durch den zuvor erwähnten Heilsplan nach dem Willen des Vaters [als] Königreich empfangen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Überlieferung ist in diesem Absatz mehrfach beschädigt. Auch der Satz über „die Ersten“ ist grammatisch und inhaltlich unsicher; die Übersetzung folgt hier dem vorliegenden englischen Zeugen.
    reason: Kennzeichnet erhebliche Textlücken und eine unsichere Satzkonstruktion, ohne sie stillschweigend zu glätten.
  - marker: b
    text: „Geistig“, „seelisch“ und „stofflich“ bezeichnen hier drei kosmologisch-anthropologische Kategorien. Die genaue Terminologie muss noch unmittelbar am koptischen Text geprüft werden.
    reason: Verhindert eine rein moderne psychologische Lesart und macht die ausstehende Quellenprüfung transparent.
  - marker: c
    text: Eckige Klammern, leere Klammern, Auslassungspunkte in Klammern und spitze Klammern geben die textkritischen beziehungsweise editorischen Zeichen des zugrunde gelegten englischen Zeugnisses wieder. Eine unmittelbare Prüfung am koptischen Text steht noch aus.
    reason: Dokumentiert die vorläufige Grundlage und bewahrt die sichtbaren Überlieferungs- und Ergänzungssignale.
lexical_decisions:
- source_word: Matter
  choice: Stoff
  rationale: „Stoff“ ist im Deutschen natürlicher als „Materie“, bewahrt aber den kosmologischen Sinn.
- source_word: spiritual Word
  choice: geistiges Wort
  rationale: Bewahrt die wörtliche und möglicherweise personhafte Bedeutung von „Word“, ohne diese vorschnell mit einem bestimmten Logosverständnis gleichzusetzen.
- source_word: Demiurge
  choice: Demiurg
  rationale: Etablierte religionsgeschichtliche Bezeichnung; vermeidet eine vereinfachende Gleichsetzung mit „Schöpfer“, da beide Benennungen im Text nebeneinander stehen.
- source_word: presumption
  choice: Anmaßung
  rationale: Gibt die negative Haltung einer überheblichen Selbstüberschätzung wieder und lässt ihre mögliche Personifikation offen.
- source_word: archons
  choice: Archonten
  rationale: Der eingebürgerte Fachbegriff wahrt die besondere kosmologische Funktion der Herrschermächte.
- source_word: Totality / Totalities
  choice: Ganzheit / Ganzheiten
  rationale: Die Numerusunterscheidung des Zeugnisses wird erhalten; „All“ wäre flüssiger, würde aber die auffällige Singular-Plural-Spannung verwischen.
- source_word: soulish ones
  choice: seelische Wesen
  rationale: Verständliches Deutsch, das die substantivische Klassenbezeichnung erhält, ohne einen modernen psychologischen Sinn aufzudrängen.
- source_word: material ones
  choice: stoffliche Wesen
  rationale: Parallele Form zu „seelische Wesen“ und „geistige Substanz“; bezeichnet eine ontologische Kategorie.
- source_word: representation
  choice: Darstellung
  rationale: Unterscheidet den Ausdruck von „Bild“ und „Ähnlichkeit“, obwohl die genaue koptische Terminologie noch zu prüfen ist.
- source_word: duality
  choice: Zweiheit
  rationale: Bewahrt den ontologisch-kosmologischen Sinn; „Dualismus“ wäre stärker systematisierend.
theological_decisions:
- issue: Ursprung der Seele des ersten Menschen
  choice: Die Seele geht aus dem geistigen Wort hervor, während der Schöpfer nur meint, sie geschaffen zu haben.
  alternative: Der Schöpfer erschafft die Seele eigenständig.
  rationale: Die im Zeugnis ausdrücklich gesetzte Spannung zwischen geistigem Wort und Schöpfer wird nicht harmonisiert.
- issue: Vertreibung aus dem Paradies
  choice: Sie bleibt zugleich Strafe durch die Mächte und Akt der Vorsehung.
  alternative: Die Vertreibung ausschließlich als Strafe oder ausschließlich als Heilshandeln erklären.
  rationale: Der Text hält beide Deutungen nebeneinander und deutet die leidvolle Erfahrung innerhalb eines Heilsplans.
- issue: Tod
  choice: Tod wird sowohl als herrschende, tötende Macht als auch als völlige Unwissenheit über die Ganzheit wiedergegeben.
  alternative: Tod nur körperlich oder nur metaphorisch verstehen.
  rationale: Die unterschiedlichen Aussageebenen des Zeugnisses bleiben bestehen.
- issue: Dreifache anthropologische Substanz
  choice: Geistige, seelische und stoffliche Kategorien werden terminologisch unterschieden.
  alternative: Die Kategorien in moralisch „gute“, „neutrale“ und „böse“ Menschen auflösen.
  rationale: Eine solche moralische Vereinfachung würde die kosmologische Anthropologie des Textes konfessionell oder systematisch überformen.
- issue: Identität des „Propheten“
  choice: Die Bezeichnung bleibt unbestimmt.
  alternative: Eine bestimmte biblische oder außerbiblische Gestalt benennen.
  rationale: Das vorliegende Zeugnis identifiziert den Propheten an dieser Stelle nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachbegriffen. Der Entwurf beruht vorläufig auf dem bereitgestellten gemeinfreien englischen Übersetzungszeugen; eine direkte Prüfung des koptischen Textes von Nag Hammadi Codex I,5 steht aus. Beschädigungen und editorische Ergänzungen wurden nicht verdeckt.
