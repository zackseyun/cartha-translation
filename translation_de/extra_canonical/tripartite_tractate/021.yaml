  revised_text: 'Der Stoff, dessen Gestalt fließend (ist), ist eine Ursache der Blindheit, die durch die Mächte herrscht [. . .] in ihnen alles davon [. . .], während sie gemeinsam zeugen und [vernichtet werden]. Der Gedanke, der zwischen denen von der [Rechten und] denen von der Linken eingesetzt ist, ist eine Kraft der [Nachahmung]. Alle, die die Ersten hervorzubringen wünschen, sind gleichsam die Projektion eines Schattens, der einem Körper folgt; dies <bildet> die Wurzeln der sichtbaren Geschöpfe.[a]



    Die gesamte Vorbereitung der Ordnung der Bilder, Darstellungen und Ähnlichkeiten entstand wegen derer, die Erziehung, Unterweisung und eine durch einen Spiegel vermittelte Formung brauchen, damit das Kleine Schritt für Schritt wachsen konnte. Der Grund dafür war, dass er den Menschen zuletzt erschuf, nachdem er zuvor all das vorbereitet und bereitgestellt hatte, was er um seinetwillen erschaffen hatte.



    Die Erschaffung des Menschen geschah wie die aller anderen Dinge. Auf unsichtbare Weise bewegte das geistige Wort sie und vollendete sie durch den Demiurgen [] und seine engelhaften Diener, die zusammen mit der Anmaßung und ihren Archonten am Werk der Formung beteiligt waren. Die Menschen gleichen einem Schatten der Erde, sodass sie wie [jene] sein sollten, die von den Ganzheiten abgetrennt sind. Sie sind Geschöpfe, die von ihnen allen gemacht wurden, von denen der Rechten und denen der Linken; wobei jede der Ordnungen dem [Menschen eine Gestalt verlieh, so wie] die (Ganzheit) selbst (gestaltet worden war).



    Die [Gestalt], die das Wort hervorbrachte, war mangelhaft, wie ein [Leiden] der Schwachheit; denn es führte sie in [Vergessenheit], Unwissenheit, [Mangel] und jede andere Schwachheit. Das Wort verlieh nämlich nur die erste Gestalt, <etwas, das es ihm> unwissentlich durch den Demiurgen gab, damit er erkennen sollte, dass etwas Erhabenes existiert und dass er [es] braucht. Dies ist es, was der Prophet „den lebendigen Geist“, „den Hauch der erhabenen Äonen“ und „das Unsichtbare“ nannte. Und dies ist die lebendige Seele, die dem anfangs leblosen Körper Leben gab; was aber ohne Leben ist, ist Unwissenheit.



    Daher ist anzunehmen, dass die Seele des ersten Menschen aus dem geistigen Wort hervorging, während der Schöpfer meinte, er selbst habe sie geschaffen. Was eingehaucht wurde, ging durch ihn hindurch wie durch einen Mund.



    Aus seiner eigenen Substanz sandte der Schöpfer ebenfalls Seelen hinab, denn auch [er] besitzt die Kraft der Fortpflanzung, [] da er <aus> der Darstellung des Vaters hervorgebracht wurde. Auch die von der Linken brachten eine bestimmte Art Mensch aus sich selbst hervor, denn auch sie besitzen die Ähnlichkeit des <Seins>.



    Die geistige Substanz ist etwas Einheitliches und eine einzige Darstellung, [und] ihre Schwachheit ist ein Zustand [vieler] Gestalten. Der Zustand der Substanz der seelischen Wesen ist zwiespältig: Sie besitzt Erkenntnis und preist den Erhabenen, ist aber wegen der Neigung der Anmaßung <auch> zum Bösen geneigt. Die Substanz der stofflichen Wesen wiederum weist eine andere Beschaffenheit auf, auch in mehreren Gestalten; es war eine Schwachheit, die sich in mehreren Arten der Neigung durchsetzte.[b]



    So ist der erste Mensch eine vielfältige Formung, eine vielfältige Schöpfung und ein Aufbewahrungsort für die von der Linken und die von der Rechten. Er ist auch ein geistiges Wort, dessen Anliegen zwischen den beiden Substanzen geteilt sind, von denen sein Dasein herkommt.



    Darum heißt es, dass für ihn ein Paradies gepflanzt wurde, damit er die Nahrung von drei Arten von Bäumen essen konnte; denn es ist ein Garten dreier Ordnungen und spendet Freude. Die edle und erwählte Substanz in ihm war höher als <die> Schöpfung, und sie <war> ihnen ein Schaden. Deshalb erließen sie ein Gebot und drohten, eine große Gefahr werde ihn treffen, [] nämlich der Tod. Nur von den schlechten Bäumen durfte er kosten und genießen. Von dem anderen Baum aber, dem der Zweiheit, erlaubte er [ihm] nicht zu essen, und noch viel weniger vom Baum des Lebens: damit er keine Ehre [gleich der ihren] erlange und damit [er . . .] sie.



    Durch die böse Macht, die „die Schlange“ genannt wird und die sogar klüger ist als alle bösen Mächte, <wurde> der Mensch nach dem Plan derer, die zur Erinnerung und zu den Begierden gehören, irregeführt. Sie brachte ihn dazu, dem Gebot nicht zu gehorchen, damit er sterben sollte. Und von jenem Ort wurde er vertrieben, fort von all seinen Freuden.



    Dies ist die Vertreibung, mit der sie ihn bestraften, als er aus den Freuden derer vertrieben wurde, die zur Ähnlichkeit und zur Darstellung gehören. In Wirklichkeit war dies ein Akt der Vorsehung, damit die Menschen erkennen sollten, dass Genüsse nur kurze Zeit dauern – im Gegensatz zum ewigen Ort der Ruhe. Der Geist hatte diesen Vorgang angeordnet, als er im Voraus plante, dass der Mensch das große Übel erfahren sollte, nämlich den Tod, der völlige Unwissenheit über die Ganzheit ist. Ebenso sollte er alle daraus hervorgehenden Übel kosten und nach den Leidenschaften, Ängsten und deren Folgen das größte [] Gut erlangen: das ewige Leben, das in der vollständigen Erkenntnis der Ganzheiten und im Erlangen alles Guten besteht.



    Wegen des Ungehorsams des ersten Menschen herrschte der Tod. Er pflegte jeden Menschen zu töten, solange er [Herrschaft] besaß und sich durchsetzte. Diese Herrschaft, die er durch den zuvor erwähnten Heilsplan nach dem Willen des Vaters [als] Königsherrschaft empfangen hatte, dauerte an.[c]'
