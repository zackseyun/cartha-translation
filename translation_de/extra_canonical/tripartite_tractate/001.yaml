  text: '[] When discussing exalted matters, it is fitting to begin with the Father, the root of the Totality, from whom we have received the gift of speaking about him. Before anything besides him came into being, he existed.


    Like a number, the Father is one, because he comes first and is alone in himself. Yet he does not resemble someone who is merely one. If he did, how could he be a father? For whenever a father exists, the name “son” follows. The one who is the Father alone resembles the root of a tree with branches and fruit. Strictly speaking, he is called a father because he is incomparable and unchanging. This is why, strictly speaking, he is one and is a god, since no one stands in relation to him as a god, because no one is his father. For he is unbegotten: no one else begot him, and no one else created him. Anyone who is someone else’s father or creator also has a father and a creator. Certainly, he can be the father and creator of someone who came into being from him and whom he created. But, strictly speaking, he is not a father and is not a god, because there was [] someone who [begot and] created him. Therefore, strictly speaking, only he is Father and God who has had no one beget him. As for
    the Totalities, he is the one who begot and created them.


    He has no beginning and no end, but it is not merely that he has no end. Because he is unbegotten, he is deathless. Yet he is also unchanging in his eternal being, in his self-identity, in what established him, and in what makes him great. He will never be separated from what makes him exist, and no one will compel him to bring forth any intention he has never willed. No one originated the Father’s existence, and so he is unchanging. No one can separate him from his own being and self-identity, in which he exists, or from his greatness, which is why no one can comprehend him. It is impossible for anyone to change his form into something different, to lower him, to change him, or to diminish him. This is <how>, in the fullness of truth, he is the unchangeable and invariable one, with immutability as his garments. It is not merely that he is called “Beginningless” and “Endless”; he was not born, nor will he die. Thus, just as he is without beginning and without end in the way he exists,
    so [] in his greatness he cannot be reached. He is incomprehensible in his wisdom, unfathomable in his power, and unknowable in his sweetness.


    Strictly speaking, only he who is good—the unbegotten Father and the wholly perfect one—is full of his offspring, of every virtue, and of everything valuable. He possesses still more, including the absence of all spite, so that one may find that all who possess anything owe it to him, because he bestows it. Yet he is unattainable and tireless in his giving, rich in the gifts he gives and at rest in the favors he lavishes.


    His category, form, and great scale are such that none have been with him from the beginning. There is no place where he dwells, from which he proceeds, or into which he enters. There is no primal form that he uses as a pattern when he works. No difficulty accompanies him in anything he does, nor is any matter available for him to use in creating what <he> creates. There is no substance inhering in him that he uses to beget whatever he begets, nor is there any coworker accompanying him in his work. To claim anything like this is ignorance. Instead, one should declare that he is good, without defect, perfect, [] entire, since he is the Totality.


    None of the names that are thought or spoken, seen or understood, apply to him, no matter how immensely majestic, glorifying, and reverential they may be. Such names may, however, be spoken for his glory and honor, according to the ability of those who glorify him. As for what inheres in his existence, being, and form, the mind cannot conceive of him, words cannot express him, eyes cannot behold him, and no one can comprehend him. This is because of his unsearchable greatness, his ungraspable depth, his limitless height, and his unlimited <extension>.


    This is the character of what is unbegotten: it does not extend or join itself to anything as something limited does. Instead, he has a character without possessing a face or form, things that can be comprehended through perception. This is why he is incomprehensible.'
translation:
  language: de
  text: '[] Wenn von erhabenen Dingen die Rede ist, ist es angemessen, mit dem Vater zu beginnen, der Wurzel der Gesamtheit, von dem wir die Gabe empfangen haben, über ihn zu sprechen. Bevor irgendetwas außer ihm ins Dasein kam, war er da.


    Wie eine Zahl ist der Vater einer, weil er der Erste und für sich allein ist. Doch er gleicht nicht jemandem, der bloß einer ist. Denn wenn es so wäre, wie könnte er ein Vater sein? Wo immer nämlich ein Vater ist, folgt auch die Bezeichnung „Sohn“. Der Eine jedoch, der allein der Vater ist, gleicht der Wurzel eines Baumes mit Zweigen und Frucht. Im eigentlichen Sinn wird von ihm gesagt, dass er Vater ist, weil er unvergleichlich und unveränderlich ist. Darum ist er im eigentlichen Sinn einer und ein Gott, da niemand zu ihm als Gott in Beziehung steht, weil niemand sein Vater ist. Denn er ist ungezeugt: Kein anderer hat ihn gezeugt, und kein anderer hat ihn erschaffen. Denn jeder, der Vater oder Schöpfer eines anderen ist, hat auch selbst einen Vater und einen Schöpfer. Gewiss kann er Vater und Schöpfer dessen sein, der aus ihm ins Dasein kam und den er erschuf. Doch dieser ist im eigentlichen Sinn nicht Vater und nicht Gott, weil es [] jemanden gab, der ihn [zeugte und] erschuf. Daher
    ist im eigentlichen Sinn nur derjenige Vater und Gott, den niemand gezeugt hat. Was die Gesamtheiten[a] betrifft, so ist er es, der sie gezeugt und erschaffen hat.


    Er hat keinen Anfang und kein Ende; doch es ist nicht nur so, dass er kein Ende hat. Weil er ungezeugt ist, ist er unsterblich. Zugleich ist er unveränderlich in seinem ewigen Sein, in seiner Selbigkeit, in dem, was ihn bestehen lässt, und in dem, was ihn groß macht. Niemals wird er von dem getrennt werden, was ihn sein lässt, und niemand wird ihn zwingen, einen Vorsatz hervorzubringen, den er niemals gewollt hat. Niemand hat das Dasein des Vaters begründet; deshalb ist er unveränderlich. Niemand kann ihn von seinem eigenen Sein und seiner Selbigkeit trennen, worin er besteht, noch von seiner Größe, weshalb niemand ihn erfassen kann. Es ist unmöglich, dass jemand seine Gestalt in etwas anderes verwandelt, ihn erniedrigt, verändert oder mindert. So ist er in der Fülle der Wahrheit der Unveränderliche, der sich nicht wandelt und Unwandelbarkeit als Gewand trägt. Er wird nicht bloß „Anfangloser“ und „Endloser“ genannt; vielmehr wurde er weder geboren, noch wird er sterben. Wie er also in
    der Weise seines Bestehens ohne Anfang und ohne Ende ist, so ist er [] auch in seiner Größe unerreichbar: unbegreiflich in seiner Weisheit, unergründlich in seiner Macht und unerkennbar in seiner Güte[b].


    Im eigentlichen Sinn ist allein er, der Gute, der ungezeugte Vater und der vollkommen Vollendete, erfüllt von seinen Nachkommen, von allen Tugenden und von allem Wertvollen. Und er besitzt noch mehr, sogar das völlige Fehlen jeder Missgunst. So lässt sich erkennen, dass alle, die etwas besitzen, es ihm verdanken, weil er es schenkt. Dabei bleibt er unerreichbar und wird des Gebens nicht müde; er ist reich an den Gaben, die er gibt, und ruht in den Wohltaten, die er in Fülle gewährt.


    Seine Art, seine Gestalt und seine gewaltige Größe sind so beschaffen, dass von Anfang an niemand bei ihm gewesen ist. Es gibt keinen Ort, an dem er wohnt, von dem er ausgeht oder in den er eintritt. Es gibt auch keine ursprüngliche Gestalt, die ihm bei seinem Wirken als Vorbild dient. Bei allem, was er tut, begegnet ihm keine Schwierigkeit, und es steht ihm kein Stoff zur Verfügung, aus dem er erschaffen könnte, was <er> erschafft. Auch wohnt ihm keine Substanz inne, deren er sich bedient, um zu zeugen, was immer er zeugt; ebenso wenig begleitet ihn ein Mitarbeiter bei seinem Werk. Derartiges zu behaupten ist Unwissenheit. Stattdessen soll man sagen: Er ist gut, ohne Mangel, vollkommen, [] ganz, denn er ist die Gesamtheit.


    Keiner der Namen, die gedacht oder ausgesprochen, gesehen oder verstanden werden, trifft auf ihn zu, mögen sie noch so überaus erhaben, verherrlichend und ehrfurchtsvoll sein. Solche Namen kann man jedoch zu seiner Verherrlichung und Ehre aussprechen, entsprechend dem Vermögen derer, die ihn verherrlichen. Was aber seinem Dasein, seinem Sein und seiner Gestalt innewohnt, kann der Verstand nicht erfassen; Worte können es nicht ausdrücken, Augen können es nicht schauen, und niemand kann ihn begreifen. Der Grund dafür sind seine unerforschliche Größe, seine unfassbare Tiefe, seine grenzenlose Höhe und seine unbegrenzte <Ausdehnung>[c].


    Dies ist die Eigenart des Ungezeugten: Es erstreckt sich nicht zu etwas hin und verbindet sich mit nichts, wie es etwas Begrenztes tut. Vielmehr besitzt er eine Eigenart, ohne ein Antlitz oder eine Gestalt zu besitzen – Dinge, die durch Wahrnehmung erfasst werden können. Darum ist er unbegreiflich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gesamtheiten“ gibt den Plural des Zeugen wieder. Gemeint sein können alle aus dem Vater hervorgegangenen Wirklichkeiten; der ungewöhnliche Plural bleibt bewusst erhalten.
    reason: Der kosmologische Fachgebrauch ist im Deutschen nicht selbsterklärend und soll nicht stillschweigend vereindeutigt werden.
  - marker: b
    text: Wörtlicher könnte hier „Süße“ stehen. Gemeint ist offenbar eine wohltuende oder anziehende Wesensqualität; die genaue Nuance bleibt unsicher.
    reason: Die idiomatische Übersetzung „Güte“ verbessert die Verständlichkeit, während die Fußnote die lexikalische Unsicherheit offenlegt.
  - marker: c
    text: „Ausdehnung“ ist im zugrunde liegenden Zeugen als ergänzter Text gekennzeichnet; deshalb stehen die spitzen Klammern auch in der Übersetzung.
    reason: Die textkritische Unsicherheit der Vorlage muss sichtbar bleiben.
lexical_decisions:
- source_word: Father
  choice: Vater
  rationale: Bewahrt die zentrale Verwandtschaftsmetapher und den argumentativen Zusammenhang mit „Sohn“, „zeugen“ und „ungezeugt“.
- source_word: Totality / Totalities
  choice: Gesamtheit / Gesamtheiten
  rationale: Gibt den kosmologischen Sammelbegriff möglichst formal wieder, ohne ihn vorschnell als „Schöpfung“ oder „All“ auszudeuten.
- source_word: unbegotten
  choice: ungezeugt
  rationale: Erhält die begriffliche Verbindung zum Zeugen und unterscheidet den Ausdruck von „unerschaffen“.
- source_word: single / one
  choice: einer / der Eine
  rationale: Bewahrt das Zahlenspiel und zugleich die personale Aussage; „bloß einer“ markiert die im Text selbst vorgenommene Einschränkung.
- source_word: self-identity
  choice: Selbigkeit
  rationale: Ein philosophisch präziser, im Deutschen verständlicher Ausdruck für unveränderte Identität mit sich selbst.
- source_word: sweetness
  choice: Güte
  rationale: Im gegebenen Kontext bezeichnet der Ausdruck eine positive, anziehende Wesensqualität; die wörtliche Wiedergabe „Süße“ wäre im modernen Deutschen leicht körperlich oder sentimental missverständlich. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: extension
  choice: Ausdehnung
  rationale: Folgt der markierten Ergänzung des Zeugen und wahrt die räumliche Metaphorik.
theological_decisions:
- issue: „a god“ gegenüber „God“
  choice: „ein Gott“ in der ersten Aussage, später „Vater und Gott“
  alternative: Durchgehend „Gott“
  rationale: Die grammatische und argumentative Spannung des Zeugen wird nicht harmonisiert. Der Text wechselt selbst zwischen einer qualitativen beziehungsweise relationalen Formulierung und dem titelartigen „Vater und Gott“.
- issue: Vaterschaft und absolute Einzigkeit
  choice: Die scheinbare Spannung bleibt ausdrücklich stehen
  alternative: Die Passage so glätten, dass der Vater nur durch seine Nachkommen Vater heißt
  rationale: 'Der Text argumentiert bewusst paradox: Der Vater ist allein und zugleich als Vater auf „Sohn“ bezogen. Eine Auflösung würde die theologische Spannung beseitigen.'
- issue: Zeugen und Erschaffen
  choice: Beide Verben werden konsequent unterschieden
  alternative: Beides mit „hervorbringen“ wiedergeben
  rationale: Der Zeuge verwendet beide Kategorien nebeneinander; ihre mögliche kosmologische Bedeutung darf nicht eingeebnet werden.
- issue: Apophatische Namenslehre
  choice: Namen treffen nicht auf ihn zu, können aber zu Ehre und Verherrlichung ausgesprochen werden
  alternative: Namen seien lediglich unvollständig
  rationale: Die stärkere negative Aussage und ihre unmittelbar folgende liturgische Einschränkung werden beide bewahrt.
- issue: Wechsel zwischen unpersönlichem und persönlichem Bezug auf das Ungezeugte
  choice: „Es“ im allgemeinen Grundsatz, danach „er“ beim Bezug auf den Vater
  alternative: Durchgehend „er“ oder durchgehend „es“
  rationale: So bleibt der Wechsel zwischen abstrakter Wesensaussage und personaler Rede sichtbar.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, philosophisch-theologischem Register. Lange Gedankengänge wurden behutsam gegliedert, ohne die argumentative Wiederholung und paradoxe Struktur zu beseitigen. Eckige Klammern kennzeichnen Lücken beziehungsweise beschädigten Text des Zeugen; spitze Klammern kennzeichnen editorische Ergänzungen. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich quellenzeugengebunden und vorläufig.
