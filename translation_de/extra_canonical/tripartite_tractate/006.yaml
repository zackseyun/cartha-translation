base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/006.yaml
  text: '<...> Just as the wondrous acts of the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they belong to speech, [] both [the wondrous acts] and the qualities are seeds and thoughts of his offspring, living and eternal roots that appear as self-originating offspring. They exist as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, they do not need sound or speech, nor do they need to perform [an act] to obtain what they wish to [have done]. Instead, following the pattern of [the Father’s] own existence, [those] who originate from him beget whatever they wish. And he has child<ren>: the one of whom they think and speak, toward whom they move, in whom they subsist, and to whom they sing hymns to glorify him. For this is their power of procreation, resembling those from whom they originated and consistent with their shared assistance, since they help one another as those who are unbegotten do.


    The Father, in keeping with his exalted place above the Totalities, is unknown and ungraspable. He possesses such greatness and magnitude that, if it were revealed suddenly and immediately, it would destroy all the lofty beings among the aeons who originated from him. Therefore, he restrained his strength and his infinite resources, which constitute his [] being, [remaining] unspeakable and unnameable, exalted above every mind and all speech.


    Yet this is the one who stretched himself out, and what he stretched out formed a foundation, a place, and a dwelling for the universe. One of his names is the One by Whom, because he is the Father of All. Through his labor on behalf of the existing ones, he sowed within them the thought of searching for him. The wealth of their [. . .] is that they grasp that he exists and inquire into what was existent.'
translation:
  language: de
  text: '<…> Wie die Wundertaten der Schweigen ewige Zeugungen und geistige Nachkommen sind, so sind die Eigenschaften des Wortes geistige Ausströmungen. Weil sie zur Rede gehören, sind […] sowohl [die Wundertaten] als auch die Eigenschaften Samen und Gedanken seiner Nachkommen sowie lebendige, ewige Wurzeln, die als aus sich selbst hervorgegangene Nachkommen erscheinen. Sie bestehen als geistige Wesen und geistige Nachkommen zur Verherrlichung des Vaters.


    Da sie Geister und geistige Wesen sind, brauchen sie weder Laut noch Rede; ebenso wenig müssen sie [etwas tun], um zu erlangen, was sie [verwirklicht haben wollen]. Vielmehr bringen [diejenigen], die aus ihm hervorgehen, nach dem Vorbild der eigenen Seinsweise [des Vaters] hervor, was immer sie wollen. Und er hat ein Kind<er>[a]: den, an den sie denken und von dem sie sprechen, zu dem sie sich hinbewegen, in dem sie Bestand haben und dem sie Loblieder singen, um ihn zu verherrlichen. Denn darin besteht ihre Zeugungskraft: Sie gleichen denen, aus denen sie hervorgegangen sind, und entsprechen ihrer gegenseitigen Hilfe, da sie einander helfen, wie es die Ungezeugten tun.


    Der Vater ist, entsprechend seiner erhabenen Stellung über den Gesamtheiten[b], unbekannt und unfassbar. Er besitzt eine solche Größe und Weite, dass ihre plötzliche, unmittelbare Offenbarung alle erhabenen Wesen unter den Äonen, die aus ihm hervorgegangen sind, vernichten würde. Deshalb hielt er seine Kraft und seine unendlichen Reichtümer zurück, die sein […] Wesen ausmachen, und [blieb] unaussprechlich und unnennbar, erhaben über jedes Denken und jede Rede.


    Und doch ist er es, der sich ausbreitete; und das, was er ausbreitete, bildete einen Grund, einen Ort und eine Wohnstätte für das All. Einer seiner Namen lautet »Der, durch den alles ist«[c], denn er ist der Vater von allem. Durch sein Wirken für die Seienden säte er in sie den Gedanken, nach ihm zu suchen. Der Reichtum ihres […] besteht darin, dass sie erfassen, dass er existiert, und danach fragen, was da war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Form „Kind<er>“ gibt die editorisch angezeigte Unsicherheit zwischen Einzahl und Mehrzahl wieder.
    reason: Bewahrung eines textkritischen Signals des vorliegenden Zeugnisses.
  - marker: b
    text: „Gesamtheiten“ ist hier ein kosmologischer Fachausdruck und steht im vorliegenden Zeugnis in der Mehrzahl.
    reason: Die ungewöhnliche Form soll nicht mit dem später im Abschnitt genannten „All“ gleichgesetzt oder stillschweigend normalisiert werden.
  - marker: c
    text: Wörtlich bietet das englische Zeugnis den elliptischen Namen „Der, durch den“; „alles ist“ wurde zum Verständnis ergänzt.
    reason: Die deutsche Namensform braucht eine syntaktische Ergänzung, deren interpretierender Anteil offengelegt werden soll.
lexical_decisions:
- source_word: acts of wonder by the silences
  choice: Wundertaten der Schweigen
  rationale: Die ungewöhnliche, vermutlich hypostasierende Mehrzahl wird bewahrt; eine Glättung zu „des Schweigens“ würde die mögliche Mehrzahl und Eigenständigkeit der „Schweigen“ beseitigen.
- source_word: intellectual offspring / minds
  choice: geistige Nachkommen / geistige Wesen
  rationale: „Geistig“ ist im Deutschen verständlicher als „intellektuell“ und bezeichnet hier noetische Wirklichkeit; bei „minds“ vermeidet „geistige Wesen“ die missverständliche Wiedergabe „Verstände“.
- source_word: emanations
  choice: Ausströmungen
  rationale: Der bildhafte Hervorgangsbegriff bleibt erhalten, ohne ihn durch einen konfessionell oder systematisch stärker festgelegten Fachausdruck zu ersetzen.
- source_word: subsist
  choice: Bestand haben
  rationale: Bewahrt den ontologischen Sinn und klingt zugleich natürlicher als „subsistieren“.
- source_word: Totalities
  choice: Gesamtheiten
  rationale: Die markierte Mehrzahl des kosmologischen Ausdrucks bleibt erhalten und wird nicht vereinfachend zu „All“ singularisiert.
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte Fachbegriff für die überweltlichen Wesen beziehungsweise Bereiche dieser Schrift wird beibehalten.
- source_word: the One by Whom
  choice: Der, durch den alles ist
  rationale: Die elliptische Namensform wird im Deutschen verständlich gemacht; „alles ist“ ist als sinngemäße Ergänzung kenntlich zu erläutern.
- source_word: what was existent
  choice: was da war
  rationale: Bewahrt die zeitlich-ontologische Offenheit des Ausdrucks, statt ihn eindeutig als ein bestimmtes Urwesen auszulegen.
theological_decisions:
- issue: Selbsthervorgang der Nachkommen
  choice: „aus sich selbst hervorgegangene Nachkommen“
  alternative: „selbsterzeugte Nachkommen“
  rationale: Die gewählte Form bewahrt den paradoxen Selbstursprungsanspruch, ohne zwingend biologische Zeugung oder absolute Ursachlosigkeit zu behaupten.
- issue: Singular oder Plural bei child<ren>
  choice: Die editorische Form „Kind<er>“ wird bewahrt.
  alternative: Eindeutige Festlegung auf „Kind“ oder „Kinder“
  rationale: Der überlieferte beziehungsweise editorisch angezeigte Unsicherheitsbereich darf nicht theologisch harmonisiert werden.
- issue: Die „Ungezeugten“
  choice: Substantivierte Mehrzahl „die Ungezeugten“
  alternative: „diejenigen, die nicht gezeugt wurden“ oder singularisch „der Ungezeugte“
  rationale: Die Mehrzahl und der technische Charakter der Aussage bleiben erhalten, ohne sie mit dem Vater allein gleichzusetzen.
- issue: Zurückhalten göttlicher Kraft
  choice: Der Vater „hielt“ Kraft und Reichtümer „zurück“.
  alternative: Er „begrenzte“ sich selbst.
  rationale: Die Aussage des Zeugnisses wird wiedergegeben, ohne daraus ausdrücklich eine Lehre göttlicher Selbstbegrenzung abzuleiten.
translation_notes:
  register: Moderne, würdige Standardsprache mit behutsam beibehaltenen kosmologischen Fachbegriffen. Eckige Klammern und Auslassungszeichen im Haupttext bewahren Beschädigungen oder editorische Ergänzungen des zugrunde gelegten öffentlichen englischen Zeugnisses. Da eine direkte Prüfung des koptischen Textes noch aussteht, bleibt die Fassung ausdrücklich vorläufig und vermeidet Entscheidungen, die nur anhand des Koptischen sicher getroffen werden könnten.
