source:
  text: 'This is the complete nature of the begetting, caused by what [Christ] bore when he shone on them [with] a [light] he revealed [. . .] like his [. . .] which will be [. . .] like his [. . .] while the sole variation [that] exists in those who were


    (5 lines missing)


    [] [. . .] those who exist [. . .] through [. . .] as [I have] earlier said, while the material ones will be forsaken until the end to be destroyed, because they will not give their [names], should they return one more time to what [will not be]. Like they were [. . .] they were not [. . .] but they were profitable [for the] time that they dwelt among them, though they were not [. . .] in the beginning. Then [. . .] to act differently through the control they possessed in the preparation, [to] resist them.


    Although I continually make use [of] these words, [I have failed to grasp] the thoughts. Some elders [. . .] him greatness.


    (5 or 6 lines missing)


    [] [. . .] every [. . .] angel [. . .] words [and] a trumpet [sound], declaring the great complete restoration from the radiant east, in the bridal [chamber], which is the love of God the [Father], in accord with the power which [. . .] of the greatness [. . .], the sweetness of the [. . .] his, because he reveals himself to the greatnesses [. . .] his goodness [. . .] the praise, the kingdom, and the [glory] through [Jesus Christ], the Lord, the Savior, the Redeemer of all those encompassed by the one filled with loving mercy, through [his] Holy Spirit, from now through all generations, forever and ever. Amen.


