translation:
  language: de
  text: '**Schluss[a]**


    Dies ist das vollständige Wesen der Erzeugung, hervorgerufen durch das, was [Christus] trug, als er ihnen [mit] einem [Licht] leuchtete, das er offenbarte […] wie das Seine […] das sein wird […] wie das Seine […], während der einzige Unterschied, [der] bei denen besteht, die


    **(5 Zeilen fehlen)[b]**


    […] diejenigen, die existieren […] durch […], wie [ich] bereits gesagt habe. Die Materiellen aber werden bis zum Ende verlassen bleiben, damit sie vernichtet werden, weil sie ihre [Namen] nicht nennen werden, sollten sie noch einmal zu dem zurückkehren, was [nicht sein wird]. Wie sie […] waren sie nicht […], doch sie waren [für die] Zeit von Nutzen, in der sie unter ihnen wohnten, obwohl sie nicht […] am Anfang. Dann […], durch die Herrschaft, die sie bei der Vorbereitung besaßen, anders zu handeln, [um] ihnen zu widerstehen.


    Obwohl ich mich fortwährend [dieser] Worte bediene, [habe ich] die Gedanken [nicht erfasst]. Einige Älteste […] ihm Größe.


    **(5 oder 6 Zeilen fehlen)**


    […] jeder […] Engel […] Worte [und] ein [Posaunenschall], der die große, vollständige Wiederherstellung vom strahlenden Osten her verkündet, im Brautgemach, das die Liebe Gottes, des [Vaters], ist, gemäß der Kraft, die […] der Größe […] die Süße des […] sein, denn er offenbart sich den Größen […] seine Güte […] der Lobpreis, das Reich und die [Herrlichkeit] durch [Jesus Christus], den Herrn, den Retter, den Erlöser all derer, die der von liebevollem Erbarmen Erfüllte umschließt, durch [seinen] Heiligen Geist, von nun an durch alle Geschlechter hindurch, für immer und ewig. Amen.'
