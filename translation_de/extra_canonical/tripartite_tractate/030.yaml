lexical_decisions:
- source_word: begetting
  choice: Erzeugung
  rationale: „Erzeugung“ wahrt den umfassenden, kosmologisch-technischen Sinn besser als das enger biologische „Zeugung“ und legt nicht vorschnell „Geburt“ fest.
- source_word: material ones
  choice: die Materiellen
  rationale: Die substantivierte Form erhält den technischen Gruppenbegriff des Traktats, ohne ihn durch eine deutende Ergänzung wie „Menschen“ oder „Wesen“ einzuengen.
- source_word: complete restoration
  choice: vollständige Wiederherstellung
  rationale: Die Wiedergabe bewahrt sowohl den Gedanken der Wiederherstellung als auch das ausdrücklich genannte Moment der Vollständigkeit, ohne eine bestimmte dogmatische Lehre zu importieren.
- source_word: bridal chamber
  choice: Brautgemach
  rationale: „Brautgemach“ ist würdevoll und verständlich und erhält zugleich den symbolischen Fachausdruck.
- source_word: elders
  choice: Älteste
  rationale: Die neutrale Wiedergabe vermeidet die unbelegte Festlegung auf ein kirchliches Amt oder ein bestimmtes Lebensalter.
- source_word: trumpet sound
  choice: Posaunenschall
  rationale: „Posaunenschall“ entspricht dem religiös-literarischen Register und bezeichnet den Klang, nicht zwingend das Instrument als handelndes Subjekt.
theological_decisions:
- issue: Schicksal der materiellen Gruppe
  choice: „werden bis zum Ende verlassen bleiben, damit sie vernichtet werden“
  alternative: „werden bis zum Ende zurückgelassen und vernichtet werden“
  rationale: Die gewählte Fassung erhält die im Zeugen erkennbare Zweck- oder Folgerelation, ohne den beschädigten Zusammenhang systematisch zu glätten.
- issue: Identität des von liebevollem Erbarmen Erfüllten
  choice: „all derer, die der von liebevollem Erbarmen Erfüllte umschließt“
  alternative: Bezug ausdrücklich auf Gott, Christus oder den Geist
  rationale: Das Bezugswort ist im überlieferten Satz nicht eindeutig. Die Übersetzung lässt diese theologisch bedeutsame Mehrdeutigkeit bestehen.
- issue: Brautgemach und Liebe Gottes
  choice: „im Brautgemach, das die Liebe Gottes, des [Vaters], ist“
  alternative: „im Brautgemach der Liebe Gottes, des Vaters“
  rationale: 'Der prädikative Zusammenhang des englischen Zeugen wird bewahrt: Das Brautgemach wird mit der Liebe Gottes identifiziert, statt lediglich als ihr zugehörig bezeichnet zu werden.'
- issue: Eschatologische Wiederherstellung
  choice: „große, vollständige Wiederherstellung“
  alternative: „Allerlösung“ oder „Wiederbringung aller Dinge“
  rationale: Die neutralere Formulierung gibt den Text wieder, ohne eine spätere konfessionelle Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst fragmentarischer Syntax an stark beschädigten Stellen. Unklare Bezüge, Satzabbrüche, Ergänzungen und Lücken wurden nicht stillschweigend geglättet. Nicht zum Traktat gehörende Webseiten-, Kontakt- und Werbeangaben wurden ausgelassen.
