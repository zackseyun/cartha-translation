translation:
  language: de
  text: '**Unterschiedliche Auffassungen[a]**


    Wenn die beiden Ordnungen – [die] der Rechten und die der Linken – durch den vermittelnden Gedanken zwischen ihnen miteinander vereint werden, der ihnen ihren gemeinsamen Heilsplan gibt, bewirkt dies, dass beide mit derselben Leidenschaft handeln: Die von der Rechten ahmen die von der Linken nach, und die von der Linken ahmen die von der Rechten nach. Wenn bisweilen die böse Ordnung aus Torheit beginnt, Böses zu tun, ahmt die <weise> Ordnung sie nach und tut, in männlicher Gestalt, ebenfalls Böses, als wäre auch sie eine Macht des Bösen. Wenn zu anderen Zeiten die weise Ordnung beginnt, gute Werke zu tun, versucht auch die <törichte> Ordnung, Gutes zu tun, indem sie jene nachahmt.


    So werden die Dinge durch derartige [] Handlungen eingerichtet; sie entstehen so, dass das Ähnliche und das Unähnliche einander gleichen. Die Unbelehrten können daher die Ursache der bestehenden Dinge nicht erkennen. Darum haben sie verschiedenartige Erklärungen vorgebracht. Einige sagen, die bestehenden Dinge verdankten ihr Dasein der Vorsehung. Das sind diejenigen, die in den Bewegungen der Schöpfung Ordnung und feste Fügung sehen. Andere sagen, das Dasein stamme von etwas Fremdem. Das sind diejenigen, die die <Verschiedenheit> und das Böse in der Gesetzlosigkeit der Mächte sehen. Wieder andere sagen, die bestehenden Dinge ereigneten sich aufgrund des Schicksals. Das sind diejenigen, die sich eingehend mit dieser Frage beschäftigten. Andere sagen, es sei eine Sache der Natur, und wieder andere, es sei eine Sache des Zufalls. Die meisten von denen jedoch, deren Erkenntnis nur bis zu den sichtbaren Elementen reicht, wissen von nichts, was über sie hinausgeht.


    Die griechischen Weisen und die Barbaren[b] gelangten in ihrer Erkenntnis bis zu den Mächten, die durch Einbildung und leeres Denken ins Dasein kamen, <und auch> bis zu denen, die aus diesen hervorgingen – durch den Streit und das aufrührerische Verhalten, das unter ihnen wirksam war. Als sie daher über die Dinge sprachen, die sie für Weisheit hielten, wurden sie von einem <Trugbild> getäuscht. Sie glaubten, zur Wahrheit gelangt zu sein, [] doch waren sie einem Irrtum verfallen. Dieser Irrtum betraf nicht nur unbedeutende Bezeichnungen; vielmehr hinderten die Mächte selbst sie daran, indem sie ihnen einredeten, sie hätten das All <verstanden>.


    Infolgedessen geriet die Ordnung mit sich selbst in Streit, und zwar wegen der hochmütigen Feindschaft [eines Abkömmlings] des Archonten, der [höher steht] und schon vor ihm existierte. Deshalb herrschte unter allen über alles völlige Uneinigkeit: über die Philosophie, die verschiedenen Arten der Heilkunde, die Kategorien der Redekunst, die Arten der Musik und die Ordnungen der Logik. Alles bestand nur aus Meinungen und Theorien. So gewann die <Redseligkeit> die Oberhand, und <sie> gerieten in Verwirrung, weil sie nicht imstande waren, <diejenigen> zu erklären, die Macht besitzen und ihnen ihre Theorien eingegeben hatten.


    Was die Dinge betrifft, die unter dem <Volk> der Hebräer aufkamen: die Schriften der materiell Gesinnten, <deren> Vorbild die Griechen nachahmen, alles, was sie ersannen, um es in Worte zu fassen, die Mächte der Rechten <…>, die sie alle dazu anregten, <mit> Worten und einer Selbstdarstellung zu denken. So machten sie sich auf den Weg, die Wahrheit zu erlangen, wobei sie die gemischte Vielfalt der in ihnen wirksamen Mächte gebrauchten.


    Danach gelangten sie zur Ordnung der unvermischten Mächte, <bevor> sie zu dem gelangten, der nach dem Abbild des Vaters eingesetzt ist. Er ist nicht [] <aufgrund seiner> Natur unsichtbar, sondern weil eine Weisheit ihn verbirgt, um die Gestalt dessen zu bewahren, was wahrhaft unsichtbar ist. Daher waren viele Engel nicht imstande, ihn zu schauen.


    Die Angehörigen des hebräischen Volkes, die wir zuvor erwähnten – nämlich die Gerechten und die Propheten –, dachten und sprachen nichts aus Einbildung, durch ein trügerisches Bild oder aus schwer zugänglichem Denken. Vielmehr achtete jeder kraft der in ihm wirksamen Macht auf das, was er sah und hörte, und redete genau. Sie sprachen in gegenseitiger Übereinstimmung und Eintracht, ebenso wie die Mächte, die in ihnen wirkten, denn diese bewahrten ihre <Einheit> und ihre wechselseitige Harmonie. Dies war vor allem deshalb so, weil sie den priesen, der erhabener war als sie, und den, der größer war als sie, der existierte und eingesetzt worden war, weil sie ihn nötig hatten.


    Dies brachte das geistliche Wort unter ihnen hervor wie bei einem, der den Erhabenen nötig hat: mit Hoffnung und erwartungsvollem Warten, gemäß dem Gedanken, der der Same des Heils ist, und gemäß einem erleuchtenden Wort, das die Erinnerung ist – zusammen mit seinen Nachkommen und seinen Ausströmungen, nämlich den Gerechten und den Propheten, die wir zuvor erwähnten. Sie bewahren den Lobpreis ihrer Väter und deren Zeugnis über das Große. Diese entstanden [] in hoffnungsvoller Erwartung und Aufmerksamkeit. In sie wurde <der> Same des Gebets und des Suchens gesät, der in die Vielen gesät wird, die danach strebten, gestärkt zu werden. Er offenbart sich und bewegt sie dazu, den Erhabenen zu lieben und zu verkünden, dass diese Dinge dem Einen und Einzigen gehören.


    Etwas Einzigartiges war in ihnen wirksam, wenn sie sprachen. Ihre Schau und ihre Worte waren jedoch verschieden, weil auch diejenigen verschieden waren, die ihnen ihre Schau und ihre Worte mitteilten. Deshalb verwerfen diejenigen, die auf ihre Aussagen geachtet haben, nichts davon, sondern haben die Schriften mit unterschiedlichen Auslegungen angenommen. Dies führte zur Entstehung verschiedener Gruppen, die bis heute unter den Juden bestehen. Einige sagen, Gott sei einer – derjenige, der in den alten Schriften gesprochen hat. Andere sagen, er sei vielfältig. Wieder andere sagen, Gott sei einfach und seinem Wesen nach ein einziger Geist. Manche sagen, seine Taten stünden mit den Ursprüngen des Guten und des Bösen in Verbindung. Noch andere sagen, er selbst sei der Schöpfer dessen, was ins Dasein gekommen ist; andere wiederum sagen, [] er habe durch die Engel geschaffen. Die Vielfalt solcher Vorstellungen entspricht der Vielfalt der Formen und dem Reichtum der Arten von Schriften, die
    ihre Gesetzeslehrer<innen> hervorbrachten.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige deutsche Fassung auf Grundlage des angegebenen gemeinfreien englischen Übersetzungszeugen; eine unmittelbare Prüfung am koptischen Text des Nag-Hammadi-Codex I,5 steht noch aus. Eckige Klammern kennzeichnen beschädigten oder unsicheren Text, spitze Klammern editorische Ergänzungen und <…> eine Lücke.
    reason: Macht die mittelbare Textgrundlage und den Status der textkritischen Zeichen transparent.
  - marker: b
    text: „Barbaren“ bezeichnet hier im antiken griechischen Sprachgebrauch Nichtgriechen; das Wort ist nicht als moderne abwertende Charakterisierung gemeint.
    reason: Verhindert ein modernes Missverständnis, ohne die historische Gegenüberstellung im Haupttext aufzulösen.
  - marker: c
    text: Die Form „Gesetzeslehrer<innen>“ gibt eine editorisch ergänzte Endung des Übersetzungszeugen wieder; daraus lässt sich keine sichere Aussage über das Geschlecht der bezeichneten Personen ableiten.
    reason: Erklärt die ungewöhnliche Verbindung der textkritischen Winkelklammer mit deutscher Flexion und vermeidet eine unbeabsichtigte Festlegung.
lexical_decisions:
- source_word: orders
  choice: Ordnungen
  rationale: Bewahrt den kosmologischen und gruppenbezogenen Sinn des Zeugnisses, ohne vorschnell mit „Reiche“ oder „Klassen“ zu konkretisieren.
- source_word: powers
  choice: Mächte
  rationale: Formale, im religiös-kosmologischen Kontext verständliche Wiedergabe; lässt offen, ob personale oder überpersonale Kräfte gemeint sind.
- source_word: shared plan of salvation
  choice: gemeinsamer Heilsplan
  rationale: Gibt die soteriologische Bedeutung knapp und idiomatisch wieder, ohne den Urheber oder die genaue Art des Plans zusätzlich festzulegen.
- source_word: Totality
  choice: das All
  rationale: „Das All“ ist eine etablierte, zugleich allgemein verständliche Bezeichnung für die umfassende kosmologische Ganzheit.
- source_word: archon
  choice: Archont
  rationale: Der technische kosmologische Titel bleibt als Lehnwort erhalten, statt ihn durch „Herrscher“ zu verallgemeinern.
- source_word: spiritual Word
  choice: das geistliche Wort
  rationale: Bewahrt sowohl die geistbezogene Qualität als auch die mögliche personale Spannung von „Wort“, ohne diese ausdrücklich aufzulösen.
- source_word: emanations
  choice: Ausströmungen
  rationale: Vermittelt das Hervorgehen aus einer Quelle und bleibt näher an der kosmologischen Bildsprache als ein konfessionell stärker besetzter Ausdruck.
- source_word: barbarians
  choice: Barbaren
  rationale: Bewahrt die antike Gegenüberstellung zu den Griechen; eine Fußnote grenzt den historischen Sprachgebrauch vom modernen Werturteil ab.
- source_word: single mind
  choice: ein einziger Geist
  rationale: Im Deutschen ist „Geist“ in diesem metaphysischen Zusammenhang natürlicher als „Verstand“, ohne die Aussage auf eine menschliche Denkfähigkeit zu reduzieren.
theological_decisions:
- issue: Wechselwirkung zwischen rechter und linker Ordnung
  choice: Die gegenseitige Nachahmung wird einschließlich der befremdlichen Beteiligung der weisen Ordnung am Bösen unverändert wiedergegeben.
  alternative: Die weise Ordnung nur scheinbar oder widerwillig Böses tun lassen.
  rationale: Das Zeugnis formuliert eine echte Spannung; eine moralische Harmonisierung wäre interpretierend.
- issue: Unsichtbarkeit der väterähnlichen Gestalt
  choice: Nicht die Natur selbst, sondern das Verbergen durch eine Weisheit wird als Grund der Unsichtbarkeit wiedergegeben.
  alternative: Ihn seinem Wesen nach als unsichtbar bezeichnen.
  rationale: Die ungewöhnliche Unterscheidung des Textes wird bewahrt und nicht an geläufige Gotteslehre angepasst.
- issue: Inspiration der hebräischen Gerechten und Propheten
  choice: Die Verschiedenheit der mitteilenden Mächte und zugleich die Genauigkeit und Eintracht der prophetischen Aussagen bleiben nebeneinander stehen.
  alternative: Alle Aussagen unmittelbar einem einzigen göttlichen Sprecher zuschreiben.
  rationale: Der Text hält Einheit und Vielfalt bewusst in Spannung.
- issue: Aussagen jüdischer Gruppen über Gott und Schöpfung
  choice: Alle aufgeführten Auffassungen werden deskriptiv und ohne dogmatische Rangordnung wiedergegeben.
  alternative: Eine der Auffassungen als eigentliche Lehre des Abschnitts kennzeichnen.
  rationale: Die Passage berichtet gerade von unterschiedlichen Auslegungen und entscheidet sie hier nicht ausdrücklich.
- issue: Beschädigte und ergänzte Textstellen
  choice: Eckige Klammern, spitze Klammern und Ellipse werden im Haupttext bewahrt.
  alternative: Lücken stillschweigend glätten und Ergänzungen als sicheren Text drucken.
  rationale: Die Überlieferungsunsicherheit darf nicht verdeckt werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, sachlich-religiösem Register. Lange Perioden wurden behutsam gegliedert, ohne die gedanklichen Verknüpfungen zu vereinfachen. Technische kosmologische Begriffe wie „Archont“, „Mächte“ und „das All“ bleiben erhalten. Dunkle oder syntaktisch beschädigte Passagen wurden nicht frei rekonstruiert; insbesondere der Absatz über die hebräischen Schriften bleibt bewusst fragmentarisch. Die Fassung ist wegen der noch ausstehenden Prüfung des koptischen Ausgangstextes ausdrücklich vorläufig.
