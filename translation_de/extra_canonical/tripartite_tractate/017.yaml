  revised_text: '**Der Äon des Wortes**[a]



    Der Gedanke des Wortes, das seine Festigkeit wiedergewonnen hatte und über die zu herrschen begann, die durch es entstanden waren, wurde »Äon« und »Ort« genannt für alle, die es in Übereinstimmung mit dem Beschluss hervorgebracht hatte. Er wurde auch »Synagoge des Heils« genannt, weil das Wort sich selbst von der Zerstreuung heilte, die im Denken der Vielheit besteht, und zum einen Gedanken zurückkehrte. Ebenso wird er »Vorratshaus« genannt, wegen der Ruhe, die das Wort erlangte und allein sich selbst gewährte.[b] Er wird auch »Braut« genannt, aus Freude über den, der sich ihm hingab, in der Hoffnung auf Frucht aus der Vereinigung, und der ihm erschien. Er wird ferner »Königreich« genannt, wegen der Festigkeit, die das Wort gewann, als es sich über die Herrschaft über jene freute, die gegen es Krieg geführt hatten. Und er wird »Freude des Herrn« genannt, wegen der Freude, mit der es sich bekleidete. Das Licht bleibt bei ihm und gewährt ihm Lohn für die guten Dinge, die ihm gehören,

    nämlich die Gedanken der Freiheit.[c]



    Der Äon, den wir zuvor erwähnt haben, steht über den beiden Ordnungen derer, die gegeneinander kämpfen. Er ist kein Gefährte derer, die Herrschaft ausüben, und gehört nicht zu den Gebrechen und Schwächen, also zu dem, was mit der Erinnerung und dem Abbild zusammenhängt. Das, worin das Wort sich selbst versetzte, war ein Äon vollkommener Freude. Er besaß die Gestalt der Materie und zugleich die Natur seiner Ursache – dessen, was offenbart worden war –, denn er war ein Abbild derer, die in der Fülle wohnen und aus dem Reichtum der Wonne dessen entstanden sind, der ist.



    Und indem er sich am Angesicht dessen freute, der sich offenbart hatte, an seiner »Wonne«[d], an der Erwartung und an der Verheißung dessen, worum er gebeten hatte, besaß er den Namen des Sohnes sowie dessen Wesen, Kraft und Gestalt. Dieser ist derjenige, den er liebte und an dem er Gefallen hatte, für den in Liebe Gebete dargebracht worden waren.[e] Dieser Äon war ein Licht, ein Verlangen nach Festigkeit, eine Bereitschaft, sich belehren zu lassen, und ein Auge zum Sehen. Diese Eigenschaften besaß er von den Erhabenen. Außerdem war er Weisheit für den Gedanken des Wortes gegenüber denen, die im Heilsplan weiter unten standen, ein Wort zum Reden und die Vollendung anderer Dinge dieser Art.



    Diejenigen aber, die zusammen mit ihm nach dem Abbild der Fülle Gestalt annahmen, haben jene, die sich offenbarten, zu Eltern; jeder Einzelne ist das Abbild einer der Gestalten. Da sie Gestalten des Männlichen sind, stammen sie nicht aus der Schwachheit, die Weiblichkeit ist, sondern von dem, der dieser Schwachheit bereits entflohen war. Sie[f] tragen den Namen »Gemeinde«, weil sie in ihrem Einklang dem Einklang der Versammlung gleichen, deren Mitglieder offenbar geworden sind. Auch das, was nach dem Abbild des Lichtes entstand, ist vollkommen, denn es ist ein Abbild des einzig bestehenden Lichtes, das die Allheiten ist. Obwohl es geringer ist als das, dessen Abbild es ist, besitzt es dennoch dessen Untrennbarkeit, denn es ist ein Angesicht des untrennbaren Lichtes.



    Dennoch sind diejenigen, die nach dem Abbild eines jeden der Äonen entstanden, ihrem Wesen nach das, was wir zuvor erwähnt haben; in ihrer Wirksamkeit aber sind sie ungleich, weil diese jedem Einzelnen auf eigene Weise innewohnt. In dieser Vereinigung miteinander sind sie gleich,[g] doch jeder Äon hat die ihm eigenen Unterschiede bewahrt. Darum besitzen sie Leidenschaften; denn Leidenschaft ist eine Schwachheit. Sie wurden nämlich nicht aus der Einheit der Fülle hervorgebracht, sondern vorzeitig aus einem Einzelnen, bevor dieser es vom Vater empfangen hatte, oder aus der Einheit mit seiner Allheit und seinem Willen.[h]



    Trotzdem war dies für den künftigen Heilsplan von Nutzen. Man gestattete ihnen, durch die unteren Orte zu ziehen, denn diese Orte können ihr plötzliches Kommen nicht aufnehmen, wenn sie nicht einer nach dem anderen kommen. Ihr Kommen ist notwendig, weil durch sie alles zur Vollendung gebracht werden wird.



    Kurz gesagt: Das Wort empfing die Schau von allem – von dem, was war, was jetzt ist und was sein wird –, denn ihm ist der Heilsplan für alles Seiende anvertraut worden. Einiges ist bereits zum Sein gelangt, weil darin eine Absicht lag. Die Samen dagegen, die erst noch ins Dasein treten sollen, bewahrte das Wort in sich selbst auf, und zwar wegen der Verheißung, die sich auf das von ihm Erdachte bezog: der Verheißung künftiger Samen. Und es brachte seine Nachkommenschaft hervor, das heißt die Offenbarung dessen, was es erdacht hatte. Eine Zeit lang wurden die verheißenen Samen jedoch daran gehindert, ins Dasein zu treten, denn sie sind für eine Aufgabe bestimmt, wenn der Retter kommt und mit ihm seine Gefährten, die in der Erkenntnis und Herrlichkeit des Vaters die Ersten sind.'
