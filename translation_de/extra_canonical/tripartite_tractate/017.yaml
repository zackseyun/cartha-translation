  footnotes:
  - marker: a
    text: Die Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Übersetzungszeugen des koptischen Textes aus Nag-Hammadi-Kodex I,5. Eine unmittelbare Prüfung am koptischen Text steht noch aus.
    reason: Die bereitgestellte Ausgangslage erlaubt keine abgeschlossene quellensprachliche Absicherung; der Publikationsstatus muss transparent bleiben.
  - marker: b
    text: An dieser Stelle zeigt der zugrunde gelegte Zeuge eine nicht näher bestimmte Textlücke an.
    reason: Kennzeichnet die im englischen Zeugen durch leere eckige Klammern markierte Lücke.
  - marker: c
    text: Der zugrunde gelegte Zeuge ergänzt innerhalb dieses Satzes ein Pronomen und stellt beim Plural »Gedanken« eine textkritische Korrektur beziehungsweise Ergänzung dar.
    reason: Macht redaktionelle Eingriffe des Zeugen sichtbar, ohne den Lesefluss mit Rekonstruktionszeichen zu überladen.
  - marker: d
    text: »Wonne« ist im zugrunde gelegten Zeugen als Wiederherstellung eines unsicheren oder beschädigten Wortlauts gekennzeichnet.
    reason: Bewahrt die textkritische Unsicherheit der in spitzen Klammern gebotenen Ergänzung.
  - marker: e
    text: Nach diesem Satzteil zeigt der zugrunde gelegte Zeuge eine nicht näher bestimmte Textlücke an.
    reason: Kennzeichnet die zweite leere Lückenmarkierung des englischen Zeugen.
  - marker: f
    text: Das Subjekt »Sie« ist im zugrunde gelegten Zeugen redaktionell ergänzt.
    reason: Kennzeichnet die in spitzen Klammern gebotene syntaktische Ergänzung.
  - marker: g
    text: An dieser Stelle zeigt der zugrunde gelegte Zeuge eine weitere nicht näher bestimmte Textlücke an.
    reason: Kennzeichnet die dritte leere Lückenmarkierung des englischen Zeugen.
  - marker: h
    text: Der Satzbau und die Bezüge in diesem Satz sind unsicher. Besonders offen bleibt, worauf »sie« und »dieser« genau verweisen und wie die beiden mit »oder« verbundenen Wendungen zueinander stehen.
    reason: Verhindert, dass eine schwierige Überlieferung durch eine scheinbar eindeutige theologische Paraphrase verdeckt wird.
lexical_decisions:
- source_word: Word
  choice: Wort
  rationale: Bewahrt die zentrale personifizierte Bezeichnung des Textes; das grammatische Neutrum wird beibehalten, ohne die personale Funktion abzuschwächen.
- source_word: Aeon
  choice: Äon
  rationale: Etablierter deutschsprachiger Fachbegriff für die kosmologische Größe; eine bloße Wiedergabe als »Zeitalter« wäre hier irreführend.
- source_word: Fullness
  choice: Fülle
  rationale: Natürliche und traditionsnahe Wiedergabe des kosmologischen Vollständigkeitsbegriffs, ohne ihn konfessionell auszudeuten.
- source_word: Synagogue of Salvation
  choice: Synagoge des Heils
  rationale: Die formelhafte Benennung und der Zusammenhang mit der folgenden »Versammlung« bleiben sichtbar; eine Glättung zu »Heilsgemeinde« würde die Terminologie vereinheitlichen, die der Text unterscheidet.
- source_word: Storehouse
  choice: Vorratshaus
  rationale: Gibt das Bild eines Aufbewahrungsortes verständlich wieder und vermeidet das heute missverständliche »Magazin«.
- source_word: energy
  choice: Wirksamkeit
  rationale: Bezeichnet hier die jeweils verschiedene tätige Kraft oder Wirkungsweise; »Energie« klänge im modernen Deutsch zu physikalisch.
- source_word: passions
  choice: Leidenschaften
  rationale: Bewahrt den antiken wertenden Begriff samt seiner Verbindung zur Schwachheit; »Affekte« wäre fachsprachlicher.
- source_word: Totalities
  choice: Allheiten
  rationale: Bewahrt den ungewöhnlichen kosmologischen Plural und unterscheidet ihn von der »Fülle«; die Fremdheit des Ausdrucks gehört zur Gedankenwelt des Textes.
- source_word: plan of salvation
  choice: Heilsplan
  rationale: Knappes, verständliches Äquivalent, das die geordnete Durchführung der Rettung bezeichnet, ohne ihren theologischen Mechanismus näher festzulegen.
- source_word: seeds
  choice: Samen
  rationale: Bewahrt das wiederkehrende Zeugungs- und Hervorbringungsbild des Abschnitts.
theological_decisions:
- issue: Person und grammatisches Geschlecht des Wortes
  choice: Das personifizierte »Wort« bleibt grammatisch sächlich; bei »Äon« wird entsprechend dem deutschen Substantiv das Maskulinum verwendet.
  alternative: Durchgehend »der Logos« und männliche Pronomen verwenden.
  rationale: »Wort« ist allgemein verständlich und quellennah. Der Wechsel des grammatischen Geschlechts darf nicht zur dogmatischen Festlegung verschiedener Personen oder Wesen gemacht werden.
- issue: Männlichkeit, Weiblichkeit und Schwachheit
  choice: 'Die wertende Gegenüberstellung des Zeugen wird ausdrücklich, aber als textinterne Zuordnung wiedergegeben: »die dem Weiblichen zugeordnet wird«.'
  alternative: Die Aussage abschwächen, neutralisieren oder als allgemeine Lehre über Frauen formulieren.
  rationale: Die problematische kosmologische Bildsprache darf weder getilgt noch in eine Aussage über menschliche Geschlechter ausgeweitet werden.
- issue: Identität des Offenbarers, des Sohnes und des Geliebten
  choice: Die mehrdeutigen Pronomen und Bezüge bleiben weitgehend offen.
  alternative: Alle Bezüge ausdrücklich entweder dem Retter, dem Vater, dem Wort oder dem Äon zuordnen.
  rationale: Der vorliegende Zeuge lässt die Referenten nicht überall sicher erkennen; eine eindeutige Zuordnung würde zusätzliche Christologie in den Text eintragen.
- issue: Entstehung »aus einem Einzelnen«
  choice: Die syntaktisch schwierige Alternative wird eng am Zeugen wiedergegeben und durch eine Fußnote als unsicher gekennzeichnet.
  alternative: Den Satz als eindeutige Hervorbringung durch den Vater oder durch den Logos paraphrasieren.
  rationale: Die Überlieferung beziehungsweise ihre englische Wiedergabe bietet keine ausreichende Grundlage für eine dogmatisch eindeutige Rekonstruktion.
- issue: Heilsplan und Vollendung
  choice: Die universale Formulierung »alles« bleibt stehen.
  alternative: Sie auf eine bestimmte Gruppe von Wesen oder ausschließlich auf Menschen beschränken.
  rationale: Der Text selbst formuliert umfassend; Reichweite und Art der Vollendung werden hier nicht näher erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachwörtern. Lange Perioden wurden maßvoll gegliedert, ohne die argumentativen Bezüge zu vereinfachen. Personale Pronomen folgen grundsätzlich dem grammatischen Geschlecht der deutschen Begriffe; wo der Zeuge selbst mehrdeutig ist, wurde diese Mehrdeutigkeit nicht stillschweigend aufgelöst. Textlücken und Wiederherstellungen sind durch Fußnoten transparent gemacht.
