review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem vorgelegten englischen Übersetzungszeugen insgesamt eng und bewahrt dessen kosmologische Terminologie, Mehrdeutigkeiten und textkritische Markierungen weitgehend. Korrigiert werden sollten jedoch die unmotivierte Bedeutungsnuance „wiederhergestellten“ bei der ergänzten „Wonne“, die abschwächende Wiedergabe der textinternen Gleichsetzung von Weiblichkeit und Schwachheit sowie ein unnötig stark festgelegter Bezug im schwierigen Satz über die vorzeitige Hervorbringung. Im Schlussteil ist „empfangen hatte“ für „conceived“ weniger präzise als „erdacht hatte“. Eine direkte Prüfung am Koptischen ist nach wie vor ausstehend.
  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch und trägt die schwierige Satzperiodik gut. Die Fachwörter Äon, Fülle und Allheiten sind konsistent. Die vorgenommenen Änderungen erhöhen die Präzision, ohne den bewusst fremdartigen Registercharakter des Traktats zu glätten.
  terminology: 'Die Schlüsselbegriffe sind sachgerecht und einheitlich wiedergegeben: Word/Wort, Aeon/Äon, Fullness/Fülle, Totalities/Allheiten und plan of salvation/Heilsplan. „Synagoge des Heils“ und „Gemeinde“ halten die im Zeugen unterschiedenen Bezeichnungen auseinander. Die problematische geschlechtliche Bildsprache wird als textinterne Behauptung exakt wiedergegeben, ohne sie zu einer Aussage über reale menschliche Geschlechter auszudeuten.'
  issues:
  - severity: medium
    issue: „wiederhergestellten »Wonne«“
    rationale: Die spitzen Klammern im Zeugen kennzeichnen eine editorische Ergänzung, nicht eine Wiederherstellung im inhaltlichen Sinn. „Wiederhergestellt“ fügt eine nicht bezeugte zeitliche bzw. sachliche Nuance hinzu.
  - severity: medium
    issue: „die dem Weiblichen zugeordnet wird“
