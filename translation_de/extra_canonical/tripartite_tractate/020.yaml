translation:
  language: de
  text: 'Über alle Archonten setzte er einen Archon ein, dem niemand Befehle erteilt. Er ist der Herr über sie alle, nämlich das Angesicht, das der Logos durch seinen Gedanken hervorbrachte, damit es den Vater der Allheiten darstelle. Darum ist er mit jedem <Namen> geschmückt, der dessen Ebenbild ist, denn er besitzt jede Eigenschaft und jedes herrliche Merkmal. Dementsprechend wird er sogar „Vater“, „Gott“, „Demiurg“, „König“, „Richter“, „Ort“, „Wohnstätte“ und „Gesetz“ genannt. Der Logos gebraucht ihn als Hand, um das Werk der unteren Bereiche zu ordnen, und er gebraucht ihn als Mund, um auszusprechen, was geweissagt werden soll. Er sprach und schuf Ordnung. Als er sah, dass seine Werke groß, gut und wunderbar waren, empfand er Freude und frohlockte, als [] hätte er sie in seinen eigenen Gedanken ausgesprochen und vollbracht. Dabei wusste er nicht, dass die Bewegung in ihm vom Geist ausging, der ihn gemäß einer Vorherbestimmung bewegt, sodass er alles tut, was er gerade tun will.


    Über das, was aus ihm entstand, sprach er, und es entstand als Ebenbild der geistigen Orte, die wir zuvor beim Thema der Abbilder erwähnt haben. Er <tat> mehr, als nur zu wirken; denn da er zum Vater seines Heilsplans bestimmt worden war, zeugte er nicht nur durch sich selbst und die Samen, sondern auch [durch den] erwählten Geist, der [durch ihn] in die unteren Bereiche hinabsteigen wird. Er tut [mehr], als nur seine eigenen geistigen Worte zu sprechen, <sondern> er tut es auf verborgene Weise durch den Geist, der laut ruft und Dinge gebiert, die über seine eigene Natur hinausgehen. Da er seiner Natur nach Gott und Vater ist und auch alle anderen Ehrentitel trägt, nahm er an, sie gehörten zu seiner eigenen Natur.


    Für die, die ihm gehorchen, gründete er einen Ruheort; für die, die ihm nicht gehorchen, <setzte> er auch Strafen <ein>. Bei ihm befinden sich ein Paradies und ein Königreich sowie alle übrigen Dinge, die in dem Äon wohnen, der schon vor ihm bestand. Sie sind wertvoller als die Nachbildungen, weil sie mit dem Gedanken verbunden sind. Diese Verbindung ist gleichsam mit [] einem Schatten und einem Gewand vergleichbar, denn er kann nicht sehen, wie alles, was besteht, tatsächlich besteht.


    Er setzte Arbeiter und Diener ein, die ihm bei dem helfen sollten, was er tun und sagen würde. Denn überall, wo er wirkte, hinterließ er sein Angesicht mit seinem schönen Namen und brachte hervor und sprach aus, was immer er betrachtete. Aus seiner eigenen Wesenheit errichtete [er] an seinem Ort sichtbare Abbilder des Lichtes und [der] unsichtbaren geistigen [Orte]. So wurde jeder Ort überall durch ihn geschmückt, indem er das Bild dessen widerspiegelte, der sie eingesetzt hatte; und so wurden sie gegründet. Obwohl Paradiese, Königreiche, Ruheorte, Verheißungen und Scharen von Dienern, die seinen Willen ausführen, herrschende Herren sind, stehen sie unter dem Herrn, der sie eingesetzt hat.


    Nachdem er auf diese Weise auf ihn gehört hatte, setzte er die Lichter, welche die Quelle des <Weltsystems> bilden, über die Ordnung der unteren Bereiche. So bewegte ihn der unsichtbare Geist, damit er [] dazu geneigt wäre, durch seinen eigenen Diener zu herrschen, den er ebenfalls als Hand, als <Mund> und sogar als sein Angesicht gebrauchte. Er brachte Ordnung, Drohungen und Furcht hervor, damit jene, die aus Unwissenheit wirkten, […] den [ihnen zum] Bewahren [gegebenen] Ort behalten konnten; denn sie sind durch [die Fesseln der] Archonten über ihnen an ihre Orte gebunden.


    Die gesamte Natur der Materie [ist] in drei Gruppen geteilt: Der geistige Logos brachte aus Einbildung und Hochmut die [ersten] Mächte hervor und stellte sie dem geistigen Rang nach an die erste Stelle. Jene Mächte, die diese aus Herrschsucht hervorbrachten, stellte er in den mittleren Rang, weil sie infolgedessen herrschsüchtige Mächte <waren>, damit sie herrschen und der Ordnung unter ihnen mit Gewalt zwingende Befehle erteilen konnten. Jene, die durch Neid und Eifersucht entstanden, sowie alle anderen Nachkommen solcher Neigungen, stellte er in eine Ordnung der Knechtschaft: Sie sollten die äußersten Grenzen beherrschen und allem, was existiert, sowie aller Zeugung Befehle erteilen. Von ihnen stammen Wesenheiten der Krankheiten, die plötzlich töten und darauf aus sind, Nachkommen zu zeugen, obwohl sie an dem Ort, aus dem sie hervorgegangen waren und zu dem sie wieder zurückkehren werden, nichts waren. Daher setzte er über sie Gewalten, die unablässig an der Materie wirken, damit []
    auch die Nachkommen der Seienden unablässig bestehen könnten; denn darin liegt ihre Herrlichkeit.'
