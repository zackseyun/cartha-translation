review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt dem vorliegenden englischen Zeugen insgesamt eng und bewahrt die wesentlichen technischen Begriffe sowie die absichtlich offenen Referenzen. Einige Stellen glätten jedoch editorische Kennzeichnungen oder verschieben deren Umfang; außerdem wird „system“ ohne ausreichenden Anlass als „Weltsystem“ interpretiert.
  naturalness: Die deutsche Syntax ist überwiegend klar und angemessen würdig. Einzelne Formulierungen sind unnötig schwerfällig, besonders „gleichsam mit [] einem Schatten ... vergleichbar“; die Klammerung bei den unsichtbaren geistigen Orten sollte zudem die Vorlage genauer abbilden.
  terminology: „Archonten“, „Logos“, „Allheiten“, „Demiurg“, „Äon“, „Mächte“ und „Gewalten“ sind sachgerecht. „System“ sollte als offener kosmologischer Ausdruck nicht zu „Weltsystem“ erweitert werden. Die editorischen Zeichen der englischen Brückenquelle müssen, soweit die deutsche Grammatik es zulässt, in ihrem jeweiligen Umfang erhalten bleiben.
  issues:
  - severity: medium
    issue: „system“ wurde zu „<Weltsystem>“ erweitert.
    rationale: Die Vorlage hat lediglich „system“; weder „world“ noch eine entsprechende Ergänzung ist dort markiert. „System“ bewahrt den technischen, nicht weiter festgelegten Ausdruck und die Winkelklammern müssen nur die tatsächlich ergänzten Bestandteile anzeigen.
  - severity: medium
    issue: Die editorische Kennzeichnung bei den „invisible spiritual places“ wurde umgestaltet.
    rationale: Die Vorlage lautet „and [the] (invisible) spiritual [places]“. Die Übersetzung sollte die Parenthese für „unsichtbar“ und die eckigen Klammern für den ergänzten Bestandteil erkennbar bewahren, statt die Markierung auf den Artikel zu verlagern.
  - severity: low
    issue: Die Vergleichsformel zu Schatten und Gewand ist im Deutschen syntaktisch holprig.
    rationale: „Diese Verbindung ist gleichsam mit [] einem Schatten und einem Gewand vergleichbar“ ist möglich, aber unnötig sperrig. Eine Umstellung verbessert die Lesbarkeit ohne Sinnverlust.
  - severity: low
    issue: Die Markierung beim „Ort“, den die Unwissenden bewahren sollen, wurde aufgeteilt und gegenüber der Vorlage verschoben.
    rationale: Die Quelle markiert die Zuweisungsphrase als Ergänzung. Die deutsche Formulierung kann dies geschlossen als „den [ihnen zum Bewahren gegebenen] Ort“ wiedergeben, während „behalten“ dem unmarkierten „retain“ entspricht.
