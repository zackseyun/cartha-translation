lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der in gnostischen Texten etablierte Fachbegriff bewahrt die kosmologische Bedeutung; „Herrscher“ allein wäre weniger präzise.
- source_word: the Word
  choice: der Logos
  rationale: „Logos“ wahrt den technischen und personifizierten Charakter des Begriffs und vermeidet eine Verengung auf ein bloß gesprochenes Wort.
- source_word: Father of the Totalities
  choice: Vater der Allheiten
  rationale: Die ungewöhnliche Pluralvorstellung wird bewusst erhalten; „Vater des Alls“ würde sie glätten.
- source_word: Demiurge
  choice: Demiurg
  rationale: Der etablierte deutschsprachige Fachbegriff erhält die spezifische kosmologische Rolle.
- source_word: repose
  choice: Ruheort
  rationale: Gibt einen gegründeten beziehungsweise bewohnbaren Heilsbereich natürlicher wieder als das abstrakte „Ruhe“, ohne den Sinn konfessionell auszudeuten.
- source_word: aeon
  choice: Äon
  rationale: Der technische kosmologische Begriff wird transliteriert und nicht vereinfachend als „Zeitalter“ wiedergegeben.
- source_word: system
  choice: Weltsystem
  rationale: Im kosmologischen Zusammenhang bezeichnet der Ausdruck eine geordnete Weltstruktur; die Ergänzung bleibt durch Winkelklammern als Wiederherstellung kenntlich.
- source_word: powers / authoritative powers
  choice: Mächte / Gewalten
  rationale: Die Unterscheidung des Zeugnisses wird erhalten; „Gewalten“ markiert im letzten Fall die ausdrücklich verliehene Autorität.
theological_decisions:
- issue: Unwissenheit und gelenktes Handeln des Demiurgen
  choice: Die Spannung zwischen seinem vermeintlich eigenen Willen und der vorherbestimmenden Bewegung durch den Geist bleibt ausdrücklich stehen.
  alternative: Den Demiurgen als bloß willenloses Werkzeug oder als völlig selbstständig Handelnden darstellen.
  rationale: Das Zeugnis behauptet zugleich sein Wollen, seine Unwissenheit und den Ursprung seiner inneren Bewegung im Geist.
- issue: Göttliche Ehrentitel des Demiurgen
  choice: Die Titel werden ohne abschwächende Anführungszeichen oder dogmatische Erklärung wiedergegeben; seine Annahme, sie gehörten seiner Natur an, bleibt erhalten.
  alternative: Die Titel als falsch, ironisch oder nur angemaßt kennzeichnen.
  rationale: Der Abschnitt verbindet eine tatsächliche naturgemäße Zuschreibung mit begrenzter Erkenntnis; diese theologische Spannung darf nicht aufgelöst werden.
- issue: Bezug des Geistes in „eigene Natur“
  choice: Das grammatische Pronomen bleibt als „seine eigene Natur“ mehrdeutig.
  alternative: Explizit „die Natur des Geistes“ oder „die Natur des Demiurgen“ schreiben.
  rationale: Die vorliegende Quellenbasis erlaubt keine sichere Auflösung des Bezugs.
- issue: Mehrdeutige Pronomen und Subjekte
  choice: Wo möglich bleiben die wiederholten Formen „er/ihn/sein“ ohne zusätzliche Eigennamen bestehen.
  alternative: Jede Referenz ausdrücklich dem Logos, Geist oder Demiurgen zuordnen.
  rationale: Das englische Zeugnis und die noch ausstehende koptische Prüfung lassen mehrere Bezüge offen.
translation_notes:
  register: 'Moderne, würdige Standardsprache mit bewusst beibehaltenen gnostischen Fachbegriffen. Rekonstruktionszeichen des Zeugnisses wurden erhalten: <…> für ergänzten Text, […] beziehungsweise [] für Lücken oder beschädigte Stellen und runde Klammern wurden, wo für flüssiges Deutsch vertretbar, in den Satz integriert. Da die direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung als quellennaher, vorläufiger Publikationsentwurf auf Grundlage des angegebenen englischen Zeugnisses zu behandeln.'
