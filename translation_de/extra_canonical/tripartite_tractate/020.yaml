source:
  text: 'Over all of the archons, he assigned an archon whom no one commands. He is the lord of them all, namely, the face the Word produced by his thought to be a representation of the Father of the Totalities. He is, therefore, beautified with every <name> that is a likeness of him, because he possesses every quality and glorious attribute. Accordingly, he is even called “Father,” “God,” “Demiurge,” “King,” “Judge,” “Place,” “Abode,” and “Law.” The Word employs him as a hand to put in order the work of the things below, and he employs him as a mouth to say what is to be prophesied. He spoke and put in order, and when he saw that (his works) were great and good and wondrous, he was delighted and glad, as [] though in his own thoughts he had spoken them and done them, being ignorant that the movement within him originated from the Spirit that moves him in a predestined manner to do whatever he happens to wish.


    Regarding the things that came into being from him, he spoke concerning them, and they came into being as a likeness of the spiritual places we referred to earlier on the topic of images. He <did> more than just work, for being assigned as the father of his plan of salvation, he generated not only through himself and the seeds, but also [through the] chosen Spirit who will descend [through him] to the places below. He does [more] than just speak his own spiritual words, <but> (he does so) in a concealed manner through the Spirit who cries out and gives birth to things that surpass its own nature. Since according to his nature he is God and Father, and all the other titles of honor, he assumed they pertained to his own nature.


    He founded a repose for those obedient to him; as for those who are disobedient to him, <he> also <instituted> punishments. A paradise and a kingdom dwell with him, and all things besides that dwell in the aeon that pre-existed him. They have more value than the copies, because of their relation to the thought. (This relation) is, as it were, comparable to [] a shadow and a garment, because he cannot see how whatever exists actually exists.


    He instituted laborers and servants to help with what he would do and what he would say, because everywhere he operated, he left behind his face with his beautiful name, producing and pronouncing whatever he contemplates. From his own essence [he] established in his place visible images of the light, and [the] (invisible) spiritual [places]. In this way every place everywhere was beautified by him, reflecting the image of the one who placed them, and thus were they established. Although paradises, kingdoms, reposes, promises, and multitudes of servants for performing his will are ruling lords, they are placed below the lord who appointed them.


    After listening to him in this way, he placed the lights that <comprise> the source <of> the system over the arrangement of the things below. This is how the invisible Spirit moved him, so that he [] would be inclined to govern through his own servant, whom he also employed as a hand and as a < mouth>, and even as his face. He produced order, threats, and fear, so that those who operated out of ignorance […] could retain the place [given for them to] keep, because they are bound to their places by [the chains of the] archons over them.


    The entire nature of matter [is] divided into three categories: The spiritual Word produced the [first] powers from imagination and pride, placing them first according to spiritual rank. Those (powers) which these produced by lust for control, he placed in the middle (rank), because they [consequently] <were> powers lusting for control, so that they could rule and issue compulsory commands with force to the establishment below them. Those that came into being through envy and jealousy, and every other offspring from these kinds of inclination, he placed in an order of slavery to control the outermost limits, and to command all that exist and all generation. From these derive (entities of) illnesses that kill suddenly, and who are eager to beget, though they were nothing in the place where they had originated and where they will again return. He therefore set over them authoritative powers, working unceasingly on matter, so that [] the offspring of the existent ones could similarly exist
    unceasingly, because this is their glory.'
