  yaml_path: translation/extra_canonical/tripartite_tractate/016.yaml
  text: 'When the deficient Word became enlightened, his Fullness came into being. He escaped from those who had troubled him at first. He disentangled himself from them. He stripped off that prideful thought. When those who had at first disobeyed him prostrated and humbled themselves before him, he became mingled with the Repose.


    And <he> rejoiced because of the visitation of his visiting brothers. He glorified and praised those who had shown themselves to be a help to him. He gave thanks for escaping from those who had rebelled against him, and he esteemed and honored the Greatness and those who were determined to reveal themselves to him. He generated living images of the living figures. They are pleasing and good because they come from living things and resemble them in beauty, yet they are not equal to them in truth, because they do not come from a unification between him who produced them [] and the one who revealed himself to him. Even so, he works in wisdom and knowledge, completely mingling the Word with himself. Therefore, those produced from him are great, just as He Who Is is truly great.


    After he marveled at the beauty of those <who> had appeared to him, he declared his gratitude for this visitation. The Word carried out this work with the help of those who aided him, because of the firmness of those who had come into being through him, so that they could obtain something good. For he remembered to pray for the plan of salvation for all those whom he had produced, which was made firm in order to establish them.


    Therefore, those whom he purposefully produced are on chariots, like those who came into being, those who appeared so that they could pass through every place of what is below, so that each of them could be granted the place appropriate to his nature.


    This is destructive for those of the likeness, but beneficial for those of the memory—a revelation of those from the decision of the aeons, which was a unity and a mercy—whereas they are only seeds that have not yet reached full existence.


    The one who appeared was a face of the Father and of the harmony. He was a garment of all graces and food for those whom the Word produced while praying, glorifying, and praising. This is the one he glorified and praised [] while gazing at those whom he beseeched, so that he could perfect them with the images he had produced.


    The Word increased their mutual assistance and their hope in the promise, because they possess joy, a wealth of repose, and unsullied delights. Bestowing perfection with vision as the goal, he generated those whom he had remembered at first, when they were not yet with him. He remains in hope and faith in the perfect Father, as do the Totalities. It is revealed to him before he intermingles with it, so that those who have come into being would not perish by gazing upon the light, since they are unable to bear the great, lofty stature.'
translation:
  language: de
  text: 'Als der mit einem Mangel behaftete Logos[a] erleuchtet wurde, trat seine Fülle ins Dasein. Er entkam denen, die ihn anfangs in Unruhe versetzt hatten. Er löste sich aus ihrer Verstrickung. Jenen stolzen Gedanken legte er ab. Als diejenigen, die ihm anfangs ungehorsam gewesen waren, sich vor ihm niederwarfen und demütigten, vereinigte er sich mit der Ruhe.


    Und ⟨er⟩ freute sich über den Besuch seiner Brüder, die zu ihm gekommen waren.[b] Er verherrlichte und pries diejenigen, die sich ihm als Hilfe erwiesen hatten. Er dankte dafür, dass er denen entkommen war, die sich gegen ihn aufgelehnt hatten; und er schätzte und ehrte die Größe sowie diejenigen, die entschlossen waren, sich ihm zu offenbaren. Er brachte lebendige Abbilder der lebendigen Gestalten hervor. Sie sind wohlgefällig und gut, weil sie aus Lebendigem hervorgegangen sind und ihm an Schönheit gleichen. Doch in Wahrheit sind sie ihm nicht ebenbürtig, denn sie stammen nicht aus einer Vereinigung zwischen dem, der sie hervorbrachte, […][c] und dem, der sich ihm offenbarte. Dennoch wirkt er in Weisheit und Erkenntnis und vereinigt den Logos ganz mit sich selbst. Daher sind diejenigen, die aus ihm hervorgebracht wurden, groß, so wie Der, der ist, wahrhaft groß ist.


    Nachdem er über die Schönheit derer gestaunt hatte, die ihm erschienen waren, bekundete er seine Dankbarkeit für diesen Besuch. Der Logos vollbrachte dieses Werk mit der Hilfe derer, die ihm beistanden, um der Festigkeit derer willen, die durch ihn ins Dasein gekommen waren, damit sie etwas Gutes erlangen könnten. Denn er erinnerte sich daran, für den Heilsplan für alle zu beten, die er hervorgebracht hatte — einen Plan, der gefestigt worden war, um auch sie zu festigen.


    Diejenigen, die er mit Bedacht hervorbrachte, befinden sich daher auf Wagen, wie jene, die ins Dasein kamen — jene, die erschienen, damit sie jeden Ort des unteren Bereichs durchqueren könnten und jedem von ihnen der seiner Natur entsprechende Platz zugeteilt würde.


    Dies bringt denen, die der Ähnlichkeit angehören, Verderben, denen aber, die der Erinnerung angehören, Nutzen: Es ist eine Offenbarung jener, die aus dem Beschluss der Äonen hervorgegangen sind. Dieser Beschluss war Einheit und Erbarmen, während sie nur Samen sind, die noch nicht zu voller Existenz gelangt sind.


    Derjenige, der erschien, war ein Antlitz des Vaters und der Harmonie. Er war ein Gewand aller Gnadengaben und Nahrung für diejenigen, die der Logos hervorbrachte, während er betete, verherrlichte und pries. Dies ist derjenige, den er verherrlichte und pries […][c], während er auf jene blickte, zu denen er flehte, damit er sie durch die Abbilder, die er hervorgebracht hatte, vollkommen machen könnte.


    Der Logos ließ ihre gegenseitige Hilfe und ihre Hoffnung auf die Verheißung wachsen, denn sie besitzen Freude, einen Reichtum an Ruhe und unbefleckte Wonnen. Indem er Vollkommenheit verlieh und dabei die Schau zum Ziel hatte, brachte er diejenigen hervor, deren er sich anfangs erinnert hatte, als sie noch nicht bei ihm waren. Wie auch die Gesamtheiten bleibt er in Hoffnung und Glauben an den vollkommenen Vater. Es wird ihm offenbart, bevor er sich damit vereinigt, damit diejenigen, die ins Dasein gekommen sind, nicht beim Anblick des Lichtes vergehen; denn sie können die große, erhabene Gestalt nicht ertragen.'
