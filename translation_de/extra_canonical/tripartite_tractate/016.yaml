  footnotes:
  - marker: a
    text: „Logos“ gibt hier die personale Gestalt wieder, die im Zeugen als „Word“ bezeichnet wird. Die Übersetzung ist vorläufig, da eine unmittelbare Prüfung des koptischen Textes noch aussteht.
    reason: Transparenz über die textliche Grundlage und Erklärung eines zentralen Fachbegriffs.
  - marker: b
    text: Wörtlicher ist von der „Heimsuchung“ beziehungsweise dem „Besuch“ der ihn besuchenden Brüder die Rede. Die deutsche Fassung vermeidet die schwerfällige Wiederholung, ohne das Motiv ihres Kommens aufzugeben.
    reason: Kennzeichnung einer stilistisch geglätteten Wiederholungsfigur.
  - marker: c
    text: Die Auslassungspunkte in eckigen Klammern markieren jeweils eine Lücke oder Beschädigung im zugrunde gelegten Textzeugen. Die spitzen Klammern um ⟨er⟩ kennzeichnen eine editorische Ergänzung.
    reason: Bewahrung und Erläuterung der überlieferten Unsicherheit.
lexical_decisions:
- source_word: Word
  choice: Logos
  rationale: Der griechisch geprägte Fachbegriff hält die personale, männlich pronominalisierte Gestalt erkennbar und vermeidet die im Deutschen bei „das Wort“ entstehende Verschiebung zu einem unpersönlichen Neutrum.
- source_word: deficient
  choice: mit einem Mangel behaftet
  rationale: Die Formulierung bewahrt den Gedanken eines bestehenden Mangels, ohne ihn vorschnell als moralische Schlechtigkeit oder bloße Unvollkommenheit auszulegen.
- source_word: Fullness
  choice: Fülle
  rationale: „Fülle“ ist verständlich und wahrt zugleich den wahrscheinlich technischen Charakter des Begriffs im valentinianischen Zusammenhang.
- source_word: Repose
  choice: Ruhe
  rationale: Die Großschreibung markiert den begrifflich-hypostatischen Gebrauch, ohne eine weitergehende dogmatische Bestimmung einzutragen.
- source_word: Greatness
  choice: Größe
  rationale: Die wörtliche Wiedergabe und Großschreibung erhalten den möglichen Eigennamencharakter.
- source_word: He Who Is
  choice: Der, der ist
  rationale: Die Wendung bewahrt die substantivische Gottesbezeichnung und ihren Anklang an Seinsaussagen, ohne sie mit einem traditionellen Gottesnamen gleichzusetzen.
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte religionsgeschichtliche Fachbegriff ist hier genauer als „Zeitalter“, da offenbar personale oder kosmische Größen gemeint sind.
- source_word: Totalities
  choice: Gesamtheiten
  rationale: Die ungewohnte Pluralform bewahrt den technischen und kollektiven Sinn, ohne ihn zu „das All“ zu vereinheitlichen.
- source_word: vision
  choice: Schau
  rationale: „Schau“ bezeichnet hier ein betrachtendes Erkennen und passt besser als das alltagssprachliche, zukunftsbezogene „Vision“.
theological_decisions:
- issue: Personalität und Geschlecht des Logos
  choice: Maskulines „Logos“ mit „er“
  alternative: Neutrales „Wort“ mit „es“
  rationale: Der Zeuge behandelt die Figur durchgehend personal und maskulin. „Logos“ erhält diese Textgestalt im Deutschen, ohne eine zusätzliche christologische Identifikation auszusprechen.
- issue: Verhältnis der hervorgebrachten Abbilder zu ihren Vorbildern
  choice: Schönheitsähnlichkeit und mangelnde Ebenbürtigkeit bleiben nebeneinander stehen
  alternative: Die Abbilder ausdrücklich als ontologisch minderwertig erklären
  rationale: Der Text unterscheidet Schönheit und Wahrheit, erläutert die genaue Ontologie aber nicht vollständig; diese Spannung wird nicht systematisiert.
- issue: Unklare Gruppenbezeichnungen „likeness“ und „memory“
  choice: „die der Ähnlichkeit/Erinnerung angehören“
  alternative: Benennung als fest definierte kosmische Klassen
  rationale: Die Zugehörigkeitsform wahrt den technischen Klang, ohne den Gruppen eine nicht belegte dogmatische Identität zuzuschreiben.
- issue: Unbestimmter Bezug von „it“ im letzten Absatz
  choice: Unpersönliches „Es wird ihm offenbart“
  alternative: Ein bestimmtes Bezugswort wie „die Vollkommenheit“ oder „der Vater“ einsetzen
  rationale: Da das Bezugswort im überlieferten Wortlaut nicht eindeutig ist, bleibt die Referenz auch auf Deutsch offen.
- issue: Heilsplan
  choice: „Heilsplan“ ohne nähere konfessionelle Deutung
  alternative: „Erlösungsordnung“ oder eine soteriologische Systematisierung
  rationale: Die Übersetzung gibt den Zweckbegriff verständlich wieder, ohne einen späteren Lehrrahmen einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit moderatem Fachwortanteil. Technische kosmologische Begriffe werden beibehalten, aber syntaktisch möglichst verständlich eingebettet. Unklare Bezüge und begriffliche Spannungen bleiben sichtbar. Grundlage ist der bereitgestellte gemeinfreie englische Zeuge; eine direkte Prüfung des koptischen Textes von Nag Hammadi Codex I,5 steht noch aus.
