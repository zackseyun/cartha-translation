    issue: Singularischer Rückbezug bei der Schönheitsähnlichkeit
    rationale: „Sie sind ... aus Lebendigem hervorgegangen und ihm an Schönheit gleichen“ lässt „ihm“ auf das singularische „Lebendige“ zurückgehen. Der Zeuge sagt jedoch, dass die lebendigen Abbilder den pluralischen „living figures/things“ an Schönheit gleichen. „ihnen“ bewahrt diesen Bezug.
