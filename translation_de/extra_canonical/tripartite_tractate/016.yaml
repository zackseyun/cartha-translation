  source_fidelity: 'Eine unmittelbare Kontrolle am koptischen Text steht nach den Angaben noch aus; daher erfolgt die Prüfung nur am bereitgestellten englischen Zeugen. Die Fassung folgt dessen Satzfolge, Fachterminologie, Pronomenführung und markierten Textlücken insgesamt sehr eng. Eine eindeutige Bezugsverschiebung liegt bei der Schönheitsähnlichkeit der Abbilder vor: Ihr Vorbild sind die pluralischen „lebendigen Gestalten/Dinge“, nicht das singularische „Lebendige“.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch und bewahrt die bewusst sperrige technische Terminologie. Die Korrektur von „ihm“ zu „ihnen“ stellt sowohl die Grammatik als auch den Sinnbezug klar, ohne eine Auslegung hinzuzufügen.
  terminology: „Logos“, „Fülle“, „Ruhe“, „Größe“, „Äonen“, „Gesamtheiten“ und „Schau“ sind konsistent und als vorsichtige Fachtermini angemessen. Die eckige Lückenmarkierung und die editorische Ergänzung in spitzen Klammern sind korrekt erhalten.
  issues:
