  footnotes:
  - marker: a
    text: Eckige Klammern und Auslassungspunkte kennzeichnen Lücken oder unsichere Ergänzungen im überlieferten beziehungsweise zugrunde gelegten Text; spitze Klammern kennzeichnen ergänzte Wörter. Die direkte Prüfung des koptischen Textes steht noch aus.
    reason: Die vorliegende Fassung beruht auf dem angegebenen englischen gemeinfreien Übersetzungszeugen und muss dessen textkritische Signale transparent bewahren.
  - marker: b
    text: „Paraklet“ kann je nach Zusammenhang „Beistand“, „Fürsprecher“ oder „Tröster“ bedeuten.
    reason: Eine Fußnote bewahrt die Bedeutungsbreite des Fachbegriffs, ohne im Haupttext eine einzelne Deutung festzulegen.
lexical_decisions:
- source_word: aeons
  choice: Äonen
  rationale: Der im spätantiken gnostischen Kontext etablierte deutsche Fachbegriff wahrt den kosmologischen Charakter, ohne ihn durch eine bloße Zeitangabe aufzulösen.
- source_word: Totality / Totalities
  choice: Gesamtheit / Gesamtheiten
  rationale: Die Unterscheidung von Singular und Plural wird beibehalten; die ungewöhnliche Pluralbildung spiegelt die technische und teilweise rätselhafte Begrifflichkeit des Zeugnisses.
- source_word: Fullness
  choice: Fülle
  rationale: „Fülle“ ist die natürliche deutsche Entsprechung und bewahrt zugleich den fachsprachlichen Anklang des pleromatischen Begriffs.
- source_word: deficient one
  choice: der Mangelhafte
  rationale: Die substantivierte Bezeichnung erhält die personale und zugleich zustandsbezogene Offenheit des Ausgangszeugnisses.
- source_word: Paraclete
  choice: Paraklet
  rationale: Der Fremdbegriff bleibt stehen, damit seine mögliche Bedeutungsbreite als Beistand, Fürsprecher oder Tröster nicht auf eine einzige Funktion verengt wird.
- source_word: the Appointed Ones
  choice: die Bestimmten
  rationale: Die Wiedergabe vermeidet eine konfessionell vorgeprägte Gleichsetzung mit „Erwählten“ und bewahrt den Sinn einer Zuweisung oder Bestimmung.
- source_word: universal plan of salvation
  choice: allumfassender Heilsplan
  rationale: Die Formulierung gibt sowohl die umfassende Reichweite als auch den soteriologischen Zweck wieder, ohne eine spätere dogmatische Systematik einzutragen.
theological_decisions:
- issue: Das Hervorgehen des Sohnes aus der Harmonie der Äonen
  choice: Die ungewöhnliche Zeugungs- und Hervorbringungssprache wird wörtlich erkennbar belassen.
  alternative: Den Sohn ausschließlich als unmittelbar vom Vater gezeugt darstellen.
  rationale: Der Abschnitt verbindet Vater, Äonen, Harmonie und Frucht in theologischer Spannung; eine Harmonisierung mit späteren Lehrformeln würde die Eigenart des Textes verdecken.
- issue: Mehrdeutiger Bezug in „whom he desired that they know“
  choice: „den sie nach seinem Willen erkennen sollten“
  alternative: „den der Sohn wollte, dass sie erkennen“ oder „den der Vater wollte, dass sie erkennen“
  rationale: Die deutsche Form wahrt soweit möglich die Unbestimmtheit darüber, auf wen sich das handelnde Pronomen bezieht.
- issue: Vollkommenheit des Mangelhaften und Stärkung der Vollkommenen
  choice: Beide Aussagen bleiben ohne systematische Erklärung nebeneinander stehen.
  alternative: „Vollkommene“ als nur teilweise vollkommen erklären.
  rationale: Die Spannung gehört zur Aussage des Textes und soll nicht durch eine interpretierende Zusatzannahme beseitigt werden.
- issue: Erschaffung des in Vater und Gesamtheiten bewohnten Wesens
  choice: „<wurde> … erschaffen“ wird samt Ergänzungszeichen beibehalten.
  alternative: „existierte“ oder „wurde gezeugt“
  rationale: Das Zeugnis bietet hier Schöpfungssprache; eine dogmatisch motivierte Abschwächung wäre nicht quellengerecht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener spätantiker Fachsprache. Lange Perioden wurden behutsam gegliedert, ohne die argumentativen Bezüge zu vereinfachen. Unklare Bezüge, Wiederholungen und theologische Spannungen wurden nicht stillschweigend harmonisiert. Die Übersetzung ist wegen der noch ausstehenden direkten koptischen Quellenprüfung als quellennahe vorläufige Publikationsfassung zu behandeln.
