  text: 'The fall experienced by the aeons of the Father of the Totalities happened only as if it were their own experience, planned by the Father with care, generosity, and great kindness. [] […] the Totality, to teach them about [the deficiency] through the one [from whom alone they] all received power to remove deficiencies.


    His own [order came] into being from <him> who hastened on high, from what produced itself from him, and from complete perfection. The one who hastened on high became an intercessor for the deficient one, together with the emanation of the aeons that had come into being in agreement with the things that exist. When he prayed to them, because they were united, they joyfully and eagerly agreed, in harmonious accord, to help the deficient one. They assembled and pleaded with the Father of generous intention that help would come from the Father above, for his glory, because there was no other way for the deficient one to become perfect except by the will of the Fullness of the Father. He had moved it toward himself, revealing and bestowing <it> on the deficient one.


    From the harmony that had come into being through their joyful inclination, they produced the fruit as an offspring of that harmony, a unity possessed by the Totalities, revealing the face of the Father. The aeons thought about the Father as they glorified him and prayed for help for their brother, asking that the Father would join with them. In this way, they eagerly and joyfully produced the fruit. He then revealed the manifestation of the agreement arising from their mutual union, who is his beloved Son. [] The Son in whom the Totalities are well pleased clothed them with himself as with a garment, imparting perfection to the deficient one and giving strength to the perfect ones. Strictly speaking, he is called “Savior,” “Redeemer,” “the Well-Pleasing One,” “the Beloved,” “the Paraclete,” “the Christ,” and “the Light for the Appointed Ones.” He is congruent with those who produced him because he became the names of the places granted to him. But what other name can be given to him
    except “the Son”? As we said before, this is because he is the knowledge of the Father, whom he desired that they know.


    The aeons generated both the face of the Father whom they glorify, as we wrote earlier, and their own face, because the aeons who glorify generated <his> appearance and their own face. They were formed as his army, like the army of a king, because the beings from the thought possess a powerful unity and a harmony blended together. They were produced in a complex form so that the one who would receive help could behold those for whom he had interceded. He also beholds the one who bestowed it on him. The fruit of the agreement with him that we mentioned earlier is subordinate to the power of the Totalities, because the Father was able to place the Totalities within him: those who existed beforehand, those who are, and those who will be. [] He revealed those whom the Father had placed within him, not giving them away but entrusting them to him. He carried out the universal plan of salvation with the authority granted to him from the beginning and with the power needed for the work. In this
    way, he began to accomplish his revelation.


    The one in whom the Father dwells and in whom the Totalities dwell <was> created before the one who is without sight. He taught him about those who sought their sight through the radiance of the perfect light. First, he perfected him in unspeakable joy. He perfected him for his own sake as a perfect one, and he also bestowed on him what is appropriate for each individual. This is the nature of the first joy.'
translation:
  language: de
  text: 'Der Fall, den die Äonen des Vaters der Gesamtheiten erlebten, geschah nur so, als wäre er ihre eigene Erfahrung; der Vater hatte ihn mit Umsicht, Güte und großer Freundlichkeit geplant. [] […] die Gesamtheit[a], um sie durch den Einen, [von dem allein sie] alle die Kraft empfingen, die Mängel zu beseitigen, über [den Mangel] zu belehren.


    Seine eigene [Ordnung entstand] aus <dem>, der nach oben eilte, aus dem, was sich aus ihm selbst hervorbrachte, und aus der vollkommenen Vollendung. Der nach oben Eilende wurde zusammen mit der Ausströmung der Äonen, die in Übereinstimmung mit dem Seienden entstanden war, zum Fürsprecher für den Mangelhaften. Als er zu ihnen betete, stimmten sie, weil sie eins waren, freudig und bereitwillig in harmonischer Eintracht zu, dem Mangelhaften zu helfen. Sie versammelten sich und baten den Vater mit der gütigen Absicht, dass vom Vater droben Hilfe zu seiner Verherrlichung kommen möge. Denn der Mangelhafte konnte auf keine andere Weise vollkommen werden als durch den Willen der Fülle des Vaters. Diese hatte er zu sich hingezogen, offenbarte sie und schenkte <sie> dem Mangelhaften.


    Aus der Harmonie, die durch ihre freudige Hinwendung entstanden war, brachten sie als Zeugung aus dieser Harmonie die Frucht hervor: eine Einheit, welche die Gesamtheiten besaßen und die das Angesicht des Vaters offenbarte. An den Vater dachten die Äonen, während sie ihn verherrlichten und um Hilfe für ihren Bruder beteten; dabei baten sie darum, dass der Vater sich mit ihnen verbinde. So brachten sie bereitwillig und freudig die Frucht hervor. Darauf offenbarte er die sichtbare Gestalt der Übereinstimmung, die aus ihrer gegenseitigen Vereinigung hervorgegangen war: seinen geliebten Sohn. [] Der Sohn, an dem die Gesamtheiten Wohlgefallen haben, bekleidete sie mit sich selbst wie mit einem Gewand. Er verlieh dem Mangelhaften Vollkommenheit und gab den Vollkommenen Kraft. Genau genommen wird er „Retter“, „Erlöser“, „der Wohlgefällige“, „der Geliebte“, „der Paraklet“[b], „der Christus“ und „das Licht für die Bestimmten“ genannt. Er entspricht denen, die ihn hervorgebracht hatten, denn er
    wurde zu den Namen der Orte, die ihm zugeteilt worden waren. Doch welcher andere Name könnte ihm gegeben werden als „der Sohn“? Denn er ist, wie wir schon sagten, die Erkenntnis des Vaters, den sie nach seinem Willen erkennen sollten.


    Die Äonen brachten sowohl das Angesicht des Vaters hervor, den sie verherrlichen, wie wir zuvor geschrieben haben, als auch ihr eigenes Angesicht. Denn die Äonen, die verherrlichen, brachten <seine> Erscheinung und ihr Angesicht hervor. Sie wurden zu seinem Heer gemacht, wie zum Heer eines Königs; denn die Wesen aus dem Gedanken besitzen eine machtvolle Eintracht und eine ineinandergefügte Harmonie. Sie wurden in einer vielgestaltigen Form hervorgebracht, damit derjenige, dem geholfen werden sollte, jene sehen konnte, für die er Fürsprache eingelegt hatte. Auch sieht er denjenigen, der sie ihm schenkte. Die Frucht der Übereinstimmung mit ihm, die wir zuvor erwähnt haben, ist der Macht der Gesamtheiten untergeordnet. Denn der Vater konnte die Gesamtheiten in ihn hineinlegen: die, welche zuvor da waren, die, welche sind, und die, welche sein werden. [] Er offenbarte diejenigen, die der Vater in ihn hineingelegt hatte; er gab sie nicht weg, sondern vertraute sie ihm an. Mit der ihm von
    Anfang an verliehenen Vollmacht und mit der Kraft für das Werk führte er den allumfassenden Heilsplan aus. So begann er, seine Offenbarung zu verwirklichen.


    Derjenige, in dem der Vater wohnt und in dem die Gesamtheiten wohnen, <wurde> vor dem erschaffen, der ohne Sehvermögen ist. Er belehrte ihn über diejenigen, die durch den Glanz des vollkommenen Lichts ihr Sehvermögen suchten. Zuerst vollendete er ihn in unaussprechlicher Freude. Er vollendete ihn um seiner selbst willen als einen Vollkommenen und schenkte ihm auch das, was jedem Einzelnen angemessen ist. Darin besteht das Wesen der ersten Freude.'
