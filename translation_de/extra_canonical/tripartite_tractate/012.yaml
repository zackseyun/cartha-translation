translation:
  language: de
  text: '**Die Bekehrung, die »Umkehr« genannt wird**[a]


    Doch er war ein <Helfer> und Erlöser von ihrer Auffassung und ihrer Auflehnung; denn von ihm [geht] die Bekehrung aus, die »Umkehr« genannt wird.[b] Sie geschah, [als] das Wort seine Auffassung und seinen Gedanken [änderte]. Es wandte sich vom Bösen ab und dem Guten zu. Nach der Bekehrung erinnerte es sich an die Seienden und an das Gebet für den, der sich durch das Gute selbst bekehrt hatte. Zuerst betete es zu dem, der in der Fülle wohnt, und erinnerte sich an ihn; dann an seine Geschwister – an jedes einzeln und zugleich an alle gemeinsam –, vor ihnen allen aber an den Vater.


    […] Das gemeinsame Gebet half ihm bei seiner eigenen Rückkehr <zu> sich selbst und zum All. Denn es erinnerte sich deshalb an jene, die von Anfang an bestanden hatten, weil man sich seiner selbst erinnert hatte. Dies war der ferne Gedanke, der aus der Ferne ruft und es zurückkehren lässt.[c]


    Sein ganzes Gebet und Erinnern umfasste mehrere Kräfte, die mit der zuvor erwähnten Grenze übereinstimmten; denn nichts in seinem Gedanken ist unfruchtbar. Die Kräfte waren gut und größer als die Kräfte des Abbildes, denn diese gehören ebenfalls zu einer [dunklen] Natur. Was sie geworden waren, ging aus einer Täuschung hervor, die mit Ähnlichkeit und einem [nichtigen Gedanken] des Hochmuts verbunden war; und sie gingen aus [einem Gedanken] hervor, der sie zuerst erkannt hatte. Wie sind die ersteren Wesen beschaffen? Sie gleichen dem <Vergessen> und tiefem Schlaf. Sie ähneln Menschen, die beunruhigende Träume haben und im Traum von <jemandem> verfolgt und bedrängt werden. Für ihn gleichen die anderen dagegen lichtvollen Wesen, die den Sonnenaufgang erwarten; denn sie erblickten in ihm Träume, die wahrhaft süß sind.[d]


    Sogleich […] <hörten> die Ausströmungen des Gedankens auf. Sie hatten keinen Bestand und keine Ehre mehr, [denn] <sie> sind denen, die schon vorher bestanden, nicht ebenbürtig. Wenn sie den Abbildern überlegen waren, so wurden sie nur deshalb über diese erhoben, weil sie aus guter Absicht handelten. Denn sie waren nicht aus der entstandenen Schwäche hervorgegangen. Die gute Absicht gehörte <dem, der> nach dem suchte, der schon vorher bestand, nachdem er gebetet und sich zum Guten erhoben hatte. Er säte in sie den Drang, den schon vorher bestehenden Herrlichen zu suchen und zu ihm zu beten. Er säte in sie auch die Fähigkeit, an [ihn] zu denken und zu erkennen, dass etwas, das größer war als sie selbst, schon vor ihnen bestanden hatte, obwohl sie nicht wussten, was es war. Indem jener Gedanke Eintracht und gegenseitige Liebe hervorbrachte, handelten sie in Einheit und Einmütigkeit; denn aus Einheit und Einmütigkeit hatten sie ihr Dasein empfangen.[e]


    [a] Die Überschrift folgt der zentralen Formulierung des Abschnitts. Die Übersetzung ist vorläufig, da für diesen Entwurf nur der angegebene englische gemeinfreie Textzeuge zur Verfügung stand und die Prüfung am koptischen Text noch aussteht.


    [b] »Umkehr« gibt den hier als »repentance« bezeichneten Vorgang wieder. Gemeint ist im unmittelbaren Zusammenhang eine Wendung des Wortes vom Bösen zum Guten; der Text verbindet damit jedoch auch Erinnerung, Gebet und Rückkehr. Spitze Klammern kennzeichnen editorisch ergänzten beziehungsweise wiederhergestellten Wortlaut, eckige Klammern unsicheren oder ergänzten Wortlaut; […] bezeichnet eine Lücke.


    [c] Die wechselnden Bezüge der Fürwörter sind im überlieferten Wortlaut nicht überall eindeutig. Die Übersetzung legt daher nicht durch zusätzliche Eigennamen fest, ob jeweils das Wort, der sich Bekehrende oder der Gedanke gemeint ist.


    [d] »Abbild« bezeichnet hier eine im Text vorausgesetzte Gruppe oder Seinsweise. Die Gegenüberstellung von »den ersteren Wesen« und »den anderen« bleibt sprachlich offen, weil ihre genaue Zuordnung im vorliegenden Textzeugen unsicher ist.


    [e] »Der schon vorher bestehende Herrliche« bewahrt die substantivische Ausdrucksweise des Textzeugen. Sie bezeichnet ein vor diesen Kräften bestehendes höheres Gegenüber, ohne dessen Identität über den Wortlaut hinaus festzulegen.'
