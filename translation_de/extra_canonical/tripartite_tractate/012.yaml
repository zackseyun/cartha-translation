lexical_decisions:
- source_word: conversion / repentance
  choice: Bekehrung / Umkehr
  rationale: Die zwei Ausdrücke bewahren die Benennung eines Vorgangs als »repentance« und vermeiden eine ausschließlich moralische Verengung; der Kontext beschreibt eine Wendung, Erinnerung und Rückkehr.
- source_word: the Word
  choice: das Wort
  rationale: Die wörtliche und traditionsoffene Wiedergabe vermeidet, den Begriff stillschweigend als Eigennamen »Logos« auszulegen.
- source_word: Fullness
  choice: Fülle
  rationale: »Fülle« ist verständlich und wahrt zugleich den kosmologisch-technischen Charakter des Ausdrucks.
- source_word: Totality
  choice: das All
  rationale: »Das All« ist im Deutschen natürlicher als »die Totalität« und bezeichnet dennoch die umfassende Gesamtheit, ohne sie näher zu definieren.
- source_word: likeness
  choice: Abbild
  rationale: »Abbild« gibt eine abgeleitete Ähnlichkeit oder Seinsform wieder; die mögliche kollektive beziehungsweise kosmologische Fachbedeutung wird nicht aufgelöst.
- source_word: powers
  choice: Kräfte
  rationale: Die Wiedergabe lässt offen, ob personale Mächte, Fähigkeiten oder hervorgebrachte Wirkkräfte gemeint sind.
- source_word: pre-existent
  choice: der schon vorher Bestehende / die schon vorher bestanden
  rationale: Die umschreibende Form ist in modernem Deutsch verständlich und bewahrt den zeitlich-ontologischen Anspruch, ohne den Ausdruck mit einer bestimmten theologischen Identität gleichzusetzen.
- source_word: emanations
  choice: Ausströmungen
  rationale: Der Ausdruck erhält das Bild des Hervorgehens aus dem Gedanken und vermeidet eine unnötig eingedeutschte dogmatische Terminologie.
theological_decisions:
- issue: Identität des sich bekehrenden Subjekts
  choice: Fürwörter und »das Wort« gemäß dem vorliegenden Textzeugen beibehalten
  alternative: Alle Fürwörter ausdrücklich auf den Logos oder eine bestimmte kosmologische Gestalt beziehen
  rationale: Der Textzeugenwortlaut lässt die Bezüge stellenweise schwanken; eine eindeutige Identifizierung würde die theologische Spannung unzulässig auflösen.
- issue: Bedeutung von Umkehr
  choice: Als Wendung vom Bösen zum Guten mit Erinnerung, Gebet und Rückkehr darstellen
  alternative: Als ausschließlich menschliche Buße oder als fest definierte Heilslehre wiedergeben
  rationale: Der Abschnitt gebraucht den Begriff in einer kosmologischen Erzählung und gibt selbst mehrere Aspekte des Vorgangs an.
- issue: Der Präexistente beziehungsweise Herrliche
  choice: Unbestimmt als höheres, vorher bestehendes Gegenüber belassen
  alternative: Mit dem Vater, dem Bewohner der Fülle oder einer anderen Gestalt ausdrücklich gleichsetzen
  rationale: Eine solche Gleichsetzung wird in diesem Abschnitt nicht zweifelsfrei ausgesprochen.
- issue: Status der Kräfte und Abbilder
  choice: Ihre abgestufte Güte und Herkunft wiedergeben, ohne ein späteres Lehrsystem einzutragen
  alternative: Sie als fest benannte Engel-, Äonen- oder Dämonenklassen identifizieren
  rationale: Der vorliegende Wortlaut nennt Kräfte, Abbilder, dunkle Natur und gute Absicht, liefert aber keine hinreichende Grundlage für konfessionelle oder systematische Etiketten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit lesbaren Satzperioden. Kosmologische Schlüsselbegriffe bleiben wiedererkennbar, ohne unnötig fremdsprachlich zu wirken. Die ungewöhnliche Logik des Textes, unklare Fürwortbezüge sowie editorische Ergänzungen und Lücken werden nicht geglättet. Grundlage ist mangels abgeschlossener koptischer Prüfung der bereitgestellte englische gemeinfreie Textzeuge; daher sind besonders unsichere Stellen bewusst zurückhaltend formuliert.
