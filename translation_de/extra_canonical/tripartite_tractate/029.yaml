translation:
  language: de
  text: 'Obwohl wir über die Erwählung noch vieles mehr sagen könnten und es angemessen wäre, davon zu sprechen, müssen wir dennoch ausführlicher von denen der Berufung reden, die »die von der Rechten« genannt werden; denn es wäre nicht gut, sie zu übergehen. Wir haben früher schon ausführlich von ihnen gesprochen, als wäre das genug gewesen. Warum also haben wir nur teilweise von ihnen gesprochen?[a]


    Ich sagte: Alle, die aus dem Wort hervorgegangen sind – sei es aus dem Gericht über die Bösen, aus dem Zorn, der gegen sie kämpft, aus der Abkehr von ihnen, das heißt der Rückkehr zu den Erhabenen, aus dem Gebet und der Erinnerung an die Präexistenten oder aus der Hoffnung und dem Glauben, ihre Rettung könne durch gute Werke ‹erlangt werden› –, sie alle sind für würdig erachtet worden. Denn sie stammen aus den guten Neigungen, und die Ursache ihrer Entstehung ist ein Gedanke dessen, der ist.


    Ferner sagte ich: Bevor das Wort sich freiwillig auf unsichtbare Weise mit ihnen verband, schenkte ihnen der Erhabene den zuvor erwähnten Gedanken, weil sie ‹auf ihn achteten›. […] Dieser Gedanke wurde zur Ursache ihres Daseins. Als ‹sie› gerettet wurden, erhoben sie sich nicht überheblich, als hätte vor ihnen nichts bestanden. Vielmehr bekannten sie, dass ihr Dasein einen Ursprung hatte und dass sie den erkennen wollten, der vor ihnen da war.


    Ferner sagte ich, dass sie sich bei der Offenbarung des Lichtes, das wie ein Blitz erschien, niederwarfen und bezeugten, es sei zu ihrer Rettung erschienen.


    Ich sagte: Nicht nur diejenigen, die aus dem Wort hervorgegangen sind, werden das Gute empfangen. Auch diejenigen, die sie den guten Neigungen entsprechend hervorgebracht haben, werden wegen des Reichtums der Gabe die Ruhe genießen. Selbst diejenigen, die aus dem Verlangen nach Herrschaft hervorgebracht wurden und in denen der Same der Herrschsucht liegt, werden den Lohn guter Werke empfangen – sofern sie mit denen von guter Neigung zusammengewirkt haben und bewusst die leere Liebe zu vergänglichem Ruhm aufgeben wollen, um das Gebot des Herrn […] der Herrlichkeit zu halten. Statt einer flüchtigen, armseligen Ehre werden sie das ewige Reich erben.


    Wir mussten auf unsere frühere Darlegung zurückkommen. Um nun aber eine zusammenhängende Begründung zu geben, müssen wir Ursachen und Wirkungen sowie die ‹Belege› dafür miteinander in Beziehung setzen, ob diejenigen von der Rechten – seien sie unvermischt oder vermischt – die Gabe der Rettung und der Ruhe empfangen können. Darum müssen wir dies in einer überzeugenden Erörterung anhand der Gestalt ihres Glaubens darlegen.


    Wenn wir uns zum Reich in Christus bekennen, beseitigen ‹wir› die ganze Vielfalt der Gestalten, der Ungleichheit und der Veränderung. Denn am Ende wird wieder Einheit sein, wie am Anfang Einheit war: ein Ort ohne männlich oder weiblich, ohne Sklaven oder Freie, ohne Beschneidung oder Unbeschnittenheit, ohne Engel oder Menschen; vielmehr ist Christus alles in allem. Wie kann derjenige, der am Anfang nicht existierte, im Dasein vorgefunden werden? Und ‹welcher Art ist› derjenige, der kein Sklave war, da er doch zusammen mit […] einem Freien einen Platz einnehmen wird? Sie werden sogar eine unmittelbare Schau empfangen und nicht darauf angewiesen sein, allein aufgrund eines kurzen Wortes aus einer Stimme zu glauben, dass es sich so verhält.


    Denn die Wiederherstellung dessen, was einst war, ist Einheit. Auch wenn einige aufgrund des Heilsplans erhöht werden, indem ihnen die Ursachen der bestehenden Dinge zugewiesen werden, sie eine Vielzahl natürlicher Kräfte in Bewegung setzen und sich an ihnen erfreuen – ob sie nun Engel oder Menschen sind –, werden sie zum Reich, zur Festigung und zur Rettung gelangen.


    Dies sind die Gründe: Diejenigen, die im Fleisch erschienen, glaubten unerschütterlich, dass er der Sohn des unbekannten Gottes ist, der von alters her unaussprechlich ist und den niemand sehen konnte. Sie sagten sich von ihren Göttern los, vor denen sie sich zuvor niedergeworfen hatten, und ebenso von den Herren im Himmel und auf der Erde. Noch bevor ‹er› aufgenommen worden war, ja, als er noch ein Kind war, bezeugten sie, dass er bereits verkündigte. Und als er als ‹ein› Toter im Grab lag, glaubten die Engel, dass er lebte; sie ‹empfingen sogar› Leben […] von dem, der gestorben war.


    Die vielen heiligen Dienste und Wunder, die sie in den Tempeln vollbracht hatten, verwandelten sich nun in die Verehrung eines anderen, nämlich Christi. Ihr Bekenntnis zu Christus gab ihnen die Kraft zu dieser Veränderung, indem es sie dazu drängte, sich ihm rasch zu nähern. Jene Vorbereitung hatten sie nur empfangen, damit sie sie später zugunsten dessen verwerfen würden, dem hier unten, in der Welt, keine ‹Ehre erwiesen› wurde. Doch dafür, dass sie die Götter verwarfen, ‹gewannen sie› Christus. Sie erkannten, dass er von dem ‹erhabenen› Ort stammte, von ‹dem› sie zusammen mit ihm gekommen waren – einem Ort göttlicher Herrschaft. Die Namen derer, die sie angebetet, umsorgt und denen sie gedient hatten, hatten sie nur leihweise empfangen; nun übertrugen sie diese Namen auf den, dem sie eigentlich zukommen.


    Doch erst nach seiner Aufnahme erkannten sie, dass er ihr Herr war, über dem kein Herr steht. Sie übertrugen ihm ihre Reiche, erhoben sich ‹von ihren› Thronen und legten ihre Kronen nieder. Er offenbarte sich ihnen jedoch aus den Gründen, die wir schon erörtert haben: zu ihrer Heilung und zu ihrer ‹Hinwendung zu› dem guten Gedanken über […] Gefährten und die Engel […] sowie wegen der Fülle des Guten, das sie dafür taten. So wurden ihnen die Dienste zugewiesen, die den Erwählten zugutekommen: Sie tragen deren Ungerechtigkeit zum Himmel, damit sie dort einer ewigen Prüfung durch ein unwiderlegbares und unfehlbares ‹Gericht› unterzogen wird. Sie wirken für sie weiter, bis alle in das irdische Leben eintreten und aus dem Leben scheiden, während ihre Körper ‹noch› auf der Erde verweilen. Sie dienen all ihren […] und machen ‹sich› zu Teilhabern an ihren Leiden, Verfolgungen und Gefahren, die über die Heiligen mehr als über andere kamen.


    Was die Diener des Bösen ‹betrifft›: Weil das Böse die Vernichtung verdient, ‹…› fest aufgrund der ‹Gemeinschaft›, die über allen Welten ist und die ihr guter Gedanke und ihre Verbundenheit ist.[b]


    Und die Kirche wird sich ihrer als wahrer Freunde und treuer Diener erinnern, sobald sie die Erlösung von dem empfangen hat, der ‹ihnen› den Lohn gibt: die Freude, die im Brautgemach herrscht, und das […, das] in ihrem Haus wohnt […] das im Gedanken wohnt […] und was es […] schuldet […] Christus, der bei ihr wohnt, ‹und› das erwartungsvolle Warten auf den Vater ‹des› Alls. Denn sie wird ihnen Engel zur Führung und zum Dienst bereitstellen.


    Die Äonen werden sich wohlgefällig an die Gedanken erinnern, die dem Dienst an der Kirche galten, ‹und› ihnen für all ihr Sinnen den Lohn geben. Dieser ist ein Hervorgang aus ihnen. Wie Christus ‹seinen› Willen ‹erfüllte›, der die erhabenen, großen ‹Güter› der Kirche hervorbrachte und ihr schenkte, ‹so› wird auch dieser Hervorgang für sie ein Gedanke sein und ihnen ihre Wohnstätten bereiten, in denen sie ewig wohnen werden. ‹Nachdem sie› die nach unten ziehende Kraft des Mangels abgewiesen haben, wird die Kraft der Fülle sie emportragen – durch die Größe der Freigebigkeit und durch die Lieblichkeit des präexistenten Äons.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung des koptischen Textes steht noch aus. ‹Spitze Klammern› kennzeichnen ergänzten beziehungsweise wiederhergestellten Wortlaut; […] kennzeichnet eine Lücke oder unleserlichen Text.
    reason: Die Überlieferungs- und Editionslage muss transparent sein, besonders weil der Abschnitt zahlreiche Ergänzungen und Lücken enthält.
  - marker: b
    text: Dieser Satz ist im überlieferten Text stark beschädigt; sein grammatischer Zusammenhang lässt sich nicht sicher rekonstruieren.
    reason: Die fragmentarische Passage darf nicht durch eine glatte, aber unbelegte Ergänzung verdeckt werden.
lexical_decisions:
- source_word: Election
  choice: Erwählung
  rationale: Bewahrt den theologischen Fachbegriff und unterscheidet ihn klar von der folgenden »Berufung«.
- source_word: Calling
  choice: Berufung
  rationale: Gibt die bezeichnete Gruppe in natürlichem, zugleich traditionsfähigem Deutsch wieder, ohne sie mit der Erwählung gleichzusetzen.
- source_word: Word
  choice: das Wort
  rationale: Behält den personhaft-kosmologischen Titel bei, ohne ihn erklärend mit »Logos« zu ersetzen.
- source_word: those of the right
  choice: die von der Rechten
  rationale: Bewahrt die räumliche und gruppenbezogene Bildsprache des Zeugnisses, statt sie als »Gerechte« auszulegen.
- source_word: repose
  choice: Ruhe
