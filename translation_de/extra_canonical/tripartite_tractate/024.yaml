review_pass:
  verdict: revise
  source_fidelity: 'Die Überarbeitung folgt dem vorliegenden englischen Übersetzungszeugnis eng und bewahrt dessen textkritische Markierungen sowie syntaktische und referenzielle Mehrdeutigkeiten. Eine unmittelbare Prüfung am koptischen Text ist nach den vorliegenden Angaben weiterhin nicht möglich. Eine sichere Korrektur ist die durchgehende Unterscheidung von „Fleisch“ und „Körper“: Das Zeugnis verwendet hierfür unterschiedliche Ausdrücke („flesh“ bzw. „body“), während der Entwurf sie teilweise durch „Leib“ nivelliert. Ferner wird „begotten“ genauer als „gezeugt“ wiedergegeben.'
  naturalness: Der Text bleibt in modernem Standarddeutsch lesbar, wahrt jedoch bewusst den anspruchsvollen spekulativ-theologischen Registercharakter. „Muster“ ist hier gegenüber „Urbild“ vorzuziehen, weil es „pattern“ ohne zusätzliche archetypische Festlegung wiedergibt.
  terminology: „Retter“, „Heilsplan“, „Wort“, „Gesamtheit“, „Leidensunfähigkeit“, „Pflanzung“ und „Erlösung“ sind angemessen. Die Unterscheidung Fleisch/Körper wird nun konsequent beibehalten. „Muster“ ersetzt das stärker interpretierende „Urbild“.
  issues:
  - severity: medium
    issue: Die Begriffe „body“ und „flesh“ werden im Entwurf teilweise beide mit „Leib“ wiedergegeben.
    rationale: Das Übersetzungszeugnis unterscheidet „flesh and soul“ von „body and soul“. „Fleisch“ und „Körper“ erhalten diese terminologische Spannung besser.
  - severity: low
    issue: „He was begotten into physical life“ ist mit „hineingeboren“ weniger genau wiedergegeben.
    rationale: „Gezeugt“ bewahrt den Wortlaut von „begotten“, ohne die schwierige Aussage zu harmonisieren.
  - severity: low
    issue: „Urbild“ für „pattern“ fügt eine mögliche archetypische Deutung hinzu.
    rationale: „Muster“ ist semantisch näher und lässt die technische Bedeutung offen.
  revised_text: '**Die Menschwerdung**



    Aus einer Neigung zum Erbarmen wurde unser Retter denen gleich, um derentwillen er erschien: Durch eine triebhafte Leidenschaft waren sie zu Fleisch und Seele geworden, die fortwährend über sie herrschen, sodass sie zugrunde gehen und sterben. Doch jene, die [ins Dasein kamen] […] [als] unsichtbar und auf unsichtbare Weise, belehrte er auf unsichtbare Weise über sich selbst.[a] Er nahm nicht nur den Tod derer auf sich, die er retten wollte, sondern nahm auch ihre Niedrigkeit an, in die sie gefallen waren, als sie mit Körper und Seele [geboren] wurden. Denn er ließ sich dazu herab, als Kind mit Körper und Seele geboren zu werden. Er teilte auch alle übrigen Lebenslagen der Gefallenen, obwohl sie das Licht besaßen und er über sie erhaben war; denn er ließ sich dazu herab, ohne Sünde, Unreinheit und Verderbnis empfangen zu werden. Er wurde zum körperlichen Leben gezeugt, indem er im Leben wohnte. Denn es war bestimmt worden, dass beide gleichermaßen Körper und Seele werden sollten – aufgrund
    der Leidenschaft und der wechselnden Neigung, die vom Wort ausging, das sich zur Umkehr aufgerafft hatte.



    Im Blick auf den Heilsplan aber war er es, [der] die Folgen der zuvor erwähnten Dinge auf sich nahm: nämlich dessen, was aus der erleuchtenden Schau und dem gefestigten Denken des Wortes entstand, nachdem es zu sich selbst umgekehrt war und sich aufgerafft hatte. So verhielt es sich mit denen, die wie er Körper und Seele sowie Festigkeit, Beständigkeit und Weisheit annahmen. Es war im Voraus bestimmt worden, dass sie gemeinsam mit der ebenfalls im Voraus bestimmten Ankunft des Retters kommen sollten. Erst als der Retter den Entschluss gefasst hatte, kamen auch sie. So kamen sie und übertrafen in ihrem fleischlichen Hervorgehen bei Weitem jene, die aus dem Mangel hervorgebracht worden waren, […], denn auch sie erfuhren auf diese Weise ein körperliches Hervorgehen wie der Retter: durch die Offenbarung ihrer Vereinigung mit ihm.



    Sie sind von einer einzigen Substanz, nämlich der geistigen. Der Heilsplan jedoch ist vielfältig: Das eine ist dieses, das andere jenes. Einige gehen aus Leidenschaft und Trennung hervor und bedürfen der Heilung. Andere gehen aus dem Gebet hervor, das die Kranken heilt, und sind dazu bestimmt, die Gefallenen zu behandeln. Das sind die Apostel und die Verkündiger der Botschaft. Sie sind die Schüler des Retters und die Lehrer derer, die Unterweisung brauchen.



    Warum haben dann auch sie Anteil an denselben Leidenschaften wie jene, die aus Leidenschaft hervorgebracht wurden, wenn sie dem Heilsplan gemäß in einem Körper mit [dem] Retter hervorgebracht wurden, der an solchen Leidenschaften keinen Anteil hatte? Der Retter war das Bild einer einzigen Einheit, da er die Gesamtheit in körperlicher Gestalt war. Darum bewahrte er das Muster der Untrennbarkeit, aus der die Leidensunfähigkeit hervorgeht.[b] Sie dagegen sind Bilder jedes Einzelnen, der offenbart wurde. Deshalb nehmen sie die Trennung von ihrem Muster an, da sie Gestalt annahmen für die Pflanzung, die unterhalb des Himmels besteht und ebenfalls […] Anteil an dem Bösen hat, das an den Orten herrscht, zu denen sie gelangt ist. Denn der Wille hielt die Gesamtheit unter der Sünde gefangen, damit er der Gesamtheit durch den Willen Erbarmen schenken und sie gerettet werden könnten; denn der Eine, der einzig ist, wird erwählt, Leben zu geben, während alle Übrigen Rettung brauchen.



    Deshalb war er der Erste unter denen, die die Gnade empfingen, jene Gaben auszuteilen, welche von denen verkündet wurden, die er für würdig hielt, anderen zu predigen. Denn [der] Same der Verheißung Jesu Christi wurde eingesetzt; seiner Offenbarung und Vereinigung haben wir gedient. Die Verheißung machte die Unterweisung möglich, ja, die Rückkehr zu dem, was sie am Anfang gewesen waren. Sie besitzen einen Tropfen, der sie zur Rückkehr dorthin neigt. Das nennen sie »Erlösung«: die Befreiung aus der Gefangenschaft und das Erlangen der Freiheit.



    Die Gefangenschaft ist die Gefangenschaft derer, die der Unwissenheit versklavt waren. Freiheit dagegen ist die Erkenntnis der Wahrheit, die schon vor der Unwissenheit bestand und ewig herrscht, ohne Anfang und ohne Ende. Sie ist das Gute, ein Heilmittel für alles und die Befreiung von der versklavenden Natur. Diese ließ jene leiden, die aus einem niedrigen Gedanken der Leere hervorgebracht worden waren – der Natur der bösen Neigung […], durch den Gedanken, der sie zur Herrschsucht erniedrigt. Aus dem Reichtum der Gnade, die auf die Kinder blickte, empfingen sie den Schatz der Freiheit. Die Freiheit stürzt die Leidenschaft und vernichtet jene Dinge, die sie zuvor von sich gewiesen hatte, als das Wort sie von sich selbst trennte. Er bestimmte sie zur Vernichtung, bis [der] Heilsplan vollendet ist, und ließ sie weiterbestehen, weil auch sie für das im Voraus Bestimmte von Nutzen waren.[c]'
