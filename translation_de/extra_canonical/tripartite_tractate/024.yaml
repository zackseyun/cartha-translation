  footnotes:
  - marker: a
    text: Die eckigen Klammern und Auslassungspunkte kennzeichnen beschädigten oder unsicher ergänzten Text. Der Satzbau dieses Abschnitts ist im überlieferten Zeugnis stellenweise unklar.
    reason: Textkritische Transparenz bei einer lückenhaften Passage.
  - marker: b
    text: »Leidensunfähigkeit« bezeichnet hier das Freisein vom Erleiden der genannten Leidenschaften; der Begriff meint nicht einfach Gefühllosigkeit.
    reason: Ein philosophisch-theologischer Fachbegriff könnte im heutigen Deutsch missverstanden werden.
  - marker: c
    text: Diese Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Übersetzungszeugnis. Eine unmittelbare Prüfung am koptischen Text des Nag-Hammadi-Codex I,5 steht noch aus.
    reason: Die Quellenlage verlangt, den mittelbaren Charakter der Arbeitsgrundlage offenzulegen.
lexical_decisions:
- source_word: Savior
  choice: Retter
  rationale: Das natürliche und würdevolle deutsche Äquivalent; es bewahrt den soteriologischen Titel ohne konfessionelle Zusatzprägung.
- source_word: flesh and soul
  choice: Fleisch und Seele / Leib und Seele
  rationale: Wo der ontologische Zustand bezeichnet wird, bleibt »Fleisch und Seele« stehen; in Aussagen über Geburt und Verkörperung ist »Leib und Seele« im Deutschen natürlicher. Die begriffliche Spannung des Zeugnisses bleibt erhalten.
- source_word: plan of salvation
  choice: Heilsplan
  rationale: Knappes, allgemein verständliches Äquivalent, das die geordnete heilsgeschichtliche Absicht ausdrückt.
- source_word: Word
  choice: Wort
  rationale: Bewahrt die erkennbare Logos-Terminologie, ohne sie durch eine interpretierende Paraphrase aufzulösen.
- source_word: Totality
  choice: Gesamtheit
  rationale: Gibt den kosmologisch-technischen Sinn wieder, ohne das stärker traditionsgebundene Fremdwort »Pleroma« einzuführen.
- source_word: impassability
  choice: Leidensunfähigkeit
  rationale: Bewahrt den philosophisch-theologischen Fachbegriff und vermeidet die irreführende Wiedergabe als bloße Gefühllosigkeit.
- source_word: planting
  choice: Pflanzung
  rationale: Die ungewöhnliche Bildsprache wird formal bewahrt, da eine Auflösung als »Nachkommenschaft« oder »Gemeinschaft« eine unsichere Deutung festlegen würde.
- source_word: redemption
  choice: Erlösung
  rationale: Entspricht der anschließenden Definition als Befreiung aus Gefangenschaft und Erlangung von Freiheit.
- source_word: lust for control
  choice: Herrschsucht
  rationale: Natürliches modernes Deutsch für ein erniedrigendes Verlangen nach Herrschaft oder Kontrolle.
theological_decisions:
- issue: Art und Umfang der Menschwerdung
  choice: Der Retter wird den Menschen gleich und nimmt Fleisch beziehungsweise Leib und Seele sowie Tod und Niedrigkeit an.
  alternative: Eine abschwächende Wiedergabe als bloßer Anschein menschlicher Existenz.
  rationale: Das Zeugnis verwendet starke Teilhabe- und Geburtsformulierungen; diese werden nicht im Sinn einer späteren christologischen Position geglättet.
- issue: Sündlosigkeit und Teilhabe an gefallenen Lebenslagen
  choice: 'Beide Aussagen bleiben nebeneinander bestehen: Er teilt die Lebenslagen der Gefallenen und wird dennoch ohne Sünde, Unreinheit und Verderbnis empfangen.'
  alternative: Die Spannung durch erklärende Harmonisierung aufzulösen.
  rationale: Der Text selbst hält Teilhabe und Unversehrtheit zusammen; die Übersetzung soll diese theologische Spannung bewahren.
- issue: Verhältnis des Retters zur Gesamtheit
  choice: »die Gesamtheit in leiblicher Gestalt«
  alternative: »die Fülle« oder eine Gleichsetzung mit einer bestimmten dogmatischen Kategorie.
  rationale: Die kosmologische Aussage bleibt eng am Zeugnis und wird nicht durch spätere Terminologie festgelegt.
- issue: Gefangenschaft unter der Sünde durch den Willen
  choice: Die grammatische und referenzielle Mehrdeutigkeit von »Wille« und »er« bleibt weitgehend bestehen.
  alternative: Das Subjekt ausdrücklich als Gott, Vater, Retter oder Logos zu bestimmen.
  rationale: Das englische Zeugnis erlaubt keine sichere Identifikation; eine Festlegung wäre theologische Interpretation statt Übersetzung.
- issue: Erlösung als Erkenntnis und Freiheit
  choice: Die Erkenntnis der Wahrheit wird als Freiheit wiedergegeben, ohne Erlösung darauf zu reduzieren.
  alternative: Die Passage ausschließlich sakramental, juridisch oder rein intellektuell zu deuten.
  rationale: Der Abschnitt definiert Freiheit erkenntnisbezogen, nennt zugleich Gnade, Heilung und Befreiung; diese Mehrdimensionalität bleibt erhalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut lesbarem Register. Technische kosmologische Begriffe und ungewöhnliche Bilder wurden beibehalten, wo eine Glättung genuine Mehrdeutigkeit beseitigt hätte. Beschädigte Stellen erscheinen als […], unsichere Ergänzungen in eckigen Klammern. Lange Perioden wurden behutsam gegliedert, ohne die gedanklichen Verknüpfungen des Zeugnisses aufzulösen.
