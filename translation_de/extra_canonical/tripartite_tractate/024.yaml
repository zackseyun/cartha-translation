  text: 'Out of an inclination toward mercy, our Savior became the same as those for whose sake he appeared had become through an instinctive passion—namely, flesh and soul, which constantly rule over them, so that they are destroyed and die. Yet those who [came into being] [] [as] invisible and invisibly, he taught about himself invisibly. He not only took on <himself> the death of those he intended to save, but also embraced the smallness into which they had fallen when they were <born> with body and soul, because he chose to be born as a child with body and soul. He shared in all the other conditions shared by those who had fallen, even though they possessed the light and he was exalted above them, because he chose to be conceived without sin, impurity, or corruption. He was begotten into physical life while dwelling in life, because it had been determined that both would equally become body and soul on account of the passion and shifting inclination from the Word, who had stirred himself
    in conversion.


    But according to the plan of salvation, it was he <who> took upon himself the results of the things we mentioned before—namely, what came into being from the illuminating vision and the firm thought of the Word after his self-conversion, after he stirred himself. This is how those who, like him, assumed body and soul, as well as establishment, stability, and wisdom. It had been determined beforehand that they would come together with the coming of the Savior, which had also been determined beforehand. Only when the Savior had made the decision did they also come. Thus they came, far surpassing in their fleshly emanation those who had been produced from the deficiency, [] because this was how they too underwent bodily emanation, as did the Savior, through the revelation of their union with him.


    These are those of a single substance, namely, the spiritual substance. The plan of salvation, however, is diverse: this is one thing, and that is another. Some emerge from passion and division and need healing. Others issue from the prayer that heals the sick and are appointed to treat the fallen. These are the apostles and the preachers of the message. They are the students of the Savior and the instructors of those who need teaching.


    Why, then, do they also share in the same passions as those who were produced from passion, if, according to the plan of salvation, they were produced in one body with <the> Savior, who did not share in such passions? The Savior was an image of a single entity, being the Totality in bodily form. Consequently, he preserved the pattern of inseparability, from which impassability comes. But they are images of each one who was revealed. This is why they embrace separation from their pattern, since they took on form for the planting that exists beneath heaven and that also [] shares in the evil prevailing in the places they have reached. For the will held the Totality captive under sin, so that by will he could show mercy to the Totality and they could be saved, since the one who is singular is chosen to give life, while all the rest need salvation.


    Because of this, he was the first among those to receive the grace of bestowing the gifts proclaimed by those whom he considered worthy of preaching to others. For <the> seed of the promise of Jesus Christ was put in place, whose revelation and union we have served. The promise made teaching possible, including the return to what they had been in the beginning. They possess a drop inclining them to return to it. This is what they call “redemption,” which is release from captivity and the attainment of freedom.


    The captivity is that of those who were enslaved to ignorance. In contrast, freedom is knowledge of the truth that existed before ignorance and prevails eternally, without beginning and without end. It is what is good, a cure for everything, and a release from the enslaving nature that caused suffering to those who had been produced in a lowly thought of emptiness—the nature of the evil inclination, [] through the thought that degrades them into lust for control. From the wealth of grace that looked upon the children, they received the treasure of freedom. Freedom casts down passion and destroys those things that it had earlier cast away from itself when the Word separated them from himself. He destined them for destruction until <the> the plan of salvation ends, and he allowed them to continue to exist because they too were useful for the things that had been predetermined.'
translation:
  language: de
  text: '**Die Menschwerdung**


    Aus einer Neigung zum Erbarmen wurde unser Retter denen gleich, um derentwillen er erschien: Durch eine triebhafte Leidenschaft waren sie zu Fleisch und Seele geworden, die fortwährend über sie herrschen, sodass sie zugrunde gehen und sterben. Doch jene, die [ins Dasein kamen] […] [als] unsichtbar und auf unsichtbare Weise, belehrte er auf unsichtbare Weise über sich selbst.[a] Er nahm nicht nur den Tod derer auf sich, die er retten wollte, sondern nahm auch ihre Niedrigkeit an, in die sie gefallen waren, als sie mit Leib und Seele [geboren] wurden. Denn er ließ sich dazu herab, als Kind mit Leib und Seele geboren zu werden. Er teilte auch alle übrigen Lebenslagen der Gefallenen, obwohl sie das Licht besaßen und er über sie erhaben war; denn er ließ sich dazu herab, ohne Sünde, Unreinheit und Verderbnis empfangen zu werden. Er wurde in das leibliche Leben hineingeboren und blieb dabei im Leben. Denn es war bestimmt worden, dass beide gleichermaßen Leib und Seele werden sollten – aufgrund
    der Leidenschaft und der wechselnden Neigung, die vom Wort ausging, das sich zur Umkehr aufgerafft hatte.


    Im Blick auf den Heilsplan aber war er es, [der] die Folgen der zuvor erwähnten Dinge auf sich nahm: nämlich dessen, was aus der erleuchtenden Schau und dem gefestigten Denken des Wortes entstand, nachdem es zu sich selbst umgekehrt war und sich aufgerafft hatte. So verhielt es sich mit denen, die wie er Leib und Seele sowie Festigkeit, Beständigkeit und Weisheit annahmen. Es war im Voraus bestimmt worden, dass sie gemeinsam mit der ebenfalls im Voraus bestimmten Ankunft des Retters kommen sollten. Erst als der Retter den Entschluss gefasst hatte, kamen auch sie. So kamen sie und übertrafen in ihrem fleischlichen Hervorgehen bei Weitem jene, die aus dem Mangel hervorgebracht worden waren […]. Denn auch sie erfuhren auf diese Weise ein leibliches Hervorgehen wie der Retter: durch die Offenbarung ihrer Vereinigung mit ihm.


    Sie sind von einer einzigen Substanz, nämlich der geistigen. Der Heilsplan jedoch ist vielfältig: Das eine ist dieses, das andere jenes. Einige gehen aus Leidenschaft und Trennung hervor und bedürfen der Heilung. Andere gehen aus dem Gebet hervor, das die Kranken heilt, und sind dazu bestimmt, die Gefallenen zu behandeln. Das sind die Apostel und die Verkündiger der Botschaft. Sie sind die Schüler des Retters und die Lehrer derer, die Unterweisung brauchen.


    Warum haben dann auch sie Anteil an denselben Leidenschaften wie jene, die aus Leidenschaft hervorgebracht wurden, wenn sie dem Heilsplan gemäß in einem Leib mit [dem] Retter hervorgebracht wurden, der an solchen Leidenschaften keinen Anteil hatte? Der Retter war das Bild einer einzigen Einheit, da er die Gesamtheit in leiblicher Gestalt war. Darum bewahrte er das Urbild der Untrennbarkeit, aus der die Leidensunfähigkeit hervorgeht.[b] Sie dagegen sind Bilder jedes Einzelnen, der offenbart wurde. Deshalb nehmen sie die Trennung von ihrem Urbild an, da sie Gestalt annahmen für die Pflanzung, die unterhalb des Himmels besteht und ebenfalls […] Anteil an dem Bösen hat, das an den Orten herrscht, zu denen sie gelangt ist. Denn der Wille hielt die Gesamtheit unter der Sünde gefangen, damit er der Gesamtheit durch den Willen Erbarmen schenken und sie gerettet werden könnten; denn der Eine, der einzig ist, wird erwählt, Leben zu geben, während alle Übrigen Rettung brauchen.


    Deshalb war er der Erste unter denen, die die Gnade empfingen, jene Gaben auszuteilen, welche von denen verkündet wurden, die er für würdig hielt, anderen zu predigen. Denn [der] Same der Verheißung Jesu Christi wurde eingesetzt; seiner Offenbarung und Vereinigung haben wir gedient. Die Verheißung machte die Unterweisung möglich, ja, die Rückkehr zu dem, was sie am Anfang gewesen waren. Sie besitzen einen Tropfen, der sie zur Rückkehr dorthin neigt. Das nennen sie »Erlösung«: die Befreiung aus der Gefangenschaft und das Erlangen der Freiheit.


    Die Gefangenschaft ist die Gefangenschaft derer, die der Unwissenheit versklavt waren. Freiheit dagegen ist die Erkenntnis der Wahrheit, die schon vor der Unwissenheit bestand und ewig herrscht, ohne Anfang und ohne Ende. Sie ist das Gute, ein Heilmittel für alles und die Befreiung von der versklavenden Natur. Diese ließ jene leiden, die aus einem niedrigen Gedanken der Leere hervorgebracht worden waren – der Natur der bösen Neigung […], durch den Gedanken, der sie zur Herrschsucht erniedrigt. Aus dem Reichtum der Gnade, die auf die Kinder blickte, empfingen sie den Schatz der Freiheit. Die Freiheit stürzt die Leidenschaft und vernichtet jene Dinge, die sie zuvor von sich gewiesen hatte, als das Wort sie von sich selbst trennte. Er bestimmte sie zur Vernichtung, bis [der] Heilsplan vollendet ist, und ließ sie weiterbestehen, weil auch sie für das im Voraus Bestimmte von Nutzen waren.[c]'
