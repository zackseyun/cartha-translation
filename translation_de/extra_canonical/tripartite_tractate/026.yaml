  source_fidelity: 'Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt dessen technische Begriffe sowie editorische Markierungen. Zwei sichere Korrekturen sind angezeigt: Die Wendung zur Rückkehr soll das substantivische und nicht zwingend personale „Präexistente“ bewahren; außerdem wird die schwer verständliche Formulierung über den Ort der Unterweisung näher am Satzbau des Zeugen und ohne zusätzliche Finalnuance formuliert. Eine unmittelbare koptische Gegenprüfung ist nach den Metadaten weiterhin ausstehend.'
  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. Die Revision glättet insbesondere den Satz über Unterweisung, Abbilder und Urbilder, ohne die textliche Schwierigkeit zu verdecken.
  terminology: Die konsequente Wiedergabe von Election/Calling, aeon, Fullness, Totality und redemption als „Erwählung“, „Berufung“, „Äon“, „Fülle“, „Gesamtheit“ und „Erlösung“ ist sachgerecht. „das Präexistente“ erhält die offene technische Referenz des englischen Zeugen besser als eine personalisierende Relativkonstruktion.
  issues:
  - severity: medium
    issue: „zu dem, der schon zuvor existierte“ personalisiert „the pre-existent“.
    rationale: Der Zeuge bietet eine substantivierte, aber nicht ausdrücklich personale Bezeichnung. „zum Präexistenten“ bewahrt diese Offenheit und vermeidet eine zusätzliche ontologische Festlegung.
  - severity: medium
    issue: Der Satz über den Ort der Unterweisung formuliert die Funktion der vorbereiteten Orte um und ergänzt eine Zwecknuance.
    rationale: „die ihnen wie ein Spiegel ... darbieten sollten“ ist gegenüber „prepared to supply it with ...“ freier und syntaktisch schwer nachvollziehbar. Eine engere Formulierung erhält die Ambiguität des Bezugs von „it“.
