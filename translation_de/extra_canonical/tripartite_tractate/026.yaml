  text: 'The Election shares in the nature and body of the Savior. It is like a bridal chamber because of its unity and union with him, since it was above all for its sake that Christ came. By contrast, the Calling is appointed for those who rejoice in the bridal chamber and are glad and happy about the union of the bridegroom and the bride. In this way, the place the Calling will receive is the aeon of the images, where the Word has yet to unite with the Fullness. Because of this, the Human of the Church was joyful and glad, and he hopes for her. He consists of spirit, soul, and body, corresponding to the one who made the plan of salvation.


    Within (the Human) was a human who was a unity, because he was the Totality, and he was all of them. He possessed what came from the [Father], which [] the places could receive. He also possessed the limbs we mentioned earlier. When the redemption was proclaimed, the Perfect Human immediately gained the knowledge of how to return quickly to his unity, to the place from which he originated. He joyfully returned to the place from which he had originated, the place from which he had come forth.


    However, his limbs needed a place of instruction, as is in the places prepared to provide it with the images and archetypes like a mirror, until all the limbs of the body of the Church <are joined> in the same place and receive the restoration at the same time, through the manifestation of the entire body, <…> the restoration to the Fullness.


    It possesses a primary shared harmony and union, which is the harmony belonging to the Father, until the Totalities acquire a face like his. The restoration at the end, however, <will occur> after the Totality is unveiled in him who is the Son, who is the redemption—that is, the path toward the incomprehensible Father, that is, the return to the pre-existent—and (after) the Totalities reveal themselves in that one, in the proper way, who is the path to the ungraspable, unspeakable, [] unseen, and incomprehensible one, so that it attains redemption.


    It will be a liberation not only from the control of those <of> the left, and not only an escape from the power of those of the right, whose servants and sons we believed ourselves to be, and from whom no one escapes without quickly being caught by them again. Instead, redemption is also an ascent <to> the degrees in the Fullness and to those who received names and grasped them according to the ability of each aeon. It is also an entrance into what is silent, with no need for voice, knowledge, conceptualization, or enlightenment, but (where) all things are light, all radiant without any need for enlightenment.


    Angels as well as humans need redemption, as do the image, the Fullnesses of the aeons, and the wondrously radiant powers. Even the Son himself, who is the model for the redemption of the Totality, [needed] redemption too, [] because he became human, subjecting himself to everything necessary to us in the flesh, who are his Church. When he then first attained redemption through the Word that had descended upon him, all the rest attained redemption from him by embracing him for themselves. This is because those who received the one who had (already) received naturally received what was in him.


    Among fleshly humans, redemption began [being] bestowed when his firstborn, his love, the fleshly Son, and the heavenly angels were considered worthy to form a fellowship with him on the earth. This is why he is called “the angelic redemption of the Father,” consoling those who had grieved for the sake of the knowledge of the Totality, because he was the first to have this gift bestowed upon him, before anyone else.'
translation:
  language: de
  text: 'Die Erwählung hat Anteil an der Natur und am Leib des Retters. Wegen ihrer Einheit und ihrer Vereinigung mit ihm gleicht sie einem Brautgemach; denn vor allem um ihretwillen kam Christus. Die Berufung dagegen ist für diejenigen bestimmt, die sich über das Brautgemach freuen und über die Vereinigung des Bräutigams mit der Braut froh und glücklich sind. So ist der Ort, den die Berufung erhalten wird, der Äon der Abbilder, wo das Wort sich erst noch mit der Fülle vereinigen wird. Deshalb war der Mensch der Kirche voller Freude und froh, und er hofft auf sie. Er besteht aus Geist, Seele und Leib, entsprechend dem, der den Heilsplan entwarf.


    Im Innern (des Menschen) war ein Mensch, der eine Einheit war, denn er war die Gesamtheit und war sie alle. Er besaß, was vom [Vater] ausging und was die Orte [] aufnehmen konnten. Auch besaß er die Glieder, die wir zuvor erwähnt haben. Als die Erlösung verkündet wurde, erlangte der vollkommene Mensch sogleich die Erkenntnis, wie er rasch zu seiner Einheit zurückkehren konnte, an den Ort, von dem er seinen Ursprung hatte. Voll Freude kehrte er an den Ort zurück, von dem er seinen Ursprung hatte, an den Ort, von dem er ausgegangen war.


    Seine Glieder jedoch brauchten einen Ort der Unterweisung, wie er sich in den dafür bereiteten Orten findet, die ihnen wie ein Spiegel die Abbilder und Urbilder darbieten sollten, bis alle Glieder des Leibes der Kirche <zusammengefügt sind> am selben Ort und zugleich die Wiederherstellung empfangen: durch das Offenbarwerden des ganzen Leibes, <…> die Wiederherstellung zur Fülle.


    Sie besitzt eine ursprüngliche gemeinsame Harmonie und Einheit, nämlich die Harmonie, die dem Vater gehört, bis die Gesamtheiten ein Antlitz wie das seine erlangen. Die endgültige Wiederherstellung jedoch <wird geschehen>, nachdem die Gesamtheit in dem enthüllt worden ist, der der Sohn ist, der die Erlösung ist – das heißt: der Weg zum unbegreiflichen Vater, das heißt: die Rückkehr zu dem, der schon zuvor existierte – und nachdem die Gesamtheiten sich auf die ihnen angemessene Weise in jenem offenbart haben, der der Weg zu dem Unfassbaren, Unaussprechlichen, [] Unsichtbaren und Unbegreiflichen ist, damit sie Erlösung erlangt.[a]


    Sie wird nicht nur eine Befreiung aus der Herrschaft derer <von> der Linken sein und nicht nur ein Entkommen aus der Macht derer von der Rechten, für deren Sklaven und Söhne wir uns hielten und denen niemand entkommt, ohne von ihnen rasch wieder gefangen zu werden. Vielmehr ist die Erlösung auch ein Aufstieg <zu> den Stufen in der Fülle und zu denen, die Namen erhielten und sie entsprechend der Fähigkeit jedes Äons erfassten. Sie ist auch ein Eintritt in das Schweigende, wo es weder Stimme noch Erkenntnis, begriffliches Denken oder Erleuchtung braucht, sondern wo alles Licht ist und alles strahlt, ohne Erleuchtung zu benötigen.


    Engel ebenso wie Menschen brauchen Erlösung, ebenso das Abbild, die Füllen der Äonen und die wunderbar strahlenden Mächte. Sogar der Sohn selbst, der das Urbild für die Erlösung der Gesamtheit ist, [brauchte] Erlösung, [] weil er Mensch wurde und sich allem unterwarf, was für uns im Fleisch notwendig ist – für uns, die wir seine Kirche sind. Nachdem er dann als Erster durch das Wort, das auf ihn herabgekommen war, Erlösung erlangt hatte, erlangten alle Übrigen von ihm Erlösung, indem sie ihn für sich annahmen. Denn diejenigen, die den empfingen, der bereits empfangen hatte, empfingen damit auch, was in ihm war.[b]


    Unter den Menschen aus Fleisch begann die Erlösung [verliehen] zu werden, als sein Erstgeborener, seine Liebe, der Sohn aus Fleisch und die himmlischen Engel für würdig befunden wurden, mit ihm auf der Erde eine Gemeinschaft zu bilden. Deshalb wird er »die engelhafte Erlösung des Vaters« genannt. Er tröstet diejenigen, die um der Erkenntnis der Gesamtheit willen betrübt gewesen waren, denn ihm wurde diese Gabe als Erstem, vor allen anderen, verliehen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bezüge der Einzahl und Mehrzahl in diesem langen Satz sind im überlieferten Wortlaut nicht durchgehend eindeutig. Auch »der schon zuvor existierte« kann personal oder als Bezeichnung einer präexistenten Wirklichkeit verstanden werden.
    reason: Bewahrt syntaktische und metaphysische Mehrdeutigkeit.
  - marker: b
    text: Die Handschrift ist hier beschädigt. Die Aussage, auch der Sohn habe Erlösung gebraucht beziehungsweise erlangt, wird deshalb nicht erklärend abgeschwächt; der Zusammenhang verbindet sie mit seiner Menschwerdung und dem auf ihn herabgekommenen Wort.
    reason: Kennzeichnet Textschaden und erhält die theologische Spannung.
  - marker: c
    text: Der Schlussabschnitt ist syntaktisch unsicher. Es bleibt offen, ob »sein Erstgeborener«, »seine Liebe« und »der Sohn aus Fleisch« mehrere Größen bezeichnen oder verschiedene Benennungen derselben Gestalt sind. Auch der Titel »die engelhafte Erlösung des Vaters« ist mehrdeutig.
    reason: Macht die wesentlichen Unsicherheiten der Aufzählung und Titulatur transparent.
lexical_decisions:
- source_word: Election
  choice: Erwählung
  rationale: Bewahrt den technischen und theologischen Begriff sowie die Gegenüberstellung zur Berufung.
- source_word: Calling
  choice: Berufung
  rationale: Gängige, würdige deutsche Entsprechung; als personifizierter Fachbegriff großgeschrieben.
- source_word: aeon
  choice: Äon
  rationale: Der technische kosmologische Begriff wird transliteriert und nicht erklärend aufgelöst.
- source_word: Fullness
  choice: Fülle
  rationale: Traditionelle deutsche Wiedergabe des pleromatischen Fachbegriffs; die Großschreibung kennzeichnet seine technische Verwendung.
- source_word: Totality / Totalities
  choice: Gesamtheit / Gesamtheiten
  rationale: Erhält den Wechsel zwischen Singular und Plural und vermeidet eine vorschnelle Identifikation mit der Fülle.
- source_word: images and archetypes
  choice: Abbilder und Urbilder
  rationale: Gibt die spiegelbildliche Relation natürlich und zugleich begrifflich präzise wieder.
- source_word: redemption
  choice: Erlösung
  rationale: Passt sowohl zur Befreiung als auch zur Rückkehr und zum Aufstieg, ohne den mehrschichtigen Sinn auf einen Aspekt zu verengen.
- source_word: the Human of the Church
  choice: der Mensch der Kirche
  rationale: Bewahrt die ungewöhnliche technische Formulierung und deutet sie nicht als bloßes einzelnes Kirchenmitglied um.
- source_word: what is silent
  choice: das Schweigende
  rationale: Erhält die substantivierte, möglicherweise kosmologische Bedeutung statt sie bloß als Zustand der Stille wiederzugeben.
- source_word: angelic redemption of the Father
  choice: die engelhafte Erlösung des Vaters
  rationale: Bewahrt die grammatische und theologische Mehrdeutigkeit der ungewöhnlichen Titulatur.
theological_decisions:
- issue: Bezug der Pronomen bei Kirche, Berufung und Wiederherstellung
  choice: Die grammatischen Bezüge wurden soweit möglich bewahrt, ohne sie dogmatisch zu harmonisieren.
  alternative: Pronomen ausdrücklich auf Kirche, Berufung oder Gesamtheit festlegen.
  rationale: Der überlieferte Wortlaut ist an mehreren Stellen mehrdeutig; eine eindeutige Zuordnung würde eine Interpretation in den Text eintragen.
- issue: Erlösungsbedürftigkeit des Sohnes
  choice: Die Aussage »[brauchte] Erlösung« bleibt wörtlich und mit den überlieferten Klammern erhalten.
  alternative: Als bloße stellvertretende Erlösung oder als Erlösung seines Leibes erklären.
  rationale: Die theologische Spannung ist im Zeugnis echt und darf nicht konfessionell entschärft werden.
- issue: Sohn aus Fleisch, Erstgeborener und Liebe
  choice: Die Aufzählung bleibt formal bestehen.
  alternative: Alle Ausdrücke ausdrücklich als Appositionen zu einer einzigen Person verbinden.
  rationale: Die syntaktische Beziehung ist unsicher; die Übersetzung soll weder Einheit noch Mehrzahl erzwingen.
- issue: Rechte und linke Mächte
  choice: Die räumlich-technischen Bezeichnungen »die Linke« und »die Rechte« bleiben erhalten.
  alternative: Sie als böse und gute Mächte auslegen.
  rationale: Der Text spricht von einer Befreiung aus beiden Machtbereichen; moralische Etiketten würden diese Spannung einebnen.
- issue: Rückkehr zu dem Präexistenten
  choice: »Rückkehr zu dem, der schon zuvor existierte«
  alternative: »Rückkehr in den präexistenten Zustand«
  rationale: Das Zeugnis lässt offen, ob eine Person, eine Wirklichkeit oder ein Zustand gemeint ist; die gewählte Form folgt der personalen Grammatik, ohne nähere Identifikation.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut lesbarem Register. Technische Begriffe wie Erwählung, Berufung, Äon, Fülle und Gesamtheit werden konsequent großgeschrieben. Eckige Klammern, leere Klammern, Winkelklammern, Parenthesen und Auslassungszeichen bewahren die editorischen Signale des englischen öffentlichen Zeugnisses. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich vorläufig und quellennah formuliert.
