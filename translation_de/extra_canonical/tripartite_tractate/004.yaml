review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem englischen Zeugen insgesamt eng und bewahrt dessen Beschädigungs- und Ergänzungssignale weitgehend. Einige Formulierungen glätten jedoch den fragmentarischen Satzbau oder verschieben Beziehungen innerhalb der schwierigen Aussage über die Verbindung der Kirche. Außerdem wird der Plural in der beschädigten Äonen-Passage verfehlt, und einzelne Wendungen (besonders »nicht für sie selbst«, »ungeborenes Kind« und »das Seiende«) sind gegenüber dem Zeugen weniger genau bzw. unnötig festlegend.
  naturalness: Der Duktus ist überwiegend würdig und modernes Standarddeutsch. Die revidierte Fassung verbessert die Satzbezüge, ohne die absichtlich sperrige und fragmentarische Sprache des Zeugen zu harmonisieren.
  terminology: »Kirche«, »Äonen«, »Vater«, »Sohn«, »Tiefe« und »Vaterschaft« sind angemessen. »Hervorbringungen« wahrt die wiederholte Zeugungs-/Hervorbringungsmetaphorik. »was ist« ist hier gegenüber dem stärker ontologisierenden »das Seiende« vorzuziehen.
  issues:
  - severity: medium
    issue: Die Verbindung der Kirche mit den Äonen und den aus ihnen und mit dem Sohn Hervorgegangenen wird syntaktisch umgeordnet.
    rationale: Die Fassung »miteinander, [mit denen] ... und mit dem Sohn« macht den Sohn zu einem unmittelbaren Glied der von den Äonen gebildeten Verbindung, während der Zeuge ihn innerhalb der beschädigten Herkunftsbestimmung führt. Die Klammerstellung sollte näher am Zeugen bleiben.
  - severity: medium
    issue: In der beschädigten Passage über die Äonen steht »weilte« im Singular.
    rationale: Der Zeuge hat »of the aeons dwelt«; trotz der vorausgehenden Lücke ist im Deutschen der Plural »weilten« erforderlich.
  - severity: medium
    issue: »ihr Dasein war nicht für sie selbst« und »wie ein ungeborenes Kind« geben die Vorlage nicht präzise wieder.
    rationale: »Not being for themselves« meint eher »nicht um ihrer selbst willen«; »fetus« wird am besten ausdrücklich als »Fötus« wiedergegeben. Die folgende Saatmetapher sollte mit »gesät« statt »gezeugt« erhalten bleiben.
  - severity: low
    issue: »das Seiende« verengt »what is« terminologisch.
    rationale: Die schlichte Formulierung »was ist« wahrt die offene, dichte Sprache des Zeugen und vermeidet eine zusätzliche philosophische Festlegung.
  - severity: low
    issue: Die erläuternde Fußnote zu den wurzellosen Orten deutet »diese Orte« als niedrigere Bereiche.
    rationale: Diese Konkretisierung ist im bereitgestellten Zeugen nicht abgesichert. Die Mehrdeutigkeit bleibt besser im Text ohne diese Deutung gewahrt.
  revised_text: '[. . .] die Kirche besteht in den Eigenschaften und Wesenszügen, in denen der Vater und der Sohn bestehen, wie ich von Anfang an gesagt habe. Sie hat daher Bestand in den Hervorbringungen zahlloser Äonen.[a] Aufgrund der Eigenschaften und Wesenszüge, in denen die Kirche [besteht], bringen auch die Äonen auf unzählbare Weise hervor. Denn diese Äonen [bilden] die Verbindung der Kirche, die sie miteinander und [mit denen] bilden, die aus [ihnen und] mit dem Sohn hervorgegangen sind, zu dessen Herrlichkeit sie bestehen.



    Daher ist es unmöglich, dass der Verstand <sie> erfasst, da er die Vollkommenheit jenes Ortes ist.[b] Auch die Sprache kann sie nicht beschreiben, denn sie sind unaussprechlich, unnennbar und unbegreiflich. Nur sie selbst können sich benennen und sich selbst erfassen, weil sie an diesen Orten keine Wurzel haben. Diejenigen an jenem Ort sind unaussprechlich, unzählbar in der Ordnung, [die] sowohl [die Art] als auch das Ausmaß ist: der Jubel, die Freude des Ungezeugten, Namenlosen, Unnennbaren, Unbegreiflichen, Unsichtbaren und Undenkbaren. Dies ist die Fülle der Vaterschaft, sodass sein Reichtum eine Hervorbringung ist.



    [] [. . .] der Äonen weilten ewig im Denken, denn der Vater war für sie gleichsam ein Gedanke und ein Ort. Nachdem ihre Hervorbringungen festgelegt worden waren, wollte derjenige, der über alles herrscht, ergreifen und hervorbringen, was in dem [. . .] fehlte; und er brachte diejenigen hervor, die [in] ihm waren. Weil er jedoch [so ist], wie er ist, [ist] er eine Quelle, die durch das reichlich aus ihr strömende Wasser nicht abnimmt.



    Während sie im Denken des Vaters weilten, nämlich in der verborgenen Tiefe, kannte die Tiefe sie; sie aber konnten die Tiefe, in der sie weilten, nicht erkennen. Auch war es ihnen unmöglich, sich selbst oder irgendetwas anderes zu erkennen. Mit anderen Worten: Sie weilten beim Vater, doch sie bestanden nicht um ihrer selbst willen. Vielmehr bestanden sie nur so, wie ein Same besteht, und so zeigte sich, dass sie wie ein Fötus bestanden. Gleichsam durch ein Wort zeugte er sie, während sie in samenhafter Gestalt bestanden; doch diejenigen, die er zeugen sollte, waren noch nicht aus ihm ins Dasein gelangt.



    [] Der Vater war derjenige, der zuerst an sie dachte. Er säte einen Gedanken wie einen Samenkern, nicht allein, damit sie um seinetwillen bestehen könnten, sondern damit sie auch um ihrer selbst willen bestehen könnten, damit sie sodann in seinem Denken als erkennende Wesen bestehen und auch um ihrer selbst willen bestehen könnten. Damit sie erkennen könnten, was um ihretwillen besteht, verlieh er ihnen großzügig [die] anfängliche Gestalt; und damit [sie] erkennen könnten, [wer der Vater] ist, der um ihretwillen besteht, gab er ihnen durch eine Stimme den Namen »Vater«. Diese verkündete ihnen, dass alles, was besteht, durch diesen Namen besteht, der ihnen gehört. Denn sie gelangten zum Sein aufgrund der Erhabenheit, die in dem Namen wohnt — einer Erhabenheit, die sie nicht erkannten.[c] Ein Kind hat, solange es noch ein Fötus ist, was für es selbst genügt, ohne denjenigen schon zu sehen, der es gesät hat. Ihre einzige Aufgabe bestand daher darin, ihn zu suchen, seine Existenz zu erkennen
    und beständig danach zu verlangen, das, was existiert, zu entdecken.



    Doch weil der vollkommene Vater gut ist und weil er sich ihnen nicht <verschloss>, um sie für immer nur in seinem Denken bestehen zu lassen, sondern ihnen vielmehr gewährte, auch um ihrer selbst willen zum Dasein zu gelangen, gab er ihnen ebenso die Gabe, zu erkennen, was ist, nämlich den, der sich selbst ewig erkennt. [] [. . .] erlangen Gestalt, [um zu erkennen], dass Der, der ist, existiert — so wie Menschen, die, wenn sie an diesem Ort geboren werden, ins Licht treten, damit sie diejenigen sehen können, die sie gezeugt haben.'
