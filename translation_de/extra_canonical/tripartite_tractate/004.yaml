translation:
  language: de
  text: '[. . .] die Kirche besteht in den Eigenschaften und Wesenszügen, in denen der Vater und der Sohn bestehen, wie ich von Anfang an gesagt habe. Sie hat daher Bestand in den Hervorbringungen zahlloser Äonen.[a] Aufgrund der Eigenschaften und Wesenszüge, in denen die Kirche [besteht], bringen auch die Äonen auf unzählbare Weise hervor. Denn diese Äonen [bilden] die Einheit der Kirche, die sie miteinander, [mit denen], die aus [ihnen] hervorgegangen sind, und mit dem Sohn [herstellen], zu dessen Herrlichkeit sie bestehen.


    Daher ist es unmöglich, dass der Verstand <sie> erfasst, da er die Vollkommenheit jenes Ortes ist.[b] Auch die Sprache kann sie nicht beschreiben, denn sie sind unaussprechlich, unnennbar und unbegreiflich. Nur sie selbst können sich benennen und sich selbst erfassen, weil sie an diesen Orten keine Wurzel haben.[c] Diejenigen an jenem Ort sind unaussprechlich und unzählbar in der Ordnung, [die] sowohl [ihre Art] als auch ihr Ausmaß ist: der Jubel, die Freude des Ungezeugten, Namenlosen, Unnennbaren, Unbegreiflichen, Unsichtbaren und Undenkbaren. Dies ist die Fülle der Vaterschaft, sodass sein Reichtum eine Hervorbringung ist.


    [] [. . .] der Äonen weilte ewig im Denken, denn der Vater war für sie gleichsam ein Gedanke und ein Ort. Als ihre Hervorbringungen festgesetzt waren, wollte derjenige, der über alles herrscht, ergreifen und hervorbringen, was in dem [. . .] noch fehlte; und er brachte diejenigen hervor, die [in] ihm waren. Weil er jedoch [so ist], wie er ist, [ist] er eine Quelle, die durch das reichlich aus ihr strömende Wasser nicht abnimmt.


    Während sie im Denken des Vaters weilten, nämlich in der verborgenen Tiefe, kannte die Tiefe sie; sie aber konnten die Tiefe, in der sie weilten, nicht erkennen. Auch war es ihnen unmöglich, sich selbst oder irgendetwas anderes zu erkennen. Mit anderen Worten: Sie weilten beim Vater, doch ihr Dasein war nicht für sie selbst. Vielmehr bestanden sie nur so, wie ein Same besteht, und so zeigte sich, dass sie wie ein ungeborenes Kind bestanden. Wie durch ein Wort zeugte er sie, während sie in samenhafter Gestalt bestanden; doch diejenigen, die er zeugen sollte, waren noch nicht aus ihm ins Dasein gelangt.


    [] Der Vater war derjenige, der zuerst an sie dachte. Er säte einen Gedanken wie einen Samenkern, nicht nur, damit sie um seinetwillen bestehen könnten, sondern auch um ihrer selbst willen; damit sie sodann in seinem Denken als erkennende Wesen und zugleich um ihrer selbst willen bestehen könnten. Damit sie erkennen könnten, was um ihretwillen besteht, verlieh er ihnen großzügig [die] ursprüngliche Gestalt; und damit [sie] erkennen könnten, [wer der Vater] ist, der um ihretwillen besteht, gab er ihnen durch eine Stimme den Namen »Vater«. Diese verkündete ihnen, dass alles, was besteht, durch diesen Namen besteht, der ihnen gehört. Denn sie gelangten zum Sein aufgrund der Erhabenheit, die in dem Namen wohnt — einer Erhabenheit, die sie nicht erkannten.[d] Solange ein Kind noch ungeboren ist, hat es, was es für sich selbst braucht, ohne denjenigen schon zu sehen, der es gezeugt hat. Ihre einzige Aufgabe bestand daher darin, ihn zu suchen: Sie erkannten, dass er existiert, und verlangten
    beständig danach, das Bestehende zu entdecken.[e]


    Doch weil der vollkommene Vater gut ist und weil er sich ihnen nicht <verschloss>, um sie für immer nur in seinem Denken bestehen zu lassen, sondern ihnen vielmehr gewährte, auch um ihrer selbst willen zum Dasein zu gelangen, gab er ihnen ebenso die Gabe, das Seiende zu erkennen, nämlich den, der sich selbst ewig erkennt. [] [. . .] Gestalt erlangen, [um zu erkennen], dass Der, der ist, existiert — so wie Menschen, die, wenn sie an diesem Ort geboren werden, ins Licht treten, damit sie diejenigen sehen können, die sie gezeugt haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Äonen« ist hier ein Fachbegriff für die zahllosen hervorgebrachten Größen oder Wesen der göttlichen Fülle, nicht bloß für Zeitabschnitte.
    reason: Der deutsche Alltagssinn von »Äon« ist oft zeitlich; der Kontext verwendet den Begriff personal beziehungsweise ontologisch.
  - marker: b
    text: Der Bezug von »er« ist im zugrunde liegenden Übersetzungszeugen unsicher; möglicherweise ist der Verstand selbst als »Vollkommenheit jenes Ortes« gemeint.
    reason: Bewahrt eine echte syntaktische Unklarheit des verfügbaren Zeugnisses.
  - marker: c
    text: »An diesen Orten keine Wurzel haben« kann bedeuten, dass ihr Ursprung nicht in den niedrigeren, hier bezeichneten Bereichen liegt.
    reason: Die räumliche Bildsprache ist ohne koptische Quellenprüfung semantisch unsicher.
  - marker: d
    text: Die Sätze über den Namen, der »ihnen gehört«, und die in ihm wohnende Erhabenheit sind im überlieferten Zusammenhang schwer zu deuten.
    reason: Warnt vor einer zu eindeutigen theologischen Lesart der dichten Namensmetaphysik.
  - marker: e
    text: »Das Bestehende« kann auch als »das, was existiert« oder, personal verstanden, als »den Seienden« aufgefasst werden.
    reason: Der verfügbare englische Zeuge lässt den Gegenstand ihres Suchens mehrdeutig.
lexical_decisions:
- source_word: Church
  choice: Kirche
  rationale: Bewahrt den im Zeugnis verwendeten ekklesiologischen Begriff, ohne ihn durch eine erklärende Umschreibung dogmatisch festzulegen.
- source_word: aeons
  choice: Äonen
  rationale: Der terminologische Fachbegriff wird transliteriert, da »Zeitalter« die hier als hervorgebrachte Wesen beziehungsweise Größen verstandenen Äonen verengen würde.
- source_word: births / generations / bring forth
  choice: Hervorbringungen / hervorbringen
  rationale: Die neutrale Wortfamilie bewahrt das Bild des Hervorgehens, ohne überall biologisches Gebären oder eine bestimmte Emanationslehre festzuschreiben.
- source_word: mind
  choice: Verstand
  rationale: Bezeichnet hier das Erkenntnisvermögen; »Geist« wäre im Deutschen theologisch stärker mehrdeutig.
- source_word: depth
  choice: Tiefe
  rationale: 'Die Bild- und Fachsprache des Textes bleibt erhalten, einschließlich der Personifizierung: Die Tiefe kennt die Äonen.'
- source_word: spermatic form
  choice: samenhafte Gestalt
  rationale: Gibt die Keim- und Zeugungsmetaphorik würdig und verständlich wieder, ohne unnötig medizinisch zu klingen.
- source_word: cognitive entity
  choice: erkennende Wesen
  rationale: Natürliches modernes Deutsch, das die Fähigkeit zur Erkenntnis ausdrückt, ohne die Wesen zu abstrakten »kognitiven Entitäten« zu machen.
- source_word: He Who Is
  choice: Der, der ist
  rationale: Bewahrt die existentielle Gottesbezeichnung und vermeidet eine vorschnelle Gleichsetzung mit einer bestimmten kanonischen Formel.
theological_decisions:
- issue: Wesen und Einheit der Kirche mit den Äonen
  choice: Die Aussagen über Kirche, Äonen, Sohn und ihre Einheit werden möglichst eng und ohne systematische Erklärung wiedergegeben.
  alternative: Die Kirche ausdrücklich als Gesamtheit oder Pleroma der Äonen deuten.
  rationale: Der beschädigte und syntaktisch dichte Text lässt die genaue ontologische Beziehung offen; eine konfessionelle oder gnostisch-systematische Auflösung wäre zu weitgehend.
- issue: Bezug von »he being the perfection of that place«
  choice: Das maskuline Pronomen wird als »er« bewahrt.
  alternative: Explizit »der Verstand ist die Vollkommenheit jenes Ortes« oder »denn sie sind die Vollkommenheit« schreiben.
  rationale: Der englische Zeuge enthält einen schwierigen Pronomenbezug. Die Übersetzung wahrt diese Spannung, statt den Bezug stillschweigend umzudeuten.
- issue: Selbsterkenntnis und Erkenntnis des Vaters
  choice: Die gestufte Entwicklung vom Sein im Denken des Vaters zur eigenen Existenz und Erkenntnis bleibt unharmonisiert stehen.
  alternative: Die Passage als festes metaphysisches Stufensystem erläutern.
  rationale: Der Text setzt mehrere Spannungen zwischen Vorherwissen, Selbstsein und Erkenntnis; diese sollen nicht dogmatisch systematisiert werden.
- issue: »the one who knows himself eternally«
  choice: 'Als nähere Bestimmung des Seienden beziehungsweise des Vaters wiedergegeben: »den, der sich selbst ewig erkennt«.'
  alternative: Auf die Äonen beziehen oder unpersönlich mit »das sich selbst ewig Erkennende« übersetzen.
  rationale: Der unmittelbare Wortlaut legt einen personalen singularischen Bezug nahe, bleibt aber durch die beschädigte Überlieferung nicht völlig sicher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Fachsprache (Kirche, Äonen, Tiefe, Vaterschaft). Eckige Klammern und Auslassungspunkte bewahren Schäden beziehungsweise Ergänzungen des Zeugnisses; spitze Klammern markieren editoriale Korrekturen. Die Vorlage ist nur ein englischer gemeinfreier Übersetzungszeuge; eine unmittelbare Prüfung des koptischen Textes steht aus, daher wurden schwierige Pronomenbezüge und beschädigte Stellen nicht geglättet.
