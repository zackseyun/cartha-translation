base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/010.yaml
  text: 'The emanation of the Totalities, who exist from the existent one, did not happen through separation from one another, like [something] discarded by the one who gives birth to them. Instead, their begetting is like an act of extension, as the Father extends himself to those he loves, so that [those] who originated from him might also become him. Although the present age is a unity, it is divided into units of time, which are divided into years, which in turn are divided into seasons, then seasons into months, months into days, days into hours, and hours into minutes. In the same way, [] the age of truth, because it is one and many, is honored with names both insignificant and important, according to what each one can grasp. By analogy, it is like a spring that, while remaining what it is, nevertheless flows and expands into streams, lakes, canals, and branches. Or it is like a root spreading beneath trees and branching out with their fruit, or like a human body, inseparably divided
    into various branching limbs—primary and secondary, great and small.


    The aeons brought themselves forth in agreement with the third fruit, by free will and through the understanding he gave them for thought. They do not desire to give glory [together with] what the separate Fullnesses brought forth in unison as words of [praise]. Nor do they desire to give glory together with the entire Totality, or to glorify together with any individual aeon who has reached a place or state higher than his own, unless he obtains <what> was desired from the one with a more exalted name and a higher place. [] They receive one another at the higher place, and the one who wished to rise higher begets himself, so to speak, begetting himself together with the other one and with what he is. He is renewed together with the one who came to him from his brother, beholding him and entreating him concerning the matter.


    So that this may happen in this way, the one who desired to give glory says nothing to him about it except this, because a limit on speech has been established in the Fullness. Thus they remain silent about the incomprehensibility of the Father, while still being permitted to speak about their desire to grasp him.'
translation:
  language: de
  text: 'Das Hervorgehen der Gesamtheiten, die aus dem Seienden existieren, geschah nicht dadurch, dass sie voneinander getrennt wurden, wie [etwas], das von dem, der sie hervorbringt, weggeworfen wird.[a] Vielmehr gleicht ihre Hervorbringung einer Ausdehnung: Der Vater dehnt sich zu denen hin aus, die er liebt, damit [diejenigen], die aus ihm hervorgegangen sind, ebenfalls er werden können. Obwohl das gegenwärtige Zeitalter eine Einheit ist, wird es in Zeitabschnitte unterteilt; diese werden in Jahre unterteilt, die wiederum in Jahreszeiten, dann die Jahreszeiten in Monate, die Monate in Tage, die Tage in Stunden und die Stunden in Minuten. Ebenso wird [] das Zeitalter der Wahrheit, weil es eines und vieles ist, mit unbedeutenden wie auch bedeutenden Namen geehrt, je nachdem, was ein jeder erfassen kann.[b] Bildlich gesprochen gleicht es einer Quelle, die bleibt, was sie ist, und dennoch fließt und sich zu Bächen, Seen, Kanälen und Verzweigungen ausweitet. Oder es gleicht einer Wurzel,
    die sich unter Bäumen ausbreitet und sich mit deren Früchten verzweigt; oder einem menschlichen Körper, der auf untrennbare Weise in verschiedenartig verzweigte Glieder gegliedert ist – in vorrangige und nachgeordnete, große und kleine.


    Die Äonen brachten sich selbst hervor, im Einklang mit der dritten Frucht, aus freiem Willen und durch die Einsicht, die er ihnen zum Denken gab.[c] Sie wünschen nicht, gemeinsam mit dem Ehre darzubringen, was die einzelnen Füllen einmütig als Worte des [Lobpreises] hervorbrachten.[d] Ebenso wünschen sie nicht, gemeinsam mit der ganzen Gesamtheit Ehre darzubringen; auch wollen sie nicht gemeinsam mit irgendeinem einzelnen Äon verherrlichen, der einen höheren Ort oder Zustand als den seinen erreicht hat – es sei denn, er empfängt <das>, was von dem mit dem erhabeneren Namen und dem höheren Ort gewünscht wurde. [] Am höheren Ort nehmen sie einander auf. Und derjenige, der höher hinaufgelangen wollte, bringt sich – sozusagen – selbst hervor: Er bringt sich zusammen mit dem anderen und mit dem, was er ist, hervor. Zusammen mit demjenigen, der von seinem Bruder her zu ihm kam, wird er erneuert, während er ihn betrachtet und ihn wegen dieser Sache bittet.


    Damit dies auf diese Weise geschieht, sagt derjenige, der Ehre darbringen wollte, ihm darüber nichts außer diesem. Denn in der Fülle ist dem Reden eine Grenze gesetzt: So schweigen sie über die Unerfassbarkeit des Vaters, dürfen jedoch von ihrem Verlangen sprechen, ihn zu erfassen.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Ergänzungen, leeren Klammern [] und spitzen Klammern <…> geben die textkritischen Zeichen des zugrunde gelegten englischen Zeugnisses wieder. Leere Klammern weisen auf eine Lücke oder unsichere Auslassung hin; spitze Klammern kennzeichnen eine ergänzende Wiederherstellung.
    reason: Die Überlieferungssignale müssen sichtbar bleiben, da eine unmittelbare Prüfung am koptischen Text noch aussteht.
  - marker: b
    text: „Zeitalter“ gibt hier denselben Vorstellungsbereich wieder, der im folgenden Abschnitt mit dem Fachwort „Äonen“ bezeichnet wird. Die Formulierung „eines und vieles“ ist absichtlich paradox.
    reason: Verhindert, dass Leser die wechselnde Übersetzung für einen sicher nachweisbaren Wechsel verschiedener Ausgangswörter halten oder die Spannung glätten.
  - marker: c
    text: Wer mit „er“ gemeint ist und worauf „die dritte Frucht“ genau verweist, wird in diesem Ausschnitt nicht eindeutig bestimmt.
    reason: Bewahrt die referenzielle Unklarheit des überlieferten Zeugnisses.
  - marker: d
    text: „Fülle“ ist die zugängliche Wiedergabe des traditionsgeschichtlich oft mit „Pleroma“ bezeichneten Begriffs. Der ungewöhnliche Plural „Füllen“ folgt dem vorliegenden Zeugnis.
    reason: Erklärt einen zentralen Fachbegriff, ohne eine bestimmte systematische Deutung aufzuzwingen.
  - marker: e
    text: Diese Fassung beruht vorläufig auf dem angegebenen gemeinfreien englischen Übersetzungszeugnis zum koptischen Text des Nag-Hammadi-Kodex I,5. Eine direkte Prüfung am koptischen Manuskript steht noch aus.
    reason: Macht die begrenzte Quellengrundlage der vorläufigen deutschen Fassung transparent.
lexical_decisions:
- source_word: emanation
  choice: Hervorgehen
  rationale: Gibt den Vorgang würdig und verständlich wieder, ohne durch das stärker technisch vorgeprägte „Emanation“ oder das stofflich klingende „Ausströmen“ eine bestimmte metaphysische Deutung festzulegen.
- source_word: Totalities / Totality
  choice: Gesamtheiten / Gesamtheit
  rationale: Bewahrt den Wechsel zwischen Plural und Singular und vermeidet eine vorschnelle Gleichsetzung mit „All“ oder „Schöpfung“.
- source_word: existent one
  choice: das Seiende
  rationale: Erhält die ontologische Ausdrucksweise des Zeugnisses und lässt offen, ob eine personale oder abstraktere Bezeichnung beabsichtigt ist.
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte religionsgeschichtliche Fachbegriff ist hier präziser als „Zeitalter“, weil personale beziehungsweise hypostatische Größen gemeint sind.
- source_word: Fullness / Fullnesses
  choice: Fülle / Füllen
  rationale: Bewahrt Singular und ungewöhnlichen Plural des Zeugnisses; „Pleroma/Pleromata“ wäre für gewöhnliche Leser weniger zugänglich und stärker fachsprachlich.
- source_word: grasp
  choice: erfassen
  rationale: Kann sowohl geistiges Begreifen als auch das Streben nach einem nicht vollständig erreichbaren Erfassen ausdrücken.
theological_decisions:
- issue: Verhältnis der Gesamtheiten zum Vater
  choice: „Ausdehnung“ und „ebenfalls er werden können“ werden ohne abschwächende Erklärung beibehalten.
  alternative: Die Aussage als bloße Ähnlichkeit, Teilhabe oder Wesenseinheit ausdeuten.
  rationale: Der Abschnitt formuliert bewusst eine starke Einheit bei fortbestehender Vielheit; eine dogmatische Präzisierung würde die Spannung auflösen.
- issue: Das eine und viele Zeitalter der Wahrheit
  choice: Die paradoxe Formulierung „eines und vieles“ bleibt stehen.
  alternative: „eine Einheit aus vielen Teilen“ schreiben.
  rationale: Die Alternative würde den ontologischen Gegensatz in eine harmlose Zusammensetzung umdeuten.
- issue: Selbsthervorbringung der Äonen
  choice: „brachten sich selbst hervor“ wird wörtlich bewahrt.
  alternative: „wurden hervorgebracht“ oder „entfalteten sich“ schreiben.
  rationale: Die aktive Selbsthervorbringung ist für die Aussage wesentlich und darf nicht stillschweigend beseitigt werden.
- issue: Unerfassbarkeit und angestrebtes Erfassen des Vaters
  choice: Beide Aussagen werden nebeneinandergestellt.
  alternative: Das Erfassen als bloßes Annähern oder als tatsächlich vollendete Erkenntnis bestimmen.
  rationale: Der Text hält die Unerfassbarkeit des Vaters und das erlaubte Sprechen vom Wunsch, ihn zu erfassen, bewusst in Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichen Satzstrukturen; unvermeidbare Fachbegriffe werden sparsam eingesetzt und erläutert. Die eigentümlichen Wiederholungen, Paradoxien und unklaren Bezüge des Zeugnisses bleiben erhalten, statt konfessionell oder systematisch vereindeutigt zu werden.
