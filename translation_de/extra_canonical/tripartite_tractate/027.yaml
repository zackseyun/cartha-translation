translation:
  language: de
  text: 'Der Vater kannte ihn im Voraus; denn bevor irgendetwas anderes existierte, wohnte er in seinen Gedanken. Dort besaß er auch jene, um derentwillen er ihn offenbarte. Den Mangel legte er auf das, was nur für vorübergehende Zeiträume fortbesteht, zur Herrlichkeit seiner Fülle. Dass er unbekannt war, veranlasste ihn, seine Güte zu zeigen, [indem er Erkenntnis über sich selbst schenkte].[a]


    […][b] Auf diese Weise erlangte er Erkenntnis über ihn[c] als eine Bekundung seines Wohlwollens und als Offenbarung des Reichtums seiner Güte, die die zweite Herrlichkeit ist. So hat er sich auch als Ursache der Unwissenheit erwiesen, obwohl er Erkenntnis hervorbringt: eine verborgene und unbegreifliche Weisheit, in der er die Erkenntnis bis zum Ende bewahrt. Dann werden sich die Allheiten[d] bei ihrer Suche nach Gott, dem Vater, völlig verausgabt haben, den niemand durch eigene Weisheit oder Kraft ergründet hat. Er geruht, ihnen die Erkenntnis der großen Gabe des ausgezeichneten Gedankens zu gewähren, durch unaufhörliche Danksagung an ihn. Aufgrund seines unerschütterlichen Ratschlusses offenbart er sich auf ewig denen, die durch seinen Willen der Erkenntnis des Vaters für würdig erachtet wurden. Der Vater kann seinem Wesen nach nicht erkannt werden; doch in seinem Vorherwissen war geplant, dass sie Erkenntnis und alles Gute, das mit ihr einhergeht, erlangen könnten – zusammen mit dem
    Schmecken der Unwissenheit und ihrer Schmerzen.


    Auf diese Weise sollten sie dazu kommen, die bösen Dinge zu schmecken, und sich durch sie […] eine Zeit lang üben können, damit sie für immer den [Genuss der guten Dinge] erlangen könnten.[e] […] Sie setzen sich dem aus[f] und werden von ihren Feinden fortwährend abgewiesen und verleumdet; dies betrachten sie als einen Schmuck und als ein wunderbares Kennzeichen erhabener Dinge. Dadurch sollte deutlich werden, dass die Unwissenheit derer, die den Vater nicht kennen, ihr eigenes Werk war – im Gegensatz zu seiner Kraft, die es ihnen ermöglichte, Erkenntnis über ihn zu erlangen.


    Diese Erkenntnis wird mit Recht „die Erkenntnis jedes möglichen Gedankens“ und „der Schatz“ genannt. Und um die Erkenntnis noch weiter zu vermehren: Sie ist die Offenbarung derer, die am Anfang erkannt waren, der Weg zur Einheit und der Vorherbestehende.[g] Daraus folgt: Diejenigen wachsen an Größe, die jene Größe aufgegeben haben, die ihnen im Heilsplan gemäß dem göttlichen Willen bestimmt war, damit das Ende dem Anfang gleichen könnte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter „indem er Erkenntnis über sich selbst schenkte“ stehen in der Vorlage als ergänzte beziehungsweise rekonstruierte Passage.
    reason: Kennzeichnet eine textkritische Ergänzung.
  - marker: b
    text: An dieser Stelle weist die überlieferte Vorlage eine Lücke auf.
    reason: Bewahrt das Signal für beschädigten oder fehlenden Text.
  - marker: c
    text: Die Bezugspersonen von „er“ und „ihn“ sind in der zugrunde liegenden Übersetzungszeugnis nicht eindeutig.
    reason: Macht echte referenzielle Mehrdeutigkeit sichtbar.
  - marker: d
    text: „Allheiten“ gibt einen technischen Sammelbegriff für die Gesamtheit der hervorgebrachten Wirklichkeiten oder Wesen wieder; der genaue Umfang bleibt offen.
    reason: Erläutert einen ungebräuchlichen kosmologischen Fachausdruck, ohne ihn festzulegen.
  - marker: e
    text: Die Auslassung und die Wörter „Genuss der guten Dinge“ kennzeichnen beschädigten beziehungsweise ergänzten Text.
    reason: Dokumentiert Lücke und Rekonstruktion im selben Satz.
  - marker: f
    text: 'Wörtlich nach dem englischen Zeugnis: „Sie setzen sich selbst aus“. Was genau damit gemeint ist, bleibt unklar.'
    reason: Kennzeichnet eine semantisch unsichere Stelle der vorläufigen Übersetzungsgrundlage.
  - marker: g
    text: Ob „der Vorherbestehende“ eine Person, den Weg oder eine andere Wirklichkeit bezeichnet, ist nicht sicher zu bestimmen.
    reason: Bewahrt die syntaktische und theologische Mehrdeutigkeit.
lexical_decisions:
- source_word: Fullness
  choice: Fülle
  rationale: Bewahrt den technischen, im Traktat kosmologisch geprägten Begriff, bleibt aber auch für heutige Leser verständlich.
- source_word: deficiency
  choice: Mangel
  rationale: Gibt den Gegenbegriff zur „Fülle“ knapp wieder, ohne ihn dogmatisch als Sünde, Fall oder Materie auszulegen.
- source_word: Totalities
  choice: Allheiten
  rationale: Kennzeichnet den ungewöhnlichen kollektiven Fachbegriff und vermeidet die verengende Wiedergabe als bloß „alle Menschen“.
- source_word: knowledge
  choice: Erkenntnis
  rationale: Passt zum offenbarungstheologischen Zusammenhang besser als das rein sachliche „Wissen“ und wird im Abschnitt konsequent verwendet.
- source_word: sweetness
  choice: Güte
  rationale: Natürliches, würdevolles Deutsch; das wörtliche „Süße“ wäre hier missverständlich. Der Bedeutungsbereich von Freundlichkeit und wohltuender Güte bleibt erhalten.
- source_word: pre-existent one
  choice: der Vorherbestehende
  rationale: Bewahrt die substantivische und personhaft mögliche Form des Zeugnisses, ohne die unklare Referenz zu bestimmen.
- source_word: plan of salvation
  choice: Heilsplan
  rationale: Ist die natürliche deutsche Entsprechung und macht keine zusätzliche konfessionelle Aussage.
theological_decisions:
- issue: Gott als Ursache der Unwissenheit und zugleich Geber der Erkenntnis
  choice: Die Spannung wird ausdrücklich beibehalten.
  alternative: Die Unwissenheit ausschließlich den Geschöpfen oder einem bösen Urheber zuschreiben.
  rationale: Das Zeugnis stellt beide Aussagen nebeneinander; eine Harmonisierung würde seine Theologie verändern.
- issue: Unerkennbarkeit des Vaters und gewährte Erkenntnis
  choice: Der Vater bleibt seinem Wesen nach unerkennbar, gewährt jedoch Erkenntnis über sich.
  alternative: Zwischen völligem Nichterkennen und vollständiger Wesensschau entscheiden.
  rationale: Der Abschnitt hält Transzendenz und Offenbarung bewusst zusammen.
- issue: Mehrdeutige Pronomen in „he obtained knowledge regarding him“
  choice: „er“ und „ihn“ bleiben unaufgelöst.
  alternative: Beide Pronomen ausdrücklich auf den Vater oder auf eine andere Gestalt beziehen.
  rationale: Die vorliegende Zeugengrundlage erlaubt keine sichere Identifizierung der Referenten.
- issue: Eigenverantwortung der Unwissenden gegenüber göttlicher Ermöglichung
  choice: Beide Seiten werden kontrastierend wiedergegeben.
  alternative: Prädestination oder freien Willen einseitig hervorheben.
  rationale: Der Text verbindet menschliche Verantwortlichkeit mit göttlicher Befähigung, ohne die Spannung systematisch aufzulösen.
- issue: Paradox des Wachstums durch Aufgabe der bestimmten Größe
  choice: Die paradoxe Schlussaussage bleibt stehen.
  alternative: „aufgegeben“ als „erlangt“ oder „angenommen“ emendieren.
  rationale: Ohne direkte koptische Prüfung wäre eine solche Glättung spekulativ.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenen Fachbegriffen und paradoxen Aussagen. Die Fassung ist vorläufig, da keine direkte Prüfung des koptischen Textes vorliegt; sie beruht auf dem angegebenen gemeinfreien englischen Zeugnis. Eckige Klammern und Auslassungspunkte bewahren dessen Hinweise auf Rekonstruktionen und Textlücken.
