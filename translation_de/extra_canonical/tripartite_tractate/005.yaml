translation:
  language: de
  text: 'Das All[a]


    Der Vater brachte das All hervor wie ein kleines Kind, wie einen Tropfen aus einer Quelle, wie eine Blüte von [einem Weinstock], wie [eine Blume], wie eine <Pflanzung> […], sodass es [Nahrung], Wachstum und Vollkommenheit erlangen musste. Eine Zeit lang hielt er es zurück. Er, der es vom ersten Augenblick des Anfangs an erdacht hatte, besaß und schaute es vom ersten Augenblick des Anfangs an; doch er <verbarg> es vor denen, die als Erste aus ihm hervorgingen. Das tat er nicht aus Neid, sondern damit die Äonen ihre Vollkommenheit nicht schon vorzeitig, vom ersten Augenblick des Anfangs an, empfingen, sich nicht zu der Herrlichkeit erhoben, die allein dem Vater gehört, und nicht meinten, dies alles aus sich selbst zu besitzen. Vielmehr wollte er ihnen ermöglichen, ins Dasein zu treten und auch als vollkommene Wesen ins Dasein zu treten. Darum gewährte er ihnen zu der von ihm bestimmten Zeit die vollkommene Erkenntnis seiner Freigebigkeit ihnen gegenüber.


    Denjenigen, den er zum Licht für jene erhob, die aus ihm selbst hervorgegangen waren, und von dem sie ihren Namen erhalten, ihn brachte er als den vollen, vollständigen und vollkommenen Sohn hervor. Er brachte ihn hervor, vermischt mit dem, was aus ihm hervorgegangen war, [] […] teilhabend an der Herrlichkeit […] das All, übereinstimmend mit […], wodurch jeder [fähig] ist, es in [sich] aufzunehmen, obwohl keiner diese Größe besaß, bevor sie von ihr aufgenommen wurden. Sie bestehen vielmehr nur teilweise in seiner eigenen Seinsweise, Gestalt und Größe. [Sie] können ihn sehen und von dem sprechen, [was sie] über ihn wissen, weil sie einander tragen, weil sie [ihn] erfassen können. Seine Seinsweise hingegen ist ohne Vergleich. So kann der Vater von jedem Einzelnen Ehre empfangen und sich trotz seiner Unvergleichlichkeit offenbaren. Während er verborgen und unsichtbar ist, staunen sie in ihrem Denken über ihn. Die Größe seiner Erhabenheit wird daher offenbar, wenn sie von ihm sprechen, ihn
    schauen und ihn wegen des Reichtums seiner Güte in Hymnen preisen.'
  philosophy: optimal-equivalence
  footnotes:
