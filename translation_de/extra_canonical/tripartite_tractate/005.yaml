lexical_decisions:
- source_word: the All
  choice: das All
  rationale: Bewahrt den kosmologischen Fachausdruck des Traktats und vermeidet die stärkere Konkretisierung durch „Schöpfung“ oder „Universum“.
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte deutsche Fachausdruck wahrt die besondere kosmologische Bedeutung, ohne sie als bloße Zeitabschnitte umzudeuten.
- source_word: produced / brought forth
  choice: brachte … hervor
  rationale: Gibt das Hervorgehen aus dem Vater natürlich wieder, ohne die Art dieses Hervorbringens metaphysisch genauer festzulegen.
- source_word: perfect idea
  choice: vollkommene Erkenntnis
  rationale: „Erkenntnis“ ist im Kontext verständlicher als das missverständliche „Idee“, während die epistemische Aussage des Zeugnisses erhalten bleibt.
- source_word: generosity
  choice: Freigebigkeit
  rationale: Bezeichnet das großzügige Gewähren des Vaters und vermeidet eine konfessionell aufgeladene Vorentscheidung durch „Gnade“.
- source_word: mode of being
  choice: Seinsweise
  rationale: Gibt die ontologische Aussage würdig und knapp wieder, ohne sie systematisch auszudeuten.
- source_word: they wear each other
  choice: sie tragen einander
  rationale: Die ungewöhnliche, möglicherweise technische Bildsprache bleibt bewusst offen und wird nicht erklärend aufgelöst.
- source_word: sweetness
  choice: Güte
  rationale: Im Deutschen bezeichnet „Güte“ die anziehende, wohltuende Qualität idiomatischer als das körperlich klingende „Süße“, ohne „Gnade“ einzutragen.
theological_decisions:
- issue: Verzögerte Vollkommenheit der Äonen
  choice: Als pädagogisch bestimmte Zurückhaltung und nicht als Neid wiedergegeben
  alternative: Die Passage als ontologische Unfähigkeit oder als Strafe zu deuten
  rationale: Der Text nennt ausdrücklich den fehlenden Neid und verbindet die Verzögerung mit der vom Vater bestimmten Zeit; weitergehende Systematisierung wäre interpretierend.
- issue: Einzigartige Herrlichkeit des Vaters
  choice: „die allein dem Vater gehört“
  alternative: „die vor allem dem Vater gehört“
  rationale: Das im Zeugnis ausdrücklich markierte Ausschließlichkeitsmoment wird bewahrt.
- issue: Beziehung des vollkommenen Sohnes zum Hervorgegangenen
  choice: Die schwer verständliche Formulierung „vermischt mit dem, was aus ihm hervorgegangen war“ bleibt stehen
  alternative: Sie als Wesenseinheit, Inkarnation oder Vermengung bestimmter Hypostasen zu erklären
  rationale: Der beschädigte Kontext erlaubt keine sichere dogmatische Präzisierung.
- issue: Unvergleichlichkeit und Offenbarung des Vaters
  choice: Beide Aussagen bleiben spannungsvoll nebeneinander bestehen
  alternative: Die Offenbarung als vollständige Erfassung oder die Verborgenheit als absolute Unerkennbarkeit auszulegen
  rationale: Der Abschnitt verbindet ausdrücklich Unvergleichlichkeit, Verborgenheit und tatsächliche Offenbarung.
