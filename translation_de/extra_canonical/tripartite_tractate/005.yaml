    text: Vorläufige Übersetzung nach dem bereitgestellten gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung am koptischen Text des Nag-Hammadi-Codex I,5 steht noch aus. Eckige Klammern, leere Klammern, Auslassungspunkte und spitze Klammern geben die überlieferten textkritischen beziehungsweise editorischen Zeichen wieder.
