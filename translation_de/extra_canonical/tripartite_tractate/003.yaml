review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt dessen paradoxe, spekulative Aussagen. Einige Formulierungen glätten jedoch die genaue Bildlichkeit bzw. die überlieferte Unbestimmtheit: „miteinander verbunden“ ergänzt gegenüber „inseparable“ eine Relation, „unstillbar“ passt im Deutschen weniger gut zu „Gedanke“, und die zweite Textlücke sollte an ihrer tatsächlichen Position vor „auf dem Sohn“ sichtbar bleiben. Eine direkte Prüfung des Koptischen steht laut Kontext noch aus.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. Die überarbeitete Fassung verbessert insbesondere den Satz über die Küsse und die syntaktische Transparenz der Selbstoffenbarung, ohne die absichtlich schwierige Begrifflichkeit zu normalisieren.
  terminology: „Gemeinde“, „ungezeugt“, „die Seienden“, „Äonen“ und „ruht“ sind für den englischen Brückenzeugen sachgerecht. „Ein einziger Sohn“ wahrt die nicht weiter harmonisierte Aussage. Die eckigen Klammern bleiben als Kennzeichnung von Lücken bzw. editorischen Ergänzungen erhalten.
  issues:
  - severity: medium
    issue: Die zweite Textlücke ist im Lauftext nicht an der Stelle des Zeugen kenntlich.
    rationale: Der Zeuge hat „reposes [] on the Son“. Die Fassung „ruht [c]“ verlegt die sichtbare Markierung hinter das Verb; die Lücke muss vor „auf dem Sohn“ stehen bleiben.
  - severity: low
    issue: „untrennbar miteinander verbunden“ ist gegenüber „inseparable“ leicht ausdeutend.
    rationale: „Untrennbar“ gibt die Aussage vollständig wieder, während „miteinander verbunden“ zusätzlich eine ausdrücklich relationale Verbindung behauptet.
  - severity: low
    issue: „unstillbarer Gedanke“ ist im Deutschen semantisch und stilistisch weniger passend.
    rationale: Für „insatiable thought“ ist „unersättlicher Gedanke“ die nähere und idiomatischere Wiedergabe, auch wenn das Bild bewusst ungewöhnlich bleibt.
  revised_text: 'Nicht allein der Sohn existierte von Anfang an; auch die Gemeinde existierte von Anfang an. Wer meint, die Erkenntnis, dass der Sohn ein einziger Sohn ist, widerspreche dieser Aussage, weil der Gegenstand rätselhaft ist, irrt sich. So wie [a] der Vater eine Einheit ist und sich nur sich selbst als Vater offenbart hat, so wurde auch der Sohn als Bruder nur sich selbst offenbar, weil er ungezeugt und ohne Anfang ist. Der Vater staunt über sich selbst [als] Vater und gibt [sich selbst Herrlichkeit] und Ehre und [Liebe].[b] Darüber hinaus begreift er sich selbst auch als Sohn, im Einklang mit den Eigenschaften der Anfangslosigkeit und Endlosigkeit. So wird die Sache bestätigt.



    Seine unzähligen und grenzenlosen Nachkommen sind untrennbar. Die Seienden sind aus dem Sohn und dem Vater hervorgegangen wie Küsse von Menschen, die einander mit einem guten und unersättlichen Gedanken küssen: Die Umarmung ist eine einzige, obwohl sie viele Küsse umfasst. Gemeint ist, dass die Gemeinde aus vielen Einzelnen besteht, die vor den Äonen existierten; im eigentlichen Sinn wird sie »die Äonen der Äonen« genannt. Dies ist das Wesen der unvergänglichen heiligen Geister, auf denen der Sohn ruht, weil dies seine Natur ist – so wie auch der Vater [c] auf dem Sohn ruht.'
