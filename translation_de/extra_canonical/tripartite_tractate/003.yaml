lexical_decisions:
- source_word: Church
  choice: Gemeinde
  rationale: Bezeichnet hier die uranfängliche geistige Gemeinschaft und vermeidet die vorrangig institutionelle Nebenbedeutung von »Kirche«; die Großschreibung des englischen Zeugen ist im Deutschen grammatisch nicht abbildbar.
- source_word: only son
  choice: ein einziger Sohn
  rationale: Bewahrt die Aussage des Zeugen, ohne sie vorschnell mit dem theologisch stärker festgelegten Ausdruck »eingeborener Sohn« gleichzusetzen.
- source_word: unbegotten
  choice: ungezeugt
  rationale: Gibt die ontologische Aussage möglichst formal wieder und unterscheidet sie von »ungeschaffen«.
- source_word: offspring
  choice: Nachkommen
  rationale: Bewahrt das Abstammungsbild, ohne Geschlecht oder genaue Hervorbringungsweise festzulegen.
- source_word: those who exist
  choice: die Seienden
  rationale: Erhält den abstrakt-ontologischen Charakter des Ausdrucks.
- source_word: aeons
  choice: Äonen
  rationale: Behält den fachsprachlichen kosmologischen Begriff bei, da »Zeitalter« die möglichen personalen oder hypostatischen Bezüge verengen würde.
- source_word: reposes
  choice: ruht
  rationale: Bewahrt das wechselseitige Ruhebild, ohne es als bloßes Wohnen oder Herrschen auszulegen.
theological_decisions:
- issue: Verhältnis von Sohn und uranfänglicher Gemeinde
  choice: Beide werden ausdrücklich als von Anfang an existierend dargestellt.
  alternative: Die Gemeinde als erst später geschaffene historische Institution zu verstehen.
  rationale: Der Zeuge behauptet ihre anfängliche Existenz ausdrücklich; die Übersetzung darf diese Spannung zur Einzigkeit des Sohnes nicht auflösen.
- issue: Der Sohn als Bruder seiner selbst
  choice: Die paradoxe Formulierung wird beibehalten.
  alternative: Sie erklärend auf die Glieder der Gemeinde oder andere geistige Wesen zu beziehen.
  rationale: Der Text ist ausdrücklich rätselhaft und lässt den genauen Referenzzusammenhang offen.
- issue: Der Vater begreift sich als Sohn
  choice: Die Aussage wird direkt und ohne trinitarische Harmonisierung wiedergegeben.
  alternative: Sie als bloße Voraussicht, Zeugung oder Offenbarung des Sohnes umzudeuten.
  rationale: Der überlieferte Zeuge formuliert eine Identitäts- beziehungsweise Selbstauffassungsrelation, deren Spannung erhalten bleiben soll.
- issue: »Äonen der Äonen«
  choice: Als Eigenbezeichnung der vielgliedrigen Gemeinde wiedergegeben.
  alternative: Idiomatistisch als »Ewigkeit der Ewigkeiten« zu übersetzen.
  rationale: Im kosmologischen Zusammenhang bezeichnet »Äonen« wahrscheinlich mehr als bloße Zeiträume; die Mehrdeutigkeit bleibt gewahrt.
- issue: Wechselseitiges Ruhen
  choice: Der Sohn ruht auf den heiligen Geistern, der Vater auf dem Sohn.
  alternative: »in« statt »auf« zu setzen oder das Bild als Einwohnung auszulegen.
  rationale: Die Präposition und das Bild des Zeugen werden trotz ihrer ungewöhnlichen Theologie nicht geglättet.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst erhaltener spekulativ-ontologischer Dichte. Ungewöhnliche Bilder und Paradoxien wurden nicht konfessionell harmonisiert. Der Entwurf ist wegen der noch ausstehenden direkten Prüfung des koptischen Textes vorläufig und stützt sich auf den angegebenen gemeinfreien englischen Zeugen.
