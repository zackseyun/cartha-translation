translation:
  language: de
  text: 'Nicht nur der Sohn war von Anfang an da, sondern auch die Gemeinde war von Anfang an da. Wer meint, die Erkenntnis, dass der Sohn ein einziger Sohn ist, widerspreche dieser Aussage, weil der Gegenstand rätselhaft ist, irrt sich. Wie [a] der Vater eine Einheit ist und sich keinem anderen als sich selbst als Vater offenbart hat, so wurde auch der Sohn keinem anderen als sich selbst als Bruder offenbar, denn er ist ungezeugt und ohne Anfang. Der Vater staunt über sich selbst [als] Vater und gibt [sich selbst Herrlichkeit], Ehre und [Liebe].[b] Darüber hinaus begreift er sich selbst auch als Sohn, im Einklang damit, dass er ohne Anfang und ohne Ende ist. So wird die Sache bestätigt.


    Seine unzähligen und grenzenlosen Nachkommen sind untrennbar miteinander verbunden. Die Seienden sind aus dem Sohn und dem Vater hervorgegangen wie Küsse von Menschen, die einander mit einem guten und unstillbaren Gedanken küssen: Die Umarmung ist eine einzige, obwohl sie viele Küsse umfasst. Gemeint ist, dass die Gemeinde aus vielen Einzelnen besteht, die schon vor den Äonen existierten; sie wird im eigentlichen Sinn »die Äonen der Äonen« genannt. Dies ist das Wesen der unvergänglichen heiligen Geister, auf denen der Sohn ruht, weil dies seine Natur ist – so wie auch der Vater auf dem Sohn ruht [c].'
  philosophy: optimal-equivalence
