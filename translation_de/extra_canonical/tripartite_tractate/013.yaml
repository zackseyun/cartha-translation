review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung bewahrt die Gliederung, die textkritischen Zeichen und die meisten unaufgelösten kosmologischen Bezüge zuverlässig. Einige Formulierungen verschieben jedoch den vermittelten englischen Wortlaut: Insbesondere wird die Ruhmsucht als aus den vorangehenden Größen „erwachsend“ statt als antreibende Kraft dargestellt; auch „succeeded“ wird besser nicht als „setzten sich durch“ gedeutet. Die Aussage über die mit den <Namen> verbundenen Kräfte sollte weniger stark als „ausgestattet“ konkretisiert werden.'
  naturalness: Das Deutsch ist überwiegend würdig und gut lesbar. „Die Ordnung der Wesen dieser Art“ und „die zum Ähnlichen gehörten“ ergänzen gegenüber der Vorlage unnötig „Wesen“ beziehungsweise eine Zugehörigkeitsbeziehung. „derer dieser Art“ und „derer der Ähnlichkeit“ sind zwar bewusst fachsprachlich, bewahren aber die offene Terminologie besser. Die fragmentarischen Abschnitte bleiben absichtlich rau.
  terminology: „das Wort“, „Erinnerung“, „Ordnungen“, „Herrschgier“ und „urexistente Füllen“ sind konsistent. „Füllen“ bleibt als ungewohnter, aber möglicher Plural von „Fülle“ mit kosmologischem Sinn durch die Anmerkung abgesichert. Die Termini „Ähnlichkeit/Ähnlichkeiten“ werden ohne weitergehende Systematisierung beibehalten.
  issues:
  - severity: medium
    issue: Kausaler Bezug der Ruhmsucht
    rationale: „Aus ihnen erwuchs eine leere Ruhmsucht“ macht die Ruhmsucht zu einem Erzeugnis der zuvor genannten Kräfte und Naturen. Der englische Zeuge besagt vorsichtiger, dass die nichtige Ruhmsucht sie „from these“ zum Herrschaftsstreben antrieb. Die revidierte Formulierung wahrt diese Kausalbewegung ohne eine Entstehungsaussage.
  - severity: medium
    issue: Deutung von „succeeded“
    rationale: „setzten sich durch“ bedeutet, dass Neid, Zorn usw. die Oberhand gewannen. „succeeded“ kann hier dagegen schlicht ein Aufeinanderfolgen bezeichnen. „folgten aufeinander“ vermeidet die nicht abgesicherte Erfolgs- bzw. Dominanzdeutung.
  - severity: low
    issue: Überkonkretisierung bei den Kräften und den Ordnungen
    rationale: „ausgestattet“ für „made ready with“ sowie „Wesen“ und „gehörten zu“ fügen konkrete Beziehungen hinzu. Die Revision bleibt näher bei „bereitgemacht zusammen mit“ sowie den offenen Gruppenbezeichnungen des Zeugen.
  - severity: low
    issue: Schlussbezug von „hervorgebracht“
    rationale: Die deutsche Satzstellung soll nicht festlegen, ob das abschließende Partizip sich auf das Licht oder auf das Leben bezieht. Die revidierte participiale Konstruktion erhält die syntaktische Offenheit.
  revised_text: 'Die anderen waren stärker von der Gier nach Herrschaft erfüllt, weil sie angesehener [] waren als jene früheren, die sich gegen sie erhoben hatten. Diese weigerten sich, sich zu demütigen. Sie meinten, sie seien aus sich selbst hervorgegangen und ohne Anfang; was das Hervorbringen anging, hielten sie sich für die Ersten, die andere hervorgebracht hatten. Die beiden Ordnungen führten gegeneinander Krieg und kämpften aufgrund ihrer Wesensart um die Herrschaft. Infolgedessen wurden sie von Kräften und Naturen überflutet, die den gegenseitigen Kampf verkörpern und von Herrschgier und allem, was ihr gleicht, erfüllt waren. Von diesen aus trieb die nichtige Ruhmsucht sie dazu, nach Herrschaft zu verlangen; doch keiner von ihnen besaß den erhabenen Gedanken oder erkannte ihn.



    Die Kräfte dieses Gedankens wurden zusammen mit den <Namen> der <Urexistenten> bereitgemacht, deren Abbilder sie sind.[a] Die Ordnung derer dieser Art war untereinander in Einklang. Sie kämpften jedoch gegen die Ordnung derer der Ähnlichkeit, während die Ordnung der Ähnlichkeit gegen die Ähnlichkeiten Krieg führte und in ihrem Zorn gegen sie vorging.[b] [] Daraus [geschah es ... ihr] Eigenes [gegen]einander, viele [...] die Notwendigkeit stellte sie auf [...] damit sie siegen konnten [...] er hörte nicht auf [...] und ihr Neid, [ihr] Zorn, ihre Gewalttätigkeit, ihre Begierde und ihre Unwissenheit folgten aufeinander und brachten verschiedenartige Materie und Kräfte unterschiedlicher Art hervor, die in großer Zahl miteinander vermischt waren. Das Wort aber, das ihre Hervorbringung verursacht hatte, erwartete in seinem Denken eine Offenbarung der [Hoffnung], die ihm von oben kommen sollte.[c]



    Als das Wort sich regte, empfing es Hoffnung und Erwartung auf den Erhabenen hin. Von denen, die zum Schatten gehörten, entfernte es sich völlig, denn sie führten Krieg gegen es und demütigten sich nicht im Geringsten vor ihm. Ruhe fand es jedoch bei denen, die zur Erinnerung gehörten. Im Blick auf diejenigen, die durch die Erinnerung entstanden waren, brachte das Wort auf unsichtbare Weise und ihrem Wesen entsprechend den hervor, der in die Höhe aufstieg und an den dachte, dem etwas gefehlt hatte. So geschah es, bis das Licht von oben auf ihn herableuchtete, Leben spendend, hervorgebracht durch den Gedanken brüderlicher Liebe unter den urexistenten Füllen.[d]'
