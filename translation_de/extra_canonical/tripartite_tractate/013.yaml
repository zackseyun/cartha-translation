  register: Modernes, würdiges Standarddeutsch mit behutsam beibehaltener kosmologischer Fachsprache. Die Fassung ist wegen der noch ausstehenden direkten Prüfung des koptischen Textes ausdrücklich quellenkritisch vorläufig; Lücken, unsichere Ergänzungen und schwer auflösbare Bezüge wurden nicht geglättet.
