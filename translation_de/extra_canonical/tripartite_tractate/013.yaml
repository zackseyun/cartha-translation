base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/013.yaml
  text: 'The others had a stronger lust for control because they were more honorable [] than the former ones, who had risen up against them. They refused to humble themselves, thinking that they had originated from themselves and had no beginning, and, as for giving birth, that they were the first to give birth to others. The two orders warred against each other, battling for control because of their way of being. As a result, they were flooded with powers and natures that typify mutual combat, possessing lust for control and everything else like it. From these things, empty love of glory drove them to desire control, although not one of them possessed the exalted thought or recognized it.


    The forces of this thought were prepared with the <names> of the pre-existent <ones>, whose representations they are. The order of those of this kind had harmony among themselves. They, however, battled against the order of those of the likeness, while the order of those of the likeness waged war against the likenesses and acted against them in its fury. [] From this it [took place ... their] own [against] each other, many [. . .] necessity positioned them [. . .] so they could prevail [. . .] he did not cease [. . .] and their envy and [their] fury and violence and lust and ignorance succeeded, producing diverse kinds of matter and powers of different kinds, intermixed in great numbers. Meanwhile, the Word, who caused them to be begotten, was awaiting in his mind a revelation of the [hope] that was to come to him from above.


    As the Word roused himself, he received hope and expectation for the Exalted One. As for those of the shadow, he distanced himself from them completely because they warred against him and did not humble themselves before him in the least. But he found rest in those who belonged to memory. As for those who came into being through memory, the Word produced, in an unseen manner and in agreement with their nature, the one who ascended on high, remembering the one who had been deficient, until the light shone on him from above, bestowing life, begotten by the thought of brotherly love among the pre-existent Fullnesses.'
translation:
  language: de
  text: 'Die anderen waren stärker von der Gier nach Herrschaft erfüllt, weil sie angesehener [] waren als jene früheren, die sich gegen sie erhoben hatten. Diese weigerten sich, sich zu demütigen. Sie meinten, sie seien aus sich selbst hervorgegangen und ohne Anfang; was das Hervorbringen anging, hielten sie sich für die Ersten, die andere hervorgebracht hatten. Die beiden Ordnungen führten gegeneinander Krieg und kämpften aufgrund ihrer Wesensart um die Herrschaft. Infolgedessen wurden sie von Kräften und Naturen überflutet, die für den gegenseitigen Kampf kennzeichnend sind und von Herrschgier und allem, was ihr gleicht, erfüllt waren. Aus ihnen erwuchs eine leere Ruhmsucht, die sie nach Herrschaft verlangen ließ; doch keiner von ihnen besaß den erhabenen Gedanken oder erkannte ihn.


    Die Kräfte dieses Gedankens wurden mit den <Namen> der <Urexistenten> ausgestattet, deren Abbilder sie sind.[a] Die Ordnung der Wesen dieser Art war untereinander in Einklang. Sie kämpften jedoch gegen die Ordnung derer, die zum Ähnlichen gehörten; die Ordnung des Ähnlichen wiederum führte Krieg gegen die Ähnlichkeiten und ging in ihrem Zorn gegen sie vor.[b] [] Daraus [geschah es ... ihr] eigenes [gegen]einander, viele [...] die Notwendigkeit stellte sie auf [...] damit sie siegen konnten [...] er hörte nicht auf [...] und ihr Neid, [ihr] Zorn, ihre Gewalttätigkeit, ihre Begierde und ihre Unwissenheit setzten sich durch. So brachten sie verschiedenartige Materie und Kräfte unterschiedlicher Art hervor, die in großer Zahl miteinander vermischt waren. Das Wort aber, das ihre Hervorbringung verursacht hatte, erwartete in seinem Denken eine Offenbarung der [Hoffnung], die ihm von oben kommen sollte.[c]


    Als das Wort sich regte, empfing es Hoffnung und Erwartung im Blick auf den Erhabenen. Von denen, die zum Schatten gehörten, entfernte es sich völlig, denn sie führten Krieg gegen es und demütigten sich nicht im Geringsten vor ihm. Ruhe fand es jedoch bei denen, die zur Erinnerung gehörten. Im Blick auf diejenigen, die durch die Erinnerung entstanden waren, brachte das Wort auf unsichtbare Weise und ihrem Wesen entsprechend den hervor, der in die Höhe aufstieg und an den dachte, dem etwas gefehlt hatte. So geschah es, bis das Licht von oben auf ihn herableuchtete und Leben schenkte — hervorgebracht durch den Gedanken brüderlicher Liebe unter den urexistenten Füllen.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Winkelklammern kennzeichnen editorisch ergänzte Wörter; der überlieferte Text ist an dieser Stelle nicht vollständig sicher.
    reason: Die Ergänzungen <Namen> und <Urexistenten> müssen als Rekonstruktionen sichtbar bleiben.
  - marker: b
    text: Die Ausdrücke „das Ähnliche“ und „die Ähnlichkeiten“ geben die schwer deutbare Unterscheidung der Vorlage wieder; ihr genauer kosmologischer Bezug bleibt offen.
    reason: Verhindert eine unbelegte Gleichsetzung verschiedener Gruppen.
  - marker: c
    text: Eckige Klammern und Auslassungspunkte zeigen beschädigten oder fehlenden Text an. Der Zusammenhang dieses Abschnitts lässt sich daher nicht sicher rekonstruieren.
    reason: Die starke Fragmentierung beeinflusst Syntax, Subjektbezüge und Sinn.
  - marker: d
    text: „Füllen“ steht hier bewusst im Plural. Gemeint sind kosmologische Größen; die genaue Beziehung zwischen dem Licht, dem Leben und dem Gedanken brüderlicher Liebe bleibt syntaktisch mehrdeutig.
    reason: Bewahrt den ungewöhnlichen Plural und die theologische Offenheit des Schlusssatzes.
lexical_decisions:
- source_word: lust for control
  choice: Gier nach Herrschaft / Herrschgier
  rationale: Gibt das wiederholte Motiv eines leidenschaftlichen, ungeordneten Herrschaftsstrebens natürlich und deutlich wieder, ohne es zu bloßem Verwaltungswillen abzuschwächen.
- source_word: orders
  choice: Ordnungen
  rationale: Bewahrt den kosmologischen und kollektiven Sinn, ohne die Gruppen vorschnell als Klassen oder Rangstufen festzulegen.
- source_word: the Word
  choice: das Wort
  rationale: Bewahrt die traditionelle personifizierte Bezeichnung und ihr mögliches Logos-Gewicht; das grammatische Neutrum wird in den Pronomen beibehalten.
- source_word: memory
  choice: Erinnerung
  rationale: Bewahrt den abstrakten, offenbar personifizierten kosmologischen Begriff der Vorlage.
- source_word: Fullnesses
  choice: Füllen
  rationale: Gibt den Plural wörtlich wieder und erhält die fachsprachliche kosmologische Eigenart; eine Vereinheitlichung zu „Fülle“ würde die Mehrzahl beseitigen.
- source_word: pre-existent
  choice: urexistent
  rationale: Drückt ein Dasein vor den geschilderten Hervorbringungen aus und eignet sich als substantivierte kosmologische Bezeichnung.
theological_decisions:
- issue: Person und Genus des „Wortes“
  choice: „das Wort“ mit neutralen Pronomen
  alternative: „der Logos“ mit männlichen Pronomen
  rationale: Die Vorlage bezeichnet eine personifizierte Größe, legt in der verfügbaren englischen Vermittlung aber keine eindeutige konfessionelle Identifikation fest. Die traditionelle deutsche Form wahrt Personifikation und Offenheit.
- issue: Bezug von „the one who ascended ... remembering ...“
  choice: Die syntaktische Mehrdeutigkeit wird weitgehend erhalten
  alternative: Das Wort selbst ausdrücklich als Aufsteigenden oder Erinnernden bestimmen
  rationale: Der beschädigte und komplexe Satz erlaubt keine sichere Auflösung der Rollen; eine explizite Identifikation würde die theologische Spannung glätten.
- issue: „pre-existent Fullnesses“
  choice: „urexistente Füllen“ im Plural
  alternative: „präexistente Wesen der Fülle“ oder „der präexistente Pleroma-Bereich“
  rationale: Der ungewöhnliche Plural der Zeugnisgrundlage bleibt sichtbar und wird nicht durch ein späteres System erklärt.
- issue: Status der Ergänzungen
  choice: Winkelklammern, eckige Klammern und Auslassungen bleiben im Haupttext erhalten
  alternative: Rekonstruktionen stillschweigend in einen glatten Text einarbeiten
  rationale: Die handschriftlichen Lücken und editorischen Ergänzungen sind für die Auslegung bedeutsam und dürfen nicht als sicherer Wortlaut erscheinen.
