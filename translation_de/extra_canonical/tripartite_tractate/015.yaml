  footnotes:
  - marker: a
    text: Die spitzen Klammern kennzeichnen im zugrunde gelegten Zeugnis ergänzten Text; leere eckige Klammern weisen auf eine Lücke oder unsichere Stelle hin. Die genaue Beziehung von »sie« in »beendete er sie« bleibt unsicher.
    reason: Die handschriftliche Unsicherheit und der mehrdeutige Bezug dürfen nicht verdeckt werden.
  - marker: b
    text: »Erschütterte« gibt ein starkes Verb wieder, das auch im Sinn von »verwüstete« oder »zerschlug« verstanden werden kann.
    reason: Die drastische Wirkung soll erhalten bleiben, ohne bei ausstehender koptischer Prüfung eine einzige Nuance festzuschreiben.
  - marker: c
    text: Der Satz enthält eine Textlücke. »Selbst jenem Plan« verdeutlicht den wahrscheinlich gemeinten Rückbezug, bleibt aber wegen der beschädigten Überlieferung vorläufig.
    reason: Die Ergänzung macht den deutschen Satz lesbar und kennzeichnet zugleich ihre Unsicherheit.
lexical_decisions:
- source_word: word
  choice: Wort
  rationale: Bewahrt den begrifflichen und möglicherweise personhaften Gehalt, ohne ihn durch »Botschaft« oder »Lehre« einzuengen.
- source_word: knowledge
  choice: Erkenntnis
  rationale: Passt zum erkenntnisbezogenen Sprachgebrauch des Traktats und bezeichnet mehr als bloßes Faktenwissen.
- source_word: form
  choice: Gestalt
  rationale: Gibt eine wahrnehmbare Erscheinungsform wieder, ohne vorschnell »Körper« oder »Bild« festzulegen.
- source_word: beings of memory
  choice: Wesen der Erinnerung
  rationale: Bewahrt die ungewöhnliche technische Bezeichnung des Zeugnisses und vermeidet spekulative Identifizierung.
- source_word: likeness
  choice: Ähnlichkeit
  rationale: Erhält den abstrakten Gruppenbegriff, statt ihn deutend als »Abbilder« oder »Gleichartige« wiederzugeben.
- source_word: repose
  choice: Ruhe
  rationale: Ist natürliches Deutsch und lässt den möglichen soteriologischen Fachsinn offen.
- source_word: vision
  choice: Schau
  rationale: Bezeichnet eine offenbarende Wahrnehmung in würdigem Register; »Vision« wäre moderner, aber weniger in den Satz eingebettet.
- source_word: plan of salvation
  choice: Heilsplan
  rationale: Gibt die zielgerichtete heilsgeschichtliche Ordnung knapp wieder, ohne eine konfessionelle Systematik hinzuzufügen.
theological_decisions:
- issue: Unklare Identität der mehrfachen Pronomen
  choice: Pronomen und überlieferte Ergänzungszeichen beibehalten
  alternative: Die Handelnden ausdrücklich als Sohn, Logos oder eine bestimmte Ordnung benennen
  rationale: Der Abschnitt setzt Referenten aus dem Kontext voraus; eine ausdrückliche Identifizierung würde die vorhandene Mehrdeutigkeit unzulässig auflösen.
- issue: Die Rolle der feindlichen Ordnungen im Heilsplan
  choice: Auch ihre unwissentliche Dienlichkeit ausdrücklich bewahren
  alternative: Ihre Rolle abschwächen oder als bewusste Mitwirkung darstellen
  rationale: Der Text hält Gericht, Herrschaft über die Finsternis und unwissentliche Einbindung in den Heilsplan spannungsvoll zusammen.
- issue: Innere gegenüber plötzlicher äußerer Offenbarung
  choice: Den deutlichen Gegensatz erhalten
  alternative: Beide Offenbarungsweisen harmonisieren
  rationale: Die abgestufte Offenbarung ist ein theologischer Schwerpunkt des Abschnitts und darf nicht nivelliert werden.
- issue: Aussage, dass er sich zum Genuss in der Schau hingibt
  choice: »sich ihm hingibt, damit er ihn in einer Schau genießen kann«
  alternative: »sich ihm zu erkennen gibt«
  rationale: Die ungewöhnlich starke Teilhabe- und Genussformulierung des Zeugnisses bleibt erhalten, ohne sie rein erkenntnistheoretisch umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen technischen Ausdrücken und Pronomenmehrdeutigkeiten. Winkel- und eckige Klammern des englischen öffentlichen Zeugnisses wurden erhalten. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf in textkritisch unsicheren Einzelheiten ausdrücklich vorläufig.
