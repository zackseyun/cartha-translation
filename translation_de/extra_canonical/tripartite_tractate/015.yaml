  yaml_path: translation/extra_canonical/tripartite_tractate/015.yaml
  text: 'And <he> invisibly sowed in him a word that was intended to become knowledge, and he gave him power to move away and to cast away from himself those who disobey him. In this way, he revealed himself to him. But to those who came into being for his sake, he revealed a form beyond their grasp. They therefore behaved with hostility toward one another. <He> suddenly revealed himself to them, drawing near in the form of lightning and departing like a flash of lightning. When finishing their mutual entanglement, he ended it [] through the sudden revelation, for which they were unprepared, were not expecting, and did not know.


    This frightened them, and they fell down because they could not endure the appearance of the light that had struck them. The one who appeared devastated the two orders. Just as the beings of memory <have been> called the Little One, so they have only a dim idea of the Exalted One who exists before them, and they have sown within themselves a feeling of astonishment at the Exalted One who is to be manifested. Therefore, they received his revelation and prostrated themselves before him. They became witnesses who were persuaded of <him>, acknowledging that the light which had appeared was stronger than those who resisted them.


    But those of the likeness became terribly afraid because they could not bear to hear about him in the beginning, that a vision of this kind could exist. Consequently, they plunged into the pit of ignorance called “the Outer Darkness,” “Chaos,” “Death,” and “the Abyss.” He placed them below the order of the beings of memory, given that it was evidently stronger than they were. They were considered worthy to rule over the indescribable darkness because they own it, and it is the lot assigned to them. He granted that they too would be of use in the plan of salvation that was to unfold, [] even that of which <they> were unaware.


    There is a [great] difference between the revelation for the one who came into being, the revelation for the one who was deficient, and the revelation for those who came into being because of him. He revealed himself to him within him because he is with him, sharing in his suffering, gradually giving him repose, causing him to grow, lifting him up, and giving himself to him to enjoy in a vision. But to those who fell outside, he revealed himself suddenly and in a flash. Then he quickly withdrew himself, not allowing them to gaze on him.'
translation:
  language: de
  text: 'Und <er> säte unsichtbar ein Wort in ihn, das zur Erkenntnis werden sollte, und gab ihm die Macht, sich zu entfernen und diejenigen von sich zu stoßen, die ihm ungehorsam sind. Auf diese Weise offenbarte er sich ihm. Denen aber, die um seinetwillen entstanden waren, offenbarte er eine Gestalt, die sich ihrem Begreifen entzog. Daraufhin verhielten sie sich feindselig gegeneinander. <Er> offenbarte sich ihnen plötzlich, kam in Gestalt eines Blitzes nahe und verschwand wie ein Blitz. Als ihre gegenseitige Verstrickung ihr Ende erreichte, beendete er sie [] durch die plötzliche Offenbarung, auf die sie nicht vorbereitet waren, die sie nicht erwarteten und von der sie nichts wussten.[a]


    Das versetzte sie in Schrecken, und sie fielen nieder, weil sie die Erscheinung des Lichtes, das sie getroffen hatte, nicht ertragen konnten. Der Erschienene erschütterte die beiden Ordnungen.[b] Wie die Wesen der Erinnerung <der> »Kleine« genannt <worden sind>, so haben sie nur eine schwache Vorstellung von dem Erhabenen, der schon vor ihnen da ist; und sie haben in sich selbst ein Gefühl des Staunens über den Erhabenen gesät, der offenbar werden soll. Daher nahmen sie seine Offenbarung an und warfen sich vor ihm nieder. Sie wurden zu Zeugen, die von <ihm> überzeugt waren, und erkannten an, dass das erschienene Licht stärker war als jene, die sich ihnen widersetzten.


    Diejenigen von der Ähnlichkeit aber gerieten in große Furcht, denn sie konnten es anfangs nicht ertragen, von ihm zu hören: dass eine Erscheinung dieser Art möglich sei. Deshalb stürzten sie in die Grube der Unwissenheit, die »die äußere Finsternis«, »Chaos«, »Tod« und »der Abgrund« genannt wird. Er wies ihnen einen Platz unterhalb der Ordnung der Wesen der Erinnerung zu, da diese offensichtlich stärker war als sie. Sie wurden für würdig erachtet, über die unbeschreibliche Finsternis zu herrschen, denn sie gehört ihnen und ist der ihnen zugewiesene Anteil. Er gewährte, dass auch sie dem Heilsplan dienen würden, der sich entfalten sollte, [] selbst jenem Plan, von dem <sie> nichts wussten.[c]


    Es besteht ein [großer] Unterschied zwischen der Offenbarung für den, der entstand, der Offenbarung für den, der mangelhaft war, und der Offenbarung für diejenigen, die seinetwegen entstanden. Ihm offenbarte er sich in seinem Inneren, weil er bei ihm ist, an seinem Leiden teilhat, ihm nach und nach Ruhe schenkt, ihn wachsen lässt, ihn emporhebt und sich ihm hingibt, damit er ihn in einer Schau genießen kann. Denen aber, die nach draußen gefallen waren, offenbarte er sich plötzlich und blitzartig. Dann entzog er sich ihnen rasch wieder und ließ nicht zu, dass sie ihn anschauten.'
