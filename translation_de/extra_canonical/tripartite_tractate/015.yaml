review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem bereitgestellten englischen Zeugnis insgesamt eng und bewahrt die pronomenbezogene Mehrdeutigkeit sowie die überlieferten Ergänzungs- und Lückenzeichen. Sichere Korrekturen sind erforderlich, weil »erschütterte« die starke Aussage von »devastated« abschwächt, weil ein nicht im Zeugnis vorhandenes Ergänzungszeichen (<der>) eingeführt wurde und weil einzelne Formulierungen die Handlungsabfolge bzw. die Bewegungsmetaphorik weniger genau wiedergeben.
  naturalness: Der Registerton ist überwiegend gutes modernes Standarddeutsch. »sich abzuwenden« und »von sich zu weisen« sind hier präziser und idiomatischer als »sich zu entfernen« und »von sich zu stoßen«. »einander feindlich gesinnt« ist natürlicher als »verhielten sie sich feindselig gegeneinander«.
  terminology: Die technischen Bezeichnungen »Erkenntnis«, »Gestalt«, »Wesen der Erinnerung«, »Ähnlichkeit«, »Heilsplan« und »Schau« können beibehalten werden. »verwüstete« bildet die drastische, im englischen Zeugen vorliegende Wirkung ab, ohne eine weitergehende dogmatische Deutung einzutragen.
  issues:
  - severity: medium
    issue: Abschwächung von »devastated« durch »erschütterte«
    rationale: Das englische Zeugnis bezeichnet eine zerstörerische bzw. verwüstende Wirkung. »Erschütterte« kann bloßes Erschrecken oder Erzittern ausdrücken und ist daher zu schwach.
  - severity: medium
    issue: Nicht bezeugte Ergänzung <der>
    rationale: Die Winkelklammern sollen die Signale des zugrunde gelegten Zeugnisses bewahren. Das zusätzlich eingefügte <der> ist dort nicht vorhanden und darf nicht als textkritische Ergänzung erscheinen.
  - severity: low
    issue: Unpräzise Wiedergabe von »move away« / »cast away from himself«
    rationale: »sich abzuwenden« und »von sich zu weisen« geben die Abwendung und das Wegweisen klarer wieder als die räumlich unspezifischere Formulierung des Entwurfs.
  - severity: low
    issue: Handlungsabfolge beim Beenden der gegenseitigen Verstrickung geglättet
    rationale: Die Formulierung »Als ihre ... Verstrickung ihr Ende erreichte« lässt die im Zeugnis dem Handelnden zugeschriebene Beendigung verblassen. Die Revision erhält diese, trotz der anschließenden textlich schwierigen Wiederaufnahme, ausdrücklich.
  revised_text: 'Und <er> säte unsichtbar ein Wort in ihn, das zur Erkenntnis werden sollte, und gab ihm die Macht, sich abzuwenden und diejenigen von sich zu weisen, die ihm ungehorsam sind. Auf diese Weise offenbarte er sich ihm. Denen aber, die um seinetwillen entstanden waren, offenbarte er eine Gestalt, die sich ihrem Begreifen entzog. Daraufhin waren sie einander feindlich gesinnt. <Er> offenbarte sich ihnen plötzlich, kam in Gestalt eines Blitzes nahe und verschwand wie ein Blitz. Als er ihre gegenseitige Verstrickung zu Ende brachte, beendete er sie [] durch die plötzliche Offenbarung, auf die sie nicht vorbereitet waren, die sie nicht erwarteten und von der sie nichts wussten.[a]



    Das versetzte sie in Schrecken, und sie fielen nieder, weil sie die Erscheinung des Lichtes, das sie getroffen hatte, nicht ertragen konnten. Der Erschienene verwüstete die beiden Ordnungen. Wie die Wesen der Erinnerung »der Kleine« genannt <worden sind>, so haben sie nur eine schwache Vorstellung von dem Erhabenen, der schon vor ihnen da ist; und sie haben in sich selbst ein Gefühl des Staunens über den Erhabenen gesät, der offenbar werden soll. Daher nahmen sie seine Offenbarung an und warfen sich vor ihm nieder. Sie wurden zu Zeugen, die von <ihm> überzeugt waren, und erkannten an, dass das erschienene Licht stärker war als jene, die sich ihnen widersetzten.



    Diejenigen von der Ähnlichkeit aber gerieten in große Furcht, denn sie konnten es anfangs nicht ertragen, von ihm zu hören: dass eine Erscheinung dieser Art möglich sei. Deshalb stürzten sie in die Grube der Unwissenheit, die »die äußere Finsternis«, »Chaos«, »Tod« und »der Abgrund« genannt wird. Er wies ihnen einen Platz unterhalb der Ordnung der Wesen der Erinnerung zu, da diese offensichtlich stärker war als sie. Sie wurden für würdig erachtet, über die unbeschreibliche Finsternis zu herrschen, denn sie gehört ihnen und ist der ihnen zugewiesene Anteil. Er gewährte, dass auch sie dem Heilsplan dienen würden, der sich entfalten sollte, [] selbst jenem Plan, von dem <sie> nichts wussten.[b]



