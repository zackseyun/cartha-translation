review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung folgt dem bereitgestellten englischen Übersetzungszeugen insgesamt eng und bewahrt dessen technische Kategorien sowie die markierten Lücken, Ergänzungen und Auslassungen. Eine direkte Prüfung am koptischen Text ist nach den Metadaten noch ausstehend. Zwei Formulierungen bedürfen jedoch einer Korrektur: Das Hervorbringen eines Leibes für das Haupt darf nicht als Verwandlung der geistigen Art in einen Leib wiedergegeben werden; außerdem sollte die parenthetische, im Zeugnis nicht als Rekonstruktion markierte Aussage über Demut und Rettung nicht in spitze Klammern gesetzt werden.'
  naturalness: Das Deutsch ist überwiegend klar, würdig und modern. Einzelne vorsichtige Umstellungen verbessern die idiomatische Lesbarkeit, ohne die absichtlich spröde und teils beschädigte Syntax des Zeugnisses zu glätten.
  terminology: Die Wiedergaben „geistig“, „seelisch“, „materiell“, „Wort“, „All“, „Kirche“, „Rechte“ und „Linke“ sind konsistent und angemessen. „Eigene Ehre“ wird zu „eigenen Ruhm“ präzisiert, damit der Sinn von „self-glory“ klarer hervortritt.
  issues:
  - severity: medium
    issue: „Plötzlich wurde sie zu einem Leib für ihr Haupt“
    rationale: Der englische Zeuge sagt, dass die geistige Kategorie ihrem Haupt einen Leib hervorbrachte bzw. wachsen ließ. Die vorliegende Formulierung besagt dagegen, sie selbst sei zu diesem Leib geworden.
  - severity: medium
    issue: Die Aussage „(that results in) salvation“ wurde als „<die> Rettung <bewirkt>“ behandelt.
    rationale: Im englischen Zeugen steht hier eine Klammerbemerkung, keine mit spitzen Klammern kenntlich gemachte Rekonstruktion. Die deutsche Fassung soll dieses Unsicherheitssignal nicht verändern.
  - severity: low
    issue: „über die Heiligen leuchtete“ und „die eigene Ehre“
    rationale: „Die Heiligen erleuchtete“ gibt „shone upon the saints“ natürlicher wieder. „Eigenen Ruhm“ trifft „self-glory“ präziser als „eigene Ehre“.
  revised_text: 'Die Menschen wurden in drei Wesensarten eingeteilt: die geistigen, die seelischen und die materiellen. Sie entsprechen der dreifachen Ausrichtung des Wortes, aus der die Materiellen, die Seelischen und die Geistigen hervorgebracht wurden. Jede der drei Wesensarten wird an ihrer Frucht erkannt. Von Anfang an waren sie jedoch noch nicht erkennbar, sondern erst, als der Retter kam, die Heiligen erleuchtete und offenbarte, zu welcher Art jeder Einzelne gehörte.


