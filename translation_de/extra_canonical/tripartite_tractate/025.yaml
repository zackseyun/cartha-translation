base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/025.yaml
  text: 'Humans came to be divided into three natural categories: the spiritual, the soulish, and the material. These correspond to the Word’s threefold inclination, from which the material, the soulish, and the spiritual were produced. Each of the three natural categories is known by its fruit. They were not known at first, however, but only when the Savior came, shone upon the saints, and revealed which category each one belonged to.


    The spiritual category is like light from light and spirit from spirit. When its head appeared, it immediately hurried toward its proper category. Suddenly it grew a body for its head and immediately received knowledge through the revelation.


    The soulish category, by contrast, is like light from fire. It was hesitant to recognize [] the one who appeared to it and even more hesitant to hurry toward him through faith. Instead, although a voice instructed it, <it> was satisfied, because it was not far from the hope of the promise. It received, as it were, assurance of the things to come in the form of a pledge.


    The material category, by contrast, is alien in every way, because it resembles darkness and rejects the light that shines, since its manifestation extinguishes it. Because it did not welcome his <coming>, it is <immoderate> and full of spite toward the revelation of the Lord.


    The spiritual category will receive complete salvation in every respect. The material category will be destroyed in every respect, as happens to an adversary. Because of its middle position, both in the way it was produced and in its nature, the soulish category is duality, corresponding to its inclination toward both good and evil. What has been determined for it is ambiguous <…> and its complete escape <from> what is good.


    Those whom the Word produced according to the preexistent pattern in his thought, when he remembered the Exalted One and prayed for salvation, received salvation immediately. [Because] of the saving thought, they were saved completely by what it produced. The same applies to [the ones] whom these produced in their turn, [] whether angels or humans. Because they acknowledge that one exists who is more exalted than they are, and because they pray and seek after him, they too will receive the same salvation received by those who were produced, since they come from the good inclination. They were assigned the service of proclaiming the Savior’s future coming and his revelation after he had come. Whether angels or humans, when he appointed them to this service, they truly received the nature of their being.


    By contrast, those who came from the thought of lust for control, who came into being through the blow struck by his opponents, were produced by that thought. Since they are mixed, they will receive an ambiguous end. Those who cast off the lust for control that was granted to them only for a time and for particular periods, who glorify the Lord of glory, and who renounce their anger, will receive the reward for their humility, which is unending existence.


    By contrast, those who are arrogant because of their lust for ambition, who love passing glory, and who forget that authority was delegated to them only for particular periods and times—and who therefore did not confess that the Son of God [] is the Lord of all and Savior, and did not renounce their anger or stop imitating the evil ones—will suffer retribution for their ignorance and foolish passion, together with those who have gone astray and wandered away.


    Even more evil are those who committed improper acts against the Lord, as the powers of the left did against him, even putting him to death. They said to themselves, “We will become masters of the Totality if the one proclaimed king of the Totality is killed.” They worked toward this end—the humans and angels who do not belong to the good inclination of those on the right, but come from the mixture. They chose self-glory, even though it is only passing glory and lust, while the way to eternal repose is through humility (that results in) salvation, being of those who are to be saved, those on the right.


    After they praise the Lord, consider what is pleasing to the Church, and sing the hymn of the humble together with her as fully as possible, doing what pleases her, they will share in her sufferings and anguish like those who consider what is good for the Church. They will receive a share in her hope. This applies [] to humans and angels.


    The path of those belonging to the order of the left leads to destruction, because they not only rejected the Lord and devised an evil plot against him, but also directed their hatred, envy, and jealousy against the Church. This is the reason for the condemnation of those who have troubled the Church, even inciting themselves to create <trials> for the Church.'
translation:
  language: de
  text: 'Die Menschen wurden in drei Wesensarten eingeteilt: die geistigen, die seelischen und die materiellen. Sie entsprechen der dreifachen Ausrichtung des Wortes, aus der die Materiellen, die Seelischen und die Geistigen hervorgebracht wurden. Jede der drei Wesensarten wird an ihrer Frucht erkannt. Von Anfang an waren sie jedoch noch nicht erkennbar, sondern erst, als der Retter kam, über die Heiligen leuchtete und offenbarte, zu welcher Art jeder Einzelne gehörte.


    Die geistige Art ist wie Licht aus Licht und Geist aus Geist. Als ihr Haupt erschien, eilte sie sogleich zu der ihr entsprechenden Art. Plötzlich wurde sie zu einem Leib für ihr Haupt und erlangte durch die Offenbarung unverzüglich Erkenntnis.


    Die seelische Art dagegen ist wie Licht aus Feuer. Sie zögerte, denjenigen zu erkennen [Textlücke],[a] der ihr erschienen war, und noch mehr zögerte sie, durch den Glauben zu ihm zu eilen. Obwohl eine Stimme sie unterwies, war <sie>[b] vielmehr zufrieden, denn sie war der Hoffnung auf die Verheißung nicht fern: Gleichsam als Unterpfand empfing sie die Gewissheit der kommenden Dinge.


    Die materielle Art dagegen ist in jeder Hinsicht fremd; denn sie gleicht der Finsternis und weist das Licht zurück, das leuchtet, weil dessen Offenbarwerden sie auslöscht. Und weil sie sein <Kommen> nicht annahm, ist sie <maßlos> und voller Bosheit gegen die Offenbarung des Herrn.


    Die geistige Art wird in jeder Hinsicht vollständige Rettung erlangen. Die materielle Art wird in jeder Hinsicht vernichtet werden, wie es einem Widersacher widerfährt. Die seelische Art aber steht sowohl hinsichtlich ihrer Entstehung als auch ihrer Natur in der Mitte. Darum ist sie zwiespältig, entsprechend ihrer Neigung zum Guten wie zum Bösen. Was für sie bestimmt ist, bleibt zweideutig <…>[c], ebenso ihr völliges Entkommen <von> dem Guten.


    Diejenigen, die das Wort nach dem vorbestehenden Urbild in seinem Denken hervorbrachte, erlangten augenblicklich Rettung, als es sich an den Erhabenen erinnerte und um Rettung bat. [Aufgrund] des rettenden Gedankens wurden sie durch das, was dieser hervorbrachte, vollständig gerettet. Dasselbe gilt für [diejenigen], die diese wiederum hervorbrachten, [Textlücke] — seien es Engel oder Menschen. Weil sie anerkennen, dass einer da ist, der erhabener ist als sie selbst, und weil sie dem Gebet und der Suche nach ihm zustimmen, werden auch sie dieselbe Rettung empfangen wie die Hervorgebrachten; denn sie stammen aus der guten Neigung. Ihnen wurde der Dienst übertragen, das künftige Kommen des Retters und seine Offenbarung nach seiner Ankunft zu verkünden. Als er sie zu diesem Dienst bestimmte, empfingen sie tatsächlich die Natur ihres Daseins, seien es Engel oder Menschen.


    Diejenigen dagegen, die aus dem Gedanken des Verlangens nach Herrschaft hervorgingen und durch den Schlag seiner Gegner ins Dasein kamen, wurden von jenem Gedanken hervorgebracht. Weil sie vermischt sind, wird ihr Ausgang ungewiss sein. Wer das Verlangen nach Herrschaft ablegt, die ihm nur für eine gewisse Zeit und für bestimmte Zeitabschnitte gewährt wurde, wer den Herrn der Herrlichkeit verherrlicht und seinem Zorn entsagt, wird als Lohn für seine Demut unvergängliches Dasein empfangen.


    Diejenigen dagegen, die aus ehrgeizigem Verlangen hochmütig sind, vergängliche Herrlichkeit lieben und vergessen, dass ihnen die Herrschaft nur für bestimmte Zeitabschnitte und Zeiten übertragen wurde, bekannten deshalb nicht, dass der Sohn Gottes [Textlücke] der Herr über alles und der Retter ist. Sie entsagten ihrem Zorn nicht und hörten nicht auf, die Bösen nachzuahmen. Zusammen mit denen, die sich geirrt haben und vom Weg abgekommen sind, werden sie Vergeltung für ihre Unwissenheit und ihre törichte Leidenschaft erfahren.


    Noch schlimmer sind diejenigen, die Ungehöriges gegen den Herrn verübten, wie es die Mächte der Linken gegen ihn taten, bis sie ihn sogar töteten. Sie sagten sich: »Wir werden Herren des Alls, wenn derjenige getötet wird, der zum König des Alls ausgerufen worden ist.« Darauf arbeiteten sie hin: jene Menschen und Engel, die nicht zur guten Neigung derer auf der Rechten gehören, sondern aus der Vermischung stammen. Sie entschieden sich für die eigene Ehre, obwohl sie nur vergängliche Ehre und bloßes Verlangen ist. Der Weg zur ewigen Ruhe dagegen führt durch die Demut, <die> Rettung <bewirkt>, und gehört denen, die gerettet werden sollen, denen auf der Rechten.


    Wenn sie den Herrn preisen, darauf bedacht sind, was der Kirche gefällt, und gemeinsam mit ihr das Lied der Demütigen so vollkommen wie möglich singen, indem sie tun, was ihr gefällt, dann werden sie an ihren Kämpfen und Bedrängnissen Anteil haben wie Menschen, denen das Wohl der Kirche am Herzen liegt. Auch an ihrer Hoffnung werden sie Anteil erhalten. Dies betrifft [Textlücke] Menschen und Engel.


    Der Weg derer, die zur Ordnung der Linken gehören, führt ins Verderben. Denn sie haben nicht nur den Herrn verworfen und einen bösen Anschlag gegen ihn geplant, sondern ihren Hass, ihren Neid und ihre Eifersucht auch gegen die Kirche gerichtet. Darin liegt der Grund für die Verurteilung derer, die die Kirche bedrängt und sich sogar dazu angestachelt haben, <Prüfungen> über die Kirche zu bringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »[Textlücke]« kennzeichnet eine im zugrunde gelegten Übersetzungszeugnis angezeigte Lücke oder unleserliche Stelle.
    reason: Die materielle Beschädigung beziehungsweise Unsicherheit des Textes soll sichtbar bleiben.
  - marker: b
    text: Wörter in spitzen Klammern sind ergänzte oder wiederhergestellte Lesarten des zugrunde gelegten Zeugnisses.
    reason: Ergänzungen dürfen nicht wie sicher überlieferter Text erscheinen.
  - marker: c
    text: »<…>« bezeichnet eine Auslassung oder verlorene Passage unbekannten Umfangs.
    reason: Der abgebrochene Gedankengang darf nicht spekulativ geschlossen werden.
lexical_decisions:
- source_word: spiritual / soulish / material
  choice: geistig / seelisch / materiell
  rationale: Bewahrt die technische Dreiteilung des Traktats, ohne »seelisch« mit »natürlich« oder »psychisch« zu harmonisieren.
- source_word: categories of nature
  choice: Wesensarten
  rationale: Gibt sowohl die Einteilung als auch den ontologischen Bezug auf die jeweilige Natur idiomatisch wieder; »Kategorien der Natur« wäre im Deutschen unnötig abstrakt.
- source_word: Word
  choice: das Wort
  rationale: Bewahrt die personhafte und theologisch aufgeladene Bezeichnung, ohne sie durch die unübersetzte Form »Logos« zusätzlich auszulegen.
- source_word: Totality
  choice: das All
  rationale: Kennzeichnet die kosmologische Gesamtheit als Fachbegriff und klingt im Deutschen natürlicher als »Totalität«.
- source_word: Church
  choice: Kirche
  rationale: Erhält den kollektiven und theologischen Sinn des Zeugnisses; eine Einengung auf eine einzelne Ortsgemeinde wird vermieden.
- source_word: inclination
  choice: Ausrichtung / Neigung
  rationale: »Ausrichtung« bezeichnet die dreifache Grundbewegung des Wortes, während »Neigung« in den ethischen Gegenüberstellungen von Gut und Böse idiomatischer ist.
- source_word: pledge
  choice: Unterpfand
  rationale: Bewahrt das Bild einer gegenwärtigen Gewähr für Zukünftiges und seinen religiösen Klang.
theological_decisions:
- issue: Status der drei Menschenarten
  choice: Die drei Arten werden als Wesensarten wiedergegeben.
  alternative: Sie als bloße moralische oder psychologische Menschentypen zu formulieren.
  rationale: Der Text spricht von Entstehung und Natur der Arten; eine rein ethische Deutung würde seine ontologische Spannung beseitigen.
- issue: Ungewisser Ausgang der seelischen Art
  choice: Die Zwiespältigkeit und der ungewisse Ausgang bleiben ausdrücklich bestehen.
  alternative: Die seelische Art eindeutig der Rettung oder Vernichtung zuzuordnen.
  rationale: Das Zeugnis lässt ihre Bestimmung mehrdeutig und verbindet sie mit einer Neigung sowohl zum Guten als auch zum Bösen.
- issue: Rettung und Demut
  choice: Die schwierige Aussage über Demut, Rettung und die Rechte wird eng am überlieferten Wortlaut belassen.
  alternative: Eine systematisch geglättete Heilslehre daraus zu formulieren.
  rationale: Die Syntax und der Gedankengang sind unsicher; eine konfessionelle Präzisierung wäre nicht quellengerecht.
- issue: Engel und Menschen
  choice: Beide Gruppen bleiben parallel genannt und können innerhalb derselben Ordnungen stehen.
  alternative: Die Aussagen ausschließlich auf Menschen zu beziehen.
  rationale: Das Zeugnis nennt ausdrücklich Engel und Menschen und ordnet beiden Verkündigungsdienst, Entscheidung und Ausgang zu.
- issue: Textschäden und Ergänzungen
  choice: Lücken, Ergänzungen und Auslassungen werden sichtbar bewahrt.
  alternative: Die beschädigten Stellen stillschweigend zu vervollständigen.
  rationale: Da die direkte Prüfung des koptischen Textes noch aussteht, darf die Unsicherheit des englischen öffentlichen Zeugnisses nicht verdeckt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen Fachbegriffen der valentinianischen Kosmologie. Lange Perioden wurden behutsam gegliedert, ohne argumentative Beziehungen aufzulösen. Die Fassung ist vorläufig, da laut Metadaten eine unmittelbare Prüfung des koptischen Textes noch aussteht; die gelieferten Schadens- und Ergänzungssignale bleiben daher erhalten.
