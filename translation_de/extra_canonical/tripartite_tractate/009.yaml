lexical_decisions:
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte religionsgeschichtliche Fachbegriff bewahrt die kosmologische Bedeutung; eine Wiedergabe als „Zeitalter“ wäre in diesem Zusammenhang irreführend.
- source_word: whole system
  choice: gesamtes Gefüge
  rationale: „Gefüge“ vermittelt eine geordnete Gesamtheit natürlicher als „System“, ohne die technische Nuance völlig aufzugeben.
- source_word: discovery / know
  choice: erkennen
  rationale: Im Deutschen erfasst „erkennen“ sowohl das Finden als auch das tiefere Erkennen des Vaters; die Variation des Zeugnisses wird im Kontext gewahrt.
- source_word: automatically
  choice: ohne eigenes Suchen
  rationale: Die Klammererläuterung des englischen Zeugnisses wird idiomatisch wiedergegeben und dem anschließenden Motiv des Suchens gegenübergestellt.
- source_word: primal essence
  choice: ursprüngliches Wesen
  rationale: Bewahrt die ontologische Aussage in verständlicher, würdiger Sprache.
- source_word: places on the path
  choice: Stationen auf dem Weg
  rationale: Gibt das räumliche Bild verständlich wieder, ohne die Äonen bloß mit abstrakten Stufen gleichzusetzen.
- source_word: eternal mind
  choice: ewiger Geist
  rationale: „Geist“ ist im Deutschen für die intellektive Größe natürlicher, bleibt aber gegenüber „Denken“ bzw. „Intellekt“ mehrdeutig.
- source_word: Totalities
  choice: Allheiten
  rationale: Der ungewöhnliche technische Plural wird bewusst sichtbar gehalten und nicht vorschnell als „das All“ vereinheitlicht.
- source_word: mixing with him
  choice: sich mit ihm zu verbinden
  rationale: Vermeidet im Deutschen eine stoffliche Fehlassoziation von „vermischen“, bewahrt aber das Motiv inniger Vereinigung.
- source_word: form
  choice: Gestalt
  rationale: „Gestalt“ eignet sich für die metaphysische wie manifestative Bedeutung und klingt weniger technisch als „Form“.
- source_word: trace
  choice: Spur
  rationale: Direkte und bildhafte Entsprechung, die die rätselhafte Verbindung von Geist und Suche offenhält.
theological_decisions:
- issue: Göttliche Offenbarung und suchendes Erkennen
  choice: Der Vater offenbart sich ewig, wird aber auf dem Weg des Suchens erfasst.
  alternative: Der Vater verhindert absichtlich jede unmittelbare Erkenntnis.
  rationale: Die Spannung zwischen Offenbarung und verborgener ursprünglicher Wesenheit wird bewahrt, ohne sie zu einer Lehre bewusster Verweigerung zu verschärfen.
- issue: Einheit mit dem Vater
  choice: „sich mit ihm zu verbinden“
  alternative: „sich mit ihm zu vermischen“ oder „eins mit ihm zu werden“
  rationale: Die Formulierung wahrt die Nähe des Bildes, ohne eine vollständige Aufhebung der Unterschiedenheit ausdrücklich zu behaupten.
- issue: Unnennbarkeit und Sprechen von Gott
  choice: 'Beides bleibt nebeneinander stehen: Er kann nicht benannt oder begriffen werden, doch sein Geist befähigt zum Sprechen von ihm.'
  alternative: Die Aussagen durch eine eindeutige Unterscheidung zwischen Wesen und Wirkungen harmonisieren.
  rationale: Der Text entfaltet bewusst eine apophatische Spannung, die nicht systematisch aufgelöst werden soll.
- issue: Jeder Äon als Name, Eigenschaft und Kraft des Vaters
  choice: Die Identifikationssprache wird unmittelbar beibehalten.
  alternative: Die Äonen lediglich als Repräsentanten oder Schöpfungen des Vaters bezeichnen.
  rationale: Eine abschwächende Erklärung würde eine konfessionelle oder metaphysische Deutung in den Text eintragen.
- issue: Textlich unsichere Ergänzungen
  choice: Eckige und spitze Klammern bleiben erhalten und werden erklärt.
  alternative: Ergänzungen glatt in den Haupttext aufnehmen.
  rationale: So bleibt erkennbar, wo der Text ergänzt beziehungsweise editorisch markiert ist.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut lesbarem Register. Technische Begriffe der valentinianischen Kosmologie, besonders „Äonen“ und „Allheiten“, bleiben erhalten. Parallelismen der Aufzählung und die apophatische Spannung des Abschnitts werden bewahrt. Da eine direkte Prüfung des koptischen Textes noch aussteht, folgt der Entwurf vorsichtig dem angegebenen gemeinfreien englischen Zeugen und macht dessen editorische Zeichen sichtbar.
