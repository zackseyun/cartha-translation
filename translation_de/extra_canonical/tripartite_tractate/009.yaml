base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/009.yaml
  text: 'The whole system of the aeons has a love and longing to discover the Father perfectly and completely, and this is their unrestricted unity. Although the Father reveals himself eternally, he did not desire that they know him automatically. Instead, he allows himself to be grasped through searching, while reserving his unsearchable primal essence to himself. The Father gave the aeons basic desires because they form places along the path that leads to him, like a school that trains conduct. He has given them:


    faith in him and prayer to the one they do not see,

    and a strong hope in the one they do not grasp,

    and a fruitful love that looks toward what it does not see,

    and a worthy understanding of the eternal mind,

    and a blessing of wealth and freedom,

    and an understanding that longs to glorify the Father for <his> thought.


    [] By his will, the exalted Father is known through the Spirit that breathes within the Totalities. He even gives them the idea of searching for the unknown one, as when a pleasant aroma makes someone search for its source, because the Father’s aroma surpasses natural aromas. His sweetness gives the aeons indescribable pleasure and produces in them the idea of joining with him, who desires them to know him in a unified way, and of helping one another in the Spirit planted within them. Although a great weight presses down on them, they are renewed in an indescribable way. They cannot be separated from that in which they have been placed in a way they cannot grasp. They will not speak but will remain silent concerning the Father’s glory, concerning the one who can speak. Nevertheless, they will receive a form from him.


    Although speech cannot describe him, he revealed [himself.] They possess <him>, concealed within a thought. This is why the aeons remain silent about how the Father exists in his form, his essence, and his greatness, [] while the aeons are worthy to know through his Spirit that he cannot be named or comprehended. Through his spirit—the trace of seeking him—he gives them the ability to grasp him and speak about him. Each aeon is a name, <that is>, each one is a quality and power of the Father, because he exists in many names that are mixed together and are in harmony with one another. He can be spoken of because of the riches of speech. In the same way, although the Father is a single name because of his unity, he possesses countless qualities and names.'
translation:
  language: de
  text: 'Das gesamte Gefüge der Äonen ist von Liebe und Sehnsucht erfüllt, den Vater vollkommen und vollständig zu erkennen; darin besteht ihre uneingeschränkte Einheit. Obwohl der Vater sich von Ewigkeit her offenbart, wollte er nicht, dass sie ihn ohne eigenes Suchen erkennen. Vielmehr lässt er sich auf dem Weg des Suchens erfassen, während er sein unerforschliches ursprüngliches Wesen sich selbst vorbehält. Der Vater gab den Äonen grundlegende Sehnsüchte, denn sie bilden Stationen auf dem Weg, der zu ihm führt, gleichsam eine Schule, die das Verhalten einübt. Er hat ihnen gegeben:


    Glauben an ihn und Gebet zu dem, den sie nicht sehen,


    eine starke Hoffnung auf den, den sie nicht erfassen,


    eine fruchtbare Liebe, die auf das blickt, was sie nicht sieht,


    eine würdige Erkenntnis des ewigen Geistes,


    den Segen von Reichtum und Freiheit


    und eine Erkenntnis, die sich danach sehnt, den Vater für <seinen> Gedanken zu verherrlichen.[a]


    [...][b] Nach seinem Willen wird der erhabene Vater erkannt: durch den Geist, der in den Allheiten[c] atmet. Dieser gibt ihnen sogar den Gedanken ein, nach dem Unbekannten zu suchen – so wie ein angenehmer Duft jemanden nach dessen Ursprung suchen lässt; denn der Duft des Vaters übertrifft die natürlichen Düfte. Seine Süße bereitet den Äonen unaussprechliche Freude und weckt in ihnen den Gedanken, sich mit ihm zu verbinden. Er will, dass sie ihn in Einheit erkennen und einander in dem Geist beistehen, der in sie eingepflanzt ist. Obwohl eine große Last auf ihnen liegt, werden sie auf unaussprechliche Weise erneuert. Denn sie können nicht von dem getrennt werden, worin sie auf eine für sie unfassbare Weise ihren Ort haben. Sie werden nicht reden, sondern über die Herrlichkeit des Vaters schweigen, über den, der zu reden vermag; und dennoch werden sie von ihm Gestalt empfangen.[d]


    Obwohl kein Wort ihn beschreiben kann, offenbarte er [sich].[e] Sie besitzen <ihn>, verborgen in einem Gedanken.[f] Deshalb schweigen die Äonen darüber, wie der Vater in seiner Gestalt, seinem Wesen und seiner Größe besteht. [...][g] Doch die Äonen werden durch seinen Geist gewürdigt zu erkennen, dass er weder benannt noch begriffen werden kann. Durch seinen Geist – die Spur der Suche nach ihm – gibt er ihnen die Fähigkeit, ihn zu erfassen und von ihm zu sprechen. Jeder Äon ist ein Name, <das heißt>, jeder ist eine Eigenschaft und Kraft des Vaters; denn er besteht in vielen Namen, die miteinander verbunden sind und miteinander übereinstimmen. Wegen des Reichtums der Sprache kann man von ihm sprechen. Ebenso besitzt der Vater, obwohl er aufgrund seiner Einheit ein einziger Name ist, unzählige Eigenschaften und Namen.'
