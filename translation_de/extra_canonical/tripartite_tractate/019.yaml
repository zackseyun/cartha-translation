review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem vorgelegten englischen Zeugen insgesamt eng und bewahrt die fachsprachlichen Unterscheidungen Erinnerung, Darstellung, Bild und Abbild sowie die textkritischen Ergänzungen in spitzen und eckigen Klammern weitgehend. Eine sichere Korrektur ist bei „das Gesetz des Gerichts, das Verurteilung und Zorn bedeutet“ nötig: Die Vorlage sagt, dass es aus Verurteilung und Zorn besteht, nicht dass es diese Begriffe bedeutet. Außerdem sollen die leeren Schadstellen des Zeugen als „[]“ und nicht als Auslassungspunkte wiedergegeben werden.'
  naturalness: Der Stil ist modernes, würdiges Standarddeutsch und im Allgemeinen gut lesbar. Die bewusst sperrigen kosmologischen Aussagen werden angemessen nicht harmonisiert.
  terminology: 'Die Terminologie ist konsequent und sachgerecht: „Äon“, „Archonten“, „Heilsplan“, „Herrschsucht“ und die Gruppennamen bewahren den Charakter der Vorlage. „das Wort“ ist ohne weitergehende dogmatische Identifikation korrekt behandelt.'
  issues:
  - severity: medium
    issue: „das Gesetz des Gerichts, das Verurteilung und Zorn bedeutet“
    rationale: 'Das englische Zeugnis lautet „which consists of condemnation and anger“. „bedeutet“ verschiebt die Aussage von Zusammensetzung bzw. Beschaffenheit zu Wortbedeutung. Daher: „das in Verurteilung und Zorn besteht“.'
  - severity: medium
    issue: Leere Schadstellen als Auslassungspunkte wiedergegeben
    rationale: Die Vorlage markiert an zwei Stellen ausdrücklich eine leere Lücke „[]“. „[…]“ ist ein anderes textkritisches Zeichen und sollte nicht an die Stelle der bezeugten Lückenmarkierung treten. Die Markierung „[]“ ist beizubehalten; die ergänzte Präposition bleibt wie im Zeugen in eckigen Klammern.
