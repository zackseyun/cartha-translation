  yaml_path: translation/extra_canonical/tripartite_tractate/019.yaml
  text: 'The beings of memory who are located outside are humble, preserving the representation of the Fullness, especially because they share in the names that adorn them. Conversion results in humility toward the beings of memory, and humility toward them is also the law of judgment, which consists of condemnation and anger.


    Humility toward them is also the power that separates those who fall beneath them and sends them far away. It prevents them [] [from] spreading over the beings of memory and conversion. This power consists of fear, confusion, oblivion, bewilderment, ignorance, and the things that have come into being through imagination, as a likeness does. In addition, exalted names are bestowed on these things that were actually lowly. Knowledge <is lacking for those> who were produced from them through pride, lust for control, disobedience, and falsity.


    He bestowed a name on each <of> them, because the two orders exist in a name. Those who belong to memory and representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to the prideful thought and the likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word established each in its own order—namely, the images, the representations, and the likenesses—he kept the aeon of the images pure from all who struggle against it, because it is a place of joy. To those of memory, however, he revealed the thought that he had stripped from himself. He wished to move them into a material union and to provide them with an ordered system and a dwelling place, so that they might also produce a desire to weaken evil’s attraction for them. In this way, they could cease taking excessive delight in the glory of their surroundings and thus remaining in exile, and instead recognize the infirmity from which they suffer. [] In this way, they could produce love and an unceasing search for the one who can heal them of this weakness. To make them take on a form, he placed the word of beauty over those who belong to the likeness, and he also placed the law of judgment over them. He further placed over them the powers that the roots had produced [in] their
    lust for control. The Word was pleased with them because they are useful in the plan of salvation, so he [chose] them to be rulers over them. This was so that, with the help of the beautiful word, by the threat of the [law], or through the influence of the lust for control, the order might be protected from those who would bring it down into evil.


    The Word knows the lust for control shared by the two orders. To them and to everyone else, he kindly granted their desire, giving each one the appropriate rank of command. Thus, each would rule over a place and an activity, deferring to those of a higher order while commanding the activity of the lower places and exercising control in accordance with his mode of being. As a result, among the angels [] and archangels there are leaders and subordinates in positions of rule and submission, while their activities are diverse and of different kinds.


    Each of the archons, together with his race and privileges, enjoys what his allotted portion has entitled him to. In keeping with the manner of their appearance, each one stood at his post, entrusted with the plan of salvation. None lacks kingship over them, from the end of the heavens to the end of the [earth], throughout every region of the [earth], and among those beneath the earth. There are kings and lords, as well as those who receive commands: some oversee punishment, others oversee justice, still others grant rest and healing, others provide instruction, and others keep watch.'
translation:
  language: de
  text: 'Die Wesen der Erinnerung, die sich außerhalb befinden, sind demütig und bewahren die Darstellung der Fülle, besonders weil sie an den Namen teilhaben, die sie schmücken. Die Umkehr führt zur Demut gegenüber den Wesen der Erinnerung; und auch die Demut gegenüber ihnen ist das Gesetz des Gerichts, das Verurteilung und Zorn bedeutet.


    Die Demut gegenüber ihnen ist zugleich die Macht, die jene absondert, die unter sie fallen, und sie weit fortschickt. Sie hindert sie […] daran, sich über die Wesen der Erinnerung und die Umkehr auszubreiten. Diese Macht umfasst Furcht, Verwirrung, Vergessen, Bestürzung, Unwissenheit und das, was durch Einbildung nach Art eines Abbildes entstanden ist. Darüber hinaus werden diesen Dingen, die in Wirklichkeit niedrig waren, erhabene Namen verliehen. Erkenntnis <fehlt denen>, die aus ihnen durch Hochmut, Herrschsucht, Ungehorsam und Falschheit hervorgegangen sind.[a]


    Jedem <von> ihnen gab er einen Namen, denn die beiden Ordnungen bestehen in einem Namen.[b] Diejenigen, die zur Erinnerung und zur Darstellung gehören, heißen »die von der Rechten«, »die Seelischen«, »die Feurigen« und »die Mittleren«. Diejenigen, die zum hochmütigen Denken und zum Abbild gehören, heißen »die von der Linken«, »die Materiellen«, »die Dunklen« und »die Letzten«.


    Nachdem das Wort jedes in seiner Ordnung gegründet hatte – nämlich die Bilder, die Darstellungen und die Abbilder –, bewahrte es den Äon der Bilder rein von allen, die gegen ihn kämpfen, denn er ist ein Ort der Freude.[c] Den Wesen der Erinnerung aber offenbarte es den Gedanken, den es von sich abgestreift hatte. Es wollte sie in eine materielle Verbindung führen und ihnen eine Ordnung und eine Wohnstätte geben, damit auch in ihnen ein Verlangen entstünde, das die Anziehungskraft des Bösen auf sie abschwächt. So sollten sie aufhören, sich übermäßig an der Herrlichkeit ihrer Umgebung zu erfreuen und dadurch in der Verbannung zu bleiben. Stattdessen sollten sie die Schwäche erkennen, an der sie leiden. […] Auf diese Weise sollten sie Liebe und eine unablässige Suche nach dem hervorbringen, der sie von dieser Schwäche heilen kann.


    Damit sie Gestalt annähmen, setzte das Wort der Schönheit über diejenigen ein, die zum Abbild gehören, und stellte auch das Gesetz des Gerichts über sie. Ferner setzte es über sie die Mächte, welche die Wurzeln [in] ihrer Herrschsucht hervorgebracht hatten. Das Wort hatte Gefallen an ihnen, weil sie für den Heilsplan nützlich sind; deshalb [wählte] es sie aus, über sie zu herrschen. So sollte die Ordnung mithilfe des schönen Wortes, durch die Drohung des [Gesetzes] oder durch den Einfluss der Herrschsucht vor denen geschützt werden, die sie zum Bösen hinabziehen würden.[d]


    Das Wort kennt die Herrschsucht, die den beiden Ordnungen gemeinsam ist. Ihnen und allen anderen gewährte es gütig ihren Wunsch und gab jedem den angemessenen Rang zum Herrschen. So sollte jeder über einen Ort und eine Tätigkeit herrschen, sich denen von höherem Rang unterordnen, die Tätigkeit der unteren Bereiche leiten und entsprechend seiner eigenen Seinsweise Macht ausüben. Daher gibt es unter den Engeln […] und Erzengeln Führende und Untergebene in Stellungen des Herrschens und der Unterordnung, während ihre Tätigkeiten vielfältig und verschiedenartig sind.


    Jeder der Archonten genießt zusammen mit seinem Geschlecht und seinen Vorrechten das, wozu ihn sein Los berechtigt hat.[e] Entsprechend der Art ihres Erscheinens stand jeder auf seinem Posten und war mit dem Heilsplan betraut. Und keiner ist ohne eine Königsherrschaft über sie – vom Ende der Himmel bis zum Ende der [Erde], in jedem Gebiet der [Erde] und unter denen unter der Erde.[f] Es gibt Könige und Herren sowie solche, die Befehle empfangen: Die einen beaufsichtigen die Bestrafung, andere die Gerechtigkeit; wieder andere gewähren Ruhe und Heilung, andere unterweisen, und andere halten Wache.'
