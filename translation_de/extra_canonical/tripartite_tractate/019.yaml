  footnotes:
  - marker: a
    text: Spitze Klammern kennzeichnen eine in der zugrunde liegenden Übersetzung ergänzte oder wiederhergestellte Formulierung. Die direkte Prüfung des koptischen Textes steht noch aus.
    reason: Der Satz „Erkenntnis <fehlt denen>“ beruht auf einer sichtbaren Ergänzung des englischen Zeugnisses.
  - marker: b
    text: Die Aussage, die beiden Ordnungen „bestehen in einem Namen“, ist im zugrunde liegenden Zeugnis mehrdeutig; sie kann eine Benennung, Teilhabe oder ontologische Beziehung bezeichnen.
    reason: Die ungewöhnliche Formulierung soll nicht durch eine eindeutige Deutung geglättet werden.
  - marker: c
    text: „Äon“ bezeichnet hier wahrscheinlich nicht nur einen Zeitabschnitt, sondern einen kosmologischen Bereich oder eine Seinsordnung.
    reason: Erläutert den beibehaltenen Fachbegriff ohne eine abschließende Systematisierung.
  - marker: d
    text: Eckige Klammern und Auslassungspunkte geben Beschädigungen oder unsichere Ergänzungen wieder, wie sie im zugrunde liegenden englischen Text bezeugt sind.
    reason: Erklärt die im Haupttext bewahrten textkritischen Signale.
  - marker: e
    text: „Archonten“ ist ein Fachausdruck für herrschende kosmische Mächte oder Amtsträger.
    reason: Der transliterierte Begriff ist für gewöhnliche Leser erklärungsbedürftig.
  - marker: f
    text: Der Bezug von „über sie“ ist nicht völlig eindeutig; gemeint sein können die genannten Mächte oder die ihnen zugeordneten Bereiche und Wesen.
    reason: Bewahrt eine echte syntaktische Mehrdeutigkeit des Zeugnisses.
lexical_decisions:
- source_word: memory
  choice: Erinnerung
  rationale: Bewahrt den technischen und personifizierenden Charakter des Ausdrucks, ohne ihn als bloßes Gedächtnisvermögen umzudeuten.
- source_word: Fullness
  choice: Fülle
  rationale: Gibt den kosmologischen Fachbegriff in verständlichem Deutsch wieder; die Großschreibung im Zeugnis wird nicht zur Einführung eines fremden Eigennamens genutzt.
- source_word: conversion
  choice: Umkehr
  rationale: Erhält den religiös-kosmologischen Sinn und bleibt zugleich offen für Rückwendung oder Bekehrung.
- source_word: representation / likeness / image
  choice: Darstellung / Abbild / Bild
  rationale: Hält die im Zeugnis erkennbaren drei unterschiedlichen Kategorien konsequent auseinander.
- source_word: soulish
  choice: die Seelischen
  rationale: Bewahrt die kategoriale Bedeutung, statt sie wertend als geistlich oder ungeistlich aufzulösen.
- source_word: the Word
  choice: das Wort
  rationale: Das grammatische Neutrum entspricht dem natürlichen deutschen Ausdruck und vermeidet eine unbelegte Identifikation; die Personalität des Handelnden bleibt durch den Kontext erhalten.
- source_word: aeon
  choice: Äon
  rationale: Der kosmologische Fachbegriff wird transliteriert, da „Zeitalter“ hier die räumlich-wesenhafte Dimension verengen würde.
- source_word: lust for control
  choice: Herrschsucht
  rationale: Gibt sowohl das Begehren nach Macht als auch dessen negative Wertung prägnant wieder.
- source_word: archons
  choice: Archonten
  rationale: Behält den technischen Rangtitel bei, weil „Herrscher“ die besondere kosmologische Klasse verwischen könnte.
- source_word: plan of salvation
  choice: Heilsplan
  rationale: Natürliches, würdevolles Deutsch, das die teleologische Aussage wiedergibt, ohne den Inhalt des Heils konfessionell festzulegen.
theological_decisions:
- issue: Status des „Wortes“
  choice: „das Wort“ mit neutralen Pronomen
  alternative: „der Logos“ mit männlichen Pronomen
  rationale: Das Zeugnis bezeichnet eine handelnde Größe, identifiziert sie hier aber nicht ausdrücklich mit einer bestimmten dogmatischen Logoslehre. Die deutsche Grammatik wird gewahrt, ohne die Personalität zu leugnen.
- issue: „the two orders subsist in a name“
  choice: „die beiden Ordnungen bestehen in einem Namen“
  alternative: „bestehen kraft eines Namens“ oder „haben ihr Dasein in einem Namen“
  rationale: Die schwer deutbare ontologische Beziehung zwischen Ordnung und Name wird nicht stillschweigend kausal erklärt.
- issue: Demut als Gerichtsmacht
  choice: Die spannungsreiche Verbindung von Demut, Verurteilung und Zorn bleibt stehen
  alternative: „Unterwerfung“ statt „Demut“
  rationale: Obwohl der Zusammenhang ungewöhnlich ist, darf die positive oder negative Bedeutung nicht ohne koptische Prüfung festgelegt werden.
- issue: Hierarchie und Heilsplan
  choice: Die Mächte werden als für den Heilsplan nützlich und damit betraut dargestellt
  alternative: Sie nur als feindliche Gewalten kennzeichnen
  rationale: Die Vorlage verbindet Herrschsucht und gerichtliche Funktionen mit einer providenziellen Nutzung; diese theologische Spannung wird bewahrt.
- issue: Bezeichnungen der beiden Ordnungen
  choice: Alle parallelen Gruppennamen werden substantivisch und ohne zusätzliche Erklärung wiedergegeben
  alternative: Die Gruppen als gute und böse Wesen etikettieren
  rationale: Der Abschnitt enthält Wertungen, aber die Zuordnung ist komplexer als eine ausdrücklich formulierte einfache Gut-Böse-Dichotomie.
translation_notes:
  register: Moderne deutsche Standardsprache in würdigem, sachlichem Register. Kosmologische Fachbegriffe werden nur dort beibehalten, wo eine alltagssprachliche Ersetzung Bedeutungsdimensionen verlieren ließe. Der Entwurf beruht mangels abgeschlossener Prüfung des koptischen Textes auf dem angegebenen gemeinfreien englischen Zeugnis; Schadstellen und Ergänzungen werden sichtbar bewahrt.
