translation:
  language: de
  text: 'Einem der Äonen kam der Gedanke, zu versuchen, die Unfassbarkeit zu erfassen und sie zu verherrlichen, besonders aber die Unaussprechlichkeit des Vaters. Weil er ein Wort aus der Einheit ist, ist er einer; [doch] stammt er weder aus der Einheit der Gesamtheiten noch von dem, der sie hervorgebracht hat, das heißt von dem, der die Gesamtheit hervorgebracht hat, nämlich dem Vater. Dieser Äon gehörte zu denen, denen Weisheit gegeben worden war, zu denen, deren Denken schon vorher bestand und durch das sie hervorbrachten, was sie wollten. Daher empfing er eine ihm innewohnende Weisheit, um den verborgenen Grund zu erforschen, denn er ist eine Frucht der Weisheit. Der freie Wille, der zusammen mit den Gesamtheiten gezeugt worden war, war ein Grund dafür, dass dieser [] tat, was er begehrte, ohne dass ihn jemand zurückhielt.


    Die Absicht dieses einen, der das Wort ist, war gut. Als er hervorgebracht worden war, eilte er, den Vater zu verherrlichen. Doch <er> begehrte etwas Unmögliches: Er wollte aus einer Vereinigung, an der er keinen Anteil hatte, und ohne einen Auftrag ein vollkommenes Wesen hervorbringen. Dieser Äon war der letzte, der durch gegenseitige Mitwirkung <hervorgebracht worden war>, und er war von geringem Maß. Noch bevor er etwas zur Verherrlichung des Willens und im Einklang mit den Gesamtheiten zeugte, ging er freigebig aus überreicher Liebe hervor und bewegte sich auf das zu, was die vollkommene Herrlichkeit umgibt. Denn das Wort war nicht außerhalb des Willens des Vaters hervorgebracht worden; das heißt, es ging nicht ohne ihn hervor.


    Der Vater jedoch hatte ihn für diejenigen hervorgebracht, von denen er wusste, dass es ihnen zukam, hervorzubringen. Der Vater und die Gesamtheiten zogen sich von ihm zurück, damit die vom Vater gesetzte Grenze Bestand bekäme; denn dies geschieht nicht dadurch, dass man das Unfassbare erfasst, sondern durch den Willen [] des Vaters. Außerdem geschah dies, damit das, was ins Dasein gekommen war, zu einem Heilsplan werden konnte, der sich entfalten sollte und sich <unweigerlich> entfalten musste, um die Fülle[a] zu offenbaren. Daher ist es nicht angebracht, über dieses Handeln des Wortes abfällig zu sprechen. Angebracht ist vielmehr zu sagen, dass dieses Handeln des Wortes die Ursache eines Heilsplans ist, der sich entfalten sollte.


    Das Wort zeugte sich selbst als vollkommen und einzig und begnügte sich damit um der Herrlichkeit des Vaters willen, nach der es verlangte. Diejenigen jedoch, die es fest ergreifen wollte, zeugte es in Schatten, Bildern und Abbildern. Es vermochte nicht, in das Licht zu schauen; stattdessen blickte es in die Tiefe und zweifelte. Daraus entstanden eine Trennung, die es heftig erschütterte, und ein Rückzug, verursacht durch seinen Selbstzweifel und seine Trennung, sein Selbstvergessen, seine Unkenntnis seiner selbst und <dessen>, was existiert.


    Seine Selbsterhöhung und sein Glaube, es könne das Unfassbare erfassen, verhärteten sich in ihm und schlugen in ihm Wurzeln. Diese Schwächen blieben jedoch bei ihm, solange es außer sich war; sie wurden durch Selbstzweifel verursacht, weil <es nicht dazu gelangte,> die Herrlichkeiten des Vaters <zu erreichen>, dessen Erhabenheit unnachahmlich ist. Es gelangte nicht dorthin, weil es sie nicht erfassen konnte.


    Derjenige, den es aus sich selbst [] als einen einzigen Äon hervorgebracht hatte, eilte hinauf zu dem, was ihm gehörte. Dieser sein Verwandter in der Fülle verließ den, der im Mangel entstanden war, samt denen, die dieser auf eingebildete Weise hervorgebracht hatte, denn sie gehören nicht zu ihm. Nachdem er sich selbst vollkommen hervorgebracht hatte – er, der sich tatsächlich selbst hervorgebracht hatte –, wurde er schwach wie eine weibliche Natur, die ihr männliches Gegenstück verlässt. Aus dem, was in ihm mangelhaft war, gingen jene hervor, die seinem Denken und seinem Hochmut entsprangen. Doch aus dem, was in ihm vollkommen ist, löste er sich davon und [erhob sich] zu denen hinauf, die zu ihm gehören. Er wohnte in der Fülle als eine Erinnerung für ihn, weil [er von seinem Hochmut] gerettet worden war.


    Derjenige, der hinaufeilte, und derjenige, der ihn zu sich zog, waren nicht unfruchtbar. Indem sie in der Fülle eine Frucht hervorbrachten, setzten sie das ab, was im Mangel entstanden war. Was aus dem hochmütigen Denken entstand, gleicht den Füllen: Es sind deren Abbilder, Bilder, Schatten und Trugbilder, ohne Vernunft und Erleuchtung; sie gehören einem leeren Denken an, weil sie von nichts hervorgebracht wurden. [] Daher wird ihr Ende ihrem Anfang entsprechen; denn was niemals war, wird zu dem zurückkehren, was niemals sein wird. Dennoch halten sie sich für größer, stärker und [ehrenvoller] als die Namen, [die ihnen Schönheit verleihen] und deren Schatten sie sind. Sie gleichen einem schönen Spiegelbild, [das jemand sieht]; denn das Antlitz eines Abbildes empfängt seine Schönheit gewöhnlich von dem Bild, das es widerspiegelt.


    Sie meinten, sie bestünden aus sich selbst und hätten keinen Ursprung, weil sie nichts anderes sahen, das vor ihnen existiert hätte. So lebten sie in Auflehnung und rebellischem Handeln und demütigten sich nicht vor dem, um dessentwillen sie ins Dasein gekommen waren. In ihrem Streben nach Herrlichkeit wollten sie einander befehlen und übereinander herrschen, während die Herrlichkeit, die sie besaßen, die Ursache [für] die Ordnung[b] einschloss, die entstehen sollte. Weil [sie] Abbilder dessen sind, was oben ist, <erhoben sie> sich aus Herrschsucht selbst – jeder nach dem Maß des großen Namens, dessen Schatten er ist, und jeder in der Meinung, seinen Gefährten überlegen zu sein.


    Das Denken dieser anderen war nicht unfruchtbar. Wie bei <denen>, deren Schatten sie sind, jeder Gedanke zu einem Sohn wird, [] so wird auch das, was sie denken, zu ihrer Nachkommenschaft. So geschah es, dass aus ihnen eine Menge Nachkommen hervorging: Kämpfer, Krieger, Unruhestifter, ungehorsame Aufrührer, Herrschsüchtige und jedes andere Wesen dieser Art, das ihnen entsprang.


    Das Wort war die Ursache dafür, dass diese Menge ins Dasein kam, und es wurde immer ratloser und verwunderte sich. Statt Vollkommenheit sah es Mangel, statt Einheit Trennung, statt Festigkeit [sah es] Schwächen, statt [Ruhe] Unruhen. Es [konnte] sie nicht davon abbringen, die Unruhe [zu lieben], und [es] konnte sie auch nicht beseitigen. Es war [völlig] machtlos; seine Gesamtheit und seine [Vollkommenheit] hatten es verlassen.


    Diejenigen, die entstanden waren, ohne sich selbst zu kennen, kannten weder die Füllen, aus denen sie stammten, noch die Ursache ihres Daseins. In dieser unsicheren Lage vermochte das Wort nichts Weiteres hervorzubringen, das den Ausströmungen[c] glich – jenen, die in der Fülle wohnen, den Herrlichkeiten, die zur Herrlichkeit des Vaters bestehen. Stattdessen brachte es [] winzige Schwächlinge hervor, begrenzt durch die Gebrechen, die auch es selbst einengten.


    Das Abbild, das sich allein in dieser Lage befand, war die Ursache jener Dinge gewesen, die nicht von Anfang an die Ursache ihres eigenen Daseins waren. Derjenige, der sich in dieser mangelhaften Lage befand, brachte weiterhin mangelhafte Wesen hervor, bis er das Urteil aussprach und die vernunftlosen Wesen verurteilte, die er hervorgebracht hatte. Er kämpfte gegen sie, bis sie vernichtet waren – nämlich diejenigen, die gegen die Verurteilung angekämpft hatten –, [während] der Zorn sie verfolgte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fülle“ ist hier ein kosmologischer Fachbegriff; häufig wird dafür auch das griechische Lehnwort „Pleroma“ verwendet.
    reason: Begriffserklärung ohne dogmatische Festlegung.
  - marker: b
    text: Das zugrunde liegende Wort kann hier auch „System“, „Gefüge“ oder „Weltordnung“ bezeichnen.
    reason: Lexikalische Mehrdeutigkeit des kosmologischen Zusammenhangs.
  - marker: c
    text: 'Wörtlich bzw. fachsprachlich: „Emanationen“, also Hervorgänge oder Ausströmungen aus einer höheren Wirklichkeit.'
    reason: Erläuterung eines religionsgeschichtlichen Fachbegriffs.
lexical_decisions:
- source_word: aeon
  choice: Äon
  rationale: Der etablierte religionsgeschichtliche Fachbegriff bewahrt die personale und kosmologische Mehrdeutigkeit.
- source_word: Word
  choice: das Wort
  rationale: Entspricht dem Logos-Begriff, ohne die Gestalt vorschnell mit einer bestimmten theologischen Deutung gleichzusetzen.
- source_word: Totalities / Totality
  choice: Gesamtheiten / Gesamtheit
  rationale: Die formale Unterscheidung von Plural und Singular bleibt erhalten; eine Harmonisierung mit „Fülle“ würde verschiedene Begriffe vermischen.
- source_word: Fullness / Fullnesses
  choice: Fülle / Füllen
  rationale: Gibt den gnostischen Fachbegriff verständlich wieder und wahrt ungewöhnliche Pluralformen, wo der Zeuge sie bietet.
- source_word: plan of salvation
  choice: Heilsplan
  rationale: Natürliches, würdiges Deutsch für eine sich entfaltende Heilsordnung, ohne den Ablauf näher dogmatisch festzulegen.
- source_word: emanations
  choice: Ausströmungen
  rationale: Bewahrt die Vorstellung des Hervorgehens; eine Fußnote nennt den fachsprachlichen Ausdruck „Emanationen“.
- source_word: system
  choice: Ordnung
  rationale: Im kosmologischen Zusammenhang ist „Ordnung“ natürlicher als „System“, ohne den genauen Sinn festzulegen.
theological_decisions:
- issue: Beziehung des Wortes zum Vater und zu den Gesamtheiten
  choice: Die widersprüchlich wirkende Aussage wird eng am Zeugen wiedergegeben.
  alternative: Sie durch eine eindeutige Hervorbringungs- oder Wesenslehre harmonisieren.
