    Sie waren die Väter der dritten Verherrlichung. Diese entsprach der Freiheit und der mit ihnen gezeugten Kraft und verlieh ihnen die Fähigkeit, sowohl gemeinsam als auch jeder für sich aus freiem Willen zu verherrlichen. Sie waren die erste und die zweite Verherrlichung; beide sind vollkommen und erfüllt, denn sie sind Offenbarungen des vollkommenen und erfüllten Vaters sowie jener vollkommenen Dinge, die aus der Verherrlichung des Vollkommenen hervorgingen. Die Frucht der dritten Verherrlichung dagegen umfasst den Willen jedes einzelnen Äons und jede Eigenschaft und Kraft des Vaters. Diese Frucht ist vollständig und vollkommen, insofern die Herrlichkeit, die die Äonen dem Vater geben wollen und geben können, aus ihrer Übereinstimmung und zugleich aus jedem Einzelnen hervorgeht. Dies liebt er, und darüber übt er Macht aus, denn dadurch wird der Vater verherrlicht. Deshalb sind sie Gedanken von Gedanken, die sich als Worte von Worten erweisen, Älteste von Ältesten und Stufen von Stufen,
    wobei einer über den anderen erhöht ist.



    Jeder, der verherrlicht, hat seinen Ort, seine Erhöhung, seine Wohnstätte und seine Ruhe; sie umfassen die Herrlichkeit, die er darbringt. Alle, die den Vater verherrlichen, besitzen ein ewiges Zeugen: Sie zeugen, indem sie einander helfen. Denn die Ausströmungen sind unendlich und unermesslich, und im Vater findet sich gegenüber denen, die aus ihm hervorgegangen sind, keine Spur von Neid, wenn sie etwas hervorbringen, das ihm gleich oder ähnlich ist. Denn er ist in den Allheiten gegenwärtig, zeugt und offenbart sich selbst. Wen er will, macht er zu einem Vater – und tatsächlich ist er dessen Vater. Wen er will, macht er zu einem Gott – und tatsächlich ist er dessen Gott. Und er macht sie zu den Allheiten, ⟨für die⟩ er das All ist. …[e] Genau genommen sind dort alle großen Namen vorbehalten, die auch den Engeln zukommen, die zusammen mit den Herrschermächten[f] in der Welt entstanden sind, obwohl sie keinerlei Ähnlichkeit mit den ewigen Wesen besitzen.'
