translation:
  language: de
  text: 'Er offenbarte den Allheiten[a] die verschiedenen Eigenschaften nicht alle auf einmal; ebenso wenig offenbarte er denen, die aus ihm hervorgegangen waren, seine Selbstgleichheit. Alle, die aus ihm hervorgegangen sind, ⟨die⟩ Äonen[b] der Äonen, …[c] sind Ausströmungen und Nachkommen ⟨seiner⟩ zeugenden Natur. Darum ⟨zeugen⟩ auch sie in ihrer eigenen zeugenden Natur zur Herrlichkeit des Vaters; denn er ist die Ursache, die ihnen Bestand gab. Wie wir schon sagten, bringt er die Äonen als Wurzeln, Quellen und Väter hervor. Ihn verherrlichen sie, weil er Erkenntnis und Weisheit besitzt und weil die Allheiten erkannten, dass sie aus der Erkenntnis und Weisheit des Alls hervorgegangen waren.


    Hätten die Wesen des Alls den Vater nur entsprechend den eigenen ⟨Fähigkeiten⟩ jedes einzelnen Äons verherrlicht, so wäre das, was sie hervorgebracht hätten, lediglich ein blasses Abbild des Vaters gewesen, der das All ist. Deshalb wurden sie im Lobgesang und durch die Kraft seiner Einheit, aus der sie hervorgegangen waren, miteinander zu einer Verbindung, einer Vermischung und einer Einheit zusammengeführt. Aus der Versammlung der Fülle brachten sie dem Vater eine würdige Verherrlichung dar: ein einziges und doch vielfaches Bild. Denn es wurde zur Herrlichkeit des Einen hervorgebracht, und sie näherten sich dem, der selbst die Allheiten ist.


    Es war ein Lobpreis ⟨der Äonen⟩ für den, der die Allheiten als Erstlingsgabe der Unsterblichen und als ein ewiges Wesen hervorgebracht hatte.[d] Denn sie waren aus den lebendigen Äonen hervorgegangen, vollkommen und erfüllt durch den Vollkommenen und Erfüllten. Aufgrund ihrer Gemeinschaft blieb der erfüllte und vollkommene Zustand derer, die auf vollkommene Weise verherrlichten, unversehrt – so wie der vollkommene Vater, der, wenn er verherrlicht wird, auch die Verherrlichung hört, die ⟨ihn⟩ verherrlicht, um offenbar zu machen, dass auch sie das sind, was er ist.


    Der Grund für die zweite Ehre, die ihnen zuteilwurde, war das, was vom Vater zu ihnen zurückkehrte, als sie die Gabe erkannten, durch die sie füreinander für den Vater Frucht tragen konnten. So zeigte sich: Wie sie für den Vater in Herrlichkeit ⟨hervorgebracht worden waren⟩, so erschienen sie auch vollkommen, während sie ihn verherrlichten.


    Sie waren die Väter der dritten Verherrlichung. Diese entsprach der Freiheit und der Kraft, die mit ihnen gezeugt worden war und ihnen die Fähigkeit verlieh, sowohl gemeinsam als auch jeder für sich aus freiem Willen zu verherrlichen. Sie waren die erste und die zweite Verherrlichung; beide sind vollkommen und erfüllt, denn sie sind Offenbarungen des vollkommenen und erfüllten Vaters sowie jener vollkommenen Dinge, die aus der Verherrlichung des Vollkommenen hervorgingen. Die Frucht der dritten Verherrlichung dagegen umfasst den Willen jedes einzelnen Äons und jede Eigenschaft und Kraft des Vaters. Diese Frucht ist vollständig und vollkommen, insofern die Herrlichkeit, die die Äonen dem Vater geben wollen und geben können, aus ihrer Übereinstimmung und zugleich aus jedem Einzelnen hervorgeht. Dies liebt er, und darüber übt er Macht aus, denn dadurch wird der Vater verherrlicht. Deshalb sind sie Gedanken von Gedanken, die sich als Worte von Worten erweisen, Älteste von Ältesten und Stufen
    von Stufen, wobei einer über den anderen erhöht ist.


    Jeder, der verherrlicht, hat seinen Ort, seine Erhöhung, seine Wohnstätte und seine Ruhe; sie umfassen die Herrlichkeit, die er darbringt. Alle, die den Vater verherrlichen, besitzen ein ewiges Zeugen: Sie zeugen, indem sie einander helfen. Denn die Ausströmungen sind unendlich und unermesslich, und im Vater findet sich gegenüber denen, die aus ihm hervorgegangen sind, keine Spur von Neid, wenn sie etwas hervorbringen, das ihm gleich oder ähnlich ist. Denn er ist in den Allheiten gegenwärtig, zeugt und offenbart sich selbst. Wen er will, macht er zu einem Vater – und tatsächlich ist er dessen Vater. Wen er will, macht er zu einem Gott – und tatsächlich ist er dessen Gott. Und er macht sie zu den Allheiten, ⟨für die⟩ er das All ist. …[e] Genau genommen sind dort alle großen Namen aufbewahrt. Auch die Engel haben Anteil an ihnen, die zusammen mit den Herrschermächten[f] in der Welt entstanden sind, obwohl sie keinerlei Ähnlichkeit mit den ewigen Wesen besitzen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Allheiten“ bezeichnet hier die Gesamtheit beziehungsweise Vielheit der aus dem Vater hervorgegangenen Wesen. Der Singular „das All“ bezeichnet das umfassende Ganze.
    reason: Der ungewöhnliche Fachbegriff benötigt eine knappe Orientierung und die Singular-Plural-Unterscheidung ist inhaltlich wichtig.
  - marker: b
    text: „Äonen“ sind hier ewige, personale oder hypostatische Wesen, nicht lediglich Zeitabschnitte.
    reason: Verhindert ein naheliegendes modernes Missverständnis, ohne eine weitergehende dogmatische Festlegung.
  - marker: c
    text: An dieser Stelle weist das zugrunde gelegte englische Textzeugnis eine Lücke auf. Die Winkelklammern im Text kennzeichnen editorisch ergänzte Wörter.
    reason: Macht Textverlust und Rekonstruktionen transparent; eine direkte Prüfung des koptischen Manuskripts steht noch aus.
  - marker: d
    text: Der genaue Bezug von „Erstlingsgabe der Unsterblichen“ und „ewiges Wesen“ ist im zugrunde gelegten Zeugnis unsicher.
    reason: Bewahrt eine grammatische und theologische Mehrdeutigkeit, statt sie stillschweigend aufzulösen.
  - marker: e
    text: Das zugrunde gelegte englische Textzeugnis zeigt hier eine weitere Lücke.
    reason: Kennzeichnet den überlieferten Textverlust.
  - marker: f
    text: 'Wörtlich beziehungsweise als Fachbegriff: „Archonten“, also Herrscher oder Herrschermächte.'
    reason: Erhält den traditionsgeschichtlichen Begriff, während der Haupttext allgemein verständlich bleibt.
lexical_decisions:
- source_word: Totalities / Totality
  choice: Allheiten / All
  rationale: Bewahrt die im Traktat wichtige Unterscheidung zwischen der Vielheit aller hervorgegangenen Wesen und dem umfassenden Ganzen; „Gesamtheiten“ wäre im Deutschen schwerfälliger und weniger als kosmologischer Fachbegriff erkennbar.
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte deutschsprachige Fachbegriff bezeichnet hier personale beziehungsweise hypostatische ewige Wesen und nicht bloß Zeitzeitalter.
- source_word: Fullness
  choice: Fülle
  rationale: Gibt den kosmologischen Begriff würdig und verständlich wieder, ohne ihn durch eine konfessionelle Deutung festzulegen.
- source_word: emanations
  choice: Ausströmungen
  rationale: Bewahrt die bildhafte Herkunft aus dem Vater und vermeidet, den Vorgang vorschnell als Schöpfung aus dem Nichts zu deuten.
- source_word: procreative nature / procreate
  choice: zeugende Natur / zeugen
  rationale: Hält die wiederkehrende Wortverbindung und die organische Fortpflanzungsmetaphorik des Abschnitts zusammen.
- source_word: minds of minds
  choice: Gedanken von Gedanken
  rationale: Das englische Zeugnis lässt „mind“ zwischen Geist, Denken und Gedanke schwanken. „Gedanken“ passt zum parallelen „Worte von Worten“, ohne eine eindeutige ontologische Deutung zu erzwingen.
- source_word: archons
  choice: Herrschermächte
  rationale: Vermittelt die Bedeutung für gewöhnliche Leser; eine Fußnote nennt den Fachbegriff „Archonten“.
theological_decisions:
- issue: Gleichheit der hervorgegangenen Wesen mit dem Vater
  choice: „etwas …, das ihm gleich oder ähnlich ist“ und „auch sie das sind, was er ist“ bleiben ungemildert stehen
  alternative: Die Aussagen als bloße moralische Ähnlichkeit oder abgeleitete Göttlichkeit erklären
  rationale: Der Text formuliert eine echte ontologische Spannung zwischen Ursprung, Teilhabe und Gleichheit; die Übersetzung darf sie nicht konfessionell auflösen.
- issue: Vaterschaft und Gottsein der Äonen
  choice: Die parallelen Aussagen „macht er zu einem Vater/Gott“ werden wörtlich und ohne Zusatz wiedergegeben
  alternative: „gottähnlich“ oder „göttlich“ einsetzen
  rationale: Die stärkere Prädikation gehört zum theologischen Profil des Traktats und soll nicht abgeschwächt werden.
- issue: Drei Verherrlichungen
  choice: Die unklare Zuordnung von erster, zweiter und dritter Verherrlichung wird syntaktisch geglättet, aber nicht systematisiert
  alternative: Eine feste heilsgeschichtliche oder trinitarische Stufenfolge ergänzen
  rationale: Das überlieferte Zeugnis erklärt die Stufen nicht eindeutig; eine präzisierende Lehrdeutung wäre ein Import.
- issue: „first-fruit of the immortals and an eternal one“
  choice: „als Erstlingsgabe der Unsterblichen und als ein ewiges Wesen“
  alternative: Den Hervorbringer selbst eindeutig als Erstling und Ewigen bestimmen
  rationale: Die grammatische Beziehung ist im konsultierten Zeugnis unsicher. Die deutsche Fassung wahrt die Mehrdeutigkeit und kennzeichnet sie in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachbegriffen. Wiederholungen wie „vollkommen und erfüllt“, „verherrlichen“ und „zeugen“ wurden erhalten, weil sie die Argumentation tragen. Lange Perioden wurden behutsam gegliedert. Grundlage ist ausschließlich das bereitgestellte gemeinfreie englische Zeugnis; eine direkte koptologische Prüfung von Nag Hammadi Codex I,5 steht noch aus. Seitenmarken wurden nicht in den Lesetext übernommen, Textlücken und Ergänzungen dagegen sichtbar gemacht.
