lexical_decisions:
- source_word: Totalities
  choice: Allheiten
  rationale: Als wiederkehrender technischer Begriff substantivisch und ungewöhnlich belassen; »Gesamtheit« oder »das All« könnten die Vielzahl-in-Einheit des Textes vorschnell einebnen.
- source_word: mixing / mingled
  choice: Vermischung / vermischt
  rationale: Die konkrete Bildsprache wird bewahrt, statt sie als bloße Gemeinschaft oder Teilhabe auszulegen.
- source_word: mind
  choice: Verstand
  rationale: Gibt die noetische Bedeutung verständlich wieder, ohne den Ausdruck mit einer späteren dogmatischen Fachbedeutung zu überladen.
- source_word: providence
  choice: Fürsorge
  rationale: Natürliches modernes Deutsch, das planendes und leitendes Sorgen umfasst; die verwandte Verbform wird mit »fürsorglich leitet« sichtbar gehalten.
- source_word: assembly
  choice: Gemeinschaft
  rationale: Passt zum folgenden Versammeln und vermeidet die konfessionell enger klingende Wiedergabe »Kirche«.
- source_word: human from the Father
  choice: der Mensch aus dem Vater
  rationale: Die auffällige anthropologische Bezeichnung wird wörtlich bewahrt und nicht christologisch präzisiert.
theological_decisions:
- issue: Verhältnis von Vater, Sohn und Allheiten
  choice: Die wechselnden Identifikationen werden ohne systematische Harmonisierung wiedergegeben.
  alternative: Vater und Sohn terminologisch schärfer voneinander abgrenzen oder »Allheiten« als Schöpfung erklären.
  rationale: Der Text verbindet Unterscheidung und Identität bewusst; eine Auflösung würde seine genuine theologische Spannung beseitigen.
- issue: »the first one who came to be« neben »pre-existent«
  choice: »der Erste, der entstand« und »der … vorher existiert« stehen nebeneinander.
  alternative: »entstand« abschwächen oder auf eine andere Gestalt beziehen.
  rationale: Die schwer auflösbare Spannung des Zeugen bleibt sichtbar.
- issue: »god of those who are«
  choice: »Gott der Seienden«
  alternative: »Gott aller Wesen« oder »Gott der Existierenden«
  rationale: Die ontologische Ausdrucksweise wird knapp und würdig erhalten, ohne die Referenzgruppe näher zu bestimmen.
- issue: »possessing a Son and a form«
  choice: »einen Sohn und eine Gestalt besitzt«
  alternative: Sohn und Gestalt gleichsetzen oder »seine Gestalt als Sohn« formulieren.
  rationale: Die syntaktische Beiordnung bleibt erhalten; ihre genaue metaphysische Bedeutung wird nicht festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener technischer und paradoxaler Sprache. Die poetische Titelfolge ist typografisch gegliedert. Grundlage ist der bereitgestellte gemeinfreie englische Textzeuge; eine unmittelbare Prüfung am koptischen Text steht noch aus. Textlücken und editorische Ergänzungen wurden sichtbar erhalten.
