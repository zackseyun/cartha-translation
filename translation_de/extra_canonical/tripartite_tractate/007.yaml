  language: de
  text: '## Der Vater und der Sohn


    Dieser ist es, der ihnen zur Erfüllung, zur Nahrung und zur Freude gegeben wurde, als ein Reichtum an Erleuchtung. Dieser umfasst sein gemeinsames Wirken mit ihnen, seine Erkenntnis und seine Vermischung mit ihnen. Dieser ist es tatsächlich, der »Sohn« genannt wird und der Sohn ist; denn er ist die Allheiten,[a] und sie wissen, wer er ist und dass er sie mit Gewändern bedeckt. Dieser ist es, der »Sohn« genannt wird, dessen Dasein sie begreifen und nach dem sie suchten. Dieser ist es, der als Vater existiert, über den sie nicht sprechen können und den sie nicht erfassen. Dieser ist der Erste, der entstand. Niemand kann ihn erfassen oder begreifen. Oder könnte sich jemand dem Erhabenen nahen, dem, der im eigentlichen Sinn vorher existiert? Doch alle Namen, die man sich für ihn ausdenkt […] oder mit denen man von ihm spricht, werden zu seiner Ehre gebraucht: als ein Hinweis auf ihn, je nachdem, wie viel jeder vermag, um ihn zu verherrlichen.[b]


    Derjenige, der aus ihm hervorging, als er sich ausstreckte, um zu zeugen und für die Allheiten Erkenntnis hervorzubringen — er […] jeden Namen ohne Falschheit. Im eigentlichen Sinn ist er der einzige Erste, der Mensch aus dem Vater, derjenige, den ich [nenne]:


    > die Gestalt ohne Gestalt,

    >

    > den Leib ohne Leib,

    >

    > das unsichtbare Angesicht,

    >

    > das unaussprechliche Wort,

    >

    > den unfassbaren Verstand,

    >

    > die aus ihm strömende Quelle,

    >

    > die Wurzel der Gepflanzten

    >

    > und den Gott der Seienden;

    >

    > das Licht derer, die er erleuchtet,

    >

    > die Liebe derer, die er liebt,

    >

    > die Fürsorge derer, die er fürsorglich leitet,

    >

    > die Weisheit derer, die er weise gemacht hat,

    >

    > die Kraft derer, die er mit Kraft erfüllt hat,

    >

    > die Gemeinschaft <derer>, die er bei sich versammelt,

    >

    > die Offenbarung dessen, wonach gesucht wird,

    >

    > das Auge der Sehenden,

    >

    > den Atem der Atmenden,

    >

    > das Leben der Lebenden,

    >

    > die Einheit derer, die mit den Allheiten vermischt sind.


    All diese bestehen in dem Einen, da er sich ganz mit ihnen bekleidet; dennoch wird er niemals mit seinem einen Namen genannt. Und auf diese einzigartige Weise sind sie gleichermaßen der Eine und die Allheiten. Er lässt sich nicht wie ein Körper zerlegen, und er wird auch nicht durch die Namen geteilt, die er empfangen hat, als wäre er auf eine Weise das eine und […] auf eine andere Weise etwas [anderes]. Ebenso verändert er sich nicht in […], und er verwandelt sich auch nicht in die Namen, die er sich vorstellt, sodass er jetzt dieses und dann jenes würde, jetzt das eine wäre und zu einer anderen Zeit etwas anderes würde. Vielmehr bleibt er bis ans Ende ganz er selbst. [Er ist] zugleich und ewig alle Allheiten ohne Ausnahme. Er ist es, der sie alle umfasst. Er hat den Allheiten den Vater vor Augen gestellt. Ja, er ist sogar die Allheiten; denn er ist seine eigene Selbsterkenntnis und jede Eigenschaft und Kraft. Und [er] selbst [ist] das Auge, durch das er Erkenntnis besitzt, indem er
    sich selbst in sich selbst vollkommen schaut und einen Sohn und eine Gestalt besitzt.[c]


    Seine Kräfte und Eigenschaften sind daher unzählbar und unerhört aufgrund der Art, wie er sie zeugt. Unzählbar und untrennbar sind diejenigen, die seine Worte zeugen; ebenso seine Unterweisungen und seine Allheiten. Er kennt sie, die das sind, was er selbst ist; denn sie bestehen in dem einen Namen, und sie alle sprechen durch ihn. Und er bringt sie hervor, damit sie entdecken, dass sie ihren jeweiligen Eigenschaften entsprechend auf geeinte Weise existieren.


    ### Anmerkungen


    [a] »Allheiten« gibt den technischen Sammelbegriff des Textes wieder. Gemeint ist nicht bloß »alles« im alltäglichen Sinn, sondern die Gesamtheit der aus dem Vater hervorgegangenen Wirklichkeiten.


    [b] Auslassungspunkte in eckigen Klammern kennzeichnen eine Textlücke; ergänzte Wörter stehen in eckigen oder, entsprechend dem zugrunde gelegten Textzeugen, in spitzen Klammern.


    [c] Die Aussage lässt offen, wie »Sohn« und »Gestalt« hier genau zueinander und zu dem Schauenden stehen; diese Spannung wird nicht erklärend aufgelöst.'
