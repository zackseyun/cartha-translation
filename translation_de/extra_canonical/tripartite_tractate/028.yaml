base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/028.yaml
  text: 'Concerning the true baptism, into which the Totalities descend and in which they come into being, there is no baptism other than this one. It is redemption in God the Father, the Son, and the Holy Spirit, when faith is professed in those names, [which] are the single name of the gospel, [] when someone has believed that the things told to them are real.


    For someone who believes that they exist, this means receiving, invisibly, the Father, the Son, and the Holy Spirit by testifying with firm faith and understanding them with firm hope. On this basis, attaining what someone has believed could become a return for that person, so that the Father could become one with him—the Father (and) God whom he has professed in faith and who granted that he should be made one with him in knowledge.


    The baptism mentioned earlier is called “the garment <that> those who wear it do not remove,” because it is put on by those who have received redemption. It is also called “the confirmation of the unfailing truth,” since it is unmoving and unshakable, firmly grasping those who have received <restoration> while they firmly grasp it. It is called “silence” because of its quietness and immovability. It is also called “bridal chamber” because of the harmonious and inseparable condition of those [whom] <he has> known <and who> have known him. It is also called [] “the light that does not set and is without flame,” not because it fails to give light, but because those who put it on and those whom it clothes are transformed into light. It is also called “eternal life,” which is deathlessness.


    Thus, whatever it is called, including its names <omitted> here, corresponds to all the beautiful things it contains in a manner that is simple, pleasant, inseparable, intricate, perfect, and unshakable. How, then, can it be named except as the Totality? Even if countless names were assigned to it, they would be spoken simply as a way of referring to it, when in fact it transcends all words, all voices, and all thoughts. It transcends everything, and it transcends all silence. So it is <…> with those who are what it is. This is indeed what it is, possessing a face that cannot be spoken or grasped, glorified by those who possess knowledge through what they have grasped.'
translation:
  language: de
  text: 'Zur wahren Taufe, in welche die Gesamtheiten hinabsteigen und in der sie ins Dasein kommen, gilt: Es gibt keine andere Taufe als diese. Sie ist die Erlösung in Gott, dem Vater, dem Sohn und dem Heiligen Geist, wenn man sich im Glauben zu jenen Namen bekennt, [die] der eine Name des Evangeliums sind,[a] wenn jemand geglaubt hat, dass das, was ihm gesagt wurde, Wirklichkeit ist.


    Für jemanden, der an ihr Dasein glaubt, bedeutet dies, auf unsichtbare Weise den Vater, den Sohn und den Heiligen Geist zu empfangen, indem er mit festem Glauben Zeugnis ablegt und sie mit fester Hoffnung erkennt. Auf dieser Grundlage könnte das Erlangen dessen, was jemand geglaubt hat, für ihn zu einer Rückkehr werden, sodass der Vater mit ihm eins werden könnte – der Vater und Gott, zu dem er sich im Glauben bekannt hat und der ihm gewährte, in der Erkenntnis mit ihm eins gemacht zu werden.


    Die zuvor erwähnte Taufe wird »das Gewand, das seine Träger nicht ablegen« genannt, weil diejenigen es anziehen, die die Erlösung empfangen haben. Sie wird auch »die Bestätigung der unvergänglichen Wahrheit« genannt: Unbeweglich und unerschütterlich ergreift sie fest diejenigen, welche die Wiederherstellung empfangen haben, während auch sie an ihr festhalten. Sie wird wegen ihrer Ruhe und Unbeweglichkeit »Schweigen« genannt. Auch wird sie »Brautgemach« genannt wegen des harmonischen und untrennbaren Zustands derer, [die] er erkannt hat und die ihn erkannt haben. Ferner wird sie »das Licht, das nicht untergeht und ohne Flamme ist« genannt,[b] nicht weil es kein Licht gäbe, sondern weil diejenigen, die es anziehen, und diejenigen, die von ihm bekleidet werden, in Licht verwandelt werden. Sie wird auch »ewiges Leben« genannt, das heißt Unsterblichkeit.


    Was immer sie also genannt wird – einschließlich ihrer hier nicht überlieferten Namen[c] –, entspricht all dem Schönen, das sie in sich umfasst, auf eine Weise, die einfach, wohltuend, untrennbar, vielschichtig, vollkommen und unerschütterlich ist. Wie sollte sie demnach anders genannt werden als »die Gesamtheit«? Selbst wenn ihr unzählige Namen beigelegt würden, spräche man sie lediglich aus, um auf sie zu verweisen. Tatsächlich übersteigt sie alle Worte, alle Stimmen und alle Gedanken; sie übersteigt alles und übersteigt jedes Schweigen. So verhält es sich […] mit denen, die das sind, was sie ist.[d] Das ist es wahrhaftig: Es besitzt ein unaussprechliches und unfassbares Angesicht und wird von denen verherrlicht, die durch das, was sie erfasst haben, Erkenntnis besitzen.'
