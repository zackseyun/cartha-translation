review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem englischen Zeugen insgesamt eng und bewahrt die ungewöhnliche Terminologie »Gesamtheiten/Gesamtheit«, die Einheitsaussage über die Namen sowie die transzendente Schlussfolge angemessen. Einige editorische Schadens- und Ergänzungssignale des Zeugen wurden jedoch im deutschen Lauftext getilgt, besonders bei »<Wiederherstellung>«, der Brautgemach-Passage und den hier ausgelassenen Namen. Außerdem ist »unvergängliche Wahrheit« keine genaue Wiedergabe von »unfailing truth«, und »weil es kein Licht gäbe« verschiebt »not because it fails to give light«.
  naturalness: Das Deutsch ist überwiegend würdig, klar und modern. »sie mit fester Hoffnung erkennt« ist im Deutschen jedoch weniger passend für »understanding them« als »sie mit fester Hoffnung versteht«. Die bewusst fremdartige Syntax in den beschädigten und spekulativen Abschnitten bleibt dabei erhalten.
  terminology: »Erlösung«, »Erkenntnis«, »Brautgemach«, »Unsterblichkeit« und »Gesamtheit« sind tragfähige, nicht konfessionell einengende Entscheidungen. »Untrüglichkeit der Wahrheit« gibt den Sinn von »confirmation of the unfailing truth« genauer wieder als »Bestätigung der unvergänglichen Wahrheit«; »unvergänglich« bezeichnet primär Unzerstörbarkeit bzw. Dauer.
  issues:
  - severity: medium
    issue: Editorische Markierungen wurden mehrfach nicht im Lauftext bewahrt.
    rationale: 'Der Zeuge markiert Ergänzungen bzw. Textschäden mit spitzen und eckigen Klammern: <that>, <restoration>, [whom] <he has> known <and who>, [] sowie <omitted>. Fußnoten allein ersetzen diese textkritischen Signale nicht vollständig. Die deutsche Fassung soll sie sichtbar bewahren, ohne die Lücken inhaltlich zu füllen.'
  - severity: medium
    issue: »unvergängliche Wahrheit« für »unfailing truth«.
    rationale: »Unvergänglich« bedeutet nicht vergehend; »unfailing« meint nicht versagend bzw. untrüglich. Die Korrektur wahrt die Aussage ohne sie zu verstärken.
  - severity: low
    issue: »nicht weil es kein Licht gäbe« für »not because it fails to give light«.
    rationale: Die Vorlage verneint nicht das Vorhandensein von Licht, sondern ein Versagen des Lichtgebens. »nicht weil es nicht leuchtet« ist genauer und natürlich.
  - severity: low
    issue: »sie ... erkennt« für »understanding them«.
    rationale: »versteht« gibt den intellektuell-erfassenden Bezug wieder, ohne den technischen Begriff »Erkenntnis« im selben Satz unnötig vorwegzunehmen.
