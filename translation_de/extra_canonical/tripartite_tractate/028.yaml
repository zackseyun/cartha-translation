  footnotes:
  - marker: a
    text: Nach »Evangeliums« weist die Vorlage eine Textlücke auf. Die eckigen Klammern um »die« kennzeichnen unsicheren oder ergänzten Wortlaut.
    reason: Kennzeichnet Textschaden und redaktionelle Ergänzung, ohne den Satz spekulativ zu vervollständigen.
  - marker: b
    text: Vor dieser Bezeichnung liegt in der Vorlage eine Lücke vor.
    reason: Die überlieferte Aufzählung könnte ein fehlendes Wort oder eine weitere Bezeichnung enthalten.
  - marker: c
    text: Der Text zeigt hier an, dass Namen ausgefallen oder nicht überliefert sind.
    reason: Überführt das editorische Signal der Vorlage transparent in eine lesbare deutsche Form.
  - marker: d
    text: Vor »mit denen« ist der Text beschädigt; der genaue Zusammenhang lässt sich nicht sicher wiederherstellen.
    reason: Bewahrt die schwer verständliche Aussage, ohne die Lücke durch eine unbelegte Deutung zu schließen.
lexical_decisions:
- source_word: Totalities / Totality
  choice: Gesamtheiten / Gesamtheit
  rationale: Bewahrt die eigentümliche kosmologische Terminologie des Textes, ohne sie durch eine konfessionell oder systematisch festgelegte Deutung wie »All« oder »Fülle« zu vereindeutigen.
- source_word: redemption
  choice: Erlösung
  rationale: Natürliches und theologisch offenes deutsches Äquivalent; vermeidet eine unnötige Einengung auf Freikauf oder Loskauf.
- source_word: profession of faith
  choice: sich im Glauben bekennen
  rationale: Gibt den Bekenntnisakt idiomatisch wieder und hält den Zusammenhang mit Glauben ausdrücklich fest.
- source_word: reality
  choice: Wirklichkeit
  rationale: Entspricht dem ontologischen Gewicht der Aussage besser als das schwächere »wahr« oder »real«.
- source_word: return
  choice: Rückkehr
  rationale: Bewahrt die räumlich-soteriologische Bildlichkeit und lässt Ziel und Art der Rückkehr bewusst offen.
- source_word: knowledge
  choice: Erkenntnis
  rationale: Trägt im Deutschen den religiös-intellektuellen Sinn besser als das allgemeinere »Wissen«, ohne eine technische Lehrbedeutung aufzuzwingen.
- source_word: bridal chamber
  choice: Brautgemach
  rationale: Bewahrt das traditionsgeschichtlich markante Bild und klingt zugleich würdig und verständlich.
- source_word: deathlessness
  choice: Unsterblichkeit
  rationale: Natürliches modernes Deutsch; der gemeinte Zustand des Nichtsterbens wird prägnant wiedergegeben.
- source_word: intricate
  choice: vielschichtig
  rationale: Vermeidet die negative Färbung von »kompliziert« und gibt innere Komplexität bei gleichzeitiger Vollkommenheit wieder.
theological_decisions:
- issue: Einheit der trinitarischen Namen
  choice: »jene Namen, [die] der eine Name des Evangeliums sind«
  alternative: »jene Namen, die ein einziger Name des Evangeliums sind«
  rationale: Die grammatische Spannung zwischen Mehrzahl und Einheit bleibt erhalten; die eckige Klammer kennzeichnet den unsicheren beziehungsweise ergänzten Textbestand.
- issue: Verhältnis von Taufe und Erlösung
  choice: »Sie ist die Erlösung in Gott, dem Vater, dem Sohn und dem Heiligen Geist«
  alternative: »Sie ist die Erlösung durch Gott …«
  rationale: »In« wird bewahrt, da »durch« eine instrumentale Deutung einführen würde, die der Vorlage nicht eindeutig zu entnehmen ist.
- issue: Gegenseitige Einung mit dem Vater
  choice: »sodass der Vater mit ihm eins werden könnte … in der Erkenntnis mit ihm eins gemacht zu werden«
  alternative: »sodass er zum Vater zurückkehrt«
  rationale: Die ungewöhnliche wechselseitige Formulierung der Vorlage wird nicht zu einem geläufigeren Rückkehrschema geglättet.
- issue: Personbezug im Bild des Brautgemachs
  choice: »derer, [die] er erkannt hat und die ihn erkannt haben«
  alternative: Eine Auflösung von »er/ihn« auf Vater, Sohn oder Taufe
  rationale: Das Bezugswort bleibt in der beschädigten Passage unklar; eine dogmatische Identifizierung wäre spekulativ.
- issue: Licht und Bekleidung
  choice: »die es anziehen, und diejenigen, die von ihm bekleidet werden«
  alternative: Beide Satzglieder als identische Aktivhandlung wiedergeben
  rationale: Die auffällige reziproke beziehungsweise doppelte Bildsprache der Vorlage bleibt erhalten.
- issue: Transzendenz über das Schweigen
  choice: »sie übersteigt alles und übersteigt jedes Schweigen«
  alternative: »sie liegt jenseits aller sprachlichen und stillen Äußerung«
  rationale: Die emphatische Wiederholung und die theologische Spannung, dass sogar Schweigen überschritten wird, werden bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener mystischer und ontologischer Bildsprache. Ungewöhnliche Wiederholungen und Mehrdeutigkeiten wurden dort bewahrt, wo sie zum Gedankengang gehören. Da die direkte Prüfung des koptischen Textes noch aussteht, stützt sich der Entwurf auf den angegebenen gemeinfreien englischen Zeugen; Textlücken und Ergänzungen werden durch Fußnoten und Markierungen transparent gemacht.
