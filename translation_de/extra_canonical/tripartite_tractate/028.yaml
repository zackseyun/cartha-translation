    Für jemanden, der glaubt, dass sie existieren, bedeutet dies, auf unsichtbare Weise den Vater, den Sohn und den Heiligen Geist zu empfangen, indem er mit festem Glauben Zeugnis ablegt und sie mit fester Hoffnung versteht. Auf dieser Grundlage könnte das Erlangen dessen, was jemand geglaubt hat, ihm zu einer Rückkehr werden, sodass der Vater mit ihm eins werden könnte – der Vater (und) Gott, zu dem er sich im Glauben bekannt hat und der ihm gewährte, in der Erkenntnis mit ihm eins gemacht zu werden.


