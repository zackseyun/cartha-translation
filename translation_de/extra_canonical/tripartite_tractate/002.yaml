translation:
  language: de
  text: 'Wenn er also unbegreiflich ist, kann er folglich nicht erkannt werden. Kein Gedanke kann ihn erfassen; für alles ist er unsichtbar, mit keinen Worten auszusprechen und für keine Hand berührbar. Nur er selbst kennt sich so, wie er [] ist, und kennt seine Gestalt, seine Größe und sein Ausmaß, wie sie sind. Weil er sich selbst denken, sehen, benennen und begreifen kann, ist er der Einzige, dessen eigener Verstand, eigenes Auge, eigener Mund und eigene Gestalt seinem eigenen Sein entsprechen. So ist er das, was er denkt, was er sieht, was er ausspricht und was er begreift: das Undenkbare, Unaussprechliche, Unfassbare und Unveränderliche. Was er aber denkt, sieht und ausspricht, was er bedacht hat, ist Nahrung, Freude, Wahrheit, Wohlgefallen und Ruhe.[a] Er übertrifft alle Weisheit und steht über jedem Verstand, aller Herrlichkeit, aller Schönheit, aller Süße, aller Größe, jeder Tiefe und jeder Höhe.


    Der seinem Wesen nach Unerkennbare, der all die großen Eigenschaften besitzt, die ich aufgezählt habe, kann aus dem Reichtum seiner Süße die Erkenntnis schenken, durch die man ihn erkennt, wenn er es will. Seine Macht dazu ist sein Wille. Dennoch hält der Große sich schweigend zurück, er, der die Allheiten[b] in ihr ewiges Dasein hervorgehen lässt.


    [] Genau genommen zeugt er sich selbst auf unaussprechliche Weise. Denn nur er ist selbstgezeugt, weil er aus sich selbst gedacht ist und weil er sich kennt, wie er ist. Aus seiner unendlichen Größe, seiner unerforschlichen Weisheit, seiner unermesslichen Macht und seiner Süße, die über jedes Schmecken hinausgeht, bringt er alles hervor, was seiner Achtung, Herrlichkeit, Ehre und seines Lobes würdig ist. Er bringt sich selbst in der Weise der Zeugung hervor, empfängt Herrlichkeit und Lob, Ehre und Liebe, verherrlicht und lobt sich selbst und erweist sich selbst Ehre und Liebe. So hat er einen Sohn, der in ihm besteht. Über ihn schweigt er: unaussprechlich im Unaussprechlichen, unsichtbar im Unsichtbaren, unfassbar im Unfassbaren, unbegreiflich im Unbegreiflichen.


    Auf diese Weise besteht der Sohn für immer im Vater. Wie wir zuvor erklärt haben, erkennt der Vater sich selbst in sich selbst auf ungezeugte Weise; er hat sich durch einen Gedanken gezeugt. Der Gedanke über ihn ist das Wahrnehmen [] seiner selbst, das [. . .] seines ewigen Wesens.[c] Genau genommen aber ist dies das Schweigen, die Weisheit und die Gabe – sofern man es auf diese Weise zutreffend benennt. Wie der Vater im eigentlichen Sinn besteht, vor dem kein [anderer existierte] und außer [dem] es keinen anderen Ungezeugten gibt, so besteht auch [der Sohn] im eigentlichen Sinn: Vor ihm existierte kein anderer, und nach ihm wird es keinen anderen Sohn geben. Darum ist er ein Erstgeborener und einziger Sohn. Er ist der Erstgeborene, weil niemand vor ihm existiert, und er ist ein einziger Sohn, weil niemand nach ihm sein wird. Darüber hinaus hat er seine Frucht, die wegen ihrer alles überragenden Größe nicht erkannt werden kann. Dennoch wollte er aus dem Reichtum seiner Süße, dass seine
    Frucht erkannt werde. Und er offenbarte unaussprechliche Macht und vermischte sie mit dem großen Reichtum seiner Freigebigkeit.'
