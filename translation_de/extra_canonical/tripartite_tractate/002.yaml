  footnotes:
  - marker: a
    text: 'Der überlieferte Satzbau ist unsicher. Die Reihe kann auch adjektivisch verstanden werden: „nährend, freudig, wahr, wohlgefällig und Ruhe spendend“.'
    reason: Die englische Textgrundlage bietet eine grammatisch uneinheitliche Aufzählung; die Anmerkung bewahrt die Übersetzungsunsicherheit.
  - marker: b
    text: „Allheiten“ ist ein besonderer kosmologischer Ausdruck des Traktats und bezeichnet die Gesamtheiten oder Gesamtheit der hervorgebrachten Wirklichkeiten.
    reason: Der ungebräuchliche Plural braucht eine knappe Verständnishilfe, ohne ihn im Haupttext einzuebnen.
  - marker: c
    text: Die eckigen Klammern und die Auslassungspunkte kennzeichnen beschädigten oder fehlenden Text beziehungsweise editorisch ergänzten Wortlaut der Handschrift.
    reason: Die Leser müssen die sichtbaren Überlieferungslücken von stilistischen Auslassungen unterscheiden können.
lexical_decisions:
- source_word: incomprehensible / ungraspable
  choice: unbegreiflich / unfassbar
  rationale: 'Die im Zeugen erkennbare begriffliche Unterscheidung wird gewahrt: „unbegreiflich“ bezeichnet fehlendes Verstehen, „unfassbar“ fehlendes gedankliches Erfassen.'
- source_word: scale
  choice: Ausmaß
  rationale: „Ausmaß“ gibt die Dimension oder Größenordnung natürlich wieder, ohne eine konkrete räumliche Gestalt festzulegen.
- source_word: sustenance, joyful, true, pleasing, and restful
  choice: Nahrung, Freude, Wahrheit, Wohlgefallen und Ruhe
  rationale: Die syntaktisch schwierige Reihung wird als Folge von Substantiven wiedergegeben; damit bleibt offen, ob Eigenschaften oder Wirkungen gemeint sind.
- source_word: Totalities
  choice: Allheiten
  rationale: Ein markierter terminologischer Plural ist nötig; „Allheiten“ bewahrt den besonderen kosmologischen Ausdruck und vermeidet die Einebnung zu „alles“.
- source_word: self-begotten
  choice: selbstgezeugt
  rationale: Die wörtliche, ungewöhnliche Wortbildung erhält die besondere Aussage des Traktats.
- source_word: projects himself
  choice: bringt sich selbst hervor
  rationale: Das Deutsche bleibt verständlich und bewahrt den Gedanken einer Hervorbringung, ohne den fachsprachlich stärker festgelegten Ausdruck „emanieren“ einzuführen.
- source_word: subsisting in him
  choice: der in ihm besteht
  rationale: „Bestehen“ gibt fortdauernde Existenz wieder, ohne eine spätere metaphysische Terminologie aufzuzwingen.
- source_word: Firstborn and only Son
  choice: Erstgeborener und einziger Sohn
  rationale: Die beiden Titel und ihre unmittelbar folgende paradoxe Begründung bleiben getrennt erhalten.
- source_word: generosity
  choice: Freigebigkeit
  rationale: Das Wort bezeichnet die reiche, gebende Güte und passt zum unmittelbaren Bild des Reichtums.
theological_decisions:
- issue: Verhältnis von Vater, Selbstzeugung und Sohn
  choice: Die wechselnden Aussagen über Selbstzeugung und Sohnschaft werden ohne systematische Harmonisierung übersetzt.
  alternative: Alle Bezüge auf Selbstzeugung ausschließlich auf den Sohn oder ausschließlich auf den Vater beziehen.
  rationale: Der überlieferte Wortlaut verbindet Selbstdenken, Selbstzeugung und Sohnschaft in spannungsvoller Weise; eine eindeutige dogmatische Zuordnung wäre interpretierend.
- issue: Ewiges Bestehen des Sohnes im Vater
  choice: „Der Sohn besteht für immer im Vater.“
  alternative: „Der Sohn wohnt ewig im Vater“ oder eine trinitätstheologische Fachformel.
  rationale: „Besteht“ folgt der Existenzsprache des Zeugen, während „wohnt“ ein nicht vorhandenes Raumbild verstärken und eine Fachformel spätere Lehrbegriffe importieren würde.
- issue: „Erstgeborener“ und „einziger Sohn“
  choice: Beide Bezeichnungen samt der eigenen zeitlich klingenden Erklärung des Textes werden beibehalten.
  alternative: Die Erklärung so umformulieren, dass jede zeitliche oder ontologische Spannung beseitigt wird.
  rationale: Die auffällige Spannung gehört zur Argumentation des Traktats und darf nicht stillschweigend konfessionell aufgelöst werden.
- issue: Personbezug der „Frucht“
  choice: Das feminine Pronomen wird ausdrücklich als „seine Frucht“ wiederholt.
  alternative: Das Pronomen auf den Sohn oder die Macht beziehen.
  rationale: Der englische Zeuge markiert „fruit“ als wahrscheinlichsten Bezug; die Wiederholung verhindert im Deutschen eine unbeabsichtigte eindeutige Umdeutung.
- issue: Benennung von Schweigen, Weisheit und Gabe
  choice: Die vorsichtige Qualifikation „sofern man es ... zutreffend benennt“ bleibt erhalten.
  alternative: Die drei Begriffe als feste Namen oder Hypostasen darstellen.
  rationale: Der Text selbst relativiert die Benennung; deshalb werden die Begriffe nicht dogmatisch ontologisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenen Wiederholungen und paradoxen Formulierungen. Terminologisch markierte Wörter wie „Allheiten“ und „selbstgezeugt“ bleiben erkennbar fremdartig. Die Übersetzung ist vorläufig, da nur der bereitgestellte englische gemeinfreie Zeuge konsultiert werden konnte und eine unmittelbare Prüfung des koptischen Textes noch aussteht.
