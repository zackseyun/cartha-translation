base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/023.yaml
  text: 'The prophets, however, spoke nothing by their own will. Instead, each of them spoke about the things he saw and heard concerning the proclamation of the Savior. What he proclaimed—and the central theme of their proclamation—was what each one said about the coming of the Savior: that it would arrive. At times the prophets speak about it as though he has yet to be born, while at other times it is as though the Savior speaks through their mouths, saying that the Savior will arrive and show favor to those who did not know him. Accordingly, they did not all say everything in the same way. Rather, through the power given to each one to speak about him and about the place he saw, each thought that the Savior would be born from that place and would come from there. Accordingly, none of them knew where he would come from or who would beget him. They were worthy to speak only of this: that he would be born and would suffer. As for his pre-existence and his eternal existence as unbegotten,
    incapable of suffering <…> not from the Word, who came into being in flesh, [] it never entered their thoughts.


    And this is the message they were inspired to deliver concerning his flesh that would appear. It is said that his birth was like the birth of all of them, but that, above all else, it was from the spiritual Word, the cause of the things that have come into being. The one from whom the Savior received his flesh did indeed beget him in the form of a seed, at the revelation of the light, in agreement with the promised word of his revelation, <being> indeed the state of <a> seed of <what was>, though begotten last. However, the one whom the Father ordained to manifest salvation through him, who is the fulfillment of the promise, when he descended into life, he was given every means necessary for his descent. His Father is one, the only one who is truly a father to him: the unseen and unknowable one, ungraspable by nature, who alone is God and who, by his will and his gift, has granted that he could be seen, known, and grasped.'
translation:
  language: de
  text: 'Die Propheten jedoch sprachen nichts aus eigenem Willen. Vielmehr sprach jeder von ihnen über das, was er im Zusammenhang mit der Verkündigung des Retters gesehen und gehört hatte. Was er verkündete – und der Kern ihrer Verkündigung – war das, was jeder über das Kommen des Retters sagte: dass es eintreffen werde.[a] Manchmal sprechen die Propheten davon, als müsse er erst noch geboren werden; ein andermal ist es, als spräche der Retter durch ihren Mund und sagte, der Retter werde kommen und denen Gnade erweisen, die ihn nicht kannten. Daher sagten sie nicht alle alles auf dieselbe Weise. Vielmehr meinte jeder aufgrund der Kraft, die ihm gegeben war, über ihn und über den Ort zu sprechen, den er gesehen hatte, der Retter werde an jenem Ort geboren werden und von dort kommen. So wusste keiner von ihnen, woher er kommen oder wer ihn zeugen würde. Nur darüber zu sprechen waren sie würdig: dass er geboren werden und leiden würde. Was aber sein Dasein vor aller Zeit und sein ewiges Dasein
    als ungezeugt und leidensunfähig betrifft, <…> nicht aus dem Wort, das im Fleisch ins Dasein kam, [] – daran hatten sie nie gedacht.[b]


    Und dies ist die Botschaft, zu deren Weitergabe sie über sein Fleisch, das erscheinen sollte, inspiriert wurden. Es heißt, seine Geburt sei wie die Geburt von ihnen allen gewesen, doch vor allem sei sie aus dem geistlichen Wort hervorgegangen, der Ursache alles Gewordenen. Derjenige, von dem der Retter sein Fleisch empfing, zeugte ihn tatsächlich in Gestalt eines Samens, bei der Offenbarung des Lichts und in Übereinstimmung mit dem verheißenen Wort seiner Offenbarung, <wobei er> tatsächlich im Zustand <eines> Samens <dessen, was war,> war, obwohl zuletzt gezeugt.[c] Dem aber, den der Vater dazu bestimmt hatte, durch ihn das Heil sichtbar zu machen, und der die Erfüllung der Verheißung ist, wurde, als er in das Leben hinabstieg, alles gegeben, was für seinen Abstieg nötig war.[d] Sein Vater ist einer, der Einzige, der ihm wirklich Vater ist: der Unsichtbare und Unerkennbare, der seinem Wesen nach Unbegreifliche, der allein Gott ist und der durch seinen Willen und seine Gabe gewährt hat,
    dass er gesehen, erkannt und erfasst werden konnte.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise syntaktisch möglich: „über das Kommen des Retters, nämlich dass es kommen werde“. Das Pronomen kann sich auf das Kommen als Ereignis beziehen.'
    reason: Bewahrt die auffällige Unterscheidung zwischen dem Kommen und dem Retter.
  - marker: b
    text: Die Zeichen <…> und [] kennzeichnen eine Textlücke beziehungsweise beschädigten oder nicht sicher lesbaren Text. Der Zusammenhang von „ungezeugt und leidensunfähig“ mit „nicht aus dem Wort“ bleibt deshalb unsicher.
    reason: Der überlieferte Wortlaut ist an dieser theologisch wichtigen Stelle unvollständig.
  - marker: c
    text: Die in Winkelklammern stehenden Wörter sind editorisch ergänzter beziehungsweise unsicher wiederhergestellter Text. Der ganze Satz über Samen, Offenbarung und das zuletzt Gezeugte ist in seiner Syntax und Aussage unsicher.
    reason: Macht den Rekonstruktionsgrad transparent und verhindert eine irreführend glatte Deutung.
  - marker: d
    text: Der Ausdruck „durch ihn“ kann sich im beschädigten beziehungsweise komplexen Satzbau auf den zuvor genannten Mittler beziehen; der genaue Bezug ist nicht völlig sicher.
    reason: Erhält die pronominale Mehrdeutigkeit des Zeugen.
  - marker: e
    text: Wer genau gesehen, erkannt und erfasst werden konnte – Gott, der Vater oder der zuvor Genannte –, ist aufgrund der Pronomenfolge nicht völlig eindeutig.
    reason: Kennzeichnet eine echte Bezugsunsicherheit im Schluss des Abschnitts.
lexical_decisions:
- source_word: Savior
  choice: Retter
  rationale: „Retter“ ist im modernen Deutschen klar, würdig und bildet die wiederkehrende Titulatur ohne konfessionelle Zusatzbedeutung ab.
- source_word: bestow/show favor
  choice: Gnade erweisen
  rationale: Gibt die positive Zuwendung in einem religiösen Register natürlich wieder, ohne die Art der Wohltat weiter festzulegen.
- source_word: pre-existence
  choice: Dasein vor aller Zeit
  rationale: Verständlicher als das fachsprachliche „Präexistenz“ und zugleich offen für die kosmologische Aussage des Textes.
- source_word: unbegotten
  choice: ungezeugt
  rationale: Bewahrt den Gegensatz zum später mehrfach verwendeten „zeugen/gezeugt“.
- source_word: impassible
  choice: leidensunfähig
  rationale: Bezeichnet die Unfähigkeit zu leiden und nicht bloß tatsächliche Leidensfreiheit.
- source_word: spiritual Word
  choice: geistliches Wort
  rationale: Bewahrt „Wort“ als kosmologisch-theologischen Ausdruck; „geistlich“ vermeidet eine vorschnelle Gleichsetzung mit einer späteren dogmatischen Terminologie.
- source_word: manifest salvation
  choice: das Heil sichtbar machen
  rationale: Gibt den Manifestationsgedanken konkret wieder, ohne „offenbaren“ mit der unmittelbar folgenden Offenbarungsterminologie zu überladen.
- source_word: grasped
  choice: erfasst
  rationale: Erhält neben „gesehen“ und „erkannt“ die dreigliedrige Erkenntnisaussage und kann sowohl geistiges Begreifen als auch Erreichen bezeichnen.
theological_decisions:
- issue: Bezug von „it“ und „he“ in der Aussage über das Kommen
  choice: Die wechselnde Rede von „es“ (dem Kommen) und „er“ (dem Retter) bleibt erhalten.
  alternative: Alle Bezüge einheitlich auf den Retter beziehen.
  rationale: Der Zeugenwortlaut wechselt zwischen Ereignis und Person; eine Vereinheitlichung würde eine echte syntaktische Spannung auflösen.
- issue: Verhältnis des ewigen Retters zum im Fleisch entstandenen Wort
  choice: Die beschädigte und grammatisch schwierige Formulierung bleibt eng am Zeugenwortlaut und wird nicht dogmatisch harmonisiert.
  alternative: Den Satz als klare Aussage über zwei Wesen oder als klare Aussage über eine einzige Person formulieren.
  rationale: Die Textlücke verhindert eine sichere Rekonstruktion; weder Identität noch Unterscheidung darf stillschweigend festgelegt werden.
- issue: Vaterschaft und fleischliche Zeugung
  choice: Zwischen demjenigen, von dem der Retter das Fleisch empfing, und dem einen wahren Vater wird sprachlich unterschieden.
  alternative: Beide Vaterrollen ausdrücklich identifizieren oder gegeneinander ausspielen.
  rationale: Der Abschnitt setzt beide Aussagen nebeneinander, erklärt ihr genaues Verhältnis jedoch nicht vollständig.
- issue: Sichtbarkeit und Erkennbarkeit Gottes
  choice: Das abschließende Pronomen „er“ bleibt im Deutschen erhalten.
  alternative: Explizit „Gott“, „der Vater“ oder „der Retter“ einsetzen.
  rationale: Der grammatische Bezug ist im konsultierten Zeugen nicht restlos eindeutig; eine explizite Benennung würde die Ambiguität beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst wiederholten Schlüsselwörtern wie „Retter“, „Verkündigung“, „zeugen“ und „Wort“. Die verschachtelte Argumentation wurde behutsam gegliedert, ohne die kosmologischen und christologischen Spannungen zu glätten. Da eine direkte Prüfung des koptischen Textes noch aussteht, folgt der Entwurf dem angegebenen gemeinfreien englischen Zeugen; alle dort signalisierten Lücken und Ergänzungen bleiben sichtbar.
