  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Zeugen im Wesentlichen, glättet jedoch mehrfach dessen ausdrücklich markierte Ergänzungen und Textlücken zu stark. Besonders die Klammer-/Ergänzungssignale in den Abschnitten über den Ort der Gemeinde, Glauben und Gebet sowie die spitze Klammer im Schlussabschnitt müssen im deutschen Text selbst sichtbar bleiben. Einzelne Wiedergaben werden zudem näher an den Zeugen geführt (»Nutzen haben«, »Freude voller Nahrung«, Plural bei der abschließenden »Schau«). Eine unmittelbare Prüfung am koptischen Text ist nach den Metadaten weiterhin ausstehend.
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. Die revidierte Fassung verbessert einige unidiomatische oder semantisch verschobene Ausdrücke, ohne die absichtlich schwierige Syntax des Zeugen aufzulösen. Wo der Zeuge Ergänzungen signalisiert, bleibt die deutsche Form notwendigerweise teilweise fragmentarisch.
  terminology: Die Entscheidungen »das Wort«, »Gesamtheiten«, »Fülle«, »Äonen«, »Gemeinde« und »Wesen der Erinnerung« sind angemessen und werden beibehalten. »nährende Freude« wird zu »Freude voller Nahrung« korrigiert, da dies die Titelform des englischen Zeugen genauer abbildet.
