    rationale: Der Zeuge kennzeichnet Lücken durch [] sowie Ergänzungen durch runde, eckige und spitze Klammern. Fußnoten allein ersetzen diese Signale nicht; insbesondere fehlen die sichtbaren Ergänzungen in den Absätzen zur Gemeinde, zu Glauben/Gehorsam, zu Gebet/Flehen und zu den Wesen der Erinnerung.
  - severity: medium
    issue: Einige Formulierungen verschieben die Aussage des Zeugen.
    rationale: »Nutzen empfingen« legt ein Empfangen nahe, während »profit« hier eher »Nutzen haben/Gewinn haben« bedeutet. »nährende Freude« ist nicht dieselbe Benennung wie »Joy Full of Nourishment«. Der Schlusssatz sollte die pluralischen »things« der Schau erhalten.
