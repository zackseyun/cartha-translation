translation:
  language: de
  text: 'Angesichts des Gebets, das er darbrachte, und der Umkehr, die daraus hervorging, ist es angemessen, dass einige zugrunde gingen, andere Nutzen empfingen und wieder andere abgesondert wurden.[a] Zuerst bereitete er die Bestrafung der Ungehorsamen vor. Dazu gebrauchte er eine Kraft von dem, der erschienen war und von dem er die Vollmacht über alles empfangen hatte, damit er von ihm getrennt wäre. Er ist derjenige, der unten ist, und bleibt vom Erhabenen abgesondert, bis er den Heilsplan äußerlich für alles vorbereitet und jedem den ihm zugewiesenen Platz gibt.


    Das Wort stellte zuerst sich selbst auf, als es die Gesamtheiten ordnete: als grundlegende Richtschnur, Ursache und Herrscher über das, was ins Dasein kam. Ebenso war der Vater, die Ursache dieser Aufstellung, der Erste, der nach ihm existierte.[b] Das Wort erschuf die schon vorher bestehenden Bilder, die es unter Dank und Verherrlichung hervorbrachte.


    Dann ordnete es den Ort für diejenigen, die es in Herrlichkeit hervorgebracht hatte. Dieser Ort heißt »Paradies«, »Wonne«, »nährende Freude« und »Freude der schon vorher Bestehenden«.[c] Er bewahrt das Bild all der guten Dinge, die in der Fülle wohnen.


    Dann ordnete es das Königreich wie eine Stadt, die mit allem Erfreulichen erfüllt ist: mit geschwisterlicher Liebe und überreicher Freigebigkeit, angefüllt […] mit heiligen Geistern und den mächtigen Gewalten, die über sie herrschen. Das Wort brachte sie hervor und stellte sie mit Kraft auf.[d]


    Als Nächstes kam als Teil dieser Ordnung der Ort der Gemeinde, die sich an diesem Ort versammelt. Sie trägt die Gestalt der Gemeinde, die in den Äonen wohnt, zur Verherrlichung des Vaters.[e]


    Danach ordnete es den Ort für den Glauben und den Gehorsam, die aus der Hoffnung hervorgehen. Das Wort empfing sie, als das Licht erschien.[f]


    Als Nächstes ordnete es den Ort für die Hinwendung zu Gebet und Flehen. Darauf folgten die Vergebung und das Wort über den, der erscheinen sollte.[g]


    Jeder geistliche Ort besteht in einer geistlichen Kraft. Diese Orte unterscheiden sich von den Wesen der Erinnerung, denn ihre Kraft gründet in einem Bild, das die Fülle vom Wort trennt.[h] Dagegen leitet die Kraft, die in der Weissagung über die Zukunft wirksam ist, die Wesen der Erinnerung, die um dessentwillen ins Dasein kamen, was schon vorher besteht.[i] So wird verhindert, dass sie sich mit den Dingen vermischen, die durch eine Schau dessen ins Dasein gelangen, was bei ihm bleibt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vor »angesichts« zeigt die Vorlage eine Textlücke an. Ob »zugrunde gingen«, »Nutzen empfingen« und »abgesondert wurden« zeitlich oder modal zu verstehen sind, bleibt offen.
    reason: Kennzeichnet eine Lücke und eine grammatische Mehrdeutigkeit des Überlieferungszeugen.
  - marker: b
    text: Der Satzbau und die Bezüge von »ihm« beziehungsweise »nach ihm« sind unsicher. Die ungewöhnliche Reihenfolge der Aussage wurde nicht geglättet.
    reason: Bewahrt referenzielle und theologische Spannung.
  - marker: c
    text: Das Wort »der« in »Freude der schon vorher Bestehenden« ist im zugrunde liegenden Zeugen ergänzt.
    reason: Macht eine editorische Ergänzung transparent.
  - marker: d
    text: Nach »angefüllt« weist die Vorlage eine Textlücke auf. Der Bezug von »sie« kann die Gewalten oder die zuvor genannten Wesen umfassen.
    reason: Dokumentiert beschädigten Text und einen unsicheren Pronomenbezug.
  - marker: e
    text: Die inhaltlich erforderliche Verbform »kam als Teil dieser Ordnung« ist aus dem Zusammenhang ergänzt; die Vorlage ist an dieser Stelle verkürzt.
    reason: Kennzeichnet eine syntaktische Ergänzung.
  - marker: f
    text: »Das Wort« und die ordnende Tätigkeit sind aus dem Zusammenhang ergänzt. Auch der Bezug von »sie« ist nicht völlig sicher.
    reason: Legt editorisch notwendige Ergänzungen und Referenzunsicherheit offen.
  - marker: g
    text: Die ordnende Tätigkeit ist aus dem vorangehenden Zusammenhang ergänzt. »Das Wort« kann hier eine Botschaft oder erneut das personifizierte Wort bezeichnen.
    reason: Bewahrt die lexikalische Doppeldeutigkeit.
  - marker: h
    text: Es ist nicht eindeutig, ob »diese Orte« oder die geistlichen Kräfte das gedachte Subjekt sind. Auch die Aussage, das Bild trenne die Fülle vom Wort, ist in ihrer Richtung schwierig.
    reason: Markiert syntaktische und kosmologische Unklarheit.
  - marker: i
    text: Die Wendung »die um dessentwillen ins Dasein kamen« ist im zugrunde liegenden Zeugen ergänzt. Der Bezug von »was schon vorher besteht« bleibt allgemein.
    reason: Kennzeichnet eine Rekonstruktion und vermeidet eine ungesicherte Identifizierung.
lexical_decisions:
- source_word: Word
  choice: das Wort
  rationale: Bewahrt den personifizierten kosmologischen Titel und die traditionelle, zugleich allgemein verständliche Wiedergabe.
- source_word: Totalities
  choice: die Gesamtheiten
  rationale: Gibt den technischen Plural wieder, ohne ihn vereinfachend mit »Schöpfung« oder »All« gleichzusetzen.
- source_word: Fullness
  choice: die Fülle
  rationale: Bewahrt den technischen Begriff des Textes und seine räumlich-ontologische Mehrdeutigkeit.
- source_word: Church
  choice: Gemeinde
  rationale: Bezeichnet sowohl die örtliche Versammlung als auch ihr überweltliches Gegenbild, ohne eine spätere institutionelle Bedeutung aufzudrängen.
- source_word: aeons
  choice: Äonen
  rationale: Transliteration des kosmologischen Fachbegriffs; »Zeitalter« wäre in diesem Zusammenhang zu eng.
- source_word: beings of the memory
  choice: Wesen der Erinnerung
  rationale: Formnahe Wiedergabe eines unklaren technischen Ausdrucks; keine spekulative Identifizierung der bezeichneten Wesen.
- source_word: pre-existent
  choice: schon vorher bestehend
  rationale: Natürliches Deutsch, das den Gedanken vorgängigen Bestehens wiedergibt, ohne ein zusätzliches metaphysisches System einzutragen.
- source_word: adorned
  choice: ordnete
  rationale: Der Kontext beschreibt die gestaltende Einrichtung von Bereichen; »schmückte« wäre im Deutschen zu dekorativ und sachlich zu eng.
theological_decisions:
- issue: Bezug der Pronomen im ersten Absatz
  choice: Die wechselnden Bezüge von »er«, »ihm« und »derjenige« werden nicht durch erklärende Eigennamen aufgelöst.
  alternative: Die jeweiligen Gestalten ausdrücklich als Wort, Vater oder untergeordneten Herrscher identifizieren.
  rationale: Der vorliegende Zeuge ist syntaktisch und referenziell mehrdeutig; eine eindeutige Benennung würde Interpretation in den Text eintragen.
- issue: Reihenfolge in der Aussage über Vater und Wort
  choice: »der Vater … der Erste, der nach ihm existierte« wird formnah beibehalten.
  alternative: Die Aussage dogmatisch glätten oder die Bezugsrichtung umkehren.
  rationale: Die überlieferte Form enthält eine echte kosmologische Spannung, die nicht stillschweigend harmonisiert werden darf.
- issue: Heilsplan »outwardly«
  choice: »äußerlich für alles«
  alternative: »vollständig für alle« oder »nach außen hin für das All«
  rationale: Die räumliche beziehungsweise adverbiale Unbestimmtheit des Zeugen bleibt erhalten; eine universalistische oder rein räumliche Deutung wird nicht festgelegt.
- issue: Ort der Gemeinde und Gemeinde in den Äonen
  choice: Beide werden mit »Gemeinde« wiedergegeben.
  alternative: Örtlich »Gemeinde«, überweltlich »Kirche«.
  rationale: Die sprachliche Entsprechung zwischen irdischem Ort und äonischem Urbild soll sichtbar bleiben.
- issue: Trennung der Fülle vom Wort
  choice: Der überraschende Aussagegehalt wird unverändert bewahrt.
  alternative: »das Wort von der Fülle trennt« oder eine verbindende Beziehung einsetzen.
  rationale: Der Satz ist theologisch und syntaktisch schwierig; eine Umkehrung würde die überlieferte Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit nachvollziehbarer Satzführung; kosmologische Fachbegriffe bleiben erkennbar. Die Übersetzung ist vorläufig, da laut Datensatz noch keine direkte Prüfung des koptischen Textes erfolgt ist und nur ein öffentlicher englischer Zeuge vorliegt. Textlücken und editorische Ergänzungen werden nicht durch scheinbar sicheren Fließtext verdeckt, sondern in Fußnoten ausgewiesen.
