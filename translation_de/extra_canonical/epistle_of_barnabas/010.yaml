  text: 'But forasmuch as Moses said, “You shall not eat seine [sic] nor eagle nor falcon nor crow nor any fish that has no scale upon it,” he received in his understanding three ordinances.


    Yes, and further he says to them in Deuteronomy, “And I will lay as a covenant upon this people my ordinances.” So then it is not a commandment of God that they should not bite with their teeth, but Moses spoke it in spirit.


    Accordingly, he mentioned the swine with this intent: “You shall not cleave,” he says, “to such people as are like swine.” That is, when they are in luxury they forget the Lord, but when they are in want they recognize the Lord, just as the swine, when it eats, does not know its lord; but when it is hungry it cries out, and when it has received food again it is silent.


    “Neither shall you eat eagle nor falcon nor kite nor crow.” “You shall not,” he says, “cleave to, or be likened to, such people as do not know how to provide food for themselves by toil and sweat, but in their lawlessness seize what belongs to others; and, as if walking in guilelessness, watch and search about for someone to rob in their rapacity.” Just as these birds alone do not provide food for themselves, but sit idle and seek how they may eat the meat that belongs to others, being pestilent in their evil-doings.


    “And you shall not eat,” he says, “lamprey nor polypus nor cuttlefish.” He means, “You shall not become like such people as are desperately wicked and already condemned to death,” just as these fishes alone are accursed and swim in the depths, not swimming on the surface like the rest, but dwelling on the ground beneath the deep sea.


    Moreover, “You shall not eat the hare.” Why so? “You shall not be found a corrupter of boys, nor shall you become like such persons”; for the hare gains one passage in the body every year, and according to the number of years it lives it has just so many orifices.


    Again, “Neither shall you eat the hyena.” “You shall not,” he says, “become an adulterer or a fornicator, neither shall you resemble such persons.” Why so? Because this animal changes its nature year by year, becoming at one time male and at another female.


    Moreover, he has hated the weasel also, and with good reason. “You shall not,” he says, “become such as those people of whom we hear as working iniquity with their mouth for uncleanness, neither shall you cleave to impure women who work iniquity with their mouth.” For this animal conceives with its mouth.


    Concerning meats, then, Moses received three decrees to this effect and uttered them in a spiritual sense; but they accepted them according to the lust of the flesh, as though they referred to eating.


    And David also receives knowledge of the same three decrees, and says, “Blessed is the man who has not gone in the counsel of the ungodly”—even as the fishes go in darkness into the depths—“and has not stood in the path of sinners”—just as those who pretend to fear the Lord sin like swine—“and has not sat on the seat of the destroyers”—as the birds that are seated for prey. You now have the complete lesson concerning eating.


    Again Moses says, “You shall [eat] everything that divides the hoof and chews the cud.” What does he mean? He who receives the food knows him who gives him the food and, being refreshed, appears to rejoice in him. Well said he, having regard to the commandment. What then does he mean? Cleave to those who fear the Lord: to those who meditate in their heart on the distinction of the word which they have received; to those who tell of the ordinances of the Lord and keep them; and to those who know that meditation is a work of gladness and who chew the cud of the word of the Lord. But why that which divides the hoof? Because the righteous person both walks in this world and at the same time looks for the holy world to come. You see how wise a lawgiver Moses was.


    But whence should they perceive or understand these things? Howbeit, we, having justly perceived the commandments, tell them as the Lord willed. To this end he circumcised our ears and hearts, that we might understand these things.'
translation:
  language: de
  text: 'Da Mose sagte: »Ihr sollt weder Schwein noch Adler noch Habicht noch Raben essen, auch keinen Fisch, der keine Schuppen hat«, empfing er in seinem Verständnis drei Satzungen.


    Ja, darüber hinaus sagt er ihnen im fünften Buch Mose: »Und ich werde diesem Volk meine Satzungen als Bund auferlegen.« Es ist also nicht Gottes Gebot, dass sie nicht mit den Zähnen zubeißen sollen; vielmehr sprach Mose im Geist.


    Dementsprechend erwähnte er das Schwein mit folgender Absicht: »Du sollst dich«, sagt er, »nicht an Menschen halten, die Schweinen gleichen.« Das heißt: Leben sie im Überfluss, vergessen sie den Herrn; leiden sie aber Mangel, erkennen sie den Herrn an. Ebenso kennt das Schwein, solange es frisst, seinen Herrn nicht; ist es aber hungrig, schreit es, und sobald es wieder Futter bekommen hat, schweigt es.


    »Auch sollst du weder Adler noch Habicht noch Milan noch Raben essen.« »Du sollst dich«, sagt er, »nicht an Menschen halten und ihnen auch nicht gleichen, die nicht wissen, wie sie sich durch Mühe und Schweiß Nahrung beschaffen sollen. Vielmehr reißen sie in ihrer Gesetzlosigkeit fremdes Gut an sich und geben sich den Anschein, arglos umherzugehen, während sie gierig Ausschau halten und nach jemandem suchen, den sie ausrauben können.« Ebenso beschaffen sich allein diese Vögel ihre Nahrung nicht selbst, sondern sitzen untätig da und suchen danach, wie sie das Fleisch anderer fressen können; in ihrem bösen Tun sind sie eine Plage.


    »Und du sollst«, sagt er, »weder Muräne noch Krake noch Tintenfisch essen.« Damit meint er: »Du sollst nicht Menschen gleichen, die bis zum Äußersten böse und bereits zum Tod verurteilt sind.« Ebenso sind allein diese Fische verflucht und schwimmen in der Tiefe. Sie schwimmen nicht wie die übrigen an der Oberfläche, sondern leben auf dem Grund unter der tiefen See.


    Ferner heißt es: »Du sollst den Hasen nicht essen.« Warum? »Du sollst dich nicht als Knabenschänder erweisen und solchen Menschen auch nicht gleichen.« Denn der Hase bekommt jedes Jahr eine weitere Körperöffnung; so viele Jahre er lebt, so viele Öffnungen hat er.[a]


    Weiter heißt es: »Auch sollst du die Hyäne nicht essen.« »Du sollst«, sagt er, »weder zum Ehebrecher noch zum Unzüchtigen werden und solchen Menschen auch nicht gleichen.« Warum? Weil dieses Tier jedes Jahr sein Geschlecht wechselt und einmal männlich, ein andermal weiblich wird.[b]


    Auch das Wiesel hat er gehasst, und das mit gutem Grund. »Du sollst«, sagt er, »nicht solchen Menschen gleichen, von denen wir hören, dass sie mit dem Mund Unrecht zur Unreinheit tun. Auch sollst du dich nicht an unreine Frauen halten, die mit dem Mund Unrecht tun.« Denn dieses Tier empfängt durch den Mund.[c]


    Was die Speisen betrifft, empfing Mose also drei Bestimmungen in diesem Sinn und sprach sie geistlich aus. Sie aber verstanden sie gemäß der Begierde des Fleisches, als bezögen sie sich auf das Essen.


    Auch David empfängt Erkenntnis über dieselben drei Bestimmungen und sagt: »Glücklich ist der Mensch, der nicht dem Rat der Gottlosen gefolgt ist« – wie die Fische in der Finsternis in die Tiefe ziehen –, »der nicht auf den Weg der Sünder getreten ist« – wie diejenigen, die vorgeben, den Herrn zu fürchten, aber wie Schweine sündigen –, »und der nicht auf dem Sitz der Verderber gesessen hat« – wie die Vögel, die auf Beute lauern. Nun habt ihr die vollständige Lehre über das Essen.


    Weiter sagt Mose: »Ihr sollt alles essen, was gespaltene Hufe hat und wiederkäut.« Was meint er damit? Wer die Nahrung empfängt, erkennt den, der sie ihm gibt, und wenn er gestärkt worden ist, zeigt er, dass er sich an ihm freut. Treffend sprach er im Blick auf das Gebot. Was also meint er? Haltet euch an diejenigen, die den Herrn fürchten: an diejenigen, die in ihrem Herzen über die Unterscheidung nachsinnen, die das empfangene Wort lehrt; an diejenigen, die von den Satzungen des Herrn reden und sie halten; an diejenigen, die wissen, dass das Nachsinnen ein freudiges Tun ist, und die das Wort des Herrn wiederkäuen. Warum aber das Tier mit gespaltenen Hufen? Weil der Gerechte in dieser Welt wandelt und zugleich die kommende heilige Welt erwartet. Ihr seht, welch weiser Gesetzgeber Mose war.


    Doch wie sollten sie dies wahrnehmen oder verstehen? Wir aber haben die Gebote richtig erfasst und legen sie so dar, wie der Herr es wollte. Dazu hat er unsere Ohren und Herzen beschnitten, damit wir dies verstehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage über die jährlich zunehmenden Körperöffnungen des Hasen gibt eine antike zoologische Vorstellung wieder; sie entspricht nicht heutiger Biologie.
    reason: Verhindert, dass die historische Behauptung als moderne Sachauskunft missverstanden wird, ohne den Text zu korrigieren.
  - marker: b
    text: Die Behauptung, Hyänen wechselten jährlich ihr Geschlecht, beruht auf antiker Tierkunde und ist biologisch unzutreffend.
    reason: Kennzeichnet den historischen Wissenshorizont, während die ursprüngliche Argumentation unverändert bleibt.
  - marker: c
    text: Auch die Vorstellung, das Wiesel empfange durch den Mund, stammt aus antiker Tierkunde und entspricht nicht heutiger Biologie.
    reason: Bewahrt die fremdartige Begründung des Autors, macht aber ihren historischen Charakter transparent.
lexical_decisions:
- source_word: χοιρός / swine
  choice: Schwein
  rationale: Korrigiert den offensichtlichen Druckfehler „seine“ des englischen Zeugen und erhält das für die allegorische Auslegung entscheidende Tierbild.
- source_word: ἀετός, ἱέραξ, ἴκτινος, κόραξ
  choice: Adler, Habicht, Milan, Rabe
  rationale: Gebräuchliche moderne Vogelnamen bewahren die Aufzählung der Raub- und Aasvögel.
- source_word: κολλᾶσθαι / cleave to
  choice: sich an jemanden halten
  rationale: Gibt die enge Verbindung natürlich wieder, ohne die Bedeutung auf körperliches Anhängen zu verengen.
- source_word: δικαιώματα / ordinances
  choice: Satzungen; Bestimmungen
  rationale: „Satzungen“ steht in den gesetzes- und bundestheologischen Aussagen; „Bestimmungen“ vermeidet in der erläuternden Wiederaufnahme unnötige Steifheit.
- source_word: ἐν πνεύματι / in spirit
  choice: im Geist
  rationale: Bewahrt die mögliche Spannung zwischen geistgewirkter Rede und geistlicher beziehungsweise allegorischer Bedeutung.
- source_word: μηρυκᾶσθαι / chew the cud
  choice: wiederkäuen
  rationale: Erhält sowohl die zoologische Vorschrift als auch das anschließende Bild für das Nachsinnen über das Wort.
- source_word: διάκριση τοῦ λόγου / distinction of the word
  choice: die Unterscheidung, die das empfangene Wort lehrt
  rationale: Bewahrt den schwierigen Begriff „Unterscheidung“, macht aber seine Beziehung zum empfangenen Wort im Deutschen verständlich.
- source_word: κόσμος ὁ ἅγιος ὁ μέλλων / holy world to come
  choice: die kommende heilige Welt
  rationale: Bewahrt die eschatologische Ausdrucksweise des Textes, ohne sie durch eine konfessionell festgelegte Formulierung zu ersetzen.
- source_word: διαφθορεύς παιδίων / corrupter of boys
  choice: Knabenschänder
  rationale: Gibt den konkreten sexuellen Missbrauch männlicher Minderjähriger knapp und unmissverständlich wieder.
theological_decisions:
- issue: Verhältnis der Speisegebote zu ihrer geistlichen Deutung
  choice: Die Behauptung des Autors, Mose habe geistlich gesprochen und die Gebote seien nicht als bloße Essensregeln gemeint, wird direkt wiedergegeben.
  alternative: Die Gebote zugleich ausdrücklich als wörtlich gültig und zusätzlich allegorisch auslegen.
  rationale: Der Ausgangstext formuliert eine polemische Gegenüberstellung. Diese theologische Spannung darf nicht harmonisiert oder durch spätere Lehrsysteme abgeschwächt werden.
- issue: Referent des großgeschriebenen englischen „He“
  choice: Je nach Satz wird „er“, „Gott“ beziehungsweise eine unpersönliche Einleitung verwendet, ohne durchgehend einen göttlichen Sprecher zu erzwingen.
  alternative: Jedes englische „He“ ausdrücklich mit „Gott“ oder „der Herr“ wiedergeben.
  rationale: Der englische Zeuge schwankt zwischen Mose, Gott und dem Schriftwort. Die Übersetzung vermeidet eine unbelegte Festlegung, wo der unmittelbare Referent unsicher ist.
- issue: Bundeszitat aus dem fünften Buch Mose
  choice: „Ich werde diesem Volk meine Satzungen als Bund auferlegen.“
  alternative: Das Zitat an eine kanonische deutsche Bibelfassung angleichen oder seine schwer belegbare Form korrigieren.
  rationale: Die Gestalt des Zitats im Barnabasbrief wird bewahrt; es wird nicht stillschweigend an den Wortlaut einer späteren Bibelübersetzung angepasst.
- issue: Psalm 1 als dreifache zoologische Allegorie
  choice: Psalmwort und eingeschobene Tierdeutungen werden klar voneinander abgesetzt, aber als zusammenhängende Argumentation erhalten.
  alternative: Nur den kanonischen Psalmtext zitieren und die allegorischen Einschübe in Fußnoten auslagern.
  rationale: Die Einschübe gehören zur eigentlichen Auslegung und müssen im Haupttext sichtbar bleiben.
- issue: Beschneidung von Ohren und Herzen
  choice: Die Metapher wird wörtlich als „Ohren und Herzen beschnitten“ wiedergegeben.
  alternative: Paraphrase als „für das Verstehen geöffnet“ oder „innerlich befähigt“.
  rationale: Die körperlich-biblische Metaphorik und ihre theologische Spannung sind für die Argumentation des Werkes wesentlich.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Direkte Rede und Schriftzitate sind typografisch klar gegliedert. Archaisierende Formen wurden vermieden, die rhetorischen Fragen, Wiederholungen und die scharfe Polemik des Textes jedoch erhalten. Da eine direkte Prüfung des griechischen und lateinischen Quellenbestands laut Datensatz noch aussteht, ist dies ein quellennaher Publikationsentwurf auf Grundlage des angegebenen öffentlichen englischen Zeugen; offenkundige Druckfehler und die ausgelassene Verbform wurden sachgerecht berichtigt.
