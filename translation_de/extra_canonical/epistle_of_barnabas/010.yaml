    »Und du sollst«, sagt er, »weder Neunauge noch Krake noch Tintenfisch essen.« Damit meint er: »Du sollst nicht Menschen gleichen, die bis zum Äußersten böse und bereits zum Tod verurteilt sind.« Ebenso sind allein diese Fische verflucht und schwimmen in der Tiefe. Sie schwimmen nicht wie die übrigen an der Oberfläche, sondern leben auf dem Grund unter der tiefen See.


    Ferner heißt es: »Du sollst den Hasen nicht essen.« Warum? »Du sollst dich nicht als Knabenschänder erweisen und solchen Menschen auch nicht gleichen.« Denn der Hase bekommt jedes Jahr eine weitere Körperöffnung; so viele Jahre er lebt, so viele Öffnungen hat er.[a]


    Weiter heißt es: »Auch sollst du die Hyäne nicht essen.« »Du sollst«, sagt er, »weder zum Ehebrecher noch zum Unzüchtigen werden und solchen Menschen auch nicht gleichen.« Warum? Weil dieses Tier jedes Jahr sein Geschlecht wechselt und einmal männlich, ein andermal weiblich wird.[b]


    Auch das Wiesel hat er gehasst, und das mit gutem Grund. »Du sollst«, sagt er, »nicht solchen Menschen gleichen, von denen wir hören, dass sie mit dem Mund Unrecht zur Unreinheit tun. Auch sollst du dich nicht an unreine Frauen halten, die mit dem Mund Unrecht tun.« Denn dieses Tier empfängt durch den Mund.[c]


    Was die Speisen betrifft, empfing Mose also drei Bestimmungen in diesem Sinn und sprach sie geistlich aus. Sie aber verstanden sie gemäß der Begierde des Fleisches, als bezögen sie sich auf das Essen.


    Auch David empfängt Erkenntnis über dieselben drei Bestimmungen und sagt: »Glücklich ist der Mensch, der nicht dem Rat der Gottlosen gefolgt ist« – wie die Fische in der Finsternis in die Tiefe ziehen –, »der nicht auf den Weg der Sünder getreten ist« – wie diejenigen, die vorgeben, den Herrn zu fürchten, aber wie Schweine sündigen –, »und der nicht auf dem Sitz der Verderber gesessen hat« – wie die Vögel, die auf Beute lauern. Nun habt ihr die vollständige Lehre über das Essen.


    Weiter sagt Mose: »Ihr sollt alles essen, was gespaltene Hufe hat und wiederkäut.« Was meint er damit? Wer die Nahrung empfängt, erkennt den, der sie ihm gibt, und wenn er gestärkt worden ist, scheint er sich an ihm zu freuen. Treffend sprach er im Blick auf das Gebot. Was also meint er? Haltet euch an diejenigen, die den Herrn fürchten: an diejenigen, die in ihrem Herzen über die Unterscheidung des Wortes nachsinnen, das sie empfangen haben; an diejenigen, die von den Satzungen des Herrn reden und sie halten; an diejenigen, die wissen, dass das Nachsinnen ein freudiges Tun ist, und die das Wort des Herrn wiederkäuen. Warum aber das Tier mit gespaltenen Hufen? Weil der Gerechte in dieser Welt wandelt und zugleich die kommende heilige Welt erwartet. Ihr seht, welch weiser Gesetzgeber Mose war.


    Doch wie sollten sie dies wahrnehmen oder verstehen? Wir aber haben die Gebote richtig erfasst und legen sie so dar, wie der Herr es wollte. Dazu hat er unsere Ohren und Herzen beschnitten, damit wir dies verstehen.'
