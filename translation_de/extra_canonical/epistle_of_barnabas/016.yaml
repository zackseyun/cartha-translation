  yaml_path: translation/extra_canonical/epistle_of_barnabas/016.yaml
  text: 'Moreover, I will also tell you about the temple: how these wretched men were led astray and placed their hope in the building, rather than in their God who made them, as though it were a house of God.


    For, almost like the Gentiles, they consecrated him in the temple. But what does the Lord say when abolishing the temple? Learn: “Who has measured heaven with a span, or measured the earth with his hand? Have not I?” says the Lord. “Heaven is my throne, and the earth is the footstool of my feet. What kind of house will you build for me? Or what will be my resting place?” You perceive that their hope is vain.


    Furthermore, he says again, “Behold, those who pulled down this temple will themselves build it.”


    And so it happens. Because they went to war, it was pulled down by their enemies. Now even the servants of their enemies will build it up.


    Again, it was revealed how the city, the temple, and the people of Israel would be betrayed. For Scripture says, “And it shall be in the last days that the Lord will deliver the sheep of the pasture, and the fold and its tower, over to destruction.” And it happened as the Lord had spoken.


    But let us inquire whether there is any temple of God. There is, in the place where he himself undertakes to make and complete it. For it is written, “And it shall come to pass, when the week is being completed, that the temple of God will be built gloriously in the name of the Lord.”


    I find, then, that there is a temple. How, then, will it be built in the name of the Lord? Understand. Before we believed in God, the dwelling place of our heart was corrupt and weak, truly a temple built by hands. For it was full of idolatry and was a house of demons, because we did everything that was contrary to God.


    But it will be built in the name of the Lord. Pay attention, then, so that the temple of the Lord may be built gloriously.


    How? Understand. By receiving the forgiveness of our sins and hoping in the Name, we became new, created afresh from the beginning. Therefore God truly dwells in our habitation, within us. How? The word of his faith, the calling of his promise, the wisdom of the ordinances, the commandments of the teaching—he himself prophesying in us, he himself dwelling in us, opening for us who had been enslaved to death the door of the temple, which is the mouth, and giving us repentance—leads us to the incorruptible temple.


    For the one who desires to be saved does not look to the person, but to him who dwells and speaks within that person, being amazed that he has never before heard these words from the speaker’s mouth, nor ever desired to hear them. This is the spiritual temple built for the Lord.'
translation:
  language: de
  text: 'Außerdem will ich euch auch über den Tempel Auskunft geben: darüber, wie jene unglücklichen Menschen sich irreführen ließen und ihre Hoffnung auf das Gebäude setzten statt auf ihren Gott, der sie geschaffen hatte, als wäre es ein Haus Gottes.


    Denn beinahe wie die Heiden schlossen sie ihn in den Tempel ein.[a] Doch was sagt der Herr, indem er den Tempel aufhebt? Lernt: »Wer hat den Himmel mit der Spanne gemessen oder die Erde mit seiner Hand? War nicht ich es?«, spricht der Herr. »Der Himmel ist mein Thron und die Erde der Schemel meiner Füße. Was für ein Haus wollt ihr mir bauen? Oder wo soll mein Ruheort sein?« Ihr erkennt, dass ihre Hoffnung vergeblich ist.


    Weiter sagt er wiederum: »Seht, gerade die, die diesen Tempel niedergerissen haben, werden ihn wieder aufbauen.«


    Und so geschieht es: Weil sie Krieg führten, wurde er von ihren Feinden niedergerissen. Nun werden sogar die Diener ihrer Feinde ihn wieder aufbauen.[b]


    Wiederum wurde offenbart, wie die Stadt, der Tempel und das Volk Israel preisgegeben werden sollten. Denn die Schrift sagt: »Und in den letzten Tagen wird der Herr die Schafe der Weide, den Pferch und seinen Turm dem Verderben preisgeben.« Und es geschah, wie der Herr gesagt hatte.


    Doch lasst uns untersuchen, ob es überhaupt einen Tempel Gottes gibt. Es gibt einen: dort, wo er selbst es unternimmt, ihn zu schaffen und zu vollenden. Denn es steht geschrieben: »Und es wird geschehen, wenn die Woche vollendet wird: Der Tempel Gottes wird herrlich im Namen des Herrn erbaut werden.«[c]


    Ich stelle also fest, dass es einen Tempel gibt. Wie wird er nun im Namen des Herrn erbaut? Versteht: Bevor wir an Gott glaubten, war die Wohnstätte unseres Herzens verdorben und schwach – wahrhaftig ein von Händen erbauter Tempel. Denn sie war voller Götzendienst und ein Haus von Dämonen, weil wir alles taten, was Gott zuwider war.


    Doch er wird im Namen des Herrn erbaut werden. Achtet also darauf, dass der Tempel des Herrn herrlich erbaut wird.


    Wie? Versteht: Indem wir Vergebung unserer Sünden empfingen und unsere Hoffnung auf den Namen setzten, wurden wir neu, von Anfang an noch einmal erschaffen. Darum wohnt Gott wahrhaftig in unserer Wohnstätte, in uns. Wie? Das Wort seines Glaubens, der Ruf seiner Verheißung, die Weisheit der Ordnungen und die Gebote der Lehre – indem er selbst in uns prophetisch redet und selbst in uns wohnt, uns, die wir dem Tod versklavt waren, die Tür des Tempels öffnet, nämlich den Mund, und uns Umkehr schenkt – führt uns zum unvergänglichen Tempel.[d]


    Denn wer gerettet werden möchte, blickt nicht auf den Menschen, sondern auf den, der in ihm wohnt und durch ihn spricht. Er staunt darüber, dass er solche Worte noch nie aus dem Mund des Redenden gehört und sie selbst auch nie zu hören verlangt hat.[e] Das ist der geistliche Tempel, der für den Herrn erbaut wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bzw. nach anderer möglicher Auffassung: »sie weihten ihn im Tempel«. Die überlieferte Formulierung ist schwierig; der folgende Schriftbezug betont, dass Gott nicht in einem von Menschen gebauten Haus begrenzt werden kann.'
    reason: Textlich und semantisch schwierige Formulierung.
  - marker: b
    text: Der geschichtliche Bezug dieser Aussage ist umstritten; der Text verbindet die Zerstörung des Tempels mit einem späteren Wiederaufbau durch Menschen im Dienst der Feinde.
    reason: Bewahrt die historische Unbestimmtheit, ohne eine konkrete Rekonstruktion aufzuzwingen.
  - marker: c
    text: Die Herkunft dieses Zitats ist nicht sicher. »Woche« kann eine symbolische Zeitspanne bezeichnen.
    reason: Nicht eindeutig identifizierbares Zitat und auslegungsbedürftiger Zeitbegriff.
  - marker: d
    text: Der Satzbau und mehrere Genitivverbindungen sind dicht und mehrdeutig. Insbesondere kann »das Wort seines Glaubens« auch als »das Wort des Glaubens an ihn« verstanden werden; ebenso bleibt offen, wie die aufgezählten Größen syntaktisch mit dem folgenden »führt uns« verbunden sind.
    reason: Genuine grammatische und theologische Mehrdeutigkeit.
  - marker: e
    text: Der letzte Satz kann auch so verstanden werden, dass der Hörende darüber staunt, aus dem Mund des betreffenden Menschen Worte zu hören, die weder der Sprecher zuvor gesprochen noch der Hörende zuvor zu hören begehrt hatte.
    reason: Mehrdeutige Zuordnung von Sprecher, Hörer und Pronomen.
lexical_decisions:
- source_word: temple / ναός
  choice: Tempel
  rationale: Bewahrt das durchgehende Leitbild des Kapitels und den Gegensatz zwischen äußerem Bauwerk und geistlichem Tempel.
- source_word: consecrated Him in the temple
  choice: schlossen sie ihn in den Tempel ein
  rationale: Der Kontext der Jesaja-Anspielung kritisiert die Vorstellung, Gott räumlich auf den Tempel zu begrenzen. Die schwierige Überlieferung wird nicht mit einer konfessionellen Deutung geglättet.
- source_word: abolishing
  choice: aufhebt
  rationale: Gibt die starke Kritik am Tempel wieder, ohne über den Text hinaus eine bestimmte heilsgeschichtliche Theorie festzuschreiben.
- source_word: the Name
  choice: der Name
  rationale: Die absolute, hervorgehobene Redeweise bleibt als frühchristlicher theologischer Ausdruck erhalten.
- source_word: repentance
  choice: Umkehr
  rationale: Natürliches modernes Deutsch, das sowohl Sinnesänderung als auch Hinwendung zu Gott ausdrückt.
- source_word: incorruptible
  choice: unvergänglich
  rationale: Bewahrt den Gegensatz zwischen zerstörbarem Bauwerk und dauerhaftem geistlichem Tempel.
theological_decisions:
- issue: Polemik gegen die Hoffnung auf den Jerusalemer Tempel
  choice: Die scharfe Aussage des Textes wird wiedergegeben, aber als Argument des Autors formuliert.
  alternative: Die Aussage durch neutralisierende oder heilsgeschichtliche Zusätze abzumildern.
  rationale: Die genuine Spannung des frühchristlichen Textes darf nicht stillschweigend harmonisiert werden.
- issue: Gottes Wohnen im Menschen
  choice: Die Aussagen vom Wohnen und prophetischen Reden Gottes in den Glaubenden bleiben unmittelbar stehen.
  alternative: Sie ausdrücklich auf den Heiligen Geist, Christus oder eine kirchliche Institution festzulegen.
  rationale: Der überlieferte Abschnitt bestimmt den Bezug nicht durchgehend eindeutig; eine engere dogmatische Identifikation wäre importiert.
- issue: Der Tempel als Mund
  choice: Die erklärende Gleichsetzung »nämlich den Mund« wird wörtlich bewahrt.
  alternative: Den Mund lediglich als Zugang zum Herzen oder als Verkündigungsorgan auszudeuten.
  rationale: Das ungewöhnliche Bild gehört zur Argumentation und soll nicht aufgelöst werden.
- issue: Bezugswort in »der in ihm wohnt und durch ihn spricht«
  choice: Der personale Bezug bleibt offen; »ihm« kann den redenden Menschen bezeichnen.
  alternative: Den Bewohner ausdrücklich als Gott, Christus oder Geist zu benennen.
  rationale: Die pronominale Mehrdeutigkeit ist theologisch bedeutsam und im vorliegenden Zeugnis nicht sicher aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Archaismen wurden vermieden, die rhetorischen Fragen, Schriftzitate und das wiederholte »Versteht« jedoch als kennzeichnende Struktur bewahrt. Da laut Metadaten eine unmittelbare Prüfung des griechisch-lateinischen Quellenbestands noch aussteht, kennzeichnen Fußnoten besonders unsichere Stellen.
