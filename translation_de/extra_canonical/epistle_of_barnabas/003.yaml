review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen überwiegend eng. Die Schlussperiode verschiebt jedoch die Satzstruktur und den Sinn: Nicht das Vorauswissen selbst wird offenbart, sondern der Langmütige offenbart im Voraus, weil er das künftige Glauben des Volkes voraussieht. Zudem sollte die elliptische, im Zeugen unsichere Haus-/Verwandtschaftsformulierung als Aufforderung verständlich wiedergegeben werden, ohne eine weitere Gruppe zu identifizieren.'
  naturalness: Der Schriftzitat-Register ist grundsätzlich gelungen. Einzelne Formulierungen sind jedoch im heutigen Deutsch unnötig holprig oder syntaktisch unklar, besonders „euch Asche zum Lager macht“, „auch niemanden aus deinem Haus ...“ und die zerlegte Schlussperiode. Die Revision wahrt die Bildsprache, ist aber klarer lesbar.
  terminology: „Sacktuch“, „Joch“, „Gerechtigkeit“, „Herrlichkeit Gottes“, „der Langmütige“ und „Schiffbruch erleiden“ sind angemessen. „in seinem Geliebten“ bleibt absichtlich unaufgelöst. „ihrem Gesetz“ gibt das pronominale „their law“ wieder, ohne die polemische Referenz über den Zeugen hinaus historisch zu spezifizieren.
  issues:
  - severity: high
    issue: Die Schlussperiode ordnet Vorauswissen und Offenbarung falsch zu.
    rationale: 'Der Zeuge sagt, dass der Langmütige, weil er voraussah, dass das vorbereitete Volk glauben würde, uns alles im Voraus offenbarte. „hat ... alles vorausgesehen: Das Volk ... würde ... glauben. Darum offenbarte er ...“ macht aus dem Offenbaren eine nachgeordnete Folgerung und verändert die Satzlogik.'
  - severity: medium
    issue: Der Satz über Haus und eigene Nachkommenschaft ist im Deutschen semantisch und syntaktisch unklar.
    rationale: Die Formulierung „auch niemanden aus deinem Haus und von deiner eigenen Nachkommenschaft“ hat kein eindeutig zugeordnetes Prädikat. Eine Aufforderung, Angehörige beziehungsweise Verwandte nicht zu übergehen, gibt die wahrscheinlich zugrunde liegende Jesaja-Formulierung verständlich wieder; die Unsicherheit bleibt in der Fußnote markiert.
  - severity: low
    issue: „euch Asche zum Lager macht“ ist unidiomatisch.
    rationale: „dich in Asche bettest“ gibt das Bild eines Aschelagers klar und idiomatisch wieder, ohne den Sinn zu ändern.
  revised_text: 'Daher spricht er zu ihnen noch einmal über diese Dinge: »Warum fastet ihr für mich«, spricht der Herr, »sodass man heute eure Stimme laut schreien hört? Das ist nicht das Fasten, das ich erwählt habe«, spricht der Herr, »auch nicht, dass ein Mensch seine Seele demütigt.


    Auch wenn du deinen Nacken wie einen Ring beugst, Sacktuch anlegst und dich in Asche bettest, wirst du es doch nicht ein annehmbares Fasten nennen.


    Zu uns aber spricht er: ›Siehe, dies ist das Fasten, das ich erwählt habe‹, spricht der Herr: ›Löst jede Fessel der Bosheit, lockert die festgezogenen Stricke erzwungener Verträge,[a] lasst die Gebrochenen frei und zerreißt jedes ungerechte Joch. Brich dem Hungrigen dein Brot, und wenn du einen Nackten siehst, bekleide ihn. Nimm Obdachlose in dein Haus auf, und wenn du einen Demütigen siehst, verachte ihn nicht; übergeh auch niemanden aus deinem Haus und deiner eigenen Verwandtschaft nicht.[b]


    Dann wird dein Licht am Morgen hervorbrechen, und deine Heilung wird schnell aufgehen. Die Gerechtigkeit wird vor dir herziehen, und die Herrlichkeit Gottes wird dich umgeben.


    Dann wirst du rufen, und Gott wird dich erhören. Während du noch redest, wird er sagen: „Siehe, hier bin ich“, wenn du das Joch aus deiner Mitte entfernst, das Ausstrecken des Fingers und das murrende Wort; wenn du dem Hungrigen von Herzen dein Brot gibst und dich der gedemütigten Seele erbarmst.[c]‹


    Zu diesem Zweck also, meine Brüder,[d] hat der Langmütige uns alles im Voraus offenbart, weil er voraussah, dass das Volk, das er in seinem Geliebten vorbereitet hatte, in Schlichtheit glauben würde, damit wir nicht als Anfänger an ihrem Gesetz Schiffbruch erleiden.[e]'
  revised_footnotes:
  - marker: a
    text: Die Formulierung »Stricke erzwungener Verträge« folgt dem bereitgestellten englischen Textzeugen. Der genaue Wortlaut ist ohne unmittelbare Prüfung der griechischen und lateinischen Überlieferung unsicher; die Stelle entspricht sinngemäß Jesaja 58,6.
    reason: Kennzeichnet eine auffällige und möglicherweise variantenbedingte Rechtsmetapher.
  - marker: b
    text: Der Satzteil ist im vorliegenden englischen Zeugnis elliptisch und ungewöhnlich. Er dürfte bedeuten, dass Angehörige des eigenen Hauses beziehungsweise der eigenen Verwandtschaft nicht übergangen oder verachtet werden sollen.
    reason: Macht die textliche Unsicherheit sichtbar, während der Haupttext eine verständliche Aufforderung bietet.
  - marker: c
    text: Wörtlich steht im Zeugnis die »gedemütigte Seele«; die Wendung kann einen erniedrigten oder bedrängten Menschen bezeichnen.
    reason: Erläutert den anthropologischen Ausdruck, ohne seine Bildsprache im Haupttext aufzulösen.
  - marker: d
    text: Das griechisch geprägte »Brüder« kann hier die gesamte angesprochene Gemeinschaft einschließen.
    reason: Macht den historischen Sprachgebrauch transparent, ohne den Wortlaut im Haupttext auszudehnen.
  - marker: e
    text: Mit »ihrem Gesetz« greift der Verfasser die zuvor verwendete Gegenüberstellung von »ihnen« und »uns« auf. Die polemische Formulierung beschreibt seine Argumentation und ist keine zusätzliche historische Identifikation durch die Übersetzung.
    reason: Ordnet die scharfe Gruppenabgrenzung historisch-literarisch ein, ohne sie zu verallgemeinern.
  revision_rationale: Die Revision korrigiert die syntaktisch und semantisch verschobene Schlussperiode, glättet unidiomatische Wendungen und macht die elliptische Aufforderung zu Haus und Verwandtschaft verständlich. Sie behält die vom Zeugen vorgegebenen Spannungen, die Anredewechsel innerhalb des Zitats, die unaufgelöste Bezeichnung »sein Geliebter« und die polemische pronominale Distanz bei. Die unsicheren Einzelheiten bleiben durch Fußnoten kenntlich.
