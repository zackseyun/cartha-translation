base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/003.yaml
  text: 'Therefore he speaks to them again concerning these things: “Why do you fast for me,” says the Lord, “so that your voice is heard crying aloud today? This is not the fast that I have chosen,” says the Lord, “nor is it a man humbling his soul;


    not even if you bend your neck like a hoop, put on sackcloth, and make your bed in ashes. Not even then will you call it an acceptable fast.


    But to us he says, “Behold, this is the fast that I have chosen,” says the Lord: “Loosen every bond of wickedness, untie the tightened cords of forced contracts, send the broken away in freedom, and tear apart every unjust bond. Break your bread for the hungry, and if you see someone naked, clothe him. Bring the homeless into your house, and if you see a humble person, do not despise him, nor anyone of your household and your own offspring.


    Then your light will break forth in the morning, and your healing will arise quickly. Righteousness will go before your face, and the glory of God will surround you.


    Then you will cry out, and God will hear you. While you are still speaking, he will say, ‘Behold, I am here,’ if you remove from yourself the yoke, the pointing of the finger, and the word of murmuring; if you give your bread wholeheartedly to the hungry and have pity on the humbled soul.”


    For this purpose, therefore, my brothers, the one who is patient, foreseeing that the people whom he had prepared in his well-beloved would believe in simplicity, revealed everything to us beforehand, so that we, as novices, might not shipwreck ourselves on their law.'
translation:
  language: de
  text: 'Daher spricht er zu ihnen über diese Dinge noch einmal: »Warum fastet ihr für mich«, spricht der Herr, »sodass man heute eure Stimme laut rufen hört? Das ist nicht das Fasten, das ich erwählt habe«, spricht der Herr, »auch nicht, dass ein Mensch sich selbst demütigt;


    auch wenn ihr euren Nacken wie einen Ring beugt, euch in Sacktuch kleidet und euch Asche zum Lager macht, werdet ihr das dennoch nicht ein annehmbares Fasten nennen.


    Zu uns aber spricht er: ›Seht, dies ist das Fasten, das ich erwählt habe‹, spricht der Herr: ›Löst jede Fessel der Bosheit, lockert die festgezogenen Stricke erzwungener Verträge,[a] entlasst die Gebrochenen in die Freiheit und zerreißt jedes ungerechte Joch. Brich dem Hungrigen dein Brot, und wenn du einen Nackten siehst, bekleide ihn. Nimm die Obdachlosen in dein Haus auf, und wenn du einen Demütigen siehst, verachte ihn nicht – auch niemanden aus deinem Haus und von deiner eigenen Nachkommenschaft.[b]


    Dann wird dein Licht am Morgen hervorbrechen, und deine Heilung wird schnell aufgehen. Die Gerechtigkeit wird vor dir herziehen, und die Herrlichkeit Gottes wird dich umgeben.


    Dann wirst du rufen, und Gott wird dich erhören. Während du noch redest, wird er sagen: „Sieh, hier bin ich.“ Wenn du das Joch aus deiner Mitte entfernst, das Ausstrecken des Fingers und das murrende Wort; wenn du dem Hungrigen von Herzen dein Brot gibst und dich des gedemütigten Menschen erbarmst.[c]‹


    Zu diesem Zweck also, meine Brüder,[d] hat der Langmütige alles vorausgesehen: Das Volk, das er in seinem Geliebten vorbereitet hatte, würde in Schlichtheit glauben. Darum offenbarte er uns alles im Voraus, damit wir nicht als Anfänger am Gesetz jener Menschen Schiffbruch erleiden.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung »Stricke erzwungener Verträge« folgt dem bereitgestellten englischen Textzeugen. Der genaue Wortlaut ist ohne unmittelbare Prüfung der griechischen und lateinischen Überlieferung unsicher; die Stelle entspricht sinngemäß Jesaja 58,6.
    reason: Kennzeichnet eine auffällige und möglicherweise variantenbedingte Rechtsmetapher.
  - marker: b
    text: Der letzte Satzteil ist im vorliegenden Zeugnis ungewöhnlich. Gemeint sein kann, dass niemand aus dem eigenen Haus oder der eigenen Verwandtschaft verachtet beziehungsweise übersehen werden soll.
    reason: Bewahrt syntaktische und semantische Unsicherheit, ohne den Haupttext unverständlich zu machen.
  - marker: c
    text: Wörtlich steht im Zeugnis die »gedemütigte Seele«; gemeint ist wahrscheinlich ein erniedrigter oder bedrängter Mensch.
    reason: Erklärt die idiomatische Wiedergabe eines anthropologischen Ausdrucks.
  - marker: d
    text: Das griechisch geprägte »Brüder« kann hier die gesamte angesprochene Gemeinschaft einschließen.
    reason: Macht den historischen Sprachgebrauch transparent, ohne den Wortlaut im Haupttext auszudehnen.
  - marker: e
    text: Mit »Gesetz jener Menschen« bezeichnet der Verfasser polemisch das zuvor »ihr Gesetz« genannte Gesetz. Die Formulierung gibt seine Argumentation wieder und ist keine zusätzliche Bewertung der Übersetzung.
    reason: Ordnet die scharfe Gruppenabgrenzung historisch-literarisch ein und vermeidet ihre unmarkierte Verallgemeinerung.
lexical_decisions:
- source_word: abasing/humbling his soul (Isaianic quotation)
  choice: sich selbst demütigt
  rationale: Das überlieferte englische Zeugnis gibt den semitisch-griechischen Ausdruck mit „soul“ wieder; im heutigen Deutsch bezeichnet „sich selbst demütigen“ natürlich und verständlich die ganze Person, ohne die asketische Bedeutung zu beseitigen.
- source_word: tightened cords of forcible contracts
  choice: die festgezogenen Stricke erzwungener Verträge
  rationale: Die ungewöhnliche Rechts- und Fesselmetaphorik des Zeugnisses wird bewusst erhalten; eine Glättung zu bloß „Unterdrückung“ würde mögliche Textbesonderheiten verdecken.
- source_word: broken ones
  choice: die Gebrochenen
  rationale: Bewahrt das eindringliche Bild von durch Unterdrückung gebrochenen Menschen, statt es ungesichert als eine bestimmte soziale oder rechtliche Gruppe festzulegen.
- source_word: acceptable
  choice: annehmbar
  rationale: Gibt die kultische Wertung knapp und in würdigem modernem Deutsch wieder.
- source_word: long-suffering
  choice: der Langmütige
  rationale: Erhält die substantivierte Gottesbezeichnung und ihre Aussage über geduldiges Ertragen.
- source_word: in simplicity
  choice: in Schlichtheit
  rationale: Bewahrt die mögliche positive Bedeutung von Aufrichtigkeit bzw. ungekünsteltem Glauben, ohne sie eindeutig auf „Einfalt“ oder „Arglosigkeit“ festzulegen.
- source_word: shipwreck ourselves upon their law
  choice: am Gesetz jener Menschen Schiffbruch erleiden
  rationale: Erhält sowohl die nautische Metapher als auch die polemische Distanz des Barnabasbriefs.
theological_decisions:
- issue: Gottesrede an „sie“ und „uns“
  choice: Die Gegenüberstellung wird ausdrücklich beibehalten.
  alternative: Die Jesaja-Worte allgemein und ohne verschiedene Adressatengruppen wiedergeben.
  rationale: Der Verfasser macht aus der Schriftrede eine theologische Unterscheidung zwischen „ihnen“ und „uns“; diese Spannung darf nicht harmonisiert werden.
- issue: Identität des „Geliebten“
  choice: „seinem Geliebten“ bleibt ohne erklärende Identifikation stehen.
  alternative: „Jesus Christus“ oder „seinem geliebten Sohn“ einsetzen.
  rationale: Die christologische Beziehung ist wahrscheinlich, doch die knappe Bezeichnung des vorliegenden Zeugnisses soll nicht durch eine konfessionell oder exegetisch ausgeweitete Formulierung ersetzt werden.
- issue: Bezug von „der Langmütige“ und der Pronomen
  choice: Die göttliche Bezeichnung und maskulinen Rückbezüge bleiben bestehen.
  alternative: Explizit „Gott“ oder „der Herr“ einsetzen.
  rationale: So bleibt die Ausdrucksweise des Barnabasbriefs sichtbar, ohne eine nicht ausdrücklich genannte Referenz in den Haupttext einzutragen.
- issue: „ihr Gesetz“
  choice: „das Gesetz jener Menschen“
  alternative: „das jüdische Gesetz“ oder „das Gesetz des Mose“
  rationale: Die scharfe innertextliche Polemik wird erhalten, aber nicht durch eine umfassendere historische oder theologische Identifikation verschärft.
- issue: Textgrundlage
  choice: Unsichere Einzelheiten werden eng am bereitgestellten öffentlichen englischen Zeugnis übersetzt und in Fußnoten gekennzeichnet.
  alternative: Den Wortlaut stillschweigend an eine moderne kritische Ausgabe von Jesaja 58 angleichen.
  rationale: Eine direkte Prüfung der griechischen und lateinischen Barnabas-Zeugen steht laut Datensatz noch aus; daher dürfen Varianten nicht verdeckt harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut hörbarem Schriftzitat. Archaismen wurden weitgehend vermieden; bildkräftige Wendungen wie „Schiffbruch erleiden“, „Joch“ und „der Langmütige“ bleiben erhalten. Wegen der ausdrücklich noch ausstehenden direkten Prüfung der griechischen und lateinischen Quellen ist der Entwurf konservativ am bereitgestellten Zeugnis ausgerichtet und markiert besonders unsichere Stellen.
