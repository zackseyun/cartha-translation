base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/021.yaml
  text: 'Therefore, it is good to learn the ordinances of the Lord, as many as have been written above, and to walk in them. For whoever does these things will be glorified in the kingdom of God, but whoever chooses their opposites will perish together with their works. This is why there is the resurrection; this is why there is the recompense.


    I urge those of you who are in a higher position: if you are willing to receive any good advice from me, keep among you those to whom you can do good. Do not fail.


    The day is near when everything will be destroyed together with the Evil One. The Lord is near, and his reward.


    Again and again I urge you: be good lawgivers for one another; remain faithful counselors to yourselves; remove all hypocrisy from among you.


    And may God, who is Lord of the whole world, give you wisdom, judgment, learning, knowledge of his ordinances, and patience.


    Be taught by God, diligently seeking what the Lord requires of you, and act so that you may be found on the day of judgment.


    But if you have any remembrance of what is good, remember me when you practice these things, these things, so that both my desire and my watchfulness may lead to some good result. I urge you, asking this as a favor.


    As long as the good vessel (of the body) is with you, do not lack any of these things, but search them out constantly and fulfill every commandment, for they deserve it.


    For this reason I was all the more eager to write to you as far as I was able, so that I might give you joy. Farewell, children of love and peace. May the Lord of glory and of every grace be with your spirit.'
translation:
  language: de
  text: 'Darum ist es gut, die Weisungen des Herrn zu lernen, soweit sie oben niedergeschrieben sind, und nach ihnen zu leben. Denn wer dies tut, wird im Reich Gottes verherrlicht werden; wer aber das Gegenteil wählt, wird zusammen mit seinen Werken zugrunde gehen. Dazu gibt es die Auferstehung, dazu die Vergeltung.


    Ich ermahne diejenigen unter euch, die höher gestellt sind: Wenn ihr einen gut gemeinten Rat von mir annehmen wollt, dann behaltet Menschen bei euch, denen ihr Gutes tun könnt. Versäumt es nicht!


    Der Tag ist nahe, an dem alles zusammen mit dem Bösen vernichtet werden wird. Der Herr ist nahe und mit ihm sein Lohn.


    Immer wieder ermahne ich euch: Seid einander gute Gesetzgeber; bleibt euch selbst treue Ratgeber; legt jede Heuchelei ab.


    Gott aber, der Herr der ganzen Welt, gebe euch Weisheit, Urteilsvermögen, Bildung, Erkenntnis seiner Weisungen und Geduld.


    Lasst euch von Gott unterweisen. Erforscht gewissenhaft, was der Herr von euch verlangt, und handelt danach, damit ihr am Tag des Gerichts als bewährt erfunden werdet.


    Wenn ihr aber das Gute im Gedächtnis behaltet, dann denkt auch an mich, während ihr dies tut,[a] damit sowohl mein Verlangen als auch meine Wachsamkeit etwas Gutes bewirken. Darum bitte ich euch; erweist mir diese Gunst.


    Solange das gute Gefäß bei euch ist,[b] soll es euch an nichts von alledem fehlen. Forscht vielmehr beständig danach und erfüllt jedes Gebot; denn diese Gebote sind es wert.


    Deshalb lag mir umso mehr daran, euch nach meinen Möglichkeiten zu schreiben, um euch Freude zu bereiten. Lebt wohl, Kinder der Liebe und des Friedens! Der Herr der Herrlichkeit und aller Gnade sei mit eurem Geist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das vorgelegte englische Zeugnis wiederholt an dieser Stelle „diese Dinge“ zweimal. Die Wiederholung wurde nicht in den Haupttext übernommen, da die direkte Prüfung des griechischen und lateinischen Wortlauts noch aussteht und die Doppelung wie ein Überlieferungs- oder Abschreibefehler wirken kann.
    reason: Dokumentiert eine auffällige Doppelung der unmittelbaren Vorlage, ohne sie stillschweigend als sicher ursprünglichen Wortlaut auszugeben.
  - marker: b
    text: Mit dem „guten Gefäß“ ist wahrscheinlich der Leib gemeint; das vorgelegte englische Zeugnis fügt diese Erklärung in Klammern hinzu.
    reason: Bewahrt die Metapher und kennzeichnet die Leibdeutung als Erläuterung.
lexical_decisions:
- source_word: ordinances
  choice: Weisungen
  rationale: „Weisungen“ gibt verbindliche göttliche Anordnungen in natürlichem, würdigem Deutsch wieder, ohne sie unnötig auf staatliche Gesetze oder kultische Satzungen einzuengen.
- source_word: recompense / reward
  choice: Vergeltung / Lohn
  rationale: 'Die unterschiedlichen deutschen Wörter erhalten den jeweiligen Zusammenhang: endzeitliche Vergeltung im ersten Absatz und der mit dem nahen Herrn kommende Lohn im dritten.'
- source_word: lawgivers
  choice: Gesetzgeber
  rationale: Die auffällige und anspruchsvolle Metapher des Zeugnisses wird nicht zu bloßem „Ratgeben“ abgeschwächt; der folgende Ausdruck „Ratgeber“ bleibt dadurch eigenständig.
- source_word: judgment
  choice: Urteilsvermögen
  rationale: In der Aufzählung einer erbetenen Befähigung bezeichnet das Wort eher die Fähigkeit zu urteilen als das endzeitliche Gericht, das im folgenden Absatz ausdrücklich genannt wird.
- source_word: good vessel
  choice: das gute Gefäß
  rationale: Die Bildsprache bleibt im Haupttext erhalten; die mögliche Deutung auf den Leib wird in einer Fußnote ausgewiesen statt in den Text eingefügt.
- source_word: be found
  choice: als bewährt erfunden werden
  rationale: Die passivische Gerichtssprache wird bewahrt, während „als bewährt“ den im Deutschen sonst unvollständigen Ausdruck verständlich macht.
theological_decisions:
- issue: Zusammenhang von Tun, Verherrlichung, Auferstehung und Vergeltung
  choice: Die kausale und eschatologische Spannung des Zeugnisses bleibt unmittelbar stehen.
  alternative: Die Aussagen durch eine dogmatische Erklärung zu Gnade, Glauben oder Werken näher bestimmen.
  rationale: Der Text selbst entfaltet diese systematische Einordnung hier nicht; eine konfessionelle Harmonisierung wäre ein Zusatz.
- issue: „der Böse“ oder „das Böse“
  choice: „der Böse“
  alternative: „das Böse“
  rationale: Das Zeugnis schreibt „the Evil One“ und versteht den Ausdruck offenbar personal; die Übersetzung wahrt diese personale Lesart.
- issue: „sein Lohn“
  choice: Der Bezug auf den nahen Herrn bleibt erhalten.
  alternative: „die von ihm ausgehende Vergeltung“
  rationale: Das Possessivpronomen lässt offen, ob der Lohn als mitgebrachte Gabe oder als ausgeteilte Vergeltung akzentuiert wird.
- issue: Das „gute Gefäß“ als Leib
  choice: Im Haupttext wird nur das Bild übersetzt; die Leibdeutung steht in der Fußnote.
  alternative: „Solange ihr noch im Leib lebt“
  rationale: Die auslegende Identifikation soll die genuine Metapher nicht ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Kurze Mahnsätze und eschatologische Zuspitzungen bleiben erhalten. Da eine unmittelbare Prüfung der griechischen und lateinischen Zeugen laut Datensatz noch aussteht, ist der Entwurf ausdrücklich anhand des bereitgestellten gemeinfreien englischen Zeugnisses und der auditierten englischen Beratungsschicht erstellt; auffällige oder auslegende Stellen werden transparent markiert.
