review_pass:
  verdict: revise
  source_fidelity: Eine Revision ist erforderlich. Die personale Bezeichnung „the Evil One“ muss als „der Böse“ wiedergegeben werden. Vor allem darf die im bereitgestellten englischen Zeugen sowie im englischen POB-Text belegte auffällige Wiederholung „these things, these things“ nicht aufgrund einer bloßen Vermutung aus dem Haupttext entfernt werden; ohne unmittelbare Kollation der griechisch-lateinischen Zeugen ist sie transparent beizubehalten. Außerdem ergänzt „als bewährt“ den knappen passivischen Ausdruck „may be found“ inhaltlich und sollte entfallen.
  naturalness: 'Der Text ist überwiegend modernes, würdiges Standarddeutsch. Einzelne Formulierungen werden geglättet, ohne die eigenwillige Paränese zu nivellieren: „seid euch selbst treue Ratgeber“ ist idiomatischer, und „so weit es mir möglich war“ trifft die Begrenzung des Schreibers klarer. Die wiederholte Wendung in Absatz 7 bleibt absichtlich holprig, weil sie die Vorlage abbildet und durch eine Fußnote erläutert wird.'
  terminology: „Weisungen“, „Reich Gottes“, „Auferstehung“, „Vergeltung“, „Lohn“, „Tag des Gerichts“ und „Gefäß“ sind angemessen. „Der Böse“ wahrt die personale Lesart des englischen Zeugen. Die Leibdeutung des „guten Gefäßes“ bleibt zutreffend als vorsichtige Fußnotenerläuterung und wird nicht in den Haupttext eingetragen.
  issues:
  - severity: medium
    issue: „the Evil One“ ist mit „dem Bösen“ statt personal mit „dem Bösen/der Böse“ übersetzt.
    rationale: Der englische Zeuge unterscheidet ausdrücklich „the Evil One“ von einem abstrakten Bösen. Die deutsche Fassung muss diese personale Referenz bewahren.
  - severity: high
    issue: Die doppelte Formulierung „these things, these things“ wurde aus dem Haupttext entfernt.
    rationale: Sowohl das überlieferte englische Zeugnis als auch der englische POB-Audit-Text enthalten die Wiederholung. Eine vermutete Überlieferungsstörung rechtfertigt ohne Prüfung der alten Zeugen keine Tilgung; die Unsicherheit ist in einer Fußnote zu dokumentieren.
  - severity: medium
    issue: „als bewährt erfunden“ ergänzt eine im Zeugen nicht ausgedrückte Qualifikation.
    rationale: Der Wortlaut sagt nur, dass die Angesprochenen am Tag des Gerichts „gefunden“ werden sollen. Die Ergänzung „bewährt“ kann zwar naheliegen, schränkt den offenen Ausdruck aber unnötig auslegend ein.
  - severity: low
    issue: „bleibt euch selbst treue Ratgeber“ ist syntaktisch weniger natürlich als eine prädikative Aufforderung.
    rationale: „Seid euch selbst treue Ratgeber“ erhält die Bedeutung und passt besser zur Reihe der Imperative.
  revised_text: 'Darum ist es gut, die Weisungen des Herrn zu lernen, so viele oben niedergeschrieben sind, und nach ihnen zu leben. Denn wer dies tut, wird im Reich Gottes verherrlicht werden; wer aber das Gegenteil wählt, wird zusammen mit seinen Werken zugrunde gehen. Dazu gibt es die Auferstehung, dazu die Vergeltung.


    Ich ermahne diejenigen unter euch, die höher gestellt sind: Wenn ihr einen gut gemeinten Rat von mir annehmen wollt, dann behaltet Menschen bei euch, denen ihr Gutes tun könnt. Versäumt es nicht!


    Der Tag ist nahe, an dem alles zusammen mit dem Bösen vernichtet werden wird. Der Herr ist nahe und mit ihm sein Lohn.


    Immer wieder ermahne ich euch: Seid einander gute Gesetzgeber; seid euch selbst treue Ratgeber; legt jede Heuchelei ab.


    Gott aber, der Herr der ganzen Welt, gebe euch Weisheit, Urteilsvermögen, Bildung, Erkenntnis seiner Weisungen und Geduld.


    Lasst euch von Gott unterweisen. Erforscht gewissenhaft, was der Herr von euch verlangt, und handelt, damit ihr am Tag des Gerichts erfunden werdet.


    Wenn ihr aber das Gute im Gedächtnis behaltet, dann denkt auch an mich, während ihr diese Dinge tut, diese Dinge tut,[a] damit sowohl mein Verlangen als auch meine Wachsamkeit zu etwas Gutem führen. Darum bitte ich euch; erweist mir diese Gunst.


    Solange das gute Gefäß bei euch ist,[b] soll es euch an nichts von alledem fehlen. Forscht vielmehr beständig danach und erfüllt jedes Gebot; denn diese Gebote sind es wert.


    Deshalb lag mir umso mehr daran, euch zu schreiben, so weit es mir möglich war, um euch Freude zu bereiten. Lebt wohl, Kinder der Liebe und des Friedens! Der Herr der Herrlichkeit und aller Gnade sei mit eurem Geist.'
