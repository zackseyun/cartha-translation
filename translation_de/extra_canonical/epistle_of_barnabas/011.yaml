  text: 'But let us ask whether the Lord took care to reveal beforehand anything about the water and the cross. Now concerning the water, it is written with reference to Israel that they would not receive the baptism that brings forgiveness of sins, but would build for themselves.


    For the prophet says, “Be astonished, heaven, and let the earth shudder even more at this, for this people has done two evil things: they abandoned me, the fountain of life, and they dug for themselves a pit of death.


    “Is my holy mountain of Sinai a desert rock? For you shall be like the young birds that flutter aloft when deprived of their nest.”


    And again the prophet says, “I will go before you and level mountains, crush gates of bronze, and break iron bars in pieces. I will give you treasures—dark, concealed, and unseen—so that they may know that I am the Lord God.”


    And, “You shall dwell in a lofty cave of a strong rock.” And, “His water shall be sure. You shall see the King in glory, and your soul shall meditate on the fear of the Lord.”


    And again he says in another prophet, “The one who does these things shall be like the tree planted beside divided streams of water, which shall yield its fruit in its proper season. Its leaf shall not fall off, and everything he does shall prosper.


    “Not so the ungodly, not so. Instead, they are like the dust that the wind scatters from the face of the earth. Therefore, ungodly people shall not stand in the judgment, nor sinners in the council of the righteous. For the Lord knows the way of the righteous, but the way of the ungodly shall perish.”


    You understand how he pointed out the water and the cross at the same time. For this is the meaning: Blessed are those who set their hope on the cross and go down into the water. For he speaks of the reward “in its proper season.” “Then,” he says, “I will repay.” But what does he say about the present? “Its leaves shall not fall off.” By this he means that every word that comes from your mouth in faith and love shall lead many to conversion and hope.


    And again another prophet says, “The land of Jacob was praised above the whole earth.” He means this: He glorifies the vessel of his Spirit.


    What does he say next? “There was a river flowing from the right hand, and beautiful trees grew up from it. Whoever eats from them shall live forever.”


    He says this because we go down into the water burdened with sins and filth, and we rise from it bearing fruit in the heart, resting our fear and hope on Jesus in the spirit. “Whoever eats from these shall live forever.” He means this: “Whoever,” he says, “hears these things being spoken and believes shall live forever.”'
translation:
  language: de
  text: 'Lasst uns nun untersuchen, ob der Herr im Voraus auch auf das Wasser und das Kreuz hingewiesen hat. Über das Wasser steht im Hinblick auf Israel geschrieben, dass sie die Taufe, die Vergebung der Sünden bringt, nicht annehmen, sondern sich selbst etwas bauen würden.[a]


    Denn der Prophet sagt: »Staune, Himmel, und die Erde erbebe darüber noch mehr! Denn dieses Volk hat zwei böse Dinge getan: Mich, die Quelle des Lebens, haben sie verlassen, und für sich selbst haben sie eine Grube des Todes gegraben.


    Ist mein heiliger Berg Sinai etwa ein öder Fels? Denn ihr werdet sein wie junge Vögel, die hoch umherflattern, wenn ihnen ihr Nest genommen wurde.«[b]


    Und wieder sagt der Prophet: »Ich werde vor dir hergehen, Berge einebnen, bronzene Tore zerschmettern und eiserne Riegel zerbrechen. Ich werde dir Schätze geben, dunkle, verborgene und unsichtbare, damit sie erkennen, dass ich der Herr, Gott, bin.«[c]


    Und: »Du wirst in einer hoch gelegenen Höhle eines festen Felsens wohnen.« Und: »Sein Wasser wird zuverlässig sein. Ihr werdet den König in Herrlichkeit sehen, und eure Seele wird über die Furcht des Herrn nachdenken.«[d]


    Und wieder sagt er durch einen anderen Propheten: »Wer dies tut, wird sein wie ein Baum, der an Wasserläufen gepflanzt ist. Er bringt seine Frucht zu seiner Zeit, und sein Blatt fällt nicht ab; alles, was er tut, wird gelingen.


    Nicht so die Gottlosen, nicht so! Vielmehr sind sie wie Staub, den der Wind vom Erdboden verweht. Darum werden Gottlose im Gericht nicht bestehen und Sünder nicht in der Versammlung der Gerechten. Denn der Herr kennt den Weg der Gerechten; doch der Weg der Gottlosen wird vergehen.«[e]


    Ihr versteht, wie er zugleich auf das Wasser und das Kreuz hingewiesen hat. Denn dies ist der Sinn: Glücklich sind, die ihre Hoffnung auf das Kreuz setzen und ins Wasser hinabsteigen. Er spricht nämlich von der Belohnung »zu seiner Zeit«: »Dann«, sagt er, »werde ich vergelten.« Was aber sagt er über die Gegenwart? »Seine Blätter werden nicht abfallen.« Damit meint er: Jedes Wort, das in Glauben und Liebe aus eurem Mund hervorgeht, wird vielen zur Umkehr und zur Hoffnung dienen.


    Und wieder sagt ein anderer Prophet: »Das Land Jakobs wurde mehr gerühmt als die ganze Erde.« Damit meint er: Er verherrlicht das Gefäß seines Geistes.[f]


    Was sagt er danach? »Von der rechten Seite strömte ein Fluss, und aus ihm wuchsen prächtige Bäume empor; wer von ihnen isst, wird ewig leben.«[g]


    Das sagt er, weil wir mit Sünden und Schmutz beladen ins Wasser hinabsteigen und daraus emporsteigen, wobei wir im Herzen Frucht tragen und im Geist unsere Furcht und Hoffnung auf Jesus gründen.[h] »Wer von diesen isst, wird ewig leben.« Damit meint er: »Wer«, so sagt er, »diese Worte hört und glaubt, wird ewig leben.«'
