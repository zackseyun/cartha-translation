  footnotes:
  - marker: a
    text: Der Satz bricht nach »sich selbst etwas bauen« inhaltlich unvollständig ab. Die überlieferte Lücke wird nicht ergänzt.
    reason: Wahrung einer echten textlichen Unvollständigkeit.
  - marker: b
    text: Die Zitatfolge verbindet Formulierungen, die in dieser Gestalt von den geläufigen Fassungen von Jeremia 2,12–13 und weiteren prophetischen Texten abweichen.
    reason: Kennzeichnet die eigenständige, teils schwer zuzuordnende Zitierform des Barnabasbriefs.
  - marker: c
    text: Vgl. Jesaja 45,2–3. Die Anrede wechselt im Zitat zum Singular.
    reason: Quellenhinweis und Bewahrung des Numeruswechsels.
  - marker: d
    text: Vgl. Jesaja 33,16–18. »Zuverlässig« kann hier auch »sicher« oder »gewiss« bedeuten.
    reason: Lexikalische Mehrdeutigkeit der Wasser-Aussage.
  - marker: e
    text: Vgl. Psalm 1,3–6. Der Barnabasbrief liest und deutet den Psalm ausdrücklich im Blick auf Wasser und Kreuz.
    reason: Macht die Grundlage der folgenden typologischen Auslegung sichtbar.
  - marker: f
    text: Mit dem »Gefäß seines Geistes« ist wahrscheinlich ein vom Geist erfüllter Mensch gemeint; der knappe Ausdruck bleibt jedoch mehrdeutig.
    reason: Erklärung ohne Festlegung der nicht ausdrücklich genannten Referenz.
  - marker: g
    text: Die Bildsprache erinnert an Ezechiel 47,1–12; die hier zitierte Form stimmt nicht vollständig mit den üblichen Textfassungen überein.
    reason: Quellenhinweis bei zugleich abweichender Zitiergestalt.
  - marker: h
    text: Die Formulierung kann auch so verstanden werden, dass Furcht und Hoffnung im Geist auf Jesus bezogen beziehungsweise in ihm gegründet werden.
    reason: Bewahrt die syntaktische und theologische Mehrdeutigkeit.
lexical_decisions:
- source_word: ὕδωρ
  choice: Wasser
  rationale: Bewahrt den Leitbegriff des Kapitels und seine Verbindung mit der Taufe, ohne beide Wörter unterschiedslos wiederzugeben.
- source_word: σταυρός
  choice: Kreuz
  rationale: Direkte und in diesem Kontext eindeutige Wiedergabe des frühchristlichen Deutungsschlüssels.
- source_word: βάπτισμα
  choice: Taufe
  rationale: Der Text benennt ausdrücklich das mit Sündenvergebung verbundene rituelle Hinabsteigen ins Wasser.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: Vergebung der Sünden
  rationale: Natürliche, theologisch offene Standardformulierung; fügt keine besondere Theorie der Taufwirkung hinzu.
- source_word: φόβος
  choice: Furcht
  rationale: Erhält die religiöse Spannung des Ausdrucks; eine Abschwächung zu bloßer Ehrfurcht wäre interpretierend.
- source_word: μετάνοια
  choice: Umkehr
  rationale: Modern verständlich und umfassender als bloße Reue; bezeichnet die Neuausrichtung des Menschen.
- source_word: σκεῦος τοῦ πνεύματος
  choice: Gefäß seines Geistes
  rationale: Bewahrt die konkrete Metapher und die Mehrdeutigkeit, worauf oder auf wen sie bezogen ist.
theological_decisions:
- issue: Verhältnis von Wasser und Taufe
  choice: Wasser und Taufe werden sprachlich unterschieden, aber durch den Gedankengang eng verbunden.
  alternative: Jede Erwähnung des Wassers unmittelbar als Taufe paraphrasieren.
  rationale: Der Autor entwickelt seine typologische Deutung schrittweise; die Übersetzung soll diese Auslegung nicht vorwegnehmen.
- issue: Wirkung der Taufe
  choice: »die Vergebung der Sünden bringt« folgt der expliziten Aussage des Textes.
  alternative: »die Vergebung der Sünden symbolisiert« oder »bezeugt«.
  rationale: Die Alternativen würden eine konfessionelle Sakramentenlehre in den Text eintragen oder seine Aussage abschwächen.
- issue: Hoffnung auf das Kreuz
  choice: Die ungewöhnliche Formulierung wird wörtlich bewahrt.
  alternative: »auf den Gekreuzigten vertrauen«.
  rationale: Die Alternative könnte die Absicht zutreffend erläutern, würde jedoch die konkrete Ausdrucksweise und typologische Argumentation des Autors verändern.
- issue: »Furcht und Hoffnung auf Jesus«
  choice: Die syntaktische Spannung wird als gemeinsame Ausrichtung auf Jesus erhalten.
  alternative: Nur die Hoffnung auf Jesus beziehen und die Furcht allgemein auf Gott.
  rationale: Die überlieferte Formulierung lässt die genaue Zuordnung offen; sie soll nicht stillschweigend harmonisiert werden.
- issue: Schriftzitate
  choice: Die im Barnabasbrief vorliegende Zitatform wird übersetzt, auch wo sie von bekannten alttestamentlichen Textformen abweicht.
  alternative: Die Zitate an eine moderne Übersetzung des Alten Testaments angleichen.
  rationale: Übersetzt wird der Barnabasbrief mit seiner eigenen Text- und Zitiergestalt, nicht ein rekonstruierter alttestamentlicher Ausgangstext.
translation_notes:
  register: Moderne deutsche Standardsprache mit würdigem, gut vorlesbarem Ton. Archaismen wurden vermieden, während prophetische Zitate rhythmisch und bildkräftig bleiben. Direkte Anreden und Numeruswechsel der Vorlage wurden nicht harmonisiert. Da eine direkte Prüfung des griechischen und lateinischen Wortlauts laut Datensatz noch aussteht, ist der Entwurf quellenkritisch vorläufig und stützt sich auf den bereitgestellten öffentlichen Zeugen sowie die bekannte Zitiergestalt des Kapitels.
