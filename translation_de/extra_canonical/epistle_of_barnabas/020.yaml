review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Lasterkatalog, seine Zuspitzung und die personifizierende Bezeichnung „der Schwarze“ insgesamt treffend wieder. Zwei Formulierungen verschieben jedoch den Sinn bzw. sind im Deutschen unklar: „unter Strafe“ gibt „with punishment“ nicht angemessen wieder, und „für die Gottesfurcht ... wachen“ verfehlt die kausale bzw. motivierende Aussage des Zeugen. Die auffällige englische Wendung „exhalation of power“ bleibt ohne unmittelbare Kollation der griechisch-lateinischen Überlieferung unsicher und muss als solche markiert bleiben.'
  naturalness: Die Reihung ist gut lesbar und dem Mahncharakter angemessen. „Ein Weg ewigen Todes unter Strafe“ und besonders „für die Gottesfurcht ... wachen“ wirken jedoch unidiomatisch. „Nicht aus Gottesfurcht, sondern zum Bösen wachsam sind“ ist modernes Standarddeutsch und bewahrt den Kontrast.
  terminology: „Der Schwarze“ bewahrt die nicht weiter ausgelegte Benennung des Zeugen. „Götzendienst“, „Gottesfurcht“, „Sanftmut“, „Geduld“ und „Gottes Geschöpfe“ sind sachgerecht. Für die unsichere Wendung wird „Machtüberheblichkeit“ gewählt; die Fußnote verhindert, dass dies als gesicherte Rekonstruktion ausgegeben wird.
  issues:
  - severity: medium
    issue: „unter Strafe“ für „with punishment“
    rationale: Die Präposition „unter“ legt ein Unterworfensein unter eine Strafe nahe. Der Zeuge verbindet den Weg dagegen mit ewigen Tod und Strafe; „mit Strafe“ ist näher und klarer.
  - severity: medium
    issue: „nicht für die Gottesfurcht ... wachen“
    rationale: 'Diese Formulierung ist im Deutschen semantisch unklar. Der Gegensatz betrifft die Ausrichtung bzw. das Motiv ihrer Wachsamkeit: nicht Gottesfurcht, sondern Böses.'
  - severity: low
    issue: Unsichere Grundlage von „exhalation of power“
    rationale: Die vorliegende englische Zeugenformulierung ist ungewöhnlich. Eine glatte deutsche Wiedergabe darf nur mit einem deutlichen Vorbehalt erfolgen, bis die griechischen und lateinischen Textzeugen geprüft sind.
  revised_text: '20 Der Weg des Schwarzen aber ist krumm und voller Fluch. Denn er ist ein Weg des ewigen Todes mit Strafe. Auf ihm findet sich alles, was die Seelen der Menschen zugrunde richtet: Götzendienst, Dreistigkeit, Machtüberheblichkeit,[a] Heuchelei, ein geteiltes Herz, Ehebruch, Mord, Raub, Hochmut, Gesetzesübertretung, Verrat, Bosheit, Halsstarrigkeit, Hexerei, Zauberei, Habgier und fehlende Gottesfurcht;


    Menschen, die die Guten verfolgen, die Wahrheit hassen und die Lüge lieben; die den Lohn der Gerechtigkeit nicht erkennen und weder am Guten noch am gerechten Urteil festhalten; die sich nicht um Witwe und Waise kümmern; die nicht aus Gottesfurcht, sondern zum Bösen wachsam sind; Menschen, denen Sanftmut und Geduld fern und völlig fremd sind; die Nichtiges lieben und nach Vergeltung trachten; die kein Erbarmen mit dem Armen haben und sich nicht für den von Mühsal Bedrückten abmühen; die zur Verleumdung bereit sind, ihren Schöpfer nicht anerkennen, Kinder ermorden, Gottes Geschöpfe verderben, sich vom Bedürftigen abwenden, den Bedrängten unterdrücken, für die Reichen eintreten, die Armen ungerecht richten und in allem sündigen.'
