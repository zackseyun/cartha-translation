translation:
  language: de
  text: '20 Der Weg des Schwarzen aber ist krumm und voller Fluch. Denn er ist ein Weg ewigen Todes unter Strafe. Auf ihm findet sich alles, was die Seelen der Menschen zugrunde richtet: Götzendienst, Dreistigkeit, Überheblichkeit der Macht,[a] Heuchelei, ein geteiltes Herz, Ehebruch, Mord, Raub, Hochmut, Gesetzesübertretung, Verrat, Bosheit, Halsstarrigkeit, Hexerei, Zauberei, Habgier und fehlende Gottesfurcht;


    Menschen, die die Guten verfolgen, die Wahrheit hassen und die Lüge lieben; die den Lohn der Gerechtigkeit nicht erkennen und weder am Guten noch am gerechten Urteil festhalten; die sich nicht um Witwe und Waise kümmern; die nicht für die Gottesfurcht, sondern für das Böse wachen; Menschen, denen Sanftmut und Geduld fern und völlig fremd sind; die Nichtiges lieben und nach Vergeltung trachten; die kein Erbarmen mit dem Armen haben und sich nicht für den abmühen, der von Mühsal bedrückt wird; die schnell verleumden, ihren Schöpfer nicht anerkennen, Kinder ermorden, Gottes Geschöpfe verderben, sich vom Bedürftigen abwenden, den Bedrängten unterdrücken, für die Reichen eintreten, die Armen ungerecht richten und in allem sündigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtliche bzw. genaue Bedeutung an dieser Stelle unsicher; der zugrunde gelegte englische Zeuge bietet die ungewöhnliche Wendung „exhalation of power“. Eine Prüfung am griechischen und lateinischen Text steht noch aus.
    reason: Die bereitgestellte Grundlage ist ausdrücklich nur ein englischer Zeuge; diese auffällige Formulierung darf nicht als sicherer Ausgangstext behandelt werden.
lexical_decisions:
- source_word: the Black One
  choice: der Schwarze
  rationale: Die substantivierte Farbbezeichnung bewahrt die personifizierende, offenbar gegenspielerische Bezeichnung des Zeugen, ohne sie ausdrücklich als „Teufel“ auszulegen.
- source_word: crooked
  choice: krumm
  rationale: Bewahrt das konkrete Wegbild und zugleich dessen moralische Bedeutung.
- source_word: exhalation of power
  choice: Überheblichkeit der Macht
  rationale: Die englische Zeugenformulierung ist ungewöhnlich und vermutlich text- oder übersetzungsbedingt. Die Wiedergabe folgt dem wahrscheinlichen Sinnfeld von Hochmut bzw. anmaßendem Machtgebaren, markiert aber die Unsicherheit in einer Fußnote.
- source_word: doubleness of heart
  choice: ein geteiltes Herz
  rationale: Natürliches modernes Deutsch, das innere Unaufrichtigkeit und zwiespältige Loyalität ausdrückt, ohne die Metapher ganz aufzulösen.
- source_word: pursuing a recompense
  choice: nach Vergeltung trachten
  rationale: „Recompense“ kann Lohn oder Vergeltung bezeichnen; im negativen Lasterkatalog passt Vergeltung am besten, bleibt jedoch mangels direkter Quellenprüfung vorläufig.
- source_word: creatures of God
  choice: Gottes Geschöpfe
  rationale: Die übliche und würdevolle deutsche Entsprechung, die den Umfang der Aussage offenlässt.
- source_word: advocates of the wealthy
  choice: für die Reichen eintreten
  rationale: Gibt die Parteinahme zugunsten Wohlhabender verständlich wieder, ohne zwingend ein formelles Rechtsamt anzunehmen.
theological_decisions:
- issue: Identität des „Schwarzen“
  choice: der Schwarze
  alternative: der Teufel / der Böse
  rationale: Die bildhafte Benennung wird nicht durch eine theologische Identifikation ersetzt, auch wenn ein dämonischer Gegenspieler wahrscheinlich gemeint ist.
- issue: „Weg ewigen Todes“ und Strafe
  choice: ein Weg ewigen Todes unter Strafe
  alternative: ein Weg des ewigen Todes mit Strafe
  rationale: Die harte eschatologische Aussage des Zeugen bleibt bestehen; Art und Verhältnis von Tod und Strafe werden nicht weiter systematisiert.
- issue: „ihren Schöpfer nicht anerkennen“
  choice: ihren Schöpfer nicht anerkennen
  alternative: den nicht erkennen, der sie geschaffen hat
  rationale: Das Bezugswort „ihren“ bezieht sich auf die beschriebenen Menschen. Die Aussage bleibt allgemein theistisch und wird nicht konfessionell präzisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange katalogartige Satzführung des antiken Mahntextes bleibt erkennbar, wird jedoch durch Semikola und parallele Relativsätze lesbar gegliedert. Der Entwurf ist wegen der noch ausstehenden direkten Prüfung der griechischen und lateinischen Quellen vorläufig.
