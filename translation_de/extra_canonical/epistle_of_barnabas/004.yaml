base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/004.yaml
  text: 'Therefore, we ought to investigate the present deeply and search out the things that have power to save us. Let us flee completely from all the works of lawlessness, so that the works of lawlessness do not overpower us. Let us hate the error of the present age, so that we may be loved for what is to come.


    Let us give our soul no relief that would allow it to associate with sinners and wicked people, so that we are not made like them.


    The last offense is at hand, concerning which Scripture speaks, as Enoch says. For this reason the Master has shortened the seasons and the days, so that his beloved may hasten and come to His inheritance.


    The prophet also speaks in this way: “Ten reigns shall reign upon the earth, and after them another king will arise, who will bring three of the kings low under one.”


    In the same way Daniel speaks concerning the same thing: “I saw the fourth beast, wicked and strong and more unmanageable than all the beasts of the earth. I saw ten horns arise from it, and from these a little horn, an outgrowth, and I saw how it brought three of the great horns low under one.”


    Therefore, you ought to understand. Moreover, I ask you this one thing as one of you, loving each of you more than my own soul: pay attention to yourselves now, and do not become like certain people who pile sin upon sin, saying that our covenant also remains theirs.


    It is ours, but they lost it forever in this way, just after Moses had received it. For Scripture says: “Moses was on the mountain, fasting for forty days and forty nights, and he received the covenant from the Lord—tablets of stone written by the finger of the Lord’s hand.”


    But they lost it by turning to idols. For the Lord says: “Moses, Moses, come down quickly, for your people, whom you brought out of the land of Egypt, have acted lawlessly.” Moses understood and threw the two tablets from his hands. Their covenant was shattered, so that the covenant of the beloved Jesus might be sealed upon our hearts in the hope that springs from faith in him.


    Although I would gladly write many things—not as a teacher, but as is fitting for one who loves you, so that you may not fall short of what we possess—I was eager to write to you, since I am your devoted servant. Therefore, let us be watchful in these last days. For the whole time of our faith will benefit us nothing unless now, in the season of lawlessness and amid the offenses that are to come, we resist as is fitting for God’s sons, so that the Black One may not gain an entrance.


    Let us flee from all vanity. Let us completely hate the works of the evil way. Do not, entering in privately, stand apart by yourselves, as though you were already justified, but gather together and consult about the common good.


    For Scripture says: “Woe to those who are wise for themselves and understanding in their own sight.” Let us become spiritual. Let us become a temple made perfect for God. As far as it lies within us, let us train ourselves in the fear of God, [and] let us strive to keep his commandments, so that we may rejoice in his ordinances.


    The Lord judges the world without partiality. Each person will receive according to his deeds. If someone is good, his righteousness will go before him on the way. If someone is evil, the repayment for his evildoing is before him, so that perhaps,


    if we relax as people who are called, we may fall asleep over our sins, and the prince of evil may gain power against us and thrust us out of the Lord’s kingdom.


    Moreover, understand this also, my brothers. When you see that, even after so many signs and wonders were performed in Israel, they were still abandoned, let us pay attention, so that perhaps we are not found to be, as Scripture says, “Many are called, but few are chosen.”'
translation:
  language: de
  text: '**Barnabasbrief 4**


    Darum müssen wir gründlich erforschen, was die Gegenwart betrifft, und nach dem suchen, was die Kraft hat, uns zu retten. Lasst uns daher alle Werke der Gesetzlosigkeit völlig meiden, damit die Werke der Gesetzlosigkeit uns nicht überwältigen. Lasst uns den Irrtum der gegenwärtigen Zeit verabscheuen, damit wir um des Zukünftigen willen geliebt werden.


    Gönnen wir unserer Seele keine Nachlässigkeit, die ihr erlauben würde, mit Sündern und bösen Menschen Umgang zu haben, damit wir ihnen nicht etwa gleich werden.


    Der letzte Anstoß steht bevor, von dem die Schrift redet, wie Henoch sagt.[a] Denn dazu hat der Gebieter die Zeiten und Tage verkürzt, damit sein Geliebter sich beeile und zu seinem Erbe komme.


    Auch der Prophet sagt es so: »Zehn Herrschaften werden auf der Erde herrschen; nach ihnen wird ein anderer König aufstehen, der drei der Könige unter einen erniedrigen wird.«[b]


    Ebenso sagt Daniel über dasselbe: »Ich sah das vierte Tier: Es war böse und stark und widerspenstiger als alle Tiere der Erde. Aus ihm erhoben sich zehn Hörner; aus ihnen kam ein kleines Horn, ein Auswuchs. Und ich sah, wie es drei der großen Hörner unter einen erniedrigte.«[b]


    Das müsst ihr also verstehen. Darüber hinaus bitte ich euch um dies eine – als einer von euch, der jeden Einzelnen von euch mehr liebt als sein eigenes Leben: Achtet jetzt auf euch selbst und gleicht nicht gewissen Leuten, die Sünde auf Sünde häufen und sagen, auch ihnen gehöre unser Bund weiterhin.


    Er gehört uns; sie aber haben ihn auf diese Weise für immer verloren, gleich nachdem Mose ihn empfangen hatte. Denn die Schrift sagt: »Mose war auf dem Berg und fastete vierzig Tage und vierzig Nächte. Und er empfing vom Herrn den Bund: steinerne Tafeln, beschrieben mit dem Finger der Hand des Herrn.«


    Doch sie verloren ihn, weil sie sich den Götzen zuwandten. Denn so spricht der Herr: »Mose, Mose, steig schnell hinab! Denn dein Volk, das du aus dem Land Ägypten herausgeführt hast, hat gesetzlos gehandelt.« Mose verstand und warf die beiden Tafeln aus seinen Händen. Ihr Bund zerbrach, damit der Bund des geliebten Jesus in unsere Herzen eingeprägt würde – in der Hoffnung, die aus dem Glauben an ihn entspringt.[c]


    Ich würde zwar gern vieles schreiben, nicht als Lehrer, sondern wie es sich für einen gehört, der euch liebt, damit ihr hinter dem, was wir besitzen, nicht zurückbleibt. Darum lag mir daran, euch zu schreiben, denn ich bin euer ergebener Diener. Lasst uns also in diesen letzten Tagen wachsam sein. Denn die ganze Zeit unseres Glaubens wird uns nichts nützen, wenn wir nicht jetzt, in der Zeit der Gesetzlosigkeit und angesichts der bevorstehenden Anstöße, Widerstand leisten, wie es sich für Söhne Gottes gehört, damit der Schwarze keinen Zugang findet.[d]


    Lasst uns vor allem Nichtigen fliehen und die Werke des bösen Weges ganz und gar hassen. Zieht euch nicht insgeheim zurück und sondert euch nicht voneinander ab, als wärt ihr schon gerechtfertigt. Kommt vielmehr zusammen und beratet über das gemeinsame Wohl.[e]


    Denn die Schrift sagt: »Wehe denen, die in den eigenen Augen weise und vor sich selbst verständig sind.« Lasst uns geistlich werden; lasst uns zu einem für Gott vollendeten Tempel werden. Soweit es an uns liegt, wollen wir uns in der Furcht Gottes üben und uns bemühen, seine Gebote zu halten, damit wir uns über seine Rechtsordnungen freuen können.[f]


    Der Herr richtet die Welt ohne Ansehen der Person. Jeder wird nach seinen Taten empfangen. Ist jemand gut, so geht seine Gerechtigkeit ihm auf dem Weg voraus; ist jemand böse, so liegt die Vergeltung für sein böses Tun vor ihm. Geben wir daher acht, dass wir nicht etwa nachlässig werden, weil wir Berufene sind, und über unseren Sünden einschlafen. Sonst könnte der Herrscher des Bösen Macht über uns gewinnen und uns aus dem Reich des Herrn hinausstoßen.[g]


    Versteht außerdem auch dies, meine Brüder: Wenn ihr seht, dass Israel trotz so vieler Zeichen und Wunder, die dort geschahen, schließlich verlassen wurde, dann wollen wir achtgeben, dass sich nicht etwa an uns erfüllt, was die Schrift sagt: »Viele sind berufen, aber wenige sind erwählt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier Henoch zugeschriebene Aussage ist in dieser Form in den erhaltenen Henochschriften nicht sicher nachweisbar.
    reason: Kennzeichnet eine unsichere antike Zuschreibung, ohne eine verlorene Quelle auszuschließen.
  - marker: b
    text: Die ungewöhnliche Wendung »unter einen« folgt dem überlieferten Wortlaut der zugrunde gelegten Übersetzungszeugen. Gemeint sein könnte die Unterwerfung dreier Herrscher durch einen einzigen, doch der Text wird hier nicht vereindeutigt.
    reason: Bewahrt eine echte textliche beziehungsweise syntaktische Schwierigkeit.
  - marker: c
    text: Die Aussage über den Bund gibt die Argumentation des Barnabasbriefs wieder. Sie ist nicht als redaktionelle Beurteilung des Judentums formuliert.
    reason: Verhindert, dass die historische Autorenstimme mit einer modernen redaktionellen Behauptung verwechselt wird.
  - marker: d
    text: »Der Schwarze« ist eine wörtlich bewahrte, personifizierende Bezeichnung für den bösen Widersacher.
    reason: Erklärt eine im modernen Deutsch auffällige Benennung, ohne sie im Haupttext auszulegen.
  - marker: e
    text: Der überlieferte Satzbau ist schwierig. Möglich ist auch ein Bezug auf Menschen, die sich heimlich einschleichen. Die Übersetzung folgt der Deutung als Warnung vor selbstgerechter Absonderung.
    reason: Macht die Unsicherheit von »entering in privily« transparent.
  - marker: f
    text: Im zugrunde gelegten englischen Zeugen steht das Bindewort vor »lasst uns bemühen« in eckigen Klammern; seine genaue textkritische Stellung bedarf der Prüfung an den griechischen und lateinischen Zeugen.
    reason: Dokumentiert die im Ausgangsmaterial angezeigte Ergänzung, ohne störende editorische Klammern in den Lesetext zu übernehmen.
  - marker: g
    text: 'Die Satzgrenze ist im Zeugen unsicher: Der Gedanke beginnt bereits mit der Warnung vor der Vergeltung und wird im folgenden Satz weitergeführt.'
    reason: Erklärt die für natürliches Deutsch vorgenommene Gliederung eines syntaktisch schwierigen Abschnitts.
lexical_decisions:
- source_word: present / present time
  choice: Gegenwart / gegenwärtige Zeit
  rationale: Bewahrt den zeitlich-eschatologischen Gegensatz zum Zukünftigen, ohne ihn als technische Weltzeitalter-Terminologie zu überdeuten.
- source_word: works of lawlessness
  choice: Werke der Gesetzlosigkeit
  rationale: Gibt die wiederholte Formulierung formal und theologisch offen wieder; weder bloß »Verbrechen« noch speziell »Gesetzesbruch« schränkt sie unnötig ein.
- source_word: Master
  choice: Gebieter
  rationale: Unterscheidet den Titel von »Herr« in den folgenden Schriftzitaten und bewahrt den Gedanken legitimer Autorität.
- source_word: offence(s)
  choice: Anstoß / Anstöße
  rationale: Bewahrt die mögliche Bedeutung von Verführung, Ärgernis oder eschatologischer Prüfung, statt eindeutig »Sünde« oder »Verfolgung« zu setzen.
- source_word: Black One
  choice: der Schwarze
  rationale: Die ungewöhnliche personifizierende Benennung wird bewusst nicht mit »Teufel« erklärt oder ersetzt.
- source_word: vanity
  choice: alles Nichtige
  rationale: Erfasst Leere, Nichtigkeit und Täuschung natürlicher als das im heutigen Deutsch oft anders verstandene »Eitelkeit«.
- source_word: ordinances
  choice: Rechtsordnungen
  rationale: Hält den Bezug auf göttliche Satzungen fest, ohne ihn konfessionell als Sakramente oder bloß als Gerichtsurteile zu bestimmen.
- source_word: devoted slave
  choice: ergebener Diener
  rationale: Natürliches, würdiges Deutsch; der Ausdruck völliger Hingabe bleibt erhalten, ohne im Deutschen unnötig eigentumsrechtliche Assoziationen in den Vordergrund zu rücken.
theological_decisions:
- issue: Bundeszugehörigkeit und Verlust des Bundes
  choice: 'Die ausschließliche Behauptung des Autors wird direkt wiedergegeben: »Er gehört uns; sie aber haben ihn ... verloren.«'
  alternative: Abschwächung zu einer bloß historischen oder vorläufigen Bundesstörung
  rationale: Der Text formuliert eine scharfe theologische Spannung. Die Übersetzung darf diese weder glätten noch als eigene redaktionelle Lehre ausgeben.
- issue: »sein Geliebter« und das Erbe
  choice: 'Singular und Pronomenbezug bleiben erhalten: »sein Geliebter ... zu seinem Erbe«.'
  alternative: 'Kollektiv: »seine Geliebten ... zu ihrem Erbe«'
  rationale: Der gelieferte Zeuge bietet einen Singular. Ohne abgeschlossene Prüfung des Griechischen und Lateinischen wird die mögliche christologische oder kollektive Deutung nicht entschieden.
- issue: Versiegelung des Bundes Jesu im Herzen
  choice: »der Bund des geliebten Jesus ... in unsere Herzen eingeprägt«
  alternative: »der von Jesus geliebte Bund« oder eine sakramentale Auslegung von »versiegelt«
  rationale: Der Genitiv wird als Zugehörigkeit zu Jesus verstanden, während eine konkrete konfessionelle Versiegelungslehre vermieden wird.
- issue: Gericht nach den Taten und Berufung
  choice: Beide Aussagen werden ohne harmonisierenden Zusatz nebeneinandergestellt.
  alternative: Erklärung durch ein bestimmtes Rechtfertigungs- oder Verdienstschema
  rationale: Die ethische Warnung und die Sprache von Berufung und Erwählung sollen in ihrer Spannung stehen bleiben.
- issue: Israel wurde verlassen
  choice: Die harte Aussage wird als Aussage des antiken Autors bewahrt.
  alternative: Umformulierung zu »Israel erlitt zeitweilige Folgen«
  rationale: Eine Abschwächung wäre keine Übersetzung; zugleich kennzeichnet der Kontext dies als Argument des Barnabasbriefs, nicht als redaktionelle Wertung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gemeindlich vorlesbarem Register. Wiederholungen wie »Werke der Gesetzlosigkeit« und die mahnenden Wir-Formen bleiben als rhetorische Kennzeichen erhalten. Archaismen werden vermieden. Da die bereitgestellte Grundlage ausdrücklich nur einen gemeinfreien englischen Zeugen bietet und die direkte Prüfung der griechischen und lateinischen Überlieferung noch aussteht, ist dies ein quellenbewusster Publikationsentwurf mit transparent markierten Unsicherheiten, keine abschließend textkritisch verifizierte Fassung.
