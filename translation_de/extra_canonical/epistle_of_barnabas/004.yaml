    Auch der Prophet sagt es so: »Zehn Herrschaften werden auf der Erde herrschen; nach ihnen wird ein anderer König aufstehen, der drei der Könige unter einen erniedrigen wird.«[b]


    Ebenso sagt Daniel über dasselbe: »Ich sah das vierte Tier: Es war böse und stark und widerspenstiger als alle Tiere der Erde. Aus ihm erhoben sich zehn Hörner; aus ihnen kam ein kleines Horn, ein Auswuchs. Und ich sah, wie es drei der großen Hörner unter einen erniedrigte.«[b]


    Das müsst ihr also verstehen. Darüber hinaus bitte ich euch um dies eine – als einer von euch, der jeden Einzelnen von euch mehr liebt als seine eigene Seele: Achtet jetzt auf euch selbst und gleicht nicht gewissen Leuten, die Sünde auf Sünde häufen und sagen, auch ihnen gehöre unser Bund weiterhin.


    Er gehört uns; sie aber haben ihn auf diese Weise für immer verloren, gleich nachdem Mose ihn empfangen hatte. Denn die Schrift sagt: »Mose war auf dem Berg und fastete vierzig Tage und vierzig Nächte. Und er empfing vom Herrn den Bund: steinerne Tafeln, beschrieben mit dem Finger der Hand des Herrn.«


    Doch sie verloren ihn, weil sie sich den Götzen zuwandten. Denn so spricht der Herr: »Mose, Mose, steig schnell hinab! Denn dein Volk, das du aus dem Land Ägypten herausgeführt hast, hat gesetzlos gehandelt.« Mose verstand und warf die beiden Tafeln aus seinen Händen. Ihr Bund zerbrach, damit der Bund des geliebten Jesus in unsere Herzen versiegelt werde – in der Hoffnung, die aus dem Glauben an ihn entspringt.[c]


    Ich würde zwar gern vieles schreiben, nicht als Lehrer, sondern wie es sich für einen gehört, der euch liebt, damit ihr hinter dem, was wir besitzen, nicht zurückbleibt. Darum lag mir daran, euch zu schreiben, denn ich bin euer ergebener Diener. Lasst uns also in diesen letzten Tagen wachsam sein. Denn die ganze Zeit unseres Glaubens wird uns nichts nützen, wenn wir nicht jetzt, in der Zeit der Gesetzlosigkeit und angesichts der bevorstehenden Anstöße, Widerstand leisten, wie es sich für Söhne Gottes gehört, damit der Schwarze keinen Zugang findet.[d]


    Lasst uns vor allem Nichtigen fliehen und die Werke des bösen Weges ganz und gar hassen. Haltet euch nicht heimlich für euch allein abseits, als wärt ihr schon gerechtfertigt. Kommt vielmehr zusammen und beratet über das gemeinsame Wohl.[e]


    Denn die Schrift sagt: »Wehe denen, die in den eigenen Augen weise und vor sich selbst verständig sind.« Lasst uns geistlich werden; lasst uns zu einem für Gott vollkommenen Tempel werden. Soweit es an uns liegt, wollen wir uns in der Furcht Gottes üben [und] uns bemühen, seine Gebote zu halten, damit wir uns über seine Rechtsordnungen freuen können.[f]


    Der Herr richtet die Welt ohne Ansehen der Person. Jeder wird nach seinen Taten empfangen. Ist jemand gut, so geht seine Gerechtigkeit ihm auf dem Weg voraus; ist jemand böse, so liegt die Vergeltung für sein böses Tun vor ihm. Geben wir acht, damit wir nicht etwa als Berufene nachlässig werden und über unseren Sünden einschlafen. Sonst könnte der Herrscher des Bösen Macht über uns gewinnen und uns aus dem Reich des Herrn hinausstoßen.[g]


    Versteht außerdem auch dies, meine Brüder: Wenn ihr seht, dass Israel trotz so vieler Zeichen und Wunder verlassen wurde, dann wollen wir achtgeben, dass sich nicht etwa an uns erfüllt, was die Schrift sagt: »Viele sind berufen, aber wenige sind erwählt.«'
