review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem bereitgestellten englischen Zeugen im Wesentlichen: Die schlichte Darlegung, der Gegensatz von Gegenwärtigem und Zukünftigem sowie die Gleichnisform bleiben erhalten. „Von Herzen“ glättet jedoch die ausdrücklich personale Wendung „meine Seele hofft“ zu stark. Außerdem muss die Negation beim unsicher überlieferten Einschub syntaktisch auch das Verfehlen des Ziels erfassen; die vorliegende Fassung kann so gelesen werden, als hoffe der Verfasser gerade, sein Ziel verfehlt zu haben.'
  naturalness: Der Text ist insgesamt modernes, würdevolles Standarddeutsch. Die Formulierung des eingeklammerten Teils ist jedoch wegen der verschachtelten Infinitivfügung nicht klar. Eine finite Satzkonstruktion mit „weder … noch“ ist idiomatisch und stellt den gemeinten logischen Zusammenhang eindeutig her.
  terminology: „Heil“, „Gleichnisse“ und „Gegenwärtiges oder Zukünftiges“ sind angemessen und bewahren die theologische beziehungsweise zeitliche Offenheit. „Meine Seele hofft“ wahrt die markierte Ausdrucksweise des Zeugen besser als „hoffe ich von Herzen“, ohne unmodern zu wirken.
  issues:
  - severity: medium
    issue: Die Negation beim eingeklammerten Satzteil ist unklar beziehungsweise missverständlich.
    rationale: In „hoffe ich … nichts ausgelassen zu haben [… und so mein Ziel verfehlt zu haben]“ steht „mein Ziel verfehlt zu haben“ formal nicht sicher im Bereich der Negation. Der Sinn des Zeugen verlangt, dass sowohl das Auslassen als auch das dadurch verursachte Verfehlen des Ziels verneint wird.
  - severity: low
    issue: „Von Herzen“ ersetzt die Bildlichkeit von „meine Seele hofft“.
    rationale: Die deutsche Wendung ist natürlich, gibt aber den im Zeugen ausdrücklich genannten personalen Ausdruck nicht mehr wieder. „Meine Seele hofft“ ist im würdevollen Register gut verständlich und quellennäher.
  revised_text: 'Soweit es mir möglich war, euch alles in aller Schlichtheit darzulegen, hofft meine Seele, dass ich weder etwas ausgelassen habe [von dem, was das Heil betrifft,] noch dadurch mein Ziel verfehlt habe.[a]


    Denn wenn ich euch über Gegenwärtiges oder Zukünftiges schreiben würde, würdet ihr es nicht verstehen, weil es in Gleichnissen dargestellt ist. So viel hierzu.'
  revised_footnotes:
  - marker: a
    text: Der eingeklammerte Satzteil ist in der zugrunde liegenden Edition als textlich unsicher beziehungsweise ergänzt gekennzeichnet.
    reason: Die eckigen Klammern des überlieferten englischen Textzeugen signalisieren eine Wiederherstellung oder Unsicherheit, die in der Übersetzung sichtbar bleiben muss.
  revision_rationale: 'Die Revision beseitigt die missverständliche Negationsführung, ohne den Sinn zu verändern: Der Verfasser hofft, weder in Heilsangelegenheiten etwas ausgelassen noch dadurch sein Ziel verfehlt zu haben. Die Klammern bleiben direkt am als unsicher oder ergänzt markierten Material erhalten. Zugleich wird „meine Seele hofft“ als im Deutschen verständliche, quellentreuere Wiedergabe beibehalten.'
