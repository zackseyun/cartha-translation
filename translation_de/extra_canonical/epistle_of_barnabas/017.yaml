    text: Der eingeklammerte Satzteil ist in der zugrunde liegenden Edition als textlich unsicher beziehungsweise ergänzt gekennzeichnet.
    reason: Die eckigen Klammern des überlieferten englischen Textzeugen signalisieren eine Wiederherstellung oder Unsicherheit, die in der Übersetzung sichtbar bleiben muss.
lexical_decisions:
- source_word: with all simplicity
  choice: in aller Schlichtheit
  rationale: Bewahrt den Gedanken einer offenen, ungekünstelten und verständlichen Darlegung, ohne ihn auf bloße sprachliche Einfachheit zu verengen.
- source_word: my soul hopeth
  choice: hoffe ich von Herzen
  rationale: Gibt die semitisch bzw. antik geprägte Wendung natürlich im modernen Deutschen wieder und erhält ihren persönlichen Nachdruck.
- source_word: matters pertaining unto salvation
  choice: was das Heil betrifft
  rationale: Bewahrt den theologischen Begriff des Heils, ohne eine konfessionell engere Deutung einzutragen.
- source_word: things immediate or future
  choice: Gegenwärtiges oder Zukünftiges
  rationale: Folgt dem bezeugten Gegensatz von gegenwärtigen und zukünftigen Dingen; die genaue Tragweite bleibt offen.
- source_word: parables
  choice: Gleichnissen
  rationale: Entspricht dem traditionellen und sachlich angemessenen Ausdruck für bildhafte oder verhüllte Darstellungen.
- source_word: So much then for this
  choice: So viel hierzu
  rationale: Natürlicher deutscher Abschnittsabschluss mit der knappen Funktion des Ausgangstextes.
theological_decisions:
- issue: Textlich unsicherer bzw. ergänzter Satzteil zum Heil und zum verfehlten Ziel
  choice: In eckigen Klammern beibehalten und mit Fußnote kennzeichnen
  alternative: Ohne Klammern in den Haupttext aufnehmen oder ganz auslassen
  rationale: Die vorhandene Überlieferungs- und Editionsunsicherheit darf nicht stillschweigend beseitigt werden.
- issue: Bedeutung von „Gegenwärtiges oder Zukünftiges“
  choice: Den zeitlichen Gegensatz wörtlich offenlassen
  alternative: Als gegenwärtige und kommende Heilsereignisse ausdeuten
  rationale: Eine nähere eschatologische oder heilsgeschichtliche Festlegung wäre aufgrund der bereitgestellten Quellengrundlage nicht hinreichend gesichert.
- issue: Art der Gleichnisse
  choice: Neutral als „in Gleichnissen dargestellt“ wiedergeben
  alternative: Als absichtlich verschlüsselte Geheimlehre verstehen
  rationale: Der Text erklärt die Verständnisschwierigkeit durch Gleichnisrede, legt aber keine bestimmte Geheimlehre fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist bewusst klar und knapp; antike Idiomatik wird dort natürlich übertragen, wo eine wörtliche Wiedergabe im Deutschen gekünstelt wäre. Da eine direkte Prüfung der griechischen und lateinischen Zeugen noch aussteht, bleibt der Entwurf hinsichtlich einzelner textkritischer und lexikalischer Fragen vorläufig.
