base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/017.yaml
  text: 'As far as I was able to explain everything to you simply, my soul hopes that I have not left out anything [about the matters relating to salvation and thus failed in my desire].


    For if I were to write to you about things present or future, you would not understand them, because they are expressed in parables. So much for this.'
translation:
  language: de
  text: 'Soweit es mir möglich war, euch alles in aller Schlichtheit darzulegen, hoffe ich von Herzen, nichts ausgelassen zu haben [von dem, was das Heil betrifft, und so mein Ziel verfehlt zu haben].[a]


    Denn wenn ich euch über Gegenwärtiges oder Zukünftiges schreiben würde, würdet ihr es nicht verstehen, weil es in Gleichnissen dargestellt ist. So viel hierzu.'
  philosophy: optimal-equivalence
  footnotes:
