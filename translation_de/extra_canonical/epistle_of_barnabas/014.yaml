    Darum sagt der Prophet: »Ich, der Herr, dein Gott, habe dich in Gerechtigkeit berufen. Ich werde deine Hand ergreifen und dich stärken. Ich habe dich zum Bund für das Menschengeschlecht[c] und zum Licht für die Völker gegeben, damit du die Augen der Blinden öffnest, die Gefesselten aus ihren Fesseln herausführst und die, die in der Finsternis sitzen, aus dem Gefängnis.« So erkennen wir, woher wir freigekauft wurden.


