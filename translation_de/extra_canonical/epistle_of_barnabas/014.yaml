lexical_decisions:
- source_word: covenant
  choice: Bund
  rationale: Die etablierte und zugleich allgemein verständliche deutsche Wiedergabe bewahrt den heilsgeschichtlichen und rechtlich-relationalen Gehalt.
- source_word: tables
  choice: Tafeln
  rationale: Im Zusammenhang mit Sinai ist »Tafeln« die natürliche deutsche Bezeichnung; »Gesetzestafeln« wäre erläuternd, steht hier aber nicht ausdrücklich.
- source_word: in the spirit
  choice: im Geist
  rationale: Die ungewöhnliche Formulierung wird bewusst formal bewahrt, statt sie als bloße Art und Weise des Schreibens auszudeuten.
- source_word: people of His inheritance
  choice: Volk seines Erbes
  rationale: Die Formulierung erhält das Erbmotiv des Textes; »Eigentumsvolk« wäre glatter, würde aber die Verbindung zum anschließenden Erben abschwächen.
- source_word: redeem / ransom
  choice: erlösen / freikaufen
  rationale: Je nach Satzumgebung werden natürliche deutsche Verben verwendet; »freikaufen« hält in den Rückverweisen das Lösegeldmotiv hörbar.
- source_word: race
  choice: Volk
  rationale: Im prophetischen Bundeszusammenhang ist »Volk« idiomatisch; die weitere Bedeutungsspanne wird in Fußnote [c] offengelegt.
- source_word: humble
  choice: Demütige
  rationale: Bewahrt die geistliche und soziale Offenheit des Ausdrucks; »Arme« würde die überlieferte Formulierung enger festlegen.
- source_word: acceptable year
  choice: willkommenes Jahr
  rationale: Bewahrt die Bedeutung von Annahme und Gunst, ohne den Ausdruck stillschweigend mit »Gnadenjahr« theologisch zu vereinheitlichen.
theological_decisions:
- issue: Wer den Bund gibt und geduldig ausharrt
  choice: Das Subjekt »der Herr« bleibt ohne zusätzliche christologische Erläuterung stehen.
  alternative: Den Herrn ausdrücklich als Jesus Christus identifizieren.
  rationale: Der folgende Absatz nennt Jesus, doch der vorliegende Satz sollte seine eigene pronominale und christologische Spannung behalten.
- issue: Vollendung in den Sünden
  choice: »das volle Maß ihrer Sünden erreichten« mit Fußnote
  alternative: »in ihren Sünden vollendet würden«
  rationale: Die Hauptfassung verhindert das Missverständnis sittlicher Vollkommenheit; die formalere und härtere Lesart bleibt in [b] sichtbar.
- issue: Der Herr Jesus als Erbe des Bundes
  choice: »der ihn erbte«
  alternative: »dem er gehörte« oder »der ihn vermittelte«
  rationale: Das Erbmotiv ist für die Argumentation dieses Abschnitts wesentlich und darf nicht in ein konfessionell vertrauteres Vermittlungsmodell umgedeutet werden.
- issue: Bund im Inneren
  choice: »den Bund in uns aufrichten«
  alternative: »mit uns schließen«
  rationale: »In uns« wird beibehalten, da der Text mehr als einen lediglich äußeren Vertrag ausdrückt, ohne die genaue Art der Verinnerlichung zu definieren.
- issue: Bezug der prophetischen Ich-Worte
  choice: Die Zitate bleiben in direkter Rede ohne redaktionelle Sprecherbenennung.
  alternative: Die Worte ausdrücklich Christus in den Mund legen.
  rationale: Der Barnabasbrief liest sie christologisch, doch die Übersetzung soll die im Zitat selbst vorhandene Sprecherstruktur nicht durch Zusätze vereindeutigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren Satzfolgen und leicht gehobenem Ton in den prophetischen Zitaten. Archaisierende Formen wurden vermieden. Da eine unmittelbare Prüfung der griechischen und lateinischen Zeugen noch aussteht, folgt der Entwurf vorsichtig dem bereitgestellten gemeinfreien englischen Textzeugen und kennzeichnet besonders relevante Unsicherheiten, ohne sie im Haupttext unnötig zu vervielfachen.
