  text: 'Yes, truly. But concerning the covenant that he swore to the fathers to give to the people, let us see whether he has actually given it. He has given it, but they themselves were not found worthy to receive it because of their sins.


    For the prophet says, “And Moses fasted on Mount Sinai for forty days and forty nights, so that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tablets, which were written by the finger of the Lord’s hand in the spirit.” And Moses took them and brought them down to give them to the people.


    And the Lord said to Moses, “Moses, Moses, go down quickly, for your people, whom you led out of the land of Egypt, have acted wickedly.” And Moses realized that they had again made cast-metal images for themselves, and he threw the tablets from his hands, and the tablets of the Lord’s covenant were shattered.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Notice this: Moses received them as a servant, but the Lord himself gave them to us to be the people of his inheritance, having patiently endured for our sakes.


    But he was revealed so that, at the same time, they might be brought to completion in their sins, and we might receive the covenant through him who inherited it, namely the Lord Jesus. He was prepared beforehand for this purpose, so that by appearing in person he might redeem from darkness our hearts, which had already been handed over to death and delivered up to the iniquity of error, and so establish the covenant in us through the word.


    For it is written how the Father commands him to deliver us from darkness and to prepare a holy people for himself.


    Therefore the prophet says, “I, the Lord your God, called you in righteousness. I will take hold of your hand and strengthen you. I have given you as a covenant for the race, a light to the Gentiles, to open the eyes of the blind, to bring those who are bound out from their chains, and those who sit in darkness out from their prison house.” We understand, then, from where we were ransomed.


    Again the prophet says, “Behold, I have appointed you as a light to the Gentiles, that you should be for salvation to the ends of the earth.” Thus says the Lord who ransomed you, namely God.


    Again the prophet says, “The Spirit of the Lord is upon me; therefore he anointed me to proclaim good news to the humble. He has sent me to heal the brokenhearted, to proclaim release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of repayment, and to comfort all who mourn.”'
translation:
  language: de
  text: '## Barnabasbrief 14


    Ja, gewiss. Was aber den Bund betrifft, den er den Vätern mit einem Eid zugesagt hatte, um ihn dem Volk zu geben, wollen wir sehen, ob er ihn tatsächlich gegeben hat. Er hat ihn gegeben; doch sie selbst wurden wegen ihrer Sünden nicht für würdig befunden, ihn zu empfangen.


    Denn der Prophet sagt: »Mose fastete vierzig Tage und vierzig Nächte auf dem Berg Sinai, damit er den Bund des Herrn empfinge und ihn dem Volk gäbe. Und [Mose][a] empfing vom Herrn die beiden Tafeln, die im Geist vom Finger der Hand des Herrn beschrieben worden waren.« Mose nahm sie und brachte sie hinab, um sie dem Volk zu geben.


    Und der Herr sagte zu Mose: »Mose, Mose, steig schnell hinab! Denn dein Volk, das du aus dem Land Ägypten herausgeführt hast, hat böse gehandelt.« Da erkannte Mose, dass sie sich erneut gegossene Bilder gemacht hatten. Er warf die Tafeln aus seinen Händen, und die Tafeln des Bundes des Herrn zerbrachen.


    Mose empfing sie, doch sie selbst wurden nicht für würdig befunden. Wie aber haben wir sie empfangen? Achtet darauf: Mose empfing sie als Diener; der Herr selbst aber gab sie uns, damit wir das Volk seines Erbes seien, nachdem er unseretwegen geduldig ausgeharrt hatte.


    Er wurde aber offenbar, damit zugleich sie das volle Maß ihrer Sünden erreichten[b] und wir den Bund durch den empfingen, der ihn erbte, nämlich den Herrn Jesus. Er war schon im Voraus dazu bestimmt, persönlich zu erscheinen und unsere Herzen aus der Finsternis zu erlösen. Sie waren bereits dem Tod übereignet und der Ungerechtigkeit des Irrtums ausgeliefert. So sollte er durch das Wort den Bund in uns aufrichten.


    Denn es steht geschrieben, wie der Vater ihm aufträgt, uns aus der Finsternis zu befreien und sich ein heiliges Volk zu bereiten.


    Darum sagt der Prophet: »Ich, der Herr, dein Gott, habe dich in Gerechtigkeit berufen. Ich werde deine Hand ergreifen und dich stärken. Ich habe dich zum Bund für das Volk[c] und zum Licht für die Völker gegeben, damit du die Augen der Blinden öffnest, die Gefesselten aus ihren Fesseln herausführst und die, die in der Finsternis sitzen, aus dem Gefängnis.« So erkennen wir, woraus wir freigekauft wurden.


    Wiederum sagt der Prophet: »Siehe, ich habe dich zum Licht für die Völker bestimmt, damit du zum Heil seist bis an die Enden der Erde.« So spricht der Herr, der dich freigekauft hat, nämlich Gott.


    Wiederum sagt der Prophet: »Der Geist des Herrn ist auf mir; deshalb hat er mich gesalbt, den Demütigen gute Nachricht zu verkünden. Er hat mich gesandt, die zu heilen, deren Herz zerbrochen ist, den Gefangenen Freilassung und den Blinden die Wiedererlangung des Augenlichts zu verkünden, das willkommene Jahr des Herrn und den Tag der Vergeltung auszurufen und alle Trauernden zu trösten.«


    [a] Der Name ist im zugrunde gelegten Textzeugen als ergänzte Verdeutlichung gekennzeichnet.


    [b] Wörtlich kann die Wendung auch als »in ihren Sünden vollendet würden« wiedergegeben werden. Gemeint ist hier nicht sittliche Vollkommenheit, sondern das Erreichen eines vollen Maßes.


    [c] Das hier mit »Volk« wiedergegebene Wort kann auch »Geschlecht« oder »Menschengeschlecht« bedeuten.'
