base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/015.yaml
  text: 'Moreover, concerning the Sabbath, it is likewise written in the Ten Words, which he spoke to Moses face to face on Mount Sinai: “You shall make holy the Sabbath of the Lord with pure hands and a pure heart.”


    And in another place he says, “If my sons observe the Sabbath, then I will bestow my mercy upon them.”


    He speaks of the Sabbath at the beginning of creation: “And God made the works of his hands in six days, and he finished on the seventh day, rested on it, and made it holy.”


    Pay attention, children, to what this means: “He finished in six days.” He means that in six thousand years the Lord will bring all things to an end, for with him a day signifies a thousand years. He himself testifies to me about this, saying, “Behold, the day of the Lord will be as a thousand years.” Therefore, children, in six days—that is, in six thousand years—everything will come to an end.


    “And he rested on the seventh day.” This is what he means: when his Son comes and abolishes the time of the Lawless One, judges the ungodly, and changes the sun, the moon, and the stars, then he will truly rest on the seventh day.


    Yes, and furthermore he says, “You shall make it holy with pure hands and a pure heart.” Therefore, if anyone is now able to make holy the day that God made holy, even though he is pure in heart, we have gone completely astray.


    But if it is only afterward, and not until then, that we will truly rest and make it holy—when we ourselves are able to do so after being justified and receiving the promise, when iniquity is no more and all things have been made new by the Lord—then we will be able to make it holy, because we ourselves will first have been made holy.


    Finally, he says to them, “Your new moons and your Sabbaths I cannot endure.” You see what he means: it is not your present Sabbaths that are acceptable [to me], but the Sabbath that I have made. On that Sabbath, when I have brought all things to rest, I will make the beginning of the eighth day, which is the beginning of another world.


    Therefore, we also keep the eighth day for rejoicing, on which Jesus also rose from the dead and, after being revealed, ascended into the heavens.'
translation:
  language: de
  text: '**Barnabas 15**


    Ferner steht auch über den Sabbat in den Zehn Worten, die er auf dem Berg Sinai von Angesicht zu Angesicht zu Mose sprach, geschrieben: »Ihr sollt den Sabbat des Herrn mit reinen Händen und reinem Herzen heiligen.«[a]


    Und an einer anderen Stelle sagt er: »Wenn meine Söhne den Sabbat halten, werde ich ihnen mein Erbarmen schenken.«[b]


    Vom Sabbat spricht er am Anfang der Schöpfung: »Und Gott vollbrachte die Werke seiner Hände in sechs Tagen; am siebten Tag vollendete er sie, ruhte an ihm und heiligte ihn.«[c]


    Achtet darauf, Kinder, was die Worte bedeuten: »Er vollendete sie in sechs Tagen.« Gemeint ist, dass der Herr in sechstausend Jahren alles zur Vollendung führen wird; denn bei ihm bedeutet ein Tag tausend Jahre. Er selbst bezeugt mir dies mit den Worten: »Siehe, ein Tag des Herrn wird wie tausend Jahre sein.«[d] Somit, Kinder, wird in sechs Tagen, das heißt in sechstausend Jahren, alles zur Vollendung kommen.


    »Und er ruhte am siebten Tag.« Das bedeutet: Wenn sein Sohn kommt, die Zeit des Gesetzlosen beendet, die Gottlosen richtet und Sonne, Mond und Sterne verwandelt, dann wird er am siebten Tag wahrhaft ruhen.


    Weiter sagt er: »Du sollst ihn mit reinen Händen und reinem Herzen heiligen.« Wenn also jetzt jemand den Tag, den Gott geheiligt hat, heiligen kann – selbst wenn er reinen Herzens ist –, dann haben wir uns völlig geirrt.[e]


    Doch erst später, und nicht vorher, werden wir wahrhaft ruhen und ihn heiligen: wenn wir dazu imstande sind, nachdem wir gerechtfertigt worden sind und die Verheißung empfangen haben, wenn es kein Unrecht mehr gibt und der Herr alles neu gemacht hat. Dann werden wir ihn heiligen können, weil wir selbst zuvor geheiligt worden sind.


    Schließlich sagt er zu ihnen: »Eure Neumonde und eure Sabbate kann ich nicht ertragen.«[f] Ihr seht, was er meint: Nicht eure gegenwärtigen Sabbate sind mir willkommen, sondern der Sabbat, den ich gemacht habe. An ihm werde ich, nachdem ich alles zur Ruhe gebracht habe, den Anfang des achten Tages schaffen; dieser ist der Anfang einer anderen Welt.[g]


    Darum begehen auch wir den achten Tag mit Freude, an dem auch Jesus von den Toten auferstand und, nachdem er sich gezeigt hatte, in die Himmel auffuhr.[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung verbindet Motive aus 2. Mose 20,8; 31,13–17 und 5. Mose 5,12 mit der Forderung nach reinen Händen und reinem Herzen; sie ist kein wörtliches Zitat des überlieferten Dekalogs.
    reason: Kennzeichnet ein zusammengesetztes beziehungsweise frei wiedergegebenes Schriftzitat.
  - marker: b
    text: Die genaue Schriftstelle dieser freien Anführung ist unsicher; möglicherweise klingt Jeremia 17,24–27 an.
    reason: Bewahrt die Unsicherheit der Zitatquelle.
  - marker: c
    text: Vgl. 1. Mose 2,2–3. Der Wortlaut folgt einer alten Textform, nach der Gott am siebten Tag vollendete.
    reason: Erläutert die alttestamentliche Bezugnahme und eine relevante Textvariante.
  - marker: d
    text: Vgl. Psalm 90,4 und 2. Petrus 3,8. Der hier zitierte Wortlaut entspricht keiner dieser Stellen genau.
    reason: Zeigt die Schriftgrundlage der Tausendjahrdeutung, ohne eine exakte Herkunft vorzutäuschen.
  - marker: e
    text: 'Der Satz ist argumentativ schwierig. Gemeint scheint zu sein: Wer den von Gott geheiligten Tag schon jetzt wirklich heiligen könnte, würde die hier vertretene zukünftige Erfüllung des Sabbats widerlegen.'
    reason: Macht eine echte Verständnisschwierigkeit transparent, ohne sie im Haupttext aufzulösen.
  - marker: f
    text: Vgl. Jesaja 1,13–14.
    reason: Identifiziert das Schriftzitat.
  - marker: g
    text: Der »achte Tag« bezeichnet hier den Tag nach dem siebten und zugleich den Anfang der erneuerten Welt.
    reason: Erklärt die typologische Zählung, die für moderne Leser ungewohnt sein kann.
  - marker: h
    text: Mit dem »achten Tag« ist der erste Tag einer neuen Woche gemeint, der Tag der Auferstehung Jesu. »In die Himmel« gibt die alte Mehrzahl wörtlich wieder.
    reason: Erläutert den frühchristlichen Sprachgebrauch und bewahrt die kosmologische Ausdrucksweise.
lexical_decisions:
- source_word: δέκα λόγοι / Ten Words
  choice: Zehn Worte
  rationale: Bewahrt die alte Bezeichnung für den Dekalog, statt sie interpretierend durch »Zehn Gebote« zu ersetzen.
- source_word: σαββάτον / Sabbath
  choice: Sabbat
  rationale: Der etablierte deutsche Fach- und Bibelbegriff erhält die argumentative Verbindung zwischen Schöpfung, siebtem Tag und achtem Tag.
- source_word: ἁγιάζω / hallow
  choice: heiligen
  rationale: Gibt die wiederholte Wortverbindung zwischen dem Heiligen des Tages und dem Geheiligtwerden der Menschen erkennbar wieder.
- source_word: συντελέω / bring to an end, finish
  choice: zur Vollendung führen / zur Vollendung kommen
  rationale: Erhält sowohl den zeitlichen Abschluss als auch den Gedanken der Vollendung, ohne bloße Vernichtung nahezulegen.
- source_word: ὁ ἄνομος / the Lawless One
  choice: der Gesetzlose
  rationale: Bewahrt die personale und eschatologische Form der Bezeichnung, ohne die Gestalt mit einer bestimmten dogmatischen Identifikation gleichzusetzen.
- source_word: ὀγδόη ἡμέρα / eighth day
  choice: achter Tag
  rationale: Bewahrt die frühchristliche typologische Bezeichnung und ihren Gegensatz zum siebten Tag.
- source_word: κόσμος / world
  choice: Welt
  rationale: »Andere Welt« bleibt nah am überlieferten Wortlaut und löst die Aussage nicht vorschnell in »Zeitalter« oder »Schöpfung« auf.
theological_decisions:
- issue: Sechs Schöpfungstage als sechstausend Jahre
  choice: Als ausdrückliche Deutung des Barnabasbriefs wiedergegeben
  alternative: Die Zahlen symbolisch abschwächen oder als bloßen Vergleich formulieren
  rationale: Der Abschnitt behauptet die Gleichsetzung ausdrücklich; die Übersetzung soll diese eschatologische Auffassung weder bestätigen noch verdecken.
- issue: Wer am siebten Tag ruhen wird
  choice: Das Pronomen »er« bleibt stehen
  alternative: Explizit »der Sohn« oder »Gott« einsetzen
  rationale: Der überlieferte Gedankengang lässt den Bezug formal beim männlichen Subjekt; eine Präzisierung würde die mögliche Spannung zwischen Vater und Sohn beseitigen.
- issue: Gegenwärtige Heiligung des Sabbats
  choice: Die zugespitzte Folgerung »dann haben wir uns völlig geirrt« bleibt erhalten
  alternative: Zu einer glatteren rhetorischen Frage umformen
  rationale: 'Die schwierige Argumentation des Autors wird nicht harmonisiert: Vollständige Sabbatheiligung wird an die zukünftige Rechtfertigung und Erneuerung gebunden.'
- issue: Rechtfertigung und Heiligung
  choice: »gerechtfertigt« und »geheiligt« werden terminologisch unterschieden
  alternative: Beides allgemein mit »rein gemacht« wiedergeben
  rationale: Die unterschiedlichen theologischen Begriffe und ihre Reihenfolge sollen sichtbar bleiben, ohne ein späteres konfessionelles System einzutragen.
- issue: Der achte Tag
  choice: Als Anfang »einer anderen Welt« wiedergegeben
  alternative: »des kommenden Zeitalters«
  rationale: Die konkretere Aussage des Zeugen bleibt erhalten; eine eschatologische Deutung wird nicht in den Haupttext hineinformuliert.
- issue: Jesu Himmelfahrt nach seinem Sichzeigen
  choice: »nachdem er sich gezeigt hatte«
  alternative: »nachdem er offenbar geworden war«
  rationale: Die Formulierung bleibt offen dafür, ob die Erscheinungen nach der Auferstehung oder ein umfassenderes Offenbarwerden gemeint sind, klingt aber in modernem Deutsch natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Absatzgliederung. Die Anrede »Kinder« und die wiederholten Schriftformeln bleiben erhalten. Archaismen werden vermieden, zentrale Wiederholungen wie »heiligen«, »ruhen«, »siebter Tag« und »achter Tag« jedoch bewusst bewahrt. Da laut Metadaten eine direkte Prüfung des griechisch-lateinischen Quellenbestands noch aussteht, kennzeichnen die Fußnoten unsichere Zitate und schwierige Stellen besonders zurückhaltend.
