review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist nötig: Der griechische Text von Barn 18,1 unterscheidet im Schlusssatz κύριος („der Herr“) von ἄρχων („Herrscher, Machthaber“). Die englische Zeugenfassung nivelliert diese Unterscheidung mit zweimal „Lord“. Außerdem entspricht γνῶσις zunächst „Erkenntnis“ und nicht „Unterweisung“; ἀνομία ist präziser „Gesetzlosigkeit“ als „Ungerechtigkeit“.'
  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. „Einer des Lichts und einer der Finsternis“ löst die im Entwurf etwas sperrige Akkusativellipse, und „sind ... postiert“ gibt τεταγμένοι idiomatisch wieder.
  terminology: „Erkenntnis und Lehre“ bewahrt die zwei Begriffe γνῶσις und διδαχή. „Macht“ für ἐξουσία lässt die knappe Vorlage offen. „Herrscher“ für ἄρχων wahrt die beabsichtigte und theologisch bedeutsame Unterscheidung zum ersten „Herrn“, ohne sie weiter auszudeuten. „Gesetzlosigkeit“ gibt ἀνομία unmittelbar wieder.
  issues:
  - severity: high
    issue: Der zweite Titel wird ebenfalls mit „Herr“ wiedergegeben.
    rationale: Der griechische Wortlaut hat hier ἄρχων, nicht κύριος. „Herrscher“ muss verwendet werden, damit die Differenz zur Bezeichnung Gottes als „der Herr“ erhalten bleibt.
  - severity: medium
    issue: „Unterweisung“ gibt den ersten Begriff der Eröffnung nicht präzise wieder.
    rationale: Der zugrunde liegende griechische Ausdruck γνῶσις bedeutet „Erkenntnis“ bzw. „Wissen“; „Unterweisung“ liegt dem nachfolgenden διδαχή näher.
  - severity: medium
    issue: „Ungerechtigkeit“ ist für ἀνομία zu allgemein.
    rationale: ἀνομία bezeichnet Gesetzlosigkeit; die präzisere Wiedergabe soll die Vorlage nicht moralisch verallgemeinern.
  revised_text: 'Lasst uns nun zu einer anderen Erkenntnis und Lehre übergehen. Es gibt zwei Wege der Lehre und der Macht: einen des Lichts und einen der Finsternis. Zwischen den beiden Wegen besteht ein großer Unterschied. Denn auf dem einen sind die lichtbringenden Engel Gottes postiert, auf dem anderen die Engel Satans.


    Der eine ist der Herr von Ewigkeit zu Ewigkeit, der andere aber ist Herrscher der gegenwärtigen Zeit der Gesetzlosigkeit.[a]'
  revised_footnotes:
  - marker: a
    text: Die Übersetzung dieses Kapitels ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung der griechischen und lateinischen Überlieferung steht noch aus.
    reason: Die bereitgestellte Quellenlage kennzeichnet die direkte Prüfung der alten Sprachzeugen ausdrücklich als ausstehend.
  revision_rationale: 'Die Revision stellt die im griechischen Wortlaut vorhandenen lexikalischen Unterscheidungen wieder her, die die englische Brückenfassung teilweise verdeckt: γνῶσις/διδαχή („Erkenntnis und Lehre“), κύριος/ἄρχων („der Herr“/„Herrscher“) und ἀνομία („Gesetzlosigkeit“). Die Fußnote bleibt als notwendiger Hinweis auf den vorläufigen Status der bereitgestellten Zeugenbasis bestehen.'
