base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/018.yaml
  text: 'But let us move on to another lesson and teaching. There are two ways of teaching and power: one of light and the other of darkness. There is a great difference between the two ways. For on one are stationed God’s light-giving angels, and on the other, Satan’s angels.


    The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity.'
translation:
  language: de
  text: 'Lasst uns nun zu einer anderen Unterweisung und Lehre übergehen. Es gibt zwei Wege der Lehre und der Macht: den einen des Lichts und den anderen der Finsternis. Zwischen den beiden Wegen besteht ein großer Unterschied. Denn auf dem einen stehen die lichtbringenden Engel Gottes, auf dem anderen die Engel Satans.


    Und der eine ist der Herr von Ewigkeit zu Ewigkeit, der andere aber ist Herr über die gegenwärtige Zeit der Ungerechtigkeit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung dieses Kapitels ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung der griechischen und lateinischen Überlieferung steht noch aus.
    reason: Die bereitgestellte Quellenlage kennzeichnet die direkte Prüfung der alten Sprachzeugen ausdrücklich als ausstehend.
lexical_decisions:
- source_word: lesson and teaching
  choice: Unterweisung und Lehre
  rationale: Bewahrt die doppelte Ausdrucksweise des vorliegenden Zeugen, ohne beide Begriffe vorschnell gleichzusetzen.
- source_word: two ways of teaching and of power
  choice: zwei Wege der Lehre und der Macht
  rationale: Gibt die syntaktische Zuordnung des englischen Zeugen möglichst offen wieder; eine direkte Prüfung des Griechischen und Lateinischen steht noch aus.
- source_word: light giving angels
  choice: lichtbringenden Engel
  rationale: Bildhafte und natürliche deutsche Wiedergabe, die den aktiven Sinn des Ausdrucks erhält.
- source_word: season of iniquity that now is
  choice: gegenwärtige Zeit der Ungerechtigkeit
  rationale: Gibt sowohl den zeitlichen als auch den moralischen Gehalt wieder, ohne die Art oder Dauer dieser Zeit näher zu bestimmen.
theological_decisions:
- issue: Bezeichnung beider Gestalten als „Herr“
  choice: „der eine ist der Herr …, der andere aber ist Herr über …“
  alternative: Den zweiten Titel abschwächen, etwa zu „herrscht über“ oder in Anführungszeichen setzen
  rationale: Die Spannung des Zeugen wird erhalten. Der bestimmte Artikel beim ersten und die begrenzte Herrschaftssphäre beim zweiten unterscheiden beide, ohne die Aussage konfessionell auszudeuten.
- issue: Reichweite der Herrschaft Satans
  choice: „Herr über die gegenwärtige Zeit der Ungerechtigkeit“
  alternative: „Herr der gegenwärtigen bösen Weltzeit“
  rationale: Die zeitlich begrenzte Zuordnung bleibt ausdrücklich bestehen; „Weltzeit“ wäre eine mögliche, aber stärker interpretierende Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der traditionsprägende Ausdruck „zwei Wege“ sowie die Parallelität von Licht und Finsternis wurden bewahrt. Die auffällige Wiederholung von „Herr“ bleibt stehen, während Artikelgebrauch und zeitliche Begrenzung die im Zeugen vorhandene Unterscheidung sichtbar machen.
