review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem vorliegenden englischen Zeugnis insgesamt eng und bewahrt dessen auffällige Lesarten. Einige Umformulierungen verschieben jedoch Nuancen: »who is about to be revealed« ist futurisch wiederzugeben; »the last things as the first« verlangt eher »die letzten Dinge zu den ersten« als einen Vergleich; und »künftige Welt« ist enger als das offene »hereafter«.'
  naturalness: 'Modernes, gut lesbares Standarddeutsch. Einzelne Formulierungen sind unnötig schwer oder weniger präzise: »zu einer neuen Gestalt« klingt verdinglichend; »in Kraft gefestigt« ist tautologisch. Die wiederholte inklusive Erweiterung »Brüder und Schwestern« ist möglich, doch die Fußnote erklärt zutreffend die wörtliche Anrede.'
  terminology: Die Schlüsselbegriffe sind im Wesentlichen konsistent. »Haupteckstein«, »Gerechter«, »Vergebung der Sünden«, »Herzen aus Fleisch« und »Bund« sind angemessen. »Brüder« sollte im Haupttext stehen bleiben, da die Anrede im Zeugnis ausdrücklich männlich formuliert ist; eine erläuternde Fußnote kann die gemeinschaftliche Reichweite benennen.
  issues:
  - severity: medium
    issue: Futurische Offenbarung Jesu abgeschwächt
    rationale: »der euch im Fleisch offenbart werden soll« ist zwar möglich, aber »who is about to be revealed to you« bezeichnet das bevorstehende Offenbarwerden klarer. »der euch im Fleisch offenbart werden wird« bewahrt die Zukunft und die Rezeptionsrichtung.
  - severity: medium
    issue: »die letzten Dinge wie die ersten« gibt die auffällige Präposition nicht genau wieder
    rationale: Das Zeugnis lautet »I make the last things as the first«, entsprechend der überlieferten Schriftanlehnung. »die letzten Dinge zu den ersten« bewahrt den transformierenden Sinn besser als ein bloßer Vergleich mit »wie«.
  - severity: low
    issue: »künftige Welt« legt »hereafter« zu konkret aus
    rationale: Das Ausgangszeugnis benennt offen ein künftiges Danach, nicht ausdrücklich eine »Welt«. »für die Zukunft« bzw. »im Blick auf das Kommende« ist semantisch offener.
  - severity: low
    issue: Inklusive Erweiterung der direkten Anrede
    rationale: »Brüder und Schwestern« ist als funktionale Wiedergabe vertretbar, ergänzt aber den Wortlaut. Für eine quellennahe Übersetzung sollte im Text »Brüder« stehen und die mögliche inklusive Gemeindeadresse in der Fußnote erläutert werden.
  - severity: low
    issue: »neue Gestalt« ist für »new type« weniger klar
    rationale: »zu einer neuen Art« gibt den Gedanken einer neu geschaffenen menschlichen Beschaffenheit natürlicher wieder, ohne den technischen Begriff »Typus« einzuführen.
  revised_text: 'Als er nun das Gebot gab, was sagt er da? »Wer ist es, der mit mir streitet? Er soll sich mir entgegenstellen. Oder wer ist es, der mit mir einen Rechtsstreit führt? Er soll sich dem Diener des Herrn nähern.


    Wehe euch! Denn ihr alle werdet alt werden wie ein Kleid, und die Motte wird euch verzehren.« Und wiederum sagt der Prophet, da er wie ein harter Stein zum Zermalmen bestimmt worden war: »Siehe, ich lege in die Quellen Zions[a] einen überaus kostbaren, auserwählten, geehrten Haupteckstein.«


    Was sagt er dann wiederum? »Und wer seine Hoffnung auf ihn setzt, wird ewig leben.« Setzen wir unsere Hoffnung also auf einen Stein? Keineswegs! Vielmehr geht es darum, dass der Herr sein Fleisch in Stärke gefestigt hat. Denn er sagt: »Und er machte mich zu einem harten Felsen.«


    Und wiederum sagt der Prophet: »Der Stein, den die Bauleute verworfen haben, der ist zum Haupt der Ecke geworden.« Und wieder sagt er: »Dies ist der große und wunderbare Tag, den der Herr gemacht hat.«


    Ich schreibe euch in einfacherer Weise, damit ihr versteht – ich, der ich der Abschaum eurer Liebe bin.[b]


    Was sagt nun der Prophet wiederum? »Die Versammlung der Übeltäter scharte sich um mich; sie umringten mich, wie Bienen eine Honigwabe umringen«; und: »Um mein Gewand warfen sie das Los.«


    Da er nun im Fleisch offenbart werden und leiden sollte, wurde sein Leiden im Voraus offenbart. Denn der Prophet sagt über Israel: »Wehe ihrer Seele! Denn sie haben einen bösen Plan gegen sich selbst gefasst und gesagt: ›Lasst uns den Gerechten binden, denn er ist uns zu nichts nütze.‹«


    Was sagt ihnen der andere Prophet, Mose? »Siehe, so spricht der Herr, Gott: Zieht in das gute Land, das der Herr Abraham, Isaak und Jakob zugeschworen hat, und nehmt es in Besitz – ein Land, in dem Milch und Honig fließen.«


    Was aber sagt die Erkenntnis? Versteht: Setzt eure Hoffnung auf den, der euch im Fleisch offenbart werden wird, nämlich Jesus. Denn der Mensch ist leidende Erde,[c] weil Adam aus dem Angesicht der Erde geschaffen wurde.


    Was sagt er nun? »In das gute Land, ein Land, in dem Milch und Honig fließen.« Gepriesen sei unser Herr, Brüder,[d] der unter uns Weisheit und Verständnis für seine verborgenen Dinge begründet hat. Denn der Prophet spricht in einem Gleichnis über den Herrn. Wer wird es begreifen außer dem, der weise und verständig ist und seinen Herrn liebt?


    Da er uns nun durch die Vergebung der Sünden erneuert hat, machte er uns zu einer neuen Art, sodass wir die Seele von Kindern haben sollten, als erschaffe er uns von Neuem.


    Denn die Schrift spricht über uns, wenn er zum Sohn sagt: »Lasst uns den Menschen nach unserem Bild und nach unserer Ähnlichkeit machen, und sie sollen über die Tiere der Erde, die Vögel des Himmels und die Fische des Meeres herrschen.« Und als der Herr die schöne Schöpfung von uns Menschen sah, sagte er: »Wachst und vermehrt euch und füllt die Erde.« Diese Worte beziehen sich auf den Sohn.


    Wiederum will ich dir zeigen, wie der Herr über uns spricht. Am Ende schuf er eine zweite Schöpfung, und der Herr sagt: »Siehe, ich mache die letzten Dinge zu den ersten.« Darauf bezogen verkündete der Prophet: »Zieht in ein Land, in dem Milch und Honig fließen, und herrscht darüber.«


    Siehe also: Wir sind neu geschaffen worden, wie er wiederum durch einen anderen Propheten sagt: »Siehe, spricht der Herr, ich werde aus diesen« – das heißt aus denen, die der Geist des Herrn vorausgesehen hat – »ihre steinernen Herzen herausnehmen und ihnen Herzen aus Fleisch geben«; denn er selbst sollte im Fleisch offenbart werden und in uns wohnen.


    Denn die Wohnstätte unseres Herzens ist ein heiliger Tempel für den Herrn, meine Brüder.[d]


    Denn wiederum sagt der Herr: »Womit soll ich vor dem Herrn, meinem Gott, erscheinen und verherrlicht werden? Ich will dich in der Versammlung meiner Brüder bekennen und dir inmitten der Versammlung der Heiligen singen.« Wir also sind diejenigen, die er in das gute Land gebracht hat.


    Was sind nun die Milch und der Honig? Das Kind wird zuerst durch Honig, dann durch Milch am Leben erhalten. Ebenso werden auch wir durch unseren Glauben an die Verheißung und durch das Wort am Leben erhalten werden; wir werden leben und über die Erde herrschen.


    Oben haben wir bereits gesagt: »Und sie sollen wachsen und sich vermehren und über die Fische herrschen.« Doch wer kann [jetzt][e] über Tiere, Fische und Vögel des Himmels herrschen? Denn wir müssen erkennen: Herrschen bedeutet Macht, sodass jemand Befehle erteilt und Herrschaft ausübt.


    Wenn dies also jetzt nicht geschieht, hat er gewiss zu uns im Blick auf das Kommende gesprochen, wenn wir selbst vollendet werden, sodass wir Erben des Bundes des Herrn werden können.'
