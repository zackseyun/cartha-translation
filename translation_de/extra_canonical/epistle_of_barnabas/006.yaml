  text: 'When, then, he gave the commandment, what does he say? “Who is it who disputes with me? Let him oppose me. Or who is it who goes to court with me? Let him draw near to the servant of the Lord.


    Woe to you, for you will all grow old like a garment, and the moth will consume you.” And again the prophet says, since he was appointed like a hard stone for crushing: “Behold, I will place in the fountains of Zion a very precious, chosen, honored chief cornerstone.”


    Then again, what does he say? “And whoever sets his hope on him will live forever.” Is our hope, then, set on a stone? Far from it! Rather, it is because the Lord has established his flesh in strength. For he says, “And he set me like a hard rock.”


    And the prophet says again, “The stone that the builders rejected has become the head and the corner.” And again he says, “This is the great and wonderful day that the Lord made.”


    I am writing to you more simply so that you may understand—I who am the scum of your love.


    What, then, does the prophet say again? “The assembly of evildoers gathered around me; they surrounded me as bees surround a honeycomb”; and, “They cast lots for my garment.”


    Since, then, he was about to be revealed in the flesh and to suffer, his suffering was revealed beforehand. For the prophet says concerning Israel, “Woe to their soul, for they have devised an evil plan against themselves, saying, ‘Let us bind the righteous one, for he is of no use to us.’”


    What does the other prophet, Moses, say to them? “Behold, this is what the Lord God says: Enter the good land that the Lord swore to Abraham, Isaac, and Jacob, and inherit it—a land flowing with milk and honey.”


    But what does knowledge say? Understand: Set your hope on him who is about to be revealed to you in the flesh, namely Jesus. For a human is suffering earth, since Adam’s creation came from the face of the earth.


    What, then, does he say? “Into the good land, a land flowing with milk and honey.” Blessed is our Lord, brothers, who established among us wisdom and understanding of his secret things. For the prophet speaks a parable concerning the Lord. Who will understand it except one who is wise and prudent and loves his Lord?


    Since, then, he renewed us through the forgiveness of sins, he made us into a new type, so that we would have the soul of children, as though he were creating us again.


    For Scripture speaks concerning us when he says to the Son, “Let us make humanity according to our image and according to our likeness, and let them rule over the beasts of the earth, the birds of heaven, and the fish of the sea.” And when the Lord saw the beautiful creation of us humans, he said, “Increase and multiply and fill the earth.” These words refer to the Son.


    Again I will show you how the Lord speaks concerning us. He made a second creation at the end, and the Lord says, “Behold, I make the last things like the first.” Referring to this, then, the prophet proclaimed, “Enter a land flowing with milk and honey, and be lords over it.”


    Behold, then, we have been created anew, as he says again in another prophet: “Behold, says the Lord, I will take from these”—that is, from those whom the Spirit of the Lord foresaw—“their stony hearts, and I will put hearts of flesh into them,” for he himself was to be revealed in the flesh and to dwell in us.


    For the dwelling place of our heart is a holy temple to the Lord, my brothers.


    For the Lord says again, “With what shall I appear before the Lord my God and be glorified? I will confess you in the assembly of my brothers, and I will sing to you in the midst of the assembly of the saints.” We, therefore, are those whom he brought into the good land.


    What, then, are the milk and the honey? The child is first kept alive by honey and then by milk. In the same way, we also, being kept alive by our faith in the promise and by the word, will live and be lords of the earth.


    Now we have already said above, “And let them increase and multiply and rule over the fish.” But who is able [now] to rule over beasts, fish, and birds of heaven? For we ought to understand that ruling implies power, so that one gives orders and exercises dominion.


    If, then, this does not happen now, surely he spoke to us about the hereafter, when we ourselves will be made perfect so that we may become heirs of the Lord’s covenant.'
translation:
  language: de
  text: 'Als er nun das Gebot gab, was sagt er da? »Wer ist es, der mit mir streitet? Er soll sich mir entgegenstellen. Oder wer ist es, der mit mir einen Rechtsstreit führt? Er soll sich dem Diener des Herrn nähern.


    Wehe euch! Denn ihr alle werdet alt werden wie ein Kleid, und die Motte wird euch verzehren.« Und wiederum sagt der Prophet, da er wie ein harter Stein zum Zermalmen bestimmt worden war: »Siehe, ich lege in die Quellen Zions[a] einen überaus kostbaren, auserwählten, geehrten Haupteckstein.«


    Was sagt er dann wiederum? »Und wer seine Hoffnung auf ihn setzt, wird ewig leben.« Setzen wir unsere Hoffnung also auf einen Stein? Keineswegs! Vielmehr geht es darum, dass der Herr sein Fleisch in Kraft gefestigt hat. Denn er sagt: »Und er machte mich zu einem harten Felsen.«


    Und wiederum sagt der Prophet: »Der Stein, den die Bauleute verworfen haben, der ist zum Haupt der Ecke geworden.« Und wieder sagt er: »Dies ist der große und wunderbare Tag, den der Herr gemacht hat.«


    Ich schreibe euch in einfacherer Weise, damit ihr versteht – ich, der ich der Abschaum eurer Liebe bin.[b]


    Was sagt nun der Prophet wiederum? »Die Versammlung der Übeltäter scharte sich um mich; sie umringten mich, wie Bienen eine Honigwabe umringen«; und: »Um mein Gewand warfen sie das Los.«


    Da er nun im Fleisch offenbart werden und leiden sollte, wurde sein Leiden im Voraus offenbart. Denn der Prophet sagt über Israel: »Wehe ihrer Seele! Denn sie haben einen bösen Plan gegen sich selbst gefasst und gesagt: ›Lasst uns den Gerechten binden, denn er ist uns zu nichts nütze.‹«


    Was sagt ihnen der andere Prophet, Mose? »Siehe, so spricht der Herr, Gott: Zieht in das gute Land, das der Herr Abraham, Isaak und Jakob zugeschworen hat, und nehmt es in Besitz – ein Land, in dem Milch und Honig fließen.«


    Was aber sagt die Erkenntnis? Versteht: Setzt eure Hoffnung auf den, der euch im Fleisch offenbart werden soll, nämlich Jesus. Denn der Mensch ist leidende Erde,[c] weil Adam aus dem Angesicht der Erde geschaffen wurde.


    Was sagt er nun? »In das gute Land, ein Land, in dem Milch und Honig fließen.« Gepriesen sei unser Herr, Brüder und Schwestern,[d] der unter uns Weisheit und Verständnis für seine verborgenen Dinge begründet hat. Denn der Prophet spricht in einem Gleichnis über den Herrn. Wer wird es begreifen außer dem, der weise und verständig ist und seinen Herrn liebt?


    Da er uns nun durch die Vergebung der Sünden erneuert hat, machte er uns zu einer neuen Gestalt, sodass wir die Seele von Kindern haben sollten, als erschaffe er uns von Neuem.


    Denn die Schrift spricht über uns, wenn er zum Sohn sagt: »Lasst uns den Menschen nach unserem Bild und nach unserer Ähnlichkeit machen, und sie sollen über die Tiere der Erde, die Vögel des Himmels und die Fische des Meeres herrschen.« Und als der Herr die schöne Schöpfung von uns Menschen sah, sagte er: »Wachst und vermehrt euch und füllt die Erde.« Diese Worte beziehen sich auf den Sohn.


    Wiederum will ich dir zeigen, wie der Herr über uns spricht. Am Ende schuf er eine zweite Schöpfung, und der Herr sagt: »Siehe, ich mache die letzten Dinge wie die ersten.« Darauf bezogen verkündete der Prophet: »Zieht in ein Land, in dem Milch und Honig fließen, und herrscht darüber.«


    Siehe also: Wir sind neu geschaffen worden, wie er wiederum durch einen anderen Propheten sagt: »Siehe, spricht der Herr, ich werde aus diesen« – das heißt aus denen, die der Geist des Herrn vorausgesehen hat – »ihre steinernen Herzen herausnehmen und ihnen Herzen aus Fleisch geben«; denn er selbst sollte im Fleisch offenbart werden und in uns wohnen.


    Denn die Wohnstätte unseres Herzens ist ein heiliger Tempel für den Herrn, meine Brüder und Schwestern.[d]


    Denn wiederum sagt der Herr: »Womit soll ich vor dem Herrn, meinem Gott, erscheinen und verherrlicht werden? Ich will dich in der Versammlung meiner Brüder bekennen und dir inmitten der Versammlung der Heiligen singen.« Wir also sind diejenigen, die er in das gute Land gebracht hat.


    Was sind nun die Milch und der Honig? Das Kind wird zuerst durch Honig, dann durch Milch am Leben erhalten. Ebenso werden auch wir durch unseren Glauben an die Verheißung und durch das Wort am Leben erhalten werden; wir werden leben und über die Erde herrschen.


    Oben haben wir bereits gesagt: »Und sie sollen wachsen und sich vermehren und über die Fische herrschen.« Doch wer kann [jetzt][e] über Tiere, Fische und Vögel des Himmels herrschen? Denn wir müssen erkennen: Herrschen bedeutet Macht, sodass jemand Befehle erteilt und Herrschaft ausübt.


    Wenn dies also jetzt nicht geschieht, hat er gewiss zu uns von der künftigen Welt gesprochen, wenn wir selbst vollendet werden, sodass wir Erben des Bundes des Herrn werden können.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach der überlieferten Lesart: »in die Quellen Zions«. Der Wortlaut weicht von der geläufigen Fassung von Jesaja 28,16 ab.'
    reason: Die ungewöhnliche Textform soll sichtbar bleiben und nicht stillschweigend harmonisiert werden.
  - marker: b
    text: Die drastische Selbstbezeichnung »Abschaum eurer Liebe« ist wörtlich schwer verständlich und drückt wohl äußerste Demut gegenüber den Angesprochenen aus.
    reason: Erläutert eine idiomatisch und semantisch schwierige Wendung, ohne sie im Haupttext abzuschwächen.
  - marker: c
    text: »Leidende Erde« gibt die schwierige überlieferte Formulierung wieder. Gemeint ist offenbar ein Zusammenhang zwischen dem leidensfähigen Menschen und seiner Erschaffung aus Erde; der genaue Wortlaut bleibt unsicher.
    reason: Bewahrt eine echte textliche bzw. sprachliche Schwierigkeit.
  - marker: d
    text: Wörtlich steht hier die übliche Gemeindeanrede »Brüder«, die im Zusammenhang die ganze Gemeinschaft ansprechen kann.
    reason: Dokumentiert die inklusive Wiedergabe im Haupttext.
  - marker: e
    text: »Jetzt« ist im zugrunde liegenden Übersetzungszeugnis als ergänztes Wort gekennzeichnet; es verdeutlicht den Gegensatz zur künftigen Vollendung.
    reason: Erhält das überlieferungskritische Signal des Ausgangsmaterials.
lexical_decisions:
- source_word: servant of the Lord
  choice: Diener des Herrn
  rationale: Bewahrt die mögliche individuelle bzw. messianische Referenz, ohne sie durch eine ausdrückliche Identifizierung aufzulösen.
- source_word: fountains of Zion
  choice: Quellen Zions
  rationale: Die auffällige überlieferte Lesart wird nicht an den bekannteren Wortlaut »Zion« angeglichen.
- source_word: offscouring
  choice: Abschaum
  rationale: Gibt die drastische Selbsterniedrigung wieder; eine glättende Form wie »Geringster« wäre zu schwach.
- source_word: knowledge
  choice: Erkenntnis
  rationale: Personifiziert den Begriff entsprechend der Argumentation des Textes.
- source_word: earth suffering
  choice: leidende Erde
  rationale: Bewahrt die schwierige, möglicherweise wortspielerische Formulierung des Zeugnisses, statt sie spekulativ zu erklären.
- source_word: new type
  choice: neue Gestalt
  rationale: Natürliches Deutsch, das den Gedanken einer neu geprägten menschlichen Daseinsform erhält, ohne einen technischen Typologiebegriff aufzuzwingen.
- source_word: be lords over it
  choice: herrscht darüber
  rationale: Stellt die Verbindung zur Herrschaftsaussage aus Genesis klar und vermeidet im Deutschen das unnatürliche »seid Herren darüber«.
- source_word: hereafter
  choice: künftige Welt
  rationale: Gibt die eschatologische Zukunft verständlich wieder, ohne ihren genauen zeitlichen Ablauf festzulegen.
theological_decisions:
- issue: Referenz der männlichen Pronomen in den Schriftzitaten
  choice: Pronomen und Übergänge weitgehend beibehalten
  alternative: Jede Stelle ausdrücklich mit »Christus« oder »Jesus« identifizieren
  rationale: Der Autor deutet die Texte christologisch, doch die wechselnden Sprecher und Referenten bleiben sprachlich teilweise mehrdeutig.
- issue: Hoffnung auf den Stein und Fleischwerdung
  choice: Die Spannung zwischen Steinbild und gefestigtem Fleisch erhalten
  alternative: Den Stein unmittelbar als eindeutiges Symbol für Christus erklären
  rationale: Der Text selbst weist ein wörtliches Verständnis zurück und bietet seine eigene, ungewöhnliche Begründung; diese soll nicht systematisiert werden.
- issue: Schöpfungsworte als Rede zum Sohn
  choice: Die ausdrückliche Aussage des Autors wiedergeben
  alternative: Die Aussage trinitarisch ausdeuten oder abschwächen
  rationale: Die historische theologische Behauptung des Barnabasbriefs wird übersetzt, ohne eine spätere dogmatische Formel einzufügen.
- issue: »Herzen aus Fleisch« und Offenbarung im Fleisch
  choice: Die doppelte Verwendung von »Fleisch« sichtbar lassen
  alternative: Eine der Stellen als »lebendige Herzen« paraphrasieren
  rationale: Die argumentative Wortverbindung des Autors ist theologisch bedeutsam und darf nicht geglättet werden.
- issue: Künftige Herrschaft über die Schöpfung
  choice: Als Aussage über die künftige Welt wiedergeben
  alternative: Auf gegenwärtige geistliche Herrschaft oder ein bestimmtes Endzeitschema festlegen
  rationale: Der Text unterscheidet Gegenwart und Zukunft, bestimmt die künftige Ordnung aber nicht genauer.
- issue: Anrede adelphoi
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Die inklusive Gemeindeanrede wird in modernem Deutsch funktional wiedergegeben; in einem wörtlichen Zitat bleibt »Brüder« erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem Satzbau. Die häufigen rhetorischen Fragen, Schriftformeln und argumentativen Wiederholungen bleiben erhalten. Archaismen wurden vermieden, auffällige oder schwierige Lesarten jedoch nicht harmonisiert. Da eine direkte Prüfung des griechischen und lateinischen Textes noch aussteht, werden textkritisch unsichere Formulierungen in Fußnoten kenntlich gemacht.
