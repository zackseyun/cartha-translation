    Du sollst keine Unzucht treiben. Du sollst nicht die Ehe brechen. Du sollst keine Jungen sexuell verderben.[a] Das Wort Gottes soll nicht aus deinem Mund kommen, wo Unreine anwesend sind.[b] Wenn du jemanden wegen einer Verfehlung zurechtweist, sollst du nicht nach der Person urteilen. Du sollst sanftmütig sein. Du sollst ruhig sein. Du sollst die Worte, die du gehört hast, in Ehrfurcht achten. Du sollst deinem Bruder nichts nachtragen.


    Du sollst nicht zweifeln, ob etwas geschehen wird oder nicht.[c] Du sollst den Namen des Herrn nicht missbrauchen. Du sollst deinen Nächsten mehr lieben als deine eigene Seele. Du sollst ein Kind nicht durch Abtreibung töten und es auch nach seiner Geburt nicht umbringen. Du sollst deine Hand nicht von deinem Sohn oder deiner Tochter zurückziehen, sondern sie von Jugend an die Ehrfurcht vor Gott lehren.


    Du sollst nicht danach verlangen, was deinem Nächsten gehört. Du sollst nicht habgierig sein. Auch sollst du dich nicht von Herzen an die Hochgestellten halten, sondern mit den Demütigen und Gerechten deinen Weg gehen. Was dir widerfährt, sollst du als gut annehmen, weil du weißt, dass nichts ohne Gott geschieht.[d] Du sollst weder zwiespältig denken noch doppelzüngig reden.


    Du sollst deinen Herren untertan sein wie einem Abbild Gottes, mit Scheu und Ehrfurcht.[e] Du sollst deinem Sklaven oder deiner Sklavin, die ihre Hoffnung auf denselben Gott setzen, nicht mit Bitterkeit befehlen. Sonst könnten sie aufhören, den Gott zu fürchten, der über euch beiden steht. Denn er kam nicht, um nach dem Ansehen der Person zu berufen, sondern um diejenigen zu berufen, die der Geist vorbereitet hat.


    Du sollst deinen Nächsten an allem teilhaben lassen und nichts dein ausschließliches Eigentum nennen. Denn wenn ihr gemeinsam Anteil am Unvergänglichen habt, wie viel mehr dann an den vergänglichen Dingen! Sei nicht vorschnell mit deiner Zunge, denn der Mund ist eine Schlinge des Todes. Soweit du es vermagst, sollst du um deiner Seele willen rein sein.


    Strecke nicht die Hände aus, um zu empfangen, und zieh sie nicht zurück, wenn es ums Geben geht. Jeden, der dir das Wort des Herrn sagt, sollst du wie deinen Augapfel lieben.


    Tag und Nacht sollst du an den Tag des Gerichts denken. Jeden Tag sollst du die Heiligen aufsuchen: Entweder mühst du dich durch dein Wort, gehst hin, um sie zu ermahnen, und überlegst, wie du durch dein Wort Seelen retten kannst, oder du arbeitest mit deinen Händen als Lösegeld für deine Sünden.[f]


    Du sollst nicht zögern zu geben und beim Geben nicht murren; du sollst vielmehr wissen, wer dir deinen Lohn gut auszahlt. Was du empfangen hast, sollst du bewahren und weder etwas hinzufügen noch etwas wegnehmen. Den Bösen sollst du ganz und gar hassen.[g] Du sollst gerecht urteilen.


    Du sollst keine Spaltung verursachen, sondern Streitende miteinander versöhnen. Du sollst deine Sünden bekennen. Du sollst nicht mit einem bösen Gewissen zum Gebet gehen. Dies ist der Weg des Lichts.'
