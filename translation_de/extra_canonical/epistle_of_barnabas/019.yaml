translation:
  language: de
  text: 'Dies nun ist der Weg des Lichts: Wer den Weg zu dem für ihn bestimmten Ziel gehen will, soll in seinen Taten eifrig sein. Die Erkenntnis, die uns gegeben ist, damit wir auf diesem Weg gehen können, lautet so:


    Du sollst den lieben, der dich gemacht hat. Du sollst den fürchten, der dich geschaffen hat. Du sollst den verherrlichen, der dich vom Tod erlöst hat. Du sollst aufrichtigen Herzens und reich an Geist sein. Du sollst dich nicht denen anschließen, die auf dem Weg des Todes gehen. Du sollst alles hassen, was Gott nicht gefällt. Du sollst jede Heuchelei hassen. Du sollst die Gebote des Herrn niemals verlassen.


    Du sollst dich nicht selbst erhöhen, sondern in allem demütig gesinnt sein. Du sollst dir nicht selbst Ehre anmaßen. Du sollst gegen deinen Mitmenschen keinen bösen Plan hegen. Du sollst der Vermessenheit keinen Raum in deiner Seele geben.


    Du sollst keine Unzucht treiben. Du sollst nicht die Ehe brechen. Du sollst keine Jungen sexuell verderben.[a] Das Wort Gottes soll nicht aus deinem Mund kommen, wo Unreine anwesend sind.[b] Wenn du jemanden wegen einer Verfehlung zurechtweist, sollst du nicht nach der Person urteilen. Du sollst sanftmütig sein. Du sollst still sein. Du sollst die Worte, die du gehört hast, mit Ehrfurcht aufnehmen. Du sollst deinem Bruder nichts nachtragen.


    Du sollst nicht zweifeln, ob etwas geschehen wird oder nicht.[c] Du sollst den Namen des Herrn nicht missbrauchen. Du sollst deinen Mitmenschen mehr lieben als dein eigenes Leben. Du sollst ein Kind nicht durch Abtreibung töten und es auch nach seiner Geburt nicht umbringen. Du sollst deine Hand nicht von deinem Sohn oder deiner Tochter zurückziehen, sondern sie von Jugend an die Ehrfurcht vor Gott lehren.


    Du sollst nicht danach verlangen, was deinem Mitmenschen gehört. Du sollst nicht habgierig sein. Auch sollst du dich nicht von Herzen an die Hochgestellten halten, sondern mit den Demütigen und Gerechten deinen Weg gehen. Was dir widerfährt, sollst du als gut annehmen, weil du weißt, dass nichts ohne Gott geschieht.[d] Du sollst weder zwiespältig denken noch doppelzüngig reden.


    Du sollst deinen Herren untertan sein wie einem Abbild Gottes, mit Scheu und Ehrfurcht.[e] Du sollst deinem Sklaven oder deiner Sklavin, die ihre Hoffnung auf denselben Gott setzen, nicht mit Bitterkeit befehlen. Sonst könnten sie aufhören, den Gott zu fürchten, der über euch beiden steht. Denn er kam nicht, um nach dem Ansehen der Person zu berufen, sondern um diejenigen zu berufen, die der Geist vorbereitet hat.


    Du sollst deinen Mitmenschen an allem teilhaben lassen und nichts dein ausschließliches Eigentum nennen. Denn wenn ihr gemeinsam Anteil am Unvergänglichen habt, wie viel mehr dann an den vergänglichen Dingen! Sei nicht vorschnell mit deiner Zunge, denn der Mund ist eine Schlinge des Todes. Soweit du es vermagst, sollst du um deiner Seele willen rein sein.


    Strecke nicht die Hände aus, um zu empfangen, und zieh sie nicht zurück, wenn es ums Geben geht. Jeden, der dir das Wort des Herrn sagt, sollst du wie deinen Augapfel lieben.


    Tag und Nacht sollst du an den Tag des Gerichts denken. Jeden Tag sollst du die Heiligen aufsuchen: Entweder mühst du dich durch dein Wort, gehst hin, um sie zu ermahnen, und überlegst, wie du durch dein Wort Seelen retten kannst, oder du arbeitest mit deinen Händen als Lösegeld für deine Sünden.[f]


    Du sollst nicht zögern zu geben und beim Geben nicht murren; du sollst vielmehr wissen, wer der gute Auszahler deines Lohnes ist. Was du empfangen hast, sollst du bewahren und weder etwas hinzufügen noch etwas wegnehmen. Den Bösen sollst du ganz und gar hassen.[g] Du sollst gerecht urteilen.


    Du sollst keine Spaltung verursachen, sondern Streitende miteinander versöhnen. Du sollst deine Sünden bekennen. Du sollst nicht mit einem bösen Gewissen zum Gebet gehen. Dies ist der Weg des Lichts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bzw. traditionell: „Du sollst keine Jungen verderben.“ Gemeint ist sexueller Missbrauch oder sexuelle Ausbeutung von Jungen.'
    reason: Der antike Ausdruck ist knapp und bedarf für heutige Leser einer sachlichen Klärung.
  - marker: b
    text: 'Die überlieferte Formulierung ist schwer verständlich. Möglich ist auch der Sinn: Das Wort Gottes soll nicht in einem Zusammenhang ausgesprochen werden, der von Unreinheit geprägt ist.'
    reason: Die Unsicherheit des Ausgangszeugnisses soll sichtbar bleiben.
  - marker: c
    text: 'Möglich ist auch: „Du sollst nicht unschlüssig sein, ob etwas eintreffen wird oder nicht.“ Der Satz warnt wahrscheinlich vor Zweifel oder innerer Unentschiedenheit.'
    reason: Die genaue Reichweite des Verbots ist ohne abschließende Prüfung der griechischen und lateinischen Zeugen unsicher.
  - marker: d
    text: Der Text sagt knapp, dass nichts „ohne Gott“ geschieht; er erläutert nicht, ob damit Gottes Wirken, Wille oder Zulassung gemeint ist.
    reason: Bewahrt die theologische Spannung und verhindert eine stillschweigende Systematisierung.
  - marker: e
    text: „Herren“, „Sklave“ und „Sklavin“ geben die antike gesellschaftliche Ordnung des Textes wieder. „Abbild Gottes“ bedeutet hier eine repräsentative Vergleichsfigur, nicht Göttlichkeit.
    reason: Historischer Kontext und mögliche Fehlinterpretation des Vergleichs werden geklärt.
  - marker: f
    text: „Als Lösegeld für deine Sünden“ ist die starke Metapher des Textes. Wie diese Aussage zum göttlichen Erlösungshandeln steht, wird hier nicht erklärt.
    reason: Die theologische Spannung wird offengelegt, nicht harmonisiert.
  - marker: g
    text: Die Form kann personal „den Bösen“ oder sachlich „das Böse“ verstanden werden.
    reason: Bewahrt eine echte lexikalisch-theologische Mehrdeutigkeit.
lexical_decisions:
- source_word: ὁδὸς τοῦ φωτός (reconstructed from the Greek tradition)
  choice: Weg des Lichts
  rationale: Bewahrt das zentrale Zwei-Wege-Bild wörtlich und in natürlichem Deutsch.
- source_word: ἁπλοῦς τῇ καρδίᾳ (traditional Greek wording)
  choice: aufrichtigen Herzens
  rationale: „Einfach im Herzen“ wäre im heutigen Deutsch missverständlich; gemeint ist ein ungeteiltes, argloses Herz.
- source_word: πλούσιος τῷ πνεύματι (traditional Greek wording)
  choice: reich an Geist
  rationale: Lässt offen, ob der menschliche Geist oder geistlicher Reichtum gemeint ist, statt ausdrücklich „Heiliger Geist“ einzutragen.
- source_word: παιδοφθορήσεις (traditional Greek wording)
  choice: Jungen sexuell verderben
  rationale: Gibt das Verbot sexueller Ausbeutung von Jungen klar wieder, ohne den antiken Ausdruck zu verharmlosen.
- source_word: προσωπολημψία / distinction according to person
  choice: nach der Person urteilen
  rationale: Gibt das Verbot parteiischer Zurechtweisung idiomatisch wieder.
- source_word: διγνώμων / δίγλωσσος (traditional wording)
  choice: zwiespältig denken / doppelzüngig reden
  rationale: Erhält die parallele Warnung vor innerer Unentschiedenheit und unaufrichtiger Rede.
- source_word: τύπος θεοῦ (traditional wording)
  choice: Abbild Gottes
  rationale: „Abbild“ ist verständlicher als das technische „Typus“, ohne eine Identifikation mit Gott auszudrücken.
- source_word: λύτρωσις τῶν ἁμαρτιῶν (traditional wording)
  choice: Lösegeld für deine Sünden
  rationale: Bewahrt die anstößige und theologisch spannungsreiche Sühne- beziehungsweise Lösegeldmetapher des Zeugnisses.
- source_word: ὁ πονηρός (traditional wording)
  choice: der Böse
  rationale: Erhält die mögliche personale Deutung; eine Fußnote weist auf die Alternative „das Böse“ hin.
theological_decisions:
- issue: Gottes Vorsehung bei widerfahrenden Ereignissen
  choice: „nichts ohne Gott geschieht“
  alternative: „nichts geschieht ohne Gottes Zulassung“
  rationale: Die stärkere Formulierung des Zeugnisses wird nicht durch eine theologische Erklärung der Zulassung abgeschwächt.
- issue: Arbeit als „Lösegeld für Sünden“
  choice: Metapher im Haupttext beibehalten
  alternative: „als Hilfe angesichts deiner Sünden“ oder eine soteriologisch harmonisierte Umschreibung
  rationale: Die genuine Spannung zwischen Werken, Buße und Vergebung darf nicht stillschweigend aufgelöst werden.
- issue: Berufung der vom Geist Vorbereiteten
  choice: „die der Geist vorbereitet hat“
  alternative: „die Gott vorbereitet hat“
  rationale: Das ausdrückliche Handeln des Geistes bleibt erhalten, ohne eine weitergehende pneumatologische Lehre einzutragen.
- issue: Sklaverei und Gehorsam
  choice: Historische Begriffe direkt wiedergeben
  alternative: Auf moderne Arbeitsverhältnisse übertragen
  rationale: Der Text wird nicht modernisierend umgeschrieben; zugleich wird seine asymmetrische antike Sozialordnung nicht als zeitlose Billigung ausgegeben.
- issue: Abtreibung und Tötung nach der Geburt
  choice: Explizites zweifaches Verbot beibehalten
  alternative: Allgemein „Du sollst kein Kind töten“
  rationale: Die konkrete ethische Aussage des antiken Zeugnisses soll weder erweitert noch abgeschwächt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit durchgehendem singularischem „du“, entsprechend der paränetischen Einzelanrede. Kurze Gebotssätze bewahren Rhythmus und Eindringlichkeit. Archaismen wurden vermieden, historische Sozialbegriffe jedoch nicht modernisiert. Da die bereitgestellte Grundlage ausdrücklich ein englischer gemeinfreier Zeuge ist und die direkte Prüfung der griechischen und lateinischen Überlieferung noch aussteht, ist dieser Entwurf quellenkritisch als vorläufig zu behandeln; unsichere oder spannungsreiche Stellen sind kenntlich gemacht.
