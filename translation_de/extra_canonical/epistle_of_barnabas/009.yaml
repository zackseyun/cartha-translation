  text: 'Furthermore, concerning the ears, he says that it is our heart that he circumcised. The Lord says in the prophet, “With the hearing of the ears they listened to me.” And again he says, “Those who are far away will hear with their ears and will understand what I have done.” And, “Be circumcised in your hearts,” says the Lord.


    And again he says, “Hear, Israel, for this is what the Lord your God says. Whoever desires to live forever, let him hear with his ears the voice of my servant. ~y” And again he says, “Hear, heaven, and give ear, earth, for the Lord has spoken these things as a testimony.” And again he says, “Hear the words of the Lord, you rulers of this people.” And again he says, “Hear, my children, the voice of one crying in the wilderness.” Therefore he circumcised our ears so that, by hearing the word, we might believe.


    But moreover, the circumcision in which they place their confidence is abolished, for he has said that a circumcision not of the flesh should be practiced. But they transgressed, because an evil angel taught them cleverness.


    He says to them, “This is what the Lord your God says”—so I find the commandment—“Do not sow among thorns; be circumcised into your Lord.” And what does he say? “Be circumcised in the hardness of your heart, and then you will not harden your neck.” Take this also: “Behold,” says the Lord, “all the Gentiles are uncircumcised in their foreskin, but this people is uncircumcised in their hearts.”


    But you will say, “In truth, the people has been circumcised as a seal.” No, for so likewise is every Syrian and Arabian and all the priests of the idols. Do all those, then, also belong to their covenant? Moreover, the Egyptians are also included among the circumcised.


    Therefore learn fully about all things, children of love: Abraham, who first appointed circumcision, looked forward in the spirit to Jesus when he circumcised, having received the ordinances of three letters.


    For Scripture says, “And Abraham circumcised of his household eighteen males and three hundred.” What, then, was the knowledge given to him? Understand that he says the eighteen first, and then, after an interval, three hundred. In the eighteen, “I” stands for ten and “H” for eight. Here you have JESUS (IHSOYS). And because the cross in the “T” was to have grace, he also says three hundred. Thus he reveals Jesus in the two letters, and the cross in the remaining one.


    He who placed within us the innate gift of his covenant knows: no one has ever learned from me a more genuine word. But I know that you are worthy.'
translation:
  language: de
  text: '**Barnabas 9**


    Weiter sagt er über die Ohren, dass er unser Herz beschnitten hat. Der Herr sagt durch den Propheten: »Mit ihren Ohren hörten sie auf mich.« Und wiederum sagt er: »Die Fernen werden mit ihren Ohren hören und erkennen, was ich getan habe.« Und: »Lasst euch an euren Herzen beschneiden«, spricht der Herr.


    Und wiederum sagt er: »Höre, Israel, denn so spricht der Herr, dein Gott: Wer für immer leben will, der höre mit seinen Ohren auf die Stimme meines Dieners.«[a] Und wiederum sagt er: »Höre, Himmel, und vernimm, Erde, denn der Herr hat dies zum Zeugnis gesprochen.« Und wiederum sagt er: »Hört die Worte des Herrn, ihr Herrscher dieses Volkes.« Und wiederum sagt er: »Hört, meine Kinder, die Stimme eines Rufenden in der Wüste.« Darum hat er unsere Ohren beschnitten, damit wir das Wort hören und glauben.


    Doch die Beschneidung, auf die sie ihr Vertrauen setzen, ist zudem aufgehoben. Denn er hat gesagt, man solle eine Beschneidung vollziehen, die nicht am Fleisch geschieht. Sie aber übertraten das Gebot, weil ein böser Engel sie Schlauheit lehrte.


    Er sagt zu ihnen: »So spricht der Herr, euer Gott« – so finde ich das Gebot –: »Sät nicht unter Dornen; lasst euch für euren Herrn beschneiden.«[b] Und was sagt er? »Lasst euch an der Verhärtung eures Herzens beschneiden; dann werdet ihr euren Nacken nicht verhärten.« Nimm auch dieses Wort: »Siehe«, spricht der Herr, »alle Völker sind an der Vorhaut unbeschnitten, dieses Volk aber ist am Herzen unbeschnitten.«


    Du wirst aber sagen: »Das Volk ist doch tatsächlich als Zeichen des Bundes beschnitten worden.« Nein; denn ebenso sind jeder Syrer und Araber sowie alle Priester der Götzen beschnitten. Gehören deshalb auch sie alle zu ihrem Bund? Außerdem zählen auch die Ägypter zu den Beschnittenen.


    Erkennt daher alles in seiner ganzen Fülle, Kinder der Liebe: Als Abraham als Erster die Beschneidung anordnete, blickte er im Geist auf Jesus voraus; denn bei der Beschneidung hatte er die Weisung der drei Buchstaben empfangen.


    Die Schrift sagt nämlich: »Und Abraham beschnitt aus seinem Hausstand achtzehn und dreihundert Männer.« Welche Erkenntnis wurde ihm damit gegeben? Versteht: Zuerst nennt er die achtzehn und danach, mit einem Abstand, die dreihundert. Bei der Achtzehn steht »I« für zehn und »H« für acht. Damit hast du JESUS: ΙΗΣΟΥΣ.[c] Weil aber das Kreuz im »T« Gnade bringen sollte, nennt er außerdem dreihundert.[d] So offenbart er Jesus in den beiden Buchstaben und in dem verbleibenden Buchstaben das Kreuz.


    Derjenige, der die uns eingepflanzte Gabe seines Bundes in uns gelegt hat, weiß es: Niemand hat je von mir ein zuverlässigeres Wort gehört. Ich weiß aber, dass ihr dessen würdig seid.'
