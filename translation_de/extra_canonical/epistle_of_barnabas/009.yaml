  footnotes:
  - marker: a
    text: Im zugrunde gelegten englischen Textzeugen steht an dieser Stelle ein offenkundig fremdes Zeichen (»~y«); es wurde nicht in den Haupttext übernommen.
    reason: Transparenz über eine vermutlich intrusive Seiten- oder Überlieferungsmarke.
  - marker: b
    text: Die Wendung »für euren Herrn« gibt eine schwierige, möglicherweise verderbte Überlieferung wieder; wörtlicher lautet der englische Zeuge »in euren Herrn hinein«.
    reason: Bewahrt die textliche Unsicherheit, ohne den Haupttext unverständlich zu machen.
  - marker: c
    text: Gemeint sind die griechischen Zahlzeichen Ι = 10 und Η = 8, zusammen 18. ΙΗ sind zugleich die ersten beiden Buchstaben des griechischen Namens ΙΗΣΟΥΣ (Jesus).
    reason: Die Wort- und Zahlenspielerei ist ohne Kenntnis des griechischen Zahlensystems nicht verständlich.
  - marker: d
    text: Der griechische Buchstabe Τ (Tau) hat den Zahlenwert 300 und wurde wegen seiner Form als Bild des Kreuzes verstanden.
    reason: Erläutert die antike typologische Deutung, auf der der Gedankengang beruht.
lexical_decisions:
- source_word: circumcised our ears / heart
  choice: unsere Ohren / unser Herz beschnitten
  rationale: Die zentrale Bildsprache der Beschneidung wird bewusst wörtlich bewahrt, weil die Argumentation des Kapitels auf ihr beruht.
- source_word: cleverness
  choice: Schlauheit
  rationale: Gibt den negativen Sinn einer listigen, fehlleitenden Klugheit wieder, ohne ihn zu einer ausdrücklich moraltheologischen Kategorie auszuweiten.
- source_word: seal
  choice: Zeichen des Bundes
  rationale: Im Zusammenhang bezeichnet das Siegel die Bundeszugehörigkeit; die Formulierung macht die gemeinte Funktion verständlich, ohne die Behauptung des Gesprächspartners zu bestätigen.
- source_word: ordinances of three letters
  choice: Weisung der drei Buchstaben
  rationale: Bewahrt die eigentümliche buchstaben- und zahlenbezogene Auslegung; »Weisung« bleibt näher am überlieferten Gebotsmotiv als eine freie Umschreibung.
- source_word: innate gift
  choice: eingepflanzte Gabe
  rationale: Bewahrt die Vorstellung einer innerlich verliehenen Gabe und vermeidet das modern-biologische Missverständnis von »angeboren«.
- source_word: more genuine word
  choice: ein zuverlässigeres Wort
  rationale: Natürliches Deutsch für die Behauptung besonderer Echtheit oder Verlässlichkeit, ohne Unfehlbarkeit zu unterstellen.
theological_decisions:
- issue: Bezug des Pronomens »er«
  choice: Das wiederholte »er« bleibt stehen.
  alternative: Durchgehend »Gott« oder »Christus« einsetzen.
  rationale: Der überlieferte Text wechselt zwischen dem Herrn, prophetischen Schriftworten und dem Handelnden; eine explizite Identifikation würde die genuine Mehrdeutigkeit auflösen.
- issue: Bewertung der fleischlichen Beschneidung
  choice: Die polemische Aussage des Autors wird direkt wiedergegeben.
  alternative: Durch erklärende oder abmildernde Zusätze relativieren.
  rationale: Die historische theologische Spannung gehört zum Text und darf weder harmonisiert noch konfessionell umgedeutet werden.
- issue: Typologische Deutung der Zahlen 318
  choice: Die antike Buchstaben-Zahlen-Deutung wird textnah erhalten und in Fußnoten erklärt.
  alternative: Die Symbolik frei paraphrasieren oder korrigieren.
  rationale: Die Argumentation hängt von griechischer Gematrie und der Form des Buchstabens Tau ab; Übersetzung darf diese historische Exegese nicht ersetzen.
- issue: »into your Lord«
  choice: »für euren Herrn«
  alternative: »in euren Herrn hinein« oder »eurem Herrn«
  rationale: Der englische Zeuge bietet eine ungewöhnliche und möglicherweise textlich unsichere Wendung. »Für euren Herrn« erhält die Ausrichtung auf den Herrn, ohne im Deutschen eine unverständliche räumliche Aussage zu erzeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit nachvollziehbarer Syntax. Die dichte Folge von Schriftzitaten und die wiederholte Beschneidungsmetaphorik bleiben erhalten. Da eine direkte Prüfung des griechischen beziehungsweise lateinischen Ausgangstextes noch aussteht, ist der Entwurf ausdrücklich am bereitgestellten gemeinfreien englischen Zeugen orientiert; erkennbare Überlieferungsprobleme werden in Fußnoten markiert.
