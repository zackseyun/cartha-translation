  text: 'In the same way again he defines concerning the cross in another prophet, who says, “And when will these things be accomplished?” says the Lord. “Whenever a tree is bent and stands upright, and whenever blood drips from a tree.” Again you are taught concerning the cross and him who was to be crucified.


    And again he says in Moses, when war was waged against Israel by people of another nation, and so that he might remind them, when war was waged against them, that because of their sins they had been delivered unto death: the Spirit says to the heart of Moses that he should make a type of the cross and of him who was to suffer, for unless, he says, they set their hope on him, war will be waged against them forever. Therefore Moses piles arms one upon another in the midst of the encounter, and, standing on higher ground than anyone else, stretches out his hands; and so Israel again is victorious. But whenever he lowers them, they are slain with the sword.


    Why was this? That they might learn that they cannot be saved unless they set their hope on him.


    And again, in another prophet, he says, “The whole day long I have stretched out my hands to a disobedient people who gainsaid my righteous way.”


    Again Moses makes a type of Jesus: how he must suffer, and how he himself, whom they will think to have destroyed, shall make alive in an emblem when Israel was falling. For the Lord caused all kinds of serpents to bite them, and they died—for the transgression was wrought in Eve through the serpent—so that he might convince them that, because of their transgression, they would be delivered over to the affliction of death.


    Furthermore, though Moses gave the command, “You shall not have a molten or carved image for your God,” he himself made one, that he might show them a type of Jesus. So Moses makes a bronze serpent, sets it up conspicuously, and summons the people by proclamation.


    When they had assembled together, they entreated Moses that he should offer intercession for them, so that they might be healed. And Moses said to them, “Whenever one of you is bitten, let him come to the serpent placed on the tree, and let him believe and hope that the serpent, being itself dead, can make alive; and immediately he shall be saved.” And so they did. Here again, in these things also, you have the glory of Jesus: in him and unto him are all things.


    What again does Moses say to Jesus—Joshua—the son of Nun, when he gives him this name, as being a prophet, so that all the people might give ear to him alone, because the Father reveals all things concerning his Son Jesus?


    Therefore Moses says to Jesus the son of Nun, giving him this name, when he sent him as a spy into the land, “Take a book in your hands, and write what the Lord says: how the Son of God shall cut up by the roots all the house of Amalek in the last days.”


    Behold, again it is Jesus—not a son of man, but the Son of God—and he was revealed in the flesh in a figure. Since people will say that Christ is the son of David, David himself prophesies, being afraid and understanding the error of sinners: “The Lord said to my Lord, ‘Sit at my right hand until I set your enemies as a footstool under your feet.’”


    And again Isaiah says, “The Lord said unto my Christ the Lord, of whose right hand I laid hold, that the nations should give ear before him, and I will break down the strength of kings.” See how David calls him Lord and does not call him Son.'
translation:
  language: de
  text: 'Ebenso bestimmt er wiederum in einem anderen Propheten über das Kreuz. Dieser sagt: »Und wann wird dies vollendet werden?«, spricht der Herr. »Wenn ein Holz sich neigt und wieder aufrecht steht und wenn Blut von einem Holz herabtropft.«[a] Wieder wirst du über das Kreuz und über den belehrt, der gekreuzigt werden sollte.


    Und wiederum spricht er durch Mose, als Männer eines fremden Volkes gegen Israel Krieg führten. Um sie daran zu erinnern, dass sie wegen ihrer Sünden dem Tod ausgeliefert worden waren, als man gegen sie Krieg führte, spricht der Geist zum Herzen des Mose: Er solle ein Sinnbild des Kreuzes und dessen schaffen, der leiden sollte; denn wenn sie ihre Hoffnung nicht auf ihn setzten, so heißt es, werde für immer Krieg gegen sie geführt werden. Daher schichtete Mose mitten im Kampf Waffen aufeinander[b], stellte sich auf eine Anhöhe, die alle anderen überragte, und streckte seine Hände aus. So siegte Israel wieder. Sobald er sie aber sinken ließ, wurden sie mit dem Schwert erschlagen.


    Warum geschah dies? Damit sie lernten, dass sie nicht gerettet werden können, wenn sie ihre Hoffnung nicht auf ihn setzen.


    Und wiederum spricht er in einem anderen Propheten: »Den ganzen Tag habe ich meine Hände nach einem ungehorsamen Volk ausgestreckt, das meinem gerechten Weg widersprach.«


    Wiederum stellt Mose Jesus im Voraus dar: dass er leiden muss und dass gerade er, den sie vernichtet zu haben meinen werden, durch ein Sinnbild lebendig machen wird, als Israel zu Fall kam. Denn der Herr ließ sie von Schlangen aller Art beißen, und sie starben – war doch die Übertretung durch die Schlange an Eva geschehen –, um sie erkennen zu lassen, dass sie wegen ihrer Übertretung der Todesnot ausgeliefert werden sollten.


    Mehr noch: Obwohl Mose das Gebot gegeben hatte: »Ihr sollt für euren Gott kein gegossenes oder geschnitztes Bild haben«, fertigte er selbst eines an, um ihnen ein Sinnbild für Jesus zu zeigen. Mose machte also eine bronzene Schlange, stellte sie weithin sichtbar auf und rief das Volk zusammen.


    Als sie sich versammelt hatten, baten sie Mose, für sie Fürbitte zu leisten, damit sie geheilt würden. Mose sagte zu ihnen: »Wenn jemand von euch gebissen wird, soll er zu der Schlange kommen, die auf dem Holz angebracht ist, und im Glauben darauf hoffen, dass die Schlange, obwohl sie selbst tot ist, lebendig machen kann; dann wird er sofort gerettet werden.« Und so taten sie es. Auch hierin siehst du wieder die Herrlichkeit Jesu: In ihm und auf ihn hin ist alles.


    Was sagt Mose wiederum zu Jesus – das heißt Josua –, dem Sohn Nuns, als er ihm diesen Namen gibt, weil er ein Prophet ist, damit das ganze Volk auf ihn allein hört, da der Vater alles über seinen Sohn Jesus offenbart?


    Als Mose Jesus, den Sohn Nuns, als Kundschafter in das Land sandte, gab er ihm also diesen Namen und sagte zu ihm: »Nimm ein Buch in deine Hände und schreibe, was der Herr sagt: wie der Sohn Gottes in den letzten Tagen das ganze Haus Amaleks mit der Wurzel ausrotten wird.«[c]


    Sieh: Wieder ist es Jesus – nicht ein Menschensohn, sondern der Sohn Gottes –, und er wurde in einem Sinnbild im Fleisch offenbart. Weil nun die Menschen sagen werden, Christus sei der Sohn Davids, weissagt David selbst, voll Furcht und in Erkenntnis des Irrtums der Sünder: »Der Herr sprach zu meinem Herrn: Setze dich zu meiner Rechten, bis ich deine Feinde als Schemel unter deine Füße lege.«


    Und wiederum sagt Jesaja: »Der Herr sprach zu meinem Christus, dem Herrn, dessen rechte Hand ich ergriffen habe, damit die Völker vor ihm hören; und ich werde die Stärke der Könige brechen.«[d] Sieh, wie David ihn Herr nennt und nicht Sohn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier angeführte Prophetenwort ist in dieser Form im heutigen Kanon des Alten Testaments nicht überliefert. »Holz« kann zugleich an Baum, Holzgegenstand und Kreuzesholz denken lassen.
    reason: Quellenlage und für die Argumentation wichtige Mehrdeutigkeit.
  - marker: b
    text: Der überlieferte Wortlaut ist unsicher beziehungsweise ungewöhnlich. Gemeint sein könnte, dass Mose Waffen oder Schilde aufeinanderlegte; die bekannte Erzählung in 2. Mose 17 berichtet stattdessen, dass Mose auf einem Stein saß und seine Hände erhoben hielt.
    reason: Die Fassung des Barnabasbriefs soll nicht stillschweigend an Exodus angeglichen werden.
  - marker: c
    text: 'Die Formulierung verbindet Motive aus 2. Mose 17,14 und der Namensgebung Josuas. »Jesus« und »Josua« sind im Griechischen derselbe Name: Iēsous.'
    reason: Das Wortspiel ist für den Gedankengang zentral, in deutscher Namensform aber nicht unmittelbar sichtbar.
  - marker: d
    text: 'Das Zitat lehnt sich an Jesaja 45,1 an, weicht aber auffällig von den bekannten Fassungen ab: Dort spricht der Herr zu seinem »Gesalbten«, zu Kyrus. Der Barnabasbrief bietet hier »meinem Christus, dem Herrn« und deutet die Stelle entsprechend.'
    reason: Bewahrt die abweichende Zitatgestalt und macht die textliche Spannung transparent.
lexical_decisions:
- source_word: τύπος / type (witness)
  choice: Sinnbild / im Voraus darstellen
  rationale: Bewahrt die frühchristliche typologische Argumentation, bleibt aber für heutige Leser verständlicher als das unkommentierte Fachwort »Typus«.
- source_word: ξύλον / tree, wood
  choice: Holz
  rationale: Die Zitate spielen wahrscheinlich mit der Mehrdeutigkeit von Holz, Baum und Kreuzesholz. »Holz« erhält diese Verbindung besser als die durchgehende Festlegung auf »Baum«.
- source_word: Ἰησοῦς
  choice: Jesus – das heißt Josua
  rationale: Im Griechischen tragen Jesus und Josua denselben Namen. Die explizite Erläuterung macht das namensbezogene Argument sichtbar, ohne beide Gestalten gleichzusetzen.
- source_word: εἰς αὐτόν / unto him (witness)
  choice: auf ihn hin
  rationale: Erhält neben »in ihm« die zielgerichtete Bedeutung und glättet sie nicht zu einer bloßen Zugehörigkeitsaussage.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου / a son of man (witness)
  choice: ein Menschensohn
  rationale: Gibt die vorliegende Gegenüberstellung möglichst formal wieder, ohne sie eigenmächtig mit einem bestimmten neutestamentlichen Titelverständnis zu harmonisieren.
theological_decisions:
- issue: Typologische Deutung von Kreuz, Mose und bronzener Schlange
  choice: Die Deutung des Barnabasbriefs wird direkt und ohne Distanzierungsformeln wiedergegeben.
  alternative: Die Aussagen als spätere christliche Auslegung kennzeichnen oder mit den alttestamentlichen Kontexten harmonisieren.
  rationale: Die Passage selbst vertritt diese typologische Lesart; eine Übersetzung soll ihre theologische Spannung bewahren, nicht auflösen.
- issue: Die tote Schlange könne lebendig machen
  choice: Die auffällige Aussage wird wörtlich-nah bewahrt.
  alternative: 'Sie christologisch verdeutlichen, etwa: »auf den durch sie dargestellten Christus vertrauen«.'
  rationale: Die ungewöhnliche Formulierung gehört zur Argumentation des Textes und darf nicht stillschweigend korrigiert werden.
- issue: Jesus/Josua und der Sohn Gottes
  choice: Das Namensargument wird durch »Jesus – das heißt Josua« sichtbar gemacht.
  alternative: Durchgehend »Josua« schreiben und damit das Wortspiel verdecken oder durchgehend »Jesus« schreiben und Verwechslung riskieren.
  rationale: So bleibt sowohl die sprachliche Identität des Namens als auch die Unterscheidung der Personen erkennbar.
- issue: Christus als Sohn Davids
  choice: Die polemisch zugespitzte Behauptung des Textes bleibt stehen.
  alternative: Durch eine trinitarische oder Zwei-Naturen-Erklärung harmonisieren.
  rationale: Der Autor lässt hier eine echte Spannung entstehen; die Übersetzung soll keine konfessionelle Lösung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Archaismen wurden vermieden, die wiederholte argumentative Struktur (»wiederum«, »sieh«) jedoch bewusst erhalten. Da laut Datensatz die unmittelbare Prüfung der griechischen und lateinischen Zeugen noch aussteht, ist dies ein quellenbewusster Publikationsentwurf auf Grundlage des bereitgestellten öffentlichen Zeugnisses; auffällige Zitate und mögliche Überlieferungsprobleme wurden nicht harmonisiert.
