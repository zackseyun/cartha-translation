  yaml_path: translation/extra_canonical/epistle_of_barnabas/013.yaml
  text: 'Now let us see whether this people or the first people has the inheritance, and whether the covenant had reference to us or to them.


    Hear, then, what the Scripture says concerning the people: “Isaac prayed concerning Rebekah his wife, for she was barren. And she conceived. Then Rebekah went out to inquire of the Lord. And the Lord said to her, ‘Two nations are in your womb, and two peoples in your belly, and one people shall vanquish another people, and the greater shall serve the less.’”


    You ought to understand who Isaac is, who Rebekah is, and in whose case he has shown that the one people is greater than the other.


    And in another prophecy Jacob speaks more plainly to Joseph his son, saying, “Behold, the Lord has not bereft me of your face; bring me your sons, that I may bless them.”


    And he brought Ephraim and Manasseh, desiring that Manasseh should be blessed, because he was the elder; for Joseph led him by the right hand of his father Jacob. But Jacob saw in the Spirit a type of the people that should come afterward. And what does he say? “Jacob crossed his hands and placed his right hand on the head of Ephraim, the second and younger, and blessed him. And Joseph said to Jacob, ‘Transfer your right hand to the head of Manasseh, for he is my firstborn son.’ And Jacob said to Joseph, ‘I know it, my son, I know it; but the greater shall serve the less. Yet this one also shall be blessed.’”


    Mark in whose cases he ordained that this people should be first and heir of the covenant.


    If then, besides this, he also recorded it through Abraham, we attain the completion of our knowledge. What, then, does he say to Abraham when he alone believed, and was ascribed for righteousness? “Behold, I have made you, Abraham, a father of nations that believe in God in uncircumcision.”'
translation:
  language: de
  text: '**Barnabasbrief 13**


    Nun wollen wir sehen, ob dieses Volk oder das frühere Volk das Erbe besitzt und ob der Bund uns oder ihnen gilt.


    Hört also, was die Schrift über die Völker sagt: »Isaak betete für Rebekka, seine Frau, denn sie war unfruchtbar. Und sie wurde schwanger. Dann ging Rebekka hinaus, um den Herrn zu befragen. Und der Herr sagte zu ihr: ›Zwei Völker sind in deinem Leib und zwei Volksstämme in deinem Innern. Ein Volk wird das andere überwinden, und das größere wird dem kleineren dienen.‹«[a]


    Ihr sollt verstehen, wer Isaak ist und wer Rebekka ist und bei wem Gott gezeigt hat, dass das eine Volk größer ist als das andere.


    In einer anderen prophetischen Aussage spricht Jakob noch deutlicher zu seinem Sohn Josef: »Siehe, der Herr hat mir den Anblick deines Gesichts nicht vorenthalten. Bring deine Söhne zu mir, damit ich sie segne.«[b]


    Da brachte Josef Ephraim und Manasse zu ihm. Er wollte, dass Manasse gesegnet würde, weil dieser der Ältere war; deshalb führte Josef ihn an die rechte Hand seines Vaters Jakob. Jakob aber sah im Geist ein Vorausbild des Volkes, das später kommen sollte. Und was sagt die Schrift? »Jakob kreuzte seine Hände, legte seine rechte Hand auf den Kopf Ephraims, des zweiten und jüngeren Sohnes, und segnete ihn. Josef sagte zu Jakob: ›Lege deine rechte Hand auf den Kopf Manasses, denn er ist mein erstgeborener Sohn.‹ Jakob aber sagte zu Josef: ›Ich weiß es, mein Sohn, ich weiß es. Doch das größere wird dem kleineren dienen. Aber auch dieser wird gesegnet werden.‹«[c]


    Achtet darauf, bei wem Gott festlegte, dass dieses Volk an erster Stelle stehen und Erbe des Bundes sein sollte.


    Wenn Gott dies darüber hinaus auch durch Abraham schriftlich bezeugt hat, wird unsere Erkenntnis vollständig. Was sagt er denn zu Abraham, als dieser allein glaubte und es ihm als Gerechtigkeit angerechnet wurde? »Siehe, ich habe dich, Abraham, zum Vater von Völkern gemacht, die unbeschnitten an Gott glauben.«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. 1. Mose 25,21–23. Der Barnabasbrief zitiert frei; »das größere wird dem kleineren dienen« entspricht der hier überlieferten Form seines Arguments.
    reason: Kennzeichnet das Schriftzitat und macht deutlich, dass sein Wortlaut von geläufigen Bibelfassungen abweichen kann.
  - marker: b
    text: Vgl. 1. Mose 48,9–11. Der Wortlaut ist verkürzt und frei wiedergegeben.
    reason: Quellennachweis und Hinweis auf die zitierende Bearbeitung.
  - marker: c
    text: Vgl. 1. Mose 48,13–20; die Aussage »das größere wird dem kleineren dienen« stammt in dieser Form aus 1. Mose 25,23 und wird hier auf Ephraim und Manasse übertragen.
    reason: Die Komposition verschiedener Schriftstellen ist für das Verständnis der Argumentation wesentlich.
  - marker: d
    text: Vgl. 1. Mose 15,6; 17,5 sowie Römer 4,9–12. Die Formulierung verbindet mehrere biblische Aussagen und ist kein wörtliches Einzelzitat.
    reason: Zeigt die schriftgelehrte Zusammenführung von Glaube, Gerechtigkeit, Völkerschaft und Unbeschnittenheit.
lexical_decisions:
- source_word: λαός / ἔθνος (as reflected in the cited scriptural language)
  choice: Volk / Völker / Volksstämme
  rationale: Die wechselnde Terminologie des überlieferten Wortlauts wird soweit möglich sichtbar gehalten. Im einleitenden theologischen Argument bezeichnet »Volk« eine heilsgeschichtliche Gemeinschaft; im Schriftzitat geben »Völker« und »Volksstämme« die parallelen Ausdrücke natürlich wieder.
- source_word: πρεσβύτερος / μείζων (witness reflected as first/greater)
  choice: das frühere Volk / das größere
  rationale: Im ersten Satz meint der Ausdruck wahrscheinlich das zeitlich frühere Volk, nicht schlicht ein höherwertiges Volk; im Genesis-Zitat bleibt dagegen die komparative Form »das größere« erhalten, um die Spannung des Arguments nicht aufzulösen.
- source_word: κληρονομία / κληρονόμος
  choice: Erbe / Erbe des Bundes
  rationale: Die erbrechtliche und bundesbezogene Bildsprache wird bewahrt, ohne sie durch abstraktere Begriffe wie »Anteil« oder »Empfänger« abzuschwächen.
- source_word: τύπος
  choice: Vorausbild
  rationale: »Vorausbild« ist verständlicher als der fachsprachliche Ausdruck »Typus« und bewahrt dennoch den vom Autor behaupteten prophetischen Zusammenhang.
- source_word: ἐν ἀκροβυστίᾳ
  choice: unbeschnitten
  rationale: Die konkrete körperlich-bundestheologische Aussage wird klar wiedergegeben; eine Umschreibung wie »ohne Beschneidung« wäre ebenfalls möglich, klingt hier aber schwerfälliger.
- source_word: ἐλογίσθη εἰς δικαιοσύνην (scriptural formula)
  choice: es ihm als Gerechtigkeit angerechnet wurde
  rationale: Die traditionelle forensisch-rechnerische Metapher der Schriftformel bleibt erhalten, ohne eine bestimmte spätere Rechtfertigungslehre auszudeuten.
theological_decisions:
- issue: Identität von »diesem Volk« und »dem früheren Volk«
  choice: Die deiktischen Bezeichnungen bleiben stehen und werden nicht ausdrücklich mit Kirche und Israel ersetzt.
  alternative: »die Kirche« und »Israel« in den Haupttext einsetzen
  rationale: Der Autor setzt diese Zuordnung im Kontext voraus, doch die Übersetzung soll seine Formulierung bewahren und die polemische heilsgeschichtliche Argumentation nicht überexplizieren.
- issue: Subjekt der Auslegungsaussagen
  choice: Wo der Zusammenhang göttliches Handeln voraussetzt, steht »Gott«; bei der Zitateinleitung steht »die Schrift«.
  alternative: Durchgehend das mehrdeutige Pronomen »er« verwenden
  rationale: Das deutsche Pronomen wäre an mehreren Stellen grammatisch missverständlich. Die Auflösung folgt dem Argument des Abschnitts, ohne eine zusätzliche dogmatische These einzuführen.
- issue: Jakobs Handeln als prophetisches Vorausbild
  choice: »sah im Geist ein Vorausbild«
  alternative: »erkannte durch den Geist sinnbildlich die Kirche«
  rationale: Die stärkere Alternative würde sowohl das Objekt als auch die Art der Inspiration genauer bestimmen, als es die vorliegende Evidenz erlaubt.
- issue: Bundeserbe und Vorrang
  choice: Die exklusive Behauptung des Autors wird direkt wiedergegeben.
  alternative: Durch relativierende Formulierungen die supersessionistische Stoßrichtung mildern
  rationale: Eine Übersetzung darf die historische theologische Spannung des Textes weder verschärfen noch aus apologetischen Gründen abschwächen.
- issue: Abrahams Glaube »allein«
  choice: »als dieser allein glaubte« bleibt im Text erhalten.
  alternative: »als er glaubte«
  rationale: Das im überlieferten Zeugen vorhandene »allein« ist argumentativ bedeutsam, auch wenn seine genaue griechische Textgrundlage noch zu prüfen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer argumentativer Gliederung. Die direkte Anrede im Plural und die rhetorischen Fragen bleiben erhalten. Archaismen wie »siehe« erscheinen nur innerhalb der Schriftzitate. Da eine direkte Prüfung der griechischen und lateinischen Zeugen laut Datensatz noch aussteht, ist der Entwurf quellennah zur bereitgestellten alten Übersetzung gehalten; besonders die Komparative »früher/größer«, die Pronomenbezüge und die zusammengesetzten Schriftzitate sollten bei der Kollation überprüft werden.
