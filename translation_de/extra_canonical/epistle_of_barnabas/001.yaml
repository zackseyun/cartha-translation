base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/001.yaml
  text: 'I greet you, sons and daughters, in the name of the Lord who loved us, in peace.


    Seeing that the ordinances of God are great and rich unto you, I rejoice with exceedingly great and overflowing joy over your blessed and glorious spirits; so innate is the grace of the spiritual gift you have received.


    Therefore, I congratulate myself all the more, hoping to be saved, because I truly see that the Spirit has been poured out among you from the riches of the Lord’s fountain. The greatly desired sight of you amazed me so much concerning you.


    Being persuaded of this, and knowing within myself that, after saying many things among you, I know that the Lord traveled with me on the way of righteousness, I am also wholly compelled to love you more than my own soul—for great faith and love dwell in you through the hope of the life that is his—considering this, therefore, that,


    if I take care to share with you some portion of what I received, it will become my reward for having ministered to such spirits, I was eager to send you something small, so that together with your faith you might also have complete knowledge.


    Well then, there are three ordinances of the Lord: *the hope of life, which is the beginning and end of our faith; righteousness, which is the beginning and end of judgment; and love displayed in gladness and exultation, the testimony of works of righteousness.*


    For the Lord made known to us through his prophets things past and present, giving us likewise the firstfruits of the taste of things future. Seeing each of these things coming to pass one by one, just as he said, we ought to offer a richer and higher offering to the fear of him. But I, not as though I were a teacher, but as one of you, will set out a few things by which you will be gladdened in the present circumstances.'
translation:
  language: de
  text: '**Barnabas 1**


    Ich grüße euch, Söhne und Töchter, im Namen des Herrn, der uns geliebt hat, in Frieden.


    Da Gottes gerechte Bestimmungen für euch groß und reich sind, freue ich mich über alle Maßen und mit überströmender Freude über euren gesegneten und herrlichen Geist. So tief ist die Gnade der geistlichen Gabe in euch eingepflanzt, die ihr empfangen habt.


    Darum beglückwünsche ich mich selbst umso mehr in der Hoffnung, gerettet zu werden; denn ich sehe wirklich, dass der Geist aus der Fülle der Quelle des Herrn über euch ausgegossen ist. Der lang ersehnte Anblick von euch hat mich tief beeindruckt.


    Davon bin ich überzeugt. Und weil ich mir bewusst bin, dass der Herr, nachdem ich vieles unter euch gesagt hatte, mit mir auf dem Weg der Gerechtigkeit gegangen ist, sehe ich mich ganz und gar dazu gedrängt, euch mehr zu lieben als mein eigenes Leben. Denn großer Glaube und große Liebe wohnen in euch aufgrund der Hoffnung auf das Leben, das von ihm kommt.


    Weil ich also bedacht habe, dass es mir zum Lohn werden wird, solchen Menschen zu dienen, wenn ich euch einen Teil dessen weitergebe, was ich empfangen habe, war ich bestrebt, euch etwas Weniges zu schreiben. So sollt ihr neben eurem Glauben auch vollkommene Erkenntnis besitzen.


    Drei Bestimmungen des Herrn gibt es nun: die Hoffnung auf Leben, Anfang und Ziel unseres Glaubens; die Gerechtigkeit, Anfang und Ziel des Gerichts; und die Liebe in Freude und Jubel, das Zeugnis gerechter Werke.[a]


    Denn der Herr hat uns durch seine Propheten das Vergangene und das Gegenwärtige bekannt gemacht und uns zugleich einen Vorgeschmack auf das Zukünftige gegeben. Da wir sehen, wie dies alles Stück für Stück eintrifft, so wie er es gesagt hat, sollen wir der Ehrfurcht vor ihm eine reichere und erhabenere Gabe darbringen. Ich aber will euch nicht wie ein Lehrer, sondern als einer von euch einige wenige Dinge darlegen, die euch in der gegenwärtigen Lage Freude bereiten werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die knappe Reihung lässt das genaue Verhältnis von Liebe, Freude, Jubel und dem Zeugnis gerechter Werke offen. Möglich ist auch die Auffassung: „Liebe, die sich in Freude und Jubel zeigt, ist das Zeugnis gerechter Werke.“'
    reason: Bewahrt eine syntaktische Mehrdeutigkeit, statt die Aussage im Haupttext stillschweigend festzulegen.
lexical_decisions:
- source_word: δικαιώματα (über den englischen Zeugen als „ordinances“ belegt)
  choice: gerechte Bestimmungen
  rationale: Bewahrt sowohl den normativen Sinn von göttlichen Satzungen als auch den Bezug auf das von Gott als recht Festgesetzte; „Verordnungen“ wäre im heutigen Deutsch zu bürokratisch.
- source_word: πνεύματα / „spirits“
  choice: 'Geist; später: Menschen'
  rationale: Im ersten Vorkommen bleibt die geistliche Charakterisierung eng erhalten. Beim Dienst an „solchen Geistern“ vermeidet „solchen Menschen“ eine im Deutschen missverständliche Bezeichnung körperloser Wesen.
- source_word: ψυχή / „soul“
  choice: eigenes Leben
  rationale: Gibt die idiomatische Bedeutung der Selbsthingabe natürlich wieder, ohne eine technische Seelenlehre in die Aussage einzutragen.
- source_word: φόβος / „fear“
  choice: Ehrfurcht
  rationale: Im kultisch-ethischen Zusammenhang bezeichnet das Wort die Gottesfurcht als ehrfürchtige Haltung, nicht bloß Angst.
- source_word: ἀπαρχή / „firstfruits“
  choice: Vorgeschmack
  rationale: Die Verbindung mit „taste“ verlangt im Deutschen eine Geschmacksmetapher; „Erstlingsgabe des Geschmacks“ wäre unnatürlich.
theological_decisions:
- issue: „das Leben, das sein ist“ beziehungsweise „the life which is His“
  choice: das Leben, das von ihm kommt
  alternative: das Leben, das ihm gehört
  rationale: Die Formulierung bleibt christologisch offen und bezeichnet den Herrn als Ursprung des erhofften Lebens, ohne eine weitergehende dogmatische Präzisierung zu erzwingen.
- issue: Verhältnis von Glaube, Gerechtigkeit und Liebe in den drei Bestimmungen
  choice: Die drei Glieder werden parallel und ohne harmonisierende Erklärung wiedergegeben.
  alternative: Die Glieder als systematische Stufen des Heilswegs auslegen
  rationale: Der knappe, spannungsreiche Aufbau des Textes soll stehen bleiben; eine konfessionelle Systematisierung wäre nicht textlich geboten.
- issue: Aussage über den Lohn des Dienstes
  choice: „es mir zum Lohn werden wird“
  alternative: den Lohn ausschließlich als gegenwärtige Freude oder ausschließlich als endzeitliche Vergeltung erklären
  rationale: Die zeitliche und theologische Reichweite von „Lohn“ bleibt im Text unbestimmt und wird daher nicht eingeengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Lange Perioden wurden behutsam gegliedert, ohne die gedanklichen Verknüpfungen aufzulösen. Da im Auftrag nur ein öffentlicher englischer Übersetzungszeuge vorliegt und die direkte Prüfung der griechischen und lateinischen Zeugen ausdrücklich noch aussteht, sind die source-word-Angaben und Entscheidungen als vorläufig zu behandeln.
