  revision_rationale: Die Revision beseitigt ungestützte Zusätze und stellt zentrale lexikalische sowie syntaktische Bezüge des Zeugen wieder her. Wo der Wortlaut schwierig oder mehrdeutig ist, wird die Spannung beibehalten; insbesondere wird die possessive Aussage über das Leben nicht christologisch oder dogmatisch ausgelegt. Die Formulierung „drei Lehren des Herrn“ trägt den lehrhaften Charakter der Dreierreihe in natürlichem modernen Deutsch und vermeidet die unmotivierte Qualifikation „gerechte Bestimmungen“.
