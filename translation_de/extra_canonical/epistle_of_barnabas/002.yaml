base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/002.yaml
  text: 'Seeing, then, that the days are evil and that the Active One himself has the authority, we ought to pay attention to ourselves and seek out the ordinances of the Lord.


    The aids of our faith are fear and patience, and our allies are long-suffering and self-restraint.


    While these abide in a pure spirit in matters relating to the Lord, wisdom, understanding, science, and knowledge rejoice with them.


    For he has made known to us by all the prophets that he desires neither sacrifices nor whole burnt offerings nor oblations, saying at one time:


    “What is the multitude of your sacrifices to me?” says the Lord. “I am full of whole burnt offerings, and I do not desire the fat of lambs or the blood of bulls and goats—not even if you come to be seen by me. Or who required these things at your hands? You shall no longer continue to tread my court. If you bring fine flour, it is in vain; incense is an abomination to me. Your new moons and your Sabbaths I cannot endure.”


    Therefore, he annulled these things so that the new law of our Lord Jesus Christ, being free from the yoke of constraint, might have an oblation not made by human hands.


    And he says to them again: “Did [I] command your fathers, when they went forth from the land of Egypt, to bring me whole burnt offerings and sacrifices?


    “No. This was my command to them: Let none of you bear an evil grudge against his neighbor in his heart, and do not love a false oath.”


    So, unless we are without understanding, we ought to perceive the mind of the goodness of our Father. For he speaks to us, desiring that we should not go astray like them but should seek how we may approach him.


    Thus he speaks to us: “The sacrifice to God is a broken heart; the smell of a sweet savor to the Lord is a heart that glorifies its Maker.” Therefore, brethren, we ought to learn accurately concerning our salvation, lest the Evil One, having effected an entrance of error in us, should fling us away from our life.'
translation:
  language: de
  text: 'Da nun die Tage böse sind und der Wirkende selbst die Macht hat,[a] müssen wir auf uns achten und nach den Weisungen des Herrn forschen.


    Hilfen unseres Glaubens sind Gottesfurcht und Geduld; unsere Mitstreiter sind Langmut und Selbstbeherrschung.


    Solange diese in den Dingen des Herrn in einem reinen Geist bleiben, freuen sich mit ihnen Weisheit, Verständnis, Einsicht und Erkenntnis.


    Denn durch alle Propheten hat er uns offenbart, dass er weder Schlachtopfer noch Brandopfer noch Opfergaben will. So sagt er an einer Stelle:


    »Was soll mir die Menge eurer Schlachtopfer?«, spricht der Herr. »Ich bin der Brandopfer satt; das Fett der Lämmer und das Blut der Stiere und Böcke begehre ich nicht – auch dann nicht, wenn ihr kommt, um vor mir zu erscheinen. Wer hat dies von euren Händen verlangt? Ihr sollt nicht länger meinen Vorhof zertreten. Wenn ihr Feinmehl bringt, ist es vergeblich; Räucherwerk ist mir ein Gräuel. Eure Neumonde und Sabbate kann ich nicht ertragen.«[b]


    Diese Dinge hob er also auf, damit das neue Gesetz unseres Herrn Jesus Christus, frei vom Joch des Zwangs, eine Opfergabe habe, die nicht von Menschenhand gemacht ist.[c]


    Und wiederum sagt er zu ihnen: »Habe ich euren Vätern, als sie aus dem Land Ägypten auszogen, etwa geboten, mir Brandopfer und Schlachtopfer darzubringen?


    Nein. Vielmehr gebot ich ihnen dies: Keiner von euch trage in seinem Herzen einen bösen Groll gegen seinen Nächsten, und liebt keinen falschen Eid.«[d]


    Wenn wir nicht ohne Verständnis sind, müssen wir also erkennen, worauf die Güte unseres Vaters bedacht ist. Denn er spricht zu uns, weil er will, dass wir nicht wie jene in die Irre gehen, sondern danach suchen, wie wir ihm nahen können.


    So spricht er zu uns: »Das Opfer für Gott ist ein zerbrochenes Herz; ein Herz, das seinen Schöpfer verherrlicht, ist für den Herrn ein Duft lieblichen Wohlgeruchs.«[e] Deshalb, Geschwister, müssen wir genau erkennen, worin unser Heil besteht, damit der Böse nicht den Irrtum in uns eindringen lässt und uns so aus unserem Leben hinauswirft.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Der Wirkende« ist eine ungewöhnliche Bezeichnung. Im Zusammenhang ist wohl die böse Gegenmacht gemeint; der Wortlaut nennt sie hier jedoch nicht ausdrücklich Satan oder Teufel.
    reason: Bewahrt eine echte lexikalische und theologische Mehrdeutigkeit.
  - marker: b
    text: Das Zitat folgt in freier und verkürzter Form Jesaja 1,11–13.
    reason: Kennzeichnet die alttestamentliche Quelle, ohne den Wortlaut des Barnabasbriefs durch eine moderne Bibelfassung zu ersetzen.
  - marker: c
    text: Der Text erklärt nicht ausdrücklich, worin diese »nicht von Menschenhand« gemachte Opfergabe besteht. Der folgende Abschnitt verbindet sie mit dem zerbrochenen, Gott verherrlichenden Herzen.
    reason: Verhindert eine vorschnelle konfessionelle oder liturgische Festlegung.
  - marker: d
    text: Hier werden Jeremia 7,22 und Sacharja 8,17 miteinander verbunden beziehungsweise frei wiedergegeben.
    reason: Macht die zusammengesetzte prophetische Anspielung transparent.
  - marker: e
    text: Die erste Aussage greift Psalm 51,19 auf; die zweite formuliert das Bild vom wohlgefälligen Opferduft weiter.
    reason: Weist die Schriftanklänge aus und unterscheidet Zitat und freie Fortschreibung.
lexical_decisions:
- source_word: the Active One / Greek witness likely τοῦ ἐνεργοῦντος
  choice: der Wirkende
  rationale: Bewahrt die auffällige und in diesem Zusammenhang wohl auf die böse Gegenmacht bezogene substantivische Bezeichnung, ohne sie stillschweigend mit »Teufel« oder »Satan« gleichzusetzen.
- source_word: ordinances
  choice: Weisungen
  rationale: Natürliches modernes Deutsch, das verbindliche göttliche Anordnungen bezeichnet, ohne auf rein kultische Satzungen verengt zu werden.
- source_word: fear
  choice: Gottesfurcht
  rationale: Der Kontext des Glaubens und der Dinge des Herrn macht ehrfürchtige Gottesfurcht wahrscheinlicher als allgemeine Angst.
- source_word: science
  choice: Einsicht
  rationale: Das moderne deutsche »Wissenschaft« wäre in dieser antiken Tugendreihe irreführend; »Einsicht« hält den Erkenntnisbezug fest und lässt sich neben »Erkenntnis« unterscheiden.
- source_word: oblation
  choice: Opfergabe
  rationale: Gibt den kultischen Sinn allgemein und verständlich wieder, ohne eine bestimmte spätere liturgische Terminologie einzutragen.
- source_word: broken heart
  choice: zerbrochenes Herz
  rationale: Bewahrt die biblische Bildsprache und ihren Bußton stärker als das glättende »reumütiges Herz«.
- source_word: brethren
  choice: Geschwister
  rationale: Gibt die gemeinschaftliche Anrede im heutigen Standarddeutsch inklusiv und natürlich wieder.
theological_decisions:
- issue: Identität des »Wirkenden«
  choice: Die Bezeichnung bleibt als »der Wirkende« stehen.
  alternative: »der Böse«, »der Teufel« oder »Satan«
  rationale: Der Schluss nennt ausdrücklich den Bösen, doch der Titel am Anfang ist ungewöhnlich und sollte nicht durch eine eindeutige Identifikation eingeebnet werden.
- issue: Aussage über die Aufhebung der Opfer
  choice: »Diese Dinge hob er also auf« wird entsprechend der Argumentation des Barnabasbriefs wiedergegeben.
  alternative: 'Abschwächend: »Diese Dinge wies er zurück«'
  rationale: Der Text behauptet eine Aufhebung im Blick auf das neue Gesetz; die Übersetzung bildet diese theologische Spannung ab, ohne sie systematisch auszuweiten.
- issue: Nicht von Menschenhand gemachte Opfergabe
  choice: Die sachliche Mehrdeutigkeit bleibt erhalten.
  alternative: Festlegung auf das menschliche Herz, Lobpreis, Eucharistie oder Christus
  rationale: Der folgende Zusammenhang deutet auf das verherrlichende Herz, doch der Satz selbst benennt die Opfergabe nicht ausdrücklich.
- issue: Prophetenzitate als zusammengesetzte Schriftverwendung
  choice: Die Zitate werden als Zitate des Briefautors übersetzt, ohne sie an moderne Bibelfassungen anzugleichen.
  alternative: Wortlaut einer etablierten deutschen Bibelübersetzung einsetzen
  rationale: Der Barnabasbrief verbindet und adaptiert prophetische Texte; seine eigene Gestalt soll sichtbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Satzstrukturen. Prophetische Rede bleibt feierlich, aber nicht archaisierend. Aufgrund der noch ausstehenden direkten Prüfung der griechischen und lateinischen Zeugen ist der Entwurf am bereitgestellten englischen Textzeugen orientiert; besonders die Bezeichnung »der Wirkende« und die viergliedrige Erkenntnisreihe sollten bei der Quellenprüfung erneut kontrolliert werden.
