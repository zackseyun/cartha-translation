    »Was soll mir die Menge eurer Schlachtopfer?«, spricht der Herr. »Ich bin der Brandopfer satt; das Fett der Lämmer und das Blut der Stiere und Böcke begehre ich nicht – auch dann nicht, wenn ihr kommt, um vor mir zu erscheinen. Oder wer hat dies von euren Händen verlangt? Ihr sollt nicht länger meinen Vorhof zertreten. Wenn ihr Feinmehl bringt, ist es vergeblich; Räucherwerk ist mir ein Gräuel. Eure Neumonde und Sabbate kann ich nicht ertragen.«[b]



