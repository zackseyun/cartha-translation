  text: 'For this purpose the Lord endured handing over his flesh to corruption, so that we might be cleansed by the forgiveness of sins, a cleansing that comes through the blood of his sprinkling.


    For the Scripture concerning him contains some things relating to Israel and some relating to us. It says: “He was wounded for your transgressions, and he was bruised for our sins. By his stripes we were healed. Like a sheep he was led to slaughter, and like a lamb silent before its shearer.”


    Therefore, we ought to be very thankful to the Lord, because he has revealed the past to us, made us wise concerning the present, and not left us without understanding concerning the future.


    Now the Scripture says, “Not unjustly is the net spread for the birds.” He means that a person will justly perish if, despite knowing the way of righteousness, he forces himself onto the way of darkness.


    There is also this, my brothers: If the Lord endured suffering for our souls, though he was Lord of the whole world—the one to whom God said at the foundation of the world, “Let us make man in our image and likeness”—then how did he endure suffering at the hands of human beings?


    Understand this. The prophets, having received grace from him, prophesied concerning him. But he himself endured suffering so that he might destroy death and show forth the resurrection of the dead, because it was necessary for him to be manifested in the flesh;


    so that at the same time he might redeem the promise made to the fathers and, by preparing the new people for himself, show while he was on earth that, having brought about the resurrection, he himself will exercise judgment.


    Furthermore, he preached, teaching Israel and performing so many wonders and miracles, and he loved him exceedingly.


    When he chose his own apostles, who were to proclaim his gospel—men who were sinners beyond every sin, so that he might show that he came not to call the righteous but sinners—then he manifested himself to be the Son of God.


    For if he had not come in the flesh, people could not have looked upon him and been saved, since they cannot face the rays of the sun, which will cease to be and is the work of his own hands.


    Therefore, the Son of God came in the flesh for this purpose: to sum up the complete tale of their sins against those who persecuted and killed his prophets.


    For this purpose, then, he endured. For God says that the wounds of his flesh came from them: “When they strike their own shepherd, then the sheep of the flock will be lost.”


    But he himself desired to suffer in this way, for it was necessary for him to suffer on a tree. For he that prophesied said concerning him, “Spare my soul from the sword,” and, “Pierce my flesh with nails, for the congregations of evildoers have risen up against me.”


    And again he says, “Behold, I have given my back to stripes and my cheeks to smitings, and I have set my face as a hard rock.”'
translation:
  language: de
  text: 'Barnabasbrief 5


    Zu diesem Zweck nahm der Herr es auf sich, sein Fleisch dem Verderben preiszugeben,[a] damit wir durch die Vergebung der Sünden gereinigt würden – durch jene Reinigung, die durch das Blut seiner Besprengung geschieht.


    Denn die Schrift enthält über ihn manches, was Israel betrifft, und manches, was uns betrifft. Sie sagt: »Er wurde wegen eurer Übertretungen verwundet und wegen unserer Sünden zerschlagen. Durch seine Striemen wurden wir geheilt. Wie ein Schaf wurde er zur Schlachtung geführt, und wie ein Lamm vor seinem Scherer verstummt.«


    Darum müssen wir dem Herrn sehr dankbar sein: Er hat uns das Vergangene offenbart, uns für die Gegenwart weise gemacht und uns im Blick auf die Zukunft nicht ohne Einsicht gelassen.


    Nun sagt die Schrift: »Nicht zu Unrecht wird das Netz vor den Vögeln ausgespannt.«[b] Damit meint sie: Mit Recht geht ein Mensch zugrunde, wenn er den Weg der Gerechtigkeit kennt und sich dennoch auf den Weg der Finsternis zwingt.


    Hinzu kommt dies, meine Brüder: Wenn der Herr es auf sich nahm, für unsere Seelen zu leiden, obwohl er der Herr der ganzen Welt war – er, zu dem Gott bei der Grundlegung der Welt sagte: »Lasst uns den Menschen nach unserem Bild und Gleichnis machen« –, wie konnte er es dann auf sich nehmen, durch Menschenhand zu leiden?


    Versteht: Die Propheten empfingen Gnade von ihm und weissagten über ihn. Er selbst aber nahm das Leiden auf sich, um den Tod zu vernichten und die Auferstehung der Toten sichtbar zu machen; denn er musste im Fleisch offenbar werden.


    So sollte er zugleich die den Vätern gegebene Verheißung einlösen und sich ein neues Volk bereiten. Während er auf der Erde war, sollte er zeigen, dass er, nachdem er die Auferstehung herbeigeführt hat, selbst Gericht halten wird.


    Darüber hinaus verkündigte er seine Botschaft, lehrte Israel, tat so viele Wunder und Zeichen und liebte es überaus.


    Als er seine eigenen Apostel auswählte, die sein Evangelium verkünden sollten – Männer, die Sünder über jedes Maß hinaus waren,[c] damit er zeigte, dass er nicht gekommen war, Gerechte zu rufen, sondern Sünder –, da offenbarte er sich als Sohn Gottes.


    Denn wäre er nicht im Fleisch gekommen, hätten die Menschen ihn weder anschauen noch gerettet werden können. Sie können ja nicht einmal den Strahlen der Sonne standhalten, obwohl sie vergehen wird und ein Werk seiner eigenen Hände ist.


    Darum kam der Sohn Gottes zu diesem Zweck im Fleisch: Er sollte das volle Maß der Sünden jener Menschen zum Abschluss bringen, die seine Propheten verfolgt und getötet hatten.[d]


    Zu diesem Zweck also nahm er das Leiden auf sich. Denn von den Wunden seines Fleisches sagt Gott, dass sie von ihnen kamen: »Wenn sie ihren eigenen Hirten schlagen, werden die Schafe der Herde verloren gehen.«[e]


    Er selbst aber wollte auf diese Weise leiden; denn er musste an einem Holz leiden. Der Prophet sagte nämlich über ihn: »Verschone meine Seele vor dem Schwert«, und: »Durchbohrt mein Fleisch mit Nägeln, denn Versammlungen von Übeltätern haben sich gegen mich erhoben.«[e]


    Und wiederum sagt er: »Siehe, ich habe meinen Rücken den Schlägen hingehalten und meine Wangen den Hieben; mein Gesicht habe ich hart wie Fels gemacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Verderben« kann hier körperlichen Verfall, Vernichtung oder Tod bezeichnen. Da die direkte Prüfung des griechischen und lateinischen Wortlauts noch aussteht, bleibt die Übersetzung bewusst weit.
    reason: Lexikalische Mehrdeutigkeit und ausstehende Originalsprachenprüfung.
  - marker: b
    text: Die sprichwortartige Schriftaussage wird in der überlieferten Form wiedergegeben. Ihr Wortlaut weicht von der geläufigen Fassung in Sprüche 1,17 ab und ist in seiner Bedeutung nicht eindeutig.
    reason: Schwierige Schriftanspielung und abweichende Zitierform.
  - marker: c
    text: 'Wörtlich nach dem vorliegenden Zeugnis etwa: »Sünder über jede Sünde hinaus«. Die ungewöhnlich scharfe Aussage über die Apostel wurde nicht abgeschwächt.'
    reason: Bewahrung einer theologisch und rhetorisch auffälligen Formulierung.
  - marker: d
    text: Die zugrunde liegende Wendung kann das Zusammenfassen, Vollenden oder Auf-das-volle-Maß-Bringen ihrer Sünden meinen. Gemeint sind offenbar die Sünden der Verfolger und Mörder der Propheten; die genaue Syntax bedarf noch der Prüfung an den griechischen und lateinischen Zeugen.
    reason: Syntaktische und lexikalische Unsicherheit.
  - marker: e
    text: Die folgenden Schriftworte werden in einer Form zitiert oder miteinander verbunden, die von den heute geläufigen Fassungen der betreffenden alttestamentlichen Stellen abweicht. Die Übersetzung folgt hier dem Wortlaut des Barnabasbriefs und gleicht ihn nicht stillschweigend an moderne Bibelübersetzungen an.
    reason: Kennzeichnung freier, zusammengesetzter oder textlich abweichender Schriftzitate.
lexical_decisions:
- source_word: corruption (Greek source review pending; likely φθορά)
  choice: Verderben
  rationale: Bewahrt das Bedeutungsspektrum von körperlichem Verfall, Vernichtung und Verderben, ohne vorschnell nur »Verwesung« oder nur »Tod« festzulegen.
- source_word: blood of his sprinkling
  choice: Blut seiner Besprengung
  rationale: Erhält die kultische Bildsprache der Besprengung und die ungewöhnliche Genitivverbindung des Zeugnisses.
- source_word: way of righteousness / way of darkness
  choice: Weg der Gerechtigkeit / Weg der Finsternis
  rationale: Bewahrt den frühchristlichen Zwei-Wege-Kontrast in natürlichem, aber traditionsbewusstem Deutsch.
- source_word: manifested in the flesh
  choice: im Fleisch offenbar werden
  rationale: Gibt die Inkarnationssprache formal wieder und vermeidet eine interpretierende Paraphrase.
- source_word: tree
  choice: Holz
  rationale: Das biblisch-frühchristliche Kreuzeswort bezeichnet wörtlich Holz beziehungsweise Baum; »Holz« bewahrt die Anspielung, ohne das Bild stillschweigend durch »Kreuz« zu ersetzen.
- source_word: sum up the complete tale of their sins
  choice: das volle Maß der Sünden … zum Abschluss bringen
  rationale: Drückt Vollendung und Zusammenfassung aus, ohne die schwierige Aussage in eine bestimmte Sühne- oder Gerichtstheorie umzudeuten.
theological_decisions:
- issue: Das Leiden des Herrn und menschliche Verantwortung
  choice: Sowohl sein freiwilliges Leiden als auch die Schuld seiner Verfolger werden ausdrücklich beibehalten.
  alternative: Das Leiden ausschließlich als göttliche Notwendigkeit oder ausschließlich als menschliche Gewalttat darstellen.
  rationale: 'Der Abschnitt hält beide Aussagen spannungsvoll zusammen: Er selbst wollte leiden, zugleich kamen die Wunden von Menschen.'
- issue: Christologische Präexistenz
  choice: Die Aussagen, der Herr sei Herr der Welt, Empfänger von Genesis 1,26 und Geber prophetischer Gnade, bleiben in ihrer direkten Zuordnung zu Christus erhalten.
  alternative: Die Bezüge abschwächen oder als bloße nachträgliche Anwendung alttestamentlicher Texte formulieren.
  rationale: Die Argumentation des Barnabasbriefs setzt diese Zuordnung voraus; eine Abschwächung würde seine Christologie verändern.
- issue: Gericht nach der Auferstehung
  choice: »selbst Gericht halten wird«
  alternative: 'Passiv oder unpersönlich: »Gericht stattfinden wird«.'
  rationale: Bewahrt die ausdrückliche Aussage, dass Christus selbst das Gericht ausüben wird.
- issue: Beschreibung der Apostel als überaus sündig
  choice: Die anstößige Zuspitzung wird nicht harmonisiert.
  alternative: »gewöhnliche Sünder« oder »als Sünder geltende Männer«.
  rationale: Der Text begründet mit dieser extremen Formulierung die Sendung zu Sündern; ihre Spannung soll sichtbar bleiben.
- issue: Israel und das neue Volk
  choice: Beide Bezeichnungen bleiben nebeneinander stehen, ohne ihre Beziehung systematisch zu erklären.
  alternative: Das neue Volk ausdrücklich als Ersatz Israels oder als mit Israel identisch bezeichnen.
  rationale: Der Abschnitt bietet eine polemische Gegenüberstellung, entfaltet hier aber keine vollständige Ekklesiologie; konfessionelle Festlegungen wären ein Import.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit überschaubaren Satzperioden. Traditionell-theologische Schlüsselbegriffe wie »Fleisch«, »Gerechtigkeit«, »offenbar werden«, »Auferstehung« und »Gericht« bleiben erhalten. Archaismen wurden vermieden. Wegen der ausdrücklich noch ausstehenden Prüfung des griechischen und lateinischen Textes ist dies ein publikationsnaher, aber textkritisch vorläufiger Entwurf auf Grundlage des angegebenen öffentlichen englischen Zeugnisses und der konsultierten POB-Brücke.
