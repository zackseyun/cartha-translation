base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/008.yaml
  text: 'But what do you think the type means, where the commandment is given to Israel that those men whose sins are full grown must offer a heifer, slaughter it, and burn it; and then that the children must take up the ashes and cast them into vessels, and twist the scarlet wool on a tree—see, here again is the type of the cross and the scarlet wool—and the hyssop; and that, this done, the children should sprinkle the people one by one, that they may be purified from their sins?


    Understand how plainly it is spoken to you: the calf is Jesus; the men who offer it, being sinners, are those who offered him for slaughter. After this it is no more men (who offer); the glory is no more for sinners.


    The children who sprinkle are those who preached to us the forgiveness of sins and the purification of our hearts, those to whom, being twelve in number for a testimony to the tribes—for there are twelve tribes of Israel—he gave authority over the Gospel, that they should preach it.


    But why are the children who sprinkle three in number? For a testimony to Abraham, Isaac, and Jacob, because these are mighty before God.


    Then there is the placing of the wool on the tree. This means that the kingdom of Jesus is on the cross, and that those who set their hope on him shall live forever.


    And why are the wool and the hyssop at the same time? Because in his kingdom there shall be evil and foul days, in which we shall be saved; for he who suffers pain in the flesh is healed through the foulness of the hyssop.


    Now to us indeed it is manifest that these things so befell for this reason, but to them they were dark, because they did not hear the voice of the Lord.'
translation:
  language: de
  text: 'Was meint ihr nun, was das Sinnbild bedeutet? Israel wird geboten, dass Männer, deren Sünden zur Reife gelangt sind, eine junge Kuh darbringen, sie schlachten und verbrennen. Dann sollen die Kinder die Asche aufnehmen, sie in Gefäße schütten und die scharlachrote Wolle um ein Holz winden – seht, auch hier begegnen uns wieder das Sinnbild des Kreuzes und die scharlachrote Wolle – samt dem Ysop. Danach sollen die Kinder das Volk einzeln besprengen, damit die Menschen von ihren Sünden gereinigt werden.


    Versteht, wie deutlich hier zu euch gesprochen wird: Das Kalb ist Jesus. Die Männer, die es darbringen, sind Sünder; sie sind diejenigen, die ihn zur Schlachtung auslieferten. Danach sind es nicht mehr Männer, die darbringen; die Ehre kommt den Sündern nicht mehr zu.[a]


    Die Kinder, die besprengen, sind diejenigen, die uns die Vergebung der Sünden und die Reinigung unseres Herzens verkündigt haben. Ihnen, die zum Zeugnis für die Stämme zwölf an der Zahl waren – denn Israel hat zwölf Stämme –, gab er Vollmacht über das Evangelium, damit sie es verkündigten.


    Warum aber sind die Kinder, die besprengen, drei an der Zahl? Zum Zeugnis für Abraham, Isaak und Jakob; denn sie sind mächtig vor Gott.


    Dann wird die Wolle an dem Holz befestigt. Das bedeutet: Das Reich Jesu ist am Kreuz, und wer seine Hoffnung auf ihn setzt, wird ewig leben.[b]


    Und warum erscheinen Wolle und Ysop zusammen? Weil es in seinem Reich böse und widrige Tage geben wird, in denen wir gerettet werden. Denn wer am Fleisch leidet, wird durch das Herbe des Ysops geheilt.[c]


    Uns ist also offenbar, dass dies aus diesem Grund so geschah; ihnen aber blieb es dunkel, weil sie die Stimme des Herrn nicht hörten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Satz ist in der vorliegenden Überlieferung schwer verständlich. Auch möglich ist eine engere Wiedergabe: „Danach sind es nicht mehr Männer; die Herrlichkeit gehört nicht mehr den Sündern.“ Eine Prüfung der griechischen und lateinischen Lesarten steht noch aus.'
    reason: Kennzeichnet echte textliche und syntaktische Unsicherheit, ohne sie stillschweigend aufzulösen.
  - marker: b
    text: 'Wörtlich: „Das Reich Jesu ist am Kreuz.“ Gemeint sein kann auch, dass seine Königsherrschaft am Kreuz sichtbar wird oder mit ihm verbunden ist.'
    reason: Bewahrt die ungewöhnliche Präposition und nennt mögliche Bedeutungsrichtungen, ohne eine davon zur einzig richtigen zu erklären.
  - marker: c
    text: Die Wendung über die „Widrigkeit“ oder „Unreinheit“ des Ysops ist unsicher. Der Gedankengang verbindet offenbar leibliches Leiden mit der unangenehmen Beschaffenheit des Ysops und mit Heilung.
    reason: Der englische Zeuge „foulness“ ist semantisch problematisch; die Fußnote macht die vorläufige Wiedergabe transparent.
lexical_decisions:
- source_word: type (τύπος, source-language review pending)
  choice: Sinnbild
  rationale: Gibt den typologischen Sinn natürlich und verständlich wieder, ohne das moderne Fremdwort „Typus“ vorauszusetzen.
- source_word: heifer / calf
  choice: junge Kuh / Kalb
  rationale: Bewahrt den auffälligen Wechsel des überlieferten englischen Zeugen von „heifer“ zu „calf“, da die direkte Prüfung der griechischen und lateinischen Lesarten noch aussteht.
- source_word: tree / wood (ξύλον, source-language review pending)
  choice: Holz
  rationale: „Holz“ kann sowohl den Gegenstand des Rituals als auch die typologische Beziehung zum Kreuz ausdrücken; „Baum“ wäre im Deutschen hier unnötig konkret.
- source_word: sprinkle
  choice: besprengen
  rationale: Ein geläufiger, würdiger Ausdruck für die rituelle Anwendung von Reinigungswasser.
- source_word: foulness
  choice: das Herbe
  rationale: Bezieht die Aussage verständlich auf die als unangenehm beziehungsweise bitter gedachte Beschaffenheit des Ysops, ohne eine moralische Unreinheit der Pflanze zu unterstellen.
theological_decisions:
- issue: Typologische Gleichsetzung des Opfertiers mit Jesus
  choice: Die ausdrückliche Aussage „Das Kalb ist Jesus“ bleibt unverändert stehen.
  alternative: 'Die Aussage abschwächen, etwa: „Das Kalb weist auf Jesus hin.“'
  rationale: Der Text formuliert eine direkte typologische Identifikation; eine Abschwächung würde seine frühchristliche Auslegung glätten.
- issue: Zwölf und drei besprengende Kinder
  choice: Beide Zahlenangaben werden ohne Harmonisierung bewahrt.
  alternative: Die Dreizahl auf eine Untergruppe der zwölf beziehen oder textkritisch korrigieren.
  rationale: Der vorgelegte Zeuge enthält beide Angaben und erklärt sie jeweils symbolisch; die Spannung darf ohne Quellenprüfung nicht beseitigt werden.
- issue: „Das Reich Jesu ist am Kreuz“
  choice: Die räumlich-theologische Spannung wird wörtlich bewahrt.
  alternative: 'Deutend formulieren: „Jesu Königsherrschaft gründet sich auf das Kreuz.“'
  rationale: Die Aussage ist bewusst knapp und mehrdeutig; eine erklärende Fassung würde eine bestimmte Deutung festlegen.
- issue: Undurchsichtiger Satz über Männer, Ehre und Sünder
  choice: Nahe Wiedergabe mit Fußnote zur Unsicherheit.
  alternative: Konjektural umformulieren, etwa dass nach Jesu Opfer keine sündigen Opfernden mehr beteiligt seien.
  rationale: Die überlieferte Formulierung ist schwierig; eine eindeutige theologische Erklärung wäre ohne direkte Quellen- und Variantenprüfung spekulativ.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Ton. Die direkte Anrede im Plural und die rhetorischen Fragen bleiben erhalten. Archaismen werden vermieden, kultische Begriffe wie „darbringen“ und „besprengen“ jedoch beibehalten. Der Entwurf ist wegen der noch ausstehenden direkten Prüfung der griechischen und lateinischen Quellen ausdrücklich vorläufig.
