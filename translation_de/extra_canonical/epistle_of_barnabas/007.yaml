  text: 'Understand, therefore, children of gladness, that the good Lord revealed everything to us beforehand, so that we might know to whom we ought to give thanks and praise in all things.


    If, then, the Son of God, who is Lord and future Judge of the living and the dead, suffered so that his wound might give us life, let us believe that the Son of God could not have suffered except for our sake.


    Moreover, when he was crucified, he was given vinegar and gall to drink. Hear how the priests of the temple revealed this matter. Scripture contains a commandment: “Whoever does not observe the fast shall surely die.” Because the Lord was about to offer the vessel of his Spirit in his own person as a sacrifice for our sins, he commanded that the symbol given in Isaac, who was offered on the altar, should also be fulfilled.


    What, then, does he say in the prophet? “Let them eat from the goat that is offered during the fast for all their sins.” Pay careful attention: “Let the priests alone eat all the entrails, unwashed, with vinegar.”


    Why? “Since you are going to give me—who am about to offer my flesh for the sins of my new people—gall with vinegar to drink, you alone must eat, while the people fast and mourn in sackcloth and ashes.” This was to show that he must suffer at their hands.


    Pay attention to the commands he gave: “Take two goats, fair and alike, and offer them. Let the priest take one as a whole burnt offering for sins.”


    But what must they do with the other one? “The one is accursed,” he says. Notice how the symbol of Jesus is revealed.


    “All of you must spit on it and goad it, place scarlet wool around its head, and then let it be cast into the wilderness.” When this has been done, the one who takes the goat into the wilderness leads it away, removes the wool, and puts it on the branch called Rachia, the same plant whose shoots we are accustomed to eat when we find them in the countryside. The fruit of this briar alone is so sweet.


    What, then, does this mean? Pay attention. The one is at the altar, and the other is accursed. Moreover, the accursed one is crowned. For they will see him on that day wearing the long scarlet robe around his flesh, and they will say, “Is this not the one whom we once crucified, treated with contempt, and spat on? Truly, this was the one who then said that he was the Son of God.”


    For how is he like the goat? For this reason it says that the goats must be fair and alike, so that when they see him coming at that time, they may be astonished at his likeness to the goat. See, therefore, the symbol of Jesus who was to suffer.


    But what does it mean that they place the wool among the thorns? It is a symbol of Jesus set forth for the church, since whoever wished to remove the scarlet wool had to suffer many things because of the thorn’s terrible nature and, through affliction, gain mastery over it. Thus he says, “Those who desire to see me and to attain my kingdom must take hold of me through tribulation and affliction.”'
translation:
  language: de
  text: '**Barnabas 7**


    Versteht also, Kinder der Freude: Der gute Herr hat uns alles im Voraus offenbart, damit wir wissen, wem wir in allem Dank und Lob darbringen sollen.


    Wenn nun der Sohn Gottes, der Herr und künftige Richter über Lebende und Tote, gelitten hat, damit seine Wunde uns Leben schenkt, dann lasst uns glauben, dass der Sohn Gottes nur um unseretwillen leiden konnte.


    Als er gekreuzigt wurde, gab man ihm außerdem Essig und Galle zu trinken. Hört, wie die Priester des Tempels dies im Voraus offenbart haben. In der Schrift steht nämlich das Gebot: »Wer das Fasten nicht hält, muss sterben.« Weil der Herr selbst das Gefäß seines Geistes als Opfer für unsere Sünden darbringen sollte, gebot er, dass auch das Vorbild erfüllt würde, das in Isaak gegeben war, als dieser auf dem Altar dargebracht wurde.[a]


    Was sagt er nun durch den Propheten? »Sie sollen von dem Ziegenbock essen, der während des Fastens für alle ihre Sünden dargebracht wird.« Achtet genau darauf: »Nur die Priester sollen alle ungewaschenen Eingeweide mit Essig essen.«[b]


    Warum? »Weil ihr mir, der ich mein Fleisch für die Sünden meines neuen Volkes darbringen werde, Galle mit Essig zu trinken geben werdet, sollt ihr allein essen, während das Volk fastet und in Sack und Asche klagt.« So sollte gezeigt werden, dass er durch ihre Hand leiden musste.


    Achtet auf die Anweisungen, die er gab: »Nehmt zwei schöne, einander gleiche Ziegenböcke und bringt sie dar. Der Priester soll den einen als Ganzbrandopfer für die Sünden nehmen.«


    Doch was sollen sie mit dem anderen tun? »Der eine ist verflucht«, sagt er. Achtet darauf, wie das Vorbild Jesu enthüllt wird.


    »Ihr alle sollt ihn anspucken und stoßen, scharlachrote Wolle um seinen Kopf legen und ihn dann in die Wüste hinaustreiben.« Wenn dies geschehen ist, führt derjenige, der den Ziegenbock in die Wüste bringt, ihn fort, nimmt die Wolle ab und legt sie auf den Zweig, der Rachia heißt.[c] Von derselben Pflanze essen wir gewöhnlich die Triebe, wenn wir sie auf dem Land finden. Allein bei diesem Dornstrauch ist die Frucht so süß.


    Was bedeutet das nun? Achtet darauf: Der eine ist beim Altar, der andere ist verflucht. Und gerade der verfluchte wird gekrönt. Denn an jenem Tag werden sie ihn sehen, wie er das lange scharlachrote Gewand um seinen Leib trägt, und sie werden sagen: »Ist das nicht der, den wir einst gekreuzigt, verachtet und angespuckt haben? Wahrhaftig, er war es, der damals sagte, er sei der Sohn Gottes.«


    Doch inwiefern gleicht er dem Ziegenbock? Deshalb heißt es, die Ziegenböcke sollten schön und einander gleich sein: Wenn sie ihn dann kommen sehen, sollen sie über seine Ähnlichkeit mit dem Ziegenbock staunen. Seht also das Vorbild Jesu, der leiden sollte.


    Doch was bedeutet es, dass sie die Wolle mitten in die Dornen legen? Es ist ein Vorbild Jesu, das der Gemeinde vor Augen gestellt wird. Denn wer die scharlachrote Wolle wegnehmen wollte, musste wegen der furchterregenden Beschaffenheit des Dorns viel erleiden und ihn unter Bedrängnis bezwingen. So sagt er: »Wer mich sehen und in mein Reich gelangen will, muss mich durch Bedrängnis und Leiden ergreifen.«'
