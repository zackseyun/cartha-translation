  footnotes:
  - marker: a
    text: Die hier und im Folgenden als Schriftworte angeführten Sätze entsprechen teilweise keiner bekannten wörtlichen Fassung des Alten Testaments. Der Barnabasbrief verbindet und deutet kultische Überlieferungen typologisch. Die Übersetzung folgt dem vorliegenden Zeugnis; eine Prüfung am griechischen und lateinischen Text steht noch aus.
    reason: Kennzeichnet die quellenkritische Unsicherheit und verhindert, dass die Zitate fälschlich als wörtliche Bibelzitate verstanden werden.
  - marker: b
    text: Die überlieferte Formulierung zu den »ungewaschenen Eingeweiden mit Essig« ist ungewöhnlich und textlich beziehungsweise überlieferungsgeschichtlich schwierig; sie wurde nicht geglättet.
    reason: Bewahrt eine echte Schwierigkeit des Zeugnisses statt sie spekulativ aufzulösen.
  - marker: c
    text: »Rachia« ist als Pflanzenname des vorliegenden Zeugnisses beibehalten. Welche Pflanze genau gemeint ist, ist unsicher.
    reason: Die botanische Identifikation ist ungeklärt und sollte nicht ohne direkte Quellenprüfung festgelegt werden.
lexical_decisions:
- source_word: children of gladness
  choice: Kinder der Freude
  rationale: Bewahrt die bildhafte Anrede in natürlichem, würdigem Deutsch.
- source_word: quick and dead
  choice: Lebende und Tote
  rationale: Gibt die traditionelle Wendung in modernem Standarddeutsch wieder.
- source_word: type
  choice: Vorbild
  rationale: Bezeichnet die typologische Vorausdarstellung, ohne sie mit einem bloßen Sinnbild gleichzusetzen.
- source_word: vessel of His Spirit
  choice: Gefäß seines Geistes
  rationale: Erhält die ungewöhnliche und theologisch offene Metapher des Zeugnisses.
- source_word: whole burnt offering
  choice: Ganzbrandopfer
  rationale: Präziser kultischer Ausdruck für ein vollständig verbranntes Opfer.
- source_word: goad
  choice: stoßen
  rationale: Natürliche Wiedergabe einer körperlichen Misshandlung; die genaue Handlung des zugrunde liegenden Textes bleibt wegen der ausstehenden Quellenprüfung unsicher.
- source_word: Church
  choice: Gemeinde
  rationale: Im frühchristlichen Kontext verständlich und weniger institutionell verengt als »Kirche«.
- source_word: tribulation and affliction
  choice: Bedrängnis und Leiden
  rationale: Bewahrt die Doppelung mit idiomatischen, unterscheidbaren deutschen Begriffen.
theological_decisions:
- issue: Notwendigkeit des Leidens des Sohnes
  choice: »nur um unseretwillen leiden konnte«
  alternative: »nur für uns gelitten hat«
  rationale: Bewahrt die starke modale Aussage des überlieferten englischen Zeugnisses, ohne eine zusätzliche dogmatische Erklärung einzuführen.
- issue: Opfergabe des »Gefäßes seines Geistes«
  choice: Die Metapher bleibt wörtlich erhalten.
  alternative: Auslegung als Leib Christi
  rationale: Die Formulierung ist theologisch gespannt und soll nicht stillschweigend auf eine einzige Deutung festgelegt werden.
- issue: Verantwortung für Jesu Leiden
  choice: »durch ihre Hand«
  alternative: »von ihnen«
  rationale: Gibt die Aussage des Textes wieder, ohne die Bezugsgruppe über das im Abschnitt Gesagte hinaus auszuweiten.
- issue: Typologische Deutung der beiden Ziegenböcke
  choice: »Vorbild Jesu«
  alternative: »Symbol für Jesus«
  rationale: Der Verfasser behauptet eine heilsgeschichtliche Vorausdarstellung; »Vorbild« erhält diesen Anspruch und macht ihn zugleich als Deutung des Barnabasbriefs kenntlich.
- issue: Zugang zum Reich durch Leiden
  choice: Die abschließende Aussage bleibt als direktes Zitat stehen.
  alternative: Eine soteriologische Erläuterung hinzufügen
  rationale: Die Spannung zwischen Ergreifen Christi, Bedrängnis und Reich wird nicht konfessionell aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Archaismen wurden vermieden, kultische Fachbegriffe jedoch beibehalten, wo sie für die Argumentation nötig sind. Der Entwurf ist ausdrücklich vorläufig, da als unmittelbare Grundlage nur das angegebene gemeinfreie englische Zeugnis vorliegt und die Prüfung der griechischen beziehungsweise lateinischen Quellen noch aussteht.
