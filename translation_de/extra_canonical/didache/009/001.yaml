source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τῆς εὐχαριστίας, οὕτως εὐχαριστήσατε·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/001.yaml
  text: 'Concerning the thanksgiving, give thanks in this way:'
translation:
  language: de
  text: 'Was aber die Danksagung[a] betrifft, so dankt auf diese Weise:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eucharistie“. Das griechische Wort kann sowohl die Danksagung als auch die eucharistische Mahlfeier bezeichnen.'
    reason: Bewahrt die kontextuelle Doppelbedeutung von εὐχαριστία.
lexical_decisions:
- source_word: εὐχαριστίας
  choice: Danksagung
  rationale: Das griechische Wort bezeichnet seinem Grundsinn nach das Danken bzw. die Danksagung; im vorliegenden Mahlkontext kann es zugleich die eucharistische Feier bezeichnen. „Danksagung“ bewahrt zudem den Zusammenhang mit dem folgenden Verb εὐχαριστήσατε.
- source_word: εὐχαριστήσατε
  choice: dankt
  rationale: Der Imperativ Aorist, 2. Person Plural, fordert die Gemeinschaft auf, die folgende Danksagung in der angegebenen Weise zu sprechen.
- source_word: οὕτως
  choice: auf diese Weise
  rationale: Die Formulierung verweist voraus auf die unmittelbar folgenden Dankgebete und wird daher mit einem Doppelpunkt abgeschlossen.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den Übergang zu einem neuen, zugleich anschließenden Thema; „aber“ gibt diese leichte Kontrast- bzw. Fortsetzungsfunktion wieder.
theological_decisions:
- issue: Bedeutung von εὐχαριστία im frühchristlichen Mahlkontext
  choice: Danksagung im Haupttext
  alternative: Eucharistie
  rationale: Der Haupttext gibt die transparente lexikalische Bedeutung wieder und erhält das Wortspiel mit „dankt“. Die mögliche Bezeichnung der kultischen Mahlfeier wird in der Fußnote ausdrücklich offengehalten, ohne eine spätere konfessionelle Ausprägung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „Was aber … betrifft, so …“ bildet den griechischen Themenwechsel klar ab; der Doppelpunkt macht die einleitende Funktion des Satzes sichtbar.
