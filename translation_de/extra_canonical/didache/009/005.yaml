id: DID.9.5
reference: Didache 9:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδεὶς δὲ φαγέτω μηδὲ πιέτω ἀπὸ τῆς εὐχαριστίας ὑμῶν, ἀλλ' οἱ βαπτισθέντες εἰς ὄνομα Κυρίου· καὶ γὰρ περὶ τούτου εἴρηκεν ὁ Κύριος· Μὴ δῶτε τὸ ἅγιον τοῖς κυσί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/005.yaml
  text: 'But let no one eat or drink from your thanksgiving except those who have been baptized into the name of the Lord. For also concerning this, the Lord has said: “Do not give what is holy to the dogs.”'
translation:
  language: de
  text: 'Niemand aber soll von eurer Eucharistie essen oder trinken außer denen, die auf den Namen des Herrn getauft worden sind. Denn auch darüber hat der Herr gesagt: »Gebt das Heilige nicht den Hunden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστίας
  choice: Eucharistie
  rationale: Der griechische Ausdruck kann »Danksagung« bedeuten, bezeichnet hier im unmittelbaren Zusammenhang von Essen und Trinken jedoch die eucharistische Mahlfeier. Das im Deutschen geläufige Lehnwort erhält diese kultische Bedeutung.
- source_word: βαπτισθέντες εἰς ὄνομα Κυρίου
  choice: die auf den Namen des Herrn getauft worden sind
  rationale: »Auf den Namen« gibt die Taufformel mit εἰς idiomatisch und zugleich eng am griechischen Wortlaut wieder; der passive Aorist wird als abgeschlossene Voraussetzung ausgedrückt.
- source_word: τὸ ἅγιον
  choice: das Heilige
  rationale: Die substantivierte Form bleibt bewusst allgemein und bewahrt damit die Offenheit des Zitats, statt sie ausdrücklich auf eucharistische Gaben festzulegen.
theological_decisions:
- issue: Zulassung zur Eucharistie
  choice: Der Text beschränkt Essen und Trinken auf Getaufte, ohne weitere kirchliche oder konfessionelle Voraussetzungen zu ergänzen.
  alternative: Die Aussage als umfassende spätere Abendmahlsordnung mit zusätzlichen Zulassungsbedingungen auszuformulieren.
  rationale: Der griechische Text nennt allein die Taufe auf den Namen des Herrn; weitergehende Bedingungen wären eine theologische Eintragung.
- issue: Bezug des Herrenwortes auf die Eucharistie
  choice: »Denn auch darüber« bewahrt die ausdrückliche Anwendung des Herrenwortes auf die vorangehende Regel.
  alternative: Das Zitat nur lose mit »denn der Herr hat gesagt« anzuschließen.
  rationale: περὶ τούτου markiert einen sachlichen Bezug auf die behandelte Frage, ohne das »Heilige« vollständig mit den eucharistischen Elementen gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Niemand aber soll« erhält den regelnden Ton und die Kontrastpartikel δέ. Das traditionelle biblische Zitat »Gebt das Heilige nicht den Hunden« ist verständlich und nah an der griechischen Formulierung.
