revisions:
- from: Wie dieses gebrochene Brot über die Berge verstreut war und, zusammengebracht, eins wurde, so soll deine Gemeinde von den Enden der Erde in dein Reich zusammengebracht werden. Denn dein ist die Herrlichkeit und die Macht durch Jesus Christus[a] in Ewigkeit.
  to: Wie dieses Bruchstück auf den Bergen verstreut war und, als es gesammelt wurde, zu einem wurde, so werde deine Gemeinde von den Enden der Erde her in dein Reich versammelt. Denn dein ist die Herrlichkeit und die Macht durch Jesus Christus in Ewigkeit.
  rationale: Die Revision entfernt die im griechischen Wortlaut nicht ausdrücklich genannte Spezifizierung „Brot“, verbessert die Ortsangabe und gestaltet die wiederholte Sammlung der Gemeinde idiomatisch. Die Gebetsform, die Parallelstruktur und die nicht weiter bestimmte Zielrichtung der Sammlung bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:55:24Z'
review_pass:
  verdict: revise
  source_fidelity: κλάσμα bezeichnet ein abgebrochenes Stück bzw. Bruchstück. Die Wiedergabe „gebrochenes Brot“ legt das Bezugsobjekt ausdrücklich als Brot fest, obwohl das im Wortlaut dieses Verses nicht genannt ist. Der eucharistische Kontext kann diese Deutung nahelegen, sollte aber nicht in den Haupttext hineingetragen werden. Die Richtungsangaben ἀπό ... εἰς ... werden mit „von ... her in“ klar wiedergegeben.
  naturalness: „Auf den Bergen“ ist für ἐπάνω τῶν ὀρέων idiomatischer als „über die Berge“. „Versammelt werden“ ist bei einer Gemeinde natürlich und bewahrt zugleich die Wiederholung des griechischen Sammelmotivs.
  terminology: „Gemeinde“ für ἐκκλησία und „Jesus Christus“ für die feste Formel Ἰησοῦ Χριστοῦ sind angemessen. Eine Fußnote zu „Messias“ ist hier nicht erforderlich; sie fügt keine für das Verständnis des deutschen Haupttexts notwendige Information hinzu.
  issues:
  - severity: medium
    issue: „gebrochenes Brot“ für κλάσμα
    rationale: Die Formulierung expliziert „Brot“, während κλάσμα im Vers selbst lediglich „Bruchstück/Fragment“ sagt. Der Kontext rechtfertigt keine zusätzliche Festlegung im Haupttext.
  - severity: low
    issue: „über die Berge“
    rationale: ἐπάνω τῶν ὀρέων bezieht sich auf eine Lage auf den Bergen; „auf den Bergen“ ist die genauere natürliche Wiedergabe.
