id: DID.9.4
reference: Didache 9:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὥσπερ ἦν τοῦτο κλάσμα διεσκορπισμένον ἐπάνω τῶν ὀρέων καὶ συναχθὲν ἐγένετο ἕν, οὕτω συναχθήτω σου ἡ ἐκκλησία ἀπὸ τῶν περάτων τῆς γῆς εἰς τὴν σὴν βασιλείαν· ὅτι σοῦ ἐστιν ἡ δόξα καὶ ἡ δύναμις διὰ Ἰησοῦ Χριστοῦ εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/004.yaml
  text: Just as this fragment was scattered upon the mountains and[a], when gathered together, became one, so let your assembly be gathered together from the ends of the earth into your kingdom. For yours is the glory and the power through Jesus Messiah forever.
translation:
  language: de
  text: Wie dieses Bruchstück auf den Bergen verstreut war und, als es gesammelt wurde, zu einem wurde, so werde deine Gemeinde von den Enden der Erde her in dein Reich versammelt. Denn dein ist die Herrlichkeit und die Macht durch Jesus Christus in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσμα
  choice: gebrochenes Brot
  rationale: κλάσμα bezeichnet wörtlich ein abgebrochenes Stück; im unmittelbaren eucharistischen Zusammenhang ist damit das gebrochene Brot gemeint. Diese Wiedergabe ist im Deutschen klarer als das isolierte „Bruchstück“.
- source_word: ἐκκλησία
  choice: Gemeinde
  rationale: „Gemeinde“ bezeichnet hier natürlich die versammelte Glaubensgemeinschaft und vermeidet die mögliche Verengung von „Kirche“ auf eine Institution oder ein Gebäude.
- source_word: συναχθὲν / συναχθήτω
  choice: zusammengebracht
  rationale: Die wiederholte Formulierung bewahrt die sprachliche Entsprechung zwischen dem Einswerden des Brotes und der Sammlung der Gemeinde.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die feste deutsche Wendung gibt die unbeschränkte Dauer der griechischen Formel würdig und verständlich wieder.
theological_decisions:
- issue: Bedeutung von Χριστός in Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  alternative: Jesus, den Messias
  rationale: „Jesus Christus“ entspricht der frühchristlichen festen Namens- und Titelformel im vorliegenden griechischen Kontext. Die Fußnote hält zugleich die titelbezogene Bedeutung „Messias“ sichtbar, ohne sie im Haupttext einseitig festzulegen.
- issue: Sammlung der Gemeinde in Gottes Reich
  choice: „in dein Reich zusammengebracht werden“
  alternative: „zu deinem Reich versammelt werden“
  rationale: Die gewählte Fassung wahrt die Zielrichtung von εἰς und die Parallelität mit dem zuvor zusammengebrachten Brot, ohne näher zu bestimmen, wann oder auf welche Weise diese Sammlung geschieht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht liturgischem Klang. Die Parallelstruktur und die Gebetsform bleiben eng am Griechischen; unnötige konfessionelle Festlegungen werden vermieden.
