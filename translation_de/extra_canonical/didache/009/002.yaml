id: DID.9.2
reference: Didache 9:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πρῶτον περὶ τοῦ ποτηρίου· Εὐχαριστοῦμέν σοι, Πάτερ ἡμῶν, ὑπὲρ τῆς ἁγίας ἀμπέλου Δαβὶδ τοῦ παιδός σου, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/002.yaml
  text: 'First, concerning the cup:


    We give thanks to you, our Father,

    for the holy vine of David your servant,

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: de
  text: 'Zuerst über den Kelch:


    Wir danken dir, unser Vater,

    für den heiligen Weinstock Davids, deines Dieners,

    den du uns durch Jesus, deinen Diener, bekannt gemacht hast.

    Dir sei die Herrlichkeit in Ewigkeit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποτήριον
  choice: Kelch
  rationale: Im Zusammenhang des Dankgebets bezeichnet das Wort das Trinkgefäß; „Kelch“ ist im Deutschen würdig, verständlich und traditionsnah.
- source_word: Εὐχαριστοῦμέν
  choice: Wir danken
  rationale: Gibt die gewöhnliche Bedeutung des Verbs direkt wieder, ohne den späteren liturgischen Fachbegriff „Eucharistie“ in den Text einzutragen.
- source_word: ἁγία ἄμπελος
  choice: heiliger Weinstock
  rationale: Bewahrt das Bild des griechischen Textes. „Weinstock“ ist hier natürlicher und präziser als „Weinrebe“.
- source_word: παῖς
  choice: Diener
  rationale: Das Wort kann „Kind“, „Sohn“ oder „Diener“ bedeuten. In der Verbindung mit David und Jesus greift „Diener“ den biblischen Sprachgebrauch vom Diener Gottes auf, ohne im Fall Davids eine unpassende Sohnesbezeichnung zu erzeugen.
- source_word: ἐγνώρισας
  choice: bekannt gemacht hast
  rationale: 'Entspricht der kausativen Aussage: Gott hat den heiligen Weinstock den Betenden durch Jesus erkennen lassen.'
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Natürliche deutsche doxologische Wendung für die wörtlich pluralische Zeitformel „in die Zeitalter“.
theological_decisions:
- issue: Bedeutung des „heiligen Weinstocks Davids“
  choice: Das Bild bleibt unaufgelöst stehen.
  alternative: Deutende Wiedergaben wie „das heilige Geschlecht Davids“ oder eine ausdrückliche Gleichsetzung mit Christus.
  rationale: Der griechische Text verwendet bewusst die Metapher ἄμπελος. Eine Explikation würde eine bestimmte christologische, dynastische oder sakramentale Deutung festschreiben, die der Satz selbst offenlässt.
- issue: Wiedergabe von παῖς für David und Jesus
  choice: Beide Male „Diener“.
  alternative: „Knecht“ oder, nur bei Jesus, „Sohn“.
  rationale: Die gleiche deutsche Wiedergabe erhält die lexikalische Parallelität des Originals. „Diener“ ist heute verständlicher und weniger missverständlich als „Knecht“; „Sohn“ würde eine mögliche Bedeutung auswählen und die Parallelität zu David abschwächen.
- issue: Doxologie
  choice: „Dir sei die Herrlichkeit in Ewigkeit.“
  alternative: „Dein ist die Herrlichkeit in Ewigkeit.“
  rationale: Der griechische Nominalsatz σοὶ ἡ δόξα kann beides tragen. Die gewählte Form klingt als deutsche Doxologie natürlich und wahrt die Zueignung der Herrlichkeit an Gott.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit schlichter Gebetssprache. Die Zeilenstruktur macht den liturgischen Charakter sichtbar. Keine Fußnoten erforderlich.
