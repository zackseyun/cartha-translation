  terminology: „Weinstock“ trifft ἄμπελος als Bildwort angemessen. „Diener“ ist für παῖς hier eine vertretbare, nicht überinterpretierende Wahl und wird bei David und Jesus konsistent verwendet. „In Ewigkeit“ gibt εἰς τοὺς αἰῶνας idiomatisch wieder.
