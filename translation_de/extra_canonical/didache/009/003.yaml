  source_fidelity: Die Übersetzung folgt dem griechischen Wortlaut zuverlässig. »das gebrochene Brot« ist im Mahlkontext eine sachgerechte explizierende Wiedergabe von τοῦ κλάσματος. »Erkenntnis« trifft γνώσεως, und »bekannt gemacht hast« gibt ἐγνώρισας präzise wieder. Die Wiedergabe von παῖς als »Diener« wahrt die in diesem frühchristlichen Gebetskontext naheliegende Bedeutung, ohne die mögliche Lesart »Kind/Sohn« dogmatisch festzulegen.
