id: DID.9.3
reference: Didache 9:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ κλάσματος· Εὐχαριστοῦμέν σοι, Πάτερ ἡμῶν, ὑπὲρ τῆς ζωῆς καὶ γνώσεως, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/003.yaml
  text: 'And concerning the broken bread:


    We give thanks to you, our Father,

    for the life and knowledge

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: de
  text: 'Was aber das gebrochene Brot betrifft:


    Wir danken dir, unser Vater,

    für das Leben und die Erkenntnis,

    die du uns durch Jesus, deinen Diener, bekannt gemacht hast.

    Dir gehört die Herrlichkeit in Ewigkeit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσματος
  choice: das gebrochene Brot
  rationale: Wörtlich bezeichnet κλάσμα ein abgebrochenes Stück bzw. das Gebrochene. Im Mahlkontext ist »das gebrochene Brot« natürlich und macht den Bezug verständlich, ohne zusätzliche Deutung einzutragen.
- source_word: Εὐχαριστοῦμέν
  choice: Wir danken
  rationale: Das Verb bedeutet hier, Dank auszusprechen. Die schlichte deutsche Wiedergabe bewahrt den Gebetscharakter.
- source_word: γνώσεως
  choice: Erkenntnis
  rationale: »Erkenntnis« gibt den religiös gewichteten Sinn von γνῶσις besser wieder als das alltäglichere »Wissen«, ohne den Inhalt näher festzulegen.
- source_word: ἐγνώρισας
  choice: bekannt gemacht hast
  rationale: Die kausative Bedeutung des Verbs wird idiomatisch und präzise wiedergegeben.
- source_word: παιδός
  choice: Diener
  rationale: παῖς kann »Kind/Sohn« oder »Diener« bedeuten. In frühchristlicher Gebetssprache mit Bezug auf Jesus entspricht »Diener« wahrscheinlich dem traditionsgeschichtlichen Klang des Gottesknechts, ohne ausdrücklich »Sohn« in den Text einzutragen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die deutsche liturgische Wendung gibt die zeitlich unbegrenzte Doxologie natürlich und würdig wieder.
theological_decisions:
- issue: Bezeichnung Jesu als παῖς Gottes
  choice: Jesus, deinen Diener
  alternative: Jesus, dein Kind / dein Sohn
  rationale: Das griechische παῖς ist mehrdeutig. »Diener« wahrt hier die wahrscheinliche Anspielung auf die biblische Gottesknecht-Tradition und vermeidet, die ausdrücklich mögliche, aber nicht zwingende Sohn-Terminologie einzusetzen.
- issue: Doxologie σοὶ ἡ δόξα
  choice: Dir gehört die Herrlichkeit
  alternative: Dein ist die Herrlichkeit
  rationale: Beide Fassungen sind möglich. »Dir gehört« ist modernes, klares Deutsch und bewahrt die uneingeschränkte Zuschreibung der Herrlichkeit an den Vater.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gebetsnaher Zeilengliederung. Die einleitende Formel bleibt eng am griechischen Wortlaut; unnötige konfessionelle oder sakramentstheologische Präzisierungen werden vermieden.
