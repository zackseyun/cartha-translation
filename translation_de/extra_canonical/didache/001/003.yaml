source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τούτων δὲ τῶν λόγων ἡ διδαχὴ ἐστὶν αὕτη· Εὐλογεῖτε τοὺς καταρωμένους ὑμῖν καὶ προσεύχεσθε ὑπὲρ τῶν ἐχθρῶν ὑμῶν, νηστεύετε δὲ ὑπὲρ τῶν διωκόντων ὑμᾶς· ποία γὰρ χάρις, ἐὰν ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς· οὐχὶ καὶ τὰ ἔθνη τὸ αὐτὸ ποιοῦσιν ; ὑμεῖς δὲ ἀγαπᾶτε τοὺς μισοῦντας ὑμᾶς καὶ οὐχ ἕξετε ἐχθρόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/003.yaml
  text: 'And the teaching of these words is this: bless those who curse you, and pray for your enemies, and fast for those who persecute you. For what credit is it if you love those who love you? Do not even the Gentiles do the same? But you, love those who hate you, and you will not have an enemy.'
translation:
  language: de
  text: 'Die Lehre dieser Worte aber lautet so: Segnet die, die euch verfluchen, und betet für eure Feinde; fastet für die, die euch verfolgen. Denn welchen Dank habt ihr davon, wenn ihr die liebt, die euch lieben? Tun nicht auch die Heiden dasselbe? Ihr aber liebt die, die euch hassen, und ihr werdet keinen Feind haben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ διδαχή
  choice: die Lehre
  rationale: Gibt den didaktischen Charakter natürlich und eng am griechischen Ausdruck wieder.
- source_word: χάρις
  choice: Dank
  rationale: Im Kontext bezeichnet χάρις die Anerkennung beziehungsweise den Dank, der für ein Verhalten gebührt; „Dank“ bewahrt zugleich die Nähe zum üblichen Wortfeld.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Die neutrale Grundbedeutung des Plurals wird bewahrt, ohne durch „Heiden“ eine unnötig konfessionell oder abwertend gefärbte Deutung einzutragen.
- source_word: οὐχ ἕξετε ἐχθρόν
  choice: ihr werdet keinen Feind haben
  rationale: Formale und zugleich verständliche Wiedergabe der auffälligen Verheißung; ihre mögliche ethische oder relationale Bedeutung wird nicht aufgelöst.
theological_decisions:
- issue: Reichweite der Feindesliebe
  choice: Die Gebote zum Segnen, Beten, Fasten und Lieben werden ohne Einschränkung wiedergegeben.
  alternative: Die Aussagen als bloße innere Haltung oder nur auf bestimmte Gegner einzugrenzen.
  rationale: Der griechische Text formuliert konkrete, uneingeschränkte Handlungen gegenüber Fluchenden, Feinden, Verfolgern und Hassenden.
- issue: Verheißung, keinen Feind zu haben
  choice: Die wörtliche Spannung bleibt erhalten.
  alternative: „Dann werdet ihr niemanden als Feind betrachten“ oder „Dann wird niemand euer Feind sein“.
  rationale: Das Griechische legt nicht eindeutig fest, ob eine veränderte eigene Haltung oder eine äußere Wirkung gemeint ist; eine erklärende Festlegung würde die Ambiguität beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel von beschreibenden Relativsätzen zu „Ihr aber sollt“ macht den griechischen Kontrast und den imperativischen Sinn idiomatisch deutlich. Die Interpunktion gliedert die überlieferte Satzfolge, ohne ihren Gedankengang zu verändern.
