id: DID.1.4
reference: Didache 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀπέχου τῶν σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν. Ἐάν τις σοὶ δῷ ῥάπισμα εἰς τὴν δεξιὰν σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην, καὶ ἔσῃ τέλειος· ἐὰν ἀγγαρεύσῃ σε τις μίλιον ἕν, ὕπαγε μετʼ αὐτοῦ δύο· ἐὰν ἄρῃ τις τὸ ἱμάτιόν σου, δὸς αὐτῷ καὶ τὸν χιτῶνα· ἐὰν λάβῃ τις ἀπὸ σοῦ τὸ σόν, μὴ ἀπαίτει· οὐδὲ γὰρ δύνασαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/004.yaml
  text: Abstain from fleshly and worldly desires. If anyone gives you a blow on the right cheek[a], turn to him the other also, and you will be perfect. If anyone compels you to go one mile, go with him two. If anyone takes away your cloak, give him your tunic also. If anyone takes from you what is yours, do not demand it back, for you are not able.
translation:
  language: de
  text: Halte dich von den Begierden des Fleisches und der Welt fern. Wenn dir jemand einen Schlag auf die rechte Wange gibt, halte ihm auch die andere hin, und du wirst vollkommen sein. Wenn dich jemand zwingt, eine Meile mitzugehen, geh zwei mit ihm. Wenn dir jemand den Mantel nimmt, gib ihm auch das Untergewand. Wenn jemand dir wegnimmt, was dir gehört, fordere es nicht zurück; denn du kannst es auch nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπέχου
  choice: Halte dich ... fern
  rationale: Gibt den durativen Imperativ idiomatisch und verständlich wieder.
- source_word: σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν
  choice: Begierden des Fleisches und der Welt
  rationale: Bewahrt die zwei unterschiedlichen Adjektive und ihren ethisch-theologischen Klang, ohne sie vorschnell auszudeuten.
- source_word: ῥάπισμα
  choice: einen Schlag
  rationale: Bezeichnet einen Schlag, insbesondere ins Gesicht; die allgemeinere Wiedergabe vermeidet eine unbelegte Festlegung auf Handfläche oder Faust.
- source_word: τέλειος
  choice: vollkommen
  rationale: Bewahrt die starke Aussage des griechischen Begriffs und ihre mögliche ethische Bedeutung von Ganzheit beziehungsweise Vollendung.
- source_word: ἀγγαρεύσῃ
  choice: zwingt, ... mitzugehen
  rationale: Der Ausdruck bezeichnet das zwangsweise Heranziehen zu einem Dienst; das im Deutschen nötige Bewegungsverb wird aus dem Streckenmaß erschlossen.
- source_word: ἱμάτιον
  choice: Mantel
  rationale: Bezeichnet hier das äußere Kleidungsstück.
- source_word: χιτών
  choice: Untergewand
  rationale: Unterscheidet das körpernah getragene Kleidungsstück klar vom äußeren Mantel.
- source_word: μὴ ἀπαίτει
  choice: fordere es nicht zurück
  rationale: ἀπαιτέω bedeutet in diesem Zusammenhang, etwas Geschuldetes oder Genommenes zurückzufordern.
- source_word: οὐδὲ γὰρ δύνασαι
  choice: denn du kannst es ohnehin nicht
  rationale: Gibt die knappe, schwierige Begründung wieder, ohne ein nicht genanntes Objekt oder eine bestimmte Art des Unvermögens einzutragen.
theological_decisions:
- issue: Bedeutung von τέλειος
  choice: vollkommen
  alternative: reif / ungeteilt
  rationale: Die Übersetzung lässt die anspruchsvolle ethische und theologische Spannung des Originals stehen, statt sie durch eine abschwächende Deutung aufzulösen.
- issue: Begründung οὐδὲ γὰρ δύνασαι
  choice: denn du kannst es ohnehin nicht
  alternative: denn du hast dazu auch keine Macht / denn du kannst es nicht zurückbekommen
  rationale: Das griechische δύνασαι nennt weder ein Objekt noch ausdrücklich den Grund des Unvermögens; die Übersetzung wahrt diese Offenheit weitgehend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die parallelen Imperative bleiben knapp und einprägsam. Es werden keine konfessionellen Zusatzdeutungen eingeführt.
