  source_fidelity: 'Die Satzfolge und die zentralen Begriffe sind insgesamt quellennah wiedergegeben: σαρκικός/κοσμικός bleiben unterschieden, ἱμάτιον und χιτών werden zutreffend als Mantel und Untergewand differenziert, und ἀγγαρεύω wird als erzwungenes Mitgehen verständlich gefasst. Bei οὐδὲ γὰρ δύνασαι fügt „ohnehin“ jedoch eine im Griechischen nicht ausdrücklich vorhandene resignative beziehungsweise unabhängige Begründungsnuance hinzu. Die knappe, nicht näher bestimmte Aussage des Originals sollte ohne diesen Zusatz stehen bleiben.'
  naturalness: Der Text ist modernes, würdiges Standarddeutsch und die knappe imperativische Reihung funktioniert gut. „Denn du kannst es auch nicht“ ist im Kontext verständlich und bewahrt zugleich die Kürze der griechischen Begründung besser als „denn du kannst es ohnehin nicht“.
  terminology: „Begierden des Fleisches und der Welt“, „vollkommen“, „Mantel“ und „Untergewand“ sind angemessen. „Schlag auf die rechte Wange“ ist eine natürliche, nicht überpräzisierende Wiedergabe von ῥάπισμα. Es sind keine Fußnoten erforderlich; die englische Fußnote dokumentiert eine frühere englische Formulierung und hat keinen übersetzungsrelevanten Anker im deutschen Text.
