id: DID.1.2
reference: Didache 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ μὲν οὖν ὁδὸς τῆς ζωῆς ἐστιν αὕτη· πρῶτον, ἀγαπήσεις τὸν Θεὸν τὸν ποιήσαντά σε· δεύτερον, τὸν πλησίον σου ὡς σεαυτόν· πάντα δὲ ὅσα ἐὰν θελήσῃς μὴ γίνεσθαί σοι, καὶ σὺ ἄλλῳ μὴ ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/002.yaml
  text: 'This is the way of life: first[a], you shall love God who made you; second, your neighbor as yourself. And whatever you would not want to happen to you, do not do to another either.'
translation:
  language: de
  text: 'Der Weg des Lebens ist also dieser: Erstens: Du sollst Gott lieben, der dich gemacht hat; zweitens: deinen Nächsten wie dich selbst. Alles aber, was du nicht willst, dass es dir geschieht, das füge auch du keinem anderen zu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδὸς τῆς ζωῆς
  choice: Weg des Lebens
  rationale: Die geläufige und bildkräftige deutsche Entsprechung wahrt die Leitmetapher des griechischen Textes.
- source_word: ἀγαπήσεις
  choice: Du sollst … lieben
  rationale: Das Futur hat hier gebietenden Sinn; die deutsche Soll-Form gibt diesen würdig und natürlich wieder.
- source_word: τὸν πλησίον σου
  choice: deinen Nächsten
  rationale: Die traditionelle, weiterhin verständliche Wiedergabe bewahrt den ethischen und biblischen Bezug.
- source_word: μὴ γίνεσθαί σοι
  choice: dass es dir geschieht
  rationale: Die Formulierung bleibt nahe am griechischen γίνεσθαι und vermeidet eine unnötige Einengung auf bloßes menschliches Handeln.
- source_word: καὶ σὺ ἄλλῳ μὴ ποίει
  choice: das füge auch du keinem anderen zu
  rationale: „auch du“ bildet die Hervorhebung durch καὶ σύ ab; „keinem anderen zufügen“ formuliert das Verbot im Deutschen natürlich und erhält den Bezug auf etwas, das jemandem widerfährt.
theological_decisions:
- issue: Gebotscharakter von ἀγαπήσεις
  choice: Du sollst Gott lieben
  alternative: Du wirst Gott lieben
  rationale: Im Kontext der Unterweisung bezeichnet das griechische Futur ein Gebot; die Übersetzung macht diese Funktion sichtbar, ohne eine Verheißung daraus zu machen.
- issue: Elliptischer zweiter Satzteil
  choice: 'zweitens: deinen Nächsten wie dich selbst'
  alternative: 'zweitens: Du sollst deinen Nächsten lieben wie dich selbst'
  rationale: Die Ellipse des Originals wird bewahrt; das Verb „lieben“ ist aus dem ersten Glied eindeutig mitzudenken.
- issue: Negative Form der Goldenen Regel
  choice: alles, von dem du nicht willst, dass es dir geschieht, das füge auch du keinem anderen zu
  alternative: Was du nicht willst, dass man dir tut, das tu auch keinem anderen
  rationale: Die gewählte Form erhält den weiteren Wortlaut γίνεσθαι („geschehen“) und die persönliche Hervorhebung καὶ σύ, ohne die Aussage konfessionell oder interpretierend zu verengen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Lehrton. Die Doppelpunktgliederung macht die Aufzählung klar; die leicht gehobene Wendung „keinem anderen zufügen“ passt zum paränetischen Charakter.
