  naturalness: Die Wendung „alles, von dem du nicht willst, dass es dir geschieht“ ist im heutigen Deutsch syntaktisch weniger idiomatisch. Mit „Alles aber, was du nicht willst, dass es dir geschieht“ bleibt der Sinn erhalten und der Satz wird klarer und natürlicher.
