source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὁδοὶ δύο εἰσί, μία τῆς ζωῆς καὶ μία τοῦ θανάτου, διαφορὰ δὲ πολλὴ μεταξὺ τῶν δύο ὁδῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/001.yaml
  text: There are two ways, one of life and one of death, and there is a great difference between the two ways.
translation:
  language: de
  text: 'Es gibt zwei Wege: den Weg des Lebens und den Weg des Todes. Zwischen diesen beiden Wegen besteht ein großer Unterschied.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ δύο
  choice: zwei Wege
  rationale: Gibt das Leitbild des griechischen Textes direkt und idiomatisch wieder.
- source_word: μία τῆς ζωῆς καὶ μία τοῦ θανάτου
  choice: den Weg des Lebens und den Weg des Todes
  rationale: Die elliptische griechische Form wird im Deutschen zur Klarheit durch die Wiederholung von „Weg“ ergänzt; die Genitivverbindungen bleiben erhalten.
- source_word: διαφορὰ δὲ πολλὴ
  choice: besteht ein großer Unterschied
  rationale: Natürliche deutsche Wiedergabe der Existenzkonstruktion; δέ markiert hier eine Weiterführung beziehungsweise leichte Gegenüberstellung und verlangt kein betontes „aber“.
- source_word: μεταξὺ τῶν δύο ὁδῶν
  choice: zwischen diesen beiden Wegen
  rationale: „Diesen“ nimmt die unmittelbar zuvor genannten Wege im Deutschen natürlich wieder auf.
theological_decisions:
- issue: Bedeutung der beiden Wege
  choice: Die bildhafte Rede von „Wegen“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Die Wege ausdrücklich als Lebensweisen oder moralische Entscheidungen deuten.
  rationale: Der griechische Text selbst entfaltet die Metapher erst im folgenden Kontext; eine nähere Deutung würde hier mehr festlegen als der Vers sagt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zweiteilung in zwei Sätze verbessert die Lesbarkeit, ohne Inhalt oder rhetorischen Gegensatz zu verändern.
