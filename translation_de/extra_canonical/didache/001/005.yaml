    rationale: Der Ausdruck kann im heutigen kirchlichen Deutsch speziell geistliche Charismen bezeichnen. Der Kontext spricht allgemeiner von den eigenen Gaben des Vaters; „Gaben“ wahrt die Offenheit des griechischen Begriffs.
  - severity: medium
    issue: „dafür Strafe erleiden, warum er es genommen hat und wozu“
    rationale: Die Formulierung ist im Deutschen syntaktisch schwerfällig; zudem wechselt sie ohne Anlass von „empfangen“ zu „genommen“. Eine Formulierung mit „weil“ und „zu welchem Zweck“ gibt die indirekten Fragen ἱνατί und εἰς τί klar wieder.
  - severity: low
    issue: „es nicht zurück“ und „weil er es nötig hat“
    rationale: Das unbestimmte Objekt des Griechischen ist weiter als ein einzelnes „es“. „Nichts zurückfordern“ und „bedürftig ist“ sind idiomatischer und vermeiden eine unnötige Objektfestlegung.
