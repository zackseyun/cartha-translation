revisions:
- from: Gib jedem, der dich bittet, und fordere es nicht zurück; denn der Vater will, dass allen aus seinen eigenen Gnadengaben gegeben wird.[a] Selig ist, wer nach dem Gebot gibt; denn er ist frei von Schuld. Doch wehe dem, der empfängt! Wenn nämlich jemand etwas empfängt, weil er es nötig hat, wird er frei von Schuld sein. Wer es aber nicht nötig hat, wird dafür Strafe erleiden, warum er es genommen hat und wozu.[b] Und wenn er in Gewahrsam geraten ist, wird er über seine Taten verhört werden,[c] und er wird von dort nicht herauskommen, bis er den letzten Quadrans zurückgezahlt hat.[d]
  to: Gib jedem, der dich bittet, und fordere nichts zurück; denn der Vater will, dass allen aus seinen eigenen Gaben gegeben wird.[a] Selig ist, wer nach dem Gebot gibt; denn er ist unschuldig. Doch wehe dem, der empfängt! Wenn nämlich jemand empfängt und bedürftig ist, wird er unschuldig sein. Wer aber nicht bedürftig ist, wird dafür bestraft werden, weil er empfangen hat und zu welchem Zweck.[b] Und wenn er in Gewahrsam geraten ist, wird er über seine Taten verhört werden,[c] und er wird von dort nicht herauskommen, bis er den letzten Quadrans bezahlt hat.[d]
  rationale: Die Revision bewahrt Satzfolge, Mahncharakter und die nicht weiter aufgelöste gerichtliche Bildsprache des griechischen Textes. Sie ersetzt lediglich fachsprachlich verengende oder im Deutschen unklare Formulierungen, vereinheitlicht „empfangen“ für λαμβάνειν und passt alle betroffenen Fußnoten an.
