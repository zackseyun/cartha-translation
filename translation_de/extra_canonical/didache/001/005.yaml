  source_fidelity: Der Entwurf gibt den Gedankengang und die gerichtliche Bildsprache des griechischen Textes im Wesentlichen zuverlässig wieder. Korrigiert werden sollten jedoch die unnötig spezialisierte Wiedergabe von χαρίσματα als „Gnadengaben“, die uneinheitliche Wiedergabe von λαμβάνειν sowie die etwas holprige Verbindung von Strafe und den indirekten Fragen in der zweiten Satzhälfte.
  naturalness: Der Ton ist angemessen würdevoll und modernes Standarddeutsch. „Nichts zurückfordern“, „bedürftig“ und „wird bestraft werden, weil … und zu welchem Zweck“ sind idiomatischer und zugleich näher an den wiederholten Begriffen des Ausgangstextes.
  terminology: „Gaben“ ist für χαρίσματα hier weiter und weniger fachsprachlich als „Gnadengaben“. „Unschuldig“ gibt ἀθῷος im forensisch-moralischen Kontext direkt wieder. Die vorsichtige Fußnote zu συνοχή ist sinnvoll, da weder Haft noch Bedrängnis als einzige Bedeutung erzwungen werden sollte.
