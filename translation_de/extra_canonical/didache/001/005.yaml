source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Παντὶ τῷ αἰτοῦντί σε δίδου καὶ μὴ ἀπαίτει· πᾶσι γὰρ θέλει δίδοσθαι ὁ πατὴρ ἐκ τῶν ἰδίων χαρισμάτων. Μακάριος ὁ διδοὺς κατὰ τὴν ἐντολήν· ἀθῷος γάρ ἐστιν· οὐαὶ τῷ λαμβάνοντι· εἰ μὲν γὰρ χρείαν ἔχων λαμβάνει τις, ἀθῷος ἔσται· ὁ δὲ μὴ χρείαν ἔχων δώσει δίκην, ἱνατί ἔλαβε καὶ εἰς τί, ἐν συνοχῇ δὲ γενόμενος ἐξετασθήσεται περὶ ὧν ἔπραξε, καὶ οὐκ ἐξελεύσεται ἐκεῖθεν μέχρις οὗ ἀποδῷ τὸν ἔσχατον κοδράντην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/005.yaml
  text: Give to everyone who asks you[a], and do not demand it back; for the Father wants his own gifts to be given to all. Blessed is the one who gives according to the commandment, for he is innocent. But woe to the one who receives; for if someone receives while having need, he will be innocent, but the one not having need will pay the penalty for why he received and for what purpose. And having come under confinement, he will be examined concerning the things he did[b], and he will not come out from there until he repays the last quadrans.
translation:
  language: de
  text: Gib jedem, der dich bittet, und fordere nichts zurück; denn der Vater will, dass allen aus seinen eigenen Gaben gegeben wird.[a] Selig ist, wer nach dem Gebot gibt; denn er ist unschuldig. Doch wehe dem, der empfängt! Wenn nämlich jemand empfängt und bedürftig ist, wird er unschuldig sein. Wer aber nicht bedürftig ist, wird dafür bestraft werden, weil er empfangen hat und zu welchem Zweck.[b] Und wenn er in Gewahrsam geraten ist, wird er über seine Taten verhört werden,[c] und er wird von dort nicht herauskommen, bis er den letzten Quadrans bezahlt hat.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „denn der Vater will, dass seine eigenen Gaben allen gegeben werden.“'
    reason: Die griechische Konstruktion kann stärker die Gaben selbst oder das Geben aus ihnen hervorheben.
  - marker: b
    text: 'Wörtlich etwa: „wird Strafe zahlen: weshalb er empfangen hat und zu welchem Zweck.“'
    reason: Die knappe griechische Gerichtsformel und die anschließenden indirekten Fragen lassen sich im Deutschen nicht zugleich wörtlich und idiomatisch wiedergeben.
  - marker: c
    text: „In Gewahrsam“ kann auch „in Bedrängnis“ bedeuten; „verhört“ auch „geprüft“ oder „untersucht“.
    reason: Die griechischen Ausdrücke συνοχή und ἐξετάζω haben ein breiteres Bedeutungsspektrum, während der Kontext eine gerichtliche Szene nahelegt.
  - marker: d
    text: Ein Quadrans war eine römische Kupfermünze von sehr geringem Wert.
    reason: Die historische Münzbezeichnung ist heutigen Leserinnen und Lesern meist nicht vertraut.
lexical_decisions:
- source_word: ἀπαίτει
  choice: fordere es nicht zurück
  rationale: Das Verb bezeichnet hier das Zurückfordern des Gegebenen; das im Griechischen unausgesprochene Objekt wird im Deutschen natürlich mit „es“ aufgenommen.
- source_word: χαρισμάτων
  choice: Gnadengaben
  rationale: „Gnadengaben“ bewahrt den Bezug auf aus Gnade gewährte Gaben, ohne den Ausdruck auf besondere geistliche Begabungen einzuengen.
- source_word: ἀθῷος
  choice: frei von Schuld
  rationale: Die Wendung gibt den rechtlich-moralischen Sinn verständlich wieder und funktioniert sowohl für den Gebenden als auch für den wirklich Bedürftigen.
- source_word: δίκην δώσει
  choice: wird Strafe erleiden
  rationale: Die feste Wendung bedeutet, Strafe oder Vergeltung zu erleiden; die Übersetzung wahrt den gerichtlichen Ernst des Zusammenhangs.
- source_word: ἐν συνοχῇ
  choice: in Gewahrsam
  rationale: Im Zusammenhang mit Verhör, Herauskommen und vollständiger Rückzahlung liegt eine Form von Haft oder Festsetzung nahe; die weitere Bedeutung „Bedrängnis“ wird in einer Fußnote offengehalten.
- source_word: κοδράντην
  choice: Quadrans
  rationale: Die historische Bezeichnung der sehr kleinen römischen Kupfermünze bleibt erhalten; eine Fußnote erläutert ihren Wert.
theological_decisions:
- issue: Der Wille des Vaters und die Herkunft der Gaben
  choice: „dass allen aus seinen eigenen Gnadengaben gegeben wird“
  alternative: „dass seine eigenen Gaben allen gegeben werden“
  rationale: Die gewählte Fassung bildet ἐκ τῶν ἰδίων χαρισμάτων ausdrücklich als Herkunftsangabe ab und vermeidet es, die syntaktische Mehrdeutigkeit stillschweigend zu beseitigen.
- issue: Schuldlosigkeit des bedürftigen Empfängers
  choice: „weil er es nötig hat, wird er frei von Schuld sein“
  alternative: „wenn er bedürftig ist, ist er unschuldig“
  rationale: Die Übersetzung erhält die konditionale Aussage und gibt ἀθῷος konsistent wieder, ohne eine weitergehende Lehre über Verdienst oder Rechtfertigung einzutragen.
- issue: Gerichtliche Bildsprache
  choice: „in Gewahrsam … verhört … nicht herauskommen“
  alternative: „in Bedrängnis … geprüft … nicht entkommen“
  rationale: Der unmittelbare Kontext stützt ein Haft- und Gerichtsbild; wegen des weiteren Bedeutungsspektrums von συνοχή wird die Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Mahn- und Gerichtssprache. „Selig“ und „wehe“ bewahren den frühchristlich-biblischen Ton; syntaktisch schwierige oder mehrdeutige Stellen werden nicht dogmatisch vereindeutigt, sondern durch Fußnoten offengehalten.
