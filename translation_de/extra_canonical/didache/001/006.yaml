id: DID.1.6
reference: Didache 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀλλὰ καὶ περὶ τούτου δὴ εἴρηται· Ἱδρωσάτω ἡ ἐλεημοσύνη σου εἰς τὰς χεῖράς σου, μέχρις ἂν γνῷς τίνι δῷς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/006.yaml
  text: 'But about this also it has been said: Let your alms sweat in your hands until you know to whom you should give.'
translation:
  language: de
  text: 'Aber auch darüber ist gesagt worden: Lass dein Almosen in deinen Händen schwitzen, bis du weißt, wem du es geben sollst.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: Gabe
  rationale: Im Kontext bezeichnet das Wort eine barmherzige Gabe für Bedürftige. „Gabe“ ist im heutigen Deutsch natürlicher als „Almosen“ und lässt den konkreten Gegenstand des Gebens offen.
- source_word: Ἱδρωσάτω
  choice: Lass … schwitzen
  rationale: Die auffällige Metapher des griechischen Textes wird bewahrt; sie fordert dazu auf, eine Gabe nicht unüberlegt oder übereilt weiterzugeben.
- source_word: εἰς τὰς χεῖράς σου
  choice: in deinen Händen
  rationale: Die räumliche Bildsprache des Originals wird direkt und idiomatisch wiedergegeben.
- source_word: μέχρις ἂν γνῷς
  choice: bis du weißt
  rationale: Gibt die zeitliche Grenze und das zur Entscheidung erforderliche Erkennen klar wieder.
theological_decisions:
- issue: Prüfung des Empfängers vor dem Geben
  choice: „bis du weißt, wem du sie geben sollst“
  alternative: „bis du erkannt hast, wem du gibst“
  rationale: Die Übersetzung bewahrt die Mahnung zu überlegtem Geben, ohne zusätzliche Kriterien für würdige oder unwürdige Empfänger einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewohnte Metapher vom Schwitzen in den Händen bleibt bewusst erhalten, da sie den markanten Charakter des griechischen Spruchs trägt.
