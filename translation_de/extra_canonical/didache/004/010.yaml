  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιτάξεις δούλῳ σου ἢ παιδίσκῃ, τοῖς ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν, ἐν πικρίᾳ σου, μήποτε οὐ μὴ φοβηθήσονται τὸν ἐπ᾽ ἀμφοτέροις Θεόν· οὐ γὰρ ἔρχεται κατὰ πρόσωπον καλέσαι, ἀλλ᾽ ἐφ᾽ οὓς τὸ πνεῦμα ἡτοίμασεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/010.yaml
  text: You shall not[a], in your bitterness, command your servant or female servant who hope in the same God, lest they should fail to fear the God who is over both; for he does not come to call according to outward standing, but upon those whom the Spirit has prepared.
translation:
  language: de
  text: Du sollst deinem Sklaven oder deiner Sklavin, die auf denselben Gott hoffen, nicht in deiner Verbitterung Befehle erteilen, damit sie nicht aufhören, den Gott zu fürchten, der über euch beiden steht.[a] Denn er kommt nicht, um nach äußerem Ansehen zu berufen, sondern zu denen, die der Geist vorbereitet hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „damit sie nicht etwa den Gott, der über euch beiden steht, nicht fürchten werden.“ Die Verbindung μήποτε οὐ μή ist im überlieferten griechischen Text ungewöhnlich; die Hauptfassung versteht sie als Warnung vor dem Verlust der Gottesfurcht.'
    reason: Dokumentiert die umstrittene beziehungsweise ungewöhnliche doppelte Negation, ohne die gut verständliche Hauptfassung zu überladen.
  - marker: b
    text: 'Wörtlich bleibt „kommt“ aus dem vorhergehenden Satzteil mitzudenken: „… sondern [kommt] zu denen, die der Geist vorbereitet hat.“'
    reason: Bewahrt die elliptische Konstruktion von ἀλλ᾽ ἐφ᾽ οὓς, statt ein zusätzliches „beruft“ in den griechischen Text einzutragen.
lexical_decisions:
- source_word: δούλῳ ... παιδίσκῃ
  choice: Sklaven oder ... Sklavin
  rationale: Die griechischen Begriffe bezeichnen hier unfreie Hausangehörige; „Diener“ würde den historischen sozialen Status abschwächen.
- source_word: ἐν πικρίᾳ σου
  choice: in Verbitterung
  rationale: Gibt πικρία als innere bittere, harte Haltung wieder und lässt die Wendung natürlich das Erteilen von Befehlen bestimmen.
- source_word: ἐπιτάξεις
  choice: Befehle erteilen
  rationale: Bewahrt den autoritativen Sinn von ἐπιτάσσω und ergibt zusammen mit „nicht“ eine klare deutsche Weisung.
- source_word: κατὰ πρόσωπον
  choice: nach dem Ansehen der Person
  rationale: Die idiomatische deutsche Wendung bewahrt den Gedanken einer Berufung nach äußerem Rang, Status oder persönlichem Ansehen, ohne ihn auf nur eine dieser Bedeutungen festzulegen.
- source_word: ἐφ᾽ οὓς
  choice: die
  rationale: Das griechische ἐπί mit Akkusativ ist wörtlich „auf/zu denen“; im Deutschen verlangt „berufen“ ein direktes Objekt. Die syntaktische Ergänzung vermeidet unnatürliches Deutsch.
theological_decisions:
- issue: Bezugsgröße von ἐπ᾽ ἀμφοτέροις
  choice: der über euch beiden steht
  alternative: der über beiden steht
  rationale: „Euch beiden“ macht verständlich, dass Gott über dem Herrn beziehungsweise der Herrin und dem versklavten Menschen steht, ohne ihre gesellschaftlichen Rollen vor Gott gleichzusetzen oder aufzuheben.
- issue: Subjekt des letzten Satzglieds
  choice: er beruft die, die der Geist vorbereitet hat
  alternative: sondern zu denen, die der Geist vorbereitet hat
  rationale: Das Subjekt bleibt Gott aus „er kommt ... zu berufen“. Die Wiederholung von „beruft“ ist im Deutschen nötig, um die elliptische griechische Gegenüberstellung klar auszudrücken.
- issue: Bedeutung von τὸ πνεῦμα
  choice: der Geist
  alternative: der Geist/Wind
  rationale: Im Kontext göttlicher Berufung ist der Geist gemeint; die bestimmte Form des Griechischen wird bewahrt, ohne ausdrücklich „Heiliger Geist“ zu ergänzen.
- issue: Kraft von οὐ μὴ φοβηθήσονται
  choice: damit sie nicht aufhören, ... zu fürchten
  alternative: damit sie womöglich den Gott ... nicht fürchten
  rationale: Nach μήποτε steht die stark verneinte Form οὐ μή mit Futur; in diesem ungewöhnlichen Zusammenhang ist wahrscheinlich der Verlust beziehungsweise das Ausbleiben der Gottesfurcht gemeint. Wegen der grammatischen Schwierigkeit wird die Alternative in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historisch präzisen Wörter „Sklave“ und „Sklavin“ werden trotz ihrer Härte nicht euphemistisch abgeschwächt. Der Satzbau wurde maßvoll geglättet; die Spannung zwischen gesellschaftlicher Herrschaft und der gemeinsamen Unterordnung unter Gott bleibt erhalten.
