source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ διψυχήσεις, πότερον ἔσται ἢ οὔ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/004.yaml
  text: You shall not be double-minded whether it will be or not[a].
translation:
  language: de
  text: Du sollst nicht schwanken[a], ob es sein wird oder nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „innerlich gespalten sein“; auch: „zweifeln“.'
    reason: Das griechische διψυχέω bezeichnet seinem Bild nach ein Geteiltsein zwischen zwei inneren Haltungen und kann im Zusammenhang auch „zweifeln“ bedeuten.
  - marker: b
    text: 'Oder: „ob es geschehen wird oder nicht“.'
    reason: ἔσται bedeutet grundsätzlich „es wird sein“, kann in diesem knappen Zusammenhang aber auch idiomatisch auf das Eintreten eines Geschehens bezogen werden.
lexical_decisions:
- source_word: διψυχήσεις
  choice: sollst nicht schwanken
  rationale: Das Verb bezeichnet ein inneres Geteiltsein und daraus folgendes Zweifeln oder Schwanken. „Schwanken“ ist im Deutschen natürlich und bewahrt die Vorstellung mangelnder innerer Entschiedenheit, ohne den Sinn auf bloßen intellektuellen Zweifel zu verengen.
- source_word: πότερον … ἢ οὔ
  choice: ob … oder nicht
  rationale: Gibt die griechische indirekte Entscheidungsfrage unmittelbar und idiomatisch wieder.
- source_word: ἔσται
  choice: es sein wird
  rationale: Bewahrt die knappe und im Kontext nicht näher bestimmte Formulierung des griechischen Verbs εἰμί. Eine stärker ereignisbezogene Wiedergabe mit „geschehen“ bleibt als mögliche Lesart in der Fußnote erhalten.
theological_decisions:
- issue: Nicht näher bestimmtes Subjekt beziehungsweise Geschehen in ἔσται
  choice: Das unbestimmte „es“ bleibt ohne inhaltliche Ergänzung stehen.
  alternative: Ein konkretes erwartetes Ereignis oder eine göttliche Verheißung ergänzen.
  rationale: Der griechische Satz nennt keinen ausdrücklichen Bezug. Eine Konkretisierung würde eine kontextuelle oder theologische Deutung in den Text eintragen, die der Wortlaut selbst offenlässt.
- issue: Bedeutungsumfang von διψυχέω
  choice: „schwanken“
  alternative: „zweifeln“ oder wörtlicher „innerlich gespalten sein“
  rationale: „Schwanken“ vermittelt sowohl Zweifel als auch innere Unentschiedenheit und erhält damit die Spannung des griechischen Ausdrucks besser als eine einseitige Festlegung.
translation_notes:
  register: Kurzer, mahnender Satz in modernem, würdigem Standarddeutsch. Die Wiederholung „ob … oder nicht“ und die Unbestimmtheit von „es“ werden bewusst beibehalten; die Fußnoten erläutern die beiden zentralen lexikalischen Spannungen.
