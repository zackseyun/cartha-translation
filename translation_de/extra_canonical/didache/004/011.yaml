source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὑμεῖς δὲ οἱ δοῦλοι ὑποτάγησεθε τοῖς κυρίοις ὑμῶν ὡς τύπῳ Θεοῦ ἐν αἰσχύνῃ καὶ φόβῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/011.yaml
  text: But you servants shall be subject to your masters as to a representative of God[a], in reverence and fear.
translation:
  language: de
  text: Ihr Sklaven aber sollt euch euren Herren unterordnen, als Vertretern Gottes, mit Scheu und Furcht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie einem Abbild/Gegenbild Gottes“; griechisch τύπος kann auch „Muster“ bedeuten.'
    reason: Die Fußnote bewahrt die lexikalische Mehrdeutigkeit der singularischen Wendung τύπῳ Θεοῦ, während der Text die im Kontext plausible repräsentative Bedeutung wiedergibt.
lexical_decisions:
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Das griechische Wort bezeichnet hier Menschen in einem rechtlich-sozialen Sklavenverhältnis; „Diener“ würde diesen Sachverhalt abschwächen.
- source_word: ὑποτάγησεθε
  choice: sollt euch … unterordnen
  rationale: Die Futurform hat hier auffordernden beziehungsweise normativen Sinn. Die reflexive deutsche Form gibt das passive griechische Verb natürlich wieder.
- source_word: κυρίοις
  choice: Herren
  rationale: Im Verhältnis zu Sklaven bezeichnet κύριοι die Herren beziehungsweise Besitzer; „Herren“ bewahrt zugleich die übliche Wortwahl, ohne das Verhältnis zu verschleiern.
- source_word: τύπῳ Θεοῦ
  choice: Repräsentanten Gottes
  rationale: τύπος bezeichnet bei einer Person eine Gestalt oder Repräsentation, die für eine andere Autorität steht. „Repräsentanten“ vermittelt den gemeinten Stellvertretungscharakter verständlich; die mögliche Bedeutung „Abbild/Muster“ bleibt in der Fußnote sichtbar.
- source_word: ἐν αἰσχύνῃ καὶ φόβῳ
  choice: mit Ehrerbietung und Furcht
  rationale: αἰσχύνη kann hier ehrfürchtige Scheu beziehungsweise respektvolle Zurückhaltung ausdrücken; „Ehrerbietung“ ist im Deutschen natürlicher als „Scham“. φόβος wird als „Furcht“ bewusst nicht abgeschwächt.
theological_decisions:
- issue: Die Herren als τύπος Gottes
  choice: Repräsentanten Gottes
  alternative: Abbild oder Muster Gottes
  rationale: Die Formulierung beschreibt eine repräsentative Autoritätsstellung, setzt die Herren aber nicht mit Gott gleich. Die lexikalische Mehrdeutigkeit von τύπος wird durch die Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sozialgeschichtlich präzise Bezeichnung „Sklaven“ wird trotz ihrer Härte beibehalten. Die Aufforderung wird ohne zusätzliche Billigung oder Einschränkung des antiken Sklavensystems übersetzt.
