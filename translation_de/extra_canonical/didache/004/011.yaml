review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt δοῦλοι, κυρίοις und die normative Aufforderung zutreffend wieder. τύπῳ Θεοῦ lässt sich im Kontext sinnvoll als repräsentative Stellung der Herren verstehen; die Singularform und die lexikalische Offenheit sollten jedoch in der deutschen Formulierung nicht verwischt werden. αἰσχύνῃ bezeichnet eher Scheu bzw. Schamgefühl als ausdrücklich „Ehrerbietung“.
  naturalness: „wie Repräsentanten Gottes“ ist nach „euch euren Herren unterordnen“ syntaktisch und hinsichtlich des Kasus nicht idiomatisch klar. „als Vertretern Gottes“ ist modernes, natürliches Deutsch und bezieht sich eindeutig auf die Herren.
  terminology: „Sklaven“ und „Herren“ sind für das antike Rechts- und Sozialverhältnis angemessen. „Vertreter Gottes“ gibt den in der englischen Prüfhistorie bevorzugten repräsentativen Sinn von τύπος klar wieder, ohne die Herren mit Gott gleichzusetzen. „Scheu und Furcht“ bewahrt den Unterschied zwischen αἰσχύνη und φόβος besser.
  issues:
  - severity: medium
    issue: Unklare und grammatisch schwache Fügung „wie Repräsentanten Gottes“
    rationale: Die Konstruktion schließt nicht sauber an das Dativobjekt „euren Herren“ an und kann wie ein unmarkierter Plural-Akkusativ wirken. Eine dative Apposition mit „als Vertretern Gottes“ ist klarer.
  - severity: low
    issue: „Ehrerbietung“ glättet αἰσχύνῃ zu stark
    rationale: αἰσχύνη meint primär Scham, Scheu oder beschämte Zurückhaltung. „Scheu“ ist im vorliegenden Kontext idiomatisch und näher am Wortlaut.
  revised_text: Ihr Sklaven aber sollt euch euren Herren unterordnen, als Vertretern Gottes, mit Scheu und Furcht.[a]
