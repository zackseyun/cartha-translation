  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Satzes wieder: die Bedingung („Wenn du etwas hast“), die Weisung im Futur mit verpflichtendem Sinn („sollst du ... geben“), die konkrete Wendung διὰ τῶν χειρῶν σου („durch deine Hände“) sowie λύτρωσιν ἁμαρτιῶν σου („ein Lösegeld für deine Sünden“). Die Reihenfolge ist im Deutschen sinnvoll geglättet, ohne einen Quelltextbestandteil auszulassen.'
  naturalness: Der Satz ist verständliches modernes Hochdeutsch mit angemessenem Weisungscharakter. „Durch deine Hände“ ist im heutigen Deutsch bewusst etwas markiert, bewahrt jedoch die anschauliche griechische Formulierung und ist in diesem knappen Weisungstext vertretbar. „Ein Lösegeld ... geben“ ist verständlich, auch wenn die Formulierung bewusst fremd und theologisch spannungsreich bleibt.
  terminology: „Lösegeld“ ist für λύτρωσις eine sachgerechte, starke Entsprechung und vermeidet eine voreilige Umdeutung zu Almosen, Sühneleistung oder bloßem Umkehrzeichen. Die Fußnote erläutert die wörtliche Alternative „Auslösung“ und hält offen, wie die Beziehung des Gebens zu den Sünden genau zu verstehen ist. Dies entspricht auch dem englischen Audit-Text („a ransom for your sins“).
