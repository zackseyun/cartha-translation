  language: en
  yaml_path: translation/extra_canonical/didache/004/006.yaml
  text: If you have anything, you shall give through your hands a ransom for your sins.
translation:
  language: de
  text: Wenn du etwas hast, sollst du durch deine Hände ein Lösegeld für deine Sünden geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Auslösung deiner Sünden“. Gemeint ist hier ein Geben aus dem eigenen Besitz; wie genau dieses Geben zur Befreiung von Sünden in Beziehung steht, lässt der knappe Satz offen.'
    reason: Die Fußnote bewahrt die Bedeutungsbreite von λύτρωσις und weist auf die echte theologische Spannung hin, ohne sie aufzulösen.
lexical_decisions:
- source_word: ἐὰν ἔχῃς
  choice: Wenn du etwas hast
  rationale: Das unbestimmte Objekt ist im Griechischen ausgelassen; „etwas“ gibt die idiomatische Bedeutung knapp und natürlich wieder.
- source_word: διὰ τῶν χειρῶν σου
  choice: durch deine Hände
  rationale: Die konkrete Ausdrucksweise des Griechischen bleibt erhalten und bezeichnet das eigenhändige Geben, ohne die Bildsprache aufzulösen.
- source_word: δώσεις
  choice: sollst du … geben
  rationale: Das Futur hat im Weisungskontext verpflichtenden Charakter; „sollst“ gibt diesen Ton im Deutschen angemessen wieder.
- source_word: λύτρωσιν
  choice: ein Lösegeld
  rationale: Die Grundbedeutung ist eine Zahlung zur Auslösung oder Befreiung. Die markante soteriologische Metapher wird nicht zu „Almosen“ oder „Sühne“ abgeschwächt.
- source_word: ἁμαρτιῶν σου
  choice: für deine Sünden
  rationale: Die Genitivverbindung wird entsprechend dem Begriff „Lösegeld“ mit „für“ natürlich wiedergegeben.
theological_decisions:
- issue: Verhältnis des Gebens zur Vergebung beziehungsweise Befreiung von Sünden
  choice: Die Formulierung „ein Lösegeld für deine Sünden“ wird direkt bewahrt.
  alternative: Sinngemäß „ein Almosen zur Tilgung deiner Sünden“ oder abgeschwächt „als Zeichen der Umkehr“.
  rationale: Der griechische Text stellt eine starke und theologisch spannungsreiche Verbindung zwischen Geben und Sünden her. Die Übersetzung darf diese weder konfessionell erklären noch stillschweigend abschwächen.
translation_notes:
  register: Modernes, verständliches Hochdeutsch mit würdigem Weisungston. Die ungewöhnliche Wendung „durch deine Hände“ bleibt wegen ihrer bewussten Anschaulichkeit erhalten.
