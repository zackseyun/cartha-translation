id: DID.4.12
reference: Didache 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μισήσεις πᾶσαν ὑπόκρισιν καὶ πᾶν ὃ μὴ ἀρεστὸν τῷ Κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/012.yaml
  text: You shall hate all hypocrisy and everything that is not pleasing to the Lord.
translation:
  language: de
  text: Du sollst jede Heuchelei hassen und alles, was dem Herrn nicht gefällt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μισήσεις
  choice: Du sollst … hassen
  rationale: Das griechische Futur hat hier gebietenden Charakter; die deutsche Soll-Form gibt dies natürlich und würdevoll wieder.
- source_word: πᾶσαν ὑπόκρισιν
  choice: jede Heuchelei
  rationale: ὑπόκρισις bezeichnet Heuchelei beziehungsweise vorgetäuschtes Verhalten; πᾶσαν wird distributiv mit „jede“ wiedergegeben.
- source_word: πᾶν ὃ μὴ ἀρεστὸν
  choice: alles, was … nicht gefällt
  rationale: Die substantivierte neutrale Wendung wird im Deutschen idiomatisch mit „alles, was“ wiedergegeben; ἀρεστόν bezeichnet das, was wohlgefällig oder angenehm ist.
- source_word: τῷ Κυρίῳ
  choice: dem Herrn
  rationale: Der Dativ bezeichnet die Person, der etwas gefällt; „Herr“ bewahrt die übliche frühchristliche Gottesbezeichnung, ohne den Bezug weiter festzulegen.
theological_decisions:
- issue: Bezug von „Herr“
  choice: dem Herrn
  alternative: Gott / Jesus Christus
  rationale: Der griechische Text nennt nur κύριος. Die Übersetzung bewahrt diese mögliche Bezugsoffenheit und ergänzt keine ausdrückliche Identifikation.
translation_notes:
  register: Modernes, klares Standarddeutsch mit gebietendem Ton und enger Anlehnung an die knappe Parallelstruktur des griechischen Satzes.
source_grounding:
  english_pob_role: consult_only
