id: DID.4.8
reference: Didache 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀποστραφήσῃ τὸν ἐνδεόμενον, συγκοινωνήσεις δὲ πάντα τῷ ἀδελφῷ σου καὶ οὐκ ἐρεῖς ἴδια εἶναι· εἰ γὰρ ἐν τῷ ἀθανάτῳ κοινωνοί ἐστε, πόσῳ μᾶλλον ἐν τοῖς θνητοῖς;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/008.yaml
  text: You shall not turn away the one in need, but you shall share all things with your brother, and you shall not say they are your own; for if you are sharers in what is immortal, how much more in mortal things?
translation:
  language: de
  text: Weise den Bedürftigen nicht ab, sondern teile alles mit deinem Bruder und sage nicht, es sei dein Eigentum. Denn wenn ihr am Unsterblichen Anteil habt, wie viel mehr an den vergänglichen Dingen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστραφήσῃ
  choice: weise ... nicht ab
  rationale: Das Verb steht hier mit direktem Objekt und bezeichnet das Abweisen oder Zurückweisen einer bedürftigen Person.
- source_word: τὸν ἐνδεόμενον
  choice: den Bedürftigen
  rationale: Die substantivierte Partizipialform meint eine Person, die Mangel leidet oder etwas nötig hat; „der Bedürftige“ ist knapp und idiomatisch.
- source_word: συγκοινωνήσεις
  choice: teile
  rationale: Im Zusammenhang mit „alles“ bezeichnet das Verb gemeinschaftliche Teilhabe beziehungsweise gemeinsames Teilen.
- source_word: τῷ ἀδελφῷ σου
  choice: mit deinem Bruder
  rationale: „Bruder“ bewahrt die frühchristliche Gemeinschaftssprache des griechischen Textes, ohne sie interpretierend auszuweiten.
- source_word: ἴδια
  choice: dein Eigentum
  rationale: Das substantivierte Neutrum Plural bezeichnet das, was jemand als eigenen Besitz beansprucht; im Deutschen verlangt der Numerus eine natürliche Umformung.
- source_word: ἐν τῷ ἀθανάτῳ
  choice: an dem Unsterblichen
  rationale: Der substantivierte Singular bleibt bewusst abstrakt und mehrdeutig; er kann das unvergängliche Heilsgut bezeichnen, ohne dass der Text es näher bestimmt.
- source_word: ἐν τοῖς θνητοῖς
  choice: an den vergänglichen Dingen
  rationale: Der substantivierte Plural bezeichnet sterbliche beziehungsweise vergängliche Dinge, hier naheliegend irdische Güter. „Vergänglich“ klingt im Deutschen bei Sachen natürlicher als „sterblich“.
theological_decisions:
- issue: Bezug von τὸ ἀθάνατον
  choice: das Unsterbliche
  alternative: die unsterblichen Güter / das ewige Leben
  rationale: Die abstrakte Formulierung des Ausgangstextes wird nicht auf eine bestimmte Heilsgabe verengt.
- issue: Reichweite der Gütergemeinschaft
  choice: „teile alles“ ohne systematische Präzisierung
  alternative: „halte alles gemeinsam“ als Aussage über zwingendes Gemeinschaftseigentum
  rationale: Der Vers fordert umfassendes Teilen, legt aber für sich allein keine ausgearbeitete Eigentumsordnung fest; die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Wechsel vom Singular in den Geboten („deinem“) zum Plural in der Begründung („ihr“) folgt dem griechischen Text. Keine Fußnoten erforderlich.
