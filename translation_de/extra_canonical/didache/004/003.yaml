  terminology: „Spaltung“, „versöhnen“, „gerecht urteilen“, „Ansehen der Person“ und „Verfehlungen“ sind terminologisch angemessen. Die Fußnote dokumentiert die formnähere Alternative „Schisma“, ohne deren spätere kirchlich-institutionelle Konnotation in den Haupttext zu verlagern.
