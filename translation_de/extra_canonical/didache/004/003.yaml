id: DID.4.3
reference: Didache 4:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ ποιήσεις σχίσμα, εἰρηνεύσεις δὲ μαχομένους· κρινεῖς δικαίως, οὐ λήψῃ πρόσωπον ἐλέγξαι ἐπὶ παραπτώμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/003.yaml
  text: You shall not cause division[a], but you shall reconcile those who are fighting. You shall judge justly; you shall not show partiality in reproving transgressions.
translation:
  language: de
  text: Du sollst keine Spaltung verursachen[a], sondern die miteinander Streitenden versöhnen. Du sollst gerecht urteilen und beim Zurechtweisen wegen Verfehlungen nicht nach Ansehen der Person handeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: kein Schisma hervorrufen.'
    reason: Die Fußnote bewahrt die formnähere Wiedergabe von σχίσμα, während der Haupttext die im frühen gemeindlichen Kontext verständlichere Bedeutung ausdrückt.
lexical_decisions:
- source_word: σχίσμα
  choice: Spaltung
  rationale: Das Wort bezeichnet hier eine Trennung oder Parteienbildung innerhalb der Gemeinschaft. „Spaltung“ gibt dies wieder, ohne die späteren institutionellen Bedeutungen des Fremdworts „Schisma“ in den Vordergrund zu rücken.
- source_word: εἰρηνεύσεις δὲ μαχομένους
  choice: sondern die miteinander Streitenden versöhnen
  rationale: Das ungewöhnlich transitiv gebrauchte εἰρηνεύω fordert dazu auf, zwischen Menschen, die im Streit liegen, Frieden herzustellen. „Versöhnen“ ist dafür im Deutschen natürlich und prägnant.
- source_word: παραπτώμασιν
  choice: Verfehlungen
  rationale: „Verfehlungen“ bewahrt den Sinn konkreter Übertretungen, ohne unnötig juristisch oder konfessionell geprägt zu klingen.
- source_word: οὐ λήψῃ πρόσωπον
  choice: nicht nach Ansehen der Person handeln
  rationale: Die semitisch geprägte griechische Wendung bezeichnet Parteilichkeit beziehungsweise Bevorzugung aufgrund der Person. Die gewählte deutsche Wendung erhält dieses Bild in geläufiger Form.
theological_decisions:
- issue: Reichweite des Verbots von σχίσμα
  choice: keine Spaltung verursachen
  alternative: kein Schisma hervorrufen
  rationale: Der Satz verbietet gemeinschaftsschädigende Spaltung allgemein; die Übersetzung legt ihn nicht vorschnell auf einen späteren kirchenrechtlichen Begriff fest.
- issue: Bezug der Unparteilichkeit
  choice: beim Zurechtweisen wegen Verfehlungen nicht nach Ansehen der Person handeln
  alternative: Verfehlungen ohne Ansehen der Person zurechtweisen
  rationale: Die Formulierung verbindet die Unparteilichkeit eng mit dem Zurechtweisen, wie es die Infinitivkonstruktion nahelegt, ohne zu entscheiden, ob vor allem Begünstigung oder Benachteiligung gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Anrede. Die wiederholte Soll-Form erhält den lehrhaften Charakter des Abschnitts; spätere institutionelle oder konfessionelle Bedeutungen werden vermieden.
