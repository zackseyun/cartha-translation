source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ διστάσεις δοῦναι οὐδὲ διδοὺς γογγύσεις· γνώσῃ γὰρ τίς ἐστιν ὁ τοῦ μισθοῦ καλὸς ἀνταποδότης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/007.yaml
  text: You shall not hesitate to give, nor grumble while giving; for you will know who is the good giver of the reward.
translation:
  language: de
  text: Du sollst nicht zögern zu geben und beim Geben nicht murren; denn du wirst erkennen, wer der gute Vergelter des Lohnes ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der den Lohn gut vergilt“. Das griechische Wort bezeichnet jemanden, der zurückgibt, vergilt oder belohnt; hier ist nicht speziell strafende Vergeltung gemeint.'
    reason: Erläutert die im Deutschen ungebräuchlichere, aber quellentreue Formulierung „Vergelter des Lohnes“ und verhindert ein einseitig strafendes Verständnis.
lexical_decisions:
- source_word: διστάσεις
  choice: zögern
  rationale: Das Verb bezeichnet hier das Schwanken oder Zögern vor dem Geben; „zögern“ ist im Deutschen natürlich und wahrt den auffordernden Sinn.
- source_word: γογγύσεις
  choice: murren
  rationale: „Murren“ gibt das missmutige Klagen des griechischen Verbs prägnant und in würdigem Register wieder.
- source_word: ἀνταποδότης
  choice: Geber
  rationale: Wörtlich bezeichnet das Wort jemanden, der zurückgibt oder vergilt. In Verbindung mit „Lohn“ ist „Geber des Lohnes“ im Deutschen verständlicher; die stärker vergeltende Nuance bleibt in der Fußnote erhalten.
- source_word: μισθοῦ
  choice: Lohnes
  rationale: „Lohn“ entspricht dem griechischen Ausdruck und bewahrt den Gedanken einer künftigen Gegenleistung oder Belohnung.
- source_word: γνώσῃ
  choice: du wirst erkennen
  rationale: Die Zukunftsform wird beibehalten; „erkennen“ kann sowohl erfahrenes Kennenlernen als auch Einsicht ausdrücken.
theological_decisions:
- issue: Identität dessen, der den Lohn gibt
  choice: Das unbestimmte „wer“ der Vorlage bleibt erhalten.
  alternative: Die gemeinte Person ausdrücklich als Gott zu benennen.
  rationale: Der Zusammenhang legt Gott nahe, doch der griechische Text nennt ihn nicht ausdrücklich. Die Übersetzung soll diese implizite Bezugnahme nicht ausdeuten.
- issue: Art der göttlichen Gegenleistung
  choice: Die Spannung zwischen Gabe, Lohn und Vergeltung wird nicht systematisch erklärt.
  alternative: Den Satz ausdrücklich als Verheißung göttlicher Belohnung für Almosen zu formulieren.
  rationale: Die Vorlage spricht knapp vom „Lohn“ und von dem, der ihn gibt beziehungsweise vergilt; eine genauere Lehrbestimmung wäre ein Zusatz.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die parallele Mahnung „nicht zögern … nicht murren“ bleibt erhalten; die ungewöhnliche griechische Verbindung von „Lohn“ und „Vergelter“ wird durch einen lesbaren Haupttext und eine präzise Fußnote wiedergegeben.
