review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt die von μὴ γίνου regierte doppelte Charakterisierung sachgerecht als zwei parallele negative Mahnungen wieder. „die Hände ausstrecken“ entspricht ἐκτείνων τὰς χεῖρας, „sie zurückziehen“ dem bildhaften συσπῶν; „wenn es ums Nehmen/Geben geht“ bildet πρὸς μὲν τὸ λαβεῖν ... πρὸς δὲ τὸ δοῦναι idiomatisch und symmetrisch ab. Anders als die englische Audit-Fassung fügt der Text kein ausdrücklich erklärendes „um nicht zu geben“ hinzu und bewahrt damit die knappe Bildsprache des Griechischen.
  naturalness: Klares, modernes Standarddeutsch mit angemessen knappem, mahnendem Register. Die Wiederaufnahme „sie“ ist eindeutig auf „die Hände“ bezogen. Die parallele Satzstruktur ist gut verständlich und mündlich tragfähig.
  terminology: „Nehmen“ und „Geben“ treffen die absichtlich allgemeine Wortwahl λαβεῖν und δοῦναι. Die konkrete Handmetapher bleibt erhalten, ohne sie moralistisch auszudeuten.
