source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ γίνου πρὸς μὲν τὸ λαβεῖν ἐκτείνων τὰς χεῖρας, πρὸς δὲ τὸ δοῦναι συσπῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/005.yaml
  text: Do not be one who stretches out his hands to receive[a], but draws them in to avoid giving.
translation:
  language: de
  text: Strecke nicht die Hände aus, wenn es ums Nehmen geht, und zieh sie nicht zurück, wenn es ums Geben geht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνου
  choice: '[Sei nicht jemand, der:] als zweigliedrige direkte Mahnung wiedergegeben'
  rationale: Die griechische Konstruktion beschreibt eine zu meidende Haltung. Im Deutschen lässt sie sich natürlicher und ebenso eindringlich durch parallele Imperative ausdrücken.
- source_word: ἐκτείνων τὰς χεῖρας
  choice: strecke ... die Hände aus
  rationale: Bewahrt das konkrete griechische Bild des ausgreifenden Empfangens.
- source_word: συσπῶν
  choice: zieh sie ... zurück
  rationale: Das Partizip bezeichnet das Zusammen- beziehungsweise Einziehen der Hände und bildet den bildhaften Gegensatz zu ἐκτείνων.
- source_word: πρὸς μὲν τὸ λαβεῖν ... πρὸς δὲ τὸ δοῦναι
  choice: wenn es ums Nehmen geht ... wenn es ums Geben geht
  rationale: Gibt die symmetrische Gegenüberstellung idiomatisch wieder, ohne das im Kontext naheliegende Verweigern durch einen erklärenden Zusatz wie „um nicht zu geben“ in den Haupttext einzutragen.
theological_decisions:
- issue: Ethischer Gegensatz zwischen Empfangen und Geben
  choice: Die körperliche Metapher und die ausgewogene Parallelstruktur bleiben erhalten.
  alternative: „Sei nicht darauf aus zu nehmen, während du dich weigerst zu geben.“
  rationale: Die Alternative erläutert den Sinn, verliert aber das einprägsame Handbild und verstärkt die Aussage über den ausdrücklichen Wortlaut hinaus.
translation_notes:
  register: Knappe, würdige und mündlich gut verständliche Mahnung. Die parallelen Imperative klingen im modernen Standarddeutsch natürlicher als eine wörtlich nachgebildete Konstruktion mit „Sei nicht einer, der ...“.
