source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐκζητήσεις δὲ καθ’ ἡμέραν τὰ πρόσωπα τῶν ἁγίων, ἵνα ἐπαναπαῇ τοῖς λόγοις αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/002.yaml
  text: And you shall seek out day by day the presence of the saints, so that you may find rest in their words.
translation:
  language: de
  text: Tag für Tag sollst du die Gegenwart der Heiligen suchen, damit du in ihren Worten Ruhe findest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐκζητήσεις
  choice: sollst du … suchen
  rationale: Das Verb bezeichnet ein bewusstes, eifriges Aufsuchen. „Suchen“ ist natürlich und bewahrt zusammen mit dem Objekt den Aufforderungscharakter des Futurs.
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Gibt die regelmäßige, tägliche Wiederholung idiomatisch wieder.
- source_word: τὰ πρόσωπα τῶν ἁγίων
  choice: die Gemeinschaft der Heiligen
  rationale: Wörtlich steht „die Angesichter der Heiligen“; gemeint ist ihr persönliches Aufsuchen beziehungsweise ihre Gegenwart. „Gemeinschaft“ drückt dies in natürlichem Deutsch aus, ohne „Heilige“ konfessionell näher zu bestimmen.
- source_word: ἵνα ἐπαναπαῇ
  choice: damit du … Ruhe findest
  rationale: Das seltene Verb bezeichnet ein Ruhen oder Sich-Niederlassen auf etwas. Die Formulierung erhält das Ruhe-Bild und klingt im Deutschen verständlich.
- source_word: τοῖς λόγοις αὐτῶν
  choice: in ihren Worten
  rationale: Bewahrt sowohl den Bezug auf das Gesprochene beziehungsweise die Lehre als auch die enge Verbindung des Ruhens mit ihren Worten.
theological_decisions:
- issue: Bedeutung von „den Heiligen“
  choice: Heiligen
  alternative: Glaubenden / Frommen
  rationale: Der traditionelle und direkte Ausdruck bleibt stehen; der Text selbst legt keine spätere konfessionelle Kategorie fest.
- issue: Verhältnis zu den Worten der Heiligen
  choice: „in ihren Worten Ruhe findest“
  alternative: „dich auf ihre Worte stützt“
  rationale: Die Übersetzung bewahrt das Ruhe-Motiv des griechischen Verbs und vermeidet es, daraus eine stärkere Aussage über Autorität oder Verbindlichkeit abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz ist als direkte Weisung formuliert. Das wörtlich schwer verständliche „die Angesichter“ wird sinngemäß als persönliche Gemeinschaft wiedergegeben.
