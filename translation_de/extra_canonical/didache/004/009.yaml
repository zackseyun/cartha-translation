id: DID.4.9
reference: Didache 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπὸ τοῦ υἱοῦ σου ἢ ἀπὸ τῆς θυγατρός σου, ἀλλὰ ἀπὸ νεότητος διδάξεις τὸν φόβον τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/009.yaml
  text: You shall not take your hand away from your son or from your daughter, but from youth you shall teach them the fear of God.
translation:
  language: de
  text: Du sollst deine Hand nicht von deinem Sohn oder deiner Tochter abziehen, sondern sollst du deinem Sohn oder deiner Tochter von Jugend an die Furcht Gottes lehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπό
  choice: Du sollst deine Hand nicht … abziehen
  rationale: Die konkrete Metapher des griechischen Textes bleibt erhalten; sie kann sowohl Fürsorge als auch erzieherische Verantwortung umfassen, ohne diese näher festzulegen.
- source_word: ἀπὸ νεότητος
  choice: von Jugend an
  rationale: Gibt den zeitlichen Beginn knapp und idiomatisch wieder.
- source_word: διδάξεις
  choice: lehren
  rationale: Entspricht dem direkten Sinn des Verbs und wahrt den verpflichtenden Zukunftsausdruck des Griechischen durch „sollst“.
- source_word: τὸν φόβον τοῦ Θεοῦ
  choice: die Furcht Gottes
  rationale: Bewahrt die traditionelle und theologisch offene Formulierung; sie wird nicht einengend als bloße Ehrfurcht oder Angst gedeutet.
theological_decisions:
- issue: Bedeutung der Hand-Metapher
  choice: Die Metapher wird wörtlich als „die Hand … abziehen“ wiedergegeben.
  alternative: „die Erziehung/Fürsorge nicht vernachlässigen“
  rationale: Der Ausgangstext benennt nicht ausdrücklich, ob Zucht, Fürsorge, Schutz oder allgemeine Verantwortung gemeint ist; eine erklärende Paraphrase würde die genuine Offenheit einschränken.
- issue: φόβος τοῦ Θεοῦ
  choice: „Furcht Gottes“
  alternative: „Ehrfurcht vor Gott“
  rationale: „Furcht Gottes“ erhält die Spannung des griechischen Ausdrucks zwischen Scheu, Ehrfurcht und ernstem Gottesbewusstsein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Das Pronomen „sie“ nimmt Sohn und Tochter gemeinsam auf und vermeidet eine unnötige Wiederholung.
