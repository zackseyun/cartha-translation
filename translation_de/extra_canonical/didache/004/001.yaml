source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ μνησθήσῃ νυκτὸς καὶ ἡμέρας, τιμήσεις δὲ αὐτὸν ὡς Κύριον· ὅθεν γὰρ ἡ κυριότης λαλεῖται, ἐκεῖ Κύριός ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/001.yaml
  text: My child, you shall remember night and day the one who speaks to you the word of God, and you shall honor him as the Lord; for where lordship is spoken, there the Lord is.
translation:
  language: de
  text: Mein Kind, du sollst Nacht und Tag an den denken, der zu dir das Wort Gottes spricht, und ihn wie den Herrn ehren. Denn wo von Herrschaft[a] gesprochen wird, dort ist der Herr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet „Herrschaft“ und ist mit „Herr“ verwandt.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Τέκνον μου
  choice: Mein Kind
  rationale: Bewahrt die persönliche, lehrhafte Anrede in natürlichem modernem Deutsch.
- source_word: μνησθήσῃ ... τιμήσεις
  choice: du sollst ... denken ... und ... ehren
  rationale: Beide Futurformen haben hier imperativische Kraft. Die parallele Wiedergabe mit „sollst“ erhält den einheitlichen katechetischen Ton.
- source_word: τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ
  choice: der zu dir das Wort Gottes spricht
  rationale: Quellennah und im Deutschen klar; das substantivierte Partizip wird als Relativsatz wiedergegeben.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Nacht und Tag
  rationale: Erhält die Reihenfolge des griechischen Ausdrucks.
- source_word: ὡς Κύριον
  choice: wie den Herrn
  rationale: Bewahrt den vergleichenden Sinn von ὡς und vermeidet die stärkere Identitätsaussage, die „als den Herrn“ nahelegen könnte.
- source_word: κυριότης
  choice: Herrsein
  rationale: Macht die unmittelbare Wortbeziehung zu Κύριος („Herr“) sichtbar und bewahrt zugleich den abstrakten Charakter des griechischen Ausdrucks.
- source_word: λαλεῖται
  choice: gesprochen wird
  rationale: Entspricht dem passiven Verb ohne die zusätzliche Nuance einer förmlichen Verkündigung einzutragen.
theological_decisions:
- issue: Verhältnis zwischen dem Lehrenden und dem Herrn
  choice: „ihn wie den Herrn ehren“
  alternative: „ihn als den Herrn ehren“
  rationale: Das griechische ὡς lässt einen Vergleich zu. Die Übersetzung vermeidet daher, den Lehrenden ausdrücklich mit dem Herrn gleichzusetzen.
- issue: Bedeutung von κυριότης
  choice: „Herrsein“ im Text, mit Alternativen in der Fußnote
  alternative: „Herrschaft“ oder „die Botschaft vom Herrn“
  rationale: Der abstrakte Ausdruck ist mehrdeutig und bildet mit Κύριος ein Wortspiel. Die gewählte Form bewahrt diese Spannung, ohne die Stelle auf Herrschaftsausübung oder auf eine rekonstruierte Wendung „Wort des Herrn“ festzulegen.
translation_notes:
  register: Persönlicher, würdevoller Lehrton in modernem Standarddeutsch. Die Soll-Form gibt die imperativisch gebrauchten Futurformen einheitlich wieder. „Herrsein“ ist bewusst markiert, aber verständlich und erhält das griechische Wortspiel.
