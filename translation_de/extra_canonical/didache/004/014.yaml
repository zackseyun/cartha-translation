id: DID.4.14
reference: Didache 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν ἐκκλησίᾳ ἐξομολογήσῃ τὰ παραπτώματά σου, καὶ οὐ προσελεύσῃ ἐπὶ προσευχήν σου ἐν συνειδήσει πονηρᾷ. Αὕτη ἐστὶν ἡ ὁδὸς τῆς ζωῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/014.yaml
  text: In the assembly you shall confess your transgressions, and you shall not come to prayer with an evil conscience. This is the way of life.
translation:
  language: de
  text: In der Gemeinde sollst du deine Verfehlungen bekennen, und du sollst nicht mit einem bösen Gewissen zu deinem Gebet treten. Dies ist der Weg des Lebens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: in der Gemeinde
  rationale: ἐκκλησία bezeichnet hier die versammelte Glaubensgemeinschaft; „Gemeinde“ ist im Deutschen natürlich und bewahrt den gemeinschaftlichen Rahmen.
- source_word: ἐξομολογήσῃ
  choice: sollst du … bekennen
  rationale: Die futurische Form hat in diesem Weisungszusammenhang gebietenden Sinn; „bekennen“ gibt das offene Eingestehen angemessen wieder.
- source_word: παραπτώματά
  choice: Verfehlungen
  rationale: παράπτωμα bezeichnet Fehltritte oder Übertretungen; „Verfehlungen“ ist verständlich, würdig und weniger interpretierend als eine pauschale Wiedergabe mit „Sünden“.
- source_word: προσελεύσῃ ἐπὶ προσευχήν σου
  choice: zu deinem Gebet treten
  rationale: Die Formulierung bewahrt sowohl die Bewegung des Herantretens als auch das im griechischen Text vorhandene Possessivpronomen σου.
- source_word: ἐν συνειδήσει πονηρᾷ
  choice: mit einem bösen Gewissen
  rationale: Die instrumentale bzw. begleitende Bedeutung von ἐν wird im Deutschen idiomatisch mit „mit“ wiedergegeben; „böses Gewissen“ entspricht der wertenden Schärfe von πονηρά.
theological_decisions:
- issue: Rahmen des Bekennens
  choice: „in der Gemeinde“ ohne nähere Bestimmung der Adressaten
  alternative: „in der Versammlung“ oder eine ausdrückliche öffentliche Beichte
  rationale: Der Text nennt den gemeindlichen Rahmen, legt aber weder eine bestimmte liturgische Form noch den genauen menschlichen Adressaten des Bekenntnisses fest.
- issue: Bezug von σου bei προσευχήν
  choice: „deinem Gebet“
  alternative: bloß „zum Gebet“
  rationale: Die vorgelegte griechische Quelle enthält σου; die Übersetzung folgt daher der Originalsprachenevidenz, ohne festzulegen, ob ein persönliches Gebet oder die Teilnahme am gemeindlichen Gebet gemeint ist.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die wiederholte Soll-Form wahrt den Weisungscharakter, während der Schlusssatz bewusst knapp und formelhaft bleibt.
