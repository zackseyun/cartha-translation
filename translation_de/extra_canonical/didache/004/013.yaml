id: DID.4.13
reference: Didache 4:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μὴ ἐγκαταλίπῃς ἐντολὰς Κυρίου, φυλάξεις δὲ ἃ παρέλαβες, μήτε προστιθεὶς μήτε ἀφαιρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/013.yaml
  text: You shall never forsake the commandments of the Lord, but you shall keep what you received, neither adding nor taking away.
translation:
  language: de
  text: Du sollst die Gebote des Herrn niemals aufgeben, sondern bewahren, was du empfangen hast, ohne etwas hinzuzufügen oder wegzunehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ ἐγκαταλίπῃς
  choice: Du sollst … niemals aufgeben
  rationale: Die Verbindung οὐ μή mit dem Konjunktiv drückt eine nachdrückliche Verneinung aus. „Aufgeben“ gibt ἐγκαταλείπω im Zusammenhang mit Geboten natürlicher wieder als das wörtlichere „verlassen“.
- source_word: ἐντολὰς Κυρίου
  choice: die Gebote des Herrn
  rationale: Die geläufige und sachlich genaue Wiedergabe bewahrt Κυρίου ohne eine im griechischen Text nicht ausdrücklich vorgenommene Zuordnung zu Gott oder Jesus.
- source_word: φυλάξεις
  choice: bewahren
  rationale: Das Futur hat hier gebietenden Sinn. „Bewahren“ erfasst das treue Festhalten an dem Empfangenen.
- source_word: ἃ παρέλαβες
  choice: was du empfangen hast
  rationale: Die Formulierung gibt die Weitergabe und Entgegennahme überlieferter Weisung wieder, ohne den Inhalt näher festzulegen.
- source_word: μήτε προστιθεὶς μήτε ἀφαιρῶν
  choice: ohne etwas hinzuzufügen oder wegzunehmen
  rationale: Die modalen Partizipien beschreiben, wie das Empfangene bewahrt werden soll. Die deutsche Paarung gibt beide Verbote klar und idiomatisch wieder.
theological_decisions:
- issue: Bezug von Κυρίου
  choice: des Herrn
  alternative: Gottes / Jesu
  rationale: Der griechische Wortlaut nennt nur „Herr“; die Übersetzung bewahrt diese mögliche Offenheit und legt den Bezug nicht eigenmächtig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Anrede. Die nachdrückliche Verneinung und der Gegensatz zwischen Aufgeben und Bewahren bleiben erhalten; unnötig altertümliche Wendungen werden vermieden.
