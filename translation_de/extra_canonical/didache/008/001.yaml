id: DID.8.1
reference: Didache 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Αἱ δὲ νηστεῖαι ὑμῶν μὴ ἔστωσαν μετὰ τῶν ὑποκριτῶν· νηστεύουσι γὰρ δευτέρα σαββάτων καὶ πέμπτῃ· ὑμεῖς δὲ νηστεύσατε τετράδα καὶ παρασκευήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/001.yaml
  text: But let your fasts not be with the hypocrites, for they fast on the second day of the week and on the fifth; but you, fast on the fourth day and on Preparation.
translation:
  language: de
  text: Eure Fastentage sollen aber nicht mit denen der Heuchler zusammenfallen. Denn sie fasten am Montag und am Donnerstag; ihr aber sollt am Mittwoch und am Rüsttag[a] fasten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Rüsttag“ ist der Freitag, der Vorbereitungstag auf den Sabbat.
    reason: Die historische Bezeichnung παρασκευή ist heutigen Lesern möglicherweise nicht unmittelbar verständlich.
lexical_decisions:
- source_word: μετὰ τῶν ὑποκριτῶν
  choice: mit denen der Heuchler zusammenfallen
  rationale: Im Zusammenhang bezeichnet μετά wahrscheinlich nicht bloß Gemeinschaft, sondern dass dieselben Fastentage eingehalten werden; die Formulierung macht diesen zeitlichen Bezug im Deutschen natürlich verständlich.
- source_word: δευτέρα σαββάτων
  choice: Montag
  rationale: Wörtlich der zweite Tag der Woche; im modernen Deutschen entspricht dies Montag.
- source_word: πέμπτῃ
  choice: Donnerstag
  rationale: Gemeint ist der fünfte Wochentag in antiker Zählung.
- source_word: τετράδα
  choice: Mittwoch
  rationale: Wörtlich der vierte Tag; als Wochentag ist Mittwoch gemeint.
- source_word: παρασκευήν
  choice: Rüsttag
  rationale: Der traditionelle jüdische Name für den Vorbereitungstag vor dem Sabbat, also Freitag; die Wiedergabe bewahrt die historische Benennung, während die Fußnote sie erklärt.
theological_decisions:
- issue: Bezeichnung der anderen Fastenden als ὑποκριταί
  choice: Heuchler
  alternative: Scheinheilige
  rationale: „Heuchler“ ist die direkte, etablierte Wiedergabe und vermeidet eine weitergehende Identifizierung der gemeinten Gruppe, die der Text selbst nicht ausdrücklich vornimmt.
- issue: Normativer Charakter des Imperativs νηστεύσατε
  choice: ihr aber sollt … fasten
  alternative: fastet ihr aber
  rationale: Die Soll-Form gibt die gemeinschaftliche Anweisung in natürlichem, würdigem Deutsch wieder, ohne ihre Verbindlichkeit abzuschwächen oder konfessionell auszudeuten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die antiken numerischen Wochentagsbezeichnungen werden mit den heute üblichen Namen wiedergegeben; „Rüsttag“ bleibt als historisch geprägter Ausdruck erhalten und wird erläutert.
