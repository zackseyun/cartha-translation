id: DID.8.2
reference: Didache 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδὲ προσεύχεσθε ὡς οἱ ὑποκριταί, ἀλλʼ ὡς ἐκέλευσεν ὁ Κύριος ἐν τῷ εὐαγγελίῳ αὐτοῦ, οὕτω προσεύχεσθε· Πάτερ ἡμῶν ὁ ἐν τῷ οὐρανῷ, ἁγιασθήτω τὸ ὄνομά σου, ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς· τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον καὶ ἄφες ἡμῖν τὴν ὀφειλὴν ἡμῶν ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν, καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/002.yaml
  text: 'Do not pray like the hypocrites[a], but as the Lord commanded in his gospel, pray in this way:


    Our Father in heaven,

    may your name be made holy,

    may your kingdom come,

    may your will be done,

    as in heaven, so also on earth.

    Give us today our bread for the day,

    and forgive us our debt,

    as we also forgive our debtors,

    and do not bring us into testing,

    but rescue us from the evil one;

    for yours is the power and the glory unto the ages.'
translation:
  language: de
  text: 'Betet auch nicht wie die Heuchler, sondern betet so, wie der Herr es in seinem Evangelium geboten hat:


    Unser Vater im Himmel,

    dein Name werde geheiligt,

    dein Reich komme,

    dein Wille geschehe,

    wie im Himmel, so auch auf der Erde.

    Gib uns heute das Brot, das wir für den Tag brauchen.[a]

    Und vergib uns unsere Schuld,

    wie auch wir unseren Schuldnern vergeben.

    Und führe uns nicht in Versuchung,[b]

    sondern rette uns vor dem Bösen;[c]

    denn dein ist die Macht und die Herrlichkeit in alle Ewigkeit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort kann auch „täglich“, „notwendig“ oder „für den kommenden Tag bestimmt“ bedeuten.
    reason: Die Bedeutung von ἐπιούσιος ist in der antiken Überlieferung und der modernen Forschung umstritten.
  - marker: b
    text: 'Oder: „in eine Prüfung“ beziehungsweise „in eine Erprobung“.'
    reason: πειρασμός umfasst je nach Zusammenhang Versuchung, Prüfung oder Erprobung.
  - marker: c
    text: 'Oder: „vor dem Bösen“ im Sinn von „vor dem Bösen selbst“; die griechische Form kann auch personal als „vor dem Bösen“ beziehungsweise „vor dem bösen Einen“ verstanden werden.'
    reason: τοῦ πονηροῦ lässt grammatisch sowohl eine sachliche als auch eine personale Deutung zu.
lexical_decisions:
- source_word: Μηδὲ
  choice: auch nicht
  rationale: Kennzeichnet hier ein weiteres Verbot im fortlaufenden Zusammenhang; „auch nicht“ ist im Deutschen natürlicher als ein isoliertes „weder“ oder „noch“.
- source_word: ὑποκριταί
  choice: Heuchler
  rationale: Die geläufige und sachlich passende Wiedergabe für Menschen, deren religiöses Auftreten nicht ihrer inneren Haltung entspricht.
- source_word: εὐαγγελίῳ
  choice: Evangelium
  rationale: Bewahrt den frühchristlichen Ausdruck und lässt offen, ob eine mündliche oder schriftliche Evangeliumsüberlieferung gemeint ist.
- source_word: ἐπιούσιον
  choice: das wir für den Tag brauchen
  rationale: Eine verständliche Wiedergabe im unmittelbaren Zusammenhang mit „heute“; wegen der außergewöhnlichen und umstrittenen Bedeutung des griechischen Wortes werden Alternativen in einer Fußnote genannt.
- source_word: ὀφειλήν / ὀφειλέταις
  choice: Schuld / Schuldnern
  rationale: Erhält die im Griechischen durchgehend verwendete Schuldmetaphorik, statt sie bereits als „Sünden“ beziehungsweise „Menschen, die gegen uns gesündigt haben“ auszulegen.
- source_word: πειρασμόν
  choice: Versuchung
  rationale: Traditionell verständlich und lexikalisch möglich; die weitere Bedeutung „Prüfung/Erprobung“ wird in der Fußnote offengehalten.
- source_word: ῥῦσαι
  choice: rette
  rationale: Gibt den konkreten Sinn von Befreiung beziehungsweise Rettung natürlich wieder, ohne sich auf die liturgisch vertraute Formulierung „erlöse“ festzulegen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in alle Ewigkeit
  rationale: Natürliche, würdevolle deutsche Entsprechung der idiomatischen Wendung „in die Zeitalter“.
theological_decisions:
- issue: Bedeutung von ἐπιούσιος
  choice: Brot, das wir für den Tag brauchen
  alternative: tägliches, notwendiges oder für den kommenden Tag bestimmtes Brot
  rationale: Das seltene Wort ist etymologisch und kontextuell umstritten. Der Haupttext bietet eine verständliche Lesart, während die Fußnote die echte Unsicherheit sichtbar macht.
- issue: Bedeutungsumfang von πειρασμός
  choice: Versuchung
  alternative: Prüfung oder Erprobung
  rationale: Der griechische Ausdruck kann sowohl verlockende Versuchung als auch eine prüfende Bedrängnis bezeichnen; die Übersetzung darf diesen Spannungsbereich nicht verdecken.
- issue: Bezug von τοῦ πονηροῦ
  choice: dem Bösen
  alternative: der Böse
  rationale: Die griechische Form kann sachlich das Böse oder personal den Bösen bezeichnen. Die deutsche Formulierung „dem Bösen“ lässt diese Spannung weitgehend bestehen; die Fußnote benennt sie ausdrücklich.
- issue: Schuldmetaphorik im Vergebungsgebet
  choice: Schuld und Schuldner
  alternative: Sünden und Menschen, die gegen uns sündigen
  rationale: Die direkte Metapher des Ausgangstextes wird bewahrt und nicht vorschnell auf eine bestimmte theologische Paraphrase verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gebetsrhythmik. Vertraute Formulierungen des Vaterunsers werden dort beibehalten, wo sie den griechischen Wortlaut präzise wiedergeben; schwer verständliche oder theologisch umstrittene Ausdrücke werden im Haupttext lesbar formuliert und durch knappe Fußnoten transparent gemacht.
