id: DID.5.2
reference: Didache 5:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: διῶκται ἀγαθῶν, μισοῦντες ἀλήθειαν, ἀγαπῶντες ψεῦδος, οὐ γινώσκοντες μισθὸν δικαιοσύνης, οὐ κολλώμενοι ἀγαθῷ οὐδὲ κρίσει δικαίᾳ, ἀγρυπνοῦντες οὐκ εἰς τὸ ἀγαθὸν, ἀλλ’ εἰς τὸ πονηρόν· ὧν μακρὰν πραΰτης καὶ ὑπομονή, μάταια ἀγαπῶντες, διώκοντες ἀνταπόδομα, οὐκ ἐλεοῦντες πτωχόν, οὐ πονοῦντες ἐπὶ καταπονουμένῳ, οὐ γινώσκοντες τὸν ποιήσαντα αὐτούς, φονεῖς τέκνων, φθορεῖς πλάσματος Θεοῦ, ἀποστρεφόμενοι τὸν δεόμενον, καταπονοῦντες τὸν θλιβόμενον, πλουσίων παράκλητοι, πενήτων ἄνομοι κριταί, πανθαμάρτητοι· ῥυσθείητε, τέκνα, ἀπὸ τούτων ἁπάντων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/002.yaml
  text: persecutors of the good[a], hating truth, loving falsehood, not knowing the reward of righteousness, not clinging to what is good nor to righteous judgment, keeping watch not for what is good but for what is evil; from whom gentleness and patience are far, loving vain things, pursuing repayment, not showing mercy to the poor, not feeling distress for one who is oppressed, not knowing the one who made them, murderers of children, destroyers of God's handiwork, turning away from the one in need, oppressing the one under affliction, advocates of the rich, lawless judges of the poor, altogether sinful. Be delivered, children, from all these things.
translation:
  language: de
  text: Verfolger des Guten, die die Wahrheit hassen und die Lüge lieben, die den Lohn der Gerechtigkeit nicht kennen, sich weder an das Gute noch an gerechtes Urteil halten und nicht auf das Gute, sondern auf das Böse bedacht sind; Menschen, denen Sanftmut und Geduld fern sind, die Nichtiges lieben und nach Vergeltung streben, die kein Erbarmen mit den Armen haben und nicht mit dem Bedrückten mitfühlen,[a] die den nicht kennen, der sie geschaffen hat; Kindermörder, Verderber von Gottes Geschöpf, Menschen, die sich von Bedürftigen abwenden, Bedrängte unterdrücken, für die Reichen eintreten und als gesetzlose Richter über die Armen urteilen – durch und durch Sünder. Möget ihr, Kinder, von all dem befreit werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich nicht für den Bedrückten abmühen“.'
    reason: πονέω kann auch körperliche oder tätige Mühe bezeichnen; im vorliegenden Zusammenhang spricht die Verbindung mit ἐπί und dem Dativ eher für schmerzliches Mitgefühl.
lexical_decisions:
- source_word: διῶκται ἀγαθῶν
  choice: Verfolger des Guten
  rationale: Die Formulierung bewahrt den substantivierten, umfassenden Sinn von ἀγαθῶν, ohne ihn unnötig auf gute Menschen oder gute Taten einzuengen.
- source_word: ἀγρυπνοῦντες
  choice: über … wachen
  rationale: Gibt das Bild wachsamer Aufmerksamkeit wieder; im Deutschen verlangt die Formulierung hier eine Ergänzung mit „über“.
- source_word: διώκοντες ἀνταπόδομα
  choice: nach Vergeltung streben
  rationale: ἀνταπόδομα bezeichnet eine Gegenleistung oder Vergeltung. „Vergeltung“ hält offen, ob eigennützige Rückzahlung oder rächende Erwiderung gemeint ist.
- source_word: οὐ πονοῦντες ἐπὶ καταπονουμένῳ
  choice: nicht mit dem Bedrückten mitfühlen
  rationale: πονέω mit ἐπί und Dativ bezeichnet hier am ehesten schmerzliches Anteilnehmen am Leid eines anderen und entspricht dem Zusammenhang fehlender Barmherzigkeit.
- source_word: φθορεῖς πλάσματος Θεοῦ
  choice: Verderber dessen, was Gott gebildet hat
  rationale: πλάσμα bezeichnet das von Gott Geformte oder Gebildete. Die Wiedergabe wahrt das Schöpfungsbild und vermeidet eine dogmatische Präzisierung.
- source_word: πλουσίων παράκλητοι
  choice: für die Reichen eintreten
  rationale: παράκλητοι bezeichnet Fürsprecher oder Beistände; die verbale Wiedergabe ist im Deutschen natürlich und erhält den Kontrast zu den Armen.
- source_word: πανθαμάρτητοι
  choice: durch und durch Sünder
  rationale: Das seltene Wort bezeichnet Menschen, die gänzlich beziehungsweise in jeder Hinsicht sündig sind.
- source_word: ῥυσθείητε
  choice: Möget ihr … errettet werden
  rationale: Der Optativ drückt einen abschließenden Wunsch aus; die passive Form und der Befreiungsgedanke bleiben erhalten.
theological_decisions:
- issue: Gegenstand der Verfolgung in διῶκται ἀγαθῶν
  choice: „des Guten“ als umfassende, abstrakte Formulierung
  alternative: „guter Menschen“ oder „guter Dinge“
  rationale: Der griechische Genitiv Plural kann kontextuell Personen oder gute Dinge bezeichnen. Die deutsche substantivierte Form lässt diese Weite bestehen.
- issue: πλάσμα Θεοῦ und die Tötung von Kindern
  choice: Das von Gott Gebildete, ohne weitere Identifikation
  alternative: „Gottes Geschöpfe“ oder ausdrückliche Gleichsetzung mit ungeborenen Kindern
  rationale: Der unmittelbare Zusammenhang ist scharf, doch der Wortlaut selbst benennt nur Gottes Gebilde. Die Übersetzung importiert keine über den Text hinausgehende Festlegung.
- issue: Abschließender Optativ
  choice: Segens- beziehungsweise Wunschform „Möget ihr …“
  alternative: Imperativisch „Lasst euch … retten“ oder „Haltet euch … fern“
  rationale: Die gewählte Form erhält die grammatische Spannung eines passiven Wunsches, statt ihn in eine direkte Aufforderung umzudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die lange katalogartige Satzbewegung des griechischen Textes bleibt erkennbar, wird aber durch wiederaufgenommene Bezeichnungen wie „Menschen“ und durch klare Zeichensetzung lesbar gehalten. Paarungen und Kontraste – Wahrheit/Lüge, Gutes/Böses, Reiche/Arme – wurden bewahrt.
