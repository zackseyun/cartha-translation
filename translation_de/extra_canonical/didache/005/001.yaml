id: DID.5.1
reference: Didache 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ δὲ τοῦ θανάτου ὁδός ἐστιν αὕτη· πρῶτον πάντων πονηρά ἐστι καὶ κατάρας μεστή· φόνοι, μοιχεῖαι, ἐπιθυμίαι, πορνεῖαι, κλοπαί, εἰδωλολατρεῖαι, μαγεῖαι, φαρμακεῖαι, ἁρπαγαί, ψευδομαρτυρίαι, ὑποκρίσεις, διπλοκαρδία, δόλος, ὑπερηφανία, κακία, αὐθάδεια, πλεονεξία, αἰσχρολογία, ζηλοτυπία, θρασύτης, ὕψος, ἀλαζονεία·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/001.yaml
  text: 'But the way of death is this: first of all, it is evil and full of a curse: murders, adulteries, lusts, sexual immoralities, thefts, idolatries, sorceries, magic arts, robberies, false testimonies, hypocrisies, double-heartedness, deceit, arrogance, malice, self-will, greed, foul speech, jealousy, audacity, haughtiness, boastfulness;'
translation:
  language: de
  text: 'Der Weg des Todes aber ist dieser: Vor allem ist er böse und voller Verfluchung: Mord, Ehebruch, Begierden, sexuelle Unmoral, Diebstahl, Götzendienst, Zauberei, Giftmischerei[a], Raub, falsche Zeugenaussagen, Heuchelei, Doppelherzigkeit, Betrug, Hochmut, Bosheit, Eigenmächtigkeit, Habgier, schändliches Reden, Eifersucht, Dreistigkeit, Überheblichkeit, Prahlerei;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zaubermittel« beziehungsweise »magischer Gebrauch von Mitteln«.'
    reason: φαρμακεῖαι kann Giftmischerei, Drogen- beziehungsweise Zaubermittelgebrauch und damit verbundene magische Praktiken bezeichnen.
lexical_decisions:
- source_word: κατάρας μεστή
  choice: voller Fluch
  rationale: Bewahrt den genitivischen Ausdruck und klingt im Deutschen natürlich; der Fluch wird als kennzeichnende Fülle des Weges dargestellt.
- source_word: ἐπιθυμίαι
  choice: Begierden
  rationale: Gibt den pluralischen, sittlich negativ geprägten Begriff wieder, ohne ihn enger als der griechische Text zu bestimmen.
- source_word: πορνεῖαι
  choice: sexuelle Unmoral
  rationale: Ein verständlicher Oberbegriff für unerlaubte sexuelle Handlungen; der Pluralcharakter wird begrifflich zusammengefasst.
- source_word: μαγεῖαι
  choice: Zauberei
  rationale: Bezeichnet magische Praktiken allgemein und unterscheidet sie von φαρμακεῖαι.
- source_word: φαρμακεῖαι
  choice: Giftmischerei
  rationale: Der Begriff kann Giftmischerei beziehungsweise den magischen Gebrauch von Mitteln bezeichnen; die Wahl wahrt die Unterscheidung zum vorhergehenden μαγεῖαι.
- source_word: διπλοκαρδία
  choice: Doppelherzigkeit
  rationale: Bildnahe Wiedergabe einer innerlich geteilten oder unaufrichtigen Haltung.
- source_word: αὐθάδεια
  choice: Eigenmächtigkeit
  rationale: Erfasst selbstgefälliges Beharren auf dem eigenen Willen, ohne bloß allgemeine Sturheit auszudrücken.
- source_word: αἰσχρολογία
  choice: schändliches Reden
  rationale: Deckt anstößige, schmutzige oder beschämende Rede ab, ohne unnötige Verengung.
- source_word: θρασύτης
  choice: Dreistigkeit
  rationale: Gibt die negative Kühnheit oder Unverschämtheit des Ausdrucks idiomatisch wieder.
- source_word: ὕψος
  choice: Überheblichkeit
  rationale: Überträgt die bildliche 'Höhe' als hochmütige Selbsterhöhung und hält sie von den benachbarten Begriffen unterscheidbar.
- source_word: ἀλαζονεία
  choice: Prahlerei
  rationale: Betont das prahlerische, anmaßende Auftreten und unterscheidet es von ὑπερηφανία und ὕψος.
theological_decisions:
- issue: Bedeutung von κατάρας μεστή
  choice: voller Fluch
  alternative: voller Verfluchung / voller Flüche
  rationale: Der Singular κατάρας lässt sowohl den Zustand des Verfluchtseins als auch fluchendes Handeln anklingen. Die knappe deutsche Form bewahrt diese Offenheit, ohne einen ausdrücklich göttlichen Fluch einzutragen.
- issue: Abgrenzung von μαγεῖαι und φαρμακεῖαι
  choice: Zauberei, Giftmischerei
  alternative: magische Künste, Zaubermittel
  rationale: Die Übersetzung erhält zwei eigenständige Laster und vermeidet, beide unterschiedslos als Magie wiederzugeben; die Fußnote weist auf die Bedeutungsbreite des zweiten Ausdrucks hin.
translation_notes:
  register: Moderne, würdige Standardsprache. Die asyndetische Lasterliste und das abschließende Semikolon des fortlaufenden Abschnitts bleiben erhalten. Abstrakta und Pluralformen werden soweit im Deutschen idiomatisch möglich bewahrt; eng benachbarte Hochmutsbegriffe werden differenziert wiedergegeben.
