    rationale: εὐχαριστεῖν bezeichnet das Danksagen; trotz des unmittelbaren liturgischen Kontexts steht im Satz weder ein bestimmter Artikel noch ein Substantiv „Gebet“. Die Ergänzung kann den Spielraum des Textes unnötig verengen.
  - severity: low
    issue: „so zu sprechen, wie sie wollen“ glättet ὅσα zu stark als bloße Art und Weise.
    rationale: ὅσα θέλουσιν heißt wörtlich eher „was immer sie wollen“ und lässt damit Inhalt, Form und gegebenenfalls Umfang offen.
  revised_text: Den Propheten aber erlaubt, Dank zu sagen, was immer sie wollen.
