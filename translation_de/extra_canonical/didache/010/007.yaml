  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τοῖς δὲ προφήταις ἐπιτρέπετε εὐχαριστεῖν ὅσα θέλουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/007.yaml
  text: But permit the prophets to give thanks as they desire.
translation:
  language: de
  text: Den Propheten aber erlaubt, Dank zu sagen, was immer sie wollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῖς δὲ προφήταις
  choice: Den Propheten aber
  rationale: Gibt den dativischen Bezug und den weiterführend-kontrastierenden Anschluss δέ knapp und natürlich wieder.
- source_word: ἐπιτρέπετε
  choice: erlaubt
  rationale: Der Imperativ Plural bezeichnet eine ausdrückliche Erlaubnis an die angesprochene Gemeinschaft.
- source_word: εὐχαριστεῖν
  choice: das Dankgebet … zu sprechen
  rationale: Im unmittelbaren Zusammenhang bezeichnet εὐχαριστεῖν das liturgische Danken beim Mahl; „Dankgebet“ macht diesen Kontext verständlich, ohne den späteren technischen Sinn von „Eucharistie feiern“ einzutragen.
- source_word: ὅσα θέλουσιν
  choice: so …, wie sie wollen
  rationale: Bewahrt den Spielraum hinsichtlich Umfang beziehungsweise Gestaltung des Dankgebets und klingt im modernen Deutsch natürlich.
theological_decisions:
- issue: Bedeutung von εὐχαριστεῖν im eucharistischen Kontext
  choice: das Dankgebet sprechen
  alternative: die Eucharistie feiern / Dank sagen
  rationale: „Das Dankgebet sprechen“ hält den Mahl- und Gebetskontext fest, ohne eine später entwickelte liturgische Terminologie vorauszusetzen; gegenüber dem bloßen „Dank sagen“ ist es im Zusammenhang der vorangehenden Gebete präziser.
- issue: Reichweite von ὅσα θέλουσιν
  choice: wie sie wollen
  alternative: so viel sie wollen
  rationale: Die Formulierung lässt offen, ob die Freiheit vor allem Umfang, Wortlaut oder Gestaltung betrifft, statt sie nur auf die Länge des Gebets zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Pluralimperativ „erlaubt“ entspricht der gemeinschaftlichen Anrede. Keine Fußnoten erforderlich.
