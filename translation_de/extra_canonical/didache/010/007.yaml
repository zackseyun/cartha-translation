review_pass:
  verdict: revise
  source_fidelity: Die Anrede und der Imperativ sind zutreffend wiedergegeben. Das griechische εὐχαριστεῖν bedeutet unmittelbar „Dank sagen/Dank darbringen“; der Kontext steht zwar beim Mahlgebet, doch der Text nennt kein bestimmtes „Dankgebet“. ὅσα θέλουσιν gewährt umfassend Freiheit hinsichtlich dessen, was die Propheten sagen wollen.
  naturalness: „Den Propheten aber erlaubt, Dank zu sagen, was immer sie wollen“ ist modernes, flüssiges Standarddeutsch und bewahrt den pluralischen Aufforderungscharakter.
  terminology: „Dank zu sagen“ ist gegenüber „das Dankgebet zu sprechen“ weniger einengend und vermeidet die nicht ausdrücklich im griechischen Text enthaltene Annahme eines einzelnen fest umrissenen Gebets. Es führt keine spätere technische Eucharistieterminologie ein.
  issues:
