id: DID.10.3
reference: Didache 10:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Σὺ, δέσποτα παντοκράτορ, ἔκτισας τὰ πάντα ἕνεκεν τοῦ ὀνόματός σου, τροφήν τε καὶ ποτὸν ἔδωκας τοῖς ἀνθρώποις εἰς ἀπόλαυσιν ἵνα σοι εὐχαριστήσωσιν, ἡμῖν δὲ ἐχαρίσω πνευματικὴν τροφὴν καὶ ποτὸν καὶ ζωὴν αἰώνιον διὰ τοῦ παιδός σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/003.yaml
  text: 'You, almighty Master,

    created all things for the sake of your name,

    and gave food and drink to people for enjoyment,

    so that they might give thanks to you;

    but to us you graciously gave spiritual food and drink

    and eternal life through your servant.'
translation:
  language: de
  text: 'Du, allmächtiger Herr,

    hast alles um deines Namens willen erschaffen

    und den Menschen Speise und Trank zum Genuss gegeben,

    damit sie dir danken;

    uns aber hast du durch deinen Diener[a]

    geistliche Speise und geistlichen Trank

    und ewiges Leben geschenkt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Sohn“ beziehungsweise „dein Kind“. Das griechische Wort παῖς kann „Diener“, „Kind“ oder „Sohn“ bedeuten.'
    reason: Die semantische Mehrdeutigkeit des griechischen παῖς ist theologisch bedeutsam und soll nicht stillschweigend beseitigt werden.
lexical_decisions:
- source_word: δέσποτα παντοκράτορ
  choice: allmächtiger Herr
  rationale: Die Anrede gibt sowohl die uneingeschränkte Herrschaft von δεσπότης als auch die Allmacht von παντοκράτωρ in natürlichem, würdigem Deutsch wieder.
- source_word: ἕνεκεν τοῦ ὀνόματός σου
  choice: um deines Namens willen
  rationale: Bewahrt die Zweck- beziehungsweise Beweggrundformulierung des Griechischen, ohne sie weiter auszudeuten.
- source_word: τοῖς ἀνθρώποις
  choice: den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein, nicht ausschließlich Männer.
- source_word: εἰς ἀπόλαυσιν
  choice: zum Genuss
  rationale: Gibt den positiven Sinn von Gebrauch, Genuss oder Freude an den Gaben knapp und idiomatisch wieder.
- source_word: ἐχαρίσω
  choice: hast du … geschenkt
  rationale: Drückt die gnädige, freie Zuwendung des Verbs χαρίζομαι aus; im Deutschen trägt „geschenkt“ diesen Sinn ohne eine schwerfällige Doppelung mit „gnädig“.
- source_word: πνευματικὴν τροφὴν καὶ ποτὸν
  choice: geistliche Speise und geistlichen Trank
  rationale: Bewahrt die kultisch-theologische Sprache und den Gegensatz zur gewöhnlichen Speise und zum gewöhnlichen Trank.
- source_word: διὰ τοῦ παιδός σου
  choice: durch deinen Diener
  rationale: παῖς kann „Kind/Sohn“ oder „Diener“ bedeuten. „Diener“ entspricht hier dem frühchristlichen Sprachgebrauch, während eine Fußnote die echte Mehrdeutigkeit offenhält.
theological_decisions:
- issue: Bedeutung von παῖς in der Wendung διὰ τοῦ παιδός σου
  choice: Diener
  alternative: Sohn; Kind
  rationale: Der unmittelbare griechische Ausdruck bezeichnet die vermittelnde Gestalt als Gottes παῖς und kann an den biblischen Gottesknecht-Sprachgebrauch anknüpfen. Da das Wort zugleich „Kind“ beziehungsweise „Sohn“ heißen kann, wird diese Spannung nicht dogmatisch aufgelöst, sondern in der Fußnote kenntlich gemacht.
- issue: Verhältnis der allgemeinen Schöpfungsgaben zu den Gaben an „uns“
  choice: Den Gegensatz mit „uns aber“ beibehalten
  alternative: Die zweite Aussage erläuternd als ausschließlich eucharistische oder ausschließlich geistige Gabe bestimmen
  rationale: Der Text kontrastiert Speise und Trank für die Menschen mit geistlicher Speise, geistlichem Trank und ewigem Leben für die betende Gemeinschaft. Welche sakramentalen oder weiteren theologischen Bezüge gemeint sind, wird nicht über den Wortlaut hinaus festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht liturgischem Klang. „Speise“ und „Trank“ wurden statt der alltäglicheren Wörter „Essen“ und „Getränk“ gewählt, weil sie die parallele Gebetssprache und den Gegensatz zwischen leiblichen und geistlichen Gaben besser tragen. Die Zeilenstruktur folgt den Sinnabschnitten des griechischen Gebets.
