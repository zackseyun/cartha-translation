  terminology: „Allmächtiger Herr“ ist eine natürliche und hinreichend genaue Wiedergabe von δέσποτα παντοκράτορ. „Um deines Namens willen“, „zum Genuss“, „geschenkt“ und „ewiges Leben“ sind treffend. Die Fußnote zu παῖς wahrt die reale lexikalische Mehrdeutigkeit, ohne eine dogmatische Entscheidung vorzuschreiben.
