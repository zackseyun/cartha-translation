  text: 'Nachdem ihr euch satt gegessen habt, dankt auf folgende Weise:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὸ ἐμπλησθῆναι
  choice: Nachdem ihr euch satt gegessen habt
  rationale: Die Wendung bezeichnet im Zusammenhang mit der Mahlzeit den Zeitpunkt nach dem Sattwerden. Die natürliche deutsche Formulierung vermeidet die missverständliche, übermäßig wörtliche Wiedergabe „nachdem ihr erfüllt worden seid“.
- source_word: οὕτως εὐχαριστήσατε
  choice: dankt auf folgende Weise
  rationale: εὐχαριστέω bedeutet hier, im Rahmen des Gebets Dank zu sagen; οὕτως leitet den unmittelbar folgenden Wortlaut ein.
theological_decisions:
- issue: Bedeutung des Sattwerdens im Mahlkontext
  choice: körperliches Sattwerden nach der Mahlzeit
  alternative: geistliches Erfülltwerden
  rationale: Der unmittelbare Kontext ist das Dankgebet nach der Mahlzeit; daher ist die körperliche Bedeutung sachlich geboten, ohne eine zusätzliche geistliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Plural der griechischen Verbform wird mit „ihr“ sichtbar gemacht; der Satz eignet sich als klare Einleitung zum folgenden Dankgebet.
