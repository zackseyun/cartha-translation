id: DID.10.5
reference: Didache 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μνήσθητι, Κύριε, τῆς ἐκκλησίας σου τοῦ ῥύσασθαι αὐτὴν ἀπὸ παντὸς πονηροῦ καὶ τελειῶσαι αὐτὴν ἐν τῇ ἀγάπῃ σου, καὶ σύναξον αὐτὴν ἀπὸ τῶν τεσσάρων ἀνέμων, τὴν ἁγιασθεῖσαν εἰς τὴν σὴν Βασιλείαν, ἣν ἡτοίμασας αὐτῇ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/005.yaml
  text: Remember[a], Lord, your church, to deliver it from every evil and to perfect it in your love; and gather it from the four winds, the one sanctified for your kingdom, which you prepared for it. For yours is the power and the glory forever.
translation:
  language: de
  text: 'Gedenke, Herr, deiner Gemeinde: Befreie sie von allem Bösen und vollende sie in deiner Liebe. Führe sie aus den vier Winden zusammen – sie, die für dein Reich geheiligt ist, das du für sie bereitet hast. Denn dein ist die Macht und die Herrlichkeit in Ewigkeit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μνήσθητι
  choice: Gedenke
  rationale: Der Gebetsimperativ wird mit der geläufigen, würdevollen deutschen Gebetssprache wiedergegeben; gemeint ist wirksames Erinnern und Zuwenden.
- source_word: ἐκκλησίας
  choice: Gemeinde
  rationale: „Gemeinde“ bezeichnet hier die Gemeinschaft der Glaubenden natürlich und ohne die mögliche institutionelle Verengung von „Kirche“.
- source_word: ῥύσασθαι
  choice: Befreie
  rationale: Der Aoristinfinitiv bezeichnet rettendes Herausreißen beziehungsweise Befreien; der deutsche Imperativ gibt die vom einleitenden „Gedenke“ abhängige Bitte klar wieder.
- source_word: τελειῶσαι
  choice: vollende
  rationale: Bewahrt die Vorstellung, dass Gott die Gemeinde zur Ganzheit beziehungsweise zu ihrem Ziel bringt, statt das Verb lediglich moralisch als „vervollkommnen“ zu deuten.
- source_word: σύναξον
  choice: Führe ... zusammen
  rationale: Gibt das Sammeln der zerstreuten Gemeinde idiomatisch wieder und behält die räumliche Ergänzung „aus den vier Winden“ bei.
- source_word: ἀπὸ τῶν τεσσάρων ἀνέμων
  choice: aus den vier Winden
  rationale: Die traditionelle kosmische Wendung wird formal bewahrt; sie bezeichnet die Gesamtheit der Himmelsrichtungen.
- source_word: ἁγιασθεῖσαν
  choice: die ... geheiligt ist
  rationale: Das feminine Partizip bezieht sich auf die Gemeinde; die Relativkonstruktion ist im Deutschen klar und bewahrt das passive Geheiligtsein.
- source_word: Βασιλείαν
  choice: Reich
  rationale: „Reich“ ist die etablierte und kontextgerechte Wiedergabe der göttlichen Königsherrschaft.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Eine natürliche, liturgisch würdige Wiedergabe der doxologischen Zeitformel.
theological_decisions:
- issue: Bezug und Funktion von τὴν ἁγιασθεῖσαν
  choice: 'Als nachgestellte Beschreibung der Gemeinde: „sie, die für dein Reich geheiligt ist“'
  alternative: „Führe die Geheiligte ... zusammen“ oder Ergänzung von „Gemeinde“
  rationale: Genus und Kasus verbinden das Partizip mit der zuvor genannten Gemeinde. Die Relativform vermeidet den Eindruck einer einzelnen weiblichen Person und fügt kein im Griechischen wiederholtes Substantiv ein.
- issue: Zuordnung von εἰς τὴν σὴν Βασιλείαν
  choice: „für dein Reich geheiligt“
  alternative: „Führe sie ... in dein Reich zusammen“
  rationale: Die Wortstellung erlaubt eine gewisse syntaktische Spannung. Die unmittelbare Stellung nach ἁγιασθεῖσαν spricht dafür, εἰς τὴν σὴν Βασιλείαν zunächst mit dem Geheiligtsein zu verbinden; die Übersetzung wahrt diese naheliegende Lesart, ohne das Reich als Ziel des Sammelns auszuschließen.
- issue: Antezedens von ἣν in ἣν ἡτοίμασας αὐτῇ
  choice: 'Bezug auf „dein Reich“: „das du für sie bereitet hast“'
  alternative: Bezug auf die Gemeinde
  rationale: Das feminine Relativpronomen kann formal auf βασιλείαν zurückverweisen; semantisch passt das Bereiten des Reiches für die Gemeinde unmittelbar. Der Bezug auf ἐκκλησία wäre wegen der größeren Entfernung weniger wahrscheinlich.
- issue: Bedeutung von παντὸς πονηροῦ
  choice: „allem Bösen“
  alternative: „jedem Bösen“ oder „jedem Übeltäter“
  rationale: Die neutrale Form lässt Böses allgemein erkennen; eine Personifizierung oder Beschränkung auf den Bösen wäre eine unnötige Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht liturgischem Klang. Der Doppelpunkt nach „Gemeinde“ macht die beiden vom griechischen Infinitiv ausgedrückten Bitten im Deutschen verständlich; der Gedankenstrich kennzeichnet die appositionelle Beschreibung, ohne den Satzfluss unnötig zu verkomplizieren.
