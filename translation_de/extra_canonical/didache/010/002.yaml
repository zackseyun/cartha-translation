source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εὐχαριστοῦμέν σοι, Πάτερ ἅγιε, ὑπὲρ τοῦ ἁγίου ὀνόματός σου, οὗ κατεσκήνωσας ἐν ταῖς καρδίαις ἡμῶν, καὶ ὑπὲρ τῆς γνώσεως καὶ πίστεως καὶ ἀθανασίας, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/002.yaml
  text: 'We give thanks to you, Holy Father,

    for your holy name,

    which you caused to dwell in our hearts,

    and for the knowledge and faith and immortality

    which you made known to us through Jesus your servant;

    to you be the glory forever.'
translation:
  language: de
  text: 'Wir danken dir, heiliger Vater,


    für deinen heiligen Namen,


    den du in unseren Herzen wohnen ließest,


    und für die Erkenntnis, den Glauben und die Unsterblichkeit,


    die du uns durch Jesus, deinen Diener, kundgetan hast.


    Dir sei die Herrlichkeit in Ewigkeit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμέν
  choice: Wir danken
  rationale: Gibt die gewöhnliche Bedeutung des Verbs im Gebetszusammenhang natürlich und unmittelbar wieder.
- source_word: κατεσκήνωσας
  choice: wohnen ließest
  rationale: Bewahrt das Bild davon, dass Gott seinen Namen in den Herzen Wohnung nehmen ließ; das zugrunde liegende Zeltmotiv bleibt im Deutschen nur indirekt erhalten.
- source_word: γνώσεως
  choice: Erkenntnis
  rationale: Entspricht dem religiösen und geistlichen Sinn von γνῶσις besser als das allgemeinere „Wissen“.
- source_word: ἀθανασίας
  choice: Unsterblichkeit
  rationale: Ist die direkte und sachlich präzise Wiedergabe des griechischen Begriffs.
- source_word: παιδός
  choice: Diener
  rationale: παῖς kann „Kind/Sohn“ oder „Diener“ bedeuten. In frühchristlicher Gebetssprache mit Bezug auf Jesus klingt wahrscheinlich die biblische Bezeichnung des Gottesknechts an; „Diener“ wahrt diese Linie, ohne ausdrücklich „Sohn“ einzutragen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Natürliche, würdige deutsche Doxologie, die den zeitlich unbegrenzten Sinn der griechischen Wendung wiedergibt.
theological_decisions:
- issue: Bedeutung von παῖς für Jesus
  choice: Diener
  alternative: Sohn / Kind
  rationale: Der Ausdruck ist lexikalisch mehrdeutig. „Diener“ entspricht dem möglichen Gottesknecht-Hintergrund und vermeidet, die im Wort selbst bestehende Spannung stillschweigend zugunsten einer ausdrücklichen Sohnestitulatur aufzulösen.
- issue: Das Wohnen des göttlichen Namens im Herzen
  choice: den du in unseren Herzen wohnen ließest
  alternative: den du in unseren Herzen aufgeschlagen hast / der in unseren Herzen Wohnung nahm
  rationale: Die gewählte Form hält Gott als handelndes Subjekt fest und bewahrt die Aussage vom Einwohnen des Namens, ohne das ungewöhnliche Bild erklärend umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in gebetstypischen Sinnzeilen. Die Präteritalformen „ließest“ sind bewusst feierlich, aber noch verständlich; „Dir gehört die Herrlichkeit“ klingt natürlich und gibt die knappe griechische Doxologie wieder.
