id: DID.10.4
reference: Didache 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ πάντων εὐχαριστοῦμέν σοι ὅτι δυνατός εἶ· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/004.yaml
  text: Before all things we give thanks to you because you are mighty; to you be the glory forever.
translation:
  language: de
  text: Vor allem danken wir dir, weil du mächtig bist. Dir sei die Herrlichkeit in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: Vor allem
  rationale: Die Wendung bezeichnet hier am natürlichsten den Vorrang innerhalb des Dankgebets. „Vor allen Dingen“ wäre formnäher, wirkt im heutigen Deutsch jedoch schwerfälliger und kann unnötig zeitlich verstanden werden.
- source_word: εὐχαριστοῦμέν σοι
  choice: danken wir dir
  rationale: Gibt das griechische Verb mit seinem Dativ direkt und idiomatisch wieder.
- source_word: δυνατός
  choice: mächtig
  rationale: Bewahrt die Aussage über Gottes Macht, ohne sie enger als „allmächtig“ zu bestimmen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Eine geläufige, würdige Wiedergabe der doxologischen Zeitformel.
theological_decisions:
- issue: Reichweite von δυνατός
  choice: mächtig
  alternative: allmächtig
  rationale: Der griechische Text sagt „mächtig/fähig“, nicht ausdrücklich „allmächtig“; die Übersetzung vermeidet daher eine theologische Erweiterung.
- issue: Elliptische Doxologie σοὶ ἡ δόξα
  choice: Dir sei die Herrlichkeit
  alternative: Dir gehört die Herrlichkeit
  rationale: Der griechische Nominalsatz lässt die genaue verbale Ergänzung offen. Die traditionelle deutsche Wunsch- beziehungsweise Bekenntnisform wahrt diese doxologische Offenheit besser als eine stärker festlegende Aussage.
translation_notes:
  register: Modernes, klares und zugleich liturgisch würdiges Deutsch. Die Anrede bleibt entsprechend dem griechischen Singular beim vertraulichen „dir“.
