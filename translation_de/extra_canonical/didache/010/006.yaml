id: DID.10.6
reference: Didache 10:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλθέτω χάρις καὶ παρελθέτω ὁ κόσμος οὗτος. Ὡσαννὰ τῷ υἱῷ Δαβίδ. Εἴ τις ἅγιός ἐστιν, ἐρχέσθω· εἴ τις οὐκ ἔστι, μετανοείτω· μαρανᾰθά. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/006.yaml
  text: 'Let grace come,

    and let this world pass away.

    Hosanna to the son of David.

    If anyone is holy, let him come;

    if anyone is not, let him repent.

    Maranatha. Amen.'
translation:
  language: de
  text: 'Die Gnade komme,

    und diese Welt vergehe.

    Hosanna dem Sohn Davids!

    Wer heilig ist, komme;

    wer es nicht ist, kehre um.

    Maranatha.[a] Amen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aramäischer Gebetsruf; wahrscheinlich: „Unser Herr, komm!“ Möglich ist auch die Deutung: „Unser Herr ist gekommen.“'
    reason: Die unvokalisierte aramäische Wendung lässt unterschiedliche Segmentierungen und damit verschiedene Übersetzungen zu.
lexical_decisions:
- source_word: χάρις
  choice: die Gnade
  rationale: Die übliche und kontextuell offene Wiedergabe bewahrt sowohl den göttlichen Gnadenerweis als auch die mögliche endzeitliche Personifizierung.
- source_word: παρελθέτω
  choice: vergehe
  rationale: Der Jussiv gibt den Wunsch wieder, dass die gegenwärtige Welt vorübergeht; „vergehen“ ist würdig und natürlich.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: Der eingebürgerte liturgische Ruf wird als Lehnwort beibehalten.
- source_word: ἅγιος
  choice: heilig
  rationale: Die direkte Wiedergabe erhält die kultisch-ethische Bedeutung, ohne sie durch „würdig“ oder „rein“ einzuengen.
- source_word: μετανοείτω
  choice: kehre um
  rationale: „Umkehren“ gibt den Sinn von Sinnesänderung und Lebenswende in heutigem Deutsch verständlich wieder.
- source_word: μαρανᾰθά
  choice: Maranatha
  rationale: Der überlieferte aramäische Gebetsruf bleibt transliteriert, da seine Segmentierung und genaue Nuance nicht völlig eindeutig sind.
theological_decisions:
- issue: Bezug von „Gnade“
  choice: 'Die Formulierung bleibt unbestimmt: „Die Gnade komme“'
  alternative: „Der Herr komme“ oder eine ausdrückliche Gleichsetzung der Gnade mit Christus
  rationale: Der griechische Text nennt χάρις; eine christologische Identifizierung wäre möglich, ist aber nicht ausdrücklich formuliert.
- issue: Einladung an den Heiligen
  choice: „Wer heilig ist, komme“
  alternative: „Wer würdig/rein ist, trete herzu“
  rationale: Die knappe Aussage wird nicht ausdrücklich auf die Eucharistie oder eine bestimmte Form kultischer Zulassung festgelegt.
- issue: Deutung von Maranatha
  choice: Transliteration mit erläuternder Fußnote
  alternative: Festlegung auf „Unser Herr, komm!“ oder „Unser Herr ist gekommen“
  rationale: Die aramäische Form kann unterschiedlich segmentiert und gedeutet werden; der Haupttext bewahrt diese Spannung.
translation_notes:
  register: Kurze, rhythmische Gebetszeilen in modernem, würdigem Standarddeutsch. Die jussivischen Formen werden durch den deutschen Konjunktiv wiedergegeben; traditionelle liturgische Ausdrücke bleiben erhalten.
