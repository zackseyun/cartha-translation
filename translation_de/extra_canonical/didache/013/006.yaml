id: DID.13.6
reference: Didache 13:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὡσαύτως κεράμιον οἴνου ἢ ἐλαίου ἀνοίξας, τὴν ἀπαρχὴν λαβὼν δὸς τοῖς προφήταις·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/006.yaml
  text: Likewise, when you open a jar of wine or oil, take the firstfruits and give them to the prophets.
translation:
  language: de
  text: 'Ebenso: Wenn du einen Krug mit Wein oder Öl öffnest, nimm die Erstlingsgabe und gib sie den Propheten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: Ebenso
  rationale: Gibt die anknüpfende Entsprechung zum vorherigen Gebot knapp und natürlich wieder.
- source_word: κεράμιον
  choice: Krug
  rationale: Bezeichnet hier ein Gefäß für Wein oder Öl; „Krug“ ist im Deutschen konkret und allgemein verständlich.
- source_word: ἀπαρχή
  choice: Erstlingsgabe
  rationale: Bewahrt den kultisch geprägten Gedanken eines zuerst abgesonderten Anteils, ohne einen grammatischen Plural einzuführen, den der griechische Singular nicht verlangt.
- source_word: τοῖς προφήταις
  choice: den Propheten
  rationale: Entspricht dem bestimmten Plural und wahrt den im Kontext vorausgesetzten Empfängerkreis.
theological_decisions:
- issue: Charakter der ἀπαρχή
  choice: Erstlingsgabe
  alternative: erster Anteil / Erstlingsfrucht
  rationale: „Erstlingsgabe“ erhält den religiös-ethischen Opfer- und Abgabeklang des Begriffs, legt aber weder eine genaue Menge noch eine bestimmte zeremonielle Form fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Konstruktion mit Doppelpunkt bildet den knappen Weisungsstil des Griechischen natürlich ab; der Singular „sie“ bezieht sich auf „Erstlingsgabe“.
