  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶσαν οὖν ἀπαρχὴν γεννημάτων ληνοῦ καὶ ἅλωνος, βοῶν τε καὶ προβάτων λαβὼν δώσεις τοῖς προφήταις· αὐτοὶ γάρ εἰσιν οἱ ἀρχιερεῖς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/003.yaml
  text: Therefore, taking every firstfruit of the produce of the winepress and threshing floor, and of cattle and sheep, you shall give it to the prophets, for they are your high priests.
translation:
  language: de
  text: Nimm also jede Erstlingsgabe vom Ertrag der Kelter und der Tenne sowie von Rindern und Schafen und gib sie den Propheten; denn sie sind eure Hohen Priester.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴν
  choice: Erstlingen
  rationale: Der kultisch geprägte Ausdruck bezeichnet den ersten, als Gabe ausgesonderten Anteil; „Erstlinge“ bewahrt diesen biblisch-religiösen Sinn.
- source_word: γεννημάτων
  choice: Erzeugnisse
  rationale: Der Ausdruck umfasst das Hervorgebrachte beziehungsweise den Ertrag und verbindet sich hier mit Kelter und Tenne.
- source_word: ληνοῦ καὶ ἅλωνος
  choice: von Kelter und Tenne
  rationale: Die konkreten landwirtschaftlichen Orte stehen für deren Erträge; die knappe Form erhält das Bild des griechischen Textes.
- source_word: βοῶν τε καὶ προβάτων
  choice: sowie von Rindern und Schafen
  rationale: „Rinder“ gibt βοῦς als Tiergattung natürlich wieder; „Schafe“ entspricht προβάτων im Kontext von Erstlingsgaben.
- source_word: ἀρχιερεῖς
  choice: Hohen Priester
  rationale: Die wörtliche kultische Bezeichnung wird bewahrt, da die Gleichsetzung der Propheten mit Hohen Priestern eine theologisch markante Aussage des Textes ist.
theological_decisions:
- issue: Bezeichnung der Propheten als ἀρχιερεῖς
  choice: direkt als „eure Hohen Priester“ wiedergegeben
  alternative: funktional abschwächend, etwa „sie versehen für euch den Dienst der Hohen Priester“
  rationale: Das Griechische formuliert eine unmittelbare Identifikation. Eine funktionale Umschreibung würde die Aussage erklären und dabei ihre mögliche Spannung unnötig auflösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper parataktischer Struktur. Der Imperativ „Nimm … und gib“ bildet die griechischen Partizip-plus-Futur-Imperativ-Verhältnisse idiomatisch als direkte Anweisung ab. „Kelter“, „Tenne“ und „Erstlinge“ sind sachlich präzise, im biblischen Kontext verständliche Kulturbegriffe.
