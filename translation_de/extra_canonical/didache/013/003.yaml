  source_fidelity: 'Die Grundbedeutung ist getroffen: πᾶσαν ἀπαρχήν bezeichnet jede Erstlingsgabe; ληνός und ἅλων stehen metonymisch für Wein- bzw. Getreideertrag; βοῶν und προβάτων für Rinder und Schafe; und die direkte Identifikation der Propheten als ἀρχιερεῖς bleibt erhalten. Die Konstruktion „von allen Erstlingen der Erzeugnisse von Kelter und Tenne sowie von Rindern und Schafen“ verwischt jedoch die griechische Zuordnung, weil „Erzeugnisse“ syntaktisch auch auf die Tiere bezogen werden kann und „Erstlinge ... von Rindern“ im Deutschen wenig klar ist.'
