  terminology: „Erstlingsgabe“, „Kelter“, „Tenne“, „Rinder“, „Schafe“ und „Hohen Priester“ sind sachgerecht. „Hohe Priester“ wird als etablierte, theologisch markierte Bezeichnung beibehalten; eine funktionale Abschwächung ist nicht angezeigt.
