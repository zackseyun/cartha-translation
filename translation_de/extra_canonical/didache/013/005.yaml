source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν σιτιαυτοῖς, τὴν ἀπαρχὴν λαβὼν δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/005.yaml
  text: If you prepare food[a], take the firstfruits and give according to the commandment.
translation:
  language: de
  text: Wenn du Essen zubereitest[a], nimm die Erstlingsgabe und gib sie nach dem Gebot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn du Brot backst, nimm die Erstlingsgabe und gib sie nach dem Gebot.“'
    reason: Die seltene und textlich schwierige griechische Form σιτιαυτοῖς kann enger auf die Herstellung von Brot bezogen werden; diese mögliche Wiedergabe bleibt als vollständige Alternative sichtbar.
lexical_decisions:
- source_word: σιτιαυτοῖς
  choice: du Speise zubereitest
  rationale: Das seltene bzw. textlich schwierige Verb wird im Zusammenhang mit einer Erstlingsgabe allgemein auf die Zubereitung von Nahrung bezogen. Die Formulierung bleibt natürlich und legt sie nicht unnötig auf das Brotbacken fest.
- source_word: ἀπαρχήν
  choice: Erstlingsgabe
  rationale: Der Singular bezeichnet den ersten, als Gabe ausgesonderten Anteil. „Erstlingsgabe“ gibt den kultisch-praktischen Sinn im Deutschen genauer wieder als ein bloßes „Erstes“.
- source_word: κατὰ τὴν ἐντολήν
  choice: nach dem Gebot
  rationale: Die knappe Wendung entspricht dem griechischen Ausdruck und bewahrt den bestimmten Artikel, ohne das nicht näher bezeichnete Gebot zu identifizieren.
theological_decisions:
- issue: Identität des Gebots
  choice: das unbestimmt gelassene „Gebot“ beibehalten
  alternative: das Gebot ausdrücklich als mosaisches Gesetz oder als zuvor genannte Anweisung bestimmen
  rationale: Der griechische Text nennt die Bezugsgröße nicht näher; eine konfessionelle oder historische Festlegung wäre interpretierende Ergänzung.
- issue: Art der zubereiteten Nahrung
  choice: allgemein „Speise“ im Haupttext
  alternative: konkret „Brot“
  rationale: Die sprachliche Evidenz ist unsicher, und der Kontext erlaubt eine allgemeinere Deutung. Die traditionelle bzw. engere Wiedergabe wird deshalb in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die knappe Anweisungsform des griechischen Textes bleiben erhalten; „Speise“ wirkt leicht gehoben, ist hier aber verständlich und sachlich passend.
