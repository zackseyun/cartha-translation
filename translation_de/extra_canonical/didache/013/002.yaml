id: DID.13.2
reference: Didache 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὡσαύτως διδάσκαλος ἀληθινός ἐστιν ἄξιος καὶ αὐτός, ὥσπερ ὁ ἐργάτης, τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/002.yaml
  text: Likewise a true teacher is also himself worthy, like the worker, of his food.
translation:
  language: de
  text: Ebenso hat auch ein wahrer Lehrer, wie der Arbeiter, Anspruch auf seine Nahrung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διδάσκαλος ἀληθινός
  choice: ein wahrer Lehrer
  rationale: Gibt die griechische Wortgruppe direkt und in natürlichem modernem Deutsch wieder.
- source_word: ἄξιος ... τῆς τροφῆς αὐτοῦ
  choice: Anspruch auf seinen Lebensunterhalt
  rationale: ἄξιος mit Genitiv bezeichnet hier, dass jemand etwas verdient bzw. darauf Anspruch hat. τροφή meint Nahrung oder Unterhalt; im Kontext eines Lehrers ist „Lebensunterhalt“ idiomatisch, ohne den materiellen Sinn aufzugeben.
- source_word: ὥσπερ ὁ ἐργάτης
  choice: wie der Arbeiter
  rationale: Bewahrt den ausdrücklichen Vergleich und die schlichte Berufsbezeichnung des Ausgangstextes.
theological_decisions:
- issue: Art und Umfang der dem Lehrer zustehenden Versorgung
  choice: Anspruch auf seinen Lebensunterhalt
  alternative: seiner Nahrung würdig
  rationale: Die Übersetzung bringt den Anspruch auf materielle Versorgung zum Ausdruck, legt aber weder eine bestimmte Vergütungsform noch ein kirchliches Amtsverständnis fest.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Das doppelte Gewicht von καὶ αὐτός wird mit „auch“ aufgenommen; ein zusätzliches „selbst“ wäre im Deutschen schwerfällig und für den Sinn nicht erforderlich.
