  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης ἀληθινός, θέλων καθῆσαι πρὸς ὑμᾶς, ἄξιός ἐστι τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/001.yaml
  text: But every true prophet who wishes to settle among you is worthy of his food.
translation:
  language: de
  text: Jeder wahre Prophet aber, der sich bei euch niederlassen will, hat Anspruch auf seine Nahrung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς δὲ προφήτης ἀληθινός
  choice: Jeder echte Prophet aber
  rationale: „Jeder“ gibt πᾶς wieder; das nachgestellte δέ wird natürlich mit „aber“ ausgedrückt. „Echt“ bezeichnet einen tatsächlich wahren, nicht falschen Propheten und klingt im modernen Deutsch idiomatischer als „wahrhaftig“.
- source_word: θέλων καθῆσαι πρὸς ὑμᾶς
  choice: der sich bei euch niederlassen möchte
  rationale: καθῆσαι bedeutet hier im Zusammenhang des Aufenthalts eines Wanderpropheten nicht bloß „sitzen“, sondern dauerhaft bleiben bzw. sich niederlassen. θέλων wird mit „möchte“ natürlich und ohne Zwangskomponente wiedergegeben.
- source_word: ἄξιός ἐστι τῆς τροφῆς αὐτοῦ
  choice: hat Anspruch auf seinen Lebensunterhalt
  rationale: Wörtlich heißt die Wendung „ist seiner Nahrung würdig“. τροφή kann Nahrung oder Unterhalt bezeichnen; im Kontext einer Niederlassung ist „Lebensunterhalt“ sachgerecht. „Hat Anspruch auf“ vermittelt die idiomatische Berechtigungsaussage von ἄξιός ἐστι.
theological_decisions:
- issue: Umfang der dem Propheten geschuldeten Versorgung
  choice: Lebensunterhalt
  alternative: Nahrung
  rationale: Der Kontext einer dauerhaften Niederlassung spricht für fortlaufende Versorgung. Die Formulierung legt jedoch weder Umfang noch institutionelle Ausgestaltung dieses Anspruchs fest.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Satzstruktur des Griechischen bleibt erhalten; „Lebensunterhalt“ vermeidet die im Deutschen unnatürliche Formulierung „seiner Nahrung würdig“.
