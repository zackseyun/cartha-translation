id: DID.13.7
reference: Didache 13:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἀργυρίου δὲ καὶ ἱματισμοῦ καὶ παντὸς κτήματος λαβὼν τὴν ἀπαρχὴν ὡς ἂν σοὶ δοξῇ, δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/007.yaml
  text: And of money and clothing and every possession[a], having taken the firstfruit, as it seems good to you, give according to the commandment.
translation:
  language: de
  text: Von Geld[a], Kleidung und allem Besitz aber nimm die Erstlingsgabe, wie es dir gut erscheint, und gib sie gemäß dem Gebot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Silber.'
    reason: ἀργύριον bedeutet wörtlich „Silber“, bezeichnet hier jedoch wahrscheinlich Geld.
lexical_decisions:
- source_word: ἀργυρίου
  choice: Geld
  rationale: ἀργύριον bezeichnet wörtlich Silber, wird im Koine-Griechischen aber häufig metonymisch für Geld verwendet; im Zusammenhang mit Kleidung und sonstigem Besitz ist „Geld“ die natürliche Sachbedeutung.
- source_word: ἱματισμοῦ
  choice: Kleidung
  rationale: Der Sammelbegriff bezeichnet Kleidung beziehungsweise Kleidungsstücke; „Kleidung“ ist im Deutschen knapp und idiomatisch.
- source_word: παντὸς κτήματος
  choice: allem Besitz
  rationale: κτῆμα bezeichnet Eigentum oder Besitzgut. Der Singular „Besitz“ gibt den umfassenden Ausdruck natürlich wieder.
- source_word: ἀπαρχὴν
  choice: Erstlingsgabe
  rationale: ἀπαρχή ist die zuerst ausgesonderte Gabe aus einem Ertrag oder Besitz. „Erstlingsgabe“ bewahrt den kultisch-ethischen Begriff und passt hier auch zu nicht landwirtschaftlichen Gütern.
- source_word: ὡς ἂν σοὶ δοξῇ
  choice: wie es dir gut erscheint
  rationale: Die Formulierung lässt das konkrete Maß im Ermessen des Gebenden und wird bewusst nicht durch „angemessen“ oder eine feste Quote näher bestimmt.
- source_word: κατὰ τὴν ἐντολήν
  choice: gemäß dem Gebot
  rationale: Die bestimmte Formulierung verweist auf ein vorausgesetztes Gebot, ohne es im Vers näher zu identifizieren.
theological_decisions:
- issue: Verhältnis zwischen persönlichem Ermessen und bindendem Gebot
  choice: „wie es dir gut erscheint … gemäß dem Gebot“
  alternative: Die freie Bemessung durch eine erklärende Formulierung mit dem Gebot harmonisieren
  rationale: Der griechische Text stellt die Ermessensformel und den Gebotsbezug unmittelbar nebeneinander. Die Übersetzung erhält diese Spannung, ohne eine feste Höhe oder eine bestimmte Auslegung des Gebots einzutragen.
- issue: Charakter der ἀπαρχή bei Geld und Besitz
  choice: „Erstlingsgabe“
  alternative: „erster Anteil“ oder „Erstling“
  rationale: „Erstlingsgabe“ hält den traditions- und kultbezogenen Charakter des Ausdrucks fest, ohne die Gabe auf landwirtschaftliche Erzeugnisse zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Aufforderung „nimm … und gib“ gibt die Verbindung von Partizip und Imperativ natürlich wieder; das im Deutschen nötige Pronomen „sie“ bezieht sich auf die Erstlingsgabe.
