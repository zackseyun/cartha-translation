id: DID.14.2
reference: Didache 14:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ἔχων τὴν ἀμφιβολίαν μετὰ τοῦ ἑταίρου αὐτοῦ μὴ συνελθέτω ὑμῖν, ἕως οὗ διαλλαγῶσιν, ἵνα μὴ κοινωθῇ ἡ θυσία ὑμῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/002.yaml
  text: But let no one who has a dispute with his companion come together with you until they are reconciled, so that your sacrifice may not be defiled.
translation:
  language: de
  text: Wer aber einen Streit mit seinem Mitmenschen hat, soll nicht mit euch zusammenkommen, bis sie sich versöhnt haben, damit euer Opfer nicht entweiht wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφιβολίαν
  choice: Streit
  rationale: Das Wort bezeichnet hier im Zusammenhang mit der geforderten Versöhnung eine zwischenmenschliche Auseinandersetzung oder strittige Angelegenheit; „Streit“ ist im heutigen Deutsch klar und natürlich.
- source_word: ἑταίρου
  choice: Mitmenschen
  rationale: ἑταῖρος meint einen Gefährten, Genossen oder Mitmenschen. „Mitmensch“ wahrt die allgemeine Beziehungsaussage, ohne eine engere Freundschaft zu unterstellen.
- source_word: συνελθέτω ὑμῖν
  choice: soll nicht mit euch zusammenkommen
  rationale: Die Formulierung bildet das gemeinschaftliche Zusammenkommen ab und lässt dessen gottesdienstlichen Rahmen durch den Kontext erkennen, ohne ihn im Text ausdrücklich zu ergänzen.
- source_word: διαλλαγῶσιν
  choice: sie sich versöhnt haben
  rationale: Das Passiv bezeichnet die Wiederherstellung der gestörten Beziehung. Die deutsche reflexive Form gibt den gegenseitigen Charakter idiomatisch wieder.
- source_word: κοινωθῇ
  choice: entweiht wird
  rationale: κοινόω bedeutet hier, etwas kultisch unrein beziehungsweise profan zu machen. „Entweihen“ ist im Opferkontext verständlich und würdevoll.
- source_word: θυσία
  choice: Opfer
  rationale: Die direkte kultische Bedeutung wird beibehalten; eine nähere Bestimmung, etwa als Eucharistie, wird nicht in den Text eingetragen.
theological_decisions:
- issue: Art des Opfers
  choice: Das unbestimmte „euer Opfer“ bleibt erhalten.
  alternative: Das Opfer ausdrücklich als Eucharistie oder Abendmahl bestimmen.
  rationale: Der griechische Text verwendet lediglich θυσία. Der unmittelbare Zusammenhang ist gottesdienstlich, legt aber in diesem Vers keine weitergehende Benennung fest.
- issue: Teilnahme der zerstrittenen Person an der Versammlung
  choice: „nicht mit euch zusammenkommen“
  alternative: „nicht an eurem Gottesdienst teilnehmen“ oder „nicht mit euch das Mahl feiern“
  rationale: Die offenere Formulierung folgt συνελθέτω und vermeidet eine konfessionell oder liturgisch verengende Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die sachliche Strenge des Verbots und die kultische Sprache des Schlusssatzes bleiben erhalten.
