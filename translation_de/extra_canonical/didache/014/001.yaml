    issue: συναχθέντες wird als Imperativ wiedergegeben
    rationale: 'Das griechische Aoristpartizip ist zeitlich bzw. begleitend auf die folgenden Imperative bezogen: Die Adressaten sollen, nachdem bzw. wenn sie zusammengekommen sind, Brot brechen und Dank sagen. „Kommt zusammen“ macht daraus einen eigenständigen Befehl.'
  - severity: low
    issue: Die Zielbestimmung endet indikativisch
    rationale: ὅπως καθαρὰ ἡ θυσία ὑμῶν ᾖ drückt Zweck bzw. angestrebtes Ergebnis aus. „Damit euer Opfer rein sei“ gibt diese Nuance im Deutschen besser wieder.
  revised_text: Am Tag des Herrn aber, wenn ihr zusammengekommen seid, brecht Brot und sagt Dank, nachdem ihr zuvor eure Verfehlungen bekannt habt, damit euer Opfer rein sei.
