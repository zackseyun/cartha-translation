  to: Am Tag des Herrn aber, wenn ihr zusammengekommen seid, brecht Brot und sagt Dank, nachdem ihr zuvor eure Verfehlungen bekannt habt, damit euer Opfer rein sei.
  rationale: Die Revision stellt die partizipiale Zeitrelation von συναχθέντες wieder her, gibt die finale Verbform präziser wieder und verwendet für Κατὰ κυριακὴν ... Κυρίου die im Deutschen natürliche und theologisch nicht weiter festlegende Wendung „am Tag des Herrn“. Die zeitliche Priorität des Bekenntnisses durch προεξομολογησάμενοι bleibt ausdrücklich erhalten.
