id: DID.14.1
reference: Didache 14:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Κατὰ κυριακὴν δὲ Κυρίου συναχθέντες κλάσατε ἄρτον καὶ εὐχαριστήσατε προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν, ὅπως καθαρὰ ἡ θυσία ὑμῶν ᾖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/001.yaml
  text: But on the Lord’s own day, when you have gathered together, break bread and give thanks, having first confessed your transgressions, so that your sacrifice may be pure.
translation:
  language: de
  text: Am Tag des Herrn aber, wenn ihr zusammengekommen seid, brecht Brot und sagt Dank, nachdem ihr zuvor eure Verfehlungen bekannt habt, damit euer Opfer rein sei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ κυριακὴν δὲ Κυρίου
  choice: Am Herrentag aber
  rationale: Die substantivierte Wendung bezeichnet den dem Herrn zugehörigen Tag. „Herrentag“ ist knapp, würdig und lässt die auffällige griechische Bekräftigung durch Κυρίου anklingen, ohne sie im Deutschen schwerfällig zu verdoppeln.
- source_word: συναχθέντες
  choice: kommt zusammen
  rationale: Das Aoristpartizip beschreibt das Zusammenkommen der Gemeinschaft. Die koordinierte imperativische Wiedergabe ist im Deutschen natürlich und bewahrt den Handlungsablauf.
- source_word: κλάσατε ἄρτον
  choice: brecht das Brot
  rationale: Die feste Wendung wird nah am griechischen Wortlaut wiedergegeben und kann sowohl die konkrete Handlung als auch ihre gemeinschaftlich-kultische Bedeutung tragen.
- source_word: εὐχαριστήσατε
  choice: sagt Dank
  rationale: Das Verb bedeutet hier „Dank sagen/danksagen“. Die Wiedergabe vermeidet, den späteren technischen Begriff „Eucharistie feiern“ in den Text einzutragen.
- source_word: προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν
  choice: nachdem ihr zuvor eure Verfehlungen bekannt habt
  rationale: προ- markiert die zeitliche Priorität; ἐξομολογέομαι bezeichnet das Bekennen, und παραπτώματα sind Verfehlungen oder Übertretungen.
- source_word: θυσία
  choice: Opfer
  rationale: „Opfer“ ist die direkte und theologisch offene Entsprechung; der Text selbst bestimmt hier nicht abschließend, worauf der Ausdruck genau bezogen ist.
theological_decisions:
- issue: Bedeutung von θυσία im Zusammenhang mit Brotbrechen und Danksagung
  choice: „euer Opfer“ ohne nähere Bestimmung
  alternative: „eure Opfergabe“ oder eine ausdrückliche Gleichsetzung mit Eucharistie/Abendmahl
  rationale: Der griechische Text verwendet θυσία, lässt aber offen, ob damit die gesamte gottesdienstliche Handlung, Gebet und Danksagung oder eine konkrete Gabe bezeichnet wird. Diese Spannung wird nicht konfessionell aufgelöst.
- issue: κυριακὴν Κυρίου
  choice: „Herrentag“
  alternative: „Tag des Herrn“ oder „des Herrn eigener Tag“
  rationale: Die Formulierung bezeichnet wahrscheinlich den regelmäßigen christlichen Versammlungstag, doch die Übersetzung nennt weder ausdrücklich „Sonntag“ noch legt sie eine weitergehende eschatologische Bedeutung fest.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzfolge ist gegenüber einer streng partizipialen Nachbildung leicht geglättet, während die zeitliche Priorität des Sündenbekenntnisses ausdrücklich erhalten bleibt.
