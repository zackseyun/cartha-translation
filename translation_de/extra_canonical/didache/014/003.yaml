id: DID.14.3
reference: Didache 14:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὕτη γάρ ἐστιν ἡ ῥηθεῖσα ὑπὸ Κυρίου· Ἐν παντὶ τόπῳ καὶ χρόνῳ προσφέρειν μοι θυσίαν καθαράν· ὅτι βασιλεὺς μέγας εἰμί, λέγει Κύριος, καὶ τὸ ὄνομά μου θαυμαστὸν ἐν τοῖς ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/003.yaml
  text: 'For this is what was spoken by the Lord: “In every place and time offer me a pure sacrifice[a], because I am a great King,” says the Lord, “and my name is marvelous among the nations.”'
translation:
  language: de
  text: Denn dies ist [das Opfer], von dem der Herr gesprochen hat:[a] »Bringt mir an jedem Ort und zu jeder Zeit ein reines Opfer dar; denn ich bin ein großer König«, spricht der Herr, »und mein Name ist wunderbar unter den Völkern.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine feminine elliptische Wendung: „Denn diese ist die vom Herrn Gesagte“. Wahrscheinlich bezieht sie sich auf das zuvor genannte Opfer.'
    reason: Die Fußnote gibt die Bedeutung von ῥηθεῖσα korrekt als „gesagt“ wieder und macht sowohl die feminine Form als auch die kontextuelle Ergänzung von „Opfer“ transparent.
lexical_decisions:
- source_word: αὕτη … ἡ ῥηθεῖσα
  choice: dies ist das Opfer, von dem … gesprochen hat
  rationale: Die beiden femininen Formen greifen am wahrscheinlichsten das feminine θυσία („Opfer“) aus dem unmittelbaren Kontext auf. Die deutsche Fassung macht diesen grammatischen Rückbezug verständlich, ohne zu behaupten, θυσία stehe an dieser Stelle ausdrücklich noch einmal im Text.
- source_word: ἐν παντὶ τόπῳ καὶ χρόνῳ
  choice: an jedem Ort und zu jeder Zeit
  rationale: Gibt die umfassende Orts- und Zeitangabe idiomatisch und vollständig wieder.
- source_word: προσφέρειν μοι θυσίαν καθαράν
  choice: Bringt mir … ein reines Opfer dar
  rationale: Der zitierte Infinitiv wird im Deutschen als auffordernder Satz wiedergegeben; „darbringen“ entspricht dem kultischen Sinn von προσφέρειν.
- source_word: θαυμαστόν
  choice: wunderbar
  rationale: Bewahrt die Bedeutung von etwas Staunenswertem und Herrlichem, ohne sie auf bloße Bekanntheit abzuschwächen.
- source_word: ἐν τοῖς ἔθνεσι
  choice: unter den Völkern
  rationale: ἔθνη bezeichnet hier die nichtjüdischen Völker beziehungsweise die Nationen; „unter den Völkern“ ist natürlich und traditionsneutral.
theological_decisions:
- issue: Bezug von αὕτη ἡ ῥηθεῖσα
  choice: Rückbezug auf das zuvor genannte Opfer
  alternative: „Denn dies ist, was der Herr gesagt hat“
  rationale: Das feminine Geschlecht von αὕτη und ῥηθεῖσα spricht für einen Rückbezug auf das feminine θυσία im vorangehenden Zusammenhang. Die Alternative glättet die Konstruktion zu einem inhaltlich neutralen „das Gesagte“ und verdeckt diesen grammatischen Bezug.
- issue: Form des Schriftzitats
  choice: Als direkte göttliche Aufforderung wiedergegeben
  alternative: 'Infinitivisch: „… mir ein reines Opfer darzubringen“'
  rationale: Der griechische Infinitiv steht innerhalb der Zitatseinleitung und erfüllt auffordernde Funktion. Der Imperativ ist im modernen Deutschen klarer, ohne den theologischen Gehalt zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Redeformel „spricht der Herr“ und das kultische Verb „darbringen“ bewahren den schriftsprachlich-sakralen Charakter, während Satzbau und Wortfolge für heutige Leser klar bleiben.
