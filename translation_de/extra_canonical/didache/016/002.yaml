id: DID.16.2
reference: Didache 16:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πυκνῶς δὲ συναχθήσεσθε ζητοῦντες τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν· οὐ γὰρ ὠφελήσει ὑμᾶς ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν, ἐὰν μὴ ἐν τῷ ἐσχάτῳ καιρῷ τελειωθῆτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/002.yaml
  text: And gather together often, seeking the things that are fitting for your souls; for the whole time of your faith will not profit you unless you are perfected in the last time.
translation:
  language: de
  text: Kommt häufig zusammen und sucht nach dem, was euren Seelen angemessen ist; denn die ganze Zeit eures Glaubens wird euch nichts nützen, wenn ihr nicht in der letzten Zeit vollendet werdet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πυκνῶς
  choice: häufig
  rationale: Gibt das adverbiale „oft, häufig“ natürlich und präzise wieder.
- source_word: συναχθήσεσθε
  choice: Kommt zusammen
  rationale: Die formal futurische Form hat hier auffordernde Kraft; ein deutscher Imperativ entspricht dem Zusammenhang und dem anschließenden Partizip.
- source_word: ζητοῦντες
  choice: und sucht nach
  rationale: Gibt das begleitende Partizip als koordinierte Aufforderung idiomatisch wieder.
- source_word: τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν
  choice: was euren Seelen angemessen ist
  rationale: ἀνήκω bezeichnet das, was jemandem zukommt, sich gehört oder angemessen ist; die offene Formulierung des Griechischen bleibt erhalten.
- source_word: ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν
  choice: die ganze Zeit, in der ihr geglaubt habt
  rationale: Löst den griechischen Genitiv idiomatisch als Zeitraum ihres Glaubens aus, ohne einen abstrakten theologischen Fachausdruck einzuführen.
- source_word: ὠφελήσει
  choice: wird euch nichts nützen
  rationale: Entspricht dem verneinten Futur „wird euch nicht nützen“ in natürlichem Deutsch.
- source_word: τελειωθῆτε
  choice: vollendet werdet
  rationale: Bewahrt den passiven Charakter und das Bedeutungsspektrum von „zur Vollendung gebracht werden“, ohne die Ursache ausdrücklich festzulegen.
- source_word: ἐν τῷ ἐσχάτῳ καιρῷ
  choice: in der letzten Zeit
  rationale: Nahe Wiedergabe der eschatologisch gefärbten, aber nicht weiter bestimmten Zeitangabe.
theological_decisions:
- issue: Bedeutung und Urheber der Vollendung
  choice: „vollendet werdet“ im Passiv
  alternative: „euch bewährt“ oder „vollkommen seid“
  rationale: Das griechische Passiv nennt den Handelnden nicht und kann Abschluss, Reife oder Bewährung umfassen. Die Übersetzung bewahrt diese Spannung, statt göttliches oder menschliches Handeln ausdrücklich festzulegen.
- issue: Nutzen der bisherigen Glaubenszeit
  choice: „wird euch nichts nützen, wenn …“
  alternative: eine abgeschwächte Formulierung wie „wird euch wenig nützen“
  rationale: Die strenge Bedingung des griechischen οὐ … ἐὰν μή bleibt unverändert erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter gemeinschaftlicher Aufforderung. Der Satzbau bleibt eng am griechischen Gedankengang, wird aber durch die temporale Auflösung des Genitivs idiomatisch gestaltet.
