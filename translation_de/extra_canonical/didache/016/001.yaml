  terminology: „Unser Herr“ entspricht ὁ Κύριος ἡμῶν; „kommt“ bewahrt bewusst das griechische Präsens. Die Übersetzung vermeidet die nicht ausdrücklich im Text enthaltene Ergänzung „wieder“.
