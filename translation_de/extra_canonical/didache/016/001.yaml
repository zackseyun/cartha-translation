revisions:
- from: Wacht über euer Leben![a] Eure Lampen sollen nicht erlöschen, und eure Hüften sollen nicht ungegürtet sein;[b] vielmehr seid bereit, denn ihr wisst nicht, zu welcher Stunde unser Herr kommt.
  to: Wacht über euer Leben![a] Eure Lampen sollen nicht erlöschen, und eure Hüften sollen nicht erschlaffen;[b] vielmehr seid bereit, denn ihr wisst nicht, zu welcher Stunde unser Herr kommt.
  rationale: Eine begrenzte Korrektur bei αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν ist erforderlich. „Erschlaffen“ entspricht dem semantischen Bereich von ἐκλύω besser als „ungegürtet“, erhält das körperliche Bild und lässt dessen Verbindung mit Wachsamkeit und Bereitschaft erkennbar. Die übrige Formulierung kann unverändert bleiben.
