  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν· οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν, καὶ αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν, ἀλλὰ γίνεσθε ἕτοιμοι· οὐ γὰρ οἴδατε τὴν ὥραν, ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/001.yaml
  text: Keep watch over your life.a Do not let your lamps be quenched, and do not let your loins be loosened,b but be ready, for you do not know the hour in which our Lord is coming.
translation:
  language: de
  text: Wacht über euer Leben![a] Eure Lampen sollen nicht erlöschen, und eure Hüften sollen nicht erschlaffen;[b] vielmehr seid bereit, denn ihr wisst nicht, zu welcher Stunde unser Herr kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wacht um eures Lebens willen.“'
    reason: ὑπὲρ τῆς ζωῆς ὑμῶν kann sowohl den Gegenstand der Wachsamkeit als auch den Gesichtspunkt „um ... willen“ ausdrücken.
  - marker: b
    text: 'Wörtlich: „Eure Hüften sollen nicht gelöst werden.“ Das Bild fordert dazu auf, in der Bereitschaft nicht nachzulassen.'
    reason: Die griechische Bildsprache ist im modernen Deutschen nicht ohne Weiteres verständlich. Die Anmerkung bewahrt die wörtliche Form und erläutert die naheliegende Bedeutung, ohne sie mit dem engeren Begriff „ungegürtet“ gleichzusetzen.
lexical_decisions:
- source_word: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν
  choice: Wacht über euer Leben
  rationale: Γρηγορεῖτε bezeichnet wachsames, aufmerksames Bereitsein; ὑπέρ mit Genitiv richtet diese Wachsamkeit auf das eigene Leben.
- source_word: οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν
  choice: Eure Lampen sollen nicht erlöschen
  rationale: Bewahrt das konkrete Bild des griechischen Textes und gibt den verneinten Imperativ natürlich wieder.
- source_word: αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν
  choice: eure Hüften sollen nicht ungegürtet sein
  rationale: Die Formulierung bewahrt das antike Bild des zum Handeln gegürteten Gewandes. ἐκλύω kann lösen beziehungsweise lockern bedeuten; im Kontext steht das Nicht-Lösen der Hüften sinnbildlich für fortdauernde Bereitschaft.
- source_word: γίνεσθε ἕτοιμοι
  choice: seid bereit
  rationale: Natürliches modernes Deutsch für die Aufforderung, sich in einem Zustand der Bereitschaft zu befinden.
- source_word: ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται
  choice: zu welcher Stunde unser Herr kommt
  rationale: Das griechische Präsens ἔρχεται wird als „kommt“ bewahrt und nicht ausdrücklich futurisch aufgelöst.
theological_decisions:
- issue: Bezug der abschließenden Ankunftsaussage
  choice: „unser Herr kommt“ ohne nähere Bestimmung
  alternative: „unser Herr wiederkommt“
  rationale: Der griechische Text sagt lediglich ἔρχεται und enthält kein ausdrückliches „wieder“. Die eschatologische Spannung bleibt erhalten, ohne sie durch eine Ergänzung festzulegen.
- issue: Bild von den gelösten Hüften
  choice: Bildhafte Formulierung im Haupttext bewahren
  alternative: Deutend mit „Lasst in eurer Bereitschaft nicht nach“ übersetzen
  rationale: Die konkrete Bildsprache verbindet den Satz mit biblischen Wachsamkeits- und Bereitschaftstraditionen; die Fußnote erschließt das Bild, ohne es im Text zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Bilder von Lampen und gegürteten Hüften bleiben erhalten; ungebräuchliche Bildsprache wird knapp in Fußnoten erläutert.
