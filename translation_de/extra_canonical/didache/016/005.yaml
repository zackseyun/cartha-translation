  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τότε ἥξει ἡ κτίσις τῶν ἀνθρώπων εἰς τὴν πύρωσιν τῆς δοκιμασίας καὶ σκανδαλισθήσονται πολλοὶ καὶ ἀπολοῦνται, οἱ δὲ ὑπομείναντες ἐν τῇ πίστει αὐτῶν σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/005.yaml
  text: Then the human creation will come into the fire of testing[a], and many will be caused to stumble and will perish, but those who endure in their faith will be saved by the curse itself.
translation:
  language: de
  text: Dann wird die Menschheit in das Feuer der Prüfung kommen. Viele werden zu Fall kommen und zugrunde gehen; doch diejenigen, die in ihrem Glauben standhalten, werden durch den Fluch selbst gerettet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ist die griechische Wendung ungewöhnlich. Das Neutrum κατάθεμα kann „Fluch“ oder „das Verfluchte“ bedeuten; die genaue Beziehung von „durch“ ist umstritten.
    reason: Bewahrt die lexikalische und syntaktische Schwierigkeit von ὑπ᾽ αὐτοῦ τοῦ καταθέματος, ohne eine maskuline personale Deutung als Lesart des Haupttexts festzulegen.
lexical_decisions:
- source_word: ἡ κτίσις τῶν ἀνθρώπων
  choice: die Schöpfung der Menschen
  rationale: Bewahrt die ungewöhnliche griechische Genitivverbindung und vermeidet die interpretierende Verengung auf bloß „die Menschheit“.
- source_word: τὴν πύρωσιν τῆς δοκιμασίας
  choice: das Feuer der Prüfung
  rationale: Gibt sowohl die Feuersemantik von πύρωσις als auch den Erprobungscharakter von δοκιμασία klar und natürlich wieder.
- source_word: σκανδαλισθήσονται
  choice: werden zu Fall kommen
  rationale: Erfasst das passive Anstoßnehmen beziehungsweise Straucheln, ohne vorschnell eine konkrete handelnde Ursache einzutragen.
- source_word: οἱ ... ὑπομείναντες ἐν τῇ πίστει αὐτῶν
  choice: die, die in ihrem Glauben standhalten
  rationale: Verbindet das beharrliche Ausharren von ὑπομένω mit der ausdrücklich genannten Sphäre ihres Glaubens.
- source_word: ὑπ᾽ αὐτοῦ τοῦ καταθέματος
  choice: durch den Fluch selbst
  rationale: Gibt κατάθεμα als neutrales Substantiv „Fluch“ und ὑπό mit Genitiv zunächst instrumental wieder; die auffällige und theologisch spannungsreiche Aussage wird nicht geglättet.
theological_decisions:
- issue: Wodurch beziehungsweise woraus die Standhaften gerettet werden
  choice: durch den Fluch selbst
  alternative: unter dem Fluch selbst hervor / von dem Fluch selbst
  rationale: Die nächstliegende Konstruktion von ὑπό mit Genitiv bezeichnet ein Mittel oder einen Urheber, doch in diesem ungewöhnlichen Satz wird auch eine separative Deutung vertreten. Der Haupttext bewahrt die formale Spannung; die Fußnote nennt die Alternative.
- issue: Ob κατάθεμα eine Person bezeichnet
  choice: Fluch
  alternative: der Verfluchte selbst
  rationale: κατάθεμα ist hier grammatisch Neutrum und bedeutet „Fluch“ beziehungsweise „Verfluchtes“. Eine personale Wiedergabe als „der Verfluchte“ wäre morphologisch und lexikalisch weniger wahrscheinlich und würde zudem einen bestimmten endzeitlichen Akteur in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, wird aber durch Punkt und Semikolon lesefreundlich gegliedert. Die ungewöhnliche Formulierung „Schöpfung der Menschen“ und die Spannung von „durch den Fluch selbst“ bleiben bewusst erhalten.
