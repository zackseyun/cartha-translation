revisions:
- from: Denn wenn die Gesetzlosigkeit zunimmt, werden sie einander hassen, verfolgen und ausliefern. Dann wird der Weltverführer wie ein Sohn Gottes erscheinen und Zeichen und Wunder tun. Die Erde wird in seine Hände ausgeliefert werden, und er wird Frevelhaftes tun, wie es seit Urzeiten noch nie geschehen ist.
  to: Denn wenn die Gesetzlosigkeit zunimmt, werden sie einander hassen, verfolgen und ausliefern. Dann wird der Weltverführer als ein Sohn Gottes erscheinen und Zeichen und Wunder tun. Die Erde wird in seine Hände gegeben werden, und er wird Freveltaten tun, wie sie seit Urzeiten nie geschehen sind.
  rationale: Die Revision ist auf stilistisch und grammatisch sichere Präzisierungen beschränkt. „Als ein Sohn Gottes“ gibt ὡς υἱὸς Θεοῦ als Auftreten in dieser Rolle wieder, ohne die Gestalt mit dem Sohn Gottes zu identifizieren; die Artikellosigkeit des Griechischen wird nicht zu einem bestimmten Titel umgedeutet. „Seit Urzeiten“ bleibt als offene, idiomatische Wiedergabe von ἐξ αἰῶνος bestehen.
