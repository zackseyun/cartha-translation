id: DID.16.4
reference: Didache 16:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὐξανούσης γὰρ τῆς ἀνομίας, μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι, καὶ τότε φανήσεται ὁ κοσμοπλάνος ὡς υἱὸς Θεοῦ καὶ ποιήσει σημεῖα καὶ τέρατα, καὶ ἡ γῆ παραδοθήσεται εἰς χεῖρας αὐτοῦ, καὶ ποιήσει ἀθέμιτα, ἃ οὐδέποτε γέγονεν ἐξ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/004.yaml
  text: For as lawlessness increases, they will hate one another and persecute and betray one another, and then the world-deceiver will appear as a son of God and will do signs and wonders, and the earth will be delivered into his hands, and he will do unlawful things such as have never happened from the beginning of the age.
translation:
  language: de
  text: Denn wenn die Gesetzlosigkeit zunimmt, werden sie einander hassen, verfolgen und ausliefern. Dann wird der Weltverführer als ein Sohn Gottes erscheinen und Zeichen und Wunder tun. Die Erde wird in seine Hände gegeben werden, und er wird Freveltaten tun, wie sie seit Urzeiten nie geschehen sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομίας
  choice: Gesetzlosigkeit
  rationale: Gibt den ethisch-religiösen Sinn von ἀνομία präzise und in der eschatologischen Sprache verständlich wieder.
- source_word: παραδώσουσι
  choice: ausliefern
  rationale: Bewahrt die Bedeutung von παράδοσις als Überantwortung an feindliche Gewalt; das wechselseitige Objekt ergibt sich aus ἀλλήλους und der parallelen Verbfolge.
- source_word: κοσμοπλάνος
  choice: Weltverführer
  rationale: Gibt das Kompositum aus κόσμος und πλάνος knapp und verständlich wieder, ohne die Gestalt durch einen späteren theologischen Titel zu identifizieren.
- source_word: ὡς υἱὸς Θεοῦ
  choice: wie ein Sohn Gottes
  rationale: Bewahrt sowohl den Vergleich ὡς als auch die artikellose Form υἱὸς Θεοῦ, ohne sie zu „der Sohn Gottes“ zu vereindeutigen.
- source_word: σημεῖα καὶ τέρατα
  choice: Zeichen und Wunder
  rationale: Entspricht der etablierten und zugleich natürlichen Wiedergabe der festen griechischen Wortverbindung.
- source_word: ἀθέμιτα
  choice: Frevelhaftes
  rationale: Bezeichnet Handlungen, die göttlicher und sittlicher Ordnung widersprechen, kräftiger und idiomatischer als das missverständliche „Ungesetzliches“.
- source_word: ἐξ αἰῶνος
  choice: seit Urzeiten
  rationale: Gibt die zeitliche Bedeutung idiomatisch wieder und wahrt die mögliche Weite der Wendung, ohne künstlich „seit Beginn des Zeitalters“ zu formulieren.
theological_decisions:
- issue: Identität des κοσμοπλάνος
  choice: Weltverführer
  alternative: Antichrist
  rationale: Der Text verwendet keinen ausdrücklichen Antichrist-Titel; die Übersetzung lässt die literarische Bezeichnung stehen und vermeidet eine importierte Identifizierung.
- issue: Status der auftretenden Gestalt
  choice: wie ein Sohn Gottes
  alternative: als der Sohn Gottes
  rationale: Der Vergleich und die artikellose griechische Form werden beibehalten; so bleibt offen, ob eine vorgetäuschte Identität oder ein Auftreten in entsprechender Rolle gemeint ist.
- issue: Zeitlicher Umfang von ἐξ αἰῶνος
  choice: seit Urzeiten
  alternative: seit Beginn des Zeitalters
  rationale: Die griechische Wendung kann allgemein „von alters her/seit jeher“ bedeuten. Die gewählte Form vermeidet eine unnötige Festlegung auf ein bestimmtes kosmologisches Zeitalter.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer eschatologischer Prägung. Die lange griechische Satzkette wurde zur besseren deutschen Lesbarkeit in drei Sätze gegliedert, ohne die Abfolge der Aussagen zu verändern. Keine Fußnoten erforderlich.
