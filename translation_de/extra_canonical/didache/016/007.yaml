  source_fidelity: Der Entwurf gibt den elliptischen, auf den vorausgehenden Kontext rückverweisenden Ausdruck οὐ πάντων δέ angemessen als „Doch nicht von allen“ wieder und lässt den Bezug offen. „Der Herr wird kommen und alle Heiligen mit ihm“ entspricht Ἥξει ὁ Κύριος καὶ πάντες οἱ ἅγιοι μετ᾽ αὐτοῦ; insbesondere wird die nicht näher bestimmte Identität von οἱ ἅγιοι nicht eingeengt.
  naturalness: „sondern so, wie gesagt worden ist“ ist verständlich, wirkt im Deutschen jedoch unnötig schwerfällig und kann „so, wie“ modal auffassen. „sondern wie gesagt wurde“ ist idiomatischer und gibt ἀλλ᾽ ὡς ἐρρέθη als formelhafte Zitatüberleitung präzise wieder.
  terminology: „Herr“ und „Heilige“ sind etablierte, registergerechte Wiedergaben. „Heilige“ bewahrt die im griechischen Wortlaut bestehende Offenheit gegenüber einer näheren Identifizierung als Engel oder Menschen. Der englische Audit-Trail bietet keinen abweichenden Sachbefund.
