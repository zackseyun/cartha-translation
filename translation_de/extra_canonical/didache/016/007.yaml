source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: οὐ πάντων δέ, ἀλλ᾽ ὡς ἐρρέθη· Ἥξει ὁ Κύριος καὶ πάντες οἱ ἅγιοι μετ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/007.yaml
  text: 'but not of all, but as it was said: The Lord will come, and all the holy ones with him.'
translation:
  language: de
  text: 'Doch nicht von allen, sondern wie gesagt wurde: »Der Herr wird kommen und alle Heiligen mit ihm.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ πάντων δέ
  choice: Doch nicht von allen
  rationale: Gibt den rückbezüglichen Kontrast knapp wieder; der Bezug von »allen« bleibt wie im griechischen Text dem vorausgehenden Zusammenhang überlassen.
- source_word: ἀλλ᾽ ὡς ἐρρέθη
  choice: sondern so, wie gesagt worden ist
  rationale: Bewahrt die unpersönliche Passivform und leitet das folgende Schriftzitat natürlich ein.
- source_word: οἱ ἅγιοι
  choice: die Heiligen
  rationale: Die substantivierte Pluralform bezeichnet »die Heiligen« beziehungsweise »die heiligen Wesen«; die übliche deutsche Wiedergabe wahrt die mögliche Mehrdeutigkeit hinsichtlich ihrer Identität.
- source_word: μετ᾽ αὐτοῦ
  choice: mit ihm
  rationale: Entspricht unmittelbar dem griechischen Ausdruck und bezieht sich auf den Herrn.
theological_decisions:
- issue: Identität der οἱ ἅγιοι
  choice: alle Heiligen
  alternative: alle heiligen Engel / alle heiligen Menschen
  rationale: Der griechische Text legt nicht ausdrücklich fest, ob Engel, geheiligte Menschen oder beide Gruppen gemeint sind. Die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zitathafte Schlussaussage wird durch deutsche Anführungszeichen kenntlich gemacht; es sind keine Fußnoten erforderlich.
