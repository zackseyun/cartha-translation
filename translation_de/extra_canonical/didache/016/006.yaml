id: DID.16.6
reference: Didache 16:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ τότε φανήσεται τὰ σημεῖα τῆς ἀληθείας· πρῶτον, σημεῖον ἐκπετάσεως ἐν οὐρανῷ, εἶτα σημεῖον φωνῆς σάλπιγγος καὶ τὸ τρίτον ἀνάστασις νεκρῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/006.yaml
  text: 'And then the signs of the truth will appear: first[a], a sign of an opening in heaven; then a sign of the sound of a trumpet; and the third[b], the resurrection of the dead—'
translation:
  language: de
  text: 'Und dann werden die Zeichen der Wahrheit erscheinen: Zuerst: ein Zeichen einer Ausbreitung am Himmel[a]; dann ein Zeichen eines Trompetenschalls; und als Drittes die Auferstehung der Toten –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Ausspannens“ oder „eines Ausstreckens“. Das seltene griechische Wort ἐκπέτασις kann ein Ausspannen, Ausstrecken oder Ausbreiten bezeichnen; worauf das Zeichen genau verweist, bleibt offen.'
    reason: Die Fußnote dokumentiert die möglichen Bedeutungsnuancen von ἐκπέτασις, ohne eine Deutung als Himmelsöffnung oder Kreuzeszeichen vorzuziehen.
lexical_decisions:
- source_word: ἐκπετάσεως
  choice: eines Ausspannens
  rationale: Das Substantiv bezeichnet ein Ausspannen, Ausstrecken oder Ausbreiten, nicht eindeutig eine Öffnung. „Ausspannen“ wahrt die ungewöhnliche Bildsprache und lässt den möglichen Bezug auf ein ausgebreitetes Zeichen offen.
- source_word: φωνῆς σάλπιγγος
  choice: eines Trompetenschalls
  rationale: φωνή bezeichnet bei einem Instrument dessen Klang oder Schall. „Trompetenschall“ ist im Deutschen natürlich und gibt die Genitivverbindung knapp wieder.
- source_word: ἐν οὐρανῷ
  choice: am Himmel
  rationale: Im Zusammenhang mit einem sichtbaren Zeichen ist „am Himmel“ idiomatischer als „im Himmel“, ohne die räumliche Aussage unnötig festzulegen.
- source_word: ἀνάστασις νεκρῶν
  choice: die Auferstehung der Toten
  rationale: Dies ist die etablierte, genaue Wiedergabe der eschatologischen Wendung.
theological_decisions:
- issue: Deutung des „Ausspannens“ als Kreuzeszeichen oder Himmelsöffnung
  choice: Die rätselhafte Bezeichnung bleibt ungedeutet.
  alternative: „eine Öffnung am Himmel“ oder ausdrücklich „das ausgebreitete Zeichen des Kreuzes“
  rationale: ἐκπέτασις bezeichnet lexikalisch ein Ausspannen beziehungsweise Ausbreiten. Der Text nennt jedoch nicht ausdrücklich eine Öffnung oder das Kreuz; eine solche Festlegung würde die genuine Mehrdeutigkeit auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dreigliedrige Aufzählung und der offene Gedankenstrich am Versende bleiben erhalten; „Ausspannen“ ist bewusst ungewöhnlich, weil auch der griechische Ausdruck selten und deutungsoffen ist.
