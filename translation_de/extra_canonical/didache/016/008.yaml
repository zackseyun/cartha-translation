source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τότε ὄψεται ὁ κόσμος τὸν Κύριον ἐρχόμενον ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/008.yaml
  text: Then the world will see the Lord coming upon the clouds of heaven.j
translation:
  language: de
  text: Dann wird die Welt den Herrn sehen, wie er auf den Wolken des Himmels kommt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Gibt die zeitliche Folge knapp und natürlich wieder.
- source_word: ὄψεται ὁ κόσμος
  choice: wird die Welt … sehen
  rationale: Bewahrt das Futur und das kollektive Subjekt κόσμος ohne interpretierende Eingrenzung.
- source_word: τὸν Κύριον
  choice: den Herrn
  rationale: Die übliche und kontextgerechte Wiedergabe von κύριος mit bestimmtem Artikel.
- source_word: ἐρχόμενον
  choice: wie er … kommt
  rationale: Gibt das auf den Herrn bezogene Partizip in natürlichem modernem Deutsch wieder.
- source_word: ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: auf den Wolken des Himmels
  rationale: Bewahrt das apokalyptische Bild und folgt der räumlichen Grundbedeutung von ἐπάνω mit Genitiv.
theological_decisions:
- issue: Identität des Herrn
  choice: Herrn
  alternative: Jesus / Menschensohn
  rationale: Der griechische Text nennt nur τὸν Κύριον; eine ausdrücklichere Identifizierung würde über den Wortlaut hinausgehen.
- issue: Verhältnis zu neutestamentlichen Anspielungen
  choice: Wolken des Himmels
  alternative: Himmelswolken
  rationale: Die formnahe Wendung erhält den erkennbaren biblisch-apokalyptischen Sprachklang, ohne die Anspielung auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; bewusst knapp und bildhaft. Keine Fußnote erforderlich.
