  source_fidelity: 'Die Übersetzung gibt die Satzfolge und die zentralen Elemente des griechischen Textes treffend wieder: Τότε als „Dann“, das Futur von ὄψεται als „wird ... sehen“, ὁ κόσμος als „die Welt“, τὸν Κύριον als „den Herrn“ sowie das auf den Herrn bezogene Partizip ἐρχόμενον. „auf den Wolken des Himmels“ bewahrt das Bild von ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ ohne unnötige Ausdeutung.'
