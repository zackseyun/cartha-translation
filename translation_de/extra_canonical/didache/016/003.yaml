id: DID.16.3
reference: Didache 16:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν γὰρ ταῖς ἐσχάταις ἡμέραις πληθυνθήσονται οἱ ψευδοπροφῆται καὶ οἱ φθορεῖς καὶ στραφήσονται τὰ πρόβατα εἰς λύκους καὶ ἡ ἀγάπη στραφήσεται εἰς μῖσος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/003.yaml
  text: For in the last days false prophets and corrupters will be multiplied, and the sheep will be turned into wolves, and love will be turned into hatred.
translation:
  language: de
  text: Denn in den letzten Tagen werden die falschen Propheten und die Verderber zahlreicher werden; die Schafe werden zu Wölfen werden, und die Liebe wird zu Hass werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληθυνθήσονται
  choice: werden … immer zahlreicher werden
  rationale: Gibt das futurische Passiv idiomatisch wieder, ohne im Deutschen das unnatürliche »werden vermehrt werden« zu verwenden.
- source_word: οἱ φθορεῖς
  choice: die Verderber
  rationale: Bewahrt die aktive Personenbezeichnung für Menschen, die andere verderben oder zugrunde richten; »Verführer« wäre enger als der griechische Ausdruck.
- source_word: στραφήσονται … εἰς
  choice: werden sich in … verwandeln
  rationale: Gibt beim Bild von Schafen und Wölfen den Übergang in einen gegensätzlichen Zustand natürlich wieder.
- source_word: ἡ ἀγάπη στραφήσεται εἰς μῖσος
  choice: die Liebe wird sich in Hass verkehren
  rationale: Die gehobene, aber verständliche Wendung wahrt die scharfe Umkehrung von Liebe zu Hass.
theological_decisions:
- issue: Bedeutung der Verwandlung der Schafe in Wölfe
  choice: Bildsprache unverändert stehen lassen
  alternative: Ausdeutend formulieren, dass Gläubige oder Gemeindeglieder zu Verfolgern werden
  rationale: Der griechische Text identifiziert die »Schafe« nicht ausdrücklich und lässt Reichweite und genaue Referenz des Bildes offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Steigerung und die beiden drastischen Umkehrungsbilder des griechischen Satzes bleiben erhalten.
