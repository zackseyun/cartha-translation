id: DID.3.4
reference: Didache 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου οἰωνοσκόπος· ἐπειδὴ ὁδηγεῖ εἰς τὴν εἰδωλολατρείαν· μηδὲ ἐπαοιδὸς μηδὲ μαθηματικὸς μηδὲ περικαθαίρων, μηδὲ θέλε αὐτὰ βλέπειν· ἐκ γὰρ τούτων ἁπάντων εἰδωλολατρεία γεννᾶται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/004.yaml
  text: My child[a], do not become an observer of omens, because it leads to idolatry; nor an enchanter, nor an astrologer, nor one who performs purifications, nor even be willing to look at these things; for from all these idolatry is born.
translation:
  language: de
  text: Mein Kind, werde nicht zum Zeichendeuter; denn das führt zum Götzendienst. Sei auch kein Beschwörer, kein Astrologe und keiner, der Reinigungsrituale vollzieht. Du sollst nicht einmal den Wunsch haben, dir solche Dinge anzusehen; denn aus all dem entsteht Götzendienst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰωνοσκόπος
  choice: Zeichendeuter
  rationale: Bezeichnet jemanden, der Vorzeichen beobachtet und deutet; „Zeichendeuter“ gibt die mantische Tätigkeit knapp und verständlich wieder.
- source_word: ἐπαοιδός
  choice: Beschwörer
  rationale: Das Wort bezeichnet jemanden, der durch gesprochene oder gesungene Zauberformeln wirkt; „Beschwörer“ ist im heutigen Deutsch natürlich und sachlich passend.
- source_word: μαθηματικός
  choice: Astrologe
  rationale: Im spätantiken Kontext bezeichnet μαθηματικός häufig einen Astrologen, nicht einen Mathematiker im heutigen Sinn.
- source_word: περικαθαίρων
  choice: einer, der Reinigungsrituale vollzieht
  rationale: Das Partizip verweist auf kultisch-magische Reinigungen; die Umschreibung vermeidet die irreführende allgemeine Bedeutung bloßen Säuberns.
- source_word: βλέπειν
  choice: ansehen
  rationale: Bewahrt die konkrete Bedeutung des Sehens, ohne die Aussage als bloßes geistiges Beachten oder Ausüben umzudeuten.
- source_word: εἰδωλολατρεία
  choice: Götzendienst
  rationale: Die etablierte und allgemein verständliche deutsche Wiedergabe für die Verehrung von Götzen.
theological_decisions:
- issue: Reichweite von αὐτά in μηδὲ θέλε αὐτὰ βλέπειν
  choice: „solche Dinge“ als Rückverweis auf die genannten okkult-mantischen Praktiken
  alternative: Rückverweis auf die zuvor genannten Personen
  rationale: Das Pronomen αὐτά ist Neutrum Plural und verweist daher sachlich auf Praktiken, Erscheinungen oder zugehörige Gegenstände, nicht auf die maskulinen Personenbezeichnungen.
- issue: Kausale Aussage ὁδηγεῖ εἰς τὴν εἰδωλολατρείαν
  choice: „das führt zum Götzendienst“
  alternative: „er führt zum Götzendienst“ mit Bezug auf den Zeichendeuter
  rationale: Das unausgesprochene Subjekt lässt sich am natürlichsten als die Tätigkeit des Zeichendeutens verstehen; die neutrale Formulierung wahrt diesen Sinn ohne unnötige Personifizierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die Folge griechischer Verbote wurde für natürliche deutsche Syntax in mehrere Sätze gegliedert; die eindringliche Wiederholung von „Götzendienst“ bleibt erhalten.
