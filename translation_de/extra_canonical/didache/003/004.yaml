  naturalness: „Du sollst dir solche Dinge nicht einmal ansehen wollen“ ist im heutigen Standarddeutsch unnötig sperrig und wirkt wie eine syntaktische Nachbildung des Griechischen. „Du sollst nicht einmal den Wunsch haben, dir solche Dinge anzusehen“ ist natürlich und behält die absichtliche Zuspitzung auf das Wollen bei.
