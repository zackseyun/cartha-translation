  source_fidelity: 'Die Grundbedeutung ist getroffen: γόγγυσος bezeichnet einen Murrenden/Nörgler; βλασφημία bleibt zu Recht ohne ausdrücklich ergänztes Objekt als „Lästerung“ wiedergegeben. Der Singular-Plural-Wechsel („Lästerung“ / „Lästerungen“) folgt dem Griechischen. Allerdings gibt „hege keine bösen Gedanken“ πονηρόφρων zu eng als einzelne Gedanken statt als böse bzw. böswillige Gesinnung wieder. „Selbstherrlich“ kann zudem stärker eine herrische Machtausübung nahelegen als αὐθάδης, das hier vor allem Eigenwilligkeit bzw. Eigensinn meint.'
