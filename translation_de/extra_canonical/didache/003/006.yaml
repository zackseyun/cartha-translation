  - severity: low
    issue: „selbstherrlich“ ist für αὐθάδης semantisch etwas zugespitzt.
    rationale: αὐθάδης meint in diesem Kontext eher eigensinnig, eigenwillig oder starr selbstbestimmt; „selbstherrlich“ kann zusätzlich einen herrischen Umgang mit anderen implizieren.
