id: DID.3.6
reference: Didache 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου γόγγυσος· ἐπειδὴ ὁδηγεῖ εἰς τὴν βλασφημίαν· μηδὲ αὐθάδης μηδὲ πονηρόφρων· ἐκ γὰρ τούτων ἁπάντων βλασφημίαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/006.yaml
  text: My child, do not become a grumbler, since it leads to blasphemy; nor self-willed, nor evil-minded, for from all these blasphemies are born.
translation:
  language: de
  text: Mein Kind, werde nicht zum Nörgler, denn dies führt zur Lästerung; sei weder eigensinnig noch böswillig, denn aus all diesem entstehen Lästerungen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γόγγυσος
  choice: Nörgler
  rationale: Bezeichnet einen Menschen, der murrt und fortwährend unzufrieden klagt; „Nörgler“ gibt diese charakterliche Neigung in natürlichem modernem Deutsch wieder.
- source_word: βλασφημία / βλασφημίαι
  choice: Lästerung / Lästerungen
  rationale: Bewahrt den religiös und moralisch gewichtigen Sinn von ehrverletzendem, insbesondere gegen Gott gerichtetem Reden, ohne den möglichen Bezug unnötig einzuengen.
- source_word: αὐθάδης
  choice: selbstherrlich
  rationale: Gibt die Haltung eines eigenwilligen, anmaßenden Menschen wieder, der sich über andere hinwegsetzt.
- source_word: πονηρόφρων
  choice: hege keine bösen Gedanken
  rationale: Das Adjektiv bezeichnet eine böse oder arglistige Gesinnung; die verbale Formulierung ist im Deutschen verständlich und wahrt den Bezug auf das innere Denken.
- source_word: γεννῶνται
  choice: entstehen
  rationale: Das wörtliche Bild „werden geboren“ ist verständlich, wirkt hier jedoch unnatürlich; „entstehen“ überträgt die kausale Aussage klar.
theological_decisions:
- issue: Bezug und Umfang von βλασφημία
  choice: „Lästerung“ ohne ausdrückliche Ergänzung eines Objekts
  alternative: „Gotteslästerung“
  rationale: Der griechische Text nennt kein Objekt. „Lästerung“ erhält die mögliche religiöse Bedeutung, ohne ausdrücklich festzulegen, dass ausschließlich Gott das Ziel ist.
- issue: Wechsel vom Singular zum Plural bei βλασφημία
  choice: Singular im ersten Satz, Plural im zweiten
  alternative: Beide Vorkommen einheitlich im Singular
  rationale: 'Der Numeruswechsel des griechischen Textes wird bewahrt: Die Neigung führt allgemein zur Lästerung, während aus den genannten Haltungen vielfältige Lästerungen hervorgehen.'
translation_notes:
  register: Moderne, würdevolle und direkt verständliche Mahnrede. Die vertrauliche Anrede „Mein Kind“ und die Imperative bleiben erhalten; semitisch bzw. frühchristlich geprägte Bildlichkeit wird nur dort geglättet, wo eine wörtliche Wiedergabe im Deutschen unnötig steif wäre.
