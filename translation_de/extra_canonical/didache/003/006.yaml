  terminology: „Nörgler“ und „Lästerung/Lästerungen“ sind geeignet. „Eigensinnig“ gibt αὐθάδης präziser wieder als „selbstherrlich“; „böswillig“ bezeichnet die von πονηρόφρων gemeinte schlechte Gesinnung, ohne sie auf bloße Gedankeninhalte zu beschränken.
