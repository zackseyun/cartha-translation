id: DID.3.9
reference: Didache 3:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐχ ὑψώσεις σεαυτὸν οὐδὲ δώσεις τῇ ψυχῇ σου θράσος. Οὐ κολληθήσεται ἡ ψυχή σου μετὰ ὑψηλῶν, ἀλλὰ μετὰ δικαίων καὶ ταπεινῶν ἀναστραφήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/009.yaml
  text: You shall not exalt yourself, nor give your soul boldness. Your soul shall not be joined with the lofty, but you shall associate with the righteous and humble.
translation:
  language: de
  text: Du sollst dich nicht selbst erhöhen und deiner Seele keine Dreistigkeit verleihen. Deine Seele soll sich nicht an Hochgestellte binden, sondern du sollst mit Gerechten und Demütigen Umgang haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑψώσεις σεαυτόν
  choice: dich selbst erhöhen
  rationale: Bewahrt das Bild und den reflexiven Sinn des griechischen Ausdrucks in natürlichem Deutsch.
- source_word: δώσεις τῇ ψυχῇ σου θράσος
  choice: deiner Seele keine Dreistigkeit erlauben
  rationale: θράσος bezeichnet hier eine verwerfliche Kühnheit oder Dreistigkeit. „Erlauben“ gibt die idiomatische Wirkung von „geben“ wieder, ohne eine zusätzliche Deutung wie „Hochmut“ einzutragen.
- source_word: ὑψηλῶν
  choice: Hochgestellte
  rationale: Das substantivierte Adjektiv kann gesellschaftlich hochstehende oder hochmütige Menschen bezeichnen. „Hochgestellte“ erhält den Bezug auf Personen und lässt den unmittelbaren sozialen Kontrast bestehen.
- source_word: κολληθήσεται
  choice: sich ... binden
  rationale: Gibt die starke Bedeutung von κολλάω als enges Anschließen oder Verbinden wieder.
- source_word: ἀναστραφήσῃ
  choice: Umgang haben
  rationale: Der Ausdruck bezeichnet Lebensführung beziehungsweise gesellschaftlichen Umgang; im vorliegenden Kontrast ist „Umgang haben“ natürlich und präzise.
theological_decisions:
- issue: Bedeutung von ὑψηλοί im Gegensatz zu Gerechten und Demütigen
  choice: Hochgestellte
  alternative: Hochmütige
  rationale: Der griechische Ausdruck ist mehrdeutig und kann hohen Rang oder stolze Gesinnung bezeichnen. „Hochgestellte“ vermeidet es, die moralische Deutung stillschweigend festzulegen; der Zusammenhang warnt jedenfalls vor enger Bindung an solche Personen.
- issue: Anthropologische Bedeutung von ψυχή
  choice: Seele
  alternative: Inneres / Leben
  rationale: „Seele“ wahrt die wiederholte griechische Formulierung und ihre Offenheit, ohne eine spezifische anthropologische Lehre zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Mahnrede. Die parallele Wiederholung von „Seele“ bleibt erhalten. Das Semikolon macht den Gegensatz zwischen der gemiedenen Bindung und dem empfohlenen Umgang deutlich.
