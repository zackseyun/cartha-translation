source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ἐπιθυμητής· ὁδηγεῖ γὰρ ἡ ἐπιθυμία πρὸς τὴν πορείαν· μηδὲ αἰσχρολόγος μηδὲ ὑψηλοόφθαλμος· ἐκ γὰρ τούτων ἀπάντων μοιχεῖαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/003.yaml
  text: My child[a], do not become lustful, for lust leads to sexual immorality; nor foul-mouthed, nor haughty, for from all these adulteries are born.
translation:
  language: de
  text: Mein Kind, werde nicht begehrlich; denn Begierde führt zu sexueller Unmoral. Rede auch nicht obszön und schaue andere nicht begehrlich an[a]; denn aus all dem entstehen Ehebrüche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sei nicht hochmütig“. Das griechische Wort bedeutet wörtlich etwa „hochäugig“ und kann hier einen begehrlichen, umherschweifenden Blick oder eine hochmütige Haltung bezeichnen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐπιθυμητής / ἐπιθυμία
  choice: von Begierde beherrscht / Begierde
  rationale: Die Wortfamilie wird im Deutschen erkennbar beibehalten. „Von Begierde beherrscht“ gibt die charakterliche Ausrichtung von ἐπιθυμητής natürlicher wieder als das ungebräuchliche „begierig“.
- source_word: πορείαν (offenbar für πορνείαν)
  choice: sexuelle Unmoral
  rationale: Der überlieferte Zusammenhang und die bekannte Lesart πορνείαν weisen auf unerlaubtes sexuelles Verhalten. Die weitere Formulierung vermeidet eine unnötige Einengung auf Prostitution oder einen einzelnen Sexualakt.
- source_word: αἰσχρολόγος
  choice: schamlos reden
  rationale: Bezeichnet obszöne, unanständige oder beschämende Rede; die verbale Form klingt im modernen Deutschen natürlich und bleibt im ethischen Mahnstil.
- source_word: ὑψηλοόφθαλμος
  choice: andere begehrlich anschauen
  rationale: Im unmittelbaren Zusammenhang von Begierde, sexueller Unmoral und Ehebruch liegt ein lüsterner beziehungsweise umherschweifender Blick nahe. Die mögliche Bedeutung „hochmütig“ wird wegen der echten lexikalischen Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: μοιχεῖαι
  choice: Ehebrüche
  rationale: Der Plural des griechischen Textes wird erhalten; gemeint sind daraus hervorgehende Fälle oder Taten des Ehebruchs.
theological_decisions:
- issue: Zusammenhang zwischen Vorformen des Begehrens und Ehebruch
  choice: „aus all dem entstehen Ehebrüche“
  alternative: „all dies führt zum Ehebruch“
  rationale: Die Formulierung bewahrt das starke Bild von γεννῶνται („werden geboren/entstehen“) sowie den griechischen Plural, ohne die Aussage zu einer bloß allgemeinen Warnung abzuschwächen.
- issue: Bedeutung von ὑψηλοόφθαλμος
  choice: sexuell begehrliche Blicke im Haupttext, Hochmut als Fußnotenalternative
  alternative: „sei nicht hochmütig“ im Haupttext
  rationale: Der sexuelle Kontext stützt die gewählte Lesart, doch die wörtliche Bildung „hochäugig“ kann auch Hochmut bezeichnen. Die Fußnote verhindert, dass diese Spannung stillschweigend aufgelöst wird.
translation_notes:
  register: Moderne, würdevolle Mahnrede in direkter Anrede. Kurze Hauptsätze erhalten den katechetischen Ton. „Sexuelle Unmoral“ ist verständlich und hinreichend weit; die ungewöhnliche Bildsprache bei der Entstehung von Ehebrüchen bleibt erhalten.
