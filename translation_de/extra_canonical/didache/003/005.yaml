id: DID.3.5
reference: Didache 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ψεύστης· ἐπειδὴ ὁδηγεῖ τὸ ψεῦσμα εἰς τὴν κλοπήν· μηδὲ φιλάργυρος μηδὲ κενόδοξος· ἐκ γὰρ τούτων ἁπάντων κλοπαὶ γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/005.yaml
  text: My child, do not become a liar, since lying leads to theft; nor be money-loving, nor vainglorious, for from all these thefts are born.
translation:
  language: de
  text: Mein Kind, werde nicht zum Lügner; denn die Lüge führt zum Diebstahl. Werde auch weder geldgierig noch ruhmsüchtig; denn aus all diesen Dingen entstehen Diebstähle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: Mein Kind
  rationale: Direkte, natürliche Wiedergabe der persönlichen Anrede.
- source_word: μὴ γίνου ψεύστης
  choice: werde nicht zum Lügner
  rationale: Bewahrt den mit γίνου ausgedrückten Gedanken einer Entwicklung beziehungsweise Gewöhnung und glättet ihn nicht zu einem bloßen Zustandsverbot.
- source_word: τὸ ψεῦσμα
  choice: die Lüge
  rationale: Im Deutschen ist „die Lüge“ hier idiomatischer als „das Falsche“ oder „eine Lüge“ und bezeichnet das lügnerische Reden beziehungsweise Verhalten.
- source_word: τὴν κλοπήν / κλοπαί
  choice: zum Diebstahl / Diebstähle
  rationale: Die Singular-Plural-Unterscheidung des griechischen Textes bleibt erhalten.
- source_word: φιλάργυρος
  choice: geldgierig
  rationale: Gibt die ungeordnete Liebe zum Geld in verständlichem, gegenwärtigem Deutsch wieder.
- source_word: κενόδοξος
  choice: ruhmsüchtig
  rationale: Bezeichnet das Streben nach leerem Ruhm oder Ansehen; „ruhmsüchtig“ ist knapp und natürlich.
- source_word: γεννῶνται
  choice: entstehen
  rationale: Das wörtliche Bild „werden geboren“ wäre verständlich, wirkt hier im Deutschen jedoch unnötig fremd; „entstehen“ bewahrt die kausale Aussage.
theological_decisions:
- issue: Zusammenhang von Lastern und Diebstählen
  choice: „aus all dem entstehen Diebstähle“
  alternative: „all dies bringt Diebstähle hervor“
  rationale: Die Aussage wird als moralischer Ursachenzusammenhang wiedergegeben, ohne sie zu einer ausnahmslosen dogmatischen Behauptung auszubauen oder abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter paränetischer Anrede. Der zweite Satz ergänzt „Sei“ zur natürlichen deutschen Parallelführung, ohne den Sinn zu verändern.
