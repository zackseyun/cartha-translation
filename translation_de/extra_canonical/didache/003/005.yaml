  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Werde auch nicht …“ schafft eine natürliche und klare Parallele zum vorangehenden Verbot; „weder … noch“ ist idiomatisch und verhindert eine unnötige Lesart von „oder“.
  terminology: „Lügner“, „Lüge“, „geldgierig“, „ruhmssüchtig“ und „Diebstahl/Diebstähle“ sind angemessen. „Aus all diesen Dingen“ gibt den Rückbezug auf die zuvor genannten Verhaltensweisen klar wieder, ohne den Ursachenzusammenhang zu verschärfen.
