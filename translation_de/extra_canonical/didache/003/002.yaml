id: DID.3.2
reference: Didache 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ γίνου ὀργίλος· ὁδηγεῖ γὰρ ἡ ὀργὴ πρὸς τὸν φόνον· μηδὲ ζηλωτὴς μηδὲ ἐριστικὸς μηδὲ θυμικός· ἐκ γὰρ τούτων ἀπάντων φόνοι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/002.yaml
  text: Do not become quick-tempered, for anger leads to murder; nor be jealous, nor quarrelsome, nor hot-headed, for from all these murders are born.
translation:
  language: de
  text: Werde nicht jähzornig; denn der Zorn führt zum Mord. Sei auch nicht eifersüchtig, streitsüchtig oder hitzköpfig; denn aus all dem entstehen Morde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργίλος
  choice: jähzornig
  rationale: Bezeichnet eine zur Wut oder schnellen Zornesreaktion neigende Person; „jähzornig“ gibt diese Charakterneigung knapp und natürlich wieder.
- source_word: ὀργή
  choice: Zorn
  rationale: Die übliche und registergerechte Entsprechung für heftigen Zorn.
- source_word: φόνος / φόνοι
  choice: Mord / Morde
  rationale: Bewahrt den starken Sinn vorsätzlicher Tötung und bildet den Wechsel vom Singular zum Plural im griechischen Text ab.
- source_word: ζηλωτής
  choice: eifersüchtig
  rationale: Im negativen Kontext bezeichnet das Wort neidvolle oder eifersüchtige Leidenschaft; „eifersüchtig“ entspricht der Warnreihe und der konsultierten englischen Fassung.
- source_word: ἐριστικός
  choice: streitsüchtig
  rationale: Gibt die Neigung zu Streit und Zank präzise wieder.
- source_word: θυμικός
  choice: hitzköpfig
  rationale: Bezeichnet eine von heftiger Gemütsbewegung und aufbrausendem Temperament bestimmte Haltung; „hitzköpfig“ ist modern und verständlich.
- source_word: γεννῶνται
  choice: entstehen
  rationale: Das wörtliche Bild „werden geboren“ ist im Deutschen möglich, wirkt hier aber markiert; „entstehen“ vermittelt die kausale Aussage natürlich, ohne sie zu verstärken.
theological_decisions:
- issue: Verhältnis innerer Haltungen zum Mord
  choice: 'Die kausale Warnung wird direkt beibehalten: Zorn führt zum Mord, und aus den genannten Haltungen entstehen Morde.'
  alternative: Die Aussage abschwächen, etwa zu „kann zu Mord führen“.
  rationale: Der griechische Text formuliert ohne Möglichkeitsmarker. Die Spannung zwischen innerer Haltung und äußerer Gewalttat soll nicht geglättet werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter paränetischer Anrede. Der Singular „Mord“ und der anschließende Plural „Morde“ folgen bewusst dem griechischen Wortlaut. Keine Fußnoten erforderlich.
