  source_fidelity: 'Die Übersetzung bildet die Struktur und den Sinn des griechischen Textes zuverlässig ab: γίνου wird angemessen mit „Werde nicht“ wiedergegeben, ὀργίλος mit „jähzornig“, und die kausalen Aussagen („führt zum Mord“, „aus all dem entstehen Morde“) bleiben ohne abschwächenden Möglichkeitsausdruck erhalten. Der Wechsel von φόνον im Singular zu φόνοι im Plural ist bewahrt. Die Aufzählung zu ζηλωτής, ἐριστικός und θυμικός ist vollständig und sachgerecht.'
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch und für eine paränetische Weisung klar lesbar. „Aus all dem entstehen Morde“ ist zwar bildlich und etwas pointiert, gibt γεννῶνται jedoch natürlich wieder, ohne das Geburtsbild unnötig zu glätten.
  terminology: „Jähzornig“, „Zorn“, „eifersüchtig“, „streitsüchtig“ und „hitzköpfig“ sind im Kontext treffende, registergerechte Wiedergaben. „Mord/Morde“ wahrt die starke Terminologie des Ausgangstextes. Die englische POB-Fassung stützt insbesondere die vollständige negative Reihung und die direkte Kausalität.
