id: DID.3.8
reference: Didache 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γίνου μακρόθυμος καὶ ἐλεήμων καὶ ἄκακος καὶ ἡσύχιος καὶ ἀγαθὸς καὶ τρέμων τοὺς λόγους διὰ παντός, οὓς ἤκουσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/008.yaml
  text: Be patient and merciful and guileless and quiet and good[a], and always trembling at the words that you heard.
translation:
  language: de
  text: Sei[a] geduldig und barmherzig, arglos, still und gut, und zittere stets vor den Worten, die du gehört hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Werde geduldig und barmherzig, arglos, still und gut, und zittere stets vor den Worten, die du gehört hast.“'
    reason: Γίνου kann sowohl den fortdauernden Zustand („Sei“) als auch das Hineinwachsen in diese Haltung („Werde“) ausdrücken.
lexical_decisions:
- source_word: Γίνου
  choice: Sei
  rationale: Der durative Imperativ von γίνομαι kann in einer sittlichen Mahnung idiomatisch als „Sei“ wiedergegeben werden; dies verbindet sich im Deutschen natürlich sowohl mit den Adjektiven als auch mit dem anschließenden Partizip.
- source_word: μακρόθυμος
  choice: geduldig
  rationale: Bezeichnet langes Ausharren beziehungsweise Langmut; „geduldig“ ist die klare, moderne Entsprechung.
- source_word: ἐλεήμων
  choice: barmherzig
  rationale: Gibt die Bereitschaft zu Erbarmen und tätigem Mitgefühl angemessen wieder.
- source_word: ἄκακος
  choice: arglos
  rationale: Bewahrt hier den Sinn von Unschuld beziehungsweise fehlender Bosheit, ohne das Wort als bloße Naivität wiederzugeben.
- source_word: ἡσύχιος
  choice: still
  rationale: Gibt die Haltung von Ruhe, Friedfertigkeit und Zurückhaltung knapp wieder; „ruhig“ wäre ebenfalls möglich.
- source_word: τρέμων τοὺς λόγους
  choice: zittere vor den Worten
  rationale: Das griechische Partizip wird als koordinierter Imperativ natürlich ins Deutsche übertragen; „vor“ macht den Bezug des Zitterns auf die Worte idiomatisch deutlich.
- source_word: διὰ παντός
  choice: stets
  rationale: Die feste Wendung bedeutet „immer“ oder „allezeit“; „stets“ ist würdig und gegenwärtig.
- source_word: ἤκουσας
  choice: du gehört hast
  rationale: Der Aorist bezeichnet das erfolgte Hören; im modernen Deutschen ist das Perfekt in diesem Relativsatz natürlicher als „du hörtest“, ohne eine zusätzliche theologische Aussage einzutragen.
theological_decisions:
- issue: Haltung gegenüber den empfangenen Worten
  choice: „zittere stets vor den Worten“
  alternative: „begegne den Worten stets mit Ehrfurcht“
  rationale: Die konkrete und spannungsreiche Bildsprache von τρέμων wird mit „zittere“ bewahrt und nicht zu einer bloß abstrakten Ehrfurcht abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Reihung des Griechischen bleibt erkennbar, wird aber durch deutsche Zeichensetzung lesbarer gemacht; die starke Metapher des Zitterns bleibt erhalten.
