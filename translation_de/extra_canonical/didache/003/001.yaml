source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, φεῦγε ἀπὸ παντὸς πονηροῦ καὶ ἀπὸ παντὸς ὁμοίου αὐτοῦ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/001.yaml
  text: My child, flee from every evil thing, and from everything like it.
translation:
  language: de
  text: Mein Kind, fliehe vor allem Bösen und vor allem, was ihm ähnlich ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: Mein Kind
  rationale: Gibt die persönliche, lehrende Anrede natürlich und geschlechtsübergreifend wieder.
- source_word: φεῦγε ἀπό
  choice: fliehe vor
  rationale: Bewahrt den eindringlichen Imperativ und entspricht im Deutschen der idiomatischen Verbindung.
- source_word: παντὸς πονηροῦ
  choice: allem Bösen
  rationale: Das substantivierte Adjektiv kann allgemein das Böse beziehungsweise jede böse Sache bezeichnen; die knappe deutsche Form wahrt diese Weite.
- source_word: παντὸς ὁμοίου αὐτοῦ
  choice: allem, was ihm ähnlich ist
  rationale: Gibt den Vergleichsbezug auf das Böse eng am griechischen Wortlaut wieder, ohne genauer festzulegen, welche Ähnlichkeit gemeint ist.
theological_decisions:
- issue: Umfang der Abkehr vom Bösen
  choice: Die umfassende Formulierung „allem Bösen“ und auch dem ihm Ähnlichen bleibt bestehen.
  alternative: „jeder bösen Tat und allem Anschein des Bösen“
  rationale: Der griechische Text nennt weder ausdrücklich Taten noch bloßen Anschein. Eine solche Konkretisierung würde die offene ethische Reichweite unnötig verengen oder dogmatisch auslegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der wiederholte Ausdruck „vor allem“ wird zugunsten der engen Parallelität des griechischen Satzes beibehalten; „fliehe“ erhält den eindringlichen Weisungston.
