id: DID.3.10
reference: Didache 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰ συμβαίνοντά σοι ἐνεργήματα ὡς ἀγαθὰ προσδέξῃ, εἰδὼς ὅτι ἄτερ Θεοῦ οὐδὲν γίνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/010.yaml
  text: You shall accept the things that happen to you as good, knowing that apart from God nothing happens.
translation:
  language: de
  text: Alles, was dir widerfährt, sollst du als gut annehmen, im Wissen, dass ohne Gott nichts geschieht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ συμβαίνοντά σοι ἐνεργήματα
  choice: Alles, was dir widerfährt
  rationale: Die natürliche deutsche Wendung gibt die dir widerfahrenden Geschehnisse umfassend wieder. „Widerfährt“ bewahrt gegenüber dem neutraleren „passiert“ den ernsten, würdigen Ton des Satzes.
- source_word: ὡς ἀγαθὰ προσδέξῃ
  choice: sollst du als gut annehmen
  rationale: „Als gut“ wahrt die Aussage und ihre Spannung, ohne sie zu „zum Guten“ oder „mit Dankbarkeit“ umzudeuten. „Annehmen“ entspricht dem bereitwilligen Aufnehmen in προσδέχομαι.
- source_word: εἰδὼς
  choice: im Wissen
  rationale: Die partizipiale Begründung wird knapp und idiomatisch wiedergegeben, ohne einen zusätzlichen Kausalzusammenhang ausdrücklich einzuführen.
- source_word: ἄτερ Θεοῦ οὐδὲν γίνεται
  choice: dass ohne Gott nichts geschieht
  rationale: Die Wortstellung ist natürlich deutsch und bewahrt die weitreichende, theologisch spannungsvolle Aussage des Griechischen.
theological_decisions:
- issue: Gottes Verhältnis zu allem Geschehen
  choice: „ohne Gott nichts geschieht“
  alternative: „nichts gegen Gottes Willen geschieht“ oder „nichts ohne Gottes Zulassung geschieht“
  rationale: Der Ausgangstext unterscheidet nicht zwischen Verursachung, Willen und Zulassung. Die Übersetzung erhält diese Ambiguität, statt eine bestimmte Vorsehungslehre einzutragen.
- issue: Bewertung dessen, was einem widerfährt
  choice: „als gut annehmen“
  alternative: „zum Guten annehmen“ oder „gelassen hinnehmen“
  rationale: Das Griechische bezeichnet die Geschehnisse ausdrücklich als ἀγαθά im Modus des Annehmens. Die scharfe Aussage wird nicht psychologisiert oder abgeschwächt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. Die Anrede bleibt im vertrauten Singular („dir“), und die knappe Satzstruktur des Griechischen wird weitgehend bewahrt.
