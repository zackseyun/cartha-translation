source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἴσθι δὲ πραῢς, ἐπεὶ οἱ πραεῖς κληρονομήσουσι τὴν γῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/007.yaml
  text: But be meek, because the meek will inherit the earth.
translation:
  language: de
  text: Sei aber sanftmütig, denn die Sanftmütigen werden die Erde erben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πραΰς / πραεῖς
  choice: sanftmütig / die Sanftmütigen
  rationale: „Sanftmütig“ gibt die Haltung milder, nicht gewaltsamer Selbstbeherrschung wieder und bewahrt zugleich den erkennbaren Anklang an Matthäus 5,5.
- source_word: ἐπεὶ
  choice: denn
  rationale: Die Konjunktion begründet die Aufforderung; „denn“ ist im Deutschen natürlich und würdevoll.
- source_word: κληρονομήσουσι
  choice: werden … erben
  rationale: Die Futurform und das Bild des Erbens werden unmittelbar bewahrt.
- source_word: τὴν γῆν
  choice: die Erde
  rationale: Das griechische γῆ kann „Erde“ oder „Land“ bedeuten. „Die Erde“ entspricht in diesem deutlich an Matthäus 5,5 angelehnten Satz der geläufigen und kontextuell naheliegenden Wiedergabe.
theological_decisions:
- issue: Reichweite von τὴν γῆν
  choice: die Erde
  alternative: das Land
  rationale: Die Wendung lässt sprachlich beide Möglichkeiten zu. Wegen des nahezu wörtlichen Bezugs auf die Seligpreisung und deren traditionell universal verstandener Formulierung steht „die Erde“ im Haupttext, ohne die Aussage weiter auszudeuten.
translation_notes:
  register: Kurzer, imperativischer Lehrsatz in modernem, würdigem Standarddeutsch. Die Wiederholung von „sanftmütig“ wird entsprechend der griechischen Wortwiederholung beibehalten.
