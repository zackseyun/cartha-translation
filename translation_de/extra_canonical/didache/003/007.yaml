  source_fidelity: Die Übersetzung gibt Ἴσθι δὲ πραΰς zutreffend als „Sei aber sanftmütig“ wieder. Die begründende Konjunktion ἐπεὶ ist mit „denn“ angemessen erfasst; κληρονομήσουσι und τὴν γῆν werden als „werden die Erde erben“ form- und sinngerecht wiedergegeben. Die mögliche Bedeutung „Land“ für γῆ wird nicht unzulässig ausgeschlossen, doch ist „Erde“ angesichts des erkennbaren Anklangs an Matthäus 5,5 eine gut vertretbare Haupttextwahl.
  naturalness: Der kurze Lehrsatz ist idiomatisches, modernes Standarddeutsch und bewahrt den würdigen, imperativischen Charakter. Die Wiederholung von „sanftmütig/Sanftmütigen“ ist natürlich genug und bildet die griechische Wiederholung treffend ab.
  terminology: „Sanftmütig“ ist für πραΰς/prαεῖς ein etablierter und semantisch geeigneter Ausdruck. „Erde“ bewahrt zudem die traditionelle Formulierung der Parallele, ohne eine weitergehende Auslegung einzutragen.
