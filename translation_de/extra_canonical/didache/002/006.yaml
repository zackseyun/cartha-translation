  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἔσῃ πλεονέκτης οὐδὲ ἅρπαξ οὐδὲ ὑποκριτὴς οὐδὲ κακοήθης οὐδὲ ὑπερήφανος. Οὐ λήψῃ βουλὴν πονηρὰν κατὰ τοῦ πλησίον σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/006.yaml
  text: You shall not be greedy[a], nor grasping, nor a hypocrite, nor malicious, nor arrogant. You shall not take evil counsel against your neighbor.
translation:
  language: de
  text: Du sollst weder habgierig noch räuberisch sein, weder heuchlerisch noch bösartig oder hochmütig. Du sollst keinen bösen Plan gegen deinen Nächsten fassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεονέκτης
  choice: habgierig
  rationale: Bezeichnet jemanden, der immer mehr haben will; „habgierig“ ist im modernen Deutschen klar und trifft den eigenständigen ersten Begriff der Lasterreihe.
- source_word: ἅρπαξ
  choice: raubgierig
  rationale: Bezeichnet jemanden, der an sich reißt oder andere beraubt. „Raubgierig“ wahrt die Steigerung gegenüber „habgierig“ und vermeidet die Verengung auf einen berufsmäßigen Räuber.
- source_word: ὑποκριτής
  choice: Heuchler
  rationale: Die direkte und geläufige deutsche Entsprechung für jemanden, dessen Auftreten nicht seiner wirklichen Haltung entspricht.
- source_word: κακοήθης
  choice: bösartig
  rationale: Gibt den starken Sinn von Bosheit oder niederträchtigem Charakter wieder; das schwächere „übel gesinnt“ wäre hier zu zurückhaltend.
- source_word: ὑπερήφανος
  choice: hochmütig
  rationale: Trifft den negativen ethischen Sinn des griechischen Wortes präziser als das im heutigen Deutsch teils positive „stolz“.
- source_word: λήψῃ βουλὴν πονηράν
  choice: einen bösen Plan fassen
  rationale: Gibt die idiomatische Verbindung natürlich wieder und bewahrt den Gedanken einer gegen den Nächsten gerichteten bösen Absicht.
- source_word: πλησίον
  choice: Nächsten
  rationale: Die etablierte, verständliche Wiedergabe des ethischen Beziehungsbegriffs; sie bezeichnet den Mitmenschen, dem gegenüber Verantwortung besteht.
theological_decisions:
- issue: Reichweite von πλησίον
  choice: deinen Nächsten
  alternative: deinen Mitmenschen
  rationale: „Nächster“ bewahrt die traditionelle ethische und biblische Begrifflichkeit, ohne den Personenkreis im Text konfessionell oder anderweitig einzuengen.
translation_notes:
  register: Moderne, würdige Gebotssprache mit „Du sollst“. Die wiederholte Struktur des griechischen Lasterkatalogs bleibt erkennbar, wird aber durch „weder … noch“ und parallele Prädikate idiomatisch ins Deutsche übertragen.
