lexical_decisions:
- source_word: Δευτέρα
  choice: zweite
  rationale: Gibt die Ordnungszahl direkt und natürlich wieder.
- source_word: ἐντολὴ
  choice: Gebot
  rationale: Die übliche und sachlich passende Wiedergabe für eine verbindliche Weisung.
- source_word: τῆς διδαχῆς
  choice: der Lehre
  rationale: Bewahrt die Genitivkonstruktion und den möglichen Bezug auf die zuvor dargestellte Unterweisung.
theological_decisions:
- issue: Verhältnis des zweiten Gebots zur Lehre
  choice: Das zweite Gebot der Lehre
  alternative: Das zweite Gebot in der Lehre
  rationale: Der griechische Genitiv wird formal bewahrt, ohne näher festzulegen, ob es sich um ein Gebot handelt, das zur Lehre gehört, oder aus ihr hervorgeht.
