  choice: durch Taten erfüllt
  alternative: von praktischem Handeln erfüllt
  rationale: Die knappe Formulierung bewahrt die ethische Spannung des Textes, ohne ein besonderes theologisches System oder eine zusätzliche Deutung einzutragen.
translation_notes:
