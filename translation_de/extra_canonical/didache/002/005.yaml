- source_word: ὁ λόγος σου
  choice: dein Wort
  rationale: Gibt die persönliche Rede bzw. Aussage in natürlichem, zugleich würdigem Deutsch wieder.
- source_word: ψευδής
  choice: falsch
  rationale: Bewahrt die breite Bedeutung von unwahr, trügerisch oder falsch, ohne sie unnötig einzuengen.
- source_word: κενός
  choice: leer
  rationale: Entspricht der bildhaften Aussage des Griechischen und kann sowohl gehaltlose als auch folgenlose Worte bezeichnen.
- source_word: μεμεστωμένος πράξει
  choice: durch Taten erfüllt
  rationale: 'Gibt die resultative Passivform von μεστόω sowie den singularischen Kollektivbegriff πρᾶξις idiomatisch wieder: Worte sollen von entsprechendem Handeln erfüllt sein.'
