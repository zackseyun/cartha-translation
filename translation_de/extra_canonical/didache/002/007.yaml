id: DID.2.7
reference: Didache 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μισήσεις πάντα ἄνθρωπον, ἀλλὰ οὓς μὲν ἐλέγξεις, περὶ δὲ ὧν προσεύξῃ, οὓς δὲ ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/007.yaml
  text: You shall not hate any person, but some you shall reprove, for some you shall pray, and some you shall love more than your own life.
translation:
  language: de
  text: Du sollst keinen Menschen hassen, doch die einen sollst du zurechtweisen, für die anderen sollst du beten, und wieder andere sollst du mehr lieben als dein eigenes Leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ἄνθρωπον
  choice: keinen Menschen
  rationale: Die Verbindung bezeichnet hier allgemein jeden Menschen, nicht speziell einen Mann. Im Deutschen gibt die verneinte Formulierung „keinen Menschen“ das umfassende Verbot natürlich wieder.
- source_word: ἐλέγξεις
  choice: sollst du zurechtweisen
  rationale: Das Verb kann aufdecken, überführen oder tadeln bedeuten. „Zurechtweisen“ passt zum ethischen Mahnkontext, ohne ein förmliches Gerichtsverfahren vorauszusetzen.
- source_word: περὶ ... ὧν προσεύξῃ
  choice: für die anderen sollst du beten
  rationale: περί mit dem Gebetsverb bezeichnet hier das Beten für bzw. im Blick auf bestimmte Menschen. „Für ... beten“ ist die natürliche deutsche Entsprechung.
- source_word: ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου
  choice: sollst du mehr lieben als dein eigenes Leben
  rationale: ψυχή bezeichnet in diesem Vergleich das eigene Leben; ὑπέρ mit Akkusativ drückt ein Übertreffen aus. Die Wiedergabe bewahrt die zugespitzte Forderung.
theological_decisions:
- issue: Verhältnis zwischen dem allgemeinen Hassverbot und den drei folgenden Personengruppen
  choice: Die drei Gruppen werden parallel und ohne zusätzliche Erklärung wiedergegeben.
  alternative: Die Gruppen als abgestufte Reaktionen auf Feinde oder als feste geistliche Kategorien deuten.
  rationale: Der griechische Text benennt weder die Kriterien für die Gruppen noch ihr genaues Verhältnis zueinander. Eine nähere Systematisierung würde die genuine Offenheit des Satzes auflösen.
- issue: Bedeutung von „mehr lieben als dein eigenes Leben“
  choice: Die starke, wörtlich naheliegende Vergleichsaussage bleibt erhalten.
  alternative: Abschwächend mit „wie dich selbst“ oder konkretisierend mit „das Leben für sie hingeben“ übersetzen.
  rationale: Beide Alternativen würden den Wortlaut entweder mildern oder interpretierend erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel „die einen – die anderen – wieder andere“ macht die dreigliedrige griechische Konstruktion verständlich, ohne die nicht näher bestimmten Gruppen inhaltlich festzulegen.
