id: DID.2.3
reference: Didache 2:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιθυμήσεις τὰ τοῦ πλησίον, οὐκ ἐπιορκήσεις, οὐ ψευδομαρτυρήσεις, οὐ κακολογήσεις, οὐ μνησικακήσεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/003.yaml
  text: You shall not covet the things of your neighbor[a]; you shall not swear falsely; you shall not bear false witness; you shall not speak evil; you shall not hold a grudge.
translation:
  language: de
  text: Du sollst nicht begehren, was deinem Nächsten gehört[a]; du sollst keinen Meineid schwören; du sollst kein falsches Zeugnis ablegen; du sollst nicht schlecht über andere reden; du sollst keinen Groll hegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du sollst nicht nach dem verlangen, was deinem Nächsten gehört.“'
    reason: Bewahrt die neutralere lexikalische Wiedergabe von ἐπιθυμέω als mögliche Alternative, während der Haupttext wegen des Dekalog-Anklangs „begehren“ verwendet.
lexical_decisions:
- source_word: ἐπιθυμήσεις
  choice: sollst nicht begehren
  rationale: Im Zusammenhang mit τὰ τοῦ πλησίον klingt das Verbot des Dekalogs an. „Begehren“ gibt hier das unerlaubte, auf den Besitz des Nächsten gerichtete Verlangen genauer wieder als das neutrale „wünschen“ oder „verlangen“.
- source_word: τὰ τοῦ πλησίον
  choice: was deinem Nächsten gehört
  rationale: Die substantivierte Wendung bezeichnet allgemein die Dinge beziehungsweise den Besitz des Nächsten; die idiomatische deutsche Fassung bewahrt diesen umfassenden Sinn.
- source_word: ἐπιορκήσεις
  choice: sollst keinen Meineid schwören
  rationale: Das Verb bezeichnet falsches beziehungsweise meineidiges Schwören. Die deutsche Wendung ist präzise und natürlich.
- source_word: ψευδομαρτυρήσεις
  choice: sollst kein falsches Zeugnis ablegen
  rationale: Diese traditionelle, weiterhin verständliche Formulierung entspricht dem gerichtlichen und ethischen Sinn des griechischen Verbs.
- source_word: κακολογήσεις
  choice: sollst nicht schlecht über andere reden
  rationale: Die Formulierung hält die breite Bedeutung von übler, herabsetzender Rede fest, ohne sie auf Verleumdung, Beschimpfung oder Fluchen einzuengen.
- source_word: μνησικακήσεις
  choice: sollst keinen Groll hegen
  rationale: Das Verb meint, erlittenes Unrecht nachzutragen beziehungsweise an Feindseligkeit festzuhalten. „Groll hegen“ ist eine natürliche und treffende deutsche Wiedergabe.
theological_decisions:
- issue: Anklang an das Begehrensverbot des Dekalogs
  choice: „begehren“
  alternative: „Verlangen haben nach“
  rationale: Die Übersetzung bewahrt den erkennbaren Anklang an das biblische Gebot, ohne den Gegenstandsbereich über das griechische „was dem Nächsten gehört“ hinaus zu bestimmen.
- issue: Reichweite des Verbots κακολογήσεις
  choice: 'allgemein: „nicht schlecht über andere reden“'
  alternative: 'enger: „nicht verleumden“ oder „nicht beschimpfen“'
  rationale: Das griechische Verb umfasst verschiedene Formen übler oder herabsetzender Rede; eine engere Wiedergabe würde die Aussage unnötig festlegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Form „Du sollst nicht“ erhält den gebotsartigen Rhythmus des griechischen Textes; idiomatische Ergänzungen wie „über andere“ verdeutlichen den im Deutschen nötigen Bezug, ohne den Sinn konfessionell oder dogmatisch einzuengen.
