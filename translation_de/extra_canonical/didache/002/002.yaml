- from: Du sollst nicht morden; du sollst nicht die Ehe brechen; du sollst keine Jungen sexuell missbrauchen;[a] du sollst keine Unzucht begehen; du sollst nicht stehlen; du sollst keine Magie treiben; du sollst keine Zaubermittel anwenden;[b] du sollst kein Kind durch Abtreibung töten und auch kein Neugeborenes umbringen.[c]
  to: Du sollst nicht morden; du sollst nicht die Ehe brechen; du sollst keine Jungen sexuell missbrauchen;[a] du sollst keine sexuelle Unmoral begehen; du sollst nicht stehlen; du sollst keine Magie treiben; du sollst keine Zaubermittel anwenden;[b] du sollst kein Kind durch Abtreibung töten und auch kein bereits geborenes Kind töten.[c]
