  source_fidelity: 'Die Verbotsreihe und die Unterscheidung von φονεύσεις („morden“) und ἀποκτενεῖς („töten/umbringen“) sind insgesamt sachgerecht. παιδοφθορήσεις ist angesichts des Kontexts plausibel als sexueller Missbrauch bzw. sexuelle Ausbeutung von Jungen wiedergegeben. Bei γεννηθέν geht „Neugeborenes“ jedoch über den griechischen Wortlaut hinaus: Das Partizip bedeutet „das Geborene“ bzw. „ein bereits geborenes Kind“, ohne ein enges Lebensalter zu bestimmen.'
  naturalness: Der Verbotsstil ist klar und gut lesbar. „Kein Neugeborenes umbringen“ ist idiomatisch, sollte aber aus Gründen der Genauigkeit durch „kein bereits geborenes Kind töten“ ersetzt werden. „Unzucht“ ist verständlich, aber deutlich traditionell; „sexuelle Unmoral“ ist modernes Standarddeutsch und wahrt die absichtlich breite Reichweite von πορνεύσεις.
  terminology: Die Differenzierung von μαγεύσεις und φαρμακεύσεις ist sinnvoll. „Zaubermittel anwenden“ ist als knappe Wiedergabe von φαρμακεύσεις vertretbar, sofern die Fußnote die Verbindung zu Mitteln und Tränken als mögliche, nicht ausschließliche Nuance erklärt. Die Fußnote zu φθορά sollte nicht den Eindruck erwecken, „Verderbnis“ sei hier eine brauchbare deutsche wörtliche Sachübersetzung; der Ausdruck ist im Kontext idiomatisch und seine genaue historische Erklärung bleibt umstritten.
