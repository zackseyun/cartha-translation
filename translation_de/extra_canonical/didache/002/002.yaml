    rationale: γεννηθέν bezeichnet ein geborenes Wesen/Kind, nicht spezifisch ein Neugeborenes. Die vorhandene lexikalische Begründung erkennt dies selbst an; Text und Fußnote müssen damit übereinstimmen.
  - severity: low
    issue: Fußnote c gibt φθορά mit „Verderbnis“ zu schematisch wieder
    rationale: Die Wendung τέκνον ἐν φθορᾷ ist idiomatisch und im Kontext auf vorgeburtliche Tötung bezogen. „Verderbnis“ ist zwar formal nah, erklärt die Konstruktion aber nicht zuverlässig und kann in modernem Deutsch fehlleiten.
  - severity: low
