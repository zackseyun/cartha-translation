reference: Didache 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ φονεύσεις, οὐ μοιχεύσεις, οὐ παιδοφθορήσεις, οὐ πορνεύσεις, οὐ κλέψεις, οὐ μαγεύσεις, οὐ φαρμακεύσεις, οὐ φονεύσεις τέκνον ἐν φθορᾷ οὐδὲ γεννηθὲν ἀποκτενεῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/002.yaml
  text: You shall not murder; you shall not commit adultery; you shall not sexually abuse boys;a you shall not commit sexual immorality; you shall not steal; you shall not practice magic; you shall not use sorcery; you shall not kill a child by abortion, nor kill one that has been born.b
translation:
  language: de
  text: Du sollst nicht morden; du sollst nicht die Ehe brechen; du sollst keine Jungen sexuell missbrauchen;[a] du sollst keine sexuelle Unmoral begehen; du sollst nicht stehlen; du sollst keine Magie treiben; du sollst keine Zaubermittel anwenden;[b] du sollst kein Kind durch Abtreibung töten und auch kein bereits geborenes Kind töten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet wahrscheinlich den sexuellen Missbrauch beziehungsweise die sexuelle Ausbeutung von Jungen; traditionell wird es auch mit „Knabenschändung“ wiedergegeben.
    reason: Das seltene παιδοφθορήσεις ist semantisch und historisch erklärungsbedürftig.
  - marker: b
    text: Das hier verwendete griechische Verb kann Zauberei mithilfe von Mitteln, Tränken oder anderen Substanzen bezeichnen und in manchen Zusammenhängen auch mit Vergiftung verbunden sein.
    reason: φαρμακεύσεις besitzt eine breitere Bedeutungs- und Assoziationsspanne, als eine einzelne deutsche Wiedergabe erkennen lässt.
  - marker: c
    text: Die griechische Formulierung stellt die Tötung eines Kindes „in φθορά“ der Tötung eines bereits Geborenen gegenüber. Im Zusammenhang wird die erste Wendung gewöhnlich als Tötung vor der Geburt beziehungsweise durch Abtreibung verstanden; die genaue idiomatische Erklärung von φθορά ist umstritten.
    reason: Die idiomatische Übersetzung „durch Abtreibung“ und die Wiedergabe des γεννηθέν als bereits geborenes Kind sollen transparent am griechischen Wortlaut rückgebunden werden.
lexical_decisions:
- source_word: φονεύσεις
  choice: morden
  rationale: Gibt das gezielte, rechtswidrige Töten wieder und entspricht dem traditionellen Wortlaut des Tötungsverbots.
- source_word: μοιχεύσεις
  choice: die Ehe brechen
  rationale: Natürliches modernes Deutsch für Ehebruch.
- source_word: παιδοφθορήσεις
  choice: Jungen sexuell missbrauchen
  rationale: Das seltene Verb bezeichnet im antiken Kontext wahrscheinlich sexuelle Ausbeutung beziehungsweise den Missbrauch von Knaben; die Übersetzung macht den sexuellen Gehalt verständlich, ohne eine engere konkrete Praxis festzulegen.
- source_word: πορνεύσεις
  choice: Unzucht begehen
  rationale: Bewahrt den breiten Bezug auf unerlaubtes sexuelles Verhalten; das würde durch eine engere Formulierung unnötig eingeschränkt.
- source_word: μαγεύσεις
  choice: Magie treiben
  rationale: Bezeichnet magische Praktiken allgemein und bleibt vom nachfolgenden φαρμακεύσεις unterscheidbar.
- source_word: φαρμακεύσεις
  choice: Zaubermittel anwenden
  rationale: Bewahrt den Bezug zu durch Substanzen oder Tränke ausgeübter Zauberei, ohne das Wort fälschlich auf gewöhnliche Arzneimittel oder ausschließlich auf Gift zu verengen.
- source_word: τέκνον ἐν φθορᾷ
  choice: Kind durch Abtreibung
  rationale: Im Satzkontrast mit dem bereits geborenen Kind bezeichnet ἐν φθορᾷ die Tötung vor der Geburt beziehungsweise durch Abtreibung.
- source_word: γεννηθέν
  choice: Neugeborenes
  rationale: Gibt knapp das bereits geborene Kind wieder; der griechische Ausdruck selbst legt kein bestimmtes Alter nach der Geburt fest.
- source_word: ἀποκτενεῖς
  choice: umbringen
  rationale: Unterscheidet das allgemeinere Verb stilistisch von φονεύσεις und gibt das absichtliche Töten klar wieder.
theological_decisions:
- issue: Reichweite des Verbots παιδοφθορήσεις
  choice: keine Jungen sexuell missbrauchen
  alternative: keine Knabenschändung begehen / keine Kinder verderben
  rationale: Die sexuelle Deutung passt zur Stellung zwischen Ehebruch und Unzucht und zum antiken Gebrauch. „Missbrauchen“ ist gegenwärtig verständlich; „verderben“ wäre zu unbestimmt, während eine ausdrückliche Beschränkung auf Päderastie enger wäre als der Wortlaut.
- issue: Verhältnis der letzten beiden Tötungsverbote
  choice: Abtreibung und Tötung eines bereits geborenen Kindes ausdrücklich unterscheiden
  alternative: allgemein von der Vernichtung der Leibesfrucht und des Geborenen sprechen
  rationale: Der Gegensatz ἐν φθορᾷ / γεννηθέν markiert vorgeburtliches und nachgeburtliches Töten. Die Formulierung lässt weitergehende dogmatische Folgerungen unausgesprochen.
- issue: Bedeutung von φαρμακεύσεις
  choice: Zaubermittel anwenden
  alternative: Gift mischen / Zauberei treiben
  rationale: Das Verb kann Zauberei unter Einsatz von Mitteln, Tränken oder Substanzen bezeichnen. Die gewählte Fassung wahrt diese historische Breite und vermeidet eine unbelegte Festlegung allein auf Vergiftung.
translation_notes:
  register: Dignifizierter, klarer Verbotsstil mit wiederholtem „Du sollst nicht“. Semikolons erhalten den katalogartigen Rhythmus. „Unzucht“ ist leicht traditionell, bleibt aber als knappe breite Bezeichnung verständlich. Die beiden Magieverbote werden lexikalisch unterschieden, ohne künstlich technische Kategorien zu schaffen.
