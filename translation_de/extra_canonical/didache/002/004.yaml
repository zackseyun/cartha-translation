  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἔσῃ διγνώμων οὐδὲ δίγλωσσος· παγὶς γὰρ θανάτου ἡ διγλωσσία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/004.yaml
  text: You shall not be double-minded nor double-tongued, for double-tongued speech is a snare of death.
translation:
  language: de
  text: Du sollst weder zwiespältig noch doppelzüngig sein; denn Doppelzüngigkeit ist eine Schlinge des Todes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διγνώμων
  choice: unentschlossen
  rationale: Bezeichnet hier einen Menschen mit geteilter oder schwankender Gesinnung. „Unentschlossen“ ist im heutigen Deutsch verständlich, ohne den Ausdruck vorschnell als rein intellektuellen Zweifel festzulegen.
- source_word: δίγλωσσος
  choice: doppelzüngig
  rationale: Gibt das bildhafte griechische Wort für widersprüchliches oder unaufrichtiges Reden idiomatisch und knapp wieder.
- source_word: διγλωσσία
  choice: Doppelzüngigkeit
  rationale: Bewahrt die substantivische Wiederaufnahme von δίγλωσσος und bezeichnet die entsprechende Redeweise bzw. Haltung.
- source_word: παγὶς θανάτου
  choice: eine Schlinge des Todes
  rationale: Die bildhafte Konstruktion wird formal bewahrt; „Schlinge“ vermittelt eine tödliche Falle und erhält die mögliche genitivische Bedeutungsweite.
theological_decisions:
- issue: Bedeutung von διγνώμων
  choice: unentschlossen
  alternative: zwiespältig / doppelgesinnt
  rationale: Der Kontext verbindet innere Unbeständigkeit mit doppelzüngigem Reden. „Unentschlossen“ hält den ethischen Sinn offen und vermeidet eine konfessionell geprägte Deutung von „doppelgesinnt“.
- issue: Genitiv in παγὶς θανάτου
  choice: Schlinge des Todes
  alternative: tödliche Schlinge / Schlinge, die zum Tod führt
  rationale: Die formale Genitivkonstruktion lässt offen, ob der Tod als Urheber, Bereich oder Ergebnis der Falle verstanden wird.
translation_notes:
  register: Kurzer, mahnender Weisheitssatz in modernem, würdigem Standarddeutsch. Die parallele Negation und die Wortwiederholung zwischen „doppelzüngig“ und „Doppelzüngigkeit“ bleiben erhalten.
