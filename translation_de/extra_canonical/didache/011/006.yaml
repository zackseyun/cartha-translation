id: DID.11.6
reference: Didache 11:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐξερχόμενος δὲ ὁ ἀπόστολος μηδὲ λαμβανέτω εἰμὴ ἄρτον ἕως οὗ αὐλισθῇ· ἐὰν δὲ ἀργύριον αἰτῇ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/006.yaml
  text: And when the apostle departs, let him take nothing except bread until he finds lodging; but if he asks for money, he is a false prophet.
translation:
  language: de
  text: Wenn der Apostel weiterzieht, soll er nichts mitnehmen außer Brot, bis er eine Unterkunft findet. Bittet er aber um Geld, ist er ein falscher Prophet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξερχόμενος
  choice: wenn ... weiterzieht
  rationale: Das Partizip bezeichnet hier den Aufbruch des reisenden Apostels aus der gastgebenden Gemeinde; »weiterzieht« gibt diesen Zusammenhang natürlich wieder.
- source_word: ὁ ἀπόστολος
  choice: der Apostel
  rationale: Der etablierte Ausdruck bewahrt die frühchristliche Amts- beziehungsweise Sendungsbezeichnung ohne zusätzliche Auslegung.
- source_word: μηδὲ λαμβανέτω
  choice: soll er nichts mitnehmen
  rationale: Gibt den verneinten Imperativ verständlich und mit seinem normativen Gewicht wieder.
- source_word: ἄρτον
  choice: Brot
  rationale: Die konkrete Grundnahrung wird wörtlich beibehalten.
- source_word: ἕως οὗ αὐλισθῇ
  choice: bis er eine Unterkunft findet
  rationale: αὐλίζομαι meint, für die Nacht unterzukommen beziehungsweise zu übernachten; die Formulierung bezeichnet natürlich das Finden der nächsten Unterkunft.
- source_word: ἀργύριον
  choice: Geld
  rationale: Im Kontext ist nicht das Metall Silber als solches, sondern Geld gemeint.
- source_word: ψευδοπροφήτης
  choice: falscher Prophet
  rationale: Die traditionelle und semantisch direkte Wiedergabe erhält das scharfe Urteil des Textes.
theological_decisions:
- issue: Bezeichnung des Reisenden als ἀπόστολος
  choice: Apostel
  alternative: Gesandter
  rationale: »Apostel« bewahrt die historische frühchristliche Bezeichnung. Der Text selbst legt nicht fest, ob sie hier technisch oder allgemein für einen reisenden Gesandten gebraucht wird.
- issue: Bedeutung des Geldverlangens
  choice: Die Aussage bleibt als uneingeschränktes Kennzeichen eines falschen Propheten formuliert.
  alternative: Das Verbot ausdrücklich auf Reisegeld oder persönlichen Gewinn beschränken
  rationale: Der griechische Satz sagt lediglich, dass der Betreffende um Geld bittet; eine genauere Motivation oder Zweckbestimmung darf nicht ergänzt werden.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der knappe regelhafte Stil des griechischen Textes bleibt erhalten; keine Fußnoten sind erforderlich.
