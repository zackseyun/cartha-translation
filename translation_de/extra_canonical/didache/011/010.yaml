id: DID.11.10
reference: Didache 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πᾶς δὲ προφήτης διδάσκων τὴν ἀλήθειαν, εἰ ἃ διδάσκει οὐ ποιεῖ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/010.yaml
  text: And every prophet teaching the truth, if he does not do what he teaches, is a false prophet.
translation:
  language: de
  text: Jeder Prophet aber, der die Wahrheit lehrt, ist ein falscher Prophet, wenn er nicht tut, was er lehrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς δὲ προφήτης
  choice: Jeder Prophet aber
  rationale: Gibt die umfassende Aussage und den weiterführend-kontrastierenden Anschluss durch δέ knapp und quellennah wieder.
- source_word: διδάσκων τὴν ἀλήθειαν
  choice: der die Wahrheit lehrt
  rationale: Das substantivisch gebrauchte Partizip wird im Deutschen natürlich als Relativsatz wiedergegeben; τὴν ἀλήθειαν bleibt als »die Wahrheit« erhalten.
- source_word: εἰ ἃ διδάσκει οὐ ποιεῖ
  choice: wenn er nicht tut, was er lehrt
  rationale: Bewahrt die Bedingung und den Gegensatz zwischen Lehre und eigener Praxis in geläufigem modernem Deutsch.
- source_word: ψευδοπροφήτης ἐστί
  choice: ist ein falscher Prophet
  rationale: Die transparente Wiedergabe erfasst die Bezeichnung ψευδοπροφήτης ohne konfessionelle Zusatzdeutung.
theological_decisions:
- issue: Verhältnis von wahrer Lehre und Lebenspraxis
  choice: 'Die Aussage bleibt in ihrer Spannung stehen: Trotz wahrer Lehre gilt der Prophet wegen fehlender eigener Praxis als falscher Prophet.'
  alternative: Die Bezeichnung nur auf die moralische Glaubwürdigkeit beschränken oder »falscher Prophet« abschwächen.
  rationale: Der griechische Text verbindet ausdrücklich das Lehren der Wahrheit mit dem Urteil ψευδοπροφήτης, sofern der Lehrende das Gelehrte nicht selbst tut; diese Spannung darf nicht aufgelöst werden.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstellung setzt die Kernaussage zuerst und lässt die Bedingung natürlich folgen, ohne Bedeutungsbestandteile auszulassen.
