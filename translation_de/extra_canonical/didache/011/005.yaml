id: DID.11.5
reference: Didache 11:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: οὐ μενεῖ δὲ ἡμέραν μίαν· ἐὰν δὲ ᾖ χρεία, καὶ τὴν ἄλλην· τρεῖς δὲ ἐὰν μείνῃ, ψευδοπροφήτης ἐστίν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/005.yaml
  text: But he shall not remain one day; but if there is need, also the next. But if he remains three days, he is a false prophet.
translation:
  language: de
  text: Er soll aber nicht einen Tag bleiben[a]; wenn es jedoch nötig ist, auch den folgenden. Bleibt er aber drei Tage, ist er ein falscher Prophet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach der vorliegenden griechischen Fassung: „Er wird aber nicht einen Tag bleiben.“ Dem Zusammenhang nach wäre „nicht länger als einen Tag“ zu erwarten; diese Einschränkung steht jedoch nicht im angegebenen griechischen Text.'
    reason: Die Formulierung des Ausgangstextes ist auffällig und steht in Spannung zur anschließenden Erlaubnis, nötigenfalls auch am folgenden Tag zu bleiben.
lexical_decisions:
- source_word: οὐ μενεῖ
  choice: Er soll aber nicht … bleiben
  rationale: Das Futur mit οὐ formuliert hier eine verbindliche Regel. „Soll nicht bleiben“ gibt diesen normativen Sinn im Deutschen natürlich wieder.
- source_word: ἡμέραν μίαν
  choice: einen Tag
  rationale: Der Akkusativ bezeichnet die Zeitdauer; die auffällige Verbindung mit der Verneinung wird entsprechend der vorliegenden griechischen Textform bewahrt.
- source_word: τὴν ἄλλην
  choice: den folgenden
  rationale: Gemeint ist elliptisch der folgende Tag. „Den folgenden“ ist im Deutschen klarer als das wörtliche „den anderen“.
- source_word: ψευδοπροφήτης
  choice: falscher Prophet
  rationale: Die geläufige und sachlich genaue Wiedergabe der Bezeichnung für jemanden, der zu Unrecht als Prophet auftritt.
theological_decisions:
- issue: Auffällige Zeitregel im ersten Satz
  choice: Die Verneinung der vorliegenden griechischen Fassung wird im Haupttext beibehalten.
  alternative: „Er soll aber nur einen Tag bleiben“ oder „nicht länger als einen Tag“
  rationale: Diese Alternativen ergeben im Zusammenhang einen glatteren Sinn, setzen jedoch ein nicht im angegebenen Ausgangstext stehendes „nur“ beziehungsweise „länger als“ voraus. Die überlieferte Spannung wird daher nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, schlichtes und zugleich würdevolles Standarddeutsch. Die knappe, regelartige Satzfolge des Griechischen bleibt erhalten; die Ellipse bei „auch den folgenden [Tag]“ wird ohne unnötige Ergänzung verständlich wiedergegeben.
