id: DID.11.2
reference: Didache 11:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἐὰν δὲ αὐτὸς ὁ διδάσκων στραφεὶς διδάσκῃ ἄλλην διδαχὴν εἰς τὸ καταλῦσαι, μὴ αὐτοῦ ἀκούσητε· εἰς δὲ τὸ προσθεῖναι δικαιοσύνην καὶ γνῶσιν Κυρίου, δέξασθε αὐτὸν ὡς Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/002.yaml
  text: But if the teacher himself turns and teaches another teaching so as to overthrow[a], do not listen to him; but if it is to add righteousness and knowledge of the Lord, receive him as the Lord.
translation:
  language: de
  text: Wenn aber der Lehrer selbst sich abwendet und eine andere Lehre lehrt, um niederzureißen,[a] dann hört nicht auf ihn. Wenn es aber darum geht, Gerechtigkeit und Erkenntnis des Herrn hinzuzufügen, dann nehmt ihn auf wie den Herrn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um aufzuheben“ oder „um zu beseitigen“. Der griechische Text nennt nicht ausdrücklich, was aufgehoben wird.'
    reason: καταλῦσαι hat einen breiten Bedeutungsumfang und steht hier ohne genanntes Objekt.
  - marker: b
    text: 'Das heißt: Nehmt ihn so auf, wie ihr den Herrn aufnehmen würdet.'
    reason: Die knappe Wendung ὡς Κύριον kann im Deutschen missverstanden werden; die Fußnote erläutert den Vergleich, ohne ihn im Haupttext aufzulösen.
lexical_decisions:
- source_word: στραφεὶς
  choice: sich abwendet
  rationale: Das Partizip von στρέφω bezeichnet hier im Zusammenhang mit einer abweichenden Lehre eine Wendung beziehungsweise Abkehr; die deutsche Formulierung bleibt nah am Bild des Richtungswechsels.
- source_word: ἄλλην διδαχήν
  choice: eine andere Lehre
  rationale: Bewahrt die bewusste Wiederholung des griechischen Wortstamms in ὁ διδάσκων … διδάσκῃ … διδαχήν so weit, wie es in natürlichem Deutsch möglich ist.
- source_word: καταλῦσαι
  choice: niederzureißen
  rationale: καταλύω kann auflösen, beseitigen oder niederreißen bedeuten. Ohne ausdrücklich genanntes Objekt lässt „niederzureißen“ die Aussage ebenso offen wie der griechische Text.
- source_word: προσθεῖναι
  choice: hinzuzufügen
  rationale: Das transitive „hinzufügen“ gibt die Konstruktion mit δικαιοσύνην und γνῶσιν als direkten Objekten wieder und vermeidet die grammatisch weniger genaue Deutung „zur Gerechtigkeit hinzufügen“.
- source_word: γνῶσιν Κυρίου
  choice: Erkenntnis des Herrn
  rationale: 'Der Genitiv Κυρίου bleibt bewusst mehrdeutig: Er kann Erkenntnis über den Herrn oder vom Herrn her stammende Erkenntnis bezeichnen.'
- source_word: δέξασθε
  choice: nehmt ihn auf
  rationale: Im Kontext reisender Lehrer bezeichnet δέχομαι mehr als bloße Zustimmung, nämlich gastliche beziehungsweise gemeinschaftliche Aufnahme.
theological_decisions:
- issue: Nicht genanntes Objekt von καταλῦσαι
  choice: Kein Objekt ergänzt
  alternative: „um dies niederzureißen“ oder „um die Lehre aufzuheben“
  rationale: Der griechische Text nennt nicht ausdrücklich, was niedergerissen oder aufgehoben werden soll. Eine Ergänzung würde die genuine Offenheit des Satzes beseitigen.
- issue: Bedeutung von δικαιοσύνην καὶ γνῶσιν als Objekte von προσθεῖναι
  choice: „Gerechtigkeit und Erkenntnis des Herrn hinzuzufügen“
  alternative: „Gerechtigkeit und Erkenntnis des Herrn zu vermehren“
  rationale: Die gewählte Form gibt die transitive Grammatik direkt wieder. „Vermehren“ wäre idiomatischer, würde aber die Bildlichkeit von προστίθημι abschwächen.
- issue: Aufnahme des Lehrers „wie den Herrn“
  choice: Die starke Gleichsetzung der Art des Empfangs bleibt unverändert stehen
  alternative: „als wäre er der Herr“ oder „um des Herrn willen“
  rationale: ὡς Κύριον lautet wörtlich „wie den Herrn“. Der Text soll nicht durch eine erklärende theologisierende Umschreibung entschärft werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Wiederholung „Lehrer … lehrt … Lehre“ spiegelt bewusst die rhetorische Wortfamilie des Griechischen. Die syntaktische und theologische Offenheit bei καταλῦσαι und γνῶσιν Κυρίου bleibt erhalten.
