id: DID.11.8
reference: Didache 11:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ πᾶς δὲ ὁ λαλῶν ἐν πνεύματι προφήτης ἐστίν, ἀλλ' ἐὰν ἔχῃ τοὺς τρόπους Κυρίου. Ἀπὸ οὖν τῶν τρόπων γνωσθήσεται ὁ ψευδοπροφήτης καὶ ὁ προφήτης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/008.yaml
  text: Yet not everyone speaking in the Spirit is a prophet[a], but only if he has the ways of the Lord. Therefore, from their ways the false prophet and the prophet will be known.
translation:
  language: de
  text: Doch nicht jeder, der im Geist redet, ist ein Prophet, sondern nur, wenn er nach der Art des Herrn lebt.[a] An ihrer Lebensweise wird man also den falschen Propheten und den Propheten erkennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wenn er die Lebensart des Herrn hat«.'
    reason: Die Fußnote bewahrt die ungewöhnliche griechische Besitzkonstruktion, während der Haupttext ihren ethischen Sinn in natürlichem Deutsch ausdrückt.
lexical_decisions:
- source_word: λαλῶν ἐν πνεύματι
  choice: der im Geist redet
  rationale: Die knappe griechische Wendung bleibt erhalten, ohne genauer festzulegen, ob ekstatisches beziehungsweise geistgewirktes Reden oder ausdrücklich das Reden im Heiligen Geist gemeint ist.
- source_word: τοὺς τρόπους Κυρίου
  choice: nach der Art des Herrn lebt
  rationale: τρόποι bezeichnet hier Lebensart oder Verhalten. Die Formulierung gibt den ethischen Sinn natürlich wieder und vermeidet eine Verwechslung mit ὁδός, dem für die »zwei Wege« verwendeten Begriff.
- source_word: Ἀπὸ ... τῶν τρόπων
  choice: An ihrer Lebensweise
  rationale: Die Wiederaufnahme von τρόποι wird in idiomatischem Deutsch als erkennbares praktisches Verhalten ausgedrückt.
- source_word: ψευδοπροφήτης
  choice: der falsche Prophet
  rationale: Die transparente und etablierte deutsche Entsprechung bewahrt den ausdrücklichen Gegensatz zum echten Propheten.
theological_decisions:
- issue: Kriterium für die Anerkennung eines Propheten
  choice: Das Reden im Geist genügt nicht; entscheidend ist eine dem Herrn entsprechende Lebensweise.
  alternative: Die Wendung als Aussage verstehen, dass nur ein bereits eindeutig vom Heiligen Geist Redender am Verhalten geprüft werden müsse.
  rationale: Der griechische Satz stellt das geistliche Reden ausdrücklich einem ethischen Erkennungsmerkmal gegenüber, ohne das Wirken des Geistes näher zu definieren.
- issue: Bezug von τρόπους Κυρίου
  choice: Eine Lebensführung nach der Art des Herrn
  alternative: Die »Wege des Herrn« als feststehender Lehrbegriff
  rationale: τρόπος bezeichnet Verhalten oder Lebensart und ist vom in der Didache programmatisch gebrauchten ὁδός (»Weg«) zu unterscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Gedankens von τρόποι bleibt durch »Art« und »Lebensweise« erkennbar, ohne die im Deutschen schwerfällige Formulierung »Verhaltensweisen des Herrn haben« zu verwenden.
