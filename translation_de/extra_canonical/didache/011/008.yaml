  source_fidelity: 'Der Entwurf gibt die griechische Kontraststruktur zuverlässig wieder: Geist-inspiriertes Reden ist für sich kein hinreichendes Kennzeichen eines Propheten; maßgeblich ist eine dem Herrn entsprechende Lebensführung. »Art/Lebensweise« trifft τρόποι im ethischen Sinn und vermeidet zutreffend eine Gleichsetzung mit dem in der Didache prägenden ὁδός (»Weg«). »An ihrer Lebensweise« gibt die aus dem Kontext zu erschließende Zuordnung des Verhaltens zu den zu prüfenden Personen idiomatisch wieder.'
  naturalness: Der Text ist flüssiges, würdiges modernes Standarddeutsch. »Doch« und »also« passen zum argumentativen Zusammenhang. Die Formulierung »nur, wenn« ist eine natürliche Wiedergabe von ἀλλ᾽ ἐὰν und wahrt den konditionalen Charakter.
  terminology: »Im Geist redet«, »Prophet«, »falscher Prophet« und »Herr« sind sachgerecht und registerangemessen. Die Fußnote erläutert sinnvoll die im Deutschen weniger natürliche Besitzkonstruktion von »die τρόποι des Herrn haben«, ohne eine theologische Deutung festzulegen.
