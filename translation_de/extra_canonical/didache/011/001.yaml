id: DID.11.1
reference: Didache 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς ἂν οὖν ἐλθὼν διδάξῃ ὑμᾶς ταῦτα πάντα, τὰ προειρημένα, δέξασθε αὐτόν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/001.yaml
  text: Therefore, whoever comes and teaches you all these things that have been said before, receive him.
translation:
  language: de
  text: Wer also kommt und euch all dies lehrt, was zuvor gesagt wurde, den nehmt auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Wer
  rationale: Die offene, verallgemeinernde Relativkonstruktion wird im Deutschen natürlich mit „Wer“ wiedergegeben.
- source_word: οὖν
  choice: also
  rationale: Bewahrt den folgernden Anschluss an den vorausgehenden Abschnitt.
- source_word: ἐλθὼν
  choice: zu euch kommt
  rationale: Das Partizip wird als koordinierter Bestandteil der deutschen Relativkonstruktion ausgedrückt; „zu euch“ macht die im Kontext liegende Zielrichtung natürlich verständlich.
- source_word: διδάξῃ ὑμᾶς
  choice: euch … lehrt
  rationale: Gibt Verb und Objekt direkt und in modernem Standarddeutsch wieder.
- source_word: ταῦτα πάντα, τὰ προειρημένα
  choice: alles …, was zuvor gesagt worden ist
  rationale: Erhält sowohl den umfassenden Sinn von πάντα als auch den Rückverweis von προειρημένα, ohne die im Griechischen appositionale Form unnatürlich nachzuahmen.
- source_word: δέξασθε αὐτόν
  choice: den nehmt auf
  rationale: „Aufnehmen“ bewahrt den Sinn des Empfangens beziehungsweise gastlichen Annehmens einer kommenden Person; „den“ nimmt das einleitende „Wer“ idiomatisch wieder auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber idiomatisch als deutsche Wer-den-Konstruktion formuliert.
