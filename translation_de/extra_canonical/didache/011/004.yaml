  yaml_path: translation/extra_canonical/didache/011/004.yaml
  text: Let every apostle who comes to you be received as the Lord.
translation:
  language: de
  text: Jeder Apostel, der zu euch kommt, soll aufgenommen werden wie der Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς δὲ ἀπόστολος
  choice: Jeder Apostel
  rationale: Πᾶς mit einem singularischen Substantiv wird natürlich mit „jeder“ wiedergegeben; δέ markiert hier einen leichten Übergang, der im Deutschen nicht eigens ausgedrückt werden muss.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: der zu euch kommt
  rationale: Die attributive Partizipialkonstruktion wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: δεχθήτω
  choice: soll aufgenommen werden
  rationale: Der Imperativ Aorist Passiv fordert die Gemeinschaft zur Aufnahme auf; die deutsche Soll-Konstruktion bewahrt den regelhaften, anweisenden Ton.
- source_word: ὡς Κύριος
  choice: wie der Herr
  rationale: Die knappe Vergleichsformulierung bleibt erhalten. „Herr“ gibt Κύριος im frühchristlichen Sprachgebrauch angemessen wieder, ohne den Vergleich näher auszudeuten.
theological_decisions:
- issue: Bedeutung des Vergleichs „wie der Herr“
  choice: Die Formulierung wird wörtlich und ohne Zusatz beibehalten.
  alternative: „als wäre er der Herr“ oder „so, wie ihr den Herrn aufnehmen würdet“
  rationale: Der griechische Text lässt offen, ob Identifikation, Repräsentation oder die Art der gastlichen Aufnahme im Vordergrund steht. Eine erklärende Erweiterung würde diese Spannung unnötig auflösen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe normgebende Form des griechischen Satzes bleibt erhalten.
