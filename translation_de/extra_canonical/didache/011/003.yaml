  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τῶν ἀποστόλων καὶ προφητῶν κατὰ τὸ δόγμα τοῦ εὐαγγελίου, οὕτω ποιήσατε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/003.yaml
  text: Concerning the apostles and prophets, according to the rule of the gospel, do thus.
translation:
  language: de
  text: 'Was aber die Apostel und Propheten betrifft, so handelt nach der Regel des Evangeliums folgendermaßen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Was aber … betrifft
  rationale: Gibt den Themenwechsel mit δέ natürlich wieder, ohne ein im Griechischen nicht vorhandenes zeitliches »nun« einzuführen.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: die Apostel und Propheten
  rationale: Direkte und im Deutschen geläufige Wiedergabe der beiden Personengruppen.
- source_word: κατὰ τὸ δόγμα τοῦ εὐαγγελίου
  choice: nach der Weisung des Evangeliums
  rationale: δόγμα bezeichnet hier eine maßgebliche Lehre, Vorgabe oder Regel. »Weisung« wahrt diesen normativen Sinn und klingt im Deutschen natürlicher als »Dogma« oder »Verordnung«.
- source_word: οὕτω ποιήσατε
  choice: so verfahrt … folgendermaßen
  rationale: Das idiomatische »verfahrt … folgendermaßen« gibt den knappen Imperativ wieder und leitet passend zu den anschließenden Anweisungen über.
theological_decisions:
- issue: Bedeutung von δόγμα τοῦ εὐαγγελίου
  choice: Weisung des Evangeliums
  alternative: Regel des Evangeliums
  rationale: »Weisung« lässt offen, ob eine einzelne konkrete Vorschrift oder die maßgebliche evangelische Lehre insgesamt gemeint ist, und vermeidet spätere konfessionelle Konnotationen von »Dogma«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist als Überschrift beziehungsweise Übergang zu den folgenden praktischen Anweisungen formuliert; der Doppelpunkt macht diese Funktion sichtbar, ohne zusätzliche inhaltliche Aussage einzuführen.
