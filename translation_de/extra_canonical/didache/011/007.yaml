id: DID.11.7
reference: Didache 11:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πάντα προφήτην λαλοῦντα ἐν πνεύματι οὐ πειράσετε οὐδὲ διακρινεῖτε· πᾶσα γὰρ ἁμαρτία ἀφεθήσεται, αὕτη δὲ ἡ ἁμαρτία οὐκ ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/007.yaml
  text: And you shall not test or judge any prophet speaking in the Spirit; for every sin will be forgiven[a], but this sin will not be forgiven.
translation:
  language: de
  text: Und keinen Propheten, der im Geist redet, sollt ihr auf die Probe stellen oder beurteilen; denn jede Sünde wird vergeben werden, diese Sünde aber wird nicht vergeben werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα προφήτην … οὐ
  choice: keinen Propheten
  rationale: Die Verbindung von πᾶς mit den verneinten Verben hat hier den Sinn „keinen“, nicht „nicht jeden“. So wird der Geltungsbereich der Verneinung im Deutschen eindeutig wiedergegeben.
- source_word: λαλοῦντα ἐν πνεύματι
  choice: der im Geist redet
  rationale: Die Formulierung bleibt nah am griechischen Ausdruck und bewahrt dessen religiöse Aussage, ohne genauer festzulegen, wie das Reden durch den Geist geschieht.
- source_word: πειράσετε
  choice: sollt ihr auf die Probe stellen
  rationale: πειράζω bezeichnet hier das Erproben oder Testen. Die futurische Form hat im Zusammenhang gebietende beziehungsweise verbietende Kraft.
- source_word: διακρινεῖτε
  choice: beurteilen
  rationale: διακρίνω kann unterscheiden, prüfen oder ein Urteil fällen bedeuten. „Beurteilen“ passt zur Warnung, über den im Geist redenden Propheten ein prüfendes Urteil zu fällen, ohne die stärkere Bedeutung „verurteilen“ einzutragen.
- source_word: ἀφεθήσεται
  choice: wird vergeben werden
  rationale: Das Passiv wird beibehalten und entspricht der üblichen religiösen Ausdrucksweise, bei der Gott als Handelnder unausgesprochen bleibt.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: Geist mit Großschreibung
  alternative: Geist mit Kleinschreibung beziehungsweise „in einem Geistzustand“
  rationale: Im Zusammenhang mit prophetischem Reden bezeichnet ἐν πνεύματι am wahrscheinlichsten den göttlichen Geist. Die knappe Formulierung „im Geist“ vermeidet dennoch eine weitergehende dogmatische Ausdeutung.
- issue: Bezug von „diese Sünde“
  choice: Die anaphorische Formulierung bleibt unverändert stehen
  alternative: Ausdrückliche Ergänzung „die Sünde, einen solchen Propheten zu prüfen“
  rationale: Das Griechische nennt lediglich „diese Sünde“. Die Übersetzung bewahrt diese Bezugsoffenheit, statt die Aussage erklärend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Verbotsform wird natürlich wiedergegeben; das Semikolon erhält den engen Begründungszusammenhang des griechischen Satzes.
