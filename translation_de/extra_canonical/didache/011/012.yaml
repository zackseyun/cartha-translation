  naturalness: Die Sprache ist insgesamt modernes, verständliches Standarddeutsch. »Über ihn urteilen« ist hier idiomatisch und wahrt die offenere Bedeutung des griechischen Verbs.
  terminology: »im Geist«, »Geld«, »Mangel leiden« und die Wiedergabe der Aufforderung zu Gaben für Bedürftige sind angemessen. Für κρίνειν sollte kein terminus gewählt werden, der bereits einen Schuldspruch oder eine Verurteilung voraussetzt.
