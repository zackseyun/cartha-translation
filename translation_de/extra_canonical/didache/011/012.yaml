id: DID.11.12
reference: Didache 11:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς δ᾽ ἂν εἴπῃ ἐν πνεύματι· Δός μοι ἀργύρια ἢ ἕτερά τινα, οὐκ ἀκούσεσθε αὐτοῦ· ἐὰν δὲ περὶ ἄλλων ὑστερούντων εἴπῃ δοῦναι, μηδεὶς αὐτὸν κρινέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/012.yaml
  text: But whoever says in the Spirit[a], “Give me money or something else,” you shall not listen to him. But if he tells you to give for others who are in need, let no one judge him.
translation:
  language: de
  text: 'Wer aber im Geist sagt: »Gebt mir Geld oder etwas anderes«, auf den sollt ihr nicht hören. Wenn er aber sagt, man solle für andere geben, die Mangel leiden, soll niemand über ihn urteilen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Bewahrt die knappe, religiös geprägte Formulierung des Griechischen, ohne ausdrücklich festzulegen, ob der Geist Gottes oder ein prophetischer Zustand gemeint ist.
- source_word: ἀργύρια
  choice: Geld
  rationale: Im Kontext bezeichnet der Plural Silberstücke beziehungsweise Geld; »Geld« ist im modernen Deutschen die natürliche Entsprechung.
- source_word: ἕτερά τινα
  choice: etwas anderes
  rationale: Die Wendung gehört als weiteres Objekt zu »Gebt mir« und bezeichnet andere verlangte Dinge neben Geld.
- source_word: οὐκ ἀκούσεσθε αὐτοῦ
  choice: auf den sollt ihr nicht hören
  rationale: 'Gibt die idiomatische Bedeutung wieder: Seiner Aufforderung beziehungsweise Autorität soll nicht Folge geleistet werden.'
- source_word: ὑστερούντων
  choice: die Mangel leiden
  rationale: Bewahrt den Sinn tatsächlicher Bedürftigkeit, ohne ihn auf eine bestimmte Art materieller Not zu verengen.
- source_word: κρινέτω
  choice: verurteilen
  rationale: Im Zusammenhang ist ein negatives Urteil gemeint; »verurteilen« gibt dies natürlicher und deutlicher wieder als das mehrdeutige »richten«.
theological_decisions:
- issue: Bedeutung von »im Geist«
  choice: Die Wendung bleibt unverändert als »im Geist« stehen.
  alternative: »unter Eingebung des Geistes« oder »im prophetischen Reden«
  rationale: Der griechische Text lässt offen, wie genau das geistgewirkte beziehungsweise prophetische Sprechen verstanden wird; eine erklärende Wiedergabe würde diese Spannung vorschnell auflösen.
- issue: Bezug der Bitte um Geld oder andere Dinge
  choice: Beides steht innerhalb der direkten Rede und ist als Bitte für den Sprecher formuliert.
  alternative: »Gebt mir Geld«, oder etwas anderes sagt
  rationale: Die Syntax verbindet ἀργύρια und ἕτερά τινα als parallele Objekte von Δός; die folgende Ausnahme betrifft dagegen ausdrücklich Gaben für andere Bedürftige.
- issue: Beurteilung des Propheten bei einer Sammlung für Bedürftige
  choice: »soll ihn niemand verurteilen«
  alternative: »soll ihn niemand prüfen/beurteilen«
  rationale: Der Satz untersagt hier ein negatives Urteil über eine Aufforderung zugunsten anderer, ohne damit allgemeine Unprüfbarkeit prophetischer Rede zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom singularischen griechischen Imperativ Δός zur deutschen Pluralform »Gebt« entspricht der ausdrücklich pluralisch angesprochenen Gemeinschaft in »sollt ihr«. Die beiden adversativen Satzanschlüsse werden schlicht mit »aber« wiedergegeben.
