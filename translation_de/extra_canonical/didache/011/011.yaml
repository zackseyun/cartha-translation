review_pass:
  verdict: revise
  source_fidelity: Eine sichere Korrektur ist angezeigt. δεδοκιμασμένος bezeichnet primär einen geprüften bzw. als bewährt erwiesenen Propheten, nicht einen, der sich selbst „bewährt hat“. Bei ποιῶν ist „vollzieht“ dem konkreten Tun näher als das sehr allgemeine „handelt“. Die schwierige Wortgruppe εἰς μυστήριον κοσμικὸν ἐκκλησίας bleibt in ihrer Referenz unsicher; „weltliches Geheimnis“ gibt κοσμικόν zwar grundsätzlich wieder, kann im heutigen Deutsch aber irreführend nach profan/säkular klingen. „weltbezogen“ wahrt die kosmisch-weltliche Komponente ohne diese unnötige Engführung. Die Zukunftsform οὐ κριθήσεται ist als Verbot im Kontext angemessen mit „darf ... nicht beurteilt werden“ wiederzugeben.
  naturalness: Der Satz ist im Deutschen gut verständlich. Die Reihung „der sich bewährt hat und echt ist und ... handelt“ wirkt jedoch schwerfällig. Die attributive Fassung „jeder geprüfte und echte Prophet“ ist moderner und näher an der griechischen Partizip-/Adjektivfolge. „Propheten der alten Zeit“ ist natürlich und treffend.
  terminology: „Gemeinde“ für ἐκκλησία ist vertretbar. „Geheimnis“ bewahrt μυστήριον, ohne eine sakramentale oder sonstige konkrete Deutung vorwegzunehmen. „Echt“ ist für ἀληθινός möglich; in Verbindung mit „geprüft“ ist es hier ausreichend. Die Fußnote soll ausdrücklich festhalten, dass auch die genaue syntaktische Beziehung von εἰς sowie des Genitivs ἐκκλησίας unsicher ist.
  issues:
  - severity: medium
    issue: „der sich bewährt hat“ gibt δεδοκιμασμένος ungenau wieder.
    rationale: Das Perfektpartizip Passiv verweist auf Prüfung/Erprobung und deren bestätigtes Ergebnis. Die reflexive deutsche Formulierung kann nahelegen, der Prophet habe sich selbst bewährt, statt als geprüft erwiesen worden zu sein.
  - severity: medium
    issue: „im Blick auf ein weltliches Geheimnis der Gemeinde handelt“ ist bei ποιῶν und κοσμικόν zu interpretierend bzw. missverständlich.
    rationale: ποιῶν bezeichnet zunächst ein Tun bzw. Vollziehen. „Weltlich“ wird heute überwiegend als profan oder säkular verstanden und kann daher eine nicht gesicherte Konnotation eintragen. Die griechische Formel ist allerdings tatsächlich dunkel und muss durch eine Fußnote abgesichert bleiben.
  - severity: low
    issue: „soll von euch nicht beurteilt werden“ ist weniger präzise als eine ausdrückliche Verbotsform.
    rationale: 'Im paränetischen Kontext ist die Zukunft οὐ κριθήσεται sachgerecht als an die Gemeinde gerichtetes Verbot wiederzugeben: „darf ... nicht beurteilt werden“.'
