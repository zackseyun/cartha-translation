revisions:
- from: Jeder Prophet aber, der sich bewährt hat und echt ist und im Blick auf ein weltliches Geheimnis der Gemeinde handelt,[a] dabei jedoch nicht lehrt, das zu tun, was er selbst tut, soll von euch nicht beurteilt werden; denn sein Urteil liegt bei Gott. Ebenso handelten nämlich auch die Propheten der alten Zeit.
  to: Jeder geprüfte und echte Prophet, der im Hinblick auf ein weltbezogenes Geheimnis der Gemeinde etwas vollzieht,[a] aber nicht lehrt, das zu tun, was er selbst tut, darf von euch nicht beurteilt werden; denn das Urteil über ihn liegt bei Gott. Denn ebenso taten auch die Propheten der alten Zeit.
  rationale: Die Revision stellt die passive Prüfung in δεδοκιμασμένος klar, bildet ποιῶν konkreter ab und vermeidet bei κοσμικόν die im modernen Deutsch leicht irreführende säkulare Konnotation von „weltlich“. Die zentrale, umstrittene Formulierung wird weiterhin bewusst nicht dogmatisch oder historisch spezifiziert. Die Fußnotenmarke bleibt unmittelbar an der schwierigen Wortgruppe verankert.
