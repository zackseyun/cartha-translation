id: DID.11.11
reference: Didache 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης δεδοκιμασμένος, ἀληθινός, ποιῶν εἰς μυστήριον κοσμικὸν ἐκκλησίας, μὴ διδάσκων δὲ ποιεῖν ὅσα αὐτὸς ποιεῖ, οὐ κριθήσεται ἐφ᾽ ὑμῶν· μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν· ὡσαύτως γὰρ ἐποίησαν καὶ οἱ ἀρχαῖοι προφῆται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/011.yaml
  text: But every prophet who has been tested, genuine, doing for an earthly mystery of the church, yet not teaching others to do what he himself does, will not be judged by you; for he has his judgment with God. For in the same way the ancient prophets also did.
translation:
  language: de
  text: Jeder geprüfte und echte Prophet, der im Hinblick auf ein weltbezogenes Geheimnis der Gemeinde etwas vollzieht,[a] aber nicht lehrt, das zu tun, was er selbst tut, darf von euch nicht beurteilt werden; denn das Urteil über ihn liegt bei Gott. Denn ebenso taten auch die Propheten der alten Zeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „der für/auf ein weltbezogenes Geheimnis der Gemeinde hin handelt/tut“. Die griechische Wendung ist in Syntax und Bedeutung unsicher; möglicherweise ist eine prophetische Zeichenhandlung gemeint.'
    reason: Die Fußnote kennzeichnet die Unsicherheit von εἰς μυστήριον κοσμικὸν ἐκκλησίας und nennt eine mögliche, aber nicht in den Haupttext eingetragene Deutung.
lexical_decisions:
- source_word: δεδοκιμασμένος
  choice: der sich bewährt hat
  rationale: Das Perfektpartizip bezeichnet einen Propheten, der geprüft wurde und als bewährt gilt; die Formulierung gibt sowohl die vorausgegangene Prüfung als auch ihr fortwirkendes Ergebnis wieder.
- source_word: ἀληθινός
  choice: echt
  rationale: Im Zusammenhang kennzeichnet das Wort den Propheten als authentisch beziehungsweise wahrhaftig, nicht primär eine einzelne Aussage als wahr.
- source_word: ποιῶν
  choice: handelt
  rationale: Das allgemeine ποιεῖν wird hier idiomatisch mit „handeln“ wiedergegeben, ohne die schwer verständliche Ergänzung εἰς μυστήριον κοσμικὸν ἐκκλησίας vorschnell auszudeuten.
- source_word: μυστήριον κοσμικὸν ἐκκλησίας
  choice: weltliches Geheimnis der Gemeinde
  rationale: Die ungewöhnliche und textlich schwierige Wortfolge wird eng am überlieferten griechischen Text belassen; „weltlich“ wahrt die naheliegende Bedeutung von κοσμικόν, während der Genitiv „der Gemeinde“ die syntaktische Zuordnung offenhält.
- source_word: οὐ κριθήσεται ἐφ᾽ ὑμῶν
  choice: soll von euch nicht beurteilt werden
  rationale: Die passive Konstruktion mit ἐπί und Genitiv bezeichnet hier das Urteilen seitens der Angesprochenen. „Soll … nicht“ gibt den normativen Sinn natürlicher wieder als ein bloß zukünftiges „wird nicht“.
- source_word: μετὰ Θεοῦ ... ἔχει τὴν κρίσιν
  choice: sein Urteil liegt bei Gott
  rationale: Diese idiomatische Fassung bewahrt, dass die Sache beziehungsweise Beurteilung Gott zukommt, ohne genauer festzulegen, ob κρίσις Gericht, Urteil oder Rechenschaft meint.
- source_word: οἱ ἀρχαῖοι προφῆται
  choice: die Propheten der alten Zeit
  rationale: Die Wendung bezeichnet die früheren beziehungsweise alten Propheten und wird in natürlichem modernem Deutsch wiedergegeben.
theological_decisions:
- issue: Bedeutung des „weltlichen Geheimnisses der Gemeinde“
  choice: Die rätselhafte Formulierung wird im Haupttext nicht auf eine bestimmte symbolische oder sakramentale Handlung festgelegt.
  alternative: Deutung als sinnbildliche Darstellung der Kirche, insbesondere im Zusammenhang mit Ehe oder einem prophetischen Zeichenakt.
  rationale: Der überlieferte griechische Wortlaut ist ungewöhnlich und seine konkrete Referenz umstritten. Eine eindeutige Auslegung würde mehr festlegen, als die Quelle sicher erkennen lässt.
- issue: Grenzen menschlicher Beurteilung eines Propheten
  choice: Der Satz wird als Verbot verstanden, den beschriebenen bewährten und echten Propheten wegen dieses besonderen Handelns zu beurteilen.
  alternative: Ein allgemeines Verbot jeglicher Prüfung oder Beurteilung von Propheten.
  rationale: Der Kontext setzt ausdrücklich voraus, dass der Prophet bereits geprüft und als echt erkannt wurde; daher darf der Vers nicht gegen die zuvor geforderte Prüfung von Propheten verallgemeinert werden.
- issue: „sein Urteil liegt bei Gott“
  choice: Die Formulierung wahrt Gottes Zuständigkeit für das Urteil, ohne den Ausgang dieses Urteils festzulegen.
  alternative: „Er wird von Gott gerichtet“ oder „Gott wird ihn rechtfertigen“.
  rationale: μετὰ Θεοῦ ἔχει τὴν κρίσιν benennt die Beziehung des Urteils zu Gott, sagt aber nicht eindeutig, ob Verurteilung, Rechtfertigung oder Rechenschaft gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer verständliche Kernwendung bleibt bewusst quellennah und wird durch eine knappe textkritisch-exegetische Fußnote erläutert. Der partizipienreiche griechische Satz wurde moderat gegliedert, ohne seine Argumentationsfolge zu verändern.
