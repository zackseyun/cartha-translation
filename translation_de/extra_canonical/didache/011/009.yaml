id: DID.11.9
reference: Didache 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πᾶς προφήτης ὁρίζων τράπεζαν ἐν πνεύματι, οὐ φάγεται ἀπ᾽ αὐτῆς, εἰδὲ μήγε ψευδοπροφήτης ἐστί·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/009.yaml
  text: And every prophet who sets a table in the Spirit shall not eat from it[a]; otherwise he is a false prophet.
translation:
  language: de
  text: Und jeder Prophet, der im Geist ein Mahl anordnet, soll nicht davon essen[a]; sonst ist er ein falscher Prophet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der im Geist einen Tisch bestimmt, soll nicht von ihm essen“. Gemeint sein kann, dass er die Bereitstellung einer Mahlzeit anordnet.'
    reason: Die Verbindung ὁρίζων τράπεζαν ist ungewöhnlich; die Fußnote bewahrt die formale Bildlichkeit und macht zugleich die wahrscheinliche metonymische Bedeutung sichtbar.
lexical_decisions:
- source_word: ὁρίζων τράπεζαν
  choice: ein Mahl anordnet
  rationale: ὁρίζων bezeichnet hier ein Bestimmen oder Anordnen; τράπεζα steht metonymisch für die aufgetragene Mahlzeit. Die Wiedergabe vermeidet das im Deutschen missverständliche Bild, der Prophet stelle eigenhändig einen Tisch auf oder decke ihn.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Die knappe Formulierung bewahrt die mögliche Bedeutung prophetischen Redens oder Handelns unter geistgewirkter Eingebung, ohne sie näher festzulegen.
- source_word: οὐ φάγεται ἀπ᾽ αὐτῆς
  choice: soll nicht davon essen
  rationale: Das griechische Futur hat hier regelnden beziehungsweise normativen Sinn; „davon“ bezieht sich natürlich auf das angeordnete Mahl.
- source_word: ψευδοπροφήτης
  choice: falscher Prophet
  rationale: Dies ist die geläufige und sachlich genaue deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung von „im Geist“
  choice: im Geist
  alternative: unter Eingebung des Geistes
  rationale: Die wörtlichere Form lässt offen, wie genau das prophetische Handeln zum Geist in Beziehung steht, und vermeidet eine dogmatische Präzisierung.
- issue: Kriterium zur Erkennung eines falschen Propheten
  choice: sonst ist er ein falscher Prophet
  alternative: wenn aber doch, ist er ein falscher Prophet
  rationale: 'Die konditionale Folgerung εἰ δὲ μήγε wird knapp und idiomatisch wiedergegeben: Isst der Prophet entgegen der Regel selbst davon, erweist er sich als falscher Prophet.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mahl“ ist etwas gehobener als „Essen“, bleibt aber allgemein verständlich und passt zum frühchristlichen Weisungskontext.
