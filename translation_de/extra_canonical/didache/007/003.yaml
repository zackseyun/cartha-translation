  source_fidelity: 'Die Wiedergabe folgt dem griechischen Satzbau und Inhalt insgesamt sehr genau: konditionale Anweisung, dreimaliges Ausgießen von Wasser auf den Kopf und die Namensformel sind vollständig wiedergegeben. ἀμφότερα bezieht sich im unmittelbaren Kontext auf kaltes und warmes Wasser. „beides nicht hast“ kann im Deutschen jedoch auch bedeuten, dass nur eine der beiden Möglichkeiten fehlt, während der Kontext und die übliche Sinnführung hier das Fehlen beider Möglichkeiten meinen.'
  naturalness: Der Text ist modernes, klares Standarddeutsch. „Wenn du aber keines von beiden hast“ ist idiomatischer und semantisch eindeutiger als „Wenn du aber beides nicht hast“. Die imperativische Form „gieße“ und „im Namen des Vaters und des Sohnes und des Heiligen Geistes“ sind natürlich und registergerecht.
