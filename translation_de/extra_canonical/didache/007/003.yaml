id: DID.7.3
reference: Didache 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ ἀμφότερα μὴ ἔχῃς, ἔκχεον εἰς τὴν κεφαλὴν τρὶς ὕδωρ εἰς ὄνομα Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/003.yaml
  text: But if you do not have either[a], pour water on the head three times in the name of the Father and of the Son and of the Holy Spirit.
translation:
  language: de
  text: Wenn du aber keines von beiden hast,[a] gieße dreimal Wasser auf den Kopf im Namen des Vaters und des Sohnes und des Heiligen Geistes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind kaltes und warmes Wasser; siehe 7,2.
    reason: Das Pronomen „keines von beiden“ verweist auf die zwei im unmittelbaren Kontext genannten Arten von Wasser.
lexical_decisions:
- source_word: ἀμφότερα
  choice: beides
  rationale: Das Neutrum Plural greift die beiden unmittelbar zuvor genannten Möglichkeiten auf, kaltes und warmes Wasser.
- source_word: ἔκχεον
  choice: gieße
  rationale: Der Imperativ bezeichnet hier das Ausgießen von Wasser; „gieße“ ist im Deutschen natürlich und sachlich genau.
- source_word: τρὶς
  choice: dreimal
  rationale: Gibt die ausdrücklich angeordnete dreifache Ausführung unmittelbar wieder.
- source_word: εἰς τὴν κεφαλήν
  choice: auf den Kopf
  rationale: Entspricht der räumlichen Zielangabe des Griechischen und ist im Deutschen idiomatisch.
- source_word: εἰς ὄνομα
  choice: im Namen
  rationale: Die im Deutschen feste und natürliche Formel gibt die Bedeutung im Taufkontext angemessen wieder, ohne das griechische εἰς unnatürlich mit „in den Namen hinein“ abzubilden.
theological_decisions:
- issue: Bestimmtheit von Vater, Sohn und Heiligem Geist trotz fehlender griechischer Artikel
  choice: des Vaters und des Sohnes und des Heiligen Geistes
  alternative: von Vater und Sohn und Heiligem Geist
  rationale: Die artikellosen Genitive in dieser Namensformel sind nicht unbestimmt. Die wiederholten deutschen Artikel bringen die gemeinte Bestimmtheit klar und würdig zum Ausdruck.
- issue: Wiedergabe der Taufformel εἰς ὄνομα
  choice: im Namen
  alternative: auf den Namen
  rationale: „Im Namen“ ist die natürliche deutsche Formulierung für die hier beschriebene Handlung. „Auf den Namen“ wäre näher an der Präposition εἰς, könnte im heutigen Deutsch jedoch eine zusätzliche Deutung der Formel nahelegen, die der Satz nicht ausdrücklich entfaltet.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem liturgischem Klang. Die Satzstruktur bleibt knapp und handlungsorientiert wie im Griechischen.
