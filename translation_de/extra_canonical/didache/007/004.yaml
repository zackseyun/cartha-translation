id: DID.7.4
reference: Didache 7:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ δὲ τοῦ βαπτίσματος προνηστευσάτω ὁ βαπτίζων καὶ ὁ βαπτιζόμενος καὶ εἴ τινες ἄλλοι δύνανται· κελεύσεις δὲ νηστεῦσαι τὸν βαπτιζόμενον πρὸ μιᾶς ἢ δύο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/004.yaml
  text: But before the baptism, let the one baptizing and the one being baptized fast beforehand, and any others who are able; and you shall command the one being baptized to fast one or two days beforehand.
translation:
  language: de
  text: Vor der Taufe sollen die Person, die tauft, und der Täufling vorher fasten, ebenso weitere Personen, soweit sie dazu in der Lage sind. Dem Täufling sollst du aber gebieten, einen oder zwei Tage vorher zu fasten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ βαπτίζων
  choice: der Taufende
  rationale: Gibt das substantivierte Partizip präzise und ohne Festlegung auf ein kirchliches Amt wieder.
- source_word: ὁ βαπτιζόμενος / τὸν βαπτιζόμενον
  choice: der Täufling / dem Täufling
  rationale: Natürliches, prägnantes Deutsch für die Person, die getauft wird; das Geschlecht bleibt wie im generischen griechischen Ausdruck unbestimmt.
- source_word: προνηστευσάτω
  choice: sollen … vorher fasten
  rationale: Bewahrt den auffordernden Charakter und den zeitlichen Sinn des Präfixes προ- in idiomatischem Deutsch.
- source_word: εἴ τινες ἄλλοι δύνανται
  choice: ebenso alle anderen, die es können
  rationale: Gibt die bedingte Einbeziehung weiterer dazu fähiger Personen natürlich wieder.
- source_word: κελεύσεις
  choice: sollst du … gebieten
  rationale: Bewahrt die direkte Anrede im Singular und die stärkere Verbindlichkeit von κελεύω.
- source_word: πρὸ μιᾶς ἢ δύο
  choice: einen oder zwei Tage vorher
  rationale: Das im Griechischen ausgelassene ἡμερῶν ist aus dem Zusammenhang zu ergänzen; die Zeitangabe wird im Deutschen idiomatisch formuliert.
theological_decisions:
- issue: Status des Taufenden
  choice: der Taufende
  alternative: der Täufer
  rationale: Die partizipiale Form vermeidet die unbelegte Annahme eines besonderen Amtes oder Titels.
- issue: Reichweite der Fastenanweisung
  choice: Taufender und Täufling sollen fasten; weitere Personen werden nach Möglichkeit einbezogen
  alternative: Eine allgemeine Verpflichtung der ganzen Gemeinde
  rationale: Der Wortlaut nennt die beiden unmittelbar Beteiligten und nur bedingt weitere dazu fähige Personen.
- issue: Stärke der Anweisung an den Täufling
  choice: gebieten
  alternative: auffordern
  rationale: κελεύω bezeichnet hier eine ausdrückliche Anordnung; eine bloße Empfehlung wäre zu schwach.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Singularanrede wird bewahrt. Der erste griechische Imperativ wird als deutsche Soll-Konstruktion wiedergegeben, um die Aufzählung flüssig und normativ auszudrücken; der zweite Satz erhält mit „gebieten“ bewusst den stärkeren Anordnungscharakter.
