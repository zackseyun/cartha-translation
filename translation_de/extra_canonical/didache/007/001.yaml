source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ βαπτίσματος, οὕτω βαπτίσατε· ταῦτα πάντα προειπόντες, βαπτίσατε εἰς τὸ ὄνομα τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ ἁγίου Πνεύματος ἐν ὕδατι ζῶντι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/001.yaml
  text: 'Concerning baptism, baptize in this way: Having first said all these things, baptize into the name of the Father and of the Son and of the Holy Spirit in living water.'
translation:
  language: de
  text: 'Was aber die Taufe betrifft, so tauft auf diese Weise: Nachdem ihr dies alles zuvor gesagt habt,[a] tauft auf den Namen des Vaters und des Sohnes und des Heiligen Geistes in lebendigem Wasser.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem ihr dies alles zuvor mitgeteilt habt“ oder „Nachdem ihr dies alles zuvor gelehrt habt“.'
    reason: προειπόντες bezeichnet hier das vorherige Sagen beziehungsweise Vermitteln der vorangehenden Unterweisung; eine Deutung als Zukunftsvorhersage ist in diesem Kontext nicht angezeigt.
  - marker: b
    text: „Lebendiges Wasser“ bezeichnet hier wahrscheinlich fließendes oder quellendes Wasser.
    reason: Der antike Ausdruck ὕδωρ ζῶν ist für heutige Leser ohne Erläuterung leicht missverständlich.
lexical_decisions:
- source_word: βαπτίσματος / βαπτίσατε
  choice: Taufe / tauft
  rationale: Die geläufigen deutschen Begriffe geben sowohl das Thema als auch den wiederholten Imperativ natürlich und traditionsübergreifend wieder.
- source_word: ταῦτα πάντα προειπόντες
  choice: Nachdem ihr dies alles zuvor gesagt habt
  rationale: προειπόντες bezeichnet hier ein vorheriges Sagen oder Mitteilen; „verkündigt“ würde einen im griechischen Verb nicht zwingend enthaltenen Predigtton eintragen.
- source_word: εἰς τὸ ὄνομα
  choice: auf den Namen
  rationale: Die im Deutschen etablierte Taufformel gibt die Ziel- und Zuordnungsrichtung von εἰς idiomatisch wieder; eine wörtlichere Formulierung „in den Namen hinein“ wäre unnatürlich.
- source_word: ὕδατι ζῶντι
  choice: lebendigem Wasser
  rationale: Die formnahe Wiedergabe bewahrt den antiken Ausdruck, der fließendes beziehungsweise quellendes Wasser bezeichnet.
theological_decisions:
- issue: Trinitarische Taufformel
  choice: des Vaters und des Sohnes und des Heiligen Geistes
  alternative: des Vaters, des Sohnes und des Heiligen Geistes
  rationale: Die wiederholte Konjunktion des griechischen Textes wird bewahrt, ohne die Beziehung der drei Genannten näher auszudeuten.
- issue: Bedeutung der Präposition εἰς in der Taufformel
  choice: auf den Namen
  alternative: in den Namen hinein
  rationale: „Auf den Namen“ ist im modernen Deutschen die natürliche sakrale Formel und wahrt die Zuordnung, ohne aus der Präposition eine zusätzliche dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede wird als Plural wiedergegeben, entsprechend den griechischen Imperativen und dem Partizip. Die leicht formelhafte Wiederholung von „tauft“ sowie der Konjunktionen bleibt erhalten.
