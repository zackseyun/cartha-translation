  source_fidelity: Die Übersetzung gibt die Konditionalstruktur und die praktischen Alternativen des griechischen Textes präzise wieder. »Fließendes Wasser« trifft ὕδωρ ζῶν im Sachkontext als natürliches/rinnendes Wasser angemessen. »Taufe in anderem Wasser« bewahrt die neutrale Aussage zu εἰς ἄλλο ὕδωρ, ohne eine bestimmte Taufweise festzulegen. Die Ellipse in ἐν ψυχρῷ … ἐν θερμῷ wird verständlich und sinngemäß durch »in kaltem Wasser … in warmem« wiedergegeben.
  naturalness: Modernes, gut verständliches und würdiges Standarddeutsch. Die Wiederaufnahme »es … tun« ist natürlich und macht die im Griechischen elliptische zweite Bedingung klar, ohne den knappen Stil wesentlich zu belasten.
  terminology: Die Begriffswahl ist sachgerecht und nicht konfessionell vorentscheidend. Insbesondere wird βάπτισον mit »taufe« idiomatisch wiedergegeben; »fließendes Wasser« ist im vorliegenden praktischen Kontext gegenüber einer symbolisch aufgeladenen Deutung von »lebendigem Wasser« vorzuziehen.
