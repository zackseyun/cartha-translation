id: DID.7.2
reference: Didache 7:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ μὴ ἔχῃς ὕδωρ ζῶν, εἰς ἄλλο ὕδωρ βάπτισον· εἰ δʼ οὐ δύνασαι ἐν ψυχρῷ, ἐν θερμῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/002.yaml
  text: But if you do not have living water, baptize in other water; and if you cannot in cold, then in warm.
translation:
  language: de
  text: Wenn du aber kein fließendes Wasser hast, taufe in anderem Wasser; und wenn du es nicht in kaltem Wasser tun kannst, dann in warmem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδωρ ζῶν
  choice: fließendes Wasser
  rationale: Wörtlich »lebendes Wasser«; in dieser praktischen Taufanweisung bezeichnet die feste Wendung natürliches, fließendes Wasser. Die gewählte Formulierung gibt den gemeinten Wassertyp im heutigen Deutsch klar wieder.
- source_word: εἰς ἄλλο ὕδωρ βάπτισον
  choice: taufe in anderem Wasser
  rationale: Obwohl εἰς gewöhnlich »in/hinein« bedeutet, verlangt der deutsche Sprachgebrauch bei der Taufe und dem verwendeten Medium hier »in anderem Wasser«; »in anderes Wasser hinein« wäre unnötig räumlich zugespitzt.
- source_word: ἐν ψυχρῷ … ἐν θερμῷ
  choice: in kaltem Wasser … in warmem
  rationale: Die substantivierten Adjektive beziehen sich auf ὕδωρ. »Wasser« wird beim ersten Glied ergänzt, um die Ellipse im Deutschen verständlich zu machen, und beim zweiten natürlich ausgelassen.
theological_decisions:
- issue: Bedeutung von ὕδωρ ζῶν
  choice: fließendes Wasser
  alternative: lebendiges Wasser
  rationale: Der unmittelbare Kontext ordnet verschiedene Wasserarten für die Taufe nach Verfügbarkeit. Daher ist die gewöhnliche antike Bedeutung »fließendes Wasser« sachlich wahrscheinlicher als eine symbolische oder christologische Deutung.
- issue: Taufweise bei βάπτισον εἰς ἄλλο ὕδωρ
  choice: Keine bestimmte Taufweise ausdrücklich festgelegt
  alternative: tauche in anderes Wasser ein
  rationale: Der Satz nennt das zu verwendende Wasser, ohne für sich allein die Taufweise eindeutig festzulegen. Die neutrale Wiedergabe »taufe in« vermeidet eine konfessionelle Vorentscheidung.
translation_notes:
  register: Modernes, würdiges und allgemein verständliches Standarddeutsch. Die knappe Abfolge der Ausweichmöglichkeiten und der Gegensatz zwischen kaltem und warmem Wasser bleiben erhalten.
