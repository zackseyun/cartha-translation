  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Gegensatz von μέν/δέ sachgerecht wieder: Der Ankommende ist als παρόδιος ein nur vorübergehend Reisender, ihm soll nach Maßgabe der eigenen Möglichkeiten geholfen werden, und sein Aufenthalt ist auf zwei oder drei Tage beschränkt, sofern dies erforderlich ist. »doch« bildet δέ angemessen ab. Die Stellung der Bedingung »wenn es nötig ist« bewahrt die im Griechischen vorhandene syntaktische Zuordnung, ohne eine darüber hinausgehende Aufenthaltsdauer nahezulegen.'
